    ## 1. 分类问题


    分类问题解决的是目标对象属于哪个预定义的类。举个例子，判断一条评论是好评还是差评就是一个分类问题。


    分类，是数学建模中最常用的方法之一，分类一般分为二分类（二值问题）或者是多分类问题。


    2000 年全国大学生数学建模竞赛 A 题就是一个典型的分类问题，原题目如下。


    ### 2000 年 A 题 DNA 序列分类


    2000 年 6 月，人类基因组计划中 DNA 全序列草图完成，预计 2001 年可以完成精确的全序列图，此后人类将拥有一本记录着自身生老病死及遗传进化的全部信息的“天书”。这本大自然写成的“天书”是由
    4 个字符——A、T、C 和 G——按一定顺序排成的长约 30 亿字符的序列，其中没有“断句”也没有标点符号，除了这 4 个字符表示 4 种碱基以外，人们对它包含的“内容”知之甚少，难以读懂。破译这部世界上最巨量信息的“天书”是
    21 世纪人类最重要的任务之一。研究 DNA 全序列结构，以及这 4 个字符排成的看似随机的序列中隐藏着的规律，是解读这部天书的基础，是生物信息学（Bioinformatics）最重要的课题之一。


    虽然人类对这部“天书”知之甚少，但也发现了 DNA 序列中的一些规律性和结构。例如，在全序列中有一些用于编码蛋白质的序列片段，即由这 4 个字符组成的 64
    种不同的 3 字符串，其中大多数用于编码构成蛋白质的 20 种氨基酸。又例如，在不用于编码蛋白质的序列片段中，A 和 T 的含量特别多，于是以某些碱基特别丰富作为特征去研究
    DNA 序列的结构也取得了一些结果。此外，利用统计的方法还发现序列的某些片段之间具有相关性，等。


    这些发现让人们相信，DNA 序列中存在着局部的和全局性的结构，充分发掘序列的结构对理解 DNA 全序列是十分有意义的。目前，在这项研究中最普遍的思想是省略序列的某些细节，突出特征，然后将其表示成适当的数学对象。这种被称为粗粒化和模型化的方法，往往有助于研究规律性和结构。


    作为研究 DNA 序列的结构的尝试，提出以下对序列集合进行分类的问题。


    （1）下面有 20 个已知类别的人工制造的序列（见下页），其中序列标号 1～10 为 A 类，11～20 为 B 类。请从中提取特征，构造分类方法，并用这些已知类别的序列，衡量你的方法是否足够好。然后用你认为满意的方法，对另外
    20 个未标明类别的人工序列（标号 21～40）进行分类，用序号（按从小到大的顺序）标明结果的类别（无法分类的不写入）：


    A 类______；B 类______。


    请详细描述你的方法，给出计算程序。如果你使用了某些现成的分类方法，也要将方法名称准确注明。


    （2）在数据文件 Nat-model-data 中给出了 182 个自然 DNA 序列，它们都较长。用你的分类方法对它们进行分类，并给出分类结果。


    提示：衡量分类方法优劣的标准是分类的正确率。构造分类方法有许多途径，例如提取序列的某些特征，给出它们的数据表示：几何空间或向量空间的元素等，然后再选择或构造适合这种数学表示的分类方法；又例如构造概率统计模型，然后用统计方法分类。


    ## 2. 评价问题


    以 2005 年全国大学生数学建模竞赛 A 题《长江水质的评价和预测》为例，这是一个典型的评价问题，原题目如下。


    ### 2005 年 A 题 长江水质的评价和预测


    水是人类赖以生存的资源，保护水资源就是保护我们自己，对于我国大江大河水资源的保护和治理应是重中之重。专家们呼吁：“以人为本，建设文明和谐社会，改善人与自然的环境，减少污染。”


    长江是我国内第一、世界第三大河流，长江水质的污染程度日趋严重，已引起了相关政府部门和专家们的高度重视。2004 年 10 月，由全国政协与中国发展研究院联合组成“保护长江万里行”考察团，从长江上游宜宾到下游上海，对沿线
    21 个重点城市做了实地考察，揭示了一幅长江污染的真实画面，其污染程度让人触目惊心。为此，专家们提出“若不及早拯救，长江生态 10 年内将濒临崩溃”，并发出了“拿什么拯救癌变长江”的呼唤。


    附件 3 给出了长江沿线 17 个观测站（地区）近两年多主要水质指标的检测数据，以及干流上 7 个观测站近一年多的基本数据（站点距离、水流量和水流速）。通常认为一个观测站（地区）的水质污染主要来自于本地区的排污和上游的污水。一般说来，江河自身对污染物都有一定的自然净化能力，即污染物在水环境中通过物理降解、化学降解和生物降解等，使水中污染物的浓度降低。反映江河自然净化能力的指标被称为降解系数。事实上，长江干流的自然净化能力可以认为是近似均匀的，根据检测可知，主要污染物高锰酸盐指数和氨氮的降解系数通常介于
    0.1～0.5 之间，比如可以考虑取 0.2（单位：L/天）。附件 4 是“1995～2004 年长江流域水质报告”给出的主要统计数据。下面的附表是国标（GB3838-2002）给出的《地表水环境质量标准》中
    4 个主要项目标准限值，其中 I、II、III 类可饮用水。


    请你们研究下列问题。


    - （1）对长江近两年多的水质情况做出定量的综合评价，并分析各地区水质的污染状况。

    - （2）研究、分析长江干流近一年多主要污染物高锰酸盐指数和氨氮的污染源主要在哪些地区？

    （3）假如不采取更有效的治理措施，依照过去10年的主要统计数据，对长江未来水质污染的发展趋势做出预测分析，比如研究未来10年的情况。


    （4）根据你的预测分析，如果未来10年内每年都要求长江干流的IV类和V类水的比例控制在20%以内，且没有劣V类水，那么每年需要处理多少污水？


    （5）你对解决长江水质污染问题有什么切实可行的建议和意见。


    ## 3. 预测问题


    2006年全国大学生数学建模竞赛B题《艾滋病疗法的评价及疗效的预测》，这是一个典型的预测问题，原题目如下。


    ### 2006年 B题 艾滋病疗法的评价及疗效的预测


    艾滋病是当前人类社会最严重的瘟疫之一，从1981年发现以来的20多年间，它已经吞噬了近3000万人的生命。


    艾滋病的医学全名为“获得性免疫缺陷综合症”，英文简称 AIDS，它是由艾滋病毒（医学全名为“人体免疫缺陷病毒”，英文简称 HIV）引起的。这种病毒破坏人的免疫系统，使人体丧失抵抗各种疾病的能力，从而严重危害人的生命。人类免疫系统的
    CD4 细胞在抵御 HIV 的入侵中起着重要作用，当 CD4 被 HIV 感染而裂解时，其数量会急剧减少，HIV 将迅速增加，导致 AIDS 发作。


    艾滋病治疗的目的，是尽量减少人体内 HIV 的数量，同时产生更多的 CD4，至少要有效地降低 CD4 减少的速度，以提高人体免疫能力。


    迄今为止，人类还没有找到能根治 AIDS 的疗法，目前的一些 AIDS 疗法不仅对人体有副作用，而且成本也很高。许多国家和医疗组织都在积极试验、寻找更好的
    AIDS 疗法。


    现在得到了美国艾滋病医疗试验机构 ACTG 公布的两组数据。ACTG320（见附件1）是同时服用 zidovudine（齐多夫定）、lamivudine（拉美夫定）和
    indinavir（茚地那韦）3种药物的300多名病人每隔几周测试的 CD4 和 HIV 的浓度（每毫升血液里的数量）。193A（见附件2）是将1300多名病人随机地分为4组，每组按下述4种疗法中的一种服药，大约每隔8周测试的
    CD4 浓度（这组数据缺 HIV 浓度，它的测试成本很高）。4种疗法的日用药分别为：600mg zidovudine 或 400mg didanosine（去羟基苷），这两种药按月轮换使用；600
    mg zidovudine 加 2.25 mg zalcitabine（扎西他滨）；600 mg zidovudine 加 400 mg didanosine；600
    mg zidovudine 加 400 mg didanosine，再加 400 mg nevirapine（奈韦拉平）。


    请你完成以下问题。


    （1）利用附件1的数据，预测继续治疗的效果，或者确定最佳治疗终止时间（继续治疗指在测试终止后继续服药，如果认为继续服药效果不好，则可选择提前终止治疗）。


    （2）利用附件2的数据，评价4种疗法的优劣（仅以 CD4 为标准），并对较优的疗法预测继续治疗的效果，或者确定最佳治疗终止时间。


    （3）艾滋病药品的主要供货商对不发达国家提供的药品价格如下：600mg zidovudine 1.60美元，400mg didanosine 0.85美元，2.25
    mg zalcitabine 1.85美元，400 mg nevirapine 1.20美元。


    如果病人需要考虑4种疗法的费用，对（2）中的评价和预测（或者提前终止）有什么改变。


    ## 4. TSP 问题


    旅行商问题（Traveling Salesman Problem，TSP），是数学领域中的著名问题之一。2015全国研究生数学建模竞赛F题《旅游路线规划问题》就是一个典型的TSP问题，原题目如下。


    ### 2015年F题 旅游路线规划问题


    旅游活动正在成为全球经济发展的重 要动力之一，它加速国际资金流转和信息、技术管理的传播，创造高效率消费行为模式、需求和价值等。随着我国国民经济的快速发展，人们生活水平得到很大提升，越来越多的人积极参与有益于身心健康的旅游活动。


    附件1提供了国家旅游局公布的201个5A级景区名单，一位自驾游爱好者拟按此景区名单制定旅游计划。该旅游爱好者每年有不超过30天的外出旅游时间，每年外出旅游的次数不超过4次，每次旅游的时间不超过15天；基于个人旅游偏好确定了在每个5A级景区最少的游览时间（见附件1）。基于安全考虑，行车时间限定于每天7:00至19:00之间，每天开车时间不超过8小时；在每天的行程安排上，若安排全天游览则开车时间控制在3小时内，安排半天景点游览，开车时间控制在5小时内；在高速公路上的行车平均速度为90公里/小时，在普通公路上的行车平均速度为40公里/小时。该旅游爱好者计划在每一个省会城市至少停留24小时，以安排专门时间去游览城市特色建筑和体验当地风土人情（不安排景区浏览）。景区开放时间统一为8:00至18:00。请考虑下面问题。


    （1）在行车线路的设计上采用高速优先的策略，即先通过高速公路到达与景区邻近的城市，再自驾到景区。附件1给出了各景区到相邻城市的道路和行车时间参考信息，附件2给出了国家高速公路相关信息，附件3给出了若干省会城市之间高速公路路网相关信息。请设计合适的方法，建立数学模型，以该旅游爱好者的常住地在西安市为例，规划设计旅游线路，试确定游遍201个5A级景区至少需要几年？给出每一次旅游的具体行程（每一天的出发地、行车时间、行车里程、游览景区；若有必要，其他更详细表述请另列附件）。


    （2）随着各种旅游服务业的发展，出行方式还可以考虑乘坐高铁或飞机到达与景区相邻的省会城市，而后采用租车的方式自驾到景区游览（租车费用300元/天，油费和高速公路过路费另计，租车和还车需在同一城市）。此种出行方式可以节省一些路途时间用于景区游览或休闲娱乐，但这种出行方式也会给旅游者带来一些不便，有时费用也会增加。该旅游爱好者根据个人旅游偏好确定在每一个景区最长逗留时间不超过附件1给出的最少时间的2倍。附件4给出了若干城市之间的高铁票价和相关信息（约定：选择高铁出行要求当天乘坐高铁的时间不超过6个小时，乘坐高铁或飞机的当天至多安排半天的景区游览）；附件5给出了若干省会城市之间的机票全价价格信息（含机场建设费）。该旅游爱好者一家3人同行，综合考虑前述全程自驾、先乘坐高铁或飞机到达省会城市后再租车自驾到景区等出行方式（住宿费简化为省会城市和旅游景区200元/人·天，地级市150元/人·天，县城100元/人·天；高速公路的油耗加过路费平均为1元/公里，普通公路上油耗平均为0.6元/公里；附件1中给出了各景区所在地的...若景区位于某城市市区或近郊，则这类景区的市内交通费用已计入住宿费中，不再另计），建立数学模型设计一个十年游遍所有
    201 个 5A 景区、费用最优、旅游体验最好的旅游线路，给出每一次旅游的具体线路（含每次具体出行方式；每一天的出发地、费用、路途时间、游览景区、每个景区的游览时间）。


    （3）能否在第二问所建立的模型基础上加以推广，可以为全国的自驾游爱好者规划设计类似的旅游线路，进而给出常住地在北京市的自驾游爱好者的十年旅游计划；根据上述三问的结果给旅游爱好者和旅游有关部门提出建议。


    （4）自 2007 年 3 月 7 日至 2015 年 7 月 13 日，全国旅游景区质量等级评定委员会分 29 批共批准了 201 家景区为国家 5A 级旅游景区。附件
    6 是从国家旅游局官网上收集的国家 5A 级旅游景区评定的相关信息，附件 7 给出了国家旅游局官网上收集的国家 4A 级景区名单，请更为合理地规划该旅游爱好者的十年旅游计划。


    ## 5. 最优化问题


    以 2000 年全国大学生数学建模竞赛 B 题《钢管订购和运输》为例，这是一个典型的最优化问题，原题目如下。


    ### 2000 年 B 题 钢管订购和运输


    要铺设一条 A1→A2→…→A5 的输送天然气的干主管道，如图 1-7 所示。经筛选后可以生产这种主管道钢管的钢厂有 S1,S2,…,S7。图中粗线表示铁路，单细线表示公路，双细线表示要铺设的管道（假设沿管道或者原来有公路，或者新建有施工公路），圆圈表示火车站，每段铁路、公路和管道旁的阿拉伯数字表示里程（单位为
    km）。


    为方便计算，1km 主管道钢管称为 1 单位钢管。


    一个钢厂如果承担制造这种钢管，至少需要生产 500 个单位。钢厂 Si 在指定期限内能生产该钢管的最大数量为 Si 个单位，钢管出厂销价 1 单位钢管为 pi
    万元，如表 1-2 所示。


    表 1-2 《钢管订购和运输》题目原表


    | i | 1 | 2 | 3 | 4 | 5 | 6 | 7 |

    |---|---|---|---|---|---|---|---|

    | S_i | 800 | 800 | 1000 | 2000 | 2000 | 2000 | 3000 |

    | p_i | 160 | 155 | 155 | 160 | 155 | 150 | 160 |


    1000km 以上每增加 1km 至 100km 运价增加 5 万元。


    公路运输费用为 1 单位钢管每公里 0.1 万元（不足整公里部分按整公里计算）。


