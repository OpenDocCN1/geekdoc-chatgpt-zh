    # 14.2 TensorFlow 数据结构


    张量 Tensor 表示是从向量空间到实数域的多重线性映射（Multilinear Maps）。一般可以把 TensorFlow 的 Tensor 看作一个
    n 维的数组或列表，一个 Tensor 包含一个静态类型 rank（阶）和一个 shape（形状）。


    # 14.2.1 阶


    在 TensorFlow 系统中，张量的维数被描述为阶，但是张量的阶和矩阵的阶并不是同一个概念。张量的阶是张量维数的一个数量描述，下面的张量 t（使用 Python
    中 list 定义）就是 2 阶。


    ```

    t = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]

    ```


    可以认为一个 2 阶张量就是我们平常所说的矩阵，一阶张量可以认为是一个向量。对于一个 2 阶张量，可以使用语句 t[i,j] 来访问其中的任何元素，而对于
    3 阶张量，可以通过 t[i,j,k] 来访问任何元素，具体方法见表 14-1。


    表 14-1 Rank（阶）

    | 阶 | 数学实例 | Python 例子 |

    |---|---|---|

    | 0 | 纯量（只有大小） | s = 483 |

    | 1 | 向量（大小和方向） | v = [1.1, 2.2, 3.3] |

    | 2 | 矩阵（数据表） | m = [[1, 2, 3], [4, 5, 6], [7, 8, 9]] |

    | 3 | 3 阶张量（数据立体） | t = [[[2], [4], [6]], [[8], [10], [12]], [[14], [16], [18]]]
    |

    | n | n 阶 | …… |


    # 14.2.2 形状


