    \n以上就是统计学上最初出现“回归”时的含义，高尔顿把这一现象叫做“向平均数方向的\n\n① 高尔顿（Francis Galton，1822—1911），他的父亲绥缪尔·特修斯·高尔顿（Samuel\
    \ Tertius Galton，1809—1874）是一位著名的银行家；他的外祖父伊拉兹马斯·达尔文（Erasmus Darwin，1731—1802）是英国著名的医学家、动植物学家、诗人和哲学家。英国生物学家、进化论的奠基人《物种起源》的作者查尔斯·罗伯特·达尔文（Charles\
    \ Robert Darwin，1809—1882）是他的表哥。\n\n回归”（regression toward mediocrity）。虽然这是一种特殊情况，与线性关系拟合的一般规则无关，但“线性回归”的术语却因此沿用下来，作为根据一种变量（父亲身高）预测另一种变量（子女身高）或多种变量关系的描述方法。之后，回归分析的思想渗透到了数理统计的其他分支。随着计算机的发展以及各种统计软件包的出现，回归分析的应用越来越广泛。\n\
    \n### 9.1.2 回归与相关\n\n客观事物在发展过程中是彼此联系、相互影响的，在数据挖掘的过程中常常要研究两个或者两个以上的变量之间的关系，各种变量间的关系大致可以分为完全确定关系（函数关系）和非确定性关系。\n\
    \n(1) 完全确定关系：y = f(x) 可以用精确的数学表达式来表示，即当变量 x 的取值确定后，y 有唯一的确定的值与之对应，如圆形的面积（A）与半径（r）之间的关系为\
    \ A = πr²。\n\n(2) 非确定关系：y = f(x)+ε 不能用精确的数学公式来表示，当变量 x 的取值确定后，y 有若干种可能取的值，如父代身高与子代身高之间、房价与人口密度之间，等等。这些变量间都存在着十分密切的关系，但是不能通过一个或者几个变量的值来精准地计算出另外一个变量的值。统计学中把这些变量间的关系称为相关关系，把存在相关关系的变量称为相关变量。\n\
    \n在一定的范围内，对一个变量的任意数值（x_i），虽然没有另一个变量的确定数值（y_i）与之对应，但是却有一个特定 y_i 条件概率分布与之对应，这种变量的不确定关系，称为相关关系。通常，相关变量间的关系一般分为因果关系和平行关系。\n\
    \n(1) 因果关系：一个变量的变化受另一个或几个变量的影响，如玉米的生长速度受种子的遗传特性、管理条件等影响。统计学上采用回归分析方法来研究呈因果关系的变量之间关系。表示原因的变量成为自变量，表示结果的变量成为因变量。\n\
    \n(2) 平行关系：变量之间互为因果或共同受另外的因素影响，如人的身高和胸围。统计学上采用相关分析※来研究呈平行关系的变量之间的关系。\n\n### 9.1.3\
    \ 回归模型的划分与应用\n\n### 1. 回归模型的划分\n\n回归问题分为模型学习和预测两个过程。即先基于给定的训练数据集构建一个模型，再根据新的输入数据预测相应的输出。\n\
    \n回归问题按照输入变量的个数可以分为一元回归和多元回归，按照输入变量和输出变量之间关系的类型，可以分为线性回归和非线性回归。\n\n### 2. 回归模型的应用\n\
    \n如图 9-1 所示。\n\n① 对多个变量进行相关分析时，研究一个变量与多个变量间的线性相关称为复相关分析；研究其余变量保持不变的情况下两个变量间的线性相关称为偏相关分析。本章主要介绍回归分析，更多相关分析请读者自行查阅相关文献。\n\
    \n![](img/b804a95e802d3360c99b6f8e75c7d047_176_0.png)\n\n### 9.2 线性回归分析实战\n\n\
    ### 9.2.1 线性回归的建立与求解\n\n首先来看一个工作年限与年收入的例子。\n\n工作年限是指职工以工资收入为全部或主要来源的工作时间。工作年限的长短标志着职工参加工作时间的长短，也反映了他对社会和企业的贡献大小以及知识、经验、技术熟练程度的高低。有5年工作经验的员工，往往要比只有两年工作经验的员工业务精通度、技术熟练度更高，所以工资也更高。\n\
