    \n▲图 4-7 例 4-15.2 程序运行结果\n\n### 4.3.3 SciPy 图像处理案例\n\n图像识别是计算机对图像进行处理、分析和理解的过程，以识别各种不同模式的目标和对象的技术。识别过程包括图像预处理、图像分割、特征提取和判断匹配。简单来说，图像识别就是要让计算机像人一样读懂图片的内容。借助图像识别技术，我们不仅可以通过图片搜索更快地获取信息，还可以产生一种新的与外部世界交互的方式，甚至会让外部世界更加智能地运行。\n\
    \n![](img/b804a95e802d3360c99b6f8e75c7d047_117_1.png)\n\n▲图 4-8 图像处理原理\n\nSciPy\
    \ 可对图像实现基本操作，如裁剪、翻转、旋转、图像滤镜等，使用整个 NumPy 机理把图像处理成数组，如图 4-8 所示。\n\n### 【例 4-16】SciPy\
    \ 图像处理，程序运行结果如图 4-9 所示\n\n输入：\n\n```python\n#滤镜\nfrom scipy import misc\nface\
    \ = misc.ascent()\n#对数组进行截取\nface = face[:512, -512:]\nimport numpy as np\n#增加噪声\n\
    noisy_face = np.copy(face).astype(np.float)\nnoisy_face += face.std() * 0.5 *\
    \ np.random.standard_normal(\nface.shape)\n#不同参数的噪声图\nfrom scipy import ndimage\n\
    blurred_face = ndimage.gaussian_filter(noisy_face, sigma=3)\nmedian_face = ndimage.median_filter(noisy_face,\
    \ size=5)\nfrom scipy import signal\nwiener_face = signal.wiener(noisy_face, (5,\
    \ 5))\n#绘图\nimport matplotlib.pyplot as plt\nplt.figure(figsize=(12, 3.5))\nplt.subplot(141)\n\
    plt.imshow(noisy_face, cmap=plt.cm.gray)\nplt.axis('off')\nplt.title('noisy')\n\
    \nplt.subplot(142)\nplt.imshow(blurred_face, cmap=plt.cm.gray)\nplt.axis('off')\n\
    plt.title('Gaussian filter')\n\nplt.subplot(143)\nplt.imshow(median_face, cmap=plt.cm.gray)\n\
    plt.axis('off')\nplt.title('median filter')\n\nplt.subplot(144)\nplt.imshow(wiener_face,\
    \ cmap=plt.cm.gray)\nplt.title('Wiener filter')\nplt.axis('off')\nplt.subplots_adjust(wspace=.05,\
    \ left=.01, bottom=.01, right=.99, top=.99)\nplt.show()\n```\n\n输出：\n在例 4-16 中，将图片以像素点的形式构成数组（矩阵），之后利用数组的切割进行处理，接着采用\
