    ```\n\n通过观察例 5-2 的输出结果可以看出，我们已经获取了数据。例子中并没有采用复杂的爬虫框架去提取数据，如果想要获得更多的数据，则应针对更加复杂的爬虫场景，完善代码。\n\
    \n## 5.3 爬虫进阶——高效率爬虫\n\n如果你有一定的网络基础和 Python 编程基础，那么很快就可以完成一个简单的爬虫任务。在大数据时代，数据量往往远超我们的预期。比如，通过百度地图爬取北京市朝阳区朝外街道附近的饭店信息，这是比较容易的任务；但是如果要爬取全国的饭店信息，请求的网页可能高达百万甚至千万或者更多，那么就需要考虑使用高效率的爬虫来完成任务。本章将列举一些高效率爬虫的解决方案。\n\
    \n## 5.3.1 多进程\n\nPython 提供了非常好用的多进程包 multiprocessing，只需要定义一个函数，Python 会完成其他所有事情。借助这个包，可以轻松完成从单进程到并发执行的转换。multiprocessing\
    \ 支持子进程、通信和共享数据、执行不同形式的同步，提供了 Process、Queue、Pipe、Lock 等组件。\n\nmultiprocessing\
    \ 下 Process 类的构造方法的具体形式为：\n\n```\nclass Process(object):\n    def __init__(self,\
    \ group=None, target=None, name=None, args=(), kwargs={})\n```\n\n- group: 进程组，不常用。\n\
    - target: 表示调用对象，传入要执行的方法。\n- args: 表示调用对象的位置参数元组。\n- name: 进程别名。\n- kwargs: 表示调用对象的字典。\n\
    \n其常用方法见表 5-1。\n\n## 表 5-1 常用方法表\n\n| 方法 | 说明 |\n|---|---|\n| start() | 进程准备就绪，等待\
    \ CPU 调度 |\n| setName() | 为进程设置名称 |\n| getName() | 获取进程名称 |\n| setDaemon(True)\
    \ | 设置为守护进程 |\n| join() | 逐个执行每个进程，执行完毕后继续往下执行 |\n| run() | 进程被 CPU 调度后自动执行进程对象的\
    \ run 方法，如果想自定义进程类，直接重写 run 方法即可 |\n\n## 【例 5-3】 开启进程\n\n```\n```python\ndef run(name):\n\
    \    #获取当前进程的名字\n    tname = multiprocessing.current_process().name\n    print(\"\
    {} is starting,worker is {}\".format(tname,name))\n    return\n\nif __name__ ==\
    \ '__main__':\n    numList = []\n    for i in range(5):\n        p = multiprocessing.Process(target=run,\
    \ args=(i,))\n        numList.append(p)\n        p.start()\n        p.join()\n\
    ```\n```\n\n## 5.3.2 多线程\n\n网络爬虫需要下载规模非常庞大的网页，爬虫程序向服务器提交请求后要等待服务器的处理和返回结果。如果采用单线程，每个线程依次发送请求并等待服务器的依次响应，等待时间是所有网页处理过程的叠加，效率大大降低。因此，可采用多线程机制来减少个别网页的处理时间，以提高程序的效率。\n\
    \n和多进程的思路类似，多进程和多线程都可以执行多个任务，线程是进程的一部分，其特点是线程之间可以共享内存和变量，资源消耗少，缺点是线程之间的同步和加锁比较麻烦。在\
    \ Python 中，使用 threading 包创建多线程，构造方法如下：\n\n```\nThread(group=None, target=None,\
    \ name=None, args=(), kwargs={})\n```\n\n- group: 线程组，不常用。\n- target: 表示调用对象，传入要执行的方法。\n\
    - name: 线程别名。\n- args/kwargs: 要传入方法 的参数。\n"
