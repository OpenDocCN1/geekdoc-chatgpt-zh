    # 第8章 自然语言处理


    ![](img/b804a95e802d3360c99b6f8e75c7d047_154_0.png)


    什么是自然语言处理？


    自然语言处理 (Natural Language Processing, NLP) 是研究人与计算机之间用自然语言进行有效通信的理论和方法，是集语言学、计算机科学、数学等为一体的一门学科。它是计算机科学领域与人工智能领域中的一个重要方向。


    # 8.1 Jieba 分词基础


    # 8.1.1 Jieba 中文分词


    # 1. 中文分词技术


    目前，对于中文分词的主要研究成果分为以下几种：正向最大匹配法、反向最大匹配法、分词与词性标注一体化方法、最佳匹配法、专家系统方法、最少分词词频选择方法和神经网络方法等。Jieba
    分词主要涉及的算法如下。


    +   - (1) 基于前缀词典实现高效的词图扫描，生成句子中汉字所有可能的成词情况所构成的有向无环图（Directed Acyclic Graph，DAG）。

    +   - (2) 采用了动态规划查找最大概率路径，找出基于词频的最大切分组合。

    +   - (3) 对于未登录词，采用了基于汉字成词能力的 HMM 模型，使用了 Viterbi 算法。


    中文分词技术是中文信息处理的基础，有着极其广泛的实际应用：汉语语音理解、机器翻译、语音合成、自动分类、自动摘要、数据挖掘和搜索引擎等，都需要对中文信息进行分词处理。因此，一个中文分词算法的好坏，会对其后续的应用产生极大的影响。


    # 2. 常用分词模块


    中文分词与英文分词有很大的不同，对英文而言，一个单词就是一个词，而汉语以字为基本书写单位，词语之间没有明显的区分标记，需要人为切分。现在开源的中文分词工具有
    SnowNLP、THULAC、Jieba 和 HanLP 等，都还在不断更新和维护过程中，本书将以 Python'
