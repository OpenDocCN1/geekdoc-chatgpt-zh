    \ 1.9, 38) (b'Arthur', 1.8, 41)]\n```\n```\n\n### (2) numpy.argsort 排序\n\n对数组\
    \ a 排序，返回一个排序后索引，a 不变，使用 numpy.argsort，见例 3-40。\n\n【例 3-40】numpy.argsort 排序\n\n\
    输入：\n\n```\n```python\nx=np.array([3,1,2])\nprint(np.argsort(x))\ny=np.array([[0,3],[2,2]])\n\
    print(np.argsort(y,axis=0))\nprint(np.argsort(y,axis=1))\n#Sorting with keys\n\
    z = np.array([(1, 0), (0, 1)], dtype=[('x', '<i4'), ('y', '<i4')])\nprint(np.argsort(z,\
    \ order=('x','y')))\nprint(np.argsort(z, order=('y','x')))\n```\n```\n\n输出：\n\n\
    ```\n```\n[1 2 0]\n```\n\n```\n[[0 1]\n[1 0]]\n\n[[0 1]\n[0 1]]\n\n[1 0]\n\n[0\
    \ 1]\n```\n\n### （3）numpy.lexsort 排序\n\nlexsort 支持对数组按指定行或列的顺序排序，是间接排序。lexsort\
    \ 不修改原数组，返回数组索引。对应 lexsort 一维数组是 argsort，argsort 也不修改原数组，返回数组索引。默认按最后一行元素有小到大排序，返回最后一行元素排序后索引所在位置。\n\
    \n【例 3-41】numpy.lexsort 排序\n\n输入：\n\n```\n#Sort two columns of numbers\na = [1,5,1,4,3,4,4]\
    \ # First column\nb = [9,4,0,4,0,2,1] # Second column\nind = np.lexsort((b,a))\
    \ # Sort by a, then by b\nprint(ind)\nprint([(a[i],b[i]) for i in ind])\nprint([(a[i],b[i])\
    \ for i in np.argsort(a)])\n```\n\n输出：\n\n```\n[2 0 4 6 5 3 1]\n\n[(1, 0), (1,\
    \ 9), (3, 0), (4, 1), (4, 2), (4, 4), (5, 4)]\n\n[(1, 9), (1, 0), (3, 0), (4,\
    \ 4), (4, 2), (4, 1), (5, 4)]\n```\n\n输入：\n\n```\na=np.array([[ 2, 7, 4, 2],\n\
    \            [35, 9, 1, 5],\n            [22, 12, 3, 2]])\n#按最后一列顺序排序\nprint(a[np.lexsort(a.T)])\n\
    #按最后一列逆序排序\nprint(a[np.lexsort(-a.T)])\n#按第一列顺序排序\nprint(a[np.lexsort(a[:,::-1].T)])\n\
    #按最后一行顺序排序\nprint(a.T[np.lexsort(a)].T)\n#按第一行顺序排序\nprint(a.T[np.lexsort(a[::-1,:])].T)\n\
    ```\n\n输出：\n\n```\n[[22 12  3  2]\n [ 2  7  4  2]\n [35  9  1  5]]\n\n[[35  9\
