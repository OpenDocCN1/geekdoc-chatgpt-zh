    \n```\nfrom functools import reduce\nf = lambda a,b:a if(a> b) else b\nprint(reduce(f,[47,11,42,102,13]))\n\
    ```\n\n输出： 102\n\n## 第 3 章 Python 科学计算库 NumPy\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_59_0.png)\n\
    \n为什么要先学习 NumPy？\nNumPy 是一个开源的 Python 科学计算库，它是 Python 科学计算库的基础库，许多其他著名的科学计算库如\
    \ Pandas、Scikit-learn 等，都要用到 NumPy 库的一些功能。\n\n## 3.1 NumPy 简介与安装\n\n### 3.1.1\
    \ NumPy 简介\n\nNumPy 是 Python 用于快速处理大型矩阵的科学计算库，NumPy 允许你在 Python 中做向量和矩阵的运算，而且很多底层函数都是用\
    \ C 语言写的，将获得在普通 Python 中无法达到的运行速度。由于矩阵中每个元素的数据类型都是一样的，这也就减少了运算过程中的类型检测。\n\n本书中示例所使用的是\
    \ NumPy 1.13.1 版本。\n\n### 【例 3-1】查看 NumPy 版本\n\n输入：\n\n```\nimport numpy\nprint(numpy.__version__)\n\
    ```\n\n输出：\n\n```\n1.13.1\n```\n\n### 3.1.2 NumPy 安装\n\n> 小贴士：\n> 什么是科学计算？\n>\
    \ 科学计算是一个与定量分析、数学模型构建以及利用计算机来分析和解决科学问题相关的研究领域。\n\nNumPy 是基于 Python 的，因此在安装 NumPy\
