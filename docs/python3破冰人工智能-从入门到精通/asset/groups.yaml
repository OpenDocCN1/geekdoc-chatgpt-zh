    中的 Jieba 分词包为例进行阐述。


    Jieba 分词，也被称为“结巴”分词，同时支持繁体中文分词，而且存在众多编程语言版本，如 Java 版本、C++版本、R 版本、PHP 版本和 Go 版本等。


    # 8.1.2 Jieba 分词的 3 种模式


    Jieba 分词支持 3 种模式分词，分别为：精准模式、全模式及搜索引擎模式。


    # 1. 精准模式


    将句子精确地切开，适合文本分析。jieba.cut 实现分词，通过布尔型参数 cut_all 确定分词模型，如果为 False，则为精准模式。


    # 2. 全模式


    把句子中所有的可以成词的词语都扫描出来，速度非常快，但是不能解决歧义。jieba.cut 实现分词，通过布尔型参数 cut_all 确定分词模型，如果为 True，则为全模式。


    # 3. 搜索引擎模式


    在精准模式的基础上，对长词再次切分，提高召回率，适用于搜索引擎分词。jieba.cut_for_search 实现搜索引擎模式。


    下面通过例 8-1 对上述 3 种模式进行说明。


    # 【例 8-1】Jieba 分词的 3 种模式示例


    输入：


    ```

    import jieba

    #全模式 cut_all=True

    text="野生动物园有很多凶猛的动物"

    str_quan1=jieba.cut(text, cut_all=True)

    print("|".join(str_quan1))

    ```


    输出：


    野生|野生动物|生动|动物|动物园|有|很多|凶猛|的|动物


    输入：


    ```

    #精准模式

    str_jing1=jieba.cut(text, cut_all=False)

    print("|".join(str_jing1))

    ```


    输出：


    野生|动物园|有|很多|凶猛|的|动物'
