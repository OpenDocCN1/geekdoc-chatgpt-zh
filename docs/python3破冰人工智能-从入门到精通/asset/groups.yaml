  md: "\n关键词抽取的任务就是从一段给定的文本中自动抽取出若干有意义的词语或词组。TextRank 算法是利用局部词汇之间关系（共现窗口）对后续关键词进行排序，直接从文本本身抽取，其主要步骤如下。\n\
    \n- 1. 把给定的文本 T 按照完整句子进行分割，即 T = [S1, S2, …, Sm]。\n- 2. 对于每个句子 Si ∈ T，进行分词和词性标注处理，并过滤掉停用词，只保留指定词性的单词\
    \ Si = [ti,1, ti,2, …, ti,n]，如名词、动词、形容词，即其中 ti,j ∈ Sj 是保留后的候选关键词。\n- 3. 构建候选关键词图\
    \ G = (V, E)，其中 V 为节点集，由步骤 2 生成的候选关键词组成，然后采用共现关系（co-occurrence）构造任意两点之间的边，两个节点之间存在边仅当它们对应的词汇在长度为\
    \ K 的窗口中时共现。K 表示窗口大小，即最多共现 K 个单词。\n- 4. 根据原理中的衡量重要性的权重公式，初始化各节点的权重，然后迭代计算各节点的权重，直至收敛。\n\
    - 5. 对节点权重进行倒序排序，从而得到最重要的 T 个单词作为候选关键词。\n- 6. 由步骤 5 得到最重要的 T 个单词，在原始文本中进行标记，若形成相邻词组，则组合成多词关键词。例如，文本中有句子“Matlab\
    \ code for plotting ambiguity function”，如果“Matlab”和“code”均属于候选关键词，则组合成“Matlab\
    \ code”加入关键词序列。\n\n小贴士：\n以 PageRank 为基础的算法不仅有在文本中起着重要作用的 TextRank，还有在推荐算法中起着重要作用的\
    \ PersonalRank 算法，有兴趣的读者可以整体浏览并学习这 3 个算法，效果更佳。\n\n## 2. 基于 TextRank 关键词抽取\n\n\
    下面基于 TextRank 算法抽取关键词。首先我们来观察一下基于 Jieba 分词的关键词抽取参数。\n\n```\njieba.analyse.textrank(sentence,\
    \ topK=20, withWeight=False, allowPOS=('ns', 'n', 'vn', 'v'))\n```\n\n- sentence:\
    \ 待提取的文本。\n- topK: 返回关键词个数，默认值为 20。\n- withWeight: 关键词权重值，默认值为 False。\n- allowPOS:\
    \ 指定词性，默认值为空，即不筛选。\n\n## 【例 8-5】基于 TextRank 算法的关键词抽取\n\n输入：\n\n```\nkeywords1=jieba.analyse.textrank(text)\n\
    print(keywords1)\n```\n\n输出：\n\n```\n['发展', '人工智能', '中国', '产业', '宣布', '作为', '驱动力',\
    \ '有望', '成为', '引领', '全球', '变革', '争相', '支持', '核心', '出台', '倾心', '科技', '国家', '政策']\n\
    ```\n\n输入：\n\n```\nkeywords2=jieba.analyse.textrank(text, topK=5)\nprint(keywords2)\n\
    ```\n\n输出：\n\n```\n['发展', '人工智能', '中国', '产业', '宣布']\n```\n\n从结果来看，调整输出关键词的个数依然可以得出这段文字的价值导向，即人工智能发展。但是值得注意的是，TextRank\
    \ 将“中国”这个词提取出来，对比 TF-IDF 结果，“中国”的排名明显靠前，原因是 TextRank 算法提取是依据词语之间的贡献关系来构建图，计算图中节点的\
    \ Rank，而 TF-IDF 算法跟 Jieba 分词一样，首先自己有一个默认词库，内含相应的词语与词频，更多的是依据 dict.txt 来计算词频与逆向词频权重。“中国”是频繁出现的词，因此排名靠后。\n\
    \n## 8.3 word2vec 介绍\n\n2013 年，Google 团队发布了 word2vec，它的特点是将所有的词向量量化（word embedding）。word2vec\
    \ 工具主要包含两个模型——跳字模型（skip-gram）和连续词袋模型（CBOW①），以及两种高效的训练方法——负采样（negative sampling）与层序\
    \ softmax（hierarchical softmax）。在本章中，我们将介绍词向量以及相应的语言模型，做到“知其然，亦知其所以然”。\n\n## 8.3.1\
    \ word2vec 基础原理简介\n\n- 1. 词向量\n\n词向量，顾名思义，就是用一个向量的形式表示一个词。为什么这么做？机器学习任务需要把任何输入量化成数值表示，然后充分利用计算机的计算能力，得出最终想要的结果。\n\
    \nNLP 中最直观，也是到目前为止常用的词表示方法是 One-hot Representation，这种方法把每个词表示为一个很长的向量。首先，统计出语料中的所有词汇，然后对每个词汇编号，针对每个词建立\
    \ V 维的向量，向量的每个维度表示一个词，因此对应编号位置上的维度数值为 1，其他维度全为 0。\n\n下面通过一个例子进行介绍。例如，“话筒”与“麦克”这两个词，它们的词向量分别表示如下。“话筒”表示为\
    \ [0001000000000000...]“麦克”表示为 [0000000010000000...]\n\n① CBOW 是 Continuous Bag-of-Words\
    \ Model 的缩写，是一种与前向 NNLM 类似的模型，不同之处在于 CBOW 去掉了最耗时的非线性隐藏层且所有词共享隐藏层。\n\n如果采用稀疏方式存储这种\
    \ One-hot Representation，将会非常简洁：也就是给每个词分配一个数字 ID。可以这样理解，每个词都是茫茫“0”海中的一个“1”，如在刚才的例子中，话筒记为\
    \ 3，麦克记为 8（索引从 0 开始记）。\n\n如果要编程实现，那么用散列（Hash）表给每个词分配一个编号就可以了。这样简洁的表示方法再配合最大熵、SVM\
    \ 和 CRF 等算法，已经可以很好地完成 NLP 领域的各种常见任务。但是，它也存在下列一些问题。\n\n- (1) 维度灾难：维度很大。当词汇较多时，可能达到百万维，造成维度灾难。\n\
    - (2) 词汇鸿沟：任意两个词之间都是孤立的。仅从这两个向量中看不出两个词是否有关系，哪怕是话筒和麦克这样的同义词也不例外。\n\n深度学习中一般用到的词向量并不是刚才所提及的\
    \ One-hot Representation 表示的那种很长的词向量，而是用 Distributed Representation。Distributed\
    \ Representation 最早是 Hinton 在 1986 年的论文 Learning distributed representations of\
    \ concepts 中提出的。就是用一种能够刻画语义之间的相似度并且维度较低的稠密向量表示词向量。这种向量将词表示为 [0.793, −0.177, −0.107,\
    \ 0.109, 0.542, …]的矩阵，通常该矩阵设置为 50 维或 100 维，通过计算向量之间的距离，来体现词与词之间的相似性，解决词汇鸿沟的问题。\n\
    \nDistributed Representation 最大的贡献就是让相关或者相似的词在距离上更接近了。向量的距离可以用最传统的欧氏距离来衡量，也可以余弦相似度来衡量。用这种方式表示的向量，“麦克”和“话筒”的距离会远远小于“麦克”和“天气”，可能在理想情况下“麦克”和“话筒”的表示是完全一样的。但是由于有些人会把英文名“迈克”也写成“麦克”，导致“麦克”一词带上了一些人名的语义，因此不会和“话筒”完全一致。\n\
    \n### 2. 哈夫曼编码\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_165_0.png)\n\n哈夫曼编码（Huffman\
    \ Coding），又称霍夫曼编码，是一种编码方式。哈夫曼编码是可变字长编码（VLC）的一种。Huffman 于 1952 年提出一种编码方法，该方法完全依据字符出现概率来构造异字头的平均长度最短的码字，有时也称为最佳编码。\n\
    \n下面通过一个例子来进行介绍。假设一个文本文件中只包含 7 个字符{A, B, C, D, E, F, G}，这 7 个字符在文本中出现的次数依次为{5,\
    \ 24, 7, 17, 34, 5, 13}，利用哈夫曼树可以为文件构造出符合前缀编码要求的不等长编码，如图 8-2 所示。具体做法如下：\n\n- (1)\
    \ 将文件中的 7 个字符都作为叶子节点，每个字符出现次数作为该叶子节点的权值；\n- (2) 规定哈夫曼树中所有左分支表示字符 0，所有右分支表示字符 1，将依次从根节点到每个叶子节点所经过的分支的二进制位的序列作为该节点对应的字符编码；\n\
    - (3) 由于从根节点到任何一个叶子节点都不能经过其他叶子，这种编码一定是前缀编码，哈夫曼树的带权路径长度正好是文件编码的总长度。\n\n哈夫曼编码是一种无前缀编码，解码时不会混淆，主要应用在数据压缩、加密解密等场合。\n\
    \n![](img/b804a95e802d3360c99b6f8e75c7d047_166_0.png)\n\n▲ 图 8-2 哈夫曼树\n\n那么哈夫曼树有什么好处呢？在得到哈夫曼树后，一般会对叶子节点进行哈夫曼编码，由于权重高的叶子节点靠近根节点，而权重低的叶子节点会远离根节点，因此高权重节点编码值较短，而低权重节点编码值较长。这就保证树的带权路径最短，也符合信息论，即我们希望越常用的词拥有更短的编码。\n\
    \n在 word2vec 中，约定编码方式和上面的例子相反，即约定左子树编码为 1，右子树编码为 0，同时约定左子树的权重不小于右子树的权重。\n\n###\
    \ 3. 统计语言模型\n\n传统的统计语言模型是表示语言基本单位（一般为句子）的概率分布函数，这个概率分布也就是该语言的生成模型。一般语言模型可以使用各个词语条件概率的形式表示。\n\
    \n给定一个由 n 个词语按顺序组成的句子 S = p(w1,w2,...,wn)，则概率 p(s) 即为统计语言模型。\n\n通过贝叶斯公式，可以将概率\
    \ p(s) 进行分解：\n\nw_T^t = w1, w2, ..., w_T 表示长度为 T 的词串。\nP(w1^t) = P(w1, w2, ...,\
    \ w_T) = P(w1)P(w2|w1)P(w3|w1,w2)...P(w_T|w1,w2,...,w_{T-1})\n其中， P(w_T|w1,w2,...,w_{T-1})\
    \ = count(w1,w2,...,w_{T-1},w_T) / count(w1,w2,...,w_{T-1})\n p(s) = p(w1)p(w2|w1)p(w3|w1^2)...p(w_n|w1^{n-1})\n\
    \n因此，要计算一个句子出现的概率，只需要计算出在给定上下文的情况下，下一个词为某个词的概率即可，即 p(w_i|context(w_i))。当所有条件概率\
    \ p(w_i|context(w_i)) 都计算出来后，通过连乘即可计算出 p(s)。因此，统计语言模型的关键问题在于找到计算概率 p(w_i|context(w_i))\
    \ 的模型。\n\n下面通过一个例子来进行介绍。\n将“大家喜欢吃苹果”这句话进行分词，得到结果“大家”“喜欢”“吃”\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_166_1.png)\n\
    \n和“苹果”。下面判断这句话是否为一个常规的自然语言。\n\nP(大家，喜欢，吃，苹果)=p(大家)p(喜欢|大家)p(吃|大家，喜欢)p(苹果|大家，喜欢，吃)\n\
    \n- p(大家)表示“大家”这个词在语料库里面出现的概率。\n- p(喜欢|大家)表示“喜欢”这个词出现在“大家”后面的概率。\n- p(吃|大家，喜欢)表示“吃”这个词出现在“大家喜欢”后面的概率。\n\
    - p(苹果|大家，喜欢，吃)表示“苹果”这个词出现在“大家喜欢吃”后面的概率。\n\n把这些概率进行连乘，得到的就是这句话平时出现的概率。\n\n如果这个概率特别低，说明这句话不常出现，那么就不算是一句自然语言，原因是在语料库里面很少出现。如果出现概率高，就说明这是一句自然语言。\n\
    \n## 8.3.2 word2vec 训练模型\n\n### 1. CBOW 与 Skip_gram 模型\n\nword2vec 是 Mikolov 等人所提出模型的一个实现，可以用来快速有效地训练词向量。目前，word2vec\
    \ 包含了两种训练模型，分别是 CBOW 和 Skip_gram，如图 8-3 所示。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_167_0.png)\n\
    \n▲图 8-3 CBOW 与 Skip-gram\n\n从图 8-3 可以看出，CBOW 和 Skip_gram 模型均包含输入层、投影层和输出层。其中，CBOW\
    \ 模型通过上下文来预测当前词，Skip_gram 模型则通过当前词来预测其上下文。word2vec 提供了具体学习过程中会用到的两个降低复杂度的近似方法，分别是\
    \ Hierarchical Softmax 和 Negative Sampling。将训练模型和优化方法进行组合，可得到 4 种训练词向量的框架，见表 8-3。\n\
    \n表 8-3 模型与优化方法\n\n|  | CBOW | Skip_gram |\n|---|---|---|\n| Hierarchical Softmax\
    \ | CBOW+HS | Skip_gram+HS |\n| Negative Sampling | CBOW+NS | Skip_gram+NS |\n\
    \n### 2. 训练框架\n\n通过训练模型和优化方法组合成了 4 个训练词向量的框架，为了更好地理解训练形式，通过图 8-4 所示的形式进行说明。\n\n\
    ![](img/b804a95e802d3360c99b6f8e75c7d047_168_0.png)\n\n▲ 图 8-4 CBOW 与 Skip-gram\
    \ 训练框架\n\n## 8.3.3 基于 gensim 的 word2vec 实战\n\n### 1. 安装 gensim\n\ngensim 模块在 Python\
    \ 中默认是没有的，需要手动安装。由于作者的 Python 是通过 Anaconda 安装的，因此推荐使用 Anaconda Navigator 安装 gensim\
    \ 模块，这要比基于 Python 的安装方法更加方便。gensim 的安装步骤如下。\n\n（1）在本地计算机找到 “Anaconda Navigator”，并双击打开，找到需要安装的\
    \ “Environments”，本例安装的环境是 Python 3.5 版本，如图 8-5 所示。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_168_1.png)\n\
    \n▲ 图 8-5 Anaconda Navigator 环境界面\n\n（2）在打开的 Anaconda Navigator 操作界面中，找到 “Channels”\
    \ 的左侧选择框（模块当前状态框)，选择“All”，之后在其右侧的搜索框中输入“gensim”搜索，出现 gensim 模块基本信息，单击“Name”下的“gensim”前的方框，出现“↓”图标，单击安装，如图\
    \ 8-6 所示。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_169_0.png)\n\n▲ 图 8-6 搜索\
    \ gensim 模块\n\n（3）在步骤 2 完成之后，搜索结果会出现 gensim 模块，单击下载后，再单击两次“Apply”按钮，第一次在当前界面中的右下角单击，等待一段时间（10s\
    \ 左右）之后，弹出窗口“Install Packages”，再次单击“Apply”按钮，如图 8-7 所示。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_169_1.png)\n\
    \n▲ 图 8-7 下载 gensim\n\n（4）查看是否安装成功。首先找到“Channels”的左侧选择框（模块当前状态框），选择“installed”，可以看到\
    \ gensim 已经安装完成，如图 8-8 所示。如果模块较多，则可以在“Search Packages”框中搜索“gensim”。\n\n### 2.\
    \ 基于 gensim 的 word2vec 实战案例\n\nword2vec 构建语料库操作步骤如下：\n\n- （1）首先获取语料库，可以从数据库直接读取，也可以从本地读取；\n\
    - （2）针对已有的语料进行分词，词与词之间一定要用空格。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_170_0.png)\n\
    \n▲图 8-8 检测是否安装成功\n\n## 【例 8-6】word2vec 构建语料库操作步骤的代码部分\n\n输入：\n\n```\nimport jieba\n\
    f1 =open(\"fenci.txt\")\nf2 =open(\"fenci_result.txt\", 'a')\nlines =f1.readlines()\n\
    for line in lines:\n    line.replace('\\t', '').replace('\\n', '').replace(' ',\
    \ '')\n    seg_list = jieba.cut(line, cut_all=False)\n    f2.write(\" \".join(seg_list))\n\
    f1.close()\nf2.close()\n```\n\n## 小贴士：\n\n如果出现文件编码错误，如 “UnicodeDecodeError: 'gbk'\
    \ codec can't decode byte 0x80 in position 23: illegal multibyte sequence”，那么说明在读取文件过程中没有指定编码。txt\
    \ 文件保存时使用的是 UTF-8 编码，但是在计算机里面存储的是 Unicode 编码，因为数据读取时发现文件中有中文，所以按照 GBK 来试图将 Unicode\
    \ 解码，但是由于文件本身是 UTF-8 编码的，所以解码失败。因此，可以将例 8-6 中相关语句修改如下：f1 =open(\"fenci.txt\",\
    \ encoding=\"utf-8\")。\n\n## 【例 8-7】word2vec 基本语法示例\n\n下面使用 gensim 的 word2vec\
    \ 训练模型。\n\n```\n#1.导入模块\n    from gensim.models import word2vec\n    import logging\n\
    ```\n\n```\n#2.主程序训练模型\nlogging.basicConfig(format='%(asctime)s:%(levelname)s:\n\
    \    %(message)s',level=logging.INFO)\n#加载语料\nsentences =word2vec.Text8Corpus(\"\
    fenci_result.txt\")\n#默认参数训练\nmodel =word2vec.Word2Vec(sentences, size=200)\n\
    #3.保存与加载模型，以便重用\n#保存方式\nmodel.save(\"word2vec.model\")\n# 加载方式\nword2vec.Word2Vec.load(\"\
    word2vec.model\")\n#4.输出词向量\nmodel['中国']\n#5.计算与某个词的相关词列表\nmodel.most_similar(\"\
    北京\")\n#6.计算两个词之间的余弦距离\nmodel.similarity(\"北京\", \"上海\")\n#7.向量加减法\n#使用一些词语限定，分为正向和负向\n\
    #向量加法的形式即表现为：[皇帝+女人-男人]\nmodel.most_similar(positive=['皇帝',\"女人\"],negative=[\"\
    男人\"])\n#8.对比两条词组的相似性\nlist_sim1 = model.n_similarity(['国家','5A','风景','名胜'],['历史','文化','源远流长'])\n\
    #9.寻找不合群的词\nmodel.doesnt_match(['李白',\"杜甫\",\"游泳馆\"])\n```\n\n## 【例 8-8】word2vec\
    \ 实现标签相似度\n\n输入：\n\n```\ndef get_sim1():\n    #加载模型\n    model = word2vec.Word2Vec.load('train_model')\n\
    \    sim_most=model.most_similar(\"北京\", topn=10)\n    print(\"与北京最相似的10个词\")\n\
    \    print(sim_most)\n    tag_list=[\"李白\",\"杜甫\",\"游泳馆\",\"健身中心\",\"熊\",\"豹\"\
    ]\n    print(\"标签之间的相似度\")\n    for i in tag_list:\n        for j in tag_list[tag_list.index(i)+1:]:\n\
    \            sim=model.similarity(i,j)\n            print(\"{i}与{j}: {sim}\".format(i,j,sim))\n\
    ```\n\n输出：\n\n与北京最相似的10个词\n"
  mdcn: "\n关键词抽取的任务就是从一段给定的文本中自动抽取出若干有意义的词语或词组。TextRank 算法是利用局部词汇之间关系（共现窗口）对后续关键词进行排序，直接从文本本身抽取，其主要步骤如下。\n\
    \n- 1. 把给定的文本 T 按照完整句子进行分割，即 T = [S1, S2, …, Sm]。\n- 2. 对于每个句子 Si ∈ T，进行分词和词性标注处理，并过滤掉停用词，只保留指定词性的单词\
    \ Si = [ti,1, ti,2, …, ti,n]，如名词、动词、形容词，即其中 ti,j ∈ Sj 是保留后的候选关键词。\n- 3. 构建候选关键词图\
    \ G = (V, E)，其中 V 为节点集，由步骤 2 生成的候选关键词组成，然后采用共现关系（co-occurrence）构造任意两点之间的边，两个节点之间存在边仅当它们对应的词汇在长度为\
    \ K 的窗口中时共现。K 表示窗口大小，即最多共现 K 个单词。\n- 4. 根据原理中的衡量重要性的权重公式，初始化各节点的权重，然后迭代计算各节点的权重，直至收敛。\n\
    - 5. 对节点权重进行倒序排序，从而得到最重要的 T 个单词作为候选关键词。\n- 6. 由步骤 5 得到最重要的 T 个单词，在原始文本中进行标记，若形成相邻词组，则组合成多词关键词。例如，文本中有句子“Matlab\
    \ code for plotting ambiguity function”，如果“Matlab”和“code”均属于候选关键词，则组合成“Matlab\
    \ code”加入关键词序列。\n\n小贴士：\n以 PageRank 为基础的算法不仅有在文本中起着重要作用的 TextRank，还有在推荐算法中起着重要作用的\
    \ PersonalRank 算法，有兴趣的读者可以整体浏览并学习这 3 个算法，效果更佳。\n\n## 2. 基于 TextRank 关键词抽取\n\n\
    下面基于 TextRank 算法抽取关键词。首先我们来观察一下基于 Jieba 分词的关键词抽取参数。\n\n```\njieba.analyse.textrank(sentence,\
    \ topK=20, withWeight=False, allowPOS=('ns', 'n', 'vn', 'v'))\n```\n\n- sentence:\
    \ 待提取的文本。\n- topK: 返回关键词个数，默认值为 20。\n- withWeight: 关键词权重值，默认值为 False。\n- allowPOS:\
    \ 指定词性，默认值为空，即不筛选。\n\n## 【例 8-5】基于 TextRank 算法的关键词抽取\n\n输入：\n\n```\nkeywords1=jieba.analyse.textrank(text)\n\
    print(keywords1)\n```\n\n输出：\n\n```\n['发展', '人工智能', '中国', '产业', '宣布', '作为', '驱动力',\
    \ '有望', '成为', '引领', '全球', '变革', '争相', '支持', '核心', '出台', '倾心', '科技', '国家', '政策']\n\
    ```\n\n输入：\n\n```\nkeywords2=jieba.analyse.textrank(text, topK=5)\nprint(keywords2)\n\
    ```\n\n输出：\n\n```\n['发展', '人工智能', '中国', '产业', '宣布']\n```\n\n从结果来看，调整输出关键词的个数依然可以得出这段文字的价值导向，即人工智能发展。但是值得注意的是，TextRank\
    \ 将“中国”这个词提取出来，对比 TF-IDF 结果，“中国”的排名明显靠前，原因是 TextRank 算法提取是依据词语之间的贡献关系来构建图，计算图中节点的\
    \ Rank，而 TF-IDF 算法跟 Jieba 分词一样，首先自己有一个默认词库，内含相应的词语与词频，更多的是依据 dict.txt 来计算词频与逆向词频权重。“中国”是频繁出现的词，因此排名靠后。\n\
    \n## 8.3 word2vec 介绍\n\n2013 年，Google 团队发布了 word2vec，它的特点是将所有的词向量量化（word embedding）。word2vec\
    \ 工具主要包含两个模型——跳字模型（skip-gram）和连续词袋模型（CBOW①），以及两种高效的训练方法——负采样（negative sampling）与层序\
    \ softmax（hierarchical softmax）。在本章中，我们将介绍词向量以及相应的语言模型，做到“知其然，亦知其所以然”。\n\n## 8.3.1\
    \ word2vec 基础原理简介\n\n- 1. 词向量\n\n词向量，顾名思义，就是用一个向量的形式表示一个词。为什么这么做？机器学习任务需要把任何输入量化成数值表示，然后充分利用计算机的计算能力，得出最终想要的结果。\n\
    \nNLP 中最直观，也是到目前为止常用的词表示方法是 One-hot Representation，这种方法把每个词表示为一个很长的向量。首先，统计出语料中的所有词汇，然后对每个词汇编号，针对每个词建立\
    \ V 维的向量，向量的每个维度表示一个词，因此对应编号位置上的维度数值为 1，其他维度全为 0。\n\n下面通过一个例子进行介绍。例如，“话筒”与“麦克”这两个词，它们的词向量分别表示如下。“话筒”表示为\
    \ [0001000000000000...]“麦克”表示为 [0000000010000000...]\n\n① CBOW 是 Continuous Bag-of-Words\
    \ Model 的缩写，是一种与前向 NNLM 类似的模型，不同之处在于 CBOW 去掉了最耗时的非线性隐藏层且所有词共享隐藏层。\n\n如果采用稀疏方式存储这种\
    \ One-hot Representation，将会非常简洁：也就是给每个词分配一个数字 ID。可以这样理解，每个词都是茫茫“0”海中的一个“1”，如在刚才的例子中，话筒记为\
    \ 3，麦克记为 8（索引从 0 开始记）。\n\n如果要编程实现，那么用散列（Hash）表给每个词分配一个编号就可以了。这样简洁的表示方法再配合最大熵、SVM\
    \ 和 CRF 等算法，已经可以很好地完成 NLP 领域的各种常见任务。但是，它也存在下列一些问题。\n\n- (1) 维度灾难：维度很大。当词汇较多时，可能达到百万维，造成维度灾难。\n\
    - (2) 词汇鸿沟：任意两个词之间都是孤立的。仅从这两个向量中看不出两个词是否有关系，哪怕是话筒和麦克这样的同义词也不例外。\n\n深度学习中一般用到的词向量并不是刚才所提及的\
    \ One-hot Representation 表示的那种很长的词向量，而是用 Distributed Representation。Distributed\
    \ Representation 最早是 Hinton 在 1986 年的论文 Learning distributed representations of\
    \ concepts 中提出的。就是用一种能够刻画语义之间的相似度并且维度较低的稠密向量表示词向量。这种向量将词表示为 [0.793, −0.177, −0.107,\
    \ 0.109, 0.542, …]的矩阵，通常该矩阵设置为 50 维或 100 维，通过计算向量之间的距离，来体现词与词之间的相似性，解决词汇鸿沟的问题。\n\
    \nDistributed Representation 最大的贡献就是让相关或者相似的词在距离上更接近了。向量的距离可以用最传统的欧氏距离来衡量，也可以余弦相似度来衡量。用这种方式表示的向量，“麦克”和“话筒”的距离会远远小于“麦克”和“天气”，可能在理想情况下“麦克”和“话筒”的表示是完全一样的。但是由于有些人会把英文名“迈克”也写成“麦克”，导致“麦克”一词带上了一些人名的语义，因此不会和“话筒”完全一致。\n\
    \n### 2. 哈夫曼编码\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_165_0.png)\n\n哈夫曼编码（Huffman\
    \ Coding），又称霍夫曼编码，是一种编码方式。哈夫曼编码是可变字长编码（VLC）的一种。Huffman 于 1952 年提出一种编码方法，该方法完全依据字符出现概率来构造异字头的平均长度最短的码字，有时也称为最佳编码。\n\
    \n下面通过一个例子来进行介绍。假设一个文本文件中只包含 7 个字符{A, B, C, D, E, F, G}，这 7 个字符在文本中出现的次数依次为{5,\
    \ 24, 7, 17, 34, 5, 13}，利用哈夫曼树可以为文件构造出符合前缀编码要求的不等长编码，如图 8-2 所示。具体做法如下：\n\n- (1)\
    \ 将文件中的 7 个字符都作为叶子节点，每个字符出现次数作为该叶子节点的权值；\n- (2) 规定哈夫曼树中所有左分支表示字符 0，所有右分支表示字符 1，将依次从根节点到每个叶子节点所经过的分支的二进制位的序列作为该节点对应的字符编码；\n\
    - (3) 由于从根节点到任何一个叶子节点都不能经过其他叶子，这种编码一定是前缀编码，哈夫曼树的带权路径长度正好是文件编码的总长度。\n\n哈夫曼编码是一种无前缀编码，解码时不会混淆，主要应用在数据压缩、加密解密等场合。\n\
    \n![](img/b804a95e802d3360c99b6f8e75c7d047_166_0.png)\n\n▲ 图 8-2 哈夫曼树\n\n那么哈夫曼树有什么好处呢？在得到哈夫曼树后，一般会对叶子节点进行哈夫曼编码，由于权重高的叶子节点靠近根节点，而权重低的叶子节点会远离根节点，因此高权重节点编码值较短，而低权重节点编码值较长。这就保证树的带权路径最短，也符合信息论，即我们希望越常用的词拥有更短的编码。\n\
    \n在 word2vec 中，约定编码方式和上面的例子相反，即约定左子树编码为 1，右子树编码为 0，同时约定左子树的权重不小于右子树的权重。\n\n###\
    \ 3. 统计语言模型\n\n传统的统计语言模型是表示语言基本单位（一般为句子）的概率分布函数，这个概率分布也就是该语言的生成模型。一般语言模型可以使用各个词语条件概率的形式表示。\n\
    \n给定一个由 n 个词语按顺序组成的句子 S = p(w1,w2,...,wn)，则概率 p(s) 即为统计语言模型。\n\n通过贝叶斯公式，可以将概率\
    \ p(s) 进行分解：\n\nw_T^t = w1, w2, ..., w_T 表示长度为 T 的词串。\nP(w1^t) = P(w1, w2, ...,\
    \ w_T) = P(w1)P(w2|w1)P(w3|w1,w2)...P(w_T|w1,w2,...,w_{T-1})\n其中， P(w_T|w1,w2,...,w_{T-1})\
    \ = count(w1,w2,...,w_{T-1},w_T) / count(w1,w2,...,w_{T-1})\n p(s) = p(w1)p(w2|w1)p(w3|w1^2)...p(w_n|w1^{n-1})\n\
    \n因此，要计算一个句子出现的概率，只需要计算出在给定上下文的情况下，下一个词为某个词的概率即可，即 p(w_i|context(w_i))。当所有条件概率\
    \ p(w_i|context(w_i)) 都计算出来后，通过连乘即可计算出 p(s)。因此，统计语言模型的关键问题在于找到计算概率 p(w_i|context(w_i))\
    \ 的模型。\n\n下面通过一个例子来进行介绍。\n将“大家喜欢吃苹果”这句话进行分词，得到结果“大家”“喜欢”“吃”\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_166_1.png)\n\
    \n和“苹果”。下面判断这句话是否为一个常规的自然语言。\n\nP(大家，喜欢，吃，苹果)=p(大家)p(喜欢|大家)p(吃|大家，喜欢)p(苹果|大家，喜欢，吃)\n\
    \n- p(大家)表示“大家”这个词在语料库里面出现的概率。\n- p(喜欢|大家)表示“喜欢”这个词出现在“大家”后面的概率。\n- p(吃|大家，喜欢)表示“吃”这个词出现在“大家喜欢”后面的概率。\n\
    - p(苹果|大家，喜欢，吃)表示“苹果”这个词出现在“大家喜欢吃”后面的概率。\n\n把这些概率进行连乘，得到的就是这句话平时出现的概率。\n\n如果这个概率特别低，说明这句话不常出现，那么就不算是一句自然语言，原因是在语料库里面很少出现。如果出现概率高，就说明这是一句自然语言。\n\
    \n## 8.3.2 word2vec 训练模型\n\n### 1. CBOW 与 Skip_gram 模型\n\nword2vec 是 Mikolov 等人所提出模型的一个实现，可以用来快速有效地训练词向量。目前，word2vec\
    \ 包含了两种训练模型，分别是 CBOW 和 Skip_gram，如图 8-3 所示。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_167_0.png)\n\
    \n▲图 8-3 CBOW 与 Skip-gram\n\n从图 8-3 可以看出，CBOW 和 Skip_gram 模型均包含输入层、投影层和输出层。其中，CBOW\
    \ 模型通过上下文来预测当前词，Skip_gram 模型则通过当前词来预测其上下文。word2vec 提供了具体学习过程中会用到的两个降低复杂度的近似方法，分别是\
    \ Hierarchical Softmax 和 Negative Sampling。将训练模型和优化方法进行组合，可得到 4 种训练词向量的框架，见表 8-3。\n\
    \n表 8-3 模型与优化方法\n\n|  | CBOW | Skip_gram |\n|---|---|---|\n| Hierarchical Softmax\
    \ | CBOW+HS | Skip_gram+HS |\n| Negative Sampling | CBOW+NS | Skip_gram+NS |\n\
    \n### 2. 训练框架\n\n通过训练模型和优化方法组合成了 4 个训练词向量的框架，为了更好地理解训练形式，通过图 8-4 所示的形式进行说明。\n\n\
    ![](img/b804a95e802d3360c99b6f8e75c7d047_168_0.png)\n\n▲ 图 8-4 CBOW 与 Skip-gram\
    \ 训练框架\n\n## 8.3.3 基于 gensim 的 word2vec 实战\n\n### 1. 安装 gensim\n\ngensim 模块在 Python\
    \ 中默认是没有的，需要手动安装。由于作者的 Python 是通过 Anaconda 安装的，因此推荐使用 Anaconda Navigator 安装 gensim\
    \ 模块，这要比基于 Python 的安装方法更加方便。gensim 的安装步骤如下。\n\n（1）在本地计算机找到 “Anaconda Navigator”，并双击打开，找到需要安装的\
    \ “Environments”，本例安装的环境是 Python 3.5 版本，如图 8-5 所示。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_168_1.png)\n\
    \n▲ 图 8-5 Anaconda Navigator 环境界面\n\n（2）在打开的 Anaconda Navigator 操作界面中，找到 “Channels”\
    \ 的左侧选择框（模块当前状态框)，选择“All”，之后在其右侧的搜索框中输入“gensim”搜索，出现 gensim 模块基本信息，单击“Name”下的“gensim”前的方框，出现“↓”图标，单击安装，如图\
    \ 8-6 所示。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_169_0.png)\n\n▲ 图 8-6 搜索\
    \ gensim 模块\n\n（3）在步骤 2 完成之后，搜索结果会出现 gensim 模块，单击下载后，再单击两次“Apply”按钮，第一次在当前界面中的右下角单击，等待一段时间（10s\
    \ 左右）之后，弹出窗口“Install Packages”，再次单击“Apply”按钮，如图 8-7 所示。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_169_1.png)\n\
    \n▲ 图 8-7 下载 gensim\n\n（4）查看是否安装成功。首先找到“Channels”的左侧选择框（模块当前状态框），选择“installed”，可以看到\
    \ gensim 已经安装完成，如图 8-8 所示。如果模块较多，则可以在“Search Packages”框中搜索“gensim”。\n\n### 2.\
    \ 基于 gensim 的 word2vec 实战案例\n\nword2vec 构建语料库操作步骤如下：\n\n- （1）首先获取语料库，可以从数据库直接读取，也可以从本地读取；\n\
    - （2）针对已有的语料进行分词，词与词之间一定要用空格。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_170_0.png)\n\
    \n▲图 8-8 检测是否安装成功\n\n## 【例 8-6】word2vec 构建语料库操作步骤的代码部分\n\n输入：\n\n```\nimport jieba\n\
    f1 =open(\"fenci.txt\")\nf2 =open(\"fenci_result.txt\", 'a')\nlines =f1.readlines()\n\
    for line in lines:\n    line.replace('\\t', '').replace('\\n', '').replace(' ',\
    \ '')\n    seg_list = jieba.cut(line, cut_all=False)\n    f2.write(\" \".join(seg_list))\n\
    f1.close()\nf2.close()\n```\n\n## 小贴士：\n\n如果出现文件编码错误，如 “UnicodeDecodeError: 'gbk'\
    \ codec can't decode byte 0x80 in position 23: illegal multibyte sequence”，那么说明在读取文件过程中没有指定编码。txt\
    \ 文件保存时使用的是 UTF-8 编码，但是在计算机里面存储的是 Unicode 编码，因为数据读取时发现文件中有中文，所以按照 GBK 来试图将 Unicode\
    \ 解码，但是由于文件本身是 UTF-8 编码的，所以解码失败。因此，可以将例 8-6 中相关语句修改如下：f1 =open(\"fenci.txt\",\
    \ encoding=\"utf-8\")。\n\n## 【例 8-7】word2vec 基本语法示例\n\n下面使用 gensim 的 word2vec\
    \ 训练模型。\n\n```\n#1.导入模块\n    from gensim.models import word2vec\n    import logging\n\
    ```\n\n```\n#2.主程序训练模型\nlogging.basicConfig(format='%(asctime)s:%(levelname)s:\n\
    \    %(message)s',level=logging.INFO)\n#加载语料\nsentences =word2vec.Text8Corpus(\"\
    fenci_result.txt\")\n#默认参数训练\nmodel =word2vec.Word2Vec(sentences, size=200)\n\
    #3.保存与加载模型，以便重用\n#保存方式\nmodel.save(\"word2vec.model\")\n# 加载方式\nword2vec.Word2Vec.load(\"\
    word2vec.model\")\n#4.输出词向量\nmodel['中国']\n#5.计算与某个词的相关词列表\nmodel.most_similar(\"\
    北京\")\n#6.计算两个词之间的余弦距离\nmodel.similarity(\"北京\", \"上海\")\n#7.向量加减法\n#使用一些词语限定，分为正向和负向\n\
    #向量加法的形式即表现为：[皇帝+女人-男人]\nmodel.most_similar(positive=['皇帝',\"女人\"],negative=[\"\
    男人\"])\n#8.对比两条词组的相似性\nlist_sim1 = model.n_similarity(['国家','5A','风景','名胜'],['历史','文化','源远流长'])\n\
    #9.寻找不合群的词\nmodel.doesnt_match(['李白',\"杜甫\",\"游泳馆\"])\n```\n\n## 【例 8-8】word2vec\
    \ 实现标签相似度\n\n输入：\n\n```\ndef get_sim1():\n    #加载模型\n    model = word2vec.Word2Vec.load('train_model')\n\
    \    sim_most=model.most_similar(\"北京\", topn=10)\n    print(\"与北京最相似的10个词\")\n\
    \    print(sim_most)\n    tag_list=[\"李白\",\"杜甫\",\"游泳馆\",\"健身中心\",\"熊\",\"豹\"\
    ]\n    print(\"标签之间的相似度\")\n    for i in tag_list:\n        for j in tag_list[tag_list.index(i)+1:]:\n\
    \            sim=model.similarity(i,j)\n            print(\"{i}与{j}: {sim}\".format(i,j,sim))\n\
    ```\n\n输出：\n\n与北京最相似的10个词\n"
