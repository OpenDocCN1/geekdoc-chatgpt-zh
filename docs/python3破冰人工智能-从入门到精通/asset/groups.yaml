    \ auto 即可。\n\n## 小贴士：\n\n针对 init 参数，K-Means 算法经过不断迭代，最终实现收敛目的，但是其收敛过程复杂程度依赖初始化的簇中心的选取，有时可能收敛到局部极小值。而\
    \ K-Means++选择策略就是针对算法的初始簇中心选择上这一缺点而改进的方法。\n\n（1）基本属性说明。\n\n- **cluster_centers_**:\
