    \n在实现文本之间向量加减法中,[皇帝+女人-男人]利用基本的代数式来挖掘词的关系的结果为慈禧,同时计算两个词条之间的相似度与寻找不合群的词之间的任务也顺利完成。可以清楚地看到,word2vec\
    \ 能够学习词与词之间有意义的关系,从而完成许多艰巨的 NLP 任务。\n\n## 第 9 章 从回归分析到算法基础\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_174_0.png)\n\
    \n什么是回归分析？\n\n回归分析就是定量地描述自变量和因变量之间的关系，并根据这些数量关系对现象进行预测和控制的一种统计分析方法。这种预测称为回归分析预测，例如可以通过回归去研究工程师薪资与工作年限的关系。\n\
    \n### 9.1 回归分析简介\n\n### 9.1.1 “回归” 一词的来源\n\n“回归”（regression）一词来源于生物学，是由英国著名生物学家兼统计学家高尔顿①在研究人类遗传问题时提出来的。1885～1890\
    \ 年期间，高尔顿发表多篇论文论证其观点。在研究父与子身高的遗传问题时，高尔顿搜集了 1078 对父子的身高数据，他发现这些数据的散点图大致呈直线状态。也就是说，总的趋势是父亲的身高增加时，儿子的身高也倾向于增加。高尔顿进而分析出子代的身高\
    \ y 与父亲的身高 x 大致可归结为直线关系，并求出了该直线方程（单位：英寸，1 英寸=2.54cm）： ŷ =33.73+0.516x。\n\n这种趋势及回归方程表明的内容如下：\n\
    \n- 父代身高每增加 1 个单位，其成年儿子的身高平均增加 0.516 个单位；\n- 矮个子父亲所生的儿子比其父要高，如 x=60， ŷ =64.69，高于父辈的平均身高。身材较高的父亲所生子女的身高却回落到多数人的平均身高，如\
    \ x=80， ŷ =75.01，低于父辈的平均身高。换句话说，当父亲身高走向极端，子女的身高不会像父亲身高那样极端化，其身高要比父亲们的身高更接近平均身高，即有“回归”到平均数的趋势。\n\
    \n以上就是统计学上最初出现“回归”时的含义，高尔顿把这一现象叫做“向平均数方向的\n\n① 高尔顿（Francis Galton，1822—1911），他的父亲绥缪尔·特修斯·高尔顿（Samuel\
    \ Tertius Galton，1809—1874）是一位著名的银行家；他的外祖父伊拉兹马斯·达尔文（Erasmus Darwin，1731—1802）是英国著名的医学家、动植物学家、诗人和哲学家。英国生物学家、进化论的奠基人《物种起源》的作者查尔斯·罗伯特·达尔文（Charles\
    \ Robert Darwin，1809—1882）是他的表哥。\n\n回归”（regression toward mediocrity）。虽然这是一种特殊情况，与线性关系拟合的一般规则无关，但“线性回归”的术语却因此沿用下来，作为根据一种变量（父亲身高）预测另一种变量（子女身高）或多种变量关系的描述方法。之后，回归分析的思想渗透到了数理统计的其他分支。随着计算机的发展以及各种统计软件包的出现，回归分析的应用越来越广泛。\n\
    \n### 9.1.2 回归与相关\n\n客观事物在发展过程中是彼此联系、相互影响的，在数据挖掘的过程中常常要研究两个或者两个以上的变量之间的关系，各种变量间的关系大致可以分为完全确定关系（函数关系）和非确定性关系。\n\
    \n(1) 完全确定关系：y = f(x) 可以用精确的数学表达式来表示，即当变量 x 的取值确定后，y 有唯一的确定的值与之对应，如圆形的面积（A）与半径（r）之间的关系为\
    \ A = πr²。\n\n(2) 非确定关系：y = f(x)+ε 不能用精确的数学公式来表示，当变量 x 的取值确定后，y 有若干种可能取的值，如父代身高与子代身高之间、房价与人口密度之间，等等。这些变量间都存在着十分密切的关系，但是不能通过一个或者几个变量的值来精准地计算出另外一个变量的值。统计学中把这些变量间的关系称为相关关系，把存在相关关系的变量称为相关变量。\n\
    \n在一定的范围内，对一个变量的任意数值（x_i），虽然没有另一个变量的确定数值（y_i）与之对应，但是却有一个特定 y_i 条件概率分布与之对应，这种变量的不确定关系，称为相关关系。通常，相关变量间的关系一般分为因果关系和平行关系。\n\
    \n(1) 因果关系：一个变量的变化受另一个或几个变量的影响，如玉米的生长速度受种子的遗传特性、管理条件等影响。统计学上采用回归分析方法来研究呈因果关系的变量之间关系。表示原因的变量成为自变量，表示结果的变量成为因变量。\n\
    \n(2) 平行关系：变量之间互为因果或共同受另外的因素影响，如人的身高和胸围。统计学上采用相关分析※来研究呈平行关系的变量之间的关系。\n\n### 9.1.3\
    \ 回归模型的划分与应用\n\n### 1. 回归模型的划分\n\n回归问题分为模型学习和预测两个过程。即先基于给定的训练数据集构建一个模型，再根据新的输入数据预测相应的输出。\n\
    \n回归问题按照输入变量的个数可以分为一元回归和多元回归，按照输入变量和输出变量之间关系的类型，可以分为线性回归和非线性回归。\n\n### 2. 回归模型的应用\n\
    \n如图 9-1 所示。\n\n① 对多个变量进行相关分析时，研究一个变量与多个变量间的线性相关称为复相关分析；研究其余变量保持不变的情况下两个变量间的线性相关称为偏相关分析。本章主要介绍回归分析，更多相关分析请读者自行查阅相关文献。\n\
    \n![](img/b804a95e802d3360c99b6f8e75c7d047_176_0.png)\n\n### 9.2 线性回归分析实战\n\n\
    ### 9.2.1 线性回归的建立与求解\n\n首先来看一个工作年限与年收入的例子。\n\n工作年限是指职工以工资收入为全部或主要来源的工作时间。工作年限的长短标志着职工参加工作时间的长短，也反映了他对社会和企业的贡献大小以及知识、经验、技术熟练程度的高低。有5年工作经验的员工，往往要比只有两年工作经验的员工业务精通度、技术熟练度更高，所以工资也更高。\n\
    \n小明在北京从事算法工作，整理了身边5个从事算法工作同事的数据，工作年限与年收入数据如表9-1所示（单位：十万元）。\n\n表 9-1 工作年限与年收入表\n\
    \n| 序号 | 1 | 2 | 3 | 4 | 5 | 6 |\n|---|---|---|---|---|---|---|\n| 工作年限（Years\
    \ of working） | 2 | 3 | 4 | 5 | 5 | 11 |\n| 年收入（Yearly income） | 20 | 25 | 30\
    \ | 34 | 31 | 40 |\n\n试建立工作年限与年收入之间的关系式。\n\n- (1) 首先针对表9-1描出散点图如图9-2所示。\n\n从图9-2中可以看出，6个点整体呈现线状分布，这说明两个变量之间存在线性相关关系。\n\
    \n设：\n\n```\ny = β₀ + β₁x + ε    ε ~ N(0, σ²)    (9-1)\n```\n\n给定观测值 (xᵢ , yᵢ),\
    \ i=1,2,…,n, 代入式 (9-1) 则有：\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_177_0.png)\n\
    \n▲图 9-2 根据表 9-1 数据所做的散点图\n\n$$\\begin{cases} y_i = \\beta_0 + \\beta_1 x_i +\
    \ \\varepsilon_i \\\\ \\varepsilon_i \\sim N(0,\\sigma^2) \\\\ \\varepsilon_1,\\\
    dots,\\varepsilon_n \\text{相互独立} \\end{cases}\\quad i=1,2,\\dots,n$$ (9-2)\n\n\
    其中，式（9-2）称为一元线性回归模型。\n\n（2）利用最小二乘法求解方程。\n\n设：\n\n$$\\hat y = \\hat\\beta_0 + \\\
    hat\\beta_1 x$$ (9-3)\n\n记作：\n\n$$\\varepsilon_i = y_i - \\hat y_i,\\quad i=1,2,\\\
    dots,n$$\n\n$$Q(\\beta_0,\\beta_1)=\\sum_{i=1}^{n}\\varepsilon_i^2=\\sum_{i=1}^{n}(y_i-\\\
    hat y_i)^2=\\sum_{i=1}^{n}(y_i-\\beta_0-\\beta_1 x_i)^2$$ (9-4)\n\n求 $\\beta_0,\\\
    beta_1$, 使得二元函数 $Q(\\beta_0,\\beta_1)$ 达到最小, 由微积分知识, 得方程：\n\n$$\\begin{cases}\\\
    dfrac{\\partial Q(\\beta_0,\\beta_1)}{\\partial\\beta_0}=-2\\sum_{i=1}^{n}(y_i-\\\
    beta_0-\\beta_1 x_i)=0\\\\\\dfrac{\\partial Q(\\beta_0,\\beta_1)}{\\partial\\\
    beta_1}=-2\\sum_{i=1}^{n}(y_i-\\beta_0-\\beta_1 x_i)x_i=0\\end{cases}$$ (9-5)\n\
    \n解得：\n\n$$\\begin{cases}\\hat\\beta_0=\\bar y-\\hat\\beta_1\\bar x\\\\\\hat\\\
    beta_1=\\dfrac{\\sum_{i=1}^{n}(x_i-\\bar x)(y_i-\\bar y)}{\\sum_{i=1}^{n}(x_i-\\\
    bar x)^2}\\end{cases}$$ (9-6)\n\n由此得回归方程 $\\hat y = \\hat\\beta_0 + \\hat\\beta_1\
    \ x$, 其中 $\\hat\\beta_1$ 为回归系数。\n\n在数据表 9-1 中, 经计算 $\\hat\\beta_0 = 20$, $\\hat\\\
    beta_1 = 2$。\n\n回归方程为 $\\hat y = 20 + 2x$。\n\n最小二乘法的原理是：当预测值和实际值距离的平方和最小时，就选定模型中的两个参数（β₀,β₁）。\n\
