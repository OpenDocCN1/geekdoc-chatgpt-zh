    # 2. 极差


    极差：其最大值与最小值之间的差距，即最大值减最小值后所得数据。


    在统计中常用极差来刻画一组数据的离散程度，以及反映变量分布的变异范围和离散幅度。在总体中，任何两个单位的标准值之差都不能超过极差。同时，它能体现一组数据波动的范围。极差越大，离散程度越大；反之，离散程度越小。


    极差只指明了测定值的最大离散范围，而未能利用全部测量值的信息，不能细致地反映测量值彼此相符合的程度。极差是总体标准偏差的有偏估计值，当乘以校正系数之后，可以作为总体标准偏差的无偏估计值。它的优点是计算简单、含义直观、运用方便，故在数据统计处理中仍有着相当广泛的应用。


