    本节将介绍一种基于知识图谱表示学习的协同过滤推荐算法，其基本思想是将协同过滤计算出来的最近邻推荐给用户。而如果该用户喜欢某物品，那么系统就会为用户推荐语义上相似的物品。


    相对于协同过滤推荐算法仅使用外部评分，加入知识推理（知识图谱）会得到更好的效果。利用知识表示代表模型 TransE（Translation-based Entity），将推荐的物品嵌入一个低维空间，然后计算物品之间的语义相似性，生成语义相似性矩阵，最终可以得到物品的语义近邻。同时，通过调节融合比例，对语义近邻和协同过滤潜在物品按比例融合，利用丰富的语义数据一定程度上解决了推荐系统的冷启动问题。TransE
    CF 流程如图 13-13 所示。


