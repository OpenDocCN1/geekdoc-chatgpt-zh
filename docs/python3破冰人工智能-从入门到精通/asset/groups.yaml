    \ time\ndef run(name):\n    time.sleep(2)\n    print(\"hello, I am thread {}\"\
    .format(name))\n```\n\n## 小贴士：\n\n线程与进程的区别如下。\n\n- 1. 同一个进程中的线程共享同一内存空间，但是进程之间是独立的。\n\
    - 2. 同一个进程中的所有线程的数据是共享的（进程通信），进程之间的数据是独立的。\n- 3. 对主线程的修改可能会影响其他线程的行为，但是父进程的修改（除了删除）不会影响其他子进程。\n\
    - 4. 线程是一个上下文的执行指令，而进程则是与运算相关的一簇资源。\n- 5. 同一个进程的线程之间可以直接通信，但是进程之间的交流需要借助中间代理来实现。\n\
    - 6. 创建新的线程很容易，但是创建新的进程需要对父进程做一次复制。\n- 7. 一个线程可以操作同一进程的其他线程，但是进程只能操作其子进程。\n- 8.\
    \ 线程启动速度快，进程启动速度慢（但是两者运行速度没有可比性）。\n\n## 5.3.3 协程\n\n协程，英文名 Coroutine，又称微线程、纤程。线程和进程的操作由程序触发系统接口，最后的执行者是系统，它本质上是操作系统提供的功能。而协程的操作则是程序员指定的，在\
    \ Python 中通过 yield 方法，人为实现并发处理。\n\n对于多线程应用，CPU 通过切片的方式来切换线程间的执行，线程切换时需要耗时。协程则只使用一个线程，将一个线程分解为多个“微线程”，在一个线程中规定某个代码块的执行顺序。\n\
    \n当程序中存在大量不需要 CPU 的操作（I/O）时，就适合使用协程。调用协程常用第三方模块 gevent 和 greenlet。（本质上 gevent\
    \ 是对 greenlet 的高级封装，因此一般用它就行，这是一个相当高效的模块。）\n\n协程拥有自己的寄存器上下文和栈。协程调度切换时，将寄存器上下文和栈保存到其他地方，在切回来的时候，恢复先前保存的寄存器上下文和栈。因此，协程能保留上一次调用时的状态（即所有局部状态的一个特定组合），每次过程重入时，就相当于进入上一次调用的状态。换种说法，就是进入上一次离开时所处逻辑流的位置。线程的切换会保存到\
    \ CPU 寄存器，CPU 感觉不到协程的存在，协程是用户自己控制的。\n\n## 【例 5-5】开启协程\n\n```python\nimport requests\n\
    import gevent\nurls=[\"http://www.baidu.com\",\"https://www.yahoo.com/\",\"https://www.sogou.com/\"\
    ]\ndef run(url):\n    print(\"url={}\".format(url))\n    res=requests.get(url)\n\
    \    print(\"url bytes is {}\".format(len(res.content)))\n\nif __name__==\"__main__\"\
    :\n    jobs=[gevent.spawn(run, url) for url in urls]\n    gevent.joinall(jobs)\n\
    ```\n\n## 5.3.4 小结\n\n本章只是对爬虫做了简单的介绍，并没有系统地介绍爬虫技术，比如不同异常处理的解决方案、模拟浏览器抓取数据、反爬策略等。同时在\
    \ 5.3 节，只是抛出了一些高性能编程的概念与操作模块，其中的知识还有很多，本书将不做更深入的介绍，希望有兴趣的读者可以自行深入研究，其用处极大。\n\n\
    ## 第 6 章 Python 数据存储\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_131_0.png)\n\n\
    什么是数据存储？\n\n数据存储一般指将数据保存到数据库中。数据库（Database）是按照数据结构来组织、存储和管理数据的仓库，随着信息技术和市场的发展，特别是\
    \ 20 世纪 90 年代以后，数据管理不再仅仅是存储和管理数据，而转变成为用户所需要的各种数据管理的方式。数据库有很多种类型，从最简单的存储（如各种数据的表格）到能够进行海量数据存储的大型数据库系统，在各个方面都得到了广泛的应用。\n\
    \n## 6.1 关系型数据库 MySQL\n\n本章将简单介绍数据库概念与基本操作流程，帮助没有学习过数据库的读者更系统地了解数据库知识之间的关系，以方便更加深入的学习。如果你只想学习算法以及数学知识，或者有一定的数据库基础，那么可以略过本章。\n\
    \n## 6.1.1 初识 MySQL\n\n在开始学习 MySQL 数据库前，让我们先了解关系型数据库管理系统（Relational Database Management\
    \ System，RDBMS）的一些术语。\n\n- 数据库：数据库是一些关联表的集合。\n- 数据表：表是数据的集合。在一个数据库中的表看起来像一个简单的电子表格。\n\
    - 列：一列数据通常包含了相同的数据，例如邮政编码的数据。\n- 行：一行数据通常是一组相关的数据，例如一条用户订阅的数据。\n- 冗余：存储两倍数据，冗余可以使系统速度更快。\n\
    - 主键：主键是唯一的。一个数据表中只能包含一个主键，你可以使用主键来查询数据。\n- 外键：外键用于关联两个表。\n- 复合键：复合键（组合键）将多个列作为一个索引键，一般用于复合索引。\n\
    - 索引：使用索引可快速访问数据库表中的特定信息。索引是对数据库表中一列或多列的值进行排序的一种结构，类似书籍的目录。\n\n参照完整性：参照的完整性要求关系中不允许引用不存在的实体。\n\
    \n在 Web 应用方面，MySQL 是最好的 RDBMS 应用软件之一。其开发者为瑞典的 MySQL AB 公司，在 2008 年 1 月被 Sun 公司收购。由于\
    \ MySQL 体积小、速度快、总体拥有成本低，且是开放源码，因此许多中小型网站为了降低网站总体成本而选择 MySQL 作为网站数据库。\n\n下面来总结一下\
    \ MySQL 的特点。\n\n- 1. 使用 C 和 C++语言编写，并使用了多种编译器进行测试，保证源代码的可移植性。\n- 2. 支持 AIX、FreeBSD、HP-UX、Linux、Mac\
    \ OS、Novell Netware、OpenBSD、OS/2 Warp、Solaris、Windows 等多种操作系统。\n- 3. 为多种编程语言提供了\
    \ API，这些编程语言包括 C、C++、Eiffel、Java、Perl、PHP、Python、Ruby 等。\n- 4. 支持多线程，充分利用 CPU\
    \ 资源。\n- 5. 优化的 SQL 查询算法，有效地提高查询速度。\n- 6. 既能够作为一个单独的应用程序，应用在客户端服务器网络环境中，也能够作为一个库，嵌入其他软件中提供多语言支持。常见的编码如中文\
    \ GB2312、BIG5，日文的 SHIFT_JIS 等都可以用作数据表名和数据列名。\n- 7. 提供 TCP/IP、ODBC 和 JDBC 等数据库连接途径。\n\
    - 8. 提供用于管理、检查、优化的数据库操作的管理工具。\n- 9. 可以处理拥有上千万条记录的大型数据库。\n\n## 6.1.2 Python 操作\
    \ MySQL\n\n在开发或者处理数据的过程中，通常需要先从数据库中提取数据，然后通过相应的数据接口访问数据，再将数据读取到内存中进行处理。这样在面对海量数据时，不仅处理速度得到了提升，而且可以做更多复杂的算法操作。\n\
    \n在 Python 3.x 中，通过 Pymysql 操作 MySQL。在 Python 安装 MySQL 驱动的过程中需要注意，本书使用的是 Python3.6\
