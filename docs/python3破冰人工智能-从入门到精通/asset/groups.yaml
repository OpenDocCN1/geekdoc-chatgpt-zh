    # 11.2.2 信息增益


    假定离散属性 $a$ 有 $V$ 个可能取值 $\{a^1,a^2,\dots,a^v\}$，若使用 $a$ 来对样本集 $D$ 进行划分，则会产生 $V$
    个节点分支节点，其中第 $v$ 个节点分支节点包含了 $D$ 中所有在属性 $a$ 上取值为 $a^v$ 的样本，即为 $D^v$。根据式（11-1）计算出
    $D^v$ 的信息熵，在考虑到不同的节点分支节点所包含的样本数不同，给节点分支节点赋予权重 $\frac{D^v}{|D|}$，即对样本数越多的节点分支节点的影响越大，于是可计算出用属性
    $a$ 对样本集 $D$ 进行划分所获得的“信息增益”（information gain）。


    $Gain(D,a)=Ent(D)-\sum_{v=1}^{V}\frac{D^v}{|D|}Ent(D^v)\qquad(11-2)$


    一般而言，信息增益越大，则意味着使用属性 $a$ 来进行划分所获得的“纯度提升”越大，因此，我们可用信息增益来进行决策树的划分属性选择，最优划分属性则为 $a_*=\max_{a\in
    A}Gain$'
