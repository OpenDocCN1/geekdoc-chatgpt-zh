    \ | 任何特殊的数学函数 |\n| scipy.stats | 统计 |\n\n### 4.3.2 SciPy 基本操作\n\nSciPy 功能强大，下面列举一些\
    \ SciPy 的基础功能，以方便读者学习。\n\n### 1. 积分\n\n积分学不仅推动了数学的发展，同时也极大地推动了天文学、力学、物理学、化学、生物学、工程学、经济学等自然科学、社会科学及应用科学各个分支的发展，并在这些学科中有越来越广泛的应用。特别是计算机的出现，更有助于这些应用的不断发展。scipy.integration\
    \ 提供了多种积分模块，主要分为以下两类：一种是对给出的函数公式积分，见表 4-11；另一种是对给定固定样本的函数积分。我们一般关注对数值积分的 trapz\
    \ 和 cumtrapz 函数。trapz 使用复合梯形规则沿给定轴线进行求积分，cumtrapz 使用复合梯形法则累计计算积分。\n\n表 4-11 积分函数（给定的函数对象）\n\
    \n| 函数 | 说明 |\n|---|---|\n| quad(func, a, b[, args, full_output, ...]) | 计算定积分\
    \ |\n| dblquad(func, a, b, gfun, hfun[, args, ...]) | 计算二重积分 |\n| tplquad(func,\
    \ a, b, gfun, hfun, qfun, rfun) | 计算三重积分 |\n| nquad(func, ranges[, args, opts,\
    \ full_output]) | 多变量积分 |\n\n下面来求解定积分公式 I(a,b)=∫₀¹(ax²+b)dx，我们选用 quad 来进行计算评估，具体见例\
    \ 4-14。\n\n### 【例 4-14】计算积分\n\n输入：\n\n```python\nfrom scipy.integrate import quad\n\
    def integrand(x,a,b):\n    return a*x**2 + b\na=2\nb=1\nI=quad(integrand,0,1,args=(a,b))\n\
    print(I)\n```\n\n输出：\n\n```\n(1.6666666666666667, 1.8503717077085944e-14)\n```\n\
    \n函数返回两个值，其中第一个数字是积分值，约为 1.67，第二个数值是积分值绝对误差的估计值，从结果可以看出效果较好。\n\n### 2. 最小二乘拟合\n\
    \n假设有一组实验数据 (x_i, y_i)，它们之间的函数关系为 y = f(x)，通过这些已知信息，需要确定函数中的一些参数项。例如，如果 f 是一个线性函数\
    \ f(x)=k x + b，那么参数 k 和 b 就是我们需要确定的值。如果将这些参数用 p 表示，那么我们要找到一组 p 值，使得如下公式中的 S 函数最小：\n\
    \nS(p)=∑_{i=1}^{m}[y_i - f(x_i,p)]²\n\n这种算法被称为最小二乘拟合（Least-square fitting）。\n\n\
    在 Scipy 中的子函数库 optimize 已经提供了实现最小二乘拟合算法的函数 leastsq。下面是用 leastsq 进行数据拟合的一个例子，具体见例\
    \ 4-15。\n\n### 【例 4-15.1】 SciPy 最小二乘法拟合\n\n输入：\n\n```python\n#导入所需模块\nfrom scipy.optimize\
    \ import leastsq\nimport numpy as np\n\n#定义数据拟合所用的函数: A*sin(2*pi*k*x + theta)\n\
    def func(x, p):\n    A, k, theta = p\n    return A*np.sin(2*np.pi*k*x+theta)\n\
    \n#实验数据 x, y 和拟合函数之间的差, p 为拟合需要找到的系数\ndef residuals(p, y, x):\n    return y -\
    \ func(x, p)\n\nx = np.linspace(0, -2*np.pi, 100)\nA, k, theta = 10, 0.34, np.pi/6\
    \  #真实数据的函数参数\ny0 = func(x, [A, k, theta])      #真实数据\ny1 = y0 + 2 * np.random.randn(len(x))\
    \  #加入噪声之后的实验数据\np0 = [7, 0.2, 0] #第一次猜测的函数拟合参数\n#调用 leastsq 拟合, residuals 计算误差函数,\
    \ p0 拟合参数初始值, args 需要拟合实验数据\nplsq = leastsq(residuals, p0, args=(y1, x))\nprint\
    \ (u\"真实参数:\", [A, k, theta])\nprint (u\"拟合参数\", plsq[0])\n```\n\n输出：\n\n```\n\
    真实参数: [10, 0.34, 0.5235987755982988]\n拟合参数 [10.03138142  0.34128054 -5.70587811]\n\
    ```\n\n### 【例 4-15.2】 可视化展现，程序运行结果如图 4-7 所示\n\n输入：\n\n```python\nimport matplotlib.pyplot\
