    对于给定的一个包含 n 个 d 维数据点的数据集 X = {x₁, x₂, …, xᵢ, …, xₙ}，其中 xᵢ ∈ Rᵈ，以及要生成的数据子集的数目 K，K-Means
    聚类将数据对象组分为 K 个划分，具体划分为 C = {cₖ, i=1,2,…,K}。每个划分代表一个类 cₖ，每个类 cₖ 有一个类别中心 μₖ。选取欧式距离作为相似性和距离判断的准则，计算该类各个点到聚类中心
    μₖ 的距离平方和。


    J(cₖ) = Σ_{xᵢ ∈ cₖ} ‖xᵢ - μₖ‖²


    聚类目标是使各类总的距离平方和 J(C) = Σ_{k=1}^K J(cₖ) 最小。


    J(C) = Σ_{k=1}^K J(cₖ) = Σ_{k=1}^K Σ_{xᵢ ∈ cₖ} ‖xᵢ - μₖ‖² = Σ_{k=1}^K Σ_{i=1}^n
    d_{ki} ‖xᵢ - μₖ‖²


    其中： d_{ki} = { 1, 若 xᵢ ∈ cₖ ; 0, 若 xᵢ ∉ cₖ }


    显然，根据最小二乘法和拉格朗日定理，距离中心 μₖ 是选取类别 cₖ 类下的各个数据点的平均值。


    K-Means 聚类算法从一个初始的 K 类别划分开始，然后将各数据点指派到各个类别中，以减少总的距离平方和。由于 K-Means 聚类算法中总的距离平方和随着类别的个数
    K 的增加而趋向于减小（当 K=n 时，J(C)=0）。因此，总的距离平方和只能在某个确定的类别个数 K 下取得最小值。


    ### 10.1.3 算法流程


    K-Means 算法的核心思想是把 n 个数据对象划分为 k 个聚类，使每个聚类中的数据点到该聚类中心的平方和最小。输入聚类个数 k，包含 n 个数据对象的数据集，输出
    k 个聚类。算法的流程图如图 10-1 所示，算法处理过程如下。


    - 1. 从 n 个数据对象中任意选取 k 个对象作为初始的聚类中心种子点。

    - 2. 分别计算每个对象到各个聚类中心的距离，把对象分配到距离最近的聚类中心种子群。

    - 3. 所有对象分配完成后，重新计算 k 个聚类的中心（将种子点移动到种子群中心）。

    - 4. 重复上述步骤 2 至步骤 3 的过程，每次结果与前一次计算得到的各聚类中心比较，如果聚类中心发生变化，转步骤 2，否则转步骤 5。

    - 5. 输出聚类结果。


    对于此算法来说，优点是可以处理大数据集，算法是相对可伸缩的和高效的，因为它的时间复杂度为 O(tKmn)，其中 t 为迭代次数，K


    ![](img/b804a95e802d3360c99b6f8e75c7d047_186_0.png)


    为簇的数目，m 为每个元素的特征项数，n 为元素个数。且 t≤n，k≤n。


