    \n通过上面的聚类算法，将相似标签进行了聚类，完成了标签的分类，达到群分的目的。通过统计分析可以将用户的主属性标记出来，但其也存在着一些缺点。\n\n- 用户分群：相同爱好的人。\n\
    \  此种方法有时可以给用户带来惊喜，但是个性化稍差（人群与个体）。\n- 商品聚类：相似商品。\n  精确性较高，但推荐的商品大多对用户无新鲜感，比如在旅游的场景下，对旅游景点的推荐，根据景点的标签进行聚类，完成同一类别的景点推荐，往往此场景下，旅游者很难发现比较新奇的景点。\n\
    \n对于算法的评价，一方面聚类可以在一定程度上解决数据稀疏的问题，从而捕捉一些隐性（扩展）相似度，另一方面聚类的精度往往没有协同过滤的效果好。\n\n###\
    \ 2. 基于知识图谱的推荐\n\n2012 年 Google 推出第一版知识图谱，在学术界和工业界掀起了一股热潮，各大互联网企业在之后短短的一年内纷纷推出了自己的知识图谱产品以作为回应。比如互联网巨头百度和搜狗分别推出“知心”和“知立方”来改进其搜索质量，同时知识图谱也广泛运用于知识问答领域。\n\
    \n知识图谱本质上是语义网络，是一种基于图的数据结构，由节点（Point）和边（Edge）组成。在知识图谱里，每个节点表现实世界中存在的“实体”，每条边为实体与实体之间的“关系”。知识图谱是关系的...\
    \ 通俗地讲，知识图谱就是把所有不同种类的信息（Heterogeneous Information）连接在一起而得到的一个关系网络。知识图谱提供了从“关系”的角度去分析问题的能力。\n\
    \n对于一个典型的知识图谱来说，可以通过有向图表示的三元组，以及三元组之间的相互链接，构成一个网状的知识集合，这种三元组携带着实体自身的语义信息。节点（node）代表实体（entity）或者概念（concept），实体之间的各种语义关系（relation）作为边（edge）。\n\
    \n以电影领域为例，电影实体中主要包括了演员、类型、导演等主要数据特征，这些特征从一定程度上概括了这部电影。利用电影特征，可以得到图 13-6 所示的一个电影知识图谱的三元组。众多的节点和边可以构成图\
    \ 13-7～图 13-9 形式的图谱。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_227_0.png)\n\n\
    ![](img/b804a95e802d3360c99b6f8e75c7d047_227_1.png)\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_227_2.png)\n\
    \n![](img/b804a95e802d3360c99b6f8e75c7d047_228_0.png)\n\n▲图 13-9 演员、电影与类型\n\n\
    知识图谱包含了实体之间丰富的语义关联，为推荐系统提供了潜在的辅助信息来源。知识图谱在诸多推荐场景中都有应用的潜力，例如电影、新闻、景点、餐馆、购物等。和其它种类的辅助信息相比，知识图谱的引入可以让推荐结果更加具有以下特点。\n\
    \n（1）精确性（precision）：知识图谱为物品引入了更多的语义关系，可以发现用户深层次的兴趣，如图 13-10 所示。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_228_1.png)\n\
    \n▲图 13-10 知识图谱推荐示例 1\n\n（2）多样性（diversity）：知识图谱提供了不同的关系连接种类，有利于推荐结果的发散，避免推荐结果局限于单一类型，如图\
    \ 13-11 所示。\n\n（3）可解释性（explainability）：知识图谱可以连接用户的历史记录和推荐结果，从而提高用户对推荐结果的满意度和接受度，增强用户对推荐系统的信任。\n\
    \n下面来看一个知识图谱实际应用的例子，如图 13-12 所示。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_229_0.png)\n\
    \n▲图 13-11 知识图谱推荐示例 2\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_229_1.png)\n\
    \n▲图 13-12 百度搜索推荐示例\n\n在图 13-12 中，是在百度首页搜索框输入“达芬奇”返回的结果，可以看到页面的右侧是基于当前输入的内容通过关联关系而推荐的相关信息，其他人还搜索了哪些内容。这种方式可以用来提升用户的体验，完成精准推荐。\n\
    \n将知识图谱作为辅助信息引入推荐系统中，可以有效解决传统推荐系统存在的稀疏性和冷启动问题。随着 2012 年 Google 推出知识图谱，越来越多的公司将知识图谱融合到推荐系统中。\n\
    \n目前，将知识图谱特征学习应用到推荐系统中主要通过 3 种方式——依次学习、联合学习以及交替学习。\n\n本节将介绍一种基于知识图谱表示学习的协同过滤推荐算法，其基本思想是将协同过滤计算出来的最近邻推荐给用户。而如果该用户喜欢某物品，那么系统就会为用户推荐语义上相似的物品。\n\
    \n相对于协同过滤推荐算法仅使用外部评分，加入知识推理（知识图谱）会得到更好的效果。利用知识表示代表模型 TransE（Translation-based\
    \ Entity），将推荐的物品嵌入一个低维空间，然后计算物品之间的语义相似性，生成语义相似性矩阵，最终可以得到物品的语义近邻。同时，通过调节融合比例，对语义近邻和协同过滤潜在物品按比例融合，利用丰富的语义数据一定程度上解决了推荐系统的冷启动问题。TransE\
    \ CF 流程如图 13-13 所示。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_230_0.png)\n\n\
    ### 小贴士：\n\n在本节中，相关知识图谱图片均是来源于图数据库 Neo4j，其采用的是 Cypher 语句查询。在 Python 下同样有 Neo4j\
    \ 的 API，通过 from py2neo import *导入。\n\n图 13-14 为图数据库 Neo4j 中节选的部分电影及其属性所成的网状结构。从图\
    \ 13-14 中可以看出，在知识图谱中越相似的两个节点，在语义上也往往十分接近。因此，对于电影推荐来说，不仅可以利用电影的用户评分信息，也可使用电影自身的语义信息。协同过滤推荐认为两物品的用户评分分布相近，则它们被判定为近邻。同样，如果该电影在知识图谱中相近，直观上也可以被判定为近邻。对于知识表示处理，常见形式是文本处理方法与知识图谱相结合，TransE+Word2Vec\
    \ 就是文本方法和知识图谱方法相结合。KG 对应 TransE 方法，文本 Text 对应 Word2Vec 模型。基于 CNN 的关系抽取模型，建立对词汇、实体、关系的统一表示空间。\n\
    \n![](img/b804a95e802d3360c99b6f8e75c7d047_231_0.png)\n\n▲图 13-14 图数据库 Neo4j 部分图谱结构\n\
    \n### 13.2.2 小结\n\n如同老师对学生因材施教，在不同场景、不同特征下，也应该应用不同的算法。推荐系统是算法应用的重要表现，为了获得令人满意的最终效果，请记住以下几点。\n\
    \n- 推荐需求比算法更重要！\n- 理解业务逻辑比算法更重要！\n- 理解数据和数据处理比算法更重要！\n- 理解用户比算法更重要！\n\n因此，我们除了学习算法，更应该熟悉用户与业务。\n"
