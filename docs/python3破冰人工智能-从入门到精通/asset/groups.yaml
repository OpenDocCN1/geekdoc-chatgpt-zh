    2）如果 $A_k$ 是连续值属性，则我们假定属性服从高斯分布，因而有：


    $P(x_k | C_i) = g(x_k, \mu_{c_i}, \sigma_{c_i}) = \frac{1}{\sigma_{c_i}\sqrt{2\pi}}
    e^{-\frac{(x_k - \mu_{c_i})^2}{2\sigma_{c_i}^2}}$


    其中，给定的类 $C_i$ 的训练样本属性 $A_k$ 的值，$g(x_k, \mu_{c_i}, \sigma_{c_i})$ 是属性 $A_k$ 的高斯密度函数，而
    $\mu_{c_i}$ 和 $\sigma_{c_i}$ 分别为期望和标准差。


    为了完成对样本 $X$ 的分类，对每个类 $C_i$，计算 $P(X | C_i)P(C_i)$。样本 $X$ 被指派到类 $C_i$，当且仅当 $P(X
    | C_i)P(C_i) > P(X | C_j)P(C_j)$，其中 $1 \le i, j \le m, i \ne j$。


    换言之，$X$ 被指派到 $P(X | C_j)P(C_j)$ 最大的类 $C_j$。


