    # 12.1.3 朴素贝叶斯算法的优缺点


    朴素贝叶斯算法的优点如下。


    +   - 朴素贝叶斯算法基于贝叶斯理论，逻辑清晰明了，容易实现。\n- 本算法进行分类时，运行时间快，对内存的需求也相对不大。\n- 本算法可靠性高，即使数据包含孤立的噪声点、无关属性和有缺失值的属性，分类的性能不会有太大的变化。


    朴素贝叶斯算法的缺点如下。


    +   - 朴素贝叶斯算法要求样本的各属性之间是独立的，而符合这个条件的真实数据较少。\n- 当数据样本较少时，分类器可能会无法正确分类。


    # 12.2 3种朴素贝叶斯实战


    在学习朴素贝叶斯算法之前，应该复习本书 1.2.3 节，以温故知新。不懂数据分布特征，不算是一个合格的机器学习工程师。数据拿过来就往模型里面套用，完全不理解原理，可能这是众多“调包客”最开始都犯过的错误。


    Scikit-learn 提供了 3 种朴素贝叶斯模型，下面具体来看一下。


    # 1. 3 种朴素贝叶斯


    在 Scikit-learn 下，BernoulliNB 实现了用于多重伯努利分布数据的朴素贝叶斯训练和分类算法，即有多个特征，但每个特征都假设是一个二元（Bernoulli,
    boolean）变量。因此，这类算法要求样本以二元值特征向量表示。如果样本含有其他类型的数据，一个 BernoulliNB 实例会将其二值化（取决于 binarize
    参数）。'
