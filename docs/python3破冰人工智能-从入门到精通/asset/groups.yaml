    K-Means 聚类算法是由 Steinhaus（1955 年）、Lloyd（1957 年）、Ball & Hall（1965 年）、Mc Queen（1967
    年）分别在各自不同的科学研究领域独立提出的。K-Means 聚类算法被提出后，在不同的学科领域被广泛研究和应用，并发展出大量不同的改进算法。虽然 K-means
    聚类算法被提出已经超过 50 年了，但目前仍然是应用最广泛的划分聚类算法之一。容易实施、简单、高效、成功的应用案例和经验，是其仍然流行的主要原因。


