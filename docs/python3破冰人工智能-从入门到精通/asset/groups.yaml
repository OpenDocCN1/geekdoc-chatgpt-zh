    \  1.  1.  1.]\n```\n\n### 5. ones 与 zeros 系列函数\n\n某些时候，在创建数组之前已经确定了数组的维度以及各维度的长度，这时就可以使用\
    \ NumPy 内建的一些函数来创建 ndarray。\n\n例如，函数 ones 创建一个全 1 的数组、函数 zeros 创建一个全 0 的数组、函数\
    \ empty 创建一个内容随机的数组。在默认情况下，用这些函数创建的数组的类型都是 float64，若需要指定数据类型，只需要设置 dtype 参数即可。同时上述\
    \ 3 个函数还有 3 个从已知的数组中创建 shape 相同的多维数组的扩展函数，分别为 ones_like、zeros_like、empty_like。\n\
    \n（1）依据给定形状和类型，返回一个元素全为 1 的数组。函数形式为：\n\n```\nones(shape, dtype=None, order='C')\n\
    ```\n\n- shape: 定义返回数组的形状，形如 (2,3) 或 2。\n- dtype: 数据类型，可选。返回数组的数据类型，例如 numpy.int8、默认\
    \ numpy.float64。\n- order: {'C','F'}, 规定返回数组元素在内存的存储顺序，例如 C(C 语言)-row-major; F(Fortran)-column-major。\n\
    \n### 【例 3-10】ones 案例\n\n输入：\n```python\na=np.ones(4)\nb=np.ones((4,),dtype=np.int)\n\
    c=np.ones((2,1))\nS=(2,2)\nd=np.ones(S)\nV=np.array([[1,2,3],[4,5,6]])\ne=np.ones_like(a)\n\
    print(\"a={}\\nb={}\\nc={}\\nd={}\\ne={}\".format(a,b,c,d,e))\n```\n输出：\n```\n\
    a=[ 1.  1.  1.  1.]\n\nb=[1 1 1 1]\n\nc=[[ 1.]\n    [ 1.]]\n\nd=[[ 1.  1.]\n \
    \   [ 1.  1.]]\n\ne=[ 1.  1.  1.  1.]\n```\n\n（2）依据给定形状和类型，返回一个新的元素全部为 0 的数组。函数形式为：\n\
    \n```\nzeros(shape, dtype=None, order='C')\n```\n\n参数同 np.ones 参数。\n\n### 【例 3-11】zeros\
