    # 2. 常见的概率分布


    这里介绍 4 种常用的概率分布，在第 12 章中将会用到其中 3 种。


    # （1）伯努利分布


    伯努利分布是一个离散型分布，为纪念瑞士科学家詹姆斯·伯努利（James Bernoulli）而命名，通常记作 X~Bernoulli(p)。在介绍伯努利分布前，首先需要引入伯努利试验（Bernoulli
    trial）。伯努利试验是只有两种可能结果的单次随机试验，例如，伯努利分布的典型例子是抛一次硬币的概率分布；硬币正面朝上的概率 p，而硬币反面朝上的概率为
    q。


    伯努利分布（Bernoulli distribution）是两点分布或 0~1 分布的特殊情况，即它的随机变量只取 x=0（失败）或者 x=1（成功），各自的概率分别为
    1-p 和 p。


    其概率质量函数为：

    f(x)=p^x(1-p)^{1-x}= { p , x=1 ; 1-p , x=0 ; 0 , 其他 }


    其数学期望等于 p，方差等于 p(1-p)。


    # （2）二项分布


    二项分布是 n 重伯努利分布。在同一条件下重复 n 次独立的试验，每次试验只有两个对立结果，A 发生或者不发生，设在 A 发生的概率为 p，不发生的概率为
    1-p。这时，在 n 次独立试验中，A 出现的次数 k 是一个随机变量，且有：'
  - '[PAGE 33]


    $P(X=k)=C_n^k p^k (1-p)^{n-k},\ k=0,1,2,\dots,n$


    则称该分布为二项分布，记作 $X\sim B(n,p)$。二项分布的数学期望和方差分别为 $np$ 和 $np(1-p)$。


    # （3）多项式分布


    把二项扩展为多项就得到了多项分布，通常记作 $X\sim Multinomial(n,p)$。比如扔骰子，不同于扔硬币，骰子有6个面，对应6个不同的点数，这样单次每个点数朝上的概率都是
    $\frac{1}{6}$（对应 $p_1\sim p_6$，它们的值不一定都是 $\frac{1}{6}$，只要和为1且互斥即可，比如一个形状不规则的骰子），重复扔
    $n$ 次，有 $k$ 次都是点数6朝上的概率就是：


    $P(X=k)=C_n^k p_6^k (1-p_6)^{n-k},\ k=0,1,2,\dots,n$


    以上介绍的都是离散型的概率分布。


    # （4）高斯分布


    高斯分布（Gaussian distribution）又名正态分布（Normal distribution），是一个在数学、物理及工程等领域都非常重要的连续型随机变量概率分布，在统计学的许多方面有着重大的影响力。若随机变量
    $X$ 服从一个数学期望为 $\mu$、标准方差为 $\sigma$ 的高斯分布，记作 $X\sim N(\mu,\sigma^2)$。


    $f(x)=\frac{1}{\sigma\sqrt{2\pi}}e^{-\frac{(x-\mu)^2}{2\sigma^2}}$


    高斯分布是现实生活中最为常见的分布形态，也是我们在使用朴素贝叶斯模型中最为常用的分布。


