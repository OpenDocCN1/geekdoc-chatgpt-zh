    \ D 中随机抽取两个样本类别标记不一致的概率，因此，Gini(D)越小，则数据集 D 的纯度越高。\n\n采用与式（11-2）相同的符号表示，属性 a 的\
    \ Gini 系数定义为：\n\n$$Gini\\_index(D,a)=\\sum_{v=1}^{|D^v|}\\frac{|D^v|}{|D|}Gini(D^v)$$\n\
    \n于是，我们在候选属性集合 A 中，选择划分后的基尼系数最小的属性作为最优的划分属性，即 $a_* = \\arg\\min_{a\\in A} Gini\\\
    _index(D,a)$。以 Humidity 维度为例，其存在两种选择，具体演示计算过程如表 11-4 所示。\n\n表 11-4\nHumidity 维度属性统计\n\
    \n| Play | Normal 属性 | High 属性 |\n|---|---|---|\n| yes | 6 | 2 |\n| no | 7 | 2\
    \ |\n\n$$Gini(Normal)=1-\\left(\\frac{6}{13}\\right)^2-\\left(\\frac{7}{13}\\\
    right)^2=0.497\\quad Gini(High)=1-\\left(\\frac{2}{4}\\right)^2-\\left(\\frac{2}{4}\\\
    right)^2=0.5$$\n\n$$Gini\\_index(D,Humidity)=\\frac{4}{17}\\times0.5+\\frac{13}{17}\\\
    times0.497=0.497705$$\n\n对于维度，其存在 3 种选择，只需分别计算求和即可，具体本书不再演示，有兴趣的读者可以自行计算。\n\n\
    ### 11.2.5 小结\n\n建立决策树的关键，即在当前状态下选择哪个属性作为分类的依据。根据不同的目标函数，建立决策树。ID3 算法的核心是信息增益，C4.5\
    \ 是 ID3 算法的改进，其核心是信息增益率，CART 算法核心则是在 C4.5 基础上改进的基尼系数，以上介绍的内容是经典决策树模型的原理，下面我们详细探讨以下\
    \ 3 种算法。\n\n下面主要从 4 个方面来介绍。\n\n- 1. 从目标因变量来说，差异主要体现在 ID3 和 C4.5 只能作分类，CART（分类回归树）不仅可以作分类（0/1）还可以作回归（0-1）。\n\
    - 2. 从节点划分形式来说，ID3 和 C4.5 节点上可以产生多叉（低、中、高），而 CART 节点上永远是二叉（低、非低）。\n- 3. 从样本量考虑，小样本建议考虑\
    \ C4.5，大样本建议考虑 CART。C4.5 在处理过程中需对数据集进行多次排序，耗时较高，而 CART 本身是一种大样本的统计方法，小样本处理下泛化误差较大。\n\
    - 4. 从样本特征上的差异上来说，特征变量的使用中，多分类的分类变量 ID3 和 C4.5 层级之间只单次使用，CART 可多次重复使用。C4.5 是通过枝剪来修正树的准确性，而\
    \ CART 是直接利用全部数据发现所有树的结构进行对比。\n\n更多对比，具体见表 11-5 的总结。\n\n表 11-5 ID3、C4.5、CART 使用场景对比\n\
