    ### 2.1.2 IDE 的选择


    如果说编程是程序员的手艺，那么 IDE 就是程序员的 “饭碗” 了。


    IDE 的全称是 Integration Development Environment（集成开发环境），一般以代码编辑器为核心，包括一系列外围组件和附属功能。一个优秀的
    IDE，最重要的就是提供针对特定语言的各种快捷编辑功能，让程序员尽可能快捷、舒适、清晰地浏览、输入和修改代码。对于一个现代的 IDE 来说，语法着色、错误提示、代码折叠、代码完成、代码块定位、重构，与调试器、版本控制系统（VCS）的集成等都是重要的功能。以插件、扩展系统为代表的可定制框架，是现代
    IDE 的另一个流行趋势。IDE 并非功能越多越好，因为更多的功能往往意味着更高的复杂度，这不但会分散程序员的精力，而且还可能带来更多的错误。用最合适的工具做最合适的事情，因此只要基本功能满足需要，而且符合自己的使用习惯，那么它就是一款好的
    IDE。正因为如此，比起大而全的 IDE，以单纯的文本编辑器结合独立的调试器、交互式命令行等外部小工具也是另一种开发方式。由于 Python 本身的简洁性，因此在写小的代码片段以及通过


    示例代码学习时，这种方式尤其适合。


    Anaconda 自带 Spyder。安装好 Python 后，我们需要选择适合自己的 IDE 来学习，虽然利用 Python 默认的编辑器，或者直接文档编辑也可以进行基础的学习，但总归不是太方便。能够开发
    Python 项目的 IDE 很多，如 sublime text、PyCharm。本书代码均在 PyCharm 下完成。


    ### 2.2 Python 基本操作


    ### 2.2.1 第一个小程序


    世界上的第一个程序是 “Hello World”，由 Brian Kernighan 创作，其中中文意思是 “你好，世界”。对于大多数程序语言，第一个入门编程代码便是
    “Hello World”。例 2-1 代码为使用 Python 输出 “Hello World”。


    ### 【例 2-1】 Hello World 程序


    输入：


    ```

    #!/usr/bin/env python

    #这是一个注释

    print("Hello World")

    ```


    输出：


    ```

    Hello World

    ```


    例 2-1 是一个 print 的例子，它并不会真的印什么东西在纸上，而是在屏幕上显示出 Hello World。有些人以 Hello World 程序的简洁性来判断一种程序语言的品质，以这个标准来看，Python
    几乎做到了尽善尽美。


    ### 2.2.2 注释与格式化输出


    ### 1. 注释


    在大多数编程语言中，注释是一项很有用的功能。源代码的注释供人阅读，而不是供计算机执行，注释用自然语言告诉你某段代码的功能是什么。随着程序版本的更迭，程序越来越复杂，就应其中添加说明，对程序所解决问题的办法进行大致的阐述。


    每种语言都有其特有注释形式，下面来介绍 Python 中程序的行内注释。


    ### (1) 单行注释


    在 Python 中，单行注释以井号（#）开头标识，井号后面的内容都会被 Python 解释器忽略，如例 2-2 所示。


    ### 【例 2-2】单行注释


    输入：


    ```

    # 这是一个注释

    print("Hello, World")

    ```


    ### （2）多行注释


    在 Python 中，多行注释用 3 个单引号（''''''）或者 3 个双引号（"""）将注释括起来。用来解释更复杂的代码，如例 2-3 所示。


    ### 【例 2-3】多行注释


    输入：


    ```

    ''''''

    Created on May 10, 2018

    @author: *****

    ''''''

    print("Hello, World")

    ```


    使用注释有助于令程序更易于理解，因为即使是你自己编写的程序，如果不加注释，你在以后也可能看不懂。恰当的注释可以使其他人更易与你在编程项目上合作，并凸显代码的价值。


    ### 小贴士：


    在 PyCharm 中，选中需要注释的多行代码，然后按快捷键<Ctrl+/>，即可快速注释选中的多行代码。


    ### 2. 格式化输出


    ### （1）%操作符


    %操作符可以实现字符串格式化。它将左边的参数作为类似 sprintf()的格式化字符串，而将右边的代入，然后返回格式化的字符串，如例 2-4 与例 2-5
    所示。更多的格式化输出形式见表 2-1。


    ### 【例 2-4】%操作符


    输入：


    ```

    print("%o"% 10)

    print("%d"% 10)

    print("%f"% 10)

    ```


    输出：


    ```

    12

    10

    10.000000

    ```


    浮点数输出过程中，经常需要控制保留小数位数，可以在现有格式化输出的基础上进行限制，比如%.2f，保留 2 位小数位；%.2e，保留 2 位小数位，使用科学计数法输出；%.2g，保留
    2 位有效数字，使用小数或科学计数法输出。

