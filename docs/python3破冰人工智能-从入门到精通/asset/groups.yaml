    \n# 5.3 爬虫进阶——高效率爬虫\n\n如果你有一定的网络基础和 Python 编程基础，那么很快就可以完成一个简单的爬虫任务。在大数据时代，数据量往往远超我们的预期。比如，通过百度地图爬取北京市朝阳区朝外街道附近的饭店信息，这是比较容易的任务；但是如果要爬取全国的饭店信息，请求的网页可能高达百万甚至千万或者更多，那么就需要考虑使用高效率的爬虫来完成任务。本章将列举一些高效率爬虫的解决方案。\n\
    \n# 5.3.1 多进程\n\nPython 提供了非常好用的多进程包 multiprocessing，只需要定义一个函数，Python 会完成其他所有事情。借助这个包，可以轻松完成从单进程到并发执行的转换。multiprocessing\
    \ 支持子进程、通信和共享数据、执行不同形式的同步，提供了 Process、Queue、Pipe、Lock 等组件。\n\nmultiprocessing\
    \ 下 Process 类的构造方法的具体形式为：\n\n```\nclass Process(object):\n    def __init__(self,\
    \ group=None, target=None, name=None, args=(), kwargs={})\n```\n\n+   - group:\
    \ 进程组，不常用。\n+   - target: 表示调用对象，传入要执行的方法。\n+   - args: 表示调用对象的位置参数元组。\n+   -\
    \ name: 进程别名。\n+   - kwargs: 表示调用对象的字典。"
