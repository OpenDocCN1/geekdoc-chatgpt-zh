    ```\n```\n\n# 5.3.2 多线程\n\n网络爬虫需要下载规模非常庞大的网页，爬虫程序向服务器提交请求后要等待服务器的处理和返回结果。如果采用单线程，每个线程依次发送请求并等待服务器的依次响应，等待时间是所有网页处理过程的叠加，效率大大降低。因此，可采用多线程机制来减少个别网页的处理时间，以提高程序的效率。\n\
    \n和多进程的思路类似，多进程和多线程都可以执行多个任务，线程是进程的一部分，其特点是线程之间可以共享内存和变量，资源消耗少，缺点是线程之间的同步和加锁比较麻烦。在\
    \ Python 中，使用 threading 包创建多线程，构造方法如下：\n\n```\nThread(group=None, target=None,\
    \ name=None, args=(), kwargs={})\n```\n\n+   - group: 线程组，不常用。\n+   - target:\
    \ 表示调用对象，传入要执行的方法。\n+   - name: 线程别名。\n+   - args/kwargs: 要传入方法 的参数。"
