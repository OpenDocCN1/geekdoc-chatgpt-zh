    什么是聚类算法？


    聚类是一个将数据集分为若干个子集的过程，并使得同一集合中的数据对象具有较高的相似度，而不同集合中的数据对象则是不同的。相似或不相似的度量是基于数据对象描述属性的取值来确定的，通常就是利用各个聚类间的距离来进行描述的。聚类分析的基本指导思想是最大限度地实现类中对象相似度最大，类间对象相似度最小。


    简单理解，如果一个数据集包含 n 个实例，根据某种准则可以将这 n 个实例划分为 m 个类别，每个类别中的实例都是相关的，而不同类别之间是区别的，也就是不相关的，这个过程就叫聚类了。


