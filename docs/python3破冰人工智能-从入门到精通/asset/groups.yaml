    # 什么是网络爬虫？


    网络爬虫（又被称为网页蜘蛛、网络机器人），是一种按照一定的规则自动抓取万维网信息的程序或者脚本。爬虫一般分为数据采集、处理和存储 3 个部分。简单来说，网络爬虫程序模拟真实的人访问互联网，从网络上抓取我们需要的数据。


    # 5.1 爬虫基础


    # 5.1.1 初识爬虫


    # 1. 爬虫章节的由来


    由于爬虫在人工智能技术范畴中并非核心技能，因此对于是否要写爬虫的章节，我纠结许久。恰巧，QQ 群中有同学参加数学建模竞赛，问我“某种数据如何获取”，我回复“通过爬虫获取”，之后他发出了疑问：“爬虫？是什么？”。通过这次沟通，我决定在本书中简单介绍爬虫技术，希望没有接触过爬虫技术的读者对其有一定了解。


    在大数据环境下，各行各业对数据信息提出了更高的要求，要想快速、准确地获取自己想要的信息，就需要对数据获取技术进行优化。从现阶段相关技术的发展情况来看，虽然现在的搜索引擎技术已经得到了充分的发展，但是对于一些复杂的信息资料或者需要海量外部数据特征来验证模型时，这些搜索引擎在数据检索中依然会出现一些问题。所以为了能够有效解决上述问题，就应该利用网络爬虫技术，进一步提高数据检索质量，更有针对性地完成数据收集任务。


    # 2. 一个好的爬虫特征


    网络爬虫从 20 世纪 90 年代开始出现，发展至今已是成熟的数据收集工具。一个好的爬虫应该具有以下特征。


    +   - □ 明确的爬取目标。

    +   - □ 高效的爬取策略。'
  - '[PAGE 121]


    +   - 有效的前置和后续处理。

    +   - 高性能的运行速度。


    本章将整体论述网络爬虫的工作流程及涉及的关键技术。


    # 3. 工作原理


    网络爬虫是一段程序或者脚本。网络爬虫的系统框架中，主程序由控制器、解析器和资源库组成。


    控制器的主要工作是给多线程中的各个爬虫线程分配工作任务。首先，爬虫将请求访问某一站点或者网页，若能够访问，则自动下载保存其中的内容。然后，爬虫的解析模块会解析得到已爬取页面中的其他网页链接，并将这些链接作为之后爬取的目标。得益于
    HTML 页面（JS 脚本标签、CSS 代码内容、空格字符、HTML 标签等）的结构化设计，爬虫在分析网页结构时可以完全不依赖于用户操作，实现自动运行。资源库是用来存放下载到的网页资源，它一般都采用大型的数据存储，如
    MySQL、MongoDB 数据库。


    # 5.1.2 网络爬虫的算法


    爬虫在工作时可以将要进行爬取的所有网页链接视为树状结构，从一个起始 URL 节点开始，顺着网页中的超链接不断进行爬取，直至进行至叶子节点。对于爬取超链接的方式，主要有以下两种算法。


    # （1）深度优先搜索算法


    深度优先搜索算法（Depth-First-Search，DFS），选取最初的一个网页，在该网页中选取一个跳转至下一个网页的链接，在该链接跳转至的下一网页中重复该步骤，直至遍历到叶子节点。即网页中不再存在跳转至下一网页的超链接，此时从上一节点选取一个新的链接重复上述遍历过程，不断重复以上步骤，直到将该路线中的全部超链接遍历完成。在此之后，我们将选取另一个初始网页，继续重复以上遍历过程。该算法的优点是较为容易设计网络爬虫。


    # （2）广度优先搜索算法


    该算法是爬虫先获取到初始网页中的所有链接对应的网页，再从中选择一个链接，继续获取该链接对应网页中的所有链接对应的全部网页，不断重复上述过程。该方法是在理论上最佳的实现网络爬虫的方法。由于有些网络结构复杂，进行深度优先算法可能导致爬虫系统不断跳转至更深一层的超链接，导致一个分支变得无限制，而广度优先算法可以有效避免这种情况。广度优先算法使爬虫系统并行爬取相同深度的网页，极大地提高了获取信息的效率。


