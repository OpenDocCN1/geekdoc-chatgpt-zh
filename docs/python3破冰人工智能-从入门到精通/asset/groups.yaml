    \ 系统，它包含了众多流行的科学计算、数据分析的 Python 包。如果你已经安装了 Anaconda，那么代表着 NumPy 已经安装成功。\n\n如果通过\
    \ Python 官网安装 Python，NumPy 在 Windows、各种 Linux 发布版以及 Mac OS X 上均有二进制安装包。如果你愿意，也可以安装包含源代码的版本。你需要在系统中安装\
    \ Python 2.4.x 或更高的版本。在各个系统环境下安装 NumPy 的命令都是 pip install numpy。\n\n### 小贴士：\n\n\
    Python 导入模块的实现方式是使用 import 关键字，它可以将一个包中已出现的一个或多个函数或模块引入到另一个 Python 代码中，从而实现代码的复用，如\
    \ import numpy。\n\n## 3.2 基本操作\n\n在学习 Python 的过程中，你可能已经发现，NumPy 中包含大量的函数。其实很多函数的设计初衷都是为了让用户更方便地理解和使用这些函数，从而大大提升工作效率，这些函数包括数组元素的选取和多项式运算等。\n\
    \n### 3.2.1 初识 NumPy\n\nNumPy 的主要对象是同质多维数组，也就是在一个元素（通常是数字）表中，元素的类型都是相同的。其中可以通过正整数的元组来对元素进行索引。在\
    \ NumPy 中，数组的维度被称为轴（axes），轴的数量被称为秩（rank）。例如在三维空间中一个点的坐标[1,2,1]，就是秩为 1 的数组，因为它只有一个轴，这个轴的长度为\
    \ 3。\n\nNumPy 的数组称为 ndarray，别名为 array。numpy.array 与标准 Python 库类 array.array 不一样，标准库类中只能处理一维数组并且功能相对较少。下面我们来认识下\
    \ ndarray 对象的常见属性，如表 3-1 所示。\n\n表 3-1 ndarray 对象属性\n\n| 属性 | 含义 |\n|---|---|\n\
    | T | 转置，与 self.transpose()相同，如果维度小于 2，返回 self |\n| size | 数组中元素个数，等于 shape 元素的乘积\
    \ |\n| itemsize | 例如，一个类型为 float64 的元素数组 itemsize 为 8 (=64/8)，而一个 complex32 的数组\
    \ itemsize 为 4 (=32/8)。该属性等价于 ndarray.dtype.itemsize |\n| dtype | 数组元素的数据类型对象，可以用标准\
    \ Python 类型来创建或指定 dtype，或者在后面加上 NumPy 的类型；numpy.int32、numpy.int16、numpy.float64，等等\
    \ |\n| ndim | 数组的轴（维度）的数量。在 Python 中，维度的数量通常被称为 rank |\n| shape | 数组的维度。为一个整数元组，表示每个维度上的大小。对于一个\
    \ n 行 m 列的矩阵来说，shape 就是 (n, m) |\n| data | 该缓冲区包含了数组的实际元素。通常情况下不需要使用这个属性，因为我们会使用索引的方式来访问数组中的元素\
    \ |\n| flat | 返回数组的一维迭代器 |\n| imag | 返回数组的虚部 |\n| real | 返回数组的实部 |\n| nbytes |\
    \ 数组中所有元素的字节长度 |\n\n在 Python 中，如果需要导入某个模块，则使用关键字 import。通常为了方便复用出现频率较高的模块，使用 as\
    \ 对其别名处理。下面通过例 3-2 来实现 NumPy 的基本操作。\n\n### 【例 3-2】初识 NumPy\n\n输入：\n\n```\n```python\n\
    import numpy as np\na = np.random.random(4)\nprint(type(a))\n```\n```\n\n输出：\n\
    \n```\n```\n<class 'numpy.ndarray'>\n```\n```\n\n输入：\n\n```\n```python\nprint(a.shape)\n\
    ```\n```\n\n输出：\n\n```\n```\n(4,)\n```\n```\n\n输入：\n\n```\n```python\nprint(a)\n\
    ```\n```\n\n输出：\n\n```\n```\n[ 0.24123598  0.04089253  0.94548641  0.46101693]\n\
    ```\n```\n\n例 3-2 说明，通过 np.random.random(4) 生成一个浮点数组，类型为 numpy.ndarray，a.shape\
    \ 显示 a 的长度为 4，最终生成的数组结果为[0.24123598 0.04089253 0.94548641 0.46101693]。\n\n###\
    \ 3.2.2 NumPy 数组类型\n\n对于科学计算来说，Python 中自带的整型、浮点型和复数类型还远远不够，因此 NumPy 中增加了许多数据类型。在实际应用中，我们需要不同精度的数据类型，它们占用的内存空间也是不同的。在\
    \ NumPy 中，大部分数据类型名是以数字结尾的，这个数字表示其在内存中占用的位数，具体见表 3-2。\n\n① 表格参考：NumPy 用户手册。\n"
