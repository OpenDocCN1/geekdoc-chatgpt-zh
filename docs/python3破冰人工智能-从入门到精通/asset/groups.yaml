    \n### 什么是推荐系统？\n\n推荐系统（recommender system）是为用户推荐有用的项目的一种软件工具，也可以说是一种技术方法。早期的推荐系统为用户提供的推荐都是当前流行且大众化的内容，并不能满足个体用户的需求，因此产生了基于个性化推荐算法。\n\
    \n### 13.1 推荐系统简介\n\n### 13.1.1 推荐系统的发展\n\n随着互联网的发展，人们正处于一个信息爆炸的时代。面对现阶段海量的信息数据，对信息的筛选和过滤能力，是衡量一个系统好坏的重要指标。一个具有良好用户体验的系统，会对海量信息进行筛选、过滤，将用户最关注、最感兴趣的信息展现在用户面前，它大大提升了系统的效率，节省了用户筛选信息的时间。\n\
    \n搜索引擎的出现在一定程度上解决了信息筛选问题，但还远远不够。搜索引擎需要用户主动提供关键词来对海量信息进行筛选。当用户无法准确描述自己的需求时，搜索引擎的筛选效果将大打折扣。而用户将自己的需求和意图转化成关键词的过程，本身就是一个并不轻松的过程。\n\
    \n在此背景下，推荐系统出现了。推荐系统的任务就是联系用户和信息，一方面帮助用户发现对自己有价值的信息，另一方面让信息能够展现 在对它感兴趣的人群中，从而实现信息提供商与用户的双赢。\n\
    \n电商的推荐系统则能够大大提升销售额：亚马逊通过个性化推荐系统能够大幅度提高销售量；推荐算法不仅为 Netflix 每年节省数亿美元，更让冷门内容能够发挥作用，这就需要依赖基于用户习惯数据的个性化推荐系统——利用个性化推荐，内容观看率相较普通列表展示提升\
    \ 3～4 倍。\n\n### 1. 常见推荐算法\n\n推荐系统是解决信息过载问题的主要方法之一。在推荐系统出现前，主流技术是非个性化推荐、大众化推荐、根据热度进行推荐。\n\
    \n协同过滤算法基于 user 和 item，是相对比较成熟的算法。协同过滤算法又分为基于模型的协同过滤推荐和基于内存的协同过滤推荐。\n\n其中，基于模型的推荐常见的模型有频繁项挖掘、聚类算法、分类算法、矩阵分解模型以及图模型等。基于内存的协同过滤推荐算法又分为基于用户的协同过滤推荐算法和基于物品（项目）的协同过滤推荐算法。\n\
    \n基于用户的协同过滤推荐通过计算目标用户与其余用户之间的相似度，得到与目标用户兴趣爱好相似的用户，根据相似用户的喜好为目标用户进行推荐。\n\n### 2.\
    \ 算法的发展\n\n随着技术的发展，基于内容（Content-based）、知识（Knowledge-based）的推荐逐渐发展起来，并实现了混合应用。\n\
    \n随着推荐系统的价值越来越被人们所认识，人们研究出了更多的推荐算法。当前，比较热门的有依托人工智能技术，利用深度学习技术进行推荐；基于情景的推荐；在页面整体化方向推荐等；以基于用户行为和注意力的建模进行建模如图\
    \ 13-1 所示。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_215_0.png)\n\n▲图 13-1 注意力建模\n\
    \n图13-1所示为点击位置（左）和记录光标位置（右）：红色和黄色代表发生强烈交互区域，绿色代表一般交互区域，蓝色代表弱交互区域。\n\n### 13.1.2\
    \ 协同过滤\n\n协同过滤推荐算法是诞生最早，并且较为著名的推荐算法，其主要功能是预测和推荐。算法通过对用户历史行为数据挖掘发现用户的偏好，基于不同的偏好对用户进行分组划分并向用户推荐品味相似的物品。简单来说，就是物以类聚，人以群分。协同过滤推荐算法这里我们主要学习基于用户的推荐（User\
    \ CF）与基于内容的推荐（Item CF）。\n\n### 1. 相似度\n\n相似度计算用于衡量对象之间的相似程度。其中的关键技术主要分为两个部分：即对象的特征表示，以及集合之间的相似关系。在信息检索、网页判重、推荐系统等都涉及对象之间或者对象和对象集合的相似性计算。而针对不同的应用场景，受限于数据规模、时空开销等，相似度计算方法的选择又会有所区别和不同。\n\
    \n推荐系统中相似度计算可以说是基础中的基础了，因为几乎所有的推荐算法都是在计算相似度，下面对一些常用的相似度计算方法进行介绍。\n\n### (1) 欧几里得距离\n\
    \n欧几里得距离，即欧氏距离是最常用的距离计算公式，它用于衡量多维空间中各个点之间的绝对距离，当数据很稠密并且连续时，这是一种很好的计算方式。具体公式如下：\n\
    \n$d(x,y)=\\sqrt{\\sum (x_i - y_i)^2}\\quad sim(x,y)=\\frac{1}{1+d(x,y)}$\n\n\
    ### (2) 皮尔逊相关系数\n\n又称相关相似性，通过 Pearson 相关系数来度量两个用户的相似性。计算时，首先找到两个用户共同评分过的项目集，然后计算这两个向量的相关系数。具体公式如下：\n\
    \n$p(x,y)=\\frac{\\sum x_i y_i - n \\bar{x}\\bar{y}}{(n-1)s_x s_y}=\\frac{n\\\
    sum x_i y_i - \\sum x_i \\sum y_j}{\\sqrt{n\\sum x_i^2-(\\sum x_i)^2}\\sqrt{n\\\
    sum y_j^2-(\\sum y_i)^2}}$\n\n### (3) 余弦相似度\n\n余弦相似度用向量空间中两个向量夹角的余弦值作为衡量两个个体间的差异大小。相比距离度量，余弦相似度更加注重两个向量在方向上的差异，而非距离或长度差异。具体公式如下：\n\
    \n$T(x,y)=\\frac{x\\cdot y}{\\|x\\|\\times\\|y\\|}=\\frac{\\sum x_i y_i}{\\sqrt{\\\
    sum x_i^2}\\sqrt{\\sum y_i^2}}$\n\n### 2. User CF\n\n基于用户的协同过滤算法的基本思想相对来说比较容易理解，也就是基于用户对物品的偏好找到相邻的邻接用户，然后将邻接用户喜欢的物品推荐给当前用户。计算上，就是将一个用户对所有物品的偏好作为一个向量来计算用户之间的相似度，找到\
    \ K 邻接后，根据邻接的相似度权重以及他们对物品的偏好，预测当前目标用户没有偏好的未涉及物品，计算得出一个排序的物品列表推荐给用户。\n\n下面给出了一个例子，如表\
    \ 13-1 所示，对于用户 A，根据用户的历史偏好，计算得到一个邻接用户 C，然后将用户 C 喜欢的物品 D 推荐给用户 A，如图 13-2 所示。\n\n\
    表 13-1 User CF 案例表\n\n| User/Item | 物品 A | 物品 B | 物品 C | 物品 D |\n|---|---|---|---|---|\n\
    | 用户 A | 1 | — | 1 | 1 |\n| 用户 B | — | 1 | — | — |\n| 用户 C | 1 | — | 1 | 推荐 |\n\
    \n注：表 13-1 中的数字 1 代表喜欢，如果我们要刻画喜欢的程度，那么此处的 1 可替换成其他形式，比如用户对物品的评分。\n\n### 3. Item\
    \ CF\n\n基于物品的协同过滤算法的原理与基于用户的协同过滤算法思想上是类似的，只是在计算邻接矩阵时依据物品本身，而不是从用户的角度，即基于用户对物品的偏好找到相似的物品，然后根据用户的历史偏好，推荐相似的物品。从计算的角度看，就是将所有用户对某个物品的偏好作为一个向量来计算物品之间的相似度，根据用户历史的偏好预测当前用户还没有表示偏好的物品，计算得出一个排序的物品列表作为推荐。\n\
    \n![](img/b804a95e802d3360c99b6f8e75c7d047_217_0.png)\n\n下面同样通过图表给出了一个例子，如表 13-2\
    \ 所示，对于物品 A，根据所有用户的历史偏好，喜欢物品 A 的用户都喜欢物品 C，得出物品 A 和物品 C 比较相似，而用户 C 喜欢物品 A，那么可以推断出用户\
    \ C 可能也喜欢物品 C，如图 13-3 所示。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_217_1.png)\n\
    \n表 13-2 Item CF 案例表\n\n| User/Item | 物品 A | 物品 B | 物品 C |\n|---|---|---|---|\n\
    | 用户 A | 1 | 1 | 1 |\n| 用户 B | — | 1 | — |\n| 用户 C | 1 | 1 | 推荐 |\n\n### 4. 实战案例\n\
    \n下面来实现基于电影的协同过滤推荐。首先获取数据集 ml-100k，包含 943 个用户对 1682 个影片的评分信息。读取我们需要的 u.data 文件，其中有\
    \ 10 万条数据，包含 user_id（从 1 开始）、item_id（从 1 开始）、rating（1～5）和 timestamp（时间戳属性）4 个字段，接着进行数据观察与描述统计分析，最后进行协同过滤模型的构建与分析，详见例\
    \ 13-1。\n\n### 【例 13-1】协同过滤案例\n\n输入：\n\n```\n#1.导入数据\nimport pandas as pd\nimport\
    \ matplotlib.pyplot as plt\npath=\"ml-100k\\\\\"\ndf = pd.read_csv(path+'ml-100k/u.data',\
    \ sep='\\t',header=None,names=\n    ['user_id', 'item_id', 'rating', 'timestamp'])\n\
    print(\"预览数据前 5 行:\\n{}\\n预览数据后 5 行:\\n{}\".format(df.head(5),df.tail(5)))\n```\n\
    \n输出：\n\n```\n预览数据前 5 行:\n  user_id  item_id  rating  timestamp\n0     196   \
    \   242       3   881250949\n1     186      302       3   891717742\n2      22\
    \      377       1   878887116\n3     244       51       2   880606923\n4    \
    \ 166      346       1   886397596\n预览数据后 5 行:\n    user_id  item_id  rating \
    \ timestamp\n99995     880      476       3   880175444\n99996     716      204\
    \       5   879795543\n99997     276     1090       1   874795795\n99998     \
    \ 13      225       2   882399156\n99999      12      203       3   879959583\n\
    ```\n\n输入：\n\n```\n#2.对数据进行描述统计分析\nprint(\"数据描述统计\\n{}\".format(df.describe()))\n\
    ```\n\n输出：\n\n### 数据描述统计\n\n|  | user_id | item_id | rating | timestamp |\n|---|---|---|---|---|\n\
    | count | 100000.00000 | 100000.000000 | 100000.000000 | 1.000000e+05 |\n| mean\
    \ | 462.48475 | 425.530130 | 3.529860 | 8.835289e+08 |\n| std | 266.61442 | 330.798356\
    \ | 1.125674 | 5.343856e+06 |\n| min | 1.00000 | 1.000000 | 1.000000 | 8.747247e+08\
    \ |\n| 25% | 254.00000 | 175.000000 | 3.000000 | 8.794487e+08 |\n| 50% | 447.00000\
    \ | 322.000000 | 4.000000 | 8.828269e+08 |\n| 75% | 682.00000 | 631.000000 | 4.000000\
    \ | 8.882600e+08 |\n| max | 943.00000 | 1682.000000 | 5.000000 | 8.932866e+08\
    \ |\n\n在数据描述统计分析结果中，user_id 与 item_id 的最大值分别为 943 与 1682，数据已知信息是 943 个用户对 1682\
    \ 个影片的评分数据，故 user_id 与 item_id 数据均不存在缺失，是完整的数据集。从 rating 来看，评分范围为 1～5，中位数为 4，均值约为\
    \ 3.5299，表明用户整体对影片的评分较高。\n\n输入：\n\n```\n#3.切割训练集与测试集\nfrom sklearn.model_selection\
    \ import train_test_split\ntrain_ratings, test_ratings = train_test_split(df,\
    \ test_size=0.3,random_state=0)\n```\n\n输入：\n\n```\n#4.分别构建训练集与测试集矩阵\ndef create_matrix(ratings,matrix):\n\
    \    for row in matrix.itertuples():\n        ratings[row[1]-1, row[2]-1] = row[3]\n\
    \    return ratings\n\nratings = np.zeros((943, 1682))\ntrain_ratings_matrix =\
    \ create_matrix(ratings,train_ratings)\ntest_ratings_matrix = create_matrix(ratings,test_ratings)\n\
    ```\n\n输入：\n\n```\n#5.计算相似度，采用皮尔逊相似度。\nfrom sklearn.metrics.pairwise import pairwise_distances\n\
    #user 方向\nuser_sim = pairwise_distances(train_ratings_matrix, metric='cosine')\n\
    #item 方向\nitem_sim = pairwise_distances(test_ratings_matrix.T, metric='cosine')\n\
    ```\n\n输入：\n\n```\n#6.构建预测函数\ndef predict(ratings,sim, kind=None):\nif kind ==\
    \ 'user':\n    #对 item 求平均分\n    mean_user = ratings.mean(axis=1)\n    #①\n  \
    \  ratings_diff = (ratings - mean_user[:, np.newaxis])\n    #②\n    pred = (mean_user[:,\
    \ np.newaxis]+sim.dot(ratings_diff)/np.array\n        ([np.abs(sim).sum(axis=1)]).T\n\
    \    #③\n    #pred = sim.dot(ratings_diff) / np.array([np.abs(sim).sum(axis=1)]).T\n\
    elif kind == 'item':\n    pred=ratings.dot(sim)/np.array([np.abs(sim).sum(axis=1)])\n\
    else:\n    print(\"kind is None,please input\")\nreturn pred\n```\n\n输入：\n\n```\n\
    #7.推荐 topK\ndef recommend(pred, topk=3):\n    #对数据由小到大排序，输出排序的索引，之后输出后面三个索引，即推荐的前三个次序\n\
    \    axis_l = np.argsort(pred, axis=1)\n    res=axis_l[:, -topk:]\n    return\
    \ res\n```\n\n输入：\n\n```\n#8.构建评估函数\nfrom sklearn.metrics import mean_squared_error\n\
    def get_mse(pred, actual):\n    #Ignore nonzero terms.\n    pred = pred[actual.nonzero()].flatten()\n\
    \    actual = actual[actual.nonzero()].flatten()\n    return mean_squared_error(pred,\
    \ actual)\n```\n\n### 小贴士：\n\n代码说明：\n\n- ① #meanuserrating[:, np.newaxis]加入新的坐标轴，比如由原来的[1,2,3,4]变成【【1】【2】【3】【4】】\n\
    - ② 与③#两种不同的预测方法。\n\n### 5. 模型预测与评估\n\n在第4节的基础上进行预测，执行 Predict 函数，其中 Predict 中的\
    \ Type 参数分别为 Item 与 User，表示两种形式。\n\n### 【例 13-2】模型的预测与评估\n\n输入：\n\n```\nuser_pred=predict(train_ratings_matrix,\
    \ user_sim, kind='user')\nitem_pred=predict(train_ratings_matrix, item_sim, kind='item')\n\
    ```\n\n模型评估如下。\n\n输入：\n\n```\nfrom sklearn.metrics import mean_squared_error\n\
    def get_mse(pred, actual):\n    # Ignore nonzero terms.\n    pred = pred[actual.nonzero()].flatten()\n\
    \    actual = actual[actual.nonzero()].flatten()\n    return mean_squared_error(pred,\
    \ actual)\n\nprint ('User-based CF MSE: ' + str(get_mse(user_pred, test_ratings_matrix)))\n\
    print ('Item-based CF MSE: ' + str(get_mse(item_pred, test_ratings_matrix)))\n\
    ```\n\n输出：\n\nUser-based CF MSE: 8.782186025575763\nItem-based CF MSE: 11.506639978736974\n\
    \n### 【例 13-3】完整的代码\n\n```\n#!/usr/bin/env python\n# -*- coding:utf-8 -*-\nimport\
    \ pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import train_test_split\n\
    from sklearn.metrics.pairwise import pairwise_distances\n\ndef create_matrix(ratings,matrix):\n\
    \    for row in matrix.itertuples():\n        ratings[row[1]-1, row[2]-1] = row[3]\n\
    \    return ratings\n\ndef predict(ratings, sim, kind=None):\n    if kind == 'user':\n\
    \        mean_user = ratings.mean(axis=1)\n        ratings_diff = (ratings - mean_user[:,\
    \ np.newaxis])\n        pred = mean_user[:,np.newaxis]+sim.dot(ratings_diff\n\
    \        )/np.array([np.abs(sim).sum(axis=1)]).T\n    elif kind == 'item':\n \
    \       pred=ratings.dot(sim)/np.array([np.abs(sim).sum(axis=1)])\n    else:\n\
    \        print(\"kind is None,please input\")\n```\n"
