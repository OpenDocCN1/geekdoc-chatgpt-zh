    # 第 12 章 从朴素贝叶斯看算法多变


    ![](img/b804a95e802d3360c99b6f8e75c7d047_207_0.png)


    什么是朴素贝叶斯？

    从字面上看，朴素贝叶斯可以理解为“朴素”+“贝叶斯”。“朴素”指的是特征条件独立，“贝叶斯”指贝叶斯定理。朴素贝叶斯分类是一种十分简单的分类算法，叫它朴素贝叶斯分类是因为这种方法的思想真的很朴素。

    朴素贝叶斯的思想基础是对于给出的待分类项，求解在此项出现的条件下哪个类别出现的概率最大，就认为此待分类项属于哪个类别。


    # 12.1 朴素贝叶斯简介


    # 12.1.1 认识朴素贝叶斯


    学习过概率论的人一定知道贝叶斯定理，贝叶斯定理在信息领域有着举足轻重的地位。贝叶斯算法是基于贝叶斯定理的一类算法，主要用来解决分类和回归问题。


    在人工智能背景下，机器学习中使用最为广泛的两种分类模型就是决策树模型（Decision Tree Model）和朴素贝叶斯模型（Naive Bayesian
    Model）。决策树模型前面已经介绍过，这里介绍朴素贝叶斯，首先通过一个现实生活中的例子来理解其概念。


    当看到天空乌云密布、电闪雷鸣伴随着阵阵狂风这样的天气特征时，我们会推断大概是要下雨了。


    基于一些特定的条件或特征（天空乌云密布、电闪雷鸣，阵阵狂风），大多数人都会产生一个共同的推断反应（下雨）。这种推断形式正是朴素贝叶斯（Naive Bayesian）最核心的理念。


    对于给出的待分类项，求解在此项出现的条件下哪个类别出现的概率最大，就认为此待分类项属于哪个类别。我们可以再举一个例子，你在校医院的门诊部看到一个学生有点发烧，此时在不做其他临床检测的情况下，判断该学生最有可能患了什么病？作为一名没有临床经验的人，你十有八九会猜是普通感冒。因为常识告诉我们，到校医院来看病的患者最常见的就是患了普通感冒。当然，患者也有可能是患了流感或其他发热性疾病，但在此时没有其他可用信息，我们会选择条件概率最大的类别，这就是朴素贝叶斯的思想基础，也是其核心。'
  - '[PAGE 208]


    因此本节将重点介绍朴素贝叶斯算法的基本原理和实际应用，接下来先来认识 3 种概率分布下的朴素贝叶斯。


    下面介绍朴素贝叶斯分类模型。


    朴素贝叶斯分类器是贝叶斯分类模型中最简单有效且在实际使用中很成功的分类器，其性能可以与神经网络、决策树相媲美。朴素贝叶斯分类算法是基于贝叶斯假设，在实际运用中降低了贝叶斯网络构建的复杂性，它已成功地应用到聚类分类等数据处理任务中。


    朴素贝叶斯分类模型，设有变量集 U = {A1, A2, …, An, C}，其中 A1, A2, …, An 是实例的属性变量，C 是取 m 个类的变量。假设所有的属性都条件独立于类变量，即每一个属性变量都以类变量作为唯一的父节点，就得到朴素贝叶斯分类模型。


    朴素贝叶斯分类模型假定特征向量的各分量相对于决策变量是相对独立的，也就是说，各变量独立地作用于决策变量，尽管这一假定在一定程度上限制了朴素贝叶斯分类模型的适用范围，但在实际应用中，大大降低了贝叶斯网络构建的复杂性。


    # 12.1.2 朴素贝叶斯分类的工作过程


    +   (1) 每个数据样本用一个 n 维特征向量 X = {x1, x2, …, xn} 表示，分别描述对 n 个属性 A1, A2, …, An 样本的
    n 个度量。

    +   (2) 假定有 m 个类 C1, C2, …, Cm，给定一个未知的数据样本 X（即没有类标号），分类法将预测 X 属于具有最高后验概率（条件 X
    下）的类。朴素贝叶斯分类将未知的样本分配给类 Ci，当且仅当 P(Ci | X) > P(Cj | X) 其中 1 ≤ i, j ≤ m, i ≠ j 成立，这样得到最大化的
    P(Ci | X)。P(Ci | X) 最大的类称为最大后验假定，根据贝叶斯定理，P(Ci | X) 推导如下：

    +   P(Ci | X) = P(X | Ci) P(Ci) / P(X)

    +   (3) 由于 P(X) 对于所有类为常数，只需要 P(X | Ci) P(Ci) 最大即可。如果类的先验概率未知，则通常假设这些类是等概率的，即 P(C1)
    = P(C2) = … = P(Cm)，并据此对 P(Ci | X) 求最大值。类的先验概率可以采用下面公式计算：

    +   P(Ci) = si / s

    +   其中，si 是类 Ci 中的训练样本数，而 s 是训练样本总数。

    +   (4) 当给定的数据集具有许多属性时，计算 P(X | Ci) 的开销可能非常大。为降低计算 P(X | Ci) 的开销，可以做成条件独立的朴素假定。对于给定样本的类标号，假定属性值相互条件独立，即在属性间不存在依赖关系。这样
    P(X | Ci) = ∏_{k=1}^{m} p(xk | Ci)，对于概率 P(x1 | Ci)，P(x2 | Ci)，…, P(xn | Ci) 可以训练样本估计，其中值得注意的是：


    +   1) 如果 Ak 是离散属性，则 P(xk | Ci) = sik / si，其中 sik 表示在属性 Ak，并且 Ak 具有值 xk 的类 Ci
    的训练样本数，而 si 是类 Ci 中的训练样本数；'
