    |  | 搜索引擎模式 | 野生 动物 动物园 有 很多 凶猛的 动物 |\n|  | 全模式 | 野生 野生动物 生动 动物 动物园 有 很多 凶猛的 动物\
    \ |\n\n下面进行结果分析，首先默认模式就是精确模式，即 cut_all=False。与全模式分词相比，精确模式分词的词量少且分词相对精确。精确模式常常用于文本分析。全模式把句子中所有可以成词的词语都扫描出来，速度非常快，但是不能解决歧义问题。搜索引擎模式在精确模式的基础上，对长词再次切分，提高召回率，通常适合用于搜索引擎需求下的分词。\n\
    \n小贴士：\n\njieba.cut 及 jieba.cut_for_search 返回数据的结构都是一个可迭代的生成器（generator），可以使用\
    \ for 循环来获得分词后得到的每一个词语，或者用 jieba.lcut 及 jieba.lcut_for_search 直接返回 list。\n\n##\
    \ 8.1.3 标注词性与添加定义词\n\n### 1. 标注词性\n\n在中文分词中，划分词性很重要，Jieba 分词可以标注分词的词性，词性类别表见表\
    \ 8-2。\n\n### 表 8-2 词性类别表\n\n| 词性编码 | 词性名称 | 说明 |\n|---|---|---|\n| ag | 形语素 |\
    \ 形容词性语素。形容词代码为 a，语素代码 g 前面置以 a |\n| a | 形容词 | 取形容词的英文 adjective 的第一个字母 |\n| ad\
    \ | 副形词 | 直接作状语的形容词。形容词代码 a 和副词代码 d 并在一起 |\n| an | 名形词 | 具有名词功能的形容词。形容词代码 a 和名词代码\
    \ n 并在一起 |\n| b | 区别词 | 取汉字“别”的声母 |\n| c | 连词 | 取连词的英文 conjunction 的第一个字母 |\n\
    | dg | 副语素 | 副词性语素。副词代码为 d，语素代码 g 前面置以 d |\n| d | 副词 | 取 adverb 的第二个字母，因其第一个字母已用于形容词\
    \ |\n| e | 感叹词 | 取感叹词的英文 exclamation 的第一个字母 |\n| f | 方位词 | 取汉字“方”的拼音首字母 f |\n\
    | g | 语素 | 绝大多数语素都能作为合成词的“词根”，取汉字“根”的声母 |\n| h | 前接成分 | 取英语单词 head 的第一个字母 |\n\
    | i | 成语 | 取成语的英义 idiom 的第一个字母 |\n| j | 简称略语 | 取汉字“简”的声母 |\n| k | 后接成分 | 后接成分词，一般很少用\
    \ |\n| l | 习用语 | 习用语尚未成为成语，有点“临时性”，取“临”的声母 |\n| m | 数词 | 取英语单词 numeral 的第三个字母，n、u\
    \ 已有他用 |\n| ng | 名词语素 | 名词语素。名词代码为 n，语素代码 g 前面置以 n |\n| n | 名词 | 取名词的英文 noun 的第一个字母\
    \ |\n| nr | 人名 | 名词代码 n 和“人(ren)”的声母并在一起 |\n| ns | 地名 | 名词代码 n 和处所词代码 s 并在一起 |\n\
    | nt | 机构团体 | “团”的声母为 t，名词代码 n 和 t 并在一起 |\n| nz | 其他专名 | “专”的声母的第一个字母为 z，名词代码\
    \ n 和 z 并在一起 |\n| o | 拟声词 | 取拟声词的英文 onomatopoeia 的第一个字母 |\n| p | 介词 | 取介词的英文 prepositional\
    \ 的第一个字母 |\n| q | 量词 | 取量词的英文 quantity 的第一个字母 |\n| r | 代词 | 取代词的英文 pronoun 的第二个字母，因\
    \ p 已用于介词 |\n| s | 处所词 | 取处所词的英文 space 的第一个字母 |\n| tg | 时语素 | 时间词性语素。时间词代码为 t，在语素的代码\
    \ g 前面置 t |\n| t | 时间词 | 取时间词的英文 time 的第一个字母 |\n| u | 助词 | 取助词的英文 auxiliary 的第二个字母\
    \ |\n| vg | 动词语素 | 动词词性语素。动词代码为 v，在语素的代码 g 前面置 v |\n| v | 动词 | 取动词的英文 verb 的第一个字母\
    \ |\n| vd | 副动词 | 直接作状语的动词。动词和副词的代码并在一起 |\n| vn | 名动词 | 指具有名词功能的动词。动词和名词的代码并在一起\
    \ |\n| w | 标点符号 | 标点符号 |\n| x | 非语素字 | 非语素字只是一个符号，字母 x 通常用于代表未知数、符号 |\n| y | 语气词\
    \ | 取汉字“语”的声母 |\n| z | 状态词 | 取汉字“状”的声母的前一个字母 |\n| un | 未知词 | 不可识别词及用户自定义词组，取英文\
    \ unknown 的前两个字母 |\n\n### 【例8-2】Jieba 分词标注词性\n\n输入：\n\n```\nimport jieba.posseg\
    \ as pseg\ntext=\"野生动物园有很多凶猛的动物\"\nword = pseg.cut(text)\nfor w in word:\n```\n\
    \n```\nif w.flag in [\"n\", \"v\"]:\n    print (\"w.word={}, w.flag={}\".format(w.word,\
    \ w.flag))\n```\n\n输出：\n\n```\nw.word=动物园, w.flag=n\nw.word=有, w.flag=v\nw.word=动物,\
    \ w.flag=n\n```\n\n词性用来描述一个词在上下文中的作用。例如，描述一个概念的词称为名词，在下文引用这个名词的词称为代词，如果我们要对语料库中的人名及地名进行识别，标注词性就显得尤为重要，根据具体的需求选择词性进行提取（分词词性见表8-2），以有效地完成项目目标。\n\
    \n### 2. 添加自定义词\n\n在利用 Jieba 分词时，调用的词库是 Jieba 分词自带的一个 dict.txt 字典，通常位于 Python\
    \ 存放包文件的目录 site-packages\\jieba。但是，由于默认的词库往往不能满足我们的需求，分词效果不佳，因此需要添加新词。例如，我的语料库来源全部都是旅游信息方面的语料，默认的词库并不是针对旅游方面的，如“5A\
    \ 景区”中的“5A”可能就不在 dict.txt 字典语料库中。这导致提取信息过程不够精准，影响后期的数据挖掘，这时就需要添加自定义词。\n\n### 【例8-3】添加自定义词“有很多”\n\
    \n输入：\n\n```\nimport jieba\ntext=\"野生动物园有很多凶猛的动物\"\njieba.add_word(\"有很多\")\n\
    str_quan1=jieba.cut(text, cut_all=False)\nprint(\"|\".join(str_quan1))\n```\n\n\
    输出：\n\n```\n野生|动物园|有很多|凶猛|的|动物\n```\n\n通过与表8-1 中 3 种模式分词效果表进行对比，可以看出，jieba.add_word(\"\
    有很多\")实现了添加自定义词的功能。\n\n小贴士：\n\nJieba 分词在分词方面功能非常强大，不仅包含上述特点，同时可以合并同义词、加载自定义词库和修改词频等。更多\
    \ Jieba 分词功能可以参考官网资料。\n\n## 8.2 关键词提取\n\n关键词提取技术是文本分类、文本聚类、信息检索等技术的基础，在自然语言处理领域有着非常广泛的应用。\n\
    \n## 8.2.1 TF-IDF 关键词提取\n\n关键词提取技术是自然语言处理的重要基础。随着信息科学技术的快速发展及互联网的普及，网络文本资源呈几何级数不断增长。面对更新日益频繁和规模庞大的文本数据，如何高效准确地实现关键词提取成为影响信息检索系统性能的关键。目前，不少学者结合中文自然语言的结构和中文关键词的特点，通过结合关键词的频率、位置关系及词性等特征，以优化关键词的提取性能。\n\
    \n### 1. TF-IDF 基本原理\n\n词频-逆文档频率（Term Frequency-Inverse Document Frequency, TF-IDF）是一种常用的用于信息检索与信息探勘的加权技术。TF-IDF\
    \ 是一种统计方法，用以评估一字词对于一个文件集或一个资料库中的其中一份文件的重要性度。字词的重要性随着它在文件中出现的次数成正比增加，但同时会随着它在语料库中出现的频率成反比下降。\n\
    \nTF-IDF 的主要思想是：如果某个词或短语在一篇文章中出现的频率高，并且在其他文章中很少出现，则认为此词或者短语具有很好的类别区分能力，适合用来分类。通常理解就是，一个词语在一篇文章中出现次数越多，同时在所有文档中出现次数越少，越能够代表该文章。\n\
    \nTF 指的是某一个给定的词语在该文件中出现的次数。这个数字通常会被归一化（一般是词频除以文件总词数），以防止它偏向长的文件，同一个词语在长文件里可能会比短文件有更高的词频，而不管该词语重要与否。\n\
    \n但是，需要注意，一些通用的词语对于主题并没有太大的作用，反倒有一些出现频率较少的词才能表达文章的主题，因此单纯使用 TF 是不合适的。权重设计必须满足：一个词预测主题的能力越强，权重越大；反之，权重越小。在所有统计的文章中，一些词只是在其中很少几篇文章中出现，那么这样的词对预测文章主题的作用才是重要的，这些词的权重应该设计得较大。IDF\
    \ 就是在完成这样的工作。TF 公式如下：\n\n$$TF_w = \\frac{在某一类中词条\\ w\\ 出现的次数}{该类中所有的词条数目}$$\n\n\
    $$t_{i,j} = \\frac{n_{i,j}}{\\sum_k n_{k,j}}$$\n\n其中，$n_{i,j}$ 是该词在文件 $d_j$ 中的出现次数，而分母则是在文件\
    \ $d_j$ 中所有字词的出现次数之和。\n\nIDF 的主要思想：如果包含词条 $t$ 的文档越少，IDF 越大，则说明词条具有很好的类别区分能力。某一特定词语的\
    \ IDF，可以由总文件数目除以包含该词语之文件的数目，再将得到的商取对数，得到公式如下：\n\n$$IDF = \\log\\left(\\frac{语料库的文档总数}{包含词条\\\
    \ w\\ 的文档数 + 1}\\right)$$\n\n$idf_i = \\log \\frac{|D|}{\\{|j: t_i \\in d_j\\\
    }| + 1}$\n\n注意，上述公式中分母加 1 是为了避免分母为 0。\n\n其中，|D|是语料库中的文档总数。\n\n|{j: t_i ∈ d_j}|\
    \ 表示包含词语 t_i 的文件数目（即 n_{i,j} ≠ 0 的文件数目），如果该词语不在语料库中，就会导致被除数为零，因此一般情况下使用 |{j: t_i\
    \ ∈ d_j}| + 1。\n\n最后，TF-IDF 公式为：\n\n$\\text{TF-IDF}=tf_{i,j}\\times idf_i$\n\n\
    ### 2. 基于 TF-IDF 算法的关键词抽取\n\n本部分将以 Jieba 分词下的 TF-IDF 为例进行实战，首先针对 jieba.analyse.extract_tags\
    \ 进行参数说明。\n\n```\njieba.analyse.extract_tags(sentence, topK=20, withWeight=False,\
    \ allowPOS=())\n```\n\n- sentence: 为待提取的文本。\n- topK: 表示返回关键词个数，默认值为 20。\n- withWeight:\
    \ 为关键词权重值，默认值为 False。\n- allowPOS: 指定词性，默认值为 空，即不筛选。\n\n### 【例 8-4】Jieba 分词的关键词提取\n\
    \n输入：\n\n```\nimport jieba.analyse\nimport math\n```\n\ntext=\"人工智能在国内获得快速发展，国家相继出台一系列支持人工智能发展的政策，各大科技企业也争相宣布其人工智能发展战略，资本更是对这一新兴领域极为倾心。作为新一轮产业变革的核心驱动力，中国的人工智能发展正在进入新阶段，而且中国有望成为引领全球人工智能发展的重要引擎。\"\
    \n\n```\nkeywords1=jieba.analyse.extract_tags(text)\nprint('关键词提取'+'/'.join(keywords1))\n\
    ```\n\n输出：\n\n```\n关键词提取 人工智能/发展/倾心/驱动力/争相/引擎/引领/变革/新一轮/各大/极为/相继/新兴/出台/中国/核心/更是/科技/一系列/快速\n\
    ```\n\n输入：\n\n```\nkeywords_top=jieba.analyse.extract_tags(text, topK=3)\n```\n\
    \n```\nprint('关键词 topk'+\"/\".join(keywords_top))\n```\n\n输出：\n\n关键词 topk 人工智能/发展/倾心\n\
    \n输入：\n\n```\n#有时不确定提取多少关键词，可利用总词的百分比\nprint('总词数{}'.format(len(list(jieba.cut(text)))))\n\
    ```\n\n输出：\n\n总词数 67\n\n输入：\n\n```\ntotal=len(list(jieba.cut(text)))\nget_cnt=math.ceil(total*0.1)\
    \  #向上取整\nprint('从%d 中取出%d 个词'%(total, get_cnt))\n```\n\n输出：\n\n从 67 中取出 7 个词\n\
    \n输入：\n\n```\nkeywords_top1=jieba.analyse.extract_tags(text, topK=get_cnt)\nprint('关键词\
    \ topk'+\"/\".join(keywords_top1))\n```\n\n输出：\n\n关键词 top 人工智能/发展/倾心/驱动力/争相/引擎/引领\n\
    \n从上述结果可以看出，当不指定 topK 的时候，默认输出为 20 个词，之后分别指定 topK=3 与输出百分比的形式，均在一定程度上体现了这段文字的价值导向以及人工智能的发展态势。\n\
    \n小贴士：\n\nTF-IDF 算法不仅仅存在于 Jieba 分词中，如机器学习模块 Scikit-learn 也同样支持。\n\n## 8.2.2 TextRank\
    \ 关键词提取\n\nTextRank 算法是一种用于文本的基于图的排序算法。其基本思想来源于谷歌的 PageRank 算法，即通过把文本分割成若干组成单元（单词、句子）并建立图模型，利用投票机制对文本中的重要成分进行排序，仅利用单篇文档本身的信息即可实现关键词提取、文摘提取。和\
    \ LDA、HMM 等模型不同，TextRank 不需要事先对多篇文档进行学习训练，因其简洁有效而得到广泛应用。\n\n### 1. TextRank 原理简介\n\
    \nTextRank 一般模型可以表示为一个有向有权图 G = (V, E)，由点集合 V 和边集合 E 组成，E 是 V × V 的子集。图中任意两点 Vi，Vj\
    \ 之间边的权重为 Wij，对于一个给定的点 Vi，In(Vi) 为指向该点的点集合，Out(Vi) 为 Vi 指向的点集合。点 Vi 的得分定义如下：\n\
    \nWS(Vi) = (1 - d) + d × Σ_{Vj ∈ In(Vi)} [ w_{ji} / Σ_{Vk ∈ Out(Vj)} w_{jk} ]\
    \ WS(Vj)\n\n其中，d 为阻尼系数，取值范围为 0～1，代表从图中某一特定点指向其他任意点的概率，一般取值为 0.85。使用 TextRank 算法计算图中各点的得分时，需要给图中的点指定任意的初值，并递归计算直到收敛，即图中任意一点的误差率小于给定的极限值时就可以达到收敛，一般该极限值取\
    \ 0.0001。等式左边表示一个 Vi 的权重 WS（weight sum），右侧的求和表示 In(Vi) 对 Vi 的贡献程度。在 Jieba 分词模块中，jieba.analyse.TextRank()\
    \ 的流程为：\n\n- (1) 将待抽取关键词的文本进行分词；\n- (2) 以固定窗口（默认为 5），完成词之间的共现关系；\n- (3) 计算每个顶点间的权重，完成无向带权图。\n\
    \n基于 TextRank 的关键词提取，首先理解什么是共现关系？将文本进行分词，去除停用词或词性筛选等之后，设定窗口长度为 K，即最多只能出现 K 个词，而后进行窗口滑动，在窗口中共同出现的词之间即可建立起无向边，如图\
    \ 8-1 所示。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_162_0.png)\n"
  mdcn: "\n中的 Jieba 分词包为例进行阐述。\n\nJieba 分词，也被称为“结巴”分词，同时支持繁体中文分词，而且存在众多编程语言版本，如 Java\
    \ 版本、C++版本、R 版本、PHP 版本和 Go 版本等。\n\n## 8.1.2 Jieba 分词的 3 种模式\n\nJieba 分词支持 3 种模式分词，分别为：精准模式、全模式及搜索引擎模式。\n\
    \n### 1. 精准模式\n\n将句子精确地切开，适合文本分析。jieba.cut 实现分词，通过布尔型参数 cut_all 确定分词模型，如果为 False，则为精准模式。\n\
    \n### 2. 全模式\n\n把句子中所有的可以成词的词语都扫描出来，速度非常快，但是不能解决歧义。jieba.cut 实现分词，通过布尔型参数 cut_all\
    \ 确定分词模型，如果为 True，则为全模式。\n\n### 3. 搜索引擎模式\n\n在精准模式的基础上，对长词再次切分，提高召回率，适用于搜索引擎分词。jieba.cut_for_search\
    \ 实现搜索引擎模式。\n\n下面通过例 8-1 对上述 3 种模式进行说明。\n\n### 【例 8-1】Jieba 分词的 3 种模式示例\n\n输入：\n\
    \n```\nimport jieba\n#全模式 cut_all=True\ntext=\"野生动物园有很多凶猛的动物\"\nstr_quan1=jieba.cut(text,\
    \ cut_all=True)\nprint(\"|\".join(str_quan1))\n```\n\n输出：\n\n野生|野生动物|生动|动物|动物园|有|很多|凶猛|的|动物\n\
    \n输入：\n\n```\n#精准模式\nstr_jing1=jieba.cut(text, cut_all=False)\nprint(\"|\".join(str_jing1))\n\
    ```\n\n输出：\n\n野生|动物园|有|很多|凶猛|的|动物\n\n输入：\n\n```\n#搜索引擎模式\nstr_sosol=jieba.cut_for_search(text)\n\
    print(\"|\".join(str_sosol))\n```\n\n输出：\n\n野生|动物|动物园|有|很多|凶猛的|动物\n\n对例 8-1 中的\
    \ 3 种模式中 “野生动物园有很多凶猛的动物” 的分词结果进行对比，见表 8-1。\n\n### 表 8-1 3种分词模式\n\n| 预分词语句 | 分词模式\
    \ | 语句对应分词集合 |\n|---|---|---|\n| 野生动物园有很多凶猛的动物 | 精确模式 | 野生 动物园 有 很多 凶猛的 动物 |\n\
    |  | 搜索引擎模式 | 野生 动物 动物园 有 很多 凶猛的 动物 |\n|  | 全模式 | 野生 野生动物 生动 动物 动物园 有 很多 凶猛的 动物\
    \ |\n\n下面进行结果分析，首先默认模式就是精确模式，即 cut_all=False。与全模式分词相比，精确模式分词的词量少且分词相对精确。精确模式常常用于文本分析。全模式把句子中所有可以成词的词语都扫描出来，速度非常快，但是不能解决歧义问题。搜索引擎模式在精确模式的基础上，对长词再次切分，提高召回率，通常适合用于搜索引擎需求下的分词。\n\
    \n小贴士：\n\njieba.cut 及 jieba.cut_for_search 返回数据的结构都是一个可迭代的生成器（generator），可以使用\
    \ for 循环来获得分词后得到的每一个词语，或者用 jieba.lcut 及 jieba.lcut_for_search 直接返回 list。\n\n##\
    \ 8.1.3 标注词性与添加定义词\n\n### 1. 标注词性\n\n在中文分词中，划分词性很重要，Jieba 分词可以标注分词的词性，词性类别表见表\
    \ 8-2。\n\n### 表 8-2 词性类别表\n\n| 词性编码 | 词性名称 | 说明 |\n|---|---|---|\n| ag | 形语素 |\
    \ 形容词性语素。形容词代码为 a，语素代码 g 前面置以 a |\n| a | 形容词 | 取形容词的英文 adjective 的第一个字母 |\n| ad\
    \ | 副形词 | 直接作状语的形容词。形容词代码 a 和副词代码 d 并在一起 |\n| an | 名形词 | 具有名词功能的形容词。形容词代码 a 和名词代码\
    \ n 并在一起 |\n| b | 区别词 | 取汉字“别”的声母 |\n| c | 连词 | 取连词的英文 conjunction 的第一个字母 |\n\
    | dg | 副语素 | 副词性语素。副词代码为 d，语素代码 g 前面置以 d |\n| d | 副词 | 取 adverb 的第二个字母，因其第一个字母已用于形容词\
    \ |\n| e | 感叹词 | 取感叹词的英文 exclamation 的第一个字母 |\n| f | 方位词 | 取汉字“方”的拼音首字母 f |\n\
    | g | 语素 | 绝大多数语素都能作为合成词的“词根”，取汉字“根”的声母 |\n| h | 前接成分 | 取英语单词 head 的第一个字母 |\n\
    | i | 成语 | 取成语的英义 idiom 的第一个字母 |\n| j | 简称略语 | 取汉字“简”的声母 |\n| k | 后接成分 | 后接成分词，一般很少用\
    \ |\n| l | 习用语 | 习用语尚未成为成语，有点“临时性”，取“临”的声母 |\n| m | 数词 | 取英语单词 numeral 的第三个字母，n、u\
    \ 已有他用 |\n| ng | 名词语素 | 名词语素。名词代码为 n，语素代码 g 前面置以 n |\n| n | 名词 | 取名词的英文 noun 的第一个字母\
    \ |\n| nr | 人名 | 名词代码 n 和“人(ren)”的声母并在一起 |\n| ns | 地名 | 名词代码 n 和处所词代码 s 并在一起 |\n\
    | nt | 机构团体 | “团”的声母为 t，名词代码 n 和 t 并在一起 |\n| nz | 其他专名 | “专”的声母的第一个字母为 z，名词代码\
    \ n 和 z 并在一起 |\n| o | 拟声词 | 取拟声词的英文 onomatopoeia 的第一个字母 |\n| p | 介词 | 取介词的英文 prepositional\
    \ 的第一个字母 |\n| q | 量词 | 取量词的英文 quantity 的第一个字母 |\n| r | 代词 | 取代词的英文 pronoun 的第二个字母，因\
    \ p 已用于介词 |\n| s | 处所词 | 取处所词的英文 space 的第一个字母 |\n| tg | 时语素 | 时间词性语素。时间词代码为 t，在语素的代码\
    \ g 前面置 t |\n| t | 时间词 | 取时间词的英文 time 的第一个字母 |\n| u | 助词 | 取助词的英文 auxiliary 的第二个字母\
    \ |\n| vg | 动词语素 | 动词词性语素。动词代码为 v，在语素的代码 g 前面置 v |\n| v | 动词 | 取动词的英文 verb 的第一个字母\
    \ |\n| vd | 副动词 | 直接作状语的动词。动词和副词的代码并在一起 |\n| vn | 名动词 | 指具有名词功能的动词。动词和名词的代码并在一起\
    \ |\n| w | 标点符号 | 标点符号 |\n| x | 非语素字 | 非语素字只是一个符号，字母 x 通常用于代表未知数、符号 |\n| y | 语气词\
    \ | 取汉字“语”的声母 |\n| z | 状态词 | 取汉字“状”的声母的前一个字母 |\n| un | 未知词 | 不可识别词及用户自定义词组，取英文\
    \ unknown 的前两个字母 |\n\n### 【例8-2】Jieba 分词标注词性\n\n输入：\n\n```\nimport jieba.posseg\
    \ as pseg\ntext=\"野生动物园有很多凶猛的动物\"\nword = pseg.cut(text)\nfor w in word:\n```\n\
    \n```\nif w.flag in [\"n\", \"v\"]:\n    print (\"w.word={}, w.flag={}\".format(w.word,\
    \ w.flag))\n```\n\n输出：\n\n```\nw.word=动物园, w.flag=n\nw.word=有, w.flag=v\nw.word=动物,\
    \ w.flag=n\n```\n\n词性用来描述一个词在上下文中的作用。例如，描述一个概念的词称为名词，在下文引用这个名词的词称为代词，如果我们要对语料库中的人名及地名进行识别，标注词性就显得尤为重要，根据具体的需求选择词性进行提取（分词词性见表8-2），以有效地完成项目目标。\n\
    \n### 2. 添加自定义词\n\n在利用 Jieba 分词时，调用的词库是 Jieba 分词自带的一个 dict.txt 字典，通常位于 Python\
    \ 存放包文件的目录 site-packages\\jieba。但是，由于默认的词库往往不能满足我们的需求，分词效果不佳，因此需要添加新词。例如，我的语料库来源全部都是旅游信息方面的语料，默认的词库并不是针对旅游方面的，如“5A\
    \ 景区”中的“5A”可能就不在 dict.txt 字典语料库中。这导致提取信息过程不够精准，影响后期的数据挖掘，这时就需要添加自定义词。\n\n### 【例8-3】添加自定义词“有很多”\n\
    \n输入：\n\n```\nimport jieba\ntext=\"野生动物园有很多凶猛的动物\"\njieba.add_word(\"有很多\")\n\
    str_quan1=jieba.cut(text, cut_all=False)\nprint(\"|\".join(str_quan1))\n```\n\n\
    输出：\n\n```\n野生|动物园|有很多|凶猛|的|动物\n```\n\n通过与表8-1 中 3 种模式分词效果表进行对比，可以看出，jieba.add_word(\"\
    有很多\")实现了添加自定义词的功能。\n\n小贴士：\n\nJieba 分词在分词方面功能非常强大，不仅包含上述特点，同时可以合并同义词、加载自定义词库和修改词频等。更多\
    \ Jieba 分词功能可以参考官网资料。\n\n## 8.2 关键词提取\n\n关键词提取技术是文本分类、文本聚类、信息检索等技术的基础，在自然语言处理领域有着非常广泛的应用。\n\
    \n## 8.2.1 TF-IDF 关键词提取\n\n关键词提取技术是自然语言处理的重要基础。随着信息科学技术的快速发展及互联网的普及，网络文本资源呈几何级数不断增长。面对更新日益频繁和规模庞大的文本数据，如何高效准确地实现关键词提取成为影响信息检索系统性能的关键。目前，不少学者结合中文自然语言的结构和中文关键词的特点，通过结合关键词的频率、位置关系及词性等特征，以优化关键词的提取性能。\n\
    \n### 1. TF-IDF 基本原理\n\n词频-逆文档频率（Term Frequency-Inverse Document Frequency, TF-IDF）是一种常用的用于信息检索与信息探勘的加权技术。TF-IDF\
    \ 是一种统计方法，用以评估一字词对于一个文件集或一个资料库中的其中一份文件的重要性度。字词的重要性随着它在文件中出现的次数成正比增加，但同时会随着它在语料库中出现的频率成反比下降。\n\
    \nTF-IDF 的主要思想是：如果某个词或短语在一篇文章中出现的频率高，并且在其他文章中很少出现，则认为此词或者短语具有很好的类别区分能力，适合用来分类。通常理解就是，一个词语在一篇文章中出现次数越多，同时在所有文档中出现次数越少，越能够代表该文章。\n\
    \nTF 指的是某一个给定的词语在该文件中出现的次数。这个数字通常会被归一化（一般是词频除以文件总词数），以防止它偏向长的文件，同一个词语在长文件里可能会比短文件有更高的词频，而不管该词语重要与否。\n\
    \n但是，需要注意，一些通用的词语对于主题并没有太大的作用，反倒有一些出现频率较少的词才能表达文章的主题，因此单纯使用 TF 是不合适的。权重设计必须满足：一个词预测主题的能力越强，权重越大；反之，权重越小。在所有统计的文章中，一些词只是在其中很少几篇文章中出现，那么这样的词对预测文章主题的作用才是重要的，这些词的权重应该设计得较大。IDF\
    \ 就是在完成这样的工作。TF 公式如下：\n\n$$TF_w = \\frac{在某一类中词条\\ w\\ 出现的次数}{该类中所有的词条数目}$$\n\n\
    $$t_{i,j} = \\frac{n_{i,j}}{\\sum_k n_{k,j}}$$\n\n其中，$n_{i,j}$ 是该词在文件 $d_j$ 中的出现次数，而分母则是在文件\
    \ $d_j$ 中所有字词的出现次数之和。\n\nIDF 的主要思想：如果包含词条 $t$ 的文档越少，IDF 越大，则说明词条具有很好的类别区分能力。某一特定词语的\
    \ IDF，可以由总文件数目除以包含该词语之文件的数目，再将得到的商取对数，得到公式如下：\n\n$$IDF = \\log\\left(\\frac{语料库的文档总数}{包含词条\\\
    \ w\\ 的文档数 + 1}\\right)$$\n\n$idf_i = \\log \\frac{|D|}{\\{|j: t_i \\in d_j\\\
    }| + 1}$\n\n注意，上述公式中分母加 1 是为了避免分母为 0。\n\n其中，|D|是语料库中的文档总数。\n\n|{j: t_i ∈ d_j}|\
    \ 表示包含词语 t_i 的文件数目（即 n_{i,j} ≠ 0 的文件数目），如果该词语不在语料库中，就会导致被除数为零，因此一般情况下使用 |{j: t_i\
    \ ∈ d_j}| + 1。\n\n最后，TF-IDF 公式为：\n\n$\\text{TF-IDF}=tf_{i,j}\\times idf_i$\n\n\
    ### 2. 基于 TF-IDF 算法的关键词抽取\n\n本部分将以 Jieba 分词下的 TF-IDF 为例进行实战，首先针对 jieba.analyse.extract_tags\
    \ 进行参数说明。\n\n```\njieba.analyse.extract_tags(sentence, topK=20, withWeight=False,\
    \ allowPOS=())\n```\n\n- sentence: 为待提取的文本。\n- topK: 表示返回关键词个数，默认值为 20。\n- withWeight:\
    \ 为关键词权重值，默认值为 False。\n- allowPOS: 指定词性，默认值为 空，即不筛选。\n\n### 【例 8-4】Jieba 分词的关键词提取\n\
    \n输入：\n\n```\nimport jieba.analyse\nimport math\n```\n\ntext=\"人工智能在国内获得快速发展，国家相继出台一系列支持人工智能发展的政策，各大科技企业也争相宣布其人工智能发展战略，资本更是对这一新兴领域极为倾心。作为新一轮产业变革的核心驱动力，中国的人工智能发展正在进入新阶段，而且中国有望成为引领全球人工智能发展的重要引擎。\"\
    \n\n```\nkeywords1=jieba.analyse.extract_tags(text)\nprint('关键词提取'+'/'.join(keywords1))\n\
    ```\n\n输出：\n\n```\n关键词提取 人工智能/发展/倾心/驱动力/争相/引擎/引领/变革/新一轮/各大/极为/相继/新兴/出台/中国/核心/更是/科技/一系列/快速\n\
    ```\n\n输入：\n\n```\nkeywords_top=jieba.analyse.extract_tags(text, topK=3)\n```\n\
    \n```\nprint('关键词 topk'+\"/\".join(keywords_top))\n```\n\n输出：\n\n关键词 topk 人工智能/发展/倾心\n\
    \n输入：\n\n```\n#有时不确定提取多少关键词，可利用总词的百分比\nprint('总词数{}'.format(len(list(jieba.cut(text)))))\n\
    ```\n\n输出：\n\n总词数 67\n\n输入：\n\n```\ntotal=len(list(jieba.cut(text)))\nget_cnt=math.ceil(total*0.1)\
    \  #向上取整\nprint('从%d 中取出%d 个词'%(total, get_cnt))\n```\n\n输出：\n\n从 67 中取出 7 个词\n\
    \n输入：\n\n```\nkeywords_top1=jieba.analyse.extract_tags(text, topK=get_cnt)\nprint('关键词\
    \ topk'+\"/\".join(keywords_top1))\n```\n\n输出：\n\n关键词 top 人工智能/发展/倾心/驱动力/争相/引擎/引领\n\
    \n从上述结果可以看出，当不指定 topK 的时候，默认输出为 20 个词，之后分别指定 topK=3 与输出百分比的形式，均在一定程度上体现了这段文字的价值导向以及人工智能的发展态势。\n\
    \n小贴士：\n\nTF-IDF 算法不仅仅存在于 Jieba 分词中，如机器学习模块 Scikit-learn 也同样支持。\n\n## 8.2.2 TextRank\
    \ 关键词提取\n\nTextRank 算法是一种用于文本的基于图的排序算法。其基本思想来源于谷歌的 PageRank 算法，即通过把文本分割成若干组成单元（单词、句子）并建立图模型，利用投票机制对文本中的重要成分进行排序，仅利用单篇文档本身的信息即可实现关键词提取、文摘提取。和\
    \ LDA、HMM 等模型不同，TextRank 不需要事先对多篇文档进行学习训练，因其简洁有效而得到广泛应用。\n\n### 1. TextRank 原理简介\n\
    \nTextRank 一般模型可以表示为一个有向有权图 G = (V, E)，由点集合 V 和边集合 E 组成，E 是 V × V 的子集。图中任意两点 Vi，Vj\
    \ 之间边的权重为 Wij，对于一个给定的点 Vi，In(Vi) 为指向该点的点集合，Out(Vi) 为 Vi 指向的点集合。点 Vi 的得分定义如下：\n\
    \nWS(Vi) = (1 - d) + d × Σ_{Vj ∈ In(Vi)} [ w_{ji} / Σ_{Vk ∈ Out(Vj)} w_{jk} ]\
    \ WS(Vj)\n\n其中，d 为阻尼系数，取值范围为 0～1，代表从图中某一特定点指向其他任意点的概率，一般取值为 0.85。使用 TextRank 算法计算图中各点的得分时，需要给图中的点指定任意的初值，并递归计算直到收敛，即图中任意一点的误差率小于给定的极限值时就可以达到收敛，一般该极限值取\
    \ 0.0001。等式左边表示一个 Vi 的权重 WS（weight sum），右侧的求和表示 In(Vi) 对 Vi 的贡献程度。在 Jieba 分词模块中，jieba.analyse.TextRank()\
    \ 的流程为：\n\n- (1) 将待抽取关键词的文本进行分词；\n- (2) 以固定窗口（默认为 5），完成词之间的共现关系；\n- (3) 计算每个顶点间的权重，完成无向带权图。\n\
    \n基于 TextRank 的关键词提取，首先理解什么是共现关系？将文本进行分词，去除停用词或词性筛选等之后，设定窗口长度为 K，即最多只能出现 K 个词，而后进行窗口滑动，在窗口中共同出现的词之间即可建立起无向边，如图\
    \ 8-1 所示。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_162_0.png)\n"
