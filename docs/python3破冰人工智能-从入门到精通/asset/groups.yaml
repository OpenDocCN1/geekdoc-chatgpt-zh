    # 内容提要


    本书创新性地从数学建模竞赛入手，深入浅出地讲解了人工智能领域的相关知识。本书内容基于 Python 3.6，从人工智能领域的数学出发，到 Python 在人工智能场景下的关键模块；从网络爬虫到数据存储，再到数据分析；从机器学习到深度学习，涉及自然语言处理、机器学习、深度学习、推荐系统和知识图谱等。


    此外，本书还提供了近 140 个代码案例和大量图表，全面系统地阐述了算法特性，个别案例算法来自于工作经验总结，力求帮助读者学以致用。


    本书不仅适用于人工智能技术初学者，也适合具有一定经验的技术人员阅读，还可作为高等院校计算机等相关专业师生的参考用书。


