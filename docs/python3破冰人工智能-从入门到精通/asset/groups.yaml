    \ Matplotlib 更加有效，但是使用这种面向对象的调用接口进行绘图比较烦琐，因此通常调用快速绘图命令。\n\n### 【例 4-10】初识 Matplotlib\
    \ 操作，程序运行结果如图 4-2 所示\n\n输入：\n\n```python\nimport numpy as np\nimport matplotlib.pyplot\
