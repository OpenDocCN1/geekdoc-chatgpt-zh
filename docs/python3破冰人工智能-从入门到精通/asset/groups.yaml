    最早是为可视化癫痫病人脑皮层电图的相关信号而研发的，因为它在函数的设计上参考了 Matlab，所以叫作 Matplotlib。在开源社区的推动下，当前各科学计算领域基于
    Python 的 Matplotlib 都得到了广泛应用。Matplotlib 的原作者 John D. Hunter 博士是一名神经生物学家，2012 年不幸因癌症去世，感谢他创建了这样一个伟大的库。


