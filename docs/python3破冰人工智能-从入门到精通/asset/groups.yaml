    hello,world\n```\n\n### 3）通过字典的 key\n\n在 Python 中，字典的使用频率非常之高，其经常由 JSON 类型转化得到。同时随着人工智能的发展，越来越多的數據需要字典类型的支持，比如\
    \ MongoDB 数据的形式就可以看成一种字典类型，还有推荐算法中的图算法也经常应用 key-value 形式来描述数据。format 通过 key 形式输出，如例\
    \ 2-8 所示。\n\n### 【例 2-8】format 字典形式输出\n\n输入：\n\n```python\nTom = {'age':27, 'gender':\
    \ 'M'}\nprint(\"{0[age]}\".format(Tom))\nprint(\"{p[gender]}\".format(p=Tom))\n\
    ```\n\n输出：\n\n```\n27\nM\n```\n\n### 4）通过对象的属性\n\nformat 还可以通过对象的属性进行输出操作，如例 2-9\
    \ 所示。\n\n### 【例 2-9】format 通过对象属性输出\n\n输入：\n\n```python\nclass Person:\n    def\
    \ __init__(self,name,age):\n        self.name = name\n        self.age = age\n\
    \n    def __str__(self):\n        return '{self.name} is {self.age} years old'.format(self=self)\n\
    \nprint(Person('Tom',18))\n```\n\n输出：\n\n```\nTom is 18 years old\n```\n\n###\
    \ 5) 字符串对齐并且指定对齐宽度\n\n有些时候我们需要输出形式符合某些规则，比如字符串对齐，填充常跟对齐一起使用，符号^、<、>分别是居中、左对齐、右对齐，后面带宽度，冒号后面带填充的字符，只能是一个字符。如果不指定，则默认是用空格填充，如例\
    \ 2-10 所示。\n\n### 【例 2-10】字符串对齐并且指定对齐宽度输出\n\n输入：\n\n```\nprint('默认输出：{},{ }'.format('hello','world'))\n\
    print('左右各取 10 位对齐：{:10s} , {:>10s}'.format('hello','world'))\nprint('取 10 位中间对齐：{:^10s},{:^10s}'.format('hello','world'))\n\
    print('取 2 位小数：{} is {:.2f}'.format(3.141592,3.141592))\nprint('数值的千位分隔符：{} is\
    \ {:,}'.format(123456789,1234567890))\n```\n\n输出：\n\n```\n默认输出： hello,world\n\
    左右各取 10 位对齐： hello            world\n取 10 位中间对齐：  hello     world\n取 2 位小数： 3.141592\
    \ is 3.14\n数值的千位分隔符： 123456789 is 1,234,567,890\n```\n\n表2-2 与表2-3 分别是整数与浮点数在字符串对齐与指定对齐宽度的案例。\n\
    \n表 2-2\n整数规则表\n| 数字 | 格 式 | 输 出 | 描 述 |\n|---|---|---|---|\n| 5 | {:0>2} | 05\
    \ | 数字补 0（填充左边，宽度为 2） |\n| 5 | {:x<4} | 5xxx | 数字补 x（填充右边，宽度为 4） |\n| 10 | {:x^4}\
    \ | x10x | 数字补 x（填充两侧，宽度为 4） |\n| 13 | {:10} | 13 | 右对齐（默认，宽度为 10） |\n| 13 | {:<10}\
    \ | 13 | 左对齐（宽度为 10） |\n| 13 | {:^10} | 13 | 中间对齐（宽度为 10） |\n\n表 2-3\n浮点数规则表\n\
    | 数字 | 格 式 | 输 出 | 描 述 |\n|---|---|---|---|\n| 3.1415926 | {:.2f} | 3.14 | 保留小数点后两位\
    \ |\n| 3.1415926 | {:+.2f} | +3.14 | 带符号保留小数点后两位 |\n| -1 | {:+.2f} | -1.00 | 带符号保留小数点后两位\
    \ |\n| 2.71828 | {:.0f} | 3 | 不带小数 |\n| 1000000 | {:,} | 1,000,000 | 以逗号分隔的数字格式\
    \ |\n| 0.25 | {:.2%} | 25.00% | 百分比格式 |\n| 1000000000 | {:.2e} | 1.00E+09 | 指数记法\
    \ |\n| 25 | {0:b} | 11001 | 转换成二进制 |\n| 25 | {0:d} | 25 | 转换成十进制 |\n| 25 | {0:o}\
    \ | 31 | 转换成八进制 |\n| 25 | {0:x} | 19 | 转换成十六进制 |\n\n## 2.2.3 列表、元组、字典\n\n在 Python\
    \ 中，最基本的数据结构是序列。Python 包含 6 种内建的序列，即列表、元组、字符串、Unicode 字符串、buffer 对象和 range 对象。序列通用的操作包括：索引、长度、组合（序列相加）、重复（乘法）、分片、检查成员、遍历、最小值和最大值。序列中的每个元素被分配了一个序号，即元素的位置，称为索引。第一个索引是\
    \ 0，第二个是 1，而倒数第一个元素可以标记为 -1，倒数第二个为 -2，依次类推。序列的元素可以是之前讲的所有基础数据类型，也可以是另一个序列，还可以是之后我们将要介绍的对象。最常用的序列有两类：元组（tuple）和列表（list）。列表可以修改，而元组不可以修改。\n\
    \n### 1. 列表\n\n列表由一系列按特定顺序排列的元素组成。你可以创建包含字母表中所有字母、数字 0～9 或所有家庭成员姓名的列表，也可以将任何东西加入列表中，其中的元素之间可以没有任何关系。\n\
    \n### （1）初始列表\n\nPython 中，使用方括号[]创建列表，各元素通过逗号分隔，如下所示：\n\n```python\nlist1 = ['Python','AI']\n\
    list2 = [1,2,3,4,3]\nlist3 = [\"p\",\"y\",\"t\",\"h\",\"o\",\"n\",['Python','AI']]\n\
    ```\n\n### （2）列表函数和方法\n\n如表 2-4 所示。\n\n表 2-4 列表函数和方法\n\n| 基本操作 | 说 明 | 示 例 |\n\
    |---|---|---|\n| len(list) | 返回列表元素个数 | len(list2) ⇒ 2 |\n| max(list) | 返回列表元素中最大值\
    \ | max(list2) ⇒ 4 |\n| min(list) | 返回列表元素最小值 | min(list2) ⇒ 1 |\n| list.append(obj)\
    \ | 在列表末尾添加新的对象 | list2.append('a') ⇒ list2=[1, 2, 3, 4, 3, 'a'] |\n| list.count(obj)\
    \ | 统计某个元素在列表中出现的次数 | list2.count(3) ⇒ 2 |\n| list.extend(seq) | 在列表末尾一次性追加另一个序列中的多个值（用新列表扩展原来的列表）\
    \ | list1.extend(list2) ⇒ list1=['Python', 'AI', 1, 2, 3, 4, 3] |\n| list.index(obj)\
    \ | 从列表中找出某个值第一个匹配项的索引位置 | list2.index(3) ⇒ 2 |\n| list.insert(index, obj) | 将列表中\
    \ index 索引位置元素，并在此处索引位置插入 obj 到列表中 | list2.insert(2,\"a\") ⇒ list2=[1, 2, 'a',\
    \ 3, 4, 3] |\n| list.pop([index=-1]) | 移除列表中的一个元素（默认最后一个元素），并且返回该元素的值 | list2.pop(1)\
    \ ⇒ list2=[1, 3, 4, 3] |\n| list.remove(obj) | 移除列表中某个值的第一个匹配项 | list2.remove(3)\
    \ ⇒ list2=[1, 2, 4, 3] |\n| list.reverse() | 反向列表中元素 | list2.reverse()⇒list2=[3,\
    \ 4, 3, 2, 1] |\n| list.sort(cmp=None, key=None, reverse=False) | 对原列表进行排序 | list2.sort()⇒list2=[1,\
    \ 2, 3, 3, 4] |\n| list.clear() | 清空列表 | list2.clear()⇒list2=[] |\n| list.copy()\
    \ | 复制列表 | list2.copy()⇒[1, 2, 3, 4, 3] |\n\n注：如果一个对象本身不是 str ascii 或 repr 格式，那么可以使用\
    \ !s、!a、!r，将其转成 str、ascii 以及 repr。\n\n### 2. 元组\n\n列表非常适合用于存储在程序运行期间可能变化的数据集。列表是可以修改的，这对处理网站的用户列表或游戏中的角色列表至关重要。然而，有时可能需要创建一系列不可修改的元素，元组便可以满足这种需求。Python\
    \ 将不能修改的值称为不可变的，而不可变的列表被称为元组。\n\n元组跟列表一样，属于序列的一员，不同的是它是不变序列，即一旦被定义，其长度和内容就固定了。在\
    \ Python 中，使用小括号()创建元组，各元素通过逗号分隔。\n\n```\ntuple1 = ('Python', 'AI')\ntuple2 =\
    \ (1,2,3,4,3)\ntuple3 = \"a\", \"b\", \"c\", \"d\";  # 不需要括号也可以\n```\n\n元组中的元素值是不允许修改与删除的，但我们可以对元组进行连接组合：\n\
    \n```\ntup = tuple1 + tuple3 ⇒ tup = ('Python', 'AI', 'a', 'b', 'c', 'd')\n```\n\
    \n元组的内置函数参考列表的内置函数即可，即将 list 替换成 tuple，同时列表与元组之间可以互相转化，由列表转化为元组通过 list(tuple)完成，由元组转化为列表通过\
    \ tuple(list)完成。相比于列表，元组是更简单的数据结构。如果需要在程序的整个生命周期内存储一组不变的值，可使用元组。\n\n### 小贴士：\n\
    \n元组中只包含一个元素时，需要在元素后面添加逗号，否则括号会被当作运算符使用，如 tup1 = (1)和 tup2 = (1,)。在 tup1 中没有使用逗号，其类型为\
    \ int；tup2 中加上了逗号，其类型为元组。\n\n### 3. 序列操作\n\n列表和元组同样属于 Python 下的序列，均支持序列操作。下面以列表为例进行说明，见表\
    \ 2-5。\n\n表 2-5 序列操作\n\n| 操作 | 示例 |\n|---|---|\n| 索引 | list2[0] ⇒1 list2[-1] ⇒3\
    \ |\n| 使用分片访问的是元素基本样式[下限:上限:步长],默认步长为1 | list2[1:3] ⇒[2, 3] list2[0:3:2] ⇒[1,\
    \ 3] |\n| 赋值 | list2[1]=\"a\" ⇒list2=[1, 'a', 3, 4, 3] |\n| 序列相加 | list1+list2\
    \ ⇒['Python', 'AI', 1, 2, 3, 4, 3] |\n| 序列乘法 | list1*3 ⇒['Python', 'AI', 'Python',\
    \ 'AI', 'Python', 'AI'] |\n| 序列的循环调用 | for a in list1: print(a) ⇒ Python AI |\n\
    \n### 4. 字典\n\n本节主要介绍能够将相关信息关联起来的 Python 字典。在 Python 中，字典是一系列键-值（key-value）对。每个键都与一个值相关联，你可以使用键来访问与之相关联的值。与键相关联的值可存储任意类型对象，包括数字、字符串、列表甚至字典。事实上，可将任何\
    \ Python 对象用作字典中的值。\n\n在 Python 中，字典用大括号{}中的一系列键-值对表示。字典的每个键-值对用冒号分隔，每个对之间用逗号分隔，格式为\
    \ dict={key1:value1,key2: value2, key3:value3}，创建字典的实例为 dict1 = {'Name': 'Bob','Age':\
    \ 21}。\n\n下面来简单举例字典的基本操作，首先对于字典 dict1，访问字典中的元素，获取与键相关联的值，可依次指定字典名和放在方括号内的键，如表\
    \ 2-6 所示。\n\n表 2-6 字典基本操作\n\n| 常见操作 | 说明 | 示例 |\n|---|---|---|\n| len(dict) |\
    \ 计算字典元素个数，即键的总和 | len(dict1) ⇒2 |\n| str(dict) | 输出字典，可以打印的字符串表示 | str(dict1)\
    \ ⇒{'gender': 'M', 'Name': 'Bill'} 结果类型为字符串类型 |\n| dict1[key] | 访问字典中键对应的值 | dict1['Name']\
    \ ⇒ Bob |\n| dict1.get(key) | 访问字典中键对应的值 | dict1.get(\"Name\")⇒ Bob |\n| dict1[newkey]=value\
    \ | 为字典增加一项，增加新的键值对 | dict1[\"gender\"]='M'⇒dict1={'Age': 21, 'gender': 'M', 'Name':\
    \ 'Bob'} |\n| dict1[key]=newvalue | 增加新的键-值对 | dict1[\"Name\"]=\"Bill\" ⇒ dict1={'Age':\
    \ 21, 'gender': 'M', 'Name': 'Bill'} |\n| dict1.pop(key [,default]) | 删除字典给定键所对应的值\
    \ | dict1.pop(\"Age\")⇒ {'Name': 'Bill', 'gender': 'M'} |\n| dict1.values() |\
    \ 遍历字典的值，以列表返回一个字典所有的值 | dict1.values()⇒dict_values(['Bill', 'M']) |\n| dict1.keys()\
    \ | 遍历字典的键，以列表返回一个字典所有的键 | dict1.keys()⇒dict_keys(['Name', 'gender']) |\n| dict1.items()\
    \ | 遍历字典的项，以列表返回可遍历的（键、值）元组数组 | dict1.items()⇒dict_items([('Name', 'Bill'), ('gender',\
    \ 'M')]) |\n| key in dict | 如果键在字典 dict 里，返回 True，否则返回 False | 'Name' in dict1⇒True\
    \ |\n| key not in dict | 如果键不在字典 dict 里，返回 True，否则返回 False | 'Name' not in dict1⇒False\
    \ |\n\n以上列举了常见的字典操作。字典在 Python 中扮演着重要的角色，如果你想成为一名合格的 Python 使用者，不仅需要熟练掌握列表、元组与字典的基本操作，还需要对其比较复杂情况的处理有一定了解。比如在字典操作中出现镶嵌字典形式，只需要依据以上的基本操作进行扩展即可。\n\
    \n小贴士：\n在 Python 中，字典中的键必须是唯一的，但值不必唯一。\n\n## 2.2.4 条件语句与循环语句\n\n### 1. 条件语句\n\n\
    Python 中的条件语句一般是指 if 语句，if 语句用于改变 Python 程序中的控制流。通过指定条件的真假结果，可以判断要执行哪条语句。Python\
    \ 中 if 语句的最简单形式如例 2-11 所示。\n\n### 【例 2-11】if 语句基本形式\n\n```\nif condition1:\n \
