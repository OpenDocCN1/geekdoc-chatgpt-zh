    # 1. 分类问题


    分类问题解决的是目标对象属于哪个预定义的类。举个例子，判断一条评论是好评还是差评就是一个分类问题。


    分类，是数学建模中最常用的方法之一，分类一般分为二分类（二值问题）或者是多分类问题。


    2000 年全国大学生数学建模竞赛 A 题就是一个典型的分类问题，原题目如下。


    # 2000 年 A 题 DNA 序列分类


    2000 年 6 月，人类基因组计划中 DNA 全序列草图完成，预计 2001 年可以完成精确的全序列图，此后人类将拥有<|message|>一本记录着自身生老病死及遗传进化的全部信息的“天书”。这本大自然写成的“天书”是由
    4 个字符——A、T、C 和 G——按一定顺序排成的长约 30 亿字符的序列，其中没有“断句”也没有标点符号，除了这 4 个字符表示 4 种碱基以外，人们对它包含的“内容”知之甚少，难以读懂。破译这部世界上最巨量信息的“天书”是
    21 世纪人类最重要的任务之一。研究 DNA 全序列结构，以及这 4 个字符排成的看似随机的序列中隐藏着的规律，是解读这部天书的基础，是生物信息学（Bioinformatics）最重要的课题之一。


    虽然人类对这部“天书”知之甚少，但也发现了 DNA 序列中的一些规律性和结构。例如，在全序列中有一些用于编码蛋白质的序列片段，即由这 4 个字符组成的 64
    种不同的 3 字符串，其中大多数用于编码构成蛋白质的 20 种氨基酸。又例如，在不用于编码蛋白质的序列片段中，A 和 T 的含量特别多，于是以某些碱基特别丰富作为特征去研究
    DNA 序列的结构也取得了一些结果。此外，利用统计的方法还发现序列的某些片段之间具有相关性，等。


    这些发现让人们相信，DNA 序列中存在着局部的和全局性的结构，充分发掘序列的结构对理解 DNA 全序列是十分有意义的。目前，在这项研究中最普遍的思想是省略序列的某些细节，突出特征，然后将其表示成适当的数学对象。这种被称为粗粒化和模型化的方法，往往有助于研究规律性和结构。


