  mdcn: "\n![](img/b804a95e802d3360c99b6f8e75c7d047_206_0.png)\n\n▲ 图 11-6 例 11-7\
    \ 程序运行结果\n\n## 小贴士：\n\nGraphviz 是由大名鼎鼎的贝尔实验室的几位 “牛人” 开发的一款画图工具，它的理念是 “所想即所得”，通过\
