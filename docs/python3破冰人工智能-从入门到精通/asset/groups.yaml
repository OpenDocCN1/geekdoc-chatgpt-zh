    在说明之前，我们先简单了解一下 CAP、ACID、BASE 理论，具体见表 6-5。


    **表 6-5 CAP、ACID、BASE 理论**


    | CAP | ACID | BASE |

    |---|---|---|

    | C, 即 Consistency, 一致性 | A, 即 Atomicity, 原子性, 事务中的所有操作, 要么全部成功, 要么全部不做 | Basically
    Available, 基本可用 |

    | A, 即 Availability, 可用性 (指的是快速获取数据) | C, 即 Consistency, 一致性. 在事务开始与结束时, 数据库处于一致状态
    | Soft-state, 软状态/柔性事务 |

    | P, Tolerance of network Partition 分区容忍性 (分布式) | I, 即 Isolation, 隔离性. 事务如同只有这一个操作被数据库所执行
    | Eventual Consistency, 最终一致性 |

    | — | D, 即 Durability, 持久性. 在事务结束时, 此操作将不可逆转 | — |


    BASE 模型是传统 ACID 模型的反面。不同于 ACID, BASE 强调牺牲高一致性, 从而获得可用性, 数据允许在一段时间内不一致, 只要保证最终一致就可以了。Web2.0
    网站由于数据库存在高并发读写、高可扩展性、高可用性, 从而要求设计成分布式存储。而在设计分布式存储系统时, 根据 CAP 理论, 一致性 (C)、可用性 (A)
    和分区容错性 (P), 三者不可兼得, 最多只能同时满足其中的两个。关系型数据库保证了强一致性 (ACID 模型) 和高可用性, 所以要想实现分布式数据库集群非常困难,
    这也解释了为什么关系型数据库的扩展能力十分有限。而 NoSQL 数据库则是采用 BASE 模型, 通过牺牲强一致性, 保证最终一致性, 来设计分布式系统,
    从而使得系统可以达到很高的可用性和扩展性。


    对 Web 2.0 网站来说, 可用性与分区容忍性优先级要高于数据一致性, 一般会尽量朝着 A 和 P 的方向设计, 但事实上, 数据库系统最大的优势就是保障了一致性,
    单纯为了 P (分布式) 而放弃 C (一致性) 也是不可取的, 所以需要通过其他手段来保证一致性。


    # 6.3.2 数据库结合


    从表 6-5 的 CAP 理论来看, 分布式存储系统更适合用 NoSQL 数据库, 现有的 Web2.0 网站遇到的性能以及扩展性瓶颈也会迎刃而解。但是目前
    NoSQL 数据库的实际应用缺陷又让我们难以放心, 这时我们考虑是否可以将 NoSQL 数据库与关系型数据库结合使用? 在强一致性 (C), 高可用性场景采用
    ACID 模型; 在高可用性和扩展性场景, 采用 BASE 模型。答案是肯定的, 目前的 NoSQL 数据库还难以与关系型数据库一争高下, 但它却可以对关系数据库在性能和扩展性上进行弥补,
    所以我们可以把 NoSQL 和关系数据库结合使用, 各取所长。


    下面举个典型的例子加以说明。在 Web 2.0 网站中比较典型的需求是用户评论的存储, 评论表大致可分为评论表主键 ID、被评论用户 ID、评论用户 ID、评论时间、评论内容等字段。结合关系型数据库与
    NoSQL 数据库的特点, 我们可将需要查询的字段, 比如评论表主键 ID、被评论用户 ID、评论用户 ID、评论时间等数据、时间类型的小字段存储在关系型数据库中,
    根据查询建立相应的索引。而评论内容是个大文本字段, 我们肯定不会通过文本内容进行查询, 所以把评论内容存储在 NoSQL 数据库中。'
