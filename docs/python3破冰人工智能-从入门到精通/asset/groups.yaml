    \n## （2）format 格式化字符串\n\nformat 是 Python 2.6 版本中新增的一个格式化字符串的方法，相对于老版的%格式方法，它有很多优点，也是官方推荐使用的方式，%方式将会被后面的版本淘汰。该函数把字符串当成一个模板，通过传入的参数进行格式化，并且使用大括号{}作为特殊字符代替%。\n\
    \n### 1）通过位置来填充\n\n通过位置来填充，format 会把参数按位置顺序来填充到字符串中，第一个参数是 0，然后是 1，不带编号，即{}，通过默认位置来填充字符串，见例\
    \ 2-6。\n\n### 【例 2-6】 format 按位置输出\n\n输入：\n\n```\nprint(\"{} {}\".format(\"hello\"\
    ,\"world\"))\n```\n\n输出：\n\nhello world\n\n输入：\n\n```\nprint(\"{0} {0} {1}\".format(\"\
    hello\",\"world\"))\n```\n\n输出：\n\nhello hello world\n\n同一个参数可以填充多次，这是 format\
    \ 比%先进的地方。\n\n### 2）通过索引\n\n后面章节会讲到，列表、元组在程序中经常用到的最基本的数据结构是序列（sequence），当需要传递序列给\
    \ format 时，通过索引即可映射传递，如例 2-7 所示。\n\n### 【例 2-7】 format 索引输出\n\n输入：\n\n```\nstr=\"\
    hello\"\nlist=[\"hello\",\"world\" ]\ntuple=(\"hello\",\"world\")\nprint(\"{0[1]}\"\
    .format(str))\nprint(\"{0[0]},{0[1]}\".format(list))\nprint(\"{0[0]},{0[1]}\"\
    .format(tuple))\n```\n\n输出：\n\n```\ne\nhello,world\nhello,world\n```\n\n输入：\n\n\
    ```python\nprint(\"{p[1]}\".format(p=str))\nprint(\"{p[0]},{p[1]}\".format(p=list))\n\
    print(\"{p[0]},{p[1]}\".format(p=tuple))\n```\n\n输出：\n\n```\ne\nhello,world\n\
    hello,world\n```\n\n### 3）通过字典的 key\n\n在 Python 中，字典的使用频率非常之高，其经常由 JSON 类型转化得到。同时随着人工智能的发展，越来越多的數據需要字典类型的支持，比如\
    \ MongoDB 数据的形式就可以看成一种字典类型，还有推荐算法中的图算法也经常应用 key-value 形式来描述数据。format 通过 key 形式输出，如例\
    \ 2-8 所示。\n\n### 【例 2-8】format 字典形式输出\n\n输入：\n\n```python\nTom = {'age':27, 'gender':\
    \ 'M'}\nprint(\"{0[age]}\".format(Tom))\nprint(\"{p[gender]}\".format(p=Tom))\n\
    ```\n\n输出：\n\n```\n27\nM\n```\n\n### 4）通过对象的属性\n\nformat 还可以通过对象的属性进行输出操作，如例 2-9\
    \ 所示。\n\n### 【例 2-9】format 通过对象属性输出\n\n输入：\n\n```python\nclass Person:\n    def\
