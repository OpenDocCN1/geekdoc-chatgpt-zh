    ```\n\n输出：\n\n3\n\n## 2. 循环语句\n\n许多编程语言必须具有能够重复执行一系列语句的构造。循环调用代码，即重复执行的代码被称为循环的主体。Python\
    \ 提供两种不同的循环: while 循环和 for 循环。图 2-6 与 2-7 分别为两种循环流程图。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_53_0.png)\n\
    \n▲图 2-6 while 循环流程图\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_53_1.png)\n\n\
    ▲图 2-7 for 循环流程图\n\n在 Python 中，while 循环语句的形式见例 2-16。\n\n### 【例 2-16】while 循环语句的形式\n\
    \n```\nwhile expression:\n    statements\n```\n\nstatements 可以是单个语句，也可以是语句块；expression\
    \ 表示判断条件，如果为真，则执行循环体语句。\n\n像 while 循环一样，for 循环也是一种编程语言语句，即迭代语句，它允许代码块重复一定次数。几乎所有编程语言中都存在\
    \ for 循环，但其风格各不相同，即语法和语义在不同的编程语言中都是不相同的。在 Python 中，for 循环语句的形式见例 2-17。\n\n###\
    \ 【例 2-17】for 循环语句的形式\n\n```\nfor iterating_var in sequence:\n    statements(s)\n\
    ```\n\n### 2.2.5 break、continue、pass\n\n在一个完整的工程项目中，经常会以不同形式使用条件控制和循环控制，为了方便灵活地执行代码，需要添加\
    \ break、continue、pass 等语句，如例 2-17 所示。\n\n### 【例 2-18】构建循环\n\n```\n#正常执行 for 循环\n\
    ```\n\n输入：\n\n```\nfor i in range(5):\n    print(\"i=%d\"%i)\n```\n\n输出：\n\n```\n\
    i=0\ni=1\ni=2\ni=3\ni=4\n```\n\nbreak 语句可用于跳出循环，终止循环语句，即循环条件没有 False 条件或者序列还没被完全遍历完，也会停止执行循环语句。break\
    \ 所在的循环体已经结束，执行该循环语句下面的语句。break 语句用在 while 和 for 循环中。例 2-18 是一个正常的 for 循环，例 2-18.1\
    \ 是 break 跳出循环体操作。\n\n### 【例 2-18.1】break 语句\n\n输入：\n\n```\nfor i in range(5):\n\
    \    if i==3:\n        break\n    print(\"i=%d\"%i)\n```\n\n输出：\n\n```\ni=0\n\
    i=1\ni=2\n```\n\n例 2-18 是一个简单的 for 循环，循环 5 次打印出 0、1、2、3、4。例 2-18.1 代码的 for 循环中添加了关键字\
    \ break，若 i=3 不成立，则继续循环，否则执行 break 语句，实际上程序只输出了 0、1、2，便跳出循环体，终止循环语句。因此我们可以知道，break\
    \ 这个关键字的作用是让程序跳出循环体的同时终止循环。\n\nbreak 是跳出整个循环，而 continue 语句则表示跳出本次循环，用来告诉 Python\
    \ 停止本次循环，继续执行剩下的循环，即跳过当前循环的剩余语句，然后继续进行下一轮循环。continue 语句用在 while 和 for 循环中。例 2-18\
    \ 是一个正常的 for 循环，例 2-18.2 是 continue 停止本次循环的操作示例。\n\n### 【例 2-18.2】 continue 语句\n\
    \n输入：\n\n```\nfor j in range(5):\n    if j==3:\n        continue\n    print(\"\
    j=%d\"%j)\n```\n\n输出：\n\n```\nj=0\nj=1\nj=2\nj=4\n```\n\n与例 2-18.1 代码类似，例 2-18\
    \ 原有的 for 循环代码基础上添加了关键字 continue。通过运行结果，我们发现本循环中间有一次中断，j=3 没有输出，也就是第四次中断了。但与 break\
    \ 不同的是，接下去的循环依旧正常进行。由此我们可以知道，continue 的作用是终止本次循环，但不跳出循环，后面的循环正常进行。\n\nPython 中的\
    \ pass 是空语句，是为了保持程序结构的完整性。pass 不做任何事情，也就是说它是一个空操作，一般用于占位语句，如例 2-19 所示。\n\n###\
    \ 【例 2-19】 pass 语句\n\n```\ndef sample():\n    pass\n```\n\n例 2-19 定义了一个 sample\
    \ 函数，该处的 pass 占据一个位置，因为如果定义一个空函数，程序会报错。所以当你没有想好函数的内容时，可以用 pass 填充，以使程序正常运行。\n\n\
    ## 2.3 Python 高级操作\n\n### 2.3.1 lambda\n\nlambda 关键字在 Python 表达式内创建匿名函数。然而 Python\
    \ 语法限制了 lambda 函数的定义体，只能使用纯表达式。换句话说，lambda 函数的定义中不能赋值，也不能使用 while 和 try 等 Python\
    \ 语句。\n\nPython 使用 lambda 表达式来创建匿名函数。\n\n- lambda 只是一个表达式，函数体比 def 简单很多。\n- lambda\
    \ 的主体是一个表达式，而不是一个代码块，只能在 lambda 表达式中封装有限的逻辑进去。\n- lambda 函数拥有自己的名字空间，且不能访问自有参数列表之外或全局名字空间里的参数。\n\
    - 虽然 lambda 函数看起来只能写一行，却不等于 C 或 C++ 的内联函数，后者的目的是调用小函数时不占用栈内存，从而提升运行效率。\n\nlambda\
    \ 函数的一般语法非常简单，形式为：lambda argument_list: expression。参数由逗号分隔的参数列表组成，表达式是使用这些参数的算术表达式。你可以将该函数分配给一个变量以赋予其名称。例\
    \ 2-20 中 lambda 函数示例返回其两个参数的总和。\n\n### 【例 2-20】lambda 函数案例\n\n输入：\n\n```\nsum=lambda\
    \ x,y:x+y\nprint(sum(3,4))\n```\n\n输出：\n\n7\n\n在例 2-20 中，sum 函数可以通过使用以下常规函数定义来获得相同的效果。\n\
    \n```\ndef sum(x,y):\n    return x + y\n```\n\n### 2.3.2 map\n\nmap 是 Python 的高级函数，为函数式编程提供便利，形式为\
    \ map(func, *iterables)：第一个参数 func 是一个函数的名字；第二个参数为一个序列（例如一个列表）。map 将函数 func 应用于序列的所有元素。在\
    \ Python 3 之前，map 用于返回一个列表，其中结果列表的每一个元素都是应用于列表或元组序列相应元素上的 func 结果。在 Python 3 中，map\
    \ 返回一个迭代器。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_56_0.png)\n\n例 2-21 是一个最简单的例子，基于\
    \ f(x)=x²，map 作用于 list [1, 2, 3, 4, 5, 6, 7, 8, 9]后的结果，返回结果仍为 list，其作用原理见图 2-8。\n\
    \n### 【例 2-21】map 示例\n\n输入：\n\n```\nseq_list=[1, 2, 3, 4, 5, 6, 7, 8, 9]\nF =list(map(lambda\
    \ x:x**2,seq_list))\nprint(F)\n```\n\n输出：\n\n```\n[1, 4, 9, 16, 25, 36, 49, 64,\
    \ 81]\n```\n\nmap 可以应用于多个列表，列表不必具有相同的长度。map 会将 lambda 函数应用于参数列表的元素，即它首先应用于具有第\
    \ 0 个索引的元素，然后应用于具有第一个索引的元素，直到达到第 n 个索引，如例 2-22 所示，\n\n### 【例 2-22】 map 应用于多个列表\n\
    \n输入：\n\n```\na = [1,2,3,4]\nb = [5,6,7,8]\nc = [5,6,7]\nab=list(map(lambda x,y:x\
    \ + y,a,b))\nprint(ab)\n```\n\n输出：\n\n```\n[6, 8, 10, 12]\n```\n\n如果一个列表中的元素少于其他元素，则当最短列表消耗完时，map\
    \ 将停止，具体见例 2-23。\n\n### 【例 2-23】 map 应用于多个列表不同元素情况\n\n输入：\n\n```\na = [1,2,3,4]\n\
