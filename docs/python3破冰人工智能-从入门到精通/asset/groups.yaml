    # 8.3 word2vec 介绍


    2013 年，Google 团队发布了 word2vec，它的特点是将所有的词向量量化（word embedding）。word2vec 工具主要包含两个模型——跳字模型（skip-gram）和连续词袋模型（CBOW①），以及两种高效的训练方法——负采样（negative
    sampling）与层序 softmax（hierarchical softmax）。在本章中，我们将介绍词向量以及相应的语言模型，做到“知其然，亦知其所以然”。


    # 8.3.1 word2vec 基础原理简介


    +   1. 词向量


    词向量，顾名思义，就是用一个向量的形式表示一个词。为什么这么做？机器学习任务需要把任何输入量化成数值表示，然后充分利用计算机的计算能力，得出最终想要的结果。


    NLP 中最直观，也是到目前为止常用的词表示方法是 One-hot Representation，这种方法把每个词表示为一个很长的向量。首先，统计出语料中的所有词汇，然后对每个词汇编号，针对每个词建立
    V 维的向量，向量的每个维度表示一个词，因此对应编号位置上的维度数值为 1，其他维度全为 0。


    下面通过一个例子进行介绍。例如，“话筒”与“麦克”这两个词，它们的词向量分别表示如下。“话筒”表示为 [0001000000000000...]“麦克”表示为
    [0000000010000000...]


    ① CBOW 是 Continuous Bag-of-Words Model 的缩写，是一种与前向 NNLM 类似的模型，不同之处在于 CBOW 去掉了最耗时的非线性隐藏层且所有词共享隐藏层。'
  - '[PAGE 165]


    如果采用稀疏方式存储这种 One-hot Representation，将会非常简洁：也就是给每个词分配一个数字 ID。可以这样理解，每个词都是茫茫“0”海中的一个“1”，如在刚才的例子中，话筒记为
    3，麦克记为 8（索引从 0 开始记）。


    如果要编程实现，那么用散列（Hash）表给每个词分配一个编号就可以了。这样简洁的表示方法再配合最大熵、SVM 和 CRF 等算法，已经可以很好地完成 NLP
    领域的各种常见任务。但是，它也存在下列一些问题。


    +   (1) 维度灾难：维度很大。当词汇较多时，可能达到百万维，造成维度灾难。

    +   (2) 词汇鸿沟：任意两个词之间都是孤立的。仅从这两个向量中看不出两个词是否有关系，哪怕是话筒和麦克这样的同义词也不例外。


    深度学习中一般用到的词向量并不是刚才所提及的 One-hot Representation 表示的那种很长的词向量，而是用 Distributed Representation。Distributed
    Representation 最早是 Hinton 在 1986 年的论文 Learning distributed representations of
    concepts 中提出的。就是用一种能够刻画语义之间的相似度并且维度较低的稠密向量表示词向量。这种向量将词表示为 [0.793, −0.177, −0.107,
    0.109, 0.542, …]的矩阵，通常该矩阵设置为 50 维或 100 维，通过计算向量之间的距离，来体现词与词之间的相似性，解决词汇鸿沟的问题。


    Distributed Representation 最大的贡献就是让相关或者相似的词在距离上更接近了。向量的距离可以用最传统的欧氏距离来衡量，也可以余弦相似度来衡量。用这种方式表示的向量，“麦克”和“话筒”的距离会远远小于“麦克”和“天气”，可能在理想情况下“麦克”和“话筒”的表示是完全一样的。但是由于有些人会把英文名“迈克”也写成“麦克”，导致“麦克”一词带上了一些人名的语义，因此不会和“话筒”完全一致。


    # 2. 哈夫曼编码


    ![](img/b804a95e802d3360c99b6f8e75c7d047_165_0.png)


    哈夫曼编码（Huffman Coding），又称霍夫曼编码，是一种编码方式。哈夫曼编码是可变字长编码（VLC）的一种。Huffman 于 1952 年提出一种编码方法，该方法完全依据字符出现概率来构造异字头的平均长度最短的码字，有时也称为最佳编码。


    下面通过一个例子来进行介绍。假设一个文本文件中只包含 7 个字符{A, B, C, D, E, F, G}，这 7 个字符在文本中出现的次数依次为{5, 24,
    7, 17, 34, 5, 13}，利用哈夫曼树可以为文件构造出符合前缀编码要求的不等长编码，如图 8-2 所示。具体做法如下：


    +   (1) 将文件中的 7 个字符都作为叶子节点，每个字符出现次数作为该叶子节点的权值；

    +   (2) 规定哈夫曼树中所有左分支表示字符 0，所有右分支表示字符 1，将依次从根节点到每个叶子节点所经过的分支的二进制位的序列作为该节点对应的字符编码；

    +   (3) 由于从根节点到任何一个叶子节点都不能经过其他叶子，这种编码一定是前缀编码，哈夫曼树的带权路径长度正好是文件编码的总长度。


    哈夫曼编码是一种无前缀编码，解码时不会混淆，主要应用在数据压缩、加密解密等场合。'
