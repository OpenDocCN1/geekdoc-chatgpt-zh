    # 11.2.4 基尼系数


    我们知道，在 ID3 算法中我们使用了信息增益来选择特征，优先选择信息增益大的。在 C4.5 算法中，采用了信息增益比来选择特征，以减少信息增益容易选择特征值多的特征的问题。但是无论是
    ID3 还是 C4.5，都是基于信息论的熵模型，这里会涉及大量的对数运算。能不能简化模型同时也不至于完全丢失熵模型的优点呢？答案是有的！CART 分类树算法使用基尼系数来代替信息增益比，基尼系数代表了模型的不纯度，基尼系数越小，则不纯度越低，特征越好。这和信息增益（比）是相反的。


    $$Gini(D)=\sum_{K=1}^{|y|}\sum_{k''=k+1}^{|y|}p_kp_{k''}=1-\sum_{k=1}^{|y|}p_k^2$$


    直观来说，Gini(D)反映了数据集 D 中随机抽取两个样本类别标记不一致的概率，因此，Gini(D)越小，则数据集 D 的纯度越高。


    采用与式（11-2）相同的符号表示，属性 a 的 Gini 系数定义为：


    $$Gini\_index(D,a)=\sum_{v=1}^{|D^v|}\frac{|D^v|}{|D|}Gini(D^v)$$


    于是，我们在候选属性集合 A 中，选择划分后的基尼系数最小的属性作为最优的划分属性，即 $a_* = \arg\min_{a\in A} Gini\_index(D,a)$。以
    Humidity 维度为例，其存在两种选择，具体演示计算过程如表 11-4 所示。


    表 11-4

    Humidity 维度属性统计


    | Play | Normal 属性 | High 属性 |

    |---|---|---|

    | yes | 6 | 2 |

    | no | 7 | 2 |


    $$Gini(Normal)=1-\left(\frac{6}{13}\right)^2-\left(\frac{7}{13}\right)^2=0.497\quad
    Gini(High)=1-\left(\frac{2}{4}\right)^2-\left(\frac{2}{4}\right)^2=0.5$$


    $$Gini\_index(D,Humidity)=\frac{4}{17}\times0.5+\frac{13}{17}\times0.497=0.497705$$


    对于维度，其存在 3 种选择，只需分别计算求和即可，具体本书不再演示，有兴趣的读者可以自行计算。


