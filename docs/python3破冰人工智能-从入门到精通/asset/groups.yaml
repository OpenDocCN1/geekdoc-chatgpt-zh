    ## 9.2.3 检验、预测与控制


    ### 1. 平方和分解公式


    对任意一组数据 $(x_1,y_1),\dots,(x_n,y_n)$，恒有：


    $$\sum_{i=1}^{n}(y_i-\bar y)^2 = \sum_{i=1}^{n}(y_i-\hat y_i)^2 + \sum_{i=1}^{n}(\hat
    y_i-\bar y)^2$$


    证明：$\sum_{i=1}^{n}(y_i-\bar y)^2 = \sum_{i=1}^{n}(y_i-\hat y_i)^2 + 2\sum_{i=1}^{n}(y_i-\hat
    y_i)(\hat y_i-\bar y) + \sum_{i=1}^{n}(\hat y_i-\bar y)^2$


    而


    $$\sum_{i=1}^{n}(y_i-\hat y_i)(\hat y_i-\bar y)=\sum_{i=1}^{n}[y_i-(\hat\beta_0+\hat\beta_1x)][\hat\beta_0+\hat\beta_1x-(\hat\beta_0+\hat\beta_1\bar
    x)]$$ $$=\sum_{i=1}^{n}[(y_i-\bar y)-\hat\beta_1(x_i-\bar x)]\cdot\hat\beta_1(x_i-\bar
    x)^2$$ $$=\hat\beta_1\sum_{i=1}^{n}[(y_i-\bar y)(x_i-\bar x)-\hat\beta_1(x_i-\bar
    x)^2]=0$$


    记作：


    $$S_T=\sum_{i=1}^{n}(y_i-\bar y)^2\quad\text{为总离差平方和}$$ $$S_R=\sum_{i=1}^{n}(\hat
    y_i-\bar y)^2\quad\text{为回归平方和}$$ $$S_E=\sum_{i=1}^{n}(y_i-\hat y_i)^2\quad\text{为残差平方和}$$


    其中，$S_R=\sum_{i=1}^{n}(\hat y_i-\bar y)^2=\hat\beta_1^2\sum(x_i-\bar x)^2$ $\sum(x_i-\bar
    x)^2$ 为偏差平方和。


    定理 9.1：$S_R/\sigma^2 \sim \chi^2(1)$，$S_E/\sigma^2 \sim \chi^2(n-2)$

    $$F=\frac{S_R}{S_E/(n-2)} \sim F(1,n-2)\qquad(9-7)$$


    ### 2. 回归模型的显著性检验


    对回归方程 $Y=\beta_0+\beta_1x$ 的显著性检验，归结为对假设 $H_0:\beta_1=0; H_1:\beta_1\neq0$ 进行检验。假设
    $H_0:\beta_1=0$ 被拒绝，则回归显著，认为 $y$ 与 $x$ 存在线性关系，所求的线性回归方程有意义；否则回归不显著，$y$ 与 $x$ 的关系不能用一元线性回归模型来描述，所得到的回归方程也无意义。本书将介绍
    3 种常见的检验方法。


    （1）F 检验法


    当 $H_0$ 成立时，$F = \frac{U}{Q_e/(n-2)} \sim F(1,\,n-2)$。


    其中，$U = \sum_{i=1}^{n} (\hat{y}_i - \bar{y})^2$（回归平方和）。


    故 $F > F_{1-\alpha}(1,n-2)$，拒绝 $H_0$，否则就接受 $H_0$。


    （2）$t$ 检验法


    当 $H_0$ 成立时，$T = \frac{\sqrt{L_{xx}}\,\hat{\beta}_1}{\hat{\sigma}_e} \sim t(n-2)$。


    故 $|T| > t_{\alpha/2}(n-2)$，拒绝 $H_0$，否则就接受 $H_0$。


    其中，$L_{xx} = \sum_{i=1}^{n} (x_i - \bar{x})^2 = \sum_{i=1}^{n} x_i^2 - n\bar{x}^2$。


    （3）$r$ 检验法


    记 $H_0: \rho = 0$，$H_1: \rho \neq 0$。


    检验统计量 $r = \frac{\sum (x_i - \bar{x})(y_i - \bar{y})}{\sqrt{\sum (x_i - \bar{x})^2
    \sum (y_i - \bar{y})^2}} = \frac{L_{xy}}{\sqrt{L_{xx}L_{yy}}}$。


    拒绝域 $W = \{|r| > r_{1-\alpha}(n-2)\}$，其中 $r_{1-\alpha} = \sqrt{\frac{1}{1 + (n-2)/F_{1-\alpha}(1,n-2)}}$。


    $r$ 检验法通常称为相关系数的检验法，当 $|r| > r_{1-\alpha}(n-2)$ 时，有 $(1-\alpha)\%$ 的把握认为 $x$ 与
    $y$ 之间具有线性关系。有时在判定一个线性回归之间的拟合优度的好坏时，$R^2$ 系数通常是一个重要的判定系数。


    ### 3. 预测和控制


    所谓预测问题是指已知预测因子 $x = x_0$，求预测对象 $y_0 = \beta_0 + \beta_1 x + \varepsilon$ 的点估计和区间估计问题。


    （1）点预测：$\hat{y} = \hat{\beta}_0 + \hat{\beta}_1 x$。


    （2）区间预测。当 $\varepsilon_1,\dots,\varepsilon_n$ 相互独立，且都服从 $N(0,\sigma^2)$ 时：


    $T = \frac{y_0 - \hat{y}_0}{s\sqrt{1 + \frac{1}{n} + \frac{(x_0 - \bar{x})^2}{L_{xx}}}}
    \sim t(n-2)$ 其中 $s = \sqrt{\frac{S_E}{n-2}}$


    由此得 $y_0$ 的置信区间为：$\left[\hat{y}_0 - t_{1-\alpha/2}\,s\sqrt{1 + \frac{1}{n} + \frac{(x_0
    - \bar{x})^2}{L_{xx}}},\; \hat{y}_0 + t_{1-\alpha/2}\,s\sqrt{1 + \frac{1}{n} +
    \frac{(x_0 - \bar{x})^2}{L_{xx}}}\right]$ （9-8）


    当 n 较大，x₀ 接近 x̄ 时，可用 u₁₋α/₂ 代替 t₁₋α/₂，得：


    [ŷ₀−u₁₋α/₂ s, ŷ₀+u₁₋α/₂ s]


    ### 4. 计算推导案例


    设给定一组数据 (x₁,y₁),…,(xₙ,yₙ)，按以下公式计算回归模型。


    (1) 先计算：


    x̄ = 1/n Σᵢ₌₁ⁿ xᵢ    ȳ = 1/n Σᵢ₌₁ⁿ yᵢ


    Lₓₓ = Σᵢ₌₁ⁿ (xᵢ−x̄)² = Σᵢ₌₁ⁿ xᵢ² − n x̄²


    Lᵧᵧ = Σᵢ₌₁ⁿ (yᵢ−ȳ)² = Σᵢ₌₁ⁿ yᵢ² − n ȳ²


    (2) 再计算：


    Lₓᵧ = Σᵢ₌₁ⁿ (xᵢ−x̄)(yᵢ−ȳ) = Σᵢ₌₁ⁿ xᵢyᵢ − n x̄ ȳ


    β̂₁ = Lₓᵧ / Lₓₓ    β̂₀ = ȳ − β̂₁ x̄


    S_E = Lᵧᵧ − S_R    S_R = β̂₁² Lₓₓ


    F = S_R / (S_E / (n-2))    s = √(S_E / (n−2))    r = Lₓᵧ / √(Lₓₓ Lᵧᵧ)


