    表 1-3 抛掷骰子结论表


    |  | 互斥 | 对立 | 相互独立 |

    |---|---|---|---|

    | A 与 B | 是 | 是 | 不 |

    | A 与 C | 不 | 不 | 是 |

    | B 与 C | 不 | 不 | 是 |

    | A 与 D | 不 | 不 | 不 |

    | A 与 E | 是 | 不 | 是 |


    通过上面的案例，我们可以归纳得到以下 3 点结论。


    +   1) 对于事件 A 和 B，若它们所含结果组成的集合彼此互不相交，则它们为互斥事件，其意义为事件 A 与 B 不可能同时发生。

