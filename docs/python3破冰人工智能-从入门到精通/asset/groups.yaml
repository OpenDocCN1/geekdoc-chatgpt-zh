    # 前 3 行 (布尔数组长度等于行数)<br>df[df[''A'']>0] # A 列值大于 0 的行<br>df[(df[''A'']>0) | (df[''B'']>0)]
    # A 列值大于 0，或者 B 列大于 0 的行<br>df[(df[''A'']>0) & (df[''C'']>0)] # A 列值大于 0，并且 C
    列大于 0 的行 | 标签索引、标签列表、标签相关的 Callable<br>□ 单个标签，例如5或''a'' (注意，5被解释为索引的标签)<br>□ 标签的列表或数组[''a'',''b'',''c'']<br>□
