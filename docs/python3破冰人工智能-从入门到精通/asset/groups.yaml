    | pad/ffill | 向前填充值 |\n| bfill/backfill | 向后填充值 |\n\n注: 处理时间序列数据，使用 pad/ffill\
    \ 十分常见，因此“最后已知值”在每个时间点都可用。fill()函数等效于 fillna(method='ffill'), bfill()等效于 fillna(method='bfill')。\n\
    \n输入：\n\n```\nprint(\"以列均值来替换列中的空值, df2.fillna(df2.mean()\n['one':'three'])\\\
    n{}\".format(df2.fillna(df2.mean()['one':'three'])))\n```\n\n输出：\n\n```\n以列均值来替换列中的空值,\
    \ df2.fillna(df2.mean()['one':'three'])=\none   two   three four  five\na  6.5\
    \ -100.0   7.0  bar  False\nb  6.5  -36.8 -16.2 NaN  NaN\nc  8.0  -99.0 -99.0\
    \ bar  True\nd  6.5  -36.8 -16.2 NaN  NaN\ne  6.0   2.0   3.0 bar  True\nf  3.0\
    \   6.0   5.0 bar  True\ng  6.5  -36.8 -16.2 NaN  NaN\nh  9.0   7.0   3.0 bar\
    \  True\n```\n\n通常我们想用其他值替换任意值。在 Series / DataFrame 中可以使用 replace 方法，它提供了一种高效而灵活的方法来执行此类替换。\n\
    \n### 【例 4-7】基于例 4.5 df2 进行缺失值处理\n\n输入：\n\n```\nprint(\"使用另一个值替换单个值或值列表，df2.replace(-99,\
    \ 99)=\\n{}\".format(df2.replace(-99, 99)))\n```\n\n输出：\n\n```\n使用另一个值替换单个值或值列表，df2.replace(-99,\
    \ 99)=\none   two   three four  five\na NaN -100.0   7.0  bar  False\nb NaN  \
    \ NaN   NaN  NaN  NaN\nc  8.0  99.0  99.0 bar  True\nd NaN   NaN   NaN  NaN  NaN\n\
    e  6.0   2.0   3.0 bar  True\nf  3.0   6.0   5.0 bar  True\ng NaN   NaN   NaN\
    \  NaN  NaN\nh  9.0   7.0   3.0 bar  True\n```\n\n输入：\n\n```\nprint(\"指定单列替换，df2[['two']].replace(-99,\
    \ 99)=\\n{}\".format(df2[['two']].replace(-99, 99)))\n```\n\n输出：\n\n```\n指定单列替换，df2[['two']].replace(-99,\
    \ 99)=\ntwo\na -100.0\nb   NaN\nc   99.0\nd   NaN\ne    2.0\nf    6.0\ng   NaN\n\
    h 7.0\n```\n\n输入：\n\n```\n#等价于 df2.replace([-99,-100],[99,100]), 使用值列表替换值列表\n\
    print(\"指定映射 dict=\\n{}\".format(df2.replace({-99:99, -100:100})))\n```\n\n输出：\n\
    \n```\n指定映射 dict=\n   one  two  three  four  five\na  NaN  100.0  7.0  bar  False\n\
    b  NaN  NaN  NaN  NaN  NaN\nc  8.0  99.0  99.0  bar  True\nd  NaN  NaN  NaN  NaN\
    \  NaN\ne  6.0  2.0  3.0  bar  True\nf  3.0  6.0  5.0  bar  True\ng  NaN  NaN\
    \  NaN  NaN  NaN\nh  9.0  7.0  3.0  bar  True\n```\n\n通常在数据预处理过程中，如果数据特征维度量比较大，我们会丢弃一些弱特征。如果在\
    \ DataFrame 中需要标识和删除重复行，有两种有效的方法：duplicated 和 drop_duplicates。每个都将用作标识重复行的列作为参数。\n\
    \n- duplicated: 返回布尔向量，其长度为行数，并指示行是否重复。\n- drop_duplicates: 删除重复的行。\n\n默认情况下，重复集的第一个观察到的行被认为是唯一的，但每个方法都有一个\
    \ keep 参数来指定要保留的目标。\n\n- keep='first' (默认): 除第一次出现之外，标记/删除重复项。\n- keep='last':\
    \ 标记/删除除了最后一次出现的副本。\n- keep=False: 标记/删除所有重复项。\n\n### 【例4-8】标识和删除重复行\n\n输入：\n\n\
    ```\nprint(\"每行完全一样才算重复，返回布尔向量，重复返回 True，不重复为 False，结果为 Series 类型\")\nprint(df2.duplicated())\n\
    ```\n\n输出：\n\n```\n每行完全一样才算重复，返回布尔向量，重复返回 True，不重复为 False，结果为 Series 类型\na   \
    \ False\nb    False\nc    False\nd     True\ne    False\nf False\ng True\nh False\n\
    dtype: bool\n```\n\n通过 df2.duplicated() 返回一个 Series, 其中 d 行与 g 行数据全部为\"nan\",\
    \ 完全重复, 返回 True, 其他返回 False。\n\n输入：\n\n```\nprint(\"针对'one'列除第一次出现之外, 之后出现均被标记,\
    \ 返回为 True\")\nprint(df2.duplicated('one', keep='first'))\n```\n\n输出：\n\n```\n\
    针对'one'列除第一次出现之外, 之后出现均被标记, 返回为 True\na False\nb True\nc False\nd True\ne False\n\
    f False\ng True\nh False\ndtype: bool\n```\n\n输入：\n\n```\nprint(\"针对'one'列除第一次出现之外,\
    \ 之后出现删除重复项\")\nprint(df2.drop_duplicates('one', keep='first'))\n```\n\n输出：\n\n\
    ```\n针对'one'列除第一次出现之外, 之后出现删除重复项\none two three four five\na NaN -100.0 7.0 bar\
    \ False\nc 8.0 -99.0 -99.0 bar True\ne 6.0 2.0 3.0 bar True\nf 3.0 6.0 5.0 bar\
    \ True\nh 9.0 7.0 3.0 bar True\n```\n\n输入：\n\n```\nprint(\"针对'one'列删除除了最后一次出现的重复项\"\
    )\nprint(df2.drop_duplicates('one', keep='last'))\n```\n\n输出：\n\n```\n针对'one'列删除除了最后一次出现的重复项\n\
    one two three four five\nc  8.0  -99.0  -99.0  bar  True\ne  6.0  2.0    3.0 \
    \   bar  True\nf  3.0  6.0    5.0    bar  True\ng  NaN  NaN    NaN    NaN   NaN\n\
    h  9.0  7.0    3.0    bar  True\n```\n\n输入：\n\n```\nprint(\"针对'one'列，删除所有重复项\"\
    )\nprint(df2.drop_duplicates('one', keep=False))\n```\n\n输出：\n\n```\n针对'one'列，删除所有重复项\n\
    one  two  three  four  five\nc  8.0  -99.0  -99.0  bar  True\ne  6.0  2.0    3.0\
    \    bar  True\nf  3.0  6.0    5.0    bar  True\nh  9.0  7.0    3.0    bar  True\n\
    ```\n\n## 4.2 Matplotlib 可视化图库\n\n### 4.2.1 初识 Matplotlib\n\nMatplotlib 是 Python\
