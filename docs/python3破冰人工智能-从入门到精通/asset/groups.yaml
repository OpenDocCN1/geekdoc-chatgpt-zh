    ## 1.2 人工智能下的数学


    本章主要介绍人工智能下经常用到的数学知识、常用的统计知识、基本的矩阵运算和高等数学基础知识，它们是后续章节讨论具体人工智能算法的基础，数学基础较好的读者可以直接跳过本章。


    ### 1.2.1 统计量


    统计量是统计理论中用来对数据进行分析、检验的变量，下面介绍一些常用的统计量。


    总体，是人们研究对象的全体，又称母体，如工厂一天生产的全部产品（按合格品及废品分类）、学校全体学生的身高，等等。


    总体中的每一个基本单位称为个体，个体的特征用一个变量（如 x）来表示，如一件产品是合格品，记作 x=0，若是废品，记作 x=1；一个身高 170cm 的学生，记作
    x=170。


    从总体中随机产生的若干个个体的集合称为样本，或子样，如 n 件产品、100 名学生的身高，或者一根轴直径的 10 次测量。实际上这就是从总体中随机取得的一批数据，不妨记作
    x₁, x₂, …, xₙ，其中 n 称为样本容量。


    简单地说，统计的任务是由样本推断总体。


    假设有一个容量为 n 的样本（即一组数据），记作 x = (x₁, x₂, …, xₙ)，需要对它进行一定的加工，才能提出有用的信息，用作对总体（分布）参数的估计和检验。统计量就是加工出来的、反映样本数量特征的函数，它不含任何未知量。


    下面我们介绍几种常用的统计量。


    - (1) 表示位置的统计量——算术平均值和中位数


    算术平均值（简称均值）描述数据取值的平均位置，记作 x̄。


    x̄ = 1/n Σ_{i=1}^n x_i  (1-1)


    中位数是将数据由小到大排序后位于中间位置的那个数值。


    - (2) 表示变异程度的统计量——标准差、方差和极差


    标准差 s 定义为：


    s = [ 1/(n-1) Σ_{i=1}^n (x_i - x̄)^2 ]^{1/2}  (1-2)


    它是各个数据与均值偏离程度的度量，这种偏离不妨称为变异。


    方差是标准差的平方 s²。


    极差是 x = (x₁, x₂, …, xₙ) 的最大值与最小值之差。


    你可能注意到，在标准差 s 的定义式 (1-2) 中，对 n 个 (x_i - x̄) 的平方求和，却被 (n-1) 除，这是出于无偏估计的要求。


    ### （3）中心矩、表示分布形状的统计量——偏度和峰度


    随机变量 $x$ 的 $r$ 阶中心矩为 $E(x-E(x))^r$。随机变量 $x$ 的偏度和峰度，指的是 $x$ 的标准化变量 $(x-E(x))/\sqrt{D(x)}$
    的三阶中心矩和四阶中心矩，如下所示：


    $$\nu_1 = E\left[\left(\frac{x-E(x)}{\sqrt{D(x)}}\right)^3\right] = \frac{E[(x-E(x))^3]}{\left(D(x)\right)^{3/2}}$$
    $$\nu_2 = E\left[\left(\frac{x-E(x)}{\sqrt{D(x)}}\right)^4\right] = \frac{E[(x-E(x))^4]}{\left(D(x)\right)^2}$$


    偏度反映分布的对称性，$\nu_1>0$ 称为右偏态，此时位于均值右边的数据比位于左边的数据多；$\nu_1<0$ 称为左偏态，情况相反；而 $\nu_1$
    接近 0，则可认为分布是对称的。


    峰度是分布形状的另一种度量，正态分布的峰度为 3，若 $\nu_2$ 比 3 大得多，表示分布有沉重的尾巴，说同样本中含有较多远离均值的数据，因而峰度可以用作衡量偏离正态分布的尺度之一。


    ### 1.2.2 矩阵概念及运算


    为了理解人工智能下的相关算法原理，需要了解一些高等数学与线性代数的知识，如果想把学术论文上的算法用代码实现，需要你有比较好的数学基础。本节介绍人工智能中比较常用的矩阵知识。


