    \ 支持 | 支持 |\n| CART | 分类，回归 | 二叉树 | 基尼系数，均方差 | 支持 | 支持 | 支持 |\n\n## 11.3 决策树实战\n\
    \n### 11.3.1 决策树回归\n\n通过 Scikit-learn 模块构建决策树模型，通过 Scikit-learn 导入 tree 模块之后利用\
