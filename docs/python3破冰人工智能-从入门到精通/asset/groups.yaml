    # 8. QR 分解


    QR（正交三角）分解也是矩阵分解的一种常用方法，如果实（复）非奇异矩阵 A 能化成正（酉）矩阵 Q 与实（复）非奇异上三角矩阵 R 的乘积，即 A=QR，则称其为
    A 的 QR 分解。


    QR 分解法是目前求一般矩阵全部特征值的最有效且广泛应用的方法。一般矩阵先经过正交相似变化成为 Hessenberg 矩阵，然后应用 QR 方法求特征值和特征向量。它是将矩阵分解成一个正规正交矩阵
    Q 与上三角矩阵 R，所以称为 QR 分解法。本书重在帮助读者入门，QR 知识相对复杂，因此不在这里进行介绍，有兴趣的读者可以去查看官网。


    # 3.2.7 NumPy 的广播机制


    在利用 Python 进行矩阵运算时，经常会报 ValueError，比如出现“ValueError: operands could not be broadcast
    together with shapes (4,) (5).”上面错误的原因就是数据运算过程中违背了广播原则。通俗来讲，广播原则就是一种维度处理原则，广播操作会使程序更加简洁高效。


    广播（Broadcasting）原则：如果两个数组的后缘维度（即从末尾开始算起的维度）的轴长相符或其中一方的长度为 1，则认为它们是广播兼容的，广播会在缺失或长度为
    1 的轴上进行。当我们使用 ufunc 函数对两个数组进行计算时，ufunc 函数会对这两个数组的对应元素进行计算，因此它要求这两个数组有相同的大小（即维度相同）。如果两个数组的维度不同的话，为了避免多重循环，会进行如下的广播处理。


    +   (1) 让所有输入数组都向其中维度最长的数组看齐，维度中不足的部分都通过在前面加 1 补充。

    +   (2) 输出数组的维度是输入数组维度的各个轴上的最大值。

    +   (3) 如果输入数组的某个轴和输出数组的对应轴的长度相同或者其长度为 1 时，这个数组能够用来计算，否则出错。

    +   (4) 当输入数组的某个轴的长度为 1 时，沿着此轴运算时都用此轴上的第一组值。


    如果任何一个维度是 1，那么另一个不为 1 的维度将被用作最终结果的维度。也就是说，为 1 的维度将延展与另一个维度匹配。


    下面从维度方面列举一些广播的应用实例，A 和 B 两个序列中尺寸为 1 的维度在广播过程中都被延展了。


    ```

    A      (4d array):  8 x 1 x 6 x 1

    B      (3d array):        7 x 1 x 5

    Result (4d array):  8 x 7 x 6 x 5

    ```


    接着通过实际案例来理解广播的原理。'
