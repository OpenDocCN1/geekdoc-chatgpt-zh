    \ 4.11111111  4.55555556  5.        ]\n```\n\n### 4. logspace 生成等比数列\n\n在创建数值有规律的数组中，linspace\
    \ 方法生成的是等差数列，指定的区间内返回间隔均匀的值。logspace 方法则用于生成的是等比数列，其方法为：\n\n```\nnumpy.logspace(start,\
    \ stop,num=50, endpoint=True, base=10.0, dtype=None)\n```\n\n- start: float, 基底\
    \ base 的 start 次幂作为左边界。\n- stop: float, 基底 base 的 stop 次幂作为右边界。\n- num: 生成的样本数，默认值50。\n\
