    \ else 分支，else 分支必须位于 if 语句的末尾，即其他 elif 分支不能跟随。见例 2-12 形式，同时为了方便理解，在例 2-13 中给出了具体的案例。\n\
    \n### 【例 2-12】 if 多条件语句\n\n```\nif condition1:\n    statement1\nelif condition2:\n\
