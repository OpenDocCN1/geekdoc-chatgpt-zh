    \ (data flow graphs)，用于数值计算的开源软件库。节点 (node) 在图中表示数学操作，图中的线（edges）则表示在节点间相互联系的多维数据数组，即张量（Tensor）。它灵活的架构让你可以在多种平台上展开计算，例如台式计算机中的一个或多个\
    \ CPU（或 GPU）服务器、移动设备，等等。TensorFlow 最初由 Google 大脑小组（隶属于 Google 机器智能研究机构）的研究员和工程师们开发，用于研究机器学习和深度神经网络，但这个系统的通用性使其也可广泛应用于其他计算领域。图\
