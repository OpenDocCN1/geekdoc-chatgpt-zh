    # 第 9 章 从回归分析到算法基础


    ![](img/b804a95e802d3360c99b6f8e75c7d047_174_0.png)


    什么是回归分析？


    回归分析就是定量地描述自变量和因变量之间的关系，并根据这些数量关系对现象进行预测和控制的一种统计分析方法。这种预测称为回归分析预测，例如可以通过回归去研究工程师薪资与工作年限的关系。


    # 9.1 回归分析简介


    # 9.1.1 “回归” 一词的来源


    “回归”（regression）一词来源于生物学，是由英国著名生物学家兼统计学家高尔顿①在研究人类遗传问题时提出来的。1985～1990 年期间，高尔顿发表多篇论文论证其观点。在研究父与子身高的遗传问题时，高尔顿搜集了
    1078 对父子的身高数据，他发现这些数据的散点图大致呈直线状态。也就是说，总的趋势是父亲的身高增加时，儿子的身高也倾向于增加。高尔顿进而分析出子代的身高
    y 与父亲的身高 x 大致可归结为直线关系，并求出了该直线方程（单位：英寸，1 英寸=2.54cm）： ŷ =33.73+0.156x。


    这种趋势及回归方程表明的内容如下：


    +   - 父代身高每增加 1 个单位，其成年儿子的身高平均增加 0.516 个单位；

    +   - 矮个子父亲所生的儿子比其父要高，如 x=60， ŷ =64.69，高于父辈的平均身高。身材较高的父亲所生子女的身高却回落到多数人的平均身高，如
    x=80， ŷ =75.01，低于父辈的平均身高。换句话说，当父亲身高走向极端，子女的身高不会像父亲身高那样极端化，其身高要比父亲们的身高更接近平均身高，即有“回归”到平均数的趋势。


    以上就是统计学上最初出现“回归”时的含义，高尔顿把这一现象叫做“向平均数方向的


    ① 高尔顿（Francis Galton，1822—1911），他的父亲绥缪尔·特修斯·高尔顿（Samuel Tertius Galton，1873—1844）是一位著名的银行家；他的外祖父伊拉兹马斯·达尔文（ErasmusDarwin，1731—1802）是英国著名的医学家、动植物学家、诗人和哲学家。英国生物学家、进化论的奠基人《物种起源》的作者查尔斯·罗伯特·达尔文（Charles
    Robert Darwin，1809—1882）是他的表哥。'
