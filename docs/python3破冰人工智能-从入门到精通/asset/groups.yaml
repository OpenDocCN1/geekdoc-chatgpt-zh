    # 13.2.1 标签与知识图谱推荐案例


    随着技术的发展，越来越多的非结构化数据被利用起来，比如语音、图片、文本数据。针对文本数据，我们通常使用自然语言技术进行处理，通过文本获取的内容跟用户联系起来，实现推荐算法。伴随互联网应用的发展，网络用户的交互作用得以体现，用户既是网络内容的浏览者，也是网络内容的创造者。


    互联网向来就不是一个唱独角戏的地方，其内部不断以各种形式产生着内容，比较有代表性产品有今日头条、一点咨询等。其内容通过 PGC（Professional Generated
    Content）与 UGC（User Generated Content）相结合的模式产生，同时基于以上内容，采用机器学习与深度学习算法进行个性化推荐，实现高质量的用户体验。


    # 小贴士：


    PGC 指专业生产内容、专家生产内容，用来泛指内容个性化、视角多元化、社会关系虚拟化。其分类更专业，内容质量也更有保证。特别是高端媒体采用的也是 PGC 模式，其内容设置及产品编辑均非常专业。


    UGC 指用户原创内容，是伴随着提倡个性的 Web 2.0 概念而兴起的。它并不是某一种具体的业务，而是一种用户使用互联网的新方式，即由原来的以下载为主改变成下载和上传并重。UGC
    有个好处是，用户可以自由上传内容，丰富网站内容，但不利的方面在于内容的质量良莠不齐。


    # 1. 基于标签的推荐


    标签是一种用来描述信息的关键词，可以作为物品的元信息。图 13-4 所示为淘宝网与当当网分类标签。一种商品必然有其所在的类别，例如在淘宝网中，照相机属于数码产品，同时照相机还有更加精细的品牌分类。此外，淘宝网还建立了关于配送方面的标签分类，如淘宝速达、实体商场服务等。当当网同样将书籍进行了分类，在不同类型上进行逐层次地划分，这种分类标签往往在用户选择商品时具有导向作用，用户可以通过这种分类标签选择自己想要的商品。


    ![](img/b804a95e802d3360c99b6f8e75c7d047_223_0.png)


    ▲图 13-4 淘宝网与当当网分类标签


    ① 图片截取自淘宝网与当当网，图中相关内容的著作权归原著作权人所有。'
