    Outlook 属性作为测试属性。选择 Outlook 作为测试属性之后，生成 3 个分支节点，对每个分支节点再次逐步进行划分，根节点划分后，统计计算划分后的特征属性维度，同样在新样本案例下计算，那么在
    Temperature、Humidity、Windy 这 3 个属性中找到 max(Gain(D, a))，进而从该属性进行切割。类似的对每个分支节点进行如上计算与划分，最终构建完成决策树。下面我们来了解一下信息增益率。


    # 11.2.3 信息增益率


    在 ID3 中，信息增益作为标准，容易偏向于取值较多的特征问题。信息增益的一个大问题就是偏向选择分支多的属性导致 overfitting。比如，如果将序号作为一个属性，那么它的每次取值特征都是不同的，如果计算它的信息增益，那么结果为
    0.998，其如果按照信息增益划分切割的话，将产生 17 个分支，每个分支有且仅有一个样本，那么这些分支节点的纯度已经达到最大。如果出现这个现象，将无法对新样本进行有效预测，即决策树并不具有泛化能力。那么我们能想到的解决办法自然就是对分支过多的情况进行惩罚（penalty）了，于是就有了信息增益比，或者说信息增益率（gain
    ratio），其定义为：


    Gain_ratio(D,a)= Gain(D,a)/IV(a) （11-3）


    其中，IV(a)= -∑_{v=1}^{V} |D^v|/|D| log₂ |D^v|/|D| 。


    IV(a)称为属性 a 的“固定值”（intrinsic value），属性 a 的可能取值数目越多，那么 V 的可能取值越多，则 IV(a)的值通常会越大。例如对表
    11-1 中数据进行统计计算 IV(Humidity):


    IV(Humidity)= - (5/17 × log₂ 5/17 + 12/17 × log₂ 12/17) ≈ 0.874


