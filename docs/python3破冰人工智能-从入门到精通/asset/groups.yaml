    ## 第10章 从 K-Means 聚类看算法调参


    ![](img/b804a95e802d3360c99b6f8e75c7d047_185_0.png)


    什么是聚类算法？


    聚类是一个将数据集分为若干个子集的过程，并使得同一集合中的数据对象具有较高的相似度，而不同集合中的数据对象则是不同的。相似或不相似的度量是基于数据对象描述属性的取值来确定的，通常就是利用各个聚类间的距离来进行描述的。聚类分析的基本指导思想是最大限度地实现类中对象相似度最大，类间对象相似度最小。


    简单理解，如果一个数据集包含 n 个实例，根据某种准则可以将这 n 个实例划分为 m 个类别，每个类别中的实例都是相关的，而不同类别之间是区别的，也就是不相关的，这个过程就叫聚类了。


    ## 10.1 K-Means 基本概述


    ### 10.1.1 K-Means 简介


    K-Means 聚类算法是由 Steinhaus（1955 年）、Lloyd（1957 年）、Ball & Hall（1965 年）、Mc Queen（1967
    年）分别在各自不同的科学研究领域独立提出的。K-Means 聚类算法被提出后，在不同的学科领域被广泛研究和应用，并发展出大量不同的改进算法。虽然 K-means
    聚类算法被提出已经超过 50 年了，但目前仍然是应用最广泛的划分聚类算法之一。容易实施、简单、高效、成功的应用案例和经验，是其仍然流行的主要原因。


    小贴士：

    聚类与分类不同，在分类模型中，存在样本数据，这些数据的类标号是已知的，分类的目的是从训练样本集中提取出分类的规则，用于对其他类标号未知的对象进行类标识。在聚类中，预先不知道目标数据的有关类的信息，需要以某种度量为标准将所有的数据对象划分到各个簇中。因此，聚类分析为无监督的学习。


