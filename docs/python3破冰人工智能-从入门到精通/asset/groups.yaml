    \ 数组的类型。\n\n### 【例 3-9】logspace 案例\n\n输入：\n```python\nimport numpy as np\n#生成首位是10的0次方，末位是10的2次方，含5个数的等比数列\n\
    a = np.logspace(start=0,stop=2,num=5)\nprint(a)\n```\n输出：\n```\n[1.          3.16227766\
    \ 10.          31.6227766 100. ]\n```\n输入：\n```python\n#生成首位是1的0次方，末位是1的2次方，含5个数的等比数列\n\
