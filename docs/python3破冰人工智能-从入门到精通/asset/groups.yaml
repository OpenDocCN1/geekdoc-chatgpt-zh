    3 的数”事件，E 为“落地向上的数为 7”事件。判断下列每对事件是否为互斥事件？是否为对立事件？是否为相互独立事件？（1）A 与 B（2）A 与 C（3）B
    与 C（4）A 与 D（5）A 与 E


    答：根据一颗骰子所存在的点数，整理如下。

    A = {1,3,5}, B = {2,4,6}, C = {3,6}, D = {4,5,6}, E = {7}

    P(A)=1/2, P(B)=1/2, P(C)=1/3, P(D)=1/2, P(E)=0,

    P(AB)=0, P(AC)=1/6, P(BC)=1/6, P(AD)=1/6, P(AE)=0


