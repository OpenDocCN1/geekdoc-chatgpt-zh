    \ 程序运行结果\n\n## 第 5 章 Python 网络爬虫\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_120_0.png)\n\
    \n### 什么是网络爬虫？\n\n网络爬虫（又被称为网页蜘蛛、网络机器人），是一种按照一定的规则自动抓取万维网信息的程序或者脚本。爬虫一般分为数据采集、处理和存储\
    \ 3 个部分。简单来说，网络爬虫程序模拟真实的人访问互联网，从网络上抓取我们需要的数据。\n\n### 5.1 爬虫基础\n\n### 5.1.1 初识爬虫\n\
    \n### 1. 爬虫章节的由来\n\n由于爬虫在人工智能技术范畴中并非核心技能，因此对于是否要写爬虫的章节，我纠结许久。恰巧，QQ 群中有同学参加数学建模竞赛，问我“某种数据如何获取”，我回复“通过爬虫获取”，之后他发出了疑问：“爬虫？是什么？”。通过这次沟通，我决定在本书中简单介绍爬虫技术，希望没有接触过爬虫技术的读者对其有一定了解。\n\
    \n在大数据环境下，各行各业对数据信息提出了更高的要求，要想快速、准确地获取自己想要的信息，就需要对数据获取技术进行优化。从现阶段相关技术的发展情况来看，虽然现在的搜索引擎技术已经得到了充分的发展，但是对于一些复杂的信息资料或者需要海量外部数据特征来验证模型时，这些搜索引擎在数据检索中依然会出现一些问题。所以为了能够有效解决上述问题，就应该利用网络爬虫技术，进一步提高数据检索质量，更有针对性地完成数据收集任务。\n\
    \n### 2. 一个好的爬虫特征\n\n网络爬虫从 20 世纪 90 年代开始出现，发展至今已是成熟的数据收集工具。一个好的爬虫应该具有以下特征。\n\n\
    - 明确的爬取目标。\n- 高效的爬取策略。\n- 有效的前置和后续处理。\n- 高性能的运行速度。\n\n本章将整体论述网络爬虫的工作流程及涉及的关键技术。\n\
    \n### 3. 工作原理\n\n网络爬虫是一段程序或者脚本。网络爬虫的系统框架中，主程序由控制器、解析器和资源库组成。\n\n控制器的主要工作是给多线程中的各个爬虫线程分配工作任务。首先，爬虫将请求访问某一站点或者网页，若能够访问，则自动下载保存其中的内容。然后，爬虫的解析模块会解析得到已爬取页面中的其他网页链接，并将这些链接作为之后爬取的目标。得益于\
    \ HTML 页面（JS 脚本标签、CSS 代码内容、空格字符、HTML 标签等）的结构化设计，爬虫在分析网页结构时可以完全不依赖于用户操作，实现自动运行。资源库是用来存放下载到的网页资源，它一般都采用大型的数据存储，如\
    \ MySQL、MongoDB 数据库。\n\n### 5.1.2 网络爬虫的算法\n\n爬虫在工作时可以将要进行爬取的所有网页链接视为树状结构，从一个起始\
    \ URL 节点开始，顺着网页中的超链接不断进行爬取，直至进行至叶子节点。对于爬取超链接的方式，主要有以下两种算法。\n\n### （1）深度优先搜索算法\n\
    \n深度优先搜索算法（Depth-First-Search，DFS），选取最初的一个网页，在该网页中选取一个跳转至下一个网页的链接，在该链接跳转至的下一网页中重复该步骤，直至遍历到叶子节点。即网页中不再存在跳转至下一网页的超链接，此时从上一节点选取一个新的链接重复上述遍历过程，不断重复以上步骤，直到将该路线中的全部超链接遍历完成。在此之后，我们将选取另一个初始网页，继续重复以上遍历过程。该算法的优点是较为容易设计网络爬虫。\n\
    \n### （2）广度优先搜索算法\n\n该算法是爬虫先获取到初始网页中的所有链接对应的网页，再从中选择一个链接，继续获取该链接对应网页中的所有链接对应的全部网页，不断重复上述过程。该方法是在理论上最佳的实现网络爬虫的方法。由于有些网络结构复杂，进行深度优先算法可能导致爬虫系统不断跳转至更深一层的超链接，导致一个分支变得无限制，而广度优先算法可以有效避免这种情况。广度优先算法使爬虫系统并行爬取相同深度的网页，极大地提高了获取信息的效率。\n\
    \n### 5.2 爬虫入门实战\n\n### 5.2.1 调用 API\n\n应用程序编程接口（Application Programming Interface，API）是一些预先定义的函数，目的是提供应用程序与开发人员基于某软件或硬件的访问，而又无须访问源码或理解内部工作机制的细节。\n\
    \n网络爬虫是为了获取数据，API 同样也是为了获取数据，通常一些大型网站都有对外开放的 API，以提供比较详细的使用说明文档，包括使用指南、请求参数、返回参数等，如图\
    \ 5-1～图 5-3①所示。通过网站官方提供的 API 数据接口，爬虫可以以结构化的形式获取它们的数据。这样获取的数据既方便，又不会有道德法律风险，但是它们通常会通过请求次数配额、并发上限配额来控制爬虫可获取的数据量。一般网站都可以以付费方式来提升配额，以满足数据获取需求。图\
    \ 5-4②所示为百度免费开放的 API。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_122_0.png)\n\
    \n▲图 5-1 百度地图 Web 服务 API 地址检索服务指南\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_122_1.png)\n\
    \n▲图 5-2 百度地图 Web 服务 API 地址检索服务文档（请求参数）\n\n# 请求参数\n\n| 参数 | 是否必填 | 默认值 | 格式举例\
    \ | 含义 |\n|---|---|---|---|---|\n| uid | 是 | 无 | '8ee4560cf91d160e8cc02cd7' |\
    \ poi的uid |\n| uids | 否 | 无 | '8ee4560cf91d160e8cc02cd7','5ffb1816cf771a226f476058'\
    \ | uid的集合，最多可以传入10个uid，多个uid之间用英文逗号分隔。 |\n| output | 否 | xml | json或xml | 请求返回格式\
    \ |\n| scope | 是 | 1 | 1, 2 | 检索结果详细程度，取值为1或空，则返回基本信息；取值为2，返回检索POI详细信息 |\n| ak\
    \ | 是 | 无 | 您的ak | 开发者密钥访问密码，必填项。v2之前该属性为key。 |\n| sn | 否 | 无 | Sn生成方法 | 开发者密钥签名。\
    \ |\n| timestamp | 否 | 无 |  | 设置sn后该项必填。 |\n\n▲图 5-2 百度地图 Web 服务 API 地址检索服务文档（请求参数）\n\
    \n> ① 图 5-1、图 5-2、图 5-3 来自百度地图开放平台 Web 服务 API，版权归源网站所有。 ② 图 5-4 来自百度地图开放平台，版权归源网站所有。\n"
