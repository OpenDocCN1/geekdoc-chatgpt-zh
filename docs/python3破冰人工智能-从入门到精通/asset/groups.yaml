    ![](img/b804a95e802d3360c99b6f8e75c7d047_177_0.png)


    ▲图 9-2 根据表 9-1 数据所做的散点图


    $$\begin{cases} y_i = \beta_0 + \beta_1 x + \varepsilon_i \\ \varepsilon_i \sim
    N(0,\sigma^2) \\ \varepsilon_1,\dots,\varepsilon_n \text{相互独立} \end{cases}\quad
    i=1,2,\dots,n$$ (9-2)


    其中，式（9-2）称为一元线性回归模型。


    （2）利用最小二乘法求解方程。


    设：


    $$\hat y = \hat\beta_0 + \hat\beta_1 x$$ (9-3)


    记作：


    $$\varepsilon_i = y_i - \hat y_i,\quad i=1,2,\dots,n$$


    $$Q(\beta_0,\beta_1)=\sum_{i=1}^{n}\varepsilon_i^2=\sum_{i=1}^{n}(y_i-\hat y_i)^2=\sum_{i=1}^{n}(y_i-\beta_0-\beta_1
    x)^2$$ (9-4)


    求 $\beta_0,\beta_1$, 使得二元函数 $Q(\beta_0,\beta_1)$ 达到最小, 由微积分知识, 得方程：


    $$\begin{cases}\dfrac{\partial Q(\beta_0,\beta_1)}{\partial\beta_0}=-2\sum_{i=1}^{n}(y_i-\beta_0-\beta_1
    x)=0\\\dfrac{\partial Q(\beta_0,\beta_1)}{\partial\beta_0}=-2\sum_{i=1}^{n}(y_i-\beta_0-\beta_1
    x_i)x_i=0\end{cases}$$ (9-5)


    解得：


    $$\begin{cases}\hat\beta_0=\bar y-\hat\beta_1\bar x\\\hat\beta_1=\dfrac{\sum_{i=1}^{n}(x_i-\bar
    x)(y_i-\bar y)}{\sum_{i=1}^{n}(x_i-\bar x)^2}\end{cases}$$ (9-6)


    由此得回归方程 $\hat y = \hat\beta_0 + \hat\beta_1 x$, 其中 $\hat\beta_1$ 为回归系数。


    在数据表 9-1 中, 经计算 $\hat\beta_0 = 20$, $\hat\beta_1 = 2$。


    回归方程为 $\hat y = 20 + 2x$。'
