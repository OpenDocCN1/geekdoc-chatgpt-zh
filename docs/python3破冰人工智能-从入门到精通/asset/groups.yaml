    \n### 14.2.1 阶\n\n在 TensorFlow 系统中，张量的维数被描述为阶，但是张量的阶和矩阵的阶并不是同一个概念。张量的阶是张量维数的一个数量描述，下面的张量\
    \ t（使用 Python 中 list 定义）就是 2 阶。\n\n```\nt = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]\n\
    ```\n\n可以认为一个 2 阶张量就是我们平常所说的矩阵，一阶张量可以认为是一个向量。对于一个 2 阶张量，可以使用语句 t[i,j] 来访问其中的任何元素，而对于\
    \ 3 阶张量，可以通过 t[i,j,k] 来访问任何元素，具体方法见表 14-1。\n\n表 14-1 Rank（阶）\n| 阶 | 数学实例 | Python\
    \ 例子 |\n|---|---|---|\n| 0 | 纯量（只有大小） | s = 483 |\n| 1 | 向量（大小和方向） | v = [1.1,\
    \ 2.2, 3.3] |\n| 2 | 矩阵（数据表） | m = [[1, 2, 3], [4, 5, 6], [7, 8, 9]] |\n| 3 |\
    \ 3 阶张量（数据立体） | t = [[[2], [4], [6]], [[8], [10], [12]], [[14], [16], [18]]] |\n\
    | n | n 阶 | …… |\n\n### 14.2.2 形状\n\nTensorFlow 文档中使用了 3 种记号来方便地描述张量的维度，分别是阶、形状以及维数。表\
    \ 14-2 展示了它们之间的关系。\n\n表 14-2 Shape（形状）\n| 阶 | 形状 | 维数 | 实例 |\n|---|---|---|---|\n\
