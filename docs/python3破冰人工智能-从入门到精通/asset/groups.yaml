    \ | 使用 HDF5 文件读写数据 |\n| read_sql() | 从 SQL 数据库的查询结果载入数据 |\n| read_pickle() | 读入\
    \ pickle()序列化后的数据 |\n\n## 4. 数据的选取与清洗\n\n对 DataFrame 进行选择，要从 3 个层次考虑：行列、区域、单元格。\n\
    \n(1) 使用中括号[]选取行列\n\n使用中括号[]，返回的是一维数组，行维度。输入要求是整数切片、标签切片、布尔数组，具体规则见表4-3。\n\n表\
    \ 4-3 使用中括号[]选取行列规则\n\n**df[] 使用中括号形式**\n\n| 选取行 | 选择列 |\n|---|---|\n| 整数切片、标签切片、<布尔数组><br>□\
    \ 整数，如 5<br>□ 整数列表或数组，如[4, 3, 0]<br>□ int 1:7 的 slice 对象<br>□ 单个标签，例如5或'a' (注意，5被解释为索引的标签。这...\
    \ )<br>□ 标签的列表或数组['a','b','c']<br>□ 具有标签'a':'f'的切片对象 (请注意，与通常的 Python 切片相反，包括开始和停止)<br>□\
    \ 一个布尔数组<br><br>df[:3]<br>df['a':'c']<br>df[[True,True,False,False,False]] # 前\
    \ 3 行 (布尔数组长度等于行数)<br>df[df['A']>0] # A 列值大于 0 的行<br>df[(df['A']>0) | (df['B']>0)]\
    \ # A 列值大于 0，或者 B 列大于 0 的行<br>df[(df['A']>0) & (df['C']>0)] # A 列值大于 0，并且 C 列大于\
    \ 0 的行 | 标签索引、标签列表、标签相关的 Callable<br>□ 单个标签，例如5或'a' (注意，5被解释为索引的标签)<br>□ 标签的列表或数组['a','b','c']<br>□\
    \ 具有标签'a':'f'的切片对象 (请注意，与通常的 Python 切片相反，包括开始和停止)<br>□ 一个布尔数组<br>□ 具有一个参数（调用 Series、DataFrame\
    \ 或 Panel）的 callable 函数，并返回有效的索引输出（上述之一）<br><br>df['A'] #返回的是 Series，与 df.A 效果相同<br>df[[\"\
    A\"]] #返回的是 DataFrame<br>df[['A','B']]<br>df[lambda df: df.columns[0]] # Callable\
    \ |\n\n总结：在使用中括号[]选取数据时，只有当出现以 columns 标签相关的检索时，为进行列检索，其他情况均为对行的处理\n\n(2) df.loc[]\
    \ 标签定位，行和列的名称，具体操作见表4-4。\n\n### 表 4-4 df.loc[]规则\n**df.loc[] 标签定位**\n| 二维，先行后列\
    \ |\n| 行维度 | 列维度 |\n| 标签索引、标签切片、标签列表、布尔数组、Callable | 标签索引、标签切片、标签列表、布尔数组、Callable\
    \ |\n| df.loc['a', :] | df.loc[:, 'A'] |\n| df.loc['a':'d', :] | df.loc[:, 'A':'C']\
    \ |\n| df.loc[['a','b','c'], :] | df.loc[:, ['A','B','C']] |\n| df.loc[[True,True,True,False,False,False],\
    \ :] # 前 3 行（布尔数组长度等于行数） | df.loc[:, [True,True,True,False]] # 前 3 列（布尔数组长度等于行数）\
    \ |\n| df.loc[df['A']>0, :] | df.loc[:, df.loc['a']>0] # a 行大于 0 的列 |\n| df.loc[df.loc[:,\
    \ 'A']>0, :] | df.loc[:, df.iloc[0]>0] # 0 行大于 0 的列 |\n| df.loc[df.iloc[:,0]>0,\
    \ :] | df.loc[:, lambda df: ['A','B']] |\n| df.loc[lambda df: df.A > 0, :] | \
    \ |\n\n总结：在使用中括号[]选取数据时，只当出现以 columns 标签相关的检索时，为进行列检索，其他情况均为对行的处理\n\n注：行标签从A到C行（与切片不同，这种情况下包含开头，也包含结束）。\n\
    \n（3）df.iloc[] 整型索引（绝对位置索引），绝对意义上的几行几列，起始索引为0，具体操作见表4-5。\n\n### 表 4-5 df.iloc[]规则\n\
    **df.iloc[] 整型索引**\n| 二维，先行后列 |\n| 行维度 | 列维度 |\n| 整数索引、整数切片、整数列表、布尔数组 | 整数索引、整数切片、整数列表、布尔数组、Callable\
    \ |\n| df.iloc[3, :] | df.iloc[:, 1] |\n| df.iloc[3:] | df.iloc[:, 0:3] |\n| df.iloc[[0,2,4],\
    \ :] | df.iloc[:, [0,1,2]] |\n| df.iloc[[True,True,True,False,False,False], :]\
    \ # 前 3 行（布尔数组长度等于行数） | df.iloc[:, [True,True,True,False]] # 前 3 列（布尔数组长度等于行数）\
    \ |\n| df.iloc[df['A']>0, :] #× | df.iloc[:, df.loc['a']>0] #× |\n| df.iloc[df.loc[:,\
    \ 'A']>0, :] #× | df.iloc[:, df.iloc[0]>0] #× |\n| df.iloc[df.iloc[:,0]>0, :]\
    \ | df.iloc[:, lambda df: [0, 1]] |\n\n总结：在使用中括号[]选取数据时，只当出现以 columns 标签相关的检索时，为进行列检索，其他情况均为对行的处理\n\
    \n注：iloc 参数是一个 slice 对象，和 Python 中切片对象用法是一致的。[start, end, step]用法为下标从 0 开始，包含开头，不包含结束。\n\
    \n（4）df.ix[]是 iloc 和 loc 的合体，具体操作见表4-6。\n\n### 表 4-6 df.ix[]规则\n**df.ix[]是 iloc\
    \ 和 loc 的合体**\n| 二维，先行后列 |\n| 行维度 | 列维度 |\n| 整数索引、整数切片、整数列表、标签索引、标签切片、标签列表、布尔数组、Callable\
    \ | 整数索引、整数切片、整数列表、标签索引、标签切片、标签列表、布尔数组、Callable |\n\n| df.ix[]是 iloc 和 loc 的合体\
    \ |  |\n|---|---|\n| df.ix[0, :] | df.ix[:, 0] |\n| df.ix[0:3, :] | df.ix[:, 0:3]\
    \ |\n| df.ix[[0,1,2], :] | df.ix[:, [0,1,2]] |\n| df.ix['a', :] | df.ix[:, 'A']\
    \ |\n| df.ix['a':'d', :] | df.ix[:, 'A':'C'] |\n| df.ix[['a','b','c'], :] | df.ix[:,\
    \ ['A','B','C']] |\n| 总结：在使用中括号[]选取数据时，只有当出现以 columns 标签相关的检索时为进行列检索，其他情况均为对行的处理\
    \ |  |\n\n（5）df.at[]与 df.iat[]精确定位单元格，具体操作见表 4-7。\n\n| 表 4-7 df.at[]与 df.iat[]规则\
    \ |  |\n|---|---|\n| df.at[] | df.iat[] |\n| 行维度 | 列维度 | 行维度 | 列维度 |\n| 标签索引 |\
    \  | 整数索引 |  |\n| df.at['a','A'] |  | df.iat[0, 0] |  |\n| 总结：在使用中括号[]选取数据时，只有当出现以\
    \ columns 标签相关的检索时，为进行列检索，其他情况均为对行的处理 |  |  |  |\n\n## 5. 数据清洗\n\n无论是数据挖掘工程师、机器学习工程师，还是深度学习工程师，都非常了解数据真实性的重要性。数据真实性决定着特征维度的选择规则，那么对于数据准备阶段（包含数据的抽取、清洗、转换和集成）常常占据了\
    \ 50%左右的工作量。而在数据准备的过程中，数据质量差又是 最常见而且最令人头痛的问题。本文基于 Pandas，针对缺失值和特殊值这种数据质量问题，提出了推荐的处理方法。\n\
    \n## 【例 4-5】构建 Dataframe\n\n输入：\n\n```\ndf = pd.DataFrame(np.random.randint(1,10,[5,3]),\
    \ index=['a', 'c', 'e', 'f', 'h'],columns=['one', 'two', 'three'])\ndf.loc[\"\
    a\",\"one\"] = np.nan\ndf.loc[\"c\",\"two\"] = -99\ndf.loc[\"c\",\"three\"] =\
    \ -99\ndf.loc[\"a\",\"two\"] = -100\ndf['four'] = 'bar'\ndf['five'] = df['one']\
    \ > 0\ndf2 = df.reindex(['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'])\nprint(df2)\n\
    ```\n\n输出：\n\n|   | one | two | three | four | five |\n|---|---|---|---|---|---|\n\
    | a | NaN | -100.0 | 7.0 | bar | False |\n| b | NaN | NaN | NaN | NaN | NaN |\n\
    | c | 8.0 | -99.0 | -99.0 | bar | True |\n| d | NaN | NaN | NaN | NaN | NaN |\n\
    | e | 6.0 | 2.0 | 3.0 | bar | True |\n| f | 3.0 | 6.0 | 5.0 | bar | True |\n|\
    \ g | NaN | NaN | NaN | NaN | NaN |\n| h | 9.0 | 7.0 | 3.0 | bar | True |\n\n\
    ## 【例 4-6】基于例 4-5 df2 进行缺失值处理\n\n```python\n#丢弃缺失值 dropna()\nprint(\"删除缺失值所在行(axis=0)或列(axis=1)，默认为\
    \ axis=0, df2.dropna(axis=0)=\\n{}\".format(df2.dropna(axis=0)))\n```\n\n输出：\n\
    \n|   | one | two | three | four | five |\n|---|---|---|---|---|---|\n| c | 8.0\
    \ | -99.0 | -99.0 | bar | True |\n| e | 6.0 | 2.0 | 3.0 | bar | True |\n| f |\
    \ 3.0 | 6.0 | 5.0 | bar | True |\n| h | 9.0 | 7.0 | 3.0 | bar | True |\n\n```python\n\
    print(\"一行中全部为 NaN 的，才丢弃该行 df2.dropna(how='all')=\\n{}\".format(df2.dropna (how='all')))\n\
    ```\n\n输出：\n\n|   | one | two | three | four | five |\n|---|---|---|---|---|---|\n\
    | a | NaN | -100.0 | 7.0 | bar | False |\n| c | 8.0 | -99.0 | -99.0 | bar | True\
    \ |\n| e | 6.0 | 2.0 | 3.0 | bar | True |\n| f | 3.0 | 6.0 | 5.0 | bar | True\
    \ |\n| h | 9.0 | 7.0 | 3.0 | bar | True |\n\n```python\nprint(\"移除所有字段中有值属性小于\
    \ 4 的行, df2.dropna(thresh=4)=\\n{}\".format(df2.dropna (thresh=4)))\n```\n\n输出：\n\
    \n移除所有行字段中有值属性小于 4 的行, df2.dropna(thresh=4)=\n\n|   | one | two | three | four\
    \ | five |\n|---|---|---|---|---|---|\n| a | NaN | -100.0 | 7.0 | bar | False\
    \ |\n| c | 8.0 | -99.0 | -99.0 | bar | True |\n| e | 6.0 | 2.0 | 3.0 | bar | True\
    \ |\n| f | 3.0 | 6.0 | 5.0 | bar | True |\n| h | 9.0 | 7.0 | 3.0 | bar | True\
    \ |\n\n```python\nprint(\"参数 subset 移除指定列为空的所在行数据,df2.dropna(subset=['one','five'])=\\\
    n{}\".format (df2.dropna(subset=['one', 'five'])))\n```\n\n输出：\n\n参数 subset 移除指定列为空的所在行数据,df2.dropna(subset=['one',\
    \ 'five'])=\n\n|   | one | two | three | four | five |\n|---|---|---|---|---|---|\n\
    | c | 8.0 | -99.0 | -99.0 | bar | True |\n| e | 6.0 | 2.0 | 3.0 | bar | True |\n\
    | f | 3.0 | 6.0 | 5.0 | bar | True |\n| h | 9.0 | 7.0 | 3.0 | bar | True |\n\n\
    ## 缺失值填充 fillna()\n\n输入：\n\n```\nprint(\"缺失值以0填充, df2.fillna(0)=\\n{}\".format(df2.fillna(0)))\n\
    ```\n\n输出：\n\n缺失值以0填充, df2.fillna(0)=\n\n|   | one | two | three | four | five\
    \ |\n|---|---|---|---|---|---|\n| a | 0.0 | -100.0 | 7.0 | bar | False |\n| b\
    \ | 0.0 | 0.0 | 0.0 | 0 | 0 |\n| c | 8.0 | -99.0 | -99.0 | bar | True |\n| d |\
    \ 0.0 | 0.0 | 0.0 | 0 | 0 |\n| e | 6.0 | 2.0 | 3.0 | bar | True |\n| f | 3.0 |\
    \ 6.0 | 5.0 | bar | True |\n| g | 0.0 | 0.0 | 0.0 | 0 | 0 |\n| h | 9.0 | 7.0 |\
    \ 3.0 | bar | True |\n\n输入：\n\n```\nprint(\"指定列空值赋值为\\n{}\".format(df2.fillna({\"\
    one\":0,\"two\":0.5,\"five\":10})))\n```\n"
