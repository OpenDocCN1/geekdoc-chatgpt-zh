    \ 采用 BASE 模型。答案是肯定的, 目前的 NoSQL 数据库还难以与关系型数据库一争高下, 但它却可以对关系数据库在性能和扩展性上进行弥补, 所以我们可以把\
    \ NoSQL 和关系数据库结合使用, 各取所长。\n\n下面举个典型的例子加以说明。在 Web 2.0 网站中比较典型的需求是用户评论的存储, 评论表大致可分为评论表主键\
    \ ID、被评论用户 ID、评论用户 ID、评论时间、评论内容等字段。结合关系型数据库与 NoSQL 数据库的特点, 我们可将需要查询的字段, 比如评论表主键\
    \ ID、被评论用户 ID、评论用户 ID、评论时间等数据、时间类型的小字段存储在关系型数据库中, 根据查询建立相应的索引。而评论内容是个大文本字段, 我们肯定不会通过文本内容进行查询,\
    \ 所以把评论内容存储在 NoSQL 数据库中。\n\n用关系型数据库专门负责处理擅长的关系存储，用 NoSQL 数据库存储复杂数据，这样做有很多优势：节省了关系型数据库的\
    \ I/O 开销，提高了数据库的数据备份与恢复速度；由于 NoSQL 数据库往往都是行级锁的，所以对评论内容字段也更容易做 Cache；由于 NoSQL 数据库天生就容易扩展，经过这种结合优化，关系型数据库的性能也能够得到提高。\n\
    \n这种结合方式实现起来比较容易，且能取得不错的效果。关系型数据库与 NoSQL 数据库结合并不局限于这种方式，应该根据具体的应用场景灵活组合使用。\n\n\
    ### 6.3.3 结束语\n\n关系数据库已经流行了几十年，NoSQL 数据库想在短期内取而代之显然是不可能的，但是 NoSQL 数据库的发展势头也不容小觑。在当前阶段的某些场景下，可以将\
    \ NoSQL 数据库与关系型数据库结合使用，相互弥补各自的缺陷。这种数据库组合对解决目前 Web 2.0 网站所遇到的性能、扩展性等问题具有重要意义。\n\
    \n## 第 7 章 Python 数据分析\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_140_0.png)\n\
    \n什么是数据分析？\n\n数据分析是一个包含数据检验、数据清洗、数据重构，以及数据建模的过程，目的在于发现有用的信息和有建设性的结论，来辅助决策的制定。数据分析有多种形式和方法，涵盖了多种技术，应用于商业、科学、社会学等多个不同的领域。\n\
    \n## 7.1 数据获取\n\n数据获取是指从数据源采集数据，为数据分析与数据挖掘做数据准备的工作。\n\n### 7.1.1 从键盘获取数据\n\ninput\
    \ 函数是 Python 中的一个内建函数，其从标准输入中读入一个字符串，用来获取控制台的输入。\n\n【例 7-1】通过 input 获取数据\n\n输入：\n\
    \n```\n```\nprint(\"How old are you?\"),\nage = input(\"Please input your age:\"\
    )\nprint (\"so %s years old\" %age )\n```\n```\n\n输出：\n\n```\n```\nHow old are\
    \ you?\nPlease input your age:45\nso 45 old\n```\n```\n\n在例 7-1 中，通过获取键盘即控制台输入的数据来返回结果，结果\
    \ “so 45 old” 中的 45 为输入的数据。\n\n### 7.1.2 文件的读取与写入\n\n### 1. 读取操作\n\n读写文件是最常见的\
    \ I/O 操作。Python 内置了读写文件的函数，要以读文件的模式打开一个文件对象，使用 Python 内置的 open()函数，传入文件名和标识符。\n\
    \n【例 7-2】通过 open 获取数据，输出如图 7-1 所示\n输入：\n\n```\nf=open(\"test.txt\",\"r\",encoding=\"\
    utf-8\")\nprint(f.read())\nf.close()\n```\n\n输出：\n\n第一行\n第二行\n第三行\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_141_0.png)\n\
    \n在例 7-2 中，通过 open 打开文件，其模式有只读、写入和追加等。所有可取值见表 7-1 的模式列表。这个参数是非强制的，默认文件访问模式为只读（r）。\n\
    \n表 7-1 读取文件模式列表\n\n| 模式 | 说明 |\n|------|------|\n| r | 以只读方式打开文件。文件的指针将会放在文件的开头，这是默认模式\
    \ |\n| rb | 以二进制格式打开一个文件用于只读。文件指针将会放在文件的开头，这是默认模式 |\n| r+ | 打开一个文件用于读写。文件指针将会放在文件的开头\
    \ |\n| rb+ | 以二进制格式打开一个文件用于读写。文件指针将会放在文件的开头 |\n\n我们定义 file=open(\"test.txt\",\"\
    r\",encoding=\"utf-8\")，即 open 打开后的变量，那么 file 常用对象方法如下所示。\n\n- 1. file.read(size)方法：参数\
    \ size 表示读取的数量，省略则读取全部。\n- 2. file.readline()方法：读取文件的一行内容。\n- 3. file.readlines()方法：读取所有的行并以文件的每行作为一个元素插入数组里面，[line1,line2,...,lineN];在避免将文件的所有内容都加载到内存中时，常常使用这种方法来提高效率。\n\
    - 4. file.write()方法：如果要写入字符串以外的数据，先将它转换为字符串。\n- 5. file.close()方法：关闭文件，文件使用完毕后必须关闭，因为文件对象会占用操作系统的资源，并且操作系统同一时间能打开的文件数量也是有限的。\n\
    \n由于文件读写时都有可能产生 IOError，一旦出错，后面的 f.close()就不会调用。所以，为了保证无论是否出错都能正确地关闭文件，我们可以使用\
    \ try ... finally 来实现。\n\n```\n```python\ntry:\n    f = open(' file', 'r')\n \
    \   print(f.read())\nfinally:\n    if f:\n        f.close()\n```\n```\n\n但是每次都这么写实在太烦琐，所以\
    \ Python 引入了 with 语句来自动帮我们调用 close() 方法：\n\n```\n```python\nwith open('file',\
    \ 'r') as f:\n    print(f.read())\n```\n```\n\n这和前面的 try ... finally 是一样的，但是代码更加简洁，并且不必调用\
    \ f.close()方法。\n\n### 小贴士：\n\n在 Python 中，使用 open 读取文件时是根据光标位置来读取的，如果采用 file.read()读取两次，第二次会出现为空，再次使用\
    \ read 之前需要添加 file.seek(0)，将光标位置放到最前面，这样才能返回有效值。\n\n```\n```python\nf=open(\"\
    test.txt\",\"r\",encoding=\"utf-8\")\nf.read()\nf.seek(0)\nf.read()\nf.close()\n\
    ```\n```\n\n### 2. 写入操作\n\n通常在使用 Python 处理数据的过程中，经常需要将处理结果保存到数据库或者文件中。一个简单的写入操作见例7-3，常用的写入模式如表7-2所示。\n\
    \n表 7-2 写入模式\n\n| 模式 | 说明 |\n|------|------|\n| w | 打开一个文件只用于写入。如果该文件已存在，则打开文件，并从开头开始编辑，即原有内容会被删除；如果该文件不存在，则创建新文件\
    \ |\n| wb | 以二进制格式打开一个文件只用于写入。如果该文件已存在，则打开文件，并从开头开始编辑，即原有内容会被删除；如果该文件不存在，则创建新文件\
    \ |\n| w+ | 打开一个文件用于读写。如果该文件已存在，则打开文件，并从开头开始编辑，即原有内容会被删除；如果该文件不存在，则创建新文件 |\n|\
    \ wb+ | 以二进制格式打开一个文件用于读写。如果该文件已存在，则打开文件，并从开头开始编辑，即原有内容会被删除；如果该文件不存在，则创建新文件 |\n\
    | a | 打开一个文件用于追加。如果该文件已存在，文件指针将会放在文件的结尾，也就是说，新的内容将会被写入已有内容之后；如果该文件不存在，则创建新文件进行写入\
    \ |\n| ab | 二进制格式打开一个文件用于追加。如果该文件已存在，文件指针将会放在文件的结尾，也就是说，新的内容将会被写入已有内容之后；如果该文件不存在，则创建新文件进行写入\
    \ |\n\n| 模式 | 说明 |\n| --- | --- |\n| a+ | 打开一个文件用于读写。如果该文件已存在，文件指针将会放在文件的结尾，文件打开时会是追加模式；如果该文件不存在，则创建新文件用于读写\
    \ |\n| ab+ | 以二进制格式打开一个文件用于追加。如果该文件已存在，文件指针将会放在文件的结尾；如果该文件不存在，则创建新文件用于读写 |\n\n\
    【例 7-3】写入文件\n\n输入：\n\n```\n```python\nwith open(\"test.txt\",\"w\") as file:\n\
    \    file.write(\"hello world\")\n```\n```\n\n采用 “w” 模式，将 hello world 写入 test.txt\
