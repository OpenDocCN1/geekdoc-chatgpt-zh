    \n决策树怎样完成分类？\n\n决策树分类过程，从根节点开始，对实例的某一特征进行测试，根据测试结果将实例分配到其子节点，每个子节点对应着该特征的一个取值。如此递归对实例进行测试并分配，直至达到叶节点，叶节点即表示一个类。\n\
    \n### 11.1 决策树基本简介\n\n通常用到的数据分类技术，多数是决策树分类法。决策树，顾名思义，它是一种树形结构。决策树包含决策节点、分支和叶节点3部分。其中，决策节点代表某个待分类数据集合的某个属性，例如图\
    \ 11-1 的“是否有房”和“是否有车”属性，在该属性上的不同测试结果对应一个分支；每个叶节点表示一种可能的分类结果，例如图 11-1 中的“可以”代表可以给贷款人进行贷款，而“不可以”则表示不能给贷款人进行贷款。\n\
    \n决策树①是以实例为基础的归纳学习算法，本身没有太多高深的数学方法，决策树算法其实现在不断改进中成长。\n\nHunt、Marin 和 Stone 于 1966\
    \ 年提出了概念学习系统 CLS②，它是早期的决策树学习算法。\n\nCLS 算法的主要思想是从一个空的决策树出发，通过添加新的判定节点来改善原来的决策树，直至该决策树能够正确地将训练实例分类为止。后来的许多决策树学习算法都可以作为\
    \ CLS 算法的改进与更新。\n\nHunt 等人提出的 CLS 算法，并未给出有效的测试属性的选取标准，所以 CLS 有很大的改进空间。在决策树学习的各种算法当中，最具影响的是\
    \ Quinlan 于 1986 年提出的以信息熵的下降速度为选取测试属性标准的 ID3③算法，信息熵的下降也就是信息的不确定下降。\n\n在 ID3 算法的基础上，Quinlan\
    \ 于 1993 年开发了著名的 C4.5 系统，并得到广泛应用，C4.5⑥的新功能是它能够将决策树转换为等价的规则表示，并且 C4.5 解决了连续取值的数据学习问题。可以说\
    \ C4.5 算法继承了 ID3 算法的优点，并在此基础上进行了改进。\n\nCART 算法是 Breiman 于 1984 年提出的决策树构建算法，采用二元切分法，每次把数据切成两份，分别进入左子树、右子树，并且每个非叶节点都有两个孩子，这样建立起来的树就是二叉树。随着计算机技术的发展，人工智能算法需求的增强，树结构算法不断完善，先后不断有学者提出适合更多应用场景的基于树的分类算法，如\
    \ Adaboost、GBDT、XGBoost、LightGBM。以上算法在 Python 3.x 中均有模块可以直接调用，相比于 ID3，C4.5 在当今的人工智能场景下更加引人关注，随着时间的推移，会有更多优秀的算法被开发出分享出来。本书将从决策树的方向入手，阐述相应算法与原理，不会涉及过于复杂的算法原理，有兴趣的读者可自行查阅学习。\n\
    \n![](img/b804a95e802d3360c99b6f8e75c7d047_195_0.png)\n\n### 11.2 经典算法介绍\n\n###\
    \ 11.2.1 信息熵\n\n信息熵（information entropy），指的是 一组数据所包含的信息量，使用概率来度量。数据包含的信息越有序，所包含的信息越低。数据包含的信息越杂，包含的信息越高。例如在极端情况下，如果数据中的信息都是\
    \ 0，或者都是 1，那么熵值为 0，因为你从这些数据中得不到任何信息，或者说这组数据给出的信息是确定的。如果数据是均匀分布，那么它的熵最大，因为你根据数据不能知晓发生哪种情况的可能性比较大。\n\
    \n计算公式如下。\n\n假设样本集合 D 中第 k 类样本所占的比例为 p_k (k=1,2…|y|)，则 D 的信息熵定义为：\n\nEnt(D) =\
    \ -∑_{k=1}^{|y|} p_k log₂ p_k  (11-1)\n\n其中，Ent(D)（0 ≤ Ent(D) ≤ log₂|y|）越小，其 D\
    \ 的信息越有序，纯度越高，值越大，则其信息越混乱。\n\n对于式（11-1）中的 D 取值是一个随机变量取值集合，设其是一个离散的随机变量，对于最简单的\
    \ 0-1 分布，有 p(D=1)=p，则 p(D=0)=1-p，此时熵为 -p log₂ p - (1-p) log₂ (1-p)，当 p=1 或 p=0\
    \ 时，熵最小，取值为 0，此时的随机变量不确定性最小，信息越有序，纯度高。当 p=0.5 时，熵最大，此时随机变量的不确定性最大，信息混乱，纯度低，其熵函数如图\
    \ 11-2 所示。\n\n【例 11-1】生成二项分布信息熵，程序运行结果如图 11-2 所示\n\n输入：\n\n```\nimport math\n\
    import matplotlib.pyplot as plt\nimport numpy as np\n\nx = np.arange(0.000001,1,0.005)\n\
    y = [-a*math.log(a, 2)-(1-a)*math.log(1-a, 2) for a in x]\nplt.plot(x, y, linewidth=2,\
    \ color=\"#9F35FF\")\nplt.grid(True)\nplt.show()\n```\n\n输出：\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_196_0.png)\n\
    \n▲图11-2 例11-1 程序运行结果\n\n### 11.2.2 信息增益\n\n假定离散属性 $a$ 有 $V$ 个可能取值 $\\{a^1,a^2,\\\
    dots,a^v\\}$，若使用 $a$ 来对样本集 $D$ 进行划分，则会产生 $V$ 个节点分支节点，其中第 $v$ 个节点分支节点包含了 $D$ 中所有在属性\
    \ $a$ 上取值为 $a^v$ 的样本，即为 $D^v$。根据式（11-1）计算出 $D^v$ 的信息熵，在考虑到不同的节点分支节点所包含的样本数不同，给节点分支节点赋予权重\
    \ $\\frac{D^v}{|D|}$，即对样本数越多的节点分支节点的影响越大，于是可计算出用属性 $a$ 对样本集 $D$ 进行划分所获得的“信息增益”（information\
    \ gain）。\n\n$Gain(D,a)=Ent(D)-\\sum_{v=1}^{V}\\frac{D^v}{|D|}Ent(D^v)\\qquad(11-2)$\n\
    \n一般而言，信息增益越大，则意味着使用属性 $a$ 来进行划分所获得的“纯度提升”越大，因此，我们可用信息增益来进行决策树的划分属性选择，最优划分属性则为\
    \ $a_*=\\max_{a\\in A}Gain$（D,a），著名的 ID3 决策树学习算法就是以信息增益为准则来选择划分属性。\n\n假设现在统计了\
    \ 17 天的气象数据，见表 11-1，分别包含 Outlook、Temperature、Humidity、Windy 这 4 个维度属性，我们希望通过 4\
    \ 个维度属性来判断是否适合出去郊游。那么在 play 集合中，样本共有两类，即 |y|=2，分别计算出在正例与反例的概率为 p₁=8/17、p₂=9/17。\n\
    \n表 11-1 气象数据\n\n| 序号 | Outlook | Temperature | Humidity | Windy | Play |\n|---|---|---|---|---|---|\n\
    | 1 | Sunny | Cool | Normal | Not | yes |\n| 2 | Sunny | Mild | Normal | Medium\
    \ | yes |\n| 3 | Sunny | Mild | Normal | Not | yes |\n| 4 | Sunny | Cool | Normal\
    \ | Medium | yes |\n| 5 | Sunny | Hot | Normal | Not | yes |\n| 6 | Sunny | Cool\
    \ | High | Not | yes |\n| 7 | Overcast | Mild | High | Not | yes |\n| 8 | Sunny\
    \ | Mild | Normal | Not | yes |\n| 9 | Overcast | Mild | Normal | Medium | no\
    \ |\n| 10 | Sunny | Cool | High | Very | no |\n| 11 | Rain | Hot | Normal | Very\
    \ | no |\n| 12 | Rain | Hot | High | Not | no |\n| 13 | Overcast | Cool | Normal\
    \ | Not | no |\n| 14 | Overcast | Hot | Normal | Medium | no |\n| 15 | Sunny |\
    \ Mild | High | Not | no |\n| 16 | Rain | Hot | Normal | Not | no |\n| 17 | Overcast\
    \ | Cool | Normal | Medium | no |\n\n参照式（11-1），根据初始时刻属于 yes 和 no 类的实例比例，计算初始时刻的根节点信息熵值为：\n\
    \n$Ent(D)= -\\sum_{k=1}^{|y|} p_k \\log_2 p_k = -\\left(\\frac{8}{17}\\log_2\\\
    frac{8}{17}+\\frac{9}{17}\\log_2\\frac{9}{17}\\right)\\approx0.998$\n\n接下来需要分别计算\
    \ 4 个维度条件熵，通过公式（11-2）来计算信息增益。4 个维度计算方法相同，选取 Temperature 维度进行计算，得到表 11-2。\n\n表\
