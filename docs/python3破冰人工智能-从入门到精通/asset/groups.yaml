    意义。本书将介绍 3 种常见的检验方法。


    （1）F 检验法


    当 $H_0$ 成立时，$F = \frac{U}{Q_e/(n-2)} \sim F(1,\,n-2)$。


    其中，$U = \sum_{i=1}^{n} (\hat{y}_i - \bar{y})^2$（回归平方和）。


    故 $F > F_{1-\alpha}(1,n-2)$，拒绝 $H_0$，否则就接受 $H_0$。


    （2）$t$ 检验法


    当 $H_0$ 成立时，$T = \frac{\sqrt{L_{xx}}\,\hat{\beta}_1}{\hat{\sigma}_e} \sim t(n-2)$。


    故 $|T| > t_{\alpha/2}(n-2)$，拒绝 $H_0$，否则就接受 $H_0$。


    其中，$L_{xx} = \sum_{i=1}^{n} (x_i - \bar{x})^2 = \sum_{i=1}^{n} x_i^2 - n\bar{x}^2$。


    （3）$r$ 检验法


    记 $H_0: \rho = 0$，$H_1: \rho \neq 0$。


    检验统计量 $r = \frac{\sum (x_i - \bar{x})(y_i - \bar{y})}{\sqrt{\sum (x_i - \bar{x})^2
    \sum (y_i - \bar{y})^2}} = \frac{L_{xy}}{\sqrt{L_{xx}L_{yy}}}$。


    拒绝域 $W = \{|r| > r_{1-\alpha}(n-2)\}$，其中 $r_{1-\alpha} = \sqrt{\frac{1}{1 + (n-2)/F_{1-\alpha}(1,n-2)}}$。


    $r$ 检验法通常称为相关系数的检验法，当 $|r| > r_{1-\alpha}(n-2)$ 时，有 $(1-\alpha)\%$ 的把握认为 $x$ 与
    $y$ 之间具有线性关系。有时在判定一个线性回归之间的拟合优度的好坏时，$R^2$ 系数通常是一个重要的判定系数。


    # 3. 预测和控制


    所谓预测问题是指已知预测因子 $x = x_0$，求预测对象 $y_0 = \beta_0 + \beta_1 x + \varepsilon$ 的点估计和区间估计问题。


    （1）点预测：$\hat{y} = \hat{\beta}_0 + \hat{\beta}_1 x$。


    （2）区间预测。当 $\varepsilon_1,\dots,\varepsilon_n$ 相互独立，且都服从 $N(0,\sigma^2)$ 时：


    $T = \frac{y_0 - \hat{y}_0}{s\sqrt{1 + \frac{1}{n} + \frac{(x_0 - \bar{x})^2}{L_{xx}}}}
    \sim t(n-2)$ 其中 $s = \sqrt{\frac{S_E}{n-2}}$


    由此得 $y_0$ 的置信区间为：$\left[\hat{y}_0 - t_{1-\alpha/2}\,s\sqrt{1 + \frac{1}{n} + \frac{(x_0
    - \bar{x})^2}{L_{xx}}},\; \hat{y}_0 + t_{1-\alpha/2}\,s\sqrt{1 + \frac{1}{n} +
    \frac{(x_0 - \bar{x})^2}{L_{xx}}}\right]$ （9-8）'
