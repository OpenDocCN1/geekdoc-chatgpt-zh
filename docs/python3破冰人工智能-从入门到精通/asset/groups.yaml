    # 2. 人工智能简介


    对于普通大众来说，可能是近些年才对其有所了解，其实人工智能在几十年以前就被学者提出并得到一定程度的发展，伴随着大数据技术的迅猛发展而被引爆。


    # （1）人工智能的诞生


    最初的人工智能其实是20世纪30至50年代初一系列科学研究进展交汇的产物。1943年，沃伦·麦卡洛克（Warren McCulloch）和瓦尔特·皮茨（Walter
    Pitts）首次提出“神经网络”概念。1950年，阿兰·图灵（Alan Turing）提出了著名的“图灵测试”，即如果一台机器能够与人类展开对话（通过电传设备）而不能被辨别出其机器身份，那么称这台机器则具有智能。直到如今，图灵测试仍然是人工智能的重要测试手段之一。1951年，马文·明斯基（Marvin
    Minsky）与他的同学一起建造了第一台神经网络机，并将其命名为SNARC（Stochastic Neural Analog Reinforcement Calculator）。不过，这些都只是前奏，一直到1956年的达特茅斯会议，“Artificial
    Intelligence”（人工智能）这个词才被真正确定下来，并一直沿用至今，这也是目前AI诞生的一个标志性事件。


    ![](img/b804a95e802d3360c99b6f8e75c7d047_16_0.png)


    ![](img/b804a95e802d3360c99b6f8e75c7d047_16_1.png)


    在20世纪50年代，人工智能相关的许多实际应用一般是从机器的“逻辑推理能力”开始着手研究。然而对于人类来说，更高级的逻辑推理的基础是“学习能力”和“规划能力”，我们现在管它叫“强化学习”与“迁移学习”。可以想象，“逻辑推理能力”在一般人工智能系统中不能起到根本的、决定性的作用。当前，在数据、运算能力、算法模型、多元应用的共同驱动下，人工智能的定义正从用计算机模拟人类智能，演进到协助引导提升人类智能，如图1-3所示。


    # （2）人工智能的概念


    人工智能（Artificial Intelligence），英文缩写为AI，它是研究开发用于模拟、延伸和扩展


