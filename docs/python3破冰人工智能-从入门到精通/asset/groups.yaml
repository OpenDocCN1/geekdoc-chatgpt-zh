    ## 序


    2017 年 7 月 8 日，国务院发布《新一代人工智能发展规划》，正式开启国内人工智能发展的新篇章。同年 12 月 14 日，工业和信息化部印发《促进新一代人工智能产业发展三年行动计划（2018-2020
    年）》的通知，明确提出要推动人工智能和实体经济深度融合，加快制造强国和网络强国建设。


    “识时务者为俊杰”。人工智能蓬勃发展，要想在互联网的浪潮下立于不败之地，就必须了解当前的行业现状，不断追求新的技术方法，完善自己的专业技能，才能为胜任工作做好准备。


    目前，人工智能人才供不应求，人工智能从业者薪资水平居 IT 行业前列，众多从业者也在考虑转行 AI。虽然谁都想赶上 AI 的风口，但是好的学习样本并不多。本书恰似指路明灯，为读者照亮人工智能初学之路。它不仅讲知识，而且注重传授经验，既有学习计划，又侧重实战。


    “不登高山，不知天之高”。一个人无论技术能力高低，都应以“满招损，谦受益”的求学态度，不断完善自己的知识储备。达尔文曾说过：“最有价值的知识是关于方法的知识。”本书是基于作者学习与工作经验总结而成的，构建了系统全面的
    人工智能学习结构。希望读者通过阅读本书，能够在寻找答案和方法的过程中，得到能力上的提升。这也是出版本书的意义。


    黄海涛

    2018 年秋


    ## 前 言


    ## 编写背景


    作者在读本科和硕士期间，经常参加全国数学建模竞赛，而且成绩还不错，于是... 在闲暇之余，创建了一个数学建模交流网站，方便大家学习交流。网站创立至今，网友问得最多的都是数学建模方面的基础问题，而最受欢迎的答案，是来自实战的案例。


    这是一本人人工智能技术书籍，我是如何确定目标受众（Who）是哪些人，如何定位（What）本书内容的呢？


    目标受众（Who）主要有哪些人？


    我的老家在东北，每次回去，村里人都会问我：“在北京做什么工作呢？” 当我第一次回答“人工智能”时，看到的是他们不解的神情；后来我说“数据”，他们好像懂了一些，之后说“互联网”，嗯嗯……这下他们就明白了。


    真是隔行如隔山！这种现象深深地印在我的脑海里，于是我在动笔之前，明确了本书的受众是对人工智能感兴趣的读者。无论你是否从事人工智能相关工作，均可阅读。本书内容全面，并辅以大量图表，不同岗位、不同水平的读者通过阅读本书都会有不同程度的收获。


    如何定位（What）这本书的内容？


    本书是一本实战型人工智能技术书籍。其中，人工智能部分涉及数学知识、Python 和算法。实战，指的是网络爬虫、数据储存、数据分析、自然语言处理、机器学习、推荐系统、深度学习部分的内容。


    书中的每一章都提供了足够的数学知识和代码示例，帮助读者理解和掌握同深度的知识点，并更好地掌握其他知识点。


    ## 本书特色


    Python 作为一种高级程序设计语言，凭借其简洁、易读及可扩展性，日渐成为程序设计领域备受推崇的语言，并成为人工智能背景下的首选语言之一。


    本书基于 Python 3.6 构建了近 140 个代码案例，系统全面、循序渐进地介绍了 Python 在人工智能各方面的应用。本书主要包含以下四部分。


    第一部分为从零认识 AI：第 1 章，创新性地从数学建模竞赛角度介绍人工智能，同时简述了人工智能涉及的主要数学知识。


    第二部分为入门 AI 做准备：第 2～4 章，循序渐进地讲解了 AI 工程中重要的 Python 常用模块，提取语言精要，进行有针对性的学习。


    第三部分为 Python 基础实战：第 5～7 章，分别阐述了网络爬虫（线程、进程、协程）、数据库存储（SQL 与 NoSQL）和数据分析，帮助读者为进一步学习
    AI 知识做好准备。


    第四部分为实战部分：第 8～14 章，首先以自然语言处理（分词、关键词提取、词向量、word2vec）作为开篇；接着以 4 种基本的机器学习算法为例，阐述算法特性；然后介绍了算法的主要应用场景——推荐系统，以及协同过滤与知识图谱在推荐系统中的应用；最后以深度学习框架
    TensorFlow 入门知识作为本书的结束。


    本书内容结构清晰，示例完整，涵盖数学基础、编程语言、算法应用。无论是人工智能领域的新手，还是经验丰富的编程老手，都将从中获益。


