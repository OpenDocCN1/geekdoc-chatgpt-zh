    决策树怎样完成分类？


    决策树分类过程，从根节点开始，对实例的某一特征进行测试，根据测试结果将实例分配到其子节点，每个子节点对应着该特征的一个取值。如此递归对实例进行测试并分配，直至达到叶节点，叶节点即表示一个类。


    # 11.1 决策树基本简介


    通常用到的数据分类技术，多数是决策树分类法。决策树，顾名思义，它是一种树形结构。决策树包含决策节点、分支和叶节点3部分。其中，决策节点代表某个待分类数据集合的某个属性，例如图
    11-1 的“是否有房”和“是否有车”属性，在该属性上的不同测试结果对应一个分支；每个叶节点表示一种可能的分类结果，例如图 11-1 中的“可以”代表可以给贷款人进行贷款，而“不可以”则表示不能给贷款人进行贷款。


    决策树①是以实例为基础的归纳学习算法，本身没有太多高深的数学方法，决策树算法其实现在不断改进中成长。


    Hunt、Marin 和 Stone 于 1966 年提出了概念学习系统 CLS②，它是早期的决策树学习算法。


    CLS 算法的主要思想是从一个空的决策树出发，通过添加新的判定节点来改善原来的决策树，直至该决策树能够正确地将训练实例分类为止。后来的许多决策树学习算法都可以作为
    CLS 算法的改进与更新。


    Hunt 等人提出的 CLS 算法，并未给出有效的测试属性的选取标准，所以 CLS 有很大的改进空间。在决策树学习的各种算法当中，最具影响的是 Quinlan
    于 1986 年提出的以信息熵的下降速度为选取测试属性标准的 ID3③算法，信息熵的下降也就是信息的不确定下降。


    在 ID3 算法的基础上，Quinlan 于 1993 年开发了著名的 C4.5 系统，并得到广泛应用，'
