    我难以置信地看着这365个独立的小节，每小节包含约40行代码——总计约14,600行代码。通过新的方法，我在半小时内就把它缩减到了50行之内，我的自尊心在那一刻受到了打击。在此之前，我还为自己能够完全用蛮力——手动输入去完成工作而感到自豪。我意识到，如果我能像计算机本身思考的方式那样循环思考，它就能自动优雅地完成我安排的工作。我只需要学会以正确的方式来为计算机设定不停重复的任务，然后就可以像玩具车那样给它上紧发条，它就能自己跑起来了！'
  - '[PAGE 16]


    让计算机一遍又一遍地做同样的事情，看似是我们在占它不够聪明的便宜。但作为人类，我们必须运用自己的智慧，把重复转化为代码中的一种艺术形式。毫无疑问，计算机拥有自己专属的语言，有特定的词汇和语法。为了能流畅地与它沟通，你需要掌握比本书更多的内容。不过，我可以帮你了解计算最基本的要点，为此，我将先绕道带你了解软件的本质。'
  - '[PAGE 17]


    # 硬件可见，软件不可见


    21世纪初，当时我还在麻省理工学院媒体实验室。我和摩托罗拉的一位高管聊天，讨论标志性的StarTAC翻盖手机及其在普及移动电话方面取得的惊人成功。我非常看好这款手机的市场潜力，但这位高管不这么认为。我至今还记得他通过一个预言向我解释了当时这款手机为什么开始滞销，这个预言后来成真了。他说：“过去你可以指望给用户提供一台很棒的硬件设备，配套的只读光盘随时都可以被扔掉。但在不久的将来，你会反过来扔掉硬件保留软件。”其实，他描述的正是我们生活的这个时代，如今应用软件无处不在，我们更依赖软件，而不是实体的设备。


    表面上，大多数软件都有一个视觉标志，让我们误以为这就是计算机的本体。实际上，你在屏幕上看到的应用软件更接近快餐店的“得来速”标志——你开车到标志前对它喊话，可是这个标志里面什么也没有，它连接着离你只有几辆车距离的忙碌后厨。就像你无法通过拆解“得来速”标志背后的麦克风来了解真正的餐厅是如何运作的，计算机屏幕上的像素也无法告诉我们与之相连的计算机的任何信息。相比之下，当你试着打开运行这个应用程序的硬件时，尽管它的内部结构有些混乱，但你仍然可以找到屏幕、电池或电源，以及一些可见的组成部分。你可以触摸现实世界中的一件物品，在某种程度上理解它。现实世界中的机器是由电线、齿轮和软管组成的，这些对你来说还比较容易理解，可数字世界中的机器是由“比特”或“0和1”组成的，这些都是我们的肉眼无法看见的。


    那么，在上一节中我为父母的豆腐店制作的每月账单程序的代码又是怎么一回事呢？这个软件是用BASIC语言编写的，你可以用眼睛阅读它或者用耳朵聆听它。软件是可见的吗？是，也不是。一方面，程序代码是软件的核心，你可以阅读它，但这就像把制作蛋糕的菜谱和蛋糕本身混淆了那样。软件是机器内部通过程序代码运行的东西——它是蛋糕本身，不是制作蛋糕的菜谱。这个概念上的飞跃可能不容易理解。


    理解在计算机“头脑”中运行的软件与输入计算机的程序代码之间的差别对此有些帮助，因为这让你对计算中真正发生的事有概念上的认知。它让你不再相信计算机代码只是计算机代码——表面上你能看到的一切。计算机代码所代表的才是真正的潜力所在。这就好像你在这一页上读到的文字会在你的脑中激发无形的想法，所以你经历的并不是文字本身，而是隐藏在文字背后的无形想法。同样地，你知道你的想象力被适当的文学能量（我希望包括本书）滋养时会变得多么强'
  - '[PAGE 18]


    大，你的大脑也会被赋予力量去做你以前认为不可能做到的事情。这就是一个精心设计的计算机程序通过手指轻敲或双击被激活时发生的事情——一种替代的、无形的意识瞬间显现，就像给完全干燥的海绵注水的神奇时刻。


    计算机可以在“赛博空间”中自由想象，“赛博空间”是威廉·吉布森（William Gibson）在1984年的小说《神经漫游者》（*Neuromancer*）中创造的一个术语，同年我开始在麻省理工学院上学：


    赛博空间。一种交互式幻象，全世界每天都有数十亿合法操作员和学习数学概念的孩子在体验……不可思议的复杂。一条条光线延伸在意识、数据簇和数据群交汇的虚拟空间中。就像城市的灯光渐渐远去……


    迷幻，但准确，或者至少接近我在写代码时在机器“内部”的无形世界中本能的体验——请注意，“内部”这个词附带的引号很重要，因为可见的应用程序之下什么也没有。在互联网出现之前，有一个计算机可以轻松进入的下层宇宙。而今，由于互联网和网络设备的普及，这个宇宙的扩张已经远远超出任何像我这样一开始就置身其中的幸运书呆子的预测。吉布森笔下每天被数十亿人体验的“交互式幻象”一方面可以映射脸书（Facebook）、当今任何一个社交媒体网络或一个丰富多彩的三维虚拟世界中的多人电子游戏——或者吉布森所指的“不可思议的复杂”代表的不太具体的方向，这较好地归纳了我在他的诗意描述“条条光线延伸在意识、数据簇和数据群交汇的虚拟空间中”中感受到的东西。


    如你所见，我对这个主题异常热情，并且非常渴望你能和我一起理解它。无论是1993年在京都创作艺术装置（将计算机的内部运作具象化为一个真正的迪斯科舞厅，人们在其中扮演计算机零件），还是2005年在巴黎卡地亚基金会展出作品（在漆黑画廊的九块大屏幕上投射数十亿个像蜜蜂那样嗡嗡作响的混乱粒子），我都希望更多的人能体验数字意识是怎样一种感觉。为什么？因为我相信若要与机器沟通，你也需要“生活”在机器的世界里。不幸的是，机器的世界本质上是不可见的。


    一种理解机器的方法是成为一名大师级计算机程序员，但不是每个人都想这么做。因此，我们在继续阅读本书的余下章节时，试着沿用吉布森对“赛博空间”的描述，去看看机器母语使用者们是如何集体“看见”无形的事物的。


    在我们完全跳回赛博空间之前，让我们浅谈一下本书最后一章的主题——机器自动化失衡，来研究计算历史中另一个不可见的方面，了解这一点将大有裨益。和任何一台高效的计算机一样，人类的任何历史都会不断重复，直到它被视为事实。因此，在你对机器感到过于兴奋之前，让我们通过回顾计算机还是完全可见'
  - '[PAGE 19]


    的人类的时期，来拥抱更多的不可见。在这个过程中，你将有机会重写计算的历史，通过正确地收录很多被不公平地忽略的女性专家。'
  - '[PAGE 20]


    # # 人类是最早的计算机


    John Maeda, “First Use of the Word ‘Computer,’” How to Speak Machine (blog), February
    24, 2019, howtospeakmachine.com/2019/02/24/first-use-of-the-word-computer. 详见wordnik.com/words/computer。


    最早的“计算机”（computer）并非指机器，而是与数字打交道的人类——这一定义可以追溯到1613年，当时英国作家理查德·布雷斯韦特（Richard Braithwaite）将“有史以来最优秀的算术专家”描述为“有史以来最准确的计算机”。②几个世纪后，1895年版的《世纪词典》③对computer的定义如下：


    做计算的人；计算者 (reckoner)；做算术的人 (calculator)；具体地说，是为数学家、天文学家、测地学家等做算术计算的人。也可以拼写为computor。


    公共事业振兴署（Works Progress Administration）是大萧条时期美国总统罗斯福实施新政时建立的一个政府机构，用以解决当时大规模的失业问题。编者注。


    在20世纪初期和中期，computer这个词指的是用铅笔和纸工作的人。如果大萧条没有袭击美国，可能不会出现那么多人类计算者。作为创造就业和刺激经济的一种手段，公共事业振兴署
    ④启动了由数学家格特鲁德·布兰奇博士（Dr. Gertrude Blanch）领导的“数学表项目”（Mathematical Tables Project），目标是雇用数百名失业美国人用十年的时间手工制作各种数学函数的表格。今天你在科学计算器上很容易获得这些函数计算的结果，比如自然指数函数e或某个角度的三角正弦值，但当时它们被安排在28本厚重的书中，人们用这些书查找已计算好的结果。我很开心能在最近的一次拍卖会上拍到一本这么罕见的书，却发现布兰奇博士并没有被列为合著者。因此，不仅传统计算存在不可见的问题，我意识到了人类计算也同样存在不可见的问题。


    试想一下，数百人挤在房间里做数学题，他们都用铅笔和纸进行计算。你可以想象这些人会感到无聊，会需要休息时间去吃饭、上厕所或者回家睡觉。你还需要记住，人有时会犯错。所以，前一天晚上在派对上待得太久而且上班迟到的人，可能会算错一两次。坦白地说，与今天我们使用的计算机相比，人类计算者速度相对较慢，有时前后不一致，偶尔还会犯今天的电子计算机永远不会犯的错误。'
  - '[PAGE 21]


    但在电子计算机取代人类计算者之前，世界只能将就着用人类计算者。就在这个时候，艾伦·图灵博士（Dr.Alan Turing）和图灵机出场了。


    图灵机的想法源自图灵博士1936年的开创性论文《论可计算数及其在判定问题上的应用》（ “On Computable Numbers, with an Application
    to the Entscheidungsproblem” ），该论文介绍了一种描述一台可行的“计算机器”的方法，包括在长纸带上进行写入和读取数字这两种基本操作，以及在这条纸带的任何地方写入或读取数字的能力。机器将被输入一种条件状态，该状态根据它可以读取的内容来确定磁带上的数字将被写入或重写的位置，这样就可以进行计算了。尽管以当时的技术还无法制造出真正的“计算机”，但图灵发明了构成所有现代计算机基础的思想。他声称，这样的机器可以通过将编程代码存储到处理计算的磁带本身来实现任何计算。这正是今天所有计算机的工作方式：计算机用于进行计算的内存也用于存储代码。


    详见seas.upenn.edu/about/history-heritage/eniac/.

    “ENIAC Programmers Project,” First Byte Productions, LLC, 2019,

    eniacprogrammers.org/eniacprogrammers-project/.


    与许多人类计算者在纸上计算不同，图灵设想了这样一种机器，它可以在无限长的纸条上不知疲倦地计算数字，以同样的热情进行1次、365次，甚至10亿次计算，没有任何犹豫、停顿或抱怨。人类计算者如何与这样的机器竞争？10年后，为美国陆军建造的电子数值积分计算机（Electronic
    Numerical Integrator and Computer，以下简称ENIAC） 成为实现图灵理论的第一批可用的计算机之一。当时的主流观点是，制造ENIAC的重点在于硬件的打造——这归功于ENIAC的发明者约翰·莫奇利（John
    Mauchly）和约翰·普雷斯珀·埃克特（John Presper Eckert）。而被认为“次要”的计算机编程工作则由弗朗西丝·伊丽莎白·斯奈德·霍伯顿（Frances
    Elizabeth Snyder Holberton）、弗朗西丝·比拉斯·斯宾塞（Frances Bilas Spence）、露丝·利希特曼·泰特鲍姆（Ruth
    Lichterman Teitelbaum）、简·詹宁斯·巴蒂克（Jean Jennings Bartik）、凯瑟琳·麦克努尔蒂·莫奇利·安东内利（Kathleen
    McNulty Mauchly Antonelli）和马琳·韦斯科夫·梅尔策（Marlyn Wescoff Meltzer）组成的人类计算者团队完成——这对该项目至关重要，然而长期以来ENIAC的女性计算者们都没有得到认可。


    此后，随着计算可以在比ENIAC更强大的计算机上运行，人类计算者逐渐消失，计算行为本身让位于撰写用于在机器可以轻松读取的打孔卡上进行计算的指令。20世纪50年代末，格蕾丝·霍珀博士（Dr.Grace
    Hopper）发明了第一种“人类可读”的计算机语言，这让人们更容易与机器对话。20世纪60年代，美国国家航空航天局（NASA）的科学家玛格丽特·汉密尔顿（Margaret
    Hamilton）在麻省理工'
  - '[PAGE 22]


    学院首次将编写这些程序指令的手艺称为“软件工程”（Software Engineering）。就在这个时候，新兴半导体行业的先驱工程师戈登·摩尔（Gordon
    Moore）预测，计算机的计算能力大约每年会翻一番，于是所谓的“摩尔定律”（Moore’s Law）诞生了。短短20年后，我有幸在麻省理工学院获得了汉密尔顿命名的这个领域的学位，而那时计算机的计算能力已经翻了数千倍，摩尔的指数预测被证明是正确的。


    当我们面无表情地在一个金属盒子前打字时，我们很容易忽视人性，为了与人性保持联系，我试着将在布兰奇博士的时代最早扮演“计算机器”角色的人们铭记在心。这让我们想起我们与今天的机器共享的本质上属于人类的过往。那本我竞拍获得的布兰奇博士团队的制表书《弧度制的圆周和双曲正切与余切表》（Table
    of Circular and Hyperbolic Tangents and Cotangents for Radian Arguments）有400多页，其中有200个数字计算了到小数点后7位——我发现印在这些页面上的某些计算是不正确的，这很可能是人为错误。正是人类，发明了能消除某些人为错误的图灵机，让我们能够用许多奇妙的语言与机器沟通。但我们很容易忘记，人类总会犯错——无论当我们做机器的工作时，还是当我们让机器代替我们犯错时。计算有一个共同的祖先：我们。尽管从历史上看，我们在计算机上犯的错误大多在计算本身，但我们现在需要直面那些嵌入计算的错误的人类假设，比如历史上无数女性在计算领域扮演的角色被忽略的事实。计算是由我们创造的，现在我们应该共同对它的结果负责。'
