    在数学世界里，一种简洁的算法在20世纪70年代精练地表述了生命的彼此依赖，即《康威的生命游戏》（Conway’s Game of Life）。由于标题里有“生命游戏”这几个字，康威的“生命”很容易引起误解，因为它让人想起了1960年发明的一款更为知名的家庭桌游，比起康威的游戏的黑白格子，这款桌游给玩家带来了更有趣的体验。此外，《康威的生命游戏》并不是为了好玩而设计的，它更像数学游戏——你只有对数学感兴趣才会觉得有趣。幸运的是，你进入的计算世界很大程度上基于数学，这将帮助你欣赏这枚重要的宝石。至少我希望如此……


    《康威的生命游戏》在一个类似沃尔夫夫勒姆的“规则30”的网格上进行，但使用的是二维单元格。这里只有4条数学规则，每条规则都是一个过分简化的模型，用来模拟一个生命形式如何与“生活”在网格上的相邻生命形式进行交互。


    +   规则1：如果一个活单元格只有一个活着的邻居，它将因孤独而死亡。


    +   规则2：如果一个活单元格有一些活着的邻居，那么它是稳定的，将继续存活。


    +   规则3：如果一个活单元格有太多活着的邻居，它将因过度拥挤而死亡。


    +   规则4：如果一个单元格是空的，并且它有一些活着的邻居，那么交配将导致一个新的活单元格诞生。


    我们可以在桌子上用手和黑白纸片一步一步地执行这些规则，黑纸片表示一个单元格是“活的”，白纸片表示一个单元格是“死的”。你可以想象在一个大网格上进行第二次或第三次迭代后，它会变得相当无聊。幸运的是，到20世纪80年代，计算'
