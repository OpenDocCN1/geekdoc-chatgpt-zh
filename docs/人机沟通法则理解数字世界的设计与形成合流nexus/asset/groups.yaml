    MVP 的设计方法是用最小或“精益”的方式给消费者他们想要的东西，而不一定将其完全实现。考虑到云的工作方式及其前所未有的测试不完整想法的能力，MVP已经成为将想法推向世界的主导方法。尽管“可行”的定义在旁观者看来是有争议的——因为实际搭建软件系统的人通常有工程背景，其中“可行”表示可靠且缺陷尽可能少。毕竟，一座桥如果会随机把汽车踢下桥或者突然倒塌，又有什么用呢？如果一座桥不能承受多辆车的重量，用美丽的花纹来装饰它又有什么用呢？因为如果技术不起作用，那么我们制作的最小产品哪怕在最基本的层面上都会失败。快速制作安全、稳健并且在工程上可行的软件系统不是一项可以掉以轻心的任务。因此，“最小可行”往往意味着在产品的功能方面优先考虑所有可用资源。


