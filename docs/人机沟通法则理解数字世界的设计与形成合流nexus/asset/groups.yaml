    此，如果投资界的尽职调查是业内最高标准，那么时不时与真正的客户交谈也是很有商业意义的。


    Clifford Geertz, The Interpretation of Cultures (New York: Basic Books, 1973).


    这是优秀人种学研究的典范：为了理解一种文化现象，你需要尽可能地接近“一手”信息，而不是依赖二手或三手信息。此外，为了真正理解一手信息，你需要花时间去了解和理解它的文化背景。文化人类学家克里福德·吉尔茨（Clifford
    Geertz）将人种学的终极目标定义为“厚描述”，与“薄描述”相对。薄描述仅关注浮于表面的细节，而厚描述比直接观察要深入得多，它试图捕捉表面之下的许多层次。


    Tricia Wang, “Why Big Data Needs Thick Data,” Ethnography Matters (blog), January
    20, 2016, medium.com/ethnography-matters/why-big-data-needs-thick-data-b4b3e75e3d7.


    例如，根据我的WordPress产品工作经验，我知道听到这样的薄描述是很常见的：“90%的人把大部分时间花在查看他们的博客的浏览统计上。”由此得出结论，浏览统计是一个需要改进的重要功能。但是这样的分析很快就会被一名用户的厚描述打断，他会告诉你博客的浏览统计是登录WordPress后看到的第一页，因为统计页面显示的浏览量为零，所以他没有动力继续使用博客。因此，问题不在于改善浏览统计页面，而在于让博主写出能增加浏览量并建立读者群的内容。人们很容易让听起来令人印象深刻的聚合数据成为有说服力的行动理由，而忽略了更严重的潜在问题。因此，在面对定量数据时，重要的是了解科技人种学家特里西亚·王（Tricia
    Wang）所说的“厚数据”，与“大数据”相对。收集厚数据需要时间，而对其进行充分解释则需要更长的时间。你需要沉浸在收集到的厚数据中，以充分捕捉你的人类同伴的上下文，否则这份额外投资将收效甚微。量化处理大数据的诱惑和便利会不断地把你从理解厚数据所需的时间投入中抽离出来。


    作为一个忙碌的人，我承认我喜欢躲在电脑屏幕后面，坐在舒适的工作椅上，因为这样可以高效地完成很多工作，而且自己的节奏不会受到周围环境的干扰。但是，自从我受Intuit的创始人斯科特·库克（Scott
    Cook）“与客户一起回家”（早在第一次推出Quicken的时候，他就会看着客户安装和运行软件系统）的习惯的启发，开始积极地与客户面对面工作以来，我就意识到这些时间是非常值得投资的。这提高了你为客户服务的风险。这可能是一件非常不舒服的事情，因为你很快就会知道你做出的产品决定让其他人失望了。当你亲自收集厚数据时，要小心自己很容易产生偏见，认为一个客户的问题代表了所有客户的问题。现在，你已经接受了不完美，请放手去做吧。'
