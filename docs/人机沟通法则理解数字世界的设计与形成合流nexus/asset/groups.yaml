    修利（D.L. Hughley）乐观地回答：“你不可能教会机器种族主义。”②不幸的是，他的判断是不正确的，因为人工智能已经从我们这儿学到了种族主义。让我们再次回顾新形式的人工智能与过去的人工智能有什么不同。过去，我们会定义不同的if-then模式和数学公式来描述输入和输出之间的关系，就像在微软Excel电子表格中那样。当推理出错时，我们会查看编码的if-then逻辑，看看是否遗漏了什么，并且（或者）查看数学公式，看看是否需要额外调整。但在机器智能的新世界里，你把数据输入神经网络，然后一个神奇的黑匣子就诞生了：你给它一些输入，输出就会神奇地出现。你无须明确地编写任何程序就造出了一台智能机器。当你能给它提供大量数据时，你就能在“机器智能能用较新的深度学习算法做什么”方面取得巨大飞跃——随着数据量越来越大，其结果也会显著地变好。②


    机器学习以过去为基础。因此，以前没有发生过的事情未来也不会发生——这就是为什么如果我们继续保持相同的行为，人工智能最终会自动化并放大已有的趋势和偏见。换言之，如果人工智能的主人不好，那么人工智能就不会好。但是，当系统在很大程度上像新的人工智能那样自动运行时，媒体的强烈反对是否会将“失误”归咎于人工智能而非人类呢？我们决不能忘记一切错误都可归咎于人类，当我们开始纠正这些错误时，机器更有可能观察我们并向我们学习。但它们不太可能自己做出这些纠正，除非它们已经接触到足够数量的人类设定的例子，这些人可以提供正确的纠正行为数据来重新平衡它们的数字大脑。


