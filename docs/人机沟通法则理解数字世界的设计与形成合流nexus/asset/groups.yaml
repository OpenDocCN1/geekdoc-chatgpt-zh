    以此类推，重复360次……


    我用1-365指代一年中的每一天，把它们连成一个长长的程序。除了豆腐和寿司用腐皮（油炸豆皮），我们还售卖五六种产品，为此我添加了更多的对话文本。所以，一年中的每一天都需要输入很多字段，其中出现了很多GOTO语句，目的是以更清晰的方式告诉母亲哪些数据需要她手动输入。


