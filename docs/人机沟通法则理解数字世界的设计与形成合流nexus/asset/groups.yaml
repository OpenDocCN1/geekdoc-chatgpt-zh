    | 独立地工作 | 互相扶持地工作 |


    合作比协作更容易，因为合作不需要深入了解对方。在计算机发展的大部分阶段，大多数人一直在学习如何应对不知何故在不断变化的机器并与之合作。与此同时，在硅谷之类的地方，相对较少的计算思考者却一直在以摩尔速度与潜伏在云中的全知者协作。我们不得不相信他们都能代表全体人类进行良好的协作。也许在读完本书之前，你无法轻松与计算机协作，或者直接与它们的人类协作者共事。这是可以理解的，因为你还没有花时间去参观它们无形的宇宙，了解它们的历史、习俗和规范。你完全不懂机器的语言。但现在你懂了，哪怕只懂了“一比特”。


    我们的机器循环运行。我们的机器在无限大和无限小的尺度上运行。我们的机器是有生命的。我们的机器是不完整且不完美的，和我们一样。我们的机器被测量的次数越来越多，并且知道我们在做什么。


    我们的机器在我们的监督下在全世界范围内让失衡自动化。关注机器。关心人类。让我们出发吧。


    ## 致谢


    本书献给我的父母，伊琳娜·前田佑美和前田洋次。如果没有他们设法攒够钱给我买一台计算机，我就永远不会有机会像现在的我这样了解它。


    编辑尼基·帕帕多普洛斯（Niki Papadopoulos）给了我写这本书的许可和鼓励——对此我深表感谢。尼基为我提供了心理上的安全空间，让我可以充分探索你在本书中读到的想法。雷夫·萨加林（Rafe
    Sagalyn）的远见卓识始终伴我左右，劳拉·帕克（Laura Parker）是我一路走来的写作导师。丽贝卡·肖恩塔尔（Rebecca Shoenthal）与Portfolio出版公司的工作人员一起，满怀热忱地把整个项目推进到终点。我很感谢整个团队，他们把这本书以你现在读到的形式呈现给你。我要特别感谢本书的技术审稿人：凯文·白求恩（Kevin
    Bethune）、特雷西·周（Tracy Chou）、马丁·埃里克森（Martin Eriksson）、亚历克西斯·劳埃德（Alexis Lloyd）、罗谢尔·金（Rochelle
    King）和特蕾莎·奥斯汀（Theresa Austin）。他们都帮我找到了我散落在手稿中的许多错误。


    在我以人文主义者的身份理解计算的道路上，有些人的想法和鼓励对我影响深远。他们都是我在麻省理工学院的时候遇到的英雄，在很多情况下，我因有他们作为导师而感到幸运。我不知道你们是不是也有这样的感觉：随着年龄的增长，你曾经仰慕的人似乎都消失了，比如穆里尔·库珀（Muriel
    Cooper）、保罗·兰德（Paul Rand）、田中一光（Ikko Tanaka）、威廉·J.米切尔、罗伯特·西尔贝（Robert Silbey）、雷德·伯恩斯（Red
    Burns）、查尔斯·M. 维斯特、惠特曼·理查兹（Whitman Richards）、片冈满（Mits Kataoka），以及我在20世纪80年代的麻省理工学院遇到的人工智能教授和前同事帕特里克·亨利·温斯顿（Patrick
    Henry Winston）。我感到幸运的是在他们还活着的时候我就接触到了他们的思维方式，因为只要知道了新鲜面包和隔夜面包之间的差别，你就很难满足于新鲜出炉的面包之外的任何面包了。


    从我的系统中清除了计算错误（以及一堆错误）之后，我的兴趣便转向了另一个让我着迷的领域：组织及其如何转型，或者如何不转型。鉴于摩尔定律持续对我们的世界产生加倍的影响，组织开始变革是明智之举。并且要快。并且最好是以指数级速度。我对这一问题的看法受到了雷吉娜·杜根、雨果·萨拉辛（Hugo
    Sarrazin）、艾薇·罗斯（Ivy Ross）、杰森·弗里德（Jason Fried）、金·斯科特（Kim Scott）、斯科特·贝尔斯基（Scott
    Belsky）、贝丝·康斯托克（Beth Comstock）、贝基·贝尔蒙特（Becky Bermont）、凯特·诺恩（Cat Noone）、哈吉·弗莱明（Hajj
    Flemings）、玛丽亚·朱迪斯（Maria Giudice）、大卫·格兰杰（David Granger）、玛丽娜·米哈拉基斯（Marina Mihalakis）、贝蒂·先和本尼·先（Betty
    and Benny Xian）、乔治亚·弗朗西斯·金（Georgia Frances King）、凯瑟琳·施瓦布（Katharine Schwab）等人的影响。当我打出这份名单时，我意识到了它是不完整的，所以很自然地，我应该在本书的网站howtospeakmachine.com上对这份名单进行迭代。


    最后，我要感谢本·一之濑（Ben Ichinose, 1929-2019）。作为一个陌生人，他在《简单法则》出版后不久给我打了电话，想让我去看看他家的后院。作为一名退休的牙齿矫正医生，他花了几年时间手工打造了一个传统的日式花园，以体现他的简单法则。在他的多次来电和我的一再拒绝之后，我还是去看了他家的后院。他戴着标志性的飞行员墨镜，开了一瓶1966年的葡萄酒向我敬酒，同时切开一块新鲜的面包。如果说我这辈子遇到的人中有谁体现了计算的奇特魅力，那一定是本。


    ## 译后记


    前田约翰作为曾经的麻省理工学院终身教授、罗德岛设计学院第16任校长，从出席美国国会推动STEAM教育系统改革到担任微软的设计与人工智能副主席，他花了6年时间身处硅谷最前线探索总结而写成本书，与2006年出版的被翻译成14种语言的《简单法则》整整相隔13年。这位人工智能先驱会给我们带来哪些全新的观点？


    > “对很多不懂如何与机器沟通的人来说，我们正在以一种完全不公平的方式接近奇点。”


    人类已经不可避免地迈入了人工智能时代，试想如果有这么多大多数人不理解的东西正在支配世界，却只有极少数技术人员能完全理解它们并构建新世界的游戏规则，你会如何看待这种不平等呢？为了弥补这一点，前田先生希望向各位未来的共创者、决策者（非计算机背景的读者）清楚地解释这一切，这是他自20世纪90年代起就一直在做的事情。从向硅谷的人们解释“计算设计”将如何改变身边的事物，到完成对身处人工智能时代的每个人都影响深远的本书，他的目的是“找到一种让更多的非技术人士开始建立对计算的基本理解的方法”。


    2013年，我开始研读前田先生的第一本书，10年后再遇见先生的书，我深感幸运。我想感谢恩师向帆教授的鼓励与出版方的信任，让我有机会从人工智能技术的使用者转变为“计算设计”理念的研究者，参与前田先生在人工智能时代最重要的一本著作的翻译工作。此外，多位前沿科技从业者参与了该译本的调研和审校工作：方贞硕、李紫嫣、赵辰伟、张宇翔、黄河清、黄东敏、陈文倩、俎琬滢等。但愿该译本能尽力还原作者的本意，让冰冷的技术具有包容性，能真正地被更多人知晓与理解。


    感谢微本书撰写推荐语、支持并推动人工智能发展的教授前辈们，其中包括谷雪梅、丁文璠和钱世政。最后，我想特别感谢后浪出版公司相关人员的辛苦工作！


    何盈


