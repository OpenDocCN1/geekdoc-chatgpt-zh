    因此，把一个数字乘以1,000的力量惊人，让数字5以《杰克与豆茎》里的速度增长。在这个故事里，一颗小豆子在被种下的第二天早晨就长成了直冲云霄的巨型豆茎。为了进一步理解这一点，你可以让你的大脑扫描前文的“+5”，感受乘法计算带来的指数级“飞跃”，并由此体会×蕴藏的+不具备的能量。


    指数增长扎根于计算机固有的运作方式中。这是可用计算内存量的演进过程。这也是计算机的处理能力的演进过程。所以当你在硅谷听人们谈论未来时，值得注

