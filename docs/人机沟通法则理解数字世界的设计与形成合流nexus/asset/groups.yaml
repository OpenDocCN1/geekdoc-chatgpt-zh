    你应该已经能够感觉到，与上一个10年相比，你身边的计算体验有所不同。这就是天然酵母计算和工业酵母计算之间的区别，但你可能没有注意到从闻起来计算机感很重的人工智能到完全没有计算机气味的人工智能的巨大飞跃。数以百万计在云端某处运行的不可见的计算循环——尽管在无限的尺度和无尽的细节层面上运行，却从未减速或感到疲倦——的强度和能力一直在不断增强。科技行业和投资界都在努力推动这些强大无比的系统的发展，这些系统不像制造它们的冷冰冰的计算材料，它们利用了艺术家的观察和自己对人类及其环境的深刻理解。因此，我们可能会遇到更多的人类替代品，它们会眨眼、微笑、跳舞，用几个“嗯”来表达不确定，甚至用调情来吸引你的注意。它们会非常讨人喜欢，因为它们永远不会放弃提高自己，而且每时每刻都能从你身上获得越来越多的知识。


    我们知道计算机擅长模仿我们的行为，擅长相互协作，也擅长处理大规模的任务和精确的细节。如果你是老板，你的第一反应想必是：你被录用了！紧随其后的反应是：你最终会替代我的工作吗？应对这种担忧的方法，是记住一个好老板的目标是成为一个可被替代的人，这样你的团队就会比你成长得更快。所以，从某种意义上说，作为一个好老板，对这些担忧的回答应该是肯定的。其次，记住如果你不断提升自己的能力，那么你就永远不可能被完全取代——我们的目标在不断变动，这就是我们难以被复制的原因。所以，尽你所能去变得大胆，就像和你一起工作的年轻一代，不要害怕，和他们一样大胆地跳进未知的世界。然后，当你认识到摆在你面前的挑战有多么艰巨时，拿出你的勇气和经验，正如我已故的导师威廉·J.米切尔（William
    J. Mitchell）经常说的：“全力以赴完成它！”勇士不能杞人忧天。直面挑战，而不是逃避它。


    我非常幸运能够深入接触人工智能这个领域，这几乎贯穿了我的一生。在有机会思考我将在接下来的三章里与大家分享的一系列想法后，我感受到了内心的觉醒。今天，我觉得有必要重新思考计算在新产品和新服务的设计中的意义，因为我们正处于一个转折点，这将不可逆转地影响人类未来。对很多不懂如何与机器沟通的人来说，我们正在以一种完全不公平的方式接近奇点。以目前的发展速度，加上少数掌握计算机技术的人将主宰不掌握计算机技术的人的看法，我们将会把一小群精通计算机技术的创造者的偏见嵌入永恒的云端。


    我感觉此时此刻，是猝然之间整个池塘被睡莲叶完全覆盖之前的最后一次机会。因此，让我们转向使用计算机制造的能循环、变得更大、变得更像人的产品的影响。谷歌、苹果、脸书、亚马逊、微软、阿里巴巴等公司早已进入这个领域，拥有巨大的先发优势。你正在勇敢地挑战——而不仅仅是有胆量。现在，让我们来了解计算产品与其他产品的本质区别，这些产品迫切需要你的新视角。我们需要让你用天然酵母和工业酵母烘焙自己的招牌面包，以创造未来需要的具有代表性和多样性的充分思考。奇点尚未到来，让我们开始烘焙吧！


    ## 第四章

    ### 机器是不完整的


    ### 适时的设计比永恒的设计更重要


    Kent Beck et al., “Manifesto for Agile Software Development,” 2001, agilemanifesto.org.
    Jeff Gothelf, “Tag: Lean Startup,” Jeff Gothelf (blog), December 15, 2016, jeffgothelf.com/blog/tag/lean-startup.
    Scrum是一个管理框架，团队用它来自我组织并朝着一个共同的目标努力。它描述了一组用于高效项目交付的会议、工具和角色。软件团队可以使用Scrum解决复杂的问题，既经济又可持续。译者注。
    Emam Hossain, et al., “Using Scrum in Global Software Development: A Systematic
    Literature Review,” 2009 Fourth IEEE International Conference on Global Software
    Engineering, ieeexplore.ieee.org/abstract/document/5196931.


    软件开发者使用奇怪的行话。如果你在他们身边待得够久，你会听到“敏捷”（agile）一词并好奇为什么没有更多的程序员穿运动服，你还会听到“精益”（lean）一词并好奇为什么随处可见糖果包装袋。Scrum又是什么意思？也许是你没看过的某部科幻电影？这些术语本质上都在描述一种计算哲学：发布一个不完整但会进行多次迭代的产品，而非试图交付一个完整的产品。


    这种方式相对较新。传统的软件产品开发方式是“瀑布式开发”，这是一系列从高处开始逐步向下完成的逻辑步骤，就像水流从悬崖上跌落那样。“瀑布式开发”是线性过程，要有对产品需求、设计、实现、测试和维护细致入微的关注。你制造任何常见的实体产品（如汽车）都会采用这种方法。但是，在交付一辆车后，你不可能对它进行修改，除非发布产品召回，这不仅麻烦，还会损害公司的声誉。有时候，瀑布可能要花好几年时间才能流到产品制造完成的那一刻，并且成品可能会很滑稽。例如，一位汽车行业的设计师曾经告诉我，一家大型汽车公司曾预测所有的汽车都将配备传真机。因此，他们在汽车内部为传真机设计了一个专用的隔间。几年后，当这款汽车最终被制造出来的时候，传真机并没有像预测的那样无处不在，这导致成品汽车内部有一个毫无用处的硕大空间。


    在过去——甚至在今天，设计生产流水线的目标只有一个，就是降低其中每个单元的额外成本（或者说边际成本），以实现更大的规模经济并增加每个单元的利润。数字产品的发布属于曾经只存在于传说中的商业模式，即“边际成本接近零”——这是一个难得的机会，因为这意味着制作和分发一款数字产品的数百或数千份副本没有任何风险。此外，你永远不用处理库存、产品运输的管理和所有相关成本。对有传统制造业背景的人来说，想象这样一个极佳的商业模式的存在是一个相当大的概念飞跃——但考虑到您现在已经知道计算是一种不受物理规律约束的原材料，想象这一点就变得很容易了。因此，挑战现有的商业法则不仅应该让人觉得很容易，还应该让人觉得合乎逻辑。


    数字产品的这种特性不仅意味着它们在生产和分销成本上有经济优势，还意味着产品开发成本可以通过选择不交付最终成品而显著降低。你总是可以用一款全新的、逐步改进的数字产品“替换”之前的那款，避免为了交付最终成品进行高额投资的风险。除此之外，远程监控用户如何使用产品的功能意味着产品制造商可以轻松推动产品设计走向最适合终端用户的方向。


    在一个纯粹由计算构成的世界里，发布一个更改是如此迅捷，以至你常常没有注意到改变的发生。不出所料，在计算时代，速度是品质的基本要求之一——“好”是由新功能以多快的速度到达你手中和你能以多快的速度让它为你效劳决定的。所以，尤其是考虑摩尔定律的倍增效应时，我们应该料到所有数字产品的速度都会是一年前的两倍，而制造它们的成本会与一年前相同甚至更低。想想某一天你把你的软件升级到“下一个版本”或者醒来时发现系统的新版本已经和昨晚完全不同了。你最常使用的计算产品每天都在优化，但你可能从来没有注意到这些改进，因为这些改进是由无数微小的变化日积月累而成的。


    如果你在寻找一个隐喻来解释这种变化，把手指指向天空即可。没错，这一切都有关我们与云端持续的联系。因为在制造、运输和改进数字产品方面，云技术使一种新的敏捷性成为可能。因为每个网络设备都受益于与云端的持续连接，这使任何地方的数据都可以被删除、刷新和同步。而且，由于云端和每一台连接到云端的电子设备可以随时被改变并准备更新，致力于创造一件值得现代艺术博物馆永久收藏的完美产品是自相矛盾的。云计算使对永恒设计的追求变得无关紧要——重要的是及时，更重要的是与时俱进，永不停止，在随时可能被淘汰的状态中寻找幸福和满足。


    > John Maeda, “Planned Obsolescence,” John Maeda’s Blog (blog), December 26, 2018,
    maeda.pm/2018/12/26/planned-obsolescence.

    > 在福特1922年的自传中，他回忆一名销售员曾建议他推出更多款式的汽车，当时他声称自己只会造黑色汽车，并回答：“任何人都可以把黑色汽车的外壳涂成任何颜色。”编者注。


    这听起来有点像某种形式的“计划淘汰”。这一商业策略在经济大萧条后由通用汽车公司（General Motors）推广开来，它试图让消费者觉得他们正在开的汽车已经过时，不再有吸引力，从而刺激他们升级自己的车。这种利用消费者的不安全感的策略，与亨利·福特（Henry
    Ford）更务实的做法背道而驰。福特的做法是为消费者提供外壳可以被涂成任何颜色的汽车，“只要它是黑色的”，并承诺汽车可以保值。但通用汽车以商业为导向的方式轻松战胜了福特的务实工程师方式。随着时间的推移，“计划淘汰”策略被环保人士视为资本主义的罪行，因为它导致消费者更快地抛弃正在使用的产品，以更新、更好的产品取代它们。但是，软件与计划淘汰的汽车不同的是计算媒介“总是过时”的固有属性，它们只需更新一次就可升级到更新、更好的版本，而且对环境影响小。事实上，硅谷对产品的标准期望，是软件在你睡觉，甚至在你使用时，都能不断改进和升级。


    这种策略也有阴险的一面，比如我们现在才知道的苹果和其他公司所做的事——故意为它们的软件逐步推送需要硬件升级才能正常运行的优化。这样一来，你要么错过了一个很酷的新功能，要么你的设备会运行缓慢，因为它需要更多的内存或更快的处理器。在很长一段时间里，苹果是唯一一家可以这么玩的公司，但是谷歌正在用它的Pixel硬件平台迎头赶上。当一家科技公司同时拥有软件和硬件时，你会以一种任何汽车公司都不曾想过的方式更有效地沉迷于最新版本和最新型号——你会像上了发条那样在每个财政季度准时支付相应费用。


    ### 设计圣殿没有统治21世纪


    如果设计是理性意图，那么我们需要改变我们理性思考的能力。但问题在于：传统的设计世界并不在云端，而在你美丽的客厅里。它是祖母给你的那把古董椅子。它是你结婚时收到的瑞典餐具。它是你花了好几个月才决定摆在铝制桌子上的法国皮箱。它是你坐在祖母的椅子上翻阅的那本时尚杂志，告诉你应该烧掉你的条纹外套，因为现在流行的是艺术家草间弥生（Yayoi
    Kusama）的圆点图案。这根本不是云的世界，但这正是我们热爱的设计。博物馆和画廊里到处都是这样的物品、体验和极其自以为是的提示，我们奉它们为珍宝，对此最恰当的形容就是在参拜设计圣殿。


    设计圣殿不是真实存在的地方，而是一个判断卓越设计的标准。严格、具体地说，它是一个由世界各地的博物馆、画廊、时尚美妆行业和艺术教育机构运作的垄断组织，它决定了什么是卓越的设计——也就是“他们认为卓越的设计。如果你看不出一个设计有多棒，那么，好吧，你就不是设计师。我还在试图揣摩什么是设计时，就被这个结论折磨过，尽管我刚获得麻省理工学院的学位，但我仍不是设计师。因此，为了寻找设计圣殿，我去了一所艺术学校攻读学位，并且在很久以后真的管理了一所艺术学校。


    长话短说，成为设计圣殿里合格的一员只有两个要求：（1）你需要了解艺术和设计的历史；（2）你需要像设计师那样思考和工作。满足第一个要求只需要大量阅读、参观博物馆和图书馆、投入几千小时来学习。它不痛苦，而且令人享受其中。如今变得更容易的是你可以带着智能手机走进设计博物馆——这样你可以比我当年学得快得多。我花了四年时间在筑波大学的艺术和设计图书馆里钻研，如果我动动手指就可以用谷歌搜索，我用四年的零头就可以学会了！


    > Hans M. Wingler, Bauhaus (Cambridge, MA: MIT Press, 1969), mitpress.mit.edu/books/bauhaus.

    >

    > K. Anders Ericsson, Ralf Th.Krampe, and Clemens Tesch-Römer, “The Role of Deliberate
    Practice in the Acquisition of Expert Performance,” Psychological Review 100,
    no. 3 (1993): 363-406, projects.ict.usc.edu/itw/gel/EricssonDeliberatePracticePR93.pdf.


    进入设计圣殿的另一个要求——像设计师那样思考和工作——比用谷歌搜索设计的历史难多了。但是了解包豪斯学校的基本知识至少能让你一只脚踏进这个俱乐部，所以这是一笔有价值的基础投资。②但要真正成为一名设计师，你需要亲手设计一些东西。你可能会做出一些糟糕的东西但没有完全意识到它有多么糟糕，直到一名受过训练的设计师看到它。学习最基本的设计只需要几十个小时的练习，但要想出众并成为一名真正的设计师，你需要众所周知的一万小时刻意练习③，这将使你成为一个受过正规训练的人。


    作为一个从设计训练营毕业的人，我可以告诉你在你选择解决的问题或者你选择解决方案的方式中，存在三种设计风格：


    - 1. 过时风格（Out of style）：这意味着你太迟了。你错过了时机。你没有留意趋势，被时代淘汰了。一开始你可能会受到一些排斥，但如果你坚定信念、有毅力，你便有可能战胜困难。

    - 2. 流行风格（In style）：这意味着你的时机刚刚好，你舒适地融入了大多数人。你通过解码流行元素赢得了自己在这个群体中的位置。你属于这个群体，你遵守规则，你松了一口气。但是注意，下一波趋势很快就会流行起来，所以请保持警惕。

    - 3. 创造风格（Making style）：这意味着你是先锋——一小部分人站出来与大多数人背道而驰，表达与流行趋势相悖的观点。“创造风格”不一定能成功地变成“流行风格”。当你有勇气挺身而出、接受打击时，这往往意味着你真的很酷。


    那些有权决定风格的人，都是设计圣殿里手握底牌的成员。这是一个有英雄和明确等级制度的舒适之地。这是一个由特权阶级和富人组成的世界，他们能决定什么是值得拥有的，仅仅是因为他们能拥有别人无法得到的东西。这一传统可以追溯到皇室将自己与平民区分开来的方式——拥有别人不能拥有的东西。因此，这家在线零售商“设计触手可及”（Design
    Within Reach）经常被戏称为“设计遥不可及”（Design Without Reach）并非巧合。这是一个由影响者的观点构建的不公平的世界，多亏了设计圣殿的炫耀和排场，它从内部看起来似乎非常重要。当然，出于你能想到的所有原因，我喜欢待在里面，但我也有责任指出它已经与计算时代脱节。


    设计圣殿一直以来都能决定创造风格的走向，因为创造并生产任何东西都是一项资本密集型任务。哪些东西会投入生产，取决于创造风格的阶层掌握的知识和人脉。但是，这种依赖少数特权人士的评价体系受到了理性思考的非设计圣殿信徒的数据收集和非正式网络的冲击。硅谷的资金和影响力，加上如今任何人都可以获得的算力，意味着理性思维可以占上风，优质设计可以以极低的价格开放给所有人使用——只要它是通过电子设备交付的。我们生活在这样一个时代，你永远不必“过时”，你可以一直“流行”，因为你总是可以接触到最新、最好的电子产品设计——如今你可以在帮助设计决策方面发挥关键作用。而且设计圣殿无论说什么或做什么，都无法真正影响当今电子产品的发展，因为实话实说，科技圣殿已经以摩尔速度超过了设计圣殿。


    包豪斯学派教义的发展是为了回应工业革命，回应利用工厂中的机器和流水线制造产品的新能力。大众负担得起的家电终于能被造出来了，但它们往往难以使用，也不适合消费者生活空间的装饰风格。因此，在20世纪初，包豪斯教育项目引进了更好的方法来制造大众可用、喜欢且负担得起的产品——不过其产品并没有立即得到大众的认可。因此，奥地利作家、达达主义者拉乌尔·豪斯曼（Raoul
    Hausmann）说过的一句话与这段快速转型的早期高度相关：


    John Maeda, “Tech x Business x Design,” Design in Tech Report (blog), March 10,
    2019, designintech.report/2019/03/10/%F0%9F%93%B1design-in-tech-report-2019-section-1-tbd-tech-x-business-x-design.


    新一代人类应该有勇气成为创新者。


    随之而来的，是一个世纪后，旧的包豪斯方式必须被抛弃，以引入由计算驱动的新工业革命带来的新方式。新的勇气是要接受人与机器沟通的挑战，比如你正在做的事。把自己当作本世纪新包豪斯学派的一员吧。


    计算产品的微小改进会以每秒、每天或每月的频率不断刷新，其品质的高低更多地取决于它更新的频率，而不是对一款假装永不过时的完美产品的维护。这与设计圣殿的方式背道而驰，后者习惯于花费数十年时间来有意识地打磨将被永远赞誉的“完美”作品。相反，如今我们生活在一个实时的现实世界，这个世界的基础是云提供的计算能力，它给设计圣殿的金色外表投下了一层阴影。我们需要从根本上摒弃设计应该追求完整的传统观念。


    因此，品质的新定义与设计圣殿定义的精心打造的完整成品恰恰相反。根据科技圣殿的定义，品质的新定义是投放一款未完成的产品，通过观察它在市场中如何生存来修改它。这与把赌注全部押在一名经过设计圣殿审查的品牌设计师身上，让产品在盛大的首次亮相仪式中就表现得完美无缺背道而驰。相反，这有关创建一支有才华的极客团队，他们可以充分利用外星来物般的材料，这些材料拥有可以改变商业的新属性。这需要我们的态度发生天翻地覆的改变，转向“精益”（消除冗余，偏爱试验而非完美）和“敏捷”（灵活响应客户不断变化的需求）。或者，用不那么技术宅的话来说，质量是关于自豪地拥抱渐进的、无趣的工作的态度——让自己踏上永无止境的产品创造之旅，哪怕这些产品永远无法进

