    # 更好地了解是为了更好地服务


    “Omotanashi: The Reason Why Japanese Hospitality Is Different,” Michelin Guide,
    April 4, 2017, guide.michelin.com/sg/features/omotenashi/news.


    大学毕业后我在日本生活了几年，当时我总是对火车如何按时间表准时到达和离开感到困惑。当地和跨地区的火车线路都是如此，因此我逐渐认识到这不仅仅发生在东京。相比之下，在西雅图长大的我学会了永远不要相信公共交通的时间表，并且发现在其他地方也该如此——除了日本。我的日本同事的回答一贯是：“因为日本人作为顾客是不会容忍这种做法的。”当时，这种回答让我觉得有点高高在上。我想知道他们是否在说，作为一个美国人，我的期望值较低。撇开不安全感，我理解他们关心客人的态度，因为这是父母的豆腐店灌输给我的。这种关心客人的想法体现在了父亲经常使用的一个词中：Omotanashi（oh-moh-tay-nah-shee）。


    Omotenashi可大致翻译为“好客”，但它含义远不止于让人有宾至如归的感觉。这与如何迎接和送走人们，如何为他们服务，如何预测他们的需求并超越他们的期待有关。在豆腐店，这意味着严格地用双手将袋子递给顾客，在离开时为顾客开门。对父亲来说，这也意味着如果知道顾客要远行，就悄悄地挑选硬度合适的豆腐——这样豆腐就不会碎掉。虽然父亲从不承认，但这也包括顾客和我来自夏威夷、容光焕发的母亲之间的友好玩笑，她的笑声温暖而迷人——我相信这往往是最可能让他们回来的原因。佑美总是让顾客带着笑容离开。


    Yuko Daishoji, “The Three Cups of Tea,” Miyoshi Tea Co., November 19, 2018, miyoshitea.com/new-blog/the-three-cups-of-tea-sankoncha.
    The Editors of Encyclopædia Britannica, “Ishida Mitsunari,” Encyclopædia Britannica,
    January 1, 2019, britannica.com/biography/Ishida-Mitsunari.


    最根本的“好客”是指不用问就能知道顾客想要什么，这样就能预测他们的需求。一个著名的故事最能说明这一点。《三杯茶》讲述了16世纪一位重要的贵族战士打猎归来的故事。任何人都看得出他渴得要命。首先端给他的是一满杯温热的茶，装在一只大杯子里，他很快就喝完了。他还想再喝一杯，于是侍者给他端来了比上一杯更热的茶，但是茶量减半。这一次，他放松多了，花了更多时间'
  - '[PAGE 109]


    品尝茶。当他喝完并要求再来一杯时，侍者用一只有着精美图案的小杯子给他端上了滚烫的茶。由于前两杯已经解渴，这位战士不仅可以充分享受最后一杯热茶，还可以欣赏这只漂亮的茶杯。茶侍石田三成（Mitsunari
    Ishida） 因此被奖励加入武士的氏族，后来成为那个时代最伟大的武士指挥官之一。


    石田对细节的关注的故事是一个比喻。意思是不要只是一味地提供茶，而要根据人们的需要考虑他们可能想要的饮茶体验。换句话说，如果石田事先不知道这位战士非常口渴，他可能就会先用漂亮的杯子端上滚烫的热茶，这会烫伤战士的舌头。这杯茶不仅没有解渴，还浪费了杯之美。或者，直白地说，如果石田没有努力去了解这位贵族战士的狩猎之旅（本质上涉及间谍活动），那么他就不可能如此完美地满足这位战士的需求。当我们了解顾客的时候，我们就有机会以顾客想要的方式为他们服务。但这需要我们多管闲事，有时还要有点运气，以便获得能告诉我们该如何取悦客人的信息。


    你不必去日本才能体验“好客”。当你最喜欢的餐厅记住你的名字时，你便从一位匿名顾客变成了“回家”的家庭成员。类似的事情在网上经常发生，比如你经常访问的网站用你的名字问候你的时候。读到“欢迎回来，约翰！”的信息，一开始会让你感觉很好。但当你第一次访问一个与你毫不相干的网站，看到它热情地用你的名字欢迎你时，你的感觉可能就没那么好了。如果你去一家你从未去过的餐馆，一个从未见过你的服务员直呼你的名字：“约翰！你的新工作进展如何？”你同样也会感到尴尬。目前人性面临的最紧迫的问题，就是避免这种情况——陌生人对你的“了解”到了应该让你感到不舒服的程度。你会在媒体上看到关于我们的隐私和如何自我保护的报道，希望机器停止侵犯我们的隐私是很自然的。但是，要求一台计算设备停止收集信息，并停止与其他设备共享收集到的信息，就和希望你的魔杖中的所有魔法消失一样。


    计算机器，就其本质而言，可以并且将以某种方式被测量，因为这是其模式的内在好处。测量的程度可以是从捕捉你在设备上的每一次点击和按键，到你在地球上每一次移动的三维位置信息。你可能听说过cookie是网络追踪的基本单位。虽然听起来完全无害，但cookie其实是网络的第一宗罪，同时也是互联网广告业务在互联网崛起期间变得如此成功的原因之一。cookie是一小段文本，任何程序员都可以将其“缓存”在你的浏览器中，以便在你再次访问时调用它——这样，浏览器就会记住你访问过的内容和相应时间。这是让网站记住你最后一次访问的位置的实用手段，而且——就像石田的茶侍服务那样——可以努力为你沏出最适合你的第三杯茶。


    顺带一提，这种将cookie作为文本保存在浏览器的cookie罐中的基本技术机制，也允许与你访问的网站无关的服务缓存关于你的信息。这些cookie被称为“第三方cookie”，我建议你在阅读完本文后在浏览器设置中禁用它们。这样做可以让'
  - '[PAGE 110]


    你对自己的身份有更大的掌控权，选择你允许谁知道关于你的事情——否则，你会更容易遇到在你踏进门之前就知道你的一切的餐厅。你也可以关闭浏览器上的所有cookie，包括第一方cookie，但这样做会让浏览网络变得麻烦。cookie带来了便利，它意味着你不必记住已登录服务的密码——cookie被放置在你的计算机中，将你的计算机标记为完全授权的“已登录”，这样你就不必在一堆便笺中找密码了。别担心，cookie本身并无害处。


    在可预见的未来，你将不断地用你泄露给他人的数字信息来交换计算便利性。你放弃的隐私越多，你得到的便利就越多。换句话说，当你分享关于自己的信息时，计算机能保证你因得到你想要的东西而快乐，而不是因不适合你的服务而烦恼。例如，每家连锁酒店都知道我不喜欢住在电梯旁边的房间。同样地，每家航空公司都知道我喜欢过道的座位。我介意他们知道这些情况吗？一点也不，因为这意味着我的愿望更有可能得到满足。我介意的是关于我的信息在未经我允许的情况下被泄露。但是，如今你很难知道你的信息是否被泄露，因为你往往在开始使用服务之前，在冗长的文字墙弹出来要求你接受服务条款时，就允许了某家公司获取你的信息。你到底同意了什么？


    “House Votes to Allow Internet Service Providers to Sell, Share Your Personal
    Information,” Consumer Reports, May 4, 2018, consumerreports.org/consumerist/house-votes-to-allow-internet-service-providers-to-sell-share-your-personal-information.
    “Patterns,” Privacy Patterns, privacypatterns.org/patterns; “An Evolving Collection
    of Design Patterns for Sharing Data,” Data Permissions Catalogue, catalogue.projectsbyif.com;
    Holly Habstritt Gaal, “Ethical, by Design: How We Design with Your Privacy in
    Mind,” DuckDuckGo (blog), January 22, 2019, spreadprivacy.com/ethical-by-design.
    “ACLU Links Pizza Delivery to Privacy Erosion in New Online Video,” ACLU, July
    26, 2004, aclu.org/news/aclu-links-pizza-delivery-privacy-erosion-new-online-video;
    ACLU, “Scary Pizza,” YouTube, youtube.com/watch?v=33CIVjvYyEk.


    有些时候，你会明确选择被监控和遥测，比如当一个网站要求你向它透露位置时。如果每一层技术都这样做，那么你最终可能无法像你认知中的那样使用互联网，因为你会交出很多权限。对计算宇宙的复杂本质的新认识应该让你意识到，互联网服务提供商很可能正在储存和出售关于你的信息——在美国，这种做法目前是完全合法的。你的电话网络运营商、云计算公司、你最喜欢的应用程序，甚至你使用的物理设备也在这样做——它们都可能独立地全天候遥测和收集关于'
  - '[PAGE 111]


    你的信息。了解你的数据是如何被共享的——无论你有没有同意——是一个新兴的设计维度。从计算产品的角度来看，我对它非常感兴趣。这是一个足以为此写很多本书的话题，但我只想让你意识到这真的很重要。
    如果你还没有完全相信我，你可以看看美国公民自由联盟在2004年发表的科普文章《可怕的比萨》（“Scary Pizza”），其中描述了这样一个未来：一个人打电话到当地比萨店订购比萨，这一信息与他的健康记录、从业经历以及其他信息交织在一起。比萨店最终对他下单的额外奶酪收取了额外费用，因为他应该在节食期，而这个人自然也对比萨店对他的了解程度感到震惊。


    当与亚马逊分享过一次信用卡信息后，你就不必在每次购物时都重新输入。这听起来很棒，感觉就像魔法。当Gmail处理完你所有的电子邮件并知道你可能如何回复一封邮件后，它就会自动建议回复内容。这听起来也很神奇。通过让云计算公司访问我们的所有信息，我们能让它们为我们做奇妙的事情，沏出温度和口感完美的茶。唯一的问题是，假如黑客闯入亚马逊并窃取了你的信用卡信息，或者设法进入谷歌访问了你的所有电子邮件，这可怎么办呢？这是什么感觉？很可怕，对吧？这种风险值得吗？当然值得。减轻公认风险的方法是理解并尊重计算系统的工作原理和出现问题时可能发生的情况。希望计算时代带来的所有神奇便利都消失，意味着我不能在任何时候候轻松地给母亲发爱心表情符号或者在异地工作时观看孩子的舞蹈表演。每当技术节省我的时间或做得比我一个人做得更好的时候，我都感到感激和满足，同时仍然谨慎地思考我得到了什么，以及云从我这里拿走了什么。


    “饼干”的英文是cookie，cookie亦指浏览网站时由网络服务器创建并由网页浏览器存放在用户计算机或其他设备的小文本文件。 “Guest Story:
    Expressed and Unexpressed Need,” The RitzCarlton Leadership Center, June 24, 2015,
    ritzcarltonleadershipcenter.com/2015/06/expressed-and-unexpressed-needs.


