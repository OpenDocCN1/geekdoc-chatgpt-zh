    我们最大的机会——也是最大的问题——与正在收集和收集自我们共同的过去的数据有关。想象科技行业的云系统飘浮在所有人的头顶上，这是无穷多永远干燥的海绵，吸收关于我们在做什么、在哪里、在想什么的一切信息。一方面，如果你无法理解它的能力，它就会显得不祥、黑暗和可怕，而这正是大多数人开始感觉到的。另一方面，我们可以感到庆幸的是，长期以来数据和伦理专家一直在思考许多相关问题，以便我们可以开始区分数据收集的道德和不道德来源。计算世界长期以来都是不可见的，但现在它变得可见了，为了取得我们完全的信任，它需要更加透明和易于理解。我们不再接受不透明的黑匣子，否则当它们行为不端时我们既不能查看内部也不能拷问它们。


