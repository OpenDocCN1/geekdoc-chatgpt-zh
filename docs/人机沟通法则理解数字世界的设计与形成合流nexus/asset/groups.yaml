    随着像脸书这样的系统开始具有改变个人行为的能力，我们正在接近我们该如何

    与计算系统共存的关键时刻。②如果我们把自己暴露在被设定为性别歧视、厌恶

    女性、厌恶同性恋、种族主义等的技术面前，我们不应该在看到像《华尔街日

    报》（The Wall Street Journal）的“蓝信息流，红信息流”这样的东西时感到

