    # 开源是通过计算设计公平的一种手段


    凯特·霍姆斯经常指出“排斥”（exclude）这个词的起源：它源自拉丁语excludere，其中ex意为“出去”，claudere意为“关闭”。在人类世界里，这意味着将一群人拒之门外，可除了这群人之外的所有人都可以进入这个特殊的俱乐部。我们很难用更积极的方式来解读排斥，因为它的本质是不公平的——如果你曾经感到被排斥或被“拒之门外”，你就会理解这一点。但从商业的角度来看，排斥是完全可以理解的，因为在竞争激烈的时候，拥有“不公平的优势”被认为是制胜武器。拥有竞争对手没有的东西，会激励你把他们拒之门外，并采取计算世界中所谓的“封闭”方法。


    Tripp Mickle, “Apple TV on a Samsung? iPhone Giant Makes Risky Jump to Other Devices
    to Sell Services,” The Wall Street Journal, March 26, 2019, wsj.com/articles/apple-tv-on-a-samsung-iphone-giant-makes-risky-jump-to-other-devices-to-sell-services-11553629788.


    制造封闭系统在工业中是一种常见做法，因为一旦成功，它就能提供可以实现完全控制的宝贵能力。在1984年推出第一台Macintosh计算机时，苹果公司采用了著名的封闭式计算系统，它不像当时的竞争对手Wintel
    PC那样易于扩展。因此，苹果能够以其他计算机品牌无法做到的方式无死角地控制用户体验。这种封闭系统的策略后来在苹果推出iPhone时再次发挥作用，剩下的事情尽人皆知。与此同时，一个名为安卓（Android）的新兴移动操作系统项目选择了一条不寻常的道路，将它所有的计算机代码（“源代码”）公开。如今，搭载安卓系统的设备比搭载苹果操作系统的设备多。到2019年，苹果公司做法的效力开始减弱，该公司正被迫参与自己的封闭世界之外的世界。它不公平的优势正在消失吗？


    “开源”（Open Source）是任何人都可以出于自己的目的进行修改的开放计算机代码的官方术语。它与“拒之门外”相对立——相反，它接纳任何人和所有人。著名的开源项目包括Linux操作系统（安卓系统就是在此基础上建立的）、火狐浏览器（一款流行的网络浏览器）、WordPress（全世界超过三分之一的网络流量的网站管理系统）和PHP（支持WordPress的流行计算机语言）。


    Christine Peterson, “How I Coined the Term ‘Open Source,’ ” Opensource.com, February
    1, 2018,'
  - '[PAGE 143]


    “开源软件”这个词由克里斯汀·彼得森（Christine Peterson）在1998年创造，她的目的是更好地体现其内在的社群价值观，与当时意味着较低质量的流行术语“免费软件”相对。通过我在Automattic的工作，我有机会直接接触WordPress社群，我在一生中从来没有遇到过如此热情、包容、来自世界各地的一群人。随着时间的推移，我逐渐意识到PHP在WordPress社群中代表着“人与人之间互相帮助”（People
    Helping People），因为每个本地社群都欢迎任何想学习计算的人，而作为贡献者参与其中不需要任何附加条件或费用。在开源中，软件不仅仅是代码，还是社群。


    相比之下，“闭源软件”是大多数你每天都用的应用程序和服务。你永远无法检查编程代码到底在做什么，就算你想让它以不同的方式工作，你也不可能对软件本身进行修改。这包括脸书的应用程序，以及你的手机、台式电脑和网络上运行的大多数东西。不过，即使你可以访问所有应用程序的源代码，这也不代表你能即刻理解其中的内容。对像WordPress这样复杂的开源系统来说也是如此。但是，事实是脸书的应用程序让你失去了窥探内幕的机会，而如果你想更改程序的任何方面，WordPress在源代码级别上是完全包容的。


    > Olga Kozar, “Towards Better Group Work: Seeing the Difference Between Cooperation
    and Collaboration,” English Teaching Forum 48, no. 2 (2010): 16–23, americanenglish.state.gov/files/ae/resource_files/48_2-etf-towards-better-group-work-seeing-the-difference-between-cooperation-and-collaboration.pdf.


    思考闭源和开源之间的区别的另一种方法，是考虑“合作”和“协作”之间的差异。合作是指与另一方保持一定距离，而协作是指手挽手拥抱彼此。协作相比合作的优势在于，各方都做出了不同程度的妥协，共同努力，互利共赢。在缺乏协作能力的情况下，今天的政府控制科技圣殿的唯一方法就是试图对其进行监管。有趣的是，如果科技圣殿的所有软件都是完全开源的，那么政府就没有必要采取目前的行动来对付它们。为什么？因为这样我们可以检查源代码是否违反了今天我们所有人都关心的议题，比如了解他们正在用他们收集的关于我们的数据做什么。当没有不透明的墙把其他人拒之门外时，作恶就更不容易了。开放系统方案是政府监管的另一种选择，因此我希望当像你这样能与机器沟通的政治家当选时，我们会更经常地看到这种方案。也许是时候让你去参加竞选了？我在此为你公开一个“开放”的竞选口号：“开放促进公平，自然而然。”'
  - '[PAGE 144]


    开源有一个缺点：在任何地方都无法保存秘密。在一个人人都寻求协作和不作恶的世界里，完全透明可能意味着“分享就是爱”和持久的和谐。然而，总有一些坏人想方设法地操纵局势，使之对自己有利，个中原因只能解释为人性。因此，开源也并不总是正确的选择。例如，你永远不会发布可以轻松访问自己所有财务信息的个人电子银行系统的源代码。如果分享行为能让其他人为自己开发类似的系统，那么开放源代码的做法可能值得称赞，但可以肯定的是，如果你的源代码里包含敏感信息（比如银行账号和密码），那么你所有的钱很快就会消失。或者，如果脸书的算法都是开源的，那么不怀好意的一方就可以重写时间线代码，轻松操纵你的时间线。当然，总有一些竞争优势可以证明为什么一个企业想要保持其代码的私密性：保持他们相对竞争对手的不公平优势。


    +   “Microsoft to Acquire Github for $7.5 Billion,” Microsoft, June 4, 2018, news.microsoft.com/2018/06/04/microsoft-to-acquire-github-for-7-5-billion.

    +   Tom Warren, “Microsoft Is Building Its Own Chrome Browser to Replace Edge,”
    The Verge, December 4, 2018,

    +   theverge.com/2018/12/4/18125238/microsoft-chrome-browser-windows-10-edge-chromium.

    +   Clint Ecker, “Apple Opens WebKit CVS Repository,” Ars Technica, June 7, 2005,
    arstechnica.com/gadgets/2005/06/470.


    尽管如此，企业正在意识到开源的价值。微软收购了世界上最大的开源软件开发社区GitHub，此举震惊了全世界。要理解这一收购的规模，你只需要向你的程序员朋友打听一下——有些人甚至可能不知道微软收购了GitHub，因为微软选择不改变也不重塑它目前的运作方式。除了安卓系统，谷歌的另一个开源例子是Chrome网络浏览器，它在一个开源引擎上运行。现在，任何人都可以在其基础上制作网络浏览器——甚至微软也宣布将改用Chrome的引擎。与此相关的是，苹果的网络浏览器Safari是一个开放/封闭混合系统：它与谷歌的开源引擎有相同的血统，但代码的其余部分不对公众开放。在你的产品中使用开源内容时，一定要检查授权条款——有些条款允许你不受任何限制地使用代码，而另一些则要求你在使用他们的代码时公开分享你写的那一部分代码。前者通常被称为“麻省理工学院授权条款”，它能给你很大的自由；后者是“GNU通用公众授权条款”，它能给予他人很多自由。


    +   Sandra Wachter, Brent Mittelstadt, and Chris Russell,

    +   “Counterfactual Explanations Without Opening the Black Box:

    +   Automated Decisions and the GDPR,” Harvard Journal of Law &'
