    你应该已经能够感觉到，与上一个10年相比，你身边的计算体验有所不同。这就是天然酵母计算和工业酵母计算之间的区别，但你可能没有注意到从闻起来计算机感很重的人工智能到完全没有计算机气味的人工智能的巨大飞跃。数以百万计在云端某处运行的不可见的计算循环——尽管在无限的尺度和无尽的细节层面上运行，却'
  - '[PAGE 81]


    从未减速或感到疲倦——的强度和能力一直在不断增强。科技行业和投资界都在努力推动这些强大无比的系统的发展，这些系统不像制造它们的冷冰冰的计算材料，它们利用了艺术家的观察和自己对人类及其环境的深刻理解。因此，我们可能会遇到更多的人类替代品
    ®，它们会眨眼、微笑、跳舞，用几个“嗯”来表达不确定，甚至用调情来吸引你的注意。它们会非常讨人喜欢，因为它们永远不会放弃提高自己，而且每时每刻都能从你身上获得越来越多的知识。


    我们知道计算机擅长模仿我们的行为，擅长相互协作，也擅长处理大规模的任务和精确的细节。如果你是老板，你的第一反应想必是：你被录用了！紧随其后的反应是：你最终会替代我的工作吗？应对这种担忧的方法，是记住一个好老板的目标是成为一个可被替代的人，这样你的团队就会比你成长得更快。所以，从某种意义上说，作为一个好老板，对这些担忧的回答应该是肯定的。其次，记住如果你不断提升自己的能力，那么你就永远不可能被完全取代——我们的目标在不断变动，这就是我们难以被复制的原因。所以，尽你所能去变得大胆，就像和你一起工作的年轻一代，不要害怕，和他们一样大胆地跳进未知的世界。然后，当你认识到摆在你面前的挑战有多么艰巨时，拿出你的勇气和经验，正如我已故的导师威廉·J.米切尔（William
    J. Mitchell）经常说的：“全力以赴完成它！”勇士不能杞人忧天。直面挑战，而不是逃避它。


    我非常幸运能够深入接触人工智能这个领域，这几乎贯穿了我的一生。在有机会思考我将在接下来的三章里与大家分享的一系列想法后，我感受到了内心的觉醒。今天，我觉得有必要重新思考计算在新产品和新服务的设计中的意义，因为我们正处于一个转折点，这将不可逆转地影响人类未来。对很多不懂如何与机器沟通的人来说，我们正在以一种完全不公平的方式接近奇点。以目前的发展速度，加上少数掌握计算机技术的人将主宰不掌握计算机技术的人的看法，我们将会把一小群精通计算机技术的创造者的偏见嵌入永恒的云端。


    我感觉此时此刻，是候然之间整个池塘被睡莲叶完全覆盖之前的最后一次机会。因此，让我们转向使用计算机制造的能循环、变得更大、变得更像人的产品的影响。谷歌、苹果、脸书、亚马逊、微软、阿里巴巴等公司早已进入这个领域，拥有巨大的先发优势。你正在勇敢地挑战——而不仅仅是有胆量。现在，让我们来了解计算产品与其他产品的本质区别，这些产品迫切需要你的新视角。我们需要让你用天然酵母和工业酵母烘焙自己的招牌面包，以创造未来需要的具有代表性和多样性的充分思考。奇点尚未到来，让我们开始烘焙吧！'
