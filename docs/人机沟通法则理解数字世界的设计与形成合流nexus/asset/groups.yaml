    # 循环中包含的循环打开新维度


    回想一下在读小学时，你第一次学习如何在纸上画一个三维立方体。你首先画两个部分重叠的正方形，然后把两个正方形对应的四角连起来。纸的表面虽然是平的，但是你的大脑看到了立方体的线条，情不自禁地想象纸面上出现了更多的空间。乍一看，这似乎是不可能的，因为没有任何可供增加空间的新点位，你看到的只是视错觉。不过，你可以这样思考：从技术层面上来说，绘制的立方体为你提供了更多的空间——因为你现在可以在这个立方体中放置点，然后进入一个全新的维度。要想理解这一点，你首先需要激活你的想象力：想在绘制立方体之前，你在这张纸上找不到任何大小的三维空间，但取决于你的绘制方法，你可以让这个立方体比纸面更大。


    让我们用不同的方法将这个过程重复一遍，数学家们把它作为开启第四维度的大门。首先画一个点，这表示零维。


    ![](img/a980a6de0555167c9f36435ce714d7b4_38_0.png)


    然后将这一点在空间中展开，将两点相连，你会得到一条线，这表示一维。


    ![](img/a980a6de0555167c9f36435ce714d7b4_38_1.png)


    然后将这条线在空间中展开，将四个顶点相连，你会得到一个平面，这表示二维。'
