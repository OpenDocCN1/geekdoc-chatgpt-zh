    在麻省理工学院时，我宣称自己是“人文主义技术专家”，但并不知道它的真正含义，这主要是因为我认为技术专家的默认座右铭是技术越多越好。技术专家创造进步，进步是关于正在发生的事情。我们不想要一个根本没有任何事情发生的世界。但随着时间的推移，我发现了这两个术语之间的区别：


    +   技术专家 = 我做，是因为我可以做这件事。


    +   人文主义者 = 我做，是因为我关心这件事。


