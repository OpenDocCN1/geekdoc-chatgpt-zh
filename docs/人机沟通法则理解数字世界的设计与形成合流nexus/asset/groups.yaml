    # 大数据的结论需要与真实人群密切相连的厚数据


    鉴于我们可以很容易地部署不完整、可测量的计算产品，我们有机会获得大量数据以确定如何修改和改进这些产品。成功通常意味着收集大量的用户数据，这是提高由数据驱动的结论的统计准确性的最佳方式。因此，对于计算产品，我们很容易偏向于笼统地观察数以千计用户的行为，而非有意识地花时间去深入研究少数用户的使用体验。为什么呢？简单来说，考虑到我们今天拥有的计算能力，采取可测量的方法来研究聚合行为要容易得多（因此成本更低）。当你能说出“7.2%比1.2%”这样听起来很科学并且令人信服的事实时，你看起来也聪明绝顶。相比之下，通过人类学家开发的方法研究个体行为的技术含量要低得多（因此成本更高）——本质上这就是人种学。在和名叫詹姆斯的非技术客户（他在使用产品的过程中遇到了一些挑战）相处一段时间后能对他遇到的问题有更深入的了解，是具有客户同理心的积极信号。


    问题是：与詹姆士遇到的挑战和他正在面对的障碍相比，以数字数据的形式给出的“科学”回应通常会得到大多数人的认可。因为一个定量的观点看起来就像事实——一个从噪声中提取出来的重要信号，而一个定性的观点看起来就吵闹的客户，他怎么也“听不懂”并且可以被忽略，因为他不在7.2%的范围内。实际上，无论是聚合数据还是个体故事都不构成事实，因为这两种情况都涉及了人。人在本质上是不可预测的，所以任何涉及人类行为预测的事情终究也只是一种猜测。一种猜测是通过定量数据，另一种则是通过定性数据。我们花大价钱购买高质量的猜测，将它们当作降低决策风险的一种手段，但没有任何猜测能100%保证是正确的。这就是为什么它是猜测，而不是事实。任何投资者都非常清楚：要想猜得更好，最好的办法是创建一个投资组合，这样赌场里所有的筹码就不会只押在一个猜测上。


    在计算时代，收集定量数据已经变得如此轻松，以至今天的挑战之一是让技术人员离开配有巨大显示器和大量零食的站立式办公桌，进行一次老式的、面对面的客户访谈。这之所以相当困难，是因为轻松获取定量数据是计算时代的主要好处和实际结果，所以对每天生活在未来的人来说，这可能像在往相反的方向走。此外，如果每月只需花费5美元就可以收集和分析数百万使用你的产品的在线客户的数据，那么每月花费数百美元与客户进行一对一的沟通似乎没有必要地昂贵且低效。借用另一个金融业的比喻，最好的投资者不仅会仔细分析他们参投的基金，还会去基金经理那儿进行实地考察，这是他们作为投资专家的额外尽职调查。因'
