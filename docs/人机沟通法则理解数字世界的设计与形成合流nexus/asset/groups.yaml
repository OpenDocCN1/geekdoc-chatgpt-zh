    号计算方法在让计算机变得更加智能方面遇到了瓶颈；此外还有谷歌、苹果、脸书和亚马逊收集的所有关于我们的数据。当谈论这个巨大的变化时，我们倾向于不用“人工智能”这个词，因为它带有一些过去的负面含义。我们更喜欢用两个术语来描述这种新型人工智能：“机器学习”（Machine
    Learning）和“深度学习”（Deep Learning）。


    具体来说，深度学习是一种应用于机器学习的技术。创造人工智能的传统方法是教会计算机如何通过if-then规则进行推理。然而，深度学习使用了脑模型——尤其是脑神经网络——来教计算机如何通过观察期望的行为来思考，并通过分析重复的行为模式来学习技能。为了让这个模型顺利工作，计算机需要观察我们的行为，最好是持续地、永不停歇地观察。深度学习曾经在技术上不可行，因为当时缺乏大量训练数据和让计算机成为一个合格的学徒所需的强大处理能力。不出所料，摩尔定律奇迹般地为我们带来了几乎可以计算一切的强大算力。我们不再需要事无巨细地教计算机，因为它可以利用手头的任何数据轻松自学，而且当需要更多数据时，它可以自行从云端获取更多数据，变得更加智能。


    让我们先暂停一下——这个想法很微妙，很难完全理解。这很像我们去传统的法国面包店买面包的时候，他们会提供两种看起来一样的面包。一种是天然酵母面包（pain au
    levain），另一种是工业酵母面包（pain à la levure）。对像我这样的普通美国人而言，这毫无意义，因为它们都有同样的撒有面粉的浅棕色脆皮，这也是法棍的特点之一。但对法国人而言，这两种面包完全不同，因为它们的制作方法不同，它们的味道也有细微的差别。天然酵母面包是用天然酵母制作的，而工业酵母面包是用工业酵母制作的。记住它们之间的区别的一个简单的助记符是“天然酵母”的法语（levain）以n结尾，而“天然”的英语（natural）以n开始。


    我认为手工制造计算机器和老式人工智能的传统技艺就类似天然酵母——向手工构建代码致敬。但是，由神经网络驱动的人工智能新方法是以一种新的、合成的方式制造出来的，类似工业酵母。两种类型的面包就像两种类型的计算，都满足了制造它们的基本需求——但在各自成分上有根本的不同。如何区分天然酵母面包和工业酵母面包？你无法通过观察两条面包的表面来区分——但可以用鼻子嗅出它们之间的差别：天然酵母有一股酸味，而工业酵母没有。同样地，由于神经网络在进行以前难以想象的行为时不会发出任何“气味”，我们需要特别关注这种差异。


    Istvan S.N. Berkeley, “A Revisionist History of Connectionism,” 1997, userweb.ucs.louisiana.edu/~isb9112/dept/phil341/histconn.html.'
