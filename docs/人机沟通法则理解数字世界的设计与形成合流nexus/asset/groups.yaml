    计算机可以如此轻易地愚弄人类同胞，这让年轻的魏森鲍姆博士深感困扰。今天，我们觉得任何一位野心勃勃的技术专家都会毫不犹豫地将他们的发明迅速推向市场，但魏森鲍姆不是普通的技术专家。他在小时候逃离了纳粹德国，设法躲过了大屠杀。他的世界观建立在对滥用权力的危害的理解的基础之上。因此，在发明Eliza之后，魏森鲍姆一直在公开谈论计算可能对社会造成的危害，而不是从他的突破性发明中获利或发展自身的事业。Ⓚ他有先见之明地料到，总有一天，计算机不仅能熟练地模仿人类的言谈举止，还能通过了解与之交谈的人的一切成功地在交谈中冒充一个真正的人。


    F.Rosenblatt, “The Perceptron: A Probabilistic Model for Information Storage and
