  - '[PAGE 23]


    # 递归是最优雅的自我重复方式


    1984年，我作为一名本科生来到麻省理工学院，当时计算机科学作为一个刚刚起步的领域，采用了由哈尔·阿贝尔森（Hal Abelson）、杰拉尔德·苏斯曼（Gerald
    Sussman）和朱莉·苏斯曼（Julie Sussman）合著的新教科书。他们将计算机编程的理念从传统手艺中提炼出来，将其推向了批判性思维和科学的领域。在这方面，他们并非孤军奋战——这是一场席卷全球的运动，但主要扎根于大学。因为坦率地说，当时除了大学，没有人拥有（或想要）计算机。当时还没有谷歌（Google）、雅虎（Yahoo）、亚马逊（Amazon）、脸书……别忘了，在那个年代，人们会嘲笑你（我）拥有一台带有彩虹水果标志的奇怪装置。


    阿贝尔森和苏斯曼的计算机科学入门课程名为“计算机程序的构造和解释”（Structure and Interpretation of Computer Programs）。我们是第一批使用他们撰写的同名新版教材的学生，每周学习的内容都远远超出我的理解范围。他们的目标是让我们用不同的方式思考。课程的第一周，我们被告知不要再用GOTO
    10或FOR...NEXT循环来思考这个世界。他们向我们介绍了一个名叫“递归”（recursion）的新概念——这是你在日常生活中不会遇到的概念之一，因为它与我们的物质世界通常的运作方式不同。它不仅仅是有点奇怪——它奇怪极了。请允许我更具体地解释这一点。


    小时候我非常迷信，相信魔法。我觉得今天的我依然如此。这一切都源于我发现自己有超人的能力，能透过手看东西。你也可以试试：睁开双眼，把一只手放在一只眼前方大约一英尺（一英尺等于30.48厘米）远的地方。如果你像我这么做，你就能透过那只手看到它背后的一切。这是我从未想过告诉任何人的事情，因为我觉得拥有这种特殊能力有点恐怖。


    所以，当我发现青少年漫画《阿奇》（Archie，我知道，那个时候的我有点早熟）里有个关于手工制作莫比乌斯环的介绍并实际制作了一个莫比乌斯环时，我觉得我的魔力才真正显现出来。莫比乌斯环是一个用纸折叠而成的简单物体，但当你开始摆弄它时，它会显现令人惊讶的特性。


    取两条纸带，将它们做成两个纸环：将其中一条首尾相连，将另一条纸带的一端扭转180度，再将其首尾相连。第一个是普通的纸环，第二个则是莫比乌斯环。'
  - '[PAGE 24]


    ![](img/a980a6de0555167c9f36435ce714d7b4_24_0.png)


    现在拿一把剪刀，沿中线剪这个普通的纸环，会发生什么呢？你会得到……两个纸环。这很合理，因为你把纸环沿中线剪成了两半。但是当你沿中线剪开莫比乌斯环时，会发生什么呢？你得到的不是两个纸环，而是一个。


    ![](img/a980a6de0555167c9f36435ce714d7b4_24_1.png)


    可想而知，作为一个相信魔法的孩子，我完全崩溃了。那种感觉就像偶然发现了某种黑魔法，我想知道我是否释放了我在发现自己可以透过手看东西时发现的那股可怕力量。你可以更进一步，像约翰·巴斯（John
    Barth）写《框架故事》（Frame'
  - '[PAGE 25]


    Tale）那样：在一张纸的一面写上“从前”（ONCE UPON A TIME），在另一面写上“有一个故事开始了”（THERE WAS A STORY THAT
    BEGAN），然后把这两句话首尾相连。像追溯莫比乌斯环的曲线那样阅读这个故事，你会发现这个故事永远不会结束。这正是递归带给理解它的人的感觉——一个看似简单，但带有实际转折的循环。正是这个转折，使它进入了一个不同的世界。


    在计算机程序中编写递归，就和定义一个与概念本身直接相关的概念一样简单。当你第一次学习如何画一棵树时，你会发现这一点反映在自然界中。树从一条垂直线开始，有几条垂直线从其顶部伸出来。要进一步绘制这棵树，你需要在顶部的每条线的顶部再添加更多的线，以此类推。最后，你只需使用一开始使用的方法，就可以画出具有许多子分支的树。换句话说，树枝是由树枝组成的，部分是由部分本身定义的。从侧立方向看一棵树的根部，你也可以发现相同的规律——大自然正用递归平静而准确地描绘一切。'
