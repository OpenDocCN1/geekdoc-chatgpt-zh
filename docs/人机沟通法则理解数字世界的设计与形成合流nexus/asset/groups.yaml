    Person’s Opinion，以下简称HiPPO）。换言之，要让经严格管理的对客户进行的数据实验来指导你得到结果，而不是让老板的意见推翻你深思熟虑的工作。请记住，一个成功的变量实验基于从一开始就选择正确的起点——这通常是HiPPO的选择。同时也要记住，挖掘你的团队的创造力将有助于你的实验拥有足够多的差异变体。因此，最大化你身边的观点的多样性以尽可能多地获得不同的解决方案是非常重要的，你可以通过确保身边有一个具有包容性的多元化团队来轻松实现这一点；否则，你的实验质量将受影响。


    当你比较接近成功时，在基本的核心理念上测试变量会有最好的效果。这就像玩“冷与热”的寻宝游戏。当你听到“热”时——这意味着目标就在附近，最好的策略是用小碎步踮手踮脚地靠近奖品。相比之下，因为你已经接近奖品了，突然随机跳跃、跳到目前范围之外是没有意义的。也就是说，除非有一个没有人发现的更大、更好的奖赏在等着你大胆地跳出那一步：与你一心想要找到的“局部最优解”相比众所周知的“全局最优解”。因此，如果你发现自己在错误的海洋里钓鱼，需要下更大的赌注，但高层似乎没有人在听，那么就尽一切努力推翻HiPPO吧。当你无法摆脱这种情况时，硅谷的原则是离开公司，自己创业。


