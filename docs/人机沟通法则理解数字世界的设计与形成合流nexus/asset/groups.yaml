    的”新闻——我们通过确认我们眼中的真相得到愉悦的刺激，这样可以证明自己

    有多聪明：我有《每日一我》，你有《每日一你》。然后，当我们偶尔遇到“反

    对的观点”时，我们别无他法，只能假设对方的观点与自己的观点相比是无知

    的。与此同时，机器持续向我们提供这些信息，因为是我们给它们设定了这样做

    的程序。它们在观察我们对收到的信息的积极或消极反应，并反过来学习人类个

    体善与恶的极限。


    但是，制造对人类经验有更广泛理解的计算机器还不算太晚。我们可以通过更好

    地了解我们自己来轻松开始这个过程——就在我深入挖掘“包容性设计”的世界

    时，这段旅程正在我的脚下展开。这种利用多样性的方法是制造更好产品的关

    键。我很尴尬地承认一开始我并不完全理解为什么这个领域让我如此感兴趣，但

    后来我意识到这是因为我嗅到了一丝信号。计算设计的兴起及其带来的不可思议'
