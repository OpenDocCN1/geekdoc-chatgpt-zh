    对那些远离计算世界的人来说，这个奇点就像科幻小说。但对人工智能先驱 �___比如已故的麻省理工学院教授马文·明斯基（Marvin Minsky），他更喜欢科幻小说而不是一般的文学，因为科幻小说有想象伟大理念的野心——来说，奇点只是另一个注定要实现的伟大理念。
