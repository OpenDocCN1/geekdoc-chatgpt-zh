    要将这种超越我们对周围和内心空间的有限视角的强烈感受转化出来来，最好的方法之一就是看看已故设计师雷·埃姆斯（Ray Eames）和查尔斯·埃姆斯（Charles
    Eames）的短片《十的次方》（Powers of Ten）。埃姆斯二人组以昂贵的椅子而闻名，你可以在许多豪宅中找到这种椅子。不过，是他们更不为人所知的电影作品让我们更清楚地看到了他们充满活力的头脑中实际上在发生什么。在深入研究计算媒介时，我们会产生一种不安但强大的全知感，我发现观看这部影片（你可以免费在网上观看）是理解这种力量的最快方法。


    这部9分钟的影片以距离地面1米的俯视特写镜头开始，镜头对准了一对在芝加哥公园的一张野餐毯子上打盹的夫妇。接着镜头升高到距离地面10米的位置（10的1次方），这对夫妇看起来更小了。然后镜头升高到100米高的位置，此时可以俯瞰整个公园。镜头到1,000万米高时我们可以看到整个地球，到100亿米高时我们可以看到金星的轨道。接下来我们可以看到太阳系的全貌，直到距离我们1万光年的地方。然后，我们把镜头拉回刚才距离那对夫妇只有1米远的位置，将距离缩小到10厘米，此时我们可以近距离观察那名男子的皮肤，然后缩小到1毫米，此时我们开始进入他皮肤上的毛孔，然后一直缩小到0.0001埃（1埃等于100亿分之一米）。虽然移动影像更有说服力，但你也可以通过这段描述想象它是如何恰如其分地展示了宇宙的宏大尺度和原子的微小尺度的。


