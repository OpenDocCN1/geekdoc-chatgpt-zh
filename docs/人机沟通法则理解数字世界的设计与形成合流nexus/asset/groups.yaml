    如果说前者是数据科学，那么后者就是数据人文主义。科学试图回答这个问题，而人文主义让你好奇为什么它与人有关。科学让你进行定量研究，显示穷人倾向于给他们的孩子吃垃圾食品。人文主义让你倾听弱势父母的解释：垃圾食品是为数不多他们能够负担得起的向孩子表达爱的东西。我在贫困家庭长大，体重超标，后来在世界上最好的教育机构接受了定量思维的教育。这提醒我，我所有的聪明才智加在一起都不如认真倾听别人的意见来得有价值。


