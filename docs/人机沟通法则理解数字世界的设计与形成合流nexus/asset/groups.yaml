    的位置信息或者你在网上分享信息时标记的位置信息，我们就可以实现这些数据的去匿名化。①我们也仍处于努力探索长期被忽视的摩尔速度下发生的一切的初始阶段。假如我们在20世纪90年代末就以当时在麻省理工学院媒体实验室的我们可以明显认出的方式注意到类似“永不满足”以超过光的速度疾驰的事情，那么今天的世界可能会与以往大不相同。可实际上，全世界才刚刚意识到一个被科技公司完全掌控的无形计算世界的存在。尽管如此，我们还是应该相信那些发明技术的极客——他们这样做并非出于恶意，而是主要出于好奇心。我们绝对应该惩罚行为不端者，因为肯定有相当一部分极客的行为令人难以接受。技术人员逐渐开始意识到——当他们精心地编写一行行代码时，他们开始好奇当不完整的计算系统在不久的将来学会“自动补全”时会发生什么。即使是最聪明的自动化专家也不能避免自己被巧妙地自动化。幸运的是，这已经开始让他们所有人都有点紧张并愿意重新思考他们在这个世界上做过的事情。


    > Nicky Case, “How to Become a Centaur,” Journal of Design and Science, February
    6, 2018 (updated), jods.mitpress.mit.edu/pub/issue3-case.


    以下是软件产品行业发展的五个阶段，在最后一个阶段，人工智能将解决一切，因为它将无所不知。我们已经度过了前三个阶段，目前正处于第四个阶段，在这个阶段，人类智能和计算智能融合在一起成为某种混合体——因此尼基·凯斯（Nicky
    Case）称这个阶段为“半人马时代”——象征着人类智能与马的超强体力的融合。②今天我们知道在让计算机变得更聪明的同时，计算机也在增强我们的智慧，所以我们没有打败它们，而是选择了加入。


    - 第一阶段：塑封包装的盒子，通过盒子发布软件产品，并以同样的方式推送软件更新。

    - 第二阶段：塑封包装+下载，用户可以选择在线下载盒子里的软件，并且软件更新的推送也在线上进行。

    - 第三阶段：软件即服务（SaaS），我们将软件作为一种服务迁移到云端，人类团队不断更新它。

    - 第四阶段：（我们在这里）：半人马的SaaS，我们在云端运行软件，人类团队与轻度人工智能合作，不断改进它。

    - 第五阶段：一个新的开始，我们将使用比以往任何时候发展得都快的软件，因为它由无所不知的重度人工智能驱动。


    Jarno Koponen, “Get Ready for a New Era of Personalized Entertainment,” TechCrunch,
    April 13, 2019, techcrunch.com/2019/04/13/get-ready-for-a-new-era-of-personalized-entertainment.


    你可能正紧张地四处张望，希望能在视野中看到半人马，其实他们的成果存在于今天你能通过智能手机或其他设备访问的计算机器中。他们努力研究了你的最近一次亚马逊购物之旅，为了迎接你的再次光临重新安排了Omotenashi式的购物体验。与此同时，他们也为数百万名亚马逊客户提供了同样的服务。你最近使用的任何购物、搜索、新闻或视频服务也是如此，因为越来越多的计算Omotenashi可以按照你中意的方式为你服务。⑪证明这一点最简单的方法是看你的朋友在他们的屏幕上能看到什么——或者更好的方法是看年龄、文化、信仰、性别或任何其他特征与你完全不同的人的屏幕，以便与你的朋友圈区分开来。


    Cass R. Sunstein, Republic.com (Princeton, NJ: Princeton University Press, 2007),
    1.

    Brian Resnick, “Yes, Artificial Intelligence Can Be Racist,” Vox, January 24,
    2019 (updated), vox.com/science-and-health/2019/1/23/18194717/alexandria-ocasio-cortez-ai-bias;
    Simone Stolzoff, “Meet Andrew Yang, a 2020 US Presidential Hopeful Running Against
    the Robots,” Quartz, December 7, 2018, qz.com/1485345/meet-andrew-yang-a-2020-us-presidential-hopeful-running-against-the-robots.


    早在20世纪70年代，媒体实验室的创始人之一尼古拉斯·尼葛洛庞帝（Nicholas Negroponte）就预言了这种完全量身定制的客户服务的出现，他提出了“每日一我”的概念，即一份只有你感兴趣的内容的报纸。⑫如今，这已经成了我们的数字生活方方面面的现实，因为所有的半人马都在努力工作以实现自动化并不断改进包围了我们大脑的享乐泡泡。一方面，我们生活中最美好的时刻一遍又一遍地被回放给我们以供我们享受；另一方面，我们正在经历一种认知上的满足感，这最终会限制我们作为一个物种的个体和集体成长的范围。我们该责怪尼葛洛庞帝吗？还是半人马？或者科技公司？当民选领导人能听懂机器语言时，他们将试图代表共同利益进行干预，我们已经看到这样的事情发生。⑬但是，鉴于行政程序的惰性和许多立法者陈旧的思维方式，似乎不太可能通过立法来完全解决并非法律的摩尔定律的影响。


    如果你正在阅读本书的纸质版本，那么你就会知道它没有被测量，你可以放心，我不知道你跳过了哪几页，我也不会感觉受到了冒犯。但是，如果你阅读的是电子版本，那么你就明白了：没错，我知道你在读什么——但就算你跳过任何一页，我也不会生气。因为你是一个对未来感到好奇而不是恐惧的人，而本书就是为你——新的半人马——而写的。（你多长出来的那双毛茸茸的腿困扰你了吗？）但是半人马的方式也有一系列需要处理的问题，考虑到魔法生物容易产生的优越感。举个例子，即使我们已经成为A/B测试专家，我们也可能只有三分之一的时间成功，另有三分之一的时间失败，三分之一的时间没有任何影响。当我们用复利优化和复利恶化的方程式说明这一点时，它就变成了：


    1.01 ^ (365/3) 0.99 ^ (365/3) 1.0 ^ (365/3) = 0.987906 ...


    结果约为0.99，基本上等于1，这意味着我们玩这个游戏时没有累积改进——而且，如果我们把更新的频率提高到每秒一次，则结果为 0! 请不要过于深究这些简单的计算，但我希望你能和我一起思考人类如何以大胆的方式推动改进，而计算机自己是无法做到的。我们的干预有潜力防止计算机的发展降至
    0，对此我们应该感到自豪并承担起责任。


    在麻省理工学院时，我宣称自己是“人文主义技术专家”，但并不知道它的真正含义，这主要是因为我认为技术专家的默认座右铭是技术越多越好。技术专家创造进步，进步是关于正在发生的事情。我们不想要一个根本没有任何事情发生的世界。但随着时间的推移，我发现了这两个术语之间的区别：


    - 技术专家 = 我做，是因为我可以做这件事。

    - 人文主义者 = 我做，是因为我关心这件事。


    仅仅把一个字母替换成两个字母，“可以”（can）就变成了“关心”（care），技术也变得更人性化了。我相信你关心这个问题。因为你关心，所以你现在可以进入最后一章，了解人工智能无法应对的一个挑战，这证明了我们这些老实人是有价值的——而且是必不可少的。我们正处于“奇点”的边缘，我们的重要任务是解决一个失衡社会将面临的自动化问题，现在采取行动还为时不晚。即使到计算机完全超越人类智能的总和的时候，仍然会有一些事情是机器无法胜任的，找到这些事情是我们作为人类的责任。了解机器的世界后，你将需要对我们作为人类共同创造的事物负责——并且我们需要在为时已晚之前共同重新创造。一个计算产品将在收集到的关于我们的数据的驱动下立即得到改进。随着人工智能的崛起，它将成为驱动迭代的唯一力量，而不再需要我们积极和明确的指令输入，对此我们需要采取行动。


    ## 第六章


    ### 机器让失衡自动化


    ### 科技行业正在孕育排斥


    鉴于科技行业长期以来一直受到科技教育行业（我的老本行）的支持，我一直认为我们在源头面临的问题会顺流而下。在加入麻省理工学院几年后，当时的院长查尔斯·M. Vest就1999年关于麻省理工学院科学学院女性教职工的官方报告发表了一份声明：


    > “A Study on the Status of Women Faculty in Science at MIT,” The MIT Faculty
    Newsletter (special edition), March 1999, http://web.mit.edu/fnl/women/women.html.


    我从这份报告及其写定期间的讨论中学到了两个特别重要的教训。首先，我一直以为当代大学中的性别歧视部分是现实，部分是观念。确实如此，但我现在知道了现实部分占相当大的比重。其次，我和我的大多数男同事都认为我们非常支持初级女性教职工。这也是事实。她们一般对此都很满意，并在许多方面（尽管不是所有方面）都得到了很好的支持。然而，当我听到一位感到自己受到不公平待遇已有一段时间的高级女性教职工说“我年轻的时候也觉得其他人很支持我”时，我猛地坐直了。


    我天真地以为，随着麻省理工学院公开发表的这一声明和随后《纽约时报》（The New York Times）对它的报道，性别歧视造成的严重不公平将正式被驱逐出科技世界。因此，当我十多年后在硅谷见到一个满是“硅谷顶级用户体验设计师”的房间里只有两位女性在场时，我大吃一惊。在我离开硅谷前，在我组织的任何聚会或作为演讲者参加的任何活动中，情况已经改善到男女数量对半，因为我发现这是提高活动整体质量最有效的方法。因此，我觉得我这样做说得通。


    > Rachel Gutman, “The Origins of Diversity Data in Tech,” The Atlantic, February
    3, 2018, theatlantic.com/technology/archive/2018/02/the-origins-of-diversity-data-in-tech/552155.
    Alison DeNisco Rayome, “5 Eye-Opening Statistics About Minorities in Tech,” TechRepublic,
    February 7, 2018, techrepublic.com/article/5-eye-opening-statistics-about-minorities-in-tech.


    Donald Tomaskovic-Devey and JooHee Han, “Is Silicon Valley Tech Diversity Possible
    Now?,” University of Massachusetts Amherst, June 2018, umass.edu/employmentequity/silicon-valley-tech-diversity-possible-now-0.


    当我开始深入研究科技领域的统计数据时，我开始感到担忧。据我了解，科技领域的女性只占总人数的21%，而美国女性约占总人口的50%——这显然是不平衡的。➎ 2014年，美国平等就业机会委员会指出，高科技行业中非裔美国人占7.4%，西班牙裔美国人占8%，亚裔美国人占14%；而私营企业的平均比例为非裔美国人占14.4%，西班牙裔美国人占13.9%，亚裔美国人占5.8%。➏
    作为一名亚裔美国人，我不禁注意到就业平等中心的一项研究报告指出，尽管亚裔美国人在科技领域的占比相对较高，但管理和高管职位更有可能被白人男性（或者新行话所说的“苍白男性”）占据。➐在美国以外的国家（比如中国），科技行业也普遍偏好男性——这表明这个问题不只发生在肤色苍白的人群之中。


    “The 2017 Tech Leavers Study,” Kapor Center, April 27, 2017, kaporcenter.org/tech-leavers.


    比起这些数字失衡，更令人担忧的是这种不平衡将如何影响科技行业中的少数派在各个层面的生活质量。卡普尔社会影响中心（The Kapor Center for Social
    Impact）研究了少数派离开科技行业的原因，指出歧视、欺凌、性骚扰和种族主义是最主要的原因。➑研究还发现，女性和有色人种最有可能遭到骚扰，并在有机会晋升时被忽略。回到我在麻省理工学院的故事，我后来发现，麻省理工学院和世界上大多数大学从未与维斯特博士理想的“重置”理念保持一致。因此，这个为科技行业输送了大量工程人才的系统一开始就存在性别失衡，而它只是做了所有系统在存在某种偏见时所做的事情：一如既往地沿着默认道路前进。那些意识到失去了创造更优质的工作环境的机会的领导者，可以选择对此做些什么，或者任其发展。


    从系统的角度来看，我们可以预测，在没有自我纠正的情况下，这种规模的科技行业失衡可能会持续下去。科技公司需要全速运行以跟上摩尔时间尺度，这加大了在潜在雇员中优化“文化适配度”——意味着招聘“和我们一样的人”——的压力。这样一来，新员工就会花更少的时间适应（因为他们“和我们一样”），产生更少的日常摩擦（因为他们“和我们一样”），并且听老板的话（因为他们“和老板一样”）。反过来，这些人又会雇用更多和他们一样的人——除非有明确的全系统层面的干预、激励或惩罚措施来打破这种循环。无论是对待有相似品味的大学朋友，还是因为相似原因搬到同一个地方的邻居，还是已经自行调整以实现和谐最大化的专业圈子，我们都倾向于减少摩擦，选择同质化而非差异化。


    因此，不出所料，科技行业充满了更有可能具有相似想法和相似背景的人，因为快速行动的需要总是比更缓慢、深思熟虑的方法更重要。但是，当有一个“我们”来定义我们时，自然就有对应的“不像我们”的一类人被排除在外，因为“他们”有不同的想法，会拖慢我们的步伐。科技圣殿和金融圣殿或其他试图发展自己的文化的专业圣殿没有什么不同。任何圣殿的边界都会培育出认同安全文化的志同道合者，他们更愿意避免与自己的部落分开时可能感受到的摩擦。和其他圣殿不同的地方在于，尽管我们应该关心任何领域的包容性，但科技人员施加的影响不成比例，因为他们以完全不同的摩尔速度和规模运作。


    > Jeffrey Dastin, “Amazon Scraps Secret AI Recruiting Tool That Showed Bias Against
    Women,” Reuters, October 9, 2018, reuters.com/article/us-amazon-com-jobs-automation-insight/amazon-scraps-secret-ai-recruiting-tool-that-showed-bias-against-women-idUSKCN1MK08G.


    任何公司的专业人士的“失误”都可能对许多人产生负面影响，但计算系统中的“失误”可以在按下按键的几毫秒内影响所有相连的客户。当企业的单一文化偏见成为“失误”的基础时——比如金融部门在一封群发的回复邮件中不加考虑地贬低了所有不知道EBITDA（息税折旧摊销前利润）含义的人，这可能是不幸的。但是，当一个技术产品团队的偏见被同时部署到数百万名用户身上时——比如屏幕上的按钮标签包含的文字没有考虑非白人男性用户的感受，这个偏见就被推向了新的层次。幸运的是，针对公司的失误时社交媒体的反馈循环是迅速且无情的，但在公司文化的深处还可能存在更严重的“失误”。例如，当多数成员是白人男性的亚马逊人工智能专家团队编写内部招聘工具时，他们利用了更可能由白人男性经理做出的招聘决定的数据，自动将提到过女子大学或使用“女子”一词的简历判低分。因此，如果我们要真正优先考虑问责制，那么很容易被认为是“计算机程序错误”的问题就需要更多地被当作“文化错误”来考虑。


    > Lee Fleming, “Perfecting Cross-Pollination,” Harvard Business Review, September
    2004, hbr.org/2004/09/perfecting-cross-pollination.


    一个失衡的系统将产生失衡的结果。当这种想法应用于科技行业时，我们可以看到在可预见的未来失衡的产品将被生产出来。随着科技圣殿中的参与者以计算机的速度和规模奔跑，我们可以预测失衡的速度和程度将是无可比拟的——而且最终会完全自动化。除了这无益于平等和公正的社会影响之外，从组织的角度来看，它代表了实现突破性创新的一个次优途径。缺乏创新催化剂的千篇一律的文化，是不会让企业实现卓越增长的失败策略。出现欠考虑的“失误”的产品也是企业风险的来源，如果团队一开始就对不同的背景和观点有更大的包容性，那么这种“失误”是可以避免的。一个没有人害怕提出不同观点的工作环境，能最迅速地避免代价高昂的错误。但是，你需要不同类型的人，以倾听不同的观点。


    Sara Wachter-Boettcher, Technically Wrong: Sexist Apps, Biased Algorithms, and
    Other Threats of Toxic Tech (New York: W.W. Norton & Company, 2018), 31.

    Davey Alba, “Clearly Snapchat Doesn’t Get What’s Wrong with Yellowface,” Wired,
    August 10, 2016, wired.com/2016/08/snapchat-anime-filter-yellowface.


    萨拉·沃赫特-伯彻（Sara Wachter-Boettcher）具有里程碑意义的著作《技术上的错误》（Technically Wrong）记录了科技行业无意识地让以顺性别白人男性为主的文化偏见影响产品的多种方式。结果，从将用户称为“女孩”的经期应用程序，到向女性推送通知让她们购买情人节礼物去取悦“他”的购物应用程序，应有尽有。或者当一家流行的社交媒体公司发布的一款实时相机滤镜可以把任何一张脸变成亚洲漫画中的那种斜眼——而就在这件事发生几个月前，它发布的另一款实时相机滤镜可以把浅肤色的脸变黑，这种不可接受的错误导致了公关危机，尽管代价高昂，但仍可能无法吸引做出更好的产品决策所需的招聘投资。因此，可以预测这种情况会继续下去，这是科技行业固有的失衡的自然结果，这也涉及初创企业如何获得资金、受到董事会的管理和监督——这让这些妥协很容易发生。


