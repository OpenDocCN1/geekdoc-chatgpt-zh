    所以，如果你告诉计算机：“这都是我母亲的错。” 那么它会回复：“告诉我更多关于你母亲的事。” 或者如果你说：“我受够我父亲了！” 那么它会回复：“告诉我更多关于你父亲的事。”
    如果你再用一个非正式的感叹词欣慰地回答它，比如 “嗯？” 或 “啊！” ，程序会更有同理心地回复：“嗯？你说什么？你的脚不舒服吗？啊！再给我讲讲你的脚吧。”


    代码中另一个简单的逻辑修改可以让程序模拟真人在听你说话，让你觉得自己正在进行一场更深层次的对话：


    forever {

    <将这句话中所有的“我”替换为“你”，然后在句前加上“你刚才说”，在句后加一个问号。>

    <每当句中出现“母亲”或“父亲”等亲属时，忽略其他内容，只回答：“告诉我更多关于你×的事。”>

    < 当一个人输入一段时间后，回顾他们之前说过的话，提取主题，然后回复：“我真的很想再听听关于 ×的事情。”>

    }


    如果我们将其演绎为实际的交流，它会是这样的：


    你：我今天过得很愉快。


    它：你刚才说你今天过得很愉快？


    你：是的。太棒了！


    它：多跟我说说。


    你：这要从我奶奶说过的一件事说起。


    它：你奶奶是做什么的？


    你：她在皇后区开一家面包店。


    它：我真的很想再听听你今天过得怎么样。


    你：很高兴你对此感兴趣！让我从……开始说吧。


    想想和一个能忍受你的喋喋不休并能专注听你说话的人交谈带来的纯粹快乐，这样的对话让我们感到被认可，让我们感觉良好。除此之外，由于这个程序是由一个无限循环驱动的，它会坐在你身边，永无休止地听你说话，很像你耐心的父母或其他亲人。当有人花时间认真地倾听你时，你会想回报他们。我们喜欢被人倾听，因为这意味着我们的存在得到了尊重和承认——即使这种尊重和承认是由机器传达的。


    “Professor Joseph Weizenbaum: Creator of the ‘Eliza’ program,” The Independent,
    March 18, 2008, independent.co.uk/news/obituaries/professor-joseph-weizenbaum-creator-of-the-eliza-program-797162.html.


    计算机可以如此轻易地愚弄人类同胞，这让年轻的魏森鲍姆博士深感困扰。今天，我们觉得任何一位野心勃勃的技术专家都会毫不犹豫地将他们的发明迅速推向市场，但魏森鲍姆不是普通的技术专家。他在小时候逃离了纳粹德国，设法躲过了大屠杀。他的世界观建立在对滥用权力的危害的理解的基础之上。因此，在发明Eliza之后，魏森鲍姆一直在公开谈论计算可能对社会造成的危害，而不是从他的突破性发明中获利或发展自身的事业。他有先见之明地料到，总有一天，计算机不仅能熟练地模仿人类的言谈举止，还能通过了解与之交谈的人的一切成功地在交谈中冒充一个真正的人。


    F.Rosenblatt, “The Perceptron: A Probabilistic Model for Information Storage and
    Organization in the Brain,” Psychological Review 65, no. 6 (1958): 386–408.


    但是，魏森鲍姆的预测需要克服三个障碍：（1）需要一种方法来收集有关个人的所有信息，以便人工智能做出令人信服的回应；（2）需要一种方法来收集许多与他人的对话，以便人工智能学习新的模式；（3）需要一种新的方法来处理所有收集到的信息，而当时符号计算还无法做到这一点。随着智能手机的出现，我们克服了前两个障碍。由于我们使用的设备具有成瘾性，云很容易持续、密切地观察我们所有的行为。第三个障碍的解决方案是“人工神经网络”，这是一种几乎与符号计算同时诞生的计算技术。神经网络在20世纪60年代一场激烈的研究经费之争中落败，但如今它驱动了我们越来越习以为常的计算机异常精确、逼真的语音和文字输出。


    最后一个障碍几年前才被一种特殊的硬件——图形处理器（Graphics Processing Unit，以下简称GPU）打破，设计它是为了让狂热玩家的计算机上的游戏运行得更快，并且画面更逼真。想想为屏幕上每个像素对应的小多边形着色——这是一组中央处理器（Central
    Processing Unit，以下简称CPU）可以自行处理的烦琐操作，但随着时间的推移，人们认为一种特殊的“协同处理器”可以有助于处理屏幕上出现的所有内容。如果你查看如今任何一台计算机的配置，你都会发现GPU通常被描述为这台计算机的一个卖点，但只有当你是游戏玩家时，它才对你有影响。GPU无法帮你加速运行计算机所需的标准数据处理任务。它只适用于将炫酷的图像呈现到屏幕上所需的大量数值计算。尽管我们都喜欢流畅的屏幕视觉效果，对传统计算机用户而言，日益强大的GPU的作用最终超过了它们本身的价值和需求量。但事实证明，GPU是实现“神经网络”这一有点年头的人工智能概念所需的数字密集处理的完美廉价加速器，这一概念在人工智能的讨论中被轻蔑地忽视了50年，到21世纪又被重新唤醒。


    如果我们把“神经网络”分开来看，可以发现它意味着两件事。神经：与大脑中的神经元有关。网络：关于神经元之间的相互连接。神经网络不同于符号计算，因为它不涉及由代码的符号语句定义的一系列逻辑步骤——它更像输入和输出之间的数字“原始”关系，通过一组相互连接的类似神经元的元素在数学上建模，就像大脑中的神经元网络。因此，神经网络不能像传统的计算机程序那样被简单地分解为带有符号的逻辑语句，而是包含在合成神经元之间反复传递直到“学习”到一种模式的原始数字。


    打个比方，你的肌肉在你运动一段时间后会适应这项运动——你不一定会把做运动这件事看成一系列步骤，但你的肌肉确实已经通过辛苦的练习学会了如何做出反应。换句话说，神经网络是一种对我们可能拥有的“直觉”进行编码的方法，这些直觉不能被写成简单易操作的食谱，并且与长期以来我们广泛接受的由字母和数字符号编写计算机代码的方式截然不同。当涉及神经网络时，并没有实际的计算机代码——只有一个学习模式的黑匣子。黑匣子内部是一个粗略的数学模型，用电流的形式模拟了大脑中的神经元是如何工作的，当受到正确的刺激时，这个数学模型可以利用投喂给它的原始数字数据制造自己的火花、连接和关联来学习模式。


    因此，多种因素的共同作用引发了神经网络方法的复兴，这种方法在20世纪60年代已消亡，但随着时间的推移，计算机智能领域出现的出乎意料的“超级爆炸”使其复活：摩尔定律让通用CPU变得更快，推动了甚至更快的专用GPU的发展；符号计算方法在让计算机变得更加智能方面遇到了瓶颈；此外还有谷歌、苹果、脸书和亚马逊收集的所有关于我们的数据。当谈论这个巨大的变化时，我们倾向于不用“人工智能”这个词，因为它带有一些过去的负面含义。我们更喜欢用两个术语来描述这种新型人工智能：“机器学习”（Machine
    Learning）和“深度学习”（Deep Learning）。


    具体来说，深度学习是一种应用于机器学习的技术。创造人工智能的传统方法是教会计算机如何通过if-then规则进行推理。然而，深度学习使用了脑模型——尤其是脑神经网络——来教计算机如何通过观察期望的行为来思考，并通过分析重复的行为模式来学习技能。为了让这个模型顺利工作，计算机需要观察我们的行为，最好是持续地、永不停歇地观察。深度学习曾经在技术上不可行，因为当时缺乏大量训练数据和让计算机成为一个合格的学徒所需的强大处理能力。不出所料，摩尔定律奇迹般地为我们带来了几乎可以计算一切的强大算力。我们不再需要事无巨细地教计算机，因为它可以利用手头的任何数据轻松自学，而且当需要更多数据时，它可以自行从云端获取更多数据，变得更加智能。


    让我们先暂停一下——这个想法很微妙，很难完全理解。这很像我们去传统的法国面包店买面包的时候，他们会提供两种看起来一样的面包。一种是天然酵母面包（pain au
    levain），另一种是工业酵母面包（pain à la levure）。对像我这样的普通美国人而言，这毫无意义，因为它们都有同样的撒有面粉的浅棕色脆皮，这也是法棍的特点之一。但对法国人而言，这两种面包完全不同，因为它们的制作方法不同，它们的味道也有细微的差别。天然酵母面包是用天然酵母制作的，而工业酵母面包是用工业酵母制作的。记住它们之间的区别的一个简单的助记符是“天然酵母”的法语（levain）以n结尾，而“天然”的英语（natural）以n开始。


    我认为手工制造计算机器和老式人工智能的传统技艺就类似天然酵母——向手工构建代码致敬。但是，由神经网络驱动的人工智能新方法是以一种新的、合成的方式制造出来的，类似工业酵母。两种类型的面包就像两种类型的计算，都满足了制造它们的基本需求——但在各自成分上有根本的不同。如何区分天然酵母面包和工业酵母面包？你无法通过观察两条面包的表面来区分——但可以用鼻子嗅出它们之间的差别：天然酵母有一股酸味，而工业酵母没有。同样地，由于神经网络在进行以前难以想象的行为时不会发出任何“气味”，我们需要特别关注这种差异。


    Istvan S.N. Berkeley, “A Revisionist History of Connectionism,” 1997, userweb.ucs.louisiana.edu/~isb9112/dept/phil341/histconn.html.


    Andrew Ng (@AndrewYNg), 2017, “If you''re trying to understand AI''s near-term
    impact, don''t think ‘sentience.’ Instead think ‘automation on steroids,’” Twitter,
    May 1, 2017, twitter.com/andrewyng/status/859106360662806529?lang=en.


    在魏森鲍姆的人工智能时代，我们仍然有可能分辨计算机系统机器人般的反应。①它有一种天然酵母的独特酸味。但即使在那个时候，由于摩尔定律的发展，区分真人的反应和机器的反应似乎也会不可避免地变得越来越难。如果你和魏森鲍姆一样对这些新兴的、栩栩如生的神经网络技术带来的影响感到担忧，那么欢迎来到持续开展的关于工业酵母人工智能的辩论。机器学习专家吴恩达（Andrew
    Ng）认为问题并不是计算机最终是否会被唤醒，成为一种高级生命形式。他认为：“如果你在试图理解人工智能的短期影响，那么不要想‘感知能力’，你应该想‘打了类固醇的自动化’。”②打了类固醇的自动化意味着我们生活在这样一个时代：循环的、无限大的计算机器激发了一种仿佛有生命的物质，像永不疲倦的僵尸那样行动，人工智能是一种没有思想的机器人，它根据它的“大脑”接触到的模式来执行我们的命令。


    Benedict Evans, “Voice and the Uncanny Valley of AI,” Benedict Evans (blog), March
    9, 2017, ben-evans.com/benedictevans/2017/2/22/voice-and-the-uncanny-valley-of-ai.


    新的工业酵母“活机器”远比过去的机器聪明，因为摩尔定律带我们走了如此之远，以至于意想不到的事情发生了。GPU为神经网络处理能力带来了巨大的飞跃，但是吴恩达的“打了类固醇的自动化”需要足够大的数据集来投喂神经网络，否则神经网络永远也不可能靠自学变得如此熟练。例如，在2012年之前，图像识别的平均错误率为28%，语音识别的平均错误率为26%。②在机器学习方法开始流行后，图像识别的平均错误率为7%，语音识别的平均错误率为4%。如果云继续从我们的活动中吸收更多的数据，如果僵尸继续复制我们的所有动作还不需要午休，我们终将无法分辨人工智能和人类。工业酵母人工智能已到来，它没有过去天然酵母人工智能的酸味。


    ## 艺术家的视角让你保有好奇心


    担任罗德岛设计学院校长时，我认为在一个把STEM放在首位的时代，支持艺术教育是我的责任。我听到公立学校的艺术课从每周几小时缩减到几十分钟，而我成功的技术生涯很大程度上要归功于艺术，这促使我思考如何揭示STEM教育方法的局限性。它迫使我思考摩尔定律带来的利弊，让我了解到艺术与STEM交叉时产生的经济利益，这让我相信STEAM是比STEM更好的策略。把这个议题带到位于华盛顿特区的美国国会并遇到数不清的艺术和设计让位于STEM的故事，在后来促使我前往硅谷。我想了解像苹果和爱彼迎（Airbnb）这样的公司是如何在它们的产品和服务中充分利用STEAM的综合能力的。我发现了什么？那些设计氛围浓厚的公司完全理解艺术是享受生活的科学，因此，为了让客户享受在生活中使用它们的产品，它们需要让艺术家参与产品的研发过程。


    艺术家的名声往往不好——当然，我因为个人经验非常了解这一点，我的父母希望我学数学而不是艺术，因为他们担心我永远也找不到工作。这是因为艺术可能看起来深奥且无关紧要，但正是在艺术中我找到了一种与计算世界完全兼容的角度。因为艺术不仅仅是你能看到或感觉到的东西，艺术是关于去发现表象之下的东西——理解任何事物的本质核心。例如，艺术家们知道一个关于苹果的重要事实，当你只是咬一口苹果时，你不会立刻发现这个事实。


    试着凭记忆画一个苹果，你可能会画一个圆圈，在其上方画一根棍子。但苹果的形状并不基于圆或球——它更像一个有五条棱的柱体。把苹果横着切成两半，不要竖着切。你看到了什么？


    ![](img/a980a6de0555167c9f36435ce714d7b4_67_0.png)


    John H. Lienhard, “No.1243: Five-Fold Symmetry,” The Engines of Our Ingenuity
    (blog), uh.edu/engines/epi1243.htm.


    你看到五边形了吗？知道这个事实会让你画的苹果更逼真。事实证明，地球上大多数植物都有这种五条棱排列方式——以苹果为例，它是从苹果花中长出来的。要亲自验证这一点，最简单的方法就是输入代表樱花的表情符号，它揭示了类似的五重对称。所以，优秀的艺术家知道苹果的这个事实，会根据它的自然几何学特性进行描绘——除非你真的在全神贯注地理解（而不是只用眼睛看），否则你发现不了这一点。这就是为什么为了准确地表现人体，画家们首先要了解骨骼结构和肌肉包裹骨骼的方式，然后才学习绘制人体。这是一个有逻辑且严谨的过程。


    我们常常误以为艺术家只是按照他们自由想象的方式来描绘世界。年轻时，我确实也犯过同样的错误，但沉浸在艺术中的经历让我在更深的层次上了解了艺术家的思想。我开始充分欣赏艺术家在其主要思维层面上同时把握前景和背景的能力。我深夜在罗德岛设计学院校园里散步时了解到这一点，当时我经常光顾埃德娜·劳伦斯自然实验室（Edna
    Lawrence Nature Lab）——一个由动物标本、植物标本和矿物样本组成的微型自然历史博物馆。我经常去观察和欣赏华丽的蝴蝶标本陈列柜，小小的玻璃盒子里放着形状和颜色各异的蝴蝶标本，它们有蓝色、绿色或橙色的翅膀。


    一个寒冷的冬夜，我走进自然实验室，发现里面空无一人，因此我很自在地问学生展员蝴蝶是不是这里最受欢迎的展品，我告诉她蝴蝶标本是我的最爱。她马上回答：“不是。葫芦才是。”她有些疑惑的表情仿佛在说：“你竟然喜欢蝴蝶？这太肤浅和幼稚了。”我们都害怕比我们聪明的大学生是有原因的，所以我以一种谦卑的姿态表示：“请教教我吧，大师！”


    幸运的是，她给了我一个提示，并开玩笑地说：“不过羽毛们也很神奇！”那时，我有点担心她是不是在休息时嗑了什么药。羽毛？！？！


    注意到我彻底被绕晕了，她从大型陈列柜中拿出一份蝴蝶标本，将我带到刚刚安装的一台高倍显微镜前。“在这里，你看！”我看着显微镜下的成像逐渐清晰，这正是……蝴蝶翅膀表面的羽毛状鳞片。当蝴蝶不幸被年幼好奇的你抓住，再也无法飞翔时，这就是沾到你手指上的粉末状物质。但这些并非真的粉末；实际上，它近距离看起来像羽毛。我回到了冬季寒冷的室外，但这名鼓舞人心的学生如此流畅地跨越不同尺度的能力对我的启迪使我感到温暖。她让我想起艺术家总是擅长建立不太可能的联系。


    ![](img/a980a6de0555167c9f36435ce714d7b4_68_0.png)


    Zhenqiang Gong, Nicholas J. Matzke, Bard Ermentrout, Dawn Song, Jann E. Vendetti,
    Montgomery Slatkin, George Oster, “Evolution of patterns on Conus shells,” Proceedings
    of the National Academy of Sciences, January 2012, 109 (5) E234–E241; DOI: 10.1073/pnas.1119859109.


    出于对不太可能的联系的尊重，我策划了自己的小型桌面自然实验室，展示了芋螺属动物的壳。这些海螺壳不是羽毛状的，但有着蛛网状的线条，这些线条形成了小三角形，小三角形又向外扩展，形成更多的三角形——就像你把科赫雪花放大能看到的永无止境的重复图案。这种图案模式类似于著名计算机科学家斯蒂芬·沃尔夫勒姆（Stephen
    Wolfram）发现的一种名为“规则30”的计算机算法，它展示了我们有机的物质现实与看不见的计算世界之间惊人的联系。因此，我们在计算机上编写的看似不近人情的算法，可能比我们想象得更人性化、更自然。


    ![](img/a980a6de0555167c9f36435ce714d7b4_69_0.png)


    “规则30”的工作原理是将一行数字设为零：


    ```

    0000000000000000000000000000...

    ```


    然后编写一段简单的代码，根据以下8条规则得到下一行数字：


    - 规则1：如果存在序列000，那么将中央数字变为0。

    - 规则2：如果存在序列111，那么将中央数字变为0。

    - 规则3：如果存在序列110，那么将中央数字变为0。

    - 规则4：如果存在序列101，那么将中央数字变为0。

    - 规则5：如果存在序列100，那么将中央数字变为1。

    - 规则6：如果存在序列011，那么将中央数字变为1。

    - 规则7：如果存在序列010，那么将中央数字变为1。

    - 规则8：如果存在序列001，那么将中央数字变为1。


    当我们把这行数字设为0时，结果会很无聊，因为运行这个算法会得到如下结果：


    ```

    00000000000000000000000000 ...

    00000000000000000000000000 ...

    00000000000000000000000000 ...

    ```


    但是如果我们在这行数字中设置一个数字为1，随着算法的运行我们会看到一些变化：


    ```

    0000000000000100000000000 ...

    0000000000001110000000000 ...

    0000000000011010000000000 ...

    0000000000110111000000000 ...

    ```


    注意，一个由1和0组成的模式正在增长，如果你要循环几百个周期，你会得到一个有波峰和波谷的模式。用白色方块代替数字0，用黑色方块代替数字1，你会得到这样的图案：


    '
  mdcn: '


    forever {

    <将这句话中所有的“我”替换为“你”，然后在句前加上“你刚才说”，在句后加一个问号。>

    <每当句中出现“母亲”或“父亲”等亲属时，忽略其他内容，只回答：“告诉我更多关于你×的事。”>

    }


    所以，如果你告诉计算机：“这都是我母亲的错。” 那么它会回复：“告诉我更多关于你母亲的事。” 或者如果你说：“我受够我父亲了！” 那么它会回复：“告诉我更多关于你父亲的事。”
    如果你再用一个非正式的感叹词欣慰地回答它，比如 “嗯？” 或 “啊！” ，程序会更有同理心地回复：“嗯？你说什么？你的脚不舒服吗？啊！再给我讲讲你的脚吧。”


    代码中另一个简单的逻辑修改可以让程序模拟真人在听你说话，让你觉得自己正在进行一场更深层次的对话：


    forever {

    <将这句话中所有的“我”替换为“你”，然后在句前加上“你刚才说”，在句后加一个问号。>

    <每当句中出现“母亲”或“父亲”等亲属时，忽略其他内容，只回答：“告诉我更多关于你×的事。”>

    < 当一个人输入一段时间后，回顾他们之前说过的话，提取主题，然后回复：“我真的很想再听听关于 ×的事情。”>

    }


    如果我们将其演绎为实际的交流，它会是这样的：


    你：我今天过得很愉快。


    它：你刚才说你今天过得很愉快？


    你：是的。太棒了！


    它：多跟我说说。


    你：这要从我奶奶说过的一件事说起。


    它：你奶奶是做什么的？


    你：她在皇后区开一家面包店。


    它：我真的很想再听听你今天过得怎么样。


    你：很高兴你对此感兴趣！让我从……开始说吧。


    想想和一个能忍受你的喋喋不休并能专注听你说话的人交谈带来的纯粹快乐，这样的对话让我们感到被认可，让我们感觉良好。除此之外，由于这个程序是由一个无限循环驱动的，它会坐在你身边，永无休止地听你说话，很像你耐心的父母或其他亲人。当有人花时间认真地倾听你时，你会想回报他们。我们喜欢被人倾听，因为这意味着我们的存在得到了尊重和承认——即使这种尊重和承认是由机器传达的。


    “Professor Joseph Weizenbaum: Creator of the ‘Eliza’ program,” The Independent,
    March 18, 2008, independent.co.uk/news/obituaries/professor-joseph-weizenbaum-creator-of-the-eliza-program-797162.html.


    计算机可以如此轻易地愚弄人类同胞，这让年轻的魏森鲍姆博士深感困扰。今天，我们觉得任何一位野心勃勃的技术专家都会毫不犹豫地将他们的发明迅速推向市场，但魏森鲍姆不是普通的技术专家。他在小时候逃离了纳粹德国，设法躲过了大屠杀。他的世界观建立在对滥用权力的危害的理解的基础之上。因此，在发明Eliza之后，魏森鲍姆一直在公开谈论计算可能对社会造成的危害，而不是从他的突破性发明中获利或发展自身的事业。他有先见之明地料到，总有一天，计算机不仅能熟练地模仿人类的言谈举止，还能通过了解与之交谈的人的一切成功地在交谈中冒充一个真正的人。


    F.Rosenblatt, “The Perceptron: A Probabilistic Model for Information Storage and
    Organization in the Brain,” Psychological Review 65, no. 6 (1958): 386–408.


    但是，魏森鲍姆的预测需要克服三个障碍：（1）需要一种方法来收集有关个人的所有信息，以便人工智能做出令人信服的回应；（2）需要一种方法来收集许多与他人的对话，以便人工智能学习新的模式；（3）需要一种新的方法来处理所有收集到的信息，而当时符号计算还无法做到这一点。随着智能手机的出现，我们克服了前两个障碍。由于我们使用的设备具有成瘾性，云很容易持续、密切地观察我们所有的行为。第三个障碍的解决方案是“人工神经网络”，这是一种几乎与符号计算同时诞生的计算技术。神经网络在20世纪60年代一场激烈的研究经费之争中落败，但如今它驱动了我们越来越习以为常的计算机异常精确、逼真的语音和文字输出。


    最后一个障碍几年前才被一种特殊的硬件——图形处理器（Graphics Processing Unit，以下简称GPU）打破，设计它是为了让狂热玩家的计算机上的游戏运行得更快，并且画面更逼真。想想为屏幕上每个像素对应的小多边形着色——这是一组中央处理器（Central
    Processing Unit，以下简称CPU）可以自行处理的烦琐操作，但随着时间的推移，人们认为一种特殊的“协同处理器”可以有助于处理屏幕上出现的所有内容。如果你查看如今任何一台计算机的配置，你都会发现GPU通常被描述为这台计算机的一个卖点，但只有当你是游戏玩家时，它才对你有影响。GPU无法帮你加速运行计算机所需的标准数据处理任务。它只适用于将炫酷的图像呈现到屏幕上所需的大量数值计算。尽管我们都喜欢流畅的屏幕视觉效果，对传统计算机用户而言，日益强大的GPU的作用最终超过了它们本身的价值和需求量。但事实证明，GPU是实现“神经网络”这一有点年头的人工智能概念所需的数字密集处理的完美廉价加速器，这一概念在人工智能的讨论中被轻蔑地忽视了50年，到21世纪又被重新唤醒。


    如果我们把“神经网络”分开来看，可以发现它意味着两件事。神经：与大脑中的神经元有关。网络：关于神经元之间的相互连接。神经网络不同于符号计算，因为它不涉及由代码的符号语句定义的一系列逻辑步骤——它更像输入和输出之间的数字“原始”关系，通过一组相互连接的类似神经元的元素在数学上建模，就像大脑中的神经元网络。因此，神经网络不能像传统的计算机程序那样被简单地分解为带有符号的逻辑语句，而是包含在合成神经元之间反复传递直到“学习”到一种模式的原始数字。


    打个比方，你的肌肉在你运动一段时间后会适应这项运动——你不一定会把做运动这件事看成一系列步骤，但你的肌肉确实已经通过辛苦的练习学会了如何做出反应。换句话说，神经网络是一种对我们可能拥有的“直觉”进行编码的方法，这些直觉不能被写成简单易操作的食谱，并且与长期以来我们广泛接受的由字母和数字符号编写计算机代码的方式截然不同。当涉及神经网络时，并没有实际的计算机代码——只有一个学习模式的黑匣子。黑匣子内部是一个粗略的数学模型，用电流的形式模拟了大脑中的神经元是如何工作的，当受到正确的刺激时，这个数学模型可以利用投喂给它的原始数字数据制造自己的火花、连接和关联来学习模式。


    因此，多种因素的共同作用引发了神经网络方法的复兴，这种方法在20世纪60年代已消亡，但随着时间的推移，计算机智能领域出现的出乎意料的“超级爆炸”使其复活：摩尔定律让通用CPU变得更快，推动了甚至更快的专用GPU的发展；符号计算方法在让计算机变得更加智能方面遇到了瓶颈；此外还有谷歌、苹果、脸书和亚马逊收集的所有关于我们的数据。当谈论这个巨大的变化时，我们倾向于不用“人工智能”这个词，因为它带有一些过去的负面含义。我们更喜欢用两个术语来描述这种新型人工智能：“机器学习”（Machine
    Learning）和“深度学习”（Deep Learning）。


    具体来说，深度学习是一种应用于机器学习的技术。创造人工智能的传统方法是教会计算机如何通过if-then规则进行推理。然而，深度学习使用了脑模型——尤其是脑神经网络——来教计算机如何通过观察期望的行为来思考，并通过分析重复的行为模式来学习技能。为了让这个模型顺利工作，计算机需要观察我们的行为，最好是持续地、永不停歇地观察。深度学习曾经在技术上不可行，因为当时缺乏大量训练数据和让计算机成为一个合格的学徒所需的强大处理能力。不出所料，摩尔定律奇迹般地为我们带来了几乎可以计算一切的强大算力。我们不再需要事无巨细地教计算机，因为它可以利用手头的任何数据轻松自学，而且当需要更多数据时，它可以自行从云端获取更多数据，变得更加智能。


    让我们先暂停一下——这个想法很微妙，很难完全理解。这很像我们去传统的法国面包店买面包的时候，他们会提供两种看起来一样的面包。一种是天然酵母面包（pain au
    levain），另一种是工业酵母面包（pain à la levure）。对像我这样的普通美国人而言，这毫无意义，因为它们都有同样的撒有面粉的浅棕色脆皮，这也是法棍的特点之一。但对法国人而言，这两种面包完全不同，因为它们的制作方法不同，它们的味道也有细微的差别。天然酵母面包是用天然酵母制作的，而工业酵母面包是用工业酵母制作的。记住它们之间的区别的一个简单的助记符是“天然酵母”的法语（levain）以n结尾，而“天然”的英语（natural）以n开始。


    我认为手工制造计算机器和老式人工智能的传统技艺就类似天然酵母——向手工构建代码致敬。但是，由神经网络驱动的人工智能新方法是以一种新的、合成的方式制造出来的，类似工业酵母。两种类型的面包就像两种类型的计算，都满足了制造它们的基本需求——但在各自成分上有根本的不同。如何区分天然酵母面包和工业酵母面包？你无法通过观察两条面包的表面来区分——但可以用鼻子嗅出它们之间的差别：天然酵母有一股酸味，而工业酵母没有。同样地，由于神经网络在进行以前难以想象的行为时不会发出任何“气味”，我们需要特别关注这种差异。


    Istvan S.N. Berkeley, “A Revisionist History of Connectionism,” 1997, userweb.ucs.louisiana.edu/~isb9112/dept/phil341/histconn.html.


    Andrew Ng (@AndrewYNg), 2017, “If you''re trying to understand AI''s near-term
    impact, don''t think ‘sentience.’ Instead think ‘automation on steroids,’” Twitter,
    May 1, 2017, twitter.com/andrewyng/status/859106360662806529?lang=en.


    在魏森鲍姆的人工智能时代，我们仍然有可能分辨计算机系统机器人般的反应。①它有一种天然酵母的独特酸味。但即使在那个时候，由于摩尔定律的发展，区分真人的反应和机器的反应似乎也会不可避免地变得越来越难。如果你和魏森鲍姆一样对这些新兴的、栩栩如生的神经网络技术带来的影响感到担忧，那么欢迎来到持续开展的关于工业酵母人工智能的辩论。机器学习专家吴恩达（Andrew
    Ng）认为问题并不是计算机最终是否会被唤醒，成为一种高级生命形式。他认为：“如果你在试图理解人工智能的短期影响，那么不要想‘感知能力’，你应该想‘打了类固醇的自动化’。”②打了类固醇的自动化意味着我们生活在这样一个时代：循环的、无限大的计算机器激发了一种仿佛有生命的物质，像永不疲倦的僵尸那样行动，人工智能是一种没有思想的机器人，它根据它的“大脑”接触到的模式来执行我们的命令。


    Benedict Evans, “Voice and the Uncanny Valley of AI,” Benedict Evans (blog), March
    9, 2017, ben-evans.com/benedictevans/2017/2/22/voice-and-the-uncanny-valley-of-ai.


    新的工业酵母“活机器”远比过去的机器聪明，因为摩尔定律带我们走了如此之远，以至于意想不到的事情发生了。GPU为神经网络处理能力带来了巨大的飞跃，但是吴恩达的“打了类固醇的自动化”需要足够大的数据集来投喂神经网络，否则神经网络永远也不可能靠自学变得如此熟练。例如，在2012年之前，图像识别的平均错误率为28%，语音识别的平均错误率为26%。②在机器学习方法开始流行后，图像识别的平均错误率为7%，语音识别的平均错误率为4%。如果云继续从我们的活动中吸收更多的数据，如果僵尸继续复制我们的所有动作还不需要午休，我们终将无法分辨人工智能和人类。工业酵母人工智能已到来，它没有过去天然酵母人工智能的酸味。


    ## 艺术家的视角让你保有好奇心


    担任罗德岛设计学院校长时，我认为在一个把STEM放在首位的时代，支持艺术教育是我的责任。我听到公立学校的艺术课从每周几小时缩减到几十分钟，而我成功的技术生涯很大程度上要归功于艺术，这促使我思考如何揭示STEM教育方法的局限性。它迫使我思考摩尔定律带来的利弊，让我了解到艺术与STEM交叉时产生的经济利益，这让我相信STEAM是比STEM更好的策略。把这个议题带到位于华盛顿特区的美国国会并遇到数不清的艺术和设计让位于STEM的故事，在后来促使我前往硅谷。我想了解像苹果和爱彼迎（Airbnb）这样的公司是如何在它们的产品和服务中充分利用STEAM的综合能力的。我发现了什么？那些设计氛围浓厚的公司完全理解艺术是享受生活的科学，因此，为了让客户享受在生活中使用它们的产品，它们需要让艺术家参与产品的研发过程。


    艺术家的名声往往不好——当然，我因为个人经验非常了解这一点，我的父母希望我学数学而不是艺术，因为他们担心我永远也找不到工作。这是因为艺术可能看起来深奥且无关紧要，但正是在艺术中我找到了一种与计算世界完全兼容的角度。因为艺术不仅仅是你能看到或感觉到的东西，艺术是关于去发现表象之下的东西——理解任何事物的本质核心。例如，艺术家们知道一个关于苹果的重要事实，当你只是咬一口苹果时，你不会立刻发现这个事实。


    试着凭记忆画一个苹果，你可能会画一个圆圈，在其上方画一根棍子。但苹果的形状并不基于圆或球——它更像一个有五条棱的柱体。把苹果横着切成两半，不要竖着切。你看到了什么？


    ![](img/a980a6de0555167c9f36435ce714d7b4_67_0.png)


    John H. Lienhard, “No.1243: Five-Fold Symmetry,” The Engines of Our Ingenuity
    (blog), uh.edu/engines/epi1243.htm.


    你看到五边形了吗？知道这个事实会让你画的苹果更逼真。事实证明，地球上大多数植物都有这种五条棱排列方式——以苹果为例，它是从苹果花中长出来的。要亲自验证这一点，最简单的方法就是输入代表樱花的表情符号，它揭示了类似的五重对称。所以，优秀的艺术家知道苹果的这个事实，会根据它的自然几何学特性进行描绘——除非你真的在全神贯注地理解（而不是只用眼睛看），否则你发现不了这一点。这就是为什么为了准确地表现人体，画家们首先要了解骨骼结构和肌肉包裹骨骼的方式，然后才学习绘制人体。这是一个有逻辑且严谨的过程。


    我们常常误以为艺术家只是按照他们自由想象的方式来描绘世界。年轻时，我确实也犯过同样的错误，但沉浸在艺术中的经历让我在更深的层次上了解了艺术家的思想。我开始充分欣赏艺术家在其主要思维层面上同时把握前景和背景的能力。我深夜在罗德岛设计学院校园里散步时了解到这一点，当时我经常光顾埃德娜·劳伦斯自然实验室（Edna
    Lawrence Nature Lab）——一个由动物标本、植物标本和矿物样本组成的微型自然历史博物馆。我经常去观察和欣赏华丽的蝴蝶标本陈列柜，小小的玻璃盒子里放着形状和颜色各异的蝴蝶标本，它们有蓝色、绿色或橙色的翅膀。


    一个寒冷的冬夜，我走进自然实验室，发现里面空无一人，因此我很自在地问学生展员蝴蝶是不是这里最受欢迎的展品，我告诉她蝴蝶标本是我的最爱。她马上回答：“不是。葫芦才是。”她有些疑惑的表情仿佛在说：“你竟然喜欢蝴蝶？这太肤浅和幼稚了。”我们都害怕比我们聪明的大学生是有原因的，所以我以一种谦卑的姿态表示：“请教教我吧，大师！”


    幸运的是，她给了我一个提示，并开玩笑地说：“不过羽毛们也很神奇！”那时，我有点担心她是不是在休息时嗑了什么药。羽毛？！？！


    注意到我彻底被绕晕了，她从大型陈列柜中拿出一份蝴蝶标本，将我带到刚刚安装的一台高倍显微镜前。“在这里，你看！”我看着显微镜下的成像逐渐清晰，这正是……蝴蝶翅膀表面的羽毛状鳞片。当蝴蝶不幸被年幼好奇的你抓住，再也无法飞翔时，这就是沾到你手指上的粉末状物质。但这些并非真的粉末；实际上，它近距离看起来像羽毛。我回到了冬季寒冷的室外，但这名鼓舞人心的学生如此流畅地跨越不同尺度的能力对我的启迪使我感到温暖。她让我想起艺术家总是擅长建立不太可能的联系。


    ![](img/a980a6de0555167c9f36435ce714d7b4_68_0.png)


    Zhenqiang Gong, Nicholas J. Matzke, Bard Ermentrout, Dawn Song, Jann E. Vendetti,
    Montgomery Slatkin, George Oster, “Evolution of patterns on Conus shells,” Proceedings
    of the National Academy of Sciences, January 2012, 109 (5) E234–E241; DOI: 10.1073/pnas.1119859109.


    出于对不太可能的联系的尊重，我策划了自己的小型桌面自然实验室，展示了芋螺属动物的壳。这些海螺壳不是羽毛状的，但有着蛛网状的线条，这些线条形成了小三角形，小三角形又向外扩展，形成更多的三角形——就像你把科赫雪花放大能看到的永无止境的重复图案。这种图案模式类似于著名计算机科学家斯蒂芬·沃尔夫勒姆（Stephen
    Wolfram）发现的一种名为“规则30”的计算机算法，它展示了我们有机的物质现实与看不见的计算世界之间惊人的联系。因此，我们在计算机上编写的看似不近人情的算法，可能比我们想象得更人性化、更自然。


    ![](img/a980a6de0555167c9f36435ce714d7b4_69_0.png)


    “规则30”的工作原理是将一行数字设为零：


    ```

    0000000000000000000000000000...

    ```


    然后编写一段简单的代码，根据以下8条规则得到下一行数字：


    - 规则1：如果存在序列000，那么将中央数字变为0。

    - 规则2：如果存在序列111，那么将中央数字变为0。

    - 规则3：如果存在序列110，那么将中央数字变为0。

    - 规则4：如果存在序列101，那么将中央数字变为0。

    - 规则5：如果存在序列100，那么将中央数字变为1。

    - 规则6：如果存在序列011，那么将中央数字变为1。

    - 规则7：如果存在序列010，那么将中央数字变为1。

    - 规则8：如果存在序列001，那么将中央数字变为1。


    当我们把这行数字设为0时，结果会很无聊，因为运行这个算法会得到如下结果：


    ```

    00000000000000000000000000 ...

    00000000000000000000000000 ...

    00000000000000000000000000 ...

    ```


    但是如果我们在这行数字中设置一个数字为1，随着算法的运行我们会看到一些变化：


    ```

    0000000000000100000000000 ...

    0000000000001110000000000 ...

    0000000000011010000000000 ...

    0000000000110111000000000 ...

    ```


    注意，一个由1和0组成的模式正在增长，如果你要循环几百个周期，你会得到一个有波峰和波谷的模式。用白色方块代替数字0，用黑色方块代替数字1，你会得到这样的图案：


