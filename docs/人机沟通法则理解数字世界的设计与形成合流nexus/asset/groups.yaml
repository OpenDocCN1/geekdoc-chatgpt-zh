    (blog), June 2, 2019, howtospeakmachine.com/2019/06/02/quant-is-the-scaffolding-qual-is-the-clay.


    定性的见解是通过与像你这样的人类进行精心组织的对话来获得的——这不断提醒我们这项工作最终是为谁服务的。整合定量和定性的数据是完美的互补。将“定量且定性的”方法与团队的经验直觉相结合，让你有更多的机会得出你可以代表你的服务对象尽职地操控的结论。


    ## 将一个想法付诸实践比祈祷它是正确的更可靠


    我们已经走过了一段漫长的路，探究测量系统之所以异常有用的核心：轻松测试想法的能力。但在我们深入探讨这种能力之前，我想让你至少熟悉测量是如何发生的，了解拥有关于用户的数据可能有益也可能有害，以及一种可以最大化利用大量涌入的数据的全新技术。这项技术本身微不足道，但考虑到连接我们所有人的计算机云的范围、速度和阴影遍布全球，它的影响是巨大的。通过把一个用于数据收集的想法推向世界，我们只需要观察它的实际使用情况，就可以很容易地测量它是成功还是失败的。


    但比起了解一个想法是好是坏，更好的办法是同时实践一个想法的几个变体，以此了解哪一个变体才是最好的方向。也许一个想法的某个方面比其他的好——这可以通过测试变体来揭示，而不是抛弃整个想法。这就像在鱼竿末端挂三种不同的鱼饵，看哪一种能钓到最多的鱼。然后，通过把最有效的鱼饵作为你下一组变体的基础，你就有可能找到下一个最好的鱼饵，以此类推。通过这种方式轻松测试不同想法的能力降低了随机猜测的风险，对于改善产品设计有益无害。


    将上一章的复利方程式应用于连续改进与连续恶化相比的问题：


    1.01 ^ 365 = 37.8 与 0.99 ^ 365 = 0.03 相比


    如果我们在猜测如何改进系统方面变得异常出色——例如，每天改进2%而不是只有1%，那么它将是：


    1.02 ^ 365 = 1377.4 [与37.8相比]


    而如果我们掉链子，使事情每天恶化2%而不是1%，那么它将是：


    0.98 ^ 365 = 0.0006 [与0.03相比]


    这告诉我们，如果我们养成了经常猜错的习惯，会发生什么。


    抛开这些顾虑，令人激动的是一年内实现千倍改进的可能性。然而，我想提醒你应该把激情用于追求崇高目标，比如帮助退休人士负担起每周的生活费，而不是更险恶的意图，比如改变选民对候选人的看法。在这里提出这个警告，和我在本章一直试图做的一样，是为了再次强调云不仅仅是由计算机相连而成的网络，还是连接了人类的网络。我们当然很容易忘记这一点，所以如果我听起来像在说教，请理解这不是我的本意——这样做是为了提醒自己在将来读到这些话时记住这一点。我发现自己很容易忘记将不良行为自动化有多么容易。


