    of Massive-Scale Emotional Contagion Through Social Networks,” PNAS, June 2, 2014,
    pnas.org/content/111/24/8788.


    因此，当我们通过云在许多计算设备上进行实验时，我们其实是在对真人进行实验——而不是在无形的、分离的计算模拟中进行实验。例如，2014年，脸书分享了它在689,003名用户中进行的一项实验。在这项实验中，用户更多地看到了朋友发的带有不同程度的消极/积极情绪的帖子，而不是带有积极/消极情绪的帖子。脸书的结论是，通过这种方法可以操控从统计学角度看相当多的人的情绪——换言之，这个实验显示了全自动地将50万人变成愤怒暴民的潜力。现在，我不认为你在实践你的想法时会对你的客户进行这些有问题的实验，但请记住，在没有得到他们的明确许可和完全理解的情况下，你绝对不应该这样做。


    Dan Siroker, “How Obama Raised $60 Million by Running a Simple Experiment,” Optimizely
    (blog), November 29, 2010, blog.optimizely.com/2010/11/29/how-obama-raised-60-million-by-running-a-simple-experiment.

    Joshua Green, “The Science Behind Those Obama Campaign E-Mails,” Bloomberg Businessweek,
    November 29, 2012, bloomberg.com/news/articles/2012-11-29/the-science-behind-those-obama-campaign-e-mails#r=auth-s.


    2008年贝拉克·奥巴马（Barack Obama）竞选总统期间，在barackobama.com上进行的筹款实验是一个更成功的例子。奥巴马团队没有简单地发布最终网站来筹款，而是采用了24种按钮和媒体内容的不同组合，最终确定其中一个组合的效果比默认的好40.6%，采用这个组合可以多筹集6,000万美元。在奥巴马的第一次竞选中负责这项工作的负责人后来成功创办了一家名为Optimizely的公司，该公司让每个人都能轻松进行此类实验。不出所料，对实验的痴迷同样体现了在奥巴马2012年竞选总统期间的筹款活动中。其中一个例子是测试主题不同但内容相同的电子邮件的差异。结果发现，以“民意调查做对了一件事”为主题的邮件募集到了403,600美元，以“我将严重超支”为主题的邮件则募集到了2,540,866美元。


