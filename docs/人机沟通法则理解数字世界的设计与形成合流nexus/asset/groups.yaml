    # 数据科学在全局层面控制逻辑解释


    假设一个普通人每天解锁智能手机的次数超过了100，现在全世界有数以十亿计的手持计算设备，那么我们可以发现访问这些设备产生的信息量很容易证明“大数据”这个常用术语的合理性。全世界所有互动产生的海量数据可能会让你认为，任何人都不可能利用这些信息做任何事情。但是，由于你熟悉计算机器的工作原理，你知道我们生活在一个分析数千、数百万、数十亿、数万亿数据点完全可行而且正在发生的时代。从技术角度看，云端的计算机器可以以惊人的速度和传输量收集数据；但从道德角度看，存在着同样惊人的隐忧。值得警惕的另一个问题是我们流入公司的数据是否只会用于提高我们的幸福感和生产力，如我在前一节所述。还是说这些数据会被用来对付我们？


    这在技术上是如何运作的，现在你可能已经很清楚了：通过简单循环不知疲倦的能力，我们可以从任何运行的代码中收集无限的信息流：


    ```

    ```

    for( t = 1; < 无结束条件 >; t = t+1 ) {

    <客户端设备向云端传输信息 >

    }

