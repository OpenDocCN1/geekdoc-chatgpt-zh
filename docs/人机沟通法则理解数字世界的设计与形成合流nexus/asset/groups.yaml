    计算的实体机器是繁杂的，但可以理解；当这种繁杂的机器像今天这样影响这么多人时，它的社会影响就会变得复杂。繁杂的情况最终是可解的，但复杂的情况完全不同——尽管我们仍然应该尝试去理解这些情况，因为这会影响我们自己乃至所有人类同胞。


    操纵数十亿比特，以每秒数百万周期的速度运行，一切都按照你的指令移动、执行、工作，没有抱怨或异议——这就是独裁控制的定义。因此，不难想象为什么几十年来一直在操控曾经规模难以想象（但现在对你来说可以想象）的庞大系统的程序员会开始觉得自己有点强大，并轻视身边那些不服从他们键入的命令的人。当我看到一些在赛博空间长大、技术熟练的人在网上做出失刻、恼人、无耻的行为时，我将其部分归咎于这样一个事实：编写代码极易让人飘飘然。所以，当我偶尔遇到技术最娴熟的人做出令人不适的行为时，我并不对此感到惊讶。请记住，编写代码是一项极具创造性的任务，本质上包括慷慨与他人分享各种技能——这么做不会让你成为坏人。但如果不小心，它肯定会改变你对周围世界的看法。


    的形状。在那之前，我一直认为铝是一种柔软的“二等”金属，但从那之后我学会了发自内心地尊重它的硬度。


    从艺术学校毕业后，我在领导别人的过程中也出现过类似的“顿悟时刻”。幸运的是，我在这个领域经历了多次不幸，这让我意识到自己对计算世界以外的事情知之甚少。作为一名工程师，我能够拆解和理解繁杂的机器，这一直是一项有用的技能。但后来作为艺术家，我懂得了欣赏谜题；作为领导者，我学会了与人合作的技巧：这些都是重要的平衡。因此，当我遇到已经成为领导者或艺术家的软件开发人员时，我会特别兴奋——他们就像我的家人。与此同时，我仍会时不时抽出几个小时来编写代码，以接近计算的世界，因为没有什么比在这无限的空间中工作并感受它的魔力更棒的事情了——也许这是一种心理治疗方式。如果哪天我偶遇你，你看到我像机器那样行事，请你试着将一只飞蛾送到我身边，这样我就有希望挣脱自己的循环。


    任何技术都有善恶两面。想想今天我们是如何把诺贝尔这个名字与和平联系在一起的，可我们却忘了阿尔弗雷德·诺贝尔（Alfred Nobel）发明了炸药，它比其他任何武器造成的战争死亡人数都要多。另一方面，炸药也让矿工能更容易、更安全地清理隧道。或者想想曼哈顿计划的科学家们，他们用自己的余生来权衡发明毁灭生命的核武器和使用核医学来拯救生命。今天，我们可以在科技行业看到类似的紧张局势：是通过互动视频让世界上任何人都有接受教育的机会，还是通过不断跟踪人们的行动轨迹来操纵他们的生活、影响他们的行为方式？


    我们可以利用自己的计算知识来构建有时具有复杂含义的繁杂系统。我们可以训练大脑来处理繁杂的部分，但我们的价值观需要推动处理复杂部分时遇到的问题。如果开发者和科技公司的工作像早期计算机时代那样只影响到几千人，也许我们可以简单地让那些懂得与计算机沟通的人待在他们的地下工作室或车库里。但现在，计算几乎影响了所有人，从每个人日常的微动作的超细精度到世界尺度。掌握与机器沟通的方法并践行人文主义，比以往任何时候都要紧迫。


    ## 计算机比我们更擅长合作


    如果你观察一台几十年前的个人计算机，你会发现它没有地方可以接入互联网。一开始你可能会想，它一定是使用了Wi-Fi或其他无线技术。实际上没有，那时的计算机大多是互不相连的孤岛。它们没有那么强大，也没有那么有用。但随着时间的推移，我们教会了它们如何连接键盘、打印机和鼠标，然后教会了它们如何通过“本地”——彼此靠近的网络相互连接。调制解调器的出现让它们可以通过电话线连接到距离很远的其他计算机上。这样一来，一台功能没那么强大的小计算机可以与一台功能更强大的大计算机交流，克服自身速度和内存的限制。这台小计算机可以变得和大计算机一样强大。


    20世纪80年代，我第一次在麻省理工学院体验到这种感觉，当时我坐在一位学长的宿舍里，他是计算机高手。他总是取笑我的Macintosh电脑是毫无价值的玩具，所以他想让我看看“真男人的电脑”能做什么。在一个无聊的晚上，我看着他熟练地从麻省理工学院的计算机跳到哥伦比亚大学的计算机，然后跳到斯坦福大学的计算机。我大吃一惊：我们正在马萨诸塞州的剑桥，但不知为何又同时出现在纽约和加利福尼亚州，这是多么奇怪的事情啊！我很快就学会了跳到世界上任何一个有计算机的地方的技巧——但是，请注意，那时候还没有那么多计算机可供访问。


    Quentin Stafford-Fraser, “The Life and Times of the First Web Cam,” Communications
    of the ACM 44, no. 7 (July 2001): 25-26, cl.cam.ac.uk/coffee/qsf/cacm200107.html.
    详见internetlivestats.com/total-number-of-websites/。


    在美国在线（AOL）的帮助下，跳到另一台计算机开始变得更简单，但直到万维网（WWW）的出现使互联网完全民主化，这才真正变得简单。万维网使计算机彼此相连，以人类能理解的方式轻松分享文件。从剑桥大学的一把咖啡壶的实时图像到一本名为《连线》（Wired）的小众杂志，人们很快就能在网上接触到各种鲜为人知的东西。1994年刚过一半，就出现了2,738个网站，到年底这个数字激增到1万。2019年，全球估计有超过10亿个网站，而且这个数字还在继续增长。假如有人想通过学习互联网上的一切知识来达到无所不知，他们需要极快的打字和点击技能才能访问全球10亿多个网站。当然，这是不可能的。但对计算机系统来说——你懂的，这并非不可能。


    这解释了谷歌为何能找到你在互联网上寻找的东西——它只是遍历了世界上所有网站，并将它找到的东西与你要找的东西进行比较。当然，人类不可能做到这一点，但它可以和编写以下代码一样简单：


    ```

    for ( website = 1; website <= all_the_websites; website = website+1 ) { < 访问这个网站中的所有网页，看有没有你想找的东西
    > }

    ```


    这是对实际发生的事情的过度简化，但是你可以从中看到运行计算的规模和速度是如何将大海捞针简化为一次只检查一根针的。对人类来说不可思议的事情——比如在全网搜索写得最好的关于“困惑的猫”的文章，在作为计算机代码运行时是相对简单的。让搜索快速运行是这一切的艺术和科学——这也是谷歌公司的价值如此之高的部分原因，但你应该明白其中的逻辑。因此，现在是扩展思维的好时机，我们可以对比访问互联网的个人、代表我们访问互联网的那台计算机与全世界彼此访问的所有计算机的处理能力。没错。如果全世界的所有计算机都在以计算的速度和规模彼此交流，那么就没有可比性了。


    英文俗语，指邻里之间关系好到可以互借东西的程度。编者注。


    网络上的计算机总是以我们的名义相互合作，也以它们自己的名义相互合作，因为拥有邻居是有价值的，你可以向他们借一碗糖。类似地，计算机总是在互相交流，因为当一台计算机不知道某件事时，另一台可能会知道。例如，当你让浏览器带你访问网站howtospeakmachine.com时，如果它不知道服务器在哪里，它会问另一台计算机；如果另一台计算机也不知道，它就会继续询问其他计算机，直到找到知道的那台。这些交流和交换发生的速度远远超过人与人之间打字沟通的速度——它们毫不拖延，毫无阻力。计算机总是寻求以理想的团队合作方式进行合作。


    小计算机总是要求大计算机帮它们做事，比如当你试图在你的移动设备或家庭助理设备上做事的时候。如果计算机没有足够的马力，那么它只需要将这件事情放到计算机网络中，我们现在笼统地称这个网络为“云”。重点是记住天空中不只有一朵云——大多数大型科技公司，如谷歌、亚马逊、苹果、阿里巴巴和微软，都拥有由数十万到数百万台计算机组成的云，这些计算机完全互联。这些云需要大量的电力，因此通常被安置在水电站或太阳能发电厂附近，坐落在毫不起眼、没有窗户的建筑物里，一排排计算机密密麻麻地被放置在机架上。有了云，你能访问的计算机的性能就不仅像摩尔定律描述的那样翻了一倍——每一台加入网络的计算机都使它的性能成倍地增加。


    想一想由许多机器组成的计算机网络——如果加上智能手机，就有数十亿台——是如何相互交谈和连接的。它们都可以单次、双次、在多个维度上运行循环，它们可以每秒互相发送数百万条信息（并请求帮助）。我们希望计算机在技能水平和能力层面无限增长，而云计算让我们做到了这一点。今天，我们身处这样一个时代：拿起任何数字设备，都像握住一台飘浮在云中的无限大的赛博机器的微小触手，而这台机器可以做出超自然的强大行为。一台毫无用处、多年来都被当作打字机替代品、不起眼地待在办公桌上的计算机，如今却成了通往云中数十亿其他计算机的大门。一旦接受了这一事实，云服务公司的力量将开始让你为它们带来的可能性而兴奋，也让你因它们的运营规模感到恐惧。


    Kevin McLaughlin, “Netflix, Long an AWS Customer, Tests Waters on Google Cloud,”
    The Information, April 17, 2018, theinformation.com/articles/netflix-long-an-aws-customer-tests-waters-on-google-cloud.


    例如，视频流媒体服务平台奈飞（Netflix）的计算能力的主要引擎是亚马逊云，因为对奈飞来说建造自己的云成本太高，而且在竞争激烈的市场中租用云的成本更低。对奈飞这样的公司来说，拥有自己的大规模计算基础设施是没有意义的，因为这不是他们目前需要掌握的专业技术。撇开成本和专业知识不谈，奈飞获得的核心优势是计算资源的流动可扩展性，以及能够通过减少或增加自身的需求去灵活满足消费者需求的能力。但是，当你注意到亚马逊控制了一半的云市场，而且可以随意改变价格时，你不难想到奈飞也会希望购买亚马逊的竞争对手谷歌的云服务作为保险。这也意味着世界上每一家云计算公司都在加班加点地使它们的计算服务器能够更好地协作，为客户提供更快的速度和更强大的功能。


    一家科技公司不需要建立在自己的计算设备之上，而是完全灵活地按需租用，这还是相对较新的现象。云计算的商业模型代表了创建公司方式的根本转变，其中所需的原材料都是空灵的、虚拟的、不可见的。但这并不意味着它是不可理解的——它只不过很繁杂。它是可知且可学的。在我们的内心深处，我们需要思考为整个机器族群提供服务，使它们之间能开展远比我们人类的合作更好的合作，在未来可能会产生什么影响。我知道我自己在这个问题上的不安让我下定决心，用余生来培养团队精神并与人类同事合作，因为我们的计算机兄弟正在以指数级别的速度击败我们。


    ## 第三章


    ### 机器是有生命的


    ### 判断一个物体有没有生命，曾经很简单


    在我初中一年级开始上生物课的第一天，我的老师费格罗亚夫人（Mrs. Figueroa）解释了生物学是如何研究生命的：当你看到一个物体“对刺激做出反应”时，你便能知道它是有生命的。


    看到一个物体在运动是判断其有生命的第一条线索。想想正在燃烧的蜡烛是多么令人着迷的场景，或者自己在镜子中的形象——起初，你不自觉地认为你看到的东西是有生命的，是与自己截然分离的。在黑暗的森林中移动的影子，平静的池塘中发生的微小变化，在安静的房间里从书架上掉落的书，都会引起我们的注意——我们要么把它们与有生命的物体联系起来，要么视其为对自然界的反应，要么认为它们是幽灵等超自然的事物。所有这些现象都与生物世界有某种关联：动物、自然、不死者。


    科学家瓦伦蒂诺·布雷滕伯格（Valentino Braitenberg）展示了人脑如何从一个由电子积木组成的简单机器人的世界中解读出类似生物的行为。这个世界里有马达和传感器，通过将它们以不同的方式组合在一起，会引发不同的类似生物的行为。例如，布雷滕伯格设想了一个简单的轮式机器人，它有一个驱动自己前进的马达和一个探测光线的传感器。这辆小车的程序是这样设计的：当光线照到它时，它就会移动，反之会停下来。它受到的光照越多，跑得越快；它受到的光照越少，跑得越慢。


    详见mitpress.mit.edu/books/vehicles。


    现在想象与其相反的设计：它受到的光照越多，跑得越慢；它受到的光照越少，跑得越快。这种车在最亮的环境中会完全停下来，但在漆黑的环境中会急匆匆地向前冲。如果这辆小车有你的拳头那么大，你可能会觉得这没什么特别的。然而，如果这辆小车只有1美分硬币那么大，你无疑会大喊：“一只蟑螂！”除了蟑螂，还有什么动物喜欢躲在黑暗和尘垢中，并且在白天基本不活动呢？布雷滕伯格继续用他的工具设计了类似生物行为的其他变体，以展示生物更复杂的特征，比如攻击性、爱和远见。他的愿景在一定程度上体现在小型吸尘机器人上，它们通过表现出某种智能的简单行为在地板上滑行。


    至于今天我们是否会完全被机器人愚弄，甚至在仔细观察之后还认为它可能真的有生命——好吧，我们还没走到那一步。但是，想想已故哲学家刘易斯·芒福德（Lewis Mumford）对电力技术（相当于20世纪初的互联网）的看法：


    Lewis Mumford, Technics and Civilization (New York: Harcourt, Brace and Company,
    1934), 435.


    无论现代科学技术离其潜在的可能性有多远，它们至少给人类上了一课：没什么是不可能的。


    虽然目前还没有出现栩栩如生的机器人，但人工智能是我们正在取得非凡进展的领域之一，这要归功于我们将在下一节谈到的各种进步。


    John Maeda, “Abstract,” How to Speak Machine (blog), April 13, 2019, howtospeakmachine.com/2019/04/13/us-patent-4058672-and-voice-prompting-1976/.


    想一想在智能手机和自动驾驶汽车出现之前就存在的技术：自动客服代表。它是20世纪80年代的每个人都再熟悉不过的无实体机器人。它是合成的生命形式，在电话的另一端告诉你：“如果想留言，请按1。如果想听目录，请按2。”就和一个活生生的人会做出的反应一样，如果听到有人按下按钮1，那么机器人就会对这一刺激做出反应，把你的选择转化为行为。任何在尝试使用数字键盘在迷宫般的选项里寻找方向时失去耐心的人都知道，人们很容易忘记自动电话线路会永不疲倦地把你导向错误的地方。如果你认为自己可以通过待在通话线路上数小时来激怒它，那么请你记住：在另一端运行的是一个无限循环。语音机器人对你最刺耳的愤怒语句无动于衷，因为它没有感情。它确实有全世界的时间一遍又一遍地重复自己。


    过去的交互技术很简单，缺少许多必要的组成部分，只能缓慢地响应我们的输入。因为我们粗略地将物体的反应速度与其“生命力”联系在一起，一只需要一秒以上才能停止运动的机器蟑螂就不会被认为是有生命的。如果电话另一端的声音需要几秒来回应最简单的请求，也会让人觉得不真实。过去，我们很容易觉得我们比我们使用的技术更高级，因为当时它太慢了——比如在20世纪90年代，你在早期的搜索引擎里输入内容后需要等一段时间才会看到结果。但现在搜索发生得如此之快，这是因为它可以预测你想要搜索的内容。现在，当你与计算机对话时，它的反应和其他人类一样快，结尾还带有“嗯”“哈”之类的语气词，以至它听起来几乎像……人类。


    Louis Liebenberg, “Persistence Hunting by Modern Hunter-Gatherers,” Current Anthropology,
    47.6 (2006): 1017–1026.


    过去，人们很容易认为计算机很笨，因为它做任何事情都要花很长时间。现在，我们认为计算机可能比我们更聪明。这是因为它对我们给它的刺激做出的反应是如此之快，这让它看起来不但有生命，而且非常聪明。因此，回想一下菲格罗亚夫人教给我们的生命之道：我们期待有生命的物体对我们的输入做出回应。再进一步，这个物体的反应越快，我们可能会认为它越聪明，因为它实在是太快了。如果它的耐力比我们强，我们就会开始感到有点担心和不安，因为，出于生存本能的原因，我们不喜欢被超越——尤其是被我们创造出来为我们服务的另一个物种超越。


    James Vincent, “Watch Jordan Peele Use AI to Make Barack Obama Deliver a PSA About
    Fake News,” The Verge, April 17, 2018, theverge.com/tldr/2018/4/17/17247334/ai-fake-news-video-barack-obama-jordan-peele-buzzfeed;
    Karen Hao, “Google’s AI Can Now Translate Your Speech While Keeping Your Voice,”
    MIT Technology Review, May 20, 2019, technologyreview.com/s/613559/google-ai-language-translation.


    循环的力量可以防止计算机在访问无限的云功能时感到疲倦，只有一个词可以描述这些无生命的伪生命形态：僵尸！这些无形的僵尸应该引起你的担忧，这主要有两个原因：（1）在与它们中的任何一个争论时，你都赢不了；（2）你会更难判断自己是否在与僵尸交流。如果你更愿意过理智平和的生活，那么前者对你而言很重要；如果你想与周围的事物建立一种公平的关系，那么后者对你来说很重要。还有比被今天已经在我们身边成倍增长的僵尸们愚弄更糟糕的事情，但最终，我猜你会更愿意成为那些能够区分人类和机器人的人，无论机器人变得多么栩栩如生——或者至少争取一个区分它们的机会。


    ### 仿生科学正在经历一场复兴


    在20世纪70年代研究计算机可能令人着迷的能力的先驱者约瑟夫·魏森鲍姆博士，碰巧是20世纪80年代我在麻省理工学院上过的一门人工智能课的教授。我还记得研究生助教们小声议论，说他赫赫有名，但当时我和其他普通的年轻学生一样，更关心如何在课堂上保持清醒。多年后我突然想起来，他就是20世纪60年代著名的Eliza程序——第一个模拟英语对话的计算机程序的发明者。它的模拟效果是如此真实，甚至成功地骗过了魏森鲍姆的学生们，让他们误以为自己正在和一个活人交谈。


    详见psychologytoday.com/us/therapy-types/person-centered-therapy。


    在这门课开始的前一年，我们曾在计算机科学入门课上编写过Eliza程序的一个版本——它确实令人寒毛直竖，但很酷。Eliza的核心是“以人为本疗法”（person-centered
    therapy）的一种简化模拟，它鼓励患者使用当时还比较原始的人工智能方法找到自己的解决方案。这涉及“符号计算”（Symbolic Computation），将一组单词和数字安排在一系列按顺序执行的if-then语句中。符号计算是“使用更多的字母而不是数字写代码”的时髦说法，它使程序更多地处理更高级的信息，更少地进行单纯的计算。Eliza程序“听”一个人输入的话，然后通过以下两种方式回复：（1）把输入的话以疑问句的形式重复一遍；（2）被某些关键词触发，生成一个模板答案。让我们把它想象成在代码在无限循环中被【拥抱】：


    ```

    forever {

    <将这句话中所有的“我”替换为“你”，然后在句前加上“你刚才说”，在句后加一个问号。>

    }

    ```


    会发生什么呢？如果你告诉计算机：“我今天过得很糟糕。”那么它就会回答：“你刚才说你今天过得很糟糕？”或者如果你说：“我要去商场。”那么它会回答：“你刚才说你要去商场？”是不是很酷？


    于是，我们学会了根据特定的关键词触发程序。让我们试着修改这个在无限循环中被拥抱的代码：

