    ## 第五章

    ## 机器可以被测量


    ### 遥测让你拥有某种心灵感应的能力


    我的桌上放着一串铁铃铛，这是我们家的豆腐店歇业时母亲送给我的。只需一枚弯曲的钉子就能把这些铃铛固定在门框顶部，这样当前门被打开时，你就能知道客人来了。日式门帘把前台和加工区隔开，因此你无法直接看见客人到来。尽管父母的豆腐店很小，但是工业机器研磨大豆的巨大噪声让我们几乎听不见其他声音。小铃铛尖锐的叮当声让我们拥有某种低科技水平的感知能力，让我们知道有人在前台。我桌上的这串铃铛有特殊的意义，因为即使在机械时代，它们也象征着遥测的力量。


    Wilfrid J. Mayo-Wells, “The Origins of Space Telemetry,” Technology and Culture
    4, no. 4 (December 1963): 499, researchgate.net/publication/269657057_The_Origins_of_Space_Telemetry.


    “遥测”（telemetry）这个词诞生于19世纪的法国，当时电信技术才刚出现。它描述了使用一种电子仪器将阿尔卑斯山最高峰勃朗峰的积雪深度传输到巴黎的过程。让遥测变得特别有价值的一个关键因素是用传感器代替了人，不再需要人亲自去另一端收集数据。传感器将自动读取数据，通过电路将其单向传输到一定范围内的基地。试着想象对19世纪末巴黎的科学家来说，拥有了解400英里外某个位置的积雪深度的能力是什么感觉。遥测技术给法国科学家带来的惊奇感，想必和刚出现的互联网带给我们的感觉一样。


    与勃朗峰上的传感器只能单向传输信息不同，互联网实现了高速双向通信——这是一个重要的区别。两个相距甚远的点之间的双向通信会不时出现错误，因为系统中总是存在某种缺陷：有问题的电线、发生故障的传感器，甚至会出错的操作员。当计算机在彼此之间快速通信时，它们需要询问：“你有收到消息吗？”不时地，另一台计算机会说：“没有收到。你能再发一遍吗？”如你所知，计算机是高速运行的，重复行为对它们来说完全不是问题，它们可以这样来回通信，直到得到正确的反馈，因为它们在不断互相确认。


    隐含在确认信号，或者说“握手”（handshake）这一概念中的，是设备明确地需要彼此交流。这是它们以100%的可靠性进行协调且不丢失任何数据的方式。这也意味着每台设备都可以监听和了解另一台设备在做什么，这样的能力是可靠通信的保障。


    “Good Design Is Good Business,” McKinsey & Company, October 2015, mckinsey.com/business-functions/organization/our-insights/good-design-is-good-business.


    因此，当你的计算设备连上网线或Wi-Fi后，它就开始从不同于按键和点击输入的输入源获取信息。一旦建立连接，你正在运行的软件——如果它具备测量能力——就可以将它想共享的信息发送给制造商。这是一种重要的能力，和飞机紧急迫降时飞行记录仪的重要性一样。例如，当你运行的某个应用程序崩溃时，软件开发者可以访问那些有价值的信息，以了解在程序崩溃前发生了什么。通过这种方式，他可以试着去修复软件，以免出现相同的问题。但这意味着你要告诉他问题出现之前你在用它做什么。


    当你的计算机崩溃时，软件公司可以了解你可能不想分享的事情，这听起来可能让人有点担忧。然而，事实是一旦启用网络连接，你在计算机上做的任何事情都可能被分享给世界上任何人。尤其是当你通过网络浏览器运行一个主要基于云的系统时——在这种情况下，你在一个会话中所做的一切都可以100%地被传输到远程服务器上。一旦一款产品被传送到云端并且你开始在你的机器上使用它，软件公司就可以观察你是如何使用它的，以便为还不完整的设计提供改进信息。你在线上使用的大多数应用程序或服务（无论是播放音乐还是编辑共享文件）都以这种方式运行，并且在观察你在做什么。这种能力让软件公司拥有某种程度的心灵感应能力，可以了解客户如何使用它们的产品。一旦意识到这种事情正在发生，你自然会问自己：我怎样才能关掉它？


    可是，如果没有这种潜在的双向连接，我们就不可能享受到传统互联网的好处——你没有办法关掉它。这就是软件系统网络的本质：它们都与你的计算机之外的某个系统有明确的连接。你的每一个行为都可以通过仪器和遥测传回云端的大本营。因此，与其像弹窗调查那样明确地要求你就某事回答一个问题，不如简单地监控你的行为，推断你可能要做什么。如果你在某张图片上停留的时间比其他图片长，那么这可能意味着你对它感兴趣。或者如果你输入了一些东西，然后转过身去，留下不完整的字段，那么这可能表明你犹豫了。所以，即使你没有明确地传达任何内容，你的一系列行为也可以被整合成一个推理，就像侦探试图在犯罪现场拼凑线索的过程。


    Sarah Gordon and Aliya Ram, “Information Wars: How Europe Became the World’s Data
    Police,” Financial Times, May 20, 2018, ft.com/content/1aa9b0fa-5786-11e8-bdb7-f6677d2e1ce8.


    如你所想或者在新闻中所读的那样，根据用户的在线行为和数据来获取他们的想法和行为可能具有侵略性。令人惊讶的是，在2018年欧盟发布《通用数据保护条例》（General
    Data Protection Regulation，简称GDPR）之前，科技公司收集、处理和与第三方分享数据几乎没有遇到障碍——用户对这一切都毫不知情。


    在撰写本书时，美国还没有类似的消费者层面的立法，因此对公司如何处理你的信息的限制较少。一般来说，当我们同意那些告知我们服务条款已变更的冗长法律条文时，我们通常放弃了有关自己访问或创造的信息的所有权的权利。当你想到这不仅是软件公司的一两名开发人员手动分析你的每一个行为，而是从不休息或休假的计算系统试图以极微小的细节和极精确的程度深入了解你的一切时，这就更令你担忧了。


    因此，如果心灵感应是一种超能力，也许我们需要看看蜘蛛侠的创作者，已故的斯坦·李（Stan Lee）定义的超级英雄准则：“能力越大，责任越大。”这种责任正在成为科技公司关注的重点，也许它也是你还在读本书的原因。用计算机创造产品的方法强大且危险——任何人都不应该对此感到惊讶，因为力量和危险是并存的。但是后一个问题经常被忽视，因为今天的技术领袖们常常被贴上“傲慢”的标签。然而，与其说是傲慢，我认为它更像一种受保护的特权，来自太多的“非现实生活”（NIRL）时间和不够多的“现实生活”（IRL）时间。我自己就生活在强大的计算系统组成的NIRL宇宙中，这些系统操纵着数十亿的数字，我知道它会对一个人的自我产生影响。当谈论伦理问题时，将年轻人的勇气、随之而来的天真与计算的力量结合，你将得到意想不到的结果。因此，随着你与机器之间的沟通越来越流畅，随着你学会接受心灵感应的天赋，请注意不断扩大自身的影响范围，始终关注你的决定对现实世界的影响。天知道我有多少次通过远离客户的问题和跟自己想法相似的人在一起来让自己感到舒适。加上计算机心灵感应令人陶醉的力量让你相信自己可以了解任何人的一切，有意识地采取更高的道德标准的需要就成了能与机器沟通的每一个人的责任。

