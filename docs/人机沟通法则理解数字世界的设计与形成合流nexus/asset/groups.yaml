    将渗透到我们的现代生活的方方面面的计算世界归咎于科技行业是合乎逻辑的。但这不光是他们的错——这也是你的错，因为你对世界上扎克伯格之类能熟练与机器沟通的人已经理解多时的事情一无所知。如果计算是我们都能在物质世界中看到并感受到的东西，那么我们也许早就习惯了新的限速标志、测速器等。想想看，第一辆速度突破60英里每小时的汽车是一辆鱼雷形状的电动汽车，名为“永不满足”（La
    Jamais Contente），由比利时工程师发明，并于1899年在法国进行了测试。如果“永不满足”按照摩尔定律的标准进化，那么到1925年它就会突破光速。毫无疑问，如果我们在1910年注意到比利时人或法国人在地球表面超声速飞驰，那么一定会有人对此采取行动。在计算领域，这些悄然发生的变化在很长一段时间内都不为人所知，以至于我们直到今天才注意到它对政治、媒体和商业的影响。


