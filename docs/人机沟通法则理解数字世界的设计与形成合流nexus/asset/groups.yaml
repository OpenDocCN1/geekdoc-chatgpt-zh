    的人。过去，通过编写计算机程序来解决一个复杂的问题可能需要几个月或几年的时间。而现在，只需输入过去的数据，机器智能就可以迅速生成一台等效的计算机器，并根据这些数据对过去的行为进行建模。


    将过去的结果自动化可以立即发生，而且人为干预越来越少。因此，与其想象我们产生的所有数据在谷歌某个巨大房间里被打印出来，有20名员工跑来跑去，试图交叉引用所有这些信息，不如想想机器如何循环运转，变得更大，如何具有生命。这种计算能力的合理结果——数以亿计的机器僵尸大军正在崛起——将不知疲倦地吸收我们产生的所有信息，指数级提高复制我们的能力。人工智能做坏事时不应该受到指责。我们才是它们为我们服务时所做的一切事情背后的罪魁祸首。


    Adam D. I. Kramer, Jamie E. Guillory, and Jeffrey T.Hancock,

    "Experimental Evidence of Massive-Scale Emotional Contagion

    Through Social Networks," PNAS, June 17, 2014,

    pnas.org/content/111/24/8788.

    "Blue Feed, Red Feed," The Wall Street Journal,

    graphics.wsj.com/blue-feed-red-feed.


    随着像脸书这样的系统开始具有改变个人行为的能力，我们正在接近我们该如何与计算系统共存的关键时刻。如果我们把自己暴露在被设定为性别歧视、厌恶女性、厌恶同性恋、种族主义等的技术面前，我们不应该在看到像《华尔街日报》（The
    Wall Street Journal）的“蓝信息流，红信息流”这样的东西时感到惊讶，它展示了脸书将你标记为自由派或保守派时你分别会看到什么。你看到的是今天你很容易成为的人。试着看看坐在你旁边的陌生人的信息，你会发现他们的网络现实可能与你的截然不同。这是因为今天我们看到的是我们自己“想要的”新闻——我们通过确认我们眼中的真相得到愉悦的刺激，这样可以证明自己有多聪明：我有《每日一我》，你有《每日一你》。然后，当我们偶尔遇到“反对的观点”时，我们别无他法，只能假设对方的观点与自己的观点相比是无知的。与此同时，机器持续向我们提供这些信息，因为是我们给它们设定了这样做的程序。它们在观察我们对收到的信息的积极或消极反应，并反过来学习人类个体善与恶的极限。


    但是，制造对人类经验有更广泛理解的计算机器还不算太晚。我们可以通过更好地了解我们自己来轻松开始这个过程——就在我深入挖掘“包容性设计”的世界时，这段旅程正在我的脚下展开。这种利用多样性的方法是制造更好产品的关键。我很尴尬地承认一开始我并不完全理解为什么这个领域让我如此感兴趣，但后来我意识到这是因为我嗅到了一丝信号。计算设计的兴起及其带来的不可思议的商业价值，也以某种处于这一切中心的个人和公司都无法立即意识到的方式造成了失衡。工业酵母人工智能没有气味的事实让我感到非常困扰。


    John Maeda, “Design in Tech Report 2017,” SXSW, March 11, 2017, designintech.report/wp-content/uploads/2017/03/dit-2017-1-0-7-compressed.pdf.


    幸运的是，有些变化正在包容性设计专家凯特·霍姆斯（Kat Holmes）的带领下发生，她在微软工作时构思的想法正通过她于2018年出版的《误配：包容如何改变设计》（Mismatch:
    How Inclusion Shapes Design）传遍世界。在这本书出版的前一年，我第一次接触到她的作品，并在刚起步的“设计技术报告”中进行了介绍。现在，她在谷歌领导用户体验设计，准备以我很希望变成现实的方式重塑云计算。霍姆斯关于解决失衡问题的三条设计原则简单到可以付诸实践，但也深刻到需要用一生去熟练掌握：


    - 1. “能识别排斥性的存在。”要有意识地注意到一个人或一群人遭到排斥的情况。在这样做的时候，你需要有意识地进入不舒服的境况，但想想那些被排斥的人早就感到不舒服了，你就会觉得这是一件简单的事情。

    - 2. “向人类多样性学习。”深入收集厚数据，走进与你的文化不同的社区和文化。这意味着你需要离开安全舒适的家或工作场所，将自己置于危险或不适之中——这在一开始是很难做到的，但你的投资回报率会很高。


    Kat Holmes, Mismatch: How Inclusion Shapes Design (Cambridge, MA: MIT Press, 2018).


    - 3. “从解决一个小问题出发，扩展到解决大规模发生的问题。”制订打破偏见并帮你找到新市场的解决方案。创新是实现增长的关键，创新就是将新的视角引入现有问题，当引入只有通过不同视角才能看到的全新问题时，创新会更有成效。


    凯特·霍姆斯的框架有助于打乱我们倾向于排斥的天生偏见，凭借的是集中、专注和深化我们想要为自己设计的解决方案的积极意图。任何让我们感觉舒服的东西都会充满偏见。因为计算是由技术人员搭建的，我们可以预测它会充满技术人员的偏见。计算并不是唯一充满偏见的媒介。在数码相机出现之前有化学摄影技术——这种技术被调为浅肤色专用。或者想一想：如果你让设计圣殿的一个信徒列举十位包豪斯大师的名字，他肯定会列举十位男性——尽管包豪斯学派中一半是男性，一半是女性。或者看看女性导演的电影数量，看看《财富》500强公司的首席执行官中有多少人是女性或明显的“非白人”。计算有什么不同？你知道答案——它并不完整。我们可以重塑它。我们可以改进它。我们只是需要马上开始。


    ## 开源是通过计算设计公平的一种手段


    凯特·霍姆斯经常指出“排斥”（exclude）这个词的起源：它源自拉丁语excludere，其中ex意为“出去”，claudere意为“关闭”。在人类世界里，这意味着将一群人拒之门外，可除了这群人之外的所有人都可以进入这个特殊的俱乐部。我们很难用更积极的方式来解读排斥，因为它的本质是不公平的——如果你曾经感到被排斥或被“拒之门外”，你就会理解这一点。但从商业的角度来看，排斥是完全可以理解的，因为在竞争激烈的时候，拥有“不公平的优势”被认为是制胜武器。拥有竞争对手没有的东西，会激励你把他们拒之门外，并采取计算世界中所谓的“封闭”方法。


    Tripp Mickle, “Apple TV on a Samsung? iPhone Giant Makes Risky Jump to Other Devices
    to Sell Services,” The Wall Street Journal, March 26, 2019, wsj.com/articles/apple-tv-on-a-samsung-iphone-giant-makes-risky-jump-to-other-devices-to-sell-services-11553629788.


    制造封闭系统在工业中是一种常见做法，因为一旦成功，它就能提供可以实现完全控制的宝贵能力。在1984年推出第一台Macintosh计算机时，苹果公司采用了著名的封闭式计算系统，它不像当时的竞争对手Wintel
    PC那样易于扩展。因此，苹果能够以其他计算机品牌无法做到的方式无死角地控制用户体验。这种封闭系统的策略后来在苹果推出iPhone时再次发挥作用，剩下的事情尽人皆知。与此同时，一个名为安卓（Android）的新兴移动操作系统项目选择了一条不寻常的道路，将它所有的计算机代码（“源代码”）公开。如今，搭载安卓系统的设备比搭载苹果操作系统的设备多。到2019年，苹果公司做法的效力开始减弱，该公司正被迫参与自己的封闭世界之外的世界。它不公平的优势正在消失吗？


    “开源”（Open Source）是任何人都可以出于自己的目的进行修改的开放计算机代码的官方术语。它与“拒之门外”相对立——相反，它接纳任何人和所有人。著名的开源项目包括Linux操作系统（安卓系统就是在此基础上建立的）、火狐浏览器（一款流行的网络浏览器）、WordPress（全世界超过三分之一的网络流量的网站管理系统）和PHP（支持WordPress的流行计算机语言）。


    Christine Peterson, “How I Coined the Term ‘Open Source,’ ” Opensource.com, February
    1, 2018,


    “开源软件”这个词由克里斯汀·彼得森（Christine Peterson）在1998年创造，她的目的是更好地体现其内在的社群价值观，与当时意味着较低质量的流行术语“免费软件”相对。通过我在Automattic的工作，我有机会直接接触WordPress社群，我在一生中从来没有遇到过如此热情、包容、来自世界各地的一群人。随着时间的推移，我逐渐意识到PHP在WordPress社群中代表着“人与人之间互相帮助”（People
    Helping People），因为每个本地社群都欢迎任何想学习计算的人，而作为贡献者参与其中不需要任何附加条件或费用。在开源中，软件不仅仅是代码，还是社群。


    相比之下，“闭源软件”是大多数你每天都用的应用程序和服务。你永远无法检查编程代码到底在做什么，就算你想让它以不同的方式工作，你也不可能对软件本身进行修改。这包括脸书的应用程序，以及你的手机、台式电脑和网络上运行的大多数东西。不过，即使你可以访问所有应用程序的源代码，这也不代表你能即刻理解其中的内容。对像WordPress这样复杂的开源系统来说也是如此。但是，事实是脸书的应用程序让你失去了窥探内幕的机会，而如果你想更改程序的任何方面，WordPress在源代码级别上是完全包容的。


    > Olga Kozar, “Towards Better Group Work: Seeing the Difference Between Cooperation
    and Collaboration,” English Teaching Forum 48, no. 2 (2010): 16–23, americanenglish.state.gov/files/ae/resource_files/48_2-etf-towards-better-group-work-seeing-the-difference-between-cooperation-and-collaboration.pdf.


    思考闭源和开源之间的区别的另一种方法，是考虑“合作”和“协作”之间的差异。合作是指与另一方保持一定距离，而协作是指手挽手拥抱彼此。协作相比合作的优势在于，各方都做出了不同程度的妥协，共同努力，互利共赢。在缺乏协作能力的情况下，今天的政府控制科技圣殿的唯一方法就是试图对其进行监管。有趣的是，如果科技圣殿的所有软件都是完全开源的，那么政府就没有必要采取目前的行动来对付它们。为什么？因为这样我们可以检查源代码是否违反了今天我们所有人都关心的议题，比如了解他们正在用他们收集的关于我们的数据做什么。当没有不透明的墙把其他人拒之门外时，作恶就更不容易了。开放系统方案是政府监管的另一种选择，因此我希望当像你这样能与机器沟通的政治家当选时，我们会更经常地看到这种方案。也许是时候让你去参加竞选了？我在此为你公开一个“开放”的竞选口号：“开放促进公平，自然而然。”


    开源有一个缺点：在任何地方都无法保存秘密。在一个人人都寻求协作和不作恶的世界里，完全透明可能意味着“分享就是爱”和持久的和谐。然而，总有一些坏人想方设法地操纵局势，使之对自己有利，个中原因只能解释为人性。因此，开源也并不总是正确的选择。例如，你永远不会发布可以轻松访问自己所有财务信息的个人电子银行系统的源代码。如果分享行为能让其他人为自己开发类似的系统，那么开放源代码的做法可能值得称赞，但可以肯定的是，如果你的源代码里包含敏感信息（比如银行账号和密码），那么你所有的钱很快就会消失。或者，如果脸书的算法都是开源的，那么不怀好意的一方就可以重写时间线代码，轻松操纵你的时间线。当然，总有一些竞争优势可以证明为什么一个企业想要保持其代码的私密性：保持他们相对竞争对手的不公平优势。


    - “Microsoft to Acquire Github for $7.5 Billion,” Microsoft, June 4, 2018, news.microsoft.com/2018/06/04/microsoft-to-acquire-github-for-7-5-billion.

    - Tom Warren, “Microsoft Is Building Its Own Chrome Browser to Replace Edge,”
    The Verge, December 4, 2018, theverge.com/2018/12/4/18125238/microsoft-chrome-browser-windows-10-edge-chromium.

    - Clint Ecker, “Apple Opens WebKit CVS Repository,” Ars Technica, June 7, 2005,
    arstechnica.com/gadgets/2005/06/470.


    尽管如此，企业正在意识到开源的价值。微软收购了世界上最大的开源软件开发社区GitHub，此举震惊了全世界。要理解这一收购的规模，你只需要向你的程序员朋友打听一下——有些人甚至可能不知道微软收购了GitHub，因为微软选择不改变也不重塑它目前的运作方式。除了安卓系统，谷歌的另一个开源例子是Chrome网络浏览器，它在一个开源引擎上运行。现在，任何人都可以在其基础上制作网络浏览器——甚至微软也宣布将改用Chrome的引擎。与此相关的是，苹果的网络浏览器Safari是一个开放/封闭混合系统：它与谷歌的开源引擎有相同的血统，但代码的其余部分不对公众开放。在你的产品中使用开源内容时，一定要检查授权条款——有些条款允许你不受任何限制地使用代码，而另一些则要求你在使用他们的代码时公开分享你写的那一部分代码。前者通常被称为“麻省理工学院授权条款”，它能给你很大的自由；后者是“GNU通用公众授权条款”，它能给予他人很多自由。


    - Sandra Wachter, Brent Mittelstadt, and Chris Russell, “Counterfactual Explanations
    Without Opening the Black Box: Automated Decisions and the GDPR,” Harvard Journal
    of Law & Technology 31, no. 2 (2018), papers.ssrn.com/sol3/papers.cfm?abstract_id=3063289.

    - Yury Makdonov, “Improved Testing of AI Systems with ‘Grey-Box’ Testing Technique,”
    STARCANDA Conference, October 17, 2018, starcanada.techwell.com/program/concurrent-sessions/improve-testing-ai-systems-grey-box-testing-technique-starcanada-2018.

    - Kevin Hartnett and Quanta, “How a Pioneer of Machine Learning Became One of
    Its Sharpest Critics,” The Atlantic, May 19, 2018, theatlantic.com/technology/archive/2018/05/machine-learning-is-stuck-on-asking-why/560675.


    让我们不要忘记另一种编程，它与可共享的计算机代码关系不大——我想说的是工业酵母人工智能编程。较新的机器智能系统不是由可读的计算机代码组成的，而是被包装成含有数字和数据的不透明的黑匣子，没有清晰的逻辑流程。我们一直担心这些方法过于复杂，以至于我们并不清楚它们是如何工作的——它们本质上就是一堆原始数字，因此人类无法读懂它们。这些系统严格的封闭性——它们的偏见基于投喂给它们的训练数据——触发了需要解决其内在不透明性的警报。现在出现了新的计算方法来检查这些不透明的人工智能，使它们表现得更像“灰匣子”，以便我们更深入地了解它们的工作原理。就算我们无法弄清楚它们是如何工作的，也有人在努力让人工智能开始质疑为什么它们被告知要做某事，这样它们就可能建立一种相当于道德意识的东西。我们应该期待并要求在理解人工智能和向人工智能传授道德伦理方面更多的努力，而不是一味引导机器永无止境地循环下去直到成功。


    老实说，随着人工智能正在成为大众媒体越来越多地谈论的话题，人们很容易对它感到恐惧。我们很快会听到这样的新闻：一台清洁机器人拒绝听从你的命令，一个由应用程序启动的起搏器敲诈你，或者一个网络犯罪集团用一个你无法控制的机器人取代了你的互联网分身——尽管这一切还没有发生，但基于现有的技术这一切完全是可以实现的。如果这样的灾难真的发生了，要记住计算目前只是这两种东西之一——可读的源代码或充满数字的黑匣子，就像天然酵母或工业酵母。两者都是由人类制造的，就好像if-then逻辑语句或由数据驱动的黑匣子，它们要么是公开分享的，要么隐藏在封闭的门后。


    当它们是开放技术时，我们就有机会一起分享、协作和学习。而当我们与开源代码的联合创作者有相似的价值观时，我们对技术的恐惧就会减少。如果你加入了一个开源社群，你会受到其中所有人的影响，觉得自己有责任做正确的事情。大多数社群不要求你是专业的计算机程序员，即使是最初级的“能和机器沟通的人”也非常受欢迎。如果你想加入众多的开源社群之一去提高与机器沟通的能力，我在howtospeakmachine.com上整理了一份清单。为什么你要参与其中？因为开放促进公平，自然而然。


    ## 关心人类


    2015年12月6日凌晨四点刚过，我在帕洛阿尔托的埃尔卡米诺大道上慢跑。对我来说，这不过是又一次晨跑——不太冷，也不太热，干燥，安全，沿着我熟悉的路线进行。当时我在想早上六点跑步结束后要打的电话。路上没有汽车，但当我穿过一条六车道公路上的人行横道时，信号灯开始闪烁，于是我加快了速度。公路的对面和往常一样漆黑一片。在红灯亮起之前，我穿过了街道，这让我有种胜利的感觉。就在此时，我的右脚踩到了人行道的边缘。


    于是我被绊倒了。


    我摔在人行道上，脸、胳膊和膝盖悉数着地，我的脑袋嗡嗡作响。四周仍然很安静，天还很黑，没有其他人。我用左手摸了摸脸，感觉是湿的，我很快就猜到自己在流血。我的右手不能活动，我很快意识到右肘出了问题，因为它伸不直。我感觉我的手肘有点像小块的乐高积木。我被吓到了。


    几辆车匆匆驶过。我穿着一件创业公司的黑色文化衫，没有带手机、钱包和身份证件，只戴了新买的苹果手表来测步数……但它是第一代，还无法替我求救。我开始因震惊而发抖。我知道此刻我需要回到爱彼迎的住处——大约在十个加利福尼亚街区之外。街上没有其他人。我也觉得没有人会帮助我，因为我穿着一件深色的连帽衫，脸上在流血，说实话……哪个匆忙的上班族会愿意停下来帮助这个刚从恐怖片中走出来的生物呢？当我抬头望向黑暗的天空时，我感到一种奇怪的轻松，因为我意识到自己是多么微不足道——我只是星球表面的一个随机生物，并不比任何人更重要。这是一种奇妙的谦卑感。我在痛苦中感觉很平静。


    我在麻省理工学院受过训练的工程师脑袋忽然灵光一现。不知怎的，我把自己想象成了一台火星自动探测器，我有几个零件坏了，需要回到基地进行维修。工程师们很清楚这些设备配备了许多冗余系统以防任何系统出现故障。因此，我想象一定有某种方法可以让自己回到爱彼迎的住处。这种“成为机器”的心理意象帮助我完全忘记了疼痛。肾上腺素可能也起了作用。


    我很快意识到自己走了不几步就会晕倒，所以我干脆站起来，走几步然后躺回到地上。我以这种方式前进。当我开始离开埃尔卡米诺大道宽阔的混凝土弯道时，把脸贴在邻居家草坪上的那种柔软、放松的感觉让我有动力继续前进。

    '
  merge: 1
- raw:
  - '[PAGE 148]


    幸运的是，我回到了爱彼迎的住处，拿起手机给我的助手打了个电话，找到了最近的医院的地址，试图清理一些血迹，然后叫了辆优步。当我在凌晨五点半左右到达急诊室时，有人递给我一块写字板和一支铅笔。我右臂骨折了，而我是个右撇子，但我很快就试着用左手努力适应，以二年级学生的笔迹填写了表格。


    我在一间治疗室里焦急地等了大约一个小时，一心想想医生。终于，一个长得像医生的人走了进来，看着我被撕裂的脸、破裂的门牙和上唇。他说：“你看起来很糟糕！”看到他对病人是如此态度，我觉得他不可能是医生，但也不敢确定。他接着说：“你能动一下脖子吗？”我照做了。他带着严肃的表情，感叹道：“你很幸运！”那一刻，我立刻感到如释重负。我赞同地说：“我很幸运！”我心想，如果脖子不能动，那该有多糟糕——我可能会被困在人行道上无法行走。那样我就会变成一台完全坏掉的机器。我非常感激这一切。然后他给我的脸缝了针。


    半小时后，一名护士走了进来，他看着我，问道：“发生了什么事？”


    我回答：“我在慢跑的时候被绊倒了。”


    他用一种严肃、责备的语气说：“锻炼对你没有好处。你难道不知道吗？”


    我试着微笑，但缝合后的麻醉让我笑不出来。


    他接着问：“你当时是穿了荧光背心还是带了盏灯？”


    我回答：“都没有。”


    “你很可能被车撞啊！”


    当我想到这一点时，又一阵喜悦闪过。是的，我真的很可能会被车撞。两年来，我一直穿着全黑的衣服在黑暗的清晨慢跑——事后看来这似乎很愚蠢。由于自己的粗心大意，我可以很容易地想象自己被硒谷那些常见、快速（而且无声）的电动车撞倒。想到这，我感到更加欣慰！


    第二天，当我被推入手术室，麻醉刚开始起作用时，我顿悟了。就在我开始看到粉红暮色送我进入梦乡时，我猛地意识到计算时代需要着手解决技术和人类之间的失衡问题。


    尽管我的康复之路涉及了大量技术，但正是我宗教般的觉醒时刻促使我仔细关注我身边的所有人。因此，我没有对正在修复自己的最新技术感到惊讶，而是观察了许多与机器一起工作的富有同情心的人类。医生、护士、技师、接待员、手术后照顾我的爱彼迎房东贝蒂和本尼、清洁工、餐饮服务人员、帮助我把卷筒包搬到头顶的行李架上的空乘人员，以及一大批最终让我重返工作岗位的与机器无关的人员。我'
  - '[PAGE 149]


    也意识到了那些间接影响了我的人，比如所有我从未见过的工程、设计和产品人员，以及所有运送了用来修复我的机器（和零件）的隐形团队。我的康复前前后后花了10个月的时间，绝对不是以摩尔速度进行的。但我愿意再来一次，因为这段旅程是绝对值得的。


    认识到自己的人性，同时也认识到他人的人性，是科技无法给予你的礼物。我不希望任何人生病，然而每当有人问我为什么这么在乎包容时，我就建议他们试试打碎自己的一块骨头。他们的回答通常是礼貌的“不了，谢谢”。然而，我还是会坚持让他们这样做，因为这使我充分认识到自己被赋予和赢得的特权。在我的康复过程中，我常常感到一种压倒般的幸运：能出生在这样一个家庭，父母牺牲了他们的一切，为了让我能够去像麻省理工学院这样特殊的地方学习我需要知道的关于机器的一切。他们从未有过像我这样拥有特殊社会地位的人能够享有的医疗保障——找到这种感激之情，以及随之而来的对我们身边人和使我们能够成为现在的模样的那些人的责任感，是我牢记在心的使命。


    我猜这是我想留给你们的最后一个想法，因为现在你知道了如何与机器沟通，你要带着新获得的语言技能出发了。作为一个计算思考者，永远不要忘记：关心人类。我们是开创了计算时代的人。我们正在努力理解这对今天不完整且可测量的计算产品和服务来说意味着什么。如今，我们比以往任何时候都更需要包容性地思考和工作，以便直接着手解决那些如果我们不去有意识地开辟新路径，就会自动化的失衡问题。


    这一切都回到了合作和协作的区别上：


    | 合作 | 协作 |

    |---|---|

    | 独立地工作 | 互相扶持地工作 |


    合作比协作更容易，因为合作不需要深入了解对方。在计算机发展的大部分阶段，大多数人一直在学习如何应对不知何故在不断变化的机器并与之合作。与此同时，在硅谷之类的地方，相对较少的计算思考者却一直在以摩尔速度与潜伏在云中的全知者协作。我们不得不相信他们都能代表全体人类进行良好的协作。也许在读完本书之前，你无法轻松与计算机协作，或者直接与它们的人类协作者共事。这是可以理解的，因为你还没有花时间去参观它们无形的宇宙，了解它们的历史、习俗和规范。你完全不懂机器的语言。但现在你懂了，哪怕只懂了“一比特”。


    我们的机器循环运行。我们的机器在无限大和无限小的尺度上运行。我们的机器是有生命的。我们的机器是不完整且不完美的，和我们一样。我们的机器被测量的次数越来越多，并且知道我们在做什么。'
  - '[PAGE 150]


    我们的机器在我们的监督下在全世界范围内让失衡自动化。关注机器。关心人类。让我们出发吧。'
  - '[PAGE 151]


    # 致谢


    本书献给我的父母，伊琳娜·前田佑美和前田洋次。如果没有他们设法攒够钱给我买一台计算机，我就永远不会有机会像现在的我这样了解它。


    编辑尼基·帕帕多普洛斯（Niki Papadopoulos）给了我写这本书的许可和鼓励——对此我深表感谢。尼基为我提供了心理上的安全空间，让我可以充分探索你在本书中读到的想法。雷夫·萨加林（Rafe
    Sagalyn）的远见卓识始终伴我左右，劳拉·帕克（Laura Parker）是我一路走来的写作导师。丽贝卡·肖恩塔尔（Rebecca Shoenthal）与Portfolio出版公司的工作人员一起，满怀热忱地把整个项目推进到终点。我很感谢整个团队，他们把这本书以你现在读到的形式呈现给你。我要特别感谢本书的技术审稿人：凯文·白求恩（Kevin
    Bethune）、特雷西·周（Tracy Chou）、马丁·埃里克森（Martin Eriksson）、亚历克西斯·劳埃德（Alexis Lloyd）、罗谢尔·金（Rochelle
    King）和特蕾莎·奥斯汀（Theresa Austin）。他们都帮我找到了我散落在手稿中的许多错误。


    在我以人文主义者的身份理解计算的道路上，有些人的想法和鼓励对我影响深远。他们都是我在麻省理工学院的时候遇到的英雄，在很多情况下，我因有他们作为导师而感到幸运。我不知道你们是不是也有这样的感觉：随着年龄的增长，你曾经仰慕的人似乎都消失了，比如穆里尔·库珀（Muriel
    Cooper）、保罗·兰德（Paul Rand）、田中一光（Ikko Tanaka）、威廉·J.米切尔、罗伯特·西尔贝（Robert Silbey）、雷德·伯恩斯（Red
    Burns）、查尔斯·M. 维斯特、惠特曼·理查兹（Whitman Richards）、片冈满（Mits Kataoka），以及我在20世纪80年代的麻省理工学院遇到的人工智能教授和前同事帕特里克·亨利·温斯顿（Patrick
    Henry Winston）。我感到幸运的是在他们还活着的时候我就接触到了他们的思维方式，因为只要知道了新鲜面包和隔夜面包之间的差别，你就很难满足于新鲜出炉的面包之外的任何面包了。


    从我的系统中清除了计算错误（以及一堆错误）之后，我的兴趣便转向了另一个让我着迷的领域：组织及其如何转型，或者如何不转型。鉴于摩尔定律持续对我们的世界产生加倍的影响，组织开始变革是明智之举。并且要快。并且最好是以指数级速度。我对这一问题的看法受到了雷吉娜·杜根、雨果·萨拉辛（Hugo
    Sarrazin）、艾薇·罗斯（Ivy Ross）、杰森·弗里德（Jason Fried）、金·斯科特（Kim Scott）、斯科特·贝尔斯基（Scott
    Belsky）、贝丝·康斯托克（Beth Comstock）、贝基·贝尔蒙特（Becky Bermont）、凯特·诺恩（Cat Noone）、哈吉·弗莱明（Hajj
    Flemings）、玛丽亚·朱迪斯（Maria Giudice）、大卫·格兰杰（David Granger）、玛丽娜·米哈拉基斯（Marina'
  - '[PAGE 152]


    Mihalakis）、洗班莲和洗振文（Betty and Benny Xian）、乔治亚·弗朗西斯·金（Georgia Frances King）、凯瑟琳·施瓦布（Katharine
    Schwab）等人的影响。当我打出这份名单时，我意识到了它是不完整的，所以很自然地，我应该在本书的网站howtospeakmachine.com上对这份名单进行迭代。


    最后，我要感谢本·一之濑（Ben Ichinose, 1929-2019）。作为一个陌生人，他在《简单法则》出版后不久给我打了电话，想让我去看看他家的后院。作为一名退休的牙齿矫正医生，他花了几年时间手工打造了一个传统的日式花园，以体现他的简单法则。在他的多次来电和我的一再拒绝之后，我还是去看了他家的后院。他戴着标志性的飞行员墨镜，开了一瓶1966年的葡萄酒向我敬酒，同时切开一块新鲜的面包。如果说我这辈子遇到的人中有谁体现了计算的奇特魅力，那一定是本。'
  - '[PAGE 153]


    # 译后记


    前田约翰作为曾经的麻省理工学院终身教授、罗德岛设计学院第16任校长，从出席美国国会推动STEAM教育系统改革到担任微软的设计与人工智能副主席，他花了6年时间身处硅谷最前线探索总结而写成本书，与2006年出版的被翻译成14种语言的《简单法则》整整相隔13年。这位人工智能先驱会给我们带来哪些全新的观点？


    > “对很多不懂如何与机器沟通的人来说，我们正在以一种完全不公平的方式接近奇点。”


    人类已经不可避免地迈入了人工智能时代，试想如果有这么多大多数人不理解的东西正在支配世界，却只有极少数技术人员能完全理解它们并构建新世界的游戏规则，你会如何看待这种不平等呢？为了弥补这一点，前田先生希望向各位未来的共创者、决策者（非计算机背景的读者）清楚地解释这一切，这是他自20世纪90年代起就一直在做的事情。从向硅谷的人们解释“计算设计”将如何改变身边的事物，到完成对身处人工智能时代的每个人都影响深远的本书，他的目的是“找到一种让更多的非技术人士开始建立对计算的基本理解的方法”。


    2013年，我开始研读前田先生的第一本书，10年后再遇见先生的书，我深感幸运。我想感谢恩师向帆教授的鼓励与出版方的信任，让我有机会从人工智能技术的使用者转变为“计算设计”理念的研究者，参与前田先生在人工智能时代最重要的一本著作的翻译工作。此外，多位前沿科技从业者参与了该译本的调研和审校工作：方贞硕、李紫嫣、赵辰伟、张宇翔、黄河清、黄东敏、陈文倩、俎琬滢等。但愿该译本能尽力还原作者的本意，让冰冷的技术具有包容性，能真正地被更多人知晓与理解。


    感谢微本书撰写推荐语、支持并推动人工智能发展的教授前辈们，其中包括谷雪梅、丁文璠和钱世政。最后，我想特别感谢后浪出版公司相关人员的辛苦工作！


    何盈


    2024年2月29日于上海'
