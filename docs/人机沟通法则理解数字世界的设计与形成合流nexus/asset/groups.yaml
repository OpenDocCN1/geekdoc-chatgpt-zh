    部，所以这是一笔有价值的基础投资。②但要真正成为一名设计师，你需要亲手设计一些东西。你可能会做出一些糟糕的东西但没有完全意识到它有多么糟糕，直到一名受过训练的设计师看到它。学习最基本的设计只需要几十个小时的练习，但要想出众并成为一名真正的设计师，你需要众所周知的一万小时刻意练习③，这将使你成为一个受过正规训练的人。


    作为一个从设计训练营毕业的人，我可以告诉你在你选择解决的问题或者你选择解决方案的方式中，存在三种设计风格：


    +   1.过时风格（Out of style）：这意味着你太迟了。你错过了时机。你没有留意趋势，被时代淘汰了。一开始你可能会受到一些排斥，但如果你坚定信念、有毅力，你便有可能战胜困难。


    +   2.流行风格（In style）：这意味着你的时机刚刚好，你舒适地融入了大多数人。你通过解码流行元素赢得了自己在这个群体中的位置。你属于这个群体，你遵守规则，你松了一口气。但是注意，下一波趋势很快就会流行起来，所以请保持警惕。


    +   3.创造风格（Making style）：这意味着你是先锋——一小部分人站出来与大多数人背道而驰，表达与流行趋势相悖的观点。“创造风格”不一定能成功地变成“流行风格”。当你有勇气挺身而出、接受打击时，这往往意味着你真的很酷。


    那些有权决定风格的人，都是设计圣殿里手握底牌的成员。这是一个有英雄和明确等级制度的舒适之地。这是一个由特权阶级和富人组成的世界，他们能决定什么是值得拥有的，仅仅是因为他们能拥有别人无法得到的东西。这一传统可以追溯到皇室将自己与平民区分开来的方式——拥有别人不能拥有的东西。因此，美团在线零售商“设计触手可及”（Design
    Within Reach）经常被戏称为“设计遥不可及”（Design Without Reach）并非巧合。这是一个由影响者的观点构建的不公平的世界，多亏了设计圣殿的炫耀和排场，它从内部看起来似乎非常重要。当然，出于你能想到的所有原因，我喜欢待在里面，但我也有责任指出它已经与计算时代脱节。


    设计圣殿一直以来都能决定创造风格的走向，因为创造并生产任何东西都是一项资本密集型任务。哪些东西会投入生产，取决于创造风格的阶层掌握的知识和人脉。但是，这种依赖少数特权人士的评价体系受到了理性思考的非设计圣殿信徒的数据收集和非正式网络的冲击。硅谷的资金和影响力，加上如今任何人都可以获得的算力，意味着理性思维可以占上风，优质设计可以以极低的价格开放给所有人使用——只要它是通过电子设备交付的。我们生活在这样一个时代，你永远不必“过时”，你可以一直“流行”，因为你总是可以接触到最新、最好的电子'
  - '[PAGE 88]


    产品设计——如今你可以在帮助设计决策方面发挥关键作用。而且设计圣殿无论说什么或做什么，都无法真正影响当今电子产品的发展，因为实话实说，科技圣殿已经以摩尔速度超过了设计圣殿。


    包豪斯学派教义的发展是为了回应工业革命，回应利用工厂中的机器和流水线制造产品的新能力。大众负担得起的家电终于能被造出来了，但它们往往难以使用，也不适合消费者生活空间的装饰风格。因此，在20世纪初，包豪斯教育项目引进了更好的方法来制造大众可用、喜欢且负担得起的产品——不过其产品并没有立即得到大众的认可。因此，奥地利作家、达达主义者拉乌尔·豪斯曼（Raoul
