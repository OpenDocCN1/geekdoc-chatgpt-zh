    在写完这个程序后不久，我十年级的数学老师莫耶先生（Mr. Moyer）鼓励我参加他的课后计算机俱乐部。在学校里，我在计算机编程方面已经小有名气——也许应该说我是个计算机书呆子。我已经成功完成了我的第一个千行程序，我在想我如果还去参加莫耶先生的俱乐部会不会有失身份，因为跟其他参加聚会的人比，我肯定比较专业。但我还是去了，我清楚地记得莫耶先生讲起一种使用
