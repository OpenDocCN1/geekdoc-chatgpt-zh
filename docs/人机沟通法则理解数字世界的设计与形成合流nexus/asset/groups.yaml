    ![](img/a980a6de0555167c9f36435ce714d7b4_71_1.png)


    此处为文字游戏，“地球”的英文为earth，“艺术”的英文为art，把earth中的art去掉，就只剩下eh（呃），一个英文语气词。编者注。


    这种图案与芋螺属动物的花纹惊人相似这一事实已是多篇探讨其含义的科学论文的主题——如果你和我一样迷信，你会怀疑这不仅仅是一个巧合。大自然会说机器的语言吗？机器会说大自然的语言吗？难道我们仅仅是机器吗？如果你也在问这些问题，你肯定也在像艺术家那样思考，因为艺术家懂得透过表象之美更深入地观察。他们挖掘下层之下的下层，不找到绝不罢休。我最喜欢的T恤图案说得最好：“没有艺术的地球不过是一个‘呃’。”（The
    earth without art is just ‘eh''.）


    ![](img/a980a6de0555167c9f36435ce714d7b4_72_0.png)


    ## 生活由我们如何与他人相处来定义


    我和许多有创造力的人一起工作，他们轻视“非创意型”的管理者和商人，因为他们没有看到这些人亲手创造任何东西。艺术家或设计师有一种偏见，认为只有他们自己在身心合一地创造，他们弄脏双手，有着认真工作的证据。这些弄脏的手与大部分时间都在说话而不是做事的那些人干净的双手形成了鲜明对比。


    这种“说话人与做事人”的二元对立是一位设计专业的学生告诉我，我第一次遇见他是在罗德岛设计学院校园里我经常散步的地方。他以典型的年轻步伐走到我面前，说：“嗨，约翰。我看到你刚才在和那些学生说话，你不应该和他们说话。”我有点困惑，因为我相信包容性，于是我问他为什么。他回答：“因为他们都是‘说话人’。他们只谈论他们的工作，不花时间真正地去做事。你应该和我们一起玩，我们是真正的‘做事人’，总是在做事情而不是浪费时间去说话的人。”


    这位学生坦率而简单的逻辑让我想起了麻省理工学院的工程师们看待麻省理工学院斯隆管理学院（MIT Sloan School of Management）的商业同事们的类似心态。“说话人”被认为是“坏的”，而“做事人”被认为是“好的”。但作为一个完全拥抱了内心的“说话人”身份的“做事人”，我不禁告诉这位年轻人：“很遗憾地告诉你，你自己就是一个‘说话人’，否则你不会走过来跟我说话。让我告诉你为什么交谈是件好事。它让你与除自己以外的其他人联系起来——在这个过程中，你不仅找到了你不知道的问题的答案，还因为交了一个新朋友增加了你正在创造的东西的潜力。”我很高兴看到这个学生后来在TED社区变得活跃，因为他发现了内心的“做事人”和“说话人”。然而，我讲这个故事的目的并不是让大家关注他，而是让大家思考做事情与连接事情的模式。


    Sarah Zielinski, “The Secrets of Sherlock’s Mind Palace,” Smithsonian.com, February
    4, 2014, smithsonianmag.com/arts-culture/secrets-sherlocks-mind-palace-180949567.


    David Foster Wallace, “Plain Old Untrendy Troubles and Emotions,” The Guardian,
    September 19, 2008, theguardian.com/books/2008/sep/20/fiction.


    设计师（和开发人员）在起步阶段会把自己定位为“做事人”。他们用双手完成工作，他们的骄傲源自作品本身带来的认可，而不是在公共论坛上被迫为作品说的话。因为作为“做事人”，我们往往生活在自己的“思想宫殿”里，在这里，我们与自己的对话和我们深入钻研的工作是仅有的重要的事情。或者，正如已故的大卫·福斯特·华莱士（David
    Foster Wallace）更讽刺的描述，“我们可以自由地成为我们自己只有头盖骨大的迷你王国的主人，独自处于万事万物的中心。” 你可能会在我的描述中发现一丝轻蔑的语气，但这并非不尊重。这是我的地盘，是我觉得最舒服的地方。我用这种方式把它大声说出来，定期强迫自己变得更加平衡并与这个世界进行互动。因为在生命的大部分时间里，我喜欢创造东西。我也确实不需要谈论它。事实上，这种心态的缩影是我职业生涯早期最知名的艺术作品之一，它是一首俳句：


    我只想成为的

    是那个创造新事物

    并思考新事物的人。


    在我人生的某段时间，我可以像一个纯粹的“做事人”那样生活。当我早期的计算设计作品在日本赢得声誉时，有一位名叫江并直美（Naomi Enami）的出版商代理我的作品。江并先生会替我做所有“说话人”的工作，而我在幕后创作。


    20世纪90年代初的一个秋天，江并先生想让我在一场颇有名气的会议上演讲。我极其害羞，不想在人们面前演讲。最后我只能勉强答应，因为江并先生帮了我很多忙，所以我很紧张地做了这件事。那天晚上，江并先生建议我去参加会后派对，多和人们聊聊。我告诉他我不想去，我宁愿回到房间，继续在计算机上写代码。他有点严厉地看着我，用日语说：“前田先生，建立关系和创作软件或设计一样重要。”带着年轻时的傲慢，我当然没有听他的，回到房间开始写代码。几周后，江并先生陷入了昏迷。这件事发生后不久，我意识到没有人会再为我说话了，我需要学会为自己说话。所以我有意识地做出选择，走出我“头盖骨大的王国”，成了一个“说话人”，与此同时仍然尽可能地创作。在这个过程中，我鼓励“做事人”学习如何从与“说话人”的合作中获益，因为“说话人”不仅仅与彼此交谈——他们也与潜在的客户交谈。“说话人”所做的连接工作与创作工作同样重要，因为它让观众更有可能比“做事人”多。


    > “Intermediate Level Lessons: Bundle of Twigs,” War of 1812, PBS, pbs.org/wned/war-of-1812/classroom/intermediate/bundle-twigs.


    无论是在现实世界还是在计算世界中，连接工作都是一种催化剂，它能让改变在比个体能做的工作更大的范围内发生。早期计算机本身不过是高级计算器，烦人地霸占了电视机的屏幕只为了让自己工作，但后来，随着互联网的出现，计算机通过与其他机器相连而变得令人惊叹。回想一下当我们试图访问howtospeakmachine.com时有数十亿台计算机可供选择，而且我们不想等待超过一秒钟才能访问它——我们应该感谢域名系统（Domain
    Name System）技术，它让许多计算机彼此合作，创造了这个奇迹。站点名称被抛给一台名称空间服务器，如果它不知道正确的映射，它就会去询问另一台，如此循环直到找到匹配的映射——这一切都在数百分之一秒的时间内完成。无论涉及机器还是人，当它们彼此依靠时，都会产生巨大的力量，因为我们在一起时可以做到我们作为个体无法做到的事情。或者，正如肖尼族首领特库姆塞（Tecumseh）说过的：“一枝易折，一捆难断。”


    Martin Gardner, “Mathematical Games: The Fantastic Combinations of John Conway’s
    New Solitaire ‘Game Life,’” Scientific American 223 (October 1970): 120-23. ibiblio.org/lifepatterns/october1970.html.
    1860年，米尔顿·布拉德利（Milton Bradley）发明了《生命格子游戏》（The Checkered Game of Life）。1960年，鲁本·克拉默（Reuben
    Klamer）和比尔·马克姆（Bill Markham）推出了该游戏的现代版本《生命游戏》（Game of Life）。编者注。详见corp.hasbro.com/news-releases/news-release-details/game-life-celebrates-50-years。


    在数学世界里，一种简洁的算法在20世纪70年代精练地表述了生命的彼此依赖，即《康威的生命游戏》（Conway’s Game of Life）。由于标题里有“生命游戏”这几个字，康威的“生命”很容易引起误解，因为它让人想起了1960年发明的一款更为知名的家庭桌游，比起康威的游戏的黑白格子，这款桌游给玩家带来了更有趣的体验。此外，《康威的生命游戏》并不是为了好玩而设计的，它更像数学游戏——你只有对数学感兴趣才会觉得有趣。幸运的是，你进入的计算世界很大程度上基于数学，这将帮助你欣赏这枚重要的宝石。至少我希望如此……


    《康威的生命游戏》在一个类似沃尔夫勒姆的“规则30”的网格上进行，但使用的是二维单元格。这里只有4条数学规则，每条规则都是一个过分简化的模型，用来模拟一个生命形式如何与“生活”在网格上的相邻生命形式进行交互。


    - 规则1：如果一个活单元格只有一个活着的邻居，它将因孤独而死亡。

    - 规则2：如果一个活单元格有一些活着的邻居，那么它是稳定的，将继续存活。

    - 规则3：如果一个活单元格有太多活着的邻居，它将因过度拥挤而死亡。

    - 规则4：如果一个单元格是空的，并且它有一些活着的邻居，那么交配将导致一个新的活单元格诞生。


    我们可以在桌子上用手和黑白纸片一步一步地执行这些规则，黑纸片表示一个单元格是“活的”，白纸片表示一个单元格是“死的”。你可以想象在一个大网格上进行第二次或第三次迭代后，它会变得相当无聊。幸运的是，到20世纪80年代，计算机已经变得足够强大，可以不断循环，覆盖任意大的网格。我还记得20世纪80年代阿贝尔森教授在一堂计算机科学课上非常兴奋地向我们展示了一个首次发现的奇迹：黑白小方块忽明忽暗地闪烁，然后慢慢地，随着时间的推移，我们可以看到一些群体行为。小群体开始一起移动，小群体开始一起闪烁，小群体撞进其他群体，新的小群体出现。但对于《生命游戏》这样宏大的东西，我期待的不仅仅是屏幕上闪烁的黑白方块。我完全不理解，认为它对我来说太难了。


    ![](img/a980a6de0555167c9f36435ce714d7b4_76_0.png)


    ![](img/a980a6de0555167c9f36435ce714d7b4_76_1.png)


    ![](img/a980a6de0555167c9f36435ce714d7b4_76_2.png)


    ![](img/a980a6de0555167c9f36435ce714d7b4_76_3.png)


    ![](img/a980a6de0555167c9f36435ce714d7b4_76_4.png)


    ![](img/a980a6de0555167c9f36435ce714d7b4_76_5.png)


    多年后，我意识到这个想法之所以伟大，正是因为它的简洁：仅仅把4条规则应用于一个单元格和与它相邻的单元格之间的关系，就能以某种方式创造群体行为，让许多独立的单元格像一个整体那样行动。因为康威的规则中没有单元格群体的概念，所以一群单元格分裂出来并开始像一个整体那样行动是意料之外的结果。


    ![](img/a980a6de0555167c9f36435ce714d7b4_77_0.png)


    只需要有4条规则定义网格中一个单元格与相邻单元格的行为，多个单元格就可以作为一个整体行动，而不需要了解整个网格的情况。相邻单元格之间的沟通似乎是促成这种协作的原因。


    “NIH Human Microbiome Project Defines Normal Bacterial Makeup of the Body,” National
    Institutes of Health, June 13, 2012, nih.gov/news-events/news-releases/nih-human-microbiome-project-defines-normal-bacterial-makeup-body.


    当我们一起工作时，我们会获得个人无法拥有的能力，从而获得集体利益。举个例子，帝企鹅巧妙地挤在一起取暖，它们不停地在最温暖的中心和寒冷的边缘交换位置。它们会随着脚尖来回移动以减少与冰面的接触面积，同时确保彼此不接触，以避免挤压羽毛的保温层。我们可以在鸟类和鱼类中看到类似的涌现行为，它们相互配合形成美丽的群体结构。自然界中这些群体行为的目的不是创造美，而是确保更多同类的生存，就像谚语所说的“一捆难断”。鉴于我们现在知道人体中有数万亿个微生物，并且它们的数量是人体细胞的10倍，我们可以把自身看作一个在最小规模层面运行的大型协作工厂。


    此时此刻，我们的身体里有很多沟通（和创造）正在发生。此时此刻，计算世界也在发生相同的事情。计算机可以相互交谈这一事实，意味着它们和它们能接触到的最聪明的计算机一样聪明——就像我们人类占据的社交网络将我们联系起来。计算机已经学会了如何协同工作，如何相互交流，如何充分利用我们的集体智慧，那么我们是否能和计算机一样快地找出合作的方法呢？也许可以，但只在我们学会倾听彼此时。如果我们能完美地训练计算机倾听我们的声音和其他计算机的声音，我们是不是也应该为我们的人类同胞做同样的事情？


    ## 保持大胆，计算机就不会取代我们


    Nathan Ensmenger, “Is Chess the Drosophila of Artificial Intelligence? A Social
    History of an Algorithm,” Social Studies of Science 42(1) (2011): 5–30, pdfs.semanticscholar.org/c9e7/3fc7ec81458057e6f96delcba095e84a05c4.pdf.

    National Research Council, Funding a Revolution: Government Support for Computing
    Research (Washington, DC: The National Academies Press, 1999), 143. doi.org/10.17226/6323.

    Eleanor Cummins, “Another AI Winter Could Usher in a Dark Period for Artificial
    Intelligence,” Popular Science, August 29, 2018, popsci.com/ai-winter-artificial-intelligence/.

    “DARPA Announces $2 Billion Campaign to Develop Next Wave of AI Technologies,”
    Defense Advanced Research Projects Agency, September 7, 2018, darpa.mil/news-events/2018-09-07.


    我们来回顾一下50多年前人工智能诞生的时候，最初的目标是让计算机思考——熟练的“思考”意味着下棋，因为这是我们这些书呆子做的事情。当时计算机科学领域迫切希望让自己看起来更合理，而国际象棋与某种逻辑思维有关。因此，把象棋放在计算机研究的聚光灯下是一个可以吸引聪明的数学家们的有力招募手段。①但是，在试图说服四星上将支持和资助这一新领域时，由国际象棋选手包装的人工智能前景受到了挑战。②最终，他们的营销努力占了上风，人工智能研究从20世纪50年代开始繁荣了近20年。但是，当时人们对用原始计算机实现智能的高度期望，最终导致了20世纪70年代研究资金的大幅削减，这被称为“人工智能寒冬”。③快进到今天，我们知道，由于新的工业级人工智能的出现，加上政府和企业数十亿美元资金的回归，人工智能的夏天又回来了。④


    在写本书的过程中，我回顾了计算机的历史，发现在1984年，我去麻省理工学院那一年，苹果的Macintosh计算机诞生了。那一年恰逢人工智能寒冬过后，价值数十亿美元的人工智能产业开始崩溃——随之而来的研究资金短缺可以证明。这有助于解释为什么我本科在麻省理工学院人工智能实验室工作时，我的同学们都觉得我下错了赌注。在那个时候押注人工智能，很像押注一分钱老虎机，因为当时计算能力还不足以显示任何有意义的进展。让计算机在国际象棋游戏中打败人类的伟大任务，似乎远不如享受一款不需要人工智能并且可以取代办公桌上的笨重打字机的文字处理器的卓越工作效率重要。


    然而，快进到今天，人工智能不知怎的成了硅谷所有谈话的主题——智能机器被认为是必然会发生的事情，更不用说各行各业的商业圈和政治领域的谈话了。人工智能的发展速度让我想起金融界的“沃伦·巴菲特法则”，复利是巴菲特投资成功的关键因素。复利规则的背后是一个简单的想法：你存的钱越多，随着时间推移你赚的钱就越多。所以即使在低利率的时候你可能只有相应的低收益，如果你将这些收益不断地加到你的本金中，你赚取的利息也将随着时间的推移而叠加。所以你一年内在银行赚到的几分钱利息可能不重要，但是几十年后的复利把几分钱变成了几美元。例如，如果你在年利率为1%的情况下持有1美分50年，你最终总共会得到2美分。在年利率为5%的情况下你会得到11美分。在年利率为10%的情况下你会得到1.17美元。但如果你使用摩尔定律，保守估计年利率为66.66%，那么你持有的1美分50年后的累积价值将超过10亿美元，达到1,234,721,113.27美元。


    Vernor Vinge, “The Coming Technological Singularity: How to Survive in the Post-Human
    Era,” 1993, edoras.sdsu.edu/~vinge/misc/singularity.html.


    到目前为止，作为计算世界的一名过客，你至少谨慎地相信指数增长的概念。但是计算机专业人员一直都知道这种在以计算思维工作和思考时产生的不寻常、无形的复利现象的存在。对他们来说，科幻小说不仅仅是小说，还是描绘似是而非的现实的最合乎逻辑的手段。在20世纪90年代初，科幻作家、计算机科学家弗诺·文奇（Vernor
    Vinge）写了一篇论文，在摘要的第一行，他预言：“在30年内，我们将拥有创造超人智能的技术手段。不久之后，人类的时代会走向终结。”


    对不懂计算机的人来说，这句话很容易被忽视，但对相信摩尔定律的思考者来说，这似乎是一个完全合乎逻辑的判断。文奇创造了“奇点”（singularity）一词来描述“通过技术创造的超越人类智能的实体诞生”的时刻。


    Ray Kurzweil, “The Law of Accelerating Returns,” Kurzweil Accelerating Intelligence/Essays,
    March 7, 2001, kurzweilai.net/the-law-of-accelerating-returns.


    在文奇的论文发表几年后，著名的发明家和科学家雷·库兹韦尔（Ray Kurzweil）更进一步，写了一本长达672页的关于奇点的书，详细描述了奇点将如何发生。库兹韦尔预测，到2015年计算能力将超过老鼠的智力，到2023年将超过人类的智力。他甚至更进一步，预测到2045年计算能力将超越地球上所有人类智力的总和。

