    Case）称这个阶段为“半人马时代”——象征着人类智能与马的超强体力的融合。②今天我们知道在让计算机变得更聪明的同时，计算机也在增强我们的智慧，所以我们没有打败它们，而是选择了加入。


    +   第一阶段：塑封包装的盒子，通过盒子发布软件产品，并以同样的方式推送软件更新。


    +   第二阶段：塑封包装+下载，用户可以选择在线下载盒子里的软件，并且软件更新的推送也在线上进行。


    +   第三阶段：软件即服务（SaaS），我们将软件作为一种服务迁移到云端，人类团队不断更新它。


