    几乎所有问题都可以通过一次测试活动得到低廉、快速、彻底的解决。而且这就是解决问题的方法——不是围着桌子争论。直奔终审法庭——你的产品的买家。


    测试客户会带来额外的成本和风险，我们需要将其与不进行任何修改或改进尝试的机会成本进行权衡。只有当你心中有一个可衡量的结果（比如推动点击行为或促成一笔销售）与可以衡量的基本情况进行对比时，测试才真正有用。特别注意不要陷入这样一种情况：对任何想法的默认文化反应都是“只要测试一下”。一方面，这意味着有一种对新想法持开放态度的文化；另一方面，它也可能表明在面对相互矛盾的意见时，人们开始变得懒惰，不愿深思熟虑。“只要测试一下”很容易成为不投入启动一个真正好的想法需要的努力的借口。换言之，测试是一项真正有价值的工作，如果做得对，可以带来数千倍的改进和数百万美元的价值。


