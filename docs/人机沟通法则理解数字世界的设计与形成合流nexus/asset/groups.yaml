    ## 将一个想法付诸实践比祈祷它是正确的更可靠


    我们已经走过了一段漫长的路，探究测量系统之所以异常有用的核心：轻松测试想法的能力。但在我们深入探讨这种能力之前，我想让你至少熟悉测量是如何发生的，了解拥有关于用户的数据可能有益也可能有害，以及一种可以最大化利用大量涌入的数据的全新技术。这项技术本身微不足道，但考虑到连接我们所有人的计算机云的范围、速度和阴影遍布全球，它的影响是巨大的。通过把一个用于数据收集的想法推向世界，我们只需要观察它的实际使用情况，就可以很容易地测量它是成功还是失败的。


    但比起了解一个想法是好是坏，更好的办法是同时实践一个想法的几个变体，以此了解哪一个变体才是最好的方向。也许一个想法的某个方面比其他的好——这可以通过测试变体来揭示，而不是抛弃整个想法。这就像在鱼竿末端挂三种不同的鱼饵，看哪一种能钓到最多的鱼。然后，通过把最有效的鱼饵作为你下一组变体的基础，你就有可能找到下一个最好的鱼饵，以此类推。通过这种方式轻松测试不同想法的能力降低了随机猜测的风险，对于改善产品设计有益无害。


