    在麻省理工学院时，我宣称自己是“人文主义技术专家”，但并不知道它的真正含义，这主要是因为我认为技术专家的默认座右铭是技术越多越好。技术专家创造进步，进步是关于正在发生的事情。我们不想要一个根本没有任何事情发生的世界。但随着时间的推移，我发现了这两个术语之间的区别：


    - 技术专家 = 我做，是因为我可以做这件事。

    - 人文主义者 = 我做，是因为我关心这件事。


    仅仅把一个字母替换成两个字母，“可以”（can）就变成了“关心”（care），技术也变得更人性化了。我相信你关心这个问题。因为你关心，所以你现在可以进入最后一章，了解人工智能无法应对的一个挑战，这证明了我们这些老实人是有价值的——而且是必不可少的。我们正处于“奇点”的边缘，我们的重要任务是解决一个失衡社会将面临的自动化问题，现在采取行动还为时不晚。即使到计算机完全超越人类智能的总和的时候，仍然会有一些事情是机器无法胜任的，找到这些事情是我们作为人类的责任。了解机器的世界后，你将需要对我们作为人类共同创造的事物负责——并且我们需要在为时已晚之前共同重新创造。一个计算产品将在收集到的关于我们的数据的驱动下立即得到改进。随着人工智能的崛起，它将成为驱动迭代的唯一力量，而不再需要我们积极和明确的指令输入，对此我们需要采取行动。


    ## 第六章


    ### 机器让失衡自动化


    ### 科技行业正在孕育排斥


    鉴于科技行业长期以来一直受到科技教育行业（我的老本行）的支持，我一直认为我们在源头面临的问题会顺流而下。在加入麻省理工学院几年后，当时的院长查尔斯·M. Vest就1999年关于麻省理工学院科学学院女性教职工的官方报告发表了一份声明：


    > “A Study on the Status of Women Faculty in Science at MIT,” The MIT Faculty
    Newsletter (special edition), March 1999, http://web.mit.edu/fnl/women/women.html.


    我从这份报告及其写定期间的讨论中学到了两个特别重要的教训。首先，我一直以为当代大学中的性别歧视部分是现实，部分是观念。确实如此，但我现在知道了现实部分占相当大的比重。其次，我和我的大多数男同事都认为我们非常支持初级女性教职工。这也是事实。她们一般对此都很满意，并在许多方面（尽管不是所有方面）都得到了很好的支持。然而，当我听到一位感到自己受到不公平待遇已有一段时间的高级女性教职工说“我年轻的时候也觉得其他人很支持我”时，我猛地坐直了。


    我天真地以为，随着麻省理工学院公开发表的这一声明和随后《纽约时报》（The New York Times）对它的报道，性别歧视造成的严重不公平将正式被驱逐出科技世界。因此，当我十多年后在硅谷见到一个满是“硅谷顶级用户体验设计师”的房间里只有两位女性在场时，我大吃一惊。在我离开硅谷前，在我组织的任何聚会或作为演讲者参加的任何活动中，情况已经改善到男女数量对半，因为我发现这是提高活动整体质量最有效的方法。因此，我觉得我这样做说得通。


