    ## 大数据的结论需要与真实人群密切相连的厚数据


    鉴于我们可以很容易地部署不完整、可测量的计算产品，我们有机会获得大量数据以确定如何修改和改进这些产品。成功通常意味着收集大量的用户数据，这是提高由数据驱动的结论的统计准确性的最佳方式。因此，对于计算产品，我们很容易偏向于笼统地观察数以千计用户的行为，而非有意识地花时间去深入研究少数用户的使用体验。为什么呢？简单来说，考虑到我们今天拥有的计算能力，采取可测量的方法来研究聚合行为要容易得多（因此成本更低）。当你能说出“7.2%比1.2%”这样听起来很科学并且令人信服的事实时，你看起来也聪明绝顶。相比之下，通过人类学家开发的方法研究个体行为的技术含量要低得多（因此成本更高）——本质上这就是人种学。在和名叫詹姆斯的非技术客户（他在使用产品的过程中遇到了一些挑战）相处一段时间后能对他遇到的问题有更深入的了解，是具有客户同理心的积极信号。


    问题是：与詹姆斯遇到的挑战和他正在面对的障碍相比，以数字数据的形式给出的“科学”回应通常会得到大多数人的认可。因为一个定量的观点看起来就像事实——一个从噪声中提取出来的重要信号，而一个定性的观点看起来就吵闹的客户，他怎么也“听不懂”并且可以被忽略，因为他不在7.2%的范围内。实际上，无论是聚合数据还是个体故事都不构成事实，因为这两种情况都涉及了人。人在本质上是不可预测的，所以任何涉及人类行为预测的事情终究也只是一种猜测。一种猜测是通过定量数据，另一种则是通过定性数据。我们花大价钱购买高质量的猜测，将它们当作降低决策风险的一种手段，但没有任何猜测能100%保证是正确的。这就是为什么它是猜测，而不是事实。任何投资者都非常清楚：要想猜得更好，最好的办法是创建一个投资组合，这样赌场里所有的筹码就不会只押在一个猜测上。


    在计算时代，收集定量数据已经变得如此轻松，以至今天的挑战之一是让技术人员离开配有巨大显示器和大量零食的站立式办公桌，进行一次老式的、面对面的客户访谈。这之所以相当困难，是因为轻松获取定量数据是计算时代的主要好处和实际结果，所以对每天生活在未来的人来说，这可能像在往相反的方向走。此外，如果每月只需花费5美元就可以收集和分析数百万使用你的产品的在线客户的数据，那么每月花费数百美元与客户进行一对一的沟通似乎没有必要地昂贵且低效。借用另一个金融业的比喻，最好的投资者不仅会仔细分析他们参投的基金，还会去基金经理那儿进行实地考察，这是他们作为投资专家的额外尽职调查。因此，如果投资界的尽职调查是业内最高标准，那么时不时与真正的客户交谈也是很有商业意义的。


    Clifford Geertz, The Interpretation of Cultures (New York: Basic Books, 1973).


    这是优秀人种学研究的典范：为了理解一种文化现象，你需要尽可能地接近“一手”信息，而不是依赖二手或三手信息。此外，为了真正理解一手信息，你需要花时间去了解和理解它的文化背景。文化人类学家克里福德·吉尔茨（Clifford
    Geertz）将人种学的终极目标定义为“厚描述”，与“薄描述”相对。薄描述仅关注浮于表面的细节，而厚描述比直接观察要深入得多，它试图捕捉表面之下的许多层次。


    Tricia Wang, “Why Big Data Needs Thick Data,” Ethnography Matters (blog), January
    20, 2016, medium.com/ethnography-matters/why-big-data-needs-thick-data-b4b3e75e3d7.


    例如，根据我的WordPress产品工作经验，我知道听到这样的薄描述是很常见的：“90%的人把大部分时间花在查看他们的博客的浏览统计上。”由此得出结论，浏览统计是一个需要改进的重要功能。但是这样的分析很快就会被一名用户的厚描述打断，他会告诉你博客的浏览统计是登录WordPress后看到的第一页，因为统计页面显示的浏览量为零，所以他没有动力继续使用博客。因此，问题不在于改善浏览统计页面，而在于让博主写出能增加浏览量并建立读者群的内容。人们很容易让听起来令人印象深刻的聚合数据成为有说服力的行动理由，而忽略了更严重的潜在问题。因此，在面对定量数据时，重要的是了解科技人种学家特里西亚·王（Tricia
    Wang）所说的“厚数据”，与“大数据”相对。收集厚数据需要时间，而对其进行充分解释则需要更长的时间。你需要沉浸在收集到的厚数据中，以充分捕捉你的人类同伴的上下文，否则这份额外投资将收效甚微。量化处理大数据的诱惑和便利会不断地把你从理解厚数据所需的时间投入中抽离出来。


    作为一个忙碌的人，我承认我喜欢躲在电脑屏幕后面，坐在舒适的工作椅上，因为这样可以高效地完成很多工作，而且自己的节奏不会受到周围环境的干扰。但是，自从我受Intuit的创始人斯科特·库克（Scott
    Cook）“与客户一起回家”（早在第一次推出Quicken的时候，他就会看着客户安装和运行软件系统）的习惯的启发，开始积极地与客户面对面工作以来，我就意识到这些时间是非常值得投资的。这提高了你为客户服务的风险。这可能是一件非常不舒服的事情，因为你很快就会知道你做出的产品决定让其他人失望了。当你亲自收集厚数据时，要小心自己很容易产生偏见，认为一个客户的问题代表了所有客户的问题。现在，你已经接受了不完美，请放手去做吧。


    我对“深入收集厚数据”的一个建议，是尽量不要把注意力放在你的客户在你的系统中面对的具体问题上。而是要牢记他们希望与你合作的总体目标。例如，我记得20世纪90年代，日本的复印机制造商设计了复杂的用户界面来处理卡纸问题，却被那些为了更好地共享信息而采用无纸化模式的组织打了个措手不及。我把这比作我们在客户支持中遇到的“爆胎”情况，因为经常遇到“爆胎”，我们会立即想把所有时间都花在制造一个不会爆胎的轮胎上——或者更常见的做法是变得非常擅长修理爆胎。与此同时，我们可能会忘记思考客户一开始想去哪儿——我们应该问：“客户的目的地在哪里，与之关联的希望和梦想又是什么？”通过从作为厚数据背后的驱动力的动机问题出发，当你沉浸在一手信息中时，你将更有策略。请记住，你要寻找的是图表和数字无法捕捉到的有人情味的微小细节，所以，试着依靠你的嗅觉和感觉能力，去做人工智能做不到的事。


    我在大学时就学到了这一课程的一个版本。当时，我作为麻省理工学院人工智能实验室的一名本科研究员，为数字设备公司（Digital Equipment Corporation）的一位访问工程师工作，直到它和许多早期计算公司一样消失了。她给我讲了一个令人难忘的故事：一家大型汤品公司投资了一大笔钱来创建一个“专家系统”（第一代人工智能），用来在工厂里和人类操作员一样煮汤。这家公司的问题是他们最好的操作员都在变老，他们不知道这些员工最终退休后该怎么办。因此，他们仔细观察了这些煮汤的前辈，并将所有的行为和思维方式编码为if-then规则。终于有一天，工厂启动了这个天然酵母式人工智能系统并制作了一些汤。但结果令人失望——事实上，汤太难喝了。当时我对专家系统非常着迷，对这个失败感到震惊，所以我问这位访问工程师是否找出了原因。她说：“原因其实非常简单有趣。他们请一位老前辈解释为什么汤的味道不好。他走上前来，弯下腰，狠狠地在汤碗边嗅了几下。他的回答是：‘这汤闻起来不对劲。’”我喜欢这个例子，因为它放到今天依然适用。事实上，复杂的系统有许多难以捉摸的方面，即使使用最先进的计算技术也很容易忽略它们。身为人类还是挺酷的，人工智能们滚蛋吧。


    所以，当你的鼻子指向未来时，请记住这三个总是让我陷入麻烦的陷阱。随着你在计算能力和设计审美上日渐熟练，你自然会与它们发生碰撞。而且，只是通过和我一样变老，你也可能会开始相信自己的唠叨。我会简要概括，以便你快进到本书的结尾，据我所知你也快看完了！


    - 1. 像传统工程师那样思考，相信只有一种方法可以把它造好。亨利·福特是一个传统工程师，他相信每个人都想要一辆简单、实用、漆成黑色的T型车。通用汽车公司的阿尔弗雷德·P.
    斯隆（Alfred P. Sloan）认为应该有不同类型的汽车以满足不同类型的人的需求。由于拥有更好的嗅觉，通用赢了，福特输了。


    - 2. 像传统设计师那样思考，相信所有人都会赞同并适应你的解决方案。精英机构秉持的标准作为传统设计世界的文化指南针，由主观决策和无形的财富网络撰写，它们推动了什么该被记住，什么该被遗忘。设计圣殿里关于“天才设计师”的故事并不是通向成功的可靠途径——它很诱人，但也很愚蠢。少用这种嗅觉。


    James Gadsby Peet, “Great Leaders Know When to Unlearn the Past,” Mind the Product
    (blog), November 20, 2018, mindtheproduct.com/2018/11/great-leaders-know-when-to-unlearn-the-past.


    - 3. 像高级领导那样思考，相信过去行之有效的方法显然还会适用。我曾经训练自己及时阻止自己说出下面这些话：“当年我在X公司时做了Y，现在咱们面临的问题和Y完全一样。我知道如何解决这个问题。跟我走就对了！”这么做是因为我知道我们生活在计算时代，不能指望十年前可行的方法现在也适用。这就是企业家巴里·奥莱利（Barry
    O''Reilly）所说的，要严格地从过去的成功中“解脱”出来，否则你将错过新的成功。②因此，当有疑问时，去换一个全新的鼻子吧。


    Rochelle King, Elizabeth Churchill, and Caitlin Tan, Designing with Data (Sebastopol,
    CA: O''Reilly Media, 2017).


    “三角测量”这一术语源自几何学，它指的是根据已知的点向未知的点构建三角形的方式来确定该点的位置。在社会科学领域，三角测量指采用多种调查方法来研究同一种现象（例如访谈或定量调查）。译者注。


    我们可以通过关注工作中人的因素来着手解决已经渗入技术领域的许多失衡。计算机器是模仿大师，在模仿的基础上被定量数据驱动。因此，我们需要注意自己完全正常的“人性”：依赖我们通常的偏见，也就是“智慧”。如果我们不能用更多的定性数据来平衡所有的定量数据，那么计算时代将很容易对我们所有人产生不利的影响。所以，从现在开始扩宽你的数据组合吧。像一个比一般人更聪明的老板那样投资。尽可能多地收集与你不同的人的观察结果②——因为当你拥有最多样化的数据源时，三角测量法③的效果最好，你可以利用这些数据源来反复调整基于数据的猜测。我们生活在一个需要你全面感知并用心好奇的时代，而不仅仅是试图保护你的鼻子免受偶尔令人不快的浓重气味的影响。去深入收集厚数据，去深吸一口气吧。


