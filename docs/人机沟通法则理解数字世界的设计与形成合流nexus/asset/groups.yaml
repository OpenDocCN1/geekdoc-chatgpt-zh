    Stefanie K. Johnson, “What 11 CEOs Have Learned About Championing Diversity,”
    Harvard Business Review, August 29, 2017,

    hbr.org/2017/08/what-11-ceos-have-learned-about-championing-diversity.

    Jessica Guynn, “Google Gets Tough on Harassment After James Damore Firing Roils
    Staff,” USA Today, June 27, 2018,

    usatoday.com/story/tech/news/2018/06/27/google-toughens-rule-internal-harassment-after-james-damore-firing-roils-staff/738483002.

    Michelle Darrisaw, “Google’s Annie Jean-Baptiste Talks Diversity and Creating
    Inclusive Products for Under-served Communities,”

