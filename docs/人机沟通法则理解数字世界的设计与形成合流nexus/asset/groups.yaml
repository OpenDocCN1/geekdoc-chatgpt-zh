    但是，魏森鲍姆的预测需要克服三个障碍：（1）需要一种方法来收集有关个人的所有信息，以便人工智能做出令人信服的回应；（2）需要一种方法来收集许多与他人的对话，以便人工智能学习新的模式；（3）需要一种新的方法来处理所有收集到的信息，而当时符号计算还无法做到这一点。随着智能手机的出现，我们克服了前两个障碍。由于我们使用的设备具有成瘾性，云很容易持续、密切地观察我们所有的行为。第三个障碍的解决方案是“人工神经网络”，这是一种几乎与'
