    MVP 的设计方法是用最小或“精益”的方式给消费者他们想要的东西，而不一定将其完全实现。考虑到云的工作方式及其前所未有的测试不完整想法的能力，MVP已经成为将想法推向世界的主导方法。尽管“可行”的定义在旁观者看来是有争议的——因为实际搭建软件系统的人通常有工程背景，其中“可行”表示可靠且缺陷尽可能少。毕竟，一座桥如果会随机把汽车踢下桥或者突然倒塌，又有什么用呢？如果一座桥不能承受多辆车的重量，用美丽的花纹来装饰它又有什么用呢？因为如果技术不起作用，那么我们制作的最小产品哪怕在最基本的层面上都会失败。快速制作安全、稳健并且在工程上可行的软件系统不是一项可以掉以轻心的任务。因此，“最小可行”往往意味着在产品的功能方面优先考虑所有可用资源。


    请允许我在此稍做停留，因为这点很重要。工程师能够“看见”无形的计算世界，他们处理的事情的复杂程度是其他任何人都看不见的。他们同时还要应对随着不断推进积累起来的多层技术债务，这不仅很容易涉及正在建造的桥梁，还会涉及其他所有彼此相连的桥梁。只有他们疲于打字的手指能力挽这个世界中无处不在的混乱和复杂汇成的狂澜。然而，他们的英勇努力并未得到回报——这个世界中无火生烟、无土纳垢，辛勤劳动也不会流下汗水。因此，当一个商业观点进入战场，或者当一个设计观点从外围进入视野时，对网络世界里的勇士们怀有同理心是很重要的。在他们思维的无形空间里，他们正在管理数不胜数的微小细节和巨大规模。理解他们始于你对计算世界的新认识，这对你来说有百利无一害。学一点与机器沟通的方式也无妨。当被问到你有多擅长时，你可以腼腆地回答：“我只会‘一比特’。”'
