    # 完美不如理解


    对计算产品设计师来说，每天早上醒来后都自问该如何降低自己的高标准，是一个奇怪的开启一天的方式。你必须接受这样一个事实：你不会运用你从浏览伦敦、巴黎或纽约的最新艺术或设计展览中学到的东西，而是投身于“最小可行产品”（Minimum
    Viable Product，以下简称MVP）的世界。作为MVP创作者，你的工作就是把你伟大的想法削减到只剩骨架，一种只与你最初的愿景有点相似的形式。你的目标是创造一种完全适合低成本原型的东西——任何一个有自尊的完美主义者都不可能容忍将它公开展示。但你可以从另一个角度来看这件事：用优雅适宜的形式演绎一个想法的早期阶段，然后去做更重要的工作，即了解人们对这个想法的看法，即使人们看到的是这个想法最小的可行形式。


    你可能会思考：我怎么能在杰作完成之前就做如此卑微的展示呢？你最不希望经历的就是被设计圣殿的一名同事告诉自己做了堆……垃圾。但是，与他人分享不完整产品的美妙之处在于，它提供了一个与不同于你的人分享的机会。网络连接，加上软件可以被传输到全世界大部分设备上的事实，使分享成为可能。我们只需要把产品放到云端，任何人就可以从任何地方获取它。


    云不仅存储了你的产品，还能即刻把产品提供给所有想尝试它的人。通过接触这些人，你就有可能了解他们对你的产品的看法。想想在公司食堂的显眼位置摆一个意见反馈箱的常见做法——这样你就可以判断人们对一个新的管理举措有什么看法。同理，给你在网上做的任何东西都附上反馈表，这样你就有机会了解人们对MVP的看法。你不再需要猜测，因为你可以通过收集来自世界各地的反馈即刻得到答案。


    > John Maeda, “Why I Use SMS to Integrate Q&A into My Talks Instead of After the
    Talk,” John Maeda’s Blog (blog), March 21, 2018, maeda.pm/2018/03/21/why-i-use-sms-to-integrate-qa-into-my-talks-instead-of-after-the-talk.


    > Maria Popova, “In Praise of Shadows: Ancient Japanese Aesthetics and Why Every
    Technology Is a Technology of Thought,” Brain Pickings, May 25, 2015, brainpickings.org/2015/05/28/in-praise-of-shadows-tanizaki/.'
  - '[PAGE 91]


    一个我深受“先交付不完整，然后学习”的方法影响的例子，是我准备会议演讲时的做法。我记得我曾经花很多时间精心地准备TED演讲用的幻灯片。后来，我反其道而行之，如今我都是毫无准备地上场。我的新方法不是精心设计约50张幻灯片，而是把我的电话号码放在屏幕上，让人们把他们想问的问题发给我。￼通过这个方法，我能克服自认为知道观众想要什么的偏见。取而代之的是，我能准确地给出他们想要的，而不仅仅是尽我所能地去猜。如果没有沉浸在硅谷文化中，我不相信自己会以这种方式演讲。因此，除了把日本著名的美学散文《阴翳礼赞》￼作为一种审美追求放在心尖，我还把由我虚构的《不完整礼赞》也放进了我的思想宫殿。


    交付未完成和不完整产品的美妙之处，在于交付之后你可以随时改进它们。没有必要立刻完成它们——甚至永远都不需要。看看互联网，它完成了吗？完全没有。它每天都随着新技术和改进的出现而不断发展。想想20世纪80和90年代，数字设计经历了从印刷到互联网的转变，一种新的平面设计工作出现了：网站设计师。不同于设计一张海报或一本书直到得到一件完整的作品为止，一个网站在被设计后交付——但它并没有完成。我们总是需要修改或扩展这个网站，因为摩尔定律正在发生。因此，它从根本上改变了你可以完美交付视觉设计这一理念——就好比印有最终设计的纸张从被印刷出版的那一刻就开始腐烂。


    > Esther Zuckerman, “Video Games: Art-Tested, MoMA-Approved,” The Atlantic, November
    29, 2012, theatlantic.com/entertainment/archive/2012/11/video-games-art-tested-moma-approved/321022.

    > Dragan Espenschied, “Rhizome Releases First Public Version of Webrecorder,”
    Rhizome (blog), August 9, 2016, rhizome.org/editorial/2016/aug/09/rhizome-releases-first-public-version-of-webrecorder.


    自然，设计圣殿也因此抨击了网站设计——因为它阻碍了他们实现完美的高标准。所以，如今没有很多网站被博物馆收藏的简单解释，就是技术在不断变化，许多艺术和设计专家都在等它……停下来。传统主义者都希望这种名叫计算的东西很快就会被下一种东西取代，因为任何趋势终有一天会结束。他们有这样的想法和期望是很正常的——他们不懂如何与机器沟通，所以这不完全是他们的错。不过在世界各地的设计圣殿里，仍有一些思想前卫的机器沟通者。例如，策展人保拉·安东内利（Paola
    Antonelli）敢于把电子游戏纳入现代艺术博物馆的永久藏品￼，纽约新博物馆（New Museum）的艺术团体Rhizome提供了一个名为Webrecorder的开放数字存档解决方案。￼毫无疑问，我们正在取得进展，未来还会有更多进展。'
  - '[PAGE 92]


    目前，新一代产品设计师正在学着适应这样一个事实：他们的作品可能不会被载入史册，也不会被陈列在博物馆精品收藏的漂亮椅子旁边。这是因为计算产品设计师有幸拥有一个独特的机会，可以通过结合他们对客户需求的实时理解和最新的技术进步，让不完整和不完美的东西变得更加完美。他们是那些在听到人们怀疑联网汽车仪表盘上的速度计在恶劣天气下的易读性后，第二天就迫不及待地推送修改的人。过去，人们希望你知道正确的答案，称其为“已完成”，然后就不管了。如今，你更愿意接受更完美的理解，而不是更完美的产品。你知道，由于你对配方进行调整和改进的意愿，更完美的理解将使真正永恒的设计成为可能。你宁愿跑一场马拉松，而不是短跑。'
  - '[PAGE 93]


    # 一个不完整的想法只有经过迭代才能成为好想法


    我在前文提到设计圣殿的金色屋顶之下有三种风格：（1）过时风格；（2）流行风格；（3）创造风格。每种风格都有其内在价值和存在的理由。每种风格实践的深度都很容易被忽视和低估，所以在我们进一步讨论迭代的重要性之前，请允许我“双击”每种风格。


    当一个想法“流行”时，它的生命周期可以通过变化延长。你会发现一款非常棒的产品一开始只有几种颜色可选，后来就推出了几类颜色。一段时间后，它在颜色、材料和饰面上甚至出现了更多的变化。然后，它在某个时刻走到尽头，步入“过时”的世界。一个创意能“流行”多久取决于它的内在力量，但营销人员尤其擅长的一种技巧可以让其持续“流行”。


    Catherine Clifford, “Iris Apfel: 10 life lessons from a 96-year-old who is probably
    cooler than you,” CNBC, March 29, 2018, cnbc.com/2018/03/29/10-life-lessons-from-96-year-old-iris-apfel.html.


    当一个想法“过时”时，它并不会有一个体面的葬礼。它只是消失了，沦为大多数人在生活中某个时刻都会经历的无关紧要一类。它曾是那个时代的好主意，但属于它的时代已经过去了。总有一些顽固的人希望留住那个时刻，表现得仿佛世界没有改变——但总的来说，如果他们不能跟上下一个趋势，他们也会开始落后。有些人乐于选择“过时风格”，他们的不自知让他们更受喜爱而不是遭到排斥。这种情况体现在与众不同的时尚偶像身上，比如艾瑞斯·阿普费尔（Iris
    Apfel），她说： “当你穿得和别人不一样时，你就不必和别人一样思考。” 正是这些人创造了不可能的事物：不受风格规则约束的“经典”概念。有时，即使是更古老的想法也可以通过“复古”来“创造风格”。


    大多数有抱负的想法都属于“创造风格”的范畴。这些想法可能像初生婴儿那样可爱地冲每个人咯咯笑，也可能来自不会死去或消失的古董收藏。尽管知道这种前卫的想法可能永远不会进入“流行风格”的范畴，而是径直走向“过时风格”，但所谓的早期采用者并不害怕去欢迎它并将其纳入自己的世界。当你与艺术家共度时光时，你会发现当他们的想法处于令人不舒服的“创造风格”范畴时，他们惊人地自在，并且他们完全明白自己的想法可能永远不会成为主流。以商业为导向的设计师希望看到具有大众市场潜力的创意变得流行，而有足够的经济能力创作永远不必售出的艺术品的以艺术为导向的设计师则不然。'
  - '[PAGE 94]


    John Maeda, “Start-ups vs End-ups (2013),” John Maeda’s Blog (blog), June 19,
    2016, maeda.pm/2016/06/19/start-ups-vs-end-ups-2013.


    现在，我们可以发布不完整、未完成的产品了，对那些陶醉于“创造风格”的人来说，这是一个特别激动人心的时刻。对吧？硅谷如今是一个特别繁荣的地方，这是有原因的：因为激进的想法有机会冲进平流层——不仅是为了创造风格，还是为了创造历史。在初创科技公司的历史上，没有比你正在阅读本书的这一刻更好的创业时机了。需要计算能力？按时借用别人的云。需要人手？让云为你找到他们。需要代码？有大量现成服务可以让系统启动并运行。需要钱？超过1,000亿美元的风险投资资金已经投入使用，还会有更多资金投入使用，但需要注意的是，投资者期望的是天外来客般的指数级增长，而这种增长往往以可持续增长为代价。尽管如此，考虑到如今所有可用的资源，当下是成立初创公司的最佳时机。


    初创公司的目标是什么？就是成为“终创”公司——最终获得成功的创业公司。多亏了摩尔定律，起步的部分容易多了，但得到更大规模的关注并最终像下一个谷歌那般成功并没有那么容易。我一直无法完全理解一名企业家要把一个“创造风格”赌注转化为一个成功的“流行风格”最终需要付出什么，直到我在硅谷的科技圣殿里度过了一段时光。这是一个无与伦比的生态系统，它的发明、规模和可能性都与速度较慢、笨拙的计算机研究世界大不相同，能够亲眼见证并参与其中是一种乐趣。


    | 初创公司 | 终创公司 |

    | :--- | :--- |

    | 想要有所成就 | 已经有所成就 |

    | 敬业 | 稳定 |

    | 文化正在形成 | 文化已经形成 |

    | 几乎不拥有什么 | 拥有很多东西 |

    | 几乎没有什么可失去 | 有很多东西可以失去 |

    | 第一次尝试 | 尝试了一切，知道什么是有效的 |

    | 未经证实 | 久经考验 |

    | 做需要做的事情 | 有清晰的职位和责任分配 |

    | 具有瘦权的扁平结构 | 具有规则的等级结构 |

    | 可能来来去去 | 经受了时间的考验 |

    | 全员参与制 | 等级制 |


    终创科技公司往往背负着所谓的“技术债务”，这与软件的搭建方式有关。如果软件很快就被搭建起来并且没有着眼于未来，那么当新的软件开始依赖无法长期使用的旧软件层时，债务就会显现出来。这种情况在现实世界中经常发生——例如建造一座“初创”桥梁以便经济、快速地渡河。用不了多久，这座桥就会成为在河上运输货物的关键基础设施。许多企业都依赖这座桥进入对岸的人才市场，所以很多人每天都要经过这座桥通勤。在某个时间，物流企业希望使用更重的卡车运输设备，但这座桥的设计并不能承载这些设备的重量。另外，在高峰时间桥上经常挤满了上'
  - "[PAGE 95]\n\n下班的人们。撇开现有的局限不谈，我们可以确定地说这座桥“终结”了一个成功的创业项目。\n\n由于升级这座桥以增加承重力或增加几条新车道以缓解交通拥堵的破坏程度和成本太高，这个问题只能由其用户和运营者自行解决。如果这座桥的建造者花时间为其设计更大的承重力，或者在人流量增加的情况下能轻松增加额外的车道，这座桥背负的技术债务本来是可以解决的。与此同时，在河的下游，有两家初创公司分别获得了资金来应用更新的桥梁建造技术，并且他们对现有桥梁的缺陷了如指掌。这可能会让你对“终创”桥的所有者感到有点遗憾，因为他们最终会被初创者打败。但在计算世界中，限制条件是不同的。尽管在现实世界中通常不可能解决技术债务，但在虚拟世界中确实有可能做到。这是为什么呢？因为产品的材料本质上是不完整的——它总是会发生变化。当然，这并不意味着解决技术债务很容易。\n\
    \n对终创公司来说，解决技术债务的主要限制是那些创造了现有运行系统的人——或者用我的桥梁比喻，就是那些在修改一座运行良好的桥梁时犹豫不决的建造者。尽管软件总是具有可塑性和迭代性，但是否有人愿意按照摩尔定律的步伐前进是另一回事。我曾经加入（或配合）很多终创公司工作，目睹了技术债务是如何被那些勇敢、勤奋的人解决的，他们能够维持现有系统的性能，稍微增强它，或者减缓它的退化速度。但是，要引导这些人去拆除并替换一个已经以光速运行的现有计算系统，同时冒着损害与其相连的其他所有系统的健康的风险，只可能（也应该）得到他们的冷眼相看。因为正如软件开发者杰西卡·克尔（Jessica\
    \ Kerr）所说：\n\n> “Inertia in the interface,” June 27, 2019, Jessica Kerr,  \n>\
    \ blog.jessitron.com/2019/06/27/inertia-in-the-interface/.\n\n你的软件越有用，依赖它的系统就越多，改起来就越可怕。你可不只是在拿你自己的地盘冒险。你需要渐进式交付和谨慎的数据迁移。要有向下兼容性：比平常多两倍的测试，以及处理代码中的特殊情况。你需要设计整个改变过程。\n\
    \n另一方面，一开始没有技术债务的初创公司几个月后也会开始积累债务。但是，从整体上看，它的快速发展对从河上游观察的终创公司来说看起来不太自然。在初创公司，有一种“是的，我们可以！”的感觉，而非“不，不要这么做!”。因为他们几乎没有什么可以失去，也没有任何已站稳脚跟的“正确方式”。没有什么可以被改进，所以公司可以完全自由地一直“创造风格”，直到一个潜在的“流行”想法（或者创业公司的术语“产品与市场契合”）出现在团队的雷达上。当将其呈现为纯软件形式时，以摩尔式速度和规模进行持续、稳定的改进的机会可以让公司像硅谷宠儿优步（Uber）、续趣（Pinterest）、爱彼迎等公司那样获得巨大收益。"
  - '[PAGE 96]


    对产品的改进可以采取数学上的复利效应，就像沃伦·巴菲特法则中的金钱。如果我们一年365天每天都不改进产品，那么结果就是：


    1 ^ 365 = 1


    产品完全保持不变。但如果我们每天提高1%，结果就是：


    1.01 ^ 365 = 37.8


    因此，持续的改进会成倍增加，在一年内效果会增强大约37倍。因此，在不完整产品发布后不断迭代的收益是非常可观的。


    让我们考虑另一种情况，让产品每天变差1%：


    0.99 ^ 365 = 0.03


    Dana Olsen, “The State of US Venture Capital in 15 Charts,” PitchBook, October
    29, 2018, pitchbook.com/news/articles/the-state-of-us-venture-capital-activity-in-15-charts.


    从第一年第一天开始递减，一年后只剩总值的3%，这是价值损失的极端案例，说明了不完整产品的技术债务得不到解决时会发生什么。一个平庸的想法如果不加以努力，会随着时间的推移贬值，带来可能将最初的赌注化为乌有的叠加损失。


    Brandon Chu, “Product Management Mental Models for Everyone,” The Black Box of
    Product Management, August 19, 2018, blackboxofpm.com/product-management-mental-models-for-everyone-31e7828cb50b.


    关于什么是“100%准备好”的想法是有争议的，因为这将取决于实践这一想法的团队组成。理想情况下，这是一个能够跨越“创造风格”和“流行风格”之间的鸿沟的想法——选择正确的原始想法，然后投资于改进和提炼这个不完整的想法，不断完善它。这就是布兰登·朱（Brandon
    Chu）所说的“交付的时间价值”，它把两种类型的项目区分开来：


    项目A：搭建更大/更好的功能→发布更慢。


    项目B：搭建小功能→发布更快。


    John Maeda, “Speed x Thoughtfulness,” How to Speak Machine (blog), June 2, 2019,
    howtospeakmachine.com/2019/06/02/speed-x-'
  - '[PAGE 97]


    如果你在1个月内交付项目B，那么客户就可以在当年余下的11个月里享用不断升级的产品。但是，如果你用了11个月才交付项目A，客户只在当年剩下的1个月里使用它，那么项目A的影响力甚至不一定能达到项目B的两倍。我个人有试图用项目A启动自己的初创科技公司的经历，我花了大量的钱，最后才意识到自己应该选择项目B。因此，我强烈建议你认真考虑不完整性的更高价值，以及在不断迭代的同时无情地对已发布的不完整产品感到不满的重要性。请记住，对快速迭代的需求不应该成为避免在此过程中重新评估策略的借口。正如我的朋友亚历克西斯·劳埃德（Alexis
    Lloyd）常常提到的：“速度和深思需要共存，才能创造好东西——而不仅仅是很快做出来的东西。”


    “Fire and Forget,” Wordnik, wordnik.com/words/fire%20and%20forget.


    最后，在开发软件产品时有一个常见但不吉利的短语：“发布后离开。”这与另一个更受欢迎的说法有些许相似：“一劳永逸。”军方用它来形容一种在发射后能够自行击中目标的导弹——如果这种情况一直发生就好了，但事实并非如此。“发布后离开”意味着推出一个不完整的想法，从不对其做任何改进，接受复利债务0.99^65的负面影响。因此，当你转向不完整产品的世界时，请注意，不要忽视在实现你的想法后适当地持续改进这件事。把它想象成一个还没有学会走路的婴儿，你需要照顾它，让它健康地成长。事实上，它站在“一劳永逸”导弹的对立面——如果你发射后就不管它了，它可能会以某种方式变质，让你的计算产品在不知不觉中“过时”。'
  - '[PAGE 98]


    # 情绪价值是一种刚需，而非锦上添花


    制作计算产品的专业人士就在你们当中，但他们的衣服上没有明显的污渍，他们的指尖也没有你能在建造铁路、飞机或任何类似的大型机器的人们身上找到的老茧或其他任何物理证据。软件人士悄无声息、无影无踪地将数以百万计的数字移动到合适的地方，以搭建能够高速、大规模地移动、处理、转换信息的软件机器。尽管将这些计算机器召唤到现实中可能会让人兴奋不已，但正如我指出的，他们就像职业游戏玩家或无人机操作员那样与现实脱节，双眼所见与周围的环境截然不同。虽然与机器沟通不会让你变成机器，但随着时间的推移，它会自然地影响你的心理，因为你会觉得你身边不懂得与机器沟通的人们似乎对真正发生的事情一无所知。


    当我们通过云将一个可以随着时间的推移得到改进的创意的核心内容推送给用户时，重要的是记住在实现这一切的过程中谁拥有最大的控制权。是谁呢？你猜对了。正是软件开发者。记住，他们的感受很重要——当你深入他们的世界时，你也会开始感同身受。开发者生活在无限循环的世界里，生活在细节超精确的超大系统里，生活在机器每天都越来越逼真的世界里。许多开发者了解商业和设计原则，他们可能把这些原则应用到自己创建的系统中。这使他们能够确保机器有“流行”时刻并在创意市场上取得成功——想想Adobe
    Photoshop或Gmail。但是，工程师的基本培训——我可以亲自做证——通常不包括商业或设计培训，因此，今天的大多数科技公司都存在明显的鸿沟。


    云计算正在改变商业的本质，这个事实加剧了这一鸿沟。在一个产品不再完整并且定期部署渐进式改进的世界里，其与消费者的关系从一次性购买（拥有）产品转变为一段时间内付费使用（租用）产品。以前，我们可能会为一张光盘上刻录的“已完成”软件支付数千美元，但现在我们每月只需要为定期访问云服务支付几美元。这种向周期收入模式（或者说订阅服务）的转变有很多优势，包括可扩展性、可预测性和客户的高参与度。你永远无法一次就完成最终的销售——你依靠收取订阅费用定期获得收入。为了解释这种差异，你可以将其理解为约会和结婚之间的区别：约会时你总是想要展现最好的一面，但结婚后你可能把另一半视为理所当然，变得懒惰。当你总是在“约会”客户时，不断取悦他们是至关重要的，尤其是当他们的订阅期快结束并且该续订的时候。


    就在十年前，取悦有技术头脑的客户只需要确保所有机器都能按预期工作。当有技术头脑的人将系统交付给有技术头脑的人时，他们之间的交换就像把汽车从A点运到B点的桥梁那样。这座桥不需要太漂亮，因为我们只需要它能用。无论业务关系'
  md: "\n入维多利亚和阿尔伯特博物馆的收藏。所以，让我们听听豪斯曼的至理名言，鼓起勇气去创新吧！\n\n## 完美不如理解\n\n对计算产品设计师来说，每天早上醒来后都自问该如何降低自己的高标准，是一个奇怪的开启一天的方式。你必须接受这样一个事实：你不会运用你从浏览伦敦、巴黎或纽约的最新艺术或设计展览中学到的东西，而是投身于“最小可行产品”（Minimum\
    \ Viable Product，以下简称MVP）的世界。作为MVP创作者，你的工作就是把你伟大的想法削减到只剩骨架，一种只与你最初的愿景有点相似的形式。你的目标是创造一种完全适合低成本原型的东西——任何一个有自尊的完美主义者都不可能容忍将它公开展示。但你可以从另一个角度来看这件事：用优雅适宜的形式演绎一个想法的早期阶段，然后去做更重要的工作，即了解人们对这个想法的看法，即使人们看到的是这个想法最小的可行形式。\n\
    \n你可能会思考：我怎么能在杰作完成之前就做如此卑微的展示呢？你最不希望经历的就是被设计圣殿的一名同事告诉自己做了堆……垃圾。但是，与他人分享不完整产品的美妙之处在于，它提供了一个与不同于你的人分享的机会。网络连接，加上软件可以被传输到全世界大部分设备上的事实，使分享成为可能。我们只需要把产品放到云端，任何人就可以从任何地方获取它。\n\
    \n云不仅存储了你的产品，还能即刻把产品提供给所有想尝试它的人。通过接触这些人，你就有可能了解他们对你的产品的看法。想想在公司食堂的显眼位置摆一个意见反馈箱的常见做法——这样你就可以判断人们对一个新的管理举措有什么看法。同理，给你在网上做的任何东西都附上反馈表，这样你就有机会了解人们对MVP的看法。你不再需要猜测，因为你可以通过收集来自世界各地的反馈即刻得到答案。\n\
    \n> John Maeda, “Why I Use SMS to Integrate Q&A into My Talks Instead of After\
    \ the Talk,” John Maeda’s Blog (blog), March 21, 2018, maeda.pm/2018/03/21/why-i-use-sms-to-integrate-qa-into-my-talks-instead-of-after-the-talk.\n\
    \n> Maria Popova, “In Praise of Shadows: Ancient Japanese Aesthetics and Why Every\
    \ Technology Is a Technology of Thought,” Brain Pickings, May 25, 2015, brainpickings.org/2015/05/28/in-praise-of-shadows-tanizaki/.\n\
    \n一个我深受“先交付不完整，然后学习”的方法影响的例子，是我准备会议演讲时的做法。我记得我曾经花很多时间精心地准备TED演讲用的幻灯片。后来，我反其道而行之，如今我都是毫无准备地上场。我的新方法不是精心设计约50张幻灯片，而是把我的电话号码放在屏幕上，让人们把他们想问的问题发给我。通过这个方法，我能克服自认为知道观众想要什么的偏见。取而代之的是，我能准确地给出他们想要的，而不仅仅是尽我所能地去猜。如果没有沉浸在硅谷文化中，我不相信自己会以这种方式演讲。因此，除了把日本著名的美学散文《阴翳礼赞》作为一种审美追求放在心尖，我还把由我虚构的《不完整礼赞》也放进了我的思想宫殿。\n\
    \n交付未完成和不完整产品的美妙之处，在于交付之后你可以随时改进它们。没有必要立刻完成它们——甚至永远都不需要。看看互联网，它完成了吗？完全没有。它每天都随着新技术和改进的出现而不断发展。想想20世纪80和90年代，数字设计经历了从印刷到互联网的转变，一种新的平面设计工作出现了：网站设计师。不同于设计一张海报或一本书直到得到一件完整的作品为止，一个网站在被设计后交付——但它并没有完成。我们总是需要修改或扩展这个网站，因为摩尔定律正在发生。因此，它从根本上改变了你可以完美交付视觉设计这一理念——就好比印有最终设计的纸张从被印刷出版的那一刻就开始腐烂。\n\
    \n> Esther Zuckerman, “Video Games: Art-Tested, MoMA-Approved,” The Atlantic,\
    \ November 29, 2012, theatlantic.com/entertainment/archive/2012/11/video-games-art-tested-moma-approved/321022.\n\
    > Dragan Espenschied, “Rhizome Releases First Public Version of Webrecorder,”\
    \ Rhizome (blog), August 9, 2016, rhizome.org/editorial/2016/aug/09/rhizome-releases-first-public-version-of-webrecorder.\n\
    \n自然，设计圣殿也因此抨击了网站设计——因为它阻碍了他们实现完美的高标准。所以，如今没有很多网站被博物馆收藏的简单解释，就是技术在不断变化，许多艺术和设计专家都在等它……停下来。传统主义者都希望这种名叫计算的东西很快就会被下一种东西取代，因为任何趋势终有一天会结束。他们有这样的想法和期望是很正常的——他们不懂如何与机器沟通，所以这不完全是他们的错。不过在世界各地的设计圣殿里，仍有一些思想前卫的机器沟通者。例如，策展人保拉·安东内利（Paola\
    \ Antonelli）敢于把电子游戏纳入现代艺术博物馆的永久藏品，纽约新博物馆（New Museum）的艺术团体Rhizome提供了一个名为Webrecorder的开放数字存档解决方案。无疑，我们正在取得进展，未来还会有更多进展。\n\
    \n目前，新一代产品设计师正在学着适应这样一个事实：他们的作品可能不会被载入史册，也不会被陈列在博物馆精品收藏的漂亮椅子旁边。这是因为计算产品设计师有幸拥有一个独特的机会，可以通过结合他们对客户需求的实时理解和最新的技术进步，让不完整和不完美的东西变得更加完美。他们是那些在听到人们怀疑联网汽车仪表盘上的速度计在恶劣天气下的易读性后，第二天就迫不及待地推送修改的人。过去，人们希望你知道正确的答案，称其为“已完成”，然后就不管了。如今，你更愿意接受更完美的理解，而不是更完美的产品。你知道，由于你对配方进行调整和改进的意愿，更完美的理解将使真正永恒的设计成为可能。你宁愿跑一场马拉松，而不是短跑。\n\
    \n## 一个不完整的想法只有经过迭代才能成为好想法\n\n我在前文提到设计圣殿的金色屋顶之下有三种风格：（1）过时风格；（2）流行风格；（3）创造风格。每种风格都有其内在价值和存在的理由。每种风格实践的深度都很容易被忽视和低估，所以在我们进一步讨论迭代的重要性之前，请允许我“双击”每种风格。\n\
    \n当一个想法“流行”时，它的生命周期可以通过变化延长。你会发现一款非常棒的产品一开始只有几种颜色可选，后来就推出了几类颜色。一段时间后，它在颜色、材料和饰面上甚至出现了更多的变化。然后，它在某个时刻走到尽头，步入“过时”的世界。一个创意能“流行”多久取决于它的内在力量，但营销人员尤其擅长的一种技巧可以让其持续“流行”。\n\
    \nCatherine Clifford, “Iris Apfel: 10 life lessons from a 96-year-old who is probably\
    \ cooler than you,” CNBC, March 29, 2018, cnbc.com/2018/03/29/10-life-lessons-from-96-year-old-iris-apfel.html.\n\
    \n当一个想法“过时”时，它并不会有一个体面的葬礼。它只是消失了，沦为大多数人在生活中某个时刻都会经历的无关紧要一类。它曾是那个时代的好主意，但属于它的时代已经过去了。总有一些顽固的人希望留住那个时刻，表现得仿佛世界没有改变——但总的来说，如果他们不能跟上下一个趋势，他们也会开始落后。有些人乐于选择“过时风格”，他们的不自知让他们更受喜爱而不是遭到排斥。这种情况体现在与众不同的时尚偶像身上，比如艾瑞斯·阿普费尔（Iris\
    \ Apfel），她说：“当你穿得和别人不一样时，你就不必和别人一样思考。”正是这些人创造了不可能的事物：不受风格规则约束的“经典”概念。有时，即使是更古老的想法也可以通过“复古”来“创造风格”。\n\
    \n大多数有抱负的想法都属于“创造风格”的范畴。这些想法可能像初生婴儿那样可爱地冲每个人咯咯笑，也可能来自不会死去或消失的古董收藏。尽管知道这种前卫的想法可能永远不会进入“流行风格”的范畴，而是径直走向“过时风格”，但所谓的早期采用者并不害怕去欢迎它并将其纳入自己的世界。当你与艺术家共度时光时，你会发现当他们的想法处于令人不舒服的“创造风格”范畴时，他们惊人地自在，并且他们完全明白自己的想法可能永远不会成为主流。以商业为导向的设计师希望看到具有大众市场潜力的创意变得流行，而有足够的经济能力创作永远不必售出的艺术品的以艺术为导向的设计师则不然。\n\
    \nJohn Maeda, “Start-ups vs End-ups (2013),” John Maeda’s Blog (blog), June 19,\
    \ 2016, maeda.pm/2016/06/19/start-ups-vs-end-ups-2013.\n\n现在，我们可以发布不完整、未完成的产品了，对那些陶醉于“创造风格”的人来说，这是一个特别激动人心的时刻。对吧？硅谷如今是一个特别繁荣的地方，这是有原因的：因为激进的想法有机会冲进平流层——不仅是为了创造风格，还是为了创造历史。在初创科技公司的历史上，没有比你正在阅读本书的这一刻更好的创业时机了。需要计算能力？按时借用别人的云。需要人手？让云为你找到他们。需要代码？有大量现成服务可以让系统启动并运行。需要钱？超过1,000亿美元的风险投资资金已经投入使用，还会有更多资金投入使用，但需要注意的是，投资者期望的是天外来客般的指数级增长，而这种增长往往以可持续增长为代价。尽管如此，考虑到如今所有可用的资源，当下是成立初创公司的最佳时机。\n\
    \n初创公司的目标是什么？就是成为“终创”公司——最终获得成功的创业公司。多亏了摩尔定律，起步的部分容易多了，但得到更大规模的关注并最终像下一个谷歌那般成功并没有那么容易。我一直无法完全理解一名企业家要把一个“创造风格”赌注转化为一个成功的“流行风格”最终需要付出什么，直到我在硅谷的科技圣殿里度过了一段时光。这是一个无与伦比的生态系统，它的发明、规模和可能性都与速度较慢、笨拙的计算机研究世界大不相同，能够亲眼见证并参与其中是一种乐趣。\n\
    \n| 初创公司 | 终创公司 |\n| :--- | :--- |\n| 想要有所成就 | 已经有所成就 |\n| 敬业 | 稳定 |\n| 文化正在形成\
    \ | 文化已经形成 |\n| 几乎不拥有什么 | 拥有很多东西 |\n| 几乎没有什么可失去 | 有很多东西可以失去 |\n| 第一次尝试 | 尝试了一切，知道什么是有效的\
    \ |\n| 未经证实 | 久经考验 |\n| 做需要做的事情 | 有清晰的职位和责任分配 |\n| 具有精益的扁平结构 | 具有规则的等级结构 |\n|\
    \ 可能来来去去 | 经受了时间的考验 |\n| 全员参与制 | 等级制 |\n\n终创科技公司往往背负着所谓的“技术债务”，这与软件的搭建方式有关。如果软件很快就被搭建起来并且没有着眼于未来，那么当新的软件开始依赖无法长期使用的旧软件层时，债务就会显现出来。这种情况在现实世界中经常发生——例如建造一座“初创”桥梁以便经济、快速地渡河。用不了多久，这座桥就会成为在河上运输货物的关键基础设施。许多企业都依赖这座桥进入对岸的人才市场，所以很多人每天都要经过这座桥通勤。在某个时间，物流企业希望使用更重的卡车运输设备，但这座桥的设计并不能承载这些设备的重量。另外，在高峰时间桥上经常挤满了上下班的人们。撇开现有的局限不谈，我们可以确定地说这座桥“终结”了一个成功的创业项目。\n\
    \n由于升级这座桥以增加承重力或增加几条新车道以缓解交通拥堵的破坏程度和成本太高，这个问题只能由其用户和运营者自行解决。如果这座桥的建造者花时间为其设计更大的承重力，或者在人流量增加的情况下能轻松增加额外的车道，这座桥背负的技术债务本来是可以解决的。与此同时，在河的下游，有两家初创公司分别获得了资金来应用更新的桥梁建造技术，并且他们对现有桥梁的缺陷了如指掌。这可能会让你对“终创”桥的所有者感到有点遗憾，因为他们最终会被初创者打败。但在计算世界中，限制条件是不同的。尽管在现实世界中通常不可能解决技术债务，但在虚拟世界中确实有可能做到。这是为什么呢？因为产品的材料本质上是不完整的——它总是会发生变化。当然，这并不意味着解决技术债务很容易。\n\
    \n对终创公司来说，解决技术债务的主要限制是那些创造了现有运行系统的人——或者用我的桥梁比喻，就是那些在修改一座运行良好的桥梁时犹豫不决的建造者。尽管软件总是具有可塑性和迭代性，但是否有人愿意按照摩尔定律的步伐前进是另一回事。我曾经加入（或配合）很多终创公司工作，目睹了技术债务是如何被那些勇敢、勤奋的人解决的，他们能够维持现有系统的性能，稍微增强它，或者减缓它的退化速度。但是，要引导这些人去拆除并替换一个已经以光速运行的现有计算系统，同时冒着损害与其相连的其他所有系统的健康的风险，只可能（也应该）得到他们的冷眼相看。因为正如软件开发者杰西卡·克尔（Jessica\
    \ Kerr）所说：\n\n> “Inertia in the interface,” June 27, 2019, Jessica Kerr,  \n>\
    \ blog.jessitron.com/2019/06/27/inertia-in-the-interface/.\n\n你的软件越有用，依赖它的系统就越多，改起来就越可怕。你可不只是在拿你自己的地盘冒险。你需要渐进式交付和谨慎的数据迁移。要有向下兼容性：比平常多两倍的测试，以及处理代码中的特殊情况。你需要设计整个改变过程。\n\
    \n另一方面，一开始没有技术债务的初创公司几个月后也会开始积累债务。但是，从整体上看，它的快速发展对从河上游观察的终创公司来说看起来不太自然。在初创公司，有一种“是的，我们可以！”的感觉，而非“不，不要这么做!”。因为他们几乎没有什么可以失去，也没有任何已站稳脚跟的“正确方式”。没有什么可以被改进，所以公司可以完全自由地一直“创造风格”，直到一个潜在的“流行”想法（或者创业公司的术语“产品与市场契合”）出现在团队的雷达上。当将其呈现为纯软件形式时，以摩尔式速度和规模进行持续、稳定的改进的机会可以让公司像硅谷宠儿优步（Uber）、续趣（Pinterest）、爱彼迎等公司那样获得巨大收益。\n\
    \n对产品的改进可以采取数学上的复利效应，就像沃伦·巴菲特法则中的金钱。如果我们一年365天每天都不改进产品，那么结果就是：\n\n1 ^ 365 = 1\n\
    \n产品完全保持不变。但如果我们每天提高1%，结果就是：\n\n1.01 ^ 365 = 37.8\n\n因此，持续的改进会成倍增加，在一年内效果会增强大约37倍。因此，在不完整产品发布后不断迭代的收益是非常可观的。\n\
    \n让我们考虑另一种情况，让产品每天变差1%：\n\n0.99 ^ 365 = 0.03\n\nDana Olsen, “The State of US Venture\
    \ Capital in 15 Charts,” PitchBook, October 29, 2018, pitchbook.com/news/articles/the-state-of-us-venture-capital-activity-in-15-charts.\n\
    \n从第一年第一天开始递减，一年后只剩总值的3%，这是价值损失的极端案例，说明了不完整产品的技术债务得不到解决时会发生什么。一个平庸的想法如果不加以努力，会随着时间的推移贬值，带来可能将最初的赌注化为乌有的叠加损失。\n\
    \nBrandon Chu, “Product Management Mental Models for Everyone,” The Black Box\
    \ of Product Management, August 19, 2018, blackboxofpm.com/product-management-mental-models-for-everyone-31e7828cb50b.\n\
    \n关于什么是“100%准备好”的想法是有争议的，因为这将取决于实践这一想法的团队组成。理想情况下，这是一个能够跨越“创造风格”和“流行风格”之间的鸿沟的想法——选择正确的原始想法，然后投资于改进和提炼这个不完整的想法，不断完善它。这就是布兰登·朱（Brandon\
    \ Chu）所说的“交付的时间价值”，它把两种类型的项目区分开来：\n\n项目A：搭建更大/更好的功能→发布更慢。\n\n项目B：搭建小功能→发布更快。\n\
    \nJohn Maeda, “Speed x Thoughtfulness,” How to Speak Machine (blog), June 2, 2019,\
    \ howtospeakmachine.com/2019/06/02/speed x-\n\n如果你在1个月内交付项目B，那么客户就可以在当年余下的11个月里享用不断升级的产品。但是，如果你用了11个月才交付项目A，客户只在当年剩下的1个月里使用它，那么项目A的影响力甚至不一定能达到项目B的两倍。我个人有试图用项目A启动自己的初创科技公司的经历，我花了大量的钱，最后才意识到自己应该选择项目B。因此，我强烈建议你认真考虑不完整性的更高价值，以及在不断迭代的同时无情地对已发布的不完整产品感到不满的重要性。请记住，对快速迭代的需求不应该成为避免在此过程中重新评估策略的借口。正如我的朋友亚历克西斯·劳埃德（Alexis\
    \ Lloyd）常常提到的：“速度和深思需要共存，才能创造好东西——而不仅仅是很快做出来的东西。”\n\n“Fire and Forget,” Wordnik,\
    \ wordnik.com/words/fire%20and%20forget.\n\n最后，在开发软件产品时有一个常见但不吉利的短语：“发布后离开。”这与另一个更受欢迎的说法有些许相似：“一劳永逸。”军方用它来形容一种在发射后能够自行击中目标的导弹——如果这种情况一直发生就好了，但事实并非如此。“发布后离开”意味着推出一个不完整的想法，从不对其做任何改进，接受复利债务0.99^365的负面影响。因此，当你转向不完整产品的世界时，请注意，不要忽视在实现你的想法后适当地持续改进这件事。把它想象成一个还没有学会走路的婴儿，你需要照顾它，让它健康地成长。事实上，它站在“一劳永逸”导弹的对立面——如果你发射后就不管它了，它可能会以某种方式变质，让你的计算产品在不知不觉中“过时”。\n\
    \n## 情绪价值是一种刚需，而非锦上添花\n\n制作计算产品的专业人士就在你们当中，但他们的衣服上没有明显的污渍，他们的指尖也没有你能在建造铁路、飞机或任何类似的大型机器的人们身上找到的老茧或其他任何物理证据。软件人士悄无声息、无影无踪地将数以百万计的数字移动到合适的地方，以搭建能够高速、大规模地移动、处理、转换信息的软件机器。尽管将这些计算机器召唤到现实中可能会让人兴奋不已，但正如我指出的，他们就像职业游戏玩家或无人机操作员那样与现实脱节，双眼所见与周围的环境截然不同。虽然与机器沟通不会让你变成机器，但随着时间的推移，它会自然地影响你的心理，因为你会觉得你身边不懂得与机器沟通的人们似乎对真正发生的事情一无所知。\n\
    \n当我们通过云将一个可以随着时间的推移得到改进的创意的核心内容推送给用户时，重要的是记住在实现这一切的过程中谁拥有最大的控制权。是谁呢？你猜对了。正是软件开发者。记住，他们的感受很重要——当你深入他们的世界时，你也会开始感同身受。开发者生活在无限循环的世界里，生活在细节超精确的超大系统里，生活在机器每天都越来越逼真的世界里。许多开发者了解商业和设计原则，他们可能把这些原则应用到自己创建的系统中。这使他们能够确保机器有“流行”时刻并在创意市场上取得成功——想想Adobe\
    \ Photoshop或Gmail。但是，工程师的基本培训——我可以亲自做证——通常不包括商业或设计培训，因此，今天的大多数科技公司都存在明显的鸿沟。\n\n\
    云计算正在改变商业的本质，这个事实加剧了这一鸿沟。在一个产品不再完整并且定期部署渐进式改进的世界里，其与消费者的关系从一次性购买（拥有）产品转变为一段时间内付费使用（租用）产品。以前，我们可能会为一张光盘上刻录的“已完成”软件支付数千美元，但现在我们每月只需要为定期访问云服务支付几美元。这种向周期收入模式（或者说订阅服务）的转变有很多优势，包括可扩展性、可预测性和客户的高参与度。你永远无法一次就完成最终的销售——你依靠收取订阅费用定期获得收入。为了解释这种差异，你可以将其理解为约会和结婚之间的区别：约会时你总是想要展现最好的一面，但结婚后你可能把另一半视为理所当然，变得懒惰。当你总是在“约会”客户时，不断取悦他们是至关重要的，尤其是当他们的订阅期快结束并且该续订的时候。\n\
    \n就在十年前，取悦有技术头脑的客户只需要确保所有机器都能按预期工作。当有技术头脑的人将系统交付给有技术头脑的人时，他们之间的交换就像把汽车从A点运到B点的桥梁那样。这座桥不需要太漂亮，因为我们只需要它能用。无论业务关系\n"
  mdcn: "\n入维多利亚和阿尔伯特博物馆的收藏。所以，让我们听听豪斯曼的至理名言，鼓起勇气去创新吧！\n\n## 完美不如理解\n\n对计算产品设计师来说，每天早上醒来后都自问该如何降低自己的高标准，是一个奇怪的开启一天的方式。你必须接受这样一个事实：你不会运用你从浏览伦敦、巴黎或纽约的最新艺术或设计展览中学到的东西，而是投身于“最小可行产品”（Minimum\
    \ Viable Product，以下简称MVP）的世界。作为MVP创作者，你的工作就是把你伟大的想法削减到只剩骨架，一种只与你最初的愿景有点相似的形式。你的目标是创造一种完全适合低成本原型的东西——任何一个有自尊的完美主义者都不可能容忍将它公开展示。但你可以从另一个角度来看这件事：用优雅适宜的形式演绎一个想法的早期阶段，然后去做更重要的工作，即了解人们对这个想法的看法，即使人们看到的是这个想法最小的可行形式。\n\
    \n你可能会思考：我怎么能在杰作完成之前就做如此卑微的展示呢？你最不希望经历的就是被设计圣殿的一名同事告诉自己做了堆……垃圾。但是，与他人分享不完整产品的美妙之处在于，它提供了一个与不同于你的人分享的机会。网络连接，加上软件可以被传输到全世界大部分设备上的事实，使分享成为可能。我们只需要把产品放到云端，任何人就可以从任何地方获取它。\n\
    \n云不仅存储了你的产品，还能即刻把产品提供给所有想尝试它的人。通过接触这些人，你就有可能了解他们对你的产品的看法。想想在公司食堂的显眼位置摆一个意见反馈箱的常见做法——这样你就可以判断人们对一个新的管理举措有什么看法。同理，给你在网上做的任何东西都附上反馈表，这样你就有机会了解人们对MVP的看法。你不再需要猜测，因为你可以通过收集来自世界各地的反馈即刻得到答案。\n\
    \n> John Maeda, “Why I Use SMS to Integrate Q&A into My Talks Instead of After\
    \ the Talk,” John Maeda’s Blog (blog), March 21, 2018, maeda.pm/2018/03/21/why-i-use-sms-to-integrate-qa-into-my-talks-instead-of-after-the-talk.\n\
    \n> Maria Popova, “In Praise of Shadows: Ancient Japanese Aesthetics and Why Every\
    \ Technology Is a Technology of Thought,” Brain Pickings, May 25, 2015, brainpickings.org/2015/05/28/in-praise-of-shadows-tanizaki/.\n\
    \n一个我深受“先交付不完整，然后学习”的方法影响的例子，是我准备会议演讲时的做法。我记得我曾经花很多时间精心地准备TED演讲用的幻灯片。后来，我反其道而行之，如今我都是毫无准备地上场。我的新方法不是精心设计约50张幻灯片，而是把我的电话号码放在屏幕上，让人们把他们想问的问题发给我。通过这个方法，我能克服自认为知道观众想要什么的偏见。取而代之的是，我能准确地给出他们想要的，而不仅仅是尽我所能地去猜。如果没有沉浸在硅谷文化中，我不相信自己会以这种方式演讲。因此，除了把日本著名的美学散文《阴翳礼赞》作为一种审美追求放在心尖，我还把由我虚构的《不完整礼赞》也放进了我的思想宫殿。\n\
    \n交付未完成和不完整产品的美妙之处，在于交付之后你可以随时改进它们。没有必要立刻完成它们——甚至永远都不需要。看看互联网，它完成了吗？完全没有。它每天都随着新技术和改进的出现而不断发展。想想20世纪80和90年代，数字设计经历了从印刷到互联网的转变，一种新的平面设计工作出现了：网站设计师。不同于设计一张海报或一本书直到得到一件完整的作品为止，一个网站在被设计后交付——但它并没有完成。我们总是需要修改或扩展这个网站，因为摩尔定律正在发生。因此，它从根本上改变了你可以完美交付视觉设计这一理念——就好比印有最终设计的纸张从被印刷出版的那一刻就开始腐烂。\n\
    \n> Esther Zuckerman, “Video Games: Art-Tested, MoMA-Approved,” The Atlantic,\
    \ November 29, 2012, theatlantic.com/entertainment/archive/2012/11/video-games-art-tested-moma-approved/321022.\n\
    > Dragan Espenschied, “Rhizome Releases First Public Version of Webrecorder,”\
    \ Rhizome (blog), August 9, 2016, rhizome.org/editorial/2016/aug/09/rhizome-releases-first-public-version-of-webrecorder.\n\
    \n自然，设计圣殿也因此抨击了网站设计——因为它阻碍了他们实现完美的高标准。所以，如今没有很多网站被博物馆收藏的简单解释，就是技术在不断变化，许多艺术和设计专家都在等它……停下来。传统主义者都希望这种名叫计算的东西很快就会被下一种东西取代，因为任何趋势终有一天会结束。他们有这样的想法和期望是很正常的——他们不懂如何与机器沟通，所以这不完全是他们的错。不过在世界各地的设计圣殿里，仍有一些思想前卫的机器沟通者。例如，策展人保拉·安东内利（Paola\
    \ Antonelli）敢于把电子游戏纳入现代艺术博物馆的永久藏品，纽约新博物馆（New Museum）的艺术团体Rhizome提供了一个名为Webrecorder的开放数字存档解决方案。无疑，我们正在取得进展，未来还会有更多进展。\n\
    \n目前，新一代产品设计师正在学着适应这样一个事实：他们的作品可能不会被载入史册，也不会被陈列在博物馆精品收藏的漂亮椅子旁边。这是因为计算产品设计师有幸拥有一个独特的机会，可以通过结合他们对客户需求的实时理解和最新的技术进步，让不完整和不完美的东西变得更加完美。他们是那些在听到人们怀疑联网汽车仪表盘上的速度计在恶劣天气下的易读性后，第二天就迫不及待地推送修改的人。过去，人们希望你知道正确的答案，称其为“已完成”，然后就不管了。如今，你更愿意接受更完美的理解，而不是更完美的产品。你知道，由于你对配方进行调整和改进的意愿，更完美的理解将使真正永恒的设计成为可能。你宁愿跑一场马拉松，而不是短跑。\n\
    \n## 一个不完整的想法只有经过迭代才能成为好想法\n\n我在前文提到设计圣殿的金色屋顶之下有三种风格：（1）过时风格；（2）流行风格；（3）创造风格。每种风格都有其内在价值和存在的理由。每种风格实践的深度都很容易被忽视和低估，所以在我们进一步讨论迭代的重要性之前，请允许我“双击”每种风格。\n\
    \n当一个想法“流行”时，它的生命周期可以通过变化延长。你会发现一款非常棒的产品一开始只有几种颜色可选，后来就推出了几类颜色。一段时间后，它在颜色、材料和饰面上甚至出现了更多的变化。然后，它在某个时刻走到尽头，步入“过时”的世界。一个创意能“流行”多久取决于它的内在力量，但营销人员尤其擅长的一种技巧可以让其持续“流行”。\n\
    \nCatherine Clifford, “Iris Apfel: 10 life lessons from a 96-year-old who is probably\
    \ cooler than you,” CNBC, March 29, 2018, cnbc.com/2018/03/29/10-life-lessons-from-96-year-old-iris-apfel.html.\n\
    \n当一个想法“过时”时，它并不会有一个体面的葬礼。它只是消失了，沦为大多数人在生活中某个时刻都会经历的无关紧要一类。它曾是那个时代的好主意，但属于它的时代已经过去了。总有一些顽固的人希望留住那个时刻，表现得仿佛世界没有改变——但总的来说，如果他们不能跟上下一个趋势，他们也会开始落后。有些人乐于选择“过时风格”，他们的不自知让他们更受喜爱而不是遭到排斥。这种情况体现在与众不同的时尚偶像身上，比如艾瑞斯·阿普费尔（Iris\
    \ Apfel），她说：“当你穿得和别人不一样时，你就不必和别人一样思考。”正是这些人创造了不可能的事物：不受风格规则约束的“经典”概念。有时，即使是更古老的想法也可以通过“复古”来“创造风格”。\n\
    \n大多数有抱负的想法都属于“创造风格”的范畴。这些想法可能像初生婴儿那样可爱地冲每个人咯咯笑，也可能来自不会死去或消失的古董收藏。尽管知道这种前卫的想法可能永远不会进入“流行风格”的范畴，而是径直走向“过时风格”，但所谓的早期采用者并不害怕去欢迎它并将其纳入自己的世界。当你与艺术家共度时光时，你会发现当他们的想法处于令人不舒服的“创造风格”范畴时，他们惊人地自在，并且他们完全明白自己的想法可能永远不会成为主流。以商业为导向的设计师希望看到具有大众市场潜力的创意变得流行，而有足够的经济能力创作永远不必售出的艺术品的以艺术为导向的设计师则不然。\n\
    \nJohn Maeda, “Start-ups vs End-ups (2013),” John Maeda’s Blog (blog), June 19,\
    \ 2016, maeda.pm/2016/06/19/start-ups-vs-end-ups-2013.\n\n现在，我们可以发布不完整、未完成的产品了，对那些陶醉于“创造风格”的人来说，这是一个特别激动人心的时刻。对吧？硅谷如今是一个特别繁荣的地方，这是有原因的：因为激进的想法有机会冲进平流层——不仅是为了创造风格，还是为了创造历史。在初创科技公司的历史上，没有比你正在阅读本书的这一刻更好的创业时机了。需要计算能力？按时借用别人的云。需要人手？让云为你找到他们。需要代码？有大量现成服务可以让系统启动并运行。需要钱？超过1,000亿美元的风险投资资金已经投入使用，还会有更多资金投入使用，但需要注意的是，投资者期望的是天外来客般的指数级增长，而这种增长往往以可持续增长为代价。尽管如此，考虑到如今所有可用的资源，当下是成立初创公司的最佳时机。\n\
    \n初创公司的目标是什么？就是成为“终创”公司——最终获得成功的创业公司。多亏了摩尔定律，起步的部分容易多了，但得到更大规模的关注并最终像下一个谷歌那般成功并没有那么容易。我一直无法完全理解一名企业家要把一个“创造风格”赌注转化为一个成功的“流行风格”最终需要付出什么，直到我在硅谷的科技圣殿里度过了一段时光。这是一个无与伦比的生态系统，它的发明、规模和可能性都与速度较慢、笨拙的计算机研究世界大不相同，能够亲眼见证并参与其中是一种乐趣。\n\
    \n| 初创公司 | 终创公司 |\n| :--- | :--- |\n| 想要有所成就 | 已经有所成就 |\n| 敬业 | 稳定 |\n| 文化正在形成\
    \ | 文化已经形成 |\n| 几乎不拥有什么 | 拥有很多东西 |\n| 几乎没有什么可失去 | 有很多东西可以失去 |\n| 第一次尝试 | 尝试了一切，知道什么是有效的\
    \ |\n| 未经证实 | 久经考验 |\n| 做需要做的事情 | 有清晰的职位和责任分配 |\n| 具有精益的扁平结构 | 具有规则的等级结构 |\n|\
    \ 可能来来去去 | 经受了时间的考验 |\n| 全员参与制 | 等级制 |\n\n终创科技公司往往背负着所谓的“技术债务”，这与软件的搭建方式有关。如果软件很快就被搭建起来并且没有着眼于未来，那么当新的软件开始依赖无法长期使用的旧软件层时，债务就会显现出来。这种情况在现实世界中经常发生——例如建造一座“初创”桥梁以便经济、快速地渡河。用不了多久，这座桥就会成为在河上运输货物的关键基础设施。许多企业都依赖这座桥进入对岸的人才市场，所以很多人每天都要经过这座桥通勤。在某个时间，物流企业希望使用更重的卡车运输设备，但这座桥的设计并不能承载这些设备的重量。另外，在高峰时间桥上经常挤满了上下班的人们。撇开现有的局限不谈，我们可以确定地说这座桥“终结”了一个成功的创业项目。\n\
    \n由于升级这座桥以增加承重力或增加几条新车道以缓解交通拥堵的破坏程度和成本太高，这个问题只能由其用户和运营者自行解决。如果这座桥的建造者花时间为其设计更大的承重力，或者在人流量增加的情况下能轻松增加额外的车道，这座桥背负的技术债务本来是可以解决的。与此同时，在河的下游，有两家初创公司分别获得了资金来应用更新的桥梁建造技术，并且他们对现有桥梁的缺陷了如指掌。这可能会让你对“终创”桥的所有者感到有点遗憾，因为他们最终会被初创者打败。但在计算世界中，限制条件是不同的。尽管在现实世界中通常不可能解决技术债务，但在虚拟世界中确实有可能做到。这是为什么呢？因为产品的材料本质上是不完整的——它总是会发生变化。当然，这并不意味着解决技术债务很容易。\n\
    \n对终创公司来说，解决技术债务的主要限制是那些创造了现有运行系统的人——或者用我的桥梁比喻，就是那些在修改一座运行良好的桥梁时犹豫不决的建造者。尽管软件总是具有可塑性和迭代性，但是否有人愿意按照摩尔定律的步伐前进是另一回事。我曾经加入（或配合）很多终创公司工作，目睹了技术债务是如何被那些勇敢、勤奋的人解决的，他们能够维持现有系统的性能，稍微增强它，或者减缓它的退化速度。但是，要引导这些人去拆除并替换一个已经以光速运行的现有计算系统，同时冒着损害与其相连的其他所有系统的健康的风险，只可能（也应该）得到他们的冷眼相看。因为正如软件开发者杰西卡·克尔（Jessica\
    \ Kerr）所说：\n\n> “Inertia in the interface,” June 27, 2019, Jessica Kerr,  \n>\
    \ blog.jessitron.com/2019/06/27/inertia-in-the-interface/.\n\n你的软件越有用，依赖它的系统就越多，改起来就越可怕。你可不只是在拿你自己的地盘冒险。你需要渐进式交付和谨慎的数据迁移。要有向下兼容性：比平常多两倍的测试，以及处理代码中的特殊情况。你需要设计整个改变过程。\n\
    \n另一方面，一开始没有技术债务的初创公司几个月后也会开始积累债务。但是，从整体上看，它的快速发展对从河上游观察的终创公司来说看起来不太自然。在初创公司，有一种“是的，我们可以！”的感觉，而非“不，不要这么做!”。因为他们几乎没有什么可以失去，也没有任何已站稳脚跟的“正确方式”。没有什么可以被改进，所以公司可以完全自由地一直“创造风格”，直到一个潜在的“流行”想法（或者创业公司的术语“产品与市场契合”）出现在团队的雷达上。当将其呈现为纯软件形式时，以摩尔式速度和规模进行持续、稳定的改进的机会可以让公司像硅谷宠儿优步（Uber）、续趣（Pinterest）、爱彼迎等公司那样获得巨大收益。\n\
    \n对产品的改进可以采取数学上的复利效应，就像沃伦·巴菲特法则中的金钱。如果我们一年365天每天都不改进产品，那么结果就是：\n\n1 ^ 365 = 1\n\
    \n产品完全保持不变。但如果我们每天提高1%，结果就是：\n\n1.01 ^ 365 = 37.8\n\n因此，持续的改进会成倍增加，在一年内效果会增强大约37倍。因此，在不完整产品发布后不断迭代的收益是非常可观的。\n\
    \n让我们考虑另一种情况，让产品每天变差1%：\n\n0.99 ^ 365 = 0.03\n\nDana Olsen, “The State of US Venture\
    \ Capital in 15 Charts,” PitchBook, October 29, 2018, pitchbook.com/news/articles/the-state-of-us-venture-capital-activity-in-15-charts.\n\
    \n从第一年第一天开始递减，一年后只剩总值的3%，这是价值损失的极端案例，说明了不完整产品的技术债务得不到解决时会发生什么。一个平庸的想法如果不加以努力，会随着时间的推移贬值，带来可能将最初的赌注化为乌有的叠加损失。\n\
    \nBrandon Chu, “Product Management Mental Models for Everyone,” The Black Box\
    \ of Product Management, August 19, 2018, blackboxofpm.com/product-management-mental-models-for-everyone-31e7828cb50b.\n\
    \n关于什么是“100%准备好”的想法是有争议的，因为这将取决于实践这一想法的团队组成。理想情况下，这是一个能够跨越“创造风格”和“流行风格”之间的鸿沟的想法——选择正确的原始想法，然后投资于改进和提炼这个不完整的想法，不断完善它。这就是布兰登·朱（Brandon\
    \ Chu）所说的“交付的时间价值”，它把两种类型的项目区分开来：\n\n项目A：搭建更大/更好的功能→发布更慢。\n\n项目B：搭建小功能→发布更快。\n\
    \nJohn Maeda, “Speed x Thoughtfulness,” How to Speak Machine (blog), June 2, 2019,\
    \ howtospeakmachine.com/2019/06/02/speed x-\n\n如果你在1个月内交付项目B，那么客户就可以在当年余下的11个月里享用不断升级的产品。但是，如果你用了11个月才交付项目A，客户只在当年剩下的1个月里使用它，那么项目A的影响力甚至不一定能达到项目B的两倍。我个人有试图用项目A启动自己的初创科技公司的经历，我花了大量的钱，最后才意识到自己应该选择项目B。因此，我强烈建议你认真考虑不完整性的更高价值，以及在不断迭代的同时无情地对已发布的不完整产品感到不满的重要性。请记住，对快速迭代的需求不应该成为避免在此过程中重新评估策略的借口。正如我的朋友亚历克西斯·劳埃德（Alexis\
    \ Lloyd）常常提到的：“速度和深思需要共存，才能创造好东西——而不仅仅是很快做出来的东西。”\n\n“Fire and Forget,” Wordnik,\
    \ wordnik.com/words/fire%20and%20forget.\n\n最后，在开发软件产品时有一个常见但不吉利的短语：“发布后离开。”这与另一个更受欢迎的说法有些许相似：“一劳永逸。”军方用它来形容一种在发射后能够自行击中目标的导弹——如果这种情况一直发生就好了，但事实并非如此。“发布后离开”意味着推出一个不完整的想法，从不对其做任何改进，接受复利债务0.99^365的负面影响。因此，当你转向不完整产品的世界时，请注意，不要忽视在实现你的想法后适当地持续改进这件事。把它想象成一个还没有学会走路的婴儿，你需要照顾它，让它健康地成长。事实上，它站在“一劳永逸”导弹的对立面——如果你发射后就不管它了，它可能会以某种方式变质，让你的计算产品在不知不觉中“过时”。\n\
    \n## 情绪价值是一种刚需，而非锦上添花\n\n制作计算产品的专业人士就在你们当中，但他们的衣服上没有明显的污渍，他们的指尖也没有你能在建造铁路、飞机或任何类似的大型机器的人们身上找到的老茧或其他任何物理证据。软件人士悄无声息、无影无踪地将数以百万计的数字移动到合适的地方，以搭建能够高速、大规模地移动、处理、转换信息的软件机器。尽管将这些计算机器召唤到现实中可能会让人兴奋不已，但正如我指出的，他们就像职业游戏玩家或无人机操作员那样与现实脱节，双眼所见与周围的环境截然不同。虽然与机器沟通不会让你变成机器，但随着时间的推移，它会自然地影响你的心理，因为你会觉得你身边不懂得与机器沟通的人们似乎对真正发生的事情一无所知。\n\
    \n当我们通过云将一个可以随着时间的推移得到改进的创意的核心内容推送给用户时，重要的是记住在实现这一切的过程中谁拥有最大的控制权。是谁呢？你猜对了。正是软件开发者。记住，他们的感受很重要——当你深入他们的世界时，你也会开始感同身受。开发者生活在无限循环的世界里，生活在细节超精确的超大系统里，生活在机器每天都越来越逼真的世界里。许多开发者了解商业和设计原则，他们可能把这些原则应用到自己创建的系统中。这使他们能够确保机器有“流行”时刻并在创意市场上取得成功——想想Adobe\
    \ Photoshop或Gmail。但是，工程师的基本培训——我可以亲自做证——通常不包括商业或设计培训，因此，今天的大多数科技公司都存在明显的鸿沟。\n\n\
    云计算正在改变商业的本质，这个事实加剧了这一鸿沟。在一个产品不再完整并且定期部署渐进式改进的世界里，其与消费者的关系从一次性购买（拥有）产品转变为一段时间内付费使用（租用）产品。以前，我们可能会为一张光盘上刻录的“已完成”软件支付数千美元，但现在我们每月只需要为定期访问云服务支付几美元。这种向周期收入模式（或者说订阅服务）的转变有很多优势，包括可扩展性、可预测性和客户的高参与度。你永远无法一次就完成最终的销售——你依靠收取订阅费用定期获得收入。为了解释这种差异，你可以将其理解为约会和结婚之间的区别：约会时你总是想要展现最好的一面，但结婚后你可能把另一半视为理所当然，变得懒惰。当你总是在“约会”客户时，不断取悦他们是至关重要的，尤其是当他们的订阅期快结束并且该续订的时候。\n\
    \n就在十年前，取悦有技术头脑的客户只需要确保所有机器都能按预期工作。当有技术头脑的人将系统交付给有技术头脑的人时，他们之间的交换就像把汽车从A点运到B点的桥梁那样。这座桥不需要太漂亮，因为我们只需要它能用。无论业务关系\n"
