    # 与人的尺度脱节对你有害


    “繁杂的”（complicated）意味着一件事情是可知的，尽管需要些时间，但你完全有可能理解它。你可能只需要用老派的蛮力去理解它——在这个过程中你也许会感到疲惫，但这是可行的。一台繁杂的机器（想想印刷这本书的机器或把这本书的电子版送到你手上的数字信息传递服务）是可以被理解的。


    “复杂的”（complex）是指一件事情是不可知的，你即使用蛮力也无法轻易理解它。之所以说“轻易”，是因为在21世纪，我们能使用的计算能力惊人地强大，但它仍不能解决复杂的问题。一台复杂的机器（想想任何与你有关系的人）是不可以被理解的。


    我总觉得有必要把这种区别放在显眼的位置，因为我们利用计算来构建系统的方式通常是繁杂的，但我们人类与我们构建的计算系统关联的方式却会产生我们仍未理解的复杂的影响。当你回想起影片《十的次方》和循环中的循环和分形的无限深度，以及在无限尺度上把时间和空间控制在1埃的范围内的能力，你就能理解一个在自己拥有绝对权力的无形世界里生活、呼吸、控制着一天中的每一分钟的人，会如何失去与现实的联系。或者，正如已故的人工智能先驱约瑟夫·魏森鲍姆（Joseph
    Weizenbaum）所预见的那样：


    > John Maeda, “Joseph Weizenbaum: Humanist Technologist,” John Maeda’s Blog (blog),
    February 11, 2019,

    > maeda.pm/2019/02/11/joseph-weizenbaum-humanist-technologist.


    计算机程序员是宇宙的创造者，也是这些宇宙唯一的立法者。无论有多强大，从来没有哪位剧作家、舞台导演或皇帝行使过如此绝对的权力来布置舞台或战场，指挥如此忠贞不贰的演员或军队。


    因此，考虑到编写代码赋予他们的权力和控制能力，当编写代码的人开始与现实建立不寻常的关系，甚至变得有点疯狂时，我一点也不会感到惊讶。玩电子游戏似乎可以赋予玩家类似的能力，但编写游戏代码本身将这种能力提升到近似上帝的地位。当然，我并不是说每个程序员最后都有某种上帝情结。然而，当其与其他具有破坏性的人格特征混杂在一起时，就会出现典型的“男程序员”（brogammer）——把自己的妄想和权力意识强加给别人、让别人非常不舒服的男性程序员。请记住，编写代码并不会导致这种结果，仅仅与其相关——世界上'
