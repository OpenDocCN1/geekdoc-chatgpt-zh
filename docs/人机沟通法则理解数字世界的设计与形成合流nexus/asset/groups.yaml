    ![](img/a980a6de0555167c9f36435ce714d7b4_26_0.png)'
  - '[PAGE 27]


    详见gnu.org/gnu/gnu-history.en.html。


    感受递归魔力的另一种方法是通过一个名叫Unix的专属操作系统，叛逆的程序员在20世纪80年代试图完全重写它。麻省理工学院的理查德·斯托曼（Richard Stallman）希望这样一个重要的软件系统摆脱任何限制，而非受制于其所有者AT&T。他将这一努力称为“GNU项目”。GNU概括了递归的思想，因为它表达了这样一句话：GNU不是Unix（GNU’s
    Not Unix）。请你读这句话的时候暂停一下。U代表Unix和N代表Not都不难理解。但G代表GNU就有点古怪。如果我们试着把G展开，你会看到这个表达式的无限本质：


    ```

    [G]NU''s Not Unix


    [[G]NU''s Not Unix]NU''s Not Unix


    [[[G]NU''s Not Unix]NU''s Not Unix]NU''s Not Unix


    [[[[G]NU''s Not Unix]NU''s Not Unix]NU''s Not Unix]NU''s Not Unix


    [[[[[G]NU''s Not Unix]NU''s Not Unix]NU''s Not Unix]NU''s Not Unix]NU''s Not Unix


    ......

    ```


    与之相关的实物隐喻，就是俄罗斯套娃——一个套娃里有一个和它一模一样但较小的套娃，以此类推。这是因为我们可以说一个俄罗斯套娃是根据另一个制成的。可即便是创下世界纪录的最复杂的一组俄罗斯套娃，也只有51个；至于可以计算的“俄罗斯套娃”，层与层之间的嵌套没有具体限制，除非程序员明确设置了“基本用例”。试想一下，打开一个又一个小套娃，甚至打开只有一粒米那么大的套娃，你都可以在里面找到更小的套娃。'
  - '[PAGE 28]


    ![](img/a980a6de0555167c9f36435ce714d7b4_28_0.png)


    在比俄罗斯套娃更实用的层面上，有数学头脑的人可以利用递归的想法创造优雅的概念表达，这些表达与我之前向你展示的乱糟糟的豆腐店记账程序完全不同。递归不同于循环的蛮力表达，后者更像流水线上的传送带。你列出所有的任务，接着告诉每个任务按顺序执行，然后你回到（GOTO）列表的开头，重复这一步骤，就像流水线。递归在本质上是不同的，你根据情况定义要执行的任务——就像列出在流水线上制作一大锅咖喱的步骤，关键材料之一是一小锅咖喱。最终你会得到一条在做一小锅咖喱的过程中消失的流水线，而这一过程反过来又需要更小的一锅咖喱，以此类推——你消失在你所创造的事物之中。这个概念不适合胆量不足的人。其核心思想是用定义本身来表达某事件的定义，这是一个在物质世界中只能模糊想象，找不到出处，但在赛博空间中再自然不过的概念。


    所以，现在你知道了在计算世界中有一些优雅的自我表达方式，类似于在我们有形的世界中引发思考的艺术。按照这个思路，计算思考者欣赏一种高度概念化的艺术，而它尚未被大都会艺术博物馆（The
    Metropolitan Museum of Art）收录。当程序员说“代码如诗”时，他们的确是这么想的。递归通过一种非常简洁的方式来表达复杂的思想，这些思想在本质上可以是无限且极其矛盾的，就像当你试图解释GNU时发生的事情。在计算中，把一段密码嵌入真实可用的机器是可行的。哪怕在计算机时代来临之前，递归也是一个迷人的哲学概念。换句话说，迈克尔·科尔巴里斯（Michael
    Corballis）从人文主义者的角度在他关于递归的书中简洁地表达了这一点：


    > Michael Corballis, The Recursive Mind: The Origins of Human Language, Thought,
    and Civilization (Princeton, NJ: Princeton University Press, 2011), 1.'
