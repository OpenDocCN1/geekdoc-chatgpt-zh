    没吃完，他们可能会意识到这不是客人喜欢的甜点，在下次服务中提供不同的甜点选项。我曾经在丽思卡尔顿酒店住过一次，享受过其卓越的设施和服务，我很乐意把我的所有信息交给他们，以获得omotenashi服务。
