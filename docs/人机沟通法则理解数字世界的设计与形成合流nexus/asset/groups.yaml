    ## 人机沟通法则


    后浪


    ### 理解数字世界的设计与形成


    John Maeda


    [美] 前田纲辉 作 何盈 译


    ### HOW TO SPEAK MACHINE


    北京联合出版公司 Beijing United Publishing Co.,Ltd.


    ## 写在《合流：科技与艺术未来丛书》之前


    自文艺复兴以来，艺术、技术和科学便已分道扬镳，但如今它们又显出了破镜重圆之势。


    我们的世界正日渐地错综复杂，能源危机、传染病流行、贫富差距、种族差异、可持续发展……面对复杂性问题，寻求应对之道要求我们拓宽思路，将不同领域融会贯通。通常，我们的文化不提供跨领域的训练，要在这种复杂性中游刃有余地成长，新一代的创造者们亟需某种新思维的指引。


    我们将这种思考方式称作“合一思维”（Nexus thinking），即我们这套丛书所提出的“合流”；而具有这种思维的人便是“合一思维者”（Nexus thinker），或曰“全脑思考者”（whole-brain
    thinker）。


    传统意义上，人们习惯于将人类思维模式一分为二。其一，是有法可循、强调因果的收敛思维。这种思维常与科学联系在一起。其二，则是天马行空、突出类比的发散思维。这种思维往往与艺术密不可分。整体思维的构建始于人类三大创造性领域——艺术、技术与科学——之间边界的模糊。三者交相融汇于一个名为“合一境”（Nexus）的全新思维场域。在这个场域里，迥异的范畴之间不仅互相联系，还能彼此有机地综合在一起。界限消失以后，整体便大于部分之和，各种全新的事物也将随之涌现。


    合一思考者们能看清复杂的趋势，得心应手地游走于各领域的分野之间。他们将成为未来世界的创新先驱，并引领团队在创新组织的成员之间实现平衡。


    站在科技与艺术的交叉点，我们旨在给读者提供一间课堂，将融合艺术、科技等学科的前沿读物介绍给广大读者：数据与视觉艺术，信息与自然科学，游戏与人类学，计算机与沟通艺术……我们希望能够启发读者，让你们自发地培养出一种综合而全面的视野，以及一种由“合一思维”加持的思考哲学。


    我们并不会自欺欺人地拿出直接解决当下问题的答案，那些期待着现成解决之道的读者一定会失望。在我们眼里，本套丛书更多地是一份指南。它指引着个人与团队——创造者们和各类团体——穿行于看似毫不相干的不同领域之间。我们将教会读者如何理解、抵达并利用好综合思维的场域，以及如何组建一个能善用理论工具的团队，从而游走于复杂环境之中，达到真正的创新。


    正所谓，“海以合流为大，君子以博识为弘”。


    后浪出版公司


    2022年12月


    感谢母亲伊琳娜·前田佑美（Elinor “Yumi” Maeda）教会我与人沟通的秘诀，是她让我懂得要以人们喜爱的方式对待他们——以夏威夷人的方式。


    感谢父亲前田洋次（Yoji Maeda）教会我像机器那样工作，是他让我学会如何造出客人喜爱并愿意回购的产品——以日本人的方式。


    他们比任何人都更努力地勤勉地工作，才让我有可能就读世界上任何一所大学。多亏了他们，我才学会了与机器沟通的方法。而最重要的是多亏了佑美，我也没忘记如何与人类沟通。


    ## 引言


    麻省理工学院的英文为Massachusetts Institute of Technology, 缩写为 MIT。编者注。


    苏斯博士（Dr. Seuss）因文字游戏闻名于世。编者注。


    2004年12月17日，一个寒冷飘雪的寻常新英格兰冬日，我在WordPress上开始写关于“简单法则”的网络日志。忽然一个有意思的念头闪过，我发现M、I、T
    这个字母恰好按先后次序出现在SIMPLICITY（简单）和COMPLEXITY（复杂）里，难道这是巧合吗？此外，我还有一个不那么苏斯博士的动机，我也在我的第一篇博客文章中提到了这一点：


    John Maeda, “Why Simplicity?”, Maeda’s Simplicity (blog), MIT Media Lab, December
    17, 2004, web.archive.org/web/20041230214607/http://weblogs.media.mit.edu:80/SIMPLICITY/archives/000045.html.


    我一直感兴趣于计算机（一个异常复杂的事物）和设计（传统上强调简单的事物）如何像水和油那样互不相容。


    随后这个博客被编撰成书，这本书就是《简单法则》（The Laws of Simplicity），它被迅速翻译成14种语言。为什么这本书有如此超常的影响力？我觉得是因为它刚好在iPhone问世前出版，那时计算机技术刚开始影响人们每天的生活。《简单法则》锐不可当的势头，加上苹果公司（Apple）对设计与技术的融合逐渐走向成功，竟然促使我朝着与“计算机固有的复杂性”相反的方向前进，走向“为简单而设计”。


    我想以一种在职业生涯早期采取的方法远离计算机并接近设计的本质——早在20世纪90年代，我作为一名实习平面设计师，在日本做着与麻省理工学院的工科生背景毫不相干的工作。我设法摆脱MIT里代表技术的T的束缚，结果却转了180度的弯，成为麻省理工学院媒体实验室——一个引领设计和前沿计算机技术的跨界学科实验室——的终身教授。也许是终身教授的头衔带来的无形压力，让我感到自己仿佛被困在了设计的未来之中。我希望重拾与经典设计的连接。我认为不知道如何应用自己业余获得的工商管理硕士学位，加上2008年奥巴马的那句“是的，我们可以！”的大力怂恿，再加上自己对重拾昔日的渴望，最终让我成为这座艺术与设计世界的圣殿——罗德岛设计学院的第16任校长。


    STEM泛指与科学（Science）、技术（Technology）、工程（Engineering）、数学（Mathematics）有关的学科。编者按。


    在长期领导麻省理工学院媒体实验室的工作基础上，后来发生的一系列里程碑事件让我成为设计的坚定捍卫者。这些事件包括出席国会，鼓励把代表艺术的A放进STEM®教育体系里变成STEAM；包括在硅谷风险投资公司凯鹏华盈（Kleiner
    Perkins）工作时推出“设计技术报告”（Design in Tech Reports）。所以在2019年，当一家当红的商业杂志在文章标题中引述我说的“设计实际上没那么重要”时，所有设计爱好者在网上的评论不出意料地把我拖入了互联网的泥沼。


    > John Maeda, “Fast Company on the Design in Tech Report,” Design in Tech Report
    (blog), March 24, 2019, designintech.report/2019/03/24/fast-company-on-the-designin-tech-report–%F0%9F%90%B8-edition.


    截取自那次采访的或长或短的回答，将我本来的回答曲解为了不同程度的无知和愚昧。当我的偶像哈特穆特·艾斯林格（Hartmut Esslinger）——苹果原创设计语言背后的主导者——也开始在社交媒体上攻击我时，我知道这场网络争论迎来了高潮。如果过去我曾经在设计界获得过某种“殊荣”，那么那一刻的互联网就是在裁定我应当归还这份“殊荣”，在接下来的一段时间里我将不受任何一座设计圣殿的欢迎。当时我感觉如何？糟透了。


    其实我被引述的话，是从一次长达20分钟的电话采访中断章而来的。坦率地说，这篇文章刚公开时，我很佩服编辑团队挑选的标题，它实在是极具吸引力的点击诱饵。显然，这篇文章在很长一段时间内占据了他们的网络报道点击率的榜首，且看无数刀刃向我迎面飞来就是最好的证明。最讽刺的是，我知道很少有人真正读完了整篇文章，他们只记住了标题。对他们来说，我完全贬低了设计师日常工作的价值，所以我理应受到惩罚。


    事实上，我也确实不认为设计是当下最重要的事。相反，我相信我们应该优先关注什么是计算。因为当我们试着把设计和计算结合起来时，会产生非常神奇的化学反应；当我们把商业和计算结合起来时，会产生巨大的商机。什么是计算呢？我在二三十岁走出麻省理工校园，或在四五十岁离开任何一家科技公司时，都会被问到这个问题。


    计算是一个无形的陌生宇宙，它无限广阔，同时包含无限多的细节。它是一种不遵循物理定律的原材料，在某种意义上为互联网提供了远超于电的力量。它是一种无处不在的媒介，由经验丰富的软件开发人员和科技行业控制，他们对计算的掌控程度甚至可能威胁国家主权。在“学会编程”训练营，你可能很轻松地学会编程的机制，但你没法完全理解计算。计算更像一个拥有自己的文化、问题和语言的国度，在这里光学会基础的语言是不够的，更不用说在你对它还知之甚少的时候。


    > BBC Newsnight, “David Bowie Speaks to Jeremy Paxman on BBC Newsnight (1999),”
    YouTube, youtube.com/watch?v=FiK7s_0tGsg&t=665s.


    全球各国都在有意识地推动人们更好地理解计算机和互联网是如何运作的。然而，每当一个以技术为中心的教育项目启动时，它就已经过时了。因为计算机不是以人类的速度发展的，而是和互联网一样呈指数级发展。早在1999年，当英国广播公司的一名采访者用不屑一顾的语气评论互联网时，已故音乐人大卫·鲍伊（David
    Bowie）就有先见之明地给出了另一种解释：“互联网是一种外星生命体……它才刚刚降临人间。” 自从这种外星生命体降临后，世界就变得不一样了——于我而言，传统意义上由设计圣殿定义的设计不再是产品和服务世界的基本语言。相反，它受到了由不断壮大的科技圣殿控制的新规则的支配，这种支配方式在本质上排斥那些不够了解技术的人。


    一种新的设计形式应运而生——计算设计。这种设计不怎么用到我们在物质世界中常用的工艺材料，比如纸、棉花、墨水、钢铁等。取而代之的是由新的计算技术驱动的在数字世界里造出来的事物，比如字节、像素、声音、人工智能等。它们是你的屏幕上弹出的爱人发来的信息，是在冷雨中用颤抖的手拍下的完美照片，是当你让智能音箱播放你最喜欢的鲍伊歌曲时它友好的回应——“约翰，我到了！”。我们需要对计算有最基础的认知，才能最大限度地利用这些日益智能的设备与环境的各种新型交互。


    于是，我开始思考能否找到一种让更多的非技术人士开始建立对计算的基本理解的方法，然后在了解基本概念的基础之上，开始向他们展示计算如何改变产品和服务的设计。在20世纪的大部分时间里，计算本身只在军事领域被用于计算导弹发射的轨迹。进入21世纪，正是设计让计算与商业紧密相连，更重要的是，设计让计算与人们的日常生活息息相关。当设计和对计算的深刻理解与计算带来的独特可能性相结合时，设计就变得非常重要。但是，对一个无形的陌生宇宙有直观的理解并非易事。


    本书是对我这六年探索的一个总结，我远离了“单纯的”设计，进入了对设计影响最大的核心：计算。我将带大家参观计算机的思想和文化，从它们以前简单的形式到今天我们熟知的更为复杂的形式。谨记，本书并不是为了把你变成计算学科高手而设计的——我在某种程度上极大地简化，甚至过度简化了技术的概念，这肯定会让一些专家皱眉，甚至引起他们的不满。但我希望，哪怕只有最粗糙的简化，本书也能带你了解计算在技术能力和社会文化影响方面是如何发展的，这也许会让你同时觉得印象深刻和可怕至极。


    James Poniewozik, “ ‘Black Mirror’ Finds Terror, and Soul, in the Machine,” The
    New York Times, October 20, 2016, nytimes.com/2016/10/21/arts/television/review-black-mirror-finds-terror-and-soul-in-the-machine.html.


    计算带来了一系列问题，但其中大多数问题与我们如何使用计算有关，而非来自底层技术本身。我们已经进入了这样一个时代：今天我们使用的计算机不仅是由电力和数学驱动的，还是由我们的每个动作和它们通过我们的使用过程实时了解到的信息驱动的。在未来，计算如何发展只能归因于人类，如果我们对实际情况一无所知，我们将更有可能陷入受害者的心态。因此，我们自然会想将问题归咎于一小部分——如果不是所有一——科技公司领导人。这是相当可能发生的情况，因为对无形或未知的恐惧远比对具体形象（比如一群野狼或龙卷风）的恐惧更强大。互联网这种无形的、不可见的外星力量，代表着最完美的恐惧化身：它潜伏在你生活的社区里，教育着你的孩子，暗中试图伤害所有人。这解释了为什么在当下的电影和电视节目里，充斥着对技术制造的恐怖的描述。
    6


    我一直相信，好奇心胜过恐惧——因为当我们好奇时，我们会变得富有创造力；而当我们恐惧时，我们会变得具有破坏性。这些年来，我在设计与技术两座圣殿之间切换的经历让我一直保持着好奇心。当我更深入地思考时，我觉得是我在少数成功之间有幸运经历的许多次职业失败让我仍然保持求知若饥。但说实话，我也和所有人一样，感到很累，有点懒，同时太渴望等待一位英雄奋起保护我们并为我们所有人而战。人们普遍缺乏对计算从根本上能做什么和不能做什么的理解。与其把理解的权利交予别人，我邀请你对计算的宇宙保持好奇心。


    也许本书正是为你而写的。也许你就是这个世界一直在等待的那位英雄。也许你能找到一种方法把计算具有创造力和奇迹的一面发挥出来。人类现在迫切需要这样的英雄，以将计算推进到超越当下这种虽有强大能力但心智堪比青少年的状态。作为计算世界里的新手，你可能会发现一些我们第一代技术人员还无法想象的东西。当你找到这些东西并获得成功的时候，你将为其他人树立榜样。我希望有一天你能拥有这样的英雄时刻，但现在，请先容许我为你打开与机器对话的大门。


    ## 第一章


    ### 机器循环运行


    ### 计算机擅长通过循环重复自己


    我从小就不太擅长体育，我不光是班上第二胖的孩子，而且无论如何也无法扔出或接住任意大小的球。我唯一的特殊技能就是能长时间保持清醒，这要归功于父亲的影响和他用来管理家里生意的军事化理念。但当我在学校里跑圈并且不断被同学们超过时，这一技能带给我的仅存的自豪感也消失殆尽。我一直觉得在学校里跑圈很无聊，更别提很累。虽然我不太擅长跑圈，但我也知道我不是唯一感到筋疲力尽的——即便是那些跑得最快的同学，在我到达终点的那一刻也都气喘吁吁。无论是否擅长运动、身体素质如何，我们都是终会感到疲倦的动物。


    在一件事上，计算机可以比现实世界中的任何人类、动物或机器做得更出色：重复。如果你让它从1数到1,000甚至10亿，计算机绝对不会因为感到无聊而抱怨。你只需要让它从0开始，加1，重复这一步直到达到目标数字。接下来计算机就能自己运行。举个例子，我在计算机中输入以下三行代码：


    ```

    top = 100000000

    i = 0

    while i < top: i = i + 1

    ```


    这条指令能让计算机数到10亿，用时不超过一分钟，然后它会等待我发出新的指令，在我的完全掌控下执行命令。它急于取悦我。


    试想一下：仓鼠在跑轮上不停地跑步，最终一定很累；一级方程式赛车在赛道上高速行驶，也会耗尽汽油停下来。如果仓鼠不停下来，我们会开始担忧。我们的第一反应是：太奇怪了！如果比赛中的赛车不需要进站补给，我们会惊叹：太神奇了！


    但是，一台运行程序的计算机只要接通电源就可以处于循环状态并一直运行，永远不会失去能量和热情。它是一种超机械机器，不会像真正的机械那样经历表面磨损，也不会受到重力的影响，因此它能够完美地运行。这一特性是计算机与生机勃勃、躁动不安、吱吱作响的世界的首要区别。


    我第一次接触到计算循环的力量是在1979年，当时我还在读七年级，我遇到了我人生中的第一台计算机。这对像我这种在城市贫困地区长大的人来说很不寻常。


    多亏了民权运动推动废除种族隔离的努力，我被送到一所离家一小时车程的学校就读，这里比我家附近那所破败不堪的学校要好得多。


    当时康懋达公司（Commodore）在计算机界颇有名气，当然我指的是在当时美国和欧洲的几千名计算机爱好者这种规模的圈子里。那时个人计算机还不是真正的个人计算机，因为一般家庭都买不起。康懋达个人电子交易器（Commodore
    PET）是美国制造的，它自带一个只显示荧光绿色文本的小屏幕、一个小小的触觉键盘和一个用于存储的磁带驱动器。它拥有8千字节的总内存，处理速度是1兆赫。相比之下，现在一般的手机内存是8吉字节，是当时的100万倍，运行速度为2,000兆赫，是当时的2,000倍。


    那时互联网还没出现，不能搜索任何东西。没有微软（Microsoft），不能用文字处理器或电子表格来工作。没有触摸屏或鼠标，不能直接与显示器上的内容进行交互。没有彩色或灰度像素来显示图像，无法直观地传达信息。系统只配有一种字体，文本也只有大写字母。你通过键盘控制光标在计算机屏幕中上下左右移动。你要是想让它拥有任何功能，都必须自己创建一个新程序或者把书或杂志上的代码逐行敲进去。


    可想而知，这样的计算机放在教室里，一般是没人用的——它不但没什么用，就算用起来也没有灵魂。没有具有表现力或能传达信息的图像，没有立体声或流行音乐，更没有一系列好应用带来的可操作性，只有那个矩形的光标不停地向你眨眼睛——似乎在等待着你输入指令让它服从。当你终于鼓起勇气往里面输入内容时，你很可能会得到一行大写字母回复：SYNTAX
    ERROR（语法错误），这基本上就是在告诉你：“你输入的内容出错了，我不明白你的意思。”


    不出所料，这样的计算机只吸引了少部分学生——也许是那些和我一样同理心成长得较慢的学生，或者说那些能够忍受每次击键都被报错的沉重打击的学生。我的朋友科林（Colin）的父母在波音公司（Boeing）从事计算机相关工作。他向我展示了我见过的第一个程序，他飞快地在PET中输入了以下这段没有任何语法错误的代码：


    ```

    10 PRINT "COLIN"


    20 GOTO 10

    ```


    然后他让我输入RUN……接下来发生的事让我大吃一惊，计算机开始不停地输出COLIN。我问科林计算机什么时候会停下来，他说：“永远不会。”这让我很担心。然后他使用control-C键中断了程序。光标再次闪烁起来。


    接着科林重新输入了第一行代码，但这次多了一个空格和一个分号。


    ```

    10 PRINT "COLIN";

    ```


    他接着输入RUN，计算机屏幕上显示了以下内容：


    ```

    COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN
    COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN
    COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN
    COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN COLIN . . .

    ```


    再一次，它就这样不停地向下滚动、输出文字。我自己试了一下，输入：


    ```

    10 PRINT "MAEDA " . . .

    ```


    我的名字不断重复地出现在屏幕上带给了我极大的满足感：


    ```

    MAEDA MAEDA MAEDA MAEDA MAEDA MAEDA MAEDA MAEDA MAEDA MAEDA MAEDA MAEDA MAEDA
    MAEDA MAEDA MAEDA . . .

    ```


    自从学会了这一招，我会向任何对计算机感兴趣的人表演这个“说出我的名字”的魔术。我把它展示给我当时暗恋的女同学杰西卡看。当她问我“除了这个计算机还能做些什么呢？”的时候（不妙！），我的计算机能力的缺陷变得非常明显。


    我的好奇心被点燃了，我开始阅读《字节》（_Byte_）杂志（当时仅有的两本计算相关杂志之一）。因为当时几乎没有任何可用的软件，所以学会写程序非常重要。《字节》杂志里通常印有程序的完整代码，长达好几页，让读者可以随时手动输入到计算机里——唯一的问题是，我没有常用的计算机。


    幸运的是，我母亲伊琳娜看待事情总是具有前瞻性，她希望自己的孩子能去做更伟大更好的事情。于是，她从家里在西雅图开的小豆腐店里拿出足够的钱，给我买了一台Apple
    II计算机和一台Epson打印机。为了表达对她的感激，我希望自己写的第一个程序是她在豆腐店里用得上的。因此，我开始写一个每月账单程序，希望帮她节省时间。用这个程序输入老顾客每周的订单，在月底能打印出一张账单。


