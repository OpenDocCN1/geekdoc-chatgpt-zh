    # 艺术家的视角让你保有好奇心


    担任罗德岛设计学院校长时，我认为在一个把STEM放在首位的时代，支持艺术教育是我的责任。我听到公立学校的艺术课从每周几小时缩减到几十分钟，而我成功的技术生涯很大程度上要归功于艺术，这促使我思考如何揭示STEM教育方法的局限性。它迫使我思考摩尔定律带来的利弊，让我了解到艺术与STEM交叉时产生的经济利益，这让我相信STEAM是比STEM更好的策略。把这个议题带到位于华盛顿特区的美国国会并遇到数不清的艺术和设计让位于STEM的故事，在后来促使我前往硅谷。我想了解像苹果和爱彼迎（Airbnb）这样的公司是如何在它们的产品和服务中充分利用STEAM的综合能力的。我发现了什么？那些设计氛围浓厚的公司完全理解艺术是享受生活的科学，因此，为了让客户享受在生活中使用它们的产品，它们需要让艺术家参与产品的研发过程。


    艺术家的名声往往不好——当然，我因为个人经验非常了解这一点，我的父母希望我学数学而不是艺术，因为他们担心我永远也找不到工作。这是因为艺术可能看起来深奥且无关紧要，但正是在艺术中我找到了一种与计算世界完全兼容的角度。因为艺术不仅仅是你能看到或感觉到的东西，艺术是关于去发现表象之下的东西——理解任何事物的本质核心。例如，艺术家们知道一个关于苹果的重要事实，当你只是咬一口苹果时，你不会立刻发现这个事实。


    试着凭记忆画一个苹果，你可能会画一个圆圈，在其上方画一根棍子。但苹果的形状并不基于圆或球——它更像一个有五条棱的柱体。把苹果横着切成两半，不要竖着切。你看到了什么？'
