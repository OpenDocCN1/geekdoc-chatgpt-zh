    > \n> K. Anders Ericsson, Ralf Th.Krampe, and Clemens Tesch-Römer, “The Role of\
    \ Deliberate Practice in the Acquisition of Expert Performance,” Psychological\
    \ Review 100, no. 3 (1993): 363-406, projects.ict.usc.edu/itw/gel/EricssonDeliberatePracticePR93.pdf.\n\
    \n进入设计圣殿的另一个要求——像设计师那样思考和工作——比用谷歌搜索设计的历史难多了。但是了解包豪斯学校的基本知识至少能让你一只脚踏进这个俱乐"
