    a New Impact Measure”中的附加讨论（`https：//www.alignmentforum.org/posts/yEa7kwoMpsBgaB-Cgb/towards-a-new-impact-measure`）；他写道：“我有一个理论，可实现效用保留似乎对高级自主体有效，不是因为可实现集效用的内容确实很重要，而是因为存在一个共同的效用实现权力货币。”参见Turner，“Optimal
