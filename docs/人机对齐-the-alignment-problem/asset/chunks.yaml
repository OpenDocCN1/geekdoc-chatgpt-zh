- raw: '不同的强化学习方法也有不同的假设。有些假设世界有有限数量的离散状态。有些假设你总是清楚地知道自己处于什么状态。还有些假设奖励是等价标量值，价值永远不变，当你得到奖励时，你总是清楚地知道。


    有些假设环境基本稳定。有些假设自主体不能永久改变环境，环境也不能永久改变自主体。在现实世界中，许多行为会**改变你的目标**。改变精神或调节情绪的药物就能做到这一点，至少在一定程度上和一段时间内。去国外生活，遇见某个人，甚至听某首歌也能改变。大多数强化学习都假设这一切不可能发生。一小部分研究承认这种可能性，但假设自主体会“理性地”试图保护自己免受这种变化影响。
    ^([^(677)](#fn677))


    传统的强化学习还倾向于假设自主体是环境中唯一的自主体。即使在像国际象棋或围棋这样的零和博弈中，系统也更多是在考虑“棋局”而不是“对手”，而且很少考虑对手可能会改变和适应自己的策略。在我最近与两位强化学习研究者的对话中，我们思考了将大多数RL算法置于囚徒困境中的表现。在囚徒困境中，两个同案犯必须决定是坦白（“背叛”）还是保持沉默（“合作”）。“合作”的收益最高，但必须两人都选择它，并且传统的RL自主体不能理解环境中还有另一个自主体，对方的行为依它自己而变。从短期来看，背叛似乎收益更高，也**更容易**做到，而合作则需要一定程度的默契，两个不了解彼此依赖关系的自主体无法做到这一点。
    ^([^(678)](#fn678))


    就像皮亚杰说的儿童大脑的发展：“随着智力工具的协调，他一步步发现自我，把自己作为一个活跃的对象，置于自身以外的宇宙中，置于其他活跃的对象之中。” ^([^(679)](#fn679))


    人类同样明白——借用正念导师乔恩·卡巴——金（Jon Kabat-Zinn）的话——“无论你去哪里，你就在哪里”，而RL自主体通常不认为自己是它们建模的世界的**一部分**。大多数机器学习系统认为自身对世界没有影响，因此，它们不需要对自己建模或理解自己。随着自主体变得越来越有能力，数量越来越多，这种假设只会越来越没有根据。例如，机器智能研究所的亚伯兰·登斯基（Abram Demski）和斯科特·加兰特（Scott Garrabrant）一直在呼吁所谓的“嵌入式自主体”，重新思考这个领域中已经变得如此隐蔽和根深蒂固的自我与世界的划分。
    ^([^(680)](#fn680))


    **模仿**


    第7章探讨了模仿学习的整个前提中一个基本的但没什么根据的假设：你可以将互动性世界的问题（在这样的世界里，你做出的每个选择都会改变你将看到的和经历的）视同为典型的监督学习问题（你看到的数据都是独立同分布的）。如果你看到一张猫的照片，并把它错误识别为狗，不会**改变**你接下来看到的照片。但如果是开车，本来应该往前开，你误认为要右转，那么你很快会发现自己面对的是一条不熟悉的路。这是产生“级联误差”的根本原因，数据集聚合（DAgger）之类的方法就是想缓解此类问题。这在某种意义上很像F-117夜鹰这类现代隐形战斗机的空气动力学，在所有3个轴上都不稳定，飞行必须完全准确，否则会立即导致灾难性的不稳定。在这种情况下，自动驾驶不是解决方案，而是问题的**原因**。


    模仿还倾向于假设专家和模仿者具有基本相同的能力：相同的身体，差不多相同的思维。例如自动驾驶碰巧就很符合这个假设。人类驾驶员和自动驾驶程序确实可以说是共享身体。都向同样的转向柱、车轴、轮胎和刹车发送电控信号。在其他情形中，这个假设很难成立。如果有人比你更快、更强、体格更健壮，或者思维比你更快，那么哪怕你能完美模仿他们的应对可能也没什么用。结果甚至可能是灾难性的。如果你是他们，你能做到你**想**做的事。但你不是他们。如果他们是**你**，**他们**也不会像你那样做。


    **推断**


    随着AI自主体变得越来越复杂，它们将需要对**人类**进行建模来理解世界是如何运作的，以及它们该做什么和不该做什么。如果它们把我们建模为纯粹的、无所顾忌的和准确无误的奖励最大化者，而我们不是，那就太糟糕了。如果有人想尽力帮你，但他们并不真正理解你想要什么——无论是短期目标还是人生目标——那么可能还不如不要他们帮忙。如果这个被误导的助手还如同超人一般聪明和强有力，那只会更糟。


    对于根据人类行为推断人类价值观和动机的系统，有一些假设需要澄清。一个假设是人类或专家展示的是“最优”行为。当然，肯定不是这样的。 ^([^(681)](#fn681))


    即使人类的行为存在一定程度的错误、次优或“非理性”，但这些模型通常还是会假设：人类是**专家**，而不是学生；像成人一样步伐稳健，不是幼儿的蹒跚学步；是职业直升机飞行员，不是还在入门的新手。这些模型假设，人类行为已经收敛到一组最佳实践，他们已经学成了他们想要学成的水平，或者对于给定的任务已经做到了最佳水平。从这个意义上说，称这种技术为逆强化学习有点用词不当。我们不是根据某人强化学习的过程，而是根据他们最终的行为结果（用专业术语来说，是他们“习得的策略”）来推断他们的目标和价值观。我们不是根据示范者学习达到目标的**过程**进行推断，只是事后推断。这一点在1998年的第一篇IRL论文中就提出来了。
    ^([^(682)](#fn682))


    典型的逆强化学习还假设，人类专家行动时没有意识到他们正在被观摩。合作逆强化学习则假设人类以教学的方式行事，明确地教导机器，而不仅仅是“做自己的事情”。事实上，我们在他人面前的行为往往介于两者之间。无论是做哪种强假设，如果被违反，都会引起误解。
    ^([^(683)](#fn683))


    最后，也可能最有影响的是，典型的逆强化学习系统假设只对一个人的偏好进行建模。那么我们到底怎样才能将这种方法扩展到为两个（或更多）主人服务的系统呢？


    正如斯坦福大学计算机科学家斯特法诺·埃尔蒙（Stefano Ermon）说的，让AI对齐人类价值观“是我认为大多数人都会同意的事情，但问题当然在于定义这些价值观到底是什么，因为人们有不同的文化，来自全世界不同的地方，有不同的社会经济背景，所以他们对这些价值观会有非常不同的看法。这才是真正的挑战”。
    ^([^(684)](#fn684))


    路易斯维尔大学的计算机科学家罗曼·亚姆波尔斯基（Roman Yampolskiy）同意这种观点，他强调：“我们人类并不认同共同的价值观，甚至认同的部分也会随时间推移而变化。”
    ^([^(685)](#fn685))


    这里有一些重要的细节问题：如果一半的用户在岔路口想往左，另一半想往右，正确的行为显然不是“等分差异”，往分界线走。


    随着机器学习开始与其他学科交融，还有无数悖论等着我们，这些学科本身长期以来就存在各种问题，有些学科几个世纪以来一直纠结于调和多人偏好：政治哲学和政治科学、投票和社会选择理论。
    ^([^(686)](#fn686))


    在结束对机器学习的假设的讨论之前，将镜头稍微拉远点。所有机器学习体系结构都在多个层次上隐含依赖某种迁移学习。它假设它在现实中将遇到的情形平均来说类似于它在训练中遇到的情况。前面的几个问题都是这个问题的不同版本，像过拟合这样的经典机器学习陷阱就是例子。


    然而，世界顽固而持续的**变化**趋势直接否定了这一假设。我曾听一位计算语言学研究员抱怨说，无论他们怎么做，都无法让他们的模型复现另一位研究员一两年前发表的结果的准确性。他们一遍又一遍检查，想知道哪里做得不一样？


    结果发现，没什么不一样。训练数据来自2016年。2017年的书面语言和口语存在略微但可以测量到的差异。2018年的语言差异则更大。这就是所谓的“分布偏移”的例子。任何试图复现论文结果的人都**无法**达到原来的准确率水平，至少用原来的训练数据做不到。随着世界的发展，用2016年的数据训练的模型将慢慢丧失准确性。
    ^([^(687)](#fn687))


    ――――――


    总之，各种事实提醒我们，“地图不等于疆域”。正如布鲁诺·拉图尔（Bruno Latour）写道：“我们把科学当成现实主义绘画，想象它是世界的精确复制品。科学完全不是这么回事——绘画也是如此。一步一步，它们将我们连接到一个对齐的、变化的、构建的世界。”
    ^([^(688)](#fn688))


    这对于即将到来的世纪是一个警示，相当乏味和无趣，也正因此，我认为有被公众忽略的危险。


    我们可能失去对世界的控制，不是对AI或机器本身，而是对**模型**。对存在的和我们想要的东西给出形式化的、通常是数字的说明。 ^([^(689)](#fn689))


    就像艺术家罗伯特·欧文（Robert Irwin）说的：“从人类生存在结构中或依托结构生存，变成了结构生存在人类中或依托人类生存。”在这个背景下，这些话成了警示。


    尽管这本书讲述的是一个进步的故事，但我们不能认为我们已接近完成。事实上，在机器学习中，最危险的事情之一就是找到一个相当好的模型，宣布胜利，然后开始混淆地图和疆域。


    人类的整体记忆非常肤浅，顶多一个世纪；每一代人来到这个世界时都认为事情就**是**这样。


    即使我们——每个从事AI和伦理、AI和技术安全工作的人——恪尽职守，即使我们能够避免明显的反面乌托邦和灾难（这一点还远未确定），我们**仍然**必须克服根本性的、可能是不可阻挡的发展，发展成一个越来越形式主义的世界。我们必须这样做，即使我们的生活、想象力和身体会无可逃避地被这些模型塑造。


    这就是罗德尼·布鲁克斯著名的机器人宣言的阴暗面：“世界是它自己最好的模型。”


    这一点越来越成立，但不是以布鲁克斯本来的意思。世界的最优模型代替了世界本身，并威胁要扼杀真正的世界。


    我们必须非常小心，不要忽视那些不容易量化或者不容易纳入模型的东西。借用汉娜·阿伦特的话来说，危险不在于我们的模型是错的，而在于它们可能成为事实。


    其他科学领域很可能不会有这个问题。对牛顿力学的依赖不会让水星近日点进动与理论不符的麻烦消失；在牛顿之后的200年里，它仍然存在，等待爱因斯坦给出解释。然而，在人类事务中，这种危险是真实存在的。


    2018年，优步自动驾驶汽车在亚利桑那州坦佩市撞死了过马路的伊莱恩·赫尔茨贝格。美国国家交通安全委员会在对事故的审查中，发现“系统从未将她归类为行人……因为她在没有人行横道的地方过马路；该系统的设计没有考虑乱穿马路的行人”。
    ^([^(690)](#fn690))


    也许正因为诸如此类的原因，我们发现在大自然中度过的时光是如此令人怀念。 ^([^(691)](#fn691))


    体制的决策越来越依赖于明确的、形式化的衡量标准。我们在与任何系统交互时，系统也在越来越多地调用我们自身行为的形式化模型，可能是一般的用户行为模型，也有可能是为我们定制的简化模型。


    这本书讲述的就是这些模型的力量，它们出错的方式，以及我们尝试让它们与我们的利益对齐的方式。


    ――――――


    有充分的理由感到担忧，但我们最后的结论是不必悲观。


    我们已经看到，对机器学习的伦理和安全问题的关注已经形成浪潮。资金正在筹集，禁忌正被打破，边缘问题正在成为核心，机构正在进驻，最重要的是，一个深思熟虑的、参与式的社群正在发展并开始运作。警报已经拉响，第一批应对人员已到达现场。


    我们也看到了对齐项目有多诱人和充满希望，尽管同时也存在危险。随着我们构建出不仅能理解我们的显式命令，还能理解我们的意图和偏好的系统，容易量化的和严格的程序性意志的主导地位在某种程度上将被削弱，这些是早期不得不手工打造的模型和软件的遗存。不可言喻的无须彻底让位给明确清晰的。由此，未来的技术会加剧一些现存的问题，但也会缓解其他问题。


    我们在导言中曾说过，这也是难得的让个人和社会审视自我的机会。这是对齐的故事中激动人心的一面，甚至是一种救赎。有偏见和不公平的模型，如果不假思索地应用，可能会加剧现有的社会问题，但它们的存在也让这些往往微妙而分散的问题浮出水面，从而促使人们对社会本身进行反思。不公平的审前拘留模型反过来凸显了事情本身的不公平。有偏见的语言模型反过来给我们提供了方法来评估我们的语言状况，并提供了一个参照，让我们可以努力改善自己。


    在真实的人类世界中训练出来的透明可解释的系统，让目前处于黑暗中的事物得以显现，并且有可能提供解释。通过了解一种思维如何认识世界并做出反应，我们也将认识世界，也许还能认识思维。


    所谓的通用AI-和我们一样聪明的实体——的前景将会给我们一面终极镜子。我们从其他动物身上学到的可能还太少，我们将能直接发现智能的哪些特性似乎是普遍的，哪些只有人类才有。仅此一点，就预示着既可怕又令人激动的前景。但我们至少能认清事实，而不是凭空想象。


    对齐会很混乱，这是很自然的。


    无论好坏，它的故事都将是我们的故事。怎么可能不是呢？


    ――――――


    1952年1月14日，BBC制作了一个广播节目，召集4位杰出科学家进行圆桌对话。主题是“可以认为自动计算机器会思考吗？”4位来宾分别是计算机科学的创始人之一图灵，他在1950年就此主题写的论文现在已成为传奇；科学哲学家理查德·布莱斯维特（Richard Braithwaite）；神经外科医生杰弗里·杰弗逊（Geoffrey Jefferson）；数学家和密码学家马克斯·纽曼（Max Newman）。


    科学家们开始讨论机器如何学习以及人类如何教机器的问题。


    图灵说：“的确，当孩子接受教育时，他的父母和老师会不断干预，阻止他这样做或鼓励他那样做。但是当人试图教机器时，情况就不一样了。我做了一些实验，教机器做一些简单的操作，在得到任何结果之前，需要大量这样的干预。换句话说，机器学得太慢了，需要大量的教学。”
    ^([^(692)](#fn692))


    杰弗逊打断了他。“是谁在学习呢，”他说，“你？还是机器？”


    “嗯，”图灵回答，“我想我们都在学。”


    # **致谢**


    有执行器的神经系统可以做标记，就像在纸上留下墨迹。它可以随时回看那些标记……通过简单的调理，标记可以成为神经系统思考的任何事物的符号。通过类似的调理，它们可以向其他神经系统传递同样的意思。因此，通过符号的方式，计算和结论在同一时间被许多神经系统共享，并延续到遥远的未来。这其实就是语言、文学、哲学、逻辑、数学和物理的故事。


    ——沃伦·麦卡洛克 ^([^(693)](#fn693))


    这本书主要是对话的产物，成百上千次的对话。有些是提前几个月就安排好了，有些是偶然遇到，有些需要旅行几千公里，有些由跨越数千公里的互联网数据包传递，有些只需要走几步路。有些是在安静的办公室里录音，有些是在开会的礼堂小声嘀咕，有些则是在喝饮料时大声嚷嚷。有些在世界上最庄严的机构，有些在攀岩馆、浴池或餐桌上。有些人更喜欢采访和口述历史，有些人喜欢在大学的商店里谈话，有些人喜欢一边闲逛一边聊天。


    思想是社会性的。它们在对话中相继出现，不属于任何个人。每当我与人交谈时，如果我知道或感觉当前的想法可能会写进书里，我都会尽量记下来。我做了很多这样的笔记。但还是有很多场合我没能做到这一点，我先诚恳道歉。但我确信，至少是与下面这些人的对话和交流成就了这本书：'
