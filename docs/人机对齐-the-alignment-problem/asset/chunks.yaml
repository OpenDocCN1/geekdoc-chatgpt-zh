- raw: '事实上，整个“生物力学”领域都是为了回答这类问题。例如，研究人员长期以来对四足动物的各种步态感兴趣：行走、小跑、慢跑、疾驰。19世纪后期，高速摄影的发明解决了这些步态到底是如何运作的问题：什么时候抬哪条腿，马在疾驰时是否会完全腾空。（1877年，我们知道了的确会。）然后，在20世纪，争论焦点从**如何**转移到了为**什么**。


    1981年，哈佛大学动物学家查尔斯·泰勒（Charles Richard Taylor）在《自然》期刊上发表了一篇长文，认为马从小跑转为疾驰的过程能最大限度减少马的总能耗。
    ^([^(541)](#fn541))


    这就是罗素走向超市时思考的问题。罗素告诉我：“我从家里出来下山往超市走。我注意到，因为是下坡，我的步态与平地略有不同。我当时想，怎样才能预测步态的差异。比方说把一只蟑螂放在斜坡上……”他做了个手势，“蟑螂会怎么走？能预测吗？如果知道优化目标，就可以预测地面倾斜时蟑螂会怎么走。”


    到20世纪90年代末，强化学习已成为一种强大的计算技术，用于在各种（当时相当简单的）物理和虚拟环境中生成适当的行为。对多巴胺系统和蜜蜂觅食行为的研究也越来越清晰地表明，强化学习可以为理解人类和动物行为提供很好的框架。
    ^([^(542)](#fn542))


    只有一个问题。典型的强化学习场景假设，试图最大化的“奖励”是什么是完全清楚的，在动物行为实验中是食物或糖水，在AI视频游戏中是分数。但是在现实世界中，“奖励”的来源远不是那么明显。**步行**的“分数”是什么？


    罗素在伯克利树木繁茂的林荫大道上边走边想，如果人类的步态是答案，而强化学习是身体寻找答案的方法，那么……问题是什么？


    为此罗素在1998年写了一篇论文，提出了**逆强化学习**（IRL）。他认为，这个领域需要解决的不是常规的强化学习那样的问题，“给定一个奖励，什么行为可以优化它？”而是反过来：“给定观察到的行为，什么奖励——如果有的话——正在被优化？”
    ^([^(543)](#fn543))


    当然，用不那么正式的话来说，这是人类生活的基本问题之一。**他们到底认为自己在做什么？**我们在生活中用了很大一部分脑力来回答这个问题。我们观察其他人的行为——朋友和敌人，上级和下级，合作者和竞争对手——并试图**通过**看得见的行为来推断看不见的意图和目的。从这个角度来说，它是人类认知的基石。


    这个问题成了21世纪AI的开创性和关键主题之一。它很可能是对齐问题的关键。


    **从示范中学习**


    对于想要猜测他人行为背后的含义或意图的人来说，有时会感觉到，任何行为都可能有无限多的意味。**他是喜欢我，还是对谁都这么好？他是因为什么事对我不满，还是只是心情不好？他这样做是有意还是无意？**


    对此，计算机科学只能提供安慰，而不是解药。**任何行为都可以有无限多的含义。**


    从理论上，这个问题求解无望。在实际中，这个故事似乎还有点希望。


    逆强化学习是数学中著名的“不适定”问题，即没有唯一解的问题。例如，有许多奖励函数族，从行为角度来看，它们完全没区别。另一方面，从总体来看，这种模棱两可无关紧要，因为人的行为不会因此改变。例如，拳击碰巧使用了“10分制”，即一个回合的胜者得10分，败者得9分。如果一个新手错误地认为，回合得分是1000万分和900万分，或每点1000万分和每点900万分，或11分和10分，仍然是总分高的人获胜，他的拳击与“正确”知道评分系统的人没什么不同。所以错误是难免的，但不会有实质影响。
    ^([^(544)](#fn544))


    但还有更棘手的问题：是什么让我们认为这个人的行为有任何意义？也许他们没什么目的，行为是随机的，仅此而已。


    在给出IRL问题的具体解决方案的第一篇论文中，罗素和他当时的博士生吴恩达举了一些简单例子来证明这个想法可行。 ^([^(545)](#fn545))


    吴恩达和罗素在他们的IRL系统中设置了一些简化假设。假定玩家从不随机行动，也从不犯错：当玩家采取行动时，该行动是实际上可能的最佳行动。还假设激励自主体的奖励是“简单的”，即任何**可以**被认为分值为0的行为或状态都**应该**被认为分值为0。
    ^([^(546)](#fn546))


    这些假设都太强，以至于适用范围很窄，没有任何直接的实际用途，也与人类步态的复杂性相去甚远，但确证了IRL的有效性。IRL系统推断的奖励与实际奖励非常相似。吴恩达和罗素让IRL系统最大化它认为的奖励来玩游戏，它的得分（以“真实”分数衡量）和直接用真实分数优化的系统的得分一样高。


    吴恩达获得博士学位后去了斯坦福任教。2004年，他指导博士生彼得·阿贝尔（Pieter Abbeel）在IRL问题上又迈进了一步，增加了环境复杂性，放宽了一些推断假设。
    ^([^(547)](#fn547))


    这种方法与第7章讨论的严格模仿方法很不一样。阿贝尔的示范驾驶只有1分钟，如果是直接模仿行为的模型，会因为缺乏足够的信息而无法继续前进，道路环境太复杂了。虽然阿贝尔的行为很复杂，但他的目标很简单；IRL系统只用几秒钟就学会了不要撞车，不要偏离道路，如果可能的话保持在右边车道。这个目标结构比驾驶行为本身简单得多，更容易学习，面对新情况也更具适应性。IRL自主体没有直接学习他的**行为**，而是在学习他的**价值观**。


    他们决定，是时候让IRL面对现实世界的混乱了。


    第5章曾介绍吴恩达利用奖励塑造教直升机悬停，和沿着平直的轨迹缓慢飞行，在此之前还没有计算机控制系统能实现这样的壮举。无论是对吴恩达的职业生涯还是对整个机器学习来说，这都是一个重要里程碑，但是后来的进展停滞不前。“坦率说，我们撞上了一堵墙，”吴恩达说，“有些事情我们一直不清楚如何教直升机做。”
    ^([^(548)](#fn548))


    部分原因在于，悬停和以低速沿固定路径飞行都很容易用传统的奖励函数解决。悬停时，只需对直升机在各个方向的速度接近0进行奖励；沿路径飞行时，奖励沿着路径前进，惩罚偏离。这类问题的目标容易确定，然后只需找到某种方法，教系统通过控制叶片扭矩、俯仰和角度来**完成**任务。这正是强化学习的优势。


    但对于更复杂的机动和特技，速度更快，空气动力学也更复杂，甚至都不清楚如何设计奖励函数，让系统可以据此学习它的行为。当然，你可以简单地在空间画一条曲线，告诉计算机试着按照精确的轨迹飞行，但是物理定律可能不允许，尤其是在高速飞行时。直升机在轨迹的某些部分可能速度太快，应力可能太大，发动机可能无法及时输出足够的动力，等等。直升机有可能坠毁，对于速度达72千米/时，重达4.8千克的直升机来说，这既昂贵又危险。该团队写道：“我们手工编码轨迹的尝试一再失败。”
    ^([^(549)](#fn549))


    他们想到，**可以**让人类专家操纵飞行，利用IRL让系统**推断**人类想要实现的目标。使用IRL方法，2007年，阿贝尔和吴恩达与亚当·科茨（Adam Coates）合作，实现了有史以来第一次由计算机控制的直升机前翻和副翼侧滚。
    ^([^(550)](#fn550))


    但他们并不满足于停留在已取得的辉煌成就。他们想尝试表演即使是专家级人类示范者——遥控直升机飞行员加雷特·奥库（Garett Oku）——也无法完美完成的动作。阿贝尔、科茨和吴恩达想把他们的直升机研究推向极致：建造一架电脑控制的直升机，能够进行**超越**人类飞行员能力的令人瞠目结舌的特技表演。


    他们有一个重要的洞察。虽然奥库不能完美完成理想的动作，但只要他的尝试足够好，在多次尝试中，不完美的地方不会是一样的。一个逆强化学习而非严格模仿的系统，可以通过一系列不完美或失败的尝试推断人类飞行员的意图。
    ^([^(551)](#fn551))


    到2008年，通过对专家示范的推断，他们获得了大量突破，记录了第一次成功的自主演示“连续原地翻转和翻滚、连续机头朝上的俯仰、环圈、带回旋的环圈、带回旋的失速转弯、‘龙卷风’（快速倒飞漏斗）、刀锋、殷麦曼回旋、拍打、侧向俯仰、移动翻转、倒尾滑行，甚至自动旋转着陆”。
    ^([^(552)](#fn552))


    他们雄心勃勃的终极目标是被普遍认为最困难的直升机操作：一种名为“混沌”的动作，这个动作是如此复杂，只有一个人能做到。


    “混沌”飞行是柯蒂斯·杨布拉德（Curtis Youngblood）发明的。他是1987、1993和2001年的模型直升机世界冠军；2002和2004年的3D大师赛冠军；1986、1987、1989、1991、1993、1994、1995、1996、1997、1998、1999、2000、2001、2002、2004、2005、2006、2008、2010、2011和2012年全美冠军。
    ^([^(553)](#fn553))


    “发明这个动作的时候，我在想，”杨布拉德说，“我能想到的最复杂的控制策略是什么。”他决定做一种最困难的动作——自旋翻转——并且是**在旋转的同时**反复做。


    当被问及还有多少飞行员有把握完成这个动作时，杨布拉德说没有。“我曾经能做到，现在也做不了……如果让我做，不练习就做不完整。”


    他说，之所以不常做，部分原因是这个动作过于复杂，只有资深飞行员才能看明白其中的门道。“你通常是进行表演，试图让观众惊叹。但观众并不懂你在做什么。所以，你做一个真正的混沌或是简单一点的自旋翻转，对他们没有区别。观众中通常没有谁真正懂这个，除非是给顶级飞行员演示。”
    ^([^(554)](#fn554))


    到2008年夏天，斯坦福的直升机已经掌握了“混沌”技巧，尽管从未见过一次完美的演示，无论是奥库、杨布拉德或其他任何人。但是就像幼儿看着大人搬着一摞杂志撞到柜门一样，系统看着他们一次又一次自旋翻转，同时每次旋转300度，看起来像一场直升机龙卷风，它决定自己也来试试。
    ^([^(555)](#fn555))


    与此同时，IRL的框架被继续扩展，出现了各种消除行为歧义的方法，以及更复杂的奖励表示方式。2008年，当时还在CMU攻读博士的布莱恩·齐巴特（Brian Ziebart）与人合作开发了一种基于信息论的方法。与其假设我们观摩的专家是完美的，我们可以认为他们只是有更高概率采取能获得更多奖励的行动。反过来，我们可以用这个原则来寻找一组奖励，最大化特定演示行为的概率，同时尽量保持不确定性。


    齐巴特将这种所谓的最大熵IRL方法应用于20多名真正的匹兹堡出租车司机的10万公里驾驶数据集，用来模拟他们对某些路径的偏好。该模型能可靠地猜测司机前往特定目的地会走哪条路线。更令人惊讶的是，它还可以根据司机到目前为止走的路线，合理猜测目的地。（齐巴特意识到，这样就有可能在司机没有告诉系统目的地的情况下，提醒司机前方路况。）
    ^([^(556)](#fn556))


    在过去10年里，机器人学中出现了研究“动觉式教学”的浪潮，人类手动移动机器人手臂完成某些任务，机器人系统必须推断出相应的目标，以便在稍微不同的环境中能自行再现类似行为。
    ^([^(557)](#fn557))


    **一看便知：根据反馈学习**


    逆强化学习已被证明是一种强有力的方法，当用手工明确地编程奖励不可行甚至不可能时，能将复杂目标输入系统。但这样做通常还是需要旁边有专家给出预期行为的示范（即使不完美）。直升机特技表演需要有技艺高超的飞行员；出租车需要有司机；同样，放盘子和倒杏仁露也需要有人类示范。还有其他方法吗？


    生活中有很多事情很难**做到**，但相对来说容易**评判**。我可能是糟糕的遥控直升机飞行员，甚至不能让直升机飞起来，但我能辨认出精彩的空中特技飞行（可能除了“混沌”）。正如杨布拉德指出的，给外行观众留下深刻印象也很重要。


    如果系统能够仅仅根据我的**反馈**——我给它的行为演示打的分数，或者我对两个不同演示的偏好——推断出明确的奖励函数，那么我们将会有一个强大的、更通用的方式来传达我们想让机器做的事情。也就是说，即使我们说不出想要什么，即使我们**做**不到我们想要的，我们仍然有办法实现对齐。在一个完美的世界里，只需当我们看到时能够判别就够了。


    这是一个强有力的想法。只有两个问题。这真的可能吗？它安全吗？


    2012年，简·雷克（Jan Leike）在德国弗莱堡攻读硕士学位，做的是软件验证：开发工具自动分析某些类型的程序，确定它们是否能成功执行。 ^([^(558)](#fn558))


    雷克向澳大利亚国立大学的计算机学家马库斯·哈特（Marcus Hutter）寻求职业建议。“我很冒昧地发了封邮件，告诉他我想攻读AI安全的博士学位，你能给我一些去哪里的建议吗？然后我附上了一些我做过的工作之类的东西，希望能得到回复。”哈特马上回信了。“你应该来**这里**，”他写道。但离申请截止日期只有3天了。


    雷克笑道：“你要知道，我的母语不是英语，也没有参加过英语测试。我必须在3天内完成所有的一切。”此外，雷克还要从头开始写一份研究计划。还有，他那周正在度假。“你可想而知，那3天我没怎么睡觉。”


    雷克强调：“顺便说一下，关于如何选择攻读博士，这是很糟糕的示范。我基本上没有做功课，就冒昧给人发邮件，然后决定申请那里。很显然，这种方式不值得学习！”


    年底时，雷克已经搬到了堪培拉，跟随哈特做研究。他于2015年末获得博士学位，研究的是哈特的AIXI框架（第6章曾提到过），并发现了这种自主体可能出现“严重行为不当”的情形。
    ^([^(559)](#fn559))


    “当时，我在思考价值对齐，”雷克说，“思考如何做到这一点。似乎很多问题都与‘如何学习奖励函数’有关，所以我联系了克里斯蒂诺和阿莫代伊，我知道他们也在思考类似的问题。”


    克里斯蒂诺和阿莫代伊在旧金山的OpenAI，隔着半个地球。他们对此非常感兴趣，三人一拍即合。克里斯蒂诺刚刚加入公司，正在寻找有前景的第一个项目。他开始尝试用更少的监督进行强化学习，不是每秒15次不断更新分数，而是更定期的更新，就像监督员定期检查。当然，可以基于比如说雅达利游戏进行修改，只周期性地而不是实时地告知自主体分数，但是他们觉得，如果让真正的人类提供这种反馈，这篇论文将更有可能引起轰动，并且能为今后的对齐项目提供更清晰的建议。


    克里斯蒂诺和OpenAI的同事，以及雷克和他在DeepMind的团队，决定把他们的头脑（和GPU）汇集到一起，深入研究机器如何向人类学习复杂的奖励函数的问题。该项目最终将诞生2017年最重要的AI安全论文之一，之所以引人瞩目，不仅在于它的发现，还在于它的象征意义：世界上两个最活跃的AI安全研究实验室的重要合作，以及对齐研究的诱人前景。
    ^([^(560)](#fn560))


    他们构想了一个计划，以前所未有的规模测试在没有示范的情况下的逆强化学习。他们的想法是，让系统在某种虚拟环境中运行，定期向人类发送行为视频的随机剪辑。根据屏幕提示，人类只需“看剪辑视频，并指出哪个视频中做得较好”，系统将尝试基于人类的反馈来细化其关于奖励函数的推断，然后（和典型的强化学习一样）再利用这个推断的奖励来塑造表现良好的行为。它会继续改进自己，朝着对真正奖励的最优猜测前进，然后发送新的视频剪辑供评判。


    该项目的一部分是在存在明确的“客观”奖励函数的环境中进行——即经典的雅达利游戏，在这类游戏中，直接的强化学习已经证明了自己的超人能力——测试时不让自主体知道它的游戏分数，由人类评判哪个视频片段“更好”，自主体据此生成对奖励函数的最优猜测。在大多数情况下，该系统表现得相当好，尽管它通常无法达到能直接获知分数的自主体的超人性能。然而，在涉及复杂传球动作的《耐力赛车》中，根据人类反馈推断分数比使用游戏分数**更有效**，这表明人类成功达成了某种奖励塑造。


    “如果是存在明确奖励的场景，就像雅达利游戏这样，那就很好办，”雷克说，“因为可以检验效果。你可以检验价值一致性，即‘你的奖励模型与真正的奖励函数有多一致？’”


    团队**还**想训练强化学习系统去做一些完全主观性的事情。这些事情不存在“真实”分数，或者复杂得难以描述，以至于不可能人工明确给出一个数值奖励，但同时又很容易判别，人只要看到了就能知道。


    他们发现有一件事情可能符合条件：**后空翻。**


    “我正好在看机器人，”克里斯蒂诺说，“然后我想，这些机器人应该能做到的最酷的事情是什么？” ^([^(561)](#fn561))


    其中一个虚拟机器人叫做“单足跳”，看起来像一条没有身躯的腿，有一只超大的脚。“我的第一个目标，也是最雄心勃勃的目标是，”克里斯蒂亚诺说，“这个机器人的构造似乎应该能做后空翻。”


    计划是这样：将这个简单的机器人放在名为MuJoCo的虚拟物理模拟器中——除了摩擦力和重力之外几乎没有任何其他东西的玩具世界——并试图让它做后空翻。 ^([^(562)](#fn562))


    克里斯蒂诺耐心地观看一对对的视频剪辑，反复挑选哪一个看起来更像后空翻。左，右，右，左，右，左，左。


    “每当它取得了小小的进步，我都非常高兴，”克里斯蒂诺说，“它最开始翻倒，即使是随机的，我也很高兴，因为有时会向正确的方向翻倒。当它总是朝正确方向倒下时，我很高兴。进步很缓慢，因为你只是按左或右。所以……看了很多视频。”


    “我想最让我兴奋的可能是，”他回忆道，“当它开始坚持跳跃时。”


    大约过了一个小时，比较了几百个视频片段后，它开始做漂亮、完美的后空翻：像体操运动员那样曲体，然后稳稳落地。


    实验由多人重复进行，后空翻总是略有不同，就好像每个人都在表达自己的美感，自己理想的后空翻。


    克里斯蒂诺参加了OpenAI的团队周会，并展示了视频，“看！我们可以做到，”他回忆自己在会上说的话，“每个人都说，兄弟，这很酷。”


    “我对结果非常满意，”雷克说，“因为，在此之前，根本不清楚这是否行得通。”


    我告诉他们，对我来说，这个结果不仅令人印象深刻，而且**充满希望**，因为用更模糊、更难以形容的概念，比如“有益”“仁慈”或“善行”，取代“后空翻”这个模糊的概念，并不是一件不可想象的事情。


    “没错，”雷克说，“这才是重点，对吗？” ^([^(563)](#fn563))


    **学会合作**


    2013年，哈德菲尔德——梅内埃尔（Dylan Hadfield-Menell）在MIT跟随机器人专家和强化学习先驱莱斯利·凯尔布林（Leslie Kaelbling）完成了硕士学位，前往加州大学伯克利分校。他准备跟随斯图尔特·罗素攻读博士，大致延续他在硕士阶段的工作，做机器人调度和运动规划。第一年刚好罗素去学术休假了。等他在2014年春天回来时，一切都变了。


    “我们开了一次组会，讨论研究计划，”哈德菲尔德——梅内埃尔说，“他介绍了他的研究愿景。我记得他好像是这样说的：‘嗯，有一些值得关注的问题……’他没有称之为价值对齐，而是说：‘如果我们成功了，到底会出现什么问题？’”罗素关注的是AI的长远隐忧：我们开发的学习系统越灵活、功能越强大，它们到底学习什么就越重要。在巴黎度假时，罗素对这个越来越担心。回到伯克利时，他的信念已经很坚定：需要进行呼吁和研究。


    “研究思路差不多已经有了，”罗素说， ^([^(564)](#fn564))'
  fmt: '

    事实上，整个“生物力学”领域都是为了回答这类问题。例如，研究人员长期以来对四足动物的各种步态感兴趣：行走、小跑、慢跑、疾驰。19世纪后期，高速摄影的发明解决了这些步态到底是如何运作的问题：什么时候抬哪条腿，马在疾驰时是否会完全腾空。（1877年，我们知道了的确会。）然后，在20世纪，争论焦点从**如何**转移到了为**为什么**。


    1981年，哈佛大学动物学家查尔斯·泰勒（Charles Richard Taylor）在《自然》期刊上发表了一篇长文，认为马从小跑转为疾驰的过程能最大限度减少马的总能耗。^([^(541)](#fn541))


    这就是罗素走向超市时思考的问题。罗素告诉我：“我从家里出来下山往超市走。我注意到，因为是下坡，我的步态与平地略有不同。我当时想，怎样才能预测步态的差异。比方说把一只蟑螂放在斜坡上……”他做了个手势，“蟑螂会怎么走？能预测吗？如果知道优化目标，就可以预测地面倾斜时蟑螂会怎么走。”


    到20世纪90年代末，强化学习已成为一种强大的计算技术，用于在各种（当时相当简单的）物理和虚拟环境中生成适当的行为。对多巴胺系统和蜜蜂觅食行为的研究也越来越清晰地表明，强化学习可以为理解人类和动物行为提供很好的框架。^([^(542)](#fn542))


    只有一个问题。典型的强化学习场景假设，试图最大化的“奖励”是什么是完全清楚的，在动物行为实验中是食物或糖水，在AI视频游戏中是分数。但是在现实世界中，“奖励”的来源远不是那么明显。**步行**的“分数”是什么？


    罗素在伯克利树木繁茂的林荫大道上边走边想，如果人类的步态是答案，而强化学习是身体寻找答案的方法，那么……问题是什么？


    为此罗素在1998年写了一篇论文，提出了**逆强化学习**（IRL）。他认为，这个领域需要解决的不是常规的强化学习那样的问题，“给定一个奖励，什么行为可以优化它？”而是反过来：“给定观察到的行为，什么奖励——如果有的话——正在被优化？”^([^(543)](#fn543))


    当然，用不那么正式的话来说，这是人类生活的基本问题之一。**他们到底认为自己在做什么？**我们在生活中用了很大一部分脑力来回答这个问题。我们观察其他人的行为——朋友和敌人，上级和下级，合作者和竞争对手——并试图**通过**看得见的行为来推断看不见的意图和目的。从这个角度来说，它是人类认知的基石。


    这个问题成了21世纪AI的开创性和关键主题之一。它很可能是对齐问题的关键。


    ### 从示范中学习


    对于想要猜测他人行为背后的含义或意图的人来说，有时会感觉到，任何行为都可能有无限多的意味。**他是喜欢我，还是对谁都这么好？他是因为什么事对我不满，还是只是心情不好？他这样做是有意还是无意？**


    对此，计算机科学只能提供安慰，而不是解药。**任何行为都可以有无限多的含义。**


    从理论上，这个问题求解无望。在实际中，这个故事似乎还有点希望。


    逆强化学习是数学中著名的“不适定”问题，即没有唯一解的问题。例如，有许多奖励函数族，从行为角度来看，它们完全没区别。另一方面，从总体来看，这种模棱两可无关紧要，因为人的行为不会因此改变。例如，拳击碰巧使用了“10分制”，即一个回合的胜者得10分，败者得9分。如果一个新手错误地认为，回合得分是1000万分和900万分，或每点1000万分和每点900万分，或11分和10分，仍然是总分高的人获胜，他的拳击与“正确”知道评分系统的人没什么不同。所以错误是难免的，但不会有实质影响。^([^(544)](#fn544))


    但还有更棘手的问题：是什么让我们认为这个人的行为有任何意义？也许他们没什么目的，行为是随机的，仅此而已。


    在给出IRL问题的具体解决方案的第一篇论文中，罗素和他当时的博士生吴恩达举了一些简单例子来证明这个想法可行。^([^(545)](#fn545))


    吴恩达和罗素在他们的IRL系统中设置了一些简化假设。假定玩家从不随机行动，也从不犯错：当玩家采取行动时，该行动是实际上可能的最佳行动。还假设激励自主体的奖励是“简单的”，即任何**可以**被认为分值为0的行为或状态都**应该**被认为分值为0。^([^(546)](#fn546))


    这些假设都太强，以至于适用范围很窄，没有任何直接的实际用途，也与人类步态的复杂性相去甚远，但确证了IRL的有效性。IRL系统推断的奖励与实际奖励非常相似。吴恩达和罗素让IRL系统最大化它认为的奖励来玩游戏，它的得分（以“真实”分数衡量）和直接用真实分数优化的系统的得分一样高。


    吴恩达获得博士学位后去了斯坦福任教。2004年，他指导博士生彼得·阿贝尔（Pieter Abbeel）在IRL问题上又迈进了一步，增加了环境复杂性，放宽了一些推断假设。^([^(547)](#fn547))


    这种方法与第7章讨论的严格模仿方法很不一样。阿贝尔的示范驾驶只有1分钟，如果是直接模仿行为的模型，会因为缺乏足够的信息而无法继续前进，道路环境太复杂了。虽然阿贝尔的行为很复杂，但他的目标很简单；IRL系统只用几秒钟就学会了不要撞车，不要偏离道路，如果可能的话保持在右边车道。这个目标结构比驾驶行为本身简单得多，更容易学习，面对新情况也更具适应性。IRL自主体没有直接学习他的**行为**，而是在学习他的**价值观**。


    他们决定，是时候让IRL面对现实世界的混乱了。


    第5章曾介绍吴恩达利用奖励塑造教直升机悬停，和沿着平直的轨迹缓慢飞行，在此之前还没有计算机控制系统能实现这样的壮举。无论是对吴恩达的职业生涯还是对整个机器学习来说，这都是一个重要里程碑，但是后来的进展停滞不前。“坦率说，我们撞上了一堵墙，”吴恩达说，“有些事情我们一直不清楚如何教直升机做。”^([^(548)](#fn548))


    部分原因在于，悬停和以低速沿固定路径飞行都很容易用传统的奖励函数解决。悬停时，只需对直升机在各个方向的速度接近0进行奖励；沿路径飞行时，奖励沿着路径前进，惩罚偏离。这类问题的目标容易确定，然后只需找到某种方法，教系统通过控制叶片扭矩、俯仰和角度来**完成**任务。这正是强化学习的优势。


    但对于更复杂的机动和特技，速度更快，空气动力学也更复杂，甚至都不清楚如何设计奖励函数，让系统可以据此学习它的行为。当然，你可以简单地在空间画一条曲线，告诉计算机试着按照精确的轨迹飞行，但是物理定律可能不允许，尤其是在高速飞行时。直升机在轨迹的某些部分可能速度太快，应力可能太大，发动机可能无法及时输出足够的动力，等等。直升机有可能坠毁，对于速度达72千米/时，重达4.8千克的直升机来说，这既昂贵又危险。该团队写道：“我们手工编码轨迹的尝试一再失败。”^([^(549)](#fn549))


    他们想到，**可以**让人类专家操纵飞行，利用IRL让系统**推断**人类想要实现的目标。使用IRL方法，2007年，阿贝尔和吴恩达与亚当·科茨（Adam Coates）合作，实现了有史以来第一次由计算机控制的直升机前翻和副翼侧滚。^([^(550)](#fn550))


    但他们并不满足于停留在已取得的辉煌成就。他们想尝试表演即使是专家级人类示范者——遥控直升机飞行员加雷特·奥库（Garett Oku）——也无法完美完成的动作。阿贝尔、科茨和吴恩达想把他们的直升机研究推向极致：建造一架电脑控制的直升机，能够进行**超越**人类飞行员能力的令人瞠目结舌的特技表演。


    他们有一个重要的洞察。虽然奥库不能完美完成理想的动作，但只要他的尝试足够好，在多次尝试中，不完美的地方不会是一样的。一个逆强化学习而非严格模仿的系统，可以通过一系列不完美或失败的尝试推断人类飞行员的意图。^([^(551)](#fn551))


    到2008年，通过对专家示范的推断，他们获得了大量突破，记录了第一次成功的自主演示“连续原地翻转和翻滚、连续机头朝上的俯仰、环圈、带回旋的环圈、带回旋的失速转弯、‘龙卷风’（快速倒飞漏斗）、刀锋、殷麦曼回旋、拍打、侧向俯仰、移动翻转、倒尾滑行，甚至自动旋转着陆”。^([^(552)](#fn552))


    他们雄心勃勃的终极目标是被普遍认为最困难的直升机操作：一种名为“混沌”的动作，这个动作是如此复杂，只有一个人能做到。


    “混沌”飞行是柯蒂斯·杨布拉德（Curtis Youngblood）发明的。他是1987、1993和2001年的模型直升机世界冠军；2002和2004年的3D大师赛冠军；1986、1987、1989、1991、1993、1994、1995、1996、1997、1998、1999、2000、2001、2002、2004、2005、2006、2008、2010、2011和2012年全美冠军。^([^(553)](#fn553))


    “发明这个动作的时候，我在想，”杨布拉德说，“我能想到的最复杂的控制策略是什么。”他决定做一种最困难的动作——自旋翻转——并且是**在旋转的同时**反复做。


    当被问及还有多少飞行员有把握完成这个动作时，杨布拉德说没有。“我曾经能做到，现在也做不了……如果让我做，不练习就做不完整。”


    他说，之所以不常做，部分原因是这个动作过于复杂，只有资深飞行员才能看明白其中的门道。“你通常是进行表演，试图让观众惊叹。但观众并不懂你在做什么。所以，你做一个真正的混沌或是简单一点的自旋翻转，对他们没有区别。观众中通常没有谁真正懂这个，除非是给顶级飞行员演示。”^([^(554)](#fn554))


    到2008年夏天，斯坦福的直升机已经掌握了“混沌”技巧，尽管从未见过一次完美的演示，无论是奥库、杨布拉德或其他任何人。但是就像幼儿看着大人搬着一摞杂志撞到柜门一样，系统看着他们一次又一次自旋翻转，同时每次旋转300度，看起来像一场直升机龙卷风，它决定自己也来试试。^([^(555)](#fn555))


    与此同时，IRL的框架被继续扩展，出现了各种消除行为歧义的方法，以及更复杂的奖励表示方式。2008年，当时还在CMU攻读博士的布莱恩·齐巴特（Brian Ziebart）与人合作开发了一种基于信息论的方法。与其假设我们观摩的专家是完美的，我们可以认为他们只是有更高概率采取能获得更多奖励的行动。反过来，我们可以用这个原则来寻找一组奖励，最大化特定演示行为的概率，同时尽量保持不确定性。


    齐巴特将这种所谓的最大熵IRL方法应用于20多名真正的匹兹堡出租车司机的10万公里驾驶数据集，用来模拟他们对某些路径的偏好。该模型能可靠地猜测司机前往特定目的地会走哪条路线。更令人惊讶的是，它还可以根据司机到目前为止走的路线，合理猜测目的地。（齐巴特意识到，这样就有可能在司机没有告诉系统目的地的情况下，提醒司机前方路况。）^([^(556)](#fn556))


    在过去10年里，机器人学中出现了研究“动觉式教学”的浪潮，人类手动移动机器人手臂完成某些任务，机器人系统必须推断出相应的目标，以便在稍微不同的环境中能自行再现类似行为。^([^(557)](#fn557))


    ### 一看便知：根据反馈学习


    逆强化学习已被证明是一种强有力的方法，当用手工明确地编程奖励不可行甚至不可能时，能将复杂目标输入系统。但这样做通常还是需要旁边有专家给出预期行为的示范（即使不完美）。直升机特技表演需要有技艺高超的飞行员；出租车需要有司机；同样，放盘子和倒杏仁露也需要有人类示范。还有其他方法吗？


    生活中有很多事情很难**做到**，但相对来说容易**评判**。我可能是糟糕的遥控直升机飞行员，甚至不能让直升机飞起来，但我能辨认出精彩的空中特技飞行（可能除了“混沌”）。正如杨布拉德指出的，给外行观众留下深刻印象也很重要。


    如果系统能够仅仅根据我的**反馈**——我给它的行为演示打的分数，或者我对两个不同演示的偏好——推断出明确的奖励函数，那么我们将会有一个强大的、更通用的方式来传达我们想让机器做的事情。也就是说，即使我们说不出想要什么，即使我们**做**不到我们想要的，我们仍然有办法实现对齐。在一个完美的世界里，只需当我们看到时能够判别就够了。


    这是一个强有力的想法。只有两个问题。这真的可能吗？它安全吗？


    2012年，简·雷克（Jan Leike）在德国弗莱堡攻读硕士学位，做的是软件验证：开发工具自动分析某些类型的程序，确定它们是否能成功执行。^([^(558)](#fn558))


    雷克向澳大利亚国立大学的计算机学家马库斯·哈特（Marcus Hutter）寻求职业建议。“我很冒昧地发了封邮件，告诉他我想攻读AI安全的博士学位，你能给我一些去哪里的建议吗？然后我附上了一些我做过的工作之类的东西，希望能得到回复。”哈特马上回信了。“你应该来**这里**，”他写道。但离申请截止日期只有3天了。


    雷克笑道：“你要知道，我的母语不是英语，也没有参加过英语测试。我必须在3天内完成所有的一切。”此外，雷克还要从头开始写一份研究计划。还有，他那周正在度假。“你可想而知，那3天我没怎么睡觉。”


    雷克强调：“顺便说一下，关于如何选择攻读博士，这是很糟糕的示范。我基本上没有做功课，就冒昧给人发邮件，然后决定申请那里。很显然，这种方式不值得学习！”


    年底时，雷克已经搬到了堪培拉，跟随哈特做研究。他于2015年末获得博士学位，研究的是哈特的AIXI框架（第6章曾提到过），并发现了这种自主体可能出现“严重行为不当”的情形。^([^(559)](#fn559))


    “当时，我在思考价值对齐，”雷克说，“思考如何做到这一点。似乎很多问题都与‘如何学习奖励函数’有关，所以我联系了克里斯蒂诺和阿莫代伊，我知道他们也在思考类似的问题。”


    克里斯蒂诺和阿莫代伊在旧金山的OpenAI，隔着半个地球。他们对此非常感兴趣，三人一拍即合。克里斯蒂诺刚刚加入公司，正在寻找有前景的第一个项目。他开始尝试用更少的监督进行强化学习，不是每秒15次不断更新分数，而是更定期的更新，就像监督员定期检查。当然，可以基于比如说雅达利游戏进行修改，只周期性地而不是实时地告知自主体分数，但是他们觉得，如果让真正的人类提供这种反馈，这篇论文将更有可能引起轰动，并且能为今后的对齐项目提供更清晰的建议。


    克里斯蒂诺和OpenAI的同事，以及雷克和他在DeepMind的团队，决定把他们的头脑（和GPU）汇集到一起，深入研究机器如何向人类学习复杂的奖励函数的问题。该项目最终将诞生2017年最重要的AI安全论文之一，之所以引人瞩目，不仅在于它的发现，还在于它的象征意义：世界上两个最活跃的AI安全研究实验室的重要合作，以及对齐研究的诱人前景。^([^(560)](#fn560))


    他们构想了一个计划，以前所未有的规模测试在没有示范的情况下的逆强化学习。他们的想法是，让系统在某种虚拟环境中运行，定期向人类发送行为视频的随机剪辑。根据屏幕提示，人类只需“看剪辑视频，并指出哪个视频中做得较好”，系统将尝试基于人类的反馈来细化其关于奖励函数的推断，然后（和典型的强化学习一样）再利用这个推断的奖励来塑造表现良好的行为。它会继续改进自己，朝着对真正奖励的最优猜测前进，然后发送新的视频剪辑供评判。


    该项目的一部分是在存在明确的“客观”奖励函数的环境中进行——即经典的雅达利游戏，在这类游戏中，直接的强化学习已经证明了自己的超人能力——测试时不让自主体知道它的游戏分数，由人类评判哪个视频片段“更好”，自主体据此生成对奖励函数的最优猜测。在大多数情况下，该系统表现得相当好，尽管它通常无法达到能直接获知分数的自主体的超人性能。然而，在涉及复杂传球动作的《耐力赛车》中，根据人类反馈推断分数比使用游戏分数**更有效**，这表明人类成功达成了某种奖励塑造。


    “如果是存在明确奖励的场景，就像雅达利游戏这样，那就很好办，”雷克说，“因为可以检验效果。你可以检验价值一致性，即‘你的奖励模型与真正的奖励函数有多一致？’”


    团队**还**想训练强化学习系统去做一些完全主观性的事情。这些事情不存在“真实”分数，或者复杂得难以描述，以至于不可能人工明确给出一个数值奖励，但同时又很容易判别，人只要看到了就能知道。


    他们发现有一件事情可能符合条件：**后空翻。**


    “我正好在看机器人，”克里斯蒂诺说，“然后我想，这些机器人应该能做到的最酷的事情是什么？”^([^(561)](#fn561))


    其中一个虚拟机器人叫做“单足跳”，看起来像一条没有身躯的腿，有一只超大的脚。“我的第一个目标，也是最雄心勃勃的目标是，”克里斯蒂亚诺说，“这个机器人的构造似乎应该能做后空翻。”


    计划是这样：将这个简单的机器人放在名为MuJoCo的虚拟物理模拟器中——除了摩擦力和重力之外几乎没有任何其他东西的玩具世界——并试图让它做后空翻。^([^(562)](#fn562))


    克里斯蒂诺耐心地观看一对对的视频剪辑，反复挑选哪一个看起来更像后空翻。左，右，右，左，右，左，左。


    “每当它取得了小小的进步，我都非常高兴，”克里斯蒂诺说，“它最开始翻倒，即使是随机的，我也很高兴，因为有时会向正确的方向翻倒。当它总是朝正确方向倒下时，我很高兴。进步很缓慢，因为你只是按左或右。所以……看了很多视频。”


    “我想最让我兴奋的可能是，”他回忆道，“当它开始坚持跳跃时。”


    大约过了一个小时，比较了几百个视频片段后，它开始做漂亮、完美的后空翻：像体操运动员那样曲体，然后稳稳落地。


    实验由多人重复进行，后空翻总是略有不同，就好像每个人都在表达自己的美感，自己理想的后空翻。


    克里斯蒂诺参加了OpenAI的团队周会，并展示了视频，“看！我们可以做到，”他回忆自己在会上说的话，“每个人都说，兄弟，这很酷。”


    “我对结果非常满意，”雷克说，“因为，在此之前，根本不清楚这是否行得通。”


    我告诉他们，对我来说，这个结果不仅令人印象深刻，而且**充满希望**，因为用更模糊、更难以形容的概念，比如“有益”“仁慈”或“善行”，取代“后空翻”这个模糊的概念，并不是一件不可想象的事情。


    “没错，”雷克说，“这才是重点，对吗？”^([^(563)](#fn563))


    ### 学会合作


    2013年，哈德菲尔德——梅内埃尔（Dylan Hadfield-Menell）在MIT跟随机器人专家和强化学习先驱莱斯利·凯尔布林（Leslie Kaelbling）完成了硕士学位，前往加州大学伯克利分校。他准备跟随斯图尔特·罗素攻读博士，大致延续他在硕士阶段的工作，做机器人调度和运动规划。第一年刚好罗素去学术休假了。等他在2014年春天回来时，一切都变了。


    “我们开了一次组会，讨论研究计划，”哈德菲尔德——梅内埃尔说，“他介绍了他的研究愿景。我记得他好像是这样说的：‘嗯，有一些值得关注的问题……’他没有称之为价值对齐，而是说：‘如果我们成功了，到底会出现什么问题？’”罗素关注的是AI的长远隐忧：我们开发的学习系统越灵活、功能越强大，它们到底学习什么就越重要。在巴黎度假时，罗素对这个越来越担心。回到伯克利时，他的信念已经很坚定：需要进行呼吁和研究。


    “研究思路差不多已经有了，”罗素说，^([^(564)](#fn564))

    '
  trans: '


    事实上，整个“生物力学”领域都是为了回答这类问题。例如，研究人员长期以来对四足动物的各种步态感兴趣：行走、小跑、慢跑、疾驰。19 世纪后期，高速摄影的发明解决了这些步态到底是如何运作的问题：什么时候抬哪条腿，马在疾驰时是否会完全腾空。（1877
    年，我们知道了的确会。）然后，在 20 世纪，争论焦点从**如何**转移到了为**为什么**。


    1981 年，哈佛大学动物学家查尔斯·泰勒（Charles Richard Taylor）在《自然》期刊上发表了一篇长文，认为马从小跑转为疾驰的过程能最大限度减少马的总能耗。^(⁵⁴¹)


    这就是罗素走向超市时思考的问题。罗素告诉我：“我从家里出来下山往超市走。我注意到，因为是下坡，我的步态与平地略有不同。我当时想，怎样才能预测步态的差异。比方说把一只蟑螂放在斜坡上……”他做了个手势，“蟑螂会怎么走？能预测吗？如果知道优化目标，就可以预测地面倾斜时蟑螂会怎么走。”


    到 20 世纪 90 年代末，强化学习已成为一种强大的计算技术，用于在各种（当时相当简单的）物理和虚拟环境中生成适当的行为。对多巴胺系统和蜜蜂觅食行为的研究也越来越清晰地表明，强化学习可以为理解人类和动物行为提供很好的框架。^(⁵⁴²)


    只有一个问题。典型的强化学习场景假设，试图最大化的“奖励”是什么是完全清楚的，在动物行为实验中是食物或糖水，在 AI 视频游戏中是分数。但是在现实世界中，“奖励”的来源远不是那么明显。**步行**的“分数”是什么？


    罗素在伯克利树木繁茂的林荫大道上边走边想，如果人类的步态是答案，而强化学习是身体寻找答案的方法，那么……问题是什么？


    为此罗素在 1998 年写了一篇论文，提出了**逆强化学习**（IRL）。他认为，这个领域需要解决的不是常规的强化学习那样的问题，“给定一个奖励，什么行为可以优化它？”而是反过来：“给定观察到的行为，什么奖励——如果有的话——正在被优化？”^(⁵⁴³)


    当然，用不那么正式的话来说，这是人类生活的基本问题之一。**他们到底认为自己在做什么？**我们在生活中用了很大一部分脑力来回答这个问题。我们观察其他人的行为——朋友和敌人，上级和下级，合作者和竞争对手——并试图**通过**看得见的行为来推断看不见的意图和目的。从这个角度来说，它是人类认知的基石。


    这个问题成了 21 世纪 AI 的开创性和关键主题之一。它很可能是对齐问题的关键。


    ### 从示范中学习


    对于想要猜测他人行为背后的含义或意图的人来说，有时会感觉到，任何行为都可能有无限多的意味。**他是喜欢我，还是对谁都这么好？他是因为什么事对我不满，还是只是心情不好？他这样做是有意还是无意？**


    对此，计算机科学只能提供安慰，而不是解药。**任何行为都可以有无限多的含义。**


    从理论上，这个问题求解无望。在实际中，这个故事似乎还有点希望。


    逆强化学习是数学中著名的“不适定”问题，即没有唯一解的问题。例如，有许多奖励函数族，从行为角度来看，它们完全没区别。另一方面，从总体来看，这种模棱两可无关紧要，因为人的行为不会因此改变。例如，拳击碰巧使用了“10
    分制”，即一个回合的胜者得 10 分，败者得 9 分。如果一个新手错误地认为，回合得分是 1000 万分和 900 万分，或每点 1000 万分和每点 900
    万分，或 11 分和 10 分，仍然是总分高的人获胜，他的拳击与“正确”知道评分系统的人没什么不同。所以错误是难免的，但不会有实质影响。^(⁵⁴⁴)


    但还有更棘手的问题：是什么让我们认为这个人的行为有任何意义？也许他们没什么目的，行为是随机的，仅此而已。


    在给出 IRL 问题的具体解决方案的第一篇论文中，罗素和他当时的博士生吴恩达举了一些简单例子来证明这个想法可行。^(⁵⁴⁵)


    吴恩达和罗素在他们的 IRL 系统中设置了一些简化假设。假定玩家从不随机行动，也从不犯错：当玩家采取行动时，该行动是实际上可能的最佳行动。还假设激励自主体的奖励是“简单的”，即任何**可以**被认为分值为
    0 的行为或状态都**应该**被认为分值为 0。^(⁵⁴⁶)


    这些假设都太强，以至于适用范围很窄，没有任何直接的实际用途，也与人类步态的复杂性相去甚远，但确证了 IRL 的有效性。IRL 系统推断的奖励与实际奖励非常相似。吴恩达和罗素让
    IRL 系统最大化它认为的奖励来玩游戏，它的得分（以“真实”分数衡量）和直接用真实分数优化的系统的得分一样高。


    吴恩达获得博士学位后去了斯坦福任教。2004 年，他指导博士生彼得·阿贝尔（Pieter Abbeel）在 IRL 问题上又迈进了一步，增加了环境复杂性，放宽了一些推断假设。^(⁵⁴⁷)


    这种方法与第 7 章讨论的严格模仿方法很不一样。阿贝尔的示范驾驶只有 1 分钟，如果是直接模仿行为的模型，会因为缺乏足够的信息而无法继续前进，道路环境太复杂了。虽然阿贝尔的行为很复杂，但他的目标很简单；IRL
    系统只用几秒钟就学会了不要撞车，不要偏离道路，如果可能的话保持在右边车道。这个目标结构比驾驶行为本身简单得多，更容易学习，面对新情况也更具适应性。IRL 自主体没有直接学习他的**行为**，而是在学习他的**价值观**。


    他们决定，是时候让 IRL 面对现实世界的混乱了。


    第 5 章曾介绍吴恩达利用奖励塑造教直升机悬停，和沿着平直的轨迹缓慢飞行，在此之前还没有计算机控制系统能实现这样的壮举。无论是对吴恩达的职业生涯还是对整个机器学习来说，这都是一个重要里程碑，但是后来的进展停滞不前。“坦率说，我们撞上了一堵墙，”吴恩达说，“有些事情我们一直不清楚如何教直升机做。”^(⁵⁴⁸)


    部分原因在于，悬停和以低速沿固定路径飞行都很容易用传统的奖励函数解决。悬停时，只需对直升机在各个方向的速度接近 0 进行奖励；沿路径飞行时，奖励沿着路径前进，惩罚偏离。这类问题的目标容易确定，然后只需找到某种方法，教系统通过控制叶片扭矩、俯仰和角度来**完成**任务。这正是强化学习的优势。


    但对于更复杂的机动和特技，速度更快，空气动力学也更复杂，甚至都不清楚如何设计奖励函数，让系统可以据此学习它的行为。当然，你可以简单地在空间画一条曲线，告诉计算机试着按照精确的轨迹飞行，但是物理定律可能不允许，尤其是在高速飞行时。直升机在轨迹的某些部分可能速度太快，应力可能太大，发动机可能无法及时输出足够的动力，等等。直升机有可能坠毁，对于速度达
    72 千米/时，重达 4.8 千克的直升机来说，这既昂贵又危险。该团队写道：“我们手工编码轨迹的尝试一再失败。”^(⁵⁴⁹)


    他们想到，**可以**让人类专家操纵飞行，利用 IRL 让系统**推断**人类想要实现的目标。使用 IRL 方法，2007 年，阿贝尔和吴恩达与亚当·科茨（Adam Coates）合作，实现了有史以来第一次由计算机控制的直升机前翻和副翼侧滚。^(⁵⁵⁰)


    但他们并不满足于停留在已取得的辉煌成就。他们想尝试表演即使是专家级人类示范者——遥控直升机飞行员加雷特·奥库（Garett Oku）——也无法完美完成的动作。阿贝尔、科茨和吴恩达想把他们的直升机研究推向极致：建造一架电脑控制的直升机，能够进行**超越**人类飞行员能力的令人瞠目结舌的特技表演。


    他们有一个重要的洞察。虽然奥库不能完美完成理想的动作，但只要他的尝试足够好，在多次尝试中，不完美的地方不会是一样的。一个逆强化学习而非严格模仿的系统，可以通过一系列不完美或失败的尝试推断人类飞行员的意图。^(⁵⁵¹)


    到 2008 年，通过对专家示范的推断，他们获得了大量突破，记录了第一次成功的自主演示“连续原地翻转和翻滚、连续机头朝上的俯仰、环圈、带回旋的环圈、带回旋的失速转弯、‘龙卷风’（快速倒飞漏斗）、刀锋、殷麦曼回旋、拍打、侧向俯仰、移动翻转、倒尾滑行，甚至自动旋转着陆”。^(⁵⁵²)


    他们雄心勃勃的终极目标是被普遍认为最困难的直升机操作：一种名为“混沌”的动作，这个动作是如此复杂，只有一个人能做到。


    “混沌”飞行是柯蒂斯·杨布拉德（Curtis Youngblood）发明的。他是 1987、1993 和 2001 年的模型直升机世界冠军；2002 和 2004
    年的 3D 大师赛冠军；1986、1987、1989、1991、1993、1994、1995、1996、1997、1998、1999、2000、2001、2002、2004、2005、2006、2008、2010、2011
    和 2012 年全美冠军。^(⁵⁵³)


    “发明这个动作的时候，我在想，”杨布拉德说，“我能想到的最复杂的控制策略是什么。”他决定做一种最困难的动作——自旋翻转——并且是**在旋转的同时**反复做。


    当被问及还有多少飞行员有把握完成这个动作时，杨布拉德说没有。“我曾经能做到，现在也做不了……如果让我做，不练习就做不完整。”


    他说，之所以不常做，部分原因是这个动作过于复杂，只有资深飞行员才能看明白其中的门道。“你通常是进行表演，试图让观众惊叹。但观众并不懂你在做什么。所以，你做一个真正的混沌或是简单一点的自旋翻转，对他们没有区别。观众中通常没有谁真正懂这个，除非是给顶级飞行员演示。”^(⁵⁵⁴)


    到 2008 年夏天，斯坦福的直升机已经掌握了“混沌”技巧，尽管从未见过一次完美的演示，无论是奥库、杨布拉德或其他任何人。但是就像幼儿看着大人搬着一摞杂志撞到柜门一样，系统看着他们一次又一次自旋翻转，同时每次旋转
    300 度，看起来像一场直升机龙卷风，它决定自己也来试试。^(⁵⁵⁵)


    与此同时，IRL 的框架被继续扩展，出现了各种消除行为歧义的方法，以及更复杂的奖励表示方式。2008 年，当时还在 CMU 攻读博士的布莱恩·齐巴特（Brian Ziebart）与人合作开发了一种基于信息论的方法。与其假设我们观摩的专家是完美的，我们可以认为他们只是有更高概率采取能获得更多奖励的行动。反过来，我们可以用这个原则来寻找一组奖励，最大化特定演示行为的概率，同时尽量保持不确定性。


    齐巴特将这种所谓的最大熵 IRL 方法应用于 20 多名真正的匹兹堡出租车司机的 10 万公里驾驶数据集，用来模拟他们对某些路径的偏好。该模型能可靠地猜测司机前往特定目的地会走哪条路线。更令人惊讶的是，它还可以根据司机到目前为止走的路线，合理猜测目的地。（齐巴特意识到，这样就有可能在司机没有告诉系统目的地的情况下，提醒司机前方路况。）^(⁵⁵⁶)


    在过去 10 年里，机器人学中出现了研究“动觉式教学”的浪潮，人类手动移动机器人手臂完成某些任务，机器人系统必须推断出相应的目标，以便在稍微不同的环境中能自行再现类似行为。^(⁵⁵⁷)


    ### 一看便知：根据反馈学习


    逆强化学习已被证明是一种强有力的方法，当用手工明确地编程奖励不可行甚至不可能时，能将复杂目标输入系统。但这样做通常还是需要旁边有专家给出预期行为的示范（即使不完美）。直升机特技表演需要有技艺高超的飞行员；出租车需要有司机；同样，放盘子和倒杏仁露也需要有人类示范。还有其他方法吗？


    生活中有很多事情很难**做到**，但相对来说容易**评判**。我可能是糟糕的遥控直升机飞行员，甚至不能让直升机飞起来，但我能辨认出精彩的空中特技飞行（可能除了“混沌”）。正如杨布拉德指出的，给外行观众留下深刻印象也很重要。


    如果系统能够仅仅根据我的**反馈**——我给它的行为演示打的分数，或者我对两个不同演示的偏好——推断出明确的奖励函数，那么我们将会有一个强大的、更通用的方式来传达我们想让机器做的事情。也就是说，即使我们说不出想要什么，即使我们**做**不到我们想要的，我们仍然有办法实现对齐。在一个完美的世界里，只需当我们看到时能够判别就够了。


    这是一个强有力的想法。只有两个问题。这真的可能吗？它安全吗？


    2012 年，简·雷克（Jan Leike）在德国弗莱堡攻读硕士学位，做的是软件验证：开发工具自动分析某些类型的程序，确定它们是否能成功执行。^(⁵⁵⁸)


    雷克向澳大利亚国立大学的计算机学家马库斯·哈特（Marcus Hutter）寻求职业建议。“我很冒昧地发了封邮件，告诉他我想攻读 AI 安全的博士学位，你能给我一些去哪里的建议吗？然后我附上了一些我做过的工作之类的东西，希望能得到回复。”哈特马上回信了。“你应该来**这里**，”他写道。但离申请截止日期只有
    3 天了。


    雷克笑道：“你要知道，我的母语不是英语，也没有参加过英语测试。我必须在 3 天内完成所有的一切。”此外，雷克还要从头开始写一份研究计划。还有，他那周正在度假。“你可想而知，那
    3 天我没怎么睡觉。”


    雷克强调：“顺便说一下，关于如何选择攻读博士，这是很糟糕的示范。我基本上没有做功课，就冒昧给人发邮件，然后决定申请那里。很显然，这种方式不值得学习！”


    年底时，雷克已经搬到了堪培拉，跟随哈特做研究。他于 2015 年末获得博士学位，研究的是哈特的 AIXI 框架（第 6 章曾提到过），并发现了这种自主体可能出现“严重行为不当”的情形。^(⁵⁵⁹)


    “当时，我在思考价值对齐，”雷克说，“思考如何做到这一点。似乎很多问题都与‘如何学习奖励函数’有关，所以我联系了克里斯蒂诺和阿莫代伊，我知道他们也在思考类似的问题。”


    克里斯蒂诺和阿莫代伊在旧金山的 OpenAI，隔着半个地球。他们对此非常感兴趣，三人一拍即合。克里斯蒂诺刚刚加入公司，正在寻找有前景的第一个项目。他开始尝试用更少的监督进行强化学习，不是每秒
    15 次不断更新分数，而是更定期的更新，就像监督员定期检查。当然，可以基于比如说雅达利游戏进行修改，只周期性地而不是实时地告知自主体分数，但是他们觉得，如果让真正的人类提供这种反馈，这篇论文将更有可能引起轰动，并且能为今后的对齐项目提供更清晰的建议。


    克里斯蒂诺和 OpenAI 的同事，以及雷克和他在 DeepMind 的团队，决定把他们的头脑（和 GPU）汇集到一起，深入研究机器如何向人类学习复杂的奖励函数的问题。该项目最终将诞生
    2017 年最重要的 AI 安全论文之一，之所以引人瞩目，不仅在于它的发现，还在于它的象征意义：世界上两个最活跃的 AI 安全研究实验室的重要合作，以及对齐研究的诱人前景。^(⁵⁶⁰)


    他们构想了一个计划，以前所未有的规模测试在没有示范的情况下的逆强化学习。他们的想法是，让系统在某种虚拟环境中运行，定期向人类发送行为视频的随机剪辑。根据屏幕提示，人类只需“看剪辑视频，并指出哪个视频中做得较好”，系统将尝试基于人类的反馈来细化其关于奖励函数的推断，然后（和典型的强化学习一样）再利用这个推断的奖励来塑造表现良好的行为。它会继续改进自己，朝着对真正奖励的最优猜测前进，然后发送新的视频剪辑供评判。


    该项目的一部分是在存在明确的“客观”奖励函数的环境中进行——即经典的雅达利游戏，在这类游戏中，直接的强化学习已经证明了自己的超人能力——测试时不让自主体知道它的游戏分数，由人类评判哪个视频片段“更好”，自主体据此生成对奖励函数的最优猜测。在大多数情况下，该系统表现得相当好，尽管它通常无法达到能直接获知分数的自主体的超人性能。然而，在涉及复杂传球动作的《耐力赛车》中，根据人类反馈推断分数比使用游戏分数**更有效**，这表明人类成功达成了某种奖励塑造。


    “如果是存在明确奖励的场景，就像雅达利游戏这样，那就很好办，”雷克说，“因为可以检验效果。你可以检验价值一致性，即‘你的奖励模型与真正的奖励函数有多一致？’”


    团队**还**想训练强化学习系统去做一些完全主观性的事情。这些事情不存在“真实”分数，或者复杂得难以描述，以至于不可能人工明确给出一个数值奖励，但同时又很容易判别，人只要看到了就能知道。


    他们发现有一件事情可能符合条件：**后空翻。**


    “我正好在看机器人，”克里斯蒂诺说，“然后我想，这些机器人应该能做到的最酷的事情是什么？”^(⁵⁶¹)


    其中一个虚拟机器人叫做“单足跳”，看起来像一条没有身躯的腿，有一只超大的脚。“我的第一个目标，也是最雄心勃勃的目标是，”克里斯蒂亚诺说，“这个机器人的构造似乎应该能做后空翻。”


    计划是这样：将这个简单的机器人放在名为 MuJoCo 的虚拟物理模拟器中——除了摩擦力和重力之外几乎没有任何其他东西的玩具世界——并试图让它做后空翻。^(⁵⁶²)


    克里斯蒂诺耐心地观看一对对的视频剪辑，反复挑选哪一个看起来更像后空翻。左，右，右，左，右，左，左。


    “每当它取得了小小的进步，我都非常高兴，”克里斯蒂诺说，“它最开始翻倒，即使是随机的，我也很高兴，因为有时会向正确的方向翻倒。当它总是朝正确方向倒下时，我很高兴。进步很缓慢，因为你只是按左或右。所以……看了很多视频。”


    “我想最让我兴奋的可能是，”他回忆道，“当它开始坚持跳跃时。”


    大约过了一个小时，比较了几百个视频片段后，它开始做漂亮、完美的后空翻：像体操运动员那样曲体，然后稳稳落地。


    实验由多人重复进行，后空翻总是略有不同，就好像每个人都在表达自己的美感，自己理想的后空翻。


    克里斯蒂诺参加了 OpenAI 的团队周会，并展示了视频，“看！我们可以做到，”他回忆自己在会上说的话，“每个人都说，兄弟，这很酷。”


    “我对结果非常满意，”雷克说，“因为，在此之前，根本不清楚这是否行得通。”


    我告诉他们，对我来说，这个结果不仅令人印象深刻，而且**充满希望**，因为用更模糊、更难以形容的概念，比如“有益”“仁慈”或“善行”，取代“后空翻”这个模糊的概念，并不是一件不可想象的事情。


    “没错，”雷克说，“这才是重点，对吗？”^(⁵⁶³)


    ### 学会合作


    2013 年，哈德菲尔德——梅内埃尔（Dylan Hadfield-Menell）在 MIT 跟随机器人专家和强化学习先驱莱斯利·凯尔布林（Leslie Kaelbling）完成了硕士学位，前往加州大学伯克利分校。他准备跟随斯图尔特·罗素攻读博士，大致延续他在硕士阶段的工作，做机器人调度和运动规划。第一年刚好罗素去学术休假了。等他在
    2014 年春天回来时，一切都变了。


    “我们开了一次组会，讨论研究计划，”哈德菲尔德——梅内埃尔说，“他介绍了他的研究愿景。我记得他好像是这样说的：‘嗯，有一些值得关注的问题……’他没有称之为价值对齐，而是说：‘如果我们成功了，到底会出现什么问题？’”罗素关注的是
    AI 的长远隐忧：我们开发的学习系统越灵活、功能越强大，它们到底学习什么就越重要。在巴黎度假时，罗素对这个越来越担心。回到伯克利时，他的信念已经很坚定：需要进行呼吁和研究。


    “研究思路差不多已经有了，”罗素说，^(⁵⁶⁴)

