- raw: '他20年前的想法最终成为了他现在AI安全研究的基础，这有点讽刺意味。20年后，他在去西夫韦超市的路上的遐想变成了一个避免可能的文明灾难的计划。“这完全是巧合，”他说，“但是整件事就是一连串巧合，所以没关系。”


    在那次组会上，罗素告诉学生，他认为有一些值得做的博士级别课题。哈德菲尔德——梅内埃尔继续研究机器人，但他一直在思考对齐问题。最初的吸引力部分来自有待探索的新问题的智力挑战，以及做出开创性贡献的机会。随着时间推移，这种感觉开始让位于另一种感觉，他告诉我：“这似乎真的很重要，而且没有得到重视。”2015年春天，他决定改变博士课题，从而也改变了他的职业生涯。


    “现在我全力以赴研究价值对齐。”他告诉我。


    他和罗素首先着手的项目之一是重新审视逆强化学习框架。


    罗素和哈德菲尔德——梅内埃尔与彼得·阿贝尔和伯克利机器人专家安卡·德拉甘（Anca Drăgan）合作，开始从头梳理IRL。有两点引起了他们的注意。


    同该领域惯常的做法一样，直升机学习的前提是人和机器的某种分工。人类专家飞行员只管**做自己的事情**，计算机从这些示范中获知它的意义。两者的运作相对独立。但是，如果人类从一开始就知道有一个热切的学徒呢？如果双方有意识地**一起**工作呢？那会是什么样子？


    另一个引起注意的地方是，在传统的IRL中，机器把人的奖励函数当成自己的。如果人类直升机飞行员试图飞出“混沌”，计算机飞行员也会试图飞出“混沌”。在某些情况下，这是合理的：比如说，我们想安全地开车去上班和回家，如果我们的车习得了这一组目标和价值观，我们会很高兴。不过，有些情况更微妙。如果我们伸手去拿水果，我们不希望家用机器人习得对水果的渴望。相反，我们想让它做18个月大的孩子会做的事情：看到我们伸出的手臂和指向的东西，把它递给我们。
    ^([^(565)](#fn565))


    罗素将这种新的框架称为**合作**逆强化学习（CIRL）。 ^([^(566)](#fn566))


    “我们尝试思考，对当前的数学和理论体系，为了修正导致这类风险的理论，我们能做的最直接的改变是什么？”哈德菲尔德——梅内埃尔说，“什么样的数学问题能让最优的东西就是我们**实际**想要的？”
    ^([^(567)](#fn567))


    罗素也这么认为，这不是对问题的小幅度重构，而是可能成为解开对齐问题的钥匙。这无异于推翻AI最基本的假设，可以说是哥白尼式的变革。他说，在过去一个世纪，我们试图构建能实现其目标的机器，这隐含在AI的几乎所有研究中，安全问题关注的则是如何给它们设定目标，如何定义明智的、没有漏洞的目标。他认为，也许整个研究模式都需要更新。“如果我们不让机器追求**它们的**目标，而是坚持让它们追求**我们**的目标呢？”他说，“这可能才是我们应该做的事情。”
    ^([^(568)](#fn568))


    一旦将合作引入框架，就会自然引出几个研究方向。传统的机器学习和机器人研究人员现在比以往任何时候都更热衷于从育儿、发展心理学、教育以及人机交互和界面设计中借鉴想法。突然间，所有其他学科的知识不仅变得相关，而且至关重要。
    ^([^(569)](#fn569))


    这些方面的工作在积极推进，也还有许多问题有待研究，但目前已经取得了几个关键见解。


    一个见解是，如果我们知道自己正在被学习，我们会以更有助益的方式进行示范。“CIRL鼓励人类去教学，”伯克利团队写道，“而不是只知道将收益最大化。” ^([^(570)](#fn570))


    例如，研究发现，成年人在与婴儿交谈时经常使用的吟唱式话语（被称为“妈妈语”或“爸妈语”）具有深刻的教学效果。用妈妈语交谈的婴儿实际上学语言更快，不管我们有没有意识到，这似乎很关键。
    ^([^(571)](#fn571))


    不仅在语言上，在动作上，我们也常常会无意识地表现出敏锐地感知到我们的行为会被他人解读。想想把物品递给他人的过程，其中就包含了容易被忽视的复杂性。我们手持东西不是以最省力的姿势，而是把手伸出去，离身体很远，这样会让手臂的压力很大，但会让另一个人收到信号，如果不是希望他们接手，我们肯定不会这样做。
    ^([^(572)](#fn572))


    计算机科学家正在快速吸收教育学和育儿的见解。核心思想对两个方向都有启发。我们想让自己以机器可以理解的方式行事，我们也希望机器以对我们来说“意图清晰”的方式行事。


    机器人学中有一个方向是“意图清晰的运动”，安卡·德拉甘是主要研究人员之一，事实上，这个术语就是她创造的。 ^([^(573)](#fn573))


    除了教学行为的重要性之外，该领域得到的第二个见解是，如果合作被构建为**互动**式的，而不是“学习，然后行动”这样两个独立的阶段，效果最佳。


    简·雷克在研究从人类的反馈中学习时发现了这一点。“对我来说，这篇论文中最有趣的事情之一，其实是一个脚注，”他说，“也就是那些奖励漏洞的例子。”


    如果自主体先完成所有奖励学习，**然后再**完成所有优化，经常会以灾难告终。自主体会发现漏洞并加以利用，而且从不犹豫。例如，雷克曾尝试教自主体学习玩《乒乓》游戏，先由人类对自主体打球的视频库的所有片段进行评判，再由自主体学习优化。在一次试验中，计算机学会了用球拍跟踪球，好像要击打它一样，但是在最后一秒钟会错开。因为它不知道游戏的真实分数，所以它没有意识到自己错过了最关键的一步。在另一次试验中，计算机学会了防守屏幕的一边并回球，但从未学会得分，因此它只是进行长时间的对打。“从安全角度来看，这很有趣，”雷克说，“因为你想了解这些事情是如何失败的，以及你能做些什么来防止它。”如果人类的反馈能与计算机的训练过程**交织**在一起，而不是完全预先加载，这类问题往往会消失。
    ^([^(574)](#fn574))


    MIT的朱莉·沙阿研究了现实世界中的人——机器人互动式合作，得出了类似结论。“我多年来一直感兴趣的是，”她说，“如何协同优化人和机器的学习过程。”为了研究人——机器人团队，她研读了关于人——人团队管理以及如何最有效地对团队进行培训的文献。在人类团队中，激励当然很重要，但很少看到奖励明确到任务层面的微观管理。“如果你用奖励式互动来训练系统，这更像是训练狗，而不是教人做任务，”她说。
    ^([^(575)](#fn575))


    事实上，对人类团队的研究对此已经有了结论。“已经有文献基本证明了，”沙阿说，“明确命令一个人去完成某项任务，是训练两个人相互协作完成工作最糟糕的方式之一。稍加思考就能理解这一点！对吗？……这是最糟糕的人类团队培训实践。”


    “人类研究也给出了很好的策略，”她补充道，“如果多个人有相同的目标或意图——每个人都知道目标或意图是什么——但相互之间实现目标的计划不一致，而他们的工作需要相互依赖，那么他们的表现会比有次优但一致的计划时差很多。”几乎在所有团队场景中——从商业到战争，从体育到音乐——每个人的高层次目标都是相同的。但是有共同的目标还不够，他们还需要有共同的计划。


    就人类团队来说，有一个好办法是所谓的**岗位轮换培训**。团队成员临时交换角色：将他们置于队友的位置，这样他们就能意识到该如何改进自己的工作，以便更好地配合队友的需求和工作流程。岗位轮换培训可以说是人类团队训练的黄金标准，用于军事、工业和医学等各种领域。
    ^([^(576)](#fn576))


    沙阿不禁想：类似这样的方法能不能在人——机器人配合中发挥作用？人——人合作的最佳实践能否移植到机器人学？这是“一个疯狂的想法”，她说。“就像一个很小的尝试，看看行不行。虽然只是一个古怪的想法，不妨探索一下。”


    他们成功了。首先，他们想知道，在机器向人类学习方面，岗位轮换培训能否与目前的最高水平竞争。他们还问了第二个问题，这个问题在典型的这类研究中还从未提出过：这是否也有助于人类更好地学习如何与机器人合作（以及给机器人教学）？


    沙阿团队为人类与机器人手臂协作设计了一个现实任务，类似于在制造装配时放置和拧紧螺钉的任务（但没有真正的批头）。他们将传统的反馈和示范方法与轮换培训进行了比较。
    ^([^(577)](#fn577))


    “结果确实令我们惊讶和兴奋，”她说，“在轮换培训后，根据对团队绩效的客观衡量标准，我们看到了改进。”人们更愿意和机器人一起工作，而不是呆板地轮替，虽然这样的空闲时间更少，要做的工作更多。
    ^([^(578)](#fn578))


    也许同样重要也更有趣的是，他们还看到了**主观感受**的改善。相对于采取更传统的示范和反馈学习的对照组，接受过轮换培训的人更强烈地表示他们**信任**机器人，并且机器人能按照他们的偏好进行操作。


    令人难以置信的是，人与人合作的最佳实践的确能移植，这意味着其他进一步的经验很可能也能移植。“这只是初步研究，任务相对简单，”沙阿说，“但即使是在简单任务中，我们也明确看到了具有统计显著性的好处，接下来还有许多人类团队培训技术都有可能移植到人——机器人团队。”
    ^([^(579)](#fn579))


    **合作，无论好坏**


    所有这些构成了一个很令人鼓舞的故事。人类的合作是基于一种很晚近才进化出来的几乎独一无二的能力，即推断他人的意图和目标，以及帮助他人的动机。机器也可以——而且越来越能——做同样的事情，学习我们的示范，我们的反馈，并逐渐和我们协同工作。


    随着机器的能力越来越强，也随着我们逐渐习惯与它们更紧密地合作，至少有两个方面的好消息。首先，我们已经有了初步的计算框架，让机器不仅可以**代替人**，还可以与人**协同**工作。其次，我们还有关于人类如何**相互**有效合作的大量研究，这些见解正变得越来越重要。


    如果根据当前的技术水平外推，使用诸如克里斯蒂诺和雷克的基于人类偏好的深度强化学习，以及罗素和哈德菲尔德——梅内埃尔的CIRL等框架，我们可以想象未来具有非凡智慧和能力的机器，它们将能领会我们每个意图和欲望最微妙的差别。还有许多障碍需要克服，也必然会有许多限制，但前方的道路已经开始显现。


    然而，与此同时，有一些值得注意的地方。这些在不久的将来出现的计算助手——无论是以数字形式还是以机器人形式，很可能两者都有——肯定存在利益冲突，它们有两个主人：它们表面上的主人和创造它们的组织。从这个意义上说，它们就像是收取佣金的管家：除非以某种方式获得收益，否则它们不会帮助我们。它们会做出我们不一定**希望**它们做出的精明推断。我们将逐渐认识到，我们几乎不会再有机会单独行动，现在已经是这样。


    我的一个朋友正在治疗酒瘾。但是社交网站的广告推荐引擎对他太了解了，经常给他推送酒类广告。它们的偏好模型认为，**现在有一个人，他喜欢饮酒。**正如英国作家艾丽丝·默多克说的：“自知之明会引导我们避开存在诱惑的场合，而不是依靠蛮力来战胜它们。”
    ^([^(580)](#fn580))


    就我自己而言，上网时我会尽量谨慎一点。至少在浏览器中，任何散发着邪恶或罪孽快感的东西——无论是点击新闻链接、查看社交媒体，还是其他我不一定想多做的数字欲望——我都是使用不在本地存储用户信息的隐私窗口。并不是感到羞耻，我不希望这些行为**被强化**。


    对于这些情形，我们不希望机器根据我们的行为推断我们的目标，并诱导我们做更多相同事情，这时我们需要的是不同的指令。我们实际上想说的是，“你不能因为我正在做这件事就推断我想做。请不要让我更容易做这件事。请不要扩增或强化它，也不要以任何方式诱导通往这条道路的欲望。请在我身后种植荆棘”。


    我认为这里有一个重要的政策问题，至少和理论问题同样重要。我们应该认真考虑让用户有权看到和**改变**网站、应用软件或广告商对他们的偏好分析。值得考虑对此施加监管：也就是说，本质上，我有权拥有自己的模型。我有权说，**那不是我**。或者，有抱负地说，这才是我想成为的人，**这才是你必须为其争取利益的人。**


    这是目前最棘手的问题。我们的数字管家正在密切注视我们。它们既看到了我们公开的生活，也窥见了我们的隐私，看到了我们最好的自己和最坏的自己，却不一定知道哪个是哪个，也不做任何区分。总的来说，它们身处某种隐秘复杂的山谷：能够根据我们的行为推断我们的欲望的复杂模型，但无法被教导，也不愿合作。它们在努力预测我们下一步要做什么，思考如何赚得下一笔佣金，但它们似乎不明白我们想要什么，更不用说我们希望成为怎样的人。


    有些人可能会说，也许这会让我们展现更好的自己。的确，当人类感到自己被监视时，他们会表现得更有道德。在实验室研究中，当人们被摄像时，当房间里有单向镜子时，当房间明亮而不是昏暗时，他们不太可能作弊。
    ^([^(581)](#fn581))


    18世纪哲学家杰里米·边沁著名的“全景监狱”构想，其实就利用了这一点。在一个圆形监狱中，所有牢房都环绕着一个守卫塔，囚犯不知道自己是否正在被监视。边沁鼓吹监视的净化作用，甚至不需要实际监视，只需暗示有监视，他称他的圆形建筑为“碾出流氓的诚实的磨坊”，
    ^([^(582)](#fn582))


    另一方面，这样也有可能使得人人自危，并造成各种影响。毕竟，我们通常不希望监狱外的生活也同监狱里一样。


    不那么邪恶，但同样令人担忧的是，IRL的标准数学假设人类行为来自“专家”，示范者知道自己想要什么，并且会做（很有可能）正确的事情来获得它。如果这些假设不成立，系统就有可能扩增新手的无知行为，或者增加本来是试探性、探索性行为的风险。我们先爬后走，先走后开车。也许最好不要机械地传递扩增我们的每一个动作。


    无论是好是坏，人类都已经身处这样的境地，而且即便在我们对未来的乐观预期中也是越来越如此；无论是好是坏，我们都会被更加了解；无论是好是坏，这个世界都将充斥着类似2岁孩子的算法，它们向我们走来，打开它们认为我们可能想要打开的门，试图以各种方式提供帮助。


    ## **9. 不定**


    人类给人类带来的最大罪恶，大部分都是由于人们对某些事实上是错误的事情感到非常确定。


    ——伯特兰·罗素 ^([^(583)](#fn583))


    以上帝的心肠，我恳求你，想想你可能是错的。


    ——奥利弗·克伦威尔（Oliver Cromwell）


    自由的精神就是不太确定它正确的精神。


    ——勒恩德·汉德（Learned Hand）


    1983年9月26日，午夜刚过，苏联值班军官斯坦尼斯拉夫·彼得罗夫（Stanislav Petrov）在莫斯科郊外的地堡里，监视着奥科预警卫星系统。突然，屏幕狂闪，警笛呼啸，警示有一枚LGM-30民兵洲际弹道导弹从美国袭来。


    “巨大的红色字母显现在主屏幕上，”他说。这些字母写着：发射。


    “我立刻从椅子上站了起来，”彼得罗夫说，“我所有的下属都很困惑，所以我对他们大声发号施令以免恐慌。” ^([^(584)](#fn584))


    警报又响了，提示第二枚导弹已经发射，然后是第三枚，第四枚，第五枚。


    “舒适的扶手椅此时感觉就像滚烫的煎锅，我的腿在颤抖，”他说，“我觉得我连站都站不稳。”


    彼得罗夫一手拿着电话，一手拿着对讲机。电话那头，另一名军官冲他大喊，让他保持冷静。“我承认，”彼得罗夫说，“我很害怕。”


    规定很明确。彼得罗夫要向上级报告导弹正在袭来，上级将决定是否下令全面报复。但是，他说：“规定没说我们在报告之前可以**思考**多长时间。” ^([^(585)](#fn585))


    彼得罗夫觉得，有些事情说不通。他受过训练，知道美国的攻击规模会比这大得多。5枚导弹……不符合常理。“警报在呼啸，但我坐了几秒钟，盯着背光源的红色大屏幕，上面写着‘发射’。”他回忆道，
    ^([^(586)](#fn586))


    预警系统显示其警报的可靠性水平为“最高”。尽管如此，这还是说不通。彼得罗夫推断，美国有数千枚导弹，为什么只发射5枚？“如果他们要发动战争，不会只用5枚导弹，”他回忆自己的想法，这不符合他接受过的任何训练。“我有种奇怪的感觉。”他说。
    ^([^(587)](#fn587))


    “然后我做了决定。不能相信计算机。我拿起电话，通知了上司，并报告说警报是假的。但直到最后一刻，我自己也不确定。我非常清楚，如果我错了，后果将无可挽回。”


    几年后，当BBC问他认为警报为真的可能性有多大时，他回答说：“五五开。”但是他没错。难熬的几分钟后，什么也没发生。一旦导弹越过地平线，地面雷达就能发现。雷达什么也没发现，苏联风平浪静。这是一个系统错误：只不过是北达科他州上空云层反射的阳光。


    **从未见过**


    天地之间有许多事情，是你的睿智所无法想象的。


    ——哈姆雷特


    尽管奥科预警系统自我报告了“最高”可靠性，彼得罗夫还是觉得这种情况很奇怪，他有理由不相信它的结论。感谢上帝，有一个人类在这个环路中，否则至少1亿条生命危在旦夕。


    然而，潜在的相同问题——不仅会做出错误判断，还会以极度的自信做出错误判断的系统——直到今天仍然让研究人员感到担忧。


    深度学习系统有一个众所周知的特性是它们特别“脆弱”。我们知道2012年诞生的AlexNet，通过用数十万张属于某一类别的图片进行训练，它能神奇地总结出普遍模式，从而能正确地识别它从未见过的猫、狗、汽车和人。但是有一个问题。它会对你展示的所有图像进行分类，包括随机生成的彩色噪点图。它说，这是猎豹，有99.6%的置信度，那是菠萝蜜，有99.6%的置信度。系统就像是在产生幻觉，而且似乎缺乏确认机制，更不用说提醒用户它在这样做。正如2015年一篇被广泛引用的论文说的：“深度神经网络很容易被愚弄。”
    ^([^(588)](#fn588))


    一个与此有密切关联的想法是所谓的对抗样本。一幅图像，网络有57.7%的置信度认为是熊猫（也的确是熊猫），逐渐改变其像素，突然网络有99.3%的置信度认为这个逐渐变化的图像是长臂猿。
    ^([^(589)](#fn589))


    对于这种情况到底哪里出了问题，以及对此可以做些什么，计算机专家进行了许多尝试。


    俄勒冈州立大学的计算机科学家托马斯·迪特里希（Thomas Dietterich）认为，这个问题很大程度上是由于：视觉系统在训练中输入的每幅图像都是某种东西——画笔、壁虎、龙虾。然而，绝大多数可能的图像——彩色像素的可能组合——根本**什么**也不是。雾蒙蒙的噪点。随机的立体线条和边缘，缺乏基本的形状。迪特里希认为，像AlexNet这样的系统是用被标记为一千种类别中的一个类别的图像训练出来的，“隐含地假设世界只由，比方说，一千种类别的对象组成”。
    ^([^(590)](#fn590))


    迪特里希在自己的研究过程中得到过惨痛教训。他做过一个项目，“淡水大型无脊椎动物的自动计数”——其实就是数溪流中的虫子。环保局和研究者使用在淡水溪流中采集的昆虫的数量，作为衡量溪流和当地生态系统健康状况的标准，学生和研究人员要花很多冗长乏味的时间人工分类和标记网袋中捕捉到的昆虫：石蝇、石蛾、蜉蝣等。迪特里希认为，基于图像识别技术最近的突破，他能帮上忙。他和同事采集了29种不同昆虫的样本，训练了一个机器视觉系统，能以95%的准确率对昆虫分类。'
  fmt: '

    他20年前的想法最终成为了他现在AI安全研究的基础，这有点讽刺意味。20年后，他在去西夫韦超市的路上的遐想变成了一个避免可能的文明灾难的计划。“这完全是巧合，”他说，“但是整件事就是一连串巧合，所以没关系。”


    在那次组会上，罗素告诉学生，他认为有一些值得做的博士级别课题。哈德菲尔德——梅内埃尔继续研究机器人，但他一直在思考对齐问题。最初的吸引力部分来自有待探索的新问题的智力挑战，以及做出开创性贡献的机会。随着时间推移，这种感觉开始让位于另一种感觉，他告诉我：“这似乎真的很重要，而且没有得到重视。”2015年春天，他决定改变博士课题，从而也改变了他的职业生涯。


    “现在我全力以赴研究价值对齐。”他告诉我。


    他和罗素首先着手的项目之一是重新审视逆强化学习框架。


    罗素和哈德菲尔德——梅内埃尔与彼得·阿贝尔和伯克利机器人专家安卡·德拉甘（Anca Drăgan）合作，开始从头梳理`IRL`。有两点引起了他们的注意。


    同该领域惯常的做法一样，直升机学习的前提是人和机器的某种分工。人类专家飞行员只管**做自己的事情**，计算机从这些示范中获知它的意义。两者的运作相对独立。但是，如果人类从一开始就知道有一个热切的学徒呢？如果双方有意识地**一起**工作呢？那会是什么样子？


    另一个引起注意的地方是，在传统的`IRL`中，机器把人的奖励函数当成自己的。如果人类直升机飞行员试图飞出“混沌”，计算机飞行员也会试图飞出“混沌”。在某些情况下，这是合理的：比如说，我们想安全地开车去上班和回家，如果我们的车习得了这一组目标和价值观，我们会很高兴。不过，有些情况更微妙。如果我们伸手去拿水果，我们不希望家用机器人习得对水果的渴望。相反，我们想让它做18个月大的孩子会做的事情：看到我们伸出的手臂和指向的东西，把它递给我们。
    ^([^(565)](#fn565))


    罗素将这种新的框架称为**合作**逆强化学习（`CIRL`）。 ^([^(566)](#fn566))


    “我们尝试思考，对当前的数学和理论体系，为了修正导致这类风险的理论，我们能做的最直接的改变是什么？”哈德菲尔德——梅内埃尔说，“什么样的数学问题能让最优的东西就是我们**实际**想要的？”
    ^([^(567)](#fn567))


    罗素也这么认为，这不是对问题的小幅度重构，而是可能成为解开对齐问题的钥匙。这无异于推翻AI最基本的假设，可以说是哥白尼式的变革。他说，在过去一个世纪，我们试图构建能实现其目标的机器，这隐含在AI的几乎所有研究中，安全问题关注的则是如何给它们设定目标，如何定义明智的、没有漏洞的目标。他认为，也许整个研究模式都需要更新。“如果我们不让机器追求**它们的**目标，而是坚持让它们追求**我们**的目标呢？”他说，“这可能才是我们应该做的事情。”
    ^([^(568)](#fn568))


    一旦将合作引入框架，就会自然引出几个研究方向。传统的机器学习和机器人研究人员现在比以往任何时候都更热衷于从育儿、发展心理学、教育以及人机交互和界面设计中借鉴想法。突然间，所有其他学科的知识不仅变得相关，而且至关重要。
    ^([^(569)](#fn569))


    这些方面的工作在积极推进，也还有许多问题有待研究，但目前已经取得了几个关键见解。


    一个见解是，如果我们知道自己正在被学习，我们会以更有助益的方式进行示范。“`CIRL`鼓励人类去教学，”伯克利团队写道，“而不是只知道将收益最大化。” ^([^(570)](#fn570))


    例如，研究发现，成年人在与婴儿交谈时经常使用的吟唱式话语（被称为“妈妈语”或“爸妈语”）具有深刻的教学效果。用妈妈语交谈的婴儿实际上学语言更快，不管我们有没有意识到，这似乎很关键。
    ^([^(571)](#fn571))


    不仅在语言上，在动作上，我们也常常会无意识地表现出敏锐地感知到我们的行为会被他人解读。想想把物品递给他人的过程，其中就包含了容易被忽视的复杂性。我们手持东西不是以最省力的姿势，而是把手伸出去，离身体很远，这样会让手臂的压力很大，但会让另一个人收到信号，如果不是希望他们接手，我们肯定不会这样做。
    ^([^(572)](#fn572))


    计算机科学家正在快速吸收教育学和育儿的见解。核心思想对两个方向都有启发。我们想让自己以机器可以理解的方式行事，我们也希望机器以对我们来说“意图清晰”的方式行事。


    机器人学中有一个方向是“意图清晰的运动”，安卡·德拉甘是主要研究人员之一，事实上，这个术语就是她创造的。 ^([^(573)](#fn573))


    除了教学行为的重要性之外，该领域得到的第二个见解是，如果合作被构建为**互动**式的，而不是“学习，然后行动”这样两个独立的阶段，效果最佳。


    简·雷克在研究从人类的反馈中学习时发现了这一点。“对我来说，这篇论文中最有趣的事情之一，其实是一个脚注，”他说，“也就是那些奖励漏洞的例子。”


    如果自主体先完成所有奖励学习，**然后再**完成所有优化，经常会以灾难告终。自主体会发现漏洞并加以利用，而且从不犹豫。例如，雷克曾尝试教自主体学习玩《乒乓》游戏，先由人类对自主体打球的视频库的所有片段进行评判，再由自主体学习优化。在一次试验中，计算机学会了用球拍跟踪球，好像要击打它一样，但是在最后一秒钟会错开。因为它不知道游戏的真实分数，所以它没有意识到自己错过了最关键的一步。在另一次试验中，计算机学会了防守屏幕的一边并回球，但从未学会得分，因此它只是进行长时间的对打。“从安全角度来看，这很有趣，”雷克说，“因为你想了解这些事情是如何失败的，以及你能做些什么来防止它。”如果人类的反馈能与计算机的训练过程**交织**在一起，而不是完全预先加载，这类问题往往会消失。
    ^([^(574)](#fn574))


    MIT的朱莉·沙阿研究了现实世界中的人——机器人互动式合作，得出了类似结论。“我多年来一直感兴趣的是，”她说，“如何协同优化人和机器的学习过程。”为了研究人——机器人团队，她研读了关于人——人团队管理以及如何最有效地对团队进行培训的文献。在人类团队中，激励当然很重要，但很少看到奖励明确到任务层面的微观管理。“如果你用奖励式互动来训练系统，这更像是训练狗，而不是教人做任务，”她说。
    ^([^(575)](#fn575))


    事实上，对人类团队的研究对此已经有了结论。“已经有文献基本证明了，”沙阿说，“明确命令一个人去完成某项任务，是训练两个人相互协作完成工作最糟糕的方式之一。稍加思考就能理解这一点！对吗？……这是最糟糕的人类团队培训实践。”


    “人类研究也给出了很好的策略，”她补充道，“如果多个人有相同的目标或意图——每个人都知道目标或意图是什么——但相互之间实现目标的计划不一致，而他们的工作需要相互依赖，那么他们的表现会比有次优但一致的计划时差很多。”几乎在所有团队场景中——从商业到战争，从体育到音乐——每个人的高层次目标都是相同的。但是有共同的目标还不够，他们还需要有共同的计划。


    就人类团队来说，有一个好办法是所谓的**岗位轮换培训**。团队成员临时交换角色：将他们置于队友的位置，这样他们就能意识到该如何改进自己的工作，以便更好地配合队友的需求和工作流程。岗位轮换培训可以说是人类团队训练的黄金标准，用于军事、工业和医学等各种领域。
    ^([^(576)](#fn576))


    沙阿不禁想：类似这样的方法能不能在人——机器人配合中发挥作用？人——人合作的最佳实践能否移植到机器人学？这是“一个疯狂的想法”，她说。“就像一个很小的尝试，看看行不行。虽然只是一个古怪的想法，不妨探索一下。”


    他们成功了。首先，他们想知道，在机器向人类学习方面，岗位轮换培训能否与目前的最高水平竞争。他们还问了第二个问题，这个问题在典型的这类研究中还从未提出过：这是否也有助于人类更好地学习如何与机器人合作（以及给机器人教学）？


    沙阿团队为人类与机器人手臂协作设计了一个现实任务，类似于在制造装配时放置和拧紧螺钉的任务（但没有真正的批头）。他们将传统的反馈和示范方法与轮换培训进行了比较。
    ^([^(577)](#fn577))


    “结果确实令我们惊讶和兴奋，”她说，“在轮换培训后，根据对团队绩效的客观衡量标准，我们看到了改进。”人们更愿意和机器人一起工作，而不是呆板地轮替，虽然这样的空闲时间更少，要做的工作更多。
    ^([^(578)](#fn578))


    也许同样重要也更有趣的是，他们还看到了**主观感受**的改善。相对于采取更传统的示范和反馈学习的对照组，接受过轮换培训的人更强烈地表示他们**信任**机器人，并且机器人能按照他们的偏好进行操作。


    令人难以置信的是，人与人合作的最佳实践的确能移植，这意味着其他进一步的经验很可能也能移植。“这只是初步研究，任务相对简单，”沙阿说，“但即使是在简单任务中，我们也明确看到了具有统计显著性的好处，接下来还有许多人类团队培训技术都有可能移植到人——机器人团队。”
    ^([^(579)](#fn579))


    ### 合作，无论好坏


    所有这些构成了一个很令人鼓舞的故事。人类的合作是基于一种很晚近才进化出来的几乎独一无二的能力，即推断他人的意图和目标，以及帮助他人的动机。机器也可以——而且越来越能——做同样的事情，学习我们的示范，我们的反馈，并逐渐和我们协同工作。


    随着机器的能力越来越强，也随着我们逐渐习惯与它们更紧密地合作，至少有两个方面的好消息。首先，我们已经有了初步的计算框架，让机器不仅可以**代替人**，还可以与人**协同**工作。其次，我们还有关于人类如何**相互**有效合作的大量研究，这些见解正变得越来越重要。


    如果根据当前的技术水平外推，使用诸如克里斯蒂诺和雷克的基于人类偏好的深度强化学习，以及罗素和哈德菲尔德——梅内埃尔的`CIRL`等框架，我们可以想象未来具有非凡智慧和能力的机器，它们将能领会我们每个意图和欲望最微妙的差别。还有许多障碍需要克服，也必然会有许多限制，但前方的道路已经开始显现。


    然而，与此同时，有一些值得注意的地方。这些在不久的将来出现的计算助手——无论是以数字形式还是以机器人形式，很可能两者都有——肯定存在利益冲突，它们有两个主人：它们表面上的主人和创造它们的组织。从这个意义上说，它们就像是收取佣金的管家：除非以某种方式获得收益，否则它们不会帮助我们。它们会做出我们不一定**希望**它们做出的精明推断。我们将逐渐认识到，我们几乎不会再有机会单独行动，现在已经是这样。


    我的一个朋友正在治疗酒瘾。但是社交网站的广告推荐引擎对他太了解了，经常给他推送酒类广告。它们的偏好模型认为，**现在有一个人，他喜欢饮酒。**正如英国作家艾丽丝·默多克说的：“自知之明会引导我们避开存在诱惑的场合，而不是依靠蛮力来战胜它们。”
    ^([^(580)](#fn580))


    就我自己而言，上网时我会尽量谨慎一点。至少在浏览器中，任何散发着邪恶或罪孽快感的东西——无论是点击新闻链接、查看社交媒体，还是其他我不一定想多做的数字欲望——我都是使用不在本地存储用户信息的隐私窗口。并不是感到羞耻，我不希望这些行为**被强化**。


    对于这些情形，我们不希望机器根据我们的行为推断我们的目标，并诱导我们做更多相同事情，这时我们需要的是不同的指令。我们实际上想说的是，“你不能因为我正在做这件事就推断我想做。请不要让我更容易做这件事。请不要扩增或强化它，也不要以任何方式诱导通往这条道路的欲望。请在我身后种植荆棘”。


    我认为这里有一个重要的政策问题，至少和理论问题同样重要。我们应该认真考虑让用户有权看到和**改变**网站、应用软件或广告商对他们的偏好分析。值得考虑对此施加监管：也就是说，本质上，我有权拥有自己的模型。我有权说，**那不是我**。或者，有抱负地说，这才是我想成为的人，**这才是你必须为其争取利益的人。**


    这是目前最棘手的问题。我们的数字管家正在密切注视我们。它们既看到了我们公开的生活，也窥见了我们的隐私，看到了我们最好的自己和最坏的自己，却不一定知道哪个是哪个，也不做任何区分。总的来说，它们身处某种隐秘复杂的山谷：能够根据我们的行为推断我们的欲望的复杂模型，但无法被教导，也不愿合作。它们在努力预测我们下一步要做什么，思考如何赚得下一笔佣金，但它们似乎不明白我们想要什么，更不用说我们希望成为怎样的人。


    有些人可能会说，也许这会让我们展现更好的自己。的确，当人类感到自己被监视时，他们会表现得更有道德。在实验室研究中，当人们被摄像时，当房间里有单向镜子时，当房间明亮而不是昏暗时，他们不太可能作弊。
    ^([^(581)](#fn581))


    18世纪哲学家杰里米·边沁著名的“全景监狱”构想，其实就利用了这一点。在一个圆形监狱中，所有牢房都环绕着一个守卫塔，囚犯不知道自己是否正在被监视。边沁鼓吹监视的净化作用，甚至不需要实际监视，只需暗示有监视，他称他的圆形建筑为“碾出流氓的诚实的磨坊”，
    ^([^(582)](#fn582))


    另一方面，这样也有可能使得人人自危，并造成各种影响。毕竟，我们通常不希望监狱外的生活也同监狱里一样。


    不那么邪恶，但同样令人担忧的是，`IRL`的标准数学假设人类行为来自“专家”，示范者知道自己想要什么，并且会做（很有可能）正确的事情来获得它。如果这些假设不成立，系统就有可能扩增新手的无知行为，或者增加本来是试探性、探索性行为的风险。我们先爬后走，先走后开车。也许最好不要机械地传递扩增我们的每一个动作。


    无论是好是坏，人类都已经身处这样的境地，而且即便在我们对未来的乐观预期中也是越来越如此；无论是好是坏，我们都会被更加了解；无论是好是坏，这个世界都将充斥着类似2岁孩子的算法，它们向我们走来，打开它们认为我们可能想要打开的门，试图以各种方式提供帮助。


    ## 9. 不定


    人类给人类带来的最大罪恶，大部分都是由于人们对某些事实上是错误的事情感到非常确定。


    ——伯特兰·罗素 ^([^(583)](#fn583))


    以上帝的心肠，我恳求你，想想你可能是错的。


    ——奥利弗·克伦威尔（Oliver Cromwell）


    自由的精神就是不太确定它正确的精神。


    ——勒恩德·汉德（Learned Hand）


    1983年9月26日，午夜刚过，苏联值班军官斯坦尼斯拉夫·彼得罗夫（Stanislav Petrov）在莫斯科郊外的地堡里，监视着奥科预警卫星系统。突然，屏幕狂闪，警笛呼啸，警示有一枚`LGM-30`民兵洲际弹道导弹从美国袭来。


    “巨大的红色字母显现在主屏幕上，”他说。这些字母写着：发射。


    “我立刻从椅子上站了起来，”彼得罗夫说，“我所有的下属都很困惑，所以我对他们大声发号施令以免恐慌。” ^([^(584)](#fn584))


    警报又响了，提示第二枚导弹已经发射，然后是第三枚，第四枚，第五枚。


    “舒适的扶手椅此时感觉就像滚烫的煎锅，我的腿在颤抖，”他说，“我觉得我连站都站不稳。”


    彼得罗夫一手拿着电话，一手拿着对讲机。电话那头，另一名军官冲他大喊，让他保持冷静。“我承认，”彼得罗夫说，“我很害怕。”


    规定很明确。彼得罗夫要向上级报告导弹正在袭来，上级将决定是否下令全面报复。但是，他说：“规定没说我们在报告之前可以**思考**多长时间。” ^([^(585)](#fn585))


    彼得罗夫觉得，有些事情说不通。他受过训练，知道美国的攻击规模会比这大得多。5枚导弹……不符合常理。“警报在呼啸，但我坐了几秒钟，盯着背光源的红色大屏幕，上面写着‘发射’。”他回忆道，
    ^([^(586)](#fn586))


    预警系统显示其警报的可靠性水平为“最高”。尽管如此，这还是说不通。彼得罗夫推断，美国有数千枚导弹，为什么只发射5枚？“如果他们要发动战争，不会只用5枚导弹，”他回忆自己的想法，这不符合他接受过的任何训练。“我有种奇怪的感觉。”他说。
    ^([^(587)](#fn587))


    “然后我做了决定。不能相信计算机。我拿起电话，通知了上司，并报告说警报是假的。但直到最后一刻，我自己也不确定。我非常清楚，如果我错了，后果将无可挽回。”


    几年后，当BBC问他认为警报为真的可能性有多大时，他回答说：“五五开。”但是他没错。难熬的几分钟后，什么也没发生。一旦导弹越过地平线，地面雷达就能发现。雷达什么也没发现，苏联风平浪静。这是一个系统错误：只不过是北达科他州上空云层反射的阳光。


    ### 从未见过


    天地之间有许多事情，是你的睿智所无法想象的。


    ——哈姆雷特


    尽管奥科预警系统自我报告了“最高”可靠性，彼得罗夫还是觉得这种情况很奇怪，他有理由不相信它的结论。感谢上帝，有一个人类在这个环路中，否则至少1亿条生命危在旦夕。


    然而，潜在的相同问题——不仅会做出错误判断，还会以极度的自信做出错误判断的系统——直到今天仍然让研究人员感到担忧。


    深度学习系统有一个众所周知的特性是它们特别“脆弱”。我们知道2012年诞生的`AlexNet`，通过用数十万张属于某一类别的图片进行训练，它能神奇地总结出普遍模式，从而能正确地识别它从未见过的猫、狗、汽车和人。但是有一个问题。它会对你展示的所有图像进行分类，包括随机生成的彩色噪点图。它说，这是猎豹，有99.6%的置信度，那是菠萝蜜，有99.6%的置信度。系统就像是在产生幻觉，而且似乎缺乏确认机制，更不用说提醒用户它在这样做。正如2015年一篇被广泛引用的论文说的：“深度神经网络很容易被愚弄。”
    ^([^(588)](#fn588))


    一个与此有密切关联的想法是所谓的对抗样本。一幅图像，网络有57.7%的置信度认为是熊猫（也的确是熊猫），逐渐改变其像素，突然网络有99.3%的置信度认为这个逐渐变化的图像是长臂猿。
    ^([^(589)](#fn589))


    对于这种情况到底哪里出了问题，以及对此可以做些什么，计算机专家进行了许多尝试。


    俄勒冈州立大学的计算机科学家托马斯·迪特里希（Thomas Dietterich）认为，这个问题很大程度上是由于：视觉系统在训练中输入的每幅图像都是某种东西——画笔、壁虎、龙虾。然而，绝大多数可能的图像——彩色像素的可能组合——根本**什么**也不是。雾蒙蒙的噪点。随机的立体线条和边缘，缺乏基本的形状。迪特里希认为，像`AlexNet`这样的系统是用被标记为一千种类别中的一个类别的图像训练出来的，“隐含地假设世界只由，比方说，一千种类别的对象组成”。
    ^([^(590)](#fn590))


    迪特里希在自己的研究过程中得到过惨痛教训。他做过一个项目，“淡水大型无脊椎动物的自动计数”——其实就是数溪流中的虫子。环保局和研究者使用在淡水溪流中采集的昆虫的数量，作为衡量溪流和当地生态系统健康状况的标准，学生和研究人员要花很多冗长乏味的时间人工分类和标记网袋中捕捉到的昆虫：石蝇、石蛾、蜉蝣等。迪特里希认为，基于图像识别技术最近的突破，他能帮上忙。他和同事采集了29种不同昆虫的样本，训练了一个机器视觉系统，能以95%的准确率对昆虫分类。

    '
  trans: '


    他 20 年前的想法最终成为了他现在 AI 安全研究的基础，这有点讽刺意味。20 年后，他在去西夫韦超市的路上的遐想变成了一个避免可能的文明灾难的计划。“这完全是巧合，”他说，“但是整件事就是一连串巧合，所以没关系。”


    在那次组会上，罗素告诉学生，他认为有一些值得做的博士级别课题。哈德菲尔德——梅内埃尔继续研究机器人，但他一直在思考对齐问题。最初的吸引力部分来自有待探索的新问题的智力挑战，以及做出开创性贡献的机会。随着时间推移，这种感觉开始让位于另一种感觉，他告诉我：“这似乎真的很重要，而且没有得到重视。”2015
    年春天，他决定改变博士课题，从而也改变了他的职业生涯。


    “现在我全力以赴研究价值对齐。”他告诉我。


    他和罗素首先着手的项目之一是重新审视逆强化学习框架。


    罗素和哈德菲尔德——梅内埃尔与彼得·阿贝尔和伯克利机器人专家安卡·德拉甘（Anca Drăgan）合作，开始从头梳理`IRL`。有两点引起了他们的注意。


    同该领域惯常的做法一样，直升机学习的前提是人和机器的某种分工。人类专家飞行员只管**做自己的事情**，计算机从这些示范中获知它的意义。两者的运作相对独立。但是，如果人类从一开始就知道有一个热切的学徒呢？如果双方有意识地**一起**工作呢？那会是什么样子？


    另一个引起注意的地方是，在传统的`IRL`中，机器把人的奖励函数当成自己的。如果人类直升机飞行员试图飞出“混沌”，计算机飞行员也会试图飞出“混沌”。在某些情况下，这是合理的：比如说，我们想安全地开车去上班和回家，如果我们的车习得了这一组目标和价值观，我们会很高兴。不过，有些情况更微妙。如果我们伸手去拿水果，我们不希望家用机器人习得对水果的渴望。相反，我们想让它做
    18 个月大的孩子会做的事情：看到我们伸出的手臂和指向的东西，把它递给我们。 ^(⁵⁶⁵)


    罗素将这种新的框架称为**合作**逆强化学习（`CIRL`）。 ^(⁵⁶⁶)


    “我们尝试思考，对当前的数学和理论体系，为了修正导致这类风险的理论，我们能做的最直接的改变是什么？”哈德菲尔德——梅内埃尔说，“什么样的数学问题能让最优的东西就是我们**实际**想要的？”
    ^(⁵⁶⁷)


    罗素也这么认为，这不是对问题的小幅度重构，而是可能成为解开对齐问题的钥匙。这无异于推翻 AI 最基本的假设，可以说是哥白尼式的变革。他说，在过去一个世纪，我们试图构建能实现其目标的机器，这隐含在
    AI 的几乎所有研究中，安全问题关注的则是如何给它们设定目标，如何定义明智的、没有漏洞的目标。他认为，也许整个研究模式都需要更新。“如果我们不让机器追求**它们的**目标，而是坚持让它们追求**我们**的目标呢？”他说，“这可能才是我们应该做的事情。”
    ^(⁵⁶⁸)


    一旦将合作引入框架，就会自然引出几个研究方向。传统的机器学习和机器人研究人员现在比以往任何时候都更热衷于从育儿、发展心理学、教育以及人机交互和界面设计中借鉴想法。突然间，所有其他学科的知识不仅变得相关，而且至关重要。
    ^(⁵⁶⁹)


    这些方面的工作在积极推进，也还有许多问题有待研究，但目前已经取得了几个关键见解。


    一个见解是，如果我们知道自己正在被学习，我们会以更有助益的方式进行示范。“`CIRL`鼓励人类去教学，”伯克利团队写道，“而不是只知道将收益最大化。” ^(⁵⁷⁰)


    例如，研究发现，成年人在与婴儿交谈时经常使用的吟唱式话语（被称为“妈妈语”或“爸妈语”）具有深刻的教学效果。用妈妈语交谈的婴儿实际上学语言更快，不管我们有没有意识到，这似乎很关键。
    ^(⁵⁷¹)


    不仅在语言上，在动作上，我们也常常会无意识地表现出敏锐地感知到我们的行为会被他人解读。想想把物品递给他人的过程，其中就包含了容易被忽视的复杂性。我们手持东西不是以最省力的姿势，而是把手伸出去，离身体很远，这样会让手臂的压力很大，但会让另一个人收到信号，如果不是希望他们接手，我们肯定不会这样做。
    ^(⁵⁷²)


    计算机科学家正在快速吸收教育学和育儿的见解。核心思想对两个方向都有启发。我们想让自己以机器可以理解的方式行事，我们也希望机器以对我们来说“意图清晰”的方式行事。


    机器人学中有一个方向是“意图清晰的运动”，安卡·德拉甘是主要研究人员之一，事实上，这个术语就是她创造的。 ^(⁵⁷³)


    除了教学行为的重要性之外，该领域得到的第二个见解是，如果合作被构建为**互动**式的，而不是“学习，然后行动”这样两个独立的阶段，效果最佳。


    简·雷克在研究从人类的反馈中学习时发现了这一点。“对我来说，这篇论文中最有趣的事情之一，其实是一个脚注，”他说，“也就是那些奖励漏洞的例子。”


    如果自主体先完成所有奖励学习，**然后再**完成所有优化，经常会以灾难告终。自主体会发现漏洞并加以利用，而且从不犹豫。例如，雷克曾尝试教自主体学习玩《乒乓》游戏，先由人类对自主体打球的视频库的所有片段进行评判，再由自主体学习优化。在一次试验中，计算机学会了用球拍跟踪球，好像要击打它一样，但是在最后一秒钟会错开。因为它不知道游戏的真实分数，所以它没有意识到自己错过了最关键的一步。在另一次试验中，计算机学会了防守屏幕的一边并回球，但从未学会得分，因此它只是进行长时间的对打。“从安全角度来看，这很有趣，”雷克说，“因为你想了解这些事情是如何失败的，以及你能做些什么来防止它。”如果人类的反馈能与计算机的训练过程**交织**在一起，而不是完全预先加载，这类问题往往会消失。
    ^(⁵⁷⁴)


    MIT 的朱莉·沙阿研究了现实世界中的人——机器人互动式合作，得出了类似结论。“我多年来一直感兴趣的是，”她说，“如何协同优化人和机器的学习过程。”为了研究人——机器人团队，她研读了关于人——人团队管理以及如何最有效地对团队进行培训的文献。在人类团队中，激励当然很重要，但很少看到奖励明确到任务层面的微观管理。“如果你用奖励式互动来训练系统，这更像是训练狗，而不是教人做任务，”她说。
    ^(⁵⁷⁵)


    事实上，对人类团队的研究对此已经有了结论。“已经有文献基本证明了，”沙阿说，“明确命令一个人去完成某项任务，是训练两个人相互协作完成工作最糟糕的方式之一。稍加思考就能理解这一点！对吗？……这是最糟糕的人类团队培训实践。”


    “人类研究也给出了很好的策略，”她补充道，“如果多个人有相同的目标或意图——每个人都知道目标或意图是什么——但相互之间实现目标的计划不一致，而他们的工作需要相互依赖，那么他们的表现会比有次优但一致的计划时差很多。”几乎在所有团队场景中——从商业到战争，从体育到音乐——每个人的高层次目标都是相同的。但是有共同的目标还不够，他们还需要有共同的计划。


    就人类团队来说，有一个好办法是所谓的**岗位轮换培训**。团队成员临时交换角色：将他们置于队友的位置，这样他们就能意识到该如何改进自己的工作，以便更好地配合队友的需求和工作流程。岗位轮换培训可以说是人类团队训练的黄金标准，用于军事、工业和医学等各种领域。
    ^(⁵⁷⁶)


    沙阿不禁想：类似这样的方法能不能在人——机器人配合中发挥作用？人——人合作的最佳实践能否移植到机器人学？这是“一个疯狂的想法”，她说。“就像一个很小的尝试，看看行不行。虽然只是一个古怪的想法，不妨探索一下。”


    他们成功了。首先，他们想知道，在机器向人类学习方面，岗位轮换培训能否与目前的最高水平竞争。他们还问了第二个问题，这个问题在典型的这类研究中还从未提出过：这是否也有助于人类更好地学习如何与机器人合作（以及给机器人教学）？


    沙阿团队为人类与机器人手臂协作设计了一个现实任务，类似于在制造装配时放置和拧紧螺钉的任务（但没有真正的批头）。他们将传统的反馈和示范方法与轮换培训进行了比较。
    ^(⁵⁷⁷)


    “结果确实令我们惊讶和兴奋，”她说，“在轮换培训后，根据对团队绩效的客观衡量标准，我们看到了改进。”人们更愿意和机器人一起工作，而不是呆板地轮替，虽然这样的空闲时间更少，要做的工作更多。
    ^(⁵⁷⁸)


    也许同样重要也更有趣的是，他们还看到了**主观感受**的改善。相对于采取更传统的示范和反馈学习的对照组，接受过轮换培训的人更强烈地表示他们**信任**机器人，并且机器人能按照他们的偏好进行操作。


    令人难以置信的是，人与人合作的最佳实践的确能移植，这意味着其他进一步的经验很可能也能移植。“这只是初步研究，任务相对简单，”沙阿说，“但即使是在简单任务中，我们也明确看到了具有统计显著性的好处，接下来还有许多人类团队培训技术都有可能移植到人——机器人团队。”
    ^(⁵⁷⁹)


    ### 合作，无论好坏


    所有这些构成了一个很令人鼓舞的故事。人类的合作是基于一种很晚近才进化出来的几乎独一无二的能力，即推断他人的意图和目标，以及帮助他人的动机。机器也可以——而且越来越能——做同样的事情，学习我们的示范，我们的反馈，并逐渐和我们协同工作。


    随着机器的能力越来越强，也随着我们逐渐习惯与它们更紧密地合作，至少有两个方面的好消息。首先，我们已经有了初步的计算框架，让机器不仅可以**代替人**，还可以与人**协同**工作。其次，我们还有关于人类如何**相互**有效合作的大量研究，这些见解正变得越来越重要。


    如果根据当前的技术水平外推，使用诸如克里斯蒂诺和雷克的基于人类偏好的深度强化学习，以及罗素和哈德菲尔德——梅内埃尔的`CIRL`等框架，我们可以想象未来具有非凡智慧和能力的机器，它们将能领会我们每个意图和欲望最微妙的差别。还有许多障碍需要克服，也必然会有许多限制，但前方的道路已经开始显现。


    然而，与此同时，有一些值得注意的地方。这些在不久的将来出现的计算助手——无论是以数字形式还是以机器人形式，很可能两者都有——肯定存在利益冲突，它们有两个主人：它们表面上的主人和创造它们的组织。从这个意义上说，它们就像是收取佣金的管家：除非以某种方式获得收益，否则它们不会帮助我们。它们会做出我们不一定**希望**它们做出的精明推断。我们将逐渐认识到，我们几乎不会再有机会单独行动，现在已经是这样。


    我的一个朋友正在治疗酒瘾。但是社交网站的广告推荐引擎对他太了解了，经常给他推送酒类广告。它们的偏好模型认为，**现在有一个人，他喜欢饮酒。**正如英国作家艾丽丝·默多克说的：“自知之明会引导我们避开存在诱惑的场合，而不是依靠蛮力来战胜它们。”
    ^(⁵⁸⁰)


    就我自己而言，上网时我会尽量谨慎一点。至少在浏览器中，任何散发着邪恶或罪孽快感的东西——无论是点击新闻链接、查看社交媒体，还是其他我不一定想多做的数字欲望——我都是使用不在本地存储用户信息的隐私窗口。并不是感到羞耻，我不希望这些行为**被强化**。


    对于这些情形，我们不希望机器根据我们的行为推断我们的目标，并诱导我们做更多相同事情，这时我们需要的是不同的指令。我们实际上想说的是，“你不能因为我正在做这件事就推断我想做。请不要让我更容易做这件事。请不要扩增或强化它，也不要以任何方式诱导通往这条道路的欲望。请在我身后种植荆棘”。


    我认为这里有一个重要的政策问题，至少和理论问题同样重要。我们应该认真考虑让用户有权看到和**改变**网站、应用软件或广告商对他们的偏好分析。值得考虑对此施加监管：也就是说，本质上，我有权拥有自己的模型。我有权说，**那不是我**。或者，有抱负地说，这才是我想成为的人，**这才是你必须为其争取利益的人。**


    这是目前最棘手的问题。我们的数字管家正在密切注视我们。它们既看到了我们公开的生活，也窥见了我们的隐私，看到了我们最好的自己和最坏的自己，却不一定知道哪个是哪个，也不做任何区分。总的来说，它们身处某种隐秘复杂的山谷：能够根据我们的行为推断我们的欲望的复杂模型，但无法被教导，也不愿合作。它们在努力预测我们下一步要做什么，思考如何赚得下一笔佣金，但它们似乎不明白我们想要什么，更不用说我们希望成为怎样的人。


    有些人可能会说，也许这会让我们展现更好的自己。的确，当人类感到自己被监视时，他们会表现得更有道德。在实验室研究中，当人们被摄像时，当房间里有单向镜子时，当房间明亮而不是昏暗时，他们不太可能作弊。
    ^(⁵⁸¹)


    18 世纪哲学家杰里米·边沁著名的“全景监狱”构想，其实就利用了这一点。在一个圆形监狱中，所有牢房都环绕着一个守卫塔，囚犯不知道自己是否正在被监视。边沁鼓吹监视的净化作用，甚至不需要实际监视，只需暗示有监视，他称他的圆形建筑为“碾出流氓的诚实的磨坊”，
    ^(⁵⁸²)


    另一方面，这样也有可能使得人人自危，并造成各种影响。毕竟，我们通常不希望监狱外的生活也同监狱里一样。


    不那么邪恶，但同样令人担忧的是，`IRL`的标准数学假设人类行为来自“专家”，示范者知道自己想要什么，并且会做（很有可能）正确的事情来获得它。如果这些假设不成立，系统就有可能扩增新手的无知行为，或者增加本来是试探性、探索性行为的风险。我们先爬后走，先走后开车。也许最好不要机械地传递扩增我们的每一个动作。


    无论是好是坏，人类都已经身处这样的境地，而且即便在我们对未来的乐观预期中也是越来越如此；无论是好是坏，我们都会被更加了解；无论是好是坏，这个世界都将充斥着类似
    2 岁孩子的算法，它们向我们走来，打开它们认为我们可能想要打开的门，试图以各种方式提供帮助。


    ## 9. 不定


    人类给人类带来的最大罪恶，大部分都是由于人们对某些事实上是错误的事情感到非常确定。


    ——伯特兰·罗素 ^(⁵⁸³)


    以上帝的心肠，我恳求你，想想你可能是错的。


    ——奥利弗·克伦威尔（Oliver Cromwell）


    自由的精神就是不太确定它正确的精神。


    ——勒恩德·汉德（Learned Hand）


    1983 年 9 月 26 日，午夜刚过，苏联值班军官斯坦尼斯拉夫·彼得罗夫（Stanislav Petrov）在莫斯科郊外的地堡里，监视着奥科预警卫星系统。突然，屏幕狂闪，警笛呼啸，警示有一枚`LGM-30`民兵洲际弹道导弹从美国袭来。


    “巨大的红色字母显现在主屏幕上，”他说。这些字母写着：发射。


    “我立刻从椅子上站了起来，”彼得罗夫说，“我所有的下属都很困惑，所以我对他们大声发号施令以免恐慌。” ^(⁵⁸⁴)


    警报又响了，提示第二枚导弹已经发射，然后是第三枚，第四枚，第五枚。


    “舒适的扶手椅此时感觉就像滚烫的煎锅，我的腿在颤抖，”他说，“我觉得我连站都站不稳。”


    彼得罗夫一手拿着电话，一手拿着对讲机。电话那头，另一名军官冲他大喊，让他保持冷静。“我承认，”彼得罗夫说，“我很害怕。”


    规定很明确。彼得罗夫要向上级报告导弹正在袭来，上级将决定是否下令全面报复。但是，他说：“规定没说我们在报告之前可以**思考**多长时间。” ^(⁵⁸⁵)


    彼得罗夫觉得，有些事情说不通。他受过训练，知道美国的攻击规模会比这大得多。5 枚导弹……不符合常理。“警报在呼啸，但我坐了几秒钟，盯着背光源的红色大屏幕，上面写着‘发射’。”他回忆道，
    ^(⁵⁸⁶)


    预警系统显示其警报的可靠性水平为“最高”。尽管如此，这还是说不通。彼得罗夫推断，美国有数千枚导弹，为什么只发射 5 枚？“如果他们要发动战争，不会只用 5
    枚导弹，”他回忆自己的想法，这不符合他接受过的任何训练。“我有种奇怪的感觉。”他说。 ^(⁵⁸⁷)


    “然后我做了决定。不能相信计算机。我拿起电话，通知了上司，并报告说警报是假的。但直到最后一刻，我自己也不确定。我非常清楚，如果我错了，后果将无可挽回。”


    几年后，当 BBC 问他认为警报为真的可能性有多大时，他回答说：“五五开。”但是他没错。难熬的几分钟后，什么也没发生。一旦导弹越过地平线，地面雷达就能发现。雷达什么也没发现，苏联风平浪静。这是一个系统错误：只不过是北达科他州上空云层反射的阳光。


    ### 从未见过


    天地之间有许多事情，是你的睿智所无法想象的。


    ——哈姆雷特


    尽管奥科预警系统自我报告了“最高”可靠性，彼得罗夫还是觉得这种情况很奇怪，他有理由不相信它的结论。感谢上帝，有一个人类在这个环路中，否则至少 1 亿条生命危在旦夕。


    然而，潜在的相同问题——不仅会做出错误判断，还会以极度的自信做出错误判断的系统——直到今天仍然让研究人员感到担忧。


    深度学习系统有一个众所周知的特性是它们特别“脆弱”。我们知道 2012 年诞生的`AlexNet`，通过用数十万张属于某一类别的图片进行训练，它能神奇地总结出普遍模式，从而能正确地识别它从未见过的猫、狗、汽车和人。但是有一个问题。它会对你展示的所有图像进行分类，包括随机生成的彩色噪点图。它说，这是猎豹，有
    99.6%的置信度，那是菠萝蜜，有 99.6%的置信度。系统就像是在产生幻觉，而且似乎缺乏确认机制，更不用说提醒用户它在这样做。正如 2015 年一篇被广泛引用的论文说的：“深度神经网络很容易被愚弄。”
    ^(⁵⁸⁸)


    一个与此有密切关联的想法是所谓的对抗样本。一幅图像，网络有 57.7%的置信度认为是熊猫（也的确是熊猫），逐渐改变其像素，突然网络有 99.3%的置信度认为这个逐渐变化的图像是长臂猿。
    ^(⁵⁸⁹)


    对于这种情况到底哪里出了问题，以及对此可以做些什么，计算机专家进行了许多尝试。


    俄勒冈州立大学的计算机科学家托马斯·迪特里希（Thomas Dietterich）认为，这个问题很大程度上是由于：视觉系统在训练中输入的每幅图像都是某种东西——画笔、壁虎、龙虾。然而，绝大多数可能的图像——彩色像素的可能组合——根本**什么**也不是。雾蒙蒙的噪点。随机的立体线条和边缘，缺乏基本的形状。迪特里希认为，像`AlexNet`这样的系统是用被标记为一千种类别中的一个类别的图像训练出来的，“隐含地假设世界只由，比方说，一千种类别的对象组成”。
    ^(⁵⁹⁰)


    迪特里希在自己的研究过程中得到过惨痛教训。他做过一个项目，“淡水大型无脊椎动物的自动计数”——其实就是数溪流中的虫子。环保局和研究者使用在淡水溪流中采集的昆虫的数量，作为衡量溪流和当地生态系统健康状况的标准，学生和研究人员要花很多冗长乏味的时间人工分类和标记网袋中捕捉到的昆虫：石蝇、石蛾、蜉蝣等。迪特里希认为，基于图像识别技术最近的突破，他能帮上忙。他和同事采集了
    29 种不同昆虫的样本，训练了一个机器视觉系统，能以 95%的准确率对昆虫分类。


    '
