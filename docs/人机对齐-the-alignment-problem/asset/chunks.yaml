- raw: '在桑顿和巴图开创性的强化学习教科书中，探讨了总是试图实现最好可能性的离轨（“可能主义”）自主体是如何让自己陷入麻烦的。想象一辆自动驾驶车辆需要从海岸悬崖边的一个地点开到另一个地点。最短和最高效的路线就是沿着悬崖边缘走。如果车辆足够稳定，这是最优路线。但如果车辆有点摇晃或不稳，这就是在玩火。更好的做法可能是绕行无须完美驾驶也能成功的路线。这就是现实主义，同轨方法训练的车辆确实会学会走更安全、更稳当的路线，而不是收益稍高但风险也更高的路线。
    ^([^(507)](#fn507))


    模仿偶像或老师，不管模仿者是人还是机器，都会带来可能主义和离轨估值的危险。 ^([^(508)](#fn508))


    自20世纪中叶以来，经济学家就一直在讨论“次优理论”，该理论认为，知道在遵循一系列数学假设的理论版本的经济系统中做什么是最优的，对于稍微偏离这些假设的实际经济可能毫无价值。应该遵循的“次优”策略或行动，可能与最优策略没有任何相似之处。
    ^([^(509)](#fn509))


    看到这样的例子，任何想要模仿的人都应该会更加慎重。模仿在某种程度上是内在的可能主义者，想要一口吃成胖子。当孩子模仿开车、切菜或给宠物看病时，可能很可爱，但如果他们真的伸手去拿车钥匙或刀（甚至抓猫）时，我们就会阻止。我们实际上想看到的行为可能与模仿没有多少相似之处：开车的“次优”是坐在乘客座位上；切菜的“次优”是帮忙摆好餐具；如果猫受伤了，“次优”是告诉爸爸妈妈。


    对于机器模仿者，我们最好铭记次优理论。如果机器想向我们学习，我们必须注意不要让机器在不经意间学会启动一旦开始就很棘手的行为。如果它们已经足够专业，这个问题可能没有意义。但在那之前，模仿可能是诅咒，用用户界面设计师布鲁斯·巴伦坦（Bruce Balentine）的话说：“做一台好机器好过做一个坏人。”
    ^([^(510)](#fn510))


    **扩增：自我模仿与超越**


    我过去最喜欢的棋手可能是……三四年前的自己。


    ——国际象棋世界冠军芒努斯·卡尔森（Magnus Carlsen） ^([^(511)](#fn511))


    模仿的第三个基本挑战是，如果目标是**模仿**老师，模仿者将很难**超越**老师。


    塞缪尔就意识到了这一点。塞缪尔是机器学习领域的开创者之一，机器学习一词就是他创造的。前面曾提到，1959年他在IBM开发了下西洋跳棋的机器学习系统。“我向系统输入了我知道的一些下棋原则，”他说，“尽管我当时不知道，现在也不知道，它们的确切作用是什么。”这份清单包括比如有多少跳棋，有多少王，有多少种走法，等等。
    ^([^(512)](#fn512))


    这个程序最后击败了塞缪尔，尽管使用的是塞缪尔给出的战略。它能准确预测未来的一些走法，再加上对不同因素的权重反复试验微调，得到了一个超越自己老师的系统。就当时而言，这是一项了不起的成就，正如说过的，它以一己之力推动了IBM股价上涨，这也是让塞缪尔感到自豪的成就之一。但是他也敏锐意识到了这个项目的局限。“程序现在按照**我的**跳棋原则运作，并且很好地发挥了它的优势，”他哀叹道，“要想进一步提升它的水平，唯一的方法是教给它更好的原则。但是怎么做呢？……目前世界上还只有我能教它，而它已经远远超出了我的水平。”


    塞缪尔推断，要获得更好的原则，需要让程序以某种方式自行生成策略。“要是计算机**能**生成自己的原则就好了！但我认为近期实现这一目标的可能性很小，”他说，
    ^([^(513)](#fn513))


    到20世纪末，教计算机下棋的基本技术变化不大，它们的局限性也依然没变。计算速度提升了数百万倍，强化学习已发展成为一个领域，但是机器似乎并没有发生根本变化，它们仍然依赖**我们**。


    20世纪90年代，研发国际象棋超级计算机深蓝的IBM团队设计的价值函数仍然类似几十年前塞缪尔为跳棋设计的。团队与人类大师合作，试图列举并阐明决定棋局势态的所有因素：比如双方的棋子数量、机动性和空间、王的安全、棋子结构等等。不过他们使用的参考因素不是像塞缪尔那样只有38条，而是8千条。
    ^([^(514)](#fn514))


    那么，这几千种因素到底是如何权衡的呢？通过模仿。


    深蓝团队获得了70万份特级大师比赛棋谱的数据库。他们将这些真实棋局展示给程序，并问它会怎么走。以模仿人类下法为目标，据此微调它的价值函数。比方说，如果增加分配给保有一对象的权重会让它更有可能使用人类大师的下法，那么深蓝就会增加一对象的权重。


    这种模仿人类的棋局态势评估——关注的因素本身也是来自人类专家——与计算机的精确计算、高速和蛮力相结合，**每秒**能够搜索数亿个未来棋局，并以类似象棋大师的方式评估棋局，最终在1997年的传奇比赛中击败了人类象棋冠军加里·卡斯帕罗夫。深蓝公司的项目主管谭崇仁（C. J. Tan）说：“加里准备和计算机比赛，但是我们把它编程为像特级大师一样下棋。”
    ^([^(515)](#fn515))


    从哲学角度看，这个领域的一些人想知道程序是否最终会因为继续依赖模仿人类而受限。在计算机跳棋方面，阿尔伯塔大学的乔纳森·谢弗（Jonathan Schaeffer）在20世纪90年代初开发了一个非常好的程序，当它选择一个不同于人类特级大师的下法时，经常它自己的下法还更好。“当然，我们可以继续‘改进’评估函数，让它与人类下法更一致，”他写道。但是“没有明显的理由值得这样做”。一方面，让程序以更常规的方式下棋可能会削弱它让人类对手出乎意料的能力；另一方面，还不清楚一旦程序达到了最优秀的人类玩家水平，模仿是否还有用。“我们发现很难取得进一步突破。”谢弗承认。
    ^([^(516)](#fn516))


    15年后，DeepMind的AlphaGo终于实现了塞缪尔的愿景，即一个可以从头开始自己设计棋局评估的系统。设计者没有人工为它设计数以千计要考虑的特征，而是用深度神经网络来自动识别使特定下法概率更大的模式和关系，就像AlexNet识别狗和汽车的视觉纹理和形状一样。该系统的训练类似深蓝：依靠一个庞大的有3000万步棋的数据库，学习预测人类围棋专家的走法。
    ^([^(517)](#fn517))


    尽管如此，具有讽刺意味的是，这个超越人类的弈棋程序本质上还是一个模仿者。 ^([^(518)](#fn518))


    深蓝和AlphaGo的成功之所以可能，是因为有庞大的人类实例数据库可以供机器学习。机器学习的这些标志性成功轰动了全球，之所以会这样是因为这些棋类在全球很普及，而正是这些棋类的受欢迎程度促成了它们的成功。我们下出的每一步都可能会被用来对付我们。如果是不那么普及的游戏，计算机赢棋造成的影响不会这么大，它们也不会有足够的例子学习。因此，普及程度起到了双重作用，使得这一成就**影响很大**，但也是这一点让它**成为可能**。


    然而，AlphaGo刚刚登上巅峰，就在2017年被**更强大**的程序AlphaGo Zero超越。 ^([^(519)](#fn519))


    正如DeepMind团队的在《自然》期刊论文中写的：“人类从数千年来下的无数盘棋中积累围棋知识，这些知识被浓缩成模式、谚语和书籍。” ^([^(520)](#fn520))


    与此同时，在引擎盖下正在发生一些非常有趣，富有启发的事情：该系统没有学习过人类下过的任何一盘棋。但是尽管如此，它仍然是通过模仿学习。它在学习模仿……**自己**。


    这个模仿自己的过程如下：在围棋和国际象棋这类棋类游戏中，人类专家采用的是某种“快与慢”思维方式。 ^([^(521)](#fn521))


    “快”思维的第一个部分是，在明确的推理之前或之外，我们对某个特定棋局有多好有一种直观判断。这就是我们一直在讨论的“价值函数”或“评估函数”。在AlphaGo Zero中，体现为一个名为“价值网络”的神经网络，它输出一个百分比，代表的是AlphaGo Zero认为那个棋局有多大可能会赢。


    “快”思维的第二个部分是，当我们观看棋局时，我们会考虑接下来的一些走法，只考虑那些明显的走法，其他走法则不予考虑。首先依靠直觉给出合理或有希望的候选走法，然后针对这些走法展开慢而审慎的“如果这样，那么那样”推演。这就是AlphaGo Zero变得有趣的地方。这些候选走法由一个名为“策略网络”的神经网络给出，它的输入是当前棋局，并为每个候选走法分配一个从0到100的百分比。这个数字代表什么？系统在押注自己最终将决定采取的行动。


    这是一个相当奇怪甚至矛盾的想法，值得进一步阐明。对于每一个候选走法，策略网络代表了AlphaGo Zero的猜测，即在进行明确的MCTS搜索以从该棋局向前推演之后，选择该走法的可能性有多大。有点不可思议的是，系统使用这些概率，将慢的MCTS搜索聚焦到它认为最有可能的一些走法上。
    ^([^(522)](#fn522))


    鉴于系统使用这些预测来指导搜索，而预测的又正是搜索结果，这听起来可能像是自证预言。事实上，快系统和慢系统在相互磨砺。随着策略网络快预测的改进，慢的MCTS算法利用它们来在未来可能的走法路径中执行更聚焦更明智的搜索。通过这种更精细的搜索，AlphaGo Zero变得更强。然后，策略网络会进行调整，以预测这些新的、更强的走法，这反过来又让系统的慢思维变得更明智。这是良性循环。


    这个过程在专业上被称为“扩增”，但也可以称为超越。AlphaGo Zero学会了只模仿自己。它利用自己的预测做出更好的决定，然后反过来又学习预测那些更好的决定。它开始于随机预测和随机行动。72小时后，它成为了全世界有史以来最强的围棋手。


    **价值扩增**


    你应该认为模仿是崇拜中最可接受的部分，神更希望人类像他们，而不是奉承他们。


    ——马可·奥勒留（Marcus Aurelius） ^([^(523)](#fn523))


    越来越多的哲学家和计算机科学家开始关注更长远的未来，对于他们来说，如果我们必须向具有灵活智能和灵巧能力的系统传授极为复杂的行为和价值观，那么这不仅提出了技术问题，还提出了更深层次的问题。


    有两个主要挑战。第一，我们想要的东西很难简单明了地表达出来——无论是用语言还是数值形式。正如人类未来研究所的尼克·博斯特罗姆指出的：“列出我们关心的所有事项似乎是完全不可能的。”
    ^([^(524)](#fn524))


    第二个更深层次的挑战是，传统的基于奖励的强化学习和模仿学习技术都要求人类充当最终权威。正如我们看到的，模仿学习系统可以超越它们的老师，但前提是老师们示范的不完美在很大程度上能相互抵消，或者专家虽然做不到他们想示范的，但至少能判别。


    在更遥远的未来，必然会有更强大的系统运行在更微妙和更复杂的现实环境中，我们在每一个领域的前沿都面临挑战。


    例如，有些人担心人类不是道德权威的特别好的来源。“对于将人类价值观注入机器的问题已经有了很多探讨，”谷歌的布莱斯·阿克斯（Blaise Agüera y Arcas）说，“我其实不认为这是主要问题。我认为问题在于人类的价值观自身还需要改进，它们不够好。”
    ^([^(525)](#fn525))


    机器智能研究所的共同创始人埃利泽·尤多科夫斯基（Eliezer Yudkowsky）在2004年写了一份颇具影响力的手稿。他主张，赋予机器能力不仅仅是为了模仿和维护我们体现出的不完美的规范，而是为了向机器注入他所说的“连贯外推意志”。“用诗意的话来说，”他写道，“我们的**连贯外推意志**就是，假如我们知道得更多，思考得更快，更接近我们想成为的人，那么我们会有怎样的愿望。”
    ^([^(526)](#fn526))


    在有相对明确的衡量成功的外部标准的领域，比如跳棋、围棋或《蒙特祖玛的复仇》，机器可以直接将模仿作为更传统的强化学习技术的起点，通过反复尝试来磨炼最初的模仿行为，并且有可能让自己的老师黯然失色。


    然而，在道德领域，如何模仿就不那么清楚了，因为不存在这样的外部标准。 ^([^(527)](#fn527))


    更重要的是，如果我们试图教授的系统有一天比我们更聪明，它们可能会采取我们难以评估的行动。例如，如果未来的系统提议改革临床试验法规，我们甚至不一定有能力评估提议是否符合我们的道德规范，无论我们是经过深思熟虑还是在紧张的反馈循环中草草决定。所以，再次强调，一旦系统的行为超出了我们自身的认知，我们如何继续以自己为范本来训练它呢？


    OpenAI的保罗·克里斯蒂诺（Paul Christiano）对这一系列问题进行了深入思考。“我真的很想知道，当规模扩增时，解决方案应该是怎样的，”他说，“我们具体的计划是什么？最终的结局会怎样？对这个问题感兴趣的人相对还较少，研究的人就更少了。”
    ^([^(528)](#fn528))


    早在2012年，克里斯蒂诺就意识到，即使是面对最困难的场景，我们也有可能找到突破口。他一直在对此进行研究。 ^([^(529)](#fn529))


    克里斯蒂诺认为，也许可以用相同的模式——他称之为“迭代蒸馏和扩增”——来开发系统进行复杂判断，超越我们自己，但又与我们保持一致。


    例如，假设我们在为某个大城市规划新的地铁系统。与雅达利游戏或围棋不同，我们做不到每秒评估数千种规划，事实上，评估一次可能就要数月。还与雅达利游戏或围棋不同的是，没有客观的衡量标准，人们认为好的地铁系统才是“好的”。


    我们可以——比如说，通过常规的模仿学习——训练一个机器学习系统到一定的水平，然后以此为基础，**用它**来帮助评估规划，就像一个资深规划师带着几个初级规划师。我们可以安排一个系统副本估计等待时长，安排另一个副本估计预算，可能还安排第三个副本评估可达性。作为“老板”，我们会做最终决定，“扩增”机器下属的工作。反过来，这些下属又会从我们的最终决定中“蒸馏”出它们所能得到的教训，并因此成为稍微更好一些的规划师：速度更快，比我们自己要快得多，但以我们的做法为榜样。然后继续迭代，将下一个项目交给这个稍有改进的团队，不断良性循环。


    克里斯蒂诺认为，最终我们会发现，我们的团队就是我们**希望**成为的那种规划师——“如果我们知道得更多，思考得更快，更接近我们希望成为的那种规划师时”，我们就能成为那种规划师。


    还有许多工作要做。克里斯蒂诺希望找到扩增和蒸馏的方法，以**可证明**的方式与人类对齐。目前，这是否能做到仍是一个悬而未决的问题，仍然停留在希望。初步的小规模实验正在进行中。“如果我们能实现这一希望，”克里斯蒂诺和他的OpenAI同事写道，“这将是朝着扩大机器学习的应用范围，和解决有关AI长期影响的担忧迈出的重要一步。”
    ^([^(530)](#fn530))


    克里斯蒂诺已成为对齐问题研究领域的领军人物。在讨论他在扩增方面的工作时，我问克里斯蒂诺，他是否认为自己是其他有兴趣研究类似问题的人的榜样。他的回答令我惊讶。


    “希望以后的人们不用像我一样。”他说。 ^([^(531)](#fn531))


    克里斯蒂诺解释道，在专注于AI安全领域之前，他不得不双线作战。他可能属于最后一批不得不这样的对齐问题研究人员：先通过研究更常规的问题获得学位，同时想办法做他认为真正重要的研究。“我不得不先离开，花很长时间研究别的东西，”他说，“倚靠学术圈子做研究比较容易。”仅仅几年后，这个圈子就出现了。
    ^([^(532)](#fn532))


    或许，作为开拓者就是这样：与其说别人会完全模仿你的榜样，或者重走你的路，不如说——因为你的努力——他们不必如此。


    ## **8. 推断**


    密歇根大学的心理学家费利克斯·沃纳肯（Felix Warneken）抱着一大摞杂志穿过房间，走向一个关着的柜子。他撞到了柜子上，吓了一跳，“哟！”他往后退，盯着柜子看了一会儿，疑惑不解地说了一声：“嗯？”又走上前，杂志又撞在柜门上。他再次后退，感到挫败，可怜地说：“嗯……”好像不知道自己哪里做错了。


    一个蹒跚学步的孩子从房间角落里走过来帮他。孩子有点不稳地走向柜子，挨个把柜门打开，带着探询的表情抬头看着沃纳肯，然后退后。沃纳肯表示了感激，把杂志放在柜子里。
    ^([^(533)](#fn533))


    2006年，沃纳肯与杜克大学的迈克尔·托马塞洛合作，第一次系统地证明了，18个月大的人类婴儿就能正确判断人类同伴遇到了困难，能识别人类的目标和面临的障碍，并且会在力所能及时自发提供帮助，即使没有人请求他们帮忙，即使成年人甚至没有和他们眼神交流，即使他们预期这样做没有回报。
    ^([^(534)](#fn534))


    这是一种非常复杂的能力，几乎是人类独有的。与人类遗传最接近的黑猩猩有时会自发提供帮助，但有一些前提：它们的注意力要被吸引到当前的事情上来，人类要明显在伸手去拿够不到的东西（更复杂的情况不行，比如面对柜子），
    ^([^(535)](#fn535))


    沃纳肯和托马塞洛的研究表明，这种帮助行为“在进化上极其罕见”，在人类身上比在人类近亲动物身上更为明显，甚至在语言出现之前就已经很常见了。正如托马塞洛说的：“人类认知与其他动物认知的关键区别在于，人类有能力与他人一起参与具有共同目标和意图的协作活动。”
    ^([^(536)](#fn536))


    “儿童在以前被描述为天生自私，只关心自己的需求。是社会以某种方式重新编程，让他们变得具有利他性，”沃纳肯说， ^([^(537)](#fn537))


    这不仅需要有提供帮助的**动机**，还涉及极其复杂的认知过程：**推断**对方的目的，而且通常只根据一点点行为。


    “人类是读心术专家。”托马塞洛说。这种专家级知识最令人印象深刻的部分可能是我们推断他人**信念**的能力，但基础是推断他人的**意图**。事实上，直到4岁左右，儿童才开始知道别人在想什么。但是到第一个生日时，他们已经开始知道别人想要什么了。
    ^([^(538)](#fn538))


    研究人员越来越认为，我们向机器灌输人类价值观时也应采取同样的策略。也许，与其煞费苦心地尝试手工编码我们关心的东西，不如开发直接**观察**人类行为并从中**推断**我们的价值观和意图的机器。理查德·费曼（Richard Feynman）将宇宙描述为“由神在下的伟大棋局……我们不知道规则，我们能做的就是观棋”。在AI中，这种方法被称为“逆强化学习”，我们在其中扮演了神的角色，机器必须观察我们，并推断**我们**行动的规则。


    **逆强化学习**


    1997年，加州大学伯克利分校的斯图尔特·罗素走在去西夫韦超市的路上，他边走边想一个问题，为什么我们要这样走路。“我们走路的方式都是差不多的。但是如果你看过《愚蠢行走部》中巨蟒喜剧团的表演，你会发现除了常规的走路方式，还有很多其他的走路方式。那为什么我们都以同样的方式走路？”
    ^([^(539)](#fn539))


    这不可能**仅仅是**出于模仿，至少看起来不太可能。人类的基本步态不仅人际差异很小，而且不同文化之间，以及我们能看到的不同时代之间，也没什么差异。“这不是‘他们就是被教这样走路的’能完全解释的，”罗素说，“应该有某种原因决定了走路的**运作**方式。”


    这又引出了新问题。“这里的‘运作’是什么意思？目标函数是什么？有人提出了各种优化目标，比如‘我认为我在最小化能耗’，‘我在最小化扭矩’， ^([^(540)](#fn540))'
  fmt: '

    在桑顿和巴图开创性的强化学习教科书中，探讨了总是试图实现最好可能性的离轨（“可能主义”）自主体是如何让自己陷入麻烦的。想象一辆自动驾驶车辆需要从海岸悬崖边的一个地点开到另一个地点。最短和最高效的路线就是沿着悬崖边缘走。如果车辆足够稳定，这是最优路线。但如果车辆有点摇晃或不稳，这就是在玩火。更好的做法可能是绕行无须完美驾驶也能成功的路线。这就是现实主义，同轨方法训练的车辆确实会学会走更安全、更稳当的路线，而不是收益稍高但风险也更高的路线。^([^(507)](#fn507))


    模仿偶像或老师，不管模仿者是人还是机器，都会带来可能主义和离轨估值的危险。^([^(508)](#fn508))


    自20世纪中叶以来，经济学家就一直在讨论“次优理论”，该理论认为，知道在遵循一系列数学假设的理论版本的经济系统中做什么是最优的，对于稍微偏离这些假设的实际经济可能毫无价值。应该遵循的“次优”策略或行动，可能与最优策略没有任何相似之处。^([^(509)](#fn509))


    看到这样的例子，任何想要模仿的人都应该会更加慎重。模仿在某种程度上是内在的可能主义者，想要一口吃成胖子。当孩子模仿开车、切菜或给宠物看病时，可能很可爱，但如果他们真的伸手去拿车钥匙或刀（甚至抓猫）时，我们就会阻止。我们实际上想看到的行为可能与模仿没有多少相似之处：开车的“次优”是坐在乘客座位上；切菜的“次优”是帮忙摆好餐具；如果猫受伤了，“次优”是告诉爸爸妈妈。


    对于机器模仿者，我们最好铭记次优理论。如果机器想向我们学习，我们必须注意不要让机器在不经意间学会启动一旦开始就很棘手的行为。如果它们已经足够专业，这个问题可能没有意义。但在那之前，模仿可能是诅咒，用用户界面设计师布鲁斯·巴伦坦（Bruce Balentine）的话说：“做一台好机器好过做一个坏人。”^([^(510)](#fn510))


    ## 扩增：自我模仿与超越


    我过去最喜欢的棋手可能是……三四年前的自己。


    ——国际象棋世界冠军芒努斯·卡尔森（Magnus Carlsen）^([^(511)](#fn511))


    模仿的第三个基本挑战是，如果目标是**模仿**老师，模仿者将很难**超越**老师。


    塞缪尔就意识到了这一点。塞缪尔是机器学习领域的开创者之一，机器学习一词就是他创造的。前面曾提到，1959年他在IBM开发了下西洋跳棋的机器学习系统。“我向系统输入了我知道的一些下棋原则，”他说，“尽管我当时不知道，现在也不知道，它们的确切作用是什么。”这份清单包括比如有多少跳棋，有多少王，有多少种走法，等等。^([^(512)](#fn512))


    这个程序最后击败了塞缪尔，尽管使用的是塞缪尔给出的战略。它能准确预测未来的一些走法，再加上对不同因素的权重反复试验微调，得到了一个超越自己老师的系统。就当时而言，这是一项了不起的成就，正如说过的，它以一己之力推动了IBM股价上涨，这也是让塞缪尔感到自豪的成就之一。但是他也敏锐意识到了这个项目的局限。“程序现在按照**我的**跳棋原则运作，并且很好地发挥了它的优势，”他哀叹道，“要想进一步提升它的水平，唯一的方法是教给它更好的原则。但是怎么做呢？……目前世界上还只有我能教它，而它已经远远超出了我的水平。”


    塞缪尔推断，要获得更好的原则，需要让程序以某种方式自行生成策略。“要是计算机**能**生成自己的原则就好了！但我认为近期实现这一目标的可能性很小，”他说，^([^(513)](#fn513))


    到20世纪末，教计算机下棋的基本技术变化不大，它们的局限性也依然没变。计算速度提升了数百万倍，强化学习已发展成为一个领域，但是机器似乎并没有发生根本变化，它们仍然依赖**我们**。


    20世纪90年代，研发国际象棋超级计算机深蓝的IBM团队设计的价值函数仍然类似几十年前塞缪尔为跳棋设计的。团队与人类大师合作，试图列举并阐明决定棋局势态的所有因素：比如双方的棋子数量、机动性和空间、王的安全、棋子结构等等。不过他们使用的参考因素不是像塞缪尔那样只有38条，而是8千条。^([^(514)](#fn514))


    那么，这几千种因素到底是如何权衡的呢？通过模仿。


    深蓝团队获得了70万份特级大师比赛棋谱的数据库。他们将这些真实棋局展示给程序，并问它会怎么走。以模仿人类下法为目标，据此微调它的价值函数。比方说，如果增加分配给保有一对象的权重会让它更有可能使用人类大师的下法，那么深蓝就会增加一对象的权重。


    这种模仿人类的棋局态势评估——关注的因素本身也是来自人类专家——与计算机的精确计算、高速和蛮力相结合，**每秒**能够搜索数亿个未来棋局，并以类似象棋大师的方式评估棋局，最终在1997年的传奇比赛中击败了人类象棋冠军加里·卡斯帕罗夫。深蓝公司的项目主管谭崇仁（C. J. Tan）说：“加里准备和计算机比赛，但是我们把它编程为像特级大师一样下棋。”^([^(515)](#fn515))


    从哲学角度看，这个领域的一些人想知道程序是否最终会因为继续依赖模仿人类而受限。在计算机跳棋方面，阿尔伯塔大学的乔纳森·谢弗（Jonathan Schaeffer）在20世纪90年代初开发了一个非常好的程序，当它选择一个不同于人类特级大师的下法时，经常它自己的下法还更好。“当然，我们可以继续‘改进’评估函数，让它与人类下法更一致，”他写道。但是“没有明显的理由值得这样做”。一方面，让程序以更常规的方式下棋可能会削弱它让人类对手出乎意料的能力；另一方面，还不清楚一旦程序达到了最优秀的人类玩家水平，模仿是否还有用。“我们发现很难取得进一步突破。”谢弗承认。^([^(516)](#fn516))


    15年后，DeepMind的AlphaGo终于实现了塞缪尔的愿景，即一个可以从头开始自己设计棋局评估的系统。设计者没有人工为它设计数以千计要考虑的特征，而是用深度神经网络来自动识别使特定下法概率更大的模式和关系，就像AlexNet识别狗和汽车的视觉纹理和形状一样。该系统的训练类似深蓝：依靠一个庞大的有3000万步棋的数据库，学习预测人类围棋专家的走法。^([^(517)](#fn517))


    尽管如此，具有讽刺意味的是，这个超越人类的弈棋程序本质上还是一个模仿者。^([^(518)](#fn518))


    深蓝和AlphaGo的成功之所以可能，是因为有庞大的人类实例数据库可以供机器学习。机器学习的这些标志性成功轰动了全球，之所以会这样是因为这些棋类在全球很普及，而正是这些棋类的受欢迎程度促成了它们的成功。我们下出的每一步都可能会被用来对付我们。如果是不那么普及的游戏，计算机赢棋造成的影响不会这么大，它们也不会有足够的例子学习。因此，普及程度起到了双重作用，使得这一成就**影响很大**，但也是这一点让它**成为可能**。


    然而，AlphaGo刚刚登上巅峰，就在2017年被**更强大**的程序AlphaGo Zero超越。^([^(519)](#fn519))


    正如DeepMind团队的在《自然》期刊论文中写的：“人类从数千年来下的无数盘棋中积累围棋知识，这些知识被浓缩成模式、谚语和书籍。”^([^(520)](#fn520))


    与此同时，在引擎盖下正在发生一些非常有趣，富有启发的事情：该系统没有学习过人类下过的任何一盘棋。但是尽管如此，它仍然是通过模仿学习。它在学习模仿……**自己**。


    这个模仿自己的过程如下：在围棋和国际象棋这类棋类游戏中，人类专家采用的是某种“快与慢”思维方式。^([^(521)](#fn521))


    “快”思维的第一个部分是，在明确的推理之前或之外，我们对某个特定棋局有多好有一种直观判断。这就是我们一直在讨论的“价值函数”或“评估函数”。在AlphaGo Zero中，体现为一个名为“价值网络”的神经网络，它输出一个百分比，代表的是AlphaGo Zero认为那个棋局有多大可能会赢。


    “快”思维的第二个部分是，当我们观看棋局时，我们会考虑接下来的一些走法，只考虑那些明显的走法，其他走法则不予考虑。首先依靠直觉给出合理或有希望的候选走法，然后针对这些走法展开慢而审慎的“如果这样，那么那样”推演。这就是AlphaGo Zero变得有趣的地方。这些候选走法由一个名为“策略网络”的神经网络给出，它的输入是当前棋局，并为每个候选走法分配一个从0到100的百分比。这个数字代表什么？系统在押注自己最终将决定采取的行动。


    这是一个相当奇怪甚至矛盾的想法，值得进一步阐明。对于每一个候选走法，策略网络代表了AlphaGo Zero的猜测，即在进行明确的MCTS搜索以从该棋局向前推演之后，选择该走法的可能性有多大。有点不可思议的是，系统使用这些概率，将慢的MCTS搜索聚焦到它认为最有可能的一些走法上。^([^(522)](#fn522))


    鉴于系统使用这些预测来指导搜索，而预测的又正是搜索结果，这听起来可能像是自证预言。事实上，快系统和慢系统在相互磨砺。随着策略网络快预测的改进，慢的MCTS算法利用它们来在未来可能的走法路径中执行更聚焦更明智的搜索。通过这种更精细的搜索，AlphaGo Zero变得更强。然后，策略网络会进行调整，以预测这些新的、更强的走法，这反过来又让系统的慢思维变得更明智。这是良性循环。


    这个过程在专业上被称为“扩增”，但也可以称为超越。AlphaGo Zero学会了只模仿自己。它利用自己的预测做出更好的决定，然后反过来又学习预测那些更好的决定。它开始于随机预测和随机行动。72小时后，它成为了全世界有史以来最强的围棋手。


    ### 价值扩增


    你应该认为模仿是崇拜中最可接受的部分，神更希望人类像他们，而不是奉承他们。


    ——马可·奥勒留（Marcus Aurelius）^([^(523)](#fn523))


    越来越多的哲学家和计算机科学家开始关注更长远的未来，对于他们来说，如果我们必须向具有灵活智能和灵巧能力的系统传授极为复杂的行为和价值观，那么这不仅提出了技术问题，还提出了更深层次的问题。


    有两个主要挑战。第一，我们想要的东西很难简单明了地表达出来——无论是用语言还是数值形式。正如人类未来研究所的尼克·博斯特罗姆指出的：“列出我们关心的所有事项似乎是完全不可能的。”^([^(524)](#fn524))


    第二个更深层次的挑战是，传统的基于奖励的强化学习和模仿学习技术都要求人类充当最终权威。正如我们看到的，模仿学习系统可以超越它们的老师，但前提是老师们示范的不完美在很大程度上能相互抵消，或者专家虽然做不到他们想示范的，但至少能判别。


    在更遥远的未来，必然会有更强大的系统运行在更微妙和更复杂的现实环境中，我们在每一个领域的前沿都面临挑战。


    例如，有些人担心人类不是道德权威的特别好的来源。“对于将人类价值观注入机器的问题已经有了很多探讨，”谷歌的布莱斯·阿克斯（Blaise Agüera y Arcas）说，“我其实不认为这是主要问题。我认为问题在于人类的价值观自身还需要改进，它们不够好。”^([^(525)](#fn525))


    机器智能研究所的共同创始人埃利泽·尤多科夫斯基（Eliezer Yudkowsky）在2004年写了一份颇具影响力的手稿。他主张，赋予机器能力不仅仅是为了模仿和维护我们体现出的不完美的规范，而是为了向机器注入他所说的“连贯外推意志”。“用诗意的话来说，”他写道，“我们的**连贯外推意志**就是，假如我们知道得更多，思考得更快，更接近我们想成为的人，那么我们会有怎样的愿望。”^([^(526)](#fn526))


    在有相对明确的衡量成功的外部标准的领域，比如跳棋、围棋或《蒙特祖玛的复仇》，机器可以直接将模仿作为更传统的强化学习技术的起点，通过反复尝试来磨炼最初的模仿行为，并且有可能让自己的老师黯然失色。


    然而，在道德领域，如何模仿就不那么清楚了，因为不存在这样的外部标准。^([^(527)](#fn527))


    更重要的是，如果我们试图教授的系统有一天比我们更聪明，它们可能会采取我们难以评估的行动。例如，如果未来的系统提议改革临床试验法规，我们甚至不一定有能力评估提议是否符合我们的道德规范，无论我们是经过深思熟虑还是在紧张的反馈循环中草草决定。所以，再次强调，一旦系统的行为超出了我们自身的认知，我们如何继续以自己为范本来训练它呢？


    OpenAI的保罗·克里斯蒂诺（Paul Christiano）对这一系列问题进行了深入思考。“我真的很想知道，当规模扩增时，解决方案应该是怎样的，”他说，“我们具体的计划是什么？最终的结局会怎样？对这个问题感兴趣的人相对还较少，研究的人就更少了。”^([^(528)](#fn528))


    早在2012年，克里斯蒂诺就意识到，即使是面对最困难的场景，我们也有可能找到突破口。他一直在对此进行研究。^([^(529)](#fn529))


    克里斯蒂诺认为，也许可以用相同的模式——他称之为“迭代蒸馏和扩增”——来开发系统进行复杂判断，超越我们自己，但又与我们保持一致。


    例如，假设我们在为某个大城市规划新的地铁系统。与雅达利游戏或围棋不同，我们做不到每秒评估数千种规划，事实上，评估一次可能就要数月。还与雅达利游戏或围棋不同的是，没有客观的衡量标准，人们认为好的地铁系统才是“好的”。


    我们可以——比如说，通过常规的模仿学习——训练一个机器学习系统到一定的水平，然后以此为基础，**用它**来帮助评估规划，就像一个资深规划师带着几个初级规划师。我们可以安排一个系统副本估计等待时长，安排另一个副本估计预算，可能还安排第三个副本评估可达性。作为“老板”，我们会做最终决定，“扩增”机器下属的工作。反过来，这些下属又会从我们的最终决定中“蒸馏”出它们所能得到的教训，并因此成为稍微更好一些的规划师：速度更快，比我们自己要快得多，但以我们的做法为榜样。然后继续迭代，将下一个项目交给这个稍有改进的团队，不断良性循环。


    克里斯蒂诺认为，最终我们会发现，我们的团队就是我们**希望**成为的那种规划师——“如果我们知道得更多，思考得更快，更接近我们希望成为的那种规划师时”，我们就能成为那种规划师。


    还有许多工作要做。克里斯蒂诺希望找到扩增和蒸馏的方法，以**可证明**的方式与人类对齐。目前，这是否能做到仍是一个悬而未决的问题，仍然停留在希望。初步的小规模实验正在进行中。“如果我们能实现这一希望，”克里斯蒂诺和他的OpenAI同事写道，“这将是朝着扩大机器学习的应用范围，和解决有关AI长期影响的担忧迈出的重要一步。”^([^(530)](#fn530))


    克里斯蒂诺已成为对齐问题研究领域的领军人物。在讨论他在扩增方面的工作时，我问克里斯蒂诺，他是否认为自己是其他有兴趣研究类似问题的人的榜样。他的回答令我惊讶。


    “希望以后的人们不用像我一样。”他说。^([^(531)](#fn531))


    克里斯蒂诺解释道，在专注于AI安全领域之前，他不得不双线作战。他可能属于最后一批不得不这样的对齐问题研究人员：先通过研究更常规的问题获得学位，同时想办法做他认为真正重要的研究。“我不得不先离开，花很长时间研究别的东西，”他说，“倚靠学术圈子做研究比较容易。”仅仅几年后，这个圈子就出现了。^([^(532)](#fn532))


    或许，作为开拓者就是这样：与其说别人会完全模仿你的榜样，或者重走你的路，不如说——因为你的努力——他们不必如此。


    ## 8. 推断


    密歇根大学的心理学家费利克斯·沃纳肯（Felix Warneken）抱着一大摞杂志穿过房间，走向一个关着的柜子。他撞到了柜子上，吓了一跳，“哟！”他往后退，盯着柜子看了一会儿，疑惑不解地说了一声：“嗯？”又走上前，杂志又撞在柜门上。他再次后退，感到挫败，可怜地说：“嗯……”好像不知道自己哪里做错了。


    一个蹒跚学步的孩子从房间角落里走过来帮他。孩子有点不稳地走向柜子，挨个把柜门打开，带着探询的表情抬头看着沃纳肯，然后退后。沃纳肯表示了感激，把杂志放在柜子里。^([^(533)](#fn533))


    2006年，沃纳肯与杜克大学的迈克尔·托马塞洛合作，第一次系统地证明了，18个月大的人类婴儿就能正确判断人类同伴遇到了困难，能识别人类的目标和面临的障碍，并且会在力所能及时自发提供帮助，即使没有人请求他们帮忙，即使成年人甚至没有和他们眼神交流，即使他们预期这样做没有回报。^([^(534)](#fn534))


    这是一种非常复杂的能力，几乎是人类独有的。与人类遗传最接近的黑猩猩有时会自发提供帮助，但有一些前提：它们的注意力要被吸引到当前的事情上来，人类要明显在伸手去拿够不到的东西（更复杂的情况不行，比如面对柜子），^([^(535)](#fn535))


    沃纳肯和托马塞洛的研究表明，这种帮助行为“在进化上极其罕见”，在人类身上比在人类近亲动物身上更为明显，甚至在语言出现之前就已经很常见了。正如托马塞洛说的：“人类认知与其他动物认知的关键区别在于，人类有能力与他人一起参与具有共同目标和意图的协作活动。”^([^(536)](#fn536))


    “儿童在以前被描述为天生自私，只关心自己的需求。是社会以某种方式重新编程，让他们变得具有利他性，”沃纳肯说，^([^(537)](#fn537))


    这不仅需要有提供帮助的**动机**，还涉及极其复杂的认知过程：**推断**对方的目的，而且通常只根据一点点行为。


    “人类是读心术专家。”托马塞洛说。这种专家级知识最令人印象深刻的部分可能是我们推断他人**信念**的能力，但基础是推断他人的**意图**。事实上，直到4岁左右，儿童才开始知道别人在想什么。但是到第一个生日时，他们已经开始知道别人想要什么了。^([^(538)](#fn538))


    研究人员越来越认为，我们向机器灌输人类价值观时也应采取同样的策略。也许，与其煞费苦心地尝试手工编码我们关心的东西，不如开发直接**观察**人类行为并从中**推断**我们的价值观和意图的机器。理查德·费曼（Richard Feynman）将宇宙描述为“由神在下的伟大棋局……我们不知道规则，我们能做的就是观棋”。在AI中，这种方法被称为“逆强化学习”，我们在其中扮演了神的角色，机器必须观察我们，并推断**我们**行动的规则。


    ### 逆强化学习


    1997年，加州大学伯克利分校的斯图尔特·罗素走在去西夫韦超市的路上，他边走边想一个问题，为什么我们要这样走路。“我们走路的方式都是差不多的。但是如果你看过《愚蠢行走部》中巨蟒喜剧团的表演，你会发现除了常规的走路方式，还有很多其他的走路方式。那为什么我们都以同样的方式走路？”^([^(539)](#fn539))


    这不可能**仅仅是**出于模仿，至少看起来不太可能。人类的基本步态不仅人际差异很小，而且不同文化之间，以及我们能看到的不同时代之间，也没什么差异。“这不是‘他们就是被教这样走路的’能完全解释的，”罗素说，“应该有某种原因决定了走路的**运作**方式。”


    这又引出了新问题。“这里的‘运作’是什么意思？目标函数是什么？有人提出了各种优化目标，比如‘我认为我在最小化能耗’，‘我在最小化扭矩’，^([^(540)](#fn540))

    '
  trans: '


    在桑顿和巴图开创性的强化学习教科书中，探讨了总是试图实现最好可能性的离轨（“可能主义”）自主体是如何让自己陷入麻烦的。想象一辆自动驾驶车辆需要从海岸悬崖边的一个地点开到另一个地点。最短和最高效的路线就是沿着悬崖边缘走。如果车辆足够稳定，这是最优路线。但如果车辆有点摇晃或不稳，这就是在玩火。更好的做法可能是绕行无须完美驾驶也能成功的路线。这就是现实主义，同轨方法训练的车辆确实会学会走更安全、更稳当的路线，而不是收益稍高但风险也更高的路线。^(⁵⁰⁷)


    模仿偶像或老师，不管模仿者是人还是机器，都会带来可能主义和离轨估值的危险。^(⁵⁰⁸)


    自 20 世纪中叶以来，经济学家就一直在讨论“次优理论”，该理论认为，知道在遵循一系列数学假设的理论版本的经济系统中做什么是最优的，对于稍微偏离这些假设的实际经济可能毫无价值。应该遵循的“次优”策略或行动，可能与最优策略没有任何相似之处。^(⁵⁰⁹)


    看到这样的例子，任何想要模仿的人都应该会更加慎重。模仿在某种程度上是内在的可能主义者，想要一口吃成胖子。当孩子模仿开车、切菜或给宠物看病时，可能很可爱，但如果他们真的伸手去拿车钥匙或刀（甚至抓猫）时，我们就会阻止。我们实际上想看到的行为可能与模仿没有多少相似之处：开车的“次优”是坐在乘客座位上；切菜的“次优”是帮忙摆好餐具；如果猫受伤了，“次优”是告诉爸爸妈妈。


    对于机器模仿者，我们最好铭记次优理论。如果机器想向我们学习，我们必须注意不要让机器在不经意间学会启动一旦开始就很棘手的行为。如果它们已经足够专业，这个问题可能没有意义。但在那之前，模仿可能是诅咒，用用户界面设计师布鲁斯·巴伦坦（Bruce Balentine）的话说：“做一台好机器好过做一个坏人。”^(⁵¹⁰)


    ## 扩增：自我模仿与超越


    我过去最喜欢的棋手可能是……三四年前的自己。


    ——国际象棋世界冠军芒努斯·卡尔森（Magnus Carlsen）^(⁵¹¹)


    模仿的第三个基本挑战是，如果目标是**模仿**老师，模仿者将很难**超越**老师。


    塞缪尔就意识到了这一点。塞缪尔是机器学习领域的开创者之一，机器学习一词就是他创造的。前面曾提到，1959 年他在 IBM 开发了下西洋跳棋的机器学习系统。“我向系统输入了我知道的一些下棋原则，”他说，“尽管我当时不知道，现在也不知道，它们的确切作用是什么。”这份清单包括比如有多少跳棋，有多少王，有多少种走法，等等。^(⁵¹²)


    这个程序最后击败了塞缪尔，尽管使用的是塞缪尔给出的战略。它能准确预测未来的一些走法，再加上对不同因素的权重反复试验微调，得到了一个超越自己老师的系统。就当时而言，这是一项了不起的成就，正如说过的，它以一己之力推动了
    IBM 股价上涨，这也是让塞缪尔感到自豪的成就之一。但是他也敏锐意识到了这个项目的局限。“程序现在按照**我的**跳棋原则运作，并且很好地发挥了它的优势，”他哀叹道，“要想进一步提升它的水平，唯一的方法是教给它更好的原则。但是怎么做呢？……目前世界上还只有我能教它，而它已经远远超出了我的水平。”


    塞缪尔推断，要获得更好的原则，需要让程序以某种方式自行生成策略。“要是计算机**能**生成自己的原则就好了！但我认为近期实现这一目标的可能性很小，”他说，^(⁵¹³)


    到 20 世纪末，教计算机下棋的基本技术变化不大，它们的局限性也依然没变。计算速度提升了数百万倍，强化学习已发展成为一个领域，但是机器似乎并没有发生根本变化，它们仍然依赖**我们**。


    20 世纪 90 年代，研发国际象棋超级计算机深蓝的 IBM 团队设计的价值函数仍然类似几十年前塞缪尔为跳棋设计的。团队与人类大师合作，试图列举并阐明决定棋局势态的所有因素：比如双方的棋子数量、机动性和空间、王的安全、棋子结构等等。不过他们使用的参考因素不是像塞缪尔那样只有
    38 条，而是 8 千条。^(⁵¹⁴)


    那么，这几千种因素到底是如何权衡的呢？通过模仿。


    深蓝团队获得了 70 万份特级大师比赛棋谱的数据库。他们将这些真实棋局展示给程序，并问它会怎么走。以模仿人类下法为目标，据此微调它的价值函数。比方说，如果增加分配给保有一对象的权重会让它更有可能使用人类大师的下法，那么深蓝就会增加一对象的权重。


    这种模仿人类的棋局态势评估——关注的因素本身也是来自人类专家——与计算机的精确计算、高速和蛮力相结合，**每秒**能够搜索数亿个未来棋局，并以类似象棋大师的方式评估棋局，最终在
    1997 年的传奇比赛中击败了人类象棋冠军加里·卡斯帕罗夫。深蓝公司的项目主管谭崇仁（C. J. Tan）说：“加里准备和计算机比赛，但是我们把它编程为像特级大师一样下棋。”^(⁵¹⁵)


    从哲学角度看，这个领域的一些人想知道程序是否最终会因为继续依赖模仿人类而受限。在计算机跳棋方面，阿尔伯塔大学的乔纳森·谢弗（Jonathan Schaeffer）在
    20 世纪 90 年代初开发了一个非常好的程序，当它选择一个不同于人类特级大师的下法时，经常它自己的下法还更好。“当然，我们可以继续‘改进’评估函数，让它与人类下法更一致，”他写道。但是“没有明显的理由值得这样做”。一方面，让程序以更常规的方式下棋可能会削弱它让人类对手出乎意料的能力；另一方面，还不清楚一旦程序达到了最优秀的人类玩家水平，模仿是否还有用。“我们发现很难取得进一步突破。”谢弗承认。^(⁵¹⁶)


    15 年后，DeepMind 的 AlphaGo 终于实现了塞缪尔的愿景，即一个可以从头开始自己设计棋局评估的系统。设计者没有人工为它设计数以千计要考虑的特征，而是用深度神经网络来自动识别使特定下法概率更大的模式和关系，就像
    AlexNet 识别狗和汽车的视觉纹理和形状一样。该系统的训练类似深蓝：依靠一个庞大的有 3000 万步棋的数据库，学习预测人类围棋专家的走法。^(⁵¹⁷)


    尽管如此，具有讽刺意味的是，这个超越人类的弈棋程序本质上还是一个模仿者。^(⁵¹⁸)


    深蓝和 AlphaGo 的成功之所以可能，是因为有庞大的人类实例数据库可以供机器学习。机器学习的这些标志性成功轰动了全球，之所以会这样是因为这些棋类在全球很普及，而正是这些棋类的受欢迎程度促成了它们的成功。我们下出的每一步都可能会被用来对付我们。如果是不那么普及的游戏，计算机赢棋造成的影响不会这么大，它们也不会有足够的例子学习。因此，普及程度起到了双重作用，使得这一成就**影响很大**，但也是这一点让它**成为可能**。


    然而，AlphaGo 刚刚登上巅峰，就在 2017 年被**更强大**的程序 AlphaGo Zero 超越。^(⁵¹⁹)


    正如 DeepMind 团队的在《自然》期刊论文中写的：“人类从数千年来下的无数盘棋中积累围棋知识，这些知识被浓缩成模式、谚语和书籍。”^(⁵²⁰)


    与此同时，在引擎盖下正在发生一些非常有趣，富有启发的事情：该系统没有学习过人类下过的任何一盘棋。但是尽管如此，它仍然是通过模仿学习。它在学习模仿……**自己**。


    这个模仿自己的过程如下：在围棋和国际象棋这类棋类游戏中，人类专家采用的是某种“快与慢”思维方式。^(⁵²¹)


    “快”思维的第一个部分是，在明确的推理之前或之外，我们对某个特定棋局有多好有一种直观判断。这就是我们一直在讨论的“价值函数”或“评估函数”。在 AlphaGo Zero
    中，体现为一个名为“价值网络”的神经网络，它输出一个百分比，代表的是 AlphaGo Zero 认为那个棋局有多大可能会赢。


    “快”思维的第二个部分是，当我们观看棋局时，我们会考虑接下来的一些走法，只考虑那些明显的走法，其他走法则不予考虑。首先依靠直觉给出合理或有希望的候选走法，然后针对这些走法展开慢而审慎的“如果这样，那么那样”推演。这就是
    AlphaGo Zero 变得有趣的地方。这些候选走法由一个名为“策略网络”的神经网络给出，它的输入是当前棋局，并为每个候选走法分配一个从 0 到 100
    的百分比。这个数字代表什么？系统在押注自己最终将决定采取的行动。


    这是一个相当奇怪甚至矛盾的想法，值得进一步阐明。对于每一个候选走法，策略网络代表了 AlphaGo Zero 的猜测，即在进行明确的 MCTS 搜索以从该棋局向前推演之后，选择该走法的可能性有多大。有点不可思议的是，系统使用这些概率，将慢的
    MCTS 搜索聚焦到它认为最有可能的一些走法上。^(⁵²²)


    鉴于系统使用这些预测来指导搜索，而预测的又正是搜索结果，这听起来可能像是自证预言。事实上，快系统和慢系统在相互磨砺。随着策略网络快预测的改进，慢的 MCTS
    算法利用它们来在未来可能的走法路径中执行更聚焦更明智的搜索。通过这种更精细的搜索，AlphaGo Zero 变得更强。然后，策略网络会进行调整，以预测这些新的、更强的走法，这反过来又让系统的慢思维变得更明智。这是良性循环。


    这个过程在专业上被称为“扩增”，但也可以称为超越。AlphaGo Zero 学会了只模仿自己。它利用自己的预测做出更好的决定，然后反过来又学习预测那些更好的决定。它开始于随机预测和随机行动。72
    小时后，它成为了全世界有史以来最强的围棋手。


    ### 价值扩增


    你应该认为模仿是崇拜中最可接受的部分，神更希望人类像他们，而不是奉承他们。


    ——马可·奥勒留（Marcus Aurelius）^(⁵²³)


    越来越多的哲学家和计算机科学家开始关注更长远的未来，对于他们来说，如果我们必须向具有灵活智能和灵巧能力的系统传授极为复杂的行为和价值观，那么这不仅提出了技术问题，还提出了更深层次的问题。


    有两个主要挑战。第一，我们想要的东西很难简单明了地表达出来——无论是用语言还是数值形式。正如人类未来研究所的尼克·博斯特罗姆指出的：“列出我们关心的所有事项似乎是完全不可能的。”^(⁵²⁴)


    第二个更深层次的挑战是，传统的基于奖励的强化学习和模仿学习技术都要求人类充当最终权威。正如我们看到的，模仿学习系统可以超越它们的老师，但前提是老师们示范的不完美在很大程度上能相互抵消，或者专家虽然做不到他们想示范的，但至少能判别。


    在更遥远的未来，必然会有更强大的系统运行在更微妙和更复杂的现实环境中，我们在每一个领域的前沿都面临挑战。


    例如，有些人担心人类不是道德权威的特别好的来源。“对于将人类价值观注入机器的问题已经有了很多探讨，”谷歌的布莱斯·阿克斯（Blaise Agüera y Arcas）说，“我其实不认为这是主要问题。我认为问题在于人类的价值观自身还需要改进，它们不够好。”^(⁵²⁵)


    机器智能研究所的共同创始人埃利泽·尤多科夫斯基（Eliezer Yudkowsky）在 2004 年写了一份颇具影响力的手稿。他主张，赋予机器能力不仅仅是为了模仿和维护我们体现出的不完美的规范，而是为了向机器注入他所说的“连贯外推意志”。“用诗意的话来说，”他写道，“我们的**连贯外推意志**就是，假如我们知道得更多，思考得更快，更接近我们想成为的人，那么我们会有怎样的愿望。”^(⁵²⁶)


    在有相对明确的衡量成功的外部标准的领域，比如跳棋、围棋或《蒙特祖玛的复仇》，机器可以直接将模仿作为更传统的强化学习技术的起点，通过反复尝试来磨炼最初的模仿行为，并且有可能让自己的老师黯然失色。


    然而，在道德领域，如何模仿就不那么清楚了，因为不存在这样的外部标准。^(⁵²⁷)


    更重要的是，如果我们试图教授的系统有一天比我们更聪明，它们可能会采取我们难以评估的行动。例如，如果未来的系统提议改革临床试验法规，我们甚至不一定有能力评估提议是否符合我们的道德规范，无论我们是经过深思熟虑还是在紧张的反馈循环中草草决定。所以，再次强调，一旦系统的行为超出了我们自身的认知，我们如何继续以自己为范本来训练它呢？


    OpenAI 的保罗·克里斯蒂诺（Paul Christiano）对这一系列问题进行了深入思考。“我真的很想知道，当规模扩增时，解决方案应该是怎样的，”他说，“我们具体的计划是什么？最终的结局会怎样？对这个问题感兴趣的人相对还较少，研究的人就更少了。”^(⁵²⁸)


    早在 2012 年，克里斯蒂诺就意识到，即使是面对最困难的场景，我们也有可能找到突破口。他一直在对此进行研究。^(⁵²⁹)


    克里斯蒂诺认为，也许可以用相同的模式——他称之为“迭代蒸馏和扩增”——来开发系统进行复杂判断，超越我们自己，但又与我们保持一致。


    例如，假设我们在为某个大城市规划新的地铁系统。与雅达利游戏或围棋不同，我们做不到每秒评估数千种规划，事实上，评估一次可能就要数月。还与雅达利游戏或围棋不同的是，没有客观的衡量标准，人们认为好的地铁系统才是“好的”。


    我们可以——比如说，通过常规的模仿学习——训练一个机器学习系统到一定的水平，然后以此为基础，**用它**来帮助评估规划，就像一个资深规划师带着几个初级规划师。我们可以安排一个系统副本估计等待时长，安排另一个副本估计预算，可能还安排第三个副本评估可达性。作为“老板”，我们会做最终决定，“扩增”机器下属的工作。反过来，这些下属又会从我们的最终决定中“蒸馏”出它们所能得到的教训，并因此成为稍微更好一些的规划师：速度更快，比我们自己要快得多，但以我们的做法为榜样。然后继续迭代，将下一个项目交给这个稍有改进的团队，不断良性循环。


    克里斯蒂诺认为，最终我们会发现，我们的团队就是我们**希望**成为的那种规划师——“如果我们知道得更多，思考得更快，更接近我们希望成为的那种规划师时”，我们就能成为那种规划师。


    还有许多工作要做。克里斯蒂诺希望找到扩增和蒸馏的方法，以**可证明**的方式与人类对齐。目前，这是否能做到仍是一个悬而未决的问题，仍然停留在希望。初步的小规模实验正在进行中。“如果我们能实现这一希望，”克里斯蒂诺和他的
    OpenAI 同事写道，“这将是朝着扩大机器学习的应用范围，和解决有关 AI 长期影响的担忧迈出的重要一步。”^(⁵³⁰)


    克里斯蒂诺已成为对齐问题研究领域的领军人物。在讨论他在扩增方面的工作时，我问克里斯蒂诺，他是否认为自己是其他有兴趣研究类似问题的人的榜样。他的回答令我惊讶。


    “希望以后的人们不用像我一样。”他说。^(⁵³¹)


    克里斯蒂诺解释道，在专注于 AI 安全领域之前，他不得不双线作战。他可能属于最后一批不得不这样的对齐问题研究人员：先通过研究更常规的问题获得学位，同时想办法做他认为真正重要的研究。“我不得不先离开，花很长时间研究别的东西，”他说，“倚靠学术圈子做研究比较容易。”仅仅几年后，这个圈子就出现了。^(⁵³²)


    或许，作为开拓者就是这样：与其说别人会完全模仿你的榜样，或者重走你的路，不如说——因为你的努力——他们不必如此。


    ## 8. 推断


    密歇根大学的心理学家费利克斯·沃纳肯（Felix Warneken）抱着一大摞杂志穿过房间，走向一个关着的柜子。他撞到了柜子上，吓了一跳，“哟！”他往后退，盯着柜子看了一会儿，疑惑不解地说了一声：“嗯？”又走上前，杂志又撞在柜门上。他再次后退，感到挫败，可怜地说：“嗯……”好像不知道自己哪里做错了。


    一个蹒跚学步的孩子从房间角落里走过来帮他。孩子有点不稳地走向柜子，挨个把柜门打开，带着探询的表情抬头看着沃纳肯，然后退后。沃纳肯表示了感激，把杂志放在柜子里。^(⁵³³)


    2006 年，沃纳肯与杜克大学的迈克尔·托马塞洛合作，第一次系统地证明了，18 个月大的人类婴儿就能正确判断人类同伴遇到了困难，能识别人类的目标和面临的障碍，并且会在力所能及时自发提供帮助，即使没有人请求他们帮忙，即使成年人甚至没有和他们眼神交流，即使他们预期这样做没有回报。^(⁵³⁴)


    这是一种非常复杂的能力，几乎是人类独有的。与人类遗传最接近的黑猩猩有时会自发提供帮助，但有一些前提：它们的注意力要被吸引到当前的事情上来，人类要明显在伸手去拿够不到的东西（更复杂的情况不行，比如面对柜子），^(⁵³⁵)


    沃纳肯和托马塞洛的研究表明，这种帮助行为“在进化上极其罕见”，在人类身上比在人类近亲动物身上更为明显，甚至在语言出现之前就已经很常见了。正如托马塞洛说的：“人类认知与其他动物认知的关键区别在于，人类有能力与他人一起参与具有共同目标和意图的协作活动。”^(⁵³⁶)


    “儿童在以前被描述为天生自私，只关心自己的需求。是社会以某种方式重新编程，让他们变得具有利他性，”沃纳肯说，^(⁵³⁷)


    这不仅需要有提供帮助的**动机**，还涉及极其复杂的认知过程：**推断**对方的目的，而且通常只根据一点点行为。


    “人类是读心术专家。”托马塞洛说。这种专家级知识最令人印象深刻的部分可能是我们推断他人**信念**的能力，但基础是推断他人的**意图**。事实上，直到 4
    岁左右，儿童才开始知道别人在想什么。但是到第一个生日时，他们已经开始知道别人想要什么了。^(⁵³⁸)


    研究人员越来越认为，我们向机器灌输人类价值观时也应采取同样的策略。也许，与其煞费苦心地尝试手工编码我们关心的东西，不如开发直接**观察**人类行为并从中**推断**我们的价值观和意图的机器。理查德·费曼（Richard Feynman）将宇宙描述为“由神在下的伟大棋局……我们不知道规则，我们能做的就是观棋”。在
    AI 中，这种方法被称为“逆强化学习”，我们在其中扮演了神的角色，机器必须观察我们，并推断**我们**行动的规则。


    ### 逆强化学习


    1997 年，加州大学伯克利分校的斯图尔特·罗素走在去西夫韦超市的路上，他边走边想一个问题，为什么我们要这样走路。“我们走路的方式都是差不多的。但是如果你看过《愚蠢行走部》中巨蟒喜剧团的表演，你会发现除了常规的走路方式，还有很多其他的走路方式。那为什么我们都以同样的方式走路？”^(⁵³⁹)


    这不可能**仅仅是**出于模仿，至少看起来不太可能。人类的基本步态不仅人际差异很小，而且不同文化之间，以及我们能看到的不同时代之间，也没什么差异。“这不是‘他们就是被教这样走路的’能完全解释的，”罗素说，“应该有某种原因决定了走路的**运作**方式。”


    这又引出了新问题。“这里的‘运作’是什么意思？目标函数是什么？有人提出了各种优化目标，比如‘我认为我在最小化能耗’，‘我在最小化扭矩’，^(⁵⁴⁰)


    '
