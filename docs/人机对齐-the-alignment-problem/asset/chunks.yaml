    ### 34.

    皮茨给麦卡洛克的最后一封信，就在皮茨去世前几周发出，收藏在费城美国哲学学会的沃伦·麦卡洛克档案中一个标有“沃尔特·皮茨”的文件夹里。我把它握在手中。皮茨在城市另一边的病床上写信，因为他被告知麦卡洛克想听到他的消息。他对此持怀疑态度：“我们俩都不会有太多快乐的事情。”但是他被说服了，无论如何，写了一封信。
    皮茨谈到了麦卡洛克最近的冠心病，他知道麦卡洛克现在“连着许多与显示面板和警报器相连的传感器……显然，这是控制论，”皮茨写道，“但这一切让我非常难过。” “如果我们俩都遇到了最坏的结果，”他写道。他的思绪似乎回到了
    1942 年的芝加哥，回到了 27 年前和莱文在麦卡洛克家度过的那些难忘夜晚。“我们就拉着轮椅坐在一起，看着面前无味的农家干酪，讲述普罗塔哥拉斯和诡辩家希庇亚斯在老格劳科斯的房子里谈话的著名故事：再一次试图穿透他们关于知者和被知者的微妙而深刻的悖论。”最后，颤抖的字迹写下大写字母：“祝你健康。”↩


