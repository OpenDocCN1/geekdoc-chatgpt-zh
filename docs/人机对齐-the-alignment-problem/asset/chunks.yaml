    2020年对自AlexNet以来神经网络训练效率惊人增长的回顾，参见OpenAI的Danny Hernandez和Tom Brown的文章：https：//openai.com/blog/ai-and-efficiency/和https：//cdn.openai.com/papers/ai\_and\_efficiency.pdf。[↩](#fnref41)


