- raw: '因此，也许我们不**需要**等到出现最终结果再去学习。也许我们可以在预期变化时学习。**任何**时候，一旦预期发生变化，就可以将变化视为先前估计的误差。因此，这是一个学习的机会：不是从尚未到来的最终结果，而是从更年长和更智慧的自我做出的新估计中学习。正如桑顿说的：“我们从猜测中学习猜测。”
    ^([^(294)](#fn294))


    （他插了一句：“听起来不太靠谱，不是吗？”）


    到20世纪80年代末，桑顿提出的“时序差分法”或“TD学习法”已发展成为一种算法，他称之为“TD（λ）”（TD-拉姆达），可以根据后面的预测来精确调整预测。
    ^([^(295)](#fn295))


    理论看起来不错，但TD学习还需接受实践检验。第一次真正初显身手是在纽约的IBM研究院。一位名叫杰拉尔德·泰索罗（Gerald Tesauro）的年轻研究员对经典条件反射的计算模型感兴趣，他在20世纪80年代末90年代初一直在尝试用神经网络下西洋双陆棋。初步得到了一些有希望的结果。1992年，他把TD学习融入模型，它一飞冲天了。
    ^([^(296)](#fn296))


    这个领域很早就知道有可能写出比程序员自己下得更好的程序；亚瑟·塞缪尔在20世纪50年代就在跳棋上做到了。但这次不一样，这次的程序可以和任何一位人类玩家媲美。而且它完全是“自学”：从随机状态开始，通过不断和自己下棋来改进。这对TD学习是极大的肯定。它提供了成功的蓝图，并将被21世纪那些大师级的弈棋程序如AlphaZero几乎原封不动地采用。


    新兴的强化学习领域曾经从大自然获得灵感，现在该回馈了。这个领域的高光时刻即将到来，最初受心理学和神经科学启发的数学框架将重新进入这些领域并产生重要影响。


    **预测和奖励的神经基础**


    20世纪90年代初，就在泰索罗改进双陆棋程序的同时，彼得·达扬（Peter Dayan），一位年轻的认知科学家，正在将目光从机器学习转向神经科学。达扬曾在巴图的实验室待过很长一段时间，还与沃特金斯一起研究了收敛证明。在爱丁堡大学研究了时序差分的数学后，他和几位神经科学家一起来到了圣地亚哥的索尔克研究所。


    达扬、博士后研究员里德·蒙塔古（Read Montague）和索尔克研究所的神经科学家特里·塞诺斯基（Terry Sejnowski）一起合作，他们认为，强化学习的框架不仅仅是为真实的人和动物的大脑运作提供了一种解释，可能大脑**真的**就是这样运作的。“我们想找到大脑中负责价值和强化的系统，”蒙塔古说。“我们当时想，‘这些东西应该实现了某种算法。’”
    ^([^(297)](#fn297))


    “我们知道这肯定和神经科学有关联，”达扬在优步总部的会议室向我解释，他在伦敦大学学院任教，现在正在旧金山过学术休假年。


    “然后，”他说，“我们拿到了沃尔夫拉姆·舒尔茨的数据。” ^([^(298)](#fn298))


    达扬站起身来，在白板上很快画出了多巴胺反应图。他指着猴子在获得提示后得到预期的果汁奖励时平静的反应说：“**这**部分信号和平常一样，就是你在雷斯科拉——瓦格纳模型中看到的，很漂亮的传统心理学。”


    然后，他指向前面由提示本身引起的多巴胺尖峰。“令人困惑的是信号的**这**一部分，”他说，“从心理学角度来看这出乎预料，所以舒尔茨经常纠结于这一点。”


    舒尔茨和整个神经生理学界都觉得这些数据难以理解，但是当达扬和蒙塔古看到舒尔茨的数据时，他们马上明白了。


    这就是时序差分。这是猴子期望值的突然波动，它的价值函数，它对事态好坏的预测。


    大脑多巴胺的基线波纹上方突然出现尖峰，意味着这个世界突然比刚才更有**希望**了。反过来，突然的静默则意味着事情突然变得**不像**想象的那么有希望。正常的背景波纹意味着事情没有出乎**预期**，无论好坏。


    多巴胺尖峰本身不是奖励，但与奖励有关；它本身不是不确定性、惊讶或注意力，但与所有这些因素密切相关。这种关联终于现身了。这是猴子预期的波动，表明之前的预测是错的，它的大脑在从猜测中学习猜测。


    在论文中被证明，在芯片上被验证的算法，现在在大脑中被发现了。时序差分学习不仅是**模仿**多巴胺的功能，它**就是**多巴胺的功能。


    1997年，舒尔茨、达扬和蒙塔古联名在《科学》杂志上发表了一篇轰动世界的论文。正如他们所说，他们发现了“预测和奖励的神经基础”。 ^([^(299)](#fn299))


    这个发现对神经科学和计算机科学有深远影响。一个受心理学中经典和操作性条件反射模型启发，完全在机器学习领域发展出来的想法，突然形成了完整的闭环。它不仅是AI的可能模型，似乎还描述了智力的普遍原则，完美。


    “眼睛独立进化了四五十次……生物圈一次又一次发明了眼睛，各种不同的眼睛，”蒙塔古解释道， ^([^(300)](#fn300))


    达扬也有相同看法。“我们天生就拥有这些，”他说，“你能在多巴胺神经元的活动中如此清晰地看到它的想法……这是一个重要启示。” ^([^(301)](#fn301))


    75岁的舒尔茨仍然在精力充沛地工作。参观他位于剑桥的实验室时，我问他，在当时是否就感觉这是一个启示。让我惊讶的是，他说不是。在他看来，真正的启示是，描述猴子在寻找食物时大脑活动的TD-学习模型，虽然很简单，却在20年后促成了当前AI的突破。我们能够从自然界获得这样的普适性方法，并综合应用，这才是让他大吃一惊的。


    “当我看到TD模型催生了我们现在看到的围棋程序之类的AI和机器学习时，才意识到了启示，”他说，“这时我才说，**我的上帝，我做了什么？**你知道我的数据来自雷斯科拉——瓦格纳模型，来自一个预测误差，但结果却……天哪！我的意思是，我知道泰索罗用TD模型下双陆棋。好吧，我不下双陆棋，但我下围棋，下得不太好。我说，还行，但如果他们能对围棋编程，那这个模型才**真**厉害。而我其实在他们写这些程序之前已经发现了这个。”


    我告诉他，我认为发现神经生理学和机器学习领域如此清晰和强大的综合性成果，而且对两个领域都有如此大影响，这很了不起。


    “当然，”他说，“是这样。这就是它的魅力所在。所有东西都契合到了一起。完美解释。” ^([^(302)](#fn302))


    这对神经科学的影响是革命性的。 ^([^(303)](#fn303))


    诚然，还有许多问题需要解决，而且现在看来这个经典解释有可能会被推翻，或是随着时间推移变得复杂。 ^([^(304)](#fn304))


    她讲述了自己第一次参加神经科学年会的经历。年会聚集了该领域大约3万名研究人员。“我第一次去时留意过强化学习，大概是在2003、2004年。整个会议期间只有大约5张海报。会议持续整整一周，每天都有两轮海报张贴，上午一轮，下午一轮。“现在，”她说，“每轮海报张贴强化学习都占了一整段，或者一整行。它确实在这10到15年取得了长足进步。”
    ^([^(305)](#fn305))


    她补充道：“有很多研究都在大脑中验证这一理论的猜测，并发现‘天哪，这些神经元好像读过教科书。它们读过桑顿和巴图的教科书。它们非常清楚自己要做什么。’”


    **幸福与误差**


    如果TD-学习模型揭示了多巴胺在大脑中的功能——不是作为大脑的奖励货币，也不是作为大脑对未来奖励的**预期**，而是作为大脑对未来预期的误差——那么它就留下了一些问题。


    首先，它打开了与快乐和幸福的主观体验的关联。如果多巴胺水平的增高预示着**事情会比我想象的要好**，那么这种感觉本身就是愉悦的。你可以看到人类和动物如何不遗余力地想获得这种感觉，包括直接通过化学和电流刺激多巴胺神经元。


    你也会看到人工提高多巴胺水平是如何导致不可避免的崩溃。认为事情**会**比你想象的要好只会持续这么久。最终你会意识到并**没有**你想象的那么好，就像舒尔茨对猴子做的实验那样，当果汁提示灯闪烁但没有果汁时，多巴胺会静默。多巴胺有可能开出环境无法兑现的支票。这些支票最终必然会被驳回。你的价值函数终将回归现实。


    这正是多巴胺相关药物的特点，可卡因就是典型例子。这种毒品会抑制大脑对多巴胺的再吸收，从而导致多巴胺的暂时“泛滥”。TD对此的解释是，大脑把这理解为一种总体感觉，事情将变得很好，但多巴胺开的是空头支票，环境无法兑现奖励。最终，预测的利好不会到来，随之而来的是等量且相反的负面预测错误。“**似乎**一切都将变得更美好……”我们可以用化学愚弄大脑的预测机制，但只骗得了一时。


    正如作家大卫·伦森（David Lenson）所说：“可卡因承诺在1分钟内将获得最大快感，正确的景象将出现在眼前，另一剂毒品将被注射，性交将很和谐。但那个未来永远不会到来。诚然，毒品能带来生理快感，但与即将发生的事相比，这是偶然的、微不足道的。”
    ^([^(306)](#fn306))


    多巴胺与快乐愉悦的主观体验的关联仍然在深入研究。例如，密歇根大学的肯特·伯里奇（Kent Berridge）在职业生涯的大部分时间都在剖析**想要**而不是**喜欢**的神经科学。
    ^([^(307)](#fn307))


    拉特利奇与彼得·达扬以及伦敦大学学院的团队合作，设计了一个实验，让受试者下各种赌注，积累一笔钱，同时周期性地问受试者：“你现在有多开心？” ^([^(308)](#fn308))


    拉特利奇的发现在许多方面都很有启发性。首先，快乐是**短暂的**。无论你在某次下注中赢了1英镑后有多高兴，5次下注后，92%的高兴都消失了。10次下注前发生的任何事就像从未发生过。这意味着受试者的高兴实际上与他们赢了多少钱无关。


    快乐似乎至少部分是由受试者**预期**能赢多少钱决定的，但似乎最关键的是**违背**这些期望。正如拉特利奇写的：“短暂的快乐不是反映事情的进展有多好，而是反映是否比预期的要好。”
    ^([^(309)](#fn309))


    放宽视界，我们会注意到神经科学和经济学中一个众所周知的现象，所谓的“享乐适应”。这个现象说的是，不管长期生活质量如何变化，人们总是会顽固地不断回到情绪基线。
    ^([^(310)](#fn310))


    不幸的是，这项研究也不赞同“总是保持低期望”这类简单的生活原则。正如拉特利奇所说：“较低的预期使结果更有可能超出预期，并对幸福产生积极影响。然而，在决定产生后果之前，预期也会影响幸福。如果你打算在喜欢的餐馆和朋友会面，一旦制定了计划，积极的预期也可能会让你更快乐。”
    ^([^(311)](#fn311))


    在论文中，他和合著者提到了一种可能性，例如，一家航空公司声称有50%的几率会延误6小时，然后宣布实际延误将是1小时。“降低预期会增加正面结果的可能性……然而，较低的预期会在结果到来之前降低幸福感，从而限制了这种操纵带来的好处。”
    ^([^(312)](#fn312))


    用拉特利奇的话说：“你知道的，你不能用降低预期来解决一切问题。” ^([^(313)](#fn313))


    多巴胺、TD误差和快乐的关联启发一些研究者思考强化学习自主体的主观快乐是否有伦理意义。基础研究所的布莱恩·托马西克（Brian Tomasik）关注理解和减轻痛苦的问题，他严肃思考了强化学习项目是否存在道德立场问题——我们如何对待它们重要吗？他给出了试探性和有限的肯定答案：就它们建立在与动物和人类大脑相似的原则上而言，很可能它们应该得到一点伦理考虑。
    ^([^(314)](#fn314))


    一方面，它为解释享乐适应的进化和计算提供了线索。如果主观幸福感与**惊喜**密切相关，并且不知疲倦地预测和减少惊讶是智力的天性，那么我们就能理解这种幸福感为何转瞬即逝。我们也可以看到它的进化优势。婴儿可能会为自己能随心所欲挥动手臂而高兴。对于成年人来说，这种能力不再像婴儿期那样令人兴奋。尽管我们可能会哀叹成年人的不知足，这却是人生课程的必需部分。如果基本的运动技能就能让我们一直兴奋，我们就永远无法成年。


    正如安德鲁·巴图说的，这种转瞬即逝是克劳夫早在20世纪70年代初就预料到的。“他的观点是，（自体平衡）稳定机制试图将差异降至零，当差异为零时，它会感到高兴，然后停止。他想要的那种系统永远不会满足。因此会不断探索。”
    ^([^(315)](#fn315))


    **超越强化**


    强化学习萌生于20世纪初的动物学习研究，在20世纪七八十年代繁荣于机器学习抽象的数学世界，最后居然以近乎完美的模型成功反哺动物行为研究，成为了大脑中多巴胺作用的公认解释。
    ^([^(316)](#fn316))


    与此同时，就在2018年，神经科学证据开始表明，克劳夫的疯狂假说——即神经元是“享乐主义者”，受其自身桑代克效果律的驱动——可能与事实相去不远。 ^([^(317)](#fn317))


    强化学习还为我们提供了一个强大的，甚至可能是普适的，关于智力是什么的定义。 ^([^(318)](#fn318))


    然而，在某些方面，对动物和机器在世界中实现目标的**能力**的更深入理解，还开启了更深刻的哲学之路。很显然，这一理论并没有告诉我们评估**什么**价值，或者**应该**评估什么价值。在这方面，多巴胺的神秘一如从前。如果它代表了某个标量预测误差，那么它就隐藏了如何“评估”该预测的巨大复杂性。如果，在第一扇门背后，不是我们期待的加勒比海假期，而是观看北极光之旅，我们的多巴胺会迅速可靠地表明我们对此是喜是忧。但是，这些选项的**价值**到底是如何评估的呢？
    ^([^(319)](#fn319))


    与此同时，我们还遇到了另一个问题。经典形式的强化学习认为世界的奖励结构是给定的，并提出了如何算出最大收益的行为也即“策略”的问题。但在许多方面，这掩盖了AI前沿面临的更有趣也更可怕的问题。我们发现自己对这个问题的**逆**更感兴趣：给定我们希望的机器行为，如何构建环境的奖励来诱导这种行为？当**我们**坐在观众席后面，坐在评论家的位置，我们如何通过操控食物或它们的数字等价物，得到我们想要的？


    这就是强化学习背景下的对齐问题。这个问题在过去5到10年变得越来越紧迫，但正如我们将看到的，它和强化学习本身一样深深植根于过去。


    ## **5. 塑造**


    大自然将人类置于痛苦和快乐这两个至高无上的主人的统治之下。只有它们才能指引我们该做什么，以及决定我们要如何做。


    ——杰里米·边沁（Jeremy Bentham） ^([^(320)](#fn320))


    奖励函数的设计可能是建立强化学习系统最困难的方面，却很少被讨论。


    ——玛雅·马塔里奇（Maja Matarić） ^([^(321)](#fn321))


    1943年，斯金纳在研究一个战时秘密项目，这个项目最初是由通用磨坊食品公司赞助的。通用磨坊把明尼阿波利斯金牌面粉厂的顶楼给斯金纳做实验室。这个项目是当时最大胆的构想之一：斯金纳打算训练鸽子啄食轰炸目标的图像，然后把鸽子3只一组放在真正的炸弹里，在投弹时制导。“我和同事们知道，”斯金纳说，“在全世界眼中，我们是疯子。”
    ^([^(322)](#fn322))


    斯金纳意识到，许多人会认为这个项目疯狂且残忍。关于疯狂，他指出，人类将动物（超越人类）的感官用于人类目的的历史悠久且有传奇色彩：导盲犬、搜寻松露的猪等等。关于残忍，他辩解道：“我们是否有权将低等生物转化为不自知的英雄，思考这个伦理问题是和平时期才有的奢侈。”
    ^([^(323)](#fn323))


    斯金纳长期致力于强化研究，他著名的“斯金纳盒子”可以说是桑代克迷箱在20世纪中期的升级版。盒子中的灯、杠杆和机械食物给料器（通常是用自动售货机改装）可以对强化进行精确和定量的研究，它们将被几代研究人员沿用（例如舒尔茨将其用于研究猴子的多巴胺）。1950年代，斯金纳利用他的盒子研究动物如何在各种条件下学会采取行动来最大化奖励（通常是以食物的形式）。他提出了“强化程序”的概念，测试了各种类型的强化程序并观察效果。例如，他比较了按“比率”强化（一定**数量**的正确行为会得到奖励）与按“间隔”强化（一定**时间**后的正确行为会得到奖励）。他测试了“固定”和“可变”强化，前者的行为数量或时长保持不变，后者允许波动。斯金纳的著名发现是，最强烈、最重复、最持久的行为往往来自**可变比率**的程序——也就是说，奖励出现在重复多次的行为之后，但重复次数会波动。
    ^([^(324)](#fn324))


    然而，在顶楼的秘密实验室，斯金纳还面临另一个挑战：不仅要弄清楚哪些强化程序能植入最根深蒂固的简单行为，还要弄清楚如何仅仅通过奖励来产生相对复杂的行为。有一次，当他和同事试图教鸽子击球时，困难变得很明显。他们建了一个微型保龄球馆，里面有木球和玩具球瓶，打算在鸽子向球猛击时给予它第一次食物奖励。不幸的是，什么都没发生。鸽子没有这样做。实验员等啊等啊……最终失去了耐心。


    然后他们改变了策略。如斯金纳所述：


    我们决定强化任何与击球稍有关联的反应，也许起初只是看向球的行为，然后选择更接近最终目标的反应。结果令我们惊讶。几分钟后，球开始在盒子壁间碰撞，就好像鸽子是壁球冠军。


    效果是如此惊人，以至于斯金纳的两位助手——玛丽安·布雷兰（Marian Breland）和凯勒·布雷兰（Keller Breland）夫妻俩——决定放弃心理学学术生涯，成立一家动物训练公司。“我们想利用斯金纳的行为控制原理来谋生，”玛丽安说。
    ^([^(325)](#fn325))


    斯金纳也认为，在面粉厂秘密实验室的微型保龄球馆里的这一刻对他是一种顿悟，改变了他职业生涯的轨迹。他认为，关键是“通过强化与最终目标大致相似的行为来逐渐**塑造**行为，而不是等待完全一样的行为”。
    ^([^(326)](#fn326))


    然而，鸽子计划最终没有付诸实施。鸽子们干得非常出色，如此出色，以至于转移了政府科学研究和发展办公室委员会的注意力。“由活着的鸽子执行任务的景象，不管多么美丽，”斯金纳写道，“只会提醒委员会我们的提议多么不切实际。”
    ^([^(327)](#fn327))


    斯金纳认为这个概念已经证明可行，在20世纪50年代末，他自豪地写道：“可以说，用生物来制导，不再是一个疯狂的想法。” ^([^(328)](#fn328))


    关键是他们发现了**塑造：**通过简单奖励来灌输复杂行为，奖励一连串近似的行为。“这使得塑造动物的行为成为可能，”斯金纳写道，“就像雕塑家捏黏土一样。” ^([^(329)](#fn329))


    他写道：“其中一些\[强化程序\]类似工业中广泛使用的不固定的日工资或计件工资；还有一些类似赌博机中精心设计的偶然事件，具有诱导持续行为的能力，让人欲罢不能。”
    ^([^(330)](#fn330))


    也许最具预言性的是，斯金纳认为，基于他的研究发现的原理，广义的教育，无论是针对人还是动物，可能会成为一个严格的、客观的领域，这个领域有可能实现飞跃。正如他所说：“人们常说，教学是一门艺术，但我们越来越有理由希望它最终会成为一门科学。”
    ^([^(331)](#fn331))


    斯金纳可能比他预想的更正确。在21世纪，机器学习专家也可能会使用“塑造”这个术语，而且用法同心理学家一样。对奖励的研究，尤其是如何战略性地管理奖励以获得你想要的行为，而不是你不想要的行为，的确已成为一门严格的定量科学，尽管可能不是像斯金纳想象的那样针对生物学习者。


    **稀疏问题**'
  fmt: '

    因此，也许我们不**需要**等到出现最终结果再去学习。也许我们可以在预期变化时学习。**任何**时候，一旦预期发生变化，就可以将变化视为先前估计的误差。因此，这是一个学习的机会：不是从尚未到来的最终结果，而是从更年长和更智慧的自我做出的新估计中学习。正如桑顿说的：“我们从猜测中学习猜测。”
    ^([^(294)](#fn294))


    （他插了一句：“听起来不太靠谱，不是吗？”）


    到20世纪80年代末，桑顿提出的“时序差分法”或“TD学习法”已发展成为一种算法，他称之为“TD（λ）”（TD-拉姆达），可以根据后面的预测来精确调整预测。
    ^([^(295)](#fn295))


    理论看起来不错，但TD学习还需接受实践检验。第一次真正初显身手是在纽约的IBM研究院。一位名叫杰拉尔德·泰索罗（Gerald Tesauro）的年轻研究员对经典条件反射的计算模型感兴趣，他在20世纪80年代末90年代初一直在尝试用神经网络下西洋双陆棋。初步得到了一些有希望的结果。1992年，他把TD学习融入模型，它一飞冲天了。
    ^([^(296)](#fn296))


    这个领域很早就知道有可能写出比程序员自己下得更好的程序；亚瑟·塞缪尔在20世纪50年代就在跳棋上做到了。但这次不一样，这次的程序可以和任何一位人类玩家媲美。而且它完全是“自学”：从随机状态开始，通过不断和自己下棋来改进。这对TD学习是极大的肯定。它提供了成功的蓝图，并将被21世纪那些大师级的弈棋程序如AlphaZero几乎原封不动地采用。


    新兴的强化学习领域曾经从大自然获得灵感，现在该回馈了。这个领域的高光时刻即将到来，最初受心理学和神经科学启发的数学框架将重新进入这些领域并产生重要影响。


    ## 预测和奖励的神经基础


    20世纪90年代初，就在泰索罗改进双陆棋程序的同时，彼得·达扬（Peter Dayan），一位年轻的认知科学家，正在将目光从机器学习转向神经科学。达扬曾在巴图的实验室待过很长一段时间，还与沃特金斯一起研究了收敛证明。在爱丁堡大学研究了时序差分的数学后，他和几位神经科学家一起来到了圣地亚哥的索尔克研究所。


    达扬、博士后研究员里德·蒙塔古（Read Montague）和索尔克研究所的神经科学家特里·塞诺斯基（Terry Sejnowski）一起合作，他们认为，强化学习的框架不仅仅是为真实的人和动物的大脑运作提供了一种解释，可能大脑**真的**就是这样运作的。“我们想找到大脑中负责价值和强化的系统，”蒙塔古说。“我们当时想，‘这些东西应该实现了某种算法。’”
    ^([^(297)](#fn297))


    “我们知道这肯定和神经科学有关联，”达扬在优步总部的会议室向我解释，他在伦敦大学学院任教，现在正在旧金山过学术休假年。


    “然后，”他说，“我们拿到了沃尔夫拉姆·舒尔茨的数据。” ^([^(298)](#fn298))


    达扬站起身来，在白板上很快画出了多巴胺反应图。他指着猴子在获得提示后得到预期的果汁奖励时平静的反应说：“**这**部分信号和平常一样，就是你在雷斯科拉——瓦格纳模型中看到的，很漂亮的传统心理学。”


    然后，他指向前面由提示本身引起的多巴胺尖峰。“令人困惑的是信号的**这**一部分，”他说，“从心理学角度来看这出乎预料，所以舒尔茨经常纠结于这一点。”


    舒尔茨和整个神经生理学界都觉得这些数据难以理解，但是当达扬和蒙塔古看到舒尔茨的数据时，他们马上明白了。


    这就是时序差分。这是猴子期望值的突然波动，它的价值函数，它对事态好坏的预测。


    大脑多巴胺的基线波纹上方突然出现尖峰，意味着这个世界突然比刚才更有**希望**了。反过来，突然的静默则意味着事情突然变得**不像**想象的那么有希望。正常的背景波纹意味着事情没有出乎**预期**，无论好坏。


    多巴胺尖峰本身不是奖励，但与奖励有关；它本身不是不确定性、惊讶或注意力，但与所有这些因素密切相关。这种关联终于现身了。这是猴子预期的波动，表明之前的预测是错的，它的大脑在从猜测中学习猜测。


    在论文中被证明，在芯片上被验证的算法，现在在大脑中被发现了。时序差分学习不仅是**模仿**多巴胺的功能，它**就是**多巴胺的功能。


    1997年，舒尔茨、达扬和蒙塔古联名在《科学》杂志上发表了一篇轰动世界的论文。正如他们所说，他们发现了“预测和奖励的神经基础”。 ^([^(299)](#fn299))


    这个发现对神经科学和计算机科学有深远影响。一个受心理学中经典和操作性条件反射模型启发，完全在机器学习领域发展出来的想法，突然形成了完整的闭环。它不仅是AI的可能模型，似乎还描述了智力的普遍原则，完美。


    “眼睛独立进化了四五十次……生物圈一次又一次发明了眼睛，各种不同的眼睛，”蒙塔古解释道， ^([^(300)](#fn300))


    达扬也有相同看法。“我们天生就拥有这些，”他说，“你能在多巴胺神经元的活动中如此清晰地看到它的想法……这是一个重要启示。” ^([^(301)](#fn301))


    75岁的舒尔茨仍然在精力充沛地工作。参观他位于剑桥的实验室时，我问他，在当时是否就感觉这是一个启示。让我惊讶的是，他说不是。在他看来，真正的启示是，描述猴子在寻找食物时大脑活动的TD-学习模型，虽然很简单，却在20年后促成了当前AI的突破。我们能够从自然界获得这样的普适性方法，并综合应用，这才是让他大吃一惊的。


    “当我看到TD模型催生了我们现在看到的围棋程序之类的AI和机器学习时，才意识到了启示，”他说，“这时我才说，**我的上帝，我做了什么？**你知道我的数据来自雷斯科拉——瓦格纳模型，来自一个预测误差，但结果却……天哪！我的意思是，我知道泰索罗用TD模型下双陆棋。好吧，我不下双陆棋，但我下围棋，下得不太好。我说，还行，但如果他们能对围棋编程，那这个模型才**真**厉害。而我其实在他们写这些程序之前已经发现了这个。”


    我告诉他，我认为发现神经生理学和机器学习领域如此清晰和强大的综合性成果，而且对两个领域都有如此大影响，这很了不起。


    “当然，”他说，“是这样。这就是它的魅力所在。所有东西都契合到了一起。完美解释。” ^([^(302)](#fn302))


    这对神经科学的影响是革命性的。 ^([^(303)](#fn303))


    诚然，还有许多问题需要解决，而且现在看来这个经典解释有可能会被推翻，或是随着时间推移变得复杂。 ^([^(304)](#fn304))


    她讲述了自己第一次参加神经科学年会的经历。年会聚集了该领域大约3万名研究人员。“我第一次去时留意过强化学习，大概是在2003、2004年。整个会议期间只有大约5张海报。会议持续整整一周，每天都有两轮海报张贴，上午一轮，下午一轮。“现在，”她说，“每轮海报张贴强化学习都占了一整段，或者一整行。它确实在这10到15年取得了长足进步。”
    ^([^(305)](#fn305))


    她补充道：“有很多研究都在大脑中验证这一理论的猜测，并发现‘天哪，这些神经元好像读过教科书。它们读过桑顿和巴图的教科书。它们非常清楚自己要做什么。’”


    ## 幸福与误差


    如果TD-学习模型揭示了多巴胺在大脑中的功能——不是作为大脑的奖励货币，也不是作为大脑对未来奖励的**预期**，而是作为大脑对未来预期的误差——那么它就留下了一些问题。


    首先，它打开了与快乐和幸福的主观体验的关联。如果多巴胺水平的增高预示着**事情会比我想象的要好**，那么这种感觉本身就是愉悦的。你可以看到人类和动物如何不遗余力地想获得这种感觉，包括直接通过化学和电流刺激多巴胺神经元。


    你也会看到人工提高多巴胺水平是如何导致不可避免的崩溃。认为事情**会**比你想象的要好只会持续这么久。最终你会意识到并**没有**你想象的那么好，就像舒尔茨对猴子做的实验那样，当果汁提示灯闪烁但没有果汁时，多巴胺会静默。多巴胺有可能开出环境无法兑现的支票。这些支票最终必然会被驳回。你的价值函数终将回归现实。


    这正是多巴胺相关药物的特点，可卡因就是典型例子。这种毒品会抑制大脑对多巴胺的再吸收，从而导致多巴胺的暂时“泛滥”。TD对此的解释是，大脑把这理解为一种总体感觉，事情将变得很好，但多巴胺开的是空头支票，环境无法兑现奖励。最终，预测的利好不会到来，随之而来的是等量且相反的负面预测错误。“**似乎**一切都将变得更美好……”我们可以用化学愚弄大脑的预测机制，但只骗得了一时。


    正如作家大卫·伦森（David Lenson）所说：“可卡因承诺在1分钟内将获得最大快感，正确的景象将出现在眼前，另一剂毒品将被注射，性交将很和谐。但那个未来永远不会到来。诚然，毒品能带来生理快感，但与即将发生的事相比，这是偶然的、微不足道的。”
    ^([^(306)](#fn306))


    多巴胺与快乐愉悦的主观体验的关联仍然在深入研究。例如，密歇根大学的肯特·伯里奇（Kent Berridge）在职业生涯的大部分时间都在剖析**想要**而不是**喜欢**的神经科学。
    ^([^(307)](#fn307))


    拉特利奇与彼得·达扬以及伦敦大学学院的团队合作，设计了一个实验，让受试者下各种赌注，积累一笔钱，同时周期性地问受试者：“你现在有多开心？” ^([^(308)](#fn308))


    拉特利奇的发现在许多方面都很有启发性。首先，快乐是**短暂的**。无论你在某次下注中赢了1英镑后有多高兴，5次下注后，92%的高兴都消失了。10次下注前发生的任何事就像从未发生过。这意味着受试者的高兴实际上与他们赢了多少钱无关。


    快乐似乎至少部分是由受试者**预期**能赢多少钱决定的，但似乎最关键的是**违背**这些期望。正如拉特利奇写的：“短暂的快乐不是反映事情的进展有多好，而是反映是否比预期的要好。”
    ^([^(309)](#fn309))


    放宽视界，我们会注意到神经科学和经济学中一个众所周知的现象，所谓的“享乐适应”。这个现象说的是，不管长期生活质量如何变化，人们总是会顽固地不断回到情绪基线。
    ^([^(310)](#fn310))


    不幸的是，这项研究也不赞同“总是保持低期望”这类简单的生活原则。正如拉特利奇所说：“较低的预期使结果更有可能超出预期，并对幸福产生积极影响。然而，在决定产生后果之前，预期也会影响幸福。如果你打算在喜欢的餐馆和朋友会面，一旦制定了计划，积极的预期也可能会让你更快乐。”
    ^([^(311)](#fn311))


    在论文中，他和合著者提到了一种可能性，例如，一家航空公司声称有50%的几率会延误6小时，然后宣布实际延误将是1小时。“降低预期会增加正面结果的可能性……然而，较低的预期会在结果到来之前降低幸福感，从而限制了这种操纵带来的好处。”
    ^([^(312)](#fn312))


    用拉特利奇的话说：“你知道的，你不能用降低预期来解决一切问题。” ^([^(313)](#fn313))


    多巴胺、TD误差和快乐的关联启发一些研究者思考强化学习自主体的主观快乐是否有伦理意义。基础研究所的布莱恩·托马西克（Brian Tomasik）关注理解和减轻痛苦的问题，他严肃思考了强化学习项目是否存在道德立场问题——我们如何对待它们重要吗？他给出了试探性和有限的肯定答案：就它们建立在与动物和人类大脑相似的原则上而言，很可能它们应该得到一点伦理考虑。
    ^([^(314)](#fn314))


    一方面，它为解释享乐适应的进化和计算提供了线索。如果主观幸福感与**惊喜**密切相关，并且不知疲倦地预测和减少惊讶是智力的天性，那么我们就能理解这种幸福感为何转瞬即逝。我们也可以看到它的进化优势。婴儿可能会为自己能随心所欲挥动手臂而高兴。对于成年人来说，这种能力不再像婴儿期那样令人兴奋。尽管我们可能会哀叹成年人的不知足，这却是人生课程的必需部分。如果基本的运动技能就能让我们一直兴奋，我们就永远无法成年。


    正如安德鲁·巴图说的，这种转瞬即逝是克劳夫早在20世纪70年代初就预料到的。“他的观点是，（自体平衡）稳定机制试图将差异降至零，当差异为零时，它会感到高兴，然后停止。他想要的那种系统永远不会满足。因此会不断探索。”
    ^([^(315)](#fn315))


    ## 超越强化


    强化学习萌生于20世纪初的动物学习研究，在20世纪七八十年代繁荣于机器学习抽象的数学世界，最后居然以近乎完美的模型成功反哺动物行为研究，成为了大脑中多巴胺作用的公认解释。
    ^([^(316)](#fn316))


    与此同时，就在2018年，神经科学证据开始表明，克劳夫的疯狂假说——即神经元是“享乐主义者”，受其自身桑代克效果律的驱动——可能与事实相去不远。 ^([^(317)](#fn317))


    强化学习还为我们提供了一个强大的，甚至可能是普适的，关于智力是什么的定义。 ^([^(318)](#fn318))


    然而，在某些方面，对动物和机器在世界中实现目标的**能力**的更深入理解，还开启了更深刻的哲学之路。很显然，这一理论并没有告诉我们评估**什么**价值，或者**应该**评估什么价值。在这方面，多巴胺的神秘一如从前。如果它代表了某个标量预测误差，那么它就隐藏了如何“评估”该预测的巨大复杂性。如果，在第一扇门背后，不是我们期待的加勒比海假期，而是观看北极光之旅，我们的多巴胺会迅速可靠地表明我们对此是喜是忧。但是，这些选项的**价值**到底是如何评估的呢？
    ^([^(319)](#fn319))


    与此同时，我们还遇到了另一个问题。经典形式的强化学习认为世界的奖励结构是给定的，并提出了如何算出最大收益的行为也即“策略”的问题。但在许多方面，这掩盖了AI前沿面临的更有趣也更可怕的问题。我们发现自己对这个问题的**逆**更感兴趣：给定我们希望的机器行为，如何构建环境的奖励来诱导这种行为？当**我们**坐在观众席后面，坐在评论家的位置，我们如何通过操控食物或它们的数字等价物，得到我们想要的？


    这就是强化学习背景下的对齐问题。这个问题在过去5到10年变得越来越紧迫，但正如我们将看到的，它和强化学习本身一样深深植根于过去。


    ## 5. 塑造


    大自然将人类置于痛苦和快乐这两个至高无上的主人的统治之下。只有它们才能指引我们该做什么，以及决定我们要如何做。


    ——杰里米·边沁（Jeremy Bentham） ^([^(320)](#fn320))


    奖励函数的设计可能是建立强化学习系统最困难的方面，却很少被讨论。


    ——玛雅·马塔里奇（Maja Matarić） ^([^(321)](#fn321))


    1943年，斯金纳在研究一个战时秘密项目，这个项目最初是由通用磨坊食品公司赞助的。通用磨坊把明尼阿波利斯金牌面粉厂的顶楼给斯金纳做实验室。这个项目是当时最大胆的构想之一：斯金纳打算训练鸽子啄食轰炸目标的图像，然后把鸽子3只一组放在真正的炸弹里，在投弹时制导。“我和同事们知道，”斯金纳说，“在全世界眼中，我们是疯子。”
    ^([^(322)](#fn322))


    斯金纳意识到，许多人会认为这个项目疯狂且残忍。关于疯狂，他指出，人类将动物（超越人类）的感官用于人类目的的历史悠久且有传奇色彩：导盲犬、搜寻松露的猪等等。关于残忍，他辩解道：“我们是否有权将低等生物转化为不自知的英雄，思考这个伦理问题是和平时期才有的奢侈。”
    ^([^(323)](#fn323))


    斯金纳长期致力于强化研究，他著名的“斯金纳盒子”可以说是桑代克迷箱在20世纪中期的升级版。盒子中的灯、杠杆和机械食物给料器（通常是用自动售货机改装）可以对强化进行精确和定量的研究，它们将被几代研究人员沿用（例如舒尔茨将其用于研究猴子的多巴胺）。1950年代，斯金纳利用他的盒子研究动物如何在各种条件下学会采取行动来最大化奖励（通常是以食物的形式）。他提出了“强化程序”的概念，测试了各种类型的强化程序并观察效果。例如，他比较了按“比率”强化（一定**数量**的正确行为会得到奖励）与按“间隔”强化（一定**时间**后的正确行为会得到奖励）。他测试了“固定”和“可变”强化，前者的行为数量或时长保持不变，后者允许波动。斯金纳的著名发现是，最强烈、最重复、最持久的行为往往来自**可变比率**的程序——也就是说，奖励出现在重复多次的行为之后，但重复次数会波动。
    ^([^(324)](#fn324))


    然而，在顶楼的秘密实验室，斯金纳还面临另一个挑战：不仅要弄清楚哪些强化程序能植入最根深蒂固的简单行为，还要弄清楚如何仅仅通过奖励来产生相对复杂的行为。有一次，当他和同事试图教鸽子击球时，困难变得很明显。他们建了一个微型保龄球馆，里面有木球和玩具球瓶，打算在鸽子向球猛击时给予它第一次食物奖励。不幸的是，什么都没发生。鸽子没有这样做。实验员等啊等啊……最终失去了耐心。


    然后他们改变了策略。如斯金纳所述：


    我们决定强化任何与击球稍有关联的反应，也许起初只是看向球的行为，然后选择更接近最终目标的反应。结果令我们惊讶。几分钟后，球开始在盒子壁间碰撞，就好像鸽子是壁球冠军。


    效果是如此惊人，以至于斯金纳的两位助手——玛丽安·布雷兰（Marian Breland）和凯勒·布雷兰（Keller Breland）夫妻俩——决定放弃心理学学术生涯，成立一家动物训练公司。“我们想利用斯金纳的行为控制原理来谋生，”玛丽安说。
    ^([^(325)](#fn325))


    斯金纳也认为，在面粉厂秘密实验室的微型保龄球馆里的这一刻对他是一种顿悟，改变了他职业生涯的轨迹。他认为，关键是“通过强化与最终目标大致相似的行为来逐渐**塑造**行为，而不是等待完全一样的行为”。
    ^([^(326)](#fn326))


    然而，鸽子计划最终没有付诸实施。鸽子们干得非常出色，如此出色，以至于转移了政府科学研究和发展办公室委员会的注意力。“由活着的鸽子执行任务的景象，不管多么美丽，”斯金纳写道，“只会提醒委员会我们的提议多么不切实际。”
    ^([^(327)](#fn327))


    斯金纳认为这个概念已经证明可行，在20世纪50年代末，他自豪地写道：“可以说，用生物来制导，不再是一个疯狂的想法。” ^([^(328)](#fn328))


    关键是他们发现了**塑造：**通过简单奖励来灌输复杂行为，奖励一连串近似的行为。“这使得塑造动物的行为成为可能，”斯金纳写道，“就像雕塑家捏黏土一样。” ^([^(329)](#fn329))


    他写道：“其中一些\[强化程序\]类似工业中广泛使用的不固定的日工资或计件工资；还有一些类似赌博机中精心设计的偶然事件，具有诱导持续行为的能力，让人欲罢不能。”
    ^([^(330)](#fn330))


    也许最具预言性的是，斯金纳认为，基于他的研究发现的原理，广义的教育，无论是针对人还是动物，可能会成为一个严格的、客观的领域，这个领域有可能实现飞跃。正如他所说：“人们常说，教学是一门艺术，但我们越来越有理由希望它最终会成为一门科学。”
    ^([^(331)](#fn331))


    斯金纳可能比他预想的更正确。在21世纪，机器学习专家也可能会使用“塑造”这个术语，而且用法同心理学家一样。对奖励的研究，尤其是如何战略性地管理奖励以获得你想要的行为，而不是你不想要的行为，的确已成为一门严格的定量科学，尽管可能不是像斯金纳想象的那样针对生物学习者。


    ## 稀疏问题

    '
  trans: '


    因此，也许我们不**需要**等到出现最终结果再去学习。也许我们可以在预期变化时学习。**任何**时候，一旦预期发生变化，就可以将变化视为先前估计的误差。因此，这是一个学习的机会：不是从尚未到来的最终结果，而是从更年长和更智慧的自我做出的新估计中学习。正如桑顿说的：“我们从猜测中学习猜测。”
    ^(²⁹⁴)


    （他插了一句：“听起来不太靠谱，不是吗？”）


    到 20 世纪 80 年代末，桑顿提出的“时序差分法”或“TD 学习法”已发展成为一种算法，他称之为“TD（λ）”（TD-拉姆达），可以根据后面的预测来精确调整预测。
    ^(²⁹⁵)


    理论看起来不错，但 TD 学习还需接受实践检验。第一次真正初显身手是在纽约的 IBM 研究院。一位名叫杰拉尔德·泰索罗（Gerald Tesauro）的年轻研究员对经典条件反射的计算模型感兴趣，他在
    20 世纪 80 年代末 90 年代初一直在尝试用神经网络下西洋双陆棋。初步得到了一些有希望的结果。1992 年，他把 TD 学习融入模型，它一飞冲天了。
    ^(²⁹⁶)


    这个领域很早就知道有可能写出比程序员自己下得更好的程序；亚瑟·塞缪尔在 20 世纪 50 年代就在跳棋上做到了。但这次不一样，这次的程序可以和任何一位人类玩家媲美。而且它完全是“自学”：从随机状态开始，通过不断和自己下棋来改进。这对
    TD 学习是极大的肯定。它提供了成功的蓝图，并将被 21 世纪那些大师级的弈棋程序如 AlphaZero 几乎原封不动地采用。


    新兴的强化学习领域曾经从大自然获得灵感，现在该回馈了。这个领域的高光时刻即将到来，最初受心理学和神经科学启发的数学框架将重新进入这些领域并产生重要影响。


    ## 预测和奖励的神经基础


    20 世纪 90 年代初，就在泰索罗改进双陆棋程序的同时，彼得·达扬（Peter Dayan），一位年轻的认知科学家，正在将目光从机器学习转向神经科学。达扬曾在巴图的实验室待过很长一段时间，还与沃特金斯一起研究了收敛证明。在爱丁堡大学研究了时序差分的数学后，他和几位神经科学家一起来到了圣地亚哥的索尔克研究所。


    达扬、博士后研究员里德·蒙塔古（Read Montague）和索尔克研究所的神经科学家特里·塞诺斯基（Terry Sejnowski）一起合作，他们认为，强化学习的框架不仅仅是为真实的人和动物的大脑运作提供了一种解释，可能大脑**真的**就是这样运作的。“我们想找到大脑中负责价值和强化的系统，”蒙塔古说。“我们当时想，‘这些东西应该实现了某种算法。’”
    ^(²⁹⁷)


    “我们知道这肯定和神经科学有关联，”达扬在优步总部的会议室向我解释，他在伦敦大学学院任教，现在正在旧金山过学术休假年。


    “然后，”他说，“我们拿到了沃尔夫拉姆·舒尔茨的数据。” ^(²⁹⁸)


    达扬站起身来，在白板上很快画出了多巴胺反应图。他指着猴子在获得提示后得到预期的果汁奖励时平静的反应说：“**这**部分信号和平常一样，就是你在雷斯科拉——瓦格纳模型中看到的，很漂亮的传统心理学。”


    然后，他指向前面由提示本身引起的多巴胺尖峰。“令人困惑的是信号的**这**一部分，”他说，“从心理学角度来看这出乎预料，所以舒尔茨经常纠结于这一点。”


    舒尔茨和整个神经生理学界都觉得这些数据难以理解，但是当达扬和蒙塔古看到舒尔茨的数据时，他们马上明白了。


    这就是时序差分。这是猴子期望值的突然波动，它的价值函数，它对事态好坏的预测。


    大脑多巴胺的基线波纹上方突然出现尖峰，意味着这个世界突然比刚才更有**希望**了。反过来，突然的静默则意味着事情突然变得**不像**想象的那么有希望。正常的背景波纹意味着事情没有出乎**预期**，无论好坏。


    多巴胺尖峰本身不是奖励，但与奖励有关；它本身不是不确定性、惊讶或注意力，但与所有这些因素密切相关。这种关联终于现身了。这是猴子预期的波动，表明之前的预测是错的，它的大脑在从猜测中学习猜测。


    在论文中被证明，在芯片上被验证的算法，现在在大脑中被发现了。时序差分学习不仅是**模仿**多巴胺的功能，它**就是**多巴胺的功能。


    1997 年，舒尔茨、达扬和蒙塔古联名在《科学》杂志上发表了一篇轰动世界的论文。正如他们所说，他们发现了“预测和奖励的神经基础”。 ^(²⁹⁹)


    这个发现对神经科学和计算机科学有深远影响。一个受心理学中经典和操作性条件反射模型启发，完全在机器学习领域发展出来的想法，突然形成了完整的闭环。它不仅是 AI
    的可能模型，似乎还描述了智力的普遍原则，完美。


    “眼睛独立进化了四五十次……生物圈一次又一次发明了眼睛，各种不同的眼睛，”蒙塔古解释道， ^(³⁰⁰)


    达扬也有相同看法。“我们天生就拥有这些，”他说，“你能在多巴胺神经元的活动中如此清晰地看到它的想法……这是一个重要启示。” ^(³⁰¹)


    75 岁的舒尔茨仍然在精力充沛地工作。参观他位于剑桥的实验室时，我问他，在当时是否就感觉这是一个启示。让我惊讶的是，他说不是。在他看来，真正的启示是，描述猴子在寻找食物时大脑活动的
    TD-学习模型，虽然很简单，却在 20 年后促成了当前 AI 的突破。我们能够从自然界获得这样的普适性方法，并综合应用，这才是让他大吃一惊的。


    “当我看到 TD 模型催生了我们现在看到的围棋程序之类的 AI 和机器学习时，才意识到了启示，”他说，“这时我才说，**我的上帝，我做了什么？**你知道我的数据来自雷斯科拉——瓦格纳模型，来自一个预测误差，但结果却……天哪！我的意思是，我知道泰索罗用
    TD 模型下双陆棋。好吧，我不下双陆棋，但我下围棋，下得不太好。我说，还行，但如果他们能对围棋编程，那这个模型才**真**厉害。而我其实在他们写这些程序之前已经发现了这个。”


    我告诉他，我认为发现神经生理学和机器学习领域如此清晰和强大的综合性成果，而且对两个领域都有如此大影响，这很了不起。


    “当然，”他说，“是这样。这就是它的魅力所在。所有东西都契合到了一起。完美解释。” ^(³⁰²)


    这对神经科学的影响是革命性的。 ^(³⁰³)


    诚然，还有许多问题需要解决，而且现在看来这个经典解释有可能会被推翻，或是随着时间推移变得复杂。 ^(³⁰⁴)


    她讲述了自己第一次参加神经科学年会的经历。年会聚集了该领域大约 3 万名研究人员。“我第一次去时留意过强化学习，大概是在 2003、2004 年。整个会议期间只有大约
    5 张海报。会议持续整整一周，每天都有两轮海报张贴，上午一轮，下午一轮。“现在，”她说，“每轮海报张贴强化学习都占了一整段，或者一整行。它确实在这 10 到
    15 年取得了长足进步。” ^(³⁰⁵)


    她补充道：“有很多研究都在大脑中验证这一理论的猜测，并发现‘天哪，这些神经元好像读过教科书。它们读过桑顿和巴图的教科书。它们非常清楚自己要做什么。’”


    ## 幸福与误差


    如果 TD-学习模型揭示了多巴胺在大脑中的功能——不是作为大脑的奖励货币，也不是作为大脑对未来奖励的**预期**，而是作为大脑对未来预期的误差——那么它就留下了一些问题。


    首先，它打开了与快乐和幸福的主观体验的关联。如果多巴胺水平的增高预示着**事情会比我想象的要好**，那么这种感觉本身就是愉悦的。你可以看到人类和动物如何不遗余力地想获得这种感觉，包括直接通过化学和电流刺激多巴胺神经元。


    你也会看到人工提高多巴胺水平是如何导致不可避免的崩溃。认为事情**会**比你想象的要好只会持续这么久。最终你会意识到并**没有**你想象的那么好，就像舒尔茨对猴子做的实验那样，当果汁提示灯闪烁但没有果汁时，多巴胺会静默。多巴胺有可能开出环境无法兑现的支票。这些支票最终必然会被驳回。你的价值函数终将回归现实。


    这正是多巴胺相关药物的特点，可卡因就是典型例子。这种毒品会抑制大脑对多巴胺的再吸收，从而导致多巴胺的暂时“泛滥”。TD 对此的解释是，大脑把这理解为一种总体感觉，事情将变得很好，但多巴胺开的是空头支票，环境无法兑现奖励。最终，预测的利好不会到来，随之而来的是等量且相反的负面预测错误。“**似乎**一切都将变得更美好……”我们可以用化学愚弄大脑的预测机制，但只骗得了一时。


    正如作家大卫·伦森（David Lenson）所说：“可卡因承诺在 1 分钟内将获得最大快感，正确的景象将出现在眼前，另一剂毒品将被注射，性交将很和谐。但那个未来永远不会到来。诚然，毒品能带来生理快感，但与即将发生的事相比，这是偶然的、微不足道的。”
    ^(³⁰⁶)


    多巴胺与快乐愉悦的主观体验的关联仍然在深入研究。例如，密歇根大学的肯特·伯里奇（Kent Berridge）在职业生涯的大部分时间都在剖析**想要**而不是**喜欢**的神经科学。
    ^(³⁰⁷)


    拉特利奇与彼得·达扬以及伦敦大学学院的团队合作，设计了一个实验，让受试者下各种赌注，积累一笔钱，同时周期性地问受试者：“你现在有多开心？” ^(³⁰⁸)


    拉特利奇的发现在许多方面都很有启发性。首先，快乐是**短暂的**。无论你在某次下注中赢了 1 英镑后有多高兴，5 次下注后，92%的高兴都消失了。10 次下注前发生的任何事就像从未发生过。这意味着受试者的高兴实际上与他们赢了多少钱无关。


    快乐似乎至少部分是由受试者**预期**能赢多少钱决定的，但似乎最关键的是**违背**这些期望。正如拉特利奇写的：“短暂的快乐不是反映事情的进展有多好，而是反映是否比预期的要好。”
    ^(³⁰⁹)


    放宽视界，我们会注意到神经科学和经济学中一个众所周知的现象，所谓的“享乐适应”。这个现象说的是，不管长期生活质量如何变化，人们总是会顽固地不断回到情绪基线。
    ^(³¹⁰)


    不幸的是，这项研究也不赞同“总是保持低期望”这类简单的生活原则。正如拉特利奇所说：“较低的预期使结果更有可能超出预期，并对幸福产生积极影响。然而，在决定产生后果之前，预期也会影响幸福。如果你打算在喜欢的餐馆和朋友会面，一旦制定了计划，积极的预期也可能会让你更快乐。”
    ^(³¹¹)


    在论文中，他和合著者提到了一种可能性，例如，一家航空公司声称有 50%的几率会延误 6 小时，然后宣布实际延误将是 1 小时。“降低预期会增加正面结果的可能性……然而，较低的预期会在结果到来之前降低幸福感，从而限制了这种操纵带来的好处。”
    ^(³¹²)


    用拉特利奇的话说：“你知道的，你不能用降低预期来解决一切问题。” ^(³¹³)


    多巴胺、TD 误差和快乐的关联启发一些研究者思考强化学习自主体的主观快乐是否有伦理意义。基础研究所的布莱恩·托马西克（Brian Tomasik）关注理解和减轻痛苦的问题，他严肃思考了强化学习项目是否存在道德立场问题——我们如何对待它们重要吗？他给出了试探性和有限的肯定答案：就它们建立在与动物和人类大脑相似的原则上而言，很可能它们应该得到一点伦理考虑。
    ^(³¹⁴)


    一方面，它为解释享乐适应的进化和计算提供了线索。如果主观幸福感与**惊喜**密切相关，并且不知疲倦地预测和减少惊讶是智力的天性，那么我们就能理解这种幸福感为何转瞬即逝。我们也可以看到它的进化优势。婴儿可能会为自己能随心所欲挥动手臂而高兴。对于成年人来说，这种能力不再像婴儿期那样令人兴奋。尽管我们可能会哀叹成年人的不知足，这却是人生课程的必需部分。如果基本的运动技能就能让我们一直兴奋，我们就永远无法成年。


    正如安德鲁·巴图说的，这种转瞬即逝是克劳夫早在 20 世纪 70 年代初就预料到的。“他的观点是，（自体平衡）稳定机制试图将差异降至零，当差异为零时，它会感到高兴，然后停止。他想要的那种系统永远不会满足。因此会不断探索。”
    ^(³¹⁵)


    ## 超越强化


    强化学习萌生于 20 世纪初的动物学习研究，在 20 世纪七八十年代繁荣于机器学习抽象的数学世界，最后居然以近乎完美的模型成功反哺动物行为研究，成为了大脑中多巴胺作用的公认解释。
    ^(³¹⁶)


    与此同时，就在 2018 年，神经科学证据开始表明，克劳夫的疯狂假说——即神经元是“享乐主义者”，受其自身桑代克效果律的驱动——可能与事实相去不远。 ^(³¹⁷)


    强化学习还为我们提供了一个强大的，甚至可能是普适的，关于智力是什么的定义。 ^(³¹⁸)


    然而，在某些方面，对动物和机器在世界中实现目标的**能力**的更深入理解，还开启了更深刻的哲学之路。很显然，这一理论并没有告诉我们评估**什么**价值，或者**应该**评估什么价值。在这方面，多巴胺的神秘一如从前。如果它代表了某个标量预测误差，那么它就隐藏了如何“评估”该预测的巨大复杂性。如果，在第一扇门背后，不是我们期待的加勒比海假期，而是观看北极光之旅，我们的多巴胺会迅速可靠地表明我们对此是喜是忧。但是，这些选项的**价值**到底是如何评估的呢？
    ^(³¹⁹)


    与此同时，我们还遇到了另一个问题。经典形式的强化学习认为世界的奖励结构是给定的，并提出了如何算出最大收益的行为也即“策略”的问题。但在许多方面，这掩盖了 AI
    前沿面临的更有趣也更可怕的问题。我们发现自己对这个问题的**逆**更感兴趣：给定我们希望的机器行为，如何构建环境的奖励来诱导这种行为？当**我们**坐在观众席后面，坐在评论家的位置，我们如何通过操控食物或它们的数字等价物，得到我们想要的？


    这就是强化学习背景下的对齐问题。这个问题在过去 5 到 10 年变得越来越紧迫，但正如我们将看到的，它和强化学习本身一样深深植根于过去。


    ## 5. 塑造


    大自然将人类置于痛苦和快乐这两个至高无上的主人的统治之下。只有它们才能指引我们该做什么，以及决定我们要如何做。


    ——杰里米·边沁（Jeremy Bentham） ^(³²⁰)


    奖励函数的设计可能是建立强化学习系统最困难的方面，却很少被讨论。


    ——玛雅·马塔里奇（Maja Matarić） ^(³²¹)


    1943 年，斯金纳在研究一个战时秘密项目，这个项目最初是由通用磨坊食品公司赞助的。通用磨坊把明尼阿波利斯金牌面粉厂的顶楼给斯金纳做实验室。这个项目是当时最大胆的构想之一：斯金纳打算训练鸽子啄食轰炸目标的图像，然后把鸽子
    3 只一组放在真正的炸弹里，在投弹时制导。“我和同事们知道，”斯金纳说，“在全世界眼中，我们是疯子。” ^(³²²)


    斯金纳意识到，许多人会认为这个项目疯狂且残忍。关于疯狂，他指出，人类将动物（超越人类）的感官用于人类目的的历史悠久且有传奇色彩：导盲犬、搜寻松露的猪等等。关于残忍，他辩解道：“我们是否有权将低等生物转化为不自知的英雄，思考这个伦理问题是和平时期才有的奢侈。”
    ^(³²³)


    斯金纳长期致力于强化研究，他著名的“斯金纳盒子”可以说是桑代克迷箱在 20 世纪中期的升级版。盒子中的灯、杠杆和机械食物给料器（通常是用自动售货机改装）可以对强化进行精确和定量的研究，它们将被几代研究人员沿用（例如舒尔茨将其用于研究猴子的多巴胺）。1950
    年代，斯金纳利用他的盒子研究动物如何在各种条件下学会采取行动来最大化奖励（通常是以食物的形式）。他提出了“强化程序”的概念，测试了各种类型的强化程序并观察效果。例如，他比较了按“比率”强化（一定**数量**的正确行为会得到奖励）与按“间隔”强化（一定**时间**后的正确行为会得到奖励）。他测试了“固定”和“可变”强化，前者的行为数量或时长保持不变，后者允许波动。斯金纳的著名发现是，最强烈、最重复、最持久的行为往往来自**可变比率**的程序——也就是说，奖励出现在重复多次的行为之后，但重复次数会波动。
    ^(³²⁴)


    然而，在顶楼的秘密实验室，斯金纳还面临另一个挑战：不仅要弄清楚哪些强化程序能植入最根深蒂固的简单行为，还要弄清楚如何仅仅通过奖励来产生相对复杂的行为。有一次，当他和同事试图教鸽子击球时，困难变得很明显。他们建了一个微型保龄球馆，里面有木球和玩具球瓶，打算在鸽子向球猛击时给予它第一次食物奖励。不幸的是，什么都没发生。鸽子没有这样做。实验员等啊等啊……最终失去了耐心。


    然后他们改变了策略。如斯金纳所述：


    我们决定强化任何与击球稍有关联的反应，也许起初只是看向球的行为，然后选择更接近最终目标的反应。结果令我们惊讶。几分钟后，球开始在盒子壁间碰撞，就好像鸽子是壁球冠军。


    效果是如此惊人，以至于斯金纳的两位助手——玛丽安·布雷兰（Marian Breland）和凯勒·布雷兰（Keller Breland）夫妻俩——决定放弃心理学学术生涯，成立一家动物训练公司。“我们想利用斯金纳的行为控制原理来谋生，”玛丽安说。
    ^(³²⁵)


    斯金纳也认为，在面粉厂秘密实验室的微型保龄球馆里的这一刻对他是一种顿悟，改变了他职业生涯的轨迹。他认为，关键是“通过强化与最终目标大致相似的行为来逐渐**塑造**行为，而不是等待完全一样的行为”。
    ^(³²⁶)


    然而，鸽子计划最终没有付诸实施。鸽子们干得非常出色，如此出色，以至于转移了政府科学研究和发展办公室委员会的注意力。“由活着的鸽子执行任务的景象，不管多么美丽，”斯金纳写道，“只会提醒委员会我们的提议多么不切实际。”
    ^(³²⁷)


    斯金纳认为这个概念已经证明可行，在 20 世纪 50 年代末，他自豪地写道：“可以说，用生物来制导，不再是一个疯狂的想法。” ^(³²⁸)


    关键是他们发现了**塑造：**通过简单奖励来灌输复杂行为，奖励一连串近似的行为。“这使得塑造动物的行为成为可能，”斯金纳写道，“就像雕塑家捏黏土一样。” ^(³²⁹)


    他写道：“其中一些\[强化程序\]类似工业中广泛使用的不固定的日工资或计件工资；还有一些类似赌博机中精心设计的偶然事件，具有诱导持续行为的能力，让人欲罢不能。”
    ^(³³⁰)


    也许最具预言性的是，斯金纳认为，基于他的研究发现的原理，广义的教育，无论是针对人还是动物，可能会成为一个严格的、客观的领域，这个领域有可能实现飞跃。正如他所说：“人们常说，教学是一门艺术，但我们越来越有理由希望它最终会成为一门科学。”
    ^(³³¹)


    斯金纳可能比他预想的更正确。在 21 世纪，机器学习专家也可能会使用“塑造”这个术语，而且用法同心理学家一样。对奖励的研究，尤其是如何战略性地管理奖励以获得你想要的行为，而不是你不想要的行为，的确已成为一门严格的定量科学，尽管可能不是像斯金纳想象的那样针对生物学习者。


