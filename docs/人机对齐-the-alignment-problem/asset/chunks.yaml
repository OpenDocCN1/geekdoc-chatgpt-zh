    CMU 博士生 Benjamin Eysenbach 在 3D MuJoCo 环境中研究了类似想法。他的想法是可逆的，融合了徒步旅行者和背包客的“不留痕迹”精神。这个想法是用常规的强化学习方法来发展完成各种任务的能力，但有一个重要的附带条件。在雅达利游戏中，典型的学习包括数十万次外部强加的重启，与视频游戏的遍历环境不同，他的自主体在再次尝试它们试图做的任何事情之前，总是将自己重置回准确的初始配置。初步的结果令人鼓舞，例如，他的简笔画猎豹会快速移动到悬崖边缘，然后后退——似乎已经内化了一旦越过边缘就没有回头路。参见
    Eysenbach 等，“Leave No Trace”。另见更早的类似想法：Weld&Etzioni，“The First Law of Robotics（a
