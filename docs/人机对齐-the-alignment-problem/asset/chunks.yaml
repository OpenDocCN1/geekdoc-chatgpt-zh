    657.  参见Knuth，“Structured Programming with Go to Statements”，和Knuth，“Computer
    Programming as an Art”，都发表于1974年。这句话的历史有点复杂，15年后，1989年，在“The Errors of TeX”中，高纳德自己说这是“霍尔（C.
    A. R. Hoare）的名言”。然而，似乎没有任何证据表明是霍尔说的。当霍尔本人在2004年被问及时，他说他“不记得”这句话是从哪里来的，认为可能是埃德格·迪克斯特拉（Edsger
    Dijkstra）说过诸如此类的话，并补充说，“我认为你假设这是常见的文化或民间说法是公平的”（Hans Gerwitz，“Premature Optimization
    Is the Root of All Evil”，https：//hans.gerwitz.com/2004/08/12/premature-optimization-is-the-root-of-all-evil.html）。高纳德在2012年承认，“我确实说过‘编程时过早优化是万恶之源’之类的话”（Mark
    Harrison，“A note from Donald Knuth about TAOCP”，http：//codehaus.blogspot.com/2012/03/note-from-donald-knuth-about-taocp.html）。这句话十有八九就是他说的。[↩](#fnref657)


    658.  美国疾控中心警告说，卧室太冷会导致婴儿体温过低。2017年，泰国一名健康中年男子在低温休克后死于卧室，原因只是在寒冷的夜晚开着风扇。分别参见Centers
    for Disease Control and Prevention，“Prevent Hypothermia and Frostbite”，https：//www.cdc.gov/disasters/winter/staysafe/hypothermia.html，和Straits
    Times，“Thai Man Dies From Hypothermia After Sleeping With 3 Fans Blowing at Him”，2017年11月6日，https：//www.straitstimes.com/asia/se-asia/thai-man-dies-from-hypothermia-after-sleeping-with-3-fans-blowing-at-him。[↩](#fnref658)


    659.  Wiener, God and Golem, Inc。2016年，MIRI研究员杰西卡·泰勒（Jessica Taylor）探索了她所谓的“量化器”的相关概念：自主体不是彻底优化一个可能有问题的指标，而是满足于“足够好”的行为；参见Taylor，“Quantilizers”。这也与被称为“早停法”的正则化方法有相似之处；参见Yao,
