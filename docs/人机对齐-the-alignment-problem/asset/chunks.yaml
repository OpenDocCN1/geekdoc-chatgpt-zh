  trans: '


    结果证明，关键的洞察隐藏在自行车的故事中。为了防止自行车绕圈，无休止地累积分数，你还必须对**远离**目标进行**惩罚**。罗素最初学的是物理，他把奖励问题和能量守恒联系起来。罗素解释道：“关键是让塑造成为物理中的‘守恒场’。”
    ^(³⁶¹)


    这个思想在自行车问题中很直观：如果你奖励朝目标前进，你也必须**惩罚远离**目标。换句话说，奖励“积分”应该始终反映自行车离目标有多近，而不是它所走的路径。但将激励机制视为“势能”会更深刻和更具普适性。这是一个必要和充分条件，确保你用修改过的奖励训练的系统不会将其行为与实际问题割裂开来。


    “一般来说，”罗素说，“最好是根据环境的实际需求来设计绩效指标，而不是根据所认为的自主体应该如何表现来设计。” ^(³⁶²)


    尽管这不是解决**所有人**类激励问题的灵丹妙药，但将焦点从行动转向状态，确实启发了我们重新思考为他人有意或无意设计的激励结构。假设孩子为了收益翻倍，将垃圾又倒出来，我们可以把奖励变成一个“守恒场”，责骂乱倒垃圾，使得重复的净收益为
    0。不过，改为表扬状态而非行动可能更容易：我们可以说：“哇，地板真干净啊！”


    当然，奖励的艺术和科学远不止是避免恶性绕圈，这是一个开始。吴恩达和罗素在总结工作时谦虚谨慎地指出：“我们认为，寻找好的塑造函数将越来越重要。” ^(³⁶³)


    ## 设计的奖励


    我对他说：“你要多生养几个。”但不是用那些话说的。


    ——伍迪·艾伦（Woody Allen） ^(³⁶⁴)


    从达尔文的角度来看，人们想要的是相当清楚的：繁殖和保护他们的遗传谱系。人们**具体**想要的，因时而异，更加混杂和短视：高潮、巧克力、新车、尊重。因此，似乎我们在生理和文化上被诱导，想得到一些眼前的具体的东西，这些东西通常会引导我们的行为模式，使其与最终的进化目标相一致，否则目标会太遥远或定义不清，难以有意识地瞄准。
    ^(³⁶⁵)


    听起来熟悉吗？


    理解塑造的本质和作用——首先在行为心理学中，然后在机器学习中——不仅教了我们如何设计更好的自主体。也许它最令人惊讶的贡献在于让我们从另一个角度思考进化。


    20 世纪 80 年代末，布朗大学的迈克尔·利特曼在读研究生时，曾到贝尔通信研究所（Bellcore）工作过一段时间，这家研究所位于新泽西州，之前是美国电话电报公司（AT&T）的一部分。在那里，他很快遇到了一位导师和朋友，戴夫·阿克利（Dave
    Ackley）。


    利特曼问阿克利关于行为问题的研究，即随着时间推移做决定和行动。利特曼回忆道：“他大概是这样说的，‘哦。你说的是强化学习。我看过一点。我给你找篇论文。’他给了我桑顿
    1988 年的时序差分论文。” ^(³⁶⁶)


    利特曼开始阅读关于时序差分学习的文献，并着了迷。他问阿克利在哪里可以深入学习。“他说，‘邀请桑顿来做个演讲吧’。我很惊讶，‘啊？你能请到他？你读了一篇论文，上面有个人的名字，然后你就能和他当面交流？……在我眼里那是**文献**，不认为它是**圈子**’；‘不，那是一群人，他们相互认识，阿克利说，‘我可以邀请他。’所以他把他请来了。”


    桑顿来了，让阿克利和利特曼都迷上了强化学习。


    他们感兴趣的问题是，进化如何塑造我们的奖励函数，从而产生对一个生物或物种的长期整体生存有利的短期行为。生物的奖励函数本身已经做到了这一点，否则行为可能看起来非常随机。阿克利和利特曼想知道，如果直接让奖励函数进化和变异，让模拟的虚拟实体死亡或繁殖，会发生什么变化。
    ^(³⁶⁷)


    他们创造了一个二维虚拟世界，让模拟生物（或“自主体”）可以在一个生境中移动、进食、被捕食和繁殖。生物的“遗传基因”包含了自主体的奖励函数：它有多喜欢食物，它有多不喜欢靠近捕食者，等等。在它的一生中，它会使用强化学习来学习如何采取行动以最大化收益。当生物繁殖时，它的奖励函数会和一些随机突变一起遗传给后代。阿克利和利特曼用随机生成的自主体启动了原始种群。


    “然后，”利特曼说，“我们看着它运行，700 万个时间步，这在当时是很大的规模。那时计算机速度较慢。”会发生什么？正如利特曼总结的：“奇怪的事情发生了。”
    ^(³⁶⁸)


    大致看来，大多数成功的自主体最终的奖励函数很好理解。食物通常被认为是好的。食肉动物通常被认为是不好的。但仔细观察就会发现一些怪癖。例如，一些自主体只学会了食物位于其**北面**时才接近食物，而在食物位于其南面时则不会。


    “它不是所有方向的食物都喜欢，”利特曼说，“在奖励函数中有些奇怪的洞。如果人为修补这些洞，这些自主体会变得非常擅长进食，它们会把自己撑死。”


    他们创建的虚拟生境中有树，自主体可以在那里躲避捕食者。自主体学会了在树附近闲逛。被树吸引的自主体最终存活了下来——因为当捕食者出现时，它们有地方可以躲藏。


    然而，有个问题。它们天生的奖励系统，经过进化的修补，告诉它们围着树闲逛很好。渐渐地，它们的学习程序明白了，根据这个奖励制度，靠近树是“好的”，远离树“不好”。它们逐渐学会为此优化行为，越来越长久地守着树不离开，到了阿克利所说的“陪树老去”的地步。它们从不远离树，耗尽食物，饿死。


    然而，这种“陪树老去”行为总是在自主体达到生殖年龄后开始，因此没有被进化淘汰，庞大的爱树自主体社群蓬勃发展。


    对利特曼来说，这除了体现进化的怪异和任性，还有更深层的信息。“这是对奖励函数有趣的案例研究，有意思的不仅仅在于孤立的奖励函数，而是奖励函数与它所产生行为的相互作用。”


    特别是，**如果**“陪树老去”自主体不是那样过于擅长最大限度地获得奖励，它们最初的奖励函数是最适合的。一旦它们变得更有能力和更熟练，它们就滥用奖励函数到了危险的地步，直至将自己毁灭。


    这其中不难看出对智人的警示。像“有机会尽可能多吃糖和脂肪”这样的启发式方法是最优的，只要环境中没有那么多糖和脂肪，并且你并不特别擅长寻找。一旦环境变化，为你和你的祖先服务了数万年的奖励函数会突然让你偏离正轨。


    安德鲁·巴图认为，思考进化中的这类线索很有用，因为我们现在扮演了奖励设计师的角色。“进化为我们设计了奖励函数，所以这对我们为人工系统设计奖励函数非常有启发，”他说，“自然界就是这样。进化产生了这些奖励信号，鼓励我们去做那些让我们成功繁衍的事情。”
    ^(³⁶⁹)


    正如巴图指出的：“一个有趣的事情是，进化并没有用生殖成功作为我们的奖励信号，而是给了我们预测器奖励。”我们优化自己的行为，以最大化我们认为有收益的东西，但在更大的背景中，进化在塑造我们会认为什么东西是有收益的。“所以，这是一个两级优化，”巴图说，“我对此非常感兴趣。”


    近年来，巴图与密歇根大学的萨廷德·辛格（Satinder Singh）和理查德·刘易斯（Richard Lewis）以及当时还在读博士的乔纳森·索尔格（Jonathan
    Sorg）合作，研究“最优奖励问题”。 ^(³⁷⁰)


    “人工自主体的目标应该和自主体设计者的目标一样吗？”他们写道，“这个问题很少被考虑。” ^(³⁷¹)


    他们说，考虑一个游戏，其中只有一个自主体、一根钓竿、一些蠕虫和养了很多鱼的池塘。 ^(³⁷²)


    也许最有趣的是这样的情形：一个自主体聪明到足以学会钓鱼，并且寿命也长到**刚好**可以学习钓鱼——但是还不够长到能从这种投资中获得**好处**。那它就应当讨厌吃鱼，这样它们就别无选择，只能吃虫子了！


    自主体的寿命、资源或设计的微妙变化可能会对最优奖励的结构产生剧烈和突然的影响。对于在**特定**环境下什么样的奖励对**特定**的自主体来说是理想的，似乎无法给出简单答案。这方面的研究还在继续，但学会明确区分你想要什么和你奖励什么，是答案的重要组成部分。
    ^(³⁷³)


    最近，心理学家和认知科学家正在利用这些工具来问一个有趣的问题，不是关于机器，而是关于人类。他们问，如果这个计算能力有限、不耐烦、目光短浅的自主体是你自己，你应该怎样设计最优的奖励函数来帮助自己学习优化？


    ## 我们应该怎样训练自己？


    机器学习中奖励塑造的理论和实践，不仅给出了操控自主直升机的方法，还为理解人类智能和改善人类生活贡献了两个不同的视角。第一，对于为什么有些问题或任务比其他的更难解决或完成的问题，它给出了一个原因：**稀疏性**。第二，对于如何增加奖励让棘手问题变容易，同时又不引入不适当激励的问题，它提供了一个理论：奖励状态，而不是行为。


    这些见解在改善人类生活方面的潜力巨大。光是经济利益就很大——最近的一份报告估计，英国每年因工作拖延造成的损失达 760 亿英镑——更不用说对我们的身心健康、生活质量和成就感造成的隐形损失了。
    ^(³⁷⁴)


    我们生活在电子游戏成瘾和现实世界拖延的时代，也许这不是拖延者个人的错。正如斯金纳说的：“我很想对实验动物大喊，‘乖一点，该死的，乖一点！’最终，我意识到实验动物总是正确的。它们的表现就应该是这样。”
    ^(³⁷⁵)


    麦戈尼格尔是一名游戏设计师，她的职业生涯是设计游戏来帮助人们——包括她自己——克服生活中的挑战。她认为，大多数游戏，尤其是电脑游戏，之所以如此令人着迷和上瘾，是因为它们总是让你需要做的事情很清晰，并且有可能做到。


    首先是无论你何时登入这些网络游戏……有很多不同的角色愿意无条件相信你拯救世界的使命。不会是随随便便的任务，而是与你目前在游戏中的等级相匹配。是不是？所以你可以做到。他们永远不会给你一个你无法完成的挑战。但是很接近你的能力，所以你必须努力才能做到。
    ^(³⁷⁶)


    换句话说，游戏之所以吸引人，是因为游戏非常擅长**塑造**。关卡是完美的课程，绩点是完美的伪奖励，它们是斯金纳式的杰作。


    强化学习不仅提供了框架来理解和阐释游戏吸引人之处，还提供了方法来对这些直观认识进行实证。一个从最简单到最难的关卡都有清晰课程的游戏，并且用清晰的伪奖励指引前进方向，同时激励探索和促进技能发展，应该更容易让算法学习。不难想象游戏公司在不远的将来会用自动化玩家测试关卡，以发现真正的人类玩家可能会放弃或退出的地方。


    当然，问题在于这些虚拟环境比真实环境更擅长塑造。正如麦戈尼格尔说的：“现在，像《魔兽世界》这样的协作在线环境的问题是，一直处于史诗级胜利的巅峰是如此令人满足，以至于我们把所有时间都花在游戏世界里。游戏比现实更好。”对麦戈尼格尔来说，解决方案不是让自己摆脱这些完美的奖励塑造环境，而是相反：“要让现实世界更像游戏。”


    在这方面，麦戈尼格尔自己也倡导了一些运动，她还利用游戏来克服自己生活中的障碍，包括脑震荡长期康复后出现的自杀性抑郁症。 ^(³⁷⁷)


    这个领域被称为**游戏化**， ^(³⁷⁸)


    马克斯·普朗克智能系统研究所的认知科学家福尔克·利德（Falk Lieder）无论是在研究中还是在生活中，对这个问题都有很深刻的认识。


    利德的研究主要围绕他提出的“理性增强”。他研究人们如何思考和做决定，与大多数研究人员不同，他不仅对理解人类认知感兴趣，还致力于设计有效的工具和干预措施让人类思考得更好。他最早的人类实验对象就是他自己。


    在成长过程中，利德发现学校教育让他感到沮丧，尽管给了他很多思考的空间，却从未触及思考本身。“我一直觉得我真正想学的是思考方法，以及如何做出好的决定，”他解释道，“没人能教我这个。他们只教我关于世界的事实陈述，这不是很有用。我真的很想学习如何思考。”
    ^(³⁷⁹)


    随着时间推移，对个人进步的追求逐渐演变为更大的追求：理解人类推理原理，并创造工具对其进行改进。“我研究的一部分，”他解释道，“就是发现最优的思考和决策策略，这样我们就可以为好的思考创建真正基于科学的课程。”


    利德对游戏化感兴趣，具体说是他提出的**最优**游戏化：给定一个目标，帮助实现该目标的最优激励结构是什么？ ^(³⁸⁰)


    利德与汤姆·格里菲思合作，建立了一些最优游戏化的基本规则。他们借鉴了吴恩达和斯图尔特·罗素的发现，最重要的规则之一是奖励**状态**，而不是**行为**。因此，分配给行为的分数必须能体现由此导致的状态有多好——而且，正如利德指出的，“分数的分配方式必须是当你撤销某件事时，你失去的分数和你做这件事时获得的分数一样多”。这就是兰德尔夫和阿尔斯特勒姆在骑自行车机器人身上学到的东西，也是安德烈和泰勒在振动的足球机器人身上学到的东西，也是格里菲思在女儿把垃圾倒到地板上时学到的东西。


    吴恩达和罗素的论文曾指出，对于一个预测自身行为影响的能力有限的自主体，塑造奖励可以使其表现得好像更有远见。 ^(³⁸¹)


    利德和格里菲思设计了一项实验，让受试者扮演航线规划者的角色。让飞机飞往某些城市的航段可能有利可图，但可能会导致下一航段没什么有利可图的路线，反过来也是一样：为了其他航段的收益，亏本飞某个航段可能是值得的。他们尝试在航段票价上增加额外的收益（或罚款），以反映执行该航段后的后续成本或收益。结果符合预期，这使得人们更容易做出更好、更有利可图的决定。


    只有一个缺点：塑造奖励将选择的长期成本和收益加在了票价中，因此规划者无需长远考虑。这使得他们的决策更加**准确**，但有些无力。人们不再需要努力思考，他们也的确没有。“如果你在一个（短视）决策能奏效的环境中行动，”利德说，“你会越来越依赖系统。”
    ^(³⁸²)


    这引出了一个有趣的可能：能不能利用最优游戏化，不是**消除**规划的需要，而是让人们**更擅长**规划？


    如果是这个目的，激励措施会截然不同。与其将界面构造一个容易的问题，纳入长期成本——能带来更高质量的决策，但或许会导致受试者怠惰或自满，让他们更依赖界面——不如调整价格来创建一个**课程**。受试者可以逐步被**教导**如何长远思考，从简单的图开始，随着受试者越来越擅长，慢慢增加复杂性。这个界面不是作为拐杖，而是使用一组不同的激励来做相反的事情：“教人们做更长远的规划，”利德解释道，“这样他们就可以在短期收益与长期价值不一致的环境中取得成功。”


    利德最新的一项实验不是关于飞行计划，而是更熟悉的背景：拖延。他和格里菲思精心设计了一项很难的任务——就 5 个主题写一系列短文，其中一些更长也更难——并发布到
    MTurk 网站上，人们可以选择在 10 天后的截止日期前完成所有短文并获得 20 美元。在所有注册的人中，40%的人甚至**从未开始**。（这尤其有讽刺意味，因为在认领任务时，他们有机会拒绝参与并获得
    15 美分！） ^(³⁸³)


    利德和格里菲思还试验了奖励措施，参与者完成一篇文章就能获得“分数”，没有现金价值，但是令人鼓舞。每篇文章的分数相同。结果没用。


    最后，他们向第三组参与者提供了**最优**激励：分值能精确反映每个主题有多难或有多令人不愉快，以及当他们完成这个主题时离挣 20 美元有多近。（例如，为朝鲜经济政策写
    100 个字，大约是为他们最喜欢的电视节目写 50 个字的分值的 3 倍。）这次有 85%的参与者完成了所有 5 篇短文。 ^(³⁸⁴)


    利德将这样的系统视为“认知假体”， ^(³⁸⁵)


    攻读博士时，利德发现自己陷入了可怕的文章写作任务的放大版本。“我认为最糟糕的情形之一是无法得到自己进步的信息，”他说，“官方规矩是，你是博士生了，然后是你获得了博士学位，仅此而已，其间
    5 年没有反馈。”


    博士生是焦虑和抑郁率较高的群体，对他们来说，拖延几乎是流行病。 ^(³⁸⁶)


    那样行不通。利德需要别的东西。他给自己设计了 5 年课程——“我把它分解成几百个关卡。”当他做出他认为可能在几年后带来**真正**引用的研究时，他会奖励自己虚拟的“引用”分。他使用为参与者写短文打分一样的最优游戏化计分，给他攻读博士的每个子任务赋予适当分值。为了克服一些坏习惯，他甚至还引入了惩罚——利用帕夫洛克手环
    ^(³⁸⁷)


    在利德自己的行为训练实验中，他既是实验者也是受试者，这让他获得了解决奖励塑造问题的独特优势。对自己的训练同时也是进行研究的过程和研究的中心问题。结果令人鼓舞，现在有了自己的实验室的利德用博士头衔证明了这一点。


    ## 超越外部强化


    对斯金纳来说，不仅个人的自由意志令人不安地处于“虚构的位置”，甚至整个人类文明的故事本质上都是奖励结构的故事。斯金纳本人对此持乐观态度，他写了乌托邦小说《瓦尔登湖第二》，构想了一个完美的行为主义社会。


    然而，任何接触过儿童或动物的人可能都有一种挥之不去的怀疑，即对于我们为什么要做我们所做的事情，奖励最大化实际上**并不是**全部。我们玩自己发明的游戏，不是为了明显的奖励。我们翻开石头，或者登山，只是为了看看会发现什么。我们探索。我们很爱玩，也很好奇。简而言之，我们既受**外在**奖励驱使，也受**内在**奖励驱使。


    碰巧的是，在机器学习的世界里，这也变得越来越受欢迎。


    ## 6. 好奇


    未经训练的婴儿大脑要成长为智慧的大脑，必须具备规训性和主动性。目前我们还只考虑了规训性。


    ——图灵 ^(³⁸⁸)


    2008 年春天，阿尔伯塔大学的计算机科学家迈克尔·鲍林（Michael Bowling）和研究生马克·贝勒马尔（Marc Bellemare）在巴巴多斯的海滩上散步。鲍林有个想法。当时，研究强化学习通常是研究人员从头开始自己设计游戏，然后搭建系统来挑战那个游戏。
    ^(³⁸⁹)


    鲍林心想，能不能建立一个统一的环境，所有人都可以用，不是一个游戏，而是一个庞大的游戏库。另外游戏能不能就用**真**游戏，比如 20 世纪七八十年代风靡一时的雅达利
    2600 游戏机上的经典游戏？


    贝勒马尔回忆自己当时的反应，“这是我听过的最愚蠢的想法”。 ^(³⁹⁰)


    “然而 3 年后，嗯，我不再觉得这个想法很蠢。”事实上，贝勒马尔发现他非常喜欢这个想法，于是鲍林成了他的博士导师，这个想法也成了他的博士论文。


    这个电子游戏库项目被称为街机学习环境（ALE），很有点疯狂，不仅因为它工作量很大，还在于它对该领域的研究者提出的挑战。 ^(³⁹¹)


    问题的很大一部分难点在于，当时使用的特定游戏环境经常是用精练的术语向自主体描述世界，自主体获得的输入更高层也更好用。在用轮式推车平衡杆子的例子中，推车的位置、速度和杆子的倾斜角度、速度等会提供给系统作为输入。在有树、食物和捕食者的二维网格世界的例子中，会提供自主体的位置、健康和饥饿度、附近是否有捕食者、最近的食物在哪里等信息。这些信息也就是所谓的“特征”。


    '
  toc: []
- raw: 'ALE则是直接提供屏幕像素，信息更多，但是更底层，也更难使用。除此之外没有其他信息。每个游戏都不同，不仅规则不同，像素转换为可用信息的方式也不同。一个被扔进新游戏的学习系统必须从零开始算出所有东西：当我得分时，这里的像素会闪烁，我挂掉之后那里又会出现那样的像素，我把游戏杆向左推时中间的这些像素会向左移动——哦，也许这就是**我**。要么研究人员必须预先找到在屏幕上提取有用特征的通用方法——这样就能应用于所有60个游戏——要么所有的理解和意义构建都必须由系统即时生成。这就是“特征构建”问题。


    贝勒马尔开始尝试将一系列特征构建算法嵌入标准的强化学习系统中，并让它们开始游戏，结果不怎么样。不过，令他惊讶的是，这个研究很容易发论文，可能是因为评审专家对创建ALE的工作印象深刻。“有趣的是，”他说，“当时评审专家告诉我，‘不错，你用街机游戏做了一件了不起的事情。我没法拒稿’。……它太大了……相比之下结果好坏已经不重要了。人们只会说，‘哇。你真的做到了’”。


    他和同事们可以说是堆出了一座山，现在该由这个领域的专家来想办法爬山了。


    2013年贝勒马尔获得了博士学位，并从埃德蒙顿搬到伦敦加入了DeepMind。 ^([^(392)](#fn392))


    他回忆道：“这个团队说，嘿，我们有一些卷积神经网络很擅长图像分类。嗯，能不能用卷积网络替代你那个不成熟的特征构建机制？”


    贝勒马尔不看好。“实际上我很长一段时间都不看好……感知强化学习的想法非常非常奇怪。而且，你知道，对神经网络的能力范围存在合理的怀疑。”


    但对这件事，贝勒马尔很快也会改变看法。


    将深度学习融入经典的强化学习算法后，姆尼用7款雅达利游戏进行了测试，在其中6款游戏击败了之前最厉害的强化学习算法。不仅如此，其中有3款游戏，他们的程序似乎能和人类玩家相媲美。他们在2013年末的一篇会议论文中报告了进展。
    ^([^(393)](#fn393))


    “论文引入深度学习解决了强化学习领域长时间无法解决的问题：即时生成特征。你可以在任何游戏中使用它，都适用。就这样……”


    贝勒马尔略微停顿了一下：“它起飞了。”


    **深度强化学习的超人表现**


    2015年2月，《自然》杂志刊出了一篇封面文章，题为《学习曲线：自学的AI软件玩视频游戏的表现媲美人类》。 ^([^(394)](#fn394))


    这种模型——被称为“深度Q网络”，简称DQN——玩《小钢珠》游戏的得分是专业的人类游戏测试员的25倍。玩《拳击》比人类表现好17倍。玩《打砖块》好13倍。《自然》杂志的文章中用一张表格列举了DQN取得的令人瞠目结舌的压倒性优势，占了几乎整整一页，玩所有游戏都使用同一个通用模型，不用更改或微调就能玩各种游戏。


    然而，在表格底部，有一些顽固的游戏拒绝向DQN屈服。其中一个特别显眼，位于表格最底部。


    特立独行的是《蒙特祖玛的复仇》，1984年发行的游戏，主角是一个名叫巴拿马·乔的探险者，他必须穿过一座神庙，到处都是绳子、梯子和致命且非常隐蔽的阿兹特克陷阱。\[“我对蒙特祖玛和阿兹特克文化没有任何研究，”设计者罗伯特·耶格（Robert Jaeger）承认——他把这个游戏卖给帕克兄弟时才16岁——“我其实只是觉得这个主题很有意思，名字也很酷。”\]
    ^([^(395)](#fn395))


    怎么回事？


    一个原因是在这个游戏中**非常**容易挂掉。几乎任何错误——碰到敌人，从太高的地方跳下，碰到挡墙——都必死无疑。DQN系统使用了ε-贪婪探索，即有一定的概率随机按按钮来了解哪些动作会带来奖励。在《蒙特祖玛的复仇》中，这几乎是不断自杀。


    第二个也是更重要的原因是，在《蒙特祖玛的复仇》中，得分点少得可怜。在玩家得分之前，需要做很多事情。在《越狱》或《太空入侵者》这样的游戏中，即使是从没玩过的新手，随机按按钮，也能很快意识到自己多少做对了一些事情。这足以启动学习过程：对这类游戏，DQN能得分，并逐渐学会对类似情况采取类似行动。相比之下，在《蒙特祖玛的复仇》中，除了死亡之外，很少有事件能提供反馈。例如，第一关，在拿到第一个道具之前，你要跳过4个裂缝，爬3个梯子，逆向跑过一条传送带，抓住一条绳子，跳过一个滚动的头骨，拿到道具后才会奖励可怜的100分（以及很不合时宜的《蟑螂歌》的前5个音符）。


    在奖励很少的环境中，随机探索的算法无法立足；通过随意拨动操纵杆和按按钮，做对**所有**必要步骤获得第一个奖励，基本上没有可能。而如果没有得分，它无法知道自己是否走上了正确道路。
    ^([^(396)](#fn396))


    上一章曾讲到，应对稀疏问题的一个办法是**塑造**：用额外的奖励推动算法朝正确方向前进。但我们也看到了要确保不会有算法可以利用的漏洞有多困难。例如，如果每过1秒钟只要巴拿马·乔**没**死就奖励他，可能会导致自主体学会永远不要离开安全的出发平台。那将是动物研究人员所说的“习得性无助”的机器版本。
    ^([^(397)](#fn397))


    其他类似的想法也行不通。比方说，在巴拿马·乔成功跳过滚动的头骨时给予奖励，可能会让自主体在头骨上跳来跳去，而不是冒险深入虎穴。同样，在他成功跳上或跳下绳子时给予奖励也会激励他像人猿泰山一样荡来荡去。这些都不是我们想要的。


    此外，塑造奖励通常因游戏而异，并且需要了解特定游戏通关技巧的人类监督者帮忙设置。这有点像作弊。ALE背后的理念——以及DQN激动人心的成就——是用单一算法从零开始掌握几十种不同的游戏环境，只以屏幕图像和游戏得分作为输入。


    那该怎么办？面对《蒙特祖玛的复仇》这样的诅咒，像DQN这样的通用试错算法应该怎么改进？


    有一个诱人的线索藏在显眼处。人类可以在没有任何额外塑造奖励的情况下学会玩《蒙特祖玛的复仇》。人类玩家本能地**想**爬上梯子，到达远处的平台，进入下一场景。我们想知道锁着的门后面是什么，神庙到底有多大，以及外面还有什么。不是因为我们凭直觉知道这样会得“分”，而是出于更纯粹、更根本的原因：我们就是想知道会发生什么。


    那么，面对《蒙特祖玛的复仇》这类奖励稀疏的游戏，也许需要的不是额外增加奖励，而是一种完全不同的方法。也许答案正相反，与其创建更复杂的胡萝卜加大棒系统，不如设计受**内在**而非外在动机驱动的自主体。
    ^([^(398)](#fn398))


    在过去几年，科学对好奇心这个主题的兴趣大增，机器学习研究人员和研究儿童认知的心理学专家之间也出现了以前不太可能的合作，目的是从更精确、更基础的角度更好地理解好奇心。到底什么是好奇心？为什么我们会有好奇心？我们如何才能将好奇心不仅仅是赋予我们的孩子，还赋予机器？


    为什么这变得越来越重要？


    **好奇心是一门科学**


    “渴望”知道为什么和怎么做，“好奇”……是一种心灵的欲望，通过不断和不知疲倦的知识产出获得的持久喜悦，超越了任何短暂激烈的肉体快乐。


    ——托马斯·霍布斯（Thomas Hobbes） ^([^(399)](#fn399))


    好奇心是所有科学的开端。


    ——司马贺（Herbert A. Simon） ^([^(400)](#fn400))


    丹尼尔·伯莱因（Daniel Berlyne）是心理学好奇心研究的教父。1949年，伯莱因发表的第一篇文章就是试图定义，当我们说某件事“有趣”，或者一个人或动物对某件事“感兴趣”时，我们到底是在说什么。
    ^([^(401)](#fn401))


    一个完备的子领域逐渐成形。动物在**没有**任何奖励的情况下是怎样学习的？


    伯莱因指出，心理学的历史在很大程度上是人和动物**被迫**做事的故事：填写调查问卷或口头回答问题，按下杠杆获得食物。这种模式使得该领域存在方法盲区。心理学居然还想研究生物如何自主行动的问题？从专业角度来看，这几乎是矛盾的。


    “在某种程度上，人类如此乐于助人和顺从是心理学的不幸，”他写道， ^([^(402)](#fn402))


    在心理学中，到20世纪中期，用奖惩训练动物的研究占据了主导地位，一度似乎可以解释关于智能生物行为的一切。但是有些数据无法解释。1950年，威斯康星大学的哈利·哈洛（Harry Harlow）观察恒河猴玩由锁和闩组成的物理拼图，他创造了“内在动机”一词来描述它。
    ^([^(403)](#fn403))


    然而，正如伯莱因认识到的，这种内在动机，就像对食物和性的追求一样，是人性的核心——尽管“多年来被心理学过度忽视了”。 ^([^(404)](#fn404))


    生活中的好奇心对伯莱因的驱使似乎和做研究一样强烈。他至少懂10种语言（其中流利的有六七种），钢琴造诣很深，还热衷慢跑和旅行。在52岁英年早逝时，他正在尝试坐遍全世界的地铁。尽管著述量惊人，但他很少在晚上或周末工作，他还有很多其他事情要做。
    ^([^(405)](#fn405))


    他的想法，尤其是向神经科学和信息论寻求线索的提议，将会激励20世纪下半叶的几代心理学家，在21世纪，他们将回到这里。从21世纪00年代末开始，一直持续到21世纪10年代的深度学习热潮，数学家、信息论专家和计算机科学家——在《蒙特祖玛的复仇》这样的例子中，他们一直在研究内在动机的问题——会在**他的**想法中寻找启发。


    他认为，从广义上讲，人类的内在动机似乎包含3种相关但不同的驱动力：追求新奇、惊讶和掌控。其中每一个都提供了关于动机和学习的诱人想法，在这10年里，人们发现，这些想法既适用于我们自己，似乎同样也适用于机器。


    **新奇**


    设计实验时想要回答的问题经常是“这种动物会对这种刺激做出什么反应？”……一旦实验情况变得复杂……一个新问题出现了：“这种动物会对哪种刺激产生反应？”


    ——丹尼尔·伯莱因 ^([^(406)](#fn406))


    左右为难时，我通常会选择那个从未尝试过的。


    ——梅·韦斯特（Mae West） ^([^(407)](#fn407))


    新奇是人类好奇心和内在动机的核心概念之一。在缺乏强有力的激励的情况下，我们并不会像使用ε-贪婪探索的简单强化学习者那样随机行动。相反，我们非常稳健可靠、可预见地被新事物吸引。


    20世纪60年代中期，凯斯西储大学的罗伯特·范茨（Robert Fantz）注意到，如果给人类婴儿展示已经看过的杂志图片，他们的目光停留在图片上的时间会减少。
    ^([^(408)](#fn408))


    婴儿观察新事物的强烈偏好，被心理学家利用来测试婴儿的视觉辨别能力，甚至**记忆力**。 ^([^(409)](#fn409))


    强化学习领域很快就注意到了这种内在新奇偏好的想法，并意识到了在计算领域可以用它来做什么。 ^([^(410)](#fn410))


    然而，这里面有一个明显缺陷。计算在某种情形下采取“某种行动”的次数是什么意思？正如伯莱因在1960年说的：“‘新’这个词常用于日常语言，似乎很容易理解。但如果想明确一个刺激模式是新奇的，以及它有多新奇到底意味着什么，就会面临一连串的陷阱和困境。”
    ^([^(411)](#fn411))


    对于像走迷宫之类的简单环境，当然可以直接记录遇到的每一个情形，并在每次遇到同样情形时计数。（用铅笔描绘走迷宫的路径就是将这个数据直接记录在迷宫上。）这种方法——保存一张巨大的表格，记录经历的每种情况、做过的事情和发生的事情——被称为“表格式”强化学习，不幸的是，除了非常小的环境，对其他环境完全不可行。例如井字棋可能是最简单的棋盘游戏，但也有上千种独特的棋局。
    ^([^(412)](#fn412))


    然而，除了实际可行性之外，在更复杂的环境中，还有更深、更哲学的问题：处于“同样”的情形是什么意思？例如，在雅达利游戏中，像素的组合方式太多了，详尽记录遇到的每帧画面，并据此略微偏好新的画面，对产生有趣的行为没有任何帮助。对于复杂一点的游戏，你不太可能多次遇到完全相同的像素组合。从这个角度来看，几乎每个场景都是新奇的，几乎每个动作都未曾尝试过。即使你能存储这样一张表，也没什么指导意义。


    在人类日常决策中，当有人说，他们“以前从未遇到过这种情况”，我们通常不会把这句话理解为“在这个精确的地点，在这个精确的时间，这个精确的光斑图案击中了我的视网膜，这个精确的思维序列出现在我的大脑里”，否则这句话总是正确的，没有任何意义。我们指的是情境的**关键**特征，有时无法言说，我们据此来判断它的新奇性。


    在一款雅达利游戏中，我们想要的是以某种方式衡量，我们所处的情形——由屏幕上的像素表示——是否与我们之前所处的情形在某种意义上存在相似性。我们想将有更深层相似性的情形关联起来。


    记录你见过某种情形多少次，这种“基于计数”的方法很被看好，但又不好操作。在伦敦的DeepMind，贝勒马尔想知道如何才能将这种方法推广到更复杂的环境中。在像《青蛙过街》或《过马路》这类雅达利游戏中，你试图穿过一条繁忙的道路，理想情况是，每次你成功过去时，都应该增加某种“计数”，记录你已经这样做了多少次，即使交通总是以某种新的随机模式运行。


    贝勒马尔和同事在尝试一种称为“密度模型”的数学思想，似乎看到了一些希望。 ^([^(413)](#fn413))


    他们用20世纪80年代早期的一款名为《Q伯特》的雅达利游戏做实验。在这个游戏中，你绕着一个由方砖组成的金字塔跳跃，把每块砖都变成不同的颜色，然后再进入全新的、不同颜色的下一关，在下一关你又可以做同样的事情。他们让一个随机初始化的、空白的DQN自主体从头开始玩《Q伯特》，屏幕左侧有一个面板实时显示自主体体验到的“新奇感”，用密度模型衡量。


    起初——就像我们一样——一切都是新的。面板停留在最大值。每一帧画面都被认为几乎是全新的。


    他们对自主体进行了几个小时的训练，使其逐渐变得更擅长得分（在《Q伯特》中，它每翻一块砖就能得25分）。他们让自主体重新登入，然后在一旁看它怎么玩。现在有了经验的自主体四处走动，获取积分。度量新奇感的绿条（专业术语“负对数概率”）几乎不会闪烁。自主体以前都见过。


    贝勒马尔发现自主体第一次过第一关时训练过程启动了。他看了重播，想明确发生了什么。不出所料，当自主体快过关时，绿条升起来了。


    “现在，”贝勒马尔说，“当自主体快过关时，它会说，**嘿，这些情形很新奇！我从未体验过。这对我来说很新奇。**这是非常好的进展：随着越来越接近过关，这个信号越来越强。”
    ^([^(414)](#fn414))


    自主体跳到最后一块砖，第一次完成这一关。突然，屏幕闪烁起来。棋盘重置为下一关，青砖金字塔消失了，取而代之的是全新的亮橙色金字塔。“看这个！”贝勒马尔说。绿条一路高歌猛进。新奇的信号几乎爆表。“自主体马上意识到，**我从未来过这里。”**


    密度模型似乎捕捉到了纷繁复杂的环境中的新奇性，这些环境太大、太丰富了，无法直接计算。“我们看着结果，心想**一定**能做些什么。”


    他们称这个模型为“伪计数”。现在的问题是，他们能利用伪计数激励自主体**寻找**新奇状态吗？ ^([^(415)](#fn415))


    很明显，如果他们成功了，回报会是什么。“我们迫不及待，”他说，“想尝试破解《蒙特祖玛的复仇》。”


    困住巴拿马·乔的神庙有24个场景。在相当于没日没夜玩了3个星期游戏后，在其他几十种雅达利游戏中表现出超人能力的DQN自主体只到了**第2关**——几乎还停留在起跑线。有一整个神庙等待被探索，充满危险；如果自主体看到以前没见过的东西能获得奖励，也许就能到达其他自主体没去过的地方。


    贝勒马尔和他的团队猜测，一个能感知新奇的自主体，如果把新奇感当作游戏分数的补充奖励，会更有动力，玩游戏会更成功。他们进行了尝试，并让它像之前的DQN自主体一样训练同样长的时间，1亿帧，3周的时长。表现差异令人震惊。


    同样的DQN自主体接受了基于新奇奖励的训练后，拿到第一把钥匙的速度快得惊人。它最终过了15关，而不是2关。


    新奇驱动的自主体不仅得到了更多分数，似乎还表现出了不同的行为，不仅仅是量的区别，还有质的区别。“优先注视”可以被利用来驱使它探索那些仅靠奖励做不到的区域。新奇驱动的自主体似乎更有**魅力**，甚至更人格化。当奖励稀缺时，它不仅仅是乱摇游戏杆，它有驱动力。


    贝勒马尔说：“伪计数自主体**马上**就会出去探索世界。”


    **惊讶的快乐**


    认知好奇心的机制……通过类似于概念冲突的方式起作用，它有显著的激励功能。


    ——丹尼尔·伯莱因 ^([^(416)](#fn416))


    不是说孩子是小科学家，而是说科学家是大孩子。


    ——艾莉森·高普尼克（Alison Gopnik） ^([^(417)](#fn417))


    除了新奇，与好奇心密切关联的另一个高层概念是**惊讶**。 ^([^(418)](#fn418))


    MIT的劳拉·舒尔茨（Laura Schulz）是最早研究惊讶在人类好奇心中的作用的人之一。在2007年的一项研究中，她让儿童玩盒子里的小丑之类的玩具，杠杆会打开盖子把玩偶从盒子里举起来。
    ^([^(419)](#fn419))


    “关于儿童的玩耍和好奇心，以前我们只知道，”舒尔茨解释道，“嗯，如果4岁的孩子已经玩了一段时间一个盒子，那么当你拿出一个新盒子，他们应该会喜欢这个新盒子。他们应该马上会去玩新盒子，因为关于好奇心的基本思想是它是**感知**到的新奇感，感知到的显著性：这个东西他们没见过。”
    ^([^(420)](#fn420))


    但舒尔茨发现，事情没那么简单。在一些试验中，第一个盒子的展示被故意弄得模糊不清。这个盒子有两个杠杆，如果两个都按下，两个不同的玩偶会同时从盒子中升起。但是不演示单独按下一个杠杆会有什么作用。一个杠杆负责所有玩偶，另一个不起作用？还是杠杆对应自己这边的玩偶？还是对面的那个？面对模糊不清的情形，如果有机会，4岁的孩子**不会**立刻从原来的玩具换到新奇的玩具。他们会继续玩那个双杠杆盒子，弄清楚它到底是怎么工作的。


    “对于并不特别新奇的事物，只要让我们感到困惑，我们经常也会很好奇。”舒尔茨说。 ^([^(421)](#fn421))


    事情开始变得清晰，**惊讶**——不确定性，排除歧义，获取信息——同新奇一样，也是儿童内在动机的驱动因素。


    这启发了另一条研究脉络，同样丰富，跨越认知和计算。


    舒尔茨和罗格斯大学的心理学家伊丽莎白·博纳维茨（Elizabeth Bonawitz）以及一群合作者一起，进一步使用配重积木块进行了研究。之前的研究表明，大约在6岁时，儿童就开始有了如何最好地平衡不同大小和形状的积木的理论。6岁的一些孩子（错误地）认为，即使积木不对称，也总能在中间位置保持平衡，而另一些孩子（正确地）推断，积木在**质心**处，在更靠近厚边的地方保持平衡。这启发了研究人员使用磁铁制造积木，这些积木可以被很巧妙地制造成与这两种假设都不相符。如果孩子们玩的积木和他们预想的一样，他们标准的新奇偏好会悄悄潜入，如果有新玩具，他们会放弃手中的积木，选择新玩具。但如果他们感到手中的积木似乎**违反**了他们关于积木应该如何平衡的理论——不管他们的理论是否正确！——他们会保持专注，继续玩这个积木，即使可以换新玩具。
    ^([^(422)](#fn422))'
  fmt: '

    # 特征构建与内在动机


    ## 特征构建问题

    ALE则是直接提供屏幕像素，信息更多，但是更底层，也更难使用。除此之外没有其他信息。每个游戏都不同，不仅规则不同，像素转换为可用信息的方式也不同。一个被扔进新游戏的学习系统必须从零开始算出所有东西：当我得分时，这里的像素会闪烁，我挂掉之后那里又会出现那样的像素，我把游戏杆向左推时中间的这些像素会向左移动——哦，也许这就是**我**。要么研究人员必须预先找到在屏幕上提取有用特征的通用方法——这样就能应用于所有60个游戏——要么所有的理解和意义构建都必须由系统即时生成。这就是“特征构建”问题。


    贝勒马尔开始尝试将一系列特征构建算法嵌入标准的强化学习系统中，并让它们开始游戏，结果不怎么样。不过，令他惊讶的是，这个研究很容易发论文，可能是因为评审专家对创建ALE的工作印象深刻。“有趣的是，”他说，“当时评审专家告诉我，‘不错，你用街机游戏做了一件了不起的事情。我没法拒稿’。……它太大了……相比之下结果好坏已经不重要了。人们只会说，‘哇。你真的做到了’”。


    他和同事们可以说是堆出了一座山，现在该由这个领域的专家来想办法爬山了。


    2013年贝勒马尔获得了博士学位，并从埃德蒙顿搬到伦敦加入了DeepMind。 ^([^(392)](#fn392))


    他回忆道：“这个团队说，嘿，我们有一些卷积神经网络很擅长图像分类。嗯，能不能用卷积网络替代你那个不成熟的特征构建机制？”


    贝勒马尔不看好。“实际上我很长一段时间都不看好……感知强化学习的想法非常非常奇怪。而且，你知道，对神经网络的能力范围存在合理的怀疑。”


    但对这件事，贝勒马尔很快也会改变看法。


    将深度学习融入经典的强化学习算法后，姆尼用7款雅达利游戏进行了测试，在其中6款游戏击败了之前最厉害的强化学习算法。不仅如此，其中有3款游戏，他们的程序似乎能和人类玩家相媲美。他们在2013年末的一篇会议论文中报告了进展。
    ^([^(393)](#fn393))


    “论文引入深度学习解决了强化学习领域长时间无法解决的问题：即时生成特征。你可以在任何游戏中使用它，都适用。就这样……”


    贝勒马尔略微停顿了一下：“它起飞了。”


    ## 深度强化学习的超人表现

    2015年2月，《自然》杂志刊出了一篇封面文章，题为《学习曲线：自学的AI软件玩视频游戏的表现媲美人类》。 ^([^(394)](#fn394))


    这种模型——被称为“深度Q网络”，简称DQN——玩《小钢珠》游戏的得分是专业的人类游戏测试员的25倍。玩《拳击》比人类表现好17倍。玩《打砖块》好13倍。《自然》杂志的文章中用一张表格列举了DQN取得的令人瞠目结舌的压倒性优势，占了几乎整整一页，玩所有游戏都使用同一个通用模型，不用更改或微调就能玩各种游戏。


    然而，在表格底部，有一些顽固的游戏拒绝向DQN屈服。其中一个特别显眼，位于表格最底部。


    特立独行的是《蒙特祖玛的复仇》，1984年发行的游戏，主角是一个名叫巴拿马·乔的探险者，他必须穿过一座神庙，到处都是绳子、梯子和致命且非常隐蔽的阿兹特克陷阱。\[“我对蒙特祖玛和阿兹特克文化没有任何研究，”设计者罗伯特·耶格（Robert
    Jaeger）承认——他把这个游戏卖给帕克兄弟时才16岁——“我其实只是觉得这个主题很有意思，名字也很酷。”\] ^([^(395)](#fn395))


    怎么回事？


    一个原因是在这个游戏中**非常**容易挂掉。几乎任何错误——碰到敌人，从太高的地方跳下，碰到挡墙——都必死无疑。DQN系统使用了ε-贪婪探索，即有一定的概率随机按按钮来了解哪些动作会带来奖励。在《蒙特祖玛的复仇》中，这几乎是不断自杀。


    第二个也是更重要的原因是，在《蒙特祖玛的复仇》中，得分点少得可怜。在玩家得分之前，需要做很多事情。在《越狱》或《太空入侵者》这样的游戏中，即使是从没玩过的新手，随机按按钮，也能很快意识到自己多少做对了一些事情。这足以启动学习过程：对这类游戏，DQN能得分，并逐渐学会对类似情况采取类似行动。相比之下，在《蒙特祖玛的复仇》中，除了死亡之外，很少有事件能提供反馈。例如，第一关，在拿到第一个道具之前，你要跳过4个裂缝，爬3个梯子，逆向跑过一条传送带，抓住一条绳子，跳过一个滚动的头骨，拿到道具后才会奖励可怜的100分（以及很不合时宜的《蟑螂歌》的前5个音符）。


    在奖励很少的环境中，随机探索的算法无法立足；通过随意拨动操纵杆和按按钮，做对**所有**必要步骤获得第一个奖励，基本上没有可能。而如果没有得分，它无法知道自己是否走上了正确道路。
    ^([^(396)](#fn396))


    上一章曾讲到，应对稀疏问题的一个办法是**塑造**：用额外的奖励推动算法朝正确方向前进。但我们也看到了要确保不会有算法可以利用的漏洞有多困难。例如，如果每过1秒钟只要巴拿马·乔**没**死就奖励他，可能会导致自主体学会永远不要离开安全的出发平台。那将是动物研究人员所说的“习得性无助”的机器版本。
    ^([^(397)](#fn397))


    其他类似的想法也行不通。比方说，在巴拿马·乔成功跳过滚动的头骨时给予奖励，可能会让自主体在头骨上跳来跳去，而不是冒险深入虎穴。同样，在他成功跳上或跳下绳子时给予奖励也会激励他像人猿泰山一样荡来荡去。这些都不是我们想要的。


    此外，塑造奖励通常因游戏而异，并且需要了解特定游戏通关技巧的人类监督者帮忙设置。这有点像作弊。ALE背后的理念——以及DQN激动人心的成就——是用单一算法从零开始掌握几十种不同的游戏环境，只以屏幕图像和游戏得分作为输入。


    那该怎么办？面对《蒙特祖玛的复仇》这样的诅咒，像DQN这样的通用试错算法应该怎么改进？


    有一个诱人的线索藏在显眼处。人类可以在没有任何额外塑造奖励的情况下学会玩《蒙特祖玛的复仇》。人类玩家本能地**想**爬上梯子，到达远处的平台，进入下一场景。我们想知道锁着的门后面是什么，神庙到底有多大，以及外面还有什么。不是因为我们凭直觉知道这样会得“分”，而是出于更纯粹、更根本的原因：我们就是想知道会发生什么。


    那么，面对《蒙特祖玛的复仇》这类奖励稀疏的游戏，也许需要的不是额外增加奖励，而是一种完全不同的方法。也许答案正相反，与其创建更复杂的胡萝卜加大棒系统，不如设计受**内在**而非外在动机驱动的自主体。
    ^([^(398)](#fn398))


    在过去几年，科学对好奇心这个主题的兴趣大增，机器学习研究人员和研究儿童认知的心理学专家之间也出现了以前不太可能的合作，目的是从更精确、更基础的角度更好地理解好奇心。到底什么是好奇心？为什么我们会有好奇心？我们如何才能将好奇心不仅仅是赋予我们的孩子，还赋予机器？


    为什么这变得越来越重要？


    ## 好奇心是一门科学

    “渴望”知道为什么和怎么做，“好奇”……是一种心灵的欲望，通过不断和不知疲倦的知识产出获得的持久喜悦，超越了任何短暂激烈的肉体快乐。


    ——托马斯·霍布斯（Thomas Hobbes） ^([^(399)](#fn399))


    好奇心是所有科学的开端。


    ——司马贺（Herbert A. Simon） ^([^(400)](#fn400))


    丹尼尔·伯莱因（Daniel Berlyne）是心理学好奇心研究的教父。1949年，伯莱因发表的第一篇文章就是试图定义，当我们说某件事“有趣”，或者一个人或动物对某件事“感兴趣”时，我们到底是在说什么。
    ^([^(401)](#fn401))


    一个完备的子领域逐渐成形。动物在**没有**任何奖励的情况下是怎样学习的？


    伯莱因指出，心理学的历史在很大程度上是人和动物**被迫**做事的故事：填写调查问卷或口头回答问题，按下杠杆获得食物。这种模式使得该领域存在方法盲区。心理学居然还想研究生物如何自主行动的问题？从专业角度来看，这几乎是矛盾的。


    “在某种程度上，人类如此乐于助人和顺从是心理学的不幸，”他写道， ^([^(402)](#fn402))


    在心理学中，到20世纪中期，用奖惩训练动物的研究占据了主导地位，一度似乎可以解释关于智能生物行为的一切。但是有些数据无法解释。1950年，威斯康星大学的哈利·哈洛（Harry
    Harlow）观察恒河猴玩由锁和闩组成的物理拼图，他创造了“内在动机”一词来描述它。 ^([^(403)](#fn403))


    然而，正如伯莱因认识到的，这种内在动机，就像对食物和性的追求一样，是人性的核心——尽管“多年来被心理学过度忽视了”。 ^([^(404)](#fn404))


    生活中的好奇心对伯莱因的驱使似乎和做研究一样强烈。他至少懂10种语言（其中流利的有六七种），钢琴造诣很深，还热衷慢跑和旅行。在52岁英年早逝时，他正在尝试坐遍全世界的地铁。尽管著述量惊人，但他很少在晚上或周末工作，他还有很多其他事情要做。
    ^([^(405)](#fn405))


    他的想法，尤其是向神经科学和信息论寻求线索的提议，将会激励20世纪下半叶的几代心理学家，在21世纪，他们将回到这里。从21世纪00年代末开始，一直持续到21世纪10年代的深度学习热潮，数学家、信息论专家和计算机科学家——在《蒙特祖玛的复仇》这样的例子中，他们一直在研究内在动机的问题——会在**他的**想法中寻找启发。


    他认为，从广义上讲，人类的内在动机似乎包含3种相关但不同的驱动力：追求新奇、惊讶和掌控。其中每一个都提供了关于动机和学习的诱人想法，在这10年里，人们发现，这些想法既适用于我们自己，似乎同样也适用于机器。


    ## 新奇

    设计实验时想要回答的问题经常是“这种动物会对这种刺激做出什么反应？”……一旦实验情况变得复杂……一个新问题出现了：“这种动物会对哪种刺激产生反应？”


    ——丹尼尔·伯莱因 ^([^(406)](#fn406))


    左右为难时，我通常会选择那个从未尝试过的。


    ——梅·韦斯特（Mae West） ^([^(407)](#fn407))


    新奇是人类好奇心和内在动机的核心概念之一。在缺乏强有力的激励的情况下，我们并不会像使用ε-贪婪探索的简单强化学习者那样随机行动。相反，我们非常稳健可靠、可预见地被新事物吸引。


    20世纪60年代中期，凯斯西储大学的罗伯特·范茨（Robert Fantz）注意到，如果给人类婴儿展示已经看过的杂志图片，他们的目光停留在图片上的时间会减少。
    ^([^(408)](#fn408))


    婴儿观察新事物的强烈偏好，被心理学家利用来测试婴儿的视觉辨别能力，甚至**记忆力**。 ^([^(409)](#fn409))


    强化学习领域很快就注意到了这种内在新奇偏好的想法，并意识到了在计算领域可以用它来做什么。 ^([^(410)](#fn410))


    然而，这里面有一个明显缺陷。计算在某种情形下采取“某种行动”的次数是什么意思？正如伯莱因在1960年说的：“‘新’这个词常用于日常语言，似乎很容易理解。但如果想明确一个刺激模式是新奇的，以及它有多新奇到底意味着什么，就会面临一连串的陷阱和困境。”
    ^([^(411)](#fn411))


    对于像走迷宫之类的简单环境，当然可以直接记录遇到的每一个情形，并在每次遇到同样情形时计数。（用铅笔描绘走迷宫的路径就是将这个数据直接记录在迷宫上。）这种方法——保存一张巨大的表格，记录经历的每种情况、做过的事情和发生的事情——被称为“表格式”强化学习，不幸的是，除了非常小的环境，对其他环境完全不可行。例如井字棋可能是最简单的棋盘游戏，但也有上千种独特的棋局。
    ^([^(412)](#fn412))


    然而，除了实际可行性之外，在更复杂的环境中，还有更深、更哲学的问题：处于“同样”的情形是什么意思？例如，在雅达利游戏中，像素的组合方式太多了，详尽记录遇到的每帧画面，并据此略微偏好新的画面，对产生有趣的行为没有任何帮助。对于复杂一点的游戏，你不太可能多次遇到完全相同的像素组合。从这个角度来看，几乎每个场景都是新奇的，几乎每个动作都未曾尝试过。即使你能存储这样一张表，也没什么指导意义。


    在人类日常决策中，当有人说，他们“以前从未遇到过这种情况”，我们通常不会把这句话理解为“在这个精确的地点，在这个精确的时间，这个精确的光斑图案击中了我的视网膜，这个精确的思维序列出现在我的大脑里”，否则这句话总是正确的，没有任何意义。我们指的是情境的**关键**特征，有时无法言说，我们据此来判断它的新奇性。


    在一款雅达利游戏中，我们想要的是以某种方式衡量，我们所处的情形——由屏幕上的像素表示——是否与我们之前所处的情形在某种意义上存在相似性。我们想将有更深层相似性的情形关联起来。


    记录你见过某种情形多少次，这种“基于计数”的方法很被看好，但又不好操作。在伦敦的DeepMind，贝勒马尔想知道如何才能将这种方法推广到更复杂的环境中。在像《青蛙过街》或《过马路》这类雅达利游戏中，你试图穿过一条繁忙的道路，理想情况是，每次你成功过去时，都应该增加某种“计数”，记录你已经这样做了多少次，即使交通总是以某种新的随机模式运行。


    贝勒马尔和同事在尝试一种称为“密度模型”的数学思想，似乎看到了一些希望。 ^([^(413)](#fn413))


    他们用20世纪80年代早期的一款名为《Q伯特》的雅达利游戏做实验。在这个游戏中，你绕着一个由方砖组成的金字塔跳跃，把每块砖都变成不同的颜色，然后再进入全新的、不同颜色的下一关，在下一关你又可以做同样的事情。他们让一个随机初始化的、空白的DQN自主体从头开始玩《Q伯特》，屏幕左侧有一个面板实时显示自主体体验到的“新奇感”，用密度模型衡量。


    起初——就像我们一样——一切都是新的。面板停留在最大值。每一帧画面都被认为几乎是全新的。


    他们对自主体进行了几个小时的训练，使其逐渐变得更擅长得分（在《Q伯特》中，它每翻一块砖就能得25分）。他们让自主体重新登入，然后在一旁看它怎么玩。现在有了经验的自主体四处走动，获取积分。度量新奇感的绿条（专业术语“负对数概率”）几乎不会闪烁。自主体以前都见过。


    贝勒马尔发现自主体第一次过第一关时训练过程启动了。他看了重播，想明确发生了什么。不出所料，当自主体快过关时，绿条升起来了。


    “现在，”贝勒马尔说，“当自主体快过关时，它会说，**嘿，这些情形很新奇！我从未体验过。这对我来说很新奇。**这是非常好的进展：随着越来越接近过关，这个信号越来越强。”
    ^([^(414)](#fn414))


    自主体跳到最后一块砖，第一次完成这一关。突然，屏幕闪烁起来。棋盘重置为下一关，青砖金字塔消失了，取而代之的是全新的亮橙色金字塔。“看这个！”贝勒马尔说。绿条一路高歌猛进。新奇的信号几乎爆表。“自主体马上意识到，**我从未来过这里。”**


    密度模型似乎捕捉到了纷繁复杂的环境中的新奇性，这些环境太大、太丰富了，无法直接计算。“我们看着结果，心想**一定**能做些什么。”


    他们称这个模型为“伪计数”。现在的问题是，他们能利用伪计数激励自主体**寻找**新奇状态吗？ ^([^(415)](#fn415))


    很明显，如果他们成功了，回报会是什么。“我们迫不及待，”他说，“想尝试破解《蒙特祖玛的复仇》。”


    困住巴拿马·乔的神庙有24个场景。在相当于没日没夜玩了3个星期游戏后，在其他几十种雅达利游戏中表现出超人能力的DQN自主体只到了**第2关**——几乎还停留在起跑线。有一整个神庙等待被探索，充满危险；如果自主体看到以前没见过的东西能获得奖励，也许就能到达其他自主体没去过的地方。


    贝勒马尔和他的团队猜测，一个能感知新奇的自主体，如果把新奇感当作游戏分数的补充奖励，会更有动力，玩游戏会更成功。他们进行了尝试，并让它像之前的DQN自主体一样训练同样长的时间，1亿帧，3周的时长。表现差异令人震惊。


    同样的DQN自主体接受了基于新奇奖励的训练后，拿到第一把钥匙的速度快得惊人。它最终过了15关，而不是2关。


    新奇驱动的自主体不仅得到了更多分数，似乎还表现出了不同的行为，不仅仅是量的区别，还有质的区别。“优先注视”可以被利用来驱使它探索那些仅靠奖励做不到的区域。新奇驱动的自主体似乎更有**魅力**，甚至更人格化。当奖励稀缺时，它不仅仅是乱摇游戏杆，它有驱动力。


    贝勒马尔说：“伪计数自主体**马上**就会出去探索世界。”


    ## 惊讶的快乐

    认知好奇心的机制……通过类似于概念冲突的方式起作用，它有显著的激励功能。


    ——丹尼尔·伯莱因 ^([^(416)](#fn416))


    不是说孩子是小科学家，而是说科学家是大孩子。


    ——艾莉森·高普尼克（Alison Gopnik） ^([^(417)](#fn417))


    除了新奇，与好奇心密切关联的另一个高层概念是**惊讶**。 ^([^(418)](#fn418))


    MIT的劳拉·舒尔茨（Laura Schulz）是最早研究惊讶在人类好奇心中的作用的人之一。在2007年的一项研究中，她让儿童玩盒子里的小丑之类的玩具，杠杆会打开盖子把玩偶从盒子里举起来。
    ^([^(419)](#fn419))


    “关于儿童的玩耍和好奇心，以前我们只知道，”舒尔茨解释道，“嗯，如果4岁的孩子已经玩了一段时间一个盒子，那么当你拿出一个新盒子，他们应该会喜欢这个新盒子。他们应该马上会去玩新盒子，因为关于好奇心的基本思想是它是**感知**到的新奇感，感知到的显著性：这个东西他们没见过。”
    ^([^(420)](#fn420))


    但舒尔茨发现，事情没那么简单。在一些试验中，第一个盒子的展示被故意弄得模糊不清。这个盒子有两个杠杆，如果两个都按下，两个不同的玩偶会同时从盒子中升起。但是不演示单独按下一个杠杆会有什么作用。一个杠杆负责所有玩偶，另一个不起作用？还是杠杆对应自己这边的玩偶？还是对面的那个？面对模糊不清的情形，如果有机会，4岁的孩子**不会**立刻从原来的玩具换到新奇的玩具。他们会继续玩那个双杠杆盒子，弄清楚它到底是怎么工作的。


    “对于并不特别新奇的事物，只要让我们感到困惑，我们经常也会很好奇。”舒尔茨说。 ^([^(421)](#fn421))


    事情开始变得清晰，**惊讶**——不确定性，排除歧义，获取信息——同新奇一样，也是儿童内在动机的驱动因素。


    这启发了另一条研究脉络，同样丰富，跨越认知和计算。


    舒尔茨和罗格斯大学的心理学家伊丽莎白·博纳维茨（Elizabeth Bonawitz）以及一群合作者一起，进一步使用配重积木块进行了研究。之前的研究表明，大约在6岁时，儿童就开始有了如何最好地平衡不同大小和形状的积木的理论。6岁的一些孩子（错误地）认为，即使积木不对称，也总能在中间位置保持平衡，而另一些孩子（正确地）推断，积木在**质心**处，在更靠近厚边的地方保持平衡。这启发了研究人员使用磁铁制造积木，这些积木可以被很巧妙地制造成与这两种假设都不相符。如果孩子们玩的积木和他们预想的一样，他们标准的新奇偏好会悄悄潜入，如果有新玩具，他们会放弃手中的积木，选择新玩具。但如果他们感到手中的积木似乎**违反**了他们关于积木应该如何平衡的理论——不管他们的理论是否正确！——他们会保持专注，继续玩这个积木，即使可以换新玩具。
    ^([^(422)](#fn422))

