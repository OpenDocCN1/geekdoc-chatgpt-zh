    ### 429

    这两部分之间的张力完美体现了阴阳平衡，纽约大学的詹姆斯·卡斯（James Carse）称之为《有限和无限的游戏》（Finite and Infinite Games）。玩有限游戏以达到最终平衡状态。玩无限游戏是为了永久延长游戏体验。有限游戏的玩家是抑制惊讶；无限游戏的玩家是追求惊讶。用卡斯的话说：“惊讶导致有限游戏结束；是无限游戏继续下去的理由。”
    著名励志演说家托尼·罗宾斯（Tony Robbins）也赞同这种追求与抑制惊讶的基本驱动力的张力关系，他阐释道：“我相信人类有6种需求……让我告诉你它们是什么。第一个：确定性……当我们以不同的方式追求确定性时，如果我们得到完全的确定性，我们会得到什么？如果你确定，你会有什么感觉？你知道会发生什么，什么时候会发生，如何发生，你会有什么感觉？无聊死了。所以上帝，以她无限的智慧，给了人类第二个需求，那就是不确定性。我们需要多样性。我们需要惊讶。”Tony
    Robbins，“Why We Do What We Do”（演讲），2006年2月，加州蒙特雷，`https：//www.ted.com/talks/tony\_robbins\_asks\_why\_we\_do\_what\_we\_do`。
    很明显，人类内在有这两种驱动力。如果所有优秀的通用强化学习者——生命和非生命——都这样做，这可能不是巧合。[↩](#fnref429)


    ### 430

    “内在好奇心模块”实际上比这更微妙和复杂，因为它被设计成只预测屏幕上用户可控的方面，为此使用了另一个“逆动力学”模型。完整的细节，参见Pathak等，“Curiosity-Driven
    Exploration by Self-Supervised Prediction”。还有一些相关的方法通过奖励“信息增益”来激励探索，参见例如，Schmidhuber，“Curious
    Model-Building Control Systems”；Stadie, Levine&Abbeel，“Incentivizing Exploration
    in Reinforcement Learning with Deep Predictive Models”；和Houthooft等，“VIME”。[↩](#fnref430)


