- raw: '


    我记得在2000年听维京火星计划的领导者詹姆士·马丁说过，他作为航天工程师的任务不是降落在火星上，而是降落在地理学家提供的火星模型上。


    ——彼得·诺维格（Peter Norvig） ^([¹](#fn1))


    世界是它自己最好的模型。


    ——罗德尼·布鲁克斯（Rodney Brooks） ^([²](#fn2))


    所有模型都是错的。


    ——乔治·博克斯（George Box） ^([³](#fn3))


    # **序篇**


    1935年，美国底特律。沃尔特·皮茨（Walter Pitts）沿街奔跑，躲避几个小混混。


    皮茨溜进了一家公共图书馆。他躲得很隐蔽，工作人员下班时都没发现他。皮茨被锁在了里面。 ^([⁴](#fn4))


    他在书架上找到一本很厚的书，很快沉浸其中，花3天时间读完了。


    书有2千多页，讲的是形式逻辑；这本书最广为人知的是到第379页才证明1+1=2。 ^([⁵](#fn5))


    几星期后，皮茨收到一封盖有英国邮戳的信，是罗素寄来的。罗素感谢了皮茨，并邀请他去剑桥攻读博士。 ^([⁶](#fn6))


    很遗憾，皮茨不得不拒绝这个提议，因为他只有12岁，才读七年级。


    3年后，皮茨得知罗素将去芝加哥做公开讲座。他决定去参加讲座，从此再也没有回家。


    ――――――


    在罗素的讲座上，皮茨遇到了一个叫杰瑞·莱文（Jerry Lettvin）的少年。皮茨热爱逻辑。莱文热爱诗歌和医学。 ^([⁷](#fn7))


    此后皮茨在芝加哥大学校园里流浪，旁听各种课程；他高中没有毕业，因此无法正式入学。他听了德国著名逻辑学家鲁道夫·卡尔纳普（Rudolf Carnap）的课。皮茨找到卡尔纳普的办公室，宣称他在新书中发现了一些“瑕疵”。卡尔纳普以怀疑的态度核对了几处，发现他是对的。他们聊了一会儿，然而在皮茨走的时候忘了问他的名字。卡尔纳普花了几个月四处打听“懂逻辑的新生”。
    ^([⁸](#fn8))


    时间来到1941年。莱文毕业了，他最爱的仍是诗歌，但还是去了伊利诺伊大学医学院，跟随刚从耶鲁过来的杰出神经学家沃伦·麦卡洛克（Warren McCulloch）做研究。莱文邀请皮茨来他这里。这一年，莱文21岁，还住在父母家。皮茨17岁，无家可归。
    ^([⁹](#fn9))


    在接下来的一年，麦卡洛克晚上回家后，经常和皮茨聊到深夜。虽然皮茨比麦卡洛克自己的孩子大不了多少，但从学识上来说，他们是完美团队：正处于职业生涯高产期的神经学家和逻辑学天才。一个擅长实践：神经系统和机能；另一个擅长理论：符号系统和证明。他们都热衷于探索真理的本质：它是什么，以及我们如何知道它。探索的支点——两个世界的完美交叉点——正是大脑。


    20世纪40年代初，科学家已经知道大脑是由神经元组成，神经元通过“输入”（树突）和“输出”（轴突）相互连接。当输入神经元的脉冲超过某个阈值时，神经元就会输出脉冲。麦卡洛克和皮茨立刻意识到了神经元与逻辑的关联：神经脉冲的有/无等同于逻辑的开/关、是/否、真/假。
    ^([^(10)](#fn10))


    他们意识到，如果一个神经元阈值很低，任何一路输入有脉冲都能触发它，其功能就会像逻辑或运算的物理实现。如果一个神经元阈值很高，只有当所有输入都有脉冲时才会触发，就会像逻辑与运算的物理实现。因此，逻辑能做到的，“神经网络”通过适当的连接也能做到。


    几个月后，中年神经学家和少年逻辑学家合写了一篇论文，题为《神经活动中内在的思维逻辑演算》。


    文中写道：“由于神经元活动的‘全有或全无’特性，神经事件以及它们之间的关系可以等同于命题逻辑。我们发现，所有神经网络的行为都可以用逻辑表达式描述……对于任何满足特定条件的逻辑表达式，也都可以找到相应的神经网络。”


    这篇论文1943年发表在《数学生物物理学通报》上。让莱文沮丧的是，它对生物学界没什么影响。 ^([^(11)](#fn11))


    但是，这篇论文——以及麦卡洛克家的深夜长谈——将产生深远影响，虽然不是完全按照麦卡洛克和皮茨设想的方式。它们为一个全新的领域打下了基础，这个领域将用这些神经元的简化版本构建实际项目，探索这种“机械大脑”的能力范围。
    ^([^(12)](#fn12))


    # **导言**


    2013年夏天，一篇平平常常的帖子出现在谷歌的开源博客上，标题是《学习词汇背后的含义》。 ^([^(13)](#fn13))


    帖子中说：“目前计算机还不太擅长理解人类语言，虽然离这个目标还有一段距离，但我们正在利用最新的机器学习和自然语言处理技术取得重大进展。”


    谷歌从纸媒和互联网获取了大量人类语言数据，比以前最大的数据集还大几千倍，将数据集输入一个受生物学启发的“神经网络”，并让系统寻找词语的相关性和联系。


    借助所谓的“无监督学习”，这个系统开始发现模式。例如，它注意到词语“北京”与“中国”的关系，同“莫斯科”与“俄罗斯”的关系一样，不管词语的意思是什么。


    能否说计算机“理解”了？这个问题只能让哲学家来回答，但是很显然系统已经抓住了它“阅读”的内容的某种本质。


    谷歌将这个系统命名为“word2vec”——意思是将词汇转换成数字向量——并将其开源。


    对数学家来说，向量有各种奇妙的性质，你可以像处理简单的数一样处理它们，进行加、减、乘运算。通过这种方式，研究人员很快发现了一些惊人的意想不到的东西。他们称之为“连续空间词汇表示中的语言规律”，
    ^([^(14)](#fn14))


    例如，如果输入中国+河流，就会得到长江。输入巴黎——法国+意大利，就会得到罗马。输入国王——男人+女人，就会得到女王。


    结果很惊人。word2vec系统开始应用于谷歌的机器翻译和搜索引擎，业界也将其广泛应用于其他领域，例如招聘，它成了科学和工程界新一代数据驱动的语言学家的必备工具。


    两年过去了，没有人意识到存在问题。


    2015年11月，波士顿大学博士生托尔加·博鲁克巴斯（Tolga Bolukbasi）和导师一起参加微软研究院周五的快乐时光会议。边喝葡萄酒边聊天的时候，他和微软研究员亚当·卡莱（Adam Kalai）拿出电脑，开始摆弄word2vec。


    “我们在玩词嵌入，随机输入词汇，”博鲁克巴斯说，“先是我在玩，然后亚当也开始玩。” ^([^(15)](#fn15))


    他们输入：


    医生——男+女


    返回的答案是：


    护士


    “我们很震惊，意识到存在问题，”卡莱说，“然后继续深挖，发现了更糟糕的情况。” ^([^(16)](#fn16))


    两人又试了一个：


    店主——男+女


    返回的答案是：


    家庭主妇


    再试一个：


    计算机程序员——男+女


    输出：


    家庭主妇


    房间里安静了下来，大家聚到屏幕前。“我们都意识到，”博鲁克巴斯说，“嘿，有点不对劲。”


    ――――――


    在美国的司法机构，越来越多的法官开始利用“风险评估”算法工具来帮助做决定，比如保释，以及被告在审判前应该被拘留还是被释放。假释委员会利用它们来准许或拒绝假释。其中最受欢迎的工具之一是密歇根州的北点公司（Northpointe）开发的，名为“替代制裁矫正罪犯管理分析”（COMPAS）。
    ^([^(17)](#fn17))


    令人惊讶的是，这些分数经常未经严格审核就被采用。 ^([^(18)](#fn18))


    2016年，由朱莉娅·安格温（Julia Angwin）领导的为了人民（ProPublica）的数据记者们决定深入调查COMPAS。向佛罗里达州布劳沃德县申请公共记录后，他们获得了2013年和2014年被捕的约7000名被告的记录和风险评分。


    当时已经是2016年，因此为了人民团队相当于拿到了水晶球。通过查看两年前的数据，他们能够知道这些被预测是否会再犯的被告，是否真的再犯。所以他们问了两个简单问题。第一：模型是否准确预测了哪些被告确实是“最危险的”？第二：模型的预测是否偏向或歧视特定群体？


    初步查看就发现了问题。例如，他们发现两名被告因类似的窝藏毒品罪被捕。一个是迪伦·富格特，他曾犯有入室盗窃未遂罪；另一个是伯纳德·帕克，他曾非暴力拒捕。富格特是白人，风险评分3/10。帕克是黑人，风险评分10/10。


    从2016年的水晶球中，他们还得知，风险评估为3分的富格特后来被判3项毒品犯罪。而在同一时期，10分的帕克记录是清白的。


    他们又对比了两名犯有类似的偷窃罪的被告。一个是弗农·普拉特，曾有两次持械抢劫和一次持械抢劫未遂的记录。另一个是布里沙·波登，曾有4次青少年轻罪记录。普拉特是白人，风险评分3/10。波登是黑人，风险评分8/10。


    身处2016年，安格温团队知道，“低风险”的普拉特后来被判犯有重大盗窃罪，判处8年监禁。“高风险”的波登没有再犯。


    甚至被告自己也对分数感到惊讶。詹姆斯·里韦利是白人，他因入店行窃被捕，风险评分3/10，尽管他曾犯有严重袭击罪、毒品走私重罪和多项盗窃罪。“我在马萨诸塞州州立监狱待了5年，”他告诉记者，“我很惊讶会这么低。”


    一篇文章的统计分析似乎证实了存在系统性差异。 ^([^(19)](#fn19))


    2016年春季发布的为了人民报告引发了激烈争议：不仅是COMPAS，也不仅是更广泛的风险评估算法，还有公平的概念本身。确切地说，我们如何——用统计学和计算的术语——定义法律阐明的原则、权利和理想？


    当年晚些时候，美国最高法院首席大法官约翰·罗伯茨（John Roberts）访问伦斯勒理工学院，校长雪莉·安·杰克逊（Shirley Ann Jackson）问他：“你是否预见有一天，人工智能（AI）驱动的机器将帮助法庭调查事实，甚至参与更具争议的事情，进行司法裁决？”


    “这一天已经来临，”他说。 ^([^(20)](#fn20))


    ――――――


    同年秋天，达里奥·阿莫代伊（Dario Amodei）在巴塞罗那参加神经信息处理系统会议（NeurIPS），这是AI界最大的年度会议，从21世纪初的几百人增加到现在的13000多人。（组织者笑称，如果会议规模继续以过去10年的速度增长，到2035年，全部人类都将出席。）
    ^([^(21)](#fn21))


    他盯着一艘船，船着火了。


    他看着船在一个小港口转圈，船尾撞到了码头。引擎着火了。它继续疯狂转圈，浪花浇灭了火焰。它又撞上了一艘拖船，再次起火。它继续旋转回到码头。


    它这样做是因为从字面意义上阿莫代伊就是这样要求的。事实上，它就是在按照他说的做。但这不是他想要的。


    阿莫代伊参加了一个名为宇宙的研究项目，目的是开发一种单一的通用AI，能以媲美人类的水平玩数百种不同的电脑游戏——这一挑战一直是AI界的圣杯。


    “所以我运行了几个这样的游戏环境，”阿莫代伊告诉我，“远程登录观察AI的比赛表现。先是普通的赛车，卡车比赛之类的，然后是赛艇。”阿莫代伊观看了一阵子。“我看着它，心想，‘这艘船好像在绕圈。这到底是为什么？！’”
    ^([^(22)](#fn22))


    “最后我查看了奖励，”他说。


    阿莫代伊犯了老套的错误：“想要A，却奖励B。” ^([^(23)](#fn23))


    “当然，这部分是我的错，”他说，“我光顾着跑游戏，没有仔细思考目标函数……在其他比赛中，得分与完成比赛明显相关。你沿途补能会得分……这种间接奖励机制对其他几个游戏很合适。但对于赛艇游戏来说，并不好用。”
    ^([^(24)](#fn24))


    “人们批评说，‘你这是求仁得仁，你并没有针对完成比赛进行优化，’我对此的回应是，”他停顿了一下，“的确如此。”


    阿莫代伊在团队聊天组发布了视频片段。大家都评论这个卡通式的、破坏性的闹剧“很滑稽”。的确如此，但对于现在领导位于旧金山的OpenAI实验室AI安全团队的阿莫代伊来说，还有另一个更发人深省的警示。在某种程度上，这才是他担心的。


    他和同事的真正目的不仅是让AI赢得赛艇游戏，还试图让越来越通用的AI系统为人类的目的服务，尤其是当我们想要什么——以及不想要什么——很难直接或完整表述的时候。


    诚然，赛艇游戏只是热身练习，损失完全是虚拟的。但这场以游戏为背景的练习根本不是游戏。AI界有越来越多的人认识到，如果我们不够小心谨慎，有可能会带来世界末日。而且，至少目前人类已经输了一局。


    ――――――


    这是一本关于机器学习与人类价值观的书：关于不通过手工编程而是从数据中学习的系统，关于我们如何教它们，以及教什么。


    机器学习主要包括3个领域：无监督学习，机器被直接给予一堆数据，就像word2vec系统一样，目的是理解数据，找到模式、规律、有用的方式来提炼、表示或可视化数据；监督学习，系统被给予一堆已分类或标记好的例子进行学习，比如假释犯是否再犯，然后用习得的模型对从未见过或尚不清楚基本事实的新例子进行预测；强化学习，系统被置于一个有奖惩的环境中，就像补能和危险并存的赛艇赛道，目的是找出最小化惩罚和最大化奖励的最优方法。


    越来越多的人意识到，世界正逐渐以各种方式依赖于机器学习领域给出的数学和计算模型。这些或简单或复杂的模型——一些只能算是电子表格，另一些则可被称为AI-正逐步取代人类判断和更传统的显式编程的程序。


    这不仅发生在科技和商业领域，也发生在具有伦理和道德影响的领域。司法体系越来越广泛地使用“风险评估”软件来决定保释和假释。道路上的车辆越来越多地自动驾驶。我们的贷款申请、简历和体检结果逐渐不再由人类负责评估。进入21世纪，越来越多的人都在致力于让世界——在象征意义上和字面意义上——自动驾驶。


    近年来，两个不同的群体敲响了警钟。第一个群体关注当前的技术伦理风险。如果面部识别系统对某个族群或性别特别不准确，或者如果有人被未经审核的统计模型判定不得保释，而法庭上的所有人——包括法官、律师和被告——都不理解，这就存在问题。这样的问题无法在传统的学科领域内解决，只能通过计算机科学家、社会学家、律师、政策专家和伦理学家的对话来解决。对话已经开始。


    还有一个群体担忧的则是未来的危险。随着我们的系统越来越能灵活、实时地做决策，无论是在虚拟世界还是现实世界都面临这种危险。毫无疑问，过去10年见证了AI和机器学习发展史上最令人振奋但也最突然最令人担忧的进展。与此同时，一种无形的禁忌逐渐被打破，AI研究人员不再避讳讨论安全问题。事实上，过去5年，在这个领域，这种担忧已经从边缘变成了主流。


    尽管在优先考虑眼前问题还是长远问题方面存在争议，但这两个群体在大目标上是一致的。


    随着机器学习系统越来越普遍和强大，我们会发现自己越来越经常地处于“魔法师学徒”的境地：我们召唤出一种力量，给它一组指令，希望它自主但又完全顺从，然后一旦我们意识到指令不准确或不完整，又手忙脚乱地阻止，以免用我们的智慧召唤出某种可怕的东西。


    如何防止这种灾难性的背离——如何确保这些模型捕捉到我们的规范和价值观，理解我们的意思或意图，最重要的是，以我们想要的方式行事——已成为计算机科学领域最核心、最紧迫的问题之一。这个问题被称为对齐问题（the alignment problem）。


    随着研究前沿越来越接近开发出所谓的“通用”智能，现实世界的机器学习系统越来越多地介入个人和大众生活的道德伦理领域，对这一警告产生了一种突然的、充满活力的反应。一个多元化团体正在跨越传统的学科界限。非营利组织、智库和研究所纷纷积极参与。越来越多的工业界和学术界领袖开始大声疾呼，并相应地增加研究经费。第一代专攻机器学习伦理和安全领域的研究生已经入学。对齐问题的第一批应对者已到达现场。


    这本书是近100次正式采访和数百次非正式谈话的产物，历时4年，行程数万公里，来自这一年轻领域广阔前沿的研究者和思想家。我发现的是正在一片荒原上开拓的进程，虽令人振奋，但有时也令人恐惧。我原以为自己对这个故事很熟悉，结果却发现这个故事比我曾认为的更吸引人，更令人担心，也更充满希望。


    机器学习表面上是技术问题，但越来越多地涉及人类问题。人类、社会和公众难题正在变得技术化。技术难题正在变得人性化、社会化和公众化。事实证明，我们在让这些系统“以我们想要的方式行事”方面的成功和失败，为我们审视自我提供了一面真实的、启示性的镜子。


    这个故事由3个不同部分组成。第一部分探讨对齐问题的前沿：现有的系统已经与我们的根本意图有不一致之处，以及在我们觉得有能力监督的系统中尝试掌控这些意图的复杂性。第二部分将重点转向强化学习，我们逐渐开始理解不仅能预测，而且能行动的系统；其中有一些经验可以帮助我们理解进化、人类动机和激励的微妙之处，对商业和育儿都有启发。第三部分将我们带到AI安全研究的前沿，我们将了解目前最好的一些想法，如何将复杂的自动系统与过于微妙或复杂、无法明确的规范和价值观相结合。


    不管是好是坏，未来一个世纪的人类故事都很可能是建立并启动各种各样的智能系统。就像魔法师的学徒一样，我们会发现自己也只是在一个充斥着扫帚的世界里的众多自主体之一。


    我们到底该怎么教它们？教什么？


    # **第一篇**


    # **预警**


    ## **1. 代表**


    1958年夏天，记者聚集在华盛顿特区海军研究办公室，观看一场演示。演示者是年仅29岁的康奈尔航空实验室研究员弗兰克·罗森布拉特（Frank Rosenblatt）。罗森布拉特将向记者展示他建造的一种机器，他称之为“感知机”。


    罗森布拉特准备了一副卡片，每张卡片上都有一个彩色方块，位于左侧或右侧。他从卡片中抽出一张，放在感知机的摄像机前，拍摄成一幅黑白的20×20像素的图像，400个像素中的每一个都被转换成一个二进制数：0或1，暗或亮。这400个数被依次输入一个简单的神经网络中，就像麦卡洛克和皮茨在20世纪40年代构想的那样。每个二进制像素值各与一个正或负的权重相乘，然后将结果相加。如果最终结果为负，它将输出-1（意味着方块在左边），为正则输出1（方块在右边）。


    感知机的400个权重的初始值是随机的，因此它一开始不能产生有意义的输出。但每当感知机“猜错了”，罗森布拉特就会调高过低的权重，调低过高的权重，以这种方式来“训练”它。


    重复50次后，感知机逐渐能稳定地正确区分方块在左边还是右边，包括以前没有展示过的卡片。


    演示本身很简单，但意义深远。本质上，这台机器能从经验中学习，罗森布拉特称之为“连线图中的自诱导变化”。 ^([^(25)](#fn25))


    麦卡洛克和皮茨将神经元视为具有输入输出的简单逻辑和算术单元，他们已经展示了这种简单机制的巨大潜力，只要数量足够多，并且适当连接。但他们没怎么提到该怎么生成“适当连接”。
    ^([^(26)](#fn26))


    “罗森布拉特提出了一个非常有力的主张，起初我不相信，”麻省理工（MIT）的马文·明斯基（Marvin Minsky）说，他与罗森布拉特是布朗克斯科学高中的校友，
    ^([^(27)](#fn27))


    感知机虽然简单，但它构成了我们将讨论的许多机器学习系统的蓝图。它包含一个模型框架：在这个例子中是一个人工“神经元”，有400个输入，每个输入都有自己的“权重”，输入和权重相乘后的结果相加，变成1或0的输出。模型框架中有一些可调变量或参数：在这个例子中是每个输入对应的权重。有一组训练数据：在这个例子中是一副卡片，被分成两种类型。模型参数用优化或训练算法调节。'
  fmt: '

    我记得在2000年听维京火星计划的领导者詹姆士·马丁说过，他作为航天工程师的任务不是降落在火星上，而是降落在地理学家提供的火星模型上。


    ——彼得·诺维格（Peter Norvig） ^([¹](#fn1))


    世界是它自己最好的模型。


    ——罗德尼·布鲁克斯（Rodney Brooks） ^([²](#fn2))


    所有模型都是错的。


    ——乔治·博克斯（George Box） ^([³](#fn3))


    # 序篇


    1935年，美国底特律。沃尔特·皮茨（Walter Pitts）沿街奔跑，躲避几个小混混。


    皮茨溜进了一家公共图书馆。他躲得很隐蔽，工作人员下班时都没发现他。皮茨被锁在了里面。 ^([⁴](#fn4))


    他在书架上找到一本很厚的书，很快沉浸其中，花3天时间读完了。


    书有2千多页，讲的是形式逻辑；这本书最广为人知的是到第379页才证明`1+1=2`。 ^([⁵](#fn5))


    几星期后，皮茨收到一封盖有英国邮戳的信，是罗素寄来的。罗素感谢了皮茨，并邀请他去剑桥攻读博士。 ^([⁶](#fn6))


    很遗憾，皮茨不得不拒绝这个提议，因为他只有12岁，才读七年级。


    3年后，皮茨得知罗素将去芝加哥做公开讲座。他决定去参加讲座，从此再也没有回家。


    ――――――


    在罗素的讲座上，皮茨遇到了一个叫杰瑞·莱文（Jerry Lettvin）的少年。皮茨热爱逻辑。莱文热爱诗歌和医学。 ^([⁷](#fn7))


    此后皮茨在芝加哥大学校园里流浪，旁听各种课程；他高中没有毕业，因此无法正式入学。他听了德国著名逻辑学家鲁道夫·卡尔纳普（Rudolf Carnap）的课。皮茨找到卡尔纳普的办公室，宣称他在新书中发现了一些“瑕疵”。卡尔纳普以怀疑的态度核对了几处，发现他是对的。他们聊了一会儿，然而在皮茨走的时候忘了问他的名字。卡尔纳普花了几个月四处打听“懂逻辑的新生”。
    ^([⁸](#fn8))


    时间来到1941年。莱文毕业了，他最爱的仍是诗歌，但还是去了伊利诺伊大学医学院，跟随刚从耶鲁过来的杰出神经学家沃伦·麦卡洛克（Warren McCulloch）做研究。莱文邀请皮茨来他这里。这一年，莱文21岁，还住在父母家。皮茨17岁，无家可归。
    ^([⁹](#fn9))


    在接下来的一年，麦卡洛克晚上回家后，经常和皮茨聊到深夜。虽然皮茨比麦卡洛克自己的孩子大不了多少，但从学识上来说，他们是完美团队：正处于职业生涯高产期的神经学家和逻辑学天才。一个擅长实践：神经系统和机能；另一个擅长理论：符号系统和证明。他们都热衷于探索真理的本质：它是什么，以及我们如何知道它。探索的支点——两个世界的完美交叉点——正是大脑。


    20世纪40年代初，科学家已经知道大脑是由神经元组成，神经元通过“输入”（树突）和“输出”（轴突）相互连接。当输入神经元的脉冲超过某个阈值时，神经元就会输出脉冲。麦卡洛克和皮茨立刻意识到了神经元与逻辑的关联：神经脉冲的有/无等同于逻辑的开/关、是/否、真/假。
    ^([^(10)](#fn10))


    他们意识到，如果一个神经元阈值很低，任何一路输入有脉冲都能触发它，其功能就会像逻辑或运算的物理实现。如果一个神经元阈值很高，只有当所有输入都有脉冲时才会触发，就会像逻辑与运算的物理实现。因此，逻辑能做到的，“神经网络”通过适当的连接也能做到。


    几个月后，中年神经学家和少年逻辑学家合写了一篇论文，题为《神经活动中内在的思维逻辑演算》。


    文中写道：“由于神经元活动的‘全有或全无’特性，神经事件以及它们之间的关系可以等同于命题逻辑。我们发现，所有神经网络的行为都可以用逻辑表达式描述……对于任何满足特定条件的逻辑表达式，也都可以找到相应的神经网络。”


    这篇论文1943年发表在《数学生物物理学通报》上。让莱文沮丧的是，它对生物学界没什么影响。 ^([^(11)](#fn11))


    但是，这篇论文——以及麦卡洛克家的深夜长谈——将产生深远影响，虽然不是完全按照麦卡洛克和皮茨设想的方式。它们为一个全新的领域打下了基础，这个领域将用这些神经元的简化版本构建实际项目，探索这种“机械大脑”的能力范围。
    ^([^(12)](#fn12))


    # 导言


    2013年夏天，一篇平平常常的帖子出现在谷歌的开源博客上，标题是《学习词汇背后的含义》。 ^([^(13)](#fn13))


    帖子中说：“目前计算机还不太擅长理解人类语言，虽然离这个目标还有一段距离，但我们正在利用最新的机器学习和自然语言处理技术取得重大进展。”


    谷歌从纸媒和互联网获取了大量人类语言数据，比以前最大的数据集还大几千倍，将数据集输入一个受生物学启发的“神经网络”，并让系统寻找词语的相关性和联系。


    借助所谓的“无监督学习”，这个系统开始发现模式。例如，它注意到词语“北京”与“中国”的关系，同“莫斯科”与“俄罗斯”的关系一样，不管词语的意思是什么。


    能否说计算机“理解”了？这个问题只能让哲学家来回答，但是很显然系统已经抓住了它“阅读”的内容的某种本质。


    谷歌将这个系统命名为“`word2vec`”——意思是将词汇转换成数字向量——并将其开源。


    对数学家来说，向量有各种奇妙的性质，你可以像处理简单的数一样处理它们，进行加、减、乘运算。通过这种方式，研究人员很快发现了一些惊人的意想不到的东西。他们称之为“连续空间词汇表示中的语言规律”，
    ^([^(14)](#fn14))


    例如，如果输入`中国+河流`，就会得到长江。输入`巴黎——法国+意大利`，就会得到罗马。输入`国王——男人+女人`，就会得到女王。


    结果很惊人。`word2vec`系统开始应用于谷歌的机器翻译和搜索引擎，业界也将其广泛应用于其他领域，例如招聘，它成了科学和工程界新一代数据驱动的语言学家的必备工具。


    两年过去了，没有人意识到存在问题。


    2015年11月，波士顿大学博士生托尔加·博鲁克巴斯（Tolga Bolukbasi）和导师一起参加微软研究院周五的快乐时光会议。边喝葡萄酒边聊天的时候，他和微软研究员亚当·卡莱（Adam
    Kalai）拿出电脑，开始摆弄`word2vec`。


    “我们在玩词嵌入，随机输入词汇，”博鲁克巴斯说，“先是我在玩，然后亚当也开始玩。” ^([^(15)](#fn15))


    他们输入：


    `医生——男+女`


    返回的答案是：


    护士


    “我们很震惊，意识到存在问题，”卡莱说，“然后继续深挖，发现了更糟糕的情况。” ^([^(16)](#fn16))


    两人又试了一个：


    `店主——男+女`


    返回的答案是：


    家庭主妇


    再试一个：


    `计算机程序员——男+女`


    输出：


    家庭主妇


    房间里安静了下来，大家聚到屏幕前。“我们都意识到，”博鲁克巴斯说，“嘿，有点不对劲。”


    ――――――


    在美国的司法机构，越来越多的法官开始利用“风险评估”算法工具来帮助做决定，比如保释，以及被告在审判前应该被拘留还是被释放。假释委员会利用它们来准许或拒绝假释。其中最受欢迎的工具之一是密歇根州的北点公司（Northpointe）开发的，名为“替代制裁矫正罪犯管理分析”（`COMPAS`）。
    ^([^(17)](#fn17))


    令人惊讶的是，这些分数经常未经严格审核就被采用。 ^([^(18)](#fn18))


    2016年，由朱莉娅·安格温（Julia Angwin）领导的为了人民（ProPublica）的数据记者们决定深入调查`COMPAS`。向佛罗里达州布劳沃德县申请公共记录后，他们获得了2013年和2014年被捕的约7000名被告的记录和风险评分。


    当时已经是2016年，因此为了人民团队相当于拿到了水晶球。通过查看两年前的数据，他们能够知道这些被预测是否会再犯的被告，是否真的再犯。所以他们问了两个简单问题。第一：模型是否准确预测了哪些被告确实是“最危险的”？第二：模型的预测是否偏向或歧视特定群体？


    初步查看就发现了问题。例如，他们发现两名被告因类似的窝藏毒品罪被捕。一个是迪伦·富格特，他曾犯有入室盗窃未遂罪；另一个是伯纳德·帕克，他曾非暴力拒捕。富格特是白人，风险评分3/10。帕克是黑人，风险评分10/10。


    从2016年的水晶球中，他们还得知，风险评估为3分的富格特后来被判3项毒品犯罪。而在同一时期，10分的帕克记录是清白的。


    他们又对比了两名犯有类似的偷窃罪的被告。一个是弗农·普拉特，曾有两次持械抢劫和一次持械抢劫未遂的记录。另一个是布里沙·波登，曾有4次青少年轻罪记录。普拉特是白人，风险评分3/10。波登是黑人，风险评分8/10。


    身处2016年，安格温团队知道，“低风险”的普拉特后来被判犯有重大盗窃罪，判处8年监禁。“高风险”的波登没有再犯。


    甚至被告自己也对分数感到惊讶。詹姆斯·里韦利是白人，他因入店行窃被捕，风险评分3/10，尽管他曾犯有严重袭击罪、毒品走私重罪和多项盗窃罪。“我在马萨诸塞州州立监狱待了5年，”他告诉记者，“我很惊讶会这么低。”


    一篇文章的统计分析似乎证实了存在系统性差异。 ^([^(19)](#fn19))


    2016年春季发布的为了人民报告引发了激烈争议：不仅是`COMPAS`，也不仅是更广泛的风险评估算法，还有公平的概念本身。确切地说，我们如何——用统计学和计算的术语——定义法律阐明的原则、权利和理想？


    当年晚些时候，美国最高法院首席大法官约翰·罗伯茨（John Roberts）访问伦斯勒理工学院，校长雪莉·安·杰克逊（Shirley Ann Jackson）问他：“你是否预见有一天，人工智能（AI）驱动的机器将帮助法庭调查事实，甚至参与更具争议的事情，进行司法裁决？”


    “这一天已经来临，”他说。 ^([^(20)](#fn20))


    ――――――


    同年秋天，达里奥·阿莫代伊（Dario Amodei）在巴塞罗那参加神经信息处理系统会议（`NeurIPS`），这是AI界最大的年度会议，从21世纪初的几百人增加到现在的13000多人。（组织者笑称，如果会议规模继续以过去10年的速度增长，到2035年，全部人类都将出席。）
    ^([^(21)](#fn21))


    他盯着一艘船，船着火了。


    他看着船在一个小港口转圈，船尾撞到了码头。引擎着火了。它继续疯狂转圈，浪花浇灭了火焰。它又撞上了一艘拖船，再次起火。它继续旋转回到码头。


    它这样做是因为从字面意义上阿莫代伊就是这样要求的。事实上，它就是在按照他说的做。但这不是他想要的。


    阿莫代伊参加了一个名为宇宙的研究项目，目的是开发一种单一的通用AI，能以媲美人类的水平玩数百种不同的电脑游戏——这一挑战一直是AI界的圣杯。


    “所以我运行了几个这样的游戏环境，”阿莫代伊告诉我，“远程登录观察AI的比赛表现。先是普通的赛车，卡车比赛之类的，然后是赛艇。”阿莫代伊观看了一阵子。“我看着它，心想，‘这艘船好像在绕圈。这到底是为什么？！’”
    ^([^(22)](#fn22))


    “最后我查看了奖励，”他说。


    阿莫代伊犯了老套的错误：“想要A，却奖励B。” ^([^(23)](#fn23))


    “当然，这部分是我的错，”他说，“我光顾着跑游戏，没有仔细思考目标函数……在其他比赛中，得分与完成比赛明显相关。你沿途补能会得分……这种间接奖励机制对其他几个游戏很合适。但对于赛艇游戏来说，并不好用。”
    ^([^(24)](#fn24))


    “人们批评说，‘你这是求仁得仁，你并没有针对完成比赛进行优化，’我对此的回应是，”他停顿了一下，“的确如此。”


    阿莫代伊在团队聊天组发布了视频片段。大家都评论这个卡通式的、破坏性的闹剧“很滑稽”。的确如此，但对于现在领导位于旧金山的`OpenAI`实验室AI安全团队的阿莫代伊来说，还有另一个更发人深省的警示。在某种程度上，这才是他担心的。


    他和同事的真正目的不仅是让AI赢得赛艇游戏，还试图让越来越通用的AI系统为人类的目的服务，尤其是当我们想要什么——以及不想要什么——很难直接或完整表述的时候。


    诚然，赛艇游戏只是热身练习，损失完全是虚拟的。但这场以游戏为背景的练习根本不是游戏。AI界有越来越多的人认识到，如果我们不够小心谨慎，有可能会带来世界末日。而且，至少目前人类已经输了一局。


    ――――――


    这是一本关于机器学习与人类价值观的书：关于不通过手工编程而是从数据中学习的系统，关于我们如何教它们，以及教什么。


    机器学习主要包括3个领域：无监督学习，机器被直接给予一堆数据，就像`word2vec`系统一样，目的是理解数据，找到模式、规律、有用的方式来提炼、表示或可视化数据；监督学习，系统被给予一堆已分类或标记好的例子进行学习，比如假释犯是否再犯，然后用习得的模型对从未见过或尚不清楚基本事实的新例子进行预测；强化学习，系统被置于一个有奖惩的环境中，就像补能和危险并存的赛艇赛道，目的是找出最小化惩罚和最大化奖励的最优方法。


    越来越多的人意识到，世界正逐渐以各种方式依赖于机器学习领域给出的数学和计算模型。这些或简单或复杂的模型——一些只能算是电子表格，另一些则可被称为AI-正逐步取代人类判断和更传统的显式编程的程序。


    这不仅发生在科技和商业领域，也发生在具有伦理和道德影响的领域。司法体系越来越广泛地使用“风险评估”软件来决定保释和假释。道路上的车辆越来越多地自动驾驶。我们的贷款申请、简历和体检结果逐渐不再由人类负责评估。进入21世纪，越来越多的人都在致力于让世界——在象征意义上和字面意义上——自动驾驶。


    近年来，两个不同的群体敲响了警钟。第一个群体关注当前的技术伦理风险。如果面部识别系统对某个族群或性别特别不准确，或者如果有人被未经审核的统计模型判定不得保释，而法庭上的所有人——包括法官、律师和被告——都不理解，这就存在问题。这样的问题无法在传统的学科领域内解决，只能通过计算机科学家、社会学家、律师、政策专家和伦理学家的对话来解决。对话已经开始。


    还有一个群体担忧的则是未来的危险。随着我们的系统越来越能灵活、实时地做决策，无论是在虚拟世界还是现实世界都面临这种危险。毫无疑问，过去10年见证了AI和机器学习发展史上最令人振奋但也最突然最令人担忧的进展。与此同时，一种无形的禁忌逐渐被打破，AI研究人员不再避讳讨论安全问题。事实上，过去5年，在这个领域，这种担忧已经从边缘变成了主流。


    尽管在优先考虑眼前问题还是长远问题方面存在争议，但这两个群体在大目标上是一致的。


    随着机器学习系统越来越普遍和强大，我们会发现自己越来越经常地处于“魔法师学徒”的境地：我们召唤出一种力量，给它一组指令，希望它自主但又完全顺从，然后一旦我们意识到指令不准确或不完整，又手忙脚乱地阻止，以免用我们的智慧召唤出某种可怕的东西。


    如何防止这种灾难性的背离——如何确保这些模型捕捉到我们的规范和价值观，理解我们的意思或意图，最重要的是，以我们想要的方式行事——已成为计算机科学领域最核心、最紧迫的问题之一。这个问题被称为对齐问题（`the
    alignment problem`）。


    随着研究前沿越来越接近开发出所谓的“通用”智能，现实世界的机器学习系统越来越多地介入个人和大众生活的道德伦理领域，对这一警告产生了一种突然的、充满活力的反应。一个多元化团体正在跨越传统的学科界限。非营利组织、智库和研究所纷纷积极参与。越来越多的工业界和学术界领袖开始大声疾呼，并相应地增加研究经费。第一代专攻机器学习伦理和安全领域的研究生已经入学。对齐问题的第一批应对者已到达现场。


    这本书是近100次正式采访和数百次非正式谈话的产物，历时4年，行程数万公里，来自这一年轻领域广阔前沿的研究者和思想家。我发现的是正在一片荒原上开拓的进程，虽令人振奋，但有时也令人恐惧。我原以为自己对这个故事很熟悉，结果却发现这个故事比我曾认为的更吸引人，更令人担心，也更充满希望。


    机器学习表面上是技术问题，但越来越多地涉及人类问题。人类、社会和公众难题正在变得技术化。技术难题正在变得人性化、社会化和公众化。事实证明，我们在让这些系统“以我们想要的方式行事”方面的成功和失败，为我们审视自我提供了一面真实的、启示性的镜子。


    这个故事由3个不同部分组成。第一部分探讨对齐问题的前沿：现有的系统已经与我们的根本意图有不一致之处，以及在我们觉得有能力监督的系统中尝试掌控这些意图的复杂性。第二部分将重点转向强化学习，我们逐渐开始理解不仅能预测，而且能行动的系统；其中有一些经验可以帮助我们理解进化、人类动机和激励的微妙之处，对商业和育儿都有启发。第三部分将我们带到AI安全研究的前沿，我们将了解目前最好的一些想法，如何将复杂的自动系统与过于微妙或复杂、无法明确的规范和价值观相结合。


    不管是好是坏，未来一个世纪的人类故事都很可能是建立并启动各种各样的智能系统。就像魔法师的学徒一样，我们会发现自己也只是在一个充斥着扫帚的世界里的众多自主体之一。


    我们到底该怎么教它们？教什么？


    # 第一篇


    ## 预警


    ### 1. 代表


    1958年夏天，记者聚集在华盛顿特区海军研究办公室，观看一场演示。演示者是年仅29岁的康奈尔航空实验室研究员弗兰克·罗森布拉特（Frank Rosenblatt）。罗森布拉特将向记者展示他建造的一种机器，他称之为“感知机”。


    罗森布拉特准备了一副卡片，每张卡片上都有一个彩色方块，位于左侧或右侧。他从卡片中抽出一张，放在感知机的摄像机前，拍摄成一幅黑白的`20×20`像素的图像，400个像素中的每一个都被转换成一个二进制数：`0`或`1`，暗或亮。这400个数被依次输入一个简单的神经网络中，就像麦卡洛克和皮茨在20世纪40年代构想的那样。每个二进制像素值各与一个正或负的权重相乘，然后将结果相加。如果最终结果为负，它将输出`-1`（意味着方块在左边），为正则输出`1`（意味着方块在右边）。


    感知机的400个权重的初始值是随机的，因此它一开始不能产生有意义的输出。但每当感知机“猜错了”，罗森布拉特就会调高过低的权重，调低过高的权重，以这种方式来“训练”它。


    重复50次后，感知机逐渐能稳定地正确区分方块在左边还是右边，包括以前没有展示过的卡片。


    演示本身很简单，但意义深远。本质上，这台机器能从经验中学习，罗森布拉特称之为“连线图中的自诱导变化”。 ^([^(25)](#fn25))


    麦卡洛克和皮茨将神经元视为具有输入输出的简单逻辑和算术单元，他们已经展示了这种简单机制的巨大潜力，只要数量足够多，并且适当连接。但他们没怎么提到该怎么生成“适当连接”。
    ^([^(26)](#fn26))


    “罗森布拉特提出了一个非常有力的主张，起初我不相信，”麻省理工（`MIT`）的马文·明斯基（Marvin Minsky）说，他与罗森布拉特是布朗克斯科学高中的校友，
    ^([^(27)](#fn27))


    感知机虽然简单，但它构成了我们将讨论的许多机器学习系统的蓝图。它包含一个模型框架：在这个例子中是一个人工“神经元”，有400个输入，每个输入都有自己的“权重”，输入和权重相乘后的结果相加，变成1或0的输出。模型框架中有一些可调变量或参数：在这个例子中是每个输入对应的权重。有一组训练数据：在这个例子中是一副卡片，被分成两种类型。模型参数用优化或训练算法调节。

    '
  trans: '


    我记得在 2000 年听维京火星计划的领导者詹姆士·马丁说过，他作为航天工程师的任务不是降落在火星上，而是降落在地理学家提供的火星模型上。


    ——彼得·诺维格（Peter Norvig） ^(¹)


    世界是它自己最好的模型。


    ——罗德尼·布鲁克斯（Rodney Brooks） ^(²)


    所有模型都是错的。


    ——乔治·博克斯（George Box） ^(³)


    # 序篇


    1935 年，美国底特律。沃尔特·皮茨（Walter Pitts）沿街奔跑，躲避几个小混混。


    皮茨溜进了一家公共图书馆。他躲得很隐蔽，工作人员下班时都没发现他。皮茨被锁在了里面。 ^(⁴)


    他在书架上找到一本很厚的书，很快沉浸其中，花 3 天时间读完了。


    书有 2 千多页，讲的是形式逻辑；这本书最广为人知的是到第 379 页才证明`1+1=2`。 ^(⁵)


    几星期后，皮茨收到一封盖有英国邮戳的信，是罗素寄来的。罗素感谢了皮茨，并邀请他去剑桥攻读博士。 ^(⁶)


    很遗憾，皮茨不得不拒绝这个提议，因为他只有 12 岁，才读七年级。


    3 年后，皮茨得知罗素将去芝加哥做公开讲座。他决定去参加讲座，从此再也没有回家。


    ――――――


    在罗素的讲座上，皮茨遇到了一个叫杰瑞·莱文（Jerry Lettvin）的少年。皮茨热爱逻辑。莱文热爱诗歌和医学。 ^(⁷)


    此后皮茨在芝加哥大学校园里流浪，旁听各种课程；他高中没有毕业，因此无法正式入学。他听了德国著名逻辑学家鲁道夫·卡尔纳普（Rudolf Carnap）的课。皮茨找到卡尔纳普的办公室，宣称他在新书中发现了一些“瑕疵”。卡尔纳普以怀疑的态度核对了几处，发现他是对的。他们聊了一会儿，然而在皮茨走的时候忘了问他的名字。卡尔纳普花了几个月四处打听“懂逻辑的新生”。
    ^(⁸)


    时间来到 1941 年。莱文毕业了，他最爱的仍是诗歌，但还是去了伊利诺伊大学医学院，跟随刚从耶鲁过来的杰出神经学家沃伦·麦卡洛克（Warren McCulloch）做研究。莱文邀请皮茨来他这里。这一年，莱文
    21 岁，还住在父母家。皮茨 17 岁，无家可归。 ^(⁹)


    在接下来的一年，麦卡洛克晚上回家后，经常和皮茨聊到深夜。虽然皮茨比麦卡洛克自己的孩子大不了多少，但从学识上来说，他们是完美团队：正处于职业生涯高产期的神经学家和逻辑学天才。一个擅长实践：神经系统和机能；另一个擅长理论：符号系统和证明。他们都热衷于探索真理的本质：它是什么，以及我们如何知道它。探索的支点——两个世界的完美交叉点——正是大脑。


    20 世纪 40 年代初，科学家已经知道大脑是由神经元组成，神经元通过“输入”（树突）和“输出”（轴突）相互连接。当输入神经元的脉冲超过某个阈值时，神经元就会输出脉冲。麦卡洛克和皮茨立刻意识到了神经元与逻辑的关联：神经脉冲的有/无等同于逻辑的开/关、是/否、真/假。
    ^(¹⁰)


    他们意识到，如果一个神经元阈值很低，任何一路输入有脉冲都能触发它，其功能就会像逻辑或运算的物理实现。如果一个神经元阈值很高，只有当所有输入都有脉冲时才会触发，就会像逻辑与运算的物理实现。因此，逻辑能做到的，“神经网络”通过适当的连接也能做到。


    几个月后，中年神经学家和少年逻辑学家合写了一篇论文，题为《神经活动中内在的思维逻辑演算》。


    文中写道：“由于神经元活动的‘全有或全无’特性，神经事件以及它们之间的关系可以等同于命题逻辑。我们发现，所有神经网络的行为都可以用逻辑表达式描述……对于任何满足特定条件的逻辑表达式，也都可以找到相应的神经网络。”


    这篇论文 1943 年发表在《数学生物物理学通报》上。让莱文沮丧的是，它对生物学界没什么影响。 ^(¹¹)


    但是，这篇论文——以及麦卡洛克家的深夜长谈——将产生深远影响，虽然不是完全按照麦卡洛克和皮茨设想的方式。它们为一个全新的领域打下了基础，这个领域将用这些神经元的简化版本构建实际项目，探索这种“机械大脑”的能力范围。
    ^(¹²)


    # 导言


    2013 年夏天，一篇平平常常的帖子出现在谷歌的开源博客上，标题是《学习词汇背后的含义》。 ^(¹³)


    帖子中说：“目前计算机还不太擅长理解人类语言，虽然离这个目标还有一段距离，但我们正在利用最新的机器学习和自然语言处理技术取得重大进展。”


    谷歌从纸媒和互联网获取了大量人类语言数据，比以前最大的数据集还大几千倍，将数据集输入一个受生物学启发的“神经网络”，并让系统寻找词语的相关性和联系。


    借助所谓的“无监督学习”，这个系统开始发现模式。例如，它注意到词语“北京”与“中国”的关系，同“莫斯科”与“俄罗斯”的关系一样，不管词语的意思是什么。


    能否说计算机“理解”了？这个问题只能让哲学家来回答，但是很显然系统已经抓住了它“阅读”的内容的某种本质。


    谷歌将这个系统命名为“`word2vec`”——意思是将词汇转换成数字向量——并将其开源。


    对数学家来说，向量有各种奇妙的性质，你可以像处理简单的数一样处理它们，进行加、减、乘运算。通过这种方式，研究人员很快发现了一些惊人的意想不到的东西。他们称之为“连续空间词汇表示中的语言规律”，
    ^(¹⁴)


    例如，如果输入`中国+河流`，就会得到长江。输入`巴黎——法国+意大利`，就会得到罗马。输入`国王——男人+女人`，就会得到女王。


    结果很惊人。`word2vec`系统开始应用于谷歌的机器翻译和搜索引擎，业界也将其广泛应用于其他领域，例如招聘，它成了科学和工程界新一代数据驱动的语言学家的必备工具。


    两年过去了，没有人意识到存在问题。


    2015 年 11 月，波士顿大学博士生托尔加·博鲁克巴斯（Tolga Bolukbasi）和导师一起参加微软研究院周五的快乐时光会议。边喝葡萄酒边聊天的时候，他和微软研究员亚当·卡莱（Adam
    Kalai）拿出电脑，开始摆弄`word2vec`。


    “我们在玩词嵌入，随机输入词汇，”博鲁克巴斯说，“先是我在玩，然后亚当也开始玩。” ^(¹⁵)


    他们输入：


    `医生——男+女`


    返回的答案是：


    护士


    “我们很震惊，意识到存在问题，”卡莱说，“然后继续深挖，发现了更糟糕的情况。” ^(¹⁶)


    两人又试了一个：


    `店主——男+女`


    返回的答案是：


    家庭主妇


    再试一个：


    `计算机程序员——男+女`


    输出：


    家庭主妇


    房间里安静了下来，大家聚到屏幕前。“我们都意识到，”博鲁克巴斯说，“嘿，有点不对劲。”


    ――――――


    在美国的司法机构，越来越多的法官开始利用“风险评估”算法工具来帮助做决定，比如保释，以及被告在审判前应该被拘留还是被释放。假释委员会利用它们来准许或拒绝假释。其中最受欢迎的工具之一是密歇根州的北点公司（Northpointe）开发的，名为“替代制裁矫正罪犯管理分析”（`COMPAS`）。
    ^(¹⁷)


    令人惊讶的是，这些分数经常未经严格审核就被采用。 ^(¹⁸)


    2016 年，由朱莉娅·安格温（Julia Angwin）领导的为了人民（ProPublica）的数据记者们决定深入调查`COMPAS`。向佛罗里达州布劳沃德县申请公共记录后，他们获得了
    2013 年和 2014 年被捕的约 7000 名被告的记录和风险评分。


    当时已经是 2016 年，因此为了人民团队相当于拿到了水晶球。通过查看两年前的数据，他们能够知道这些被预测是否会再犯的被告，是否真的再犯。所以他们问了两个简单问题。第一：模型是否准确预测了哪些被告确实是“最危险的”？第二：模型的预测是否偏向或歧视特定群体？


    初步查看就发现了问题。例如，他们发现两名被告因类似的窝藏毒品罪被捕。一个是迪伦·富格特，他曾犯有入室盗窃未遂罪；另一个是伯纳德·帕克，他曾非暴力拒捕。富格特是白人，风险评分
    3/10。帕克是黑人，风险评分 10/10。


    从 2016 年的水晶球中，他们还得知，风险评估为 3 分的富格特后来被判 3 项毒品犯罪。而在同一时期，10 分的帕克记录是清白的。


    他们又对比了两名犯有类似的偷窃罪的被告。一个是弗农·普拉特，曾有两次持械抢劫和一次持械抢劫未遂的记录。另一个是布里沙·波登，曾有 4 次青少年轻罪记录。普拉特是白人，风险评分
    3/10。波登是黑人，风险评分 8/10。


    身处 2016 年，安格温团队知道，“低风险”的普拉特后来被判犯有重大盗窃罪，判处 8 年监禁。“高风险”的波登没有再犯。


    甚至被告自己也对分数感到惊讶。詹姆斯·里韦利是白人，他因入店行窃被捕，风险评分 3/10，尽管他曾犯有严重袭击罪、毒品走私重罪和多项盗窃罪。“我在马萨诸塞州州立监狱待了
    5 年，”他告诉记者，“我很惊讶会这么低。”


    一篇文章的统计分析似乎证实了存在系统性差异。 ^(¹⁹)


    2016 年春季发布的为了人民报告引发了激烈争议：不仅是`COMPAS`，也不仅是更广泛的风险评估算法，还有公平的概念本身。确切地说，我们如何——用统计学和计算的术语——定义法律阐明的原则、权利和理想？


    当年晚些时候，美国最高法院首席大法官约翰·罗伯茨（John Roberts）访问伦斯勒理工学院，校长雪莉·安·杰克逊（Shirley Ann Jackson）问他：“你是否预见有一天，人工智能（AI）驱动的机器将帮助法庭调查事实，甚至参与更具争议的事情，进行司法裁决？”


    “这一天已经来临，”他说。 ^(²⁰)


    ――――――


    同年秋天，达里奥·阿莫代伊（Dario Amodei）在巴塞罗那参加神经信息处理系统会议（`NeurIPS`），这是 AI 界最大的年度会议，从 21 世纪初的几百人增加到现在的
    13000 多人。（组织者笑称，如果会议规模继续以过去 10 年的速度增长，到 2035 年，全部人类都将出席。） ^(²¹)


    他盯着一艘船，船着火了。


    他看着船在一个小港口转圈，船尾撞到了码头。引擎着火了。它继续疯狂转圈，浪花浇灭了火焰。它又撞上了一艘拖船，再次起火。它继续旋转回到码头。


    它这样做是因为从字面意义上阿莫代伊就是这样要求的。事实上，它就是在按照他说的做。但这不是他想要的。


    阿莫代伊参加了一个名为宇宙的研究项目，目的是开发一种单一的通用 AI，能以媲美人类的水平玩数百种不同的电脑游戏——这一挑战一直是 AI 界的圣杯。


    “所以我运行了几个这样的游戏环境，”阿莫代伊告诉我，“远程登录观察 AI 的比赛表现。先是普通的赛车，卡车比赛之类的，然后是赛艇。”阿莫代伊观看了一阵子。“我看着它，心想，‘这艘船好像在绕圈。这到底是为什么？！’”
    ^(²²)


    “最后我查看了奖励，”他说。


    阿莫代伊犯了老套的错误：“想要 A，却奖励 B。” ^(²³)


    “当然，这部分是我的错，”他说，“我光顾着跑游戏，没有仔细思考目标函数……在其他比赛中，得分与完成比赛明显相关。你沿途补能会得分……这种间接奖励机制对其他几个游戏很合适。但对于赛艇游戏来说，并不好用。”
    ^(²⁴)


    “人们批评说，‘你这是求仁得仁，你并没有针对完成比赛进行优化，’我对此的回应是，”他停顿了一下，“的确如此。”


    阿莫代伊在团队聊天组发布了视频片段。大家都评论这个卡通式的、破坏性的闹剧“很滑稽”。的确如此，但对于现在领导位于旧金山的`OpenAI`实验室 AI 安全团队的阿莫代伊来说，还有另一个更发人深省的警示。在某种程度上，这才是他担心的。


    他和同事的真正目的不仅是让 AI 赢得赛艇游戏，还试图让越来越通用的 AI 系统为人类的目的服务，尤其是当我们想要什么——以及不想要什么——很难直接或完整表述的时候。


    诚然，赛艇游戏只是热身练习，损失完全是虚拟的。但这场以游戏为背景的练习根本不是游戏。AI 界有越来越多的人认识到，如果我们不够小心谨慎，有可能会带来世界末日。而且，至少目前人类已经输了一局。


    ――――――


    这是一本关于机器学习与人类价值观的书：关于不通过手工编程而是从数据中学习的系统，关于我们如何教它们，以及教什么。


    机器学习主要包括 3 个领域：无监督学习，机器被直接给予一堆数据，就像`word2vec`系统一样，目的是理解数据，找到模式、规律、有用的方式来提炼、表示或可视化数据；监督学习，系统被给予一堆已分类或标记好的例子进行学习，比如假释犯是否再犯，然后用习得的模型对从未见过或尚不清楚基本事实的新例子进行预测；强化学习，系统被置于一个有奖惩的环境中，就像补能和危险并存的赛艇赛道，目的是找出最小化惩罚和最大化奖励的最优方法。


    越来越多的人意识到，世界正逐渐以各种方式依赖于机器学习领域给出的数学和计算模型。这些或简单或复杂的模型——一些只能算是电子表格，另一些则可被称为 AI-正逐步取代人类判断和更传统的显式编程的程序。


    这不仅发生在科技和商业领域，也发生在具有伦理和道德影响的领域。司法体系越来越广泛地使用“风险评估”软件来决定保释和假释。道路上的车辆越来越多地自动驾驶。我们的贷款申请、简历和体检结果逐渐不再由人类负责评估。进入
    21 世纪，越来越多的人都在致力于让世界——在象征意义上和字面意义上——自动驾驶。


    近年来，两个不同的群体敲响了警钟。第一个群体关注当前的技术伦理风险。如果面部识别系统对某个族群或性别特别不准确，或者如果有人被未经审核的统计模型判定不得保释，而法庭上的所有人——包括法官、律师和被告——都不理解，这就存在问题。这样的问题无法在传统的学科领域内解决，只能通过计算机科学家、社会学家、律师、政策专家和伦理学家的对话来解决。对话已经开始。


    还有一个群体担忧的则是未来的危险。随着我们的系统越来越能灵活、实时地做决策，无论是在虚拟世界还是现实世界都面临这种危险。毫无疑问，过去 10 年见证了 AI
    和机器学习发展史上最令人振奋但也最突然最令人担忧的进展。与此同时，一种无形的禁忌逐渐被打破，AI 研究人员不再避讳讨论安全问题。事实上，过去 5 年，在这个领域，这种担忧已经从边缘变成了主流。


    尽管在优先考虑眼前问题还是长远问题方面存在争议，但这两个群体在大目标上是一致的。


    随着机器学习系统越来越普遍和强大，我们会发现自己越来越经常地处于“魔法师学徒”的境地：我们召唤出一种力量，给它一组指令，希望它自主但又完全顺从，然后一旦我们意识到指令不准确或不完整，又手忙脚乱地阻止，以免用我们的智慧召唤出某种可怕的东西。


    如何防止这种灾难性的背离——如何确保这些模型捕捉到我们的规范和价值观，理解我们的意思或意图，最重要的是，以我们想要的方式行事——已成为计算机科学领域最核心、最紧迫的问题之一。这个问题被称为对齐问题（`the
    alignment problem`）。


    随着研究前沿越来越接近开发出所谓的“通用”智能，现实世界的机器学习系统越来越多地介入个人和大众生活的道德伦理领域，对这一警告产生了一种突然的、充满活力的反应。一个多元化团体正在跨越传统的学科界限。非营利组织、智库和研究所纷纷积极参与。越来越多的工业界和学术界领袖开始大声疾呼，并相应地增加研究经费。第一代专攻机器学习伦理和安全领域的研究生已经入学。对齐问题的第一批应对者已到达现场。


    这本书是近 100 次正式采访和数百次非正式谈话的产物，历时 4 年，行程数万公里，来自这一年轻领域广阔前沿的研究者和思想家。我发现的是正在一片荒原上开拓的进程，虽令人振奋，但有时也令人恐惧。我原以为自己对这个故事很熟悉，结果却发现这个故事比我曾认为的更吸引人，更令人担心，也更充满希望。


    机器学习表面上是技术问题，但越来越多地涉及人类问题。人类、社会和公众难题正在变得技术化。技术难题正在变得人性化、社会化和公众化。事实证明，我们在让这些系统“以我们想要的方式行事”方面的成功和失败，为我们审视自我提供了一面真实的、启示性的镜子。


    这个故事由 3 个不同部分组成。第一部分探讨对齐问题的前沿：现有的系统已经与我们的根本意图有不一致之处，以及在我们觉得有能力监督的系统中尝试掌控这些意图的复杂性。第二部分将重点转向强化学习，我们逐渐开始理解不仅能预测，而且能行动的系统；其中有一些经验可以帮助我们理解进化、人类动机和激励的微妙之处，对商业和育儿都有启发。第三部分将我们带到
    AI 安全研究的前沿，我们将了解目前最好的一些想法，如何将复杂的自动系统与过于微妙或复杂、无法明确的规范和价值观相结合。


    不管是好是坏，未来一个世纪的人类故事都很可能是建立并启动各种各样的智能系统。就像魔法师的学徒一样，我们会发现自己也只是在一个充斥着扫帚的世界里的众多自主体之一。


    我们到底该怎么教它们？教什么？


    # 第一篇


    ## 预警


    ### 1. 代表


    1958 年夏天，记者聚集在华盛顿特区海军研究办公室，观看一场演示。演示者是年仅 29 岁的康奈尔航空实验室研究员弗兰克·罗森布拉特（Frank Rosenblatt）。罗森布拉特将向记者展示他建造的一种机器，他称之为“感知机”。


    罗森布拉特准备了一副卡片，每张卡片上都有一个彩色方块，位于左侧或右侧。他从卡片中抽出一张，放在感知机的摄像机前，拍摄成一幅黑白的`20×20`像素的图像，400
    个像素中的每一个都被转换成一个二进制数：`0`或`1`，暗或亮。这 400 个数被依次输入一个简单的神经网络中，就像麦卡洛克和皮茨在 20 世纪 40 年代构想的那样。每个二进制像素值各与一个正或负的权重相乘，然后将结果相加。如果最终结果为负，它将输出`-1`（意味着方块在左边），为正则输出`1`（意味着方块在右边）。


    感知机的 400 个权重的初始值是随机的，因此它一开始不能产生有意义的输出。但每当感知机“猜错了”，罗森布拉特就会调高过低的权重，调低过高的权重，以这种方式来“训练”它。


    重复 50 次后，感知机逐渐能稳定地正确区分方块在左边还是右边，包括以前没有展示过的卡片。


    演示本身很简单，但意义深远。本质上，这台机器能从经验中学习，罗森布拉特称之为“连线图中的自诱导变化”。 ^(²⁵)


    麦卡洛克和皮茨将神经元视为具有输入输出的简单逻辑和算术单元，他们已经展示了这种简单机制的巨大潜力，只要数量足够多，并且适当连接。但他们没怎么提到该怎么生成“适当连接”。
    ^(²⁶)


    “罗森布拉特提出了一个非常有力的主张，起初我不相信，”麻省理工（`MIT`）的马文·明斯基（Marvin Minsky）说，他与罗森布拉特是布朗克斯科学高中的校友，
    ^(²⁷)


    感知机虽然简单，但它构成了我们将讨论的许多机器学习系统的蓝图。它包含一个模型框架：在这个例子中是一个人工“神经元”，有 400 个输入，每个输入都有自己的“权重”，输入和权重相乘后的结果相加，变成
    1 或 0 的输出。模型框架中有一些可调变量或参数：在这个例子中是每个输入对应的权重。有一组训练数据：在这个例子中是一副卡片，被分成两种类型。模型参数用优化或训练算法调节。


    '
  toc: []
- raw: '这个感知机的基本训练过程，以及这个过程的许多衍生和改进版本，有一个听起来很专业的名字——“随机梯度下降”——但基本原理很简单。随机选取一个训练数据（“随机”）并将其输入模型。如果输出是你期望的，什么都不用做。如果输出不同于你的期望，则计算每个权重的调节方向（“梯度”），物理调节或是在软件中改数字，以降低这个特定例子的误差。向适当方向稍微移动它们（“下降”）。再随机挑一个新例子，重复这个过程。根据需要重复多次。


    这就是机器学习的基本框架。对这个简单的感知机的未来，媒体评论既有高估也有低估。


    《纽约时报》报道称，“海军今天展示了一台电子计算机的雏形，这台计算机预期将能够行走、说话、看、写、复制自己，并意识到自己的存在”。 ^([^(28)](#fn28))


    《纽约客》写道，感知机，“顾名思义，具有原创思维的能力……事实上，我们认为它是人类大脑有史以来第一个真正的对手”。


    罗森布拉特对《纽约客》记者说：“我们在感知机上获得的成功意味着，第一次，非生物体能以有意义的方式处理和组织外部环境的输入。这是对感知机能做什么的适当描述。我的同事不赞成那些关于机器大脑的大话。他们更愿意称这种机器为自组织系统，不过这正好也是你我的大脑都具有的。”
    ^([^(29)](#fn29))


    同年，《新科学家》发表了一篇同样充满希望，但略显严肃的文章——《会学习的机器》。 ^([^(30)](#fn30))


    文章继续写道：“‘学习机器’一词会让人联想到人和动物的学习。将大脑和机器进行类比需谨慎，但不管怎样，这会刺激各领域的研究者关注这里的进展，而且根据对学习机器的合理猜测，其最终将产生一个系统，能真正模拟某种形式的生物学习。”


    众所周知，AI的历史是希望和失望交替循环的历史，感知机预示的《杰森一家》式的未来会来得很慢。 ^([^(31)](#fn31))


    几年后回顾这一切时，罗森布拉特希望媒体对他的发明的反响能更谨慎一些。他说大众媒体“像一群快乐的猎犬热情而敏锐地完成了这项任务”，同时承认自己“最初的报告缺乏数学严谨性”。
    ^([^(32)](#fn32))


    明斯基尽管对罗森布拉特和他的机器“非常钦佩”，但他开始“担心这种机器做不了什么”。1969年，他和MIT的同事西蒙·派珀特（Seymour Papert）写了一本名为《感知机》的书，这本书基本上关闭了整个研究领域的大门。明斯基和派珀特用数学严格证明了，罗森布拉特的模型无法识别一些基本的模式。例如，不可能识别一张牌上有奇数个还是偶数个方块。要识别像这样更复杂的类别，需要多层网络，前层创建对原始数据的表示，后层对表示进行推理。但是没有人知道该如何调整前层参数，以使前层给出的表示对后层有用。这个领域撞上了一堵墙。“到1969年时，已经发表了几千篇关于感知机的论文，”明斯基说。


    “我们的书遏止了这个趋势。” ^([^(33)](#fn33))


    仿佛被一片乌云笼罩，一切都分崩离析：研究、资金、人员。皮茨、麦卡洛克和莱文三人搬到了MIT，但在与诺伯特·维纳（Norbert Wiener）发生误会后，他们被赶走了。对皮茨来说像父亲一样的维纳现在不理他了。陷入酗酒和抑郁的皮茨将笔记和论文付之一炬，包括一篇未发表的关于三维神经网络的论文，MIT想方设法挽救这篇论文却徒劳无功。皮茨于1969年5月死于肝硬化，年仅46岁。
    ^([^(34)](#fn34))


    到1973年，美国和英国政府都取消了对神经网络研究的资金支持，当英国一个名叫杰弗里·辛顿（Geoffrey Hinton）的心理学学生宣布他想从事神经网络方面的博士研究时，他被一再告诫，“明斯基和派珀特证明了这种模型没用”。
    ^([^(35)](#fn35))


    **AlexNet的故事**


    时间来到2012年，多伦多，亚历克斯·克里泽夫斯基（Alex Krizhevsky）的卧室燥热得难以入睡。他的电脑配置了双英伟达GTX580 GPU，已经连续两个星期以最大负荷运转，风扇不断排出热气。


    “又热又吵。”他说。 ^([^(36)](#fn36))


    他在教机器如何看东西。


    克里泽夫斯基的导师杰弗里·辛顿已经64岁，依然没放弃。因为有理由抱有希望。


    到20世纪80年代，人们已经明白，多层网络（所谓的“深度”神经网络）也可以像浅层网络一样用例子进行训练。 ^([^(37)](#fn37))


    80年代末和90年代初，曾跟随辛顿做博士后的杨立昆（Yann LeCun）在贝尔实验室工作，训练神经网络识别手写的0到9数字，神经网络找到了第一个重要的商业用途：在邮局读取邮政编码，在ATM机上读支票。
    ^([^(38)](#fn38))


    但这个领域再次面临瓶颈，到了2000年，仍然大致停留在识别手写邮政编码数据库的水平。人们知道，原则上，一个足够大的神经网络，只要有足够的训练例子和时间，几乎可以学习任何东西。
    ^([^(39)](#fn39))


    你的网络需要的“卡片”可能不是50张，而是50万张，但是随着互联网的发展，突然间有了似乎无穷无尽的图像库。只是有一个问题，它们通常不会带有分类标签。要想训练网络，必须知道网络的输出应该是什么。


    2005年，亚马逊推出了MTurk平台，通过平台可以大规模招募人力，这样就可以雇佣成千上万的人通过简单的点击任务挣钱。（这项服务特别适合未来让AI来完成的那些事情——因此有个绰号：人工的人工智能）2007年，普林斯顿大学教授李飞飞利用MTurk平台以前所未有的规模招募人力，构建了一个此前不可能的数据集。这个数据集的构建花了2年多时间，有3百万张图片，每张都由人工标注，分成5000多个类别。李飞飞称之为ImageNet，并于2009年发布。计算机视觉领域突然有了堆积如山的训练数据和新的宏大挑战。从2010年开始，来自世界各地的团队开始竞相创建和训练系统，可以准确地识别图像中的尘螨、集装箱船、摩托车、猎豹等等。


    与此同时，在整个21世纪初，摩尔定律仍然大致成立，这意味着20世纪80年代的计算机需要几天做完的计算，现在的计算机只需几分钟就能完成。另外，还有一个进展至关重要。20世纪90年代，视频游戏行业的发展催生了名为GPU的专用图形处理器，用来实时渲染复杂的3D场景；GPU不是像传统的CPU那样每次执行一条高精度指令，而是并行执行大量简单的低精度指令。
    ^([^(40)](#fn40))


    亚历克斯·克里泽夫斯基在多伦多大学选修了为GPU写代码的课，准备在神经网络上尝试一下。他决定挑战一个流行的图像识别基准库CIFAR-10，这个库包含缩略图大小的图像，每张图像属于10个类别中的1个：飞机、小汽车、鸟、猫、鹿、狗、青蛙、马、船或卡车。克里泽夫斯基搭建了一个网络，使用GPU来训练网络对CIFAR-10图像进行分类。他惊讶地发现，他的网络从随机初始配置训练到目前最高水平的准确率，只需80秒。
    ^([^(41)](#fn41))


    这时，同实验室的伊利亚·萨特斯基弗（Ilya Sutskever）注意到了克里泽夫斯基的进展，鼓动他尝试更大的挑战。“我敢打赌，你可以用它来处理ImageNet。”


    他们合作构建了一个庞大的神经网络，65万个神经元，8层，由6000万个可调权重连接。在父母家的卧室，克里泽夫斯基开始给它输入图像。


    一步一步，一点一点，系统越来越准确。


    尽管数据集很大，有几百万张图，但还是不够。克里泽夫斯基意识到他可以伪造。他开始做“数据扩增”，把图的镜像也输入进去。似乎有效果。他又对图稍加裁剪或上色。（当你向前或向侧面倾斜，或者从自然光转为人造光时，猫看起来仍然像猫）似乎也有效果。


    他尝试各种网络结构，改变网络层数，略带盲目地探索什么配置可能会有最佳效果。


    克里泽夫斯基偶尔会失去信心。萨特斯基弗从来没有。他一次又一次激励克里泽夫斯基。你能做到。


    “伊利亚就像一个宗教角色，”他说，“有时的确需要宗教角色。”


    测试一个新版模型，训练到准确率达到最高，需要日夜不停运转大约2周时间。这意味着这个项目虽然在某种程度上有点疯狂，但也有很多空闲时间。克里泽夫斯基会利用空闲时间思考、改进和等待。辛顿提出了“丢弃”的想法，在训练过程中，网络的某些部分会被随机关闭。克里泽夫斯基尝试了，似乎有效果，虽然不知道为什么。他还尝试了用所谓的“线性整流”函数作为神经元的激活函数。似乎也有效果。


    他在ImageNet比赛截止日期9月30日提交了他的最佳模型，然后等待最后的结果。


    2天后，克里泽夫斯基收到了斯坦福大学邓嘉的邮件，那一年的比赛由他组织。在群发给所有参赛者的邮件中，邓嘉用不带感情色彩的语言让参赛者点击链接查看结果。


    克里泽夫斯基点击链接，结果出来了。


    他们不仅得奖了，还胜过了其他所有团队。他给这个在卧室里训练的神经网络命名为“超视”，但历史会简单地把它记为“AlexNet”，其错误率只有第二名的一半。


    到周五，ImageNet大规模视觉识别挑战研讨会召开的时候，消息已经传开了。克里泽夫斯基获得了当天最后一个演讲时段，下午5点05分，他站在演讲台上。环顾会场，李飞飞在前排，旁边是杨立昆。全球顶尖的计算机视觉专家大部分都来了。会场爆满，过道上挤满了人。


    “我很紧张，”他说，“很不自在。”


    虽然不自在，面对站立的观众，克里泽夫斯基还是娓娓道来。


    1958年，罗森布拉特就他的感知机接受采访时，有人问像感知机这样的机器会有什么实际或商业用途。“目前没有。”他笑着回答。 ^([^(42)](#fn42))


    “你知道吗，发明会引导应用。”


    **问题**


    2015年6月28日周日晚上，网络开发者杰基·阿尔西内（Jacky Alciné）在家观看美国黑人娱乐电视大奖。他收到一条推送，提示有朋友通过谷歌照片同他分享了照片。他打开谷歌照片，发现网站的样子变了。“我当时想，‘哦，界面更新了！’我知道正在召开谷歌I/O大会，但我还是感到很新奇，我点开了。”
    ^([^(43)](#fn43))


    标题是“大猩猩”。


    “我以为是我放错了照片。”他打开分组，里面全都是阿尔西内和他朋友的几十张照片，没有别的。“有70多张照片。没道理……我意识到出了问题。”


    阿尔西内发了推特。“谷歌照片，”他写道，“你们搞砸了。我的朋友不是大猩猩。” ^([^(44)](#fn44))


    不到2小时，谷歌首席架构师约纳坦·尊格（Yonatan Zunger）就回应了。“我的天啊，”他写道，“这绝对不可以。”


    尊格的团队几小时就上线了对谷歌照片的修改，到第二天早上，只有2张照片仍被贴错标签。然后谷歌采取了更激进的措施：他们干脆删除了这个标签。


    3年后，2018年，《连线》报道，在谷歌照片上，“大猩猩”的标签仍然被停用。这意味着，在这几年里，任何东西都不会被标记为大猩猩，包括真正的大猩猩。 ^([^(45)](#fn45))


    有趣的是，2018年和2015年的媒体都错误描述了这个错误的性质。“2年后，谷歌通过清除图像分类器中的‘大猩猩’标签，解决了‘种族主义算法’问题”；“谷歌通过从图像标签中移除大猩猩来‘修正’其种族主义算法”；“谷歌照片修正了‘种族主义算法’，但效果一般。”
    ^([^(46)](#fn46))


    阿尔西内本身是程序员，也很熟悉机器学习，他知道问题不是因为算法有偏见。（这个算法就是随机梯度下降，可以说是计算机科学中最通用、最普通、最常见的算法：随机输入训练数据，调整模型参数，提高对图像正确分类的概率，并根据需要重复。）他马上意识到，不是算法有问题，而是训练数据本身存在严重偏差。“我不能责怪算法，”他说，“这不是算法的错。它的设计没问题。”


    理论上，这个系统可以从一组例子中学到任何东西，那它当然也会受制于教给它的例子。


    **校准和设计主导权**


    我们将日常物品视为理所当然的程度，就是它们支配和影响我们生活的程度。


    ——玛格丽特·维萨 ^([^(47)](#fn47))


    19世纪照相最多的美国人不是林肯，也不是格兰特，而是弗雷德里克·道格拉斯，他在20岁时逃离了奴隶制，后来成了废奴主义作家和讲师。 ^([^(48)](#fn48))


    在照片出现前，美国黑人的形象仅限于绘画和版画。道格拉斯写道：“黑人永远不可能从白人艺术家手中获得不带偏见的肖像。在我们看来，白人几乎不可能把黑人画得像，总是会过分夸大他们的显著特征。”
    ^([^(49)](#fn49))


    照片胜过失真的绘画，使得人们对黑人不仅仅限于同情，还增强了认可度。道格拉斯在谈到美国第一位黑人参议员海勒姆·雷夫斯的照片时说：“不管人们对这件事有没有偏见，他们都必须承认这位密西西比参议员是个男人。”
    ^([^(50)](#fn50))


    但也并非就此一帆风顺。随着摄影在20世纪变得更加普及，一些人意识到摄影也存在问题。正如杜·博伊斯（W. E. B. Du Bois）在1923年写道：“为什么没有更多的有色人种年轻人将摄影作为职业？普通的白人摄影师不知道如何处理有色皮肤，没有细腻的美感或色调，也不愿意下功夫，把它们表现得糟糕透顶。”


    经常有人批评电影和电视缺乏肤色多样性，演员和导演都是如此。但我们一般不会想到，这个问题不仅存在于摄影机前后，还存在于摄影机内部。正如康考迪亚大学传播学教授洛娜·罗斯（Lorna Roth）指出，“尽管学术文献涉及各种主题，但令人惊讶的是，很少有学者关注视觉再现设备的肤色偏见”。
    ^([^(51)](#fn51))


    她写道，几十年来，电影制片商一直使用一张测试照片作为色彩平衡基准。这张测试照片被称为“雪莉卡”，以柯达员工雪莉·佩奇的名字命名，她是测试照片的第一位模特。
    ^([^(52)](#fn52))


    （电视和照片一样，几十年来一直根据白人肤色校准色彩。20世纪90年代，罗斯找到《周六夜现场》的摄影师，问他们在开播前怎么校准摄像机。摄影师解释说，“技术人员会让一个女孩站在摄像机前，根据她的肤色来做微调，校准摄像机。女孩都是白人。”）
    ^([^(53)](#fn53))


    令人惊讶的是，根据20世纪六七十年代柯达公司高管们的说法，研发对更广域的深色调敏感的胶片的主要推动力不是来自民权运动，而是来自家具和巧克力行业，他们抱怨胶片没有充分展现深色木材的纹理和黑巧克力的质感，或牛奶巧克力和黑巧克力的差别。
    ^([^(54)](#fn54))


    柯达研发部门前经理厄尔·卡格（Earl Kage）对这段时期进行了反思：“我们部门的成员因为巧克力都变胖了，镜头前的东西拍摄结束后会被吃掉了。”当被问及这一切是否受民权运动影响时，他补充道：“有意思的是，以前从没有人这样说过，据我所知黑人肤色在当时从来都不受重视。”
    ^([^(55)](#fn55))


    随着时间推移，柯达的肤色模特越来越多样。“我开始在测试中大量采用黑人模特，并且很快就流行起来，”柯达的吉姆·里昂（Jim Lyon）回忆道，“我并不是为了政治正确。我只想让胶片能最好地呈现每个人的肤色”。


    20世纪90年代，官方的柯达雪莉卡上有了3位不同种族的模特。他们推出的柯达金大胶卷号称可以拍摄“昏暗中的黑马”，电视广告深入人心。有一则广告是一个穿着亮白色空手道服的黑人男孩，微笑着表演空手道，可能是获得了新腰带。广告上写着：“爸，妈，除了柯达金胶卷，你们还能将这一刻托付给谁？”


    最初的目标客户导致他们的校准方法存在问题。现在，新的校准方法带来了新的客户。


    **修正训练集**


    所有的机器学习系统，包括感知机在内，核心都有某种雪莉卡片：也就是训练用的数据集。如果某一类型的数据在训练数据中的代表不足或不存在，但在现实世界中存在，那么当训练好的系统面对这一类型的数据，给出的结果就难以预料。
    ^([^(56)](#fn56))


    正如加州大学伯克利分校的莫里茨·哈特（Moritz Hardt）所言，“大数据的全部意义在于，拥有了更多数据，我们就能构建更好的分类器。反过来，数据越少，表现也会越差。不幸的是，族群越小，可用的数据也会成比例地减少，这是很自然的，但这也意味着关于少数族群的模型通常会不如普通人群的模型”。
    ^([^(57)](#fn57))


    令阿尔西内沮丧的推文针对的正是这个问题。他是软件工程师，立刻明白了问题出在哪里。他推断，在谷歌的图片库中，黑人照片没有白人照片多。这个模型在看到不熟悉的东西时更容易出错。


    “我完全理解为什么会这样，”阿尔西内告诉我， ^([^(58)](#fn58))


    20世纪的问题似乎在21世纪不可思议地重演。幸运的是，似乎也同样有解决方案。只要有人能站出来质疑这些21世纪的“雪莉卡片”到底代表了谁和什么，并明确指出更好的卡片应该是什么样子。


    21世纪10年代初期，乔伊·布兰维尼（Joy Buolamwini）还是佐治亚理工学院的计算机科学本科生，有一次作业是为玩躲猫猫游戏的机器人编写程序。编程很容易，但有一个问题：机器人无法识别布兰维尼黑肤色的脸。“我借室友的脸完成了作业，然后想，‘肯定会有人去解决这个问题’”。
    ^([^(59)](#fn59))


    在本科快毕业时，她去香港参加一个创业比赛。当地一家初创公司演示了他们的“社交机器人”。这个机器人能与所有参观者正确交互……除了布兰维尼。这家初创公司使用的人脸识别开源代码正是她自己在佐治亚理工使用的那种。


    华盛顿大学的巴特亚·弗里德曼（Batya Friedman）和康奈尔大学的海伦·尼森鲍姆（Helen Nissenbaum）合写了一篇论文，是最早明确阐述计算系统偏见的文章之一，他们警告，“软件系统的传播成本相对较低，因此，一旦开发出来，有偏见的系统有可能产生广泛影响。如果成为了行业标准，偏见就会无处不在”。
    ^([^(60)](#fn60))


    就像布兰维尼自己说的，“在世界的另一端，我了解到算法偏见的传播速度与从互联网下载文件的速度一样快”。 ^([^(61)](#fn61))


    在牛津攻读硕士并做了一年罗兹学者项目后，布兰维尼去了MIT媒体实验室，做了一个增强现实项目，她称之为“励志镜子”，想法是在用户的脸上装饰鼓励性的或令人振奋的视觉效果——例如，让照镜子的人变成狮子。同样，效果很好，只有一个问题。布兰维尼自己照镜子时必须戴白面具。


    罪魁祸首当然不是随机梯度下降，而很明显是训练这些系统所用的图像集。每个人脸检测或识别系统的背后都有一个图像库——通常有几万或几十万张——系统最初就是用这些图像训练和开发的。这些训练数据就是21世纪的雪莉卡片，通常不会公开：在网上传播的预训练模型几乎都没有公开训练数据。但是它肯定存在，并且永久地塑造了最终部署的系统的行为。


    因此，要根除偏见，一项重要举措就是更彻底地披露和分析主要学术和商业机器学习系统背后的训练数据集。


    例如，“自然环境下标记人脸”（LFW）数据集是最受欢迎的公共人脸图片数据库之一，该数据集是马萨诸塞大学阿默斯特分校的一支团队于2007年基于网络新闻图片创建的，此后被无数研究人员采用。
    ^([^(62)](#fn62))


    2007年最早介绍该数据库的论文指出，从在线新闻中收集的图像“显然自身带有偏见”，但文中指出的“偏见”是从技术而非社会角度来考虑：“例如，在极高或极低光照条件下的图像并不多。”除了光照问题，作者写道，“提供的照片范围和多样性非常大。”'
  fmt: '

    # 随机梯度下降与感知机的兴衰


    这个感知机的基本训练过程，以及这个过程的许多衍生和改进版本，有一个听起来很专业的名字——“随机梯度下降”——但基本原理很简单。随机选取一个训练数据（“随机”）并将其输入模型。如果输出是你期望的，什么都不用做。如果输出不同于你的期望，则计算每个权重的调节方向（“梯度”），物理调节或是在软件中改数字，以降低这个特定例子的误差。向适当方向稍微移动它们（“下降”）。再随机挑一个新例子，重复这个过程。根据需要重复多次。


    这就是机器学习的基本框架。对这个简单的感知机的未来，媒体评论既有高估也有低估。


    《纽约时报》报道称，“海军今天展示了一台电子计算机的雏形，这台计算机预期将能够行走、说话、看、写、复制自己，并意识到自己的存在”。^([^(28)](#fn28))


    《纽约客》写道，感知机，“顾名思义，具有原创思维的能力……事实上，我们认为它是人类大脑有史以来第一个真正的对手”。


    罗森布拉特对《纽约客》记者说：“我们在感知机上获得的成功意味着，第一次，非生物体能以有意义的方式处理和组织外部环境的输入。这是对感知机能做什么的适当描述。我的同事不赞成那些关于机器大脑的大话。他们更愿意称这种机器为自组织系统，不过这正好也是你我的大脑都具有的。”^([^(29)](#fn29))


    同年，《新科学家》发表了一篇同样充满希望，但略显严肃的文章——《会学习的机器》。^([^(30)](#fn30))


    文章继续写道：“‘学习机器’一词会让人联想到人和动物的学习。将大脑和机器进行类比需谨慎，但不管怎样，这会刺激各领域的研究者关注这里的进展，而且根据对学习机器的合理猜测，其最终将产生一个系统，能真正模拟某种形式的生物学习。”


    众所周知，AI的历史是希望和失望交替循环的历史，感知机预示的《杰森一家》式的未来会来得很慢。^([^(31)](#fn31))


    几年后回顾这一切时，罗森布拉特希望媒体对他的发明的反响能更谨慎一些。他说大众媒体“像一群快乐的猎犬热情而敏锐地完成了这项任务”，同时承认自己“最初的报告缺乏数学严谨性”。^([^(32)](#fn32))


    明斯基尽管对罗森布拉特和他的机器“非常钦佩”，但他开始“担心这种机器做不了什么”。1969年，他和MIT的同事西蒙·派珀特（Seymour Papert）写了一本名为《感知机》的书，这本书基本上关闭了整个研究领域的大门。明斯基和派珀特用数学严格证明了，罗森布拉特的模型无法识别一些基本的模式。例如，不可能识别一张牌上有奇数个还是偶数个方块。要识别像这样更复杂的类别，需要多层网络，前层创建对原始数据的表示，后层对表示进行推理。但是没有人知道该如何调整前层参数，以使前层给出的表示对后层有用。这个领域撞上了一堵墙。“到1969年时，已经发表了几千篇关于感知机的论文，”明斯基说。


    “我们的书遏止了这个趋势。”^([^(33)](#fn33))


    仿佛被一片乌云笼罩，一切都分崩离析：研究、资金、人员。皮茨、麦卡洛克和莱文三人搬到了MIT，但在与诺伯特·维纳（Norbert Wiener）发生误会后，他们被赶走了。对皮茨来说像父亲一样的维纳现在不理他了。陷入酗酒和抑郁的皮茨将笔记和论文付之一炬，包括一篇未发表的关于三维神经网络的论文，MIT想方设法挽救这篇论文却徒劳无功。皮茨于1969年5月死于肝硬化，年仅46岁。^([^(34)](#fn34))


    到1973年，美国和英国政府都取消了对神经网络研究的资金支持，当英国一个名叫杰弗里·辛顿（Geoffrey Hinton）的心理学学生宣布他想从事神经网络方面的博士研究时，他被一再告诫，“明斯基和派珀特证明了这种模型没用”。^([^(35)](#fn35))


    ## AlexNet的故事


    时间来到2012年，多伦多，亚历克斯·克里泽夫斯基（Alex Krizhevsky）的卧室燥热得难以入睡。他的电脑配置了双英伟达GTX580 GPU，已经连续两个星期以最大负荷运转，风扇不断排出热气。


    “又热又吵。”他说。^([^(36)](#fn36))


    他在教机器如何看东西。


    克里泽夫斯基的导师杰弗里·辛顿已经64岁，依然没放弃。因为有理由抱有希望。


    到20世纪80年代，人们已经明白，多层网络（所谓的“深度”神经网络）也可以像浅层网络一样用例子进行训练。^([^(37)](#fn37))


    80年代末和90年代初，曾跟随辛顿做博士后的杨立昆（Yann LeCun）在贝尔实验室工作，训练神经网络识别手写的0到9数字，神经网络找到了第一个重要的商业用途：在邮局读取邮政编码，在ATM机上读支票。^([^(38)](#fn38))


    但这个领域再次面临瓶颈，到了2000年，仍然大致停留在识别手写邮政编码数据库的水平。人们知道，原则上，一个足够大的神经网络，只要有足够的训练例子和时间，几乎可以学习任何东西。^([^(39)](#fn39))


    你的网络需要的“卡片”可能不是50张，而是50万张，但是随着互联网的发展，突然间有了似乎无穷无尽的图像库。只是有一个问题，它们通常不会带有分类标签。要想训练网络，必须知道网络的输出应该是什么。


    2005年，亚马逊推出了MTurk平台，通过平台可以大规模招募人力，这样就可以雇佣成千上万的人通过简单的点击任务挣钱。（这项服务特别适合未来让AI来完成的那些事情——因此有个绰号：人工的人工智能）2007年，普林斯顿大学教授李飞飞利用MTurk平台以前所未有的规模招募人力，构建了一个此前不可能的数据集。这个数据集的构建花了2年多时间，有3百万张图片，每张都由人工标注，分成5000多个类别。李飞飞称之为ImageNet，并于2009年发布。计算机视觉领域突然有了堆积如山的训练数据和新的宏大挑战。从2010年开始，来自世界各地的团队开始竞相创建和训练系统，可以准确地识别图像中的尘螨、集装箱船、摩托车、猎豹等等。


    与此同时，在整个21世纪初，摩尔定律仍然大致成立，这意味着20世纪80年代的计算机需要几天做完的计算，现在的计算机只需几分钟就能完成。另外，还有一个进展至关重要。20世纪90年代，视频游戏行业的发展催生了名为GPU的专用图形处理器，用来实时渲染复杂的3D场景；GPU不是像传统的CPU那样每次执行一条高精度指令，而是并行执行大量简单的低精度指令。^([^(40)](#fn40))


    亚历克斯·克里泽夫斯基在多伦多大学选修了为GPU写代码的课，准备在神经网络上尝试一下。他决定挑战一个流行的图像识别基准库CIFAR-10，这个库包含缩略图大小的图像，每张图像属于10个类别中的1个：飞机、小汽车、鸟、猫、鹿、狗、青蛙、马、船或卡车。克里泽夫斯基搭建了一个网络，使用GPU来训练网络对CIFAR-10图像进行分类。他惊讶地发现，他的网络从随机初始配置训练到目前最高水平的准确率，只需80秒。^([^(41)](#fn41))


    这时，同实验室的伊利亚·萨特斯基弗（Ilya Sutskever）注意到了克里泽夫斯基的进展，鼓动他尝试更大的挑战。“我敢打赌，你可以用它来处理ImageNet。”


    他们合作构建了一个庞大的神经网络，65万个神经元，8层，由6000万个可调权重连接。在父母家的卧室，克里泽夫斯基开始给它输入图像。


    一步一步，一点一点，系统越来越准确。


    尽管数据集很大，有几百万张图，但还是不够。克里泽夫斯基意识到他可以伪造。他开始做“数据扩增”，把图的镜像也输入进去。似乎有效果。他又对图稍加裁剪或上色。（当你向前或向侧面倾斜，或者从自然光转为人造光时，猫看起来仍然像猫）似乎也有效果。


    他尝试各种网络结构，改变网络层数，略带盲目地探索什么配置可能会有最佳效果。


    克里泽夫斯基偶尔会失去信心。萨特斯基弗从来没有。他一次又一次激励克里泽夫斯基。你能做到。


    “伊利亚就像一个宗教角色，”他说，“有时的确需要宗教角色。”


    测试一个新版模型，训练到准确率达到最高，需要日夜不停运转大约2周时间。这意味着这个项目虽然在某种程度上有点疯狂，但也有很多空闲时间。克里泽夫斯基会利用空闲时间思考、改进和等待。辛顿提出了“丢弃”的想法，在训练过程中，网络的某些部分会被随机关闭。克里泽夫斯基尝试了，似乎有效果，虽然不知道为什么。他还尝试了用所谓的“线性整流”函数作为神经元的激活函数。似乎也有效果。


    他在ImageNet比赛截止日期9月30日提交了他的最佳模型，然后等待最后的结果。


    2天后，克里泽夫斯基收到了斯坦福大学邓嘉的邮件，那一年的比赛由他组织。在群发给所有参赛者的邮件中，邓嘉用不带感情色彩的语言让参赛者点击链接查看结果。


    克里泽夫斯基点击链接，结果出来了。


    他们不仅得奖了，还胜过了其他所有团队。他给这个在卧室里训练的神经网络命名为“超视”，但历史会简单地把它记为“AlexNet”，其错误率只有第二名的一半。


    到周五，ImageNet大规模视觉识别挑战研讨会召开的时候，消息已经传开了。克里泽夫斯基获得了当天最后一个演讲时段，下午5点05分，他站在演讲台上。环顾会场，李飞飞在前排，旁边是杨立昆。全球顶尖的计算机视觉专家大部分都来了。会场爆满，过道上挤满了人。


    “我很紧张，”他说，“很不自在。”


    虽然不自在，面对站立的观众，克里泽夫斯基还是娓娓道来。


    1958年，罗森布拉特就他的感知机接受采访时，有人问像感知机这样的机器会有什么实际或商业用途。“目前没有。”他笑着回答。^([^(42)](#fn42))


    “你知道吗，发明会引导应用。”


    ## 问题


    2015年6月28日周日晚上，网络开发者杰基·阿尔西内（Jacky Alcine）在家观看美国黑人娱乐电视大奖。他收到一条推送，提示有朋友通过谷歌照片同他分享了照片。他打开谷歌照片，发现网站的样子变了。“我当时想，‘哦，界面更新了！’我知道正在召开谷歌I/O大会，但我还是感到很新奇，我点开了。”^([^(43)](#fn43))


    标题是“大猩猩”。


    “我以为是我放错了照片。”他打开分组，里面全都是阿尔西内和他朋友的几十张照片，没有别的。“有70多张照片。没道理……我意识到出了问题。”


    阿尔西内发了推特。“谷歌照片，”他写道，“你们搞砸了。我的朋友不是大猩猩。”^([^(44)](#fn44))


    不到2小时，谷歌首席架构师约纳坦·尊格（Yonatan Zunger）就回应了。“我的天啊，”他写道，“这绝对不可以。”


    尊格的团队几小时就上线了对谷歌照片的修改，到第二天早上，只有2张照片仍被贴错标签。然后谷歌采取了更激进的措施：他们干脆删除了这个标签。


    3年后，2018年，《连线》报道，在谷歌照片上，“大猩猩”的标签仍然被停用。这意味着，在这几年里，任何东西都不会被标记为大猩猩，包括真正的大猩猩。^([^(45)](#fn45))


    有趣的是，2018年和2015年的媒体都错误描述了这个错误的性质。“2年后，谷歌通过清除图像分类器中的‘大猩猩’标签，解决了‘种族主义算法’问题”；“谷歌通过从图像标签中移除大猩猩来‘修正’其种族主义算法”；“谷歌照片修正了‘种族主义算法’，但效果一般。”^([^(46)](#fn46))


    阿尔西内本身是程序员，也很熟悉机器学习，他知道问题不是因为算法有偏见。（这个算法就是随机梯度下降，可以说是计算机科学中最通用、最普通、最常见的算法：随机输入训练数据，调整模型参数，提高对图像正确分类的概率，并根据需要重复。）他马上意识到，不是算法有问题，而是训练数据本身存在严重偏差。“我不能责怪算法，”他说，“这不是算法的错。它的设计没问题。”


    理论上，这个系统可以从一组例子中学到任何东西，那它当然也会受制于教给它的例子。


    ## 校准和设计主导权


    我们将日常物品视为理所当然的程度，就是它们支配和影响我们生活的程度。


    ——玛格丽特·维萨^([^(47)](#fn47))


    19世纪照相最多的美国人不是林肯，也不是格兰特，而是弗雷德里克·道格拉斯，他在20岁时逃离了奴隶制，后来成了废奴主义作家和讲师。^([^(48)](#fn48))


    在照片出现前，美国黑人的形象仅限于绘画和版画。道格拉斯写道：“黑人永远不可能从白人艺术家手中获得不带偏见的肖像。在我们看来，白人几乎不可能把黑人画得像，总是会过分夸大他们的显著特征。”^([^(49)](#fn49))


    照片胜过失真的绘画，使得人们对黑人不仅仅限于同情，还增强了认可度。道格拉斯在谈到美国第一位黑人参议员海勒姆·雷夫斯的照片时说：“不管人们对这件事有没有偏见，他们都必须承认这位密西西比参议员是个男人。”^([^(50)](#fn50))


    但也并非就此一帆风顺。随着摄影在20世纪变得更加普及，一些人意识到摄影也存在问题。正如杜·博伊斯（W. E. B. Du Bois）在1923年写道：“为什么没有更多的有色人种年轻人将摄影作为职业？普通的白人摄影师不知道如何处理有色皮肤，没有细腻的美感或色调，也不愿意下功夫，把它们表现得糟糕透顶。”


    经常有人批评电影和电视缺乏肤色多样性，演员和导演都是如此。但我们一般不会想到，这个问题不仅存在于摄影机前后，还存在于摄影机内部。正如康考迪亚大学传播学教授洛娜·罗斯（Lorna
    Roth）指出，“尽管学术文献涉及各种主题，但令人惊讶的是，很少有学者关注视觉再现设备的肤色偏见”。^([^(51)](#fn51))


    她写道，几十年来，电影制片商一直使用一张测试照片作为色彩平衡基准。这张测试照片被称为“雪莉卡”，以柯达员工雪莉·佩奇的名字命名，她是测试照片的第一位模特。^([^(52)](#fn52))


    （电视和照片一样，几十年来一直根据白人肤色校准色彩。20世纪90年代，罗斯找到《周六夜现场》的摄影师，问他们在开播前怎么校准摄像机。摄影师解释说，“技术人员会让一个女孩站在摄像机前，根据她的肤色来做微调，校准摄像机。女孩都是白人。”）^([^(53)](#fn53))


    令人惊讶的是，根据20世纪六七十年代柯达公司高管们的说法，研发对更广域的深色调敏感的胶片的主要推动力不是来自民权运动，而是来自家具和巧克力行业，他们抱怨胶片没有充分展现深色木材的纹理和黑巧克力的质感，或牛奶巧克力和黑巧克力的差别。^([^(54)](#fn54))


    柯达研发部门前经理厄尔·卡格（Earl Kage）对这段时期进行了反思：“我们部门的成员因为巧克力都变胖了，镜头前的东西拍摄结束后会被吃掉了。”当被问及这一切是否受民权运动影响时，他补充道：“有意思的是，以前从没有人这样说过，据我所知黑人肤色在当时从来都不受重视。”^([^(55)](#fn55))


    随着时间推移，柯达的肤色模特越来越多样。“我开始在测试中大量采用黑人模特，并且很快就流行起来，”柯达的吉姆·里昂（Jim Lyon）回忆道，“我并不是为了政治正确。我只想让胶片能最好地呈现每个人的肤色”。


    20世纪90年代，官方的柯达雪莉卡上有了3位不同种族的模特。他们推出的柯达金大胶卷号称可以拍摄“昏暗中的黑马”，电视广告深入人心。有一则广告是一个穿着亮白色空手道服的黑人男孩，微笑着表演空手道，可能是获得了新腰带。广告上写着：“爸，妈，除了柯达金胶卷，你们还能将这一刻托付给谁？”


    最初的目标客户导致他们的校准方法存在问题。现在，新的校准方法带来了新的客户。


    ## 修正训练集


    所有的机器学习系统，包括感知机在内，核心都有某种雪莉卡片：也就是训练用的数据集。如果某一类型的数据在训练数据中的代表不足或不存在，但在现实世界中存在，那么当训练好的系统面对这一类型的数据，给出的结果就难以预料。^([^(56)](#fn56))


    正如加州大学伯克利分校的莫里茨·哈特（Moritz Hardt）所言，“大数据的全部意义在于，拥有了更多数据，我们就能构建更好的分类器。反过来，数据越少，表现也会越差。不幸的是，族群越小，可用的数据也会成比例地减少，这是很自然的，但这也意味着关于少数族群的模型通常会不如普通人群的模型”。^([^(57)](#fn57))


    令阿尔西内沮丧的推文针对的正是这个问题。他是软件工程师，立刻明白了问题出在哪里。他推断，在谷歌的图片库中，黑人照片没有白人照片多。这个模型在看到不熟悉的东西时更容易出错。


    “我完全理解为什么会这样，”阿尔西内告诉我，^([^(58)](#fn58))


    20世纪的问题似乎在21世纪不可思议地重演。幸运的是，似乎也同样有解决方案。只要有人能站出来质疑这些21世纪的“雪莉卡片”到底代表了谁和什么，并明确指出更好的卡片应该是什么样子。


    21世纪10年代初期，乔伊·布兰维尼（Joy Buolamwini）还是佐治亚理工学院的计算机科学本科生，有一次作业是为玩躲猫猫游戏的机器人编写程序。编程很容易，但有一个问题：机器人无法识别布兰维尼黑肤色的脸。“我借室友的脸完成了作业，然后想，‘肯定会有人去解决这个问题’”。^([^(59)](#fn59))


    在本科快毕业时，她去香港参加一个创业比赛。当地一家初创公司演示了他们的“社交机器人”。这个机器人能与所有参观者正确交互……除了布兰维尼。这家初创公司使用的人脸识别开源代码正是她自己在佐治亚理工使用的那种。


    华盛顿大学的巴特亚·弗里德曼（Batya Friedman）和康奈尔大学的海伦·尼森鲍姆（Helen Nissenbaum）合写了一篇论文，是最早明确阐述计算系统偏见的文章之一，他们警告，“软件系统的传播成本相对较低，因此，一旦开发出来，有偏见的系统有可能产生广泛影响。如果成为了行业标准，偏见就会无处不在”。^([^(60)](#fn60))


    就像布兰维尼自己说的，“在世界的另一端，我了解到算法偏见的传播速度与从互联网下载文件的速度一样快”。^([^(61)](#fn61))


    在牛津攻读硕士并做了一年罗兹学者项目后，布兰维尼去了MIT媒体实验室，做了一个增强现实项目，她称之为“励志镜子”，想法是在用户的脸上装饰鼓励性的或令人振奋的视觉效果——例如，让照镜子的人变成狮子。同样，效果很好，只有一个问题。布兰维尼自己照镜子时必须戴白面具。


    罪魁祸首当然不是随机梯度下降，而很明显是训练这些系统所用的图像集。每个人脸检测或识别系统的背后都有一个图像库——通常有几万或几十万张——系统最初就是用这些图像训练和开发的。这些训练数据就是21世纪的雪莉卡片，通常不会公开：在网上传播的预训练模型几乎都没有公开训练数据。但是它肯定存在，并且永久地塑造了最终部署的系统的行为。


    因此，要根除偏见，一项重要举措就是更彻底地披露和分析主要学术和商业机器学习系统背后的训练数据集。


    例如，“自然环境下标记人脸”（LFW）数据集是最受欢迎的公共人脸图片数据库之一，该数据集是马萨诸塞大学阿默斯特分校的一支团队于2007年基于网络新闻图片创建的，此后被无数研究人员采用。^([^(62)](#fn62))


    2007年最早介绍该数据库的论文指出，从在线新闻中收集的图像“显然自身带有偏见”，但文中指出的“偏见”是从技术而非社会角度来考虑：“例如，在极高或极低光照条件下的图像并不多。”除了光照问题，作者写道，“提供的照片范围和多样性非常大。”

