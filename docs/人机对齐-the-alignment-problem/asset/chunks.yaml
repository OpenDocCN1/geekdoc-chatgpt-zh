    Overview of Multi-Task Learning in Deep Neural Networks”。这个想法有时也被称为构造具有多个“头”——共享相同中间层特征的高层输出——的神经网络。这个想法已经在机器学习界获得了一定关注，最近刚刚在21世纪10年代的旗舰神经网络之一`AlphaGo
    Zero`中崭露头角。当DeepMind迭代他们的冠军，淘汰`AlphaGo`架构时，他们意识到可以将两个主网络合并成一个双头网络，从而极大地简化他们的系统。最初的`AlphaGo`使用“策略网络”来估计针对给定的棋局该怎么下棋，使用“价值网络”来估计该棋局下双方的优势或劣势。DeepMind意识到，相关的中间层“特征”——谁控制着哪个区域，某些结构有多稳定或脆弱——在两个网络中可能非常相似。为什么要重复？在随后的`AlphaGo
    Zero`架构中，“策略网络”和“价值网络”变成了依附于同一个深度网络的“策略头”和“价值头”。这个新的，类似地狱犬的网络更简单，哲学上更令人满意，也比原来的更强大。（严格来说，地狱犬在神话中经常被描述为三头；他不太为人所知的兄弟奥思忒斯倒是双头，守护着吉里昂的牛群。）[↩](#fnref234)


