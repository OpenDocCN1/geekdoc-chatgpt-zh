    # 脚注


    ### 31.

    1962 年播出的家庭喜剧动画片，片中杰 ason 一家居住在一个充满了各种奇妙精细的机器人装置、外星人、全息图以及各种异想天开的小发明的未来世界。↩


    ### 32.

