    Faust&Meehl，“《临床与精算判断》”。对这些问题的当代观点，参见例如，Kleinberg 等，“《人类决策与机器预测》”。↩


    207. Graeber，《规则的乌托邦》。↩


    208. Schauer，“《给出理由》”。↩


    209. 参见 Goldberg，“《人与人模型之争》”，和 Dawes，“《研究生录取案例研究》”。↩


    210. Dawes&Corrigan，“《决策中的线性模型》”。另见 Wainer，“《线性模型中系数的估计》”，特别是关于等权重的详细探讨；正如他写的，“当你对预测感兴趣时，要求回归不相等权重的情形非常罕见”。另见
    Dana&Dawes，“《回归在社会科学预测中的简单替代方法的优越性》”，这篇文章在社会科学（和 21 世纪）的背景下肯定了这一结论。↩


    211. 参见 Dawes，“《决策中不当线性模型的稳健之美》”。↩


    212. Howard&Dawes，“《婚姻幸福的线性预测》”。↩


    213. 事实上，保罗·弥尔自己总结道，“在大多数实际例子中，平均而言，少量‘大’变量的等权重和优于回归方程”。讨论和参考文献参见 Dawes&Corrigan，“《决策中的线性模型》”。↩


    214. Dawes，“《决策中不当线性模型的稳健之美》”。另见 Wainer，“《线性模型中系数的估计》”：“还要注意，这种\[线性模型中的等权重\]方案即使在操作标准不可用的情况下也能很好地工作。”↩


