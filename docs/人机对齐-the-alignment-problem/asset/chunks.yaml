    等，“Validation of Clinical Classification Schemes for Predicting Stroke”，关于 CHA[2]DS[2]——VASc
    的更多细节，参见 Lip 等，“Refining Clinical Risk Stratification for Pre-dicting Stroke and Thromboembolism in Atrial Fibrillation Using a Novel Risk Factor-Based Approach”。


