    Averaging：A Tutorial”。↩


    601. 特别是，人们发现丢弃有助于防止网络过于脆弱地“过拟合”其训练数据。参见 Srivastava 等，“Dropout”，这篇文章在发表后 6 年内被引用达惊人的
    18500 次。↩


