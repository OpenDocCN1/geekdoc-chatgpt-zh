    201. 布莱斯·古德曼，私人访谈，2018 年 1 月 11 日。对“有权要求……解释”最早的讨论参见古德曼&弗拉克斯曼，“欧盟关于算法决策的法规和‘解释权’”。一些学者争议这个条款有多强；参见瓦赫特,
    米特尔施塔特&弗洛里迪，“为什么在《通用数据保护条例》中不存在自动化决策的解释权”。还有一些人对此进行了跟进，参见例如，塞尔布斯特&鲍尔斯，“有意义的信息与解释权”。↩


    202. 米尔，“我那本令人不安的小书的原因和影响”。↩


    203. 道斯&科里根，“决策中的线性模型”，引自萨宾，“对精算和个人预测方法的研究的贡献”。↩


