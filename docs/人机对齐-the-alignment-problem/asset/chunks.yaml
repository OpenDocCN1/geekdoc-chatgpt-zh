- raw: '从更哲学的角度来看，这些技术表明，至少就神经网络而言，评论家和艺术家的界线可能很模糊。经过训练的网络可以**识别**，比如说湖泊或大教堂，利用同样的方法，也可以**生成**一个又一个湖泊，或者一个又一个大教堂的图像，它从未见过的图像。这是一条美丽的，可能也是辛苦的艺术实践路径：任何人只要具备艺术鉴赏力就可以是创造者。你所需的只是良好的品位、随机的变化和充足的时间。


    诸如此类的技术不仅开辟了广阔的审美空间，而且具有重要的网络诊断用途。例如，莫尔文采夫、奥拉和泰卡利用从噪点图开始优化的技术，让图像分类系统对所有不同类别都“生成”最类似的图像。“在某些情况下，”他们写道，“这会揭示出，神经网络并不是真的在看我们认为它在看的东西。”例如，最大化“哑铃”分类的图片包括超现实的、肉色的、无身体的手臂。“没错，是有哑铃，”他们写道，“但是生成的哑铃图片都含有举起哑铃的手臂。这说明网络未能完全领会哑铃的本质。也许它从未见过没有被手臂举起的哑铃。可视化可以帮助我们纠正此类训练失误。”
    ^([^(243)](#fn243))


    从最初的深度梦境项目开始，泰卡在谷歌合作创建了艺术家和机器智能项目，并继续探索机器学习的审美可能。奥拉和莫尔文采夫及其合作者则在继续探索可视化和网络诊断。
    ^([^(244)](#fn244))


    这个团队对研究进展总体上表达了有分寸但有感染力的乐观态度。他们写道：“为了构建强大且值得信赖的可解释界面，我们还有很多工作要做。但是，一旦成功了，可解释性将有望成为一个强有力的工具，支持有效的人工监督，并建立公平、安全和对齐的AI系统。”
    ^([^(245)](#fn245))


    尤其是在视觉领域，已经取得了很大进步。但如果不从视觉层面，而是从**概念**层面来理解网络，又该怎么做呢？例如，有没有办法通过文字来理解网络内部？这是解释的最新前沿之一。


    **深度网络和人类概念**


    2012年秋天，MIT的研究生贝·金姆（Been Kim）刚开始攻读博士，就投身于一个将影响她未来人生的项目。她之前一直在机器人领域，为了更熟悉工业机器人环境，她甚至考了叉车驾照，但最终她还是认为这个领域不适合自己。“我意识到机器人有硬件局限性，”她告诉我，“我想做的目前还做不到”。
    ^([^(246)](#fn246))


    金姆逐渐意识到可解释性就算不是她的终身事业，至少也会成为她的论文主题。那年12月，她第一次参加NeurIPS会议时，遇到了一位年长的同行。“我告诉那位老师，我在研究可解释性，他说，‘哦，为什么？神经网络会解决一切！干嘛研究这个？’我就想，‘好吧……’”她一边回忆一边笑，“想象你去看医生，医生说：‘嗯，我要把你切开，取出一些东西。’你会问：‘哦，为什么？’他说：‘嗯，我不知道。机器说这是你的最佳选择。99.9%。’”


    “你会问什么？”她说。她举的例子略显夸张，但又不是夸张。“你会对医生说什么？对我来说，这是摆在眼前亟待解决的问题。我不知道人们需要多久才会意识到这很重要。”傍晚时分，夕阳透过玻璃照进谷歌大脑的会议室。自2017年以来，金姆一直在谷歌大脑工作。“时机可能已经成熟。”


    金姆认为，解读和阐释包含内在的人性维度，因此这个领域存在内在的混乱和跨学科性。“其中尚未被充分开发的很大一部分，涉及对人性的思考，”她说，“我一直强调人机交互和认知科学……没有这些，我们就无法解决这个问题。”认识到可解释性不可避免的人性一面，意味着事物并不总是能干净利落地转化为熟悉的计算机科学语言。


    “有些人认为，你必须给出数学定义，说明什么是解释。我认为这不现实，”她说，“不可量化的东西让计算机科学家感到不自在，天生就不舒服。”


    金姆的所有论文几乎都涉及基于人类受试者的实际研究，这类研究在计算机科学中很罕见。“通过用户进行迭代至关重要，”她说，“因为它存在的唯一理由是为人类所用……我们必须**证明**它对人类有益。”这个迭代很关键，因为设计师认为对人类用户有用的东西经常没有用。如果解释文档或可解释的模型是供真实的人使用，那么它的设计过程就应该像设计驾驶舱控制面板或软件界面一样反复迭代。
    ^([^(247)](#fn247))


    这些研究为之前提倡使用简单模型的故事增加了一些复杂性。金姆指出，使用简单模型是否是最好的解释方法，最终是一个经验问题。“在某些情况下，在非常有限的情况下，你可以十分肯定并通过经验验证，**如果**特征很少，它对于特定的任务是可解释的，在这种情况下，你当然可以就给定问题给出最可解释的模型，然后你可以优化它。”但是金姆等人对真正人类的研究表明，在现实世界中事情很少这么简单。


    例如，2017年，微软研究院的詹·沃特曼·沃恩（Jenn Wortman Vaughan）和同事研究了人类用户与机器学习的房屋价值模型的互动方式，该模型基于面积、浴室等特征来预测价格。当模型使用的特征较少并且对用户更加“透明”时，用户预测与模型预测更一致。但是无论是简单性还是透明度都不会影响人们对模型的**信任**度。事实上，当模型更透明时，人们反而**更不**容易意识到模型错了。
    ^([^(248)](#fn248))


    金姆认为，“人类使用概念来思考和交流”，而不是数字。 ^([^(249)](#fn249))


    例如，某个模型正确识别了斑马图片，如果TCAV发现网络在识别时使用了“条纹”“马”和“稀树草原”等概念，则似乎是合理的。又例如，用一组医生照片初步训练的网络可能由于数据集有偏差而认为“男性”概念有一定的判断价值。TCAV将揭示这一点，提醒我们可能需要调整模型或训练数据，以消除这种偏见。
    ^([^(250)](#fn250))


    我们怎样才能获得这种洞察力？之前用模型生成的图像不仅使用了最终的类别标签输出，还涉及网络**内部**活动的宏大模式，涵盖数千万个神经元。这些内部激活虽然在人眼看来只是一片嘈杂，但**机器**可以对其进行处理。TCAV的基本思想是，对于任何你感兴趣的概念，比如医生例子中的“男性”概念，你给网络展示一些男性的图像，然后再展示一些随机的其他东西的图像：女人、动物、植物、汽车、家具等等。你把网络的内部状态（比如某个特定的层）输入给另一个系统，一个简单的线性模型，让它学习辨别某个类别（这里是“男性”）的典型激活和非此类图像触发的激活。
    ^([^(251)](#fn251))


    “我认为这种方法有个独特的好处，”她说，“解释用的是用户的语言。用户不必了解机器学习……我们可以用**他们的**语言来解释，用他们自己的术语回答**他们的**疑虑。”
    ^([^(252)](#fn252))


    金姆用TCAV探查了两个流行的图像识别模型，Inception v3和GoogLeNet，发现了许多此类问题。例如，“红色”概念对“消防车”概念至关重要。“**如果**你所在地区消防车是红色的，这是合理的，”她说。
    ^([^(253)](#fn253))


    金姆还发现“手臂”概念对识别“哑铃”很重要，这印证了谷歌深度梦境团队之前的视觉发现，意味着该网络可能不擅长识别架子上或地上的哑铃。 ^([^(254)](#fn254))


    谷歌CEO桑达尔·皮查伊（Sundar Pichai）在谷歌2019年I/O大会上发表主题演讲时，重点介绍了金姆的TCAV研究。“仅仅知道模型是否有效是不够的，”皮查伊说，“我们还需要知道它是**如何**运作的。”


    2012年，金姆觉得这些担忧几乎没有听众，只有她，再加上她在MIT的导师辛西娅·鲁丁和朱莉·沙阿（Julie Shah），“对这个话题有一些兴趣”。到2017年，在该领域最大的会议上，已经有了专门讨论可解释性和解释方法的研讨会。2019年，谷歌CEO在公司最重要的展示舞台自豪地介绍了她的工作。


    我问金姆是否感觉像拨云见日。


    “我们还有很长的路要走。”她似乎不愿让自己有些许自满，或是“我早就告诉过你”的感觉。相反，她感受到的是沉甸甸的责任：面对技术的快速更新和部署，这些问题必须更快地得到解决。她必须走在潮流的前面，确保不会出现高风险问题。


    当我们结束谈话，走出会议室时，我感谢金姆给了我时间，并问她是否还有什么想补充的。她若有所思地停顿了大约10秒钟，然后突然想起了什么。


    “还记得我之前提到的那位老师吗？”2012年，当她还是博士一年级时，跟他提到她的博士论文是研究可解释性，他认为这是死胡同，还劝她换方向。不过，她并不反感他：“我认为他是在很诚恳地给我建议……这在当时其实很合理，完全出于好心。”


    金姆咧嘴一笑：“他现在也在研究可解释性。”


