    677. 参见奥莫洪德罗，“基本人工智能驱动”。另见例如，蒙哥马利 1921 年《绿山墙的安妮》系列小说中的《壁炉山庄的丽拉》，书中丽拉沉思道：“我不想回到两年前的那个女孩，即使我能……而且……再过两年，当我回首往事时，我可能也会感谢他们带给我的成长；但我现在不想要了。”奥利弗小姐回应道：“我们从来不这样做。我想，这就是为什么我们不能选择自己的发展方式和衡量标准。”↩


