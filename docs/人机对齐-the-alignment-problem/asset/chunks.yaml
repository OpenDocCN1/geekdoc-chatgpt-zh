- raw: '在这个领域，最强大的模型一般也最难理解，最容易理解的也最不精确。“这让我很不爽，”他告诉我，“我想为医疗保健领域做机器学习。神经网络真的很好，很精确；但是它们完全不透明，不可理解，我认为目前这个还很危险。也许我不应该在医疗保健领域做机器学习。”
    ^([^(191)](#fn191))


    “广义相加模型”是他最喜爱的模型之一，这种模型最早由统计学家特雷弗·哈斯蒂（Trevor Hastie）和罗伯特·蒂布施拉尼（Robert Tibshirani）在1986年提出。
    ^([^(192)](#fn192))


    在最初的肺炎研究过去多年后，卡鲁阿纳重新读取了数据集，构建了一个广义相加模型。结果发现，广义相加模型和他原来的神经网络一样精确，并且更加透明。例如，他绘图将肺炎死亡率风险表示为年龄的函数。这个图很大程度上符合人们的预期：如果患肺炎，年轻或中年会好一点，年老会更危险。但有一件事很引人注目：从65岁开始突然出现了风险剧增。某个特定的生日会引发风险突然增加，这似乎很不寻常。发生了什么事？卡鲁阿纳意识到，这种模型捕捉到了**退休**的影响。“这真的很烦人，这很危险，对吗？你预期退休后风险会**降低**；然而，它增加了。”
    ^([^(193)](#fn193))


    更重要的是，他看得越仔细，看到的令人不安的关联就越多。他曾担心自己原来的神经网络不仅学会了有问题的哮喘相关性，还学会了其他类似的相关性，尽管当时简单的基于规则的模型还不足以向他展示神经网络中还潜藏着什么。20年后，他**有了**强大的可解释模型。这就像有了更强大的显微镜，突然可以看到枕头上的螨虫和皮肤上的细菌。


    “我看着它，心想，‘哦，天哪，简直不敢相信’。它认为胸痛对你有好处。它认为心脏病对你有好处。它认为超过100岁对你有好处……它认为所有这些显然没好处的事情都对你有好处。”
    ^([^(194)](#fn194))


    这些和哮喘有相同的医学意义；这种相关性是真实的，但同样真实的是，这些患者会被优先安排重症监护，这使得他们能够存活。


    “感谢上帝，”他说，“我们没有部署神经网络。”


    卡鲁阿纳发现自己现在的立场变得与大多数研究人员不同。他继续开发模型架构，要做到与神经网络同等水平的预测准确性，同时还要容易理解。但是，他没有宣传自己发明的任何特定解决方案，例如新版本的广义相加模型
    ^([^(195)](#fn195))


    他告诉我，“我现在的目标是吓唬人。恐吓他们。如果他们停下来想，**哦，天哪，这里真的有问题。**我就觉得我成功了。”


    **黑盒问题**


    大自然隐藏她的秘密是因为她崇高，而不是因为她是骗子。


    ——爱因斯坦


    给出理由的行为是权威的对立面。当权威的声音失效时，理性的声音就会出现。反之亦然。


    ——弗雷德里克·绍尔（Frederick Schauer） ^([^(196)](#fn196))


    卡鲁阿纳绝不是近年来唯一认为**这里真的有问题**的人。随着机器学习模型在世界各地的决策基础设施中激增，许多人意识到自己对这些模型中实际发生的事情知之甚少，并对此感到不舒服。


    卡鲁阿纳对于部署大规模神经网络持非常谨慎的态度，因为它们也被称为“黑匣子”。随着神经网络在从工业到军事到医学的各个领域的飞速发展，越来越多的人感受到了同样的不安。


    2014年，DARPA（美国国防高级研究计划局）项目经理大卫·冈宁（Dave Gunning）与信息创新办公室主任丹·考夫曼（Dan Kaufman）聊天。“我们当时正想在AI领域激发新想法，”冈宁告诉我。
    ^([^(197)](#fn197))


    大约在同一时期，冈宁参加了由情报部门在北卡罗莱纳州立大学分析科学实验室举办的一场会议。该研讨会汇集了机器学习研究人员和数据可视化专家。“有一位政府的情报分析师在场听我们谈论这些机器学习技术，”冈宁回忆道，“这位分析师提出的问题是，她必须在大数据算法给出的建议上签字。如果你愿意，根据建议正确与否，她可以得到评分。但她不明白学习算法给出的建议是什么道理。”她应该在上面签名吗？她应该根据什么来决定？


    随着计算技术的进步，国防领域开始越来越多地思考自动化战场会是什么样子，自主武器的想法有哪些风险和问题。但是很多人认为，大部分这类问题暂时还只存在于理论上。


    “机器学习已经应用于情报分析这类领域了，”冈宁说，“你明白我的意思吗？这个问题已经存在了。他们需要帮助。”


    在接下来的2年里，冈宁主管了一个持续多年的DARPA项目，这个项目试图直面这个问题。他称之为XAI：可解释的（explainable）AI。


    在大西洋的另一边，欧盟正准备通过一项名为《通用数据保护条例》（GDPR）的综合性法律。GDPR于2018年生效，并将极大地改变公司收集、存储、共享和使用在线数据的方式。这些规定总共有260页，是数据隐私史上最重要的文件之一。其中还包括一些更奇怪、更有趣、也许同样深刻的东西。


    2015年秋天，牛津互联网研究所的布莱斯·古德曼（Bryce Goodman）正在翻阅立法草案，突然有东西引起了他的注意。“我学了一些关于机器学习的知识，知道一些最好的方法并不具备透明性或可解释性，”他说，“然后我遇到了这个问题。在GDPR的早期草案中，非常明确地提出，人们应该有权要求对基于算法做出的决定进行解释。”
    ^([^(198)](#fn198))


    “我觉得这很有趣，”他说，“当有这些立法或诸如此类的东西时，有人会在地上放一个木桩，然后说，**这个东西现在已经有了。”**


    古德曼找到了他的牛津同事塞思·弗莱克斯曼（Seth Flaxman），后者刚刚获得了机器学习和公共政策的博士学位。“嘿，我在GDPR里发现了这个东西，”古德曼说，“这里似乎存在问题。”


    “他说：‘是的，好像是有问题。’”


    无论是贷款被拒绝，申请信用卡被拒绝，被拘留待审，还是被拒绝假释，如果背后有机器学习系统，你不仅有权知道发生了什么，而且有权知道**为什么**。


    次年春天，即2016年，欧洲议会正式通过了GDPR，整个科技行业的高管们都惴惴不安。律师与欧盟监管机构谈判。“你们应该知道，”他们说，“从深度神经网络得到可理解的解释是尚未解决的科学问题。”正如古德曼和弗莱克斯曼所写，这“可能需要对标准和广泛使用的算法技术进行全面修订”。监管机构并没有被这一点打动：“这就是为什么要到2018年才生效。”


    正如一位研究人员说的：“他们给了我们一个2年内解决极为困难的研究问题的通知。”


    GDPR现在已经生效，尽管欧盟监管机构要求的具体细节，以及什么构成了充分的解释——对谁，在什么背景下——仍在制定中。与此同时，透明度——理解机器学习模型内部发生了什么以及它为什么会这样做的能力——已经成为该领域最明确而且重要的优先事项之一。此后关于这个问题的工作一直在全力推进，并且最近在很多方面都取得了进展。以下是我们了解的情况。


    **临床与统计预测的比较**


    有一个流行的误解，专家通过神秘的启示成功判断人。当然，这是胡说八道。他成功是因为他在事实或权衡事实的方式上很少犯错。足够的洞察力和调查能让我们保留主观印象判断的所有优势（包括它的速度和方便性），同时不受制于其缺陷。


    ——爱德华·桑代克（Edward Thorndike） ^([^(199)](#fn199))


    当面对透明度问题，尤其是大型、复杂的模型，我们需要考虑的第一件事是，我们是否应该使用大型或复杂的模型。首先，我们应该使用模型吗？


    这些问题贯穿了统计学和机器学习的历史，它们在今天和以往一样有意义，而且答案相当令人惊讶。


    1954年，罗宾·道斯（Robyn Dawes）在哈佛大学主修哲学，专攻伦理学。他的论文《审视分析》研究了道德判断是否以及在何种程度上根植于情感。


    道斯不仅认为这些问题很重要，他还认为“**实证**研究也很重要。但是，如何进行实证研究呢？”思考这个问题后，他意识到他的兴趣更多地在于心理学而不是哲学。他申请了心理学研究生，密歇根大学的心理学是美国最好的，录取窗口的最后一天他被列入候选名单。惊喜的道斯把这个好消息告诉了导师，导师告诉他：“趁他们还没反悔，赶紧同意。”
    ^([^(200)](#fn200))


    道斯去了密歇根州，接受临床心理学训练。当时是50年代末60年代初，罗夏墨迹测验还很受重视。道斯发现自己越来越怀疑罗夏测试作为临床工具有没有作用。“一切都是直觉的，而且有直觉意义。但后来我开始阅读，发现事实上，从经验来看，很多这类东西都不起作用。”


    道斯开始产生怀疑时，他正在精神病房当住院医生。“有一个患者有幻觉，”他回忆道，“他觉得自己的乳房在生长。他归我管，顺便说一下，是一间上锁的病房，因为他有幻觉，那肯定是精神分裂症。呃，他为什么会认为自己在长乳房？嗯，那周早些时候，他的父亲还是母亲在他产生幻觉之前自杀了。嗯，解释得通，对吧？……他们甚至没有要求患者脱衣检查。他被送进精神病房，在我们组一间上锁的病房里待了6星期。当他们要求他脱下衬衫时，事实的确如此：他的乳房在增大。”患者患有克氏症：一种由额外的X染色体引起的遗传疾病，症状包括体毛缺失和乳腺组织发育。道斯被激怒了。“他的生命中有6个星期被抛弃了，”他说，“因为人们确信，**哦，这是一个迷人的幻觉。**”


    这导致了道斯职业生涯的一个重要转折点，从临床实践转向当时被称为“数学心理学”的领域。他有一篇论文打算投稿，将专家的临床判断与简单的数学模型进行比较，他把论文拿给朋友看。朋友的反应让道斯措手不及。“他有点意味深长地看着我说，‘你确定你没有抄袭？’”


    道斯不经意间闯入了一个他不知道的学术谱系。将专家判断与简单的数学模型（当时被称为“精算”方法）进行对比的问题可以追溯到20世纪40年代初，当时欧内斯特·伯吉斯的一个同事叫西奥多·沙宾（Ted Sarbin）。沙宾研究了对明尼苏达州大学新生学业表现的预测。“精算”模型是一个简单的线性回归，仅根据两个数据预测他们的大学平均成绩：高中班级排名和大学入学能力测验分数。人类的预测由有经验的临床心理学家给出，他们可以获得这两个数据，加上额外的测试，一份8页的档案，访谈记录，以及他们对学生的第一印象。


    沙宾发现两者的预测没有可测量的差异。如果说有什么不同的话，那就是精算模型更准确，尽管并不明显。根据沙宾的发现，心理学家获得的额外信息似乎没有增加预测的准确性，这令人难以置信。“奋斗、学习和玩耍的习惯、天赋、情感特征、系统的干扰以及成百上千的其他条件呢，”他写道，“这些难道不都与被称为学业成就的复杂社会心理行为相关？”
    ^([^(201)](#fn201))


    沙宾的结论是，花在访谈上的大量时间纯粹是浪费。他警告说：“除非通过统计研究检验，否则社会科学中的案例研究方法一文不值。”


    沙宾的发现引起了年轻心理学家保罗·弥尔（Paul Meehl）的注意。受沙宾的挑战启发，弥尔决定自己研究一下，于是他开始了一项调查，调查结果写成了一本书：1954年出版的《临床与统计预测》。尽管书中大部分是致力于理解临床判断的内容以及临床医生如何做决定，但其影响最大的部分是对临床判断和精算判断进行比较的章节。弥尔发现，人类专家输得很彻底。在差不多100个领域中，人类专家只在6个领域有一点优势。“有人告诉我，”弥尔回忆道，“在一所推崇弗洛伊德的中西部大学，一半的临床教师因为我的小书陷入了为期半年的反应性抑郁。”
    ^([^(202)](#fn202))


    道斯发现自己无意中成了抄袭者，也对弥尔的书产生了浓厚兴趣，但他的导师似乎不认可这种兴趣。“我的精神分析导师告诉我，弥尔是天才，所有人都知道他是天才，但他所做的与我们做的无关。我开始担心，如果他做的事情和我们做的无关，也许我**不想**做我们做的事情。”


    到了20世纪70年代中期，当时在俄勒冈研究所的道斯，沿着之前的思路写了一篇关于脑震荡的论文。正如他总结的，沙宾和弥尔提出了一个问题，即纯粹的统计分析为何能与人类专家的判断媲美。“统计分析曾被认为提供了有经验的临床医生的判断可以与之相比的底线，”道斯写道，“结果地板变成了天花板”。
    ^([^(203)](#fn203))


    在沙宾最初的论文发表30年后，后来又出现了数十项研究，道斯总结道：“搜索文献未发现有任何研究能证实临床判断优于统计预测（当两者都基于相同的可编码输入变量时）。”
    ^([^(204)](#fn204))


    这幅图景确实令人羞愧。即使将统计预测作为额外数据提供给人类专家，他们的决策**仍然**不如直接使用预测。 ^([^(205)](#fn205))


    这个结论得到了此后众多研究的支持，因此我们应该停下来思考一下。 ^([^(206)](#fn206))


    然而，还潜藏着一个诱人的问题：该怎样解释这个惊人的结论？人类的判断真的那么糟糕？几个变量的简单线性模型真的那么好？或者……是不是有第三种可能：人类的专业知识以某种最意想不到的方式进入了简单模型？我们是不是找错了地方？


    **非最适模型：知道该看什么**


    一些真正的问题很难，这一事实并不意味着所有真正的问题都很难。


    ——罗伯特·霍尔特（Robert Holte） ^([^(207)](#fn207))


    人类不能像计算机那样有效组合信息，这一事实并不意味着人类能被机器取代。但这的确意味着人机系统的必要性就在眼前。


    ——希勒尔·艾因霍恩（Hillel J. Einhorn） ^([^(208)](#fn208))


    道斯和俄勒冈研究所的同事想彻底弄清楚为何简单的线性模型在决策中那么有效。


    一种假设是，这些模型的表现之所以优于专家，或许是因为存在某种“群体智慧”效应：一个模型整合了一群专家的判断，所以它当然会胜过任何一个专家。这听起来似乎合理，但事实并非如此。令人惊讶的是，即使模型被训练成只模仿一个专家的判断，它仍然胜过专家！
    ^([^(209)](#fn209))


    也许是因为线性模型的优化方式，也就是调整参数以获得每个变量的最优权重。道斯与伯纳德·科里甘（Bernard Corrigan）合作，比较了专家和非最适线性模型，这些模型的权重没有进行优化。他们试了**相等**权重，也试了**随机**权重。


    结果令人震惊。随机权重的模型——只要被限制为正——至少和专家一样准确。相等权重的模型则更准确。 ^([^(210)](#fn210))


    这种快速简单的非最适模型的实际可能性似乎无穷无尽。20世纪70年代中期，道斯和一位内科医生一起参加了一个小组。在酒吧里，医生问他：“比如，你能不能用你的非最适线性模型来判断我和我妻子相处得有多好？”
    ^([^(211)](#fn211))


    道斯马上想出了他能想到的最简模式：他认为，好的婚姻应该有更多的性而不是争吵，因此可以用一对夫妇在几周或几个月内做爱的次数（“定义为有或没有高潮的生殖器结合”），减去他们在同一时间段争吵的次数（“至少一方变得不合作的状态”）。“线性模型的精髓是简单：用性爱频率减去争吵频率。正差对应幸福，负差对应不幸福。”
    ^([^(212)](#fn212))


    事实上，在许多情况下，等权重模型甚至好于最优回归，这似乎不太可能，因为最优权重是通过精确计算选择的。但它们是对于特定的背景和特定的一组训练数据最优，而背景并不总是一致：例如，明尼苏达州大学预测学习成绩的最优权重不一定等于卡内基·梅隆大学预测学习成绩的最优权重。在实践中，等权重似乎在各种情况下都更有效，也更稳健。
    ^([^(213)](#fn213))


    道斯对此非常着迷。考虑到世界的复杂性，为什么这种呆板简单的模型——对相等权重属性的简单计数——不仅有效，而且比人类专家和最优回归都**更有效**？


    他想到了几个答案。首先，尽管现实世界很复杂，但许多高层关系呈现所谓的“条件单调”，它们不会以特别复杂的方式相互影响。比如说，不管一个人的健康状况怎么变化，20多岁时几乎**总是**好于30多岁。不管一个人的智力、动机和职业道德怎么样，标准化考试分数高10分几乎**总是**要好于低10分。不管一个人的犯罪史和自控力等因素怎么样，记录在案的逮捕次数少一次几乎总是要好于多一次。


    第二，任何测量都有误差。无论是从理论还是直觉来看，测量越容易出错，就越应当以线性方式进行测量。


    道斯认为，从一致性的角度来看，最具挑衅性的也许是，等权重模型胜过了相应的最优权重模型，因为正如我们知道的，权重会根据某种客观函数进行调整。在现实中，我们经常要么无法准确定义该如何衡量成功，要么没有时间等待这个基本事实出现，以便调整我们的模型。“例如，”他写道，“在决定录取哪些学生读研究生时，我们希望预测某种可以被称为‘职业自我实现’的长远变量。我们知道这个概念的含义，但是没有完善、精确的定义。（即使有，也不可能基于学生当前的记录进行研究，要等到学生完成博士工作至少20年后才能评估。）”道斯认为，如果我们不知道自己到底想要什么，甚至根本没有数据，非最适模型应该不会差于原始直觉。
    ^([^(214)](#fn214))


    然而，有人可能会对道斯和科里甘的比较研究持反对意见，尤其是与人类专家的比较，似乎并不完全公平。模型并不是随机选取几个特征；它们是人类通过几十年甚至几代人的优化，发现的最相关和最具预测性的因素的线性组合。


    也许有人会说，所有这些“预处理”活动——从无限的可用信息中决定哪2个、5个或10个与手头的决定最相关——反映了对问题的真正智慧和见解：实际上，人类已经完成了所有的艰苦工作，然后再将其教给线性模型，才让线性模型窃取了所有荣誉。道斯的观点正是如此。他写道：“线性模型不能代替专家来决定‘看什么’之类的事情，而正是这种在做决定时知道该看什么的知识才是人类专家特有的技能。”
    ^([^(215)](#fn215))


    道斯的结论是，人类专家知识的特点在于知道该看什么，而不是知道整合这些信息的最优方式。这一想法最清晰的证明之一来自决策理论专家希勒尔·艾因霍恩1972年的一项研究。
    ^([^(216)](#fn216))


    换句话说，我们一直在错误的地方寻找人类智慧。也许它并不位于人类决策者的思维中，而是体现在标准和实践中，这些标准和实践决定了将哪些信息放到他们面前。剩下的只是计算。


    道斯用第三种方式表达了这个观点，这可能也是他传奇生涯中最著名的一句话：“关键在于知道该看哪些变量，然后是知道做加法。” ^([^(217)](#fn217))


    **最优简单模型**


    其实简单比复杂更难，你必须竭尽全力才能做到简单。但最终这样做是值得的，因为你一旦做到了简单，你就能移山填海。


    ——史蒂夫·乔布斯 ^([^(218)](#fn218))


    我不认为贴近复杂的简单毫无价值，但我更喜欢远离复杂的简单。


    ——奥利弗·霍姆斯（Oliver Wendell Holmes Jr.） ^([^(219)](#fn219))'
  fmt: '

    在这个领域，最强大的模型一般也最难理解，最容易理解的也最不精确。“这让我很不爽，”他告诉我，“我想为医疗保健领域做机器学习。神经网络真的很好，很精确；但是它们完全不透明，不可理解，我认为目前这个还很危险。也许我不应该在医疗保健领域做机器学习。”
    ^([^(191)](#fn191))


    “广义相加模型”是他最喜爱的模型之一，这种模型最早由统计学家特雷弗·哈斯蒂（Trevor Hastie）和罗伯特·蒂布施拉尼（Robert Tibshirani）在1986年提出。
    ^([^(192)](#fn192))


    在最初的肺炎研究过去多年后，卡鲁阿纳重新读取了数据集，构建了一个广义相加模型。结果发现，广义相加模型和他原来的神经网络一样精确，并且更加透明。例如，他绘图将肺炎死亡率风险表示为年龄的函数。这个图很大程度上符合人们的预期：如果患肺炎，年轻或中年会好一点，年老会更危险。但有一件事很引人注目：从65岁开始突然出现了风险剧增。某个特定的生日会引发风险突然增加，这似乎很不寻常。发生了什么事？卡鲁阿纳意识到，这种模型捕捉到了**退休**的影响。“这真的很烦人，这很危险，对吗？你预期退休后风险会**降低**；然而，它增加了。”
    ^([^(193)](#fn193))


    更重要的是，他看得越仔细，看到的令人不安的关联就越多。他曾担心自己原来的神经网络不仅学会了有问题的哮喘相关性，还学会了其他类似的相关性，尽管当时简单的基于规则的模型还不足以向他展示神经网络中还潜藏着什么。20年后，他**有了**强大的可解释模型。这就像有了更强大的显微镜，突然可以看到枕头上的螨虫和皮肤上的细菌。


    “我看着它，心想，‘哦，天哪，简直不敢相信’。它认为胸痛对你有好处。它认为心脏病对你有好处。它认为超过100岁对你有好处……它认为所有这些显然没好处的事情都对你有好处。”
    ^([^(194)](#fn194))


    这些和哮喘有相同的医学意义；这种相关性是真实的，但同样真实的是，这些患者会被优先安排重症监护，这使得他们能够存活。


    “感谢上帝，”他说，“我们没有部署神经网络。”


    卡鲁阿纳发现自己现在的立场变得与大多数研究人员不同。他继续开发模型架构，要做到与神经网络同等水平的预测准确性，同时还要容易理解。但是，他没有宣传自己发明的任何特定解决方案，例如新版本的广义相加模型
    ^([^(195)](#fn195))


    他告诉我，“我现在的目标是吓唬人。恐吓他们。如果他们停下来想，**哦，天哪，这里真的有问题。**我就觉得我成功了。”


    ## 黑盒问题


    大自然隐藏她的秘密是因为她崇高，而不是因为她是骗子。


    ——爱因斯坦


    给出理由的行为是权威的对立面。当权威的声音失效时，理性的声音就会出现。反之亦然。


    ——弗雷德里克·绍尔（Frederick Schauer） ^([^(196)](#fn196))


    卡鲁阿纳绝不是近年来唯一认为**这里真的有问题**的人。随着机器学习模型在世界各地的决策基础设施中激增，许多人意识到自己对这些模型中实际发生的事情知之甚少，并对此感到不舒服。


    卡鲁阿纳对于部署大规模神经网络持非常谨慎的态度，因为它们也被称为“黑匣子”。随着神经网络在从工业到军事到医学的各个领域的飞速发展，越来越多的人感受到了同样的不安。


    2014年，DARPA（美国国防高级研究计划局）项目经理大卫·冈宁（Dave Gunning）与信息创新办公室主任丹·考夫曼（Dan Kaufman）聊天。“我们当时正想在AI领域激发新想法，”冈宁告诉我。
    ^([^(197)](#fn197))


    大约在同一时期，冈宁参加了由情报部门在北卡罗莱纳州立大学分析科学实验室举办的一场会议。该研讨会汇集了机器学习研究人员和数据可视化专家。“有一位政府的情报分析师在场听我们谈论这些机器学习技术，”冈宁回忆道，“这位分析师提出的问题是，她必须在大数据算法给出的建议上签字。如果你愿意，根据建议正确与否，她可以得到评分。但她不明白学习算法给出的建议是什么道理。”她应该在上面签名吗？她应该根据什么来决定？


    随着计算技术的进步，国防领域开始越来越多地思考自动化战场会是什么样子，自主武器的想法有哪些风险和问题。但是很多人认为，大部分这类问题暂时还只存在于理论上。


    “机器学习已经应用于情报分析这类领域了，”冈宁说，“你明白我的意思吗？这个问题已经存在了。他们需要帮助。”


    在接下来的2年里，冈宁主管了一个持续多年的DARPA项目，这个项目试图直面这个问题。他称之为XAI：可解释的（explainable）AI。


    在大西洋的另一边，欧盟正准备通过一项名为《通用数据保护条例》（GDPR）的综合性法律。GDPR于2018年生效，并将极大地改变公司收集、存储、共享和使用在线数据的方式。这些规定总共有260页，是数据隐私史上最重要的文件之一。其中还包括一些更奇怪、更有趣、也许同样深刻的东西。


    2015年秋天，牛津互联网研究所的布莱斯·古德曼（Bryce Goodman）正在翻阅立法草案，突然有东西引起了他的注意。“我学了一些关于机器学习的知识，知道一些最好的方法并不具备透明性或可解释性，”他说，“然后我遇到了这个问题。在GDPR的早期草案中，非常明确地提出，人们应该有权要求对基于算法做出的决定进行解释。”
    ^([^(198)](#fn198))


    “我觉得这很有趣，”他说，“当有这些立法或诸如此类的东西时，有人会在地上放一个木桩，然后说，**这个东西现在已经有了。”**


    古德曼找到了他的牛津同事塞思·弗莱克斯曼（Seth Flaxman），后者刚刚获得了机器学习和公共政策的博士学位。“嘿，我在GDPR里发现了这个东西，”古德曼说，“这里似乎存在问题。”


    “他说：‘是的，好像是有问题。’”


    无论是贷款被拒绝，申请信用卡被拒绝，被拘留待审，还是被拒绝假释，如果背后有机器学习系统，你不仅有权知道发生了什么，而且有权知道**为什么**。


    次年春天，即2016年，欧洲议会正式通过了GDPR，整个科技行业的高管们都惴惴不安。律师与欧盟监管机构谈判。“你们应该知道，”他们说，“从深度神经网络得到可理解的解释是尚未解决的科学问题。”正如古德曼和弗莱克斯曼所写，这“可能需要对标准和广泛使用的算法技术进行全面修订”。监管机构并没有被这一点打动：“这就是为什么要到2018年才生效。”


    正如一位研究人员说的：“他们给了我们一个2年内解决极为困难的研究问题的通知。”


    GDPR现在已经生效，尽管欧盟监管机构要求的具体细节，以及什么构成了充分的解释——对谁，在什么背景下——仍在制定中。与此同时，透明度——理解机器学习模型内部发生了什么以及它为什么会这样做的能力——已经成为该领域最明确而且重要的优先事项之一。此后关于这个问题的工作一直在全力推进，并且最近在很多方面都取得了进展。以下是我们了解的情况。


    ## 临床与统计预测的比较


    有一个流行的误解，专家通过神秘的启示成功判断人。当然，这是胡说八道。他成功是因为他在事实或权衡事实的方式上很少犯错。足够的洞察力和调查能让我们保留主观印象判断的所有优势（包括它的速度和方便性），同时不受制于其缺陷。


    ——爱德华·桑代克（Edward Thorndike） ^([^(199)](#fn199))


    当面对透明度问题，尤其是大型、复杂的模型，我们需要考虑的第一件事是，我们是否应该使用大型或复杂的模型。首先，我们应该使用模型吗？


    这些问题贯穿了统计学和机器学习的历史，它们在今天和以往一样有意义，而且答案相当令人惊讶。


    1954年，罗宾·道斯（Robyn Dawes）在哈佛大学主修哲学，专攻伦理学。他的论文《审视分析》研究了道德判断是否以及在何种程度上根植于情感。


    道斯不仅认为这些问题很重要，他还认为“**实证**研究也很重要。但是，如何进行实证研究呢？”思考这个问题后，他意识到他的兴趣更多地在于心理学而不是哲学。他申请了心理学研究生，密歇根大学的心理学是美国最好的，录取窗口的最后一天他被列入候选名单。惊喜的道斯把这个好消息告诉了导师，导师告诉他：“趁他们还没反悔，赶紧同意。”
    ^([^(200)](#fn200))


    道斯去了密歇根州，接受临床心理学训练。当时是50年代末60年代初，罗夏墨迹测验还很受重视。道斯发现自己越来越怀疑罗夏测试作为临床工具有没有作用。“一切都是直觉的，而且有直觉意义。但后来我开始阅读，发现事实上，从经验来看，很多这类东西都不起作用。”


    道斯开始产生怀疑时，他正在精神病房当住院医生。“有一个患者有幻觉，”他回忆道，“他觉得自己的乳房在生长。他归我管，顺便说一下，是一间上锁的病房，因为他有幻觉，那肯定是精神分裂症。呃，他为什么会认为自己在长乳房？嗯，那周早些时候，他的父亲还是母亲在他产生幻觉之前自杀了。嗯，解释得通，对吧？……他们甚至没有要求患者脱衣检查。他被送进精神病房，在我们组一间上锁的病房里待了6星期。当他们要求他脱下衬衫时，事实的确如此：他的乳房在增大。”患者患有克氏症：一种由额外的X染色体引起的遗传疾病，症状包括体毛缺失和乳腺组织发育。道斯被激怒了。“他的生命中有6个星期被抛弃了，”他说，“因为人们确信，**哦，这是一个迷人的幻觉。**”


    这导致了道斯职业生涯的一个重要转折点，从临床实践转向当时被称为“数学心理学”的领域。他有一篇论文打算投稿，将专家的临床判断与简单的数学模型进行比较，他把论文拿给朋友看。朋友的反应让道斯措手不及。“他有点意味深长地看着我说，‘你确定你没有抄袭？’”


    道斯不经意间闯入了一个他不知道的学术谱系。将专家判断与简单的数学模型（当时被称为“精算”方法）进行对比的问题可以追溯到20世纪40年代初，当时欧内斯特·伯吉斯的一个同事叫西奥多·沙宾（Ted Sarbin）。沙宾研究了对明尼苏达州大学新生学业表现的预测。“精算”模型是一个简单的线性回归，仅根据两个数据预测他们的大学平均成绩：高中班级排名和大学入学能力测验分数。人类的预测由有经验的临床心理学家给出，他们可以获得这两个数据，加上额外的测试，一份8页的档案，访谈记录，以及他们对学生的第一印象。


    沙宾发现两者的预测没有可测量的差异。如果说有什么不同的话，那就是精算模型更准确，尽管并不明显。根据沙宾的发现，心理学家获得的额外信息似乎没有增加预测的准确性，这令人难以置信。“奋斗、学习和玩耍的习惯、天赋、情感特征、系统的干扰以及成百上千的其他条件呢，”他写道，“这些难道不都与被称为学业成就的复杂社会心理行为相关？”
    ^([^(201)](#fn201))


    沙宾的结论是，花在访谈上的大量时间纯粹是浪费。他警告说：“除非通过统计研究检验，否则社会科学中的案例研究方法一文不值。”


    沙宾的发现引起了年轻心理学家保罗·弥尔（Paul Meehl）的注意。受沙宾的挑战启发，弥尔决定自己研究一下，于是他开始了一项调查，调查结果写成了一本书：1954年出版的《临床与统计预测》。尽管书中大部分是致力于理解临床判断的内容以及临床医生如何做决定，但其影响最大的部分是对临床判断和精算判断进行比较的章节。弥尔发现，人类专家输得很彻底。在差不多100个领域中，人类专家只在6个领域有一点优势。“有人告诉我，”弥尔回忆道，“在一所推崇弗洛伊德的中西部大学，一半的临床教师因为我的小书陷入了为期半年的反应性抑郁。”
    ^([^(202)](#fn202))


    道斯发现自己无意中成了抄袭者，也对弥尔的书产生了浓厚兴趣，但他的导师似乎不认可这种兴趣。“我的精神分析导师告诉我，弥尔是天才，所有人都知道他是天才，但他所做的与我们做的无关。我开始担心，如果他做的事情和我们做的无关，也许我**不想**做我们做的事情。”


    到了20世纪70年代中期，当时在俄勒冈研究所的道斯，沿着之前的思路写了一篇关于脑震荡的论文。正如他总结的，沙宾和弥尔提出了一个问题，即纯粹的统计分析为何能与人类专家的判断媲美。“统计分析曾被认为提供了有经验的临床医生的判断可以与之相比的底线，”道斯写道，“结果地板变成了天花板”。
    ^([^(203)](#fn203))


    在沙宾最初的论文发表30年后，后来又出现了数十项研究，道斯总结道：“搜索文献未发现有任何研究能证实临床判断优于统计预测（当两者都基于相同的可编码输入变量时）。”
    ^([^(204)](#fn204))


    这幅图景确实令人羞愧。即使将统计预测作为额外数据提供给人类专家，他们的决策**仍然**不如直接使用预测。 ^([^(205)](#fn205))


    这个结论得到了此后众多研究的支持，因此我们应该停下来思考一下。 ^([^(206)](#fn206))


    然而，还潜藏着一个诱人的问题：该怎样解释这个惊人的结论？人类的判断真的那么糟糕？几个变量的简单线性模型真的那么好？或者……是不是有第三种可能：人类的专业知识以某种最意想不到的方式进入了简单模型？我们是不是找错了地方？


    ## 非最适模型：知道该看什么


    一些真正的问题很难，这一事实并不意味着所有真正的问题都很难。


    ——罗伯特·霍尔特（Robert Holte） ^([^(207)](#fn207))


    人类不能像计算机那样有效组合信息，这一事实并不意味着人类能被机器取代。但这的确意味着人机系统的必要性就在眼前。


    ——希勒尔·艾因霍恩（Hillel J. Einhorn） ^([^(208)](#fn208))


    道斯和俄勒冈研究所的同事想彻底弄清楚为何简单的线性模型在决策中那么有效。


    一种假设是，这些模型的表现之所以优于专家，或许是因为存在某种“群体智慧”效应：一个模型整合了一群专家的判断，所以它当然会胜过任何一个专家。这听起来似乎合理，但事实并非如此。令人惊讶的是，即使模型被训练成只模仿一个专家的判断，它仍然胜过专家！
    ^([^(209)](#fn209))


    也许是因为线性模型的优化方式，也就是调整参数以获得每个变量的最优权重。道斯与伯纳德·科里甘（Bernard Corrigan）合作，比较了专家和非最适线性模型，这些模型的权重没有进行优化。他们试了**相等**权重，也试了**随机**权重。


    结果令人震惊。随机权重的模型——只要被限制为正——至少和专家一样准确。相等权重的模型则更准确。 ^([^(210)](#fn210))


    这种快速简单的非最适模型的实际可能性似乎无穷无尽。20世纪70年代中期，道斯和一位内科医生一起参加了一个小组。在酒吧里，医生问他：“比如，你能不能用你的非最适线性模型来判断我和我妻子相处得有多好？”
    ^([^(211)](#fn211))


    道斯马上想出了他能想到的最简模式：他认为，好的婚姻应该有更多的性而不是争吵，因此可以用一对夫妇在几周或几个月内做爱的次数（“定义为有或没有高潮的生殖器结合”），减去他们在同一时间段争吵的次数（“至少一方变得不合作的状态”）。“线性模型的精髓是简单：用性爱频率减去争吵频率。正差对应幸福，负差对应不幸福。”
    ^([^(212)](#fn212))


    事实上，在许多情况下，等权重模型甚至好于最优回归，这似乎不太可能，因为最优权重是通过精确计算选择的。但它们是对于特定的背景和特定的一组训练数据最优，而背景并不总是一致：例如，明尼苏达州大学预测学习成绩的最优权重不一定等于卡内基·梅隆大学预测学习成绩的最优权重。在实践中，等权重似乎在各种情况下都更有效，也更稳健。
    ^([^(213)](#fn213))


    道斯对此非常着迷。考虑到世界的复杂性，为什么这种呆板简单的模型——对相等权重属性的简单计数——不仅有效，而且比人类专家和最优回归都**更有效**？


    他想到了几个答案。首先，尽管现实世界很复杂，但许多高层关系呈现所谓的“条件单调”，它们不会以特别复杂的方式相互影响。比如说，不管一个人的健康状况怎么变化，20多岁时几乎**总是**好于30多岁。不管一个人的智力、动机和职业道德怎么样，标准化考试分数高10分几乎**总是**要好于低10分。不管一个人的犯罪史和自控力等因素怎么样，记录在案的逮捕次数少一次几乎总是要好于多一次。


    第二，任何测量都有误差。无论是从理论还是直觉来看，测量越容易出错，就越应当以线性方式进行测量。


    道斯认为，从一致性的角度来看，最具挑衅性的也许是，等权重模型胜过了相应的最优权重模型，因为正如我们知道的，权重会根据某种客观函数进行调整。在现实中，我们经常要么无法准确定义该如何衡量成功，要么没有时间等待这个基本事实出现，以便调整我们的模型。“例如，”他写道，“在决定录取哪些学生读研究生时，我们希望预测某种可以被称为‘职业自我实现’的长远变量。我们知道这个概念的含义，但是没有完善、精确的定义。（即使有，也不可能基于学生当前的记录进行研究，要等到学生完成博士工作至少20年后才能评估。）”道斯认为，如果我们不知道自己到底想要什么，甚至根本没有数据，非最适模型应该不会差于原始直觉。
    ^([^(214)](#fn214))


    然而，有人可能会对道斯和科里甘的比较研究持反对意见，尤其是与人类专家的比较，似乎并不完全公平。模型并不是随机选取几个特征；它们是人类通过几十年甚至几代人的优化，发现的最相关和最具预测性的因素的线性组合。


    也许有人会说，所有这些“预处理”活动——从无限的可用信息中决定哪2个、5个或10个与手头的决定最相关——反映了对问题的真正智慧和见解：实际上，人类已经完成了所有的艰苦工作，然后再将其教给线性模型，才让线性模型窃取了所有荣誉。道斯的观点正是如此。他写道：“线性模型不能代替专家来决定‘看什么’之类的事情，而正是这种在做决定时知道该看什么的知识才是人类专家特有的技能。”
    ^([^(215)](#fn215))


    道斯的结论是，人类专家知识的特点在于知道该看什么，而不是知道整合这些信息的最优方式。这一想法最清晰的证明之一来自决策理论专家希勒尔·艾因霍恩1972年的一项研究。
    ^([^(216)](#fn216))


    换句话说，我们一直在错误的地方寻找人类智慧。也许它并不位于人类决策者的思维中，而是体现在标准和实践中，这些标准和实践决定了将哪些信息放到他们面前。剩下的只是计算。


    道斯用第三种方式表达了这个观点，这可能也是他传奇生涯中最著名的一句话：“关键在于知道该看哪些变量，然后是知道做加法。” ^([^(217)](#fn217))


    ## 最优简单模型


    其实简单比复杂更难，你必须竭尽全力才能做到简单。但最终这样做是值得的，因为你一旦做到了简单，你就能移山填海。


    ——史蒂夫·乔布斯 ^([^(218)](#fn218))


    我不认为贴近复杂的简单毫无价值，但我更喜欢远离复杂的简单。


    ——奥利弗·霍姆斯（Oliver Wendell Holmes Jr.） ^([^(219)](#fn219))

    '
  trans: '


    在这个领域，最强大的模型一般也最难理解，最容易理解的也最不精确。“这让我很不爽，”他告诉我，“我想为医疗保健领域做机器学习。神经网络真的很好，很精确；但是它们完全不透明，不可理解，我认为目前这个还很危险。也许我不应该在医疗保健领域做机器学习。”
    ^(¹⁹¹)


    “广义相加模型”是他最喜爱的模型之一，这种模型最早由统计学家特雷弗·哈斯蒂（Trevor Hastie）和罗伯特·蒂布施拉尼（Robert Tibshirani）在
    1986 年提出。 ^(¹⁹²)


    在最初的肺炎研究过去多年后，卡鲁阿纳重新读取了数据集，构建了一个广义相加模型。结果发现，广义相加模型和他原来的神经网络一样精确，并且更加透明。例如，他绘图将肺炎死亡率风险表示为年龄的函数。这个图很大程度上符合人们的预期：如果患肺炎，年轻或中年会好一点，年老会更危险。但有一件事很引人注目：从
    65 岁开始突然出现了风险剧增。某个特定的生日会引发风险突然增加，这似乎很不寻常。发生了什么事？卡鲁阿纳意识到，这种模型捕捉到了**退休**的影响。“这真的很烦人，这很危险，对吗？你预期退休后风险会**降低**；然而，它增加了。”
    ^(¹⁹³)


    更重要的是，他看得越仔细，看到的令人不安的关联就越多。他曾担心自己原来的神经网络不仅学会了有问题的哮喘相关性，还学会了其他类似的相关性，尽管当时简单的基于规则的模型还不足以向他展示神经网络中还潜藏着什么。20
    年后，他**有了**强大的可解释模型。这就像有了更强大的显微镜，突然可以看到枕头上的螨虫和皮肤上的细菌。


    “我看着它，心想，‘哦，天哪，简直不敢相信’。它认为胸痛对你有好处。它认为心脏病对你有好处。它认为超过 100 岁对你有好处……它认为所有这些显然没好处的事情都对你有好处。”
    ^(¹⁹⁴)


    这些和哮喘有相同的医学意义；这种相关性是真实的，但同样真实的是，这些患者会被优先安排重症监护，这使得他们能够存活。


    “感谢上帝，”他说，“我们没有部署神经网络。”


    卡鲁阿纳发现自己现在的立场变得与大多数研究人员不同。他继续开发模型架构，要做到与神经网络同等水平的预测准确性，同时还要容易理解。但是，他没有宣传自己发明的任何特定解决方案，例如新版本的广义相加模型
    ^(¹⁹⁵)


    他告诉我，“我现在的目标是吓唬人。恐吓他们。如果他们停下来想，**哦，天哪，这里真的有问题。**我就觉得我成功了。”


    ## 黑盒问题


    大自然隐藏她的秘密是因为她崇高，而不是因为她是骗子。


    ——爱因斯坦


    给出理由的行为是权威的对立面。当权威的声音失效时，理性的声音就会出现。反之亦然。


    ——弗雷德里克·绍尔（Frederick Schauer） ^(¹⁹⁶)


    卡鲁阿纳绝不是近年来唯一认为**这里真的有问题**的人。随着机器学习模型在世界各地的决策基础设施中激增，许多人意识到自己对这些模型中实际发生的事情知之甚少，并对此感到不舒服。


    卡鲁阿纳对于部署大规模神经网络持非常谨慎的态度，因为它们也被称为“黑匣子”。随着神经网络在从工业到军事到医学的各个领域的飞速发展，越来越多的人感受到了同样的不安。


    2014 年，DARPA（美国国防高级研究计划局）项目经理大卫·冈宁（Dave Gunning）与信息创新办公室主任丹·考夫曼（Dan Kaufman）聊天。“我们当时正想在
    AI 领域激发新想法，”冈宁告诉我。 ^(¹⁹⁷)


    大约在同一时期，冈宁参加了由情报部门在北卡罗莱纳州立大学分析科学实验室举办的一场会议。该研讨会汇集了机器学习研究人员和数据可视化专家。“有一位政府的情报分析师在场听我们谈论这些机器学习技术，”冈宁回忆道，“这位分析师提出的问题是，她必须在大数据算法给出的建议上签字。如果你愿意，根据建议正确与否，她可以得到评分。但她不明白学习算法给出的建议是什么道理。”她应该在上面签名吗？她应该根据什么来决定？


    随着计算技术的进步，国防领域开始越来越多地思考自动化战场会是什么样子，自主武器的想法有哪些风险和问题。但是很多人认为，大部分这类问题暂时还只存在于理论上。


    “机器学习已经应用于情报分析这类领域了，”冈宁说，“你明白我的意思吗？这个问题已经存在了。他们需要帮助。”


    在接下来的 2 年里，冈宁主管了一个持续多年的 DARPA 项目，这个项目试图直面这个问题。他称之为 XAI：可解释的（explainable）AI。


    在大西洋的另一边，欧盟正准备通过一项名为《通用数据保护条例》（GDPR）的综合性法律。GDPR 于 2018 年生效，并将极大地改变公司收集、存储、共享和使用在线数据的方式。这些规定总共有
    260 页，是数据隐私史上最重要的文件之一。其中还包括一些更奇怪、更有趣、也许同样深刻的东西。


    2015 年秋天，牛津互联网研究所的布莱斯·古德曼（Bryce Goodman）正在翻阅立法草案，突然有东西引起了他的注意。“我学了一些关于机器学习的知识，知道一些最好的方法并不具备透明性或可解释性，”他说，“然后我遇到了这个问题。在
    GDPR 的早期草案中，非常明确地提出，人们应该有权要求对基于算法做出的决定进行解释。” ^(¹⁹⁸)


    “我觉得这很有趣，”他说，“当有这些立法或诸如此类的东西时，有人会在地上放一个木桩，然后说，**这个东西现在已经有了。”**


    古德曼找到了他的牛津同事塞思·弗莱克斯曼（Seth Flaxman），后者刚刚获得了机器学习和公共政策的博士学位。“嘿，我在 GDPR 里发现了这个东西，”古德曼说，“这里似乎存在问题。”


    “他说：‘是的，好像是有问题。’”


    无论是贷款被拒绝，申请信用卡被拒绝，被拘留待审，还是被拒绝假释，如果背后有机器学习系统，你不仅有权知道发生了什么，而且有权知道**为什么**。


    次年春天，即 2016 年，欧洲议会正式通过了 GDPR，整个科技行业的高管们都惴惴不安。律师与欧盟监管机构谈判。“你们应该知道，”他们说，“从深度神经网络得到可理解的解释是尚未解决的科学问题。”正如古德曼和弗莱克斯曼所写，这“可能需要对标准和广泛使用的算法技术进行全面修订”。监管机构并没有被这一点打动：“这就是为什么要到
    2018 年才生效。”


    正如一位研究人员说的：“他们给了我们一个 2 年内解决极为困难的研究问题的通知。”


    GDPR 现在已经生效，尽管欧盟监管机构要求的具体细节，以及什么构成了充分的解释——对谁，在什么背景下——仍在制定中。与此同时，透明度——理解机器学习模型内部发生了什么以及它为什么会这样做的能力——已经成为该领域最明确而且重要的优先事项之一。此后关于这个问题的工作一直在全力推进，并且最近在很多方面都取得了进展。以下是我们了解的情况。


    ## 临床与统计预测的比较


    有一个流行的误解，专家通过神秘的启示成功判断人。当然，这是胡说八道。他成功是因为他在事实或权衡事实的方式上很少犯错。足够的洞察力和调查能让我们保留主观印象判断的所有优势（包括它的速度和方便性），同时不受制于其缺陷。


    ——爱德华·桑代克（Edward Thorndike） ^(¹⁹⁹)


    当面对透明度问题，尤其是大型、复杂的模型，我们需要考虑的第一件事是，我们是否应该使用大型或复杂的模型。首先，我们应该使用模型吗？


    这些问题贯穿了统计学和机器学习的历史，它们在今天和以往一样有意义，而且答案相当令人惊讶。


    1954 年，罗宾·道斯（Robyn Dawes）在哈佛大学主修哲学，专攻伦理学。他的论文《审视分析》研究了道德判断是否以及在何种程度上根植于情感。


    道斯不仅认为这些问题很重要，他还认为“**实证**研究也很重要。但是，如何进行实证研究呢？”思考这个问题后，他意识到他的兴趣更多地在于心理学而不是哲学。他申请了心理学研究生，密歇根大学的心理学是美国最好的，录取窗口的最后一天他被列入候选名单。惊喜的道斯把这个好消息告诉了导师，导师告诉他：“趁他们还没反悔，赶紧同意。”
    ^(²⁰⁰)


    道斯去了密歇根州，接受临床心理学训练。当时是 50 年代末 60 年代初，罗夏墨迹测验还很受重视。道斯发现自己越来越怀疑罗夏测试作为临床工具有没有作用。“一切都是直觉的，而且有直觉意义。但后来我开始阅读，发现事实上，从经验来看，很多这类东西都不起作用。”


    道斯开始产生怀疑时，他正在精神病房当住院医生。“有一个患者有幻觉，”他回忆道，“他觉得自己的乳房在生长。他归我管，顺便说一下，是一间上锁的病房，因为他有幻觉，那肯定是精神分裂症。呃，他为什么会认为自己在长乳房？嗯，那周早些时候，他的父亲还是母亲在他产生幻觉之前自杀了。嗯，解释得通，对吧？……他们甚至没有要求患者脱衣检查。他被送进精神病房，在我们组一间上锁的病房里待了
    6 星期。当他们要求他脱下衬衫时，事实的确如此：他的乳房在增大。”患者患有克氏症：一种由额外的 X 染色体引起的遗传疾病，症状包括体毛缺失和乳腺组织发育。道斯被激怒了。“他的生命中有
    6 个星期被抛弃了，”他说，“因为人们确信，**哦，这是一个迷人的幻觉。**”


    这导致了道斯职业生涯的一个重要转折点，从临床实践转向当时被称为“数学心理学”的领域。他有一篇论文打算投稿，将专家的临床判断与简单的数学模型进行比较，他把论文拿给朋友看。朋友的反应让道斯措手不及。“他有点意味深长地看着我说，‘你确定你没有抄袭？’”


    道斯不经意间闯入了一个他不知道的学术谱系。将专家判断与简单的数学模型（当时被称为“精算”方法）进行对比的问题可以追溯到 20 世纪 40 年代初，当时欧内斯特·伯吉斯的一个同事叫西奥多·沙宾（Ted Sarbin）。沙宾研究了对明尼苏达州大学新生学业表现的预测。“精算”模型是一个简单的线性回归，仅根据两个数据预测他们的大学平均成绩：高中班级排名和大学入学能力测验分数。人类的预测由有经验的临床心理学家给出，他们可以获得这两个数据，加上额外的测试，一份
    8 页的档案，访谈记录，以及他们对学生的第一印象。


    沙宾发现两者的预测没有可测量的差异。如果说有什么不同的话，那就是精算模型更准确，尽管并不明显。根据沙宾的发现，心理学家获得的额外信息似乎没有增加预测的准确性，这令人难以置信。“奋斗、学习和玩耍的习惯、天赋、情感特征、系统的干扰以及成百上千的其他条件呢，”他写道，“这些难道不都与被称为学业成就的复杂社会心理行为相关？”
    ^(²⁰¹)


    沙宾的结论是，花在访谈上的大量时间纯粹是浪费。他警告说：“除非通过统计研究检验，否则社会科学中的案例研究方法一文不值。”


    沙宾的发现引起了年轻心理学家保罗·弥尔（Paul Meehl）的注意。受沙宾的挑战启发，弥尔决定自己研究一下，于是他开始了一项调查，调查结果写成了一本书：1954
    年出版的《临床与统计预测》。尽管书中大部分是致力于理解临床判断的内容以及临床医生如何做决定，但其影响最大的部分是对临床判断和精算判断进行比较的章节。弥尔发现，人类专家输得很彻底。在差不多
    100 个领域中，人类专家只在 6 个领域有一点优势。“有人告诉我，”弥尔回忆道，“在一所推崇弗洛伊德的中西部大学，一半的临床教师因为我的小书陷入了为期半年的反应性抑郁。”
    ^(²⁰²)


    道斯发现自己无意中成了抄袭者，也对弥尔的书产生了浓厚兴趣，但他的导师似乎不认可这种兴趣。“我的精神分析导师告诉我，弥尔是天才，所有人都知道他是天才，但他所做的与我们做的无关。我开始担心，如果他做的事情和我们做的无关，也许我**不想**做我们做的事情。”


    到了 20 世纪 70 年代中期，当时在俄勒冈研究所的道斯，沿着之前的思路写了一篇关于脑震荡的论文。正如他总结的，沙宾和弥尔提出了一个问题，即纯粹的统计分析为何能与人类专家的判断媲美。“统计分析曾被认为提供了有经验的临床医生的判断可以与之相比的底线，”道斯写道，“结果地板变成了天花板”。
    ^(²⁰³)


    在沙宾最初的论文发表 30 年后，后来又出现了数十项研究，道斯总结道：“搜索文献未发现有任何研究能证实临床判断优于统计预测（当两者都基于相同的可编码输入变量时）。”
    ^(²⁰⁴)


    这幅图景确实令人羞愧。即使将统计预测作为额外数据提供给人类专家，他们的决策**仍然**不如直接使用预测。 ^(²⁰⁵)


    这个结论得到了此后众多研究的支持，因此我们应该停下来思考一下。 ^(²⁰⁶)


    然而，还潜藏着一个诱人的问题：该怎样解释这个惊人的结论？人类的判断真的那么糟糕？几个变量的简单线性模型真的那么好？或者……是不是有第三种可能：人类的专业知识以某种最意想不到的方式进入了简单模型？我们是不是找错了地方？


    ## 非最适模型：知道该看什么


    一些真正的问题很难，这一事实并不意味着所有真正的问题都很难。


    ——罗伯特·霍尔特（Robert Holte） ^(²⁰⁷)


    人类不能像计算机那样有效组合信息，这一事实并不意味着人类能被机器取代。但这的确意味着人机系统的必要性就在眼前。


    ——希勒尔·艾因霍恩（Hillel J. Einhorn） ^(²⁰⁸)


    道斯和俄勒冈研究所的同事想彻底弄清楚为何简单的线性模型在决策中那么有效。


    一种假设是，这些模型的表现之所以优于专家，或许是因为存在某种“群体智慧”效应：一个模型整合了一群专家的判断，所以它当然会胜过任何一个专家。这听起来似乎合理，但事实并非如此。令人惊讶的是，即使模型被训练成只模仿一个专家的判断，它仍然胜过专家！
    ^(²⁰⁹)


    也许是因为线性模型的优化方式，也就是调整参数以获得每个变量的最优权重。道斯与伯纳德·科里甘（Bernard Corrigan）合作，比较了专家和非最适线性模型，这些模型的权重没有进行优化。他们试了**相等**权重，也试了**随机**权重。


    结果令人震惊。随机权重的模型——只要被限制为正——至少和专家一样准确。相等权重的模型则更准确。 ^(²¹⁰)


    这种快速简单的非最适模型的实际可能性似乎无穷无尽。20 世纪 70 年代中期，道斯和一位内科医生一起参加了一个小组。在酒吧里，医生问他：“比如，你能不能用你的非最适线性模型来判断我和我妻子相处得有多好？”
    ^(²¹¹)


    道斯马上想出了他能想到的最简模式：他认为，好的婚姻应该有更多的性而不是争吵，因此可以用一对夫妇在几周或几个月内做爱的次数（“定义为有或没有高潮的生殖器结合”），减去他们在同一时间段争吵的次数（“至少一方变得不合作的状态”）。“线性模型的精髓是简单：用性爱频率减去争吵频率。正差对应幸福，负差对应不幸福。”
    ^(²¹²)


    事实上，在许多情况下，等权重模型甚至好于最优回归，这似乎不太可能，因为最优权重是通过精确计算选择的。但它们是对于特定的背景和特定的一组训练数据最优，而背景并不总是一致：例如，明尼苏达州大学预测学习成绩的最优权重不一定等于卡内基·梅隆大学预测学习成绩的最优权重。在实践中，等权重似乎在各种情况下都更有效，也更稳健。
    ^(²¹³)


    道斯对此非常着迷。考虑到世界的复杂性，为什么这种呆板简单的模型——对相等权重属性的简单计数——不仅有效，而且比人类专家和最优回归都**更有效**？


    他想到了几个答案。首先，尽管现实世界很复杂，但许多高层关系呈现所谓的“条件单调”，它们不会以特别复杂的方式相互影响。比如说，不管一个人的健康状况怎么变化，20
    多岁时几乎**总是**好于 30 多岁。不管一个人的智力、动机和职业道德怎么样，标准化考试分数高 10 分几乎**总是**要好于低 10 分。不管一个人的犯罪史和自控力等因素怎么样，记录在案的逮捕次数少一次几乎总是要好于多一次。


    第二，任何测量都有误差。无论是从理论还是直觉来看，测量越容易出错，就越应当以线性方式进行测量。


    道斯认为，从一致性的角度来看，最具挑衅性的也许是，等权重模型胜过了相应的最优权重模型，因为正如我们知道的，权重会根据某种客观函数进行调整。在现实中，我们经常要么无法准确定义该如何衡量成功，要么没有时间等待这个基本事实出现，以便调整我们的模型。“例如，”他写道，“在决定录取哪些学生读研究生时，我们希望预测某种可以被称为‘职业自我实现’的长远变量。我们知道这个概念的含义，但是没有完善、精确的定义。（即使有，也不可能基于学生当前的记录进行研究，要等到学生完成博士工作至少
    20 年后才能评估。）”道斯认为，如果我们不知道自己到底想要什么，甚至根本没有数据，非最适模型应该不会差于原始直觉。 ^(²¹⁴)


    然而，有人可能会对道斯和科里甘的比较研究持反对意见，尤其是与人类专家的比较，似乎并不完全公平。模型并不是随机选取几个特征；它们是人类通过几十年甚至几代人的优化，发现的最相关和最具预测性的因素的线性组合。


    也许有人会说，所有这些“预处理”活动——从无限的可用信息中决定哪 2 个、5 个或 10 个与手头的决定最相关——反映了对问题的真正智慧和见解：实际上，人类已经完成了所有的艰苦工作，然后再将其教给线性模型，才让线性模型窃取了所有荣誉。道斯的观点正是如此。他写道：“线性模型不能代替专家来决定‘看什么’之类的事情，而正是这种在做决定时知道该看什么的知识才是人类专家特有的技能。”
    ^(²¹⁵)


    道斯的结论是，人类专家知识的特点在于知道该看什么，而不是知道整合这些信息的最优方式。这一想法最清晰的证明之一来自决策理论专家希勒尔·艾因霍恩 1972 年的一项研究。
    ^(²¹⁶)


    换句话说，我们一直在错误的地方寻找人类智慧。也许它并不位于人类决策者的思维中，而是体现在标准和实践中，这些标准和实践决定了将哪些信息放到他们面前。剩下的只是计算。


    道斯用第三种方式表达了这个观点，这可能也是他传奇生涯中最著名的一句话：“关键在于知道该看哪些变量，然后是知道做加法。” ^(²¹⁷)


    ## 最优简单模型


    其实简单比复杂更难，你必须竭尽全力才能做到简单。但最终这样做是值得的，因为你一旦做到了简单，你就能移山填海。


    ——史蒂夫·乔布斯 ^(²¹⁸)


    我不认为贴近复杂的简单毫无价值，但我更喜欢远离复杂的简单。


    ——奥利弗·霍姆斯（Oliver Wendell Holmes Jr.） ^(²¹⁹)


