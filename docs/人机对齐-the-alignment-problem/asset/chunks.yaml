    12. 约翰·冯·诺依曼 1945 年的 EDVAC 报告是历史上对存储程序计算机的首次描述，在长达 101 页的报告中，只引用了一篇文章：McCulloch&Pitts，1943。（参见
    Neumann，“First Draft of a Report on the EDVAC”。冯·诺依曼的原文中名字写错了：“根据 W. S. MacCulloch\[原文如此\]和
    W. Pitts。”）冯·诺依曼吸收了他们的观点，在“神经元类比”这一节，他考虑了他设想的计算装置的实际意义。“很容易看出，这些简化的神经元功能可以用继电器或真空管模拟，”他写道。“这些电子管装置能通过数位处理数字，所以使用二值算术系统是很自然的。这就暗示了可以使用二进制。”我们都知道这种由逻辑门构建的二进制存储程序机器后来的故事。它们是如此普及，现在地球上的计算机数量已经远远超过了人类。
    然而，这种架构的灵感虽然来自大脑，还是很快远离了“神经元类比”。很多人想知道是否存在架构更接近大脑的机器：不是单个处理器以极快的速度每次执行一条明确的逻辑指令，而是由相对简单、统一的处理单元组成的分布式网格，涌现的整体大于很初级的部分的总和。甚至可以是一些不那么二值的东西，有一点被莱文接受而皮茨回避的那种混杂。此后神经网络的专用并行硬件不断更新，包括弗兰克·罗森布拉特的马克
    1 号感知机，但通常是固化的，不可更改。支持神经网络大规模并行训练的真正硬件革命——GPU——还要等到几十年后的 2005 年。 导言↩


