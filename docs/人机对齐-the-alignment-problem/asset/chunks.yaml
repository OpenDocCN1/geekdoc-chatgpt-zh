    689. 原始的 ImageNet 数据实际上包含 2 万个类别；AlexNet 在 2012 年赢得的 ImageNet 大规模视觉识别挑战赛（ILSVRC）使用了仅包含
    1000 个类别的精简版数据。参见 Deng 等，“ImageNet”，和 Russa-kovsky 等，“ImageNet 大规模视觉识别挑战赛”。↩


    690. 关于最近对医学中的性别偏差的公开讨论，参见 Perez, 《隐形女性》。关于这一主题的学术文献，参见例如，Mastroianni, Faden&Federman,
    《女性与健康研究》，和 Marts&Keitt，“前言”。医学界还担心，老年人——目前增长最快的人口群体——在医学实验中的代表性也严重不足；参见例如，“临床试验中老年人和女性的代表性不足”，和
    Shenoy&Harugeri，“老年人参与临床试验”。 在诸多领域中这都是一个活跃的研究方向；例如，最近关于动物博物馆藏品的讨论，参见 Cooper 等，“鸟类和哺乳动物自然历史收藏中的性别偏差”。↩


    691. 参见例如，Odell, 《如何无所事事》。↩


