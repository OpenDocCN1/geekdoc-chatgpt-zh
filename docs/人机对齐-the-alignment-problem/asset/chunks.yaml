    Ko，“Mountains out of Moles：Artificial Intelligence and Imaging”（讲座），Big Data in
    Biomedicine Conference，斯坦福大学，加州，2017年5月24日，`https：//www.youtube.com/watch?v=kClvKNl0Wfc`。[↩](#fnref231)


