    Intelligible Models with Pairwise Interactions”。[↩](#fnref192)


    193.  卡鲁阿纳说，这有许多不同的原因。对一些人来说，退休意味着生活方式的改变，也意味着收入发生变化，保险甚至医疗保健提供商发生变化，他们也可能搬家——所有这些都改变了他们与健康和医疗保健的关系。[↩](#fnref193)


    194.  广义相加模型显示，风险在86岁急剧上升，但在101岁又急剧下降。卡鲁阿纳认为这些纯粹是社会影响；他推测，在一个人80多岁的时候，家人和护理人员更有可能将健康困扰解释为自然衰亡，不应该全力以赴。另一方面，一旦活过了100岁，就会有差不多相反的冲动：“你已经走到这一步了；我们不会放弃你。”他指出，医生可能会想要编辑图表，剔除那条哮喘规则，不对80岁、90岁和100岁的人采取不同的治疗。另一方面，保险公司可能不希望编辑他们模型中的图表。从保险公司的角度来看，平均而言，哮喘规则确实更好。这凸显了明确考虑系统中不同利益相关者的不同视角的重要性，以及有些群体使用模型进行实际的、对真实世界的干预，反过来会改变所观察的基础数据；有些则只是被动的观察者。机器学习本质上不知道区别。[↩](#fnref194)


