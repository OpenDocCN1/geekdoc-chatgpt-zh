- raw: '他们称这个系统为ALVINN，“神经网络自动驾驶陆地车辆”的缩写，它通过模仿学习。 ^([^(480)](#fn480))


    一个星期天清晨，光线很好，路上车辆很少，波默罗在州际公路上加载了ALVINN。ALVINN从匹兹堡沿79号州际公路一路行驶到五大湖岸边的伊利。“这有点革命性。”索普说，不仅在于实现了壮举，还在于模型的简单性。ALVINN对动量和牵引力一无所知，无法识别物体，也无法预测自己或其他汽车的未来位置，也无法将通过摄像机看到的东西与自己在空间中的位置关联起来，也无法模拟自己行为的影响。“人们通常认为，如果你想开那么快，”索普说，“你必须有卡尔曼滤波器和道路的回旋线模型，以及车辆详细的动态响应模型。迪安只用了一个简单的神经网络，它可以学习：如果道路看起来是这样，你就这样驾驶。”


    波默罗告诉当地新闻记者，“我们只需告诉它‘像我一样驾驶。像我现在做的这样驾驶。’不用再告诉它别的”。 ^([^(481)](#fn481))


    训练机器最自然的想法之一就是训练它们模仿我们，这种方法在自动驾驶领域尤其有吸引力。ALVINN的成功证明了这种方法可行。如果想制造能完全自动驾驶的汽车，与其让它直接在道路上随机探索各种驾驶行为，通过（可怕的）试错来学习，不如采集真实人类驾驶的数据，构建庞大的数据集，训练它模仿人类的驾驶决策。系统学习根据状态——速度、前方图像、后视镜图像等——预测人类驾驶员的动作，踩油门、踩刹车、转方向盘，或者什么都不做。


    这种预测性方法将驾驶问题变成了类似于ImageNet竞赛的图像分类问题。ImageNet是将图像分类为狗、猫、花等，这里则是将车辆状态和摄像头图像“分类”为“加速”“制动”“左转”“右转”等。我们知道深度学习能让系统从见过的图像推广到没有见过的图像：如果AlexNet能够正确识别以前从未见过的狗，那么应该有理由相信汽车也能以某种方式做到，从经历过的场景推广到新的场景。即使它没有见过阳光照射下的那条路，也没有在那条路上见到过这样的车流，但按理它应该能根据过去的经验总结，从而知道该怎么应对。


    根据这个想法，你不需要让缺乏经验的自动驾驶汽车在道路上随机行驶来优化策略。只需要记录人类驾驶汽车时的摄像头影像、传感和操作数据，采集大量数据，数百万小时的记录，最终训练出能完美模仿人类驾驶的汽车。


    正如加州大学伯克利分校的谢尔盖·莱文（Sergey Levine）向本科生讲述的：“因此，解决这类序贯决策问题的一种非常自然的方式，与解决标准计算机视觉问题的方式基本是一样的。我们让人类驾驶车辆，采集车载摄像头数据，同时记录驾驶员的操作。将这些存入数据集，作为训练数据。然后运行我们选择的监督学习算法——比如，随机梯度下降——来训练神经网络……将其作为标准的监督学习问题进行处理。这是很合理的切入方式。”
    ^([^(482)](#fn482))


    然后，他解释道，当系统被用于控制时，它可以直接把它的预测——“我认为这是人类驾驶员在这种情况下会做的事情”——转化为行动。


    莱文停顿了一下。“有没有人想到这样做可能会有什么问题？” ^([^(483)](#fn483))


    许多手举了起来。


    **学会纠正**


    模仿随着习得习惯而推进。学习舞蹈时，老师在示范时很难盯着学生的动作，这使得最初的步骤很难掌握。期望的动作并不是马上就能做好……最初的动作错得离谱，再次尝试，失败，然后再试一次，直到最后我们看到姿势对了。


    ——亚历山大·贝恩（Alexander Bain） ^([^(484)](#fn484))


    我会怎么做？我不会陷入这种境地。


    ——苹果CEO蒂姆·库克（Tim Cook），被问及遇到FACEBOOK CEO马克·扎克伯格（Mark Zuckerberg）面临的情况时会怎么做 ^([^(485)](#fn485))


    2009年，ALVINN之后已过去20年，在同一栋楼里，CMU的研究生斯特凡·罗斯（Stéphane Ross）正在玩《超级马里奥卡丁车》，更确切地说，是一款名为《超能卡丁车》的免费开源衍生游戏，游戏主角是Linux吉祥物，一只可爱的小企鹅。


    罗斯玩游戏时，他的电脑会记录屏幕图像，以及他对游戏柄的所有操作。这些数据被用来训练一个相当简单的神经网络学习罗斯的操作。这个神经网络并不比ALVINN使用的那个复杂多少。
    ^([^(486)](#fn486))


    问题并不在于示范圈的数量。他记录了100万帧的比赛，一圈又一圈大约2小时的驾驶过程，但示范圈数的增加似乎没什么作用。他把方向盘交给神经网络，小企鹅信心满满，然后摇摆，转向，偏离了道路。


    问题根源在于，学习者观摩的是专家，而专家很少陷入麻烦。然而，不管学习者多么厉害，他们都会犯错，或大或小。但是因为学习者从未见过专家陷入困境，他们也就从未见过专家如何应对困境。事实上，当初学者犯错时，他们可能从没看到过专家遇到类似的情况。用谢尔盖·莱文的话说：“这意味着束手无策。”


    例如，在《超能卡丁车》中，罗斯开车的表现很好，他向程序输入的所有数据都是示范如何沿着赛道中线行驶。但是一旦小企鹅在神经网络的控制下稍微偏离了中线或者歪了，它就会失控。它遇到的场景和它观摩的罗斯遇到的情景存在系统性差异。这种情况下所需的操作与正常情况下受控的全速驾驶有很大不同，但它在学习时没有见过其他场景。像罗斯这样熟练地玩游戏，无论多少圈，玩多久，都解决不了这个问题。


    这个问题就是模仿学习研究者所说的“级联误差”，是模仿学习的基本问题之一。正如迪安·波默罗在研究ALVINN时写的，“由于在训练中，人会驾驶车辆沿车道中心行驶，因此网络永远不会见到必须纠正偏离中心的错误的情况”。
    ^([^(487)](#fn487))


    如果波默罗在伊利湖之旅要将生命安全托付给系统，那么他就不能仅仅是让系统被动观察自己精准的驾驶。否则只有系统**从不**出错，它才是可靠的。在州际公路上以88公里/时的速度行驶2小时，这个要求太高了。


    “不仅要向网络演示精准驾驶的例子，”波默罗写道，“还要演示一旦发生错误如何纠正（回到车道中心）。” ^([^(488)](#fn488))


    波默罗想出了另一个主意：他可以伪造。


    ALVINN处理的图像很小而且粗粒化，30×32像素的黑白图像，以梯形显示了车辆正前方的路面。（它的视野是如此狭窄和短视，以至于在经过一个十字路口时，它迷失了方向，闯入了人行道。）波默罗对ALVINN相机拍摄的真实图像进行了简单修改，使道路稍微偏向两边。这些信息随后被加入训练数据中，并给出了让汽车回到车道中心和随后方向回正的指令。这有点取巧，而且只有当路面平坦，没有斜坡或山丘时，指令才正确，正好适用于79号州际公路。


    具有讽刺意味的是，在过去10年，深度学习技术的迅猛发展反倒使得这种“伪造”方法越来越不可行，因为现代相机每秒钟拍摄的图像太多，分辨率太高，视野太宽广，很难用这种方式轻松修改。如果伪造图像与汽车偏离车道时会看到的真实景象存在系统差异，那麻烦就大了。不管怎样，把生命押在你的PS技能上是靠不住的，而且现代神经网络实际上变得越来越难以欺骗。


    20年后，纠正问题仍未得到解决，无论是理论层面还是实际层面。斯特凡·罗斯告诉我：“如果你通过观摩学习，当你开始**自己独立**行动时，你遇到的情况不一定符合你曾见过的例子。”罗斯认为，这里有一些根本性的东西：“所有机器学习都依赖这样一个假设，即你的训练和测试数据的分布是一样的。”但是罗斯和他的导师CMU机器人专家德鲁·巴涅尔（Drew Bagnell）认为，他们也许能破解它。“我对此非常感兴趣，”罗斯说，“因为这感觉像是一个需要解决的基本问题。”
    ^([^(489)](#fn489))


    罗斯和巴涅尔进行了理论分析，试图从数学角度来理解这个问题，同时用《超能卡丁车》检验了他们的直觉。对于ImageNet这类监督学习问题，系统一旦被训练，每看一张图片都有一定的可能出错。图片数量增加10倍，平均来说，出错也增加10倍，错误的数量和任务的数量呈线性关系。而模仿学习要糟糕得多，因为一个错误就可能导致系统遇到它从未见过的情景，一旦它犯了第一个错误，就有可能应对失策。错误和任务规模呈**平方**关系。运行时间增加10倍，错误会增加100倍。
    ^([^(490)](#fn490))


    他们找到了，关键在于互动。学习者不仅要在开始时观摩专家，而且在必要时还要能**回到**老师身边，说：“嘿，我尝试了你给我示范的东西，但总是出现这种不好的事情。如果你陷入了这种困境，你会怎么做？”


    为了在《超能卡丁车》上实现这种互动，罗斯想了2种办法。 ^([^(491)](#fn491))


    令人惊讶的是，无论是理论推导还是在《超能卡丁车》中，这两种形式的互动不仅有效，而且所需的反馈少到令人惊讶。如果只依靠静态演示，无论是几千帧还是100万帧专家数据，也无论是训练几分钟还是几小时，失败概率都差不多，都没什么希望。但如果使用这种交互式方法——罗斯称之为“数据集聚合（DAgger）”——到**第三圈**程序几乎就可以驾驶得很好了。“得到这个结果后，”罗斯说，“我就想，哇，这真是太棒了。它的效果比默认方法好几个数量级。”


    罗斯获得博士学位后，马上就将《超能卡丁车》的虚拟赛道换成了加利福尼亚山景城的现实郊区街道，他目前是自动驾驶公司Waymo的行为预测主管，设计模型来预测路上其他汽车、自行车和行人的行为和反应。“要求的可靠性比学术界高几个数量级，这是真正的挑战所在。比如，如何确保模型一直不出错，而不仅仅是95%或99%，这些都不够好。”这项工程很艰巨也很有成就感，“如果成功的话，它可能是你能对世界产生最大影响的项目之一，造福全世界。希望未来能产生影响，这本身就为这个领域的工作提供了足够动力。”


    虽然DAgger采用的这种互动反馈在理论上是黄金标准，但在实践中，我们不用与车辆交替掌控方向盘，以确保它们学会保持在车道中央。有几种更简单的方法在实践中效果也很好，可以构建能纠正小错误的真实系统。


    2015年，瑞士的一支团队在一个无人机项目中，采用了一种巧妙的方法来解决这个问题，这架无人机可以在山区徒步路线上飞行，而且不会在森林里迷路。据他们说，以前的研究试图“明确定义步道的视觉特征”，他们则完全绕过了图像的哪些部分有步道，或者步道看起来是什么样子的问题，而是训练系统从图像直接映射到运动输出。它会拍摄包含泥地和树木的752×480像素图像，并输出“向左偏转”“向右偏转”或“往前的指令”。与近年来越来越常见的故事情节一样，多年来对“显著性”或“对比度”的手工视觉特征的细致研究，以及对如何（比如从树皮中）区分污垢的巧妙方法，被彻底抛弃，代之以随机梯度下降训练的卷积神经网络。所有手工设计特征的工作都过时了。


    该团队训练无人机模仿人类徒步旅行者走的路线。独特而且巧妙的是他们让系统纠正错误的办法。他们在徒步旅行者的头上装了GoPro摄像机，不是1个，而是3个，1个指向正前方，另外2个则稍偏向左右，记录偏离正确方向时会看到什么。然后，他们让徒步旅行者像往常一样行进，只是要注意头朝前。这样就生成了一个庞大的步道图像数据集，并使用“看到类似的情况时往前飞”来标注中间摄像机图像，使用“看到类似的情况向左偏转”来标注右侧摄像机图像，使用“看到类似的情况向右偏转”来标注左侧摄像机图像。他们用数据集训练了神经网络，将其安装在四旋翼无人机上，然后在瑞士阿尔卑斯山放飞。它基本上能在树林中悬浮，沿着步道前进。同样，关键技巧是，不仅要示范人类专家的做法，还要提供数据形式的防护栏，指导稍有失常的学习者回到正轨。
    ^([^(492)](#fn492))


    2016年，新泽西州霍尔姆德尔的英伟达深度学习团队做了一个项目，将同样的技巧运用于新泽西州蒙莫斯县的街道。英伟达在一辆车上安装了3个摄像头，1个指向前方，2个偏向左右约30度。这样左右摄像头就显示了如果车辆方向稍有错误时会看到什么。然后，研究小组将这些数据输入系统，正确的预测是“按人类驾驶员的做法操作，再加上回到中心的小修正”。仅用了72小时的训练数据，系统就很安全了，足以在各种天气条件下在蒙莫斯县蜿蜒的乡村道路和多车道公路上行驶，不会发生重大事故。在团队发布的视频中，可以看到他们的林肯MKZ从英伟达深度学习研究大楼的停车场出来，驶向花园州公园路。“它还是自动的！？”一名跟车的员工问道。“看起来相当不错，”他说，然后补充说，它的表现至少比其他由人类驾驶在公园路上行驶的车要好。
    ^([^(493)](#fn493))


    顺带提一下两个历史注脚。20世纪80年代末，正是在这栋研究大楼里——当时它属于贝尔实验室——杨立昆发明了用反向传播进行训练的卷积神经网络，现在的自动驾驶车辆都是由它驱动。
    ^([^(494)](#fn494))


    **悬崖边缘：可能主义与现实主义**


    人应当执行自己能管理和维持的低级行为，而不是会搞砸的高级行为……我们绝不能僭取属于那些精神视野比我们更高或更远的人的行为。


    ——艾丽丝·默多克（Iris Murdoch） ^([^(495)](#fn495))


    如果你是我，你会怎么做？她说。


    如果我是你——你，还是如果我是你——我？


    如果你是我——我。


    如果我是你——你，他说，我的做法和你一样。


    ——罗伯特·哈斯（Robert Hass） ^([^(496)](#fn496))


    模仿作为一种学习策略，除了纠正小错误的问题，还有一个问题是，有时你根本做不到专家能做到的事情。如果是这样，模仿就意味着去做一些你无法做到的事情。面对这种情况，你可能根本不应该试图表现得像他们一样。


    真实生活和流行文化中经常有新手试图模仿专家的例子，结果往往是灾难。


    正如国际象棋大师卡斯帕罗夫解释的：“棋手，尤其是业余爱好者，会花很多时间来学习和记忆他们喜欢的开局。这些知识很重要，但也可能是陷阱……死记硬背，不管多精彩，没有理解是没用的。总有一天，他会走到记忆的尽头，面对自己并不真正理解的棋局，没有预先准备好的走法。”


    卡斯帕罗夫回忆他曾指导一名12岁的棋手，复盘一场学生赛的开局。卡斯帕罗夫问他为什么在一种复杂的开局中下出了一个特别激进和危险的走法。“瓦列霍就是这样下的！”学生回答。卡斯帕罗夫说：“是的，我知道这位西班牙特级大师在最近的一局棋中下了这一手，但我也知道，如果这位少年棋手不理解这手棋背后的动机，就会陷入麻烦。”
    ^([^(497)](#fn497))


    这似乎既符合直觉，又在某种程度上自相矛盾：模仿“更厉害”的人的做法有时可能是严重的错误。这背后的故事非常复杂，并且与伦理学、经济学和机器学习有深刻关联。


    1976年，伦理哲学前沿突然开始关注一个问题：你自己在**未来**的行为对你**现在**该做什么有多大影响？


    当时在密歇根大学的哲学家霍利·史密斯（Holly Smith）专注于研究效用主义。她注意到一些奇怪的事情。“如果你是效用主义者，自然会问这样的问题：‘如果我现在做A，会产生最好的结果吗？’嗯，很明显，”她说，“这取决于我接下来会怎么做。”
    ^([^(498)](#fn498))


    她思考的思维实验被称为“拖延教授”。 ^([^(499)](#fn499))


    他应该同意吗？


    这里有两种不同的伦理思想流派分歧：“可能主义”——认为人应该做在任何情况下最好**可能**的事情——与“现实主义”——认为人应该根据以后**实际**会发生什么（无论是因为你自己后来的行为还是其他原因）做在当前最好的事情。
    ^([^(500)](#fn500))


    可能主义主张，对于拖延症者来说，最好**可能**的事情是同意审稿并按时完成。这得先同意，所以他应该同意。


    现实主义的观点更务实。就其本身而言，同意审稿必然导致糟糕的结果：根本不审稿。拒绝审稿意味着相对较好的结果：由资格稍逊的审稿人审稿。教授应该做**实际上**导致最好结果的事情，因此他应该拒绝。


    史密斯得出的结论是“一个人有时必须选择较低的行为而不是较高的行为”。她解释道：“如果一个行为让自主体有可能做好事，而同样的行为也让他有可能做灾难性的事情，并且他会选择后者而不是前者，那么选这个行为似乎不是什么好事。”


    与此同时，史密斯也阐释了现实主义的缺点：“现实主义给了你一个借口，基于你自己未来的道德缺憾去做坏事。”大约40年后，理论争论逐渐升温。“我想很多人会认为这个问题仍未解决，”史密斯说，“可以说讨论仍然很活跃。”
    ^([^(501)](#fn501))


    这场讨论不仅仅是理论上的。例如，在21世纪的“有效利他理念”运动中，关于为了最大限度地帮助他人，一个人应该做多大程度的牺牲，意见不一。 ^([^(502)](#fn502))


    有效利他理念社群的领导者、有效利他理念中心的社群联络员朱莉娅·怀斯（Julia Wise）自己做出了令人印象深刻的承诺，将50%的收入捐给慈善机构，但她强调不追求完美价值，“允许自己不纯粹”。
    ^([^(503)](#fn503))


    有效利他理念中心的共同创始人、牛津哲学家威尔·麦卡斯基尔（Will MacAskill）在这个问题上直言不讳。“我们应该做现实主义者，”他说，“如果你今天一次性捐出所有积蓄——抛却现实因素，这是可以做到的——你可能会感到非常沮丧，以至于将来干脆不再捐赠。然而，如果你决定捐出10%的收入，这一承诺将具有足够的可持续性，你可以在未来继续这样做，从而产生更大的总体影响。”
    ^([^(504)](#fn504))


    辛格自己也承认，从长远来看，最好是具有平衡和比例感。“如果你发现自己做的事情让你痛苦，是时候重新考虑一下了。你能因此变得更积极吗？如果没有，从各方面考虑，这真的是最好的吗？”他还指出，“有效利他理念者仍然相对较少，所以他们树立榜样，吸引其他人采纳这种生活方式是很重要的。”
    ^([^(505)](#fn505))


    现实主义与可能主义的争论，在机器学习中也同样存在。第4章曾讨论过，强化学习算法有一个主要族系是学习评估“价值”，“价值”表示为对各种可选行为的未来收益预期。（这被称为“Q值”，“品质”的缩写。）例如，下棋的自主体要学习预测各种下法获胜的概率，而玩雅达利游戏的自主体则要学习估计各种动作的预期得分。有了这些预测，接下来就只需采取Q值最高的行动。


    不过，这里面有一个值得明确的含糊之处。Q值应该是你通过采取这一行动**可能**获得的最好预期收益，还是你实际**将**获得的预期收益？如果自主体全知全能，两者就是一回事，但如果不是这样，答案可能会大相径庭。


    这两种价值学习方法被称为“同轨”和“离轨”方法。同轨方法评估行动价值，是根据自主体采取行动并按自己的“策略”继续采取行动后**实际**将获得的收益。而**离轨**自主体评估行动的价值则是根据随后的最好**可能**的行为序列。
    ^([^(506)](#fn506))'
  fmt: '

    # 模仿学习与自动驾驶


    他们称这个系统为`ALVINN`，“神经网络自动驾驶陆地车辆”的缩写，它通过模仿学习。 ^([^(480)](#fn480))


    一个星期天清晨，光线很好，路上车辆很少，波默罗在州际公路上加载了`ALVINN`。`ALVINN`从匹兹堡沿79号州际公路一路行驶到五大湖岸边的伊利。“这有点革命性。”索普说，不仅在于实现了壮举，还在于模型的简单性。`ALVINN`对动量和牵引力一无所知，无法识别物体，也无法预测自己或其他汽车的未来位置，也无法将通过摄像机看到的东西与自己在空间中的位置关联起来，也无法模拟自己行为的影响。“人们通常认为，如果你想开那么快，”索普说，“你必须有卡尔曼滤波器和道路的回旋线模型，以及车辆详细的动态响应模型。迪安只用了一个简单的神经网络，它可以学习：如果道路看起来是这样，你就这样驾驶。”


    波默罗告诉当地新闻记者，“我们只需告诉它‘像我一样驾驶。像我现在做的这样驾驶。’不用再告诉它别的”。 ^([^(481)](#fn481))


    训练机器最自然的想法之一就是训练它们模仿我们，这种方法在自动驾驶领域尤其有吸引力。`ALVINN`的成功证明了这种方法可行。如果想制造能完全自动驾驶的汽车，与其让它直接在道路上随机探索各种驾驶行为，通过（可怕的）试错来学习，不如采集真实人类驾驶的数据，构建庞大的数据集，训练它模仿人类的驾驶决策。系统学习根据状态——速度、前方图像、后视镜图像等——预测人类驾驶员的动作，踩油门、踩刹车、转方向盘，或者什么都不做。


    这种预测性方法将驾驶问题变成了类似于`ImageNet`竞赛的图像分类问题。`ImageNet`是将图像分类为狗、猫、花等，这里则是将车辆状态和摄像头图像“分类”为“加速”“制动”“左转”“右转”等。我们知道深度学习能让系统从见过的图像推广到没有见过的图像：如果`AlexNet`能够正确识别以前从未见过的狗，那么应该有理由相信汽车也能以某种方式做到，从经历过的场景推广到新的场景。即使它没有见过阳光照射下的那条路，也没有在那条路上见到过这样的车流，但按理它应该能根据过去的经验总结，从而知道该怎么应对。


    根据这个想法，你不需要让缺乏经验的自动驾驶汽车在道路上随机行驶来优化策略。只需要记录人类驾驶汽车时的摄像头影像、传感和操作数据，采集大量数据，数百万小时的记录，最终训练出能完美模仿人类驾驶的汽车。


    正如加州大学伯克利分校的谢尔盖·莱文（Sergey Levine）向本科生讲述的：“因此，解决这类序贯决策问题的一种非常自然的方式，与解决标准计算机视觉问题的方式基本是一样的。我们让人类驾驶车辆，采集车载摄像头数据，同时记录驾驶员的操作。将这些存入数据集，作为训练数据。然后运行我们选择的监督学习算法——比如，`随机梯度下降`——来训练神经网络……将其作为标准的监督学习问题进行处理。这是很合理的切入方式。”
    ^([^(482)](#fn482))


    然后，他解释道，当系统被用于控制时，它可以直接把它的预测——“我认为这是人类驾驶员在这种情况下会做的事情”——转化为行动。


    莱文停顿了一下。“有没有人想到这样做可能会有什么问题？” ^([^(483)](#fn483))


    许多手举了起来。


    ## 学会纠正


    模仿随着习得习惯而推进。学习舞蹈时，老师在示范时很难盯着学生的动作，这使得最初的步骤很难掌握。期望的动作并不是马上就能做好……最初的动作错得离谱，再次尝试，失败，然后再试一次，直到最后我们看到姿势对了。


    ——亚历山大·贝恩（Alexander Bain） ^([^(484)](#fn484))


    我会怎么做？我不会陷入这种境地。


    ——苹果CEO蒂姆·库克（Tim Cook），被问及遇到FACEBOOK CEO马克·扎克伯格（Mark Zuckerberg）面临的情况时会怎么做 ^([^(485)](#fn485))


    2009年，`ALVINN`之后已过去20年，在同一栋楼里，`CMU`的研究生斯特凡·罗斯（Stéphane Ross）正在玩《超级马里奥卡丁车》，更确切地说，是一款名为《超能卡丁车》的免费开源衍生游戏，游戏主角是`Linux`吉祥物，一只可爱的小企鹅。


    罗斯玩游戏时，他的电脑会记录屏幕图像，以及他对游戏柄的所有操作。这些数据被用来训练一个相当简单的神经网络学习罗斯的操作。这个神经网络并不比`ALVINN`使用的那个复杂多少。
    ^([^(486)](#fn486))


    问题并不在于示范圈的数量。他记录了100万帧的比赛，一圈又一圈大约2小时的驾驶过程，但示范圈数的增加似乎没什么作用。他把方向盘交给神经网络，小企鹅信心满满，然后摇摆，转向，偏离了道路。


    问题根源在于，学习者观摩的是专家，而专家很少陷入麻烦。然而，不管学习者多么厉害，他们都会犯错，或大或小。但是因为学习者从未见过专家陷入困境，他们也就从未见过专家如何应对困境。事实上，当初学者犯错时，他们可能从没看到过专家遇到类似的情况。用谢尔盖·莱文的话说：“这意味着束手无策。”


    例如，在《超能卡丁车》中，罗斯开车的表现很好，他向程序输入的所有数据都是示范如何沿着赛道中线行驶。但是一旦小企鹅在神经网络的控制下稍微偏离了中线或者歪了，它就会失控。它遇到的场景和它观摩的罗斯遇到的情景存在系统性差异。这种情况下所需的操作与正常情况下受控的全速驾驶有很大不同，但它在学习时没有见过其他场景。像罗斯这样熟练地玩游戏，无论多少圈，玩多久，都解决不了这个问题。


    这个问题就是模仿学习研究者所说的“级联误差”，是模仿学习的基本问题之一。正如迪安·波默罗在研究`ALVINN`时写的，“由于在训练中，人会驾驶车辆沿车道中心行驶，因此网络永远不会见到必须纠正偏离中心的错误的情况”。
    ^([^(487)](#fn487))


    如果波默罗在伊利湖之旅要将生命安全托付给系统，那么他就不能仅仅是让系统被动观察自己精准的驾驶。否则只有系统从不出错，它才是可靠的。在州际公路上以88公里/时的速度行驶2小时，这个要求太高了。


    “不仅要向网络演示精准驾驶的例子，”波默罗写道，“还要演示一旦发生错误如何纠正（回到车道中心）。” ^([^(488)](#fn488))


    波默罗想出了另一个主意：他可以伪造。


    `ALVINN`处理的图像很小而且粗粒化，30×32像素的黑白图像，以梯形显示了车辆正前方的路面。（它的视野是如此狭窄和短视，以至于在经过一个十字路口时，它迷失了方向，闯入了人行道。）波默罗对`ALVINN`相机拍摄的真实图像进行了简单修改，使道路稍微偏向两边。这些信息随后被加入训练数据中，并给出了让汽车回到车道中心和随后方向回正的指令。这有点取巧，而且只有当路面平坦，没有斜坡或山丘时，指令才正确，正好适用于79号州际公路。


    具有讽刺意味的是，在过去10年，深度学习技术的迅猛发展反倒使得这种“伪造”方法越来越不可行，因为现代相机每秒钟拍摄的图像太多，分辨率太高，视野太宽广，很难用这种方式轻松修改。如果伪造图像与汽车偏离车道时会看到的真实景象存在系统差异，那麻烦就大了。不管怎样，把生命押在你的PS技能上是靠不住的，而且现代神经网络实际上变得越来越难以欺骗。


    20年后，纠正问题仍未得到解决，无论是理论层面还是实际层面。斯特凡·罗斯告诉我：“如果你通过观摩学习，当你开始自己独立行动时，你遇到的情况不一定符合你曾见过的例子。”罗斯认为，这里有一些根本性的东西：“所有机器学习都依赖这样一个假设，即你的训练和测试数据的分布是一样的。”但是罗斯和他的导师`CMU`机器人专家德鲁·巴涅尔（Drew
    Bagnell）认为，他们也许能破解它。“我对此非常感兴趣，”罗斯说，“因为这感觉像是一个需要解决的基本问题。” ^([^(489)](#fn489))


    罗斯和巴涅尔进行了理论分析，试图从数学角度来理解这个问题，同时用《超能卡丁车》检验了他们的直觉。对于`ImageNet`这类监督学习问题，系统一旦被训练，每看一张图片都有一定的可能出错。图片数量增加10倍，平均来说，出错也增加10倍，错误的数量和任务的数量呈线性关系。而模仿学习要糟糕得多，因为一个错误就可能导致系统遇到它从未见过的情景，一旦它犯了第一个错误，就有可能应对失策。错误和任务规模呈平方关系。运行时间增加10倍，错误会增加100倍。
    ^([^(490)](#fn490))


    他们找到了，关键在于互动。学习者不仅要在开始时观摩专家，而且在必要时还要能回到老师身边，说：“嘿，我尝试了你给我示范的东西，但总是出现这种不好的事情。如果你陷入了这种困境，你会怎么做？”


    为了在《超能卡丁车》上实现这种互动，罗斯想了2种办法。 ^([^(491)](#fn491))


    令人惊讶的是，无论是理论推导还是在《超能卡丁车》中，这两种形式的互动不仅有效，而且所需的反馈少到令人惊讶。如果只依靠静态演示，无论是几千帧还是100万帧专家数据，也无论是训练几分钟还是几小时，失败概率都差不多，都没什么希望。但如果使用这种交互式方法——罗斯称之为“数据集聚合（`DAgger`）”——到第三圈程序几乎就可以驾驶得很好了。“得到这个结果后，”罗斯说，“我就想，哇，这真是太棒了。它的效果比默认方法好几个数量级。”


    罗斯获得博士学位后，马上就将《超能卡丁车》的虚拟赛道换成了加利福尼亚山景城的现实郊区街道，他目前是自动驾驶公司`Waymo`的行为预测主管，设计模型来预测路上其他汽车、自行车和行人的行为和反应。“要求的可靠性比学术界高几个数量级，这是真正的挑战所在。比如，如何确保模型一直不出错，而不仅仅是95%或99%，这些都不够好。”这项工程很艰巨也很有成就感，“如果成功的话，它可能是你能对世界产生最大影响的项目之一，造福全世界。希望未来能产生影响，这本身就为这个领域的工作提供了足够动力。”


    虽然`DAgger`采用的这种互动反馈在理论上是黄金标准，但在实践中，我们不用与车辆交替掌控方向盘，以确保它们学会保持在车道中央。有几种更简单的方法在实践中效果也很好，可以构建能纠正小错误的真实系统。


    2015年，瑞士的一支团队在一个无人机项目中，采用了一种巧妙的方法来解决这个问题，这架无人机可以在山区徒步路线上飞行，而且不会在森林里迷路。据他们说，以前的研究试图“明确定义步道的视觉特征”，他们则完全绕过了图像的哪些部分有步道，或者步道看起来是什么样子的问题，而是训练系统从图像直接映射到运动输出。它会拍摄包含泥地和树木的752×480像素图像，并输出“向左偏转”“向右偏转”或“往前的指令”。与近年来越来越常见的故事情节一样，多年来对“显著性”或“对比度”的手工视觉特征的细致研究，以及对如何（比如从树皮中）区分污垢的巧妙方法，被彻底抛弃，代之以`随机梯度下降`训练的`卷积神经网络`。所有手工设计特征的工作都过时了。


    该团队训练无人机模仿人类徒步旅行者走的路线。独特而且巧妙的是他们让系统纠正错误的办法。他们在徒步旅行者的头上装了`GoPro`摄像机，不是1个，而是3个，1个指向正前方，另外2个则稍偏向左右，记录偏离正确方向时会看到什么。然后，他们让徒步旅行者像往常一样行进，只是要注意头朝前。这样就生成了一个庞大的步道图像数据集，并使用“看到类似的情况时往前飞”来标注中间摄像机图像，使用“看到类似的情况向左偏转”来标注右侧摄像机图像，使用“看到类似的情况向右偏转”来标注左侧摄像机图像。他们用数据集训练了神经网络，将其安装在四旋翼无人机上，然后在瑞士阿尔卑斯山放飞。它基本上能在树林中悬浮，沿着步道前进。同样，关键技巧是，不仅要示范人类专家的做法，还要提供数据形式的防护栏，指导稍有失常的学习者回到正轨。
    ^([^(492)](#fn492))


    2016年，新泽西州霍尔姆德尔的英伟达深度学习团队做了一个项目，将同样的技巧运用于新泽西州蒙莫斯县的街道。英伟达在一辆车上安装了3个摄像头，1个指向前方，2个偏向左右约30度。这样左右摄像头就显示了如果车辆方向稍有错误时会看到什么。然后，研究小组将这些数据输入系统，正确的预测是“按人类驾驶员的做法操作，再加上回到中心的小修正”。仅用了72小时的训练数据，系统就很安全了，足以在各种天气条件下在蒙莫斯县蜿蜒的乡村道路和多车道公路上行驶，不会发生重大事故。在团队发布的视频中，可以看到他们的林肯MKZ从英伟达深度学习研究大楼的停车场出来，驶向花园州公园路。“它还是自动的！？”一名跟车的员工问道。“看起来相当不错，”他说，然后补充说，它的表现至少比其他由人类驾驶在公园路上行驶的车要好。
    ^([^(493)](#fn493))


    顺带提一下两个历史注脚。20世纪80年代末，正是在这栋研究大楼里——当时它属于贝尔实验室——杨立昆发明了用反向传播进行训练的`卷积神经网络`，现在的自动驾驶车辆都是由它驱动。
    ^([^(494)](#fn494))


    ## 悬崖边缘：可能主义与现实主义


    人应当执行自己能管理和维持的低级行为，而不是会搞砸的高级行为……我们绝不能僭取属于那些精神视野比我们更高或更远的人的行为。


    ——艾丽丝·默多克（Iris Murdoch） ^([^(495)](#fn495))


    如果你是我，你会怎么做？她说。


    如果我是你——你，还是如果我是你——我？


    如果你是我——我。


    如果我是你——你，他说，我的做法和你一样。


    ——罗伯特·哈斯（Robert Hass） ^([^(496)](#fn496))


    模仿作为一种学习策略，除了纠正小错误的问题，还有一个问题是，有时你根本做不到专家能做到的事情。如果是这样，模仿就意味着去做一些你无法做到的事情。面对这种情况，你可能根本不应该试图表现得像他们一样。


    真实生活和流行文化中经常有新手试图模仿专家的例子，结果往往是灾难。


    正如国际象棋大师卡斯帕罗夫解释的：“棋手，尤其是业余爱好者，会花很多时间来学习和记忆他们喜欢的开局。这些知识很重要，但也可能是陷阱……死记硬背，不管多精彩，没有理解是没用的。总有一天，他会走到记忆的尽头，面对自己并不真正理解的棋局，没有预先准备好的走法。”


    卡斯帕罗夫回忆他曾指导一名12岁的棋手，复盘一场学生赛的开局。卡斯帕罗夫问他为什么在一种复杂的开局中下出了一个特别激进和危险的走法。“瓦列霍就是这样下的！”学生回答。卡斯帕罗夫说：“是的，我知道这位西班牙特级大师在最近的一局棋中下了这一手，但我也知道，如果这位少年棋手不理解这手棋背后的动机，就会陷入麻烦。”
    ^([^(497)](#fn497))


    这似乎既符合直觉，又在某种程度上自相矛盾：模仿“更厉害”的人的做法有时可能是严重的错误。这背后的故事非常复杂，并且与伦理学、经济学和机器学习有深刻关联。


    1976年，伦理哲学前沿突然开始关注一个问题：你自己在未来行为对你现在该做什么有多大影响？


    当时在密歇根大学的哲学家霍利·史密斯（Holly Smith）专注于研究效用主义。她注意到一些奇怪的事情。“如果你是效用主义者，自然会问这样的问题：‘如果我现在做A，会产生最好的结果吗？’嗯，很明显，”她说，“这取决于我接下来会怎么做。”
    ^([^(498)](#fn498))


    她思考的思维实验被称为“拖延教授”。 ^([^(499)](#fn499))


    他应该同意吗？


    这里有两种不同的伦理思想流派分歧：“可能主义”——认为人应该做在任何情况下最好可能的事情——与“现实主义”——认为人应该根据以后实际会发生什么（无论是因为你自己后来的行为还是其他原因）做在当前最好的事情。
    ^([^(500)](#fn500))


    可能主义主张，对于拖延症者来说，最好可能的事情是同意审稿并按时完成。这得先同意，所以他应该同意。


    现实主义的观点更务实。就其本身而言，同意审稿必然导致糟糕的结果：根本不审稿。拒绝审稿意味着相对较好的结果：由资格稍逊的审稿人审稿。教授应该做实际上导致最好结果的事情，因此他应该拒绝。


    史密斯得出的结论是“一个人有时必须选择较低的行为而不是较高的行为”。她解释道：“如果一个行为让自主体有可能做好事，而同样的行为也让他有可能做灾难性的事情，并且他会选择后者而不是前者，那么选这个行为似乎不是什么好事。”


    与此同时，史密斯也阐释了现实主义的缺点：“现实主义给了你一个借口，基于你自己未来的道德缺憾去做坏事。”大约40年后，理论争论逐渐升温。“我想很多人会认为这个问题仍未解决，”史密斯说，“可以说讨论仍然很活跃。”
    ^([^(501)](#fn501))


    这场讨论不仅仅是理论上的。例如，在21世纪的“有效利他理念”运动中，关于为了最大限度地帮助他人，一个人应该做多大程度的牺牲，意见不一。 ^([^(502)](#fn502))


    有效利他理念社群的领导者、有效利他理念中心的社群联络员朱莉娅·怀斯（Julia Wise）自己做出了令人印象深刻的承诺，将50%的收入捐给慈善机构，但她强调不追求完美价值，“允许自己不纯粹”。
    ^([^(503)](#fn503))


    有效利他理念中心的共同创始人、牛津哲学家威尔·麦卡斯基尔（Will MacAskill）在这个问题上直言不讳。“我们应该做现实主义者，”他说，“如果你今天一次性捐出所有积蓄——抛却现实因素，这是可以做到的——你可能会感到非常沮丧，以至于将来干脆不再捐赠。然而，如果你决定捐出10%的收入，这一承诺将具有足够的可持续性，你可以在未来继续这样做，从而产生更大的总体影响。”
    ^([^(504)](#fn504))


    辛格自己也承认，从长远来看，最好是具有平衡和比例感。“如果你发现自己做的事情让你痛苦，是时候重新考虑一下了。你能因此变得更积极吗？如果没有，从各方面考虑，这真的是最好的吗？”他还指出，“有效利他理念者仍然相对较少，所以他们树立榜样，吸引其他人采纳这种生活方式是很重要的。”
    ^([^(505)](#fn505))


    现实主义与可能主义的争论，在机器学习中也同样存在。第4章曾讨论过，强化学习算法有一个主要族系是学习评估“价值”，“价值”表示为对各种可选行为的未来收益预期。（这被称为“`Q值`”，“品质”的缩写。）例如，下棋的自主体要学习预测各种下法获胜的概率，而玩雅达利游戏的自主体则要学习估计各种动作的预期得分。有了这些预测，接下来就只需采取`Q值`最高的行动。


    不过，这里面有一个值得明确的含糊之处。`Q值`应该是你通过采取这一行动可能获得的最好预期收益，还是你实际将获得的预期收益？如果自主体全知全能，两者就是一回事，但如果不是这样，答案可能会大相径庭。


    这两种价值学习方法被称为“`同轨`”和“`离轨`”方法。`同轨`方法评估行动价值，是根据自主体采取行动并按自己的“策略”继续采取行动后实际将获得的收益。而`离轨`自主体评估行动的价值则是根据随后的最好可能的行为序列。
    ^([^(506)](#fn506))

    '
  trans: '


    # 模仿学习与自动驾驶


    他们称这个系统为`ALVINN`，“神经网络自动驾驶陆地车辆”的缩写，它通过模仿学习。 ^(⁴⁸⁰)


    一个星期天清晨，光线很好，路上车辆很少，波默罗在州际公路上加载了`ALVINN`。`ALVINN`从匹兹堡沿 79 号州际公路一路行驶到五大湖岸边的伊利。“这有点革命性。”索普说，不仅在于实现了壮举，还在于模型的简单性。`ALVINN`对动量和牵引力一无所知，无法识别物体，也无法预测自己或其他汽车的未来位置，也无法将通过摄像机看到的东西与自己在空间中的位置关联起来，也无法模拟自己行为的影响。“人们通常认为，如果你想开那么快，”索普说，“你必须有卡尔曼滤波器和道路的回旋线模型，以及车辆详细的动态响应模型。迪安只用了一个简单的神经网络，它可以学习：如果道路看起来是这样，你就这样驾驶。”


    波默罗告诉当地新闻记者，“我们只需告诉它‘像我一样驾驶。像我现在做的这样驾驶。’不用再告诉它别的”。 ^(⁴⁸¹)


    训练机器最自然的想法之一就是训练它们模仿我们，这种方法在自动驾驶领域尤其有吸引力。`ALVINN`的成功证明了这种方法可行。如果想制造能完全自动驾驶的汽车，与其让它直接在道路上随机探索各种驾驶行为，通过（可怕的）试错来学习，不如采集真实人类驾驶的数据，构建庞大的数据集，训练它模仿人类的驾驶决策。系统学习根据状态——速度、前方图像、后视镜图像等——预测人类驾驶员的动作，踩油门、踩刹车、转方向盘，或者什么都不做。


    这种预测性方法将驾驶问题变成了类似于`ImageNet`竞赛的图像分类问题。`ImageNet`是将图像分类为狗、猫、花等，这里则是将车辆状态和摄像头图像“分类”为“加速”“制动”“左转”“右转”等。我们知道深度学习能让系统从见过的图像推广到没有见过的图像：如果`AlexNet`能够正确识别以前从未见过的狗，那么应该有理由相信汽车也能以某种方式做到，从经历过的场景推广到新的场景。即使它没有见过阳光照射下的那条路，也没有在那条路上见到过这样的车流，但按理它应该能根据过去的经验总结，从而知道该怎么应对。


    根据这个想法，你不需要让缺乏经验的自动驾驶汽车在道路上随机行驶来优化策略。只需要记录人类驾驶汽车时的摄像头影像、传感和操作数据，采集大量数据，数百万小时的记录，最终训练出能完美模仿人类驾驶的汽车。


    正如加州大学伯克利分校的谢尔盖·莱文（Sergey Levine）向本科生讲述的：“因此，解决这类序贯决策问题的一种非常自然的方式，与解决标准计算机视觉问题的方式基本是一样的。我们让人类驾驶车辆，采集车载摄像头数据，同时记录驾驶员的操作。将这些存入数据集，作为训练数据。然后运行我们选择的监督学习算法——比如，`随机梯度下降`——来训练神经网络……将其作为标准的监督学习问题进行处理。这是很合理的切入方式。”
    ^(⁴⁸²)


    然后，他解释道，当系统被用于控制时，它可以直接把它的预测——“我认为这是人类驾驶员在这种情况下会做的事情”——转化为行动。


    莱文停顿了一下。“有没有人想到这样做可能会有什么问题？” ^(⁴⁸³)


    许多手举了起来。


    ## 学会纠正


    模仿随着习得习惯而推进。学习舞蹈时，老师在示范时很难盯着学生的动作，这使得最初的步骤很难掌握。期望的动作并不是马上就能做好……最初的动作错得离谱，再次尝试，失败，然后再试一次，直到最后我们看到姿势对了。


    ——亚历山大·贝恩（Alexander Bain） ^(⁴⁸⁴)


    我会怎么做？我不会陷入这种境地。


    ——苹果 CEO 蒂姆·库克（Tim Cook），被问及遇到 FACEBOOK CEO 马克·扎克伯格（Mark Zuckerberg）面临的情况时会怎么做
    ^(⁴⁸⁵)


    2009 年，`ALVINN`之后已过去 20 年，在同一栋楼里，`CMU`的研究生斯特凡·罗斯（Stéphane Ross）正在玩《超级马里奥卡丁车》，更确切地说，是一款名为《超能卡丁车》的免费开源衍生游戏，游戏主角是`Linux`吉祥物，一只可爱的小企鹅。


    罗斯玩游戏时，他的电脑会记录屏幕图像，以及他对游戏柄的所有操作。这些数据被用来训练一个相当简单的神经网络学习罗斯的操作。这个神经网络并不比`ALVINN`使用的那个复杂多少。
    ^(⁴⁸⁶)


    问题并不在于示范圈的数量。他记录了 100 万帧的比赛，一圈又一圈大约 2 小时的驾驶过程，但示范圈数的增加似乎没什么作用。他把方向盘交给神经网络，小企鹅信心满满，然后摇摆，转向，偏离了道路。


    问题根源在于，学习者观摩的是专家，而专家很少陷入麻烦。然而，不管学习者多么厉害，他们都会犯错，或大或小。但是因为学习者从未见过专家陷入困境，他们也就从未见过专家如何应对困境。事实上，当初学者犯错时，他们可能从没看到过专家遇到类似的情况。用谢尔盖·莱文的话说：“这意味着束手无策。”


    例如，在《超能卡丁车》中，罗斯开车的表现很好，他向程序输入的所有数据都是示范如何沿着赛道中线行驶。但是一旦小企鹅在神经网络的控制下稍微偏离了中线或者歪了，它就会失控。它遇到的场景和它观摩的罗斯遇到的情景存在系统性差异。这种情况下所需的操作与正常情况下受控的全速驾驶有很大不同，但它在学习时没有见过其他场景。像罗斯这样熟练地玩游戏，无论多少圈，玩多久，都解决不了这个问题。


    这个问题就是模仿学习研究者所说的“级联误差”，是模仿学习的基本问题之一。正如迪安·波默罗在研究`ALVINN`时写的，“由于在训练中，人会驾驶车辆沿车道中心行驶，因此网络永远不会见到必须纠正偏离中心的错误的情况”。
    ^(⁴⁸⁷)


    如果波默罗在伊利湖之旅要将生命安全托付给系统，那么他就不能仅仅是让系统被动观察自己精准的驾驶。否则只有系统从不出错，它才是可靠的。在州际公路上以 88 公里/时的速度行驶
    2 小时，这个要求太高了。


    “不仅要向网络演示精准驾驶的例子，”波默罗写道，“还要演示一旦发生错误如何纠正（回到车道中心）。” ^(⁴⁸⁸)


    波默罗想出了另一个主意：他可以伪造。


    `ALVINN`处理的图像很小而且粗粒化，30×32 像素的黑白图像，以梯形显示了车辆正前方的路面。（它的视野是如此狭窄和短视，以至于在经过一个十字路口时，它迷失了方向，闯入了人行道。）波默罗对`ALVINN`相机拍摄的真实图像进行了简单修改，使道路稍微偏向两边。这些信息随后被加入训练数据中，并给出了让汽车回到车道中心和随后方向回正的指令。这有点取巧，而且只有当路面平坦，没有斜坡或山丘时，指令才正确，正好适用于
    79 号州际公路。


    具有讽刺意味的是，在过去 10 年，深度学习技术的迅猛发展反倒使得这种“伪造”方法越来越不可行，因为现代相机每秒钟拍摄的图像太多，分辨率太高，视野太宽广，很难用这种方式轻松修改。如果伪造图像与汽车偏离车道时会看到的真实景象存在系统差异，那麻烦就大了。不管怎样，把生命押在你的
    PS 技能上是靠不住的，而且现代神经网络实际上变得越来越难以欺骗。


    20 年后，纠正问题仍未得到解决，无论是理论层面还是实际层面。斯特凡·罗斯告诉我：“如果你通过观摩学习，当你开始自己独立行动时，你遇到的情况不一定符合你曾见过的例子。”罗斯认为，这里有一些根本性的东西：“所有机器学习都依赖这样一个假设，即你的训练和测试数据的分布是一样的。”但是罗斯和他的导师`CMU`机器人专家德鲁·巴涅尔（Drew
    Bagnell）认为，他们也许能破解它。“我对此非常感兴趣，”罗斯说，“因为这感觉像是一个需要解决的基本问题。” ^(⁴⁸⁹)


    罗斯和巴涅尔进行了理论分析，试图从数学角度来理解这个问题，同时用《超能卡丁车》检验了他们的直觉。对于`ImageNet`这类监督学习问题，系统一旦被训练，每看一张图片都有一定的可能出错。图片数量增加
    10 倍，平均来说，出错也增加 10 倍，错误的数量和任务的数量呈线性关系。而模仿学习要糟糕得多，因为一个错误就可能导致系统遇到它从未见过的情景，一旦它犯了第一个错误，就有可能应对失策。错误和任务规模呈平方关系。运行时间增加
    10 倍，错误会增加 100 倍。 ^(⁴⁹⁰)


    他们找到了，关键在于互动。学习者不仅要在开始时观摩专家，而且在必要时还要能回到老师身边，说：“嘿，我尝试了你给我示范的东西，但总是出现这种不好的事情。如果你陷入了这种困境，你会怎么做？”


    为了在《超能卡丁车》上实现这种互动，罗斯想了 2 种办法。 ^(⁴⁹¹)


    令人惊讶的是，无论是理论推导还是在《超能卡丁车》中，这两种形式的互动不仅有效，而且所需的反馈少到令人惊讶。如果只依靠静态演示，无论是几千帧还是 100 万帧专家数据，也无论是训练几分钟还是几小时，失败概率都差不多，都没什么希望。但如果使用这种交互式方法——罗斯称之为“数据集聚合（`DAgger`）”——到第三圈程序几乎就可以驾驶得很好了。“得到这个结果后，”罗斯说，“我就想，哇，这真是太棒了。它的效果比默认方法好几个数量级。”


    罗斯获得博士学位后，马上就将《超能卡丁车》的虚拟赛道换成了加利福尼亚山景城的现实郊区街道，他目前是自动驾驶公司`Waymo`的行为预测主管，设计模型来预测路上其他汽车、自行车和行人的行为和反应。“要求的可靠性比学术界高几个数量级，这是真正的挑战所在。比如，如何确保模型一直不出错，而不仅仅是
    95%或 99%，这些都不够好。”这项工程很艰巨也很有成就感，“如果成功的话，它可能是你能对世界产生最大影响的项目之一，造福全世界。希望未来能产生影响，这本身就为这个领域的工作提供了足够动力。”


    虽然`DAgger`采用的这种互动反馈在理论上是黄金标准，但在实践中，我们不用与车辆交替掌控方向盘，以确保它们学会保持在车道中央。有几种更简单的方法在实践中效果也很好，可以构建能纠正小错误的真实系统。


    2015 年，瑞士的一支团队在一个无人机项目中，采用了一种巧妙的方法来解决这个问题，这架无人机可以在山区徒步路线上飞行，而且不会在森林里迷路。据他们说，以前的研究试图“明确定义步道的视觉特征”，他们则完全绕过了图像的哪些部分有步道，或者步道看起来是什么样子的问题，而是训练系统从图像直接映射到运动输出。它会拍摄包含泥地和树木的
    752×480 像素图像，并输出“向左偏转”“向右偏转”或“往前的指令”。与近年来越来越常见的故事情节一样，多年来对“显著性”或“对比度”的手工视觉特征的细致研究，以及对如何（比如从树皮中）区分污垢的巧妙方法，被彻底抛弃，代之以`随机梯度下降`训练的`卷积神经网络`。所有手工设计特征的工作都过时了。


    该团队训练无人机模仿人类徒步旅行者走的路线。独特而且巧妙的是他们让系统纠正错误的办法。他们在徒步旅行者的头上装了`GoPro`摄像机，不是 1 个，而是 3
    个，1 个指向正前方，另外 2 个则稍偏向左右，记录偏离正确方向时会看到什么。然后，他们让徒步旅行者像往常一样行进，只是要注意头朝前。这样就生成了一个庞大的步道图像数据集，并使用“看到类似的情况时往前飞”来标注中间摄像机图像，使用“看到类似的情况向左偏转”来标注右侧摄像机图像，使用“看到类似的情况向右偏转”来标注左侧摄像机图像。他们用数据集训练了神经网络，将其安装在四旋翼无人机上，然后在瑞士阿尔卑斯山放飞。它基本上能在树林中悬浮，沿着步道前进。同样，关键技巧是，不仅要示范人类专家的做法，还要提供数据形式的防护栏，指导稍有失常的学习者回到正轨。
    ^(⁴⁹²)


    2016 年，新泽西州霍尔姆德尔的英伟达深度学习团队做了一个项目，将同样的技巧运用于新泽西州蒙莫斯县的街道。英伟达在一辆车上安装了 3 个摄像头，1 个指向前方，2
    个偏向左右约 30 度。这样左右摄像头就显示了如果车辆方向稍有错误时会看到什么。然后，研究小组将这些数据输入系统，正确的预测是“按人类驾驶员的做法操作，再加上回到中心的小修正”。仅用了
    72 小时的训练数据，系统就很安全了，足以在各种天气条件下在蒙莫斯县蜿蜒的乡村道路和多车道公路上行驶，不会发生重大事故。在团队发布的视频中，可以看到他们的林肯
    MKZ 从英伟达深度学习研究大楼的停车场出来，驶向花园州公园路。“它还是自动的！？”一名跟车的员工问道。“看起来相当不错，”他说，然后补充说，它的表现至少比其他由人类驾驶在公园路上行驶的车要好。
    ^(⁴⁹³)


    顺带提一下两个历史注脚。20 世纪 80 年代末，正是在这栋研究大楼里——当时它属于贝尔实验室——杨立昆发明了用反向传播进行训练的`卷积神经网络`，现在的自动驾驶车辆都是由它驱动。
    ^(⁴⁹⁴)


    ## 悬崖边缘：可能主义与现实主义


    人应当执行自己能管理和维持的低级行为，而不是会搞砸的高级行为……我们绝不能僭取属于那些精神视野比我们更高或更远的人的行为。


    ——艾丽丝·默多克（Iris Murdoch） ^(⁴⁹⁵)


    如果你是我，你会怎么做？她说。


    如果我是你——你，还是如果我是你——我？


    如果你是我——我。


    如果我是你——你，他说，我的做法和你一样。


    ——罗伯特·哈斯（Robert Hass） ^(⁴⁹⁶)


    模仿作为一种学习策略，除了纠正小错误的问题，还有一个问题是，有时你根本做不到专家能做到的事情。如果是这样，模仿就意味着去做一些你无法做到的事情。面对这种情况，你可能根本不应该试图表现得像他们一样。


    真实生活和流行文化中经常有新手试图模仿专家的例子，结果往往是灾难。


    正如国际象棋大师卡斯帕罗夫解释的：“棋手，尤其是业余爱好者，会花很多时间来学习和记忆他们喜欢的开局。这些知识很重要，但也可能是陷阱……死记硬背，不管多精彩，没有理解是没用的。总有一天，他会走到记忆的尽头，面对自己并不真正理解的棋局，没有预先准备好的走法。”


    卡斯帕罗夫回忆他曾指导一名 12 岁的棋手，复盘一场学生赛的开局。卡斯帕罗夫问他为什么在一种复杂的开局中下出了一个特别激进和危险的走法。“瓦列霍就是这样下的！”学生回答。卡斯帕罗夫说：“是的，我知道这位西班牙特级大师在最近的一局棋中下了这一手，但我也知道，如果这位少年棋手不理解这手棋背后的动机，就会陷入麻烦。”
    ^(⁴⁹⁷)


    这似乎既符合直觉，又在某种程度上自相矛盾：模仿“更厉害”的人的做法有时可能是严重的错误。这背后的故事非常复杂，并且与伦理学、经济学和机器学习有深刻关联。


    1976 年，伦理哲学前沿突然开始关注一个问题：你自己在未来行为对你现在该做什么有多大影响？


    当时在密歇根大学的哲学家霍利·史密斯（Holly Smith）专注于研究效用主义。她注意到一些奇怪的事情。“如果你是效用主义者，自然会问这样的问题：‘如果我现在做
    A，会产生最好的结果吗？’嗯，很明显，”她说，“这取决于我接下来会怎么做。” ^(⁴⁹⁸)


    她思考的思维实验被称为“拖延教授”。 ^(⁴⁹⁹)


    他应该同意吗？


    这里有两种不同的伦理思想流派分歧：“可能主义”——认为人应该做在任何情况下最好可能的事情——与“现实主义”——认为人应该根据以后实际会发生什么（无论是因为你自己后来的行为还是其他原因）做在当前最好的事情。
    ^(⁵⁰⁰)


    可能主义主张，对于拖延症者来说，最好可能的事情是同意审稿并按时完成。这得先同意，所以他应该同意。


    现实主义的观点更务实。就其本身而言，同意审稿必然导致糟糕的结果：根本不审稿。拒绝审稿意味着相对较好的结果：由资格稍逊的审稿人审稿。教授应该做实际上导致最好结果的事情，因此他应该拒绝。


    史密斯得出的结论是“一个人有时必须选择较低的行为而不是较高的行为”。她解释道：“如果一个行为让自主体有可能做好事，而同样的行为也让他有可能做灾难性的事情，并且他会选择后者而不是前者，那么选这个行为似乎不是什么好事。”


    与此同时，史密斯也阐释了现实主义的缺点：“现实主义给了你一个借口，基于你自己未来的道德缺憾去做坏事。”大约 40 年后，理论争论逐渐升温。“我想很多人会认为这个问题仍未解决，”史密斯说，“可以说讨论仍然很活跃。”
    ^(⁵⁰¹)


    这场讨论不仅仅是理论上的。例如，在 21 世纪的“有效利他理念”运动中，关于为了最大限度地帮助他人，一个人应该做多大程度的牺牲，意见不一。 ^(⁵⁰²)


    有效利他理念社群的领导者、有效利他理念中心的社群联络员朱莉娅·怀斯（Julia Wise）自己做出了令人印象深刻的承诺，将 50%的收入捐给慈善机构，但她强调不追求完美价值，“允许自己不纯粹”。
    ^(⁵⁰³)


    有效利他理念中心的共同创始人、牛津哲学家威尔·麦卡斯基尔（Will MacAskill）在这个问题上直言不讳。“我们应该做现实主义者，”他说，“如果你今天一次性捐出所有积蓄——抛却现实因素，这是可以做到的——你可能会感到非常沮丧，以至于将来干脆不再捐赠。然而，如果你决定捐出
    10%的收入，这一承诺将具有足够的可持续性，你可以在未来继续这样做，从而产生更大的总体影响。” ^(⁵⁰⁴)


    辛格自己也承认，从长远来看，最好是具有平衡和比例感。“如果你发现自己做的事情让你痛苦，是时候重新考虑一下了。你能因此变得更积极吗？如果没有，从各方面考虑，这真的是最好的吗？”他还指出，“有效利他理念者仍然相对较少，所以他们树立榜样，吸引其他人采纳这种生活方式是很重要的。”
    ^(⁵⁰⁵)


    现实主义与可能主义的争论，在机器学习中也同样存在。第 4 章曾讨论过，强化学习算法有一个主要族系是学习评估“价值”，“价值”表示为对各种可选行为的未来收益预期。（这被称为“`Q
    值`”，“品质”的缩写。）例如，下棋的自主体要学习预测各种下法获胜的概率，而玩雅达利游戏的自主体则要学习估计各种动作的预期得分。有了这些预测，接下来就只需采取`Q
    值`最高的行动。


    不过，这里面有一个值得明确的含糊之处。`Q 值`应该是你通过采取这一行动可能获得的最好预期收益，还是你实际将获得的预期收益？如果自主体全知全能，两者就是一回事，但如果不是这样，答案可能会大相径庭。


    这两种价值学习方法被称为“`同轨`”和“`离轨`”方法。`同轨`方法评估行动价值，是根据自主体采取行动并按自己的“策略”继续采取行动后实际将获得的收益。而`离轨`自主体评估行动的价值则是根据随后的最好可能的行为序列。
    ^(⁵⁰⁶)


    '
