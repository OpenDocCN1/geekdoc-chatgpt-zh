    216. Einhorn，“《专家测量与机械组合》”。↩


    217. Dawes&Corrigan，“《决策中的线性模型》”。↩


    218. 参见 Andy Reinhardt，“《史蒂夫·乔布斯谈苹果复兴：‘不是一个人的表演’》”，商业周刊在线，1998 年 5 月 12 日，`http：//www.businessweek.com/bwdaily/dnflash/may1998/nf80512d.htm`。↩


    219. Holmes&Pollock, 《霍姆斯-波洛克书信集》。↩


    220. Angelino 等，“《为分类数据学习可认证的最优规则列表》”。另见 Zeng, Ustun, and Rudin，“《再犯预测的可解释分类模型》”；和
    Rudin&Radin，“《当我们不需要时，为什么还在 AI 中使用黑箱模型？》”。另一个达到了`COMPAS`类似精度的简单模型，参见 Dressel&Farid，“《预测再犯的准确性、公平性与局限》”。进一步的讨论参见
    Rudin, Wang&Coker，“《再犯预测中的保密与不公平时代》”，以及 Chouldechova，“《刑事风险评估中的透明度与简洁性》”。↩


