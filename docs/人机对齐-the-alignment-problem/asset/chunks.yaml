    # 第二篇


    ## 自主


    ### 4. 强化


    强化在人类事务中的作用得到了越来越多的关注，不是因为学习理论的风潮变了，而是新发现的事实和实践增强了我们预测和控制行为的能力，并且在此过程中展示了其无可置疑的真实性和重要性。即使是那些已尽最大努力来证明它的人，也没有完全掌握强化的能力范围，更何况心理学家本来就有很强的文化惰性。这是可以理解的，因为这种变化可以说是革命性的：传统学习理论将被彻底革新。


    ——斯金纳（B. F. Skinner） ^([^(255)](#fn255))


    现代行为主义理论的问题不在于它们是错的，而在于它们可能成为事实。


    ——汉娜·阿伦特（Hannah Arendt） ^([^(256)](#fn256))


    1896年春天，格特鲁德·斯坦（Gertrude Stein）在哈佛大学参加了声望卓著的威廉·詹姆斯（William James）组织的心理学研讨班。斯坦在哈佛研究“自动主义行为”，即在没有刻意思考单词的情况下在纸上写出它们的能力。据此撰写的严肃学术论文将是她的处女作。更重要的是，开始于大学阶段的心理学研究启发了她标志性的现代主义“意识流”散文风格，并因此而闻名。
    ^([^(257)](#fn257))


    这个人名叫爱德华·桑代克，公平地说，他最初并没有打算将宿舍改造成鸡舍。他本来**想**研究人类儿童的学习机制，并以此驳斥所谓的超感官知觉。哈佛没有批准这项研究，所以作为后备计划……孵蛋器里孵出了一群叽叽喳喳的小鸡。
    ^([^(258)](#fn258))


    对于一个有抱负的心理学家，伺候一群小鸡在当时确实显得奇怪。动物研究尚未像20世纪那样成为时尚，桑代克自己的同学也认为他有点古怪。这虽然让同行侧目，也引起了女房东的不满，但是照料鸡群虽然烦琐，也并非没有好处。例如，在去坎布里奇的路上，桑代克经常不得不在家族世交莫尔顿的家里停留，借火炉给小鸡取暖。理由当然很正当——研究需要，但从桑代克的信中可以清楚看出，他主要是找机会去和莫尔顿家的小女儿贝丝调情。她后来成了他的妻子。


    桑代克在坎布里奇的女房东最终忍无可忍，宣布他的孵蛋箱有火灾危险，并给他下了最后通牒：小鸡必须送走。詹姆斯想帮他在哈佛校园里争取一点实验场地，但学校不同意。最后，詹姆斯不顾妻子的抗议，让桑代克把小鸡、孵蛋器和一大堆东西都搬进了自己家的地下室。（至少詹姆斯的孩子们很高兴。）


    1897年，桑代克从哈佛毕业，移居纽约并获得了哥伦比亚大学的研究生奖学金，这次是与各种动物打交道。这一年的经历让人沮丧。他的两只猫跑了，找不到狗，还说“我的猴子太野了，我不能碰它”。更糟糕的是，桑代克的城市动物园里的动物并非都是来为科学献身的，还有许多是害虫。在1898年2月14日给贝丝的信中，他写道：“刚才有只老鼠从我脚上跑过去。还有几只老鼠在啃书桌；3只小鸡在我旁边睡觉；地上乱七八糟，有烟叶、烟头、报纸、书、煤、鸡圈、猫奶碟、旧鞋子、煤油桶和一把没起作用的扫帚。我的房子是个破败的山洞。”不过他保证会清理干净，还邀请她去玩——毕竟那天是情人节。


    在这个肮脏的环境中，将会产生一些19世纪最具原创性和最重要的研究成果。桑代克建造了一套装置，他称为“迷箱”，里面安装了门栓、杠杆和按钮。他把动物放在盒子里，放一些食物在外面，观察动物——小鸡、猫和狗——如何找到出路。桑代克在给贝丝的信中写道：“你会看到各种特技表演，小猫打开门栓和按钮，拉绳子，像小狗一样讨食物，我只需在旁边吃着苹果抽着烟。”


    桑代克想研究的是学习机制，一种理论正在他的头脑中成形。桑代克一边吃着苹果抽着烟，一边观察那些寻找盒子诀窍的动物，最初的行为几乎完全是随机的：咬，推。一旦某个随机行为让它们从盒子里逃了出来，它们就会很快学会重复这个行为，并越来越擅长快速逃离盒子。“在许多偶然的动作中，有些动作会带来快乐，”他观察到，“从而越来越强化和牢固。”
    ^([^(259)](#fn259))


    桑代克发现的是一种更普遍的自然法则的要点。正如他所说，我们行为的结果要么“令人满意”要么“令人厌恶”。当行为的结果“令人满意”时，我们倾向于继续做。当结果“令人厌恶”时，我们会尽量避免。行为与结果的关联越明确，学习的效果就越明显。桑代克称之为“效果律”，这可能是他职业生涯中最著名也最持久的想法。


    正如他所说：


    效果律是：如果在情境和作出的反应之间能建立可变的关联，并且伴随或跟随着令人满意的状态，则这种关联会增强；如果作出的反应伴随或跟随着令人烦恼的状态，则关联会减弱。满足感（或烦恼感）与这种关联的联系越密切，对关联的强化效应（或弱化效应）就越明显。
    ^([^(260)](#fn260))


    这个思想看似平常，也很直观，却是20世纪建立的大部分心理学的基础。 ^([^(261)](#fn261))


    下一代的杰出心理学家爱德华·托尔曼（Edward Tolman）后来写道：“动物学习的心理学，更不用说儿童学习的心理学，过去和现在主要是围绕桑代克的观点。”
    ^([^(262)](#fn262))


    桑代克在心理学经典中占有了一席之地，但他自己对此倒是非常谦虚。1905年，桑代克出版了教科书《心理学的要素》，书中声称要推翻之前的主流教科书《心理学：简明教程》，这本书的作者不是别人，正是他在哈佛的导师威廉·詹姆斯。桑代克寄给他一张100美元的支票以补偿损失的版税。詹姆斯回答说：“说真的，桑代克，你是大自然的怪胎。自然的第一法则是消灭所有竞争对手（尤其是在教科书领域），你却用收益供养他们！”詹姆斯拒绝兑现支票，将它退了回去。
    ^([^(263)](#fn263))


    ### 数字试错法


    什么样的力通过什么样的过程或机制起作用，能产生什么样的肯定反应？在我看来，符合所有或几乎所有事实的答案是……施加于连接的强化力和机制。


    ——桑代克 ^([^(264)](#fn264))


    如果跟随桑代克的动物研究员和桑代克一样，最终感兴趣的是人类儿童心理学，那么他们并不孤单，研究计算机科学的先驱也是如此。1950年，艾伦·图灵（Alan Turing）在他最著名的论文《计算机与智能》中，就明确用这方面的术语来构想AI。“与其尝试构建程序来模拟成人大脑，”他写道，“为什么不模拟儿童大脑呢？如果能做到，然后用适当的课程对其进行教育，就能成为成人大脑。”图灵将他构想的模拟儿童大脑称为“无组织机器”，从随机配置开始，然后根据其（最初是随机的）行为的效果来改进。


    通往AI的路线图成形了。“无组织机器”将直接借鉴关于神经系统的知识，“教育课程”将直接借鉴行为主义研究发现的关于动物（和儿童）如何学习的知识。沃伦·麦卡洛克和沃尔特·皮茨在40年代初已经发现，用大量人工“神经元”，通过适当连线，几乎可以计算任何东西。图灵已经开始构想用试错法训练神经网络的方法。事实上，这正是50年前桑代克在烟雾缭绕的宿舍动物园里描述的“固化”过程；图灵的描述与桑代克的效果律几乎一模一样：


    面对出现的情形，如果应对行为不确定，对缺失数据进行随机选择，并在描述中给出适当的暂定输入，然后应用。如果引发了疼痛刺激，所有暂定输入都被取消，如果引发了愉悦刺激，则都被永久化。
    ^([^(265)](#fn265))


    20世纪50年代末，IBM纽约波基普西实验室的亚瑟·塞缪尔（Arthur Samuel）构建了一个下西洋跳棋的程序，这个程序能以一种粗糙原始的方式，根据输赢调整参数。没过多久，塞缪尔就输给了自己的创造物。正如《纽约客》1959年的报道：“塞缪尔博士可能是历史上第一个被自己设计的对手击败的科学家。”
    ^([^(266)](#fn266))

    '
  trans: '

    从更哲学的角度来看，这些技术表明，至少就神经网络而言，评论家和艺术家的界线可能很模糊。经过训练的网络可以**识别**，比如说湖泊或大教堂，利用同样的方法，也可以**生成**一个又一个湖泊，或者一个又一个大教堂的图像，它从未见过的图像。这是一条美丽的，可能也是辛苦的艺术实践路径：任何人只要具备艺术鉴赏力就可以是创造者。你所需的只是良好的品位、随机的变化和充足的时间。


    诸如此类的技术不仅开辟了广阔的审美空间，而且具有重要的网络诊断用途。例如，莫尔文采夫、奥拉和泰卡利用从噪点图开始优化的技术，让图像分类系统对所有不同类别都“生成”最类似的图像。“在某些情况下，”他们写道，“这会揭示出，神经网络并不是真的在看我们认为它在看的东西。”例如，最大化“哑铃”分类的图片包括超现实的、肉色的、无身体的手臂。“没错，是有哑铃，”他们写道，“但是生成的哑铃图片都含有举起哑铃的手臂。这说明网络未能完全领会哑铃的本质。也许它从未见过没有被手臂举起的哑铃。可视化可以帮助我们纠正此类训练失误。”
    ^(²⁴³)


    从最初的深度梦境项目开始，泰卡在谷歌合作创建了艺术家和机器智能项目，并继续探索机器学习的审美可能。奥拉和莫尔文采夫及其合作者则在继续探索可视化和网络诊断。
    ^(²⁴⁴)


    这个团队对研究进展总体上表达了有分寸但有感染力的乐观态度。他们写道：“为了构建强大且值得信赖的可解释界面，我们还有很多工作要做。但是，一旦成功了，可解释性将有望成为一个强有力的工具，支持有效的人工监督，并建立公平、安全和对齐的
    AI 系统。” ^(²⁴⁵)


    尤其是在视觉领域，已经取得了很大进步。但如果不从视觉层面，而是从**概念**层面来理解网络，又该怎么做呢？例如，有没有办法通过文字来理解网络内部？这是解释的最新前沿之一。


    ### 深度网络和人类概念


    2012 年秋天，MIT 的研究生贝·金姆（Been Kim）刚开始攻读博士，就投身于一个将影响她未来人生的项目。她之前一直在机器人领域，为了更熟悉工业机器人环境，她甚至考了叉车驾照，但最终她还是认为这个领域不适合自己。“我意识到机器人有硬件局限性，”她告诉我，“我想做的目前还做不到”。
    ^(²⁴⁶)


    金姆逐渐意识到可解释性就算不是她的终身事业，至少也会成为她的论文主题。那年 12 月，她第一次参加 NeurIPS 会议时，遇到了一位年长的同行。“我告诉那位老师，我在研究可解释性，他说，‘哦，为什么？神经网络会解决一切！干嘛研究这个？’我就想，‘好吧……’”她一边回忆一边笑，“想象你去看医生，医生说：‘嗯，我要把你切开，取出一些东西。’你会问：‘哦，为什么？’他说：‘嗯，我不知道。机器说这是你的最佳选择。99.9%。’”


    “你会问什么？”她说。她举的例子略显夸张，但又不是夸张。“你会对医生说什么？对我来说，这是摆在眼前亟待解决的问题。我不知道人们需要多久才会意识到这很重要。”傍晚时分，夕阳透过玻璃照进谷歌大脑的会议室。自
    2017 年以来，金姆一直在谷歌大脑工作。“时机可能已经成熟。”


    金姆认为，解读和阐释包含内在的人性维度，因此这个领域存在内在的混乱和跨学科性。“其中尚未被充分开发的很大一部分，涉及对人性的思考，”她说，“我一直强调人机交互和认知科学……没有这些，我们就无法解决这个问题。”认识到可解释性不可避免的人性一面，意味着事物并不总是能干净利落地转化为熟悉的计算机科学语言。


    “有些人认为，你必须给出数学定义，说明什么是解释。我认为这不现实，”她说，“不可量化的东西让计算机科学家感到不自在，天生就不舒服。”


    金姆的所有论文几乎都涉及基于人类受试者的实际研究，这类研究在计算机科学中很罕见。“通过用户进行迭代至关重要，”她说，“因为它存在的唯一理由是为人类所用……我们必须**证明**它对人类有益。”这个迭代很关键，因为设计师认为对人类用户有用的东西经常没有用。如果解释文档或可解释的模型是供真实的人使用，那么它的设计过程就应该像设计驾驶舱控制面板或软件界面一样反复迭代。
    ^(²⁴⁷)


    这些研究为之前提倡使用简单模型的故事增加了一些复杂性。金姆指出，使用简单模型是否是最好的解释方法，最终是一个经验问题。“在某些情况下，在非常有限的情况下，你可以十分肯定并通过经验验证，**如果**特征很少，它对于特定的任务是可解释的，在这种情况下，你当然可以就给定问题给出最可解释的模型，然后你可以优化它。”但是金姆等人对真正人类的研究表明，在现实世界中事情很少这么简单。


    例如，2017 年，微软研究院的詹·沃特曼·沃恩（Jenn Wortman Vaughan）和同事研究了人类用户与机器学习的房屋价值模型的互动方式，该模型基于面积、浴室等特征来预测价格。当模型使用的特征较少并且对用户更加“透明”时，用户预测与模型预测更一致。但是无论是简单性还是透明度都不会影响人们对模型的**信任**度。事实上，当模型更透明时，人们反而**更不**容易意识到模型错了。
    ^(²⁴⁸)


    金姆认为，“人类使用概念来思考和交流”，而不是数字。 ^(²⁴⁹)


    例如，某个模型正确识别了斑马图片，如果 TCAV 发现网络在识别时使用了“条纹”“马”和“稀树草原”等概念，则似乎是合理的。又例如，用一组医生照片初步训练的网络可能由于数据集有偏差而认为“男性”概念有一定的判断价值。TCAV
    将揭示这一点，提醒我们可能需要调整模型或训练数据，以消除这种偏见。 ^(²⁵⁰)


    我们怎样才能获得这种洞察力？之前用模型生成的图像不仅使用了最终的类别标签输出，还涉及网络**内部**活动的宏大模式，涵盖数千万个神经元。这些内部激活虽然在人眼看来只是一片嘈杂，但**机器**可以对其进行处理。TCAV
    的基本思想是，对于任何你感兴趣的概念，比如医生例子中的“男性”概念，你给网络展示一些男性的图像，然后再展示一些随机的其他东西的图像：女人、动物、植物、汽车、家具等等。你把网络的内部状态（比如某个特定的层）输入给另一个系统，一个简单的线性模型，让它学习辨别某个类别（这里是“男性”）的典型激活和非此类图像触发的激活。
    ^(²⁵¹)


    “我认为这种方法有个独特的好处，”她说，“解释用的是用户的语言。用户不必了解机器学习……我们可以用**他们的**语言来解释，用他们自己的术语回答**他们的**疑虑。”
    ^(²⁵²)


    金姆用 TCAV 探查了两个流行的图像识别模型，Inception v3 和 GoogLeNet，发现了许多此类问题。例如，“红色”概念对“消防车”概念至关重要。“**如果**你所在地区消防车是红色的，这是合理的，”她说。
    ^(²⁵³)


    金姆还发现“手臂”概念对识别“哑铃”很重要，这印证了谷歌深度梦境团队之前的视觉发现，意味着该网络可能不擅长识别架子上或地上的哑铃。 ^(²⁵⁴)


    谷歌 CEO 桑达尔·皮查伊（Sundar Pichai）在谷歌 2019 年 I/O 大会上发表主题演讲时，重点介绍了金姆的 TCAV 研究。“仅仅知道模型是否有效是不够的，”皮查伊说，“我们还需要知道它是**如何**运作的。”


    2012 年，金姆觉得这些担忧几乎没有听众，只有她，再加上她在 MIT 的导师辛西娅·鲁丁和朱莉·沙阿（Julie Shah），“对这个话题有一些兴趣”。到
    2017 年，在该领域最大的会议上，已经有了专门讨论可解释性和解释方法的研讨会。2019 年，谷歌 CEO 在公司最重要的展示舞台自豪地介绍了她的工作。


    我问金姆是否感觉像拨云见日。


    “我们还有很长的路要走。”她似乎不愿让自己有些许自满，或是“我早就告诉过你”的感觉。相反，她感受到的是沉甸甸的责任：面对技术的快速更新和部署，这些问题必须更快地得到解决。她必须走在潮流的前面，确保不会出现高风险问题。


    当我们结束谈话，走出会议室时，我感谢金姆给了我时间，并问她是否还有什么想补充的。她若有所思地停顿了大约 10 秒钟，然后突然想起了什么。


    “还记得我之前提到的那位老师吗？”2012 年，当她还是博士一年级时，跟他提到她的博士论文是研究可解释性，他认为这是死胡同，还劝她换方向。不过，她并不反感他：“我认为他是在很诚恳地给我建议……这在当时其实很合理，完全出于好心。”


    金姆咧嘴一笑：“他现在也在研究可解释性。”


