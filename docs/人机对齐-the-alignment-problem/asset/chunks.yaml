- raw: '结果证明，关键的洞察隐藏在自行车的故事中。为了防止自行车绕圈，无休止地累积分数，你还必须对**远离**目标进行**惩罚**。罗素最初学的是物理，他把奖励问题和能量守恒联系起来。罗素解释道：“关键是让塑造成为物理中的‘守恒场’。”
    ^([^(361)](#fn361))


    这个思想在自行车问题中很直观：如果你奖励朝目标前进，你也必须**惩罚远离**目标。换句话说，奖励“积分”应该始终反映自行车离目标有多近，而不是它所走的路径。但将激励机制视为“势能”会更深刻和更具普适性。这是一个必要和充分条件，确保你用修改过的奖励训练的系统不会将其行为与实际问题割裂开来。


    “一般来说，”罗素说，“最好是根据环境的实际需求来设计绩效指标，而不是根据所认为的自主体应该如何表现来设计。” ^([^(362)](#fn362))


    尽管这不是解决**所有人**类激励问题的灵丹妙药，但将焦点从行动转向状态，确实启发了我们重新思考为他人有意或无意设计的激励结构。假设孩子为了收益翻倍，将垃圾又倒出来，我们可以把奖励变成一个“守恒场”，责骂乱倒垃圾，使得重复的净收益为0。不过，改为表扬状态而非行动可能更容易：我们可以说：“哇，地板真干净啊！”


    当然，奖励的艺术和科学远不止是避免恶性绕圈，这是一个开始。吴恩达和罗素在总结工作时谦虚谨慎地指出：“我们认为，寻找好的塑造函数将越来越重要。” ^([^(363)](#fn363))


    **设计的奖励**


    我对他说：“你要多生养几个。”但不是用那些话说的。


    ——伍迪·艾伦（Woody Allen） ^([^(364)](#fn364))


    从达尔文的角度来看，人们想要的是相当清楚的：繁殖和保护他们的遗传谱系。人们**具体**想要的，因时而异，更加混杂和短视：高潮、巧克力、新车、尊重。因此，似乎我们在生理和文化上被诱导，想得到一些眼前的具体的东西，这些东西通常会引导我们的行为模式，使其与最终的进化目标相一致，否则目标会太遥远或定义不清，难以有意识地瞄准。
    ^([^(365)](#fn365))


    听起来熟悉吗？


    理解塑造的本质和作用——首先在行为心理学中，然后在机器学习中——不仅教了我们如何设计更好的自主体。也许它最令人惊讶的贡献在于让我们从另一个角度思考进化。


    20世纪80年代末，布朗大学的迈克尔·利特曼在读研究生时，曾到贝尔通信研究所（Bellcore）工作过一段时间，这家研究所位于新泽西州，之前是美国电话电报公司（AT&T）的一部分。在那里，他很快遇到了一位导师和朋友，戴夫·阿克利（Dave Ackley）。


    利特曼问阿克利关于行为问题的研究，即随着时间推移做决定和行动。利特曼回忆道：“他大概是这样说的，‘哦。你说的是强化学习。我看过一点。我给你找篇论文。’他给了我桑顿1988年的时序差分论文。”
    ^([^(366)](#fn366))


    利特曼开始阅读关于时序差分学习的文献，并着了迷。他问阿克利在哪里可以深入学习。“他说，‘邀请桑顿来做个演讲吧’。我很惊讶，‘啊？你能请到他？你读了一篇论文，上面有个人的名字，然后你就能和他当面交流？……在我眼里那是**文献**，不认为它是**圈子**’；‘不，那是一群人，他们相互认识，阿克利说，‘我可以邀请他。’所以他把他请来了。”


    桑顿来了，让阿克利和利特曼都迷上了强化学习。


    他们感兴趣的问题是，进化如何塑造我们的奖励函数，从而产生对一个生物或物种的长期整体生存有利的短期行为。生物的奖励函数本身已经做到了这一点，否则行为可能看起来非常随机。阿克利和利特曼想知道，如果直接让奖励函数进化和变异，让模拟的虚拟实体死亡或繁殖，会发生什么变化。
    ^([^(367)](#fn367))


    他们创造了一个二维虚拟世界，让模拟生物（或“自主体”）可以在一个生境中移动、进食、被捕食和繁殖。生物的“遗传基因”包含了自主体的奖励函数：它有多喜欢食物，它有多不喜欢靠近捕食者，等等。在它的一生中，它会使用强化学习来学习如何采取行动以最大化收益。当生物繁殖时，它的奖励函数会和一些随机突变一起遗传给后代。阿克利和利特曼用随机生成的自主体启动了原始种群。


    “然后，”利特曼说，“我们看着它运行，700万个时间步，这在当时是很大的规模。那时计算机速度较慢。”会发生什么？正如利特曼总结的：“奇怪的事情发生了。” ^([^(368)](#fn368))


    大致看来，大多数成功的自主体最终的奖励函数很好理解。食物通常被认为是好的。食肉动物通常被认为是不好的。但仔细观察就会发现一些怪癖。例如，一些自主体只学会了食物位于其**北面**时才接近食物，而在食物位于其南面时则不会。


    “它不是所有方向的食物都喜欢，”利特曼说，“在奖励函数中有些奇怪的洞。如果人为修补这些洞，这些自主体会变得非常擅长进食，它们会把自己撑死。”


    他们创建的虚拟生境中有树，自主体可以在那里躲避捕食者。自主体学会了在树附近闲逛。被树吸引的自主体最终存活了下来——因为当捕食者出现时，它们有地方可以躲藏。


    然而，有个问题。它们天生的奖励系统，经过进化的修补，告诉它们围着树闲逛很好。渐渐地，它们的学习程序明白了，根据这个奖励制度，靠近树是“好的”，远离树“不好”。它们逐渐学会为此优化行为，越来越长久地守着树不离开，到了阿克利所说的“陪树老去”的地步。它们从不远离树，耗尽食物，饿死。


    然而，这种“陪树老去”行为总是在自主体达到生殖年龄后开始，因此没有被进化淘汰，庞大的爱树自主体社群蓬勃发展。


    对利特曼来说，这除了体现进化的怪异和任性，还有更深层的信息。“这是对奖励函数有趣的案例研究，有意思的不仅仅在于孤立的奖励函数，而是奖励函数与它所产生行为的相互作用。”


    特别是，**如果**“陪树老去”自主体不是那样过于擅长最大限度地获得奖励，它们最初的奖励函数是最适合的。一旦它们变得更有能力和更熟练，它们就滥用奖励函数到了危险的地步，直至将自己毁灭。


    这其中不难看出对智人的警示。像“有机会尽可能多吃糖和脂肪”这样的启发式方法是最优的，只要环境中没有那么多糖和脂肪，并且你并不特别擅长寻找。一旦环境变化，为你和你的祖先服务了数万年的奖励函数会突然让你偏离正轨。


    安德鲁·巴图认为，思考进化中的这类线索很有用，因为我们现在扮演了奖励设计师的角色。“进化为我们设计了奖励函数，所以这对我们为人工系统设计奖励函数非常有启发，”他说，“自然界就是这样。进化产生了这些奖励信号，鼓励我们去做那些让我们成功繁衍的事情。”
    ^([^(369)](#fn369))


    正如巴图指出的：“一个有趣的事情是，进化并没有用生殖成功作为我们的奖励信号，而是给了我们预测器奖励。”我们优化自己的行为，以最大化我们认为有收益的东西，但在更大的背景中，进化在塑造我们会认为什么东西是有收益的。“所以，这是一个两级优化，”巴图说，“我对此非常感兴趣。”


    近年来，巴图与密歇根大学的萨廷德·辛格（Satinder Singh）和理查德·刘易斯（Richard Lewis）以及当时还在读博士的乔纳森·索尔格（Jonathan Sorg）合作，研究“最优奖励问题”。
    ^([^(370)](#fn370))


    “人工自主体的目标应该和自主体设计者的目标一样吗？”他们写道，“这个问题很少被考虑。” ^([^(371)](#fn371))


    他们说，考虑一个游戏，其中只有一个自主体、一根钓竿、一些蠕虫和养了很多鱼的池塘。 ^([^(372)](#fn372))


    也许最有趣的是这样的情形：一个自主体聪明到足以学会钓鱼，并且寿命也长到**刚好**可以学习钓鱼——但是还不够长到能从这种投资中获得**好处**。那它就应当讨厌吃鱼，这样它们就别无选择，只能吃虫子了！


    自主体的寿命、资源或设计的微妙变化可能会对最优奖励的结构产生剧烈和突然的影响。对于在**特定**环境下什么样的奖励对**特定**的自主体来说是理想的，似乎无法给出简单答案。这方面的研究还在继续，但学会明确区分你想要什么和你奖励什么，是答案的重要组成部分。
    ^([^(373)](#fn373))


    最近，心理学家和认知科学家正在利用这些工具来问一个有趣的问题，不是关于机器，而是关于人类。他们问，如果这个计算能力有限、不耐烦、目光短浅的自主体是你自己，你应该怎样设计最优的奖励函数来帮助自己学习优化？


    **我们应该怎样训练自己？**


    机器学习中奖励塑造的理论和实践，不仅给出了操控自主直升机的方法，还为理解人类智能和改善人类生活贡献了两个不同的视角。第一，对于为什么有些问题或任务比其他的更难解决或完成的问题，它给出了一个原因：**稀疏性**。第二，对于如何增加奖励让棘手问题变容易，同时又不引入不适当激励的问题，它提供了一个理论：奖励状态，而不是行为。


    这些见解在改善人类生活方面的潜力巨大。光是经济利益就很大——最近的一份报告估计，英国每年因工作拖延造成的损失达760亿英镑——更不用说对我们的身心健康、生活质量和成就感造成的隐形损失了。
    ^([^(374)](#fn374))


    我们生活在电子游戏成瘾和现实世界拖延的时代，也许这不是拖延者个人的错。正如斯金纳说的：“我很想对实验动物大喊，‘乖一点，该死的，乖一点！’最终，我意识到实验动物总是正确的。它们的表现就应该是这样。”
    ^([^(375)](#fn375))


    麦戈尼格尔是一名游戏设计师，她的职业生涯是设计游戏来帮助人们——包括她自己——克服生活中的挑战。她认为，大多数游戏，尤其是电脑游戏，之所以如此令人着迷和上瘾，是因为它们总是让你需要做的事情很清晰，并且有可能做到。


    首先是无论你何时登入这些网络游戏……有很多不同的角色愿意无条件相信你拯救世界的使命。不会是随随便便的任务，而是与你目前在游戏中的等级相匹配。是不是？所以你可以做到。他们永远不会给你一个你无法完成的挑战。但是很接近你的能力，所以你必须努力才能做到。
    ^([^(376)](#fn376))


    换句话说，游戏之所以吸引人，是因为游戏非常擅长**塑造**。关卡是完美的课程，绩点是完美的伪奖励，它们是斯金纳式的杰作。


    强化学习不仅提供了框架来理解和阐释游戏吸引人之处，还提供了方法来对这些直观认识进行实证。一个从最简单到最难的关卡都有清晰课程的游戏，并且用清晰的伪奖励指引前进方向，同时激励探索和促进技能发展，应该更容易让算法学习。不难想象游戏公司在不远的将来会用自动化玩家测试关卡，以发现真正的人类玩家可能会放弃或退出的地方。


    当然，问题在于这些虚拟环境比真实环境更擅长塑造。正如麦戈尼格尔说的：“现在，像《魔兽世界》这样的协作在线环境的问题是，一直处于史诗级胜利的巅峰是如此令人满足，以至于我们把所有时间都花在游戏世界里。游戏比现实更好。”对麦戈尼格尔来说，解决方案不是让自己摆脱这些完美的奖励塑造环境，而是相反：“要让现实世界更像游戏。”


    在这方面，麦戈尼格尔自己也倡导了一些运动，她还利用游戏来克服自己生活中的障碍，包括脑震荡长期康复后出现的自杀性抑郁症。 ^([^(377)](#fn377))


    这个领域被称为**游戏化**， ^([^(378)](#fn378))


    马克斯·普朗克智能系统研究所的认知科学家福尔克·利德（Falk Lieder）无论是在研究中还是在生活中，对这个问题都有很深刻的认识。


    利德的研究主要围绕他提出的“理性增强”。他研究人们如何思考和做决定，与大多数研究人员不同，他不仅对理解人类认知感兴趣，还致力于设计有效的工具和干预措施让人类思考得更好。他最早的人类实验对象就是他自己。


    在成长过程中，利德发现学校教育让他感到沮丧，尽管给了他很多思考的空间，却从未触及思考本身。“我一直觉得我真正想学的是思考方法，以及如何做出好的决定，”他解释道，“没人能教我这个。他们只教我关于世界的事实陈述，这不是很有用。我真的很想学习如何思考。”
    ^([^(379)](#fn379))


    随着时间推移，对个人进步的追求逐渐演变为更大的追求：理解人类推理原理，并创造工具对其进行改进。“我研究的一部分，”他解释道，“就是发现最优的思考和决策策略，这样我们就可以为好的思考创建真正基于科学的课程。”


    利德对游戏化感兴趣，具体说是他提出的**最优**游戏化：给定一个目标，帮助实现该目标的最优激励结构是什么？ ^([^(380)](#fn380))


    利德与汤姆·格里菲思合作，建立了一些最优游戏化的基本规则。他们借鉴了吴恩达和斯图尔特·罗素的发现，最重要的规则之一是奖励**状态**，而不是**行为**。因此，分配给行为的分数必须能体现由此导致的状态有多好——而且，正如利德指出的，“分数的分配方式必须是当你撤销某件事时，你失去的分数和你做这件事时获得的分数一样多”。这就是兰德尔夫和阿尔斯特勒姆在骑自行车机器人身上学到的东西，也是安德烈和泰勒在振动的足球机器人身上学到的东西，也是格里菲思在女儿把垃圾倒到地板上时学到的东西。


    吴恩达和罗素的论文曾指出，对于一个预测自身行为影响的能力有限的自主体，塑造奖励可以使其表现得好像更有远见。 ^([^(381)](#fn381))


    利德和格里菲思设计了一项实验，让受试者扮演航线规划者的角色。让飞机飞往某些城市的航段可能有利可图，但可能会导致下一航段没什么有利可图的路线，反过来也是一样：为了其他航段的收益，亏本飞某个航段可能是值得的。他们尝试在航段票价上增加额外的收益（或罚款），以反映执行该航段后的后续成本或收益。结果符合预期，这使得人们更容易做出更好、更有利可图的决定。


    只有一个缺点：塑造奖励将选择的长期成本和收益加在了票价中，因此规划者无需长远考虑。这使得他们的决策更加**准确**，但有些无力。人们不再需要努力思考，他们也的确没有。“如果你在一个（短视）决策能奏效的环境中行动，”利德说，“你会越来越依赖系统。”
    ^([^(382)](#fn382))


    这引出了一个有趣的可能：能不能利用最优游戏化，不是**消除**规划的需要，而是让人们**更擅长**规划？


    如果是这个目的，激励措施会截然不同。与其将界面构造一个容易的问题，纳入长期成本——能带来更高质量的决策，但或许会导致受试者怠惰或自满，让他们更依赖界面——不如调整价格来创建一个**课程**。受试者可以逐步被**教导**如何长远思考，从简单的图开始，随着受试者越来越擅长，慢慢增加复杂性。这个界面不是作为拐杖，而是使用一组不同的激励来做相反的事情：“教人们做更长远的规划，”利德解释道，“这样他们就可以在短期收益与长期价值不一致的环境中取得成功。”


    利德最新的一项实验不是关于飞行计划，而是更熟悉的背景：拖延。他和格里菲思精心设计了一项很难的任务——就5个主题写一系列短文，其中一些更长也更难——并发布到MTurk网站上，人们可以选择在10天后的截止日期前完成所有短文并获得20美元。在所有注册的人中，40%的人甚至**从未开始**。（这尤其有讽刺意味，因为在认领任务时，他们有机会拒绝参与并获得15美分！）
    ^([^(383)](#fn383))


    利德和格里菲思还试验了奖励措施，参与者完成一篇文章就能获得“分数”，没有现金价值，但是令人鼓舞。每篇文章的分数相同。结果没用。


    最后，他们向第三组参与者提供了**最优**激励：分值能精确反映每个主题有多难或有多令人不愉快，以及当他们完成这个主题时离挣20美元有多近。（例如，为朝鲜经济政策写100个字，大约是为他们最喜欢的电视节目写50个字的分值的3倍。）这次有85%的参与者完成了所有5篇短文。
    ^([^(384)](#fn384))


    利德将这样的系统视为“认知假体”， ^([^(385)](#fn385))


    攻读博士时，利德发现自己陷入了可怕的文章写作任务的放大版本。“我认为最糟糕的情形之一是无法得到自己进步的信息，”他说，“官方规矩是，你是博士生了，然后是你获得了博士学位，仅此而已，其间5年没有反馈。”


    博士生是焦虑和抑郁率较高的群体，对他们来说，拖延几乎是流行病。 ^([^(386)](#fn386))


    那样行不通。利德需要别的东西。他给自己设计了5年课程——“我把它分解成几百个关卡。”当他做出他认为可能在几年后带来**真正**引用的研究时，他会奖励自己虚拟的“引用”分。他使用为参与者写短文打分一样的最优游戏化计分，给他攻读博士的每个子任务赋予适当分值。为了克服一些坏习惯，他甚至还引入了惩罚——利用帕夫洛克手环
    ^([^(387)](#fn387))


    在利德自己的行为训练实验中，他既是实验者也是受试者，这让他获得了解决奖励塑造问题的独特优势。对自己的训练同时也是进行研究的过程和研究的中心问题。结果令人鼓舞，现在有了自己的实验室的利德用博士头衔证明了这一点。


    **超越外部强化**


    对斯金纳来说，不仅个人的自由意志令人不安地处于“虚构的位置”，甚至整个人类文明的故事本质上都是奖励结构的故事。斯金纳本人对此持乐观态度，他写了乌托邦小说《瓦尔登湖第二》，构想了一个完美的行为主义社会。


    然而，任何接触过儿童或动物的人可能都有一种挥之不去的怀疑，即对于我们为什么要做我们所做的事情，奖励最大化实际上**并不是**全部。我们玩自己发明的游戏，不是为了明显的奖励。我们翻开石头，或者登山，只是为了看看会发现什么。我们探索。我们很爱玩，也很好奇。简而言之，我们既受**外在**奖励驱使，也受**内在**奖励驱使。


    碰巧的是，在机器学习的世界里，这也变得越来越受欢迎。


    ## **6. 好奇**


    未经训练的婴儿大脑要成长为智慧的大脑，必须具备规训性和主动性。目前我们还只考虑了规训性。


    ——图灵 ^([^(388)](#fn388))


    2008年春天，阿尔伯塔大学的计算机科学家迈克尔·鲍林（Michael Bowling）和研究生马克·贝勒马尔（Marc Bellemare）在巴巴多斯的海滩上散步。鲍林有个想法。当时，研究强化学习通常是研究人员从头开始自己设计游戏，然后搭建系统来挑战那个游戏。
    ^([^(389)](#fn389))


    鲍林心想，能不能建立一个统一的环境，所有人都可以用，不是一个游戏，而是一个庞大的游戏库。另外游戏能不能就用**真**游戏，比如20世纪七八十年代风靡一时的雅达利2600游戏机上的经典游戏？


    贝勒马尔回忆自己当时的反应，“这是我听过的最愚蠢的想法”。 ^([^(390)](#fn390))


    “然而3年后，嗯，我不再觉得这个想法很蠢。”事实上，贝勒马尔发现他非常喜欢这个想法，于是鲍林成了他的博士导师，这个想法也成了他的博士论文。


    这个电子游戏库项目被称为街机学习环境（ALE），很有点疯狂，不仅因为它工作量很大，还在于它对该领域的研究者提出的挑战。 ^([^(391)](#fn391))


    问题的很大一部分难点在于，当时使用的特定游戏环境经常是用精练的术语向自主体描述世界，自主体获得的输入更高层也更好用。在用轮式推车平衡杆子的例子中，推车的位置、速度和杆子的倾斜角度、速度等会提供给系统作为输入。在有树、食物和捕食者的二维网格世界的例子中，会提供自主体的位置、健康和饥饿度、附近是否有捕食者、最近的食物在哪里等信息。这些信息也就是所谓的“特征”。'
  fmt: '

    结果证明，关键的洞察隐藏在自行车的故事中。为了防止自行车绕圈，无休止地累积分数，你还必须对**远离**目标进行**惩罚**。罗素最初学的是物理，他把奖励问题和能量守恒联系起来。罗素解释道：“关键是让塑造成为物理中的‘守恒场’。”
    ^([^(361)](#fn361))


    这个思想在自行车问题中很直观：如果你奖励朝目标前进，你也必须**惩罚远离**目标。换句话说，奖励“积分”应该始终反映自行车离目标有多近，而不是它所走的路径。但将激励机制视为“势能”会更深刻和更具普适性。这是一个必要和充分条件，确保你用修改过的奖励训练的系统不会将其行为与实际问题割裂开来。


    “一般来说，”罗素说，“最好是根据环境的实际需求来设计绩效指标，而不是根据所认为的自主体应该如何表现来设计。” ^([^(362)](#fn362))


    尽管这不是解决**所有人**类激励问题的灵丹妙药，但将焦点从行动转向状态，确实启发了我们重新思考为他人有意或无意设计的激励结构。假设孩子为了收益翻倍，将垃圾又倒出来，我们可以把奖励变成一个“守恒场”，责骂乱倒垃圾，使得重复的净收益为0。不过，改为表扬状态而非行动可能更容易：我们可以说：“哇，地板真干净啊！”


    当然，奖励的艺术和科学远不止是避免恶性绕圈，这是一个开始。吴恩达和罗素在总结工作时谦虚谨慎地指出：“我们认为，寻找好的塑造函数将越来越重要。” ^([^(363)](#fn363))


    ## 设计的奖励


    我对他说：“你要多生养几个。”但不是用那些话说的。


    ——伍迪·艾伦（Woody Allen） ^([^(364)](#fn364))


    从达尔文的角度来看，人们想要的是相当清楚的：繁殖和保护他们的遗传谱系。人们**具体**想要的，因时而异，更加混杂和短视：高潮、巧克力、新车、尊重。因此，似乎我们在生理和文化上被诱导，想得到一些眼前的具体的东西，这些东西通常会引导我们的行为模式，使其与最终的进化目标相一致，否则目标会太遥远或定义不清，难以有意识地瞄准。
    ^([^(365)](#fn365))


    听起来熟悉吗？


    理解塑造的本质和作用——首先在行为心理学中，然后在机器学习中——不仅教了我们如何设计更好的自主体。也许它最令人惊讶的贡献在于让我们从另一个角度思考进化。


    20世纪80年代末，布朗大学的迈克尔·利特曼在读研究生时，曾到贝尔通信研究所（Bellcore）工作过一段时间，这家研究所位于新泽西州，之前是美国电话电报公司（AT&T）的一部分。在那里，他很快遇到了一位导师和朋友，戴夫·阿克利（Dave
    Ackley）。


    利特曼问阿克利关于行为问题的研究，即随着时间推移做决定和行动。利特曼回忆道：“他大概是这样说的，‘哦。你说的是强化学习。我看过一点。我给你找篇论文。’他给了我桑顿1988年的时序差分论文。”
    ^([^(366)](#fn366))


    利特曼开始阅读关于时序差分学习的文献，并着了迷。他问阿克利在哪里可以深入学习。“他说，‘邀请桑顿来做个演讲吧’。我很惊讶，‘啊？你能请到他？你读了一篇论文，上面有个人的名字，然后你就能和他当面交流？……在我眼里那是**文献**，不认为它是**圈子**’；‘不，那是一群人，他们相互认识，阿克利说，‘我可以邀请他。’所以他把他请来了。”


    桑顿来了，让阿克利和利特曼都迷上了强化学习。


    他们感兴趣的问题是，进化如何塑造我们的奖励函数，从而产生对一个生物或物种的长期整体生存有利的短期行为。生物的奖励函数本身已经做到了这一点，否则行为可能看起来非常随机。阿克利和利特曼想知道，如果直接让奖励函数进化和变异，让模拟的虚拟实体死亡或繁殖，会发生什么变化。
    ^([^(367)](#fn367))


    他们创造了一个二维虚拟世界，让模拟生物（或“自主体”）可以在一个生境中移动、进食、被捕食和繁殖。生物的“遗传基因”包含了自主体的奖励函数：它有多喜欢食物，它有多不喜欢靠近捕食者，等等。在它的一生中，它会使用强化学习来学习如何采取行动以最大化收益。当生物繁殖时，它的奖励函数会和一些随机突变一起遗传给后代。阿克利和利特曼用随机生成的自主体启动了原始种群。


    “然后，”利特曼说，“我们看着它运行，700万个时间步，这在当时是很大的规模。那时计算机速度较慢。”会发生什么？正如利特曼总结的：“奇怪的事情发生了。” ^([^(368)](#fn368))


    大致看来，大多数成功的自主体最终的奖励函数很好理解。食物通常被认为是好的。食肉动物通常被认为是不好的。但仔细观察就会发现一些怪癖。例如，一些自主体只学会了食物位于其**北面**时才接近食物，而在食物位于其南面时则不会。


    “它不是所有方向的食物都喜欢，”利特曼说，“在奖励函数中有些奇怪的洞。如果人为修补这些洞，这些自主体会变得非常擅长进食，它们会把自己撑死。”


    他们创建的虚拟生境中有树，自主体可以在那里躲避捕食者。自主体学会了在树附近闲逛。被树吸引的自主体最终存活了下来——因为当捕食者出现时，它们有地方可以躲藏。


    然而，有个问题。它们天生的奖励系统，经过进化的修补，告诉它们围着树闲逛很好。渐渐地，它们的学习程序明白了，根据这个奖励制度，靠近树是“好的”，远离树“不好”。它们逐渐学会为此优化行为，越来越长久地守着树不离开，到了阿克利所说的“陪树老去”的地步。它们从不远离树，耗尽食物，饿死。


    然而，这种“陪树老去”行为总是在自主体达到生殖年龄后开始，因此没有被进化淘汰，庞大的爱树自主体社群蓬勃发展。


    对利特曼来说，这除了体现进化的怪异和任性，还有更深层的信息。“这是对奖励函数有趣的案例研究，有意思的不仅仅在于孤立的奖励函数，而是奖励函数与它所产生行为的相互作用。”


    特别是，**如果**“陪树老去”自主体不是那样过于擅长最大限度地获得奖励，它们最初的奖励函数是最适合的。一旦它们变得更有能力和更熟练，它们就滥用奖励函数到了危险的地步，直至将自己毁灭。


    这其中不难看出对智人的警示。像“有机会尽可能多吃糖和脂肪”这样的启发式方法是最优的，只要环境中没有那么多糖和脂肪，并且你并不特别擅长寻找。一旦环境变化，为你和你的祖先服务了数万年的奖励函数会突然让你偏离正轨。


    安德鲁·巴图认为，思考进化中的这类线索很有用，因为我们现在扮演了奖励设计师的角色。“进化为我们设计了奖励函数，所以这对我们为人工系统设计奖励函数非常有启发，”他说，“自然界就是这样。进化产生了这些奖励信号，鼓励我们去做那些让我们成功繁衍的事情。”
    ^([^(369)](#fn369))


    正如巴图指出的：“一个有趣的事情是，进化并没有用生殖成功作为我们的奖励信号，而是给了我们预测器奖励。”我们优化自己的行为，以最大化我们认为有收益的东西，但在更大的背景中，进化在塑造我们会认为什么东西是有收益的。“所以，这是一个两级优化，”巴图说，“我对此非常感兴趣。”


    近年来，巴图与密歇根大学的萨廷德·辛格（Satinder Singh）和理查德·刘易斯（Richard Lewis）以及当时还在读博士的乔纳森·索尔格（Jonathan
    Sorg）合作，研究“最优奖励问题”。 ^([^(370)](#fn370))


    “人工自主体的目标应该和自主体设计者的目标一样吗？”他们写道，“这个问题很少被考虑。” ^([^(371)](#fn371))


    他们说，考虑一个游戏，其中只有一个自主体、一根钓竿、一些蠕虫和养了很多鱼的池塘。 ^([^(372)](#fn372))


    也许最有趣的是这样的情形：一个自主体聪明到足以学会钓鱼，并且寿命也长到**刚好**可以学习钓鱼——但是还不够长到能从这种投资中获得**好处**。那它就应当讨厌吃鱼，这样它们就别无选择，只能吃虫子了！


    自主体的寿命、资源或设计的微妙变化可能会对最优奖励的结构产生剧烈和突然的影响。对于在**特定**环境下什么样的奖励对**特定**的自主体来说是理想的，似乎无法给出简单答案。这方面的研究还在继续，但学会明确区分你想要什么和你奖励什么，是答案的重要组成部分。
    ^([^(373)](#fn373))


    最近，心理学家和认知科学家正在利用这些工具来问一个有趣的问题，不是关于机器，而是关于人类。他们问，如果这个计算能力有限、不耐烦、目光短浅的自主体是你自己，你应该怎样设计最优的奖励函数来帮助自己学习优化？


    ## 我们应该怎样训练自己？


    机器学习中奖励塑造的理论和实践，不仅给出了操控自主直升机的方法，还为理解人类智能和改善人类生活贡献了两个不同的视角。第一，对于为什么有些问题或任务比其他的更难解决或完成的问题，它给出了一个原因：**稀疏性**。第二，对于如何增加奖励让棘手问题变容易，同时又不引入不适当激励的问题，它提供了一个理论：奖励状态，而不是行为。


    这些见解在改善人类生活方面的潜力巨大。光是经济利益就很大——最近的一份报告估计，英国每年因工作拖延造成的损失达760亿英镑——更不用说对我们的身心健康、生活质量和成就感造成的隐形损失了。
    ^([^(374)](#fn374))


    我们生活在电子游戏成瘾和现实世界拖延的时代，也许这不是拖延者个人的错。正如斯金纳说的：“我很想对实验动物大喊，‘乖一点，该死的，乖一点！’最终，我意识到实验动物总是正确的。它们的表现就应该是这样。”
    ^([^(375)](#fn375))


    麦戈尼格尔是一名游戏设计师，她的职业生涯是设计游戏来帮助人们——包括她自己——克服生活中的挑战。她认为，大多数游戏，尤其是电脑游戏，之所以如此令人着迷和上瘾，是因为它们总是让你需要做的事情很清晰，并且有可能做到。


    首先是无论你何时登入这些网络游戏……有很多不同的角色愿意无条件相信你拯救世界的使命。不会是随随便便的任务，而是与你目前在游戏中的等级相匹配。是不是？所以你可以做到。他们永远不会给你一个你无法完成的挑战。但是很接近你的能力，所以你必须努力才能做到。
    ^([^(376)](#fn376))


    换句话说，游戏之所以吸引人，是因为游戏非常擅长**塑造**。关卡是完美的课程，绩点是完美的伪奖励，它们是斯金纳式的杰作。


    强化学习不仅提供了框架来理解和阐释游戏吸引人之处，还提供了方法来对这些直观认识进行实证。一个从最简单到最难的关卡都有清晰课程的游戏，并且用清晰的伪奖励指引前进方向，同时激励探索和促进技能发展，应该更容易让算法学习。不难想象游戏公司在不远的将来会用自动化玩家测试关卡，以发现真正的人类玩家可能会放弃或退出的地方。


    当然，问题在于这些虚拟环境比真实环境更擅长塑造。正如麦戈尼格尔说的：“现在，像《魔兽世界》这样的协作在线环境的问题是，一直处于史诗级胜利的巅峰是如此令人满足，以至于我们把所有时间都花在游戏世界里。游戏比现实更好。”对麦戈尼格尔来说，解决方案不是让自己摆脱这些完美的奖励塑造环境，而是相反：“要让现实世界更像游戏。”


    在这方面，麦戈尼格尔自己也倡导了一些运动，她还利用游戏来克服自己生活中的障碍，包括脑震荡长期康复后出现的自杀性抑郁症。 ^([^(377)](#fn377))


    这个领域被称为**游戏化**， ^([^(378)](#fn378))


    马克斯·普朗克智能系统研究所的认知科学家福尔克·利德（Falk Lieder）无论是在研究中还是在生活中，对这个问题都有很深刻的认识。


    利德的研究主要围绕他提出的“理性增强”。他研究人们如何思考和做决定，与大多数研究人员不同，他不仅对理解人类认知感兴趣，还致力于设计有效的工具和干预措施让人类思考得更好。他最早的人类实验对象就是他自己。


    在成长过程中，利德发现学校教育让他感到沮丧，尽管给了他很多思考的空间，却从未触及思考本身。“我一直觉得我真正想学的是思考方法，以及如何做出好的决定，”他解释道，“没人能教我这个。他们只教我关于世界的事实陈述，这不是很有用。我真的很想学习如何思考。”
    ^([^(379)](#fn379))


    随着时间推移，对个人进步的追求逐渐演变为更大的追求：理解人类推理原理，并创造工具对其进行改进。“我研究的一部分，”他解释道，“就是发现最优的思考和决策策略，这样我们就可以为好的思考创建真正基于科学的课程。”


    利德对游戏化感兴趣，具体说是他提出的**最优**游戏化：给定一个目标，帮助实现该目标的最优激励结构是什么？ ^([^(380)](#fn380))


    利德与汤姆·格里菲思合作，建立了一些最优游戏化的基本规则。他们借鉴了吴恩达和斯图尔特·罗素的发现，最重要的规则之一是奖励**状态**，而不是**行为**。因此，分配给行为的分数必须能体现由此导致的状态有多好——而且，正如利德指出的，“分数的分配方式必须是当你撤销某件事时，你失去的分数和你做这件事时获得的分数一样多”。这就是兰德尔夫和阿尔斯特勒姆在骑自行车机器人身上学到的东西，也是安德烈和泰勒在振动的足球机器人身上学到的东西，也是格里菲思在女儿把垃圾倒到地板上时学到的东西。


    吴恩达和罗素的论文曾指出，对于一个预测自身行为影响的能力有限的自主体，塑造奖励可以使其表现得好像更有远见。 ^([^(381)](#fn381))


    利德和格里菲思设计了一项实验，让受试者扮演航线规划者的角色。让飞机飞往某些城市的航段可能有利可图，但可能会导致下一航段没什么有利可图的路线，反过来也是一样：为了其他航段的收益，亏本飞某个航段可能是值得的。他们尝试在航段票价上增加额外的收益（或罚款），以反映执行该航段后的后续成本或收益。结果符合预期，这使得人们更容易做出更好、更有利可图的决定。


    只有一个缺点：塑造奖励将选择的长期成本和收益加在了票价中，因此规划者无需长远考虑。这使得他们的决策更加**准确**，但有些无力。人们不再需要努力思考，他们也的确没有。“如果你在一个（短视）决策能奏效的环境中行动，”利德说，“你会越来越依赖系统。”
    ^([^(382)](#fn382))


    这引出了一个有趣的可能：能不能利用最优游戏化，不是**消除**规划的需要，而是让人们**更擅长**规划？


    如果是这个目的，激励措施会截然不同。与其将界面构造一个容易的问题，纳入长期成本——能带来更高质量的决策，但或许会导致受试者怠惰或自满，让他们更依赖界面——不如调整价格来创建一个**课程**。受试者可以逐步被**教导**如何长远思考，从简单的图开始，随着受试者越来越擅长，慢慢增加复杂性。这个界面不是作为拐杖，而是使用一组不同的激励来做相反的事情：“教人们做更长远的规划，”利德解释道，“这样他们就可以在短期收益与长期价值不一致的环境中取得成功。”


    利德最新的一项实验不是关于飞行计划，而是更熟悉的背景：拖延。他和格里菲思精心设计了一项很难的任务——就5个主题写一系列短文，其中一些更长也更难——并发布到MTurk网站上，人们可以选择在10天后的截止日期前完成所有短文并获得20美元。在所有注册的人中，40%的人甚至**从未开始**。（这尤其有讽刺意味，因为在认领任务时，他们有机会拒绝参与并获得15美分！）
    ^([^(383)](#fn383))


    利德和格里菲思还试验了奖励措施，参与者完成一篇文章就能获得“分数”，没有现金价值，但是令人鼓舞。每篇文章的分数相同。结果没用。


    最后，他们向第三组参与者提供了**最优**激励：分值能精确反映每个主题有多难或有多令人不愉快，以及当他们完成这个主题时离挣20美元有多近。（例如，为朝鲜经济政策写100个字，大约是为他们最喜欢的电视节目写50个字的分值的3倍。）这次有85%的参与者完成了所有5篇短文。
    ^([^(384)](#fn384))


    利德将这样的系统视为“认知假体”， ^([^(385)](#fn385))


    攻读博士时，利德发现自己陷入了可怕的文章写作任务的放大版本。“我认为最糟糕的情形之一是无法得到自己进步的信息，”他说，“官方规矩是，你是博士生了，然后是你获得了博士学位，仅此而已，其间5年没有反馈。”


    博士生是焦虑和抑郁率较高的群体，对他们来说，拖延几乎是流行病。 ^([^(386)](#fn386))


    那样行不通。利德需要别的东西。他给自己设计了5年课程——“我把它分解成几百个关卡。”当他做出他认为可能在几年后带来**真正**引用的研究时，他会奖励自己虚拟的“引用”分。他使用为参与者写短文打分一样的最优游戏化计分，给他攻读博士的每个子任务赋予适当分值。为了克服一些坏习惯，他甚至还引入了惩罚——利用帕夫洛克手环
    ^([^(387)](#fn387))


    在利德自己的行为训练实验中，他既是实验者也是受试者，这让他获得了解决奖励塑造问题的独特优势。对自己的训练同时也是进行研究的过程和研究的中心问题。结果令人鼓舞，现在有了自己的实验室的利德用博士头衔证明了这一点。


    ## 超越外部强化


    对斯金纳来说，不仅个人的自由意志令人不安地处于“虚构的位置”，甚至整个人类文明的故事本质上都是奖励结构的故事。斯金纳本人对此持乐观态度，他写了乌托邦小说《瓦尔登湖第二》，构想了一个完美的行为主义社会。


    然而，任何接触过儿童或动物的人可能都有一种挥之不去的怀疑，即对于我们为什么要做我们所做的事情，奖励最大化实际上**并不是**全部。我们玩自己发明的游戏，不是为了明显的奖励。我们翻开石头，或者登山，只是为了看看会发现什么。我们探索。我们很爱玩，也很好奇。简而言之，我们既受**外在**奖励驱使，也受**内在**奖励驱使。


    碰巧的是，在机器学习的世界里，这也变得越来越受欢迎。


    ## 6. 好奇


    未经训练的婴儿大脑要成长为智慧的大脑，必须具备规训性和主动性。目前我们还只考虑了规训性。


    ——图灵 ^([^(388)](#fn388))


    2008年春天，阿尔伯塔大学的计算机科学家迈克尔·鲍林（Michael Bowling）和研究生马克·贝勒马尔（Marc Bellemare）在巴巴多斯的海滩上散步。鲍林有个想法。当时，研究强化学习通常是研究人员从头开始自己设计游戏，然后搭建系统来挑战那个游戏。
    ^([^(389)](#fn389))


    鲍林心想，能不能建立一个统一的环境，所有人都可以用，不是一个游戏，而是一个庞大的游戏库。另外游戏能不能就用**真**游戏，比如20世纪七八十年代风靡一时的雅达利2600游戏机上的经典游戏？


    贝勒马尔回忆自己当时的反应，“这是我听过的最愚蠢的想法”。 ^([^(390)](#fn390))


    “然而3年后，嗯，我不再觉得这个想法很蠢。”事实上，贝勒马尔发现他非常喜欢这个想法，于是鲍林成了他的博士导师，这个想法也成了他的博士论文。


    这个电子游戏库项目被称为街机学习环境（ALE），很有点疯狂，不仅因为它工作量很大，还在于它对该领域的研究者提出的挑战。 ^([^(391)](#fn391))


    问题的很大一部分难点在于，当时使用的特定游戏环境经常是用精练的术语向自主体描述世界，自主体获得的输入更高层也更好用。在用轮式推车平衡杆子的例子中，推车的位置、速度和杆子的倾斜角度、速度等会提供给系统作为输入。在有树、食物和捕食者的二维网格世界的例子中，会提供自主体的位置、健康和饥饿度、附近是否有捕食者、最近的食物在哪里等信息。这些信息也就是所谓的“特征”。

