    Story”。另见Larson等，“How We Analyzed the COMPAS Recidivism Algorithm”。请注意，在这个引用中有一个技术错误。对“被评定为高风险但（没有）再犯”的人的估计被数学转换为假阳性/（假阳性+真阳性），称为假发现率。然而，ProPublica在这里提到的统计数据实际上不是假发现率，而是假阳性率，定义为假阳性/（假阳性+真阴性）。对这个量更好的口头解释需要反转ProPublica的说法：被告“没有再犯，但被评为高风险”。对此的一些讨论，参见`https：//twitter.com/scorbettdavies/sta-tus/842885585240956928`。[↩](#fnref178)


