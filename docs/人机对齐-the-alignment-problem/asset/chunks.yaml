- raw: '对麦卡斯基尔来说，这种汇聚是一把双刃剑。这反映了更充分的信息共享，对彼此证据的信任，但也可能是为时过早的共识。“因为，我的意思是，你可以这样解释，‘嗯，有了真正的答案，我们都知道了什么是正确的，现在我们正在这样做’。但是你也可以这样解释，‘嗯，我们本来是没有连接起来的部落，然后一些人开始获得更大的影响力，现在我们都意见一致了……’，如果我们认为EA能够避免意见过于单一的问题，那是过度自信。”


    他补充道：“在EA中非常值得注意的一点是，如果我们回到比如说6年前，它真的非常包容。有各种派别，各自有很不一样的观点，有很多争论。现在，至少在核心圈，已经有了明显的融合。”例如，在EA社区有一种近乎普遍的共识，认为长远未来很重要，但经常被忽视；有一个近乎一致的意见，即围绕AI改变科学和政策对于长远未来至关重要。麦卡斯基尔说：“这种融合既好也令人担忧。”


    我参加了2017年秋天在伦敦举行的EA全球会议。麦卡斯基尔在会议结束前提出了警告。他说，他一直专注于“培育一个非常开放的社区和文化，能够真正改变自己的想法”。他认为，这场运动最有可能失败的方式之一是，它的信念僵化成教条，你必须持有某些信念，才能被社区的其他人接纳。“我们都认为这将非常糟糕，”他说，“但我也认为要创造一种能避免这一点的文化是极其困难的。”


    我还参加了2018年春天在旧金山举行的EA全球会议。麦卡斯基尔致了开幕词。以乐观的态度来看，他似乎又回到了起点。主题是“有效利他理念如何保持好奇？”


    在一个春光明媚的日子，我和麦卡斯基尔漫步在牛津基督教堂的草地上，我将话题转回AI。我注意到，道德共识的想法，与以某种固定的目标函数，给某种事物赋予接近或超出我们自身能力的想法有些关联。


    “哦，是的，”麦卡斯基尔说，“是这样。我也害怕这样的想法，类似‘好吧，我们只有一次机会。我们只需编码正确的值，然后，**就可以撒手了**！’”


    “道德问题非常困难，”他说，“很明显，你想让它们保留不确定性。”


    “如果你观察各种道德观点，会发现它们对于什么是好的结果有相当大的差异，”麦卡斯基尔解释道，“即使你只是比较那种认为模拟大脑也很好的享乐主义观点，和认为必须是有血有肉的人类的现实主义观点。它们是非常非常相似的理论，却对一个问题存在**根本性**分歧，那就是我们该如何利用我们的宇宙馈赠”——即人类对于自己在宇宙中打算做什么的终极野心，“基本上，这是一场战争。”他说：一直困扰学术界的经典的“小差异自恋”，却以宇宙为赌注。


    所有这些相互竞争的道德理论，从长远来看分歧极大，但是对于我们应该如何活在当下的问题，也许可以找到惊人的共同点。“我认为，在所有这些目标中，似乎都有一种趋同的工具性目标，”他说，“我称之为深长反思。深长反思只是一个时期，当然，可能很长！如果以真实尺度来看，就像，例如，解决AI这类问题的时期。也许几百万年过去了，我们什么都没做。我们保持相对较小的尺度——至少按宇宙标准来看是这样——我们所做的事情的主要目的只是试图弄清楚什么有价值。”


    他说，与此同时，我们的主要目标之一——也许是首要目标——应该是保持“一个尽可能不受束缚、对各种不同道德可能性持开放态度的社会。”这听起来有点像可实现效用保留的伦理版本——既然我们现在不知道未来的目标应该是什么，既然我们现在的猜测差不多是随机猜测，就应该确保我们仍然可以追求各种目标。


    “也许这太难了，”麦卡斯基尔说，“也许需要100万年才能做到。”


    我认为，如果花100万年能做好这件事，也许代价还不算大。


    “这是非常小的代价，因为如果做对了——错误的东西无论多繁盛，都没有价值，所以其实……你可以把错误的道德观视为一种生存风险。” ^([^(652)](#fn652))


    他停顿了一下：“实际上，我甚至认为这是最有可能的生存风险。”


    在麦卡斯基尔工作的EA中心的走廊尽头，是哲学家尼克·博斯特罗姆创建的牛津大学人类未来研究所。


    博斯特罗姆最有影响力的早期论文之一题为“天文垃圾”，副标题是“延迟技术发展的机会成本”，文章的前半部分给读者灌输了一种近乎疯狂的紧迫感。“当我写下这些话时，”博斯特罗姆开篇就说，“太阳正在照亮和加热空房间，未利用的能量正被冲进黑洞，我们共有的伟大禀赋……正在宇宙尺度上不可逆地退化为熵。先进文明可以利用这些资源创造有价值的结构，让感性生物过有意义的生活。这种损失的速度令人沮丧。”


    博斯特罗姆继续估计，未来的星际文明最终可能会变得非常大，以至于现在耽误的每一**秒**都相当于失去100万亿人的生命，如果我们能够更快地利用所有浪费的能量和物质，他们本可以生存。


    但是，当任何现实主义者准备据此得出结论，认为推进我们的技术进步是如此重要，以至于所有其他世俗活动都微不足道，甚至在道德上站不住脚时，博斯特罗姆的文章做了当代哲学最突然的转折。


    他说，如果晚一秒到达这个星际未来的风险是100万亿人的生命，那么**想想未能达成的风险**。通过计算，博斯特罗姆得出结论，如果能将成功建设一个充满活力、欣欣向荣的未来文明的概率提高一个百分点，从现实主义角度来看，等同于将技术进步加快1000**万年**。


    因此，尽管赌注巨大，但结论并不是仓促行事，而是相反。


    当我问许多AI安全研究人员他们为何决定投身于这一事业时，博斯特罗姆的文章被反复提及。保罗·克里斯蒂诺说：“我最初觉得这个论点很奇怪，甚至令人心烦，但后来我一口气读完了，我想，是啊，这应该是对的。”
    ^([^(653)](#fn653))


    当然，让一种潜在的超过人类水平的通用AI投入应用，也许是人类能做的最不可逆转、影响最大的事情之一。而且，很明显，不仅机器越来越不确定、迟疑和思想开放，研究人员也同样如此。


    机器智能研究所的巴克·施莱格里斯（Buck Shlegeris）最近说过：“有人说，在奇点之后，如果有一个神奇的按钮，可以把全人类变成一样的为幸福而优化的笨蛋，他们会按下它……几年前，我也鼓吹这样做。”但是有些事情变了。现在他不太确定了。他的观点变得……更复杂。也许这是个好主意，也许不是。问题变成了：当你知道自己不知道该怎么做时，该怎么做。
    ^([^(654)](#fn654))


    “我告诉他们，”他说，“我认为不应该按那个按钮。” ^([^(655)](#fn655))


    # **结语**


    我认为模糊性在知识论中非常重要，比你根据大多数人的著述所能推断的要重要得多。只有当你尽力想使每个事物精确，你才会意识到每个事物都有一定程度的模糊性；而如果每个事物都精确，那距离我们日常思考的一切将非常遥远，以至于你不可能马上反应过来，那就是当我们说出所思考的东西时我们的实际意思……当你从模糊转向精确时，你永远有犯错的风险。


    ——伯特兰·罗素 ^([^(656)](#fn656))


    过早优化是万恶之源。


    ——高德纳（Donald Knuth） ^([^(657)](#fn657))


    平安夜，我和妻子住在我父亲和继母家。我半夜被热醒了，浑身是汗。


    我以为是睡觉穿的衣服太多了，于是掀开被子，脱掉汗衫。我突然惊恐地意识到，**不是我的原因**。房间里的空气热得让人无法忍受，我想房子可能着火了。


    我打开门，外面的房间漆黑寂静，空气很冷。


    慢慢地，我把这些线索合到一起。楼上有两间客房，共用一个恒温器控制面板，另一间无人居住。我们卧室的门是关着的。另一间卧室的门开着，温度传感器装在那一间。


    这里是寒冷的美国东北部，夜间气温低于冰点。加热器一直向两间卧室吹热空气。但是装有温度传感器的房间门是敞开的，无论吹多少热空气，都无法达到设定温度。我们的房门关着，而两个房间得到的热空气量是一样多的。


    没有比恒温器更简单的了。事实上，低级的机械恒温器是最简单的“闭环”控制系统之一，是控制论的经典例子。这里没有机器学习，但是也有对齐问题，失败的结果是大汗淋漓。


    首先，**你没有测量你认为你在测量的东西。**我想调节我房间的温度，但是我只能测量另一个房间的温度。我没有想到，只要一扇门开着另一扇不开，它们就根本不相关。


    其次，**有时唯一能救你的是你的无能。**我事后想，如果供暖系统更强大，如果我们的卧室隔热性更好，我和妻子可能就被烤熟了，幸亏我们醒了。而从另一面来看，低温更危险，卧室太冷会导致体温过低甚至死亡。
    ^([^(658)](#fn658))


    在我的例子中，我让自己的房门打开了一会儿，然后将两扇门都关上。我想起了20世纪伟大的控制论学家诺伯特·维纳，他用一句著名的话预见并警示了当代的对齐问题：“我们最好确定，机器的目的是我们真正渴望的目的。”


    但他的另一句话同样有先见之明和令人担忧。“过去，对人类的目的片面和不充分的认识相对无害，那是因为技术局限，”他写道，“人类的无能使我们免遭人类愚蠢行为的全部破坏性影响，这是其中之一。”
    ^([^(659)](#fn659))


    因此，从这个意义上说，我们肯定希望首先纠正我们的愚蠢，而不是我们的无能。正如人类未来研究所的尼克·博斯特罗姆在2018年说的：“人类的技术能力和人类的智慧在进行一场长距离赛跑，前者就像疾驰在田野上的种马，后者更像是站不稳的小马驹。”
    ^([^(660)](#fn660))


    赫胥黎在1937年则是这样说的：“很明显，迄今为止高奏凯歌的科学所做的改进并未改善目标的达成，甚至还有恶化。” ^([^(661)](#fn661))


    ――――――


    到目前为止，讲述的还是一个令人鼓舞的故事，一个可控的、稳定的、科学进步的故事。一个生态系统正扩展到全球，致力于影响短期或长期的研究和政策。这在很大程度上仍处于初期阶段，但正在逐渐升温。


    对偏见、公平、透明和无数安全维度的研究，现在已成为在主要AI和机器学习会议上展示的工作的一个重要部分。事实上，它们已经是最具活力和发展最快的领域，可以说，不仅在计算领域，在所有科学领域都是如此。一位研究员告诉我，在2016年该领域最大的一次会议上，当他说他在研究安全问题时，人们都投以怀疑的目光。一年后，当他参加同一个会议时，不再有人提出质疑。这种文化的转变反映了资金和研究焦点的转变。


    在前面的章节中，我们探讨了该研究议题的内容，各方面都有值得报告的进展。


    但是这本书以乔治·博克斯的引言开头，提醒我们“所有模型都是错的”。因此，本着这种精神，让我们以批判的眼光来解读我们自己的故事中的一些假设。


    **代表**


    第1章讨论了模型的训练数据代表谁或什么的问题。我们在短时间内取得了很大进展；但如果不修正训练数据的代表性组成，就不可能开发出大范围使用的消费者人脸识别产品。然而，鉴于这样的模型不仅被消费者软件用来为照片添加标记，被消费类硬件用来解锁智能手机，还被政府用来监控人群，人们可能会质疑，让已被过度审视的少数族群在模型中获得更高的代表性会不会造成负面影响。


    代表性问题不仅对消费者技术有影响，也提醒了我们注意一项更古老、更棘手和更重要的悬殊差异。最近，我与一些医学研究者共进晚餐，当我讲述机器学习模型需要更具代表性的训练数据时，他们马上提醒我，大部分医学试验的对象绝大多数都是男性。
    ^([^(662)](#fn662))


    临床试验的对象选择是把双刃剑：保护弱势群体的禁令——比如不允许对孕妇或老年人进行医学试验——看似合理，但也会产生偏见和盲点。药物沙利度胺上市时被视为“绝对安全”，因为制药商“发现高剂量也不会杀死大鼠”。但是，这种药物在退市前，造成了成千上万例可怕的人类胎儿畸形。
    ^([^(663)](#fn663))


    在“监督学习”中，对于以某种方式打了“标签”的训练数据，我们也需要持批判性思维，不仅要了解训练数据是从哪里来的，还要了解标签是怎么来的，这些标签将在系统中作为基本事实的替身。而基本事实经常不是基本事实。


    例如，ImageNet将通过互联网收集的人类判断作为基本事实。如果大多数人认为，比如说，狼崽是一只小狗，那么对于图像识别系统来说，它就是小狗。特斯拉的AI总监安德烈·卡普西（Andrej Karpathy）在斯坦福大学读研究生时，花了将近一周时间给ImageNet图片打标签，将自己作为与算法对比的人类基准。经过一番练习，他的“准确率”达到了95%。但是……相对什么的准确率？不是事实，而是**共识**。
    ^([^(664)](#fn664))


    在更哲学的层面上，标签蕴含了一个我们必须无条件接受的预设本体论。ImageNet图像被标记为1000个类别中的1个。 ^([^(665)](#fn665))


    不仅需要审查训练数据和标签，还需要审查目标函数。图像识别系统通常用一个称为“交叉熵损失”的目标函数来训练——撇开数学细节不谈，它会对任何错误描述进行惩罚，不管是哪种错误。从交叉熵损失的角度来看，把炉盘误认为汽车进气栅，把绿苹果误认为梨子，把英国牛头犬误认为法国牛头犬，同把人描述成大猩猩一样糟糕。而事实上，哪怕仅从谷歌的财务来考虑，更不要说被错误分类的人，某些类型的错误也可能比其他错误严重几千倍甚至几百万倍。
    ^([^(666)](#fn666))


    在第1章的后半部分，我们讨论了基于向量的词表示极其惊人的类比能力。在看似简单的词向量表示背后，也存在极富争议的对齐问题。到底什么是类比？例如，通过简单的向量加法（有时称为“平行四边形”法，或“3CosAdd”算法）就可以得到一个词作为最佳类比。例如，“医生——男人+女人”得到一个向量，最接近的词应当还是**医生**。
    ^([^(667)](#fn667))


    托尔加·博鲁克巴斯和亚当·卡莱的团队发现，用word2vec表示我们所**认为**的“类比”不能令人满意，类比似乎要求两件事至少是不同的，所以他们采取了另一种策略。他们想象“医生”一词周围有某种“相似半径”，包括了“护士”“助产士”“妇科医生”“内科医生”和“骨科医生”等词，但不包括“农民”“秘书”或“立法者”。然后，他们在这个半径范围内寻找**不是**“医生”的最近单词。
    ^([^(668)](#fn668))


    还有其他棘手的问题。词向量的几何——即它们在数学空间中表示为距离——使得类比是对称的，这并不总是能反映人类对类比的直觉。例如，人们认为椭圆像圆，而不是圆像椭圆。
    ^([^(669)](#fn669))


    那么，什么算法，应用于什么表示，能更精确地模仿人类的类比？ ^([^(670)](#fn670))


    你可能会忍不住举手。我们完全可以训练机器学习人类类比的例子啊，并在其中包含各种不对称性和怪癖，让它找出合适的方法来说明类比是什么。为什么计算机科学家、语言学家和认知科学家还要争论这些事情，并从头开始构想算法呢？


    当然是因为这是对齐问题。人类对“类比”的概念和其他任何概念一样模糊不清。因此，在其他背景中用于对齐的一组新工具可能在这里也同样适用。


    **公平**


    第2章探讨了风险评估工具在刑事司法系统中日益广泛的应用。这里有许多潜在的危险，其中一些我们已经讨论过了。这些模型所依据的“基本事实”不是被告后来是否**犯**罪，而是他们是否被**再次逮捕**和**定罪**。如果不同群体的人在被捕后被定罪或再次逮捕的可能性存在系统性差异，那么我们充其量是在学习累犯的扭曲替代物，而不是累犯本身。这是一个经常被忽视的关键点。


    同样值得审视的是，为了训练模型，我们假装知道被告如果被释放**会**做什么。我们怎么可能知道呢？典型的做法是查看他们之前在服刑期满后2年内的犯罪记录，并以此作为如果他们被提前释放后2年内的替代。这隐含地假设了年龄和监禁本身都不会影响一个人重返社会后的行为。事实上，在某些情况下，年龄是最具预测性的变量。此外，认为监禁本身没有影响的假设很可能是错误的，**而且**对一个至少表面上是为了矫正而设计的系统来说，这是一个相当可悲的观点。如果像一些证据似乎表明的那样，监禁经历实际上会**增加**囚犯出狱后的犯罪行为，那么服满刑期的人的再犯又会成为模型的训练数据，该模型假设如果他们被提前释放，他们也会同样危险。
    ^([^(671)](#fn671))


    在机器学习的许多领域中，所谓的“迁移学习”被用得很多，即针对某项任务训练的系统很容易被用于另一项任务。但在这样做时并不总是经过了深思熟虑或很明智。例如，COMPAS工具被明确设计为不可用于判刑，但一些司法管辖区仍然这样用。（词嵌入模型用于招聘也是如此。为**预测**而构建的词表示，在许多情况下被用来**做**它们被训练来预测的事情，从而成为自证预言。在一个曾有性别歧视的企业文化中，一个预测女性很少会被雇用的模型——不幸的是，这是正确的——可能会被贸然部署，从而导致很少有女性**会被雇用**。如果我们希望模型不只是重复和强化过去，还能做点别的，我们就需要更慎重、更用心地审视它们。）


    我们也看到，虽然“公平”概念暗示了各种看似直观和可取的形式化定义，然而一个残酷的数学事实是，无论是人类还是机器，没有哪个决策系统能同时满足所有这些定义。一些研究人员认为，与其找出这些不同的形式，然后试图“手动”协调它们，不如直接用人类认为“公平”和“不公平”的例子来训练一个系统，并让机器学习自己构建形式化、可操作的定义。
    ^([^(672)](#fn672))


    **透明**


    第3章探讨了一个令人鼓舞的研究前沿，关于简单模型的优势，以及寻找**最优**简单模型的最新技术。然而，透明也有可能是把双刃剑，因为研究表明，即使透明模型是错误的，**不**应该被信任，人类也更信任透明模型。
    ^([^(673)](#fn673))


    还有一个小小的悖论：很难理解**为什么**一个特定的简单模型是最优的；要详尽回答这个问题，可能有很强的专业性，而且很长。此外，对于任何特定的简单模型，我们还可以问，可能特征的“表单”是怎么来的，更不用说首先是怎样的人类进程推动了对这种工具的渴求和创造。
    ^([^(674)](#fn674))


    在开发能给出解释的架构时，无论是视觉性的还是语言性的，有几件事需要警惕。研究展示了“对抗性解释”的可能性——也就是说，两个系统的行为几乎相同，但对它们的行为方式和原因有截然不同的解释。
    ^([^(675)](#fn675))


    **自主**


    第4、5、6章分别探讨了强化学习、奖励塑造和内在动机，特别是在雅达利游戏和围棋的背景中，我们隐含地假设了在专业上被称为“遍历性”的东西——即你**不会犯不可挽回的错误**。一切都能通过重新开始来解决。也就是说，可以通过犯几十万次很大程度上是随机的，而且往往是致命的错误来学习。在安全的雅达利游戏世界的外面，遍历性假设并不成立。我记得2000年代的一则汽车广告，演的是一个网络时代程序员，他白天编写极限赛车游戏，各种电影式的慢动作撞车，下班后却谨慎地开着安全结实的汽车回家。“因为在现实生活中，”他看着镜头说，“没有重启按钮。”DeepMind的简·雷克用稍微不同的语言表达了相同的意思。他指出，在他自己和他研究的自主体之间至少有一个大的区别，更准确地说，它们的**世界**和他的世界有一个很大差别。“现实世界不是遍历性的，”他说，“如果我从楼上跳下去，那就不是我能从中吸取教训的错误。”
    ^([^(676)](#fn676))'
  fmt: '

    对麦卡斯基尔来说，这种汇聚是一把双刃剑。这反映了更充分的信息共享，对彼此证据的信任，但也可能是为时过早的共识。“因为，我的意思是，你可以这样解释，‘嗯，有了真正的答案，我们都知道了什么是正确的，现在我们正在这样做’。但是你也可以这样解释，‘嗯，我们本来是没有连接起来的部落，然后一些人开始获得更大的影响力，现在我们都意见一致了……’，如果我们认为EA能够避免意见过于单一的问题，那是过度自信。”


    他补充道：“在EA中非常值得注意的一点是，如果我们回到比如说6年前，它真的非常包容。有各种派别，各自有很不一样的观点，有很多争论。现在，至少在核心圈，已经有了明显的融合。”例如，在EA社区有一种近乎普遍的共识，认为长远未来很重要，但经常被忽视；有一个近乎一致的意见，即围绕AI改变科学和政策对于长远未来至关重要。麦卡斯基尔说：“这种融合既好也令人担忧。”


    我参加了2017年秋天在伦敦举行的EA全球会议。麦卡斯基尔在会议结束前提出了警告。他说，他一直专注于“培育一个非常开放的社区和文化，能够真正改变自己的想法”。他认为，这场运动最有可能失败的方式之一是，它的信念僵化成教条，你必须持有某些信念，才能被社区的其他人接纳。“我们都认为这将非常糟糕，”他说，“但我也认为要创造一种能避免这一点的文化是极其困难的。”


    我还参加了2018年春天在旧金山举行的EA全球会议。麦卡斯基尔致了开幕词。以乐观的态度来看，他似乎又回到了起点。主题是“有效利他理念如何保持好奇？”


    在一个春光明媚的日子，我和麦卡斯基尔漫步在牛津基督教堂的草地上，我将话题转回AI。我注意到，道德共识的想法，与以某种固定的目标函数，给某种事物赋予接近或超出我们自身能力的想法有些关联。


    “哦，是的，”麦卡斯基尔说，“是这样。我也害怕这样的想法，类似‘好吧，我们只有一次机会。我们只需编码正确的值，然后，就可以撒手了！’”


    “道德问题非常困难，”他说，“很明显，你想让它们保留不确定性。”


    “如果你观察各种道德观点，会发现它们对于什么是好的结果有相当大的差异，”麦卡斯基尔解释道，“即使你只是比较那种认为模拟大脑也很好的享乐主义观点，和认为必须是有血有肉的人类的现实主义观点。它们是非常非常相似的理论，却对一个问题存在根本性分歧，那就是我们该如何利用我们的宇宙馈赠”——即人类对于自己在宇宙中打算做什么的终极野心，“基本上，这是一场战争。”他说：一直困扰学术界的经典的“小差异自恋”，却以宇宙为赌注。


    所有这些相互竞争的道德理论，从长远来看分歧极大，但是对于我们应该如何活在当下的问题，也许可以找到惊人的共同点。“我认为，在所有这些目标中，似乎都有一种趋同的工具性目标，”他说，“我称之为深长反思。深长反思只是一个时期，当然，可能很长！如果以真实尺度来看，就像，例如，解决AI这类问题的时期。也许几百万年过去了，我们什么都没做。我们保持相对较小的尺度——至少按宇宙标准来看是这样——我们所做的事情的主要目的只是试图弄清楚什么有价值。”


    他说，与此同时，我们的主要目标之一——也许是首要目标——应该是保持“一个尽可能不受束缚、对各种不同道德可能性持开放态度的社会。”这听起来有点像可实现效用保留的伦理版本——既然我们现在不知道未来的目标应该是什么，既然我们现在的猜测差不多是随机猜测，就应该确保我们仍然可以追求各种目标。


    “也许这太难了，”麦卡斯基尔说，“也许需要100万年才能做到。”


    我认为，如果花100万年能做好这件事，也许代价还不算大。


    “这是非常小的代价，因为如果做对了——错误的东西无论多繁盛，都没有价值，所以其实……你可以把错误的道德观视为一种生存风险。” ^([^(652)](#fn652))


    他停顿了一下：“实际上，我甚至认为这是最有可能的生存风险。”


    在麦卡斯基尔工作的EA中心的走廊尽头，是哲学家尼克·博斯特罗姆创建的牛津大学人类未来研究所。


    博斯特罗姆最有影响力的早期论文之一题为“天文垃圾”，副标题是“延迟技术发展的机会成本”，文章的前半部分给读者灌输了一种近乎疯狂的紧迫感。“当我写下这些话时，”博斯特罗姆开篇就说，“太阳正在照亮和加热空房间，未利用的能量正被冲进黑洞，我们共有的伟大禀赋……正在宇宙尺度上不可逆地退化为熵。先进文明可以利用这些资源创造有价值的结构，让感性生物过有意义的生活。这种损失的速度令人沮丧。”


    博斯特罗姆继续估计，未来的星际文明最终可能会变得非常大，以至于现在耽误的每一秒都相当于失去100万亿人的生命，如果我们能够更快地利用所有浪费的能量和物质，他们本可以生存。


    但是，当任何现实主义者准备据此得出结论，认为推进我们的技术进步是如此重要，以至于所有其他世俗活动都微不足道，甚至在道德上站不住脚时，博斯特罗姆的文章做了当代哲学最突然的转折。


    他说，如果晚一秒到达这个星际未来的风险是100万亿人的生命，那么想想未能达成的风险。通过计算，博斯特罗姆得出结论，如果能将成功建设一个充满活力、欣欣向荣的未来文明的概率提高一个百分点，从现实主义角度来看，等同于将技术进步加快1000万年。


    因此，尽管赌注巨大，但结论并不是仓促行事，而是相反。


    当我问许多AI安全研究人员他们为何决定投身于这一事业时，博斯特罗姆的文章被反复提及。保罗·克里斯蒂诺说：“我最初觉得这个论点很奇怪，甚至令人心烦，但后来我一口气读完了，我想，是啊，这应该是对的。”
    ^([^(653)](#fn653))


    当然，让一种潜在的超过人类水平的通用AI投入应用，也许是人类能做的最不可逆转、影响最大的事情之一。而且，很明显，不仅机器越来越不确定、迟疑和思想开放，研究人员也同样如此。


    机器智能研究所的巴克·施莱格里斯（Buck Shlegeris）最近说过：“有人说，在奇点之后，如果有一个神奇的按钮，可以把全人类变成一样的为幸福而优化的笨蛋，他们会按下它……几年前，我也鼓吹这样做。”但是有些事情变了。现在他不太确定了。他的观点变得……更复杂。也许这是个好主意，也许不是。问题变成了：当你知道自己不知道该怎么做时，该怎么做。
    ^([^(654)](#fn654))


    “我告诉他们，”他说，“我认为不应该按那个按钮。” ^([^(655)](#fn655))


    # 结语


    我认为模糊性在知识论中非常重要，比你根据大多数人的著述所能推断的要重要得多。只有当你尽力想使每个事物精确，你才会意识到每个事物都有一定程度的模糊性；而如果每个事物都精确，那距离我们日常思考的一切将非常遥远，以至于你不可能马上反应过来，那就是当我们说出所思考的东西时我们的实际意思……当你从模糊转向精确时，你永远有犯错的风险。


    ——伯特兰·罗素 ^([^(656)](#fn656))


    过早优化是万恶之源。


    ——高德纳（Donald Knuth） ^([^(657)](#fn657))


    平安夜，我和妻子住在我父亲和继母家。我半夜被热醒了，浑身是汗。


    我以为是睡觉穿的衣服太多了，于是掀开被子，脱掉汗衫。我突然惊恐地意识到，不是我的原因。房间里的空气热得让人无法忍受，我想房子可能着火了。


    我打开门，外面的房间漆黑寂静，空气很冷。


    慢慢地，我把这些线索合到一起。楼上有两间客房，共用一个恒温器控制面板，另一间无人居住。我们卧室的门是关着的。另一间卧室的门开着，温度传感器装在那一间。


    这里是寒冷的美国东北部，夜间气温低于冰点。加热器一直向两间卧室吹热空气。但是装有温度传感器的房间门是敞开的，无论吹多少热空气，都无法达到设定温度。我们的房门关着，而两个房间得到的热空气量是一样多的。


    没有比恒温器更简单的了。事实上，低级的机械恒温器是最简单的“闭环”控制系统之一，是控制论的经典例子。这里没有机器学习，但是也有对齐问题，失败的结果是大汗淋漓。


    首先，你没有测量你认为你在测量的东西。我想调节我房间的温度，但是我只能测量另一个房间的温度。我没有想到，只要一扇门开着另一扇不开，它们就根本不相关。


    其次，有时唯一能救你的是你的无能。我事后想，如果供暖系统更强大，如果我们的卧室隔热性更好，我和妻子可能就被烤熟了，幸亏我们醒了。而从另一面来看，低温更危险，卧室太冷会导致体温过低甚至死亡。
    ^([^(658)](#fn658))


    在我的例子中，我让自己的房门打开了一会儿，然后将两扇门都关上。我想起了20世纪伟大的控制论学家诺伯特·维纳，他用一句著名的话预见并警示了当代的对齐问题：“我们最好确定，机器的目的是我们真正渴望的目的。”


    但他的另一句话同样有先见之明和令人担忧。“过去，对人类的目的片面和不充分的认识相对无害，那是因为技术局限，”他写道，“人类的无能使我们免遭人类愚蠢行为的全部破坏性影响，这是其中之一。”
    ^([^(659)](#fn659))


    因此，从这个意义上说，我们肯定希望首先纠正我们的愚蠢，而不是我们的无能。正如人类未来研究所的尼克·博斯特罗姆在2018年说的：“人类的技术能力和人类的智慧在进行一场长距离赛跑，前者就像疾驰在田野上的种马，后者更像是站不稳的小马驹。”
    ^([^(660)](#fn660))


    赫胥黎在1937年则是这样说的：“很明显，迄今为止高奏凯歌的科学所做的改进并未改善目标的达成，甚至还有恶化。” ^([^(661)](#fn661))


    ――――――


    到目前为止，讲述的还是一个令人鼓舞的故事，一个可控的、稳定的、科学进步的故事。一个生态系统正扩展到全球，致力于影响短期或长期的研究和政策。这在很大程度上仍处于初期阶段，但正在逐渐升温。


    对偏见、公平、透明和无数安全维度的研究，现在已成为在主要AI和机器学习会议上展示的工作的一个重要部分。事实上，它们已经是最具活力和发展最快的领域，可以说，不仅在计算领域，在所有科学领域都是如此。一位研究员告诉我，在2016年该领域最大的一次会议上，当他说他在研究安全问题时，人们都投以怀疑的目光。一年后，当他参加同一个会议时，不再有人提出质疑。这种文化的转变反映了资金和研究焦点的转变。


    在前面的章节中，我们探讨了该研究议题的内容，各方面都有值得报告的进展。


    但是这本书以乔治·博克斯的引言开头，提醒我们“所有模型都是错的”。因此，本着这种精神，让我们以批判的眼光来解读我们自己的故事中的一些假设。


    ## 代表


    第1章讨论了模型的训练数据代表谁或什么的问题。我们在短时间内取得了很大进展；但如果不修正训练数据的代表性组成，就不可能开发出大范围使用的消费者人脸识别产品。然而，鉴于这样的模型不仅被消费者软件用来为照片添加标记，被消费类硬件用来解锁智能手机，还被政府用来监控人群，人们可能会质疑，让已被过度审视的少数族群在模型中获得更高的代表性会不会造成负面影响。


    代表性问题不仅对消费者技术有影响，也提醒了我们注意一项更古老、更棘手和更重要的悬殊差异。最近，我与一些医学研究者共进晚餐，当我讲述机器学习模型需要更具代表性的训练数据时，他们马上提醒我，大部分医学试验的对象绝大多数都是男性。
    ^([^(662)](#fn662))


    临床试验的对象选择是把双刃剑：保护弱势群体的禁令——比如不允许对孕妇或老年人进行医学试验——看似合理，但也会产生偏见和盲点。药物沙利度胺上市时被视为“绝对安全”，因为制药商“发现高剂量也不会杀死大鼠”。但是，这种药物在退市前，造成了成千上万例可怕的人类胎儿畸形。
    ^([^(663)](#fn663))


    在“监督学习”中，对于以某种方式打了“标签”的训练数据，我们也需要持批判性思维，不仅要了解训练数据是从哪里来的，还要了解标签是怎么来的，这些标签将在系统中作为基本事实的替身。而基本事实经常不是基本事实。


    例如，`ImageNet`将通过互联网收集的人类判断作为基本事实。如果大多数人认为，比如说，狼崽是一只小狗，那么对于图像识别系统来说，它就是小狗。特斯拉的AI总监安德烈·卡普西（Andrej
    Karpathy）在斯坦福大学读研究生时，花了将近一周时间给`ImageNet`图片打标签，将自己作为与算法对比的人类基准。经过一番练习，他的“准确率”达到了95%。但是……相对什么的准确率？不是事实，而是共识。
    ^([^(664)](#fn664))


    在更哲学的层面上，标签蕴含了一个我们必须无条件接受的预设本体论。`ImageNet`图像被标记为1000个类别中的1个。 ^([^(665)](#fn665))


    不仅需要审查训练数据和标签，还需要审查目标函数。图像识别系统通常用一个称为“交叉熵损失”的目标函数来训练——撇开数学细节不谈，它会对任何错误描述进行惩罚，不管是哪种错误。从交叉熵损失的角度来看，把炉盘误认为汽车进气栅，把绿苹果误认为梨子，把英国牛头犬误认为法国牛头犬，同把人描述成大猩猩一样糟糕。而事实上，哪怕仅从谷歌的财务来考虑，更不要说被错误分类的人，某些类型的错误也可能比其他错误严重几千倍甚至几百万倍。
    ^([^(666)](#fn666))


    在第1章的后半部分，我们讨论了基于向量的词表示极其惊人的类比能力。在看似简单的词向量表示背后，也存在极富争议的对齐问题。到底什么是类比？例如，通过简单的向量加法（有时称为“平行四边形”法，或“`3CosAdd`”算法）就可以得到一个词作为最佳类比。例如，“医生——男人+女人”得到一个向量，最接近的词应当还是医生。
    ^([^(667)](#fn667))


    托尔加·博鲁克巴斯和亚当·卡莱的团队发现，用`word2vec`表示我们所认为的“类比”不能令人满意，类比似乎要求两件事至少是不同的，所以他们采取了另一种策略。他们想象“医生”一词周围有某种“相似半径”，包括了“护士”“助产士”“妇科医生”“内科医生”和“骨科医生”等词，但不包括“农民”“秘书”或“立法者”。然后，他们在这个半径范围内寻找不是“医生”的最近单词。
    ^([^(668)](#fn668))


    还有其他棘手的问题。词向量的几何——即它们在数学空间中表示为距离——使得类比是对称的，这并不总是能反映人类对类比的直觉。例如，人们认为椭圆像圆，而不是圆像椭圆。
    ^([^(669)](#fn669))


    那么，什么算法，应用于什么表示，能更精确地模仿人类的类比？ ^([^(670)](#fn670))


    你可能会忍不住举手。我们完全可以训练机器学习人类类比的例子啊，并在其中包含各种不对称性和怪癖，让它找出合适的方法来说明类比是什么。为什么计算机科学家、语言学家和认知科学家还要争论这些事情，并从头开始构想算法呢？


    当然是因为这是对齐问题。人类对“类比”的概念和其他任何概念一样模糊不清。因此，在其他背景中用于对齐的一组新工具可能在这里也同样适用。


    ## 公平


    第2章探讨了风险评估工具在刑事司法系统中日益广泛的应用。这里有许多潜在的危险，其中一些我们已经讨论过了。这些模型所依据的“基本事实”不是被告后来是否犯罪，而是他们是否被再次逮捕和定罪。如果不同群体的人在被捕后被定罪或再次逮捕的可能性存在系统性差异，那么我们充其量是在学习累犯的扭曲替代物，而不是累犯本身。这是一个经常被忽视的关键点。


    同样值得审视的是，为了训练模型，我们假装知道被告如果被释放会做什么。我们怎么可能知道呢？典型的做法是查看他们之前在服刑期满后2年内的犯罪记录，并以此作为如果他们被提前释放后2年内的替代。这隐含地假设了年龄和监禁本身都不会影响一个人重返社会后的行为。事实上，在某些情况下，年龄是最具预测性的变量。此外，认为监禁本身没有影响的假设很可能是错误的，而且对一个至少表面上是为了矫正而设计的系统来说，这是一个相当可悲的观点。如果像一些证据似乎表明的那样，监禁经历实际上会增加囚犯出狱后的犯罪行为，那么服满刑期的人的再犯又会成为模型的训练数据，该模型假设如果他们被提前释放，他们也会同样危险。
    ^([^(671)](#fn671))


    在机器学习的许多领域中，所谓的“迁移学习”被用得很多，即针对某项任务训练的系统很容易被用于另一项任务。但在这样做时并不总是经过了深思熟虑或很明智。例如，`COMPAS`工具被明确设计为不可用于判刑，但一些司法管辖区仍然这样用。（词嵌入模型用于招聘也是如此。为预测而构建的词表示，在许多情况下被用来做它们被训练来预测的事情，从而成为自证预言。在一个曾有性别歧视的企业文化中，一个预测女性很少会被雇用的模型——不幸的是，这是正确的——可能会被贸然部署，从而导致很少有女性会被雇用。如果我们希望模型不只是重复和强化过去，还能做点别的，我们就需要更慎重、更用心地审视它们。）


    我们也看到，虽然“公平”概念暗示了各种看似直观和可取的形式化定义，然而一个残酷的数学事实是，无论是人类还是机器，没有哪个决策系统能同时满足所有这些定义。一些研究人员认为，与其找出这些不同的形式，然后试图“手动”协调它们，不如直接用人类认为“公平”和“不公平”的例子来训练一个系统，并让机器学习自己构建形式化、可操作的定义。
    ^([^(672)](#fn672))


    ## 透明


    第3章探讨了一个令人鼓舞的研究前沿，关于简单模型的优势，以及寻找最优简单模型的最新技术。然而，透明也有可能是把双刃剑，因为研究表明，即使透明模型是错误的，不应该被信任，人类也更信任透明模型。
    ^([^(673)](#fn673))


    还有一个小小的悖论：很难理解为什么一个特定的简单模型是最优的；要详尽回答这个问题，可能有很强的专业性，而且很长。此外，对于任何特定的简单模型，我们还可以问，可能特征的“表单”是怎么来的，更不用说首先是怎样的人类进程推动了对这种工具的渴求和创造。
    ^([^(674)](#fn674))


    在开发能给出解释的架构时，无论是视觉性的还是语言性的，有几件事需要警惕。研究展示了“对抗性解释”的可能性——也就是说，两个系统的行为几乎相同，但对它们的行为方式和原因有截然不同的解释。
    ^([^(675)](#fn675))


    ## 自主


    第4、5、6章分别探讨了强化学习、奖励塑造和内在动机，特别是在雅达利游戏和围棋的背景中，我们隐含地假设了在专业上被称为“遍历性”的东西——即你不会犯不可挽回的错误。一切都能通过重新开始来解决。也就是说，可以通过犯几十万次很大程度上是随机的，而且往往是致命的错误来学习。在安全的雅达利游戏世界的外面，遍历性假设并不成立。我记得2000年代的一则汽车广告，演的是一个网络时代程序员，他白天编写极限赛车游戏，各种电影式的慢动作撞车，下班后却谨慎地开着安全结实的汽车回家。“因为在现实生活中，”他看着镜头说，“没有重启按钮。”`DeepMind`的简·雷克用稍微不同的语言表达了相同的意思。他指出，在他自己和他研究的自主体之间至少有一个大的区别，更准确地说，它们的世界和他的世界有一个很大差别。“现实世界不是遍历性的，”他说，“如果我从楼上跳下去，那就不是我能从中吸取教训的错误。”
    ^([^(676)](#fn676))

    '
  trans: '

    对麦卡斯基尔来说，这种汇聚是一把双刃剑。这反映了更充分的信息共享，对彼此证据的信任，但也可能是为时过早的共识。“因为，我的意思是，你可以这样解释，‘嗯，有了真正的答案，我们都知道了什么是正确的，现在我们正在这样做’。但是你也可以这样解释，‘嗯，我们本来是没有连接起来的部落，然后一些人开始获得更大的影响力，现在我们都意见一致了……’，如果我们认为
    EA 能够避免意见过于单一的问题，那是过度自信。”


    他补充道：“在 EA 中非常值得注意的一点是，如果我们回到比如说 6 年前，它真的非常包容。有各种派别，各自有很不一样的观点，有很多争论。现在，至少在核心圈，已经有了明显的融合。”例如，在
    EA 社区有一种近乎普遍的共识，认为长远未来很重要，但经常被忽视；有一个近乎一致的意见，即围绕 AI 改变科学和政策对于长远未来至关重要。麦卡斯基尔说：“这种融合既好也令人担忧。”


    我参加了 2017 年秋天在伦敦举行的 EA 全球会议。麦卡斯基尔在会议结束前提出了警告。他说，他一直专注于“培育一个非常开放的社区和文化，能够真正改变自己的想法”。他认为，这场运动最有可能失败的方式之一是，它的信念僵化成教条，你必须持有某些信念，才能被社区的其他人接纳。“我们都认为这将非常糟糕，”他说，“但我也认为要创造一种能避免这一点的文化是极其困难的。”


    我还参加了 2018 年春天在旧金山举行的 EA 全球会议。麦卡斯基尔致了开幕词。以乐观的态度来看，他似乎又回到了起点。主题是“有效利他理念如何保持好奇？”


    在一个春光明媚的日子，我和麦卡斯基尔漫步在牛津基督教堂的草地上，我将话题转回 AI。我注意到，道德共识的想法，与以某种固定的目标函数，给某种事物赋予接近或超出我们自身能力的想法有些关联。


    “哦，是的，”麦卡斯基尔说，“是这样。我也害怕这样的想法，类似‘好吧，我们只有一次机会。我们只需编码正确的值，然后，就可以撒手了！’”


    “道德问题非常困难，”他说，“很明显，你想让它们保留不确定性。”


    “如果你观察各种道德观点，会发现它们对于什么是好的结果有相当大的差异，”麦卡斯基尔解释道，“即使你只是比较那种认为模拟大脑也很好的享乐主义观点，和认为必须是有血有肉的人类的现实主义观点。它们是非常非常相似的理论，却对一个问题存在根本性分歧，那就是我们该如何利用我们的宇宙馈赠”——即人类对于自己在宇宙中打算做什么的终极野心，“基本上，这是一场战争。”他说：一直困扰学术界的经典的“小差异自恋”，却以宇宙为赌注。


    所有这些相互竞争的道德理论，从长远来看分歧极大，但是对于我们应该如何活在当下的问题，也许可以找到惊人的共同点。“我认为，在所有这些目标中，似乎都有一种趋同的工具性目标，”他说，“我称之为深长反思。深长反思只是一个时期，当然，可能很长！如果以真实尺度来看，就像，例如，解决
    AI 这类问题的时期。也许几百万年过去了，我们什么都没做。我们保持相对较小的尺度——至少按宇宙标准来看是这样——我们所做的事情的主要目的只是试图弄清楚什么有价值。”


    他说，与此同时，我们的主要目标之一——也许是首要目标——应该是保持“一个尽可能不受束缚、对各种不同道德可能性持开放态度的社会。”这听起来有点像可实现效用保留的伦理版本——既然我们现在不知道未来的目标应该是什么，既然我们现在的猜测差不多是随机猜测，就应该确保我们仍然可以追求各种目标。


    “也许这太难了，”麦卡斯基尔说，“也许需要 100 万年才能做到。”


    我认为，如果花 100 万年能做好这件事，也许代价还不算大。


    “这是非常小的代价，因为如果做对了——错误的东西无论多繁盛，都没有价值，所以其实……你可以把错误的道德观视为一种生存风险。” ^(⁶⁵²)


    他停顿了一下：“实际上，我甚至认为这是最有可能的生存风险。”


    在麦卡斯基尔工作的 EA 中心的走廊尽头，是哲学家尼克·博斯特罗姆创建的牛津大学人类未来研究所。


    博斯特罗姆最有影响力的早期论文之一题为“天文垃圾”，副标题是“延迟技术发展的机会成本”，文章的前半部分给读者灌输了一种近乎疯狂的紧迫感。“当我写下这些话时，”博斯特罗姆开篇就说，“太阳正在照亮和加热空房间，未利用的能量正被冲进黑洞，我们共有的伟大禀赋……正在宇宙尺度上不可逆地退化为熵。先进文明可以利用这些资源创造有价值的结构，让感性生物过有意义的生活。这种损失的速度令人沮丧。”


    博斯特罗姆继续估计，未来的星际文明最终可能会变得非常大，以至于现在耽误的每一秒都相当于失去 100 万亿人的生命，如果我们能够更快地利用所有浪费的能量和物质，他们本可以生存。


    但是，当任何现实主义者准备据此得出结论，认为推进我们的技术进步是如此重要，以至于所有其他世俗活动都微不足道，甚至在道德上站不住脚时，博斯特罗姆的文章做了当代哲学最突然的转折。


    他说，如果晚一秒到达这个星际未来的风险是 100 万亿人的生命，那么想想未能达成的风险。通过计算，博斯特罗姆得出结论，如果能将成功建设一个充满活力、欣欣向荣的未来文明的概率提高一个百分点，从现实主义角度来看，等同于将技术进步加快
    1000 万年。


    因此，尽管赌注巨大，但结论并不是仓促行事，而是相反。


    当我问许多 AI 安全研究人员他们为何决定投身于这一事业时，博斯特罗姆的文章被反复提及。保罗·克里斯蒂诺说：“我最初觉得这个论点很奇怪，甚至令人心烦，但后来我一口气读完了，我想，是啊，这应该是对的。”
    ^(⁶⁵³)


    当然，让一种潜在的超过人类水平的通用 AI 投入应用，也许是人类能做的最不可逆转、影响最大的事情之一。而且，很明显，不仅机器越来越不确定、迟疑和思想开放，研究人员也同样如此。


    机器智能研究所的巴克·施莱格里斯（Buck Shlegeris）最近说过：“有人说，在奇点之后，如果有一个神奇的按钮，可以把全人类变成一样的为幸福而优化的笨蛋，他们会按下它……几年前，我也鼓吹这样做。”但是有些事情变了。现在他不太确定了。他的观点变得……更复杂。也许这是个好主意，也许不是。问题变成了：当你知道自己不知道该怎么做时，该怎么做。
    ^(⁶⁵⁴)


    “我告诉他们，”他说，“我认为不应该按那个按钮。” ^(⁶⁵⁵)


    # 结语


    我认为模糊性在知识论中非常重要，比你根据大多数人的著述所能推断的要重要得多。只有当你尽力想使每个事物精确，你才会意识到每个事物都有一定程度的模糊性；而如果每个事物都精确，那距离我们日常思考的一切将非常遥远，以至于你不可能马上反应过来，那就是当我们说出所思考的东西时我们的实际意思……当你从模糊转向精确时，你永远有犯错的风险。


    ——伯特兰·罗素 ^(⁶⁵⁶)


    过早优化是万恶之源。


    ——高德纳（Donald Knuth） ^(⁶⁵⁷)


    平安夜，我和妻子住在我父亲和继母家。我半夜被热醒了，浑身是汗。


    我以为是睡觉穿的衣服太多了，于是掀开被子，脱掉汗衫。我突然惊恐地意识到，不是我的原因。房间里的空气热得让人无法忍受，我想房子可能着火了。


    我打开门，外面的房间漆黑寂静，空气很冷。


    慢慢地，我把这些线索合到一起。楼上有两间客房，共用一个恒温器控制面板，另一间无人居住。我们卧室的门是关着的。另一间卧室的门开着，温度传感器装在那一间。


    这里是寒冷的美国东北部，夜间气温低于冰点。加热器一直向两间卧室吹热空气。但是装有温度传感器的房间门是敞开的，无论吹多少热空气，都无法达到设定温度。我们的房门关着，而两个房间得到的热空气量是一样多的。


    没有比恒温器更简单的了。事实上，低级的机械恒温器是最简单的“闭环”控制系统之一，是控制论的经典例子。这里没有机器学习，但是也有对齐问题，失败的结果是大汗淋漓。


    首先，你没有测量你认为你在测量的东西。我想调节我房间的温度，但是我只能测量另一个房间的温度。我没有想到，只要一扇门开着另一扇不开，它们就根本不相关。


    其次，有时唯一能救你的是你的无能。我事后想，如果供暖系统更强大，如果我们的卧室隔热性更好，我和妻子可能就被烤熟了，幸亏我们醒了。而从另一面来看，低温更危险，卧室太冷会导致体温过低甚至死亡。
    ^(⁶⁵⁸)


    在我的例子中，我让自己的房门打开了一会儿，然后将两扇门都关上。我想起了 20 世纪伟大的控制论学家诺伯特·维纳，他用一句著名的话预见并警示了当代的对齐问题：“我们最好确定，机器的目的是我们真正渴望的目的。”


    但他的另一句话同样有先见之明和令人担忧。“过去，对人类的目的片面和不充分的认识相对无害，那是因为技术局限，”他写道，“人类的无能使我们免遭人类愚蠢行为的全部破坏性影响，这是其中之一。”
    ^(⁶⁵⁹)


    因此，从这个意义上说，我们肯定希望首先纠正我们的愚蠢，而不是我们的无能。正如人类未来研究所的尼克·博斯特罗姆在 2018 年说的：“人类的技术能力和人类的智慧在进行一场长距离赛跑，前者就像疾驰在田野上的种马，后者更像是站不稳的小马驹。”
    ^(⁶⁶⁰)


    赫胥黎在 1937 年则是这样说的：“很明显，迄今为止高奏凯歌的科学所做的改进并未改善目标的达成，甚至还有恶化。” ^(⁶⁶¹)


    ――――――


    到目前为止，讲述的还是一个令人鼓舞的故事，一个可控的、稳定的、科学进步的故事。一个生态系统正扩展到全球，致力于影响短期或长期的研究和政策。这在很大程度上仍处于初期阶段，但正在逐渐升温。


    对偏见、公平、透明和无数安全维度的研究，现在已成为在主要 AI 和机器学习会议上展示的工作的一个重要部分。事实上，它们已经是最具活力和发展最快的领域，可以说，不仅在计算领域，在所有科学领域都是如此。一位研究员告诉我，在
    2016 年该领域最大的一次会议上，当他说他在研究安全问题时，人们都投以怀疑的目光。一年后，当他参加同一个会议时，不再有人提出质疑。这种文化的转变反映了资金和研究焦点的转变。


    在前面的章节中，我们探讨了该研究议题的内容，各方面都有值得报告的进展。


    但是这本书以乔治·博克斯的引言开头，提醒我们“所有模型都是错的”。因此，本着这种精神，让我们以批判的眼光来解读我们自己的故事中的一些假设。


    ## 代表


    第 1 章讨论了模型的训练数据代表谁或什么的问题。我们在短时间内取得了很大进展；但如果不修正训练数据的代表性组成，就不可能开发出大范围使用的消费者人脸识别产品。然而，鉴于这样的模型不仅被消费者软件用来为照片添加标记，被消费类硬件用来解锁智能手机，还被政府用来监控人群，人们可能会质疑，让已被过度审视的少数族群在模型中获得更高的代表性会不会造成负面影响。


    代表性问题不仅对消费者技术有影响，也提醒了我们注意一项更古老、更棘手和更重要的悬殊差异。最近，我与一些医学研究者共进晚餐，当我讲述机器学习模型需要更具代表性的训练数据时，他们马上提醒我，大部分医学试验的对象绝大多数都是男性。
    ^(⁶⁶²)


    临床试验的对象选择是把双刃剑：保护弱势群体的禁令——比如不允许对孕妇或老年人进行医学试验——看似合理，但也会产生偏见和盲点。药物沙利度胺上市时被视为“绝对安全”，因为制药商“发现高剂量也不会杀死大鼠”。但是，这种药物在退市前，造成了成千上万例可怕的人类胎儿畸形。
    ^(⁶⁶³)


    在“监督学习”中，对于以某种方式打了“标签”的训练数据，我们也需要持批判性思维，不仅要了解训练数据是从哪里来的，还要了解标签是怎么来的，这些标签将在系统中作为基本事实的替身。而基本事实经常不是基本事实。


    例如，`ImageNet`将通过互联网收集的人类判断作为基本事实。如果大多数人认为，比如说，狼崽是一只小狗，那么对于图像识别系统来说，它就是小狗。特斯拉的
    AI 总监安德烈·卡普西（Andrej Karpathy）在斯坦福大学读研究生时，花了将近一周时间给`ImageNet`图片打标签，将自己作为与算法对比的人类基准。经过一番练习，他的“准确率”达到了
    95%。但是……相对什么的准确率？不是事实，而是共识。 ^(⁶⁶⁴)


    在更哲学的层面上，标签蕴含了一个我们必须无条件接受的预设本体论。`ImageNet`图像被标记为 1000 个类别中的 1 个。 ^(⁶⁶⁵)


    不仅需要审查训练数据和标签，还需要审查目标函数。图像识别系统通常用一个称为“交叉熵损失”的目标函数来训练——撇开数学细节不谈，它会对任何错误描述进行惩罚，不管是哪种错误。从交叉熵损失的角度来看，把炉盘误认为汽车进气栅，把绿苹果误认为梨子，把英国牛头犬误认为法国牛头犬，同把人描述成大猩猩一样糟糕。而事实上，哪怕仅从谷歌的财务来考虑，更不要说被错误分类的人，某些类型的错误也可能比其他错误严重几千倍甚至几百万倍。
    ^(⁶⁶⁶)


    在第 1 章的后半部分，我们讨论了基于向量的词表示极其惊人的类比能力。在看似简单的词向量表示背后，也存在极富争议的对齐问题。到底什么是类比？例如，通过简单的向量加法（有时称为“平行四边形”法，或“`3CosAdd`”算法）就可以得到一个词作为最佳类比。例如，“医生——男人+女人”得到一个向量，最接近的词应当还是医生。
    ^(⁶⁶⁷)


    托尔加·博鲁克巴斯和亚当·卡莱的团队发现，用`word2vec`表示我们所认为的“类比”不能令人满意，类比似乎要求两件事至少是不同的，所以他们采取了另一种策略。他们想象“医生”一词周围有某种“相似半径”，包括了“护士”“助产士”“妇科医生”“内科医生”和“骨科医生”等词，但不包括“农民”“秘书”或“立法者”。然后，他们在这个半径范围内寻找不是“医生”的最近单词。
    ^(⁶⁶⁸)


    还有其他棘手的问题。词向量的几何——即它们在数学空间中表示为距离——使得类比是对称的，这并不总是能反映人类对类比的直觉。例如，人们认为椭圆像圆，而不是圆像椭圆。
    ^(⁶⁶⁹)


    那么，什么算法，应用于什么表示，能更精确地模仿人类的类比？ ^(⁶⁷⁰)


    你可能会忍不住举手。我们完全可以训练机器学习人类类比的例子啊，并在其中包含各种不对称性和怪癖，让它找出合适的方法来说明类比是什么。为什么计算机科学家、语言学家和认知科学家还要争论这些事情，并从头开始构想算法呢？


    当然是因为这是对齐问题。人类对“类比”的概念和其他任何概念一样模糊不清。因此，在其他背景中用于对齐的一组新工具可能在这里也同样适用。


    ## 公平


    第 2 章探讨了风险评估工具在刑事司法系统中日益广泛的应用。这里有许多潜在的危险，其中一些我们已经讨论过了。这些模型所依据的“基本事实”不是被告后来是否犯罪，而是他们是否被再次逮捕和定罪。如果不同群体的人在被捕后被定罪或再次逮捕的可能性存在系统性差异，那么我们充其量是在学习累犯的扭曲替代物，而不是累犯本身。这是一个经常被忽视的关键点。


    同样值得审视的是，为了训练模型，我们假装知道被告如果被释放会做什么。我们怎么可能知道呢？典型的做法是查看他们之前在服刑期满后 2 年内的犯罪记录，并以此作为如果他们被提前释放后
    2 年内的替代。这隐含地假设了年龄和监禁本身都不会影响一个人重返社会后的行为。事实上，在某些情况下，年龄是最具预测性的变量。此外，认为监禁本身没有影响的假设很可能是错误的，而且对一个至少表面上是为了矫正而设计的系统来说，这是一个相当可悲的观点。如果像一些证据似乎表明的那样，监禁经历实际上会增加囚犯出狱后的犯罪行为，那么服满刑期的人的再犯又会成为模型的训练数据，该模型假设如果他们被提前释放，他们也会同样危险。
    ^(⁶⁷¹)


    在机器学习的许多领域中，所谓的“迁移学习”被用得很多，即针对某项任务训练的系统很容易被用于另一项任务。但在这样做时并不总是经过了深思熟虑或很明智。例如，`COMPAS`工具被明确设计为不可用于判刑，但一些司法管辖区仍然这样用。（词嵌入模型用于招聘也是如此。为预测而构建的词表示，在许多情况下被用来做它们被训练来预测的事情，从而成为自证预言。在一个曾有性别歧视的企业文化中，一个预测女性很少会被雇用的模型——不幸的是，这是正确的——可能会被贸然部署，从而导致很少有女性会被雇用。如果我们希望模型不只是重复和强化过去，还能做点别的，我们就需要更慎重、更用心地审视它们。）


    我们也看到，虽然“公平”概念暗示了各种看似直观和可取的形式化定义，然而一个残酷的数学事实是，无论是人类还是机器，没有哪个决策系统能同时满足所有这些定义。一些研究人员认为，与其找出这些不同的形式，然后试图“手动”协调它们，不如直接用人类认为“公平”和“不公平”的例子来训练一个系统，并让机器学习自己构建形式化、可操作的定义。
    ^(⁶⁷²)


    ## 透明


    第 3 章探讨了一个令人鼓舞的研究前沿，关于简单模型的优势，以及寻找最优简单模型的最新技术。然而，透明也有可能是把双刃剑，因为研究表明，即使透明模型是错误的，不应该被信任，人类也更信任透明模型。
    ^(⁶⁷³)


    还有一个小小的悖论：很难理解为什么一个特定的简单模型是最优的；要详尽回答这个问题，可能有很强的专业性，而且很长。此外，对于任何特定的简单模型，我们还可以问，可能特征的“表单”是怎么来的，更不用说首先是怎样的人类进程推动了对这种工具的渴求和创造。
    ^(⁶⁷⁴)


    在开发能给出解释的架构时，无论是视觉性的还是语言性的，有几件事需要警惕。研究展示了“对抗性解释”的可能性——也就是说，两个系统的行为几乎相同，但对它们的行为方式和原因有截然不同的解释。
    ^(⁶⁷⁵)


    ## 自主


    第 4、5、6 章分别探讨了强化学习、奖励塑造和内在动机，特别是在雅达利游戏和围棋的背景中，我们隐含地假设了在专业上被称为“遍历性”的东西——即你不会犯不可挽回的错误。一切都能通过重新开始来解决。也就是说，可以通过犯几十万次很大程度上是随机的，而且往往是致命的错误来学习。在安全的雅达利游戏世界的外面，遍历性假设并不成立。我记得
    2000 年代的一则汽车广告，演的是一个网络时代程序员，他白天编写极限赛车游戏，各种电影式的慢动作撞车，下班后却谨慎地开着安全结实的汽车回家。“因为在现实生活中，”他看着镜头说，“没有重启按钮。”`DeepMind`的简·雷克用稍微不同的语言表达了相同的意思。他指出，在他自己和他研究的自主体之间至少有一个大的区别，更准确地说，它们的世界和他的世界有一个很大差别。“现实世界不是遍历性的，”他说，“如果我从楼上跳下去，那就不是我能从中吸取教训的错误。”
    ^(⁶⁷⁶)

    '
