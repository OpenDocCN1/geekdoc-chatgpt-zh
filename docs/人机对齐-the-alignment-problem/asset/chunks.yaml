- raw: '蒂姆·布伦南也认为校准至关重要：“一个黑人和一个白人都得了7分，两人的再犯率是否相同？逮捕率呢？……标准方法是确保——绝对确保——校准没有种族偏见，准确度大致相同……我们做到了。如果不这样做，就违法了。”
    ^([^(157)](#fn157))


    然而，即使是那些强调校准重要性的人也认为，仅靠校准还不够。正如科贝特——戴维斯所说，“校准尽管通常是可取的，但还是很难保证决策公平”。 ^([^(158)](#fn158))


    我问朱莉娅·安格温，她自己如何看待她的文章引发的理论风暴，以及她们要求的目标——也就是说，制造一种工具，既要有同等的校准，**又要平衡**假阳性率和假阴性率——似乎不可能实现。


    “我对此的感觉是，”她说，“这是一个政策问题，是一个道德问题。但我真正高兴的是，在我们提出这个问题之后，大家都开始关注这里面的问题。对我来说，这是作为一名记者最大的价值……准确地锁定问题能促使它得到解决，我认同这一点。”
    ^([^(159)](#fn159))


    并非所有人都欢迎ProPublica文章引发的公众讨论。安东尼·弗洛雷斯（Anthony Flores）带领一群刑事司法学者发表了对ProPublica初始报告的“反驳”，不仅捍卫了COMPAS是一个经过校准的模型（并且校准是衡量公平的适当尺度），还哀叹争议本身的破坏性影响。
    ^([^(160)](#fn160))


    蒂姆·布伦南也有同样的担忧，当然他强烈反对ProPublica对COMPAS的描述。但当我问及这一争议，尤其是它带来的跨学科讨论是否有好的一面时，他表示同意：“我认为，将公平分解为各种不同的系数，能提醒人们注意使用这些系数的意义、好处、成本和不可能性。一旦你理解或定义了一个问题，肯定更有可能获得解决方案。”
    ^([^(161)](#fn161))


    计算机学界的大多数人都认为公开讨论这些事情比不公开讨论要好。


    “我的意思是，首先，数学就是数学，”辛西娅·德沃克说，“我们所能期待的最好结果无法超出数学允许的范围。所以知道极限比不知道要好。” ^([^(162)](#fn162))


    对莫里茨·哈特来说，ProPublica的研究启发的学术和专业工作使公平等伦理概念受到认可，成为了值得研究的主题，不仅在学术界如此，在企业界也是如此。哈特回忆了当2016年第一批成果——包括他自己的成果——出现时，他自己观察到的影响，当时他还在谷歌。“在那之前，人们甚至还不太确定，这是不是我们应该做的事情？普遍持怀疑态度，”他说。从2016年开始，谷歌内外都出现了兴趣和研究的爆炸式增长。“这让我引以为豪，”哈特说，“它的确改变了文化。”
    ^([^(163)](#fn163))


    对克莱因伯格来说，计算机科学在这类问题中的作用是为利益相关者提供阐明问题的工具。“我们的目的不是告诉你哪个是对的，哪个是错的，而是为你提供讨论所需的语言……我把这视为我作为一名计算机科学家的使命的一部分：对一直非形式化存在的事物定性，并尝试思考，我们能不能严格而准确地谈论它们？毕竟世界正在朝这个方向前进。”


    的确如此。2018年夏末，加州通过了SB 10号法案，这是一项重大的司法改革法案，将彻底取消现金保释，让该州可以选择拘留或释放一名等待审判的被告，此外，还授权在做出这些决定时使用算法风险评估工具。
    ^([^(164)](#fn164))


    尽管这些工具被采用的范围还在继续增加，但采用这些工具与构建和使用工具的智慧的竞赛似乎越来越势均力敌。我们对什么是“好的”预测有了越来越清晰的理解。


    然而，在这场讨论背后隐藏了一个更大的问题——那就是“预测”是否真的是我们想要做的。


    ProPublica报道后，《华盛顿邮报》的记者打电话给库尔德科瓦，请她评论此事。记者主要问了两个问题，第一个是关于ProPublica的主张与北点的回应的对立。


    “这我能给出答案，”库尔德科瓦说，“如果不同人群再犯的概率不同，那就无法让所有东西同时成立。我无法回答的是他提出的另一个问题：**什么是真正重要的？”**


    “正是这个问题促使我从不同的角度思考。” ^([^(165)](#fn165))


    **超越预测**


    尽管根据现有数据进行预测是可行的，但不应完全依赖这种方法。


    ——欧内斯特·伯吉斯 ^([^(166)](#fn166))


    科学家专注于是否能做到……他们没有停下来思考是否应该。


    ——杰夫·高布伦（Jeff Goldblum）饰演伊安·马尔科姆，《侏罗纪公园》


    在任何预测中，最重要的一点是确保你真的在预测你认为你在预测的事情。这比听起来难。


    例如，AlexNet在2012年的ImageNet竞赛中表现出色。竞赛目标是训练机器识别图像描绘的东西。但训练数据捕捉到的并不是这个。训练数据捕捉到的是MTurk上的人类志愿者认为图像描绘的内容。比方说，如果一头小狮子被人类志愿者反复误认为是一只猫，那么它将成为系统训练数据的一部分，**成为一只猫**——任何将其标记为狮子的系统都将被扣分，并且调整其参数来纠正这个“错误”。


    这个故事的寓意是：有时“基本事实”不是基本事实。


    在刑事司法预测中，这种差距更明显。人们经常说预测的是再犯，但这并不是训练数据所能捕捉到的。训练数据描述的不是**再犯**，而是**再次被捕和再次定罪**。这个区别可能至关重要。


    人权数据分析小组的首席统计师克里斯蒂安·卢姆（Kristian Lum）和密歇根州立大学政治科学系的威廉·艾萨克（William Isaac）2016年在一篇关于在警务中使用预测模型的论文中阐述了这一点：


    这些数据是作为警方活动的副产品收集的，所以根据从这些数据中获得的模式所做的预测，总体上与未来的犯罪事件无关。它们与警方知道的未来犯罪事件有关。从这个意义上说，预测性警务的命名很恰当：它是预测未来的警务，而不是未来的犯罪。
    ^([^(167)](#fn167))


    碰巧的是，这种批判也可以追溯到20世纪30年代。当欧内斯特·伯吉斯提出的假释改革在伊利诺伊州实施时，批评者——尤其是那些对假释犯成功重返社会的能力持怀疑态度的人——认为官方数据低估了再犯率。正如1937年伊利诺伊州众议院共和党少数党领袖埃尔默·施纳克伯格（Elmer J. Schnackenberg）抱怨的，“因为假释犯在假释的头一两年没有被抓到犯罪，所以他在这两年里被列为表现良好”。
    ^([^(168)](#fn168))


    打算用工具来衡量的东西与数据实际捕获的东西存在差距，这种差距让保守派和进步派都感到担忧。成功逃脱逮捕的罪犯被系统视为“低风险”，并以此为依据建议释放其他类似的罪犯。而那些被过度巡查和错误定罪的人成为所谓“高风险”群体的基本事实的一部分，促使系统建议关押其他类似的人。


    在预测性警务的背景下，这尤其令人担忧，在这种情况下，这种训练数据被用来**决定**警察的巡查，从而生成下一步的逮捕数据，有可能建立长时延正反馈回路。 ^([^(169)](#fn169))


    一个人犯下罪行，如果所在区域的警察不那么积极，或更容易获得撤销指控，将被系统标记为**没有再犯**。派往该区域的警察会**减少**。两个原本相似的社区的治安差异很可能因此扩大。正如卢姆和艾萨克说的，“模型变得越来越有信心，认为犯罪活动多的地点正是它们之前预测犯罪概率高的地点：选择偏见符合确证偏见”。
    ^([^(170)](#fn170))


    卢姆和艾萨克的结论，除了“警方所知的毒品犯罪并不是所有毒品犯罪的代表性样本”，更严重的是，“该模型没有纠正警方数据中明显的偏见，而是强化了这些偏见。给出的目标警务地点是那些根据我们的估计已经在历史警务数据中被过度代表的地点”。
    ^([^(171)](#fn171))


    有理由相信我们在今天已经有了巨大差距。正如库尔德科瓦指出的，“根据自我报告，年轻黑人男性和年轻白人男性的大麻使用率大致相同。但是与大麻有关的犯罪逮捕率在黑人年轻男性中要高出2.5到5倍”。
    ^([^(172)](#fn172))


    有一些措施可以在模型中弥补这些问题。例如，COMPAS模型对“风险”做了3个截然不同的预测：暴力再犯、再犯和未出庭。与非暴力犯罪相比，暴力犯罪——例如谋杀——更有可能向警方报案，反过来，警方也更有可能执法和逮捕。根据**定义**，被告**所有**未出庭的情况都会被法院系统记录，几乎没有给有偏见的抽样或差别执行留下空间。因此，明智的风险评估工具可能会将重点放在暴力再犯和未出庭预测，而不是非暴力再犯预测，理由是模型的训练数据在这些情况下更可信，许多司法管辖区正在开始这样做。
    ^([^(173)](#fn173))


    其他弥补措施包括在构建模型时，要考虑某些罪行执法上的巨大差异。比如，不区别对待有几次大麻逮捕的曼哈顿黑人和只有一次逮捕的曼哈顿白人。（当然，这将要求模型使用被告的种族作为输入。）对于大麻问题，第三个弥补措施是直接合法化，或至少非刑罪化来快刀斩乱麻，使得相应机器学习问题变得毫无意义。


    还有一个问题同样重要，即使预测模型如其所声称的能准确衡量，我们在实践中是将其用在了预期目的，还是用在了其他目的。


    例如，一些州正在使用COMPAS工具来指导**判决**，许多人认为这样使用不太合适，很别扭。威斯康星州助理司法部长克里斯汀·雷明顿（Christine Remington）表示：“我们不希望法院说，就风险而言，COMPAS对我面前的这个人评了10分，因此我将判他最高刑。”但是COMPAS已经被用来指导判刑，包括威斯康星州。当威斯康星人保罗·奇利因COMPAS评分被判比预期更长的刑期时，奇利的辩护律师传唤了蒂姆·布伦南本人作为辩方证人。布伦南作证说，COMPAS不是为判刑而设计的。
    ^([^(174)](#fn174))


    然而，如果继续深入，我们可能会挑战整个事业最基本的不言而喻的前提之一：更好的预测导致更好的公共安全。


    这样想乍一看似乎很疯狂。但我们有理由停下来，挑战支撑这一观点的一些假设。


    哥伦比亚大学法学教授伯纳德·哈科特（Bernard Harcourt）在《反对预测》一书中（安格温将这本书视为自己的灵感来源）提出了一些反对意见。他指出，更好的预测与更少的犯罪的关联并不像看起来那么简单明了。例如，假设有预测工具发现，大多数鲁莽的司机是男性。可能的情况是，积极拦截男性司机并不会显著降低他们的平均鲁莽程度——但**却会**导致意识到自己不太可能被拦截的女性司机**更**鲁莽地驾驶。这样道路的平均安全度可能会**降低**，而这正是因为使用了这种预测性政策。就像哈科特说的，“对过去、现在或未来的犯罪风险进行分析，可能会与执法的中心目标——最大限度地减少犯罪——背道而驰”。
    ^([^(175)](#fn175))


    如果预测不能有效转化为**行动**，也可能无法实现让社会更安全的最终目标。2013年，芝加哥市试行了一个旨在减少枪支暴力的项目，创建了一个“策略性主体列表”（非正式的“热点列表”），列出了枪支暴力的高危人群。这些人成为凶杀案受害者的概率是芝加哥平均水平的233倍。从这个意义上说，这份名单的预测力似乎很准。然而，凶杀案非常罕见，即使在“热点列表”中，也只有0.7%的人受害，99.3%的人没事。那么，应该如何利用这些预测信息呢？对1000人进行怎样的干预会帮助这7个的确会成为受害者的人？


    2016年兰德公司关于芝加哥预测性警务的一份报告指出，“通过利用先进的分析，警察部门有可能更有效地识别未来的犯罪目标，进行预先干预”。 ^([^(176)](#fn176))


    预测本身不是目的。一个可以99%确定犯罪地点和时间的世界，和一个可以减少99%犯罪的世界，哪个更好？在对某一特定预测工具的预测准确性——或者说，公平性——的狭隘追求中，我们可能遗漏了更重要的东西。
    ^([^(177)](#fn177))


    类似的，在审前释放阶段——COMPAS的设计目标——预测和干预也存在差距，需要更周全地考虑。预测某人不能按时出庭，并不一定意味着从现在到开庭一直监禁他们是正确的干预。
    ^([^(178)](#fn178))


    库尔德科瓦解释道：“如果你换个角度考虑，可能会意识到，这个特殊的人群可能是照顾自己的能力较低：他们可能其实**风险**更低，但**需要**更多帮助。”也许他们需要的是在出庭日或去法庭报到时子女能获得日托，而不是拘留。事实上，只需**提醒**人们出庭日期就能极大提高出庭率。
    ^([^(179)](#fn179))


    蒂姆·布伦南对这一点尤其有共鸣。提供给法官的被告的COMPAS信息表被设计成**风险**评估为红色，而**需求**评估为绿色。“之所以用绿色，”他说，“因为这些都是被告所需的支持和帮助。”
    ^([^(180)](#fn180))


    “所以这就引出了我的重点，”莫里茨·哈特告诉我。 ^([^(181)](#fn181))


    他解释道：“降低犯罪率和监禁率是非常非常困难的问题，我想留给刑事司法专家去解决。我认为预测在这个问题上反倒提供了一点反面乌托邦视角，它其实说的是，‘首先要明确，预测不是从根本上减少犯罪。我们只是预测它会在何时何地发生，让你在它发生之前抓人’，我认为预测并没有真正提供一种机制来从根本上减少犯罪。这就是我发现的它的反面乌托邦性。我们想要的不是预测何时何地会发生犯罪。这当然有用，但是从本质上来说，我们想要的是从根本上减少犯罪。作为计算机科学家，我在这个问题上没有什么可提供的，完全没有。对这件事我知之甚少。我花了几年时间才了解了一点点。”


    对于该领域最早的开拓者来说，后退一步，以更宽广、更宏观的眼光看待刑事司法系统的重要性并未被忽视。


    欧内斯特·伯吉斯关于假释制度的初步报告促使风险评估模式在全州推广，此后，在1937年，他觉得是时候进行更全面的研究了。“依我看，伊利诺伊州不应继续将假释作为刑罚问题中的孤立部分来处理，”他写道，“需要的是一项重大行动，国家监狱系统的彻底重组。”
    ^([^(182)](#fn182))


    从那时起又过去了80多年。这个看法仍然成立。


    ## **3. 透明**


    规则应该清晰，表达一致，人人都可理解。众所周知，实际很少这样。


    ——大卫·格雷伯（David Graeber） ^([^(183)](#fn183))


    提供大量信息，但不给出充分的结构或文档，这不是透明。


    ——理查德·伯克（Richard Berk） ^([^(184)](#fn184))


    里奇·卡鲁阿纳（Rich Caruana）是微软的机器学习专家，20世纪90年代中期，他还是卡内基·梅隆大学研究神经网络的研究生，导师是汤姆·米歇尔（Tom Mitchell）。


    米歇尔在做一个雄心勃勃的跨学科、多机构参与的项目，将生物统计学家、计算机科学家、哲学家和医生召集到一起，目的是更好地了解肺炎。当患者首次确诊时，医院需要尽早做出一个关键决定，是让他们住院还是门诊治疗。肺炎当时是美国第六大死因，约10%的肺炎患者最终死亡，因此正确识别风险大的患者将能挽救生命。


    该小组获得了约15000名肺炎患者的数据，打算构建机器学习模型来预测患者生存率，以帮助医院对新患者进行分类。用各种机器学习模型进行竞争：逻辑回归、规则学习模型、贝叶斯分类器、决策树、最近邻分类器、神经网络，各种各样的模型。
    ^([^(185)](#fn185))


    卡鲁阿纳擅长神经网络（在90年代，最先进的技术是**广度**网络，而不是深度网络），他对此很在行也很自信。他的神经网络轻而易举地获胜了，是所有复杂模型中最好的，并且明显优于逻辑回归等传统统计方法。
    ^([^(186)](#fn186))


    正如该团队在报告中写的，“对于流行且代价高昂的疾病，比如肺炎，预测性能哪怕只有小幅改善，也能显著改善医疗服务的质量和效率。因此，寻找具有最高预测水平的模型非常重要”。
    ^([^(187)](#fn187))


    参与该项研究的匹兹堡医院当然打算部署水平最高的模型。这样做行不行？


    “我们开始讨论这个问题——对患者使用神经网络是否安全。”卡鲁阿纳说。 ^([^(188)](#fn188))


    “我说，**见鬼，不，我们不能对患者使用这个神经网络。”**


    他们部署了一个更简单的模型，曾经是他的神经网络的手下败将。原因如下。


    **错误的规则**


    该项目的另一位研究人员理查德·安布罗西尼（Richard Ambrosino）尝试在同一数据集上训练另一种“基于规则”的模型。基于规则的模型属于最容易解释的机器学习系统，通常采用“如果x，则y”的规则列表形式。从上往下找，只要找到一条适用规则就行了。想象一个流程图，没有分支，就像一根藤蔓从上往下延伸：“这条规则适用吗？如果适用，这就是答案。如果不适用，继续往下。”基于规则的模型类似编程语言中的if或switch语句；也很接近人类思考和写作的方式。（更复杂的模型使用“集合”而不是“列表”，可以同时应用多条规则。）
    ^([^(189)](#fn189))


    一天晚上，安布罗西尼尝试利用肺炎数据建立一个基于规则的模型。在训练模型时，他注意到它学会了一条似乎很奇怪的规则。规则是“如果患者有哮喘病史，则是低风险，应该让其接受门诊治疗”。


    安布罗西尼感觉不对劲。他喊卡鲁阿纳来看。据卡鲁阿纳回忆，“他大概是这么说的，‘里奇，你看这是怎么回事？完全没道理。如果你患有肺炎，不是医生也知道哮喘没什么好处’”。两人参加了下一次项目组会议，有许多医生出席，也许医学博士具有计算机专家不具备的洞察力。“他们说：‘你们知道吗，数据中可能确实存在这种模式。我们认为哮喘是肺炎患者的一个严重风险因素，因此我们不仅让他们住院……还可能要把他们放在重症监护室，重点护理。’”


    换句话说，基于规则的系统学到的相关性是真实存在的。平均而言，哮喘患者死于肺炎的可能性确实低于一般人群。但这恰恰是因为他们获得的护理水平较高。卡鲁阿纳解释道：“因此，哮喘患者获得的护理使他们处于低风险状态，而这又导致该模型拒收这些患者。你应该能看明白问题出在哪里。”推荐哮喘患者接受门诊治疗的模型不仅是错的，还有可能危及生命。
    ^([^(190)](#fn190))


    看着基于规则的系统发现的奇怪逻辑，卡鲁阿纳立刻想到，他的神经网络肯定也会捕捉到相同的逻辑，只是不那么显而易见。


    基于规则的系统相对容易纠正；神经网络则很难用这种方式“纠正”，虽然不是不可能。“我不知道它在神经网络中的什么位置，但这个问题我好歹还能够解决，”卡鲁阿纳回忆道，“在此过程中，我可以发表更多论文，这很好，我们会解决这个问题。我们不部署神经网络实际上不是因为**哮喘**，这个问题我已经知道了。”


    “我担心的是神经网络会学习到和哮喘同样危险，而基于规则的系统**没有**学习到的东西。”因为神经网络更强大、更灵活，它能够学习基于规则的系统不能学习的东西。毕竟，这正是神经网络的优势，也是卡鲁阿纳的神经网络赢得项目组内部竞赛的原因。“就是**那些**东西让我们不能使用这个模型。因为我们不知道里面有什么需要纠正。神经网络的透明度问题最终导致我决定不使用它。这困扰了我很久。因为最精确的机器学习模型通常不那么透明。我是机器学习专家。我当然想使用最精确的模型，但我也想安全地使用。”'
  fmt: '

    蒂姆·布伦南也认为校准至关重要：“一个黑人和一个白人都得了7分，两人的再犯率是否相同？逮捕率呢？……标准方法是确保——绝对确保——校准没有种族偏见，准确度大致相同……我们做到了。如果不这样做，就违法了。”
    ^([^(157)](#fn157))


    然而，即使是那些强调校准重要性的人也认为，仅靠校准还不够。正如科贝特——戴维斯所说，“校准尽管通常是可取的，但还是很难保证决策公平”。 ^([^(158)](#fn158))


    我问朱莉娅·安格温，她自己如何看待她的文章引发的理论风暴，以及她们要求的目标——也就是说，制造一种工具，既要有同等的校准，**又要平衡**假阳性率和假阴性率——似乎不可能实现。


    “我对此的感觉是，”她说，“这是一个政策问题，是一个道德问题。但我真正高兴的是，在我们提出这个问题之后，大家都开始关注这里面的问题。对我来说，这是作为一名记者最大的价值……准确地锁定问题能促使它得到解决，我认同这一点。”
    ^([^(159)](#fn159))


    并非所有人都欢迎ProPublica文章引发的公众讨论。安东尼·弗洛雷斯（Anthony Flores）带领一群刑事司法学者发表了对ProPublica初始报告的“反驳”，不仅捍卫了COMPAS是一个经过校准的模型（并且校准是衡量公平的适当尺度），还哀叹争议本身的破坏性影响。
    ^([^(160)](#fn160))


    蒂姆·布伦南也有同样的担忧，当然他强烈反对ProPublica对COMPAS的描述。但当我问及这一争议，尤其是它带来的跨学科讨论是否有好的一面时，他表示同意：“我认为，将公平分解为各种不同的系数，能提醒人们注意使用这些系数的意义、好处、成本和不可能性。一旦你理解或定义了一个问题，肯定更有可能获得解决方案。”
    ^([^(161)](#fn161))


    计算机学界的大多数人都认为公开讨论这些事情比不公开讨论要好。


    “我的意思是，首先，数学就是数学，”辛西娅·德沃克说，“我们所能期待的最好结果无法超出数学允许的范围。所以知道极限比不知道要好。” ^([^(162)](#fn162))


    对莫里茨·哈特来说，ProPublica的研究启发的学术和专业工作使公平等伦理概念受到认可，成为了值得研究的主题，不仅在学术界如此，在企业界也是如此。哈特回忆了当2016年第一批成果——包括他自己的成果——出现时，他自己观察到的影响，当时他还在谷歌。“在那之前，人们甚至还不太确定，这是不是我们应该做的事情？普遍持怀疑态度，”他说。从2016年开始，谷歌内外都出现了兴趣和研究的爆炸式增长。“这让我引以为豪，”哈特说，“它的确改变了文化。”
    ^([^(163)](#fn163))


    对克莱因伯格来说，计算机科学在这类问题中的作用是为利益相关者提供阐明问题的工具。“我们的目的不是告诉你哪个是对的，哪个是错的，而是为你提供讨论所需的语言……我把这视为我作为一名计算机科学家的使命的一部分：对一直非形式化存在的事物定性，并尝试思考，我们能不能严格而准确地谈论它们？毕竟世界正在朝这个方向前进。”


    的确如此。2018年夏末，加州通过了SB 10号法案，这是一项重大的司法改革法案，将彻底取消现金保释，让该州可以选择拘留或释放一名等待审判的被告，此外，还授权在做出这些决定时使用算法风险评估工具。
    ^([^(164)](#fn164))


    尽管这些工具被采用的范围还在继续增加，但采用这些工具与构建和使用工具的智慧的竞赛似乎越来越势均力敌。我们对什么是“好的”预测有了越来越清晰的理解。


    然而，在这场讨论背后隐藏了一个更大的问题——那就是“预测”是否真的是我们想要做的。


    ProPublica报道后，《华盛顿邮报》的记者打电话给库尔德科瓦，请她评论此事。记者主要问了两个问题，第一个是关于ProPublica的主张与北点的回应的对立。


    “这我能给出答案，”库尔德科瓦说，“如果不同人群再犯的概率不同，那就无法让所有东西同时成立。我无法回答的是他提出的另一个问题：**什么是真正重要的？**”


    “正是这个问题促使我从不同的角度思考。” ^([^(165)](#fn165))


    ## 超越预测


    尽管根据现有数据进行预测是可行的，但不应完全依赖这种方法。


    ——欧内斯特·伯吉斯 ^([^(166)](#fn166))


    科学家专注于是否能做到……他们没有停下来思考是否应该。


    ——杰夫·高布伦（Jeff Goldblum）饰演伊安·马尔科姆，《侏罗纪公园》


    在任何预测中，最重要的一点是确保你真的在预测你认为你在预测的事情。这比听起来难。


    例如，AlexNet在2012年的ImageNet竞赛中表现出色。竞赛目标是训练机器识别图像描绘的东西。但训练数据捕捉到的并不是这个。训练数据捕捉到的是MTurk上的人类志愿者认为图像描绘的内容。比方说，如果一头小狮子被人类志愿者反复误认为是一只猫，那么它将成为系统训练数据的一部分，**成为一只猫**——任何将其标记为狮子的系统都将被扣分，并且调整其参数来纠正这个“错误”。


    这个故事的寓意是：有时“基本事实”不是基本事实。


    在刑事司法预测中，这种差距更明显。人们经常说预测的是再犯，但这并不是训练数据所能捕捉到的。训练数据描述的不是**再犯**，而是**再次被捕和再次定罪**。这个区别可能至关重要。


    人权数据分析小组的首席统计师克里斯蒂安·卢姆（Kristian Lum）和密歇根州立大学政治科学系的威廉·艾萨克（William Isaac）2016年在一篇关于在警务中使用预测模型的论文中阐述了这一点：


    这些数据是作为警方活动的副产品收集的，所以根据从这些数据中获得的模式所做的预测，总体上与未来的犯罪事件无关。它们与警方知道的未来犯罪事件有关。从这个意义上说，预测性警务的命名很恰当：它是预测未来的警务，而不是未来的犯罪。
    ^([^(167)](#fn167))


    碰巧的是，这种批判也可以追溯到20世纪30年代。当欧内斯特·伯吉斯提出的假释改革在伊利诺伊州实施时，批评者——尤其是那些对假释犯成功重返社会的能力持怀疑态度的人——认为官方数据低估了再犯率。正如1937年伊利诺伊州众议院共和党少数党领袖埃尔默·施纳克伯格（Elmer
    J. Schnackenberg）抱怨的，“因为假释犯在假释的头一两年没有被抓到犯罪，所以他在这两年里被列为表现良好”。 ^([^(168)](#fn168))


    打算用工具来衡量的东西与数据实际捕获的东西存在差距，这种差距让保守派和进步派都感到担忧。成功逃脱逮捕的罪犯被系统视为“低风险”，并以此为依据建议释放其他类似的罪犯。而那些被过度巡查和错误定罪的人成为所谓“高风险”群体的基本事实的一部分，促使系统建议关押其他类似的人。


    在预测性警务的背景下，这尤其令人担忧，在这种情况下，这种训练数据被用来**决定**警察的巡查，从而生成下一步的逮捕数据，有可能建立长时延正反馈回路。 ^([^(169)](#fn169))


    一个人犯下罪行，如果所在区域的警察不那么积极，或更容易获得撤销指控，将被系统标记为**没有再犯**。派往该区域的警察会**减少**。两个原本相似的社区的治安差异很可能因此扩大。正如卢姆和艾萨克说的，“模型变得越来越有信心，认为犯罪活动多的地点正是它们之前预测犯罪概率高的地点：选择偏见符合确证偏见”。
    ^([^(170)](#fn170))


    卢姆和艾萨克的结论，除了“警方所知的毒品犯罪并不是所有毒品犯罪的代表性样本”，更严重的是，“该模型没有纠正警方数据中明显的偏见，而是强化了这些偏见。给出的目标警务地点是那些根据我们的估计已经在历史警务数据中被过度代表的地点”。
    ^([^(171)](#fn171))


    有理由相信我们在今天已经有了巨大差距。正如库尔德科瓦指出的，“根据自我报告，年轻黑人男性和年轻白人男性的大麻使用率大致相同。但是与大麻有关的犯罪逮捕率在黑人年轻男性中要高出2.5到5倍”。
    ^([^(172)](#fn172))


    有一些措施可以在模型中弥补这些问题。例如，COMPAS模型对“风险”做了3个截然不同的预测：暴力再犯、再犯和未出庭。与非暴力犯罪相比，暴力犯罪——例如谋杀——更有可能向警方报案，反过来，警方也更有可能执法和逮捕。根据**定义**，被告**所有**未出庭的情况都会被法院系统记录，几乎没有给有偏见的抽样或差别执行留下空间。因此，明智的风险评估工具可能会将重点放在暴力再犯和未出庭预测，而不是非暴力再犯预测，理由是模型的训练数据在这些情况下更可信，许多司法管辖区正在开始这样做。
    ^([^(173)](#fn173))


    其他弥补措施包括在构建模型时，要考虑某些罪行执法上的巨大差异。比如，不区别对待有几次大麻逮捕的曼哈顿黑人和只有一次逮捕的曼哈顿白人。（当然，这将要求模型使用被告的种族作为输入。）对于大麻问题，第三个弥补措施是直接合法化，或至少非刑罪化来快刀斩乱麻，使得相应机器学习问题变得毫无意义。


    还有一个问题同样重要，即使预测模型如其所声称的能准确衡量，我们在实践中是将其用在了预期目的，还是用在了其他目的。


    例如，一些州正在使用COMPAS工具来指导**判决**，许多人认为这样使用不太合适，很别扭。威斯康星州助理司法部长克里斯汀·雷明顿（Christine Remington）表示：“我们不希望法院说，就风险而言，COMPAS对我面前的这个人评了10分，因此我将判他最高刑。”但是COMPAS已经被用来指导判刑，包括威斯康星州。当威斯康星人保罗·奇利因COMPAS评分被判比预期更长的刑期时，奇利的辩护律师传唤了蒂姆·布伦南本人作为辩方证人。布伦南作证说，COMPAS不是为判刑而设计的。
    ^([^(174)](#fn174))


    然而，如果继续深入，我们可能会挑战整个事业最基本的不言而喻的前提之一：更好的预测导致更好的公共安全。


    这样想乍一看似乎很疯狂。但我们有理由停下来，挑战支撑这一观点的一些假设。


    哥伦比亚大学法学教授伯纳德·哈科特（Bernard Harcourt）在《反对预测》一书中（安格温将这本书视为自己的灵感来源）提出了一些反对意见。他指出，更好的预测与更少的犯罪的关联并不像看起来那么简单明了。例如，假设有预测工具发现，大多数鲁莽的司机是男性。可能的情况是，积极拦截男性司机并不会显著降低他们的平均鲁莽程度——但**却会**导致意识到自己不太可能被拦截的女性司机**更**鲁莽地驾驶。这样道路的平均安全度可能会**降低**，而这正是因为使用了这种预测性政策。就像哈科特说的，“对过去、现在或未来的犯罪风险进行分析，可能会与执法的中心目标——最大限度地减少犯罪——背道而驰”。
    ^([^(175)](#fn175))


    如果预测不能有效转化为**行动**，也可能无法实现让社会更安全的最终目标。2013年，芝加哥市试行了一个旨在减少枪支暴力的项目，创建了一个“策略性主体列表”（非正式的“热点列表”），列出了枪支暴力的高危人群。这些人成为凶杀案受害者的概率是芝加哥平均水平的233倍。从这个意义上说，这份名单的预测力似乎很准。然而，凶杀案非常罕见，即使在“热点列表”中，也只有0.7%的人受害，99.3%的人没事。那么，应该如何利用这些预测信息呢？对1000人进行怎样的干预会帮助这7个的确会成为受害者的人？


    2016年兰德公司关于芝加哥预测性警务的一份报告指出，“通过利用先进的分析，警察部门有可能更有效地识别未来的犯罪目标，进行预先干预”。 ^([^(176)](#fn176))


    预测本身不是目的。一个可以99%确定犯罪地点和时间的世界，和一个可以减少99%犯罪的世界，哪个更好？在对某一特定预测工具的预测准确性——或者说，公平性——的狭隘追求中，我们可能遗漏了更重要的东西。
    ^([^(177)](#fn177))


    类似的，在审前释放阶段——COMPAS的设计目标——预测和干预也存在差距，需要更周全地考虑。预测某人不能按时出庭，并不一定意味着从现在到开庭一直监禁他们是正确的干预。
    ^([^(178)](#fn178))


    库尔德科瓦解释道：“如果你换个角度考虑，可能会意识到，这个特殊的人群可能是照顾自己的能力较低：他们可能其实**风险**更低，但**需要**更多帮助。”也许他们需要的是在出庭日或去法庭报到时子女能获得日托，而不是拘留。事实上，只需**提醒**人们出庭日期就能极大提高出庭率。
    ^([^(179)](#fn179))


    蒂姆·布伦南对这一点尤其有共鸣。提供给法官的被告的COMPAS信息表被设计成**风险**评估为红色，而**需求**评估为绿色。“之所以用绿色，”他说，“因为这些都是被告所需的支持和帮助。”
    ^([^(180)](#fn180))


    “所以这就引出了我的重点，”莫里茨·哈特告诉我。 ^([^(181)](#fn181))


    他解释道：“降低犯罪率和监禁率是非常非常困难的问题，我想留给刑事司法专家去解决。我认为预测在这个问题上反倒提供了一点反面乌托邦视角，它其实说的是，‘首先要明确，预测不是从根本上减少犯罪。我们只是预测它会在何时何地发生，让你在它发生之前抓人’，我认为预测并没有真正提供一种机制来从根本上减少犯罪。这就是我发现的它的反面乌托邦性。我们想要的不是预测何时何地会发生犯罪。这当然有用，但是从本质上来说，我们想要的是从根本上减少犯罪。作为计算机科学家，我在这个问题上没有什么可提供的，完全没有。对这件事我知之甚少。我花了几年时间才了解了一点点。”


    对于该领域最早的开拓者来说，后退一步，以更宽广、更宏观的眼光看待刑事司法系统的重要性并未被忽视。


    欧内斯特·伯吉斯关于假释制度的初步报告促使风险评估模式在全州推广，此后，在1937年，他觉得是时候进行更全面的研究了。“依我看，伊利诺伊州不应继续将假释作为刑罚问题中的孤立部分来处理，”他写道，“需要的是一项重大行动，国家监狱系统的彻底重组。”
    ^([^(182)](#fn182))


    从那时起又过去了80多年。这个看法仍然成立。


    ## 3. 透明


    规则应该清晰，表达一致，人人都可理解。众所周知，实际很少这样。


    ——大卫·格雷伯（David Graeber） ^([^(183)](#fn183))


    提供大量信息，但不给出充分的结构或文档，这不是透明。


    ——理查德·伯克（Richard Berk） ^([^(184)](#fn184))


    里奇·卡鲁阿纳（Rich Caruana）是微软的机器学习专家，20世纪90年代中期，他还是卡内基·梅隆大学研究神经网络的研究生，导师是汤姆·米歇尔（Tom
    Mitchell）。


    米歇尔在做一个雄心勃勃的跨学科、多机构参与的项目，将生物统计学家、计算机科学家、哲学家和医生召集到一起，目的是更好地了解肺炎。当患者首次确诊时，医院需要尽早做出一个关键决定，是让他们住院还是门诊治疗。肺炎当时是美国第六大死因，约10%的肺炎患者最终死亡，因此正确识别风险大的患者将能挽救生命。


    该小组获得了约15000名肺炎患者的数据，打算构建机器学习模型来预测患者生存率，以帮助医院对新患者进行分类。用各种机器学习模型进行竞争：逻辑回归、规则学习模型、贝叶斯分类器、决策树、最近邻分类器、神经网络，各种各样的模型。
    ^([^(185)](#fn185))


    卡鲁阿纳擅长神经网络（在90年代，最先进的技术是**广度**网络，而不是深度网络），他对此很在行也很自信。他的神经网络轻而易举地获胜了，是所有复杂模型中最好的，并且明显优于逻辑回归等传统统计方法。
    ^([^(186)](#fn186))


    正如该团队在报告中写的，“对于流行且代价高昂的疾病，比如肺炎，预测性能哪怕只有小幅改善，也能显著改善医疗服务的质量和效率。因此，寻找具有最高预测水平的模型非常重要”。
    ^([^(187)](#fn187))


    参与该项研究的匹兹堡医院当然打算部署水平最高的模型。这样做行不行？


    “我们开始讨论这个问题——对患者使用神经网络是否安全。”卡鲁阿纳说。 ^([^(188)](#fn188))


    “我说，**见鬼，不，我们不能对患者使用这个神经网络。”**


    他们部署了一个更简单的模型，曾经是他的神经网络的手下败将。原因如下。


    ### 错误的规则


    该项目的另一位研究人员理查德·安布罗西尼（Richard Ambrosino）尝试在同一数据集上训练另一种“基于规则”的模型。基于规则的模型属于最容易解释的机器学习系统，通常采用“如果x，则y”的规则列表形式。从上往下找，只要找到一条适用规则就行了。想象一个流程图，没有分支，就像一根藤蔓从上往下延伸：“这条规则适用吗？如果适用，这就是答案。如果不适用，继续往下。”基于规则的模型类似编程语言中的if或switch语句；也很接近人类思考和写作的方式。（更复杂的模型使用“集合”而不是“列表”，可以同时应用多条规则。）
    ^([^(189)](#fn189))


    一天晚上，安布罗西尼尝试利用肺炎数据建立一个基于规则的模型。在训练模型时，他注意到它学会了一条似乎很奇怪的规则。规则是“如果患者有哮喘病史，则是低风险，应该让其接受门诊治疗”。


    安布罗西尼感觉不对劲。他喊卡鲁阿纳来看。据卡鲁阿纳回忆，“他大概是这么说的，‘里奇，你看这是怎么回事？完全没道理。如果你患有肺炎，不是医生也知道哮喘没什么好处’”。两人参加了下一次项目组会议，有许多医生出席，也许医学博士具有计算机专家不具备的洞察力。“他们说：‘你们知道吗，数据中可能确实存在这种模式。我们认为哮喘是肺炎患者的一个严重风险因素，因此我们不仅让他们住院……还可能要把他们放在重症监护室，重点护理。’”


    换句话说，基于规则的系统学到的相关性是真实存在的。平均而言，哮喘患者死于肺炎的可能性确实低于一般人群。但这恰恰是因为他们获得的护理水平较高。卡鲁阿纳解释道：“因此，哮喘患者获得的护理使他们处于低风险状态，而这又导致该模型拒收这些患者。你应该能看明白问题出在哪里。”推荐哮喘患者接受门诊治疗的模型不仅是错的，还有可能危及生命。
    ^([^(190)](#fn190))


    看着基于规则的系统发现的奇怪逻辑，卡鲁阿纳立刻想到，他的神经网络肯定也会捕捉到相同的逻辑，只是不那么显而易见。


    基于规则的系统相对容易纠正；神经网络则很难用这种方式“纠正”，虽然不是不可能。“我不知道它在神经网络中的什么位置，但这个问题我好歹还能够解决，”卡鲁阿纳回忆道，“在此过程中，我可以发表更多论文，这很好，我们会解决这个问题。我们不部署神经网络实际上不是因为**哮喘**，这个问题我已经知道了。”


    “我担心的是神经网络会学习到和哮喘同样危险，而基于规则的系统**没有**学习到的东西。”因为神经网络更强大、更灵活，它能够学习基于规则的系统不能学习的东西。毕竟，这正是神经网络的优势，也是卡鲁阿纳的神经网络赢得项目组内部竞赛的原因。“就是**那些**东西让我们不能使用这个模型。因为我们不知道里面有什么需要纠正。神经网络的透明度问题最终导致我决定不使用它。这困扰了我很久。因为最精确的机器学习模型通常不那么透明。我是机器学习专家。我当然想使用最精确的模型，但我也想安全地使用。”

    '
  trans: '


    蒂姆·布伦南也认为校准至关重要：“一个黑人和一个白人都得了 7 分，两人的再犯率是否相同？逮捕率呢？……标准方法是确保——绝对确保——校准没有种族偏见，准确度大致相同……我们做到了。如果不这样做，就违法了。”
    ^(¹⁵⁷)


    然而，即使是那些强调校准重要性的人也认为，仅靠校准还不够。正如科贝特——戴维斯所说，“校准尽管通常是可取的，但还是很难保证决策公平”。 ^(¹⁵⁸)


    我问朱莉娅·安格温，她自己如何看待她的文章引发的理论风暴，以及她们要求的目标——也就是说，制造一种工具，既要有同等的校准，**又要平衡**假阳性率和假阴性率——似乎不可能实现。


    “我对此的感觉是，”她说，“这是一个政策问题，是一个道德问题。但我真正高兴的是，在我们提出这个问题之后，大家都开始关注这里面的问题。对我来说，这是作为一名记者最大的价值……准确地锁定问题能促使它得到解决，我认同这一点。”
    ^(¹⁵⁹)


    并非所有人都欢迎 ProPublica 文章引发的公众讨论。安东尼·弗洛雷斯（Anthony Flores）带领一群刑事司法学者发表了对 ProPublica
    初始报告的“反驳”，不仅捍卫了 COMPAS 是一个经过校准的模型（并且校准是衡量公平的适当尺度），还哀叹争议本身的破坏性影响。 ^(¹⁶⁰)


    蒂姆·布伦南也有同样的担忧，当然他强烈反对 ProPublica 对 COMPAS 的描述。但当我问及这一争议，尤其是它带来的跨学科讨论是否有好的一面时，他表示同意：“我认为，将公平分解为各种不同的系数，能提醒人们注意使用这些系数的意义、好处、成本和不可能性。一旦你理解或定义了一个问题，肯定更有可能获得解决方案。”
    ^(¹⁶¹)


    计算机学界的大多数人都认为公开讨论这些事情比不公开讨论要好。


    “我的意思是，首先，数学就是数学，”辛西娅·德沃克说，“我们所能期待的最好结果无法超出数学允许的范围。所以知道极限比不知道要好。” ^(¹⁶²)


    对莫里茨·哈特来说，ProPublica 的研究启发的学术和专业工作使公平等伦理概念受到认可，成为了值得研究的主题，不仅在学术界如此，在企业界也是如此。哈特回忆了当
    2016 年第一批成果——包括他自己的成果——出现时，他自己观察到的影响，当时他还在谷歌。“在那之前，人们甚至还不太确定，这是不是我们应该做的事情？普遍持怀疑态度，”他说。从
    2016 年开始，谷歌内外都出现了兴趣和研究的爆炸式增长。“这让我引以为豪，”哈特说，“它的确改变了文化。” ^(¹⁶³)


    对克莱因伯格来说，计算机科学在这类问题中的作用是为利益相关者提供阐明问题的工具。“我们的目的不是告诉你哪个是对的，哪个是错的，而是为你提供讨论所需的语言……我把这视为我作为一名计算机科学家的使命的一部分：对一直非形式化存在的事物定性，并尝试思考，我们能不能严格而准确地谈论它们？毕竟世界正在朝这个方向前进。”


    的确如此。2018 年夏末，加州通过了 SB 10 号法案，这是一项重大的司法改革法案，将彻底取消现金保释，让该州可以选择拘留或释放一名等待审判的被告，此外，还授权在做出这些决定时使用算法风险评估工具。
    ^(¹⁶⁴)


    尽管这些工具被采用的范围还在继续增加，但采用这些工具与构建和使用工具的智慧的竞赛似乎越来越势均力敌。我们对什么是“好的”预测有了越来越清晰的理解。


    然而，在这场讨论背后隐藏了一个更大的问题——那就是“预测”是否真的是我们想要做的。


    ProPublica 报道后，《华盛顿邮报》的记者打电话给库尔德科瓦，请她评论此事。记者主要问了两个问题，第一个是关于 ProPublica 的主张与北点的回应的对立。


    “这我能给出答案，”库尔德科瓦说，“如果不同人群再犯的概率不同，那就无法让所有东西同时成立。我无法回答的是他提出的另一个问题：**什么是真正重要的？**”


    “正是这个问题促使我从不同的角度思考。” ^(¹⁶⁵)


    ## 超越预测


    尽管根据现有数据进行预测是可行的，但不应完全依赖这种方法。


    ——欧内斯特·伯吉斯 ^(¹⁶⁶)


    科学家专注于是否能做到……他们没有停下来思考是否应该。


    ——杰夫·高布伦（Jeff Goldblum）饰演伊安·马尔科姆，《侏罗纪公园》


    在任何预测中，最重要的一点是确保你真的在预测你认为你在预测的事情。这比听起来难。


    例如，AlexNet 在 2012 年的 ImageNet 竞赛中表现出色。竞赛目标是训练机器识别图像描绘的东西。但训练数据捕捉到的并不是这个。训练数据捕捉到的是
    MTurk 上的人类志愿者认为图像描绘的内容。比方说，如果一头小狮子被人类志愿者反复误认为是一只猫，那么它将成为系统训练数据的一部分，**成为一只猫**——任何将其标记为狮子的系统都将被扣分，并且调整其参数来纠正这个“错误”。


    这个故事的寓意是：有时“基本事实”不是基本事实。


    在刑事司法预测中，这种差距更明显。人们经常说预测的是再犯，但这并不是训练数据所能捕捉到的。训练数据描述的不是**再犯**，而是**再次被捕和再次定罪**。这个区别可能至关重要。


    人权数据分析小组的首席统计师克里斯蒂安·卢姆（Kristian Lum）和密歇根州立大学政治科学系的威廉·艾萨克（William Isaac）2016 年在一篇关于在警务中使用预测模型的论文中阐述了这一点：


    这些数据是作为警方活动的副产品收集的，所以根据从这些数据中获得的模式所做的预测，总体上与未来的犯罪事件无关。它们与警方知道的未来犯罪事件有关。从这个意义上说，预测性警务的命名很恰当：它是预测未来的警务，而不是未来的犯罪。
    ^(¹⁶⁷)


    碰巧的是，这种批判也可以追溯到 20 世纪 30 年代。当欧内斯特·伯吉斯提出的假释改革在伊利诺伊州实施时，批评者——尤其是那些对假释犯成功重返社会的能力持怀疑态度的人——认为官方数据低估了再犯率。正如
    1937 年伊利诺伊州众议院共和党少数党领袖埃尔默·施纳克伯格（Elmer J. Schnackenberg）抱怨的，“因为假释犯在假释的头一两年没有被抓到犯罪，所以他在这两年里被列为表现良好”。
    ^(¹⁶⁸)


    打算用工具来衡量的东西与数据实际捕获的东西存在差距，这种差距让保守派和进步派都感到担忧。成功逃脱逮捕的罪犯被系统视为“低风险”，并以此为依据建议释放其他类似的罪犯。而那些被过度巡查和错误定罪的人成为所谓“高风险”群体的基本事实的一部分，促使系统建议关押其他类似的人。


    在预测性警务的背景下，这尤其令人担忧，在这种情况下，这种训练数据被用来**决定**警察的巡查，从而生成下一步的逮捕数据，有可能建立长时延正反馈回路。 ^(¹⁶⁹)


    一个人犯下罪行，如果所在区域的警察不那么积极，或更容易获得撤销指控，将被系统标记为**没有再犯**。派往该区域的警察会**减少**。两个原本相似的社区的治安差异很可能因此扩大。正如卢姆和艾萨克说的，“模型变得越来越有信心，认为犯罪活动多的地点正是它们之前预测犯罪概率高的地点：选择偏见符合确证偏见”。
    ^(¹⁷⁰)


    卢姆和艾萨克的结论，除了“警方所知的毒品犯罪并不是所有毒品犯罪的代表性样本”，更严重的是，“该模型没有纠正警方数据中明显的偏见，而是强化了这些偏见。给出的目标警务地点是那些根据我们的估计已经在历史警务数据中被过度代表的地点”。
    ^(¹⁷¹)


    有理由相信我们在今天已经有了巨大差距。正如库尔德科瓦指出的，“根据自我报告，年轻黑人男性和年轻白人男性的大麻使用率大致相同。但是与大麻有关的犯罪逮捕率在黑人年轻男性中要高出
    2.5 到 5 倍”。 ^(¹⁷²)


    有一些措施可以在模型中弥补这些问题。例如，COMPAS 模型对“风险”做了 3 个截然不同的预测：暴力再犯、再犯和未出庭。与非暴力犯罪相比，暴力犯罪——例如谋杀——更有可能向警方报案，反过来，警方也更有可能执法和逮捕。根据**定义**，被告**所有**未出庭的情况都会被法院系统记录，几乎没有给有偏见的抽样或差别执行留下空间。因此，明智的风险评估工具可能会将重点放在暴力再犯和未出庭预测，而不是非暴力再犯预测，理由是模型的训练数据在这些情况下更可信，许多司法管辖区正在开始这样做。
    ^(¹⁷³)


    其他弥补措施包括在构建模型时，要考虑某些罪行执法上的巨大差异。比如，不区别对待有几次大麻逮捕的曼哈顿黑人和只有一次逮捕的曼哈顿白人。（当然，这将要求模型使用被告的种族作为输入。）对于大麻问题，第三个弥补措施是直接合法化，或至少非刑罪化来快刀斩乱麻，使得相应机器学习问题变得毫无意义。


    还有一个问题同样重要，即使预测模型如其所声称的能准确衡量，我们在实践中是将其用在了预期目的，还是用在了其他目的。


    例如，一些州正在使用 COMPAS 工具来指导**判决**，许多人认为这样使用不太合适，很别扭。威斯康星州助理司法部长克里斯汀·雷明顿（Christine
    Remington）表示：“我们不希望法院说，就风险而言，COMPAS 对我面前的这个人评了 10 分，因此我将判他最高刑。”但是 COMPAS 已经被用来指导判刑，包括威斯康星州。当威斯康星人保罗·奇利因
    COMPAS 评分被判比预期更长的刑期时，奇利的辩护律师传唤了蒂姆·布伦南本人作为辩方证人。布伦南作证说，COMPAS 不是为判刑而设计的。 ^(¹⁷⁴)


    然而，如果继续深入，我们可能会挑战整个事业最基本的不言而喻的前提之一：更好的预测导致更好的公共安全。


    这样想乍一看似乎很疯狂。但我们有理由停下来，挑战支撑这一观点的一些假设。


    哥伦比亚大学法学教授伯纳德·哈科特（Bernard Harcourt）在《反对预测》一书中（安格温将这本书视为自己的灵感来源）提出了一些反对意见。他指出，更好的预测与更少的犯罪的关联并不像看起来那么简单明了。例如，假设有预测工具发现，大多数鲁莽的司机是男性。可能的情况是，积极拦截男性司机并不会显著降低他们的平均鲁莽程度——但**却会**导致意识到自己不太可能被拦截的女性司机**更**鲁莽地驾驶。这样道路的平均安全度可能会**降低**，而这正是因为使用了这种预测性政策。就像哈科特说的，“对过去、现在或未来的犯罪风险进行分析，可能会与执法的中心目标——最大限度地减少犯罪——背道而驰”。
    ^(¹⁷⁵)


    如果预测不能有效转化为**行动**，也可能无法实现让社会更安全的最终目标。2013 年，芝加哥市试行了一个旨在减少枪支暴力的项目，创建了一个“策略性主体列表”（非正式的“热点列表”），列出了枪支暴力的高危人群。这些人成为凶杀案受害者的概率是芝加哥平均水平的
    233 倍。从这个意义上说，这份名单的预测力似乎很准。然而，凶杀案非常罕见，即使在“热点列表”中，也只有 0.7%的人受害，99.3%的人没事。那么，应该如何利用这些预测信息呢？对
    1000 人进行怎样的干预会帮助这 7 个的确会成为受害者的人？


    2016 年兰德公司关于芝加哥预测性警务的一份报告指出，“通过利用先进的分析，警察部门有可能更有效地识别未来的犯罪目标，进行预先干预”。 ^(¹⁷⁶)


    预测本身不是目的。一个可以 99%确定犯罪地点和时间的世界，和一个可以减少 99%犯罪的世界，哪个更好？在对某一特定预测工具的预测准确性——或者说，公平性——的狭隘追求中，我们可能遗漏了更重要的东西。
    ^(¹⁷⁷)


    类似的，在审前释放阶段——COMPAS 的设计目标——预测和干预也存在差距，需要更周全地考虑。预测某人不能按时出庭，并不一定意味着从现在到开庭一直监禁他们是正确的干预。
    ^(¹⁷⁸)


    库尔德科瓦解释道：“如果你换个角度考虑，可能会意识到，这个特殊的人群可能是照顾自己的能力较低：他们可能其实**风险**更低，但**需要**更多帮助。”也许他们需要的是在出庭日或去法庭报到时子女能获得日托，而不是拘留。事实上，只需**提醒**人们出庭日期就能极大提高出庭率。
    ^(¹⁷⁹)


    蒂姆·布伦南对这一点尤其有共鸣。提供给法官的被告的 COMPAS 信息表被设计成**风险**评估为红色，而**需求**评估为绿色。“之所以用绿色，”他说，“因为这些都是被告所需的支持和帮助。”
    ^(¹⁸⁰)


    “所以这就引出了我的重点，”莫里茨·哈特告诉我。 ^(¹⁸¹)


    他解释道：“降低犯罪率和监禁率是非常非常困难的问题，我想留给刑事司法专家去解决。我认为预测在这个问题上反倒提供了一点反面乌托邦视角，它其实说的是，‘首先要明确，预测不是从根本上减少犯罪。我们只是预测它会在何时何地发生，让你在它发生之前抓人’，我认为预测并没有真正提供一种机制来从根本上减少犯罪。这就是我发现的它的反面乌托邦性。我们想要的不是预测何时何地会发生犯罪。这当然有用，但是从本质上来说，我们想要的是从根本上减少犯罪。作为计算机科学家，我在这个问题上没有什么可提供的，完全没有。对这件事我知之甚少。我花了几年时间才了解了一点点。”


    对于该领域最早的开拓者来说，后退一步，以更宽广、更宏观的眼光看待刑事司法系统的重要性并未被忽视。


    欧内斯特·伯吉斯关于假释制度的初步报告促使风险评估模式在全州推广，此后，在 1937 年，他觉得是时候进行更全面的研究了。“依我看，伊利诺伊州不应继续将假释作为刑罚问题中的孤立部分来处理，”他写道，“需要的是一项重大行动，国家监狱系统的彻底重组。”
    ^(¹⁸²)


    从那时起又过去了 80 多年。这个看法仍然成立。


    ## 3. 透明


    规则应该清晰，表达一致，人人都可理解。众所周知，实际很少这样。


    ——大卫·格雷伯（David Graeber） ^(¹⁸³)


    提供大量信息，但不给出充分的结构或文档，这不是透明。


    ——理查德·伯克（Richard Berk） ^(¹⁸⁴)


    里奇·卡鲁阿纳（Rich Caruana）是微软的机器学习专家，20 世纪 90 年代中期，他还是卡内基·梅隆大学研究神经网络的研究生，导师是汤姆·米歇尔（Tom
    Mitchell）。


    米歇尔在做一个雄心勃勃的跨学科、多机构参与的项目，将生物统计学家、计算机科学家、哲学家和医生召集到一起，目的是更好地了解肺炎。当患者首次确诊时，医院需要尽早做出一个关键决定，是让他们住院还是门诊治疗。肺炎当时是美国第六大死因，约
    10%的肺炎患者最终死亡，因此正确识别风险大的患者将能挽救生命。


    该小组获得了约 15000 名肺炎患者的数据，打算构建机器学习模型来预测患者生存率，以帮助医院对新患者进行分类。用各种机器学习模型进行竞争：逻辑回归、规则学习模型、贝叶斯分类器、决策树、最近邻分类器、神经网络，各种各样的模型。
    ^(¹⁸⁵)


    卡鲁阿纳擅长神经网络（在 90 年代，最先进的技术是**广度**网络，而不是深度网络），他对此很在行也很自信。他的神经网络轻而易举地获胜了，是所有复杂模型中最好的，并且明显优于逻辑回归等传统统计方法。
    ^(¹⁸⁶)


    正如该团队在报告中写的，“对于流行且代价高昂的疾病，比如肺炎，预测性能哪怕只有小幅改善，也能显著改善医疗服务的质量和效率。因此，寻找具有最高预测水平的模型非常重要”。
    ^(¹⁸⁷)


    参与该项研究的匹兹堡医院当然打算部署水平最高的模型。这样做行不行？


    “我们开始讨论这个问题——对患者使用神经网络是否安全。”卡鲁阿纳说。 ^(¹⁸⁸)


    “我说，**见鬼，不，我们不能对患者使用这个神经网络。”**


    他们部署了一个更简单的模型，曾经是他的神经网络的手下败将。原因如下。


    ### 错误的规则


    该项目的另一位研究人员理查德·安布罗西尼（Richard Ambrosino）尝试在同一数据集上训练另一种“基于规则”的模型。基于规则的模型属于最容易解释的机器学习系统，通常采用“如果
    x，则 y”的规则列表形式。从上往下找，只要找到一条适用规则就行了。想象一个流程图，没有分支，就像一根藤蔓从上往下延伸：“这条规则适用吗？如果适用，这就是答案。如果不适用，继续往下。”基于规则的模型类似编程语言中的
    if 或 switch 语句；也很接近人类思考和写作的方式。（更复杂的模型使用“集合”而不是“列表”，可以同时应用多条规则。） ^(¹⁸⁹)


    一天晚上，安布罗西尼尝试利用肺炎数据建立一个基于规则的模型。在训练模型时，他注意到它学会了一条似乎很奇怪的规则。规则是“如果患者有哮喘病史，则是低风险，应该让其接受门诊治疗”。


    安布罗西尼感觉不对劲。他喊卡鲁阿纳来看。据卡鲁阿纳回忆，“他大概是这么说的，‘里奇，你看这是怎么回事？完全没道理。如果你患有肺炎，不是医生也知道哮喘没什么好处’”。两人参加了下一次项目组会议，有许多医生出席，也许医学博士具有计算机专家不具备的洞察力。“他们说：‘你们知道吗，数据中可能确实存在这种模式。我们认为哮喘是肺炎患者的一个严重风险因素，因此我们不仅让他们住院……还可能要把他们放在重症监护室，重点护理。’”


    换句话说，基于规则的系统学到的相关性是真实存在的。平均而言，哮喘患者死于肺炎的可能性确实低于一般人群。但这恰恰是因为他们获得的护理水平较高。卡鲁阿纳解释道：“因此，哮喘患者获得的护理使他们处于低风险状态，而这又导致该模型拒收这些患者。你应该能看明白问题出在哪里。”推荐哮喘患者接受门诊治疗的模型不仅是错的，还有可能危及生命。
    ^(¹⁹⁰)


    看着基于规则的系统发现的奇怪逻辑，卡鲁阿纳立刻想到，他的神经网络肯定也会捕捉到相同的逻辑，只是不那么显而易见。


    基于规则的系统相对容易纠正；神经网络则很难用这种方式“纠正”，虽然不是不可能。“我不知道它在神经网络中的什么位置，但这个问题我好歹还能够解决，”卡鲁阿纳回忆道，“在此过程中，我可以发表更多论文，这很好，我们会解决这个问题。我们不部署神经网络实际上不是因为**哮喘**，这个问题我已经知道了。”


    “我担心的是神经网络会学习到和哮喘同样危险，而基于规则的系统**没有**学习到的东西。”因为神经网络更强大、更灵活，它能够学习基于规则的系统不能学习的东西。毕竟，这正是神经网络的优势，也是卡鲁阿纳的神经网络赢得项目组内部竞赛的原因。“就是**那些**东西让我们不能使用这个模型。因为我们不知道里面有什么需要纠正。神经网络的透明度问题最终导致我决定不使用它。这困扰了我很久。因为最精确的机器学习模型通常不那么透明。我是机器学习专家。我当然想使用最精确的模型，但我也想安全地使用。”


    '
