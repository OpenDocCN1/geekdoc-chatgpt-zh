- raw: '本文报告的研究与数字计算机的编程有关，其行为类似人类或动物的学习过程……我们的计算机已具备足够的数据处理能力和计算速度，能够利用机器学习技术，但我们对这些技术的基本原理的掌握仍处于初级阶段。由于缺乏这方面的知识，不得不详细准确地说明解决问题的方法，这个过程耗时且成本高昂。通过编程让计算机从经验中学习，应该可以省去很多烦琐的编程工作。
    ^([^(267)](#fn267))


    他用大白话解释道：“这是我经历过的最让人兴奋的事情之一……据我所知，还没有人曾让数字计算机自我改进。你看，计算机能够模拟的思维活动一直受到严重限制，因为我们不得不告诉它们到底该做什么和怎么做。”


    开发能够通过人类指令或自身经验学习的机器，能减轻**编程**的负担。此外，它将使计算机能够做我们不知道**如何**编程让它们做的事情。


    塞缪尔的演示成为了计算机科学的传奇。另一位AI先驱约翰·麦卡锡（John McCarthy）回忆说，当塞缪尔准备在国家电视台演示跳棋程序时，“IBM创始人兼总裁老托马斯·沃森（Thomas J. Watson Sr.）说，演示会使IBM股票上涨15个百分点。他没说错”。
    ^([^(268)](#fn268))


    **享乐主义神经元**


    每个神经细胞都在为自己的生命奋斗，这与我们为获得满足的奋斗是平行的。


    ——桑代克 ^([^(269)](#fn269))


    1972年，俄亥俄州赖特——帕特森空军基地空军科学研究所的哈利·克劳夫（Harry Klopf）发表了一篇题为《大脑功能和适应性系统：异体平衡理论》的革命性报告。克劳夫认为“神经元是享乐主义者”：它致力于最大化某种近似的、局部的“快乐”，并最小化某种“痛苦”。克劳夫认为，人类和动物行为的复杂性都是由这些“享乐主义”神经元连接形成的复杂系统产生的。


    在克劳夫之前的一代人，也就是从20世纪40年代到60年代的控制论运动，是基于所谓的“负反馈”来构建智能行为。他们认为，生物的驱动力主要是维持自体稳态或平衡。它们努力保持舒适的体温，吃东西充饥，交配以排解性欲，睡眠以消除疲劳。一切似乎都是为了回到平衡。


    1943年的控制论开创性论文《行为、目的和目的论》区分了有目的和无目的（或随机）的行为。 ^([^(270)](#fn270))


    克劳夫不认同生物的驱动力主要是维持自体平衡的观点。他认为，生物体是**最大化者**，而不是最小化者。在任何意义上，生命都是生长、繁殖，是无穷无尽和永不满足的前进。在克劳夫看来，生命的目标根本不是自体平衡，而是相反。“生物适应系统的主要目标是寻求一个最大状态（异体平衡），而不是……稳态（自体平衡）。”他还以一种极富诗意的方式提倡正反馈而不是负反馈：“正反馈和负反馈对生命过程都必不可少。但是，正反馈占主导，它提供了‘生命的火花’。”从单细胞到有机体再到社会，正反馈无处不在。克劳夫对于他提出的这个观念的意义毫不谦虚。“这似乎是第一个能够提供统一框架的理论，在这个框架内，生物适应系统的神经生理学、心理学和社会学特性都能得到解释，”他写道，“神经元、神经系统和国家都是异体平衡。”
    ^([^(271)](#fn271))


    **神经元**是贪得无厌的最大化者？这能解释**国家**行为？这个想法雄心勃勃，但也很不正统，甚至可能很荒谬。空军给了他资金，让他寻找研究人员或组建实验室进行研究。他在马萨诸塞大学阿默斯特校区组建了团队，聘请了一位名叫安德鲁·巴图（Andrew Barto）的博士后研究员，来研究这个想法——如巴图所说——“是一个疯狂的、不切实际的想法，还是有一些科学价值？”
    ^([^(272)](#fn272))


    与此同时，克劳夫还同斯坦福大学一名心理学本科生保持联系。在巴图加入时，克劳夫撺掇他：“有个非常聪明的孩子，你应该让他加入。” ^([^(273)](#fn273))


    我问巴图对后来的事情是否有所预知。“我们不知道。”他告诉我。桑顿和巴图将在克劳夫的空军基金资助下，开始为期45年的合作，并开创一个新的领域。这一领域涉及神经科学、行为主义心理学、工程学和数学，被称为“强化学习”；他们的名字——“巴图和桑顿”“桑顿和巴图”——将永远与他们共同撰写的AI领域权威教科书联系在一起，几乎成了强化学习领域本身的代名词。
    ^([^(274)](#fn274))


    我在马萨诸塞大学校园里见到了巴图，他已经退休。“幸福地退休了，”他说。“坦率说，很高兴摆脱了关于AI和强化的鼓吹和狂热的漩涡。”


    我告诉他，我很兴奋能听他谈论强化学习（通常简记为“RL”）的发展史，尤其是它对安全、决策和人类认知的影响，他打断了我。


    “你有多少时间？”


    我告诉他，一天。的确要这么久。


    **奖励假说**


    巴图和桑顿基于克劳夫的生物是最大化者的思想，给出了具体的数学表示。假设你处于一个提供数值奖励的环境中，如果你采取某些行动并达到一定的状态，就能得到这些奖励。你的任务是尽可能获得最多奖励——最高“分数”。


    例如环境可以是迷宫，行为可以是向北、向南、向东或向西移动，到达出口就能获得奖励（也许超时会有惩罚）。环境也可以是棋盘，行为是移动棋子，将死对手可以奖励一分（和棋得半分）。环境也可以是股市，行为是买入卖出，奖励以你投资组合的价值来衡量。环境还可以是国家经济，行为可能是颁布立法或外交手段，奖励可能是长期的GDP增长。对环境的复杂性没什么限制，只要求奖励是一个**标量**，就像可互换的共同货币。


    事实证明，强化学习框架是如此普适，以至于产生了一个“奖励假说”：“我们平时所说的目标和目的**都**可以视为获得的标量奖励的累积总和最大化。” ^([^(275)](#fn275))


    “这差不多是哲学了，”桑顿说，“但很有些道理。” ^([^(276)](#fn276))


    当然，并不是所有人都同意这个前提。在体育、下棋、电子游戏和金融中，可能确实存在这样的标量，一种用来衡量所有结果的单一货币（字面意义或比喻）。但这真的能适用于复杂多变的动物甚至人类吗？我们做出决定产生的后果经常是有得有失。加班到深夜可能会让老板高看我们一眼，但是会考验爱人的耐心。我们是更看重人生成就、冒险经历还是人际关系或心智成长？例如，牛津大学哲学家张美露（Ruth Chang）几十年来一直在论证，人类境况最典型的一面就是我们拥有的各种动机和目标的**不可比较性**。我们**不能**简单地将主要的生活选择放在天平上，权衡哪一个最合适，否则就只有纯粹理性，无所谓道德，也没有机会创造意义和塑造个性。
    ^([^(277)](#fn277))


    桑顿自己也承认，奖励假说“可能最终是错误的，但它是如此简单，我们必须先推翻它再去考虑其他更复杂的”。


    即使暂且接受奖励最大化和标量奖励可比性的框架，要成为异体平衡最大化者也不是那么容易。事实上，强化学习在哲学和数学上都带来了诸多挑战。


    第一个挑战是，我们的决定**是相互关联的**。对于这一点，强化学习与无监督学习（用于构建第1章探讨的向量词表示）和监督学习（用于ImageNet竞赛、人脸识别、再犯风险评估等问题）存在微妙但重要的差异。在这些背景下，每个决定相互独立。给系统输入一张图片，比如说鸡油菌，并要求对其分类。系统给出的答案可能正确也可能错误，如果错了参数可能会微调，但无论对错，你只需从图库随机抽取下一张图片，然后继续。这种输入数据被统计学家称为“i.i.d”：独立同分布。我们所看到的和所做的与接下来看到的没有因果关联。


    在强化学习中——迷宫、下棋，甚至人生——我们没有在真空中做决定的奢侈。我们做出的每个决定都给下一个决定设定了背景。事实上，它可能会**永久**改变背景。以某种走法挪动棋子，会对可能出现的棋局和未来可选的策略施加强约束。在一个虚拟或真实的空间中，运动的固有特征决定了，我们采取的行动，无论是在迷宫中向北移动，回家陪爱人，还是到佛罗里达过冬，会塑造我们在未来得到的输入，可能是暂时的，也可能是永久的。如果下象棋时弃后，在剩下的棋局中就不能再使用它。如果从屋顶跳下去，可能会再也没有机会跳。如果对某人不友善，可能会永远改变那个人对我们的行为，我们可能永远无法知道，如果当初友善一点，他会怎么做。


    强化学习的第二个挑战是，由于奖励是标量，与监督和非监督学习相比，环境给出的奖惩很**简略**。猜测缺失词的语言模型在训练过程中每次猜测后，会被告知正确的词，对图像分类的模型会被立即给予“正确”的标签。然后，它们可以肯定地向正确答案的方向进行调整。相比之下，强化学习系统，在某种环境下尽力最大化某个数值，在结束时会知道自己的成绩，但无论输赢，它可能永远无法知道“正确的”或“最好的”行动是什么。当火箭爆炸，桥梁垮塌，或者搬运的一叠盘子倒了，踢的球没进网，世界给出的结果非常清楚。但到底哪些步骤做得不对，很难说清楚。


    正如巴图说的，强化学习与其说是跟随**老师**学习，不如说是跟**评论家**学习。 ^([^(278)](#fn278))


    强化学习的第三个挑战是，反馈不仅简略且不具建设性，还有延迟。例如，我们可能会在开局后第5步就犯了无法挽回的错误，导致100步后被将死。当人们经历失败或挫折时，无论是失望的父母、破产企业主或是被捕的小偷，一般都会想“我是哪里做错了？”这在强化学习中被称为“信用分配问题”，半个世纪以来一直困扰着研究者。例如，MIT的马文·明斯基在1961年的著名论文《走向人工智能的步骤》中写道：“在象棋和跳棋等复杂游戏中，或者在编写程序时，有明确的标准，赢还是输，成功还是失败。但在游戏过程中，最终的成败涉及大量决策。如果成功，我们如何将成功的信用分配到众多的决定？”


    明斯基解释道：“假设一个复杂的任务（比如下赢一盘棋）涉及100万个决定。我们是不是给参与完成任务的每个决定分配1/1000000分？” ^([^(279)](#fn279))


    如果在长途旅行几天后遭遇了车祸，我们不会追溯我们的行为一直到转动钥匙发车的时刻，然后想：“好吧，下次出门再也不**左拐**了！”但我们也不会认为，在棋局的第89步被将死后，错误**一定**发生在第88步。


    那么，我们如何才能从成功和失败中正确吸取教训呢？强化学习框架开始在学习和行为的基本问题上打开新视野，最终发展成为完备的领域，并在最近10年指导了AI的研究进程。而且正如克劳夫设想的，这反过来又给自然智能的研究带来了许多启发。


    **多巴胺之谜**


    如果人类和动物可以被视为“异体平衡”奖励最大化者，那么这些奖励肯定是通过大脑的某种机制起作用。如果人类和动物真的存在某种用于最大化的单一标量“奖励”，会不会就是大脑中的某种化学物质或回路？20世纪50年代，蒙特利尔麦吉尔大学的两位研究人员，詹姆斯·奥尔兹（James Olds）和彼得·米尔纳（Peter Milner）似乎找到了它。


    奥尔兹和米尔纳在实验中将电极放在老鼠大脑的不同位置，并让老鼠有机会按压杠杆，杠杆会导致电极刺激大脑的特定区域。他们发现，大脑的一些区域似乎对老鼠的行为没有影响。在有些区域，老鼠似乎会**避免**杠杆被按下。但在一些区域，尤其是所谓的“隔区”，老鼠似乎很想按下杠杆，向该区域输送电流。老鼠会每小时按下操纵杆5000次，彻夜不休。
    ^([^(280)](#fn280))


    起初，这些区域被称为“强化结构”，但很快奥尔兹开始称之为“快感中枢”。 ^([^(281)](#fn281))


    随着时间推移，研究逐渐证实，大脑中电刺激快感最强的区域是产生名为3，4-二羟苯乙胺的神经递质的区域，这种神经递质有一个更耳熟能详的名字：多巴胺。 ^([^(282)](#fn282))


    这很像是“奖励标量”，就像记分牌上的分数，非常简单，但传播范围广，而且至关重要。多巴胺似乎也与成瘾物质密切相关，包括可卡因、海洛因和酒精。难道多巴胺真的是大脑中的奖励分子货币？


    20世纪70年代末的研究似乎也印证了这一点。例如，1978年的一项研究发现，如果让学习过按压杠杆获得食物的老鼠摄入多巴胺阻断药物匹莫齐特，它们对按压杠杆的兴趣并不比从未学习过食物关联的老鼠高。食物奖励似乎对摄入匹莫齐特的老鼠没有影响。研究人员写道，匹莫齐特“似乎选择性地减弱了食物和享乐性刺激的奖励效应”。
    ^([^(283)](#fn283))


    20世纪80年代，电生理学发展到了可以实时监测单个多巴胺神经元的水平。在瑞士弗里堡的实验室里，德国神经生理学家沃尔夫拉姆·舒尔茨（Wolfram Schultz）研究了猴子的多巴胺神经元的行为。它们把手伸进盒子，里面有时是空的，有时装有小块水果或烘焙食品。果然，嘀的一声，“当猴子的手碰到食物时，产生了一阵冲击”。
    ^([^(284)](#fn284))


    但是有些奇怪的事情。


    在一些实验中，如果盒子里有食物，实验员会提供某种视觉或听觉线索，这种**线索**会引发多巴胺活动的激增。然后猴子会伸手去拿食物，舒尔茨继续监控读数——什么也没发生。就像平常的活动基线一样，没有尖峰。他写道，多巴胺神经元“对（线索）起反应，释放出一阵冲动，但在触碰到食物时完全没反应”。
    ^([^(285)](#fn285))


    这到底是怎么回事？


    “我们搞不清是怎么回事。”舒尔茨说。 ^([^(286)](#fn286))


    在20世纪80年代末90年代初，舒尔茨和合作者试图为他们看到的现象寻找合理解释。 ^([^(287)](#fn287))


    舒尔茨告诉我：“我们无法把它归因于某件事。一开始把它归因于激励，动机，作为对刺激的反应驱使你前进……我们最初是这么想的，但后来发现这个概念太模糊。”实验室同事开始认同一个观点，即它与惊喜或出乎预期有关。心理学中有个观念，叫做雷斯科拉——瓦格纳模型，认为学习的关键在于惊喜。
    ^([^(288)](#fn288))


    舒尔茨还观察到了另一个现象，比第一个更神秘的现象。他当时正在做后续研究，使用了类似的装置，但这次用的是杠杆和果汁，而不是盒子和食物。等猴子习得线索可靠地意味着果汁后，舒尔茨尝试了一些新东西：给出一个假警报。他触发了提示；和往常一样，猴子的多巴胺活性激增，高于神经元平常的基线。猴子按下杠杆，没有果汁。猴子的多巴胺神经元短暂但明确地陷入**静默**。“然后我说，**好吧。这与惊喜相反**。”
    ^([^(289)](#fn289))


    多巴胺是个谜。起初，它似乎很明显是大脑的奖励货币，它显然在测量**什么**。如果不是奖励，不是注意力，不是新奇，也不是惊喜，那到底是**什么**？


    **策略和价值函数**


    很难聪明到一分钟内都骗不倒你。


    ——雷欧·斯泰因（Leo Stein） ^([^(290)](#fn290))


    20世纪80年代，在舒尔茨开始多巴胺实验的同一时期，在大西洋的另一边，巴图和桑顿开始在强化学习问题上取得数学进展。


    第一步是分解问题。他们意识到，学习如何在环境中采取行动以最大化奖励，涉及两个相关但相对独立的子问题：行动和评估。当你开始理解并最终掌握一个领域时，你学到了两件重要的事情：如何根据给定情形采取正确行动，以及如何估计一种情势可能带来的未来奖惩。正如巴图和桑顿意识到的，分析棋局的棋手有**两种**不同的预感。她有一种本能，知道下一步该怎么走（以及对手可能会如何应对）。她还有另一种本能，那就是这种棋局哪方可能会赢。强化学习问题的这两个方面也就是所谓的**策略函数**（什么时候做什么）和**价值函数**（预期的奖惩）。


    从理论上来说，这两者各自都足以解决问题。如果棋手**总是**知道正确走法，那么即使不擅长预测谁会赢也没关系。反过来说，如果棋手**总是**知道特定棋局谁更占优，那么就算不确定该怎么走也没关系。只要有足够时间，可以权衡每一步的后果，然后选择最有希望的走法。


    基于策略的方法得到的系统具有高度训练的“肌肉记忆”，无论是动物、人还是机器，可以立即执行正确行为。相对的，基于价值的方法得到的系统具有高度训练的“蜘蛛感知”，可以迅速判断情势是不利还是有利。两者中的任何一个，如果充分发展，都够用。


    然而，在实践中，基于策略的方法和基于价值的方法可以并行。巴图和桑顿提出了一种称为“演员——评论家”架构的想法，在这种架构中，系统的一半是“演员”，学习采取好的行动，另一半是“评论家”，学习预测未来的收益。
    ^([^(291)](#fn291))


    早在1978年，桑顿就着迷于构造——如他的本科论文标题所写——“一个统一的期望理论”， ^([^(292)](#fn292))


    根据桑顿的推理，发展好的期望——好的价值函数——意味着将你每一步的期望与最终真正的裁决相协调：游戏的最终比分、季度报告、成功登月、职业生涯后期同行的钦佩赞许、起立鼓掌、孙子们的开心。但是，如果你**真的**不得不等到游戏结束再从中学习，那么信用分配问题实际上不可能解决。他说，有三重逻辑。


    首先，**记住**我们想过和做过的每一件事可能是不可行或不可能的。在一场惨败的足球赛结束时，我们真的会聚集在更衣室，复盘比赛中每一个动作吗？复盘我们希望和恐惧的每一次转变？


    第二，我们希望即使没有最终裁决也能学习。一局在结束前被打断的象棋应该也能学到一些**东西**。如果我们即将被将死，或者感觉已毫无胜算，这仍然意味着我们需要改进，不管预期的损失或惩罚是否真的到来。同样，如果一场比赛因为反常、不可思议、不可预见的事件在最后几秒钟被翻盘，也并不一定意味着我们之前的预期是错的。也许我们之前确实走在胜利的轨道上。完全根据最终结果来判断不一定有意义，尤其是在某种程度上情势是出于偶然。


    第三，理想情况下，我们不仅想在事后学习，也想**在前进的过程中**学习。这对我们的人生尤为重要。对于许多最关键的时刻和最重要的目标，比如上大学、抚养孩子或安逸地退休，我们通常只有一次机会。但还有许多错误，例如成绩退步、腰围变粗、关系闹僵，会让我们意识到事情正在偏离正轨，并在还来得及的时候进行调整。如果我们是通过试错学习，那么幸运的是，我们不需要做完整个尝试，也不需要犯完**整个**错误才能学习。


    正如桑顿解释的，这里每个因素都让期望理论变得更棘手。“我们可以忽略所有这些事情，把它们视为麻烦，但我认为它们是线索，”他说，“这些都是大自然给我们的提示，告诉我们该如何前进”。
    ^([^(293)](#fn293))


    事实证明，桑顿自己首先领会了这些提示。


    桑顿在思考预测方面的突破是这样的。当面对不确定的未来时，你保持着一种对事情看起来有多少希望的“运行时期望”。在象棋中，这可能是你评估自己赢棋的概率。在电子游戏中，这可能是你预期自己能打到哪一关，或者你预期的总分。预测会随时间变化，总的来说，随着越来越接近你试图预测的东西，预测会越来越准确。（周四对周末的天气预报几乎总是比周一更准。你从机场坐车回家的预计到达时间会随着你离家越近而越准确。）这意味着，随着预期产生变化，相继的预期之间会有差异，每个差异都是一次学习的机会。桑顿称这些为**时序差分**，或**TD误差**。一旦出现时序差分，更靠后的那个预期通常更准确。'
  fmt: '

    本文报告的研究与数字计算机的编程有关，其行为类似人类或动物的学习过程……我们的计算机已具备足够的数据处理能力和计算速度，能够利用机器学习技术，但我们对这些技术的基本原理的掌握仍处于初级阶段。由于缺乏这方面的知识，不得不详细准确地说明解决问题的方法，这个过程耗时且成本高昂。通过编程让计算机从经验中学习，应该可以省去很多烦琐的编程工作。
    ^([^(267)](#fn267))


    他用大白话解释道：“这是我经历过的最让人兴奋的事情之一……据我所知，还没有人曾让数字计算机自我改进。你看，计算机能够模拟的思维活动一直受到严重限制，因为我们不得不告诉它们到底该做什么和怎么做。”


    开发能够通过人类指令或自身经验学习的机器，能减轻**编程**的负担。此外，它将使计算机能够做我们不知道**如何**编程让它们做的事情。


    塞缪尔的演示成为了计算机科学的传奇。另一位AI先驱约翰·麦卡锡（John McCarthy）回忆说，当塞缪尔准备在国家电视台演示跳棋程序时，“IBM创始人兼总裁老托马斯·沃森（Thomas J. Watson Sr.）说，演示会使IBM股票上涨15个百分点。他没说错”。
    ^([^(268)](#fn268))


    ## 享乐主义神经元


    每个神经细胞都在为自己的生命奋斗，这与我们为获得满足的奋斗是平行的。


    ——桑代克 ^([^(269)](#fn269))


    1972年，俄亥俄州赖特——帕特森空军基地空军科学研究所的哈利·克劳夫（Harry Klopf）发表了一篇题为《大脑功能和适应性系统：异体平衡理论》的革命性报告。克劳夫认为“神经元是享乐主义者”：它致力于最大化某种近似的、局部的“快乐”，并最小化某种“痛苦”。克劳夫认为，人类和动物行为的复杂性都是由这些“享乐主义”神经元连接形成的复杂系统产生的。


    在克劳夫之前的一代人，也就是从20世纪40年代到60年代的控制论运动，是基于所谓的“负反馈”来构建智能行为。他们认为，生物的驱动力主要是维持自体稳态或平衡。它们努力保持舒适的体温，吃东西充饥，交配以排解性欲，睡眠以消除疲劳。一切似乎都是为了回到平衡。


    1943年的控制论开创性论文《行为、目的和目的论》区分了有目的和无目的（或随机）的行为。 ^([^(270)](#fn270))


    克劳夫不认同生物的驱动力主要是维持自体平衡的观点。他认为，生物体是**最大化者**，而不是最小化者。在任何意义上，生命都是生长、繁殖，是无穷无尽和永不满足的前进。在克劳夫看来，生命的目标根本不是自体平衡，而是相反。“生物适应系统的主要目标是寻求一个最大状态（异体平衡），而不是……稳态（自体平衡）。”他还以一种极富诗意的方式提倡正反馈而不是负反馈：“正反馈和负反馈对生命过程都必不可少。但是，正反馈占主导，它提供了‘生命的火花’。”从单细胞到有机体再到社会，正反馈无处不在。克劳夫对于他提出的这个观念的意义毫不谦虚。“这似乎是第一个能够提供统一框架的理论，在这个框架内，生物适应系统的神经生理学、心理学和社会学特性都能得到解释，”他写道，“神经元、神经系统和国家都是异体平衡。”
    ^([^(271)](#fn271))


    **神经元**是贪得无厌的最大化者？这能解释**国家**行为？这个想法雄心勃勃，但也很不正统，甚至可能很荒谬。空军给了他资金，让他寻找研究人员或组建实验室进行研究。他在马萨诸塞大学阿默斯特校区组建了团队，聘请了一位名叫安德鲁·巴图（Andrew Barto）的博士后研究员，来研究这个想法——如巴图所说——“是一个疯狂的、不切实际的想法，还是有一些科学价值？”
    ^([^(272)](#fn272))


    与此同时，克劳夫还同斯坦福大学一名心理学本科生保持联系。在巴图加入时，克劳夫撺掇他：“有个非常聪明的孩子，你应该让他加入。” ^([^(273)](#fn273))


    我问巴图对后来的事情是否有所预知。“我们不知道。”他告诉我。桑顿和巴图将在克劳夫的空军基金资助下，开始为期45年的合作，并开创一个新的领域。这一领域涉及神经科学、行为主义心理学、工程学和数学，被称为“强化学习”；他们的名字——“巴图和桑顿”“桑顿和巴图”——将永远与他们共同撰写的AI领域权威教科书联系在一起，几乎成了强化学习领域本身的代名词。
    ^([^(274)](#fn274))


    我在马萨诸塞大学校园里见到了巴图，他已经退休。“幸福地退休了，”他说。“坦率说，很高兴摆脱了关于AI和强化的鼓吹和狂热的漩涡。”


    我告诉他，我很兴奋能听他谈论强化学习（通常简记为“RL”）的发展史，尤其是它对安全、决策和人类认知的影响，他打断了我。


    “你有多少时间？”


    我告诉他，一天。的确要这么久。


    ## 奖励假说


    巴图和桑顿基于克劳夫的生物是最大化者的思想，给出了具体的数学表示。假设你处于一个提供数值奖励的环境中，如果你采取某些行动并达到一定的状态，就能得到这些奖励。你的任务是尽可能获得最多奖励——最高“分数”。


    例如环境可以是迷宫，行为可以是向北、向南、向东或向西移动，到达出口就能获得奖励（也许超时会有惩罚）。环境也可以是棋盘，行为是移动棋子，将死对手可以奖励一分（和棋得半分）。环境也可以是股市，行为是买入卖出，奖励以你投资组合的价值来衡量。环境还可以是国家经济，行为可能是颁布立法或外交手段，奖励可能是长期的GDP增长。对环境的复杂性没什么限制，只要求奖励是一个**标量**，就像可互换的共同货币。


    事实证明，强化学习框架是如此普适，以至于产生了一个“奖励假说”：“我们平时所说的目标和目的**都**可以视为获得的标量奖励的累积总和最大化。” ^([^(275)](#fn275))


    “这差不多是哲学了，”桑顿说，“但很有些道理。” ^([^(276)](#fn276))


    当然，并不是所有人都同意这个前提。在体育、下棋、电子游戏和金融中，可能确实存在这样的标量，一种用来衡量所有结果的单一货币（字面意义或比喻）。但这真的能适用于复杂多变的动物甚至人类吗？我们做出决定产生的后果经常是有得有失。加班到深夜可能会让老板高看我们一眼，但是会考验爱人的耐心。我们是更看重人生成就、冒险经历还是人际关系或心智成长？例如，牛津大学哲学家张美露（Ruth Chang）几十年来一直在论证，人类境况最典型的一面就是我们拥有的各种动机和目标的**不可比较性**。我们**不能**简单地将主要的生活选择放在天平上，权衡哪一个最合适，否则就只有纯粹理性，无所谓道德，也没有机会创造意义和塑造个性。
    ^([^(277)](#fn277))


    桑顿自己也承认，奖励假说“可能最终是错误的，但它是如此简单，我们必须先推翻它再去考虑其他更复杂的”。


    即使暂且接受奖励最大化和标量奖励可比性的框架，要成为异体平衡最大化者也不是那么容易。事实上，强化学习在哲学和数学上都带来了诸多挑战。


    第一个挑战是，我们的决定**是相互关联的**。对于这一点，强化学习与无监督学习（用于构建第1章探讨的向量词表示）和监督学习（用于ImageNet竞赛、人脸识别、再犯风险评估等问题）存在微妙但重要的差异。在这些背景下，每个决定相互独立。给系统输入一张图片，比如说鸡油菌，并要求对其分类。系统给出的答案可能正确也可能错误，如果错了参数可能会微调，但无论对错，你只需从图库随机抽取下一张图片，然后继续。这种输入数据被统计学家称为“i.i.d”：独立同分布。我们所看到的和所做的与接下来看到的没有因果关联。


    在强化学习中——迷宫、下棋，甚至人生——我们没有在真空中做决定的奢侈。我们做出的每个决定都给下一个决定设定了背景。事实上，它可能会**永久**改变背景。以某种走法挪动棋子，会对可能出现的棋局和未来可选的策略施加强约束。在一个虚拟或真实的空间中，运动的固有特征决定了，我们采取的行动，无论是在迷宫中向北移动，回家陪爱人，还是到佛罗里达过冬，会塑造我们在未来得到的输入，可能是暂时的，也可能是永久的。如果下象棋时弃后，在剩下的棋局中就不能再使用它。如果从屋顶跳下去，可能会再也没有机会跳。如果对某人不友善，可能会永远改变那个人对我们的行为，我们可能永远无法知道，如果当初友善一点，他会怎么做。


    强化学习的第二个挑战是，由于奖励是标量，与监督和非监督学习相比，环境给出的奖惩很**简略**。猜测缺失词的语言模型在训练过程中每次猜测后，会被告知正确的词，对图像分类的模型会被立即给予“正确”的标签。然后，它们可以肯定地向正确答案的方向进行调整。相比之下，强化学习系统，在某种环境下尽力最大化某个数值，在结束时会知道自己的成绩，但无论输赢，它可能永远无法知道“正确的”或“最好的”行动是什么。当火箭爆炸，桥梁垮塌，或者搬运的一叠盘子倒了，踢的球没进网，世界给出的结果非常清楚。但到底哪些步骤做得不对，很难说清楚。


    正如巴图说的，强化学习与其说是跟随**老师**学习，不如说是跟**评论家**学习。 ^([^(278)](#fn278))


    强化学习的第三个挑战是，反馈不仅简略且不具建设性，还有延迟。例如，我们可能会在开局后第5步就犯了无法挽回的错误，导致100步后被将死。当人们经历失败或挫折时，无论是失望的父母、破产企业主或是被捕的小偷，一般都会想“我是哪里做错了？”这在强化学习中被称为“信用分配问题”，半个世纪以来一直困扰着研究者。例如，MIT的马文·明斯基在1961年的著名论文《走向人工智能的步骤》中写道：“在象棋和跳棋等复杂游戏中，或者在编写程序时，有明确的标准，赢还是输，成功还是失败。但在游戏过程中，最终的成败涉及大量决策。如果成功，我们如何将成功的信用分配到众多的决定？”


    明斯基解释道：“假设一个复杂的任务（比如下赢一盘棋）涉及100万个决定。我们是不是给参与完成任务的每个决定分配1/1000000分？” ^([^(279)](#fn279))


    如果在长途旅行几天后遭遇了车祸，我们不会追溯我们的行为一直到转动钥匙发车的时刻，然后想：“好吧，下次出门再也不**左拐**了！”但我们也不会认为，在棋局的第89步被将死后，错误**一定**发生在第88步。


    那么，我们如何才能从成功和失败中正确吸取教训呢？强化学习框架开始在学习和行为的基本问题上打开新视野，最终发展成为完备的领域，并在最近10年指导了AI的研究进程。而且正如克劳夫设想的，这反过来又给自然智能的研究带来了许多启发。


    ## 多巴胺之谜


    如果人类和动物可以被视为“异体平衡”奖励最大化者，那么这些奖励肯定是通过大脑的某种机制起作用。如果人类和动物真的存在某种用于最大化的单一标量“奖励”，会不会就是大脑中的某种化学物质或回路？20世纪50年代，蒙特利尔麦吉尔大学的两位研究人员，詹姆斯·奥尔兹（James Olds）和彼得·米尔纳（Peter Milner）似乎找到了它。


    奥尔兹和米尔纳在实验中将电极放在老鼠大脑的不同位置，并让老鼠有机会按压杠杆，杠杆会导致电极刺激大脑的特定区域。他们发现，大脑的一些区域似乎对老鼠的行为没有影响。在有些区域，老鼠似乎会**避免**杠杆被按下。但在一些区域，尤其是所谓的“隔区”，老鼠似乎很想按下杠杆，向该区域输送电流。老鼠会每小时按下操纵杆5000次，彻夜不休。
    ^([^(280)](#fn280))


    起初，这些区域被称为“强化结构”，但很快奥尔兹开始称之为“快感中枢”。 ^([^(281)](#fn281))


    随着时间推移，研究逐渐证实，大脑中电刺激快感最强的区域是产生名为3，4-二羟苯乙胺的神经递质的区域，这种神经递质有一个更耳熟能详的名字：多巴胺。 ^([^(282)](#fn282))


    这很像是“奖励标量”，就像记分牌上的分数，非常简单，但传播范围广，而且至关重要。多巴胺似乎也与成瘾物质密切相关，包括可卡因、海洛因和酒精。难道多巴胺真的是大脑中的奖励分子货币？


    20世纪70年代末的研究似乎也印证了这一点。例如，1978年的一项研究发现，如果让学习过按压杠杆获得食物的老鼠摄入多巴胺阻断药物匹莫齐特，它们对按压杠杆的兴趣并不比从未学习过食物关联的老鼠高。食物奖励似乎对摄入匹莫齐特的老鼠没有影响。研究人员写道，匹莫齐特“似乎选择性地减弱了食物和享乐性刺激的奖励效应”。
    ^([^(283)](#fn283))


    20世纪80年代，电生理学发展到了可以实时监测单个多巴胺神经元的水平。在瑞士弗里堡的实验室里，德国神经生理学家沃尔夫拉姆·舒尔茨（Wolfram Schultz）研究了猴子的多巴胺神经元的行为。它们把手伸进盒子，里面有时是空的，有时装有小块水果或烘焙食品。果然，嘀的一声，“当猴子的手碰到食物时，产生了一阵冲击”。
    ^([^(284)](#fn284))


    但是有些奇怪的事情。


    在一些实验中，如果盒子里有食物，实验员会提供某种视觉或听觉线索，这种**线索**会引发多巴胺活动的激增。然后猴子会伸手去拿食物，舒尔茨继续监控读数——什么也没发生。就像平常的活动基线一样，没有尖峰。他写道，多巴胺神经元“对（线索）起反应，释放出一阵冲动，但在触碰到食物时完全没反应”。
    ^([^(285)](#fn285))


    这到底是怎么回事？


    “我们搞不清是怎么回事。”舒尔茨说。 ^([^(286)](#fn286))


    在20世纪80年代末90年代初，舒尔茨和合作者试图为他们看到的现象寻找合理解释。 ^([^(287)](#fn287))


    舒尔茨告诉我：“我们无法把它归因于某件事。一开始把它归因于激励，动机，作为对刺激的反应驱使你前进……我们最初是这么想的，但后来发现这个概念太模糊。”实验室同事开始认同一个观点，即它与惊喜或出乎预期有关。心理学中有个观念，叫做雷斯科拉——瓦格纳模型，认为学习的关键在于惊喜。
    ^([^(288)](#fn288))


    舒尔茨还观察到了另一个现象，比第一个更神秘的现象。他当时正在做后续研究，使用了类似的装置，但这次用的是杠杆和果汁，而不是盒子和食物。等猴子习得线索可靠地意味着果汁后，舒尔茨尝试了一些新东西：给出一个假警报。他触发了提示；和往常一样，猴子的多巴胺活性激增，高于神经元平常的基线。猴子按下杠杆，没有果汁。猴子的多巴胺神经元短暂但明确地陷入**静默**。“然后我说，**好吧。这与惊喜相反**。”
    ^([^(289)](#fn289))


    多巴胺是个谜。起初，它似乎很明显是大脑的奖励货币，它显然在测量**什么**。如果不是奖励，不是注意力，不是新奇，也不是惊喜，那到底是**什么**？


    ## 策略和价值函数


    很难聪明到一分钟内都骗不倒你。


    ——雷欧·斯泰因（Leo Stein） ^([^(290)](#fn290))


    20世纪80年代，在舒尔茨开始多巴胺实验的同一时期，在大西洋的另一边，巴图和桑顿开始在强化学习问题上取得数学进展。


    第一步是分解问题。他们意识到，学习如何在环境中采取行动以最大化奖励，涉及两个相关但相对独立的子问题：行动和评估。当你开始理解并最终掌握一个领域时，你学到了两件重要的事情：如何根据给定情形采取正确行动，以及如何估计一种情势可能带来的未来奖惩。正如巴图和桑顿意识到的，分析棋局的棋手有**两种**不同的预感。她有一种本能，知道下一步该怎么走（以及对手可能会如何应对）。她还有另一种本能，那就是这种棋局哪方可能会赢。强化学习问题的这两个方面也就是所谓的**策略函数**（什么时候做什么）和**价值函数**（预期的奖惩）。


    从理论上来说，这两者各自都足以解决问题。如果棋手**总是**知道正确走法，那么即使不擅长预测谁会赢也没关系。反过来说，如果棋手**总是**知道特定棋局谁更占优，那么就算不确定该怎么走也没关系。只要有足够时间，可以权衡每一步的后果，然后选择最有希望的走法。


    基于策略的方法得到的系统具有高度训练的“肌肉记忆”，无论是动物、人还是机器，可以立即执行正确行为。相对的，基于价值的方法得到的系统具有高度训练的“蜘蛛感知”，可以迅速判断情势是不利还是有利。两者中的任何一个，如果充分发展，都够用。


    然而，在实践中，基于策略的方法和基于价值的方法可以并行。巴图和桑顿提出了一种称为“演员——评论家”架构的想法，在这种架构中，系统的一半是“演员”，学习采取好的行动，另一半是“评论家”，学习预测未来的收益。
    ^([^(291)](#fn291))


    早在1978年，桑顿就着迷于构造——如他的本科论文标题所写——“一个统一的期望理论”， ^([^(292)](#fn292))


    根据桑顿的推理，发展好的期望——好的价值函数——意味着将你每一步的期望与最终真正的裁决相协调：游戏的最终比分、季度报告、成功登月、职业生涯后期同行的钦佩赞许、起立鼓掌、孙子们的开心。但是，如果你**真的**不得不等到游戏结束再从中学习，那么信用分配问题实际上不可能解决。他说，有三重逻辑。


    首先，**记住**我们想过和做过的每一件事可能是不可行或不可能的。在一场惨败的足球赛结束时，我们真的会聚集在更衣室，复盘比赛中每一个动作吗？复盘我们希望和恐惧的每一次转变？


    第二，我们希望即使没有最终裁决也能学习。一局在结束前被打断的象棋应该也能学到一些**东西**。如果我们即将被将死，或者感觉已毫无胜算，这仍然意味着我们需要改进，不管预期的损失或惩罚是否真的到来。同样，如果一场比赛因为反常、不可思议、不可预见的事件在最后几秒钟被翻盘，也并不一定意味着我们之前的预期是错的。也许我们之前确实走在胜利的轨道上。完全根据最终结果来判断不一定有意义，尤其是在某种程度上情势是出于偶然。


    第三，理想情况下，我们不仅想在事后学习，也想**在前进的过程中**学习。这对我们的人生尤为重要。对于许多最关键的时刻和最重要的目标，比如上大学、抚养孩子或安逸地退休，我们通常只有一次机会。但还有许多错误，例如成绩退步、腰围变粗、关系闹僵，会让我们意识到事情正在偏离正轨，并在还来得及的时候进行调整。如果我们是通过试错学习，那么幸运的是，我们不需要做完整个尝试，也不需要犯完**整个**错误才能学习。


    正如桑顿解释的，这里每个因素都让期望理论变得更棘手。“我们可以忽略所有这些事情，把它们视为麻烦，但我认为它们是线索，”他说，“这些都是大自然给我们的提示，告诉我们该如何前进”。
    ^([^(293)](#fn293))


    事实证明，桑顿自己首先领会了这些提示。


    桑顿在思考预测方面的突破是这样的。当面对不确定的未来时，你保持着一种对事情看起来有多少希望的“运行时期望”。在象棋中，这可能是你评估自己赢棋的概率。在电子游戏中，这可能是你预期自己能打到哪一关，或者你预期的总分。预测会随时间变化，总的来说，随着越来越接近你试图预测的东西，预测会越来越准确。（周四对周末的天气预报几乎总是比周一更准。你从机场坐车回家的预计到达时间会随着你离家越近而越准确。）这意味着，随着预期产生变化，相继的预期之间会有差异，每个差异都是一次学习的机会。桑顿称这些为**时序差分**，或**TD误差**。一旦出现时序差分，更靠后的那个预期通常更准确。

