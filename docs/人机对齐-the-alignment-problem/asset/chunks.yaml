    ——爱迪生 ^([^(332)](#fn332))


    “试错法”这个短语可能是苏格兰哲学家亚历山大·贝恩（Alexander Bain）在1855年创造的，用来描述人类和动物是如何学习。 ^([^(333)](#fn333))


    从最基本的角度来说，强化学习是通过试错学习，这种试错（也可以说是探索）最简单的算法形式是所谓的“ε-贪婪”（厄普西隆——贪婪）算法。希腊字母ε在数学上常用来表示“一点点”，ε-贪婪的意思就是“贪婪，除了一点点时间外”。一个按照ε-贪婪运行的自主体，大部分时间——比如说，99%——会根据到目前为止的有限经验，采取它认为能带来最大收益的行动。但是偶尔——例如，1%-会完全随机地尝试一些东西。比方说，在雅达利游戏中，偶尔随机敲击按钮，看看会发生什么。
    ^([^(334)](#fn334))


    如何用这种探索行为学习，有许多不同的风格，但基本想法是相同的——反复学习，多做让你得到奖励的事情，少做让你受惩罚的事情。你可以尝试显式地理解世界是如何运作的（“基于模型的”强化学习），或者打磨你的直觉（“无模型的”强化学习）来做到这一点。你也可以通过学习某种状态或行为能带来**多少收益**来做到这一点（“价值”学习），或者只需知道哪些策略总体上做得更好（“策略”学习）。不管怎样，几乎所有方法都是基于这样一个想法：首先偶然成功，然后倾向于去做更多看起来有效的事情。


    事实证明，有些任务比其他任务更适用这种方法。


    例如，在像《太空入侵者》这样的游戏中，成群的敌人向你扑来，你所能做的就是左移、右移和射击。随机敲击按钮可能有机会干掉几个游戏角色，每个角色都值几分，这些初步的分数就可以用来启动学习过程，通过学习，某些行为模式得到加强，更好的策略得到发展。例如，你可能会发现，只有射击才会得分，所以你会更频繁地射击，得分也会更多。这类游戏一般都有“密集”的奖励，从而相对容易学习。


    在其他游戏中，比如国际象棋，奖励不是那么立竿见影，但它们仍然是确定的。一盘棋要么输要么赢要么和棋，一般几十步，几乎不可能下到几百步。即使你对策略一无所知，只会在棋盘上随意摆弄，至少你很快就会知道你是赢了、输了还是和棋。


    然而，在许多情况下，获得**任何收益**都是奇迹。斯金纳就有亲身体会，他在奖励鸽子在迷你保龄球馆击球时发现了这一点。鸽子不知道它面对的是什么游戏，可能需要**几年**时间才能做出正确行为。当然，它（和斯金纳）在那之前早就饿死了。


    机械学习者也是如此。例如，让人形机器人将足球踢进网，可能需要对几十个关节施加成千上万次精确的扭矩，所有这些都必须完美协调。很难想象机器人**随意转**动几十个关节能直立起来，与球进行有意义的接触更难，更不要说将球送入网。


    强化学习研究人员称这个为**稀疏奖励**问题，或者更简洁地称为**稀疏**问题。如果是根据最终目标或与最终目标相当接近的东西来给奖励，那么人们基本上只能等待，直到随机按按钮或动作产生预期的效果。数学可以证明，大多数强化学习算法最终都会实现，但实际上，可能在太阳毁灭后很久才会实现。如果你试图训练一个围棋程序来击败世界冠军，而世界冠军每次投子认输你都奖励它1分，否则就给0分，你将会等很长时间。


    稀疏问题还有安全隐患。如果你打算利用ε-贪婪强化学习开发一种能力极强的超智能AI，并且决定，如果它能治愈癌症，你就奖励它1分，如果它不能治愈癌症，得0分，那你得小心，因为在它得到第一个奖励之前，它将不得不做大量随机尝试。其中许多尝试都很笨拙。


    和布朗大学的迈克尔·利特曼（Michael Littman）聊天时，我问他，他对强化学习的研究对他教育子女有没有帮助。他立刻想到了稀疏问题。他曾和妻子开玩笑说要对儿子使用稀疏奖励：“这样怎么样？在他学会说中文前，我们不要给他东西吃。那会是很好的激励手段！我们看看这行不行得通！”利特曼笑了。“我妻子头脑非常清醒……她说：‘不，我们不玩这个游戏。’”
    ^([^(335)](#fn335))


    同斯金纳一样，利特曼当然知道不能那样做。事实上，稀疏问题已经促使强化学习研究者去追溯斯金纳的时代，他们相当直接地借鉴了他的建议。 ^([^(336)](#fn336))


    **课程的重要性**


    为了获得复杂行为，可能先要策略性地奖励**简单**行为。塑造的这个关键见解既适用于动物，也适用于人类。“先学会走，再学会跑。”这句谚语不仅在字面意义上是对的，还刻画了人类经验的诸多方面。


    这是人类生活的一个显著特征，在生命最初的十几年里依靠文字和比喻的辅助穿行于世界，就像在文字和比喻组成的球道护栏里练习保龄球。许多动物被直接抛进残酷的生活：野生动物出生几小时就必须准备好全速奔跑以逃避捕食者。相比之下，我们至少要到十几岁时才能操作重型机械，等我们彻底自立时，甚至已经过了**身体的黄金年龄**。


    将21世纪的人类与其穴居祖先区分开来的不是智力天赋，而是精心设计的**课程**。事实上，斯金纳认为我们不应草率对动物的智力下结论。就像人类一样，通过学习正确的课程，动物也可以习得惊人的能力，超越我们对它们的认知。


    正如斯金纳说的，如果实验员只在旁边干等，等到出现复杂的行为，才去强化行为，那将很难检验动物“能不能”做到。


    考验的是实验者而不是动物的能力。断言某个物种或年龄的动物不能解决问题是靠不住的。通过精心安排的课程，鸽子、老鼠和猴子在过去5年里做到了这个物种从未做到的事情。并不是说它们的祖先做不到，而是大自然从来没给出过有效的课程。
    ^([^(337)](#fn337))


    人类生活的世界在很大程度上已被改造成了“有效的课程”，虽然很难意识到这一点。在某种程度上，我们认为有绳索让我们顺利登船是“自然的”，其实不然，自然本来没有教程。


    实际上，人类世界被精心设计成适合学习。例如电子游戏，伟大的游戏之所以伟大，部分在于它们“塑造”了我们玩游戏的方式。任天堂1985年发布了《超级马里奥》，是有史以来最著名的电子游戏之一。你可能很难回想起第一次玩的经历，但仔细观察游戏的前10秒就会发现它是精心设计的，它在教你玩。你首先会遇到右边走过来的蘑菇仔，如果什么都不做，你会死。游戏设计师宫本茂已成为传奇人物，他说：“你得以自然的方式告诉玩家，他们需要跳起来躲开。”
    ^([^(338)](#fn338))


    但是宫本茂遇到一个问题，也有**好**蘑菇，你得学会不要躲开，要靠上去。“这让我们很头痛，”宫本茂解释道，“得用某种方式确保玩家明白这是好东西。”该怎么做？在好蘑菇滑向你的地方，没有足够的空间让你跳过它。你只能接受冲击，但它没有杀死你，反而让你变大。游戏的机制就这样建立了，现在你学会了。你认为你只是在玩，其实你正在被精心地，准确地，不露声色地**训练**。你学习规则，然后学习例外。掌握了基本的机制，就可以自由发挥了。


    通过逐步逼近灌输复杂行为，这个塑造原则适用于斯金纳的鸽子，也适用于人类。对此我们或许不会感到惊讶。如果我们发现塑造原则同样适用于机器，或许也不应惊讶。


    当然，自从机器学习诞生以来，人们就知道，问题、环境和游戏有难易之分。但是后来人们才逐渐认识到，接受过简单问题训练的系统，可能比没有训练过的系统更能学习复杂问题。
    ^([^(339)](#fn339))


    20世纪80年代，桑顿和巴图与同事奥利弗·塞尔弗里奇（Oliver Selfridge）合作，利用强化学习来训练一辆模拟的轮式推车，要控制推车让车上直立的长杆不翻倒。杆子越长越重，就越容易保持直立，就像立在手上的棒球棒比尺子更容易保持平衡一样。他们发现，如果先用又长又重的杆子训练，**然后**换成又短又轻的杆子，那么总的训练次数会比一开始就用又短又轻的杆子少很多。
    ^([^(340)](#fn340))


    研究人员在其他背景下也一再发现同样的情况。例如，加州大学圣地亚哥分校的语言学家杰弗里·埃尔曼（Jeffrey Elman）在20世纪90年代初尝试用神经网络来预测句子中的下一个词。令人沮丧的是，最初的几次尝试都失败了。“简单地说，”他说，“如果一开始就用完整的‘成人’语言进行训练，网络无法学习复杂语法。但是，如果先用简单语句训练，网络不仅能成功掌握这些语句，还接着掌握了复杂语句。”
    ^([^(341)](#fn341))


    “这个结果令人鼓舞，”埃尔曼说，“因为网络的行为有些类似儿童的行为。儿童并不是一开始就能掌握复杂的成人语句，而是从最简单的结构开始，逐步构建，直到达到成人水平。”


    这两个例子都是试图直接学习更难的问题，但做不到，借助课程，先学习容易的问题，再学习更难的，从而取得了成功。


    在动物行为公司，在训练猪将木制大硬币放进“存钱罐”的过程中，凯勒和玛丽安认识到了良好的课程的重要性。他们先是将硬币放在存钱罐旁边，渐渐地，让硬币离存钱罐越来越远，离猪也越来越远。
    ^([^(342)](#fn342))


    最近，机器学习也利用了这种“回溯”法。2017年，加州大学伯克利分校的一组机器人专家想训练机器人用手臂将垫圈套到长螺栓上。等待机器人以某种方式偶然发现这种行为需要很长时间。但是从垫圈已经在螺栓上开始，先教机器人把垫圈往下推最后一截。然后，将垫圈放在螺栓正上方，机器人可以学会顺着螺栓滑下去。然后，让垫圈在螺栓**附近并且角度**合适，机器人也可以学会将垫圈套上去。他们最终回溯到垫圈在任何位置任何角度，机器人都能灵巧地旋转和安装它。
    ^([^(343)](#fn343))


    同游戏设计专家一样，传奇国际象棋冠军鲍比·费舍尔（Bobby Fischer）在《跟费舍尔学棋》中也使用了类似的策略。这本书针对初学者，先给出几十个一步就可以将死的棋局，然后是两步将死，然后是要用不同棋子配合三四步将死。在续册才讲中局、开局和长期策略。在第一本书中费舍尔专注于教新手抓住获胜的机会。事实证明，这个课程非常成功：直到今天仍有许多大师认为它是完美的入门书，
    ^([^(344)](#fn344))


    既然课程如此重要，一个自然而然的想法是，能否将一门好的、适合学习的课程的构建**本身**视为一个机器学习问题，并探索课程设计过程的自动化。最近的研究在探索自动识别适当难度的任务，以及能最高效促进神经网络学习的例子。这方面的初步结果很有希望，工作正在进行中。
    ^([^(345)](#fn345))


    自动化课程设计最精彩的成就可能是DeepMind主宰了棋类游戏的AlphaGo及其后继AlphaGo Zero和AlphaZero。首席研究员大卫·西尔弗（David Silver）解释说：“AlphaGo总是有水平相当的对手。
    ^([^(346)](#fn346))


    答案很简单也很优雅，事后看来，也很理所当然。它是与自己对弈。


    **微妙的激励**


    无论是与猴子、老鼠还是人类打交道，我们都可以肯定，大多数动物都在寻找关于哪些活动能得到奖励的线索，然后试图做（或至少假装做）那些事情，并排除那些没有得到奖励的活动。


    ——史蒂夫·克尔（Steve Kerr） ^([^(347)](#fn347))


    如果奖励制度这样设计，以至于遵守道德是不划算的，虽然这并不一定会产生不道德行为。但这不是自找麻烦吗？


    ——史蒂夫·克尔 ^([^(348)](#fn348))


    这是奖励系统，笨蛋！


    ——管理学会执行委员会编辑 ^([^(349)](#fn349))


    前面介绍的克服稀疏问题的方法是使用“课程”，并从问题的简化版开始。还有一种方法则是直接从问题的完整版开始，与此同时增加奖励，为学习者指明正确方向或鼓励与成功相关的行为。这种奖励被称为“伪奖励”或“塑造奖励”，也可以简单将其视为激励。


    斯金纳在鸽子看向和接近球时会给一点食物奖励，因为这些是在他希望的击球之前必需的动作，同样的想法也适用于机器学习。例如，扫地机器人的“真正”目标可能是房子一尘不染，但你可以在它每扫除一点灰尘时给予奖励；无人机的最终目的可能是到达某个位置，但你可以在它朝正确方向前进时给它一点奖励。


    这通常有助于让系统感觉到是“更热”还是“更冷”：它是否总体上在以正确方式运行，并朝着正确方向改变它的行为。否则的话它就只能随机乱动，直到完全依靠运气完成目标。


    我们通常会将任务分解成一系列步骤，这样在心理上更容易保持动力。想象几年后才能完成的博士论文或书稿很难让你评估某一天的工作质量。想象我们希望下一年能减掉的体重，会让某个蛋糕或过量食物的成本和收益被摊平。作为父母、老师或教练，我们知道适时击掌喝彩以鼓励学习者坚持艰苦的练习，即使熟练掌握还遥不可及。


    当然，任何对人性稍有了解，或是对自我有认识的人，都知道激励是在走钢丝。激励的设计必须非常谨慎，否则就会惹麻烦。 ^([^(350)](#fn350))


    克尔对激励机制出错的分析已成为管理科学的里程碑，他职业生涯的大部分时间都在与通用电气和高盛等企业合作，研究如何更审慎地设计激励机制。令人惊讶的是，当被问及灵感来自哪里时，克尔同时引用了机器学习和斯金纳。“通过编程，机器可以学习，弈棋程序不会犯两次相同的错误，这一事实对我非常有吸引力，”克尔说，“我立刻对一种可能性产生了兴趣，那就是机器可能会成为比程序员自身更好的棋手”！
    ^([^(351)](#fn351))


    克尔还承认：“至于那篇‘愚蠢’文章，很明显，斯金纳比我先到‘那里’。我没见过还有别人说过。我记得斯金纳写过，如果老鼠不会做他想要它做的事，他会呵斥老鼠‘你为什么不做？’如果斯金纳知道人们没有读过他的作品就读我的文章，他可能会在棺材里坐起来。很明显，斯金纳已经做了这项工作，但我把它包装成了适合商业应用。‘责备老鼠’是一堂很好的学习课。‘愚蠢’的真正含义在于它并不总是员工的错，管理层对太多的员工能力障碍负有责任。”


    事实上，在斯金纳看来，人们几乎永远不应责怪老鼠（或员工）。他认为，我们的行为几乎完全取决于激励和收益。有记者曾在电视上问斯金纳：“自由意志还有位置吗？”斯金纳回答说：“它还有虚构的位置。”
    ^([^(352)](#fn352))


    抛开自由意志的争论不谈，激励问题的影响不仅仅限于动物心理学和公司管理；事实上，体现得最淋漓尽致的是那些无情的和极具创造性的收益最大化者，我们称之为**孩子**。


    多伦多大学的经济学家约书亚·甘斯（Joshua Gans）想让女儿帮忙，训练弟弟上厕所。所以他做了任何优秀的经济学家都会做的事情。他给了她一个激励。每帮弟弟上一次厕所，都可以得到一块糖果。女儿很快发现了她的经济学家父亲的漏洞。“我发现喝得越多拉得越多，”她说，“所以我不断给弟弟喝水。”甘斯证实：“效果并不太好。”
    ^([^(353)](#fn353))


    普林斯顿认知科学家汤姆·格里菲思（Tom Griffiths）在自己女儿身上也发现了类似的现象。“她真的很喜欢打扫，”他告诉我，“她对此很感兴趣。我们给她买了小扫帚和撮箕。你知道，地上有一些薯片，她拿起扫帚和撮箕，把它们打扫干净，我对她说，‘哇！干得漂亮！扫得真好！太棒了！’”
    ^([^(354)](#fn354))


    通过适当的表扬，格里菲思成功培养了女儿的动作技能，还获得了保持清洁的好处：在养育上一举两得。真是这样吗？他女儿几秒钟就找到了漏洞。


    “她抬头看着我们，笑了，然后把薯片从撮箕里倒回地板上，再次打扫，试图获得更多表扬。”


    格里菲思的研究方向是心理学与机器学习的融合，这件事让他很受启发。“这让我想到了在构建奖励驱动的AI系统时遇到的一些挑战，在这些系统中，你必须非常仔细地考虑如何设计奖励函数。”


    格里菲思从养育子女的角度来思考强化学习。“作为父母，你在为你的孩子设计奖励函数，对吗？无论是你的表扬还是你给的反馈。没有人认真思考‘你该为你的孩子提供怎样的明确奖励函数？’”


    格里菲思认为子女养育也蕴含了对齐问题。他指出，人类文明故事的一条主线就是关于如何向奇怪的、陌生的、人类水平的智慧生物灌输价值观，这些将从我们手中接管社会的智慧生物也就是我们的孩子。而且这种相似之处甚至更深，对AI和子女养育的仔细分析表明，两者在很大程度上能相互启发。


    孩子的智慧可能不如我们，但即使是幼儿，也能打败我们的规则和激励措施，部分原因是他们**渴望**这样做。就强化学习系统而言，它们是奖励的奴隶；但是它们是拥有强大算力和不断试错的奴隶，无论我们设计怎样的激励，它们都会试图找到所有可能的漏洞。机器学习研究人员已经心酸地吸取了这一教训，他们也学会了一些应对技巧。


    **防止你的奖励绕圈：塑造定理**


    阿斯特罗·泰勒（Astro Teller），曾经是谷歌X实验室（Alphabet的前身）的“登月队长”，主管和督导了谷歌的自动驾驶（发展成了后来的Waymo）、增强现实项目谷歌眼镜和谷歌大脑项目。但是在1998年，他曾专注于一个不同的问题：足球。泰勒和他的朋友、同学大卫·安德烈（David Andre）开发了名为“达尔文联”的虚拟足球程序，准备参加一年一度的RoboCup机器人足球赛。
    ^([^(355)](#fn355))


    也是那一年，丹麦哥本哈根玻尔研究所的杰特·兰德尔夫（Jette Randløv）和普里本·阿尔斯特勒姆（Preben Alstrøm）尝试让强化学习系统骑模拟自行车。他们的系统面临的任务挺复杂，在朝远处目标前进的同时保持直立。这似乎是应用塑造奖励的完美场合。因为摇摆不定的系统不太可能随机抵达目的地，所以他们决定只要自行车向目标前进就给点奖励。


    令他们惊讶的是，“系统在起点周围半径20-50米的范围绕圈”。 ^([^(356)](#fn356))


    “掺杂多个成分的强化函数，”他们写道，“必须非常小心地设计。”


    20世纪90年代末，加州大学伯克利分校的斯图尔特·罗素（Stuart Russell）和他当时的博士生吴恩达（Andrew Ng，后来曾担任百度副总裁兼首席科学家）很关注这些警示故事。这种利用漏洞的绕圈似乎是一种难以避免的危险。
    ^([^(357)](#fn357))


    吴恩达雄心勃勃。他回忆道：“当我开始研究机器人时……我问了很多人，‘你认为最难的控制问题是什么？’当时，我最常听到的回答是‘让计算机驾驶直升机。’我说，‘那我来试试。’”
    ^([^(358)](#fn358))


    关键问题是：描述他们实际上想要直升机做什么的奖励函数就算能写出来也很难学习，他们能添加什么样的“伪奖励”激励，使得训练过程更容易，同时最大化修改后的奖励的最优解也是真正问题的最优解？用克尔的话说，他们奖励哪种A仍能得到希望的B？吴恩达描述道：


    一个很简单的额外奖励设定经常就能让原本棘手的问题变得简单。然而，奖励塑造的一个困难是，通过修改奖励函数，它将原来的问题M变成了某个新问题M′，并用算法求解M′，希望这样可以比原问题更容易或更快地找到答案。但并不总是很清楚，为修改后的问题M′找到的解或策略是否也适用于原问题M。
    ^([^(359)](#fn359))


    “我们在给定奖励函数时有多少自由度，”吴恩达写道，“能让最优策略保持不变？” ^([^(360)](#fn360))'
  fmt: '

    还有更好的方法……找出来！


    ——爱迪生 ^([^(332)](#fn332))


    “试错法”这个短语可能是苏格兰哲学家亚历山大·贝恩（Alexander Bain）在1855年创造的，用来描述人类和动物是如何学习。 ^([^(333)](#fn333))


    从最基本的角度来说，强化学习是通过试错学习，这种试错（也可以说是探索）最简单的算法形式是所谓的“ε-贪婪”（厄普西隆——贪婪）算法。希腊字母ε在数学上常用来表示“一点点”，ε-贪婪的意思就是“贪婪，除了一点点时间外”。一个按照ε-贪婪运行的自主体，大部分时间——比如说，99%——会根据到目前为止的有限经验，采取它认为能带来最大收益的行动。但是偶尔——例如，1%-会完全随机地尝试一些东西。比方说，在雅达利游戏中，偶尔随机敲击按钮，看看会发生什么。
    ^([^(334)](#fn334))


    如何用这种探索行为学习，有许多不同的风格，但基本想法是相同的——反复学习，多做让你得到奖励的事情，少做让你受惩罚的事情。你可以尝试显式地理解世界是如何运作的（“基于模型的”强化学习），或者打磨你的直觉（“无模型的”强化学习）来做到这一点。你也可以通过学习某种状态或行为能带来**多少收益**来做到这一点（“价值”学习），或者只需知道哪些策略总体上做得更好（“策略”学习）。不管怎样，几乎所有方法都是基于这样一个想法：首先偶然成功，然后倾向于去做更多看起来有效的事情。


    事实证明，有些任务比其他任务更适用这种方法。


    例如，在像《太空入侵者》这样的游戏中，成群的敌人向你扑来，你所能做的就是左移、右移和射击。随机敲击按钮可能有机会干掉几个游戏角色，每个角色都值几分，这些初步的分数就可以用来启动学习过程，通过学习，某些行为模式得到加强，更好的策略得到发展。例如，你可能会发现，只有射击才会得分，所以你会更频繁地射击，得分也会更多。这类游戏一般都有“密集”的奖励，从而相对容易学习。


    在其他游戏中，比如国际象棋，奖励不是那么立竿见影，但它们仍然是确定的。一盘棋要么输要么赢要么和棋，一般几十步，几乎不可能下到几百步。即使你对策略一无所知，只会在棋盘上随意摆弄，至少你很快就会知道你是赢了、输了还是和棋。


    然而，在许多情况下，获得**任何收益**都是奇迹。斯金纳就有亲身体会，他在奖励鸽子在迷你保龄球馆击球时发现了这一点。鸽子不知道它面对的是什么游戏，可能需要**几年**时间才能做出正确行为。当然，它（和斯金纳）在那之前早就饿死了。


    机械学习者也是如此。例如，让人形机器人将足球踢进网，可能需要对几十个关节施加成千上万次精确的扭矩，所有这些都必须完美协调。很难想象机器人**随意转**动几十个关节能直立起来，与球进行有意义的接触更难，更不要说将球送入网。


    强化学习研究人员称这个为**稀疏奖励**问题，或者更简洁地称为**稀疏**问题。如果是根据最终目标或与最终目标相当接近的东西来给奖励，那么人们基本上只能等待，直到随机按按钮或动作产生预期的效果。数学可以证明，大多数强化学习算法最终都会实现，但实际上，可能在太阳毁灭后很久才会实现。如果你试图训练一个围棋程序来击败世界冠军，而世界冠军每次投子认输你都奖励它1分，否则就给0分，你将会等很长时间。


    稀疏问题还有安全隐患。如果你打算利用ε-贪婪强化学习开发一种能力极强的超智能AI，并且决定，如果它能治愈癌症，你就奖励它1分，如果它不能治愈癌症，得0分，那你得小心，因为在它得到第一个奖励之前，它将不得不做大量随机尝试。其中许多尝试都很笨拙。


    和布朗大学的迈克尔·利特曼（Michael Littman）聊天时，我问他，他对强化学习的研究对他教育子女有没有帮助。他立刻想到了稀疏问题。他曾和妻子开玩笑说要对儿子使用稀疏奖励：“这样怎么样？在他学会说中文前，我们不要给他东西吃。那会是很好的激励手段！我们看看这行不行得通！”利特曼笑了。“我妻子头脑非常清醒……她说：‘不，我们不玩这个游戏。’”
    ^([^(335)](#fn335))


    同斯金纳一样，利特曼当然知道不能那样做。事实上，稀疏问题已经促使强化学习研究者去追溯斯金纳的时代，他们相当直接地借鉴了他的建议。 ^([^(336)](#fn336))


    ## 课程的重要性


    为了获得复杂行为，可能先要策略性地奖励**简单**行为。塑造的这个关键见解既适用于动物，也适用于人类。“先学会走，再学会跑。”这句谚语不仅在字面意义上是对的，还刻画了人类经验的诸多方面。


    这是人类生活的一个显著特征，在生命最初的十几年里依靠文字和比喻的辅助穿行于世界，就像在文字和比喻组成的球道护栏里练习保龄球。许多动物被直接抛进残酷的生活：野生动物出生几小时就必须准备好全速奔跑以逃避捕食者。相比之下，我们至少要到十几岁时才能操作重型机械，等我们彻底自立时，甚至已经过了**身体的黄金年龄**。


    将21世纪的人类与其穴居祖先区分开来的不是智力天赋，而是精心设计的**课程**。事实上，斯金纳认为我们不应草率对动物的智力下结论。就像人类一样，通过学习正确的课程，动物也可以习得惊人的能力，超越我们对它们的认知。


    正如斯金纳说的，如果实验员只在旁边干等，等到出现复杂的行为，才去强化行为，那将很难检验动物“能不能”做到。


    考验的是实验者而不是动物的能力。断言某个物种或年龄的动物不能解决问题是靠不住的。通过精心安排的课程，鸽子、老鼠和猴子在过去5年里做到了这个物种从未做到的事情。并不是说它们的祖先做不到，而是大自然从来没给出过有效的课程。
    ^([^(337)](#fn337))


    人类生活的世界在很大程度上已被改造成了“有效的课程”，虽然很难意识到这一点。在某种程度上，我们认为有绳索让我们顺利登船是“自然的”，其实不然，自然本来没有教程。


    实际上，人类世界被精心设计成适合学习。例如电子游戏，伟大的游戏之所以伟大，部分在于它们“塑造”了我们玩游戏的方式。任天堂1985年发布了《超级马里奥》，是有史以来最著名的电子游戏之一。你可能很难回想起第一次玩的经历，但仔细观察游戏的前10秒就会发现它是精心设计的，它在教你玩。你首先会遇到右边走过来的蘑菇仔，如果什么都不做，你会死。游戏设计师宫本茂已成为传奇人物，他说：“你得以自然的方式告诉玩家，他们需要跳起来躲开。”
    ^([^(338)](#fn338))


    但是宫本茂遇到一个问题，也有**好**蘑菇，你得学会不要躲开，要靠上去。“这让我们很头痛，”宫本茂解释道，“得用某种方式确保玩家明白这是好东西。”该怎么做？在好蘑菇滑向你的地方，没有足够的空间让你跳过它。你只能接受冲击，但它没有杀死你，反而让你变大。游戏的机制就这样建立了，现在你学会了。你认为你只是在玩，其实你正在被精心地，准确地，不露声色地**训练**。你学习规则，然后学习例外。掌握了基本的机制，就可以自由发挥了。


    通过逐步逼近灌输复杂行为，这个塑造原则适用于斯金纳的鸽子，也适用于人类。对此我们或许不会感到惊讶。如果我们发现塑造原则同样适用于机器，或许也不应惊讶。


    当然，自从机器学习诞生以来，人们就知道，问题、环境和游戏有难易之分。但是后来人们才逐渐认识到，接受过简单问题训练的系统，可能比没有训练过的系统更能学习复杂问题。
    ^([^(339)](#fn339))


    20世纪80年代，桑顿和巴图与同事奥利弗·塞尔弗里奇（Oliver Selfridge）合作，利用强化学习来训练一辆模拟的轮式推车，要控制推车让车上直立的长杆不翻倒。杆子越长越重，就越容易保持直立，就像立在手上的棒球棒比尺子更容易保持平衡一样。他们发现，如果先用又长又重的杆子训练，**然后**换成又短又轻的杆子，那么总的训练次数会比一开始就用又短又轻的杆子少很多。
    ^([^(340)](#fn340))


    研究人员在其他背景下也一再发现同样的情况。例如，加州大学圣地亚哥分校的语言学家杰弗里·埃尔曼（Jeffrey Elman）在20世纪90年代初尝试用神经网络来预测句子中的下一个词。令人沮丧的是，最初的几次尝试都失败了。“简单地说，”他说，“如果一开始就用完整的‘成人’语言进行训练，网络无法学习复杂语法。但是，如果先用简单语句训练，网络不仅能成功掌握这些语句，还接着掌握了复杂语句。”
    ^([^(341)](#fn341))


    “这个结果令人鼓舞，”埃尔曼说，“因为网络的行为有些类似儿童的行为。儿童并不是一开始就能掌握复杂的成人语句，而是从最简单的结构开始，逐步构建，直到达到成人水平。”


    这两个例子都是试图直接学习更难的问题，但做不到，借助课程，先学习容易的问题，再学习更难的，从而取得了成功。


    在动物行为公司，在训练猪将木制大硬币放进“存钱罐”的过程中，凯勒和玛丽安认识到了良好的课程的重要性。他们先是将硬币放在存钱罐旁边，渐渐地，让硬币离存钱罐越来越远，离猪也越来越远。
    ^([^(342)](#fn342))


    最近，机器学习也利用了这种“回溯”法。2017年，加州大学伯克利分校的一组机器人专家想训练机器人用手臂将垫圈套到长螺栓上。等待机器人以某种方式偶然发现这种行为需要很长时间。但是从垫圈已经在螺栓上开始，先教机器人把垫圈往下推最后一截。然后，将垫圈放在螺栓正上方，机器人可以学会顺着螺栓滑下去。然后，让垫圈在螺栓**附近并且角度**合适，机器人也可以学会将垫圈套上去。他们最终回溯到垫圈在任何位置任何角度，机器人都能灵巧地旋转和安装它。
    ^([^(343)](#fn343))


    同游戏设计专家一样，传奇国际象棋冠军鲍比·费舍尔（Bobby Fischer）在《跟费舍尔学棋》中也使用了类似的策略。这本书针对初学者，先给出几十个一步就可以将死的棋局，然后是两步将死，然后是要用不同棋子配合三四步将死。在续册才讲中局、开局和长期策略。在第一本书中费舍尔专注于教新手抓住获胜的机会。事实证明，这个课程非常成功：直到今天仍有许多大师认为它是完美的入门书，
    ^([^(344)](#fn344))


    既然课程如此重要，一个自然而然的想法是，能否将一门好的、适合学习的课程的构建**本身**视为一个机器学习问题，并探索课程设计过程的自动化。最近的研究在探索自动识别适当难度的任务，以及能最高效促进神经网络学习的例子。这方面的初步结果很有希望，工作正在进行中。
    ^([^(345)](#fn345))


    自动化课程设计最精彩的成就可能是DeepMind主宰了棋类游戏的AlphaGo及其后继AlphaGo Zero和AlphaZero。首席研究员大卫·西尔弗（David Silver）解释说：“AlphaGo总是有水平相当的对手。
    ^([^(346)](#fn346))


    答案很简单也很优雅，事后看来，也很理所当然。它是与自己对弈。


    ## 微妙的激励


    无论是与猴子、老鼠还是人类打交道，我们都可以肯定，大多数动物都在寻找关于哪些活动能得到奖励的线索，然后试图做（或至少假装做）那些事情，并排除那些没有得到奖励的活动。


    ——史蒂夫·克尔（Steve Kerr） ^([^(347)](#fn347))


    如果奖励制度这样设计，以至于遵守道德是不划算的，虽然这并不一定会产生不道德行为。但这不是自找麻烦吗？


    ——史蒂夫·克尔 ^([^(348)](#fn348))


    这是奖励系统，笨蛋！


    ——管理学会执行委员会编辑 ^([^(349)](#fn349))


    前面介绍的克服稀疏问题的方法是使用“课程”，并从问题的简化版开始。还有一种方法则是直接从问题的完整版开始，与此同时增加奖励，为学习者指明正确方向或鼓励与成功相关的行为。这种奖励被称为“伪奖励”或“塑造奖励”，也可以简单将其视为激励。


    斯金纳在鸽子看向和接近球时会给一点食物奖励，因为这些是在他希望的击球之前必需的动作，同样的想法也适用于机器学习。例如，扫地机器人的“真正”目标可能是房子一尘不染，但你可以在它每扫除一点灰尘时给予奖励；无人机的最终目的可能是到达某个位置，但你可以在它朝正确方向前进时给它一点奖励。


    这通常有助于让系统感觉到是“更热”还是“更冷”：它是否总体上在以正确方式运行，并朝着正确方向改变它的行为。否则的话它就只能随机乱动，直到完全依靠运气完成目标。


    我们通常会将任务分解成一系列步骤，这样在心理上更容易保持动力。想象几年后才能完成的博士论文或书稿很难让你评估某一天的工作质量。想象我们希望下一年能减掉的体重，会让某个蛋糕或过量食物的成本和收益被摊平。作为父母、老师或教练，我们知道适时击掌喝彩以鼓励学习者坚持艰苦的练习，即使熟练掌握还遥不可及。


    当然，任何对人性稍有了解，或是对自我有认识的人，都知道激励是在走钢丝。激励的设计必须非常谨慎，否则就会惹麻烦。 ^([^(350)](#fn350))


    克尔对激励机制出错的分析已成为管理科学的里程碑，他职业生涯的大部分时间都在与通用电气和高盛等企业合作，研究如何更审慎地设计激励机制。令人惊讶的是，当被问及灵感来自哪里时，克尔同时引用了机器学习和斯金纳。“通过编程，机器可以学习，弈棋程序不会犯两次相同的错误，这一事实对我非常有吸引力，”克尔说，“我立刻对一种可能性产生了兴趣，那就是机器可能会成为比程序员自身更好的棋手”！
    ^([^(351)](#fn351))


    克尔还承认：“至于那篇‘愚蠢’文章，很明显，斯金纳比我先到‘那里’。我没见过还有别人说过。我记得斯金纳写过，如果老鼠不会做他想要它做的事，他会呵斥老鼠‘你为什么不做？’如果斯金纳知道人们没有读过他的作品就读我的文章，他可能会在棺材里坐起来。很明显，斯金纳已经做了这项工作，但我把它包装成了适合商业应用。‘责备老鼠’是一堂很好的学习课。‘愚蠢’的真正含义在于它并不总是员工的错，管理层对太多的员工能力障碍负有责任。”


    事实上，在斯金纳看来，人们几乎永远不应责怪老鼠（或员工）。他认为，我们的行为几乎完全取决于激励和收益。有记者曾在电视上问斯金纳：“自由意志还有位置吗？”斯金纳回答说：“它还有虚构的位置。”
    ^([^(352)](#fn352))


    抛开自由意志的争论不谈，激励问题的影响不仅仅限于动物心理学和公司管理；事实上，体现得最淋漓尽致的是那些无情的和极具创造性的收益最大化者，我们称之为**孩子**。


    多伦多大学的经济学家约书亚·甘斯（Joshua Gans）想让女儿帮忙，训练弟弟上厕所。所以他做了任何优秀的经济学家都会做的事情。他给了她一个激励。每帮弟弟上一次厕所，都可以得到一块糖果。女儿很快发现了她的经济学家父亲的漏洞。“我发现喝得越多拉得越多，”她说，“所以我不断给弟弟喝水。”甘斯证实：“效果并不太好。”
    ^([^(353)](#fn353))


    普林斯顿认知科学家汤姆·格里菲思（Tom Griffiths）在自己女儿身上也发现了类似的现象。“她真的很喜欢打扫，”他告诉我，“她对此很感兴趣。我们给她买了小扫帚和撮箕。你知道，地上有一些薯片，她拿起扫帚和撮箕，把它们打扫干净，我对她说，‘哇！干得漂亮！扫得真好！太棒了！’”
    ^([^(354)](#fn354))


    通过适当的表扬，格里菲思成功培养了女儿的动作技能，还获得了保持清洁的好处：在养育上一举两得。真是这样吗？他女儿几秒钟就找到了漏洞。


    “她抬头看着我们，笑了，然后把薯片从撮箕里倒回地板上，再次打扫，试图获得更多表扬。”


    格里菲思的研究方向是心理学与机器学习的融合，这件事让他很受启发。“这让我想到了在构建奖励驱动的AI系统时遇到的一些挑战，在这些系统中，你必须非常仔细地考虑如何设计奖励函数。”


    格里菲思从养育子女的角度来思考强化学习。“作为父母，你在为你的孩子设计奖励函数，对吗？无论是你的表扬还是你给的反馈。没有人认真思考‘你该为你的孩子提供怎样的明确奖励函数？’”


    格里菲思认为子女养育也蕴含了对齐问题。他指出，人类文明故事的一条主线就是关于如何向奇怪的、陌生的、人类水平的智慧生物灌输价值观，这些将从我们手中接管社会的智慧生物也就是我们的孩子。而且这种相似之处甚至更深，对AI和子女养育的仔细分析表明，两者在很大程度上能相互启发。


    孩子的智慧可能不如我们，但即使是幼儿，也能打败我们的规则和激励措施，部分原因是他们**渴望**这样做。就强化学习系统而言，它们是奖励的奴隶；但是它们是拥有强大算力和不断试错的奴隶，无论我们设计怎样的激励，它们都会试图找到所有可能的漏洞。机器学习研究人员已经心酸地吸取了这一教训，他们也学会了一些应对技巧。


    ## 防止你的奖励绕圈：塑造定理


    阿斯特罗·泰勒（Astro Teller），曾经是谷歌X实验室（Alphabet的前身）的“登月队长”，主管和督导了谷歌的自动驾驶（发展成了后来的Waymo）、增强现实项目谷歌眼镜和谷歌大脑项目。但是在1998年，他曾专注于一个不同的问题：足球。泰勒和他的朋友、同学大卫·安德烈（David Andre）开发了名为“达尔文联”的虚拟足球程序，准备参加一年一度的RoboCup机器人足球赛。
    ^([^(355)](#fn355))


    也是那一年，丹麦哥本哈根玻尔研究所的杰特·兰德尔夫（Jette Randløv）和普里本·阿尔斯特勒姆（Preben Alstrøm）尝试让强化学习系统骑模拟自行车。他们的系统面临的任务挺复杂，在朝远处目标前进的同时保持直立。这似乎是应用塑造奖励的完美场合。因为摇摆不定的系统不太可能随机抵达目的地，所以他们决定只要自行车向目标前进就给点奖励。


    令他们惊讶的是，“系统在起点周围半径20-50米的范围绕圈”。 ^([^(356)](#fn356))


    “掺杂多个成分的强化函数，”他们写道，“必须非常小心地设计。”


    20世纪90年代末，加州大学伯克利分校的斯图尔特·罗素（Stuart Russell）和他当时的博士生吴恩达（Andrew Ng，后来曾担任百度副总裁兼首席科学家）很关注这些警示故事。这种利用漏洞的绕圈似乎是一种难以避免的危险。
    ^([^(357)](#fn357))


    吴恩达雄心勃勃。他回忆道：“当我开始研究机器人时……我问了很多人，‘你认为最难的控制问题是什么？’当时，我最常听到的回答是‘让计算机驾驶直升机。’我说，‘那我来试试。’”
    ^([^(358)](#fn358))


    关键问题是：描述他们实际上想要直升机做什么的奖励函数就算能写出来也很难学习，他们能添加什么样的“伪奖励”激励，使得训练过程更容易，同时最大化修改后的奖励的最优解也是真正问题的最优解？用克尔的话说，他们奖励哪种A仍能得到希望的B？吴恩达描述道：


    一个很简单的额外奖励设定经常就能让原本棘手的问题变得简单。然而，奖励塑造的一个困难是，通过修改奖励函数，它将原来的问题M变成了某个新问题M′，并用算法求解M′，希望这样可以比原问题更容易或更快地找到答案。但并不总是很清楚，为修改后的问题M′找到的解或策略是否也适用于原问题M。
    ^([^(359)](#fn359))


    “我们在给定奖励函数时有多少自由度，”吴恩达写道，“能让最优策略保持不变？” ^([^(360)](#fn360))

    '
  trans: '


    还有更好的方法……找出来！


    ——爱迪生 ^(³³²)


    “试错法”这个短语可能是苏格兰哲学家亚历山大·贝恩（Alexander Bain）在 1855 年创造的，用来描述人类和动物是如何学习。 ^(³³³)


    从最基本的角度来说，强化学习是通过试错学习，这种试错（也可以说是探索）最简单的算法形式是所谓的“ε-贪婪”（厄普西隆——贪婪）算法。希腊字母ε在数学上常用来表示“一点点”，ε-贪婪的意思就是“贪婪，除了一点点时间外”。一个按照ε-贪婪运行的自主体，大部分时间——比如说，99%——会根据到目前为止的有限经验，采取它认为能带来最大收益的行动。但是偶尔——例如，1%-会完全随机地尝试一些东西。比方说，在雅达利游戏中，偶尔随机敲击按钮，看看会发生什么。
    ^(³³⁴)


    如何用这种探索行为学习，有许多不同的风格，但基本想法是相同的——反复学习，多做让你得到奖励的事情，少做让你受惩罚的事情。你可以尝试显式地理解世界是如何运作的（“基于模型的”强化学习），或者打磨你的直觉（“无模型的”强化学习）来做到这一点。你也可以通过学习某种状态或行为能带来**多少收益**来做到这一点（“价值”学习），或者只需知道哪些策略总体上做得更好（“策略”学习）。不管怎样，几乎所有方法都是基于这样一个想法：首先偶然成功，然后倾向于去做更多看起来有效的事情。


    事实证明，有些任务比其他任务更适用这种方法。


    例如，在像《太空入侵者》这样的游戏中，成群的敌人向你扑来，你所能做的就是左移、右移和射击。随机敲击按钮可能有机会干掉几个游戏角色，每个角色都值几分，这些初步的分数就可以用来启动学习过程，通过学习，某些行为模式得到加强，更好的策略得到发展。例如，你可能会发现，只有射击才会得分，所以你会更频繁地射击，得分也会更多。这类游戏一般都有“密集”的奖励，从而相对容易学习。


    在其他游戏中，比如国际象棋，奖励不是那么立竿见影，但它们仍然是确定的。一盘棋要么输要么赢要么和棋，一般几十步，几乎不可能下到几百步。即使你对策略一无所知，只会在棋盘上随意摆弄，至少你很快就会知道你是赢了、输了还是和棋。


    然而，在许多情况下，获得**任何收益**都是奇迹。斯金纳就有亲身体会，他在奖励鸽子在迷你保龄球馆击球时发现了这一点。鸽子不知道它面对的是什么游戏，可能需要**几年**时间才能做出正确行为。当然，它（和斯金纳）在那之前早就饿死了。


    机械学习者也是如此。例如，让人形机器人将足球踢进网，可能需要对几十个关节施加成千上万次精确的扭矩，所有这些都必须完美协调。很难想象机器人**随意转**动几十个关节能直立起来，与球进行有意义的接触更难，更不要说将球送入网。


    强化学习研究人员称这个为**稀疏奖励**问题，或者更简洁地称为**稀疏**问题。如果是根据最终目标或与最终目标相当接近的东西来给奖励，那么人们基本上只能等待，直到随机按按钮或动作产生预期的效果。数学可以证明，大多数强化学习算法最终都会实现，但实际上，可能在太阳毁灭后很久才会实现。如果你试图训练一个围棋程序来击败世界冠军，而世界冠军每次投子认输你都奖励它
    1 分，否则就给 0 分，你将会等很长时间。


    稀疏问题还有安全隐患。如果你打算利用ε-贪婪强化学习开发一种能力极强的超智能 AI，并且决定，如果它能治愈癌症，你就奖励它 1 分，如果它不能治愈癌症，得
    0 分，那你得小心，因为在它得到第一个奖励之前，它将不得不做大量随机尝试。其中许多尝试都很笨拙。


    和布朗大学的迈克尔·利特曼（Michael Littman）聊天时，我问他，他对强化学习的研究对他教育子女有没有帮助。他立刻想到了稀疏问题。他曾和妻子开玩笑说要对儿子使用稀疏奖励：“这样怎么样？在他学会说中文前，我们不要给他东西吃。那会是很好的激励手段！我们看看这行不行得通！”利特曼笑了。“我妻子头脑非常清醒……她说：‘不，我们不玩这个游戏。’”
    ^(³³⁵)


    同斯金纳一样，利特曼当然知道不能那样做。事实上，稀疏问题已经促使强化学习研究者去追溯斯金纳的时代，他们相当直接地借鉴了他的建议。 ^(³³⁶)


    ## 课程的重要性


    为了获得复杂行为，可能先要策略性地奖励**简单**行为。塑造的这个关键见解既适用于动物，也适用于人类。“先学会走，再学会跑。”这句谚语不仅在字面意义上是对的，还刻画了人类经验的诸多方面。


    这是人类生活的一个显著特征，在生命最初的十几年里依靠文字和比喻的辅助穿行于世界，就像在文字和比喻组成的球道护栏里练习保龄球。许多动物被直接抛进残酷的生活：野生动物出生几小时就必须准备好全速奔跑以逃避捕食者。相比之下，我们至少要到十几岁时才能操作重型机械，等我们彻底自立时，甚至已经过了**身体的黄金年龄**。


    将 21 世纪的人类与其穴居祖先区分开来的不是智力天赋，而是精心设计的**课程**。事实上，斯金纳认为我们不应草率对动物的智力下结论。就像人类一样，通过学习正确的课程，动物也可以习得惊人的能力，超越我们对它们的认知。


    正如斯金纳说的，如果实验员只在旁边干等，等到出现复杂的行为，才去强化行为，那将很难检验动物“能不能”做到。


    考验的是实验者而不是动物的能力。断言某个物种或年龄的动物不能解决问题是靠不住的。通过精心安排的课程，鸽子、老鼠和猴子在过去 5 年里做到了这个物种从未做到的事情。并不是说它们的祖先做不到，而是大自然从来没给出过有效的课程。
    ^(³³⁷)


    人类生活的世界在很大程度上已被改造成了“有效的课程”，虽然很难意识到这一点。在某种程度上，我们认为有绳索让我们顺利登船是“自然的”，其实不然，自然本来没有教程。


    实际上，人类世界被精心设计成适合学习。例如电子游戏，伟大的游戏之所以伟大，部分在于它们“塑造”了我们玩游戏的方式。任天堂 1985 年发布了《超级马里奥》，是有史以来最著名的电子游戏之一。你可能很难回想起第一次玩的经历，但仔细观察游戏的前
    10 秒就会发现它是精心设计的，它在教你玩。你首先会遇到右边走过来的蘑菇仔，如果什么都不做，你会死。游戏设计师宫本茂已成为传奇人物，他说：“你得以自然的方式告诉玩家，他们需要跳起来躲开。”
    ^(³³⁸)


    但是宫本茂遇到一个问题，也有**好**蘑菇，你得学会不要躲开，要靠上去。“这让我们很头痛，”宫本茂解释道，“得用某种方式确保玩家明白这是好东西。”该怎么做？在好蘑菇滑向你的地方，没有足够的空间让你跳过它。你只能接受冲击，但它没有杀死你，反而让你变大。游戏的机制就这样建立了，现在你学会了。你认为你只是在玩，其实你正在被精心地，准确地，不露声色地**训练**。你学习规则，然后学习例外。掌握了基本的机制，就可以自由发挥了。


    通过逐步逼近灌输复杂行为，这个塑造原则适用于斯金纳的鸽子，也适用于人类。对此我们或许不会感到惊讶。如果我们发现塑造原则同样适用于机器，或许也不应惊讶。


    当然，自从机器学习诞生以来，人们就知道，问题、环境和游戏有难易之分。但是后来人们才逐渐认识到，接受过简单问题训练的系统，可能比没有训练过的系统更能学习复杂问题。
    ^(³³⁹)


    20 世纪 80 年代，桑顿和巴图与同事奥利弗·塞尔弗里奇（Oliver Selfridge）合作，利用强化学习来训练一辆模拟的轮式推车，要控制推车让车上直立的长杆不翻倒。杆子越长越重，就越容易保持直立，就像立在手上的棒球棒比尺子更容易保持平衡一样。他们发现，如果先用又长又重的杆子训练，**然后**换成又短又轻的杆子，那么总的训练次数会比一开始就用又短又轻的杆子少很多。
    ^(³⁴⁰)


    研究人员在其他背景下也一再发现同样的情况。例如，加州大学圣地亚哥分校的语言学家杰弗里·埃尔曼（Jeffrey Elman）在 20 世纪 90 年代初尝试用神经网络来预测句子中的下一个词。令人沮丧的是，最初的几次尝试都失败了。“简单地说，”他说，“如果一开始就用完整的‘成人’语言进行训练，网络无法学习复杂语法。但是，如果先用简单语句训练，网络不仅能成功掌握这些语句，还接着掌握了复杂语句。”
    ^(³⁴¹)


    “这个结果令人鼓舞，”埃尔曼说，“因为网络的行为有些类似儿童的行为。儿童并不是一开始就能掌握复杂的成人语句，而是从最简单的结构开始，逐步构建，直到达到成人水平。”


    这两个例子都是试图直接学习更难的问题，但做不到，借助课程，先学习容易的问题，再学习更难的，从而取得了成功。


    在动物行为公司，在训练猪将木制大硬币放进“存钱罐”的过程中，凯勒和玛丽安认识到了良好的课程的重要性。他们先是将硬币放在存钱罐旁边，渐渐地，让硬币离存钱罐越来越远，离猪也越来越远。
    ^(³⁴²)


    最近，机器学习也利用了这种“回溯”法。2017 年，加州大学伯克利分校的一组机器人专家想训练机器人用手臂将垫圈套到长螺栓上。等待机器人以某种方式偶然发现这种行为需要很长时间。但是从垫圈已经在螺栓上开始，先教机器人把垫圈往下推最后一截。然后，将垫圈放在螺栓正上方，机器人可以学会顺着螺栓滑下去。然后，让垫圈在螺栓**附近并且角度**合适，机器人也可以学会将垫圈套上去。他们最终回溯到垫圈在任何位置任何角度，机器人都能灵巧地旋转和安装它。
    ^(³⁴³)


    同游戏设计专家一样，传奇国际象棋冠军鲍比·费舍尔（Bobby Fischer）在《跟费舍尔学棋》中也使用了类似的策略。这本书针对初学者，先给出几十个一步就可以将死的棋局，然后是两步将死，然后是要用不同棋子配合三四步将死。在续册才讲中局、开局和长期策略。在第一本书中费舍尔专注于教新手抓住获胜的机会。事实证明，这个课程非常成功：直到今天仍有许多大师认为它是完美的入门书，
    ^(³⁴⁴)


    既然课程如此重要，一个自然而然的想法是，能否将一门好的、适合学习的课程的构建**本身**视为一个机器学习问题，并探索课程设计过程的自动化。最近的研究在探索自动识别适当难度的任务，以及能最高效促进神经网络学习的例子。这方面的初步结果很有希望，工作正在进行中。
    ^(³⁴⁵)


    自动化课程设计最精彩的成就可能是 DeepMind 主宰了棋类游戏的 AlphaGo 及其后继 AlphaGo Zero 和 AlphaZero。首席研究员大卫·西尔弗（David Silver）解释说：“AlphaGo
    总是有水平相当的对手。 ^(³⁴⁶)


    答案很简单也很优雅，事后看来，也很理所当然。它是与自己对弈。


    ## 微妙的激励


    无论是与猴子、老鼠还是人类打交道，我们都可以肯定，大多数动物都在寻找关于哪些活动能得到奖励的线索，然后试图做（或至少假装做）那些事情，并排除那些没有得到奖励的活动。


    ——史蒂夫·克尔（Steve Kerr） ^(³⁴⁷)


    如果奖励制度这样设计，以至于遵守道德是不划算的，虽然这并不一定会产生不道德行为。但这不是自找麻烦吗？


    ——史蒂夫·克尔 ^(³⁴⁸)


    这是奖励系统，笨蛋！


    ——管理学会执行委员会编辑 ^(³⁴⁹)


    前面介绍的克服稀疏问题的方法是使用“课程”，并从问题的简化版开始。还有一种方法则是直接从问题的完整版开始，与此同时增加奖励，为学习者指明正确方向或鼓励与成功相关的行为。这种奖励被称为“伪奖励”或“塑造奖励”，也可以简单将其视为激励。


    斯金纳在鸽子看向和接近球时会给一点食物奖励，因为这些是在他希望的击球之前必需的动作，同样的想法也适用于机器学习。例如，扫地机器人的“真正”目标可能是房子一尘不染，但你可以在它每扫除一点灰尘时给予奖励；无人机的最终目的可能是到达某个位置，但你可以在它朝正确方向前进时给它一点奖励。


    这通常有助于让系统感觉到是“更热”还是“更冷”：它是否总体上在以正确方式运行，并朝着正确方向改变它的行为。否则的话它就只能随机乱动，直到完全依靠运气完成目标。


    我们通常会将任务分解成一系列步骤，这样在心理上更容易保持动力。想象几年后才能完成的博士论文或书稿很难让你评估某一天的工作质量。想象我们希望下一年能减掉的体重，会让某个蛋糕或过量食物的成本和收益被摊平。作为父母、老师或教练，我们知道适时击掌喝彩以鼓励学习者坚持艰苦的练习，即使熟练掌握还遥不可及。


    当然，任何对人性稍有了解，或是对自我有认识的人，都知道激励是在走钢丝。激励的设计必须非常谨慎，否则就会惹麻烦。 ^(³⁵⁰)


    克尔对激励机制出错的分析已成为管理科学的里程碑，他职业生涯的大部分时间都在与通用电气和高盛等企业合作，研究如何更审慎地设计激励机制。令人惊讶的是，当被问及灵感来自哪里时，克尔同时引用了机器学习和斯金纳。“通过编程，机器可以学习，弈棋程序不会犯两次相同的错误，这一事实对我非常有吸引力，”克尔说，“我立刻对一种可能性产生了兴趣，那就是机器可能会成为比程序员自身更好的棋手”！
    ^(³⁵¹)


    克尔还承认：“至于那篇‘愚蠢’文章，很明显，斯金纳比我先到‘那里’。我没见过还有别人说过。我记得斯金纳写过，如果老鼠不会做他想要它做的事，他会呵斥老鼠‘你为什么不做？’如果斯金纳知道人们没有读过他的作品就读我的文章，他可能会在棺材里坐起来。很明显，斯金纳已经做了这项工作，但我把它包装成了适合商业应用。‘责备老鼠’是一堂很好的学习课。‘愚蠢’的真正含义在于它并不总是员工的错，管理层对太多的员工能力障碍负有责任。”


    事实上，在斯金纳看来，人们几乎永远不应责怪老鼠（或员工）。他认为，我们的行为几乎完全取决于激励和收益。有记者曾在电视上问斯金纳：“自由意志还有位置吗？”斯金纳回答说：“它还有虚构的位置。”
    ^(³⁵²)


    抛开自由意志的争论不谈，激励问题的影响不仅仅限于动物心理学和公司管理；事实上，体现得最淋漓尽致的是那些无情的和极具创造性的收益最大化者，我们称之为**孩子**。


    多伦多大学的经济学家约书亚·甘斯（Joshua Gans）想让女儿帮忙，训练弟弟上厕所。所以他做了任何优秀的经济学家都会做的事情。他给了她一个激励。每帮弟弟上一次厕所，都可以得到一块糖果。女儿很快发现了她的经济学家父亲的漏洞。“我发现喝得越多拉得越多，”她说，“所以我不断给弟弟喝水。”甘斯证实：“效果并不太好。”
    ^(³⁵³)


    普林斯顿认知科学家汤姆·格里菲思（Tom Griffiths）在自己女儿身上也发现了类似的现象。“她真的很喜欢打扫，”他告诉我，“她对此很感兴趣。我们给她买了小扫帚和撮箕。你知道，地上有一些薯片，她拿起扫帚和撮箕，把它们打扫干净，我对她说，‘哇！干得漂亮！扫得真好！太棒了！’”
    ^(³⁵⁴)


    通过适当的表扬，格里菲思成功培养了女儿的动作技能，还获得了保持清洁的好处：在养育上一举两得。真是这样吗？他女儿几秒钟就找到了漏洞。


    “她抬头看着我们，笑了，然后把薯片从撮箕里倒回地板上，再次打扫，试图获得更多表扬。”


    格里菲思的研究方向是心理学与机器学习的融合，这件事让他很受启发。“这让我想到了在构建奖励驱动的 AI 系统时遇到的一些挑战，在这些系统中，你必须非常仔细地考虑如何设计奖励函数。”


    格里菲思从养育子女的角度来思考强化学习。“作为父母，你在为你的孩子设计奖励函数，对吗？无论是你的表扬还是你给的反馈。没有人认真思考‘你该为你的孩子提供怎样的明确奖励函数？’”


    格里菲思认为子女养育也蕴含了对齐问题。他指出，人类文明故事的一条主线就是关于如何向奇怪的、陌生的、人类水平的智慧生物灌输价值观，这些将从我们手中接管社会的智慧生物也就是我们的孩子。而且这种相似之处甚至更深，对
    AI 和子女养育的仔细分析表明，两者在很大程度上能相互启发。


    孩子的智慧可能不如我们，但即使是幼儿，也能打败我们的规则和激励措施，部分原因是他们**渴望**这样做。就强化学习系统而言，它们是奖励的奴隶；但是它们是拥有强大算力和不断试错的奴隶，无论我们设计怎样的激励，它们都会试图找到所有可能的漏洞。机器学习研究人员已经心酸地吸取了这一教训，他们也学会了一些应对技巧。


    ## 防止你的奖励绕圈：塑造定理


    阿斯特罗·泰勒（Astro Teller），曾经是谷歌 X 实验室（Alphabet 的前身）的“登月队长”，主管和督导了谷歌的自动驾驶（发展成了后来的 Waymo）、增强现实项目谷歌眼镜和谷歌大脑项目。但是在
    1998 年，他曾专注于一个不同的问题：足球。泰勒和他的朋友、同学大卫·安德烈（David Andre）开发了名为“达尔文联”的虚拟足球程序，准备参加一年一度的
    RoboCup 机器人足球赛。 ^(³⁵⁵)


    也是那一年，丹麦哥本哈根玻尔研究所的杰特·兰德尔夫（Jette Randløv）和普里本·阿尔斯特勒姆（Preben Alstrøm）尝试让强化学习系统骑模拟自行车。他们的系统面临的任务挺复杂，在朝远处目标前进的同时保持直立。这似乎是应用塑造奖励的完美场合。因为摇摆不定的系统不太可能随机抵达目的地，所以他们决定只要自行车向目标前进就给点奖励。


    令他们惊讶的是，“系统在起点周围半径 20-50 米的范围绕圈”。 ^(³⁵⁶)


    “掺杂多个成分的强化函数，”他们写道，“必须非常小心地设计。”


    20 世纪 90 年代末，加州大学伯克利分校的斯图尔特·罗素（Stuart Russell）和他当时的博士生吴恩达（Andrew Ng，后来曾担任百度副总裁兼首席科学家）很关注这些警示故事。这种利用漏洞的绕圈似乎是一种难以避免的危险。
    ^(³⁵⁷)


    吴恩达雄心勃勃。他回忆道：“当我开始研究机器人时……我问了很多人，‘你认为最难的控制问题是什么？’当时，我最常听到的回答是‘让计算机驾驶直升机。’我说，‘那我来试试。’”
    ^(³⁵⁸)


    关键问题是：描述他们实际上想要直升机做什么的奖励函数就算能写出来也很难学习，他们能添加什么样的“伪奖励”激励，使得训练过程更容易，同时最大化修改后的奖励的最优解也是真正问题的最优解？用克尔的话说，他们奖励哪种
    A 仍能得到希望的 B？吴恩达描述道：


    一个很简单的额外奖励设定经常就能让原本棘手的问题变得简单。然而，奖励塑造的一个困难是，通过修改奖励函数，它将原来的问题 M 变成了某个新问题 M′，并用算法求解
    M′，希望这样可以比原问题更容易或更快地找到答案。但并不总是很清楚，为修改后的问题 M′找到的解或策略是否也适用于原问题 M。 ^(³⁵⁹)


    “我们在给定奖励函数时有多少自由度，”吴恩达写道，“能让最优策略保持不变？” ^(³⁶⁰)


    '
