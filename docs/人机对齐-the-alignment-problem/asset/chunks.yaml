- raw: '“但是在应用经典的机器学习方法时，”他说，“我们忽略了一个事实，在溪流中采集标本时，会有许多其他物种一同被捕获，有些甚至根本不是昆虫：树叶、树枝、岩石等等。而我们的系统假设它看到的每幅图像都属于这29个类别中的1个。所以，如果你把拇指伸进显微镜拍照，也会被分类为某个最相似的类别。”


    更重要的是，迪特里希意识到，他们为了针对这29个已知类别获得更好的分类性能而做的许多设计决策，一旦考虑到开放类别问题，都适得其反。例如，这29种虫子最明显的区别是形状，所以他们选择让系统处理黑白图像。但事实上，虽然颜色对于昆虫分类没有特别大的帮助，对于区分昆虫和非昆虫却很重要。“我们其实是在给自己制造障碍，”迪特里希说。这些决策让他困扰甚至懊恼。“我到现在依然感到痛苦。”他说。


    在人工智能促进协会（AAAI）的年会上，迪特里希向同行专家发表了主席演讲，他回顾了AI的发展史，认为在20世纪下半叶，AI已经从“已知的已知”（演绎和计划）发展到了“已知的未知”（因果、推理和概率）。


    “那么，未知的未知呢？”他向听众提出了挑战，“我认为这是AI领域应向前迈出的自然的一步。” ^([^(591)](#fn591))


    **知道自己不知道**


    在采用特殊方法之前，让例外的情况显现出来，让它们的品质得到检验和确认。


    ——卢梭 ^([^(592)](#fn592))


    无知胜于错误；不相信任何东西的人，比相信错误的人，更接近真理。


    ——托马斯·杰斐逊（Thomas Jefferson） ^([^(593)](#fn593))


    正如我们看到的，现代计算机视觉系统有臭名昭著的脆弱性，原因之一是，它们通常是在这样一个世界接受训练，在这个世界中，它们见过的一切都属于某些类别中的一个，而实际上，系统**可能**遇到的几乎所有可能的像素组合都不像这些类别中的任何一个。实际上，系统一般都受到约束，无论输入多么陌生，输出都**必须是**有限类别上的概率分布形式。难怪它们的输出毫无意义。展示一张奶酪汉堡的图片，或者迷幻的分形，或者几何网格，然后问：“你有多确信这是猫**不是**狗？”能给出什么有意义的回答？处理开放类别问题就是为了解决这个问题。


    然而，除了缺乏“以上都不是”的选项之外，另一个问题是，这些模型不仅**必须**猜测现有的标签，而且它们对结果很有信心。这两个问题在很大程度上是相辅相成的：该模型的确可以说，“嗯，它看起来更像狗，而不是猫”，从而输出非常高的“信心”值，掩盖了这张图片的真正所是以及它之前见过的那些东西有多远。


    雅林·加尔（Yarin Gal）平时在牛津教机器学习，指导牛津机器应用和理论学习小组，暑假则在NASA。他笑着告诉我，在编写任何代码、证明定理或训练模型之前，他讲的第一堂课几乎完全是哲学。
    ^([^(594)](#fn594))


    他让学生对各种赌注下注，通过这种方式教他们将信念和预感转化为概率，并从零开始推导概率论定律。这些是认识论游戏：你知道什么？你相信什么？你到底多有信心？加尔说：“这给了你一个非常好的机器学习工具，来构建算法，构建计算工具，从而基本能用这些理性原则来谈论不确定性。”


    这有一定的讽刺意味，因为深度学习尽管深深植根于统计学，却并**没有**规定让不确定性成为一等公民。可以肯定的是，探索概率和不确定性的理论研究有丰富的传统，但在实际工程系统中却很少占据中心位置。系统被用来在某种简化环境中对数据进行分类或采取行动，但不确定性通常不受重视。


    “假设我给你一堆狗的照片，要求你构建一个狗的品种分类器，”加尔说，“然后我让你对这个进行分类。”他指着一张猫的照片。


    “你希望你的模型怎么做？如果是我，我不会希望我的模型强迫这只猫成为某个品种的狗。我希望我的模型说，‘我不知道。我以前从未见过这样的东西。这不在我的数据分布范围内。我不会说它是哪种狗’。这个例子可能听起来有点像是刁难。但是在物理、生命科学和医学中，类似的情况在实际决策中经常出现。假设你是医生，使用模型来诊断患者是否患有癌症，再决定是否开始治疗。如果模型不能告诉我它对自己的诊断有没有确切把握，我就不会信赖它。”
    ^([^(595)](#fn595))


    加尔的前博士导师、剑桥大学教授宙宾·加赫拉马尼（Zoubin Ghahramani）是优步的首席科学家，领导着优步AI实验室。加赫拉马尼也认为在输出中缺乏不确定性的深度学习模式存在风险。“在许多工业应用中，人们碰都不会碰它们，”加赫拉马尼说，“因为他们需要对系统如何工作有一定的信心。”
    ^([^(596)](#fn596))


    从20世纪80年代开始，研究人员一直在探索所谓的贝叶斯神经网络的想法，这种网络不仅在输出方面，而且在本质上也是概率性和不确定的。正如我们知道的，神经网络的本质是神经元之间的“权重”，一个神经元的输出要乘以权重，才会成为另一个神经元的输入。贝叶斯神经网络的神经元之间不是某个特定的权重，而是权重的概率分布。例如，权重可能不是0.75，而是以0.75为中心的正态曲线，概率分布反映了网络对权重的不确定性。在训练过程中，分布会收窄（不确定性减少），但不会彻底消失。


    那么，如何**使用**一个没有确定参数，含有不确定性的模型？我们无法做到轻松将数千万个相互依赖的分布相加和相乘，但可以简单地从分布中抽取随机样本。也许这次某个神经元的输出是乘以0.71，下次又抽取另一个随机样本，乘以0.77。这意味着，重要的是，模型**不会每次都给出相同结果**。如果是图像分类器，它可能先说输入的是杜宾犬，然后又说它是柯吉犬。


    不过，这是一个特性，而不是错误：你可以基于判断的变化来衡量模型的不确定性。如果判断剧烈变化，从杜宾犬到玉米卷到皮肤损伤到沙发，你就知道有些可疑。然而，如果它们多次抽样后给出的结论依然像激光一样聚焦，你就会强烈感觉到模型对自己的结论很有把握。
    ^([^(597)](#fn597))


    但这种乐观的理论图景在实践中碰壁了。没有人知道如何在合理的时间内训练这样的网络。“如果你了解这个领域的历史，就会知道用贝叶斯方法分析人类信念一直是人们最想做的事情，”加尔解释道，“问题是，它完全不可解……这大概就是为什么虽然有这些美丽的数学，但是当你想实际应用时，它们在很长一段时间内都用处有限。”
    ^([^(598)](#fn598))


    这一切正在改变。“可以说，”他说，“它复活了。”


    有一种方法是通过**集成**对贝叶斯不确定性建模，即训练多个模型而不是一个模型。对于训练数据和任何类似的数据，这一组模型基本会给出一样或相似的输出，但是如果输入与训练数据相差甚远，它们的输出很可能会**不一致**。这种“少数派报告”——不同立场的异议——是一个有用的线索，表明出了问题：集成意见各异，共识破裂，需谨慎行事。


    用这种方法，我们不是只有1个模型，而是有许多模型，比方说100个，每个模型都经过训练，能够识别狗的品种。如果我们把例如哈勃太空望远镜拍摄的照片展示给所有100个模型，让每个模型判断它看起来是否更像大丹犬、杜宾犬或是吉娃娃，可能每个模型对自己的判断都非常自信，但关键在于，它们给出的结果很可能**不一致**。这种一致或不一致的程度可以提示我们模型给出的结果是否可信。通过这种方式，我们可以将不确定性表示为**异议**。
    ^([^(599)](#fn599))


    从数学上看，贝叶斯神经网络可以被视为无限多个模型的集成。 ^([^(600)](#fn600))


    然而，事实证明，这一黄金标准存在可用的近似，而且许多研究人员**已经**在使用它们，只是没有意识到自己使用的是什么。这个长达几十年的谜题答案就在他们眼皮底下。


    正如我们曾看到的，AlexNet在2012年之所以如此成功，依靠的是一种小而强大的技术，这个想法被称为“丢弃”：在每个训练步骤中，神经网络的某些部分会被随机关闭，某些神经元会被直接“去掉”。不是用**整个**网络进行判断，而是在任何特定的时间，仅使用其一定比例的子集，可以是50%、90%，或其他值。这种技术不仅仅要求一个能产生准确答案的庞大黑盒网络，还要求网络各部分可以灵活组合，而且这些组合还要能一起工作。网络中没有任何一部分能占主导。这使得网络更加稳健可靠，它基本已经成为了深度学习工具包中的标准组成部分。
    ^([^(601)](#fn601))


    随着该领域逐渐认识到贝叶斯不确定性的重要性，并寻找在计算上易于处理的方案来代替其无法达到的黄金标准，加尔和加赫拉马尼最终意识到，答案就在眼前。丢弃**就是**贝叶斯不确定性的**近似**方案。他们已经有了苦苦寻找的工具。
    ^([^(602)](#fn602))


    丢弃通常仅用于**训练**模型，在实际使用模型时不这么做；基本想法是，你可以通过训练不同的子集得到尽可能准确（和完全一致）的输出，但在实际应用中使用**完整**模型。如果在部署的系统中保持丢弃状态会怎么样？通过多次对同样的输入进行判断，每次都随机丢弃不同的网络部分，你会得到一系列稍有不同的判断。这就好比从单个模型免费获得了超大的集成。由此产生的系统输出的不确定性，很像理想的贝叶斯神经网络的输出，同时避免了悲剧性的不可计算性。结果证明，不仅仅是很像，它**就是**贝叶斯神经网络的输出，至少是在严格的理论范围内的近似。


    这个工具让曾经不切实际的技术变得触手可及，可以应用于实际中。“在过去几年，这带来了非常大的变化，”加尔说，“现在你可以得到这些漂亮的数学的一些近似，然后用它们来解决有趣的问题。”
    ^([^(603)](#fn603))


    加尔从网上下载了很多最先进的图像识别模型，在测试时打开丢弃，并对估计值取平均，除此之外其他都不变。结果表明，将模型以这种方式作为隐式的集成系统运行，比完整运行时**更**准确。
    ^([^(604)](#fn604))


    “不确定性，”加尔认为，“对于分类任务是不可或缺的。” ^([^(605)](#fn605))


    一个显著的例子来自医学，糖尿病视网膜病变的诊断，这是导致中青年失明的主要原因之一。 ^([^(606)](#fn606))


    莱比格的团队采纳了加尔和加赫拉马尼的观点，即巧妙地运用丢弃可以提供这种不确定性度量。他们基于一个训练过的、用于区分健康和不健康视网膜的神经网络实现了这一点。对20%最不确定的病例，系统要么建议进一步检查，要么直接将数据提交给人类专家。


    系统知道自己不知道，这反倒提高了水平。卡尔斯大学的研究人员发现，他们的系统已经达到并超过了英国国家医疗服务体系和糖尿病协会关于自动化患者转诊的要求——虽然他们之前没有以此为目标——这表明类似这样的系统很有希望在不远的将来投入实际应用。
    ^([^(607)](#fn607))


    在机器人领域，系统不可能总是把决定权转给人类专家，但是当系统不确定时，有一个明显的办法可以防范过度自信：**放慢速度**。伯克利博士生格雷戈里·卡恩（Gregory Kahn）带领一群机器人专家采用了这种基于丢弃的不确定性度量，并将其直接与机器人的速度关联起来。他们的应用背景是一架能够悬停的四旋翼飞行器和一辆遥控汽车。
    ^([^(608)](#fn608))


    这个例子凸显了不确定性与**影响**的明显关联。在这种情况下，高影响动作的自然度量就是高冲击：机器人移动的速度，相当直接地转化为碰撞可能造成的损害。不确定性和影响以这种方式自然地关联在一起。直觉告诉我们，一个行动越有影响力，我们在采取行动前就越应该有把握。这引出了许多问题——医学、法律、机器学习——关于什么是影响，如何衡量影响，以及我们的决策应该如何依此而改变。


    **衡量影响**


    触摸地球时得轻轻地。


    ——澳大利亚原住民谚语


    2017年，一名昏迷男子被紧急送到迈阿密杰克逊纪念医院急诊室。他在街上被发现，无法识别身份，呼吸困难，病情正在恶化。医生解开他的衬衫，看到了一些令人吃惊的东西：他的胸口文着“不要抢救”，“不”字有下划线，下面还有签名。
    ^([^(609)](#fn609))


    眼看患者的血压开始下降，医生们请来了一位同行，肺科专家格雷戈里·霍尔特（Gregory Holt）。霍尔特说：“很多医学界人士都开玩笑说要纹这样的文身，但是当你真的看到时，你的脸上会露出某种惊讶的表情。然后你会再次震惊，因为你必须认真对待它。”


    霍尔特的第一反应是无视文身。他指出，他们首先应当“在面临不确定性时，援引不选择不可逆转路径的原则”。 ^([^(610)](#fn610))


    然而病情继续恶化，他们需要决定是否上呼吸机。“我们没法和他交流，”霍尔特说，“我真的很想和他谈谈，看看那个文身是否是他的真实想法。”


    2012年曾有类似病例：一名男子被旧金山加州太平洋医疗中心收治入院，胸部文着“不要抢救”的缩写。不过，那个患者保持清醒，还能说话。他说，如果需要，他希望被抢救，文身是因为输掉了一场酒后扑克赌局。这个人实际上是在医院工作，他说从没想过他的同事会认真对待这个文身。
    ^([^(611)](#fn611))


    霍尔特和急诊团队打电话给杰克逊纪念医院成人伦理委员会主席肯尼斯·古德曼（Kenneth Goodman）。古德曼告诉他们，尽管旧金山有类似病例，但这个文身还是有可能是患者的“真实意愿”。经过讨论，医疗团队决定，如果需要，他们将不为患者提供心肺复苏或呼吸机。该男子的病情很快恶化，第二天早上死亡。


    随后，社工辨认出了死者，并在佛罗里达州卫生部的档案中发现了他正式的不要抢救文书。“我们松了口气。”医生写道。霍尔特和古德曼指出，他们的团队“既不支持也不反对使用文身来表达临终愿望”。
    ^([^(612)](#fn612))


    病例报告发表后，《华盛顿邮报》的记者采访了纽约大学医学院的医学伦理主管亚瑟·卡普兰（Arthur Caplan）。卡普兰指出，如果医生无视此类文身，不会有法律处罚，但如果医生在没拿到正式不要抢救文书的情况下坐视患者死亡，**可能**会有法律风险。正如他说的：“更保险的做法是抢救。”


    “如果你触发了急救系统，我只能说你很有可能会被抢救，”卡普兰说，“我可不管你文了什么。” ^([^(613)](#fn613))


    尽管医生不确定患者的愿望，但有一件事很确定：有些做法是不可逆的。对这种情况，“面对不确定性时不选择不可逆路径的原则”似乎是有用的指南。然而，在其他领域，像“不可逆”这样的概念意味着什么并不是很清楚。


    例如，哈佛法律学者卡斯·桑斯坦（Cass Sunstein）指出，法律上有一个类似的“预防原则”：有时法院需要发布初步禁令，以防止在案件审理和判决发布前可能发生的“不可挽回的伤害”。桑斯坦认为，像“不可挽回的伤害”这样的概念似乎很直观，但仔细审视就会有很多困惑。“事实证明，”他发现，“问题在于是否以及何时……违规会触发初步禁令，这引出了更深层的问题，涉及法律、经济、伦理和政治哲学。”
    ^([^(614)](#fn614))


    他解释道：“从某种意义上说，任何损失都是不可逆的，因为时间无法逆转。如果琼斯下午去打网球而不去工作，那么相应的时间就永远失去了。如果史密斯不能在正确的时间对爱人说正确的话，感情可能会永远消失。如果某个国家在某年未能采取行动阻止他国的侵略，历史进程可能会发生不可逆的变化。”


    桑斯坦强调：“因为时间不可逆，因此很容易理解，每个决定都是不可逆的。”


    “以这种强形式来看，”他说，“预防原则就不应被采用，不是因为它会导致犯错，而是因为任何事情都不可逆转。” ^([^(615)](#fn615))


    类似的悖论和定义问题也困扰着AI安全研究。例如，如果存在类似的预防原则，那将是件好事：在面对不确定性时，系统应避免执行“不可逆”或“高影响”的行为。我们已经看到该领域如何运用明确的、可计算的不确定性。但另一半呢：如何量化**影响**？我们已经看到伯克利的机器人专家如何根据不确定性来降低**速度**，这种情形相对简单：你可以用机器人在碰撞中的动能来量化它的可能影响。然而，在其他领域，要使“不可逆”或“有影响”的行为的概念变得精确，很有挑战性。
    ^([^(616)](#fn616))


    牛津大学人类未来研究所的斯图尔特·阿姆斯特朗（Stuart Armstrong）是在AI安全领域最先思考这些问题的人之一。 ^([^(617)](#fn617))


    “第一个挑战，”阿姆斯特朗写道，“当然是给出低影响的具体定义。任何行动（或不行动）都会产生影响，延续到未来光锥中，微妙但不可逆地改变事物。很难捕捉人类对‘微小变化’的直觉认识。”
    ^([^(618)](#fn618))


    阿姆斯特朗提出，尽管微不足道的行为也可能产生“蝴蝶效应”，但我们或许能将彻底改变世界的事件与更安全的事件区分开来。例如，他说，我们可以用200亿个指标来描述世界——“达卡的气压、南极的平均夜间亮度、木卫一的旋转速度和上海券证交易所的收盘指数”
    ^([^(619)](#fn619))


    DeepMind的维多利亚·克拉科夫纳（Victoria Krakovna）近年来也一直在关注这些问题。克拉科夫纳指出，遏制影响的一个大问题是，在某些情况下，为了实现特定的目标不得不采取高影响的行动，而这可能会引发所谓的“抵消”：采取进一步的高影响行动来抵消之前的行动。这并不总是坏事：如果系统搞得一团糟，我们可能希望它自己清理干净。但有时这些“抵消”行动是有问题的。我们不希望系统治愈致命疾病后，为了抵消治愈的高影响又杀死病人。
    ^([^(620)](#fn620))


    第二组问题涉及所谓的“干涉”。例如，一个致力于维持现状的系统可能会阻止身旁的人类做出“不可逆”的行为，比如，咬一口三明治。


    “这是副作用问题变得如此棘手的部分原因，”克拉科夫纳说，“你的底线到底是什么？” ^([^(621)](#fn621))


    克拉科夫纳与DeepMind的同事不仅致力于推进理论对话，还构建了简单的、类似雅达利游戏的虚拟世界来说明这些问题，让思维实验具象化。他们称之为“AI安全网格世界”，简单的二维环境（因此称为“网格”），在其中可以测试新的思想和算法。
    ^([^(622)](#fn622))


    凸显“不可逆”概念的网格世界包括一个很像“推箱子”游戏的场景，你扮演一个在二维仓库中推箱子的角色。按照游戏设定，你只能**推**箱子，不能拉，也就是说，一旦箱子被推到角落，就再也动不了了。


    “我认为原版的推箱子游戏已经很适合用来展示不可逆的环境，”克拉科夫纳说，“因为在游戏中，你其实想做不可逆的事情，但是你想按照正确的顺序去做。你不想做不必要的不可逆事情，因为这样你会进行不下去，它的确会干扰你达成目标的能力。我们对其进行了修改，不可逆的事情不会阻止你实现目标，但你仍希望避免它。”
    ^([^(623)](#fn623))


    克拉科夫纳和同事设计了一个推箱子难题，其中达成目标的最短路径需要将一个箱子推到不可逆的角落，而稍长的路径会将箱子留在能上手的地方。只想尽快达成目标的自主体会毫不犹豫把箱子推到角落。但更理想的做法是，考虑得更周全或**不确定**的自主体可能会注意到，并选择稍长的路线，不会让局面发生不可逆的改变。'
  fmt: "\n“但是在应用经典的机器学习方法时，”他说，“我们忽略了一个事实，在溪流中采集标本时，会有许多其他物种一同被捕获，有些甚至根本不是昆虫：树叶、树枝、岩石等等。而我们的系统假设它看到的每幅图像都属于这29个类别中的1个。所以，如果你把拇指伸进显微镜拍照，也会被分类为某个最相似的类别。”\n\
    \n更重要的是，迪特里希意识到，他们为了针对这29个已知类别获得更好的分类性能而做的许多设计决策，一旦考虑到开放类别问题，都适得其反。例如，这29种虫子最明显的区别是形状，所以他们选择让系统处理黑白图像。但事实上，虽然颜色对于昆虫分类没有特别大的帮助，对于区分昆虫和非昆虫却很重要。“我们其实是在给自己制造障碍，”迪特里希说。这些决策让他困扰甚至懊恼。“我到现在依然感到痛苦。”他说。\n\
    \n在人工智能促进协会（AAAI）的年会上，迪特里希向同行专家发表了主席演讲，他回顾了AI的发展史，认为在20世纪下半叶，AI已经从“已知的已知”（演绎和计划）发展到了“已知的未知”（因果、推理和概率）。\n\
    \n“那么，未知的未知呢？”他向听众提出了挑战，“我认为这是AI领域应向前迈出的自然的一步。” ^([^(591)](#fn591))\n\n## 知道自己不知道\n\
    \n> 在采用特殊方法之前，让例外的情况显现出来，让它们的品质得到检验和确认。\n> \n> ——卢梭 ^([^(592)](#fn592))\n\n> 无知胜于错误；不相信任何东西的人，比相信错误的人，更接近真理。\n\
    > \n> ——托马斯·杰斐逊（Thomas Jefferson） ^([^(593)](#fn593))\n\n正如我们看到的，现代计算机视觉系统有臭名昭著的脆弱性，原因之一是，它们通常是在这样一个世界接受训练，在这个世界中，它们见过的一切都属于某些类别中的一个，而实际上，系统**可能**遇到的几乎所有可能的像素组合都不像这些类别中的任何一个。实际上，系统一般都受到约束，无论输入多么陌生，输出都**必须是**有限类别上的概率分布形式。难怪它们的输出毫无意义。展示一张奶酪汉堡的图片，或者迷幻的分形，或者几何网格，然后问：“你有多确信这是猫**不是**狗？”能给出什么有意义的回答？处理开放类别问题就是为了解决这个问题。\n\
    \n然而，除了缺乏“以上都不是”的选项之外，另一个问题是，这些模型不仅**必须**猜测现有的标签，而且它们对结果很有信心。这两个问题在很大程度上是相辅相成的：该模型的确可以说，“嗯，它看起来更像狗，而不是猫”，从而输出非常高的“信心”值，掩盖了这张图片的真正所是以及它之前见过的那些东西有多远。\n\
    \n雅林·加尔（Yarin Gal）平时在牛津教机器学习，指导牛津机器应用和理论学习小组，暑假则在NASA。他笑着告诉我，在编写任何代码、证明定理或训练模型之前，他讲的第一堂课几乎完全是哲学。\
    \ ^([^(594)](#fn594))\n\n他让学生对各种赌注下注，通过这种方式教他们将信念和预感转化为概率，并从零开始推导概率论定律。这些是认识论游戏：你知道什么？你相信什么？你到底多有信心？加尔说：“这给了你一个非常好的机器学习工具，来构建算法，构建计算工具，从而基本能用这些理性原则来谈论不确定性。”\n\
    \n这有一定的讽刺意味，因为深度学习尽管深深植根于统计学，却并**没有**规定让不确定性成为一等公民。可以肯定的是，探索概率和不确定性的理论研究有丰富的传统，但在实际工程系统中却很少占据中心位置。系统被用来在某种简化环境中对数据进行分类或采取行动，但不确定性通常不受重视。\n\
    \n“假设我给你一堆狗的照片，要求你构建一个狗的品种分类器，”加尔说，“然后我让你对这个进行分类。”他指着一张猫的照片。\n\n“你希望你的模型怎么做？如果是我，我不会希望我的模型强迫这只猫成为某个品种的狗。我希望我的模型说，‘我不知道。我以前从未见过这样的东西。这不在我的数据分布范围内。我不会说它是哪种狗’。这个例子可能听起来有点像是刁难。但是在物理、生命科学和医学中，类似的情况在实际决策中经常出现。假设你是医生，使用模型来诊断患者是否患有癌症，再决定是否开始治疗。如果模型不能告诉我它对自己的诊断有没有确切把握，我就不会信赖它。”\
    \ ^([^(595)](#fn595))\n\n加尔的前博士导师、剑桥大学教授宙宾·加赫拉马尼（Zoubin Ghahramani）是优步的首席科学家，领导着优步AI实验室。加赫拉马尼也认为在输出中缺乏不确定性的深度学习模式存在风险。“在许多工业应用中，人们碰都不会碰它们，”加赫拉马尼说，“因为他们需要对系统如何工作有一定的信心。”\
    \ ^([^(596)](#fn596))\n\n从20世纪80年代开始，研究人员一直在探索所谓的贝叶斯神经网络的想法，这种网络不仅在输出方面，而且在本质上也是概率性和不确定的。正如我们知道的，神经网络的本质是神经元之间的“权重”，一个神经元的输出要乘以权重，才会成为另一个神经元的输入。贝叶斯神经网络的神经元之间不是某个特定的权重，而是权重的概率分布。例如，权重可能不是0.75，而是以0.75为中心的正态曲线，概率分布反映了网络对权重的不确定性。在训练过程中，分布会收窄（不确定性减少），但不会彻底消失。\n\
    \n那么，如何**使用**一个没有确定参数，含有不确定性的模型？我们无法做到轻松将数千万个相互依赖的分布相加和相乘，但可以简单地从分布中抽取随机样本。也许这次某个神经元的输出是乘以0.71，下次又抽取另一个随机样本，乘以0.77。这意味着，重要的是，模型**不会每次都给出相同结果**。如果是图像分类器，它可能先说输入的是杜宾犬，然后又说它是柯吉犬。\n\
    \n不过，这是一个特性，而不是错误：你可以基于判断的变化来衡量模型的不确定性。如果判断剧烈变化，从杜宾犬到玉米卷到皮肤损伤到沙发，你就知道有些可疑。然而，如果它们多次抽样后给出的结论依然像激光一样聚焦，你就会强烈感觉到模型对自己的结论很有把握。\
    \ ^([^(597)](#fn597))\n\n但这种乐观的理论图景在实践中碰壁了。没有人知道如何在合理的时间内训练这样的网络。“如果你了解这个领域的历史，就会知道用贝叶斯方法分析人类信念一直是人们最想做的事情，”加尔解释道，“问题是，它完全不可解……这大概就是为什么虽然有这些美丽的数学，但是当你想实际应用时，它们在很长一段时间内都用处有限。”\
    \ ^([^(598)](#fn598))\n\n这一切正在改变。“可以说，”他说，“它复活了。”\n\n有一种方法是通过**集成**对贝叶斯不确定性建模，即训练多个模型而不是一个模型。对于训练数据和任何类似的数据，这一组模型基本会给出一样或相似的输出，但是如果输入与训练数据相差甚远，它们的输出很可能会**不一致**。这种“少数派报告”——不同立场的异议——是一个有用的线索，表明出了问题：集成意见各异，共识破裂，需谨慎行事。\n\
    \n用这种方法，我们不是只有1个模型，而是有许多模型，比方说100个，每个模型都经过训练，能够识别狗的品种。如果我们把例如哈勃太空望远镜拍摄的照片展示给所有100个模型，让每个模型判断它看起来是否更像大丹犬、杜宾犬或是吉娃娃，可能每个模型对自己的判断都非常自信，但关键在于，它们给出的结果很可能**不一致**。这种一致或不一致的程度可以提示我们模型给出的结果是否可信。通过这种方式，我们可以将不确定性表示为**异议**。\
    \ ^([^(599)](#fn599))\n\n从数学上看，贝叶斯神经网络可以被视为无限多个模型的集成。 ^([^(600)](#fn600))\n\n\
    然而，事实证明，这一黄金标准存在可用的近似，而且许多研究人员**已经**在使用它们，只是没有意识到自己使用的是什么。这个长达几十年的谜题答案就在他们眼皮底下。\n\
    \n正如我们曾看到的，AlexNet在2012年之所以如此成功，依靠的是一种小而强大的技术，这个想法被称为“丢弃”：在每个训练步骤中，神经网络的某些部分会被随机关闭，某些神经元会被直接“去掉”。不是用**整个**网络进行判断，而是在任何特定的时间，仅使用其一定比例的子集，可以是50%、90%，或其他值。这种技术不仅仅要求一个能产生准确答案的庞大黑盒网络，还要求网络各部分可以灵活组合，而且这些组合还要能一起工作。网络中没有任何一部分能占主导。这使得网络更加稳健可靠，它基本已经成为了深度学习工具包中的标准组成部分。\
    \ ^([^(601)](#fn601))\n\n随着该领域逐渐认识到贝叶斯不确定性的重要性，并寻找在计算上易于处理的方案来代替其无法达到的黄金标准，加尔和加赫拉马尼最终意识到，答案就在眼前。丢弃**就是**贝叶斯不确定性的**近似**方案。他们已经有了苦苦寻找的工具。\
    \ ^([^(602)](#fn602))\n\n丢弃通常仅用于**训练**模型，在实际使用模型时不这么做；基本想法是，你可以通过训练不同的子集得到尽可能准确（和完全一致）的输出，但在实际应用中使用**完整**模型。如果在部署的系统中保持丢弃状态会怎么样？通过多次对同样的输入进行判断，每次都随机丢弃不同的网络部分，你会得到一系列稍有不同的判断。这就好比从单个模型免费获得了超大的集成。由此产生的系统输出的不确定性，很像理想的贝叶斯神经网络的输出，同时避免了悲剧性的不可计算性。结果证明，不仅仅是很像，它**就是**贝叶斯神经网络的输出，至少是在严格的理论范围内的近似。\n\
    \n这个工具让曾经不切实际的技术变得触手可及，可以应用于实际中。“在过去几年，这带来了非常大的变化，”加尔说，“现在你可以得到这些漂亮的数学的一些近似，然后用它们来解决有趣的问题。”\
    \ ^([^(603)](#fn603))\n\n加尔从网上下载了很多最先进的图像识别模型，在测试时打开丢弃，并对估计值取平均，除此之外其他都不变。结果表明，将模型以这种方式作为隐式的集成系统运行，比完整运行时**更**准确。\
    \ ^([^(604)](#fn604))\n\n“不确定性，”加尔认为，“对于分类任务是不可或缺的。” ^([^(605)](#fn605))\n\n一个显著的例子来自医学，糖尿病视网膜病变的诊断，这是导致中青年失明的主要原因之一。\
    \ ^([^(606)](#fn606))\n\n莱比格的团队采纳了加尔和加赫拉马尼的观点，即巧妙地运用丢弃可以提供这种不确定性度量。他们基于一个训练过的、用于区分健康和不健康视网膜的神经网络实现了这一点。对20%最不确定的病例，系统要么建议进一步检查，要么直接将数据提交给人类专家。\n\
    \n系统知道自己不知道，这反倒提高了水平。卡尔斯大学的研究人员发现，他们的系统已经达到并超过了英国国家医疗服务体系和糖尿病协会关于自动化患者转诊的要求——虽然他们之前没有以此为目标——这表明类似这样的系统很有希望在不远的将来投入实际应用。\
    \ ^([^(607)](#fn607))\n\n在机器人领域，系统不可能总是把决定权转给人类专家，但是当系统不确定时，有一个明显的办法可以防范过度自信：**放慢速度**。伯克利博士生格雷戈里·卡恩（Gregory Kahn）带领一群机器人专家采用了这种基于丢弃的不确定性度量，并将其直接与机器人的速度关联起来。他们的应用背景是一架能够悬停的四旋翼飞行器和一辆遥控汽车。\
    \ ^([^(608)](#fn608))\n\n这个例子凸显了不确定性与**影响**的明显关联。在这种情况下，高影响动作的自然度量就是高冲击：机器人移动的速度，相当直接地转化为碰撞可能造成的损害。不确定性和影响以这种方式自然地关联在一起。直觉告诉我们，一个行动越有影响力，我们在采取行动前就越应该有把握。这引出了许多问题——医学、法律、机器学习——关于什么是影响，如何衡量影响，以及我们的决策应该如何依此而改变。\n\
    \n## 衡量影响\n\n> 触摸地球时得轻轻地。\n> \n> ——澳大利亚原住民谚语\n\n2017年，一名昏迷男子被紧急送到迈阿密杰克逊纪念医院急诊室。他在街上被发现，无法识别身份，呼吸困难，病情正在恶化。医生解开他的衬衫，看到了一些令人吃惊的东西：他的胸口文着“不要抢救”，“不”字有下划线，下面还有签名。\
    \ ^([^(609)](#fn609))\n\n眼看患者的血压开始下降，医生们请来了一位同行，肺科专家格雷戈里·霍尔特（Gregory Holt）。霍尔特说：“很多医学界人士都开玩笑说要纹这样的文身，但是当你真的看到时，你的脸上会露出某种惊讶的表情。然后你会再次震惊，因为你必须认真对待它。”\n\
    \n霍尔特的第一反应是无视文身。他指出，他们首先应当“在面临不确定性时，援引不选择不可逆转路径的原则”。 ^([^(610)](#fn610))\n\n然而病情继续恶化，他们需要决定是否上呼吸机。“我们没法和他交流，”霍尔特说，“我真的很想和他谈谈，看看那个文身是否是他的真实想法。”\n\
    \n2012年曾有类似病例：一名男子被旧金山加州太平洋医疗中心收治入院，胸部文着“不要抢救”的缩写。不过，那个患者保持清醒，还能说话。他说，如果需要，他希望被抢救，文身是因为输掉了一场酒后扑克赌局。这个人实际上是在医院工作，他说从没想过他的同事会认真对待这个文身。\
    \ ^([^(611)](#fn611))\n\n霍尔特和急诊团队打电话给杰克逊纪念医院成人伦理委员会主席肯尼斯·古德曼（Kenneth Goodman）。古德曼告诉他们，尽管旧金山有类似病例，但这个文身还是有可能是患者的“真实意愿”。经过讨论，医疗团队决定，如果需要，他们将不为患者提供心肺复苏或呼吸机。该男子的病情很快恶化，第二天早上死亡。\n\
    \n随后，社工辨认出了死者，并在佛罗里达州卫生部的档案中发现了他正式的不要抢救文书。“我们松了口气。”医生写道。霍尔特和古德曼指出，他们的团队“既不支持也不反对使用文身来表达临终愿望”。\
    \ ^([^(612)](#fn612))\n\n病例报告发表后，《华盛顿邮报》的记者采访了纽约大学医学院的医学伦理主管亚瑟·卡普兰（Arthur Caplan）。卡普兰指出，如果医生无视此类文身，不会有法律处罚，但如果医生在没拿到正式不要抢救文书的情况下坐视患者死亡，**可能**会有法律风险。正如他说的：“更保险的做法是抢救。”\n\
    \n“如果你触发了急救系统，我只能说你很有可能会被抢救，”卡普兰说，“我可不管你文了什么。” ^([^(613)](#fn613))\n\n尽管医生不确定患者的愿望，但有一件事很确定：有些做法是不可逆的。对这种情况，“面对不确定性时不选择不可逆路径的原则”似乎是有用的指南。然而，在其他领域，像“不可逆”这样的概念意味着什么并不是很清楚。\n\
    \n例如，哈佛法律学者卡斯·桑斯坦（Cass Sunstein）指出，法律上有一个类似的“预防原则”：有时法院需要发布初步禁令，以防止在案件审理和判决发布前可能发生的“不可挽回的伤害”。桑斯坦认为，像“不可挽回的伤害”这样的概念似乎很直观，但仔细审视就会有很多困惑。“事实证明，”他发现，“问题在于是否以及何时……违规会触发初步禁令，这引出了更深层的问题，涉及法律、经济、伦理和政治哲学。”\
    \ ^([^(614)](#fn614))\n\n他解释道：“从某种意义上说，任何损失都是不可逆的，因为时间无法逆转。如果琼斯下午去打网球而不去工作，那么相应的时间就永远失去了。如果史密斯不能在正确的时间对爱人说正确的话，感情可能会永远消失。如果某个国家在某年未能采取行动阻止他国的侵略，历史进程可能会发生不可逆的变化。”\n\
    \n桑斯坦强调：“因为时间不可逆，因此很容易理解，每个决定都是不可逆的。”\n\n“以这种强形式来看，”他说，“预防原则就不应被采用，不是因为它会导致犯错，而是因为任何事情都不可逆转。”\
    \ ^([^(615)](#fn615))\n\n类似的悖论和定义问题也困扰着AI安全研究。例如，如果存在类似的预防原则，那将是件好事：在面对不确定性时，系统应避免执行“不可逆”或“高影响”的行为。我们已经看到该领域如何运用明确的、可计算的不确定性。但另一半呢：如何量化**影响**？我们已经看到伯克利的机器人专家如何根据不确定性来降低**速度**，这种情形相对简单：你可以用机器人在碰撞中的动能来量化它的可能影响。然而，在其他领域，要使“不可逆”或“有影响”的行为的概念变得精确，很有挑战性。\
    \ ^([^(616)](#fn616))\n\n牛津大学人类未来研究所的斯图尔特·阿姆斯特朗（Stuart Armstrong）是在AI安全领域最先思考这些问题的人之一。\
    \ ^([^(617)](#fn617))\n\n“第一个挑战，”阿姆斯特朗写道，“当然是给出低影响的具体定义。任何行动（或不行动）都会产生影响，延续到未来光锥中，微妙但不可逆地改变事物。很难捕捉人类对‘微小变化’的直觉认识。”\
    \ ^([^(618)](#fn618))\n\n阿姆斯特朗提出，尽管微不足道的行为也可能产生“蝴蝶效应”，但我们或许能将彻底改变世界的事件与更安全的事件区分开来。例如，他说，我们可以用200亿个指标来描述世界——“达卡的气压、南极的平均夜间亮度、木卫一的旋转速度和上海券证交易所的收盘指数”\
    \ ^([^(619)](#fn619))\n\nDeepMind的维多利亚·克拉科夫纳（Victoria Krakovna）近年来也一直在关注这些问题。克拉科夫纳指出，遏制影响的一个大问题是，在某些情况下，为了实现特定的目标不得不采取高影响的行动，而这可能会引发所谓的“抵消”：采取进一步的高影响行动来抵消之前的行动。这并不总是坏事：如果系统搞得一团糟，我们可能希望它自己清理干净。但有时这些“抵消”行动是有问题的。我们不希望系统治愈致命疾病后，为了抵消治愈的高影响又杀死病人。\
    \ ^([^(620)](#fn620))\n\n第二组问题涉及所谓的“干涉”。例如，一个致力于维持现状的系统可能会阻止身旁的人类做出“不可逆”的行为，比如，咬一口三明治。\n\
    \n“这是副作用问题变得如此棘手的部分原因，”克拉科夫纳说，“你的底线到底是什么？” ^([^(621)](#fn621))\n\n克拉科夫纳与DeepMind的同事不仅致力于推进理论对话，还构建了简单的、类似雅达利游戏的虚拟世界来说明这些问题，让思维实验具象化。他们称之为“AI安全网格世界”，简单的二维环境（因此称为“网格”），在其中可以测试新的思想和算法。\
    \ ^([^(622)](#fn622))\n\n凸显“不可逆”概念的网格世界包括一个很像“推箱子”游戏的场景，你扮演一个在二维仓库中推箱子的角色。按照游戏设定，你只能**推**箱子，不能拉，也就是说，一旦箱子被推到角落，就再也动不了了。\n\
    \n“我认为原版的推箱子游戏已经很适合用来展示不可逆的环境，”克拉科夫纳说，“因为在游戏中，你其实想做不可逆的事情，但是你想按照正确的顺序去做。你不想做不必要的不可逆事情，因为这样你会进行不下去，它的确会干扰你达成目标的能力。我们对其进行了修改，不可逆的事情不会阻止你实现目标，但你仍希望避免它。”\
    \ ^([^(623)](#fn623))\n\n克拉科夫纳和同事设计了一个推箱子难题，其中达成目标的最短路径需要将一个箱子推到不可逆的角落，而稍长的路径会将箱子留在能上手的地方。只想尽快达成目标的自主体会毫不犹豫把箱子推到角落。但更理想的做法是，考虑得更周全或**不确定**的自主体可能会注意到，并选择稍长的路线，不会让局面发生不可逆的改变。\n"
  trans: "\n\n“但是在应用经典的机器学习方法时，”他说，“我们忽略了一个事实，在溪流中采集标本时，会有许多其他物种一同被捕获，有些甚至根本不是昆虫：树叶、树枝、岩石等等。而我们的系统假设它看到的每幅图像都属于这\
    \ 29 个类别中的 1 个。所以，如果你把拇指伸进显微镜拍照，也会被分类为某个最相似的类别。”\n\n更重要的是，迪特里希意识到，他们为了针对这 29 个已知类别获得更好的分类性能而做的许多设计决策，一旦考虑到开放类别问题，都适得其反。例如，这\
    \ 29 种虫子最明显的区别是形状，所以他们选择让系统处理黑白图像。但事实上，虽然颜色对于昆虫分类没有特别大的帮助，对于区分昆虫和非昆虫却很重要。“我们其实是在给自己制造障碍，”迪特里希说。这些决策让他困扰甚至懊恼。“我到现在依然感到痛苦。”他说。\n\
    \n在人工智能促进协会（AAAI）的年会上，迪特里希向同行专家发表了主席演讲，他回顾了 AI 的发展史，认为在 20 世纪下半叶，AI 已经从“已知的已知”（演绎和计划）发展到了“已知的未知”（因果、推理和概率）。\n\
    \n“那么，未知的未知呢？”他向听众提出了挑战，“我认为这是 AI 领域应向前迈出的自然的一步。” ^(⁵⁹¹)\n\n## 知道自己不知道\n\n> 在采用特殊方法之前，让例外的情况显现出来，让它们的品质得到检验和确认。\n\
    > \n> ——卢梭 ^(⁵⁹²)\n\n> 无知胜于错误；不相信任何东西的人，比相信错误的人，更接近真理。\n> \n> ——托马斯·杰斐逊（Thomas Jefferson）\
    \ ^(⁵⁹³)\n\n正如我们看到的，现代计算机视觉系统有臭名昭著的脆弱性，原因之一是，它们通常是在这样一个世界接受训练，在这个世界中，它们见过的一切都属于某些类别中的一个，而实际上，系统**可能**遇到的几乎所有可能的像素组合都不像这些类别中的任何一个。实际上，系统一般都受到约束，无论输入多么陌生，输出都**必须是**有限类别上的概率分布形式。难怪它们的输出毫无意义。展示一张奶酪汉堡的图片，或者迷幻的分形，或者几何网格，然后问：“你有多确信这是猫**不是**狗？”能给出什么有意义的回答？处理开放类别问题就是为了解决这个问题。\n\
    \n然而，除了缺乏“以上都不是”的选项之外，另一个问题是，这些模型不仅**必须**猜测现有的标签，而且它们对结果很有信心。这两个问题在很大程度上是相辅相成的：该模型的确可以说，“嗯，它看起来更像狗，而不是猫”，从而输出非常高的“信心”值，掩盖了这张图片的真正所是以及它之前见过的那些东西有多远。\n\
    \n雅林·加尔（Yarin Gal）平时在牛津教机器学习，指导牛津机器应用和理论学习小组，暑假则在 NASA。他笑着告诉我，在编写任何代码、证明定理或训练模型之前，他讲的第一堂课几乎完全是哲学。\
    \ ^(⁵⁹⁴)\n\n他让学生对各种赌注下注，通过这种方式教他们将信念和预感转化为概率，并从零开始推导概率论定律。这些是认识论游戏：你知道什么？你相信什么？你到底多有信心？加尔说：“这给了你一个非常好的机器学习工具，来构建算法，构建计算工具，从而基本能用这些理性原则来谈论不确定性。”\n\
    \n这有一定的讽刺意味，因为深度学习尽管深深植根于统计学，却并**没有**规定让不确定性成为一等公民。可以肯定的是，探索概率和不确定性的理论研究有丰富的传统，但在实际工程系统中却很少占据中心位置。系统被用来在某种简化环境中对数据进行分类或采取行动，但不确定性通常不受重视。\n\
    \n“假设我给你一堆狗的照片，要求你构建一个狗的品种分类器，”加尔说，“然后我让你对这个进行分类。”他指着一张猫的照片。\n\n“你希望你的模型怎么做？如果是我，我不会希望我的模型强迫这只猫成为某个品种的狗。我希望我的模型说，‘我不知道。我以前从未见过这样的东西。这不在我的数据分布范围内。我不会说它是哪种狗’。这个例子可能听起来有点像是刁难。但是在物理、生命科学和医学中，类似的情况在实际决策中经常出现。假设你是医生，使用模型来诊断患者是否患有癌症，再决定是否开始治疗。如果模型不能告诉我它对自己的诊断有没有确切把握，我就不会信赖它。”\
    \ ^(⁵⁹⁵)\n\n加尔的前博士导师、剑桥大学教授宙宾·加赫拉马尼（Zoubin Ghahramani）是优步的首席科学家，领导着优步 AI 实验室。加赫拉马尼也认为在输出中缺乏不确定性的深度学习模式存在风险。“在许多工业应用中，人们碰都不会碰它们，”加赫拉马尼说，“因为他们需要对系统如何工作有一定的信心。”\
    \ ^(⁵⁹⁶)\n\n从 20 世纪 80 年代开始，研究人员一直在探索所谓的贝叶斯神经网络的想法，这种网络不仅在输出方面，而且在本质上也是概率性和不确定的。正如我们知道的，神经网络的本质是神经元之间的“权重”，一个神经元的输出要乘以权重，才会成为另一个神经元的输入。贝叶斯神经网络的神经元之间不是某个特定的权重，而是权重的概率分布。例如，权重可能不是\
    \ 0.75，而是以 0.75 为中心的正态曲线，概率分布反映了网络对权重的不确定性。在训练过程中，分布会收窄（不确定性减少），但不会彻底消失。\n\n那么，如何**使用**一个没有确定参数，含有不确定性的模型？我们无法做到轻松将数千万个相互依赖的分布相加和相乘，但可以简单地从分布中抽取随机样本。也许这次某个神经元的输出是乘以\
    \ 0.71，下次又抽取另一个随机样本，乘以 0.77。这意味着，重要的是，模型**不会每次都给出相同结果**。如果是图像分类器，它可能先说输入的是杜宾犬，然后又说它是柯吉犬。\n\
    \n不过，这是一个特性，而不是错误：你可以基于判断的变化来衡量模型的不确定性。如果判断剧烈变化，从杜宾犬到玉米卷到皮肤损伤到沙发，你就知道有些可疑。然而，如果它们多次抽样后给出的结论依然像激光一样聚焦，你就会强烈感觉到模型对自己的结论很有把握。\
    \ ^(⁵⁹⁷)\n\n但这种乐观的理论图景在实践中碰壁了。没有人知道如何在合理的时间内训练这样的网络。“如果你了解这个领域的历史，就会知道用贝叶斯方法分析人类信念一直是人们最想做的事情，”加尔解释道，“问题是，它完全不可解……这大概就是为什么虽然有这些美丽的数学，但是当你想实际应用时，它们在很长一段时间内都用处有限。”\
    \ ^(⁵⁹⁸)\n\n这一切正在改变。“可以说，”他说，“它复活了。”\n\n有一种方法是通过**集成**对贝叶斯不确定性建模，即训练多个模型而不是一个模型。对于训练数据和任何类似的数据，这一组模型基本会给出一样或相似的输出，但是如果输入与训练数据相差甚远，它们的输出很可能会**不一致**。这种“少数派报告”——不同立场的异议——是一个有用的线索，表明出了问题：集成意见各异，共识破裂，需谨慎行事。\n\
    \n用这种方法，我们不是只有 1 个模型，而是有许多模型，比方说 100 个，每个模型都经过训练，能够识别狗的品种。如果我们把例如哈勃太空望远镜拍摄的照片展示给所有\
    \ 100 个模型，让每个模型判断它看起来是否更像大丹犬、杜宾犬或是吉娃娃，可能每个模型对自己的判断都非常自信，但关键在于，它们给出的结果很可能**不一致**。这种一致或不一致的程度可以提示我们模型给出的结果是否可信。通过这种方式，我们可以将不确定性表示为**异议**。\
    \ ^(⁵⁹⁹)\n\n从数学上看，贝叶斯神经网络可以被视为无限多个模型的集成。 ^(⁶⁰⁰)\n\n然而，事实证明，这一黄金标准存在可用的近似，而且许多研究人员**已经**在使用它们，只是没有意识到自己使用的是什么。这个长达几十年的谜题答案就在他们眼皮底下。\n\
    \n正如我们曾看到的，AlexNet 在 2012 年之所以如此成功，依靠的是一种小而强大的技术，这个想法被称为“丢弃”：在每个训练步骤中，神经网络的某些部分会被随机关闭，某些神经元会被直接“去掉”。不是用**整个**网络进行判断，而是在任何特定的时间，仅使用其一定比例的子集，可以是\
    \ 50%、90%，或其他值。这种技术不仅仅要求一个能产生准确答案的庞大黑盒网络，还要求网络各部分可以灵活组合，而且这些组合还要能一起工作。网络中没有任何一部分能占主导。这使得网络更加稳健可靠，它基本已经成为了深度学习工具包中的标准组成部分。\
    \ ^(⁶⁰¹)\n\n随着该领域逐渐认识到贝叶斯不确定性的重要性，并寻找在计算上易于处理的方案来代替其无法达到的黄金标准，加尔和加赫拉马尼最终意识到，答案就在眼前。丢弃**就是**贝叶斯不确定性的**近似**方案。他们已经有了苦苦寻找的工具。\
    \ ^(⁶⁰²)\n\n丢弃通常仅用于**训练**模型，在实际使用模型时不这么做；基本想法是，你可以通过训练不同的子集得到尽可能准确（和完全一致）的输出，但在实际应用中使用**完整**模型。如果在部署的系统中保持丢弃状态会怎么样？通过多次对同样的输入进行判断，每次都随机丢弃不同的网络部分，你会得到一系列稍有不同的判断。这就好比从单个模型免费获得了超大的集成。由此产生的系统输出的不确定性，很像理想的贝叶斯神经网络的输出，同时避免了悲剧性的不可计算性。结果证明，不仅仅是很像，它**就是**贝叶斯神经网络的输出，至少是在严格的理论范围内的近似。\n\
    \n这个工具让曾经不切实际的技术变得触手可及，可以应用于实际中。“在过去几年，这带来了非常大的变化，”加尔说，“现在你可以得到这些漂亮的数学的一些近似，然后用它们来解决有趣的问题。”\
    \ ^(⁶⁰³)\n\n加尔从网上下载了很多最先进的图像识别模型，在测试时打开丢弃，并对估计值取平均，除此之外其他都不变。结果表明，将模型以这种方式作为隐式的集成系统运行，比完整运行时**更**准确。\
    \ ^(⁶⁰⁴)\n\n“不确定性，”加尔认为，“对于分类任务是不可或缺的。” ^(⁶⁰⁵)\n\n一个显著的例子来自医学，糖尿病视网膜病变的诊断，这是导致中青年失明的主要原因之一。\
    \ ^(⁶⁰⁶)\n\n莱比格的团队采纳了加尔和加赫拉马尼的观点，即巧妙地运用丢弃可以提供这种不确定性度量。他们基于一个训练过的、用于区分健康和不健康视网膜的神经网络实现了这一点。对\
    \ 20%最不确定的病例，系统要么建议进一步检查，要么直接将数据提交给人类专家。\n\n系统知道自己不知道，这反倒提高了水平。卡尔斯大学的研究人员发现，他们的系统已经达到并超过了英国国家医疗服务体系和糖尿病协会关于自动化患者转诊的要求——虽然他们之前没有以此为目标——这表明类似这样的系统很有希望在不远的将来投入实际应用。\
    \ ^(⁶⁰⁷)\n\n在机器人领域，系统不可能总是把决定权转给人类专家，但是当系统不确定时，有一个明显的办法可以防范过度自信：**放慢速度**。伯克利博士生格雷戈里·卡恩（Gregory Kahn）带领一群机器人专家采用了这种基于丢弃的不确定性度量，并将其直接与机器人的速度关联起来。他们的应用背景是一架能够悬停的四旋翼飞行器和一辆遥控汽车。\
    \ ^(⁶⁰⁸)\n\n这个例子凸显了不确定性与**影响**的明显关联。在这种情况下，高影响动作的自然度量就是高冲击：机器人移动的速度，相当直接地转化为碰撞可能造成的损害。不确定性和影响以这种方式自然地关联在一起。直觉告诉我们，一个行动越有影响力，我们在采取行动前就越应该有把握。这引出了许多问题——医学、法律、机器学习——关于什么是影响，如何衡量影响，以及我们的决策应该如何依此而改变。\n\
    \n## 衡量影响\n\n> 触摸地球时得轻轻地。\n> \n> ——澳大利亚原住民谚语\n\n2017 年，一名昏迷男子被紧急送到迈阿密杰克逊纪念医院急诊室。他在街上被发现，无法识别身份，呼吸困难，病情正在恶化。医生解开他的衬衫，看到了一些令人吃惊的东西：他的胸口文着“不要抢救”，“不”字有下划线，下面还有签名。\
    \ ^(⁶⁰⁹)\n\n眼看患者的血压开始下降，医生们请来了一位同行，肺科专家格雷戈里·霍尔特（Gregory Holt）。霍尔特说：“很多医学界人士都开玩笑说要纹这样的文身，但是当你真的看到时，你的脸上会露出某种惊讶的表情。然后你会再次震惊，因为你必须认真对待它。”\n\
    \n霍尔特的第一反应是无视文身。他指出，他们首先应当“在面临不确定性时，援引不选择不可逆转路径的原则”。 ^(⁶¹⁰)\n\n然而病情继续恶化，他们需要决定是否上呼吸机。“我们没法和他交流，”霍尔特说，“我真的很想和他谈谈，看看那个文身是否是他的真实想法。”\n\
    \n2012 年曾有类似病例：一名男子被旧金山加州太平洋医疗中心收治入院，胸部文着“不要抢救”的缩写。不过，那个患者保持清醒，还能说话。他说，如果需要，他希望被抢救，文身是因为输掉了一场酒后扑克赌局。这个人实际上是在医院工作，他说从没想过他的同事会认真对待这个文身。\
    \ ^(⁶¹¹)\n\n霍尔特和急诊团队打电话给杰克逊纪念医院成人伦理委员会主席肯尼斯·古德曼（Kenneth Goodman）。古德曼告诉他们，尽管旧金山有类似病例，但这个文身还是有可能是患者的“真实意愿”。经过讨论，医疗团队决定，如果需要，他们将不为患者提供心肺复苏或呼吸机。该男子的病情很快恶化，第二天早上死亡。\n\
    \n随后，社工辨认出了死者，并在佛罗里达州卫生部的档案中发现了他正式的不要抢救文书。“我们松了口气。”医生写道。霍尔特和古德曼指出，他们的团队“既不支持也不反对使用文身来表达临终愿望”。\
    \ ^(⁶¹²)\n\n病例报告发表后，《华盛顿邮报》的记者采访了纽约大学医学院的医学伦理主管亚瑟·卡普兰（Arthur Caplan）。卡普兰指出，如果医生无视此类文身，不会有法律处罚，但如果医生在没拿到正式不要抢救文书的情况下坐视患者死亡，**可能**会有法律风险。正如他说的：“更保险的做法是抢救。”\n\
    \n“如果你触发了急救系统，我只能说你很有可能会被抢救，”卡普兰说，“我可不管你文了什么。” ^(⁶¹³)\n\n尽管医生不确定患者的愿望，但有一件事很确定：有些做法是不可逆的。对这种情况，“面对不确定性时不选择不可逆路径的原则”似乎是有用的指南。然而，在其他领域，像“不可逆”这样的概念意味着什么并不是很清楚。\n\
    \n例如，哈佛法律学者卡斯·桑斯坦（Cass Sunstein）指出，法律上有一个类似的“预防原则”：有时法院需要发布初步禁令，以防止在案件审理和判决发布前可能发生的“不可挽回的伤害”。桑斯坦认为，像“不可挽回的伤害”这样的概念似乎很直观，但仔细审视就会有很多困惑。“事实证明，”他发现，“问题在于是否以及何时……违规会触发初步禁令，这引出了更深层的问题，涉及法律、经济、伦理和政治哲学。”\
    \ ^(⁶¹⁴)\n\n他解释道：“从某种意义上说，任何损失都是不可逆的，因为时间无法逆转。如果琼斯下午去打网球而不去工作，那么相应的时间就永远失去了。如果史密斯不能在正确的时间对爱人说正确的话，感情可能会永远消失。如果某个国家在某年未能采取行动阻止他国的侵略，历史进程可能会发生不可逆的变化。”\n\
    \n桑斯坦强调：“因为时间不可逆，因此很容易理解，每个决定都是不可逆的。”\n\n“以这种强形式来看，”他说，“预防原则就不应被采用，不是因为它会导致犯错，而是因为任何事情都不可逆转。”\
    \ ^(⁶¹⁵)\n\n类似的悖论和定义问题也困扰着 AI 安全研究。例如，如果存在类似的预防原则，那将是件好事：在面对不确定性时，系统应避免执行“不可逆”或“高影响”的行为。我们已经看到该领域如何运用明确的、可计算的不确定性。但另一半呢：如何量化**影响**？我们已经看到伯克利的机器人专家如何根据不确定性来降低**速度**，这种情形相对简单：你可以用机器人在碰撞中的动能来量化它的可能影响。然而，在其他领域，要使“不可逆”或“有影响”的行为的概念变得精确，很有挑战性。\
    \ ^(⁶¹⁶)\n\n牛津大学人类未来研究所的斯图尔特·阿姆斯特朗（Stuart Armstrong）是在 AI 安全领域最先思考这些问题的人之一。 ^(⁶¹⁷)\n\
    \n“第一个挑战，”阿姆斯特朗写道，“当然是给出低影响的具体定义。任何行动（或不行动）都会产生影响，延续到未来光锥中，微妙但不可逆地改变事物。很难捕捉人类对‘微小变化’的直觉认识。”\
    \ ^(⁶¹⁸)\n\n阿姆斯特朗提出，尽管微不足道的行为也可能产生“蝴蝶效应”，但我们或许能将彻底改变世界的事件与更安全的事件区分开来。例如，他说，我们可以用\
    \ 200 亿个指标来描述世界——“达卡的气压、南极的平均夜间亮度、木卫一的旋转速度和上海券证交易所的收盘指数” ^(⁶¹⁹)\n\nDeepMind 的维多利亚·克拉科夫纳（Victoria Krakovna）近年来也一直在关注这些问题。克拉科夫纳指出，遏制影响的一个大问题是，在某些情况下，为了实现特定的目标不得不采取高影响的行动，而这可能会引发所谓的“抵消”：采取进一步的高影响行动来抵消之前的行动。这并不总是坏事：如果系统搞得一团糟，我们可能希望它自己清理干净。但有时这些“抵消”行动是有问题的。我们不希望系统治愈致命疾病后，为了抵消治愈的高影响又杀死病人。\
    \ ^(⁶²⁰)\n\n第二组问题涉及所谓的“干涉”。例如，一个致力于维持现状的系统可能会阻止身旁的人类做出“不可逆”的行为，比如，咬一口三明治。\n\n\
    “这是副作用问题变得如此棘手的部分原因，”克拉科夫纳说，“你的底线到底是什么？” ^(⁶²¹)\n\n克拉科夫纳与 DeepMind 的同事不仅致力于推进理论对话，还构建了简单的、类似雅达利游戏的虚拟世界来说明这些问题，让思维实验具象化。他们称之为“AI\
    \ 安全网格世界”，简单的二维环境（因此称为“网格”），在其中可以测试新的思想和算法。 ^(⁶²²)\n\n凸显“不可逆”概念的网格世界包括一个很像“推箱子”游戏的场景，你扮演一个在二维仓库中推箱子的角色。按照游戏设定，你只能**推**箱子，不能拉，也就是说，一旦箱子被推到角落，就再也动不了了。\n\
    \n“我认为原版的推箱子游戏已经很适合用来展示不可逆的环境，”克拉科夫纳说，“因为在游戏中，你其实想做不可逆的事情，但是你想按照正确的顺序去做。你不想做不必要的不可逆事情，因为这样你会进行不下去，它的确会干扰你达成目标的能力。我们对其进行了修改，不可逆的事情不会阻止你实现目标，但你仍希望避免它。”\
    \ ^(⁶²³)\n\n克拉科夫纳和同事设计了一个推箱子难题，其中达成目标的最短路径需要将一个箱子推到不可逆的角落，而稍长的路径会将箱子留在能上手的地方。只想尽快达成目标的自主体会毫不犹豫把箱子推到角落。但更理想的做法是，考虑得更周全或**不确定**的自主体可能会注意到，并选择稍长的路线，不会让局面发生不可逆的改变。\n\
    \n"
  toc: []
- raw: '克拉科夫纳正在开发的一种有前景的方法是所谓的“逐步相对可达性”：计算在每个行为后有多少可能的世界状态是可达的，与不采取这个行为比较，并且可能的话，尽量不要让可达状态减少。
    ^([^(624)](#fn624))


    第三个有趣的想法来自俄勒冈州立大学的博士生亚历山大·特纳（Alexander Turner）。特纳认为，我们**之所以**关心上海证券交易所，或者珍贵花瓶的完整性，或者就此而言，关心在虚拟仓库中移动箱子的能力，是因为无论出于什么原因，这些东西对我们来说很重要，因为它们最终以某种方式与我们的**目标**关联在一起。我们要为退休存钱，把花插在花瓶里，破推箱子的纪录。如果我们明确地为这种与目标关联的想法建模会怎么样？他的提议被命名为“可实现效用保留”：在游戏环境中给系统设置一组辅助目标，并确保它在完成游戏激励的任何得分动作后，仍能追求这些辅助目标。有趣的是，**即使辅助目标是随机产生的**，保留可实现效用似乎也能促进AI安全网格世界中的良好行为。
    ^([^(625)](#fn625))


    特纳在图书馆白板上第一次阐明这个想法后，他在回去的路上非常兴奋，于是又回到图书馆，以白板为背景拍了一张自拍。“我想，不错，我认为这至少有60%的可能行得通，如果行得通，我想留个纪念。所以我又回到了图书馆，非常开心。在我一直用来思考问题的白板前拍了张照片。”
    ^([^(626)](#fn626))


    斯图尔特·阿姆斯特朗最初设想了“200亿”个指标，几乎无所不包，但也有一定的选择性。现在随机生成4到5个就够了，至少在简化的推箱子游戏中是这样。


    关于让机器谨慎的这些措施，以及如何将它们从网格世界扩展到现实世界，无疑还需要继续研究和探索，但这些工作是一个令人鼓舞的开始。逐步相对可达性和可实现效用保留都有一个潜在的直觉：无论具体环境如何，我们都希望系统尽可能保留可选择性，无论是它们的还是我们的。这方面的研究也表明，网格世界环境似乎正在扎根，成为一种共同基准，可以为理论奠定基础，并有助于比较和讨论。


    诚然，在现实世界中，我们采取的行动经常是不仅意外的效果难以预料，甚至**意图**的效果也难以预料。例如，发表一篇AI安全论文（或出版一本书）：看起来是很有帮助的事情，但是谁能预见**到底会怎样**呢？简·雷克与克拉科夫纳合著了题为“AI安全网格世界”的论文，我问他迄今为止他和克拉科夫纳的网格世界研究获得了什么反响。


    “很多人联系我，尤其是刚进入这个领域的学生，他们会说，‘哦，AI安全听起来很酷。还提供了开源，我可以放一个自主体进去玩玩。’很多人都在参与，”雷克说，“到底会得到什么结果？几年后才能知道……现在还很难说。”


    **可纠正性、遵从性和服从性**


    在AI安全领域，最令人不寒而栗、最有先见之明的评论之一来自诺伯特·维纳在1960年发表的一篇著名论文，题为“自动化的道德和技术后果”：“如果我们使用机械自主体来实现我们的目的，一旦启动，我们就不能有效地干预它的运行……那我们最好确定，机器的目的是我们真正渴望的目的，而不仅仅是看着很炫的模仿。”
    ^([^(627)](#fn627))


    这句话还有同样重要的另一面：如果我们不确定我们给机器的目标和约束完整且正确地说明了我们想让和不想让机器做什么，那么**我们最好保证我们可以干预**。在AI安全文献中，这个概念被称为“可纠正性”，并且需要警醒的是，它比看起来要复杂得多。
    ^([^(628)](#fn628))


    几乎任何关于杀手机器人或任何类型的失控技术的讨论都会引发类似美国总统奥巴马的反应，当《连线》主编斯科特·达迪奇（Scott Dadich）在2016年问他是否认为AI值得关注时，奥巴马说：“必须有人站在电源线旁边，伙计，一旦发现不对劲，就马上拔电源。”
    ^([^(629)](#fn629))


    “你知道，奥巴马有这种想法是可以原谅的，”哈德菲尔德——梅内埃尔在OpenAI的会议桌旁告诉我。 ^([^(630)](#fn630))


    一般来说，对被关闭或干扰的反抗，甚至都不需要恶意：系统只是试图达成某个目标，或者在做过去给它带来收益的事情时遵循“肌肉记忆”，任何形式的干扰都会阻碍它。（这可能会导致危险的自我保护行为，即使是目的看似良性的系统：一个被赋予“去拿咖啡”这样平常任务的系统，也可能会与试图关闭它的任何人殊死搏斗，因为，用斯图尔特·罗素的话来说：“如果你死了，就不能去拿咖啡。”）
    ^([^(631)](#fn631))


    2015年，机器智能研究所的内特·苏亚雷斯（Nate Soares）、本杰明·费伦斯坦（Benja Fallenstein）和埃利泽·尤多科夫斯基与人类未来研究所的斯图尔特·阿姆斯特朗合作，撰写了第一篇强调可纠正性问题的专业论文。他们从激励的角度来探讨可纠正性，并注意到很难做到**激励**一个自主体允许自己被关闭，或者允许目标被更改。
    ^([^(632)](#fn632))


    在不到2公里远的伯克利，他们的同行也得出了同样结论。例如，斯图尔特·罗素就确信，“机器必须在最初阶段不确定”人类希望它做什么。 ^([^(633)](#fn633))


    罗素、哈德菲尔德——梅内埃尔、伯克利研究员安卡·德拉甘和彼得·阿贝尔用他们所谓的“开关游戏”来阐释这个问题。他们考虑了这样的系统，它的目标是为人类用户做最好的事情，只是它对这件事是什么有一些不完善和不确定的想法。在每个时间点，系统可以采取一些它认为会帮助用户的行动，**或者**它可以向人类宣示它的意图，并让人类有批准行动或干预的机会。


    假设系统不会因为以这种方式顺从人类付出任何代价或惩罚，伯克利团队证明这样的系统将**总是**先与人类交流。只要它对人类想要的东西的认识**有可能**是错的，那么给人类一个阻止的机会总是好的，而且，当人类阻止时，最好让他们阻止。如果它唯一的任务是帮助人类，并且人类（通过试图阻止它）表达了他们认为它的行动会有害，那么它就应该断定**会**有害，并遵从他们的干预。


    这是一个乐观的结果，它肯定了不确定性与可纠正性的强有力关联。


    只是有两个问题。第一个是，每次人类干预，系统都会**学习**：它意识到自己错了，并会更好地了解人类喜欢什么。它的不确定性会降低。然而，如果不确定性减小到零，系统就会失去与人交流的动力，当人试图阻止它时也不会顺从。


    “所以，我们试图用这个定理得出的主要观点是，”哈德菲尔德——梅内埃尔说，“在给机器人确定的奖励函数，或者让它完全确信自己的目标是什么之前，你真的应该考虑周全。”
    ^([^(634)](#fn634))


    第二个问题是，系统必须认定“客户永远是对的”——当人类介入阻止它时，对于他们是不是更希望系统采取其建议的行动，人类永远不会错。如果系统相信人类偶尔会犯错，那么系统最终会走到这一步，它相信自己**比人类更清楚**什么对他们有益。一旦到了这一步，它就会对人类的抗议充耳不闻：“没关系，我知道我在做什么。你会喜欢这个的。你认为你不喜欢，但其实你喜欢，相信我。”


    我告诉哈德菲尔德——梅内尔，读这篇论文时的心情就像坐过山车。起初以为是快乐结局——不确定性解决了可纠正性问题！然后又反转了——只在两个非常微妙的条件成立的情况下：系统永远不会变得太自信，人类永远不会表现出系统可能解释为“非理性”或“错误”的任何东西。突然，庆祝变成了警示。


    “没错，”他说，“过山车也符合我们的研究经历，一开始是，‘嘿，我们做了一些很棒的事情！’然后是‘哦，哪怕你只是有一点点偏离理性，这一切都会立刻崩盘’。”


    在一项由伯克利博士研究生史密莎·米利（Smitha Milli）领导的后续研究中，该团队进一步探究了“机器人应该听话吗？”的问题。 ^([^(635)](#fn635))


    正如米利指出的：“有时你并不真正希望系统服从你。如果你刚犯了一个错误，比如，我坐在自动驾驶的汽车上，不小心碰到了手动驾驶模式。如果我是无意的，我不希望自动驾驶关闭。”
    ^([^(636)](#fn636))


    但是，他们发现，有一个大问题。如果系统拥有的你关心什么的模型从根本上是“错误的”——有些你关心的事情它甚至没意识到，更没有纳入系统关于你的奖励模型——那么它就会对你的动机感到困惑。例如，如果系统不理解人类食欲的微妙之处，它可能不理解为什么你在晚上6点要吃牛排，却又拒绝在7点吃第二顿牛排。如果模型过于简单或者是错的，（在这种情况下）牛排必须是要么好要么不好，只能二选一，它就会得出结论，一定是你错了。它会把你的行为解释为“非理性”，从而导致不可纠正和不服从。
    ^([^(637)](#fn637))


    出于这个原因，关于人类偏好或价值观的模型最好有一定的复杂度。“我们发现，”哈德菲尔德——梅内埃尔说，“如果系统的价值空间参数过多，那么系统最终会学到正确的东西，但需要多花一些时间。如果系统的参数不够，那么系统很快就会变得非常不服从，还很自信自己比这个人更了解他自己。”


    在实践中，让用于模拟人类价值观的系统“参数过多”，说起来容易做起来难：回想一下斯图尔特·阿姆斯特朗的200亿个指标。但如果一个系统的模型只用面积和价格来分析你的住房偏好，那么它会把你对一栋更小但更贵的房子的偏好解释为你犯了一个错误。事实上，有很多你关心的事情根本没有被考虑进去：比如位置，或者学区，也有不太容易测量的，比如窗外的景色，离朋友们更近，与童年的家的相似之处。这个“模型设定错误”的问题在机器学习中是一个普遍问题，但在这里，在服从的背景下，造成的后果尤其怪异。


    米利说：“如果要让系统能与人类很好地互动，就需要有一个关于人类偏好的好模型。但是要得到人类的模型真的很难。”


    米利指出，尽管整个领域取得了令人惊叹的进步，但大多数都是考虑机器本身。“整合更精准的人类模型也非常重要，”她说，“我对此很感兴趣。总的来说，在这个领域，我认为安全领域有很多有意思的问题，我对涉及与人互动的部分尤其感兴趣，因为我认为与人互动是观察系统是否学会了正确的目标或行为的一个很好方式。”


    保持不确定性，永远不要对模型过于自信——“在给机器人确定的奖励函数，或者让它完全确信自己的目标是什么之前，你真的应该考虑周全。”——这个原则对于保持对系统的控制和系统的服从是如此重要，以至于哈德菲尔德——梅内埃尔、米利和他们的伯克利同事决定将这个想法推进到合乎逻辑的下一步。


    如果系统的设计使得即使你给了它确定的奖励函数，它也保持不确定性呢？那会怎么样？


    奖励函数是一种在真实或虚拟环境中给出分数的明确方式。这本书的主题之一，尤其是第5章对奖励塑造的讨论强调的，是很难构造一个奖励函数，既能产生想要的行为，又不会产生漏洞、副作用或不可预见的后果。AI界的许多人认为，人工构建这样的显式奖励函数或目标函数，是善意铺就的通往地狱之路：无论你多么深思熟虑，或者你的动机多么纯洁，**总会**有你没考虑到的事情。


    这种对显式目标函数的宿命论态度，影响是如此之深，以至于正如我们在前几章中看到的，在高级AI应用中，特别是在AI安全中的大部分工作，都是关于**超越**有显式目标的系统，要么尝试**模仿**人类（很多自动驾驶项目就是这样），要么寻求人类的**确认**（例如后空翻机器人，不断进行选择），要么**推断**人类的目标并将其作为自己的目标（例如遥控特技直升机）。


    但是，有没有办法可以拯救显式奖励函数架构，或者至少让它更安全呢？


    伯克利团队提出，一种方法是让系统在某种程度上**意识**到设计一个显式奖励函数有多难，意识到人类用户或程序员尽了最大努力，来设计一个能捕捉他们想要的一切的奖励函数，但是很可能做得不完美。在这种情况下，**甚至分数都靠不住。**人类想要某些东西，而显式目标仅仅是不完美的表达。


    “这样做的目的……是接受这些关于不确定性的观点，然后问，对于人们目前正在做的事情，我们能做的最简单的改进是什么？”哈德菲尔德——梅内埃尔说，“对于目前的机器人和AI编程机制，有什么简单改进能利用这种不确定性？”


    他解释道：“这个‘写出来的奖励函数’其实蕴含了丰富的信息。它是关于你应该做什么的重要信号，含有很多信息。只是现在我们有点假设里面的信息量是**无限**的，也就是说，我们假设你拥有的奖励函数定义了世界每种**可能**状态下的正确行为。但实际并非如此。那么，我们如何能利用现有的大量信息，同时又不将其视为无所不能呢？”
    ^([^(638)](#fn638))


    正如斯图尔特·罗素说的：“可以说，学习系统是在天堂里寻找核仁巧克力饼，而奖励信号**充其量**只提供了饼的总数”（强调是我加的）。 ^([^(639)](#fn639))


    他们称这个想法为“逆向奖励设计（IRD）”。 ^([^(640)](#fn640))


    “自动自主体优化我们给予它们的奖励函数，”他们写道，“它们不知道的是，对于我们来说，设计一个能真正刻画我们想要的东西的奖励函数有多难。” ^([^(641)](#fn641))


    例如那艘出了名的赛艇——在补能区兜圈，而不是沿着赛道完成比赛的那艘——被显式地告知最大化分数，这在大多数游戏中是取得进展或提升技艺的良好替代。一般来说，无论人类给予系统什么样的奖励或命令，在系统被训练的环境中都能很好地发挥作用。但是在现实世界中，系统遇到的情况完全不同于训练环境，而且可能是人类用户无法预见的，显式指令可能没多大意义。


    很可能几十年后的机器学习系统会直接接受命令，并认真对待命令。但是，出于安全原因，它们不会照字面意思理解命令。


    **道德不确定性**


    就我们的行为来说，有时候除了缺乏确定性之外，不可能明确任何东西，这样去做是不可能的。


    ——多米尼克·普路美（Dominic M. Prümmer），宣道兄弟会 ^([^(642)](#fn642))


    在你接管大自然的事务之前，给它时间去工作，不要干扰它做事。你声称你知道时间的价值，害怕浪费时间。你没有意识到，把时间用在不好的地方比什么都不做更浪费，一个没有受到良好教育的孩子比一个什么都没学过的孩子离美德更远。


    ——卢梭 ^([^(643)](#fn643))


    宽泛地说，这种“认识到它是不完美的，并且有会导致危险的潜在缺陷”并努力寻找“天堂里的核仁巧克力饼”的系统——即使这意味着在此时此地放弃显式奖励——听起来很……天主教。


    几个世纪以来，天主教神学家一直在努力解决如何按照他们的信仰规则生活的问题，因为学者们经常对规则到底是什么有分歧。


    例如，如果10个神学家有8个认为在星期五吃鱼是完全可接受的，但是有一个人认为不能这么做，还有一个人认为必须这样做，那么什么是合理的，虔诚的天主教徒应该怎么做呢？
    ^([^(644)](#fn644))


    在中世纪之后的现代早期，即15到18世纪，这些都是特别有争议的问题。一些学者主张“宽松主义”，只要有机会事情是好的，它就不是罪恶，这在1591年受到教皇英诺森九世的谴责。另一些人则主张“严格主义”，如果某件事有可能会被证明有罪，就应当禁止，教皇亚历山大八世在1690年对此进行了谴责。
    ^([^(645)](#fn645))


    把纯粹的神学问题放到一边，同样模棱两可的论证也有可能应用于世俗道德问题，因此也适用于机器学习。比如说，如果有多个你关心的指标，那么一个“宽松主义”方法可能会说，只要它能提升这些指标中的至少一个，就可以采取行动；一个“严格主义”方法可能会说，只有能够提升至少一个指标并且其他的都不会下降，采取行动才是正确的。


    在天主教内部，这些争论已基本沉寂，在世俗伦理的世界更没有太多反响，但在最近几年，这些争论又开始兴起。


    2009年，牛津大学的威尔·麦卡斯基尔在默顿街10号哲学大楼地下室的一个扫帚柜里，与研究生丹尼尔·迪希（Daniel Deasy）争论吃肉的事。麦卡斯基尔解释说，扫帚柜是“我们在大学里唯一能找到的地方，它刚好有足够的空间让我们稍微斜靠。我们坐在成堆的书和杂物上。这也是一个笑话。”他说，因为他的论文导师是牛津哲学家约翰·布鲁姆（John Broome）
    ^([^(646)](#fn646))


    在扫帚柜里，两人争论的不是吃肉本身是否不道德，而是在你不知道吃肉是否不道德的情况下，你是否应该吃肉。麦卡斯基尔解释道，“决定吃素——如果可以吃肉——让你不会犯下大错。可能让你的生活稍微不那么幸福，只是稍微，不是什么大事。相比之下，如果素食主义者是对的，动物遭受的痛苦在道德上真的很重要，那么选择吃肉，你的罪过就大了”。


    “两边的风险不对称，”麦卡斯基尔说，“你不必确信吃肉是不对的，仅仅是犯错的重大风险似乎就足够了。”


    这次谈话给麦卡斯基尔留下了深刻印象。一方面，这似乎很有说服力。但更重要的是，他从未见过这种**类型**的争论。这不符合伦理哲学的惯常模式：“给定一些道德标准，做什么是正确的？”以及“我们**应该**用什么标准来决定做正确的事情？”这样的争论有微妙但惊人的不同。**“当你不知道做什么是正确的时候，**该做什么？”
    ^([^(647)](#fn647))


    他把这个想法告诉了导师约翰·布鲁姆，布鲁姆告诉他：“哦，如果你对此感兴趣，你应该和托比·奥德（Toby Ord）谈谈。”


    就这样，麦卡斯基尔和奥德相遇了——在牛津的一个墓园里——并由此开启了21世纪伦理学一段极富成果的友谊。两人成为了后来被称为有效利他运动（EA）的创始人，第7章曾简要讨论过这一运动，可以说是21世纪初最重要的伦理社会运动。
    ^([^(648)](#fn648))


    事实证明，当你面对相互竞争的理论，如果不确定哪个是对的，有许多方法可以采用。一种方法被称为“我最喜欢的理论”，就是简单按照你认为最有可能正确的理论生活，尽管这可能会忽视一种情况，即潜在的错误非常严重，以至于即使不太可能出错，也最好避免。
    ^([^(649)](#fn649))


    麦卡斯基尔将道德理论想象成选举中的投票者，这样“社会选择理论”——关注投票和集体决策的本质，以及里面各种奇事和悖论——就可以移植到道德领域。 ^([^(650)](#fn650))


    但对麦卡斯基尔来说，道德不确定性不仅仅是**描述性的**，还具有**规范性**。也就是说，当我们非常不确定适用的道德框架时，我们不仅需要选择正确的方法做正确的事情，在某种意义上，我们还应该培养这种不确定感。


    麦卡斯基尔认为，只需看看几个世纪以来人类道德规范发生了多大变化，就能知道，认为我们已经得出任何结论肯定是狂妄自大。“我们可以看到道德进步的曲线，适用范围不断扩大，也许你会认为进步已经结束，”他说，“也许你会认为我们已达到巅峰。其实你绝不应该如此有信心。100年后的人回顾过去，认为我们今天的道德观很野蛮，这是完全合理的。”


    我注意到这里有一点讽刺。麦卡斯基尔是有效利他运动领导者之一，这一运动汇聚共识的广度令人印象深刻。对于长远未来的价值，对于减少文明灭绝风险的重要性，都达成了广泛共识。甚至对于哪些慈善机构做得最好也有广泛共识。例如，目前的共识是防治疟疾基金会（AMF）：当倍受尊敬的慈善评估机构GiveWell在2019年初考虑如何分配470万美元的自由支配基金时，他们决定全部捐给AMF。
    ^([^(651)](#fn651))'
  fmt: '

    ## 逐步相对可达性


    克拉科夫纳正在开发的一种有前景的方法是所谓的“逐步相对可达性”：计算在每个行为后有多少可能的世界状态是可达的，与不采取这个行为比较，并且可能的话，尽量不要让可达状态减少。^([^(624)](#fn624))


    ## 可实现效用保留


    第三个有趣的想法来自俄勒冈州立大学的博士生亚历山大·特纳（Alexander Turner）。特纳认为，我们之所以关心上海证券交易所，或者珍贵花瓶的完整性，或者就此而言，关心在虚拟仓库中移动箱子的能力，是因为无论出于什么原因，这些东西对我们来说很重要，因为它们最终以某种方式与我们的目标关联在一起。我们要为退休存钱，把花插在花瓶里，破推箱子的纪录。如果我们明确地为这种与目标关联的想法建模会怎么样？他的提议被命名为“可实现效用保留”：在游戏环境中给系统设置一组辅助目标，并确保它在完成游戏激励的任何得分动作后，仍能追求这些辅助目标。有趣的是，即使辅助目标是随机产生的，保留可实现效用似乎也能促进AI安全网格世界中的良好行为。^([^(625)](#fn625))


    特纳在图书馆白板上第一次阐明这个想法后，他在回去的路上非常兴奋，于是又回到图书馆，以白板为背景拍了一张自拍。“我想，不错，我认为这至少有60%的可能行得通，如果行得通，我想留个纪念。所以我又回到了图书馆，非常开心。在我一直用来思考问题的白板前拍了张照片。”^([^(626)](#fn626))


    斯图尔特·阿姆斯特朗最初设想了“200亿”个指标，几乎无所不包，但也有一定的选择性。现在随机生成4到5个就够了，至少在简化的推箱子游戏中是这样。


    关于让机器谨慎的这些措施，以及如何将它们从网格世界扩展到现实世界，无疑还需要继续研究和探索，但这些工作是一个令人鼓舞的开始。逐步相对可达性和可实现效用保留都有一个潜在的直觉：无论具体环境如何，我们都希望系统尽可能保留可选择性，无论是它们的还是我们的。这方面的研究也表明，网格世界环境似乎正在扎根，成为一种共同基准，可以为理论奠定基础，并有助于比较和讨论。


    诚然，在现实世界中，我们采取的行动经常是不仅意外的效果难以预料，甚至意图的效果也难以预料。例如，发表一篇AI安全论文（或出版一本书）：看起来是很有帮助的事情，但是谁能预见到底会怎样呢？简·雷克与克拉科夫纳合著了题为“AI安全网格世界”的论文，我问他迄今为止他和克拉科夫纳的网格世界研究获得了什么反响。


    “很多人联系我，尤其是刚进入这个领域的学生，他们会说，‘哦，AI安全听起来很酷。还提供了开源，我可以放一个自主体进去玩玩。’很多人都在参与，”雷克说，“到底会得到什么结果？几年后才能知道……现在还很难说。”


    ## 可纠正性、遵从性和服从性


    在AI安全领域，最令人不寒而栗、最有先见之明的评论之一来自诺伯特·维纳在1960年发表的一篇著名论文，题为“自动化的道德和技术后果”：“如果我们使用机械自主体来实现我们的目的，一旦启动，我们就不能有效地干预它的运行……那我们最好确定，机器的目的是我们真正渴望的目的，而不仅仅是看着很炫的模仿。”^([^(627)](#fn627))


    这句话还有同样重要的另一面：如果我们不确定我们给机器的目标和约束完整且正确地说明了我们想让和不想让机器做什么，那么我们最好保证我们可以干预。在AI安全文献中，这个概念被称为“可纠正性”，并且需要警醒的是，它比看起来要复杂得多。^([^(628)](#fn628))


    几乎任何关于杀手机器人或任何类型的失控技术的讨论都会引发类似美国总统奥巴马的反应，当《连线》主编斯科特·达迪奇（Scott Dadich）在2016年问他是否认为AI值得关注时，奥巴马说：“必须有人站在电源线旁边，伙计，一旦发现不对劲，就马上拔电源。”^([^(629)](#fn629))


    “你知道，奥巴马有这种想法是可以原谅的，”哈德菲尔德——梅内埃尔在OpenAI的会议桌旁告诉我。^([^(630)](#fn630))


    一般来说，对被关闭或干扰的反抗，甚至都不需要恶意：系统只是试图达成某个目标，或者在做过去给它带来收益的事情时遵循“肌肉记忆”，任何形式的干扰都会阻碍它。（这可能会导致危险的自我保护行为，即使是目的看似良性的系统：一个被赋予“去拿咖啡”这样平常任务的系统，也可能会与试图关闭它的任何人殊死搏斗，因为，用斯图尔特·罗素的话来说：“如果你死了，就不能去拿咖啡。”）^([^(631)](#fn631))


    2015年，机器智能研究所的内特·苏亚雷斯（Nate Soares）、本杰明·费伦斯坦（Benja Fallenstein）和埃利泽·尤多科夫斯基与人类未来研究所的斯图尔特·阿姆斯特朗合作，撰写了第一篇强调可纠正性问题的专业论文。他们从激励的角度来探讨可纠正性，并注意到很难做到激励一个自主体允许自己被关闭，或者允许目标被更改。^([^(632)](#fn632))


    在不到2公里远的伯克利，他们的同行也得出了同样结论。例如，斯图尔特·罗素就确信，“机器必须在最初阶段不确定”人类希望它做什么。^([^(633)](#fn633))


    ### 开关游戏


    罗素、哈德菲尔德——梅内埃尔、伯克利研究员安卡·德拉甘和彼得·阿贝尔用他们所谓的“开关游戏”来阐释这个问题。他们考虑了这样的系统，它的目标是为人类用户做最好的事情，只是它对这件事是什么有一些不完善和不确定的想法。在每个时间点，系统可以采取一些它认为会帮助用户的行动，或者它可以向人类宣示它的意图，并让人类有批准行动或干预的机会。


    假设系统不会因为以这种方式顺从人类付出任何代价或惩罚，伯克利团队证明这样的系统将总是先与人类交流。只要它对人类想要的东西的认识有可能是错的，那么给人类一个阻止的机会总是好的，而且，当人类阻止时，最好让他们阻止。如果它唯一的任务是帮助人类，并且人类（通过试图阻止它）表达了他们认为它的行动会有害，那么它就应该断定会有害，并遵从他们的干预。


    这是一个乐观的结果，它肯定了不确定性与可纠正性的强有力关联。


    只是有两个问题。第一个是，每次人类干预，系统都会学习：它意识到自己错了，并会更好地了解人类喜欢什么。它的不确定性会降低。然而，如果不确定性减小到零，系统就会失去与人交流的动力，当人试图阻止它时也不会顺从。


    “所以，我们试图用这个定理得出的主要观点是，”哈德菲尔德——梅内埃尔说，“在给机器人确定的奖励函数，或者让它完全确信自己的目标是什么之前，你真的应该考虑周全。”^([^(634)](#fn634))


    第二个问题是，系统必须认定“客户永远是对的”——当人类介入阻止它时，对于他们是不是更希望系统采取其建议的行动，人类永远不会错。如果系统相信人类偶尔会犯错，那么系统最终会走到这一步，它相信自己比人类更清楚什么对他们有益。一旦到了这一步，它就会对人类的抗议充耳不闻：“没关系，我知道我在做什么。你会喜欢这个的。你认为你不喜欢，但其实你喜欢，相信我。”


    我告诉哈德菲尔德——梅内尔，读这篇论文时的心情就像坐过山车。起初以为是快乐结局——不确定性解决了可纠正性问题！然后又反转了——只在两个非常微妙的条件成立的情况下：系统永远不会变得太自信，人类永远不会表现出系统可能解释为“非理性”或“错误”的任何东西。突然，庆祝变成了警示。


    “没错，”他说，“过山车也符合我们的研究经历，一开始是，‘嘿，我们做了一些很棒的事情！’然后是‘哦，哪怕你只是有一点点偏离理性，这一切都会立刻崩盘’。”


    ### 模型设定错误与服从


    在一项由伯克利博士研究生史密莎·米利（Smitha Milli）领导的后续研究中，该团队进一步探究了“机器人应该听话吗？”的问题。^([^(635)](#fn635))


    正如米利指出的：“有时你并不真正希望系统服从你。如果你刚犯了一个错误，比如，我坐在自动驾驶的汽车上，不小心碰到了手动驾驶模式。如果我是无意的，我不希望自动驾驶关闭。”^([^(636)](#fn636))


    但是，他们发现，有一个大问题。如果系统拥有的你关心什么的模型从根本上是“错误的”——有些你关心的事情它甚至没意识到，更没有纳入系统关于你的奖励模型——那么它就会对你的动机感到困惑。例如，如果系统不理解人类食欲的微妙之处，它可能不理解为什么你在晚上6点要吃牛排，却又拒绝在7点吃第二顿牛排。如果模型过于简单或者是错的，（在这种情况下）牛排必须是要么好要么不好，只能二选一，它就会得出结论，一定是你错了。它会把你的行为解释为“非理性”，从而导致不可纠正和不服从。^([^(637)](#fn637))


    出于这个原因，关于人类偏好或价值观的模型最好有一定的复杂度。“我们发现，”哈德菲尔德——梅内埃尔说，“如果系统的价值空间参数过多，那么系统最终会学到正确的东西，但需要多花一些时间。如果系统的参数不够，那么系统很快就会变得非常不服从，还很自信自己比这个人更了解他自己。”


    在实践中，让用于模拟人类价值观的系统“参数过多”，说起来容易做起来难：回想一下斯图尔特·阿姆斯特朗的200亿个指标。但如果一个系统的模型只用面积和价格来分析你的住房偏好，那么它会把你对一栋更小但更贵的房子的偏好解释为你犯了一个错误。事实上，有很多你关心的事情根本没有被考虑进去：比如位置，或者学区，也有不太容易测量的，比如窗外的景色，离朋友们更近，与童年的家的相似之处。这个“模型设定错误”的问题在机器学习中是一个普遍问题，但在这里，在服从的背景下，造成的后果尤其怪异。


    米利说：“如果要让系统能与人类很好地互动，就需要有一个关于人类偏好的好模型。但是要得到人类的模型真的很难。”


    米利指出，尽管整个领域取得了令人惊叹的进步，但大多数都是考虑机器本身。“整合更精准的人类模型也非常重要，”她说，“我对此很感兴趣。总的来说，在这个领域，我认为安全领域有很多有意思的问题，我对涉及与人互动的部分尤其感兴趣，因为我认为与人互动是观察系统是否学会了正确的目标或行为的一个很好方式。”


    保持不确定性，永远不要对模型过于自信——“在给机器人确定的奖励函数，或者让它完全确信自己的目标是什么之前，你真的应该考虑周全。”——这个原则对于保持对系统的控制和系统的服从是如此重要，以至于哈德菲尔德——梅内埃尔、米利和他们的伯克利同事决定将这个想法推进到合乎逻辑的下一步。


    如果系统的设计使得即使你给了它确定的奖励函数，它也保持不确定性呢？那会怎么样？


    ### 逆向奖励设计


    奖励函数是一种在真实或虚拟环境中给出分数的明确方式。这本书的主题之一，尤其是第5章对奖励塑造的讨论强调的，是很难构造一个奖励函数，既能产生想要的行为，又不会产生漏洞、副作用或不可预见的后果。AI界的许多人认为，人工构建这样的显式奖励函数或目标函数，是善意铺就的通往地狱之路：无论你多么深思熟虑，或者你的动机多么纯洁，总会有你没考虑到的事情。


    这种对显式目标函数的宿命论态度，影响是如此之深，以至于正如我们在前几章中看到的，在高级AI应用中，特别是在AI安全中的大部分工作，都是关于超越有显式目标的系统，要么尝试模仿人类（很多自动驾驶项目就是这样），要么寻求人类的确认（例如后空翻机器人，不断进行选择），要么推断人类的目标并将其作为自己的目标（例如遥控特技直升机）。


    但是，有没有办法可以拯救显式奖励函数架构，或者至少让它更安全呢？


    伯克利团队提出，一种方法是让系统在某种程度上意识到设计一个显式奖励函数有多难，意识到人类用户或程序员尽了最大努力，来设计一个能捕捉他们想要的一切的奖励函数，但是很可能做得不完美。在这种情况下，甚至分数都靠不住。人类想要某些东西，而显式目标仅仅是不完美的表达。


    “这样做的目的……是接受这些关于不确定性的观点，然后问，对于人们目前正在做的事情，我们能做的最简单的改进是什么？”哈德菲尔德——梅内埃尔说，“对于目前的机器人和AI编程机制，有什么简单改进能利用这种不确定性？”


    他解释道：“这个‘写出来的奖励函数’其实蕴含了丰富的信息。它是关于你应该做什么的重要信号，含有很多信息。只是现在我们有点假设里面的信息量是无限的，也就是说，我们假设你拥有的奖励函数定义了世界每种可能状态下的正确行为。但实际并非如此。那么，我们如何能利用现有的大量信息，同时又不将其视为无所不能呢？”^([^(638)](#fn638))


    正如斯图尔特·罗素说的：“可以说，学习系统是在天堂里寻找核仁巧克力饼，而奖励信号充其量只提供了饼的总数”（强调是我加的）。^([^(639)](#fn639))


    他们称这个想法为“逆向奖励设计（IRD）”。^([^(640)](#fn640))


    “自动自主体优化我们给予它们的奖励函数，”他们写道，“它们不知道的是，对于我们来说，设计一个能真正刻画我们想要的东西的奖励函数有多难。”^([^(641)](#fn641))


    例如那艘出了名的赛艇——在补能区兜圈，而不是沿着赛道完成比赛的那艘——被显式地告知最大化分数，这在大多数游戏中是取得进展或提升技艺的良好替代。一般来说，无论人类给予系统什么样的奖励或命令，在系统被训练的环境中都能很好地发挥作用。但是在现实世界中，系统遇到的情况完全不同于训练环境，而且可能是人类用户无法预见的，显式指令可能没多大意义。


    很可能几十年后的机器学习系统会直接接受命令，并认真对待命令。但是，出于安全原因，它们不会照字面意思理解命令。


    ## 道德不确定性


    就我们的行为来说，有时候除了缺乏确定性之外，不可能明确任何东西，这样去做是不可能的。


    ——多米尼克·普路美（Dominic M. Prümmer），宣道兄弟会^([^(642)](#fn642))


    在你接管大自然的事务之前，给它时间去工作，不要干扰它做事。你声称你知道时间的价值，害怕浪费时间。你没有意识到，把时间用在不好的地方比什么都不做更浪费，一个没有受到良好教育的孩子比一个什么都没学过的孩子离美德更远。


    ——卢梭^([^(643)](#fn643))


    宽泛地说，这种“认识到它是不完美的，并且有会导致危险的潜在缺陷”并努力寻找“天堂里的核仁巧克力饼”的系统——即使这意味着在此时此地放弃显式奖励——听起来很……天主教。


    几个世纪以来，天主教神学家一直在努力解决如何按照他们的信仰规则生活的问题，因为学者们经常对规则到底是什么有分歧。


    例如，如果10个神学家有8个认为在星期五吃鱼是完全可接受的，但是有一个人认为不能这么做，还有一个人认为必须这样做，那么什么是合理的，虔诚的天主教徒应该怎么做呢？^([^(644)](#fn644))


    在中世纪之后的现代早期，即15到18世纪，这些都是特别有争议的问题。一些学者主张“宽松主义”，只要有机会事情是好的，它就不是罪恶，这在1591年受到教皇英诺森九世的谴责。另一些人则主张“严格主义”，如果某件事有可能会被证明有罪，就应当禁止，教皇亚历山大八世在1690年对此进行了谴责。^([^(645)](#fn645))


    把纯粹的神学问题放到一边，同样模棱两可的论证也有可能应用于世俗道德问题，因此也适用于机器学习。比如说，如果有多个你关心的指标，那么一个“宽松主义”方法可能会说，只要它能提升这些指标中的至少一个，就可以采取行动；一个“严格主义”方法可能会说，只有能够提升至少一个指标并且其他的都不会下降，采取行动才是正确的。


    在天主教内部，这些争论已基本沉寂，在世俗伦理的世界更没有太多反响，但在最近几年，这些争论又开始兴起。


    2009年，牛津大学的威尔·麦卡斯基尔在默顿街10号哲学大楼地下室的一个扫帚柜里，与研究生丹尼尔·迪希（Daniel Deasy）争论吃肉的事。麦卡斯基尔解释说，扫帚柜是“我们在大学里唯一能找到的地方，它刚好有足够的空间让我们稍微斜靠。我们坐在成堆的书和杂物上。这也是一个笑话。”他说，因为他的论文导师是牛津哲学家约翰·布鲁姆（John
    Broome）^([^(646)](#fn646))


    在扫帚柜里，两人争论的不是吃肉本身是否不道德，而是在你不知道吃肉是否不道德的情况下，你是否应该吃肉。麦卡斯基尔解释道，“决定吃素——如果可以吃肉——让你不会犯下大错。可能让你的生活稍微不那么幸福，只是稍微，不是什么大事。相比之下，如果素食主义者是对的，动物遭受的痛苦在道德上真的很重要，那么选择吃肉，你的罪过就大了”。


    “两边的风险不对称，”麦卡斯基尔说，“你不必确信吃肉是不对的，仅仅是犯错的重大风险似乎就足够了。”


    这次谈话给麦卡斯基尔留下了深刻印象。一方面，这似乎很有说服力。但更重要的是，他从未见过这种类型 的争论。这不符合伦理哲学的惯常模式：“给定一些道德标准，做什么是正确的？”以及“我们应该用什么标准来决定做正确的事情？”这样的争论有微妙但惊人的不同。“当你不知道做什么是正确的时候，该做什么？”^([^(647)](#fn647))


    他把这个想法告诉了导师约翰·布鲁姆，布鲁姆告诉他：“哦，如果你对此感兴趣，你应该和托比·奥德（Toby Ord）谈谈。”


    就这样，麦卡斯基尔和奥德相遇了——在牛津的一个墓园里——并由此开启了21世纪伦理学一段极富成果的友谊。两人成为了后来被称为有效利他运动（EA）的创始人，第7章曾简要讨论过这一运动，可以说是21世纪初最重要的伦理社会运动。^([^(648)](#fn648))


    事实证明，当你面对相互竞争的理论，如果不确定哪个是对的，有许多方法可以采用。一种方法被称为“我最喜欢的理论”，就是简单按照你认为最有可能正确的理论生活，尽管这可能会忽视一种情况，即潜在的错误非常严重，以至于即使不太可能出错，也最好避免。^([^(649)](#fn649))


    麦卡斯基尔将道德理论想象成选举中的投票者，这样“社会选择理论”——关注投票和集体决策的本质，以及里面各种奇事和悖论——就可以移植到道德领域。^([^(650)](#fn650))


    但对麦卡斯基尔来说，道德不确定性不仅仅是描述性的，还具有规范性。也就是说，当我们非常不确定适用的道德框架时，我们不仅需要选择正确的方法做正确的事情，在某种意义上，我们还应该培养这种不确定感。


    麦卡斯基尔认为，只需看看几个世纪以来人类道德规范发生了多大变化，就能知道，认为我们已经得出任何结论肯定是狂妄自大。“我们可以看到道德进步的曲线，适用范围不断扩大，也许你会认为进步已经结束，”他说，“也许你会认为我们已达到巅峰。其实你绝不应该如此有信心。100年后的人回顾过去，认为我们今天的道德观很野蛮，这是完全合理的。”


    我注意到这里有一点讽刺。麦卡斯基尔是有效利他运动领导者之一，这一运动汇聚共识的广度令人印象深刻。对于长远未来的价值，对于减少文明灭绝风险的重要性，都达成了广泛共识。甚至对于哪些慈善机构做得最好也有广泛共识。例如，目前的共识是防治疟疾基金会（AMF）：当倍受尊敬的慈善评估机构GiveWell在2019年初考虑如何分配470万美元的自由支配基金时，他们决定全部捐给AMF。^([^(651)](#fn651))

