    8 月 26 日。↩


    222. Breiman 等，《分类与回归树》。↩


    223. 参见 Letham 等，“《使用规则和贝叶斯分析的可解释分类器》”。↩


    224. 参见例如，Veasey&Rosen，“《成人阻塞性睡眠呼吸暂停》”。↩


    225. 例如，可以使用逻辑回归来建立模型，然后对系数四舍五入。↩


