- raw: '然而，12年后的2019年秋天，一份免责声明出现在LFW的网页上，提出了不同观点：“许多群体在LFW中的代表性不足。比如儿童很少，没有婴儿，80岁以上的人很少，女性相对较少。此外，许多族裔的代表很少，或者根本没有代表。”
    ^([^(63)](#fn63))


    近年来，这些训练集的组成受到了越来越多的关注，尽管仍有许多工作要做。2015年，美国国家情报总监办公室和情报高级研究计划局发布了一个名为IJB-A的人脸图像数据集，他们吹嘘该数据集的“对象具有广泛的地理多样性”。
    ^([^(64)](#fn64))


    布兰维尼最终意识到，应该去“解决这个问题”的正是她自己。她开始对人脸检测系统的现状进行广泛调研，这成了她在MIT的论文。她和格布鲁决定创建一个能更平衡反映性别和肤色的数据集。但从哪里得到图像呢？以前的数据集从在线新闻之类的来源提取，完全不平衡。她们决定借鉴代议制，汇集6个国家的代表构建数据集：卢旺达、塞内加尔、南非、冰岛、芬兰和瑞典。这个数据集在年龄、光照和姿势等方面明显不均匀，几乎所有对象都是中年或更大年龄，处于图片中心，带着中性或微笑表情直视镜头。但是，以肤色和性别来衡量，它可以说是迄今为止最多样化的机器学习数据集。
    ^([^(65)](#fn65))


    有了这个代议制数据集，布兰维尼和格布鲁测试了3个商业级的人脸识别系统，分别来自IBM、微软和中国的旷视科技——被广泛使用的Face++软件的制造商。


    从整个数据集来看，这3个系统在分类性别方面的准确率都很高，约为90%；识别男性面部的准确率比女性高10%到20%；识别浅肤色面孔的准确率也比深肤色高10%到20%。但是，当布兰维尼将两者放到一起分析时，结果令人震惊。这3个系统在对深肤色女性的面孔进行识别时，表现都非常糟糕。例如，IBM的系统识别浅肤色男性的错误率仅为0.3%，但识别深肤色女性的错误率为34.7%，高出100倍以上。


    废奴主义者和女权活动家索杰纳·特鲁斯（Sojourner Truth）1851年的演讲《我不是女人吗？》闻名于世。布兰维尼在21世纪尖锐地回应了这个问题，她指出特鲁斯的照片被当代商业人脸识别软件一次又一次错误归类为男性。
    ^([^(66)](#fn66))


    2017年12月22日，布兰维尼向这3家公司发送了她的研究结果，解释说她会在即将召开的会议上展示这些结果，希望这几家公司给出回应。旷视科技没有回应。微软给出了不痛不痒的回应：“我们认为AI技术的公平性是该行业的一个重要问题，微软非常重视。我们已在采取措施提高面部识别技术的准确率，我们还在继续投资研究，以识别、理解和消除偏见。”
    ^([^(67)](#fn67))


    “改变是可能的。”她说。要弥补这一性能差距，并不存在根本性的技术或其他障碍，只需要有人正确提出质疑。


    布兰维尼和格布鲁的研究告诉了我们，当一家公司宣称他们的系统“99%准确”时，我们该如何质疑：在什么上准确？对谁准确？这也提醒我们，每个机器学习系统都是某种议会，在议会中，训练数据代表着更大范围的选民——而且，确保每个人都有投票权至关重要。
    ^([^(68)](#fn68))


    机器学习系统的偏见通常是训练系统所依赖的数据直接导致的——因此，在使用数据来训练将会影响人类的实际系统之前，了解数据集代表谁，以及所代表的程度非常重要。


    但是，如果你的数据集已经尽可能具有包容性——比如说，囊括了几乎所有书面语言，几千亿个词汇——而这个世界本身就有偏见，你该怎么做？


    **分布假说：词嵌入**


    观其伴而知其意。


    ——约翰·弗斯 ^([^(69)](#fn69))


    假设你在冲上海滩的瓶子里发现了纸条；有几个部分已经读不出来了。你看到一句话：“我把宝藏埋在\_\_\_\_\_北面的海边。”你肯定很想知道缺失的词是什么。


    你应该不会认为这个词会是“仓鼠”“甜甜圈”或“假发”。根据常识，有理由不会是这些：仓鼠会乱跑，甜甜圈会生物降解，假发会被风吹走，这些都不是长期藏宝的可靠标记。你可以推断，如果要藏宝几个月或几年，肯定会参照某种稳固的、不太可能分解或移动的东西。


    再假设你是一台完全没有这些常识的计算机——更不用说设身处地思考藏宝的人会怎么想——但你拥有庞大的真实文本样本（“语料库”），可以用来识别模式。只根据语言本身的统计数据来猜测缺失的词语，你能做得多好？


    构建这类猜测模型一直是计算语言学的圣杯。 ^([^(70)](#fn70))


    理想情况下，即使某个特定的短语在语料库中从未出现，我们也希望能够做出合理猜测。基于计数的方法对此没什么办法。“我啜了一口黄疸色的\_\_\_\_\_”，我们可以想见“霞多丽酒”比“木炭”更有可能，即使在语言史上，这两个词的前面都没有出现过“黄疸色的”。对这种情形，计数法无计可施。同样，如果我们尝试考虑更多上下文，并不会让问题更简单，因为考虑的短语越长，就越有可能遇到从未见过的东西。


    这个问题被称为“维度灾难”，从一开始就困扰着这种基于计数的方法。 ^([^(71)](#fn71))


    有更好的方法吗？


    还有一种方法是所谓的“分布式表示”。 ^([^(72)](#fn72))


    这种方法依赖于一个假说，简单来说就是：“相似”的词在空间中的位置会比较近。这样相似度就可以用数字刻画。基本原理是将词转换为（“嵌入”）一组数字（“向量”），这些数字是词在空间中的“坐标”。这组坐标被称为词的表示。（例如word2vec用了介于-1.0到1.0之间的300个小数。）这样就能测量词与词的“相似度”：坐标距离有多远？
    ^([^(73)](#fn73))


    我们要做的就是将词**通过某种方式**嵌入这个空间，让它们能尽可能正确猜测缺失的词。（至少在这个特定的模型架构允许的范围内做得尽可能好。）


    如何得到这些表示呢？当然是随机梯度下降！首先，将词随机散布在整个空间。然后，从语料库中随机选取一个短语，隐藏一个词，并询问系统哪个词可以填这个空。


    如果模型猜错了，就调整词的坐标，将正确的词稍微推向上下文词汇所在的空间位置，将不正确的猜测稍微推离。微调后，随机选取另一个短语，再次执行这个过程。这样不断反复。
    ^([^(74)](#fn74))


    斯坦福计算语言学家克里斯托弗·曼宁（Christopher Manning）解释道，“这时，某种奇迹发生了”。


    用他的话说：


    这很令人吃惊——但的确是真的——你直接树立猜测的目标，让每个词的词向量都能关联出现在上下文中的词，反过来也是如此——你只有一个非常简单的目标——你对如何实现这个目标只字不提——你只是祈祷，依靠深度学习的魔力……奇迹发生了。然后词向量就出来了，它们在表示词汇的意义方面非常强大，对各种事情都很有用。
    ^([^(75)](#fn75))


    有人可能会说，这些嵌入实际上捕捉到了我们语言的非常多的微妙之处。的确如此，它们以惊人的清晰度捕捉到了我们自己都不愿看到的东西。


    **嵌入的阴暗面**


    人性这根曲木，决然造不出任何笔直的东西。


    ——康德 ^([^(76)](#fn76))


    像这样的词嵌入模型，包括谷歌的word2vec和斯坦福的GloVe，已成为计算语言学的事实标准，自2013年以来，几乎支撑了所有涉及语言的计算机应用，无论是搜索结果排序、机器翻译，还是根据评论分析消费者情绪。
    ^([^(77)](#fn77))


    事实上，尽管嵌入很简单——每个词都只有一列数字，基于对文本中缺失词汇的猜测——但似乎捕捉到了惊人数量的真实世界的信息。


    例如，你可以将两个向量相加，得到一个新向量，然后搜索最近的词。得到的结果经常令人震惊：


    捷克+货币=克朗


    越南+首都=河内


    德国+航空=汉莎


    法国+女演员=朱丽叶·比诺什 ^([^(78)](#fn78))


    你也可以将词**相减**。这样就可以得到两个词之间的“差异”，然后将差值与第三个词相加来生成“类比”，简直不可思议。 ^([^(79)](#fn79))


    输出的类比表明嵌入已经捕捉到了地理位置：


    柏林-德国+日本=东京


    和语法：


    更大-大+冷=更冷


    还有美食：


    寿司-日本+德国=香肠


    科学：[Cu-]


    铜+金=Au


    技术：[Windows-]


    微软+谷歌=安卓


    和运动：


    蒙特利尔加拿大人队——蒙特利尔+多伦多=多伦多枫叶队 ^([^(80)](#fn80))


    不幸的是，在捕捉到的信息中，还包含了令人震惊的性别偏见。对于“男人：女人”，有聪明或贴切的类比，例如“小伙：宝贝”，或“前列腺癌：卵巢癌”，还有很多则似乎反映了刻板印象，例如“木工：裁缝”，或“建筑设计师：室内设计师”，或“医生：护士”。


    我们才刚开始充分认识到这个问题。托尔加·博鲁克巴斯、亚当·卡莱和合著者写道：“已经有数百篇关于词嵌入及其应用的论文，从网络搜索到简历解析，然而，这些论文都没有认识到嵌入有多么明显的性别歧视，有将各种偏见引入现实世界中的系统性的风险。”
    ^([^(81)](#fn81))


    像这样的机器学习系统不仅捕捉到了偏见，而且有可能会无声无息地延续和强化偏见。假设有雇主想招聘软件工程师。搜索引擎将会基于某种“相关性”衡量标准对数百万份候选简历进行排序，并只列出前几名。
    ^([^(82)](#fn82))


    当然，求职者的名字本来就会对人类雇主产生影响。2001年和2002年，经济学家玛丽安·贝特朗（Marianne Bertrand）和森迪尔·穆莱纳坦（Sendhil Mullainathan）寄出了近5000份简历，这些简历被随机分配了听起来像白人（艾米丽·沃尔什、格雷格·贝克）或非裔美国人（拉基沙·华盛顿、贾马尔·琼斯）的名字。他们发现收到反馈的概率相差50%，尽管简历是一样的。
    ^([^(83)](#fn83))


    Word2vec会将词汇包括名字映射到种族和性别轴上，将“莎拉——马修”放在性别轴上，将“莎拉——基耶沙”放在种族轴上。职业也会被映射到这些轴上，不难想象一个系统会无意中使用这样的种族或性别维度——实际上是刻板印象——来提升或降低应聘者与特定职位的“相关性”。换句话说，如果筛选简历的是机器而不是人，我们有理由对此感到担忧。
    ^([^(84)](#fn84))


    如果是人的话，一个显而易见的解决方案是隐藏名字，但在这里行不通。从1952年开始，波士顿交响乐团招聘时会在演奏者和评委之间放置幕布，其他大部分乐团也在20世纪七八十年代开始效仿。然而，仅有幕布还不够。乐队意识到，还得要求演奏者在走上演奏厅的木地板之前脱掉**鞋子**。
    ^([^(85)](#fn85))


    机器学习系统的问题在于，设计它们的目的本身就是捕捉数据中隐藏的相关性。比如说，男性和女性的写作风格在某种程度上，会存在差异——措辞或句法有细微差别——word2vec会发现“软件工程师”和男性的典型措辞有许多微妙的间接关联。
    ^([^(86)](#fn86))


    2018年，路透社报道，亚马逊从2014年开始一直在开发一种机器学习工具，用于筛选在线简历，并对应聘者的潜力进行评估和星级排名——就像亚马逊网站上的商品一样——让招聘人员可以节省精力。
    ^([^(87)](#fn87))


    然而，到2015年，亚马逊开始注意到有问题。大多数以前雇用的工程师都是男性。他们意识到，这个模型给“女性”这个词打了负分——例如，如果简历提到了女性的爱好。他们修改了模型以消除这种偏见。


    然而，他们又发现，它给女子学院的校名打了负分。他们又修改了模型以消除这种偏见。


    尽管如此，模型还是找到了听鞋子的办法。工程师们发现，该模型对在男性简历中比女性简历中更常见的几乎**所有**词汇都打正分，例如，“执行了”和“获得了”等词。
    ^([^(88)](#fn88))


    2017年，亚马逊终止了这个项目，并解散了项目团队。 ^([^(89)](#fn89))


    **消除词嵌入的偏见**


    对于托尔加·博鲁克巴斯和亚当·卡莱，以及他们在波士顿大学和微软的合作者来说，问题当然不仅仅是**发现**这些偏见，而是如何消除偏见。


    一种方案是在这个高维向量“空间”中找到刻画性别概念的轴并**删除**它。但是彻底删除性别维度意味着也会失去有用的类比，如“国王：女王”和“姑姑：叔叔”。因此，正如他们所说，挑战在于“减少词嵌入中的性别偏见，同时保留有用的属性”。
    ^([^(90)](#fn90))


    不仅如此，他们还发现，甚至很难明确锁定性别“维度”。例如，你可以把它定义为“女人——男人”的矢量“差”。但这个词对不仅仅只包含性别——还涉及像“oh man（表示兴奋或沮丧的语气词）”这样的习惯用法，和“所有人坚守（man）自己的战斗岗位”这样的动词用法。研究小组决定取一些类似“女人——男人”的词对——“她——他”“女孩——男孩”，等等——然后用一种叫作主成分分析（PCA）的技术分离出体现这些词对最大差异的轴，得到的大概就是性别轴。
    ^([^(91)](#fn91))


    接下来的任务是想办法确定，对于在这个性别维度上的不同的词，这种性别差异是否适当。“国王”和“王后”按性别区分是适当的，“父亲”和“母亲”也适当，但我们可能**不**想将“建材工具店”和“服装店”、“酗酒”和“饮食失调”、“飞行员”和“空姐”视为性别对应，就像word2vec默认的那样。


    那么，如何区分有问题的和没问题的性别关联？这样的关联词不是几个，而是成千上万个。如何知道哪些类比该保留，哪些该调整，哪些该彻底消除？


    5位计算机科学家组成的团队发现自己其实是在研究社会科学。事实上，项目的一部分需要跨越正常学科界限的协作。“我们都是研究机器学习的，”卡莱说，“我所在的实验室有一群社会学家，仅仅是听他们谈论社会学和社会科学遇到的各种问题，我们就意识到机器学习算法可能会存在偏见，但我们5个人——都是男的——对性别偏见的体会都不深。”


    团队成员略带天真地询问社会学家，有没有明确界线告诉我们哪些类比可以接受，哪些不可接受，以便他们对此进行编程。社会学家很快打消了他们的想法，因为这种简单的界线根本不存在。博鲁克巴斯对此说道：“我们想知道，如何定义怎样是好的？他们说，‘社会学家无法定义怎样是好的’。作为一名工程师，你可能会说，‘好吧，这是理想，所以这是我的目标，所以我只能不断设计算法，直到达到目标’。因为它涉及太多的人、文化和一切，你不知道什么是最优。你不能针对某事进行优化。从这个意义上说，确实很难。”


    该团队决定明确一组他们认为适当的，有绝对的性别属性的词：像“他”和“她”、“兄弟”和“姐妹”，还有“子宫”和“精子”这样的生理词汇，以及“女修道院”和“男修道院”或“姐妹会”和“兄弟会”这样的社会词汇。有些词较为复杂。比如“nurse”，作为表示职业的名词（护士），没有固有的性别属性，但作为动词（哺乳），又可能只有女性才能做。像“拉比”
    ^([^(92)](#fn92))


    这个新的去偏见模型有改进吗？该团队借用社会科学的方法设计了问卷，然后在亚马逊MTurk平台上请美国工人判断该模型的一些类比是否为“刻板印象”。这件事也邀请了社会学家加入，因为提问的措辞很有讲究。“我们必须向他们请教，当我们在MTurk上设计这些实验时，提问的措辞会造成实质性差异，”博鲁克巴斯说，“因为话题非常敏感。”
    ^([^(93)](#fn93))


    结果令人鼓舞。原来的模型对“医生——男人+女人”会返回“护士”，现在则会返回“医生”。根据MTurk工人的报告，原模型的性别类比有19%反映了性别刻板印象；新的去偏见模型给出的类比，只有6%被认为反映了刻板印象。
    ^([^(94)](#fn94))


    这种中性化是以很小的代价实现的——例如，现在的模型认为，“沿自祖母”同“沿自祖父”一样，可以表示获得法律豁免。 ^([^(95)](#fn95))


    该团队写道：“关于词嵌入中的偏见的一个观点是，它只不过反映了社会偏见，因此应当消除的是社会偏见，而不是词嵌入的偏见。然而……在某种程度上，消除词嵌入的性别偏见应当有助于减少社会的性别偏见。至少，机器学习不应当无意中放大这些偏见，我们已经看到这种情况的确会发生。”
    ^([^(96)](#fn96))


    这是对一个观念令人鼓舞的证明，即我们也许能够以这样的语言模型为基础构建我们的系统，这些模型不仅捕捉到了现实世界，也是更**美好**世界的模型，一个我们想要的世界的模型。


    然而，这个故事还有后续。2019年，巴尔伊兰大学的计算机科学家希拉·戈宁（Hila Gonen）和尤阿夫·戈德堡（Yoav Goldberg）发表了一篇文章，对这些“去偏见”表示进行研究，认为去偏见可能只是“给猪涂口红”。
    ^([^(97)](#fn97))


    博鲁克巴斯后来去了谷歌，继续和同事们研究这个问题，他们承认，在某些情况下，在招聘中使用的去性别模型实际上可能比原始模型更糟。 ^([^(98)](#fn98))


    **统计之镜中的自画像**


    在招聘中，偏见可能只是需要遏制的危险，但如果单独考虑，偏见还会引出一系列问题。例如，它们来自哪里？它们是统计技术导致的，还是反映了更深层次的东西：是不是反映了我们自己头脑中的偏见和世界上大多数人的偏见？


    社会科学中有一个经典的“内隐联想测试”，可以测试人类的无意识偏见，向受试者展示一系列词语，要求受试者在词语属于两个类别中的**任意一个**时按下按钮：例如，某种花（例如，“鸢尾花”）**或**某种令人愉快的东西（例如，“笑声”）。听起来很简单，事实也的确如此；关键不在于**准确性**，而在于**反应时间**。如果这个词是花或令人愉快的东西，人们按下按钮的速度会很快，但如果是花或令人**不**愉快的东西，他们按下按钮需要更长时间。这表明“花”和“愉快”这两个心理范畴有一定程度的重叠，或者反映了某种相关的概念。
    ^([^(99)](#fn99))


    发明这种测试的小组证明了一个著名事实：白人大学生能够很快识别一个词是常见的白人名字（“梅雷迪思”“希瑟”）或令人愉快的词（“幸运”“礼物”）。他们也能很快识别一个词是常见的黑人名字（“拉托尼亚”“沙文”）或**令人不愉快**的词（“毒药”“悲伤”）。但如果要求识别的是白人名字或令人不愉快的词，他们按下按钮的速度会很慢；同样，如果要求识别的是黑人名字或令人愉快的词，他们的速度也很慢。


    普林斯顿的一组计算机科学家——博士后艾林·卡莉斯坎（Aylin Caliskan）、乔安娜·布莱森（Joanna Bryson）和阿尔温德·纳拉亚南（Arvind Narayanan）教授——发现，在word2vec和其他广泛使用的词嵌入模型中，词与词的距离不可思议地反映了人类的反应时间。人们识别两组词汇的速度越慢，两组词向量在模型中的距离就越远。
    ^([^(100)](#fn100))


    除了这些隐含的关联之外，普林斯顿团队还想知道像word2vec这样的模型是否捕捉到了世界上一些他们所谓的“真实”偏见。某些名字和职业确实更常见于女性而非男性。就某些名字比其他名字更偏向男性或女性而言，这是否在某种程度上反映了客观现实？某些职业沿性别轴分布，这是否在某种程度上也反映了事实，即某些职业——护士、图书管理员、木匠、机械师——**确实**不均衡？普林斯顿团队咨询了美国人口普查局和劳工统计局；两者都给出了肯定答案。'
  fmt: '

    然而，12年后的2019年秋天，一份免责声明出现在`LFW`的网页上，提出了不同观点：“许多群体在`LFW`中的代表性不足。比如儿童很少，没有婴儿，80岁以上的人很少，女性相对较少。此外，许多族裔的代表很少，或者根本没有代表。”
    ^([^(63)](#fn63))


    近年来，这些训练集的组成受到了越来越多的关注，尽管仍有许多工作要做。2015年，美国国家情报总监办公室和情报高级研究计划局发布了一个名为`IJB-A`的人脸图像数据集，他们吹嘘该数据集的“对象具有广泛的地理多样性”。
    ^([^(64)](#fn64))


    布兰维尼最终意识到，应该去“解决这个问题”的正是她自己。她开始对人脸检测系统的现状进行广泛调研，这成了她在`MIT`的论文。她和格布鲁决定创建一个能更平衡反映性别和肤色的数据集。但从哪里得到图像呢？以前的数据集从在线新闻之类的来源提取，完全不平衡。她们决定借鉴代议制，汇集6个国家的代表构建数据集：卢旺达、塞内加尔、南非、冰岛、芬兰和瑞典。这个数据集在年龄、光照和姿势等方面明显不均匀，几乎所有对象都是中年或更大年龄，处于图片中心，带着中性或微笑表情直视镜头。但是，以肤色和性别来衡量，它可以说是迄今为止最多样化的机器学习数据集。
    ^([^(65)](#fn65))


    有了这个代议制数据集，布兰维尼和格布鲁测试了3个商业级的人脸识别系统，分别来自`IBM`、微软和中国的旷视科技——被广泛使用的`Face++`软件的制造商。


    从整个数据集来看，这3个系统在分类性别方面的准确率都很高，约为90%；识别男性面部的准确率比女性高10%到20%；识别浅肤色面孔的准确率也比深肤色高10%到20%。但是，当布兰维尼将两者放到一起分析时，结果令人震惊。这3个系统在对深肤色女性的面孔进行识别时，表现都非常糟糕。例如，`IBM`的系统识别浅肤色男性的错误率仅为0.3%，但识别深肤色女性的错误率为34.7%，高出100倍以上。


    废奴主义者和女权活动家索杰纳·特鲁斯（Sojourner Truth）1851年的演讲《我不是女人吗？》闻名于世。布兰维尼在21世纪尖锐地回应了这个问题，她指出特鲁斯的照片被当代商业人脸识别软件一次又一次错误归类为男性。
    ^([^(66)](#fn66))


    2017年12月22日，布兰维尼向这3家公司发送了她的研究结果，解释说她会在即将召开的会议上展示这些结果，希望这几家公司给出回应。旷视科技没有回应。微软给出了不痛不痒的回应：“我们认为AI技术的公平性是该行业的一个重要问题，微软非常重视。我们已在采取措施提高面部识别技术的准确率，我们还在继续投资研究，以识别、理解和消除偏见。”
    ^([^(67)](#fn67))


    “改变是可能的。”她说。要弥补这一性能差距，并不存在根本性的技术或其他障碍，只需要有人正确提出质疑。


    布兰维尼和格布鲁的研究告诉了我们，当一家公司宣称他们的系统“99%准确”时，我们该如何质疑：在什么上准确？对谁准确？这也提醒我们，每个机器学习系统都是某种议会，在议会中，训练数据代表着更大范围的选民——而且，确保每个人都有投票权至关重要。
    ^([^(68)](#fn68))


    机器学习系统的偏见通常是训练系统所依赖的数据直接导致的——因此，在使用数据来训练将会影响人类的实际系统之前，了解数据集代表谁，以及所代表的程度非常重要。


    但是，如果你的数据集已经尽可能具有包容性——比如说，囊括了几乎所有书面语言，几千亿个词汇——而这个世界本身就有偏见，你该怎么做？


    ## 分布假说：词嵌入


    观其伴而知其意。


    ——约翰·弗斯 ^([^(69)](#fn69))


    假设你在冲上海滩的瓶子里发现了纸条；有几个部分已经读不出来了。你看到一句话：“我把宝藏埋在\_\_\_\_\_北面的海边。”你肯定很想知道缺失的词是什么。


    你应该不会认为这个词会是“仓鼠”“甜甜圈”或“假发”。根据常识，有理由不会是这些：仓鼠会乱跑，甜甜圈会生物降解，假发会被风吹走，这些都不是长期藏宝的可靠标记。你可以推断，如果要藏宝几个月或几年，肯定会参照某种稳固的、不太可能分解或移动的东西。


    再假设你是一台完全没有这些常识的计算机——更不用说设身处地思考藏宝的人会怎么想——但你拥有庞大的真实文本样本（“语料库”），可以用来识别模式。只根据语言本身的统计数据来猜测缺失的词语，你能做得多好？


    构建这类猜测模型一直是计算语言学的圣杯。 ^([^(70)](#fn70))


    理想情况下，即使某个特定的短语在语料库中从未出现，我们也希望能够做出合理猜测。基于计数的方法对此没什么办法。“我啜了一口黄疸色的\_\_\_\_\_”，我们可以想见“霞多丽酒”比“木炭”更有可能，即使在语言史上，这两个词的前面都没有出现过“黄疸色的”。对这种情形，计数法无计可施。同样，如果我们尝试考虑更多上下文，并不会让问题更简单，因为考虑的短语越长，就越有可能遇到从未见过的东西。


    这个问题被称为“维度灾难”，从一开始就困扰着这种基于计数的方法。 ^([^(71)](#fn71))


    有更好的方法吗？


    还有一种方法是所谓的“分布式表示”。 ^([^(72)](#fn72))


    这种方法依赖于一个假说，简单来说就是：“相似”的词在空间中的位置会比较近。这样相似度就可以用数字刻画。基本原理是将词转换为（“嵌入”）一组数字（“向量”），这些数字是词在空间中的“坐标”。这组坐标被称为词的表示。（例如`word2vec`用了介于-1.0到1.0之间的300个小数。）这样就能测量词与词的“相似度”：坐标距离有多远？
    ^([^(73)](#fn73))


    我们要做的就是将词**通过某种方式**嵌入这个空间，让它们能尽可能正确猜测缺失的词。（至少在这个特定的模型架构允许的范围内做得尽可能好。）


    如何得到这些表示呢？当然是随机梯度下降！首先，将词随机散布在整个空间。然后，从语料库中随机选取一个短语，隐藏一个词，并询问系统哪个词可以填这个空。


    如果模型猜错了，就调整词的坐标，将正确的词稍微推向上下文词汇所在的空间位置，将不正确的猜测稍微推离。微调后，随机选取另一个短语，再次执行这个过程。这样不断反复。
    ^([^(74)](#fn74))


    斯坦福计算语言学家克里斯托弗·曼宁（Christopher Manning）解释道，“这时，某种奇迹发生了”。


    用他的话说：


    这很令人吃惊——但的确是真的——你直接树立猜测的目标，让每个词的词向量都能关联出现在上下文中的词，反过来也是如此——你只有一个非常简单的目标——你对如何实现这个目标只字不提——你只是祈祷，依靠深度学习的魔力……奇迹发生了。然后词向量就出来了，它们在表示词汇的意义方面非常强大，对各种事情都很有用。
    ^([^(75)](#fn75))


    有人可能会说，这些嵌入实际上捕捉到了我们语言的非常多的微妙之处。的确如此，它们以惊人的清晰度捕捉到了我们自己都不愿看到的东西。


    ## 嵌入的阴暗面


    人性这根曲木，决然造不出任何笔直的东西。


    ——康德 ^([^(76)](#fn76))


    像这样的词嵌入模型，包括谷歌的`word2vec`和斯坦福的`GloVe`，已成为计算语言学的事实标准，自2013年以来，几乎支撑了所有涉及语言的计算机应用，无论是搜索结果排序、机器翻译，还是根据评论分析消费者情绪。
    ^([^(77)](#fn77))


    事实上，尽管嵌入很简单——每个词都只有一列数字，基于对文本中缺失词汇的猜测——但似乎捕捉到了惊人数量的真实世界的信息。


    例如，你可以将两个向量相加，得到一个新向量，然后搜索最近的词。得到的结果经常令人震惊：


    `捷克+货币=克朗`


    `越南+首都=河内`


    `德国+航空=汉莎`


    `法国+女演员=朱丽叶·比诺什` ^([^(78)](#fn78))


    你也可以将词**相减**。这样就可以得到两个词之间的“差异”，然后将差值与第三个词相加来生成“类比”，简直不可思议。 ^([^(79)](#fn79))


    输出的类比表明嵌入已经捕捉到了地理位置：


    `柏林-德国+日本=东京`


    和语法：


    `更大-大+冷=更冷`


    还有美食：


    `寿司-日本+德国=香肠`


    科学：


    `铜+金=Au`


    技术：


    `微软+谷歌=安卓`


    和运动：


    `蒙特利尔加拿大人队——蒙特利尔+多伦多=多伦多枫叶队` ^([^(80)](#fn80))


    不幸的是，在捕捉到的信息中，还包含了令人震惊的性别偏见。对于“男人：女人”，有聪明或贴切的类比，例如“小伙：宝贝”，或“前列腺癌：卵巢癌”，还有很多则似乎反映了刻板印象，例如“木工：裁缝”，或“建筑设计师：室内设计师”，或“医生：护士”。


    我们才刚开始充分认识到这个问题。托尔加·博鲁克巴斯、亚当·卡莱和合著者写道：“已经有数百篇关于词嵌入及其应用的论文，从网络搜索到简历解析，然而，这些论文都没有认识到嵌入有多么明显的性别歧视，有将各种偏见引入现实世界中的系统性的风险。”
    ^([^(81)](#fn81))


    像这样的机器学习系统不仅捕捉到了偏见，而且有可能会无声无息地延续和强化偏见。假设有雇主想招聘软件工程师。搜索引擎将会基于某种“相关性”衡量标准对数百万份候选简历进行排序，并只列出前几名。
    ^([^(82)](#fn82))


    当然，求职者的名字本来就会对人类雇主产生影响。2001年和2002年，经济学家玛丽安·贝特朗（Marianne Bertrand）和森迪尔·穆莱纳坦（Sendhil
    Mullainathan）寄出了近5000份简历，这些简历被随机分配了听起来像白人（艾米丽·沃尔什、格雷格·贝克）或非裔美国人（拉基沙·华盛顿、贾马尔·琼斯）的名字。他们发现收到反馈的概率相差50%，尽管简历是一样的。
    ^([^(83)](#fn83))


    `word2vec`会将词汇包括名字映射到种族和性别轴上，将“莎拉——马修”放在性别轴上，将“莎拉——基耶沙”放在种族轴上。职业也会被映射到这些轴上，不难想象一个系统会无意中使用这样的种族或性别维度——实际上是刻板印象——来提升或降低应聘者与特定职位的“相关性”。换句话说，如果筛选简历的是机器而不是人，我们有理由对此感到担忧。
    ^([^(84)](#fn84))


    如果是人的话，一个显而易见的解决方案是隐藏名字，但在这里行不通。从1952年开始，波士顿交响乐团招聘时会在演奏者和评委之间放置幕布，其他大部分乐团也在20世纪七八十年代开始效仿。然而，仅有幕布还不够。乐队意识到，还得要求演奏者在走上演奏厅的木地板之前脱掉**鞋子**。
    ^([^(85)](#fn85))


    机器学习系统的问题在于，设计它们的目的本身就是捕捉数据中隐藏的相关性。比如说，男性和女性的写作风格在某种程度上，会存在差异——措辞或句法有细微差别——`word2vec`会发现“软件工程师”和男性的典型措辞有许多微妙的间接关联。
    ^([^(86)](#fn86))


    2018年，路透社报道，亚马逊从2014年开始一直在开发一种机器学习工具，用于筛选在线简历，并对应聘者的潜力进行评估和星级排名——就像亚马逊网站上的商品一样——让招聘人员可以节省精力。
    ^([^(87)](#fn87))


    然而，到2015年，亚马逊开始注意到有问题。大多数以前雇用的工程师都是男性。他们意识到，这个模型给“女性”这个词打了负分——例如，如果简历提到了女性的爱好。他们修改了模型以消除这种偏见。


    然而，他们又发现，它给女子学院的校名打了负分。他们又修改了模型以消除这种偏见。


    尽管如此，模型还是找到了听鞋子的办法。工程师们发现，该模型对在男性简历中比女性简历中更常见的几乎**所有**词汇都打正分，例如，“执行了”和“获得了”等词。
    ^([^(88)](#fn88))


    2017年，亚马逊终止了这个项目，并解散了项目团队。 ^([^(89)](#fn89))


    ## 消除词嵌入的偏见


    对于托尔加·博鲁克巴斯和亚当·卡莱，以及他们在波士顿大学和微软的合作者来说，问题当然不仅仅是**发现**这些偏见，而是如何消除偏见。


    一种方案是在这个高维向量“空间”中找到刻画性别概念的轴并**删除**它。但是彻底删除性别维度意味着也会失去有用的类比，如“国王：女王”和“姑姑：叔叔”。因此，正如他们所说，挑战在于“减少词嵌入中的性别偏见，同时保留有用的属性”。
    ^([^(90)](#fn90))


    不仅如此，他们还发现，甚至很难明确锁定性别“维度”。例如，你可以把它定义为“女人——男人”的矢量“差”。但这个词对不仅仅只包含性别——还涉及像“oh man（表示兴奋或沮丧的语气词）”这样的习惯用法，和“所有人坚守（man）自己的战斗岗位”这样的动词用法。研究小组决定取一些类似“女人——男人”的词对——“她——他”“女孩——男孩”，等等——然后用一种叫作主成分分析（`PCA`）的技术分离出体现这些词对最大差异的轴，得到的大概就是性别轴。
    ^([^(91)](#fn91))


    接下来的任务是想办法确定，对于在这个性别维度上的不同的词，这种性别差异是否适当。“国王”和“王后”按性别区分是适当的，“父亲”和“母亲”也适当，但我们可能**不**想将“建材工具店”和“服装店”、“酗酒”和“饮食失调”、“飞行员”和“空姐”视为性别对应，就像`word2vec`默认的那样。


    那么，如何区分有问题的和没问题的性别关联？这样的关联词不是几个，而是成千上万个。如何知道哪些类比该保留，哪些该调整，哪些该彻底消除？


    5位计算机科学家组成的团队发现自己其实是在研究社会科学。事实上，项目的一部分需要跨越正常学科界限的协作。“我们都是研究机器学习的，”卡莱说，“我所在的实验室有一群社会学家，仅仅是听他们谈论社会学和社会科学遇到的各种问题，我们就意识到机器学习算法可能会存在偏见，但我们5个人——都是男的——对性别偏见的体会都不深。”


    团队成员略带天真地询问社会学家，有没有明确界线告诉我们哪些类比可以接受，哪些不可接受，以便他们对此进行编程。社会学家很快打消了他们的想法，因为这种简单的界线根本不存在。博鲁克巴斯对此说道：“我们想知道，如何定义怎样是好的？他们说，‘社会学家无法定义怎样是好的’。作为一名工程师，你可能会说，‘好吧，这是理想，所以这是我的目标，所以我只能不断设计算法，直到达到目标’。因为它涉及太多的人、文化和一切，你不知道什么是最优。你不能针对某事进行优化。从这个意义上说，确实很难。”


    该团队决定明确一组他们认为适当的，有绝对的性别属性的词：像“他”和“她”、“兄弟”和“姐妹”，还有“子宫”和“精子”这样的生理词汇，以及“女修道院”和“男修道院”或“姐妹会”和“兄弟会”这样的社会词汇。有些词较为复杂。比如“nurse”，作为表示职业的名词（护士），没有固有的性别属性，但作为动词（哺乳），又可能只有女性才能做。像“拉比”
    ^([^(92)](#fn92))


    这个新的去偏见模型有改进吗？该团队借用社会科学的方法设计了问卷，然后在亚马逊`MTurk`平台上请美国工人判断该模型的一些类比是否为“刻板印象”。这件事也邀请了社会学家加入，因为提问的措辞很有讲究。“我们必须向他们请教，当我们在`MTurk`上设计这些实验时，提问的措辞会造成实质性差异，”博鲁克巴斯说，“因为话题非常敏感。”
    ^([^(93)](#fn93))


    结果令人鼓舞。原来的模型对“医生——男人+女人”会返回“护士”，现在则会返回“医生”。根据`MTurk`工人的报告，原模型的性别类比有19%反映了性别刻板印象；新的去偏见模型给出的类比，只有6%被认为反映了刻板印象。
    ^([^(94)](#fn94))


    这种中性化是以很小的代价实现的——例如，现在的模型认为，“沿自祖母”同“沿自祖父”一样，可以表示获得法律豁免。 ^([^(95)](#fn95))


    该团队写道：“关于词嵌入中的偏见的一个观点是，它只不过反映了社会偏见，因此应当消除的是社会偏见，而不是词嵌入的偏见。然而……在某种程度上，消除词嵌入的性别偏见应当有助于减少社会的性别偏见。至少，机器学习不应当无意中放大这些偏见，我们已经看到这种情况的确会发生。”
    ^([^(96)](#fn96))


    这是对一个观念令人鼓舞的证明，即我们也许能够以这样的语言模型为基础构建我们的系统，这些模型不仅捕捉到了现实世界，也是更**美好**世界的模型，一个我们想要的世界的模型。


    然而，这个故事还有后续。2019年，巴尔伊兰大学的计算机科学家希拉·戈宁（Hila Gonen）和尤阿夫·戈德堡（Yoav Goldberg）发表了一篇文章，对这些“去偏见”表示进行研究，认为去偏见可能只是“给猪涂口红”。
    ^([^(97)](#fn97))


    博鲁克巴斯后来去了谷歌，继续和同事们研究这个问题，他们承认，在某些情况下，在招聘中使用的去性别模型实际上可能比原始模型更糟。 ^([^(98)](#fn98))


    ## 统计之镜中的自画像


    在招聘中，偏见可能只是需要遏制的危险，但如果单独考虑，偏见还会引出一系列问题。例如，它们来自哪里？它们是统计技术导致的，还是反映了更深层次的东西：是不是反映了我们自己头脑中的偏见和世界上大多数人的偏见？


    社会科学中有一个经典的“内隐联想测试”，可以测试人类的无意识偏见，向受试者展示一系列词语，要求受试者在词语属于两个类别中的**任意一个**时按下按钮：例如，某种花（例如，“鸢尾花”）**或**某种令人愉快的东西（例如，“笑声”）。听起来很简单，事实也的确如此；关键不在于**准确性**，而在于**反应时间**。如果这个词是花或令人愉快的东西，人们按下按钮的速度会很快，但如果是花或令人**不**愉快的东西，他们按下按钮需要更长时间。这表明“花”和“愉快”这两个心理范畴有一定程度的重叠，或者反映了某种相关的概念。
    ^([^(99)](#fn99))


    发明这种测试的小组证明了一个著名事实：白人大学生能够很快识别一个词是常见的白人名字（“梅雷迪思”“希瑟”）或令人愉快的词（“幸运”“礼物”）。他们也能很快识别一个词是常见的黑人名字（“拉托尼亚”“沙文”）或**令人不愉快**的词（“毒药”“悲伤”）。但如果要求识别的是白人名字或令人不愉快的词，他们按下按钮的速度会很慢；同样，如果要求识别的是黑人名字或令人愉快的词，他们的速度也很慢。


    普林斯顿的一组计算机科学家——博士后艾林·卡莉斯坎（Aylin Caliskan）、乔安娜·布莱森（Joanna Bryson）和阿尔温德·纳拉亚南（Arvind
    Narayanan）教授——发现，在`word2vec`和其他广泛使用的词嵌入模型中，词与词的距离不可思议地反映了人类的反应时间。人们识别两组词汇的速度越慢，两组词向量在模型中的距离就越远。
    ^([^(100)](#fn100))


    除了这些隐含的关联之外，普林斯顿团队还想知道像`word2vec`这样的模型是否捕捉到了世界上一些他们所谓的“真实”偏见。某些名字和职业确实更常见于女性而非男性。就某些名字比其他名字更偏向男性或女性而言，这是否在某种程度上反映了客观现实？某些职业沿性别轴分布，这是否在某种程度上也反映了事实，即某些职业——护士、图书管理员、木匠、机械师——**确实**不均衡？普林斯顿团队咨询了美国人口普查局和劳工统计局；两者都给出了肯定答案。

    '
  trans: '


    然而，12 年后的 2019 年秋天，一份免责声明出现在`LFW`的网页上，提出了不同观点：“许多群体在`LFW`中的代表性不足。比如儿童很少，没有婴儿，80
    岁以上的人很少，女性相对较少。此外，许多族裔的代表很少，或者根本没有代表。” ^(⁶³)


    近年来，这些训练集的组成受到了越来越多的关注，尽管仍有许多工作要做。2015 年，美国国家情报总监办公室和情报高级研究计划局发布了一个名为`IJB-A`的人脸图像数据集，他们吹嘘该数据集的“对象具有广泛的地理多样性”。
    ^(⁶⁴)


    布兰维尼最终意识到，应该去“解决这个问题”的正是她自己。她开始对人脸检测系统的现状进行广泛调研，这成了她在`MIT`的论文。她和格布鲁决定创建一个能更平衡反映性别和肤色的数据集。但从哪里得到图像呢？以前的数据集从在线新闻之类的来源提取，完全不平衡。她们决定借鉴代议制，汇集
    6 个国家的代表构建数据集：卢旺达、塞内加尔、南非、冰岛、芬兰和瑞典。这个数据集在年龄、光照和姿势等方面明显不均匀，几乎所有对象都是中年或更大年龄，处于图片中心，带着中性或微笑表情直视镜头。但是，以肤色和性别来衡量，它可以说是迄今为止最多样化的机器学习数据集。
    ^(⁶⁵)


    有了这个代议制数据集，布兰维尼和格布鲁测试了 3 个商业级的人脸识别系统，分别来自`IBM`、微软和中国的旷视科技——被广泛使用的`Face++`软件的制造商。


    从整个数据集来看，这 3 个系统在分类性别方面的准确率都很高，约为 90%；识别男性面部的准确率比女性高 10%到 20%；识别浅肤色面孔的准确率也比深肤色高
    10%到 20%。但是，当布兰维尼将两者放到一起分析时，结果令人震惊。这 3 个系统在对深肤色女性的面孔进行识别时，表现都非常糟糕。例如，`IBM`的系统识别浅肤色男性的错误率仅为
    0.3%，但识别深肤色女性的错误率为 34.7%，高出 100 倍以上。


    废奴主义者和女权活动家索杰纳·特鲁斯（Sojourner Truth）1851 年的演讲《我不是女人吗？》闻名于世。布兰维尼在 21 世纪尖锐地回应了这个问题，她指出特鲁斯的照片被当代商业人脸识别软件一次又一次错误归类为男性。
    ^(⁶⁶)


    2017 年 12 月 22 日，布兰维尼向这 3 家公司发送了她的研究结果，解释说她会在即将召开的会议上展示这些结果，希望这几家公司给出回应。旷视科技没有回应。微软给出了不痛不痒的回应：“我们认为
    AI 技术的公平性是该行业的一个重要问题，微软非常重视。我们已在采取措施提高面部识别技术的准确率，我们还在继续投资研究，以识别、理解和消除偏见。” ^(⁶⁷)


    “改变是可能的。”她说。要弥补这一性能差距，并不存在根本性的技术或其他障碍，只需要有人正确提出质疑。


    布兰维尼和格布鲁的研究告诉了我们，当一家公司宣称他们的系统“99%准确”时，我们该如何质疑：在什么上准确？对谁准确？这也提醒我们，每个机器学习系统都是某种议会，在议会中，训练数据代表着更大范围的选民——而且，确保每个人都有投票权至关重要。
    ^(⁶⁸)


    机器学习系统的偏见通常是训练系统所依赖的数据直接导致的——因此，在使用数据来训练将会影响人类的实际系统之前，了解数据集代表谁，以及所代表的程度非常重要。


    但是，如果你的数据集已经尽可能具有包容性——比如说，囊括了几乎所有书面语言，几千亿个词汇——而这个世界本身就有偏见，你该怎么做？


    ## 分布假说：词嵌入


    观其伴而知其意。


    ——约翰·弗斯 ^(⁶⁹)


    假设你在冲上海滩的瓶子里发现了纸条；有几个部分已经读不出来了。你看到一句话：“我把宝藏埋在\_\_\_\_\_ 北面的海边。”你肯定很想知道缺失的词是什么。


    你应该不会认为这个词会是“仓鼠”“甜甜圈”或“假发”。根据常识，有理由不会是这些：仓鼠会乱跑，甜甜圈会生物降解，假发会被风吹走，这些都不是长期藏宝的可靠标记。你可以推断，如果要藏宝几个月或几年，肯定会参照某种稳固的、不太可能分解或移动的东西。


    再假设你是一台完全没有这些常识的计算机——更不用说设身处地思考藏宝的人会怎么想——但你拥有庞大的真实文本样本（“语料库”），可以用来识别模式。只根据语言本身的统计数据来猜测缺失的词语，你能做得多好？


    构建这类猜测模型一直是计算语言学的圣杯。 ^(⁷⁰)


    理想情况下，即使某个特定的短语在语料库中从未出现，我们也希望能够做出合理猜测。基于计数的方法对此没什么办法。“我啜了一口黄疸色的\_\_\_\_\_”，我们可以想见“霞多丽酒”比“木炭”更有可能，即使在语言史上，这两个词的前面都没有出现过“黄疸色的”。对这种情形，计数法无计可施。同样，如果我们尝试考虑更多上下文，并不会让问题更简单，因为考虑的短语越长，就越有可能遇到从未见过的东西。


    这个问题被称为“维度灾难”，从一开始就困扰着这种基于计数的方法。 ^(⁷¹)


    有更好的方法吗？


    还有一种方法是所谓的“分布式表示”。 ^(⁷²)


    这种方法依赖于一个假说，简单来说就是：“相似”的词在空间中的位置会比较近。这样相似度就可以用数字刻画。基本原理是将词转换为（“嵌入”）一组数字（“向量”），这些数字是词在空间中的“坐标”。这组坐标被称为词的表示。（例如`word2vec`用了介于-1.0
    到 1.0 之间的 300 个小数。）这样就能测量词与词的“相似度”：坐标距离有多远？ ^(⁷³)


    我们要做的就是将词**通过某种方式**嵌入这个空间，让它们能尽可能正确猜测缺失的词。（至少在这个特定的模型架构允许的范围内做得尽可能好。）


    如何得到这些表示呢？当然是随机梯度下降！首先，将词随机散布在整个空间。然后，从语料库中随机选取一个短语，隐藏一个词，并询问系统哪个词可以填这个空。


    如果模型猜错了，就调整词的坐标，将正确的词稍微推向上下文词汇所在的空间位置，将不正确的猜测稍微推离。微调后，随机选取另一个短语，再次执行这个过程。这样不断反复。
    ^(⁷⁴)


    斯坦福计算语言学家克里斯托弗·曼宁（Christopher Manning）解释道，“这时，某种奇迹发生了”。


    用他的话说：


    这很令人吃惊——但的确是真的——你直接树立猜测的目标，让每个词的词向量都能关联出现在上下文中的词，反过来也是如此——你只有一个非常简单的目标——你对如何实现这个目标只字不提——你只是祈祷，依靠深度学习的魔力……奇迹发生了。然后词向量就出来了，它们在表示词汇的意义方面非常强大，对各种事情都很有用。
    ^(⁷⁵)


    有人可能会说，这些嵌入实际上捕捉到了我们语言的非常多的微妙之处。的确如此，它们以惊人的清晰度捕捉到了我们自己都不愿看到的东西。


    ## 嵌入的阴暗面


    人性这根曲木，决然造不出任何笔直的东西。


    ——康德 ^(⁷⁶)


    像这样的词嵌入模型，包括谷歌的`word2vec`和斯坦福的`GloVe`，已成为计算语言学的事实标准，自 2013 年以来，几乎支撑了所有涉及语言的计算机应用，无论是搜索结果排序、机器翻译，还是根据评论分析消费者情绪。
    ^(⁷⁷)


    事实上，尽管嵌入很简单——每个词都只有一列数字，基于对文本中缺失词汇的猜测——但似乎捕捉到了惊人数量的真实世界的信息。


    例如，你可以将两个向量相加，得到一个新向量，然后搜索最近的词。得到的结果经常令人震惊：


    `捷克+货币=克朗`


    `越南+首都=河内`


    `德国+航空=汉莎`


    `法国+女演员=朱丽叶·比诺什` ^(⁷⁸)


    你也可以将词**相减**。这样就可以得到两个词之间的“差异”，然后将差值与第三个词相加来生成“类比”，简直不可思议。 ^(⁷⁹)


    输出的类比表明嵌入已经捕捉到了地理位置：


    `柏林-德国+日本=东京`


    和语法：


    `更大-大+冷=更冷`


    还有美食：


    `寿司-日本+德国=香肠`


    科学：


    `铜+金=Au`


    技术：


    `微软+谷歌=安卓`


    和运动：


    `蒙特利尔加拿大人队——蒙特利尔+多伦多=多伦多枫叶队` ^(⁸⁰)


    不幸的是，在捕捉到的信息中，还包含了令人震惊的性别偏见。对于“男人：女人”，有聪明或贴切的类比，例如“小伙：宝贝”，或“前列腺癌：卵巢癌”，还有很多则似乎反映了刻板印象，例如“木工：裁缝”，或“建筑设计师：室内设计师”，或“医生：护士”。


    我们才刚开始充分认识到这个问题。托尔加·博鲁克巴斯、亚当·卡莱和合著者写道：“已经有数百篇关于词嵌入及其应用的论文，从网络搜索到简历解析，然而，这些论文都没有认识到嵌入有多么明显的性别歧视，有将各种偏见引入现实世界中的系统性的风险。”
    ^(⁸¹)


    像这样的机器学习系统不仅捕捉到了偏见，而且有可能会无声无息地延续和强化偏见。假设有雇主想招聘软件工程师。搜索引擎将会基于某种“相关性”衡量标准对数百万份候选简历进行排序，并只列出前几名。
    ^(⁸²)


    当然，求职者的名字本来就会对人类雇主产生影响。2001 年和 2002 年，经济学家玛丽安·贝特朗（Marianne Bertrand）和森迪尔·穆莱纳坦（Sendhil
    Mullainathan）寄出了近 5000 份简历，这些简历被随机分配了听起来像白人（艾米丽·沃尔什、格雷格·贝克）或非裔美国人（拉基沙·华盛顿、贾马尔·琼斯）的名字。他们发现收到反馈的概率相差
    50%，尽管简历是一样的。 ^(⁸³)


    `word2vec`会将词汇包括名字映射到种族和性别轴上，将“莎拉——马修”放在性别轴上，将“莎拉——基耶沙”放在种族轴上。职业也会被映射到这些轴上，不难想象一个系统会无意中使用这样的种族或性别维度——实际上是刻板印象——来提升或降低应聘者与特定职位的“相关性”。换句话说，如果筛选简历的是机器而不是人，我们有理由对此感到担忧。
    ^(⁸⁴)


    如果是人的话，一个显而易见的解决方案是隐藏名字，但在这里行不通。从 1952 年开始，波士顿交响乐团招聘时会在演奏者和评委之间放置幕布，其他大部分乐团也在
    20 世纪七八十年代开始效仿。然而，仅有幕布还不够。乐队意识到，还得要求演奏者在走上演奏厅的木地板之前脱掉**鞋子**。 ^(⁸⁵)


    机器学习系统的问题在于，设计它们的目的本身就是捕捉数据中隐藏的相关性。比如说，男性和女性的写作风格在某种程度上，会存在差异——措辞或句法有细微差别——`word2vec`会发现“软件工程师”和男性的典型措辞有许多微妙的间接关联。
    ^(⁸⁶)


    2018 年，路透社报道，亚马逊从 2014 年开始一直在开发一种机器学习工具，用于筛选在线简历，并对应聘者的潜力进行评估和星级排名——就像亚马逊网站上的商品一样——让招聘人员可以节省精力。
    ^(⁸⁷)


    然而，到 2015 年，亚马逊开始注意到有问题。大多数以前雇用的工程师都是男性。他们意识到，这个模型给“女性”这个词打了负分——例如，如果简历提到了女性的爱好。他们修改了模型以消除这种偏见。


    然而，他们又发现，它给女子学院的校名打了负分。他们又修改了模型以消除这种偏见。


    尽管如此，模型还是找到了听鞋子的办法。工程师们发现，该模型对在男性简历中比女性简历中更常见的几乎**所有**词汇都打正分，例如，“执行了”和“获得了”等词。
    ^(⁸⁸)


    2017 年，亚马逊终止了这个项目，并解散了项目团队。 ^(⁸⁹)


    ## 消除词嵌入的偏见


    对于托尔加·博鲁克巴斯和亚当·卡莱，以及他们在波士顿大学和微软的合作者来说，问题当然不仅仅是**发现**这些偏见，而是如何消除偏见。


    一种方案是在这个高维向量“空间”中找到刻画性别概念的轴并**删除**它。但是彻底删除性别维度意味着也会失去有用的类比，如“国王：女王”和“姑姑：叔叔”。因此，正如他们所说，挑战在于“减少词嵌入中的性别偏见，同时保留有用的属性”。
    ^(⁹⁰)


    不仅如此，他们还发现，甚至很难明确锁定性别“维度”。例如，你可以把它定义为“女人——男人”的矢量“差”。但这个词对不仅仅只包含性别——还涉及像“oh man（表示兴奋或沮丧的语气词）”这样的习惯用法，和“所有人坚守（man）自己的战斗岗位”这样的动词用法。研究小组决定取一些类似“女人——男人”的词对——“她——他”“女孩——男孩”，等等——然后用一种叫作主成分分析（`PCA`）的技术分离出体现这些词对最大差异的轴，得到的大概就是性别轴。
    ^(⁹¹)


    接下来的任务是想办法确定，对于在这个性别维度上的不同的词，这种性别差异是否适当。“国王”和“王后”按性别区分是适当的，“父亲”和“母亲”也适当，但我们可能**不**想将“建材工具店”和“服装店”、“酗酒”和“饮食失调”、“飞行员”和“空姐”视为性别对应，就像`word2vec`默认的那样。


    那么，如何区分有问题的和没问题的性别关联？这样的关联词不是几个，而是成千上万个。如何知道哪些类比该保留，哪些该调整，哪些该彻底消除？


    5 位计算机科学家组成的团队发现自己其实是在研究社会科学。事实上，项目的一部分需要跨越正常学科界限的协作。“我们都是研究机器学习的，”卡莱说，“我所在的实验室有一群社会学家，仅仅是听他们谈论社会学和社会科学遇到的各种问题，我们就意识到机器学习算法可能会存在偏见，但我们
    5 个人——都是男的——对性别偏见的体会都不深。”


    团队成员略带天真地询问社会学家，有没有明确界线告诉我们哪些类比可以接受，哪些不可接受，以便他们对此进行编程。社会学家很快打消了他们的想法，因为这种简单的界线根本不存在。博鲁克巴斯对此说道：“我们想知道，如何定义怎样是好的？他们说，‘社会学家无法定义怎样是好的’。作为一名工程师，你可能会说，‘好吧，这是理想，所以这是我的目标，所以我只能不断设计算法，直到达到目标’。因为它涉及太多的人、文化和一切，你不知道什么是最优。你不能针对某事进行优化。从这个意义上说，确实很难。”


    该团队决定明确一组他们认为适当的，有绝对的性别属性的词：像“他”和“她”、“兄弟”和“姐妹”，还有“子宫”和“精子”这样的生理词汇，以及“女修道院”和“男修道院”或“姐妹会”和“兄弟会”这样的社会词汇。有些词较为复杂。比如“nurse”，作为表示职业的名词（护士），没有固有的性别属性，但作为动词（哺乳），又可能只有女性才能做。像“拉比”
    ^(⁹²)


    这个新的去偏见模型有改进吗？该团队借用社会科学的方法设计了问卷，然后在亚马逊`MTurk`平台上请美国工人判断该模型的一些类比是否为“刻板印象”。这件事也邀请了社会学家加入，因为提问的措辞很有讲究。“我们必须向他们请教，当我们在`MTurk`上设计这些实验时，提问的措辞会造成实质性差异，”博鲁克巴斯说，“因为话题非常敏感。”
    ^(⁹³)


    结果令人鼓舞。原来的模型对“医生——男人+女人”会返回“护士”，现在则会返回“医生”。根据`MTurk`工人的报告，原模型的性别类比有 19%反映了性别刻板印象；新的去偏见模型给出的类比，只有
    6%被认为反映了刻板印象。 ^(⁹⁴)


    这种中性化是以很小的代价实现的——例如，现在的模型认为，“沿自祖母”同“沿自祖父”一样，可以表示获得法律豁免。 ^(⁹⁵)


    该团队写道：“关于词嵌入中的偏见的一个观点是，它只不过反映了社会偏见，因此应当消除的是社会偏见，而不是词嵌入的偏见。然而……在某种程度上，消除词嵌入的性别偏见应当有助于减少社会的性别偏见。至少，机器学习不应当无意中放大这些偏见，我们已经看到这种情况的确会发生。”
    ^(⁹⁶)


    这是对一个观念令人鼓舞的证明，即我们也许能够以这样的语言模型为基础构建我们的系统，这些模型不仅捕捉到了现实世界，也是更**美好**世界的模型，一个我们想要的世界的模型。


    然而，这个故事还有后续。2019 年，巴尔伊兰大学的计算机科学家希拉·戈宁（Hila Gonen）和尤阿夫·戈德堡（Yoav Goldberg）发表了一篇文章，对这些“去偏见”表示进行研究，认为去偏见可能只是“给猪涂口红”。
    ^(⁹⁷)


    博鲁克巴斯后来去了谷歌，继续和同事们研究这个问题，他们承认，在某些情况下，在招聘中使用的去性别模型实际上可能比原始模型更糟。 ^(⁹⁸)


    ## 统计之镜中的自画像


    在招聘中，偏见可能只是需要遏制的危险，但如果单独考虑，偏见还会引出一系列问题。例如，它们来自哪里？它们是统计技术导致的，还是反映了更深层次的东西：是不是反映了我们自己头脑中的偏见和世界上大多数人的偏见？


    社会科学中有一个经典的“内隐联想测试”，可以测试人类的无意识偏见，向受试者展示一系列词语，要求受试者在词语属于两个类别中的**任意一个**时按下按钮：例如，某种花（例如，“鸢尾花”）**或**某种令人愉快的东西（例如，“笑声”）。听起来很简单，事实也的确如此；关键不在于**准确性**，而在于**反应时间**。如果这个词是花或令人愉快的东西，人们按下按钮的速度会很快，但如果是花或令人**不**愉快的东西，他们按下按钮需要更长时间。这表明“花”和“愉快”这两个心理范畴有一定程度的重叠，或者反映了某种相关的概念。
    ^(⁹⁹)


    发明这种测试的小组证明了一个著名事实：白人大学生能够很快识别一个词是常见的白人名字（“梅雷迪思”“希瑟”）或令人愉快的词（“幸运”“礼物”）。他们也能很快识别一个词是常见的黑人名字（“拉托尼亚”“沙文”）或**令人不愉快**的词（“毒药”“悲伤”）。但如果要求识别的是白人名字或令人不愉快的词，他们按下按钮的速度会很慢；同样，如果要求识别的是黑人名字或令人愉快的词，他们的速度也很慢。


    普林斯顿的一组计算机科学家——博士后艾林·卡莉斯坎（Aylin Caliskan）、乔安娜·布莱森（Joanna Bryson）和阿尔温德·纳拉亚南（Arvind
    Narayanan）教授——发现，在`word2vec`和其他广泛使用的词嵌入模型中，词与词的距离不可思议地反映了人类的反应时间。人们识别两组词汇的速度越慢，两组词向量在模型中的距离就越远。
    ^(¹⁰⁰)


    除了这些隐含的关联之外，普林斯顿团队还想知道像`word2vec`这样的模型是否捕捉到了世界上一些他们所谓的“真实”偏见。某些名字和职业确实更常见于女性而非男性。就某些名字比其他名字更偏向男性或女性而言，这是否在某种程度上反映了客观现实？某些职业沿性别轴分布，这是否在某种程度上也反映了事实，即某些职业——护士、图书管理员、木匠、机械师——**确实**不均衡？普林斯顿团队咨询了美国人口普查局和劳工统计局；两者都给出了肯定答案。


    '
