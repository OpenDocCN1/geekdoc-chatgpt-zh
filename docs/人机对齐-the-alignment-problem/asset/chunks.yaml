  trans: '


    # 内在动机、惊讶与强化学习


    ## 婴儿的预测与惊讶


    四五岁的孩子往往对如何平衡积木缺乏具体的理论，当有新玩具时，他们几乎总是去玩新的。无论这些积木是什么特性，似乎更年幼的孩子知道的还不够多，或者没有足够强的信念或预测，不足以让他们感到惊讶。


    循着这一思路的其他研究——例如，约翰·霍普金斯大学的艾米·斯塔尔（Aimee Stahl）和丽莎·费根森（Lisa Feigenson）在 2015 年进行的一项研究——进一步表明，婴儿玩玩具的**方式**也与玩具令人惊讶的**方式**有关。^(⁴²³)


    “很容易认为婴儿是一块白板，”费根森说，“但实际上，婴儿对世界有丰富而复杂的预期——可能比人们认为的要多。”她认为，婴儿“根据他们对世界的理解来激励或推动下一步的学习，来决定他们该学习什么”。^(⁴²⁴)


    ## 计算视角下的自主体


    从计算的角度看，这就是不仅受奖励激励，还试图理解和预测环境的自主体。这种想法和强化学习本身一样古老，但是刚刚才突然开花结果。


    丹尼尔·伯莱因在 20 世纪 50 年代见证了一些最早的机器学习实验，并思考了使用惊讶或预测错误作为强化手段的问题。“进一步的研究很可能是设计一种根据经验改进技术的解题机器，”他写道，“肯定是用不匹配或冲突的减少作为强化因子，按照先后顺序改进前面的操作。”^(⁴²⁵)


    德国的 AI 研究者于尔根·施密德胡伯（Jürgen Schmidhuber）自 1990 年以来一直在探索这样一种想法，让自主体通过学习周边环境是如何运作的——也就是提高预测能力——来获得奖励。“它们可以被视为简单的人工科学家或艺术家，”他解释道，“它们有一种内在愿望，想对世界以及它们能做什么建立更好的模型。”^(⁴²⁶)


    在施密德胡伯看来，我们穿行于世界努力更好地压缩我们对世界的表示，这个想法提供了一个“创造力和乐趣的正式理论”。他解释道：“你需要计算资源。在学习一个模式之前，你需要很多计算资源，学习之后，你需要的计算资源减少了。减少的就是你节约的。你懒惰的大脑喜欢节约。而且，”他打了一个响指，“这就是乐趣！”^(⁴²⁷)


    同伯莱因一样，让施密德胡伯着迷的，不是人们为了解决面临的问题而做的事情，例如如何赢得比赛或逃出迷宫，而是人们在**没有**明确的事情可做的时候做的事情。


    他认为，婴儿就是这方面的完美例子。“即使没有及时满足口渴或其他天生的原始需求，婴儿也不会无所事事，而是积极探索：如果我这样动眼睛、手指或舌头，会得到怎样的感官反馈？”^(⁴²⁸)


    施密德胡伯指出，好奇心的内核存在一种基本的**张力**，可以说是一场拔河：当我们探索某个环境和我们在其中可选的行为时——无论是雅达利游戏中的微小世界、户外的真实自然，还是微妙的人类社会——我们会喜欢让我们惊讶的事情，同时我们也会变得越来越难以惊讶。就好像大脑中有两个不同的学习系统相互较劲。一个尽力不感到惊讶。另一个尽力让它惊讶。^(⁴²⁹)


    ## 预测错误作为奖励


    能不能尝试直接模拟这种张力关系呢？2017 年，加州大学伯克利分校的博士生迪帕克·帕塔克（Deepak Pathak）领导一个团队尝试构建这样的自主体。帕塔克构建的自主体包含两个模块，一个用来预测行为的结果，当现实与其预测匹配时给予奖励，另一个用来执行最大化惊讶的行为，当预测**错误**时给予奖励。^(⁴³⁰)


    例如，在《超级马里奥》中，如果按下跳键，你会预期在屏幕上看到马里奥跳起来一点，但前提是你已经尝试过几次。如果按向下的方向键，你会预期看到马里奥下蹲，但是你可能**没**想到这会让马里奥消失在管道中，进入一个地下世界！核心的想法是激励自主体探索游戏，让这种惊讶对自主体来说和对我们一样令人愉快，也就是说，把这些预测错误转化为**奖励**。只要结果令人惊讶就可以认为做对了，行为也会得到强化，就像能明确得分的行为一样。


    帕塔克团队研究了这种惊讶奖励可能产生的行为。他们将自主体放置在各种 3D 迷宫中（用 90 年代经典的玩家视角射击游戏《毁灭战士》的引擎构建），离“目标”位置很远。对于只有发现目标才有奖励的自主体，如果随机摇动操纵杆和敲击按钮后找不到目标，它们会倾向于直接“放弃”。用惊讶奖励训练的自主体则有探索迷宫的动力：角落里有什么？那个远处的房屋走近看是什么样子？因此，与没有内在驱动力的自主体相比，具有好奇心的自主体更能在复杂宏大的迷宫中找到通往目标的路。


    帕塔克的伯克利团队与 OpenAI 合作，一起继续探索将预测错误作为奖励信号的想法。令人惊讶的是，他们发现这种方案的一种显著简化——用预测屏幕上图像随机特征的网络代替专为预测未来可控方面而设计的网络——同样有效，在某些情况下甚至更好。^(⁴³¹)


    他们将`RND`自主体放到神庙中。在惊讶的内在奖励激励下，自主体大概能探索 20 到 22 个场景。其中有一次自主体取得了前所未有的成绩，他通关了全部 24
    个场景，一直抵达神庙左下角，然后逃离了神庙。^(⁴³²)


    ## 超越奖励


    因此，越来越明显的是，“内在动机”——新奇、惊讶等相关范式——是系统能拥有的一种很棒的驱动力，能作为来自环境的外在奖励的补充，尤其是在外在奖励稀疏或难以获得的情况下。


    当然，从这个角度来看，一个自然而然的问题是，如果我们将这种算法好奇的想法发展到极致，让强化学习自主体**完全**不在乎外在奖励，会怎么样？


    这样的自主体会是什么样子？它会做什么？


    几乎所有研究内在动机的人都对此感兴趣，谜底也在逐渐揭晓。


    马克·贝勒马尔和 DeepMind 的同事一直在致力于将基于计数的新奇奖励扩展到更复杂的领域，在后续研究中，他们尝试“突破内在动机的极限”。^(⁴³³)


    不出所料，自主体的行为表现得很不安分。追求分数的自主体通常会形成相当稳定和一致的最佳实践，而对于“最大化好奇”的自主体来说，唯一的收益来自探索行为，而这种收益并不稳定，随着所在的区域变得越来越熟悉，收益会消失。^(⁴³⁴)


    出乎意料的是这些自主体无需分数就能在游戏中表现得很好。新奇奖励极度膨胀的自主体在 4 个游戏中获得了**最高**分。好奇心培养能力。令人惊讶的是，仅凭新奇奖励，无需游戏分数，就足以玩好许多雅达利游戏——以它们无法获知的分数衡量！


    当然，游戏（或者说好游戏）在设计时就是为了吸引具有内在动机的人。毕竟，分数只是屏幕角落里不重要的像素，人类玩家可以决定要不要在意。因此，从这个角度来说，好奇心和探索的驱动力本身就能很好地替代得分最大化，至少在大多数游戏中是这样。例如，在《超级马里奥》中，吃金币、破砖块和踩敌人都会得分——但游戏的重点是让马里奥向右前进，那里有没有见过的风景。从这个意义上说，具有内在动机的自主体可能比以（其实没有意义的）得分为目标的自主体更符合游戏的预期模式。


    伯克利的帕塔克小组和 OpenAI 的布尔达和爱德华兹小组还在继续合作，研究大规模、系统性的、没有任何外在奖励的机器学习。^(⁴³⁵)


    他们最惊人的一个发现是，在大多数情况下，没有必要明确告诉自主体它是否已经死亡。如果你试图最大化外在分数，死亡的信息的确非常有用，因为这既是你的最终评分，也是一个标志，表明那样做你只能得
    0 分（从而有助于避免重蹈覆辙）。但对于纯粹由好奇心驱使的自主体来说，死亡仅仅意味着从头开始——这很无聊！游戏的开头是最熟悉的部分，既不新奇也不令人惊讶。结果证明，只需要用无聊作为自主体的抑制因素就够了。^(⁴³⁶)


    虽然具有内在动机的自主体被证明很擅长得分，但他们也发现了一个有趣的例外——《乒乓》游戏。一个只受内在动机激励的自主体，对得分毫不关心，玩游戏不是为了得分打败对手，而是为了故意延长反弹时间。得分后的“重置”本质上与其他游戏中死亡后的“重启”相同。与长时间反弹中出现的各种特异状态相比，回到老掉牙的初始位置简直令人厌烦。


    他们想知道，如果这样一个自主体与**自己**的副本对抗，会发生什么。在零和游戏中，好奇心和好奇心会如何对抗？答案是：出现了非零和的合作，因为双方追求的目标是一致的，即远离游戏中常见的初始状态。换句话说：它们达成一致，永不停止。“事实上，”研究人员写道，**“一局球变得如此之长，以至于雅达利模拟器都崩溃了。”**屏幕开始出现小故障，随机闪烁彩色斑点。当然，寻求惊讶的自主体会很高兴。^(⁴³⁷)


    取消游戏分数，创建**只有**内在动机的自主体，某种程度上可能看起来像一个奇怪的实验：强化学习领域一开始是围绕外在奖励最大化展开的。为什么要放弃用分数衡量行为？


    密歇根大学的萨廷德·辛格和心理学家理查德·刘易斯与安德鲁·巴图合作，从哲学角度探讨了这个问题。他们问：“奖励来自哪里？”^(⁴³⁸)


    只用屏幕上的像素玩雅达利游戏，做任何你想做的事情——而不是循着一些固定的奖励信号——其实视频游戏就是这样玩的。


    《传送门》是 2000 年代最受欢迎的电脑游戏之一，游戏中的 AI 反复承诺玩家完成游戏会有“蛋糕”。然而，在游戏进行到一半时，玩家发现了不祥的涂鸦，其中有句话写着：“蛋糕是谎言。”事实上，游戏结束时没有蛋糕。当然，这个著名的出尔反尔之所以能被接受，不仅仅是因为它充其量只能给出虚拟蛋糕，更是因为我们玩游戏就是为了取得进展、推进剧情和探索游戏世界，并没有其他奢望。


    我们不会将屏幕上闪烁的数字作为我们在游戏中获得的“真正”奖励。闪烁绚丽的色彩，以及它们在我们身上激起的任何反应，都是奖励。就我们在游戏上花的时间来说，这似乎已经足够了。


    ## 厌倦和上瘾


    强化学习的内在动机驱使人类渴望求知和探索。然而，内在动机不仅会引导良性行为，也会导致这些行为的病态镜像：厌倦和上瘾。


    我问迪帕克·帕塔克，厌倦的概念是否有意义。自主体会感到厌倦吗？


    当然，他说。


    在《超级马里奥》的第一关有一条沟，自主体几乎不可能知道如何跨越，因为这要求自主体连续 15 帧按住跳按钮。长序列的精准动作比短动作难学得多。^(⁴³⁹)


    “所以它没法过去，”帕塔克说，“就像死胡同，世界的尽头。”但是游戏的设计是不能往回走。自主体进退两难，学会了什么也不做。


    帕塔克观察到，还有一种更普遍的厌倦。在他的自主体玩《超级马里奥》很多回后，“它干脆直接停留在起点……因为任何地方都没有收益——游戏里的一切都不再让它好奇——所以它学会了哪里都不去”。自主体只在游戏起点处闲逛，没有动机做任何事情。


    这甚至有点让人伤感。人类厌倦了会停止游戏，而且通常可以停止。我们可以换新游戏，或者干脆关掉显示器，去玩其他的。而自主体则被残忍地困在一个它不再有任何动力去玩的游戏里。


    自从有了电子游戏，就有了专门的领域来研究是什么让游戏有趣，是什么让一个游戏比另一个更有趣。这显然既是出于心理学动机，也有经济动机。^(⁴⁴⁰)


    我突然想到，强化学习为我们提供了一个实用的基准，不仅可以衡量一个游戏有多难——玩家需要多长时间才能熟练——还可以衡量它有多有趣：玩家在失去兴趣和放弃之前会玩多久，或者他是否会选择花时间玩这个游戏而不是另一个游戏。今后很有可能会用内在动机驱动的强化学习自主体来对电子游戏的吸引力打分评级。


    认知科学家侯世达（Douglas Hofstadter）1979 年出版的《哥德尔、埃舍尔、巴赫》获得了普利策奖，在书中他构想了高级游戏程序的未来，指出了游戏能力、动机和智力的关联：


    问：会有比任何人都强的象棋程序吗？


    猜测：不会。可能会有程序能在国际象棋上击败任何人，但它们不会只是国际象棋程序。它们将是通用智能，它们将和人一样喜怒无常。“你想下棋吗？”“不，我厌倦了下棋。让我们谈谈诗歌。”


    这句话在现在看来已经过时了——当然这是后见之明，我们已经知道，不到 20 年后的 1997 年，IBM 的深蓝国际象棋机器战胜了人类世界冠军卡斯帕罗夫（Garry
    Kasparov）。深蓝是纯粹的象棋程序，它是在硬件层面定制的，只会下棋。它肯定不是通用智能，它只思考象棋，对文学不感兴趣。


    但这句话也许揭示了某种本质的真实内核。虽然深蓝不是通用的，但现在最先进的强化学习系统实际上是通用的，至少在棋类游戏和视频游戏上通用。`DQN`能玩几十种雅达利游戏，`AlphaZero`则擅长下各种棋。


    而且，那种能够学会流畅应对现实世界的通用人工智能（AGI）可能的确需要内在动机架构，这种架构可能会让它对自己玩得太多的游戏感到“厌倦”。


    与厌倦相对的另一面是**上瘾**——不是脱离，而是其黑暗的反面，病态的重复或坚持。在这方面，强化学习在某些情况下也表现出不可思议的、令人不舒服的人类行为。


    内在动机研究中有所谓的“嘈杂电视”问题。如果环境中存在本质上取之不尽、用之不竭的随机性或新奇性来源呢？受内在动机驱动的自主体会无力抗拒它吗？


    例如，如果屏幕上有不可预测的视觉噪声：电视雪花噪声就是典型例子，再比如噼啪跳跃的火焰、沙沙作响的树叶或紊乱的水流。如果是这样，每一帧新的和不可预测的光影状态都将是好奇心奖励。至少在理论上，看到这些的自主体应该会立即变得惊讶不已。


    然而，20 世纪七八十年代的大多数简单的雅达利游戏中并没有这种视觉随机性来源，因此也没有被实际检验过。帕塔克、布尔达和爱德华兹决定将这个思想实验付诸实践。他们设计了一个简单的
    3D 迷宫游戏，让自主体探索迷宫并找到出口。在游戏的一个版本中，迷宫的墙上有一个电视屏幕，自主体可以按按钮切换电视频道。会发生什么？


    结果是，自主体一旦看见电视屏幕，它对迷宫的探索就戛然而止。自主体将屏幕置于其视野中心，开始换频道。一会儿是飞机飞行的视频，一会儿是可爱的小狗，一会儿是一个人坐在电脑前，一会儿是汽车行驶在市中心。自主体不断换频道，充满新奇和惊讶，一动不动。


    视觉信息并不是唯一的能产生这种行为的随机因素，像掷硬币这样简单的事情也可以。近 10 年前，DeepMind 研究员洛朗·奥索（Laurent Orseau）就已经意识到了这一点，他是
    DeepMind 安全团队的第一个成员，现在是 DeepMind 基础研究小组的一员。早在有内在动机（可以瞬间变成电视迷）的雅达利游戏自主体出现之前，奥索就在思考一个更强大的，会被一枚硬币迷住的自主体。


    奥索思考的是一个假想的自主体，他称之为“知识寻求自主体”，这个自主体的目标是收集尽可能多的关于未知世界的信息。^(⁴⁴¹)


    斯金纳除了训练鸽子，还着迷于研究赌博上瘾。平均来说，赌场总是会赢，而根据桑代克的心理学，应该是有收益时，你会做得更多，亏损时，你会做得更少。从这个角度来看，赌博成瘾是不可能的。然而在现实世界中它偏偏存在，挑战行为主义者的理论。“赌徒似乎违反了效果律，”斯金纳写道，“虽然净收益为负，他们还是继续赌。因此有人认为，沉迷赌博一定还有其他原因。”^(⁴⁴²)


    赌博成瘾可能是**内在**奖励压制了外在奖励（毕竟，赌场总是会赢）。随机事件总是多少有点令人惊讶，虽然它们的概率已被理解得很透彻（例如一枚公平的硬币）。


    第 4 章曾讨论多巴胺编码时序预测误差的作用：发现收益好于或不如预期。然而，有一些奇怪的情形不符合这种模式。20 世纪发现了越来越多的证据表明，新奇和令人惊讶的事情会触发多巴胺的释放，无论是否存在与之相关的“收益”。^(⁴⁴³)


    在强化学习界发现新奇和惊讶的奖励价值的同时，神经科学界也在人类大脑中发现了这种机制。


    与此同时，关于这些通常对我们有益的机制为何会出错，原因也越来越清晰。强化学习自主体可能会沉迷于更换频道和玩老虎机，我们也同样如此。因为这些行为的结果从来都不符合我们的预期，所以总有一些令人惊讶之处，似乎总是需要“学习”。并不是说成瘾就一定是学习动机的过度，好奇心的过剩，但沿着这个思路深入，很有可能解释它实际上是如何起作用的。


    ## 出于自身


    内在动机的计算研究为困难环境下的学习提供了强大的工具包，《蒙特祖玛的复仇》就是典型例子。在更深层次上，关于为什么我们自己会有如此惊人的动机的问题，计算研究的成功经验也为我们带来了启发。


    通过更好地理解我们自己的动机和驱动力，反过来又有机会让两方面的见解互惠互补，进一步将 AI 构建得像我们自己的智能一样，灵活、富有弹性和多才多艺。


    虽然深度学习很成功，但迪帕克·帕塔克意识到，它有一个明显的弱点：每个系统——无论是机器翻译、物品识别，甚至是游戏——都是专门构建的。众所周知，深度学习首次真正展示出潜力，就是用手工标记的图像库训练了一个庞大的神经网络，以对图像分类为目的，明确地对系统进行修正。他说，这没错。“但问题是，这些
    AI 系统实际上并不智能。因为它们缺乏对人类至关重要的部分，就是通用的目的性行为，或者说通用目的的学习系统。”^(⁴⁴⁴)


    他认为，要构建通用系统，就需要打破这种针对特定任务的思维定式，还需要打破一个关键的、引人注目的技巧：这些模型需要大量明确的奖励信息。像`AlexNet`这样的图像识别系统可能需要数十万幅图像，每幅图像都由人类标注。很显然，我们在刚出生时获得视觉技能不是用这种方式。同样，对于强化学习来说，在雅达利游戏的世界里，每一帧画面都清清楚楚地告诉你你做得怎么样。“它做得很好，但它还需要一些东西，同样，非常非常奇怪，”他说，“仍然是奖励。”


    去掉明确的外在奖励可能是构建真正通用 AI 的必要环节：因为生活不像雅达利游戏，它绝对不会实时反馈我们每一个行为的对错。当然，父母和老师会纠正我们的拼写和发音，偶尔也会纠正我们的行为。但这仅仅涵盖了我们所做、所说、所想的一小部分，而且生活中的权威并不总是能达成共识。并且，我们必须学会建立自己的认知，自己做出判断，这是人类发展的核心过程之一。


    贝勒马尔说：“对我来说，要把好的探索做到极致，一直都是完全取消奖励。这超出了我通常的舒适区，但是你知道，我认为我们能对 AI 自主体做的最有趣的事情就是让它们有出于自身的目标，如果你愿意的话。当然，这样做存在安全问题，”他承认，“但正如你说的，我希望我的
    AI 自主体玩《蒙特祖玛的复仇》，只是因为它喜欢玩。”^(⁴⁴⁵)


    贝勒马尔说：“我们之前谈论了`ALE`（街机学习环境），以及它是如何成为一个很好的基准。从某种意义上说，我们差不多完成了对`ALE`的研究，也基本不再研究分数最大化。”他认为，借助`ε-贪婪`算法将按钮敲烂来得分，再用分数进行强化，很难称得上是智能，尽管结果可能令人印象深刻。“实际上我认为，应该根据行为而不是奖励函数来衡量智能。”有智能的行为应该是什么样子？这是他关注的核心问题之一。


    '
