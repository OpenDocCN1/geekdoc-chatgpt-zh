- raw: '95.  事实上，“沿自祖父”这个表达就源于美国重建时期的《吉姆克劳法》中歧视性的“祖父条款”。例如，1899年8月3日的《纽约时报》描述了这样一条法令：“它还规定，任何在1867年有权投票的人的后代现在都有权投票，不管当下条件如何。这就是所谓的‘祖父条款’。”[↩](#fnref95)


