    607. 许多小组在探索机器学习中“选择性分类”这一宽泛概念的潜力。例如，谷歌研究院的 Corinna Cortes 和同事探索了“可拒绝的学习”的想法，即分类器可以直接“撒手不干”或以其他方式拒绝做出分类判断。参见
    Cortes, DeSalvo&Mohri，“Learning with Rejection”；另见 C. K. Chow 从 20 世纪中期开始探索相关思想的统计研究：Chow，“An
    Optimum Character Recognition System Using Deci-sion Functions”，和 Chow，“On Optimum
    Recognition Error and Reject Tradeoff”。强化学习背景下的类似方法，参见 Li 等，“Knows What It Knows”。
    2018 年，由多伦多大学博士生大卫·马德拉斯（David Madras）领导的团队拓宽了这一思路，不仅探讨了机器学习系统如何试图推迟棘手或模糊的情形以避免出错，还探讨了它如何与收拾残局的人类决策者协同工作。如果人类决策者碰巧对某些类型的样本特别有把握，系统应该更加服从，即使它在其他方面很自信；相反，如果人类对某些类型的样本很不在行，系统可能会直接冒险做出最佳猜测，即使它不确定。目的不是优化它自己的准确性，而是优化人机决策团队整体的准确性。参见
    Madras, Pitassi&Zemel，“Predict Responsibly”。 在相关研究中，密歇根大学的张舜、Edmund Durfee 和 Satinder
    Singh 探索了网格世界环境中的自主体的想法，该自主体通过询问人类用户是否介意某些事情被改变来最小化副作用，并且能以尽可能少的询问来保障安全操作。参见 Zhang,
