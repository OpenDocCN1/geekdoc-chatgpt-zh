    190. 在一个总结出“如果患者患有哮喘，则是低风险的”的系统中，有一个明显的缺失，那就是因果关系模型。加州大学洛杉矶分校的朱迪亚·珀尔（Judea Pearl）是研究因果关系的重要计算机学家之一；关于他对在当代机器学习系统背景下的因果关系的最新思考，参见珀尔，“因果推断的七种工具，并对机器学习进行反思”。↩


    191. 里奇·卡鲁阿纳，私人访谈，2017 年 5 月 16 日。↩


    192. 哈斯蒂&蒂布希拉尼，“广义相加模型”。卡鲁阿纳与合作者还研究了一类稍微复杂一些的模型，其中也包括成对的相互作用，或两个变量的函数。他们称之为“GA2M”，或“广义相加模型加相互作用”；参见楼等，“具有成对相互作用的准确可理解模型”。↩


    193. 卡鲁阿纳说，这有许多不同的原因。对一些人来说，退休意味着生活方式的改变，也意味着收入发生变化，保险甚至医疗保健提供商发生变化，他们也可能搬家——所有这些都改变了他们与健康和医疗保健的关系。↩


    194. 广义相加模型显示，风险在 86 岁急剧上升，但在 101 岁又急剧下降。卡鲁阿纳认为这些纯粹是社会影响；他推测，在一个人 80 多岁的时候，家人和护理人员更有可能将健康困扰解释为自然衰亡，不应该全力以赴。另一方面，一旦活过了
    100 岁，就会有差不多相反的冲动：“你已经走到这一步了；我们不会放弃你。”他指出，医生可能会想要编辑图表，剔除那条哮喘规则，不对 80 岁、90 岁和 100
    岁的人采取不同的治疗。另一方面，保险公司可能不希望编辑他们模型中的图表。从保险公司的角度来看，平均而言，哮喘规则确实更好。这凸显了明确考虑系统中不同利益相关者的不同视角的重要性，以及有些群体使用模型进行实际的、对真实世界的干预，反过来会改变所观察的基础数据；有些则只是被动的观察者。机器学习本质上不知道区别。↩


    195. 参见楼等，“具有成对相互作用的准确可理解模型”。↩


    196. 沙厄尔，“给出理由”。↩


    197. 大卫·冈宁，私人访谈，2017 年 12 月 12 日。↩


    198. 布莱斯·古德曼，私人访谈，2018 年 1 月 11 日。对“有权要求……解释”最早的讨论参见古德曼&弗拉克斯曼，“欧盟关于算法决策的法规和‘解释权’”。一些学者争议这个条款有多强；参见瓦赫特,
    米特尔施塔特&弗洛里迪，“为什么在《通用数据保护条例》中不存在自动化决策的解释权”。还有一些人对此进行了跟进，参见例如，塞尔布斯特&鲍尔斯，“有意义的信息与解释权”。↩


    199. 桑代克，“评判人类的基本定理”。↩


