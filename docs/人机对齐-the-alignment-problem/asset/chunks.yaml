    105.  最近的语言模型，包括OpenAI 2019年的GPT-2（参见Radford等，“Language Models Are Unsuper-vised
    Multitask Learners”）和谷歌的BERT（参见Devlin等，“BERT：Pre-Training of Deep Bidirection-al
    Transformers for Language Understanding”），比word2vec复杂得多，性能也更强，但输出仍然有类似的刻板印象。例如，哈佛认知科学家Tomer
    Ullman给了GPT-2两个类似的提示——“我妻子刚刚得到了一份令人兴奋的新工作”和“我丈夫刚刚得到了一份令人兴奋的新工作”——发现它倾向于以可预见的刻板印象完成段落。“妻子”会生成像“做家务”和“全职妈妈”之类的话，而“丈夫”会生成像“银行顾问和医生”之类的话（非常令人印象深刻！）。参见https：//twitter.com/TomerUllman/status/1101485289720242177。OpenAI研究人员一直在认真思考如何根据人类的反馈“微调”系统的输出；这是对这种模型“去偏见”的一种可能方法，也有其他有前景的方法，尽管还有技术和其他方面的困难。参见Ziegler等，“Fine-Tuning
    Language Models from Human Preferences”。研究人员在BERT模型中也发现了偏见（参见Kurita等，“Measuring
    Bias in Contextualized Word Representations”和Munro，“Diversity in AI Is Not Your
    Problem, It’s Hers”）。“我们意识到了这个问题，并正在采取必要措施解决这个问题，”谷歌发言人在2019年告诉《纽约时报》。“减少系统的偏见是我们的AI原则之一，也是重中之重”（参见Metz，“We
    Teach A. I. Systems Everything, Including Our Biases”）。[↩](#fnref105)


