  trans: '


    # 随机梯度下降与感知机的兴衰


    这个感知机的基本训练过程，以及这个过程的许多衍生和改进版本，有一个听起来很专业的名字——“随机梯度下降”——但基本原理很简单。随机选取一个训练数据（“随机”）并将其输入模型。如果输出是你期望的，什么都不用做。如果输出不同于你的期望，则计算每个权重的调节方向（“梯度”），物理调节或是在软件中改数字，以降低这个特定例子的误差。向适当方向稍微移动它们（“下降”）。再随机挑一个新例子，重复这个过程。根据需要重复多次。


    这就是机器学习的基本框架。对这个简单的感知机的未来，媒体评论既有高估也有低估。


    《纽约时报》报道称，“海军今天展示了一台电子计算机的雏形，这台计算机预期将能够行走、说话、看、写、复制自己，并意识到自己的存在”。^(²⁸)


    《纽约客》写道，感知机，“顾名思义，具有原创思维的能力……事实上，我们认为它是人类大脑有史以来第一个真正的对手”。


    罗森布拉特对《纽约客》记者说：“我们在感知机上获得的成功意味着，第一次，非生物体能以有意义的方式处理和组织外部环境的输入。这是对感知机能做什么的适当描述。我的同事不赞成那些关于机器大脑的大话。他们更愿意称这种机器为自组织系统，不过这正好也是你我的大脑都具有的。”^(²⁹)


    同年，《新科学家》发表了一篇同样充满希望，但略显严肃的文章——《会学习的机器》。^(³⁰)


    文章继续写道：“‘学习机器’一词会让人联想到人和动物的学习。将大脑和机器进行类比需谨慎，但不管怎样，这会刺激各领域的研究者关注这里的进展，而且根据对学习机器的合理猜测，其最终将产生一个系统，能真正模拟某种形式的生物学习。”


    众所周知，AI 的历史是希望和失望交替循环的历史，感知机预示的《杰森一家》式的未来会来得很慢。^(³¹)


    几年后回顾这一切时，罗森布拉特希望媒体对他的发明的反响能更谨慎一些。他说大众媒体“像一群快乐的猎犬热情而敏锐地完成了这项任务”，同时承认自己“最初的报告缺乏数学严谨性”。^(³²)


    明斯基尽管对罗森布拉特和他的机器“非常钦佩”，但他开始“担心这种机器做不了什么”。1969 年，他和 MIT 的同事西蒙·派珀特（Seymour Papert）写了一本名为《感知机》的书，这本书基本上关闭了整个研究领域的大门。明斯基和派珀特用数学严格证明了，罗森布拉特的模型无法识别一些基本的模式。例如，不可能识别一张牌上有奇数个还是偶数个方块。要识别像这样更复杂的类别，需要多层网络，前层创建对原始数据的表示，后层对表示进行推理。但是没有人知道该如何调整前层参数，以使前层给出的表示对后层有用。这个领域撞上了一堵墙。“到
    1969 年时，已经发表了几千篇关于感知机的论文，”明斯基说。


    “我们的书遏止了这个趋势。”^(³³)


    仿佛被一片乌云笼罩，一切都分崩离析：研究、资金、人员。皮茨、麦卡洛克和莱文三人搬到了 MIT，但在与诺伯特·维纳（Norbert Wiener）发生误会后，他们被赶走了。对皮茨来说像父亲一样的维纳现在不理他了。陷入酗酒和抑郁的皮茨将笔记和论文付之一炬，包括一篇未发表的关于三维神经网络的论文，MIT
    想方设法挽救这篇论文却徒劳无功。皮茨于 1969 年 5 月死于肝硬化，年仅 46 岁。^(³⁴)


    到 1973 年，美国和英国政府都取消了对神经网络研究的资金支持，当英国一个名叫杰弗里·辛顿（Geoffrey Hinton）的心理学学生宣布他想从事神经网络方面的博士研究时，他被一再告诫，“明斯基和派珀特证明了这种模型没用”。^(³⁵)


    ## AlexNet 的故事


    时间来到 2012 年，多伦多，亚历克斯·克里泽夫斯基（Alex Krizhevsky）的卧室燥热得难以入睡。他的电脑配置了双英伟达 GTX580 GPU，已经连续两个星期以最大负荷运转，风扇不断排出热气。


    “又热又吵。”他说。^(³⁶)


    他在教机器如何看东西。


    克里泽夫斯基的导师杰弗里·辛顿已经 64 岁，依然没放弃。因为有理由抱有希望。


    到 20 世纪 80 年代，人们已经明白，多层网络（所谓的“深度”神经网络）也可以像浅层网络一样用例子进行训练。^(³⁷)


    80 年代末和 90 年代初，曾跟随辛顿做博士后的杨立昆（Yann LeCun）在贝尔实验室工作，训练神经网络识别手写的 0 到 9 数字，神经网络找到了第一个重要的商业用途：在邮局读取邮政编码，在
    ATM 机上读支票。^(³⁸)


    但这个领域再次面临瓶颈，到了 2000 年，仍然大致停留在识别手写邮政编码数据库的水平。人们知道，原则上，一个足够大的神经网络，只要有足够的训练例子和时间，几乎可以学习任何东西。^(³⁹)


    你的网络需要的“卡片”可能不是 50 张，而是 50 万张，但是随着互联网的发展，突然间有了似乎无穷无尽的图像库。只是有一个问题，它们通常不会带有分类标签。要想训练网络，必须知道网络的输出应该是什么。


    2005 年，亚马逊推出了 MTurk 平台，通过平台可以大规模招募人力，这样就可以雇佣成千上万的人通过简单的点击任务挣钱。（这项服务特别适合未来让 AI
    来完成的那些事情——因此有个绰号：人工的人工智能）2007 年，普林斯顿大学教授李飞飞利用 MTurk 平台以前所未有的规模招募人力，构建了一个此前不可能的数据集。这个数据集的构建花了
    2 年多时间，有 3 百万张图片，每张都由人工标注，分成 5000 多个类别。李飞飞称之为 ImageNet，并于 2009 年发布。计算机视觉领域突然有了堆积如山的训练数据和新的宏大挑战。从
    2010 年开始，来自世界各地的团队开始竞相创建和训练系统，可以准确地识别图像中的尘螨、集装箱船、摩托车、猎豹等等。


    与此同时，在整个 21 世纪初，摩尔定律仍然大致成立，这意味着 20 世纪 80 年代的计算机需要几天做完的计算，现在的计算机只需几分钟就能完成。另外，还有一个进展至关重要。20
    世纪 90 年代，视频游戏行业的发展催生了名为 GPU 的专用图形处理器，用来实时渲染复杂的 3D 场景；GPU 不是像传统的 CPU 那样每次执行一条高精度指令，而是并行执行大量简单的低精度指令。^(⁴⁰)


    亚历克斯·克里泽夫斯基在多伦多大学选修了为 GPU 写代码的课，准备在神经网络上尝试一下。他决定挑战一个流行的图像识别基准库 CIFAR-10，这个库包含缩略图大小的图像，每张图像属于
    10 个类别中的 1 个：飞机、小汽车、鸟、猫、鹿、狗、青蛙、马、船或卡车。克里泽夫斯基搭建了一个网络，使用 GPU 来训练网络对 CIFAR-10 图像进行分类。他惊讶地发现，他的网络从随机初始配置训练到目前最高水平的准确率，只需
    80 秒。^(⁴¹)


    这时，同实验室的伊利亚·萨特斯基弗（Ilya Sutskever）注意到了克里泽夫斯基的进展，鼓动他尝试更大的挑战。“我敢打赌，你可以用它来处理 ImageNet。”


    他们合作构建了一个庞大的神经网络，65 万个神经元，8 层，由 6000 万个可调权重连接。在父母家的卧室，克里泽夫斯基开始给它输入图像。


    一步一步，一点一点，系统越来越准确。


    尽管数据集很大，有几百万张图，但还是不够。克里泽夫斯基意识到他可以伪造。他开始做“数据扩增”，把图的镜像也输入进去。似乎有效果。他又对图稍加裁剪或上色。（当你向前或向侧面倾斜，或者从自然光转为人造光时，猫看起来仍然像猫）似乎也有效果。


    他尝试各种网络结构，改变网络层数，略带盲目地探索什么配置可能会有最佳效果。


    克里泽夫斯基偶尔会失去信心。萨特斯基弗从来没有。他一次又一次激励克里泽夫斯基。你能做到。


    “伊利亚就像一个宗教角色，”他说，“有时的确需要宗教角色。”


    测试一个新版模型，训练到准确率达到最高，需要日夜不停运转大约 2 周时间。这意味着这个项目虽然在某种程度上有点疯狂，但也有很多空闲时间。克里泽夫斯基会利用空闲时间思考、改进和等待。辛顿提出了“丢弃”的想法，在训练过程中，网络的某些部分会被随机关闭。克里泽夫斯基尝试了，似乎有效果，虽然不知道为什么。他还尝试了用所谓的“线性整流”函数作为神经元的激活函数。似乎也有效果。


    他在 ImageNet 比赛截止日期 9 月 30 日提交了他的最佳模型，然后等待最后的结果。


    2 天后，克里泽夫斯基收到了斯坦福大学邓嘉的邮件，那一年的比赛由他组织。在群发给所有参赛者的邮件中，邓嘉用不带感情色彩的语言让参赛者点击链接查看结果。


    克里泽夫斯基点击链接，结果出来了。


    他们不仅得奖了，还胜过了其他所有团队。他给这个在卧室里训练的神经网络命名为“超视”，但历史会简单地把它记为“AlexNet”，其错误率只有第二名的一半。


    到周五，ImageNet 大规模视觉识别挑战研讨会召开的时候，消息已经传开了。克里泽夫斯基获得了当天最后一个演讲时段，下午 5 点 05 分，他站在演讲台上。环顾会场，李飞飞在前排，旁边是杨立昆。全球顶尖的计算机视觉专家大部分都来了。会场爆满，过道上挤满了人。


    “我很紧张，”他说，“很不自在。”


    虽然不自在，面对站立的观众，克里泽夫斯基还是娓娓道来。


    1958 年，罗森布拉特就他的感知机接受采访时，有人问像感知机这样的机器会有什么实际或商业用途。“目前没有。”他笑着回答。^(⁴²)


    “你知道吗，发明会引导应用。”


    ## 问题


    2015 年 6 月 28 日周日晚上，网络开发者杰基·阿尔西内（Jacky Alcine）在家观看美国黑人娱乐电视大奖。他收到一条推送，提示有朋友通过谷歌照片同他分享了照片。他打开谷歌照片，发现网站的样子变了。“我当时想，‘哦，界面更新了！’我知道正在召开谷歌
    I/O 大会，但我还是感到很新奇，我点开了。”^(⁴³)


    标题是“大猩猩”。


    “我以为是我放错了照片。”他打开分组，里面全都是阿尔西内和他朋友的几十张照片，没有别的。“有 70 多张照片。没道理……我意识到出了问题。”


    阿尔西内发了推特。“谷歌照片，”他写道，“你们搞砸了。我的朋友不是大猩猩。”^(⁴⁴)


    不到 2 小时，谷歌首席架构师约纳坦·尊格（Yonatan Zunger）就回应了。“我的天啊，”他写道，“这绝对不可以。”


    尊格的团队几小时就上线了对谷歌照片的修改，到第二天早上，只有 2 张照片仍被贴错标签。然后谷歌采取了更激进的措施：他们干脆删除了这个标签。


    3 年后，2018 年，《连线》报道，在谷歌照片上，“大猩猩”的标签仍然被停用。这意味着，在这几年里，任何东西都不会被标记为大猩猩，包括真正的大猩猩。^(⁴⁵)


    有趣的是，2018 年和 2015 年的媒体都错误描述了这个错误的性质。“2 年后，谷歌通过清除图像分类器中的‘大猩猩’标签，解决了‘种族主义算法’问题”；“谷歌通过从图像标签中移除大猩猩来‘修正’其种族主义算法”；“谷歌照片修正了‘种族主义算法’，但效果一般。”^(⁴⁶)


    阿尔西内本身是程序员，也很熟悉机器学习，他知道问题不是因为算法有偏见。（这个算法就是随机梯度下降，可以说是计算机科学中最通用、最普通、最常见的算法：随机输入训练数据，调整模型参数，提高对图像正确分类的概率，并根据需要重复。）他马上意识到，不是算法有问题，而是训练数据本身存在严重偏差。“我不能责怪算法，”他说，“这不是算法的错。它的设计没问题。”


    理论上，这个系统可以从一组例子中学到任何东西，那它当然也会受制于教给它的例子。


    ## 校准和设计主导权


    我们将日常物品视为理所当然的程度，就是它们支配和影响我们生活的程度。


    ——玛格丽特·维萨^(⁴⁷)


    19 世纪照相最多的美国人不是林肯，也不是格兰特，而是弗雷德里克·道格拉斯，他在 20 岁时逃离了奴隶制，后来成了废奴主义作家和讲师。^(⁴⁸)


    在照片出现前，美国黑人的形象仅限于绘画和版画。道格拉斯写道：“黑人永远不可能从白人艺术家手中获得不带偏见的肖像。在我们看来，白人几乎不可能把黑人画得像，总是会过分夸大他们的显著特征。”^(⁴⁹)


    照片胜过失真的绘画，使得人们对黑人不仅仅限于同情，还增强了认可度。道格拉斯在谈到美国第一位黑人参议员海勒姆·雷夫斯的照片时说：“不管人们对这件事有没有偏见，他们都必须承认这位密西西比参议员是个男人。”^(⁵⁰)


    但也并非就此一帆风顺。随着摄影在 20 世纪变得更加普及，一些人意识到摄影也存在问题。正如杜·博伊斯（W. E. B. Du Bois）在 1923 年写道：“为什么没有更多的有色人种年轻人将摄影作为职业？普通的白人摄影师不知道如何处理有色皮肤，没有细腻的美感或色调，也不愿意下功夫，把它们表现得糟糕透顶。”


    经常有人批评电影和电视缺乏肤色多样性，演员和导演都是如此。但我们一般不会想到，这个问题不仅存在于摄影机前后，还存在于摄影机内部。正如康考迪亚大学传播学教授洛娜·罗斯（Lorna
    Roth）指出，“尽管学术文献涉及各种主题，但令人惊讶的是，很少有学者关注视觉再现设备的肤色偏见”。^(⁵¹)


    她写道，几十年来，电影制片商一直使用一张测试照片作为色彩平衡基准。这张测试照片被称为“雪莉卡”，以柯达员工雪莉·佩奇的名字命名，她是测试照片的第一位模特。^(⁵²)


    （电视和照片一样，几十年来一直根据白人肤色校准色彩。20 世纪 90 年代，罗斯找到《周六夜现场》的摄影师，问他们在开播前怎么校准摄像机。摄影师解释说，“技术人员会让一个女孩站在摄像机前，根据她的肤色来做微调，校准摄像机。女孩都是白人。”）^(⁵³)


    令人惊讶的是，根据 20 世纪六七十年代柯达公司高管们的说法，研发对更广域的深色调敏感的胶片的主要推动力不是来自民权运动，而是来自家具和巧克力行业，他们抱怨胶片没有充分展现深色木材的纹理和黑巧克力的质感，或牛奶巧克力和黑巧克力的差别。^(⁵⁴)


    柯达研发部门前经理厄尔·卡格（Earl Kage）对这段时期进行了反思：“我们部门的成员因为巧克力都变胖了，镜头前的东西拍摄结束后会被吃掉了。”当被问及这一切是否受民权运动影响时，他补充道：“有意思的是，以前从没有人这样说过，据我所知黑人肤色在当时从来都不受重视。”^(⁵⁵)


    随着时间推移，柯达的肤色模特越来越多样。“我开始在测试中大量采用黑人模特，并且很快就流行起来，”柯达的吉姆·里昂（Jim Lyon）回忆道，“我并不是为了政治正确。我只想让胶片能最好地呈现每个人的肤色”。


    20 世纪 90 年代，官方的柯达雪莉卡上有了 3 位不同种族的模特。他们推出的柯达金大胶卷号称可以拍摄“昏暗中的黑马”，电视广告深入人心。有一则广告是一个穿着亮白色空手道服的黑人男孩，微笑着表演空手道，可能是获得了新腰带。广告上写着：“爸，妈，除了柯达金胶卷，你们还能将这一刻托付给谁？”


    最初的目标客户导致他们的校准方法存在问题。现在，新的校准方法带来了新的客户。


    ## 修正训练集


    所有的机器学习系统，包括感知机在内，核心都有某种雪莉卡片：也就是训练用的数据集。如果某一类型的数据在训练数据中的代表不足或不存在，但在现实世界中存在，那么当训练好的系统面对这一类型的数据，给出的结果就难以预料。^(⁵⁶)


    正如加州大学伯克利分校的莫里茨·哈特（Moritz Hardt）所言，“大数据的全部意义在于，拥有了更多数据，我们就能构建更好的分类器。反过来，数据越少，表现也会越差。不幸的是，族群越小，可用的数据也会成比例地减少，这是很自然的，但这也意味着关于少数族群的模型通常会不如普通人群的模型”。^(⁵⁷)


    令阿尔西内沮丧的推文针对的正是这个问题。他是软件工程师，立刻明白了问题出在哪里。他推断，在谷歌的图片库中，黑人照片没有白人照片多。这个模型在看到不熟悉的东西时更容易出错。


    “我完全理解为什么会这样，”阿尔西内告诉我，^(⁵⁸)


    20 世纪的问题似乎在 21 世纪不可思议地重演。幸运的是，似乎也同样有解决方案。只要有人能站出来质疑这些 21 世纪的“雪莉卡片”到底代表了谁和什么，并明确指出更好的卡片应该是什么样子。


    21 世纪 10 年代初期，乔伊·布兰维尼（Joy Buolamwini）还是佐治亚理工学院的计算机科学本科生，有一次作业是为玩躲猫猫游戏的机器人编写程序。编程很容易，但有一个问题：机器人无法识别布兰维尼黑肤色的脸。“我借室友的脸完成了作业，然后想，‘肯定会有人去解决这个问题’”。^(⁵⁹)


    在本科快毕业时，她去香港参加一个创业比赛。当地一家初创公司演示了他们的“社交机器人”。这个机器人能与所有参观者正确交互……除了布兰维尼。这家初创公司使用的人脸识别开源代码正是她自己在佐治亚理工使用的那种。


    华盛顿大学的巴特亚·弗里德曼（Batya Friedman）和康奈尔大学的海伦·尼森鲍姆（Helen Nissenbaum）合写了一篇论文，是最早明确阐述计算系统偏见的文章之一，他们警告，“软件系统的传播成本相对较低，因此，一旦开发出来，有偏见的系统有可能产生广泛影响。如果成为了行业标准，偏见就会无处不在”。^(⁶⁰)


    就像布兰维尼自己说的，“在世界的另一端，我了解到算法偏见的传播速度与从互联网下载文件的速度一样快”。^(⁶¹)


    在牛津攻读硕士并做了一年罗兹学者项目后，布兰维尼去了 MIT 媒体实验室，做了一个增强现实项目，她称之为“励志镜子”，想法是在用户的脸上装饰鼓励性的或令人振奋的视觉效果——例如，让照镜子的人变成狮子。同样，效果很好，只有一个问题。布兰维尼自己照镜子时必须戴白面具。


    罪魁祸首当然不是随机梯度下降，而很明显是训练这些系统所用的图像集。每个人脸检测或识别系统的背后都有一个图像库——通常有几万或几十万张——系统最初就是用这些图像训练和开发的。这些训练数据就是
    21 世纪的雪莉卡片，通常不会公开：在网上传播的预训练模型几乎都没有公开训练数据。但是它肯定存在，并且永久地塑造了最终部署的系统的行为。


    因此，要根除偏见，一项重要举措就是更彻底地披露和分析主要学术和商业机器学习系统背后的训练数据集。


    例如，“自然环境下标记人脸”（LFW）数据集是最受欢迎的公共人脸图片数据库之一，该数据集是马萨诸塞大学阿默斯特分校的一支团队于 2007 年基于网络新闻图片创建的，此后被无数研究人员采用。^(⁶²)


    2007 年最早介绍该数据库的论文指出，从在线新闻中收集的图像“显然自身带有偏见”，但文中指出的“偏见”是从技术而非社会角度来考虑：“例如，在极高或极低光照条件下的图像并不多。”除了光照问题，作者写道，“提供的照片范围和多样性非常大。”


    '
