  trans: '


    # 特征构建与内在动机


    ## 特征构建问题

    ALE 则是直接提供屏幕像素，信息更多，但是更底层，也更难使用。除此之外没有其他信息。每个游戏都不同，不仅规则不同，像素转换为可用信息的方式也不同。一个被扔进新游戏的学习系统必须从零开始算出所有东西：当我得分时，这里的像素会闪烁，我挂掉之后那里又会出现那样的像素，我把游戏杆向左推时中间的这些像素会向左移动——哦，也许这就是**我**。要么研究人员必须预先找到在屏幕上提取有用特征的通用方法——这样就能应用于所有
    60 个游戏——要么所有的理解和意义构建都必须由系统即时生成。这就是“特征构建”问题。


    贝勒马尔开始尝试将一系列特征构建算法嵌入标准的强化学习系统中，并让它们开始游戏，结果不怎么样。不过，令他惊讶的是，这个研究很容易发论文，可能是因为评审专家对创建
    ALE 的工作印象深刻。“有趣的是，”他说，“当时评审专家告诉我，‘不错，你用街机游戏做了一件了不起的事情。我没法拒稿’。……它太大了……相比之下结果好坏已经不重要了。人们只会说，‘哇。你真的做到了’”。


    他和同事们可以说是堆出了一座山，现在该由这个领域的专家来想办法爬山了。


    2013 年贝勒马尔获得了博士学位，并从埃德蒙顿搬到伦敦加入了 DeepMind。 ^(³⁹²)


    他回忆道：“这个团队说，嘿，我们有一些卷积神经网络很擅长图像分类。嗯，能不能用卷积网络替代你那个不成熟的特征构建机制？”


    贝勒马尔不看好。“实际上我很长一段时间都不看好……感知强化学习的想法非常非常奇怪。而且，你知道，对神经网络的能力范围存在合理的怀疑。”


    但对这件事，贝勒马尔很快也会改变看法。


    将深度学习融入经典的强化学习算法后，姆尼用 7 款雅达利游戏进行了测试，在其中 6 款游戏击败了之前最厉害的强化学习算法。不仅如此，其中有 3 款游戏，他们的程序似乎能和人类玩家相媲美。他们在
    2013 年末的一篇会议论文中报告了进展。 ^(³⁹³)


    “论文引入深度学习解决了强化学习领域长时间无法解决的问题：即时生成特征。你可以在任何游戏中使用它，都适用。就这样……”


    贝勒马尔略微停顿了一下：“它起飞了。”


    ## 深度强化学习的超人表现

    2015 年 2 月，《自然》杂志刊出了一篇封面文章，题为《学习曲线：自学的 AI 软件玩视频游戏的表现媲美人类》。 ^(³⁹⁴)


    这种模型——被称为“深度 Q 网络”，简称 DQN——玩《小钢珠》游戏的得分是专业的人类游戏测试员的 25 倍。玩《拳击》比人类表现好 17 倍。玩《打砖块》好
    13 倍。《自然》杂志的文章中用一张表格列举了 DQN 取得的令人瞠目结舌的压倒性优势，占了几乎整整一页，玩所有游戏都使用同一个通用模型，不用更改或微调就能玩各种游戏。


    然而，在表格底部，有一些顽固的游戏拒绝向 DQN 屈服。其中一个特别显眼，位于表格最底部。


    特立独行的是《蒙特祖玛的复仇》，1984 年发行的游戏，主角是一个名叫巴拿马·乔的探险者，他必须穿过一座神庙，到处都是绳子、梯子和致命且非常隐蔽的阿兹特克陷阱。\[“我对蒙特祖玛和阿兹特克文化没有任何研究，”设计者罗伯特·耶格（Robert
    Jaeger）承认——他把这个游戏卖给帕克兄弟时才 16 岁——“我其实只是觉得这个主题很有意思，名字也很酷。”\] ^(³⁹⁵)


    怎么回事？


    一个原因是在这个游戏中**非常**容易挂掉。几乎任何错误——碰到敌人，从太高的地方跳下，碰到挡墙——都必死无疑。DQN 系统使用了ε-贪婪探索，即有一定的概率随机按按钮来了解哪些动作会带来奖励。在《蒙特祖玛的复仇》中，这几乎是不断自杀。


    第二个也是更重要的原因是，在《蒙特祖玛的复仇》中，得分点少得可怜。在玩家得分之前，需要做很多事情。在《越狱》或《太空入侵者》这样的游戏中，即使是从没玩过的新手，随机按按钮，也能很快意识到自己多少做对了一些事情。这足以启动学习过程：对这类游戏，DQN
    能得分，并逐渐学会对类似情况采取类似行动。相比之下，在《蒙特祖玛的复仇》中，除了死亡之外，很少有事件能提供反馈。例如，第一关，在拿到第一个道具之前，你要跳过
    4 个裂缝，爬 3 个梯子，逆向跑过一条传送带，抓住一条绳子，跳过一个滚动的头骨，拿到道具后才会奖励可怜的 100 分（以及很不合时宜的《蟑螂歌》的前 5
    个音符）。


    在奖励很少的环境中，随机探索的算法无法立足；通过随意拨动操纵杆和按按钮，做对**所有**必要步骤获得第一个奖励，基本上没有可能。而如果没有得分，它无法知道自己是否走上了正确道路。
    ^(³⁹⁶)


    上一章曾讲到，应对稀疏问题的一个办法是**塑造**：用额外的奖励推动算法朝正确方向前进。但我们也看到了要确保不会有算法可以利用的漏洞有多困难。例如，如果每过
    1 秒钟只要巴拿马·乔**没**死就奖励他，可能会导致自主体学会永远不要离开安全的出发平台。那将是动物研究人员所说的“习得性无助”的机器版本。 ^(³⁹⁷)


    其他类似的想法也行不通。比方说，在巴拿马·乔成功跳过滚动的头骨时给予奖励，可能会让自主体在头骨上跳来跳去，而不是冒险深入虎穴。同样，在他成功跳上或跳下绳子时给予奖励也会激励他像人猿泰山一样荡来荡去。这些都不是我们想要的。


    此外，塑造奖励通常因游戏而异，并且需要了解特定游戏通关技巧的人类监督者帮忙设置。这有点像作弊。ALE 背后的理念——以及 DQN 激动人心的成就——是用单一算法从零开始掌握几十种不同的游戏环境，只以屏幕图像和游戏得分作为输入。


    那该怎么办？面对《蒙特祖玛的复仇》这样的诅咒，像 DQN 这样的通用试错算法应该怎么改进？


    有一个诱人的线索藏在显眼处。人类可以在没有任何额外塑造奖励的情况下学会玩《蒙特祖玛的复仇》。人类玩家本能地**想**爬上梯子，到达远处的平台，进入下一场景。我们想知道锁着的门后面是什么，神庙到底有多大，以及外面还有什么。不是因为我们凭直觉知道这样会得“分”，而是出于更纯粹、更根本的原因：我们就是想知道会发生什么。


    那么，面对《蒙特祖玛的复仇》这类奖励稀疏的游戏，也许需要的不是额外增加奖励，而是一种完全不同的方法。也许答案正相反，与其创建更复杂的胡萝卜加大棒系统，不如设计受**内在**而非外在动机驱动的自主体。
    ^(³⁹⁸)


    在过去几年，科学对好奇心这个主题的兴趣大增，机器学习研究人员和研究儿童认知的心理学专家之间也出现了以前不太可能的合作，目的是从更精确、更基础的角度更好地理解好奇心。到底什么是好奇心？为什么我们会有好奇心？我们如何才能将好奇心不仅仅是赋予我们的孩子，还赋予机器？


    为什么这变得越来越重要？


    ## 好奇心是一门科学

    “渴望”知道为什么和怎么做，“好奇”……是一种心灵的欲望，通过不断和不知疲倦的知识产出获得的持久喜悦，超越了任何短暂激烈的肉体快乐。


    ——托马斯·霍布斯（Thomas Hobbes） ^(³⁹⁹)


    好奇心是所有科学的开端。


    ——司马贺（Herbert A. Simon） ^(⁴⁰⁰)


    丹尼尔·伯莱因（Daniel Berlyne）是心理学好奇心研究的教父。1949 年，伯莱因发表的第一篇文章就是试图定义，当我们说某件事“有趣”，或者一个人或动物对某件事“感兴趣”时，我们到底是在说什么。
    ^(⁴⁰¹)


    一个完备的子领域逐渐成形。动物在**没有**任何奖励的情况下是怎样学习的？


    伯莱因指出，心理学的历史在很大程度上是人和动物**被迫**做事的故事：填写调查问卷或口头回答问题，按下杠杆获得食物。这种模式使得该领域存在方法盲区。心理学居然还想研究生物如何自主行动的问题？从专业角度来看，这几乎是矛盾的。


    “在某种程度上，人类如此乐于助人和顺从是心理学的不幸，”他写道， ^(⁴⁰²)


    在心理学中，到 20 世纪中期，用奖惩训练动物的研究占据了主导地位，一度似乎可以解释关于智能生物行为的一切。但是有些数据无法解释。1950 年，威斯康星大学的哈利·哈洛（Harry
    Harlow）观察恒河猴玩由锁和闩组成的物理拼图，他创造了“内在动机”一词来描述它。 ^(⁴⁰³)


    然而，正如伯莱因认识到的，这种内在动机，就像对食物和性的追求一样，是人性的核心——尽管“多年来被心理学过度忽视了”。 ^(⁴⁰⁴)


    生活中的好奇心对伯莱因的驱使似乎和做研究一样强烈。他至少懂 10 种语言（其中流利的有六七种），钢琴造诣很深，还热衷慢跑和旅行。在 52 岁英年早逝时，他正在尝试坐遍全世界的地铁。尽管著述量惊人，但他很少在晚上或周末工作，他还有很多其他事情要做。
    ^(⁴⁰⁵)


    他的想法，尤其是向神经科学和信息论寻求线索的提议，将会激励 20 世纪下半叶的几代心理学家，在 21 世纪，他们将回到这里。从 21 世纪 00 年代末开始，一直持续到
    21 世纪 10 年代的深度学习热潮，数学家、信息论专家和计算机科学家——在《蒙特祖玛的复仇》这样的例子中，他们一直在研究内在动机的问题——会在**他的**想法中寻找启发。


    他认为，从广义上讲，人类的内在动机似乎包含 3 种相关但不同的驱动力：追求新奇、惊讶和掌控。其中每一个都提供了关于动机和学习的诱人想法，在这 10 年里，人们发现，这些想法既适用于我们自己，似乎同样也适用于机器。


    ## 新奇

    设计实验时想要回答的问题经常是“这种动物会对这种刺激做出什么反应？”……一旦实验情况变得复杂……一个新问题出现了：“这种动物会对哪种刺激产生反应？”


    ——丹尼尔·伯莱因 ^(⁴⁰⁶)


    左右为难时，我通常会选择那个从未尝试过的。


    ——梅·韦斯特（Mae West） ^(⁴⁰⁷)


    新奇是人类好奇心和内在动机的核心概念之一。在缺乏强有力的激励的情况下，我们并不会像使用ε-贪婪探索的简单强化学习者那样随机行动。相反，我们非常稳健可靠、可预见地被新事物吸引。


    20 世纪 60 年代中期，凯斯西储大学的罗伯特·范茨（Robert Fantz）注意到，如果给人类婴儿展示已经看过的杂志图片，他们的目光停留在图片上的时间会减少。
    ^(⁴⁰⁸)


    婴儿观察新事物的强烈偏好，被心理学家利用来测试婴儿的视觉辨别能力，甚至**记忆力**。 ^(⁴⁰⁹)


    强化学习领域很快就注意到了这种内在新奇偏好的想法，并意识到了在计算领域可以用它来做什么。 ^(⁴¹⁰)


    然而，这里面有一个明显缺陷。计算在某种情形下采取“某种行动”的次数是什么意思？正如伯莱因在 1960 年说的：“‘新’这个词常用于日常语言，似乎很容易理解。但如果想明确一个刺激模式是新奇的，以及它有多新奇到底意味着什么，就会面临一连串的陷阱和困境。”
    ^(⁴¹¹)


    对于像走迷宫之类的简单环境，当然可以直接记录遇到的每一个情形，并在每次遇到同样情形时计数。（用铅笔描绘走迷宫的路径就是将这个数据直接记录在迷宫上。）这种方法——保存一张巨大的表格，记录经历的每种情况、做过的事情和发生的事情——被称为“表格式”强化学习，不幸的是，除了非常小的环境，对其他环境完全不可行。例如井字棋可能是最简单的棋盘游戏，但也有上千种独特的棋局。
    ^(⁴¹²)


    然而，除了实际可行性之外，在更复杂的环境中，还有更深、更哲学的问题：处于“同样”的情形是什么意思？例如，在雅达利游戏中，像素的组合方式太多了，详尽记录遇到的每帧画面，并据此略微偏好新的画面，对产生有趣的行为没有任何帮助。对于复杂一点的游戏，你不太可能多次遇到完全相同的像素组合。从这个角度来看，几乎每个场景都是新奇的，几乎每个动作都未曾尝试过。即使你能存储这样一张表，也没什么指导意义。


    在人类日常决策中，当有人说，他们“以前从未遇到过这种情况”，我们通常不会把这句话理解为“在这个精确的地点，在这个精确的时间，这个精确的光斑图案击中了我的视网膜，这个精确的思维序列出现在我的大脑里”，否则这句话总是正确的，没有任何意义。我们指的是情境的**关键**特征，有时无法言说，我们据此来判断它的新奇性。


    在一款雅达利游戏中，我们想要的是以某种方式衡量，我们所处的情形——由屏幕上的像素表示——是否与我们之前所处的情形在某种意义上存在相似性。我们想将有更深层相似性的情形关联起来。


    记录你见过某种情形多少次，这种“基于计数”的方法很被看好，但又不好操作。在伦敦的 DeepMind，贝勒马尔想知道如何才能将这种方法推广到更复杂的环境中。在像《青蛙过街》或《过马路》这类雅达利游戏中，你试图穿过一条繁忙的道路，理想情况是，每次你成功过去时，都应该增加某种“计数”，记录你已经这样做了多少次，即使交通总是以某种新的随机模式运行。


    贝勒马尔和同事在尝试一种称为“密度模型”的数学思想，似乎看到了一些希望。 ^(⁴¹³)


    他们用 20 世纪 80 年代早期的一款名为《Q 伯特》的雅达利游戏做实验。在这个游戏中，你绕着一个由方砖组成的金字塔跳跃，把每块砖都变成不同的颜色，然后再进入全新的、不同颜色的下一关，在下一关你又可以做同样的事情。他们让一个随机初始化的、空白的
    DQN 自主体从头开始玩《Q 伯特》，屏幕左侧有一个面板实时显示自主体体验到的“新奇感”，用密度模型衡量。


    起初——就像我们一样——一切都是新的。面板停留在最大值。每一帧画面都被认为几乎是全新的。


    他们对自主体进行了几个小时的训练，使其逐渐变得更擅长得分（在《Q 伯特》中，它每翻一块砖就能得 25 分）。他们让自主体重新登入，然后在一旁看它怎么玩。现在有了经验的自主体四处走动，获取积分。度量新奇感的绿条（专业术语“负对数概率”）几乎不会闪烁。自主体以前都见过。


    贝勒马尔发现自主体第一次过第一关时训练过程启动了。他看了重播，想明确发生了什么。不出所料，当自主体快过关时，绿条升起来了。


    “现在，”贝勒马尔说，“当自主体快过关时，它会说，**嘿，这些情形很新奇！我从未体验过。这对我来说很新奇。**这是非常好的进展：随着越来越接近过关，这个信号越来越强。”
    ^(⁴¹⁴)


    自主体跳到最后一块砖，第一次完成这一关。突然，屏幕闪烁起来。棋盘重置为下一关，青砖金字塔消失了，取而代之的是全新的亮橙色金字塔。“看这个！”贝勒马尔说。绿条一路高歌猛进。新奇的信号几乎爆表。“自主体马上意识到，**我从未来过这里。”**


    密度模型似乎捕捉到了纷繁复杂的环境中的新奇性，这些环境太大、太丰富了，无法直接计算。“我们看着结果，心想**一定**能做些什么。”


    他们称这个模型为“伪计数”。现在的问题是，他们能利用伪计数激励自主体**寻找**新奇状态吗？ ^(⁴¹⁵)


    很明显，如果他们成功了，回报会是什么。“我们迫不及待，”他说，“想尝试破解《蒙特祖玛的复仇》。”


    困住巴拿马·乔的神庙有 24 个场景。在相当于没日没夜玩了 3 个星期游戏后，在其他几十种雅达利游戏中表现出超人能力的 DQN 自主体只到了**第 2 关**——几乎还停留在起跑线。有一整个神庙等待被探索，充满危险；如果自主体看到以前没见过的东西能获得奖励，也许就能到达其他自主体没去过的地方。


    贝勒马尔和他的团队猜测，一个能感知新奇的自主体，如果把新奇感当作游戏分数的补充奖励，会更有动力，玩游戏会更成功。他们进行了尝试，并让它像之前的 DQN 自主体一样训练同样长的时间，1
    亿帧，3 周的时长。表现差异令人震惊。


    同样的 DQN 自主体接受了基于新奇奖励的训练后，拿到第一把钥匙的速度快得惊人。它最终过了 15 关，而不是 2 关。


    新奇驱动的自主体不仅得到了更多分数，似乎还表现出了不同的行为，不仅仅是量的区别，还有质的区别。“优先注视”可以被利用来驱使它探索那些仅靠奖励做不到的区域。新奇驱动的自主体似乎更有**魅力**，甚至更人格化。当奖励稀缺时，它不仅仅是乱摇游戏杆，它有驱动力。


    贝勒马尔说：“伪计数自主体**马上**就会出去探索世界。”


    ## 惊讶的快乐

    认知好奇心的机制……通过类似于概念冲突的方式起作用，它有显著的激励功能。


    ——丹尼尔·伯莱因 ^(⁴¹⁶)


    不是说孩子是小科学家，而是说科学家是大孩子。


    ——艾莉森·高普尼克（Alison Gopnik） ^(⁴¹⁷)


    除了新奇，与好奇心密切关联的另一个高层概念是**惊讶**。 ^(⁴¹⁸)


    MIT 的劳拉·舒尔茨（Laura Schulz）是最早研究惊讶在人类好奇心中的作用的人之一。在 2007 年的一项研究中，她让儿童玩盒子里的小丑之类的玩具，杠杆会打开盖子把玩偶从盒子里举起来。
    ^(⁴¹⁹)


    “关于儿童的玩耍和好奇心，以前我们只知道，”舒尔茨解释道，“嗯，如果 4 岁的孩子已经玩了一段时间一个盒子，那么当你拿出一个新盒子，他们应该会喜欢这个新盒子。他们应该马上会去玩新盒子，因为关于好奇心的基本思想是它是**感知**到的新奇感，感知到的显著性：这个东西他们没见过。”
    ^(⁴²⁰)


    但舒尔茨发现，事情没那么简单。在一些试验中，第一个盒子的展示被故意弄得模糊不清。这个盒子有两个杠杆，如果两个都按下，两个不同的玩偶会同时从盒子中升起。但是不演示单独按下一个杠杆会有什么作用。一个杠杆负责所有玩偶，另一个不起作用？还是杠杆对应自己这边的玩偶？还是对面的那个？面对模糊不清的情形，如果有机会，4
    岁的孩子**不会**立刻从原来的玩具换到新奇的玩具。他们会继续玩那个双杠杆盒子，弄清楚它到底是怎么工作的。


    “对于并不特别新奇的事物，只要让我们感到困惑，我们经常也会很好奇。”舒尔茨说。 ^(⁴²¹)


    事情开始变得清晰，**惊讶**——不确定性，排除歧义，获取信息——同新奇一样，也是儿童内在动机的驱动因素。


    这启发了另一条研究脉络，同样丰富，跨越认知和计算。


    舒尔茨和罗格斯大学的心理学家伊丽莎白·博纳维茨（Elizabeth Bonawitz）以及一群合作者一起，进一步使用配重积木块进行了研究。之前的研究表明，大约在
    6 岁时，儿童就开始有了如何最好地平衡不同大小和形状的积木的理论。6 岁的一些孩子（错误地）认为，即使积木不对称，也总能在中间位置保持平衡，而另一些孩子（正确地）推断，积木在**质心**处，在更靠近厚边的地方保持平衡。这启发了研究人员使用磁铁制造积木，这些积木可以被很巧妙地制造成与这两种假设都不相符。如果孩子们玩的积木和他们预想的一样，他们标准的新奇偏好会悄悄潜入，如果有新玩具，他们会放弃手中的积木，选择新玩具。但如果他们感到手中的积木似乎**违反**了他们关于积木应该如何平衡的理论——不管他们的理论是否正确！——他们会保持专注，继续玩这个积木，即使可以换新玩具。
    ^(⁴²²)


    '
  toc: []
- raw: '四五岁的孩子往往对如何平衡积木缺乏具体的理论，当有新玩具时，他们几乎总是去玩新的。无论这些积木是什么特性，似乎更年幼的孩子知道的还不够多，或者没有足够强的信念或预测，不足以让他们感到惊讶。


    循着这一思路的其他研究——例如，约翰·霍普金斯大学的艾米·斯塔尔（Aimee Stahl）和丽莎·费根森（Lisa Feigenson）在2015年进行的一项研究——进一步表明，婴儿玩玩具的**方式**也与玩具令人惊讶的**方式**有关。
    ^([^(423)](#fn423))


    “很容易认为婴儿是一块白板，”费根森说，“但实际上，婴儿对世界有丰富而复杂的预期——可能比人们认为的要多。”她认为，婴儿“根据他们对世界的理解来激励或推动下一步的学习，来决定他们该学习什么”。
    ^([^(424)](#fn424))


    从计算的角度看，这就是不仅受奖励激励，还试图理解和预测环境的自主体。这种想法和强化学习本身一样古老，但是刚刚才突然开花结果。


    丹尼尔·伯莱因在20世纪50年代见证了一些最早的机器学习实验，并思考了使用惊讶或预测错误作为强化手段的问题。“进一步的研究很可能是设计一种根据经验改进技术的解题机器，”他写道，“肯定是用不匹配或冲突的减少作为强化因子，按照先后顺序改进前面的操作。”
    ^([^(425)](#fn425))


    德国的AI研究者于尔根·施密德胡伯（Jürgen Schmidhuber）自1990年以来一直在探索这样一种想法，让自主体通过学习周边环境是如何运作的——也就是提高预测能力——来获得奖励。“它们可以被视为简单的人工科学家或艺术家，”他解释道，“它们有一种内在愿望，想对世界以及它们能做什么建立更好的模型。”
    ^([^(426)](#fn426))


    在施密德胡伯看来，我们穿行于世界努力更好地压缩我们对世界的表示，这个想法提供了一个“创造力和乐趣的正式理论”。他解释道：“你需要计算资源。在学习一个模式之前，你需要很多计算资源，学习之后，你需要的计算资源减少了。减少的就是你节约的。你懒惰的大脑喜欢节约。而且，”他打了一个响指，“这就是乐趣！”
    ^([^(427)](#fn427))


    同伯莱因一样，让施密德胡伯着迷的，不是人们为了解决面临的问题而做的事情，例如如何赢得比赛或逃出迷宫，而是人们在**没有**明确的事情可做的时候做的事情。


    他认为，婴儿就是这方面的完美例子。“即使没有及时满足口渴或其他天生的原始需求，婴儿也不会无所事事，而是积极探索：如果我这样动眼睛、手指或舌头，会得到怎样的感官反馈？”
    ^([^(428)](#fn428))


    施密德胡伯指出，好奇心的内核存在一种基本的**张力**，可以说是一场拔河：当我们探索某个环境和我们在其中可选的行为时——无论是雅达利游戏中的微小世界、户外的真实自然，还是微妙的人类社会——我们会喜欢让我们惊讶的事情，同时我们也会变得越来越难以惊讶。就好像大脑中有两个不同的学习系统相互较劲。一个尽力不感到惊讶。另一个尽力让它惊讶。
    ^([^(429)](#fn429))


    能不能尝试直接模拟这种张力关系呢？2017年，加州大学伯克利分校的博士生迪帕克·帕塔克（Deepak Pathak）领导一个团队尝试构建这样的自主体。帕塔克构建的自主体包含两个模块，一个用来预测行为的结果，当现实与其预测匹配时给予奖励，另一个用来执行最大化惊讶的行为，当预测**错误**时给予奖励。
    ^([^(430)](#fn430))


    例如，在《超级马里奥》中，如果按下跳键，你会预期在屏幕上看到马里奥跳起来一点，但前提是你已经尝试过几次。如果按向下的方向键，你会预期看到马里奥下蹲，但是你可能**没**想到这会让马里奥消失在管道中，进入一个地下世界！核心的想法是激励自主体探索游戏，让这种惊讶对自主体来说和对我们一样令人愉快，也就是说，把这些预测错误转化为**奖励**。只要结果令人惊讶就可以认为做对了，行为也会得到强化，就像能明确得分的行为一样。


    帕塔克团队研究了这种惊讶奖励可能产生的行为。他们将自主体放置在各种3D迷宫中（用90年代经典的玩家视角射击游戏《毁灭战士》的引擎构建），离“目标”位置很远。对于只有发现目标才有奖励的自主体，如果随机摇动操纵杆和敲击按钮后找不到目标，它们会倾向于直接“放弃”。用惊讶奖励训练的自主体则有探索迷宫的动力：角落里有什么？那个远处的房屋走近看是什么样子？因此，与没有内在驱动力的自主体相比，具有好奇心的自主体更能在复杂宏大的迷宫中找到通往目标的路。


    帕塔克的伯克利团队与OpenAI合作，一起继续探索将预测错误作为奖励信号的想法。令人惊讶的是，他们发现这种方案的一种显著简化——用预测屏幕上图像**随机**特征的网络代替专为预测未来可控方面而设计的网络——同样有效，在某些情况下甚至更好。
    ^([^(431)](#fn431))


    他们将RND自主体放到神庙中。在惊讶的内在奖励激励下，自主体大概能探索20到22个场景。其中有一次自主体取得了前所未有的成绩，他通关了全部24个场景，一直抵达神庙左下角，然后逃离了神庙。
    ^([^(432)](#fn432))


    **超越奖励**


    因此，越来越明显的是，“内在动机”——新奇、惊讶等相关范式——是系统能拥有的一种很棒的驱动力，能作为来自环境的外在奖励的补充，尤其是在外在奖励稀疏或难以获得的情况下。


    当然，从这个角度来看，一个自然而然的问题是，如果我们将这种算法好奇的想法发展到极致，让强化学习自主体**完全**不在乎外在奖励，会怎么样？


    这样的自主体会是什么样子？它会做什么？


    几乎所有研究内在动机的人都对此感兴趣，谜底也在逐渐揭晓。


    马克·贝勒马尔和DeepMind的同事一直在致力于将基于计数的新奇奖励扩展到更复杂的领域，在后续研究中，他们尝试“突破内在动机的极限”。 ^([^(433)](#fn433))


    不出所料，自主体的行为表现得很不安分。追求分数的自主体通常会形成相当稳定和一致的最佳实践，而对于“最大化好奇”的自主体来说，唯一的收益来自探索行为，而这种收益并不稳定，随着所在的区域变得越来越熟悉，收益会消失。
    ^([^(434)](#fn434))


    出乎意料的是这些自主体无需分数就能在游戏中表现得很好。新奇奖励极度膨胀的自主体在4个游戏中获得了**最高**分。好奇心培养能力。令人惊讶的是，仅凭新奇奖励，无需游戏分数，就足以玩好许多雅达利游戏——以它们无法获知的分数衡量！


    当然，游戏（或者说好游戏）在设计时就是为了吸引具有内在动机的人。毕竟，分数只是屏幕角落里不重要的像素，人类玩家可以决定要不要在意。因此，从这个角度来说，好奇心和探索的驱动力本身就能很好地替代得分最大化，至少在大多数游戏中是这样。例如，在《超级马里奥》中，吃金币、破砖块和踩敌人都会得分——但游戏的**重点**是让马里奥向右前进，那里有没有见过的风景。从这个意义上说，具有内在动机的自主体可能比以（其实没有意义的）得分为目标的自主体更符合游戏的预期模式。


    伯克利的帕塔克小组和OpenAI的布尔达和爱德华兹小组还在继续合作，研究大规模、系统性的、没有任何外在奖励的机器学习。 ^([^(435)](#fn435))


    他们最惊人的一个发现是，在大多数情况下，没有必要明确告诉自主体它是否已经死亡。如果你试图最大化外在分数，死亡的信息的确非常有用，因为这既是你的最终评分，也是一个标志，表明那样做你只能得0分（从而有助于避免重蹈覆辙）。但对于纯粹由好奇心驱使的自主体来说，死亡仅仅意味着从头开始——这很无聊！游戏的开头是最熟悉的部分，既不新奇也不令人惊讶。结果证明，只需要用无聊作为自主体的抑制因素就够了。
    ^([^(436)](#fn436))


    虽然具有内在动机的自主体被证明很擅长得分，但他们也发现了一个有趣的例外——《乒乓》游戏。一个只受内在动机激励的自主体，对得分毫不关心，玩游戏不是为了得分打败对手，而是为了故意延长反弹时间。得分后的“重置”本质上与其他游戏中死亡后的“重启”相同。与长时间反弹中出现的各种特异状态相比，回到老掉牙的初始位置简直令人厌烦。


    他们想知道，如果这样一个自主体与**自己**的副本对抗，会发生什么。在零和游戏中，好奇心和好奇心会如何对抗？答案是：出现了非零和的合作，因为双方追求的目标是一致的，即远离游戏中常见的初始状态。换句话说：它们达成一致，永不停止。“事实上，”研究人员写道，**“一局球变得如此之长，以至于雅达利模拟器都崩溃了。”**屏幕开始出现小故障，随机闪烁彩色斑点。当然，寻求惊讶的自主体会很高兴。
    ^([^(437)](#fn437))


    取消游戏分数，创建**只有**内在动机的自主体，某种程度上可能看起来像一个奇怪的实验：强化学习领域一开始是围绕外在奖励最大化展开的。为什么要放弃用分数衡量行为？


    密歇根大学的萨廷德·辛格和心理学家理查德·刘易斯与安德鲁·巴图合作，从哲学角度探讨了这个问题。他们问：“奖励来自哪里？” ^([^(438)](#fn438))


    只用屏幕上的像素玩雅达利游戏，做任何你想做的事情——而不是循着一些固定的奖励信号——其实视频游戏就是这样玩的。


    《传送门》是2000年代最受欢迎的电脑游戏之一，游戏中的AI反复承诺玩家完成游戏会有“蛋糕”。然而，在游戏进行到一半时，玩家发现了不祥的涂鸦，其中有句话写着：“蛋糕是谎言。”事实上，游戏结束时没有蛋糕。当然，这个著名的出尔反尔之所以能被接受，不仅仅是因为它充其量只能给出虚拟蛋糕，更是因为我们玩游戏就是为了取得进展、推进剧情和探索游戏世界，并没有其他奢望。


    我们不会将屏幕上闪烁的数字作为我们在游戏中获得的“真正”奖励。闪烁绚丽的色彩，以及它们在我们身上激起的任何反应，都是奖励。就我们在游戏上花的时间来说，这似乎已经足够了。


    **厌倦和上瘾**


    强化学习的内在动机驱使人类渴望求知和探索。然而，内在动机不仅会引导良性行为，也会导致这些行为的病态镜像：厌倦和上瘾。


    我问迪帕克·帕塔克，厌倦的概念是否有意义。自主体会感到厌倦吗？


    当然，他说。


    在《超级马里奥》的第一关有一条沟，自主体几乎不可能知道如何跨越，因为这要求自主体连续15帧按住跳按钮。长序列的精准动作比短动作难学得多。 ^([^(439)](#fn439))


    “所以它没法过去，”帕塔克说，“就像死胡同，世界的尽头。”但是游戏的设计是不能往回走。自主体进退两难，学会了什么也不做。


    帕塔克观察到，还有一种更普遍的厌倦。在他的自主体玩《超级马里奥》很多回后，“它干脆直接停留在起点……因为任何地方都没有收益——游戏里的一切都不再让它好奇——所以它学会了哪里都不去”。自主体只在游戏起点处闲逛，没有动机做任何事情。


    这甚至有点让人伤感。人类厌倦了会停止游戏，而且通常可以停止。我们可以换新游戏，或者干脆关掉显示器，去玩其他的。而自主体则被残忍地**困在**一个它不再有任何动力去玩的游戏里。


    自从有了电子游戏，就有了专门的领域来研究是什么让游戏有趣，是什么让一个游戏比另一个更有趣。这显然既是出于心理学动机，也有经济动机。 ^([^(440)](#fn440))


    我突然想到，强化学习为我们提供了一个实用的基准，不仅可以衡量一个游戏有多**难**——玩家需要多长时间才能熟练——还可以衡量它有多**有趣**：玩家在失去兴趣和放弃之前会玩多久，或者他是否会选择花时间玩这个游戏而不是另一个游戏。今后很有可能会用内在动机驱动的强化学习自主体来对电子游戏的吸引力打分评级。


    认知科学家侯世达（Douglas Hofstadter）1979年出版的《哥德尔、埃舍尔、巴赫》获得了普利策奖，在书中他构想了高级游戏程序的未来，指出了游戏能力、动机和智力的关联：


    问：会有比任何人都强的象棋程序吗？


    猜测：不会。可能会有程序能在国际象棋上击败任何人，但它们不会只是国际象棋程序。它们将是通用智能，它们将和人一样喜怒无常。“你想下棋吗？”“不，我厌倦了下棋。让我们谈谈诗歌。”


    这句话在现在看来已经过时了——当然这是后见之明，我们已经知道，不到20年后的1997年，IBM的深蓝国际象棋机器战胜了人类世界冠军卡斯帕罗夫（Garry Kasparov）。深蓝是纯粹的象棋程序，它是在硬件层面定制的，只会下棋。它肯定不是通用智能，它只思考象棋，对文学不感兴趣。


    但这句话也许揭示了某种本质的真实内核。虽然深蓝不是通用的，但现在最先进的强化学习系统实际上是通用的，至少在棋类游戏和视频游戏上通用。DQN能玩几十种雅达利游戏，AlphaZero则擅长下各种棋。


    而且，那种能够学会流畅应对现实世界的通用人工智能（AGI）可能的确需要内在动机架构，这种架构可能会让它对自己玩得太多的游戏感到“厌倦”。


    与厌倦相对的另一面是**上瘾**——不是脱离，而是其黑暗的反面，病态的重复或坚持。在这方面，强化学习在某些情况下也表现出不可思议的、令人不舒服的人类行为。


    内在动机研究中有所谓的“嘈杂电视”问题。如果环境中存在本质上取之不尽、用之不竭的随机性或新奇性来源呢？受内在动机驱动的自主体会无力抗拒它吗？


    例如，如果屏幕上有不可预测的视觉噪声：电视雪花噪声就是典型例子，再比如噼啪跳跃的火焰、沙沙作响的树叶或紊乱的水流。如果是这样，每一帧新的和不可预测的光影状态都将是好奇心奖励。至少在**理论**上，看到这些的自主体应该会立即变得惊讶不已。


    然而，20世纪七八十年代的大多数简单的雅达利游戏中并没有这种视觉随机性来源，因此也没有被实际检验过。帕塔克、布尔达和爱德华兹决定将这个思想实验付诸实践。他们设计了一个简单的3D迷宫游戏，让自主体探索迷宫并找到出口。在游戏的一个版本中，迷宫的墙上有一个电视屏幕，自主体可以按按钮切换电视频道。会发生什么？


    结果是，自主体一旦看见电视屏幕，它对迷宫的探索就戛然而止。自主体将屏幕置于其视野中心，开始换频道。一会儿是飞机飞行的视频，一会儿是可爱的小狗，一会儿是一个人坐在电脑前，一会儿是汽车行驶在市中心。自主体不断换频道，充满新奇和惊讶，一动不动。


    视觉信息并不是唯一的能产生这种行为的随机因素，像掷硬币这样简单的事情也可以。近10年前，DeepMind研究员洛朗·奥索（Laurent Orseau）就已经意识到了这一点，他是DeepMind安全团队的第一个成员，现在是DeepMind基础研究小组的一员。早在有内在动机（可以瞬间变成电视迷）的雅达利游戏自主体出现之前，奥索就在思考一个更强大的，会被一枚硬币迷住的自主体。


    奥索思考的是一个假想的自主体，他称之为“知识寻求自主体”，这个自主体的目标是收集尽可能多的关于未知世界的信息。 ^([^(441)](#fn441))


    斯金纳除了训练鸽子，还着迷于研究赌博上瘾。平均来说，赌场总是会赢，而根据桑代克的心理学，应该是有收益时，你会做得更多，亏损时，你会做得更少。从这个角度来看，赌博成瘾是不可能的。然而在现实世界中它偏偏存在，挑战行为主义者的理论。“赌徒似乎违反了效果律，”斯金纳写道，“虽然净收益为负，他们还是继续赌。因此有人认为，沉迷赌博一定还有其他原因。”
    ^([^(442)](#fn442))


    赌博成瘾可能是**内在**奖励压制了外在奖励（毕竟，赌场总是会赢）。随机事件总是**多少有点**令人惊讶，虽然它们的概率已被理解得很透彻（例如一枚公平的硬币）。


    第4章曾讨论多巴胺编码时序预测误差的作用：发现收益好于或不如预期。然而，有一些奇怪的情形不符合这种模式。20世纪发现了越来越多的证据表明，**新奇**和令人**惊讶**的事情会触发多巴胺的释放，无论是否存在与之相关的“收益”。
    ^([^(443)](#fn443))


    在强化学习界发现新奇和惊讶的奖励价值的同时，神经科学界也在人类大脑中发现了这种机制。


    与此同时，关于这些通常对我们有益的机制为何会出错，原因也越来越清晰。强化学习自主体可能会沉迷于更换频道和玩老虎机，我们也同样如此。因为这些行为的结果从来都不符合我们的预期，所以总有一些令人惊讶之处，似乎总是需要“学习”。并不是说成瘾就一定是**学习动机**的过度，**好奇心**的过剩，但沿着这个思路深入，很有可能解释它实际上是如何起作用的。


    **出于自身**


    内在动机的计算研究为困难环境下的学习提供了强大的工具包，《蒙特祖玛的复仇》就是典型例子。在更深层次上，关于为什么**我们**自己会有如此惊人的动机的问题，计算研究的成功经验也为我们带来了启发。


    通过更好地理解我们自己的动机和驱动力，反过来又有机会让两方面的见解互惠互补，进一步将AI构建得像我们自己的智能一样，灵活、富有弹性和多才多艺。


    虽然深度学习很成功，但迪帕克·帕塔克意识到，它有一个明显的弱点：每个系统——无论是机器翻译、物品识别，甚至是游戏——都是专门构建的。众所周知，深度学习首次真正展示出潜力，就是用手工标记的图像库训练了一个庞大的神经网络，以对图像分类为目的，明确地对系统进行修正。他说，这没错。“但问题是，这些AI系统实际上并不智能。因为它们缺乏对人类至关重要的部分，就是通用的目的性行为，或者说通用目的的学习系统。”
    ^([^(444)](#fn444))


    他认为，要构建通用系统，就需要打破这种针对特定任务的思维定式，还需要打破一个关键的、引人注目的技巧：这些模型需要大量明确的奖励信息。像AlexNet这样的图像识别系统可能需要数十万幅图像，每幅图像都由人类标注。很显然，我们在刚出生时获得视觉技能**不是**用这种方式。同样，对于强化学习来说，在雅达利游戏的世界里，每一帧画面都清清楚楚地告诉你你做得怎么样。“它做得很好，但它还需要一些东西，同样，非常非常奇怪，”他说，“仍然是奖励。”


    去掉明确的外在奖励可能是构建真正通用AI的必要环节：因为生活不像雅达利游戏，它绝对不会实时反馈我们每一个行为的对错。当然，父母和老师会纠正我们的拼写和发音，偶尔也会纠正我们的行为。但这仅仅涵盖了我们所做、所说、所想的一小部分，而且生活中的权威并不总是能达成共识。并且，我们必须学会建立自己的认知，自己做出判断，这是人类发展的核心过程之一。


    贝勒马尔说：“对我来说，要把好的探索做到极致，一直都是完全取消奖励。这超出了我通常的舒适区，但是你知道，我认为我们能对AI自主体做的最有趣的事情就是让它们有出于自身的目标，如果你愿意的话。当然，这样做存在安全问题，”他承认，“但正如你说的，我希望我的AI自主体玩《蒙特祖玛的复仇》，只是因为它喜欢玩。”
    ^([^(445)](#fn445))


    贝勒马尔说：“我们之前谈论了ALE（街机学习环境），以及它是如何成为一个很好的基准。从某种意义上说，我们差不多完成了对ALE的研究，也基本不再研究分数最大化。”他认为，借助ε-贪婪算法将按钮敲烂来得分，再用分数进行强化，很难称得上是智能，尽管结果可能令人印象深刻。“实际上我认为，应该根据行为而不是奖励函数来衡量智能。”有智能的行为应该是什么样子？这是他关注的核心问题之一。'
  fmt: '

    # 内在动机、惊讶与强化学习


    ## 婴儿的预测与惊讶


    四五岁的孩子往往对如何平衡积木缺乏具体的理论，当有新玩具时，他们几乎总是去玩新的。无论这些积木是什么特性，似乎更年幼的孩子知道的还不够多，或者没有足够强的信念或预测，不足以让他们感到惊讶。


    循着这一思路的其他研究——例如，约翰·霍普金斯大学的艾米·斯塔尔（Aimee Stahl）和丽莎·费根森（Lisa Feigenson）在2015年进行的一项研究——进一步表明，婴儿玩玩具的**方式**也与玩具令人惊讶的**方式**有关。^([^(423)](#fn423))


    “很容易认为婴儿是一块白板，”费根森说，“但实际上，婴儿对世界有丰富而复杂的预期——可能比人们认为的要多。”她认为，婴儿“根据他们对世界的理解来激励或推动下一步的学习，来决定他们该学习什么”。^([^(424)](#fn424))


    ## 计算视角下的自主体


    从计算的角度看，这就是不仅受奖励激励，还试图理解和预测环境的自主体。这种想法和强化学习本身一样古老，但是刚刚才突然开花结果。


    丹尼尔·伯莱因在20世纪50年代见证了一些最早的机器学习实验，并思考了使用惊讶或预测错误作为强化手段的问题。“进一步的研究很可能是设计一种根据经验改进技术的解题机器，”他写道，“肯定是用不匹配或冲突的减少作为强化因子，按照先后顺序改进前面的操作。”^([^(425)](#fn425))


    德国的AI研究者于尔根·施密德胡伯（Jürgen Schmidhuber）自1990年以来一直在探索这样一种想法，让自主体通过学习周边环境是如何运作的——也就是提高预测能力——来获得奖励。“它们可以被视为简单的人工科学家或艺术家，”他解释道，“它们有一种内在愿望，想对世界以及它们能做什么建立更好的模型。”^([^(426)](#fn426))


    在施密德胡伯看来，我们穿行于世界努力更好地压缩我们对世界的表示，这个想法提供了一个“创造力和乐趣的正式理论”。他解释道：“你需要计算资源。在学习一个模式之前，你需要很多计算资源，学习之后，你需要的计算资源减少了。减少的就是你节约的。你懒惰的大脑喜欢节约。而且，”他打了一个响指，“这就是乐趣！”^([^(427)](#fn427))


    同伯莱因一样，让施密德胡伯着迷的，不是人们为了解决面临的问题而做的事情，例如如何赢得比赛或逃出迷宫，而是人们在**没有**明确的事情可做的时候做的事情。


    他认为，婴儿就是这方面的完美例子。“即使没有及时满足口渴或其他天生的原始需求，婴儿也不会无所事事，而是积极探索：如果我这样动眼睛、手指或舌头，会得到怎样的感官反馈？”^([^(428)](#fn428))


    施密德胡伯指出，好奇心的内核存在一种基本的**张力**，可以说是一场拔河：当我们探索某个环境和我们在其中可选的行为时——无论是雅达利游戏中的微小世界、户外的真实自然，还是微妙的人类社会——我们会喜欢让我们惊讶的事情，同时我们也会变得越来越难以惊讶。就好像大脑中有两个不同的学习系统相互较劲。一个尽力不感到惊讶。另一个尽力让它惊讶。^([^(429)](#fn429))


    ## 预测错误作为奖励


    能不能尝试直接模拟这种张力关系呢？2017年，加州大学伯克利分校的博士生迪帕克·帕塔克（Deepak Pathak）领导一个团队尝试构建这样的自主体。帕塔克构建的自主体包含两个模块，一个用来预测行为的结果，当现实与其预测匹配时给予奖励，另一个用来执行最大化惊讶的行为，当预测**错误**时给予奖励。^([^(430)](#fn430))


    例如，在《超级马里奥》中，如果按下跳键，你会预期在屏幕上看到马里奥跳起来一点，但前提是你已经尝试过几次。如果按向下的方向键，你会预期看到马里奥下蹲，但是你可能**没**想到这会让马里奥消失在管道中，进入一个地下世界！核心的想法是激励自主体探索游戏，让这种惊讶对自主体来说和对我们一样令人愉快，也就是说，把这些预测错误转化为**奖励**。只要结果令人惊讶就可以认为做对了，行为也会得到强化，就像能明确得分的行为一样。


    帕塔克团队研究了这种惊讶奖励可能产生的行为。他们将自主体放置在各种3D迷宫中（用90年代经典的玩家视角射击游戏《毁灭战士》的引擎构建），离“目标”位置很远。对于只有发现目标才有奖励的自主体，如果随机摇动操纵杆和敲击按钮后找不到目标，它们会倾向于直接“放弃”。用惊讶奖励训练的自主体则有探索迷宫的动力：角落里有什么？那个远处的房屋走近看是什么样子？因此，与没有内在驱动力的自主体相比，具有好奇心的自主体更能在复杂宏大的迷宫中找到通往目标的路。


    帕塔克的伯克利团队与OpenAI合作，一起继续探索将预测错误作为奖励信号的想法。令人惊讶的是，他们发现这种方案的一种显著简化——用预测屏幕上图像随机特征的网络代替专为预测未来可控方面而设计的网络——同样有效，在某些情况下甚至更好。^([^(431)](#fn431))


    他们将`RND`自主体放到神庙中。在惊讶的内在奖励激励下，自主体大概能探索20到22个场景。其中有一次自主体取得了前所未有的成绩，他通关了全部24个场景，一直抵达神庙左下角，然后逃离了神庙。^([^(432)](#fn432))


    ## 超越奖励


    因此，越来越明显的是，“内在动机”——新奇、惊讶等相关范式——是系统能拥有的一种很棒的驱动力，能作为来自环境的外在奖励的补充，尤其是在外在奖励稀疏或难以获得的情况下。


    当然，从这个角度来看，一个自然而然的问题是，如果我们将这种算法好奇的想法发展到极致，让强化学习自主体**完全**不在乎外在奖励，会怎么样？


    这样的自主体会是什么样子？它会做什么？


    几乎所有研究内在动机的人都对此感兴趣，谜底也在逐渐揭晓。


    马克·贝勒马尔和DeepMind的同事一直在致力于将基于计数的新奇奖励扩展到更复杂的领域，在后续研究中，他们尝试“突破内在动机的极限”。^([^(433)](#fn433))


    不出所料，自主体的行为表现得很不安分。追求分数的自主体通常会形成相当稳定和一致的最佳实践，而对于“最大化好奇”的自主体来说，唯一的收益来自探索行为，而这种收益并不稳定，随着所在的区域变得越来越熟悉，收益会消失。^([^(434)](#fn434))


    出乎意料的是这些自主体无需分数就能在游戏中表现得很好。新奇奖励极度膨胀的自主体在4个游戏中获得了**最高**分。好奇心培养能力。令人惊讶的是，仅凭新奇奖励，无需游戏分数，就足以玩好许多雅达利游戏——以它们无法获知的分数衡量！


    当然，游戏（或者说好游戏）在设计时就是为了吸引具有内在动机的人。毕竟，分数只是屏幕角落里不重要的像素，人类玩家可以决定要不要在意。因此，从这个角度来说，好奇心和探索的驱动力本身就能很好地替代得分最大化，至少在大多数游戏中是这样。例如，在《超级马里奥》中，吃金币、破砖块和踩敌人都会得分——但游戏的重点是让马里奥向右前进，那里有没有见过的风景。从这个意义上说，具有内在动机的自主体可能比以（其实没有意义的）得分为目标的自主体更符合游戏的预期模式。


    伯克利的帕塔克小组和OpenAI的布尔达和爱德华兹小组还在继续合作，研究大规模、系统性的、没有任何外在奖励的机器学习。^([^(435)](#fn435))


    他们最惊人的一个发现是，在大多数情况下，没有必要明确告诉自主体它是否已经死亡。如果你试图最大化外在分数，死亡的信息的确非常有用，因为这既是你的最终评分，也是一个标志，表明那样做你只能得0分（从而有助于避免重蹈覆辙）。但对于纯粹由好奇心驱使的自主体来说，死亡仅仅意味着从头开始——这很无聊！游戏的开头是最熟悉的部分，既不新奇也不令人惊讶。结果证明，只需要用无聊作为自主体的抑制因素就够了。^([^(436)](#fn436))


    虽然具有内在动机的自主体被证明很擅长得分，但他们也发现了一个有趣的例外——《乒乓》游戏。一个只受内在动机激励的自主体，对得分毫不关心，玩游戏不是为了得分打败对手，而是为了故意延长反弹时间。得分后的“重置”本质上与其他游戏中死亡后的“重启”相同。与长时间反弹中出现的各种特异状态相比，回到老掉牙的初始位置简直令人厌烦。


    他们想知道，如果这样一个自主体与**自己**的副本对抗，会发生什么。在零和游戏中，好奇心和好奇心会如何对抗？答案是：出现了非零和的合作，因为双方追求的目标是一致的，即远离游戏中常见的初始状态。换句话说：它们达成一致，永不停止。“事实上，”研究人员写道，**“一局球变得如此之长，以至于雅达利模拟器都崩溃了。”**屏幕开始出现小故障，随机闪烁彩色斑点。当然，寻求惊讶的自主体会很高兴。^([^(437)](#fn437))


    取消游戏分数，创建**只有**内在动机的自主体，某种程度上可能看起来像一个奇怪的实验：强化学习领域一开始是围绕外在奖励最大化展开的。为什么要放弃用分数衡量行为？


    密歇根大学的萨廷德·辛格和心理学家理查德·刘易斯与安德鲁·巴图合作，从哲学角度探讨了这个问题。他们问：“奖励来自哪里？”^([^(438)](#fn438))


    只用屏幕上的像素玩雅达利游戏，做任何你想做的事情——而不是循着一些固定的奖励信号——其实视频游戏就是这样玩的。


    《传送门》是2000年代最受欢迎的电脑游戏之一，游戏中的AI反复承诺玩家完成游戏会有“蛋糕”。然而，在游戏进行到一半时，玩家发现了不祥的涂鸦，其中有句话写着：“蛋糕是谎言。”事实上，游戏结束时没有蛋糕。当然，这个著名的出尔反尔之所以能被接受，不仅仅是因为它充其量只能给出虚拟蛋糕，更是因为我们玩游戏就是为了取得进展、推进剧情和探索游戏世界，并没有其他奢望。


    我们不会将屏幕上闪烁的数字作为我们在游戏中获得的“真正”奖励。闪烁绚丽的色彩，以及它们在我们身上激起的任何反应，都是奖励。就我们在游戏上花的时间来说，这似乎已经足够了。


    ## 厌倦和上瘾


    强化学习的内在动机驱使人类渴望求知和探索。然而，内在动机不仅会引导良性行为，也会导致这些行为的病态镜像：厌倦和上瘾。


    我问迪帕克·帕塔克，厌倦的概念是否有意义。自主体会感到厌倦吗？


    当然，他说。


    在《超级马里奥》的第一关有一条沟，自主体几乎不可能知道如何跨越，因为这要求自主体连续15帧按住跳按钮。长序列的精准动作比短动作难学得多。^([^(439)](#fn439))


    “所以它没法过去，”帕塔克说，“就像死胡同，世界的尽头。”但是游戏的设计是不能往回走。自主体进退两难，学会了什么也不做。


    帕塔克观察到，还有一种更普遍的厌倦。在他的自主体玩《超级马里奥》很多回后，“它干脆直接停留在起点……因为任何地方都没有收益——游戏里的一切都不再让它好奇——所以它学会了哪里都不去”。自主体只在游戏起点处闲逛，没有动机做任何事情。


    这甚至有点让人伤感。人类厌倦了会停止游戏，而且通常可以停止。我们可以换新游戏，或者干脆关掉显示器，去玩其他的。而自主体则被残忍地困在一个它不再有任何动力去玩的游戏里。


    自从有了电子游戏，就有了专门的领域来研究是什么让游戏有趣，是什么让一个游戏比另一个更有趣。这显然既是出于心理学动机，也有经济动机。^([^(440)](#fn440))


    我突然想到，强化学习为我们提供了一个实用的基准，不仅可以衡量一个游戏有多难——玩家需要多长时间才能熟练——还可以衡量它有多有趣：玩家在失去兴趣和放弃之前会玩多久，或者他是否会选择花时间玩这个游戏而不是另一个游戏。今后很有可能会用内在动机驱动的强化学习自主体来对电子游戏的吸引力打分评级。


    认知科学家侯世达（Douglas Hofstadter）1979年出版的《哥德尔、埃舍尔、巴赫》获得了普利策奖，在书中他构想了高级游戏程序的未来，指出了游戏能力、动机和智力的关联：


    问：会有比任何人都强的象棋程序吗？


    猜测：不会。可能会有程序能在国际象棋上击败任何人，但它们不会只是国际象棋程序。它们将是通用智能，它们将和人一样喜怒无常。“你想下棋吗？”“不，我厌倦了下棋。让我们谈谈诗歌。”


    这句话在现在看来已经过时了——当然这是后见之明，我们已经知道，不到20年后的1997年，IBM的深蓝国际象棋机器战胜了人类世界冠军卡斯帕罗夫（Garry Kasparov）。深蓝是纯粹的象棋程序，它是在硬件层面定制的，只会下棋。它肯定不是通用智能，它只思考象棋，对文学不感兴趣。


    但这句话也许揭示了某种本质的真实内核。虽然深蓝不是通用的，但现在最先进的强化学习系统实际上是通用的，至少在棋类游戏和视频游戏上通用。`DQN`能玩几十种雅达利游戏，`AlphaZero`则擅长下各种棋。


    而且，那种能够学会流畅应对现实世界的通用人工智能（AGI）可能的确需要内在动机架构，这种架构可能会让它对自己玩得太多的游戏感到“厌倦”。


    与厌倦相对的另一面是**上瘾**——不是脱离，而是其黑暗的反面，病态的重复或坚持。在这方面，强化学习在某些情况下也表现出不可思议的、令人不舒服的人类行为。


    内在动机研究中有所谓的“嘈杂电视”问题。如果环境中存在本质上取之不尽、用之不竭的随机性或新奇性来源呢？受内在动机驱动的自主体会无力抗拒它吗？


    例如，如果屏幕上有不可预测的视觉噪声：电视雪花噪声就是典型例子，再比如噼啪跳跃的火焰、沙沙作响的树叶或紊乱的水流。如果是这样，每一帧新的和不可预测的光影状态都将是好奇心奖励。至少在理论上，看到这些的自主体应该会立即变得惊讶不已。


    然而，20世纪七八十年代的大多数简单的雅达利游戏中并没有这种视觉随机性来源，因此也没有被实际检验过。帕塔克、布尔达和爱德华兹决定将这个思想实验付诸实践。他们设计了一个简单的3D迷宫游戏，让自主体探索迷宫并找到出口。在游戏的一个版本中，迷宫的墙上有一个电视屏幕，自主体可以按按钮切换电视频道。会发生什么？


    结果是，自主体一旦看见电视屏幕，它对迷宫的探索就戛然而止。自主体将屏幕置于其视野中心，开始换频道。一会儿是飞机飞行的视频，一会儿是可爱的小狗，一会儿是一个人坐在电脑前，一会儿是汽车行驶在市中心。自主体不断换频道，充满新奇和惊讶，一动不动。


    视觉信息并不是唯一的能产生这种行为的随机因素，像掷硬币这样简单的事情也可以。近10年前，DeepMind研究员洛朗·奥索（Laurent Orseau）就已经意识到了这一点，他是DeepMind安全团队的第一个成员，现在是DeepMind基础研究小组的一员。早在有内在动机（可以瞬间变成电视迷）的雅达利游戏自主体出现之前，奥索就在思考一个更强大的，会被一枚硬币迷住的自主体。


    奥索思考的是一个假想的自主体，他称之为“知识寻求自主体”，这个自主体的目标是收集尽可能多的关于未知世界的信息。^([^(441)](#fn441))


    斯金纳除了训练鸽子，还着迷于研究赌博上瘾。平均来说，赌场总是会赢，而根据桑代克的心理学，应该是有收益时，你会做得更多，亏损时，你会做得更少。从这个角度来看，赌博成瘾是不可能的。然而在现实世界中它偏偏存在，挑战行为主义者的理论。“赌徒似乎违反了效果律，”斯金纳写道，“虽然净收益为负，他们还是继续赌。因此有人认为，沉迷赌博一定还有其他原因。”^([^(442)](#fn442))


    赌博成瘾可能是**内在**奖励压制了外在奖励（毕竟，赌场总是会赢）。随机事件总是多少有点令人惊讶，虽然它们的概率已被理解得很透彻（例如一枚公平的硬币）。


    第4章曾讨论多巴胺编码时序预测误差的作用：发现收益好于或不如预期。然而，有一些奇怪的情形不符合这种模式。20世纪发现了越来越多的证据表明，新奇和令人惊讶的事情会触发多巴胺的释放，无论是否存在与之相关的“收益”。^([^(443)](#fn443))


    在强化学习界发现新奇和惊讶的奖励价值的同时，神经科学界也在人类大脑中发现了这种机制。


    与此同时，关于这些通常对我们有益的机制为何会出错，原因也越来越清晰。强化学习自主体可能会沉迷于更换频道和玩老虎机，我们也同样如此。因为这些行为的结果从来都不符合我们的预期，所以总有一些令人惊讶之处，似乎总是需要“学习”。并不是说成瘾就一定是学习动机的过度，好奇心的过剩，但沿着这个思路深入，很有可能解释它实际上是如何起作用的。


    ## 出于自身


    内在动机的计算研究为困难环境下的学习提供了强大的工具包，《蒙特祖玛的复仇》就是典型例子。在更深层次上，关于为什么我们自己会有如此惊人的动机的问题，计算研究的成功经验也为我们带来了启发。


    通过更好地理解我们自己的动机和驱动力，反过来又有机会让两方面的见解互惠互补，进一步将AI构建得像我们自己的智能一样，灵活、富有弹性和多才多艺。


    虽然深度学习很成功，但迪帕克·帕塔克意识到，它有一个明显的弱点：每个系统——无论是机器翻译、物品识别，甚至是游戏——都是专门构建的。众所周知，深度学习首次真正展示出潜力，就是用手工标记的图像库训练了一个庞大的神经网络，以对图像分类为目的，明确地对系统进行修正。他说，这没错。“但问题是，这些AI系统实际上并不智能。因为它们缺乏对人类至关重要的部分，就是通用的目的性行为，或者说通用目的的学习系统。”^([^(444)](#fn444))


    他认为，要构建通用系统，就需要打破这种针对特定任务的思维定式，还需要打破一个关键的、引人注目的技巧：这些模型需要大量明确的奖励信息。像`AlexNet`这样的图像识别系统可能需要数十万幅图像，每幅图像都由人类标注。很显然，我们在刚出生时获得视觉技能不是用这种方式。同样，对于强化学习来说，在雅达利游戏的世界里，每一帧画面都清清楚楚地告诉你你做得怎么样。“它做得很好，但它还需要一些东西，同样，非常非常奇怪，”他说，“仍然是奖励。”


    去掉明确的外在奖励可能是构建真正通用AI的必要环节：因为生活不像雅达利游戏，它绝对不会实时反馈我们每一个行为的对错。当然，父母和老师会纠正我们的拼写和发音，偶尔也会纠正我们的行为。但这仅仅涵盖了我们所做、所说、所想的一小部分，而且生活中的权威并不总是能达成共识。并且，我们必须学会建立自己的认知，自己做出判断，这是人类发展的核心过程之一。


    贝勒马尔说：“对我来说，要把好的探索做到极致，一直都是完全取消奖励。这超出了我通常的舒适区，但是你知道，我认为我们能对AI自主体做的最有趣的事情就是让它们有出于自身的目标，如果你愿意的话。当然，这样做存在安全问题，”他承认，“但正如你说的，我希望我的AI自主体玩《蒙特祖玛的复仇》，只是因为它喜欢玩。”^([^(445)](#fn445))


    贝勒马尔说：“我们之前谈论了`ALE`（街机学习环境），以及它是如何成为一个很好的基准。从某种意义上说，我们差不多完成了对`ALE`的研究，也基本不再研究分数最大化。”他认为，借助`ε-贪婪`算法将按钮敲烂来得分，再用分数进行强化，很难称得上是智能，尽管结果可能令人印象深刻。“实际上我认为，应该根据行为而不是奖励函数来衡量智能。”有智能的行为应该是什么样子？这是他关注的核心问题之一。

