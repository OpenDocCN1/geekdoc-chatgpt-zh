- raw: '一个职业词汇的向量越偏向某个性别方向，该性别在这个职业中的占比就越多。他们写道：“词嵌入与美国50个职业的女性占比强相关。” ^([^(101)](#fn101))


    从“魔术般的”优化过程产生的嵌入作为社会的一面镜子是如此不可思议和令人不安，也意味着社会科学的武器库增加了一个诊断工具。我们可以利用嵌入在某个时间点的快照，精确量化一些社会特征。无论因果关系是怎样的——无论是客观现实的变化改变了我们说话的方式，还是相反，或者两者都是由更深层次的原因驱动——我们都可以用这些快照来**观察社会的变化**。


    这正是尼克尔·加尔格（Nikhil Garg）和詹姆斯·邹（James Zou）领导的斯坦福跨学科团队打算做的事情。电气工程博士生加尔格和生物医学数据科学助理教授詹姆斯·邹与历史学家隆达·希宾格（Londa Schiebinger）和语言学家丹·朱拉夫斯基（Dan Jurafsky）合作，不仅使用**当代**文本语料库，还使用过去100年的样本来研究词嵌入。
    ^([^(102)](#fn102))


    由此得出的是一部丰富详细的文化变迁史。正如他们所说：“嵌入的时间动态有助于量化20和21世纪美国对女性和少数族群的刻板印象和态度的变化。”


    斯坦福团队证实了普林斯顿团队关于职业词汇表示与性别的关联的研究结果，并补充道，似乎有某种“男性基线”，即我们从人口普查数据中知道的男女各占一半的职业，在词嵌入上略微偏向“男性”方向。作者解释，“基于外部的、客观的衡量标准，日常语言比人们预期的更有偏见”。然而，除了基线之外，职业词汇的嵌入中存在的性别偏见随时间的变化趋势与劳动力本身的变化趋势一致。


    通过分析不同时期的文本，他们发现了大量反映社会变迁的语言表述。数据显示，随着时间推移，性别偏见已普遍减少，特别是“20世纪六七十年代的妇女运动对文学和文化中的妇女形象产生了系统和剧烈的影响”。


    嵌入还展示了种族态度转变的详细历史。例如，在1910年，与白人相比，与亚洲人联系最紧密的前10个词包括“野蛮”“可怕”“可恨”和“怪异”。到了1980年，这个故事已截然不同，前10个词以“拘谨”和“被动”开头，以“敏感”和“热情”结尾：当然，仍然是刻板印象，但它反映了明显的文化变迁。


    在嵌入中也可以看到更近的文化变迁——例如，在1993年（世贸中心爆炸那一年）和2001年（“9.11”那一年），与伊斯兰教有关的词汇和与恐怖主义有关的词汇的关联骤增。


    不难想象，用这个方法不仅可以回顾过去，还能展望未来：比如说，根据过去6个月的数据，某种偏见是变好还是变糟了？甚至可以想象用某种实时仪表板来展示社会本身——或者至少是公共话语——的偏见是在增加还是减少，作为正在发生的转变的风向标，以及对未来世界的一瞥。


    **代表和显现**


    有几个结论，第一个主要是方法论，虽然不是纯粹的方法论。随着计算机科学家开始更深入地思考他们构建的模型中包含了什么，他们接触到了社会科学。同样，社会科学家也在接触机器学习，并获得了一个强大的新显微镜。正如斯坦福团队写道：“在标准的定量社会科学中，机器学习成为了分析数据的工具。我们的工作展示了机器学习的人工产物（这里是词嵌入）本身如何成为社会科学分析的有趣对象。我们相信，这种范式转变可以带来许多富有成效的研究。”


    第二，偏见和言外之意虽然看似虚无缥缈，不可言喻，但的确是真实存在的。它们可以细致精确地测量。它们自发地、可靠地从原本是用于猜测缺失词的模型中显现，可测量，可量化，有动态变化。它们呈现了关于职业的真实数据，以及对主观态度和刻板印象的度量。所有这些，以及更多的信息，都存在于本来只是用于猜测上下文中缺失词汇的模型中：语言的故事就是文化的故事。


    第三，这些模型绝对应该谨慎使用，尤其是当用于猜测缺失词的初始目的之外的任何事情时。亚当·卡莱说：“我和读过我们论文的人谈过……（他们）会对使用这些词嵌入更加谨慎，至少在用于他们自己的应用程序之前会三思。所以，这是一个积极的结果。”普林斯顿团队也赞同这一警告。“当然，”他们写道，“在将无监督机器学习构建的模型纳入决策系统时，必须谨慎。”
    ^([^(103)](#fn103))


    我们发现自己正处于一个脆弱的历史时期。这些模型的力量和灵活性使它们不可避免地会被应用于大量商业和公共领域，然而关于应该如何适当使用它们，标准和规范仍处于萌芽状态。正是在这个时期，我们尤其应当谨慎和保守，因为这些模型一旦被部署到现实世界中，就不太可能再有实质性改变。就像普林斯顿大学的阿尔温德·纳拉亚南说的：“与‘科技发展太快，社会跟不上’的陈词滥调相反，科技的商业部署经常推进得很慢——看看银行和航空公司仍在服役的电脑就知道了。今天训练的机器学习模型可能在50年后仍在使用，这太可怕了。”
    ^([^(104)](#fn104))


    对世界建模是一回事。但是一旦你开始应用这个模型，你就或多或少在改变世界。许多机器学习模型都有一个普遍假设，即模型本身不会改变它所建模的现实。几乎在所有情况下，这都是错的。


    事实上，不谨慎地部署这些模型可能会形成正反馈，想要扭转局面会越来越困难，或者需要越来越多的干预。比方说，如果简历搜索系统检测到某个职位存在性别偏见，那么它可能会青睐（比如说）男性申请者，从而加剧这种偏见，而这个结果又可能会成为模型学习的下一批训练数据，那么它学到的偏见会越来越极端。要对此进行干预当然是**越早越好**。


    最后，这些模型为我们提供了展望未来社会的数字六分仪。通过这些模型，我们不仅看到了历史，也看到了最新的现状。只要每天有新的文本在网上发布，就会有新的数据需要采样。


    这些有可能延续和加剧社会偏见的系统，如果能明智地加以利用，让其只有描述性而无规定性，也可以让偏见显现而且证据确凿。它们将为我们提供一个衡量标准，衡量那些看起来虚无缥缈或无形的东西。
    ^([^(105)](#fn105))


    已离开谷歌的约纳坦·尊格认为，人们有时会无视工程与人类社会、人类规范和人类价值观的密不可分。他写道：“从本质上讲，工程就是合作、协同以及对同事和客户的共情。如果有人告诉你，工程是一个你可以不与人或感情打交道的领域，那么我非常抱歉地告诉你，你被骗了。”
    ^([^(106)](#fn106))


    杰基·阿尔西内现在经营着自己的软件咨询公司，仍然与尊格保持联系，他认同这个问题既不是始于技术，也不会止于技术。“这就是我想去教历史的部分原因，”他笑着告诉我，至少是半认真的，“等我35岁时，我会停止一切，退休，转向历史。”


    ## **2. 公平**


    尽管自冰川消退以来，可能在冰河时代之前，人类就一直在美洲大陆上活动，但对人类进化的认识仍然不尽人意，科学刚开始着手研究的一个问题是预测一个人在假释出狱后会做什么。


    ——芝加哥论坛报，1936年1月 ^([^(107)](#fn107))


    我们的法律惩罚的是人们的所作所为，而不是他们是谁。根据某种不可改变的特性来实施惩罚，这与这一指导原则背道而驰。


    ——最高法院首席法官约翰·罗伯茨 ^([^(108)](#fn108))


    我们正处于使用机器学习来辅助教育、就业、广告、医疗保健和警务等领域中涉及人类的各种重要决策的浪潮中，理解为什么机器学习在默认情况下不公平或不公正是很重要的。


    ——莫里兹·哈迪（Moritz Hardy） ^([^(109)](#fn109))


    用数字模型取代人类不可靠的判断，让社会变得更一致、更准确、更公平，这种想法并不新鲜。事实上，它们在刑事司法中的应用已有近一个世纪的历史。


    1927年，伊利诺伊州假释委员会的新主席辛顿·克拉博（Hinton Clabaugh）致力于推动一项关于该州假释制度运作的研究。因为他认为存在一种创新差距：“我们的工业和政府机器远非完美，但仍然可能是在工业上最有创造力和效率的国家，”克拉博写道，“对于我们的执法情况，能这样说吗？”
    ^([^(110)](#fn110))


    克拉博要求他所在的州最有声望的学校——伊利诺伊大学、西北大学和芝加哥大学——联合起来，撰写一份关于假释制度的全面报告，期限是1年。伊利诺伊大学法学院院长阿尔伯特·哈诺（Albert Harno）负责总结假释委员会的工作情况；西北大学的安德鲁·布鲁斯（Andrew Bruce）法官负责梳理伊利诺伊州刑罚体系的历史（包括对19世纪“废除鞭笞”的回顾）；芝加哥大学社会学家欧内斯特·伯吉斯（Ernest Burgess）则面临一个有趣的挑战，看是否有什么因素可以预测一个假释犯的“成功或失败”。


    伯吉斯写道：


    目前，伊利诺伊州人民对被假释的人有两种截然不同的看法。一种看法是冷酷、邪恶、绝望的罪犯，从监狱里出来，不思悔改，一心只想为他所受的惩罚报复社会。另一种看法是不成熟的青年，寡居母亲的独生子，一时冲动，在不坚定的时候，屈从于任性同伴的邪恶提议，现在从管教所回归社会，只需给个机会，就会洗心革面。
    ^([^(111)](#fn111))


    当然，问题是，是否有可能预测犯人如果被假释会是哪种情况。


    伯吉斯收集了伊利诺伊州大约3000名假释犯的数据，并将他们分为4组：“初犯”“偶犯”“惯犯”和“职业罪犯”。从21世纪的视角来看，他的一些说法似乎过时了：例如，他把人分为8种“社会类型”——“流浪汉”“游手好闲者”“底层居民”“酒鬼”“流氓”“新移民”“农场男孩”和“瘾君子”。尽管如此，伯吉斯的研究十分透彻，令人印象深刻，尤其是就当时的条件而言，收集了犯罪史、工作史、居住史、犯罪类型、刑期、服刑时间、精神病诊断等等。他研究了这些数据是否揭示了某些囚犯的判罚受到了不当的政治干预，并探讨了公众对司法系统的看法是否有道理。在最后一章，他探讨了一个问题，这个问题将引发一场刑事司法变革，这场变革将持续到21世纪：“科学方法能应用于假释管理吗？”


    他写道：“许多人怀疑将科学方法引入涉及人类行为的领域的可行性。他们认为没有可行性，因为人性太多变数，无法预测。但是通过分析决定假释成败的因素，确实发现了一些显著差异。”


    伯吉斯指出，在那些有良好工作记录、高智商和农业背景，服刑1年或不到1年的人中，违反假释规定的比例是该州平均水平的一半。另一方面，那些生活在“犯罪黑社会”，被检察官或法官反对宽大处理，而且已经服刑5年以上的人，违反假释规定的比例是全国平均水平的**2倍**。“这些与我们所认为的塑造人的生活条件相一致的显著差异，难道不表明应该更认真、更客观地加以考虑吗？”他问道。


    “为每个即将被假释的人设计一份总结表是完全可行的，对假释委员会应该会有帮助，”他说，“委员会成员能够了解每个重要因素的状况……这种预测在任何特定情况下都不是绝对的，但根据平均法则，它适用于相当多的情形。”


    他的结论是，在许多情形下，悔过自新是完全可能的。更重要的是，哪些情形下会成功，至少在一定程度上是可预测的。一个建立在这一统计基础之上的系统，难道不会比由法官临时做出主观的、不一致的和特殊的人类决定更好吗？“毫无疑问，找出决定假释犯成败的因素是可行的，”伯吉斯写道，“人类行为似乎存在一定程度的可预测性。这些记录的事实能作为囚犯获得假释的依据吗？还是依赖假释委员会成员对这个人的印象？”


    报告最终给出了明确的肯定结论。假释和“不定期刑”确实应该在伊利诺伊州继续推行，同样重要的是，“如果能将假释委员会的工作置于科学和专业的基础上，并进一步防范政治干预的持续压力，相关的管理可以而且应该得到改善”。


    这份报告完全改变了克拉博主席对他领导的系统的看法。他承认：“我原来认为，不定期刑和假释法对罪犯有利。相反的证据是压倒性的，我现在相信，如果管理得当，这些法律肯定对社会和个人都有好处。”总之，假释是一件好事，他写道：“即使管理方法有缺陷。当然，机器的高效取决于操作它的人。”
    ^([^(112)](#fn112))


    **实践中的科学假释**


    20世纪30年代初，在伯吉斯的推动和克拉博的支持下，预测性假释制度在伊利诺伊州开始实施。1951年，《假释预测手册》出版，总结了前20年的研究和实践。


    看法很乐观。伯吉斯在导论部分写道：“在过去20年，社会科学家详尽分析了囚犯假释的案例，对于在什么条件下假释会成功或失败取得了重大进展。从他们的研究中逐渐形成了一种信念，即尽管存在困难，仍然有可能在某种程度上预测囚犯在假释期的行为。”
    ^([^(113)](#fn113))


    《假释预测手册》指出了未来值得研究和可能改进的几个方向，例如可能有助于改进预测的其他因素，比如监狱工作人员的评估。书的最后一节特别有先见之明，题为“用机器评分”，考虑使用穿孔卡片机来自动化和简化收集数据、构建模型和输出具体预测的过程。


    尽管有这种乐观态度和伊利诺伊州的成功实践，假释预测工具的推广却慢得出奇。到1970年，只有2个州采用。但情况即将改变。


    1969年，出生于苏格兰的统计学家蒂姆·布伦南（Tim Brennan）在伦敦为联合利华工作，建立各种类型的统计模型。他是联合利华在市场细分方面的顶尖专家。例如，用模型将浴室肥皂的购买者分为魅力至上者和优先考虑皮肤温和者。他很擅长也很喜欢这项工作，但总感觉有些憋屈。“我产生了价值观危机。”布伦南告诉我。在公司的一份报告中，他注意到联合利华过去一年花在研究斯奎奇系列洗碗皂液包装上的钱比整个英国政府花在扫盲上的钱还多。
    ^([^(114)](#fn114))


    “那是在60年代末，”他说，“你知道当时嬉皮士很流行。我对为斯奎奇设计包装不再感兴趣。所以我辞职了，申请读研究生。”他去了兰卡斯特大学，将他的市场细分统计方法应用于教育问题：分辨在课堂上有不同学习风格和不同需求的学生。
    ^([^(115)](#fn115))


    女友去美国后，布伦南跟着去了科罗拉多大学，为德尔伯特·埃利奥特（Delbert Elliott，后来成为了美国犯罪学学会主席）工作，并最终创办了自己的研究公司，与国家惩教研究所和执法援助署合作。他发现了分类技术的第三个用途：为监狱提供更加一致和严格的方法，根据每个囚犯的风险和需要将他们安排到不同的囚室和床位。这既是为了他人的安全，也是为了他们自己的改过自新。以前通常都是随机或凭直觉安排，布伦南认为数学能提供更好的方法。


    布伦南访问了密歇根州的特拉弗斯城，因为听说那里有一些开创性的机器学习研究，使用所谓的“决策树”模型对囚犯分类，并确定该释放谁，以解决过度拥挤的问题。布伦南在那里遇到了“发明这个模型的年轻人……留着乱蓬蓬的头发和胡子”。这个年轻人名叫戴夫·威尔斯（Dave Wells）。“戴夫的目标是改革刑事司法系统，”布伦南说，“他对这项工作充满激情。”布伦南和威尔斯决定合作。
    ^([^(116)](#fn116))


    随着个人计算机时代的到来，在各个司法管辖区，统计模型在刑事司法系统的应用激增。1980年还只有4个州使用统计模型来帮助假释裁决。到1990年，已经有12个州，2000年有26个州。
    ^([^(117)](#fn117))


    这个当今时代最广泛使用的工具之一，就是布伦南和威尔斯在1998年开发的，他们称之为“替代性制裁的矫正罪犯管理概况分析”，缩写为COMPAS。 ^([^(118)](#fn118))


    但是，《纽约时报》社评认为，存在一个问题：政府没有**充分**利用它们。这些工具，即使在强制使用的情况下，也并不总是得到适当考虑。《纽约时报》2014年在报道中敦促在假释中更广泛地使用风险评估工具，“像COMPAS这样的工具已被证明是有效的”。
    ^([^(119)](#fn119))


    然后，风向突然变了。


    9个月后，2016年6月，该报发表了一篇文章，题为《在威斯康星州，有呼声反对根据数据预测被告的未来》，文章结尾引用了美国公民自由联盟刑法改革项目主任的话：“我想我们在奔向用大数据进行风险评估的明日世界时，有点过于急迫。”
    ^([^(120)](#fn120))


    2017年的报道看法更糟：5月，《被软件的秘密算法送进监狱》；6月，《当计算机程序让你留在监狱里》；10月，《当算法将你送进监狱》。


    发生了什么事？


    简而言之，是ProPublica。


    **获取数据**


    20世纪七八十年代，朱莉娅·安格温在硅谷长大，父母都是程序员，还和史蒂夫·乔布斯是邻居。她小时候的理想是当程序员。但是后来她又爱上了新闻业。2000年，她去了《华尔街日报》当科技记者。“这太滑稽了，”她回忆道，“他们说：‘你懂电脑吗？我们会请你来报道互联网。’我回应说：‘嗯，以互联网为主？’他们说：‘不，**全部！**’”
    ^([^(121)](#fn121))


    从互联网泡沫崩溃到社交网络和智能手机的兴起，安格温在这家报社待了14年，她不仅报道技术，还关注随之而来的社会问题；她写了关于隐私相关问题的长篇系列报道：《他们知道些什么》。2013年，她离开《华尔街日报》，写了一本关于隐私的书。
    ^([^(122)](#fn122))


    安格温写完书后没有再回到报社，而是加入了非营利新闻机构ProPublica，这家机构由前《华尔街日报》总编辑保罗·施泰格（Paul Steiger）创办。如果说她早期作品的主题是“他们知道些什么”，那么答案必然引出另一个问题：**他们会用它来做什么？**“所以我想，”她说，“我应当关注数据使用。这就是下一个故事。他们打算做什么？……他们会对你做出怎样的评判？”
    ^([^(123)](#fn123))


    安格温开始寻找基于数据做出的最重要并且被忽视的决定。她锁定了刑事审判。COMPAS等统计风险评估工具在数百个司法管辖区被采用：不仅用于假释，还用于审前拘留、保释，甚至判刑。“我很震惊，”她说，“全国各地都在使用这个软件。……然后我发现，更令人震惊的是，它们没有接受过独立评估。”


    例如，纽约州从2001年开始使用COMPAS，在使用了11年后，于2012年对该软件进行了首次正式评估。（纽约最终认定它“有效而且预测准确”。 ^([^(124)](#fn124))


    这样的情况非常普遍。包括明尼阿波利斯在内的明尼苏达州第四司法区处理该州40%的案件，该区在1992年开发了自己的审前风险评估工具。“当时的报告指出，这种新量表在使用几年后应该进行验证。结果是，差不多过了14年”，
    ^([^(125)](#fn125))


    2006年，这项已迟到很久的评估发现，模型中的4个变量——被告是否在明尼苏达州生活了3个月以上，他们是否独自生活，年龄，以及对他们的指控是否涉及武器——实际上与他们在等待开庭时犯下新罪行或逃跑的实际风险没有关联。然而，该模型一直建议基于这些理由决定审前拘留。更糟糕的是，这4个因素中有3个与种族有很大关联。该地区放弃了这个模型，重新构建。
    ^([^(126)](#fn126))


    安格温对风险评估模型了解得越深入，就越觉得有问题。这正是她要寻找的下一个故事：“从记者的视角来看，这是完美风暴。这些东西从未被审视过；给人类带来极高的风险；明眼人一看就知道，‘存在典型的种族主义’。所以我想，‘我要测试这个’。”
    ^([^(127)](#fn127))'
  fmt: '

    一个职业词汇的向量越偏向某个性别方向，该性别在这个职业中的占比就越多。他们写道：“词嵌入与美国50个职业的女性占比强相关。” ^([^(101)](#fn101))


    从“魔术般的”优化过程产生的嵌入作为社会的一面镜子是如此不可思议和令人不安，也意味着社会科学的武器库增加了一个诊断工具。我们可以利用嵌入在某个时间点的快照，精确量化一些社会特征。无论因果关系是怎样的——无论是客观现实的变化改变了我们说话的方式，还是相反，或者两者都是由更深层次的原因驱动——我们都可以用这些快照来**观察社会的变化**。


    这正是尼克尔·加尔格（Nikhil Garg）和詹姆斯·邹（James Zou）领导的斯坦福跨学科团队打算做的事情。电气工程博士生加尔格和生物医学数据科学助理教授詹姆斯·邹与历史学家隆达·希宾格（Londa
    Schiebinger）和语言学家丹·朱拉夫斯基（Dan Jurafsky）合作，不仅使用**当代**文本语料库，还使用过去100年的样本来研究词嵌入。 ^([^(102)](#fn102))


    由此得出的是一部丰富详细的文化变迁史。正如他们所说：“嵌入的时间动态有助于量化20和21世纪美国对女性和少数族群的刻板印象和态度的变化。”


    斯坦福团队证实了普林斯顿团队关于职业词汇表示与性别的关联的研究结果，并补充道，似乎有某种“男性基线”，即我们从人口普查数据中知道的男女各占一半的职业，在词嵌入上略微偏向“男性”方向。作者解释，“基于外部的、客观的衡量标准，日常语言比人们预期的更有偏见”。然而，除了基线之外，职业词汇的嵌入中存在的性别偏见随时间的变化趋势与劳动力本身的变化趋势一致。


    通过分析不同时期的文本，他们发现了大量反映社会变迁的语言表述。数据显示，随着时间推移，性别偏见已普遍减少，特别是“20世纪六七十年代的妇女运动对文学和文化中的妇女形象产生了系统和剧烈的影响”。


    嵌入还展示了种族态度转变的详细历史。例如，在1910年，与白人相比，与亚洲人联系最紧密的前10个词包括“野蛮”“可怕”“可恨”和“怪异”。到了1980年，这个故事已截然不同，前10个词以“拘谨”和“被动”开头，以“敏感”和“热情”结尾：当然，仍然是刻板印象，但它反映了明显的文化变迁。


    在嵌入中也可以看到更近的文化变迁——例如，在1993年（世贸中心爆炸那一年）和2001年（“9.11”那一年），与伊斯兰教有关的词汇和与恐怖主义有关的词汇的关联骤增。


    不难想象，用这个方法不仅可以回顾过去，还能展望未来：比如说，根据过去6个月的数据，某种偏见是变好还是变糟了？甚至可以想象用某种实时仪表板来展示社会本身——或者至少是公共话语——的偏见是在增加还是减少，作为正在发生的转变的风向标，以及对未来世界的一瞥。


    ### 代表和显现


    有几个结论，第一个主要是方法论，虽然不是纯粹的方法论。随着计算机科学家开始更深入地思考他们构建的模型中包含了什么，他们接触到了社会科学。同样，社会科学家也在接触机器学习，并获得了一个强大的新显微镜。正如斯坦福团队写道：“在标准的定量社会科学中，机器学习成为了分析数据的工具。我们的工作展示了机器学习的人工产物（这里是词嵌入）本身如何成为社会科学分析的有趣对象。我们相信，这种范式转变可以带来许多富有成效的研究。”


    第二，偏见和言外之意虽然看似虚无缥缈，不可言喻，但的确是真实存在的。它们可以细致精确地测量。它们自发地、可靠地从原本是用于猜测缺失词的模型中显现，可测量，可量化，有动态变化。它们呈现了关于职业的真实数据，以及对主观态度和刻板印象的度量。所有这些，以及更多的信息，都存在于本来只是用于猜测上下文中缺失词汇的模型中：语言的故事就是文化的故事。


    第三，这些模型绝对应该谨慎使用，尤其是当用于猜测缺失词的初始目的之外的任何事情时。亚当·卡莱说：“我和读过我们论文的人谈过……（他们）会对使用这些词嵌入更加谨慎，至少在用于他们自己的应用程序之前会三思。所以，这是一个积极的结果。”普林斯顿团队也赞同这一警告。“当然，”他们写道，“在将无监督机器学习构建的模型纳入决策系统时，必须谨慎。”
    ^([^(103)](#fn103))


    我们发现自己正处于一个脆弱的历史时期。这些模型的力量和灵活性使它们不可避免地会被应用于大量商业和公共领域，然而关于应该如何适当使用它们，标准和规范仍处于萌芽状态。正是在这个时期，我们尤其应当谨慎和保守，因为这些模型一旦被部署到现实世界中，就不太可能再有实质性改变。就像普林斯顿大学的阿尔温德·纳拉亚南说的：“与‘科技发展太快，社会跟不上’的陈词滥调相反，科技的商业部署经常推进得很慢——看看银行和航空公司仍在服役的电脑就知道了。今天训练的机器学习模型可能在50年后仍在使用，这太可怕了。”
    ^([^(104)](#fn104))


    对世界建模是一回事。但是一旦你开始应用这个模型，你就或多或少在改变世界。许多机器学习模型都有一个普遍假设，即模型本身不会改变它所建模的现实。几乎在所有情况下，这都是错的。


    事实上，不谨慎地部署这些模型可能会形成正反馈，想要扭转局面会越来越困难，或者需要越来越多的干预。比方说，如果简历搜索系统检测到某个职位存在性别偏见，那么它可能会青睐（比如说）男性申请者，从而加剧这种偏见，而这个结果又可能会成为模型学习的下一批训练数据，那么它学到的偏见会越来越极端。要对此进行干预当然是**越早越好**。


    最后，这些模型为我们提供了展望未来社会的数字六分仪。通过这些模型，我们不仅看到了历史，也看到了最新的现状。只要每天有新的文本在网上发布，就会有新的数据需要采样。


    这些有可能延续和加剧社会偏见的系统，如果能明智地加以利用，让其只有描述性而无规定性，也可以让偏见显现而且证据确凿。它们将为我们提供一个衡量标准，衡量那些看起来虚无缥缈或无形的东西。
    ^([^(105)](#fn105))


    已离开谷歌的约纳坦·尊格认为，人们有时会无视工程与人类社会、人类规范和人类价值观的密不可分。他写道：“从本质上讲，工程就是合作、协同以及对同事和客户的共情。如果有人告诉你，工程是一个你可以不与人或感情打交道的领域，那么我非常抱歉地告诉你，你被骗了。”
    ^([^(106)](#fn106))


    杰基·阿尔西内现在经营着自己的软件咨询公司，仍然与尊格保持联系，他认同这个问题既不是始于技术，也不会止于技术。“这就是我想去教历史的部分原因，”他笑着告诉我，至少是半认真的，“等我35岁时，我会停止一切，退休，转向历史。”


    ## 2. 公平


    尽管自冰川消退以来，可能在冰河时代之前，人类就一直在美洲大陆上活动，但对人类进化的认识仍然不尽人意，科学刚开始着手研究的一个问题是预测一个人在假释出狱后会做什么。


    ——芝加哥论坛报，1936年1月 ^([^(107)](#fn107))


    我们的法律惩罚的是人们的所作所为，而不是他们是谁。根据某种不可改变的特性来实施惩罚，这与这一指导原则背道而驰。


    ——最高法院首席法官约翰·罗伯茨 ^([^(108)](#fn108))


    我们正处于使用机器学习来辅助教育、就业、广告、医疗保健和警务等领域中涉及人类的各种重要决策的浪潮中，理解为什么机器学习在默认情况下不公平或不公正是很重要的。


    ——莫里兹·哈迪（Moritz Hardy） ^([^(109)](#fn109))


    用数字模型取代人类不可靠的判断，让社会变得更一致、更准确、更公平，这种想法并不新鲜。事实上，它们在刑事司法中的应用已有近一个世纪的历史。


    1927年，伊利诺伊州假释委员会的新主席辛顿·克拉博（Hinton Clabaugh）致力于推动一项关于该州假释制度运作的研究。因为他认为存在一种创新差距：“我们的工业和政府机器远非完美，但仍然可能是在工业上最有创造力和效率的国家，”克拉博写道，“对于我们的执法情况，能这样说吗？”
    ^([^(110)](#fn110))


    克拉博要求他所在的州最有声望的学校——伊利诺伊大学、西北大学和芝加哥大学——联合起来，撰写一份关于假释制度的全面报告，期限是1年。伊利诺伊大学法学院院长阿尔伯特·哈诺（Albert
    Harno）负责总结假释委员会的工作情况；西北大学的安德鲁·布鲁斯（Andrew Bruce）法官负责梳理伊利诺伊州刑罚体系的历史（包括对19世纪“废除鞭笞”的回顾）；芝加哥大学社会学家欧内斯特·伯吉斯（Ernest
    Burgess）则面临一个有趣的挑战，看是否有什么因素可以预测一个假释犯的“成功或失败”。


    伯吉斯写道：


    目前，伊利诺伊州人民对被假释的人有两种截然不同的看法。一种看法是冷酷、邪恶、绝望的罪犯，从监狱里出来，不思悔改，一心只想为他所受的惩罚报复社会。另一种看法是不成熟的青年，寡居母亲的独生子，一时冲动，在不坚定的时候，屈从于任性同伴的邪恶提议，现在从管教所回归社会，只需给个机会，就会洗心革面。
    ^([^(111)](#fn111))


    当然，问题是，是否有可能预测犯人如果被假释会是哪种情况。


    伯吉斯收集了伊利诺伊州大约3000名假释犯的数据，并将他们分为4组：“初犯”“偶犯”“惯犯”和“职业罪犯”。从21世纪的视角来看，他的一些说法似乎过时了：例如，他把人分为8种“社会类型”——“流浪汉”“游手好闲者”“底层居民”“酒鬼”“流氓”“新移民”“农场男孩”和“瘾君子”。尽管如此，伯吉斯的研究十分透彻，令人印象深刻，尤其是就当时的条件而言，收集了犯罪史、工作史、居住史、犯罪类型、刑期、服刑时间、精神病诊断等等。他研究了这些数据是否揭示了某些囚犯的判罚受到了不当的政治干预，并探讨了公众对司法系统的看法是否有道理。在最后一章，他探讨了一个问题，这个问题将引发一场刑事司法变革，这场变革将持续到21世纪：“科学方法能应用于假释管理吗？”


    他写道：“许多人怀疑将科学方法引入涉及人类行为的领域的可行性。他们认为没有可行性，因为人性太多变数，无法预测。但是通过分析决定假释成败的因素，确实发现了一些显著差异。”


    伯吉斯指出，在那些有良好工作记录、高智商和农业背景，服刑1年或不到1年的人中，违反假释规定的比例是该州平均水平的一半。另一方面，那些生活在“犯罪黑社会”，被检察官或法官反对宽大处理，而且已经服刑5年以上的人，违反假释规定的比例是全国平均水平的**2倍**。“这些与我们所认为的塑造人的生活条件相一致的显著差异，难道不表明应该更认真、更客观地加以考虑吗？”他问道。


    “为每个即将被假释的人设计一份总结表是完全可行的，对假释委员会应该会有帮助，”他说，“委员会成员能够了解每个重要因素的状况……这种预测在任何特定情况下都不是绝对的，但根据平均法则，它适用于相当多的情形。”


    他的结论是，在许多情形下，悔过自新是完全可能的。更重要的是，哪些情形下会成功，至少在一定程度上是可预测的。一个建立在这一统计基础之上的系统，难道不会比由法官临时做出主观的、不一致的和特殊的人类决定更好吗？“毫无疑问，找出决定假释犯成败的因素是可行的，”伯吉斯写道，“人类行为似乎存在一定程度的可预测性。这些记录的事实能作为囚犯获得假释的依据吗？还是依赖假释委员会成员对这个人的印象？”


    报告最终给出了明确的肯定结论。假释和“不定期刑”确实应该在伊利诺伊州继续推行，同样重要的是，“如果能将假释委员会的工作置于科学和专业的基础上，并进一步防范政治干预的持续压力，相关的管理可以而且应该得到改善”。


    这份报告完全改变了克拉博主席对他领导的系统的看法。他承认：“我原来认为，不定期刑和假释法对罪犯有利。相反的证据是压倒性的，我现在相信，如果管理得当，这些法律肯定对社会和个人都有好处。”总之，假释是一件好事，他写道：“即使管理方法有缺陷。当然，机器的高效取决于操作它的人。”
    ^([^(112)](#fn112))


    ### 实践中的科学假释


    20世纪30年代初，在伯吉斯的推动和克拉博的支持下，预测性假释制度在伊利诺伊州开始实施。1951年，《假释预测手册》出版，总结了前20年的研究和实践。


    看法很乐观。伯吉斯在导论部分写道：“在过去20年，社会科学家详尽分析了囚犯假释的案例，对于在什么条件下假释会成功或失败取得了重大进展。从他们的研究中逐渐形成了一种信念，即尽管存在困难，仍然有可能在某种程度上预测囚犯在假释期的行为。”
    ^([^(113)](#fn113))


    《假释预测手册》指出了未来值得研究和可能改进的几个方向，例如可能有助于改进预测的其他因素，比如监狱工作人员的评估。书的最后一节特别有先见之明，题为“用机器评分”，考虑使用穿孔卡片机来自动化和简化收集数据、构建模型和输出具体预测的过程。


    尽管有这种乐观态度和伊利诺伊州的成功实践，假释预测工具的推广却慢得出奇。到1970年，只有2个州采用。但情况即将改变。


    1969年，出生于苏格兰的统计学家蒂姆·布伦南（Tim Brennan）在伦敦为联合利华工作，建立各种类型的统计模型。他是联合利华在市场细分方面的顶尖专家。例如，用模型将浴室肥皂的购买者分为魅力至上者和优先考虑皮肤温和者。他很擅长也很喜欢这项工作，但总感觉有些憋屈。“我产生了价值观危机。”布伦南告诉我。在公司的一份报告中，他注意到联合利华过去一年花在研究斯奎奇系列洗碗皂液包装上的钱比整个英国政府花在扫盲上的钱还多。
    ^([^(114)](#fn114))


    “那是在60年代末，”他说，“你知道当时嬉皮士很流行。我对为斯奎奇设计包装不再感兴趣。所以我辞职了，申请读研究生。”他去了兰卡斯特大学，将他的市场细分统计方法应用于教育问题：分辨在课堂上有不同学习风格和不同需求的学生。
    ^([^(115)](#fn115))


    女友去美国后，布伦南跟着去了科罗拉多大学，为德尔伯特·埃利奥特（Delbert Elliott，后来成为了美国犯罪学学会主席）工作，并最终创办了自己的研究公司，与国家惩教研究所和执法援助署合作。他发现了分类技术的第三个用途：为监狱提供更加一致和严格的方法，根据每个囚犯的风险和需要将他们安排到不同的囚室和床位。这既是为了他人的安全，也是为了他们自己的改过自新。以前通常都是随机或凭直觉安排，布伦南认为数学能提供更好的方法。


    布伦南访问了密歇根州的特拉弗斯城，因为听说那里有一些开创性的机器学习研究，使用所谓的“决策树”模型对囚犯分类，并确定该释放谁，以解决过度拥挤的问题。布伦南在那里遇到了“发明这个模型的年轻人……留着乱蓬蓬的头发和胡子”。这个年轻人名叫戴夫·威尔斯（Dave
    Wells）。“戴夫的目标是改革刑事司法系统，”布伦南说，“他对这项工作充满激情。”布伦南和威尔斯决定合作。 ^([^(116)](#fn116))


    随着个人计算机时代的到来，在各个司法管辖区，统计模型在刑事司法系统的应用激增。1980年还只有4个州使用统计模型来帮助假释裁决。到1990年，已经有12个州，2000年有26个州。
    ^([^(117)](#fn117))


    这个当今时代最广泛使用的工具之一，就是布伦南和威尔斯在1998年开发的，他们称之为“替代性制裁的矫正罪犯管理概况分析”，缩写为COMPAS。 ^([^(118)](#fn118))


    但是，《纽约时报》社评认为，存在一个问题：政府没有**充分**利用它们。这些工具，即使在强制使用的情况下，也并不总是得到适当考虑。《纽约时报》2014年在报道中敦促在假释中更广泛地使用风险评估工具，“像COMPAS这样的工具已被证明是有效的”。
    ^([^(119)](#fn119))


    然后，风向突然变了。


    9个月后，2016年6月，该报发表了一篇文章，题为《在威斯康星州，有呼声反对根据数据预测被告的未来》，文章结尾引用了美国公民自由联盟刑法改革项目主任的话：“我想我们在奔向用大数据进行风险评估的明日世界时，有点过于急迫。”
    ^([^(120)](#fn120))


    2017年的报道看法更糟：5月，《被软件的秘密算法送进监狱》；6月，《当计算机程序让你留在监狱里》；10月，《当算法将你送进监狱》。


    发生了什么事？


    简而言之，是ProPublica。


    ### 获取数据


    20世纪七八十年代，朱莉娅·安格温在硅谷长大，父母都是程序员，还和史蒂夫·乔布斯是邻居。她小时候的理想是当程序员。但是后来她又爱上了新闻业。2000年，她去了《华尔街日报》当科技记者。“这太滑稽了，”她回忆道，“他们说：‘你懂电脑吗？我们会请你来报道互联网。’我回应说：‘嗯，以互联网为主？’他们说：‘不，**全部！**’”
    ^([^(121)](#fn121))


    从互联网泡沫崩溃到社交网络和智能手机的兴起，安格温在这家报社待了14年，她不仅报道技术，还关注随之而来的社会问题；她写了关于隐私相关问题的长篇系列报道：《他们知道些什么》。2013年，她离开《华尔街日报》，写了一本关于隐私的书。
    ^([^(122)](#fn122))


    安格温写完书后没有再回到报社，而是加入了非营利新闻机构ProPublica，这家机构由前《华尔街日报》总编辑保罗·施泰格（Paul Steiger）创办。如果说她早期作品的主题是“他们知道些什么”，那么答案必然引出另一个问题：**他们会用它来做什么？**“所以我想，”她说，“我应当关注数据使用。这就是下一个故事。他们打算做什么？……他们会对你做出怎样的评判？”
    ^([^(123)](#fn123))


    安格温开始寻找基于数据做出的最重要并且被忽视的决定。她锁定了刑事审判。COMPAS等统计风险评估工具在数百个司法管辖区被采用：不仅用于假释，还用于审前拘留、保释，甚至判刑。“我很震惊，”她说，“全国各地都在使用这个软件。……然后我发现，更令人震惊的是，它们没有接受过独立评估。”


    例如，纽约州从2001年开始使用COMPAS，在使用了11年后，于2012年对该软件进行了首次正式评估。（纽约最终认定它“有效而且预测准确”。 ^([^(124)](#fn124))


    这样的情况非常普遍。包括明尼阿波利斯在内的明尼苏达州第四司法区处理该州40%的案件，该区在1992年开发了自己的审前风险评估工具。“当时的报告指出，这种新量表在使用几年后应该进行验证。结果是，差不多过了14年”，
    ^([^(125)](#fn125))


    2006年，这项已迟到很久的评估发现，模型中的4个变量——被告是否在明尼苏达州生活了3个月以上，他们是否独自生活，年龄，以及对他们的指控是否涉及武器——实际上与他们在等待开庭时犯下新罪行或逃跑的实际风险没有关联。然而，该模型一直建议基于这些理由决定审前拘留。更糟糕的是，这4个因素中有3个与种族有很大关联。该地区放弃了这个模型，重新构建。
    ^([^(126)](#fn126))


    安格温对风险评估模型了解得越深入，就越觉得有问题。这正是她要寻找的下一个故事：“从记者的视角来看，这是完美风暴。这些东西从未被审视过；给人类带来极高的风险；明眼人一看就知道，‘存在典型的种族主义’。所以我想，‘我要测试这个’。”
    ^([^(127)](#fn127))

