    ## 逐步相对可达性


    克拉科夫纳正在开发的一种有前景的方法是所谓的“逐步相对可达性”：计算在每个行为后有多少可能的世界状态是可达的，与不采取这个行为比较，并且可能的话，尽量不要让可达状态减少。^(⁶²⁴)


    ## 可实现效用保留


    第三个有趣的想法来自俄勒冈州立大学的博士生亚历山大·特纳（Alexander Turner）。特纳认为，我们之所以关心上海证券交易所，或者珍贵花瓶的完整性，或者就此而言，关心在虚拟仓库中移动箱子的能力，是因为无论出于什么原因，这些东西对我们来说很重要，因为它们最终以某种方式与我们的目标关联在一起。我们要为退休存钱，把花插在花瓶里，破推箱子的纪录。如果我们明确地为这种与目标关联的想法建模会怎么样？他的提议被命名为“可实现效用保留”：在游戏环境中给系统设置一组辅助目标，并确保它在完成游戏激励的任何得分动作后，仍能追求这些辅助目标。有趣的是，即使辅助目标是随机产生的，保留可实现效用似乎也能促进
    AI 安全网格世界中的良好行为。^(⁶²⁵)


    特纳在图书馆白板上第一次阐明这个想法后，他在回去的路上非常兴奋，于是又回到图书馆，以白板为背景拍了一张自拍。“我想，不错，我认为这至少有 60%的可能行得通，如果行得通，我想留个纪念。所以我又回到了图书馆，非常开心。在我一直用来思考问题的白板前拍了张照片。”^(⁶²⁶)


    斯图尔特·阿姆斯特朗最初设想了“200 亿”个指标，几乎无所不包，但也有一定的选择性。现在随机生成 4 到 5 个就够了，至少在简化的推箱子游戏中是这样。


    关于让机器谨慎的这些措施，以及如何将它们从网格世界扩展到现实世界，无疑还需要继续研究和探索，但这些工作是一个令人鼓舞的开始。逐步相对可达性和可实现效用保留都有一个潜在的直觉：无论具体环境如何，我们都希望系统尽可能保留可选择性，无论是它们的还是我们的。这方面的研究也表明，网格世界环境似乎正在扎根，成为一种共同基准，可以为理论奠定基础，并有助于比较和讨论。


    诚然，在现实世界中，我们采取的行动经常是不仅意外的效果难以预料，甚至意图的效果也难以预料。例如，发表一篇 AI 安全论文（或出版一本书）：看起来是很有帮助的事情，但是谁能预见到底会怎样呢？简·雷克与克拉科夫纳合著了题为“AI
    安全网格世界”的论文，我问他迄今为止他和克拉科夫纳的网格世界研究获得了什么反响。


    “很多人联系我，尤其是刚进入这个领域的学生，他们会说，‘哦，AI 安全听起来很酷。还提供了开源，我可以放一个自主体进去玩玩。’很多人都在参与，”雷克说，“到底会得到什么结果？几年后才能知道……现在还很难说。”


    ## 可纠正性、遵从性和服从性


    在 AI 安全领域，最令人不寒而栗、最有先见之明的评论之一来自诺伯特·维纳在 1960 年发表的一篇著名论文，题为“自动化的道德和技术后果”：“如果我们使用机械自主体来实现我们的目的，一旦启动，我们就不能有效地干预它的运行……那我们最好确定，机器的目的是我们真正渴望的目的，而不仅仅是看着很炫的模仿。”^(⁶²⁷)


    这句话还有同样重要的另一面：如果我们不确定我们给机器的目标和约束完整且正确地说明了我们想让和不想让机器做什么，那么我们最好保证我们可以干预。在 AI 安全文献中，这个概念被称为“可纠正性”，并且需要警醒的是，它比看起来要复杂得多。^(⁶²⁸)


    几乎任何关于杀手机器人或任何类型的失控技术的讨论都会引发类似美国总统奥巴马的反应，当《连线》主编斯科特·达迪奇（Scott Dadich）在 2016 年问他是否认为
    AI 值得关注时，奥巴马说：“必须有人站在电源线旁边，伙计，一旦发现不对劲，就马上拔电源。”^(⁶²⁹)


    “你知道，奥巴马有这种想法是可以原谅的，”哈德菲尔德——梅内埃尔在 OpenAI 的会议桌旁告诉我。^(⁶³⁰)


    一般来说，对被关闭或干扰的反抗，甚至都不需要恶意：系统只是试图达成某个目标，或者在做过去给它带来收益的事情时遵循“肌肉记忆”，任何形式的干扰都会阻碍它。（这可能会导致危险的自我保护行为，即使是目的看似良性的系统：一个被赋予“去拿咖啡”这样平常任务的系统，也可能会与试图关闭它的任何人殊死搏斗，因为，用斯图尔特·罗素的话来说：“如果你死了，就不能去拿咖啡。”）^(⁶³¹)


    2015 年，机器智能研究所的内特·苏亚雷斯（Nate Soares）、本杰明·费伦斯坦（Benja Fallenstein）和埃利泽·尤多科夫斯基与人类未来研究所的斯图尔特·阿姆斯特朗合作，撰写了第一篇强调可纠正性问题的专业论文。他们从激励的角度来探讨可纠正性，并注意到很难做到激励一个自主体允许自己被关闭，或者允许目标被更改。^(⁶³²)


    在不到 2 公里远的伯克利，他们的同行也得出了同样结论。例如，斯图尔特·罗素就确信，“机器必须在最初阶段不确定”人类希望它做什么。^(⁶³³)


    ### 开关游戏


    罗素、哈德菲尔德——梅内埃尔、伯克利研究员安卡·德拉甘和彼得·阿贝尔用他们所谓的“开关游戏”来阐释这个问题。他们考虑了这样的系统，它的目标是为人类用户做最好的事情，只是它对这件事是什么有一些不完善和不确定的想法。在每个时间点，系统可以采取一些它认为会帮助用户的行动，或者它可以向人类宣示它的意图，并让人类有批准行动或干预的机会。


    假设系统不会因为以这种方式顺从人类付出任何代价或惩罚，伯克利团队证明这样的系统将总是先与人类交流。只要它对人类想要的东西的认识有可能是错的，那么给人类一个阻止的机会总是好的，而且，当人类阻止时，最好让他们阻止。如果它唯一的任务是帮助人类，并且人类（通过试图阻止它）表达了他们认为它的行动会有害，那么它就应该断定会有害，并遵从他们的干预。


    这是一个乐观的结果，它肯定了不确定性与可纠正性的强有力关联。


    只是有两个问题。第一个是，每次人类干预，系统都会学习：它意识到自己错了，并会更好地了解人类喜欢什么。它的不确定性会降低。然而，如果不确定性减小到零，系统就会失去与人交流的动力，当人试图阻止它时也不会顺从。


    “所以，我们试图用这个定理得出的主要观点是，”哈德菲尔德——梅内埃尔说，“在给机器人确定的奖励函数，或者让它完全确信自己的目标是什么之前，你真的应该考虑周全。”^(⁶³⁴)


    第二个问题是，系统必须认定“客户永远是对的”——当人类介入阻止它时，对于他们是不是更希望系统采取其建议的行动，人类永远不会错。如果系统相信人类偶尔会犯错，那么系统最终会走到这一步，它相信自己比人类更清楚什么对他们有益。一旦到了这一步，它就会对人类的抗议充耳不闻：“没关系，我知道我在做什么。你会喜欢这个的。你认为你不喜欢，但其实你喜欢，相信我。”


    我告诉哈德菲尔德——梅内埃尔，读这篇论文时的心情就像坐过山车。起初以为是快乐结局——不确定性解决了可纠正性问题！然后又反转了——只在两个非常微妙的条件成立的情况下：系统永远不会变得太自信，人类永远不会表现出系统可能解释为“非理性”或“错误”的任何东西。突然，庆祝变成了警示。


    “没错，”他说，“过山车也符合我们的研究经历，一开始是，‘嘿，我们做了一些很棒的事情！’然后是‘哦，哪怕你只是有一点点偏离理性，这一切都会立刻崩盘’。”


    ### 模型设定错误与服从


    在一项由伯克利博士研究生史密莎·米利（Smitha Milli）领导的后续研究中，该团队进一步探究了“机器人应该听话吗？”的问题。^(⁶³⁵)


    正如米利指出的：“有时你并不真正希望系统服从你。如果你刚犯了一个错误，比如，我坐在自动驾驶的汽车上，不小心碰到了手动驾驶模式。如果我是无意的，我不希望自动驾驶关闭。”^(⁶³⁶)


    但是，他们发现，有一个大问题。如果系统拥有的你关心什么的模型从根本上是“错误的”——有些你关心的事情它甚至没意识到，更没有纳入系统关于你的奖励模型——那么它就会对你的动机感到困惑。例如，如果系统不理解人类食欲的微妙之处，它可能不理解为什么你在晚上
    6 点要吃牛排，却又拒绝在 7 点吃第二顿牛排。如果模型过于简单或者是错的，（在这种情况下）牛排必须是要么好要么不好，只能二选一，它就会得出结论，一定是你错了。它会把你的行为解释为“非理性”，从而导致不可纠正和不服从。^(⁶³⁷)


    出于这个原因，关于人类偏好或价值观的模型最好有一定的复杂度。“我们发现，”哈德菲尔德——梅内埃尔说，“如果系统的价值空间参数过多，那么系统最终会学到正确的东西，但需要多花一些时间。如果系统的参数不够，那么系统很快就会变得非常不服从，还很自信自己比这个人更了解他自己。”


    在实践中，让用于模拟人类价值观的系统“参数过多”，说起来容易做起来难：回想一下斯图尔特·阿姆斯特朗的 200 亿个指标。但如果一个系统的模型只用面积和价格来分析你的住房偏好，那么它会把你对一栋更小但更贵的房子的偏好解释为你犯了一个错误。事实上，有很多你关心的事情根本没有被考虑进去：比如位置，或者学区，也有不太容易测量的，比如窗外的景色，离朋友们更近，与童年的家的相似之处。这个“模型设定错误”的问题在机器学习中是一个普遍问题，但在这里，在服从的背景下，造成的后果尤其怪异。


    米利说：“如果要让系统能与人类很好地互动，就需要有一个关于人类偏好的好模型。但是要得到人类的模型真的很难。”


    米利指出，尽管整个领域取得了令人惊叹的进步，但大多数都是考虑机器本身。“整合更精准的人类模型也非常重要，”她说，“我对此很感兴趣。总的来说，在这个领域，我认为安全领域有很多有意思的问题，我对涉及与人互动的部分尤其感兴趣，因为我认为与人互动是观察系统是否学会了正确的目标或行为的一个很好方式。”


    保持不确定性，永远不要对模型过于自信——“在给机器人确定的奖励函数，或者让它完全确信自己的目标是什么之前，你真的应该考虑周全。”——这个原则对于保持对系统的控制和系统的服从是如此重要，以至于哈德菲尔德——梅内埃尔、米利和他们的伯克利同事决定将这个想法推进到合乎逻辑的下一步。


    如果系统的设计使得即使你给了它确定的奖励函数，它也保持不确定性呢？那会怎么样？


    ### 逆向奖励设计


    奖励函数是一种在真实或虚拟环境中给出分数的明确方式。这本书的主题之一，尤其是第 5 章对奖励塑造的讨论强调的，是很难构造一个奖励函数，既能产生想要的行为，又不会产生漏洞、副作用或不可预见的后果。AI
    界的许多人认为，人工构建这样的显式奖励函数或目标函数，是善意铺就的通往地狱之路：无论你多么深思熟虑，或者你的动机多么纯洁，总会有你没考虑到的事情。


    这种对显式目标函数的宿命论态度，影响是如此之深，以至于正如我们在前几章中看到的，在高级 AI 应用中，特别是在 AI 安全中的大部分工作，都是关于超越有显式目标的系统，要么尝试模仿人类（很多自动驾驶项目就是这样），要么寻求人类的确认（例如后空翻机器人，不断进行选择），要么推断人类的目标并将其作为自己的目标（例如遥控特技直升机）。


    但是，有没有办法可以拯救显式奖励函数架构，或者至少让它更安全呢？


    伯克利团队提出，一种方法是让系统在某种程度上意识到设计一个显式奖励函数有多难，意识到人类用户或程序员尽了最大努力，来设计一个能捕捉他们想要的一切的奖励函数，但是很可能做得不完美。在这种情况下，甚至分数都靠不住。人类想要某些东西，而显式目标仅仅是不完美的表达。


    “这样做的目的……是接受这些关于不确定性的观点，然后问，对于人们目前正在做的事情，我们能做的最简单的改进是什么？”哈德菲尔德——梅内埃尔说，“对于目前的机器人和
    AI 编程机制，有什么简单改进能利用这种不确定性？”


    他解释道：“这个‘写出来的奖励函数’其实蕴含了丰富的信息。它是关于你应该做什么的重要信号，含有很多信息。只是现在我们有点假设里面的信息量是无限的，也就是说，我们假设你拥有的奖励函数定义了世界每种可能状态下的正确行为。但实际并非如此。那么，我们如何能利用现有的大量信息，同时又不将其视为无所不能呢？”^(⁶³⁸)


    正如斯图尔特·罗素说的：“可以说，学习系统是在天堂里寻找核仁巧克力饼，而奖励信号充其量只提供了饼的总数”（强调是我加的）。^(⁶³⁹)


    他们称这个想法为“逆向奖励设计（IRD）”。^(⁶⁴⁰)


    “自动自主体优化我们给予它们的奖励函数，”他们写道，“它们不知道的是，对于我们来说，设计一个能真正刻画我们想要的东西的奖励函数有多难。”^(⁶⁴¹)


    例如那艘出了名的赛艇——在补能区兜圈，而不是沿着赛道完成比赛的那艘——被显式地告知最大化分数，这在大多数游戏中是取得进展或提升技艺的良好替代。一般来说，无论人类给予系统什么样的奖励或命令，在系统被训练的环境中都能很好地发挥作用。但是在现实世界中，系统遇到的情况完全不同于训练环境，而且可能是人类用户无法预见的，显式指令可能没多大意义。


    很可能几十年后的机器学习系统会直接接受命令，并认真对待命令。但是，出于安全原因，它们不会照字面意思理解命令。


    ## 道德不确定性


    就我们的行为来说，有时候除了缺乏确定性之外，不可能明确任何东西，这样去做是不可能的。


    ——多米尼克·普路美（Dominic M. Prümmer），宣道兄弟会^(⁶⁴²)


    在你接管大自然的事务之前，给它时间去工作，不要干扰它做事。你声称你知道时间的价值，害怕浪费时间。你没有意识到，把时间用在不好的地方比什么都不做更浪费，一个没有受到良好教育的孩子比一个什么都没学过的孩子离美德更远。


    ——卢梭^(⁶⁴³)


    宽泛地说，这种“认识到它是不完美的，并且有会导致危险的潜在缺陷”并努力寻找“天堂里的核仁巧克力饼”的系统——即使这意味着在此时此地放弃显式奖励——听起来很……天主教。


    几个世纪以来，天主教神学家一直在努力解决如何按照他们的信仰规则生活的问题，因为学者们经常对规则到底是什么有分歧。


    例如，如果 10 个神学家有 8 个认为在星期五吃鱼是完全可接受的，但是有一个人认为不能这么做，还有一个人认为必须这样做，那么什么是合理的，虔诚的天主教徒应该怎么做呢？^(⁶⁴⁴)


    在中世纪之后的现代早期，即 15 到 18 世纪，这些都是特别有争议的问题。一些学者主张“宽松主义”，只要有机会事情是好的，它就不是罪恶，这在 1591 年受到教皇英诺森九世的谴责。另一些人则主张“严格主义”，如果某件事有可能会被证明有罪，就应当禁止，教皇亚历山大八世在
    1690 年对此进行了谴责。^(⁶⁴⁵)


    把纯粹的神学问题放到一边，同样模棱两可的论证也有可能应用于世俗道德问题，因此也适用于机器学习。比如说，如果有多个你关心的指标，那么一个“宽松主义”方法可能会说，只要它能提升这些指标中的至少一个，就可以采取行动；一个“严格主义”方法可能会说，只有能够提升至少一个指标并且其他的都不会下降，采取行动才是正确的。


    在天主教内部，这些争论已基本沉寂，在世俗伦理的世界更没有太多反响，但在最近几年，这些争论又开始兴起。


    2009 年，牛津大学的威尔·麦卡斯基尔在默顿街 10 号哲学大楼地下室的一个扫帚柜里，与研究生丹尼尔·迪希（Daniel Deasy）争论吃肉的事。麦卡斯基尔解释说，扫帚柜是“我们在大学里唯一能找到的地方，它刚好有足够的空间让我们稍微斜靠。我们坐在成堆的书和杂物上。这也是一个笑话。”他说，因为他的论文导师是牛津哲学家约翰·布鲁姆（John
    Broome）^(⁶⁴⁶)


    在扫帚柜里，两人争论的不是吃肉本身是否不道德，而是在你不知道吃肉是否不道德的情况下，你是否应该吃肉。麦卡斯基尔解释道，“决定吃素——如果可以吃肉——让你不会犯下大错。可能让你的生活稍微不那么幸福，只是稍微，不是什么大事。相比之下，如果素食主义者是对的，动物遭受的痛苦在道德上真的很重要，那么选择吃肉，你的罪过就大了”。


    “两边的风险不对称，”麦卡斯基尔说，“你不必确信吃肉是不对的，仅仅是犯错的重大风险似乎就足够了。”


    这次谈话给麦卡斯基尔留下了深刻印象。一方面，这似乎很有说服力。但更重要的是，他从未见过这种类型 的争论。这不符合伦理哲学的惯常模式：“给定一些道德标准，做什么是正确的？”以及“我们应该用什么标准来决定做正确的事情？”这样的争论有微妙但惊人的不同。“当你不知道做什么是正确的时候，该做什么？”^(⁶⁴⁷)


    他把这个想法告诉了导师约翰·布鲁姆，布鲁姆告诉他：“哦，如果你对此感兴趣，你应该和托比·奥德（Toby Ord）谈谈。”


    就这样，麦卡斯基尔和奥德相遇了——在牛津的一个墓园里——并由此开启了 21 世纪伦理学一段极富成果的友谊。两人成为了后来被称为有效利他运动（EA）的创始人，第
    7 章曾简要讨论过这一运动，可以说是 21 世纪初最重要的伦理社会运动。^(⁶⁴⁸)


    事实证明，当你面对相互竞争的理论，如果不确定哪个是对的，有许多方法可以采用。一种方法被称为“我最喜欢的理论”，就是简单按照你认为最有可能正确的理论生活，尽管这可能会忽视一种情况，即潜在的错误非常严重，以至于即使不太可能出错，也最好避免。^(⁶⁴⁹)


    麦卡斯基尔将道德理论想象成选举中的投票者，这样“社会选择理论”——关注投票和集体决策的本质，以及里面各种奇事和悖论——就可以移植到道德领域。^(⁶⁵⁰)


    但对麦卡斯基尔来说，道德不确定性不仅仅是描述性的，还具有规范性。也就是说，当我们非常不确定适用的道德框架时，我们不仅需要选择正确的方法做正确的事情，在某种意义上，我们还应该培养这种不确定感。


    麦卡斯基尔认为，只需看看几个世纪以来人类道德规范发生了多大变化，就能知道，认为我们已经得出任何结论肯定是狂妄自大。“我们可以看到道德进步的曲线，适用范围不断扩大，也许你会认为进步已经结束，”他说，“也许你会认为我们已达到巅峰。其实你绝不应该如此有信心。100
    年后的人回顾过去，认为我们今天的道德观很野蛮，这是完全合理的。”


    我注意到这里有一点讽刺。麦卡斯基尔是有效利他运动领导者之一，这一运动汇聚共识的广度令人印象深刻。对于长远未来的价值，对于减少文明灭绝风险的重要性，都达成了广泛共识。甚至对于哪些慈善机构做得最好也有广泛共识。例如，目前的共识是防治疟疾基金会（AMF）：当倍受尊敬的慈善评估机构
    GiveWell 在 2019 年初考虑如何分配 470 万美元的自由支配基金时，他们决定全部捐给 AMF。^(⁶⁵¹)


