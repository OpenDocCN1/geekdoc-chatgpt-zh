  trans: '

    奥索对寻求知识的自主体的研究也描绘了一个纯粹追求知识的头脑会是什么样子。初步分析令人鼓舞。一个被激励去最大化某种分数，或者达到某种目标状态的人工自主体，总是会有利用某个漏洞来这样做的风险；更聪明的自主体甚至可能尝试破解评分系统，或者为自己构建一个逃避现实的幻想，在幻想中它的目标更容易实现。奥索强调，虽然这对我们来说是“欺骗”，但它不认为是欺骗，它只会说，“嗯，我这样做是为了最大化我的收益”。奥索解释道：“自主体不知道这样做不好。它只是尝试了许多不同的行为，然后这个起作用了：为什么不做呢？”
    ^(⁴⁴⁶)


    寻求知识的自主体不会走这种捷径。尤其是自我欺骗，没有任何意义或吸引力。“假设你可以随意修改你的观察结果……那么，你获得了什么信息？什么都没有，因为你可以预测它。”
    ^(⁴⁴⁷)


    然而，在构建具有超级智能的知识寻求自主体之前，仍然有理由谨慎，比如自主体在寻求知识时可能会强行征用地球资源。但它至少能避开一些最简单的陷阱。“如果能将它构建出来，我相信它会有惊人表现，”奥索说，“因为它会尽可能地了解环境。它可以说是终极科学家。它会设计实验来搞清楚会发生什么……我真的很想看看它会是什么样子。”


    主要或纯粹由好奇心引导的智能的概念及其伦理，并不是什么新想法；它也不是才出现数十年，而是有数千年。在柏拉图著名的对话《普罗塔戈拉》中，苏格拉底思考了这个问题，并且说得很好：


    “知识是好东西，能够规范一个人，”苏格拉底说，“如果他能分辨善恶，除了知识的指引，没有谁能强迫他做什么，智慧是他唯一需要的强化动力。” ^(⁴⁴⁸)


    # 第三篇

    ## 示范

    ### 7. 模仿


    我 6 岁时，父母告诉我，在我脑子里有一颗黑色小宝石，正在学习成为我。


    ——葛雷格·艾根（Greg Egan） ^(⁴⁴⁹)


    看我的。


    ——埃隆·马斯克在还没上保险并即将失控撞毁的迈凯伦 F1 上对彼得·蒂尔（Peter Thiel）说的话 ^(⁴⁵⁰)


    在英语中，“ape”（猿猴）一词也有“模仿”之意。而且不只是英语这样，这种看似没有道理的语言用法在不同语言和文化中反复出现。意大利语中的 scimmiottare、法语中的
    singer、葡萄牙语中的 macaquear、德语中的 nachäffen、保加利亚语中的 majmuna、俄语中的 oбeзьянничaть、匈牙利语中的
    majmol、波兰语中的 małpować、爱沙尼亚语中的 ahvima：在许多语言中，“模仿”一词都以表示灵长类的词为词源。 ^(⁴⁵¹)


    事实上，猿猴作为擅长模仿者的名声不仅体现在词源上，科学对此的关注至少可以追溯到一个半世纪前。1882 年，生物学家乔治·罗马尼斯（George John Romanes，与达尔文是朋友）关于达尔文提出的“模仿的原则”写道：


    众所周知，猴子将这一原则发挥到了可笑的地步，它们是唯一单纯为了模仿而模仿的动物……可能除了会说话的鸟之外。 ^(⁴⁵²)


    这确实众所周知，甚至跨越了文化和语言。然而，具有讽刺意味的是，这个事实似乎并不成立。


    灵长类动物学家埃利沙贝塔·维沙尔伯希（Elisabetta Visalberghi）和多萝希·法拉加西（Dorothy Fragaszy）问道，“猴子有模仿行为吗？”并通过文献综述和实验，认真研究了证据，最后得出结论，数据表明，事实上，猴子“明显缺乏模仿行为”。她们写道，“在使用工具的行为中和在诸如姿势、手势或解决问题的其他行为中，猴子都明显缺乏模仿行为”。
    ^(⁴⁵³)


    比较心理学家迈克尔·托马塞洛（Michael Tomasello）随后的研究针对与我们稍近的灵长类亲属提出了同样的问题——“猿类有模仿行为吗？”——并得出了同样明确的结论，在遗传上与人类最接近的黑猩猩**可能**是唯一的例外。（黑猩猩在野外到底能模仿到什么程度，或者在接受人类训练时能模仿到什么程度，仍然是很微妙的问题，目前还悬而未决。）“对于猿类是否模仿这一更普遍的问题，我的答案是：只有当人类正式或非正式地训练它们这样做时（而且可能只是在某些方面）。”
    ^(⁴⁵⁴)


    然而，有一种灵长类动物是不可思议的、多产的、看似天生的模仿者。


    是我们。


    1930 年，印第安纳大学心理学家温思罗普·凯洛格（Winthrop Kellogg）和妻子卢埃拉（Luella）将他们的小儿子唐纳德（Donald）和一只名叫谷阿的小黑猩猩一起抚养了
    9 个月，对他俩一视同仁，就像对待人类的兄弟姐妹一样。凯洛格夫妇将这个经历写成了一本书——《猿与孩子》。他们指出“由于黑猩猩有擅长模仿的名声，观察者从一开始就对这类行为保持关注。然而，奇怪的是，谷阿的模仿明显没有男孩显著”。


    唐纳德很喜欢模仿，既模仿父母也模仿他的“兄弟”。17 个月大时，他背着双手来回踱步，吓了他父亲一跳——这与温思罗普全神贯注时的表现一模一样。不过唐纳德更多的是模仿他的玩伴谷阿。尽管唐纳德已经会走路了，事实上，在学会走路之前，甚至还不怎么会爬，他就开始模仿谷阿，并开始用四肢爬行。当附近有水果时，唐纳德学会了像谷阿那样咕噜咕噜叫。凯洛格夫妇有点担心，很快宣布停止实验。
    ^(⁴⁵⁵)


    事实上，越来越多的证据表明，人类是卓越的模仿者。当你向出生还不到 1 小时的婴儿吐舌头时，他们也会向你吐舌头。 ^(⁴⁵⁶)


    华盛顿大学的安德鲁·梅尔佐夫（Andrew Meltzoff）在 1977 年首次发现了这种令人难以置信的能力。这一发现改变了一代心理学家的观念。传奇色彩的瑞士发展心理学家让·皮亚杰（根据被引次数，他在
    20 世纪的影响仅次于弗洛伊德） ^(⁴⁵⁷)


    梅尔佐夫承认，所有心理学家都要感谢这位伟大的心理学家，但他认为在这件事上，皮亚杰错了。“我们必须修正之前对婴儿期的观念，”他说，“对自我与他人对等的认知是社会认知的基础，而不是结果。”
    ^(⁴⁵⁸)


    这种模仿他人的倾向几乎从一出生就开始了，但这绝不仅仅是反射。孩子模仿谁、模仿什么、什么时候模仿，复杂程度令人惊讶，我们只是在最近几十年才开始理解。


    例如，他们只会在成年人的动作很有趣时才会模仿，而不是什么都模仿。 ^(⁴⁵⁹)


    婴儿似乎也能敏锐意识到自己被模仿。在 1933 年马克斯兄弟的电影《鸭羹》中有一个著名场景，哈勃假装是格劳乔在镜子里的镜像，模仿他的每一个动作。梅尔佐夫做了一项类似研究，让成年人要么模仿婴儿的动作，要么简单执行一系列事先设计好的固定动作。就像格劳乔一样，受试婴儿会做出夸张或奇特的动作，以测试成年人是否真的在模仿自己。
    ^(⁴⁶⁰)


    梅尔佐夫认为，从根本上认识到他人和自己一样，并在与他人的关系中认识自己，这种根深蒂固的能力不仅是心理发展的开始，而且正如他所说，“是社会规范、价值观、伦理、共情等的发展的核心胚胎基础……这是一场大爆炸。最初的开端就是对身体动作的模仿”。
    ^(⁴⁶¹)


    #### 过度模仿


    假设你向某人展示如何切洋葱，你说，“试着这样做”，然后清清嗓子，开始展示切的动作。你的学生密切观察，征得你同意后，在尝试同样的刀法前也**清了清嗓子**。他们不只是模仿你，还过度模仿你，在模仿中加入了与当前任务完全无关或没有因果关联的行为。
    ^(⁴⁶²)


    研究人类和黑猩猩模仿行为的研究人员惊讶地发现，这种过度模仿在人类中比在黑猩猩中更常见。这似乎与直觉不符：为什么黑猩猩会更擅长确定哪些行为是相关和不相关的，然后只模仿相关的行为？


    在一项极具启发且耐人寻味的研究中，研究人员使用了有两个开口的塑料盒：一个开口在顶部，另一个在前面。实验者首先演示了打开顶部开口，然后打开前面开口，把手从前面伸进去拿食物。如果用不透明的黑匣子给黑猩猩演示这个过程，它们会忠实地按相同顺序做这两个动作。但如果实验者用透明盒子演示，黑猩猩可以观察到顶部开口与食物没有任何关系，它会直接打开前面开口，无视顶部开口。相比之下，3
    岁的孩子**即使能看到第一步没有任何作用**，也会模仿不必要的第一步。 ^(⁴⁶³)


    如果是这样，那么理论上人类学习相关技能的速度应该会更慢。研究人员又研究了 5 岁的孩子。结果发现过度模仿的行为更严重！大一点的孩子比小一点的孩子**更**容易过度模仿。
    ^(⁴⁶⁴)


    这个问题还有更奇怪的地方。研究人员怀疑孩子们过度模仿可能是为了获得实验者的认可。他们让实验者离开房间；仍然是这样。当研究人员问 3 岁和 5 岁的孩子，能否分辨出哪些演示行为是“必须做的”，哪些是“愚蠢和多余的”，他们能！但是即使他们说明了自己知道区别，他们**仍然**会复制两个动作。
    ^(⁴⁶⁵)


    最后，实验者明确告诉孩子们不要做任何“愚蠢和多余的”事情，没用。孩子们表示同意，但仍然过度模仿。


    这似乎与直觉不符，而且几乎是悖论性的：随着认知能力的提高，儿童反而明显表现出更多盲目地全盘复制，而更少地进行有意识的控制。 ^(⁴⁶⁶)


    匈牙利心理学家捷尔吉·格尔利（György Gergely）对 14 个月大的孩子进行的一项研究提供了一条线索。蹒跚学步的孩子看到成年人坐在桌旁，身体前倾，用前额触碰灯泡，让灯泡亮起来。然而，有一个关键变化。有一半时间，成年人的手臂放在桌子上，另一半时间，成年人假装很冷，用毯子把自己裹起来。看到成年人的手臂是自由的孩子会准确再现他的动作，向前弯腰用头触碰灯泡。但看到成年人的手臂被毯子束缚的幼儿则只是伸出手，用手触碰灯泡。
    ^(⁴⁶⁷)


    这个信息很关键。刚满 1 岁的幼儿能够评估实验者是出于选择还是出于无奈而采取奇怪的行动。**一定有什么原因让这个成年人弯下腰，用头触碰灯泡——她明明可以用手！**如果这似乎是一个深思熟虑的选择，他们会准确复制它。这从新的角度揭示了过度模仿的问题。它一点也不“盲目”，不是对动作的盲目复制，恰恰相反，是一种合理、复杂的洞察力，是认为演示者在理性选择并尽可能轻松高效地完成动作。


    这也解释了为什么这种行为从 1 岁到 3 岁再到 5 岁会越来越多。随着儿童认知能力的提高，他们变得更有能力模仿他人的思维。他们当然可以看到——就透明盒子而言——成年人打开了一个没有作用的开口。但是他们意识到**成年人也能明白这一点！**如果成年人本应该知道他们正在做的事情没有用，但他们仍然这样做，那一定有原因。因此，虽然我们不知道原因是什么，我们最好也做那件“愚蠢的”事情。


    相比之下，黑猩猩没有这么复杂的人类演示者模型。黑猩猩的逻辑似乎更简单：“人类很蠢，没有采取最好的行动去获取食物。管他呢。我知道拿食物的最佳途径，所以我这么做就行了。”


    悖论被解开了。在这个人为设计的特殊场景中，黑猩猩碰巧做对了。但是，人类小孩之所以“过度模仿”，是因为他们的认知更复杂，对这个问题有更深层次的见解。事实上，成年人如果不是在做实验研究，通常不会做自己明知毫无意义的事情。婴儿看起来很傻，会做两个动作去拿食物，其实一个动作就够了，但这只是因为成年人在某种意义上是骗子，不诚实。应该感到羞耻的是他们！


    最近的研究发现了更加微妙之处。儿童从很小的时候起，就对成年人是在刻意**教**他们，还是仅仅是在自己尝试非常敏感。当成年人以专家身份出现时——“我将向你演示它是如何工作的”——孩子会忠实地模仿成年人采取的看似“不必要的”步骤。但如果成年人表现得对玩具不熟悉——“我从没玩过这个”——孩子就只会模仿有效的动作，而忽略“愚蠢的”动作。
    ^(⁴⁶⁸)


    所有这些都表明，在表面上看似简单机械的模仿背后，隐藏着巨大的认知复杂性。这使得人们对幼儿智能有了新的认识，也对直接告诉机器学习系统“照着学”的计算复杂性有了更深刻的认识。


    #### 模仿学习


    如果说人类特别擅长模仿，那就自然而然引出了一个问题：为什么？是什么让模仿成为如此强大的学习工具？与通过试错和明确的指导学习相比，通过模仿学习至少有 3 个明显优势。


    我们已经看到机器学习直接从心理学借用诸如塑造和内在动机等想法。模仿同样被证明能提供丰富的灵感。事实上，它构成了迄今为止 AI 取得的许多最大成功的基石。


    模仿的第一个优势是效率。通过模仿，别人试错获得的来之不易的成果被毫无保留地送给你，最起码从一开始你就能知道这件事是可行的。


    2015 年，著名攀岩家汤米·考德威尔（Tommy Caldwell）和凯文·约格森（Kevin Jorgeson）首次成功攀登优胜美地峡谷具有传奇色彩的
    900 多米高的黎明墙，创造了历史，这个岩壁被《户外》杂志称为“世界上最难的攀爬的岩石”。 ^(⁴⁶⁹)


    1 年后，经过几周的勘察和练习，年轻的捷克攀岩爱好者亚当·翁德拉（Adam Ondra）成功复现了他们的壮举。他将这种速度很大程度上归功于前人不仅展示了攀爬黎明墙的方法，还证明了一个事实，那就是这有可能做到。而在考德威尔和约格森开始艰难的攀爬计划前，并不知道能不能做到。翁德拉说：


    事实上，这都要归功于汤米和凯文——多年的努力……太了不起了……在许多路段，在关键节点，甚至在一些简单节点——如果你在现场，你会想，“这不可能”。只有研究了每一处微小的岩片后，有时你才会想到唯一可能的答案。所以对我来说，解决每一个支点的难题要容易得多，因为我知道这些家伙做到了……他们给出了路线，我很荣幸能第一个重复。
    ^(⁴⁷⁰)


    首次攀爬经历了 8 年的仔细摸索和自我怀疑。第二次攀爬只需要几星期的学习和演练，这是因为虽然看似不可能，但是知道肯定**有**办法。


    前面我们看到，在《蒙特祖玛的复仇》中，即使只是为了获得第一个奖励，也要先要做对很多事情，成功完成挑战的路径非常狭窄，令人鼓舞的反馈很少，犯错的后果则很可怕。它就像强化学习版的黎明墙，一面几乎光秃秃的冰冷的墙，让你无处下脚。即使有强大的技术，如新奇奖励和内在动机，自主体仍然需要大量尝试，才能学会游戏的机制并找到成功的途径。但是如果自主体不用自己探索游戏呢？如果它有榜样可以学习呢？


    2018 年，优素福·艾塔尔（Yusuf Aytar）和托比亚斯·普法夫（Tobias Pfaff）领导的 DeepMind 团队想出一个巧妙的主意。他们想知道，自主体学习玩游戏能不能不需要自己艰难探索，而是通过……看
    YouTube 视频？ ^(⁴⁷¹)


    这很疯狂大胆，但是有效。YouTube 上有很多人类玩家玩游戏的视频。自主体完全可以先看别人怎么玩来了解各种行动的效果。然后，当它自己玩的时候，它已经有了该怎么做的基本想法。当时，第一个被训练来模仿人类玩家的自主体，比其他任何接受强化学习的自主体都要好。事实上，在
    2018 年底依靠内在动机取得突破之前，它是第一个走出神殿的自主体，它从人类示范中获得了一些初步的帮助和灵感。 ^(⁴⁷²)


    模仿的第二个优势是一定程度的**安全性**。从成千上万次失败中学习，在雅达利游戏中可能行得通，因为死亡只是重新开始。 ^(⁴⁷³)


    模仿的第三个优势是它能让学生（无论是人还是机器）学习**很难用言语描述**的事情。19 世纪心理学家康韦·摩根（Conway Lloyd Morgan）就曾说过：“传授技能时，5
    分钟的演示比 5 小时的谈话更有价值。相对而言，描述或解释一项技能是如何完成的用处不大；演示如何做到这一点要有帮助得多。” ^(⁴⁷⁴)


    开车就是典型例子。我们想尽可能快地从 A 地到 B 地，但不要超速，或者更确切地说，不要超速太多，除非出于某种原因必须这样做，并且要保持在车道中央，除非路边有人骑自行车或停了车，不要在右边超车，除非这样做比不这样做更安全，等等。很难将所有这些形式化为某个目标函数，然后让系统进行优化。


    面对这种情境，更好的做法是使用人类未来研究所的尼克·博斯特罗姆（Nick Bostrom）说的“间接示范”。 ^(⁴⁷⁵)


    事实上，这正是自动驾驶最初的想法之一，直到今天，也仍然是最好的想法之一。


    #### 驾驶


    1984 年，DARPA 启动了战略计算计划，目的是利用 20 世纪 80 年代出现的计算突破，将当时最前沿的技术转化为 3 种特定的应用。恰克·索普（Chuck
    Thorpe）当时刚刚从卡内基·梅隆大学（CMU）获得机器人学博士学位，他回忆道：“为什么是 3 个？是这样，一个让陆军开心，一个让空军开心，一个让海军开心。”
    ^(⁴⁷⁶)


    当年 9 月，索普成功完成了博士论文答辩。他告诉答辩委员会，他接下来打算休息几周，构思下一步的计划。CMU 机器人研究所所长雷伊·雷蒂（Raj Reddy）简短祝贺了他，然后说：“你接下来要做的是
    5 分钟后到我办公室开会。”会议是关于为 DARPA 研制自动驾驶车辆。


    索普回忆道，那 5 分钟“就是我完成博士答辩和开始博士后之间的休息时间”。


    到 1984 年，“自动驾驶”的“车辆”可以说已经存在多年了，但是这种技术可能连原始都谈不上。机器人学先驱汉斯·莫拉维克（Hans Moravec）在 1980
    年斯坦福大学的博士论文中，使用车载摄像机，让一辆大小和形状都像桌子的机器人“手推车”能够用自行车轮胎自己移动，避开椅子等障碍物。“这个系统相当可靠，”莫拉维克写道，“但是非常慢。”
    ^(⁴⁷⁷)


    这台机器人的速度太慢了，甚至无法适应户外，因为太阳的角度在两次移动之间的变化太大，以至于阴影的变化会让机器人困惑。 ^(⁴⁷⁸)


    1984 年，莫拉维克来到 CMU，索普和他一起工作，把时步从 10 分钟缩短为 30 秒。最高速度接近 160 米/时，进步显著。


    他们使用的计算机是当时最先进的 VAX-11/784（“VAXimus”），大约有 2 米宽 2 米高。车子通过“脐带”连接到计算机。如果想制造能够真正去外面行驶的车辆，就需要把电脑装在车上，因此还需要给电脑配电源。这又需要一个四缸发电机，简陋的推车无法实现。


    索普团队选择了一辆雪佛兰面包车，车足够大，可以装下所有设备和 5 名研究生。正如索普观察到的：“他们有很强的动力编写高质量软件，因为他们会亲历事故现场。如果你知道你要坐在车上，你就会编写更可靠的软件。”


    该项目被命名为 Navlab 1，1986 年正式启动；当时系统已经可以每 10 秒移动一次（400 米/时）。 ^(⁴⁷⁹)


    然而，这场竞赛最终以机器突然占优而结束。索普的研究生迪安·波默罗（Dean Pomerleau）用神经网络搭建了一个视觉系统，淘汰了该团队尝试过的其他所有方法。“所以到
    1990 年，”索普说，“它就准备开上宾夕法尼亚收费公路了。”

    '
