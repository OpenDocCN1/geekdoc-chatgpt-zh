    37.  用于确定深度网络中梯度更新的方法被称为“反向传播”；它本质上是微积分中的链式法则，虽然它需要可微分神经元，而不是麦卡洛克、皮茨和罗森布拉特所考虑的全有或全无神经元。公认推广该技术的工作是Rumelhart,
    Hinton&Williams，“Learning Internal Representations by Error Propaga-tion”，尽管反向传播有很长的历史，可以追溯到20世纪六七十年代，但在训练深度网络方面的重要进展在21世纪才相继出现。[↩](#fnref37)


