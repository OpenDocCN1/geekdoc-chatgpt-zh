    227. Ustun 等，“《睡眠呼吸暂停的临床预测模型》”。使用`SLIM`建立的模型已在医院部署，用于评估癫痫发作的风险，参见 Struck 等，“《脑电图基于的风险评分与住院患者癫痫发作概率的关联》”。↩


    228. 参见 Kobayashi&Kohshima，“《人眼的独特形态及其适应性意义》”，和 Tomasello 等，“《大猿与人类婴儿注视跟随中对头部与眼睛的依赖》”。↩


    229. 到底显著性该如何计算目前还是很活跃的研究领域。参见例如，Simonyan, Vedaldi, and Zisser-man，“《深入卷积网络》”；Smilkov
    等，“`Smoothgrad`”；Selvaraju 等，“`Grad-Cam`”；Sundararajan, Taly&Yan，“《深度网络的公理归因》”；Erhan
    等，“《可视化深度网络的高层特征》”；和 Dabkowski&Gal，“《黑箱分类器的实时图像显著性》”。强化学习背景下，基于雅克比和扰动的显著性的比较，参见
    Greydanus 等，“《可视化与理解 Atari 智能体》”。 关于显著性方法的局限和弱点，仍有许多问题有待研究。参见例如，Kindermans 等，“《显著性方法的（不可）可靠性》”；Adebayo
    等，“《显著性图的合理性检查》”；和 Ghorbani, Abi&Zou，“《神经网络的解释是脆弱的》”。↩


    230. 正如兰德克尔说的：“对数据集的进一步观察揭示，许多动物图像背景模糊，而非动物图像在所有位置都很清晰。图像中存在这种偏差是可以理解的，因为所有照片都是由专业摄影师拍摄的。贡献传播的结果展示了无意的偏见多么容易潜入数据集。”参见
    Landecker，“《计算机视觉中的可解释机器学习与稀疏编码》”，和 Landecker 等，“《分层网络个体分类的解释》”。另见对一个（人为的）例子的讨论，其中一个旨在区分狼和哈士奇的网络实际上主要区分的是图像背景中是雪还是草：Ribeiro,
    Singh&Guestrin，“《为什么我应该信任你？》”↩


