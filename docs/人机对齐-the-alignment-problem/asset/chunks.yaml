    190.  在一个总结出“如果患者患有哮喘，则是低风险的”的系统中，有一个明显的缺失，那就是因果关系模型。加州大学洛杉矶分校的朱迪亚·珀尔（Judea Pearl）是研究因果关系的重要计算机学家之一；关于他对在当代机器学习系统背景下的因果关系的最新思考，参见Pearl，“The
