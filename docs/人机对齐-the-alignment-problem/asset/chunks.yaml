- raw: '杜克大学计算机科学家辛西娅·鲁丁（Cynthia Rudin）可以说是道斯精神在21世纪的代表。简单是鲁丁的研究的核心驱动力之一。她不仅反对使用过于复杂的模型，而且对挑战简单模型的极限感兴趣。例如，在刑事司法领域，鲁丁和同事在2018年发表了一篇论文，给出了一个和COMPAS一样精确的累犯预测模型，该模型可以用一句话概括：“如果一个人有3次以上前科，或者是18到20岁的男性，或者是21到23岁的男性**并且**有至少2次前科，预测他们将会再次被捕；否则，不会。”
    ^([^(220)](#fn220))


    对鲁丁来说，道斯的研究既是激励，也是挑战。如此简单的模型，由手工选择的变量组成，性能与复杂模型相当，有时还更好，并且完全不输人类专家。但即便如此，还是留下了许多问题和研究方向。例如，如何从给定的数据集构建**最好的**简单模型，而不仅仅是**某一个**简单模型？


    令人惊讶的是，答案在近几年才出现。


    鲁丁着眼于21世纪医疗保健中当前正在使用的简单模型，并采取了与道斯不同且不那么乐观的观点。她没有将现有模型视为临床直觉的优秀替代品，而是认为模型过于**依赖**临床直觉。还有很多需要改进的地方。


    她举了男性冠心病评分表的例子。“如果你是男性，去看医生，他们会计算你10年内患冠心病的风险。他们会问你5个问题：年龄，胆固醇水平，是否吸烟，等等。你对每个问题的回答都会得到分数，然后把分数加起来，就是你10年内患冠心病的风险。”然后她加重了语气，“但是这5个问题是从哪里来的？他们又是如何打分的？答案是，**他们想出来的！**一个医生团队想出来的！这不是我想要的方式。我想构建一些可解释的东西，但我想根据数据来构建”。
    ^([^(221)](#fn221))


    然而，寻找**最优**的简单规则并不适合心脏问题。事实上，它需要解决一个难解问题或NP困难问题：问题复杂度很高，没有简单方法能保证获得最优答案。有数万份病历，每份病历都有数十甚至数百种属性：年龄、血压等。怎样才能找到最优的简单诊断流程？计算机科学家的工具包里有各种针对这类问题的方法，但是鲁丁认为现有的从大数据中构建简单规则列表和评分系统的算法——比如80年代开发的CART算法
    ^([^(222)](#fn222))


    鲁丁团队的目标是击败医学中最常用的模型之一：CHADS[2]。CHADS[2]是2001年开发的，2010年升级为CHA[2]DS[2]——VASc，用于预测房颤患者中风的风险。^([\[](#chapter4_0003.xhtml#chapter4_0003.xhtml_f44)[1](#chapter4_0003.xhtml#chapter4_0003.xhtml_f44)[\]](#chapter4_0003.xhtml#chapter4_0003.xhtml_f44))两者的设计由医生和研究人员基于数据集和临床知识密切合作，以找出他们认为最相关的因素。随后的研究证实了这些工具的预测能力。这两种模型尽管被普遍认为有效，并被发现有出乎意料的广泛用途，但在一定程度上仍然是“手工”打造。鲁丁希望通过**计算**找出最相关的因素，并将其组合成一个评分工具。


    与最初设计CHADS[2]时拥有的数据相比，鲁丁的数据要多6千多倍，她用算法（称为贝叶斯规则列表）研究了12000名患者的数据，每名患者大约有4100种属性（服用的药物，报告的各种健康状况），以构建尽可能好的评分系统。
    ^([^(223)](#fn223))


    结果显示相对CHADS[2]和CHA[2]DS[2]——VASc均有明显改善。更有意思的是，相对于更早的CHADS[2]，较新的CHA[2]DS[2]——VASc的准确性有显著**下降**。新模型似乎比旧模型**更糟**，至少从这个数据集来看是如此。正如鲁丁和同事在论文中微妙地指出的，这“突显了人工构建这些可解释模型的难度”。


    在随后的一个项目中，鲁丁和博士生伯克·乌斯顿（Berk Ustun）与麻省总医院合作开发了睡眠呼吸暂停评分系统。睡眠呼吸暂停影响到数千万美国人和全球一亿多人。
    ^([^(224)](#fn224))


    由于要求模型用纸也能演算，乌斯顿和鲁丁不得不尽量简化模型。只考虑非常少的显式特征，并且尽可能用很小的整系数。^([\[](#chapter4_0003.xhtml#chapter4_0003.xhtml_f47)[2](#chapter4_0003.xhtml#chapter4_0003.xhtml_f47)[\]](#chapter4_0003.xhtml#chapter4_0003.xhtml_f47))虽然已经是21世纪，也还是会有专家凭直觉构想各种模型。这有时被戏称为“纸上谈兵法”：一群人围坐在桌子旁讨论。即使已经有了机器学习建立的模型，通常也会人工对模型进行简化。
    ^([^(225)](#fn225))


    他们开发了一个名为SLIM的模型（“超稀疏线性整数模型”），不仅可以给出合理的试探法，还可以证明是在这些严格的约束条件下的最优决策方式。这个成果兼具理论和实践意义，对医学和机器学习都有好处。


    首先，与公认的观点和当前的实践相反，该模型表明，患者**症状**远不如其**病史**重要。乌斯顿和鲁丁根据病史——比如过去的心脏病发作、高血压等——训练的模型，比根据当前症状（比如打鼾、气喘和睡眠不佳）训练的模型预测能力更强。此外，向基于病史的模型**添加**症状并没有多大改善。严重的睡眠呼吸暂停如果不接受治疗，死亡风险要高3倍
    ^([^(226)](#fn226))


    其次，机器学习界取得了方法论的胜利，这个胜利可以移植到其他领域。“SLIM的准确度能与应用于该数据集的最先进分类模型相媲美，”乌斯顿和鲁丁的团队报告，“但得益于完全透明，用少量只需是/否答案的临床问询就能进行预测。”
    ^([^(227)](#fn227))


    正如鲁丁所说：“我想在设计预测模型时考虑到最终用户。我想设计这样的东西……不仅准确，还能用得上，让人们可以用来作决策。我想创建高度准确同时又高度可解释的预测模型，可以给出可信的决策。我的研究基于一个假设，即许多数据集都有非常小的预测模型，我相信它成立。这个假设不是我提出的，很多年前就有。但现在我们有了算力、新想法和新技术，让我们可以真正检验这一假设。”


    对于研究这些问题的研究人员来说，这是激动人心的时刻。依托人类专业知识的简单模型具有了惊人的竞争力。现代技术给了我们寻找**理想**简单模型的方法。


    尽管如此，在有些情况下，复杂是不可避免的；很显然存在这样一些模型，没有人类专家帮助它们将输入过滤成有意义且可管理的规模。有些模型需要处理的不是诸如“GRE分数”和“既往犯罪次数”之类已经抽象化的概念，而是原始的语言、听觉或视觉数据。一些医疗诊断工具可以接受人工输入，如“轻度发热”和“哮喘”，而其他工具输入的可能是X光或CT结果，需要对其进行解读。自动驾驶汽车必须直接处理雷达、激光雷达和图像数据。对于这类情况，我们别无选择，只能采用大规模、数百万参数的“黑箱”神经网络，它们本来就以难以解释著称。但虽然很难，我们也不是完全束手无策，这里是透明度问题另一个更广阔的领域。


    **显著性：机器学习的“眼白”**


    相对于其他大多数物种，人类拥有很大很明显的巩膜，也就是眼白。眼白会**暴露**我们的注意力，至少是凝视的方向。根据进化生物学家提出的“合作性眼睛假说”，这应该有某种好处，而不是缺陷：它很可能表明了这样一个事实，即合作对人类的生存非常重要，以至于分享关注点的好处大于失去一定程度的隐私或被故意诱导的风险。
    ^([^(228)](#fn228))


    因此，对我们来说，期望机器也具备类似的东西应该是可以理解的：不仅知道它们在想什么看什么，尤其还要知道它们在看哪里。


    在机器学习中这个想法被称为“显著性”：如果系统正在观察一幅图像并将其归为某个类别，那么在归类时，图像的某些部分可能比其他部分更重要或更值得关注。如果能用某种“热图”凸显这些关键部分，就有可能获得一些重要的诊断信息，作为一种合理性检验，确保系统在按我们预想的方式运行。
    ^([^(229)](#fn229))


    这种显著性方法在实践中经常让人惊讶，暴露了机器学习系统有多不直观。它们经常抓住训练数据中人类认为根本不相关的方面，而忽视人类关注的关键信息。


    2013年，波特兰州立大学的博士生威尔·兰德克尔（Will Landecker）在研究用于区分有动物和没有动物的场景照片的神经网络。他设计了一种方法，可以观察图像中哪些部分与最终的分类相关。他发现了一些奇怪的东西。在很多时候，网络更关注图片的背景而不是前景。仔细观察发现，动物照片的背景经常会很模糊（摄影师行话是“虚化”），面部聚焦清晰，背景巧妙失焦。相比之下，空旷的风景往往更清晰。事实上，他训练的根本不是动物探测器，而是虚化探测器。
    ^([^(230)](#fn230))


    2015年和2016年，皮肤科医生贾斯汀·柯（Justin Ko）和罗伯特·诺沃亚（Roberto Novoa）领导斯坦福医学院和工程学院的团队研发皮肤视觉诊断系统。当时视觉系统已发展到能区分数百种不同犬种，这给诺沃亚留下了深刻印象。“我想，”他说，“既然能对狗分类，对皮肤癌应该也可以。”
    ^([^(231)](#fn231))


    他们将训练好的系统与25名皮肤科医生进行了对比测试，性能超过了人类。他们2017年在《自然》杂志发表的论文被广泛引用。 ^([^(232)](#fn232))


    事实证明，这个系统不仅能帮助很难找到一流诊断专家的地区，而且对柯这样训练有素的专家也能提供参考。柯清楚记得，2017年4月17日，一名患者来找他，肩膀上有个看起来很滑稽的斑点。“我完全拿不准，”柯说，“感觉不太对劲，但是用皮肤镜观察时，没有任何特征提示我这是一个早期黑色素瘤。”尽管如此，他还是觉得不对劲。


    “所以我说，好吧，现在是显摆我的苹果手机的绝佳时机。”柯用各种角度和灯光拍摄了一系列照片，都输入网络。“结果相当惊人，”他说，“不管哪张照片，它的识别都很稳健，它坚定地认为是恶性病变。”柯对其进行了活检，并与皮肤病理专家进行了讨论。“她说，‘嘿，你知道吗？这真的很不错。这是一个非常早期的正在演变的黑色素瘤。我们在完全可治疗的阶段发现了它。”这个日期牢牢印在柯的脑海里。这是该网络首次产生临床影响。“而且，”他说，“我希望这不是孤例。”


    不过，完整的故事要更为复杂。次年，柯、诺沃亚和合作者一起向《皮肤病学研究学报》提交了一篇论文，敦促警惕过快将神经网络模型引入常规临床实践。


    他们认为，在此类模型被广泛应用于临床之前，需格外小心，并根据自己的经验用一个警示故事强调了他们的观点。他们使用的视觉系统很有可能将任何带有标尺的图像归类为癌症。为什么呢？因为恶性肿瘤的医学图像比健康皮肤的图像更可能包含标尺。“因此，算法无意中‘学到了’标尺标志着恶性。”
    ^([^(233)](#fn233))


    **告诉我一切：多任务网络**


    要让复杂的模型更透明更容易理解，最简单的方法之一是让它们输出**更多东西**。里奇·卡鲁阿纳在研究用神经网络预测医疗结果时，意识到这个网络不仅可以做单一预测，比如病人是否会死亡，还能给出其他各种预测：会住院多久，花多少钱，是否需要呼吸辅助，需要多少疗程的抗生素，等等。


    数据集中的这些附加信息在训练中作为模型的**输入**没什么用。学习根据患者的账单预测死亡风险不会在新患者到来时帮助你，因为这时肯定还**不知道**最终账单。但是，这些信息可以作为额外的**输出**，让训练模型提供的额外的信息来源。这种技术称为“多任务学习”。
    ^([^(234)](#fn234))


    “奇怪的是，这比训练它一次预测其中一件事可能还更容易，”卡鲁阿纳告诉我， ^([^(235)](#fn235))


    为了便于理解，他让我假想我因某种严重疾病入院，可能是肺炎。假设我能活下来，但得住1个月的院，要花50万美元。“这样我就会知道事情有点严重，”卡鲁阿纳说，“你有麻烦了。虽然不符合对‘可怕结果’的定性，但是我现在知道你病得很严重。”


    对于专为预测死亡风险构建的系统，我的病例如果作为训练数据，真实死亡风险为0，因为我活了下来，但这样显然丢失了一些信息。正如他所说的，我的病例是“一个相当高风险的0”。如果我的确是出于幸运，也许系统应该预测，比如说，像我这样的病例，死亡概率是80%，而不是0。训练时，让它在预测的同时给出更多输出，也许能推动系统给出更准确的评估。


    卡鲁阿纳逐渐意识到，这些“多任务”模型不仅在传统意义上具有更好的性能——训练更快，准确度更高——而且也更透明，更容易发现问题。如果像他在20世纪90年代建立的系统那样只预测病人的生死，你可能会发现它给出的预测不对劲，比如，哮喘患者比普通门诊病人更不可能死亡。但如果是多任务网络，可以根据数据预测各种信息，不仅仅是生死，还包括住院时间或费用，就更容易发现结果不对劲。例如，哮喘患者的死亡率虽然好于平均水平，但医疗费用却是天价。这样就更容易看出这些患者不是普通的“低风险”患者，不应该回家自己吃药，早上再打电话回来。


    在某些情况下，这些额外的输出通道还可以提供更重要的东西。一支由谷歌、谷歌的生命科学公司Verily和斯坦福医学院联合组成的团队在2017年和2018年也以谷歌的Inception v3网络为基础，训练对视网膜图像分类。
    ^([^(236)](#fn236))


    结果让他们很震惊。仅仅根据视网膜图像，网络就可以几乎完美地分辨患者的年龄和性别。


    团队中的医生不相信结果是真的。“你给别人看，”波普林说，“他们会对你说：‘你的模型一定有问题。’因为不可能这么准确地辨识……随着研究越来越深入，我们确定模型没问题。这的确是一个真实的辨识。”


    该团队尝试用显著性方法来揭示网络是**如何**运作的，至少揭示相关的特征是什么。结果发现，模型主要是通过观察血管判断年龄；通过观察黄斑和视盘判断性别。


    波普林说：“起初向医生展示结果时，他们会嘲笑你。他们不相信。但是，当你给他们看热图，显示它聚焦于视盘或者视盘周围的特征时，他们会说，‘哦，是的，这个我知道，当然能看出来。’通过显示模型在图像中用于判断的位置，它确实提升了信任度，而且对结果也提供了一定程度的检验。”


    该模型不仅实现了准确诊断，还为医学本身开拓了一条有趣的前进道路。多任务学习和显著性技术的结合向医学领域展示了，视网膜中存在被忽视的性别差异。不仅如此，它还指出了在哪里可以找到它们。


    换句话说，这些解释方法不仅能带来更好的医疗，它们也可能造就更好的医生。


    **打开盖子：特征可视化**


    我们已经看到，多任务网络如何通过额外的输出，为我们提供预测和判断的重要背景。显著性方法则给出了网络输入的背景，可以告诉我们模型在**看哪里**。但两者都没有告诉我们黑匣子里发生了什么——也就是说，模型到底**看到了什么。**


    自2012年AlexNet以来，机器学习的标志性突破是神经网络模型，它从杂乱的原始感知中学习：数百万个彩色像素。这些模型的参数不是几十个，而是**几千万**个，而这些参数所代表的东西很大程度上不可言喻：上层参数是低层阈值的总和，而低层参数本身又是更低层阈值的总和，一直追溯到数百万个原始像素。从这样的原始信息无法给出可理解的解释。


    那么该怎么办呢？


    纽约大学的博士生马修·泽勒（Matthew Zeiler）和导师罗布·弗格斯（Rob Fergus）聚集于这个问题。他们认为，这些庞大的、令人困惑的模型的成功不可否认。“然而，”他们写道，“人们并不清楚它们为什么表现得这么好，或者如何才能提高……从科学角度来看，这完全无法让人满意。”
    ^([^(237)](#fn237))


    人们知道卷积网络的最底层代表一些基本的东西：垂直边，水平边，对角边，强烈的单一颜色，或者简单的梯度。大家也知道，这些网络最终的输出层是类别标签：猫、狗、汽车等等。但人们并不完全知道如何解读位于这两者之间的层。


    泽勒和弗格斯开发了一种可视化技术，他们称之为“反卷积”，可以将网络的中间层激活重新转换成图像。 ^([^(238)](#fn238))


    他们第一次**看到**了第二层。这是一个各种形状的大杂烩。“平行线、曲线、圆、T形结、梯度图案、彩色斑点：第二层有各种结构。”第三层甚至更复杂，开始代表物体的组成部分：看起来像面部、眼球、纹理、重复图样的东西。它已经探测到了一些东西，比如云的白色绒毛，书架的多色条纹，或者绿色的草丛。到了第四层，网络开始对眼睛和鼻子的形状、瓷砖地板、海星或蜘蛛的放射状几何形状、花瓣或打字机的按键做出反应。到了第五层，物体被映射到的最终类别似乎施加了很强的影响。


    效果很明显，也很深刻。但是它**有用**吗？泽勒打开了2012年赢得ImageNet竞赛的AlexNet模型的盖子，使用反卷积对其进行探查。他发现了许多缺陷。网络的一些低层部分被不正确地归一化，就像曝光过度的照片。还有一些过滤器已经“死了”，没有检测到任何东西。泽勒猜测，它们对应的尺度不适合它们试图匹配的模式类型。尽管AlexNet取得了惊人成功，但它仍有一些死角，可以继续改进，可视化技术能揭示死角**在哪里**。


    2013年秋天，在几个月连轴转后，泽勒获得了博士学位，离开了纽约大学，创办了自己的公司——Clarifai（清澈），并参加了当年的ImageNet竞赛，他赢了。
    ^([^(239)](#fn239))


    其他小组也在同时进行或跟进研究直接可视化神经网络的方法。2015年，谷歌工程师亚历山大·莫尔文采夫（Alexander Mordvintsev）、克里斯托弗·奥拉（Christopher Olah）和迈克·泰卡（Mike Tyka）提出一种方法，从随机噪点图开始，逐步调整像素，以最大化网络为其分配特定标签的可能性，比如“香蕉”或“叉子”。
    ^([^(240)](#fn240))


    它是艺术恶作剧的沃土，本身就是一种新颖的视觉艺术。谷歌的工程师进一步拓展了这个想法：不再人工指定类别标签然后从噪点开始，而是从一幅真实图像开始，比如云或树叶，逐步调整图像，放大网络中碰巧最活跃的神经元。正如他们写的，“这样就形成了正反馈回路：如果云看起来有点像鸟，网络会让它更像鸟。这反过来又会使网络在下一次处理时更强烈地识别出鸟，如此反复，直到变成一只栩栩如生的鸟，不知从哪里冒出来的”。他们称这种生成幻觉的方法为“深度梦境”。
    ^([^(241)](#fn241))


    还存在更奇怪的可能。雅虎的视觉团队开发了一个用于检测上传的图像是否色情的模型，加州大学戴维斯分校的博士生加布里埃尔·吴（Gabriel Goh）使用这种生成性方法将噪点图**最大化**调整成网络认为“工作场所不宜观看”的图。结果就像色情版的萨瓦尔多·达利（Salvador Dalí）。如果你针对色情过滤器和常规ImageNet类别标签——例如火山——的某种**组合**进行优化，你会得到色情的地理图景：看起来像巨大阴茎的花岗岩，喷出火山灰云。无论是好是坏，这样的图像肯定让人印象深刻。
    ^([^(242)](#fn242))'
  fmt: '

    # 可解释机器学习：简单模型与透明度


    ## 道斯精神的当代代表


    杜克大学计算机科学家辛西娅·鲁丁（Cynthia Rudin）可以说是道斯精神在21世纪的代表。简单是鲁丁的研究的核心驱动力之一。她不仅反对使用过于复杂的模型，而且对挑战简单模型的极限感兴趣。例如，在刑事司法领域，鲁丁和同事在2018年发表了一篇论文，给出了一个和`COMPAS`一样精确的累犯预测模型，该模型可以用一句话概括：“如果一个人有3次以上前科，或者是18到20岁的男性，或者是21到23岁的男性**并且**有至少2次前科，预测他们将会再次被捕；否则，不会。”
    ^([^(220)](#fn220))


    对鲁丁来说，道斯的研究既是激励，也是挑战。如此简单的模型，由手工选择的变量组成，性能与复杂模型相当，有时还更好，并且完全不输人类专家。但即便如此，还是留下了许多问题和研究方向。例如，如何从给定的数据集构建**最好的**简单模型，而不仅仅是**某一个**简单模型？


    令人惊讶的是，答案在近几年才出现。


    ## 简单模型在医疗保健中的反思


    鲁丁着眼于21世纪医疗保健中当前正在使用的简单模型，并采取了与道斯不同且不那么乐观的观点。她没有将现有模型视为临床直觉的优秀替代品，而是认为模型过于**依赖**临床直觉。还有很多需要改进的地方。


    她举了男性冠心病评分表的例子。“如果你是男性，去看医生，他们会计算你10年内患冠心病的风险。他们会问你5个问题：年龄，胆固醇水平，是否吸烟，等等。你对每个问题的回答都会得到分数，然后把分数加起来，就是你10年内患冠心病的风险。”然后她加重了语气，“但是这5个问题是从哪里来的？他们又是如何打分的？答案是，**他们想出来的！**一个医生团队想出来的！这不是我想要的方式。我想构建一些可解释的东西，但我想根据数据来构建”。
    ^([^(221)](#fn221))


    然而，寻找**最优**的简单规则并不适合心脏问题。事实上，它需要解决一个难解问题或`NP`困难问题：问题复杂度很高，没有简单方法能保证获得最优答案。有数万份病历，每份病历都有数十甚至数百种属性：年龄、血压等。怎样才能找到最优的简单诊断流程？计算机科学家的工具包里有各种针对这类问题的方法，但是鲁丁认为现有的从大数据中构建简单规则列表和评分系统的算法——比如80年代开发的`CART`算法
    ^([^(222)](#fn222))


    ### CHADS2 与 CHA2DS2-VASc 的改进


    鲁丁团队的目标是击败医学中最常用的模型之一：`CHADS[2]`。`CHADS[2]`是2001年开发的，2010年升级为`CHA[2]DS[2]——VASc`，用于预测房颤患者中风的风险。^([\[](#chapter4_0003.xhtml#chapter4_0003.xhtml_f44)[1](#chapter4_0003.xhtml#chapter4_0003.xhtml_f44)[\]](#chapter4_0003.xhtml#chapter4_0003.xhtml_f44))两者的设计由医生和研究人员基于数据集和临床知识密切合作，以找出他们认为最相关的因素。随后的研究证实了这些工具的预测能力。这两种模型尽管被普遍认为有效，并被发现有出乎意料的广泛用途，但在一定程度上仍然是“手工”打造。鲁丁希望通过**计算**找出最相关的因素，并将其组合成一个评分工具。


    与最初设计`CHADS[2]`时拥有的数据相比，鲁丁的数据要多6千多倍，她用算法（称为`贝叶斯规则列表`）研究了12000名患者的数据，每名患者大约有4100种属性（服用的药物，报告的各种健康状况），以构建尽可能好的评分系统。
    ^([^(223)](#fn223))


    结果显示相对`CHADS[2]`和`CHA[2]DS[2]——VASc`均有明显改善。更有意思的是，相对于更早的`CHADS[2]`，较新的`CHA[2]DS[2]——VASc`的准确性有显著**下降**。新模型似乎比旧模型**更糟**，至少从这个数据集来看是如此。正如鲁丁和同事在论文中微妙地指出的，这“突显了人工构建这些可解释模型的难度”。


    ### SLIM 模型与睡眠呼吸暂停


    在随后的一个项目中，鲁丁和博士生伯克·乌斯顿（Berk Ustun）与麻省总医院合作开发了睡眠呼吸暂停评分系统。睡眠呼吸暂停影响到数千万美国人和全球一亿多人。
    ^([^(224)](#fn224))


    由于要求模型用纸也能演算，乌斯顿和鲁丁不得不尽量简化模型。只考虑非常少的显式特征，并且尽可能用很小的整系数。^([\[](#chapter4_0003.xhtml#chapter4_0003.xhtml_f47)[2](#chapter4_0003.xhtml#chapter4_0003.xhtml_f47)[\]](#chapter4_0003.xhtml#chapter4_0003.xhtml_f47))虽然已经是21世纪，也还是会有专家凭直觉构想各种模型。这有时被戏称为“纸上谈兵法”：一群人围坐在桌子旁讨论。即使已经有了机器学习建立的模型，通常也会人工对模型进行简化。
    ^([^(225)](#fn225))


    他们开发了一个名为`SLIM`的模型（“超稀疏线性整数模型”），不仅可以给出合理的试探法，还可以证明是在这些严格的约束条件下的最优决策方式。这个成果兼具理论和实践意义，对医学和机器学习都有好处。


    首先，与公认的观点和当前的实践相反，该模型表明，患者**症状**远不如其**病史**重要。乌斯顿和鲁丁根据病史——比如过去的心脏病发作、高血压等——训练的模型，比根据当前症状（比如打鼾、气喘和睡眠不佳）训练的模型预测能力更强。此外，向基于病史的模型**添加**症状并没有多大改善。严重的睡眠呼吸暂停如果不接受治疗，死亡风险要高3倍
    ^([^(226)](#fn226))


    其次，机器学习界取得了方法论的胜利，这个胜利可以移植到其他领域。“`SLIM`的准确度能与应用于该数据集的最先进分类模型相媲美，”乌斯顿和鲁丁的团队报告，“但得益于完全透明，用少量只需是/否答案的临床问询就能进行预测。”
    ^([^(227)](#fn227))


    正如鲁丁所说：“我想在设计预测模型时考虑到最终用户。我想设计这样的东西……不仅准确，还能用得上，让人们可以用来作决策。我想创建高度准确同时又高度可解释的预测模型，可以给出可信的决策。我的研究基于一个假设，即许多数据集都有非常小的预测模型，我相信它成立。这个假设不是我提出的，很多年前就有。但现在我们有了算力、新想法和新技术，让我们可以真正检验这一假设。”


    对于研究这些问题的研究人员来说，这是激动人心的时刻。依托人类专业知识的简单模型具有了惊人的竞争力。现代技术给了我们寻找**理想**简单模型的方法。


    尽管如此，在有些情况下，复杂是不可避免的；很显然存在这样一些模型，没有人类专家帮助它们将输入过滤成有意义且可管理的规模。有些模型需要处理的不是诸如“GRE分数”和“既往犯罪次数”之类已经抽象化的概念，而是原始的语言、听觉或视觉数据。一些医疗诊断工具可以接受人工输入，如“轻度发热”和“哮喘”，而其他工具输入的可能是X光或CT结果，需要对其进行解读。自动驾驶汽车必须直接处理雷达、激光雷达和图像数据。对于这类情况，我们别无选择，只能采用大规模、数百万参数的“黑箱”神经网络，它们本来就以难以解释著称。但虽然很难，我们也不是完全束手无策，这里是透明度问题另一个更广阔的领域。


    ## 模型透明度的新视角


    ### 显著性：机器学习的“眼白”


    相对于其他大多数物种，人类拥有很大很明显的巩膜，也就是眼白。眼白会**暴露**我们的注意力，至少是凝视的方向。根据进化生物学家提出的“合作性眼睛假说”，这应该有某种好处，而不是缺陷：它很可能表明了这样一个事实，即合作对人类的生存非常重要，以至于分享关注点的好处大于失去一定程度的隐私或被故意诱导的风险。
    ^([^(228)](#fn228))


    因此，对我们来说，期望机器也具备类似的东西应该是可以理解的：不仅知道它们在想什么看什么，尤其还要知道它们在看哪里。


    在机器学习中这个想法被称为“`显著性`”：如果系统正在观察一幅图像并将其归为某个类别，那么在归类时，图像的某些部分可能比其他部分更重要或更值得关注。如果能用某种“热图”凸显这些关键部分，就有可能获得一些重要的诊断信息，作为一种合理性检验，确保系统在按我们预想的方式运行。
    ^([^(229)](#fn229))


    这种显著性方法在实践中经常让人惊讶，暴露了机器学习系统有多不直观。它们经常抓住训练数据中人类认为根本不相关的方面，而忽视人类关注的关键信息。


    2013年，波特兰州立大学的博士生威尔·兰德克尔（Will Landecker）在研究用于区分有动物和没有动物的场景照片的神经网络。他设计了一种方法，可以观察图像中哪些部分与最终的分类相关。他发现了一些奇怪的东西。在很多时候，网络更关注图片的背景而不是前景。仔细观察发现，动物照片的背景经常会很模糊（摄影师行话是“虚化”），面部聚焦清晰，背景巧妙失焦。相比之下，空旷的风景往往更清晰。事实上，他训练的根本不是动物探测器，而是虚化探测器。
    ^([^(230)](#fn230))


    2015年和2016年，皮肤科医生贾斯汀·柯（Justin Ko）和罗伯特·诺沃亚（Roberto Novoa）领导斯坦福医学院和工程学院的团队研发皮肤视觉诊断系统。当时视觉系统已发展到能区分数百种不同犬种，这给诺沃亚留下了深刻印象。“我想，”他说，“既然能对狗分类，对皮肤癌应该也可以。”
    ^([^(231)](#fn231))


    他们将训练好的系统与25名皮肤科医生进行了对比测试，性能超过了人类。他们2017年在《自然》杂志发表的论文被广泛引用。 ^([^(232)](#fn232))


    事实证明，这个系统不仅能帮助很难找到一流诊断专家的地区，而且对柯这样训练有素的专家也能提供参考。柯清楚记得，2017年4月17日，一名患者来找他，肩膀上有个看起来很滑稽的斑点。“我完全拿不准，”柯说，“感觉不太对劲，但是用皮肤镜观察时，没有任何特征提示我这是一个早期黑色素瘤。”尽管如此，他还是觉得不对劲。


    “所以我说，好吧，现在是显摆我的苹果手机的绝佳时机。”柯用各种角度和灯光拍摄了一系列照片，都输入网络。“结果相当惊人，”他说，“不管哪张照片，它的识别都很稳健，它坚定地认为是恶性病变。”柯对其进行了活检，并与皮肤病理专家进行了讨论。“她说，‘嘿，你知道吗？这真的很不错。这是一个非常早期的正在演变的黑色素瘤。我们在完全可治疗的阶段发现了它。”这个日期牢牢印在柯的脑海里。这是该网络首次产生临床影响。“而且，”他说，“我希望这不是孤例。”


    不过，完整的故事要更为复杂。次年，柯、诺沃亚和合作者一起向《皮肤病学研究学报》提交了一篇论文，敦促警惕过快将神经网络模型引入常规临床实践。


    他们认为，在此类模型被广泛应用于临床之前，需格外小心，并根据自己的经验用一个警示故事强调了他们的观点。他们使用的视觉系统很有可能将任何带有标尺的图像归类为癌症。为什么呢？因为恶性肿瘤的医学图像比健康皮肤的图像更可能包含标尺。“因此，算法无意中‘学到了’标尺标志着恶性。”
    ^([^(233)](#fn233))


    ### 告诉我一切：多任务网络


    要让复杂的模型更透明更容易理解，最简单的方法之一是让它们输出**更多东西**。里奇·卡鲁阿纳在研究用神经网络预测医疗结果时，意识到这个网络不仅可以做单一预测，比如病人是否会死亡，还能给出其他各种预测：会住院多久，花多少钱，是否需要呼吸辅助，需要多少疗程的抗生素，等等。


    数据集中的这些附加信息在训练中作为模型的**输入**没什么用。学习根据患者的账单预测死亡风险不会在新患者到来时帮助你，因为这时肯定还**不知道**最终账单。但是，这些信息可以作为额外的**输出**，让训练模型提供的额外的信息来源。这种技术称为“`多任务学习`”。
    ^([^(234)](#fn234))


    “奇怪的是，这比训练它一次预测其中一件事可能还更容易，”卡鲁阿纳告诉我， ^([^(235)](#fn235))


    为了便于理解，他让我假想我因某种严重疾病入院，可能是肺炎。假设我能活下来，但得住1个月的院，要花50万美元。“这样我就会知道事情有点严重，”卡鲁阿纳说，“你有麻烦了。虽然不符合对‘可怕结果’的定性，但是我现在知道你病得很严重。”


    对于专为预测死亡风险构建的系统，我的病例如果作为训练数据，真实死亡风险为0，因为我活了下来，但这样显然丢失了一些信息。正如他所说的，我的病例是“一个相当高风险的0”。如果我的确是出于幸运，也许系统应该预测，比如说，像我这样的病例，死亡概率是80%，而不是0。训练时，让它在预测的同时给出更多输出，也许能推动系统给出更准确的评估。


    卡鲁阿纳逐渐意识到，这些“多任务”模型不仅在传统意义上具有更好的性能——训练更快，准确度更高——而且也更透明，更容易发现问题。如果像他在20世纪90年代建立的系统那样只预测病人的生死，你可能会发现它给出的预测不对劲，比如，哮喘患者比普通门诊病人更不可能死亡。但如果是多任务网络，可以根据数据预测各种信息，不仅仅是生死，还包括住院时间或费用，就更容易发现结果不对劲。例如，哮喘患者的死亡率虽然好于平均水平，但医疗费用却是天价。这样就更容易看出这些患者不是普通的“低风险”患者，不应该回家自己吃药，早上再打电话回来。


    在某些情况下，这些额外的输出通道还可以提供更重要的东西。一支由谷歌、谷歌的生命科学公司Verily和斯坦福医学院联合组成的团队在2017年和2018年也以谷歌的`Inception
    v3`网络为基础，训练对视网膜图像分类。 ^([^(236)](#fn236))


    结果让他们很震惊。仅仅根据视网膜图像，网络就可以几乎完美地分辨患者的年龄和性别。


    团队中的医生不相信结果是真的。“你给别人看，”波普林说，“他们会对你说：‘你的模型一定有问题。’因为不可能这么准确地辨识……随着研究越来越深入，我们确定模型没问题。这的确是一个真实的辨识。”


    该团队尝试用显著性方法来揭示网络是**如何**运作的，至少揭示相关的特征是什么。结果发现，模型主要是通过观察血管判断年龄；通过观察黄斑和视盘判断性别。


    波普林说：“起初向医生展示结果时，他们会嘲笑你。他们不相信。但是，当你给他们看热图，显示它聚焦于视盘或者视盘周围的特征时，他们会说，‘哦，是的，这个我知道，当然能看出来。’通过显示模型在图像中用于判断的位置，它确实提升了信任度，而且对结果也提供了一定程度的检验。”


    该模型不仅实现了准确诊断，还为医学本身开拓了一条有趣的前进道路。`多任务学习`和显著性技术的结合向医学领域展示了，视网膜中存在被忽视的性别差异。不仅如此，它还指出了在哪里可以找到它们。


    换句话说，这些解释方法不仅能带来更好的医疗，它们也可能造就更好的医生。


    ### 打开盖子：特征可视化


    我们已经看到，多任务网络如何通过额外的输出，为我们提供预测和判断的重要背景。显著性方法则给出了网络输入的背景，可以告诉我们模型在**看哪里**。但两者都没有告诉我们黑匣子里发生了什么——也就是说，模型到底**看到了什么。**


    自2012年`AlexNet`以来，机器学习的标志性突破是神经网络模型，它从杂乱的原始感知中学习：数百万个彩色像素。这些模型的参数不是几十个，而是**几千万**个，而这些参数所代表的东西很大程度上不可言喻：上层参数是低层阈值的总和，而低层参数本身又是更低层阈值的总和，一直追溯到数百万个原始像素。从这样的原始信息无法给出可理解的解释。


    那么该怎么办呢？


    纽约大学的博士生马修·泽勒（Matthew Zeiler）和导师罗布·弗格斯（Rob Fergus）聚集于这个问题。他们认为，这些庞大的、令人困惑的模型的成功不可否认。“然而，”他们写道，“人们并不清楚它们为什么表现得这么好，或者如何才能提高……从科学角度来看，这完全无法让人满意。”
    ^([^(237)](#fn237))


    人们知道卷积网络的最底层代表一些基本的东西：垂直边，水平边，对角边，强烈的单一颜色，或者简单的梯度。大家也知道，这些网络最终的输出层是类别标签：猫、狗，汽车等等。但人们并不完全知道如何解读位于这两者之间的层。


    泽勒和弗格斯开发了一种可视化技术，他们称之为“`反卷积`”，可以将网络的中间层激活重新转换成图像。 ^([^(238)](#fn238))


    他们第一次**看到**了第二层。这是一个各种形状的大杂烩。“平行线、曲线、圆、T形结、梯度图案、彩色斑点：第二层有各种结构。”第三层甚至更复杂，开始代表物体的组成部分：看起来像面部、眼球、纹理、重复图样的东西。它已经探测到了一些东西，比如云的白色绒毛，书架的多色条纹，或者绿色的草丛。到了第四层，网络开始对眼睛和鼻子的形状、瓷砖地板、海星或蜘蛛的放射状几何形状、花瓣或打字机的按键做出反应。到了第五层，物体被映射到的最终类别似乎施加了很强的影响。


    效果很明显，也很深刻。但是它**有用**吗？泽勒打开了2012年赢得`ImageNet`竞赛的`AlexNet`模型的盖子，使用反卷积对其进行探查。他发现了许多缺陷。网络的一些低层部分被不正确地归一化，就像曝光过度的照片。还有一些过滤器已经“死了”，没有检测到任何东西。泽勒猜测，它们对应的尺度不适合它们试图匹配的模式类型。尽管`AlexNet`取得了惊人成功，但它仍有一些死角，可以继续改进，可视化技术能揭示死角**在哪里**。


    2013年秋天，在几个月连轴转后，泽勒获得了博士学位，离开了纽约大学，创办了自己的公司——`Clarifai`（清澈），并参加了当年的`ImageNet`竞赛，他赢了。
    ^([^(239)](#fn239))


    其他小组也在同时进行或跟进研究直接可视化神经网络的方法。2015年，谷歌工程师亚历山大·莫尔文采夫（Alexander Mordvintsev）、克里斯托弗·奥拉（Christopher
    Olah）和迈克·泰卡（Mike Tyka）提出一种方法，从随机噪点图开始，逐步调整像素，以最大化网络为其分配特定标签的可能性，比如“香蕉”或“叉子”。 ^([^(240)](#fn240))


    它是艺术恶作剧的沃土，本身就是一种新颖的视觉艺术。谷歌的工程师进一步拓展了这个想法：不再人工指定类别标签然后从噪点开始，而是从一幅真实图像开始，比如云或树叶，逐步调整图像，放大网络中碰巧最活跃的神经元。正如他们写的，“这样就形成了正反馈回路：如果云看起来有点像鸟，网络会让它更像鸟。这反过来又会使网络在下一次处理时更强烈地识别出鸟，如此反复，直到变成一只栩栩如生的鸟，不知从哪里冒出来的”。他们称这种生成幻觉的方法为“`深度梦境`”。
    ^([^(241)](#fn241))


    还存在更奇怪的可能。雅虎的视觉团队开发了一个用于检测上传的图像是否色情的模型，加州大学戴维斯分校的博士生加布里埃尔·吴（Gabriel Goh）使用这种生成性方法将噪点图**最大化**调整成网络认为“工作场所不宜观看”的图。结果就像色情版的萨瓦尔多·达利（Salvador
    Dalí）。如果你针对色情过滤器和常规`ImageNet`类别标签——例如火山——的某种**组合**进行优化，你会得到色情的地理图景：看起来像巨大阴茎的花岗岩，喷出火山灰云。无论是好是坏，这样的图像肯定让人印象深刻。
    ^([^(242)](#fn242))

    '
  trans: '


    # 可解释机器学习：简单模型与透明度


    ## 道斯精神的当代代表


    杜克大学计算机科学家辛西娅·鲁丁（Cynthia Rudin）可以说是道斯精神在 21 世纪的代表。简单是鲁丁的研究的核心驱动力之一。她不仅反对使用过于复杂的模型，而且对挑战简单模型的极限感兴趣。例如，在刑事司法领域，鲁丁和同事在
    2018 年发表了一篇论文，给出了一个和`COMPAS`一样精确的累犯预测模型，该模型可以用一句话概括：“如果一个人有 3 次以上前科，或者是 18 到 20
    岁的男性，或者是 21 到 23 岁的男性**并且**有至少 2 次前科，预测他们将会再次被捕；否则，不会。” ^(²²⁰)


    对鲁丁来说，道斯的研究既是激励，也是挑战。如此简单的模型，由手工选择的变量组成，性能与复杂模型相当，有时还更好，并且完全不输人类专家。但即便如此，还是留下了许多问题和研究方向。例如，如何从给定的数据集构建**最好的**简单模型，而不仅仅是**某一个**简单模型？


    令人惊讶的是，答案在近几年才出现。


    ## 简单模型在医疗保健中的反思


    鲁丁着眼于 21 世纪医疗保健中当前正在使用的简单模型，并采取了与道斯不同且不那么乐观的观点。她没有将现有模型视为临床直觉的优秀替代品，而是认为模型过于**依赖**临床直觉。还有很多需要改进的地方。


    她举了男性冠心病评分表的例子。“如果你是男性，去看医生，他们会计算你 10 年内患冠心病的风险。他们会问你 5 个问题：年龄，胆固醇水平，是否吸烟，等等。你对每个问题的回答都会得到分数，然后把分数加起来，就是你
    10 年内患冠心病的风险。”然后她加重了语气，“但是这 5 个问题是从哪里来的？他们又是如何打分的？答案是，**他们想出来的！**一个医生团队想出来的！这不是我想要的方式。我想构建一些可解释的东西，但我想根据数据来构建”。
    ^(²²¹)


    然而，寻找**最优**的简单规则并不适合心脏问题。事实上，它需要解决一个难解问题或`NP`困难问题：问题复杂度很高，没有简单方法能保证获得最优答案。有数万份病历，每份病历都有数十甚至数百种属性：年龄、血压等。怎样才能找到最优的简单诊断流程？计算机科学家的工具包里有各种针对这类问题的方法，但是鲁丁认为现有的从大数据中构建简单规则列表和评分系统的算法——比如
    80 年代开发的`CART`算法 ^(²²²)


    ### CHADS2 与 CHA2DS2-VASc 的改进


    鲁丁团队的目标是击败医学中最常用的模型之一：`CHADS[2]`。`CHADS[2]`是 2001 年开发的，2010 年升级为`CHA[2]DS[2]——VASc`，用于预测房颤患者中风的风险。^(\[1[\]](#chapter4_0003.xhtml#chapter4_0003.xhtml_f44))两者的设计由医生和研究人员基于数据集和临床知识密切合作，以找出他们认为最相关的因素。随后的研究证实了这些工具的预测能力。这两种模型尽管被普遍认为有效，并被发现有出乎意料的广泛用途，但在一定程度上仍然是“手工”打造。鲁丁希望通过**计算**找出最相关的因素，并将其组合成一个评分工具。


    与最初设计`CHADS[2]`时拥有的数据相比，鲁丁的数据要多 6 千多倍，她用算法（称为`贝叶斯规则列表`）研究了 12000 名患者的数据，每名患者大约有
    4100 种属性（服用的药物，报告的各种健康状况），以构建尽可能好的评分系统。 ^(²²³)


    结果显示相对`CHADS[2]`和`CHA[2]DS[2]——VASc`均有明显改善。更有意思的是，相对于更早的`CHADS[2]`，较新的`CHA[2]DS[2]——VASc`的准确性有显著**下降**。新模型似乎比旧模型**更糟**，至少从这个数据集来看是如此。正如鲁丁和同事在论文中微妙地指出的，这“突显了人工构建这些可解释模型的难度”。


    ### SLIM 模型与睡眠呼吸暂停


    在随后的一个项目中，鲁丁和博士生伯克·乌斯顿（Berk Ustun）与麻省总医院合作开发了睡眠呼吸暂停评分系统。睡眠呼吸暂停影响到数千万美国人和全球一亿多人。
    ^(²²⁴)


    由于要求模型用纸也能演算，乌斯顿和鲁丁不得不尽量简化模型。只考虑非常少的显式特征，并且尽可能用很小的整系数。^(\[2[\]](#chapter4_0003.xhtml#chapter4_0003.xhtml_f47))虽然已经是
    21 世纪，也还是会有专家凭直觉构想各种模型。这有时被戏称为“纸上谈兵法”：一群人围坐在桌子旁讨论。即使已经有了机器学习建立的模型，通常也会人工对模型进行简化。
    ^(²²⁵)


    他们开发了一个名为`SLIM`的模型（“超稀疏线性整数模型”），不仅可以给出合理的试探法，还可以证明是在这些严格的约束条件下的最优决策方式。这个成果兼具理论和实践意义，对医学和机器学习都有好处。


    首先，与公认的观点和当前的实践相反，该模型表明，患者**症状**远不如其**病史**重要。乌斯顿和鲁丁根据病史——比如过去的心脏病发作、高血压等——训练的模型，比根据当前症状（比如打鼾、气喘和睡眠不佳）训练的模型预测能力更强。此外，向基于病史的模型**添加**症状并没有多大改善。严重的睡眠呼吸暂停如果不接受治疗，死亡风险要高
    3 倍 ^(²²⁶)


    其次，机器学习界取得了方法论的胜利，这个胜利可以移植到其他领域。“`SLIM`的准确度能与应用于该数据集的最先进分类模型相媲美，”乌斯顿和鲁丁的团队报告，“但得益于完全透明，用少量只需是/否答案的临床问询就能进行预测。”
    ^(²²⁷)


    正如鲁丁所说：“我想在设计预测模型时考虑到最终用户。我想设计这样的东西……不仅准确，还能用得上，让人们可以用来作决策。我想创建高度准确同时又高度可解释的预测模型，可以给出可信的决策。我的研究基于一个假设，即许多数据集都有非常小的预测模型，我相信它成立。这个假设不是我提出的，很多年前就有。但现在我们有了算力、新想法和新技术，让我们可以真正检验这一假设。”


    对于研究这些问题的研究人员来说，这是激动人心的时刻。依托人类专业知识的简单模型具有了惊人的竞争力。现代技术给了我们寻找**理想**简单模型的方法。


    尽管如此，在有些情况下，复杂是不可避免的；很显然存在这样一些模型，没有人类专家帮助它们将输入过滤成有意义且可管理的规模。有些模型需要处理的不是诸如“GRE
    分数”和“既往犯罪次数”之类已经抽象化的概念，而是原始的语言、听觉或视觉数据。一些医疗诊断工具可以接受人工输入，如“轻度发热”和“哮喘”，而其他工具输入的可能是
    X 光或 CT 结果，需要对其进行解读。自动驾驶汽车必须直接处理雷达、激光雷达和图像数据。对于这类情况，我们别无选择，只能采用大规模、数百万参数的“黑箱”神经网络，它们本来就以难以解释著称。但虽然很难，我们也不是完全束手无策，这里是透明度问题另一个更广阔的领域。


    ## 模型透明度的新视角


    ### 显著性：机器学习的“眼白”


    相对于其他大多数物种，人类拥有很大很明显的巩膜，也就是眼白。眼白会**暴露**我们的注意力，至少是凝视的方向。根据进化生物学家提出的“合作性眼睛假说”，这应该有某种好处，而不是缺陷：它很可能表明了这样一个事实，即合作对人类的生存非常重要，以至于分享关注点的好处大于失去一定程度的隐私或被故意诱导的风险。
    ^(²²⁸)


    因此，对我们来说，期望机器也具备类似的东西应该是可以理解的：不仅知道它们在想什么看什么，尤其还要知道它们在看哪里。


    在机器学习中这个想法被称为“`显著性`”：如果系统正在观察一幅图像并将其归为某个类别，那么在归类时，图像的某些部分可能比其他部分更重要或更值得关注。如果能用某种“热图”凸显这些关键部分，就有可能获得一些重要的诊断信息，作为一种合理性检验，确保系统在按我们预想的方式运行。
    ^(²²⁹)


    这种显著性方法在实践中经常让人惊讶，暴露了机器学习系统有多不直观。它们经常抓住训练数据中人类认为根本不相关的方面，而忽视人类关注的关键信息。


    2013 年，波特兰州立大学的博士生威尔·兰德克尔（Will Landecker）在研究用于区分有动物和没有动物的场景照片的神经网络。他设计了一种方法，可以观察图像中哪些部分与最终的分类相关。他发现了一些奇怪的东西。在很多时候，网络更关注图片的背景而不是前景。仔细观察发现，动物照片的背景经常会很模糊（摄影师行话是“虚化”），面部聚焦清晰，背景巧妙失焦。相比之下，空旷的风景往往更清晰。事实上，他训练的根本不是动物探测器，而是虚化探测器。
    ^(²³⁰)


    2015 年和 2016 年，皮肤科医生贾斯汀·柯（Justin Ko）和罗伯特·诺沃亚（Roberto Novoa）领导斯坦福医学院和工程学院的团队研发皮肤视觉诊断系统。当时视觉系统已发展到能区分数百种不同犬种，这给诺沃亚留下了深刻印象。“我想，”他说，“既然能对狗分类，对皮肤癌应该也可以。”
    ^(²³¹)


    他们将训练好的系统与 25 名皮肤科医生进行了对比测试，性能超过了人类。他们 2017 年在《自然》杂志发表的论文被广泛引用。 ^(²³²)


    事实证明，这个系统不仅能帮助很难找到一流诊断专家的地区，而且对柯这样训练有素的专家也能提供参考。柯清楚记得，2017 年 4 月 17 日，一名患者来找他，肩膀上有个看起来很滑稽的斑点。“我完全拿不准，”柯说，“感觉不太对劲，但是用皮肤镜观察时，没有任何特征提示我这是一个早期黑色素瘤。”尽管如此，他还是觉得不对劲。


    “所以我说，好吧，现在是显摆我的苹果手机的绝佳时机。”柯用各种角度和灯光拍摄了一系列照片，都输入网络。“结果相当惊人，”他说，“不管哪张照片，它的识别都很稳健，它坚定地认为是恶性病变。”柯对其进行了活检，并与皮肤病理专家进行了讨论。“她说，‘嘿，你知道吗？这真的很不错。这是一个非常早期的正在演变的黑色素瘤。我们在完全可治疗的阶段发现了它。”这个日期牢牢印在柯的脑海里。这是该网络首次产生临床影响。“而且，”他说，“我希望这不是孤例。”


    不过，完整的故事要更为复杂。次年，柯、诺沃亚和合作者一起向《皮肤病学研究学报》提交了一篇论文，敦促警惕过快将神经网络模型引入常规临床实践。


    他们认为，在此类模型被广泛应用于临床之前，需格外小心，并根据自己的经验用一个警示故事强调了他们的观点。他们使用的视觉系统很有可能将任何带有标尺的图像归类为癌症。为什么呢？因为恶性肿瘤的医学图像比健康皮肤的图像更可能包含标尺。“因此，算法无意中‘学到了’标尺标志着恶性。”
    ^(²³³)


    ### 告诉我一切：多任务网络


    要让复杂的模型更透明更容易理解，最简单的方法之一是让它们输出**更多东西**。里奇·卡鲁阿纳在研究用神经网络预测医疗结果时，意识到这个网络不仅可以做单一预测，比如病人是否会死亡，还能给出其他各种预测：会住院多久，花多少钱，是否需要呼吸辅助，需要多少疗程的抗生素，等等。


    数据集中的这些附加信息在训练中作为模型的**输入**没什么用。学习根据患者的账单预测死亡风险不会在新患者到来时帮助你，因为这时肯定还**不知道**最终账单。但是，这些信息可以作为额外的**输出**，让训练模型提供的额外的信息来源。这种技术称为“`多任务学习`”。
    ^(²³⁴)


    “奇怪的是，这比训练它一次预测其中一件事可能还更容易，”卡鲁阿纳告诉我， ^(²³⁵)


    为了便于理解，他让我假想我因某种严重疾病入院，可能是肺炎。假设我能活下来，但得住 1 个月的院，要花 50 万美元。“这样我就会知道事情有点严重，”卡鲁阿纳说，“你有麻烦了。虽然不符合对‘可怕结果’的定性，但是我现在知道你病得很严重。”


    对于专为预测死亡风险构建的系统，我的病例如果作为训练数据，真实死亡风险为 0，因为我活了下来，但这样显然丢失了一些信息。正如他所说的，我的病例是“一个相当高风险的
    0”。如果我的确是出于幸运，也许系统应该预测，比如说，像我这样的病例，死亡概率是 80%，而不是 0。训练时，让它在预测的同时给出更多输出，也许能推动系统给出更准确的评估。


    卡鲁阿纳逐渐意识到，这些“多任务”模型不仅在传统意义上具有更好的性能——训练更快，准确度更高——而且也更透明，更容易发现问题。如果像他在 20 世纪 90
    年代建立的系统那样只预测病人的生死，你可能会发现它给出的预测不对劲，比如，哮喘患者比普通门诊病人更不可能死亡。但如果是多任务网络，可以根据数据预测各种信息，不仅仅是生死，还包括住院时间或费用，就更容易发现结果不对劲。例如，哮喘患者的死亡率虽然好于平均水平，但医疗费用却是天价。这样就更容易看出这些患者不是普通的“低风险”患者，不应该回家自己吃药，早上再打电话回来。


    在某些情况下，这些额外的输出通道还可以提供更重要的东西。一支由谷歌、谷歌的生命科学公司 Verily 和斯坦福医学院联合组成的团队在 2017 年和 2018
    年也以谷歌的`Inception v3`网络为基础，训练对视网膜图像分类。 ^(²³⁶)


    结果让他们很震惊。仅仅根据视网膜图像，网络就可以几乎完美地分辨患者的年龄和性别。


    团队中的医生不相信结果是真的。“你给别人看，”波普林说，“他们会对你说：‘你的模型一定有问题。’因为不可能这么准确地辨识……随着研究越来越深入，我们确定模型没问题。这的确是一个真实的辨识。”


    该团队尝试用显著性方法来揭示网络是**如何**运作的，至少揭示相关的特征是什么。结果发现，模型主要是通过观察血管判断年龄；通过观察黄斑和视盘判断性别。


    波普林说：“起初向医生展示结果时，他们会嘲笑你。他们不相信。但是，当你给他们看热图，显示它聚焦于视盘或者视盘周围的特征时，他们会说，‘哦，是的，这个我知道，当然能看出来。’通过显示模型在图像中用于判断的位置，它确实提升了信任度，而且对结果也提供了一定程度的检验。”


    该模型不仅实现了准确诊断，还为医学本身开拓了一条有趣的前进道路。`多任务学习`和显著性技术的结合向医学领域展示了，视网膜中存在被忽视的性别差异。不仅如此，它还指出了在哪里可以找到它们。


    换句话说，这些解释方法不仅能带来更好的医疗，它们也可能造就更好的医生。


    ### 打开盖子：特征可视化


    我们已经看到，多任务网络如何通过额外的输出，为我们提供预测和判断的重要背景。显著性方法则给出了网络输入的背景，可以告诉我们模型在**看哪里**。但两者都没有告诉我们黑匣子里发生了什么——也就是说，模型到底**看到了什么。**


    自 2012 年`AlexNet`以来，机器学习的标志性突破是神经网络模型，它从杂乱的原始感知中学习：数百万个彩色像素。这些模型的参数不是几十个，而是**几千万**个，而这些参数所代表的东西很大程度上不可言喻：上层参数是低层阈值的总和，而低层参数本身又是更低层阈值的总和，一直追溯到数百万个原始像素。从这样的原始信息无法给出可理解的解释。


    那么该怎么办呢？


    纽约大学的博士生马修·泽勒（Matthew Zeiler）和导师罗布·弗格斯（Rob Fergus）聚集于这个问题。他们认为，这些庞大的、令人困惑的模型的成功不可否认。“然而，”他们写道，“人们并不清楚它们为什么表现得这么好，或者如何才能提高……从科学角度来看，这完全无法让人满意。”
    ^(²³⁷)


    人们知道卷积网络的最底层代表一些基本的东西：垂直边，水平边，对角边，强烈的单一颜色，或者简单的梯度。大家也知道，这些网络最终的输出层是类别标签：猫、狗，汽车等等。但人们并不完全知道如何解读位于这两者之间的层。


    泽勒和弗格斯开发了一种可视化技术，他们称之为“`反卷积`”，可以将网络的中间层激活重新转换成图像。 ^(²³⁸)


    他们第一次**看到**了第二层。这是一个各种形状的大杂烩。“平行线、曲线、圆、T 形结、梯度图案、彩色斑点：第二层有各种结构。”第三层甚至更复杂，开始代表物体的组成部分：看起来像面部、眼球、纹理、重复图样的东西。它已经探测到了一些东西，比如云的白色绒毛，书架的多色条纹，或者绿色的草丛。到了第四层，网络开始对眼睛和鼻子的形状、瓷砖地板、海星或蜘蛛的放射状几何形状、花瓣或打字机的按键做出反应。到了第五层，物体被映射到的最终类别似乎施加了很强的影响。


    效果很明显，也很深刻。但是它**有用**吗？泽勒打开了 2012 年赢得`ImageNet`竞赛的`AlexNet`模型的盖子，使用反卷积对其进行探查。他发现了许多缺陷。网络的一些低层部分被不正确地归一化，就像曝光过度的照片。还有一些过滤器已经“死了”，没有检测到任何东西。泽勒猜测，它们对应的尺度不适合它们试图匹配的模式类型。尽管`AlexNet`取得了惊人成功，但它仍有一些死角，可以继续改进，可视化技术能揭示死角**在哪里**。


    2013 年秋天，在几个月连轴转后，泽勒获得了博士学位，离开了纽约大学，创办了自己的公司——`Clarifai`（清澈），并参加了当年的`ImageNet`竞赛，他赢了。
    ^(²³⁹)


    其他小组也在同时进行或跟进研究直接可视化神经网络的方法。2015 年，谷歌工程师亚历山大·莫尔文采夫（Alexander Mordvintsev）、克里斯托弗·奥拉（Christopher
    Olah）和迈克·泰卡（Mike Tyka）提出一种方法，从随机噪点图开始，逐步调整像素，以最大化网络为其分配特定标签的可能性，比如“香蕉”或“叉子”。 ^(²⁴⁰)


    它是艺术恶作剧的沃土，本身就是一种新颖的视觉艺术。谷歌的工程师进一步拓展了这个想法：不再人工指定类别标签然后从噪点开始，而是从一幅真实图像开始，比如云或树叶，逐步调整图像，放大网络中碰巧最活跃的神经元。正如他们写的，“这样就形成了正反馈回路：如果云看起来有点像鸟，网络会让它更像鸟。这反过来又会使网络在下一次处理时更强烈地识别出鸟，如此反复，直到变成一只栩栩如生的鸟，不知从哪里冒出来的”。他们称这种生成幻觉的方法为“`深度梦境`”。
    ^(²⁴¹)


    还存在更奇怪的可能。雅虎的视觉团队开发了一个用于检测上传的图像是否色情的模型，加州大学戴维斯分校的博士生加布里埃尔·吴（Gabriel Goh）使用这种生成性方法将噪点图**最大化**调整成网络认为“工作场所不宜观看”的图。结果就像色情版的萨瓦尔多·达利（Salvador
    Dalí）。如果你针对色情过滤器和常规`ImageNet`类别标签——例如火山——的某种**组合**进行优化，你会得到色情的地理图景：看起来像巨大阴茎的花岗岩，喷出火山灰云。无论是好是坏，这样的图像肯定让人印象深刻。
    ^(²⁴²)


    '
