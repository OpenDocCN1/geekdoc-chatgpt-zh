    感谢互联网档案保存了重要而且稍纵即逝的过去和现在。


    感谢各种免费和/或开源软件项目，它们使得本书的写作成为可能，特别是`Git`、`TeX`和`LaTeX`。令我惊讶的是，这份手稿是用40多年前的排版软件写的，而且写软件文档的不是别人，正是亚瑟·塞缪尔本人。我们真是站在巨人的肩膀上。


    我还想谦卑地感谢那些在本书写作期间去世的人，虽然很遗憾没有留下他们的声音，但他们的思想仍然留存在这本书中：Derek Parfit、Kenneth Arrow、Hubert Dreyfus、Stanislav Petrov和Ursula K. Le Guin。


    我要特别感谢加州大学伯克利分校。感谢CITRIS，我很荣幸在本书写作期间成为访问学者，尤其感谢Brandie Nonnecke和Camille Crittenden；感谢西蒙斯计算理论研究所，尤其是Kristin Kane和Richard Karp；人类兼容人工智能中心（CHAI），尤其是Stuart Russell和Mark Nitzberg；以及CHAI研讨会的成员和来宾们。你们都让我感到如此鼓舞，如此自在，你们的友情无比珍贵。


    感谢我的妻子罗斯，她是我的第一个读者，是我坚定的双手，敏锐的眼睛和耳朵，给我坚定的陪伴和呐喊助威。她始终相信我，我也一直希望她是对的。


