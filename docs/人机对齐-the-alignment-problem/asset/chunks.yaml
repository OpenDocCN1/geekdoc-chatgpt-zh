    Ustun, Tracà&Rudin，“Supersparse Linear Integer Models for Predictive Scoring Systems”，和
    Ustun&Rudin，“Supersparse Linear Integer Models for Optimized Medical Scoring Systems”。关于他们与麻省总医院合作开发睡眠呼吸暂停工具的更多信息，参见
    Ustun 等，“Clinical Prediction Models for Sleep Apnea”。关于他们在累犯背景中应用类似方法的工作，参见 Zeng, Ustun&Rudin，“Interpretable Classification Models for Recidivism Prediction”。关于最近的工作，包括这种方法的“最优证明”，以及与
    COMPAS 的比较，参见 Ange-lino 等，“Learning Certifiably Optimal Rule Lists for Categorical Data”；Ustun&Rudin，“Optimized Risk Scores”；和
    Rudin&Ustun，“Optimized Scoring Systems”。


    # 第二篇


    ## 自主


    ### 4. 强化


    强化在人类事务中的作用得到了越来越多的关注，不是因为学习理论的风潮变了，而是新发现的事实和实践增强了我们预测和控制行为的能力，并且在此过程中展示了其无可置疑的真实性和重要性。即使是那些已尽最大努力来证明它的人，也没有完全掌握强化的能力范围，更何况心理学家本来就有很强的文化惰性。这是可以理解的，因为这种变化可以说是革命性的：传统学习理论将被彻底革新。


    ——斯金纳（B. F. Skinner） ^(²⁵⁵)


    现代行为主义理论的问题不在于它们是错的，而在于它们可能成为事实。


    ——汉娜·阿伦特（Hannah Arendt） ^(²⁵⁶)


    1896 年春天，格特鲁德·斯坦（Gertrude Stein）在哈佛大学参加了声望卓著的威廉·詹姆斯（William James）组织的心理学研讨班。斯坦在哈佛研究“自动主义行为”，即在没有刻意思考单词的情况下在纸上写出它们的能力。据此撰写的严肃学术论文将是她的处女作。更重要的是，开始于大学阶段的心理学研究启发了她标志性的现代主义“意识流”散文风格，并因此而闻名。
    ^(²⁵⁷)


    这个人名叫爱德华·桑代克，公平地说，他最初并没有打算将宿舍改造成鸡舍。他本来**想**研究人类儿童的学习机制，并以此驳斥所谓的超感官知觉。哈佛没有批准这项研究，所以作为后备计划……孵蛋器里孵出了一群叽叽喳喳的小鸡。
    ^(²⁵⁸)


    对于一个有抱负的心理学家，伺候一群小鸡在当时确实显得奇怪。动物研究尚未像 20 世纪那样成为时尚，桑代克自己的同学也认为他有点古怪。这虽然让同行侧目，也引起了女房东的不满，但是照料鸡群虽然烦琐，也并非没有好处。例如，在去坎布里奇的路上，桑代克经常不得不在家族世交莫尔顿的家里停留，借火炉给小鸡取暖。理由当然很正当——研究需要，但从桑代克的信中可以清楚看出，他主要是找机会去和莫尔顿家的小女儿贝丝调情。她后来成了他的妻子。


    桑代克在坎布里奇的女房东最终忍无可忍，宣布他的孵蛋箱有火灾危险，并给他下了最后通牒：小鸡必须送走。詹姆斯想帮他在哈佛校园里争取一点实验场地，但学校不同意。最后，詹姆斯不顾妻子的抗议，让桑代克把小鸡、孵蛋器和一大堆东西都搬进了自己家的地下室。（至少詹姆斯的孩子们很高兴。）


    1897 年，桑代克从哈佛毕业，移居纽约并获得了哥伦比亚大学的研究生奖学金，这次是与各种动物打交道。这一年的经历让人沮丧。他的两只猫跑了，找不到狗，还说“我的猴子太野了，我不能碰它”。更糟糕的是，桑代克的城市动物园里的动物并非都是来为科学献身的，还有许多是害虫。在
    1898 年 2 月 14 日给贝丝的信中，他写道：“刚才有只老鼠从我脚上跑过去。还有几只老鼠在啃书桌；3 只小鸡在我旁边睡觉；地上乱七八糟，有烟叶、烟头、报纸、书、煤、鸡圈、猫奶碟、旧鞋子、煤油桶和一把没起作用的扫帚。我的房子是个破败的山洞。”不过他保证会清理干净，还邀请她去玩——毕竟那天是情人节。


    在这个肮脏的环境中，将会产生一些 19 世纪最具原创性和最重要的研究成果。桑代克建造了一套装置，他称为“迷箱”，里面安装了门栓、杠杆和按钮。他把动物放在盒子里，放一些食物在外面，观察动物——小鸡、猫和狗——如何找到出路。桑代克在给贝丝的信中写道：“你会看到各种特技表演，小猫打开门栓和按钮，拉绳子，像小狗一样讨食物，我只需在旁边吃着苹果抽着烟。”


    桑代克想研究的是学习机制，一种理论正在他的头脑中成形。桑代克一边吃着苹果抽着烟，一边观察那些寻找盒子诀窍的动物，最初的行为几乎完全是随机的：咬，推。一旦某个随机行为让它们从盒子里逃了出来，它们就会很快学会重复这个行为，并越来越擅长快速逃离盒子。“在许多偶然的动作中，有些动作会带来快乐，”他观察到，“从而越来越强化和牢固。”
    ^(²⁵⁹)


    桑代克发现的是一种更普遍的自然法则的要点。正如他所说，我们行为的结果要么“令人满意”要么“令人厌恶”。当行为的结果“令人满意”时，我们倾向于继续做。当结果“令人厌恶”时，我们会尽量避免。行为与结果的关联越明确，学习的效果就越明显。桑代克称之为“效果律”，这可能是他职业生涯中最著名也最持久的想法。


    正如他所说：


    效果律是：如果在情境和作出的反应之间能建立可变的关联，并且伴随或跟随着令人满意的状态，则这种关联会增强；如果作出的反应伴随或跟随着令人烦恼的状态，则关联会减弱。满足感（或烦恼感）与这种关联的联系越密切，对关联的强化效应（或弱化效应）就越明显。
    ^(²⁶⁰)


    这个思想看似平常，也很直观，却是 20 世纪建立的大部分心理学的基础。 ^(²⁶¹)


    下一代的杰出心理学家爱德华·托尔曼（Edward Tolman）后来写道：“动物学习的心理学，更不用说儿童学习的心理学，过去和现在主要是围绕桑代克的观点。”
    ^(²⁶²)


    桑代克在心理学经典中占有了一席之地，但他自己对此倒是非常谦虚。1905 年，桑代克出版了教科书《心理学的要素》，书中声称要推翻之前的主流教科书《心理学：简明教程》，这本书的作者不是别人，正是他在哈佛的导师威廉·詹姆斯。桑代克寄给他一张
    100 美元的支票以补偿损失的版税。詹姆斯回答说：“说真的，桑代克，你是大自然的怪胎。自然的第一法则是消灭所有竞争对手（尤其是在教科书领域），你却用收益供养他们！”詹姆斯拒绝兑现支票，将它退了回去。
    ^(²⁶³)


    ### 数字试错法


    什么样的力通过什么样的过程或机制起作用，能产生什么样的肯定反应？在我看来，符合所有或几乎所有事实的答案是……施加于连接的强化力和机制。


    ——桑代克 ^(²⁶⁴)


    如果跟随桑代克的动物研究员和桑代克一样，最终感兴趣的是人类儿童心理学，那么他们并不孤单，研究计算机科学的先驱也是如此。1950 年，艾伦·图灵（Alan Turing）在他最著名的论文《计算机与智能》中，就明确用这方面的术语来构想
    AI。“与其尝试构建程序来模拟成人大脑，”他写道，“为什么不模拟儿童大脑呢？如果能做到，然后用适当的课程对其进行教育，就能成为成人大脑。”图灵将他构想的模拟儿童大脑称为“无组织机器”，从随机配置开始，然后根据其（最初是随机的）行为的效果来改进。


    通往 AI 的路线图成形了。“无组织机器”将直接借鉴关于神经系统的知识，“教育课程”将直接借鉴行为主义研究发现的关于动物（和儿童）如何学习的知识。沃伦·麦卡洛克和沃尔特·皮茨在
    40 年代初已经发现，用大量人工“神经元”，通过适当连线，几乎可以计算任何东西。图灵已经开始构想用试错法训练神经网络的方法。事实上，这正是 50 年前桑代克在烟雾缭绕的宿舍动物园里描述的“固化”过程；图灵的描述与桑代克的效果律几乎一模一样：


    面对出现的情形，如果应对行为不确定，对缺失数据进行随机选择，并在描述中给出适当的暂定输入，然后应用。如果引发了疼痛刺激，所有暂定输入都被取消，如果引发了愉悦刺激，则都被永久化。
    ^(²⁶⁵)


    20 世纪 50 年代末，IBM 纽约波基普西实验室的亚瑟·塞缪尔（Arthur Samuel）构建了一个下西洋跳棋的程序，这个程序能以一种粗糙原始的方式，根据输赢调整参数。没过多久，塞缪尔就输给了自己的创造物。正如《纽约客》1959
    年的报道：“塞缪尔博士可能是历史上第一个被自己设计的对手击败的科学家。” ^(²⁶⁶)

