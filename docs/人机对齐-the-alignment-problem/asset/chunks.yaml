- raw: '她决定聚焦于COMPAS，这个工具不仅纽约在用，加利福尼亚、威斯康星和佛罗里达也在用，覆盖大约200个司法管辖区。到处都在用它，却一直没有被认真审查过，而且闭源，有点像黑匣子，尽管白皮书给出了基本设计。2015年4月，她向佛罗里达州布劳沃德县提交了信息自由法案申请。经过5个月的法律混战，数据终于拿到了：2013年和2014年在布劳沃德县给出的所有18000个COMPAS评分。


    安格温团队做了一些初步分析。很快就发现了一些奇怪的东西。黑人被告的风险评分大致呈均匀分布，从1分（最低风险）到10分（最高风险），10个区间中各有约10%的被告。白人被告的分布则截然不同：极低风险的人数要**远多于**高风险人数。


    安格温想马上对此进行报道。但她意识到，分布的巨大差异不一定是偏见的证据，也许只是这些被告碰巧**的确**如此。那么，这些被告的风险**到底**有多大呢？只有一个办法可以知道。“我沮丧地意识到，”安格温回忆道，“必须找到这18000人的所有犯罪记录。我们这样做了。遭透了。”
    ^([^(128)](#fn128))


    “当然，我们使用了很多自动提取犯罪记录的方法，”她解释道，“但我们还必须匹配名字和出生日期，这件事非常难。有很多字打错了，各种拼写错误。我每天都很绝望。做这个连接太累人了。数据极其混乱。布劳沃德县实际上自己从未连接过。”
    ^([^(129)](#fn129))


    最后，安格温团队在2016年5月发表了一篇文章。题为《机器偏见》，文章摘要写道：“全美各地都在使用软件来预测未来的罪犯。而且对黑人存在偏见。” ^([^(130)](#fn130))


    布伦南和北点的同事在7月初发表了对ProPublica调查结果的官方反驳。 ^([^(131)](#fn131))


    首先，它对黑人和白人被告的预测**准确率**差不多。其次，1到10分的风险分值具有相同的**含义**，与被告的种族无关，这被称为“校准”。比方说，不管哪个种族，暴力再犯风险被评分为7的被告，在相同时间内再犯的比例差不多；其他分数也是类似的。无论哪个种族，1分就是1分，5分就是5分，10分就是10分。COMPAS兼具这两个特性——同样的准确率和校准——因此，北点认为，该工具**从数学上不可能**有偏见。


    7月底，ProPublica反过来回应。 ^([^(132)](#fn132))


    在被模型误判的被告中，有一个惊人的差异：“黑人被告被评为高风险，但不再犯的概率是白人被告的2倍。白人被告被评为风险较低，但后来又被指控新犯罪的概率是黑人被告的2倍。”
    ^([^(133)](#fn133))


    该工具的预测是否“公平”的问题变得尖锐起来：首先要问的是，哪些统计指标是定义和衡量公平的“正确”指标。


    对话即将有新的转折，它将来自一个截然不同的领域，一个开始将注意力集中到公平问题的群体，虽然很慢，但是很坚定。


    **这不是公平**


    哈佛大学的计算机科学家辛西娅·德沃克（Cynthia Dwork）提出了著名的“差分隐私”原则。这一原则使公司能够收集大量用户数据，同时又能维护用户隐私。网络浏览器公司可能想了解用户行为，但是不收集**你**去了哪些网站的数据；智能手机公司可能想学习如何改进拼写纠错或输入建议，但是不获取你的私人对话细节。差分隐私使这成为可能。大约从2014年开始，它被大型科技公司广泛采用，并为德沃克赢得了哥德尔奖，这是计算领域的最高荣誉之一。
    ^([^(134)](#fn134))


    “我从2000年开始从事隐私研究，”她解释道，“2006年提出差分隐私。我脑子里想研究的问题都做完了，然后我说，好吧，我想研究点别的。” ^([^(135)](#fn135))


    当时在微软研究院工作的德沃克前往伯克利，见了计算机科学家同行，阿莫斯·菲亚特（Amos Fiat）。他们聊了一整天。午餐时，他们去了当地很受欢迎的切兹帕妮丝餐馆，坐下时，他们聊起了**公平**问题。德沃克回忆道：“我们的讨论涉及种族主义和性别歧视，为了不影响周围的人，我们用‘紫色领带’和‘条纹衬衫’之类的词替代。等到上餐时，我们已经决定，要做这个。”


    理论计算机科学中有许多问题涉及“公平”，有切蛋糕（或分割遗产）让每个人都得到适当份额的博弈论机制，也有确保每个进程获得适当CPU时间的调度算法。但是，德沃克认为，公平的概念中还有一些有待该领域认真研究的东西。


    德沃克在《华尔街日报》上偶然读到过朱莉娅·安格温的《他们知道些什么》专栏，是一篇关于在线广告的文章。研究表明，最迟到2010年，各家互联网公司就已经能辨别访问其网站的用户的确切个人身份——将表面上匿名的用户缩小到几十个可能的人之一——并且能实时做出决定，比如，推荐哪种信用卡。
    ^([^(136)](#fn136))


    在思考隐私问题10年后，德沃克也开始改变关注点——从“他们知道些什么”转向“他们会用它来做什么”。


    德沃克回到微软的实验室：“我找到问题了。”


    当时还在普林斯顿大学读博士的莫里茨·哈特（Moritz Hardt）是她实验室的成员。哈特以前的研究不涉及现实世界中的问题。他对理论感兴趣：复杂性、难处理性、随机性。越抽象越好。“没有应用，”他开玩笑说，“很老派。”
    ^([^(137)](#fn137))


    “我学到了很多，”他说，“但我在那个领域能解决的问题……无法与我感兴趣的现实世界问题关联起来。我很快就被（计算机科学）正在触及的一些更具社会性的问题吸引。”这始于与德沃克的合作，隐私保护数据分析。接着她又邀请他加入公平项目。


    哈特回忆道：“辛西娅认识到，有时当人们要求隐私时，他们实际上是担心有人以错误的方式使用他们的数据。关键不在于不惜一切代价隐藏数据，而在于防止数据的使用方式造成伤害……这是一个相当精准的认识。随着时间推移，公众讨论从隐私转向了公平，所有过去看起来像隐私问题的事情突然都变成了公平问题。”


    他们和同事发现，将关于公平的哲学和法律观点转化为严格的数学约束存在巨大的复杂性，而且事实上，许多以前的思想和实践——其中一些已经有几十年历史——都被深深误导了，并且可能十分有害。


    例如，美国反歧视法规定了许多“受保护的属性”——比如种族、性别和残疾状况——人们通常理解的是，应该严格禁止在机器学习模型中使用这些变量，这些变量可能会在雇佣、刑事拘留等情景中影响人们。如果我们在媒体上听到一个模型“使用种族”（或性别等）作为属性，我们会倾向于认为这是很严重的错误；各家公司或组织在为自己的模型辩护时，通常也是证明它“不使用种族作为属性”或“不分种族”。这似乎很明显——如果一开始就不知道是哪个群体，怎么可能对该群体有歧视呢？


    出于几个原因，这是错的。


    仅仅**删除**“受保护的属性”是不够的。只要模型考虑了与比如说性别或种族**相关**的特征，避免明确提及它就没什么用。


    我们在波士顿交响乐团和简历筛选语言模型的案例中就曾讨论过，仅仅屏蔽你关心的变量（在这些情景中是性别）可能不够，尤其是还有其他因素与之**相关**的话。这个概念被称为“冗余编码”。性别属性在其他变量中被**冗余编码**了。


    在刑事司法背景下，以不同方式对待一个群体的历史会在各处产生冗余编码。例如，少数族裔社区被更过度地管理，意味着像犯罪记录长度——即先前定罪的数量——这样看似中立的东西，无意中可能成为种族的冗余编码。
    ^([^(138)](#fn138))


    由于冗余编码，仅仅屏蔽敏感属性是不够的。事实上，由于冗余编码的怪异特性，屏蔽这些属性可能会让事情变得**更糟**。例如，可能有这样的情况，某个模型的构造者想要测量某个变量与种族的相关性。如果不知道种族属性，他们就会束手无策！一位工程师跟我抱怨说，公司管理层一再强调确保模型不会因性别和种族等敏感属性而扭曲的重要性，但公司的隐私政策不允许机器学习工程师**读取**他们处理的记录的受保护属性。所以，他们无法得知模型是否有偏见。


    屏蔽受保护的属性会导致无法度量这种偏见，因此也无法纠正。例如，招聘中使用的机器学习模型可能会因为候选人上一年没有工作而对其进行惩罚。然而我们不希望这种惩罚被用于孕妇或刚生育的人，但如果模型必须是“不分性别”，不能包括性别本身，也不能包括与性别有密切关联的东西，比如怀孕，这就很难了。
    ^([^(139)](#fn139))


    “该研究领域的经验已经明确，”哈特说，“通过屏蔽实现公平是行不通的。这是整个研究领域最有把握、最清楚的事实。” ^([^(140)](#fn140))


    这种认识从计算机科学家扩散到法律专家、政策制定者和公众需要时间，但它已经开始发挥作用。“可能在有些情景中，允许算法考虑受保护的群体实际上能得到更公平的结果，”正如《宾夕法尼亚大学法律评论》最近的一篇文章所说，“这可能需要理论的转变，因为在许多情况下，做决定时考虑受保护群体被法律认定为是一种伤害。”
    ^([^(141)](#fn141))


    在那个夏天，莫里茨·哈特和辛西娅·德沃克合作获得了一些早期结果，发表了论文。 ^([^(142)](#fn142))


    回到普林斯顿完成博士学位时，哈特发现自己被安排了一次学术相亲。德沃克一直与海伦·尼森伯姆（Helen Nissenbaum）有交往，她也是计算机伦理方向的先驱。
    ^([^(143)](#fn143))


    第一次会面有点尴尬。


    哈特坐在普林斯顿威瑟斯彭街的樱花快递寿司店。巴罗卡斯走了进来。“他坐下来，”哈特回忆道，“然后拿出了那篇论文，令我沮丧的是，他将论文中一些段落仔细划了线。你不应该这样阅读计算机科学论文！”他笑了。“在那之前，我一直认为论文中的文字是数学的填充物……这很尴尬，因为我写的东西毫无意义。”


    两人开始交谈。虽然开始很尴尬，两位导师意识到的共鸣显然存在。最终，两人决定向2013年神经信息处理系统会议（NeurIPS）提交提案，举办一场关于公平的研讨会。NeurIPS不同意。“组织者觉得没有足够的研究或材料，”哈特告诉我，“然后在2014年，我和梭伦聚在一起，说，‘好吧，在放弃之前，再试一次。’”他们给研讨会起了个新名字，并赋予它更广阔的使命：“机器学习中的公平、问责和透明”，简称FATML。这次NeurIPS同意了。当年在蒙特利尔举行的会议上，举办了为期一天的研讨会，巴罗卡斯和哈特介绍了会议情况，德沃克做了开场报告。


    哈特从普林斯顿毕业后去了IBM研究院。他继续在关注度不够的环境下呼吁公平问题。“作为计算机科学家，我必须同时做其他事情才能生存。在我的职业生涯中，这一直像一个次要项目。”值得称赞的是，IBM给了他很多自由，尽管他的热情没有引起广泛共鸣。“我在IBM的团队对这个话题并不特别感兴趣，”他说，“但其他人也不感兴趣。”


    两人在2015年再次聚首，并再次举办分会。“房间里挤满了人，”哈特回忆道，“人来得很多，但可以肯定地说，并没有引发革命。”他只能将大部分时间花在更传统的计算机科学上。又过了一年，他和梭伦第三次组织FATML。


    这一次情况不同了，哈特说，2016年“是它开始爆发的一年，是每个人都开始关注的一年”。数学家兼博客作者凯西·奥尼尔（Cathy O’Neil）曾在2014年的第一次会议上发表演讲，她在2016年出版了畅销书《算法霸权》，讲述了粗心（或恶意）使用大数据可能引发的社会问题。一系列令人震惊的选举结果，嘲弄了全世界民意测量专家的共识，动摇了人们对预测模型可信度的信心；与此同时，像剑桥分析这样的数据驱动型政治分析公司所做的事情，提出了机器学习被用来直接影响政治的问题。像脸书和推特这样的平台在如何——以及是否——使用机器学习来过滤向数十亿用户推送的信息更是被推上了风口浪尖。ProPublica的一组记者经过一年艰辛的数据清理和分析工作后，公开了他们对美国最广泛使用的风险评估工具之一的研究结果。


    公平不再只是一个问题，它正在成为一场运动。


    **公平的不可能性**


    康奈尔大学的计算机科学家乔恩·克莱因伯格（Jon Kleinberg）和芝加哥大学的经济学家森迪尔·穆莱纳坦（Sendhil Mullainathan）从2012年开始，一直致力于利用机器学习分析审前羁押决定，将人类法官与预测性机器学习模型进行比较。克莱因伯格说：“部分目的是思考在种族不平等的背景下，算法工具对此会有何影响。之前我们已经进行了大量思考。然后ProPublica的文章出现了……社交媒体很快开始大量转发。这的确引起了广泛关注。我们觉得，‘他们触及到了某种东西……值得我们深入研究，弄清楚这与我们一直在思考的主题有什么关系’。”
    ^([^(144)](#fn144))


    在匹兹堡，卡内基·梅隆大学的统计学家亚历山德拉·库尔德科瓦（Alexandra Chouldechova）自2015年春季以来一直在与宾夕法尼亚州量刑委员会合作，开发一个可视化仪表板来分析风险评估工具的各种数学属性。“我越来越关注这些问题……了解各种公平概念的分类标准以及它们的关系，”她说，“当时我还在做其他项目……我一直在和资深同行讨论，或许可以写一篇关于风险评估工具验证思路的论文——我们做了文献综述——然后ProPublica的报道引起了轰动。我认为这确实推动了许多人对该领域的思考。”
    ^([^(145)](#fn145))


    相同的故事正在这个国家的另一边上演。斯坦福大学的博士生萨姆·科贝特——戴维斯（Sam Corbett-Davies）本来“打算做机器人，这对于计算机科学专业很自然”。一年后，他发现自己一点也不喜欢这个，“同时却痴迷于阅读美国公共政策。我当时想，‘必须找到一种方法，把我的专业技能和对政策的关注结合起来’”。
    ^([^(146)](#fn146))


    ProPublica强调了COMPAS所犯错误的**类型**，并凸显了这样一个事实，即它似乎一直在高估没有再犯的黑人被告的风险，同时低估再犯的白人被告的风险。北点强调了**错误率**，而不是错误类型，并强调该模型对黑人和白人被告的预测同样准确，此外，对于从1到10每一个风险分值，COMPAS都有“校准”：相同分值的被告有相同的再犯概率，与种族无关。于是，COMPAS是否“公平”的问题归结为公平的两种不同数学定义的冲突。


    科学中经常会发生这种事情，某个想法或见解的时机已经成熟，以至于一群人几乎异口同声地提出。


    出现了3篇论文。 ^([^(147)](#fn147))


    克莱因伯格表示，在确定了ProPublica对公平的定义（即没有再犯的黑人被告被误判为高风险被告的可能性几乎是白人被告的2倍）是争论的关键之后，“我们可以将其与人们更关注的其他定义进行对比，并问一问，这些定义在多大程度上是兼容的？”


    “答案是，它们不兼容。”


    除非黑人和白人被告碰巧有相等的“基率”，也就是说，碰巧实际上再犯的概率完全一样，才有可能同时满足ProPublica和北点的标准。否则，根本不可能。


    这与机器学习无关，也与刑事司法本身无关。克莱因伯格和他的同事写道：“在对基率不同的两组进行风险评估时，结果就会是这样”。 ^([^(148)](#fn148))


    库尔德科瓦分析的结果也一样：一个经过校准的工具，“如果不同群体的再犯发生率不同，就不可能有相同的假阳性率和假阴性率”。


    “所以不可能同时满足这些，”她说，“这是普适原则，但在这种情况下，它会引导你得出有趣的结论，而这会对现实世界中的风险评估产生影响。” ^([^(149)](#fn149))


    其中一个影响是，如果**任何**模型都无法同时满足一组可取的标准，那么任何风险评估工具只要曝光，**肯定会**发现一些值得上头条的可恶之处。


    正如科贝特——戴维斯解释的，“就ProPublica所认为的偏见而言，不存在他们找不到偏见的世界。不存在这篇文章挑不出毛病的算法，不存在这种可能的COMPAS”。
    ^([^(150)](#fn150))


    \[具有讽刺意味的是，在对布劳沃德县数据的分析中，科贝特——戴维斯发现，COMPAS**没有**根据性别进行校准。“风险评分为5分的女性再犯的概率同风险评分为3分的男性差不多，”他说，
    ^([^(151)](#fn151))


    这种不可能性的冰冷数学事实也意味着，这些问题不仅对风险评估的机器学习模型有影响，对**任何**分类方式都有影响，无论是人**还是**机器。正如克莱因伯格所写的：“原则上，任何风险评分天生都会被批评有偏见。无论风险评分是由算法还是由人类决策者确定，都同样如此。”
    ^([^(152)](#fn152))


    既然已经明确了，这些不同的、看似同样直观的、同样可取的公平衡量标准无法调和，并且传统的人类判断在这方面也不会做得更好，另一个问题就显现出来了。


    现在怎么办？


    **不可能之后**


    我问克莱因伯格，他如何看待自己的不可能结果，以及他认为这表明我们**应该**做什么。“我对此没有什么特别想说的，”他说，“我想这得依情况而定……这些定义都重要，哪个更有分量取决于你工作的领域。”


    诚然，在不同领域，考量的重点有根本差异。例如，**贷款**审核在许多重要方面就不同于刑事司法。拒绝向**本来会**还钱的人提供贷款不仅意味着贷款人失去了利息收入，还可能对借款人有严重影响：有一栋房子他们无法购买，有一项业务他们无法启动。另一方面，犯相反的错误——借钱给**不**还钱的人——可能对贷款人只会有金钱损失。也许这种不对称会改变我们对这种情况下公平的意义的理解。也许我们想确保两个不同群体中所有有信誉的借款人都有同等机会获得贷款，即使数学告诉我们，例如，这样不仅贷款人的利润会减少，而且一个群体中**不应**获得贷款的人比另一个群体多。
    ^([^(153)](#fn153))


    然而，在刑事司法背景下，特别是暴力犯罪，假阳性（“高风险”的人没有再犯）**和**假阴性（“低风险”的人再犯）都会严重损害权益，因此权衡可能会有很大不同。


    例如，科贝特——戴维斯认为，在风险评估背景下平衡假阳性率——确保**不会**再犯的被告，无论是黑人还是白人，都不会被关押——只要不同种族的实际犯罪率不同，就意味着对不同种族的被告适用不同标准。例如，这可能意味着关押所有风险为7或更高的黑人被告，但白人被告只要风险为6或更高就会被关押。他说，这样做“可能违反了第十四修正案的平等保护条款”。
    ^([^(154)](#fn154))


    实际情况还要更糟。“因为在关押低风险被告的同时，释放了一些相对高风险的被告，被释放的被告犯下的暴力犯罪将会增加。因为犯罪通常发生在社区内部，不会跨社区，所以这种犯罪将集中在少数族裔社区，受害者也将提起第十四修正案的诉讼。”
    ^([^(155)](#fn155))


    不可能性的证明也表明，平衡假阳性和假阴性率意味着放弃校准。校准是确保对于相同的风险评分，被告再犯的概率也相同，无论性别或种族。科贝特——戴维斯说：“没有校准，就不清楚风险评分是什么意思。所以如果你问我，‘这个被告有多危险？’我说，‘风险为2’，你说，‘这是什么意思？’我说，‘好吧，如果是男性，意味着有50%的概率他们会再犯；如果是女性，就意味着有20%的概率会再犯——你可以看到“2”是怎么失去意义的’。”
    ^([^(156)](#fn156))'
  fmt: '

    她决定聚焦于COMPAS，这个工具不仅纽约在用，加利福尼亚、威斯康星和佛罗里达也在用，覆盖大约200个司法管辖区。到处都在用它，却一直没有被认真审查过，而且闭源，有点像黑匣子，尽管白皮书给出了基本设计。2015年4月，她向佛罗里达州布劳沃德县提交了信息自由法案申请。经过5个月的法律混战，数据终于拿到了：2013年和2014年在布劳沃德县给出的所有18000个COMPAS评分。


    安格温团队做了一些初步分析。很快就发现了一些奇怪的东西。黑人被告的风险评分大致呈均匀分布，从1分（最低风险）到10分（最高风险），10个区间中各有约10%的被告。白人被告的分布则截然不同：极低风险的人数要**远多于**高风险人数。


    安格温想马上对此进行报道。但她意识到，分布的巨大差异不一定是偏见的证据，也许只是这些被告碰巧**的确**如此。那么，这些被告的风险**到底**有多大呢？只有一个办法可以知道。“我沮丧地意识到，”安格温回忆道，“必须找到这18000人的所有犯罪记录。我们这样做了。遭透了。”
    ^([^(128)](#fn128))


    “当然，我们使用了很多自动提取犯罪记录的方法，”她解释道，“但我们还必须匹配名字和出生日期，这件事非常难。有很多字打错了，各种拼写错误。我每天都很绝望。做这个连接太累人了。数据极其混乱。布劳沃德县实际上自己从未连接过。”
    ^([^(129)](#fn129))


    最后，安格温团队在2016年5月发表了一篇文章。题为《机器偏见》，文章摘要写道：“全美各地都在使用软件来预测未来的罪犯。而且对黑人存在偏见。” ^([^(130)](#fn130))


    布伦南和北点的同事在7月初发表了对ProPublica调查结果的官方反驳。 ^([^(131)](#fn131))


    首先，它对黑人和白人被告的预测**准确率**差不多。其次，1到10分的风险分值具有相同的**含义**，与被告的种族无关，这被称为“校准”。比方说，不管哪个种族，暴力再犯风险被评分为7的被告，在相同时间内再犯的比例差不多；其他分数也是类似的。无论哪个种族，1分就是1分，5分就是5分，10分就是10分。COMPAS兼具这两个特性——同样的准确率和校准——因此，北点认为，该工具**从数学上不可能**有偏见。


    7月底，ProPublica反过来回应。 ^([^(132)](#fn132))


    在被模型误判的被告中，有一个惊人的差异：“黑人被告被评为高风险，但不再犯的概率是白人被告的2倍。白人被告被评为风险较低，但后来又被指控新犯罪的概率是黑人被告的2倍。”
    ^([^(133)](#fn133))


    该工具的预测是否“公平”的问题变得尖锐起来：首先要问的是，哪些统计指标是定义和衡量公平的“正确”指标。


    对话即将有新的转折，它将来自一个截然不同的领域，一个开始将注意力集中到公平问题的群体，虽然很慢，但是很坚定。


    ## 这不是公平


    哈佛大学的计算机科学家辛西娅·德沃克（Cynthia Dwork）提出了著名的“差分隐私”原则。这一原则使公司能够收集大量用户数据，同时又能维护用户隐私。网络浏览器公司可能想了解用户行为，但是不收集**你**去了哪些网站的数据；智能手机公司可能想学习如何改进拼写纠错或输入建议，但是不获取你的私人对话细节。差分隐私使这成为可能。大约从2014年开始，它被大型科技公司广泛采用，并为德沃克赢得了哥德尔奖，这是计算领域的最高荣誉之一。
    ^([^(134)](#fn134))


    “我从2000年开始从事隐私研究，”她解释道，“2006年提出差分隐私。我脑子里想研究的问题都做完了，然后我说，好吧，我想研究点别的。” ^([^(135)](#fn135))


    当时在微软研究院工作的德沃克前往伯克利，见了计算机科学家同行，阿莫斯·菲亚特（Amos Fiat）。他们聊了一整天。午餐时，他们去了当地很受欢迎的切兹帕妮丝餐馆，坐下时，他们聊起了**公平**问题。德沃克回忆道：“我们的讨论涉及种族主义和性别歧视，为了不影响周围的人，我们用‘紫色领带’和‘条纹衬衫’之类的词替代。等到上餐时，我们已经决定，要做这个。”


    理论计算机科学中有许多问题涉及“公平”，有切蛋糕（或分割遗产）让每个人都得到适当份额的博弈论机制，也有确保每个进程获得适当CPU时间的调度算法。但是，德沃克认为，公平的概念中还有一些有待该领域认真研究的东西。


    德沃克在《华尔街日报》上偶然读到过朱莉娅·安格温的《他们知道些什么》专栏，是一篇关于在线广告的文章。研究表明，最迟到2010年，各家互联网公司就已经能辨别访问其网站的用户的确切个人身份——将表面上匿名的用户缩小到几十个可能的人之一——并且能实时做出决定，比如，推荐哪种信用卡。
    ^([^(136)](#fn136))


    在思考隐私问题10年后，德沃克也开始改变关注点——从“他们知道些什么”转向“他们会用它来做什么”。


    德沃克回到微软的实验室：“我找到问题了。”


    当时还在普林斯顿大学读博士的莫里茨·哈特（Moritz Hardt）是她实验室的成员。哈特以前的研究不涉及现实世界中的问题。他对理论感兴趣：复杂性、难处理性、随机性。越抽象越好。“没有应用，”他开玩笑说，“很老派。”
    ^([^(137)](#fn137))


    “我学到了很多，”他说，“但我在那个领域能解决的问题……无法与我感兴趣的现实世界问题关联起来。我很快就被（计算机科学）正在触及的一些更具社会性的问题吸引。”这始于与德沃克的合作，隐私保护数据分析。接着她又邀请他加入公平项目。


    哈特回忆道：“辛西娅认识到，有时当人们要求隐私时，他们实际上是担心有人以错误的方式使用他们的数据。关键不在于不惜一切代价隐藏数据，而在于防止数据的使用方式造成伤害……这是一个相当精准的认识。随着时间推移，公众讨论从隐私转向了公平，所有过去看起来像隐私问题的事情突然都变成了公平问题。”


    他们和同事发现，将关于公平的哲学和法律观点转化为严格的数学约束存在巨大的复杂性，而且事实上，许多以前的思想和实践——其中一些已经有几十年历史——都被深深误导了，并且可能十分有害。


    例如，美国反歧视法规定了许多“受保护的属性”——比如种族、性别和残疾状况——人们通常理解的是，应该严格禁止在机器学习模型中使用这些变量，这些变量可能会在雇佣、刑事拘留等情景中影响人们。如果我们在媒体上听到一个模型“使用种族”（或性别等）作为属性，我们会倾向于认为这是很严重的错误；各家公司或组织在为自己的模型辩护时，通常也是证明它“不使用种族作为属性”或“不分种族”。这似乎很明显——如果一开始就不知道是哪个群体，怎么可能对该群体有歧视呢？


    出于几个原因，这是错的。


    仅仅**删除**“受保护的属性”是不够的。只要模型考虑了与比如说性别或种族**相关**的特征，避免明确提及它就没什么用。


    我们在波士顿交响乐团和简历筛选语言模型的案例中就曾讨论过，仅仅屏蔽你关心的变量（在这些情景中是性别）可能不够，尤其是还有其他因素与之**相关**的话。这个概念被称为“冗余编码”。性别属性在其他变量中被**冗余编码**了。


    在刑事司法背景下，以不同方式对待一个群体的历史会在各处产生冗余编码。例如，少数族裔社区被更过度地管理，意味着像犯罪记录长度——即先前定罪的数量——这样看似中立的东西，无意中可能成为种族的冗余编码。
    ^([^(138)](#fn138))


    由于冗余编码，仅仅屏蔽敏感属性是不够的。事实上，由于冗余编码的怪异特性，屏蔽这些属性可能会让事情变得**更糟**。例如，可能有这样的情况，某个模型的构造者想要测量某个变量与种族的相关性。如果不知道种族属性，他们就会束手无策！一位工程师跟我抱怨说，公司管理层一再强调确保模型不会因性别和种族等敏感属性而扭曲的重要性，但公司的隐私政策不允许机器学习工程师**读取**他们处理的记录的受保护属性。所以，他们无法得知模型是否有偏见。


    屏蔽受保护的属性会导致无法度量这种偏见，因此也无法纠正。例如，招聘中使用的机器学习模型可能会因为候选人上一年没有工作而对其进行惩罚。然而我们不希望这种惩罚被用于孕妇或刚生育的人，但如果模型必须是“不分性别”，不能包括性别本身，也不能包括与性别有密切关联的东西，比如怀孕，这就很难了。
    ^([^(139)](#fn139))


    “该研究领域的经验已经明确，”哈特说，“通过屏蔽实现公平是行不通的。这是整个研究领域最有把握、最清楚的事实。” ^([^(140)](#fn140))


    这种认识从计算机科学家扩散到法律专家、政策制定者和公众需要时间，但它已经开始发挥作用。“可能在有些情景中，允许算法考虑受保护的群体实际上能得到更公平的结果，”正如《宾夕法尼亚大学法律评论》最近的一篇文章所说，“这可能需要理论的转变，因为在许多情况下，做决定时考虑受保护群体被法律认定为是一种伤害。”
    ^([^(141)](#fn141))


    在那个夏天，莫里茨·哈特和辛西娅·德沃克合作获得了一些早期结果，发表了论文。 ^([^(142)](#fn142))


    回到普林斯顿完成博士学位时，哈特发现自己被安排了一次学术相亲。德沃克一直与海伦·尼森伯姆（Helen Nissenbaum）有交往，她也是计算机伦理方向的先驱。
    ^([^(143)](#fn143))


    第一次会面有点尴尬。


    哈特坐在普林斯顿威瑟斯彭街的樱花快递寿司店。巴罗卡斯走了进来。“他坐下来，”哈特回忆道，“然后拿出了那篇论文，令我沮丧的是，他将论文中一些段落仔细划了线。你不应该这样阅读计算机科学论文！”他笑了。“在那之前，我一直认为论文中的文字是数学的填充物……这很尴尬，因为我写的东西毫无意义。”


    两人开始交谈。虽然开始很尴尬，两位导师意识到的共鸣显然存在。最终，两人决定向2013年神经信息处理系统会议（NeurIPS）提交提案，举办一场关于公平的研讨会。NeurIPS不同意。“组织者觉得没有足够的研究或材料，”哈特告诉我，“然后在2014年，我和梭伦聚在一起，说，‘好吧，在放弃之前，再试一次。’”他们给研讨会起了个新名字，并赋予它更广阔的使命：“机器学习中的公平、问责和透明”，简称FATML。这次NeurIPS同意了。当年在蒙特利尔举行的会议上，举办了为期一天的研讨会，巴罗卡斯和哈特介绍了会议情况，德沃克做了开场报告。


    哈特从普林斯顿毕业后去了IBM研究院。他继续在关注度不够的环境下呼吁公平问题。“作为计算机科学家，我必须同时做其他事情才能生存。在我的职业生涯中，这一直像一个次要项目。”值得称赞的是，IBM给了他很多自由，尽管他的热情没有引起广泛共鸣。“我在IBM的团队对这个话题并不特别感兴趣，”他说，“但其他人也不感兴趣。”


    两人在2015年再次聚首，并再次举办分会。“房间里挤满了人，”哈特回忆道，“人来得很多，但可以肯定地说，并没有引发革命。”他只能将大部分时间花在更传统的计算机科学上。又过了一年，他和梭伦第三次组织FATML。


    这一次情况不同了，哈特说，2016年“是它开始爆发的一年，是每个人都开始关注的一年”。数学家兼博客作者凯西·奥尼尔（Cathy O’Neil）曾在2014年的第一次会议上发表演讲，她在2016年出版了畅销书《算法霸权》，讲述了粗心（或恶意）使用大数据可能引发的社会问题。一系列令人震惊的选举结果，嘲弄了全世界民意测量专家的共识，动摇了人们对预测模型可信度的信心；与此同时，像剑桥分析这样的数据驱动型政治分析公司所做的事情，提出了机器学习被用来直接影响政治的问题。像脸书和推特这样的平台在如何——以及是否——使用机器学习来过滤向数十亿用户推送的信息更是被推上了风口浪尖。ProPublica的一组记者经过一年艰辛的数据清理和分析工作后，公开了他们对美国最广泛使用的风险评估工具之一的研究结果。


    公平不再只是一个问题，它正在成为一场运动。


    ## 公平的不可能性


    康奈尔大学的计算机科学家乔恩·克莱因伯格（Jon Kleinberg）和芝加哥大学的经济学家森迪尔·穆莱纳坦（Sendhil Mullainathan）从2012年开始，一直致力于利用机器学习分析审前羁押决定，将人类法官与预测性机器学习模型进行比较。克莱因伯格说：“部分目的是思考在种族不平等的背景下，算法工具对此会有何影响。之前我们已经进行了大量思考。然后ProPublica的文章出现了……社交媒体很快开始大量转发。这的确引起了广泛关注。我们觉得，‘他们触及到了某种东西……值得我们深入研究，弄清楚这与我们一直在思考的主题有什么关系’。”
    ^([^(144)](#fn144))


    在匹兹堡，卡内基·梅隆大学的统计学家亚历山德拉·库尔德科瓦（Alexandra Chouldechova）自2015年春季以来一直在与宾夕法尼亚州量刑委员会合作，开发一个可视化仪表板来分析风险评估工具的各种数学属性。“我越来越关注这些问题……了解各种公平概念的分类标准以及它们的关系，”她说，“当时我还在做其他项目……我一直在和资深同行讨论，或许可以写一篇关于风险评估工具验证思路的论文——我们做了文献综述——然后ProPublica的报道引起了轰动。我认为这确实推动了许多人对该领域的思考。”
    ^([^(145)](#fn145))


    相同的故事正在这个国家的另一边上演。斯坦福大学的博士生萨姆·科贝特——戴维斯（Sam Corbett-Davies）本来“打算做机器人，这对于计算机科学专业很自然”。一年后，他发现自己一点也不喜欢这个，“同时却痴迷于阅读美国公共政策。我当时想，‘必须找到一种方法，把我的专业技能和对政策的关注结合起来’”。
    ^([^(146)](#fn146))


    ProPublica强调了COMPAS所犯错误的**类型**，并凸显了这样一个事实，即它似乎一直在高估没有再犯的黑人被告的风险，同时低估再犯的白人被告的风险。北点强调了**错误率**，而不是错误类型，并强调该模型对黑人和白人被告的预测同样准确，此外，对于从1到10每一个风险分值，COMPAS都有“校准”：相同分值的被告有相同的再犯概率，与种族无关。于是，COMPAS是否“公平”的问题归结为公平的两种不同数学定义的冲突。


    科学中经常会发生这种事情，某个想法或见解的时机已经成熟，以至于一群人几乎异口同声地提出。


    出现了3篇论文。 ^([^(147)](#fn147))


    克莱因伯格表示，在确定了ProPublica对公平的定义（即没有再犯的黑人被告被误判为高风险被告的可能性几乎是白人被告的2倍）是争论的关键之后，“我们可以将其与人们更关注的其他定义进行对比，并问一问，这些定义在多大程度上是兼容的？”


    “答案是，它们不兼容。”


    除非黑人和白人被告碰巧有相等的“基率”，也就是说，碰巧实际上再犯的概率完全一样，才有可能同时满足ProPublica和北点的标准。否则，根本不可能。


    这与机器学习无关，也与刑事司法本身无关。克莱因伯格和他的同事写道：“在对基率不同的两组进行风险评估时，结果就会是这样”。 ^([^(148)](#fn148))


    库尔德科瓦分析的结果也一样：一个经过校准的工具，“如果不同群体的再犯发生率不同，就不可能有相同的假阳性率和假阴性率”。


    “所以不可能同时满足这些，”她说，“这是普适原则，但在这种情况下，它会引导你得出有趣的结论，而这会对现实世界中的风险评估产生影响。” ^([^(149)](#fn149))


    其中一个影响是，如果**任何**模型都无法同时满足一组可取的标准，那么任何风险评估工具只要曝光，**肯定会**发现一些值得上头条的可恶之处。


    正如科贝特——戴维斯解释的，“就ProPublica所认为的偏见而言，不存在他们找不到偏见的世界。不存在这篇文章挑不出毛病的算法，不存在这种可能的COMPAS”。
    ^([^(150)](#fn150))


    具有讽刺意味的是，在对布劳沃德县数据的分析中，科贝特——戴维斯发现，COMPAS**没有**根据性别进行校准。“风险评分为5分的女性再犯的概率同风险评分为3分的男性差不多，”他说，
    ^([^(151)](#fn151))


    这种不可能性的冰冷数学事实也意味着，这些问题不仅对风险评估的机器学习模型有影响，对**任何**分类方式都有影响，无论是人**还是**机器。正如克莱因伯格所写的：“原则上，任何风险评分天生都会被批评有偏见。无论风险评分是由算法还是由人类决策者确定，都同样如此。”
    ^([^(152)](#fn152))


    既然已经明确了，这些不同的、看似同样直观的、同样可取的公平衡量标准无法调和，并且传统的人类判断在这方面也不会做得更好，另一个问题就显现出来了。


    现在怎么办？


    ## 不可能之后


    我问克莱因伯格，他如何看待自己的不可能结果，以及他认为这表明我们**应该**做什么。“我对此没有什么特别想说的，”他说，“我想这得依情况而定……这些定义都重要，哪个更有分量取决于你工作的领域。”


    诚然，在不同领域，考量的重点有根本差异。例如，**贷款**审核在许多重要方面就不同于刑事司法。拒绝向**本来会**还钱的人提供贷款不仅意味着贷款人失去了利息收入，还可能对借款人有严重影响：有一栋房子他们无法购买，有一项业务他们无法启动。另一方面，犯相反的错误——借钱给**不**还钱的人——可能对贷款人只会有金钱损失。也许这种不对称会改变我们对这种情况下公平的意义的理解。也许我们想确保两个不同群体中所有有信誉的借款人都有同等机会获得贷款，即使数学告诉我们，例如，这样不仅贷款人的利润会减少，而且一个群体中**不应**获得贷款的人比另一个群体多。
    ^([^(153)](#fn153))


    然而，在刑事司法背景下，特别是暴力犯罪，假阳性（“高风险”的人没有再犯）**和**假阴性（“低风险”的人再犯）都会严重损害权益，因此权衡可能会有很大不同。


    例如，科贝特——戴维斯认为，在风险评估背景下平衡假阳性率——确保**不会**再犯的被告，无论是黑人还是白人，都不会被关押——只要不同种族的实际犯罪率不同，就意味着对不同种族的被告适用不同标准。例如，这可能意味着关押所有风险为7或更高的黑人被告，但白人被告只要风险为6或更高就会被关押。他说，这样做“可能违反了第十四修正案的平等保护条款”。
    ^([^(154)](#fn154))


    实际情况还要更糟。“因为在关押低风险被告的同时，释放了一些相对高风险的被告，被释放的被告犯下的暴力犯罪将会增加。因为犯罪通常发生在社区内部，不会跨社区，所以这种犯罪将集中在少数族裔社区，受害者也将提起第十四修正案的诉讼。”
    ^([^(155)](#fn155))


    不可能性的证明也表明，平衡假阳性和假阴性率意味着放弃校准。校准是确保对于相同的风险评分，被告再犯的概率也相同，无论性别或种族。科贝特——戴维斯说：“没有校准，就不清楚风险评分是什么意思。所以如果你问我，‘这个被告有多危险？’我说，‘风险为2’，你说，‘这是什么意思？’我说，‘好吧，如果是男性，意味着有50%的概率他们会再犯；如果是女性，就意味着有20%的概率会再犯——你可以看到“2”是怎么失去意义的’。”
    ^([^(156)](#fn156))

