    年，在“TeX 的错误”中，高纳德自己说这是“霍尔（C. A. R. Hoare）的名言”。然而，似乎没有任何证据表明是霍尔说的。当霍尔本人在 2004 年被问及时，他说他“不记得”这句话是从哪里来的，认为可能是埃德格·迪克斯特拉（Edsger
    Dijkstra）说过诸如此类的话，并补充说，“我认为你假设这是常见的文化或民间说法是公平的”（汉斯·格维茨，“过早优化是万恶之源”，`https：//hans.gerwitz.com/2004/08/12/premature-optimization-is-the-root-of-all-evil.html`）。高纳德在
    2012 年承认，“我确实说过‘编程时过早优化是万恶之源’之类的话”（马克·哈里森，“唐纳德·努斯关于 TAOCP 的说明”，`http：//codehaus.blogspot.com/2012/03/note-from-donald-knuth-about-taocp.html`）。这句话十有八九就是他说的。↩


