  md: '通过上述分析可知，优化双门平仓仓库已成为现阶段推动我国危险品仓库发展的关键。当前，双门平仓仓库的发展主要有两个方向：第一个方向是，将包装危险品的平仓仓库推倒，在原址照搬发达国家立体危险品仓库的经验，建设立体仓库。第二个方向是，通过几何结构创新和技术创新优化双门平仓仓库，在不降低安全水平的前提下提升作业效率。考虑到我国与发达国家在经济条件上的不同，以及我国危险品仓储需求具有周期性强、需求集中的特点，著者选择第二个方向进行研究。在上述背景下，著者对包装危险品的平仓仓库的几何结构进行了预研，提出了“互通危险品平仓仓库”、“分区危险品平仓仓库”和“环岛危险品平仓仓库”三种新型仓库。本书的意义在于，面向中国数量最多的双门平仓仓库，研究其几何结构优化，以及结构优化带来的作业优化、仓储管理等问题，为仓储事业的发展提供支撑。为了将本书的框架介绍得更清楚，下面我们对仓储行业在发展中存在的矛盾进行一般性分析。


    # 1.3 危险品仓库的主要矛盾


    通过调研发现，我国现阶段的危险品仓储存在着很多问题，各种矛盾相交织。其中既存在着危险品仓储供给能力较弱与危险品仓储需求较强的矛盾，也存在着危险品仓库建设的固定成本较高与社会仓储需求周期性较强的矛盾，以及高租金与高空置率同时存在，优质仓库供不应求与大量落后基础仓储设施空置的矛盾。特别地，21
    世纪以来，中国危险品产量已连续多年居世界领先位置。国家统计局数字显示，2017 年，中国生产硫酸 8 694 万吨、烧碱 3 365 万吨、纯碱 2 677.1
    万吨。上述几种是被列入常规工业品统计项目的危险化学品，经过多年的高速发展，中国的主要危险品生产量均居世界首位。目前，危险品生产行业产值均呈现上升态势。与此同时，我国的危险品仓库在同时期没有实现同步增长，跟不上我国危险品物流行业的整体增长步伐，这种仓储供给与仓储需求发展的不同步和脱序，是我国屡屡发生危险品仓储安全问题的根源。正是这种发展的不同步造成了我国危险品仓储行业对效率、成本和安全之间辩证关系的失焦。


    在危险品仓储的供给出现短缺的背景下，为了贯彻国家对危险品仓储企业的安全生产政策，维护群众的生命和财产安全，在较低的生产能力条件下，被调研企业经常牺牲生产成本和效率以保证生产安全。然而，这种对生产成本和效率的牺牲有反弹的空间及可能。一方面，危险品仓储企业的内部收益率普遍不高，特别是国有企业的内部收益率更低；另一方面，危险品仓储市场的周期性较强，且在每个周期里有明显的淡季和旺季交替。在淡季的时候，企业处于亏损状态；在'
  merge: -1
  img_proc: true
- pgno: 13
  md: '旺季的时候，企业可以获取保证企业生存的利润。然而，由于部分企业的管理水平和智能化水平较低，经常不能将生产资源配置到最有效率的部门，造成即使是在旺季也难以赢得足够的生产利润。企业的偏好是多样的，在不断积累的运营压力下，一部分仓储企业或仓储员工在作业中出现了透支安全要素的情形。由于信息的不对称性，这种对安全要素的透支经常得不到纠正。按照机会成本的原理，这种微观环境下的个别透支将在宏观上产生蔓延。当一个危险源发生且得不到纠正时，另一个危险源就会发生。当作业环境逐渐恶化时，良币就会被恶币驱离。当危险源达到临界数量时，就会带来一定概率的事故，进而为危险品仓储企业的管理带来风险。正是由于这一机会成本的存在，即使我国有着非常严格的消防安全生产检查，每年依然有严重的仓库爆炸事故发生。著者在广泛调研的基础上发现了“追求绝对安全的背景下丧失安全”的规律，并将其命名为“危险品仓储悖论”。例如，在叉车取货后离开货位或卸货前对准货位，均需要防止刮碰堆垛及危险品。然而由于工作的时效性及对利润的追求，不少企业在作业时出现破坏危险品包装的情形，就是这一悖论的结果。


    从本质上讲，“危险品仓储悖论”是我国相对落后的危险品仓储生产水平不能满足快速增长的仓储需求造成的。这一悖论在本质上与工业生产上常用的海恩法则一致。海恩法则即每一起严重事故的背后，必然有
    29 次轻微事故和 300 起未遂先兆及 1 000 起事故隐患。在落后的生产力水平条件下，部分仓储企业或员工将安全、效率与成本对立了起来，没有注意到或不愿意注意到安全、效率与成本之间的联系，容易造成危险源处理不彻底、隐患常态化等现象。为了破解“危险品仓储悖论”，企业界亟须借助现代科技对危险品仓库实施改革，将绝对安全与相对安全相结合，推出危险品仓储的多级安全控制，在不降低安全水平的前提下，提升企业运营效率，实现危险品仓储管理的帕累托改进。可以说，借由现代科技推动危险品仓储企业的智能化，是我国危险品仓储企业发展的唯一出路。不幸的是，由于危险品仓库的封闭性和危险品仓储学科的小众性，故关于危险品仓储的学术成果较少且引用率较低，国际上最顶尖的学术期刊对相关研究成果也不太重视，因而危险品仓储行业的理论研究水平较低。综合来讲，我国的危险品仓储行业正处于非常危险的境地。


    雪上加霜的是，在相对落后的危险品仓储行业，在较低的理论水平指导下进行仓储企业改革，非但会为决策者带来极大的风险，也会使当地主管部门承担极大的政治责任。也就是说，我国的危险品仓储行业存在着“亟须提高仓储供给与相对落后的仓储管理水平”的尖锐矛盾。尤为关键的是，在大数据、云计算、人工智能的推动下，社会正以前所未有的速度向前发展（图
    1.1 和图 1.2），危险品仓储业的发展速度已严重落后于社会进步的速度[48]。这种不匹配、不协调的发展速度进一步放大了危险品仓储行业的主要矛盾。为了解决这样的矛盾，仓储企业'
