    # 2. 四门危险品仓库设计方案


    传统双门危险品仓库的运行效率较低。首先，在双门条件下叉车的运行路线较长。以危险品入库为例，当叉车将集装箱上的危险品取出并运送到指定货位后，叉车在双门房间内很难掉头，因此叉车需要从另一个门驶出仓库，并从仓库外的道路上返回集装箱，造成了较长的叉车运行线路。叉车运行线路见图
    2.1 虚线部分。其次，在双门条件下的危险品仓库不能实现同时出入库作业，每次只能服务一个集装箱，难以满足客户的时效性要求。在常规双门仓库中，危险品仓库各房间之间的墙体对叉车作业有限制性功能。事实上，这些墙体也能起到建设性功能。为了使这些墙体具备对叉车作业的建设性功能，本书借鉴
    40 英尺集装箱与 20 英尺集装箱的关系，在墙体上设置隔离门，设计了四门危险品仓库。新提出的四门危险品仓库设计方案见图 2.2。


    ![](img/82f0a1e9c99ca5f51f0110a293ae6965_22_1.png)


    # 图 2.2 四门危险品仓库设计方案'
