  md: '# 第 5 章 多类型危险品平仓仓库仓储需求管理


    客户需求是危险品仓储企业存在的唯一理由，所有客户的个体仓储行为聚集为仓储行业的仓储需求。当前，我国的危险品仓储供给远远落后于仓储需求，且仓储类型单一，难以满足客户的多样化仓储需求。为了在当前有限的仓储资源条件下使仓储需求和仓储供给达到平衡，促进我国危险品仓储行业的发展，我们应该主动加大仓储需求管理，改变被动的仓储供需关系。由于我国土地资源越来越稀缺，大规模的危险品仓库建设已经不可能实现。在仓储需求近期很难被替代的情况下，对仓储市场进行精细化分类，增加仓储方案选项，为不同类型的客户提供针对性更强的服务，已成为一项非常重要的仓储需求管理手段。特别是对仓储作业时效性较强的客户，由于这类客户对仓储价格的敏感性较低，我们通过互通危险品仓库和环岛危险品仓库实施以价格换效率，为该类客户提供优先权，推进仓储资源的更有效配置。


    从根本上讲，客户的多样化仓储需求决定了危险品仓库的几何结构多样化前景。在以客户为中心的仓储企业竞争中，危险品仓库几何结构的差异化是每一个仓储企业需直面的必考题。通过电动隔离门的设置，本章为危险品仓库开辟了一条实现差异化的道路。在危险品仓库几何结构差异化的条件下，本章研究了不同仓储需求的管理问题，为互通危险品仓库和环岛危险品仓库的运营提供智力支持。具体地，本章提供了两个研究危险品仓储需求的案例。首先，本章从不确定决策的角度研究了压仓条件下的危险品仓库出入库作业问题。其次，本章从经济学的角度研究了仓储货位动态布设条件下的危险品仓储成本计算问题。通过压仓条件下仓储作业问题的研究，我们给出了最特殊最困难环境下的仓储企业作业方案。通过不同类型危险品仓库作业成本的计算结果，我们理清了不同类型仓库的特点，进而根据客户特点为客户提供个性化服务。本章各节主要研究内容如下。5.1
    节分析了现阶段国内外危险品仓储管理现状，并指出了常规双门危险品平'
