    +   1. 研究问题的符号化表示


    在互通仓库设计思路的指导下，可将常规的双门仓库通过设置隔离门转化为互通仓库。为了研究内容的一般性，本节只考虑出库点大于入库点的情况，出库点小于或等于入库点的情况可以做类似处理。记
    C1 和 C3 为入库集装箱，C2 和 C4 为出库集装箱。假设 C1 和 C3 对应 m 个入库点，记为 p1, p2, ..., pm，C2 和 C4
    共对应 n 个出库点，记为 q1, q2, ..., qn，其中 m 小于 n，并记 M = {1, 2, ..., m}，N = {1, 2, ...,
    n}。因此整个危险品出入库作业过程中共有 m 条出入库路径，n - m 条出库路径。对任意的 i ∈ M, j ∈ N，假定叉车先从 C1 出发，经路径 l_C1,pi
    将 C1 的危险品送达给定的 pi (i ∈ M)，随后经路径 l_pi,qj 在 qj (j ∈ N) 处取运往 C2 的危险品，继而经路径 l_qj,C2
    将危险品运抵 C2，并经路径 l_C1,C2 空驶返回 C1。记这样的出入库往返路线为 S_pi,qj。'
