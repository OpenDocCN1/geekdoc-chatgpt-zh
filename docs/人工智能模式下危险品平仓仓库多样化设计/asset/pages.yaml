- pgno: 11
  md: '仓库管理而言，业界亟须挖掘危险品仓库的仓储潜能，而挖掘潜能的关键即对危险品仓库的结构进行改造。


    （4）危险品仓储企业需在科学发展观的指引下，勇于探索安全因素的量化办法，推出行之有效的安全度计算公式，切实实现危险品仓储活动的分级安全控制。在对安全度的研究中，仓库要完成对新技术的驾驭和整合，并将新技术锤炼成创造价值的源泉。


    （5）危险品仓储企业需在科学发展观的指引下，坚持技术改革与对外开放，彻底扭转部分危险品仓储企业在管理上闭门造车的局面。仓储企业需加强与国际一流企业的交流，投入资源，坚持开发仓储管理核心技术，开发新商业模式、新业务模式和新管理模式。


    （6）危险品仓储企业需在科学发展观的指引下，坚持“质量互变规律”，允许一部分仓库搞试点，允许一部分仓库对几何结构进行改造，进而由点及面，由局部到全国，推动仓储企业的多元化发展，以及仓储企业在管理上的升级，最终建设成行业内统一的危险品仓储需求管理平台。


    （7）学术界对危险品仓库几何结构的研究基本上是一片空白。截至 2022 年，在 SCI（Science Citation Index，科学引文索引）、EI（Engineering
    Index，工程索引）、CNKI（China National Knowledge Infrastructure，中国知网）等数据库里很少有危险品仓库管理与优化的文献。在此背景下，仓储企业只能在国家规范的指导下凭经验去管理危险品仓库，由于国家规范不可能面面俱到，故危险品仓库的管理与社会需求之间存在脱节。在明显落后于时代的危险品仓储领域，我们国家的知识精英若要对本国危险品仓库的建设做出贡献，需要自己去实践，去探索，去发现。知识精英非但要走出实验室，更要深入群众，去从事有现实意义的工作。


    基于上述调研结论，著者确立了智能化危险品仓库的研究目标，且以中国最常见的双门危险品平仓仓库为改造与优化对象，紧紧围绕包装危险品平仓仓库的几何结构，研究危险品仓库的多样化发展问题。通过危险品仓库几何结构的多样化建设，为仓储企业运营的差异化和信息化提供了可能，进而绘制了一幅危险品平仓仓库智能化改造的路线图。具体地，著者发现双门平仓仓库在管理上有以下问题：①双门包装危险品平仓仓库的作业效率较低，劳动工人的作业强度较大。②双门仓库中叉车线路规划的随机性强，在实践上有规范化需求。③在双门平仓仓库作业中，企业对安全缺乏辩证认识，甚至部分企业盲目追求绝对安全，导致安全与效率、成本、碳排放等其他指标事实上割裂对立。④仓储条件的差异化是仓储行业发展的动力。由于双门危险品平仓仓库型单一，客户的需求、政府的政策、仓库管理层的意见及仓储工人的想法在实现上经常出现困难。这种困难制约了仓储企业的发展，是造成我国危险品仓储行业落后的根源。'
