  md: '种多维离散粒子群算法，并将其应用到电路优化上，该文以实例说明了离散粒子群算法计算简单、迭代速度快的特点[65]。Xiong 等将离散粒子群算法与神经网络结合起来，并给出了一种区间数预测模型，并通过实例验证了预测模型的有效性[66]。Pradee
    pmon 等提出了一种改进的离散粒子群算法，并利用该新提出的算法求解二次指派模型[67]。上述工作从整体上验证了粒子群算法收敛速度快的优点，并且适合于求解二次指派模型。


    基于上述研究成果，结合作者们对危险品仓库的实际调研，本节对危险品仓库的几何结构进行了研究。研究表明，危险品仓库在几何设计上的突破能释放危险品仓库的潜能，进而提升危险品仓库的仓储作业效率。具体地，本章从建筑平面布置的角度入手，提出了四门危险品仓库的设想，以求在保障安全的前提下，提高危险品仓库的运营效率和管理水平。危险品四门仓库，即将两个双门仓库中的墙以及靠墙一侧的危险品货位撤除，形成叉车在仓库内运行的通路。接下来将以提升仓库运营效率为目标，具体介绍四门危险品仓库设计思路。


    # 2.1.2 四门危险品仓库设计思路


    # 1. 现有危险品仓库的作业特征


    调查显示，平仓是我国主要的危险品仓库类型，老企业使用的居多，其具有储存品种多、批量小、储量大、批次多的特点。从建筑面积来看，危险品仓库可以划分为三种类型，即大型仓库（建筑面积在
    9 000 平方米以上）、中型危险品仓库（建筑面积为 550~9 000 平方米）、小型仓库（建筑面积在 550 平方米以下）。仓储作业指的是产品从入库到出库的全过程，主要包括入库作业、在库管理及出库作业这三方面的内容，因此仓库的出入库作业是仓库效率把控的关键环节。现有国内危险品仓库主要是双门仓库，即两侧门口都可以停靠集装箱，仓库中间有一个供叉车运行的通道，通道两边为货物堆垛的货位。常规双门危险品仓库的示意图见图
    2.1。在危险品出入库作业中，主要的运载工具是叉车，主要的操作步骤包括起步、直线行驶、转向、制动、叉取作业和装卸作业。其中，叉取作业和装卸作业的时间取决于货物的种类，有时候难以精确掌握。叉车出入库作业的能源消耗主要集中在直线行驶、叉取作业和装卸作业三个环节，由于叉取作业和装卸作业两个环节的能源消耗比较固定，而直线行驶有优化的空间，本节将重点放在直线行驶的研究上。通过危险品仓库几何结构的改造为叉车提供更多的行驶方案，利用最优化技术实现叉车直线行驶的能耗降低，进而降低危险品仓储作业成本。我们接下来将重点阐述四门危险品仓库设计方案。'
