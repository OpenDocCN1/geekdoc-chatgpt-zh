    l_{2i}) | i=1, 2, \cdots, N\}$，$N$ 是一次仓储作业任务中所有可能的仓储作业对数量。记第 $i$ 对仓储作业链所对应的重点监控时间长度为
    $t_i$，记两辆叉车在仓储作业重点监控时段的平均距离为 $d_i$，记 $t_{\min} = \min_{i \in \{1, 2, \cdots, N\}}
    t_i$， $d_{\min} = \min_{i \in \{1, 2, \cdots, N\}} d_i$， $t_{\max} = \max_{i \in
