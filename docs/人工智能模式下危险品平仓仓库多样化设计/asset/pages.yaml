    +   步骤 2.12: 迭代停止，得到最优解。记最优解为 \( l_2^* \)，记 \( l_2^* \) 对应的原函数目标函数值为 \( \gamma_2
    \)，记共享目标函数值为 \( \gamma_2'' \)。


