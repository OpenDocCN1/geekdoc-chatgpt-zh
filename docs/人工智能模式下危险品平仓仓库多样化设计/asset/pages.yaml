    # 4. 结论分析


    通过以上研究可以看出，将遗传算法与 BP 神经网络算法有机地融合，可以有效弥补 BP 神经网络算法在权值和阈值选择上的随机性缺陷，充分利用遗传算法的全局搜索能力和
    BP 神经网络算法的局部搜索能力，增强网络的智能搜索能力。具体地，我们得到的主要结论如下。


    第一，本节给出了一种带有隔离门的智能危险品仓库设计方案，通过隔离门可灵活地给出双门仓库、四门仓库、六门仓库、八门仓库等，为仓储客户提供更多的选择。


    第二，本节以低成本和高效率为目标，以六门仓库为样本，分双叉车和三叉车两种情况给出了叉车线路多目标规划模型。在更顺畅的出入库作业环境下，危险品仓库的出入库作业也会更加安全，因此，模型中的相似度不仅反映叉车运行的效率，也反映了出入库作业的安全。也就是说，本节给出的模型对出入库作业的成本、效率和安全都有考虑。


    第三，本节经过计算给出的是叉车运行路径，即闭环路径集合。至于闭环路径中各线路的运行顺序则由现场管理人员确定。也就是说，本节给出的模型的实施需要较好的人机交互。


    第四，本书为解决互通危险品仓库条件下叉车的运行路径规划问题，以遗传算法和神经网络为工具提供了一种启发式算法。


    第五，本书借用上海某危险品物流有限公司的实际仓库参数，为模型提供了一个仿真算例。该算例的计算结果表明了模型的有效性和可行性。'
