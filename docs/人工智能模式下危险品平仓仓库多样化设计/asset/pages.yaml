  md: '容。在参考上述研究成果的基础上，我们围绕带有隔离门的互通危险品仓库，进一步研究了互通危险品仓库中隔离门的使用规律，以提高危险品仓库的运营效率和管理水平。在上述思路的指导下，本书做了一系列研究工作，其创新点主要有如下三点。首先，建立了互通危险品仓库使用架构，为互通危险品仓库的使用提供了思路。其次，提出了基于
    TOPSIS-超立方体分割的多属性决策方法解决未提供方案优选指标权重时的仓储方案选择问题。最后，提出了一种带参数的犹豫距离集算法解决提供权重信息的仓储方案优选问题。接下来，我们介绍多指标下的互通危险品仓库隔离门使用方案优选问题。


    # ## 2.3.2 多指标下的互通危险品仓库隔离门使用方案优选问题


    为了安全、高效地使用互通危险品仓库，我们在调研的基础上提出了互通危险品仓库的概念，即将常规危险品双门仓库打通，安装可推拉的隔离门，并记一个双门仓库空间为一个房间。在调研的基础上，本节制定了隔离门和叉车的使用原则：首先，隔离门的使用与否取决于客户存储量和叉车数量；其次，为了避免叉车运行的安全问题，本节制定了“叉车在仓库内顺时针方向依次行驶，且每个房间不能同时出现两辆或以上数量叉车”的叉车运行原则；最后，由于危险品出入库作业包含危险品的包扎、装卸等人工操作环节，且难以确切控制上述环节的作业时间，本节制定了“利用算法确定叉车运行路径集合，由管理人员决定或调整叉车运行路径的顺序”的出入库作业原则。


    互通危险品仓库的设计关键在于，在叉车数量充足的情况下，可以打开适当数量的隔离门。构建包含两个房间、三个房间或更多个房间的仓库。该策略不但能增加叉车的活动范围，而且可以实现多出入库任务同时进行，降低甚至消除常规双门仓库出库作业时造成的仓储设备及人力浪费。综上所述，常规双门仓库存储空间较大，但同一时间只能进行一项出入库活动，出入库效率较低，出入库设备难以协调使用；而新设计的互通危险品仓库虽然减少了仓库的平均存储空间，但其设计特别有利于特定危险品出库时的设备协调使用，并且对常规的多集装箱同时出库，同时入库，以及同时出入库作业都有效率提升作用。合理地使用互通危险品仓库能有效提高仓库运作效率和管理水平。


    # ## 2.3.3 互通危险品平仓仓库隔离门使用的多属性决策模型


