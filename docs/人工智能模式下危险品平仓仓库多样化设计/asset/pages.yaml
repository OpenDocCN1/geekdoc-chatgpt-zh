    \times r_p \times l_{C_1,p(x_1,y_1)}}{N_p^1} \times p[(x_1, y_1) \in K_5] \n (5.2)


    式 (5.2) 是一个在广泛调研的基础上提出的经验公式。公式中五个加成部分分别表示当入库集卡 C_1 在第 1 单元仓门外时，叉车选择第 1 单元~第 5
    单元五个内货位作为入库货位所行驶的路程期望。另外，本节中的 p(·) 均由仿真得到。另外，N_p^k 的值根据 C_1 所对应单元的两个出入库门是否互通来变化。例如，方案一、方案二、方案三、方案六中
