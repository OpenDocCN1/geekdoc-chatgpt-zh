    # 3.4 本章 小结


    在提出了四门及互通危险品仓库的基础上，为了对两类新型危险品仓库的使用提供决策支持，本章以最优化理论为工具研究了四门危险品仓库及互通危险品仓库的仓储作业优化问题，并取得了一系列研究成果。


