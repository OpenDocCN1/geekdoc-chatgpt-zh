  md: '本书在安全建设方面提供了很好的经验借鉴。


    # 4. 危险品仓库叉车路径优化


    目前，国内外关于普通仓库车辆运行的研究较多，关于危险品仓库叉车路径优化的研究较少。例如，Zhou 和 Wang 提出了基于局部搜索的多目标优化算法来解决带有时间窗口的车辆路径优化问题，该算法为不同目标设计不同的局部搜索方法，用简单且高效的方法协同优化不同的目标[25]。Kovacs
    等通过考虑多个目标条件下的车辆线路问题，来提高司机协同性和到达时间一致性[26]。Malikopoulos 等提出了一种并联混合动力汽车中监控电源管理控制系统的方法[27]。Wang
    等探索了物流行业中带有同时送货和取件的时间窗口的车辆路径优化问题，该研究揭示了现实仓储环境中仓储目标的特点[28]。Azizipanah-Abarghooee
    等为插电式电动汽车的充放电节点设计了模糊逻辑控制器[29]。Lu 等为并网模式下的微电网提出多目标最优调度模型，并考虑了微电网系统的作业代价和环保代价[30]。Zhang
    等利用多目标优化算法计算电动汽车的最佳混合储能大小[31]。上述成果在自动化建设方面为本书提供了很好的经验借鉴。


    # 5. 模糊多属性决策理论


    近年来，不确定多属性决策理论，特别是模糊多属性决策理论的发展，为研究危险品平仓仓库的几何结构优化提供了有力的工具。由于模糊数学在缺乏数据支撑参数的估算上可以发挥较好的作用，我们关注了模糊参数的赋值与运算问题[32、33]，并重点关注了带有直觉模糊参数、犹豫模糊参数、毕达哥拉斯模糊参数或中智模糊参数的多属性决策问题[34-37]。在实际应用上，模糊决策理论在交通控制、物流方案优选、工程建设等领域都取得了比较好的效果[38-40]。另外，著者预研了模糊决策理论在危险品仓库的结构改造与优化问题[41-43]，夯实了本书的理论基础。


    # 6. 智能危险品仓库


    目前国内外关于智能仓库的研究主要侧重于存储常规商品的仓库。例如，Tse等研究了智能仓库中拣货与货物包装的自动化实现途径[44]；Pulungan 等从控制的角度研究了智能仓库仓储作业的主要步骤[45]；Mao
    等利用分布式存储云模型，以及物联网技术采集的数据，提出一种基于云模型的智能仓库管理系统建设方案[46]。同年，李明对一般仓库的智慧拆零拣选技术进行了详细介绍，并对阵列式自动拣选系统的配置优化方法进行研究[47]。与存储常规商品的智能仓库研究相比，现阶段国内外危险品仓库的智能化水平较低，学者们对智能危险品仓库的研究较少，危险品仓库智能化建设是整个物流领域的洼地。'
