    # 3.2.2 影响危险品出入库作业的三个关键指标


    本节通过具体分析危险品出入库作业过程和叉车运行的特点，提出了影响危险品出入库的三个关键指标。实地调研发现，互通仓库所有的出入库任务都由叉车来完成，因此叉车的运作效率制约着整个仓库的工作效率。同时，叉车执行出库任务时去的过程是空载，执行入库任务时来的过程也是空载，为了缩短叉车运行的无效路程，可使叉车交替进行出入库作业。当两个集装箱卡车同时进行出库与入库危险品作业，且出入库活动时效性较强时，我们安排多辆叉车进行出入库作业，且在仓库外部始终有一辆叉车等待入库。此外，互通仓库的布局和线路宽度虽然可以保证两个叉车在同向或相向运行阶段的正常行驶，但安全起见，本节在调研的基础上提出在同一时间，在同一双门规制的仓库内，仅允许有一辆叉车作业的要求。因此叉车每次入库作业的运行线路应尽可能多样化，以使得线路间相似度系数较小，供现场管理人员灵活选择。当路径长度足够多样化时，现场管'
