    \( f(i) = M \times f(i) \times d_{share} \times (d_{deci})^{-1} \) (2.8)


    其中，\( M \) 表示增强适应度的一个常数，取值 1 000。可见，若新粒子进入早熟区，越靠近收敛中心其共享适应度就越大，新粒子就会快速逃离早熟区。最终两个群体在各自的最优解引导下继续搜索。当未达到迭代总数时，若新粒子找到另一个局部最优
    \( g_{new}^{best} \) 且 \( g_{new}^{best} > g_{old}^{best} \)，则旧群体和新群体一起追随 \( g_{new}^{best}
    \)；反之若 \( g_{new}^{best} < g_{old}^{best} \)，则再次初始化新群体直至达到算法终止的条件。该算法具体步骤如下。


