    ```

    {

    \begin{array}{l}

    \min \gamma = \sum_{i_t=1}^m \sum_{j_t=1}^m \sum_{k=1}^m \sum_{j_f=1}^m \left(
    x_{i_t i_k} x_{i_k j_f} r^* \left( (p_{i_t}, q_{j_t}), (p_{i_k}, q_{j_f}) \right)
