  md: '# 4. 基于仿真数据的多属性决策模型


    根据我们前面讨论的要素可以得到，危险品仓库的综合效用可定义为 \( U = f(c_1, c_2, E) \)，其中，\( c_1 \) 为仓库短期成本，\(
    c_2 \) 为仓库长期成本，\( E \) 为仓库运作效率。由于仓库效用和成本呈负相关，和效率呈正相关，故设置与不设置分区规则的综合效用函数定义如下。首先，分区时仓库综合效用为


    \( U_1 = 1 - [w_1 \times c_{11} + w_2 \times c_{12} + w_3 \times (1 - E_1)] \)


    不分区时仓库综合效用为


    \( U_2 = 1 - [w_1 \times c_{21} + w_2 \times c_{22} + w_3 \times (1 - E_2)] \)


    令 \( U_1 - U_2 > 0 \)，可得


    \( (c_{11} - c_{21}) \times w_1 + (c_{22} - c_{12}) \times w_2 + (E_1 - E_2) \times
    w_3 > 0 \quad (4.11) \)


    令 \( U_1 - U_2 < 0 \)，可得


    \( (c_{11} - c_{21}) \times w_1 + (c_{22} - c_{12}) \times w_2 + (E_1 - E_2) \times
    w_3 < 0 \quad (4.12) \)


    至此，根据式（4.8）可得选择仓库分区时的决策偏好空间，根据式（4.9）可得选择仓库不分区时的决策偏好空间。


