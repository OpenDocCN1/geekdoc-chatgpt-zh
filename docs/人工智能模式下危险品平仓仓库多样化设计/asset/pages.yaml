    通过 4.2 节的研究，我们主要得到如下三点结论。第一，在环岛危险品仓储活动中，从空间的角度讲，危险品仓库管理主要有设置分区管理规则和不设置分区管理规则两种类型。第二，该节给出了环岛危险品仓储作业的安全红线概念，并得出了安全红线条件下的安全度公式。第三，该节在理论上的最大创新是将迷宫寻径算法与效用理论结合起来研究危险品出入库问题。


