    第四，有关危险品仓储的行业标准条例有待完善。

    危险品仓储业是一个相对独立的产业，在向现代化、专业化标准发展的过程中，它的独立性、专业性、特殊性越发突出。然而，目前我国危险品仓储业缺少自身专业标准，缺乏发展规划。


    # 2. 国外危险品仓储管理现状


    首先，我们介绍美国在加强危险品风险预测和预防方面的经验。美国对于危险品实行了严格的风险管理计划条例，具体步骤如下：如果装置在生产过程中含有的危险有害物质多于
    140 磅（1 磅≈0.453 6 千克），那么必须执行危险品风险管理计划条例。该条例集中于降低有害化学物质暴露于社区带来的风险，同时将对环境的破坏后果减少到最小。风险管理计划条例需要对装有危险化学品的容器进行识别，并分析这些化学物质对周围社区的风险程度大小。风险管理计划条例主要包括事故原因分析、危险化学品的意外释放事故的历史记录、事故调查报告、预防事故发生的措施、危险化学品意外泄露的应急预案等[153]。


    其次，我们介绍英国在加强危险品规划管理方面的经验。英国危险品的管理部门主要由英国环境食品和乡村事务部、健康与安全执行局、环境署等十几个机构组成，在化学品的不同生命阶段扮演不同的管理角色。英国政府对于危险化学品规划的承诺是力争实现有效保护环境、谨慎使用自然资源、保持经济快速稳定增长、充分就业四个目标[153]。


    最后，我们介绍加拿大在强化化学品管理与立法方面的经验。加拿大化学品安全管理法令体系由联邦和省的法令组成。联邦法律主要有危害物品法令、危害物品管理条例、危害物品成分报告条例、危害物品资料审核法令、危害物品资料审核条例等。危害物品法令和危害物品管理条例规定，化学品销售单位或进口危险化学品单位，必须为使用化学品者提供符合标准的化学品安全标签。危害物品成分报告条例列出
    1 736 种有害化学品，只要一种化学品物质的有害成分是 1 736 种有害化学品之一，并且超过所列规定的浓度，相关部门就认定该化学品为有害物品，并给出符合标准的化学品安全标签[154]。


