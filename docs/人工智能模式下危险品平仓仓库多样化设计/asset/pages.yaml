  md: '神经网络算法是基于梯度下降法，通过计算目标函数对网络权值的梯度进行修正的。该算法虽然为训练网络提供了简单而有效的方法，但由于在训练过程中学习率为一个较小的常数，故存在收敛速度慢和局部极小问题。为寻求加速收敛的方法，本节将带自适应动量因子的
    BP 神经网络算法与特定随机次序学习算法结合，对标准神经网络算法进行改进，即在每一个训练循环中采取无放回策略从样本集中随机选取样本，并在加入一个训练样本之后立刻更新权值，且在调整权值的过程中加入自适应动量因子。在误差曲面的平坦部分，增大动量因子，可使权值更新向量获得较大的冲量，有助于权值逃离误差曲面的平坦区域，从而加速算法收敛。在误差曲面的陡峭部分，减小动量因子，减缓算法的不稳定性。误差曲面的陡缓程度可以用误差关于权值向量的梯度范数来表示。当梯度范数较大时，误差变化较快，误差曲面较陡；当梯度范数较小时，误差变化较慢，误差曲面较平坦。因此可根据误差关于权值向量的梯度的大小自适应调节动量因子，具体步骤如下。


    +   步骤 3.10：对数据样本进行预处理，标准化出入库点之间的距离。


