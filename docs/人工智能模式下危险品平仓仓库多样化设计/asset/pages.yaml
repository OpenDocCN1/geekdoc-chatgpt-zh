  md: '# 2. 未给定优选指标权重时的隔离门使用模型


    当决策者对决策问题缺乏结构性认识，未给定决策指标的权重信息时，本书认为权重向量 \( W = \{w_1, w_2, w_3, w_4\} \) 是四维超立方体
    \( V = [0,1]\times[0,1]\times[0,1]\times[0,1] \) 上的随机元素。这里需要指出的是，\( V \) 中分量之和不为
    1 的元素可作归一化处理，认为其等价于某个分量之和为 1 的元素。然后，本书借鉴群决策理论，基于 TOPSIS-超立方体分割方法对方案进行综合排序。TOPSIS-超立方体分割方法的思路如下。首先，定义给定仓储方案在各指标下的负理想值；其次，利用
    TOPSIS-超立方体分割方法得到权重向量集合；再次，计算各方案与负理想值的加权距离值，并通过比较各距离值得到每一个权重向量对应的最优存储方案；最后，统计支持每一个方案的权重向量数，并根据向量数的多少对给定的仓储方案排序，即可获得权重向量未知的情况下互通危险品仓库最优使用方案。需要指出的是，本节使用
    TOPSIS 数据的原因是将超立方体分割方法与经典 TOPSIS 方法对比。在上述思路指导下，具体的危险品仓储方案优选步骤如下。


    步骤 2.23: 根据决策者的具体要求将每个 \( w_i=[0,1](i=1,2,3,4)t \) 等分，进而各分割点组成集合 \( \left\{0,
    \frac{1}{t}, \frac{2}{t}, \cdots, 1\right\} \)，并且得到 \( V \) 上 \( t^4 \) 个点向量 \(
    (w_{1t_k}, w_{2t_k}, w_{3t_k}, w_{4t_k}) \)，其中，\( k=1,2,\cdots,t \)，记这些点向量的集合为
    \( P \)，\( P \) 上各分量之和不为 1 的元素做归一化处理，我们对其不做分别。


    步骤 2.24: 由于仓租费和油价的不稳定性，故空间成本和经济成本具有不确定性，因此令空间成本和经济成本的调整因子为 \( \omega_1 \)、\( \omega_2
    \)，记 \( m \) 为仓储作业可行方案数，通过实际调研得到决策矩阵 \( C \) 为


    ```

    \( C_{m \times 4} = \begin{bmatrix} c_{r1} & c_{sp1}(\omega_1) & c_{e1}(\omega_2)
    & c_{sa1} \\ c_{r2} & c_{sp2}(\omega_1) & c_{e2}(\omega_2) & c_{sa2} \\ \vdots
    & \vdots & \vdots & \vdots \\ c_{rm} & c_{spm}(\omega_1) & c_{em}(\omega_2) &
    c_{sam} \end{bmatrix} \)

    ```


    步骤 2.25: 计算仓储方案集的负理想点为


    ```

    \( C_{\max} = \left( \max_{i=1}^m C_{ri}, \max_{i=1}^m C_{spi}, \max_{i=1}^m C_{ei},
    \max_{i=1}^m C_{sai} \right) \) (2.13)

    ```


    并计算各决策方案与负理想点的距离为


    ```

    \( D_i = (d_{ij})_{j=1,2,3,4} = \begin{pmatrix} \max_{i=1}^m C_{ri} - C_{ri} &
    \max_{i=1}^m C_{spi} - C_{spi} & \max_{i=1}^m C_{ei} - C_{ei} & \max_{i=1}^m C_{sai}
    - C_{sai} \\ \max_{i=1}^m C_{ri} & \max_{i=1}^m C_{spi} & \max_{i=1}^m C_{ei}
    & \max_{i=1}^m C_{sai} \end{pmatrix} \) (2.14)

    ```'
