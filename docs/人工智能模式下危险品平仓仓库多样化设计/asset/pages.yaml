    # 5.4 本章小结


    为了帮助仓储企业提高服务客户的能力，本章分别以压仓条件下的互通危险品仓库、货位动态布设下的环岛危险品仓库为背景，对危险品仓库的仓储需求的管理问题进行了研究。


    5.1 节我们分析了现阶段的国内外危险品仓储需求情况，介绍了四种危险品平仓仓库，特别是三种新型危险品仓库的使用特点，给出了四种危险品平仓仓库的环境适用性介绍。与此同时，我们分析了三种新型危险品仓库在智能化建设中的优势，为危险品仓库的智能化建设夯实了物理基础。


    5.2 节我们给出了不同类型危险品平仓仓库的运营成本计算公式，为推断或进一步研究新型危险品仓库在市场经济中的应用前景夯实了基础。在掌握各种类型仓库的运营成本后，根据客户的个性化需求，仓储企业可以提供针对性更强的服务。另外，我们给出了叉车在不同类型仓库中行驶距离计算的经验公式。最后，我们通过一个仿真算例表明，该节给出的经验公式是有效的，仿真结果也表明，该节给出的仓储成本计算公式也是有效的。


    5.3 节我们研究了对危险品仓储企业最重要时段，即压仓时段的仓储规律，并得到如下两点认识。第一，该节给出了一种压仓背景下的危险品出入库作业方案优选模型是有效的。仓储企业可以根据该模型应对特殊时段的客户仓储需求。第二，该节将压仓环境下的危险品出入库作业分为两个层次，并分别建立了只考虑效率、安全、直接成本、直接机会成本的一级出入库方案优选模型，以及只考虑效率、安全、直接成本、直接机会成本和间接机会成本的二级出入库方案优选模型。分层次的模型反映了仓储企业在面对压仓时候为提高作业效率在空间上所作出的弹性压缩，并且将效率、安全和成本纳入统一的框架，给出了仓储作业安全因素的机会成本。'
