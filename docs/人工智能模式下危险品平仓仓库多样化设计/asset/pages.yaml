  md: '要条件，且第二类危险源出现的难易，决定事故发生的可能性的大小。为了尽可能降低危险品仓库的事故发生率，本书主要研究第二类危险源，并将研究重点放在减少叉车距离靠近的机会上。以上述理念为指导，在提出四门仓库设计的条件下，本节提出单叉车同时出入库的线路优化模型，并对模型的求解步骤、适用环境进行了详细的阐述与分析。记
    \( C_1 \) 为入库集装箱，\( C_2 \) 为出库集装箱。假设 \( C_1 \) 有 \( m \) 个入库点，记为 \( p_1, p_2,
    \cdots, p_m \)； \( C_2 \) 同有 \( m \) 个出库点，记为 \( q_1, q_2, \cdots, q_m \)，并记 \(
    M = \{1, 2, \cdots, m\} \)。假定叉车先从 \( C_1 \) 出发，经路径 \( l_{C_1, p_i} \) 将 \( C_1
    \) 的危险品运抵给定的 \( p_i (i \in M) \)，随后经路径 \( l_{p_i, q_j} \) 在 \( q_j (j \in N) \)
    处取运往 \( C_2 \) 的危险品，继而经路径 \( l_{q_j, C_2} \) 将危险品运抵 \( C_2 \)，并经路径 \( l_{C_1,
    C_2} \) 空驶返回 \( C_1 \)。同时，记任意两点 \( A \) 和 \( B \) 的距离为 \( L(A, B) \)。


    当两个集装箱同时进行出库与入库危险品作业，且出入库活动时效性较强时，即要求两辆叉车进行装卸运输。为降低算法复杂性，本节所提出的四门仓库双叉车作业路径优化需做以下两点假设。


    首先，受危险品人工装卸因素的影响，本书仅建立入库节点与出库节点之间的匹配。


    其次，四门仓库的布局和线路宽度虽然可以保证两个叉车在同向或相向运行阶段的正常行驶，但考虑到双叉车冲突风险，两台叉车出现在同一节点位置时会相互影响，造成作业效率下降。


    为降低上述假设对实际场景描述的不足，本书令入库点与出库点组成的任意点对的路径长度差异明显，如 \( s_{p_{i_t}, q_{j_t}}, s_{p_{j_t},
    q_{j_t}} (i_1, i_2, j_1, j_2 \in M) \) 两辆同时运行的叉车的路径，应使其线路长度差异尽可能大，以减少两台叉车在出入库作业时对彼此的干扰，增加叉车作业的灵活性。四门仓库同时出入库作业双叉车线路优化的建模过程如下。


    首先，从最终的人库点与出库点组成二分图中选取 \( l(p_{i_t}, q_{j_t})\)，\( l(p_{k_t}, q_{j_t}) (i_t, j_t,
    i_t, j_t \in M) \)，将 \( l(p_{i_t}, q_{j_t}) \) 与 \( l(p_{k_t}, q_{j_t}) \) 的相关度规范化得


    \( r^*((p_{i_t}, q_{j_t}), (p_{k_t}, q_{j_{t''}})) = 1 - \frac{abs\{l(p_{i_t},
    q_{j_t}) - l(p_{k_t}, q_{j_{t''}})\}}{\max\{l(p_{i_t}, q_{j_t}), l(p_{k_t}, q_{j_{t''}})\}}
    \tag{2.1} \)


    其次，将每一个出入库点对间的距离规范化得


    \( L^*(p_{i_t}, q_{j_t}) = \frac{L(p_{i_t}, q_{j_t}) - \min_{k'' \in M, f'' \in
    M} L(p_{i_{k''}}, q_{j_{f''}})}{\max_{k'' \in M, f'' \in M} L(p_{i_{k''}}, q_{j_{f''}})
    - \min_{k'' \in M, f'' \in M} L(p_{i_k''}, q_{j_{f''}})} \tag{2.2} \)'
