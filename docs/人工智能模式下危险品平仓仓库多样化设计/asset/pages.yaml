  md: '# 第 4 章 环岛危险品平仓仓库叉车运行规则及分区作业研究


    为了对时效性较强的客户提供高效率的仓储服务，进一步提高危险品仓储作业的效率，本章在互通危险品仓库的基础上提出了环岛危险品平仓仓库的设计思路。在环岛危险品仓库中，有更多的隔离门被设置，通过隔离门的使用，可以为作业叉车提供更多的运行线路选择。通过隔离门的使用，每个危险品仓库可以具有多种仓储方案，并且这些仓库可以同时归属于不同的分类。隔离门的使用使得环岛仓库具有了更多的属性，它们不再仅仅是某些特定仓库类型的成员，这将释放仓库的仓储潜能，进而为危险品仓库的作业效率提升提供物理基础。任何事物都存在两面性，在释放仓储潜能的同时，环岛危险品仓库中设置隔离门将占用较多的危险品仓储货位，这将提升危险品货位的单位使用成本。与互通仓库相比较，一方面，环岛危险品仓库作业的时效性更强，作业效率更高；另一方面，环岛危险品仓库的土地使用成本更高，对员工的计算机水平要求也更高。从上述分析可以看出，环岛危险品仓库适合于时效性更强、对仓储成本敏感性较弱的仓储客户。为了进一步支持环岛危险品仓库的运营，本章先后从叉车运行规则的设置，以及危险品货位分区的角度进行了研究，并得出了一些有益的研究成果。本章各节的主要研究内容如下。


    4.1 节提出了环岛危险品仓库的概念，并且以此为基础提出了危险品货位动态布设问题。在货位动态布设条件下的危险品仓库中，叉车的运行方案主要有依赖运行规则，或依赖优化算法两种情形。设置运行规则与否取决于客户对仓储效率和成本的要求。在此基础上，本节基于最优化理论，以常见的环岛运行规则设置问题为样本，研究了在叉车出入库活动中环岛运行规则的设置条件，将环岛运行规则的设置问题提炼为一类特殊的指派问题，并给出了求解算法。


    4.2 节从空间布局的角度研究了危险品平仓仓库。在多危险品出入库作业同时进行时，主要有设置分区规则和不设置分区规则两种危险品仓库货位使用类型。'
  merge: -1
  img_proc: true
- pgno: 87
  md: '为了统筹兼顾危险品出入库作业的安全、效率、成本等因素，本节以设置叉车环岛运行规则为研究背景，以最优化理论和新提出的成本计算公式为工具，研究了包装危险品环岛平仓仓库的分区设置问题，并通过数值仿真，得到了环岛平仓仓库货位分区的五条重要规律。


    4.3 节对全章的内容做了总结。


    # 4.1 环岛危险品平仓仓库叉车运行规则设置的决策方法


    # 4.1.1 研究问题的提出


    我国现有危险品仓库大多采用双门设计。调研发现，该种仓库布设方式极大地限制了仓库的运行效率。为了提升危险品仓库的仓储效率，我们在第 3 章提出了互通危险品仓库的概念。为了进一步提高作业效率，本章提出并研究了环岛危险品仓库。通过在环岛危险品仓库中设置更多的隔离门，可以实现危险品货位的动态布设。货位动态布设条件下是否为叉车设置运行规则，以及是否需要对仓库进行出库货位与入库货位的分区设置，是使用环岛危险品仓库的关键问题。为了对仓库分区及叉车运行提供智力支持，本节以环岛危险品仓库为研究背景，以多叉车运行线路为条件，以危险品的同时出入库为样本，研究了不同情况下仓库分区布设规则以及环岛运行规则的设置问题。为了做好本项研究，本书重点关注危险品仓库管理、环岛控制、最优化理论在交通领域的应用等方面的最新研究成果。


    在危险品仓库管理方面，王磊等发现在危险品事故中，危险品仓储事故为主要事故形式，且开放式危险品仓储事故风险较高。同时，通过分析近几年危险品仓储事故，发现主观因素不确定性是此类事故的主要影响因素[135]。Yachba
    等基于遗传算法提出了一种对危险品集卡位置的自动识别系统[144]。Molero 等研究了将危险品仓库建在陆港的可能性，并给出了一种选择危险品仓库库址的多指标决策方法[145]。在环岛控制方面，廖铎澔和刘怡彬将环岛优化策略与交通信号控制相结合，设计出主干道与次干道交通信号控制方案，从而实现了环岛的车辆通行能力最大化[146]。Tian
    等发展了一类基于博弈理论的在线司机路径选择预测方法[147]。上述地面交通领域对环岛的研究对本书研究危险品仓库有很好的启发。在最优化理论在交通领域的应用方面，著者主要关注了如下研究成果。Mesbah
    等提出了实现公交道路空间优先权的计算公式，并通过该公式为公家车与私家车分配了路'
  merge: -1
