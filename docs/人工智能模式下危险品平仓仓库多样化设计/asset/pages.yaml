    # 图 2.15 四种危险品存储方案


    # 场景 1 属性权重给定的情况


    首先，由式( 2.13 )得到各方案的负理想点为 $C_{\max} = (0.176, 2, 0.168, 0, 0.979, 8, 1)$。

