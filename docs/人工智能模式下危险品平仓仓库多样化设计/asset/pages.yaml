    其中， \( G_{mI+j,m,k} = G \left( v_{mI+j} X_{m,k} \right), y_{mI+j,m,k} = f \left(
    u_{mI+j} G_{mI+j,m,k} \right), m \in N ; i=1,2,\cdots,n ; j,k=0,1,2,\cdots,J-1
    \)。


    # 2. 主要结论


    给定任一向量 \( X = (x_1, x_2, \cdots, x_n)^{\text{T}} \in R^n \) ，定义其欧氏范数为 \(\|X\|
    = \sqrt{\sum_{i=1}^n x_i^2}\) 。定义误差函数的稳定点集为 \(\Omega_0 = \{ W \in \Omega : E_W(W)
    = 0 \}\) ，其中， \(\Omega \subset R^{n(p+1)}\) 是满足下述条件（假设 4）的有界区域。令 \(\Omega_{0,s}
    \subset R\) 是 \(\Omega_0\) 在第 $s$ 个坐标轴上的投影，即


    ```

    \(\Omega_{0,s} = \left\{ W_s \in R : W = \left( W_1, W_2, \cdots, W_s, \cdots,
    W_{n(p+1)} \right)^{\text{T}} \in \Omega_0 \right\}\)

    (3.14)

    ```


    为分析算法的收敛性，做如下假设


    假设 3.1：导函数 \(g''(t)\) 和 \(f''(t)\) 满足局部 Lipschitz 连续；


    假设 3.2：学习率满足条件 \(\eta_m > 0, \sum_{m=0}^\infty \eta_m = \infty, \sum_{m=0}^\infty
    \eta_m^2 < \infty\)；


    假设 3.3：动量项系数满足 \(\mu_m > 0, \sum_{m=0}^\infty \left( e^{-\lambda \left\| \nabla_{v}^{m}
    v_{mI+j} \right\|} \mu_m \right)^2 < \infty , \sum_{m=0}^\infty \left( e^{-\lambda
    \left\| \nabla_{v}^{m} v_{mI+j} \right\|} \mu_m \right)^2 < \infty\)；


    假设 3.4：存在有界区域 \(\Omega \subset R^n\) 使得 \(\left\{ W_m \right\}_{m=0}^\infty \subset
    \Omega\) 成立；


    假设 3.5：\(\Omega_{0,s}\) 不包含内点，其中，\( s=1,2,\cdots,n(p+1) \)。


    在五项假设的基础上，本书给出如下两条定理。


    定理 3.1：假定条件假设 3.1~假设 3.4 成立，任意给定初始权值 \(W_0\) ，权值序列'
