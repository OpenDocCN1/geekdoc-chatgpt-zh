    在机会成本及无形资产方面，Stoll 等为了避免靠直觉去决定采购设备的数量，采用多维度分类的方法来为管理者提供策略支持[155]。Ozsen 等认为在一个全球性且波动性很大的世界经济中，必须以整体系统方法管理风险或不确定性，因为所有风险都可能影响声誉[156]。在危险品仓储与运输方面，国内外学者主要从危险品的运输条件和方式、运输储存危险品过程中的风险控制上进行研究。例如，Barbucha
    和 Filipowicz 提出了考虑离散距离的一般隔离储存的数学表达[157]。Cassini 考虑了运输危险品时直接穿过城市区域以减少运输路程和在城市区域与人口稀少区域发生事故的不同严重程度，提出了定量风险评估的方法来进行决策，但很难保证任何时候肯定不会发生事故[158]。Elshafey
    等进行了抑制房屋被爆炸炸药减能力的实验。在选择存储、处理、运输爆炸物时，为选择相应的构件来保护重要设施提供了更好的依据[159]。Fabiano 等通过系统的调查收集现场数据，提出了对路线特征和暴露人口的风险评估，从而降低了降低风险分析的总体不确定性，为了更好地监测危险源的动态变化[160]。在仓位利用方面，Pang
    和 Chan 将仓库货位的使用与仓储客户的订单类型结合起来，并给出了使用仓库货位的优化方法[161]。Jemelka 等使用随机解算法和所有组合算法来求出解空间的形状并加以约束，最终求出最优解来提升仓库效率[162]。张壮针对中国国内集装箱港口船舶压港问题给出的建议是缩短集装箱堆存时间[163]。在神经网络算法方面，Ling
    和 Liu 使用人工神经网络构建了预测项目绩效的分析模型[164]。Mccall 提供了一种遗传算法的控制实例[165]。Ding 等利用遗传算法优化 BP
    神经网络，并证明了经遗传算法优化后的 BP 神经网络不容易陷入局部最优解[166]。Patel 和 Jha 利用人工神经网络评估员工在建筑项目中的工作行为，进而提出安全工作行为的结构[167]。Montiel
    等为机器人设计了一种柔性路径规划方法，该方法能够帮助机器人避开移动障碍物[168]。基于上述研究成果，我们对上海某危险品物流有限公司进行了调研，并在提出多功能仓库的基础上，进一步研究了压仓条件下仓库的作业方案及其机会成本分析。同时建立了模型，理论计算出在不同的影响因子下常规出入库模式或互通出入库模式的应用环境，并建立了相关参数在不同应用环境的阈值曲面。进而，著者考虑了叉车行驶距离和直接经济成本及时间成本的相互耦合的关系，建立了模型
    1 和模型 2 两个模型。其中，模型 2 使用遗传神经网络求解最小运行距离、时间等指标，并将其嵌套在模型 1 内最终算出直接经济成本和时间成本。模型 1 和模型
    2 的关系见图 5.15。为了介绍方便，我们接下来先具体分析压仓条件下的危险品仓储作业。'
