    在仓库出入库基础算法部分，学者们主要就仓库布局、拣选作业、提升仓库利用率等方面进行了研究。例如，Quintanilla 等以最大化仓库空间利用率为目标，运用启发式算法解决了混存仓库中货位的分配问题[57]。Seval
    等研究了仓库中的拣选操作，并提出通过优化存储策略来降低仓储成本，进而运用遗传算法解决策略优化问题[58]。谭熠峰等为提高粒子群算法的收敛速度和优化性能，避免陷入局部最优，提出了基于动态学习因子和共享适应度函数的改进粒子群算法[59]。张衍会等以遗传算法为基础对货位优化问题进行了研究，在保证危险品存储安全的同时，提高了货物出入库作业效率[60]。Ardjmand
    等对多个拣货员的订单分配、订单分批和拣货路径问题进行了研究[61]。


