  md: '# 1.4 撰写思路及主要内容


    # 1.4.1 本书的撰写思路


    通过广泛的调研，本书认识到智能化是危险品仓库发展的唯一出路，并且第一次对危险品仓库的智能化道路进行了架构。著者所构建的智能化危险品仓库是一种全自动化、全电脑化、全数字化的现代危险品仓库。在智能危险品仓库中，危险品仓库的作业和管理均经人机系统由中心计算机统筹安排。该中心计算机的核心是一系列面向出入库货位安排、存储、拣选、叉车路径规划等作业环节，以及处理应急事故、碳排放、核算成本的算法。为了实现危险品仓库的智能化，我们从危险品仓库的几何结构改造入手，为危险品仓库的智能化建设奠定物理基础。在上述思想指导下，本书具体地提出了互通危险品平仓仓库、分区危险品平仓仓库以及环岛危险品平仓仓库等概念。在危险品仓库多样化的基础上，中国应该走自己的路，通过大规模改造危险品平仓仓库，深度应用数字技术和物联网技术到未来的仓储企业，进而将危险品仓储活动构建为全感知、全智能的数字世界，在智能化技术的渲染下重新定义现有的仓储管理模式、业务模式、商业模式。在所述的宏观背景下，本书的主要工作是为危险品仓库智能化建设提供路径规划，帮助企业认清提升仓储服务能力的约束条件与现有资源，帮助仓储企业制订切实可行的实施计划，并最终实现危险品的智能仓储。


    宏观上，本书以不降低危险品仓库作业的安全标准为前提，以实现危险品仓库作业效率的帕累托改进为目标，以双门平仓仓库的几何结构优化为突破口，紧紧抓住出入库作业这一危险品仓库各业务的核心环节，以最优化理论和多属性决策理论为抓手，提出一套包含危险品平仓仓库的模块化、自动化，以及存储需求管理智能化、个性化等内容的平仓仓库优化模型，给出危险品仓库智能化建设的三阶段方案。微观上，本书以企业自生能力为微观分析基础，以仓储企业在每个时点的广义要素禀赋结构为切入点，通过仓储方案的多样化为具体的仓储企业提供改造方案。


