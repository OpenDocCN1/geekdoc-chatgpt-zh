- pgno: 167
  md: '# 第 7 章 总结与展望


    本书以危险品仓库的几何结构改造为突破口，以再建危险品仓储企业管理系统为软件保障，提出建设我国危险品仓储行业的仓储需求管理平台，为仓储行业指出了一条智能化管理危险品仓储需求的发展道路。本书的目标是打造危险品仓储需求管理平台，将各危险品仓库分散的、各自独立的资源打造成一个线上资源共享的平台，打造成未来危险品仓储行业的神经中枢，实现对客户仓储需求的高质量、差异化及个性化的服务。


    首先，在保障安全的前提下，本书以提升仓储企业的服务质量为目标，原创性地研究了中国建筑面积最大、数量最多的包装危险品仓库——双门平仓仓库，并利用一系列数学模型实现了平仓仓库的几何结构改造，实现了平仓仓库仓储作业效率的分阶段帕累托提升。具体地，本书借鉴新加坡等世界一流危险品仓库的建设和管理经验，分危险品仓库几何结构改造、叉车线路优化及仓储需求管理三部分，紧紧抓住“出入库作业”这一危险品仓库业务的核心环节展开研究。


    其次，本书以多样化、差异化的危险品仓库为基础，以最新的数字技术为工具，为仓储企业再建危险品仓库管理信息系统提供了参考意见，为仓储企业使用多类型的平仓仓库提供决策支持，并通过在建的仓库管理信息系统获取必要的数据，为仓储需求管理平台的搭建打下软件基础。


    最后，本书以最优化理论和多属性决策理论为主要工具，有效结合建筑、计算机编程、统计分析等技术，推动危险品平仓仓库改造，并利用新设计的多样化、差异化的危险品仓库，推动危险品仓库智能化建设。本书的最终目标是帮助仓储企业提出更好、更多的仓储方案，建设智能化的危险品平仓仓库，满足客户的个性化仓储需求，进而推动整个仓储行业的发展。


    在学术上，本书的最大贡献是给出了危险品平仓仓库仓储作业的安全度计算公式，以及提炼了危险品仓库作业的三次指派模型，特色是将最优化理论与多属性决策理论结合起来。在工程上，本书创造性地给出了危险品平仓仓库改造的“一揽子”方案，为中国危险品平仓仓库的信息化改造绘制了路线图，并且为不同的'
  merge: -1
