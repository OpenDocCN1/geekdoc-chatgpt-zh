  md: '# 4.2 基于综合效用的环岛危险品平仓仓库分区作业方法


    # 4.2.1 研究问题的提出


    在 4.1 节，我们提出了环岛危险品仓库的概念，并研究了环岛危险品仓库中叉车的运行规则问题。本节则在考虑各类危险品存放禁配关系的条件下，研究环岛危险品仓库条件下危险品货位的分区问题。具体地，本节以环岛危险品仓库为研究背景，以多叉车运行线路为条件，以危险品的同时出入库为样本，以安全红线下的安全度计算为重要指标，研究在环岛运行规则设置下，仓库分区规则布设决策及危险品仓库仓储作业效率问题。另外需要指出的是，由于
    I ~ IV 级危险品易燃易爆危险具有挥发且迅速蔓延的特征，故环岛危险品平仓仓库适合 V 级及以上类型的危险品[2, 3]。


    本节的研究目标是在保证仓库安全系数的前提下，研究仓库分区决策与仓储作业效率的关系。本节重点研究在设置环岛运行规则且仓库分区布设、设置环岛规则但不分区布设两种情况下，当关键变量发生变化时仓储作业的效用比较问题。其中，本节给出的环岛运行规则指只允许叉车在环岛路径区域单向行驶。本节布局及结构如下，4.2.2
    节介绍了环岛危险品仓库条件下的叉车多线路运行方案，以及仓库分区与否的利弊；4.2.3 节详细介绍了环岛危险品仓库叉车运行的算法控制和规则控制；4.2.4 节介绍了新提出的主要模型；4.2.5
    节通过数值算例具体计算了安全度、效率等重要指标，并得出分区决策方案。


    # 4.2.2 研究问题的定性分析


    为了提高仓库的作业效率，减少多辆叉车运行时发生冲突碰撞的概率，本节以环岛危险品平仓仓库为背景，基于环岛布设条件，设立仓库分区管理规则。在设置规则后，叉车在仓库内环岛区域的路径上只能单向行驶，其余路径可双向行驶，从而减少叉车环岛运行时的会车次数。同时，设置出入库分区，将仓库下半部分设置为入库区域，上半部分设置为出库区域，限制叉车单次任务的活动范围，减少叉车运行路程。本节提出的危险品平仓仓库分区效果如图
    4.12、图 4.13 所示。为了进一步对危险品仓库的分区决策提供支持，本节对分区决策的决策机理及影'
