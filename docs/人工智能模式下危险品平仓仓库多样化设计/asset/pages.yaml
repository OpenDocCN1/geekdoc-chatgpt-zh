    +   步骤 3.12：将 BP 神经网络算法的权值和阈值连接起来，形成一个三层神经网络结构。


    +   步骤 3.13：提供一组样本数据给 BP 神经网络算法的输入层，训练 BP 神经网络算法并计算神经网络输出误差。


    +   步骤 3.14：判断是否训练完所有的样本，若不满足则选取下一个学习样本提供给网络，返回到步骤 3.13，若满足则转至步骤 3.15。


    +   步骤 3.15：按照误差公式计算总误差，判断网络的总误差是否满足 E < ε，若满足则结束训练，若不满足则转向步骤 3.16。


