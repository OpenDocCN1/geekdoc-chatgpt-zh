    类型路径为 \( S_{C_i, q_j} \)。同时，记任意两点 \( A \) 和 \( B \) 的距离为 \( L(A, B) \)。


    一般情况下，叉车运行路径的确定需要考虑成本和效率两个因素。对于成本，需要我们选择适当的线路，使得叉车运行的距离最短。对于效率，由于在同一时间同一个房间只允许一辆叉车作业，我们选择的不同闭环路径总长度的相似度应尽可能小，从而当存在多辆叉车可资使用时，我们有更多的选择空间来保障作业的顺畅和安全。接下来，本书以六门仓库为例，分别研究在双叉车和三叉车两种不同情况下的叉车作业线路规划问题，在双叉车可供使用的情况下，本书为成本和效率赋予相同的权重；在三叉车可供使用的情况下，本节增加对影响叉车效率因素的权重，得到不同权重下的叉车运行线路。


