  md: '四门危险品仓库的特点在于电动隔离门的设计。电动隔离门主要特点与作用如下：①隔离功能，即与传统的双门仓库墙体相同的功能。在叉车不进行出入库作业时，该电动隔离门将处于封闭状态，以实现对不同种类危险品的隔离。②实现仓库中各个单元之间的连通，目的是让叉车可以同时进行出入库作业，提高危险品仓库的仓储周转效率。③密闭性好，具有隔热防火功能。④效率较高且易于操纵，所有隔离门完全展开及完全闭合的时间在一分钟以内。基于以上特点，使用隔离门实现单元间的互通，提高仓储效率，并保证仓储安全成为可行的办法。同时，如何布设电动隔离门在仓库中的位置，以实现叉车在仓库内高效作业，并尽可能地利用仓储空间成为值得思考的问题。


    在调研的基础上，本书给出了四门危险品仓库的使用原则，具体如下：首先，叉车在仓库内顺时针方向依次行驶，且每个房间不能同时出现两辆或以上数量叉车运行。其次，由于危险品出入库作业包含危险品的包扎、装卸等人工操作环节，且难以确切控制上述环节的作业时间，本书制定了利用算法确定叉车运行路径集合，管理人员决定叉车运行路径的顺序，并可以根据实际情况在现场调整该顺序。


    四门危险品仓库在设计上最大的不足是降低了仓库对危险品的平均存储空间。四门危险品仓库在设计上最大的优点是增加了叉车的活动范围，在进行出入库作业时叉车不需要到仓库外绕行；另外，四门仓库可以实现双集装箱同时出库、同时入库，以及同时出入库作业，可以在统一的框架下统筹协调两个集装箱的出入库作业需求，降低甚至消除双门规制仓库出库操作时造成的仓储设备及人力的浪费。通过图
    2.1 及图 2.2 可知，互通危险品仓库减少了叉车的运行距离。因此，在实现叉车运行效率提升的前提下，能否实现隔离门的设置取决于能否保证作业的安全。遵循该思想的指导，本书接下来将安全、效率及成本均纳入隔离门设置问题，建立了一个四门危险品平仓仓库叉车出入库线路优化模型。


    # 2.1.3 四门危险品平仓仓库叉车出入库线路优化模型


    +   1. 四门仓库叉车运行线路模型的提出


    由于危险品出入库作业包含危险品的堆垛、装卸等人工操作环节，且难以确切控制上述环节的作业时间，本书制定了四门仓库使用原则，即“利用算法确定叉车运行路径集合，管理人员决定或调整叉车运行路径的顺序”。另外，在危险品仓储作业中，本书需要关注两类危险源：第一类危险源是事故发生的前提，是事故的主体，决定事故的严重程度；第二类危险源是第一类危险源导致事故的必'
