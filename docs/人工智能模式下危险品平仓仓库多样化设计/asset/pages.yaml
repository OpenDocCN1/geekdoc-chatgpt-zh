  md: '且每个房间不能同时出现两辆或以上数量叉车的叉车运行原则。在上述原则指导下，叉车每次入库作业的运行线路应尽可能多样化，以使得线路间相似度系数较小，供现场管理人员灵活选择。当路径长度足够多样化时，现场管理人员可以根据各工序进展情况灵活调整对各货位的作业顺序，使得管理更加协调，工序更加顺畅，进而为出入库作业提供充分的安全保障。此外，著者经调研得到我国危险品仓柜标准，进而通过计算客户存储量使用的仓库房间数量和仓租费来计算不同存储方案的空间成本；可通过相对固定的叉车速度、叉车的运行时间及外部集卡移动时间来计算出入库活动的时间成本；通过计算仓库内叉车运行路径总长度，乘以当前油价得到叉车运行的经济成本。在叉车数量充足的情况下，我们以常规的双门仓库和互通危险品仓库的协调使用为目标。记
    \( C_i \) 为入库集装箱，\( d \) 为入库货位数，\( i=1,2,\cdots,d \)。假设 \( C_i \) 有 \( n \) 个人库点，记为
    \( p_1, p_2, \cdots, p_n \)，并记 \( N = \{1, 2, \cdots, n\} \)，因此整个危险品出入库作业过程中共有
    \( n \) 条入库往返路线。该路线如下：假定叉车先从 \( C_1 \) 出发，经路径 \( l_{C_i, p_i} \) 将 \( C_1 \) 的危险品送抵给定的
    \( p_i (i \in N) \)，随后经路径 \( l_{C_i, p_i} \) 返回至 \( C_1 \)，记这样一条出入库往返路径为 \( S_{c_1,
    p_i} \)。集装箱卡车由 \( C_i \) 移动到 \( C_j \) 的路径记为 \( S_{c_i, c_j} \)。假设仓库使用共有 \( m
    \) 个方案，决定方案优劣的属性分别为时间成本 (\( f_1 \))、空间成本 (\( f_2 \))、经济成本 (\( f_3 \))，以及运输安全度
    (\( f_4 \))。设 \( X = \{x_1, x_2, \cdots, x_m\} \) 为方案集，\( F = \{f_1, f_2, f_3,
    f_4\} \) 为属性集。设属性权重向量集为 \( w = (w_1, w_2, w_3, w_4), w_i \in [0, 1], \sum_{i=1}^m
    w_i = 1, c_h = (c_{t_h}, c_{sph}, c_{e_h}, c_{sah}) \) 为方案 \( x_h \) 关于属性集 \(
    F \) 的属性值。令叉车运行速度为 \( v_1 \)，集装箱卡车运行速度为 \( v_2 \)，\( a \) 为当日仓租费，\( t_h \) 为方案
    \( x_h \) 所使用的仓库房间数，\( c_{sph} = at_h \)。令 \( b \) 为当日燃油价格，则 \( c_{e_h} = b \sum_{j=1}^n
    l(C_i, p_j) \)，其中，\( e_h \) 为方案 \( x_h \) 叉车数目，\( n'' \) 为危险品仓库的门数，且有


    \( c_{t_h} = e_h^{-1} \left( v_1^{-1} \sum_{i=1}^n l(C, p_i) + v_2^{-1} \sum_{i=1}^{n''-1}
    l(C_j, C_{j+1}) \right) \)


    易知，叉车运行路径之间的相似度为


    \( c_{sah} = 1 - \frac{abs(l(C, p_i) - l(C, p_j))}{\max \{l(C, p_i), l(C, p_j)\}}
    \)


    需要说明的是，集卡的移动时间受叉车数量的影响。为方便起见，本书在 \( c_{t_h} \) 中将该影响按线性函数处理。在具体的应用中，我们可以根据实际情况调整该函数。'
