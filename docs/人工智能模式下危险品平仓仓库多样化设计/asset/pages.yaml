  md: '# 3.1.2 互通危险品仓库出入库作业的三阶段瀑布机制


    # 1. 危险品出入库作业目标


    对于危险品出入库作业来说，安全是首位的。在此基础上，效率和成本控制也是我们考虑的重要对象。基于此，我们提出以下三种主要的方法来确保安全、提高效率及降低成本。具体地讲，危险品出入库的具体目标如下。第一，不同叉车作业区域应该尽量远。如此叉车相遇的概率大大降低，提高危险品出入库的安全性。第二，不同叉车路径相似度尽量小。路径相似度尽量小，指路径需要尽可能长短不一。如果两辆叉车相似度小，则路径长的叉车有较大的回旋空间，通过速度调节，以实现与路径短的叉车不在同一时间出现在同一房间，避免安全事故。同时又可确保两辆叉车可以同时完成各自的整个闭环通路，使效率最大化。第三，所有货位距离相应集卡的距离要尽可能小。这样，可以节省叉车在运作过程中的耗油量，降低仓库运营的成本。


    # 2. 出入库作业的瀑布机制


    为了实现上述三个目标，本节借鉴生物凝血模型，建立了一种实现危险品出入库作业的瀑布机制。瀑布机制，其本质就是将一项活动中前后相关的因素、参数提炼出来，并形成一种前后顺承的模型。基于上述模型，危险品出入库作业可按照瀑布机制分三个前后顺承的阶段来实现。具体地，在阶段
    1，我们为服务不同集卡的叉车分配出库或入库作业货位，将所有货位的集合分为两个子集。分类后得到的子集间元素应尽可能远；所有货位距离相应集卡的距离之和尽可能小；同一货位集与相应集卡的距离形成距离集，则两个距离集的相似度应该尽可能小。在阶段
    2，首先建立入库货位和出库货位的匹配，匹配标准是让所有人库货位和出库货位的距离和最短，以实现叉车运行线路的最短。其次建立不同人库子集间货位的匹配，以实现双叉车的同时高效率作业。货位——匹配的原则是两个叉车闭环通路的距离的相似度尽可能小。在阶段
    3，从两辆集卡中选择一个为主集卡，另一个为辅集卡，以主集卡对应叉车的运行效率为指标，按照作业顺序，将两类货位子集分为不同的部分，并授权管理人员参考作业进度，现场调整各部分的作业顺序。


    # 3.1.3 互通危险品仓库出入库作业的三阶段实现模型


    # 1. 基本参数介绍


    本节考虑到影响危险品出入库作业的三个主要因素，提出了互通危险品仓库'
