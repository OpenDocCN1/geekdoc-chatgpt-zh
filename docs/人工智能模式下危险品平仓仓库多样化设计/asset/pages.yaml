    # 1. 基本参数介绍


    本节考虑到影响危险品仓库出入库作业效率的几个主要因素，提出了在出入库货位数量和位置不断变化的情况下，应如何根据仓库内实际情况来调整环岛区域的行车规则以达到效率最优状态，并以双叉车双集卡入库和单集卡出库的十门环岛危险品仓库为例进行研究。方便起见，记同时兼有入库作业的两辆集卡为
    $T_1$ 和 $T_2$，记仅有出库作业任务的集卡为 $T_3$，记 $T_1$ 和 $T_3$ 服务的叉车为 $F_1$，记 $T_2$ 和 $T_3$
    服务的叉车为 $F_2$，记所有等待入库货位的集合为 $M = \{1, 2, \cdots, m\}$，记所有等待出库的货位的集合为 $N = \{1,
    2, \cdots, n\}$，$m + n \leqslant 46$。$p_i$ 表示任一入库货位，且 $i \in M, j \in N$。记 $q_j$
    表示任一出库货位，同时该叉车在仓库外的运行速度为 $v_f$，行驶距离为 $d_{out}$。进一步地，当设置环岛行驶规则时，记叉车在仓库内的运行速度为 $v_s$，行驶距离为
    $d_s$。当不设置环岛行驶规则时，记叉车在仓库内的运行速度为 $v_{ns}$，行驶距离为 $d_{ns}$。当速度分别为 $v_f, v_s, v_{ns}$
    时，记叉车单位时间所消耗的燃油分别为 $c_f, c_s, c_{ns}$。


    # 2. 实现叉车运行的仿真设计


    首先，本书介绍在不设置环岛单向行车规则下的叉车运行仿真设计。


    由于叉车在仓库内行驶方向最多只有四个，具有很强的确定性，故在计算叉车在仓库内行驶的平均最短距离 $d_{ns}$ 的过程中，可通过仿真的方法，分设置环岛单向行车规则与不设置环岛单向行车规则两种情况进行研究。具体实现步骤如下。


    +   步骤 4.1: 将仓库区域均匀划分，使该区域形成一个均匀的网格，同时可得到所有网格线交点的坐标。

    +   步骤 4.2: 用矩阵表示仓库布设方式。

    +   步骤 4.3: 设置叉车在仓库内的运行规则。

    +   步骤 4.4: 初始化叉车入库位置。

    +   步骤 4.5: 根据叉车在仓库内的运行规则，分别找出叉车 $F_1$ 和 $F_2$ 从入库仓门到出库仓门的所有最短路径，并保存。

    +   步骤 4.6: 分别检查在每一种路径组合下，同一时刻两辆叉车所在位置是否相同。若不相同，则返回由网格线交点所组成的叉车 $F_1$ 和 $F_2$
    的路径。

    +   步骤 4.7: 经过 $n$ 次迭代后，计算出在入库货位数量与出库货位数量所有可能的组合情况下，每一种情况下两叉车库内行驶的平均路程并输出。其中，仓库均'
