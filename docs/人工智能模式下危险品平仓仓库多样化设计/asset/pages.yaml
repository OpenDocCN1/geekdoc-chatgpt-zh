    位，从而实现该仓库货物在某一时间段内出库货位与入库货位完全分区的状态。同时，在该情况下由于出库点入库点的位置相对固定，可以通过合理安排货物货位的位置来实现叉车运行路径的最优化，即尽可能缩短叉车在仓库内的运行距离，避免会车，从而加快叉车作业中入库集卡与出库集卡的作业时间，提升作业效率。


