  md: '到离散最优化领域。谭熠峰等研究成果的优点是，在惯性权重 w 随着迭代次数非线性减少而动态调整学习因子的基础上，引入遗传算法中的共享适应度函数。当算法陷入局部最优时，利用粒子和最优解间距离挑选一批粒子重新初始化形成新群体，进而根据海明距离对部分粒子重新初始化，并用共享适应度函数来评价新粒子群，对旧粒子群通过调整学习因子方法达到快速精确搜索局部最优，新旧两个群体分别在各自最优解下更新和搜索。新群体利用给定共享半径得到的共享适应度函数阻止新群体立刻回到局部最优。利用该算法能达到跳出局部最优的目的。在算法迭代早期，利用


    \( V_{i,d}^{k+1} = w V_{i,d}^k + c_1 \xi (p_{i,d}^{best} - x_{i,d}^k) + c_2 \eta
    (g_d^{best} - x_{i,d}^k) \quad (2.5) \)

    \( x_{i,d}^{k+1} = x_{i,d}^k + V_{i,d}^{k+1} \quad (2.6) \)


    动态调整 w、\( c_1 \) 和 \( c_2 \)，并更新粒子的速度和位置。其中，\( v_{i,d}^{k+1} \) 为第 i 个粒子第 d 维变量在第
    k 次迭代中的速度；\( x_{i,d}^k \) 为第 i 个粒子第 d 维变量在第 k 次迭代中的位置，是介于 (0, 1) 区间的随机数；\( c_1
    \) 为粒子对本身的历史最优值的权重系数；\( c_2 \) 为粒子对群体最优值的权重系数；w 为保持原来速度的系数，称为惯性权重。当粒子群陷入局部最优时，对部分粒子重新初始化形成新群体。由于旧群体用于在早熟区继续寻找最优，故越接近最优位置越好。本节将与早熟区最优解之间距离较近的粒子作为旧群体，分布较为分散的部分粒子则进行变异，再次初始化。给定个体
