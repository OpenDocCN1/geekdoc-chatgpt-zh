    # 3. 结论分析


    通过对比传统仓库与互通危险品仓库的作业效率，可以发现采用电动隔离门来实现仓库各单元之间的互通可以将效用提高至原来的 1.63 倍左右，并且在货物周转量较高的情况下对叉车线路的最优化设计更为灵活。同时，根据仿真结果可以发现，在实际作业时若能尽量缩小仓库内入库货位数量与出库货位数量之差则可大大降低叉车的行驶距离，因此仓库管理者可以根据实际仓储需求来安排入库集卡与出库集卡的比例。


    通过实例给出的各方案的效用值可以看出，虽然不同的作业方式会影响叉车运行效率，但实行互通设计的危险品仓库较其他仓库而言能取得较好的目标函数值。另外，本节所提出的模型也可应用在单集卡入库、双集卡出库同时作业的环境。对于如何安排出入库集卡的位置与数量可以使仓库整体的效用达到最高还需进一步研究。


    # 5.3 压仓条件下临时货位设置的分层决策方法


    # 5.3.1 研究问题的提出


    近年来，我国危险品仓库的流量季节性较强，仓库流量出现了明显的波峰波谷的特征，且我国现有的危险品仓库多为双门规制。双门仓库对仓储空间的利用率较高，然而出入库作业效率较低。在危险品流量较大甚至压仓的期间，现有的双门仓库因其空间结构所决定的作业模式难以高效出入库作业，容易出现当日或者规定时间内不能清库的情况，最终导致货物在仓库的积压，而且在高强度的作业下，叉车潜在的对危险品包装的破坏风险，以及叉车潜在的互相碰撞风险都会影响仓库的经济效益。


    为了能够同时兼有双门仓库在空间利用率上的优势和互通仓库在作业效率上的优势，著者提出了一种设置临时货位的互通危险品存储方案。在该方案中，仓库可以通过使用临时货位，实现按照双门仓库进行储存危险品，按照互通危险品'
