  md: '# 第 6 章 危险品平仓仓库智能化建设方案


    以危险品平仓仓库的几何结构改造为起点，我们提出了双门危险品仓库、互通危险品仓库及环岛危险品仓库。进一步地，通过隔离门的合理使用，我们可以在三种新型危险品仓库的基础上构建更多的危险品仓储方案。上述工作所建立的多样化危险品仓库，为危险品仓库的智能化建设夯实了物理基础。在此基础上，我们提出了危险品仓库智能化建设的三阶段方案。围绕危险品仓库的三阶段方案，本章各节内容安排如下。


    6.1 节介绍了危险品平仓仓库智能化建设的三阶段方案，即仓库几何结构改造、仓库管理软件开发及仓库管理平台建设。三个阶段分别以提供多样化的仓储方案、实现仓储作业优化及为客户提供个性化的仓储服务为目标。其中，第一阶段是基础，第二阶段是主体，第三阶段是最终目标。


    6.2 节介绍了危险品平仓仓库智能化建筑建设阶段，该阶段的主要任务是实现危险品平仓仓库的几何结构改造。危险品平仓仓库的几何结构改造将有效帮助仓储企业更科学地统筹危险度、成本和效率等因素，帮助仓储企业深化并量化对安全级别、成本控制的认识，帮助企业为客户提供多类型的危险品仓库，供客户选择。


    6.3 节介绍了危险品平仓仓库智能化软件建设阶段，该阶段的主要任务是建设新型危险品仓库的信息管理系统。该系统主要有以下功能：一是叉车路径规划功能。通过给定的入库点和出库点，给出叉车在仓库内运行的最佳路线。二是仓库建设咨询功能。根据系统收集的危险品仓储数据，给出仓库的几何建设意见。三是仓储咨询功能。该系统的构建是危险品仓储管理信息平台建设的第二个环节，将在整个平台的建设中起到承上启下的作用。


    6.4 节介绍了危险品平仓仓库智能化管理平台建设阶段。该阶段将以现代化数据采集技术为手段，以全球领先的大数据处理技术为核心知识产权，创建一个危险品仓储行业的信息平台，为危险品仓储服务提供运营决策和建议，为仓储企业'
  merge: -1
  img_proc: true
- pgno: 155
  md: "的多元化发展铺平道路，基本实现危险品仓库的智能化建设。  \n6.5 节为本章小结。\n\n# 6.1 危险品平仓仓库智能化建设的三阶段方案\n\n\
    在高速发展的危险品仓储市场面前，在移动互联网、大数据、传感器和脑科学的强烈驱动下，社会对危险品仓库提出了数字化、智能化的建设需求。危险品仓库的智能化建设呈现出深度业务反思、学科融合、客户驱动等特征。危险品仓库的智能化不是简单地将现代技术应用到危险品仓储领域，而是为了重塑危险品仓储作业模式，为仓储客户提供个性化、自动化的服务。为了实现危险品仓库智能化的建设目标，我们先要改造现有的危险品仓库几何结构。这是因为如下三个原因：首先，现有的仓库结构以双门平仓仓库为主，在该库型下叉车运行线路单一，难于提高仓储作业效率。其次，由于仓库结构的单一，造成了现有的仓储方案单一，不利于为仓储客户提供个性化服务。最后，我国人口发展的红利正在消失，危险品平仓仓库的运营成本增幅巨大，如果不对危险品仓库进行改革，危险品仓库的成本-效益比将在现有低水平的基础上进一步严重下降。考虑到上述三个原因，我国的危险品平仓仓库结构已经到了非改造不可的地步，已经到了不智能化还将发生事故的地步。\n\
    \n只有多样化、差异化的仓储服务，才能真正带来行业竞争；只有健康的、以提升服务质量为核心的行业竞争，才能真正推动仓储行业的发展。基于上述理念，本章在广泛调研的基础上提出一套三阶段的危险品仓库智能化建设方案，以期为客户的危险品仓储需求提供高质量、多样化、差异化的仓储服务。智能化建设将分为仓库几何结构改造、仓库管理软件开发及仓库管理平台建设三个阶段。其中，仓库几何结构改造是智能化建设的工程基础，仓库管理软件开发是智能化建设的软件基础，仓库管理平台建设是智能化仓库管理平台的建设目标。上述三个阶段的建设目标环环相扣，依次递进，核心关系见图\
    \ 6.1。\n\n具体而言，在危险品仓库智能化建设的工程阶段，我们将通过隔离门的合理使用为客户提出多种仓储方案，进而大大增强仓储企业服务客户的能力。当客户仓储需求的时效性较强时，我们可以为客户提供环岛危险品仓库，当客户仓储作业的时效性较弱时，我们可以为客户提供双门危险品仓库。当客户有多种货物需要存储时，我们可以为客户提供仓储套餐供客户自己决定仓储方案，进一步增强客户对仓库的信任。客户是仓储企业发展的唯一理由，通过为客户提供高质量的仓储服务，企业的生存能力将得到提高。"
