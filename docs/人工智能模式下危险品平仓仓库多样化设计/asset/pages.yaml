- pgno: 168
  md: '危险品仓库指出个性化的发展方向。


    研究内容的增加是不断深化危险品仓库研究的源泉。我们今后将利用比较优势等经济学理论，重点研究多仓储方案条件下的仓储定价问题、多定价条件下的仓储方案决策问题、互通及环岛危险品平仓仓库的碳排放管理问题，以及仓储企业经济行为分析等问题，并提出一些基于学科交叉的新理论。另外，本书对危险品仓库智能化道路的认识尚不够具体，但本书更在意的是对研究思路、研究判断的启发性阐述。这种阐述将有助于我们了解我国现阶段的危险品仓储行业的主要矛盾，有助于我们进一步思考我国当前危险品仓储安全问题的严重性。未来危险品仓库的研究将从几何结构设计，逐渐向危险品仓储管理、危险品仓库节能减排、危险品仓库叉车启停等方向发展，研究的内容也将更加精细化、系统化。我们希望有更多的研究者投入上述理论研究，与我们一起努力探索仓储规律，提炼科学问题，为我国的危险品仓储事业贡献力量。'
