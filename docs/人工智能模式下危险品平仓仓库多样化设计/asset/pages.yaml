    等提出了一种名为“物联网控制安全区域”的新概念，通过避免仓库管理系统集中化的缺陷来实现仓储安全[52]。彭小利等构建了基于制造物联技术的智能仓库环境下，针对多品种智能仓库的货位分配问题，建立了考虑多规则约束的多目标智能仓库货位分配模型[53]。


    在提升仓库效率方面，国内外的学者主要从仓库运输线路规划、仓库员工效率管控及仓库优化设计方面展开了一系列的研究。例如，Petersen 介绍了如何对仓储物品的存储和工作人员的路线进行规划，以便为各自的客户订单检索这些物品，提升仓库运营效率[54]。Hsieh
    和 Tsai 考虑了仓库系统中交叉通道的数量和布局类型、仓储分配策略、拣选路线、通道内平均拣选密度及订单组合等因素对订单拣选系统性能的影响，并以最小化作业路径作为最佳性能指标，将交叉通道数量、仓库布局、仓储分配、拣选路线规划、拣选密度和订单组合类型在仓库系统中进行优化整合和规划，通过系统仿真实验，在不同环境下找到仓库设计的最佳组合，并找到更好的性能[55]。Larco
