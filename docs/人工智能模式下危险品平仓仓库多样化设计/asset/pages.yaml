  md: '# 第 3 章 互通危险品平仓仓库分阶段作业及作业链研究


    为了对互通危险品仓库的运营提供智力支持，本章提炼了影响危险品出入库作业的主要因素，分别从仓储过程管理、仓储安全及仓储作业效率优化三个角度研究了危险品出入库作业问题。本章按照危险品仓储作业自动化水平从低到高的顺序开展研究。首先，重点考虑危险品仓储作业的不确定性因素，从管理的角度研究危险品仓储作业，提出了危险品出入库活动的三阶段瀑布机制，并给出了一种三阶段出入库作业管理模型。其次，考虑了危险品仓储作业链的特点，提出了危险品叉车运输的安全度概念，并根据叉车作业的综合成本来确定危险品出入库作业时最优的仓储作业链。最后，围绕危险品仓储作业效率最优化的目标，建立了确定叉车运行线路的三次指派模型，并利用神经网络给出了三次指派模型的求解方法。对于创新过程而言，本章是将结构设计与最优化理论有机结合起来，从而形成更多的叉车运行方案，进而增加叉车出入库作业的线路选择权，得到最优的叉车作业线路。本章各节主要内容如下。


    3.1 节提炼出了影响互通危险品仓库出入库作业的三个因素，即叉车运行的距离（成本因素）、叉车运行距离间的相似度（效率因素），以及仓库货位之间的距离（安全因素）。进一步地，为在保证安全的前提下提高危险品平仓仓库系统作业效率，该节提出了一种出入库作业的瀑布机制，将影响危险品出入库的影响因素有机集成起来，并以三个集卡（两个人库集卡，一个出库集卡）、双叉车、八门仓库同时出入库为例，给出了一种实现出入库作业瀑布机制的三阶段模型。


    3.2 节从系统控制的角度研究危险品仓储作业效率最优化问题。本节综合考虑了互通危险品仓库中叉车运行的安全度、运行效率及其产生的经济成本，并且以带有隔离门的互通危险品仓库为研究背景，提出确定叉车运行线路的三次指派模型，并通过改进的神经网络算法求解叉车的最优作业线路，提高危险品出入库效率。'
  merge: -1
