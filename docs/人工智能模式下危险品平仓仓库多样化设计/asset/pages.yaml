    # 3.3.3 基于仓储链及安全度的互通危险品仓储作业模型


    +   1. 研究点的界定


    在危险品仓库叉车最优调度策略的选取中，存在出入库点的配对及不同出入库点的作业顺序确定两个研究点。对于出入库点的配对问题，我们以完成所有的任务所走的路程为评判标准，研究得出总路程最小的出入库任务配对方案
    \( \min \sum_{i \in I} \sum_{j \in J} x_{ij} d_{ij} \)，其中，\( I \) 表示放货点的集合；\(
    J \) 表示取货点的集合；当 \( x_{ij} = 1 \) 时，表示第 \( I \) 个放货点和第 \( J \) 个取货点配对，否则为 0；\(
    d_{ij} \) 表示第 \( i \) 个放货点和第 \( j \) 个取货点的距离。由于本节重点关注危险品仓库叉车调度过程中的安全度、效率及综合评价指标等对调度策略的影响，所以我们下面将重点研究出入库点的作业顺序确定问题，并提炼安全度公式、效率模型及综合评价模型，最终得出危险品仓库叉车调度的优选模型。


    +   2. 安全度公式的定义


    本书通过咨询仓库管理人员，寻找两辆叉车之间距离的安全阈值。当距离小于此阈值时，由于距离过近，叉车存在潜在碰撞危险。此时，本书建议由常规关注时段进入重点关注时段。记仓储任务作业时段为
    \( [T_0, T_1] \)，记在时间段 \( [T_0, T_1] \)，记两辆叉车所有可能的仓储作业链对 \( \{(l_{i1}, l_{i2})
    | i = 1, 2, \cdots, N\} \)，其中，\( N \) 是一次仓储作业任务中所有可能的仓储作业链对的数量。记第 \( i \) 对仓储作业链所对应的重点监控时间长度为
    \( t_i \)，记两辆叉车在仓储作业重点监控时段的平均距离为 \( d_i \)，记 \( t_{\min} = \min_{i \in \{1, 2,
    \cdots, N\}} t_i \)，\( d_{\min} = \min_{i \in \{1, 2, \cdots, N\}} d_i \)，\( t_{\max}
    = \max_{i \in \{1, 2, \cdots, N\}} t_i \)，记仓储作业双叉车的 \( i \) 对仓储作业链的安全度函数为'
