    本节通过对两辆叉车在整个作业过程中的运动情况的研究, 进而提炼效率评价及综合评价模型。


    步骤 3.17: 记叉车在 \(t\) 时刻的位置为 \(F_1(a_i, b_i)\) 和 \(F_2(x_i, y_i)\)。在初始时间两辆叉车均处于入库集卡处,
    此时两辆叉车的坐标分别为 \((4, 2)\) 和 \((12, 2)\), 并分别记为 \(F_1(a_0, b_0)\) 和 \(F_2(x_0, y_0)\)。然后,
