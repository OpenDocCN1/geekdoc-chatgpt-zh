  md: '# 5.2.2 动态布设危险品货位的前提与思路


    为了研究的方便，在本节所研究的危险品仓库样本中共给出五个房间。方便起见，将每个房间记为一个单元，则仓库中从左至右分别为第 1 单元至第 5 单元，单元编号及仓库内货位的行列编号如图
    5.2 所示。为实现仓库各个单元之间的互通设计，需要在仓库中相邻两个单元间设置电动隔离门且数量至少为 4 个。在设置隔离门的条件下，仓储企业可以通过货位的动态布设为客户提供多种仓储方案。为了对货位动态布设的情况做进一步阐述，本书给出了
    6 种货位布设方案，详情见图 5.3~图 5.8。


