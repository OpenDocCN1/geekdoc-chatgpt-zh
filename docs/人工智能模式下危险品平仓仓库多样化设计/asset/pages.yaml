    ```

    $$V_{i''}'' = [w \odot R_1^i \otimes X_{i''(x'''')}] \oplus [c_1'' \odot R_2^i
    \otimes X_{i''(x'''')} ] \oplus [c_2'' \odot R_3^i \otimes X_{i''(y'')} ] \quad
