    # 5.3.2 压仓条件下的危险品仓储作业环境介绍


    中国国内现有的危险品仓库大多为平仓式的双门仓库，这类仓库的优点在于空间利用率高，一个空间内就留一条供叉车行进的通道，其余空间都能作为货位放置货品。在双门仓库的条件下，当有集装箱停在仓库外时需要仓库内的叉车到一个门前进行接应，再进入仓库进行存取货作业。在完成存取货作业后，因为通道内无法掉头，需要从另一个门出去从仓库外围绕一圈才能回到集装箱处再重复进行作业。这种作业模式在危险品流量较大时，因为其效率较低无法快速有效地从集装箱上下货并根据需要存储到相应位置，最终导致压仓。


    互通仓库是将几个常规双门危险品仓库打通，这样叉车从一门进入仓库作业'
  merge: -1
  img_proc: true
- pgno: 144
  md: '完成后有多个可选择路径离开仓库。互通仓库相比双门仓库的优势在于其效率高，可以快速地进行存取货作业。在压仓的时候，互通仓库可以高效地处理新运进的危险品，将其摆放到相应位置，同时也可以快速从仓库运出需要交接给下一环节的危险品，这样便能有效地缓解压仓现象。


    在上述分析的基础上，本书提出的多功能仓库结合了双门仓库空间利用率高和互通仓库效率高的优点，并且考虑了额外作业所带来的机会成本。在双门仓库的基础上将其与隔壁的双门仓库打通，并在打通的地方设置可以推拉的隔离门。在危险品流量较小时，拉上隔离门用来隔断双门仓库间的联系并在隔离门旁放置货位，因其直接影响了隔离门的使用所以称为关键货位。在原双门仓库内的一个门前设置一个临时货位。当临时货位放置了货品后，其两旁的货位称为相关货位，此时不允许进行出入库，便能实现压仓情况下相应的处置。平时存储时作为双门仓库模式存储，最大化空间利用率；当出现压仓时，将关键货位上的货品移到临时货位上，并拉开隔离门使仓库成为互通仓库，快速地进行出入库作业。在互通模式下增加的需要将关键货位的货物移到临时货位这一额外作业所增加的机会成本也需要被考虑，这些机会成本包括潜在的危险品包装损坏、次品处理、声誉下降等。综上所述，常规双门仓库存储空间较大，但同一时间只能进行一项出入库活动，出入库效率较低，且出入库设备难以协调使用，而互通危险品仓库的设计有利于危险品出库时的设备协调使用，并且对常规的多集装箱同时出库、同时入库，以及同时出入库作业都有效率提升的作用。通盘考虑互通模式与常规模式的特点后，本节具体分析两种不同作业模式的适用环境。


