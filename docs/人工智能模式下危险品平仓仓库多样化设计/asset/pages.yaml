    \( n \) 的情况进行仿真计算可得，不分区时对应的安全度期望 \( \overline{\xi_0} = 1.767 \)，分区时对应的安全度期望 \(
    \overline{\xi_1} = 1.676 \)，进而得到分区与否的安全度比值为 0.948。同理，通过仿真计算结果进'
