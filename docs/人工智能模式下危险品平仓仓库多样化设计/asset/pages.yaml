  md: '# # 第 1 章 绪论


    近年来，我国危险品仓库发生了一系列安全事故，这些事故在造成国家财产损失的同时也给社会带来惨重的人员伤亡。据统计，2013~2018 年，全国共发生化工事故
    974 起，造成 1 253 人死亡[1]。特别地，2015 年 8 月 12 日，天津瑞海危险品仓库发生爆炸，造成 165 人遇难，8 人失踪[①]；2019
    年 7 月 19 日，河南省煤气（集团）有限责任公司义马气化厂厂罐区外发生爆炸着火事故，造成 15 人遇难，16 人重伤[②]。2019 年 3 月 21
    日，江苏响水化工厂发生爆炸事故，导致 78 人遇难[③]。


    面对严重的危险品安全事故，2016 年 10 月至 2019 年 3 月，笔者先后调研了新加坡 Cogent 危险品仓库、新加坡 YCH 危险品仓库、上海中远化工物流有限公司奉贤危险品仓库、上海国际港务集团临港危险品仓库、苏州中远海运化工物流有限公司化工仓库和南京中远物流有限公司危险品仓库，又先后调研了上海港、新加坡港、常熟港、南京港和烟台港。通过对上海中远化工物流有限公司奉贤危险品仓库和上海国际港务集团临港危险品仓库的调研，以及对国内外危险品仓库的研究，以找到危险品仓库屡屡发生安全事故的症结，从而为危险品仓库的发展寻找出路。


    # ## 1.1 国内外相关研究


    为改造中国数量最多的包装危险品平仓仓库，著者查阅了大量学术文献、技


    ① 国务院批复的天津港“8·12”瑞海公司危险品仓库特别重大火灾爆炸事故调查报告，此次事故造成 165 人遇难，8 人失踪。

    ② 资料来源：海南省应急管理厅。义马气化厂“7·19”爆炸事故调查报告。http://yjglt.hainan.gov.cn/xxgk/sgdcbg/, 202008/20200810_2831571.html,
    2020-08-10.

    ③ 资料来源：兰州新闻网。江苏响水“3·21”化工厂爆炸事故 死亡人数升至 78 人。http://www.lzbs.com.cn/gnnews/2019-03/26/content_4472475.htm,
    2019-03-26.'
