  md: '品仓库的运作效率成为物流企业十分关注的问题。目前，我国的危险品仓库大多为平仓仓库，且采用双门设计。然而，随着社会的不断发展，传统的双门仓库由于效率较低，已经不能满足日益增长的货量所带来的需求。基于此，本节将依靠最新的建筑材料，通过在危险品仓库各房间之间布设电动隔离门，来实现仓库单元间的互通，进而为提高危险品仓库的仓储效率奠定物理基础。特别地，本节所研究的新型危险品仓库中的隔离门仅在叉车通过时打开，其他时间均关闭，并且在这种类型的仓储中主要存放除第一类危险品（爆炸品）之外的各类危险品，以此保证危险品仓储的安全性。针对第一类危险品（爆炸品）的情况，仓储企业需要根据爆炸品的特点建设专门的防爆仓库。隔离门的使用为危险品仓库货位的动态布设创造了条件。然而，现阶段针对危险品仓库电动隔离门设置方案的评估缺乏有效的方法。鉴于此，为促进危险品仓库电动隔离门设置方案的评价，本节研究了以常规双门危险品仓库的各项参数为基准，以运营成本、机会成本、运营效率三个关键变量为指标，通过构建效用评价模型，计算各种仓储方案的经营成本。本节主要用到了最优化理论[25、26、33]、统计理论[63]及模拟仿真[81、117]等方面的知识，具体技术路线见图
    5.1。


    ![](img/82f0a1e9c99ca5f51f0110a293ae6965_124_0.png)'
