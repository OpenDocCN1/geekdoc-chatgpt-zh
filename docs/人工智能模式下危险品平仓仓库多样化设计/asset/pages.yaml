    \times p[(x_2, y_2) \in K_2] \n + \sum_{x_2} \sum_{y_2} \frac{(r_q)^{N_p^2 + N_p^3
    + N_p^5 + N_p^6 + 2x_2(y_2-1)+1} \times r_p \times l_{C_2,p(x_2,y_2)}}{N_p^4}
    \times p[(x_2, y_2) \in K_1] \n (5.3)


    当距离集卡 C_3 最近的出库货位的行为 x_3，列数为 y_3 时，叉车 F_1, F_2 所行驶'
