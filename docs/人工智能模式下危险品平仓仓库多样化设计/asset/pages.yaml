- pgno: 160
  md: '# 2. 技术发展趋势


    首先，数据可视化将成为企业必备的手段。现代企业的经营决策离不开数据分析，需要数据来支持他们的一举一动。然而，传统的商业智能方法往往无法释放数据的力量，它们往往太复杂、太僵化、速度太慢。与此同时，数据可视化或商业智能仪表盘将会得到越来越广泛地应用，它们可以帮助人们快速接受和消化最相关的信息。将图形和图表与功能强大且易于使用的业务分析相结合，意味着每个部门的用户不但可以看到他们的组织如何实时执行，而且还可以采取必要的行动，防止小问题变成更大的问题，并挖掘新的机会。


    其次，基于大数据的预测分析将兴起。大数据分析一直是企业获得竞争优势并实现目标的关键战略之一，研究人员使用必要的分析工具来处理大数据并确定某些事件发生的原因。现在，通过大数据进行预测分析可以帮助更好地预测未来可能发生的情况。毫无疑问，这种策略在帮助分析收集的信息以预测消费者行为方面非常有效，这允许软件开发公司在开发之前了解客户的下一步行动，以确定他们必须采取的措施。通过数据分析，企业可以掌握更多的市场信息，了解市场变化的深层次原因。


    # 6.3.2 仓库管理软件的核心业务


    针对新型危险品仓库所开发的管理系统的核心技术在于分级安全管控与分区作业决策两部分。在这两部分内容中，有大量的发明专利与软件等待着我们去申请、去开发。例如，某一可行的决策模型可以由如下步骤组成。首先，制定互通仓库和叉车环岛行驶原则；其次，根据仓库内危险品存储周期计算基本参数；再次，确定安全红线下的安全度公式和最优方案决策指标；最后，采用提出的效用公式对危险品分区与否的存储方案进行综合比选，并确定最优方案。上述两部分内容中主要涉及的计算指标有仓库安全度、仓库匹配差异度、综合效用、企业长期运营成本、企业短期运营成本、企业运营权值等。服务于新型危险品仓库的管理信息系统主要包括智能拣选系统、智能管理系统两部分。


    # 1. 仓库智能拣选业务


    仓储是物流过程的重要环节，智能仓储的应用保证了仓库管理各个环节数据输入的速度和准确性，确保企业及时准确地掌握库存的真实数据，合理保持和控制企业库存。化工仓库智能拣选系统是一个高效的智能拣货系统，能使商品高效地流动，提高仓库的利用效率，减少差错。系统的自动化水平的高低直接决定了物流中心的性能高低。经过化工仓库实际调研和需求分析，著者认为该拣选系统'
  merge: -1
  img_proc: true
- pgno: 161
  md: '需实现如下四种功能。


    第一，实现人机交互，提高分拣货效率。通过计算机与软件的控制，借由灯号与数字显示作为辅助工具，指导员工正确、快速、轻松地完成拣货工作。


    第二，多种拣选方式并存，员工根据业务情况可以灵活选择串行和并行。


    第三，实现自动分配和作业均衡，高质量地完成货物分拣。


    第四，通过进行拣选区域规划和储位优先级的划分实现叉车运行线路的优化。


    其中，仓储企业应将安全作业监控软件集成于危险品出入库作业的路线优化功能模块中。安全作业监控软件需包含仓储作业的安全度计算公式，对于不同的危险品货位布设方案和出入库作业要求，安全作业监控软件需具有实时调整叉车运行路线的权限，从而实现安全的仓储作业，进而实现仓库作业效率的帕累托改进。


    # 2. 仓库智能管理业务


    新型仓库的管理系统需适应现代仓储行业数据集中化、管理个性化的特点，从精细化的管理出发，对货物存储和出入库等进行动态管控，实现货物生命周期的智能管理。经过详细的实际调研和理论分析，著者从订单接口、基础支持、费用计算等角度入手，为化工货物仓储管理一体化流程提炼了智能化管理的功能框架。需要指出的是，对于中小危险品仓储企业而言，他们可以选择
    MySQL 作为数据库，Java Script 作为前端开发语言，并且以 SSM( Spring、SpringMVC 和 Mybatis ) 作为技术框架，通过数据接口与后端进行实时数据交互。另外，配置的界面友好，有利于管理人员进行线上作业。


    # 6.4 危险品平仓仓库智能化管理平台建设阶段


    在完成多样化、差异化的仓库设计及管理软件开发后，我们建设危险品仓库智能化管理平台。在智能化管理平台建设中，仓储需求管理是核心。围绕仓储需求管理，我们将各危险品仓库分散的、各自独立的资源打造成一个线上资源共享的平台，实现对客户仓储需求的高质量、差异化及个性化管理。仓储需求管理是危险品仓库智能化管理平台的核心，是未来危险品仓储行业的神经中枢，具有用户体验网络化、仓储能力服务化、仓储数据融合化、仓储资源共享化等特征。调研显示，待搭建的仓储需求管理平台主要应有四项基本功能，其中，决策支持是核心功能。下面，我们将分两小节具体阐述。'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 6.4.1 仓储需求管理平台的四项基本功能


    当有一定数量的危险品平仓仓库采用了新的管理信息系统并联网时，我们可以获得危险品仓储行业的物流数据及仓库参数，并创建危险品仓储需求管理平台。仓储需求管理平台在分布式云网络技术的基础上构建，是危险品仓储行业的公共平台。构建该平台的意义不在于掌握危险品仓储作业业的海量数据，而在于对这些数据进行专业处理，并为每一个具体仓储企业的运营、决策提供智力支持，更好地满足客户的仓储需求。在该阶段仓储行业的主要任务如下：①完成大数据分析的数据算法基础；②利用统计知识及大数据处理技术处理采集到的数据，提炼危险品仓库运营规律，给仓储企业的运营提供决策支持。危险品仓储需求管理平台的主要功能如下。


    第一，支持线上线下商品统一管理。支持商品批号、规格、颜色、版本、序列号等最细节的管理；支持作业流程再造功能（流程可灵活配置）；支持按策略进行入库上架、出库、补货、拣货；支持入库中卸载、点货、质检、配盘等多操作管理，且流程可自定义；支持电商物流仓储的品种多、批量大、操作效率要求高等特点。


    第二，支持多种信息交互，消除信息孤岛。整体规划主要包含 EDI 数据交互平台，以支持 RF、SCANNER、RFID 等接口及与异构系统间的开放式接口，实现与企业内外其他管理平台的数据对接。


    第三，支持多点、多仓、多客户的分布式管理。支持多地点、多仓库、多客户、多供应商的集中式管理与权限管理，并且在管理过程中充分考虑平台管理过程中的责任和过错问题，为仓储企业、客户、平台设定不同的权利和义务，来实现仓储作业的相对安全。


    第四，支持仓储企业的经营决策。以大数据为基础，利用统计得到的信息，以多属性决策为工具，为仓储企业的决策提供决策意见，供仓储企业参考。


    在上述四项功能中，第四项决策支持功能的实现需要借助统计学、决策理论与信息管理理论的学科交叉，是仓储需求管理平台的核心。我们将在 6.4.2 小节中做进一步介绍。


    # 6.4.2 仓储需求管理平台的决策支持功能


    新型信息平台的主要功能是为仓储企业提供决策支持服务。依托于危险品仓储需求管理平台，我们可以获得全体危险品仓储作业业数据，进而通过大数据分析提高我们为客户提供仓储服务的能力，提炼危险品仓储需求管理规律。一'
  merge: -1
  img_proc: true
- pgno: 163
  md: '般情况下，这种决策支持服务主要包括作业支持服务、定价支持服务，以及其他支持服务。


    +   1. 作业支持服务


    首先，行业信息平台需基于客户的需求对客户资料进行分析。其次，基于大数据的建设方案评价系统对客户的资料以及需求进行分析。最后，给出客户诸如仓库布设方案、是否使用隔离门、是否分区等一系列建议，供客户参考。其中，实现上述分析的主要工具是最优化理论与多属性决策技术。软件中分析模块的核心算法是最优化理论与多属性决策技术的结合。另外，本项服务最主要的内容包括货位布设方案服务、隔离门使用服务，以及货位分区服务。


    +   2. 定价支持服务


    根据行业信息平台收集的危险品仓库货位单位价格，可以给出该行业平均价格。行业平均价格对于危险品仓库的运营决策有着决定性作用，可决定危险品仓储企业在当期的运营规划。同时，通过大数据分析行业平均定价变化趋势，可以对未来一定时期内危险品仓库的定价做出准确预测，能够为危险品仓储企业提供风险规避、企业转型等决策的重要评价指标。


    +   3. 其他支持服务


    通过信息平台的建设，仓库和客户还可以得到其他的常规的信息咨询服务。例如，根据信息平台提供的危险品仓库重要数据指标，客户可以进行仓库存储辅助决策。具体实施办法如下：客户向信息平台输入危险品物流的出发地与目的地、货物存储周期、货物种类和货物数量等信息，由信息平台为客户规划出具体的运输和存储路线，帮助客户实现成本最小化、效率最大化和风险最小化等目标。


    # 6.4.3 危险品仓库管理平台的子系统构成


    通过三个阶段的危险品仓库智能化建设，我们将建成一个智能化危险品仓库的框架。前文所给出的研究只是框架性的，为了实现危险品仓库的智能化，我们还要建立客户管理系统、仓储方案设计系统、仓库运输系统、货位存取系统、安全预警系统、仓库消防系统及仓库更新系统等，并最终建立面向客户的，以中心计算机按照算法统一控制的，全数字化、全自动化的危险品仓库。在智能化的危险品仓库中，中心计算机由管理人员分级控制，以降低成本、提高效率和保障安全为目标发布指令，控制危险品仓库的所有作业流程。下面我们具体介绍智能危'
  merge: -1
  img_proc: true
- pgno: 164
  md: '险品仓库的各主要管理系统。


    # 1. 客户管理系统


    客户是仓储企业利润的来源，满足客户的仓储需求是仓储企业发展的原动力。为了向危险品仓库企业提供个性化、高质量、高效率的仓储服务，我们需要为客户管理系统设置一个友好的界面，并且以客户最满意的方式自动采集、处理客户的仓储信息。与此同时，我们要建立客户数据库，将客户聚类，分析客户仓储偏好，以及客户仓储需求变化规律，进而高效率地为客户提供仓储方案，或提供仓储方案套餐供客户选择。另外，通过系统优化，将客户的仓储信息实时在线更新，实现客户对电子单证、仓储信息的快速查询及管理。从整体上来讲，通过客户管理系统的建设，只要客户提出了仓储需求，就可以获得最适合客户特点的个性化仓储服务。


    # 2. 仓储方案设计系统


    仓储方案设计系统通过最优化理论与数据处理技术的深度融合，在大数据、物联网及多源信息融合等新技术的支撑下，从历史仓储数据中提炼不同类型危险品仓库的仓储规律，细分仓储指标，建立仓储方案数据库，并推出越来越完善的仓储方案供客户使用。进一步地，通过仓储方案设计系统高效、持续的仓储供给推动智能化的仓库在仓储市场的发展，吸引更多的仓储企业加入仓储企业改造，采集更多精准的源数据，进一步完善仓储方案数据库。


    # 3. 仓库运输系统


    仓库运输系统通过试点及仿真等手段采集海量仓库运输数据及仓储参数，进而以最优化理论为工具指导无人运输叉车，识别约束条件和资源需求，并采用先进的通信和信息技术，为每一笔仓储业务提供最高效的仓储运输服务。同时，仓库运输系统实施叉车运行风险多级管控策略，并且赋予无人叉车信息交互功能，利用合作博弈理论对无人叉车进行过程管理，实现叉车的高效、安全运行及预见性制动。进一步地，仓库运输系统构建考虑效率、成本及客户类型的多目标叉车线路优化算法，拓宽仓库运输系统的应用领域，完成复杂环境下的仓储任务。


    # 4. 货物存取系统


    智能的货物存取系统是综合性的自动存货或取货系统，该系统的主要作业环境在货位和集装箱货位，并通过对叉车司机堆垛经验的学习建立反应策略，设置智能堆垛机械手臂，根据对现场货物的识别采取适当的堆垛拆垛作业，供智能叉车在存取货物时采用。考虑到包装危险品的最大风险来源于包装破损，而包装破'
  merge: -1
  img_proc: true
- pgno: 165
  md: '损往往发生在存取或运输环节，并且尤以存取环节更多，我们需要在货物存取系统设置程序，以有效处理托盘破损、货位没有货物或被放置杂物等特殊环境下的叉车作业问题，以及处理在通信中断条件下的叉车安排等问题。


    # 5. 安全预警系统


    危险品仓储作业对安全要求特别高，为了管控危险源，我们需要从危险品仓库管理系统设计的最开始即编写危险品仓库事故隐患实时排查方案，综合利用全球定位系统、感应线圈、传感器芯片、显示器等对仓储作业进行全程跟踪，对仓储设备进行全程监控，并将各类设备的工作状态实时传输到中心计算机。为了对危险品仓库可能发生的危险进行预警，我们需要在库区合理设置可燃气体探测报警装置、火灾自动报警装置、消防应急广播装置、火灾声警报警装置、感温探测器装置及消防控制室图像显示系统等。


    # 6. 仓库消防系统


    仓库消防系统包括两个子系统，其核心是一系列算法。第一个子系统是危险源识别子系统。当安全预警系统报警时，危险源识别子系统将利用模式识别算法对不确定信息进行处理，并给出对危险源的判断。第二个子系统是综合消防系统。当消防联动控制设备收到安全预警系统发出的信号后，立刻根据事先编制的应急预案，并通过消防通道和消防安全设施，综合利用智能化的自动喷水灭火系统、气体灭火系统、泡沫灭火系统、隔离门防火联动控制系统、防烟排烟系统等系统完成消防工作。


    # 7. 仓库更新系统


    仓储市场是随时间变化的，仓储设备也应该不断地更新。为给客户提供更好的服务，同时保持一定的设备利用率，仓库更新系统需要经常性地对设备进行更新。在物联网的环境下，对于一件设备，其升级往往意味着系统更新及设备替换，以及随之而来的潜在安全风险。仓库更新系统将决定在何时，以及对何设备进行更新。


    上述七个系统共同支撑了我国智能危险品仓库的建设，为危险品仓储企业的发展绘制了一幅美好的蓝图。本书重点研究的工作构成了客户管理系统、仓储方案设计系统、仓库运输系统及货物存取系统的核心算法，为危险品仓库智能化提供了一个三阶段的建设方案。通过该建设方案，我们将建设智能化、多样化、自动化，以及数字化的危险品平仓仓库。需要指出的是，在未来的智能危险品平仓仓库中还包括货控管理系统、仓库盘点系统、仓库补货系统等，由于已有学者研究这些子系统，本书将不再阐述[168-170]。'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# 6.5 本章小结


    本章以实现我国危险品仓库的智能化为目标，给出了一种包括三个发展阶段的危险品仓库智能化建设方案。目前国内学者对危险品仓储行业的研究较少。希望读者通过本章的介绍能对危险品仓库，特别是平仓仓库的发展前景形成一些定性的认识。当然，由于调研的相对性、市场的变化，以及我们分析问题的局限性，本章内容未必能完全得到实现，虽然如此，我们仍然希望为大家介绍一些自身的知识，进而带来一些有益的思考。'
