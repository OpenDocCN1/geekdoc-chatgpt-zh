    惯性权重随着迭代次数减小，动态改进学习因子的基础上，引入遗传算法中的共享适应度函数，提出了一种改进了的遗传-离散粒子群算法。通过对四门仓库同时出入库作业叉车线路优化算例，表明该算法是一种容易实现、精度高、收敛快的优化算法。另外需要指出的是，实例表明遗传可行解算法耗时太长，因而不适合在现实生产中推广。


