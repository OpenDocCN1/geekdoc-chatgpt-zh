    抵达入库点后将货物放下, 放下货物耗时 \(t_2''\) 分钟, 同时根据入库点与出库点匹配结果, 驶向该入库点作业所对应的出库点, 抓取出库货物。


    步骤 3.18: 叉车带离出库货物驶向出库集卡, 叉车放下货物后判断是否还有入库作业待完成。如果仍然有任务, 由仓库外的出入库集卡连接直道驶向入库集卡, 至此一个出入库作业闭环运输完成。如果没有入库作业待完成,
    那么此时集卡便停在出库集卡处, 同时安全性指标计算停止, 整个仓储作业完成。一辆叉车的所有仓储作业往返行程称为仓储作业链。这记为完成一次仓储任务, 两辆叉车所对应的仓储作业链对为
