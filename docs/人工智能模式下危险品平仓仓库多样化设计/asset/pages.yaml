  md: '车线路优化模型 \(z_2\)。并使用遗传-神经网络算法得到叉车运行路线的可行解，从而计算叉车运行路径总长度。然后计算各方案下叉车运行的时间成本、经济成本及直接机会成本。具体步骤如下。


    步骤 5.9：计算常规模式下危险品出入库产生的时间成本 \(c''_t\) 和经济成本 \(c''_e\)，进一步求解直接成本 \(z_1\)。


    步骤 5.10：以出入库业务的短期综合成本最低为主要目标，考虑出入库操作失误带来的直接损失，构建压仓条件下的互通危险品仓库常规作业模型如下：


    \( \min z_2'''' = e^{-1} \left[ v_1^{-1} L^* + v_2^{-1} \sum_{i=1}^{n-1} l(c_j,
    c_{j+1}) \right] + BL^* + 1000c_{dl} + c_{de} + 1000c_{st} + c_{se} \quad (5.12)
    \)


    步骤 5.11：从最终的入库点与出库点集合中选取 \(l(p_{i_k}, q_{j_k})\) 与 \(l(p_{i_k}, q_{j_{f''}})\)，定义
    \(l(p_i, q_{j_k})\) 与 \(l(p_{i_k}, q_{j_k})\) 之间的相似度为 \(r\)，将其规范化得


    \( r^*[(p_{i_k}, q_{j_k}), (p_{i_k}, q_{j_k})] = 1 - \frac{abs[l(p_{i_k}, q_{j_k})
    - l(p_{i_k}, q_{j_k})]}{\max\{l(p_{i_k}, q_{j_k}), l(p_{i_k}, q_{j_k})\}} \quad
    (5.13) \)


    随后，将每一个出入库点对间的距离规范化得


    \( L^*(p_{i_k}, q_{j_k}) = \frac{L(p_{i_k}, q_{j_k}) - \min_{k'' \in M, f'' \in
    N} L(p_{i_{k''}}, q_{j_{f''}})}{\max_{k'' \in M, f'' \in N} L(p_{i_{k''}}, q_{j_{f''}})
    - \min_{k'' \in M, f'' \in N} L(p_{i_{k''}}, q_{j_{f''}})} \quad (5.14) \)


    其中，相关度对应叉车运行效率；路径总长度对应叉车运行成本。


    步骤 5.12：为了实现总相似度指标 \(r^*\) 及闭环路径总长度 \(L\) 最小的目标，构建多目标模型


    \( \begin{cases} \min \gamma = \sum_{i_k, i_l} \sum_{j_h, j_{f''}} \{x_{i_k i_l}
    x_{j_h j_{f''}} r^*[(p_{i_k}, q_{j_h}), (p_{i_k}, q_{j_{f''}})]\} + \sum_{i_k=1}^{m}
    \sum_{j=1}^{n} x_{i_k j} L^*(p_{i_k}, q_{j_h}) \\ + \sum_{i=j=2}^{3} \sum_{j_j=1}^{n-m}
    \{x_{C_{j_k}} x_{C_{j_{j''}}} r^*[(C_j, q_{j_k}), (C_j, q_{j_{f''}})]\} + \sum_{i=2}^{3}
    \sum_{j=1}^{n-m} x_{C_{j_k}} L^*(C_j, q_{j_k}) \quad (5.15) \\ \text{s.t.} \sum_{i_k=1}^{m}
    x_{i_k i_l} = 1, \sum_{j_k=1}^{n} x_{i_k j_h} = 1, x_{i_k i_h} \in \{0, 1\}, x_{i_k
    i_{k_f}} \in \{0, 1\}, x_{C_{j_k}} \in \{0, 1\} \end{cases} \)


    步骤 5.13：使用遗传-神经网络算法求解模型 (5.15)，进而得到两种方案下叉车运行出入库点对的全局最优解。


    步骤 5.14：计算互通仓库内叉车运行的路径总长度 \(L^*\)，计算互通模式下出入库产生的时间成本 \(c_t(L^*)\) 和经济成本 \(c_e(L^*)\)，进一步得到互通模式下产生的综合成本
    \(z_2''\)，并将常规出入库模式综合成本与互通出入库模式综合成本进行比较，得到不同出入库模式的适用环境。'
