  md: '# 前 言


    2015 年以来，我国危险品仓库发生了一系列安全事故，我们痛心于这些事故带来的人员伤亡及财产损失，开始对危险品仓库进行研究。自 2016 年以来，我们先后调研了新加坡、上海、常熟、张家港等地的多所危险品仓库，深刻认识到“在中国，危险品仓储是整个物流行业的洼地，面临着迫切的改革需求”。进一步地，通过对政府相关管理部门及仓储客户的调研，我们认识到智能化建设是解决危险品仓储安全问题的出路。为了帮助仓储企业更安全、更高效地发展，本书以智能化管理客户的仓储需求为目标，系统研究了中国建筑面积最大、数量最多的包装危险品仓库——双门平仓仓库，并在符合安全标准的前提下，利用一系列数学模型实现双门平仓仓库仓储作业效率的分阶段累积提升。具体地，危险品仓库的智能化建设分三个阶段，第一个阶段是危险品仓库的几何结构改造，第二个阶段是危险品仓库的软件建设，第三个阶段是危险品仓库的管理平台建设。在本书中，仓库的几何结构改造、仓库类型的多样化设计是危险品仓库智能化的工程基础，叉车运行算法设计是危险品仓库智能化建设的软件基础，向客户提供多元化、差异化的服务，对仓储需求进行高效管理是危险品仓库智能化的目标。


    首先，本书借鉴新加坡等世界一流危险品仓库的建设和管理经验，围绕“出入库作业”这一危险品仓库业务的核心环节，以最优化理论和多属性决策理论为主要工具，有效结合建筑、计算机编程、统计分析等技术，提出一套平仓仓库改造与优化方案。其次，本书以危险品平仓仓库的几何结构改造为工程基础，以专业的仓库管理信息系统为软件基础，创建危险品仓储需求管理平台，以实现对客户仓储需求的即时化、多元化、差异化、信息化及智能化管理。在学术上，本书的最大贡献是给出了危险品仓储作业的安全度计算公式，特色是将最优化理论与多属性决策理论结合起来。在工程上，本书创造性地给出了危险品仓库仓储需求管理的信息化路线图，以及仓库仓储需求管理平台的建设方案，为不同的危险品仓库指出个性化的发展方向。


    本书的出版得到了上海市浦江人才计划（编号 2019PJC062）、山东省自然科'
