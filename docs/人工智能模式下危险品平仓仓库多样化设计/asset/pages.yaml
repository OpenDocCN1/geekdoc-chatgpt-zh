- pgno: 158
  md: '企业的服务升级势在必行。从长远看，社会要求危险品仓储企业拿出更多的智能化、订单化服务方案，为个性化的仓储客户提供针对性强的服务，满足客户的仓储需求。然而当仓储企业向智能化转型迈出第一步时，所面临的关键障碍不是来自技术的不足或客户的变化，而是自身只有一项双门仓库仓储方案，没有其他的方案。危险品仓库几何结构的改造是仓库产业升级及仓储条件多样化进程的物理基础。为了实现危险品仓储行业的发展，当务之急是深化对危险品仓库的几何结构改造。正是在这一思想的指导下，著者以数量最多的平仓仓库为对象，进行了一系列危险品仓库几何结构研究，设计了一系列行之有效的危险品仓库几何结构方案，在危险品仓库多样化研究迈出关键的第一步。进一步地，我们将在多元化危险品仓库的基础上，借助现代化的计算机及物联网技术，推出新一代管理信息系统。同时，我们将危险品仓储客户按照属性分类，并根据客户的特点，实现对仓储需求的分类别、分等级、分时段管理，提供有针对性的仓储服务，在保证安全的前提下提升仓储企业的效益。最后，我们基于仓库的几何结构改造与重建的仓库管理信息系统，为危险品仓储行业推出仓储需求管理平台，以实现对危险品仓储需求的智能化管理。


    在对上述分析进行理论总结，我们提炼出了危险品仓储企业改革的路线图。危险品仓储企业改革共分为三个阶段，第一阶段，设计差异化、多样化、智能化的危险品仓库；第二阶段，基于多类型的危险品仓库几何结构，推出现代化的仓储管理软件，帮助仓储企业实现生产效能的提升；第三阶段，基础现代化的仓储管理系统，实现危险品仓储企业出入库作业的联网管理，并利用统计软件分析危险品仓储行业的即时生产数据，指导各危险品仓储行业的管理与经营。接下来，我们将具体介绍危险品仓库的智能化建设。


    # 6.2.2 危险品仓库智能化建筑设计思路


    第 2~5 章，我们介绍了四门、互通及环岛三种类型的危险品仓库，并为三种新型仓库管理的核心环节（即出入库作业）提供了基本的算法支持。通过最优化算法及控制技术，我们拥有了具有自动控制系统的各种自动化设备，为人-库信息交互创造了条件。同时，通过感应器建设及通信网络建设，我们有了即时的信息采集系统及通信系统。进一步地，上述自动化设备、信息采集系统与通信系统构成了危险品仓库智能化建设的框架。在此框架下，我们按照如下思路建设危险品仓库，将仓库建设成具有生命力的建筑。


    具体地，危险品仓储房间的智能化包括结构的智能化、系统的智能化、服务的智能化，以及管理的智能化。在智能化的仓库中，通过隔离门的动态布设，我'
