  md: '及人民群众生活质量的不断提高，国内市场对危险品的需求逐年增加。由于我国危险品仓库的缺口在 20%左右，某些城市和化工产业发达地区更是达到 30%以上，客户的仓储需求难以得到满足，甚至部分客户选择危险品异地仓储或者找寻“黑仓库”渠道，或者退而求其次，降低对安全的要求，将危险品放在自家并不符合危险品仓储规范的仓库。这些方法在表面上解决了客户的仓储需求，实际上却增加了发生事故的风险，以及客户危险品仓储的机会成本。


    第二，现阶段在危险品仓储需求管理中一刀切现象严重，缺乏对客户的针对性服务。


    当前，我国危险品仓储需求的增长非常迅速，且仓储需求日益呈现出多样化、差异化、个性化。与此同时，我国的危险品仓库形式单一、服务单一、增值服务较少、创新较少，缺乏客户仓储需求的针对性服务。现阶段，大数据、云计算、人工智能、机器学习、物联网等技术的出现不断颠覆人们的生活方式，客户仓储需求的时效性、多样性与过去相比发生了天翻地覆的变化。为了更有针对性地满足客户的仓储需求，社会需要仓储企业推出更多的仓储方案。


    第三，我国危险品仓库仓储需求管理的现代化水平偏低。


    目前，我国危险品仓储业现代化水平不高，主要表现如下五个方面。一是我国危险品仓储业的现代经营理念不高，重经营轻管理、重效益轻服务、重经验轻技术、重眼前轻发展的经营理念仍然存在，在很大程度上制约了向现代化发展的速度。二是危险品仓储业的管理手段不够先进，相当一部分企业在管理上依赖经验，缺乏标准化运作程序和智能化管理手段。三是我国的仓储设施不足、设备落后、机械化自动化水平不高，特别是一些老企业在这方面的差距更为明显，手工作业和体力劳动比重较大，难以适应高速发展的要求。四是国内危险品仓库几何结构设计落后，以平仓仓库为主，投入空间成本高，仓库效率低下。目前我国危险品仓库的主要类型及各类型的占比见表
    5.1。五是国内仓储业的信息化管理水平不高。目前我国危险品仓储业只有少数企业实现了信息网络管理，大多数企业信息管理水平不高，个别企业还没有建立自己的信息管理系统，严重影响了企业向现代物流发展的速度。


