  md: '数。考虑到当存储周期较长的货物出现在长期适用度值较小的货位上时影响比存储周期较短的货物出现在长期适用度值较大的货位上的影响度更大，因此，当存储周期较长的货物出现在长期适用度值较小的货位上时，\(\alpha\)
    可以取值为大于或等于 0.5 的数，而当存储周期较短的货物出现在长期适用度值较大的货位上时，\(\alpha\) 可以取值为小于或等于 0.5 的数。进一步地，经过对所有货位进行适用度集成，可得到整个危险品仓库的匹配差异度，记为
    \(\varphi = \sum(S_i \times n \times \alpha)\)。进一步地，通过比较随机摆放时和分区摆放时的匹配差异度，可以得出危险品仓库中货物仓储的合理程度，并以此为指标评判该危险品仓库的效用值。


    # 3. 货位分区下的危险品仓储作业成本模型


    在经过实际调查分析后，我们主要将成本 \(C\) 分为固定成本和可变成本，则总成本评价函数可表示为 \(C = C_r + C_w + C_p\)，其中，\(C_r\)
    主要包括货位地租费用，\(C_w\) 主要包括工人工资成本，该两项成本在短期内可视为常值，较易获取。因此，本节将研究集中到叉车行驶成本 \(C_p\)。我们以叉车三集卡为例进行了研究，在环岛单向行车规则下，叉车行驶成本
    \(C_p\) 由叉车行驶所消耗的燃油及单次出入库作业的时间两个因素决定，故可表示为


    \(C_p(m,n) = w_1 \times (c_s + c_f) + w_2 \times \left(\frac{d_s}{v_s} + \frac{d_{out}}{v_f}\right)\)
    (4.9)


    其中，\(w_1, w_2 \in [0,1]\), \(w_1 + w_2 = 1\), \(d_s\) 为关于入库货位数 \(m\) 与出库货位数 \(n\)
    的函数。在确定入库货位数 \(m\) 与出库货位数 \(n\) 的情况下，随机选取入库货位和出库货位的位置，结合叉车出入库的运行步骤，计算出每种情况下叉车在仓库内行驶的最短距离
    \(d_s\)。另外，由于叉车完成一次出入库作业后需返回入库集卡所在的入口，从而进行下一次作业，故我们通过入库集卡与出库集卡的位置计算叉车在仓库外行驶的最短距离
    \(d_{out}\)。其可表示为


    \(d_s = d_{in} = \min[d(P_{r_i}, p_{i_i}) + d(p_{i_i}, q_{j_i}) + d(q_{j_i}, P_{r_j})]\)
    (4.10)


    其中，\(i_1, i_2 \in M, j_1, j_2 \in N\)。另外，叉车在仓库外行驶的最短距离 \(d_{out}\) 可表示为 \(d_{out}
    = d(P_{r_j}, P_{r_i})\)，在一般情况下，叉车行驶的速度会影响到叉车的油耗，且叉车在仓库内行驶时，行驶速度越慢，单位时间所消耗的油料越多。因此，通过设置环岛单向行车规则，叉车可以避免会车时的减速，从而可得
    \(v_s > v_{ns}\)，且 \(c_s < c_{ns}\)。同时，设置环岛行车规则可能导致叉车在仓库内行驶的距离增加，因此当 \(d_s > d_{ns}\),
    \(v_s > v_{ns}\) 时可通过比较效用变化函数中第二项的大小来确定哪种方式可获得最高效率。'
