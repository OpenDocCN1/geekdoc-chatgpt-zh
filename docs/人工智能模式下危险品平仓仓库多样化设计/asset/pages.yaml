  md: '# # 第 2 章 四门危险品平仓仓库与互通危险品平仓仓库的设计


    随着我国经济的迅速发展，行业间前所未有地互相渗透，危险品仓储客户出现了细分现象。为了帮助仓储企业拿出更多的服务方案，以满足客户的多样化、差异化仓储需求，本章设计了四门危险品平仓仓库及互通危险品平仓仓库。两类新型仓库的设计是本书的逻辑起点，也是危险品仓库智能化的物理基础。两种新型危险品仓库设计的核心环节是设置电动隔离门。电动隔离门设置在危险品仓库不同房间的墙体上，可打开也可关闭。当隔离门均关闭时，四门仓库和互通仓库退化为常规双门仓库；当隔离门按照一定算法逐次打开时，常规仓库可进化为四门仓库或互通仓库。通过四门及互通危险品的设计，本书为仓储企业提供了多种新仓储方案，提高了仓库服务仓储客户的能力。与此同时，本章为四门仓库和互通仓库的仓储作业提供了算法支持，将工业设计与交通工程学有机结合起来，为危险品仓库叉车线路规划研究树立了一个起点。本章各节的主要内容如下。


    2.1 节借鉴 20 英尺（1 英尺 = 0.304 8 米）和 40 英尺集装箱的设计经验，在广泛调研的基础上提出了危险品四门仓库的概念，并给出了四门仓库的使用原则。进一步地，该节基于拓扑变换，将四门仓库同时出入库作业双叉车运行的线路优化问题提炼为一种特殊的二次指派问题。其后，该节在经典粒子群算法的基础上，发展了一类特殊的遗传-粒子群算法，并用来求解二次指派问题。最后，该节参考上海某危险品物流有限公司的调研数据，验证了新提出的改进遗传-粒子群叉车运行线路优化算法，并将该算法与经典离散粒子群算法及遍历可行解算法做了对比。


    2.2 节在广泛调研的基础上提出互通危险品仓库的设计思路，并给出了互通危险品仓库中电动隔离门的使用原则。进一步地，该节以六门仓库为样本，以遗传-神经网络算法为工具，研究了双叉车、三叉车同时入库作业，且在货位不确定环境下的叉车线路优化问题，给出了不同环境下的叉车运行算法。最后，该节'
