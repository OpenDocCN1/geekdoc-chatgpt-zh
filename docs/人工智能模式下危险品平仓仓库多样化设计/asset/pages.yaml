- pgno: 128
  md: '二的货位布设方式，为减少叉车仓库内长距离绕行，可通过增加单元与单元之间电动隔离门的数量来实现单元间互通性的增强，减少叉车长距离行驶的可能性。

    方案四与方案五的优势在于叉车仓库内行驶路线转弯较少，因此叉车行驶时可适

    当提高速度，从而加快出入库作业效率，但缺点在于单元与单元之间需要打通并

    设置隔离门的数量较多，在管理隔离门的开闭时需要考虑较多因素，且在大多数

    单元中，上下两部分的连通性较差。方案六的优点为仓库内各个单元之间的互通

    性最好，但此种布设方案的空间利用率较低。


    在调研的基础上，本节给出了十门危险品仓库的使用原则：首先，叉车优先

    选择入库集卡所对应的仓门所在单元内的货位进行入库作业。其次，在进行出库

    作业时优先选择出库集卡所对应的仓门所在单元内的货位进行出库作业。再次，

    对于仓库内的每一个货位仅存在两种状态，即入库或出库。最后，当距离入库集

    卡最近的入库货位或距离出库集卡最近的出库货位与入库集卡和出库集卡不在中

    轴线同侧时，叉车会选择环形路线而非折返路线行驶。


    # 5.2.3 仓库货位动态布设条件下危险品存储定价方法


    # 1. 基本参数介绍


    以双叉车双集卡入库，单集卡出库为例，记 \( C_1 \) 和 \( C_2 \) 为入库集装箱，\( C_3 \) 为出库

    集装箱。假设 \( C_1 \) 和 \( C_2 \) 有 \( m \) 个人库点，记为 \( p_1, p_2, \cdots, p_m \)。 \(
    C_3 \) 共对应 \( n \) 个出库点，

    记为 \( q_1, q_2, \cdots, q_n \)，其中，\( M = \{1, 2, \cdots, m\} \)，\( N = \{1, 2,
    \cdots, n\} \)。方便起见，将入库点和

    出库点统称为货位，并记为 \( S_i \)。记为 \( C_1 \) 和 \( C_3 \) 服务的叉车为 \( F_1 \) 记为 \( C_2 \)
    和 \( C_3 \) 服务的

    叉车为 \( F_2 \)。对任意的 \( i \in M, j \in N \)，假定叉车 \( F_1 \) 先从 \( C_1 \) 出发，经路径 \(
    l_{p_i, p_j} \) 将 \( C_1 \) 的

    危险品运抵给定的 \( p_i (i \in M) \)，随后经路径 \( l_{p_i, q_j} \) 在 \( q_j (j \in N) \) 处取运往
    \( C_3 \) 的危险品，

    继而经路径 \( l_{q_j, C_3} \) 将危险品运抵 \( C_3 \)，并经路径 \( l_{C_3, C_1} \) 空驶返回 \( C_1
    \)。记此出入库往返路

    线长度为 \( S_{p_i, q_j}^{C_1} \)。同理，叉车 \( F_1 \) 可以先从 \( C_2 \) 出发，经路径 \( l_{C_2,
    p_i} \) 将 \( C_2 \) 的危险品送抵给定

    的 \( p_i (i \in M) \)，随后经路径 \( l_{p_i, q_j} \) 在 \( q_j (j \in N) \) 处取运往 \( C_3
    \) 的危险品，继而经路径

    \( l_{q_j, C_3} \) 将危险品运抵 \( C_3 \)，并经路径 \( l_{C_3, C_2} \) 空驶返回 \( C_2 \)，记该出入库路径长度为
    \( S_{p_i, q_j}^{C_2} \)。

    由于出入库作业的集卡数为定值，故可以通过比较叉车进行出入库的作业时间来

    比较仓储效率。针对本节提出了 6 种不同的布设方案，记 \( n_s = \{1, 2, \cdots, 6\} \)，记 \( v_{n_s} \) 为

    叉车运行速度，\( \chi_{n_s} \) 为仓库内货位之间的稀疏度，\( t_{n_s} \) 为叉车完成一次出入库作业的

    运行时间，\( w_{n_s} \) 为叉车单位时间内行驶所消耗的燃油，\( o_{n_s} \) 为机会成本。记叉车行

    驶所需的燃油价格为 \( P_{\text{oil}} \)。'
