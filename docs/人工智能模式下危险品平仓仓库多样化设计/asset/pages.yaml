    # 4. 计算结果分析


    上述研究表明，在仓库内存在环岛行车规则的情况下，危险品仓储企业需根据当期包装危险品出入库数量来设置分区规则。通过实际调查和计算得出，若某危险品仓库出库货物较多，则不应对仓库进行分区；当包装危险品仓库入库货物较多时，则应对仓库实行分区。同时，我们通过实例得到以下四个结论。


    第一，当库内当期入库货位数量小于出库货位数量，且企业根据自身经营经验得出后续危险品存储量较小时，选择分区可使仓库短期运营成本下降。'
  merge: -1
  img_proc: true
- pgno: 115
  md: '第二，当库内当期入库货位数量小于出库货位数量，且后续危险品存储量较大时，选择不分区以保证库内适用度差值较小，进而降低仓库长期运营成本。


    第三，当库内当期出库数量小于入库货位数量，且企业根据自身经验得出后续危险品存储量较大时，选择不分区可使仓库短期运营成本下降。


    第四，当库内当期出库数量小于入库货位数量，且后续危险品存储量较小时，选择分区可降低仓库内货物适用度差值，从而降低长期成本。


    汇总上述四个结论可知，当面临分区抉择时，仓库可结合自身财产状况、经营理念等，参考综合效用评价函数和长短期成本，选择有利的分区、不分区决策，完成成本、效率优化，实现对危险品仓储的帕累托改进。通过实例进一步发现，与常规仓库相比，包装危险品仓库对安全有更高的要求。为了统筹兼顾危险品出入库作业的安全、效率、成本等因素，我们以设置叉车环岛运行规则为研究背景，以最优化理论和新提出的成本计算公式为工具，研究了包装危险品环岛平仓仓库的分区设置问题，并通过数值仿真，得到了环岛平仓仓库货位分区的四个结论。本节考虑了行业仓储需求及货物储存时间周期等因素，在保证安全的前提条件下为不同的仓储客户提供针对性服务，为环岛平仓仓库提供技术支持。本节在实践中的最大创新点是给出了危险品出入库作业时的叉车运行安全度公式，并且给出了在安全红线设置下的安全度计算方法；本节在理论上的最大创新是将述宫寻径算法与效用理论结合起来研究危险品出入库问题。最后，本节利用在长三角调研中得到的危险品仓库参数，以双集卡入库、单集卡出库为实例，结合仿真技术，验证了新提出理论的有效性和可行性。同时，在实际作业中，为了最大化危险品仓库安全度，可以在叉车进入安全红线范围内时，对于叉车司机进行减速和避让提示，进一步降低危险品仓库中出现事故的概率。


    # 4.3 本章小结


    为了进一步实现危险品仓库的多样化，本章提出了环岛危险品仓库的概念，并从运行规则、仓库布局两个角度对环岛危险品仓库进行了研究。本章取得的主要结论如下。


