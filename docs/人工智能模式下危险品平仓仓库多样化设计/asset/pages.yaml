    }{ 2 } \quad (3.17) $$


    其中, \(\omega_1\) 和 \(\omega_2\) 分别为重点监控时间和重点监控空间在安全度计算中的权重, 这两个参数由作业管理人员根据仓库具体实际给出,
    且 \(\omega_1 + \omega_2 = 1\)。需要指出的是, 由于两辆叉车所分配任务数量上可能存在不对等的情况及工作时间上的差异, 可能会存在两辆叉车不同时完成任务的情况,
    当其中任意一辆叉车完成任务待在出发点时, 此时便不存在由潜在的碰撞带来的不安全因素, 所以本节在计算安全性评价指标的大小时, 当任意一辆叉车停止工作时, 计算便停止。


