    x_m)\) 进行排序, 确定最优方案。


    # 步骤 2.27: 分别对调整因子 \(\omega_1\)、 \(\omega_2\) 进行灵敏度分析。给定 \(\omega_1\)、 \(\omega_2\)
    的调整区间, 针对每个方案, 得到不同权重向量下的综合属性相对距离值, 进而得到不同调整因子下相对距离值的变化趋势。


    # 步骤 2.28: 将得到的决策结果与常规 TOPSIS 决策方法比较, 进一步说明超立方体分割方法的有效性。


    # 3. 给定属性权重时的隔离门使用模型


    在给定优选指标的权重信息时, 由于调整因子的不确定性, 故同一属性在同一方案下有不同的值。我们使用带参数的犹豫综合属性距离集算法对方案集进行排序, 具体步骤如下。


    # 步骤 2.29: 考虑到油价和仓租费的不稳定性, 使得同一属性在同一方案下有不同的值, 因此本节借鉴犹豫模糊集的定义, 在给定的调整区间内, 得到的犹豫决策集为


    ```

    \(C_{m \times 4} = \begin{bmatrix} c_{r1} & \{c_{sp11}, c_{sp12}, \cdots, c_{sp1n_2}\}
    & \{c_{e11}, c_{e12}, \cdots, c_{e1n_3}\} & c_{sa1} \\ c_{r2} & \{c_{sp21}, c_{sp22},
    \cdots, c_{sp2n_2}\} & \{c_{e21}, c_{e22}, \cdots, c_{e2n_3}\} & c_{sa2} \\ \vdots
    & \vdots & \vdots & \vdots \\ c_{rm} & \{c_{spm1}, c_{spm2}, \cdots, c_{spmn_2}\}
    & \{c_{em1}, c_{em2}, \cdots, c_{emn_3}\} & c_{sam} \end{bmatrix}\)

    ```


    # 步骤 2.30: 求解犹豫决策集中的负理想点


    ```

    \(C_{\max} = \left(\max_{i=1}^m c_{ih}, \max_{i=1}^m \left(c_{spi1}, c_{spi2},
    \cdots, c_{spin_2}\right), \max_{i=1}^m \left(c_{ei1}, c_{ei2}, \cdots, c_{ein_3}\right),
    \max_{i=1}^m c_{sai}\right) \quad (2.15)\)

    ```


    并计算各决策方案与负理想点的距离, 得到相对距离矩阵为


    ```

    \(D_{m \times 4} = \begin{bmatrix} d_{11} & \{d_{sp11}, d_{sp12}, \cdots, d_{sp1n_2}\}
    & \{d_{e11}, d_{e12}, \cdots, d_{e1n_3}\} & d_{sa1} \\ d_{21} & \{d_{sp21}, d_{sp22},
    \cdots, d_{sp2n_2}\} & \{d_{e21}, d_{e22}, \cdots, d_{e2n_3}\} & d_{sa2} \\ \vdots
    & \vdots & \vdots & \vdots \\ d_{m1} & \{d_{spm1}, d_{spm2}, \cdots, d_{spmn_2}\}
    & \{d_{em1}, d_{em2}, \cdots, d_{emn_3}\} & d_{sam} \end{bmatrix} \quad (2.16)\)

    ```'
