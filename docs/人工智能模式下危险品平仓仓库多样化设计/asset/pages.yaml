    # 3.3 互通危险品平仓仓库仓储作业链及作业优化方法


    # 3.3.1 研究问题的提出


    在危险品仓储作业中，我们需要关注两类危险源。其中，第一类危险源是事故发生的前提，是事故的主体，决定事故的严重程度；第二类危险源是第一类危险源导致事故的必要条件。在叉车作业中，危险源集中在叉车的碰撞和叉车距离的靠近上。前者是危险品仓储作业中最需要关注的第一类危险源，后者是危险品仓储作业中需要关注的第二类危险源。为了做好本项研究，本节以平仓仓库为研究背景，主要围绕第二类危险源的防控，重点关注了危险品仓库[135-139]、多属性决策[140]、最优化理论[141-143]等方面的最新研究成果。为了对多任务条件下仓库内叉车的调度方案提供技术支持，进而保证危险品出入库活动的安全高效，本节借鉴现有研究成果，以一类互通危险品仓库为研究背景，以多叉车运行线路为条件，以五个随机出入库位置为样本，研究了特定情况下的叉车最优调度问题。


    本节定义叉车运行规则如下。首先，叉车在危险品仓库门外集装箱里取出待入库货物，并经过行驶将入库货物存放到入库货位；其次，驾驶空车到出库货位，将出库货物取出，并运送到危险品仓库门口的出库集装箱里，完成一次闭环运输。叉车在一次完整的仓储作业中需完成多个闭环运输。在给出了叉车运行的基础上，本节将主要从以下几个方面展开研究：首先，对危险品仓库的仓储链及监控问题进行阐述；其次，建立危险品仓储作业优化模型，为调度方案的评价提供支持，最后利用调研参数，对新提出的模型进行验证。


