    # 2.4 本章小结


    为了向客户提供更多的仓储方案，本章从危险品仓库的几何结构入手，提出了四门及互通危险品仓库的概念，并利用最优化理论研究了两类新型危险品仓库的可行性。


    通过 2.1 节的研究，我们主要得到如下三点认识。第一，提出了四门危险品仓库的概念，为危险品仓库的几何设计提供了一种新的、特色鲜明的选择方案，为仓库设计增加了选项；第二，给出了一种二次指派问题的实例，丰富了最优化问题的案例库；第三，将一类粒子群算法推广到离散优化领域，提出了一种改进了的遗传-离散粒子群算法。


    通过 2.2 节的研究，我们主要得到以下两点认识。第一，互通危险品平仓仓库能有效提高危险品仓库出入库效率，减少物流成本。第二，该节将提出的遗传-BP 神经网络算法与常规
    BP 神经网络算法进行了比较，验证了新提出遗传-BP 神经网络算法的有效性。


    通过 2.3 节的研究，我们主要得到如下两点认识。第一，我们将互通危险品仓库的合理使用提炼为一种多指标下的决策问题。通过科学的决策以及正确使用互通危险品仓库，我们能有效提高危险品的出入库效率。第二，该节从理论上提出了两种危险品仓库隔离门使用模型，并通过实例与常规决策模型进行了比较，说明新提出方法的有效性。


