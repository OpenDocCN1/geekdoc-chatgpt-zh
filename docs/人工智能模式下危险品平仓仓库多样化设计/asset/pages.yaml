  md: '# 2.3 互通危险品平仓仓库中隔离门使用的决策方法


    # 2.3.1 研究问题的提出


    截至目前，我国现有的危险品仓库多是平仓仓库，且多是双门规制。为了满足危险品物流业对危险品仓储效率日益增强的要求，在广泛调研的基础上，本章提出了四门危险品仓库及互通危险品仓库的概念。传统双门危险品仓库、四门危险品仓库和互通危险品仓库都是可供仓储企业使用的仓库几何结构。双门仓库与互通危险品仓库协调使用示意图见图
    2.14。图 2.14 左侧是常规双门仓库，右侧是带有隔离门的智能仓库。与常规危险品平仓仓库相比，互通危险品仓库的最大特征是在规划双门仓库之间设计一种可推拉的隔离门。在给定的仓储条件下，根据隔离门的使用情况，可以设计多种危险品存储方案。在多种方案中评价和优选出最合理的互通危险品仓库使用方案是一个重要的问题，通过该问题的解决能够实现互通危险品仓库的优越性，提高仓储公司的综合效益。


    ![](img/82f0a1e9c99ca5f51f0110a293ae6965_46_0.png)


    图 2.14 双门仓库与互通危险品仓库协调使用示意图


    为了提炼隔离门的使用规律，我们重点关注了危险品运输安全[88-92]、多属性决策[93-102]、出入库作业操作成本，如空间成本、经济成本、时间成本等方面的内'
