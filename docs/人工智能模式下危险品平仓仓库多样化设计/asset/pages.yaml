  md: '# 步骤 2.31：令 \( D_1 = \{d_{11}, d_{12}, \cdots, d_{1m} \}, D_2 = \{d_{21}, d_{22},
    \cdots, d_{2n} \} \) 是两个犹豫距离集，

    定义


    ```

    \( C_{D_1 > D_2} = \{(d_{1s}, d_{2t}) \mid |d_{1s} - d_{2t}| > 0, s=1, 2, \cdots,
    m, t=1, 2, \cdots, n \} \)

    \( C_{D_1 < D_2} = \{(d_{1s}, d_{2t}) \mid |d_{1s} - d_{2t}| < 0, s=1, 2, \cdots,
    m, t=1, 2, \cdots, n \} \)

    ```


    其中，\( L(C_{D_1 > D_2}) \) 和 \( L(C_{D_1 < D_2}) \) 分别为集合 \( C_{D_1 > D_2} \)、\(
    C_{D_1 < D_2} \) 的基数。根据犹豫距离集的比较方法得 \( P_{D_1 > D_2} = \frac{l(D_1 > D_2)}{mn}
    \) ， \( P_{D_1 < D_2} = \frac{l(D_1 < D_2)}{mn} \) ， \( P_{D_1 = D_2} = \frac{mn
    - l(D_1 > D_2) - l(D_1 < D_2)}{mn} \) 。通过比较 \( P_{D_1 > D_2} \)、\( P_{D_1 < D_2}
    \) 及 \( P_{D_1 = D_2} \)，对犹豫相对距离集进行排序，进而得到最优方案。


    # 步骤 2.32：使用平均值的方法求解犹豫决策集。


    按照 \( d''_{spi} = \sum_{j=1}^n d_{spj} (l(d''_{spj}))^{-1} \) 计算各属性集的平均综合属性值，其中，\(
    l(c''_{tij}) \) 为该属性集的基数，从而得到决策矩阵


    ```

    \( d''_{4 \times 4} = \begin{bmatrix} d''_{t1} & d''_{sp1} & d''_{e1} & d''_{sa1}
    \\ d''_{t2} & d''_{sp2} & d''_{e2} & d''_{sa2} \\ \vdots & \vdots & \vdots & \vdots
    \\ d''_{tm} & d''_{spm} & d''_{em} & d''_{sam} \end{bmatrix} \)

    ```


    计算 \( d_i = \sum_{i=1}^4 (w_1 d''_{ti} + w_2 d''_{spi} + w_3 d''_{ei} + w_4 d''_{sai}),
    j=1, 2, 3, 4 \)，对综合属性值按从大到小的顺序进行排序，从而得到最优方案。


