- pgno: 57
  md: '3.3 节从整体上研究了互通危险品仓库的作业问题，并提出了仓储作业链的概念。具体地，本节在保证危险品仓库安全的前提下，统筹兼顾危险品出入库作业的效率、成本等因素，进而以两辆叉车同时进行出入库作业为样本，以遍历计算和新提出的安全度计算公式、调度方案评价模型为工具，从仓储作业链的角度，研究了互通包装危险品平仓仓库的叉车调度问题。


    3.4 节为本章小结。


    # 3.1 互通危险品平仓仓库的瀑布作业机制及实现方法


    # 3.1.1 研究问题的提出


    仓库是物流系统当中非常重要的一部分，仓库的运作效率直接决定物流系统总体效率。在整个仓库系统中，如何让叉车行车路径更加合理是亟须解决的问题，尤其对于危险品仓库来说。在调研中，我们发现在很多仓库里，作业人员还是在依靠经验去指挥仓库里叉车的运作，由此导致叉车相撞、堵车、“走冤枉路”的事情时常发生，进而影响到仓储的安全、效率和成本。另外，由于危险品仓库的特殊性，其应具备更加严苛的要求。基于此，本节利用优化算法为叉车规划行车路径，以减少危险品出入库作业中的不确定性。


    目前中国现有的危险品仓库多为双门仓库，尽管双门仓库在空间利用率方面具有突出的优点，但在运营效率上则存在短板。在危险品流量较大时，现有的双门仓库其空间结构所决定的作业模式难以高效地运转，导致当日或者规定时间内不能清库，最终引起货物在仓库积压。在实践基础上，人们提出了互通仓库的概念，互通仓库可以实现危险品的同时出入库，但由于缺乏算法的支撑，一直无法落地实现。由于叉车可以穿梭在所有房间里作业，互通仓库具有运营效率高的特点，然而由于道路对空间的挤占，其空间利用率方面会有不足。由于危险品仓储行业的封闭性，对于危险品仓库的改造，一直属于技术洼地。首先，考虑到危险品仓库对安全有极高的要求，企业对于危险品仓库的改造比较保守，担心新技术的不确定性会引起安全问题；其次，危险品仓库出于安全考虑，往往会对研究人员的研究和技术革新提出壁垒要求，且技术人员进入危险品仓库调研的成本往往很高。上述两个因素导致危险品仓库的改造一直属于难以发掘的领域。为了让互通仓库真正获得企业认可，必须在确保原有安全、效率和成本这三个重要的指标的基础上，对其中至少一个进行改进，即帕累托改进。我们提出的互通危险品仓库出入库作业瀑布机制及三阶段实现模型就是为了实现这种帕累托改进。具体来'
