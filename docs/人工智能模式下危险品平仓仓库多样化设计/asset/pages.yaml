    当两个集装箱同时进行出库与入库危险品作业，且出入库活动时效性较强时，本书安排两辆叉车进行装卸作业。为降低算法复杂性，本书所提出的六门仓库双叉车作业路径优化需做以下两点假设：首先，受危险品人工装卸因素的影响，本节仅建立入库节点与出库节点之间的匹配，为叉车的运行提供闭环路径集合；其次，六门仓库的布局和线路宽度虽然可以保证两个叉车在同向或相向运行阶段的正常行驶，但安全起见，本节规定在一个危险品仓库房间同一时间仅可以有一辆叉车作业。六门仓库由三个规制双门仓库组成，本书需要实现闭环路径总距离的趋同，以使得现场管理人员可以灵活调动两辆叉车。为降低上述分析对实际场景描述的不足，本书的做法是令入库点与出库点组成的任意点对的路径长度差异明显。假设
