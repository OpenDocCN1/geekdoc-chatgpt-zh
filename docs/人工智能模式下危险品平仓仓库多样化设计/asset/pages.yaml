    某危险品仓库存在的固定货源总量大于整个危险品仓库容量，则可对这一部分货物单独建立仓库，并进行分区。由于较多情况下危险品货物的周期性及货量并不能满足建立分区仓库的条件，此时若仍对仓库进行分区，则会造成很大的资源浪费，故针对货物灵活性较高的情况，本书通过设计叉车运行规则并进行仿真，发现当入库货位数量与出库货位数量较多时，在本书所研究的十门含有环岛的仓库中设置环岛单向行车规则的效用较高。当入库货位数或出库货位数较少时则应选择不设置环岛单向行车规则，以实现效用最大化。


    通过实例可以发现，无论是在仓库内，还是在城市道路系统中，设置单行规则往往可以增大行车速度。同时由于某些道路存在单行限制，也会引起一部分车辆的绕行，从而使这部分车辆行驶距离增加。仓库内行驶的叉车与城市交通中的各种车辆有着相似的性质，如车辆油耗在速度值达到某一阈值之前，会随着速度的增加而减少。因此，本书通过将叉车行驶的时间与油耗两者相结合，讨论了危险品仓库中设置环岛单向行车规则与不设置环岛单向行车规则两种方法中的哪一种更加有效。经研究发现，规则的设置与否，与仓库规模、仓库内入库货位与出库货位数量及仓库内的布设方式有着密切的联系，并得出了在一般情况下设置规则时入库与出库货位数量的变化范围，为环岛危险品仓库的高效运营提供理论支撑。'
