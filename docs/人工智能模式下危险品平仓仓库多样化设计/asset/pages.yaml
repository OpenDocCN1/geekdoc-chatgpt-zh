  md: '通过分析国内外关于危险品仓储政策、数据融合技术、危险品仓库风险管理、危险品仓库叉车路径优化、模糊多属性决策的现有研究成果，得到如下结论。


    +   （1）现有危险品物流的研究集中在危险品运输方面，对危险品仓库几何结构优化的关注很少。当前，我国危险品平仓仓库的发展水平已与社会需求有了相当的脱节，这种脱节使危险品仓库在全国范围内事故频发，给我国群众带来严重伤亡，导致国家遭受严重的经济损失。在一次次的事故面前，著者深刻认识到升级改造危险品平仓仓库的必要性和紧迫性，危险品仓库结构改革势在必行。


    +   （2）业界有了必须改造与设计新的危险品平仓仓库的意识，然而没有指出危险品平仓仓库发展的路线。另外，尤为重要的是，当业界新设计了危险品仓库的几何结构后，其设计的目的、结果和过程很难被数据化和算法化。在上述背景下推动危险品平仓仓库的结构多样化，是著者撰写本书的原动力。


    +   （3）随着时代的发展，客户的仓储需求被极度细分，然而在供给侧，危险品仓库能够提供的仓储服务相对单一，供给侧的发展速度难以匹配需求侧的发展速度。客户在大数据、云计算、人工智能面前已经有了全新的商业模式，其仓储需求早已超出了将危险品暂存于仓库的概念，遗憾的是，供给侧的仓储标准没有跟上时代的发展，仓储条件单一，缺乏对安全、效率与成本的辩证思考，难以满足客户的需要。综合来讲，仓储企业亟须对客户的仓储需求实现智能化的管理。


    # 1.2 国内外危险品仓库调研


    为了寻找我国危险品仓库屡屡发生事故的症结，为危险品仓库规划发展道路，2015~2021 年，著者对新加坡、上海、张家港等地危险品仓储企业进行了广泛的调研。汇总上述调研结果可以得到如下结论。


    +   （1）我国目前主要有平仓仓库、储罐仓库、立体仓库、货棚与货场四种危险品仓库类型，其中平仓仓库的占比最大，占总仓库面积的 51%。我国危险品仓库所存储危险品的类型主要有包装危险品、固体散装危险品、散装液体危险品三种类型，其中包装危险品是大多数危险品平仓仓库的主要仓储货物。


    +   （2）智能化是解决危险品仓储安全问题的唯一出路。智能化的本质是仓储企业的业务转型。在智能化转型过程中，对新技术的运用并不是目的，智能化转型目的是围绕客户需求重塑危险品仓储业务模式，并确保业务安全。


    +   （3）危险品仓储企业需坚持科学发展，以“对立与统一”的观点统筹兼顾“安全、效率与成本”三要素。以削弱对成本和效率的关注去追求“绝对安全”，会反噬“绝对安全”。仓储企业要用联系的观点看待“安全、效率与成本”，在“对立中谋求统一”，在“统一中谋求帕累托改进”。具体地，就我国现阶段的平仓'
