    # 2. 经典离散粒子群算法求解出入库模型


    利用经典粒子群的思想，本节给出求解模型（2.3）的离散粒子群算法，标记计算符号如下。记在经典 PSO 算法中，假定共有 \( P \) 个粒子对 \( Q
    \) 维解空间进行搜索。记 \( X_{i''} \) 为第 \( i'' \) 个粒子的位置；记 \( X_{i''j''} \) 为 \( i'' \)
    粒子对应位置向量的第 \( j'' \) 位置的数值；记 \( n \) 为位置向量中元素的个数；记 \( V_{i''} \) 为 \( i'' \) 粒子对应的速度向量；记
    \( v_{i''j''} \) 为 \( i'' \) 粒子对应速度向量 \( V_{i''} \) 中 \( j'' \) 位置的数值；每个粒子都可表示为
    \( x_i = (x_{i1}, x_{i2}, \cdots, x_{iP}), i=1, 2, \cdots, P \)，每个粒子对应的速度为 \(
    v_i = (v_{i1}, v_{i2}, \cdots, v_{iP}), i=1, 2, \cdots, P \)。粒子群算法在每一次迭代中，记 \(
    P_{best, i''} \) 为 \( i'' \) 粒子自身的最优位置向量；记 \( m'' \) 为群中粒子的个数；记 \( G_{best, i''}
    \) 为全局最优位置向量；记 \( P_{i''j''} \) 为 \( i'' \) 粒子对应最优位置向量 \( P_{best, i''} \) 中 \(
    j'' \) 位置的数值；粒子群算法在每一次迭代中，粒子的每一维变量如第 \( d \) 维变量通过跟踪 2 个极值所在的位置（\( P_{best, i''}
    \)，\( G_{best, i''} \)）进行更新。记 \( N'' \) 为问题的大小；\( t'' \) 为迭代次数；\( T''_{max} \)
    为最大迭代次数；\( w \) 为运动惯性权重，易知 \( w \in [0,1] \)；记 \( c''_1 \) 为自身（认知属性，与 \( P_{best}
    \) 相关）学习因子；记 \( c''_2 \) 为全局（社会属性，与 \( G_{best} \) 相关）学习因子；记 \( r'' \) 和 \( r''_2
    \) 分别为 \( [0,1] \) 之间的随机数；记 \( \Pi'''''' \) 为第 \( t'' \) 次迭代后的粒子群；记 \( \Pi''''_{i''
    t''} \) 为 \( \Pi'''''' \) 中的第 \( i'' \) 个粒子；记 \( F(x) \) 为适应度函数；记 \( \lambda''_{i''}
    \)、\( \varepsilon''_{i''} \)、\( \gamma''_{i''} \) 分别为 \( i'' \) 粒子对应速度向量中的惯性、认知、社会—全局三种成分；记
    \( X''_{i''(z'')} \)、\( X''_{i''(\varepsilon'')} \)、\( X''_{i''(\gamma'')} \)
    分别为只考虑惯性、认知、社会—全局三种速度成分带给 \( i'' \) 粒子的位置改变值。采用上述符号，本节利用遗传—粒子群算法求解出入库线路优化问题，具体步骤如下。


    步骤 2.1：将粒子用向量量表示。设 \( l^* = \begin{pmatrix} p_1 & p_2 & \cdots & p_m \\ q_{j_1}
    & q_{j_2} & \cdots & q_{j_m} \end{pmatrix} \) 为满足模型（2.3）约束条件的任意给定线路，其中，入库点 \(
    p_i (i \in M) \) 与出库点 \( q_{j_i} (j_i \in M) \) 对应，并记 \( l^* = (q_{j_1}, q_{j_2},
    \cdots, q_{j_m}) \)。


    步骤 2.2：初始化粒子群。记 \( \Pi'''''' = \left[ \Pi''''_1, \Pi''''_2, \cdots, \Pi''''_{m''}
    \right] \) 为 \( t'' \) 次迭代后的粒子'
