  md: '# 2. 危险品仓储作业的仓储链提炼


    在本书的前述研究中提出了危险品仓储作业的“闭环通路”概念。在本质上，“闭环通路”的概念从单次出入库活动的角度来处理叉车之间的配合问题。单次的出入库活动包括叉车起步、直线行驶、转向、制动、叉取作业及装卸作业等环节。由于在相同批次的仓储作业活动中，两辆作业叉车所需完成的直线行驶距离经常不相等，并且叉取作业和装卸作业的时间难以精确掌握，两辆叉车难以实现全程配合（图
    3.10）。在图 3.10 中，虽然在 $X_1$ 时间段内两辆叉车处于同一作业周期内，但是在 $X_2$ 时间段两辆叉车作业时间产生了不匹配，进而为定义叉车运行的安全度增加了困难。在调研的基础上，本节借鉴交通行为学中“出行链”的概念，提出危险品仓储活动中的仓储作业链概念，并从仓储链的角度研究危险品出入库作业，为研究危险品仓储活动提供了新的思路。具体地，危险品仓储作业链的定义如下：在一次仓储作业中，叉车需要在出入库集装箱和危险品仓库货位间进行多次闭环运输。在一次仓储任务中，一辆叉车的所有仓储作业闭环运输称为仓储作业链，记叉车的编号为
    $k$ ($k$ 等于 1 或 2)，记叉车 $k$ 在一次仓储作业中的作业链为 $l_k$，进而将其记为完成一次仓储任务，两辆叉车对应的仓储作业链对为 $(l_1,
    l_2)$。


    ![](img/82f0a1e9c99ca5f51f0110a293ae6965_78_0.png)


