    # 4.2.4 包装危险品环岛平仓仓库货位分区决策方法


    # 1. 叉车配速下的仓储作业安全度模型


    为了量化危险品仓库的安全概念，本书将安全度定义为函数，并且将该函数的自变量限定为同一时刻两叉车之间的距离、两叉车的重点监控作业时间、叉车作业时货物装卸次数。考虑到当两叉车相距较远时仓库内的叉车相撞概率很小，因此仓库内安全度仅考虑两叉车间距离小于安全红线距离时的安全情况，可得出安全度的关系式为
    $\xi = f(d_0, t, d, S)$。其中，$d_0$ 为我们设置的安全红线距离，$S$ 为叉车在仓库内运行路径的长度，$d$ 为重点监控作业状态下两叉车之间的最短路径距离。当
    $d$ 小于 $d_0$ 时，叉车从常规监控作业状态进入重点监控作业状态，$t_{min}$ 为两叉车在重点监控作业状态下的作业时间。


    在经过广泛的研究后得出安全度的具体计算方法如下。假定 $(t_i, t_{i+1})$ 时刻内两叉车距离小于设置的安全红线距离为 $d_0$，则取该时段下两叉车
    $F_1$ 和 $F_2$ 之间的最短路径距离为 $d_i$，并且对其进行积分，积分下限为进入重点监控作业状态的时间 $t_i$，积分上限为结束重点监控作业状态的时间
    $t_{i+1}$。通过对多段时间内的距离积分求和，并除以重点监控作业状态的总时间 $t$，可得到重点监控状态下两叉车间的平均距离，并将其作为仓库的安全度
    $\xi$。具体计算公式为


    $\xi = \frac{1}{t} \sum_{i=0}^{N} \int_{t_i}^{t_{i+1}} d_i d_t$ (4.5)


    其中，$d_i$ 表示在 $t_i$ 时刻两叉车之间的距离；$t$ 表示两叉车处于重点作业状态的时间，即 $d_i \leqslant d_0$ 的持续时间。


    定义仓库中的货位布局方案集为 $A = \{A_1, A_2, \cdots, A_{N_i}\}$，其中，$N_i$ 表示总布局个数，$A_i$ 表示任意的一种仓库布局。定义每一布局
    $A_i$ 下的叉车运行的线路集为 $L_i = \{L_{i1}, L_{i2}, \cdots, L_{iN_i}\}$，其中，$N_i$ 表示布局 $A_i$
    下的总线路个数。根据以往危险品事'
