- pgno: 122
  md: '依次提出了四门危险品平仓仓库、互通危险品平仓仓库及环岛危险品平仓仓库。截至目前，我们总计有四种危险品仓库可供使用，即常规双门仓库、四门危险品仓库、互通危险品仓库及环岛危险品仓库。通过前面各章的内容可以看出，当四门危险品仓库之间的隔离门关闭时，四门危险品仓库将变形为常规双门危险品仓库，当互通危险品仓库的部分隔离门关闭，各房间只按奇数顺序保留部分隔离门开放时，互通危险品仓库将变形为四门危险品仓库。当环岛危险品仓库的部分隔离门关闭，各房间只保留一个隔离门开放时，环岛危险品仓库将变形为互通危险品仓库。通过分析可以得出，四种危险品仓库不是完全分割、完全独立的，四者之间通过隔离门有内在联系。进而，我们可以将四种危险品仓库看作素材，通过合理使用隔离门构建出多种新结构的危险品仓库。通过对四种仓库的特点分析，我们将能更好地使用隔离门，进而为仓储客户提供更加个性化的服务。


    从危险品仓库作业效率的角度分析，环岛危险品仓库与互通危险品仓库相比，提供了更多的叉车运行通道，互通危险品仓库与四门危险品仓库相比，提供了更多的叉车运行通道，四门危险品仓库与常规双门危险品仓库相比，提供了更多的叉车运行通道。就一般情况下的危险品出入库而言，在叉车运行线路长度的比较中，环岛危险品仓库可以提供的最短叉车路径较互通危险品仓库短，互通危险品仓库可以提供的最短叉车路径较四门危险品仓库短，四门危险品仓库可以提供的最短叉车运行路径较常规双门仓库短。因此，当叉车出入库作业时，在叉车运行线路灵活度的比较中，环岛危险品最灵活，互通危险品仓库次之，四门危险品仓库再次之，常规双门仓库最差。这也就意味着环岛危险品仓库的出入库作业效率最高，互通危险品仓库次之，四门危险品仓库再次之，常规双门仓库最低。


    从危险品仓库运营成本的角度分析，由于隔离门的设置需要占用货位的空间，将原货位位置设置为通道，环岛危险品仓库的平均货位消耗场地面积最高，互通危险品仓库次之，四门危险品仓库再次之，常规双门仓库最低。另外，为了维系仓库的运营，环岛危险品仓库需要设置的隔离门最多，互通危险品仓库设置的隔离门较少，四门危险品仓库需要设置的隔离门更少，常规双门危险品仓库需要设置的隔离门数量最少。综合考虑土地成本及隔离门设置费用可以得出，对于每个房间的危险品仓库而言，环岛危险品仓库的运营成本最高，互通危险品仓库次之，四门危险品仓库再次之，常规双门危险品仓库的运营成本最低。


    从危险品仓库安全管理的角度分析，在叉车出入库作业时，常规双门危险品仓库的叉车运行线路单一，基本没有影响叉车运行的冲突点，四门危险品仓库有较少的冲突点，互通危险品仓库的冲突点较多，环岛危险品仓库的冲突点最多。因此在出入库作业压力不大的时候，常规双门仓库的冲突点最少，一般情况下不会发生叉车碰撞或擦碰。四门危险品仓库的冲突点较多，发生叉车碰撞或擦碰的概率增加，互通危险品仓库的冲突点比四门危险品仓库的更多，发生叉车碰撞或'
  merge: -1
  img_proc: true
- pgno: 123
  md: '擦碰的概率更高一些，环岛危险品仓库的冲突点最多，发生叉车碰撞或擦碰的概率最高。另外，在出入库作业压力增大的时候，当亟须提高出入库作业效率的时候，常规双门仓库中的叉车没有线路选择权，只能增加叉车运行速度及装卸、包扎步骤的速度，在追求速度的时候会出现作业意外或事故的概率。与之对比的是，四门危险品、互通危险品仓库及环岛危险品仓库中的叉车运行线路较多。在这三种新型危险品仓库中，可以通过优化叉车运行线路来提高作业效率，这就减低了装卸、危险品包扎等环节作业的时间压力，不降低出入库作业的安全水平。综合考虑冲突点及作业环境两方面的因素来看，为了完成相同的仓储作业任务，当出入库作业的时效性要求不高时，常规双门仓库的安全水平最高，四门危险品仓库次之，互通危险品仓库再次之，环岛危险品仓库最低；当出入库作业的时效性增强时，三种新型危险品仓库的效率优势开始显现。随着仓储作业的时效性增强，常规双门仓库的安全水平下降最快，四门危险品仓库次之，互通危险品仓库再次之，环岛危险品仓库的安全水平下降幅度最小。


    从危险品仓库的智能化建设角度分析，由于环岛危险品仓库设置了最多的隔离门，产生了最多的叉车运行通道，故其最适于智能化管理。通过智能化管理隔离门及叉车，可以针对每一单危险品仓储任务生成多种危险品仓储方案，进而利用智能算法来确定对该单任务最优的隔离门使用方案、货位使用方案及叉车运行线路。同时，互通危险品仓库中的隔离门数量和叉车运行线路比在环岛危险品仓库中少，四门危险品仓库的更少，常规双门仓库中最少。因此，环岛危险品仓库为危险品仓库的智能化建设提供了更多的物理基础，互通危险品仓库次之，四门危险品仓库再次之，常规双门危险品仓库提供的物理基础最少。综合上述分析可知，常规双门危险品仓库更适于在生产力水平较低，仓储作业时效性较弱的环境下使用；环岛危险品仓库更适于在生产力水平较高，仓储作业时效性较强的环境下使用，而四门危险品仓库和互通危险品仓库则兼有双门危险品仓库和环岛危险品仓库的部分优点及部分缺点。考虑到我国现在处于发展中国家的现实，以及我国仓储客户的多样化，仓储企业可以根据客户的特点选用合适的危险品仓库类型。


    为了量化上述分析结构，5.2 节将根据作业仿真计算各主要仓库的作业成本，5.3 节将分析对仓储企业的发展最重要的作业环境，即压仓环境下的货位设置决策方法。


