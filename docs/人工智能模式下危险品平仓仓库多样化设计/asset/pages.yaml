  md: '# 3. 结论分析


    通过上述算例可以看出，本节给出的出入库瀑布作业机制及三阶段算法是可行的。该三阶段模型将影响出入库作业的因素有机整合起来，并通过为入库点分组，匹配分别属于不同集卡的货位点，进而确定主集卡和辅集卡，实现了对危险品同时出入库作业的叉车线路规划。该规划的最大特点是人为因素较少，规划过程相对客观公正。另外，在求解模型（3.2）的时候，不同的仓库管理人员可以根据自身的软硬件情况选择合适的启发式算法。本节给出的粒子群算法只是说明了三阶段模型的可行性。


    通过实例，我们进一步验证了本小节的创新点。首先，本节将出入库作业时叉车的线路规划问题归结为三阶段模型，将影响出入库作业的因素有机整合起来，提炼出了出入库作业的规律。其次，为了使多集装箱卡车顺利实现同时出入库，本节提出主集装箱卡车和辅集装箱卡车的概念，深化对出入库作业的认识，保证出入库作业的高效率。最后，在三阶段模型中，本节将影响出入库作业的时间因素、效率、安全因素赋予权重向量。在不同的危险品出入库环境下，仓库管理人员可以根据自身情况调整上述权重。权重向量的存在保证了模型在不同环境下的适用性。另外，本节提出的模型也可以应用到单入库集卡和双出库集卡同时作业的实践环境，由于思路类似，本节不再做详细阐述。


