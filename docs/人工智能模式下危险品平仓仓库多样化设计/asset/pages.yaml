    1 小时，其产生的时间成本为 \( c_{st} = pt \)。此外，仓储管理人员需要根据危险品的价值对存储客户做出赔偿，记产生的经济成本为 \( c_{se}
    \)，令 \( \alpha_2 \) 为产品价值调节因子，那么 \( c_{se} = p_s \alpha_2 \)。经调研可得，由于作业失误每小时将产生
