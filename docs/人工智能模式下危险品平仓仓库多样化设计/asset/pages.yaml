  md: '借用上海某危险品仓库的调研数据，对新提出的叉车运行路线规划模型进行了实例验证。


    2.3 节在提出带隔离门互通危险品仓库的基础上，进一步研究互通危险品仓库的使用规律，将危险品仓库电动隔离门的使用问题提炼为经济成本、时间成本、效率、安全四个指标下的多指标决策问题。具体地，该节按照互通危险品仓库的使用原则，基于
