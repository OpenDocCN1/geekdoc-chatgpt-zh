    # 4.2.3 包装危险品环岛平仓仓库货位分区设置思路


    # 1. 环岛平仓仓库货位分区影响因素分析


    从环岛危险品仓库设置分区的利弊出发，本节提出了在出库货位数量和入库货位数量不断变化的情况下，根据仓库内实际情况来调整仓库的分区存储规则以达到最优状态的策略，并且以双叉车双集卡入库、单集卡出库的十门环岛危险品仓库为例，来论证危险品仓库分区的存储规则。本节选用以下变量作为分区的主要标准：仓库内入库货位数量和仓库内出库货位数量，并将进一步探究以上两个变量和仓库内是否设置分区规则的关系。通过深度的数据证明可以得到，危险品仓库的出库货位数量和入库货位数量为获取仓库内货物总量的最优变量，而仓库内货物总量为分区决策的决定性因素。可以通过以上两个变量得出仓库内货物周转率，并且根据货物存储周期长度找出最优的存放位置，来实现仓储成本的最小化，以及仓储安全指标的最大化。同时，货物存储时间、危险品周转量为衡量危险品仓库利润的重要标准，以此为自变量得出的成本-效用函数将成为衡量整个危险品仓库运行效率的重要评判标准。


    # 2. 环岛平仓仓库货位分区计算要素分析


    首先，我们介绍出入库作业的主要参数。在应用环岛模型及设置环岛运行规则的情况下，设置分区的决策函数为 y = f(N, m, n)，其中，N 为二值变量，令
    N = 1 表示设置分区，N = 0 表示不设置分区。入库货位数量为 m，出库货位数量为 n。其中，m，n 为整个分区决策模型的两个基本变量。记叉车为 F，记危险品'
