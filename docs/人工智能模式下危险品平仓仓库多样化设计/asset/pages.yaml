  md: '出入库作业三阶段模型。为了研究内容的一般性，该模型以三个集卡（两个人库集卡，一个出库集卡）、双叉车、八门仓库同时出入库为例。记同时入库作业的两辆集卡为
    $T_1$ 和 $T_2$，记出库集卡为 $T_3$，记为 $T_1$ 和 $T_3$ 服务的叉车为 $F_1$，记为 $T_2$ 和 $T_3$ 服务的叉车为
    $F_2$。记所有等待入库货位的集合为 $P_0 = \{p_1, p_2, \cdots, p_{M_0}\}$，记所有等待出库的货位的集合为 $Q_0
    = \{q_1, q_2, \cdots, q_{N_0}\}$。接下来，本节进一步解释该模型的假设条件，以及如何通过瀑布机制的三个阶段求出最优的货位匹配，最终达到为每辆叉车规划合理的行车路径的目标。提高出入库作业的自动化和智能化，减少人为安排可能造成的不合理性。


    # 2. 出入库作业实现模型


    本节以三个集卡（两个人库集卡，一个出库集卡）、双叉车、八门仓库同时出入库为例介绍危险品出入库三阶段模型。首先，将仓库分为入库区和出库区两大部分。每辆叉车分别服务一辆对应的入库集卡，且共同服务唯一的一辆出库集卡。最初，叉车将货物从入库集卡上取下来，并放在入库区的某个入库货位上。完成作业后，将其中需要放到出库区的部分运送至出库区的某个出库货位。其次，将其中需要放到出库集卡上的部分运送至出库集卡上。最后，回到入库集卡，此为一个闭环通路。每个叉车通过有限个闭环通路，将所有对应入库集卡上需要卸下的货物全部卸下，并放在入库区、出库区或出库集卡上，并回到起点。我们要研究的就是如何为每辆叉车选择一个最优的路径，即先到哪个入库货位再到哪个出库货位，以及不同叉车间闭环通路的搭配。为了解决这个问题，本节提出了分为三个阶段的瀑布机制。接下来，本节将给出实现三阶段瀑布机制的模型。


    阶段 1：为服务不同集卡的叉车分配出库或入库作业货位，将所有货位的集合分为两个子集。具体而言，本阶段需要为 $T_1$ 和 $T_2$ 分别确定入库货位，并由
    $F_1$ 和 $F_2$ 完成入库。记 $T_1$ 和 $T_2$ 需要入库危险品份数分别为 $M_1$ 和 $M_2$，且 $M_1 + M_2 \leqslant
    M_0$。记集卡 $T_1$ 和 $T_2$ 对应的人库货位集合分别为 $P_1 = \{p_{11}, p_{12}, \cdots, p_{1N_1}\}$
    和 $P_2 = \{p_{21}, p_{22}, \cdots, p_{2N_2}\}$。任取 $p_{1i} \in P_1, p_{2j} \in
    P_2$，其中，$i \in \{1, 2, \cdots, N_1\}, j \in \{1, 2, \cdots, N_2\}$。为降低当叉车 $T_1$
