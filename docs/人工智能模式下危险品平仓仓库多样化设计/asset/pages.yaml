- pgno: 129
  md: '利用上述数学符号，本节给出了一种不同类型危险品仓库运营成本的计算方法。首先，本节根据待评估方案中可拖拉门、仓位、叉车可行驶线路的布局方式，确定叉车运行平均最短距离的概率密度函数。其次，本节设计叉车运行规则，并根据叉车运行规则建立叉车平均最短运行距离的优化模型。再次，本节根据不同隔离门布设方式下叉车运行速度、仓库对位稀疏度确定叉车完成一次出入库所需耗时。最后，根据叉车时耗，确定叉车油耗成本，以及确定不同布设方式下仓库的机会成本。同时，本节确定综合评价目标函数值并求解得到不同类型危险品仓库的运营成本。为了验证新提出成本计算方法的有效性，本节构建叉车仓库内行驶路径的仿真模型，对结果进行验证。


    # 2. 不同的危险品仓储方案运营成本计算模型


    为计算在多种货位布设方案下，各方案所能带来的效益提升量，我们应先计算优化路径下的叉车平均运行距离，假设所有的货位均为可作业货位，可得


    ```

    \left\{ \begin{aligned} & \min \sum_{N=1}^{2} S^k_{p_i, q_j} = l_{C_N, p_i} +
    l_{p_i, q_j} + l_{q_j, C_j} + l_{C_N, C_j} \\ & \text{s.t. } i \in M, j \in N,
    k=1,2 \end{aligned} \right. (5.1)

    ```


    其中，目标函数为最小化叉车完成一次出入库作业的行驶距离，根据不同布设方案，可通过 \( l_{p_i, q_j} \)，进而可通过仓库货位的列数与排数进行表示，并计算出不同出入库货位组合下的最优路径。另外，在计算
    \( l_{p_i, q_j} \) 时，可将装货点与卸货点的位置通过坐标标示出来。例如，本节所研究的仓库均为 6 行 15 列仓库，因此，若第 1 行第
    1 列货位为入库货位，则记该货位为 \( p_{i=1} = p_{(1,1)} \)；若第 3 行第 4 列货位为入库货位，则计该货位为 \( p_{i=2}
    = p_{(3,4)} \)。以此类推，可将 \( p_i \) 和 \( q_j \) 中的所有货位均用坐标的形式表示。由于布设方法不同，每个单元的货位数也会有所不同。记
    \( N_p \) 为不同布设方式下仓库总的出入库货位数 \( p \in \{1, 2, \cdots, 6\} \)，其中，\( N_{p_p} \)
    为入库货位总数，\( N_{p_q} \) 为出库货位总数，记每种布设方式下各个单元货位数为 \( N_p^k \)，每个单元所包含的箱位坐标集合为 \(
    K_k, k \in \{1, 2, \cdots 5\} \)。例如，\( N_1^3 \) 表示在第一种布设方式下第三个单元的货位数。根据 5.2.2
    节中十门危险品仓库的使用原则可知，当仓库中入库货位数为 \( m \)，出库货位数为 \( n \) 时，有 \( m + n = N_p \)。记仓库中入库货位比例
    \( r_p = m \times N_p^{-1} \)，出库货位比例 \( r_q = n \times N_p \)。对任意时刻，当仓库内随机取 \(
    m \) 个入库货位，\( n \) 个出库货位时，分别距离入库集卡 \( C_1 \) 与 \( C_2 \) 最近的入库货位可以通过 \( p_{(x_1,
    y_1)} \) 和 \( p_{(x_2, y_2)} \) 表示，距离出库集卡 \( C_3 \) 最近的出库货位可以通过 \( q_{(x_3, y_3)}
    \) 表示。进而，设距离集卡 \( C_1 \) 最近入库货位的行数为 \( x_1 \)，列数为 \( y_1 \)，则叉车 \( F_1 \) 从入库仓门至最近入库货位所行驶路程的期望可表示为'
