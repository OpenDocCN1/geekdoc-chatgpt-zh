    其中，$R_1^i$、 $R_2^i$ 和 $R_3^i$ 分别为修正 w、 $c_1''$ 和 $c_2''$ 的随机数矩阵。同时，为保持 w 的随机性，构建确定的随机函数为
    w 赋值，$c_1''$ 和 $c_2''$ 任意给定，且 $c_1'', c_2'' \in [0,1]$。


    步骤 2.4: 粒子群位置的迭代。本节采用变异的思想，对某一具体粒子 $i''$，若其对应的速度矩阵中元素 $v_{i_{jj''}} \neq 0$，通过当次迭代位置矩阵求出入库点
    $i''''$ 对应的出库点，并记为 $j''''$，并将 $l_{i''}^*$ 第二行从第 $\min \{j'', j''''\}$ 列到第 $\max
    \{j'', j''''\}$ 对调，完成变异。在本步骤，粒子位置的变异与速度对粒子的作用被纳入同一步骤，共同完成。记 $i''+1$ 次迭代后粒子群的位置为
    $X_{i''}^{i''+1}$。$X_{i''}^{i''+1}$ 由 $X_{i''}^i$ 和 $V_{i''}''''$ 决定。


    步骤 2.5: 每次迭代后更新粒子群的个体最优路径、全局最优路径，以及粒子的位置向量和速度向量。


