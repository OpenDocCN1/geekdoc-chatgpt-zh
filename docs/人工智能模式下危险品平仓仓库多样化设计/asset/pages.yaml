    # 3. 考虑间接机会成本的互通危险品仓库常规作业模型


    记仓库声誉降低使得仓库存储量下降而产生的间接成本为 c_m = \alpha_3，该影响因子与客户的存储规模有关，客户存储量越多，影响因子越大，产生的间接成本就越高。构建考虑间接机会机会成本的互通危险品仓库常规作业模型为


    min z_2'''' = 76.897 + 0.004\alpha_1 + 0.001\alpha_2 + 0.005SQ\beta h


    从公式可以看出，随着包装材料、产品价值的增加，互通出入库模式产生的综合成本也不断增加。进一步分析可得，在更换包装成本、产品价值及客户存储量影响比较小的情况下，使用互通模式能降低成本。


    对上述分析进行汇总，我们得到了如下四个结论：


    第一，本书以低成本和高效率为目标，以互通仓库为样本，考虑三个影响因素，分别从直接机会成本和间接机会成本两个层次研究了压仓条件下的互通危险品仓库作业优选模型，提炼出包装材料成本、危险品价值和存储量影响三个关键'
