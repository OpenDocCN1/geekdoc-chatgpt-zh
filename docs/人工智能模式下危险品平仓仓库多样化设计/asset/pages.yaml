  md: '# 3. 考虑间接机会成本的互通危险品仓库常规作业模型


    当危险品的包装损坏后，仓库方面需要按照情况进行处理。一般分成两种情况：一是包装损坏程度并没有影响内部产品那仅仅更换一个新的包装就能解决；二是如果无法单独更换包装解决，则需要更换一个新的产品。这两种情况都会需要产品所属公司相应负责人员与仓库方面相配合来处置，增加了产品所属公司（甲方）的工作量，因此产品所属公司（甲方）容易对仓库产生不满情绪甚至对仓库的安全运营能力产生怀疑。一家公司对仓库的评论将会对同行业其他公司产生参考价值，如果负面评价较多则可能导致同行业其他公司在未来的合作中不再选择此家仓库来进行货品的储存，最终导致仓库订单量下降，收益减少，而参考价值的大小决定于做出评价的公司的话语权的大小。为了方便量化话语权的大小，本节将存储量作为一个判断指标。因为其不仅能够影响行业内其他公司，也能反映出此家公司对仓库现有订单量的影响。


    记仓库的声誉降低使得仓库存储量下降而产生的间接成本为 \( c_m = \alpha_3 \)，其中 \( \alpha_3 = sq\beta h \)。该影响因子与客户的存储规模有关，客户存储量越多，影响因子越大，产生的间接成本就越大。


    本节以仓库的可持续发展、长期高质量运行为目标，构建考虑间接机会成本的互通危险品仓库常规作业模型为


    min \( z_2'''' = e^{-1} \left[ v_1^{-1} L^* + v_2^{-1} \sum_{i=1}^{n''-1} l(c_j,
    c_{j+1}) \right] + BL^* + 1000c_{dt} + c_{de} + 1000c_{st} + c_{se} + sQ\beta
    h \quad (5.16)\)


