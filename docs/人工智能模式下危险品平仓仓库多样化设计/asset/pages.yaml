  md: '路程的期望可表示为


    \( E(l_{C_3, P(x_3, y_3)}) = \sum_{x_3} \sum_{y_3} \frac{(r_q)^{2\chi(y_3)+1}}{N_p^2}
    \times r_p \times l_{C_3, P(x_3, y_3)} \times p\left[ (x_3, y_3) \in K_2 \right]
    \\ + \sum_{x_3} \sum_{y_3} \frac{(r_q)^{6y_3-1}}{N_p^1 + N_p^3} \times r_p \times
    l_{C_3, P(x_3, y_3)} \times p\left[ (x_3, y_3) \in K_1, K_3 \right] \\ + \sum_{x_3}
    \sum_{y_3} \frac{(r_q)^{N_p^1 + N_p^2 + N_p^3 + 2\chi(y_3)+1}}{N_p^4} \times r_p
    \times l_{C_3, P(x_3, y_3)} \times p\left[ (x_3, y_3) \in K_4 \right] \\ + \sum_{x_3}
    \sum_{y_3} \frac{(r_q)^{N_p^1 + N_p^2 + N_p^3 + N_p^4 + 2\chi(y_3)+1}}{N_p^5}
    \times r_p \times l_{C_3, P(x_3, y_3)} \times p\left[ (x_3, y_3) \in K_5 \right]
    \)


    对于任意给定入库货位及出库货位的情况下，计算叉车 \( F_1, F_2 \) 在入库货位与出库货位之间行驶的距离均值的估算公式为


    \( l_{P(x,y), g(x,y)} = \begin{cases} 2 \times \left[ \frac{\max(y, y_3)}{2} \times
    l_c + \frac{\max(y, y_3)+1}{2} \times l_g \right] + 2l_{en} + w_a \} \times p
    \left( y \in \{y_1, y_2\}, \forall k, y, y_3 \in K_k \right) \\ + \left\{ 2 \times
    \left[ \frac{\max(y, y_3)}{2} \times l_c + \frac{\max(y, y_3)+1}{2} \times l_g
    \right] + 2l_{en} + n \times (2l_l + l_a) \right\} \times p \left( y \in \{y_1,
    y_2\} \right) \)


    其中，\( l_c \) 为仓库内单位货位宽度；\( l_l \) 为仓库内单位货位长度；\( l_g \) 为仓库内货位之间空隙宽度；\( l_a \)
    为仓库内纵向车道宽度；\( l_{en} \) 为集卡与仓门之间的距离；\( n \) 为入库货位与出库货位所在单元之差的绝对值。


    得出最优路径的期望值后，计算叉车运行时间为


    \( t_{n_s} = \Omega \times \frac{1}{2} \sum_{N=1}^{2} \frac{S_{P_i, q_j}^{C_{v_k}}}{v_{n_s}
    \times \chi_{n_s}} \)


