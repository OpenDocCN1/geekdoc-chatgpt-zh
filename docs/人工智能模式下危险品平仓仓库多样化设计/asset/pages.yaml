    $(1,2,\cdots,m)$，当随机转置 $m''$ 次后，可得到粒子群 $\Pi''^0$ 中 $m''$ 个粒子的初始位置。同理，利用随机数得到粒子的初始化速度。记
    $i''$ 粒子的初始化速度为 $V_{i''} = [v_{i_1''}, v_{i_2''}, \cdots, v_{i_m''}]$，与 $i_D$
    类似，存在一个矩阵与 $V_{i''}$ 中的任一元素拓扑等价，记该矩阵为 $V_{Di''} = (v_{i_{jj''}})_{m \times m}$，其中，$i''$
    为粒子，$i''$ 和 $j''$ 分别为元素 $v_{i_{jj''}}$ 所在的行和列，$v_{i_{jj''}} \in \{0,1\}$。在本步骤，本节实现了用矩阵表示粒子的位置和速度。需要说明的是，在表示粒子位置的矩阵中，每行元素之和及每列元素之和均为
    1，而表示粒子速度的矩阵则没有该要求。


