    # 6.3 危险品平仓仓库智能化软件建设阶段


    在危险品平仓仓库几何结构改革之后，第二阶段的主要任务为开发并推广危险品仓库管理信息系统，为企业的运营和多类型平仓仓库的使用提供决策支持，并通过该系统获取必要的数据，为仓储需求管理平台的搭建打下软件基础。在第二阶段运营中，仓储企业要根据历史仓储信息，制定一个“一揽子”的管理系统开发技术，培养管理信息系统管理员，联系重要的
    IT 企业伙伴，并让所有的部门参与管理信息系统的再建，进而形成合力，塑造仓储企业智能化管理的文化，更好地服务危险品仓储市场。与此同时，通过管理信息系统的开发，仓储企业要实现对仓库的分等级安全管控，实现危险品仓储作业的相对安全。接下来我们介绍我国危险品仓储管理信息系统开发的技术环境。


    # 6.3.1 管理信息系统开发的技术环境分析


    +   1. 技术发展现状


    我国的多数企业在大数据领域已有布局，这些布局不仅包括物理存储设备与处理能力的建设，也包括技术产品的研发与人才队伍的培养。在软硬件方面，国内骨干软硬件企业陆续推出自主研发的大数据基础平台产品，并且有一批信息服务企业面向特定领域研发数据分析工具，提供创新型数据服务。虽然如此，但是我国的大数据产业与发达国家相比仍然存在技术及应用上的差距，在新型计算平台、分布式计算架构、大数据处理与分析方面尤为突出，并最终造成我国的计算机企业对开源技术和软件生态系统影响力较弱。'
