    # 11.4.3 RFID 攻击的统计特征与危险元素定义


    生物免疫系统中的危险信号是基于抗原攻击的累计效果发出的，因此，免疫反应往往具有一定的滞后性。在 RFID 系统中，从单个攻击中很难提取出明显的特征，但是当同种攻击连续发生时，从统计特征分析则会发现其明显偏离正常的轨迹，从而发出危险信号，因此，基于攻击的统计特征提取危险信号是一条可行的途径。


    +   1. RFID 攻击的统计特征分析


    对于 EPC C1G2 而言，典型攻击仍然是利用无线信道的开放性展开的阅读器窃取和拒绝服务攻击，另外，EPC C1G2 采取了口令保护的安全措施，不可避免地会遭受口令猜测的攻击。


    +   1) 阅读器窃取


    任何未授权的阅读器向标签发送指令统称为阅读器窃取，这是窃取个人隐私和商业机密，甚至篡改标签信息的最直接的手段，EPC C1G2 没有采取任何措施防止这种攻击。这种攻击非常隐秘，因为未授权的阅读器不受
    RFID 系统管理，它不会在 RFID 系统上留下任何痕迹，其攻击的证据只能通过无线信道提取，如果通过无线信道收集的操作记录无法在 RFID 应用系统记录的操作日志中找到，则可能发生了阅读器窃取攻击，如果阅读器窃取持续发生，则两条渠道采集的操作记录的一致性会显著下降。


    +   2) 拒绝服务


    拒绝服务(DoS)攻击主要指攻击者通过干扰广播、阻塞信道或其他手段，产生异常的应用环境，使合法阅读器无法读取标签信息。对于 EPC C1G2 协议而言，因为它采用
    CRC-16 进行数据的准确性检验，一旦产生电磁干扰，电子标签或者阅读器发出的数据产生 CRC 校验失败的几率将会明显提高。如果标签对阅读器指'
  - '[PAGE 194]


    令检验失败，标签将不会产生应答，如果阅读器对标签反馈的数据检验失败，阅读器将不会进行下一步业务处理。因此，DoS 攻击会使 CRC 校验失败率显著上升，而标签应答率则显著下降。


    # 3) 口令猜测


    口令猜测是指阅读器，包括非法用户利用合法阅读器，尝试或者猜测标签的口令，破解标签口令后再进一步获取标签敏感信息，甚至篡改标签数据。EPC C1G2 协议规定，对于
    Access、Lock 和 Kill 等指令都设置了口令保护，攻击者一旦跨越口令防护，将可以对标签进行任何操作，因此，口令猜测是阅读器窃取和标签篡改的前兆。口令错误时，标签一般不应答，为了分析方便，口令类指令的标签不应答认为是口令错误，猜测口令必将导致口令错误率急剧上升。


    # 4) 其他


    攻击前的试探指令往往执行不成功，将会造成指令失败率显著上升；标签篡改可能导致一个区域的写指令比例显著上升；Kill、Lock、Access 等口令类指令的比例上升，可能也蕴含着恶意的未知攻击。


    # 2. RFID 抗原危险元素定义


    RFID 抗原危险信号定义为一个反映攻击特征的危险元素集合，根据典型攻击的统计特征分析，可提取出指令匹配率（Pm）、CRC 误码率（Pe）、标签应答率（Pr）、口令失败率（Pa）等反映
    RFID 入侵特征的统计特征元素，即危险元素。


    指令匹配率（Pm）：假设通过 RFID 系统管理的合法阅读器的操作日志被全部记录下来，称其为系统日志（sysLog），而获取操作日志的另一条途径是通过无线信道获取，通过这种方式获取的日志称为信道日志（chLog）。正常情况下，sysLog
    与 chLog 应该是一致的，即 chLog 的操作记录能在 sysLog 中找到对应的记录。在统计范围内，chLog 记录能在 sysLog 中找到对应记录的比例，称为指令匹配率（Pm）。当发生阅读器窃取攻击后，非法的阅读器操作将在
    chLog 中被截获，但无法在 sysLog 找到，将导致 Pm 低于正常水平，因此 Pm 能作为反映阅读器窃取攻击的危险元素。


    CRC 误码率（Pe）：统计范围内标签应答 CRC 校验失败次数与阅读器询问总次数的比率。当拒绝服务攻击发生时，Pe 将会高于正常水平，因此 Pe 能作为反映
    DoS 攻击的危险元素。


    标签应答率（Pr）：统计范围内标签应答次数与阅读器询问总次数的比率。一般而言，如果有标签在阅读器的识读范围之内，阅读器的一个盘存周期就会有标签应答，但如果无线信道严重干扰，则标签收到的阅读器信号也会因
    CRC 校验失败而不会作出应答。因此，拒绝服务发生时，Pr 会明显降低，Pr 也是反映 DoS 攻击的危险元素之一。'
