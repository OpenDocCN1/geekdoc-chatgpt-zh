    +   1. 多目标 0/1 背包问题


    本节以多目标 0/1 背包问题为例, 对 CMQEA 的有效性进行验证。


    多目标 0/1 背包问题是一个典型的组合优化问题, 属于 NP 完全问题, 可描述如下: 对一给定权值的集合 w_{i,j} (第 j 个物品在第 i 个背包的质量),
    利润集合 p_{i,j} (第 j 个物品在第 i 个背包的利润) 及 k 个背包的容量 c_i , 求一个二进制向量 x = (x_1, x_2, \cdots,
