    ## 3.6 移动 Ad Hoc 网络入侵检测应用仿真


    ### 3.6.1 针对 AODV 路由协议的网络攻击


    MANET 中的节点不但具有数据传输的功能，而且具有为网络中的其他节点充当路由的功能，一个节点到另一节点的路由依赖于参与路由的所有节点。针对 MANET 路由协议的网络攻击很常见。本章以
    MANET 的 AODV 协议(Ad Hoc on demand distance vector routing)为例，考虑针对 AODV 的黑洞攻击和 FFRR
    攻击这两种 DoS 攻击。


    黑洞攻击的特点是恶意节点向环境中周围所有的节点广播它有最短路径。在 AODV 中，恶意节点对选定的源节点和目的节点广播拥有假的最大序列号的 ROUTE_REQUEST。如果该恶意节点选定其他源节点发送
    ROUTE_REQUEST，最终它将攻陷全网，就像在网络上形成一个吸收(只进不出)数据的黑洞。


    在 FFRR 攻击中，恶意节点产生大量的无用 ROUTE_REQUEST 来占用带宽和消耗其他节点的资源。


    ### 3.6.2 特征选择及数据预处理


    在移动 Ad Hoc 网络入侵检测系统里，每个节点都有它相邻节点的特征，在 AODV 路由协议中，和流量相关的所有特征有 100 多个，本章选取表 3-3
    所示的与 DoS 攻击相关的 4 个特征进行分析，减少冗余数据和节省分析时间。对经过数据预处理模块处理的数据采用 10-fold cross validation
    方法分割训练数据和检测数据，取得多次检测的检测率平均值。


    ### 表 3-3 相邻节点流量特征


    | 参数 | 描述 |

    | :--- | :--- |

    | NBSent | 相邻节点发送的数据量 |

    | NBRecv | 相邻节点接收的数据量 |

    | NBReqSent | 相邻节点发送的 RREQ 包数量 |

    | NBRrepSent | 相邻节点发送的 RREP 包数量 |


    ### 3.6.3 仿真实验结果及分析


    实验中，AODV 协议及网络攻击的仿真平台是 ns-2 2.3.0，仿真时间为 600s。检测率是入侵检测性能的一个重要指标。图 3-2 为训练数据集数目
    n 最大为 100、噪声数据为 10% 时的 AMSCIA、KFF 算法及 RANDOM 算法的检测率 $\eta$ 的示意图。


    ![](img/cd91189832ca806b16310970569db51c_53_0.png)


    ### 图 3-2 噪声数据为 10% 的检测率的示意图

    1-AMSCIA; 2-KFF; 3-RANDOM


    从图 3-2 可以看出，AMSCIA 的检测率在训练数据集达到一定数目后稳定收敛，并且检测率高于 KFF 算法及 RANDOM 算法。同时，达到一定的检测率对训练样本的要求减少，意味着计算延迟的降低。可见，本章检测结果明显高于文献
    [116] 的检测率仿真结果。


    ## 3.7 本章小结


    折叠次数无限的混沌模型 $x=\sin(2/x)$ 所产生的混沌变量约束区间的遍历性比常用来产生混沌变量的有限折叠次数混沌模型（如 Logistic 模型）要好一些，也说明此模型的混沌特性更明显。AMSCIA
    综合了免疫进化算法全局搜索能力强与混沌优化算法局部搜索能力强的优势，通过不断调整优化变量的搜索空间，将搜索范围缩小到当前最优解附近，既保证了寻优的准确性，又保证了算法的快速性。AMSCIA
    的验证结果表明，本章所用的算法简单实用，对优化问题不要求连续性、可微性，且编程方便，是解决优化问题的一种有效方法。AMSCIA 在移动 Ad Hoc 网络的入侵检测中的仿真实验表明，与
    KFF 算法及 RANDOM 算法相比，AMSCIA 不仅大幅降低了学习代价，而且在训练样本集较小的情况下分类器检测效率更高，同时分类速度也得到了提高，特别适合移动自组网络高检测率、高抗噪能力和低计算延迟的要求。


    ## 第 4 章 量子免疫优化算法


    ### 4.1 引言


    量子力学是 20 世纪物理学最惊心动魄的发现之一，以量子力学基本原理为基础的量子信息学是物理学与信息学交叉融合产生的一门新兴学科，它的研究涉及物理、计算机、通信、数学等多个学科，它为信息科学在
    21 世纪的发展提供了新的原理和方法，并且带动了相关学科的发展。在量子计算机尚未实现的情况下，为了充分利用量子计算的高效并行性，本章将人工免疫系统与量子理论相结合，提出了量子编码，并与克隆算子相结合，针对优化计算问题，提出一种新的算法——量子免疫优化算法，简称为量子免疫算法（quantum
    immune algorithm，QIA），它基于量子计算的概念和理论（如量子比特和量子叠加态），使用量子比特编码抗原和抗体。这种概率表示可以使一个量子抗体同时表征多个状态的信息，带来丰富的种群，而且利用克隆算子可以使当前最优个体的信息能够很容易地扩大到下一代来引导变异，使得种群以大概率向着优良模式进化，加快收敛。另外，在人工免疫系统的克隆算子中，为了保持解的多样性而扩大空间搜索范围，采取对父代进行克隆复制的策略，其解空间变大是以计算时间增长为代价的，由于采用量子编码具有量子并行运算的特点，因此，本章将二者有机集成，从而为解决优化计算问题提供一种快速有效的计算方法。


    ### 4.2 量子免疫优化算法


    ### 4.2.1 量子比特


    在 QIA 中，最小的信息单元为一个量子位，称为量子比特。一个量子比特的状态可以取 0 或 1，其状态可以表示为


    \( |\Psi\rangle = a|0\rangle + \beta|1\rangle \) (4-1)


    式中，\(\alpha, \beta\) 为代表相应状态概率幅的 2 个复数。其中，\(\alpha\) 和 \(\beta\) 满足下列归一化条件：


    \( |\alpha|^2 + |\beta|^2 = 1 \) (4-2)


    \( |\alpha|^2 \)、\( |\beta|^2 \) 分别表示 Q-bit 处于状态 0 和状态 1 的概率。常用的量子旋转门为


    \( U(\Delta\theta_i) = \begin{bmatrix} \cos(\Delta\theta_i) & -\sin(\Delta\theta_i)
    \\ \sin(\Delta\theta_i) & \cos(\Delta\theta_i) \end{bmatrix} \) (4-3)


    ### 4.2.2 量子抗体


    免疫算法的常用编码方式有二进制、十进制和符号编码。在 QIA 中，采用了一种特殊的编码方式——量子比特编码，即用一对复数来表示一个量子比特，这也正是此算法的高效性所在。一个具有
    m 个量子比特的系统（即一个量子抗体）可以描述为


    | $a_1$ | $a_2$ | $\cdots$ | $a_m$ |

    |---|---|---|---|

    | $\beta_1$ | $\beta_2$ | $\cdots$ | $\beta_m$ |


    式中，如前所述，$a_i$ 和 $\beta_i$ 要满足归一化条件。这种表示方法可以表征任意的线性叠加态。使用量子比特抗体增加了算法的解的多样性。同时此算法也具有好的收敛性，随着
    $a, \beta$ 趋于 1 或 0，量子比特抗体收敛于一个状态，这时多样性消失，算法收敛。


    ### 4.2.3 算法框架


    QIA 是一种和免疫算法类似的概率算法，其具体步骤描述如下：


    - (1) 进化代数初始化 \( t = 0 \)；

    - (2) 初始化种群 \( Q(t) \)；

    - (3) 由 \( Q(t) \) 生成 \( P(t) \) 随机产生一个[0,1]内的数，若它大于 \(|a_i^t|^2\) 则取 1，否则取 0；

    - (4) 个体变异操作，生成新的 \( P(t) \)；

    - (5) 评价群体 \( P(t) \) 的适应度，执行选择操作；

    - (6) 终止条件判断：当满足终止条件时，输出当前最优个体，否则继续；

    - (7) 更新 \( Q(t) \)，\( t = t + 1 \)，转到 (3)。


    第 \( t \) 代的抗体种群为 \( Q(t) = \{q_1^t, q_2^t, \cdots, q_n^t\} \)，其中，\( n \) 为种群大小，\(
    t \) 为进化代数，\( q_j^t \) 为定义如下的抗体：


    \( q_j^t = \begin{bmatrix} a_1^t & a_2^t & \cdots & a_m^t \\ \beta_1^t & \beta_2^t
    & \cdots & \beta_m^t \end{bmatrix}, j = 1, 2, \cdots, m \)


    式中，\( m \) 为量子抗体的长度。QIA 与免疫算法的不同仅仅在于“\( Q(t) \) 生成 \( P(t) \)”和“更新 \( Q(t) \)”这两步。在“初始化种群
    \( Q(t) \)”中，若 \( Q(t) \) 中 \( a_i^t, \beta_i^t (i=1, 2, \cdots, m) \) 和所有的 \(
    q_j^t \) 都被初始化为 \( 1/\sqrt{2} \)，则意味着所有可能的线性叠加以相同的概率出现。其中，在第 \( t \) 代中，\( P(t)
    = \{x_1^t, x_2^t, \cdots, x_n^t\}\)，每个 \( x_j^t (j = 1, 2, \cdots, n) \) 是长度为
    m 的串 \( (x_1 x_2 \cdots x_m) \)，它是由量子比特幅度 \(|a_i^t|^2\) 或 \(|\beta_i^t|^2 (i =
    1, 2, \cdots, m)\) 得到的。例如，在二进制情况下的过程是，随机产生一个 [0,1] 内的数，若它大于 \(|a_i^t|^2\) 取 1，否则取
    0。在更新 \( Q(t) \) 这一步中，既可使用传统意义上的交叉、变异，也可根据量子的叠加特性和量子变迁的理论，运用一些合适的量子门变换来产生 Q(t)。需要指出的是，由于概率归一化条件的要求，量子门变换矩阵必须是可逆的真正矩阵，需要满足
    \(U^*U = UU^*\) (\(U^*\) 为 \(U\) 的共轭转置)。常用的量子变换矩阵有异或门、受控的异或门、旋转门和 Hadamard 门等。


    ### 4.2.4 量子免疫的机理和优点


    一个好的优化算法在处理利用积累信息和探索未知空间之间的矛盾时必须采用折中的策略，既利用积累信息搜索当前空间，又要兼顾对未知空间的搜索，既要加快算法的收敛速度，还要克服早熟现象。那么，对于这些矛盾，QIA
    采用了什么策略呢？


    首先,在搜索过程中，QIA 通过选择使有较高适应度的个体数目不断增加，并且采用观察的方法产生新的个体，不断探索未知空间，像 IM 那样，使搜索过程得到最大的积累收益。其次，QIA
    采用量子抗体的表示形式，由于采用了这种概率幅的表示，一个量子抗体上携带着多个状态的信息。采用随机观察的方法由量子抗体产生新的个体，能带来丰富的种群，进而保持群体的多样性，克服早熟。另外，QIA
    对量子抗体采用一种“智能”更新的策略来引导进化，从而加快算法的收敛。由于 QIA 中量子抗体是一种概率表示，交叉和变异是等效的，因此在算法中对量子抗体只采用变异操作。


    对量子抗体进行进化有什么优点呢？ 一是因为量子抗体是利用量子编码得到的，由于量子采用概率幅表示，一个量子抗体上携带着多个状态的信息，在对一个量子抗体执行观察之前，这个量子抗体处于多个确定状态的叠加状态。因此，通过量子的概率幅产生新个体，使得决策变量在某种意义上不再是固定的信息，而变成了一种携带着不同叠加态信息的信息，所以比单纯使用遗传操作能带来更丰富的种群。二是对于一些具体问题不便于对抗体进行交叉和变异操作，因为操作后会带来大量的无效抗体，其解决方法或者是设计特殊的进化算子，或者是在进化后对无效抗体进行修正，两种方案均增加了程序的额外开销。在这种情况下，对量子抗体进行进化操作不失为一种好的策略。


    ### 4.2.5 量子变异


    - 1. 变异策略一


    变异操作是 QIA 中产生新个体的一种方法，通常的变异操作是一种随机变动，个体的进化带有随机扰动因素，它没有利用进化中现有的有利信息，因此收敛速度很慢。下面给出一种简单的量子抗体变异的方法，它可以有效利用当代的信息，由当前最优解反推出一个量子抗体的概率分布，有点类似于概率遗传算法，但是操作过程却简单得多，具体过程为：由当前进化操作得到的最优个体推出一个指导量子抗体后，在它的周围随机散布量子抗体作为下一代量子种群，用公式描述为


    \( Q_{guide}(t) = a \times p_{currentbest}(t) + (1 - a) \times (1 - p_{currentbest}(t))
    \) (4-6)

    \( Q(t+1) = Q_{guide}(t) + b \times normal(0,1) \) (4-7)


    式中，\( p_{currentbest}(t) \) 为进化到第 \( t \) 代为止得到的最优个体；\( Q_{guide} \) 为指导量子抗体；\(
    a \) 为指导量子抗体的影响因子；\( b \) 为量子种群随机散布的方差。\( a \) 的值越小，量子种群受 \( Q_{guide} \) 的影响越大；当
    \( a=0 \) 时，\( Q_{guide}=P \)，观察 \( Q_{guide} \) 后将以概率 1 得到 \( P \)，当 \( a=1/2
    \) 时，\( Q_{guide} \) 对于观察不起任何作用。一般取 \( a \in [0.1, 0.5] \)，\( b \in [0.05, 0.15]
    \)。


    - 2. 变异策略二


    在量子理论中，各个状态间的转移是通过量子门变换矩阵实现的，我们发现用量子旋转门的旋转角度同样也可以表征量子抗体中的变异操作，进而方便地在变异中加入最优个体的信息，加快算法收敛。在
    \(0,1\) 编码的问题中，我们可以设计下面这种量子变异算子来加速进化求优，令


    \( U(\theta) = \begin{bmatrix} \cos(\theta) & -\sin(\theta) \\ \sin(\theta) &
    \cos(\theta) \end{bmatrix} \) (4-8)


    表示量子旋转门，旋转变异的角度 \(\theta\) 可由表 4-1 得到。


    ### 表 4-1 变异角 \(\theta\) (二值编码)


    | \(x_i\) | \(best_i\) | \(f(x) \geq f(best)\) | \(\Delta \theta_i\) | \(\alpha_i
    \beta_i > 0\) | \(\alpha_i \beta_i < 0\) | \(\alpha_i = 0\) | \(\beta_i = 0\)
    |

    |---|---|---|---|---|---|---|---|

    | 0 | 0 | 假 | 0 | 0 | 0 | 0 | 0 |

    | 0 | 0 | 真 | 0 | 0 | 0 | 0 | 0 |

    | 0 | 1 | 假 | 0 | 0 | 0 | 0 | 0 |

    | 0 | 1 | 真 | \(0.01\pi\) | -1 | +1 | \(\pm 1\) | 0 |

    | 1 | 0 | 假 | \(0.01\pi\) | -1 | +1 | \(\pm 1\) | 0 |

    | 1 | 0 | 真 | \(0.01\pi\) | +1 | -1 | 0 | \(\pm 1\) |

    | 1 | 1 | 假 | \(0.01\pi\) | +1 | -1 | 0 | \(\pm 1\) |

    | 1 | 1 | 真 | \(0.01\pi\) | +1 | -1 | 0 | \(\pm 1\) |


    其中，\(x_i\) 为当前抗体的第 \(i\) 位；\(best_i\) 为当前最优抗体的第 \(i\) 位；\(f(x)\) 为适应度函数；\(\Delta
    \theta_i\) 为旋转角度的大小，控制算法收敛的速度；\(s(\alpha_i, \beta_i)\) 为旋转角度的方向，保证算法的收敛[117~119]。


    ### 4.2.6 量子免疫优化算法的收敛性


    定理 4-1 设 \(P\) 为一 \(n\) 阶可归约矩阵：\( P = \begin{bmatrix} C & 0 \\ R & T \end{bmatrix}
    \)。其中，\(C\) 是 \(m \times m\) 的基本随机矩阵，且 \( R, T \neq 0 \)，则


    \( P^{\infty} = \lim_{k \to \infty} P^k = \lim_{k \to \infty} \left[ \begin{array}{cc}
    \sum_{i=0}^{k-1} T^i R C^{k-i} & C^k \\ 0 & T^k \end{array} \right] = \left[ \begin{array}{cc}
    C^{\infty} & 0 \\ R^{\infty} & 0 \end{array} \right] \) (4-9)


    是一个稳定随机矩阵，且 \( \Pi^{\infty} = \Pi^{(0)} P^{\infty} \) 与初始分布 \( \Pi^{(0)} \) 无关，并且有下列不等式成立：


    \( \Pi_i^{\infty} > 0, \quad 1 \leqslant i \leqslant m \\ \Pi_i^{\infty} = 0,
    \quad m \leqslant i \leqslant n \) (4-10)


    定理 4-2 QIA 是全局收敛的。


    为了研究 QIA 的全局收敛性，已经提出了很多分析模型，1990 年 Eiben 提出 IM 的一种抽象表示，将进化过程定义为马尔可夫链，利用转移概率矩阵相乘来进行状态的变换，从而分析得出
    IM 收敛到最优解的条件。本文以二进制问题为例讨论 QIA 的收敛性。假设抗体长度为 \( L \)，种群规模为 \( N \)，对于抗体的取值是离散的 0,1
    的 IM，种群所在的状态空间大小是 \( 2^{NL} \)；而对于 QIA，由于 \( Q \) 的取值是连续的，理论上种群所在的状态空间是无限的，但因实际运算中
    \( Q \) 的精度有限，设其维数为 \( \upsilon \)，则种群所在的状态空间大小为 \( \upsilon^{NL} \)。模型的状态转换过程可用如下的马尔可夫(Markov)链来描述：


    \( Q_k \xrightarrow{\text{观察}} P_k \xrightarrow{\text{变异}} P''_k \xrightarrow{\text{保留最优解，更新
    } Q_k} Q_{k+1} \) (4-11)


    模型的整个过程可表示为


    \( \pi^{(t+1)} = \pi^{(t)} \times C_t M_t S_t U \) (4-12)

    \( U = F(P^{(t)}) \) (4-13)

    \( P^{(t)} = q^{(t)} M_q \) (4-14)

    \( q^{(t+1)} = q^{(t)} \times C_2 M_2 S_2 \) (4-15)


    设中间种群的规模为 \( \hat{N} \)，则种群和中间种群所在的状态空间分别为 \( \{0,1\}^{NL}, \{0,1\}^{\hat{N}L}
    \)。模型的状态转移矩阵可用变异、选择矩阵 \( C, M, S \) 来表示，其中，\( C, M, S \) 分别为 \( 2^{NL} \times
    2^{NL} \, 2^{NL} \times 2^{NL} \, 2^{NL} \times 2^{NL} \) 阶随机矩阵，由变异算子的含义可知


    \( C = \left[ \begin{array}{cc} I_{2^L \times 2^L} & 0 \\ C_l & C_2 \end{array}
    \right] \) (4-16)

    \( S = \left[ \begin{array}{cc} I_{2^L \times 2^L} & 0 \\ S_1 & S_2 \end{array}
    \right] \) (4-17)


    式中，\( q^{(i)} \) 为 \( 1 \times \upsilon^{NL} \) 维的量子抗体的概率分布向量；\( P^{(i)}, \pi^{(i)}
    \) 均为 \( 1 \times 2^{(N+1)L} \) 维的普通抗体的概率分布向量；\( M_q \) 为由量子抗体生成普通抗体的 \( \upsilon^{NL}
    \times 2^{NL} \) 维的概率转移矩阵；\( C_2, M_2, S_2 \) 均为 \( \upsilon^{NL} \times \upsilon^{NL}
    \) 维随机矩阵；\( C_1, M_1, S_1, U \) 为 \( 2^{(N+1)L} \times 2^{(N+1)L} \) 阶的块对角矩阵。讨论解空间
    \( \{0,1\}^{(N+1)L} \) (为了讨论方便起见，令 \( \hat{N} = N \))，此时

