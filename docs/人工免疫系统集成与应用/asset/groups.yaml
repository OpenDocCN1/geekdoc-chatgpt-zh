    \ |\n\n由表 1-1 可以看出，将 AIS 同人工神经网络、模糊系统、进化算法等智能计算方法相结合，可以改进已有的算法和模型，或提出一些新的集成智能计算模型。AIS\
    \ 与其他方法的集成旨在充分利用 AIS 和其他与其相结合的方法的优点，从而更有效地解决工程实际问题。\n\n### 1.4.1 人工免疫系统与人工神经网络\n\
    \n免疫系统与神经系统之间的关系可追溯至早期的理论免疫学。1974 年 Jerne 提出了免疫网络理论，激励了一些学者去研究这两个系统的相似点。免疫网络模型作为一个新方法被用于发展和改良神经网络模型，神经网络模型也常常被用来完善人工免疫系统。\n\
    \n1991 年，Vertosick 和 Kelly 提出利用免疫系统来研究神经网络结构的计算范例。基于并行分布处理(PDP)理论，他们尝试把免疫网络理论映射到一个\
    \ PDP 免疫网络中。尽管作者表明免疫系统的学习行为是无监督的，但是该论文并没有明确给出学习算法[16]。\n\n基于免疫元动力学，即补充新细胞及分子和去除无益的细胞及分子的性能，1996\
    \ 年,Abbattista 等开发了一个离散联想网络。这种机制用于定义 Hamming 形状空间中的点群。群中最佳点可作为吸引因子来表示网络记忆集。在离散\
    \ Hopfield 网络中,该算法由学习(存储)阶段和回忆阶段构成[13]。\n\n1997 年,Dasgupta 首先研究了 AIS 与 ANN 模型。重点对它们的原理——生物神经与免疫系统进行比较分析。接着,de\
    \ Castro 和 von Zuben 将他们的研究成果——人工免疫网络模型 (AiNet) 与 ANN 进行比较,重点分析了自组织神经网络[18]。\n\
    \n2001 年,de Castro 和 von Zuben 提出了一种基于免疫系统的模拟退火算法。它被应用到以误差反向传播算法训练的多层前馈神经网络的初始化问题中。作者认为,初始网络权重的质量与网络输出质量之间的相互关系可比作初始抗体群质量与免疫响应质量之间的关系。作者基于欧几里得形状空间思想来产生抗体多样性。他们提出一个能够产生初始权重向量集的算法,并使向量保持多样化以减小前馈神经网络收敛于局部最优解的可能性。AiNet\
    \ 免疫网络模型被 de Castro 和 von Zuben 用于实现以无监督方法确定 RBF 神经网络中径向基核函数的位置及数量。该算法的主要目标是对无标记数值数据集进行筛选与聚类。作者使用欧几里得形状空间表达分子。一个抗体对应于一个\
    \ RBF 神经网络候选中心,一个抗原等价于一个输入模式[70]。\n\n2002 年,de Castro 等基于克隆选择及免疫系统的亲和力成熟原理提出了一个布尔成长竞争网络。该算法的主要特征是竞争学习、具有成长与改良状态的网络体系结构的自动生成及\
    \ Hamming 形状空间中连接强度的二进制表达。权重更新步骤是一个受引导的变异搜索过程,模拟了抗体群的亲和力成熟过程,使得权重(抗体)成为待识别抗原更易结合的补体[228]。\n\
    \n孟江等针对神经网络集成中个体独立训练的低效性,提出了一种神经网络集成的免疫学习算法(NEIL)。通过对集成单体神经网络的免疫优化,借助免疫算法的多峰值搜索和并行优化特性,将最终的收敛抗体群分别对应于神经网络集成的各个单体,实现集成的同时训练过程[85]。\n\
    \nNEIL 算法的流程如下所示。\n\nNEIL-Algorithm(Nets, T)\n\n式中,Nets 为 M 个神经网络 Net,(i=1,2,...,M)\
    \ 构成的集成系统; T 为集成系统的训练数据集。\n\n- (1) 参数初始化:epochs 为迭代最大次数,M 为免疫种群中的抗体数目,Pc 为交叉概率,Pm\
    \ 为变异概率。\n- (2) 抗体编码:将网络单体进行实数编码,并随机生成 pM 个抗体串 Ab,(j=1,2,...,pM) 组成初始抗群 A0。\n\
    - (3) for k=1;epochs。\n  - ① 亲和力计算：对第 k 代抗体群 A_k，分别计算 Ag 与 Ab_j 的亲和力 D_j，Ab_j\
    \ 与 Ab'_j 的亲和力 S'_jj。\n  - ② 抗群的浓度选择：基于浓度的抗体群选择模式，根据 pr_j = D_j/C_j，以轮盘赌方式进行选择。\n\
    \  - ③ 遗传操作：采用 2 点交叉方式与高斯变异，通过亲和力评价选择性能优良的个体，作为下一代抗群。\n  - ④ 终止判断：若连续几次迭代无法改善解群特性，则跳出循环体。\n\
    - (4) 训练结束：将性能最佳的前 M 个抗体解码为网络单体，组成神经网络集成，完成训练。\n\n抗体编码采用实数编码，典型的三层前馈网络 n-h-m 结构，网络节点依次编号为\
    \ 1, 2, ..., n(输入层)，n+1, ..., n+h(隐含层)，n+h+1, ..., n+h+m(输出层)；连接权 w_ij 表示由节点 i\
    \ 到节点 j 的输出权；阈值 b_j 为前一层对节点 j 的输出阈值，然后从节点 i 顺序串联权值与阈值，构成抗体串。仿真结果表明，NEIL 算法既保持了启发式优化方法的并行性，提高了神经网络集成的学习效率，又可保证单体网络之间相互独立，具有较大的差异度，进一步增强神经网络集成的泛化性能。\n\
    \n张全平等提出基于人工免疫网络的神经网络集成方法(AINEN)。在用 Bagging 生成神经网络集成之后，将人工免疫网络的原理应用到神经网络集成，组成了一个从微观上看是一个一个的神经网络，而从宏观上看是一个大的人工免疫网络的集成。通过在微观层次上提高神经网络集成的个体之间的异构度，在宏观层次上提高免疫网络的适应度，从而降低集成的泛化误差[86]。\n\
    \nAINEN 方法描述如下：\n\n- (1) 用 Bagging 方法生成初始的神经网络集成，作为初始种群 LAbs。\n- (2) 计算每个网络个体实际输出与期望输出的适应度\
    \ B，计算每 2 个网络个体之间的异构度 s_ij，组成异构度矩阵 S。\n- (3) 开始循环。\n  - ① 对集成中的神经网络个体进行克隆，每个网络个体的具体的克隆数量由克隆数\
    \ cn；控制；\n  - ② 对克隆出的神经网络进行实数编码；\n  - ③ 用变异算子对编码进行变异；\n  - ④ 将变异后的编码解码为新的神经网络；\n\
    \  - ⑤ 计算新网络个体的实际输出与期望输出的适应度 B；\n  - ⑥ 从新网络中选出所有适应度高于父群体中最差的适应度的个体加入到集成中；\n  -\
    \ ⑦ 计算每 2 个网络个体之间的异构度 s_ij，组成异构度矩阵 S；\n  - ⑧ 对于集成中的任何 2 个网络个体 i 和 j，如果它们的异构度 s_ij\
    \ 小于阈值，则将其中适应度较小的网络个体剔除出集成；\n  - ⑨ 计算整个集成的人工免疫网络适应度 Bo。\n- (4) 如果当前集成的适应度 Bo 没达到要求或者迭代次数没达到设定值，继续循环；否则，退出循环，方法结束，输出结果。\n\
    \nAINEN 与 GASEN 方法在标准数据集上进行的实验表明，AINEN 能取得更小的泛化误差。\n\n张正道等针对神经网络集成对个体差异性的要求，提出了集成网络间的结构差异度的概念。在此基础上设计了一种基于反向选择的免疫算法，该算法可以在减小集成网络各自训练误差的同时保持网络间的结构差异度，从而提高神经网络集成的泛化能力；同时证明了该算法对最优个体的收敛性。将该方法应用于受噪声污染的非线性时间序列故障预报，根据预测误差可以方便准确地检测系统的缓变故障和突变故障，实现对微小故障的快速故障预报，降低误检率。仿真结果证明了该方法的有效性[87]。\n\
    \n### 1.4.2 人工免疫系统与进化算法\n\n目前许多 AIS 模型都有一个特征就是适应性，其过程类似于进化算法。采用进化算法作为 AIS 模型的部分处理算法，或者将进化算法与\
    \ AIS 集成以改善个体性能。例如，人工免疫系统中小生境、物种及多样化群体（主要是那些应用到多模式函数优化中的）的形成，以及描述 AIS 模型与遗传算法（GA）或者与遗传规划（GP）方法的集成。\n\
    \n1994 年，一种二进制 AIS 模型被 Forrest 等用于研究人工免疫系统的模式识别和学习[84]。在 AIS 泛化能力及多样性维持的研究中用到了一种遗传算法。这种情况下，泛化是指识别许多抗原共享的公共模式。相比较而言，群体多样性相当于能够广泛覆盖亲和力分散的个体集。作者用一个简单的二进制\
    \ Hamming 形状空间来表达分子，并以 Hamming 距离作为亲和力的度量方法。\n\n1995 年，Hightower 等研究了抗体分子遗传编码的进化效果及进化算法在\
    \ AIS 细胞和分子初始集产生中的应用。他们使用了一个本书开头描述过的骨髓模型[88]。\n\n1998 年，Potter 等提出一种概念学习方法，其中用进化遗传算法构建其抗体能够识别相反实例的人工免疫系统，即能识别来自非我抗原的自我抗原。他们对\
    \ AIS 的多样性控制机制和泛化能力进行了探索[89]。\n\n1999 年，Hajela 等提出免疫系统实施模式识别和适应性过程的能力可以方便地用于改善结构优化问题中遗传算法的性能。他们的工作重点在于两个方面：利用免疫系统能力提高遗传算法的收敛性能，以及解决基于遗传算法的优化问题中的约束设计问题[90]。\n\
    \nHart 等研究利用遗传算法是否能够使 AIS 得到进化，并将它用于产生程序集，以共同覆盖尽可能多的可预知与不可预知的意外事件。他们的模型包括由基因库、免疫响应的亲和力成熟过程和克隆选择原理组成的进化过程[91,92]。\n\
    \nDasgupta 等提出一种免疫遗传学方法以识别化学分析谱[81]。在他们的方法中使用了标准的遗传算法以生成专家库，对识别谱的工作进行集中管理。\n\n\
    Nikolaev 等提出一种免疫遗传规划方法[93]。在这种免疫遗传规划(IGP)方法中，搜索过程由动态适应函数控制，它是基于免疫网络模型的一种类比。程序在鼓励匹配重要个体和保持多样性方面得到加强。适应函数由相互影响的两个动态模型构成：一个是用以匹配更多重要个体的繁殖模型；另一个是根据识别个体的程序数目来调整个体重重要性的模型。\n\
    \n于鹏等利用免疫进化算法（IEA）[94]，借助遗传和接种疫苗操作将基于打分和基于约束的两类 Bayesian 网结构学习方法有机地结合在一起，提出了一种新的\
    \ Bayesian 网结构学习方法。与基于遗传算法的 Bayesian 网结构学习方法 EGA（expectation & genetic algorithm）的对比实验表明，所提出的算法收敛速度更快、学习得到的网络精度更高[94]。\n\
    \n杨孔雨等基于免疫系统的动力学模型，根据一类抗体可结合多个抗原表位并逐步达到亲和度成熟的机理，实现了一种多模态免疫进化算法，该算法的主要算子包括正选择、记忆细胞产生、超变异和抗体相似性抑制。对不同的多峰值函数进行的仿真实验证明，该算法能够找到多模态问题的全部最优解或尽可能多的局部最优解。与同类算法的比较和计算复杂性分析表明，该算法不仅计算量小、具有更好的搜索性能，而且无需任何先验知识即可实现自适应搜索[95]。\n\
    \n### 1.4.3 人工免疫系统与模糊系统\n\n在免疫系统中，抗原与抗体的识别是近似识别，也就是说，即使抗原和抗体之间的绑定不完美也可以产生免疫响应。近似绑定可能已经满足问题的需要了。这些特征和交叉反应一样，强调模糊性，说明模糊逻辑可能适宜于模拟免疫机制及免疫系统的某些方面。因此，模糊系统与人工免疫系统可进行富有成效的交互。\n\
    \n1995 年，Krishnakumar 等提出一种使用免疫机理和其他软计算技术相结合的计算系统[96]。这种集成系统根据实际问题研究人工免疫系统与人工神经网络、模糊系统和进化算法的结合。这种方法常应用于控制问题。该例中，免疫系统的几种不同元素等同于几种不同水平的控制策略。例如，先天性免疫可比作一个强反馈控制器，而\
    \ B 细胞活化可比作一个能够修改控制器参数的处理过程。亲和力成熟免疫过程被强调其对控制的重要性，但该方法重点在于研究免疫系统和控制问题的相似点。\n\n\
    1986 年，Baldwin 提出，个体在生命期间获取或学到的特性，将成为没有拉马克遗传的个体后代的遗传结构中的一部分，认为持续学习已获取的有用特性将增加个体的存活概率，即使那些特性还没有通过遗传来传播。Hightower\
    \ 等用非线性(S 形)绑定函数确定两分子间的绑定强度值，认为从免疫学角度来看，非线性函数似乎更合理，且当使用进化算法设计二进制免疫系统时，Baldwin\
    \ 效果的必要条件就会出现。\n\nde Castro 等提出一个用于数据聚类的人工免疫网络模型[33]。在该文中，通过各个类的质心来表达类，允许为每个对应于确定类的免疫网络细胞赋予成员级别，从而产生一个模糊聚类方案。这个方案加深了这样一个理念：每个免疫细胞属于一个单一的类，并通过模糊隶属函数使每个细胞与每个类产生关联。\n\
    \n郑恩让等通过分析模糊控制器的缺陷，将免疫算法与模糊控制相结合，提出了一种免疫优化智能模糊控制器，给出了该控制器的基本结构、控制算法和仿真结果。仿真分析和实际应用证明，免疫优化模糊控制器的设计不需要对象精确的数学模型，且实现比较简单。免疫优化模糊智能控制器控制效果好，它具有响应速度快、超调小、鲁棒性强等优点[97]。\n\
    \n何宏等针对复杂生产工艺中非线性系统的模型参数估计问题，为避免优化算法过早收敛于错误的参数估计值，根据生物免疫机理和模糊逻辑原理提出了一种新颖的模糊自适应免疫算法，该算法采用混沌超变异操作增强算法搜索能力，并用免疫网络调节策略保持抗体群的多样性，同时采用模糊逻辑调节算法参数以提高算法的自适应能力[98]。\n\
    \n## 1.5 研究目的和意义\n\n人工免疫系统及其集成模型与应用作为人工免疫系统的重要研究分支，已受到国内外人工智能专家、学者的密切关注。免疫系统作为高度并行、鲁棒性强的自适应分布式学习系统，提取其有益于优化计算、数据聚类、异常检测领域的免疫机理，建立人工免疫系统及其集成模型处理工程问题是一项复杂且比较困难的任务，主要原因有：\n\
    - 免疫系统作为自我防御系统，其本身的动力学行为特性极为复杂，如何挖掘其动力学机制，建立既能充分反映免疫系统与外在环境发生作用的行为特性，又能有效地解决工程问题的模型较难\n\
    - 人工免疫系统的研究还处于起步阶段，缺乏数学形式的基础理论，以及如何利用数学工具建立模型的数学基础较难\n- 目前人们对生物免疫系统特性和机理的理解各不相同，而且缺乏针对某一模型或某个方面应用的深入和细致的研究\n\
    - 人工免疫系统的数学定义及模型与工程问题的衔接关系如何搭建\n- 针对具体的工程问题，如何将人工免疫系统同其他模型相结合，可供借鉴的理论结果较少\n\n\
    这些问题的呈现引导确立了本书的研究目的，即充分开发免疫系统，建立一系列人工免疫系统及其集成模型并进行理论和应\n"
  mdcn: "\n也提示如何杀死新病毒和类似的病毒。\n\n## 5. 时间序列数据的异常检测\n\nDasgupta 等用几个时间序列数据集（真实的和模拟的）做实验，研究了阴性选择算法的运行情况[48,81]，以检测数据序列中的异常。这个研究的目的在于创立一种有效的检测算法，用它来观察在系统或进程的稳定状态特征下的任何变化。在这些实验中，自我的概念被认为是受监控系统的正常行为模式。因此，在所观察到的数据中超出所允许变化的任何偏离量都被认为是行为模式中的一种异常。此方法依赖于有足够多的正常数据样本（它能获得数据模式的语义），以产生一系列不同的检测器，检测器不需要对异常（错误）模式有先验了解就能统计性地检测出变化。\n\
    \n他们把此算法用于钻矿操作中的“工具破损检测”[11]，用它检测由破损刀具产生的切削力模式瞬间的变化。这个切削力模式上的变化是因损坏的刀具而产生的。这就是说，新的数据模式受到监控，以检查目前的模式是否不同于已建立的正常的模式，它们之间的区别（如在实现空间上的匹配）会暗示在切削力动态学上的变化。\n\
    \n这个检测算法已成功地用于在钻矿过程中从模拟的切削力信号中检测出断齿的存在。结果表明，该方法可作为临界安全操作的自动监控工具。\n\n## 6. 故障诊断\n\
    \nIshida 等为故障诊断研究了免疫网络模型的相互识别特征[25]。在他们的研究中，故障耐受值是由研究组中互连单元的相互识别而获得的。这就是说，系统水平的识别可通过单元水平的识别而获得。\n\
    \n该模型有如下性质：\n- 有并行处理的能力\n- 能处理不完全的信息和数据\n- 是自组织的\n- 在故障的扩散中，不需有反馈回路。\n\nIshida\
    \ 等提出了这个相互识别模型的一个应用[82]，即将它用于化学工厂的生产过程用检测仪表系统。利用传感器之间的关系，传感器网络通过双向弧被构造，以便于把该模型用于故障诊断。实验结果很好并值得深入研究。\n\
    \nIshiguro 等把免疫网络模型应用于工厂系统的在线故障诊断[37]。为了应用免疫网络模型进行故障诊断，作出了如下猜想：\n- 传感器并没有安装在工厂系统的所有组件上，它们用二进制显示被安装组件的状态，即无故障的（正常的）或有故障的（异常的）\n\
    - 故障源的数目认为是 1（即没有考虑同时发生的和复杂的故障）\n- 故障状态无一例外地通过分支扩散\n- 没有反馈回路存在于故障扩散中。\n\n这一工作尝试创立完整的能用于实际工厂中的故障诊断方法。\n\
    \n## 7. 用于模式识别的 AIS\n\nHunt 等从机器学习的背景出发，研究了基于免疫网络原理[31]的人工免疫系统（AIS）[31,32,69]。AIS\
    \ 提供噪声耐量和在系统中无人监督的学习，此系统是自组织的，不需要反面例子，并且能清晰地描述出它已经学习了什么。这样一个系统结合了学习分类器系统的优点与神经网络的一些优势，如机械感应和基于事件的检索。\n\
    \nAIS 的操作包括一个根目标、一个细胞网络、一个教学数据集和一个测试数据集。在网络中的每个细胞有一个模式匹配成分，这个成分是模仿遗传机制产生的，在自然免疫系统中通过此机制来形成抗体。这使精细词汇表成为可能并且促进了模式匹配成分的多样性。系统显示了两种类型的响应：初次的和二次的。初次响应是学习阶段，这时\
    \ AIS 学习输入的教学数据中的模式，二次响应代表一个模式识别过程，在这个过程中，AIS 试图把新的数据归类为它曾见过的相关的数据。\n\n为了把 AIS\
    \ 用于一个特定的问题，首先用一个以一次性或递进的方式构造（这依赖于所讨论的问题）的样本教学集来进行训练。然后，学会的信息能在许多方面得到应用。他们已经展示了\
    \ AIS 应用于模式识别问题上的潜能。AIS 可以用于识别 DNA 序列中的促进剂。\n\nHunt 和 Cooke 的工作表明，在包含一个清晰的内容寻址存储器的自适应非线性网络中，AIS\
    \ 怎样呈现出一个强有力的学习示例。他们研究的目的是要为机器自学习应用创立一个基于免疫的工具。\n\n## 8. 其他应用\n\nBersini 和 Varela\
    \ 利用免疫系统的修复原理来加速并行和局部的爬山过程。Ishida 等研究了基于免疫的方法，如多数网络、代理系统（agent system）和自识别处理[82,83]。Gilbert\
    \ 等用免疫网络模型做实验，特别针对图像识别，创造了一个内容寻址的自联合存储器[31]。在这个应用中，系统的输入是 \\( 64 \\times 64 \\\
    ) 像素的黑白图片，像素类似于抗原。这个方法是很有趣的，但是他们的实现没能获得问题的一个稳定解答。McCoy 等把阴性选择算法应用于航空图像分割[49]。Hunt\
    \ 最近把基于基因搜索的免疫网络用于结构优化问题上[32]。\n\n## 1.4 人工免疫系统集成的研究进展\n\n综合各类文献，目前以 AIS 为基础的集成模型，主要集中在\
    \ AIS 与 ANN、模糊系统、遗传算法等模型的集成[17,19,24,25,34~38,42,43]。这些集成模型结合了各自方法的优点。例如，将 AIS\
    \ 与模糊系统相结合，可以改善模糊系统的功能，优化模糊神经网络的拓扑结构及参数等；同时也可以将 AIS 模糊化以改善 AIS 对模糊和不确定性问题的求解能力。AIS\
    \ 具有清晰表达所学习知识的特性，由此可以弥补 ANN 的解释能力的缺陷，提高知识的可理解性[84]。利用免疫系统抗体的多样性的遗传机制改进遗传算法的搜索能力等，将\
    \ AIS 同进化算法相结合，可以帮助进化算法定义染色体规模和优化参数等。目前 AIS 与人工神经网络、模糊系统、进化算法等智能计算方法相结合，所获得的集成效果如表\
    \ 1-1 所示[23]。\n\n### 表 1-1 AIS 同人工神经网络、模糊系统、进化算法的集成效果\n\n| 集成模型 | 集成效果 |\n|---|---|\n\
    | AIS 同人工神经网络模型集成 | (1) 可以产生新的人工神经网络模型、结构和学习算法<br>(2) 可以为人工神经网络提供记忆能力<br>(3) 可以为人工神经网络的初始化提供新的优化功能\
    \ |\n| AIS 同进化算法集成 | (1) 进化算法为 AIS 的初始指令系统提供新的定义<br>(2) 进化算法被 AIS 用于研究进化过程的基因编码<br>(3)\
    \ AIS 结合遗传算法可以提高遗传算法的收敛性<br>(4) 遗传算法可以利用 AIS 解决局部极小点<br>(5) AIS 被进化算法用于产生和维持染色体小生境、类型和多样性<br>(6)\
    \ 用于建立新的免疫遗传算法 |\n| AIS 同模糊系统集成 | (1) 在 AIS 中抗原与抗体采用模糊匹配<br>(2) AIS 能被模糊系统用于模型选择\
    \ |\n\n由表 1-1 可以看出，将 AIS 同人工神经网络、模糊系统、进化算法等智能计算方法相结合，可以改进已有的算法和模型，或提出一些新的集成智能计算模型。AIS\
    \ 与其他方法的集成旨在充分利用 AIS 和其他与其相结合的方法的优点，从而更有效地解决工程实际问题。\n\n### 1.4.1 人工免疫系统与人工神经网络\n\
    \n免疫系统与神经系统之间的关系可追溯至早期的理论免疫学。1974 年 Jerne 提出了免疫网络理论，激励了一些学者去研究这两个系统的相似点。免疫网络模型作为一个新方法被用于发展和改良神经网络模型，神经网络模型也常常被用来完善人工免疫系统。\n\
    \n1991 年，Vertosick 和 Kelly 提出利用免疫系统来研究神经网络结构的计算范例。基于并行分布处理(PDP)理论，他们尝试把免疫网络理论映射到一个\
    \ PDP 免疫网络中。尽管作者表明免疫系统的学习行为是无监督的，但是该论文并没有明确给出学习算法[16]。\n\n基于免疫元动力学，即补充新细胞及分子和去除无益的细胞及分子的性能，1996\
    \ 年,Abbattista 等开发了一个离散联想网络。这种机制用于定义 Hamming 形状空间中的点群。群中最佳点可作为吸引因子来表示网络记忆集。在离散\
    \ Hopfield 网络中,该算法由学习(存储)阶段和回忆阶段构成[13]。\n\n1997 年,Dasgupta 首先研究了 AIS 与 ANN 模型。重点对它们的原理——生物神经与免疫系统进行比较分析。接着,de\
    \ Castro 和 von Zuben 将他们的研究成果——人工免疫网络模型 (AiNet) 与 ANN 进行比较,重点分析了自组织神经网络[18]。\n\
    \n2001 年,de Castro 和 von Zuben 提出了一种基于免疫系统的模拟退火算法。它被应用到以误差反向传播算法训练的多层前馈神经网络的初始化问题中。作者认为,初始网络权重的质量与网络输出质量之间的相互关系可比作初始抗体群质量与免疫响应质量之间的关系。作者基于欧几里得形状空间思想来产生抗体多样性。他们提出一个能够产生初始权重向量集的算法,并使向量保持多样化以减小前馈神经网络收敛于局部最优解的可能性。AiNet\
    \ 免疫网络模型被 de Castro 和 von Zuben 用于实现以无监督方法确定 RBF 神经网络中径向基核函数的位置及数量。该算法的主要目标是对无标记数值数据集进行筛选与聚类。作者使用欧几里得形状空间表达分子。一个抗体对应于一个\
    \ RBF 神经网络候选中心,一个抗原等价于一个输入模式[70]。\n\n2002 年,de Castro 等基于克隆选择及免疫系统的亲和力成熟原理提出了一个布尔成长竞争网络。该算法的主要特征是竞争学习、具有成长与改良状态的网络体系结构的自动生成及\
    \ Hamming 形状空间中连接强度的二进制表达。权重更新步骤是一个受引导的变异搜索过程,模拟了抗体群的亲和力成熟过程,使得权重(抗体)成为待识别抗原更易结合的补体[228]。\n\
    \n孟江等针对神经网络集成中个体独立训练的低效性,提出了一种神经网络集成的免疫学习算法(NEIL)。通过对集成单体神经网络的免疫优化,借助免疫算法的多峰值搜索和并行优化特性,将最终的收敛抗体群分别对应于神经网络集成的各个单体,实现集成的同时训练过程[85]。\n\
    \nNEIL 算法的流程如下所示。\n\nNEIL-Algorithm(Nets, T)\n\n式中,Nets 为 M 个神经网络 Net,(i=1,2,...,M)\
    \ 构成的集成系统; T 为集成系统的训练数据集。\n\n- (1) 参数初始化:epochs 为迭代最大次数,M 为免疫种群中的抗体数目,Pc 为交叉概率,Pm\
    \ 为变异概率。\n- (2) 抗体编码:将网络单体进行实数编码,并随机生成 pM 个抗体串 Ab,(j=1,2,...,pM) 组成初始抗群 A0。\n\
    - (3) for k=1;epochs。\n  - ① 亲和力计算：对第 k 代抗体群 A_k，分别计算 Ag 与 Ab_j 的亲和力 D_j，Ab_j\
    \ 与 Ab'_j 的亲和力 S'_jj。\n  - ② 抗群的浓度选择：基于浓度的抗体群选择模式，根据 pr_j = D_j/C_j，以轮盘赌方式进行选择。\n\
    \  - ③ 遗传操作：采用 2 点交叉方式与高斯变异，通过亲和力评价选择性能优良的个体，作为下一代抗群。\n  - ④ 终止判断：若连续几次迭代无法改善解群特性，则跳出循环体。\n\
    - (4) 训练结束：将性能最佳的前 M 个抗体解码为网络单体，组成神经网络集成，完成训练。\n\n抗体编码采用实数编码，典型的三层前馈网络 n-h-m 结构，网络节点依次编号为\
    \ 1, 2, ..., n(输入层)，n+1, ..., n+h(隐含层)，n+h+1, ..., n+h+m(输出层)；连接权 w_ij 表示由节点 i\
    \ 到节点 j 的输出权；阈值 b_j 为前一层对节点 j 的输出阈值，然后从节点 i 顺序串联权值与阈值，构成抗体串。仿真结果表明，NEIL 算法既保持了启发式优化方法的并行性，提高了神经网络集成的学习效率，又可保证单体网络之间相互独立，具有较大的差异度，进一步增强神经网络集成的泛化性能。\n\
    \n张全平等提出基于人工免疫网络的神经网络集成方法(AINEN)。在用 Bagging 生成神经网络集成之后，将人工免疫网络的原理应用到神经网络集成，组成了一个从微观上看是一个一个的神经网络，而从宏观上看是一个大的人工免疫网络的集成。通过在微观层次上提高神经网络集成的个体之间的异构度，在宏观层次上提高免疫网络的适应度，从而降低集成的泛化误差[86]。\n\
    \nAINEN 方法描述如下：\n\n- (1) 用 Bagging 方法生成初始的神经网络集成，作为初始种群 LAbs。\n- (2) 计算每个网络个体实际输出与期望输出的适应度\
    \ B，计算每 2 个网络个体之间的异构度 s_ij，组成异构度矩阵 S。\n- (3) 开始循环。\n  - ① 对集成中的神经网络个体进行克隆，每个网络个体的具体的克隆数量由克隆数\
    \ cn；控制；\n  - ② 对克隆出的神经网络进行实数编码；\n  - ③ 用变异算子对编码进行变异；\n  - ④ 将变异后的编码解码为新的神经网络；\n\
    \  - ⑤ 计算新网络个体的实际输出与期望输出的适应度 B；\n  - ⑥ 从新网络中选出所有适应度高于父群体中最差的适应度的个体加入到集成中；\n  -\
    \ ⑦ 计算每 2 个网络个体之间的异构度 s_ij，组成异构度矩阵 S；\n  - ⑧ 对于集成中的任何 2 个网络个体 i 和 j，如果它们的异构度 s_ij\
    \ 小于阈值，则将其中适应度较小的网络个体剔除出集成；\n  - ⑨ 计算整个集成的人工免疫网络适应度 Bo。\n- (4) 如果当前集成的适应度 Bo 没达到要求或者迭代次数没达到设定值，继续循环；否则，退出循环，方法结束，输出结果。\n\
    \nAINEN 与 GASEN 方法在标准数据集上进行的实验表明，AINEN 能取得更小的泛化误差。\n\n张正道等针对神经网络集成对个体差异性的要求，提出了集成网络间的结构差异度的概念。在此基础上设计了一种基于反向选择的免疫算法，该算法可以在减小集成网络各自训练误差的同时保持网络间的结构差异度，从而提高神经网络集成的泛化能力；同时证明了该算法对最优个体的收敛性。将该方法应用于受噪声污染的非线性时间序列故障预报，根据预测误差可以方便准确地检测系统的缓变故障和突变故障，实现对微小故障的快速故障预报，降低误检率。仿真结果证明了该方法的有效性[87]。\n\
    \n### 1.4.2 人工免疫系统与进化算法\n\n目前许多 AIS 模型都有一个特征就是适应性，其过程类似于进化算法。采用进化算法作为 AIS 模型的部分处理算法，或者将进化算法与\
    \ AIS 集成以改善个体性能。例如，人工免疫系统中小生境、物种及多样化群体（主要是那些应用到多模式函数优化中的）的形成，以及描述 AIS 模型与遗传算法（GA）或者与遗传规划（GP）方法的集成。\n\
    \n1994 年，一种二进制 AIS 模型被 Forrest 等用于研究人工免疫系统的模式识别和学习[84]。在 AIS 泛化能力及多样性维持的研究中用到了一种遗传算法。这种情况下，泛化是指识别许多抗原共享的公共模式。相比较而言，群体多样性相当于能够广泛覆盖亲和力分散的个体集。作者用一个简单的二进制\
    \ Hamming 形状空间来表达分子，并以 Hamming 距离作为亲和力的度量方法。\n\n1995 年，Hightower 等研究了抗体分子遗传编码的进化效果及进化算法在\
    \ AIS 细胞和分子初始集产生中的应用。他们使用了一个本书开头描述过的骨髓模型[88]。\n\n1998 年，Potter 等提出一种概念学习方法，其中用进化遗传算法构建其抗体能够识别相反实例的人工免疫系统，即能识别来自非我抗原的自我抗原。他们对\
    \ AIS 的多样性控制机制和泛化能力进行了探索[89]。\n\n1999 年，Hajela 等提出免疫系统实施模式识别和适应性过程的能力可以方便地用于改善结构优化问题中遗传算法的性能。他们的工作重点在于两个方面：利用免疫系统能力提高遗传算法的收敛性能，以及解决基于遗传算法的优化问题中的约束设计问题[90]。\n\
    \nHart 等研究利用遗传算法是否能够使 AIS 得到进化，并将它用于产生程序集，以共同覆盖尽可能多的可预知与不可预知的意外事件。他们的模型包括由基因库、免疫响应的亲和力成熟过程和克隆选择原理组成的进化过程[91,92]。\n\
    \nDasgupta 等提出一种免疫遗传学方法以识别化学分析谱[81]。在他们的方法中使用了标准的遗传算法以生成专家库，对识别谱的工作进行集中管理。\n\n\
    Nikolaev 等提出一种免疫遗传规划方法[93]。在这种免疫遗传规划(IGP)方法中，搜索过程由动态适应函数控制，它是基于免疫网络模型的一种类比。程序在鼓励匹配重要个体和保持多样性方面得到加强。适应函数由相互影响的两个动态模型构成：一个是用以匹配更多重要个体的繁殖模型；另一个是根据识别个体的程序数目来调整个体重重要性的模型。\n\
    \n于鹏等利用免疫进化算法（IEA）[94]，借助遗传和接种疫苗操作将基于打分和基于约束的两类 Bayesian 网结构学习方法有机地结合在一起，提出了一种新的\
    \ Bayesian 网结构学习方法。与基于遗传算法的 Bayesian 网结构学习方法 EGA（expectation & genetic algorithm）的对比实验表明，所提出的算法收敛速度更快、学习得到的网络精度更高[94]。\n\
    \n杨孔雨等基于免疫系统的动力学模型，根据一类抗体可结合多个抗原表位并逐步达到亲和度成熟的机理，实现了一种多模态免疫进化算法，该算法的主要算子包括正选择、记忆细胞产生、超变异和抗体相似性抑制。对不同的多峰值函数进行的仿真实验证明，该算法能够找到多模态问题的全部最优解或尽可能多的局部最优解。与同类算法的比较和计算复杂性分析表明，该算法不仅计算量小、具有更好的搜索性能，而且无需任何先验知识即可实现自适应搜索[95]。\n\
    \n### 1.4.3 人工免疫系统与模糊系统\n\n在免疫系统中，抗原与抗体的识别是近似识别，也就是说，即使抗原和抗体之间的绑定不完美也可以产生免疫响应。近似绑定可能已经满足问题的需要了。这些特征和交叉反应一样，强调模糊性，说明模糊逻辑可能适宜于模拟免疫机制及免疫系统的某些方面。因此，模糊系统与人工免疫系统可进行富有成效的交互。\n\
    \n1995 年，Krishnakumar 等提出一种使用免疫机理和其他软计算技术相结合的计算系统[96]。这种集成系统根据实际问题研究人工免疫系统与人工神经网络、模糊系统和进化算法的结合。这种方法常应用于控制问题。该例中，免疫系统的几种不同元素等同于几种不同水平的控制策略。例如，先天性免疫可比作一个强反馈控制器，而\
    \ B 细胞活化可比作一个能够修改控制器参数的处理过程。亲和力成熟免疫过程被强调其对控制的重要性，但该方法重点在于研究免疫系统和控制问题的相似点。\n\n\
    1986 年，Baldwin 提出，个体在生命期间获取或学到的特性，将成为没有拉马克遗传的个体后代的遗传结构中的一部分，认为持续学习已获取的有用特性将增加个体的存活概率，即使那些特性还没有通过遗传来传播。Hightower\
    \ 等用非线性(S 形)绑定函数确定两分子间的绑定强度值，认为从免疫学角度来看，非线性函数似乎更合理，且当使用进化算法设计二进制免疫系统时，Baldwin\
    \ 效果的必要条件就会出现。\n\nde Castro 等提出一个用于数据聚类的人工免疫网络模型[33]。在该文中，通过各个类的质心来表达类，允许为每个对应于确定类的免疫网络细胞赋予成员级别，从而产生一个模糊聚类方案。这个方案加深了这样一个理念：每个免疫细胞属于一个单一的类，并通过模糊隶属函数使每个细胞与每个类产生关联。\n\
    \n郑恩让等通过分析模糊控制器的缺陷，将免疫算法与模糊控制相结合，提出了一种免疫优化智能模糊控制器，给出了该控制器的基本结构、控制算法和仿真结果。仿真分析和实际应用证明，免疫优化模糊控制器的设计不需要对象精确的数学模型，且实现比较简单。免疫优化模糊智能控制器控制效果好，它具有响应速度快、超调小、鲁棒性强等优点[97]。\n\
    \n何宏等针对复杂生产工艺中非线性系统的模型参数估计问题，为避免优化算法过早收敛于错误的参数估计值，根据生物免疫机理和模糊逻辑原理提出了一种新颖的模糊自适应免疫算法，该算法采用混沌超变异操作增强算法搜索能力，并用免疫网络调节策略保持抗体群的多样性，同时采用模糊逻辑调节算法参数以提高算法的自适应能力[98]。\n\
    \n## 1.5 研究目的和意义\n\n人工免疫系统及其集成模型与应用作为人工免疫系统的重要研究分支，已受到国内外人工智能专家、学者的密切关注。免疫系统作为高度并行、鲁棒性强的自适应分布式学习系统，提取其有益于优化计算、数据聚类、异常检测领域的免疫机理，建立人工免疫系统及其集成模型处理工程问题是一项复杂且比较困难的任务，主要原因有：\n\
    - 免疫系统作为自我防御系统，其本身的动力学行为特性极为复杂，如何挖掘其动力学机制，建立既能充分反映免疫系统与外在环境发生作用的行为特性，又能有效地解决工程问题的模型较难\n\
    - 人工免疫系统的研究还处于起步阶段，缺乏数学形式的基础理论，以及如何利用数学工具建立模型的数学基础较难\n- 目前人们对生物免疫系统特性和机理的理解各不相同，而且缺乏针对某一模型或某个方面应用的深入和细致的研究\n\
    - 人工免疫系统的数学定义及模型与工程问题的衔接关系如何搭建\n- 针对具体的工程问题，如何将人工免疫系统同其他模型相结合，可供借鉴的理论结果较少\n\n\
    这些问题的呈现引导确立了本书的研究目的，即充分开发免疫系统，建立一系列人工免疫系统及其集成模型并进行理论和应\n"
