    每一个状态均由 \(N+1\) 个串长为 \(L\) 的个体组成，第一个个体被称为超个体，只起标志、记录作用，不参与进化。状态空间 \(\{0, 1\}^{NL}\)
    中的状态依次为 \(X_1, \cdots, X_{2^{NL}}\)，\(\{0, 1\}^L\) 中的个体按适应度大小排列为 \(X_1, \cdots,
    X_{2^L}\)，则经过免疫算子的作用，空间 \(\{0, 1\}^{(N+1)L}\) 中的状态 \((x_i, X_m)\) 变为状态 \((x_j,
    X_n)\) 的概率由矩阵 \(P = C_1 M_1 S_1\) 确定，其中，\(C_1, M_1, S_1\) 分别为 \(2^L\) 块由 \(C,
    M, S\) 组成的块对角矩阵


    \(C_1 = \begin{bmatrix} C & & \\ & \ddots & \\ & & C \end{bmatrix}, \quad M_1
    = \begin{bmatrix} M & & \\ & \ddots & \\ & & M \end{bmatrix}, \quad S_1 = \begin{bmatrix}
    S & & \\ & \ddots & \\ & & S \end{bmatrix}\)


    由于经算法中的“最优保持”后，如果当代产生的最优抗体优于超个体，则用当前最优个体代替超个体，否则保持不变，因此本文引入 \(2^{(N+1)L} \times
    2^{(N+1)L}\) 阶随机矩阵 \(U\) 来表示这种升级运算，其中，矩阵 \(U\) 的每行仅有一个元素为 1，其余元素均为 0，它可表示为


    \(U = \begin{bmatrix} U_{11} & & \\ U_{21} & U_{22} & \\ \vdots & \vdots & \ddots
    \\ U_{2^l, 1} & U_{2^l, 2} & \cdots & U_{2^l, 2^l} \end{bmatrix}\)


    则算法的状态转移矩阵为


