    \(X_{\text{RIDS}} = \{X_1, X_2\}, \quad X_1 = \text{AppLog}, \quad X_2 = \text{FeatureLog}\)

    ```


    AppLog 是被检测的客体，为了表述方便，直接称 AppLog 为抗原，FeatureLog 记录仍称为危险信号。


    \(Y_{\text{RIDS}}\) 为系统输出，RFID 入侵检测实质上是一个模式分类问题，即将 RFID 抗原划分为自体/非自体(self/nonSelf)。如果有足够的先验知识，自体和非自体还可以进一步细分，如非自体类型细分为阅读器窃取、拒绝服务、口令猜测等。因此，\(Y_{\text{RIDS}}\)
