  mdcn: '

    土壤资源类型图与海拔高度、坡度、土壤质地、土壤 pH、土壤有机质含量和土地利用类型等评价指标的单要素图层分别进行叠加，不必对“边缘现象”和内部多边形碎块作后期处理，得到一系列过渡图层。利用
    ArcGIS 的属性数据统计分析功能，提取各评价单元的各种主要指标属性值。


    ## 10.4.5 质量等级评定


    土壤资源质量等级的评定可以是定性的评定或定量的评定。本章将各评价指标的属性数据通过基于 AiNet-GIS 的土壤资源质量评价模型中的数据交换系统输入到 AiNet
    模型，利用 AiNet 模型进行广东省土壤资源质量等级的评定。为了同 AiNet 模型的评价结果相比较，本章还采用了指数和评价及模糊综合评判法分别对广东省土壤资源进行质量等级评定。下面具体介绍
    AiNet 模型和指数和法对广东省土壤资源进行质量评价的具体过程。


    ### 1. 指数和法


    运用指数和法评定土壤资源质量等级的具体步骤如下：


    - (1) 将影响土壤资源质量的各个因子(即评价指标)按其影响强度进行统计分级，求得各个评价单元内各个评价指标的质量等级分值。

    - (2) 将各个评价指标的质量等级分值与其权重相乘，得到各个评价指标的指数。

    - (3) 计算各个评价单元内各参评指标的指数之和，即指数和。

    - (4) 确定土壤资源质量等级的指数范围。首先，将前面所得的指数和进行标准化运算，即化为 0～100 的数值。然后，以标准化指数和值作为 X 坐标，与之相对应的土壤资源类型图斑个数及其面积(合计值)作为
    Y 坐标作曲线图。最后，根据图中土壤资源类型图斑数与面积分配情况确定各个土壤资源质量等级的指数范围。

    - (5) 确定各个评价单元的质量等级并进行统计分析。


    ### 2. AiNet 模型


    运用 AiNet 模型评定土壤资源质量等级的具体步骤如下：


    在获得广东省土壤资源类型图中各评价指标的属性数据后，就可以将其输入到 AiNet 模型中。在 AiNet 模型中相关操作算子确定如下。


    #### 1) 评价指标值的归一化


    由于评价指标的类型与量纲各不相同，故必须对原始指标值作归一化处理。根据广东省土壤资源质量评价等级标准，确定各个指标的等级，并将指标分为四种类型：效益型、成本型、区间型和描述型。效益型指标值越大越好，成本型指标值越小越好，区间型指标以其值落在某一特定区间为最优，而描述型指某种特定形式对应某种优度。在此，海拔高度和坡度是成本型，有机质是效益型，pH
    是区间型，而土壤质地和利用类型为描述型。本章利用基于平均水平的效用函数方法将指标值初始化，并引入中间变量 $M_{ij}$。


    ##### (1) 对效益型指标


    $M_{ij} = \frac{X_{ij} - \overline{X}_{ij}}{|\overline{X}_{ij}|}$ (10-1)


    式中，$\overline{X}_{ij}$ 为指标各单元的平均值，即


    $\overline{X}_{ij} = (\sum_{i=1}^m X_{ij}) / m$ (10-2)


    ##### (2) 对成本型指标


    $M_{ij} = \frac{\overline{X}_{ij} - X_{ij}}{|\overline{X}_{ij}|}$ (10-3)


    ##### (3) 对区间型指标：当 $X_{ij} \leqslant A$ 时


    $M_{ij} = \frac{X_{ij} - A}{|A|}$ (10-4)


    当 $X_{ij} \geqslant B$ 时


    $M_{ij} = \frac{B - X_{ij}}{|B|}$ (10-5)


    当 $B \geqslant X_{ij} \geqslant A$ 时


    $M_{ij} = \frac{X_{ij} - A}{|B - A|}$ (10-6)


    式中，$A, B$ 分别是区间型指标的最优上、下界。将原始指标值 $X_{ij}$ 按下述公式转化为区间 $[-1, 1]$ 上的效用函数值 $Y_{ij}$：


    $Y_{ij} = \frac{1 - e^{-M_{ij}}}{1 + e^{-M_{ij}}}$ (10-7)


    显然，$Y_{ij} = f(M_{ij})$ 是一条 S 形曲线，$M_{ij}$ 反映了原始数据 $X_{ij}$ 偏离平均值 $\overline{X}_{ij}$
    的程度。当 $X_{ij} = \overline{X}_{ij}$ 时，$M_{ij} = 0$；当 $X_{ij} > \overline{X}_{ij}$
    时，$M_{ij} > 0$，且 $Y_{ij}$ 随 $M_{ij}$ 的增长非线性递增。


    #### 2) 初始种群的产生及其编码


    在 ArcGIS 的支持下对广东省土壤资源进行矢量叠置、图斑融合、属性数据处理等一系列的操作之后，将广东省土壤资源划分为 211 种一级土壤资源类型，即 211
    个土壤评价单元。在广东省土壤评价单元集合中随机选取 10 组对象，并根据广东省土壤资源质量的评价要求将其划分为 4 个等级，按此要求确定每组 4 个点，代表土壤资源质量评价的
    4 个中心。将每一组对象编码为一个 $4 \times 6$ 位的种群个体 $c$，随机选取的 10 组对象构成了初始种群 $C_0$。即对搜索空间进行 $4
    \times 6$ 位的编码，则 10 为初始群体的规模。


    #### 3) 适应度函数的确定


    当前群体中的每一个体 c，都对应着 4 个中心。按照广东省土壤资源质量评价的要求将集合分为 4 簇,对于第 i 簇 \( C_i \)，定义其簇内距离为


    \( S_i = \frac{1}{|C_i|} \sum_{z \in C_i} \|x - z_i\| \) (10-8)


    式中，\( z_i \) 为簇 \( C_i \) 的均值。定义簇 \( C_i \) 和簇 \( C_j \) 的簇间距离为 \( d_{ij} = \|z_i
    - z_j\|\)，并定义


    \( R_i = \max_{i \neq j} \left\{ \frac{S_i + S_j}{d_{ij}} \right\} \) (10-9)


    则广东省土壤资源质量评价的目标函数定义为


    \( DB = \frac{1}{K} \sum_{i=1}^K R_i \) (10-10)


    个体 c 的适应度定义为


    \( f(c) = \frac{1}{DB} \) (10-11)


    对广东省土壤资源质量评价单元的集合用 AiNet 模型进行了评价,实验重复进行了 100 次,每次评价的初始值独立随机产生。AiNet 模型通常在 180
    次迭代之内收敛到最佳适应度,在 200 次迭代以上收敛的概率小于 1‰。


    ## 10.4.6 评价结果分析


    应用 ArcGIS 的同质融合功能,将指数和评价、模糊综合评判法和 AiNet 模型对广东省土壤资源质量进行评价的评价结果中属于同一土壤资源质量等级的相邻评价单元合并,并计算出各个质量等级土壤资源的面积,见表
    10-4。


    # 表 10-4 广东省土壤资源质量评价结果


    | 质量等级 | AiNet 模型 - 面积统计 /km² | AiNet 模型 - 占全省土壤面积/% | 模糊综合评判法 - 面积统计 /km² | 模糊综合评判法
    - 占全省土壤面积/% | 指数和评价 - 面积统计 /km² | 指数和评价 - 占全省土壤面积/% |

