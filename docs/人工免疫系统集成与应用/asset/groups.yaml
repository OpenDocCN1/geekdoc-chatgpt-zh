    # 内容简介


    本书是作者对人工免疫系统研究成果的总结，着重介绍人工免疫系统与其他智能算法的集成改进，以及人工免疫系统在实际工程领域的应用，内容主要包括人工免疫系统的算法框架，免疫机理自身融合与集成，免疫机理与混沌算法、量子算法的集成，人工免疫系统在网络路由优化、土地分类评价、RFID
    人侵检测等工程领域的应用。


    本书可作为相关专业高年级本科生及研究生的教材和参考书，也可供高等院校计算机、信息技术、人工智能和自动化等领域从事人工免疫系统研究的相关专业技术人员参考。


