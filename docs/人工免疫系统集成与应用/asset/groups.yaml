    一个人工免疫网络[46]。该网络模型的目的是建立一个记忆集合，以识别和表现数据结构组织。


    # 2.5 人工免疫系统设计框架的提出


    通过对比不难发现，在知识存储和模型结构方面，AIS 模型与人工神经网络模型、遗传算法是十分相似的。AIS 兼具进化主义和结构主义两种计算智能方法的特点。神经网络、遗传算法和免疫系统在多样性细胞组成、模式识别、学习与记忆机制及阈值的概念等方面都颇为相似。无疑，神经网络模型、遗传算法的设计框架对
    AIS 的研究是有启发意义的[21]。因此，在分析 AIS 的设计框架之前，本章首先介绍人工神经网络(ANN)和进化算法的设计框架。ANN 主要包含两部分。一部分是一组神经元，它们之间通过权值互相连接；另一部分是一组自适应调整过程(函数)，这组函数的主要功能是通过改变神经元之间相互连接的权值进行知识的学习，即
    ANN 的学习和训练过程。因此，简单来看，ANN 的设计框架主要包含一组神经元、一套神经元相互之间的连接模式和学习算法。


    进化算法也由两部分构成：第一部分是一群表示遗传细胞的人工染色体；第二部分是一组控制染色体产生、选择、复制、交叉、变异的函数或过程。因此，进化算法的设计框架主要包含一组染色体和一组控制染色体产生、复制、变异和选择等的进化过程。


    因此，根据 ANN 和进化算法的设计框架，本章认为，一套仿生计算模型的基本框架至少应该包含以下两个部分：①组成该模型的基本元素及模型表示方法；②一套控制整个模型动态变化的自适应过程(函数)。


    同样，上面所述的基本元素也是 AIS 设计框架所包含的基本组件；同时通过上面对 AIS 的基本原理、表示模型、基本组件及其相关算法和模型的分析，我们认为 AIS
    设计框架应包含：


    +   (1) 表示免疫细胞和分子的抽象模型；


