    \ AIS 同进化算法相结合，可以帮助进化算法定义染色体规模和优化参数等。目前 AIS 与人工神经网络、模糊系统、进化算法等智能计算方法相结合，所获得的集成效果如表\
    \ 1-1 所示[23]。\n\n### 表 1-1 AIS 同人工神经网络、模糊系统、进化算法的集成效果\n\n| 集成模型 | 集成效果 |\n|---|---|\n\
