    \n本节以多目标 0/1 背包问题为例，对 CMQEA 的有效性进行验证。\n\n多目标 0/1 背包问题是一个典型的组合优化问题，属于 NP 完全问题，可描述如下：对一给定权值的集合\
    \ w_{i,j} (第 j 个物品在第 i 个背包的质量)，利润集合 p_{i,j} (第 j 个物品在第 i 个背包的利润) 及 k 个背包的容量 c_i，求一个二进制向量\
    \ x = (x_1, x_2, \\cdots, x_n) \\in (0,1)^n，使\n\n```\ns.t. Max(f(x)= (f_1(x),\
    \ f_2(x), \\cdots, f_n(x)))\n```\n\n```\n\\sum_{j=1}^n w_{i,j} \\cdot x_j \\leqslant\
    \ c_i, 1 \\leqslant i \\leqslant k\n```\n\n```\nf_i(x) = \\sum_{j=1}^n p_{i,j}\
    \ \\cdot x_j\n```\n\n对于背包问题，有一个基本的先验知识，就是人们在装包时总是先选择利润权值比大的物件装入；如果背包过载，则总是先选择利润权值比小的物件从背包中拿出来。这个特征是背包问题本身的一种属性，也是在解决问题时可以利用的一种特征信息和知识，因此在这里作为从问题中提取疫苗的一种途径。利用免疫的相关知识，本节中抗体指候选解，即\
    \ PF_{known}；抗原指问题的优化目标及其约束条件，即式(4-28)；抗体-抗原的亲和度指候选解所对应的目标函数值，即 PF_{known} 与 PF_{true}\
    \ 的差别，亲和度越大则两者差距越小。\n\n### 2. 性能指标和初始参数\n\n对于多目标优化问题，对于不同算法所得解集的比较通常要考虑收敛性和多样性两个方面：首先，最小化优化算法发现的非支配最优解与实际非支配最优解的距离；其次，最大化分散解从而可以让解集空间向量尽可能一致和光滑。因此，为了\n\
    \n评价多目标优化问题非支配解的性能需要以下两个独立的公式：收敛公式[128]（GD）和差异多样性公式（Δ）[122]。因为收敛公式和差异多样性公式依赖于目标值的刻度，所以需要先将未归一化目标函数值进行归一化处理。\n\
    \n出于比较的目的，对 NSGAII、QIEA、CMQEA 三种算法分别在 100、250 和 500 背包问题上进行仿真实验，采用文献[131]中的测试数据。\n\
    \nCMQEA 算法的相关参数如下：群体规模 N 为 100，G1 子群体个数为 10。与本实验进行比较的算法 NSGAII 的参数设置如下：群体规模为 100，采用\
    \ pair-wise tournament 选择，二进制编码的单点交叉和 bit-wise 交叉，交叉概率和变异概率分别为 0.9 和 1/l（l 决策空间维数）。两种算法的实验数据是在\
    \ 25000 和 50000 个评估后得到的。\n\n### 3. 实验结果\n\n由于是对启发式方法(随机搜索算法)进行对比实验，因此需要将多次实验结果进行对比。图\
