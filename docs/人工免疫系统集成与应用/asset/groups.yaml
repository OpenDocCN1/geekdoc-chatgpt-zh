    # 11.5.2 RFID 入侵识别的层次结构定义


    信息监视器的内部结构 \(\Omega_{\text{RIDS}}\) 主要参考生物免疫系统分层结构确定。生物免疫系统是一个由吞噬细胞、淋巴细胞和 T 辅助细胞构成的层次防御与协同结构，受生物免疫系统层次结构的启发，信息收集器的内部结构也建立相应的层次结构模型，抽象出三层
    RFID 入侵检测器，分别为规则检测器、适应性检测器和协同检测器。规则检测器模仿吞噬细胞的功能，也称为吞噬细胞(phagocyte)检测器，简称为 P 检测器；适应性检测器模仿淋巴细胞的功能，也称为淋巴细胞(lymphocyte)检测器，简称为
    L 检测器；协同检测器模仿 T 辅助细胞(T helper)的功能，也称为 T 辅助细胞检测器，为简称 H 检测器。


    # 1. 规则检测器(P 检测器)


    吞噬细胞的免疫能力通过遗传获取，遗传可视为先验知识的传承，P 检测器也基于先验知识建立，而信息收集器提呈的抗原决定基为 P 检测器的建立提供了丰富的信息基础。P
    检测器的定义如式(11-16)所示，即'
  - '[PAGE 199]


    ```

    DP = <Pattern, Type> (11-16)

    ```


    式中，Pattern 为组合的逻辑表达式，由抗原元素组成的条件表达，如抗原元素组成的逻辑表达式（Rg in(‘A’,’B’,’C’））∧（Rc = ‘Write’），表示对区域
    A、B、C 的写操作。


    Type 为 Pattern 对应的操作类型，检测规则为 IF Pattern·THEN Type，将 Xrids 与 Pattern 进行匹配，如果匹配了某个
    DP.pattern，其输出即为对应的 DP.Type，抗原 ag 与 P 检测器 dp 匹配用谓词 PMATCH(ag,dp)表示。基于规则的检测器是目前入侵检测中最常用且最易理解的检测器。


    # 2. 适应性检测器(L 检测器)


    L 检测器模仿淋巴细胞基于抗原决定基进行抗原识别的能力进行定义，针对 RFID 抗原(即 AppLog 记录)进行入侵识别。根据 Burnet 的克隆选择学说[224]，每一个淋巴细胞都有一种特定的抗原受体，即抗体，抗原进入体内后选择具有相应抗体的淋巴细胞系并与其表面的抗体发生特异性结合，导致该淋巴细胞活化、繁殖、分化，从而引发特异性免疫应答。


    免疫记忆是免疫系统的另一重要特点，当机体接触过某种抗原后再次接触相同抗原时，将引起比初次免疫更强的、高亲和力的抗体产生，这是由于在初次应答过程中形成了特异性抗原的记忆细胞，而记忆细胞最先参与免疫识别。


    根据免疫识别和免疫记忆的原理，定义 L 检测器如式(11-17)所示。


    ```

    DL = <Ab,Rc,Type,Time,Count> (11-17)

    ```


    式中，Ab 表示抗体，是二进制编码的模式字符串，编码位数同抗原编码位数；Rc 指匹配阈值，抗体与抗原的相似度超过匹配阈值时，即认为该抗体识别了该抗原；Type
    表示抗原类型，即淋巴细胞的特异性类型，是输出的检测结果；Time 表示最近一次抗体激活的时间；Count 表示抗体累计激活的次数。其中 Ab、Rc、Type
    为 L 检测器识别抗原的基本元素，Time 和 Count 为检测器亲和力成熟和免疫记忆的基本元素。


    根据阴性选择算法，抗原与抗体的匹配规则主要有 Hamming 距离匹配和连续相同位数匹配，一般情况下均采用连续相同位数匹配。为了便于表达，抗原 ag 和 L
    检测器 dl 匹配用谓词 LMATCH(ag,dl)表示，一个抗原与 L 检测器匹配后，还需要根据最近的危险信号与协同检测器匹配的结果进一步判断是否为有害抗原，只有有害抗原才引发免疫反应。


    L 检测器根据 RFID 系统的自体集，采用阴性选择算法产生。自体集是指合法的抗原集，RFID 系统的自体集随着业务的变更而动态变化，所以 L 检测器的动态更新是必要的，以保证检测的自适应能力。'
  - '[PAGE 200]


    # 3. 协同检测器（H 检测器）


    H 检测器针对信息收集器提呈的危险信号（即 FeatureLog 记录），确认是否有人侵发生并且已经对 RFID 系统性能造成了有害的影响，人侵检测一般通过对危险元素设置危险阈值来确认是否发生有害攻击。但是，由于危险元素的多样化及危险元素之间的相互关联，一般很难设置出科学的危险阈值，本章通过提取特征点的方式来定义
    H 检测器，并通过聚类分析自动提取特征点。


    根据危险元素的定义和检测的需要，定义 H 检测器如式(11-18)所示。


    DH = <FeaturePoint, Lc, Type> (11-18)


    式中，FeaturePoint 表示特征点，是实数编码的数据记录，可视为抗体的另一种表现形式；Lc 指匹配阈值；Type 表示抗原类型，即输出的检测结果。


    FeatureLog 与 FeaturePoint 的距离采用 Euler 距离表示，如两个点 fl 和 fp，其距离 l 用式(11-19)表示。


    \( l = \sqrt{\sum_{i=0}^{n} (fp_i - fl_i)^2} \) (11-19)


    式中，n 表示 fl 和 fp 中的数据维数；fp_i 和 fl_i 分别表示第 i 维数据。


    定义 11-5 H 检测器匹配。对于 FeatureLog 记录 fl 与 H 检测器 dh,dh 的 FeaturePoint 和匹配阈值分别为 fp 和
    lc，若 \( l = \sqrt{\sum_{i=0}^{n} (fp_i - fl_i)^2} < lc \)，则 fl 与 dh 匹配，用谓词 HMATCH(fl,dh)
    表示。


    如果 fl 被 dh 匹配，则认为 fl 的抗原类型为相应的 dh. Type，其中 dh. Type 有可能是自体类型（Type. flag=1），也有可能是非自体类型（Type.
    flag=0），当匹配非自体类型检测器时，确认 L 检测器的检测结果并发出协同信号，否则抑制 L 检测器的检测结果。但是，如果 fl 不被 H 检测器库中的任何
    H 检测器匹配，则认为 fl 是未知类型，用谓词 UNKONWN(fl) 表示，fl 为未知类型时，需要进一步的协同刺激才能确认其是否为危险信号，而进一步协同刺激则是人工确认，因此，未知类型的特征日志也是需要关注的。


    随着业务的变更，各类抗原类型的特征日志分布也将缓慢变化，所以 H 检测器的动态更新是必要的，否则系统的检测性能会逐步恶化。


    # 11.5.3 RFID 入侵识别方法


    P 检测器库、L 检测器库和 H 检测器库形成了一个层次防御结构，决定了人侵监视器 \( \Sigma_{RIDS} \) 的内部组成 \( \Omega_{RIDS}
    \)。本小节将提出 RFID 人侵识别方法，即人侵监视器的输入 1 输出函数 \( G_{RIDS} \)。'
