    个低层免疫操作中的每一个在经过一段时间后可以获得位于抗体群编码串上的一些特定位置的优良模式，并且通过高层免疫操作，N 个低层免疫操作可以获得包含不同种类的优良模式的新个体，从而既增强了群体多样性和搜索多个全局最优解的能力，又保证了模型在求解问题时的收敛速度和解的质量。该模型具有：①处理更大范围的种群个体，从而可以更好地进行全局寻优的能力；②可以在
    N 个不同的子种群中引入不同的选优方法，所以有更大的可能出现新个体，增强抗体的多样性，从而使分层免疫算法有更大的广泛性；③在分层免疫算法中，引入各种形式的免疫操作以避免模型出现停止收敛或收敛缓慢的问题，提高其收敛速度。


