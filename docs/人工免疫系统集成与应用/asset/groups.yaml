    # 7.5 本章 小结


    本章主要分析了 Forrest 的阴性选择算法（NSA）存在的不足，针对检测器生成效率低、漏检率高、存在“黑洞”、匹配阈值难以确定等问题，本章将免疫网络调节和克隆选择原理与阴性选择原理相结合，提出了免疫融合阴性选择算法（II-NSA），通过对未成熟检测器进行克隆选择使其远离自体，基于与自体相似度的逆向排序按比例使检测器成熟。对于成熟检测器，通过免疫抑制控制检测器之间的相似度，并通过克隆选择降低成熟检测器之间的相似度。仿真分析表明，II-NSA'
