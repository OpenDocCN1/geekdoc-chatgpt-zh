    ## 2.5 人工免疫系统设计框架的提出


    通过对比不难发现，在知识存储和模型结构方面，AIS 模型与人工神经网络模型、遗传算法是十分相似的。AIS 兼具进化主义和结构主义两种计算智能方法的特点。神经网络、遗传算法和免疫系统在多样性细胞组成、模式识别、学习与记忆机制及阈值的概念等方面都颇为相似。无疑，神经网络模型、遗传算法的设计框架对
    AIS 的研究是有启发意义的[21]。因此，在分析 AIS 的设计框架之前，本章首先介绍人工神经网络(ANN)和进化算法的设计框架。ANN 主要包含两部分。一部分是一组神经元，它们之间通过权值互相连接；另一部分是一组自适应调整过程(函数)，这组函数的主要功能是通过改变神经元之间相互连接的权值进行知识的学习，即
    ANN 的学习和训练过程。因此，简单来看，ANN 的设计框架主要包含一组神经元、一套神经元相互之间的连接模式和学习算法。


    进化算法也由两部分构成：第一部分是一群表示遗传细胞的人工染色体；第二部分是一组控制染色体产生、选择、复制、交叉、变异的函数或过程。因此，进化算法的设计框架主要包含一组染色体和一组控制染色体产生、复制、变异和选择等的进化过程。


    因此，根据 ANN 和进化算法的设计框架，本章认为，一套仿生计算模型的基本框架至少应该包含以下两个部分：①组成该模型的基本元素及模型表示方法；②一套控制整个模型动态变化的自适应过程(函数)。


    同样，上面所述的基本元素也是 AIS 设计框架所包含的基本组件；同时通过上面对 AIS 的基本原理、表示模型、基本组件及其相关算法和模型的分析，我们认为 AIS
    设计框架应包含：


    - (1) 表示免疫细胞和分子的抽象模型；

    - (2) 一组用于评估免疫细胞和分子之间相互作用的函数及抗体亲和力成熟方式；

    - (3) 一套控制 AIS 动态变化的算法，即控制组成免疫系统的细胞和分子在进化过程中的动态变化的循环过程。


    具体的 AIS 设计框架结构图如图 2-5 所示。表 2-1 是对 AIS 设计框架的基本构成及其主要特征、原理进行的简要归纳[23]。在研究 AIS 的设计框架之后，这个设计框架可以指导我们以后在利用
    AIS 解决实际问题时，如何设计出相应的 AIS 模型。


    图 2-5 AIS 的设计框架及其层次结构


    ![图 2-5 AIS 的设计框架及其层次结构](img/cd91189832ca806b16310970569db51c_44_0.png)


    第一步：设计或选择合适的形态空间；

    第二步：确定亲和力度量函数和初始抗体群体产生方式；

    第三步：设计抗体的进化方式和多样性保证机制；

    第四步：利用已描述的算法或创建新的算法控制 AIS 中抗体的变化行为。


    ### 表 2-1 AIS 设计框架的基本构成及其主要特征、原理


    | 构成 | 主要特征 | 基本原理 |

    | :--- | :--- | :--- |

    | 形态空间 | 表达抗体及其形状的属性字符串空间 | 对免疫细胞、分子的抽象模型表示 |

    | 抗体的产生 | 新抗体的产生及其编码 | 在形态空间产生新的抗体 |

    | 抗体进化 | 抗体的选择、克隆、变异，以改善抗体的亲和力 | 描述抗体自我调整的过程，即改变它们的属性字符串 |

    | 抗体的多样性 | 采用多种机制保证抗体在进化过程中维持多样性 | 描述采用怎样的机制来保证抗体的多样性 |

    | 克隆选择 | 类似进化算法中的自适应调整过程，根据亲和力大小进行选择、复制、变异 | 当暴露给抗原时，控制抗体与抗原的相互反应 |

    | 阴性选择 | 抗原、抗体比较(匹配)的循环过程 | 产生一组不识别自我抗原的监测器 |

    | 连续免疫模型 | 用一组微分方程控制抗原的识别及抗体的产生、进化 | 控制抗体与抗原及抗体之间的相互作用 |

    | 离散免疫模型 | 用一个循环过程控制抗原的识别及抗体的产生、进化 | 控制抗体与抗原及抗体之间的相互作用 |


    ## 2.6 本章小结


    本章首先对 AIS 的生物基础——生物免疫系统的构成和基本机理进行了探讨；然后对人工免疫系统的表示模型、基本组件及相关模型和算法进行了分析，提出了人工免疫系统的设计框架，为利用人工免疫系统解决实际问题提供了基础框架和理论支撑。


    ## 第 3 章 自适应变尺度混沌免疫优化算法


    ### 3.1 引言


    人工免疫算法[17,21,23,34,108]是在遗传算法的基础上发展起来的。免疫算法虽然较好地解决了遗传算法的退化现象，能迅速把问题的最优解限制在一个较小的空间范围里，但与遗传算法一样，它仍不能充分利用所求解问题的特征信息指导全局搜索，搜索是盲目的、随机的，在小区域仍不能克服不成熟收敛现象，在小空间搜索效率并不显著[17,23,34]。混沌变量看似杂乱的变化过程，其实却含有内在的规律性。利用混沌变量的随机性、遍历性和规律性可以进行优化搜索[109]，其基本思想是把混沌变量线性映射到优化变量的取值区间，然后利用混沌变量进行搜索。但是，该算法在大空间、多变量的优化搜索上，却存在着计算时间长、不能搜索到最优解的问题[110]。


    混沌免疫优化算法充分结合混沌搜索与免疫算法两种算法的优点，利用免疫算法的记忆特性和当代最优解指导混沌搜索。目前混沌免疫优化算法[54,111~113]采用有限区域内折叠次数有限的
    Logistic 模型产生混沌变量，其混沌特性不是十分明显。本章利用在有限区域内折叠次数无限的混沌模型来产生混沌变量，并采用自适应变尺度方法改变优化变量的搜索空间，不断提高搜索精度来解决求解最优值时收敛速度缓慢的难题，提出一种自适应变尺度混沌免疫优化算法（adaptive
    mutative scale chaos immune algorithm，AMSCIA）。


    ### 3.2 混沌模型的选择


    一维混沌自映射的表达式为


    ```

    x_{n+1} = f(x_n) (3-1)

    ```


    在其相空间内总会有线性或非线性折叠现象，否则不可能产生混沌。在某种意义上，用于刻画模型“混沌性”的 Lyapunov 指数也可以看做是模型平均折叠次数的一种表示。当模型的平均斜率的绝对值大于
    1 时，Lyapunov 指数为正。一般常用的 Logistic 模型、Tent 模型、Chebyshev 模型等的映射折叠次数都是有限的。


    考察由下式定义的一维自映射：


    \(\left\{\begin{array}{l}x_{n+1}=\sin\left(\frac{2}{x_{n}}\right), n=0,1,2, \cdots,
    N \\ -1 \leqslant x_{n} \leqslant 1, x_{n} \neq 0\end{array}\right. \quad (3-2)\)


    该映射由于折叠次数无限，在区间 \([-1,1]\) 内有无穷多个不动点和零点，因此

    若要由此映射产生混沌，必须注意以下两点：


    - (1) 迭代的初始值不能为 0；

    - (2) 初始值不能取无穷多个不动点中的任何一个，不动点为方程 \(x_{n+1}=\sin(2/x_{n})\) 的解。


    在实际工程的应用过程中，超越数 \(2/(k \pi)(k \text{ 属于整数}, k \neq 0)\) 不可能出现，而

    总是以有限精度的有理数来近似替换。因此，只要迭代初值不为 0，混沌就会发

    生，此时映射的定义域为 \([-1,1]\)，且 \(x \neq 0\)，并且不包括上述各超越点。一维自映

    射 \(x_{n+1}=\sin(2/x_{n})\) 在迭代 1000 次后的随机性、初值敏感性和遍历性如图 3-1 所

    示。其中，图 3-1(a) 的初值为 \(x_{0}=0.255\)，可以看到系统输出是毫无规律的；图 3-1

    (b) 的初值分别为 \(x_{0}=0.2551\)，\(y_{0}=0.2552\)，纵坐标为 \(x_{n}-y_{n}\)，可以看出，这两个系

    统输出完全不同；图 3-1(c) 的系统初值分别为 \(x_{0}=0.2551\)，\(y_{0}=0.1552\)，横坐标为

    \(x_{n}(x_{n+1}=\sin(2/x_{n}))\)，纵坐标为 \(y_{n}(y_{n+1}=\sin(2/y_{n}))\)，从图中可以观察到，当迭代

    一定次数时，系统输出将遍历整个解空间。


    ![图 3-1(a) 初值 \(x_{0}=0.255\)](img/cd91189832ca806b16310970569db51c_47_0.png)


    ![图 3-1(b) 初值 \(x_{0}=0.2551, y_{0}=0.2552\)](img/cd91189832ca806b16310970569db51c_48_0.png)


    ![图 3-1(c) 初值 \(x_{0}=0.2551, y_{0}=0.1552\)](img/cd91189832ca806b16310970569db51c_48_1.png)


    ### 图 3-1 一维自映射 \(x_{n+1}=\sin(2/x_n)\) 的随机性、初值敏感性和遍历性与迭代次数的关系


    Lyapunov 指数是衡量混沌性的一个重要指标，混沌自映射式(3-2)的 Lyapunov 指数表达式为


    ```

    \(LE = \lim_{n \to \infty} \frac{1}{n} \sum_{i=0}^{n-1} \ln \left| f''(x_i) \right|
    = \lim_{n \to \infty} \frac{1}{n} \sum_{i=0}^{n-1} \ln \left| \frac{2}{x_i^2}
    \cos \frac{2}{x_i} \right| \quad (3-3)\)

    ```


    从式(3-3)所示的 Lyapunov 指数表达式可以看出，与常用的有限折叠次数映射相比，显然式(3-2)的混沌性更明显。


    通过比较基于不同混沌模型的混沌搜索，可以证明式(3-2)表示的模型具有更明显的混沌特性，并对下式进行计算：


    ```

    \begin{cases} \min f(x) = \min(4 - x^2)^2 \\ -8 < x < 8 \end{cases}

    ```


    式中，\(f(x)\)在极值点 \(x = \pm 2\) 所取极小值为 0。


    利用式(3-2)的模型和 Logistic 模型，对混沌变量进行遍历整个区间的混沌优化(只进行一次搜索)，得到的结果见表 3-1。从表 3-1 中可以看出，式(3-2)的模型的混沌优化结果更好，也说明此模型与常用的有限折叠次数模型相比，混沌特性更明显。


