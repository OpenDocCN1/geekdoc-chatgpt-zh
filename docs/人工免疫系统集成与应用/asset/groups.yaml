    \ 入侵检测系统参照生物免疫系统进行角色划分，可建立如下的角色映射：\n\n- 骨髓、胸腺——检测器中心。\n- 单核巨噬细胞——信息收集器。\n- 淋巴细胞——入侵监视器。\n\
    - 角色承担的目标也作相应映射：\n- 检测器中心——检测器产生。\n- 信息收集器——抗原提呈。\n- 入侵监视器——抗原识别，免疫反应。\n\n根据以上映射建立的\
