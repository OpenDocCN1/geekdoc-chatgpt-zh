    NSA 的评价中也指出 NSA 因检测器生成效率问题对 $N_S$ 较大的入侵检测并不适用[140]，II-NSA 则克服了检测器生成效率低的缺点，适用性更好。


    对于 II-NSA,检测器数 $N_R$ 是自适应的,达到了预定的期望漏检率 $P_t$ 时,即输出检测器库,不需要估算匹配阈值 $r$,对于 NSA,Forrest
    在文献[44]中提出了用 $P_M \approx 1/N_S$ 来估算 $N_R$,但实际上,这种方式仍然难以估算出匹配阈值 $r$,即使通过试算得到 $r$,测试结果发现
