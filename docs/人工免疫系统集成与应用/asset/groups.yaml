  md: "\n## 第 7 章 免疫融合阴性选择算法\n\n### 7.1 引言\n\n阴性选择原理是生物免疫系统识别自体和非自体的基础理论，对入侵检测系统识别正常行为和异常行为有着重要的借鉴意义。Forrest\
    \ 等提出的阴性选择算法（negative selection algorithm, NSA）[44]模拟生物免疫系统的 T 细胞的免疫耐受来产生检测器，因其方法简单，检测性能可调节，适用于分布检测等优点而被广泛接受。然而，NSA\
    \ 也具有检测器生成效率低，匹配阈值难以确定，实际的检测性能与期望检测性能有较大差距等缺点。本章将针对 NSA 的上述问题进行改进，将阴性选择原理与克隆选择和免疫网络调节相结合，提出免疫融合阴性选择算法（immune\
    \ integrated negative selection algorithm, II-NSA），II-NSA 在生成检测器时，经历克隆选择使远离自体的检测器快速成熟，同时经历免疫网络调节优化检测器的分布。\n\
    \n### 7.2 阴性选择算法\n\n#### 7.2.1 阴性选择算法概述\n\nForrest 等提出的阴性选择算法模仿了 T 细胞产生时的免疫耐受和非自体识别过程[44]，包括检测器生成（审查）和保护对象监视（监视）两个步骤。\n\
    \nNSA 算法中的检测器生成过程中，首先将合法数据定义为自体集 S；然后随机产生字符串，如果该字符串与自体集 S 中的任一字符串匹配，就被删除，否则保留下来作为检测器；如此循环迭代，直到产生足够大小的检测器集\
    \ R 为止。检测器生成过程如图 7-1 所示。\n\n![](img/cd91189832ca806b16310970569db51c_91_0.png)\n\
    \n图 7-1 阴性选择算法检测器生成过程\n\nNSA 算法中，字符串的匹配一般采用连续相同位匹配规则，并且匹配阈值事先固定，检测时如果抗原与任意检测器匹配，则认为受保护的对象发生了改变，出现了入侵现象。连续相同位匹配规则见定义\
    \ 7-1 和定义 7-2。\n\n定义 7-1 相似度。两个等长字符串 $a$ 和 $b$，两者对应的位连续相同的最大位数 $r_{ab}$ 称为 $a$\
    \ 与 $b$ 的相似度，$r_{ab}$ 越大，相似度越高。\n\n例如，$a=1001110101$，$b=1001011101$，则 $r_{ab}=4$。\n\
    \n定义 7-2 匹配。两个等长字符串 $a$ 和 $b$ 的相似度 $r_{ab}$ 超过匹配阈值 $r$ 时，称 $a$ 与 $b$ 匹配。\n\n####\
    \ 7.2.2 阴性选择算法中存在的问题\n\n阴性选择算法主要存在以下不足之处。\n\n- 1. 检测器生成效率较低\n\n由于检测器随机生成，大多数候选检测器被抛弃，导致效率较低。理论上，候选检测器数\
    \ $N_{R0}$ 与自体数 $N_S$ 呈指数关系，其关系如式 (7-1) 所示[44]，即\n\n$$N_{R0} = \\frac{\\ln P_f}{\\\
    ln P_M \\times (1 - P_M)^{N_S}}$$ (7-1)\n\n式中，$P_f$ 为期望漏检率；$P_M$ 为检测器字符串与一个随机字符串匹配的概率，如式\
    \ (7-2) 所示[139]，即\n\n$$P_M \\approx m^{-r}[(l-r)(m-1)/m + 1]$$ (7-2)\n\n其中，$m$\
    \ 为字母母数，如果是二进制编码，则 $m=2$；$l$ 为字符串长度；$r$ 为匹配阈值。\n\nD’haeseleer 对 NSA 算法进行了分析，NSA\
    \ 的时间复杂度与 $N_{R0}$ 和 $N_S$ 成正比，每个候选检测器都要与所有自体进行匹配，时间复杂度为 $O(N_{R0} \\cdot N_S)$；NSA\
    \ 的空间复杂度则取决于 $N_S$，为 $O(l \\cdot N_S)$ [55]。\n\nKim 等分析 NSA 用于网络入侵检测时发现 NSA 算法在检测器生成时会存在严重的计算开销问题，产生\
    \ 1000 个检测器大约花了 20h[140]。\n\n- 2. 实际的漏检率与期望漏检率差异较大\n\nForrest 等的测试结果[44]表明，在期望漏检率固定为\
    \ 0.1 时，随着自体数的增大，实际漏检率将增大，并逐渐偏离期望漏检率。例如，当 $N_S=16$ 时，实验漏检率 $P_{fe}=0.104$，与期望漏检率\
    \ $P_f$ 偏离 0.004；当 $N_S=128$ 时，$P_{fe}=0.157$，与期望漏检率 $P_f$ 偏离 0.057。究其原因，一是与检测器之间的重复覆盖有关，二是与下述的“黑洞”有关。随着\
    \ $N_S$ 的增加，候选检测器数 $N_{R0}$ 增加，有效检测器重复覆盖的概率也会增大。“黑洞”的数量也是随着 $N_S$ 的增加而增加的。\n\n\
    - 3. “黑洞”问题\n\nD’haeseleer 的分析[141]表明，采用 \\(r\\) 位连续匹配规则的检测器，并不能完全覆盖非自体空间，如果自体集\
    \ \\(S\\) 包含两个有连续 \\(r-1\\) 位相同的字符串 \\(s_1\\) 和 \\(s_2\\)，则存在两个“黑洞”字符串 \\(h_1\\\
    ) 和 \\(h_2\\)，任何匹配 \\(h_1\\) 和 \\(h_2\\) 的候选检测器必然也匹配 \\(s_1\\) 和 \\(s_2\\)，如下所示：\n\
    \n```\ns_1 : a_1 \\cdots a_k b_{k+1} \\cdots b_{k+r-1} c_{k+r} \\cdots c_l\ns_2\
    \ : a'_1 \\cdots a'_k b_{k+1} \\cdots b_{k+r-1} c'_{k+r} \\cdots c'_l\n      \\\
    Downarrow\nh_1 : a_1 \\cdots a_k b_{k+1} \\cdots b_{k+r-1} c'_{k+r} \\cdots c'_l\n\
    h_2 : a'_1 \\cdots a'_k b_{k+1} \\cdots b_{k+r-1} c_{k+r} \\cdots c_l\n```\n\n\
    同样的方法表明，采用海明 Hamming 距离匹配规则的检测器也存在“黑洞”，“黑洞”的存在将会降低系统检测率。\n\n- 4. 匹配阈值的确定\n\n从检测性能和检测效率方面考虑，检测器生成的目标是要以尽量小的检测器库覆盖尽量大的非自体空间，也就是检测数量\
    \ \\(N_R\\) 和 \\(P_f\\) 尽量小。而这两者都与匹配阈值 \\(r\\) 有关，并且两个目标是相互矛盾的。\n\n首先来看 \\(N_R\\\
    )，其与 \\(P_M\\) 和 \\(P_f\\) 的关系如式 (7-3) 所示。\n\n$$N_R = \\frac{\\ln P_f}{\\ln(1\
    \ - P_M)} \\qquad (7-3)$$\n\n假设固定 \\(P_f\\) 不变，则 \\(N_R\\) 随着 \\(P_M\\) 的增加而增加，根据式\
    \ (7-2)，\\(P_M\\) 随着 \\(r\\) 的增加呈指数递减，因此，\\(N_R\\) 将随着 \\(r\\) 的减小而显著增加。\n\n对于\
    \ \\(P_f\\) 而言，主要与“黑洞”的数量 \\(N_H\\) 有关，\\(N_H\\) 越大，\\(P_f\\) 越大。根据 D’haeseleer\
    \ 的分析[141]，“黑洞”与自体的分布和匹配阈值 \\(r\\) 有关，如果 \\(r\\) 越大，自体集中两个字符串有 \\(r-1\\) 位相同的概率就越小，存在“黑洞”的可能性也越小，当\
    \ \\(r=l\\) 时，“黑洞”消失。\n\n因此，\\(r\\) 的选择是很困难的，\\(r\\) 太小将导致 \\(N_R\\) 增加，检测效率降低；\\\
    (r\\) 太大，“黑洞”数量增大，\\(P_f\\) 上升，检测性能下降，特别是在自体分布情况不明了的情况下，很难确定 \\(r\\) 为多少才能使“黑洞”数量降至一个可接受的水平。事实上，选择不恰当的\
    \ \\(r\\) 根本无法产生出符合期望漏检率 \\(P_f\\) 的检测器库。\n\n#### 7.2.3 几种改进的阴性选择算法\n\n一些改进的 NSA\
    \ 算法针对上述部分问题进行了研究，具有代表意义的有线性算法[55]、贪婪算法[55]、带变异的阴性选择算法[23] 和匹配阈值可变阴性选择算法[142]。\n\
    \n- 1. 线性算法[55]\n\n线性算法主要从减少候选检测数量出发来提高检测器生成效率，使检测器生成时间与自体数呈线性关系而非指数关系，算法过程分为两个步骤。\n\
    \n**步骤 1** 计算 \\( r \\) 子串不匹配自体的数目。进行一个有限的递归运算得到一定数量的不与自体匹配的字符串。对一个长度为 \\( r \\\
    ) 的串 \\( s \\)，\\(\\hat{s}\\) 表示去掉 \\( s \\) 第一个位后得到的串，\\( s.b \\) 表示串 \\( s \\\
    ) 后面接 \\( b \\)，\\(\\hat{s}.b \\) 就表示 \\( s \\) 去掉了第一个位再后接 \\( b \\) 的串，模板 \\\
    ( t_{i,s} \\) 是指一个模板，它的 \\( r \\) 个连续位从第 \\( i \\) 位开始，并且这 \\( r \\) 个连续位为串 \\\
    ( s \\)，\\( 1 \\leqslant i \\leqslant (l-r-1) \\)。定义 \\( C_i[s] \\) 为 \\( t_{i,s}\
    \ \\) 的不与自体集中任意串匹配的右填充数量。在各种情况下按式(7-4)计算。\n\n\\( C_i[s] = \\begin{cases} 0, &\
    \ \\quad t_{i,s} \\text{ 与 S 匹配} \\\\ C_{i+1}[\\hat{s}.0] + C_{i+1}[\\hat{s}.1],\
    \ & \\quad \\text{否则} \\end{cases} \\) (7-4)\n\n**步骤 2** 用枚举法从候选检测器中随机选出检测器。具体的选取办法为从\
    \ \\(\\{1, \\cdots, T\\} (T = \\sum_s C_1(s))\\) 中随机选取一个数 \\( k \\)，在 \\( C_1[\\\
    cdot] \\)（“.”表示任何字符串）中作二叉查找得到 \\( s \\)，使式(7-5)成立，即\n\n\\( P_1 = \\sum_{s \\ll\
    \ s_1} C_1[s] < k \\leqslant Q_1 = \\sum_{s \\leqslant s_1} C_1[s] \\) (7-5)\n\
    \n所有在 \\( (P_1, Q_1) \\) 范围内的非匹配串都以 \\( s \\) 开始，通过查找 \\( k \\) 属于哪个划分，就可以确定串\
    \ \\( k \\) 上从 \\( r+1 \\) 到 \\( l \\) 位上的值。\n\n线性算法的时间复杂度为 \\( O((l-r) \\cdot\
    \ N_S) + (l-r) \\cdot 2^r + O(l \\cdot N_S) \\)，空间复杂度为 \\( O((l-r)^2 \\cdot 2^r)\
    \ \\)。与原 NSA 算法相比，线性算法的时间和空间复杂度都有所下降。\n\n- 2. 贪婪算法[55]\n\n贪婪算法建立在线性算法的基础上，主要通过消除冗余的检测器，保证生成的检测器能够尽量覆盖非自体空间。该算法也建立在\
    \ \\( r \\) 子串不匹配自体数目矩阵的基础上。\n\n算法过程分为两步：\n\n**步骤 1** 产生 \\( D \\) 数组。算法使用两个不同的\
    \ \\( D \\) 数组，即 \\( D_S \\) 和 \\( D_R \\)。它们分别基于自体集合 \\( S \\) 和检测器集合 \\( R \\\
    ) 的当前状态，\\( D_R \\) 用来表示模板中有多少个串不与先前生成的检测器匹配。\n\n**步骤 2** 生成检测器。选择有效模板中值最大的模板，以匹配最多不与自体匹配的串。在每一个新的检测器生成以后，更新\
    \ \\( D_R \\) 以及时反映检测器集合的现状。\n\n贪婪算法的时间复杂度为 \\( O((l - r) \\cdot 2^r \\cdot N_R)\
    \ \\)，空间复杂度为 \\( O((l - r)^2 \\cdot 2^r) \\)。贪婪算法的时间复杂度与 Forrest 的 NSA 算法相比没有显著下降，如果\
    \ \\( N_R \\) 较大，消耗的时间可能更多，但是检测器的分布却达到了最佳状态。\n\n- 3. 带变异的阴性选择算法[23]\n\nde Castro\
    \ 等将变异引入到算法之中，满足了缩小搜索空间的要求，减少了候选检测器的数量，从而提高了算法效率，但是仍未解决匹配阈值难确定和“黑洞”等问题。\n\n算法过程如下：\n\
    \n  - 步骤 1 定义自体集；\n  - 步骤 2 随机生成候选检测器；\n  - 步骤 3 把每个候选检测器与自体比较，如果匹配成功，则对候选检测器进行有导向性的变异，使它远离自体。\n\
    \n- 4. 匹配阈值可变阴性选择算法[142]\n\nD'haeseleer 在提出“黑洞”时就建议用匹配阈值可变的匹配规则来减少黑洞[55]，但是没有给出具体改进和分析。张衡等给出匹配阈值可变的具体算法和仿真分析[142]，具体算法步骤如下：\n\
    \n  - 步骤 1 定义自体集 S；\n  - 步骤 2 随机产生字符串 a,设置初始匹配阈值为 \\( r_1 \\)；\n  - 步骤 3 将字符串\
    \ a 依次与集合 S 中字符串匹配；\n  - 步骤 4 根据匹配规则，如果 a 不与 S 中任何字符串匹配，则 a 成熟，将 a 与匹配阈值加入到检测器集中，转到步骤\
    \ 2；\n  - 步骤 5 若 a 遇到与之匹配的字符串，则将匹配阈值调整为 \\( r' \\)，如果 \\( r' > r_c \\)，转到步骤 2,否则转到步骤\
    \ 3。\n\n仿真分析表明，该算法对减少“黑洞”数目是有效的，并且检测性能也有所提高。但实质上“黑洞”的减少还有赖于最大匹配阈值 \\( r_c \\)，仍然需要设置匹配阈值\
    \ \\( r_c \\)。\n\n### 7.3 免疫融合阴性选择算法\n\n针对 NSA 算法存在的不足，本章将免疫网络调节的思想引入到基于阴性选择的检测器产生过程中，提出免疫融合阴性选择算法(II-NSA)。\n\
    \nII-NSA 算法的基本思想是：\n\n- (1) 克隆选择原理既然能使抗体接近抗原，产生较高的亲和力，那么也能使免疫细胞远离自体，抑制自免疫的发生。因此，克隆选择原理也将应用到算法中，当检测器与自身匹配时不是简单地丢弃，而是通过变异使其远离自体，有更大的机会成熟，从而提高检测器的生成效率。\n\
    \n- (2) 检测器库是一个免疫调节网络，每个检测器不是孤立的，而是一个相互识别、相互刺激、相互抑制、动态平衡的网络结构。相互识别的检测器有较大的重复覆盖范围，因此应该采取抑制策略，从而在保证检测性能的基础上抑制检测器库的规模，提高检测效率。\n\
    \n- (3) 抗体与抗原的匹配是模糊的，检测器与抗原的匹配也应该是模糊的，而且检测器与抗原，与自体匹配的模糊程度应该是一致的，即检测器如果越远离自体，则其检测的模糊程度越高，检测范围越广。因此，匹配阈值\
    \ r 可变的思想将被加以改进引入到 II-NSA 中，从而减少“黑洞”数目，并且自适应地获得匹配阈值 r，从而解决 r 难确定的问题。\n\n综上所述，与其他改进的\
    \ NSA 相比，II-NSA 是对 NSA 更全面的改进。\n\n#### 7.3.1 检测器的检测范围分析\n\n如果用检测器匹配的字符串数 D 来衡量检测器的覆盖空间，则\
    \ D 是检测器长度 l、匹配阈值 r 和每位字母数 m 的函数，如式(7-6)所示[143]\n\n\\(D(l) = m^l - T(l)\\) (7-6)\n\
    \n式中，\\(T(l)\\) 表示与检测器不匹配的字符串数，如式(7-7)所示\n\n\\(T(l) = \\begin{cases} m^l - m^{l-r}\
    \ - (l-r)m^{l-r-1}, & \\quad r \\leqslant l \\leqslant 2r \\\\ 2T(l-1) - T(l-r-1),\
    \ & \\quad l > 2r \\end{cases}\\) (7-7)\n\n如果检测器采用二进制编码，则检测器覆盖空间如式(7-8)和式(7-9)所示[143]\n\
    \n\\(D(l) = 2^l - T(l)\\) (7-8)\n\n\\(T(l) = \\begin{cases} 2^l - 2^{l-r} - (l-r)2^{l-r-1},\
    \ & \\quad r \\leqslant l \\leqslant 2r \\\\ 2T(l-1) - T(l-r-1), & \\quad l >\
    \ 2r \\end{cases}\\) (7-9)\n\n从式(7-6)~式(7-9)可以看出，一个检测器的覆盖范围随着 r 的增加呈现指数递减。因此，抑制匹配阈值\
    \ r 将使检测器的检测性能显著提高，以下给出一个定理来说明检测器可取的最小匹配阈值。\n\n定义 7-3 字符串与字符串集的相似度。设有一个字符串 \\\
    (a\\) 及等长字符串集 \\(C = \\{c_1, c_2, \\cdots, c_k\\}\\)，\\(a\\) 与 \\(C\\) 中字符串的相似度对应为集合\
    \ \\(\\{r_{ac_1}, r_{ac_2}, \\cdots, r_{ac_k}\\}\\)，则 \\(a\\) 与 \\(C\\) 的相似度定义见式(7-10)，即\n\
    \n\\(r_{aC} = \\max(\\{r_{ac_1}, r_{ac_2}, \\cdots, r_{ac_k}\\})\\) (7-10)\n\n\
    定义 7-4 检测器的自体相似度。检测器 \\(d\\) 与自体集 \\(S\\) 的相似度，称为检测器的自体相似度，记为 \\(r_{aS}\\)。\n\n\
    定理 7-1 对于一个检测器 \\(d\\)，如果其自体相似度为 \\(r_{aS}\\)，则对于任意的字符串 a，如果与检测器 d 的最大连续匹配位数 \\\
    ( r_a > r_{as} \\)，则 \\( a \\notin S \\)，即 a 为非自体。\n\n证明 如果 \\( a \\in S \\)，根据定理的假设，则\
    \ \\( r_a \\leqslant r_{as} \\)，显然与另一假设 \\( r_a > r_{as} \\) 矛盾。\n所以 \\( a \\\
    notin S \\)。\n证毕。\n\n根据定理 7-1 和匹配规则定义，检测器 d 的匹配阈值 r 只要满足 \\( r \\geqslant r_{as}\
    \ \\)，就可以产生正确的检测结果，可以取 \\( r = r_{as} \\)，使检测器 d 的覆盖范围最大化。而 NSA 中对于所有检测器采用统一的匹配阈值\
    \ r 进行检测，如果 \\( r_{as} < r \\)，则浪费了检测器 d 的检测能力。r 每增加 1，检测器的覆盖面积可能减小将近一半。\n\n为了便于理解和分析，将字符串集进行形态空间定义，长度为\
    \ l 的字符串全集 U 可视为一个半径为 l 的球状空间，U 的体积用包含的字符串个数来表示，即 \\( V(U) = 2^l \\)。自体集 S 为包含在\
    \ U 中的一块不规则形态空间，\\( V(S) = N_s \\)（\\( N_s \\) 为自体数），而每个检测器的覆盖区域为一个包含于 U 中的球状空间\
    \ D，根据式 (7-6) 和式 (7-7)，D 的半径取 \\( rd = l - r \\)，r 越小，则 rd 越大，\\( V(D) \\) 也越大。当\
    \ \\( r = 0 \\) 时，\\( rd = l \\)，\\( V(D) = 2^l = V(U) \\)，一个检测器覆盖了整个字符串空间 U；当\
    \ \\( r = l \\) 时，\\( rd = 0 \\)，\\( V(D) = 0 \\)。形态空间表示如图 7-2 所示。\n\n根据上述的空间转换概念，可以定义两个字符串\
    \ \\( s_1 \\) 和 \\( s_2 \\)（检测器、自体或非自体）的距离，如式 (7-11) 所示\n\n\\( dS(s_1, s_2) =\
    \ l - rmatch(s_1, s_2) \\) (7-11)\n\n式中，l 为字符串长度。\n\n检测器检测范围理论和近似形态空间是 II-NSA\
    \ 算法的基础。\n\n![](img/cd91189832ca806b16310970569db51c_97_0.png)\n\n图 7-2 字符串形态空间\n"
  mdcn: "\n## 第 7 章 免疫融合阴性选择算法\n\n### 7.1 引言\n\n阴性选择原理是生物免疫系统识别自体和非自体的基础理论，对入侵检测系统识别正常行为和异常行为有着重要的借鉴意义。Forrest\
    \ 等提出的阴性选择算法（negative selection algorithm, NSA）[44]模拟生物免疫系统的 T 细胞的免疫耐受来产生检测器，因其方法简单，检测性能可调节，适用于分布检测等优点而被广泛接受。然而，NSA\
    \ 也具有检测器生成效率低，匹配阈值难以确定，实际的检测性能与期望检测性能有较大差距等缺点。本章将针对 NSA 的上述问题进行改进，将阴性选择原理与克隆选择和免疫网络调节相结合，提出免疫融合阴性选择算法（immune\
    \ integrated negative selection algorithm, II-NSA），II-NSA 在生成检测器时，经历克隆选择使远离自体的检测器快速成熟，同时经历免疫网络调节优化检测器的分布。\n\
    \n### 7.2 阴性选择算法\n\n#### 7.2.1 阴性选择算法概述\n\nForrest 等提出的阴性选择算法模仿了 T 细胞产生时的免疫耐受和非自体识别过程[44]，包括检测器生成（审查）和保护对象监视（监视）两个步骤。\n\
    \nNSA 算法中的检测器生成过程中，首先将合法数据定义为自体集 S；然后随机产生字符串，如果该字符串与自体集 S 中的任一字符串匹配，就被删除，否则保留下来作为检测器；如此循环迭代，直到产生足够大小的检测器集\
    \ R 为止。检测器生成过程如图 7-1 所示。\n\n![](img/cd91189832ca806b16310970569db51c_91_0.png)\n\
    \n图 7-1 阴性选择算法检测器生成过程\n\nNSA 算法中，字符串的匹配一般采用连续相同位匹配规则，并且匹配阈值事先固定，检测时如果抗原与任意检测器匹配，则认为受保护的对象发生了改变，出现了入侵现象。连续相同位匹配规则见定义\
    \ 7-1 和定义 7-2。\n\n定义 7-1 相似度。两个等长字符串 $a$ 和 $b$，两者对应的位连续相同的最大位数 $r_{ab}$ 称为 $a$\
    \ 与 $b$ 的相似度，$r_{ab}$ 越大，相似度越高。\n\n例如，$a=1001110101$，$b=1001011101$，则 $r_{ab}=4$。\n\
    \n定义 7-2 匹配。两个等长字符串 $a$ 和 $b$ 的相似度 $r_{ab}$ 超过匹配阈值 $r$ 时，称 $a$ 与 $b$ 匹配。\n\n####\
    \ 7.2.2 阴性选择算法中存在的问题\n\n阴性选择算法主要存在以下不足之处。\n\n- 1. 检测器生成效率较低\n\n由于检测器随机生成，大多数候选检测器被抛弃，导致效率较低。理论上，候选检测器数\
    \ $N_{R0}$ 与自体数 $N_S$ 呈指数关系，其关系如式 (7-1) 所示[44]，即\n\n$$N_{R0} = \\frac{\\ln P_f}{\\\
    ln P_M \\times (1 - P_M)^{N_S}}$$ (7-1)\n\n式中，$P_f$ 为期望漏检率；$P_M$ 为检测器字符串与一个随机字符串匹配的概率，如式\
    \ (7-2) 所示[139]，即\n\n$$P_M \\approx m^{-r}[(l-r)(m-1)/m + 1]$$ (7-2)\n\n其中，$m$\
    \ 为字母母数，如果是二进制编码，则 $m=2$；$l$ 为字符串长度；$r$ 为匹配阈值。\n\nD’haeseleer 对 NSA 算法进行了分析，NSA\
    \ 的时间复杂度与 $N_{R0}$ 和 $N_S$ 成正比，每个候选检测器都要与所有自体进行匹配，时间复杂度为 $O(N_{R0} \\cdot N_S)$；NSA\
    \ 的空间复杂度则取决于 $N_S$，为 $O(l \\cdot N_S)$ [55]。\n\nKim 等分析 NSA 用于网络入侵检测时发现 NSA 算法在检测器生成时会存在严重的计算开销问题，产生\
    \ 1000 个检测器大约花了 20h[140]。\n\n- 2. 实际的漏检率与期望漏检率差异较大\n\nForrest 等的测试结果[44]表明，在期望漏检率固定为\
    \ 0.1 时，随着自体数的增大，实际漏检率将增大，并逐渐偏离期望漏检率。例如，当 $N_S=16$ 时，实验漏检率 $P_{fe}=0.104$，与期望漏检率\
    \ $P_f$ 偏离 0.004；当 $N_S=128$ 时，$P_{fe}=0.157$，与期望漏检率 $P_f$ 偏离 0.057。究其原因，一是与检测器之间的重复覆盖有关，二是与下述的“黑洞”有关。随着\
    \ $N_S$ 的增加，候选检测器数 $N_{R0}$ 增加，有效检测器重复覆盖的概率也会增大。“黑洞”的数量也是随着 $N_S$ 的增加而增加的。\n\n\
    - 3. “黑洞”问题\n\nD’haeseleer 的分析[141]表明，采用 \\(r\\) 位连续匹配规则的检测器，并不能完全覆盖非自体空间，如果自体集\
    \ \\(S\\) 包含两个有连续 \\(r-1\\) 位相同的字符串 \\(s_1\\) 和 \\(s_2\\)，则存在两个“黑洞”字符串 \\(h_1\\\
    ) 和 \\(h_2\\)，任何匹配 \\(h_1\\) 和 \\(h_2\\) 的候选检测器必然也匹配 \\(s_1\\) 和 \\(s_2\\)，如下所示：\n\
    \n```\ns_1 : a_1 \\cdots a_k b_{k+1} \\cdots b_{k+r-1} c_{k+r} \\cdots c_l\ns_2\
    \ : a'_1 \\cdots a'_k b_{k+1} \\cdots b_{k+r-1} c'_{k+r} \\cdots c'_l\n      \\\
    Downarrow\nh_1 : a_1 \\cdots a_k b_{k+1} \\cdots b_{k+r-1} c'_{k+r} \\cdots c'_l\n\
    h_2 : a'_1 \\cdots a'_k b_{k+1} \\cdots b_{k+r-1} c_{k+r} \\cdots c_l\n```\n\n\
    同样的方法表明，采用海明 Hamming 距离匹配规则的检测器也存在“黑洞”，“黑洞”的存在将会降低系统检测率。\n\n- 4. 匹配阈值的确定\n\n从检测性能和检测效率方面考虑，检测器生成的目标是要以尽量小的检测器库覆盖尽量大的非自体空间，也就是检测数量\
    \ \\(N_R\\) 和 \\(P_f\\) 尽量小。而这两者都与匹配阈值 \\(r\\) 有关，并且两个目标是相互矛盾的。\n\n首先来看 \\(N_R\\\
    )，其与 \\(P_M\\) 和 \\(P_f\\) 的关系如式 (7-3) 所示。\n\n$$N_R = \\frac{\\ln P_f}{\\ln(1\
    \ - P_M)} \\qquad (7-3)$$\n\n假设固定 \\(P_f\\) 不变，则 \\(N_R\\) 随着 \\(P_M\\) 的增加而增加，根据式\
    \ (7-2)，\\(P_M\\) 随着 \\(r\\) 的增加呈指数递减，因此，\\(N_R\\) 将随着 \\(r\\) 的减小而显著增加。\n\n对于\
    \ \\(P_f\\) 而言，主要与“黑洞”的数量 \\(N_H\\) 有关，\\(N_H\\) 越大，\\(P_f\\) 越大。根据 D’haeseleer\
    \ 的分析[141]，“黑洞”与自体的分布和匹配阈值 \\(r\\) 有关，如果 \\(r\\) 越大，自体集中两个字符串有 \\(r-1\\) 位相同的概率就越小，存在“黑洞”的可能性也越小，当\
    \ \\(r=l\\) 时，“黑洞”消失。\n\n因此，\\(r\\) 的选择是很困难的，\\(r\\) 太小将导致 \\(N_R\\) 增加，检测效率降低；\\\
    (r\\) 太大，“黑洞”数量增大，\\(P_f\\) 上升，检测性能下降，特别是在自体分布情况不明了的情况下，很难确定 \\(r\\) 为多少才能使“黑洞”数量降至一个可接受的水平。事实上，选择不恰当的\
    \ \\(r\\) 根本无法产生出符合期望漏检率 \\(P_f\\) 的检测器库。\n\n#### 7.2.3 几种改进的阴性选择算法\n\n一些改进的 NSA\
    \ 算法针对上述部分问题进行了研究，具有代表意义的有线性算法[55]、贪婪算法[55]、带变异的阴性选择算法[23] 和匹配阈值可变阴性选择算法[142]。\n\
    \n- 1. 线性算法[55]\n\n线性算法主要从减少候选检测数量出发来提高检测器生成效率，使检测器生成时间与自体数呈线性关系而非指数关系，算法过程分为两个步骤。\n\
    \n**步骤 1** 计算 \\( r \\) 子串不匹配自体的数目。进行一个有限的递归运算得到一定数量的不与自体匹配的字符串。对一个长度为 \\( r \\\
    ) 的串 \\( s \\)，\\(\\hat{s}\\) 表示去掉 \\( s \\) 第一个位后得到的串，\\( s.b \\) 表示串 \\( s \\\
    ) 后面接 \\( b \\)，\\(\\hat{s}.b \\) 就表示 \\( s \\) 去掉了第一个位再后接 \\( b \\) 的串，模板 \\\
    ( t_{i,s} \\) 是指一个模板，它的 \\( r \\) 个连续位从第 \\( i \\) 位开始，并且这 \\( r \\) 个连续位为串 \\\
    ( s \\)，\\( 1 \\leqslant i \\leqslant (l-r-1) \\)。定义 \\( C_i[s] \\) 为 \\( t_{i,s}\
    \ \\) 的不与自体集中任意串匹配的右填充数量。在各种情况下按式(7-4)计算。\n\n\\( C_i[s] = \\begin{cases} 0, &\
    \ \\quad t_{i,s} \\text{ 与 S 匹配} \\\\ C_{i+1}[\\hat{s}.0] + C_{i+1}[\\hat{s}.1],\
    \ & \\quad \\text{否则} \\end{cases} \\) (7-4)\n\n**步骤 2** 用枚举法从候选检测器中随机选出检测器。具体的选取办法为从\
    \ \\(\\{1, \\cdots, T\\} (T = \\sum_s C_1(s))\\) 中随机选取一个数 \\( k \\)，在 \\( C_1[\\\
    cdot] \\)（“.”表示任何字符串）中作二叉查找得到 \\( s \\)，使式(7-5)成立，即\n\n\\( P_1 = \\sum_{s \\ll\
    \ s_1} C_1[s] < k \\leqslant Q_1 = \\sum_{s \\leqslant s_1} C_1[s] \\) (7-5)\n\
    \n所有在 \\( (P_1, Q_1) \\) 范围内的非匹配串都以 \\( s \\) 开始，通过查找 \\( k \\) 属于哪个划分，就可以确定串\
    \ \\( k \\) 上从 \\( r+1 \\) 到 \\( l \\) 位上的值。\n\n线性算法的时间复杂度为 \\( O((l-r) \\cdot\
    \ N_S) + (l-r) \\cdot 2^r + O(l \\cdot N_S) \\)，空间复杂度为 \\( O((l-r)^2 \\cdot 2^r)\
    \ \\)。与原 NSA 算法相比，线性算法的时间和空间复杂度都有所下降。\n\n- 2. 贪婪算法[55]\n\n贪婪算法建立在线性算法的基础上，主要通过消除冗余的检测器，保证生成的检测器能够尽量覆盖非自体空间。该算法也建立在\
    \ \\( r \\) 子串不匹配自体数目矩阵的基础上。\n\n算法过程分为两步：\n\n**步骤 1** 产生 \\( D \\) 数组。算法使用两个不同的\
    \ \\( D \\) 数组，即 \\( D_S \\) 和 \\( D_R \\)。它们分别基于自体集合 \\( S \\) 和检测器集合 \\( R \\\
    ) 的当前状态，\\( D_R \\) 用来表示模板中有多少个串不与先前生成的检测器匹配。\n\n**步骤 2** 生成检测器。选择有效模板中值最大的模板，以匹配最多不与自体匹配的串。在每一个新的检测器生成以后，更新\
    \ \\( D_R \\) 以及时反映检测器集合的现状。\n\n贪婪算法的时间复杂度为 \\( O((l - r) \\cdot 2^r \\cdot N_R)\
    \ \\)，空间复杂度为 \\( O((l - r)^2 \\cdot 2^r) \\)。贪婪算法的时间复杂度与 Forrest 的 NSA 算法相比没有显著下降，如果\
    \ \\( N_R \\) 较大，消耗的时间可能更多，但是检测器的分布却达到了最佳状态。\n\n- 3. 带变异的阴性选择算法[23]\n\nde Castro\
    \ 等将变异引入到算法之中，满足了缩小搜索空间的要求，减少了候选检测器的数量，从而提高了算法效率，但是仍未解决匹配阈值难确定和“黑洞”等问题。\n\n算法过程如下：\n\
    \n  - 步骤 1 定义自体集；\n  - 步骤 2 随机生成候选检测器；\n  - 步骤 3 把每个候选检测器与自体比较，如果匹配成功，则对候选检测器进行有导向性的变异，使它远离自体。\n\
    \n- 4. 匹配阈值可变阴性选择算法[142]\n\nD'haeseleer 在提出“黑洞”时就建议用匹配阈值可变的匹配规则来减少黑洞[55]，但是没有给出具体改进和分析。张衡等给出匹配阈值可变的具体算法和仿真分析[142]，具体算法步骤如下：\n\
    \n  - 步骤 1 定义自体集 S；\n  - 步骤 2 随机产生字符串 a,设置初始匹配阈值为 \\( r_1 \\)；\n  - 步骤 3 将字符串\
    \ a 依次与集合 S 中字符串匹配；\n  - 步骤 4 根据匹配规则，如果 a 不与 S 中任何字符串匹配，则 a 成熟，将 a 与匹配阈值加入到检测器集中，转到步骤\
    \ 2；\n  - 步骤 5 若 a 遇到与之匹配的字符串，则将匹配阈值调整为 \\( r' \\)，如果 \\( r' > r_c \\)，转到步骤 2,否则转到步骤\
    \ 3。\n\n仿真分析表明，该算法对减少“黑洞”数目是有效的，并且检测性能也有所提高。但实质上“黑洞”的减少还有赖于最大匹配阈值 \\( r_c \\)，仍然需要设置匹配阈值\
    \ \\( r_c \\)。\n\n### 7.3 免疫融合阴性选择算法\n\n针对 NSA 算法存在的不足，本章将免疫网络调节的思想引入到基于阴性选择的检测器产生过程中，提出免疫融合阴性选择算法(II-NSA)。\n\
    \nII-NSA 算法的基本思想是：\n\n- (1) 克隆选择原理既然能使抗体接近抗原，产生较高的亲和力，那么也能使免疫细胞远离自体，抑制自免疫的发生。因此，克隆选择原理也将应用到算法中，当检测器与自身匹配时不是简单地丢弃，而是通过变异使其远离自体，有更大的机会成熟，从而提高检测器的生成效率。\n\
    \n- (2) 检测器库是一个免疫调节网络，每个检测器不是孤立的，而是一个相互识别、相互刺激、相互抑制、动态平衡的网络结构。相互识别的检测器有较大的重复覆盖范围，因此应该采取抑制策略，从而在保证检测性能的基础上抑制检测器库的规模，提高检测效率。\n\
    \n- (3) 抗体与抗原的匹配是模糊的，检测器与抗原的匹配也应该是模糊的，而且检测器与抗原，与自体匹配的模糊程度应该是一致的，即检测器如果越远离自体，则其检测的模糊程度越高，检测范围越广。因此，匹配阈值\
    \ r 可变的思想将被加以改进引入到 II-NSA 中，从而减少“黑洞”数目，并且自适应地获得匹配阈值 r，从而解决 r 难确定的问题。\n\n综上所述，与其他改进的\
    \ NSA 相比，II-NSA 是对 NSA 更全面的改进。\n\n#### 7.3.1 检测器的检测范围分析\n\n如果用检测器匹配的字符串数 D 来衡量检测器的覆盖空间，则\
    \ D 是检测器长度 l、匹配阈值 r 和每位字母数 m 的函数，如式(7-6)所示[143]\n\n\\(D(l) = m^l - T(l)\\) (7-6)\n\
    \n式中，\\(T(l)\\) 表示与检测器不匹配的字符串数，如式(7-7)所示\n\n\\(T(l) = \\begin{cases} m^l - m^{l-r}\
    \ - (l-r)m^{l-r-1}, & \\quad r \\leqslant l \\leqslant 2r \\\\ 2T(l-1) - T(l-r-1),\
    \ & \\quad l > 2r \\end{cases}\\) (7-7)\n\n如果检测器采用二进制编码，则检测器覆盖空间如式(7-8)和式(7-9)所示[143]\n\
    \n\\(D(l) = 2^l - T(l)\\) (7-8)\n\n\\(T(l) = \\begin{cases} 2^l - 2^{l-r} - (l-r)2^{l-r-1},\
    \ & \\quad r \\leqslant l \\leqslant 2r \\\\ 2T(l-1) - T(l-r-1), & \\quad l >\
    \ 2r \\end{cases}\\) (7-9)\n\n从式(7-6)~式(7-9)可以看出，一个检测器的覆盖范围随着 r 的增加呈现指数递减。因此，抑制匹配阈值\
    \ r 将使检测器的检测性能显著提高，以下给出一个定理来说明检测器可取的最小匹配阈值。\n\n定义 7-3 字符串与字符串集的相似度。设有一个字符串 \\\
    (a\\) 及等长字符串集 \\(C = \\{c_1, c_2, \\cdots, c_k\\}\\)，\\(a\\) 与 \\(C\\) 中字符串的相似度对应为集合\
    \ \\(\\{r_{ac_1}, r_{ac_2}, \\cdots, r_{ac_k}\\}\\)，则 \\(a\\) 与 \\(C\\) 的相似度定义见式(7-10)，即\n\
    \n\\(r_{aC} = \\max(\\{r_{ac_1}, r_{ac_2}, \\cdots, r_{ac_k}\\})\\) (7-10)\n\n\
    定义 7-4 检测器的自体相似度。检测器 \\(d\\) 与自体集 \\(S\\) 的相似度，称为检测器的自体相似度，记为 \\(r_{aS}\\)。\n\n\
    定理 7-1 对于一个检测器 \\(d\\)，如果其自体相似度为 \\(r_{aS}\\)，则对于任意的字符串 a，如果与检测器 d 的最大连续匹配位数 \\\
    ( r_a > r_{as} \\)，则 \\( a \\notin S \\)，即 a 为非自体。\n\n证明 如果 \\( a \\in S \\)，根据定理的假设，则\
    \ \\( r_a \\leqslant r_{as} \\)，显然与另一假设 \\( r_a > r_{as} \\) 矛盾。\n所以 \\( a \\\
    notin S \\)。\n证毕。\n\n根据定理 7-1 和匹配规则定义，检测器 d 的匹配阈值 r 只要满足 \\( r \\geqslant r_{as}\
    \ \\)，就可以产生正确的检测结果，可以取 \\( r = r_{as} \\)，使检测器 d 的覆盖范围最大化。而 NSA 中对于所有检测器采用统一的匹配阈值\
    \ r 进行检测，如果 \\( r_{as} < r \\)，则浪费了检测器 d 的检测能力。r 每增加 1，检测器的覆盖面积可能减小将近一半。\n\n为了便于理解和分析，将字符串集进行形态空间定义，长度为\
    \ l 的字符串全集 U 可视为一个半径为 l 的球状空间，U 的体积用包含的字符串个数来表示，即 \\( V(U) = 2^l \\)。自体集 S 为包含在\
    \ U 中的一块不规则形态空间，\\( V(S) = N_s \\)（\\( N_s \\) 为自体数），而每个检测器的覆盖区域为一个包含于 U 中的球状空间\
    \ D，根据式 (7-6) 和式 (7-7)，D 的半径取 \\( rd = l - r \\)，r 越小，则 rd 越大，\\( V(D) \\) 也越大。当\
    \ \\( r = 0 \\) 时，\\( rd = l \\)，\\( V(D) = 2^l = V(U) \\)，一个检测器覆盖了整个字符串空间 U；当\
    \ \\( r = l \\) 时，\\( rd = 0 \\)，\\( V(D) = 0 \\)。形态空间表示如图 7-2 所示。\n\n根据上述的空间转换概念，可以定义两个字符串\
    \ \\( s_1 \\) 和 \\( s_2 \\)（检测器、自体或非自体）的距离，如式 (7-11) 所示\n\n\\( dS(s_1, s_2) =\
    \ l - rmatch(s_1, s_2) \\) (7-11)\n\n式中，l 为字符串长度。\n\n检测器检测范围理论和近似形态空间是 II-NSA\
    \ 算法的基础。\n\n![](img/cd91189832ca806b16310970569db51c_97_0.png)\n\n图 7-2 字符串形态空间\n"
