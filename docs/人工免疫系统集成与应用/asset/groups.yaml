    用研究，丰富和发展人工免疫系统，为工程实际问题的解决提供新的方法。


    从已有人工免疫系统的设计分析来看，这些模型模拟免疫系统中抗体和抗原的识别、抗体的产生过程，利用了免疫系统理论中多样性维持机制、阴性选择或克隆选择原理等部分特征。若提取这些模型的有益免疫特征并借鉴免疫系统中接种育苗或抗体的促进和抑制机制构建增强群体多样性的算子，设计独特的算子模块，并进行有机组合即可获得处理优化计算、数据聚类、异常检测等领域的人工免疫系统及其集成模型。本书在上述各个计算领域进行了算法研究，在优化计算领域，从提高免疫优化计算的收敛速度出发，将克隆选择原理与混沌理论和量子理论集成，分别提出了自适应变尺度混沌免疫优化算法和量子免疫优化算法。在数据聚类领域，针对
    AiNet 算法压缩阈值敏感性和进化无目标性的缺陷进行改进，分别提出了矢量距离免疫网络聚类算法和目标进化免疫网络聚类算法。在异常检测领域，针对阴性选择算法检测器生成速度慢、压缩阈值难确定、检测性能不稳定等问题进行改进，将阴性选择原理与克隆选择原理和免疫网络调节原理相结合，提出了免疫融合阴性选择算法。在应用领域，本书利用免疫系统原理，分别结合电信网络动态路由优化评估、农用地分等聚类、RFID
    入侵检测等具体工程实际问题展开了深入研究，分别提出了基于分层免疫算法的动态路由评估模型、AIS-DEA 数据聚类分析模型、AiNet-GIS 土壤质量评价模型、免疫协同
    RFID 入侵检测方法模型等。


    本书研究的意义在于为人工免疫系统理论及应用增添新的内涵，为人工免疫系统的进一步理论探讨提供新的思想方法，同时人工免疫系统及其集成模型的建立为最优化问题、动态路由评估、土壤资源质量评价、农用地分等、RFID
    入侵检测等提供了新的实用模型，因而本书的理论及应用研究对人工免疫系统理论及应用的发展有一定的推动作用，为工程实际问题的解决提供了新的思路。


    ### 1.6 结构编排与阅读建议


    本书首先从 AIS 的生物原型入手，归纳提炼出其基本原理，主要包括免疫识别、免疫学习、免疫记忆、克隆选择、多样性、分布式和自适应等，进而提出 AIS 的设计框架。然后在已有免疫算法所借鉴的生物免疫机理的基础上，建立既有利于理论探讨又有利于工程应用，且具有自身独特结构、独特设计、应用有效的人工免疫系统及其集成模型，并对这些模型展开系统性的理论研究、性能测试、比较及应用，进而建立针对动态路由评估、数据聚类、函数优化、土壤质量评价、农用地分等、RFID
    入侵检测等问题的人工免疫系统及其集成模型，并展开其理论研究、性能测试、比较及应用。


    本书的内容和结构编排如下。


    第 1 章 绪论。首先，综述 AIS、人工免疫系统和算法、人工免疫系统集成的研究进展；然后，提出本书研究的范围，并叙述本书研究的目的、意义及研究设想。


    第 2 章 人工免疫系统分析及其设计框架。首先对 AIS 的生物基础——自然免疫系统的构成和基本机理进行了探讨；然后分析 AIS 的设计框架及其构成，指出在利用人工免疫系统解决实际问题时，如何设计其基本框架、操作算子模块，为利用
    AIS 解决实际问题时，设计相应的 AIS 模型和算法提供基础框架和理论支撑。


    第 3 章 自适应变尺度混沌免疫优化算法。结合混沌优化算法与免疫算法的特点，提出了一种采用折叠次数无限的自映射 x=sin(2/x) 产生混沌变量的自适应变尺度混沌免疫优化算法，通过自适应变尺度方法不断调整优化变量的搜索空间，同时采用最大循环次数作为控制指标，既保证了寻优的准确性，又保证了算法的快速性。


    第 4 章 量子免疫优化算法。针对传统免疫算法存在的搜索空间较小的不足，充分利用量子计算的高效并行性，将量子理论与免疫理论相结合，对抗原、抗体采用量子编码，并与克隆算子相结合，提出了一种新的算法——量子免疫算法，并构造了量子免疫算子和量子变异策略。其中，量子变异实施于量子抗体，用于加快算法的收敛速度；量子变异实施于普通抗体，用于克服算法的早熟。


    第 5 章 矢量距离免疫网络聚类算法。AiNet 算法生成的网络结构对压缩阈值的选择非常敏感，针对这一问题结合免疫网络的调节和抑制机制，设计了一种基于矢量距离的抗体促进与抑制策略，并对
    AiNet 模型进行了改进。


    第 6 章 目标进化免疫网络聚类算法。针对 AiNet 算法中没有定义目标函数、记忆网络动态无规律变化等问题对其进行改进，提出了基于目标进化的人工免疫网络聚类新算法，将人工免疫网络压缩聚类抽象为多目标规划问题，定义了记忆网络的整体进化目标，并采用疫苗注射策略提升免疫学习质量。


    第 7 章 免疫融合阴性选择算法。针对阴性选择算法检测器生成效率低、匹配阈值难确定、实际漏检率与期望漏检率误差较大等问题，提出了基于免疫调节的阴性选择算法，新算法经历克隆选择使自体相似度较低的检测器成熟，并自适应地确定检测器的匹配阈值，经历免疫抑制优化成熟检测器的分布。


    第 8 章 分层免疫集成及其应用。就优化计算问题，结合免疫系统的相关免疫机理和人工免疫系统的设计框架，提出一个集成多个不同免疫操作的分层免疫算法，进而针对电信网的话务控制和动态路由问题，建立了一个基于分层免疫算法的动态路由评估模型，并把禁用节点作为免疫疫苗引入模型中，提高了模型的收敛速度和解的质量。


    第 9 章 免疫聚类集成及其应用。基于免疫系统中自我调节机制和抗体多样性等特征，借助克隆选择原理的优化机制，集成 C-均值聚类算法设计一个 AIS 聚类模型。进而将
    AIS 聚类与 DEA 模型集成，对农用地分等进行研究，从投入/产出的角度对农用地进行分等，建立了基于 AIS-DEA 的农用地分等模型，并利用该模型对广东省高要市农用地进行分等，取得了较好的效果。


    第 10 章 人工免疫网络与 GIS 集成的土壤资源质量评价。针对土壤资源质量评价中对具有空间特性、不确定性及多指标的对象难以评价等问题，提出将地理信息系统
    (GIS) 与 AiNet 模型相结合，建立了基于 AiNet-GIS 的土壤资源质量评价模型，并将其应用于广东省土壤资源质量评价中。


    第 11 章 基于免疫协同的 RFID 入侵检测系统。针对 RFID 的安全风险，采用入侵检测方法作为 RFID 的新型安全策略，参考生物免疫系统的免疫协同机制构建了一个
    RFID 入侵检测方法模型，首先基于 RFID 的业务特征和已知攻击的统计特征分别定义了 RFID 抗原决定簇和危险信号，并提出采集计算方法；其次提出了基于
    RFID 抗原和危险信号的免疫协同入侵检测方法，包括基于阴性选择的 RFID 适应性检测方法和基于免疫聚类的 RFID 协同检测方法。


    本书围绕人工免疫系统集成应用这一主题，按照由浅入深的顺序编排，但是各个章节又自成体系，独立成篇，读者根据个人需要既可全文阅读，也可挑选感兴趣的章节进行阅读。全书的内容又可以概括为三部分：


    人工免疫系统集成的基本原理及设计框架（包括第 1 章和第 2 章）。读者可以从这一部分了解生物免疫系统信息处理的基本原理，以及人工免疫系统设计的基本方法和步骤，对于初步介入人工免疫系统研究的读者而言可起到入门的作用。


    人工免疫算法的集成改进（包括第 3～7 章）。本部分主要针对克隆选择算法、AiNet 算法、阴性选择算法等经典算法进行分析和改进，对上述经典算法有基本了解的读者可以直接挑选阅读。


    人工免疫系统的集成应用（包括第 8～11 章）。本部分主要就人工免疫系统与电信网络组播路由优化、土壤质量分级、RFID 入侵检测等工程实际问题开展研究，帮助读者深入理解人工免疫系统的具体应用，读者可根据个人兴趣挑选阅读。


    ## 第 2 章 人工免疫系统分析及其设计框架


    ### 2.1 引言


    目前有大量的文献介绍 AIS，其中，Dasgupta 编写的《AIS 及其应用》是 AIS 领域的第一部著作[18]，覆盖了 AIS 计算和应用的不同方面，也是该领域许多领先的研究人员的论文集。国际上第二部研究
    AIS 的著作由 de Castro 博士和 Timmis 博士合著[99]，不同于 Dasgupta 的著作，这是世界上第一部结合自己和其他研究人员的研究成果，全面系统地阐述
    AIS 原理与应用的著作。另外，还有大量文献介绍 AIS 的基本原理及其有关的模型和算法[59-61,100,101]，但是对于 AIS 的层次架构、基本构成、主要过程及设计框架很少有文献论述。这些研究工作对利用
    AIS 解决实际问题时，如何设计相应的 AIS 模型和算法是非常有益的。本章在对 AIS 的基本原理、表示模型、基本组件及相关的算法和模型进行分析的基础上，提出了
    AIS 的设计框架。


    ### 2.2 免疫系统的基本组成


    免疫系统是一个复杂的自适应系统，其主要作用是保护人体不受外部病原体侵害，并把体内所有的细胞或分子分成属于自己的种类和属于外部来源的非自体分子种类[22]。一般意义上讲，免疫系统主要由免疫活性分子、免疫细胞、免疫组织及器官组成，如图
    2-1 所示[23]。而生物免疫学认为，免疫功能主要是由参与免疫反应的细胞和由其构成的器官来完成的。这种免疫细胞主要有两大类：一类为淋巴细胞。它们在抗原的激发下能进一步分化成为各种球蛋白的浆细胞或致敏淋巴细胞。这类细胞因为对抗原的反应有明显的专一性，所以是特异性免疫
    (specific immunity) 反应的主要细胞。第二类细胞则具有摄取抗原、处理抗原并将处理后的抗原以某种方式提供给淋巴细胞的作用。这主要包括巨噬细胞、单核细胞和粒细胞等。这类细胞的重要特征是在参与各种非特异性免疫反应
    (nonspecific immunity) 的同时，也能积极地参与特异性免疫反应。


    ![](img/cd91189832ca806b16310970569db51c_30_0.png)


    图 2-1 免疫系统的组织结构


    免疫系统是一个多层的防御结构，第一层是物理屏障，由皮肤、黏膜组成，阻止多数病原体；第二层是生理屏障，由唾液、汗液、眼泪、胃酸及体温等组成，能杀死消化的食物和吸收的水分中含有的微生物及其他一些“入侵者”；第三层是固有免疫系统，由游荡的细胞
    (如吞噬细胞) 组成；第四层是自适应免疫系统，由淋巴细胞组成，淋巴细胞能适应病原体结构，可有效地组成消灭它们[22]。


    ### 2.2.1 免疫细胞


    免疫细胞由淋巴细胞、细胞因子、自然杀伤细胞、吞噬细胞、粒细胞和它们的相关物质组成。淋巴细胞是免疫系统中起主要作用的微小的白细胞，主要有两种类型：T 细胞和
    B 细胞。B 细胞和 T 细胞在各自的表面表达抗原受体，识别特定抗原决定簇高度特异的抗原，各自的抗原受体分别简称为 B 细胞受体 (B cell receptor,
    BCR) 和 T 细胞受体 (T cell receptor, TCR)。B 细胞的主要功能是产生抗体、提呈抗原和分泌细胞因子并在 T 细胞的辅助下参与免疫调节。T
    细胞的主要功能是调节其他细胞的活动或直接参与免疫反应。T 细胞按功能不同分为毒性 (cytotoxic) T 细胞和调节 T 细胞。调节 T 细胞分为激活
    B 细胞作用的辅助性 T 细胞和抑制 B 细胞作用的抑制性 T 细胞。成熟的 B 细胞产生于骨髓中，成熟的 T 细胞产生于胸腺中。B 细胞和 T 细胞成熟之后进行克隆增殖、分化并表达功能。两种淋巴细胞共同作用并相互影响和控制对方的功能，形成了机体内部高度规律的反馈型免疫网络[24]。


    ### 2.2.2 抗体


    抗体是 B 细胞识别抗原后克隆扩增分化为浆细胞所产生的一种蛋白质。抗体具有两个不同的功能区的分子，一部分是保持相对静止的稳定区 (constant)，简称为“稳定区”；另一部分则是负责与多种不同的感染抗原结合的分子变化区，简称为“变异区”[22]。“稳定区”与宿主组织的受体相互作用，“变异区”与抗原相结合。变异区的体细胞变异随时间增加，这为免疫系统提供了大部分鲁棒性和自适应能力，两种区域的不同导致出现大量不同的抗体群。当一个外部抗原袭击身体时，抗原提呈细胞把外部分子分解到抗原决定簇层次，下一步是产生与抗原决定簇结合的抗体。抗体由
    DNA 分子片段随机重组产生。一旦在抗原决定簇层次发现匹配，一个特定信号就会发给 B 细胞，产生适合匹配的更多的抗体，从而淹没外部抗原，消除威胁或感染。抗体既能识别抗原，又能被其他抗体识别。抗体产生的多样性基于基因变异、编辑和重组，以及抗体的交叉反应。


    ### 2.2.3 免疫系统包含的类型


    免疫系统包含两种层次的防御异物入侵的系统，一种是固有免疫系统 (the innate immune system)，另一种是适应性免疫系统 (the adaptive
    immune system)。固有免疫系统是天生就具有的，不随病原体改变而改变，它由补体、内吞作用系统和吞噬细胞组成，具有与病原体第一次遭遇时就能消灭它们的能力。适应性免疫系统主要由
    T 细胞和 B 细胞组成，它能识别任何微生物并对其作出反应[22]。


    ### 2.3 免疫系统的基本机理


    - 1. 免疫识别


    免疫识别是免疫系统的主要功能之一，其识别的本质是区分“自我”和“非我”。免疫识别是通过淋巴细胞上的抗原识别受体 (receptor) 与抗原的结合 (binding)
    实现的，结合的强度称为亲和度 (affinity)。二者匹配程度越好，抗原与抗体的亲和度就越大。未成熟的 T 细胞首先要经历一个审查环节，只有那些不能与自我
    (即机体本身组织) 发生应答的 T 细胞才可以离开胸腺，执行免疫应答的任务，阻止自身特异淋巴细胞成为自体攻击细胞，从而防止免疫细胞对机体造成错误攻击。该过程称为阴性选择
    (negative selection)，它是免疫识别的一种主要方式[3]。免疫细胞对抗原的识别过程是通过免疫细胞和抗原的结合 (或匹配) 过程实现的，并且识别是特异的，即每一个特定的免疫细胞只能强烈结合几个类似的抗原。


    - 2. 免疫学习


    免疫识别过程同时也是一个学习的过程，学习的结果是免疫细胞的个体亲和度提高、群体规模扩大，并且最优个体以免疫记忆的形式得到保存。免疫学习大致可分为两种：一种发生在初次应答阶段，即免疫系统首次识别一种新的抗原时，其应答时间相对较长；而当机体重复遇到同一抗原时，由于免疫记忆机制的作用，免疫系统对该抗原的应答速度大大提高，并且产生高亲和度的抗体去除病原，这个过程是一个增强式学习
    (reinforcement learning) 过程，对应于再次应答阶段。


    免疫系统不仅可以实现对同一种抗原的识别，而且可以对结构类似的抗原进行识别。免疫学习一般有以下几种途径：①对同一抗原进行重复学习，属于增强式学习；②亲和度成熟，对应于免疫系统中的抗体经遗传操作后其亲和度逐步提高的过程，属于遗传学习；③低度的重复感染，对应于免疫系统中重复遇到相似抗体的过程；④对内生和外生抗原的交叉应答，属于联想式学习。另外，免疫网络的进化也是一个学习的过程[24]。


    - 3. 克隆选择


    克隆选择原理的基本思想是，只有那些能够识别抗原的细胞才进行扩增，只有这些细胞才能被免疫系统选择保留下来，而那些不能识别抗原的细胞则不被选择，也不进行扩增。免疫细胞对抗原的识别就是指抗体-抗原的亲和度超过一定阈值。克隆选择理论描述了获得性免疫的基本特性，并且声明只有成功识别抗原的免疫细胞才得以增殖。经历变异后的免疫细胞分化为效应细胞
    (抗体) 和记忆细胞两种。克隆选择理论与达尔文的生物选择理论有关：克隆竞争结合病原体，亲和力最高的是最适应的，因此复制最多，其应用的是免疫系统内的细胞群体。克隆选择理论的主要特征有：新细胞是父代
    (克隆) 的副本，受制于高速率 (体细胞高频变异) 的成熟机制；清除新分化的载有自身反应受体的淋巴细胞；增殖和分化与成熟细胞和抗原有联系；禁止克隆的持续，对早期自体抗原的清除是抵制自身免疫疾病的基础。克隆选择对应着一个亲和度成熟
    (affinity maturation) 的过程，即对抗原亲和度较低的个体在克隆选择机制的作用下，经历增殖复制和变异操作后，其亲和度逐步提高而“成熟”的过程。因此，亲和度成熟本质上是一个达尔文式的选择和变异的过程，克隆选择原理是通过采用交叉、变异等遗传算子和相应的群体控制机制实现的[24]。


    - 4. 抗体多样性


    根据免疫学知识[22]，免疫系统大约含有 10^6 种不同的蛋白质，但外部潜在的抗原或待识别的模式种类有 10^16 之多，要实现对数量级远远大于自身的抗原的识别，需要有效的多样性个体产生机制。但是免疫系统如何产生如此多的抗体，从而实现对抗原的有效识别呢？免疫系统通过抗体指令系统能够产生多种多样的抗体来应对生物界几乎无限多种类的抗原。例如，B
    细胞通过高频变异和受体编辑（基因重排和重组）来实现多样化。受体编辑(受体编辑是指抗体受体基因片段的随机组合连接，发展淋巴细胞期间，这种不同而又相关的超大规模数量的抗体信息在细胞内进行必要的编码，编码后的遗传信息存储在胚系细胞的染色体中并传给下一代)提供在亲和力域内避免局部优化的能力。点变异对搜索局部区域有好处，而受体编辑可能使免疫应答落在所希望的局部优化中。受体编辑和点变异在亲和力变异过程中起互补作用。除了体细胞高频变异和受体编辑外，为了保持抗体群体的多样性，从骨髓中产生的淋巴细胞一小部分添加到淋巴细胞池中。根据
    Jerne 的观点，受刺激程度最小的淋巴细胞的 5%～8% 的每一个细胞都会被代替，加入到抗原识别细胞池中，对于更广阔的全局优化来说，这可能产生与受体编辑同样的结果。体细胞变异允许局部优化，而受体编辑引入了多样性，导致可能的、新的候选受体。根据抗体的结构，抗体的可变区负责抗原识别，稳定区负责许多效应功能。一个抗体分子的重链可变区通过重组、基因片段（来自每一个基因库）有秩序连接，最终的产物翻译成功能性抗体分子。


    因此，抗体多样性的生物机制主要包括 B 细胞的产生和免疫受体库的组合式重整、体细胞高突变及基因转换等，而目前比较公认的多样性产生机制是抗原受体库的基因片断重组方法，其中基因片断是抗体的组成单位之一。


    - 5. 免疫记忆


    淋巴细胞除了扩增或者分化为浆细胞以外，也能够分化成生命期较长的记忆细胞。当免疫系统初次遇到一种抗原时，淋巴细胞需要一定的时间进行调整以更好地识别抗原，并在识别结束后以最优抗体的形式保留对该抗原的记忆信息，形成记忆细胞。而当免疫系统再次遇到相同或者结构相似的抗原时，记忆细胞将预先被免疫系统筛选出来，迅速活化、增殖、分化为效应细胞，产生高亲和力抗体，执行高效而持久的免疫功能。免疫记忆对应于再次免疫应答和交叉免疫应答，而交叉应答是免疫系统对结构相似的抗原所产生的免疫应答。


    免疫记忆属于联想式记忆，是免疫算法区别于其他进化算法的重要特性之一。Farmer 首先指出免疫记忆可以看做一种联想式记忆 (associative memory)
    模型[13]。Smith 对免疫记忆模型与稀疏分布记忆 (sparse distributed memory，SDM) 模型进行了对比[59,63]，指出初次免疫应答对应于
    SDM 向记忆中存储信息的过程，而再次和交叉免疫应答则可以看做是 SDM 读取记忆信息的过程。


    - 6. 免疫反馈


    反馈机理使免疫系统成为一个复杂的信息系统，它能够识别和分离外部病原，如细菌、病毒等，并具有学习、记忆和模式识别的能力。免疫系统的反馈机制能同步执行两个不同的任务，对外部病原的快速反应和快速稳定免疫系统如图
    2-2 所示[22]。

    '
