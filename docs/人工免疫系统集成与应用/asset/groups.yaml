    (\\text{El}(X_k, a')\\) 最小化的抗体。在数学意义上，\\(a'\\) 就是多边形 S 的费马点[138]。但是多边形费马点求解问题本身是高维非线性复杂问题，不能提取为疫苗。本章从抗原特征的角度出发，取最能反映集合\
    \ \\(X_k\\) 数据特征的顶点坐标均值点作为新抗体 \\(a_{k}'\\)，即\n\n\\(a_{k}' = \\overline{X}\\) (6-8)\n\
    \n步骤 2.6 对 \\(M\\) 中的每个抗体进行疫苗提取，形成疫苗网络 \\(M'\\)；步骤 2.8 中增加了疫苗注射部分，将 \\(M'\\) 合并到抗体网络\
    \ A。\n\n## 6.2.4 算法复杂度分析\n\n设抗体网络 A 的规模为 \\(N_A\\)，步骤 2 的循环中，步骤 2.2.1 的计算量为 \\\
    (O(N_A)\\)，步骤 2.2.3 的计算量为 \\(O(N_c)\\)，步骤 2.2.4 的计算量为 \\(O(\\xi^2)\\)，设抗原集 X 的规模为\
    \ n，则步骤 2 的总计算量为 \\(O(n \\times (N_A + N_c + \\xi^2))\\)。设记忆网络 M 的规模为 k，则步骤 2.4\
    \ 的计算量为 \\(O(k^2)\\)。设循环迭代次数为 l，则 AiNet 的计算量为 \\(O(l \\times (n \\times (N_A +\
    \ N_c + \\xi^2) + k^2))\\)。\n\nAiNet 相比于 OE-AiNet，新增的计算量主要在步骤 2.5 和步骤 2.6。步骤 2.5\
    \ 中需要计算每个抗原在 M 中的识别距离，其计算量为 \\(O(n \\times k)\\)，步骤 2.6 中根据 M 及每个抗体的识别抗原集产生疫苗网络\
    \ \\(M'\\)，其计算量为 \\(O(k)\\)。因为 \\(n \\gg k\\)，所以步骤 2.6 的计算量相对于步骤 2.5 可忽略。相对于 AiNet，OE-AiNet\
    \ 每个循环新增的计算量为 \\( O(n \\times k) \\)，OE-AiNet 的计算量为 \\( O(l \\times (n \\times\
    \ (N_A + N_c + \\xi^2)) + k^2 + n \\times k) \\)。因为 \\( (N_A + N_c + \\xi^2) \\\
    gg k \\)，所以 OE-AiNet 相对于 AiNet 并没有明显增加计算量，实际应用中，因为有了明确的终止条件，循环次数 \\( l \\) 可能较\
    \ AiNet 减小，学习时间不会明显增加。\n\n## 6.2.5 算法的聚类分析过程\n\n通过免疫压缩形成的记忆网络，其规模远远小于聚类样本，是聚类样本的空间特征浓缩，对聚类样本的聚类分析即转换为对记忆网络的聚类分析，简化了聚类问题的复杂度。\n\
    \n### 定义 6-5 最小生成树(minimal spanning tree, MST)\n\n连通图 \\( G \\) 的一个子图如果是一棵包含 \\\
    ( G \\) 所有顶点(即抗体)的树，则称该子图为 \\( G \\) 的生成树，生成树各边的权值总和称为生成树的权，权最小的生成树称为最小生成树 MST。\n\
    \n聚类分析的步骤如下：\n\n- 步骤 1 基于记忆网络 \\( M \\) 及其抗体-抗体亲和力矩阵 \\( S \\) 构建最小生成树 MST。\n\
    - 步骤 2 基于 MST 作剪枝分析，第一种方法是将权值大于剪枝阈值 \\( \\lambda \\sigma_s \\)(\\( \\lambda \\\
    ) 是剪枝系数，一般取 \\( 2.5 \\sim 3.5 \\))的边剪断；第二种方法是，如果已知聚类样本的聚簇数为 \\( k \\)，将权值按从大到小排序，将排名前\
    \ \\( k \\) 位的边剪断。\n- 步骤 3 抗体聚簇，剪枝后的 MST 即由多棵相互断开的子树构成，组成每棵子树的抗体即形成一个抗体聚簇，此时记忆网络聚类完毕，设生成的聚簇集为\
    \ \\( C \\)，\\( C = \\{c_1, c_2, \\cdots, c_k \\} \\)。\n- 步骤 4 样本或在线数据聚类，对于中心聚类而言，每个抗体簇的均值中心点即为聚类中心。如果是非线性分布的样本，对于每一个待聚类数据\
    \ \\( x \\)，计算它与 \\( M \\) 中各抗体的亲和力，\\( x \\) 聚类到与它亲和力最大的抗体所在的聚簇，如果式 (6-9) 成立\n\
    \n\\( f(x, a_i) \\equiv \\max(f(x, M)), \\quad a_i \\in M, a_i \\in c_k \\) (6-9)\n\
    \n则 \\( x_i \\in c_k \\)。\n\n如果在免疫压缩时启用了禁忌克隆，则稀疏分布的样本不希望被聚类，需要设定聚类阈值 \\( \\lambda_c\
    \ \\sigma_s \\)(\\( \\lambda_c \\) 是聚类系数，一般取 \\( 2.0 \\sim 3.0 \\))，仅当 \\( x \\\
    ) 与亲和力最大的抗体的距离小于 \\( \\lambda_c \\sigma_s \\) 时，才被聚类到抗体对应的族，否则将 \\( x \\) 作为异常点处理，这种聚类方式与密度聚类的效果一致，这时，聚类条件除式\
    \ (6-9) 外，还需满足式 (6-10)，即\n\n\\( \\|x - a_i\\| \\leqslant \\lambda_c \\sigma_s\
    \ \\) (6-10)\n\n压缩阈值 \\( \\sigma_s \\) 控制着抗体的特异性水平，对聚类结果的影响很大。根据目标进化算法的克隆选择策略和亲和力抑制策略，识别同一聚簇的抗体子网中，相邻抗体间距离\
    \ \\(d_{ab}\\) 满足 \\(\\sigma_s \\leqslant d_{ab} \\leqslant 2\\sigma_s\\)。设样本集\
    \ X 中，不同簇的两个样本之间距离的最小值为 dn，根据聚类分析的剪枝策略，如果已知聚簇数，当 \\(d_{ab} < dn\\) 时，能正确地将跨簇相邻抗体的连接剪断而产生正确的聚类划分。因此，\\\
    (\\sigma_s \\leqslant d_{ab} \\leqslant 2\\sigma_s < dn\\)，即 \\(\\sigma_s < dn/2\\\
    ) 时，能使聚簇正确划分。因为 dn 未知，通常 \\(\\sigma_s\\) 先取一较小值（如 \\(\\sigma_s \\leqslant 0.001\\\
    )），根据生成的 MST 各边的长度构建柱状图，将观察到明显凸起的一些边，这些边即为应该剪枝的跨簇连接边，最小凸边的长度即为大致的 dn 值，可以选择略小于\
    \ dn/2 的值（如 dn/3）作为 \\(\\sigma_s\\)。\n\n## 6.3 算法对比仿真分析\n\n本节针对中心聚类和非线性样本聚类，对\
    \ AiNet 算法和改进后的 OE-AiNet 算法进行对比分析，主要评估算法的压缩质量和聚类质量。\n\n### 6.3.1 中心聚类实验对比分析\n\n\
    中心聚类采用 AiNet 算法构造的线性样本进行分析，样本包含 50 个二维数据，分属 5 个聚簇，每个聚簇 10 个数据样本，聚簇间隙明显。样本的二维空间分布如图\
    \ 6-1 所示。\n\n![](img/cd91189832ca806b16310970569db51c_86_0.png)\n\n图 6-1 中心聚类样本\n\
    \n基于中心聚类样本分别用 AiNet 算法和 OE-AiNet 算法作聚类对比实验，参数取网络压缩阈值 \\(\\sigma_s = 0.1\\)，剪枝系数\
    \ \\(\\lambda = 3\\)，迭代次数为 10。采用类散布矩阵迹来评价聚类质量，类散布矩阵迹越小，表示聚类效果越好。类散布矩阵迹的定义见式(6-11)。\n\
    \nC(W, P) = \\sum_{i=1}^k \\sum_{j=1}^n w_{ij} (d(x_j, p_i)) (6-11)\n式中，W 为划分矩阵；P\
    \ 为聚类中心集；p_i 为第 i 类的聚类，即\nw_{ij} = \\begin{cases} 1, & x_j \\in p_i \\\\ 0, &\
    \ x_j \\notin p_i \\end{cases}\n\n采用 AiNet 算法和 OE-AiNet 算法各进行 20 次聚类实验，OE-AiNet\
    \ 的类散布矩阵迹平均为 4.1420，小于 AiNet 的 4.2575，说明 OE-AiNet 的平均聚类质量优于 AiNet，OE-AiNet 的类散布矩阵迹标准差为\
    \ 0.0552，小于 AiNet 的 0.1410，说明 OE-AiNet 聚类质量的稳定性优于 AiNet。\n\n各抽取一次实验结果的网络结构来观察记忆网络与样本分布形状的吻合度，如图\
    \ 6-2 所示。为了便于对比观察，将聚类样本与记忆网络叠加在同一图上显示，从图中对比观察，OE-AiNet 算法产生的记忆网络与聚类样本的分布特征非常吻合，而\
    \ AiNet 算法产生的记忆网络则与聚类样本的右下角聚簇有明显偏离。\n\n![](img/cd91189832ca806b16310970569db51c_87_0.png)\n\
    \nAiNet 算法缺乏对记忆网络整体目标的评价，记忆网络受抗原刺激随机变化，且记忆网络的形状与刺激抗原的先后顺序有关，记忆网络更偏向于最近刺激的抗原，且在进化过程中可能会出现退化现象，所以记忆网络容易偏离聚类样本。OE-AiNet\
    \ 定义了记忆网络整体进化目标，进化过程中保存了最优的记忆网络，且进化目标基于记忆网络与抗原分布的吻合度评价，并且在评价时产生了疫苗，因此能生成更吻合样本分布特征的记忆网络。\n\
    \n### 6.3.2 非线性样本聚类实验对比分析\n\n非线性样本采用 AiNet 构造的二维双螺旋线样本，本实验主要比较 AiNet 和 OE-AiNet\
    \ 的特征压缩质量及其对压缩阈值 \\(\\sigma_s\\) 的敏感程度。双螺旋线样本数为 190，由两根螺旋线组成，正确的聚类应该是一个螺旋线聚为一类，双螺旋线样本如图\
    \ 6-3 所示。\n\n![](img/cd91189832ca806b16310970569db51c_88_0.png)\n\n图 6-3 双螺旋线样本\n\
    \n压缩阈值 \\(\\sigma_s\\) 分别取 0.06、0.07、0.08、0.09、0.10、0.11、0.12，AiNet 和 OE-AiNet\
    \ 算法对每个参数各实验 20 次，统计聚类正确率 pc 和平均样本压缩率 pr，结果如图 6-4 所示。\n\n![](img/cd91189832ca806b16310970569db51c_88_1.png)\n\
    \n图 6-4 pc/pr 与 \\(\\sigma_s\\) 的曲线图\n\n从图 6-4 可以看出,随着 σs 的增加,AiNet 和 OE-AiNet\
    \ 算法的聚类正确率 pc 都会下降,在 σs⩽0.07 时,两算法都能正确聚类;σs⩾0.07 时,AiNet 算法的聚类正确率 pc 比 OE-AiNet\
    \ 算法下降速度快;σs⩾0.1 时已不可能正常聚类,表明 AiNet 的聚类结果比 OE-AiNet 对参数 σs 的变化更加敏感。对比 AiNet 和\
    \ OE-AiNet 的压缩率曲线,σs 相同时, AiNet 的压缩率 pr 比 OE-AiNet 低,在两者聚类正确率均为 100% 的 σs = 0.07\
    \ 点时,AiNet 的压缩率 pr = 34.58%, OE-AiNet 的压缩率 pr = 43.00%, AiNet 的压缩率 pr 比 OE-AiNet\
    \ 低了 8.42%,结果表明,OE-AiNet 算法比 AiNet 算法能更有效地压缩样本特征。\n\n![](img/cd91189832ca806b16310970569db51c_89_0.png)\n\
    \n(a) AiNet双螺旋线聚类网络结构\n\n![](img/cd91189832ca806b16310970569db51c_89_1.png)\n\n\
    (b) OE-AiNet双螺旋线聚类网络结构\n\n图 6-5 双螺旋线聚类网络结构\n\n分析 OE-AiNet 与 AiNet 对参数 \\(\\sigma_s\\\
    ) 的敏感程度可以发现，决定聚类正确性的两个参数，一是不同聚簇的抗体之间距离最小值 dn，二是同一聚簇抗体之间距离最大值 dx；当 dx>dn 时，会造成抗体聚簇的错误划分。AiNet\
    \ 因为记忆网络随机变化很容易产生偏离样本空间的抗体，这就造成 dn 变小，并且使本应在同一聚簇的抗体集合分布不均，dx 变大，而 dx∝\\(\\sigma_s\\\
    )，因此，AiNet 对 \\(\\sigma_s\\) 的变化非常敏感，而 OE-AiNet 产生了更符合样本特征的记忆网络，可以容忍 \\(\\sigma_s\\\
    ) 在更大范围内变化。\n\n\\(\\sigma_s=0.07\\) 时分别抽取 AiNet 和 OE-AiNet 学习的网络结构，如图 6-5 所示，对比网络结构图与样本形状，发现\
    \ OE-AiNet 获取的网络结构比 AiNet 更接近于聚类样本原型，这就再一次验证了 OE-AiNet 能生成更吻合样本特征的记忆网络。\n\n##\
    \ 6.4 本章小结\n\n本章针对 AiNet 算法缺乏目标函数的问题进行了改进，提出了 OE-AiNet 算法，OE-AiNet 参考矢量数据压缩的质量评价方法定义了免疫网络进化的整体目标，并基于抗体的局部目标提出了疫苗注射策略。与\
    \ AiNet 算法的对比仿真分析结果表明，OE-AiNet 算法在压缩质量和聚类准确性方面均优于 AiNet。\n"
