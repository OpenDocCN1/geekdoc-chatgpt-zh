    c = -1, N_S = 64 \) 时，程序连续运行 2h 仍然未能产生出有效的检测器库，说明 \( c \) 太小时，检测器之间重复覆盖过小，覆盖盲区过多，已经不能产生满足漏检率
    \( P_f \) 的检测器库。对应不同 \( N_S \) 的三条曲线中，在 \( c \geqslant 3 \) 时，\( lg(N_{R0}) \)
