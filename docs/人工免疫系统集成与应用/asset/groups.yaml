    # 5.5 本章小结


    AiNet 算法对抑制阈值 ts 非常敏感。针对不同的问题，如何合理地调整抑制阈值的大小，以获得较好的分类结果，目前没有统一的理论依据，只能根据用户的经验或反复进行模型运算，因此
    AiNet 算法的最终聚类结果受人为主观因素影响较大。为克服这一缺点，本章的 VD-AiNet 算法采用基于矢量距的抗体选择和抑制机制对 AiNet 模型进行改进。仿真实验表明，VD-AiNet
    算法可以限制浓度高的抗体，增强群体的多样性，从而减弱抑制阈值对该模型的影响，提高算法的全局寻优性能和收敛速度，减少人为主观因素的影响。'
