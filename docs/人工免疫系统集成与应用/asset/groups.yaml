    A 中与自体相似度的排名决定。M 更新后,需要进行免疫抑制,清除互相匹配的检测器,M 中的检测器也需要经历克隆选择过程,不过其选择的目标与 A 稍有差异,是在保证与自体集
    S 距离不减小的前提下,使其远离其他成熟检测器。


    II-NSA 算法中,输入为自体集 S 和期望漏检率 Pf,输出为成熟群 M 及其自体相似度矩阵 Rs。


    II-NSA 算法框架描述如下:


    - 步骤 1 进化代数 k=0,设定算法过程参数,包括:预定的期望漏检率 Pf,未成熟群 A 的规模 Na,成熟比例 ε %,淘汰比例 η %,成熟群 M
    的抑制参数 c。


    - 步骤 2 初始化检测器群, A = Ø, M = Ø。


    - 步骤 3 循环进化。


    - 步骤 3.1 随机生成检测器进入 A,使其达到 A 的种群规模 Na。


    - 步骤 3.2 计算 A 中检测器的自体相似度。


    - 步骤 3.3 A 克隆,将 A 克隆产生克隆检测器群 Ac,每个检测器 ai ∈ A 的克隆数 ni 如式(7-12)所示,即


