    被全面精确地反映。


    针对现行农用地分等方法存在的一些不足，本章提出采用数据包络分析（data envelopment analysis, DEA）模型从投入/产出的角度对农用地进行分等评价；针对
    DEA 模型所存在的排序能力较差等特性，提出通过构建虚拟单元对 DEA 模型进行改进，建立一个基于虚拟单元的 DEA 模型。同时由于农用地分等评价单元较多，采用
    DEA 模型对农用地进行分等时，存在数据量大、速度较慢等问题。因而本章利用 9.2 节构建的 AIS 聚类模型，用以解决用 DEA 模型进行农用地分等时存在的数据量大等问题，并将
    GIS、AIS 聚类模型与基于虚拟单元的 DEA 模型相结合建立一个 AIS-DEA 农用地分等模型。然后将其应用于高要市农用地分等，并对该模型进行实证分析。


    # 9.3.2 DEA 模型的分析和改进


    DEA 模型是在美国著名运筹学家 Charnes 等[226]提出的“相对效率评价”概念的基础上发展起来的用于研究多投入多产出的决策单元（decision
    making unit, DMU）指标间相对有效性的一种新的系统分析方法。DEA 模型具有以下特点[194~197]：


    +   (1) 当决策单元的各输入、输出之间关系非常复杂时，应用 DEA 模型具有较大的优势，不仅不必确定各输入、输出指标间的显式关系，从而排除了许多主观因素，增强了评价结果的客观性，还会使问题得到简化。


    +   (2) DEA 模型不受计量单位的影响。大部分的多准则决策方法都受到计量单位的影响，故使用前必须进行数据的无量纲化。但是使用不同的转化方法，其评价结果可能会不同。而
    DEA 模型不受计量单位的影响，因而更客观、更精确。


    +   (3) 提供给决策者如何改善决策单元的信息。DEA 模型不仅能指出哪些决策单元有效，哪些非有效，还可以对决策单元进行进一步分析。这包括非有效决策单元在原产出不变的情况下，某项投入该减少多少；或者在原投入不变的情况下，某项产出该增加多少。


    +   (4) 对于子系统种类较多的复杂系统，各子系统指标之间难于比较，而应用 DEA 模型则不必事先确定各指标间的可比性。


    基于 DEA 模型的上述优点，同时农用地是一个具有多投入、多产出的生产性复杂系统，因此，从投入、产出的效率，即从农用地投入资源的利用效率方面对农用地进行分等，能揭示农用地的质量属性，满足农用地分等规程的要求。


    # 1. DEA 模型简介


    1957 年 Farrell 发表了《The measurement of productive efficiency》，以非预设生产函数代替预设的生产函数来评估效率[198]。1978
    年 Charnes 等在 Farrell 的'
  - '[PAGE 148]


    理论的基础上，将多投入、多产出的效率衡量转换为数学比例，以线性规划求解有效前沿，计算决策单元在固定规模下的相对效率，该模型被称为 CCR 模型[199]。CCR
    模型是 DEA 的第一个模型。1984 年 Banker 等提出了 BCC 模型，该模型允许变动规模报酬，并引入了 Shephard 的距离函数，得出衡量技术效率和规模效率的线性规划模式，用以计算各单元的技术效率、规模效率为递增、递减或不变的情况[227]。此外，其他学者们纷纷从不同角度对
    DEA 原始模型进行了改良，如 Log 一型的 DEA 模型、加法型 CZGS2 模型、具有无穷多个决策单元的半无限规划的 C²W 模型和 C²WY 模型等[199~201]，使得
    DEA 模型日益完善。由于 DEA 模型的类型有很多，根据本章的需要，下面重点介绍 CCR 模型。


    CCR 模型的提出是为了评价多投入、多产出决策单元的投入-产出效率，利用投入/产出的比例这一方式来评估效率。CCR 模型假设有 n 个 DMU，每个 DMU
    有 m 种投入和 p 种产出，则 DMU₀ 的最大相对效率值为[150]


    ```

    \max \sum_{y} O_{ky} V_{ky} \\

    \left\{ \begin{array}{l} \sum_{y} O_{sy} V_{ky} - \sum_{x} I_{kx} U_{kx} \leqslant
    0 \\ U_{kx}, V_{ky} \geqslant 0 \\ s = 1, 2, \cdots, n \end{array} \right.

    (9-19)

    ```


    式中，Oky 为第 k 个决策单元在输出指标 y 上的测量值；Ikx 为第 k 个决策单元在输入指标 x 上的测量值；Vky 为第 k 个决策单元对应于输出指标
    y 的权系数；Ukx 为第 k 个决策单元对应于输入指标 x 的权系数。从式 (9-19) 可以看出，CCR 模型实际上是在效率值不大于 1 的情况下，求能使
    DMU₀ 的投入-产出率最大的权值 Vky 和 Ukx。由于每个决策单元的有效性都是相对于其他单元而言的，故其效率值为相对效率值，而且可以相互比较。


    # 2. DEA 模型的改进


    # 1) DEA 模型的不足


    由于在利用 DEA 模型对 DMUs 进行评价时，不需要知道投入和产出之间的函数关系，也不需要对各投入和产出赋予权重，因此，Dole 称 DEA 模型是一种懒惰的评价模型[202]。但是
    DEA 模型只能将 DMUs 分类，即 DEA 有效和非 DEA 有效两类，对 DEA 有效的 DMUs 却无法进行完全排序。例如，根据式 (9-19)，决策单元
    k 的多指标效率值 Ekk 按下式计算：


    ```

    E_{kk} = \frac{\sum_{y} O_{ky} V_{ky}}{\sum_{x} I_{kx} U_{kx}}

    (9-20)

    ```'
  - '[PAGE 149]


    如果 \( E_{kk} = 1 \)，则称决策单元 \( k \) 是 DEA 有效的；若 \( E_{kk} < 1 \)，则称决策单元 \( k \)
    是非 DEA 有效的。从式(9-22)可以看出，直接用 CCR 中的多指标效率值评价农用地存在如下问题：


    (1) 原始的 CCR 模型只能分辨出决策单元是 DEA 有效还是非有效，即将群体一分为二，不具备对决策单元进行分级、排序的能力；


    (2) 通过对式(9-22)进一步分析知，用于计算效率值的权系数只在对被评价单元 \( k \) 最有利(使其效率值最大)的特定范围内取值，容易形成夸大长处、回避缺陷、以自评为主的氛围，产生表面上
    DEA 有效，但在互评和排序中却处于不利地位的伪有效单元(false positive unit)。


    # 2) DEA 模型的改进方法综述


    针对上述问题，国内外有关学者对 DEA 模型做了许多研究和改进工作，归纳起来大致有以下几种：


    (1) 两阶段法。Khouja 利用两阶段方法对 DEA 模型进行改进[203]。其核心思想是利用 DEA 模型作为过滤器，首先，用 CCR 模型对各决策单元进行有效性评价，从而去掉非
    DEA 有效的单元；然后，再用多指标效用函数方法对留下来的决策单元进行评判、筛选与排序，并将其应用于技术评价中。显然，该方法的主要问题在于，它没有克服 DEA
    模型固有的突出自我的缺陷。


    (2) 有效性排序法。Anderson 等于 1993 年提出了一种有效性排序法[204]，允许有效 DMUs 的 DEA 有效值大于 1，从而达到排序的目的。其具体思路是，在利用
    DEA 模型计算 DMU\(_k\) 的有效值时，去掉投入的加权平均值不小于产出的加权平均值的约束。但是这种做法会造成某些决策单元有效值过高的问题，同时也无法保证能对所有的
    DMUs 排序。


    (3) 基准排序法。Dole 等于 1994 年提出了基准排序法，该方法在计算 DMU\(_k\) 的有效值时，取 \( k \) 单元以外的所有单元组成有效前沿，然后用
    \( k \) 单元的投入、产出与该有效前沿比较，得出有效值。虽然这种方法可以对所有 DMUs 进行排序，但是对于不同的 DMU 其比较的有效前沿是不一样的，由此得出的有效值是否可比存在一定的争议[202]。


    (4) CCA 排序法。Friedman 等于 1997 年提出 CCA 排序法对 DEA 模型进行改进，该方法分为两个步骤[205]。首先通过求解一个分式规划，求出适合所有
    DMUs 的投入和产出权重向量。然后把各 DMU 分别乘以权重求出效率值进行比较。但这一方法不是在所有的情况下均有效，当某一投入或产出为 0 时，该方法失效。但某一投入或产出为
    0 的情况是不可避免的。


    (5) 交叉效率矩阵。Sexton 等于 1986 年引入交叉效率和交叉效率矩阵的概念[194]。该方法在一定程度上解决了产生伪有效单元的问题。但由于 DEA
    模型均为线性规划模型，常常会遇到具有无穷多个最优解的情况，这时，究竟利用哪一'
  - '[PAGE 150]


    组最优加权系数来计算交叉效率值呢？这需要根据实践经验进行处理。


    综上所述，目前 DEA 模型的改进方法都有一定的限制。本章提出一种新的 DEA 模型——基于虚拟单元的 DEA 模型。


    # ## 3. 基于虚拟单元的 DEA 模型的构建


    基于虚拟单元的 DEA 模型是通过设置“虚拟评价单元”或者“目标单元”，这些“虚拟单元”恰好构成一个“最前沿边界”，从而可以将全部参评单位的效率水平区分开来。其具体操作方法是：对样本数据进行重排，所有投入指标取其最差值，而所有产出指标取其最优值，这样设置第一个“虚拟评价单位”；然后所有投入指标取其次最差值，而所有产出指标取其次最优值，这样设置第二个“虚拟评价单位”；其余依次类推，可以构造出与样本容量一样大的虚拟参评单元。鉴于此，在
    DEA 模型的建立过程中引入虚拟最优单元 \(Y_{max}\) 构成一个新的 DEA 模型。该虚拟最优单元 \(Y_{max}\) 的各输出取所有决策单元相应输出的最大值，各投入指标取其最差值，具体形式如式(9-21)所示


    ```

    \(\max \sum_y O_{k,y} V_{k,y}\)

    \(\left\{\begin{array}{l} \sum_y O_{s,y} V_{k,y} + O_{s,max} V_{(k+1),y} - \sum_x
    I_{s,x} U_{kx} - I_{s,min} U_{k+1,x} \leqslant 0 \\ O_{s,max} = \max(O_{s,1},
    O_{s,2}, \cdots, O_{s,m}) \\ I_{s,min} = \min(I_{s,1}, I_{s,2}, \cdots, I_{s,m})
    \\ \sum_x I_{k,x} U_{k,x} = 1 \\ U_{k,x}, V_{k,y} \geqslant 0 \\ s = 1, 2, \cdots,
    n \end{array}\right.\)

    (9-21)

    ```


    在引入虚拟最优单元 \(Y_{max}\) 后，原生产可能集 \(T\) 上的所有决策单元为非有效单元。因此，式(9-21)能够对原生产可能集 \(T\)
    上的所有决策单元进行有效的排序和客观评价，从而能够利用改进后的 DEA 模型对农用地进行分等。


