    制是实现免疫算法优良性能的关键。目前，人工免疫算法的研究者提出了多种抗体促进和抑制机制。在本章中，我们在低层免疫操作中设计两种新的抗体的促进和抑制机制：①基于浓度的抗体促进和抑制机制；②基于期望值的抗体促进和抑制机制。


    ## 1) 基于浓度的抗体促进和抑制机制


    在基于浓度的抗体促进和抑制机制中，抗体 \(c_i\) 的浓度 \(\xi_i\) 定义为


    \(\xi_i = \frac{\text{与 } c_i \text{ 具有相近适应度的抗体数}}{\text{抗体总数}}\) (8-4)


    计算出抗体 \(c_i\) 的浓度 \(\xi_i\) 之后，便可以通过式(8-5)进行抗体 \(c_i\) 的促进和抑制调节。


    \(p_i = \frac{a \times \left[1 - \frac{\text{fitness}(i)}{\text{Maxfitness}(i)}\right]}{\xi_i}
    + \beta \times \frac{\text{fitness}(i)}{\text{Maxfitness}(i)}\) (8-5)


    式中，\(a, \beta\) 为常数调节因子 (\(0 \leqslant a \leqslant 1, 0 \leqslant \beta \leqslant
    1\))；Maxfitness(i) 表示抗体群的最大适应度；\(p_i\) 为抗体 \(c_i\) 的选择概率。设当前子代群体为 \(C_{k-1} =
    (c_1, c_2, \cdots, c_N)\)，在目前的子代群体 \(C_{k-1}\) 中以概率 \(p_i\) 选择个体 \(c_i\) 进入新的子代群体
    \(C_k\)。由式(8-5)知，在抗体浓度一定的条件下，抗体适应度越大则选择概率越大；在抗体适应度一定的条件下，抗体浓度越大则选择概率越小。这样在保留高适应度抗体的同时，也确保了抗体的多样性，在一定程度上可以克服算法陷入到局部最优解中，能有效防止某些抗体控制选择过程，并且有助于抑制群体中所有的抗体都陷于同一极值而停止进化的未成熟收敛现象，增强局部搜索能力。


    ## 2) 基于期望值的抗体促进和抑制机制


    基于期望值的抗体促进和抑制机制是以抗体的信息熵为基础，首先根据抗体的信息熵计算抗体的浓度，然后以此为基础设计基于期望值的促进和抑制机制。具体实现方式如下。


    ### (1) 抗体信息熵的计算。


    如图 8-3 所示，每个抗体位串可供选择的字母表中共有 \(s\) 个字母：\(k_1, k_2, \cdots, k_s\)。则这 \(N\) 个抗体的信息熵
    \(H(N)\) 为


    \(H(N) = \left[\sum_{j=1}^M H_j(N)\right] / M\) (8-6)


    式中，第 \(j\) 个基因的信息熵 \(H_j(N)\) 为


    \(H_j(N) = \sum_{i=1}^N - p_{ij} \lg p_{ij}\) (8-7)


    式中，\(p_{ij}\) 表示第 \(i\) 个抗体的等位基因源于第 \(j\) 个基因的概率。


    ### (2) 计算抗体的相似度。


    利用信息熵概念的情况下，用于表明两抗体之间的相似度，计算公式如下：


    \(ay_{v,w} = \frac{1}{1 + H(2)}\) (8-8)


    | | 1 | ... | j | ... | m |

    |---|---|---|---|---|---|

    | 抗体1 | | | \(k_1\) | | |

    | 抗体2 | | | \(k_2\) | | |

    | 抗体n | | | \(k_v\) | | |


    图 8-3 熵表示


    ### (3) 计算抗体 V 的浓度 \(c_v\)。


    \(c_v = \left[ \sum_{w=1}^N ac_{wv} \right] / N\) (8-9)


    式中


    \(ac_{mv} = \begin{cases} 1, & a_{y,w} \ge Tac \\ 0, & a_{y,w} < Tac \end{cases}
    \quad (Tac \text{ 为一预先确定的值})\) (8-10)


    ### (4) 计算抗体 V 的期望繁殖率。


    \(e_v = \frac{ax_v}{c_v}\) (8-11)


    式中，\(ax_v\) 为抗体的适应度。


    在基于期望值的抗体促进和抑制机制中，子代群体 \(C_{k-1}\) 中抗体以期望繁殖率 \(e_v\) 被选择进入新的子代群体 \(C_k\)。由式(8-11)可知，在抗体浓度一定的条件下，抗体适应度越大则选择概率越大；在抗体适应度一定的条件下，抗体浓度越大则选择概率越小。这样在保留高适应度抗体的同时，也确保了抗体的多样性。


    ## 3. 变异算子


    根据实际问题和编码机制的不同，免疫算法中变异操作的实现形式多种多样。本章在低层免疫操作中分别引入非均匀变异、有向变异、高斯变异、基于精英抗体的变异等操作算子。


    ### 1) 非均匀变异


    非均匀变异是指对于给定的父代群体 \(C_{k-1} = (c_1, c_2, \cdots, c_N)\)，当某个抗体 \(c_i\) 被选中进行变异时，其具体变异方式从式(8-12)和式(8-13)中随机选择。


    \(c''_i = c_i + \Delta(t, c_i^U - c_i)\) (8-12)

    \(c''_i = c_i + \Delta(t, c_i - c_i^l)\) (8-13)


    式中，函数 \(\Delta(t, y)\) 返回范围 \([0, y]\) 中的一个值，但随着迭代代数 \(t\) 的增加，该值越来越趋向于 0。函数 \(\Delta(t,
    y)\) 的形式如下：


    \(\Delta(t, y) = yr \left( 1 - \frac{t}{T} \right)^b\)


    式中，r 为区间 [0,1] 上的随机数；T 为最大的迭代代数；b 为确定非均匀程度的参数。该特性导致变异算子在早期（t 很小）均匀地搜索解空间，而到晚期则在很小的区域进行搜索。非均匀变异使免疫操作的搜索能力既具有较高的精度又能微调。


    ### 2) 有向变异


    有向变异是指对于给定的父代群体 \(C_{k-1} = (c_1, c_2, \cdots, c_N)\)，某个抗体 \(c_i\) 被选中进行变异时，采用方程
    \(c''_i = c_i + rd\) 进行变异，其中，r 是随机非负实数，d 表示近似的梯度方向，近似梯度的第 i 个元素 \(c_i\) 由下式计算：


    \(d = \frac{f(c_1, \cdots, c_i + \Delta c_i, \cdots, c_n) - f(c_1, \cdots, c_i,
    \cdots, c_n)}{\Delta c_i}\)


    式中，\(\Delta c_i\) 为一个小实数。有向变异保证变异后的抗体是一个较优的抗体。


    ### 3) 高斯变异


    高斯变异(Gaussian mutation)来源于进化策略。本章在低层免疫操作中引入高斯变异，其具体实现方式如下：一个抗体包含两个元素 \((c_i, \sigma)\)，其中，第一个元素
    \(c_i\) 表示搜索空间中的一点，而第二个元素 \(\sigma\) 表示标准差。子代抗体 \((c''_i, \sigma'')\) 是由父代抗体 \((c_i,
    \sigma)\) 变异产生的，其具体变异方程如式(8-16)和式(8-17)所示


    \(\sigma'' = \sigma e^{N(0, \Delta \sigma)}\)


    \(c_i = c_i + N(0, \Delta \sigma'')\)


    式中，\(N(0, \Delta \sigma'')\) 是均值为 0、标准差为 \(\sigma\) 的独立高斯随机数向量。


    ### 4) 基于精英抗体的变异


    在免疫算法的迭代过程中，每代适应度最高的抗体即为精英抗体。从概率上来说，一方面，精英抗体和全局最优解之间的空间距离可能小于群体中其他个体和全局最优解之间的空间距离；另一方面，和精英抗体之间空间距离较小的个体也可能有较高的适应度。因此，精英抗体是求解问题特征信息的直接体现。在群体进化过程中，从精英抗体的基因中提取有效信息，进而开辟一条对抗体进行有效变异的途径。基于这种思想，抗体的变异方式以精英抗体为基础，具体计算公式如下：


    \(\left\{ \begin{array}{l} c_i^{t+1} = c''_{i, \text{best}} + \sigma''_i \times
    N(0, 1) \\ \sigma_i^{t+1} = \sigma_\epsilon + \sigma_i^0 \times e^{-\frac{A \times
    t}{T}} \end{array} \right., \quad i = 1, 2, \cdots, n\)


    式中，\(c_i^{t+1}\) 为子代个体第 i 个分量；\(c''_{i, \text{best}}\) 为父代精英抗体第 i 个分量；\(\sigma_i^{t+1}\)
    为子代个体第 i 个分量的标准差；\(\sigma_i\) 为父代个体第 i 个分量的标准差；A 为标准差动态调整系数；T 为总的进化代数；\(\sigma_\epsilon\)
    为标准差基数；t 为进化的代数；n 为变量 x 中含有的分量个数；\(N(0, 1)\) 为产生的服从标准正态分布的随机数；\(\sigma_i^0\) 对应于初始群体第
    i 个分量的标准差。A 和 \(\sigma_i^0\) 的具体取值根据被研究的问题来确定，通常 \(A \in [1, 10]\)，\(\sigma_i^0
    \in [1, 3]\)，标准差基数 \(\sigma_\epsilon\) 在应用中常取 0。标准差的调整方式有以下三种[149~154]。


    - (1) 指数调整法。


    \(\sigma_i^{t+1} = \sigma_\epsilon + \sigma_i^0 \times e^{\frac{-\Delta k}{T}}\)
    (8-19)


    - (2) 双曲调整法。


    \(\sigma_i^{t+1} = \sigma_\epsilon + \frac{1}{a + \beta t}\) (8-20)


    式中，\(a, \beta\) 均为系数，\(a > 0, \beta > 0\)；其他参数同前。


    - (3) 混合调整法。


    \(\sigma_i^{t+1} = \sigma_\epsilon + \left( \frac{1}{a + \beta t} + \sigma_i^0
    \times e^{\frac{-\Delta k}{T}} \right) / 2\) (8-21)


    混合调整法实际上是指数调整法和双曲调整法的算术平均。


    ## 4. 其他参数


    其他免疫算法中的操作算子和参数，如抗原抗体编码、亲和力计算公式、浓度阈值、记忆库规模等，在低层免疫操作中都可以有不同设置。


    ## 8.4 分层免疫算法的分析


    ### 8.4.1 收敛特性分析


    在每个子抗体群的免疫操作运行到一定代数后，将 \(N\) 个低层免疫操作的结果种群记录到二维数组 \(W[1, \cdots, N; 1, \cdots,
    n]\) 中，并输入到高层免疫操作中。设子抗体群第 \(k\) 次迭代共有子抗体群 \(N\) 个，子抗体群的中心分别为 \(A_k^1, A_k^2, \cdots,
    A_k^N\)。若所求优化问题的最优解为 \(A^*\)，适应度函数为 \(f\)，则可定义分层免疫算法的收敛性如下：


    定义 8-1 如果对应于任意初始子群均有


    \(\lim_{k \to \infty} P\{\max[f(A_k^1), f(A_k^2), \cdots, f(A_k^N)] = f(A^*)\}
    = 1\)


    成立，则称分层免疫算法全局收敛。该定义表明，分层免疫算法迭代足够多次以后，抗体群中的最优子群中心以概率 1 收敛于全局最优解。


    定义 8-2[91,155,156] \(S\) 是一个 \(n \times n\) 的方阵。


    (1) 若对所有的 \(i, j, s_{ij} \geqslant 0\)，记 \(S \geqslant 0\)，称 \(S\) 为非负的(nonnegative)；


    (2) 若 \(S\) 是非负的，且对所有的 \(i\)， \(\sum_{j=1}^n a_{ij} = 1\)，则 \(S\) 是随机的(random)；


    (3) 若 \(S\) 是非负的，且 \(S\) 中的行和列经过置换能得到 \(\begin{bmatrix} C & 0 \\ R & T \end{bmatrix}\)
    形式(\(C, T\) 是方阵)，则 S 是可约的（reducible）。


    ### 定理 8-1[156]


    设 P 是一个可约随机矩阵，\(P = \begin{bmatrix} C & 0 \\ R & T \end{bmatrix}\)，其中，C 是正的 m
    阶随机矩阵，\(R, T \neq 0\)，则


    \(P^{\infty} = \lim_{k\to\infty} P^k = \lim_{k\to\infty} \left[ \sum_{i=0}^{k-1}
    T^i R C^{k-i} \right] = \begin{bmatrix} C^{\infty} & 0 \\ R^{\infty} & 0 \end{bmatrix}
    \quad (8-22)\)


    ### 定理 8-2


    分层免疫算法以概率 1 收敛到全局最优解。


    证明 记所有抗体形成的空间为 \(\Omega\)，抗体用 X 表示，\(X \in \Omega\)。分层免疫算法把一个抗体看成一个状态。再记分层免疫算法的马氏链状态空间为
    G，那么其对应的状态空间维数 \(M = | G | = | \Omega |\)。从分层免疫算法的操作流程来看，它是在上一代最优抗体（状态）的基础上，以概率
    \(P_c\) 对选择的一对抗体上的两个基因位进行交叉变异，以概率 \(P_m\) 对抗体的每个基因位相互独立地进行变异。则算法步骤中的 n 步状态转移可用状态转移矩阵
    \(P = (p_{ij})\) 表示，且 \(p_{ij} \in [0, 1]\)，\(\sum_{j=1}^n p_{ij} = 1\)[91,155,156]。根据定义
    8-1 和定义 8-2，状态转移矩阵 P 是随机的。


    通过置换将转移矩阵 P 的各状态排列如下：第 1 个状态为全局最优解，第 2 个状态为全局次优解，\(\cdots\)，第 n 个状态为全局最差解。对任意状态
    i，依 \(p_{ii} + \sum_{j=i+1}^n p_{ij} \to p_{ii}\) 和 \(p_{ij} = 0(j > i)\) 对转移矩阵进行更新，生成新的转移矩阵
    \(P^*\)。


    \(P^* = (P_{ij})_{|\Omega|\times|\Omega|} = \begin{bmatrix} P_{11} & \\ P_{21}
    & P_{22} \\ \vdots & \vdots & \ddots \\ P_{|\Omega|1} & P_{|\Omega|2} & \cdots
    & P_{|\Omega||\Omega|} \end{bmatrix} = \begin{bmatrix} 1 & 0 & \cdots & 0 \\ p_{21}
    & p_{22} & \cdots & 0 \\ \vdots & \vdots & & \vdots \\ p_{|\Omega|1} & p_{|\Omega|2}
    & \cdots & p_{|\Omega|m} \end{bmatrix} = \begin{bmatrix} C & 0 \\ R & T \end{bmatrix}
    \quad (8-23)\)


    式中，\(R = \begin{bmatrix} p_{21} \\ \vdots \\ p_{n1} \end{bmatrix}\)，\(T = \begin{bmatrix}
    p_{22} & \cdots & 0 \\ \vdots & & \vdots \\ p_{n2} & \cdots & p_m \end{bmatrix}\)
    \(R, T \neq 0, C \equiv [1]\) 是一阶正的随机矩阵。


    根据定义，状态转移矩阵 P 是可约的。


    根据定理 8-1，\(P^{*\infty} = \lim_{k\to\infty} P^{*k} = \begin{bmatrix} C^{\infty}
    & 0 \\ R^{\infty} & 0 \end{bmatrix} = \begin{bmatrix} 1 & 0 \\ R^N & 0 \end{bmatrix}\)。\(P^*\)
    的第一状态的极限概率为 1，即 \(P_1 = \lim_{k \to \infty} P(F_k = F *) = 1\)，由定义 8-1 知分层免疫算法是全局收敛的。


    ### 8.4.2 收敛特性验证


    为了验证分层免疫算法的收敛特性，选择多模态函数 \(F_1\)，用分层免疫算法重复计算 100 次，计算所获得的局部最优和全局最优解及概率。


    \(F_1: f(x, y) = x\sin(4\pi x) - y\sin(4\pi y + \pi) + 1, \quad -1 \leqslant x,
    y \leqslant 2 \quad (8-24)\)


    函数 \(F_1\) 是一个典型的具有众多局部最优解的不等高多模态测试函数。它有 1 个全局极大值点，函数 \(F_1\) 在 \(x = 1.6286,
    y = 1.6292\) 时，\(f(x, y) = 4.2539\) 取得全局最大值；此外，它还有多个局部极大值点。其函数图形如图 8-4 所示。


