    地理区域组合为业务区域，如将所有库房组合为一个逻辑区域，统计危险信号时以业务区域为单位统计。


    系统日志(SysLog)从 RFID 中间件收集阅读器与标签之间的通信数据，假设合法的阅读器均是受 RFID 系统控制的，系统能通过中间件截获所有的标签操作的关键信息。与
    ChLog 一样解析出 AppLog 所需的基础属性，如式(11-11)所示。


    ```

    SysLog = \langle t, Rg, Rc, Pac, EPC, RT \rangle (11-10)

    ```


    式中，元素含义与 ChLog 一致。


    对于抗原决定基 AppLog 的提呈，ChLog(或者 SysLog)可以直接转换为 AppLog，转换过程中将 ChLog.t 转换为 AppLog. T，简单地将时间
    t 映射为时域 T，即 T.st \leqslant t < T.et。AppLog 的其他元素则与 ChLog 一一对应。


    对于危险信号 FeatureLog 的提呈，基于 ChLog(或者 SysLog)，系统按照区域分时段统计危险元素，可直接计算出除指令匹配率(Pm)和匹配次数(Nm)之外的危险元素。


    对于 Nm 和 Pm，基于时间和阅读器指令名称的比较可判断某 ChLog 记录是否与 SysLog 匹配，匹配规则定义见定义 11-4。


    定义 11-4 日志匹配。设在同一区域内，同时段采集到的信道日志集合 ChLog 和系统日志集合 SysLog，lc\in ChLog，如果存在 ls\in
    SysLog，$|lc.t - ls.t| < \epsilon \land lc.Rc = ls.Rc$，则 lc 与 SysLog 匹配，记为 Match(lc,
    SysLog)，否则 lc 与 SysLog 不匹配，记为 $\neg$Match(lc, SysLog)。


    式中，$\epsilon$ 为时间偏差阈值。


    用谓词逻辑表示以上定义为


    ```

    $\forall lc \in ChLog \land \exists ls \in SysLog \land |lc.t - ls.t| < \epsilon
    \land lc.Rc = ls.Rc \Leftrightarrow Match(lc, SysLog)$

    ```


    标识出 lc 与 SysLog 是否匹配后，即可统计出记录匹配次数(Nm)和指令匹配率(Pm)。


