    入侵检测方法的检测性能一般用检测率、误检率和漏检率来评价，RFID 入侵检测方法不是简单地输出入侵与否的标志，而是输出对应的操作类型，本章将定义某人侵类型的检测率、误检率和漏检率，同时定义系统的检测率、误检率和漏检率。


