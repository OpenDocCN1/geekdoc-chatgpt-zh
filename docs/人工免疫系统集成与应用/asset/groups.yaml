    \ 11-6 所示。\n\n![](img/cd91189832ca806b16310970569db51c_184_1.png)\n\n### 11.3.4\
    \ RFID 入侵检测 Agent 类模型\n\nAgent 类建模是 MAS 建模的核心过程，它实现从系统“做什么”到“怎么做”的过渡，其目标是将前面的建模结果封装到\
    \ Agent 中去，最终组装为多 Agent 系统。\n\n定义 11-2 Agent 类。Agent 类是多 Agent 系统中的一类 Agent 的模板，它描述了\
    \ Agent 需要扮演的角色和需要实现的目标。Agent 类的形式化描述为 AgentClass = <name, roles, goals> (11-2)\n\
