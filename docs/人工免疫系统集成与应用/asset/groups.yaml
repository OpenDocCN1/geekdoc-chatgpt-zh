    # # 第 7 章 免疫融合阴性选择算法


    # ## 7.1 引言


    阴性选择原理是生物免疫系统识别自体和非自体的基础理论，对入侵检测系统识别正常行为和异常行为有着重要的借鉴意义。Forrest 等提出的阴性选择算法（negative
    selection algorithm, NSA）[44]模拟生物免疫系统的 T 细胞的免疫耐受来产生检测器，因其方法简单，检测性能可调节，适用于分布检测等优点而被广泛接受。然而，NSA
    也具有检测器生成效率低，匹配阈值难以确定，实际的检测性能与期望检测性能有较大差距等缺点。本章将针对 NSA 的上述问题进行改进，将阴性选择原理与克隆选择和免疫网络调节相结合，提出免疫融合阴性选择算法（immune
    integrated negative selection algorithm, II-NSA），II_NSA 在生成检测器时，经历克隆选择使远离自体的检测器快速成熟，同时经历免疫网络调节优化检测器的分布。


    # ## 7.2 阴性选择算法


    # ### 7.2.1 阴性选择算法概述


    Forrest 等提出的阴性选择算法模仿了 T 细胞产生时的免疫耐受和非自体识别过程[44]，包括检测器生成（审查）和保护对象监视（监视）两个步骤。


    NSA 算法中的检测器生成过程中，首先将合法数据定义为自体集 S；然后随机产生字符串，如果该字符串与自体集 S 中的任一字符串匹配，就被删除，否则保留下来作为检测器；如此循环迭代，直到产生足够大小的检测器集
    R 为止。检测器生成过程如图 7-1 所示。


    ![](img/cd91189832ca806b16310970569db51c_91_0.png)


    图 7-1 阴性选择算法检测器生成过程'
  - '[PAGE 92]


    NSA 算法中，字符串的匹配一般采用连续相同位匹配规则，并且匹配阈值事先固定，检测时如果抗原与任意检测器匹配，则认为受保护的对象发生了改变，出现了入侵现象。连续相同位匹配规则见定义
    7-1 和定义 7-2。


    定义 7-1 相似度。两个等长字符串 $a$ 和 $b$，两者对应的位连续相同的最大位数 $r_{ab}$ 称为 $a$ 与 $b$ 的相似度，$r_{ab}$
    越大，相似度越高。


    例如，$a=1001110101$，$b=1001011101$，则 $r_{ab}=4$。


    定义 7-2 匹配。两个等长字符串 $a$ 和 $b$ 的相似度 $r_{ab}$ 超过匹配阈值 $r$ 时，称 $a$ 与 $b$ 匹配。


    # 7.2.2 阴性选择算法中存在的问题


    阴性选择算法主要存在以下不足之处。


    +   1. 检测器生成效率较低


    由于检测器随机生成，大多数候选检测器被抛弃，导致效率较低。理论上，候选检测器数 $N_{R0}$ 与自体数 $N_S$ 呈指数关系，其关系如式 (7-1)
    所示[44]，即


    $$N_{R0} = \frac{\ln P_f}{\ln P_M \times (1 - P_M)^{N_S}}$$ (7-1)


    式中，$P_f$ 为期望漏检率；$P_M$ 为检测器字符串与一个随机字符串匹配的概率，如式 (7-2) 所示[139]，即


    $$P_M \approx m^{-r}[(l-r)(m-1)/m + 1]$$ (7-2)


    其中，$m$ 为字母母数，如果是二进制编码，则 $m=2$；$l$ 为字符串长度；$r$ 为匹配阈值。


    D’haeseleer 对 NSA 算法进行了分析，NSA 的时间复杂度与 $N_{R0}$ 和 $N_S$ 成正比，每个候选检测器都要与所有自体进行匹配，时间复杂度为
    $O(N_{R0} \cdot N_S)$；NSA 的空间复杂度则取决于 $N_S$，为 $O(l \cdot N_S)$ [55]。


    Kim 等分析 NSA 用于网络入侵检测时发现 NSA 算法在检测器生成时会存在严重的计算开销问题，产生 1000 个检测器大约花了 20h[140]。


    +   2. 实际的漏检率与期望漏检率差异较大


    Forrest 等的测试结果[44]表明，在期望漏检率固定为 0.1 时，随着自体数的增大，实际漏检率将增大，并逐渐偏离期望漏检率。例如，当 $N_S=16$
    时，实验漏检率 $P_{fe}=0.104$，与期望漏检率 $P_f$ 偏离 0.004；当 $N_S=128$ 时，$P_{fe}=0.157$，与期望漏检率
    $P_f$ 偏离 0.057。究其原因，一是与检测器之间的重复覆盖有关，二是与下述的“黑洞”有关。随着 $N_S$ 的增加，候选检测器数 $N_{R0}$
    增加，有效检测器重复覆盖的概率也会增大。“黑洞”的数量也是随着 $N_S$ 的增加而增加的。'
  - "[PAGE 93]\n\n# 3. “黑洞”问题\n\nD’haeseleer 的分析[141]表明，采用 \\(r\\) 位连续匹配规则的检测器，并不能完全覆盖非自体空间，如果自体集\
    \ \\(S\\) 包含两个有连续 \\(r-1\\) 位相同的字符串 \\(s_1\\) 和 \\(s_2\\)，则存在两个“黑洞”字符串 \\(h_1\\\
    ) 和 \\(h_2\\)，任何匹配 \\(h_1\\) 和 \\(h_2\\) 的候选检测器必然也匹配 \\(s_1\\) 和 \\(s_2\\)，如下所示：\n\
    \n```\ns_1 : a_1 \\cdots a_k b_{k+1} \\cdots b_{k+r-1} c_{k+r} \\cdots c_l\ns_2\
    \ : a'_1 \\cdots a'_k b_{k+1} \\cdots b_{k+r-1} c'_{k+r} \\cdots c'_l\n      \\\
    Downarrow\nh_1 : a_1 \\cdots a_k b_{k+1} \\cdots b_{k+r-1} c'_{k+r} \\cdots c'_l\n\
    h_2 : a'_1 \\cdots a'_k b_{k+1} \\cdots b_{k+r-1} c_{k+r} \\cdots c_l\n```\n\n\
    同样的方法表明，采用海明 Hamming 距离匹配规则的检测器也存在“黑洞”，“黑洞”的存在将会降低系统检测率。\n\n# 4. 匹配阈值的确定\n\n从检测性能和检测效率方面考虑，检测器生成的目标是要以尽量小的检测器库覆盖尽量大的非自体空间，也就是检测数量\
    \ \\(N_R\\) 和 \\(P_f\\) 尽量小。而这两者都与匹配阈值 \\(r\\) 有关，并且两个目标是相互矛盾的。\n\n首先来看 \\(N_R\\\
    )，其与 \\(P_M\\) 和 \\(P_f\\) 的关系如式 (7-3) 所示。\n\n```\nN_R = \\frac{\\ln P_f}{\\ln(1\
    \ - P_M)} \\qquad (7-3)\n```\n\n假设固定 \\(P_f\\) 不变，则 \\(N_R\\) 随着 \\(P_M\\) 的增加而增加，根据式\
    \ (7-2)，\\(P_M\\) 随着 \\(r\\) 的增加呈指数递减，因此，\\(N_R\\) 将随着 \\(r\\) 的减小而显著增加。\n\n对于\
    \ \\(P_f\\) 而言，主要与“黑洞”的数量 \\(N_H\\) 有关，\\(N_H\\) 越大，\\(P_f\\) 越大。根据 D’haeseleer\
    \ 的分析[141]，“黑洞”与自体的分布和匹配阈值 \\(r\\) 有关，如果 \\(r\\) 越大，自体集中两个字符串有 \\(r-1\\) 位相同的概率就越小，存在“黑洞”的可能性也越小，当\
    \ \\(r=l\\) 时，“黑洞”消失。\n\n因此，\\(r\\) 的选择是很困难的，\\(r\\) 太小将导致 \\(N_R\\) 增加，检测效率降低；\\\
    (r\\) 太大，“黑洞”数量增大，\\(P_f\\) 上升，检测性能下降，特别是在自体分布情况不明了的情况下，很难确定 \\(r\\) 为多少才能使“黑洞”数量降至一个可接受的水平。事实上，选择不恰当的\
    \ \\(r\\) 根本无法产生出符合期望漏检率 \\(P_f\\) 的检测器库。\n\n# 7.2.3 几种改进的阴性选择算法\n\n一些改进的 NSA\
    \ 算法针对上述部分问题进行了研究，具有代表意义的有线性算法[55]、贪婪算法[55]、带变异的阴性选择算法[23] 和匹配阈值可变阴性选择"
