  - '[PAGE 11]


    # 第 1 章 绪论


    # 1.1 人工免疫系统的研究进展


    近年来，生物系统已成为人们创新的灵感源泉，人们不断从生物现象及生物系统中获得灵感，并创立了许多不同的仿生计算方法，如人工神经网络（artificial neural
    network，ANN）[1]、进化算法、遗传算法（genetic algorithm，GA）[2]、蚁群系统（ant system）[3]等。这些方法的基本仿生原理分别是大脑神经系统、自然进化过程和社会性昆虫的社会活动。它们的研究对智能计算、数据挖掘、模式识别的发展，以及其他诸多领域中问题的研究起到巨大的推动作用。


    免疫系统与神经系统、遗传系统和内分泌系统一样同属于生物系统中的信息处理系统，同时也是一个复杂自适应系统，它旨在区分外部有害抗原和自身组织，从而清除病原并保持机体的稳定[4~6]。Rowe
    认为，人体免疫系统的功能有几分像“第二个大脑”，它可储存过去经历的记忆，同时能对新的、异常的物质（抗原）作出响应[7]。从计算的角度来看，免疫系统因其强大的信息处理能力而成为广受关注的研究课题，特别是免疫系统是一个高度并行、分布、自适应和自组织的系统，具有很强的学习、识别、记忆和特征提取能力，能完成许多复杂的计算[8,9]。人们希望从免疫系统的运行机制和计算能力中获取灵感，从而开发面向应用的人工免疫系统和算法，以用于解决工程实际问题。


    1973 年，美国诺贝尔奖获得者 Jerne 提出了人工免疫系统的网络假说，开创了独特型网络理论，给出了人工免疫网络的数学框架[10,11]。后来 Perelson
    对此作了进一步阐述[12]。1986 年，Farmer 等基于人工免疫网络的假说，构造了一个基于人工免疫系统的动态模型，并与 Holland 的分类器系统进行比较，提出了一些有价值的学习算法的构造思想[13]。1990
    年，Varela 讨论了免疫网络以某种方式收敛及免疫系统能够产生不同的抗体和变异以适应新的环境的思想，为免疫系统成为有效地解决工程问题的灵感源泉做出了巨大贡献[14]。他们的研究工作具有重要意义，为建立有效的基于免疫原理的计算系统和智能系统开辟了道路。随后的研究者不断从免疫系统中抽取隐喻（metaphor）机制，用于基于免疫原理的模型设计、算法实现和工程应用[15]。由此诞生了一个崭新的研究领域——人工免疫系统（artificial
    immune system，AIS）。


    AIS 从字面理解可以包含两层含义[16]：一层是医学研究人员利用计算机技'
  - '[PAGE 12]


    术、数学等方法和手段建立了 AIS 模型，其目的是为了更好地研究免疫系统本身的机理；另一层是工程技术的含义，主要用于解决实际工程中存在的问题。目前关于 AIS，有几种不同的定义。Star-labl
    的定义为：“AIS 是一种数据处理、归类、表示和推理策略，该模型依据一种似是而非的生物范式”[17]。Dasgupta 等给出的定义为：“AIS 由免疫系统启发而来的智能策略所组成，主要用于信息处理和问题求解”[18]。Timmis
    给出的定义为：“AIS 是一种由理论生物学启发而来的计算范式，它借鉴了一些免疫系统的功能、原理和模型并用于复杂问题的解决”[19]。莫宏伟给出的定义为：“AIS
    就是研究借鉴、利用免疫系统（主要是人类免疫系统）各种原理和机制而发展的各类信息处理技术、计算技术及其在工程和科学中应用而产生的各种智能系统的统称”[16,20]。Star-labl
    仅从数据处理的角度对 AIS 进行了定义，而 Dasgupta、Timmis 和莫宏伟则着眼于生物隐喻机制的应用，强调了 AIS 的免疫学机理和应用，因而后三者更为贴切。


    目前，AIS 已成为许多国际期刊的重要议题。从 1997 年开始，每年有一个或两个 AIS 的专题，IEEE System, Man and Cybernetics
    国际会议每年均组织专门的 AIS 研讨会(workshop)[21]，其他国际会议如 GECCO(Genetic and Evolutionary Computation
    Conference)、CEC(Congress on Evolutionary Computation)等也将 AIS 作为主题之一[11,22~24]，1997
    年和 1998 年，IEEE Systems, Man and Cyemetics 国际会议还组织了专题讨论。第一届 AIS 国际学术会议 ICARIS(1st
    International Conference on Artificial Immune Systems)于 2002 年 9 月在英国 Kent 大学召开[25]。IEEE
    Transaction on Evolutionary Computation 在 2001 年和 2002 年还相继出版了 AIS 专辑。在国内，2000
    年、2001 年，中国科学技术大学在合肥召开了关于免疫专题的国际会议，引起了国内外的关注。作为计算智能的一个崭新分支，AIS 的研究掀起了继智能系统中神经网络、模糊系统和进化计算等研究之后的又一个热点，其研究结果已涉及信息安全[15,26]、模式识别[27]、智能优化[28~30]、机器学习[31~33]、数据挖掘[17,33~35]、机器人学[24,36~40]、自动控制[41]、故障诊断[25,42,43]等诸多领域，显示出
    AIS 强大的信息处理和问题求解能力及广阔的研究前景。


    # 1.2 人工免疫系统模型的研究进展


    基于免疫机理开发的人工免疫系统主要有人工免疫网络模型、人工免疫系统模型两类，其实现算法主要有克隆选择算法、阴性选择算法、免疫学习算法等[18,44,45]。下面对几种典型的人工免疫系统与算法的研究情况进行介绍。


    # 1.2.1 人工免疫系统模型


    Jerne 于 1973 年提出[10,11]独特型免疫网络模型后，许多研究人员相继提出多'
  - '[PAGE 13]


    种免疫网络学说，它们都可借鉴用于建立人工免疫网络模型。人工免疫网络模型将人工免疫系统视为一个由节点(淋巴细胞)组成的网络结构，通过节点之间的信息传递和相互作用实现识别、效应、记忆等免疫系统功能。目前，人工免疫网络模型主要有
    Jerne 提出的独特型网络模型[11]、Ishiguro 提出的互联耦合网络模型[24]、de Castro 提出的抗体网络模型[46]、Tang 等提出的多值网络模型[47]
    等。Forrest 基于免疫网络的学习和自适应原理提出了人工免疫系统模型——免疫联想记忆模型，用于模式识别[48]。Kim 提出免疫系统的二进制模型用来描述
    B 细胞群体的进化行为，并对其动态行为进行了研究[15]。Tarakany 基于免疫系统中抗体和抗原的相互作用原理建立了人工免疫系统的数学模型。Zak 模拟免疫系统的功能提出了免疫系统的随机模型，这种模型具有自己非己识别、自修复等功能，为信息处理和计算提供了一种方法[22]。


    # 1.2.2 人工免疫算法


    +   1. 阴性选择算法


    T 细胞在免疫系统中的胸腺中发育，与自身蛋白质发生反应的未成熟的 T 细胞被破坏掉，所以成熟的 T 细胞具有忍耐自身的性质。不与自身蛋白质发生反应，只与外来蛋白质发生反应，以此来识别自己与非己，这就是免疫系统中的阴性选择原理[12]。1994
    年，Forrest 等基于阴性选择原理提出了阴性选择算法用来进行异常检测[44]，该算法主要包括两个步骤：首先，产生一个检测器集合，其中每一个检测器与被保护的数据不匹配；其次，不断地将集合中的每一个检测器与被保护数据相比较，如果检测器与被保护数据相匹配，则判断数据发生了变化。该算法并没有直接利用自我信息，而是由自我集合通过阴性选择生成检测子集，具备并行性、健壮性和分布式检测等特点。其缺点是当被保护的数据变长时，集合中检测器的数量按指数率增加，产生检测器的代价过大。针对这一缺点，Perelson
    提出了一种更有效的检测器产生算法，使得集合中检测器的数量随着数据的长度按线性增长[12]。随后，Perelson 对阴性选择算法进行了理论分析[12]。目前阴性选择算法广泛应用于模式识别、病毒检测、网络入侵检测、异常检测等[16,
    25, 49]领域。


    +   2. 克隆选择算法


    de Castro 基于免疫系统的克隆选择理论提出了克隆选择算法[33]。其计算步骤为：① 产生一个初始群体；② 根据个体评价值，选出一部分最好个体；③ 被选出的每一个个体克隆出若干个体，并使其发生变异，从而形成下一代群体；④
    从群体选出一些最好个体加入记忆集合，并用记忆集合中的一些个体替换群体中的的一些个体；⑤ 用随机产生的个体替换群体中一部分个体；⑥ 返回步骤②循环计算，直到'
  - '[PAGE 14]


    满足结束条件。de Castro 进一步将免疫网络理论和克隆选择算法相结合，提出了人工免疫网络学习算法，将其用于知识发现、数据挖掘、自动分类，并对该算法的参数灵敏度特性进行了分析[35]。目前克隆选择算法广泛应用于模式识别、数据聚类、异常检测等[24,35~38,50]领域。


    # 3. 免疫学习算法


    Farmer 等对免疫系统的学习特性进行了探索性研究，指出其与 Holland 的分类器系统具有相似性[13]。随后 Hunt 等基于免疫网络理论给出了一种有监督的机器学习算法[32]。Ishida
    提出了一种基于 PDP 模型的免疫学习算法[43]，并将其应用到故障诊断中。Timmis 等研究了基于人工免疫系统的无监督学习策略，建立了一个机器学习模型
    RLAIS[17]，该模型通过构造网络从所学数据中发现复杂的相互关系。较之于神经网络，人工免疫系统在学习对象的表达方面有了很大的进步，而且网络规模可以控制。免疫学习算法在数据分析和知识发现等方面具有潜在应用价值[17]。


    # 4. 混合免疫算法


    Chun 等提出了一种免疫算法[28]，该算法吸收了 GA 的搜索策略，借用了 GA 的选择、交叉和变异算子，实质上是一种改进的遗传算法。王磊基于免疫系统的概念和理论提出了一种免疫规划算法[22]。该算法在遗传算法中加入免疫算子，防止群体退化，以提高算法的收敛速度。免疫算子包括接种疫苗和免疫选择两个部分，前者是为了提高适应度，后者是为了防止种群退化。混合免疫算法目前尚无统一框架，但已经在求解诸如组合优化等问题中显示了强大的优化搜索能力[21]。


    # 1.3 人工免疫系统的应用现状


    目前 AIS 在信息安全[51~53]、智能优化[47,54]、机器学习[55,56]、故障诊断[57]、控制工程[58]、噪声控制[59]、联想记忆[60]、决策支持系统[17,61]等领域取得了非常广泛的应用，显示出
    AIS 强大的生命力。基于本书的研究内容，下面仅对 AIS 在数据挖掘、模式识别、智能优化等领域的应用现状作简单介绍。


    # 1. 数据挖掘


    利用 AIS 模型进行数据挖掘目前主要集中在数据聚类分析、数据浓缩、归类任务等方面[12,13,15,62,63]。例如，Hunt 等研究了基于 AIS 模型的无监督学习算法，将其应用到
    DNA 序列的分类任务中[31]。Bezerra 等对免疫网络聚类算法的搜索性能作了改善，并将该算法与最小宽度树法结合，提出了改进后的集成算法，该算'
  - '[PAGE 15]


    法已被应用于生物信息学数据的压缩[64]。在将 AIS 与聚类分析、科赫网络进行对比分析后，Timmis 指出，AIS 在数据分析中的应用是可行且有效的[19]。他构造了一种与领域无关的无监督机器学习方法用于实验数据的聚类分析，并进一步给出了用于数据分析的有限资源
    AIS 模型 RLAIS[34]，该模型在多谱影像的深入数据分析和网络故障预测中得到了应用。Takama 等将柔性聚类算法、独特型免疫网络动力学模型及免疫记忆细胞功能相结合，设计了一种用于计算机网络中主题检索及文件恢复的免疫网络模型[65]。de
    Castro 研究了基于免疫网络模型 AiNet 的高维原始数据的聚类分析，通过人工免疫网络的进化实现对冗余数据的去除，深入研究了数据的结构表示和空间分布，并进一步对数据簇内的相互关系进行了很好的揭示[46]。


    # 2. 模式识别


    免疫系统强大的识别能力在模式识别方面得到了广泛的应用。Forrest 等首先对免疫系统的群体多样性产生机制进行了深入研究，获得了抗体与抗原模式匹配的较深认识，进而产生了群体多样性评价方案并与遗传算法结合获得免疫遗传算法[66,67]。之后，也有学者对免疫系统的多样性机制进行了研究[68]。例如，Gaspar
    等分析了免疫系统的再次应答对抗原处理的重要程度，提出模式跟踪算法，其作用在于动态清除连续不断出现的抗原，可用于计算机网络病毒检测[67]。Hunt 及 Cooke
    在免疫网络模型应用于模式识别中的 DNA 识别方面做了开拓性工作，获得了应用于工程问题的 B 细胞免疫网络算法[31,69]。之后，de Castro 及
    von Zuben 从独特型免疫网络理论出发，建立了一种形态空间免疫网络算法，解决字符识别问题[45,46]。接着，Dasgupta 研究了光谱识别问题，采用二进制对光谱识别的对象进行了具体描述，同时还给出了相应的匹配函数及识别算法[18]。


    # 3. 智能优化


    AIS 在函数优化、组合优化、调度问题等智能优化方面得到应用，并取得了很好的效果[51,70~73]。随着组合优化问题规模的扩大，其问题空间呈现组合爆炸特性，难以用常规优化方法求解。基于免疫原理实现的免疫算法在组合优化求解中显示出了强大的能力，这些问题包括二次分配问题(QAP)[73]、装箱问题[72]等。例如，Carlos
    等分别将克隆选择算法及免疫遗传算法加以扩充[74,75]，获得针对车间调度的优化算法，这两种算法的主要特点在于抗体形成功能、记忆细胞功能、抗体及抗原评价策略的设计。在大多数情况下，免疫算法取得了比现有启发式算法更好的求解结果，尤其在求解的效率方面，显示出
    AIS 在智能优化领域具有广阔的应用前景。另外，基于免疫学原理开发的处理多目标优化的智能方法也相继出现[71,76~79]。Carlos 等从克隆选择原理出发提出一种多目标免疫系统算法[71,76]，该'
  - '[PAGE 16]


    算法的特点是体现了 Pareto 概念、并行处理思想及记忆细胞功能。


    # 4. 计算机安全


    新墨西哥大学的 Forrest 和她的小组正在从事一个长期的研究项目，其目标在于建立一个计算机人工免疫系统。基于免疫的系统与目前的操作系统相比提供了更复杂的身份与保护的概念，并且此系统还将提供一个一般目标的保护体系，以扩大当前的计算机安全系统。计算机的安全性取决于这样一些行为：检测出计算机设备的未被授权使用，维持数据文件的整体性和阻止计算机病毒的传播[44,52,80]。


    保护计算机免受有害病毒袭击的问题，被认为是在区分自我(合法的使用者、未被损坏的数据等)与危险异物(未被授权的使用者、病毒和其他不良因素)中更一般的问题。他们试图把这个方法作为在计算机安全上更传统的加密和确定性方法的补充。作为第一步，阴性选择算法(1.2
    节所讨论的)已作为计算机病毒检测问题上的一个文件鉴定方法得到了应用。


    # 1) 病毒检测


    在此应用中，Forrest 等使用阴性选择算法来检测被保护的数据与程序文档中的变化[44,52]。用不同的病毒(包括文件病毒和引导扇区病毒样本)在 DOS
    环境下进行了许多实验。报告的结果表明，这个方法能容易地检测出由于病毒感染发生在数据文件中的变化。与其他的病毒检测方法相比，该算法有几点优于现有的变化检测方法：它是概率性的和可调的(检测的概率可根据
    CPU 时间而选择)，它可以是分布式的(以较低的个体花费提供大系统的高度可靠性)，并且它能检测先前未曾辨别过的新病毒。


    然而，因为计算机系统中储存的信息本质上是不稳定的，所以，在计算机系统中，与自然免疫系统相比，自我的定义具有更大的动态性。例如，计算机使用者日常安装最新的软件系统、编辑文档或者运行新的程序。因此，这种检测的使用似乎是有限的——只能保护静态的数据文件或软件。


    # 2) UNIX 进程监控


    作为一个计算机安全方面正在进行的研究，Forrest 等研究了提出的阴性选择算法，用它来监控 UNIX 进程，监控的目的在于检测计算机系统中的有害侵扰。执行的目的是要为
    UNIX 进程确认一种自我感觉，他们重定义了自我以适应动态的计算机环境中的合法行为，因而这个定义对恶意的攻击很敏感[52]。


    此研究基于如下猜想：系统调用的根进程在本质上比使用者进程所引起的损坏更危险。而且根进程的行为范围有限，并且它们的行为随时间具有相对稳定性。正常或自我是在进程的系统调用中由短范围的相关性所定义的。对几个标准的
    UNIX 程序而言，这一自我的定义在其正常行为时似乎是稳定的。而且，它能够检测出关于发送邮件的几个共同的侵扰。对发送邮件进行监控的原因是其行为是充'
  - '[PAGE 17]


    分变化和复杂的，以致能提供一个好的初步的测试，并且对用于测试的发送邮件有几个备有证明文件的攻击。实验产生了不同于通常发送邮件的三种类型的运行轨迹：成功发送邮件攻击的轨迹、发送邮件侵扰的尝试（尝试是失败的）的轨迹和错误条件的轨迹。这些实验能执行并跟踪两个攻击。


    这些实验[52]表明，短序列的系统调用能产生一个稳定的信号，它能检测在发送邮件中反常行为的一些共同的资源。因为目前的方法容易计算且在存储需求上相对适度，所以将其实现作为一个在线系统是可行的，在此系统中，内核会检查根进程产生的每一个系统调用。在这种方案下，每一个位置将产生它自己正常的数据库，这要基于局部的软件/硬件构造和使用模式。应用局部的使用模式的一个优势在于，每个位置将有自己独特的识别性，与其他每一个位置有微小的不同。这将意味着，在一个站点成功的侵扰不一定在所有的运行同样软件的站点都是成功的，并且至少有一个站点注意到攻击的机会会增加。这种方案是很有希望的，并且为计算机安全的研究开辟了新的道路。


    # 3) 病毒检测的另一种方法


    Kephart 为病毒检测提出[25]了一种不同的免疫激励方法（基于 instruction 指令假设）。在该方法中，已知的病毒通过它们的计算机代码序列（信号）被检测出，未知的病毒因它们在计算机系统中的异常行为而被检测出来。病毒检测系统不断地扫描一个计算机软件，看是否有病毒感染的典型信号。这些信号触发释放诱饵程序，此程序唯一的作用是被病毒感染。


    特别地，一系列不同的诱饵程序被置于内存中不同的关键区域（如主目录），以捕获病毒样本。诱饵被设计得具有尽可能大的吸引力，去诱捕那些成功传播的病毒。每个诱饵程序不时地受到检测，看是否已被修改。如果一个或者多个诱饵程序已被修改，则几乎可以肯定系统中存在自由的未知病毒；并且每个被修改的病毒诱饵包含有那个病毒的样本。特别要指出的是，被感染的诱饵被特征提取器所处理，从而发展为病毒的识别程序。特征提取器也从被感染的诱饵提取有关病毒如何粘附到主体程序（病毒的粘附模式）上的信息，从而被感染的主体能被修复。特征提取器必须选择一种病毒特征（从由粘附来源步骤产生的字节序列中），以致在使用时它能避免假阴性和假阳性。换句话说，特征必须出现在每个病毒实例中，而一定不能出现在未受感染的程序中。一旦从待选的病毒特征中选出最有可能的特征，它需要针对一个
    5 亿字节容量的合法程序运行，以确保它不会引起假阳性。通过测试病毒样本，可检查出修补信息，并且人类专家可以更进一步地对其进行检查。


    最后，此特征与修补程序储存于反病毒数据库文档中，并且新的版本需要分配给用户。Kephart 认为，该方法也将用于阻止网络计算机中病毒的传播，在网络计算机中，被感染的机器发出“杀毒信号”以告诉其他计算机当心猖獗的病毒，此信号'
