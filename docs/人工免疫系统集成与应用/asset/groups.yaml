    \n## 5.5 本章小结\n\nAiNet 算法对抑制阈值 ts 非常敏感。针对不同的问题，如何合理地调整抑制阈值的大小，以获得较好的分类结果，目前没有统一的理论依据，只能根据用户的经验或反复进行模型运算，因此\
    \ AiNet 算法的最终聚类结果受人为主观因素影响较大。为克服这一缺点，本章的 VD-AiNet 算法采用基于矢量距离的抗体选择和抑制机制对 AiNet\
    \ 模型进行改进。仿真实验表明，VD-AiNet 算法可以限制浓度高的抗体，增强群体的多样性，从而减弱抑制阈值对该模型的影响，提高算法的全局寻优性能和收敛速度，减少人为主观因素的影响。\n\
    \n## 第 6 章 目标进化免疫网络聚类算法\n\n### 6.1 引言\n\nAiNet 算法除了第 5 章所述的对抑制参数敏感的问题外，另外一个影响算法质量的问题是，AiNet\
    \ 没有定义适当的目标函数，依靠抗原-抗体亲和力进行类梯度局部搜索，会导致记忆网络动态无规律变化，不能保证收敛到最优解，甚至在进化过程中会出现退化现象。本章就该问题进行研究，基于矢量数据压缩的评价定义\
    \ AiNet 进化的整体目标，提出基于目标进化的免疫网络聚类算法(objective evolution artificial network, OE-AiNet)，保证算法朝着最优的方向进化，从而获得压缩质量更好的记忆网络，同时参数\
    \ σs 的敏感性也有所缓解。\n\n### 6.2 基于目标进化的 AiNet 算法\n\n### 6.2.1 进化目标定义\n\n免疫压缩的最终目的是获取一个反映样本空间影像的记忆网络，其实质是一个数据压缩的过程。本章参考矢量数据压缩的质量评价标准[136]来建立记忆网络的整体目标与约束。\n\
    \n定义 6-1 抗原-抗体识别。对于一个给定的抗原 x 和一个记忆网络 M = {a1, a2, ..., ak}，其中，ai 与 x 的距离(用 ||\
    \ x - ai || 表示)最近，即 || x - ai || ≡ min{ || x - a1 ||, || x - a2 ||, ..., || x\
    \ - ak || }，并且 || x - ai || < σs，则称抗原 x 被抗体 ai 的识别，|| x - ai || 称为抗原 x 与抗体 ai\
    \ 的识别距离，也称为 M 对 x 的识别距离，记为 DI(x, M)。如果抗原 x 被记忆网络 M 中的任意一个抗体识别，则称抗原 x 被记忆网络 M 识别，否则称抗原\
    \ x 不被记忆网络 M 识别。\n\n定义 6-2 识别率。对于一个给定的抗原集 X = {x1, x2, ..., xn} 和一个记忆网络 M = {a1,\
    \ a2, ..., ak}，抗原集 X 中被记忆网络 M 识别的数量为 ni，则 M 对 X 的识别率 pi 如式(6-1)所示  \npi(X, M)\
    \ = (ni/n) × 100%  \n(6-1)\n\n定义 6-3 压缩率。对于一个给定的抗原集 X = {x1, x2, ..., xn}，经过免疫压缩后生成记忆网络\
    \ M = {a1, a2, ..., ak}，则 M 对 X 的压缩率 pr 如式(6-2)所示\n"
