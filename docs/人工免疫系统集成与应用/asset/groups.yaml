    \n### (2) 图形数字化。\n\n资料收集过程中获得的图形数据全部为各种纸质地图，经过图形预处理、扫描与纠正、屏幕数字化、图形编辑，并建立拓扑关系后，得到数字化的图形数据。高要市农用地分等工作的这些数据包括高要市行政区划图、道路交通图、地形图、土地利用现状图、土壤图、土壤有机质含量图和土壤酸碱度图。\n\
    \n地图数字化的方法有手扶跟踪数字化和扫描矢量化两种，扫描矢量化又可以是全自动的、半自动的和手工的。高要市农用地分等采用 Geoway 软件进行图件扫描及纠正，采用半自动的方法，应用\
    \ R2V、Geoway、AutoCAD 等软件进行矢量化，在 ArcGIS 下完成编辑并建立拓扑关系。其基本过程如下。\n\n- ① 图形预处理。\n\n\
    图形预处理是为了简化数字化工作而按设计要求进行的图层要素整理与筛选过程。预处理的工作内容按照一定的数字化方法来确定，也是数字化工作中必不可少的前期准备工作。高要市农用地分等数据库的图形预处理主要包括部分图件的清丝，以及在高要市国土资源局和农业局相关人员的配合下对原始图件上的错误进行修改。\n\
    \n- ② 图件扫描与纠正。\n\n地图扫描时，根据纸张的质量、线条的清晰度和图斑的颜色来确定扫描精度，一般为 300～500dpi。高要市农用地分等基础图件扫描采用超\
    \ A0 扫描仪和 Geoway 软件，根据具体情况设置好参数，由于高要市土地利用现状原图是单色图，图斑细碎而且复杂，所以采用的是 350dpi 灰度扫描；而土壤图是彩色纸图，图斑较大，但图纸陈旧，采用\
    \ 400dpi 彩色扫描，对于数字化工作来说容易辨清图斑界限，以保证工作的精度。\n\n经过扫描后的图纸有一定的旋转和扭曲，在扫描过后需要进行一定的纠正才能够进行数字化工作，高要市农用地分等图件采用\
    \ Geoway 软件，运用特定的数学公式进行纠正。\n\n- ③ 屏幕数字化。\n\n地图的屏幕数字化也就是将栅格图像文件转为矢量形式，许多 GIS 和制图软件提供了这样的功能，可以实现全自动、半自动或手工的矢量化操作。高要市农用地分等基础图件的矢量化主要在\
    \ R2V 的软件的支持下完成。R2V 具有自动矢量化的功能，但是扫描地图中包括多种信息，系统难以自动识别分辨。例如，高要市的土地利用现状图有等高线、河流、居民点及其他各种线状地物，尽管不同的地物有不同的线形和不同的界线，但对于计算机系统而言仍难以对它们进行自动区分，这使全自动矢量化结果很不准确，所以我们采用的是半自动矢量化。将高要市域范围内同一主题的不同类型的地理要素组织成不同的图层，如道路、水系、居民点图层，分别进行矢量化，然后输出成\
    \ SHP 文件。\n\n- ④ 图形编辑、修改与拓扑关系建立。\n\n将在 R2V 下输出的 SHP 文件在 ArcGIS 环境下转换成 coverage\
    \ 格式，并建立拓扑关系，检查错误，修改错误，重建拓扑关系。\n\n- ⑤ 转换坐标。\n\n由于分等所用的行政区划、地形、土壤和土地利用现状等图件的来源各不相同，原始坐标体系不尽一致，图形编辑完成之后，需纳入统一的坐标体系，为此，需要进行坐标转换，转换的方法是在原图中找\
    \ 4～6 个配准点，根据其投影体系计算统一的坐标值，在 ArcGIS 中完成坐标转换。\n\n### (3) 属性数据录入。\n\nArcGIS 等地理信息系统软件均自带属性数据库模块，但操作不大方便，为了提高工作效率，高要市农用地分等运用数据库软件进行属性数据的录入、处理与分析运算。采用图形数据的用户码作为公用字段，通过地理信息系统软件的数据转换功能，实现属性数据在不同环境下的灵活转换和链接。\n\
    \n将图层的 INFO 属性文件导出为 dbf 格式文件，在 Oracle 的支持下，通过共用字段(用户码)的联系，采用键盘输入的方法录入属性数据。\n\n\
    从收集到的现有资料中提取的数据和补充调查获得的数据也采用键盘输入的方法在 Foxpro 中录入，其中与图形数据有关的属性数据需建立一个与图形文件属性表中用户码——对应的公用字段。完成输入后再进行检查纠错，直至全部数据完整准确为止。\n\
    \n### (4) 图形与属性数据链接。\n\n图形与属性数据链接在 ArcGIS 软件的支持下，采用链接(join)或关联(relate)的方式实现。\n\
    \n## 3. 分等因素指标区划分\n\n分等因素指标区是计算农用地自然质量分的推荐分等因素指标和自选分等因素指标所构成的评价指标体系的适用区。根据高要市农用地自然条件的总体情况，将高要市划分为两个农用地分等因素指标区：坡耕地评价因素体系指标区和平原耕地评价因素体系指标区。\n\
    \n## 4. 分等指标体系的确定\n\n按照广东省农用土地分等的技术方案，确定高要市的坡耕地评价因素体系指标区和平原耕地评价因素体系指标区的农用地分等评价因素及其权重，分别见表\
    \ 9-2 和表 9-3。\n\n| 参评因素 | 坡度 | 岩石露头度 | 土层厚度 | 表层质地 | 有机质含量 | pH | 灌溉保证率 |\n|---|---|---|---|---|---|---|---|\n\
    | 权重 | 0.26 | 0.09 | 0.21 | 0.08 | 0.14 | 0.1 | 0.12 |\n\n表 9-2 坡耕地评价因素及权重\n\n\
    | 参评因素 | 距障碍层深度 | 剖面构型 | 表层质地 | 有机质含量 | pH | 灌溉保证率 | 土壤排水 | 地下水位 |\n|---|---|---|---|---|---|---|---|---|\n\
    | 权重 | 0.05 | 0.14 | 0.14 | 0.09 | 0.10 | 0.25 | 0.18 | 0.05 |\n\n表 9-3 平原耕地评价因素及权重\n\
    \n## 5. 分等评价单元的划分\n\n农用地分等评价单元的划分遵循以下原则：①单元内土地质量相对均一；②主导因素差异原则；③相似性原则；④边界完整性原则。\n\
    \n根据《农用地分等规程》和《广东省农用地分等技术方案》的要求，以 GIS 技术为手段，应用 ArcGIS 软件，对高要市行政区划图（行政界线到村界）、土地利用现状图和高要市土壤图进行叠置分析，对生成图层按照以上划分原则进行处理，主要是在不打破村界的前提下，将小于单元最小面积（0.6hm²）的图斑与相邻的多边形合并，并重建拓扑关系。经叠置分析，获得了高要市农用地分等的评价单元图，将高要市农用地划分为\
    \ 3623 个分等评价单元。\n\n## 6. 分等评价因素属性值的获取\n\n地面坡度的数据通过建立 DTM，从地形数据中提取坡度图；岩石露头度主要是从高要市第二次土壤普查报告中获得部分信息，结合土壤地理专家和当地农技人员的经验获得，并在土壤图上赋上属性值；土层厚度、表层土壤质地、剖面构型、距障碍层深度、地下水位等评价指标的数据从高要市第二次土壤普查报告中查得，并在高要市土壤图上赋予相应的属性值；土壤有机质含量和土壤\
    \ pH 数据则通过数字化高要市土壤有机质含量图和土壤酸碱度图获得；地下水位灌溉保证率及土壤排水等评价指标数据根据全国第二次土壤普查资料、高要市土地利用现状图及当地水利资料等获得。将带有分等评价因素属性值的图层与分等单元图进行叠置分析，即可获得高要市各评价单元的分等评价因素属性值。\n\
    \n## 9.4.2 基于免疫 DEA 的农用地指数评价\n\n### 1. 农用地自然等指数研究\n\n经过叠置分析，获得了高要市农用地分等的评价单元图，将高要市农用地划分为\
    \ 3623 个分等评价单元。根据农用地分等规程，需要对高要市 3623 个分等评价单元进行自然质量分等。由于高要市分等评价单元较多，如果直接采用 DEA\
    \ 模型进行自然质量等指数计算，一方面计算量比较大；另一方面，在高要市 3623 个分等评价单元中有许多单元属性几乎相同，可以归为同一类。因此，如果利用 AIS\
    \ 聚类模型对分等评价单元进行聚类，把具有较高相似度的分等单元归为同一类，就可以只计算类中某一个单元的自然质量等指数，用其代表这个类中所有单元的自然质量等指数，从而减少了大量复杂的计算。因此，本章首先对高要市\
    \ 3623 个分等评价单元进行聚类，形成农用地自然质量分等单元，并在每一类中分别选取 2 或 3 个分等单元，然后采用 DEA 模型对分等单元进行投入/产出评价，以对分等单元指数进行修正。\n\
    \n按照广东省农用土地分等的技术方案，确定高要市的分等因素指标区的农用地分等评价因素，分指定作物、分指标区逐一对照《广东省农用地分等规程》，参照“水稻-分等因素指标值-农用地质量分”、“甘薯-分等因素指标值-农用地质量分”和“玉米-分等因素指标值-农用地质量分”关系表(附表\
    \ 9～附表 11)，将分等因素属性值把空间指标量化。在 ArcGIS 的支持下，采用 AIS 聚类模型对高要市 3623 个分等评价单元进行聚类。其基本步骤如下：\n\
    \n- (1) 分等因素指标值初始化。由于分等因素指标的类型与量纲各不相同，故必须对原始指标值作归一化处理。\n\n- (2) 初始种群的产生及编码。在高要市农用地评价单元集合中随机选取\
    \ 100 组对象，并根据高要市农用地的分等要求将其划分为 13 个等级，按此要求确定每组 13 个点，代表着农用地分等单元的 13 个中心。将每一组对象编码为一个\
    \ \\( 13 \\times 7 \\) 位的个体 c，随机选取的 100 组对象构成了初始种群 \\( C_0 \\)。即对搜索空间进行 \\( 13\
    \ \\times 7 \\) 位的编码，则 100 为初始群体的规模。\n\n- (3) 计算适应度。当前群体中的每一个个体 c，都对应着 13 个中心。按照高要市农用地的分等要求将集合分为\
    \ 13 簇，对于第 i 簇 \\( C_i \\)，根据式(9-8)和式(9-9)计算各个个体的类内距离 \\( S_w \\) 和类间距离 \\( S_b\
    \ \\)。\n\n高要市农用地分等的适应度函数定义为\n\\( f = |S_w^{-1}S_B| \\) (9-22)\n\n在计算完一个个体的适应度之后，用所产生的\
    \ 13 个均值 \\( \\{z_i \\mid i=1,2,\\cdots,13\\} \\) 构成新的个体，并以此代替当前的个体 c。然后，判断停机条件。若条件满足，则停止运行并输出结果；否则，继续。\n\
    \n- (4) 计算每个个体的期望繁殖率。\n\n- (5) 选择。\n\n- (6) 变异,得到种群 \\( C_k \\)。\n\n- (7) 转向步骤(3)。\n\
    \n根据指定作物水稻、甘薯和玉米分别对高要市农用地 3623 个分等单元的集合进行了聚类。\n\n根据指定作物的聚类结果，计算高要市农用地自然质量等级。首先采用如下公式计算农用地自然质量等指数：\n\
    \n$$R_{ij} = a_j \\times CL_{ij} \\times \\beta_j$$  \n(9-23)  \n\n$$R_i = \\\
    sum R_{ij}$$  \n(9-24)\n\n式中，$R_{ij}$ 为第 $i$ 个分等单元第 $j$ 种指定作物的自然质量等指数；$R_i$ 为第\
    \ $i$ 个分等单元的农用地自然质量等指数；$a_j$ 为第 $j$ 种作物的光温生产潜力指数；$CL_{ij}$ 为第 $i$ 个分等单元内种植第 $j$\
    \ 种指定作物的聚类结果；$\\beta_j$ 为第 $j$ 种作物的产量比系数。  \n高要市的光温生产潜力指数（$a_j$）和产量比系数（$\\beta_j$）见表\
    \ 9-4。\n\n表 9-4 高要市光温(气候)生产潜力指数及产量比系数表\n\n| 指标 | 早稻 | 晚稻 | 玉米 | 甘薯 |\n|---|---|---|---|---|\n\
    | 产量比系数 | 0.969 | 1 | 0.564 | 0.3 |\n| 生产潜力指数 | 1188 | 1817 | 2287 | 2251 |\n\n\
    根据农用地自然质量等指数，采用 AIS 聚类模型计算农用地自然质量等别，结果见附表 12。\n\n### 2. 农用地利用等指数研究\n\n依据农用地自然质量等级，在高要市所有的行政村内按不同产量水平，分层设置一定数量的样点，样点的指定作物单产根据统计资料分析或通过实际测量获得。\
    \  \n样点的第 $j$ 种指定作物单产用 $Y_j$ 表示。利用基于虚拟单元的 DEA 模型计算出样点的指定作物土地利用系数。\n\n### 3. 基于\
    \ DEA 的农用地利用等指标体系的构建\n\n根据高要市农用地的分等因素指标区的农用地分等评价因素的属性和 DEA 模型的要求，对于坡耕地，确定 DEA\
    \ 模型的输入指标为：①坡度；②岩石露头度；③土层厚度；④表层质地；⑤有机质含量；⑥pH；⑦灌溉保证率。输出指标为指定作物单产。对于平原耕地，确定 DEA\
    \ 模型的输入指标为：①距障碍层深度；②剖面构型；③表层质地；④有机质含量；⑤pH；⑥灌溉保证率；⑦土壤排水；⑧地下水位。输出指标为指定作物单产。\n\n\
    ### 4. 基于 DEA 的农用地利用等指数计算\n\n依据农用地自然质量等级，选择以样点为基础的分等单元代表某一个分等集合构成 DMU 单元，利用基于虚拟单元的\
    \ DEA 模型对高要市 13 个农用地自然质量等别的分等评价单元集合进行 DEA 评价，得到每个分等评价单元每一种指定作物相应的综合指数（相对效率指数），即分等单元指定作物的利用等指数\
    \ KLj。\n\n### 5. 农用地利用等划分\n\n农用地第 j 种指定作物的利用等指数按下式计算：\n\n$$Y_{ij} = R_{ij} \\\
    times KL_j$$ (9-25)\n\n农用地利用等指数按下式计算：\n\n$$Y_i = \\sum Y_{ij}$$ (9-26)\n\n式中，$Y_{ij}$\
    \ 为第 $i$ 个分等单元 $j$ 种指定作物的利用等指数；$Y_i$ 为第 $i$ 个分等单元农用地利用等指数；$R_{ij}$ 为第 $i$ 个分等单元内第\
    \ $j$ 种指定作物的自然质量等指数；$KL_j$ 为第 $j$ 种指定作物的土地利用系数。然后采用 AIS 聚类模型对高要市农用地利用等别进行计算，具体分等结果见附表\
    \ 13。\n\n### 6. 农用地等别指数研究\n\n依据农用地利用等别，在所有的行政村内按不同产量水平，分层设置一定数量的样点，样点的指定作物单产、实际成本根据统计资料分析或通过实际测量获得。样点的第\
    \ $j$ 种指定作物单产用 $Y_j$ 表示。利用基于虚拟单元的 DEA 模型计算出样点的指定作物土地等分数。\n\n### 7. 基于 DEA 的农用地等别指标体系的构建\n\
    \n根据高要市农用地的分等因素指标区的农用地分等评价因素的属性和 DEA 模型的要求，对于坡耕地，确定 DEA 模型的输入指标为：①坡度；②岩石露头度；③土层厚度；④表层质地；⑤有机质含量；⑥pH；⑦灌溉保证率；⑧指定作物实际成本。输出指标为指定作物单产。对于平原耕地，确定\
    \ DEA 模型的输入指标为：①距障碍层深度；②剖面构型；③表层质地；④有机质含量；⑤pH；⑥灌溉保证率；⑦土壤排水；⑧地下水位；⑨指定作物实际成本。输出指标为指定作物单产。\n\
    \n### 8. 基于 DEA 的农用地等别指数计算\n\n根据农用地利用等别，选择以样点为基础的分等单元代表某一个分等集合构成 DMU 单元，利用基于虚拟单元的\
    \ DEA 模型对高要市 17 个农用地利用等别的分等评价单元集合进行 DEA 评价，得到每个分等评价单元每一种指定作物相应的综合指数（相对效率指数），即分等单元指定作物的土地经济系数\
    \ $KC_j$。\n\n### 9. 农用地等别划分\n\n第 $j$ 种指定作物的农用地等指数按下式计算：\n\n$$G_{ij} = Y_{ij} \\\
    times KC_j$$\n\n农用地等指数按下式计算：\n\n$$G_i = \\sum G_{ij}$$\n\n式中，\\( G_{ij} \\) 为第\
    \ \\( i \\) 个分等单元第 \\( j \\) 种指定作物的农用地等指数；\\( G_i \\) 为第 \\( i \\) 个分等单元农用地等指数；\\\
    ( Y_{ij} \\) 为第 \\( i \\) 个分等单元内第 \\( j \\) 种指定作物的农用地利用等指数；\\( KC_j \\) 为第 \\\
    ( j \\) 种指定作物的土地经济系数。然后采用 AIS 聚类模型对高要市农用地等别进行计算，具体分等结果见附表 14。\n\n## 9.4.3 农用地分等结果综合分析\n\
    \n高要市农用地分等应用 GIS 软件 ArcGIS、数据库软件、基于 AIS-DEA 的农用地分等模型完成全部计算过程，分等结果表与图形链接，各分等单元的面积通过\
    \ ArcGIS 的面积量算功能自动获取。根据基于 AIS-DEA 的农用地分等的聚类结果，高要市农用地自然质量等共分为 13 个等别，不同自然质量等的农用地面积、分配比例及分布的乡镇见附表\
    \ 12。高要市农用地利用等共分为 17 个等别，不同利用等的农用地面积、分配比例及分布的乡镇见附表 13。高要市农用地等共分为 17 个等别，不同分等等别的农用地面积、分配比例及分布的乡镇见附表\
    \ 14。高要市各乡镇不同等别农用地面积统计结果见附表 15。各地类农用地面积统计结果见附表 16。\n\n将各种结果数据表通过公用字段链接到高要市农用地分等单元图，并转换成\
    \ MapInfo 格式，在 MapInfo 软件的支持下，按照《全国农用地分等成果技术要求手册》的要求，进行地图整饰与制作，输出高要市农用地自然质量等别图、利用等别图、分等等别图。\n\
    \n高要市农用地自然质量等共分 13 等，不同自然质量等的农用地面积分布见附表 12。由附表 12 可知，高要市农用地的自然质量等绝大部分为 10～13 等，面积为\
    \ 32090.5hm²，占全市农用地总面积的 96.4%；其余 12 个等的面积为 5055.1hm²，占全市农用地总面积的 13.6%。\n\n高要市农用地利用等别共分\
    \ 17 等，见附表 13。自然质量等别高的农用地，利用等别一般也比较高。\n\n高要市农用地分等共有 17 个等别，不同等别的农用地面积及分配比例见附表\
    \ 14。将不同等别的农用地按低、中低、中、中高、高产田来归类的结果见表 9-5。\n\n以上图表中的数据表明，高要市农用地的自然质量普遍较高，以高产田及中高产田为主，高产田和中高产田占高要市农用地的\
    \ 56%，中产田占 32%，低产田和中低产田仅占 12%。农用地的利用情况与其自然质量关系密切，自然质量等高的农用地，利用等和等别一般也比较高。但是，部分分等单元的自然质量等别高，其利用等别和分等等别却比较低，原因是利用指数和经济指数较低。\n"
