    # 11.4.4 RFID 操作日志采集与抗原提呈


    RFID 操作日志采集是提呈抗原决定基（AppLog）和抗原危险信号（FeatureLog）的基础，RFID 操作日志的采集最简单的方式是从 RFID 中间件输出日志，但是这种方式只能采集到受管理的合法阅读器的操作日志，对非法阅读器的攻击无法检测。因为
    RFID 入侵检测的重点是保护标签数据不被非法访问，因此有必要从无线信道来采集操作日志，通过无线信道采集的操作日志才是完整的日志。本章提出分别从无线信道和应用系统同时收集操作日志，收集的日志分别为信道日志（ChLog）和系统日志（SysLog），检测时以
    ChLog 为主，SysLog 作为辅助日志和备份日志，指令匹配率（Pm）和匹配次数（Nm）的统计则通过两者的融合计算获取，采集示意图如图 11-11 所示。


