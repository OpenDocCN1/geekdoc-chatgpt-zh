    ### 10.4.3 评价指标等级确定


    土壤资源质量评价指标等级可以采用模糊线性隶属函数图的方法或经验方法来确定。土壤资源的分布范围很广,在不同的地区,对于不同的利用对象,评价指标等级会有很大的差异。因此,应在专家经验和实地调查的基础上进行综合分析,依据区域土壤资源的属性特点进行划分。参照专家意见,依据《广东土壤》、《广东省土地资源》和其他相关文献资料[184,188,193],确定出了广东省土壤资源质量评价的评价指标等级（表
    10-3）。


    # 表 10-3 广东省土壤资源质量评价等级


    | 等级 | 1 | 2 | 3 | 4 | 5 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 分值 | 5 | 4 | 3 | 2 | 1 |

    | 海拔 | <200 | 200~500 | 500~800 | 800~1000 | >1000 |

    | 坡度 | <2° | 2°~6° | 6°~15° | 15°~25° | >25° |

    | 有机质 | >4.0% | 4.0%~3.0% | 3.0%~1.0% | 1.0%~0.6% | <0.6% |

    | 质地 | 轻壤 | 砂壤、中壤 | 重壤、轻黏 | 中黏 | 砂土 |

