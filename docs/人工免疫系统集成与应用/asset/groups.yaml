    基于免疫机理构建的 RFID 人侵检测 MAS 模型，不仅分解了系统的复杂度，而且实现了系统运行时的健壮性。


    定义 11-3 RFID 人侵检测系统的健壮性[56]。设入侵检测系统 $\Sigma_{RIDS}$ 的内部组成 $\Omega_{RIDS} = \{a_1,
    a_2, \cdots, a_n\}, a_i (1 \leqslant i \leqslant n)$ 为各 Agent 。如任意 $k(k < n)$
    个 Agent 失效，新入侵检测系统 $\Sigma''_{RIDS}$ 的内部结构为 $\Omega''_{RIDS} = \{a_1, a_2, \cdots,
    a_{n-k}\}$，如果满足


    ```

    \(\frac{DA(\Sigma''_{RIDS}) - DA(\Sigma_{RIDS})}{DA(\Sigma_{RIDS})} \leqslant
    \Gamma\) (11-3)

    ```


