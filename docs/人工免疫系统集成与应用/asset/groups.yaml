    \ UML 中的用户图例来表示，目标之间的箭线表示目标之间的信息传递关系。\n\n### 11.3.3 RFID 入侵检测角色交互模型\n\n生物免疫系统中，中枢免疫器官与外周免疫器官的协作主要体现在淋巴循环上，骨髓和胸腺产生新的免疫细胞后，通过淋巴循环传送到外周免疫器官执行免疫应答。类似地，检测中心与入侵监视器的交互也体现为，检测器中心产生新的检测器后，将新检测器传送给入侵监视器。交互模型采用\
