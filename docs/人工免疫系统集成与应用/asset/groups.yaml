    \n## 8.6.3 模拟七点子网\n\n项目组在中国电信集团广州研发中心实验室搭建一个子网进行测试，话务由大话务测试仪生成，并采集相关的话务数据，分别使用遗传算法[101]、克隆选择算法[45]和分层免疫算法对路由表进行求解，各算法性能的对比如图\
    \ 8-8 所示。可以看到，分层免疫算法的性能在模拟实验中明显优于其他算法。\n\n![](img/cd91189832ca806b16310970569db51c_138_0.png)\n\
    \n图 8-8 算法性能比较——5 点子网\n\n在解的收敛性方面，由于遗传算法不能保留每一代的最优解，因此它的搜索过程具有不稳定性，即无法保证能收敛到全局最优解。而采用了分层免疫算法后，由于在进化过程中吸收了各低层免疫操作生成的优秀抗体，保证了解的多样性，所以易跳出局部最小值，收敛性能好。此外，从图\
    \ 8-8 中还可以发现，在解的收敛速度方面，分层免疫算法比克隆选择算法更快地收敛于全局最优解，这是因为分层免疫算法缩小了解群搜索空间，避免了冗余信息的重复运算，所以收敛速度要比克隆选择算法快。\n\
    \n测试结果表明，在目前广东省电信有限公司的电信网络状况下，基于分层免疫算法的动态路由评估模型，在各种话务状况下，均能取得比固定路由方案优越的效果。动态路由的实施，可以有效地提高服务质量，减少话务阻塞；同时对电信部门来说，能提高网络设备使用效率，减少资源浪费，提高经济效益。此外，在调整网络结构或规划新的网络时，可以在动态路由算法的基础上计算网络效率及服务质量，同等情况下，能够节约网络投资或提高服务质量。\n\
    \n## 8.7 本章小结\n\n本章首先结合人工免疫系统设计框架，分析了一般免疫算法的基本步骤和算法性能的影响因素，基于具体问题，结合各种形式的免疫机制，提出了建立一个集成多个不同形式免疫操作的分层免疫算法，并对该模型算法的收敛性进行了理论分析。同时将分层免疫算法与遗传算法、克隆选择算法用于多模态函数优化问题进行性能比较。仿真比较及应用论证了该模型算法的有效性。在分层免疫算法中，N\
    \ 个低层免疫操作中的每一个在经过一段时间后可以获得位于抗体群编码串上的一些特定位置的优良模式，并且通过高层免疫操作，N 个低层免疫操作可以获得包含不同种类的优良模式的新个体，从而既增强了群体多样性和搜索多个全局最优解的能力，又保证了模型在求解问题时的收敛速度和解的质量。该模型具有：①处理更大范围的种群个体，从而可以更好地进行全局寻优的能力；②可以在\
    \ N 个不同的子种群中引入不同的选优方法，所以有更大的可能出现新个体，增强抗体的多样性，从而使分层免疫算法有更大的广泛性；③在分层免疫算法中，引入各种形式的免疫操作以避免模型出现停止收敛或收敛缓慢的问题，提高其收敛速度。\n\
    \n基于目前动态路由评估模型存在的问题和网络话务控制关键技术研究及应用项目中动态路由策略的需求，本章研究使用分层免疫算法解决路由方案问题的方法，提出建立基于分层免疫算法的动态路由评估模型，并对其具体实现方式进行了详细探讨；同时，根据动态路由问题的特征信息和长期电信工作积累的相关经验，本章在基于分层免疫算法的动态路由模型中，把经验知识和特征信息作为免疫疫苗，嵌入模型中，以提高模型的收敛速度和解的质量，使模型能够在新的相对有序的空间中进行搜索，令搜索更有方向。最后，以广东省电信有限公司的电信网为例，组建忙时四点子网、话务高峰五点子网和模拟七点子网对基于分层免疫算法的动态路由模型进行测试和比较分析，结果显示该模型取得了较好的结果，其性能表现超过了遗传算法。应用实例表明，基于分层免疫算法的动态路由模型适合于动态实时控制路由的要求，为实现某运营商电信网的动态路由控制提供了更好的途径。\n\
    \n## 第 9 章 免疫聚类集成及其应用\n\n### 9.1 引言\n\n聚类是一种无监督的模式识别方式，其任务是把一个未标记的模式按某种准则划分成若干子集，要求相似的样本尽量归为同一类，而不相似的样本在不同的类。按聚类准则的不同，聚类算法可分为两类：一类是基于模糊关系的聚类算法，包括谱系聚类、图论聚类；另一类是基于目标函数的聚类算法，如硬\
    \ C-均值聚类、模糊 C-均值聚类。后者把聚类问题归结为优化问题，从而成为当今研究的主流[169~177]。对于优化聚类目标函数的算法，一般都采用梯度法求解极值，由于梯度法的搜索方向总是沿着能量减少的方向，使得算法很容易陷入局部极小值。对初始化敏感是基于目标函数的聚类算法的又一严重缺点。免疫优化算法采用全局搜索和局部搜索相结合的方法，对初始状态不敏感，不容易陷入局部极小值，本章将免疫优化算法与\
    \ C-均值聚类算法集成，建立一个免疫-聚类模型。然后将免疫聚类模型与数据包络分析（data envelopment analysis, DEA）模型集成应用，建立\
    \ AIS-DEA 分类模型，并将其应用于农用地分等评价中。\n\n### 9.2 免疫聚类模型构建\n\n### 9.2.1 免疫聚类的基本原理\n\n\
    为了克服 C-均值聚类容易陷入局部极小值的缺点，人们提出了各种算法对目标函数进行优化。1989 年徐雷提出利用模拟退火法对硬分类矩阵 U 进行退火处理的硬\
    \ C-均值算法[173]，1993 年 Sultan 等提出利用模拟退火法对模糊分类矩阵 U 进行退火处理的模糊 C-均值算法[174]，1994 年 Babu\
    \ 等提出利用进化策略对目标函数进行聚类的方法[175]，1995 年刘健庄等提出用遗传算法进行硬聚类和模糊聚类的分析方法[176]。由于进化算法固有的缺点，在进化过程中不可避免地产生了退化的可能，导致了进化后期的波动现象并且迭代次数过长和聚类准确率不高。\n\
    \nAIS 基于生物免疫系统的基本原理，是一种抽取和反映生物机体免疫系统特点的优化模型。与进化算法相比，AIS 具有如下特点[108,178,179]：①抗体的多样性通过细胞的分裂和分化作用，免疫系统可产生大量的抗体来抵御各种抗原的入侵，这种多样性的遗传机理可用于搜索优化，它对既提高\
    \ AIS 的全局搜索能力又不陷于局部解很有帮助。②自我调节机制使免疫系统具有维持免疫平衡的机制，通过对抗体的抑制和促进作用，能自我调节产生适当数量的抗体。利用这一功能可提高\
    \ AIS 的局部搜索能力。③由于免疫记忆功能，产生抗体的部分细胞会作为记忆细胞而被保留下来，当以后同类抗原入侵时，相应的记忆细胞会被迅速激活而产生大量的抗体，AIS\
    \ 能利用这种抗原识别功能，可以加快搜索速度，提高 AIS 的总体搜索能力。\n\nAIS 聚类模型的基本原理是将待分析的数据作为抗原，通过抗体对抗原的学习、记忆过程来识别、分类不同数据，并从中找出数据间的相关性。AIS\
    \ 聚类模型主要利用免疫系统的三大重要特性：免疫记忆能力、学习能力和自适应能力。免疫系统产生的抗体与入侵的抗原相结合，同时产生记忆细胞，将与这种抗原的接触记忆下来，从而产生再次免疫应答。免疫系统的自适应调节功能主要通过对抗体产生促进和抑制、加入新产生的\
    \ B 淋巴细胞和清除无用的 B 淋巴细胞等方式来实现，这样可以控制高亲和力抗体的数量，保证抗体的多样性。\n\n用 AIS 聚类模型求解聚类问题，首先要解决的是如何构造适应度函数来度量每个抗体对聚类问题的适应程度，下面对这个问题进行研究。\n\
    \n### 9.2.2 适应度函数构造\n\nAIS 聚类模型建立在样本间相似性度量的基础上，根据聚类准则函数的不同，其适应度函数的设计也不同。适应度函数设计的最终目的是把属于同一类的样本归纳成一个类型的子集，把不同类的样本分离；使同一类样本之间的差别尽可能小，不同类样本之间的差别尽可能大。适应度函数构造得越好，聚类质量就越高。因此，如何确定合适的适应度函数是\
    \ AIS 聚类模型的关键。\n\n根据聚类准则函数[180]的不同，下面对各种类型适应度函数的构造分别进行探讨。令样本集 \\( X = \\{x_1,\
    \ x_2, \\cdots, x_n\\} \\)。\n\n- 1. 以误差平方和 \\( f_e \\) 构造适应度函数\n\n采用误差平方和函数 \\\
    ( f_e \\) 度量聚类的质量是最常用的方法之一，其具体定义如下：\n\n\\( f_e = \\sum_{j=1}^c \\sum_{k=1}^{n_j}\
    \ \\|x_k - m_j\\|^2 \\) (9-1)\n\n式中，\\( m_j \\) 为类型 \\( j \\) 中样本的平均值；\\( c \\\
    ) 为聚类中心。显然，\\( f_e \\) 描述了 \\( n \\) 个样本被聚类成 \\( c \\) 个类型时所产生的总误差平方和。\\( f_e\
    \ \\) 越小，聚类质量越高。以 \\( f_e \\) 为基础，适应度函数可设计为 \\( f_e(x) = \\frac{1}{f_e} \\)。该适应度函数适用于各类样本比较密集且样本数目相差不大的情况。\n\
    \n- 2. 以加权平方距离和 \\( f_d \\) 构造适应度函数\n\n根据聚类准则，采用加权平方距离和 \\( f_d \\) 度量聚类质量也是常用的方法之一。\n\
    \n\\( f_d = \\sum P_j S_j^* \\)\n\n式中，\\( S_j^* \\) 为类内样本间平均平方和距离，即\n\n\\( S_j^*\
    \ = \\frac{2}{n_j(n_j - 1)} \\sum_{x \\in X_j, x' \\in X_j} \\|x - x'\\|^2 \\\
    )\n\n可以看出，\\( \\frac{2}{n_j(n_j - 1)} \\) 是类型 \\( j \\) 的样本子集 \\( X_j \\) 的样本中任意取两个的组合数的倒数，\\\
    ( \\sum_{x \\in X_j, x' \\in X_j} \\|x - x'\\|^2 \\) 是样本子集 \\( X_j \\) 中的样本间平方距离之和。\\\
    ( f_d \\) 是以先验概率 \\( P_j \\) 为权值的总类内样本间的平均平方距离，其中，\\( P_j = \\frac{n_i}{n} (j\
    \ = 1, 2, \\cdots, c) \\)，有\n\n\\( f_d = \\frac{1}{n} \\sum_{j=1}^c n_j S_j^*\
    \ \\)\n\n加权平方距离和 \\( f_d \\) 越小，聚类质量越高，则以 \\( f_d \\) 为基础设计的适应度函数为 \\( f_d(x)\
    \ = \\frac{1}{f_d} \\)。同样以误差平方和 \\( f_e(x) \\) 作为适应度函数一样，\\( f_d(x) \\) 是描述聚类结果的类内距离分布状态的。其值越小，则聚类模型的聚类效果越好，对于各类样本数目相差比较大的情况，适应度准则\
    \ \\( f_d(x) \\) 比 \\( f_e(x) \\) 的聚类效果要好，比较容易防止多样本的分裂。\n\n- 3. 以类间距离和 \\( f_a\
    \ \\) 构造适应度函数\n\n类间距离和 \\( f_{a1} \\) 和加权的类间距离 \\( f_{a2} \\) 是度量聚类质量的又一准则，它们分别定义为\n\
    \n\\( f_{a1} = \\sum_{j=1}^c (m_j - m)^T (m_j - m) \\)\n\n和\n\n\\( f_{a2} = \\\
    sum_{j=1}^c P_j (m_j - m)^T (m_j - m) \\)\n\n式中，\\( m \\) 为全部样本的均值向量，其中，\\( P_j\
    \ = \\frac{n_i}{n} (j = 1, 2, \\cdots, c) \\)，类间距离和准则 \\( f_a \\) 描述不同类型之间的分离程度。\\\
    ( f_a \\) 的值越大，表示聚类结果的各个类型分离情况越好，聚类效果越好。则适应度函数可设计为 \\( f_a(x) = f_{a1} \\) 或 \\\
    ( f_a(x) = f_{a2} \\)。\n\n- 4. 以离散度矩阵构造适应度函数\n\n除了以上三种构造适应度函数的方法外，还可以利用离散度矩阵设计\
    \ AIS 聚类模型的适应度函数。利用离散度矩阵不但能反映同类样本的聚集程度，而且能反映不同类之间的分离程度，首先介绍几个离散度矩阵。\n\n  - (1)\
    \ 定义类型 j 的离散度矩阵为\n\n\\( S_j = \\frac{1}{n_j} \\sum_{k=1}^{n_j} (x_k^i - m_j)(x_k^i\
    \ - m_j)^T \\) (9-7)\n\n  - (2) 定义类内离散度矩阵为\n\n\\( S_w = \\sum_{j=1}^c P_j S_j\
    \ \\) (9-8)\n\n  - (3) 定义类间离散度矩阵为\n\n\\( S_B = \\sum_{j=1}^c (m_j - m)^T (m_j\
    \ - m) \\) (9-9)\n\n  - (4) 定义总离散度矩阵为\n\n\\( S_T = \\frac{1}{n} \\sum_{k=1}^n\
    \ (x_k - m)(x_k - m)^T = S_w + S_B \\) (9-10)\n\n显然，对于一种聚类结果，类内离散度越小越好，类间离散度越大越好。因此，作为量的描述，可由离散度矩阵的积和行列式值引出适应度函数的不同形式\n\
    \n\\( f_{T1} = \\text{tr}(S_w^{-1} S_B) \\) (9-11)\n\\( f_{T2} = |S_w^{-1} S_B|\
    \ \\) (9-12)\n\\( f_{T3} = \\text{tr}(S_w^{-1} S_T) \\) (9-13)\n\\( f_{T4} = |S_w^{-1}\
    \ S_T| \\) (9-14)\n\n则适应度函数可设计为 \\( f_T(x) = f_{T1}, f_T(x) = f_{T2}, f_T(x) =\
    \ f_{T3} \\) 或 \\( f_T(x) = f_{T4} \\)。这些适应度函数同时考虑了类内的离散度和类间的离散度，为了得到更好的聚类结果，它们的值越大越好。\n\
    \n### 9.2.3 免疫聚类模型设计\n\nAIS 聚类模型的算法流程与常规的人工免疫模型的算法流程类似。下面具体描述利用 AIS 聚类模型求解问题时的步骤。\n\
    \n- (1) 分析问题。对问题及其解的特性进行分析和了解，设计解的合适表达形式。设定模型的相关参数，如固定聚类类数 c、终止条件 \\( S_c \\)、抗体规模\
    \ N 等。\n\n- (2) 编码方式。AIS 聚类模型中抗原、抗体的编码方案有两种。第一种编码方案中，设有 n 个个体要分成 c 类，用基因串 \\(\
    \ X = \\{x_1, x_2, \\cdots, x_n\\} \\) 来表示某一分类结果，其中 \\( x_i \\in \\{1, 2, \\cdots,\
    \ c\\}, x_i \\) 取值为 \\( k (1 \\leqslant k \\leqslant c) \\) 表示 \\( x_i \\) 属于第\
    \ k 类，这种方案的搜索空间为 \\( c^n \\)，当数据集个体较大时，采用这种编码方案的搜索空间就很大，因此本章采用第二种编码方式。在第二种编码方案中，对聚类原形进行编码，根据各自取值范围，将其量化值编码成串，其形式为\
    \ \\( X = (x_1, x_2, \\cdots, x_l) \\)，其中，\\( l = c \\cdot p \\)，X 中前 p 个量化值代表第一个\
    \ p 维聚类中心，依次类推。\n\n- (3) 适应度函数确定。根据不同的问题，AIS 聚类模型可以采用不同的适应度函数类型。本章以式(9-12)作为适应度函数。\n\
    \n- (4) 初始抗体群体的产生。如果记忆库有初始抗体，则从中提取 M 个个体（其中，M 为记忆库中个体的数量），并随机产生剩余 N - M 个个体构成初始的子代群体\
    \ C_0；否则，随机产生 N 个个体构成初始的子代群体 C_0。\n\n- (5) 计算每个个体的适应度。\n\n  - 步骤 1 对每个个体进行解码，计算出各个原型参数\
    \ {v_i, 1 \\leqslant i \\leqslant c}。\n  - 步骤 2 利用 {v_i, 1 \\leqslant i \\leqslant\
    \ c} 及式(9-8) 和式(9-9) 计算各个个体的类内距离 S_w 和类间距离 S_B。\n  - 步骤 3 利用 S_w 和 S_B 及式(9-12)，计算每个个体的适应度。\n\
    \n- (6) 计算每个个体的期望繁殖率。设当前的子代群体为 C_{k-1}，根据(5)分别计算 C_{k-1} 中 N 个个体的适应度 a x_v。结合个体的适应度计算个体的期望繁殖率\
    \ e_i。具体计算过程如下：\n\n  - 步骤 1 计算个体 V 的浓度 c_v。\n\n\\( c_v = [\\sum_{w=1}^{N} a c_{vw}]/N\
    \ \\)\n\n式中\n\n\\( a c_{ww} = \\begin{cases} 1, & a_{y,w} \\geqslant Tac \\\\\
    \ 0, & a_{y,w} < Tac \\end{cases} \\) (Tac 为一预先确定的值)\n\n  - 步骤 2 计算个体 V 的期望繁殖率\
    \ e_i。\n\n\\( e_i = \\frac{a x_v}{c_v} \\)\n\n将 C_{k-1} 中的个体按 e_i 的降序排列，同时取前 M\
    \ 个个体存入记忆库中。在目前的子代个体群体 C_{k-1} = (C_1, C_2, \\cdots, C_N) 中以概率 e_i 选择个体 C_i 进入新的父代个体群体\
    \ A_k。由式(9-17)知，在个体浓度一定的条件下，个体适应度越大则期望繁殖率越大；在个体适应度一定的条件下，个体浓度越大则期望繁殖率越小。这样在保留高适应度个体的同时，也确保了个体的多样性。\n\
    \n- (7) 变异。变异算子是以一定的概率将所选的个体的基因取反。本章也可采用一种基因逆转的变异算子，即在父代中随机产生一个基因段并将该基因段中的基因逆转，它主要防止\
    \ AIS 聚类过程中的“早熟”现象。变异率 p_m 按期望繁殖率值自动调整，具体公式如下：\n\n\\( p_m = \\begin{cases} \\\
    frac{k_1(e_{max} - e)}{e_{max} - e_{avg}}, & e \\geqslant e_{avg} \\\\ k_2, &\
    \ e < e_{avg} \\end{cases} \\)\n"
