    算法[142]。


    # 1. 线性算法[55]


    线性算法主要从减少候选检测数量出发来提高检测器生成效率，使检测器生成时间与自体数呈线性关系而非指数关系，算法过程分为两个步骤。


    **步骤 1** 计算 \( r \) 子串不匹配自体的数目。进行一个有限的递归运算得到一定数量的不与自体匹配的字符串。对一个长度为 \( r \) 的串
    \( s \)，\(\hat{s}\) 表示去掉 \( s \) 第一个位后得到的串，\( s.b \) 表示串 \( s \) 后面接 \( b \)，\(\hat{s}.b
    \) 就表示 \( s \) 去掉了第一个位再后接 \( b \) 的串，模板 \( t_{i,s} \) 是指一个模板，它的 \( r \) 个连续位从第
    \( i \) 位开始，并且这 \( r \) 个连续位为串 \( s \)，\( 1 \leqslant i \leqslant (l-r-1) \)。定义
    \( C_i[s] \) 为 \( t_{i,s} \) 的不与自体集中任意串匹配的右填充数量。在各种情况下按式(7-4)计算。


    \( C_i[s] = \begin{cases} 0, & \quad t_{i,s} \text{ 与 S 匹配} \\ C_{i+1}[\hat{s}.0]
    + C_{i+1}[\hat{s}.1], & \quad \text{否则} \end{cases} \) (7-4)


    **步骤 2** 用枚举法从候选检测器中随机选出检测器。具体的选取办法为从 \(\{1, \cdots, T\} (T = \sum_s C_1(s))\)
    中随机选取一个数 \( k \)，在 \( C_1[\cdot] \)（“.”表示任何字符串）中作二叉查找得到 \( s \)，使式(7-5)成立，即


    \( P_1 = \sum_{s \ll s_1} C_1[s] < k \leqslant Q_1 = \sum_{s \leqslant s_1} C_1[s]
    \) (7-5)


    所有在 \( (P_1, Q_1) \) 范围内的非匹配串都以 \( s \) 开始，通过查找 \( k \) 属于哪个划分，就可以确定串 \( k \)
    上从 \( r+1 \) 到 \( l \) 位上的值。


    线性算法的时间复杂度为 \( O((l-r) \cdot N_S) + (l-r) \cdot 2^r + O(l \cdot N_S))\)，空间复杂度为
    \( O((l-r)^2 \cdot 2^r)\)。与原 NSA 算法相比，线性算法的时间和空间复杂度都有所下降。


    # 2. 贪婪算法[55]


    贪婪算法建立在线性算法的基础上，主要通过消除冗余的检测器，保证生成的检测器能够尽量覆盖非自体空间。该算法也建立在 \( r \) 子串不匹配自体数目矩阵的基础上。


    算法过程分为两步：


    **步骤 1** 产生 \( D \) 数组。算法使用两个不同的 \( D \) 数组，即 \( D_S \) 和 \( D_R \)。它们分别基于自体集合
    \( S \) 和检测器集合 \( R \) 的当前状态，\( D_R \) 用来表示模板中有多少个串不与先前生成的检测器匹配。


    **步骤 2** 生成检测器。选择有效模板中值最大的模板，以匹配最多不与自体匹配的串。在每一个新的检测器生成以后，更新 \( D_R \) 以及时反映检测器集合的现状。'
  - '[PAGE 95]


    贪婪算法的时间复杂度为 \( O((l - r) \cdot 2^r \cdot N_R) \)，空间复杂度为 \( O((l - r)^2 \cdot 2^r)
    \)。贪婪算法的时间复杂度与 Forrest 的 NSA 算法相比没有显著下降，如果 \( N_R \) 较大，消耗的时间可能更多，但是检测器的分布却达到了最佳状态。


    # 3. 带变异的阴性选择算法[23]


    de Castro 等将变异引入到算法之中，满足了缩小搜索空间的要求，减少了候选检测器的数量，从而提高了算法效率，但是仍未解决匹配阈值难确定和“黑洞”等问题。


    算法过程如下：


    +   步骤 1 定义自体集；

    +   步骤 2 随机生成候选检测器；

    +   步骤 3 把每个候选检测器与自体比较，如果匹配成功，则对候选检测器进行有导向性的变异，使它远离自体。


    # 4. 匹配阈值可变阴性选择算法[142]


    D''haeseleer 在提出“黑洞”时就建议用匹配阈值可变的匹配规则来减少黑洞[55]，但是没有给出具体改进和分析。张衡等给出匹配阈值可变的具体算法和仿真分析[142]，具体算法步骤如下：


    +   步骤 1 定义自体集 S；

    +   步骤 2 随机产生字符串 a,设置初始匹配阈值为 \( r_1 \)；

    +   步骤 3 将字符串 a 依次与集合 S 中字符串匹配；

    +   步骤 4 根据匹配规则，如果 a 不与 S 中任何字符串匹配，则 a 成熟，将 a 与匹配阈值加入到检测器集中，转到步骤 2；

    +   步骤 5 若 a 遇到与之匹配的字符串，则将匹配阈值调整为 \( r'' \)，如果 \( r'' > r_c \)，转到步骤 2,否则转到步骤 3。


    仿真分析表明，该算法对减少“黑洞”数目是有效的，并且检测性能也有所提高。但实质上“黑洞”的减少还有赖于最大匹配阈值 \( r_c \)，仍然需要设置匹配阈值
    \( r_c \)。


    # 7.3 免疫融合阴性选择算法


    针对 NSA 算法存在的不足，本章将免疫网络调节的思想引入到基于阴性选择的检测器产生过程中，提出免疫融合阴性选择算法(II-NSA)。


    II-NSA 算法的基本思想是：


    +   (1) 克隆选择原理既然能使抗体接近抗原，产生较高的亲和力，那么也能使免'
  - '[PAGE 96]


    疫细胞远离自体，抑制自免疫的发生。因此，克隆选择原理也将应用到算法中，当检测器与自身匹配时不是简单地丢弃，而是通过变异使其远离自体，有更大的机会成熟，从而提高检测器的生成效率。


    (2) 检测器库是一个免疫调节网络，每个检测器不是孤立的，而是一个相互识别、相互刺激、相互抑制、动态平衡的网络结构。相互识别的检测器有较大的重复覆盖范围，因此应该采取抑制策略，从而在保证检测性能的基础上抑制检测器库的规模，提高检测效率。


    (3) 抗体与抗原的匹配是模糊的，检测器与抗原的匹配也应该是模糊的，而且检测器与抗原，与自体匹配的模糊程度应该是一致的，即检测器如果越远离自体，则其检测的模糊程度越高，检测范围越广。因此，匹配阈值
    r 可变的思想将被加以改进引入到 II-NSA 中，从而减少“黑洞”数目，并且自适应地获得匹配阈值 r，从而解决 r 难确定的问题。


    综上所述，与其他改进的 NSA 相比，II-NSA 是对 NSA 更全面的改进。


