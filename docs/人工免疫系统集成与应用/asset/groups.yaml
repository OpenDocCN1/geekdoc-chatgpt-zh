    L 检测中，一旦发生 LMATCH(ag, dl), dl∈ DL, 则进入 H 检测(即协同检测)，否则输出正常，即 ag∈ Self。


    H 检测中，需要等待 ag 相应的危险信号 fl，即与 ag 同区域(Rg)的下一统计周期的 FeatureLog，等待到危险信号 fl 后，fl 经历协同检测库
    DH 的检测，一旦发生 HMATCH(fl, dh), dh∈ DH, 如果 dh. Type=0, 表示检测到危险信号，报告异常，确认之前的抗原 ag∈
    NonSelf; 否则，报告正常，认为之前的抗原 ag∈ Self, 可以认为是偶尔发生的误操作。如果 H 检测中，一直没有 HMATCH(fl, dh)(dh∈
    DH) 发生，则认为发生了 UNKONWN(fl)，需要人工进一步协同判断之前的 ag 是否属于 NonSelf。


    # 2. 适应性检测器亲和力成熟


    为了提高检测效率，模拟生物免疫系统的二次免疫应答，将 L 检测器划分为记忆 L 检测器群 MDL 和一般 L 检测器群 GDL。受抗原刺激越多，刺激时间越近的抗体，与抗原的亲和力越强。因此，设置一个亲和力阈值，亲和力超过阈值的抗体进入
    MDL，为了区别抗体-抗原亲和力，此处将其定义为检测器亲和力。


    设有 L 检测器 d，其亲和力记为 Aff (d)，如式(11-20)所示。


    ```

    Aff(d) = \frac{d. Count}{T_c + T_{now} - d. Time} \quad (11-20)

    ```


    式中，T_{now} 为当前时间；T_c 为常数。为避免新受刺激的检测器亲和力过高，随着时间的推移，未受刺激的检测器亲和力逐渐下降。


    MDL 和 GDL 的表述如式(11-21)所示。


    ```

    \begin{cases} \text{MDL} = \{d \in \text{DL} | \text{Aff}(d) > \text{ThA}\} \\
    \text{GDL} = \text{DL} - \text{MDL} \end{cases} \quad (11-21)

    ```


    式中，ThA 表示亲和力阈值。


    当抗原提呈后，在接受 L 检测器的检测时，系统首先将抗原与 MDL 中的记忆检测器匹配，如果抗原未与 MDL 中的检测器匹配，则继续与 GDL 中的检测器匹配。一旦发生匹配，则认为检测到了非自身，更新检测器亲和力值，如果当前检测器不属于
    MDL 且亲和力大于阈值，则将当前检测器加入 MDL。


    以上监视过程仅描述了检测器由 GDL 向 MDL 迁移的过程，随着时间的推移，未受抗原刺激的检测器亲和力逐渐下降，当降到亲和力阈值 ThA 之下时，则需要从
    MDL 往 GDL 迁移，并将其亲和力置为 0（即 d. count=0)，该过程称为记忆检测器遗忘，记忆检测器遗忘采用定时器实现，定时从 MDL 中清理出遗忘的检测器。


    记忆检测器的动态模型如式(11-22)所示。


    ```

    \begin{cases} \text{MDL}(0) = \varnothing \\ \text{MDL}(t) = \text{MDL}(t-1) +
    \text{NewMDL}(t-1,t) - \text{ForgetMDL}(t-1,t) \end{cases} \quad (11-22)

    ```'
  - '[PAGE 203]


    式中，$t$ 表示时间;NewMDL $(t-1,t)$ 表示 $t-1$ 到 $t$ 时刻新加入的记忆检测器; ForgetMDL $(t-1,t)$ 表示
    $t-1$ 到 $t$ 时刻遗忘的检测器。


    # 3. 适应性检测器更新与亲和力继承


    L 检测器是由检测器中心周期性动态更新的，入侵监视器一般批量地从 Agent 共享的黑板中获取 L 检测器，替换掉原有的 L 检测器，新一轮检测器替换前一轮检测器的时候，为了保持检测效率，采用亲和力继承的方式，从新一轮检测器中挑选出新的
    MDL 以保持 MDL 的检测效率。


    设新一轮检测器集合为 DL$(t)$，前一轮记忆检测器为 MDL$(t-1)$，产生的新一轮记忆检测器为 MDL$(t)$，MDL$(t)$产生算法描述如下。


    +   步骤 1 初始化 MDL $(t) = \varnothing$;


    +   步骤 2 对于每一个前一轮记忆检测器 DLold $\in$ MDL$(t-1)$，DLold.Ab 作为抗原，与 DL$(t)$ 作匹配测试；


    +   步骤 2.1 如果与 DLold.Ab 连续匹配位数最大的新检测器为 DLnew，并且 DLold.Ab 与 DLnew 匹配，则


    +   步骤 2.1.1 亲和力继承


    ```

    DLnew.Time = DLOld.Time;

    DLnew.Count = DLOld.Count;

    ```


    +   步骤 2.1.2 记忆迁移。


    将 DLnew 加入 MDL$(t)$，并从 DL$(t)$ 中清除；


    从 DL$(t)$ 中清除抗体 DLnew；


    +   步骤 3 MDL$(t-1)$ 的每一个检测器循环完毕，结束；否则返回步骤 2。


