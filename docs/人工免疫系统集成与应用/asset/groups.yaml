    \ Pa 是反映口令猜测攻击的危险元素之一。\n\n另外，指令成功率(Ps)、口令类指令比率(Pd)、写指令比率(Pw)能反映 RFID 应用的时域和区域特征，也被纳入危险元素范畴。\n\
