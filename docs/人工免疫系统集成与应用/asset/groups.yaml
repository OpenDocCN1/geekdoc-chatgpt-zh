    # 第 10 章 人工免疫网络与 GIS 集成的土壤资源质量评价


    # 10.1 引言


    土壤资源质量评价是指对土壤资源的质量、适宜性和限制性作出评定，并综合评定其生产潜力[206~208]。其目的是在摸清土壤资源底细的基础上，合理利用与保护土壤资源，充分发挥土壤资源的生产潜力，为农业生产与管理服务。土壤资源质量评价是农业区划、林业区划、农业种植区划、土壤资源开发利用分区与规划及科学管理土壤资源的重要基础工作。


    地理信息系统(geographic information system,GIS)是采集、存储、管理、分析和描述整个或部分地球表面(包括大气层)的与空间和地理分布有关的数据的空间信息系统[206]。它是
    20 世纪 60 年代随着计算机技术的发展而产生的一门全新技术，主要研究在应用计算机技术对地理信息进行处理、存储、提取及管理和分析过程中所提出的一系列基本问题，如数据的获取和集成、分布式计算、地理信息的认知和表达、空间分析等。GIS
    具有强大的空间数据管理、表示、空间分析和模拟能力。AiNet 模型具有较好的多样性、知识表达、逻辑推理、自学习和搜索能力。本章针对土壤资源质量评价问题，将
    AiNet 模型和 GIS 相结合，建立一个基于 AiNet-GIS 的土壤资源质量评价模型，能在较短时间内得到较好的评价结果。


    # 10.2 土壤资源质量评价问题描述


    # 10.2.1 评价的基本程序


    土壤资源质量评价的基本程序为：①划分评价单元；②选择评价因素及确定权重；③确定评价指标；④选择评价模型；⑤评定土壤资源质量等级[206]。在土壤资源质量评价中，反映土壤资源质量好坏的综合评价值实质上可以看作评价指标的函数，目前常用的土壤资源质量评价模型有指数和、指数积、回归分析、主成分分析、灰关联分析、聚类分析、模糊综合评判及神经网络等[181,183,184,206,209]。前人对此作了不少研究，并取得了一定的成果[185,186,188,189,193,206]。但是，这些评价方法都存在一些不完善的地方。例如，指数和法把土壤资源质量与其影响因素之间的关系作为线性函数处理，而实际上应该是非线性函数；神经网络方法也存在收敛速度'
  - '[PAGE 164]


    慢,容易陷入局部极小点等问题。同时,土壤资源质量评价所需的数据中包含大量的拓扑信息,通常按复杂的、多维的空间索引结构组织数据,其访问是通过空间数据的访问方法,需要空间推理、地理计算和空间知识表达技术。而上述模型和方法在这方面存在一定的缺陷。实际情况要求设计新的模型和方法,以便用较短的时间,得到较好的土壤资源质量评价结果,从而满足土壤资源质量评价中时间和质量的要求。


    # 10.2.2 评价单元划分


    评价单元是土壤资源质量评价的基本单位。在进行土壤资源质量评价之前,先要确定土壤资源质量评价的评价单元。土壤资源质量评价的评价单元的确定有四种基本方法,即以土壤类型为基础确定、以土壤资源利用现状为基础确定、以土壤资源类型为基础确定和以评价因素的组合确定。


    以土壤类型为基础确定土壤资源评价单元,最早起源于美国的土地生产潜力评价或分类。该分类将对农业生产影响一致的土壤类型归在一起划成一个个土地生产潜力单元。以土壤类型为基础确定土壤资源评价单元,可用于各种比例尺的土壤资源评价。这种评价单元能够充分反映土壤在土壤资源各要素中的重要地位,同时也能够充分利用土壤普查成果。只要将评价地区的土壤图连同土壤调查报告收集起来,就可以确定土壤资源评价单元的位置与数量。但是,这样的评价单元在许多情况下往往和自然地块及行政界线不一致。


    以土地利用现状为基础确定土壤资源评价单元,多用于大、中比例尺,较小范围的土壤资源评价。这样确定的土壤资源评价单元的界线与自然地块相一致,便于基层生产单位应用及土地利用结构调整。但是,当一个土地利用类型含有多个土壤资源类型时,这种土壤资源评价单元的土壤资源性质选取就很困难,使得土壤资源评价难以进行,或者评价结果不准确。


    以土壤资源类型为基础确定土壤资源评价单元,多用于中、小比例尺,大范围的土壤资源评价。土壤资源类型反映了土壤资源的全部自然属性及人类活动对土壤资源的影响。它不仅体现了土壤和土地利用的差异性,还体现了土壤资源其他要素及人为活动结果的相对均一性与差异性。因此,以土壤资源类型为基础确定土壤资源评价单元更具有科学性。因此,本章构建的模型采用土壤资源类型作为土壤资源质量评价的评价单元。


    以评价因素的组合确定土壤资源评价单元。将土壤类型、土地利用现状、土壤资源类型按照一定权值组合,该方法往往因权值很难确定而无法实施,较少使用。


    # 10.2.3 评价指标体系构建


    本节根据影响土壤资源质量的相关因子,构建相应的土壤资源质量评价指标体系。在选取评价指标体系时考虑以下原则:①可操作性原则。所选取的指标必须能够量化,对不能量化的指标用相似的指标替代。②科学性和完备性原则。假'
