    # 4.4 本章 小结


    本章基于量子理论中的量子比特的概念，将量子比特编码抗体引入到免疫算法中，提出一种将量子理论与免疫理论相结合的 QIA 框架，构造了量子免疫算子和量子变异，其中，量子变异实施于量子抗体，用于加快算法的收敛，量子变异实施于普通抗体，用于克服算法的早熟；并对
    QIA 的收敛性进行了理论分析，证明了其全局收敛性，同时将 QIA 与 GA、IA 用于多模态函数优化问题进行性能比较。仿真比较及应用论证了该模型算法的有效性，证明此算法收敛速度快，种群多样性好，能有效克服早熟现象。


    针对经典量子进化算法在求解多目标优化问题方面存在的不足，本章采用多目标优化亲和度排序策略和分级变异策略对算法进行改进，提出了一种新的多目标进化算法——CMQEA。该算法在种群内部变异和种群进化过程中，能有机地结合局部-全局搜索，同时保持种群的多样性。仿真实验的结果表明，新算法在目标向量维数为二维的
    Knapsack 测试集上能取得较好的效果，是一种有效并且稳定的算法。如何更好地将算法用于其他一些 MOP，包括更高维的 MOP，以及如何更好、更全面地评价一种
    MOP 算法，将是未来进一步要做的工作。'
