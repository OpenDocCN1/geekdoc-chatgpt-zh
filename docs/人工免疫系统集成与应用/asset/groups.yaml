    # 前言


    生物现象和生物系统是人们创新的灵感源泉，对智能计算、数据挖掘、模式识别等领域的研究和发展起到巨大的促进作用。免疫系统与神经系统、遗传系统和内分泌系统一样同属于生物系统中的信息处理系统，同时也是一个复杂自适应系统，它旨在区分外部有害抗原和自身组织，从而清除病原并保持机体的稳定。Rowe
    认为，人体免疫系统的功能有几分像“第二个大脑”，它可储存过去经历的记忆，同时能对新的、异常的物质(抗原)作出响应。从计算的角度来看，免疫系统因其强大的信息处理能力而成为广受关注的研究课题，特别是免疫系统是一个高度并行、分布、自适应和自组织的系统，具有很强的学习、识别、记忆和特征提取能力，能完成许多复杂的计算。人们希望从免疫系统的运行机制和计算能力中获取灵感，从而开发面向应用的人工免疫系统和算法，以解决工程实际问题。目前，人工免疫系统在智能计算领域已经取得了一系列研究成果，经典算法主要有克隆选择算法、阴性选择算法、免疫学习算法、免疫网络调节算法等，并且在数据挖掘、模式识别、优化计算、入侵检测等领域得到了广泛的应用。


    由于生物免疫机理本身很复杂，人们对免疫现象的认识也在不断深化。因此，目前的人工免疫系统还存在一些缺陷，如没有形成统一的计算框架，计算量大，先验知识无法充分利用等。这些问题如果通过深入认识相关免疫机理，进而改进现有免疫算法，将需要一个漫长的过程，而通过与其他智能算法的集成对人工免疫系统进行改进，则不啻为完善人工免疫系统的一条可行途径。目前，人工免疫系统已经与人工神经网络、模糊系统、进化算法等智能计算方法相结合，取得了一定的研究成果。本书在综合已有研究成果的基础上，对人工免疫系统的集成及其应用进行进一步研究，主要包括人工免疫系统的算法框架，免疫机理自身融合与集成，免疫机理与混沌算法、量子算法的集成，人工免疫系统在网络路由优化、土地分类评价、RFID
    入侵检测等工程领域的应用。


    本书共分 11 章，首先从 AIS 的生物原型入手，归纳提炼出基本原理，主要包括免疫识别、免疫学习、免疫记忆、克隆选择、多样性、分布式和自适应等，进而提出
    AIS 的设计框架。然后在已有免疫算法所借鉴的生物免疫机理的基础上，建立既有利于理论探讨又有利于工程应用，且具有自身独特结构、独特设计、应用有效的人工免疫系统及其集成模型，并对这些模型展开系统性的理论研究、性能测试、比较及应用，进而建立针对动态路由评估、数据聚类、函数优化、土壤质量评价、农用地分等、RFID
    入侵检测等问题的人工免疫系统及其集成模型，并对其展开理论研'
  - '[PAGE 7]


    究、性能测试、比较及应用。


    本书是国家自然科学基金项目（No. 60973132）、广东省自然科学基金课题（No. 8451064101000630）、教育部高校博士点基金新教师课题（No.
    20070561081）、华南理工大学中央高校基本科研业务费专项资金项目（No. 2009ZZ0053）资助的研究成果，是杨海东博士、郭建华博士和邓飞其教授合作研究的工作结晶。特别感谢国家自然科学基金委员会的大力支持，同时感谢科学出版社对本书出版提供的支持和指导。


