    除了利用最小中继数阈值、最大溢出率阈值作为禁用节点疫苗以外，还可利用电信员工在日常网络管理、维护中积累的经验设计禁用节点疫苗。例如，省际或国际长途中转局一般不用来作为其他链路的迂回。


    为了解决怎样在分层免疫算法中引入禁用节点疫苗的问题，本章在路由求解过程中创建禁用表。禁用表是一个矩阵，记录了每两个交换局之间不可以用作迂回节点的交换局的数目和不可用的迂回交换局的编码。在初始群体生成和变异操作需要随机产生一个
    i,j 之间的迂回节点时，随机生成一个属于 [1,n] 的整数，然后与禁用表中的编码进行比较，如果相同，则再次生成，直至不同为止。这样随机生成的迂回节点必然满足禁用节点经验的要求。禁用表的引入也减小了搜索空间。假设在具有
    43 个交换机的网络中，每两个交换机间平均有 10 个禁用节点，则可用的节点最多只有 31 个，故搜索空间减小为 31^42×43 = 31^1806 ≈
    10^2693。


