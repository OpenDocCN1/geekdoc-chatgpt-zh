    \ | 标准样地 | Gyydi | C2 | Polygon |\n\n## 4) 数据库的建立\n\n### (1) 建库流程。\n\n数据库建立的步骤包括数据的收集整理与入库要素的选取、图形数字化、图形坐标变换与编辑、属性数据整理编码与输入、图形与属性数据链接等一系列过程。高要市农用地分等数据库建库流程图如图\
