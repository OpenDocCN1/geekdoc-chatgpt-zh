    # 11.3.4 RFID 入侵检测 Agent 类模型


    Agent 类建模是 MAS 建模的核心过程，它实现从系统“做什么”到“怎么做”的过渡，其目标是将前面的建模结果封装到 Agent 中去，最终组装为多 Agent
    系统。


    定义 11-2 Agent 类。Agent 类是多 Agent 系统中的一类 Agent 的模板，它描述了 Agent 需要扮演的角色和需要实现的目标。Agent
    类的形式化描述为 AgentClass = <name, roles, goals> (11-2)


    式中，name 表示 Agent 类的名称；Roles 表示 Agent 类的角色集；Goals 表示 Agent类的目标集。


    Agent 类模型是多 Agent 系统的框架，它描述了系统中所包含的 Agent 类，以及 Agent 类之间的通信。Agent 类以角色模型和角色交互模型为基础，通过将
    Agent 类与角色进行绑定，确定 Agent 类所扮演的角色，而角色交互模型则体现了 Agent 类之间的对话。


    一般而言，可以将角色模型中抽象出的角色映射为 Agent 类，如果两个角色之间的通信量很大时，为了减少通信负担，可以将两个角色封装在一个 Agent 类中；当一个角色实现目标的计算和存储量很大时，也可以将这个角色进行进一步拆分，用两个或多个
    Agent 类封装。


    模仿生物免疫系统的 RFID 入侵检测角色模型，角色承担的目标相对独立，角色之间没有复杂的协作，直接可以将角色封装为 Agent 类，抽象出 RFID 入侵检测器中心、RFID
    入侵信息收集器和 RFID 入侵监视器等 Agent 类，以下分别简称为检测器中心、信息收集器和入侵监视器。结合角色模型和角色交互模型构建的 A-agent
    类模型如图 11-7 所示。图中的方框表示 Agent 类，每个 Agent 类的子框从


    ![](img/cd91189832ca806b16310970569db51c_185_0.png)


    图 11-7 RFID 入侵检测 Agent 类模型'
