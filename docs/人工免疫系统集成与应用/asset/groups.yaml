    \n## 3. RFID 入侵检测的自适应性\n\n入侵监视器的自适应性主要体现在适应性检测器的动态性上，入侵监视过程中，适应性检测器将动态划分为记忆检测器和一般检测器，从而缩短了检测时间。\n\
    \n## 定理 11-3 如果 RFID 系统的同类型操作连续发生 \\(k\\) 次，\\(k>1\\)，则适应性检测中采用亲和力成熟记忆比没有采用时完成一条业务日志的平均检测时间短。\n\
    \n证明 设 L 检测器库的规模为 \\(n\\)，如果没有采用亲和力成熟记忆，则完成一条业务日志的平均检测时间 \\(t_0 = t_m \\times\
    \ n/2\\)，\\(t_m\\) 为特征日志与一个检测器匹配计算所需的时间。\n\n如果采用了亲和力记忆，运行一段时间后，L 检测器分为一般检测器（GDL）和记忆检测器（MDL），记忆检测器规模为\
    \ \\(m\\)，\\(g+m=n, 0<m<n\\)。\n\n如果 RFID 系统的同类型操作连续执行 \\(k\\) 次，在第 \\(i (i<k)\\\
    ) 次，匹配的 L 检测器从 GDL 迁移至 MDL，则余下的 \\(k-i\\) 次操作在 MDL 中即被检测，\\(k\\) 个业务日志完成检测的平均时间\
    \ \\(t_k = t_m \\times [i \\times n/2 + (k-i) \\times m/2]/k\\)。\n\n因为 \\(m<n\\\
    )，所以 \\(t_k < t_m \\times (n/2) = t_0\\)，即适应性检测中采用亲和力成熟记忆比没有采用时完成一条业务日志的平均检测时间短。\n\
