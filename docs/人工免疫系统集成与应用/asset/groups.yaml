    印张：15 3/4\n字数：303 000\n\n定价：48.00 元\n\n（如有印装质量问题,我社负责调换）\n\n## 《智能科学技术著作丛书》序\n\
    \n“智能”是“信息”的精彩结晶，“智能科学技术”是“信息科学技术”的辉煌篇章，“智能化”是“信息化”发展的新动向、新阶段。\n\n“智能科学技术”(intelligence\
    \ science & technology, IST)是关于“广义智能”的理论方法和应用技术的综合性科学技术领域，其研究对象包括：\n\n- “自然智能”(natural\
    \ intelligence, NI)，包括“人的智能”(human intelligence, HI)及其他“生物智能”(biological intelligence,\
    \ BI)。\n- “人工智能”(artificial intelligence, AI)，包括“机器智能”(machine intelligence, MI)与“智能机器”(intelligent\
    \ machine, IM)。\n- “集成智能”(integrated intelligence, II)，即“人的智能”与“机器智能”人机互补的集成智能。\n\
    - “协同智能”(cooperative intelligence, CI)，指“个体智能”相互协调共生的群体协同智能。\n- “分布智能”(distributed\
    \ intelligence, DI)，如广域信息网、分散大系统的分布式智能。\n\n1956 年，“人工智能”学科诞生，50 年来，在起伏、曲折的科学征途上不断前进、发展，从狭义人工智能走向广义人工智能，从个体人工智能到群体人工智能，从集中式人工智能到分布式人工智能，在理论方法研究和应用技术开发方面都取得了重大进展。如果说，当年“人工智能”学科的诞生是生物科学技术与信息科学技术、系统科学技术的一次成功的结合，那么，可以认为，现在“智能科学技术”领域的兴起是在信息化、网络化时代又一次新的多学科交融。\n\
    \n1981 年，“中国人工智能学会”(Chinese Association for Artificial Intelligence, CAAI)正式成立，25\
    \ 年来，从艰苦创业到成长壮大，从学习跟踪到自主研发，团结我国广大学者，在“人工智能”的研究开发及应用方面取得了显著的进展，促进了“智能科学技术”的发展。在华夏文化与东方哲学影响下，我国智能科学技术的研究、开发及应用，在学术思想与科学方法上，具有综合性、整体性、协调性的特色，在理论方法研究与应用技术开发方面，取得了具有创新性、开拓性的成果。“智能化”已成为当前新技术、新产品的发展方向和显著标志。\n\
    \n为了适时总结、交流、宣传我国学者在“智能科学技术”领域的研究开发及应用成果，中国人工智能学会与科学出版社合作编辑出版《智能科学技术著作丛书》。需要强调的是，这套丛书将优先出版那些有助于将科学技术转化为生产力以及对社会和国民经济建设有重大作用和应用前景的著作。\n\
    \n我们相信，有广大智能科学技术工作者的积极参与和大力支持，以及编委们的共同努力，《智能科学技术著作丛书》将为繁荣我国智能科学技术事业、增强自主创新能力、建设创新型国家做出应有的贡献。\n\
    \n祝《智能科学技术著作丛书》出版，特赋贺诗一首：\n\n智能科技领域广\n人机集成智能强\n群体智能协同好\n智能创新更辉煌\n\n潘宇辉\n\n中国人工智能学会荣誉理事长\n\
    2005 年 12 月 18 日\n\n## 前言\n\n生物现象和生物系统是人们创新的灵感源泉，对智能计算、数据挖掘、模式识别等领域的研究和发展起到巨大的促进作用。免疫系统与神经系统、遗传系统和内分泌系统一样同属于生物系统中的信息处理系统，同时也是一个复杂自适应系统，它旨在区分外部有害抗原和自身组织，从而清除病原并保持机体的稳定。Rowe\
    \ 认为，人体免疫系统的功能有几分像“第二个大脑”，它可储存过去经历的记忆，同时能对新的、异常的物质(抗原)作出响应。从计算的角度来看，免疫系统因其强大的信息处理能力而成为广受关注的研究课题，特别是免疫系统是一个高度并行、分布、自适应和自组织的系统，具有很强的学习、识别、记忆和特征提取能力，能完成许多复杂的计算。人们希望从免疫系统的运行机制和计算能力中获取灵感，从而开发面向应用的人工免疫系统和算法，以解决工程实际问题。目前，人工免疫系统在智能计算领域已经取得了一系列研究成果，经典算法主要有克隆选择算法、阴性选择算法、免疫学习算法、免疫网络调节算法等，并且在数据挖掘、模式识别、优化计算、入侵检测等领域得到了广泛的应用。\n\
    \n由于生物免疫机理本身很复杂，人们对免疫现象的认识也在不断深化。因此，目前的人工免疫系统还存在一些缺陷，如没有形成统一的计算框架，计算量大，先验知识无法充分利用等。这些问题如果通过深入认识相关免疫机理，进而改进现有免疫算法，将需要一个漫长的过程，而通过与其他智能算法的集成对人工免疫系统进行改进，则不啻为完善人工免疫系统的一条可行途径。目前，人工免疫系统已经与人工神经网络、模糊系统、进化算法等智能计算方法相结合，取得了一定的研究成果。本书在综合已有研究成果的基础上，对人工免疫系统的集成及其应用进行进一步研究，主要包括人工免疫系统的算法框架，免疫机理自身融合与集成，免疫机理与混沌算法、量子算法的集成，人工免疫系统在网络路由优化、土地分类评价、RFID\
    \ 入侵检测等工程领域的应用。\n\n本书共分 11 章，首先从 AIS 的生物原型入手，归纳提炼出基本原理，主要包括免疫识别、免疫学习、免疫记忆、克隆选择、多样性、分布式和自适应等，进而提出\
    \ AIS 的设计框架。然后在已有免疫算法所借鉴的生物免疫机理的基础上，建立既有利于理论探讨又有利于工程应用，且具有自身独特结构、独特设计、应用有效的人工免疫系统及其集成模型，并对这些模型展开系统性的理论研究、性能测试、比较及应用，进而建立针对动态路由评估、数据聚类、函数优化、土壤质量评价、农用地分等、RFID\
    \ 入侵检测等问题的人工免疫系统及其集成模型，并对其展开理论研究、性能测试、比较及应用。\n\n本书是国家自然科学基金项目（No. 60973132）、广东省自然科学基金课题（No.\
    \ 8451064101000630）、教育部高校博士点基金新教师课题（No. 20070561081）、华南理工大学中央高校基本科研业务费专项资金项目（No.\
    \ 2009ZZ0053）资助的研究成果，是杨海东博士、郭建华博士和邓飞其教授合作研究的工作结晶。特别感谢国家自然科学基金委员会的大力支持，同时感谢科学出版社对本书出版提供的支持和指导。\n\
    \n由于作者水平有限，书中不妥之处在所难免，恳请读者批评指正。\n\n作者\n2010 年 5 月于广州\n\n## 目录\n\n- 《智能科学技术著作丛书》序\n\
