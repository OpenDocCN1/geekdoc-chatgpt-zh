    \ name；receiver 参数为接收通知的入侵监视器名称，即 IntrusionMonitor. name；ontology 参数为更新的检测器；content\
    \ 参数为更新的类型，其中，new 表示新增了检测器，delete 表示删除，modify 表示修改，replace 表示全部替换。\n\n- 2) 信息收集器到入侵监视器的传送消息\n\
