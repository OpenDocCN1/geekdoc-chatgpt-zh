    # 7. 分布式和控制


    免疫系统由分布在机体各个部分的细胞、组织和器官等组成。免疫系统的分布式特性首先取决于病原的分布式特征，即病原是分散在机体内部各个地方的，对遍布全身的病原体的检测由遍布全身的效应细胞完成的过程即为分布式检测；其次，免疫系统的分布式特性使系统对攻击具有更强的鲁棒性，从而使得免疫系统不会因为局部组织损伤而使整体功能受到很大影响。免疫系统能够获得高度分布式和控制，有三种原理机制：①阴性选择；②协同刺激和其他发信号事件；③细胞克隆和死亡[22]。


    # 8. 自适应


    分散于机体各部分的淋巴细胞采用学习的方式实现对特定抗原的识别，完成识别的抗体以正常细胞变异概率的 10 倍进行变异[22]，使得其亲和度提高的概率大大增加，并通过分化为效应细胞和记忆细胞分别实现对抗原的有效清除和记忆信息保留，这个过程实际上是一个适应性的应答过程。由于免疫应答机制是通过局部细胞的交互起作用而不存在集中控制，所以系统的分布式进一步强化了其自适应特性。免疫系统产生自适应性的机理如下：①B
    细胞和 T 细胞的克隆扩增能力产生足够多的抗体清除抗原；②免疫系统能够学习识别和应答新的感染，并保持原有感染的记忆为未来的应答。'
  - '[PAGE 35]


    # 9. 免疫网络


    基于细胞选择学说，Jerne 开创了独特型网络理论，给出了免疫网络的数学框架[10,11]。在 Jerne 工作的基础上，Perelson 提出了独特型网络的概率描述方法[12]。免疫网络理论对免疫细胞活动、抗体生成、免疫耐受、自我与非我识别、免疫记忆和免疫系统的进化过程等作出了系统的假设，并且将免疫系统视为由免疫细胞或者分子组成的调节网络，免疫细胞以抗体间的相互反应和不同种类免疫细胞间的相互通信为基础，抗原识别是由抗原相互作用所形成的免疫网络完成的。独特型免疫网络理论认为，免疫细胞对识别信号（抗原或其他免疫细胞、分子）的应答有阳性反应和阴性反应两种。前者可以导致细胞增殖、细胞激活和抗体生成，而后者则导致免疫耐受或抑制。通过对免疫细胞或分子进行数学建模，免疫网络理论可以很方便地用于描述免疫系统的突现属性，如学习和记忆等[24]。免疫网络理论的重点特征在于：①通过抗体与抗原、抗体与抗体之间的相互作用、联系形成均匀网络、动态平衡；②内在抗原内影像的存在，如图
    2-3 所示。


    ![](img/cd91189832ca806b16310970569db51c_35_0.png)'
  - '[PAGE 36]


    # 10. 免疫调节机制


    免疫反应的机制本身是自组织、自我调节的，没有中心组织控制免疫系统的功能。免疫反应的调节大致分为两个方面：①体液免疫，由 B 细胞和它们的产物介导；②细胞免疫，由
    T 细胞介导。这两个方面对防御遵循类似的步骤——增殖、激活、分化、袭击、抑制和记忆等。


    # 11. 免疫动力学描述


    免疫系统的动力学描述主要是针对抗原的增殖和效应细胞对抗原的杀伤这类最基本的免疫现象展开的。在建立免疫系统的模型之前，把免疫系统视为一个复杂的巨系统，它包含以下部分：①各种免疫细胞；②多种免疫分子；③与基因有关的主要组织相容性复合物和自身抗原；④外界入侵的抗原。这些组分之间存在复杂的非线性的相互作用。利用非线性数学理论来研究免疫学，首先需要选择一个或若干个描述系统状态的变量。而免疫系统是由不同层次（如分子、细胞和器官）和每一层次所包含的多种组分形成的复杂系统，并且在不同层次和不同组分之间存在着复杂的相互作用。利用非线性数学工具来刻画这些变量的关系，能得出各种组分的时间演化过程，从中认识免疫系统的运动规律、机制和功能[1~4,7]。


    # 2.4 人工免疫系统分析


    # 2.4.1 形态空间


    在免疫系统中，B 细胞和 T 细胞是最重要的细胞之一，免疫系统的特异识别是 B 细胞和 T 细胞结合特异抗原的过程。B 细胞和 T 细胞与抗原之间的形状越互补，它们之间的亲和力越高。为了在
    AIS 中定量地描述 B 细胞和 T 细胞等免疫细胞分子和抗原之间的相互作用，Perelson 等于 1979 年提出形态空间（shape-space）模型[58]。形态空间描述抗原和与之结合的抗体分子之间的结合程度。形状和电荷分布，以及存在于合适互补位置的化学物质是决定抗原与抗体之间的相互作用的关键因素，Perelson
    称这些因素的集合为分子的泛化形态（generalized shape）。如用参数 L 描述一个抗体的泛化形态，则包括其长度、宽度和结合部位的凸起或者凹槽的高度等特征。抗体的泛化形态用
    Ab=<Ab1, Ab2, ..., AbL> 表示，抗原的泛化形态用 Ag=<Ag1, Ag2, ..., AgL> 表示。形态空间主要是为了描述抗原与抗体的形状及它们之间的相互作用而提出的，包括抗体的编码机制、抗体识别多样性、亲和力度量等。目前形态空间已成为研究
    AIS 的重要工具之一。'
  - '[PAGE 37]


    # 1. 抗体识别多样性度量


    在形态空间中，抗体与抗原之间只需大致匹配互补就可以，因而用少量的抗体可以识别数量比它大得多的抗原，这一性质称为抗体识别的多样性。在形态空间中，怎样度量抗体识别的多样性呢？这与抗体的识别区域
    \( V_\epsilon \) 相关。


    **定义 2-1** 抗体识别区域：在形态空间中，如果一个抗体决定基能特异地识别其周围区域 \( \epsilon \) 内的所有抗原决定基，则该区域被称为抗体识别区域（antibody
    recognition region），用 \( V_\epsilon \) 表示。


    设形态空间中抗原和抗体的总数为 \( K^L \)，其中，\( K \) 为表示抗体、抗原的字母表的大小，\( L \) 为抗体、抗原表示成字符串的长度。一个给定的抗体分子识别某些抗原集合
    \( V_\epsilon \)，因而覆盖形态空间的某些部分。其中，\( \epsilon \) 为匹配阈值。如果 \( \epsilon = 0 \) 则需完全匹配，一个抗体只能识别与之精确互补的抗原。给定参数
    \( \epsilon \)，一个抗体的覆盖面由式(2-1)给出[16]。


    ```

    \( C = \sum_{i=0}^{\epsilon} \binom{L}{i} = \sum_{i=0}^{\epsilon} \frac{L!}{i!(L-i)!}
    \) (2-1)

    ```


    式中，\( C \) 为抗体的覆盖面。式(2-1)也是抗体识别多样性的度量公式。根据式(2-1)，给定位字符串长度 \( L \) 和参数 \( \epsilon
    \)，覆盖整个形态空间所需的抗体的最小数目 \( N \) 定义为


    ```

    \( N = \text{ceil}\left( \frac{K^L}{C} \right) \) (2-2)

    ```


    式中，ceil 为取整运算符。


    # 2. 编码机制


    在形态空间中，抗原与抗体的识别、抗体的进化过程是建立在编码机制的基础上的，编码对于形态空间中抗体的多样性乃至于 AIS 模型的性能影响较大。目前在形态空间中抗体与抗原的编码方式主要有二进制编码、整数编码、实数编码和符号编码
    4 种，少数采用灰度编码[61]。在利用 AIS 解决具体问题时，形态空间中的抗原与抗体具体采用何种编码方式，目前还没有具体理论来说明，一般需要结合具体的问题而定。同时每种编码都有自己的优缺点。例如，在形态空间中采用二进制编码，其优点在于编码、解码操作简单，交叉、变异等操作便于实现；其缺点在于，不便于反映所求问题的特定知识，对于一些连续函数的优化问题等，可能影响
    AIS 模型的局部搜索能力。因此，如何将问题所对应的抗原、抗体进行编码是形态空间需要考虑的一个重要问题。


    # 1) 编码问题分类


    根据形态空间编码机制的不同，形态空间可分为：①二进制形态空间；②实数'
  - '[PAGE 38]


    形态空间;③整数形态空间;④符号形态空间;⑤灰度形态空间等。每种形态空间都有其特定的应用领域。例如,以实数形态空间为基础的 AIS 对函数优化最为有效,整数和符号形态空间对组合优化问题最为有效[84]。


    # 2) 编码性质


    每当形态空间采用一种新的编码机制时,首先需要论证该编码机制是否是有效的参考遗传算法的编码机制[2],关于形态空间的编码机制应遵从以下几条原则[102]。


    原则 1 非冗余性(nonredundancy)。从编码到解的映射应该是一对一的。目前,从编码到解的映射可能是下列 3 种情况之一:① 1 对 1 的映射;②
    n 对 1 的映射;③ 1 对 n 的映射。


    最希望的情况是 1 对 1 的映射,该映射确保在产生后代时不会进行无价值的操作。如果是 n 对 1 的映射,AIS 模型在搜索过程中会浪费时间。在这种情况下,由于两个个体在表现型空间中一样,但在基因型空间中不一样,因此在基因型空间的距离度量无法将两个个体处理为相同个体。n
    对 1 的映射是导致 AIS 模型早熟收敛的原因之一。


    原则 2 合法性(legality)。编码的任意排列都可解析为问题的一个解。该原则确保大多数现有的免疫算法可以被应用于该编码。


    原则 3 完备性(completeness)。任意解都对应着一个编码。该原则确保解空间中任意点对于 AIS 模型来说都是可达的。


    原则 4 因果性。变异带来的基因型空间中的小扰动在表现型空间中也对应着小扰动。该原则强调保护领域结构。也就是说,在变异算子带来有用的新信息的同时,它应该保留在对应表现型空间中的领域结构。


    当然,满足上述所有原则的编码机制是一个较为理想的状态,因此在形态空间引入新的编码机制时,只是尽可能满足上述四条原则。


    # 3. 亲和力度量


    表示抗原与抗体之间相互关系的形态空间也部分地决定怎样计算抗原与抗体之间的相互作用,即抗原与抗体之间亲和力的度量。抗原与抗体之间的亲和力基于形状互补,结构越互补,亲和力就越高。基于形态空间类型的不同,其亲和力的度量方式也不一样。目前许多
    AIS 模型都基于二进制形态空间和实数形态空间,本章以这两种形态空间为例,分析其亲和力的度量。


    # 1) 实数形态空间


    在实数形态空间中,用 Ab=<Ab1, Ab2, ..., Abl>表示抗体的泛化形态,用 Ag=<Ag1, Ag2, ..., Agt>表示抗原的泛化形态。则抗原与抗体之间的亲和力用对它们进行编码的实数向量之间的距离进行度量。例如,采用
    Euclidean 距离度'
  - '[PAGE 39]


    量、Manhattan 距离度量等，距离越大，亲和力越低。其中，Euclidean 距离度量为


    \( D = \sqrt{\sum_{i=1}^{l} \left( \mathrm{A} \mathrm{g}_{\mathrm{i}} - \mathrm{A}
    \mathrm{b}_{\mathrm{i}} \right)^{2}} \)


    Manhattan 距离度量为


    \( D = \sqrt{\sum_{i=1}^{l} \left| \mathrm{A} \mathrm{g}_{\mathrm{i}} - \mathrm{A}
    \mathrm{b}_{\mathrm{i}} \right|} \)


    # 2) 二进制形态空间


    在二进制形态空间中，一个抗体字符串同一个抗原字符串之间的亲和力可以用不同方式进行度量，目前应用最为广泛的是[23]:①Hamming 距离度量；②R-连续位匹配规则度量；③多重
    R-连续位匹配规则度量。Hamming 距离度量通过对二进制字符串进行异或操作来实现[35]，其具体计算公式为


    \( D = \sum_{i=1}^{l} \delta, \left\{ \begin{array} { l } { { \delta = 1 , } \quad
    { \mathrm{A} \mathrm{g}_{\mathrm{i}} \neq \mathrm{A} \mathrm{b}_{\mathrm{i}} }
    } \\ { { \delta = 0 , } } \\ { { \quad \text { 其他 } } } \\ \end{array} \right.\)


    R-连续位匹配规则度量是在字符串内通过识别互补方法匹配的连续位；多重 R-连续位匹配规则度量是考虑整个匹配数加上匹配区域长度，它定义为


    \( D = D _ { H } + \sum _ { i } 2 ^ { l _ { i } }\)


    式中，\( D _ { H } \) 为由式(2-5)得到的 Hamming 距离；\( l _ { i } \) 为包含超过一个匹配区域 \( i \)
    的长度[23]。


    # 2.4.2 抗体亲和力成熟


    # 1. 初始抗体的产生


    在免疫系统中，骨髓是免疫细胞和抗体生成的地方。免疫细胞和抗体的生成采用基因组的方式，每个基因处于不同的基因组中。骨髓中的免疫细胞、抗体是通过从每个基因组中随机选取不同的基因片段进行编码生成的。参照骨髓产生免疫细胞的原理，在
    AIS 中，通过使用骨髓模型创建字符串来代表初始抗体的产生[103~106]。


    最简单的骨髓模型是利用随机函数在 \( L \) 维形态空间 \( S^L \) 产生长度为 \( L \) 的属性字符串表示抗体。在实数形态空间，所需要做的工作是定义每个抗体
    \( \mathrm{Ab} \) 之间的间隔，\( \mathrm{Ab} \in \left[ 0, 1 \right]^L \)。在二进制编码形态空间，编码表示的抗体
    \( \mathrm{Ab} \) 的字符串应取自于一个提前定义好的符号表，如 \( \mathrm{Ab} \in \left\{ 0, 1 \right\}
    \) 或字母表。


    更高级的构建抗体产生模型的方法是采用基因库，从不同的基因库中随机选取基因片段进行组合来编码表示抗体[49]。Perelson 等利用遗传算法来研究采用基因编码的抗体的进化效果[106]，这种模型的一个重要特征是基因库中一定数目的基因能产生大量抗体。例如，在
    AIS 中，假设有 \( L \) 个基因库，每个基因库有 \( C \) 个'
  - '[PAGE 40]


    基因片段，那么可以表示 $C^L$ 个抗体。


    # 2. 抗体进化


    抗体进化包含变异和选择两个过程。变异过程主要是对抗体特异编码的基因产生极高频率点变异，其目的是使抗体对抗原具有更高的亲和力；选择过程主要是把对抗原具有较高亲和力的抗体保存下来。


    根据实际问题的不同，在形态空间中抗体具有多种变异机制，如交叉、逆位 (inversion)、点变异 (point mutation)、多点变异、子字符串重产生
    (交叉) 和简单置换等。某个抗体是否变异是由抗体变异率决定的，而抗体变异率通常与亲和力成比例。抗体变异率与亲和力之间的关系可以用指数函数式 (2-7) 来表示。


    $\alpha(D^*) = \exp(-\rho D^*)$ (2-7)


    式中，$\alpha$ 为变异率；$p$ 为指数函数的光滑系数；$D^*$ 为标准化的亲和力。其中


    $D^* = \frac{D}{D_{max}}$ (2-8)


    抗体的选择率也与亲和力成比例，抗体的选择率与亲和力之间的函数关系可以用式 (2-9) 表示。


    $P_s = f(D)$ (2-9)


    综上所述，在 AIS 中，抗体的选择和变异都与亲和力相关，亲和力越大，抗体选择概率越高，抗体的变异率越小，高亲和力的优秀抗体被保存至下一代，随着抗体的继续进化，抗体逐步走向亲和力成熟。


    # 3. 抗体的多样性维持


    在免疫反应中，由于抗原的刺激，抗体不断变异、增殖，形成抗体群更新。在群体更新中，适应度高的抗体浓度不断提高，这样不利于抗体多样性的维持，因此在抗体浓度达到一定值时，则需要抑制这种抗体的产生，反之则相应提高浓度低的抗体的产生和选择概率，通过这种机制来保证抗体群更新过程中的抗体多样性，避免未成熟收敛。在许多相关文献
    [16,21~23,25,49] 中都采用基于抗体浓度的选择机制来保证抗体的多样性，其具体计算方式如下。


    # (1) 计算抗体 V 的浓度


    $c_v = \left( \sum_{w=1}^{N} a c_{ij} \right) / N$ (2-10)


    $ac_{ij} = \begin{cases} 1, & (Ab)_{ij} \ge Tacl \\ 0, & (Ab)_{ij} < Tacl \end{cases}$
    (2-11)


    式中，Tacl 为一预先确定的值；$N$ 为抗体总数；$(Ab)_{ij}$ 为抗体 $i,j$ 之间的亲和力。'
  - '[PAGE 41]


    (2) 计算抗体 \( V \) 的期望繁殖率(选择率) \( e_v \)


    \( e_v = \frac{ax_v \prod_{s=1}^N (1 - as_{v,s})}{c_v \sum_{i=1}^N ax_i} \tag{2-12}
    \)


    \( as_{v,s} = \begin{cases} ay_{v,s}, & ay_{v,s} \geqslant \text{Tac2} \\ 0, &
    \text{其他} \end{cases} \tag{2-13} \)


    式中，Tac2 为一预先确定的值；\( x_v = (Ag)_v \)；\( s \) 为抑制细胞总数。


    抗体 \( V \) 的期望繁殖率也可简化为下式：


    \( e_i = \frac{ax_v}{c_v} \tag{2-14} \)


    式中，\( ax_v \) 为抗原抗体的结合强度(亲和力)。


    由式(2-12)和式(2-14)可以看出，高亲和力低浓度抗体得到保留，低亲和力高浓度的抗体被淘汰。采用基于抗体浓度的选择和抑制机制是保证抗体多样性的方法之一。


