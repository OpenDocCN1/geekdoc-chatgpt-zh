    # 6.2.5 算法的聚类分析过程


    通过免疫压缩形成的记忆网络，其规模远远小于聚类样本，是聚类样本的空间特征浓缩，对聚类样本的聚类分析即转换为对记忆网络的聚类分析，简化了聚类问题的复杂度。


    定义 6-5 最小生成树(minimal spanning tree, MST)。连通图 \( G \) 的一个子图如果是一棵包含 \( G \) 所有顶点(即抗体)的树，则称该子图为
    \( G \) 的生成树，生成树各边的权值总和称为生成树的权，权最小的生成树称为最小生成树 MST。


    聚类分析的步骤如下：


    +   步骤 1 基于记忆网络 \( M \) 及其抗体-抗体亲和力矩阵 \( S \) 构建最小生成树 MST。


    +   步骤 2 基于 MST 作剪枝分析，第一种方法是将权值大于剪枝阈值 \( \lambda \sigma_s \)(\( \lambda \) 是剪枝系数，一般取
    \( 2.5 \sim 3.5 \))的边剪断；第二种方法是，如果已知聚类样本的聚簇数为 \( k \)，将权值按从大到小排序，将排名前 \( k \) 位的边剪断。


    +   步骤 3 抗体聚簇，剪枝后的 MST 即由多棵相互断开的子树构成，组成每棵子树的抗体即形成一个抗体聚簇，此时记忆网络聚类完毕，设生成的聚簇集为 \(
    C \)，\( C = \{c_1, c_2, \cdots, c_k \} \)。


    +   步骤 4 样本或在线数据聚类，对于中心聚类而言，每个抗体簇的均值中心点即为聚类中心。如果是非线性分布的样本，对于每一个待聚类数据 \( x \)，计算它与
    \( M \) 中各抗体的亲和力，\( x \) 聚类到与它亲和力最大的抗体所在的聚簇，如果式 (6-9) 成立


    ```

    \( f(x, a_i) \equiv \max(f(x, M)), \quad a_i \in M, a_i \in c_k \) (6-9)

    ```


