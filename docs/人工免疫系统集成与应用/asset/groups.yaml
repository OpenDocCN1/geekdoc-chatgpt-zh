    \(\Omega_{\text{RIDS}}\) 为 \(\Sigma_{\text{RIDS}}\) 的内部结构，即检测器库。与生物免疫系统类似，\(\Omega_{\text{RIDS}}\)
    为一个分层和动态的结构。


