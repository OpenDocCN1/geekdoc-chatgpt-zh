    ## 4.3 分级变异量子进化算法


    本节以求解多目标优化问题为例，分析量子进化算法和免疫算子的特点，提出一种分级变异量子进化算法（classified mutation quantum-inspired
    evolutionary algorithm，CMQEA）来求解多目标优化问题。算法主要基于两个策略。首先，算法利用快速非受控排序和密度距离计算种群抗原-抗体的亲和度；其次，适应度排序后个体被分级，最优分级中的个体作为量子进化算法中的最优个体，大部分个体则实施量子旋转更新和免疫操作，其余分组中的个体实施免疫交叉操作。通过实施这两个策略，可以满足解的收敛性和多样性。


    ### 4.3.1 多目标优化概念及原理


    同单目标优化问题(single-objective optimization problems, SOP)不同,多目标优化问题(multi-objective
    optimization problems, MOP)存在多个最优解[120],通常需要满足解的收敛性和多样性。自 20 世纪 80 年代中期,Schaffer
    在他的博士论文中第一次将进化算法应用于解多目标优化问题,提出了向量评估遗传算法(vector evaluated genetic algorithm, VEGA)[121]后,出现了许多成功的多目标进化算法(multiobjective
    evolutionary algorithm, MOEA)。典型的多目标进化算法有 Deb、Srinivas 等提出的非劣排序遗传算法(NSGA)[122],Zitzler
    等提出的强 Pareto 演化算法(SPEA)[123]等。同其他多目标优化算法一样,这些算法设计的最主要的两个目标是解的收敛性和多样性[120]。


    量子进化算法(quantum-inspired evolutionary algorithm, QEA)[124,125]和基于免疫原理的量子进化算法[126-130]的本质是一种概率进化算法。同经典的进化算法相比它具有很多优点,如保持了群体多样性和全局寻优能力,利用规模较小的群体得到较好的性能,保存进化过程中的个体历史信息等[124,125]。QEA
    在单目标优化和组合优化中显示出其特性。但是,QEA 进化的随机性不好把握,收敛方向无法有效控制,容易陷入局部最优等问题还不容易克服。特别针对多目标优化问题,在
    QEA 中,由于最优解的局部-全局迁移可能破坏多样性,对 MOP 的求解有负面作用,因此并不适合高维多解的 MOP[131,132]。


    考虑含有 n 个自变量,m 个目标函数的多目标优化问题(MOP)[120]。


    定义 4-1(MOP) 对 MOP(x,y),Min y=f(x)。其中,x = (x1,x2,...,xn) ∈ X ∈ R^n,y = (y1,y2,...,ym)
    ∈ Y ∈ R^m,x 为决策(参数)向量,X 为决策空间,y 为目标向量,Y 为目标空间。


    定义 4-2(Pareto 关系) 称决策向量 x 优于 x'',记为 x > x'',当且仅当:① ∀i ∈ {1,2,...,m}:fi(x) ≤ fi(x'');②
    ∃j ∈ {1,2,...,m}:fj(x) < fj(x'')。


    定义 4-3(Pareto 最优解) 称 x ∈ X 为集合 A(⊆ X) 上的非受控解,当且仅当 ∀a ∈ A:a < x。特别地,若 A = X,称 x
    为 Pareto 最优解。


    定义 4-4(非受控解集与其前沿) 设 A ⊆ X,令 non(A) = {x ∈ A:x 是 A 上的非受控解},则集 non(A) 称为 A 上的非受控解集。对应的目标向量空间中的解集
    f(non(A)) 称为 A 上的非受控前沿。


    定义 4-5(Pareto 最优解集与 Pareto 前沿) 令 X* = {x ∈ X:∀x'' ∈ X s.t. x'' < x},则集 X* 称为 Pareto
    最优解集,记为 P_true,对应的目标向量空间中的解集 Y* = {y = f(x),x ∈ X*} 称为 Pareto 前沿,记为 PF_true。式中,P_true
    与 PF_true 由具体的多目标优化问题中的各目标函数所决定,是一个确定不变的集合。由优化算法所发现的非劣最优解组成的集合记为 P_known 与 PF_known[120]。


    ### 4.3.2 算法框架


    经典 QEA 显然忽视了先验知识对求解问题的帮助作用，基于免疫原理的 QEA 对最优个体的旋转更新对于多目标优化又不适用。因此，在经典 QEA 和基于免疫原理的
    QEA 结构的基础上，引入多目标优化亲和度排序和分级变异的免疫操作对 Q(t) 和 P(t) 进行操作，算法的具体步骤如下。


    ```

    procedure CMQEA

    begin

    步骤 1 Q(t)、P(t) 初始化

    (a) t ← 0;

    (b) 初始化 Q(t);

    (c) 由 Q(t) 生成 P(t);

    (d) 评价 P(t);

    while (not termination condition) do

    begin

    步骤 2 由 Q(t-1) 生成 P''(t)

    (a) t ← t + 1;

    (b) 由 Q(t-1) 生成 P''(t);

    (c) 评价 P''(t);

    步骤 3 对 P(t-1) ∪ P''(t) 进行亲和度排序, 生成新一代 P(t)

    (a) 确定 P(t-1) ∪ P''(t) 中个体的非受控级别并排序;

    (b) 确定 P(t-1) ∪ P''(t) 中个体在相同受控级别中的密度距离并排序;

    (c) 取排序后的前 N 个个体组成 P(t) 及相应的 Q''(t);

    步骤 4 对 P(t) 种群分级 P_l(t) P_m(t) P_n(t)，进行混合免疫操作生成 Q(t)

    (a) 经过亲和度排序的 P(t) 被分为 {G_1, G_2, ..., G_n} 共 n 个组，其中，G_1 作为 P_l(t)，G_2 ~ G_{n-1}
    作为 P_m(t)，G_n 作为 P_n(t);

    (b) 在 P_l(t) 中采用二进制随机竞赛选择方法对相应 Q_l(t) 进行个体间单点变异生成 Q''_l(t);

    (c) 将 P_l(t) 中的个体作为最优个体，对 P_m(t) 进行量子旋转变异生成 Q''_m(t)，对 Q''_m(t) 进行个体内交叉操作生成 Q''''_m(t);

    (d) 由 P_l(t) 和 P_n(t) 进行个体间全交叉生成 Q''_n(t);

    (e) Q''_l(t) ∪ Q''''_m(t) ∪ Q''_n(t) 生成 Q(t);

    End;

    输出 P(t);

    End。

    ```


    在初始化群体 Q(0)中,所有的量子染色体都被初始化为相同的常数( \( \alpha = 1/\sqrt{2}, \beta = 1/\sqrt{2} \)
    )。这表示一个量子染色体以相同的概率表示了所有可能的线性叠加态。


    ### 4.3.3 多目标优化亲和度排序


    适应度排序采用偏序排名[122]。排序过程如下:非受控目标向量暂时保存以查找下一个非受控目标向量,通过 Pareto 关系确定该向量在种群中的级别,该过程迭代进行,直到所有的个体都被分类到指定级别,即种群中每个个体的非受控级别(
    \( i_{rank} \) ),级别数越小则亲和度越大,保证保存最优个体。对于级别相同的个体,则计算其与同级别其他个体的密度距离( \( i_{distance}
    \) ),距离越大则亲和度越大,从而保证种群的个体多样性。因此,偏序排名 \( \geqslant_n \) 可定义如下: \( i \geqslant_nj,
    if (i_{rank} < j_{rank}) \) 或 \( ((i_{rank} = j_{rank}) and (i_{distance} > j_{distance}))
    \)。


    ### 4.3.4 种群分级


    种群分级过程如图 4-3 所示。经过亲和度排序的种群被分为 \( \{G_1, G_2, \cdots, G_n\} \)


    ![](img/cd91189832ca806b16310970569db51c_64_0.png)


    图 4-3 种群分级比较流程图


    共 n 个组，设种群个体数目为 N, G1 中的个体数为 t，则其余组的个体数为[132]


    $$S_i = \left| \frac{N-t}{t} \right|, i = 2, \cdots, n-1$$


    $$S_n = N - \sum_{i=1}^{n-1} S_i$$ (4-25)


    前 t 个个体作为量子变异的最优个体分组 G1，即 P_l(t)，其余的个体分在 G_2 ~ G_{n-1}，即 P_m(t)。设个体在 G_2 ~ G_{n-1}
    中，且排序为 i^{th}，则其观测器为 G_1 中的 \left| \frac{i-t}{(N-t)/t} \right| + 1。剩余的个体为 P_n(t)。


    ### 4.3.5 更新操作


    量子染色体的更新采用式(4-3)所示的旋转门 U(\Delta \theta_i)，则每一量子比特值的更新公式为


    $$\begin{bmatrix} \alpha_i^{''} \\ \beta_i^{''} \end{bmatrix} = \begin{bmatrix}
    \cos(\theta_i) & -\sin(\theta_i) \\ \sin(\theta_i) & \cos(\theta_i) \end{bmatrix}
    \begin{bmatrix} \alpha_i \\ \beta_i \end{bmatrix}$$ (4-26)


    式中，旋转角度 \theta_i 的值由 s(\alpha_i\beta_i)\Delta\theta_i 给出，其中，\Delta\theta_i 控制着算法收敛的速度；s(\alpha_i\beta_i)
    则决定了向全局最优解收敛的方向，\Delta\theta_i 和 s(\alpha_i\beta_i) 的取值可由表 4-3 查询得到。


    表 4-3 \theta 的查询表


    | x_i | b_i | f(x) ≥ f(b) | Δθ_i | s(αβ>0) | s(αβ<0) | s(α=0) | s(β=0) |

    |---|---|---|---|---|---|---|---|

    | 0 | 0 | False | 0 | 0 | 0 | 0 | 0 |

    | 0 | 0 | True | 0 | 0 | 0 | 0 | 0 |

    | 0 | 1 | False | 0 | 0 | 0 | 0 | 0 |

    | 0 | 1 | True | δ | -1 | +1 | ±1 | 0 |

    | 1 | 0 | False | δ | -1 | +1 | ±1 | 0 |

    | 1 | 0 | True | δ | +1 | -1 | 0 | ±1 |

    | 1 | 1 | False | δ | +1 | -1 | 0 | ±1 |

    | 1 | 1 | True | δ | +1 | -1 | 0 | ±1 |


    本节将 \delta 视为一个可以调整搜索步长大小的变量，采用


    $$\delta = \theta_0 \exp\left(1 - \frac{t}{T}\right)\exp\left(\frac{i}{N}\right)$$
    (4-27)


    式中，\theta_0 为初始旋转角度；t 为进化代数；T 为最大进化代数；i 为个体亲和度排序的位置；N 为种群规模。


