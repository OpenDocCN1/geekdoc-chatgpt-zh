    \sigma_\epsilon \) 为标准差基数；t 为进化的代数；n 为变量 x 中含有的分量个数；\( N(0, 1) \) 为产生的服从标准正态分布的随机数；\(
    \sigma_i^0 \) 对应于初始群体第 i 个分量的标准差。A 和 \( \sigma_i^0 \) 的具体取值根据被研究的问题来确定，通常 \( A
