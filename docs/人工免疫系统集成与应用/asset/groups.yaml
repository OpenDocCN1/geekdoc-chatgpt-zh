    # 第 3 章 自适应变尺度混沌免疫优化算法


    # 3.1 引言


    人工免疫算法[17,21,23,34,108]是在遗传算法的基础上发展起来的。免疫算法虽然较好地解决了遗传算法的退化现象，能迅速把问题的最优解限制在一个较小的空间范围里，但与遗传算法一样，它仍不能充分利用所求解问题的特征信息指导全局搜索，搜索是盲目的、随机的，在小区域仍不能克服不成熟收敛现象，在小空间搜索效率并不显著[17,23,34]。混沌变量看似杂乱的变化过程，其实却含有内在的规律性。利用混沌变量的随机性、遍历性和规律性可以进行优化搜索[109]，其基本思想是把混沌变量线性映射到优化变量的取值区间，然后利用混沌变量进行搜索。但是，该算法在大空间、多变量的优化搜索上，却存在着计算时间长、不能搜索到最优解的问题[110]。


    混沌免疫优化算法充分结合混沌搜索与免疫算法两种算法的优点，利用免疫算法的记忆特性和当代最优解指导混沌搜索。目前混沌免疫优化算法[54,111~113]采用有限区域内折叠次数有限的
    Logistic 模型产生混沌变量，其混沌特性不是十分明显。本章利用在有限区域内折叠次数无限的混沌模型来产生混沌变量，并采用自适应变尺度方法改变优化变量的搜索空间，不断提高搜索精度来解决求解最优值时收敛速度缓慢的难题，提出一种自适应变尺度混沌免疫优化算法（adaptive
    mutative scale chaos immune algorithm，AMSCIA）。


    # 3.2 混沌模型的选择


    一维混沌自映射的表达式为


    ```

    x_{n+1} = f(x_n) (3-1)

    ```


    在其相空间内总会有线性或非线性折叠现象，否则不可能产生混沌。在某种意义上，用于刻画模型“混沌性”的 Lyapunov 指数也可以看做是模型平均折叠次数的一种表示。当模型的平均斜率的绝对值大于
    1 时，Lyapunov 指数为正。一般常用的 Logistic 模型、Tent 模型、Chebyshev 模型等的映射折叠次数都是有限的。'
