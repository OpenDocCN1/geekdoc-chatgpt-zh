    \n## 11.3 基于免疫组织的 RFID 入侵检测多 Agent 模型\n\nRFID 系统的分布式特性，决定了 RFID 入侵检测也必须以一个分布式的系统结构与之相适应。生物免疫系统的分布式和无中心控制的结构特点也引导着入侵检测系统朝分布式方向发展。多\
    \ Agent 系统建模作为一种分布式复杂系统的建模技术，为人工免疫系统提供了一条重要的实现途径。本章参考生物免疫系统的组织结构，在多 Agent 建模方法的指导下，将\
    \ RFID 入侵检测进行目标分解，构建 RFID 入侵检测的多 Agent 系统(multi-agent system, MAS)模型。\n\n### 11.3.1\
    \ 基于免疫组织的 RFID 入侵检测目标层次模型\n\n获取系统目标是 MAS 建模过程的基础，系统目标不会像功能、处理过程和数据结构那样随着时间发生变化，它是比较稳定的，这也是系统分析往往从系统目标开始的原因。对\
    \ RFID 入侵检测而言，总的目标是识别出 RFID 系统中的非法操作，保护 RFID 系统免受攻击。然而这个目标过于抽象和模糊，无法提出具体的方法来实现，因此需要对目标进行分解和细化，建立目标层次模型，使各个子目标具有可实现性。\n\
    \n入侵检测系统与生物免疫系统的目标是相似的，均可抽象为对自体/非自体的识别，因此，生物免疫系统的功能目标为 RFID 入侵检测的目标细化提供了参考。从生物免疫系统的组织结构和免疫过程来分析，生物免疫系统对抗原的识别先后经历了免疫细胞产生、抗原提呈、抗原识别和免疫反应等过程，每个过程可视为一个阶段性的子目标。每一个子目标分别由各免疫组织、免疫器官和免疫细胞来承担。生物免疫系统的功能组织模型如图\
    \ 11-2 所示。其中，骨髓和胸腺产生免疫细胞，单核巨噬细胞实现抗原提呈，淋巴细胞则承担了抗原识别和免疫反应的任务。\n\n![](img/cd91189832ca806b16310970569db51c_181_0.png)\n\
    \n图 11-2 生物免疫系统的功能组织模型\n\n根据 RFID 入侵检测与生物免疫系统的目标相似性，如果将入侵分析数据源视为抗原，将检测器视为免疫细胞，则\
    \ RFID 入侵检测系统可分解为如下子目标：检测器（免疫细胞）产生、抗原提呈、抗原识别和免疫反应。RFID 入侵检测系统的子目标定义和分析如下。\n\n\
    - 1. 检测器产生\n\nRFID 入侵检测器产生即生成能识别抗原的检测器。与免疫细胞一样，检测器也可划分为多个类别，以构成一个多层与协同的防御体系，检测器产生包含了各类检测器的生成和维护。\n\
    \n### 11.3.2 RFID 入侵检测角色模型\n\n定义 11-1 角色指要承担一定责任的实体，责任指要完成的一定目标。角色可定义为式(11-1)所示的二元组\
