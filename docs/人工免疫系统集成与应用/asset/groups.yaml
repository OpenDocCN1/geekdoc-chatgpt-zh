    # 9.5 本章小结


    本章首先利用人工免疫模型存在的多样性和搜索能力强等优点构建一个 AIS 聚类模型。然后根据目前农用地分等模型存在的一些不足，提出采用 DEA 模型从投入产出的角度对农用地进行质量评价，针对
    DEA 模型存在的不足，提出通过构建虚拟单元来改进 DEA 模型。由于农用地分等评价单元较多，采用 DEA 模型进行农用地质量评价时，存在数据量大等问题，因此可以利用
    AIS 聚类模型对农用地分等单元进行聚类。针对农用地分等的要求，为充分利用 GIS 提供的强大的空间数据处理和分析能力，将之与 AIS 聚类模型、DEA 模型进行有效的集成，建立了基于
    AIS-DEA 的农用地分等模型，并将其应用于高要市农用地分等。通过实地验证，基于 AIS-DEA 的农用地分等模型的分等结果与实际情况大致相符。同时，分等结果表明，该模型具有以下优点：①能够有效地量化空间数据与非空间数据；②将
    DEA、AIS 聚类模型和 GIS 相结合，吸收了 DEA、AIS 聚类模型和 GIS 的优点，为农用地分等提供了一种新的方法。利用此模型对广东省高要市农用地进行分等，摸清了高要市农用地的数量、质量和分布情况，有利于提高农用地管理水平，并为合理配赋征收农业税、农用地征用补偿、农村集体土地使用权流转等工作提供了科学依据。'
