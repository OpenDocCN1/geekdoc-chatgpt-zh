    # 1.6 结构编排与阅读建议


    本书首先从 AIS 的生物原型人手,归纳提炼出其基本原理,主要包括免疫识别、免疫学习、免疫记忆、克隆选择、多样性、分布式和自适应等,进而提出 AIS 的设计框架。然后在已有免疫算法所借鉴的生物免疫机理的基础上,建立既有利于理论探讨又有利于工程应用,且具有自身独特结构、独特设计、应用有效的人工免疫系统及其集成模型,并对这些模型展开系统性的理论研究、性能测试、比较及应用,进而建立针对动态路由评估、数据聚类、函数优化、土壤质量评价、农用地分等、RFID
    入侵检测等问题的人工免疫系统及其集成模型,并展开其理论研究、性能测试、比较及应用。


    本书的内容和结构编排如下。


    第 1 章 绪论。首先,综述 AIS、人工免疫系统和算法、人工免疫系统集成的研'
