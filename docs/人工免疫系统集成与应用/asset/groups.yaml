  - '[PAGE 180]


    多方面的修改，使 RFID 应用的标准化实施困难；再次，加密认证存在着密钥泄漏和密钥被攻破的风险。因此，单纯依赖加密认证协议难以满足 RFID 的安全需求。物理方法因为需要额外的物理器件或额外的操作，可操作性不强。防火墙、病毒防护等网络安全技术对
    RFID 后端应用的数据安全起到一定的保护作用，但是对标签与阅读器之间的安全威胁无能为力。因此，RFID 安全技术仍需要探索和完善，有必要引入新的理论和方法来构建
    RFID 系统的安全方案。


    入侵检测(intrusion detection)是继防火墙、加密认证、病毒防护等传统安全保护技术之后的新一代安全保障技术，入侵检测能与防火墙、加密认证互补地发挥作用，共同为计算机系统构建一个层次防御体系。入侵检测只是针对应用系统的日志和审计作检测分析，并不增加应用系统本身的复杂度。将入侵检测作为
    RFID 安全方法，能在无须改变 RFID 现有技术标准和标签结构的前提下，提升 RFID 系统的安全防护能力，从而有效规避标签成本和市场推广的矛盾。


    生物免疫系统(immune system)与人侵检测系统有着惊人的相似性，生物免疫系统保护机体不受细菌、病毒等各种病原体侵害，而入侵检测系统保护信息系统不受黑客和计算机病毒的侵扰，两者都是在不断变化的环境中维持系统的稳定性[218]。借鉴生物免疫系统的免疫原理进行入侵检测技术研究已成为当今的热门研究方向之一。RFID
    系统涌现出的并行性、分布性、开放性等特性，与生物免疫系统特性有着更加惊人的吻合。生物免疫系统的免疫识别、免疫耐受、免疫学习、免疫应答等机理表现出来的自学习、分布式计算和局部寻优等优点，对
    RFID 入侵检测方法的研究有着十分重要的理论指导意义。


    综上所述，借鉴生物免疫机理开展 RFID 人侵检测方法的研究，不仅为 RFID 安全方案引入了新的理论和技术方法，同时也丰富了入侵检测的理论和方法，延伸了入侵检测的应用领域，有着十分重要的理论创新和应用价值。


    # 11.3 基于免疫组织的 RFID 入侵检测多 Agent 模型


    RFID 系统的分布式特性，决定了 RFID 入侵检测也必须以一个分布式的系统结构与之相适应。生物免疫系统的分布式和无中心控制的结构特点也引导着入侵检测系统朝分布式方向发展。多
    Agent 系统建模作为一种分布式复杂系统的建模技术，为人工免疫系统提供了一条重要的实现途径。本章参考生物免疫系统的组织结构，在多 Agent 建模方法的指导下，将
    RFID 入侵检测进行目标分解，构建 RFID 入侵检测的多 Agent 系统(multi-agent system, MAS)模型。


    # 11.3.1 基于免疫组织的 RFID 入侵检测目标层次模型


    获取系统目标是 MAS 建模过程的基础，系统目标不会像功能、处理过程和数'
  - '[PAGE 181]


    据结构那样随着时间发生变化，它是比较稳定的，这也是系统分析往往从系统目标开始的原因。对 RFID 人侵检测而言，总的目标是识别出 RFID 系统中的非法操作，保护
    RFID 系统免受攻击。然而这个目标过于抽象和模糊，无法提出具体的方法来实现，因此需要对目标进行分解和细化，建立目标层次模型，使各个子目标具有可实现性。


    人侵检测系统与生物免疫系统的目标是相似的，均可抽象为对自体/非自体的识别，因此，生物免疫系统的功能目标为 RFID 人侵检测的目标细化提供了参考。从生物免疫系统的组织结构和免疫过程来分析，生物免疫系统对抗原的识别先后经历了免疫细胞产生、抗原提呈、抗原识别和免疫反应等过程，每个过程可视为一个阶段性的子目标。每一个子目标分别由各免疫组织、免疫器官和免疫细胞来承担。生物免疫系统的功能组织模型如图
    11-2 所示。其中，骨髓和胸腺产生免疫细胞，单核巨噬细胞实现抗原提呈，淋巴细胞则承担了抗原识别和免疫反应的任务。


    ![](img/cd91189832ca806b16310970569db51c_181_0.png)


    图 11-2 生物免疫系统的功能组织模型


    根据 RFID 人侵检测与生物免疫系统的目标相似性，如果将人侵分析数据源视为抗原，将检测器视为免疫细胞，则 RFID 人侵检测系统可分解为如下子目标：检测器（免疫细胞）产生、抗原提呈、抗原识别和免疫反应。RFID
    人侵检测系统的子目标定义和分析如下。


    +   1. 检测器产生


    RFID 人侵检测器产生即生成能识别抗原的检测器。与免疫细胞一样，检测器也可划分为多个类别，以构成一个多层与协同的防御体系，检测器产生包含了各类检测器的生成和维护。'
  - '[PAGE 182]


    # 2. 抗原提呈


    RFID 抗原提呈即从 RFID 系统中获取操作日志，从操作日志中提取出能反映入侵特征的抗原元素。抗原提呈进一步细化为两个子目标，即操作日志采集和抗原元素计算。


    # 3. 抗原识别


    根据生物免疫系统的抗原识别过程，抗原识别应该完成两个目标，一是抗原的自体/非自体区分，二是抗原刺激过程中的免疫细胞亲和力成熟。相应地，RFID 抗原识别也分为两个子目标，即
    RFID 操作的合法/非法识别和检测器亲和力成熟。


    # 4. 免疫反应


    当免疫系统识别到非自体的病毒或细菌入侵后，免疫细胞会吞噬抗原。对于 RFID 入侵检测而言，识别到入侵类型的抗原后，常见的反应是入侵告警、入侵源追踪和入侵阻断。入侵告警将入侵现象以告警的形式通知系统管理员进行确认和处理。入侵源追踪则协助系统管理员进行入侵源追踪分析，并进一步获取入侵的证据。入侵阻断则根据预先设定的规则自动采取行动阻断正在进行的入侵，如拒绝连接或者进一步操作。另外，还需要提供对误报和漏报的及时校正，并将校正的结果记录在检测日志中，下一轮检测器生成时将避免误报和漏报检测器的重复生成。根据以上分析，RFID
    人侵检测的目标层次如图 11-3 所示。


    ![](img/cd91189832ca806b16310970569db51c_182_0.png)


    # 11. 3. 2 RFID 入侵检测角色模型


    定义 11-1 角色指要承担一定责任的实体，责任指要完成的一定目标。角色'
