    | 质量等级 | I | II | III | IV |


    将表 10-4 中 3 种评价方法得出的结果进行比较，可以看出，采用指数和法、基于 AiNet-GIS 的土壤资源评价模型和模糊综合评判法进行土壤资源质量评价，所得出的结果是相近的。


    指数和评价运算过程十分简单，其结果基本上能够反映土壤资源质量情况。但是，当众多评价因素中某一因素对土壤资源具有明显的限制性影响时，它的指数会很小，但采用指数和法计算出的总指数却不一定会很低，即其结果难以反映个别因子对土壤资源的限制性影响。


    模糊综合评判法比较理想地处理了评价因素与土壤资源质量等级之间的模糊关系，其结果的准确性有了很大的提高。而且，采用模糊综合评判法进行土壤资源质量评价还可以从其综合评判结果子集中直接判读出影响土壤资源质量的限制性因素及其限制强度，易于确定土壤资源的限制情况。从理论上说，模糊综合评判法是一种比较理想的评定土壤资源质量等级的方法。但是，具体应用时也有它的不足之处。在本章所进行的评价中，由于评价范围大，数据量大，对各种评价指标基本上无法采用其原始数据，而只能首先对各个因素的数值信息进行分等定级，并给各个等级统一赋值，然后再进行综合评定。例如，我们在计算机中输入了全省范围的地形图，并且通过地形分析得到了地面坡度、坡向等数值指标，但因为面上的数据过多，无法对海拔高度、坡度等评价因素与土壤资源质量之间的关系直接进行模糊运算，而只能在单因素指标归类分等之后再进行综合评定。在这种情况下，参评的因素指标与土壤资源质量等级之间的模糊关系不能很好地被体现出来，采用模糊综合评判法得出的评价结果无疑不能完全反映出这种评价方法本身的长处和优点。


    同时，采用指数和法和模糊综合评判法对土壤资源质量进行评价时，需要分别对评价指标进行赋权，其评价结果受人为主观影响较大。


    ## 10.5 本章小结


    本章充分利用 GIS 提供的强大空间数据处理和分析能力，将之与 AiNet 模型进行有效的集成，建立一个新的土壤资源质量评价模型——基于 AiNet-GIS
    的土壤资源质量评价模型，并首次将其应用于土壤资源质量评价。该模型的构建不但丰富了土壤资源质量的评价方法，而且拓宽了人工免疫系统的应用范围。本章采用 3 种评价方法所进行的广东省土壤资源质量评价中，AiNet-GIS
    模型的结果较为理想。根据实地抽样对照检验的结果，3 种评价方法所得出的评价结果均与广东省土壤资源的实际情况大致相符，其中也以 AiNet-GIS 模型得出的结果最接近实际情况。该模型能够揭示土壤资源质量状况，为土壤资源质量的合理开发利用与保护及农业的可持续发展提供可靠资料与决策依据。


    ## 第 11 章 基于免疫协同的 RFID 入侵检测系统


    ### 11.1 引言


    本章将以 RFID 入侵检测为研究对象，综合集成 Agent 技术、生物免疫机理、人工免疫网络算法和阴性选择算法，提供一个免疫集成的综合应用实例。无线射频识别(radio
    frequency identification，RFID)系统因为标签存储计算能力的脆弱性、无线信道的开放性、应用的分布性等技术特点，面临着比一般计算机网络更加广泛而复杂的安全风险。安全隐患已经成为制约
    RFID 技术推广应用的主要不利因素之一[210]。目前 RFID 系统的安全研究主要集中在加密认证和物理方法上，加密认证因为廉价标签有限的存储计算能力而难以实施；物理方法则需要额外器件，并主要针对保护隐私的场合，适用性不强。入侵检测是继加密认证、防火墙、病毒防护等安全防护之后的新一代安全保障技术，在计算机网络安全领域已经进入实用阶段，并表现出与其他技术互补防护、发现入侵前兆、检测未知攻击等优良特性[211]。RFID
    系统作为构建于计算机网络之上的信息系统，同样能够利用入侵检测方法提高其安全防护能力，并且入侵检测方法通过分析 RFID 系统中的操作与审计日志发现入侵现象，不要求修改
    RFID 现有的技术标准，能够在保持 RFID 标签低廉成本的基础上，提升 RFID 系统的安全防护能力。生物免疫系统与入侵检测系统的相似性及其经历亿万年进化所形成的自学习、自适应、分布式处理等能力，使基于免疫机理的入侵检测研究已成为当今热门研究方向之一[55,212]。RFID
    系统作为一类高度分布和开放的信息系统，生物免疫机理对于构建其安全防御体系有着非常重要的借鉴意义。


    本章将通过分析 RFID 系统中标签与阅读器之间的会话日志，提取出 RFID 系统的应用特征和攻击特征，参考免疫协同机理、免疫融合阴性选择算法（II-NSA）和目标进化免疫网络算法（OE-AiNet），基于
    RFID 系统的应用特征和攻击特征开展入侵检测研究，提出一个免疫协同的 RFID 入侵检测方法。该方法不仅能发现阅读器窃取、口令猜测、拒绝服务等已知的 RFID
    主动攻击，而且能识别出未知攻击，具备良好的自学习和自适应能力。


    ### 11.2 RFID 系统及其安全问题概述


    #### 11.2.1 RFID 系统的技术特性


    RFID 是 20 世纪 60 年代兴起的一项非接触式自动识别技术，它利用无线射频通过非接触双向通信实现目标识别。与条形码技术和 IC 卡技术相比，RFID
    技术具有精度高、适应环境能力强、抗干扰性强、操作快捷等诸多优点，已经被广泛应用于零售、物流、仓储、生产制造、自动收费、动物识别、图书馆管理等领域[213]。


    RFID 系统一般由 RFID 标签、阅读器和应用系统组成，如图 11-1 所示。


    ![](img/cd91189832ca806b16310970569db51c_177_0.png)


    图 11-1 RFID 系统模型


    标签通常存储一个固定的对象标识，并且有简单的数据存储和处理能力，实际应用中标签一般附在待识别物体表面。按照获得能量的方式划分，标签分为无源标签和有源标签。有源标签自带电源，能主动发送射频信号，识别距离长，但是其成本高，寿命短，主要应用于贵重物品远距离检测等领域；无源标签从阅读器的射频波束中获取能量，不能主动发送射频信号，具有成本低、体积小、寿命长等优点，应用非常广泛。本章仅对无源标签展开研究（如果没有特别说明，下面所述标签均指无源标签）。工作过程中，阅读器通过天线发送一定频率的射频信号，标签进入阅读器的射频信号磁场后被唤醒，接收阅读器发出的射频信号，同时凭借感应电流产生的能量将标签存储信息或者操作信息发送给阅读器，从而实现标签与阅读器的双向通信。阅读器读取标签信息后，将其传送给后端应用系统进行业务处理。后端应用系统一般包括
    RFID 中间件、数据库及应用软件，根据 EPCglobal 组织提出的物联网这一宏伟远景，未来的 RFID 系统将是一个构建于 Internet 网络之上的高度分布和共享的信息网络平台，将大大提升现代物流、供应链管理、零售业等领域的管理水平，降低管理成本[214]。


    从安全性方面来概括，RFID 系统具有以下技术特性：


    - (1) 电子标签存储计算的脆弱性。据统计，RFID 标签的大规模应用要求标签价格低至 0.05～0.10 美元(约人民币 0.40 元)，就目前的技术条件而言，这就要求标签的逻辑门数限制在
    5～10K，用于安全的逻辑门数小于 5K[215,216]。因此，不可能在廉价的电子标签内实现复杂的加密算法(AES 需要 20K 左右的逻辑门电路,DES
    和 RSA 则需更多),也就使得在标签、阅读器与后端应用系统之间难以实施有效的相互认证机制。

    - (2) 无线信道的开放性。电子标签和阅读器之间利用无线射频技术相互通信,其通信建立在开放的无线信道上,任何人都可以利用无线信道进行通信,任何人都可以从开放的空间信道截取信息。因此,RFID
    拓宽了网络攻击的范围。

    - (3) 应用的分布性。根据 EPC 物联网参考模型,整个 RFID 网络是一个巨大的分布式网络,中间件服务器、ONS 和 EPCIS 分布在不同地点,由不同的组织维护和控制。同时,由某个组织控制的中间件服务器、ONS、EPCIS、应用系统等资源又具备一定的自治性,可以不依赖于整个
    RFID 网络而运转。标签是便携设备,在物流领域,依附在商品上的 RFID 标签需要在制造商、零售商和消费者之间流转。因此,应用的复杂性也加大了 RFID
    安全管理的难度,如密钥、证书等难以维护。


    #### 11.2.2 RFID 系统面临的安全问题


    RFID 系统的上述特性,决定了 RFID 系统面临着比 TCP/IP 网络更加复杂的安全风险,RFID 网络更加容易遭受攻击。按照攻击方式分类,RFID
    可归纳为主动攻击和被动攻击两种类型。


    主动攻击主要包括[210]：


    - (1) 对获得的 RFID 标签实体,通过物理手段在实验室环境中去除芯片封装,使用微探针获取敏感信号,进而进行 RFID 标签重构；

    - (2) 通过软件,利用微处理器的通用通信接口,通过扫描 RFID 标签和响应阅读器的探询,寻求安全协议、加密算法及它们的弱点,进而删除 RFID 标签内容或篡改可重写
    RFID 标签的内容；

    - (3) 通过干扰广播、阻塞信道或其他手段,产生异常的应用环境,使合法处理器产生故障,拒绝服务(denial of service,DoS)攻击等。


    被动攻击主要包括：


    - (1) 采用窃听技术,分析微处理器正常工作过程中产生的各种电磁特征,来获得 RFID 标签和阅读器之间或其他 RFID 通信设备之间的通信数据；

    - (2) 通过阅读器等设备,窃取 RFID 信息、个人隐私、商品流通动态等。


    从以上攻击手段来看,攻击者主要利用标签计算存储的脆弱性和无线信道的开放性展开攻击,使 RFID 系统潜藏着巨大的安全风险,就应用而言,RFID 带来的安全威胁主要归纳为以下几种：


    - (1) 标签信息泄露。没有安全机制或者具有弱安全机制的 RFID 标签会向邻近的阅读器泄漏标签内容和一些敏感信息。

    - (2) 位置跟踪。非授权的阅读器根据 RFID 前后向信道的不对称性远距离窃听标签信息等。因为标签 ID 的唯一性,依附于个人物品上的 RFID 标签可能会泄漏个人身份,甚至会不知不觉地被跟踪。

    - (3) 标签信息篡改。缺乏安全机制的可写标签可能被非法篡改。

    - (4) 标签仿冒。利用主动攻击手段获取标签内部结构,从而重构和克隆标签,仿冒原有标签非法工作。或者用冒名顶替的标签欺骗缺乏安全认证的标签阅读器。

    - (5) 拒绝服务。攻击者通过干扰广播、阻塞信道或其他手段,产生异常的应用环境,使合法处理器产生故障,产生拒绝服务风险。


    除了上述 RFID 特有的安全风险以外,构建于 TCP/IP 网络之上的 RFID 后端系统存在着与 TCP/IP 网络类似的信息窃取、黑客攻击、病毒入侵等安全风险。而且,开放的标签进一步拓宽了黑客攻击的渠道,攻击者可以利用后端系统某些设计上的漏洞,开发出具有较大杀伤力的攻击程序,如缓冲区溢出、SQL
    注入等,通过标签进入后端系统进行攻击。


    总的来说,RFID 标签的脆弱性、无线信道的开放性和应用的分布性,使 RFID 系统面临着诸多复杂而又独特的安全风险。其安全风险比 TCP/IP 网络的安全风险更加复杂和宽泛,已有的网络安全技术很难复制到
    RFID 系统中来,必须充分考虑 RFID 的系统结构和应用特性,从整个 RFID 系统的角度探索新的 RFID 安全方法。


    #### 11.2.3 RFID 入侵检测研究的意义


    因为信息安全问题的存在,RFID 尚未普及到极为重要的关键任务中。目前 RFID 的主要应用领域对私密性要求不高,因此很少注意其安全和隐私问题,很多用户对
    RFID 的安全问题尚处于比较漠视的阶段。然而,对于 RFID 这种应用面很广的技术,安全隐患具有巨大的潜在破坏能力,如果不能很好地解决 RFID 系统的安全问题,随着应用的推广,未来遍布全球各地的
    RFID 系统安全可能会像现在的网络安全难题一样考验人们的智慧。麻省理工学院 Auto-ID Center 的创始人 Kevin Ashton 在 InfoSec
    世界大会上透露,RFID 要想使企业发生变革,还要在解决严重的安全问题之后,因为安全和隐私的考虑需要和实际应用的增长成比例[217]。


    目前,针对 RFID 系统的安全研究主要集中在标签、阅读器和 RFID 后端应用之间的加密认证协议上,但是 RFID 加密认证协议存在着许多难以解决的难题。首先,RFID
    标签低成本的市场要求及其有限的存储计算能力使复杂的加密认证协议难以实施;其次,加密认证协议的实施涉及标签设计、通信协议和应用流程等

