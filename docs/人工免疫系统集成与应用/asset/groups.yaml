    # 3. RFID 入侵检测的自适应性


    入侵监视器的自适应性主要体现在适应性检测器的动态性上，入侵监视过程中，适应性检测器将动态划分为记忆检测器和一般检测器，从而缩短了检测时间。


    定理 11-3 如果 RFID 系统的同类型操作连续发生 \(k\) 次，\(k>1\)，则适应性检测中采用亲和力成熟记忆比没有采用时完成一条业务日志的平均检测时间短。


    证明 设 L 检测器库的规模为 \(n\)，如果没有采用亲和力成熟记忆，则完成一条业务日志的平均检测时间 \(t_0 = t_m \times n/2\)，\(t_m\)
    为特征日志与一个检测器匹配计算所需的时间。


    如果采用了亲和力记忆，运行一段时间后，L 检测器分为一般检测器（GDL）和记忆检测器（MDL），记忆检测器规模为 \(m\)，\(g+m=n, 0<m<n\)。


    如果 RFID 系统的同类型操作连续执行 \(k\) 次，在第 \(i (i<k)\) 次，匹配的 L 检测器从 GDL 迁移至 MDL，则余下的 \(k-i\)
    次操作在 MDL 中即被检测，\(k\) 个业务日志完成检测的平均时间 \(t_k = t_m \times [i \times n/2 + (k-i) \times
    m/2]/k\)。


    因为 \(m<n\)，所以 \(t_k < t_m \times (n/2) = t_0\)，即适应性检测中采用亲和力成熟记忆比没有采用时完成一条业务日志的平均检测时间短。


    证毕。


    定理 11-3 阐明了周期性产生 L 检测器满足定义 11-13 的条件 2，因此 RFID 入侵检测模型具有自适应性。


    另外，入侵监视器的自适应性还表现在 L 检测器库和 H 检测器库的动态更新上，因为 L 检测器库与 H 检测器库均随着业务的变更而周期性地变化，保持了与当前业务的一致性，其误检率和漏检率都会比上一轮检测器低，满足定义
    11-13 的条件 1。


    # 11.6 基于阴性选择 RFID 适应性检测器生成方法


    L 检测器生成的关键在于 RFID 抗原编码的确定和 RFID 系统自体集的获取，确定了抗原编码和自体集后，对 II-NSA 输入符合抗原编码规范的自体集和期望漏检率，II-NSA
    则输出 L 检测器的编码集合及其匹配阈值矩阵。此外，为了保证检测过程的自适应性，还需要确定 L 检测器库的动态更新策略。'
