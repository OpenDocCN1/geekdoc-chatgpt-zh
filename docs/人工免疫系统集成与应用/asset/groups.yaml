    ## 7.3.2 免疫融合阴性选择算法框架


    II-NSA 算法将检测器视为抗体,按照未成熟和成熟将检测器划分为两个群体:未成熟群 A 和成熟群 M。为了更好地描述检测器,首先定义如下概念。


    定义 7-5 检测器的群内相似度。设有检测器 d 与成熟群 M, d∈M, 设 Md 为 M 去掉 d 后的子集,则 d 与 Md 的相似度称为检测器的群内相似度,记为
    rdM。


    定义 7-6 检测器的变阈值匹配。设检测器 d 的自体相似度为 rds,如果监视对象 a 与检测器 d 的相似度超过 rds,则称 a 与 d 匹配。


    A 中的未成熟检测器随机产生,首先计算其自体相似度,接着经历克隆选择,使其远离自体,然后将自体相似度最小的 ε % 个检测器,进入成熟群 M。检测器是否成熟不是通过设置匹配阈值,而是根据其在
    A 中与自体相似度的排名决定。M 更新后,需要进行免疫抑制,清除互相匹配的检测器,M 中的检测器也需要经历克隆选择过程,不过其选择的目标与 A 稍有差异,是在保证与自体集
    S 距离不减小的前提下,使其远离其他成熟检测器。


    II-NSA 算法中,输入为自体集 S 和期望漏检率 Pf,输出为成熟群 M 及其自体相似度矩阵 Rs。


    II-NSA 算法框架描述如下:


    - 步骤 1 进化代数 k=0,设定算法过程参数,包括:预定的期望漏检率 Pf,未成熟群 A 的规模 Na,成熟比例 ε %,淘汰比例 η %,成熟群 M
    的抑制参数 c。


    - 步骤 2 初始化检测器群, A = Ø, M = Ø。


    - 步骤 3 循环进化。


    - 步骤 3.1 随机生成检测器进入 A,使其达到 A 的种群规模 Na。


    - 步骤 3.2 计算 A 中检测器的自体相似度。


    - 步骤 3.3 A 克隆,将 A 克隆产生克隆检测器群 Ac,每个检测器 ai ∈ A 的克隆数 ni 如式(7-12)所示,即


    ```

    n_i = int(n_c * l / r_s)

    ```


    式中,l 为字符串长度;rs 为与自体匹配位数;nc 为克隆系数,与自体相似度较低的检测器将有较大的克隆系数。


    - 步骤 3.4 Ac 变异,Ac 中克隆检测器进行变异。


    - 步骤 3.5 Ac 选择,计算 Ac 中检测器的自体相似度,将父检测器(即 A 中的克隆父检测器)与其子检测器的自体相似度进行比较,如果子检测器中的最小自体相似度大于父检测器,则在
    A 中选择相应的子检测器替换父检测器。


    - 步骤 3.6 A 检测器成熟,从 A 中选择自体相似度最低的 ε % 的检测器进入成熟群 M,将成熟的检测器从 A 中清除。


    - 步骤 3.7 M 抑制压缩。按照自体相似度从高到低的顺序，检测检测器是否被其他检测器匹配，如果匹配则从 M 中清除。


    - 步骤 3.8 M 克隆、变异、选择，经历的过程与 A 的克隆、变异、选择类似。


    - 步骤 3.9 停止准则判断，计算 M 是否达到期望漏检率 P_f，是则循环终止。


    - 步骤 3.10 A 淘汰，淘汰 η % 的与自体相似度最高的检测器。


    - 步骤 3.11 进入下一轮进化。


    - 步骤 4 输出成熟群 M。


    以上描述了 II-NSA 算法的基本框架，算法的内部细节还需要进一步详细讨论，主要包括以下步骤:


    - (1) 步骤 3.4：未成熟群 A 的变异策略；

    - (2) 步骤 3.7：成熟群 M 的抑制压缩策略；

    - (3) 步骤 3.8：成熟群 M 的克隆、变异、选择策略；

    - (4) 步骤 3.9：停止准则中 P_f 的计算。


    ## 7.3.3 未成熟检测器的变异策略


    检测器成熟模仿抗体的亲和力成熟机制，主要是通过变异的方式降低检测器的自体相似度，一般按一定概率针对模式串每位随机变异。改变与自体匹配的位将有较大概率使检测器远离自体，II-NSA
    算法中对检测器一般位和自体匹配位采用不同的变异概率，自体匹配位的变异概率为 P_ma，一般位的变异概率为 P_mc，一般 P_mc = 0.1 ~ 0.15,
    P_ma = 0.2 ~ 0.3, P_ma > P_mc。这样，自体相似度较小的检测器变异幅度相对较大，以较快的速度远离自体集，而自体相似度较小的检测器变异幅度相对较小，有利于局部寻找更优的位置。


    为了区分自体匹配位和一般位，在步骤 3.2 计算检测器的自体相似度时，除了记录自体相似度 r_s 外，还记录与自体匹配的起始位置 p_s，这样就可以区分检测器的自体匹配位和一般位，示例如图
    7-3 所示。


    ![](img/cd91189832ca806b16310970569db51c_99_0.png)


    ## 7.3.4 成熟检测器的抑制压缩策略


    成熟群抑制压缩模拟了免疫网络的抗体抑制作用，主要是去除免疫网络中的自识细胞。具体到本算法而言，主要是清除相互识别的成熟检测器，使检测器之间的重复覆盖调整到一个合理水平。


    如果检测库中各检测器覆盖空间互不重叠，虽然检测器库的平均有效检测范围最大，但是将会产生较多的“黑洞”，难以达到检测性能的要求，因此必须让检测器之间保持一定的重叠覆盖，但是如果重叠覆盖面空间太大，检测器的独特性程度将下降，需要较多的检测器才能覆盖非自体空间，导致检测效率下降，因此检测器的重复覆盖范围需要调整到一个合理水平，也就是需要控制检测器之间相互识别的匹配阈值。


    根据免疫网络理论，检测器对抗原的识别匹配与对其他检测器的识别匹配应该是相似的，因此，本算法将检测器之间的匹配阈值设置为与其对抗原的匹配阈值大致相等，但是为了充分覆盖非自体空间，允许检测器之间的匹配阈值在一个较小范围内变化，设这个变化范围为抑制参数
    c，则检测器对其他检测器的匹配阈值 \( r_{bc} = r_S + c \)，c 越小，表示检测器之间的抑制效果越强烈。


    设两个检测器 \( d_1 \) 和 \( d_2 \)，如果两者的相似度为 \( r_{12} \)，自体相似度分别为 \( r_1 \) 和 \( r_2
    \)，且 \( r_1 > r_2 \)，如果 \( r_{12} > r_{bc2} = r_2 + c \)，则认为 \( d_1 \) 被 \( d_2
    \) 识别，去除(抑制) \( d_1 \)，否则，\( d_1 \) 和 \( d_2 \) 互不识别，均保留。具体的压缩步骤如下。


    - 步骤 1 将 M 中检测器按照自体相似度从大到小的顺序排序。


    - 步骤 2 对每个检测器 \( d_i \in M (i = 1 \sim N_m - 1, N_m \) 为 M 的规模)，作如下压缩操作。


    - 步骤 2.1 计算 \( d_i \) 顺序与 \( d_j \in M (j = i - 1 \sim N_m - 1) \) 作匹配判断，计算 \(
    d_i \) 与 \( d_j \) 的相似度 \( r_{ij} \)，如果 \( r_{ij} > r_S \) (\( r_S \) 为 \( d_i
    \) 的自体相似度，即自体匹配阈值)，则 \( d_i \) 被 \( d_j \) 匹配，将 \( d_i \) 从 M 中清除。压缩时保留 \( d_i
    \) 与其他检测器的最大相似度 \( r_b \) 和相应的起始位 \( p_b \)。


    - 步骤 3 压缩完毕，输出新的成熟群 M。


    经过压缩后，成熟群中自体相似度较大且群内相似度较大的检测器被清除。


    ## 7.3.5 成熟检测器的克隆、变异、选择策略


    成熟群 M 的克隆选择策略虽然与未成熟群 A 的策略类似，但是两者之间的目标和参数是有差异的。A 的克隆选择目标是使检测器远离自体集，而 M 的克隆选择目标是使检测器在保持自体相似度不上升的基础上，调整检测器的分布，扩大检测器库的整体覆盖范围，降低群内相似度，群内相似度在
    M 抑制压缩时已经得到计算。


    检测器 \( d_i (d_i \in M) \) 的克隆数 \( n_i \) 按式(7-13)计算。


    ```

    \( n_i = n_c \cdot r_{bi} \) (7-13)

    ```


    式中，\( n_c \) 为克隆系数；\( r_{bi} \) 为 \( d_i \) 的群内相似度。


    群内相似度越高，检测器的位置越需要调整，克隆数也就越大。


    改变群内相似位将有较大机会优化位置，而改变自体相似位则还有机会进一步远离自体，因此 $M$ 的变异根据三种不同的位采用不同的变异概率，分别为自体匹配位概率
    $P_{ma}$，群内相似位概率 $P_{mb}$ 和一般位概率 $P_{mc}$，其中，$P_{mb} > P_{ma} > P_{mc}$，一般 $P_{mb}
    = 0.2 \sim 0.3, P_{ma} = 0.1 \sim 0.15, P_{mc} = 0.05 \sim 0.1$。


    选择策略与克隆变异的目标一致,首先保证检测器的自体相似度不上升,在此基础上选择群内相似度最小的克隆子检测器,如果子检测器的群内相似度小于父检测器,则用该子检测器替换父检测器。


    ## 7.3.6 期望漏检率计算


    通过 II-NSA 获取的成熟检测器,除了检测器字符串外,同时获取了自体相似度 $r_s$,根据定理 7-1, $r_s$ 即可作为检测器的抗原匹配阈值,因此每个检测器的抗原匹配阈值可互不相同,充分发挥了各自的检测能力。


    NSA 算法中,当自体集规模 $N_s$ 较大时,期望漏检率 $P_f$ 如式(7-14)所示[44]。


    $$P_f = (1 - P_M)^{N_R}$$ (7-14)


    式中, $P_M$ 的定义如式(7-2)所示; $N_R$ 为检测器数。


    对于匹配阈值可变的检测器库,每个检测器库的 $P_M$ 是可变的,则 $P_f$ 的计算如式(7-15)所示。


    $$P_f = \prod_{i=1}^{N_R} (1 - P_{Mi})$$ (7-15)


    式中, $N_R$ 为成熟群 $M$ 的检测器数量; $P_{Mi}$ 为某个检测器与一个随机字符串的匹配概率,如式(7-16)所示。


    $$P_{Mi} \approx m^{-r_{si}} [(l - r_{si})(m - 1)/m + 1]$$ (7-16)


    式中, $r_{si}$ 为第 $i$ 个检测器的抗原匹配阈值。


    因为匹配阈值可变,在固定 $P_f$ 时,检测器数量 $N_R$ 不再是固定的,II-NSA 算法的结束准则不再以 $N_R$ 达到预定目标为准,而是以 $P_f$
    达到预定目标为准,当估算的漏检率低于期望漏检率时,循环终止。


    ## 7.3.7 免疫融合阴性选择算法参数与复杂度分析


    ### 1. 算法参数分析


    II-NSA 算法只需要输入自体集 $S$ 和期望漏检率 $P_f$,即可输出成熟检测库 $M$,而其他中间参数,包括未成熟群 $A$ 的规模 $N_a$,成熟比例
    $\epsilon \%$,淘汰比例 $\eta \%$,克隆规模、变异参数,以及成熟群 $M$ 的抑制参数 $c$,克隆规模、变异参数,这些参数的选择只对收敛的速度有影响,而对
    $M$ 的最终输出影响很小,可以将其设置为一个相对稳定的经验值,因此算法不需要太多先验知识,输入简单。


    NSA 算法中,除自体集 $S$ 和期望漏检率 $P_f$ 外,还需要输入匹配阈值 $r$,而 $r$ 实际是一个与自体分布相关的参数，在自体分布未知时很难确定，一般只能凭经验简单设置，如果设置不当，则会存在较多的“黑洞”，甚至无法产生检测器库。II-NSA
    算法中，匹配阈值是可变的，并且由算法根据自体集 $S$ 的分布自适应地确定，从而解决了匹配阈值难确定的问题。


    ### 2. 算法的复杂度分析


    算法的时间主要消耗在候选检测器自体相似度和成熟群内相似度的计算上，算法中的候选检测器包括循环中随机产生的和克隆变异产生的检测器，设候选检测器数量为 $N_{R0}$，自体集规模为
    $N_S$，则自体相似度的计算次数为 $N_{R0} \cdot N_S$。而成熟群压缩中，设 $M$ 规模为 $N_R$，则每个循环需要经历 $N_R \cdot
    (N_R - 1)/2$ 次群内相似度计算，$k$ 次循环则乘以 $k$ 倍，时间复杂度为 $O(N_{R0} \cdot N_S + k \cdot N_R(N_R
    - 1)/2)$。一般来说，$N_{R0} \gg N_R$，影响时间复杂度的决定性因素还在于 $N_{R0}$，单从时间复杂度表达式还很难看出 II-NSA
    的时间复杂度比 NSA 小，还需要通过实验来观察两者之间 $N_{R0}$ 的差距。


    算法的空间复杂度决定于自体集和成熟检测器的存储，II-NSA 的空间复杂度为 $O(l \cdot (N_S + N_R)$，II-NSA 在空间复杂度上与
    NSA 基本一致。


    ## 7.4 实验仿真分析


    ### 7.4.1 成熟检测器抑制参数经验值仿真分析


    成熟群抑制参数 $c$ 是控制检测器群内相似度的参数，对 II-NSA 的检测器生成效率、检测器库的规模、实际漏检率都会产生影响，为了保证 II-NSA 的易用性，通过实验分析确定
    $c$ 的经验值，实验设计如下。


    取字符串长度 $l=32$，固定期望漏检率 $P_f = 0.1$；

    自体集 $S$ 的规模 $N_S$ 分别取 $128, 56, 16$，分别代表了 $S$ 的规模取大、中、小，成熟群抑制参数 $c$ 依次取 $-1 \sim
    7$。对每个不同的 $N_S$ 和 $c$ 的组合进行实验，每个组合实验重复 $50$ 次。


    - 步骤 1 随机产生规模为 $N_S$ 的自体集 $S$。

    - 步骤 2 用 II-NSA 产生检测器库 $R$，记录 $R$ 的检测器个数 $N_R$ 和产生过程中候选检测器个数 $N_{R0}$。

    - 步骤 3 测试检测器库 $R$ 的漏检率，重复 $1000$ 次。

    - 步骤 3.1 随机产生一个非自体字符串 $s_n \notin S$；

    - 步骤 3.2 检测 $s_n$，若 $\forall d \in D, \text{LMATCH}(d, s_n)$，则报告一个非自体发现，并累计非自体发现次数
    $k$。

