    \ AiNet 减小，学习时间不会明显增加。\n\n## 6.2.5 算法的聚类分析过程\n\n通过免疫压缩形成的记忆网络，其规模远远小于聚类样本，是聚类样本的空间特征浓缩，对聚类样本的聚类分析即转换为对记忆网络的聚类分析，简化了聚类问题的复杂度。\n\
