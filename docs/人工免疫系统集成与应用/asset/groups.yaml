    图 11-12 抗原识别流程图


    信息收集器提呈抗原决定基 ag(ag ∈ AppLog)后，首先经历 P 检测器库的检测，一旦发生 PMATCH(ag, dp), dp ∈ DP, 则输出异常，即
    ag ∈ NonSelf; 否则，进入 L 检测。'
