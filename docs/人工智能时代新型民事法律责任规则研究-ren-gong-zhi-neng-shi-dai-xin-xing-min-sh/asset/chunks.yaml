    [12\\]](#txt001.html#footnote_content_txt001_12))新型民事法律责任规则设计具有调控社会和影响未来技术发展方向和限度的作用，关乎人类未来的发展和走向。未雨绸缪胜过事后纠错，人工智能时代的部分技术风险和社会风险造成的灾难可能是人类无法承受也无法弥补的。对人工智能未来发展的憧憬、向往和迷茫、困惑、忧虑需要在规则中寻求确定性。技术风险和社会风险需要通过规则进行预防和调控。\n\
