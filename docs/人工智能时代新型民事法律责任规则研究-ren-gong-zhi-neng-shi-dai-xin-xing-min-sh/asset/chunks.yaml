  trans: '

    智能驾驶中智能驾驶系统取代人类驾驶员的角色掌握驾驶控制权。当出现智能驾驶汽车未能识别行人或障碍物，因而没能及时避让造成损害等情形，智能系统的生产者和设计者对驾驶行为造成的损害是否需要承担民事责任？倘若将交通事故的发生归咎于智能系统的生产者或设计者，需要对其施加何种注意义务？智能驾驶系统生产者在交通事故中的行为义务是否等同于其在产品责任中的行为义务？“如果作此等同，意味着生产者的产品责任与驾驶人责任的趋同。”^([\[91\]](#txt006.html#footnote_content_txt006_91))智能驾驶汽车致人损害的关注重心从驾驶领域转移至生产和流通领域，智能驾驶系统的设计者、制造者、销售者等被纳入责任主体的范围。


    ## 1. 制造商责任


    人类驾驶员的身份从驾驶者向乘客转变，车辆控制权主体发生变化，民事责任也需要随之转移，即基于驾驶过错需要由人类驾驶员承担的过失侵权责任转移至生产者。智能驾驶系统的生产者对驾驶行为有相对独立的控制权。“考虑到未来自动驾驶汽车是政府承认的合法交通工具，使用人不应为自己在汽车运行中打电话、发短信等行为承担过失侵权责任。故此，理应由汽车制造商承担责任。”^([\[92\]](#txt006.html#footnote_content_txt006_92))“‘技术+制造商+出行服务’的三维模式使得汽车产品的生产者转变为集技术研发、生产制造和出行服务于一体的新型主体，他们在获得最大化市场价值的同时亦具备足够的风险防控能力和损害填补能力。”^([\[93\]](#txt006.html#footnote_content_txt006_93))法律规制的重心随之发生转移，即规制对象从驾驶者转向智能系统制造者。有学者认为：“就对第三方的侵权责任而言，汽车生产商应当是唯一的责任承担者。当然，如果事故最终判定是由存在缺陷的人工智能设备造成的，汽车生产商可以从设备生产商那里获得赔偿。”^([\[94\]](#txt006.html#footnote_content_txt006_94))


    ### （1）基于合理期待原则的民事法律责任


    2016 年 1 月，一辆白色特斯拉轿车在京港澳高速河北邯郸路段径直撞向一辆正在作业的道路清扫车，年仅 23 岁的特斯拉轿车司机高某宁不幸身亡。行车记录仪以及交警现场勘查的结果表明，事故发生当日天气状况良好，高某宁情绪正常；事故发生前特斯拉轿车并未紧急制动或避让。交警认定，该追尾事故中高某宁需要承担主要责任。事故发生后，高某宁的父亲高某斌在查看行车记录仪后产生了困惑：在事故发生前的
    20 多秒就能够看到道路清扫车尾部的指示灯，为什么有丰富驾驶经验的高某宁并未采取任何应对措施，即减速、避让或紧急制动？高某斌根据特斯拉轿车运行的“定速状态”，推测高某宁在驾驶过程中开启了智能驾驶功能，转移了其对路面状况的关注，而智能驾驶系统并未识别出道路清扫车，导致追尾事故发生。2016
    年 7 月，高某斌向北京市朝阳区人民法院提起诉讼，向特斯拉销售商索赔 1 万元。高某斌的代理律师认为，特斯拉销售商在营销时存在不实宣传的误导行为，应当对追尾事故承担责任。^([\[95\]](#txt006.html#footnote_content_txt006_95))事故发生后，特斯拉公司将智能驾驶系统的中文翻译名称由“自动驾驶”改为“自动辅助驾驶”。该案例警醒智能汽车制造者不能掩盖或淡化智能驾驶系统的缺陷，将智能驾驶作为汽车销售的噱头。在智能驾驶系统尚不成熟的阶段，夸大智能驾驶系统的功能，错误诱导车主或用户安装或更新智能驾驶系统并信赖智能驾驶系统，不符合保护消费者合理预期的要求，因此发生损害的，需要由制造者承担相应责任。


    ### （2）因改装而免除制造商的民事法律责任


    车辆被改造为智能汽车或者智能汽车的功能被实质性改造，除非有证据证明改造前的车辆已经存在缺陷，改造后的智能汽车在行驶过程中造成人身或财产损害的，汽车的原始制造商无需对智能汽车产品缺陷承担法律责任。“例如谷歌用奔驰汽车进行测试，安全责任由谷歌承担。”^([\[96\]](#txt006.html#footnote_content_txt006_96))美国的密歇根州和佛罗里达州关于智能驾驶的相关法案中对汽车被改造后制造商和改造者的责任进行了明确规定，经第三方改造后的人工智能产品，原制造商不再对其承担制造缺陷责任，除非能够证明该制造缺陷在改造前已经存在。


    ### （3）智能系统更新义务


    人工智能作出的决策或行为建立在数据化知识体系基础上，知识更新要求人工智能系统及时更新。知识更新的义务原则上由制造商承担。“从法律角度而言，解决这些问题的方法是让供应商提醒消费者这些人工智能系统的局限性。在快速变化的领域，如果供应商不提供及时更新系统知识的方法，可能会被认为是法律上不合理的（legally
    unreasonable）。”^([\[97\]](#txt006.html#footnote_content_txt006_97))


    ## 2. 智能驾驶系统程序设计者的责任


    智能汽车是包括硬件设备即车身和软件设备——智能驾驶系统的混合体。车身由智能汽车制造商制造，而智能驾驶系统通常由智能驾驶研发企业提供。^([\[98\]](#txt006.html#footnote_content_txt006_98))设计者是否有必要成为产品责任的主体？杨立新教授认为：基于人工智能技术和自动驾驶软件设计的重要性以及设计者和生产者可能出现分离的情况，需要增加设计者为产品责任主体，以应对自动驾驶的软件设计出现缺陷时的责任规则所需。^([\[99\]](#txt006.html#footnote_content_txt006_99))持不同意见的学者认为，需要区分对外和对内关系确定智能驾驶系统程序设计者的责任。“虽然无法排除事故是由于无人驾驶系统程序错误造成的，但其驾驶系统已经内化为无人驾驶汽车的一部分，对外亦是以无人驾驶汽车致行人死亡的形式表现出来，无人驾驶系统的开发者对外无需承担连带责任。”^([\[100\]](#txt006.html#footnote_content_txt006_100))智能驾驶系统程序设计者的责任可以通过其与生产者或测试平台等主体之间的协议确定并进行内部划分。在程序设计者恶意植入不合理或危险算法等情况下，其需要承担一般侵权责任而非产品责任。


    有学者认为，智能驾驶中对不可归责于人类驾驶员过错的损害应当由智能驾驶系统开发者、硬件设施生产者、基础设施提供者以及驾驶信息收集和处理者按照不真正连带责任的方式承担。^([\[101\]](#txt006.html#footnote_content_txt006_101))这就将责任主体的范围进行了进一步扩张，将影响驾驶行为的可能主体均纳入责任主体的范围。这一做法是否会导致参与主体的责任过重而影响行业发展不无疑问。持反对观点的学者认为，在智能驾驶汽车对道路交通状况作出误判导致损失的情况下，“把当前的过错责任规则应用到硬件或软件上都是不现实的，我们不会在计算机软件或自动汽车硬件上强加侵权责任，也不能给机器施加责任。”^([\[102\]](#txt006.html#footnote_content_txt006_102))


    ## 3. 智能驾驶汽车测试者的责任


    智能驾驶汽车进行公路测试时尚未投入流通领域。但是，测试行为具有负外部性，其高度危险性使得致人损害成为可能，如何承担民事责任的问题由此产生。“在全球首例无人驾驶汽车致行人死亡案件中，责任主体可区分为无人驾驶汽车测试者优步公司和汽车生产者沃尔沃公司，两者应当就无人驾驶汽车造成的损害承担连带责任，这是基于风险开启者和受益者担责之基本法理。”^([\[103\]](#txt006.html#footnote_content_txt006_103))换言之，智能驾驶汽车测试者与制造者需要就致害行为承担不真正连带责任，在对外承担连带责任后，根据协议和过错进行内部追责。


    ## 4. 智能机器自身的责任


    人类驾驶员、机动车持有人、机动车制造者或销售者等主体对机动车造成的损害承担责任以机动车的工具属性为前提。但是，随着智能机器决策和行为的自主性增强，智能汽车的工具属性假设被动摇，不再由人类支配和控制的智能机器造成的损害也不应继续归咎于人类。驾驶行为并无人类参与，使得归责丧失基础。“当四级以上的自动驾驶汽车发生事故、造成损害时，即使人类使用者处于驾驶位上，也无法诉诸过错责任，让人类使用者承担民事责任。”^([\[104\]](#txt006.html#footnote_content_txt006_104))


    智能机器是否应当以及如何对其自主决策和行为的后果承担民事法律责任？倘若智能机器（人）拥有独立的法律地位或人格，则其能够作为独立的民事责任主体就其自主决策或行为承担责任。即便其不具有独立的法律地位或人格，也可以通过相应的制度设计以其相对独立的财产承担责任。当然，不具有独立人格的智能机器以独立财产承担责任是否可行存在疑问。“如果自动驾驶汽车致损，而需要赔偿的金额超出了其责任基金，该怎么办？套用关于法人的法律技术，基金的出资人在此种情况下是承担有限责任还是无限责任？更进一步，自动驾驶汽车会破产吗？资不抵债应该会破产，那么破产以后，自动驾驶汽车会被民法‘放逐’吗？或者通过‘人格减等’把自己变身为其债权人的‘电子奴隶’？”^([\[105\]](#txt006.html#footnote_content_txt006_105))


    ## 5. 消费者责任自担


    消费者责任自担是指因人工智能产品而导致的损失由消费者自行承担。责任自担说认为，消费者实施购买行为时应当知悉人工智能产品作为一项新型产品可能存在风险，其坚持实施购买行为就需要对该行为的后果承担责任。“我认为将与人工智能相关的责任分配给所有者是一个合理的（plausible）公共政策选择——它简单、容易执行，并且初看起来具有某种程度的公平性。”^([\[106\]](#txt006.html#footnote_content_txt006_106))


    “现代风险社会要求确立一种制度，在这种制度中，因侵权致害而受到的损失，将不会落在不幸的受害者个人身上。”^([\[107\]](#txt006.html#footnote_content_txt006_107))消费者责任自担说可能导致人工智能产品市场萎缩。消费者购买人工智能产品时的理性预期是投入市场的人工智能产品是安全的，而非存在致损风险。责任自担的模式将风险积聚于对人工智能技术的研发和应用风险缺乏控制权甚至几乎毫无认知的智能机器（人）所有者或使用者身上，会使生产者缺乏控制风险的动力，消费者只能通过降低购买需求来控制风险。这既违背公平原则，又不利于人工智能技术应用的未来发展。


    ## （三）高度危险责任


    “高度危险责任起源于德国 1838 年公布的《普鲁士铁路企业法》中明确规定的‘容易致人损害的企业，虽企业主毫无过失，亦不得以无过失为免除赔偿的理由’。”^([\[108\]](#txt006.html#footnote_content_txt006_108))它在英美法中被称为异常危险责任，在德国法上被称为特别危险责任，是指因具有高度危险的行为或物造成损害而需要承担的侵权责任。它是协调风险的必要性与生产和生活的安全性的调试器。“危险责任的正当性，主要来自控制人开启了危险、控制人能够更好地控制危险、以及控制人从危险中获得了利益。”^([\[109\]](#txt006.html#footnote_content_txt006_109))


    高度危险作业的类型随着社会的发展与转型发生变化并不断产生新类型。为适应高度危险作业类型不断扩张的现实，《民法典》采用一般条款与具体列举相结合的方式，在保障明确性的同时保持适度开放性从而避免法律滞后于社会生活。“高度危险责任一般条款是现代侵权法发展的产物，文明和危险如孪生兄弟，高度危险是现代科技发展的必然产物。”^([\[110\]](#txt006.html#footnote_content_txt006_110))我国《民法典》第
    1236 条对高度危险责任进行了一般规定。^([\[111\]](#txt006.html#footnote_content_txt006_111))该一般条款抽象概括了具体类型的高度危险责任的共性因素，起到兜底作用，具有较强的涵摄力和适用性。


    在风险社会中高度危险责任一般条款的抽象概括性使其在新型风险规制中具有开放性和包容性。机器智能化导致的新型风险在理论上存在被解释为高度危险的可能。但是，能否将这一风险纳入《民法典》第
    1236 条关于高度危险责任一般条款调整的范围取决于对该法条的理解。


    ### （1）封闭类型体系解释下的适用可能性分析


    “高度危险责任一般条款的适用范围……并非毫无限制，应仅仅适用于《侵权责任法》第 9 章规范的‘高度危险活动’。”^([\[112\]](#txt006.html#footnote_content_txt006_112))根据这一理解，机器智能化引发的新型风险需要被纳入《民法典》“侵权责任编”第
    8 章规范的高度危险作业或活动的类型中，才能适用高度危险责任一般条款进行调整。


    ### （2）开放类型体系解释下的适用可能性分析


    高度危险责任一般条款被理解为增强对新型社会风险导致损害的受害人进行救济的途径，不受《民法典》“侵权责任编”第 8 章所规定的具体类型的限制。即便机器智能化引发的新型风险不能被涵盖在《民法典》“侵权责任编”第
    8 章规定的具体类型中，受害人也可以根据高度危险责任一般条款获得救济。


    与封闭类型体系相比，开放类型体系关于高度危险责任一般条款的解释更符合《民法典》的立法意旨。设计高度危险责任一般条款的目的在于应对社会发展过程中出现的新型风险类型，进而缓和法律规范的稳定性与社会发展的变化性之间的矛盾。倘若采用封闭类型体系的理解方式，则高度危险责任一般条款从适用的角度而言缺乏实质意义。因为新型社会风险符合《民法典》“侵权责任编”第
    8 章规定的具体类型的高度危险责任，直接适用具体类型的高度危险责任规定即可，没有必要适用一般条款；新型社会风险不符合《民法典》“侵权责任编”第 8 章规定的具体类型的高度危险责任，根据封闭类型体系的理解方式，亦应将其排除在调整范围之外。这就使得《民法典》“侵权责任编”第
    8 章关于高度危险责任一般条款的规定无法发挥作为兜底条款填补法律漏洞的功能。


    以学习算法和数据分析为基础的智能驾驶系统的决策或行为存在突破人类程序设计者算法设计的可能性，这一风险是人工智能时代出现的新型高度危险。将预防机器智能化导致损害的责任配置给智能驾驶汽车的生产者，能够促使其提高安全生产水平并给予受害人较为充分的救济，《民法典》关于高度危险责任的条款在这一情形下适用体现了法律对技术风险的包容性和负责性。“隐藏在深度学习和自动化决策背后的不可预测性风险则可以通过高度危险责任予以解决。”^([\[113\]](#txt006.html#footnote_content_txt006_113))


    人工智能时代因机器智能化产生的高度危险责任需要采用限额赔偿的方式来承担。人工智能技术研发和应用的风险需要由技术受益的主体分摊，而不应由推动技术进步的生产者独自承担。智能驾驶汽车生产者对因学习算法产生的自主性的可预见和控制范围有限，其承担责任的范围也应当有所限制。这样才能在技术创新与损害填补之间寻求合理的平衡。


    智能驾驶汽车生产者同时是产品质量责任和高度危险责任的承担主体。但是，二者的责任基础截然不同。产品质量责任是因产品缺陷而产生的责任，智能驾驶汽车生产者对此的控制力较强，承担的责任较重，即不仅需要承担连带责任还可能承担惩罚性赔偿责任。高度危险责任是因高度危险而产生的责任，智能驾驶汽车生产者对学习算法的控制力较弱，承担的责任较轻，即通常只需要承担限额赔偿责任。


