    [\[72\]](#txt005.html#footnote_quote_txt005_72)“中文房间”思想实验是 20 世纪 80 年代初由美国哲学家赛尔提出的，其过程是：将以英语为母语、对中文一窍不通的被测试者关闭在房间内。房间里有一本用英文写成的关于中文翻译程序的规则手册。房间外的人向房间内传递用中文写成的问题。房间内的被测试者可以通过规则手册进行解答，给出答案。这一过程中，房间外的人扮演的角色相当于程序员；房间中的人相当于计算机；规则手册相当于计算机程序。

