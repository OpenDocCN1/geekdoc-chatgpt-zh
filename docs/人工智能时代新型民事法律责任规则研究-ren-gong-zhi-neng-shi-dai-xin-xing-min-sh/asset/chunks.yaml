    梅迪库斯（Medicus）认为：“权利能力是指‘成为权利和义务载体的能力’。”^([\[55\]](#txt005.html#footnote_content_txt005_55))从逻辑关系的角度看，民事权利能力是民事主体享有民事权利的前提条件，民事主体的权利能力先于其享有的具体权利而存在。有学者以既有民事权利体系下人工智能缺乏对应的权利类型为由否定人工智能应当具有权利能力，颠倒了权利能力与权利之间的关系。


    ## （4）考察智能机器（人）能否成为法律主体，需要从人类中心主义和非人类中心主义两条路径分别进行分析


    在人类中心主义的框架下，不能简单地因为智能机器（人）不是生理意义上的人就否定其法律主体地位。“人之为人”，区别于其他物种或事物的根本属性是什么？倘若智能机器（人）与人在“人之为人”的根本属性上并无区别，则智能机器（人）亦应纳入法律主体的范畴。在非人类中心主义的框架下，单纯的“类保护”或“类关怀”作为判断法律主体资格的标准不再具有充分的正当性，命题转换为具有何种属性方能成为法律主体。


    ## （四）智能主体一元化视角下智能机器（人）法律人格思考：涵摄式路径


    在智能主体一元化视角下，人类是现实世界中唯一具有心智和灵性的社会存在，是法律主体制度设计的唯一原型和基础。智能机器（人）作为人类创造物，不具有与人类同等或者类似的心智和灵性，原则上不具有法律人格。但在特定情境下，为了满足人类利益的需要，可以通过拟制的立法技术，赋予部分社会主体法律人格。智能主体一元化体现了“人是万物的尺度”这一人类中心主义思想。


    智能机器（人）法律人格的涵摄式路径是指通过解读传统法律人格理论和规则体系中法律人格的内涵，分析智能机器（人）与传统民事主体的异同，考察智能机器（人）能否被纳入“人”的范畴中。这是借助逻辑三段论推理解决智能机器（人）法律人格问题的路径。其中，大前提是享有法律人格需要具有若干基本要素，小前提是智能机器（人）具有或不具有上述基本要素。大前提中基本要素的模糊性和争议性以及小前提中确定智能机器（人）是否具备基本要素的技术性是该路径实施的难点。


    ### 1. “人之为人”的正当理由


    民事主体即民法上的人是民事权利、义务和责任的载体。传统民法体系中，民事主体资格或法律人格制度的设计具有浓厚的人类中心主义色彩。在主体和客体二元划分框架下，人占据主体地位，人以外的其他事物是人类征服的对象，以客体的形式存在。法律主体资格的判断标准以人为基本参照系。传统的主体资格判断标准主要包括三个方面，即生理学标准、心理学标准和社会学标准。作为法律主体，从生理学角度而言需要具有人体和大脑；从心理学角度而言需要具有独立的意志；从社会学角度而言需要具有独立的社会角色。^([\[56\]](#txt005.html#footnote_content_txt005_56))


    基因是判断“人之为人”的基本标准。民法上的人以生物学意义上的人为基础或原型。在这一意义上，日常生活中，“人”通常指“自然人”（human being）。法律意义上的“人”是经过法律技术处理的结果，指向权利和义务的承担者（subject）。^([\[57\]](#txt005.html#footnote_content_txt005_57))但是，民法上的人并不简单等同于生物学意义上的人。根据基因标准的限缩与扩张，民法上出现了“人可非人”与“非人可人”的现象。各种法律体系对人的承认分为不同种类：①正常自然人（human
    being）；②变态自然人，例如白痴；③超自然存在；④动物；⑤无生命体，例如船舶；⑥法人（juristic person），例如社团（corporation）。^([\[58\]](#txt005.html#footnote_content_txt005_58))


    #### （1）基因标准的限缩：身份标准下的“人可非人”现象


    近代社会以前，“基因+身份”被作为判断能否取得法律人格的标准。基因标准将非生理意义上的人排除在民事主体的范围外。但是，生物学意义上的人并不必然能够作为法律主体而具有权利能力或责任能力，即“人可非人”。法律以“强而智”的人像预设为基础设计主体意义上的人，将具有“弱而愚”特征的生物学意义上的人排除在法律主体之外。法律主体资格是一种特殊的身份，不具有普遍性。古罗马法中，奴隶以客体的形式存在，与牲口并无差异；妇女、未成年子女的主体身份存在瑕疵；即便是作为一家之主的成年男性也可能遭遇人格减等。


    #### （2）基因标准的恢复：自由意志标准下民法上差异化的人


    近代社会，经过“3R 运动”^([\[59\]](#txt005.html#footnote_content_txt005_59))，身份标准不再被作为判断能否取得法律主体资格的依据。是否具有人类基因成为取得法律人格的唯一标准，具有决定性作用，即生理学意义上的人都具有法律主体资格。概言之，生物学意义上的人等同于民法上的人，具备转化为后者的充分条件。


    生物学意义上人与人之间事实上存在的差异在抽象法律人格中被抹平。人人平等、独立、自由的时代最强音在民事主体法律规则中得以体现。自然人的权利能力与行为能力分离。权利能力对应法律人格，一切具有人类基因的存在都应当无差异地取得民事主体资格，成为民法上的人；而行为能力体现了具有同等法律人格的不同类型群体在参与现实社会生活能力方面的差异。判断主体的行为能力时采用自由意志标准，即基于主体拥有自由意志的强弱区分主体行为能力的类型。换言之，根据抽象法律人格理论，基因标准是判断社会存在^([\[60\]](#txt005.html#footnote_content_txt005_60))是否具有法律人格的决定性标准，而自由意志则是对具备法律人格的主体进行进一步类型化细分的标准。基因标准使生物学意义上的人以“类存在”的方式获得普遍保护，成为权利、义务、责任的承载主体。自由意志不是决定社会存在能否具有法律人格的因素，它影响拥有抽象法律人格的主体直接参与社会生活的范围。“而当意志能力确实不具备时——例如新生儿或白痴的案件——法律所归属给这类变态自然人的意志便并非来自于某个确定的个人，而是来自于大众，或是大多数正常自然人。”^([\[61\]](#txt005.html#footnote_content_txt005_61))社会主体在人像预设上仍有“强而智”和“弱而愚”的区分，但是这一区分并不具有将某一群体排除在法律主体之外的作用，仅影响法律主体的行为能力及相应的责任能力。


    现代社会对消费者和劳动者等特殊群体利益的关注使法律人格制度从无差异的抽象法律人格向有差异的具体法律人格转向，法律规则设计在一定程度上实现“从契约到身份”的回归。这一回归的目的并不是复辟特权思想，而是对弱势群体利益进行特殊保护。具体法律人格理论与抽象法律人格理论在将基因作为判断法律人格的决定性要素方面不存在差异，两者的不同之处在于抽象法律人格理论中的人像预设是单色调、无差异的，而具体法律人格理论中的人像预设考虑了社会生活中主体事实上的差异，在法律人格上进行类型划分。


    #### （3）基因标准的扩张：延伸保护标准下的“非人可人”现象


    基因标准的扩张是指包含人类基因的非人存在或以人或物聚合形态存在的非人组织因直接或间接满足基因标准，在不同程度、不同范围内被视为民事权利主体。也就是说，非生物学意义上的人在特定条件下存在取得法律人格的可能性。一方面，人类基因在法律规则设计中的重要性使得人格利益出现被延伸保护的趋势。载有遗传基因的物质，如受精卵、尸体等，受人格利益延伸保护，不同于一般的物，不能简单地被视为客体。胎儿利益受到法律保护，在一定范围内视为具有法律人格。^([\[62\]](#txt005.html#footnote_content_txt005_62))“克隆人”在技术上的可能性以及伦理上的正当性方面存在争议，但是，一旦“克隆人”成为现实，因其本质上与人类并无差异，取得法律人格应当没有障碍。另一方面，社会生活中自然人既可以以独立个体的形态出现，也可以以聚合的形态存在。虽然自然人与团体在意思表示的方式上存在差异，但是在本质上具有同质性。作为自然人集合体的公司、合伙以及社会团体组织虽然不属于生物学意义上的人，但是法律在不同程度上承认其主体地位。赋予自然人聚合形态下的团体组织以法律主体资格是自然人主体资格延伸的结果。“法人制度从来没有威胁到人的主体地位，反而被视为是人的手臂之延展，进而被认为是实现人的价值的最伟大制度发明。”^([\[63\]](#txt005.html#footnote_content_txt005_63))


    ### 2. 基因标准下智能机器（人）的法律人格分析


    基因标准下的法律人格分析属于典型的属性论。属性论认为，社会存在能否成为法律主体取决于一定的属性，特定的属性能够将人与其他物种区分开。近代以前与法律主体相关的属性为基因和身份；近代以后基因成为影响法律主体资格的决定性属性，身份属性被淡化。而到了现代社会，将基因作为判断法律主体资格的唯一属性的做法遭到质疑，动物、人工智能能否成为法律主体的问题随之产生。


    以是否具有人类基因或是否属于人类基因延展所及的范围来判断人工智能是否具有法律人格具有明显的人类中心主义倾向。它深蕴“对人终极关怀”的价值理念，体现了法律规则为人类服务的目的以及对“类存在”的人的普遍尊重。“人是万物的尺度”，人类之外的存在都是一种客体性或工具性的存在。将基因标准推向极致，肉体也被赋予了特殊的重要性，成为人性不可或缺的组成部分。卡罗瓦（Karlowa）认为：“肉身并不仅仅是人性驻留的居所，它与灵魂一道组成了人性，而对于生活来说，灵魂则与肉身不可分离地结合在一起。”^([\[64\]](#txt005.html#footnote_content_txt005_64))基于此，有学者认为，人体是由细胞组成的有机体，拥有生物大脑。而由电路和元件构成的智能机器（人）的“大脑”即便拥有类似人脑的功能，仍不具备生物学要素。“只需这一点根据，就足以否定人工智能机器人的民法地位肯定说。”^([\[65\]](#txt005.html#footnote_content_txt005_65))


    基因属性是一种形式化的外在判断标准。它将人与其他物种区分开来，在法律上予以特别保护。其逻辑思路非常简单、明确，即法律是人类制定并为人类服务的，因而人的存在具有目的性、主体性，人之外的其他物种的存在具有手段性、工具性。这一人类中心主义的判断标准是基于“类”保护和关怀得出的不言自明、无需论证的结论，缺乏逻辑说理的成分。它是在预先设定的关系结构而非现实的关系结构中考虑而得出的结果。“一种关系性结构已经在那里预先存在着，这使我们认为机器人就只是‘机器’或者一个‘它’，而不是把它看作我们的‘同伴’或‘他’。”^([\[66\]](#txt005.html#footnote_content_txt005_66))


    严格的基因标准下的智能机器（人）与动物或植物类似，因不具有人类基因而原则上不具有法律人格。但是，严格的基因标准在立法上存在例外，非人类基因的社会存在并非绝对地被排斥在具有法律人格的主体之外。当今社会，有部分学者主张并在一些国家或地区的立法中体现的“动物权利论”或“生态权利观”就将部分与人类基因无关的社会存在纳入法律主体的范畴并加以保护。将智能机器（人）类比动物是为了和无生命的物相区别，而适用伦理规则和人道主义原则。事实上，“动物权利论”或“生态权利观”不过是人类基于整体利益或未来利益进行考量的结果，仍然以人类利益为出发点和终极目的。“那种赋予动物权利的法律体系可能也存在过，甚至目前也一定存在——例如古埃及的猫和暹罗的白象。在这类稀少的案例中，一定要将人类的意志归属于动物。”^([\[67\]](#txt005.html#footnote_content_txt005_67))动物权利以及动物取得权利主体资格命题的提出，并未对法律主体制度构成实质性冲击。动物权利观建立在人类利益本位的基础上，是人类利益折射的结果。


    法律规则是人类社会设计的产物，与人类基因相关性的强弱成为判断社会存在能否作为法律主体的标准。在这一理论预设下，不具有人类基因的社会存在原则上不具有法律人格，作为例外，基于利益考量可以规定非人类的社会存在在一定范围内具有法律人格。与动物一样，人工智能能否具有法律人格是人类设计的结果。人工智能即便被赋予法律人格，也隐含着将人工智能作为工具性、手段性而非目的性存在的预设。如同影片《机器管家》中的情形，赋予人工智能以法律主体资格不过是人类的“恩赐”。人工智能作为具有法律人格的主体并不具有与人类同等的地位，其权利的享有和行使都是人类设计的结果且最终是为了服务于人类社会。


    法律人格制度具有较强的价值宣誓功能，它反映了人人生而平等的价值理念，明确人是目的性而非手段性的存在。将人作为区别于其他生物或社会存在的独立类型予以特殊的“类保护”是主体与客体二元划分的基石。智能机器（人）的法律人格充其量是法律拟制的结果，属于拟制主体（fictitious
    person）。在人工智能语境下，我们并不排斥在法律上拟制出一个新的主体，或与法人一样，从拟制自然人的角度赋予新的主体或者法人以相同或者类似的法律地位。^([\[68\]](#txt005.html#footnote_content_txt005_68))视智能机器（人）为法律主体的立法技术本身蕴含着人工智能无法与人类智能比肩同行的意涵。正如拟制的法人主体资格和部分国家或地区赋予动物部分主体资格一样，视机器人为法律主体具有明显的工具性和手段性，是人类为实现一定的目的而采用的法律手段。“因为多元主体资格的承认在终极意义上都是对自然人尊严平等与人格自由的尊重。人工智能体作为新生的社会存在物，对其法律主体资格的赋予，仍需奉行与强化这一普适的人之价值。”^([\[69\]](#txt005.html#footnote_content_txt005_69))


    智能主体一元化以人类智能为中心进行主体制度设计，强调人类智能的本源性和绝对控制性，坚持人类中心主义立场。它建立在对人类智能绝对自信的基础上，将人类智能视为智慧的源泉，人工智能不过是人类智能的衍生物；人类智能具有不竭性和无限可能性的特征，能够永久地绝对控制人工智能。人工智能是人类智能的创造物，是人类征服世界的结果。无论人工智能技术如何发展，都无法摆脱人类智慧的光环。在弱人工智能时代，人工智能技术在人类可以控制的范围内，即便赋予机器人以法律主体资格或地位，也具有显著的工具性或手段性特点。确立机器人的法律主体地位不过是为了实现人类的某种目的，并未超越“人的终极目的性”。


    ## （五）智能主体多元化视角下智能机器（人）法律人格思考：新设式路径


    在人工智能时代以前，法律人格制度的演变围绕基因标准展开。近代以前，关于法律人格的争论集中在人类基因是否存在等级性或差异性之上，即能否将部分具有人类基因的生物学意义上的人排除在法律主体之外。进入近现代社会，生物学意义上的人普遍取得了法律主体资格，关于法律人格的争论转移到人类基因延伸保护的范围问题上，法人及其他社会组织等作为集合性的人被视为具有法律人格。动物等完全与人类基因无关的社会存在是否具有法律人格在理论上存在争议。即便关于动物的法律人格问题在部分国家立法层面有所体现，却未撼动传统的以基因为标准判断法律人格的法律体系。机器智能主体的出现打破了人类作为唯一智能主体的状态，以人类为中心的主体规则制度设计不再满足社会发展的需要。智能主体概念作为涵盖人类智能主体与机器智能主体的上位概念应运而生。


    “对人终极关怀”的人文价值观是通过基因标准判断法律人格的理论基础。这一标准具有明确性、可操作性的特征，但是，亦有过于武断之嫌，其并没有剖析人类当然具有法律地位的深层原因，即“人之为人”的根本性问题。倘若人工智能或其他形式的社会存在具有“人之为人”之根本的共性特征，则其在理论上亦存在取得法律人格的可能。


    从生物进化论的角度看，人类由动物进化而来，其作为区别于其他动物的独特物种的根源在于人脑的构造。基于人脑的特殊构造，人类在思维方面比其他物种更具优势，具有基于独立意志行为的可能性。“人之所以为法律主体，便在于其所被赋予之自治可能，换言之，在于其意志。”^([\[70\]](#txt005.html#footnote_content_txt005_70))人工智能时代以前，人类以外的其他生物及人类的创造物都不具有类似人脑的思维器官。以人脑的独特构造以及人类思维方式的特殊性作为区分人类与其他生物以及人类创造物的标准具有正当性。人工智能中智能的属性表明人工智能技术指向的对象恰恰是模拟人脑思维或人类智能的部分。倘若智能机器（人）具有类似于人类的思维或独立意志，则人工智能作为独立法律主体具有理论上的可能性。但是，智能机器（人）能否具有独立思维或独立意志在认识上存在分歧，它是认识论上的难题。持怀疑主义论调的学者认为，倘若人与智能机器（人）是相对独立的实体，那么人类无法确定智能机器（人）是否具有自主意识。诚如《庄子·秋水》中惠子问庄子：“子非鱼，焉知鱼之乐？”


    智能机器（人）虽然不具有人类基因，不能基于出生的事实享有主体资格。但是，其在思维、意志、智能方面与人类相似。“如果未来人和机器的分野仅仅是肉体（生物 vs.机械）的不同，否认机器不是人，或者人不是机器，都将折射出种族主义的特征，因为人和机器仅仅是肤色和生物构架的不同而已，在心智上并无不同，甚至人类无法追上机器人的进化步伐。”^([\[71\]](#txt005.html#footnote_content_txt005_71))人工智能技术的发展逐步缩小着人类智能与人工智能的差距，人工智能甚至在诸多场合中表现出超越人类智能的优势。智能主体类型多元化以人工智能摆脱对人类智能的依附，获得独立性为前提。人工智能不是人类智能的附属物或衍生品，人类智能并不天然优越于人工智能。它突破了人类中心主义立场，将以人工智能技术为基础的智能机器（人）作为独立于人类的新的族群。


    ### 1. 形而下的路径：结果导向的测试或思想试验


    智能机器（人）能否独立思维以及是否具有心智等抽象问题涉及对思维、心智等抽象概念的理解以及对其本质的认识。为避免因抽象概念引发认识分歧，部分学者或实务工作者回避思维、心智等抽象概念，以结果导向的测试或思想试验判断机器是否达到了智能的要求。


    图灵测试（Turing Test）通过比较智能机器（人）与人类输出内容（out⁃put）的模仿游戏（Imitation Game）判断机器是否达到智能的要求。图灵测试具有结果导向的特征，其关注的重点不在于输出内容的过程是否符合思维、心智等抽象概念的要求，而在于两个输出内容的比较结果是否相似或一致。迄今为止，结果导向的图灵测试仍然是判断机器是否能够达到智能要求的重要方法。

