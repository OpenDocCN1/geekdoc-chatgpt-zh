    \ 年第4 期。\n\n\uFEFF\n\n第六章　智能投资顾问中新型民事责任规则\n\n人工智能时代，因算法和数据分析的介入，合同主体之间的关系发生变化，合同责任规则需要随之发生变化。“现有法律框架的缺点在合同责任方面更是显而易见的，因为机器人现在能够选择合同当事人，磋商合同条款，缔结合同并决定是否以及如何执行所达成的合同，这些现象使得传统的合同规则无法适用。”^([\\\
    [1\\]](#txt007.html#footnote_content_txt007_1))智能合约（smart contract）的性质、法律构造、法律责任等问题引发学界热议。\n\
    \n智能合约是以代码形式存在的，用于实现在线财产交换的自动化应用程序。它是区块链技术应用于网络交易活动的产物，具有显著的技术性特征。智能合约的本质是合意。这种合意与传统合意的区别主要体现在代码化和智能化两个方面：第一，代码化。传统的合意是通过书面形式或口头形式达成的，以文字记载或者语言表达为载体。而智能合约中的合意的载体是编程代码。代码是智能合约主体内心意思的外在表现形式。内心意思的载体由自然语言转变为程序语言的代码转化过程中，是否会出现遗漏或偏差不无疑问。第二，智能化。智能合约的执行不依赖于合同当事人的履行行为。预先设定的程序会自动执行交易活动。程序中设定的条件成就，智能合约就会自动执行。这一因智能技术革命而出现的新兴事物在私法体系中如何定位？智能合约是合同吗？如何对智能合约进行法律规制？私法学者必须直面这一系列的基础理论问题，才能保障智能合约在法治的框架内生成和发展。\n\
    \n智能合约的基础理论博大精深，考虑到当下人工智能技术研发和应用的情况以及社会现实，本书选择智能投资顾问这一模式相对成熟且迫切需要解决方案的领域进行研究。\n\
    \n第一节　智能投资顾问的概念与特征\n\n科技改变金融。^([\\[2\\]](#txt007.html#footnote_content_txt007_2))智能投资顾问是人工智能技术应用于金融服务业产生的新型智能金融代理模式，人工智能程序取代自然人为投资者分析、整理数据以及提供咨询等中介服务。^([\\\
    [3\\]](#txt007.html#footnote_content_txt007_3))投资顾问的形式经历了从人工投资顾问到在线投资顾问再到智能投资顾问的转变。\n\
    \n科技公司开创了智能投资顾问业务的先河。Betterment 和Wealthfront 首先推出基于金融模型和算法的资产管理组合建议。此后，其他科技公司和金融公司纷纷推出智能投资顾问业务，从事该业务的主体呈现多元化趋势。在我国，商业银行凭借稳定且庞大的客户群和金融数据，在精准定位客户方面占据优势，建立了银行类智能投资顾问平台，如兴业银行的兴业智投、招商银行的摩羯智投。券商凭借其在证券市场分析方面拥有的优势，建立了券商类智能投资顾问平台，如广发证券的贝塔牛、平安证券的智能财富顾问系统。基金公司推出智能投资顾问平台，如天弘基金的风向篮子。电商平台企业推出智能投资顾问平台，如蚂蚁聚宝和京东智投。此外，还有以互联网金融公司为依托的智能投资顾问，如同花顺的iFinD\
    \ 智能投资顾问；以互联网财富管理公司为依托的智能投资顾问，如宜信的投米RA；独立的智能投资顾问，如理财魔方、弥财。\n\n在智能技术的应用降低金融服务成本、传统金融产品和服务供给不足以及国家对智能投资顾问业务包容和鼓励的监管态度等因素共同作用下，智能投资顾问业务迅速崛起。但是，以金融机构及从业人员为重点规制对象的传统金融法律体系难以解决智能投资顾问模式下出现的新问题。“当法律和监管难于发力时，可能面临责任失灵的问题，即法律对于行为主体的义务和责任设置不合理，从而导致风险外部化。”^([\\\
    [4\\]](#txt007.html#footnote_content_txt007_4))智能投资顾问成为当代社会金融科技关注的重点。\n\n一、智能投资顾问的概念\n\
    \n与智能投资顾问这一舶来概念相关或近似的概念有“自动化的投资工具”（automated investment tool）、“在线投资顾问”（online\
    \ investment advisor）、“数字投资顾问”（digital investment advisor）、“数字化建议”（digital advice）、“零售交易与投资平台”（retail\
    \ trading and investment platforms）以及“金融建议自动化”（automation in financial adivice）等。\n\
    \n从语义分析的角度看，“智能投资顾问”概念可以分解为“智能”和“投资顾问”（investment adviser）两个方面，它是智能技术在投资顾问领域的应用。而关于“投资顾问”的概念有广义与狭义之分。狭义的“投资顾问”限于投资咨询，广义的“投资顾问”包括投资咨询与资产管理。早期投资顾问是指单纯向客户提供咨询建议的个人或组织，采狭义投资顾问概念。美国《1940\
    \ 年投资顾问法》对“adviser”进行扩张解释，将资产管理纳入其中，采广义投资顾问概念。一般而言，欧美国家在广义层面使用投资顾问的概念，而亚洲国家在狭义层面使用投资顾问概念。\n\
    \n智能投资顾问是投资顾问业务转型、升级的结果。投资顾问业务大致经历了提供普遍化投资建议到提供个性化投资建议再到提供智能化投资建议和资产管理服务三个阶段。具体而言：第一阶段是提供不考虑投资主体个性化特征的普遍性投资建议，它纯粹基于金融市场信息进行数据分析作出，不针对具体投资主体。第二阶段是结合投资主体的个性化特征与金融市场信息而作出的定制化投资建议。第三阶段是智能系统基于个性化投资建议自主进行资产配置或管理。\n\
    \n智能投资顾问（robot advisor）简称智能投顾，通常又被称为智能理财、机器人理财，是指一项自动化、数字化的投资建议算法或程序，它能够基于投资者的财务目标、投资期间、收入、其他资产和风险容忍度等信息，为投资者提供投资建议，或为投资者创建并运营投资组合。^([\\\
    [5\\]](#txt007.html#footnote_content_txt007_5))从经济学的角度看，智能投资顾问描述的是智能系统为客户定制个性化资产配置方案并根据市场变化进行动态调整的系列活动，其基本流程是客户精准画像——自动配置资产——智能交易——动态智能调整。^([\\\
    [6\\]](#txt007.html#footnote_content_txt007_6))在法学研究领域，它是一个经常被使用但极少被定义的概念。\n\n\
    （一）智能投资顾问业务范围限定在投资咨询范围内\n\n在我国，荐股软件是智能投资顾问的雏形。自2007 年开始，由科技公司研发和销售的荐股软件在投资市场大量出现。它是专业投资者或消费者的辅助性分析工具，为投资者提供的咨询意见是实时交易信息在预先设定的算法或模型中运算的结果。起初，荐股软件销售商或供应商对运算结果并不产生实质影响，不是证券法试图规制的投资咨询业务。邱某某与上海某软件技术股份有限公司确认合同无效纠纷案中人民法院将荐股合同定性为销售合同并作出了上述认定。^([\\\
    [7\\]](#txt007.html#footnote_content_txt007_7))销售合同说将荐股软件视为一种商品，投资咨询意见由荐股软件提供，切断了投资者与投资机构以及自然人投资顾问之间的直接联系。\n\
    \n销售合同说能否真正揭示主体之间的法律关系？在技术面纱的遮掩下是否存在以销售荐股软件为名行投资咨询之实的情形？有学者认为，在销售合同说的理论框架下，对荐股软件提供者的身份识别会陷入形式化的困境，荐股软件提供者难以被识别为投资咨询顾问。这一顾名思义而非从合同关系本质出发进行身份识别的方式“纵容了实际从事投资咨询业务的机构借助技术力量间接提供投资建议，从而避免被认定为投资顾问，并免于承担相应的信义义务和合规义务”^([\\\
    [8\\]](#txt007.html#footnote_content_txt007_8))。\n\n根据《中华人民共和国证券法》（以下简称《证券法》）第161\
    \ 条^([\\[9\\]](#txt007.html#footnote_content_txt007_9))的规定，投资咨询机构及其从业人员禁止从事投资咨询服务以外的业务活动，这就排除了投资咨询机构及其从业人员从事资产管理义务的可能性。《证券投资顾问业务暂行规定》第12\
    \ 条^([\\[10\\]](#txt007.html#footnote_content_txt007_10))关于投资顾问告知义务的范围中明确要求“证券投资顾问不得代客户作出投资决策”。根据上述规定，智能投资顾问运营者只能从事荐股等业务，不能参与深度资产配置。\n\
    \n（二）智能投资顾问业务范围包括投资咨询和资产管理\n\n信托关系说认为，在智能投资顾问中，投资人与智能投资顾问经营者之间形成资产信托法律关系。投资人作为委托人，委托智能投资顾问运营者全权管理投资人账户，资产管理的收益和风险由投资人承担。“投资者将资金交给智能投顾经营者并形成资金池（pooling），智能投顾经营者在信托文件范围内做出投资决策并负责管理资金池内的资金，投资者要承受智能投顾经营者管理资产形成的损益。”^([\\\
    [11\\]](#txt007.html#footnote_content_txt007_11))全权委托账户模式下智能投资顾问服务流程为：①投资人注册账户并与智能投资顾问运营者签订服务协议；②智能投资顾问系统提供投资组合建议并发出交易指令；③执行交易指令；④投资组合再平衡；⑤出具投资业绩报告。信托关系说将智能投资顾问的业务范围从投资咨询扩展到资产管理。\n\
    \n1.投资顾问与智能投资顾问指向的对象一致\n\n美国《1940 年投资顾问法》（Investment Adivisers Act of 1940）改变了早期将投资顾问业务限于投资咨询的做法，采用广义的投资顾问概念。投资顾问法的调整对象不限于投资咨询，扩张至资产管理。2017\
    \ 年2 月，美国证券交易委员会（SEC）发布《智能投顾监管指南》（Guidance Update：Robo-Ad⁃visers），该指南明确“智能投顾是指通过基于网络算法的程序、利用创新技术为用户提供全权委托的账户管理服务的注册投资顾问”^([\\\
    [12\\]](#txt007.html#footnote_content_txt007_12))。它是集客户分析（customer prolifling）、资产配置（asset\
    \ allocation）、交易执行（transaction excuting）等为一体的自动化投资工具（automated investment tools）。持有注册投资顾问（RIA）牌照的智能投资顾问平台需要接受美国证券交易委员会的监管。“美国SEC\
    \ 要求智能投顾提供‘全权委托的账户管理服务’，体现了智能投顾下经纪商与投资顾问的深度融合……SEC 认为，未能成功识别本应视作投资顾问纳入美国《1940\
    \ 年投资顾问法》监管范围内的经纪—交易商并予以监管，会带来很大的隐患。”^([\\[13\\]](#txt007.html#footnote_content_txt007_13))\n\
    \n2.投资顾问与智能投资顾问指向的对象不一致\n\n亚洲国家，如日本、韩国，使用狭义的投资顾问概念并进行立法规制。如日本《金融商品交易法》对投资咨询业务和资产管理业务进行了区分。投资顾问与资产管理的概念各自独立且平行。投资顾问固守最初含义，业务限于投资咨询，不包括资产管理。将投资顾问限定在投资咨询的原初含义，则使从事该类业务的门槛相对较低且监管较为宽松。“凡是符合一般经营者标准的机构，均可以提供投资建议服务；但只有符合较高标准并拥有资产管理牌照的经营者，才可以从事客户账户的全权委托业务。”^([\\\
    [14\\]](#txt007.html#footnote_content_txt007_14))而在界定智能投资顾问概念时，上述国家却并没有将调整对象限定在投资咨询的范围内。无论是在日本还是在韩国，智能投资顾问都被认为是基于网络和算法而提供的自动化资产管理服务。^([\\\
    [15\\]](#txt007.html#footnote_content_txt007_15))智能投资顾问与投资顾问两个概念在指向对象上出现差异。投资顾问指向的对象为投资咨询，而智能投资顾问指向的对象为资产管理。智能投资顾问属于资产管理而非投资咨询业务，受到相对严格的监管。\n\
    \n（三）我国智能投资顾问概念的选择与取舍\n\n我国智能投资顾问市场实践借鉴了欧美集合投资咨询与资产管理的复合型业务模式，但是，在法律规范层面并未完成从狭义投资顾问概念到广义投资顾问概念的转变，造成法律与现实生活的隔离。\n\
    \n1.以我国智能投资顾问业务的实践为基础的考察\n\n智能投资顾问业务除了为投资者提供投资咨询和建议外，资产配置与管理服务也被纳入其中，是捆绑多种业务的“一站式投资理财服务”。有学者认为，我国智能投资顾问是投资咨询业务和资产管理业务的复合体，资产管理是智能投资顾问的本质功能，投资咨询是智能投资顾问业务的从属功能。以资产管理为中心定义智能投资顾问概念是基于我国本土实践的结果，符合我国国情。^([\\\
    [16\\]](#txt007.html#footnote_content_txt007_16))\n\n2.以我国智能投资顾问相关法律规范为基础的考察\n\
    \n根据我国《证券投资顾问业务暂行规定》第2 条的规定，证券投资顾问业务为投资主体提供投资建议等辅助性咨询服务，属于证券咨询业务基本形式之一。^([\\[17\\\
    ]](#txt007.html#footnote_content_txt007_17))证券投资顾问概念是证券投资咨询概念的下位概念。2016 年8月，证监会明确将智能投资顾问作为证券投资咨询业务的一种类型，将其定性为投资顾问服务，开展智能投资顾问业务的相关人员和机构需要具备投资顾问的资质和牌照。2017\
    \ 年中国人民银行、银监会、证监会、保监会和外汇局联合发布的《关于规范金融机构资产管理业务的指导意见（征求意见稿）》界定了资产管理业务的范围，明确资产管理业务是金融机构接受投资者的委托对其资产进行投资、管理的服务活动。"
