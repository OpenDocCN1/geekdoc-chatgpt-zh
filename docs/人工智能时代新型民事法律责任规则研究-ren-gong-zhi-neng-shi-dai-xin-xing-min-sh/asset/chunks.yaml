    # 第一章 人工智能基础理论


    ## 第一节 人工智能发展简史

    “人类对人工智能和智能机器的梦想与追求，可以追溯到 3000 年前。”^([\[1\]](#txt002.html#footnote_content_txt002_1))农业文明和工业文明时期，人工智能仅仅停留在幻想或准备阶段。“古代中国文献对人工智能奴仆地位的描述，和同时期的西方文学是大体一致的。”^([\[2\]](#txt002.html#footnote_content_txt002_2))但是，与西方国家侧重关注自动化、机械化不同，我国在“万物有灵”的思想影响下将关注重心转向了神魔妖仙。直到网络文明时期，人工智能才转变为现实。

    自 20 世纪中叶人工智能的概念被正式提出至今的 60 年间人工智能发展经历了三起两落。^([\[3\]](#txt002.html#footnote_content_txt002_3))史忠植教授等将人工智能的发展史分为孕育期（1956
    年以前）、形成期（1956 年～1969 年）、基于知识的系统（20 世纪 70 年代）、神经网络的复兴（20 世纪 80 年代）和智能主体的兴起（20 世纪
    90 年代）等 5 个时期。^([\[4\]](#txt002.html#footnote_content_txt002_4))另有学者根据人工智能技术在社会生活中发挥作用的程度，将其分为初步发展阶段、学习阶段和自主学习阶段。在初步发展阶段，人工智能技术主要用于“文字处理和数据分析”；在学习阶段，人工智能技术基于大数据和算法完成操作者的指令；在自主学习阶段，以“人机对接”或“超人类发展”为代表。^([\[5\]](#txt002.html#footnote_content_txt002_5))本书将人工智能的发展时期分为准备期（20
    世纪 50 年代之前）、符号化逻辑学派主导时期（20 世纪 50 年代至 20 世纪 70 年代）、经验主义主导时期（20 世纪 70 年代前后至 20 世纪末）和人工智能飞速发展期（21
    世纪初期至今）。


    ### 一、准备期：图灵机时代

    1956 年在达特茅斯召开的人工智能夏季研讨会在人工智能发展史上具有里程碑意义，它标志着人工智能学科的诞生。在此之前的时期通常被认为是人工智能的准备期或孕育期。“这一时期的主要成就是数理逻辑、自动机理论、控制论、信息论、神经计算、电子计算机等学科的建设和发展，为人工智能的诞生准备了理论和物质基础。”^([\[6\]](#txt002.html#footnote_content_txt002_6))


    #### （一）形式逻辑准备

    在西方，关于人工智能的构想最早发端于古希腊。亚里士多德在《物理学》一书中区分了事物的“物质”与“形式”。这一区分为“符号计算和数据抽象”提供了哲学基础。他在《逻辑学》一书中创造性地提出“三段论”推理的形式逻辑。亚里士多德的《工具论》一书，为形式逻辑提供了理论基础。文艺复兴时期，笛卡尔震撼地提出“我思故我在”的观点，彻底分离物理世界与思维世界，构建了现代思维和智力理论的基本框架。专注于符号和逻辑的埃达·洛夫莱斯（Ada
    Lovelace）伯爵夫人早在 19 世纪 40 年代便预言了人工智能的诞生。^([\[7\]](#txt002.html#footnote_content_txt002_7))我国在先秦时期也出现了形式逻辑的雏形，如《公孙龙子·白马论》中赵国辩士公孙龙提出“白马非马”说。^([\[8\]](#txt002.html#footnote_content_txt002_8))


    #### （二）数理逻辑准备

    文艺复兴时期，科学主义代替神秘主义成为思考人类、自然界及其相互关系的方式。数学成为理解和分析自然现象以及人的行为的工具。哥白尼（Mikołaj Kopernik）揭示了事物本身与对事物的观点之间的区别，探索用数学描述世界而非用感官感知世界。培根（Francis
    Bacon）创设了“实体规范算法”。19 世纪至 20 世纪初期，科学意识的觉醒以及数学的发展为研究人工智能提供了必要的智力支持。布尔（Boole）创立了新的逻辑代数系统——“布尔代数”，通过符号语言描述思维推理的法则。这一时期“罗素（Bertrand
    Russell）、怀特海（Alfred North Whitehead）和哥德尔（Kurt Gödel）集大成并对之做出杰出贡献的数理逻辑，是经典人工智能的理论基础”^([\[9\]](#txt002.html#footnote_content_txt002_9))。图灵将“离散量的递归函数”作为智能描述的基础。他在
    1936 年发表了“论可计算数及其在判定问题中的应用”一文，阐释现代计算原理，构想数字计算机。同年，阿隆佐·邱奇（Alonzo Church）在“关于判定性问题的解释”（A
    Note on the Entschei⁃dungsproblem）一文中证明了类似论题。^([\[10\]](#txt002.html#footnote_content_txt002_10))


    #### （三）计算设备机械化

    公元前，我国就创造了最早的复杂计算工具——算盘。但是，直到 17 世纪代数处理才实现机械化。1623 年，德国数学家威廉·斯奇卡（Wilhelm Schickard）发明了能够计算加法和减法的“计算时钟”。1642
    年，法国数学家布莱兹·帕斯卡尔（Blaise Pascal）设计并制造出能运算加减法的设备。^([\[11\]](#txt002.html#footnote_content_txt002_11))1694
    年，戈特弗里德·威廉·莱布尼茨（gottfried wilhelm leibniz）猜想机器通过演算可以自动进行逻辑推理得出结论，最终发明了“莱布尼茨齿轮”。

    1834 年，数学家查理斯·巴贝奇（Charles Babbage）设计出第一台用于求解代数的可编程计算机器。1936 年，图灵提出构建以“0”和“1”表示的二进制符号为基础的虚拟数学系统，即通用图灵机设想（turing
    machine）。20 世纪 40 年代计算机和存储设备的出现拉开了数字化时代的大幕，冯·诺依曼（John Von Neumann）于 1946 年研制出第一台电子计算机（ENLAC）^([\[12\]](#txt002.html#footnote_content_txt002_12))。


    #### （四）神经网络模型准备

    1943 年，沃伦·麦克洛奇（Warren McCulloch）和瓦尔特·皮兹（Walter Pitts）在《数学生物物理公报》（Bulletin of Mathematical
    Biophysics）上发表论文“神经活动中内在观点的逻辑演算”（A Logical Calculus of the Ideas Im⁃manent in
    Nervous Activity）。该文在总结神经元基本生理特征的基础上，通过数学模型将神经元结构形式化，构建神经网络模型。


    #### （五）信息论和控制论准备

    1948 年，香农发表了奠定信息论学科基础的论文——“通信的数学理论”（A Mathematical Theory of Communication）。他在心理活动与信息之间建立联系，通过数学模型描述心理活动，为人工智能的出现提供信息论方面的准备。同年，美国数学家诺伯特·维纳（Norbert
    Wiener）开创了控制论，将其作为研究机器和生命科学一般规律的科学。


    ### 二、唯理主义符号化逻辑学派主导时期：探索一般思维规律

    人工智能的哲学基础存在唯理主义和经验主义的分野。早期关于人工智能的思想和实践依循唯理主义的逻辑路径，强调逻辑和推理的重要性。建立在唯理主义基础上的经典人工智能系统“注重孤立的、处理一个特殊问题的能力，使用声明好的、静态的知识结构，考虑如何建模、推理和规则，与问题域无直接交互、通过用户或独立模块与环境联系，问题由符号项定义、所返回的解也是符号化的。通常，对变化的环境不能自适应”^([\[13\]](#txt002.html#footnote_content_txt002_13))。人工智能研发以构建符号化的逻辑推理体系为中心，计算机是处理符号逻辑系统的工具，运用形式逻辑和数理逻辑推理解决问题。它侧重在实验室进行科学研究，探索一般思维规律，是以算法为中心的
    AI 范式，关注学术性胜于实用性。

    唯理主义符号化逻辑学派主导的人工智能研发时期的标志性事件主要有：1951 年，迪特里希·普林兹（Dietrich Prinz）写出了国际象棋游戏程序。同年，克里斯托弗·斯特雷奇（Christopher
    ＆ Strachey）写出了跳棋游戏程序，首次使用启发式搜索程序。1956 年，艾伦·纽威尔（Allen Newell）和赫伯特·西蒙（Herbert Alexander
    Simon）模拟人类用数理逻辑证明定理的思维设计了“逻辑理论家”程序。“这一工作受到人们高度的评价，并认为是计算机模拟人的高级思维活动的一个重大成果，是人工智能的真正开端。”^([\[14\]](#txt002.html#footnote_content_txt002_14))1956
    年，阿瑟·塞缪尔（Arthur Samuel）研发出具有自主学习功能的跳棋程序，它既能通过棋谱学习相关技艺，又能总结实战经验。1958 年，麦肯锡（J.McCarthy）研发出既能处理数据，又能处理符号的表处理语言，即
    LISP，其作为人工智能系统程序开发的重要语言工具至今仍在发挥作用。同年，罗森布拉特（Rosenblatt）在计算机上模拟实现了被称为“感知机”（perceptron）的模型，它可以完成简单的视觉处理任务。1960
    年，艾伦·纽威尔、肖（Shaw）和赫伯特·西蒙在分析和总结人类求解思维活动的基础上，研发出“通用问题求解程序 GPS”。1965 年，鲁滨逊（Robinson）提出了归结法，将定理证明推向新的高潮。


    ### 三、经验主义主导时期：知识工程的开发与利用

    人工智能研究领域早期取得的成就使研究者出现了狂想和妄断。1958 年，赫伯特·西蒙教授预测在 10 年内计算机能够战胜国际象棋世界冠军。这一预测并未如期实现。^([\[15\]](#txt002.html#footnote_content_txt002_15))20
    世纪 70 年代，人们开始憧憬在家庭生活中大规模地使用智能机器（人）。这一理想至今未能实现，智能机器（人）的普遍应用仍停留在工业领域。“再如就是机器翻译，原来，人们曾以为只要用一部字典和某些语法知识即可很快地解决自然语言之间的互译问题。结果发现并不那么简单，甚至闹出笑话。”^([\[16\]](#txt002.html#footnote_content_txt002_16))

    人工智能研发遭遇挫折并陷入低谷，引发了学者反思，唯理主义遭遇挑战，经验主义兴起。研究人工智能的主导性哲学基础从逻辑主义向经验主义转变。经验在智能系统中的重要性凸显出来，知识工程的概念被提出，人工智能进入以经验为中心的范式时期。一方面，符号化的逻辑推理体系不是万能的，人工智能的知识表达和理论基础应当具有多元性。“对存在主义和现象主义而言，智能视为在世界中的生存力，不是视为关于世界的一组逻辑命题（结合某种推理机制）。”^([\[17\]](#txt002.html#footnote_content_txt002_17))另一方面，知识的重要性被提升。“知识是人类智慧的源泉，只有把相应的知识教给机器，机器才能表现出人类一样的智能，完成类似的智能工作。”^([\[18\]](#txt002.html#footnote_content_txt002_18))总而言之，人工智能从科学实验转向实际应用，从侧重符号化逻辑转向知识工程。经验主义哲学为人工智能的发展提供了新的思路，出现“好的老式
    AI”与“新型智能模型”并存发展的现象。


    #### （一）专家系统的开发与应用

    专家系统是模拟专家思维过程构建的智能系统。1977 年，费根鲍姆（E.Feigenbaum）在第五届国际人工智能联合会（IJCAI）上阐释了构建专家系统的思想，认为“知识工程是研究知识信息处理的学科，它应用人工智能的原理和方法，为那些需要专家知识才能解决的应用难题提供了解决途径”^([\[19\]](#txt002.html#footnote_content_txt002_19))。知识工程掀起了人工智能研发的高潮。1981
    年 10 月，日本宣布研制第五代电子计算机的十年计划，各国纷纷效仿并制定新一代人工智能研发计划。1984 年，雷纳特（Douglas Lenat）开始“CYC
    工程”，通过构建知识库和类比推理让计算机发现知识。

    这一时期，“化学分析专家系统 DENDRAL”“用于诊断和治疗细菌感染性血液病的专家咨询系统 MYCIN”“矿藏勘探专家系统 PROSPECTOR”等专家系统相继被开发和应用。与此同时，“专家系统自身存在的问题也逐步暴露了出来，如知识获取困难、应用领域狭窄、智能水平低、适应性差等，致使绝大多数仓促上马的所谓的专家系统因其脆弱性和不可靠性而滞留在原型阶段，无法投入实际应用。”^([\[20\]](#txt002.html#footnote_content_txt002_20))


    #### （二）联结主义兴起与发展


