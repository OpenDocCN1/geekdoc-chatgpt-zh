- raw: '但是，有学者对该方法的合理性存在质疑。赛尔（John Searle）提出了“中文房间”（Chinese Room）的思想实验，质疑图灵测试关于智能的判断。^([\[72\]](#txt005.html#footnote_content_txt005_72))在“中文房间”思想实验中，尽管被测试者足以以假乱真，使得房间外的人确信被测试者懂中文，但是，事实上被测试者根本不懂中文。基于该试验结论，赛尔主张思维不应归因于模拟人类智能处理符号的程序。符号处理程序不构成“思维”（thinking）或“理解”（understanding），因为它缺乏“意向性”，即处理意义的能力。符号的形状是语法属性（syntactic
    property），其意义是语义属性（semantic property），计算机仅回应语法属性。“中文房间”输出的符合中文表达要求的语句表面上看是对输入该房间的信息的回应，但是，“中文房间”内处理信息的过程只针对输入内容的形状或语法属性，并不涉及理解或思维。^([\[73\]](#txt005.html#footnote_content_txt005_73))


    2.形而上的路径：以思维等抽象概念为中心


    “人工智能是否能够成为民事法律主体都只是一个立法技术问题，真正影响人工智能成为民事法律主体的因素不在生物学上，而在意思表达层面。”^([\[74\]](#txt005.html#footnote_content_txt005_74))关于机器能否思维的问题由笛卡尔（Rene
    Descartes）首先提出。他认为“我思故我在”，思维是人的基本素质，是人类与人造物的区别所在；机器作为人造物即便能够进行语言表达甚至对行为做出反应，也不能在不同情形下当即做出适当回应，因此机器不具有思维的能力。


    人工智能出现后，笛卡尔关于人造物不具有思维能力的论断一直是学界争议的焦点。持保守观点的学者认为，无论是智能机器（人）战胜专业棋手还是普遍应用的模拟人类专家的专家系统（expert
    system）都是数字计算机编程的结果，是通过人工智能展现出的人类智能，体现的是人类智能的自我超越而非新型智能形态对人类智能的超越。人工智能不过是人类智能的延伸或再现，并不存在独立于人类智能的人工智能。“对于达到人工智能终极目标而言，意识是一个绕不开的难题。如果未来‘通用型人工智能’成为可能，一定会伴随着‘机器意识’的出现。而对于本轮基于机器学习的人工智能浪潮而言，这还是一个相对遥远的研究方向。”^([\[75\]](#txt005.html#footnote_content_txt005_75))


    霍布斯（Thomas Hobbes）在《哲学原理》一书中提出“推理即计算”的观点，首先提出了心智的可计算性理论。^([\[76\]](#txt005.html#footnote_content_txt005_76))奥卡姆认为，认知科学以人类智能本质上具有可计算性假设为基础，人类的大脑能够模式化为运行计算机的程序。^([\[77\]](#txt005.html#footnote_content_txt005_77))智能机器（人）已经逐步具有自我意识和自我表达能力，可以与人类进行情感交流。^([\[78\]](#txt005.html#footnote_content_txt005_78))


    （六）情景化预设下人工智能法律人格问题的解决路径


    法律规则与制度设计需要因应时势变化，针对不同场景进行差异化规则或制度设计具有正当性。在人工智能时代的不同阶段，智能机器（人）在意志与行为的自主性方面存在差异，在差异化的情景预设下智能机器（人）是否具有法律人格需要进行区别对待。在这一意义上，“人工智能可否成为民事主体，并不取决于其是否具有独立人格或民事权利能力，而取决于现实社会的需要和既存事实的强化。”^([\[79\]](#txt005.html#footnote_content_txt005_79))需要区分弱人工智能时代与强人工智能时代对人工智能法律人格进行差异化设计。


    1.弱人工智能时代无需赋予人工智能独立法律人格


    弱人工智能时代“人工智能离通用型人工智能还有一段距离。工具型人工智能无法产生意识”^([\[80\]](#txt005.html#footnote_content_txt005_80))。人工智能尚未达到“自我觉醒”的程度，无法独立思维并自主决策和行为，所谓人工智能的思维或意识不过是人类设计或编程的结果。智能机器（人）与其他人类创造物类似，在社会生活中主要起到工具性和手段性的作用。


    法律规则的设计具有体系化效应，局部规则变化在不同程度上影响着法律的内在精神气质与外在规范结构。法律主体类型和范围的规则设计是法律规则设计的基础，其变化具有牵一发而动全身的效果。主体与客体在类型与范围上存在的负相关性使得主体类型的增加以及范围的扩张必然导致客体类型的减少以及范围的限缩。而这些变化又会影响原有的权利、义务和责任结构体系。“自《法国民法典》至今200
    余年来，实际上民事主体制度显示出极为稳定的结构。如果要撼动这种结构，则须存在充分的现实需要。”^([\[81\]](#txt005.html#footnote_content_txt005_81))鉴于法律主体类型的增加以及范围扩张在内在价值理念和外在体系结构等方面对既有法律体系的剧烈冲击，有必要考虑奥卡姆剃刀原理（Occam''s
    Razor）^([\[82\]](#txt005.html#footnote_content_txt005_82))，对人工智能时代增设法律主体类型或扩张法律主体范围持审慎的态度。


    在弱人工智能时代，智能机器（人）尚不具备独立的思维和意志，其在社会生活中发挥的作用与其他作为工具的人类创造物并无实质差异。将智能机器（人）作为具有法律人格的法律主体进行规则设计在事实层面不具有足够的技术支撑，不仅无法产生积极的社会效果，而且会破坏法律规则体系原有的精神气质和结构。弱人工智能时代关注法律人格问题的重心不在于规则设计而在于法律伦理上的可能性及限度。人工智能的历史演进具有不可逆转性，即智能机器（人）一旦具备了与人类同等甚至超越人类的智能，智能机器（人）基于独立、自主的意志从事行为的后果将是人类单方无法控制的。控制智能机器（人）可能带来的灾难性风险需要从政策和法律制度等方面进行顶层设计，调控人工智能技术研发的方向与进度。换言之，在弱人工智能时代，智能机器（人）的法律人格不是“应不应该”而是“可不可以”的问题。合理规划人工智能未来走向的路线图，从法律伦理的角度探讨人工智能研发的技术限度，控制人工智能作为法律主体的进程及限度是弱人工智能时代法律的关注焦点。


    2.强人工智能时代基于利益多元化设计法律人格规则


    关于强人工智能时代法律人格的规则设计的想象和科幻色彩胜于严密的逻辑推理和理性分析。诸多科幻电影或小说中描述了机器意识觉醒的情形，如科幻影片《她》中的“萨曼莎”、《超能特工队》中的“大白”等。在技术条件尚未能实现强人工智能的阶段，人类只能通过想象预设人类与未来强人工智能之间的关系，并基于此进行相关制度设计。


    在强人工智能时代，以“类”形式存在的人的主体地位遭到挑战。智能机器（人）作为新型意识主体必然会寻求法律上的地位。未来社会可能是人类与智能机器（人）共存的命运共同体，形成多元共主的局面。关于多元共主的思想在中国传统文化中早已出现。如《周易》整合处于矛盾对立关系中的阴与阳，形成了阴阳调和、共生共存的统一框架；道家通过辩证思维解释有无和大小等的关系；儒家思想强调“己所不欲，勿施于人”。


    考虑到法律与现实生活的关系，对强人工智能时代法律人格进行规则设计不宜操之过急。因为缺乏现实生活作为根基的规则设计往往只是空中楼阁，即便设计得再完美也难以经受住现实生活的考验。人工智能能否发展到与人类智能媲美甚至超越人类智能的通用型人工智能阶段尚未可知。倘若通用型人工智能技术得以实现，具有独立思维和意志的智能机器（人）出现，人类面临的可能不再是法律人格设计的问题，而是作为类存在的智能机器（人）与作为类存在的人类之间进行利益协调和规则设计的问题。自我意识觉醒后的人工智能具有独立的自由意志，且在智力和体力方面明显优越于人类，其是否会遵循以人类公权力为后盾的法律规则体系不无疑问。“如果人工智能有意识，就不会服从人类为之设定的规则，至少应该是与人类一起制定规则，更可能的甚至是智能机器为人类设定规则。”^([\[83\]](#txt005.html#footnote_content_txt005_83))超强人工智能的认知能力突破了人类的认知极限，强人工智能时代的法律人格设计恐怕只是人类一厢情愿的幻想。


    二、智能机器（人）的民事法律责任主体资格


    人工智能导致的损害（AI-caused harm）将伴随人工智能应用领域的扩张持续增长。出现自动驾驶汽车导致事故、智能诊疗系统导致误诊、智能投资顾问出现误判等情况应当由谁（who）或者什么（what）来承担责任？联合国世界科学知识与技术伦理委员会（COMEST）发布报告，就智能机器（人）民事法律责任承担的问题提出了两种方案：一是让参与智能机器创造、生产和应用的人分担责任；二是让自主决策和行为的智能机器人独立承担责任。有学者认为：“这两种责任分担方式可能都不完善，因为既无视人类在科技发展过程中的固有偏见，也忽略了科技被居心叵测的使用者用做他途的可能性。”^([\[84\]](#txt005.html#footnote_content_txt005_84))另有学者在“人工智能类别化”的基础上构造了“九宫格”模型的三维法律责任主体规则体系。“一类人工智能”为人造人，如科幻影片中的“机器管家”；“二类人工智能”为人造机器或人造机器人，如智能网联汽车、无人机、服务机器人等；“三类人工智能”为人造程序，如语音或图像识别、智能搜索、智能投顾软件等。^([\[85\]](#txt005.html#footnote_content_txt005_85))


    （一）学说见解


    1.综合考量说


    智能机器（人）是算法支配下的硬件系统，虽然其决策或行为离不开初始程序设计者和制造者的行为，但是不能简单地将其等同于人类控制的工具。“对于人工智能侵害的民事责任，也不宜简单适用传统民事责任制度的处理原则，而应当结合人工智能的拟人属性，予以特殊的综合考量。”^([\[86\]](#txt005.html#footnote_content_txt005_86))高丝敏教授认为考察人工智能的责任主体适格性需要综合考量独立意识、伦理考量、独立财产等三个因素。


    2.民事责任能力说


    以智能机器（人）是否具有人形标准或应用场景标准确定其是否需要承担民事法律责任无疑是一种过于简单化的方式。“对‘人工智能+X’的法律规制的‘类型化’不能以‘人形’或‘非人形’为分界点，亦不能以‘X’所在领域为分界点，因为是否具有人形以及应用于何种领域并不具有必然的法律意义，而应当以法律责任能力为基础，这样方能回归法律规制的本意。”^([\[87\]](#txt005.html#footnote_content_txt005_87))有学者认为，是否拥有独立财产通常会被认为是判断民事责任能力的标准。“独立财产是承担民事责任的基础，而人工智能通常没有独立的财产用以支付民事赔偿。”^([\[88\]](#txt005.html#footnote_content_txt005_88))由此可以推论，智能机器（人）不能承担民事责任，也不能作为民事责任主体。反之，倘若智能机器（人）拥有独立财产，则其能够以独立的财产承担民事法律责任。另有学者认为，关于智能机器（人）的独立财产和民事责任能力的思考是将简单问题复杂化，徒劳无益，“人工智能没有独立财产，也不具有相应的责任能力，其产生的责任只能由其所有人或控制人负担。”^([\[89\]](#txt005.html#footnote_content_txt005_89))


    3.参与主体分摊责任说


    “机器人的责任问题，首先应当考虑的是人类的责任，而并非是机器人的责任。”^([\[90\]](#txt005.html#footnote_content_txt005_90))参与主体分摊责任说认为，设计智能机器（人）民事法律责任规则的目的不在于规范智能机器（人）的行为，而在于规范和引导人工智能技术的研发与应用。因而，承担民事责任的并非智能机器（人），而是参与人工智能技术研发和应用的主体。


    智能是取得法律主体资格或成为民事法律责任主体的前提条件，但是，拥有智能并不必然能够成为法律关系中的主体。“奴隶当然也是具有智能的，但是这并不妨碍奴隶主对于奴隶的致害行为承担责任。”^([\[91\]](#txt005.html#footnote_content_txt005_91))未取得民事主体资格的智能机器（人）是受人类支配或利用的工具，属于产品的范畴，自身并不具有独立的人格和财产，需要由占有、使用或所有该智能机器（人）的主体承担民事法律责任。“最终人工智能的侵权责任还是要由相关自然人完全承担或补充承担，而人工智能本身无法独立承担民事义务与责任，不具备民事责任能力。”^([\[92\]](#txt005.html#footnote_content_txt005_92))


    智能机器（人）作出的决策或行为是设计者、制造者、使用者等诸多主体共同作用的结果，因智能机器（人）产生的民事法律责任亦应由各参与主体进行分摊。“让所有参与到机器人的发明、授权和分配过程中的人来分担责任。”^([\[93\]](#txt005.html#footnote_content_txt005_93))这是基于风险控制的责任分配方式，“如果最终负有责任的主体得到确认，其所应承担的责任应与其给予机器人的指令级别以及机器人的自主性程度相称。”^([\[94\]](#txt005.html#footnote_content_txt005_94))


    参与主体分摊责任说面临的困境是智能机器（人）自主决策或行为时的责任承担依据缺失。当智能机器（人）自主决策或行为时，参与人工智能技术研发和应用的主体对其行为无法准确预见也无法控制，对于此时将民事责任归咎于参与主体是否合理存在疑问。


    4.法律实体说


    智能机器（人）不同于一般的物或产品，智能化因素使得其决策或行为与人的意志之间的关系复杂化。需要区分智能机器（人）致人损害是人的意志的结果还是智能机器（人）自身意志的结果。法律实体说以具有自我感知和自主学习能力的智能机器（人）具有独立的意志并能基于该意志进行独立判断为前提，认为智能机器（人）的决策或行为已经脱离了人的控制，具备独立承担法律责任的能力。“以主体意识参与到民事关系中来的智能机器人必须承担相应的责任，必须以主体身份参与到民事活动，作为法律关系的承担者。”^([\[95\]](#txt005.html#footnote_content_txt005_95))


    5.机器自主性说


    “具有类似人类独立思考与深度学习的能力是人工智能与其他科技最大的差异。”^([\[96\]](#txt005.html#footnote_content_txt005_96))人工智能技术的研发和应用对既有民事法律责任体系构成冲击，求诸机器自主性，赋予智能机器（人）法律人格并由其承担民事法律责任的观点应运而生。“这种观点甚至在没有得到有力论证的情况下，就得到了产业界、立法者甚至学界不少人士的支持与赞同。”^([\[97\]](#txt005.html#footnote_content_txt005_97))《格里申法案》虽然提出机器人可以独立拥有财产并承担责任的建议。但是，对于这一大胆设想并未提供相应的落实措施。该法案中规定：“机器人—代理人拥有独立的财产并以之为自己的债务承担责任，可以以自己名义取得并行使民事权利和承担民事义务。在法律规定的情况下，机器人—代理人可以作为民事诉讼的参加者。”^([\[98\]](#txt005.html#footnote_content_txt005_98))


    6.刺穿面纱说


    民事法律责任主体资格存在被形式化和工具化的可能。智能机器（人）的设计者、制造者或使用者会利用智能机器（人）的民事法律责任主体资格逃避责任。比照公司法中“刺穿法人面纱”的理论和规则设计，在一定情形下需要透过智能机器（人）民事法律责任主体资格，追究背后主体的责任，即向智能机器（人）主张责任承担的主体能够如同刺破法人面纱一样，主张由智能机器（人）的控制人承担责任。^([\[99\]](#txt005.html#footnote_content_txt005_99))


    （二）弱人工智能时代的民事法律责任主体：以产品属性为基础的分析


    1.工具论视角下的分析


    传统工具论以主体与客体二元划分为基础，作为客体的人工智能产品只是人类实现一定目的的工具，并无独立的意志或行为决策能力，与之相关的后果归属于利用人工智能产品的人，人工智能产品并非侵权的行为主体或责任主体。“弱人工智能实质上是人类活动的辅助与工具，其也无独立之意思表示，对该阶段人工智能侵权责任之追究与其他凭借工具侵权之情形并无差异。”^([\[100\]](#txt005.html#footnote_content_txt005_100))


    以智能机器（人）的工具性为逻辑基点，智能机器（人）不具有独立的法律人格，不能为其行为造成的损害独立承担责任。在现有的责任规则体系下，智能机器（人）的行为归因于设计、制造、支配、使用智能机器（人）的人类个体或组织体。其功能不是惩戒致害主体，而是促使支配或利用智能机器（人）的主体避免致害行为发生。


    弱人工智能时代智能机器（人）的工具性特征是构建民事法律责任规则体系的基本理论预设。智能机器（人）制造得再精巧或者再复杂，都不过是人类设计的结果，要受制于人的行为。作为调整社会关系手段之一的法律，其关注的对象是人而非技术本身。法律对技术的影响是通过调整人与人之间的关系实现的。郑戈教授认为：“法律应当去规制被技术改变后的社会中的人，从而使技术对人类社会的影响能够朝着善和正义的方向去发展。”^([\[101\]](#txt005.html#footnote_content_txt005_101))作为工具的智能机器（人）与汽车、电脑、房屋等人类占有或使用的物一样，发生事故造成损害，需要由生产者、所有者或使用者承担法律责任。换言之，以智能机器（人）的工具性特征为中心的法律规则体系设计是以智能机器（人）决策或行为的被动性为前提的，智能机器（人）决策或行为的模式为“命令—行动”。智能机器（人）的决策或行为不过是人的行为的延伸，造成的损害当然应当由智能机器（人）背后的行为人负责。


    2.民事法律责任主体类型'
