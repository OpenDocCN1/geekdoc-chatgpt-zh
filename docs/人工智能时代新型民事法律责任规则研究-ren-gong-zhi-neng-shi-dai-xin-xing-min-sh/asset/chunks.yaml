    \ Civil Law Rules in Robotics）。2017 年2 月16 日，欧盟议会通过了关于机器人和人工智能立法提案的决议，人工智能立法成为欧盟立法议程中的核心。欧盟议会关于机器人“法律人格”的设计是为顺应社会发展和技术进步的潮流提出的框架性建议，但系统性规则建议方案尚未出现，有虎头蛇尾之嫌。如何理顺法律人格与民事行为能力和责任能力的关系需要进一步研究和思考。\n\
