- raw: '智能驾驶立法肇始于美国的内华达州，该州于2011 年通过了《511 议案》（Assembly Bill 511），承认智能驾驶行为的合法性。2016
    年，美国交通运输部（DOT）和国家公路交通安全管理局（NHTSA）联合出台《联邦自动驾驶汽车政策》。为防止各州关于无人驾驶汽车上路的规定产生矛盾冲突，避免监管碎片化，美国众议院于2017
    年通过了《自动驾驶汽车法案》（Safely En⁃suring Lives Future Deployment and Research in Vehicle
    Evolution Act，又称Self Drive Act）。该法案修订了《美国法典》（United States Code）第49 条“交通运输”（transportation）中的相关条文。它赋予美国国家公路交通安全管理局优先监管智能驾驶汽车的权力，并对智能驾驶汽车的“安全标准”“网络安全”“通用性豁免”“隐私保护计划”等进行了规定。“密歇根州、佛罗里达州……删除了自动驾驶汽车中必须有驾驶员的要求，增加要求技术人员应当有能力在必要情况下迅速接管与控制车辆，或者确保车辆本身务必有能力实现减速或停车……”^([\[37\]](#txt006.html#footnote_content_txt006_37))同年4
    月美国佛罗里达州、密歇根州通过的法案中删除了智能汽车必须配备人类驾驶员的要求，增加了技术人员远程接管和控制车辆的要求。2017 年10 月，美国加州修正智能驾驶相关法案，允许没有方向盘、制动踏板、后视镜等人类驾驶必须设备的智能汽车上路测试。


    2015 年，德国允许在特定的高速公路 ^([\[38\]](#txt006.html#footnote_content_txt006_38))进行智能驾驶的测试项目。2016
    年，德国交通部起草的道路交通法修改草案扩大了驾驶员的范围，智能驾驶系统被纳入其中。^([\[39\]](#txt006.html#footnote_content_txt006_39))该草案于2017
    年被德国联邦议会和参议院通过，允许智能驾驶汽车上路。《德国道路交通法（修订）》第1b 条第1 款，人类驾驶员在驾驶期间可以借助高度或完全智能驾驶系统而不亲自驾驶车辆。“但为了符合1968
    年《维也纳道路交通公约》第八条‘每一部车辆在行驶时都必须有驾驶员在位’的规定，它没有允许自动驾驶汽车变成‘无人驾驶’汽车。”^([\[40\]](#txt006.html#footnote_content_txt006_40))人类驾驶员启动智能驾驶系统后，可以将注意力转移至与驾驶行为无关的活动，如读书、看报、上网、休憩；但是，他需要随时保持警醒状态，处于等候模式，一旦智能驾驶系统发出移交驾驶权的请求，人类驾驶员就需要恢复驾驶状态。


    2016 年，联合国修正《维也纳道路交通公约》，认可计算机对汽车的控制，承认智能驾驶的合法性，但是要求人类驾驶员必须在场并可以覆盖或接管智能驾驶。这“意味着包括美国在内的72
    个签约国可允许自动驾驶功能汽车在特定时间自动驾驶，为自动驾驶技术在交通运输中的应用清除了障碍”^([\[41\]](#txt006.html#footnote_content_txt006_41))。


    2017 年7 月，百度公司总裁李彦宏乘坐自动驾驶汽车在北京五环路上进行测试。2017 年12 月，深圳福田保税区出现4 台无人驾驶公交——阿尔发巴智能公交。2017
    年12 月工业和信息化部印布了《促进新一代人工智能产业发展三年行动计划（2018 年-2020 年）》的通知，明确要求：“建立可靠、安全、实时性强的智能网联汽车智能化平台，形成平台相关标准，支撑高度自动驾驶（HA
    级）。”2017 年12 月，北京市出台了《关于加快推进自动驾驶车辆道路测试有关工作的指导意见（试行）》和《自动驾驶车辆道路测试管理实施细则（试行）》等一系列地方性规范性文件，标志着我国智能汽车上路测试行为合法化。2018
    年1 月，国家发展与改革委员会发布《智能汽车创新发展战略（征求意见稿）》。


    表5-1　智能驾驶相关政策或法律


    ![](images/txt006_1.jpg "pagenumber_ebook=170,pagenumber_book=162")


    二、以驾驶分级为中心的考察


    智能驾驶汽车是人工智能应用于汽车领域的结果，其实质是移动的智能机器（人）。汽车的自动化程度影响人车关系和驾驶形态，它是区分设定责任规则的必要考虑因素。汽车从无智能驾驶到完全智能驾驶，自动化程度逐渐增强，司机的角色由驾驶者向乘客渐变，责任重心从人的责任转向物的责任。


    （一）驾驶分级与人车关系


    智能驾驶分级是确定人车关系的前提条件。^([\[42\]](#txt006.html#footnote_content_txt006_42))美国公路交通安全管理局将驾驶分为五个等级，而美国汽车工程师协会（Society
    of Automotive Engineers，简称SAE）将其分为六个等级。两者大同小异，差别在于美国汽车工程师协会在完全智能驾驶阶段的层次划分更为细致、复杂。^([\[43\]](#txt006.html#footnote_content_txt006_43))按照美国汽车工程师协会的标准，驾驶从L0
    到L5 被分为六个等级，即无自动化（L0，no automa⁃tion）、驾驶辅助（L1，driver assisitant）、部分自动化（L2，partial
    automation）、有条件自动化（L3，conditional automation）、高度自动化（L4，high automation）和完全自动化（L5，full
    automation）。


    L0 级驾驶不属于智能驾驶，人类驾驶员完全掌握驾驶权，负责观察道路交通状况并作出应对。驾驶支持或辅助系统为人类驾驶员决策提供帮助，不具有控制汽车驾驶权的能力。在人车关系中，机动车处于完全被动的状态，机动车在驾驶人的控制下运行。


    L1～L3 级驾驶具有了一定的智能驾驶元素，但是驾驶行为主要依赖人类驾驶员。在人车关系中，智能机器（人）行为的主动性增强，驾驶权逐渐由人类驾驶员转向智能驾驶系统，但其并未摆脱辅助人类驾驶员的角色定位。智能汽车的工具属性决定人类驾驶员仍然是驾驶责任的承担主体。智能机器（人）与人类驾驶员共同完成驾驶行为，智能驾驶系统起到驾驶辅助的作用。人类驾驶员主导机动车控制权，不能离开驾驶员的位置。


    “有条件的自动驾驶（level 3）以上的阶段才是自动驾驶汽车发展的方向和拟运用的主要场景，也是自动驾驶汽车的民事责任引起各方关注的主要技术背景。”^([\[44\]](#txt006.html#footnote_content_txt006_44))L4～L5
    级驾驶中机动车已演进为“站在轮子上的智能机器人”，驾驶行为由智能机器（人）自主完成，人类的角色从驾驶员转变为乘客。


    （二）基于驾驶分级的民事法律责任分析


    智能驾驶汽车分级是以人类对智能汽车的控制权为基础的，不同级别的智能驾驶汽车中人类扮演角色不同，其需要承担的民事法律责任也有所差异。L1～L3 级驾驶中，智能驾驶的责任类型以人的责任为主。掌握智能汽车驾驶控制权的人类驾驶员作为主导者有责任保障驾驶行为的安全性。人类驾驶员“对机动车运行危险承担过错推定责任。只在能够证明自动驾驶机动车有缺陷，驾驶人无过失且其即使尽到高度注意义务仍无法避免发生事故造成损害的情形下，才应当由自动驾驶机动车的生产者、设计者、销售者承担产品责任”^([\[45\]](#txt006.html#footnote_content_txt006_45))。美国佛罗里达州2016
    年发生的ModelS 交通事故案中，事故车辆的智能驾驶级别为L2 级，用户手册中明确载明了辅助驾驶系统的作用，警示驾驶员不能脱离驾驶状态，在发现危险时需要随时接管驾驶。“驾驶人未尽机动车操控者的专心驾驶之责，在碰撞事故发生前未能及时发现危险、迅速接管驾驶，导致事故发生，是直接责任者，应当适用传统道路交通事故责任规则确定责任归属。”^([\[46\]](#txt006.html#footnote_content_txt006_46))


    L4～L5 级驾驶中，智能汽车的使用者并不存在主观过错或加害行为，作为侵权责任构成要件之一的因果关系更是无从谈起。智能驾驶汽车发生交通事故造成人身或财产损害不能归咎于乘客。即便智能汽车使用者坐在驾驶员的位置上，也无需对交通事故承担民事责任，除非人类驾驶员主动介入掌握了智能汽车的控制权。


    《中国制造（2025）》按照智能网联汽车的智能化程度，将其分为四种类型，从DA 到FA 人类驾驶员逐渐丧失驾驶控制权，直至无人驾驶。有学者将智能驾驶分为驾驶支援、狭义自动驾驶和无人驾驶三个阶段对智能驾驶的责任构成与分配进行研究。^([\[47\]](#txt006.html#footnote_content_txt006_47))换言之，依驾驶权转移程度将驾驶行为类型化，可以分为辅助驾驶、人机共同驾驶和智能驾驶系统驾驶三种类型。在驾驶支援阶段，责任的构成与分配与传统机动车责任无异。在狭义自动驾驶阶段，智能驾驶系统使用人与智能驾驶系统共同控制智能汽车，属于共同驾驶人。在无人驾驶阶段，智能驾驶系统完全取代人类驾驶员成为驾驶控制权的主体，智能系统的生产者或智能机器本身需要承担驾驶人责任。


    三、以驾驶控制权为中心的考察


    驾驶人是指实际控制机动车，对驾驶行为负责的人。人工智能出现以前，驾驶人的身份相对容易判断，即在特定位置驾驶机动车的人。人类驾驶员是传统的驾驶活动控制者，也是交通事故损害赔偿责任的承担主体。智能驾驶技术出现后，智能驾驶系统辅助或取代人类驾驶员，事实上部分或全部控制机动车。智能驾驶形态各异，相应的民事法律责任体系关注的重心也存在差别。


    1.辅助驾驶阶段：人类驾驶员控制驾驶权


    智能驾驶支援系统起到辅助人类驾驶员的作用，驾驶控制权保留在人类驾驶员手中，人类驾驶员需要时刻对机动车运行状况以及路况等保持警惕。人类驾驶员而非智能驾驶支援系统实际控制机动车，智能驾驶支援系统并未在控制机动车方面取代人类驾驶员。


    有学者提出：“大规模采用驾驶支援系统以后，驾驶人能否主张自己无过错，继而主张仅承担损害10%的责任。”^([\[48\]](#txt006.html#footnote_content_txt006_48))我们认为，智能支援系统的普及不会对责任分配构成实质冲击。在这一阶段，人类驾驶员需要对驾驶过程中机动车的状况和路况进行自主分析，作出理性判断。智能驾驶支援系统是人类驾驶员自主理性判断的辅助工具，而不是主张免责的“挡箭牌”。驾驶员的过错主要包括两种类型：第一，基于使用机动车产生的过错；第二，基于信赖驾驶支援系统产生的过错。值得注意的是，在驾驶支援系统阶段，人类驾驶员不能基于对驾驶支援系统的完全信赖而主张免责。例如，在导航系统与实际路况不符的情况下，人类驾驶员需要对路况进行理性判断，而不能完全信赖导航系统。


    驾驶支援系统可以分为信息提供系统和操作辅助系统。信息提供系统未直接提供额外的安全保障，该系统出现瑕疵后人类驾驶员仍能避免事故发生，切断了瑕疵与事故之间的因果关系；操作辅助系统提供了额外的安全保障，让人类驾驶员产生合理信赖，该系统出现瑕疵与事故发生之间的因果关系未被切断。^([\[49\]](#txt006.html#footnote_content_txt006_49))


    2.共同驾驶阶段：人类驾驶员与智能驾驶系统共同作用


    智能驾驶支援系统升级为自主智能驾驶系统后，智能汽车驾驶控制权主体出现多元化趋势，人类驾驶员的角色发生变化。施哈德（Schrader）提出了“双重驾驶人共同驾驶”的分析框架。智能驾驶系统事实上部分或全部地控制智能汽车驾驶运行，使得智能驾驶系统本身或其生产者具备了驾驶人的属性。^([\[50\]](#txt006.html#footnote_content_txt006_50))“由第三人事实上控制车辆的运行仅导致第三人本身具有驾驶人的属性，并不导致原驾驶人丧失其运行支配。因为在驾驶员位置的人仍然保留了介入的可能性。”^([\[51\]](#txt006.html#footnote_content_txt006_51))也就是说，智能驾驶系统控制智能汽车运行的事实使智能驾驶系统本身或智能驾驶系统的生产者等主体具备了作为驾驶人的条件，人类驾驶员丧失的是唯一驾驶人而非驾驶人的身份。人类驾驶员保留了介入智能汽车驾驶的可能，能够随时终止智能驾驶系统对智能汽车的控制。智能汽车驾驶行为由人类驾驶员和智能驾驶系统共同完成。


    智能汽车的驾驶控制权在人类驾驶员与智能驾驶系统之间转移，相应地民事法律责任也在不同主体如车主、制造商、人类驾驶员等之间发生转移。“由于智能汽车的驾驶操作是司机和自动驾驶系统共同完成的任务，确定事故发生时由哪方在驾驶，对责任的划分至关重要”。^([\[52\]](#txt006.html#footnote_content_txt006_52))为明确不同类型主体的民事法律责任，需要对人机控制权模式切换的相关信息进行存储和保留，这就需要对智能驾驶数据的搜集、存储、使用及删除规则进行设计。


    人类驾驶员接管或移交驾驶控制权时，智能系统需要对相关的时间、地点、路况、汽车性能、技术故障等信息进行保存。^([\[53\]](#txt006.html#footnote_content_txt006_53))事件数据记录仪（Event
    Data Recorder，EDR），俗称“黑匣子”，此技术为判断人类驾驶员是否及时、合理地履行了接管义务提供了事实依据。在发生交通事故后，可以通过“黑匣子”的记录快速且准确地判定事故发生的原因，这既有助于法律责任的分配，又有助于对人员致伤原因的判定和保险理赔的鉴定。^([\[54\]](#txt006.html#footnote_content_txt006_54))在德国，为了确保数据存储合乎法律要求的证明目的，《德国道路交通法》要求，通常情况下自动驾驶汽车所存储的数据在6
    个月之后删除，但如果该机动车涉及第7 条第1 款规定的事故的，相关数据在3 年后才可以删除（第63a 条第4 款）。^([\[55\]](#txt006.html#footnote_content_txt006_55))


    在人机混合模式下，智能驾驶导致人员和财产损害的责任如何划分？人机切换模式能否作为减轻设计者或生产者责任或加重人类驾驶员责任的正当理由？有学者认为，“共同驾驶”阶段相应的责任需要根据共同侵权的规则进行判断。“生产者取得了驾驶人的属性，需要承担驾驶人责任。……此种观点导致了共同的汽车驾驶，在事故中根据共同侵权的规则处理。”^([\[56\]](#txt006.html#footnote_content_txt006_56))有学者提出反对意见：“尽管在自动驾驶阶段，从技术方面来看，需要系统使用人监控系统，但是这并没有赋予系统使用人事实上对车辆运行的事实控制……采用共同驾驶的区分，忽视了机器完全控制驾驶任务，并且架空了驾驶人责任中实际控制这一要件。”^([\[57\]](#txt006.html#footnote_content_txt006_57))


    3.智能驾驶系统控制阶段：从“驾驶员”到“乘客”的身份转变


    在驾驶行为完全由智能驾驶系统控制的阶段，人类驾驶员的角色完成从驾驶员向乘客的转变。“在一些厂商所意图发展的高等级智能汽车中，如谷歌的概念车、大众发布的Sedric
    概念车等，则已经完全取消了方向盘、刹车等干预装置，乘客只需要（也只能够）完成开启关闭车辆、输入目的地等操作。”^([\[58\]](#txt006.html#footnote_content_txt006_58))“波顿恩（Bodungen）和霍夫曼（Hoffmann）则认为，在自动驾驶的状态下，在驾驶员位置的人类已经丧失了驾驶人属性，在与责任相关的事故时点上，自动驾驶系统自行作出了决断，因此，也仅系统符合驾驶人的定义。”^([\[59\]](#txt006.html#footnote_content_txt006_59))人类驾驶员的行为存在过错的前提是回避可能性。倘若人类驾驶员尽到了必要注意义务仍然无法回避，则人类驾驶员没有可归责的主观过错。高级智能驾驶阶段判断“机动车一方”的过错无法在既有的法律框架中寻求答案。智能机器（人）的生产者提供的不再单纯是一种产品，而且是一种服务，需要对服务造成的损害承担相应的民事责任。“《道路交通安全法》仅将机动车驾驶人视为‘交通违法行为’的责任人。在无人驾驶汽车应用过程中，因无人驾驶技术缺陷所造成的交通事故归责，就成为《道路交通安全法》的一大漏洞。”^([\[60\]](#txt006.html#footnote_content_txt006_60))


    智能驾驶是否必须由人类驾驶员共同完成或作为补充？美国持否定态度，允许无人驾驶汽车进行路测；中国和德国的态度相对保守，运行智能驾驶系统时需要配备人类驾驶员，随时接管。在这一模式下，人机切换的脱手难题（hands-off
    problem）随之产生。驾驶权如何由智能驾驶系统平滑过渡到人类驾驶员？人类驾驶员是否需要时刻保持警惕状态？处于放松状态的人类驾驶员是否具备及时接管的反应能力？这一背景下，驾驶资格制度需要重新构建，即从关注人类驾驶员的年龄、身体状况、是否通过驾驶考试转向对智能驾驶系统的认知、理解和操控能力。


    四、智能驾驶中的民事法律责任类型


    “不明确的交通责任与产品责任皆为阻碍自动驾驶车进入市场的制度性屏障。”^([\[61\]](#txt006.html#footnote_content_txt006_61))对因智能技术进步以及普及应用而产生的新型智能驾驶形态导致的损害如何进行责任分配问题能否在既有的法律框架体系中寻求完满答案？这决定了智能驾驶民事法律责任规则的研究路径。倘若答案是肯定的，则通过法律解释的方法就可以解决现实问题，立法的迫切性降低；反之，则需要通过立法重构规则体系。


    智能驾驶发生事故造成损害的类型分为两种：第一，智能驾驶中发生交通事故导致智能汽车和人类驾驶员遭受损失；第二，智能驾驶中发生交通事故导致第三人遭受人身或财产损失。如何救济因智能驾驶导致的损害？在人工智能专门法律规范体系尚未建立的前提下，求助于既有的侵权责任法律规范体系，在“产品责任+传统交通事故责任”的框架中寻求解决方案的做法得到多数学者的认同。'
