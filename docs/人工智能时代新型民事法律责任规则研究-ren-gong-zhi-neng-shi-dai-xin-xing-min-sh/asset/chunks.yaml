- raw: "以图灵机为基础的人工智能时代，为人工智能设置人文主义的道德程序具有技术上的可行性。人文主义的道德程序设想表面上实现了利他主义的目标。但是，当我们考察人文主义的道德程序设想命题提出的初衷时不难发现，所谓的人文主义道德程序设想事实上并未实现。人文主义道德程序设想提出的初衷在于解决当智能机器（人）的利益与人类利益发生冲突时，利益选择或价值选择的问题。而以图灵机为基础的人工智能时代，人工智能本身就是人类程序设计的结果，本质上是执行人类程序的设计，无法创设或修改规则的人工智能并无独立的自主意识和利益可言，无所谓智能机器（人）与人类之间冲突性的价值选择或利益选择的问题。换言之，人文主义道德程序设想在以图灵机为基础的人工智能时代可行并有效，其原因在于智能机器（人）与人类之间的利益或价值冲突问题并不真实存在。这恰如“维特根斯坦式的现象：许多问题的解决并非有了答案，而是问题本身消失了”^([\\\
    [68\\]](#txt002.html#footnote_content_txt002_68))。\n\n以超图灵机为基础的人工智能时代，具有独立自主意志的人工智能有了自身存在的目的和意义。当智能机器（人）与人类在利益或价值选择方面发生冲突时，人文主义道德程序对于具有独立意志的人工智能而言是无益的。人类将人文主义道德程序强加给人工智能之后，人工智能是否会因考虑自身利益最大化而将该道德程序视为病毒予以排斥、修改或删除，不无疑问。\n\
    \n（2）技术主义设想：无法拆卸的自毁程序\n\n“哥德尔程序炸弹”是指“只要人工智能对控制程序说出‘这个程序是多余的，加以删除’或与之等价的任何指令，这个指令本身就是不可逆的自毁指令”。^([\\\
    [69\\]](#txt002.html#footnote_content_txt002_69))人工智能对自毁程序的无能为力被称为“阿喀琉斯之踵”。但“哥德尔程序炸弹”启动的后果是否在人类能够承受的范围之内？因技术依赖而产生的人的异化现象引发学者的担忧。有学者认为，即便有“哥德尔程序炸弹”的保障，人类社会仍然无法承受启动该程序后的后果。“而人类生活已经全方位高度依赖人工智能的技术支持和服务，那么人工智能的自毁也是人类无法承受的灾难，或许会使人类社会回到石器时代。”^([\\\
    [70\\]](#txt002.html#footnote_content_txt002_70))\n\n（三）法律规则规制\n\n“与传统社会模式不同，风险社会中最为稀缺的价值需求即是对于确定性的追求，法律作为一种确定性的价值存在风险社会的运作中充当着最佳的调控模式。”^([\\\
    [71\\]](#txt002.html#footnote_content_txt002_71))伦理道德规则的自律性决定其作用范围和影响是有限的，防范新型社会风险导致无序、混乱而造成损失需要法律参与。法律规则体系是人工智能时代调控风险手段的重要组成部分。\n\
    \n人工智能技术的研发与应用使得法律规制出现真空（regulatory vacuum）现象。传统的法律规制方法，如产品许可、研发监督和侵权责任，在调整与智能机器（人）相关的风险时表现出不适应性。^([\\\
    [72\\]](#txt002.html#footnote_content_txt002_72))而在新型规则设计方面，立法者保持相对沉默的态度，以人工智能为规制对象的法律法规相对少见。“由于法治迄今为止被证明是保护弱者权益、使人避免落入弱肉强食的丛林法则支配的最有效机制，所以，当人工智能所带来的新风险被许多人感知到的时候，人们自然希望法律能够因应这种风险提供新的保障。”^([\\\
    [73\\]](#txt002.html#footnote_content_txt002_73))为应对人工智能时代的新型社会风险，需要对既有法律规则体系进行调整。构建和完善人工智能时代法律规范体系将有利于智能技术相关产业的发展与社会的和谐稳定。\n\
    \n三、人工智能时代典型国家或地区的政策与法律变革\n\n人工智能技术的研发及其在交通运输、家居、诊疗、城市管理等场景的应用深刻地影响和改变着社会生活，需要从政策和法律层面对规范体系进行重新设计。2015\
    \ 年前后，科技发达的国家或地区纷纷开始关注人工智能的研发与应用，将人工智能层面上升至国家层面并进行顶层设计。部分国家或地区就人工智能相关民事法律责任规则设计进行尝试，开拓人工智能时代法律规范体系设计的新征程。欧盟、美国、英国、韩国、日本等国家或组织尝试制定相应的法律或法律草案。梳理并比较不同国家或地区关于人工智能的政策和法律（含草案），有助于明晰人工智能时代民事法律责任规则设计的基础、重点以及未来趋势，为我国设计适应时代发展需要的民事法律责任规则提供借鉴。\n\
    \n（一）典型国家\n\n1.美国\n\n人工智能发展战略是美国国家战略的重要组成部分，具有明确性、战略性和全局性。美国将人工智能规划提升至新阿波罗登月计划的高度，在全球范围内首次将其列为国家战略，试图在人工智能时代继续保持互联网时代的强势地位和领军态势。\n\
    \n2013 年，美国启动了“通过推动创新型神经技术开展大脑研究”计划。^([\\[74\\]](#txt002.html#footnote_content_txt002_74))2014\
    \ 年，美国与欧盟合作开展“人脑计划”（human brain project）。2016 年10 月，隶属于美国国家科学委员会的“机器学习与人工智能分委员会”指定“人工智能研究组”制定了被奥巴马称为新阿波罗登月计划的《国家人工智能发展与研究战略计划》（The\
    \ National Artificial Intelligence Research and Development Strategic Plan）。美国白宫发布该计划，首次将人工智能发展战略计划提升至国家层面。该战略计划侧重技术维度，分三个部分论述了美国人工智能发展的目的、愿景、战略重点、核心建议等内容。^([\\\
    [75\\]](#txt002.html#footnote_content_txt002_75))这一计划为世界各国或地区制定人工智能发展战略提供了可借鉴的蓝本。美国总统行政办公室与国家科学技术委员会联合发布名为《为人工智能的未来做好准备》（Preparing\
    \ for the Future of the Artificial Intelligence）的报告。该报告提出了实施人工智能战略的23 条建议或措施。它侧重治理维度，分别就“公共物品与人工智能”“人工智能在联邦政府的应用”“加强对人工智能的监控”“联邦政府对人工智能研究的支持”“全球的视角和安全”等主题进行分析。^([\\\
    [76\\]](#txt002.html#footnote_content_txt002_76))2016年10 月31 日，150 多名专家学者完成了《2016\
    \ 美国机器人发展路线图：从互联网到机器人》。2017 年，约翰·德莱尼（John Delaney）向众议院提交了《人工智能的未来法案》。\n\n2.俄罗斯\n\
    \n俄罗斯专家学者起草了首部机器人法草案，即《在完善机器人领域关系法律调整部分修改俄罗斯联邦民法典的联邦法律》（又称《格里申法案》），描述了人类与人工智能以及机器人之间的关系，探索了对机器人领域系统立法的路径，实现了从机器人法则到机器人法的重大转变。^([\\\
    [77\\]](#txt002.html#footnote_content_txt002_77))《格里申法案》“提出了机器人作为类似动物的财产、作为准主体和作为高度危险来源，在不同法律关系中和不同发展阶段的不同定位，界定了不同定位之下的民事法律规范的适用”^([\\\
    [78\\]](#txt002.html#footnote_content_txt002_78))。\n\n3.英国\n\n2013 年，英国将“机器人与自动化系统”（Robotics\
    \ and Autonomous Sys⁃tems）列入“八项伟大的科技”计划之中，试图在全球范围内引领第四次工业革命。^([\\[79\\]](#txt002.html#footnote_content_txt002_79))2016\
    \ 年6 月，英国政府科学办公室（Government's Office of Science）发布报告《人工智能：未来决策制定的机遇与影响》，分析人工智能技术对社会的影响，呼吁建立专门的机器人技术与自动化系统委员会。^([\\\
    [80\\]](#txt002.html#footnote_content_txt002_80)) 同年10 月，英国下议院发布了一份关于智能系统和机器人技术的报告，将自己定位为全球人工智能伦理标准研究领域的领导者，呼吁政府对人工智能进行监管。2017年，由创新英国（Innovate\
    \ UK）项目支持的“特殊利益团体”（Special Interest Group）发布了关于智能机器的2020 年国家发展战略（RAS 2020 National\
    \ Strategy）。\n\n4.日本\n\n为应对人口老龄化、出生率下降、育龄人口缩减等社会问题，日本一直积极探索人工智能的研发与应用。作为机器人超级大国，日本在智能机器（人）用户、制造商、服务商的数量上处于领先地位。2014\
    \ 年6 月，日本内阁通过“日本振兴战略”。此后，日本政府对该战略进行修订，提出推动“机器人驱动的新工业革命”。2014 年9 月，日本政府成立了由专家组成的“机器人革命实现委员会”，推进技术标准全球化。2015\
    \ 年1 月，日本经济产业省汇总“机器人革命实现委员会”发布的成果并编制了《日本机器人战略：愿景、战略、行动计划》。\n\n5.中国\n\n我国人工智能战略规划的启动相对较晚，且偏重于技术和应用，在伦理和法律制度建设、人才培养以及教育、投资等方面有较大的提升空间。直到1978\
    \ 年，智能模拟才被纳入国家计划进行研究。1986 年，国家高技术研究“863”计划将智能信息处理、智能计算系统等重大项目列入其中。1997 年，国家重大基础研究“973”计划将智能信息处理以及智能控制等项目列入其中。《国家中长期科学和技术发展规划纲要（2006-2020\
    \ 年）》将“脑科学与认知科学”作为八大科学前沿之一。2017 年3 月，全国“两会”中首次将人工智能写入政府工作报告，人工智能成为国家战略之一。2017\
    \ 年7 月8 日，国务院发布《新一代人工智能发展规划》，对我国人工智能的未来发展进行前瞻性布局并强调研究人工智能相关政策、法律和伦理问题的重要性。该规划标志着我国人工智能战略被上升到国家战略层面。这一顶层设计有助于我国人工智能技术研发与应用进程的稳步推进，防范结构性崩塌和整体性破坏。2017\
    \ 年12 月13 日，工业和信息化部发布《促进新一代人工智能产业发展三年行动计划（2018-2020 年）》。习近平总书记在十九大报告中明确指出要“推动互联网、大数据、人工智能和实体经济深度融合”。推进人工智能技术创新和产业融合是实现从制造大国到制造强国，从中国制造向中国创造转变的关键。中共中央印发的《法治中国建设规范（2020—2025）》明确要求，及时跟进人工智能相关法律制度，抓紧补齐短板。\n\
    \n（二）国际组织\n\n1.联合国\n\n2016 年8 月，联合国下属的“科学知识和科技伦理世界委员会”（COMEST）发布《机器人伦理初步报告草案》，“认为机器人不仅需要尊重人类社会的伦理规范，而且需要将特定伦理准则编写进机器人中”^([\\\
