- raw: "其中，以智能机器（人）为联结点的民事法律责任承担方式主要包括：第一，缴出赔偿。它源于罗马法的缴出赔偿（noxoe deditio）方式，要求将实施加害行为的智能机器（人）交由受害人或其家属进行处置。^([\\\
    [180\\]](#txt005.html#footnote_content_txt005_180))第二，召回、销毁智能机器（人）。制造商或销售商发现智能机器（人）不符合产品质量要求或存在其他瑕疵，可以通过召回、销毁的方式避免损害结果发生。第三，智能机器（人）支付赔偿金。智能机器（人）以其独立财产就致害行为承担赔偿责任。第四，限制智能机器（人）的自由。倘若智能机器（人）致人损害，则其自由权受到相应限制，以示惩戒。\n\
    \n二、对以智能机器（人）为联结点的责任承担方式的质疑\n\n学者对以智能机器（人）为联结点的民事法律责任承担方式存在质疑，认为该方式形式上针对智能机器（人），但是实质上仍然是由智能机器（人）的所有者和使用者最终承担责任。\n\
    \n第一，智能机器（人）没有独立的收入或财产，属于其所有者或使用者财产的一部分，缴出赔偿、召回和销毁智能机器（人）、由智能机器（人）支付赔偿金以及限制智能机器（人）的自由等救济方式归根结底还是在限制或剥夺智能机器（人）的所有人或使用人的财产。\n\
    \n第二，法律规范约束的是人的行为，而非智能机器（人）的“行为”。民事法律责任能够起到惩戒、教育和威慑行为人的作用要以人的行为具有理性特征为基础，趋利避害的本性使得人们通常会以避免产生民事法律责任的方式而作出行为。“民事责任的承担对于承担者而言具有一定的警示和道德上否定的功能，这也是民事责任除经济补偿之外很重要的功能。但是人工智能还没有发展到可以让机器具有羞耻心和道德感的程度。”^([\\\
    [181\\]](#txt005.html#footnote_content_txt005_181))智能机器（人）不会因需要承担民事法律责任而担心财产减少或者自由受到限制，进而调整自己的行为。民事法律责任的调整在面对作为行为主体的智能机器（人）时失效。“智能机器无法理解和响应法律的行止要求、无法接受法律的调整、无法理解财产之于自身的意义。”^([\\\
    [182\\]](#txt005.html#footnote_content_txt005_182))“强人工智能将实现物理意义上的‘永生’——只要保留相应的数据，则无论怎么摧毁强人工智能的物理载体，强人工智能实际上都会存在。这会导致法律对生命、自由的剥夺、惩罚手段对强人工智能不产生影响，强人工智能将处于绝对优势地位。”^([\\\
