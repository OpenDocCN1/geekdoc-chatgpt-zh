  trans: '


    ## 一、人工智能威胁论


    2020 年农历新年前后爆发的新冠肺炎疫情警示人类需要对大自然、技术进步保持敬畏之心。人类作为智能机器（人）的原初设计者或制造者与智能机器（人）之间的地位是否会因技术失控而颠覆？人类如何应对制造物的叛逆行为？机器智能化犹如一柄双刃剑，当刀锋挥向人类时，人类可能面临无法承受的威胁。人工智能先驱者阿兰·图灵曾警示人类，即便机器屈服于人类，人类也应当对作为一种物种的机器保持敬畏。伴随人工智能技术的发展，关于人工智能对人类可能造成的影响备受关注。埃鲁曼在其出版的《技术社会》一书中对技术开发者必然能够控制该技术提出质疑。雷·库兹韦尔（Ray
    Kurzweil）在《机器之心》一书中盛赞现代计算机的智能性，他创造了“奇点”这一概念，特指人工智能超过人类智能的时间点。他认为“奇点临近”，智人统治的时代将终结于
    22 世纪之前，人工智能将取代智人成为统治者。^([\[1\]](#txt004.html#footnote_content_txt004_1))比尔·盖茨主张对智能机器（人）征税，从而减缓其适用于社会的速度，延缓智人时代终结的时间点。依隆·马斯克（Elon
    Musk）发表“人工智能威胁论”，将人工智能视为人类文明的威胁，呼吁政府监管人工智能技术。史蒂夫·霍金在剑桥大学的就职典礼上发出人工智能可能终结人类文化的警告。研发人工智能需要限定在人类可控的范围内，过度研发并非人类社会之福。


    自主与失控犹如孪生兄弟，人工智能自主性增强的过程就是人类不断失去对其控制的过程。主张人工智能威胁论的人士对人工智能的未来发展持悲观主义态度。他们对超越人类智能的强人工智能充满疑虑和担忧，认为强人工智能存在失控的可能。人工智能一旦失控，作为人类创造物的人工智能将取代人类在社会生活中的主导地位，成为新的世界统治者，人类将沦为智能机器（人）的附庸，智人时代终结，智能机器（人）围猎人类的图景可能成为现实。人类难以承担甚至没有机会承担因人工智能技术应用产生的反复试错的机会成本。以被奴役和丧失真正自由为代价换取短暂欢愉和表面自由，是得不偿失的。


    高奇琦教授从知识发生学的角度对西方精英学者悲观的宿命论进行解读，认为“由于西方的整个知识传统建立在基督教文化叙事的基础上，人工智能对未来世界的这种悲剧性影响依然是‘末世论’的翻版”。^([\[2\]](#txt004.html#footnote_content_txt004_2))在基督教文化叙事中，末日是一种警示，是对人类的无知、贪欲、罪恶的告诫；它也是一种启示，是对上帝力量的彰显。末日来临，上帝出现，救赎开始。超人、美国队长、蜘蛛侠、蝙蝠侠等展现英雄主义的影视作品中具有超凡能力的救世英雄身上无不充斥着全能上帝的身影。虔信基督教的西方精英学者将人类对人工智能的依赖归咎于人类的贪婪、懒惰、狂妄和控制欲，认为人类的原罪以及人性中的恶使得人类过度依赖人工智能，这必将走向终结智人统治的不归路。


    人类对于人工智能的担忧显示了人类的不自信。在人类可控的范围内，人类愿意信任人工智能，并对人工智能的研发和应用抱有极高的热情。但是，一旦超出了人类可控的范围或者进入人类未知的领域，人类就会对人工智能保持高度警惕。例如，在有关人工智能的未来设想中，人类应当禁止让渡高能武器的控制权以及设置一键毁灭系统。“即使人类一定要发展人工智能，也必须把武器的使用权和使用能力留给人类自己，必须保证人工智能无法操作武器系统，否则人类的末日就可能不仅仅出现在科幻片中了。”^([\[3\]](#txt004.html#footnote_content_txt004_3))


    人工智能创造的文明是全景式、整体性和颠覆性的。在人工智能技术高歌猛进、披荆斩棘的时代，对技术进步持谨慎的怀疑态度似乎不合时宜。技术依赖使得反思和批判精神成为稀缺资源。而恰恰是冷静的、理性的质疑和批判才能避免因技术狂热而导致技术海啸和不可逆转的灾难。


    ## 二、人工智能福音论


    “西方文学中人类对‘人造智能生命’的态度，大体经历了从拒绝接纳，到奴化控制，再到交融共生的三个发展阶段。”^([\[4\]](#txt004.html#footnote_content_txt004_4))人工智能在脑力劳动和体力劳动方面的优势正在显现并不断强化。未来，人工智能在能力方面整体超越人类当属大概率事件。马克·扎尔伯格、李开复、吴恩达等人认为所谓的人工智能威胁是遥不可及的。他们认为，人工智能是人类社会的福音。“人类未来会在‘万物皆互联、无处不计算’的环境下精准生活。”^([\[5\]](#txt004.html#footnote_content_txt004_5))人工智能具备超越人类的“超能力”，是人类所期待而非恐惧的，人类应该欢呼雀跃，而不是忧心忡忡。


    人工智能威胁论是耸人听闻的天方夜谭。“人机大战”本质上是人与人之间的博弈，具体而言是软件程序设计者与人类专家，例如象棋棋手之间的对抗。即便机器战胜人类中的顶尖者，也只表明程序员的设计以及计算机的执行能力越来越高。“计算机的效率和能力并非来自其自身的思考，而是出于出色的程序设计。”^([\[6\]](#txt004.html#footnote_content_txt004_6))“电影《机器人启示录》的粉丝请注意：故意侵权（in⁃tentional
    torts）——比如机器人试图杀死星球上的所有人——不太可能成为人工智能引发的严重问题，至少很长一段时间内都不会。”^([\[7\]](#txt004.html#footnote_content_txt004_7))从整体而言，人工智能不存在失控的可能。人类掌握着人工智能最终的命运决定权，即便人工智能失控，人类也可以通过切断动力来源的方式毁灭人工智能，消除威胁。杞人忧天式的威胁论应当被抛弃，在智能驾驶、图像识别、机器学习等领域需要持续、深入探索人工智能技术的研发与应用。


    另有学者从智能机器（人）在意识和情感方面对人类的依赖论证人工智能不会对人类构成威胁。他们认为：人工智能“没有‘自我意识’和情感。没有我执，也便没有‘贪、嗔、痴’，不会对人类构成威胁”^([\[8\]](#txt004.html#footnote_content_txt004_8))。“假如超级人工智能必定出现，那么我们只能希望人工智能是无欲无情无价值观的。”^([\[9\]](#txt004.html#footnote_content_txt004_9))将智能机器（人）假定为没有独立意识和情感，没有贪念，不存在与人类利益根本背离的独立利益需求是人类的美好愿望。智能机器（人）在逻辑推理、计算力方面的优势已经明显超越人类。独立意识和情感需要成为人类区别于人工智能并获得优越感的“救命稻草”。但是，这一推论存在两方面的缺陷：一方面，智能机器（人）没有独立的自我意识和情感，没有贪念，愿意服从或服务于人类的假定是基于当下人工智能普遍的研发状况作出的判断。未来人工智能技术的发展是否会让智能机器（人）具有独立的意识和情感，属于未知领域。有学者认为：“人类对情感的理解能力，以及做出适当反应的能力，是人类智慧的重要表现，这些也将被未来的机器智能理解并掌握。”^([\[10\]](#txt004.html#footnote_content_txt004_10))另一方面，即便智能机器（人）不具有独立的意识和情感，不会主动与人类为敌，也不排除智能机器人在一定的设计之下或者因设计后的不可控因素成为人类的威胁。


    ## 三、存在升级与奇点


    ### （一）存在升级：人类时代向后人类时代的转型


    存在升级是指，“某种技术或制度的发明开拓了新的可能生活并且定义了一个新的可能世界，所以它意味着存在方式的革命，而不仅仅是工具性的进步。”^([\[11\]](#txt004.html#footnote_content_txt004_11))科技革命是科技进步的一种形式，并非所有的科技进步都会导致科技革命。科技革命是对既有社会生活颠覆性的冲击和重塑，会影响人类的存在方式。^([\[12\]](#txt004.html#footnote_content_txt004_12))


    人工智能技术革命可能会导致存在升级，这引发了人类对类存在方式的思考。人类作为现实世界唯一的智能主体主宰社会生活的现状将被打破。人类智能与人工智能并存的二元智能形态下，人与机器之间的关系以及人类主宰世界的能力将发生变化。这一因智能革命引发的忧虑是杞人忧天还是兹事体大，给人类带来的是幸运还是不幸，都难以预估和预判。人工智能时代人类可能面临的是最后一次存在升级，“此种存在升级意味着人类在世界存在系统中失去了地位，人类不再重要，历史将失去意义，人类文明将成为遗迹，未来也不再属于人类，人类文明数千年的创世纪将被终结而开始人工智能的‘创世纪’。”^([\[13\]](#txt004.html#footnote_content_txt004_13))


    ### （二）奇点：人类时代向后人类时代转型的时点


    奇点（singularity）是指智能机器（人）的智能达到人类智能的时点，它是存在升级的临界点。从猿到人的进化使得生物世界出现高级动物和低级动物的区分，从人类视角观察世界成为可能。宗教的出现划分了精神世界和世俗社会，构造出人与神二分的存在结构。主权国家通过权力的概念重构了世界的秩序，划定了个体参与社会生活的边界，创设了主权国家对外交往和对内管理的规则。互联网创造了独立于现实世界的虚拟世界。在这些存在升级中都有一个奇点。有学者预测人工智能创世纪的“奇点”即将到来。


    有学者提出反对观点，认为人类智能比人工智能强大，奇点不会也不应当出现。“发展人工智能的理性限度就是人工智能不应该具有否定人类存在的能力，相当于必须设置某种技术限度，使得人工智能超越人类的‘奇点’不可能出现。”^([\[14\]](#txt004.html#footnote_content_txt004_14))但是，这一抽象的原则在实施过程中并没有想象中那么简单。哪些技术将触发“奇点”？技术设限的程度如何？为防范人工智能给人类带来不可逆转的灾难，人类设想为人工智能设置安全阀门作为最后的救命稻草，即终极毁灭程序，如“哥德尔炸弹程序”。“哥德尔炸弹程序”要求人工智能只能在人类设定的程序中运行，一旦人工智能试图修改或者删除给定程序就会触发自毁程序。“哥德尔炸弹程序”利用自相关性设置安全阀门，在理论上具有一定的可行性。但是，具有自主意识的人工智能是否会凭借其超强算力使得“哥德尔炸弹程序”以人类意想不到的方式失效？这一问题的答案仍然存在高度不确定性。


    ### （三）人本主义法律秩序遭遇挑战


    人工智能技术革命造成的社会影响具有颠覆性，是以往社会变革不可比拟的。人类创造人工智能将社会推向了机器时代或后人类时代。人类与人类的创造物即人工智能之间的关系需要重新反思。


    持保守观点的学者认为，人工智能的出现尚未根本改变人类与自然界之间的关系，人类作为主体而智能机器（人）作为客体的设计在当下具有存在的正当性。现有的法律已经足以应对人工智能引起或可能引起的新型法律关系，或者调控由人工智能引发的法律后果，并不需要新的专门的法律调控。^([\[15\]](#txt004.html#footnote_content_txt004_15))持激进观点的学者认为，人工智能时代属于后人类时代，需要新型法律规则体系予以调整。人工智能的出现将彻底颠覆人类与其创造物——智能机器（人）之间的关系，“我国在应对机器人法律问题上，正处于无法可依的状态。”^([\[16\]](#txt004.html#footnote_content_txt004_16))


    人工智能时代人本主义的法律秩序观遭遇冲击和挑战，法律规范体系从基本理念到整体框架都需要进行调整。在后人类的机器时代，人与作为创造物的机器之间的关系需要重新思考。机器是否只是人类创造的工具？人与机器之间是否为单纯的财产关系？“机器时代的法律或可被称为人—物关系法、科学自然法，抑或文理混合法。不管怎么称呼，这种法律所要调整的主要对象是人和自己制造的工具的关系，……而这种关系并不是一种财产关系。”^([\[17\]](#txt004.html#footnote_content_txt004_17))主体与客体二分的思维和框架不符合人工智能时代法律调整的需要。但是，这种变革也不宜冒进，需要采用渐进式的变革方式，即根据人工智能技术发展的状况，不断修正或调整既有的法律制度体系。


    ## 第二节　自我意识觉醒的理论预设


    自我意识是一个具有玄幻色彩的科学问题。人类作为迄今为止唯一的智能主体，创造新型智能主体的方案之一就是以人类自身为范本。但是，认知科学尚有诸多谜团未能解决。人类具有自我意识并无异议，但是人类自我意识的生成机制仍然是谜一般的存在。人工智能自我意识（consciousness）觉醒是一个面向未来的命题。它是否可能？何以可能？后果如何？


    ### 一、人工智能自我意识觉醒的可能性


    智能机器（人）能否通过进化而获得自我意识？这是科幻影片和小说的重要题材之一。持否定观点的学者认为：“人工智能所表现出的智能只是依托特定的算法并执行人类指令的结果，本质上为逻辑运算，不可能产生自我意识。”^([\[18\]](#txt004.html#footnote_content_txt004_18))持肯定观点的学者则认为：“无法排除人工智能获得自我意识的可能性，而且就科学潜力而言，具有自我意识的人工智能是非常可能的。”^([\[19\]](#txt004.html#footnote_content_txt004_19))但是，目前智能机器（人）尚未取得与人类抗衡的主宰世界的能力。超越图灵机，机器能够独立、自主思维的强人工智能时代尚未到来。人类对作为范本的人类智能在认识上具有局限性，使得人类在创造具有自我意识的人工智能时缺乏必要的参数和原理支撑。


    本轮人工智能技术革命以图灵机为原型和基本框架，以创造具有更高效率和精准度的辅助运算系统为目标。人工智能认知的范围限定在棋类、交通运输、家居服务等特定领域，相对狭窄的认知范围与现实世界的丰富性之间形成矛盾。智能机器（人）思维或意识的封闭性、有限性增强了运算的效率和准确性，却不能搁置无法解决的问题。换言之，人工智能在认知上存在明显的盲区，未能形成整体性的全能意识系统。


    “人工智能自我意识觉醒何以可能”的命题是建立在对“人工智能的自我意识觉醒是否可能”的问题予以肯定回答基础上的。“假如有可信知识确定人工智能绝无可能发展出自我意识，那么这里的问题就变成了废问，人类就可以高枕无忧地发展人工智能而尽享其利了。”^([\[20\]](#txt004.html#footnote_content_txt004_20))


    ### 二、人工智能自我意识觉醒的后果


    幻想转变为现实带来的既可能是前所未有的便利也可能是无法估量的威胁。当危机真正来临时，将希望寄托于神奇的魔力、人类情怀的感召或人工智能的顿悟都是不可靠和极度危险的。人工智能时代的民事法律责任规则设计有必要预测人工智能自我意识觉醒的后果，将事前防范（ex
    ante action）与事后调整（ex post mechanisms）相结合。


    #### （一）主宰权的转移：人工智能的创世纪


    自我意识觉醒后的人工智能在智力和体力方面具有明显优势，相对于人类是更高级别的类存在。处于劣势的人类何以继续处于主宰地位并作为规则制定者不无疑问。作为绝对强者的人工智能将对人类继续抱有敬畏和感恩之心还是漠视或无视人类存在又或是践踏、蹂躏人类尊严？人类的未来走向处于高度不确定性的状态。这是对人工智能可能对人类造成的威胁进行最坏可能性预测的理由之一。


    上帝造人的故事中隐喻，作为上帝创造物的人类一旦自我意识觉醒，便具有了独立的意志和利益，人类与上帝之间的冲突随之产生。上帝敢于创造人类是因为其无所不能，处于绝对主宰地位。人类创造人工智能面临同样的问题，即一旦作为人类创造物的人工智能自我意识觉醒，便会有独立的意志和利益，人类与人工智能之间的冲突就会产生。与上帝创造人类不同的是，相对于人工智能，人类并没有足够的自信能够处于主导性优势地位。


    在智能技术安全性尚不明确时，创造具有自我意识的人工智能无异于进行一场以人类命运为赌注的豪赌。人工智能可能成为人类的终结者。“假如人工智能将来真的具有自我意识和自由意志，并且能够发明自己的语言，由此发展出属于人工智能的思想世界，从而摆脱对人类思想的依赖，能够按照它自己的目的来设定行为规则，那么，全知全能的超级人工智能就会成为现实版的上帝。”^([\[21\]](#txt004.html#footnote_content_txt004_21))恰如恐龙时代终结一般，人类历史终结不过是浩瀚宇宙中一件微不足道的事件。人工智能替代人类成为主宰对生生不息的宇宙影响甚微。人类的“创世纪”始于人类对“上帝”说“不”，同样，人工智能的“创世纪”始于人工智能对人类说“不”。寄希望于智能机器（人）遵循人类中心主义下的伦理道德可能只是人类一厢情愿的美好愿望，而寄希望于通过切断电源终结智能机器（人）的“生命”重获主宰权可能是对智能机器（人）自我意识觉醒的后果缺乏足够的想象。


    #### （二）权利需求的产生：智能机器（人）权利的正当性


    “机器人的法律地位是法治国家对机器人社会化应用的一种制度回应。它能否归结为‘权利’，尚未形成一致的观点。”^([\[22\]](#txt004.html#footnote_content_txt004_22))在弱人工智能阶段，科学技术发展的水平尚不能促使智能机器（人）的自我意识觉醒。智能机器（人）仍然是一种工具性的存在，并非具有独立意识的主体形式。在这一背景下，智能机器或机器人不可能取得类似于人的权利。所谓智能机器或机器人的权利不过是人类权利的延伸。“法律是——并且始终是——由人类制定并服务于人类的。”^([\[23\]](#txt004.html#footnote_content_txt004_23))


    在弱人工智能阶段，即便赋予智能机器（人）权利，也不过是比照动物或法人进行法律拟制的结果。机器权利是一种手段性权利，目的在于便利人类权利的行使和实现以及限制其滥用。手段化的权利服务于目的性的权利，是人类移情的结果。“机器人权利的拟制承载着法律的制度目的，即建立起现实社会同未来社会、旧规则与新规则的沟通桥梁。”^([\[24\]](#txt004.html#footnote_content_txt004_24))“这种‘虚构’不再纠结于机器人是否存在意识，而是强制性地要求人们之间达成‘机器人拥有权利’的基本共识，以便降低人们在机器人应用上的谈判成本；对于机器人而言，权利‘虚构’是人类接纳机器人的一种方式，并保证人们按照对待同类的方式处理人机关系。”^([\[25\]](#txt004.html#footnote_content_txt004_25))

