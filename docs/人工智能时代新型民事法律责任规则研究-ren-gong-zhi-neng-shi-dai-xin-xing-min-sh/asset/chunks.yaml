    \ 年第4 期。\n\n[\\[13\\]](#txt008.html#footnote_quote_txt008_13)付新华：“自动驾驶汽车事故：责任归属、法律适用与‘双层保险框架’的构建”，载《华东政法大学学报》2018\
    \ 年第4 期。\n\n[\\[14\\]](#txt008.html#footnote_quote_txt008_14)付新华：“自动驾驶汽车事故：责任归属、法律适用与‘双层保险框架’的构建”，载《华东政法大学学报》2018\
    \ 年第4 期。\n\n\uFEFF\n\n第八章　人工智能时代新型民事法律责任规则设计\n\n人工智能技术的进步改变了人类的认知，该技术的应用深刻影响了社会生活。传统的法律规则体系和思维方式在应对人工智能时代出现的新型社会现象和风险时捉襟见肘，需要构建符合新的时代特征的法律规则体系和思维方式。换言之，在前人工智能时代智能机器（人）并不存在于现实社会生活中，当时形成的法律框架和体系未将人工智能作为考虑的对象。因而，简单套用传统法律框架和体系来确定智能机器（人）的法律地位以及法律责任无异于削足适履。\n\
    \n第一节　规则设计的路径选择\n\n人工智能时代，传统民事法律责任规则体系遭遇挑战，需要采取相应措施进行应对。以欧盟和德国为代表的国家或地区采用了完善民事法律规则的私法路径方案，而以美国为代表的国家采用了政府主导制定行业标准的公法路径方案。两种路径在前瞻性、体系化以及制度成本方面存在差异。\n\
    \n一、私法路径主导的激进模式：以修改或新设规则为中心\n\n私法路径的激进模式注重法律的前瞻性和体系性。它强调人工智能对社会生活和法律制度的革命性影响，认为现有的民事法律责任体系难以解决人工智能带来的冲击，试图通过修改或新设民事法律责任规则的方式构建一套区别于传统民事法律责任规则的新型责任体系。其逻辑基点是人工智能技术革命引发的社会生活变化与既有民事法律责任规则体系之间的鸿沟难以通过体系内修整的方式弥合，人工智能时代的社会生活需要全新的民事法律责任规则体系。\n\
    \n欧盟议会法律事务委员会（JURI）于2016 年5 月和10 月分别发布了《就机器人民事法律规则向欧盟委员会提出立法建议的报告草案》和《欧盟机器人民事法律规则》。2017\
    \ 年，欧盟议会将人工智能立法作为立法议程的核心，明确提出为智能机器（人）重构责任规则的立法建议。反对该路径的学者则认为：“欧盟和德国直接修改民事规则和交通法规的做法，是在事实不清、需要解决的问题不明朗的情况下做出的仓促选择，既不利于鼓励创新，也不利于保障公民的权利。”^([\\\
    [1\\]](#txt009.html#footnote_content_txt009_1))\n\n二、公法路径主导的保守模式：以风险规制为中心\n\n\
    公法路径的保守模式并不否认人工智能技术变革对社会生活的影响，但是，它认为现有法律规则体系与人工智能技术的研发与应用之间尚不存在难以弥合的鸿沟，社会生活变化并未达到需要构建全新的民事法律责任规则体系的程度。\n\
    \n美国倾向于由政府部门负责确立人工智能相关行业的技术标准、安全标准和个人数据保护标准，以弥补传统民事法律责任规则的不足。“美国交通部2017 年9 月发布的自动驾驶汽车指南《自动驾驶系统：安全愿景2.0》针对自动驾驶系统提出了12\
    \ 项安全标准。”^([\\[2\\]](#txt009.html#footnote_content_txt009_2))美国众议院通过的《自动驾驶法案》（Self\
    \ Drive Act）并未改变道路交通规则和侵权法规则，而是划分了联邦与州规制自动驾驶汽车的责任，“明确了交通部在确立自动驾驶汽车硬件安全标准、网络安全标准、公众知情标准等方面的具体义务和履行时间表”^([\\\
    [3\\]](#txt009.html#footnote_content_txt009_3))。具体而言，美国通过在联邦层面进行统一立法来规范自动驾驶行为，制定统一标准，目的是避免因各州规则不一致而增加技术研发和应用的成本，影响行业发展和创新。《自动驾驶法案》并不绝对排斥各州对自动驾驶进行登记、安全检查以及事故调查等，但是，联邦法律具有优先性，各州法律规定不得低于联邦法律规定的性能标准。\n\
    \n公法路径模式侧重于风险防范而非纠纷解决。以风险防范为中心的人工智能法律规制的重心在于人工智能技术研发与应用的边界、技术标准、安全标准以及数据权利保护标准等，至于责任承担与分配并非其直接关注点。一方面，人工智能技术研发与应用带来的未知风险需要通过公法设定技术伦理边界；另一方面，公法路径通过行政机关或行业协会设定人工智能技术研发与应用的标准，约束人工智能设计者、使用者等主体的行为，避免人工智能技术的研发与应用造成损害。民事法律责任的配置是主体之间利益博弈的结果，为解决纠纷而设计民事法律责任规则并不具有紧迫性。\n\
    \n总之，公法路径是经由一定的权力体系实现的，主要包括审批权和监管权。审批权侧重源头预防和控制风险，监管权侧重过程预防和控制风险。人工智能技术的研发与应用涉及人类道德、隐私和个人信息保护、安全等，既需要在研发与应用前进行评估并取得开发审批权，也需要在过程中接受监督管理以保证其符合要求。\n\
    \n三、公法路径与私法路径的比较分析\n\n公法路径与私法路径关注的侧重点有所差异，反映了规则设计者对人工智能技术研发与应用的差异性态度。公法路径侧重于设定或修正技术研发与应用的方向；而私法路径侧重于民事法律责任的设定与分配。以标准化设计为中心的公法路径偏重现实性；而以民事法律责任规则设计为中心的私法路径偏重前瞻性。公法路径与私法路径在理论上并不存在绝对矛盾或排斥的关系，而是一种立法政策上的选择。\n\
    \n表8-1　私法路径与公法路径比较\n\n![](images/txt009_1.jpg \"pagenumber_ebook=222,pagenumber_book=214\"\
    )\n\n在人工智能风险规制的过程中，公法路径和私法路径不是绝对对立或排斥的关系。审批和监管是不是人工智能系统开发和应用的必要程序？从人工智能系统可能诱发不可控的社会风险角度出发，对人工智能系统的开发与应用需要进行审批和监管。但是，从鼓励创新的角度出发，对人工智能系统的开发与应用进行审批和监管会增加开发者和应用者的成本。将公法路径与私法路径相结合的方式在控制风险与鼓励创新之间找到了平衡点。公法路径不可过度，审批和监管并非人工智能技术应用的前提条件。人工智能系统的开发者和生产者可以选择在未经审批的情况下进行人工智能系统的开发和生产，也可以选择经审批在监管之下进行人工智能系统的开发和生产。这就需要区分类型规定不同的审批和监管要求。对涉及生命、健康和安全的人工智能技术的研发与应用必须进行审批和监管；反之则不必强制要求审批或监管，而将是否申请审批或监管的权利赋予开发者或制造者。公法路径需要辅之以私法路径，即区分人工智能系统是否经过监管机构审批或监管确定归责原则。经监管机构批准的智能系统造成损害的，设计者、制造者、使用者承担过错责任；未经监管机构审批的智能系统造成损害的，设计者、制造者、使用者等相关主体连带承担严格责任。^([\\\
    [4\\]](#txt009.html#footnote_content_txt009_4))\n\n四、我国的路径选择\n\n“网络法在中国的变迁大致遵循两类逻辑：外生性的政治／监管逻辑和内生性的商业逻辑。”^([\\\
    [5\\]](#txt009.html#footnote_content_txt009_5))当目光游离于人工智能宏大叙事与具体应用之间时，政治逻辑主导下的管理性规则与商业逻辑主导下的生产性规则都是需要关注的重点。\n\
    \n法律与科技之间存在“相生相克”的微妙关系。一方面，在技术研发与应用相对稳定的时期，技术进步需要法律保障，法律在技术进步中不断丰富和完善；另一方面，在技术研发或应用变革的时期，法律掣肘技术进步或者技术进步游走于法律边缘甚至突破法律设置的藩篱。法律与科技之间的关系处于动态变化过程中，设计人工智能技术研发与应用的法律规范体系需要考虑科技发展的状况并进行动态调整。\n\
    \n我国掀起了人工智能技术研发与应用的高潮。技术变革日新月异，场景化技术应用的范围不断扩张，法律与社会生活之间的鸿沟随之产生。人工智能技术研发的边界、应用场景的范围、致害行为的预防与责任分配等问题在原有的法律体系框架内难以找到完满的答案，需要调整规则设计。在人工智能研发与应用的场景和前景尚不明朗的阶段，为行业发展设定安全底线和方向是法律规则设计最为紧迫和主要的目标，超前设计民事法律责任的归属与分配有制约行业发展之嫌。政府制定技术标准、安全标准等规范人工智能行业的行为，能够保证人工智能技术的研发与应用坚守伦理和安全的底线，有利于行业发展和规划布局。郑戈教授认为，我国应当在人工智能技术研发和应用的实践基础上，衡量公共利益、行业利益和个人利益，由政府部门制定行业发展的相关技术标准。^([\\\
    [6\\]](#txt009.html#footnote_content_txt009_6))\n\n人工智能技术的研发与应用涉及程序设计、数据采集、产品制造等环节，技术标准也围绕这些环节展开，包括设计标准、数据采集标准、安全标准、制造标准等。具体而言：第一，设计标准。算法是人工智能程序设计中的重要环节，算法标准在设计标准中举足轻重。在人工智能技术的研发与应用过程中，需要确定算法标准，防范因算法缺陷或漏洞出现危及安全的技术问题。此外，人工智能技术的研发与应用在设计上需要符合共识性基本伦理道德的要求。第二，数据采集标准。数据采集和分析涉及隐私权和个人信息权，为防止隐私和个人信息泄露或被滥用，需要为相关技术设置法律规则，使得人工智能技术的研发和应用符合隐私保护和个人信息保护的要求，保障隐私和个人信息安全。第三，安全标准。建立人工智能产品标准化体系，保障消费者人身及财产安全。“美国《联邦自动驾驶汽车政策》在‘安全评估’章节中具体提出了自动驾驶汽车设计、测试与应用所涉及的十五项安全标准”^([\\\
    [7\\]](#txt009.html#footnote_content_txt009_7))，《自动驾驶法案》《自动驾驶系统2.0：安全愿景》《准备迎接未来交通：自动驾驶汽车3.0》《邮政行业标准：智能快件箱》等规范性文件对人工智能产品的安全标准都进行了规定。第四，制造标准。人工智能是无形的，但是人工智能机器或设备是有形的，制造人工智能产品的有形载体需要符合一定的制造标准。\n\
    \n通过公法路径制定人工智能技术研发与应用的行业标准确有必要，但是，这并不妨碍我国从私法路径反思和重构民事法律责任规则体系。人工智能的普遍应用将诱发法律体系的颠覆性变革。^([\\\
    [8\\]](#txt009.html#footnote_content_txt009_8))而这一变革首先或直接体现在民事法律责任规则体系方面。人工智能的研发和应用中产生的新型民事法律责任应当由谁承担以及如何承担等问题出现。人工智能时代智能机器（人）的行为可能出现脱离设计者控制、自主独立运行的特征，既有的合同责任规则与非合同责任规则暴露出缺陷和不足。从合同责任方面而言，人工智能时代因智能机器（人）的参与导致合同当事人的选择、合同条款的磋商以及合同执行出现变化，合同责任规则的适用环境发生变化要求对相应的规则进行调整。从非合同责任方面而言，以行为人为中心的侵权责任和以生产者为中心的产品责任在分散人工智能时代智能机器（人）造成的财产损失和人身损失方面存在局限性，人工智能时代需要建立新型民事法律责任规则体系，保障人工智能科技创新与产业发展。\n\
    \n第二节　规则设计的逻辑基点\n\n一、规则设计的前瞻性与保守性\n\n完善或构建人工智能时代新型民事法律责任规则体系应当持未雨绸缪的态度提前考虑，还是待人工智能技术成熟与普及之后再弥合既有规则与技术和社会生活之间的差距？这涉及对法律与社会生活的关系、法律的稳定性与滞后性、法律的创新性限度等理论问题的思考，直接关系到人工智能时代民事法律责任规则研究与设计的基本定位。\n\
    \n法律的稳定性与技术的创新性之间的矛盾永恒存在，这就使法律与技术不同步成为常态现象，法律滞后于技术发展在所难免。过度超越现实甚至以纯粹想象为基础设计法律规则，即便完美也缺乏适用的空间；而缺乏对技术发展趋势进行关注的法律规则设计难以应对社会生活的变化。在现实性与前瞻性之间进行平衡在人工智能时代法律规则设计中显得尤为重要。《格里申法案》在智能机器（人）民事法律规则设计方面进行了有益探索，将智能机器（人）法律制度设计从理念推进到法律技术和文本的层面。\n\
    \n人工智能时代技术发展日新月异，这就要求法律保持一定的开放性，以应对技术创新产生的新问题。弹性立法是人工智能时代为缓和法律的僵化性与适应社会生活的多变性而采用的立法技术，是在一定程度上牺牲法律的确定性，从而保证立法的前瞻性。\n\
    \n二、规则化的可行性及其限度\n\n法律理念、法律价值和法律规则的形成是因应社会生活需要的结果。社会生活发生变化，法律理念、法律价值和法律规则随之变化。但是，这并不意味着只要社会转型或新生事物出现，就会导致法律体系变革。法律理念、法律价值和法律规则的形成不是一蹴而就的，需要经过一段时间的沉淀；相应地，其发展和演变也需要具有延续性。演进式法律发展模式有利于维护社会秩序，保持稳定；而革新式法律发展模式往往会对传统的法律秩序构成冲击，学者或立法者通常对断层式法律发展持谨慎的怀疑态度。^([\\\
    [9\\]](#txt009.html#footnote_content_txt009_9))"
