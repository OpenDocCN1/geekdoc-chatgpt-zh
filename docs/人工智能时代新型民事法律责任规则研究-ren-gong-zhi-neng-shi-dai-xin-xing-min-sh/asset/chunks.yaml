- raw: '持否定说的学者认为：“包括道德、自由和自我意识的强人工智能设想存在根本性错误，这也说明我们期待的强人工智能或许是一个伪命题。”^([\[52\]](#txt003.html#footnote_content_txt003_52))计算机只是研究心灵和思维的工具，本身无法进行思维和心灵活动，所展示的智能外观不过是人类智能的转化，并非真正意义上的智能。“即使这类机器可以通过图灵测试，从本质上说还是和一台极度复杂的中控收音机相差无几。”^([\[53\]](#txt003.html#footnote_content_txt003_53))人类智能是智能的唯一形态，模拟人类智能的机器智能不过是人类智能转化或折射的结果。以此为基础建构的智能图景中，人类是上帝般的存在，是人工智能生成的源泉和原动力，只能被模仿，无法被超越。人类是人机关系中永恒的主宰者。无论机器表现出的智能形式如何强大，不过是人类智能转化的结果，无法与人类智能媲美。“人工智能只是一个受特定算法支配，接受人类指令为人类服务的工具，而不可能成为与人讨价还价的对手或者推心置腹的朋友。”^([\[54\]](#txt003.html#footnote_content_txt003_54))


    否定说立论的基础是现有技术水平和人类情感。一方面，目前人工智能对人类智能的模拟存在局部性和刻板性。这一依据当下人工智能技术发展水平否定其未来发展可能性的技术论证方式因僵化性而难以成立。另一方面，超越人类智能的强人工智能可能带来的控制权转移、技术失控、人类精神家园和尊严的沦丧等社会问题滋生了排斥强人工智能的情感。


    2.肯定说


    人类智能并非智能的唯一形态，人工智能具有替代甚至超越人类智能的可能。狭隘的计算机工具论并未充分认识到计算机的强大功能，“恰当编程的计算机就是心灵”^([\[55\]](#txt003.html#footnote_content_txt003_55))，它能够独立进行思维和感知，产生情感和理智。智能形态具有多样化特征，模拟人类智能的机器智能存在进化的可能，机器智能不再是对人类智能的简单模拟和效仿，可以成为独立于人类智能的新型智能形态。创造出具有心性和灵性、与人类相似甚至超越人类的硅基主体并非天方夜谭。以此为基础构建的智能图景中，人类中心主义被消解，人类智能走下神坛成为与机器智能并列的一种智能形态。


    人机关系中人类占据主导地位的情况是暂时的，随着机器智能的发展，人类会逐渐丧失对智能机器的控制，未来社会将充满不确定性。人类深度依赖智能网络的时代，以网络化形式存在的人工智能的“幽灵”会成为具有极强自我修复能力且无法彻底摧毁的存在。“硅基生命的人工智能最终将超越拟人模式而进入上帝模式，即成为像上帝那样无处不在的系统化存在。”^([\[56\]](#txt003.html#footnote_content_txt003_56))换言之，如果没有预先的技术规制和科学的伦理和法律制度安排，人工智能会成为人类新的“拜物教”的对象。


    3.小结


    强人工智能时代是否会来临是事实判断与价值判断双重作用的结果。一方面，强人工智能时代需要以技术可能性为基础。未来人工智能技术的发展前景只可预测而无法下定论，因而在技术可能性的层面无法证明或证伪强人工智能时代是否会来临。强人工智能时代是否会来临的命题在当下并不是一个科学命题，而是一个猜想命题。另一方面，人类的价值判断对在技术可能的情况下强人工智能时代是否会来临有着重要影响。在技术可能性条件具备的情况下，人类的愿望和期许决定技术研发和应用的边界。技术可能性不同于现实性，在现实性的语境下强人工智能时代能否来临的命题已转变为强人工智能时代应否来临的命题。正是在这一意义上，有学者认为：“人类绝不会为自己制造一个终结者。因此，‘奇点’能否到来，最终由人类说了算。”^([\[57\]](#txt003.html#footnote_content_txt003_57))


    （二）强人工智能的理论预设：思维、心性与灵性


    人类对强人工智能的想象可谓五花八门，科幻电影和小说中充斥着人类构建的强人工智能形象。自人工智能出现以来，对强人工智能技术的理论研究虽几经沉浮，但从未淡出研究者的视野。强人工智能犹如富有魔力的巫师一般召唤着人类。时至今日，强人工智能仍然停留在想象和研究的阶段，并未成为现实。但是，有学者断言：“尽管超级人工智能仍然很遥远，但在理论上是可能的”^([\[58\]](#txt003.html#footnote_content_txt003_58))，“未来必将出现‘机器人N.0
    时代’”^([\[59\]](#txt003.html#footnote_content_txt003_59))。


    “著名数学家图灵（A.M.Turing）是强人工智能最早也是最权威的代表。”^([\[60\]](#txt003.html#footnote_content_txt003_60))他提出的关于心灵的“计算机隐喻”成为探索和研发强人工智能的基础理论。强人工智能的基本理论预设是硅基智能主体等同甚至超越碳基智能主体。在人类有限的想象空间内，思维、心性、灵性成为衡量硅基智能主体能否等同甚至超越碳基智能主体的主要标准。因而，强人工智能的基本理论预设可以从思维、心性、灵性三个方面进行分解。


    1.理论预设一：强人工智能具有与人类智能类似甚至更高的思维


    （1）机器思维命题的提出


    图灵在“计算机器与智能”一文开篇便提出了“机器能够思维吗”的问题。图灵认为，人的思维和认知即计算，“人的心智就是一种计算机器，即一种能计算的机器（所有能做这种事情的物质都可叫做计算机）”^([\[61\]](#txt003.html#footnote_content_txt003_61))，人的计算任务可以由机器完成。倘若思维只是形式推理，思维形式的有效性决定思维的有效性，则思维即计算的命题能够成立。计算机能够通过建立形式化的模型模拟人类的思维。


    倘若将智性理解为行为或决策的理性，“智性的存在表现在合理性，可计算性、规则性，功利性和经验性上”^([\[62\]](#txt003.html#footnote_content_txt003_62))，那么人工智能具有智性的结论应无争议。一种观点认为智性是思维的表现方式，有智性即有思维。只要硅基智能主体与碳基智能主体展现出智性特征，则不论硅基智能主体是否模拟碳基智能主体的思维方式，都不能否认硅基智能主体具有思维能力。反对的观点认为，思维并非智性的唯一源泉，人工智能展现的智性并非思维的结果，而是计算力的体现。硅基智能主体即便展现出智性特征，也不过是计算力的体现，无法上升到思维的层面。


    另有学者将思维与语言能力等同，认为机器具有通过语言构造世界的能力就意味着其具有了思维的能力。“语言能力等价于构造世界的能力（维特根斯坦认为语言的界限等于世界的界限）。在这个意义上，具备了等价于人类语言的任何一种语言能力就等于具备了思想能力，我想这是图灵测试的本意。”^([\[63\]](#txt003.html#footnote_content_txt003_63))


    （2）机器思维的能与不能


    第一，不可知论视角下的考察。不可知论者认为，人工智能是否具有与人类同等的思维能力是无法被证明或证伪的。“确定一台机器能否思维的唯一办法，就是变成这台机器，并感受到自己的思维。然后可以向世人描述这些感受，但是，毫无疑问，任何人所做的任何介绍都不能被认为是正确的。”^([\[64\]](#txt003.html#footnote_content_txt003_64))从抽象思辨的角度看，不可知论关于人工智能能否思维的分析具有一定的合理性。人类思维与人工智能思维是异质的思维方式，则因异质智能形态思维主体之间具有不可通约性，人工智能能否思维的问题超越了人类认知的范畴。但是，这并不妨碍人类以人类思维为参照系，考察人工智能是否具有思维的能力。


    第二，可知论视角下的考察。可知论者又分为神学主义者和科学主义者两大派别。神学主义者通常坚持思维的人类专属性，认为：“思维是人类不朽灵魂的一种机能。上帝把不朽的灵魂给了每个男人和女人，而没有给任何其他动物和机器。所以任何动物和机器都不能思维。”^([\[65\]](#txt003.html#footnote_content_txt003_65))该观点对世俗社会产生了深远影响。机器思维可能导致失控的后果使得人们不希望也不相信机器能够思维。这种因担忧机器思维会给人类带来威胁，而“把头埋在沙中”，盲目否定机器思维能力的观点更多出于满足人类安全需要的主观愿望，而非基于科学论证。


    科学主义者从神学本身以及神学论证的内在矛盾性等方面对神学主义者的观点提出质疑和反驳。一方面，科学主义对纯粹基于想象的神学观点持普遍怀疑态度，认为“神学论点，无论它们可以用来支持什么，都不会给我（图灵）留下深刻印象”^([\[66\]](#txt003.html#footnote_content_txt003_66))。另一方面，该神学论证存在内在矛盾冲突。图灵采用神学的方式对其进行了反驳。他认为：“上面引用的论点中隐含着对全能上帝无限权力的一种严重的限制。……我们不应当比我们在繁衍后代时更加不敬地僭越上帝创造灵魂的权力，不管就这两种情况的哪一种而言，我们都不过是上帝意志的工具，是为他所创造的心灵提供住所而已。”^([\[67\]](#txt003.html#footnote_content_txt003_67))虽然科学主义者反对神学关于思维专属于人类的论证，却绝非一概认同人工智能的思维能够与人类智能的思维媲美。


    （3）机器思维的局限性


    人类思维不限于形式推理，还有直觉推理和经验推理等，具有非逻辑性和非理性的一面，这一复杂性使得坚持计算主义的科学主义陷入困境。


    第一，从目前科学技术的发展水平看，人工智能无法完全还原人类完整的思维过程。“认知神经科学的许多实验结果十分微观，但还是无法刻画人脑中具体的信息处理过程，也对应不了大脑皮层的功能定位，互相之间的关系甚不明了。思维过程现在还根本无法想象。”^([\[68\]](#txt003.html#footnote_content_txt003_68))


    第二，人工智能欠缺辩证逻辑思维能力。辩证逻辑思维是与形式逻辑思维相对应的概念。“形式逻辑的推演表现的是事物自身的等同性，即在推演的过程中，事物质的规定不能从一种质的规定变化为另一种质的规定。辩证逻辑就是在认识事物的过程中不但认知事物当前的、现在的‘质’的不变性（稳定性），同时还要认识到这种不变性是暂住的。”^([\[69\]](#txt003.html#footnote_content_txt003_69))人工智能能够模拟人类智能中形式逻辑思维的部分，却不能模拟辩证逻辑思维的部分，难以应对社会生活中的诸多质变现象。


    第三，人工智能在经验思维方面存在欠缺。经验是与逻辑相对应的概念。人类的思维和心理模型不是纯粹逻辑式的，而是由逻辑和经验共同构建的，逻辑是显性表达，而经验是隐喻。实践中积累的经验，虽然未被显性表达，但不妨碍其有效解决问题。生物进化论和发展心理学已经证明由公式或程序语言来显式表达知识的局限性。社会生活中大量的知识具有隐性和潜意识特征，它们不能通过形式化的方式表达，而需要在社会生活中根据环境变化习得。


    第四，人工智能缺乏混沌思维的能力。“混沌介于严格的规则性和随机性之间，是‘无序中的有序’，有序是指其确定性，而无序则是其最终结果的不可预测性。”^([\[70\]](#txt003.html#footnote_content_txt003_70))人类的混沌思维难以通过机械化的方式复制。


    以人类思维作为判断人工智能思维能力的原型或基础，并不意味着将人类社会惯用的思维概念简单地套用到人工智能上。人类思维是思维的下位概念，即便能够证明人类思维的概念不适用于人工智能领域，也只表明人工智能不具有人类思维的能力，并不能否认人工智能具有思维的能力。


    2.理论预设二：强人工智能具有与人类智能类似甚至更高的心性


    “人的心性是感情、情绪、感觉的发源地，属于完全不同于智性的领域。”^([\[71\]](#txt003.html#footnote_content_txt003_71))图灵用剥“洋葱皮”比喻分析机器是否具有心性的过程。“在考虑心灵或大脑的功能时，我们发现某些运算可以用纯机械方式来解释。这种情况不能代表真正的心灵，它是一种表皮，如果我们要找到真正的心灵，就必须把它剥掉。但是在剩余的部分中，我们又会发现新的要剥去的表皮，这种做法可继续下去。照此进行，我们是抵达了‘真正’的心灵呢，还是最后只看到一层内中空空如也的皮？”^([\[72\]](#txt003.html#footnote_content_txt003_72))


    第一，否定说。否定说认为，计算机程序的语法性不能产生语义性的心性。塞尔（John R.Searle）认为，心性具有语义性，人脑是产生心性的基础；计算机尚不具备人脑的功能，不能产生心性或者与之相当的心理状态。哥德尔认为：“人心胜过一切机器。”^([\[73\]](#txt003.html#footnote_content_txt003_73))


    第二，肯定说。部分计算主义者认为，作为认知现象的心理状态并非人类所独有，人脑、神经系统并非心理状态的唯一来源，计算程序能够替代人脑、神经系统实现类似于人类的心理状态。“心理现象是认知现象，而认知不过就是计算，因此可用程序等计算术语来说明心理过程，而没有必要根据神经过程来解释心灵。”^([\[74\]](#txt003.html#footnote_content_txt003_74))


    是否具有情感是心性的体现。关于情感是否专属于人类？通说认为，人工智能不会为情所累。杰斐逊教授认为：“任何机器都不可能感觉到成功时的愉悦和电子管烧毁时的悲伤，也不会因听到奉承而兴奋，因犯错误而苦恼，因见到异性而着迷，在愿望实现不了时发怒或沮丧。”^([\[75\]](#txt003.html#footnote_content_txt003_75))反对的观点主张，人工智能技术的发展使得情感不再专属于人类。闫守孟研究员指出：“目前的一些服务机器人原型……在技术上已经可以做到‘表达它的情绪，与人类做感情上的交流。’”^([\[76\]](#txt003.html#footnote_content_txt003_76))


    3.理论预设三：强人工智能具有与人类智能类似甚至更高的灵性


    灵性具有高度抽象和难以捉摸的特征，具有“不可言说”之妙。“灵性又可包括恐惧感（或畏惧）、崇拜、生命倾向、神秘性、神圣性和普世的爱等方面。”^([\[77\]](#txt003.html#footnote_content_txt003_77))目前关于人工智能是否具有灵性的思考还停留在想象阶段。於兴中教授将人的秉性分为智性、心性和灵性三个维度，并认为“如果从人的秉性出发来看问题，机器人是无法全方位超越人类的”^([\[78\]](#txt003.html#footnote_content_txt003_78))。人是理性与非理性的复杂统一体，影响其进行自主选择或作出决策的因素不仅有理性，还有情感和信仰。人工智能的优势主要体现在智性维度，在心性和灵性方面远不及人类。智性单一维度的过度发展可能削弱心性和灵性。缺乏对与心性和灵性相关的智能技术进行限制在技术发展的高级阶段会导致毁灭性灾难。


    （三）关于泛化强人工智能的认识：对机器自主学习的误解


    目前存在“泛化强人工智能”的认识，即将能通过学习算法（learning algorithm）自主创建规则的智能机器等同于强人工智能。在机器学习中，学习算法取代程序设计者成为规则创建的主体，学习算法根据提供的训练数据自主推导生成新的规则。机器不再是被动的工具，而是转变为具有感知、决策和执行能力的主观能动者。依赖于后天环境交互的智能超越了人类程序设计者和制造者的控制和预测范围。有学者将这一类型的智能称为合成智能（syn⁃thetic
    intellects）。“它不是传统意义上的编程，也就是说，它突破了‘机器只能做程序员编排它去做的事情’这一局限，你只要给它一大堆人类穷其一生也无法浏览完的数据……包括人类智力根本无法理解的无结构数据，再设定某个具体的目标，最终系统会产生什么结果完全不可预见，不受创造者控制。”^([\[79\]](#txt003.html#footnote_content_txt003_79))合成智能是弱人工智能向强人工智能转变的过渡阶段。在合成智能阶段，智能机器的工具性特征被淡化，但并未达到“通用型人工智能”的要求。虽然智能机器（人）突破了人类的生理极限，通过传感设备实现了“眼观六路、耳听八方”“过目不忘”等人类难以企及的目标，并能通过学习算法在一定范围内自主决策或行为，但其仍然不是全人或超人。合成智能应用的领域受人类程序设计者设定的范围限制，在此范围内人工智能被训练而具有一定的自主性，而超过这一范围就会显得“愚不可及”。弱人工智能向强人工智能转变不是一蹴而就的，需要以科学技术领域的重大突破为基础。


