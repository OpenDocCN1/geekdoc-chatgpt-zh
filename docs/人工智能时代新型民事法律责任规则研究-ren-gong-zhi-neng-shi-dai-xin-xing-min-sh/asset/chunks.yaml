    ## 二、以驾驶分级为中心的考察


    智能驾驶汽车是人工智能应用于汽车领域的结果，其实质是移动的智能机器（人）。汽车的自动化程度影响人车关系和驾驶形态，它是区分设定责任规则的必要考虑因素。汽车从无智能驾驶到完全智能驾驶，自动化程度逐渐增强，司机的角色由驾驶者向乘客渐变，责任重心从人的责任转向物的责任。


    ### （一）驾驶分级与人车关系


    智能驾驶分级是确定人车关系的前提条件。^([\[42\]](#txt006.html#footnote_content_txt006_42))美国公路交通安全管理局将驾驶分为五个等级，而美国汽车工程师协会（Society
    of Automotive Engineers，简称 SAE）将其分为六个等级。两者大同小异，差别在于美国汽车工程师协会在完全智能驾驶阶段的层次划分更为细致、复杂。^([\[43\]](#txt006.html#footnote_content_txt006_43))按照美国汽车工程师协会的标准，驾驶从
    L0 到 L5 被分为六个等级，即无自动化（L0，no automa⁃tion）、驾驶辅助（L1，driver assisitant）、部分自动化（L2，partial
    automation）、有条件自动化（L3，conditional automation）、高度自动化（L4，high automation）和完全自动化（L5，full
    automation）。


    L0 级驾驶不属于智能驾驶，人类驾驶员完全掌握驾驶权，负责观察道路交通状况并作出应对。驾驶支持或辅助系统为人类驾驶员决策提供帮助，不具有控制汽车驾驶权的能力。在人车关系中，机动车处于完全被动的状态，机动车在驾驶人的控制下运行。


    L1～L3 级驾驶具有了一定的智能驾驶元素，但是驾驶行为主要依赖人类驾驶员。在人车关系中，智能机器（人）行为的主动性增强，驾驶权逐渐由人类驾驶员转向智能驾驶系统，但其并未摆脱辅助人类驾驶员的角色定位。智能汽车的工具属性决定人类驾驶员仍然是驾驶责任的承担主体。智能机器（人）与人类驾驶员共同完成驾驶行为，智能驾驶系统起到驾驶辅助的作用。人类驾驶员主导机动车控制权，不能离开驾驶员的位置。


    “有条件的自动驾驶（level 3）以上的阶段才是自动驾驶汽车发展的方向和拟运用的主要场景，也是自动驾驶汽车的民事责任引起各方关注的主要技术背景。”^([\[44\]](#txt006.html#footnote_content_txt006_44))L4～L5
    级驾驶中机动车已演进为“站在轮子上的智能机器人”，驾驶行为由智能机器（人）自主完成，人类的角色从驾驶员转变为乘客。


    ### （二）基于驾驶分级的民事法律责任分析


    智能驾驶汽车分级是以人类对智能汽车的控制权为基础的，不同级别的智能驾驶汽车中人类扮演角色不同，其需要承担的民事法律责任也有所差异。L1～L3 级驾驶中，智能驾驶的责任类型以人的责任为主。掌握智能汽车驾驶控制权的人类驾驶员作为主导者有责任保障驾驶行为的安全性。人类驾驶员“对机动车运行危险承担过错推定责任。只在能够证明自动驾驶机动车有缺陷，驾驶人无过失且其即使尽到高度注意义务仍无法避免发生事故造成损害的情形下，才应当由自动驾驶机动车的生产者、设计者、销售者承担产品责任”^([\[45\]](#txt006.html#footnote_content_txt006_45))。美国佛罗里达州
    2016 年发生的 ModelS 交通事故案中，事故车辆的智能驾驶级别为 L2 级，用户手册中明确载明了辅助驾驶系统的作用，警示驾驶员不能脱离驾驶状态，在发现危险时需要随时接管驾驶。“驾驶人未尽机动车操控者的专心驾驶之责，在碰撞事故发生前未能及时发现危险、迅速接管驾驶，导致事故发生，是直接责任者，应当适用传统道路交通事故责任规则确定责任归属。”^([\[46\]](#txt006.html#footnote_content_txt006_46))


    L4～L5 级驾驶中，智能汽车的使用者并不存在主观过错或加害行为，作为侵权责任构成要件之一的因果关系更是无从谈起。智能驾驶汽车发生交通事故造成人身或财产损害不能归咎于乘客。即便智能汽车使用者坐在驾驶员的位置上，也无需对交通事故承担民事责任，除非人类驾驶员主动介入掌握了智能汽车的控制权。


    《中国制造（2025）》按照智能网联汽车的智能化程度，将其分为四种类型，从 DA 到 FA 人类驾驶员逐渐丧失驾驶控制权，直至无人驾驶。有学者将智能驾驶分为驾驶支援、狭义自动驾驶和无人驾驶三个阶段对智能驾驶的责任构成与分配进行研究。^([\[47\]](#txt006.html#footnote_content_txt006_47))换言之，依驾驶权转移程度将驾驶行为类型化，可以分为辅助驾驶、人机共同驾驶和智能驾驶系统驾驶三种类型。在驾驶支援阶段，责任的构成与分配与传统机动车责任无异。在狭义自动驾驶阶段，智能驾驶系统使用人与智能驾驶系统共同控制智能汽车，属于共同驾驶人。在无人驾驶阶段，智能驾驶系统完全取代人类驾驶员成为驾驶控制权的主体，智能系统的生产者或智能机器本身需要承担驾驶人责任。


    ## 三、以驾驶控制权为中心的考察


    驾驶人是指实际控制机动车，对驾驶行为负责的人。人工智能出现以前，驾驶人的身份相对容易判断，即在特定位置驾驶机动车的人。人类驾驶员是传统的驾驶活动控制者，也是交通事故损害赔偿责任的承担主体。智能驾驶技术出现后，智能驾驶系统辅助或取代人类驾驶员，事实上部分或全部控制机动车。智能驾驶形态各异，相应的民事法律责任体系关注的重心也存在差别。


    ### 1. 辅助驾驶阶段：人类驾驶员控制驾驶权


    智能驾驶支援系统起到辅助人类驾驶员的作用，驾驶控制权保留在人类驾驶员手中，人类驾驶员需要时刻对机动车运行状况以及路况等保持警惕。人类驾驶员而非智能驾驶支援系统实际控制机动车，智能驾驶支援系统并未在控制机动车方面取代人类驾驶员。


    有学者提出：“大规模采用驾驶支援系统以后，驾驶人能否主张自己无过错，继而主张仅承担损害 10%的责任。”^([\[48\]](#txt006.html#footnote_content_txt006_48))我们认为，智能支援系统的普及不会对责任分配构成实质冲击。在这一阶段，人类驾驶员需要对驾驶过程中机动车的状况和路况进行自主分析，作出理性判断。智能驾驶支援系统是人类驾驶员自主理性判断的辅助工具，而不是主张免责的“挡箭牌”。驾驶员的过错主要包括两种类型：第一，基于使用机动车产生的过错；第二，基于信赖驾驶支援系统产生的过错。值得注意的是，在驾驶支援系统阶段，人类驾驶员不能基于对驾驶支援系统的完全信赖而主张免责。例如，在导航系统与实际路况不符的情况下，人类驾驶员需要对路况进行理性判断，而不能完全信赖导航系统。


    驾驶支援系统可以分为信息提供系统和操作辅助系统。信息提供系统未直接提供额外的安全保障，该系统出现瑕疵后人类驾驶员仍能避免事故发生，切断了瑕疵与事故之间的因果关系；操作辅助系统提供了额外的安全保障，让人类驾驶员产生合理信赖，该系统出现瑕疵与事故发生之间的因果关系未被切断。^([\[49\]](#txt006.html#footnote_content_txt006_49))


    ### 2. 共同驾驶阶段：人类驾驶员与智能驾驶系统共同作用


    智能驾驶支援系统升级为自主智能驾驶系统后，智能汽车驾驶控制权主体出现多元化趋势，人类驾驶员的角色发生变化。施哈德（Schrader）提出了“双重驾驶人共同驾驶”的分析框架。智能驾驶系统事实上部分或全部地控制智能汽车驾驶运行，使得智能驾驶系统本身或其生产者具备了驾驶人的属性。^([\[50\]](#txt006.html#footnote_content_txt006_50))“由第三人事实上控制车辆的运行仅导致第三人本身具有驾驶人的属性，并不导致原驾驶人丧失其运行支配。因为在驾驶员位置的人仍然保留了介入的可能性。”^([\[51\]](#txt006.html#footnote_content_txt006_51))也就是说，智能驾驶系统控制智能汽车运行的事实使智能驾驶系统本身或智能驾驶系统的生产者等主体具备了作为驾驶人的条件，人类驾驶员丧失的是唯一驾驶人而非驾驶人的身份。人类驾驶员保留了介入智能汽车驾驶的可能，能够随时终止智能驾驶系统对智能汽车的控制。智能汽车驾驶行为由人类驾驶员和智能驾驶系统共同完成。


    智能汽车的驾驶控制权在人类驾驶员与智能驾驶系统之间转移，相应地民事法律责任也在不同主体如车主、制造商、人类驾驶员等之间发生转移。“由于智能汽车的驾驶操作是司机和自动驾驶系统共同完成的任务，确定事故发生时由哪方在驾驶，对责任的划分至关重要”。^([\[52\]](#txt006.html#footnote_content_txt006_52))为明确不同类型主体的民事法律责任，需要对人机控制权模式切换的相关信息进行存储和保留，这就需要对智能驾驶数据的搜集、存储、使用及删除规则进行设计。


    人类驾驶员接管或移交驾驶控制权时，智能系统需要对相关的时间、地点、路况、汽车性能、技术故障等信息进行保存。^([\[53\]](#txt006.html#footnote_content_txt006_53))事件数据记录仪（Event
    Data Recorder，EDR），俗称“黑匣子”，此技术为判断人类驾驶员是否及时、合理地履行了接管义务提供了事实依据。在发生交通事故后，可以通过“黑匣子”的记录快速且准确地判定事故发生的原因，这既有助于法律责任的分配，又有助于对人员致伤原因的判定和保险理赔的鉴定。^([\[54\]](#txt006.html#footnote_content_txt006_54))在德国，为了确保数据存储合乎法律要求的证明目的，《德国道路交通法》要求，通常情况下自动驾驶汽车所存储的数据在
    6 个月之后删除，但如果该机动车涉及第 7 条第 1 款规定的事故的，相关数据在 3 年后才可以删除（第 63a 条第 4 款）。^([\[55\]](#txt006.html#footnote_content_txt006_55))


    在人机混合模式下，智能驾驶导致人员和财产损害的责任如何划分？人机切换模式能否作为减轻设计者或生产者责任或加重人类驾驶员责任的正当理由？有学者认为，“共同驾驶”阶段相应的责任需要根据共同侵权的规则进行判断。“生产者取得了驾驶人的属性，需要承担驾驶人责任。……此种观点导致了共同的汽车驾驶，在事故中根据共同侵权的规则处理。”^([\[56\]](#txt006.html#footnote_content_txt006_56))有学者提出反对意见：“尽管在自动驾驶阶段，从技术方面来看，需要系统使用人监控系统，但是这并没有赋予系统使用人事实上对车辆运行的事实控制……采用共同驾驶的区分，忽视了机器完全控制驾驶任务，并且架空了驾驶人责任中实际控制这一要件。”^([\[57\]](#txt006.html#footnote_content_txt006_57))


    ### 3. 智能驾驶系统控制阶段：从“驾驶员”到“乘客”的身份转变


    在驾驶行为完全由智能驾驶系统控制的阶段，人类驾驶员的角色完成从驾驶员向乘客的转变。“在一些厂商所意图发展的高等级智能汽车中，如谷歌的概念车、大众发布的 Sedric
    概念车等，则已经完全取消了方向盘、刹车等干预装置，乘客只需要（也只能够）完成开启关闭车辆、输入目的地等操作。”^([\[58\]](#txt006.html#footnote_content_txt006_58))“波顿恩（Bodungen）和霍夫曼（Hoffmann）则认为，在自动驾驶的状态下，在驾驶员位置的人类已经丧失了驾驶人属性，在与责任相关的事故时点上，自动驾驶系统自行作出了决断，因此，也仅系统符合驾驶人的定义。”^([\[59\]](#txt006.html#footnote_content_txt006_59))人类驾驶员的行为存在过错的前提是回避可能性。倘若人类驾驶员尽到了必要注意义务仍然无法回避，则人类驾驶员没有可归责的主观过错。高级智能驾驶阶段判断“机动车一方”的过错无法在既有的法律框架中寻求答案。智能机器（人）的生产者提供的不再单纯是一种产品，而且是一种服务，需要对服务造成的损害承担相应的民事责任。“《道路交通安全法》仅将机动车驾驶人视为‘交通违法行为’的责任人。在无人驾驶汽车应用过程中，因无人驾驶技术缺陷所造成的交通事故归责，就成为《道路交通安全法》的一大漏洞。”^([\[60\]](#txt006.html#footnote_content_txt006_60))


    智能驾驶是否必须由人类驾驶员共同完成或作为补充？美国持否定态度，允许无人驾驶汽车进行路测；中国和德国的态度相对保守，运行智能驾驶系统时需要配备人类驾驶员，随时接管。在这一模式下，人机切换的脱手难题（hands-off
    problem）随之产生。驾驶权如何由智能驾驶系统平滑过渡到人类驾驶员？人类驾驶员是否需要时刻保持警惕状态？处于放松状态的人类驾驶员是否具备及时接管的反应能力？这一背景下，驾驶资格制度需要重新构建，即从关注人类驾驶员的年龄、身体状况、是否通过驾驶考试转向对智能驾驶系统的认知、理解和操控能力。


    ## 四、智能驾驶中的民事法律责任类型


    “不明确的交通责任与产品责任皆为阻碍自动驾驶车进入市场的制度性屏障。”^([\[61\]](#txt006.html#footnote_content_txt006_61))对因智能技术进步以及普及应用而产生的新型智能驾驶形态导致的损害如何进行责任分配问题能否在既有的法律框架体系中寻求完满答案？这决定了智能驾驶民事法律责任规则的研究路径。倘若答案是肯定的，则通过法律解释的方法就可以解决现实问题，立法的迫切性降低；反之，则需要通过立法重构规则体系。


    智能驾驶发生事故造成损害的类型分为两种：第一，智能驾驶中发生交通事故导致智能汽车和人类驾驶员遭受损失；第二，智能驾驶中发生交通事故导致第三人遭受人身或财产损失。如何救济因智能驾驶导致的损害？在人工智能专门法律规范体系尚未建立的前提下，求助于既有的侵权责任法律规范体系，在“产品责任+传统交通事故责任”的框架中寻求解决方案的做法得到多数学者的认同。

    '
  toc: []
- raw: '传统的汽车交通事故一般可以归因于驾驶人、产品缺陷以及自然条件，可以分为人的责任和物的责任两种类型。非因机动车缺陷导致交通事故的责任属于人的责任，由机动车所有人或驾驶人承担。^([\[62\]](#txt006.html#footnote_content_txt006_62))因机动车缺陷导致交通事故的责任属于物的责任。同理，智能驾驶造成人身或财产损害的责任也可以分为人的责任和物的责任两种类型，人的责任主要是道路交通事故责任，物的责任主要是产品责任。随着驾驶的自动化程度升级，智能驾驶发生交通事故的责任属性逐渐由道路交通事故责任转变为产品责任，即在自动化驾驶程度较低的情况下，道路交通事故责任为主，产品责任为辅；而在自动化驾驶程度较高的情况下，产品责任为主，道路交通事故责任为辅。


    另有学者在机动车交通事故责任和产品责任的二元框架基础上增加高度危险责任类型。“机动车交通事故责任、产品责任和高度危险责任在某种程度上均可适用于无人驾驶侵权的责任类型，三者在应对人工智能时代的无人驾驶汽车侵权事件中各有所长，阶段性的类型化探讨更能为复杂的责任类型提供归责进路。”^([\[63\]](#txt006.html#footnote_content_txt006_63))还有学者认为：“拥有大数据分析、深度学习和自动化决策算法的无人驾驶汽车逐渐成为工具理性与价值选择相融合的新生事物，而现行的《侵权责任法》无法确定该类事故的责任承担者。”^([\[64\]](#txt006.html#footnote_content_txt006_64))人工智能技术的应用滋生了对技术理性的盲目崇拜，忽略了其前提假设的有效性。在工具理性与价值理性二元区分的框架下，科技产品被赋予工具属性，价值判断由其背后的社会主体作出。人工智能技术的研发与应用使工具属性与价值判断相融合，智能机器（人）对人类指令的服从性弱化。价值选择究竟取决于技术背后的社会主体还是技术的凝结物本身的问题出现，责任分配的问题复杂化。


    （一）道路交通事故责任


    “机动车交通事故，是指机动车与非机动车驾驶人员、行人、乘车人以及其他在公路、城市道路和虽在单位管辖范围但允许社会机动车通行的地方以及广场、公共停车场等用于公众通行的场所上，进行交通活动的人员，因违反《道路交通安全法》和其他道路交通管理法规、规章的行为，过失或者意外造成的人身伤亡或者财产损失的事件。”^([\[65\]](#txt006.html#footnote_content_txt006_65))将智能驾驶汽车作为机动车的一种类型，其造成的损失需要适用道路交通事故责任规则。


    对是否区分机动车保有人责任与驾驶人责任这一问题，各国立法有所差异。《德国道路交通安全法》（2016 年修改）对二者进行区分。“道路交通事故严格责任独立于车辆的自动化程度，即机动车持有人必须承担责任。”^([\[66\]](#txt006.html#footnote_content_txt006_66))我国《道路交通安全法》第76
    条中使用了“机动车一方”这一模糊概念，并未明确区分保有人责任与驾驶人责任。关于“机动车一方”的理解^([\[67\]](#txt006.html#footnote_content_txt006_67))，“我国学界有力说同样倾向于遵循德国法学说，区分机动车保有人和驾驶人，第76条规定的‘机动车一方’系指机动车保有人。判断保有人采二元标准，即运行支配与运行利益。通常，机动车的所有人及租赁、借用汽车的使用人等均为保有人。”^([\[68\]](#txt006.html#footnote_content_txt006_68))有必要在区分保有人与驾驶人的框架下分析智能驾驶汽车使用人和保有人的责任。


    1.以驾驶员过错为中心的使用人责任


    传统驾驶行为的安全性与人类驾驶员的驾驶技术和能力密切相关，《道路交通安全法》及相关法律法规以人类驾驶员的驾驶行为为中心，以人类驾驶员的主观过错为基础构建相应的责任承担体系。在机动车驾驶过程中，人类驾驶员对汽车具有控制权，过错是判断驾驶人是否应当承担民事法律责任以及承担民事法律责任比例的基础，而判断驾驶人是否具有过错的主要依据是驾驶过程中驾驶人是否履行了必要的注意义务。“法定的注意义务是认定过错的基本标准，在满足当事人主观可归责性的基础上尚须在客观上违反了注意义务。”^([\[69\]](#txt006.html#footnote_content_txt006_69))根据我国《道路交通安全法》的规定，机动车驾驶人限定为人类驾驶员，驾驶权限定在人类驾驶员手中。人类驾驶员的双手不能离开方向盘。人类驾驶员在驾驶过程中未尽到注意义务造成人身或财产损害，需要承担相应的侵权责任。智能驾驶中，由人类驾驶员承担过错责任是传统道路交通事故责任在智能驾驶领域的自然延伸。


    智能驾驶汽车有别于传统的机动车，智能驾驶使驾驶行为摆脱了对人类驾驶员的技术依赖。智能驾驶中人类驾驶员的身份部分或全部地发生从驾驶者向乘客的转变，注意义务的内容和需要履行注意义务的时间点是否应当发生变化以及如何发生变化不无疑问。倘若智能驾驶汽车使用者的身份部分转变为乘客，使用者并未完全丧失驾驶员的身份，其仍然负有必要的注意义务；倘若智能驾驶汽车使用者的身份全部转变为乘客，其不再具有驾驶员的身份，则无所谓人类驾驶员或所谓的人类驾驶员有名无实，不再存在人类驾驶员需要承担相应注意义务的问题。无人驾驶汽车对驾驶人员的消减与代替使得以驾驶人员主观过错为基础的责任体系不具有可适用性。^([\[70\]](#txt006.html#footnote_content_txt006_70))


    关于智能驾驶中人类驾驶员的具体注意义务，有学者认为：“世界各国一直未开放自动驾驶汽车的完全控制权。自动驾驶汽车需要有执照的驾驶员坐在方向盘后面，以便在系统失灵的情况下控制车辆；人类驾驶员仍然负有接管义务和注意义务。”^([\[71\]](#txt006.html#footnote_content_txt006_71))《德国道路交通法》（2016
    年修订）第1b 条第2 款规定，智能驾驶过程中人类驾驶员负有警觉义务和接管义务。


    （1）警惕义务


    警惕义务（prudent duty），又称警觉义务，是指驾驶员在机动车行驶期间需要保持警醒的状态，以保障安全行驶。根据驾驶形态不同，警惕义务指向的对象及内容有所差异。智能驾驶出现以前，人类驾驶员需要在驾驶全程保持警惕。人类驾驶员的手需要时刻紧握方向盘并关注机动车的运行状况以及路况，作出合理的判断和决策。智能驾驶出现后，人类驾驶员警惕义务的内容发生了变化。智能驾驶汽车处于人类驾驶员与智能驾驶系统共同控制（shared
    control）或授权控制（authorized control）的状态下。^([\[72\]](#txt006.html#footnote_content_txt006_72))智能驾驶期间人类驾驶员可以从事与驾驶行为无关的活动，如阅读、上网、思考、玩游戏等，不必时刻对车辆运行状况和路况保持警惕。人类驾驶员需要对智能驾驶系统的预警信息保持警惕，即注意义务的对象从关注机动车行驶的状况逐渐转向关注智能汽车的运行状况。


    （2）接管义务


    接管义务（handover duty），又被称为“无迟延控制汽车的义务”，是指智能驾驶系统发出接管控制权的请求或者人类驾驶员意识到需要接管控制权时，人类驾驶员需要及时掌握汽车的驾驶权，作出合理的判断和决策。人类驾驶员是否负有接管义务？在何种情形负有接管义务？


    2016 年5 月7 日，在美国佛罗里达州列维县（Levy County）的高速公路上，乔舒亚·布朗（Joshua Brown）采用自动驾驶模式驾驶一辆特斯拉Model
    S 轿车全速行驶时，智能驾驶系统误将白色的卡车车身当作天空，未能识别出转弯的卡车，导致两车相撞、车毁人亡。车载系统数据表明，事故发生时该车处于自动驾驶状态，紧急制动装置未作出警示或自动刹车，驾驶员未采取避免碰撞的行为。同年6
    月美国国家公路安全管理局针对该车智能驾驶系统在碰撞时的设计和性能启动调查程序。智能驾驶系统是否处于启动状态成为争议的关键。“其中所体现的侵权法原则是：在事故责任不在于别的车辆的情况下，如果汽车处在自动驾驶状态，责任应当由汽车制造商承担；如果汽车处在人为操作状态，责任则在于司机。”^([\[73\]](#txt006.html#footnote_content_txt006_73))郑戈教授认为这一包含在“默会知识”中的法律原则在马车、骡车时代已经存在。


    在智能驾驶过程中，不参与驾驶活动的人类驾驶员处于等候状态，不负有对道路交通状况和智能汽车运行状况进行监控的义务；但是，需要时刻警醒以备接管，当智能系统发出接管讯息或请求以及智能系统无法正常工作时，人类驾驶员需要及时、合理地对智能汽车进行接管。2017
    年6 月，德国颁布《道路交通安全法第八修正案》要求“在任何情况下驾驶员都可以手动取代或关闭自动驾驶系统并接管车辆；自动驾驶系统应可以识别出需要驾驶员亲自操控的情形，并在移交接管前向驾驶员作出足够的提示等”^([\[74\]](#txt006.html#footnote_content_txt006_74))。


    接管义务具有以下法律特征：①接管义务产生的条件。人类驾驶员必须始终在方向盘后处于等待状态，在智能驾驶系统发出请求后或智能系统无法正常工作时对智能汽车进行控制。换言之，接管义务产生的条件有两个，一是智能驾驶系统无法正常工作；二是智能驾驶系统发出请求。②接管义务产生的时点。接管涉及驾驶权在智能驾驶系统和人类驾驶员之间进行转移，人类驾驶员负有接管义务的时间点问题随之产生。《德国道路交通法》（2016
    年修订）第1a 条第2 款中规定的“充足的预留时间”和第1b 条中规定的“立即”等概念具有模糊性，需要进一步明确。需要根据理性人标准确定人类驾驶员接管驾驶控制权的合理时间，避免苛责人类驾驶员或为其逃避责任提供借口。③接管义务产生的法律后果。接管义务与责任移转之间存在密切的关系，接管前后驾驶模式的切换导致法律责任的转移。“如果自动驾驶模式正在运行过程中发生了事故，责任在于汽车制造商。但如果自动驾驶系统已经发出了请求人工控制的信号，责任便转移到了汽车上的驾驶人员身上。”^([\[75\]](#txt006.html#footnote_content_txt006_75))


    英国《自动与电动汽车法案》区分自我驾驶（driving itself）与高级辅助驾驶系统（advanced driver assistance system），在此基础上对接管义务采取不同态度。采用高级辅助驾驶系统的智能驾驶中人类驾驶员负有接管义务，需要随时准备接管；采用自主驾驶方式的智能驾驶中驾驶权在部分路段甚至全程转移至智能驾驶系统，人类驾驶员不负有监管或干预驾驶行为的义务。二者之间存在一定的模糊地带。“虽然L3
    级别的自动驾驶汽车能够执行整个动态驾驶任务（Dynamic Driving Task，DDT）——包括监测驾驶环境，但是在车辆需要的情况下，则要求驾驶员进行干预。因此，在车辆需要的情况下要求驾驶员干预是否构成‘控制’或‘监控’，这一点是值得商榷的。”^([\[76\]](#txt006.html#footnote_content_txt006_76))


    接管义务与智能驾驶技术分级密切相关。L0 和L1 级驾驶中，智能驾驶系统仅起到辅助或优化人类驾驶员某项核心控制的功能，如转向、刹车等，并未替代人类驾驶员取得核心控制权，无所谓人类驾驶员进行接管。L2
    级智能驾驶中，人类驾驶员与智能驾驶系统处于联合控制车辆的状态。人类驾驶员有条件地放弃部分车辆控制权，对车辆需处于监控状态。智能驾驶系统在无事先预警的情况下放弃车辆的控制权时，人类驾驶员负有随时接管义务。


    L3 级智能驾驶中，人类驾驶员不必将目光紧盯在监控系统上。在特定环境下，智能驾驶系统控制车辆所有核心功能。只有在智能驾驶系统发出预警时人类驾驶员才负有接管义务。“世界范围内已经通过的关于自动驾驶的法律、国际公约、政策指南等，大多是针对L3
    级别自动驾驶的立法方案，并且分享着一条共同的原则：人类驾驶员需要在紧急情况下随时准备接管汽车。”^([\[77\]](#txt006.html#footnote_content_txt006_77))


    《上海市智能网联汽车道路测试管理办法（试行）》区分有条件自动驾驶和高度自动驾驶来确定人类驾驶员的接管义务。有条件自动驾驶中智能驾驶系统向人类驾驶员发出响应请求后，人类驾驶员需要响应；而高度自动驾驶中即便智能驾驶系统向人类驾驶员发出响应请求，人类驾驶员也无需响应。“高度自动驾驶阶段的驾驶员可忽视系统提出的接管请求，意味着不再具有接管义务，那么实则与无接管请求功能的完全自动驾驶阶段交通事故侵权责任的承担原理并无区别。”^([\[78\]](#txt006.html#footnote_content_txt006_78))


    （3）人类驾驶员法定义务和责任设计评析


    人类驾驶员在驾驶行为中扮演的角色是区分产品责任与非产品责任并进而在人类驾驶员、车辆保有人与制造商、设计者等主体之间分配责任的关键。人类驾驶员参与驾驶活动的，相关主体依其过错承担法律责任；非因人类驾驶员驾驶行为导致的损失，通常依产品责任由制造商等相关主体承担责任。


    这一责任分配方式给驾驶人员带来了不确定性。福尔克尔·吕德曼（Volker Lüdermann）教授认为，《德国道路交通法》并未完全处理好自动驾驶系统与人类驾驶员之间的关系。驾驶过程中，人类驾驶员需要时刻保持警醒的待命状态（stand
    by），在智能驾驶系统发出接管信号后“立即”接管，未能为人类驾驶员提供充分保障。^([\[79\]](#txt006.html#footnote_content_txt006_79))试想，如果一个人花比传统汽车贵得多的价钱购买了自动驾驶汽车，却必须时刻保持警觉，而且要在自动驾驶系统控制汽车操作一段时间后瞬间介入，应付紧急情况，这实际上对驾驶员提出了更高的要求。^([\[80\]](#txt006.html#footnote_content_txt006_80))此外，“佩尔茨曼效应”（Peltzman
    Effect）“认为车辆安全检查计划为驾驶员提供了一种虚假的安全感，导致其在驾驶时不太审慎”^([\[81\]](#txt006.html#footnote_content_txt006_81))。换言之，与驾驶无关的行为会分散人类驾驶员的注意力。使用自动驾驶汽车的主要目的是节约驾驶时间，以便用来看书、睡觉、发短信、玩“光晕”（hole）游戏，或者做其他事情，一旦自动驾驶汽车普及开来，让人们因疏于监控自动驾驶汽车而承担责任似乎就有些荒谬了，因为人们根本就不会监督它们。^([\[82\]](#txt006.html#footnote_content_txt006_82))智能驾驶技术发展的目的是让智能驾驶系统部分或全部替代人类驾驶员，将人类驾驶员从繁重、烦闷的驾驶活动中解放出来。倘若需要人类驾驶员一直关注人机切换模式，随时处于待命的高度紧张状态，则与智能驾驶技术的应用目的有所背离。“这种注意义务在生理上难以实现，事实上让操作人无法主张自己没有过错。”^([\[83\]](#txt006.html#footnote_content_txt006_83))


    2.智能驾驶汽车保有人责任


    （1）智能驾驶汽车保有人的无过错责任


    “自动驾驶汽车就好比是所有人雇佣的司机。当自动驾驶汽车按照所有人的指示运行时，如果其违反道路交通规则，进而发生交通事故，那么，理当由所有人承担责任，就好比雇员的行为引起损害由雇主承担责任一样。”^([\[84\]](#txt006.html#footnote_content_txt006_84))与驾驶员基于过错归责不同，机动车保有人需要承担无过错责任。人工智能时代，人类驾驶员对智能驾驶系统故障造成的损害不需要承担赔偿责任。^([\[85\]](#txt006.html#footnote_content_txt006_85))但是，智能驾驶汽车保有人需要承担无过错的损害赔偿责任。这一结论的正当理由包括：


    第一，“保有人责任的基础在于抽象风险，是每辆机动车无论如何均会给其他交通参与人带来的风险，与个案情况无关”^([\[86\]](#txt006.html#footnote_content_txt006_86))。换言之，智能驾驶汽车保有人承担责任的基础是技术风险带来的抽象风险，驾驶权即便由智能驾驶系统掌控，智能驾驶的运营费用的负担主体和利益享有主体仍然为智能汽车保有人而非制造者或生产者。


    第二，身份转变为乘客的驾驶员遭受的损失能够得到更充分的救济。将机动车道路交通事故责任的主体从驾驶员扩及机动车保有人，可以适应自动驾驶汽车逐渐由自动系统承担驾驶任务这一变化。^([\[87\]](#txt006.html#footnote_content_txt006_87))人类驾驶员在智能驾驶系统掌控驾驶权的阶段，身份由驾驶员转变为乘客，遭受损害时可以依乘客的身份请求救济。


    第三，交通事故受害人获得救济的便利性。“以机动车风险为基础的责任，使得受害人在求偿时，不必困扰于人机混合驾驶时驾驶员是否有过失，或者在人机混合行驶时完全自动驾驶汽车与全手动驾驶汽车或有条件的自动驾驶汽车之间的过错和事故原因判定等难题。”^([\[88\]](#txt006.html#footnote_content_txt006_88))


    机动车保有人承担无过错责任并非没有边界。“机动车保有人承担的无过错责任是有数额限制的。超过这一限额，则必须回归到传统的过错责任上，也即驾驶人责任。”^([\[89\]](#txt006.html#footnote_content_txt006_89))《德国道路交通法》（2016
    年修订）第12 条第1 款提高了车主承担无过错赔偿责任的额度，强化了对受害人的保护。


    （2）机动车保有人的安全检查义务


    智能汽车保有人负有定期对智能汽车进行安全检查的义务，需要定期对智能汽车进行保养、维护或修理以及系统升级。对智能汽车进行安全检查的范围包括硬件设施和软件设施。倘若车主未履行安全检查义务，车主对事故责任需要承担民事法律责任；反之，则民事法律责任由车主转移至制造商。^([\[90\]](#txt006.html#footnote_content_txt006_90))


    （二）产品责任'
  fmt: '

    传统的汽车交通事故一般可以归因于驾驶人、产品缺陷以及自然条件，可以分为人的责任和物的责任两种类型。非因机动车缺陷导致交通事故的责任属于人的责任，由机动车所有人或驾驶人承担。^([\[62\]](#txt006.html#footnote_content_txt006_62))因机动车缺陷导致交通事故的责任属于物的责任。同理，智能驾驶造成人身或财产损害的责任也可以分为人的责任和物的责任两种类型，人的责任主要是道路交通事故责任，物的责任主要是产品责任。随着驾驶的自动化程度升级，智能驾驶发生交通事故的责任属性逐渐由道路交通事故责任转变为产品责任，即在自动化驾驶程度较低的情况下，道路交通事故责任为主，产品责任为辅；而在自动化驾驶程度较高的情况下，产品责任为主，道路交通事故责任为辅。


    另有学者在机动车交通事故责任和产品责任的二元框架基础上增加高度危险责任类型。“机动车交通事故责任、产品责任和高度危险责任在某种程度上均可适用于无人驾驶侵权的责任类型，三者在应对人工智能时代的无人驾驶汽车侵权事件中各有所长，阶段性的类型化探讨更能为复杂的责任类型提供归责进路。”^([\[63\]](#txt006.html#footnote_content_txt006_63))还有学者认为：“拥有大数据分析、深度学习和自动化决策算法的无人驾驶汽车逐渐成为工具理性与价值选择相融合的新生事物，而现行的《侵权责任法》无法确定该类事故的责任承担者。”^([\[64\]](#txt006.html#footnote_content_txt006_64))人工智能技术的应用滋生了对技术理性的盲目崇拜，忽略了其前提假设的有效性。在工具理性与价值理性二元区分的框架下，科技产品被赋予工具属性，价值判断由其背后的社会主体作出。人工智能技术的研发与应用使工具属性与价值判断相融合，智能机器（人）对人类指令的服从性弱化。价值选择究竟取决于技术背后的社会主体还是技术的凝结物本身的问题出现，责任分配的问题复杂化。


    ## （一）道路交通事故责任


    “机动车交通事故，是指机动车与非机动车驾驶人员、行人、乘车人以及其他在公路、城市道路和虽在单位管辖范围但允许社会机动车通行的地方以及广场、公共停车场等用于公众通行的场所上，进行交通活动的人员，因违反《道路交通安全法》和其他道路交通管理法规、规章的行为，过失或者意外造成的人身伤亡或者财产损失的事件。”^([\[65\]](#txt006.html#footnote_content_txt006_65))将智能驾驶汽车作为机动车的一种类型，其造成的损失需要适用道路交通事故责任规则。


    对是否区分机动车保有人责任与驾驶人责任这一问题，各国立法有所差异。《德国道路交通安全法》（2016 年修改）对二者进行区分。“道路交通事故严格责任独立于车辆的自动化程度，即机动车持有人必须承担责任。”^([\[66\]](#txt006.html#footnote_content_txt006_66))我国《道路交通安全法》第76
    条中使用了“机动车一方”这一模糊概念，并未明确区分保有人责任与驾驶人责任。关于“机动车一方”的理解^([\[67\]](#txt006.html#footnote_content_txt006_67))，“我国学界有力说同样倾向于遵循德国法学说，区分机动车保有人和驾驶人，第76条规定的‘机动车一方’系指机动车保有人。判断保有人采二元标准，即运行支配与运行利益。通常，机动车的所有人及租赁、借用汽车的使用人等均为保有人。”^([\[68\]](#txt006.html#footnote_content_txt006_68))有必要在区分保有人与驾驶人的框架下分析智能驾驶汽车使用人和保有人的责任。


    ### 1.以驾驶员过错为中心的使用人责任


    传统驾驶行为的安全性与人类驾驶员的驾驶技术和能力密切相关，《道路交通安全法》及相关法律法规以人类驾驶员的驾驶行为为中心，以人类驾驶员的主观过错为基础构建相应的责任承担体系。在机动车驾驶过程中，人类驾驶员对汽车具有控制权，过错是判断驾驶人是否应当承担民事法律责任以及承担民事法律责任比例的基础，而判断驾驶人是否具有过错的主要依据是驾驶过程中驾驶员是否履行了必要的注意义务。“法定的注意义务是认定过错的基本标准，在满足当事人主观可归责性的基础上尚须在客观上违反了注意义务。”^([\[69\]](#txt006.html#footnote_content_txt006_69))根据我国《道路交通安全法》的规定，机动车驾驶人限定为人类驾驶员，驾驶权限定在人类驾驶员手中。人类驾驶员的双手不能离开方向盘。人类驾驶员在驾驶过程中未尽到注意义务造成人身或财产损害，需要承担相应的侵权责任。智能驾驶中，由人类驾驶员承担过错责任是传统道路交通事故责任在智能驾驶领域的自然延伸。


    智能驾驶汽车有别于传统的机动车，智能驾驶使驾驶行为摆脱了对人类驾驶员的技术依赖。智能驾驶中人类驾驶员的身份部分或全部地发生从驾驶者向乘客的转变，注意义务的内容和需要履行注意义务的时间点是否应当发生变化以及如何发生变化不无疑问。倘若智能驾驶汽车使用者的身份部分转变为乘客，使用者并未完全丧失驾驶员的身份，其仍然负有必要的注意义务；倘若智能驾驶汽车使用者的身份全部转变为乘客，其不再具有驾驶员的身份，则无所谓人类驾驶员或所谓的人类驾驶员有名无实，不再存在人类驾驶员需要承担相应注意义务的问题。无人驾驶汽车对驾驶人员的消减与代替使得以驾驶人员主观过错为基础的责任体系不具有可适用性。^([\[70\]](#txt006.html#footnote_content_txt006_70))


    关于智能驾驶中人类驾驶员的具体注意义务，有学者认为：“世界各国一直未开放自动驾驶汽车的完全控制权。自动驾驶汽车需要有执照的驾驶员坐在方向盘后面，以便在系统失灵的情况下控制车辆；人类驾驶员仍然负有接管义务和注意义务。”^([\[71\]](#txt006.html#footnote_content_txt006_71))《德国道路交通法》（2016
    年修订）第1b 条第2 款规定，智能驾驶过程中人类驾驶员负有警觉义务和接管义务。


    #### （1）警惕义务


    警惕义务（prudent duty），又称警觉义务，是指驾驶员在机动车行驶期间需要保持警醒的状态，以保障安全行驶。根据驾驶形态不同，警惕义务指向的对象及内容有所差异。智能驾驶出现以前，人类驾驶员需要在驾驶全程保持警惕。人类驾驶员的手需要时刻紧握方向盘并关注机动车的运行状况以及路况，作出合理的判断和决策。智能驾驶出现后，人类驾驶员警惕义务的内容发生了变化。智能驾驶汽车处于人类驾驶员与智能驾驶系统共同控制（shared
    control）或授权控制（authorized control）的状态下。^([\[72\]](#txt006.html#footnote_content_txt006_72))智能驾驶期间人类驾驶员可以从事与驾驶行为无关的活动，如阅读、上网、思考、玩游戏等，不必时刻对车辆运行状况和路况保持警惕。人类驾驶员需要对智能驾驶系统的预警信息保持警惕，即注意义务的对象从关注机动车行驶的状况逐渐转向关注智能汽车的运行状况。


    #### （2）接管义务


    接管义务（handover duty），又被称为“无迟延控制汽车的义务”，是指智能驾驶系统发出接管控制权的请求或者人类驾驶员意识到需要接管控制权时，人类驾驶员需要及时掌握汽车的驾驶权，作出合理的判断和决策。人类驾驶员是否负有接管义务？在何种情形负有接管义务？


    2016 年5 月7 日，在美国佛罗里达州列维县（Levy County）的高速公路上，乔舒亚·布朗（Joshua Brown）采用自动驾驶模式驾驶一辆特斯拉Model
    S 轿车全速行驶时，智能驾驶系统误将白色的卡车车身当作天空，未能识别出转弯的卡车，导致两车相撞、车毁人亡。车载系统数据表明，事故发生时该车处于自动驾驶状态，紧急制动装置未作出警示或自动刹车，驾驶员未采取避免碰撞的行为。同年6
    月美国国家公路安全管理局针对该车智能驾驶系统在碰撞时的设计和性能启动调查程序。智能驾驶系统是否处于启动状态成为争议的关键。“其中所体现的侵权法原则是：在事故责任不在于别的车辆的情况下，如果汽车处在自动驾驶状态，责任应当由汽车制造商承担；如果汽车处在人为操作状态，责任则在于司机。”^([\[73\]](#txt006.html#footnote_content_txt006_73))郑戈教授认为这一包含在“默会知识”中的法律原则在马车、骡车时代已经存在。


    在智能驾驶过程中，不参与驾驶活动的人类驾驶员处于等候状态，不负有对道路交通状况和智能汽车运行状况进行监控的义务；但是，需要时刻警醒以备接管，当智能系统发出接管讯息或请求以及智能系统无法正常工作时，人类驾驶员需要及时、合理地对智能汽车进行接管。2017
    年6 月，德国颁布《道路交通安全法第八修正案》要求“在任何情况下驾驶员都可以手动取代或关闭自动驾驶系统并接管车辆；自动驾驶系统应可以识别出需要驾驶员亲自操控的情形，并在移交接管前向驾驶员作出足够的提示等”^([\[74\]](#txt006.html#footnote_content_txt006_74))。


    接管义务具有以下法律特征：①接管义务产生的条件。人类驾驶员必须始终在方向盘后处于等待状态，在智能驾驶系统发出请求后或智能系统无法正常工作时对智能汽车进行控制。换言之，接管义务产生的条件有两个，一是智能驾驶系统无法正常工作；二是智能驾驶系统发出请求。②接管义务产生的时点。接管涉及驾驶权在智能驾驶系统和人类驾驶员之间进行转移，人类驾驶员负有接管义务的时间点问题随之产生。《德国道路交通法》（2016
    年修订）第1a 条第2 款中规定的“充足的预留时间”和第1b 条中规定的“立即”等概念具有模糊性，需要进一步明确。需要根据理性人标准确定人类驾驶员接管驾驶控制权的合理时间，避免苛责人类驾驶员或为其逃避责任提供借口。③接管义务产生的法律后果。接管义务与责任移转之间存在密切的关系，接管前后驾驶模式的切换导致法律责任的转移。“如果自动驾驶模式正在运行过程中发生了事故，责任在于汽车制造商。但如果自动驾驶系统已经发出了请求人工控制的信号，责任便转移到了汽车上的驾驶人员身上。”^([\[75\]](#txt006.html#footnote_content_txt006_75))


    英国《自动与电动汽车法案》区分自我驾驶（driving itself）与高级辅助驾驶系统（advanced driver assistance system），在此基础上对接管义务采取不同态度。采用高级辅助驾驶系统的智能驾驶中人类驾驶员负有接管义务，需要随时准备接管；采用自主驾驶方式的智能驾驶中驾驶权在部分路段甚至全程转移至智能驾驶系统，人类驾驶员不负有监管或干预驾驶行为的义务。二者之间存在一定的模糊地带。“虽然L3
    级别的自动驾驶汽车能够执行整个动态驾驶任务（Dynamic Driving Task，DDT）——包括监测驾驶环境，但是在车辆需要的情况下，则要求驾驶员进行干预。因此，在车辆需要的情况下要求驾驶员干预是否构成‘控制’或‘监控’，这一点是值得商榷的。”^([\[76\]](#txt006.html#footnote_content_txt006_76))


    接管义务与智能驾驶技术分级密切相关。L0 和L1 级驾驶中，智能驾驶系统仅起到辅助或优化人类驾驶员某项核心控制的功能，如转向、刹车等，并未替代人类驾驶员取得核心控制权，无所谓人类驾驶员进行接管。L2
    级智能驾驶中，人类驾驶员与智能驾驶系统处于联合控制车辆的状态。人类驾驶员有条件地放弃部分车辆控制权，对车辆需处于监控状态。智能驾驶系统在无事先预警的情况下放弃车辆的控制权时，人类驾驶员负有随时接管义务。


    L3 级智能驾驶中，人类驾驶员不必将目光紧盯在监控系统上。在特定环境下，智能驾驶系统控制车辆所有核心功能。只有在智能驾驶系统发出预警时人类驾驶员才负有接管义务。“世界范围内已经通过的关于自动驾驶的法律、国际公约、政策指南等，大多是针对L3
    级别自动驾驶的立法方案，并且分享着一条共同的原则：人类驾驶员需要在紧急情况下随时准备接管汽车。”^([\[77\]](#txt006.html#footnote_content_txt006_77))


    《上海市智能网联汽车道路测试管理办法（试行）》区分有条件自动驾驶和高度自动驾驶来确定人类驾驶员的接管义务。有条件自动驾驶中智能驾驶系统向人类驾驶员发出响应请求后，人类驾驶员需要响应；而高度自动驾驶中即便智能驾驶系统向人类驾驶员发出响应请求，人类驾驶员也无需响应。“高度自动驾驶阶段的驾驶员可忽视系统提出的接管请求，意味着不再具有接管义务，那么实则与无接管请求功能的完全自动驾驶阶段交通事故侵权责任的承担原理并无区别。”^([\[78\]](#txt006.html#footnote_content_txt006_78))


    #### （3）人类驾驶员法定义务和责任设计评析


    人类驾驶员在驾驶行为中扮演的角色是区分产品责任与非产品责任并进而在人类驾驶员、车辆保有人与制造商、设计者等主体之间分配责任的关键。人类驾驶员参与驾驶活动的，相关主体依其过错承担法律责任；非因人类驾驶员驾驶行为导致的损失，通常依产品责任由制造商等相关主体承担责任。


    这一责任分配方式给驾驶人员带来了不确定性。福尔克尔·吕德曼（Volker Lüdermann）教授认为，《德国道路交通法》并未完全处理好自动驾驶系统与人类驾驶员之间的关系。驾驶过程中，人类驾驶员需要时刻保持警醒的待命状态（stand
    by），在智能驾驶系统发出接管信号后“立即”接管，未能为人类驾驶员提供充分保障。^([\[79\]](#txt006.html#footnote_content_txt006_79))试想，如果一个人花比传统汽车贵得多的价钱购买了自动驾驶汽车，却必须时刻保持警觉，而且要在自动驾驶系统控制汽车操作一段时间后瞬间介入，应付紧急情况，这实际上对驾驶员提出了更高的要求。^([\[80\]](#txt006.html#footnote_content_txt006_80))此外，“佩尔茨曼效应”（Peltzman
    Effect）“认为车辆安全检查计划为驾驶员提供了一种虚假的安全感，导致其在驾驶时不太审慎”^([\[81\]](#txt006.html#footnote_content_txt006_81))。换言之，与驾驶无关的行为会分散人类驾驶员的注意力。使用自动驾驶汽车的主要目的是节约驾驶时间，以便用来看书、睡觉、发短信、玩“光晕”（hole）游戏，或者做其他事情，一旦自动驾驶汽车普及开来，让人们因疏于监控自动驾驶汽车而承担责任似乎就有些荒谬了，因为人们根本就不会监督它们。^([\[82\]](#txt006.html#footnote_content_txt006_82))智能驾驶技术发展的目的是让智能驾驶系统部分或全部替代人类驾驶员，将人类驾驶员从繁重、烦闷的驾驶活动中解放出来。倘若需要人类驾驶员一直关注人机切换模式，随时处于待命的高度紧张状态，则与智能驾驶技术的应用目的有所背离。“这种注意义务在生理上难以实现，事实上让操作人无法主张自己没有过错。”^([\[83\]](#txt006.html#footnote_content_txt006_83))


    ### 2.智能驾驶汽车保有人责任


    #### （1）智能驾驶汽车保有人的无过错责任


    “自动驾驶汽车就好比是所有人雇佣的司机。当自动驾驶汽车按照所有人的指示运行时，如果其违反道路交通规则，进而发生交通事故，那么，理当由所有人承担责任，就好比雇员的行为引起损害由雇主承担责任一样。”^([\[84\]](#txt006.html#footnote_content_txt006_84))与驾驶员基于过错归责不同，机动车保有人需要承担无过错责任。人工智能时代，人类驾驶员对智能驾驶系统故障造成的损害不需要承担赔偿责任。^([\[85\]](#txt006.html#footnote_content_txt006_85))但是，智能驾驶汽车保有人需要承担无过错的损害赔偿责任。这一结论的正当理由包括：


    第一，“保有人责任的基础在于抽象风险，是每辆机动车无论如何均会给其他交通参与人带来的风险，与个案情况无关”^([\[86\]](#txt006.html#footnote_content_txt006_86))。换言之，智能驾驶汽车保有人承担责任的基础是技术风险带来的抽象风险，驾驶权即便由智能驾驶系统掌控，智能驾驶的运营费用的负担主体和利益享有主体仍然为智能汽车保有人而非制造者或生产者。


    第二，身份转变为乘客的驾驶员遭受的损失能够得到更充分的救济。将机动车道路交通事故责任的主体从驾驶员扩及机动车保有人，可以适应自动驾驶汽车逐渐由自动系统承担驾驶任务这一变化。^([\[87\]](#txt006.html#footnote_content_txt006_87))人类驾驶员在智能驾驶系统掌控驾驶权的阶段，身份由驾驶员转变为乘客，遭受损害时可以依乘客的身份请求救济。


    第三，交通事故受害人获得救济的便利性。“以机动车风险为基础的责任，使得受害人在求偿时，不必困扰于人机混合驾驶时驾驶员是否有过失，或者在人机混合行驶时完全自动驾驶汽车与全手动驾驶汽车或有条件的自动驾驶汽车之间的过错和事故原因判定等难题。”^([\[88\]](#txt006.html#footnote_content_txt006_88))


    机动车保有人承担无过错责任并非没有边界。“机动车保有人承担的无过错责任是有数额限制的。超过这一限额，则必须回归到传统的过错责任上，也即驾驶人责任。”^([\[89\]](#txt006.html#footnote_content_txt006_89))《德国道路交通法》（2016
    年修订）第12 条第1 款提高了车主承担无过错赔偿责任的额度，强化了对受害人的保护。


    #### （2）机动车保有人的安全检查义务


    智能汽车保有人负有定期对智能汽车进行安全检查的义务，需要定期对智能汽车进行保养、维护或修理以及系统升级。对智能汽车进行安全检查的范围包括硬件设施和软件设施。倘若车主未履行安全检查义务，车主对事故责任需要承担民事法律责任；反之，则民事法律责任由车主转移至制造商。^([\[90\]](#txt006.html#footnote_content_txt006_90))


    ## （二）产品责任

    '
  trans: '


    传统的汽车交通事故一般可以归因于驾驶人、产品缺陷以及自然条件，可以分为人的责任和物的责任两种类型。非因机动车缺陷导致交通事故的责任属于人的责任，由机动车所有人或驾驶人承担。^([\[62\]](#txt006.html#footnote_content_txt006_62))因机动车缺陷导致交通事故的责任属于物的责任。同理，智能驾驶造成人身或财产损害的责任也可以分为人的责任和物的责任两种类型，人的责任主要是道路交通事故责任，物的责任主要是产品责任。随着驾驶的自动化程度升级，智能驾驶发生交通事故的责任属性逐渐由道路交通事故责任转变为产品责任，即在自动化驾驶程度较低的情况下，道路交通事故责任为主，产品责任为辅；而在自动化驾驶程度较高的情况下，产品责任为主，道路交通事故责任为辅。


    另有学者在机动车交通事故责任和产品责任的二元框架基础上增加高度危险责任类型。“机动车交通事故责任、产品责任和高度危险责任在某种程度上均可适用于无人驾驶侵权的责任类型，三者在应对人工智能时代的无人驾驶汽车侵权事件中各有所长，阶段性的类型化探讨更能为复杂的责任类型提供归责进路。”^([\[63\]](#txt006.html#footnote_content_txt006_63))还有学者认为：“拥有大数据分析、深度学习和自动化决策算法的无人驾驶汽车逐渐成为工具理性与价值选择相融合的新生事物，而现行的《侵权责任法》无法确定该类事故的责任承担者。”^([\[64\]](#txt006.html#footnote_content_txt006_64))人工智能技术的应用滋生了对技术理性的盲目崇拜，忽略了其前提假设的有效性。在工具理性与价值理性二元区分的框架下，科技产品被赋予工具属性，价值判断由其背后的社会主体作出。人工智能技术的研发与应用使工具属性与价值判断相融合，智能机器（人）对人类指令的服从性弱化。价值选择究竟取决于技术背后的社会主体还是技术的凝结物本身的问题出现，责任分配的问题复杂化。


    ## （一）道路交通事故责任


    “机动车交通事故，是指机动车与非机动车驾驶人员、行人、乘车人以及其他在公路、城市道路和虽在单位管辖范围但允许社会机动车通行的地方以及广场、公共停车场等用于公众通行的场所上，进行交通活动的人员，因违反《道路交通安全法》和其他道路交通管理法规、规章的行为，过失或者意外造成的人身伤亡或者财产损失的事件。”^([\[65\]](#txt006.html#footnote_content_txt006_65))将智能驾驶汽车作为机动车的一种类型，其造成的损失需要适用道路交通事故责任规则。


    对是否区分机动车保有人责任与驾驶人责任这一问题，各国立法有所差异。《德国道路交通安全法》（2016 年修改）对二者进行区分。“道路交通事故严格责任独立于车辆的自动化程度，即机动车持有人必须承担责任。”^([\[66\]](#txt006.html#footnote_content_txt006_66))我国《道路交通安全法》第
    76 条中使用了“机动车一方”这一模糊概念，并未明确区分保有人责任与驾驶人责任。关于“机动车一方”的理解^([\[67\]](#txt006.html#footnote_content_txt006_67))，“我国学界有力说同样倾向于遵循德国法学说，区分机动车保有人和驾驶人，第
    76 条规定的‘机动车一方’系指机动车保有人。判断保有人采二元标准，即运行支配与运行利益。通常，机动车的所有人及租赁、借用汽车的使用人等均为保有人。”^([\[68\]](#txt006.html#footnote_content_txt006_68))有必要在区分保有人与驾驶人的框架下分析智能驾驶汽车使用人和保有人的责任。


    ### 1.以驾驶员过错为中心的使用人责任


    传统驾驶行为的安全性与人类驾驶员的驾驶技术和能力密切相关，《道路交通安全法》及相关法律法规以人类驾驶员的驾驶行为为中心，以人类驾驶员的主观过错为基础构建相应的责任承担体系。在机动车驾驶过程中，人类驾驶员对汽车具有控制权，过错是判断驾驶人是否应当承担民事法律责任以及承担民事法律责任比例的基础，而判断驾驶人是否具有过错的主要依据是驾驶过程中驾驶员是否履行了必要的注意义务。“法定的注意义务是认定过错的基本标准，在满足当事人主观可归责性的基础上尚须在客观上违反了注意义务。”^([\[69\]](#txt006.html#footnote_content_txt006_69))根据我国《道路交通安全法》的规定，机动车驾驶人限定为人类驾驶员，驾驶权限定在人类驾驶员手中。人类驾驶员的双手不能离开方向盘。人类驾驶员在驾驶过程中未尽到注意义务造成人身或财产损害，需要承担相应的侵权责任。智能驾驶中，由人类驾驶员承担过错责任是传统道路交通事故责任在智能驾驶领域的自然延伸。


    智能驾驶汽车有别于传统的机动车，智能驾驶使驾驶行为摆脱了对人类驾驶员的技术依赖。智能驾驶中人类驾驶员的身份部分或全部地发生从驾驶者向乘客的转变，注意义务的内容和需要履行注意义务的时间点是否应当发生变化以及如何发生变化不无疑问。倘若智能驾驶汽车使用者的身份部分转变为乘客，使用者并未完全丧失驾驶员的身份，其仍然负有必要的注意义务；倘若智能驾驶汽车使用者的身份全部转变为乘客，其不再具有驾驶员的身份，则无所谓人类驾驶员或所谓的人类驾驶员有名无实，不再存在人类驾驶员需要承担相应注意义务的问题。无人驾驶汽车对驾驶人员的消减与代替使得以驾驶人员主观过错为基础的责任体系不具有可适用性。^([\[70\]](#txt006.html#footnote_content_txt006_70))


    关于智能驾驶中人类驾驶员的具体注意义务，有学者认为：“世界各国一直未开放自动驾驶汽车的完全控制权。自动驾驶汽车需要有执照的驾驶员坐在方向盘后面，以便在系统失灵的情况下控制车辆；人类驾驶员仍然负有接管义务和注意义务。”^([\[71\]](#txt006.html#footnote_content_txt006_71))《德国道路交通法》（2016
    年修订）第 1b 条第 2 款规定，智能驾驶过程中人类驾驶员负有警觉义务和接管义务。


    #### （1）警惕义务


    警惕义务（prudent duty），又称警觉义务，是指驾驶员在机动车行驶期间需要保持警醒的状态，以保障安全行驶。根据驾驶形态不同，警惕义务指向的对象及内容有所差异。智能驾驶出现以前，人类驾驶员需要在驾驶全程保持警惕。人类驾驶员的手需要时刻紧握方向盘并关注机动车的运行状况以及路况，作出合理的判断和决策。智能驾驶出现后，人类驾驶员警惕义务的内容发生了变化。智能驾驶汽车处于人类驾驶员与智能驾驶系统共同控制（shared
    control）或授权控制（authorized control）的状态下。^([\[72\]](#txt006.html#footnote_content_txt006_72))智能驾驶期间人类驾驶员可以从事与驾驶行为无关的活动，如阅读、上网、思考、玩游戏等，不必时刻对车辆运行状况和路况保持警惕。人类驾驶员需要对智能驾驶系统的预警信息保持警惕，即注意义务的对象从关注机动车行驶的状况逐渐转向关注智能汽车的运行状况。


    #### （2）接管义务


    接管义务（handover duty），又被称为“无迟延控制汽车的义务”，是指智能驾驶系统发出接管控制权的请求或者人类驾驶员意识到需要接管控制权时，人类驾驶员需要及时掌握汽车的驾驶权，作出合理的判断和决策。人类驾驶员是否负有接管义务？在何种情形负有接管义务？


    2016 年 5 月 7 日，在美国佛罗里达州列维县（Levy County）的高速公路上，乔舒亚·布朗（Joshua Brown）采用自动驾驶模式驾驶一辆特斯拉
    Model S 轿车全速行驶时，智能驾驶系统误将白色的卡车车身当作天空，未能识别出转弯的卡车，导致两车相撞、车毁人亡。车载系统数据表明，事故发生时该车处于自动驾驶状态，紧急制动装置未作出警示或自动刹车，驾驶员未采取避免碰撞的行为。同年
    6 月美国国家公路安全管理局针对该车智能驾驶系统在碰撞时的设计和性能启动调查程序。智能驾驶系统是否处于启动状态成为争议的关键。“其中所体现的侵权法原则是：在事故责任不在于别的车辆的情况下，如果汽车处在自动驾驶状态，责任应当由汽车制造商承担；如果汽车处在人为操作状态，责任则在于司机。”^([\[73\]](#txt006.html#footnote_content_txt006_73))郑戈教授认为这一包含在“默会知识”中的法律原则在马车、骡车时代已经存在。


    在智能驾驶过程中，不参与驾驶活动的人类驾驶员处于等候状态，不负有对道路交通状况和智能汽车运行状况进行监控的义务；但是，需要时刻警醒以备接管，当智能系统发出接管讯息或请求以及智能系统无法正常工作时，人类驾驶员需要及时、合理地对智能汽车进行接管。2017
    年 6 月，德国颁布《道路交通安全法第八修正案》要求“在任何情况下驾驶员都可以手动取代或关闭自动驾驶系统并接管车辆；自动驾驶系统应可以识别出需要驾驶员亲自操控的情形，并在移交接管前向驾驶员作出足够的提示等”^([\[74\]](#txt006.html#footnote_content_txt006_74))。


    接管义务具有以下法律特征：①接管义务产生的条件。人类驾驶员必须始终在方向盘后处于等待状态，在智能驾驶系统发出请求后或智能系统无法正常工作时对智能汽车进行控制。换言之，接管义务产生的条件有两个，一是智能驾驶系统无法正常工作；二是智能驾驶系统发出请求。②接管义务产生的时点。接管涉及驾驶权在智能驾驶系统和人类驾驶员之间进行转移，人类驾驶员负有接管义务的时间点问题随之产生。《德国道路交通法》（2016
    年修订）第 1a 条第 2 款中规定的“充足的预留时间”和第 1b 条中规定的“立即”等概念具有模糊性，需要进一步明确。需要根据理性人标准确定人类驾驶员接管驾驶控制权的合理时间，避免苛责人类驾驶员或为其逃避责任提供借口。③接管义务产生的法律后果。接管义务与责任移转之间存在密切的关系，接管前后驾驶模式的切换导致法律责任的转移。“如果自动驾驶模式正在运行过程中发生了事故，责任在于汽车制造商。但如果自动驾驶系统已经发出了请求人工控制的信号，责任便转移到了汽车上的驾驶人员身上。”^([\[75\]](#txt006.html#footnote_content_txt006_75))


    英国《自动与电动汽车法案》区分自我驾驶（driving itself）与高级辅助驾驶系统（advanced driver assistance system），在此基础上对接管义务采取不同态度。采用高级辅助驾驶系统的智能驾驶中人类驾驶员负有接管义务，需要随时准备接管；采用自主驾驶方式的智能驾驶中驾驶权在部分路段甚至全程转移至智能驾驶系统，人类驾驶员不负有监管或干预驾驶行为的义务。二者之间存在一定的模糊地带。“虽然
    L3 级别的自动驾驶汽车能够执行整个动态驾驶任务（Dynamic Driving Task，DDT）——包括监测驾驶环境，但是在车辆需要的情况下，则要求驾驶员进行干预。因此，在车辆需要的情况下要求驾驶员干预是否构成‘控制’或‘监控’，这一点是值得商榷的。”^([\[76\]](#txt006.html#footnote_content_txt006_76))


    接管义务与智能驾驶技术分级密切相关。L0 和 L1 级驾驶中，智能驾驶系统仅起到辅助或优化人类驾驶员某项核心控制的功能，如转向、刹车等，并未替代人类驾驶员取得核心控制权，无所谓人类驾驶员进行接管。L2
    级智能驾驶中，人类驾驶员与智能驾驶系统处于联合控制车辆的状态。人类驾驶员有条件地放弃部分车辆控制权，对车辆需处于监控状态。智能驾驶系统在无事先预警的情况下放弃车辆的控制权时，人类驾驶员负有随时接管义务。


    L3 级智能驾驶中，人类驾驶员不必将目光紧盯在监控系统上。在特定环境下，智能驾驶系统控制车辆所有核心功能。只有在智能驾驶系统发出预警时人类驾驶员才负有接管义务。“世界范围内已经通过的关于自动驾驶的法律、国际公约、政策指南等，大多是针对
    L3 级别自动驾驶的立法方案，并且分享着一条共同的原则：人类驾驶员需要在紧急情况下随时准备接管汽车。”^([\[77\]](#txt006.html#footnote_content_txt006_77))


    《上海市智能网联汽车道路测试管理办法（试行）》区分有条件自动驾驶和高度自动驾驶来确定人类驾驶员的接管义务。有条件自动驾驶中智能驾驶系统向人类驾驶员发出响应请求后，人类驾驶员需要响应；而高度自动驾驶中即便智能驾驶系统向人类驾驶员发出响应请求，人类驾驶员也无需响应。“高度自动驾驶阶段的驾驶员可忽视系统提出的接管请求，意味着不再具有接管义务，那么实则与无接管请求功能的完全自动驾驶阶段交通事故侵权责任的承担原理并无区别。”^([\[78\]](#txt006.html#footnote_content_txt006_78))


    #### （3）人类驾驶员法定义务和责任设计评析


    人类驾驶员在驾驶行为中扮演的角色是区分产品责任与非产品责任并进而在人类驾驶员、车辆保有人与制造商、设计者等主体之间分配责任的关键。人类驾驶员参与驾驶活动的，相关主体依其过错承担法律责任；非因人类驾驶员驾驶行为导致的损失，通常依产品责任由制造商等相关主体承担责任。


    这一责任分配方式给驾驶人员带来了不确定性。福尔克尔·吕德曼（Volker Lüdermann）教授认为，《德国道路交通法》并未完全处理好自动驾驶系统与人类驾驶员之间的关系。驾驶过程中，人类驾驶员需要时刻保持警醒的待命状态（stand
    by），在智能驾驶系统发出接管信号后“立即”接管，未能为人类驾驶员提供充分保障。^([\[79\]](#txt006.html#footnote_content_txt006_79))试想，如果一个人花比传统汽车贵得多的价钱购买了自动驾驶汽车，却必须时刻保持警觉，而且要在自动驾驶系统控制汽车操作一段时间后瞬间介入，应付紧急情况，这实际上对驾驶员提出了更高的要求。^([\[80\]](#txt006.html#footnote_content_txt006_80))此外，“佩尔茨曼效应”（Peltzman
    Effect）“认为车辆安全检查计划为驾驶员提供了一种虚假的安全感，导致其在驾驶时不太审慎”^([\[81\]](#txt006.html#footnote_content_txt006_81))。换言之，与驾驶无关的行为会分散人类驾驶员的注意力。使用自动驾驶汽车的主要目的是节约驾驶时间，以便用来看书、睡觉、发短信、玩“光晕”（hole）游戏，或者做其他事情，一旦自动驾驶汽车普及开来，让人们因疏于监控自动驾驶汽车而承担责任似乎就有些荒谬了，因为人们根本就不会监督它们。^([\[82\]](#txt006.html#footnote_content_txt006_82))智能驾驶技术发展的目的是让智能驾驶系统部分或全部替代人类驾驶员，将人类驾驶员从繁重、烦闷的驾驶活动中解放出来。倘若需要人类驾驶员一直关注人机切换模式，随时处于待命的高度紧张状态，则与智能驾驶技术的应用目的有所背离。“这种注意义务在生理上难以实现，事实上让操作人无法主张自己没有过错。”^([\[83\]](#txt006.html#footnote_content_txt006_83))


    ### 2.智能驾驶汽车保有人责任


    #### （1）智能驾驶汽车保有人的无过错责任


    “自动驾驶汽车就好比是所有人雇佣的司机。当自动驾驶汽车按照所有人的指示运行时，如果其违反道路交通规则，进而发生交通事故，那么，理当由所有人承担责任，就好比雇员的行为引起损害由雇主承担责任一样。”^([\[84\]](#txt006.html#footnote_content_txt006_84))与驾驶员基于过错归责不同，机动车保有人需要承担无过错责任。人工智能时代，人类驾驶员对智能驾驶系统故障造成的损害不需要承担赔偿责任。^([\[85\]](#txt006.html#footnote_content_txt006_85))但是，智能驾驶汽车保有人需要承担无过错的损害赔偿责任。这一结论的正当理由包括：


    第一，“保有人责任的基础在于抽象风险，是每辆机动车无论如何均会给其他交通参与人带来的风险，与个案情况无关”^([\[86\]](#txt006.html#footnote_content_txt006_86))。换言之，智能驾驶汽车保有人承担责任的基础是技术风险带来的抽象风险，驾驶权即便由智能驾驶系统掌控，智能驾驶的运营费用的负担主体和利益享有主体仍然为智能汽车保有人而非制造者或生产者。


    第二，身份转变为乘客的驾驶员遭受的损失能够得到更充分的救济。将机动车道路交通事故责任的主体从驾驶员扩及机动车保有人，可以适应自动驾驶汽车逐渐由自动系统承担驾驶任务这一变化。^([\[87\]](#txt006.html#footnote_content_txt006_87))人类驾驶员在智能驾驶系统掌控驾驶权的阶段，身份由驾驶员转变为乘客，遭受损害时可以依乘客的身份请求救济。


    第三，交通事故受害人获得救济的便利性。“以机动车风险为基础的责任，使得受害人在求偿时，不必困扰于人机混合驾驶时驾驶员是否有过失，或者在人机混合行驶时完全自动驾驶汽车与全手动驾驶汽车或有条件的自动驾驶汽车之间的过错和事故原因判定等难题。”^([\[88\]](#txt006.html#footnote_content_txt006_88))


    机动车保有人承担无过错责任并非没有边界。“机动车保有人承担的无过错责任是有数额限制的。超过这一限额，则必须回归到传统的过错责任上，也即驾驶人责任。”^([\[89\]](#txt006.html#footnote_content_txt006_89))《德国道路交通法》（2016
    年修订）第 12 条第 1 款提高了车主承担无过错赔偿责任的额度，强化了对受害人的保护。


    #### （2）机动车保有人的安全检查义务


    智能汽车保有人负有定期对智能汽车进行安全检查的义务，需要定期对智能汽车进行保养、维护或修理以及系统升级。对智能汽车进行安全检查的范围包括硬件设施和软件设施。倘若车主未履行安全检查义务，车主对事故责任需要承担民事法律责任；反之，则民事法律责任由车主转移至制造商。^([\[90\]](#txt006.html#footnote_content_txt006_90))


    ## （二）产品责任


