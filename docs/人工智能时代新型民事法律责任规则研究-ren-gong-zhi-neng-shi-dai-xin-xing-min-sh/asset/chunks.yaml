    [\[31\]](#txt009.html#footnote_quote_txt009_31)人工智能时代民事法律责任规则体系的设计是一个庞大的系统性工程。本书试图在总结本土已有经验的基础上，借鉴国外或地区的立法状况，为人工智能民事法律责任规则设计提供基本的思路和框架。更为详尽的规则体系设计将是笔者后续研究的重点。


    ## 结语

    智能主体多元化开启了人类社会的新纪元。人类作为唯一具有思维、意志、情感、灵性的社会存在的理论预设被打破，主体与客体严格二元区分的框架被解构，人类社会的未来走向呈现高度不确定性的态势。人工智能能否与人类智能媲美？智能机器（人）是人吗？“奇点”是否会来临？人类能否与智能机器（人）和谐共处？未来社会是人类主宰还是智能机器（人）主宰抑或是人机共主？乐观主义者信心满满，而悲观主义者忧心忡忡。对人工智能时代的想象充满了玄幻色彩。在对人工智能时代人类社会图景缺乏科学论证和描述的情况下，对人工智能这一新生事物需要保持相对宽容的态度。毕竟在汹涌澎湃的人工智能技术浪潮下尚未出现社会控制权整体移转的迹象，而人工智能技术应用带来的便利和高效显而易见。“我们的目光所及，只能在不远的前方，但是可以看到，那里有大量需要去做的工作。”^([\[1\]](#att001.html#footnote_content_att001_1))

    人工智能技术应用的洪流势不可挡，政策和法律不应成为人工智能技术创新的桎梏。“科学技术的智慧之光与法律制度的理性之光，将在人工智能时代交相辉映。”^([\[2\]](#att001.html#footnote_content_att001_2))美国、欧盟、韩国、日本等国家或组织在关注人工智能技术研发与应用的同时，制定了人工智能战略并在相关法律领域进行了探索和尝试。我国同样掀起了人工智能研发和应用的热潮。智能驾驶、智能家居、智能诊疗、智能投资顾问等应用场景的出现为人工智能时代法律制度体系的建构与完善提供了条件。其中，关于新型民事法律责任制度的研究成为关注的焦点。

    智能机器（人）行为自主性是当下研究人工智能时代新型民事法律责任规则设计的逻辑基点。人工智能的不确定性指向较为宽泛且分歧较大，而人工智能的意向性颇为抽象、复杂，均难以作为新型民事法律责任规则设计的逻辑基点。人工智能时代的不确定性在当下主要表征为智能机器（人）行为的自主性，人工智能的意向性是智能机器（人）行为自主性的解释方式之一。以智能机器（人）行为自主性为逻辑基点设计新型民事法律责任规则兼顾了智能性质领域的基本范畴，且与法律调整行为的一般原理一致。

    设计人工智能时代新型民事法律责任规则以预设理论场景为前提。人工智能威胁论与福音论孰是孰非？“奇点”是否以及何时来临？人工智能自我意识觉醒是否可能以及后果如何？相关分析尚处于想象层面，缺乏科学论证。上述问题的答案依赖于技术上的可能性。但是，法律想象并非是杞人忧天的无稽之谈。人工智能时代社会风险的结构性、不可逆性和颠覆性使技术研发和应用造成的损害可能是人类社会无法承受之重，这就要求人工智能时代的法学研究必须具有前瞻性。新型民事法律责任规则的设计体现了法律人对人工智能技术本身以及技术伦理的态度。强人工智能关系场景与弱人工智能关系场景的理论预设以未来图景理论预设和自我意识觉醒理论预设为基础。强人工智能关系场景下关于新型民事法律责任规则的思考具有面向未来的特点，而弱人工智能关系场景下关于新型民事法律责任规则的思考具有立足现实的特点。

    智能机器（人）具有法律主体地位是其作为民事法律责任承担主体的前提。智能机器（人）能否取得法律主体地位关系到对“人之本质”的认识。弱人工智能时代智能机器（人）在思维、意识、灵性等方面尚无法与人类比肩，属于客体性存在，不能作为民事法律责任的承担主体。虚构或牵强附会的智能机器（人）恶意伤人事件，经不起科学论证和推敲。强人工智能时代人工智能可能媲美甚至超越人工智能，智能机器（人）与人类之间的秩序建构是不同类存在之间协商、斗争的结果，难以在人类中心主义的法律框架中寻求方案。无所谓智能机器（人）的人格，更谈不上由其作为民事法律责任主体。智能机器（人）的法律人格不过是人类的一厢情愿的结果，难以转化为法律规则。赋予智能机器（人）准人格法律地位并非承认其主体性，而是通过工具化的法律人格实现人类的目的，该制度设计并未突破人类中心主义的框架。工具性法律人格能够起到将智能机器（人）作为民事法律责任联结点的作用，但是这需要相应的制度配合而且存在被滥用的可能，需要进行周密设计。

    基于对智能机器（人）的属性认知和定位不同，可以从侧重物之属性与侧重人之属性对个角度将人工智能时代的民事法律责任形态进行分析。侧重物之属性的民事法律责任形态以解释论为视角，将人工智能时代的民事法律责任通过类推适用、扩张解释等法律解释方法纳入原有的法律责任体系下。高度危险来源占有人责任、产品责任和动物管理人责任为分析人工智能时代民事法律责任形态提供了框架。侧重人之属性的民事法律责任形态以立法论为视角，智能机器（人）自负责任和替代责任在未来如何设计虽缺乏实证基础但确有预先思考的必要。

    算法和数据等技术元素的加入使人工智能时代因果关系的认定和举证变得困难。因果关系呈量化趋势，因果关系判断转变为相关关系分析，即关注因素与结果之间的变量关系。以已有经验为基础的描述性因果关系的解释力弱化，转向创构性因果关系。人工智能时代因果关系规则的完善需要从识别规则、法定或行业标准规则、可预见性规则、合理期待规则、替代原因切断规则等方面进行思考。

    人工智能时代的民事法律责任承担方式可以分为以人类主体为联结点的民事法律责任承担方式和以智能机器（人）为联结点的民事法律责任承担方式，具体包括：缴出赔偿，召回或销毁智能机器（人）、智能机器（人）支付赔偿金、限制智能机器（人）的自由等。前者侧重规制人类主体的行为，财产责任是救济的重心；后者侧重规制智能机器（人）的“行为”，不限于财产责任。后者的必要性在目前遭到质疑，被认为仅具有形式意义上的效果，最终承担的仍是财产责任。

    智能机器（人）的行为自主性使传统侵权责任法律规范体系对人工智能产品的调整作用有限，有必要反思和构建人工智能时代新型侵权责任规则。在人工智能时代，归责原则从过错责任向无过错责任转变，其在受害人救济、风险的预防与分散、节省交易成本、有利于事实查明等方面存在正当性。

    机器智能化弱化了制造者和使用者行为与损失之间的关联，新型的免责理由随之出现。人工智能时代需要对将机器自主学习、“事故不可解释性”、技术中立、发展风险抗辩等作为免责事由的正当性进行分析，明晰免责事由适用的条件和限度。

    智能驾驶经历了从禁止到有限许可的转变，人类驾驶员作为单一驾驶主体的格局被改变，驾驶主体呈现多元化态势。根据智能化程度不同，可以将智能驾驶进行分级，不同智能驾驶等级中驾驶控制权以及人车关系存在差异。在辅助驾驶阶段，人类驾驶员控制驾驶权。在共同驾驶阶段，人类驾驶员与智能驾驶系统共同控制驾驶权。在智能驾驶系统控制阶段，人类最终实现从“驾驶员”到“乘客”的身份转变。从道路交通事故责任的角度看，需要区分机动车保有人责任与驾驶人责任，使用人承担基于驾驶员过错的责任，保有人承担无过错责任并附有安全检查义务。从产品责任的角度看，制造商需要承担基于合理期待原则产生的民事法律责任。制造商的民事法律责任因他人改装或未及时更新智能系统而减轻或免除。智能驾驶系统程序设计者恶意植入危险算法的，需要根据一般侵权责任而非产品责任承担侵权责任。产品责任的主体不应扩张至设计者。智能驾驶汽车测试者与制造者需要就致害行为承担不真正连带责任，在对外承担连带责任后，可以根据协议和过错进行内部追责。在智能机器（人）尚未取得独立民事主体资格的情况下，智能机器（人）承担责任缺乏必要基础。消费者责任自担说既违背公平原则，又不利于人工智能技术的未来发展。从高度危险责任的角度看，机器智能化引发的新型风险不能被涵盖在《民法典》“侵权责任编”第
    8 章关于高度危险责任的具体类型中，但是，在开放类型体系解释下，受害人可以根据高度危险责任一般条款获得救济。

    投资顾问的形式经历了从人工投资顾问到在线投资顾问再到智能投资顾问的转变。就发展趋势而言，未来智能投资顾问业务将包括投资咨询和资产管理。智能投资顾问具有虚拟化、自主性、技术性与秘密性、排除或削弱非理性因素等特征。智能投资顾问业务中运营者的法律义务可以信义义务为中心构建，即以“客户最佳利益原则”为理论基础，构建义务群。


