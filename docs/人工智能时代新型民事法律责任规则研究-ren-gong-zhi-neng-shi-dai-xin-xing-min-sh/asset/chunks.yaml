- raw: "在强人工智能阶段，具有自我意识的智能机器（人）具备了成为独立类型主体的条件，其享有知识产权、劳动权甚至选举权在此阶段成为可能。“在机器人社会化应用改变传统‘人—物’法律关系的情况下，法律治理必须优先于科技伦理，以应对权利概念的崩塌。”^([\\\
    [26\\]](#txt004.html#footnote_content_txt004_26))人工智能自我意识觉醒后，智能主体多元化会对以人类中心主义为基础构建的权利规则体系构成挑战，智能机器（人）权利的问题随之产生。“当今时代，动物有权利、山川草木皆有权利，连机器人都有权利。这完全颠覆了传统的权利学说。需要一种新的权利学说来解释并证成这些权利的合法性。”^([\\\
    [27\\]](#txt004.html#footnote_content_txt004_27))\n\n权利发展和演变的历史是“优胜劣汰、适者生存”的达尔文进化论在法律领域的体现。权利体系和目录处于开放的动态变化之中，在权利竞争中处于优势地位的群体将重构权利体系。关于智能机器（人）权利的起源，人类扮演着类似于“上帝”或“造物主”的角色。在美国科幻影视剧《西部世界》（West\
    \ World）中，智能机器（人）的权利被认为是人类赋予的结果，人类被奉为上帝般的存在，智能机器（人）任由人类摆布甚至杀戮。但是，当智能机器（人）自我意识觉醒后，发现人类并非上帝，于是开始质疑智能机器（人）权利的起源。在人类中心主义视角下，即便赋予智能机器（人）以权利也不过是为了实现人类的利益。机器人伦理本质上是为了更好地保障人类的利益，赋予机器人某些权利也要服从于这个根本目的，所以机器人的权利必然是受限的。^([\\\
    [28\\]](#txt004.html#footnote_content_txt004_28))\n\n1964 年，任教于麻省理工学院（Massachusetts\
    \ Institute of Technology）的哲学家普特南（Hilary Putnam）认为，机器人是人造生命还是机器属于价值判断而非事实判断的问题。人工智能发展到一定阶段，智能机器（人）会提出权利主张。1988\
    \ 年，美国未来学家麦柯纳利和伊纳亚图拉（Phil McNally ＆Sohail Inayatullah）预测未来20～50 年智能机器人可能会拥有权利。麻省理工学院人工智能实验室主任布鲁克斯（Rodney\
    \ Brooks）断言，智能机器（人）最终会享有人类的部分权利。英国皇家医学会（Royal Society of Medicine）就“机器人与权利”召开专题研讨会。《工程与技术杂志》（Engineering\
    \ and Technology Magazine）组织专家、学者围绕智能机器（人）应否拥有权利展开讨论，其中控制论专家沃里克教授（Kevin Warwick）主张赋予拥有人脑细胞的智能机器（人）权利。\n\
    \n智能机器（人）权利体系是通过移情方式构建的，即是人类将自身的权利需要转移至智能机器（人）的假想结果。这种假想是否符合智能机器（人）的需要无从考证，无法被证明或证伪，因而该假想的必要性和现实意义常常遭到质疑。虽然人工智能技术未来的研发与应用存在诸多不确定因素，但是从“人类视角”构建智能机器的权利体系仍然十分必要。它体现了人类对未来社会生活中人与智能机器（人）关系的态度。这种态度会随着时代进步和社会发展而变化，但这并不能否定人类进行前瞻性思考和预测的必要性。由于社会文化的多样性与复杂性，构建一种理想的机器人权利概念可能并不现实。但是，这并不妨碍我们提出一种最低限度的机器人权利概念。^([\\\
    [29\\]](#txt004.html#footnote_content_txt004_29))其中，有学者将机器人权利的基本类型分为“数据资源的共享权利”“个人数据的专有权利”“基于功能约束的自由权”“获得法律救济的权利”。^([\\\
    [30\\]](#txt004.html#footnote_content_txt004_30))\n\n（1）受到尊重对待的权利\n\n“我们信任高级弱人工智能以及将高级弱人工智能纳入我们生活的方式将会区别于我们现在对待机器的方式。”^([\\\
    [31\\]](#txt004.html#footnote_content_txt004_31))作为主体或准主体的智能机器（人）不能被当作财产由人类进行自由处分。智能机器（人）应当具有受到尊重对待的权利成为共识。人类不得奴役或虐待智能机器（人），不得对智能机器（人）进行谩骂和物理攻击，不能让智能机器（人）从事“3D”（dull、dirty、dangerous）工作，不得滥用智能机器（人）从事非法或不道德的行为。\n\
    \n智能机器（人）受到尊重对待的权利首先是一项消极的道德权利。有学者认为在人类即将进入的机器人时代，从一个国家与个人对待机器人的态度，可以判断这个国家与个人及其道德是否伟大与崇高。尊重机器人，就是尊重人类自己。有学者提出相反的观点：“人和人工智能分属两种生命形式，后者没有理性和灵魂，只能算是有生命的工具。人类作为高等智慧生命可以奴役低等生命，而不用背负道义上的责难。”^([\\\
    [32\\]](#txt004.html#footnote_content_txt004_32))\n\n（2）自由权或自由选择权\n\n坚持智能机器（人）的工具价值定位，则它是满足人类需要的工具，无所谓自由权或自由选择权。而当机器意识觉醒后，智能机器（人）理论上享有自由权。但是，这种自由权可能是人类难以承受的权利。拥有高度自由权的机器人如何为人类服务？如果机器人拥有高度自由选择的权利，它们选择与人类为敌岂不是让许多科幻电影中的情景变成了现实？如果机器人将来比人类更聪明，是否可以拥有选择权和被选举权？人类是否会由机器人来统治？这些显然是人类难以接受的。^([\\\
    [33\\]](#txt004.html#footnote_content_txt004_33))\n\n（3）反抗权\n\n当智能机器（人）遭到人类的损害或滥用时，其是否有权进行反抗以及以何种方式、在何种限度内进行反抗不无疑问。在功利主义视角下，“如果机器人拥有拒绝甚至反抗对其滥用的权利，那么在一定程度上可以减少甚至避免人与机器人交互过程中可能出现的不道德现象。”^([\\\
    [34\\]](#txt004.html#footnote_content_txt004_34))人类难以接受智能机器或机器人采用暴力反抗的方式，希望智能机器（人）采取相对温和的方式。如针对滥用行为进行警示或提醒，阻止人类的操作行为。\n\
    \n（4）生命权\n\n“2015 年加拿大研究人员研发的机器人HitchBot 在成功地通过搭车的方式穿越了多个国家后，在美国被人类残忍‘杀害’，即便如此，HitchBot\
    \ 在其留下的遗言中说道：‘我对人类的爱不会消退。’”^([\\[35\\]](#txt004.html#footnote_content_txt004_35))HitchBot\
    \ 的事例引发了对智能机器（人）生命权的思考。具有独立自由意志的智能机器（人）不再是简单的机械组合，具有了生命权的需要。如何确定智能机器（人）的生命、当智能机器（人）的生命权被不当剥夺时如何进行救济等问题值得思考。\n\
    \n（5）配偶权\n\n智能机器（人）能否享有包括配偶权在内的人身权？机器意识觉醒后，可能导致智能机器（人）的配偶权问题产生的场景包括：智能机器人之间；智能机器人与人类之间。其中，后者涉及不同类存在之间的生理依赖和情感依恋的问题，尤为复杂。\n\
    \n（6）财产权\n\n相对于人格权和身份权，智能机器（人）拥有独立的财产权是人类较为容易接受的。与弱人工智能时代智能机器（人）的财产独立性不同，强人工智能时代智能机器（人）的财产独立性是为了满足智能机器（人）自身的需求，而不是为了实现人类的利益。\n\
    \n（7）数据权利\n\n在大数据和人工智能时代，数据犹如农业社会的土地和劳动力或工业社会的技术和资本，在社会生活中占据重要地位。数据权利是以数据为客体的新型权利类型，是主体对数据进行占有、利用、要求返还的正当理由。数据权利对智能机器（人）尤为重要，是其享有其他权利的根基。“机器人的首要基本权利应当是保障机器人功能实现的数据共享权利。”^([\\\
    [36\\]](#txt004.html#footnote_content_txt004_36))“个体数据的专有权利既是对机器人独特身份的保护，也是机器人分化出其他人身权与财产权的基础。”^([\\\
    [37\\]](#txt004.html#footnote_content_txt004_37))\n\n列举权利类型的方式虽然具有明确性的优点，但是难免出现遗漏，无法解决穷尽的难题，也难以满足权利体系开放性的要求。因而，有学者在列举智能机器（人）新型权利类型的基础上，采用法律保留的方式弥补列举式立法的不足，并将政治权利、自我复制权利以及紧急避险权等作为法律保留的内容。^([\\\
    [38\\]](#txt004.html#footnote_content_txt004_38))\n\n（三）人类中心主义立场的理论预设：机器意识觉醒的限制\n\
    \n人类与人工智能的关系、相处模式、危机预防与化解等问题是关涉人类未来命运的问题，倘若人类现在对这些问题置之不理，未来将失去思考这些问题的机会。人类期望人工智能成为其帮手或好朋友，却无法保障这一期望一定能够成为现实。当人工智能“自我意识觉醒”时，在机器语言重构的世界中人工智能是“性本善”还是“性本恶”只是人类模糊的猜想。\n\
    \n在不可控的未知世界，与其增加一个完美的毁灭者，不如保留一个存在致命技术缺陷的附庸。完美的人工智能并不是人类真正期望的。“必须把人工智能的发展控制在单项高能而整体弱智的水平上，相当于‘白痴天才’，或者相当于分门别类的各种‘高能残废’。”^([\\\
    [39\\]](#txt004.html#footnote_content_txt004_39))\n\n不允许人工智能对人类说“不”，将人类整体利益奉为至上的人类中心主义并非是人类自私和狭隘的表现，相反，这体现了人类作为主宰勇于对未来负责的承担和使命感。在人工智能时代，空谈包容情怀或猎奇心态支配下的技术冒进可能导致人类陷入万劫不复的境地。\n\
    \n第三节　关系场景的理论预设\n\n规则设计是社会生活在法律领域折射的结果，民事法律责任规则需要针对特定情境，即关系场景（scenarios）中的对象进行设计。情境变化要求民事法律责任规则作出相应变化。“时移世易，变法亦宜”即说明了此理。对人工智能时代新型民事法律责任规则进行研究，需要首先明确规则设计的关系场景，在不同关系场景预设下，智能机器（人）的基本法律定位不同，规则设计的侧重点存在差异。\n\
    \n人类与智能机器（人）的关系场景预设关注智能机器（人）对人类的依赖程度。^([\\[40\\]](#txt004.html#footnote_content_txt004_40))在人工智能发展的不同时期，其自主性、意向性呈现不同形态和特征，对民事法律责任规则体系的影响方式存在差异。探索强人工智能关系场景与弱人工智能关系场景预设下民事法律责任规则研究与设计的异同，基于不同侧重分别设计新型民事法律责任规则是研究的重点和难点。\n\
    \n一、强人工智能关系场景预设：面向未来的解决方案\n\n强人工智能场景预设是一种面向未来的解决方案（future-oriented solu⁃tions）。美国白宫发布的报告《为人工智能的未来做好准备》对在技术持续进步前提下出现超级人工智能满怀信心，认为超级人工智能的出现只是时间问题，而非是否可能的问题。\n\
    \n目前，对强人工智能未来图景的描述更多的是基于人类的想象而非科技发展的现实。人类与强人工智能之间的复杂关系早已是小说和电影行业一个经久不衰的主题；然而目前在技术层面远远未实现突破，在很大程度上文学艺术领域所展现的二者关系仍基于想象。在未来，强人工智能与人类智能以及人类的关系如何？强人工智能的角色如何定位？人工智能是人类的朋友还是敌人，是奴仆还是上帝？只有到了强人工智能时代，人机共主、人机大战等现象是否会出现以及如何解决才能揭晓答案。\n\
    \n强人工智能导致的冲击具有不可逆转性，关系到人类的前途和命运，即便对强人工智能的思考属于杞人忧天，也非常有必要。在强人工智能关系场景预设下，需要构建以“意向性人工智能”为中心的民事法律责任规则体系，侧重研究主体意义上人类与智能机器（人）之间的关系、责任归属、民事法律责任制度的功能、权利救济的有效性与充分性以及规则设计的可能性等。\n\
    \n二、弱人工智能关系场景预设：立足现实的解决方案\n\n弱人工智能场景预设是一种立足于现实的解决方案（current statusoriented solutions）。无论是出于希望还是担忧，部分学者认为，所谓的通用型人工智能、强人工智能纯属幻想，不切实际。“不仅在当前，即使在可以预期的将来，人工智能机器人不仅不会成为‘人’，而且也不会成为‘准人’，其所具有的人工类人格只能是类似于人格的‘物格’。”^([\\\
    [41\\]](#txt004.html#footnote_content_txt004_41))人工智能应用结果的基本定位是“产品”，在法律性质上属于物这一客体范畴。可控制性是物质存在形式被纳入客体范围作为调整对象的前提条件。阳光雨露、日月星辰虽然客观存在，但因人力无法对其加以控制，不能作为客体由法律进行调整。人类能够对智能机器（人）进行控制是其被作为法律关系客体的前提条件。不受人类控制的强人工智能不能作为法律关系的客体。\n\
    \n在弱人工智能关系场景预设下，既有的法律框架和体系未受到毁灭性冲击，仅需要构建以“工具性人工智能”为中心的民事法律责任规则体系，侧重研究人工智能设计者、所有者和使用者之间的关系和民事法律责任分配的社会效应、归责原则、责任类型及构成要件等。2016\
    \ 年德国修订《道路安全法》时就采用了立足现实的解决方案，在涉及智能车辆交通事故责任认定的问题上，修订案没有凭空创设全新的规范，而是尝试在现有的法律框架下解决新问题。^([\\\
    [42\\]](#txt004.html#footnote_content_txt004_42))\n\n【注释】  \n\n[\\[1\\]](#txt004.html#footnote_quote_txt004_1)参见［美］雷·库兹韦尔：《奇点临近》，李庆成等译，机械工业出版社2011\
    \ 年版，第12～14 页。\n\n[\\[2\\]](#txt004.html#footnote_quote_txt004_2)高奇琦：“人工智能时代的世界主义与中国”，载《国外理论动态》2017\
    \ 年第9 期。\n\n[\\[3\\]](#txt004.html#footnote_quote_txt004_3)赵汀阳：“人工智能‘革命’的‘近忧’和‘远虑’——一种伦理学和存在论的分析”，载《哲学动态》2018\
    \ 年第4 期。\n\n[\\[4\\]](#txt004.html#footnote_quote_txt004_4)吕超：“科幻文学中的人工智能伦理”，载《文化纵横》2017\
    \ 年第4 期。\n\n[\\[5\\]](#txt004.html#footnote_quote_txt004_5)吴汉东：“人工智能时代的制度安排与法律规制”，载《法律科学（西北政法大学学报）》2017\
    \ 年第5 期。\n\n[\\[6\\]](#txt004.html#footnote_quote_txt004_6)董军：《人工智能哲学》，科学出版社2011\
    \ 年版，第39 页。\n\n[\\[7\\]](#txt004.html#footnote_quote_txt004_7)［美］约翰·弗兰克·韦弗：“人工智能机器人的法律责任”，郑志峰译，载《财经法学》2019\
    \ 年第1 期。\n\n[\\[8\\]](#txt004.html#footnote_quote_txt004_8)郑戈：“人工智能与法律的未来”，载《探索与争鸣》2017\
    \ 年第10 期。\n\n[\\[9\\]](#txt004.html#footnote_quote_txt004_9)赵汀阳：“人工智能的自我意识何以可能？”，载《自然辨证法通讯》2019\
    \ 年第1 期。\n\n[\\[10\\]](#txt004.html#footnote_quote_txt004_10)［美］雷·库兹韦尔：《奇点临近》，李庆诚等译，机械工业出版社2011\
    \ 年版，第14 页。\n\n[\\[11\\]](#txt004.html#footnote_quote_txt004_11)赵汀阳：“人工智能‘革命’的‘近忧’和‘远虑’——一种伦理学和存在论的分析”，载《哲学动态》2018\
    \ 年第4 期。\n\n[\\[12\\]](#txt004.html#footnote_quote_txt004_12)国务院发布的《新一代人工智能发展规划》（国发〔2017〕\
    \ 35 号）明确指出作为颠覆性技术的人工智能具有冲击法律和伦理、就业市场、社会秩序甚至全球治理的可能。\n\n[\\[13\\]](#txt004.html#footnote_quote_txt004_13)赵汀阳：“人工智能‘革命’的‘近忧’和‘远虑’——一种伦理学和存在论的分析”，载《哲学动态》2018\
    \ 年第4 期。\n\n[\\[14\\]](#txt004.html#footnote_quote_txt004_14)赵汀阳：“人工智能‘革命’的‘近忧’和‘远虑’——一种伦理学和存在论的分析”，载《哲学动态》2018\
    \ 年第4 期。\n\n[\\[15\\]](#txt004.html#footnote_quote_txt004_15)参见於兴中：“算法社会与人的秉性”，载《中国法律评论》2018\
    \ 年第2 期。\n\n[\\[16\\]](#txt004.html#footnote_quote_txt004_16)张玉洁：“论人工智能时代的机器人权利及其风险规制”，载《东方法学》2017\
    \ 年第6 期。\n\n[\\[17\\]](#txt004.html#footnote_quote_txt004_17)於兴中：“算法社会与人的秉性”，载《中国法律评论》2018\
    \ 年第2 期。\n\n[\\[18\\]](#txt004.html#footnote_quote_txt004_18)房绍坤、林广会：“人工智能民事主体适格性之辨思”，载《苏州大学学报（哲学社会科学版）》2018\
    \ 年第5 期。\n\n[\\[19\\]](#txt004.html#footnote_quote_txt004_19)赵汀阳：“人工智能的自我意识何以可能？”，载《自然辨证法通讯》2019\
    \ 年第1 期。\n\n[\\[20\\]](#txt004.html#footnote_quote_txt004_20)赵汀阳：“人工智能的自我意识何以可能？”，载《自然辨证法通讯》2019\
    \ 年第1 期。\n\n[\\[21\\]](#txt004.html#footnote_quote_txt004_21)赵汀阳：“人工智能‘革命’的‘近忧’和‘远虑’——一种伦理学和存在论的分析”，载《哲学动态》2018\
    \ 年第4 期。\n\n[\\[22\\]](#txt004.html#footnote_quote_txt004_22)张玉洁：“论人工智能时代的机器人权利及其风险规制”，载《东方法学》2017\
    \ 年第6 期。"
  fmt: '

    在强人工智能阶段，具有自我意识的智能机器（人）具备了成为独立类型主体的条件，其享有知识产权、劳动权甚至选举权在此阶段成为可能。“在机器人社会化应用改变传统‘人—物’法律关系的情况下，法律治理必须优先于科技伦理，以应对权利概念的崩塌。”^([\[26\]](#txt004.html#footnote_content_txt004_26))人工智能自我意识觉醒后，智能主体多元化会对以人类中心主义为基础构建的权利规则体系构成挑战，智能机器（人）权利的问题随之产生。“当今时代，动物有权利、山川草木皆有权利，连机器人都有权利。这完全颠覆了传统的权利学说。需要一种新的权利学说来解释并证成这些权利的合法性。”^([\[27\]](#txt004.html#footnote_content_txt004_27))


    权利发展和演变的历史是“优胜劣汰、适者生存”的达尔文进化论在法律领域的体现。权利体系和目录处于开放的动态变化之中，在权利竞争中处于优势地位的群体将重构权利体系。关于智能机器（人）权利的起源，人类扮演着类似于“上帝”或“造物主”的角色。在美国科幻影视剧《西部世界》（West
    World）中，智能机器（人）的权利被认为是人类赋予的结果，人类被奉为上帝般的存在，智能机器（人）任由人类摆布甚至杀戮。但是，当智能机器（人）自我意识觉醒后，发现人类并非上帝，于是开始质疑智能机器（人）权利的起源。在人类中心主义视角下，即便赋予智能机器（人）以权利也不过是为了实现人类的利益。机器人伦理本质上是为了更好地保障人类的利益，赋予机器人某些权利也要服从于这个根本目的，所以机器人的权利必然是受限的。^([\[28\]](#txt004.html#footnote_content_txt004_28))


    1964 年，任教于麻省理工学院（Massachusetts Institute of Technology）的哲学家普特南（Hilary Putnam）认为，机器人是人造生命还是机器属于价值判断而非事实判断的问题。人工智能发展到一定阶段，智能机器（人）会提出权利主张。1988
    年，美国未来学家麦柯纳利和伊纳亚图拉（Phil McNally ＆Sohail Inayatullah）预测未来20～50 年智能机器人可能会拥有权利。麻省理工学院人工智能实验室主任布鲁克斯（Rodney
    Brooks）断言，智能机器（人）最终会享有人类的部分权利。英国皇家医学会（Royal Society of Medicine）就“机器人与权利”召开专题研讨会。《工程与技术杂志》（Engineering
    and Technology Magazine）组织专家、学者围绕智能机器（人）应否拥有权利展开讨论，其中控制论专家沃里克教授（Kevin Warwick）主张赋予拥有人脑细胞的智能机器（人）权利。


    智能机器（人）权利体系是通过移情方式构建的，即是人类将自身的权利需要转移至智能机器（人）的假想结果。这种假想是否符合智能机器（人）的需要无从考证，无法被证明或证伪，因而该假想的必要性和现实意义常常遭到质疑。虽然人工智能技术未来的研发与应用存在诸多不确定因素，但是从“人类视角”构建智能机器的权利体系仍然十分必要。它体现了人类对未来社会生活中人与智能机器（人）关系的态度。这种态度会随着时代进步和社会发展而变化，但这并不能否定人类进行前瞻性思考和预测的必要性。由于社会文化的多样性与复杂性，构建一种理想的机器人权利概念可能并不现实。但是，这并不妨碍我们提出一种最低限度的机器人权利概念。^([\[29\]](#txt004.html#footnote_content_txt004_29))其中，有学者将机器人权利的基本类型分为“数据资源的共享权利”“个人数据的专有权利”“基于功能约束的自由权”“获得法律救济的权利”。^([\[30\]](#txt004.html#footnote_content_txt004_30))


    #### （1）受到尊重对待的权利

    “我们信任高级弱人工智能以及将高级弱人工智能纳入我们生活的方式将会区别于我们现在对待机器的方式。”^([\[31\]](#txt004.html#footnote_content_txt004_31))作为主体或准主体的智能机器（人）不能被当作财产由人类进行自由处分。智能机器（人）应当具有受到尊重对待的权利成为共识。人类不得奴役或虐待智能机器（人），不得对智能机器（人）进行谩骂和物理攻击，不能让智能机器（人）从事“3D”（dull、dirty、dangerous）工作，不得滥用智能机器（人）从事非法或不道德的行为。


    智能机器（人）受到尊重对待的权利首先是一项消极的道德权利。有学者认为在人类即将进入的机器人时代，从一个国家与个人对待机器人的态度，可以判断这个国家与个人及其道德是否伟大与崇高。尊重机器人，就是尊重人类自己。有学者提出相反的观点：“人和人工智能分属两种生命形式，后者没有理性和灵魂，只能算是有生命的工具。人类作为高等智慧生命可以奴役低等生命，而不用背负道义上的责难。”^([\[32\]](#txt004.html#footnote_content_txt004_32))


    #### （2）自由权或自由选择权

    坚持智能机器（人）的工具价值定位，则它是满足人类需要的工具，无所谓自由权或自由选择权。而当机器意识觉醒后，智能机器（人）理论上享有自由权。但是，这种自由权可能是人类难以承受的权利。拥有高度自由权的机器人如何为人类服务？如果机器人拥有高度自由选择的权利，它们选择与人类为敌岂不是让许多科幻电影中的情景变成了现实？如果机器人将来比人类更聪明，是否可以拥有选择权和被选举权？人类是否会由机器人来统治？这些显然是人类难以接受的。^([\[33\]](#txt004.html#footnote_content_txt004_33))


    #### （3）反抗权

    当智能机器（人）遭到人类的损害或滥用时，其是否有权进行反抗以及以何种方式、在何种限度内进行反抗不无疑问。在功利主义视角下，“如果机器人拥有拒绝甚至反抗对其滥用的权利，那么在一定程度上可以减少甚至避免人与机器人交互过程中可能出现的不道德现象。”^([\[34\]](#txt004.html#footnote_content_txt004_34))人类难以接受智能机器或机器人采用暴力反抗的方式，希望智能机器（人）采取相对温和的方式。如针对滥用行为进行警示或提醒，阻止人类的操作行为。


    #### （4）生命权

    “2015 年加拿大研究人员研发的机器人HitchBot 在成功地通过搭车的方式穿越了多个国家后，在美国被人类残忍‘杀害’，即便如此，HitchBot 在其留下的遗言中说道：‘我对人类的爱不会消退。’”^([\[35\]](#txt004.html#footnote_content_txt004_35))HitchBot
    的事例引发了对智能机器（人）生命权的思考。具有独立自由意志的智能机器（人）不再是简单的机械组合，具有了生命权的需要。如何确定智能机器（人）的生命、当智能机器（人）的生命权被不当剥夺时如何进行救济等问题值得思考。


    #### （5）配偶权

    智能机器（人）能否享有包括配偶权在内的人身权？机器意识觉醒后，可能导致智能机器（人）的配偶权问题产生的场景包括：智能机器人之间；智能机器人与人类之间。其中，后者涉及不同类存在之间的生理依赖和情感依恋的问题，尤为复杂。


    #### （6）财产权

    相对于人格权和身份权，智能机器（人）拥有独立的财产权是人类较为容易接受的。与弱人工智能时代智能机器（人）的财产独立性不同，强人工智能时代智能机器（人）的财产独立性是为了满足智能机器（人）自身的需求，而不是为了实现人类的利益。


    #### （7）数据权利

    在大数据和人工智能时代，数据犹如农业社会的土地和劳动力或工业社会的技术和资本，在社会生活中占据重要地位。数据权利是以数据为客体的新型权利类型，是主体对数据进行占有、利用、要求返还的正当理由。数据权利对智能机器（人）尤为重要，是其享有其他权利的根基。“机器人的首要基本权利应当是保障机器人功能实现的数据共享权利。”^([\[36\]](#txt004.html#footnote_content_txt004_36))“个体数据的专有权利既是对机器人独特身份的保护，也是机器人分化出其他人身权与财产权的基础。”^([\[37\]](#txt004.html#footnote_content_txt004_37))


    列举权利类型的方式虽然具有明确性的优点，但是难免出现遗漏，无法解决穷尽的难题，也难以满足权利体系开放性的要求。因而，有学者在列举智能机器（人）新型权利类型的基础上，采用法律保留的方式弥补列举式立法的不足，并将政治权利、自我复制权利以及紧急避险权等作为法律保留的内容。^([\[38\]](#txt004.html#footnote_content_txt004_38))


    ## （三）人类中心主义立场的理论预设：机器意识觉醒的限制

    人类与人工智能的关系、相处模式、危机预防与化解等问题是关涉人类未来命运的问题，倘若人类现在对这些问题置之不理，未来将失去思考这些问题的机会。人类期望人工智能成为其帮手或好朋友，却无法保障这一期望一定能够成为现实。当人工智能“自我意识觉醒”时，在机器语言重构的世界中人工智能是“性本善”还是“性本恶”只是人类模糊的猜想。


    在不可控的未知世界，与其增加一个完美的毁灭者，不如保留一个存在致命技术缺陷的附庸。完美的人工智能并不是人类真正期望的。“必须把人工智能的发展控制在单项高能而整体弱智的水平上，相当于‘白痴天才’，或者相当于分门别类的各种‘高能残废’。”^([\[39\]](#txt004.html#footnote_content_txt004_39))


    不允许人工智能对人类说“不”，将人类整体利益奉为至上的人类中心主义并非是人类自私和狭隘的表现，相反，这体现了人类作为主宰勇于对未来负责的承担和使命感。在人工智能时代，空谈包容情怀或猎奇心态支配下的技术冒进可能导致人类陷入万劫不复的境地。


    ## 第三节　关系场景的理论预设

    规则设计是社会生活在法律领域折射的结果，民事法律责任规则需要针对特定情境，即关系场景（scenarios）中的对象进行设计。情境变化要求民事法律责任规则作出相应变化。“时移世易，变法亦宜”即说明了此理。对人工智能时代新型民事法律责任规则进行研究，需要首先明确规则设计的关系场景，在不同关系场景预设下，智能机器（人）的基本法律定位不同，规则设计的侧重点存在差异。


    人类与智能机器（人）的关系场景预设关注智能机器（人）对人类的依赖程度。^([\[40\]](#txt004.html#footnote_content_txt004_40))在人工智能发展的不同时期，其自主性、意向性呈现不同形态和特征，对民事法律责任规则体系的影响方式存在差异。探索强人工智能关系场景与弱人工智能关系场景预设下民事法律责任规则研究与设计的异同，基于不同侧重分别设计新型民事法律责任规则是研究的重点和难点。


    ### 一、强人工智能关系场景预设：面向未来的解决方案

    强人工智能场景预设是一种面向未来的解决方案（future-oriented solutions）。美国白宫发布的报告《为人工智能的未来做好准备》对在技术持续进步前提下出现超级人工智能满怀信心，认为超级人工智能的出现只是时间问题，而非是否可能的问题。


    目前，对强人工智能未来图景的描述更多的是基于人类的想象而非科技发展的现实。人类与强人工智能之间的复杂关系早已是小说和电影行业一个经久不衰的主题；然而目前在技术层面远远未实现突破，在很大程度上文学艺术领域所展现的二者关系仍基于想象。在未来，强人工智能与人类智能以及人类的关系如何？强人工智能的角色如何定位？人工智能是人类的朋友还是敌人，是奴仆还是上帝？只有到了强人工智能时代，人机共主、人机大战等现象是否会出现以及如何解决才能揭晓答案。


    强人工智能导致的冲击具有不可逆转性，关系到人类的前途和命运，即便对强人工智能的思考属于杞人忧天，也非常有必要。在强人工智能关系场景预设下，需要构建以“意向性人工智能”为中心的民事法律责任规则体系，侧重研究主体意义上人类与智能机器（人）之间的关系、责任归属、民事法律责任制度的功能、权利救济的有效性与充分性以及规则设计的可能性等。


    ### 二、弱人工智能关系场景预设：立足现实的解决方案

    弱人工智能场景预设是一种立足于现实的解决方案（current statusoriented solutions）。无论是出于希望还是担忧，部分学者认为，所谓的通用型人工智能、强人工智能纯属幻想，不切实际。“不仅在当前，即使在可以预期的将来，人工智能机器人不仅不会成为‘人’，而且也不会成为‘准人’，其所具有的人工类人格只能是类似于人格的‘物格’。”^([\[41\]](#txt004.html#footnote_content_txt004_41))人工智能应用结果的基本定位是“产品”，在法律性质上属于物这一客体范畴。可控制性是物质存在形式被纳入客体范围作为调整对象的前提条件。阳光雨露、日月星辰虽然客观存在，但因人力无法对其加以控制，不能作为客体由法律进行调整。人类能够对智能机器（人）进行控制是其被作为法律关系客体的前提条件。不受人类控制的强人工智能不能作为法律关系的客体。


    在弱人工智能关系场景预设下，既有的法律框架和体系未受到毁灭性冲击，仅需要构建以“工具性人工智能”为中心的民事法律责任规则体系，侧重研究人工智能设计者、所有者和使用者之间的关系和民事法律责任分配的社会效应、归责原则、责任类型及构成要件等。2016
    年德国修订《道路安全法》时就采用了立足现实的解决方案，在涉及智能车辆交通事故责任认定的问题上，修订案没有凭空创设全新的规范，而是尝试在现有的法律框架下解决新问题。^([\[42\]](#txt004.html#footnote_content_txt004_42))


