- raw: '法律应对社会生活的变化的方式有经验主义路径和建构主义路径之分。经验主义路径强调法律规则体系的稳定性和延续性，主张维持既有法律规则体系的现状，通过扩张解释的方式拓展法律规则的适用范围；建构主义路径强调法律规则体系的创新型，主张突破既有法律规则体系，通过立法或司法解释的方式重构法律规则体系。新生事物（如人工生殖技术、人工智能技术）出现时，是否需要重建法律理念、法律价值和法律规则体系取决于原有的法律体系能否满足科技发展产生的新需求。倘若通过扩张性解释能够将新生事物纳入法律体系中，则无须重构法律体系，以防止新旧法律理念、价值和规则之间出现冲突，导致失序。只有在新生事物无法通过涵摄或类比等方式被纳入既有法律体系时，才需要重构法律理念、法律价值和法律规则体系。


    三、规则设计的阶段性分析


    人工智能技术的研发和应用具有阶段性特征，不同阶段人工智能的自主性、意向性和不确定性的程度及表现形式存在差异，重构民事法律责任规则体系的必要性以及民事法律责任的主体、类型和分配亦有所不同。“人工智能技术是由弱变强的，有明显的阶段性，法律不应跳过任一阶段。”^([\[10\]](#txt009.html#footnote_content_txt009_10))否认人工智能技术进步在不同阶段对民事法律责任制度造成冲击的差异，不区分人工智能民事法律责任规则设计的阶段性，会造成无争议的争议。目前，关于人工智能时代民事法律责任规则设计的必要性以及责任功能、责任性质、责任归属等问题的讨论大多因为未区分规则设计的阶段性而犹如盲人摸象，若欲将某一阶段的规则设计通过无限放大或以偷梁换柱的方式转移至另一阶段则会出现以偏概全或偷换概念的逻辑错误。


    （一）编程设计阶段


    在编程设计阶段，人工智能的研发者和使用者对人工智能产品具有完全的控制力。人工智能产品按照研发者或使用者设计或设定的程序运行，在决策或行为方面不具有自主性，缺乏进行独立判断的能力。人工智能产品与其他的物在本质上并无区别，只是人类认识或改造世界的工具。“这一阶段的人工智能只有简单的功能意义而没有任何独立机器学习的可能性，所以应将其导致的损害责任视为产品质量责任。”^([\[11\]](#txt009.html#footnote_content_txt009_11))


    （二）机器学习阶段


    “机器学习”和“深度学习”等方式推动了人工智能技术的发展与进步。拥有自主学习能力的人工智能产品虽然仍未摆脱研发者或使用者的控制，但是，其能够在一定范围内进行独立思考和判断。滥用人工智能的法律人格或地位，将其作为研发者或使用者的“替罪羊”的现象出现。“对人类自身种群命运的实质危害并不在莫须有的机器人‘人格’本身，而是在机器人‘人格’掩护下极少数创造算法、通过人工智能驱动社会运转的业内人对大多数人的算法独裁与技术绑架。”^([\[12\]](#txt009.html#footnote_content_txt009_12))


    在这一阶段，人工智能产品的行为是研发者或使用者预先设定的程序和机器学习共同作用的结果，需要考察研发者和使用者对人工智能产品的控制能力，分类设计民事法律责任规则，即区分行为原因是划分责任的前提。智能机器（人）的智能化特征，改变了人与机器之间的关系。主体与客体二元划分下的控制与被控制关系的理论预设的根基发生动摇，机器的“行为”被区分为自主行为和控制行为，需要在区分自主行为与控制行为的基础上确定民事法律责任的方案。《欧盟机器人民事法律规则》特意强调，当机器人的“有害行为”实际归因于人的身份时，经过训练得来的技能不应与自主学习获得的技能相混淆，并建立了责任承担与特定人的干预程度的正比关系规则。^([\[13\]](#txt009.html#footnote_content_txt009_13))


    （三）机器自主意识阶段


    人类对作为人类智能衍生物的人工智能负有管控义务，是其需要对人工智能造成损害承担责任的基础。在机器自主意识阶段，人工智能的行为摆脱了研发者或使用者的控制，是其自由意志的结果。研发者或使用者为人工智能致损承担责任的基础丧失，人工智能作为独立意思表示的主体需要对其行为产生的法律后果承担责任。


    四、规则设计的考量因素


    人工智能侵权责任规则设计关系到社会安全、科技创新、应用、行为自由和权利救济等问题，它直接影响人工智能产品设计者、制造者、使用者以及社会大众的利益。“责任承担的背后隐藏着上述主体的利益博弈，更体现着对技术进步与社会安全、创新者激励与受害人救济、行为自由与权益保护的综合考量。”^([\[14\]](#txt009.html#footnote_content_txt009_14))


    （一）人工智能技术进步与产业发展和繁荣


    为鼓励人工智能技术的研发与应用，需要对技术创新带来的负面效应予以适当容忍。在进行侵权责任规则设计时，将鼓励技术创新作为基本价值理念，就需要在责任分配方面向技术研发和应用的主体适当倾斜，避免因侵权赔偿数额巨大妨碍人工智能技术创新。


    民事责任具有损害转移的功能，即受害人遭受的损失转由加害人承担。这种损害转移能够起到促使成本内部化的作用。人工智能研发和应用的主体为降低承担民事责任的风险，会尽到更多的注意义务，进而保障人工智能技术研发和应用的安全性。


    （二）受害方获得救济的充分性


    技术创新和进步不应成为阻止受害人获得救济的正当理由。“从价值立场来看，充分救济自动驾驶汽车致损事故的受害人应该成为法律机制调整或创新的主要出发点。”^([\[15\]](#txt009.html#footnote_content_txt009_15))无论选择什么样的法律方案来解决机器人的责任问题，在涉及财产损害之外的损害案件中，都不应该限制损害的种类或者程度，也不应该基于损害是由非人类行动者造成的这一理由限制受害人可能获得的赔偿。^([\[16\]](#txt009.html#footnote_content_txt009_16))


    产业发展与受害者救济并不绝对矛盾。“如果不要求自动驾驶汽车的设计者或制造商承担符合公平正义观念的责任，消费者可能会怀疑设计者或制造商为了产业利益而将未臻成熟的自动驾驶汽车推向市场，从而使其购买或使用自动驾驶汽车的信心受到打击，导致消费者对自动驾驶汽车采取敬而远之的态度，这反而会影响产业的发展。”^([\[17\]](#txt009.html#footnote_content_txt009_17))消费者对人工智能产品市场信心的培育在一定程度上依赖于行业和产品形象，如沃尔沃、谷歌等企业基于企业社会责任自愿承担部分责任，通过市场的力量影响责任配置。


    人工智能时代侵权责任制度设计不能过于严苛，否则会使其成为人工智能产业发展的短板。20 世纪90 年代，美国为适应互联网时代的新形势对版权法和侵权法进行了重大制度变革，降低了互联网平台的法律风险，激发了硅谷企业和程序设计者的创造力，为互联网技术创新提供了有利的制度环境。目前，人工智能产品的应用处于探索和发展初期，需要培育人工智能行业的创新精神，不宜过度限制人工智能产品的设计者、制造者等主体的行为自由选择度，影响人工智能行业的整体发展。当然，培育创新精神也需要兼顾对受害人的权利保护和救济，不能让社会大众成为科技进步或创新的牺牲品。


    第三节　《民法典》之后新型民事法律责任规则设计的思考


    在《民法典》起草过程中就人工智能时代的法律责任问题，如智能驾驶的侵权责任进行了探索，但是出于谨慎和周全的考虑，最终并未将研究成果体现在《民法典》中。^([\[18\]](#txt009.html#footnote_content_txt009_18))这一“留白”的立法技术为未来研究和设计人工智能民事法律责任规则预留了空间。《民法典》之后，法律如何应对如火如荼的人工智能技术浪潮、人工智能时代的民事法律责任如何规则化等问题亟需思考和探索。


    一、将“对人终极关怀”作为规则设计的基本理念


    智能革命使得人们对“智能”“意识”“主体性”等基础概念的认识发生根本性变化。这将在民事法律责任领域引发从概念体系、规则设计到价值理念的变革，为新型民事法律责任规则化创造了条件。但是，新型民事法律责任规则化受到人工智能技术发展、理性思维能力、法律技术等因素的限制。如人工智能的意向性和自主意识对人类中心主义理论预设下的法律责任主体制度造成了冲击，但是，在规则设计的层面，如何看待人类中心主义、能否通过新型法律规则重建解构人类中心主义后的法律秩序等问题值得思考。


    （一）价值迷失


    人工智能让人们看到了共产主义的曙光，产生了“人工智能共产主义”思想，即人工智能将人类从繁重的体力和脑力劳动中解放出来，创造极为丰富的社会财富，作为个体存在的人实现按需分配。“劳动不再是痛苦的而成为人们的第一需要，人们自愿劳动，并且在劳动之余从事反思性的‘批判’。”^([\[19\]](#txt009.html#footnote_content_txt009_19))劳动成为人类自觉自愿的一部分。


    “劳动创造了人本身”是劳动价值论的基本观点。劳动对于人而言，并非仅仅是一种谋生的手段，而且是生活中不可或缺的组成部分。劳动作为“生活内容”存在。“假如失去了劳动，生活就失去了大部分内容，甚至无可言说。”^([\[20\]](#txt009.html#footnote_content_txt009_20))当人工智能在体力劳动和脑力劳动方面全方位替代人类之后，需要重新思考人存在的价值。实践证明，无所事事往往比忙碌更容易让人产生焦虑、不安的情绪。此外，人的生活价值和意义是在人与人的关系中，而非人与物的关系中被定义的。“当人工智能成为万能技术系统而为人类提供全方位的服务，一切需求皆由技术来满足……人对于人将成为冗余物……人不再是人的生活意义的分享者，人对于人失去了意义，于是人对人也就失去了兴趣。”^([\[21\]](#txt009.html#footnote_content_txt009_21))


    人工智能时代以人类中心主义为基础构建的价值体系遭到质疑和冲击。“动物权利论”“机器人权利论”崛起，多元价值体系思潮甚嚣尘上，陷入价值虚无主义的困境。不可否认，极端的人类中心主义存在弊端。但是，进行冷静的理性思考后不难发现，所谓的动物权利、机器权利不过是人类综合考量短期利益和长期利益、个体利益与整体利益的结果，其根本还是为了人类利益。人工智能时代的种种不确定性使得我们必须重申并强调人文主义、人本主义的重要性。因为很难想象作为类存在的具有独立意识的人工智能会一直保持利他状态，服从和服务于人类。以人为终极价值理念的思想在人工智能时代需要强调而不是弱化。


    （二）法律价值体系再思考


    法律价值是对法律现实进行总结、凝练和抽象的结果，它蕴含着主体对法律的美好期待，具有目标指引的功能。法律价值具有鲜明的时代性特征。吴汉东教授将人工智能时代的法律价值分为一般法价值与特别法价值两个层面，其中人工智能法律的特别价值“主要是安全、创新和和谐”^([\[22\]](#txt009.html#footnote_content_txt009_22))。人工智能时代民事法律责任规则设计需要着重考虑安全、创新、和谐和自由等法律价值。


    1.安全价值


    “安全是人工智能时代的核心法价值。”^([\[23\]](#txt009.html#footnote_content_txt009_23))人工智能技术未来发展的不确定性影响社会秩序。人工智能超越人类智能的可能性、人工智能产生的危害后果的严重性以及人工智能技术本身内在的不确定性，这些因素足以构成法律以及其他法律规范防止风险的必要性。^([\[24\]](#txt009.html#footnote_content_txt009_24))人工智能时代安全价值的实现需要依赖集体理性构筑人类命运共同体。个体理性行为的总和并不简单等同于集体理性行为，有时候甚至是集体非理性行为。人类首先需要一种世界宪法以及运行世界宪法的世界政治体系，否则无法解决人类的集体理性问题。^([\[25\]](#txt009.html#footnote_content_txt009_25))


    2.创新价值


    “创新是人工智能法律的价值灵魂。”^([\[26\]](#txt009.html#footnote_content_txt009_26))人工智能科学与技术进步是一个不断被证伪的过程，不能让法律制度成为限制科学和技术进步的牢笼。对人工智能技术的研发与应用进行监管是必要的，但是，监管应当适时、适度。“早期的技术研发需要宽松的土壤以满足科学家无尽的想象力，过早地介入无异于将技术扼杀在摇篮里。”^([\[27\]](#txt009.html#footnote_content_txt009_27))


    人工智能法律规则设计需要在安全与创新价值之间寻求平衡。技术进步的步伐不可阻挡，人类无力拒绝技术变革营造的新世界。但是，技术变革应当限定在人类可以控制的限度内。狂热冒进不如冷静审慎。但是，法律又不能过于保守，需要为创新预留空间，不能成为创新的障碍。“在技术发展和社会—经济结构变化缓慢的农业社会和早期工业化社会，这种保守倾向使法律发挥了很好的维持社会稳定的作用。但在人工智能时代，它却使法律滞后于技术和经济的发展，使那些把握先机的人获得了巨大的边际回报。”^([\[28\]](#txt009.html#footnote_content_txt009_28))


    3.和谐价值


    “和谐是人工智能时代的终极价值追求。”^([\[29\]](#txt009.html#footnote_content_txt009_29))人工智能对社会生活造成的冲击是全方位和根本性的。社会生活的秩序将经历解构和重构的过程。在新旧秩序更迭的过程中，和谐价值显得弥足珍贵。如何防止或缓和人工智能产品使用者与被替代的劳动者之间发生的激烈冲突、如何平衡人工智能与人类智能之间的关系、如何维持人类在社会生活中的话语权、如何防范人类滥用人工智能产品等问题需要在和谐价值理念下进行思考。


    4.自由价值


    在社会资源尚未丰富到按需分配的程度，资源处于排他性占有的情况下，普惠的技术革命带来的未必是福音，而可能是灾难。垄断技术会占有更多的社会资源。技术精英与权力阶层结合，技术彻底重塑世界将导致社会走向专制而非民主，科技时代的奴隶制会随之产生。“自由与必然之间的关系，因人工智能的出现而越发成了一个由社会分层（阶级）决定的事务：越来越少的人享有越来越大的自由，越来越多的人受到越来越强的必然性的束缚。”^([\[30\]](#txt009.html#footnote_content_txt009_30))换言之，技术垄断会造成社会压制。


    总而言之，在技术至上的人工智能时代美化甚至神化人工智能技术、或是丑化甚至妖魔化人工智能技术都属于脱离社会现实的极端化思维方式，并不可取。反思人工智能技术并不必然阻碍人工智能技术的研发和应用，相反能够保障人工智能技术在安全的轨道中前行。这就需要拨开技术的迷雾，祛除对人工智能技术的神化或妖魔化，将关注人本身作为法律的终极价值。人工智能时代人类中心主义遭到质疑和冲击。在人类存在思维方式下，人类是命运休戚相关的共同体，人文主义和人本主义精神在人工智能时代显得尤为重要，在人工智能和人的关系中人类而非人工智能应当且必须占据中心位置，将人类利益作为规则设计的出发点和归宿。


    二、以智能机器（人）有限行为自主性为基础的规则体系设计


    机器智能化程度直接影响智能机器（人）与人的关系，决定其在民事法律责任体系中的基本定位，为责任主体、归责原则、责任形态、责任承担方式等规则设计设定基调。本着“立足现实，着眼未来”的基本思想，当下应当以智能机器（人）有限行为自主性为基础进行民事法律责任规则体系设计，解决现实生活中亟需解决的问题，又为未来规则设计预留空间。^([\[31\]](#txt009.html#footnote_content_txt009_31))


    （一）新型民事法律责任一般规则设计


    ①［智能机器（人）的法律定位］智能机器（人）是人类制造的智能化工具，其行为具有完全或局部自主性。


    智能机器（人）不具有独立法律人格，但具有独立意识的除外。


    ②［智能机器（人）的民事责任能力］智能机器（人）不能独立承担民事法律责任，造成的损失由其制造者、保有者或使用者等主体依法承担。


    ③［智能机器（人）登记］智能机器（人）的制造者、保有者或使用者等主体可以向智能机器（人）登记机构申请登记。


    登记的智能机器（人）致人损害的，首先以登记在其名下的财产承担民事法律责任，不足部分由制造者、保有者或使用者依法补充。


    ④［因果关系的认定］智能机器（人）行为与结果之间的因果关系根据智能系统记录的数据的相关性进行判定。


    受害人证明其实际遭受的损害与智能机器（人）的行为之间存在事实上的因果关系即可。


    生产和使用智能机器（人）的过程中，需要强制操作留痕和定期报告。智能机器（人）的制造者、保有者或使用者能够证明损害结果是因不可预见的智能机器（人）的行为导致的，智能机器（人）行为与致害结果之间的因果关系被切断。智能机器（人）基于学习算法而作出的自主决策和行为不属于不可预见的行为。


    ⑤［以智能机器（人）为联结点的责任承担方式］智能机器（人）导致损害的民事责任承担方式限于财产形式，包括缴出赔偿、召回和销毁智能机器（人）、支付赔偿金等。


    ⑥［智能机器（人）保险］国家推行智能机器（人）强制责任保险制度。智能机器（人）的制造者或保有者必须为在公共领域使用且具有一定规格物理外观的智能机器（人）投保第三者责任保险。


    国家鼓励商业保险公司探索和开展智能机器（人）损失保险、商业责任保险业务。


    ⑦［智能机器（人）责任基金］智能机器（人）的设计者、制造者和保有者等主体根据设计、制造和保有智能机器（人）的数量或价值向智能机器（人）基金组织交纳费用，形成责任基金。


    智能机器（人）致人损害，但无法确认责任主体或责任主体无力承担责任时，责任基金起到补充救济受害人的作用。


    （二）新型侵权法律责任规则设计


    ①［高度危险来源占有人责任］智能机器（人）因设计特性或系统参数而导致行为不完全受人类控制并可能导致他人损害时，视为具有高度危险。


    智能机器（人）的占有人对智能机器（人）自主行为致人损害需要承担民事法律责任。这里的占有人包括合法占有人和非法占有人。


    ②［管理人责任］智能机器（人）致人损害，而其管理人未尽到管理义务的，需要承担民事法律责任。


    ③［产品责任］生产智能机器（人）应当符合国家标准、行业标准以及消费者的合理预期，不存在致人损害的不合理危险。智能机器（人）产品存在缺陷的，制造者承担产品责任。


    算法缺陷，是指设计者设计的算法存在致人损害的不合理风险。因算法缺陷致人损害的，由制造者承担产品责任。算法设计者故意设计缺陷算法致人损害的，承担连带责任。


    ④［算法的可解释性］智能机器（人）的制造者、保有人和使用人负有解释算法的义务，其不得以算法不可解释为由主张免除责任。


    ⑤［免责事由］智能机器（人）的制造者无需对制造智能机器（人）当时科学技术水平无法发现的缺陷承担责任。


    （三）智能驾驶中法律责任规则设计'
  fmt: '

    法律应对社会生活的变化的方式有经验主义路径和建构主义路径之分。经验主义路径强调法律规则体系的稳定性和延续性，主张维持既有法律规则体系的现状，通过扩张解释的方式拓展法律规则的适用范围；建构主义路径强调法律规则体系的创新型，主张突破既有法律规则体系，通过立法或司法解释的方式重构法律规则体系。新生事物（如人工生殖技术、人工智能技术）出现时，是否需要重建法律理念、法律价值和法律规则体系取决于原有的法律体系能否满足科技发展产生的新需求。倘若通过扩张性解释能够将新生事物纳入法律体系中，则无须重构法律体系，以防止新旧法律理念、价值和规则之间出现冲突，导致失序。只有在新生事物无法通过涵摄或类比等方式被纳入既有法律体系时，才需要重构法律理念、法律价值和法律规则体系。


    ## 三、规则设计的阶段性分析


    人工智能技术的研发和应用具有阶段性特征，不同阶段人工智能的自主性、意向性和不确定性的程度及表现形式存在差异，重构民事法律责任规则体系的必要性以及民事法律责任的主体、类型和分配亦有所不同。“人工智能技术是由弱变强的，有明显的阶段性，法律不应跳过任一阶段。”^([\[10\]](#txt009.html#footnote_content_txt009_10))否认人工智能技术进步在不同阶段对民事法律责任制度造成冲击的差异，不区分人工智能民事法律责任规则设计的阶段性，会造成无争议的争议。目前，关于人工智能时代民事法律责任规则设计的必要性以及责任功能、责任性质、责任归属等问题的讨论大多因为未区分规则设计的阶段性而犹如盲人摸象，若欲将某一阶段的规则设计通过无限放大或以偷梁换柱的方式转移至另一阶段则会出现以偏概全或偷换概念的逻辑错误。


    ### （一）编程设计阶段


    在编程设计阶段，人工智能的研发者和使用者对人工智能产品具有完全的控制力。人工智能产品按照研发者或使用者设计或设定的程序运行，在决策或行为方面不具有自主性，缺乏进行独立判断的能力。人工智能产品与其他的物在本质上并无区别，只是人类认识或改造世界的工具。“这一阶段的人工智能只有简单的功能意义而没有任何独立机器学习的可能性，所以应将其导致的损害责任视为产品质量责任。”^([\[11\]](#txt009.html#footnote_content_txt009_11))


    ### （二）机器学习阶段


    “机器学习”和“深度学习”等方式推动了人工智能技术的发展与进步。拥有自主学习能力的人工智能产品虽然仍未摆脱研发者或使用者的控制，但是，其能够在一定范围内进行独立思考和判断。滥用人工智能的法律人格或地位，将其作为研发者或使用者的“替罪羊”的现象出现。“对人类自身种群命运的实质危害并不在莫须有的机器人‘人格’本身，而是在机器人‘人格’掩护下极少数创造算法、通过人工智能驱动社会运转的业内人对大多数人的算法独裁与技术绑架。”^([\[12\]](#txt009.html#footnote_content_txt009_12))


    在这一阶段，人工智能产品的行为是研发者或使用者预先设定的程序和机器学习共同作用的结果，需要考察研发者和使用者对人工智能产品的控制能力，分类设计民事法律责任规则，即区分行为原因是划分责任的前提。智能机器（人）的智能化特征，改变了人与机器之间的关系。主体与客体二元划分下的控制与被控制关系的理论预设的根基发生动摇，机器的“行为”被区分为自主行为和控制行为，需要在区分自主行为与控制行为的基础上确定民事法律责任的方案。《欧盟机器人民事法律规则》特意强调，当机器人的“有害行为”实际归因于人的身份时，经过训练得来的技能不应与自主学习获得的技能相混淆，并建立了责任承担与特定人的干预程度的正比关系规则。^([\[13\]](#txt009.html#footnote_content_txt009_13))


    ### （三）机器自主意识阶段


    人类对作为人类智能衍生物的人工智能负有管控义务，是其需要对人工智能造成损害承担责任的基础。在机器自主意识阶段，人工智能的行为摆脱了研发者或使用者的控制，是其自由意志的结果。研发者或使用者为人工智能致损承担责任的基础丧失，人工智能作为独立意思表示的主体需要对其行为产生的法律后果承担责任。


    ## 四、规则设计的考量因素


    人工智能侵权责任规则设计关系到社会安全、科技创新、应用、行为自由和权利救济等问题，它直接影响人工智能产品设计者、制造者、使用者以及社会大众的利益。“责任承担的背后隐藏着上述主体的利益博弈，更体现着对技术进步与社会安全、创新者激励与受害人救济、行为自由与权益保护的综合考量。”^([\[14\]](#txt009.html#footnote_content_txt009_14))


    ### （一）人工智能技术进步与产业发展和繁荣


    为鼓励人工智能技术的研发与应用，需要对技术创新带来的负面效应予以适当容忍。在进行侵权责任规则设计时，将鼓励技术创新作为基本价值理念，就需要在责任分配方面向技术研发和应用的主体适当倾斜，避免因侵权赔偿数额巨大妨碍人工智能技术创新。


    民事责任具有损害转移的功能，即受害人遭受的损失转由加害人承担。这种损害转移能够起到促使成本内部化的作用。人工智能研发和应用的主体为降低承担民事责任的风险，会尽到更多的注意义务，进而保障人工智能技术研发和应用的安全性。


    ### （二）受害方获得救济的充分性


    技术创新和进步不应成为阻止受害人获得救济的正当理由。“从价值立场来看，充分救济自动驾驶汽车致损事故的受害人应该成为法律机制调整或创新的主要出发点。”^([\[15\]](#txt009.html#footnote_content_txt009_15))无论选择什么样的法律方案来解决机器人的责任问题，在涉及财产损害之外的损害案件中，都不应该限制损害的种类或者程度，也不应该基于损害是由非人类行动者造成的这一理由限制受害人可能获得的赔偿。^([\[16\]](#txt009.html#footnote_content_txt009_16))


    产业发展与受害者救济并不绝对矛盾。“如果不要求自动驾驶汽车的设计者或制造商承担符合公平正义观念的责任，消费者可能会怀疑设计者或制造商为了产业利益而将未臻成熟的自动驾驶汽车推向市场，从而使其购买或使用自动驾驶汽车的信心受到打击，导致消费者对自动驾驶汽车采取敬而远之的态度，这反而会影响产业的发展。”^([\[17\]](#txt009.html#footnote_content_txt009_17))消费者对人工智能产品市场信心的培育在一定程度上依赖于行业和产品形象，如沃尔沃、谷歌等企业基于企业社会责任自愿承担部分责任，通过市场的力量影响责任配置。


    人工智能时代侵权责任制度设计不能过于严苛，否则会使其成为人工智能产业发展的短板。20 世纪90 年代，美国为适应互联网时代的新形势对版权法和侵权法进行了重大制度变革，降低了互联网平台的法律风险，激发了硅谷企业和程序设计者的创造力，为互联网技术创新提供了有利的制度环境。目前，人工智能产品的应用处于探索和发展初期，需要培育人工智能行业的创新精神，不宜过度限制人工智能产品的设计者、制造者等主体的行为自由选择度，影响人工智能行业的整体发展。当然，培育创新精神也需要兼顾对受害人的权利保护和救济，不能让社会大众成为科技进步或创新的牺牲品。


    ## 第三节 《民法典》之后新型民事法律责任规则设计的思考


    在《民法典》起草过程中就人工智能时代的法律责任问题，如智能驾驶的侵权责任进行了探索，但是出于谨慎和周全的考虑，最终并未将研究成果体现在《民法典》中。^([\[18\]](#txt009.html#footnote_content_txt009_18))这一“留白”的立法技术为未来研究和设计人工智能民事法律责任规则预留了空间。《民法典》之后，法律如何应对如火如荼的人工智能技术浪潮、人工智能时代的民事法律责任如何规则化等问题亟需思考和探索。


    ### 一、将“对人终极关怀”作为规则设计的基本理念


    智能革命使得人们对“智能”“意识”“主体性”等基础概念的认识发生根本性变化。这将在民事法律责任领域引发从概念体系、规则设计到价值理念的变革，为新型民事法律责任规则化创造了条件。但是，新型民事法律责任规则化受到人工智能技术发展、理性思维能力、法律技术等因素的限制。如人工智能的意向性和自主意识对人类中心主义理论预设下的法律责任主体制度造成了冲击，但是，在规则设计的层面，如何看待人类中心主义、能否通过新型法律规则重建解构人类中心主义后的法律秩序等问题值得思考。


    #### （一）价值迷失


    人工智能让人们看到了共产主义的曙光，产生了“人工智能共产主义”思想，即人工智能将人类从繁重的体力和脑力劳动中解放出来，创造极为丰富的社会财富，作为个体存在的人实现按需分配。“劳动不再是痛苦的而成为人们的第一需要，人们自愿劳动，并且在劳动之余从事反思性的‘批判’。”^([\[19\]](#txt009.html#footnote_content_txt009_19))劳动成为人类自觉自愿的一部分。


    “劳动创造了人本身”是劳动价值论的基本观点。劳动对于人而言，并非仅仅是一种谋生的手段，而且是生活中不可或缺的组成部分。劳动作为“生活内容”存在。“假如失去了劳动，生活就失去了大部分内容，甚至无可言说。”^([\[20\]](#txt009.html#footnote_content_txt009_20))当人工智能在体力劳动和脑力劳动方面全方位替代人类之后，需要重新思考人存在的价值。实践证明，无所事事往往比忙碌更容易让人产生焦虑、不安的情绪。此外，人的生活价值和意义是在人与人的关系中，而非人与物的关系中被定义的。“当人工智能成为万能技术系统而为人类提供全方位的服务，一切需求皆由技术来满足……人对于人将成为冗余物……人不再是人的生活意义的分享者，人对于人失去了意义，于是人对人也就失去了兴趣。”^([\[21\]](#txt009.html#footnote_content_txt009_21))


    人工智能时代以人类中心主义为基础构建的价值体系遭到质疑和冲击。“动物权利论”“机器人权利论”崛起，多元价值体系思潮甚嚣尘上，陷入价值虚无主义的困境。不可否认，极端的人类中心主义存在弊端。但是，进行冷静的理性思考后不难发现，所谓的动物权利、机器权利不过是人类综合考量短期利益和长期利益、个体利益与整体利益的结果，其根本还是为了人类利益。人工智能时代的种种不确定性使得我们必须重申并强调人文主义、人本主义的重要性。因为很难想象作为类存在的具有独立意识的人工智能会一直保持利他状态，服从和服务于人类。以人为终极价值理念的思想在人工智能时代需要强调而不是弱化。


    #### （二）法律价值体系再思考


    法律价值是对法律现实进行总结、凝练和抽象的结果，它蕴含着主体对法律的美好期待，具有目标指引的功能。法律价值具有鲜明的时代性特征。吴汉东教授将人工智能时代的法律价值分为一般法价值与特别法价值两个层面，其中人工智能法律的特别价值“主要是安全、创新和和谐”^([\[22\]](#txt009.html#footnote_content_txt009_22))。人工智能时代民事法律责任规则设计需要着重考虑安全、创新、和谐和自由等法律价值。


    ##### 1. 安全价值


    “安全是人工智能时代的核心法价值。”^([\[23\]](#txt009.html#footnote_content_txt009_23))人工智能技术未来发展的不确定性影响社会秩序。人工智能超越人类智能的可能性、人工智能产生的危害后果的严重性以及人工智能技术本身内在的不确定性，这些因素足以构成法律以及其他法律规范防止风险的必要性。^([\[24\]](#txt009.html#footnote_content_txt009_24))人工智能时代安全价值的实现需要依赖集体理性构筑人类命运共同体。个体理性行为的总和并不简单等同于集体理性行为，有时候甚至是集体非理性行为。人类首先需要一种世界宪法以及运行世界宪法的世界政治体系，否则无法解决人类的集体理性问题。^([\[25\]](#txt009.html#footnote_content_txt009_25))


    ##### 2. 创新价值


    “创新是人工智能法律的价值灵魂。”^([\[26\]](#txt009.html#footnote_content_txt009_26))人工智能科学与技术进步是一个不断被证伪的过程，不能让法律制度成为限制科学和技术进步的牢笼。对人工智能技术的研发与应用进行监管是必要的，但是，监管应当适时、适度。“早期的技术研发需要宽松的土壤以满足科学家无尽的想象力，过早地介入无异于将技术扼杀在摇篮里。”^([\[27\]](#txt009.html#footnote_content_txt009_27))


    人工智能法律规则设计需要在安全与创新价值之间寻求平衡。技术进步的步伐不可阻挡，人类无力拒绝技术变革营造的新世界。但是，技术变革应当限定在人类可以控制的限度内。狂热冒进不如冷静审慎。但是，法律又不能过于保守，需要为创新预留空间，不能成为创新的障碍。“在技术发展和社会—经济结构变化缓慢的农业社会和早期工业化社会，这种保守倾向使法律发挥了很好的维持社会稳定的作用。但在人工智能时代，它却使法律滞后于技术和经济的发展，使那些把握先机的人获得了巨大的边际回报。”^([\[28\]](#txt009.html#footnote_content_txt009_28))


    ##### 3. 和谐价值


    “和谐是人工智能时代的终极价值追求。”^([\[29\]](#txt009.html#footnote_content_txt009_29))人工智能对社会生活造成的冲击是全方位和根本性的。社会生活的秩序将经历解构和重构的过程。在新旧秩序更迭的过程中，和谐价值显得弥足珍贵。如何防止或缓和人工智能产品使用者与被替代的劳动者之间发生的激烈冲突、如何平衡人工智能与人类智能之间的关系、如何维持人类在社会生活中的话语权、如何防范人类滥用人工智能产品等问题需要在和谐价值理念下进行思考。


    ##### 4. 自由价值


    在社会资源尚未丰富到按需分配的程度，资源处于排他性占有的情况下，普惠的技术革命带来的未必是福音，而可能是灾难。垄断技术会占有更多的社会资源。技术精英与权力阶层结合，技术彻底重塑世界将导致社会走向专制而非民主，科技时代的奴隶制会随之产生。“自由与必然之间的关系，因人工智能的出现而越发成了一个由社会分层（阶级）决定的事务：越来越少的人享有越来越大的自由，越来越多的人受到越来越强的必然性的束缚。”^([\[30\]](#txt009.html#footnote_content_txt009_30))换言之，技术垄断会造成社会压制。


    总而言之，在技术至上的人工智能时代美化甚至神化人工智能技术、或是丑化甚至妖魔化人工智能技术都属于脱离社会现实的极端化思维方式，并不可取。反思人工智能技术并不必然阻碍人工智能技术的研发和应用，相反能够保障人工智能技术在安全的轨道中前行。这就需要拨开技术的迷雾，祛除对人工智能技术的神化或妖魔化，将关注人本身作为法律的终极价值。人工智能时代人类中心主义遭到质疑和冲击。在人类存在思维方式下，人类是命运休戚相关的共同体，人文主义和人本主义精神在人工智能时代显得尤为重要，在人工智能和人的关系中人类而非人工智能应当且必须占据中心位置，将人类利益作为规则设计的出发点和归宿。


    ### 二、以智能机器（人）有限行为自主性为基础的规则体系设计


    机器智能化程度直接影响智能机器（人）与人的关系，决定其在民事法律责任体系中的基本定位，为责任主体、归责原则、责任形态、责任承担方式等规则设计设定基调。本着“立足现实，着眼未来”的基本思想，当下应当以智能机器（人）有限行为自主性为基础进行民事法律责任规则体系设计，解决现实生活中亟需解决的问题，又为未来规则设计预留空间。^([\[31\]](#txt009.html#footnote_content_txt009_31))


    #### （一）新型民事法律责任一般规则设计


    ①［智能机器（人）的法律定位］智能机器（人）是人类制造的智能化工具，其行为具有完全或局部自主性。


    智能机器（人）不具有独立法律人格，但具有独立意识的除外。


    ②［智能机器（人）的民事责任能力］智能机器（人）不能独立承担民事法律责任，造成的损失由其制造者、保有者或使用者等主体依法承担。


    ③［智能机器（人）登记］智能机器（人）的制造者、保有者或使用者等主体可以向智能机器（人）登记机构申请登记。


    登记的智能机器（人）致人损害的，首先以登记在其名下的财产承担民事法律责任，不足部分由制造者、保有者或使用者依法补充。


    ④［因果关系的认定］智能机器（人）行为与结果之间的因果关系根据智能系统记录的数据的相关性进行判定。


    受害人证明其实际遭受的损害与智能机器（人）的行为之间存在事实上的因果关系即可。


    生产和使用智能机器（人）的过程中，需要强制操作留痕和定期报告。智能机器（人）的制造者、保有者或使用者能够证明损害结果是因不可预见的智能机器（人）的行为导致的，智能机器（人）行为与致害结果之间的因果关系被切断。智能机器（人）基于学习算法而作出的自主决策和行为不属于不可预见的行为。


    ⑤［以智能机器（人）为联结点的责任承担方式］智能机器（人）导致损害的民事责任承担方式限于财产形式，包括缴出赔偿、召回和销毁智能机器（人）、支付赔偿金等。


    ⑥［智能机器（人）保险］国家推行智能机器（人）强制责任保险制度。智能机器（人）的制造者或保有者必须为在公共领域使用且具有一定规格物理外观的智能机器（人）投保第三者责任保险。


    国家鼓励商业保险公司探索和开展智能机器（人）损失保险、商业责任保险业务。


    ⑦［智能机器（人）责任基金］智能机器（人）的设计者、制造者和保有者等主体根据设计、制造和保有智能机器（人）的数量或价值向智能机器（人）基金组织交纳费用，形成责任基金。


    智能机器（人）致人损害，但无法确认责任主体或责任主体无力承担责任时，责任基金起到补充救济受害人的作用。


    #### （二）新型侵权法律责任规则设计


    ①［高度危险来源占有人责任］智能机器（人）因设计特性或系统参数而导致行为不完全受人类控制并可能导致他人损害时，视为具有高度危险。


    智能机器（人）的占有人对智能机器（人）自主行为致人损害需要承担民事法律责任。这里的占有人包括合法占有人和非法占有人。


    ②［管理人责任］智能机器（人）致人损害，而其管理人未尽到管理义务的，需要承担民事法律责任。


    ③［产品责任］生产智能机器（人）应当符合国家标准、行业标准以及消费者的合理预期，不存在致人损害的不合理危险。智能机器（人）产品存在缺陷的，制造者承担产品责任。


    算法缺陷，是指设计者设计的算法存在致人损害的不合理风险。因算法缺陷致人损害的，由制造者承担产品责任。算法设计者故意设计缺陷算法致人损害的，承担连带责任。


    ④［算法的可解释性］智能机器（人）的制造者、保有人和使用人负有解释算法的义务，其不得以算法不可解释为由主张免除责任。


    ⑤［免责事由］智能机器（人）的制造者无需对制造智能机器（人）当时科学技术水平无法发现的缺陷承担责任。


    #### （三）智能驾驶中法律责任规则设计

    '
  trans: '


    法律应对社会生活的变化的方式有经验主义路径和建构主义路径之分。经验主义路径强调法律规则体系的稳定性和延续性，主张维持既有法律规则体系的现状，通过扩张解释的方式拓展法律规则的适用范围；建构主义路径强调法律规则体系的创新型，主张突破既有法律规则体系，通过立法或司法解释的方式重构法律规则体系。新生事物（如人工生殖技术、人工智能技术）出现时，是否需要重建法律理念、法律价值和法律规则体系取决于原有的法律体系能否满足科技发展产生的新需求。倘若通过扩张性解释能够将新生事物纳入法律体系中，则无须重构法律体系，以防止新旧法律理念、价值和规则之间出现冲突，导致失序。只有在新生事物无法通过涵摄或类比等方式被纳入既有法律体系时，才需要重构法律理念、法律价值和法律规则体系。


    ## 三、规则设计的阶段性分析


    人工智能技术的研发和应用具有阶段性特征，不同阶段人工智能的自主性、意向性和不确定性的程度及表现形式存在差异，重构民事法律责任规则体系的必要性以及民事法律责任的主体、类型和分配亦有所不同。“人工智能技术是由弱变强的，有明显的阶段性，法律不应跳过任一阶段。”^([\[10\]](#txt009.html#footnote_content_txt009_10))否认人工智能技术进步在不同阶段对民事法律责任制度造成冲击的差异，不区分人工智能民事法律责任规则设计的阶段性，会造成无争议的争议。目前，关于人工智能时代民事法律责任规则设计的必要性以及责任功能、责任性质、责任归属等问题的讨论大多因为未区分规则设计的阶段性而犹如盲人摸象，若欲将某一阶段的规则设计通过无限放大或以偷梁换柱的方式转移至另一阶段则会出现以偏概全或偷换概念的逻辑错误。


    ### （一）编程设计阶段


    在编程设计阶段，人工智能的研发者和使用者对人工智能产品具有完全的控制力。人工智能产品按照研发者或使用者设计或设定的程序运行，在决策或行为方面不具有自主性，缺乏进行独立判断的能力。人工智能产品与其他的物在本质上并无区别，只是人类认识或改造世界的工具。“这一阶段的人工智能只有简单的功能意义而没有任何独立机器学习的可能性，所以应将其导致的损害责任视为产品质量责任。”^([\[11\]](#txt009.html#footnote_content_txt009_11))


    ### （二）机器学习阶段


    “机器学习”和“深度学习”等方式推动了人工智能技术的发展与进步。拥有自主学习能力的人工智能产品虽然仍未摆脱研发者或使用者的控制，但是，其能够在一定范围内进行独立思考和判断。滥用人工智能的法律人格或地位，将其作为研发者或使用者的“替罪羊”的现象出现。“对人类自身种群命运的实质危害并不在莫须有的机器人‘人格’本身，而是在机器人‘人格’掩护下极少数创造算法、通过人工智能驱动社会运转的业内人对大多数人的算法独裁与技术绑架。”^([\[12\]](#txt009.html#footnote_content_txt009_12))


    在这一阶段，人工智能产品的行为是研发者或使用者预先设定的程序和机器学习共同作用的结果，需要考察研发者和使用者对人工智能产品的控制能力，分类设计民事法律责任规则，即区分行为原因是划分责任的前提。智能机器（人）的智能化特征，改变了人与机器之间的关系。主体与客体二元划分下的控制与被控制关系的理论预设的根基发生动摇，机器的“行为”被区分为自主行为和控制行为，需要在区分自主行为与控制行为的基础上确定民事法律责任的方案。《欧盟机器人民事法律规则》特意强调，当机器人的“有害行为”实际归因于人的身份时，经过训练得来的技能不应与自主学习获得的技能相混淆，并建立了责任承担与特定人的干预程度的正比关系规则。^([\[13\]](#txt009.html#footnote_content_txt009_13))


    ### （三）机器自主意识阶段


    人类对作为人类智能衍生物的人工智能负有管控义务，是其需要对人工智能造成损害承担责任的基础。在机器自主意识阶段，人工智能的行为摆脱了研发者或使用者的控制，是其自由意志的结果。研发者或使用者为人工智能致损承担责任的基础丧失，人工智能作为独立意思表示的主体需要对其行为产生的法律后果承担责任。


    ## 四、规则设计的考量因素


    人工智能侵权责任规则设计关系到社会安全、科技创新、应用、行为自由和权利救济等问题，它直接影响人工智能产品设计者、制造者、使用者以及社会大众的利益。“责任承担的背后隐藏着上述主体的利益博弈，更体现着对技术进步与社会安全、创新者激励与受害人救济、行为自由与权益保护的综合考量。”^([\[14\]](#txt009.html#footnote_content_txt009_14))


    ### （一）人工智能技术进步与产业发展和繁荣


    为鼓励人工智能技术的研发与应用，需要对技术创新带来的负面效应予以适当容忍。在进行侵权责任规则设计时，将鼓励技术创新作为基本价值理念，就需要在责任分配方面向技术研发和应用的主体适当倾斜，避免因侵权赔偿数额巨大妨碍人工智能技术创新。


    民事责任具有损害转移的功能，即受害人遭受的损失转由加害人承担。这种损害转移能够起到促使成本内部化的作用。人工智能研发和应用的主体为降低承担民事责任的风险，会尽到更多的注意义务，进而保障人工智能技术研发和应用的安全性。


    ### （二）受害方获得救济的充分性


    技术创新和进步不应成为阻止受害人获得救济的正当理由。“从价值立场来看，充分救济自动驾驶汽车致损事故的受害人应该成为法律机制调整或创新的主要出发点。”^([\[15\]](#txt009.html#footnote_content_txt009_15))无论选择什么样的法律方案来解决机器人的责任问题，在涉及财产损害之外的损害案件中，都不应该限制损害的种类或者程度，也不应该基于损害是由非人类行动者造成的这一理由限制受害人可能获得的赔偿。^([\[16\]](#txt009.html#footnote_content_txt009_16))


    产业发展与受害者救济并不绝对矛盾。“如果不要求自动驾驶汽车的设计者或制造商承担符合公平正义观念的责任，消费者可能会怀疑设计者或制造商为了产业利益而将未臻成熟的自动驾驶汽车推向市场，从而使其购买或使用自动驾驶汽车的信心受到打击，导致消费者对自动驾驶汽车采取敬而远之的态度，这反而会影响产业的发展。”^([\[17\]](#txt009.html#footnote_content_txt009_17))消费者对人工智能产品市场信心的培育在一定程度上依赖于行业和产品形象，如沃尔沃、谷歌等企业基于企业社会责任自愿承担部分责任，通过市场的力量影响责任配置。


    人工智能时代侵权责任制度设计不能过于严苛，否则会使其成为人工智能产业发展的短板。20 世纪 90 年代，美国为适应互联网时代的新形势对版权法和侵权法进行了重大制度变革，降低了互联网平台的法律风险，激发了硅谷企业和程序设计者的创造力，为互联网技术创新提供了有利的制度环境。目前，人工智能产品的应用处于探索和发展初期，需要培育人工智能行业的创新精神，不宜过度限制人工智能产品的设计者、制造者等主体的行为自由选择度，影响人工智能行业的整体发展。当然，培育创新精神也需要兼顾对受害人的权利保护和救济，不能让社会大众成为科技进步或创新的牺牲品。


    ## 第三节 《民法典》之后新型民事法律责任规则设计的思考


    在《民法典》起草过程中就人工智能时代的法律责任问题，如智能驾驶的侵权责任进行了探索，但是出于谨慎和周全的考虑，最终并未将研究成果体现在《民法典》中。^([\[18\]](#txt009.html#footnote_content_txt009_18))这一“留白”的立法技术为未来研究和设计人工智能民事法律责任规则预留了空间。《民法典》之后，法律如何应对如火如荼的人工智能技术浪潮、人工智能时代的民事法律责任如何规则化等问题亟需思考和探索。


    ### 一、将“对人终极关怀”作为规则设计的基本理念


    智能革命使得人们对“智能”“意识”“主体性”等基础概念的认识发生根本性变化。这将在民事法律责任领域引发从概念体系、规则设计到价值理念的变革，为新型民事法律责任规则化创造了条件。但是，新型民事法律责任规则化受到人工智能技术发展、理性思维能力、法律技术等因素的限制。如人工智能的意向性和自主意识对人类中心主义理论预设下的法律责任主体制度造成了冲击，但是，在规则设计的层面，如何看待人类中心主义、能否通过新型法律规则重建解构人类中心主义后的法律秩序等问题值得思考。


    #### （一）价值迷失


    人工智能让人们看到了共产主义的曙光，产生了“人工智能共产主义”思想，即人工智能将人类从繁重的体力和脑力劳动中解放出来，创造极为丰富的社会财富，作为个体存在的人实现按需分配。“劳动不再是痛苦的而成为人们的第一需要，人们自愿劳动，并且在劳动之余从事反思性的‘批判’。”^([\[19\]](#txt009.html#footnote_content_txt009_19))劳动成为人类自觉自愿的一部分。


    “劳动创造了人本身”是劳动价值论的基本观点。劳动对于人而言，并非仅仅是一种谋生的手段，而且是生活中不可或缺的组成部分。劳动作为“生活内容”存在。“假如失去了劳动，生活就失去了大部分内容，甚至无可言说。”^([\[20\]](#txt009.html#footnote_content_txt009_20))当人工智能在体力劳动和脑力劳动方面全方位替代人类之后，需要重新思考人存在的价值。实践证明，无所事事往往比忙碌更容易让人产生焦虑、不安的情绪。此外，人的生活价值和意义是在人与人的关系中，而非人与物的关系中被定义的。“当人工智能成为万能技术系统而为人类提供全方位的服务，一切需求皆由技术来满足……人对于人将成为冗余物……人不再是人的生活意义的分享者，人对于人失去了意义，于是人对人也就失去了兴趣。”^([\[21\]](#txt009.html#footnote_content_txt009_21))


    人工智能时代以人类中心主义为基础构建的价值体系遭到质疑和冲击。“动物权利论”“机器人权利论”崛起，多元价值体系思潮甚嚣尘上，陷入价值虚无主义的困境。不可否认，极端的人类中心主义存在弊端。但是，进行冷静的理性思考后不难发现，所谓的动物权利、机器权利不过是人类综合考量短期利益和长期利益、个体利益与整体利益的结果，其根本还是为了人类利益。人工智能时代的种种不确定性使得我们必须重申并强调人文主义、人本主义的重要性。因为很难想象作为类存在的具有独立意识的人工智能会一直保持利他状态，服从和服务于人类。以人为终极价值理念的思想在人工智能时代需要强调而不是弱化。


    #### （二）法律价值体系再思考


    法律价值是对法律现实进行总结、凝练和抽象的结果，它蕴含着主体对法律的美好期待，具有目标指引的功能。法律价值具有鲜明的时代性特征。吴汉东教授将人工智能时代的法律价值分为一般法价值与特别法价值两个层面，其中人工智能法律的特别价值“主要是安全、创新和和谐”^([\[22\]](#txt009.html#footnote_content_txt009_22))。人工智能时代民事法律责任规则设计需要着重考虑安全、创新、和谐和自由等法律价值。


    ##### 1. 安全价值


    “安全是人工智能时代的核心法价值。”^([\[23\]](#txt009.html#footnote_content_txt009_23))人工智能技术未来发展的不确定性影响社会秩序。人工智能超越人类智能的可能性、人工智能产生的危害后果的严重性以及人工智能技术本身内在的不确定性，这些因素足以构成法律以及其他法律规范防止风险的必要性。^([\[24\]](#txt009.html#footnote_content_txt009_24))人工智能时代安全价值的实现需要依赖集体理性构筑人类命运共同体。个体理性行为的总和并不简单等同于集体理性行为，有时候甚至是集体非理性行为。人类首先需要一种世界宪法以及运行世界宪法的世界政治体系，否则无法解决人类的集体理性问题。^([\[25\]](#txt009.html#footnote_content_txt009_25))


    ##### 2. 创新价值


    “创新是人工智能法律的价值灵魂。”^([\[26\]](#txt009.html#footnote_content_txt009_26))人工智能科学与技术进步是一个不断被证伪的过程，不能让法律制度成为限制科学和技术进步的牢笼。对人工智能技术的研发与应用进行监管是必要的，但是，监管应当适时、适度。“早期的技术研发需要宽松的土壤以满足科学家无尽的想象力，过早地介入无异于将技术扼杀在摇篮里。”^([\[27\]](#txt009.html#footnote_content_txt009_27))


    人工智能法律规则设计需要在安全与创新价值之间寻求平衡。技术进步的步伐不可阻挡，人类无力拒绝技术变革营造的新世界。但是，技术变革应当限定在人类可以控制的限度内。狂热冒进不如冷静审慎。但是，法律又不能过于保守，需要为创新预留空间，不能成为创新的障碍。“在技术发展和社会—经济结构变化缓慢的农业社会和早期工业化社会，这种保守倾向使法律发挥了很好的维持社会稳定的作用。但在人工智能时代，它却使法律滞后于技术和经济的发展，使那些把握先机的人获得了巨大的边际回报。”^([\[28\]](#txt009.html#footnote_content_txt009_28))


    ##### 3. 和谐价值


    “和谐是人工智能时代的终极价值追求。”^([\[29\]](#txt009.html#footnote_content_txt009_29))人工智能对社会生活造成的冲击是全方位和根本性的。社会生活的秩序将经历解构和重构的过程。在新旧秩序更迭的过程中，和谐价值显得弥足珍贵。如何防止或缓和人工智能产品使用者与被替代的劳动者之间发生的激烈冲突、如何平衡人工智能与人类智能之间的关系、如何维持人类在社会生活中的话语权、如何防范人类滥用人工智能产品等问题需要在和谐价值理念下进行思考。


    ##### 4. 自由价值


    在社会资源尚未丰富到按需分配的程度，资源处于排他性占有的情况下，普惠的技术革命带来的未必是福音，而可能是灾难。垄断技术会占有更多的社会资源。技术精英与权力阶层结合，技术彻底重塑世界将导致社会走向专制而非民主，科技时代的奴隶制会随之产生。“自由与必然之间的关系，因人工智能的出现而越发成了一个由社会分层（阶级）决定的事务：越来越少的人享有越来越大的自由，越来越多的人受到越来越强的必然性的束缚。”^([\[30\]](#txt009.html#footnote_content_txt009_30))换言之，技术垄断会造成社会压制。


    总而言之，在技术至上的人工智能时代美化甚至神化人工智能技术、或是丑化甚至妖魔化人工智能技术都属于脱离社会现实的极端化思维方式，并不可取。反思人工智能技术并不必然阻碍人工智能技术的研发和应用，相反能够保障人工智能技术在安全的轨道中前行。这就需要拨开技术的迷雾，祛除对人工智能技术的神化或妖魔化，将关注人本身作为法律的终极价值。人工智能时代人类中心主义遭到质疑和冲击。在人类存在思维方式下，人类是命运休戚相关的共同体，人文主义和人本主义精神在人工智能时代显得尤为重要，在人工智能和人的关系中人类而非人工智能应当且必须占据中心位置，将人类利益作为规则设计的出发点和归宿。


    ### 二、以智能机器（人）有限行为自主性为基础的规则体系设计


    机器智能化程度直接影响智能机器（人）与人的关系，决定其在民事法律责任体系中的基本定位，为责任主体、归责原则、责任形态、责任承担方式等规则设计设定基调。本着“立足现实，着眼未来”的基本思想，当下应当以智能机器（人）有限行为自主性为基础进行民事法律责任规则体系设计，解决现实生活中亟需解决的问题，又为未来规则设计预留空间。^([\[31\]](#txt009.html#footnote_content_txt009_31))


    #### （一）新型民事法律责任一般规则设计


    ①［智能机器（人）的法律定位］智能机器（人）是人类制造的智能化工具，其行为具有完全或局部自主性。


    智能机器（人）不具有独立法律人格，但具有独立意识的除外。


    ②［智能机器（人）的民事责任能力］智能机器（人）不能独立承担民事法律责任，造成的损失由其制造者、保有者或使用者等主体依法承担。


    ③［智能机器（人）登记］智能机器（人）的制造者、保有者或使用者等主体可以向智能机器（人）登记机构申请登记。


    登记的智能机器（人）致人损害的，首先以登记在其名下的财产承担民事法律责任，不足部分由制造者、保有者或使用者依法补充。


    ④［因果关系的认定］智能机器（人）行为与结果之间的因果关系根据智能系统记录的数据的相关性进行判定。


    受害人证明其实际遭受的损害与智能机器（人）的行为之间存在事实上的因果关系即可。


    生产和使用智能机器（人）的过程中，需要强制操作留痕和定期报告。智能机器（人）的制造者、保有者或使用者能够证明损害结果是因不可预见的智能机器（人）的行为导致的，智能机器（人）行为与致害结果之间的因果关系被切断。智能机器（人）基于学习算法而作出的自主决策和行为不属于不可预见的行为。


    ⑤［以智能机器（人）为联结点的责任承担方式］智能机器（人）导致损害的民事责任承担方式限于财产形式，包括缴出赔偿、召回和销毁智能机器（人）、支付赔偿金等。


    ⑥［智能机器（人）保险］国家推行智能机器（人）强制责任保险制度。智能机器（人）的制造者或保有者必须为在公共领域使用且具有一定规格物理外观的智能机器（人）投保第三者责任保险。


    国家鼓励商业保险公司探索和开展智能机器（人）损失保险、商业责任保险业务。


    ⑦［智能机器（人）责任基金］智能机器（人）的设计者、制造者和保有者等主体根据设计、制造和保有智能机器（人）的数量或价值向智能机器（人）基金组织交纳费用，形成责任基金。


    智能机器（人）致人损害，但无法确认责任主体或责任主体无力承担责任时，责任基金起到补充救济受害人的作用。


    #### （二）新型侵权法律责任规则设计


    ①［高度危险来源占有人责任］智能机器（人）因设计特性或系统参数而导致行为不完全受人类控制并可能导致他人损害时，视为具有高度危险。


    智能机器（人）的占有人对智能机器（人）自主行为致人损害需要承担民事法律责任。这里的占有人包括合法占有人和非法占有人。


    ②［管理人责任］智能机器（人）致人损害，而其管理人未尽到管理义务的，需要承担民事法律责任。


    ③［产品责任］生产智能机器（人）应当符合国家标准、行业标准以及消费者的合理预期，不存在致人损害的不合理危险。智能机器（人）产品存在缺陷的，制造者承担产品责任。


    算法缺陷，是指设计者设计的算法存在致人损害的不合理风险。因算法缺陷致人损害的，由制造者承担产品责任。算法设计者故意设计缺陷算法致人损害的，承担连带责任。


    ④［算法的可解释性］智能机器（人）的制造者、保有人和使用人负有解释算法的义务，其不得以算法不可解释为由主张免除责任。


    ⑤［免责事由］智能机器（人）的制造者无需对制造智能机器（人）当时科学技术水平无法发现的缺陷承担责任。


    #### （三）智能驾驶中法律责任规则设计


