    # 第五章　人工智能时代新型侵权责任规则


    “一般来讲，当一项新技术出现时，侵权责任索赔将会增加。”^([\[1\]](#txt006.html#footnote_content_txt006_1))人工智能在社会生活中的应用（如无人驾驶机动车运输货物、无人机高空拍摄、智能机器人伴读、工业机器人参与生产线作业）越来越广泛，侵权责任产生的可能性随之增加。人工智能产品侵权责任在整个民事法律责任体系中所占比重越来越大，以至于有学者将人工智能民事法律责任与侵权责任混同，认为“人工智能所涉及的民事责任通常表现为，智能机器人、自动驾驶汽车等人工智能产品侵害人身或财产而引起的侵权责任”^([\[2\]](#txt006.html#footnote_content_txt006_2))。


    机器自主学习能力的不断增强使人类对人工智能的行为或决策越来越不可预见。“人工智能之侵权行为与以往利用计算机所为之侵权行为的本质区别在于：人在侵权行为中所起到的作用不同，利用计算机所为的侵权行为，计算机完全听命于人的操作指令，完全系该指示人从事侵权行为的工具。而人工智能基于机器学习和深度学习，已经能够自行判断、收集和学习新的数据。”^([\[3\]](#txt006.html#footnote_content_txt006_3))目前，被视为物的人工智能产品被纳入传统侵权责任法律规范体系中予以调整并经由司法程序形成具有指导性或引导性的案例以及不成文的规则。但若智能机器（人）的自主性、创造性行为突破了人类对智能机器（人）的工具性假设，智能机器（人）就不同于普通的机器或工具，它不仅可以经程序设计独立从事重复性的活动，而且可能创设人类设计程序之外的新程序。传统侵权责任法律规范体系对人工智能产品的调整作用有限，人工智能自主行为造成的损害难以被纳入传统的侵权责任法律框架，实有必要反思和构建人工智能时代新型侵权责任规则。


    ## 第一节　人工智能时代侵权责任的归责原则


    归责原则是侵权责任人承担民事责任的基础。我国《民法典》“侵权责任编”中的归责原则体系由过错责任原则和无过错责任原则共同构建。^([\[4\]](#txt006.html#footnote_content_txt006_4))其中，过错责任原则是侵权责任法归责原则体系中的主体，无过错责任原则是过错责任原则的补充。“在近代法中，过错与侵权是同一的。无过错责任则是工业化的产物，是法定的个别规则。”^([\[5\]](#txt006.html#footnote_content_txt006_5))换言之，在法律没有明确规定适用无过错责任原则的情况下均适用过错责任原则。


    ### 一、过错责任原则


    过错是对人的主观心理状态的描述，过错责任原则强调行为主体的主观状态。判断是否有过错通常采用理性人标准。理性人能否合理预见其决策或行为的后果是判断主体是否存在过错进而确定其是否应当承担过错责任的基础。“如果应预见而没有预见，行为人就具有过错，应该对此种行为承担责任。如果受害人没有预见，这就可以减免侵权人责任。”^([\[6\]](#txt006.html#footnote_content_txt006_6))


    #### （一）智能机器（人）承担过错责任存在的疑问


    智能机器（人）是否具备独立的法律主体地位是探讨过错责任原则能否适用于智能机器（人）的前提条件。将过错责任原则引入智能机器（人）导致的侵权责任体系，首先需要明确存在过错的主体，即谁之过错？2016
    年联合国教科文组织通过的《关于机器人伦理的初步草案报告》将人工智能系统或设备定性为产品，通过产品责任制度解决人工智能系统或设备导致的侵权损害赔偿问题。倘若智能机器（人）被定位为产品，并没有独立的民事主体地位，则过错无可依附，更无所谓智能机器（人）是否存在主观过错以及其是否需要为此过错承担责任的问题。即便认定智能机器（人）存在过错，需要承担法律责任，因其无独立的法律地位和财产也无法对受害者予以救济。


    #### （二）智能机器（人）使用者承担过错责任存在的疑问


    在对人工智能产品进行常态使用的情况下，具有智能特征的人工智能产品的决策和行为具有相对自主性，使用者既不需要直接操控人工智能产品，也不需要根据周边环境对其决策或行为进行干预。使用者的注意义务被淡化甚至消失，成为不存在主观过错的“无辜者”。“人工智能实现了无人化的操作，导致其使用者不再负有主观上的注意义务，使得过错归责原则最终变得无所适从。”^([\[7\]](#txt006.html#footnote_content_txt006_7))


    #### （三）智能机器（人）销售者承担过错责任存在的疑问


    《产品质量法》第 42 条以及《民法典》第 1203 条规定销售者对产品缺陷承担过错责任。根据上述规定，智能机器（人）的销售者需要承担其在销售过程中因过错导致的侵权责任。“销售者的过错责任主要表现为进货检查与验收不当、验明合格证明或标识不当以及保持产品质量不当等方面”。^([\[8\]](#txt006.html#footnote_content_txt006_8))关于智能机器（人）销售者的过错如何判断、对应的责任如何承担等问题的答案尚不明确。


    ### 二、无过错责任原则


    无过错责任原则起源于资本主义时期。机器的大规模出现和运用使机器事故频发而受害者无法得到救济的情况普遍存在，无过错责任原则应运而生。我国《产品质量法》第 41
    条以及《民法典》第 1202 条明确规定生产者对产品缺陷承担无过错责任。人工智能时代客观归责替代主观归责成为一种发展趋势。“以过错责任为基础建立的‘风险分配’责任体系，在未来的交通法规中将不复存在。对于交通事故的认定，其归责事由只有结果的‘对与错’，而无主观上的‘故意’或‘过失’。”^([\[9\]](#txt006.html#footnote_content_txt006_9))在无过错责任的框架下，受害人仅需证明智能机器（人）的行为或决策与损害结果之间存在因果关系即可，至于主观过错并非所问。另有学者主张区分情形限定无过错责任原则的适用范围，如根据智能机器人是否通过审批程序进而确定归责原则。“对于通过监管机构审批的智能机器人，制造商实质上将只承担有限的侵权责任……对于没有经过审批的人工智能系统，制造商等法律主体应当承担严格责任，而且该责任是连带的”。^([\[10\]](#txt006.html#footnote_content_txt006_10))


    关于智能机器（人）致人损害适用无过错责任原则的正当理由问题在认识上存在分歧。有学者认为：“但智能机器人的严格责任的出发点不是‘异常危险’或者‘不合理危险’。”^([\[11\]](#txt006.html#footnote_content_txt006_11))有必要从权利救济、风险预防与分散、交易成本、事实查明等角度分析人工智能时代适用无过错责任原则的正当理由。


    #### （一）为无过错的受害人提供救济：两害相权取其轻


    无过错责任原则关注社会整体利益、社会群体的话语权以及社会秩序。在受害人对遭受的损失不存在过错的情况下，让其对外来之力导致的损害承担责任存在有悖法理之嫌。“在因果链条无法解释的情况下让一个个体自己承担所遭受的损失，与公正、分配正义、风险分担等基本观念背道而驰。”^([\[12\]](#txt006.html#footnote_content_txt006_12))值得注意的是，损失补偿的正当性与损失分配是两个不同的命题。无过错的受害人应当获得救济并不等同于损失赔偿责任必须由智能机器（人）的制造者、所有者或利用者承担。在各方参与主体均不具有可归责的过错时，让无过错的智能机器（人）的制造者、设计者、所有者或利用者承担责任是两害相权取其轻的做法。


    #### （二）风险的预防与分散


    技术更新是一柄双刃剑，一方面，技术更新有利于社会进步和发展；另一方面，技术更新的风险会带来损害。当技术更新作为既定的选择方案时，就需要从社会整体的视角考察不同类型主体控制和分散风险的能力进而配置技术更新产生的风险。智能机器（人）的制造者、所有者或利用者在控制和分散风险方面具有优势。在过错难以判断、责任无法分清的情形下，由部分参与主体承担无过错责任，能够强化该类主体的责任意识，更多地尽到注意义务，预防风险发生。此外，制造者、所有者或利用者能够通过定价等方式分散损失。即便智能机器（人）的行为具有一定的自主性，该自主性也是由设计者、生产者设定的目的所决定的。“若设计者、生产者出于善意设计、制造的智能机器人侵犯了他人的权益，他人无须证明智能机器人过错与否，即应以‘无过错责任’对智能机器人予以归责。”^([\[13\]](#txt006.html#footnote_content_txt006_13))


    #### （三）节省交易成本


    '
  toc: []
- raw: '采用无过错责任原则具有节省诉讼成本的优势。智能机器（人）的行为具有专业性、不透明性、不可预测性和难以防控性，“囿于智能机器人的上述特性及设计的高端性和制造结构的复杂性，由被害人来证明人工智能存在过错与否显然不公平，更宜适用无过错责任的归责原则。”^([\[14\]](#txt006.html#footnote_content_txt006_14))也就是说，人工智能技术的复杂性使得当事人就产品缺陷、过错以及因果关系等进行举证的成本较高。尤其是伴随智能技术在社会生活中应用的普及以及人工智能自主性的增强，相关诉讼的数量以及难度呈几何级态势增长，“产品责任诉讼的成本亦将呈指数级增长，与其为律师、专家等投入高昂成本，倒不如更多赔偿受害者。”^([\[15\]](#txt006.html#footnote_content_txt006_15))


    （四）有利于事实查明


    在不同类型的归责原则下，主体的举证义务或责任存在差异，其对查明事实的主动性也有所不同。生产者对人工智能产品的制造过程和运行原理最为了解。侵权行为发生以后，由其举证证明人工智能产品是否存在产品缺陷或产品缺陷与损害结果之间是否存在因果关系有助于查明事实。“这一处理原则导源于生产者作为‘最接近真相’的设计与制造者身份，也是归因于生产者在理解算法或代码等方面的天然优势，有助于解决事实查明之现实困境。”^([\[16\]](#txt006.html#footnote_content_txt006_16))


    从过错责任到无过错责任或严格责任的转变是法律价值观从矫正正义向分配正义转变在法律责任领域的体现。责任归咎从关注过错转向填补损失。无过错责任或严格责任以社会整体利益和实质正义为出发点。但是，也有学者对适用无过错责任表示担忧，认为无过错责任会增加人工智能技术研发和应用的成本，抑制人工智能技术和商业模式的创新。尤其是在人工智能技术和商业模式创新的初期，过于严苛的归责原则是否会对智能技术相关产业造成冲击并阻碍产业发展不无疑问。


    总之，人工智能时代智能机器（人）致害的归责原则问题不是一个纯粹的法律适用问题，而是涉及法政策考量的复杂社会问题。归责原则的研究范式需要实现由非此即彼向情境化思维方式的转变。归责原则是在人工智能技术研发和应用的过程中不同利益群体博弈的结果，其背后是利益分析和政策考量，需要平衡受害人利益与行业发展利益。在当下，比照产品质量责任让人工智能产品制造者等主体承担无过错责任有利于救济受害人，也没有对人工智能行业造成严重冲击。在未来，则需要完善相应的保险制度以及其他配套制度，防止过错责任原则适用范围泛化，保障人工智能产业的持续健康发展。


    第二节　人工智能时代侵权责任的免责事由


    《产品质量法》第41 条第2 款对产品生产者的免责事由进行了规定。^([\[17\]](#txt006.html#footnote_content_txt006_17))这些关于产品生产者免责事由的规定是在前人工智能时代情境下进行思考和设计的结果，在人工智能时代是否仍然具有合理性值得思考。


    一、机器自主学习作为免责事由的正当性分析


    生产者作为技术风险的控制者对技术缺陷承担责任具有正当理由。智能系统基于程序设计自主作出的决策或行为并不违背设计者的初衷，难谓技术缺陷，由此导致的损害由生产者承担责任存在疑问。机器自主学习会导致智能机器（人）的行为或决策偏离人类预期的目的，能否将机器自主学习作为免责事由？


    第一，人工智能系统作出偏离人类预期的行为或决策具有可能性。人工智能系统离不开程序员的计算机编程设计。但是，人工智能系统的行为和决策并不必然是程序员设计的结果。人工智能系统区别于传统机器设备之处在于，人工智能系统的算法不完全依赖于程序员的分步编程。机器学习（machine
    learning）中，算法（algorithm）和模型（model）能够基于数据自主生成新的运行规则，无需程序员的介入或参与。


    智能机器（人）的智能等级分为初始等级和教育等级。同一批次研发或制造的人工智能初始等级相同，但是，在投入流通环节后，智能等级因数据训练不同产生差异。换言之，离开模拟测试环境的人工智能系统能根据社会环境获取新的数据进行训练并形成不同的智能等级。高度自主性的人工智能系统会基于习得的算法设计新的规则，进行自主行为和决策。而这种自主行为和决策往往超出了人脑的认知和反应能力，与人为设计的结果存在偏差。“已经有证据表明高度‘智能’的自主机器可以学习‘打破’规则以保护其自身的生存。”^([\[18\]](#txt006.html#footnote_content_txt006_18))换言之，人工智能系统根据社会环境自主设定规则，进行自我调试的功能使其行为与决策在一定程度上存在不可预测性。


    第二，人工智能系统偏离人类预设的必要性。人工智能系统虽然是由人类研发、制造和生产的，但是人类并不奢望能够预见人工智能系统未来所有的行为或决策。人类与人工智能系统在解决问题的方案设计方面存在差异。人类的计算力极为有限且受到预先设置的“前见”或“前理解”的限制，如经验、习惯、陈规、传统智慧等。因而，人类在方案设计方面具有一定的局限性。以算法和模型为基础的人工智能依靠计算机的超强算力往往能考虑得更为全面，能够选择人类没有考虑到的问题解决方案。人工智能系统的行为或决策的不可预见性在一定的情况下正是设计者所期望的。如在智能驾驶的场景中，测试环境并不能穷尽所有的现实可能性，当异常情况（novel
    situation）出现时，自动驾驶汽车必须在缺乏预先设定的规则的情况下，依据自己创建的规则，真正独立自主地作出决策。^([\[19\]](#txt006.html#footnote_content_txt006_19))


    若产品投入流通领域之前，在测试环境下人工智能并不存在产品缺陷；产品投入流通领域之后，在新的社会环境中出现偏离人类预期目的的行为或决策，生产者能否以《产品质量法》第41
    条第2 款第2 项主张免责？“究竟是算法自身缺陷引起了侵害？还是人工智能系统基于算法而自主实施了侵害？这两类事实将产生迥然不同的法律后果，前者导致生产者对算法缺陷承担严格责任，后者则使生产者摆脱了责任。”^([\[20\]](#txt006.html#footnote_content_txt006_20))值得注意的是，由于人工智能技术的复杂性使得人工智能产品生产者相对于普通产品生产者更容易证明智能机器（人）行为的自主性。这就有必要区分生产者可预见的自主行为或决策和生产者不可预见的自主行为或决策并以此确定免责事由。生产者需要就其对不可预见的智能机器（人）的自主行为或决策举证，司法裁判中需要辅以专家证人制度。


    二、“事故不可解释性”作为免责事由的正当性分析


    机器深度学习（deep learning）将创建规则的权力从人类程序员转移至学习算法（learning algorithm）。学习算法在数据训练的基础上创设规则，形成模型。算法是确定的、可被理解的，但是模型的决策逻辑未必具有确定性和可被理解性。人工智能系统生产者能否以“事故不可解释”为由主张免责？事故具有可解释性（interpretability）是合理划分责任的前提。“事故不可解释”使缺陷本身以及缺陷产生的时间是投入流通之前还是之后等问题难以判断，生产者能否基于《产品质量法》第41
    条第2 款第2 项主张免责不无疑问。


    首先，基于“事故不可解释”免责需要以智能机器（人）行为或决策的透明性为前提。决策的可追溯性要求其过程透明，英国下议院科学和技术委员会发布的报告《机器人与人工智能》（Robotics
    and Artificial Intelligence）强调人工智能决策透明化与安全价值之间的关系。该报告认为，人工智能决策透明化有利于对其进行管控，尤其是在关系到人类生命安全的领域，决策透明化显得尤为重要。


    其次，“事故不可解释”并不意味着免除了人工智能产品生产者解释算法的义务。解密算法需要专业知识并耗费一定的成本，通过设定义务和责任推定规则的方式将该义务或责任施加给人工智能产品的生产者具有合理性。“在发生可疑后果的时候要求程序员用自然语言来解释算法的设计原理，并且追究其相关责任，这显然是一种治本之法。”^([\[21\]](#txt006.html#footnote_content_txt006_21))通过解释算法证明算法是在被合理应用的情况下仍然发生了不可解释的事故，生产者方能依“事故不可解释”免责。


    三、技术中立作为免责事由的正当性分析


    因技术本身产生的责任，适用技术中立原则，智能机器（人）的生产者无需承担法律责任。有学者质疑技术中立不过是一种假象。数据分析和决策与人的主观性相关，创构是将预期结果转变为现实的过程，其目的是满足人的需要，各种因素之间的比例关系正是由人来调整的。这就需要区分纯粹技术设计和目的性技术设计，并将目的性技术设计细分为合法性设计和非法性设计。倘若设计人工智能技术的目的是从事侵权或其他违法活动，则不适用技术中立原则。“在替代责任情形中，机器人本无瑕疵，符合技术中立原则要求，但机器人的所有人或使用人，或不尽善良管理人之义务，或放任机器人的侵权行为，则不能以技术中立原则免除责任。”^([\[22\]](#txt006.html#footnote_content_txt006_22))


    四、发展风险作为免责事由的正当性分析


    学习算法（learning algorithm）不同于编码算法（coded algorithm），它会根据输入数据生成人类程序设计者未曾预料到的新算法进而作出决策或行为。因学习算法自主生成的程序导致发生损害是否适用发展风险抗辩？有学者认为：“如果将其定义为设计缺陷将极大地阻碍技术进步，故也可以有条件地适用发展风险抗辩原则，坚持以可责难性评价为前提。”^([\[23\]](#txt006.html#footnote_content_txt006_23))为促进技术进步，法律允许新型技术的研发和应用主体基于开发风险主张抗辩。倘若缺陷是依现有技术不可知的，则生产者可以主张发展风险抗辩（the
    development risk clause）。发展风险抗辩关注缺陷的可识别性，生产者主张发展风险抗辩以其依当时的技术条件对技术缺陷不可知为前提，至于该缺陷是否能够避免并非所问。


    否认发展风险抗辩作为免责事由正当性的观点认为，风险承担与利益分配呈正相关关系，生产者将产品投入流通领域获得了利益，就需要承担相应的风险。发展风险抗辩使生产者承担的风险与获取的利益之间的关系失衡。否定说表面上有一定的合理性，但是考虑到生产者预期收益的有限性与风险责任的无限性，该说难以成立。发展风险抗辩具有鼓励技术创新，消除生产者应用新型技术顾虑的作用，反之，禁止发展风险抗辩可能阻碍技术创新和应用。“发展风险抗辩制度将促使在发展风险上形成生产者和消费者之双边预防模式，从而激励双方当事人共同内部化风险防控成本，而这显然比生产者单边预防模式更能降低整体上的社会风险控制成本。”^([\[24\]](#txt006.html#footnote_content_txt006_24))


    从绝对安全到合理安全的转变是综合考量生产者或行业利益与消费者利益的结果，发展风险抗辩是平衡安全与效率的调节器。进入流通领域的产品需要满足安全的需要，但是这一需要不能过度，否则会严重影响效率价值的实现。过高的安全门槛，在排除社会风险的同时也排除了创新性产品的效用。在鼓励技术创新的同时需要合理保障消费者的权益，这正是将发展风险抗辩作为免责事由的正当性理由。


    判断依当时科学技术水平能否发现缺陷需要遵循客观标准而非主观标准，即依据当时整体的科学技术水平，而非生产者主观上认知的科学技术水平。推定生产者已知当时整体的科学技术水平，能够督促生产者全面了解和掌握当时的科学技术水平，又不苛责其100%保证技术安全。


    发展风险抗辩需要满足消费者合理期待原则的要求。例如，出行安全是选择智能驾驶方式的消费者的合理期待，发展风险抗辩不能作为提供不安全出行服务的借口。“因系统泄漏或数据采集不完整等原因导致的不可预测性风险可以作为无人驾驶汽车产业内在的风险成本，溢出的负外部性风险可以通过生产者担责的方式进行内化，以期为受害者的救济提供更为安全的基本保障。”^([\[25\]](#txt006.html#footnote_content_txt006_25))这一目的在封闭的私法体系中难以实现，需要借助公权力主导的监管和审批制度。


    关于人工智能产品发展风险抗辩的举证，根据2008 年最高人民法院《关于民事诉讼证据的若干规定》第4 条第6 项的规定，在产品缺陷侵权责任诉讼案件中，生产者就免责事由负有举证责任，因此发展风险抗辩的举证责任应由生产者承担。生产者需要证明“当时科技水平无法发现该缺陷”。而要达到这一证明目的，人工智能产品的生产者通常需要证明其产品当时在安全性上不次于同类产品，没有更为安全的替代方案。实践中，要生产者就此举证比较困难，基于诉讼风险和诉讼成本的考虑，生产者更倾向于径先以产品无缺陷、受害人存在过错等事由对抗责任成立，而甚少援引举证难度较高且相关规则不明的第41
    条第2 款第3 项为抗辩，使得其实质上成为一个“沉睡”条款。^([\[26\]](#txt006.html#footnote_content_txt006_26))


    第三节　智能驾驶侵权责任问题研究


    智能驾驶汽车是人工智能技术在机动车驾驶领域的应用和推广。人工智能感知和识别系统取代了人类驾驶员的眼睛和耳朵，分析不同情境下的路况和环境并作出决策。“自动驾驶汽车（Autonomous
    Vehicle）已经不再是《少数人报告》《我，机器人》等科幻电影中的概念，谷歌、丰田、尼桑、奥迪、特斯拉等汽车制造商正在将其变为现实。”^([\[27\]](#txt006.html#footnote_content_txt006_27))


    智能驾驶汽车是人工智能技术应用于社会生活较早和较为成熟的项目。它的出现引发了交通运输产业颠覆性的变革，是产业结构升级的突破口和新的经济增长点，受到发达国家的追捧。是否将自动驾驶作为道路交通法的调整对象成为当代社会评判法律制度先进与否的标准。《德国道路交通法》修改后明确允许自动驾驶汽车上路，该修改案被德国联邦交通部部长誉为“世界上最先进的《道路交通法》”^([\[28\]](#txt006.html#footnote_content_txt006_28))。


    “智能算法操纵的汽车早已默默上路，正在与人类司机驾驶的汽车互动。事故早已先于规则出现。”^([\[29\]](#txt006.html#footnote_content_txt006_29))“谷歌无人驾驶汽车与公交车发生碰撞”“特拉斯ModelS
    因错误识别致车主约书亚·布朗死亡”“奔驰汽车定速巡航失灵”“优步无人驾驶汽车致依莱·恩赫茨伯格死亡”“特拉斯ModelS 爆炸起火致人死亡”等一系列智能驾驶致害事件表明构建并完善相关民事法律责任规则十分必要。


    “关于人工智能责任制度的讨论，目前主要集中在自动驾驶汽车以及谁应当为自动驾驶汽车发生的故障和事故负责方面，尤其是自动驾驶汽车做出独立智能决策导致损害发生的情况下，将会面临更多的法律难题。”^([\[30\]](#txt006.html#footnote_content_txt006_30))学者研究智能驾驶侵权责任规则体系的热情高涨，认为“必须尽快启动立法程序，对自动驾驶技术引发的一系列问题进行调查研究，最终制定专门法律《自动驾驶汽车法》”^([\[31\]](#txt006.html#footnote_content_txt006_31))。但也有学者冷静地认为制定关于智能驾驶的侵权责任规则体系的时机尚不成熟，“要针对自动驾驶汽车的致损事故制定出明晰且稳定的侵权责任体系，很明显是为时尚早”^([\[32\]](#txt006.html#footnote_content_txt006_32))。


    一、从禁止到有限许可的智能驾驶


    （一）人类驾驶员作为单一驾驶主体的阶段


    驾驶行为关系到人的生命安全，也存在影响公共安全的风险因素。在人工智能技术无法保障公众安全的情况下，无人驾驶被严厉禁止。1968 年，联合国制定的《维也纳道路交通公约》明确规定控制汽车的应当是人而不是计算机，该公约第8
    条载明：“凡行驶的车辆或车辆组合必须有一名驾驶人。”^([\[33\]](#txt006.html#footnote_content_txt006_33))智能驾驶技术应用于实践后，联合国仍然对此持审慎的态度，“当车速超过10
    公里／小时，汽车的自动转向功能就应当被自动禁用，该规定极大地限制了汽车自动转向系统，特别是变道辅助和车道保持辅助系统在智能汽车上的应用。”^([\[34\]](#txt006.html#footnote_content_txt006_34))


    《中华人民共和国道路交通安全法》（以下简称《道路交通安全法》）中规定的驾驶员是否应当限定在自然人的范围内？无论是从文意解释、目的解释还是历史解释的角度出发，《道路交通安全法》中规定的驾驶员都应当被解释为自然人。“从国家法律层面讲，自动驾驶汽车道路测试合法化的问题仍然处于灰色地带，就自动驾驶汽车发展的速度来看，急需国家层面的法律法规来对整个自动驾驶行业进行引导和规制，因为没有任何无人驾驶系统能够做到始终完美可靠。”^([\[35\]](#txt006.html#footnote_content_txt006_35))


    （二）驾驶主体多元化阶段


    智能驾驶具有100%的安全性是人们美好的愿望。“然而事实是，如果需要完美的安全可靠性，无人驾驶汽车将永远不会获得合法地位，因为没有任何无人驾驶系统能够做到始终完美可靠。”^([\[36\]](#txt006.html#footnote_content_txt006_36))智能驾驶系统具有与人类驾驶员同等甚至更高的安全系数即可。传统驾驶事故产生的主要原因出在驾驶员身上，如驾驶员疲劳驾驶、注意力不集中、心绪不宁，从这一方面看，智能驾驶提升了行车的安全性。随着人工智能技术的进步与发展，智能驾驶汽车的安全性能得到改善，禁止智能驾驶汽车上路的限制性规定的正当性被动摇。'
  fmt: '

    采用无过错责任原则具有节省诉讼成本的优势。智能机器（人）的行为具有专业性、不透明性、不可预测性和难以防控性，“囿于智能机器人的上述特性及设计的高端性和制造结构的复杂性，由被害人来证明人工智能存在过错与否显然不公平，更宜适用无过错责任的归责原则。”^([\[14\]](#txt006.html#footnote_content_txt006_14))也就是说，人工智能技术的复杂性使得当事人就产品缺陷、过错以及因果关系等进行举证的成本较高。尤其是伴随智能技术在社会生活中应用的普及以及人工智能自主性的增强，相关诉讼的数量以及难度呈几何级态势增长，“产品责任诉讼的成本亦将呈指数级增长，与其为律师、专家等投入高昂成本，倒不如更多赔偿受害者。”^([\[15\]](#txt006.html#footnote_content_txt006_15))


    ## (四) 有利于事实查明


    在不同类型的归责原则下，主体的举证义务或责任存在差异，其对查明事实的主动性也有所不同。生产者对人工智能产品的制造过程和运行原理最为了解。侵权行为发生以后，由其举证证明人工智能产品是否存在产品缺陷或产品缺陷与损害结果之间是否存在因果关系有助于查明事实。“这一处理原则导源于生产者作为‘最接近真相’的设计与制造者身份，也是归因于生产者在理解算法或代码等方面的天然优势，有助于解决事实查明之现实困境。”^([\[16\]](#txt006.html#footnote_content_txt006_16))


    从过错责任到无过错责任或严格责任的转变是法律价值观从矫正正义向分配正义转变在法律责任领域的体现。责任归咎从关注过错转向填补损失。无过错责任或严格责任以社会整体利益和实质正义为出发点。但是，也有学者对适用无过错责任表示担忧，认为无过错责任会增加人工智能技术研发和应用的成本，抑制人工智能技术和商业模式的创新。尤其是在人工智能技术和商业模式创新的初期，过于严苛的归责原则是否会对智能技术相关产业造成冲击并阻碍产业发展不无疑问。


    总之，人工智能时代智能机器（人）致害的归责原则问题不是一个纯粹的法律适用问题，而是涉及法政策考量的复杂社会问题。归责原则的研究范式需要实现由非此即彼向情境化思维方式的转变。归责原则是在人工智能技术研发和应用的过程中不同利益群体博弈的结果，其背后是利益分析和政策考量，需要平衡受害人利益与行业发展利益。在当下，比照产品质量责任让人工智能产品制造者等主体承担无过错责任有利于救济受害人，也没有对人工智能行业造成严重冲击。在未来，则需要完善相应的保险制度以及其他配套制度，防止过错责任原则适用范围泛化，保障人工智能产业的持续健康发展。


    ## 第二节　人工智能时代侵权责任的免责事由


    《产品质量法》第41 条第2 款对产品生产者的免责事由进行了规定。^([\[17\]](#txt006.html#footnote_content_txt006_17))这些关于产品生产者免责事由的规定是在前人工智能时代情境下进行思考和设计的结果，在人工智能时代是否仍然具有合理性值得思考。


    ### 一、机器自主学习作为免责事由的正当性分析


    生产者作为技术风险的控制者对技术缺陷承担责任具有正当理由。智能系统基于程序设计自主作出的决策或行为并不违背设计者的初衷，难谓技术缺陷，由此导致的损害由生产者承担责任存在疑问。机器自主学习会导致智能机器（人）的行为或决策偏离人类预期的目的，能否将机器自主学习作为免责事由？


    #### 第一，人工智能系统作出偏离人类预期的行为或决策具有可能性。


    人工智能系统作出偏离人类预期的行为或决策具有可能性。人工智能系统离不开程序员的计算机编程设计。但是，人工智能系统的行为和决策并不必然是程序员设计的结果。人工智能系统区别于传统机器设备之处在于，人工智能系统的算法不完全依赖于程序员的分步编程。机器学习（`machine
    learning`）中，算法（`algorithm`）和模型（`model`）能够基于数据自主生成新的运行规则，无需程序员的介入或参与。


    智能机器（人）的智能等级分为初始等级和教育等级。同一批次研发或制造的人工智能初始等级相同，但是，在投入流通环节后，智能等级因数据训练不同产生差异。换言之，离开模拟测试环境的人工智能系统能根据社会环境获取新的数据进行训练并形成不同的智能等级。高度自主性的人工智能系统会基于习得的算法设计新的规则，进行自主行为和决策。而这种自主行为和决策往往超出了人脑的认知和反应能力，与人为设计的结果存在偏差。“已经有证据表明高度‘智能’的自主机器可以学习‘打破’规则以保护其自身的生存。”^([\[18\]](#txt006.html#footnote_content_txt006_18))换言之，人工智能系统根据社会环境自主设定规则，进行自我调试的功能使其行为与决策在一定程度上存在不可预测性。


    #### 第二，人工智能系统偏离人类预设的必要性。


    人工智能系统偏离人类预设的必要性。人工智能系统虽然是由人类研发、制造和生产的，但是人类并不奢望能够预见人工智能系统未来所有的行为或决策。人类与人工智能系统在解决问题的方案设计方面存在差异。人类的计算力极为有限且受到预先设置的“前见”或“前理解”的限制，如经验、习惯、陈规、传统智慧等。因而，人类在方案设计方面具有一定的局限性。以算法和模型为基础的人工智能依靠计算机的超强算力往往能考虑得更为全面，能够选择人类没有考虑到的问题解决方案。人工智能系统的行为或决策的不可预见性在一定的情况下正是设计者所期望的。如在智能驾驶的场景中，测试环境并不能穷尽所有的现实可能性，当异常情况（`novel
    situation`）出现时，自动驾驶汽车必须在缺乏预先设定的规则的情况下，依据自己创建的规则，真正独立自主地作出决策。^([\[19\]](#txt006.html#footnote_content_txt006_19))


    若产品投入流通领域之前，在测试环境下人工智能并不存在产品缺陷；产品投入流通领域之后，在新的社会环境中出现偏离人类预期目的的行为或决策，生产者能否以《产品质量法》第41
    条第2 款第2 项主张免责？“究竟是算法自身缺陷引起了侵害？还是人工智能系统基于算法而自主实施了侵害？这两类事实将产生迥然不同的法律后果，前者导致生产者对算法缺陷承担严格责任，后者则使生产者摆脱了责任。”^([\[20\]](#txt006.html#footnote_content_txt006_20))值得注意的是，由于人工智能技术的复杂性使得人工智能产品生产者相对于普通产品生产者更容易证明智能机器（人）行为的自主性。这就有必要区分生产者可预见的自主行为或决策和生产者不可预见的自主行为或决策并以此确定免责事由。生产者需要就其对不可预见的智能机器（人）的自主行为或决策举证，司法裁判中需要辅以专家证人制度。


    ### 二、“事故不可解释性”作为免责事由的正当性分析


    机器深度学习（`deep learning`）将创建规则的权力从人类程序员转移至学习算法（`learning algorithm`）。学习算法在数据训练的基础上创设规则，形成模型。算法是确定的、可被理解的，但是模型的决策逻辑未必具有确定性和可被理解性。人工智能系统生产者能否以“事故不可解释”为由主张免责？事故具有可解释性（`interpretability`）是合理划分责任的前提。“事故不可解释”使缺陷本身以及缺陷产生的时间是投入流通之前还是之后等问题难以判断，生产者能否基于《产品质量法》第41
    条第2 款第2 项主张免责不无疑问。


    首先，基于“事故不可解释”免责需要以智能机器（人）行为或决策的透明性为前提。决策的可追溯性要求其过程透明，英国下议院科学和技术委员会发布的报告《机器人与人工智能》（`Robotics
    and Artificial Intelligence`）强调人工智能决策透明化与安全价值之间的关系。该报告认为，人工智能决策透明化有利于对其进行管控，尤其是在关系到人类生命安全的领域，决策透明化显得尤为重要。


    其次，“事故不可解释”并不意味着免除了人工智能产品生产者解释算法的义务。解密算法需要专业知识并耗费一定的成本，通过设定义务和责任推定规则的方式将该义务或责任施加给人工智能产品的生产者具有合理性。“在发生可疑后果的时候要求程序员用自然语言来解释算法的设计原理，并且追究其相关责任，这显然是一种治本之法。”^([\[21\]](#txt006.html#footnote_content_txt006_21))通过解释算法证明算法是在被合理应用的情况下仍然发生了不可解释的事故，生产者方能依“事故不可解释”免责。


    ### 三、技术中立作为免责事由的正当性分析


    因技术本身产生的责任，适用技术中立原则，智能机器（人）的生产者无需承担法律责任。有学者质疑技术中立不过是一种假象。数据分析和决策与人的主观性相关，创构是将预期结果转变为现实的过程，其目的是满足人的需要，各种因素之间的比例关系正是由人来调整的。这就需要区分纯粹技术设计和目的性技术设计，并将目的性技术设计细分为合法性设计和非法性设计。倘若设计人工智能技术的目的是从事侵权或其他违法活动，则不适用技术中立原则。“在替代责任情形中，机器人本无瑕疵，符合技术中立原则要求，但机器人的所有人或使用人，或不尽善良管理人之义务，或放任机器人的侵权行为，则不能以技术中立原则免除责任。”^([\[22\]](#txt006.html#footnote_content_txt006_22))


    ### 四、发展风险作为免责事由的正当性分析


    学习算法（`learning algorithm`）不同于编码算法（`coded algorithm`），它会根据输入数据生成人类程序设计者未曾预料到的新算法进而作出决策或行为。因学习算法自主生成的程序导致发生损害是否适用发展风险抗辩？有学者认为：“如果将其定义为设计缺陷将极大地阻碍技术进步，故也可以有条件地适用发展风险抗辩原则，坚持以可责难性评价为前提。”^([\[23\]](#txt006.html#footnote_content_txt006_23))为促进技术进步，法律允许新型技术的研发和应用主体基于开发风险主张抗辩。倘若缺陷是依现有技术不可知的，则生产者可以主张发展风险抗辩（`the
    development risk clause`）。发展风险抗辩关注缺陷的可识别性，生产者主张发展风险抗辩以其依当时的技术条件对技术缺陷不可知为前提，至于该缺陷是否能够避免并非所问。


    否认发展风险抗辩作为免责事由正当性的观点认为，风险承担与利益分配呈正相关关系，生产者将产品投入流通领域获得了利益，就需要承担相应的风险。发展风险抗辩使生产者承担的风险与获取的利益之间的关系失衡。否定说表面上有一定的合理性，但是考虑到生产者预期收益的有限性与风险责任的无限性，该说难以成立。发展风险抗辩具有鼓励技术创新，消除生产者应用新型技术顾虑的作用，反之，禁止发展风险抗辩可能阻碍技术创新和应用。“发展风险抗辩制度将促使在发展风险上形成生产者和消费者之双边预防模式，从而激励双方当事人共同内部化风险防控成本，而这显然比生产者单边预防模式更能降低整体上的社会风险控制成本。”^([\[24\]](#txt006.html#footnote_content_txt006_24))


    从绝对安全到合理安全的转变是综合考量生产者或行业利益与消费者利益的结果，发展风险抗辩是平衡安全与效率的调节器。进入流通领域的产品需要满足安全的需要，但是这一需要不能过度，否则会严重影响效率价值的实现。过高的安全门槛，在排除社会风险的同时也排除了创新性产品的效用。在鼓励技术创新的同时需要合理保障消费者的权益，这正是将发展风险抗辩作为免责事由的正当性理由。


    判断依当时科学技术水平能否发现缺陷需要遵循客观标准而非主观标准，即依据当时整体的科学技术水平，而非生产者主观上认知的科学技术水平。推定生产者已知当时整体的科学技术水平，能够督促生产者全面了解和掌握当时的科学技术水平，又不苛责其100%保证技术安全。


    发展风险抗辩需要满足消费者合理期待原则的要求。例如，出行安全是选择智能驾驶方式的消费者的合理期待，发展风险抗辩不能作为提供不安全出行服务的借口。“因系统泄漏或数据采集不完整等原因导致的不可预测性风险可以作为无人驾驶汽车产业内在的风险成本，溢出的负外部性风险可以通过生产者担责的方式进行内化，以期为受害者的救济提供更为安全的基本保障。”^([\[25\]](#txt006.html#footnote_content_txt006_25))这一目的在封闭的私法体系中难以实现，需要借助公权力主导的监管和审批制度。


    关于人工智能产品发展风险抗辩的举证，根据2008 年最高人民法院《关于民事诉讼证据的若干规定》第4 条第6 项的规定，在产品缺陷侵权责任诉讼案件中，生产者就免责事由负有举证责任，因此发展风险抗辩的举证责任应由生产者承担。生产者需要证明“当时科技水平无法发现该缺陷”。而要达到这一证明目的，人工智能产品的生产者通常需要证明其产品当时在安全性上不次于同类产品，没有更为安全的替代方案。实践中，要生产者就此举证比较困难，基于诉讼风险和诉讼成本的考虑，生产者更倾向于径先以产品无缺陷、受害人存在过错等事由对抗责任成立，而甚少援引举证难度较高且相关规则不明的第41
    条第2 款第3 项为抗辩，使得其实质上成为一个“沉睡”条款。^([\[26\]](#txt006.html#footnote_content_txt006_26))


    ## 第三节　智能驾驶侵权责任问题研究


    智能驾驶汽车是人工智能技术在机动车驾驶领域的应用和推广。人工智能感知和识别系统取代了人类驾驶员的眼睛和耳朵，分析不同情境下的路况和环境并作出决策。“自动驾驶汽车（`Autonomous
    Vehicle`）已经不再是《少数人报告》《我，机器人》等科幻电影中的概念，谷歌、丰田、尼桑、奥迪、特斯拉等汽车制造商正在将其变为现实。”^([\[27\]](#txt006.html#footnote_content_txt006_27))


    智能驾驶汽车是人工智能技术应用于社会生活较早和较为成熟的项目。它的出现引发了交通运输产业颠覆性的变革，是产业结构升级的突破口和新的经济增长点，受到发达国家的追捧。是否将自动驾驶作为道路交通法的调整对象成为当代社会评判法律制度先进与否的标准。《德国道路交通法》修改后明确允许自动驾驶汽车上路，该修改案被德国联邦交通部部长誉为“世界上最先进的《道路交通法》”^([\[28\]](#txt006.html#footnote_content_txt006_28))。


    “智能算法操纵的汽车早已默默上路，正在与人类司机驾驶的汽车互动。事故早已先于规则出现。”^([\[29\]](#txt006.html#footnote_content_txt006_29))“谷歌无人驾驶汽车与公交车发生碰撞”“特拉斯ModelS
    因错误识别致车主约书亚·布朗死亡”“奔驰汽车定速巡航失灵”“优步无人驾驶汽车致依莱·恩赫茨伯格死亡”“特拉斯ModelS 爆炸起火致人死亡”等一系列智能驾驶致害事件表明构建并完善相关民事法律责任规则十分必要。


    “关于人工智能责任制度的讨论，目前主要集中在自动驾驶汽车以及谁应当为自动驾驶汽车发生的故障和事故负责方面，尤其是自动驾驶汽车做出独立智能决策导致损害发生的情况下，将会面临更多的法律难题。”^([\[30\]](#txt006.html#footnote_content_txt006_30))学者研究智能驾驶侵权责任规则体系的热情高涨，认为“必须尽快启动立法程序，对自动驾驶技术引发的一系列问题进行调查研究，最终制定专门法律《自动驾驶汽车法》”^([\[31\]](#txt006.html#footnote_content_txt006_31))。但也有学者冷静地认为制定关于智能驾驶的侵权责任规则体系的时机尚不成熟，“要针对自动驾驶汽车的致损事故制定出明晰且稳定的侵权责任体系，很明显是为时尚早”^([\[32\]](#txt006.html#footnote_content_txt006_32))。


    ### 一、从禁止到有限许可的智能驾驶


    #### （一）人类驾驶员作为单一驾驶主体的阶段


    驾驶行为关系到人的生命安全，也存在影响公共安全的风险因素。在人工智能技术无法保障公众安全的情况下，无人驾驶被严厉禁止。1968 年，联合国制定的《维也纳道路交通公约》明确规定控制汽车的应当是人而不是计算机，该公约第8
    条载明：“凡行驶的车辆或车辆组合必须有一名驾驶人。”^([\[33\]](#txt006.html#footnote_content_txt006_33))智能驾驶技术应用于实践后，联合国仍然对此持审慎的态度，“当车速超过10
    公里／小时，汽车的自动转向功能就应当被自动禁用，该规定极大地限制了汽车自动转向系统，特别是变道辅助和车道保持辅助系统在智能汽车上的应用。”^([\[34\]](#txt006.html#footnote_content_txt006_34))


    《中华人民共和国道路交通安全法》（以下简称《道路交通安全法》）中规定的驾驶员是否应当限定在自然人的范围内？无论是从文意解释、目的解释还是历史解释的角度出发，《道路交通安全法》中规定的驾驶员都应当被解释为自然人。“从国家法律层面讲，自动驾驶汽车道路测试合法化的问题仍然处于灰色地带，就自动驾驶汽车发展的速度来看，急需国家层面的法律法规来对整个自动驾驶行业进行引导和规制，因为没有任何无人驾驶系统能够做到始终完美可靠。”^([\[35\]](#txt006.html#footnote_content_txt006_35))


    #### （二）驾驶主体多元化阶段


    智能驾驶具有100%的安全性是人们美好的愿望。“然而事实是，如果需要完美的安全可靠性，无人驾驶汽车将永远不会获得合法地位，因为没有任何无人驾驶系统能够做到始终完美可靠。”^([\[36\]](#txt006.html#footnote_content_txt006_36))智能驾驶系统具有与人类驾驶员同等甚至更高的安全系数即可。传统驾驶事故产生的主要原因出在驾驶员身上，如驾驶员疲劳驾驶、注意力不集中、心绪不宁，从这一方面看，智能驾驶提升了行车的安全性。随着人工智能技术的进步与发展，智能驾驶汽车的安全性能得到改善，禁止智能驾驶汽车上路的限制性规定的正当性被动摇。

    '
  trans: '

    采用无过错责任原则具有节省诉讼成本的优势。智能机器（人）的行为具有专业性、不透明性、不可预测性和难以防控性，“囿于智能机器人的上述特性及设计的高端性和制造结构的复杂性，由被害人来证明人工智能存在过错与否显然不公平，更宜适用无过错责任的归责原则。”^([\[14\]](#txt006.html#footnote_content_txt006_14))也就是说，人工智能技术的复杂性使得当事人就产品缺陷、过错以及因果关系等进行举证的成本较高。尤其是伴随智能技术在社会生活中应用的普及以及人工智能自主性的增强，相关诉讼的数量以及难度呈几何级态势增长，“产品责任诉讼的成本亦将呈指数级增长，与其为律师、专家等投入高昂成本，倒不如更多赔偿受害者。”^([\[15\]](#txt006.html#footnote_content_txt006_15))


    ## (四) 有利于事实查明


    在不同类型的归责原则下，主体的举证义务或责任存在差异，其对查明事实的主动性也有所不同。生产者对人工智能产品的制造过程和运行原理最为了解。侵权行为发生以后，由其举证证明人工智能产品是否存在产品缺陷或产品缺陷与损害结果之间是否存在因果关系有助于查明事实。“这一处理原则导源于生产者作为‘最接近真相’的设计与制造者身份，也是归因于生产者在理解算法或代码等方面的天然优势，有助于解决事实查明之现实困境。”^([\[16\]](#txt006.html#footnote_content_txt006_16))


    从过错责任到无过错责任或严格责任的转变是法律价值观从矫正正义向分配正义转变在法律责任领域的体现。责任归咎从关注过错转向填补损失。无过错责任或严格责任以社会整体利益和实质正义为出发点。但是，也有学者对适用无过错责任表示担忧，认为无过错责任会增加人工智能技术研发和应用的成本，抑制人工智能技术和商业模式的创新。尤其是在人工智能技术和商业模式创新的初期，过于严苛的归责原则是否会对智能技术相关产业造成冲击并阻碍产业发展不无疑问。


    总之，人工智能时代智能机器（人）致害的归责原则问题不是一个纯粹的法律适用问题，而是涉及法政策考量的复杂社会问题。归责原则的研究范式需要实现由非此即彼向情境化思维方式的转变。归责原则是在人工智能技术研发和应用的过程中不同利益群体博弈的结果，其背后是利益分析和政策考量，需要平衡受害人利益与行业发展利益。在当下，比照产品质量责任让人工智能产品制造者等主体承担无过错责任有利于救济受害人，也没有对人工智能行业造成严重冲击。在未来，则需要完善相应的保险制度以及其他配套制度，防止过错责任原则适用范围泛化，保障人工智能产业的持续健康发展。


    ## 第二节　人工智能时代侵权责任的免责事由


    《产品质量法》第 41 条第 2 款对产品生产者的免责事由进行了规定。^([\[17\]](#txt006.html#footnote_content_txt006_17))这些关于产品生产者免责事由的规定是在前人工智能时代情境下进行思考和设计的结果，在人工智能时代是否仍然具有合理性值得思考。


    ### 一、机器自主学习作为免责事由的正当性分析


    生产者作为技术风险的控制者对技术缺陷承担责任具有正当理由。智能系统基于程序设计自主作出的决策或行为并不违背设计者的初衷，难谓技术缺陷，由此导致的损害由生产者承担责任存在疑问。机器自主学习会导致智能机器（人）的行为或决策偏离人类预期的目的，能否将机器自主学习作为免责事由？


    #### 第一，人工智能系统作出偏离人类预期的行为或决策具有可能性。


    人工智能系统作出偏离人类预期的行为或决策具有可能性。人工智能系统离不开程序员的计算机编程设计。但是，人工智能系统的行为和决策并不必然是程序员设计的结果。人工智能系统区别于传统机器设备之处在于，人工智能系统的算法不完全依赖于程序员的分步编程。机器学习（`machine
    learning`）中，算法（`algorithm`）和模型（`model`）能够基于数据自主生成新的运行规则，无需程序员的介入或参与。


    智能机器（人）的智能等级分为初始等级和教育等级。同一批次研发或制造的人工智能初始等级相同，但是，在投入流通环节后，智能等级因数据训练不同产生差异。换言之，离开模拟测试环境的人工智能系统能根据社会环境获取新的数据进行训练并形成不同的智能等级。高度自主性的人工智能系统会基于习得的算法设计新的规则，进行自主行为和决策。而这种自主行为和决策往往超出了人脑的认知和反应能力，与人为设计的结果存在偏差。“已经有证据表明高度‘智能’的自主机器可以学习‘打破’规则以保护其自身的生存。”^([\[18\]](#txt006.html#footnote_content_txt006_18))换言之，人工智能系统根据社会环境自主设定规则，进行自我调试的功能使其行为与决策在一定程度上存在不可预测性。


    #### 第二，人工智能系统偏离人类预设的必要性。


    人工智能系统偏离人类预设的必要性。人工智能系统虽然是由人类研发、制造和生产的，但是人类并不奢望能够预见人工智能系统未来所有的行为或决策。人类与人工智能系统在解决问题的方案设计方面存在差异。人类的计算力极为有限且受到预先设置的“前见”或“前理解”的限制，如经验、习惯、陈规、传统智慧等。因而，人类在方案设计方面具有一定的局限性。以算法和模型为基础的人工智能依靠计算机的超强算力往往能考虑得更为全面，能够选择人类没有考虑到的问题解决方案。人工智能系统的行为或决策的不可预见性在一定的情况下正是设计者所期望的。如在智能驾驶的场景中，测试环境并不能穷尽所有的现实可能性，当异常情况（`novel
    situation`）出现时，自动驾驶汽车必须在缺乏预先设定的规则的情况下，依据自己创建的规则，真正独立自主地作出决策。^([\[19\]](#txt006.html#footnote_content_txt006_19))


    若产品投入流通领域之前，在测试环境下人工智能并不存在产品缺陷；产品投入流通领域之后，在新的社会环境中出现偏离人类预期目的的行为或决策，生产者能否以《产品质量法》第
    41 条第 2 款第 2 项主张免责？“究竟是算法自身缺陷引起了侵害？还是人工智能系统基于算法而自主实施了侵害？这两类事实将产生迥然不同的法律后果，前者导致生产者对算法缺陷承担严格责任，后者则使生产者摆脱了责任。”^([\[20\]](#txt006.html#footnote_content_txt006_20))值得注意的是，由于人工智能技术的复杂性使得人工智能产品生产者相对于普通产品生产者更容易证明智能机器（人）行为的自主性。这就有必要区分生产者可预见的自主行为或决策和生产者不可预见的自主行为或决策并以此确定免责事由。生产者需要就其对不可预见的智能机器（人）的自主行为或决策举证，司法裁判中需要辅以专家证人制度。


    ### 二、“事故不可解释性”作为免责事由的正当性分析


    机器深度学习（`deep learning`）将创建规则的权力从人类程序员转移至学习算法（`learning algorithm`）。学习算法在数据训练的基础上创设规则，形成模型。算法是确定的、可被理解的，但是模型的决策逻辑未必具有确定性和可被理解性。人工智能系统生产者能否以“事故不可解释”为由主张免责？事故具有可解释性（`interpretability`）是合理划分责任的前提。“事故不可解释”使缺陷本身以及缺陷产生的时间是投入流通之前还是之后等问题难以判断，生产者能否基于《产品质量法》第
    41 条第 2 款第 2 项主张免责不无疑问。


    首先，基于“事故不可解释”免责需要以智能机器（人）行为或决策的透明性为前提。决策的可追溯性要求其过程透明，英国下议院科学和技术委员会发布的报告《机器人与人工智能》（`Robotics
    and Artificial Intelligence`）强调人工智能决策透明化与安全价值之间的关系。该报告认为，人工智能决策透明化有利于对其进行管控，尤其是在关系到人类生命安全的领域，决策透明化显得尤为重要。


    其次，“事故不可解释”并不意味着免除了人工智能产品生产者解释算法的义务。解密算法需要专业知识并耗费一定的成本，通过设定义务和责任推定规则的方式将该义务或责任施加给人工智能产品的生产者具有合理性。“在发生可疑后果的时候要求程序员用自然语言来解释算法的设计原理，并且追究其相关责任，这显然是一种治本之法。”^([\[21\]](#txt006.html#footnote_content_txt006_21))通过解释算法证明算法是在被合理应用的情况下仍然发生了不可解释的事故，生产者方能依“事故不可解释”免责。


    ### 三、技术中立作为免责事由的正当性分析


    因技术本身产生的责任，适用技术中立原则，智能机器（人）的生产者无需承担法律责任。有学者质疑技术中立不过是一种假象。数据分析和决策与人的主观性相关，创构是将预期结果转变为现实的过程，其目的是满足人的需要，各种因素之间的比例关系正是由人来调整的。这就需要区分纯粹技术设计和目的性技术设计，并将目的性技术设计细分为合法性设计和非法性设计。倘若设计人工智能技术的目的是从事侵权或其他违法活动，则不适用技术中立原则。“在替代责任情形中，机器人本无瑕疵，符合技术中立原则要求，但机器人的所有人或使用人，或不尽善良管理人之义务，或放任机器人的侵权行为，则不能以技术中立原则免除责任。”^([\[22\]](#txt006.html#footnote_content_txt006_22))


    ### 四、发展风险作为免责事由的正当性分析


    学习算法（`learning algorithm`）不同于编码算法（`coded algorithm`），它会根据输入数据生成人类程序设计者未曾预料到的新算法进而作出决策或行为。因学习算法自主生成的程序导致发生损害是否适用发展风险抗辩？有学者认为：“如果将其定义为设计缺陷将极大地阻碍技术进步，故也可以有条件地适用发展风险抗辩原则，坚持以可责难性评价为前提。”^([\[23\]](#txt006.html#footnote_content_txt006_23))为促进技术进步，法律允许新型技术的研发和应用主体基于开发风险主张抗辩。倘若缺陷是依现有技术不可知的，则生产者可以主张发展风险抗辩（`the
    development risk clause`）。发展风险抗辩关注缺陷的可识别性，生产者主张发展风险抗辩以其依当时的技术条件对技术缺陷不可知为前提，至于该缺陷是否能够避免并非所问。


    否认发展风险抗辩作为免责事由正当性的观点认为，风险承担与利益分配呈正相关关系，生产者将产品投入流通领域获得了利益，就需要承担相应的风险。发展风险抗辩使生产者承担的风险与获取的利益之间的关系失衡。否定说表面上有一定的合理性，但是考虑到生产者预期收益的有限性与风险责任的无限性，该说难以成立。发展风险抗辩具有鼓励技术创新，消除生产者应用新型技术顾虑的作用，反之，禁止发展风险抗辩可能阻碍技术创新和应用。“发展风险抗辩制度将促使在发展风险上形成生产者和消费者之双边预防模式，从而激励双方当事人共同内部化风险防控成本，而这显然比生产者单边预防模式更能降低整体上的社会风险控制成本。”^([\[24\]](#txt006.html#footnote_content_txt006_24))


    从绝对安全到合理安全的转变是综合考量生产者或行业利益与消费者利益的结果，发展风险抗辩是平衡安全与效率的调节器。进入流通领域的产品需要满足安全的需要，但是这一需要不能过度，否则会严重影响效率价值的实现。过高的安全门槛，在排除社会风险的同时也排除了创新性产品的效用。在鼓励技术创新的同时需要合理保障消费者的权益，这正是将发展风险抗辩作为免责事由的正当性理由。


    判断依当时科学技术水平能否发现缺陷需要遵循客观标准而非主观标准，即依据当时整体的科学技术水平，而非生产者主观上认知的科学技术水平。推定生产者已知当时整体的科学技术水平，能够督促生产者全面了解和掌握当时的科学技术水平，又不苛责其
    100%保证技术安全。


    发展风险抗辩需要满足消费者合理期待原则的要求。例如，出行安全是选择智能驾驶方式的消费者的合理期待，发展风险抗辩不能作为提供不安全出行服务的借口。“因系统泄漏或数据采集不完整等原因导致的不可预测性风险可以作为无人驾驶汽车产业内在的风险成本，溢出的负外部性风险可以通过生产者担责的方式进行内化，以期为受害者的救济提供更为安全的基本保障。”^([\[25\]](#txt006.html#footnote_content_txt006_25))这一目的在封闭的私法体系中难以实现，需要借助公权力主导的监管和审批制度。


    关于人工智能产品发展风险抗辩的举证，根据 2008 年最高人民法院《关于民事诉讼证据的若干规定》第 4 条第 6 项的规定，在产品缺陷侵权责任诉讼案件中，生产者就免责事由负有举证责任，因此发展风险抗辩的举证责任应由生产者承担。生产者需要证明“当时科技水平无法发现该缺陷”。而要达到这一证明目的，人工智能产品的生产者通常需要证明其产品当时在安全性上不次于同类产品，没有更为安全的替代方案。实践中，要生产者就此举证比较困难，基于诉讼风险和诉讼成本的考虑，生产者更倾向于径先以产品无缺陷、受害人存在过错等事由对抗责任成立，而甚少援引举证难度较高且相关规则不明的第
    41 条第 2 款第 3 项为抗辩，使得其实质上成为一个“沉睡”条款。^([\[26\]](#txt006.html#footnote_content_txt006_26))


    ## 第三节　智能驾驶侵权责任问题研究


    智能驾驶汽车是人工智能技术在机动车驾驶领域的应用和推广。人工智能感知和识别系统取代了人类驾驶员的眼睛和耳朵，分析不同情境下的路况和环境并作出决策。“自动驾驶汽车（`Autonomous
    Vehicle`）已经不再是《少数人报告》《我，机器人》等科幻电影中的概念，谷歌、丰田、尼桑、奥迪、特斯拉等汽车制造商正在将其变为现实。”^([\[27\]](#txt006.html#footnote_content_txt006_27))


    智能驾驶汽车是人工智能技术应用于社会生活较早和较为成熟的项目。它的出现引发了交通运输产业颠覆性的变革，是产业结构升级的突破口和新的经济增长点，受到发达国家的追捧。是否将自动驾驶作为道路交通法的调整对象成为当代社会评判法律制度先进与否的标准。《德国道路交通法》修改后明确允许自动驾驶汽车上路，该修改案被德国联邦交通部部长誉为“世界上最先进的《道路交通法》”^([\[28\]](#txt006.html#footnote_content_txt006_28))。


    “智能算法操纵的汽车早已默默上路，正在与人类司机驾驶的汽车互动。事故早已先于规则出现。”^([\[29\]](#txt006.html#footnote_content_txt006_29))“谷歌无人驾驶汽车与公交车发生碰撞”“特拉斯
    ModelS 因错误识别致车主约书亚·布朗死亡”“奔驰汽车定速巡航失灵”“优步无人驾驶汽车致依莱·恩赫茨伯格死亡”“特拉斯 ModelS 爆炸起火致人死亡”等一系列智能驾驶致害事件表明构建并完善相关民事法律责任规则十分必要。


    “关于人工智能责任制度的讨论，目前主要集中在自动驾驶汽车以及谁应当为自动驾驶汽车发生的故障和事故负责方面，尤其是自动驾驶汽车做出独立智能决策导致损害发生的情况下，将会面临更多的法律难题。”^([\[30\]](#txt006.html#footnote_content_txt006_30))学者研究智能驾驶侵权责任规则体系的热情高涨，认为“必须尽快启动立法程序，对自动驾驶技术引发的一系列问题进行调查研究，最终制定专门法律《自动驾驶汽车法》”^([\[31\]](#txt006.html#footnote_content_txt006_31))。但也有学者冷静地认为制定关于智能驾驶的侵权责任规则体系的时机尚不成熟，“要针对自动驾驶汽车的致损事故制定出明晰且稳定的侵权责任体系，很明显是为时尚早”^([\[32\]](#txt006.html#footnote_content_txt006_32))。


    ### 一、从禁止到有限许可的智能驾驶


    #### （一）人类驾驶员作为单一驾驶主体的阶段


    驾驶行为关系到人的生命安全，也存在影响公共安全的风险因素。在人工智能技术无法保障公众安全的情况下，无人驾驶被严厉禁止。1968 年，联合国制定的《维也纳道路交通公约》明确规定控制汽车的应当是人而不是计算机，该公约第
    8 条载明：“凡行驶的车辆或车辆组合必须有一名驾驶人。”^([\[33\]](#txt006.html#footnote_content_txt006_33))智能驾驶技术应用于实践后，联合国仍然对此持审慎的态度，“当车速超过
    10 公里／小时，汽车的自动转向功能就应当被自动禁用，该规定极大地限制了汽车自动转向系统，特别是变道辅助和车道保持辅助系统在智能汽车上的应用。”^([\[34\]](#txt006.html#footnote_content_txt006_34))


    《中华人民共和国道路交通安全法》（以下简称《道路交通安全法》）中规定的驾驶员是否应当限定在自然人的范围内？无论是从文意解释、目的解释还是历史解释的角度出发，《道路交通安全法》中规定的驾驶员都应当被解释为自然人。“从国家法律层面讲，自动驾驶汽车道路测试合法化的问题仍然处于灰色地带，就自动驾驶汽车发展的速度来看，急需国家层面的法律法规来对整个自动驾驶行业进行引导和规制，因为没有任何无人驾驶系统能够做到始终完美可靠。”^([\[35\]](#txt006.html#footnote_content_txt006_35))


    #### （二）驾驶主体多元化阶段


    智能驾驶具有 100%的安全性是人们美好的愿望。“然而事实是，如果需要完美的安全可靠性，无人驾驶汽车将永远不会获得合法地位，因为没有任何无人驾驶系统能够做到始终完美可靠。”^([\[36\]](#txt006.html#footnote_content_txt006_36))智能驾驶系统具有与人类驾驶员同等甚至更高的安全系数即可。传统驾驶事故产生的主要原因出在驾驶员身上，如驾驶员疲劳驾驶、注意力不集中、心绪不宁，从这一方面看，智能驾驶提升了行车的安全性。随着人工智能技术的进步与发展，智能驾驶汽车的安全性能得到改善，禁止智能驾驶汽车上路的限制性规定的正当性被动摇。

