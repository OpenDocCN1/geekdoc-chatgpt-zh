    ### “第一层”保险

    “第一层”保险是直接责任主体为分散风险而投保的保险。“由自动驾驶汽车制造商承担并缴纳强制保险费用，明确其需缴纳的‘第一层’保险费用和赔偿限额上限。”^([\[12\]](#txt008.html#footnote_content_txt008_12))车主和制造商为分散风险都可以作为投保主体。当智能产品制造与服务合一时，责任保险的投保主体由车主转变为制造商。


    ### （二）“第二层”保险

    “第二层”保险是社会救助方式的变形。有学者建议，在智能驾驶侵权责任承担中，需要“将‘道路交通事故社会救助基金’转型为‘自动驾驶汽车事故责任信托基金’，作为自动驾驶汽车事故的‘第二层’责任保险资金池，对超出‘第一层’保险限额的损害提供赔偿救济”^([\[13\]](#txt008.html#footnote_content_txt008_13))。“第二层”保险以智能机器（人）为联结点，根据受益人共担风险的原则，由智能机器的制造者、设计者、销售者、所有者、使用者等利益相关主体预先缴付用以设立保险资金池的特定资产，将智能产品设计者、制造者、智能投资顾问运营者等主体的部分盈利转化为共同赔偿基金，用于弥补被侵权主体或金融消费者等遭受的不可归责于其他主体的损失。

    有学者认为：“如果受害人在‘双层保险框架’下获得赔偿后不满意，仍享有根据产品责任提起诉讼的权利。”^([\[14\]](#txt008.html#footnote_content_txt008_14))这一观点值得商榷，需要区分具体情境进行分析。在事故责任保险与产品责任保险分离的情境下，以事故责任保险为中心的“双层保险框架”分散的是保有人或使用人的民事法律责任。受害人在“双层保险框架”下未获得充分救济，有权基于产品责任法律关系继续主张权利。但是，在事故责任保险与产品责任保险一体化的情境下，“双层保险框架”所分散的风险已经覆盖了事故责任和产品责任，受害人以“双层保险框架”下未获得充分救济再向产品制造者等主体主张权利缺乏正当性。


    ### 二、“第一层”保险与“第二层”保险的关系

    “第一层”保险与“第二层”保险是人工智能时代分散社会风险的两种不同的方式。“第一层”保险分散的风险具有同质性特征，资金池中的资金来源于需要分散同类风险的主体。人工智能产品的制造商、所有者或使用者就人工智能产品的特定风险投保，因该风险产生的损失由同种类型的投保人分担。“第二层”保险分散的风险具有跨行业和整体性特征，资金池中的资金来源于参与人工智能产品研发和应用的各类主体。上述主体为了某一共同目的集合在一起，为填补不特定事项的损失提供财产基础。

    “第一层”保险的保险标的是特定被保险人的责任，被保险人在具体的法律关系中负有法律责任是保险人支付保险金的前提条件。因发展抗辩等免责事由而无法获得救济的受害人无法通过“第一层”保险获得救济。这就需要以救济而非责任为中心的“第二层”保险进行补充。换言之，通过“第一层”保险分散风险或损失的功能是有限的，填补被侵权主体或金融消费者遭受的损失需要辅之以“第二层”保险。


