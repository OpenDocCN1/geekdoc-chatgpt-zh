  trans: '

    智能驾驶立法肇始于美国的内华达州，该州于 2011 年通过了《511 议案》（Assembly Bill 511），承认智能驾驶行为的合法性。2016 年，美国交通运输部（DOT）和国家公路交通安全管理局（NHTSA）联合出台《联邦自动驾驶汽车政策》。为防止各州关于无人驾驶汽车上路的规定产生矛盾冲突，避免监管碎片化，美国众议院于
    2017 年通过了《自动驾驶汽车法案》（Safely En⁃suring Lives Future Deployment and Research in Vehicle
    Evolution Act，又称 Self Drive Act）。该法案修订了《美国法典》（United States Code）第 49 条“交通运输”（transportation）中的相关条文。它赋予美国国家公路交通安全管理局优先监管智能驾驶汽车的权力，并对智能驾驶汽车的“安全标准”“网络安全”“通用性豁免”“隐私保护计划”等进行了规定。“密歇根州、佛罗里达州……删除了自动驾驶汽车中必须有驾驶员的要求，增加要求技术人员应当有能力在必要情况下迅速接管与控制车辆，或者确保车辆本身务必有能力实现减速或停车……”^([\[37\]](#txt006.html#footnote_content_txt006_37))同年
    4 月美国佛罗里达州、密歇根州通过的法案中删除了智能汽车必须配备人类驾驶员的要求，增加了技术人员远程接管和控制车辆的要求。2017 年 10 月，美国加州修正智能驾驶相关法案，允许没有方向盘、制动踏板、后视镜等人类驾驶必须设备的智能汽车上路测试。


    2015 年，德国允许在特定的高速公路 ^([\[38\]](#txt006.html#footnote_content_txt006_38))进行智能驾驶的测试项目。2016
    年，德国交通部起草的道路交通法修改草案扩大了驾驶员的范围，智能驾驶系统被纳入其中。^([\[39\]](#txt006.html#footnote_content_txt006_39))该草案于
    2017 年被德国联邦议会和参议院通过，允许智能驾驶汽车上路。《德国道路交通法（修订）》第 1b 条第 1 款，人类驾驶员在驾驶期间可以借助高度或完全智能驾驶系统而不亲自驾驶车辆。“但为了符合
    1968 年《维也纳道路交通公约》第八条‘每一部车辆在行驶时都必须有驾驶员在位’的规定，它没有允许自动驾驶汽车变成‘无人驾驶’汽车。”^([\[40\]](#txt006.html#footnote_content_txt006_40))人类驾驶员启动智能驾驶系统后，可以将注意力转移至与驾驶行为无关的活动，如读书、看报、上网、休憩；但是，他需要随时保持警醒状态，处于等候模式，一旦智能驾驶系统发出移交驾驶权的请求，人类驾驶员就需要恢复驾驶状态。


    2016 年，联合国修正《维也纳道路交通公约》，认可计算机对汽车的控制，承认智能驾驶的合法性，但是要求人类驾驶员必须在场并可以覆盖或接管智能驾驶。这“意味着包括美国在内的
    72 个签约国可允许自动驾驶功能汽车在特定时间自动驾驶，为自动驾驶技术在交通运输中的应用清除了障碍”^([\[41\]](#txt006.html#footnote_content_txt006_41))。


    2017 年 7 月，百度公司总裁李彦宏乘坐自动驾驶汽车在北京五环路上进行测试。2017 年 12 月，深圳福田保税区出现 4 台无人驾驶公交——阿尔发巴智能公交。2017
    年 12 月工业和信息化部印布了《促进新一代人工智能产业发展三年行动计划（2018 年-2020 年）》的通知，明确要求：“建立可靠、安全、实时性强的智能网联汽车智能化平台，形成平台相关标准，支撑高度自动驾驶（HA
    级）。”2017 年 12 月，北京市出台了《关于加快推进自动驾驶车辆道路测试有关工作的指导意见（试行）》和《自动驾驶车辆道路测试管理实施细则（试行）》等一系列地方性规范性文件，标志着我国智能汽车上路测试行为合法化。2018
    年 1 月，国家发展与改革委员会发布《智能汽车创新发展战略（征求意见稿）》。


