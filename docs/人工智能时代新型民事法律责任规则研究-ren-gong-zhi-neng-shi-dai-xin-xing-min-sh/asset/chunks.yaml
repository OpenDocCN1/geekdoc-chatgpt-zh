    ## 第二章　人工智能时代民事法律责任规则的基本范畴


    概念范畴是构筑金字塔式法学理论体系和法律规则体系的根基。设计人工智能时代民事法律责任规则体系首先需要厘清其赖以存在的基本概念范畴。但是，“从理论与学说的角度来看，无论是描述性的还是预测性的，目前的理论界尚未就什么是人工智能的问题达成一致的认识，而且也缺乏主要的概念范畴。”^([\[1\]](#txt003.html#footnote_content_txt003_1))这就需要梳理人工智能时代民事法律责任规则体系的基础范畴。

