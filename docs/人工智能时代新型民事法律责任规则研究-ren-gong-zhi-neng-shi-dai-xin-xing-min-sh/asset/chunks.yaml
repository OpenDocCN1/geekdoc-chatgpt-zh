    # 智能驾驶法律责任规则设计


    ## 智能驾驶类型与驾驶权

    智能驾驶分为智能驾驶系统辅助、部分智能驾驶和完全智能驾驶三种类型。

    在智能驾驶系统辅助中，人类驾驶员控制驾驶权；在部分智能驾驶中，人类驾驶员与智能驾驶系统共同控制驾驶权；在完全智能驾驶中，人类驾驶员转变为乘客，智能驾驶系统控制驾驶权。


    ## 人类驾驶员的注意义务

    在部分智能驾驶中，人类驾驶员负有警惕义务和接管义务，需要监控道路交通状况和智能汽车运行状况并随时准备接管。在完全智能驾驶中，人类驾驶员仅在预先被告知的情况下在智能驾驶系统发出接管请求时负有接管义务。


    ## 道路交通事故责任

    智能驾驶工具的使用人基于人类驾驶员的过错承担责任。

    智能驾驶工具的保有人对第三人的损失在法律限定的赔偿额度内承担无过错责任。保有人履行了安全检查义务的，在承担责任后有权向智能驾驶工具的制造商追偿。


    ## 智能驾驶中的产品责任

    因智能驾驶工具存在产品缺陷而导致损害的，智能驾驶工具制造者需要承担责任。

    智能驾驶工具被改装，且损害结果是改装导致的，由改装的主体承担责任，原制造商无需承担责任。

    智能驾驶工具的制造者负有通知保有人或使用人等主体更新智能系统的义务，因其未履行通知义务而导致智能驾驶工具致损的，制造者需要承担责任。智能驾驶工具的制造者履行了通知义务，但智能驾驶工具的保有人或使用人仍未及时更新并造成损失的，制造者在赔偿限额内与保有人或使用人对第三人承担连带责任，其承担对第三人的赔偿责任后有权向保有人或使用人追偿。


    ## 智能驾驶中的高度危险责任

    智能驾驶工具的制造者是从源头控制智能驾驶高度危险的主体，对存在高度危险的智能驾驶活动在法律限定的额度内承担责任。


    # 智能投资顾问运营者法律责任规则设计


    ## 智能投资顾问运营者的业务范围

    智能投资顾问运营者的业务包括投资咨询和资产管理。


    ## 智能投资顾问运营者的义务

    在智能投资顾问活动中运营者需要遵循客户最佳利益原则，履行投资者适当性义务、胜任性义务、谨慎义务和忠实义务等。


    ## 穿透识别责任主体

    因智能投资顾问系统导致的损失应当归咎于智能投资顾问系统运营者。

    第三方提供缺陷算法导致投资者利益受损的，智能投资顾问运营者不知情的，承担补充责任；智能投资顾问运营者知情的，承担连带责任。


    ## 智能投资顾问系统调试和维护义务

    智能投资顾问运营者应当配备必要的技术人员和金融人员对智能投资顾问系统进行维护和调试，并在系统存在瑕疵时由自然人投资顾问介入。智能投资顾问运营者未履行调试和维护义务导致投资者利益受损的，需要承担责任。


    ## 抗辩理由

    因投资者自身原因、市场行情变化或符合投资目的的行为导致损失的，智能投资顾问运营者不承担责任。


