- raw: '资产管理业务与投资咨询业务相区别。资产管理超过了投资咨询概念的涵摄范围，被排除在投资咨询之外。资产管理业务中受托人基于协议或投资计划有权对委托人的资产进行投资、管理；而投资咨询业务是为投资者提供投资建议。投资咨询与资产管理中投资决定权的行使主体不同，投资咨询中投资决定权属于客户，而资产管理中投资决定权通过委托方式转移至资产管理者。


    法律条文中对“投资顾问”的解释难以涵盖现实生活中智能投资顾问的类型，法律规定与现实生活产生隔离。“我国多数学者忽视了智能投顾含义在国别上的差异，将其视为‘投资顾问’或者‘投资咨询’的新形态，立法也未能及时跟进，如此一来，在规范智能投顾的问题上，遂出现立法缺位、规范无据和监管错位的尴尬情况。”^([\[18\]](#txt007.html#footnote_content_txt007_18))


    3.我国智能投资顾问概念的应然选择


    人工智能时代投资顾问业务功能应实现多元化。“随着投顾主体的虚拟智能化，投资顾问已由最初单纯的投资咨询建议，转变为兼具资产管理与投资咨询双重性质的金融服务。”^([\[19\]](#txt007.html#footnote_content_txt007_19))智能投资顾问的重心不在于投资咨询而在于资产管理。为应对瞬息万变的投资市场，智能投资顾问系统需要在较短的时间内完成提供投资组合建议、发出交易指令、执行交易指令以及投资组合再平衡的过程。智能投资顾问系统为投资者进行实时资产配置的前提是全权管理投资者的资金账户。智能投资顾问业务的重心由投资咨询转向资产管理后，投资者全权委托智能投资顾问经营者管理账户属于常态化现象。监管机构倾向于将智能投资顾问作为类似资产管理的业务形态进行监管。有学者建议我国立法采用广义投资顾问的概念，将资产管理涵盖在投资顾问中，建立统一的金融牌照管理制度。


    二、智能投资顾问的特征


    （一）虚拟化


    传统投资顾问业务具有对人的依赖性，人与人之间面对面的服务是典型方式。智能投资顾问通过智能设备自动完成投资咨询和资产管理，淡化了对物理网点的基础设施和人的依赖。投资顾问服务提供者从自然人转变为智能投资顾问系统是智能投资顾问最显著的特征。“反应性、机动性和代表性这三个根本特征使得智能投资顾问具有了类似人类代理人的特征。”^([\[20\]](#txt007.html#footnote_content_txt007_20))


    （二）自主性


    智能投资顾问系统通过对客户的风险偏好以及承受能力进行分析，提供投资顾问服务或撮合交易。建立在算法和模型基础上的智能投资顾问能够在没有人类直接操控的情况下自主执行并完成任务，在观察和分析的基础上根据环境变化或场景转换作出应对，为他人提供咨询或中介服务。人工智能的自主性与人类生活的便捷性呈正相关关系，而与人类的控制呈负相关关系。


    （三）技术性与秘密性


    智能投资顾问是计算机科学和互联网技术应用于金融领域的成果，具有高度技术性。以算法和模型为基础的数据分析，涉及计算机、金融、信息处理等交叉学科。法律关注的重点从“如何做”转向“做什么”。“由于智能投顾整个算法运作体系以一系列经济假设为依托，如果该假设是错误的，或至少不适用于特定个体，那么由此得出的运算结果将不利于投资者。即使该假设是正确的，也难以完全抵挡市场的系统性风险。”^([\[21\]](#txt007.html#footnote_content_txt007_21))


    智能投资顾问的核心算法处于保密状态。算法的秘密性使得智能投资顾问服务领域出现鱼龙混杂、泥沙俱下的混乱场面。部分不具备智能投资顾问实力的公司通过过度包装，打着“智能理财”“大数据”“人工智能”的幌子从事智能投资顾问服务活动。


    （四）排除或削弱非理性因素


    自然人提供的投资顾问服务虽然具有一定的专业性，但是，难免受到外界环境或情绪等因素的干扰，从而提供非理性的投资顾问建议。智能投资顾问系统是建立在理性计算基础之上的，合理的算法设计能够在一定程度上矫正认知偏差，排除或削弱投资顾问服务中的非理性因素。


    第二节　智能投资顾问业务中运营者的民事法律义务


    金融产品的复杂性以及信息的高度不对称使得投资者与金融机构在谈判、磋商以及风险防范方面的悬殊加剧，发生由投资者向消费者的角色转变。^([\[22\]](#txt007.html#footnote_content_txt007_22))投资者与金融机构及从业人员在事实上的不平等使得意定主义的法律调整方式暴露出缺陷。这就需要通过设定法定义务和责任的方式，矫正事实上的不平等，对投资者予以倾斜保护。


    一、以信义义务为中心


    投资者信赖投资机构及从业人员的建议而为投资行为，这是投资者与投资机构之间信义关系产生的基础。“在传统的投资顾问模式下，为投资者提供顾问意见的专业人员与投资者之间因为专业关系而形成了信义关系，对投资者承担信义义务。”^([\[23\]](#txt007.html#footnote_content_txt007_23))自然人投资顾问基于学识、经验、常识、逻辑推理、直觉、职业伦理等进行专业判断并为投资者提供咨询或中介服务。自然人投资顾问在进行专业判断和提供服务的过程中难免出现需要进行利益衡量和选择的情况，这就需要通过信义义务对其进行规制。美国证监会诉资本收益研究局（SEC
    v.Capital Gains Research Bureau）一案中^([\[24\]](#txt007.html#footnote_content_txt007_24))，美国最高法院以委托关系为基础，通过解释《1940
    年投资顾问法》第206 条，确立了投资顾问机构的信义义务。


    “假使由人工智能来充任投资顾问，即所谓的智能投顾，那么智能投顾是否也同样负有信义义务呢？其中一个关键问题在于，人类在开发智能投顾时，可以也应该将信义义务的具体要求内化于其决策模型之中，因而能够响应法律的要求构建或训练这种决策模型的，显然只有人类本身。”^([\[25\]](#txt007.html#footnote_content_txt007_25))在智能投资顾问活动中，智能投资顾问系统对投资者账户中资产的配置与处分拥有一定程度的决定权，投资者基于对智能投资顾问的信赖从事投资行为。为保护投资者的信赖利益，需要智能投资顾问运营者负有信义义务，不得因利益冲突实施欺诈投资者的行为。


    智能投资顾问运营者通过智能投资顾问系统进行相关业务活动，智能投资顾问系统中参数设定是否合理是判断其运营者是否履行了信义义务的重要标准。“美国金融业监管局的报告要求，在检验有无利益冲突时，要考虑算法中是否包含会引发利益冲突的参数，尤其在组合投资中，如果输出的结果偏向于某些金融产品，那么运营者有义务解释原因，并且需要将输出的结果与未选择的类似产品的优劣作对比。”^([\[26\]](#txt007.html#footnote_content_txt007_26))我国未来立法需要对智能投资顾问运营者施加强制性的参数说明义务，禁止智能投资顾问运营者在程序中设置损害投资者利益的参数。


    二、义务群体系


    智能投资顾问信义义务的理论基础是“客户最佳利益原则”，即智能投资顾问需要以客户利益最大化为行为宗旨或目标。智能投资顾问系统根据客户的财务状况、心理承受能力、投资意愿和目标为客户提供合理的投资建议以及资产管理服务。一般认为，投资顾问业务中的信义义务可以分解为勤勉义务和忠实义务。^([\[27\]](#txt007.html#footnote_content_txt007_27))勤勉义务要求智能投资顾问机构在为消费者提供服务时需保持如同处理自己事务一般勤勉、谨慎。勤勉义务又可细化为投资者适当性义务、胜任性义务和谨慎义务。忠实义务要求智能投资顾问机构在利益冲突的场景以消费者利益最大化为目标。


    （一）勤勉义务


    1.投资者适当性义务


    投资者适当性义务，又称隔离义务，是指投资顾问机构或从业人员向金融投资者或消费者提供的产品或服务需要与金融消费者的财务状况、风险承受能力、投资经验等相匹配，将不符合风险承受能力要求的投资者隔离在相应金融产品之外。^([\[28\]](#txt007.html#footnote_content_txt007_28))这一起源于美国的金融法治原则得到其他国家和国际组织的认同，成为金融法治体系建设中的重要内容。^([\[29\]](#txt007.html#footnote_content_txt007_29))在智能投资顾问服务模式下，人工成本降低，投资顾问服务业务惠及大众。但是，让大众享受优质服务的普惠金融是一柄双刃剑。社会大众往往缺乏投资经验和能力，智能投资顾问运营者可能利用经济或技术等方面的优势侵害投资者利益，因此适当性义务的要求需要更为严格。而且金融消费者的财务状况、投资需求和风险承受能力处于动态变化之中，适应性义务也需要根据该变化进行动态调整。


    精准客户画像是智能投资顾问提供投资建议或资产管理服务的前提。而精准客户画像往往是通过标准化调查问卷实现的。标准化调查问卷是智能投资顾问平台获取信息的方式。调查问卷设计的科学性及合理性直接影响智能投资顾问对客户财产状况以及风险承担能力的评估，影响客户画像的精准性。智能系统通过问卷方式搜集的信息尚且不能达到自然人投资顾问搜集信息的真实性和完整性程度，对智能投资顾问系统负有监督和检查义务的主体需要介入，直接与投资者接触，获取或补充信息，从而满足在信息搜集方面的需要。“我国未来立法有必要对问卷设计设定基本的要求，保证其具备收集必要信息的能力、回应冲突信息的能力以及持续更新信息的能力。”^([\[30\]](#txt007.html#footnote_content_txt007_30))当然，智能投资顾问业务运营以投资者或消费者提供的信息为基础判断其适当性，需要培养理性投资者或消费者的观点。预先设定的算法的质量取决于数据的真实性和覆盖面等因素，数据的不完全性也会影响算法。倘若投资者基于故意或过失提供了不真实或不准确的信息，误导智能投资顾问系统，使得智能投资顾问运营者未能准确判断投资者是否满足适当性要求，并基于误判给出投资建议或进行资产管理，相应的责任应由存在主观过错的投资者承担。


    2.胜任性义务


    《证券法》第160 条第2 款对投资顾问机构的从业资格进行了规定。《关于规范金融机构资产管理业务指导意见》中规定：“运用人工智能技术开展投资顾问业务应当取得投资顾问资质，非金融机构不得借助智能投资顾问超范围经营或变相开展资产管理业务。”根据上述规定，从事智能投资顾问业务的运营主体需要具备执业资格并进行注册登记，否则为非法经营。监管部门通过行政许可的方式设定智能投资顾问的准入门槛在一定程度上能够保证行业有序、健康发展。但是，设置过于严苛的准入门槛甚至通过禁止核发牌照的方式在遏制智能投资顾问行业野蛮生长的同时也阻滞了行业发展，给金融市场持续、健康发展留下隐患。对于智能投资顾问业务宜疏不宜堵，需要创新金融科技监管手段和方法，在保障金融安全的同时促进金融创新。


    3.谨慎义务


    负有谨慎义务的智能投资顾问运营者需要按照同行业中类似智能投资顾问运营者的标准谨慎行事。“智能投资顾问业务中的受托人负有保证算法能够执行预期任务的谨慎义务，确保不会产生超出合理范围的偏差而导致投资者利益受损。”^([\[31\]](#txt007.html#footnote_content_txt007_31))自然人形态的投资顾问面对的投资者是确定的，投资顾问针对特定投资主体在特定的市场环境下提供投资策略或方案。智能投资顾问面向的投资者是未来可能出现的不特定的主体，投资的市场环境也处于变化中。因而，智能投资顾问运营者承担谨慎义务需要考虑的对象是未来不特定的投资主体，而非单个特定的投资主体。


    （二）忠实义务


    利益冲突是指不同类型的利益同时存在并互相排斥的情形。智能投资顾问中的利益冲突存在直接冲突和间接冲突两种类型。^([\[32\]](#txt007.html#footnote_content_txt007_32))直接冲突是指在智能投资顾问中，投资者与智能投资顾问经营者之间发生的利益冲突，主要表现为智能投资顾问经营者为了自身利益最大化在提供投资顾问服务时通过自我交易或双方代理等方式侵害投资者的利益。“间接利益冲突的主体是‘投资公司的关联者、运营者和主要收购者’，法律禁止其‘对该投资公司的证券或者其他资产的买卖行为和金钱借贷行为’。”^([\[33\]](#txt007.html#footnote_content_txt007_33))投资顾问的忠实义务要求其行为以投资者利益最大化而非运营主体利益最大化为出发点。“基于利益冲突的忠实义务虽然可以通过顾客的同意被豁免，但忠实义务中的善意义务却无法被豁免。”^([\[34\]](#txt007.html#footnote_content_txt007_34))


    在自然人形态的投资顾问活动中，作为投资顾问的自然人身份具有多重性。一方面，作为投资顾问的自然人基于与金融机构的劳动合同关系是金融机构的工作人员；另一方面，作为投资顾问的自然人又是金融投资者信赖的主体。同一主体具有多重身份难免在面临价值选择和利益衡量时陷入冲突的困境。忠实义务为冲突性价值和利益选择设定了标准。当投资者利益与包括投资顾问个人或机构在内的其他人的利益发生冲突时，需要优先考虑投资者的利益。投资顾问需要为投资者推荐最大化投资者利益（best
    interest rule）而非有利于金融机构或自己的金融产品。


    智能投资顾问机器（人）并没有独立的利益主张或需要，不会因个人利益或情感与投资者利益发生冲突。从这一意义上讲，智能投资顾问机器（人）比人类投资顾问更为理性，更有利于实现投资者利益最大化。但是，这并不意味着智能投资顾问机器（人）的决策和行为是绝对理性、客观的。智能投资顾问运营者可以通过程序设计以代码的方式操控智能投资顾问的行为或决策。“智能投资顾问语境下信义义务规制的重点在于，通过忠实义务的设定避免算法中包含损害投资者利益的设置。”^([\[35\]](#txt007.html#footnote_content_txt007_35))


    智能投资顾问的行为和决策是在算法黑箱中完成的。对于缺乏专业技术知识的投资者而言，其只能被动地接受生成的投资建议，难以判断生成过程及结果的合理性与正当性。智能投资顾问运营者是否通过算法谋取私利，投资者无从知晓，这就需要法定主义调整方式的介入。“需要注意的是，在证券法上，对投顾过程中的利益冲突主要是通过一种‘基于披露’，而非‘基于绩效’的标准来调整。”^([\[36\]](#txt007.html#footnote_content_txt007_36))智能投资顾问运营者信息披露需要满足真实、准确、完整、及时、易读等要求。算法代码披露是智能投资顾问运营者披露信息的主要方式，对投资者利益算法披露的范围限于算法逻辑和预期结果，而非源代码。^([\[37\]](#txt007.html#footnote_content_txt007_37))


    第三节　智能投资顾问业务中运营者的民事法律责任


    一、责任主体的识别


    （一）智能投资顾问机器（人）不作为责任主体


    1.辅助工具说


    智能投资顾问机器（人）提供的服务不过是人类预先设定的算法或程序的外在展示。智能投资顾问机器（人）在提供服务的过程中，缺乏独立的意志，其自主决策或行为并未超过程序设计员的预期。即便是不需要人工干预的智能投资顾问机器（人）也未脱离工具属性，“智能投顾的存在仅仅是为了实现其背后的投资顾问服务机构所设定的单一目的，即为投资者选择合适的投资方案并执行，故应当由智能投顾运营者为其设计和运营的智能投顾承担责任。”^([\[38\]](#txt007.html#footnote_content_txt007_38))


    2.电子代理人说


    美国《统一计算机信息交易法》第102 条第28 项对电子代理人的概念进行了界定。根据该条文，电子代理人是无需人的介入而能够独立就电子信息进行回应或行为的自动化工具。根据代理理论，电子代理人是交易主体的代理人，交易活动的后果由交易主体而非电子代理人承担。“在Michael
    D.GREEN v.MORNINGSTAR，INC.案中，原告是接受智能投顾服务的投资者，其认为被告所运营的智能投顾机器人在运行中具有建议投资者选择昂贵的投资项目倾向，即投资者遭受了被告公司的不公平对待。”^([\[39\]](#txt007.html#footnote_content_txt007_39))此时应由智能投资顾问运营者而非智能投资顾问机器（人）对第三人承担民事法律责任。


    3.揭开技术面纱说


    事物的表象与本质之间不一致，这就需要采用穿透式的方式确定投资服务主体^([\[40\]](#txt007.html#footnote_content_txt007_40))并选择责任承担主体。采用穿透技术是为了透过表象发现本质，否则会出现民事责任虚设的情况，导致民事责任机制失灵，损害金融投资者对智能投资顾问市场的信心。智能投资顾问中直接提供投资咨询服务的是智能产品，它基于算法和数据形成判断。人工智能技术的专业性使得复杂的金融结构和法律关系扑朔迷离，在神秘的技术面纱下责任主体识别陷入困境。人工智能系统的介入切断了金融机构及人员与投资者之间的直接关系，为投资者提供咨询和中介业务的主体由原先的自然人转变为智能投资顾问系统，这就使得传统的以金融从业人员为主要对象的金融监管政策和法律失灵，出现法律体系和监管层面的漏洞。^([\[41\]](#txt007.html#footnote_content_txt007_41))人工智能技术成为规避严格金融监管的工具。在弱人工智能时代智能投资顾问系统仍然是一种工具性的存在，尚不符合戴维森所谓的“有意识的代理人”的要求。^([\[42\]](#txt007.html#footnote_content_txt007_42))智能投资顾问系统的技术性特征不能作为逃避或推卸责任的借口，不应成为人类犯错时的替罪羊。


    （二）智能投资顾问运营者自主设计算法时的责任主体


    智能投资顾问系统不具有独立主体资格，因其导致的损失需要依法定或约定的方式确定，由机构或自然人作为义务和责任的主体，否则会出现无人承担义务或责任的状况，导致义务或责任机制失灵。'
  fmt: '

    资产管理业务与投资咨询业务相区别。资产管理超过了投资咨询概念的涵摄范围，被排除在投资咨询之外。资产管理业务中受托人基于协议或投资计划有权对委托人的资产进行投资、管理；而投资咨询业务是为投资者提供投资建议。投资咨询与资产管理中投资决定权的行使主体不同，投资咨询中投资决定权属于客户，而资产管理中投资决定权通过委托方式转移至资产管理者。


    法律条文中对“投资顾问”的解释难以涵盖现实生活中智能投资顾问的类型，法律规定与现实生活产生隔离。“我国多数学者忽视了智能投顾含义在国别上的差异，将其视为‘投资顾问’或者‘投资咨询’的新形态，立法也未能及时跟进，如此一来，在规范智能投顾的问题上，遂出现立法缺位、规范无据和监管错位的尴尬情况。”^([\[18\]](#txt007.html#footnote_content_txt007_18))


    ## 3. 我国智能投资顾问概念的应然选择

    人工智能时代投资顾问业务功能应实现多元化。“随着投顾主体的虚拟智能化，投资顾问已由最初单纯的投资咨询建议，转变为兼具资产管理与投资咨询双重性质的金融服务。”^([\[19\]](#txt007.html#footnote_content_txt007_19))智能投资顾问的重心不在于投资咨询而在于资产管理。为应对瞬息万变的投资市场，智能投资顾问系统需要在较短的时间内完成提供投资组合建议、发出交易指令、执行交易指令以及投资组合再平衡的过程。智能投资顾问系统为投资者进行实时资产配置的前提是全权管理投资者的资金账户。智能投资顾问业务的重心由投资咨询转向资产管理后，投资者全权委托智能投资顾问经营者管理账户属于常态化现象。监管机构倾向于将智能投资顾问作为类似资产管理的业务形态进行监管。有学者建议我国立法采用广义投资顾问的概念，将资产管理涵盖在投资顾问中，建立统一的金融牌照管理制度。


    ## 二、智能投资顾问的特征

    ### （一）虚拟化

    传统投资顾问业务具有对人的依赖性，人与人之间面对面的服务是典型方式。智能投资顾问通过智能设备自动完成投资咨询和资产管理，淡化了对物理网点的基础设施和人的依赖。投资顾问服务提供者从自然人转变为智能投资顾问系统是智能投资顾问最显著的特征。“反应性、机动性和代表性这三个根本特征使得智能投资顾问具有了类似人类代理人的特征。”^([\[20\]](#txt007.html#footnote_content_txt007_20))


    ### （二）自主性

    智能投资顾问系统通过对客户的风险偏好以及承受能力进行分析，提供投资顾问服务或撮合交易。建立在算法和模型基础上的智能投资顾问能够在没有人类直接操控的情况下自主执行并完成任务，在观察和分析的基础上根据环境变化或场景转换作出应对，为他人提供咨询或中介服务。人工智能的自主性与人类生活的便捷性呈正相关关系，而与人类的控制呈负相关关系。


    ### （三）技术性与秘密性

    智能投资顾问是计算机科学和互联网技术应用于金融领域的成果，具有高度技术性。以算法和模型为基础的数据分析，涉及计算机、金融、信息处理等交叉学科。法律关注的重点从“如何做”转向“做什么”。“由于智能投顾整个算法运作体系以一系列经济假设为依托，如果该假设是错误的，或至少不适用于特定个体，那么由此得出的运算结果将不利于投资者。即使该假设是正确的，也难以完全抵挡市场的系统性风险。”^([\[21\]](#txt007.html#footnote_content_txt007_21))


    智能投资顾问的核心算法处于保密状态。算法的秘密性使得智能投资顾问服务领域出现鱼龙混杂、泥沙俱下的混乱场面。部分不具备智能投资顾问实力的公司通过过度包装，打着“智能理财”“大数据”“人工智能”的幌子从事智能投资顾问服务活动。


    ### （四）排除或削弱非理性因素

    自然人提供的投资顾问服务虽然具有一定的专业性，但是，难免受到外界环境或情绪等因素的干扰，从而提供非理性的投资顾问建议。智能投资顾问系统是建立在理性计算基础之上的，合理的算法设计能够在一定程度上矫正认知偏差，排除或削弱投资顾问服务中的非理性因素。


    ## 第二节 智能投资顾问业务中运营者的民事法律义务

    金融产品的复杂性以及信息的高度不对称使得投资者与金融机构在谈判、磋商以及风险防范方面的悬殊加剧，发生由投资者向消费者的角色转变。^([\[22\]](#txt007.html#footnote_content_txt007_22))投资者与金融机构及从业人员在事实上的不平等使得意定主义的法律调整方式暴露出缺陷。这就需要通过设定法定义务和责任的方式，矫正事实上的不平等，对投资者予以倾斜保护。


    ### 一、以信义义务为中心

    投资者信赖投资机构及从业人员的建议而为投资行为，这是投资者与投资机构之间信义关系产生的基础。“在传统的投资顾问模式下，为投资者提供顾问意见的专业人员与投资者之间因为专业关系而形成了信义关系，对投资者承担信义义务。”^([\[23\]](#txt007.html#footnote_content_txt007_23))自然人投资顾问基于学识、经验、常识、逻辑推理、直觉、职业伦理等进行专业判断并为投资者提供咨询或中介服务。自然人投资顾问在进行专业判断和提供服务的过程中难免出现需要进行利益衡量和选择的情况，这就需要通过信义义务对其进行规制。美国证监会诉资本收益研究局（SEC
    v.Capital Gains Research Bureau）一案中^([\[24\]](#txt007.html#footnote_content_txt007_24))，美国最高法院以委托关系为基础，通过解释《1940
    年投资顾问法》第206 条，确立了投资顾问机构的信义义务。


    “假使由人工智能来充任投资顾问，即所谓的智能投顾，那么智能投顾是否也同样负有信义义务呢？其中一个关键问题在于，人类在开发智能投顾时，可以也应该将信义义务的具体要求内化于其决策模型之中，因而能够响应法律的要求构建或训练这种决策模型的，显然只有人类本身。”^([\[25\]](#txt007.html#footnote_content_txt007_25))在智能投资顾问活动中，智能投资顾问系统对投资者账户中资产的配置与处分拥有一定程度的决定权，投资者基于对智能投资顾问的信赖从事投资行为。为保护投资者的信赖利益，需要智能投资顾问运营者负有信义义务，不得因利益冲突实施欺诈投资者的行为。


    智能投资顾问运营者通过智能投资顾问系统进行相关业务活动，智能投资顾问系统中参数设定是否合理是判断其运营者是否履行了信义义务的重要标准。“美国金融业监管局的报告要求，在检验有无利益冲突时，要考虑算法中是否包含会引发利益冲突的参数，尤其在组合投资中，如果输出的结果偏向于某些金融产品，那么运营者有义务解释原因，并且需要将输出的结果与未选择的类似产品的优劣作对比。”^([\[26\]](#txt007.html#footnote_content_txt007_26))我国未来立法需要对智能投资顾问运营者施加强制性的参数说明义务，禁止智能投资顾问运营者在程序中设置损害投资者利益的参数。


    ### 二、义务群体系

    智能投资顾问信义义务的理论基础是“客户最佳利益原则”，即智能投资顾问需要以客户利益最大化为行为宗旨或目标。智能投资顾问系统根据客户的财务状况、心理承受能力、投资意愿和目标为客户提供合理的投资建议以及资产管理服务。一般认为，投资顾问业务中的信义义务可以分解为勤勉义务和忠实义务。^([\[27\]](#txt007.html#footnote_content_txt007_27))勤勉义务要求智能投资顾问机构在为消费者提供服务时需保持如同处理自己事务一般勤勉、谨慎。勤勉义务又可细化为投资者适当性义务、胜任性义务和谨慎义务。忠实义务要求智能投资顾问机构在利益冲突的场景以消费者利益最大化为目标。


    #### （一）勤勉义务

    ##### 1. 投资者适当性义务

    投资者适当性义务，又称隔离义务，是指投资顾问机构或从业人员向金融投资者或消费者提供的产品或服务需要与金融消费者的财务状况、风险承受能力、投资经验等相匹配，将不符合风险承受能力要求的投资者隔离在相应金融产品之外。^([\[28\]](#txt007.html#footnote_content_txt007_28))这一起源于美国的金融法治原则得到其他国家和国际组织的认同，成为金融法治体系建设中的重要内容。^([\[29\]](#txt007.html#footnote_content_txt007_29))在智能投资顾问服务模式下，人工成本降低，投资顾问服务业务惠及大众。但是，让大众享受优质服务的普惠金融是一柄双刃剑。社会大众往往缺乏投资经验和能力，智能投资顾问运营者可能利用经济或技术等方面的优势侵害投资者利益，因此适当性义务的要求需要更为严格。而且金融消费者的财务状况、投资需求和风险承受能力处于动态变化之中，适应性义务也需要根据该变化进行动态调整。


    精准客户画像是智能投资顾问提供投资建议或资产管理服务的前提。而精准客户画像往往是通过标准化调查问卷实现的。标准化调查问卷是智能投资顾问平台获取信息的方式。调查问卷设计的科学性及合理性直接影响智能投资顾问对客户财产状况以及风险承担能力的评估，影响客户画像的精准性。智能系统通过问卷方式搜集的信息尚且不能达到自然人投资顾问搜集信息的真实性和完整性程度，对智能投资顾问系统负有监督和检查义务的主体需要介入，直接与投资者接触，获取或补充信息，从而满足在信息搜集方面的需要。“我国未来立法有必要对问卷设计设定基本的要求，保证其具备收集必要信息的能力、回应冲突信息的能力以及持续更新信息的能力。”^([\[30\]](#txt007.html#footnote_content_txt007_30))当然，智能投资顾问业务运营以投资者或消费者提供的信息为基础判断其适当性，需要培养理性投资者或消费者的观点。预先设定的算法的质量取决于数据的真实性和覆盖面等因素，数据的不完全性也会影响算法。倘若投资者基于故意或过失提供了不真实或不准确的信息，误导智能投资顾问系统，使得智能投资顾问运营者未能准确判断投资者是否满足适当性要求，并基于误判给出投资建议或进行资产管理，相应的责任应由存在主观过错的投资者承担。


    ##### 2. 胜任性义务

    《证券法》第160 条第2 款对投资顾问机构的从业资格进行了规定。《关于规范金融机构资产管理业务指导意见》中规定：“运用人工智能技术开展投资顾问业务应当取得投资顾问资质，非金融机构不得借助智能投资顾问超范围经营或变相开展资产管理业务。”根据上述规定，从事智能投资顾问业务的运营主体需要具备执业资格并进行注册登记，否则为非法经营。监管部门通过行政许可的方式设定智能投资顾问的准入门槛在一定程度上能够保证行业有序、健康发展。但是，设置过于严苛的准入门槛甚至通过禁止核发牌照的方式在遏制智能投资顾问行业野蛮生长的同时也阻滞了行业发展，给金融市场持续、健康发展留下隐患。对于智能投资顾问业务宜疏不宜堵，需要创新金融科技监管手段和方法，在保障金融安全的同时促进金融创新。


    ##### 3. 谨慎义务

    负有谨慎义务的智能投资顾问运营者需要按照同行业中类似智能投资顾问运营者的标准谨慎行事。“智能投资顾问业务中的受托人负有保证算法能够执行预期任务的谨慎义务，确保不会产生超出合理范围的偏差而导致投资者利益受损。”^([\[31\]](#txt007.html#footnote_content_txt007_31))自然人形态的投资顾问面对的投资者是确定的，投资顾问针对特定投资主体在特定的市场环境下提供投资策略或方案。智能投资顾问面向的投资者是未来可能出现的不特定的主体，投资的市场环境也处于变化中。因而，智能投资顾问运营者承担谨慎义务需要考虑的对象是未来不特定的投资主体，而非单个特定的投资主体。


    #### （二）忠实义务

    利益冲突是指不同类型的利益同时存在并互相排斥的情形。智能投资顾问中的利益冲突存在直接冲突和间接冲突两种类型。^([\[32\]](#txt007.html#footnote_content_txt007_32))直接冲突是指在智能投资顾问中，投资者与智能投资顾问经营者之间发生的利益冲突，主要表现为智能投资顾问经营者为了自身利益最大化在提供投资顾问服务时通过自我交易或双方代理等方式侵害投资者的利益。“间接利益冲突的主体是‘投资公司的关联者、运营者和主要收购者’，法律禁止其‘对该投资公司的证券或者其他资产的买卖行为和金钱借贷行为’。”^([\[33\]](#txt007.html#footnote_content_txt007_33))投资顾问的忠实义务要求其行为以投资者利益最大化而非运营主体利益最大化为出发点。“基于利益冲突的忠实义务虽然可以通过顾客的同意被豁免，但忠实义务中的善意义务却无法被豁免。”^([\[34\]](#txt007.html#footnote_content_txt007_34))


    在自然人形态的投资顾问活动中，作为投资顾问的自然人身份具有多重性。一方面，作为投资顾问的自然人基于与金融机构的劳动合同关系是金融机构的工作人员；另一方面，作为投资顾问的自然人又是金融投资者信赖的主体。同一主体具有多重身份难免在面临价值选择和利益衡量时陷入冲突的困境。忠实义务为冲突性价值和利益选择设定了标准。当投资者利益与包括投资顾问个人或机构在内的其他人的利益发生冲突时，需要优先考虑投资者的利益。投资顾问需要为投资者推荐最大化投资者利益（best
    interest rule）而非有利于金融机构或自己的金融产品。


    智能投资顾问机器（人）并没有独立的利益主张或需要，不会因个人利益或情感与投资者利益发生冲突。从这一意义上讲，智能投资顾问机器（人）比人类投资顾问更为理性，更有利于实现投资者利益最大化。但是，这并不意味着智能投资顾问机器（人）的决策和行为是绝对理性、客观的。智能投资顾问运营者可以通过程序设计以代码的方式操控智能投资顾问的行为或决策。“智能投资顾问语境下信义义务规制的重点在于，通过忠实义务的设定避免算法中包含损害投资者利益的设置。”^([\[35\]](#txt007.html#footnote_content_txt007_35))


    智能投资顾问的行为和决策是在算法黑箱中完成的。对于缺乏专业技术知识的投资者而言，其只能被动地接受生成的投资建议，难以判断生成过程及结果的合理性与正当性。智能投资顾问运营者是否通过算法谋取私利，投资者无从知晓，这就需要法定主义调整方式的介入。“需要注意的是，在证券法上，对投顾过程中的利益冲突主要是通过一种‘基于披露’，而非‘基于绩效’的标准来调整。”^([\[36\]](#txt007.html#footnote_content_txt007_36))智能投资顾问运营者信息披露需要满足真实、准确、完整、及时、易读等要求。算法代码披露是智能投资顾问运营者披露信息的主要方式，对投资者利益算法披露的范围限于算法逻辑和预期结果，而非源代码。^([\[37\]](#txt007.html#footnote_content_txt007_37))


    ## 第三节 智能投资顾问业务中运营者的民事法律责任

    ### 一、责任主体的识别

    #### （一）智能投资顾问机器（人）不作为责任主体

    ##### 1. 辅助工具说

    智能投资顾问机器（人）提供的服务不过是人类预先设定的算法或程序的外在展示。智能投资顾问机器（人）在提供服务的过程中，缺乏独立的意志，其自主决策或行为并未超过程序设计员的预期。即便是不需要人工干预的智能投资顾问机器（人）也未脱离工具属性，“智能投顾的存在仅仅是为了实现其背后的投资顾问服务机构所设定的单一目的，即为投资者选择合适的投资方案并执行，故应当由智能投顾运营者为其设计和运营的智能投顾承担责任。”^([\[38\]](#txt007.html#footnote_content_txt007_38))


    ##### 2. 电子代理人说

    美国《统一计算机信息交易法》第102 条第28 项对电子代理人的概念进行了界定。根据该条文，电子代理人是无需人的介入而能够独立就电子信息进行回应或行为的自动化工具。根据代理理论，电子代理人是交易主体的代理人，交易活动的后果由交易主体而非电子代理人承担。“在Michael
    D.GREEN v.MORNINGSTAR，INC.案中，原告是接受智能投顾服务的投资者，其认为被告所运营的智能投顾机器人在运行中具有建议投资者选择昂贵的投资项目倾向，即投资者遭受了被告公司的不公平对待。”^([\[39\]](#txt007.html#footnote_content_txt007_39))此时应由智能投资顾问运营者而非智能投资顾问机器（人）对第三人承担民事法律责任。


    ##### 3. 揭开技术面纱说

    事物的表象与本质之间不一致，这就需要采用穿透式的方式确定投资服务主体^([\[40\]](#txt007.html#footnote_content_txt007_40))并选择责任承担主体。采用穿透技术是为了透过表象发现本质，否则会出现民事责任虚设的情况，导致民事责任机制失灵，损害金融投资者对智能投资顾问市场的信心。智能投资顾问中直接提供投资咨询服务的是智能产品，它基于算法和数据形成判断。人工智能技术的专业性使得复杂的金融结构和法律关系扑朔迷离，在神秘的技术面纱下责任主体识别陷入困境。人工智能系统的介入切断了金融机构及人员与投资者之间的直接关系，为投资者提供咨询和中介业务的主体由原先的自然人转变为智能投资顾问系统，这就使得传统的以金融从业人员为主要对象的金融监管政策和法律失灵，出现法律体系和监管层面的漏洞。^([\[41\]](#txt007.html#footnote_content_txt007_41))人工智能技术成为规避严格金融监管的工具。在弱人工智能时代智能投资顾问系统仍然是一种工具性的存在，尚不符合戴维森所谓的“有意识的代理人”的要求。^([\[42\]](#txt007.html#footnote_content_txt007_42))智能投资顾问系统的技术性特征不能作为逃避或推卸责任的借口，不应成为人类犯错时的替罪羊。


    #### （二）智能投资顾问运营者自主设计算法时的责任主体

    智能投资顾问系统不具有独立主体资格，因其导致的损失需要依法定或约定的方式确定，由机构或自然人作为义务和责任的主体，否则会出现无人承担义务或责任的状况，导致义务或责任机制失灵。

    '
  trans: '


    资产管理业务与投资咨询业务相区别。资产管理超过了投资咨询概念的涵摄范围，被排除在投资咨询之外。资产管理业务中受托人基于协议或投资计划有权对委托人的资产进行投资、管理；而投资咨询业务是为投资者提供投资建议。投资咨询与资产管理中投资决定权的行使主体不同，投资咨询中投资决定权属于客户，而资产管理中投资决定权通过委托方式转移至资产管理者。


    法律条文中对“投资顾问”的解释难以涵盖现实生活中智能投资顾问的类型，法律规定与现实生活产生隔离。“我国多数学者忽视了智能投顾含义在国别上的差异，将其视为‘投资顾问’或者‘投资咨询’的新形态，立法也未能及时跟进，如此一来，在规范智能投顾的问题上，遂出现立法缺位、规范无据和监管错位的尴尬情况。”^([\[18\]](#txt007.html#footnote_content_txt007_18))


    ## 3. 我国智能投资顾问概念的应然选择

    人工智能时代投资顾问业务功能应实现多元化。“随着投顾主体的虚拟智能化，投资顾问已由最初单纯的投资咨询建议，转变为兼具资产管理与投资咨询双重性质的金融服务。”^([\[19\]](#txt007.html#footnote_content_txt007_19))智能投资顾问的重心不在于投资咨询而在于资产管理。为应对瞬息万变的投资市场，智能投资顾问系统需要在较短的时间内完成提供投资组合建议、发出交易指令、执行交易指令以及投资组合再平衡的过程。智能投资顾问系统为投资者进行实时资产配置的前提是全权管理投资者的资金账户。智能投资顾问业务的重心由投资咨询转向资产管理后，投资者全权委托智能投资顾问经营者管理账户属于常态化现象。监管机构倾向于将智能投资顾问作为类似资产管理的业务形态进行监管。有学者建议我国立法采用广义投资顾问的概念，将资产管理涵盖在投资顾问中，建立统一的金融牌照管理制度。


    ## 二、智能投资顾问的特征

    ### （一）虚拟化

    传统投资顾问业务具有对人的依赖性，人与人之间面对面的服务是典型方式。智能投资顾问通过智能设备自动完成投资咨询和资产管理，淡化了对物理网点的基础设施和人的依赖。投资顾问服务提供者从自然人转变为智能投资顾问系统是智能投资顾问最显著的特征。“反应性、机动性和代表性这三个根本特征使得智能投资顾问具有了类似人类代理人的特征。”^([\[20\]](#txt007.html#footnote_content_txt007_20))


    ### （二）自主性

    智能投资顾问系统通过对客户的风险偏好以及承受能力进行分析，提供投资顾问服务或撮合交易。建立在算法和模型基础上的智能投资顾问能够在没有人类直接操控的情况下自主执行并完成任务，在观察和分析的基础上根据环境变化或场景转换作出应对，为他人提供咨询或中介服务。人工智能的自主性与人类生活的便捷性呈正相关关系，而与人类的控制呈负相关关系。


    ### （三）技术性与秘密性

    智能投资顾问是计算机科学和互联网技术应用于金融领域的成果，具有高度技术性。以算法和模型为基础的数据分析，涉及计算机、金融、信息处理等交叉学科。法律关注的重点从“如何做”转向“做什么”。“由于智能投顾整个算法运作体系以一系列经济假设为依托，如果该假设是错误的，或至少不适用于特定个体，那么由此得出的运算结果将不利于投资者。即使该假设是正确的，也难以完全抵挡市场的系统性风险。”^([\[21\]](#txt007.html#footnote_content_txt007_21))


    智能投资顾问的核心算法处于保密状态。算法的秘密性使得智能投资顾问服务领域出现鱼龙混杂、泥沙俱下的混乱场面。部分不具备智能投资顾问实力的公司通过过度包装，打着“智能理财”“大数据”“人工智能”的幌子从事智能投资顾问服务活动。


    ### （四）排除或削弱非理性因素

    自然人提供的投资顾问服务虽然具有一定的专业性，但是，难免受到外界环境或情绪等因素的干扰，从而提供非理性的投资顾问建议。智能投资顾问系统是建立在理性计算基础之上的，合理的算法设计能够在一定程度上矫正认知偏差，排除或削弱投资顾问服务中的非理性因素。


    ## 第二节 智能投资顾问业务中运营者的民事法律义务

    金融产品的复杂性以及信息的高度不对称使得投资者与金融机构在谈判、磋商以及风险防范方面的悬殊加剧，发生由投资者向消费者的角色转变。^([\[22\]](#txt007.html#footnote_content_txt007_22))投资者与金融机构及从业人员在事实上的不平等使得意定主义的法律调整方式暴露出缺陷。这就需要通过设定法定义务和责任的方式，矫正事实上的不平等，对投资者予以倾斜保护。


    ### 一、以信义义务为中心

    投资者信赖投资机构及从业人员的建议而为投资行为，这是投资者与投资机构之间信义关系产生的基础。“在传统的投资顾问模式下，为投资者提供顾问意见的专业人员与投资者之间因为专业关系而形成了信义关系，对投资者承担信义义务。”^([\[23\]](#txt007.html#footnote_content_txt007_23))自然人投资顾问基于学识、经验、常识、逻辑推理、直觉、职业伦理等进行专业判断并为投资者提供咨询或中介服务。自然人投资顾问在进行专业判断和提供服务的过程中难免出现需要进行利益衡量和选择的情况，这就需要通过信义义务对其进行规制。美国证监会诉资本收益研究局（SEC
    v.Capital Gains Research Bureau）一案中^([\[24\]](#txt007.html#footnote_content_txt007_24))，美国最高法院以委托关系为基础，通过解释《1940
    年投资顾问法》第 206 条，确立了投资顾问机构的信义义务。


    “假使由人工智能来充任投资顾问，即所谓的智能投顾，那么智能投顾是否也同样负有信义义务呢？其中一个关键问题在于，人类在开发智能投顾时，可以也应该将信义义务的具体要求内化于其决策模型之中，因而能够响应法律的要求构建或训练这种决策模型的，显然只有人类本身。”^([\[25\]](#txt007.html#footnote_content_txt007_25))在智能投资顾问活动中，智能投资顾问系统对投资者账户中资产的配置与处分拥有一定程度的决定权，投资者基于对智能投资顾问的信赖从事投资行为。为保护投资者的信赖利益，需要智能投资顾问运营者负有信义义务，不得因利益冲突实施欺诈投资者的行为。


    智能投资顾问运营者通过智能投资顾问系统进行相关业务活动，智能投资顾问系统中参数设定是否合理是判断其运营者是否履行了信义义务的重要标准。“美国金融业监管局的报告要求，在检验有无利益冲突时，要考虑算法中是否包含会引发利益冲突的参数，尤其在组合投资中，如果输出的结果偏向于某些金融产品，那么运营者有义务解释原因，并且需要将输出的结果与未选择的类似产品的优劣作对比。”^([\[26\]](#txt007.html#footnote_content_txt007_26))我国未来立法需要对智能投资顾问运营者施加强制性的参数说明义务，禁止智能投资顾问运营者在程序中设置损害投资者利益的参数。


    ### 二、义务群体系

    智能投资顾问信义义务的理论基础是“客户最佳利益原则”，即智能投资顾问需要以客户利益最大化为行为宗旨或目标。智能投资顾问系统根据客户的财务状况、心理承受能力、投资意愿和目标为客户提供合理的投资建议以及资产管理服务。一般认为，投资顾问业务中的信义义务可以分解为勤勉义务和忠实义务。^([\[27\]](#txt007.html#footnote_content_txt007_27))勤勉义务要求智能投资顾问机构在为消费者提供服务时需保持如同处理自己事务一般勤勉、谨慎。勤勉义务又可细化为投资者适当性义务、胜任性义务和谨慎义务。忠实义务要求智能投资顾问机构在利益冲突的场景以消费者利益最大化为目标。


    #### （一）勤勉义务

    ##### 1. 投资者适当性义务

    投资者适当性义务，又称隔离义务，是指投资顾问机构或从业人员向金融投资者或消费者提供的产品或服务需要与金融消费者的财务状况、风险承受能力、投资经验等相匹配，将不符合风险承受能力要求的投资者隔离在相应金融产品之外。^([\[28\]](#txt007.html#footnote_content_txt007_28))这一起源于美国的金融法治原则得到其他国家和国际组织的认同，成为金融法治体系建设中的重要内容。^([\[29\]](#txt007.html#footnote_content_txt007_29))在智能投资顾问服务模式下，人工成本降低，投资顾问服务业务惠及大众。但是，让大众享受优质服务的普惠金融是一柄双刃剑。社会大众往往缺乏投资经验和能力，智能投资顾问运营者可能利用经济或技术等方面的优势侵害投资者利益，因此适当性义务的要求需要更为严格。而且金融消费者的财务状况、投资需求和风险承受能力处于动态变化之中，适应性义务也需要根据该变化进行动态调整。


    精准客户画像是智能投资顾问提供投资建议或资产管理服务的前提。而精准客户画像往往是通过标准化调查问卷实现的。标准化调查问卷是智能投资顾问平台获取信息的方式。调查问卷设计的科学性及合理性直接影响智能投资顾问对客户财产状况以及风险承担能力的评估，影响客户画像的精准性。智能系统通过问卷方式搜集的信息尚且不能达到自然人投资顾问搜集信息的真实性和完整性程度，对智能投资顾问系统负有监督和检查义务的主体需要介入，直接与投资者接触，获取或补充信息，从而满足在信息搜集方面的需要。“我国未来立法有必要对问卷设计设定基本的要求，保证其具备收集必要信息的能力、回应冲突信息的能力以及持续更新信息的能力。”^([\[30\]](#txt007.html#footnote_content_txt007_30))当然，智能投资顾问业务运营以投资者或消费者提供的信息为基础判断其适当性，需要培养理性投资者或消费者的观点。预先设定的算法的质量取决于数据的真实性和覆盖面等因素，数据的不完全性也会影响算法。倘若投资者基于故意或过失提供了不真实或不准确的信息，误导智能投资顾问系统，使得智能投资顾问运营者未能准确判断投资者是否满足适当性要求，并基于误判给出投资建议或进行资产管理，相应的责任应由存在主观过错的投资者承担。


    ##### 2. 胜任性义务

    《证券法》第 160 条第 2 款对投资顾问机构的从业资格进行了规定。《关于规范金融机构资产管理业务指导意见》中规定：“运用人工智能技术开展投资顾问业务应当取得投资顾问资质，非金融机构不得借助智能投资顾问超范围经营或变相开展资产管理业务。”根据上述规定，从事智能投资顾问业务的运营主体需要具备执业资格并进行注册登记，否则为非法经营。监管部门通过行政许可的方式设定智能投资顾问的准入门槛在一定程度上能够保证行业有序、健康发展。但是，设置过于严苛的准入门槛甚至通过禁止核发牌照的方式在遏制智能投资顾问行业野蛮生长的同时也阻滞了行业发展，给金融市场持续、健康发展留下隐患。对于智能投资顾问业务宜疏不宜堵，需要创新金融科技监管手段和方法，在保障金融安全的同时促进金融创新。


    ##### 3. 谨慎义务

    负有谨慎义务的智能投资顾问运营者需要按照同行业中类似智能投资顾问运营者的标准谨慎行事。“智能投资顾问业务中的受托人负有保证算法能够执行预期任务的谨慎义务，确保不会产生超出合理范围的偏差而导致投资者利益受损。”^([\[31\]](#txt007.html#footnote_content_txt007_31))自然人形态的投资顾问面对的投资者是确定的，投资顾问针对特定投资主体在特定的市场环境下提供投资策略或方案。智能投资顾问面向的投资者是未来可能出现的不特定的主体，投资的市场环境也处于变化中。因而，智能投资顾问运营者承担谨慎义务需要考虑的对象是未来不特定的投资主体，而非单个特定的投资主体。


    #### （二）忠实义务

    利益冲突是指不同类型的利益同时存在并互相排斥的情形。智能投资顾问中的利益冲突存在直接冲突和间接冲突两种类型。^([\[32\]](#txt007.html#footnote_content_txt007_32))直接冲突是指在智能投资顾问中，投资者与智能投资顾问经营者之间发生的利益冲突，主要表现为智能投资顾问经营者为了自身利益最大化在提供投资顾问服务时通过自我交易或双方代理等方式侵害投资者的利益。“间接利益冲突的主体是‘投资公司的关联者、运营者和主要收购者’，法律禁止其‘对该投资公司的证券或者其他资产的买卖行为和金钱借贷行为’。”^([\[33\]](#txt007.html#footnote_content_txt007_33))投资顾问的忠实义务要求其行为以投资者利益最大化而非运营主体利益最大化为出发点。“基于利益冲突的忠实义务虽然可以通过顾客的同意被豁免，但忠实义务中的善意义务却无法被豁免。”^([\[34\]](#txt007.html#footnote_content_txt007_34))


    在自然人形态的投资顾问活动中，作为投资顾问的自然人身份具有多重性。一方面，作为投资顾问的自然人基于与金融机构的劳动合同关系是金融机构的工作人员；另一方面，作为投资顾问的自然人又是金融投资者信赖的主体。同一主体具有多重身份难免在面临价值选择和利益衡量时陷入冲突的困境。忠实义务为冲突性价值和利益选择设定了标准。当投资者利益与包括投资顾问个人或机构在内的其他人的利益发生冲突时，需要优先考虑投资者的利益。投资顾问需要为投资者推荐最大化投资者利益（best
    interest rule）而非有利于金融机构或自己的金融产品。


    智能投资顾问机器（人）并没有独立的利益主张或需要，不会因个人利益或情感与投资者利益发生冲突。从这一意义上讲，智能投资顾问机器（人）比人类投资顾问更为理性，更有利于实现投资者利益最大化。但是，这并不意味着智能投资顾问机器（人）的决策和行为是绝对理性、客观的。智能投资顾问运营者可以通过程序设计以代码的方式操控智能投资顾问的行为或决策。“智能投资顾问语境下信义义务规制的重点在于，通过忠实义务的设定避免算法中包含损害投资者利益的设置。”^([\[35\]](#txt007.html#footnote_content_txt007_35))


    智能投资顾问的行为和决策是在算法黑箱中完成的。对于缺乏专业技术知识的投资者而言，其只能被动地接受生成的投资建议，难以判断生成过程及结果的合理性与正当性。智能投资顾问运营者是否通过算法谋取私利，投资者无从知晓，这就需要法定主义调整方式的介入。“需要注意的是，在证券法上，对投顾过程中的利益冲突主要是通过一种‘基于披露’，而非‘基于绩效’的标准来调整。”^([\[36\]](#txt007.html#footnote_content_txt007_36))智能投资顾问运营者信息披露需要满足真实、准确、完整、及时、易读等要求。算法代码披露是智能投资顾问运营者披露信息的主要方式，对投资者利益算法披露的范围限于算法逻辑和预期结果，而非源代码。^([\[37\]](#txt007.html#footnote_content_txt007_37))


    ## 第三节 智能投资顾问业务中运营者的民事法律责任

    ### 一、责任主体的识别

    #### （一）智能投资顾问机器（人）不作为责任主体

    ##### 1. 辅助工具说

    智能投资顾问机器（人）提供的服务不过是人类预先设定的算法或程序的外在展示。智能投资顾问机器（人）在提供服务的过程中，缺乏独立的意志，其自主决策或行为并未超过程序设计员的预期。即便是不需要人工干预的智能投资顾问机器（人）也未脱离工具属性，“智能投顾的存在仅仅是为了实现其背后的投资顾问服务机构所设定的单一目的，即为投资者选择合适的投资方案并执行，故应当由智能投顾运营者为其设计和运营的智能投顾承担责任。”^([\[38\]](#txt007.html#footnote_content_txt007_38))


    ##### 2. 电子代理人说

    美国《统一计算机信息交易法》第 102 条第 28 项对电子代理人的概念进行了界定。根据该条文，电子代理人是无需人的介入而能够独立就电子信息进行回应或行为的自动化工具。根据代理理论，电子代理人是交易主体的代理人，交易活动的后果由交易主体而非电子代理人承担。“在
    Michael D.GREEN v.MORNINGSTAR，INC.案中，原告是接受智能投顾服务的投资者，其认为被告所运营的智能投顾机器人在运行中具有建议投资者选择昂贵的投资项目倾向，即投资者遭受了被告公司的不公平对待。”^([\[39\]](#txt007.html#footnote_content_txt007_39))此时应由智能投资顾问运营者而非智能投资顾问机器（人）对第三人承担民事法律责任。


    ##### 3. 揭开技术面纱说

    事物的表象与本质之间不一致，这就需要采用穿透式的方式确定投资服务主体^([\[40\]](#txt007.html#footnote_content_txt007_40))并选择责任承担主体。采用穿透技术是为了透过表象发现本质，否则会出现民事责任虚设的情况，导致民事责任机制失灵，损害金融投资者对智能投资顾问市场的信心。智能投资顾问中直接提供投资咨询服务的是智能产品，它基于算法和数据形成判断。人工智能技术的专业性使得复杂的金融结构和法律关系扑朔迷离，在神秘的技术面纱下责任主体识别陷入困境。人工智能系统的介入切断了金融机构及人员与投资者之间的直接关系，为投资者提供咨询和中介业务的主体由原先的自然人转变为智能投资顾问系统，这就使得传统的以金融从业人员为主要对象的金融监管政策和法律失灵，出现法律体系和监管层面的漏洞。^([\[41\]](#txt007.html#footnote_content_txt007_41))人工智能技术成为规避严格金融监管的工具。在弱人工智能时代智能投资顾问系统仍然是一种工具性的存在，尚不符合戴维森所谓的“有意识的代理人”的要求。^([\[42\]](#txt007.html#footnote_content_txt007_42))智能投资顾问系统的技术性特征不能作为逃避或推卸责任的借口，不应成为人类犯错时的替罪羊。


    #### （二）智能投资顾问运营者自主设计算法时的责任主体

    智能投资顾问系统不具有独立主体资格，因其导致的损失需要依法定或约定的方式确定，由机构或自然人作为义务和责任的主体，否则会出现无人承担义务或责任的状况，导致义务或责任机制失灵。


