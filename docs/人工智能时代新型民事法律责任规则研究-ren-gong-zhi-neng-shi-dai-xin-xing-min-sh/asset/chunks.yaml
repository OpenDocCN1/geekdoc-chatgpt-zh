    # 第七章　人工智能时代责任规则的嬗变


    风险可以分为合法风险和非法风险，因智能技术创新而产生的风险通常属于合法风险。人工智能技术的研发与应用在推动社会进步和经济繁荣方面起到了重要作用，在此过程中发生的部分事故并非人为原因导致，不受到人的意志控制，参与人工智能技术研发和应用的主体并无道德上的可责难性。将损害转嫁给道德上并无可责难性的参与主体并不能对其产生威慑作用，也不会使参与主体更加注意提升技术安全水平。相反，让无道德可责难性的参与主体承担损害结果会限制技术创新。因而，人工智能时代民事法律责任规则设计的重心从责任承担转向损害分配。民事法律责任制度分散损失的功能强化，而惩戒功能弱化。自主智能机器（人）致害的法律责任中追责的意义减弱，而救济成为核心和关键。人工智能时代，责任规则发生嬗变，责任制度的部分功能转移至责任保险和赔偿基金等方面。


    ## 第一节　责任保险制度


    “人工智能”+“保险”的方式具有多面性。一方面，人工智能的出现对传统保险行业造成冲击，改造或重塑了保险行业，如将人工智能技术应用于风险预测与防范、数据管理、费率厘定、核保理赔、监管领域。另一方面，保险作为一种分散风险和损失补偿的工具对人工智能时代新型的民商事法律责任制度产生影响。本书将保险作为分散人工智能机器或设备造成损失的工具，研究保险与法律责任制度的互动关系，通过保险分散风险的社会功能使权利救济和保障行业创新能力的需要同时得到满足。


    人工智能时代智能机器（人）的决策和行为具有技术性、隐秘性等特征。证明缺陷、致害原因以及因果关系的困难使责任配置陷入困境。在鼓励人工智能技术研发与应用的同时要防范处于技术优势地位的一方当事人逃避责任，保障受害人获得充分救济，因此有必要发挥保险的风险转移功能。《欧盟机器人民事法律规则》议案对强制保险计划进行了设计，目的在于解决智能机器（人）致损的损失分担问题。在美国的部分州，投保责任保险是路测的基本条件。例如，内华达州2011
    年通过的《511 法案》（Assembly Bill NO.511-Com⁃mittee on Transportation）。日本的《公路测试无人驾驶车辆规则》规定，无人驾驶车辆测试人员对交通事故承担法律责任，但是该责任被纳入汽车保险的赔付范围。^([\[1\]](#txt008.html#footnote_content_txt008_1))英国的《自动与电动汽车法案》（Automated
    and Electric Vehecles Bill）第一部分针对智能驾驶汽车的保险与责任进行规定。其中，机动车强制责任保险条款被修改，智能驾驶汽车也可以投保。


    在智能投资顾问领域，因技术创新导致的部分损害不能苛责智能投资顾问运营者承担，但是由金融消费者承担也不具有合理性。倘若金融消费者遭受的损失无法获得有效填补，其对智能投资顾问机构和人员的信任度会降低，群体性“用脚投票”可能影响智能投资顾问市场的稳定性。这就需要通过强制保险的方式，将智能技术创新与发展过程中的部分风险分散出去。


    ### 一、责任制度与保险制度的关系


    侵权责任法存在的意义“主要在于填补损害，同时具有保护民事权益、教育和惩戒加害人以及分担损失平衡社会利益的功能”^([\[2\]](#txt008.html#footnote_content_txt008_2))。人工智能时代需要重新思考侵权责任制度的功能定位。侵权责任的预防和警示功能在人工智能时代出现弱化趋势，而作为一种管控方法的功能需求增强。“民事责任制度是民法对人工智能成果进行管控的主要方法。”^([\[3\]](#txt008.html#footnote_content_txt008_3))


    “侵权行为法诞生于没有社会保障制度和保险制度的时代，而现在它却受到了这些损失分配制度崛起的威胁。”^([\[4\]](#txt008.html#footnote_content_txt008_4))责任制度因保险制度的出现和发展需要进行调整。人工智能时代权利救济的有效性与充分性还需要配套制度建设，如强制责任保险和共同赔偿基金等制度，它们将在人工智能时代民事法律责任分散中起到越来越重要的作用，有利于保障人工智能行业健康发展以及社会秩序稳定。责任保险的存在增强了人工智能产品生产者的赔付能力，生产商能够运用价格机制分摊成本，在责任保险的保障下主动承担企业社会责任，扩大损失赔偿的范围。


    责任保险制度不会弱化或取代民事责任制度。责任保险的保险标的为责任，而这一责任恰恰需要通过民事责任制度来确定，责任保险为民事责任的分配和承担提供了新的思路和解决方案。换言之，民事责任制度具有行为指引和损害转移的功能，而责任保险制度关注损害填补和责任转移。民事责任制度是责任保险制度存在的前提，两者相辅相成，并不存在相互替代的关系。“尽管不少学者认为责任保险的存在对侵权法构成威胁，但实际上保险人支付的一切赔偿都是以侵权法确定致害人的责任为前提的，责任保险只不过是损害赔偿的一种承担方式而已。”^([\[5\]](#txt008.html#footnote_content_txt008_5))


    ### 二、责任保险的类型与模式


    智能机器（人）责任保险是以智能机器（人）致害需要承担的民事法律责任为标的的保险。智能机器（人）致害，责任保险的保险人首先需要向受害人进行赔偿，然后基于代位求偿权向导致责任产生的第三人进行追偿。


    #### （一）智能机器（人）事故责任保险


    我国机动车交通事故责任保险涵盖了机动车保有人责任保险和使用者责任保险。《民法典》第1213 条就机动车交通事故强制责任保险的适用进行了规定。《道路交通安全法》第76
    条确立了机动车交通事故强制责任保险优先赔付规则。根据《机动车交通事故责任强制保险条例》第2 条第1 款的规定，机动车所有人或管理人能够作为交通事故责任强制保险的投保主体。


    人工智能时代智能机器（人）事故责任保险包括两种类型：第一，以保有人责任为标的的责任保险。智能机器（人）的保有人基于保有智能机器（人）需要对第三人遭受的损害承担责任。“但现有的法律认为无人驾驶汽车如同所有者的工具，所有者应该对自动汽车的非主观以及不可预见的行为承担责任。”^([\[6\]](#txt008.html#footnote_content_txt008_6))智能汽车保有人在交强险责任限额外需要承担的赔偿责任则需要通过商业保险进行分散。这就有必要为适应人工智能时代的需要而改造传统的机动车责任保险制度，要求智能驾驶汽车的车主强制购买交通事故责任强制保险，并鼓励其购买商业第三者责任险。第二，以使用人责任为标的的责任保险。“使用或监督人工智能的人需要承担责任。”^([\[7\]](#txt008.html#footnote_content_txt008_7))使用智能机器（人）的主体想要将该责任风险分散出去就需要投保相应的责任保险。


    #### （二）智能机器（人）产品责任保险


    人工智能时代，以保有人和使用人责任为基础构建的责任保险制度，难以涵盖智能机器（人）设计者和制造者的责任。以智能驾驶为例，驾驶权从人类转移至智能机器（人），在人类驾驶员不存在主观过错甚至身份转变为乘客的情况下，从智能驾驶行为的控制和利益的角度考虑，智能机器（人）造成的损失不应归咎于保有人或使用人，机动车交通事故责任的救济机制就会出现缺陷，分散智能汽车设计者或制造者责任的产品责任保险机制应运而生。因人工智能产品缺陷造成损失的受害人不需要向产品生产者索赔，可以直接向保险公司索赔。


    #### （三）责任保险模式的更新


    传统机动车第三者责任保险中的责任指向对象是对第三者的侵权责任，产品责任不在机动车责任保险范围内。交通事故责任与产品责任截然分离，分别属于不同类型的保险所承保的范围。人工智能时代产品责任保险与机动车第三者责任保险能否以及如何进行整合成为关注的重心。固守传统的学者认为，产品责任风险与第三者责任风险属于不同类型的风险，在风险预防和定价等方面存在差异，纳入同一保险产品中存在技术困难。此外，“为了避免自动驾驶技术的研发者承担过多的法律责任，可以建立‘双轨制’的保险模式。”^([\[8\]](#txt008.html#footnote_content_txt008_8))一方面由智能驾驶汽车生产者为智能驾驶汽车设备投保；另一方面由智能驾驶汽车的保有人对其因未尽到审查、维修、养护、接管等义务而可能造成交通事故的风险进行投保。伴随智能技术的发展和应用升级，人类驾驶员的角色逐渐发生转变，不同类型的保险出现统一化趋势。冯珏博士认为：“可以考虑在时机成熟时，将自动驾驶领域的产品责任和机动车保有人责任合并升级为辅之以保险的制造商的无过错责任，而不再考虑产品缺陷的认定问题。”^([\[9\]](#txt008.html#footnote_content_txt008_9))英国的《自动与电动汽车法案》采用了“单一承保模型”（a
    single insurer model），智能汽车保险涵盖人类驾驶员和智能驾驶系统导致的损失，包括将驾驶控制权转移给智能驾驶系统的司机在内的受害人可以从保险公司获得赔付，依产品责任法或侵权责任法等法律法规负有直接责任的主体可以基于保险机制转移损失。


    总而言之，责任保险模式与智能技术研发与应用的程度密切相关。“单一承保模型”适用于生产者与行为控制者同一或重叠的情形，“双轨制承保模型”适用于生产者与行为控制者相区分的情形。也就是说，在智能机器（人）生产与智能服务分离的情形，“双轨制承保模型”具有优势；相反，在智能机器（人）生产与智能服务合一的情形，“单一承保模型”具有优势。由于智能产品生产与提供智能服务相融合的趋势明显，“单一承保模型”的社会需求增强。


    ### 三、限额赔偿


    对智能机器（人）的设计者、生产者或使用者在设计、制造和使用智能产品的过程中是否存在主观过错以及行为与结果之间的因果关系等问题的判断因智能技术的专业性、复杂性变得异常困难，遭受损失的主体往往会陷入因难于举证而无法获得救济的尴尬境地。减轻遭受损失的主体的义务和责任体现了法律对弱势群体利益的关照，具有正当性。保险制度的出现使智能机器（人）应用领域的归责原则发生从过错责任原则向无过错责任原则的转变，强化了对受害人的救济。但是，救济受害人不能成为智能产业创新的障碍，需要通过配套制度予以平衡和协调。


    在智能驾驶领域，部分国家或地区已经开始采用限额赔偿制度。在英国，就涉及自动驾驶汽车的任何事故所造成的财产损失而言，保险人或车主所承担的法律责任的数额限于《1988
    年道路交通法》第145 条第4 款（b）项所规定的数额。^([\[10\]](#txt008.html#footnote_content_txt008_10))保险公司承担赔付责任的数额限定在100
    万英镑内。《德国道路交通法》将智能驾驶汽车造成人身伤亡和财产损失的赔偿上限分别提高到了1000 万欧元和200 万欧元。我国需要在数据统计和分析的基础上，确定适当的赔偿限额，在受害人权利救济与智能产业创新和持续健康发展之间寻求平衡。


    受害人使用智能产品时故意或过失违反安全注意义务，保险人的限额赔付责任全部或部分免除。第一，共同过失（contributory negligence）。被保险人或第三人因主观过错而在不适当的情况下使用智能产品或智能功能导致损失。第二，篡改智能软件。被保险人或第三人擅自对智能软件进行更改，进而导致事故发生。第三，未更新智能软件。被保险人或第三人未按照保险条款的约定更新与安全密切相关的智能软件，进而导致事故发生。


    ## 第二节　双层保险制度设计


    “价格—安德森法案”由美国国会于1957 年通过，旨在储备充分的责任基金以补偿核能事故中的受害者，该法案设计了“双层保险框架”（two tiers insurance
    structure）。该“双层保险框架”兼顾受害人和核能运营公司的利益。一方面，“双层保险框架”简化了受害人的权利救济程序。受害人无需就加害人是否存在过错以及加害行为与损害结果之间是否存在因果关系举证。受害人证明自身存在损害即可获得相应的救济，有利于及时、充分、有效地保护受害人的合法权益。另一方面，“双层保险框架”限定了核能运营公司的责任范围，并为核能运营公司分散风险提供了可行的路径，有利于促进核能企业持续、健康发展。


    人工智能风险与核能风险类似，都是科技进步产生的新型社会风险。一方面，人工智能与核能都有利于推动社会发展与进步，具有巨大的正向社会效用；另一方面，人工智能风险与核能风险均具有高度的不确定性，其可能造成的潜在损害影响范围广、后果严重。分散人工智能风险与核能风险的方式亦存在类似之处。凯尔·科洛纳提出自动驾驶汽车的事故责任和风险分担可以借鉴美国核能行业“价格—安德森法案”（Price
    Anderson Act）所创建的“双层保险框架”（two tiers insurance structure）。^([\[11\]](#txt008.html#footnote_content_txt008_11))


