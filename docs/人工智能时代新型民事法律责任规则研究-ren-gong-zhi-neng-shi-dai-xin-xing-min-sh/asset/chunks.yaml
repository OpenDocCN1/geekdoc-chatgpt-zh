    \ in advanced artificial agents”，Minds and Machines，Vol.2，2012，pp.71-85.\n\n110.Warwick\
    \ K.，“Implications and consequences of robots with biological brains”，Ethics and\
    \ information technology，Vol.3，2010，pp.223-234.\n\n111.Bostrom N.，“How long before\
    \ superintelligence？”，linguistic and philosophical investigations，Vol.5，2006，pp.11-30.\n\
    \n\uFEFF\n\n后　记\n\n任何时代的技术革命都无法与人工智能时代的技术革命相比拟。以往的技术革命增强了人类征服大自然的能力，在主体与客体二元区分的框架中不断强化人类中心主义。人工智能技术革命模糊了主体与客体的界限，二元区分框架被解构，人类中心主义遭遇现实挑战。智能机器（人）的出现使得思维、意识甚至情感、灵性不再专属于人类，人造物具有了人的属性，关于人的本质的思考再次成为必要。更为严峻的是，智能主体多元化是否会改变甚至颠覆当下对现实世界的控制权结构？人类能否以及如何与智能机器（人）和谐相处？“奇点”是否会来临？人类是否会被智能机器（人）替代或奴役？人工智能技术革命将人类置于生死攸关的十字路口，当下的选择关乎未来人类社会的命运和走向。法律学人不应也不能在这一选择过程中缺位，思考法律与科技、法律与伦理的关系，在此基础上进行规则设计是其不可推卸的责任和使命。\n\
    \n无知者无畏。纯粹出于好奇，义无反顾地迷恋上了研究人工智能时代的法律规则。课题初获教育部人文社会科学青年基金立项时的喜悦记忆犹新。但是，凭一腔热情开启的学术之旅在研究中难免困难重重。研究过程中，我总有力不从心和后人一步的感觉。在代码和算法构筑的虚拟空间里，我犹如迷宫中的孩童，充满好奇而又无比恐慌，跌跌撞撞不得要领，在希望中狂奔，在失望中徘徊。与人工智能技术、伦理和法律相关的论文和专著层出不穷，疲于奔命地收集和整理资料成为学术探索的常态，灵光一现的思想火花尚未思考成熟便已经被师友或同行表述为文字。当然，举步维艰的学术研究之旅也是愉悦的。在带有想象色彩的未知法学领域畅想和设计，感悟法律与伦理、技术之间的关系，体会法律的严谨和技术的玄妙，着实令人心驰神往。喜悦与失落、茅塞顿开与迷茫困惑不分先后地接踵而至，让人时常处于喜怒无常的癫狂状况。\n\
    \n感谢中国人民大学的龙翼飞教授、王轶教授、姚辉教授、汤维建教授，中国政法大学的赵旭东教授，国家检察官学院的石少侠教授，北京大学的钱明星教授、刘凯湘教授，清华大学的崔建远教授，吉林大学的李建华教授，对外经济贸易大学的王国军教授，中央民族大学的匡爱民教授、段威教授，首都经济贸易大学的张世君教授、郑文科副教授，北京工商大学的李仁玉教授、吕来明教授以及在学术之路上曾给予我支持和鼓励的师友们。本书出版得到了北京工商大学学科评估专项经费（项目编号：19008020131）的资助，特此感谢。\n\
    \n感谢父母、岳父母和妻儿无私的支持和鼓励。你们包容了我无数次无中生有的情绪宣泄，也让我习惯了相对健康的生活方式。你们的陪伴是化解苦难和煎熬的良药。\n\n\
    春去秋来、花开花谢，无暇亦无心观赏。晨昏颠倒，在想象与现实之间穿梭。探寻未知世界的法律规则犹如堂吉诃德大战风车，虽看起来可笑却隐含着勇气和坚持。\n\n董　彪\n\
