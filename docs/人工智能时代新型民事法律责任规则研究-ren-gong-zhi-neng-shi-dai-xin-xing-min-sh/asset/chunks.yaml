    \ 年第8期。\n\n\uFEFF\n\n第五章　人工智能时代新型侵权责任规则\n\n“一般来讲，当一项新技术出现时，侵权责任索赔将会增加。”^([\\[1\\\
    ]](#txt006.html#footnote_content_txt006_1))人工智能在社会生活中的应用（如无人驾驶机动车运输货物、无人机高空拍摄、智能机器人伴读、工业机器人参与生产线作业）越来越广泛，侵权责任产生的可能性随之增加。人工智能产品侵权责任在整个民事法律责任体系中所占比重越来越大，以至于有学者将人工智能民事法律责任与侵权责任混同，认为“人工智能所涉及的民事责任通常表现为，智能机器人、自动驾驶汽车等人工智能产品侵害人身或财产而引起的侵权责任”^([\\\
    [2\\]](#txt006.html#footnote_content_txt006_2))。\n\n机器自主学习能力的不断增强使人类对人工智能的行为或决策越来越不可预见。“人工智能之侵权行为与以往利用计算机所为之侵权行为的本质区别在于：人在侵权行为中所起到的作用不同，利用计算机所为的侵权行为，计算机完全听命于人的操作指令，完全系该指示人从事侵权行为的工具。而人工智能基于机器学习和深度学习，已经能够自行判断、收集和学习新的数据。”^([\\\
    [3\\]](#txt006.html#footnote_content_txt006_3))目前，被视为物的人工智能产品被纳入传统侵权责任法律规范体系中予以调整并经由司法程序形成具有指导性或引导性的案例以及不成文的规则。但若智能机器（人）的自主性、创造性行为突破了人类对智能机器（人）的工具性假设，智能机器（人）就不同于普通的机器或工具，它不仅可以经程序设计独立从事重复性的活动，而且可能创设人类设计程序之外的新程序。传统侵权责任法律规范体系对人工智能产品的调整作用有限，人工智能自主行为造成的损害难以被纳入传统的侵权责任法律框架，实有必要反思和构建人工智能时代新型侵权责任规则。\n\
    \n第一节　人工智能时代侵权责任的归责原则\n\n归责原则是侵权责任人承担民事责任的基础。我国《民法典》“侵权责任编”中的归责原则体系由过错责任原则和无过错责任原则共同构建。^([\\\
    [4\\]](#txt006.html#footnote_content_txt006_4))其中，过错责任原则是侵权责任法归责原则体系中的主体，无过错责任原则是过错责任原则的补充。“在近代法中，过错与侵权是同一的。无过错责任则是工业化的产物，是法定的个别规则。”^([\\\
    [5\\]](#txt006.html#footnote_content_txt006_5))换言之，在法律没有明确规定适用无过错责任原则的情况下均适用过错责任原则。\n\
    \n一、过错责任原则\n\n过错是对人的主观心理状态的描述，过错责任原则强调行为主体的主观状态。判断是否有过错通常采用理性人标准。理性人能否合理预见其决策或行为的后果是判断主体是否存在过错进而确定其是否应当承担过错责任的基础。“如果应预见而没有预见，行为人就具有过错，应该对此种行为承担责任。如果受害人没有预见，这就可以减免侵权人责任。”^([\\\
    [6\\]](#txt006.html#footnote_content_txt006_6))\n\n（一）智能机器（人）承担过错责任存在的疑问\n\n智能机器（人）是否具备独立的法律主体地位是探讨过错责任原则能否适用于智能机器（人）的前提条件。将过错责任原则引入智能机器（人）导致的侵权责任体系，首先需要明确存在过错的主体，即谁之过错？2016\
    \ 年联合国教科文组织通过的《关于机器人伦理的初步草案报告》将人工智能系统或设备定性为产品，通过产品责任制度解决人工智能系统或设备导致的侵权损害赔偿问题。倘若智能机器（人）被定位为产品，并没有独立的民事主体地位，则过错无可依附，更无所谓智能机器（人）是否存在主观过错以及其是否需要为此过错承担责任的问题。即便认定智能机器（人）存在过错，需要承担法律责任，因其无独立的法律地位和财产也无法对受害者予以救济。\n\
    \n（二）智能机器（人）使用者承担过错责任存在的疑问\n\n在对人工智能产品进行常态使用的情况下，具有智能特征的人工智能产品的决策和行为具有相对自主性，使用者既不需要直接操控人工智能产品，也不需要根据周边环境对其决策或行为进行干预。使用者的注意义务被淡化甚至消失，成为不存在主观过错的“无辜者”。“人工智能实现了无人化的操作，导致其使用者不再负有主观上的注意义务，使得过错归责原则最终变得无所适从。”^([\\\
    [7\\]](#txt006.html#footnote_content_txt006_7))\n\n（三）智能机器（人）销售者承担过错责任存在的疑问\n\n\
    《产品质量法》第42 条以及《民法典》第1203 条规定销售者对产品缺陷承担过错责任。根据上述规定，智能机器（人）的销售者需要承担其在销售过程中因过错导致的侵权责任。“销售者的过错责任主要表现为进货检查与验收不当、验明合格证明或标识不当以及保持产品质量不当等方面”。^([\\\
    [8\\]](#txt006.html#footnote_content_txt006_8))关于智能机器（人）销售者的过错如何判断、对应的责任如何承担等问题的答案尚不明确。\n\
    \n二、无过错责任原则\n\n无过错责任原则起源于资本主义时期。机器的大规模出现和运用使机器事故频发而受害者无法得到救济的情况普遍存在，无过错责任原则应运而生。我国《产品质量法》第41\
    \ 条以及《民法典》第1202 条明确规定生产者对产品缺陷承担无过错责任。人工智能时代客观归责替代主观归责成为一种发展趋势。“以过错责任为基础建立的‘风险分配’责任体系，在未来的交通法规中将不复存在。对于交通事故的认定，其归责事由只有结果的‘对与错’，而无主观上的‘故意’或‘过失’。”^([\\\
    [9\\]](#txt006.html#footnote_content_txt006_9))在无过错责任的框架下，受害人仅需证明智能机器（人）的行为或决策与损害结果之间存在因果关系即可，至于主观过错并非所问。另有学者主张区分情形限定无过错责任原则的适用范围，如根据智能机器人是否通过审批程序进而确定归责原则。“对于通过监管机构审批的智能机器人，制造商实质上将只承担有限的侵权责任……对于没有经过审批的人工智能系统，制造商等法律主体应当承担严格责任，而且该责任是连带的”。^([\\\
    [10\\]](#txt006.html#footnote_content_txt006_10))\n\n关于智能机器（人）致人损害适用无过错责任原则的正当理由问题在认识上存在分歧。有学者认为：“但智能机器人的严格责任的出发点不是‘异常危险’或者‘不合理危险’。”^([\\\
    [11\\]](#txt006.html#footnote_content_txt006_11))有必要从权利救济、风险预防与分散、交易成本、事实查明等角度分析人工智能时代适用无过错责任原则的正当理由。\n\
    \n（一）为无过错的受害人提供救济：两害相权取其轻\n\n无过错责任原则关注社会整体利益、社会群体的话语权以及社会秩序。在受害人对遭受的损失不存在过错的情况下，让其对外来之力导致的损害承担责任存在有悖法理之嫌。“在因果链条无法解释的情况下让一个个体自己承担所遭受的损失，与公正、分配正义、风险分担等基本观念背道而驰。”^([\\\
    [12\\]](#txt006.html#footnote_content_txt006_12))值得注意的是，损失补偿的正当性与损失分配是两个不同的命题。无过错的受害人应当获得救济并不等同于损失赔偿责任必须由智能机器（人）的制造者、所有者或利用者承担。在各方参与主体均不具有可归责的过错时，让无过错的智能机器（人）的制造者、设计者、所有者或利用者承担责任是两害相权取其轻的做法。\n\
    \n（二）风险的预防与分散\n\n技术更新是一柄双刃剑，一方面，技术更新有利于社会进步和发展；另一方面，技术更新的风险会带来损害。当技术更新作为既定的选择方案时，就需要从社会整体的视角考察不同类型主体控制和分散风险的能力进而配置技术更新产生的风险。智能机器（人）的制造者、所有者或利用者在控制和分散风险方面具有优势。在过错难以判断、责任无法分清的情形下，由部分参与主体承担无过错责任，能够强化该类主体的责任意识，更多地尽到注意义务，预防风险发生。此外，制造者、所有者或利用者能够通过定价等方式分散损失。即便智能机器（人）的行为具有一定的自主性，该自主性也是由设计者、生产者设定的目的所决定的。“若设计者、生产者出于善意设计、制造的智能机器人侵犯了他人的权益，他人无须证明智能机器人过错与否，即应以‘无过错责任’对智能机器人予以归责。”^([\\\
    [13\\]](#txt006.html#footnote_content_txt006_13))\n\n（三）节省交易成本"
