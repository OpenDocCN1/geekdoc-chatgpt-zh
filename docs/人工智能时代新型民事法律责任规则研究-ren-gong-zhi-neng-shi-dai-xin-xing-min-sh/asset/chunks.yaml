- raw: '“人工智能是人控制之下的，人能力的延伸物，它本身没有内源性的行为能力，也没有内源性的权利能力。”^([\[20\]](#txt005.html#footnote_content_txt005_20))智能机器（人）作出判断的基础并非自由意志，而是数据分析。基于数据分析进行动态实时判断不能被认为是独立意思表示的结果。智能机器（人）决策或行为的目的从属于人类，因而智能机器（人）本质上属于机器，不具有独立的法律主体资格。“人工智能是孙悟空，而人类却是如来佛和唐僧。”^([\[21\]](#txt005.html#footnote_content_txt005_21))


    智能机器人的名称中虽然有人的字样，但是这里的人是在非严格意义上人类对具有部分人类特征的机器的称谓。智能机器（人）是人类制造的、具有部分与人类相同或相近要素的产品，即便它可能具有人的外形、类似于人类的智慧、独立意志和相对独立的社会角色，也只是物而不是人，不具有人格，不过是特殊的工具。“高端智能机器人虽然有人的外观形象，有人的一些功能，可以实施某些类似于人的行为甚至有一定自主性的行为，但它的基本属性仍然是物。”^([\[22\]](#txt005.html#footnote_content_txt005_22))赋予智能机器（人）法律主体资格并无必要，不能假借法律主体制度逃避责任。在“姆拉塞克诉布林矛尔医院”（Marcek
    v.Bryn Mawr Hospital）一案中，法院将因达芬奇医疗机器（人）故障造成的损害认定为产品责任，并依据《美国侵权法重述（第二版）》第402 条a
    款作出判决。“通过这一案件我们认识到：当机器人致害时，现行法律实践仅将其认定为产品或者权利客体而非法律主体。”^([\[23\]](#txt005.html#footnote_content_txt005_23))


    智能机器（人）不同于自然人，也不同于自然人集合体的法人。自然人是当然的意思表示主体。法人和非法人组织的意思表示是由自然人组成的机构实现的，其意思表示的主体可以追溯至自然人。智能机器（人）工作的素材是人类输入的特定领域的知识，其行为性质缺乏独立的目的性和自主意识，因而“将其作为拟制之人以享有法律主体资格，在法理上尚有斟榷之处”^([\[24\]](#txt005.html#footnote_content_txt005_24))。将智能机器（人）与法人进行类比论证忽略了“自然人之于法人”的重要意义，无法在理论层面完成证成。^([\[25\]](#txt005.html#footnote_content_txt005_25))“公司与机器人的重大区别在于，公司总是‘通过’人类来运营。”^([\[26\]](#txt005.html#footnote_content_txt005_26))


    （1）工具说


    工具说严格划定人类与作为人类创造物的智能机器（人）之间的边界，并坚守主体与客体二元划分的逻辑框架，将智能机器（人）归入与主体相对应的机器的范畴。智能机器（人）是人类创造的产物，其最初的定位为客体而非主体。“人工智能缺乏作为自然人的自我意识、理性和道德感，缺乏人类之‘灵性’，没有需要保护的伦理价值，其本质上只是一台机器。”^([\[27\]](#txt005.html#footnote_content_txt005_27))有学者对工具说提出质疑，认为该说忽视或否认智能机器（人）的智能属性，与人工智能技术不断发展和进步的趋势相悖。“这种学说的弊端在于忽略了人工智能的自主性，人工智能技术目前已经发展到可以独立表达自己意思并作出行为的阶段，如特斯拉汽车可实现无人驾驶，在这一点上，人工智能早已超越传统的工具。”^([\[28\]](#txt005.html#footnote_content_txt005_28))“索菲亚”“帕罗”缘何能够取得国籍或户籍？当然，就该质疑也存在两点疑问：第一，技术发展是否已经到了智能机器（人）能够独立、自主为意思表示和行为的阶段？第二，智能机器（人）不同于传统的工具能否作为智能机器（人）脱离工具的行列进入主体范畴的充分理由？


    （2）人工类人格说


    持否定说的学者也并非一概否认人格制度适用于智能机器（人）的可能性。有学者跳出非此即彼的思维方式，寻求介于主体与客体之间的第三种主体形态，提出“人工类人格”的概念，认为“人工类人格是智能机器人所享有的，通过人工制造的类似于或者接近于自然人人格的民事法律地位”^([\[29\]](#txt005.html#footnote_content_txt005_29))。赋予智能机器（人）人工类人格是在典型的法律意义上的主体与客体之间发现第三种存在形态。智能机器人正是因为具有人工类人格，才区别于普通的物，也区别于普通的产品，属于物的最高类型即伦理物格的物。^([\[30\]](#txt005.html#footnote_content_txt005_30))


    智能机器（人）的工具性法律人格以财产相对独立或资产特定化为前提。但财产独立或资产特定化作为主体隔离资产和限制责任范围的手段并非人工智能时代首创。法人制度的创设在主体拥有的不同类型的财产之间设置了防火墙，所需承担的责任被限定在预先安排的范围内。该制度解决了因商事活动失败而导致商事主体承担的责任无限扩大进而影响个人生活或其他商事活动的问题，为商事主体从事创新活动提供了制度保障，排除了后顾之忧。法人制度的资产隔离和特定化效果为商事活动创新和社会发展繁荣做出了重大贡献。智能机器（人）的工具性法律人格仍然是以人类主义为中心的。人工类人格说需要以智能机器（人）登记作为配套制度设计。“每一台人工智能都需到监管部门强制登记，获得‘身份证’，确定其专属管理人。”^([\[31\]](#txt005.html#footnote_content_txt005_31))这一做法的目的在于进行身份识别。^([\[32\]](#txt005.html#footnote_content_txt005_32))“我国应当建立机器人强制登记制度，确保机器人在推向社会之前获得唯一的编号。这既是机器人权责追溯的必要保证，也是确立个体机器人法律主体地位的基础。”^([\[33\]](#txt005.html#footnote_content_txt005_33))为满足责任追溯的需要，《就机器人民事法律规则向欧盟委员会提出立法建议的报告草案》提出了对智能机器（人）进行分类并引入登记制度的设想。智能机器（人）登记分为自愿登记和强制登记。《格里申法案》规定了机器（人）自愿登记制度。未登记的机器（人）不能作为代理人，不能取得权利主体地位。^([\[34\]](#txt005.html#footnote_content_txt005_34))


    权利客体说的依据包括以下几种学说：


    （1）无独立财产说


    有学者认为，是否拥有独立财产是判断智能机器（人）是否拥有独立人格的考量因素，基于智能机器（人）没有独立财产推论其不享有独立法律人格。社会实体转变为法律意义上的人需要满足形式和实质双重要件。“物质性要件是指，拥有从事活动所需的财产或其它必要条件。相对于意志能力，物质性要件是判断法律人格的‘形’。”^([\[35\]](#txt005.html#footnote_content_txt005_35))这一观点有颠倒责任主体资格与财产独立性之间的因果关系之嫌，是以实然推论应然，合理性存在疑问。智能机器（人）不具有独立法律人格是其不能独立享有财产权的原因，不能基于智能机器（人）名下没有财产就认为其不能取得法律人格。在制度设计的层面，赋予智能机器（人）法律人格，将财产登记在其名下或由其占有并不存在技术上的障碍。此外，财产是否需要他人进行管理并不影响财产权的归属，更不会影响其法律人格。例如，未成年人缺乏行为能力，需要借助监护人对财产进行管理，但是不能以此为由否定未成年人作为权利主体的资格。


    （2）政策选择说


    法律人格是社会存在经法律认可而享有权利并承担义务和责任的资格，它具有社会性。政策选择说将视角从理论证成转向政策选择，从法律价值判断和政策选择出发，认为是否赋予某一社会存在以法律主体资格需要考虑人的需要，赋予人工智能法律人格会导致人类非人化的后果，因而应当排斥。“民法并不把现实世界的一切实体都确立为法律关系主体，而是在立法政策的作用下，选择一定的实体赋予其民事主体地位。”^([\[36\]](#txt005.html#footnote_content_txt005_36))政策选择说在禁止生殖性克隆人类技术应用的国际公约中得以体现。^([\[37\]](#txt005.html#footnote_content_txt005_37))“某一特定社会的法律以及赋予该特定社会成员的权利与义务是‘人类境况’（human
    condition）的表达。……将机器人当作人类一样对待将会使人类非人化，所以我们应当避免持有这种态度。”^([\[38\]](#txt005.html#footnote_content_txt005_38))因而，无论是在现在还是在未来，将智能机器（人）视为与人同等重要的存在都不符合人的需要，不应成为政策选择的结果。


    （3）时机不成熟说


    时机不成熟说关注法律制度设计与现实生活之间的关系，将法律主体制度设计置于当下的社会环境中，不再纠结人工智能技术的未来。人工智能技术的研发和应用在当下仍然没有突破工具论的范畴。即便基于学习算法的智能机器（人）有一定的自主性，但就其整体而言仍属于产品。人工智能技术的研发与应用尚未对传统的法律规则体系造成颠覆性冲击，赋予智能机器（人）民事主体资格的时机尚不成熟。“在短时期内仍然应当坚守传统民事主体理论，而不宜将智能机器人规定为民事主体。”^([\[39\]](#txt005.html#footnote_content_txt005_39))时机不成熟说关注当下主体规则体系，又保持体系的开放性，为未来制度创新预留空间，具有一定的理论解释力。


    （4）道德能力缺乏说


    道德能力缺乏说认为，具有道德能力是成为法律意义上的人的前提条件，缺乏道德认知能力的社会存在不能取得法律主体地位。智能机器（人）不具备道德认知能力，因而不能成为法律意义上的人。有学者对此提出质疑，认为“该说忽视了道德与法的根本区别，我们可以说道德主体必然为法律主体，但法律主体未必是道德主体”^([\[40\]](#txt005.html#footnote_content_txt005_40))。


    2.肯定说：权利主体说


    肯定说认为，法律发展史表明民事主体的范围并不是固定不变的，它呈现扩张趋势，自主智能机器（人）能够独立作出决策并行为，就应当赋予其法律主体地位。人格的概念并不是对现实世界的描述，而是法律判断和抽象的结果。“‘人格’（persona）这个拉丁词的原始意思就是面具或者角色。罗马法承认了各种作为非自然人却享有权利并承担义务的主体，比如自治城市（municipia）或者工会（collegia）。”^([\[41\]](#txt005.html#footnote_content_txt005_41))人工智能与生理意义上的人之间存在区别不能作为否定其具有法律人格的正当理由。“智能机器人摆脱人类的纯粹工具地位而获取主体身份，将是一个必然的趋势，相关的法律关系主体制度设计也将面临重大变革。”^([\[42\]](#txt005.html#footnote_content_txt005_42))“《机器人也是人：人工智能时代的法律》一书也提出，鉴于人工智能具有自动决策的能力，法律应当赋予其法律人格，将其视为独立的法律主体；对于人工智能引发的事故，理当由人工智能本身来承担责任，而非消费者和制造商。”^([\[43\]](#txt005.html#footnote_content_txt005_43))


    （1）代理说


    《欧盟机器人民事法律规则》第52 条提出“非人类的代理人”概念。“代理说认为，人工智能的行为均来自于其管理人的意思表示，行为后果归责于被代理人，相当于管理人的代理人。”^([\[44\]](#txt005.html#footnote_content_txt005_44))将智能机器（人）当作人类的代理人，智能机器（人）虽无需对外承担责任，但是其独立人格得到默认。


    （2）电子人格说


    《欧盟机器人民事法律规则》第59 条f 款有条件地承认智能机器（人）的法律主体地位，即对于能够作出自动化决策或行为的复杂机器（人）可以赋予其电子人（Electronic
    Persons）的法律地位。电子人格的取得不仅需要生产和制造智能机器（人）的事实，而且需要经过申请程序得到国家认可。


    （3）拟制说


    “‘拟制’是将实为权利客体的人工智能认定为民事主体的法律技术。”^([\[45\]](#txt005.html#footnote_content_txt005_45))拟制说为作为权利客体的智能机器（人）转变为法律主体扫清了法律技术上的障碍。“法律拟制说认为，人工智能虽不具备人的属性，但可‘视为人’，类似于法人。”^([\[46\]](#txt005.html#footnote_content_txt005_46))该说扩张了法律主体的范围，通过法律拟制的方式将智能机器（人）纳入法律主体的范畴。值得注意的是，即便能够赋予智能机器（人）以法律人格，其拟制人格与法人拟制人格也存在本质区别。赋予法人拟制人格的基础是法人背后之人的意志，而赋予智能机器（人）拟制人格的基础是人工智能的智能因素。相同立法技术下拟制人格的基础各不相同。


    3.折中说


    折中说通常不在人和物的二元划分中对智能机器（人）进行定性，而将其视为第三种类型的存在。“人工智能不是物，但‘他’同样也不是人。”^([\[47\]](#txt005.html#footnote_content_txt005_47))“在现实条件下，将人工智能定义为具有智慧工具性质又可作出独立意思表示的特殊主体较妥。”^([\[48\]](#txt005.html#footnote_content_txt005_48))折中说不否认智能机器（人）具有法律人格，但是，也不认为智能机器（人）具有与人同等的法律人格。


    （1）电子奴隶说


    “电子奴隶说的观点是，人工智能不具备自然人的特殊的情感和肉体特征，它有行为能力可是无权利能力。”^([\[49\]](#txt005.html#footnote_content_txt005_49))具备智能是成为法律主体的前提条件，但是，拥有智能并不必然代表能成为法律关系中的主体。智能主体与智能工具在法律地位上有差异，需要透过智能工具，揭示其背后主体的责任。古罗马法中的“奴隶”虽然具有独立的思维和意识，但不是具有权利能力的主体。智能机器（人）类似于罗马法上的奴隶，这种“电子奴隶”形式上是人，实质上并不是人，其行为后果需由“主人”承担。“奴隶当然也是具有智能的，但是这并不妨碍奴隶主对于奴隶的致害行为承担责任。”^([\[50\]](#txt005.html#footnote_content_txt005_50))


    （2）有限电子人格说


    智能机器（人）享有的“电子人格”，不同于自然人的人格，是参与方法律人格聚合的结果，仅在一定范围内具有自主权。智能机器（人）虽然没有生命但是拥有“智能”，赋予其有限法律人格是一种适应未来科技发展的“兼具创新的保守方式”^([\[51\]](#txt005.html#footnote_content_txt005_51))。有学者认为，当下折中说缺乏理论上的正当性，“支持赋予人工智能有限法律人格的观点，并不能实现法理逻辑的自洽”^([\[52\]](#txt005.html#footnote_content_txt005_52))。


    徘徊于主体与客体之间的折中说貌似兼容了智能机器（人）的工具性和主体性，缓和了不同学说之间的对立和冲突。但是，折中的做法与法律的稳定性相矛盾，法律规则可以考虑主体或客体的特殊性进行差异化设计，却不能在主体与客体之间任意转化。有限人格说对智能机器（人）主体地位的态度影响其关于民事法律责任承担的规则设计。有限法律人格对应有限民事法律责任，而余下部分则由智能机器（人）的参与主体，如制造者、设计者等承担。但是，有限民事法律责任的范围如何划分往往模棱两可。


    4.学说评析


    肯定说与否定说共同的逻辑基点是在法律的视域范围内严格区分主体与客体，不存在游离于主体与客体之间的存在形式。折中说突破了主体与客体严格二元区分的界限，承认第三类存在形式。目前关于上述三种学说的讨论往往存在以下误区：


    （1）同义反复，预设结论


    法律主体地位、权利能力、法律人格、资格等概念虽然在具体表述和关注角度方面存在差异，但是在法律层面实质上相同或高度类似。作为法律概念，人格先于权利能力出现。古罗马法中人格被分解为自由权、家长权和市民权，丧失上述权利的全部或者部分会导致人格减等。《德国民法典》首次使用了民事权利能力的概念。在现代社会，民事权利能力与人格概念同义。拉伦茨认为：“在法律上，权利能力是指一个人作为法律关系主体的能力，也即作为权利享有者和法律义务的承担者的能力。”^([\[53\]](#txt005.html#footnote_content_txt005_53))在讨论智能机器（人）能否作为法律主体问题时，经常有学者在预设智能机器（人）不具有民事法律资格或不具有权利能力的基础上论证智能机器（人）不具有法律人格，不能作为法律主体。


    （2）依据既有的民事法律规范判断人工智能的法律地位，以实然推断应然


    有学者认为：“无论人工智能有多接近于自然人，其不具有人的‘身份’，与法人的虚拟身份也不尽相同，没有出生不会死亡，自然也没有民事权利能力。”^([\[54\]](#txt005.html#footnote_content_txt005_54))以是否存在出生或死亡的事实作为判断民事权利能力有无是以既有民事法律规则为依据作出的判断。而智能机器（人）是否应当具有民事权利能力，能否作为民事法律关系主体是一个应然的法律命题。以实然的既有法律规范为依据并作严格解释，进而认为智能机器（人）不应当具有民事权利能力，不能作为民事法律主体，存在逻辑上的漏洞甚至错误。首先，“出生”和“死亡”能否作为判断民事权利能力有无的依据？“出生”和“死亡”是判断民事权利能力起点和终点的依据，并非判断民事权利能力有无的依据。其次，对于“出生”和“死亡”的理解是以自然人为标准的，在适用于法人时进行了扩张解释。但是，法人并非是对“出生”和“死亡”等概念进行扩张解释的边界，将上述概念扩张解释至智能机器（人）具有理论可能性。


    （3）颠倒权利能力与权利之间的关系，以实然否定应然'
  fmt: '

    ## 否定说


    “人工智能是人控制之下的，人能力的延伸物，它本身没有内源性的行为能力，也没有内源性的权利能力。”^([\[20\]](#txt005.html#footnote_content_txt005_20))智能机器（人）作出判断的基础并非自由意志，而是数据分析。基于数据分析进行动态实时判断不能被认为是独立意思表示的结果。智能机器（人）决策或行为的目的从属于人类，因而智能机器（人）本质上属于机器，不具有独立的法律主体资格。“人工智能是孙悟空，而人类却是如来佛和唐僧。”^([\[21\]](#txt005.html#footnote_content_txt005_21))


    智能机器人的名称中虽然有人的字样，但是这里的人是在非严格意义上人类对具有部分人类特征的机器的称谓。智能机器（人）是人类制造的、具有部分与人类相同或相近要素的产品，即便它可能具有人的外形、类似于人类的智慧、独立意志和相对独立的社会角色，也只是物而不是人，不具有人格，不过是特殊的工具。“高端智能机器人虽然有人的外观形象，有人的一些功能，可以实施某些类似于人的行为甚至有一定自主性的行为，但它的基本属性仍然是物。”^([\[22\]](#txt005.html#footnote_content_txt005_22))赋予智能机器（人）法律主体资格并无必要，不能假借法律主体制度逃避责任。在“姆拉塞克诉布林矛尔医院”（Marcek
    v.Bryn Mawr Hospital）一案中，法院将因达芬奇医疗机器（人）故障造成的损害认定为产品责任，并依据《美国侵权法重述（第二版）》第402 条a
    款作出判决。“通过这一案件我们认识到：当机器人致害时，现行法律实践仅将其认定为产品或者权利客体而非法律主体。”^([\[23\]](#txt005.html#footnote_content_txt005_23))


    智能机器（人）不同于自然人，也不同于自然人集合体的法人。自然人是当然的意思表示主体。法人和非法人组织的意思表示是由自然人组成的机构实现的，其意思表示的主体可以追溯至自然人。智能机器（人）工作的素材是人类输入的特定领域的知识，其行为性质缺乏独立的目的性和自主意识，因而“将其作为拟制之人以享有法律主体资格，在法理上尚有斟榷之处”^([\[24\]](#txt005.html#footnote_content_txt005_24))。将智能机器（人）与法人进行类比论证忽略了“自然人之于法人”的重要意义，无法在理论层面完成证成。^([\[25\]](#txt005.html#footnote_content_txt005_25))“公司与机器人的重大区别在于，公司总是‘通过’人类来运营。”^([\[26\]](#txt005.html#footnote_content_txt005_26))


    ### (1) 工具说


    工具说严格划定人类与作为人类创造物的智能机器（人）之间的边界，并坚守主体与客体二元划分的逻辑框架，将智能机器（人）归入与主体相对应的机器的范畴。智能机器（人）是人类创造的产物，其最初的定位为客体而非主体。“人工智能缺乏作为自然人的自我意识、理性和道德感，缺乏人类之‘灵性’，没有需要保护的伦理价值，其本质上只是一台机器。”^([\[27\]](#txt005.html#footnote_content_txt005_27))有学者对工具说提出质疑，认为该说忽视或否认智能机器（人）的智能属性，与人工智能技术不断发展和进步的趋势相悖。“这种学说的弊端在于忽略了人工智能的自主性，人工智能技术目前已经发展到可以独立表达自己意思并作出行为的阶段，如特斯拉汽车可实现无人驾驶，在这一点上，人工智能早已超越传统的工具。”^([\[28\]](#txt005.html#footnote_content_txt005_28))“索菲亚”“帕罗”缘何能够取得国籍或户籍？当然，就该质疑也存在两点疑问：第一，技术发展是否已经到了智能机器（人）能够独立、自主为意思表示和行为的阶段？第二，智能机器（人）不同于传统的工具能否作为智能机器（人）脱离工具的行列进入主体范畴的充分理由？


    ### (2) 人工类人格说


    持否定说的学者也并非一概否认人格制度适用于智能机器（人）的可能性。有学者跳出非此即彼的思维方式，寻求介于主体与客体之间的第三种主体形态，提出“人工类人格”的概念，认为“人工类人格是智能机器人所享有的，通过人工制造的类似于或者接近于自然人人格的民事法律地位”^([\[29\]](#txt005.html#footnote_content_txt005_29))。赋予智能机器（人）人工类人格是在典型的法律意义上的主体与客体之间发现第三种存在形态。智能机器人正是因为具有人工类人格，才区别于普通的物，也区别于普通的产品，属于物的最高类型即伦理物格的物。^([\[30\]](#txt005.html#footnote_content_txt005_30))


    智能机器（人）的工具性法律人格以财产相对独立或资产特定化为前提。但财产独立或资产特定化作为主体隔离资产和限制责任范围的手段并非人工智能时代首创。法人制度的创设在主体拥有的不同类型的财产之间设置了防火墙，所需承担的责任被限定在预先安排的范围内。该制度解决了因商事活动失败而导致商事主体承担的责任无限扩大进而影响个人生活或其他商事活动的问题，为商事主体从事创新活动提供了制度保障，排除了后顾之忧。法人制度的资产隔离和特定化效果为商事活动创新和社会发展繁荣做出了重大贡献。智能机器（人）的工具性法律人格仍然是以人类主义为中心的。人工类人格说需要以智能机器（人）登记作为配套制度设计。“每一台人工智能都需到监管部门强制登记，获得‘身份证’，确定其专属管理人。”^([\[31\]](#txt005.html#footnote_content_txt005_31))这一做法的目的在于进行身份识别。^([\[32\]](#txt005.html#footnote_content_txt005_32))“我国应当建立机器人强制登记制度，确保机器人在推向社会之前获得唯一的编号。这既是机器人权责追溯的必要保证，也是确立个体机器人法律主体地位的基础。”^([\[33\]](#txt005.html#footnote_content_txt005_33))为满足责任追溯的需要，《就机器人民事法律规则向欧盟委员会提出立法建议的报告草案》提出了对智能机器（人）进行分类并引入登记制度的设想。智能机器（人）登记分为自愿登记和强制登记。《格里申法案》规定了机器（人）自愿登记制度。未登记的机器（人）不能作为代理人，不能取得权利主体地位。^([\[34\]](#txt005.html#footnote_content_txt005_34))


    ## 权利客体说的依据


    ### (1) 无独立财产说


    有学者认为，是否拥有独立财产是判断智能机器（人）是否拥有独立人格的考量因素，基于智能机器（人）没有独立财产推论其不享有独立法律人格。社会实体转变为法律意义上的人需要满足形式和实质双重要件。“物质性要件是指，拥有从事活动所需的财产或其它必要条件。相对于意志能力，物质性要件是判断法律人格的‘形’。”^([\[35\]](#txt005.html#footnote_content_txt005_35))这一观点有颠倒责任主体资格与财产独立性之间的因果关系之嫌，是以实然推论应然，合理性存在疑问。智能机器（人）不具有独立法律人格是其不能独立享有财产权的原因，不能基于智能机器（人）名下没有财产就认为其不能取得法律人格。在制度设计的层面，赋予智能机器（人）法律人格，将财产登记在其名下或由其占有并不存在技术上的障碍。此外，财产是否需要他人进行管理并不影响财产权的归属，更不会影响其法律人格。例如，未成年人缺乏行为能力，需要借助监护人对财产进行管理，但是不能以此为由否定未成年人作为权利主体的资格。


    ### (2) 政策选择说


    法律人格是社会存在经法律认可而享有权利并承担义务和责任的资格，它具有社会性。政策选择说将视角从理论证成转向政策选择，从法律价值判断和政策选择出发，认为是否赋予某一社会存在以法律主体资格需要考虑人的需要，赋予人工智能法律人格会导致人类非人化的后果，因而应当排斥。“民法并不把现实世界的一切实体都确立为法律关系主体，而是在立法政策的作用下，选择一定的实体赋予其民事主体地位。”^([\[36\]](#txt005.html#footnote_content_txt005_36))政策选择说在禁止生殖性克隆人类技术应用的国际公约中得以体现。^([\[37\]](#txt005.html#footnote_content_txt005_37))“某一特定社会的法律以及赋予该特定社会成员的权利与义务是‘人类境况’（human
    condition）的表达。……将机器人当作人类一样对待将会使人类非人化，所以我们应当避免持有这种态度。”^([\[38\]](#txt005.html#footnote_content_txt005_38))因而，无论是在现在还是在未来，将智能机器（人）视为与人同等重要的存在都不符合人的需要，不应成为政策选择的结果。


    ### (3) 时机不成熟说


    时机不成熟说关注法律制度设计与现实生活之间的关系，将法律主体制度设计置于当下的社会环境中，不再纠结人工智能技术的未来。人工智能技术的研发和应用在当下仍然没有突破工具论的范畴。即便基于学习算法的智能机器（人）有一定的自主性，但就其整体而言仍属于产品。人工智能技术的研发与应用尚未对传统的法律规则体系造成颠覆性冲击，赋予智能机器（人）民事主体资格的时机尚不成熟。“在短时期内仍然应当坚守传统民事主体理论，而不宜将智能机器人规定为民事主体。”^([\[39\]](#txt005.html#footnote_content_txt005_39))时机不成熟说关注当下主体规则体系，又保持体系的开放性，为未来制度创新预留空间，具有一定的理论解释力。


    ### (4) 道德能力缺乏说


    道德能力缺乏说认为，具有道德能力是成为法律意义上的人的前提条件，缺乏道德认知能力的社会存在不能取得法律主体地位。智能机器（人）不具备道德认知能力，因而不能成为法律意义上的人。有学者对此提出质疑，认为“该说忽视了道德与法的根本区别，我们可以说道德主体必然为法律主体，但法律主体未必是道德主体”^([\[40\]](#txt005.html#footnote_content_txt005_40))。


    ## 2. 肯定说：权利主体说


    肯定说认为，法律发展史表明民事主体的范围并不是固定不变的，它呈现扩张趋势，自主智能机器（人）能够独立作出决策并行为，就应当赋予其法律主体地位。人格的概念并不是对现实世界的描述，而是法律判断和抽象的结果。“‘人格’（persona）这个拉丁词的原始意思就是面具或者角色。罗马法承认了各种作为非自然人却享有权利并承担义务的主体，比如自治城市（municipia）或者工会（collegia）。”^([\[41\]](#txt005.html#footnote_content_txt005_41))人工智能与生理意义上的人之间存在区别不能作为否定其具有法律人格的正当理由。“智能机器人摆脱人类的纯粹工具地位而获取主体身份，将是一个必然的趋势，相关的法律关系主体制度设计也将面临重大变革。”^([\[42\]](#txt005.html#footnote_content_txt005_42))“《机器人也是人：人工智能时代的法律》一书也提出，鉴于人工智能具有自动决策的能力，法律应当赋予其法律人格，将其视为独立的法律主体；对于人工智能引发的事故，理当由人工智能本身来承担责任，而非消费者和制造商。”^([\[43\]](#txt005.html#footnote_content_txt005_43))


    ### (1) 代理说


    《欧盟机器人民事法律规则》第52 条提出“非人类的代理人”概念。“代理说认为，人工智能的行为均来自于其管理人的意思表示，行为后果归责于被代理人，相当于管理人的代理人。”^([\[44\]](#txt005.html#footnote_content_txt005_44))将智能机器（人）当作人类的代理人，智能机器（人）虽无需对外承担责任，但是其独立人格得到默认。


    ### (2) 电子人格说


    《欧盟机器人民事法律规则》第59 条f 款有条件地承认智能机器（人）的法律主体地位，即对于能够作出自动化决策或行为的复杂机器（人）可以赋予其电子人（Electronic
    Persons）的法律地位。电子人格的取得不仅需要生产和制造智能机器（人）的事实，而且需要经过申请程序得到国家认可。


    ### (3) 拟制说


    “‘拟制’是将实为权利客体的人工智能认定为民事主体的法律技术。”^([\[45\]](#txt005.html#footnote_content_txt005_45))拟制说为作为权利客体的智能机器（人）转变为法律主体扫清了法律技术上的障碍。“法律拟制说认为，人工智能虽不具备人的属性，但可‘视为人’，类似于法人。”^([\[46\]](#txt005.html#footnote_content_txt005_46))该说扩张了法律主体的范围，通过法律拟制的方式将智能机器（人）纳入法律主体的范畴。值得注意的是，即便能够赋予智能机器（人）以法律人格，其拟制人格与法人拟制人格也存在本质区别。赋予法人拟制人格的基础是法人背后之人的意志，而赋予智能机器（人）拟制人格的基础是人工智能的智能因素。相同立法技术下拟制人格的基础各不相同。


    ## 3. 折中说


    折中说通常不在人和物的二元划分中对智能机器（人）进行定性，而将其视为第三种类型的存在。“人工智能不是物，但‘他’同样也不是人。”^([\[47\]](#txt005.html#footnote_content_txt005_47))“在现实条件下，将人工智能定义为具有智慧工具性质又可作出独立意思表示的特殊主体较妥。”^([\[48\]](#txt005.html#footnote_content_txt005_48))折中说不否认智能机器（人）具有法律人格，但是，也不认为智能机器（人）具有与人同等的法律人格。


    ### (1) 电子奴隶说


    “电子奴隶说的观点是，人工智能不具备自然人的特殊的情感和肉体特征，它有行为能力可是无权利能力。”^([\[49\]](#txt005.html#footnote_content_txt005_49))具备智能是成为法律主体的前提条件，但是，拥有智能并不必然代表能成为法律关系中的主体。智能主体与智能工具在法律地位上有差异，需要透过智能工具，揭示其背后主体的责任。古罗马法中的“奴隶”虽然具有独立的思维和意识，但不是具有权利能力的主体。智能机器（人）类似于罗马法上的奴隶，这种“电子奴隶”形式上是人，实质上并不是人，其行为后果需由“主人”承担。“奴隶当然也是具有智能的，但是这并不妨碍奴隶主对于奴隶的致害行为承担责任。”^([\[50\]](#txt005.html#footnote_content_txt005_50))


    ### (2) 有限电子人格说


    智能机器（人）享有的“电子人格”，不同于自然人的人格，是参与方法律人格聚合的结果，仅在一定范围内具有自主权。智能机器（人）虽然没有生命但是拥有“智能”，赋予其有限法律人格是一种适应未来科技发展的“兼具创新的保守方式”^([\[51\]](#txt005.html#footnote_content_txt005_51))。有学者认为，当下折中说缺乏理论上的正当性，“支持赋予人工智能有限法律人格的观点，并不能实现法理逻辑的自洽”^([\[52\]](#txt005.html#footnote_content_txt005_52))。


    徘徊于主体与客体之间的折中说貌似兼容了智能机器（人）的工具性和主体性，缓和了不同学说之间的对立和冲突。但是，折中的做法与法律的稳定性相矛盾，法律规则可以考虑主体或客体的特殊性进行差异化设计，却不能在主体与客体之间任意转化。有限人格说对智能机器（人）主体地位的态度影响其关于民事法律责任承担的规则设计。有限法律人格对应有限民事法律责任，而余下部分则由智能机器（人）的参与主体，如制造者、设计者等承担。但是，有限民事法律责任的范围如何划分往往模棱两可。


    ## 4. 学说评析


    肯定说与否定说共同的逻辑基点是在法律的视域范围内严格区分主体与客体，不存在游离于主体与客体之间的存在形式。折中说突破了主体与客体严格二元区分的界限，承认第三类存在形式。目前关于上述三种学说的讨论往往存在以下误区：


    ### (1) 同义反复，预设结论


    法律主体地位、权利能力、法律人格、资格等概念虽然在具体表述和关注角度方面存在差异，但是在法律层面实质上相同或高度类似。作为法律概念，人格先于权利能力出现。古罗马法中人格被分解为自由权、家长权和市民权，丧失上述权利的全部或者部分会导致人格减等。《德国民法典》首次使用了民事权利能力的概念。在现代社会，民事权利能力与人格概念同义。拉伦茨认为：“在法律上，权利能力是指一个人作为法律关系主体的能力，也即作为权利享有者和法律义务的承担者的能力。”^([\[53\]](#txt005.html#footnote_content_txt005_53))在讨论智能机器（人）能否作为法律主体问题时，经常有学者在预设智能机器（人）不具有民事法律资格或不具有权利能力的基础上论证智能机器（人）不具有法律人格，不能作为法律主体。


    ### (2) 依据既有的民事法律规范判断人工智能的法律地位，以实然推断应然


    有学者认为：“无论人工智能有多接近于自然人，其不具有人的‘身份’，与法人的虚拟身份也不尽相同，没有出生不会死亡，自然也没有民事权利能力。”^([\[54\]](#txt005.html#footnote_content_txt005_54))以是否存在出生或死亡的事实作为判断民事权利能力有无是以既有民事法律规则为依据作出的判断。而智能机器（人）是否应当具有民事权利能力，能否作为民事法律关系主体是一个应然的法律命题。以实然的既有法律规范为依据并作严格解释，进而认为智能机器（人）不应当具有民事权利能力，不能作为民事法律主体，存在逻辑上的漏洞甚至错误。首先，“出生”和“死亡”能否作为判断民事权利能力有无的依据？“出生”和“死亡”是判断民事权利能力起点和终点的依据，并非判断民事权利能力有无的依据。其次，对于“出生”和“死亡”的理解是以自然人为标准的，在适用于法人时进行了扩张解释。但是，法人并非是对“出生”和“死亡”等概念进行扩张解释的边界，将上述概念扩张解释至智能机器（人）具有理论可能性。


    ### (3) 颠倒权利能力与权利之间的关系，以实然否定应然

    '
  trans: '


    ## 否定说


    “人工智能是人控制之下的，人能力的延伸物，它本身没有内源性的行为能力，也没有内源性的权利能力。”^([\[20\]](#txt005.html#footnote_content_txt005_20))智能机器（人）作出判断的基础并非自由意志，而是数据分析。基于数据分析进行动态实时判断不能被认为是独立意思表示的结果。智能机器（人）决策或行为的目的从属于人类，因而智能机器（人）本质上属于机器，不具有独立的法律主体资格。“人工智能是孙悟空，而人类却是如来佛和唐僧。”^([\[21\]](#txt005.html#footnote_content_txt005_21))


    智能机器人的名称中虽然有人的字样，但是这里的人是在非严格意义上人类对具有部分人类特征的机器的称谓。智能机器（人）是人类制造的、具有部分与人类相同或相近要素的产品，即便它可能具有人的外形、类似于人类的智慧、独立意志和相对独立的社会角色，也只是物而不是人，不具有人格，不过是特殊的工具。“高端智能机器人虽然有人的外观形象，有人的一些功能，可以实施某些类似于人的行为甚至有一定自主性的行为，但它的基本属性仍然是物。”^([\[22\]](#txt005.html#footnote_content_txt005_22))赋予智能机器（人）法律主体资格并无必要，不能假借法律主体制度逃避责任。在“姆拉塞克诉布林矛尔医院”（Marcek
    v.Bryn Mawr Hospital）一案中，法院将因达芬奇医疗机器（人）故障造成的损害认定为产品责任，并依据《美国侵权法重述（第二版）》第 402 条
    a 款作出判决。“通过这一案件我们认识到：当机器人致害时，现行法律实践仅将其认定为产品或者权利客体而非法律主体。”^([\[23\]](#txt005.html#footnote_content_txt005_23))


    智能机器（人）不同于自然人，也不同于自然人集合体的法人。自然人是当然的意思表示主体。法人和非法人组织的意思表示是由自然人组成的机构实现的，其意思表示的主体可以追溯至自然人。智能机器（人）工作的素材是人类输入的特定领域的知识，其行为性质缺乏独立的目的性和自主意识，因而“将其作为拟制之人以享有法律主体资格，在法理上尚有斟榷之处”^([\[24\]](#txt005.html#footnote_content_txt005_24))。将智能机器（人）与法人进行类比论证忽略了“自然人之于法人”的重要意义，无法在理论层面完成证成。^([\[25\]](#txt005.html#footnote_content_txt005_25))“公司与机器人的重大区别在于，公司总是‘通过’人类来运营。”^([\[26\]](#txt005.html#footnote_content_txt005_26))


    ### (1) 工具说


    工具说严格划定人类与作为人类创造物的智能机器（人）之间的边界，并坚守主体与客体二元划分的逻辑框架，将智能机器（人）归入与主体相对应的机器的范畴。智能机器（人）是人类创造的产物，其最初的定位为客体而非主体。“人工智能缺乏作为自然人的自我意识、理性和道德感，缺乏人类之‘灵性’，没有需要保护的伦理价值，其本质上只是一台机器。”^([\[27\]](#txt005.html#footnote_content_txt005_27))有学者对工具说提出质疑，认为该说忽视或否认智能机器（人）的智能属性，与人工智能技术不断发展和进步的趋势相悖。“这种学说的弊端在于忽略了人工智能的自主性，人工智能技术目前已经发展到可以独立表达自己意思并作出行为的阶段，如特斯拉汽车可实现无人驾驶，在这一点上，人工智能早已超越传统的工具。”^([\[28\]](#txt005.html#footnote_content_txt005_28))“索菲亚”“帕罗”缘何能够取得国籍或户籍？当然，就该质疑也存在两点疑问：第一，技术发展是否已经到了智能机器（人）能够独立、自主为意思表示和行为的阶段？第二，智能机器（人）不同于传统的工具能否作为智能机器（人）脱离工具的行列进入主体范畴的充分理由？


    ### (2) 人工类人格说


    持否定说的学者也并非一概否认人格制度适用于智能机器（人）的可能性。有学者跳出非此即彼的思维方式，寻求介于主体与客体之间的第三种主体形态，提出“人工类人格”的概念，认为“人工类人格是智能机器人所享有的，通过人工制造的类似于或者接近于自然人人格的民事法律地位”^([\[29\]](#txt005.html#footnote_content_txt005_29))。赋予智能机器（人）人工类人格是在典型的法律意义上的主体与客体之间发现第三种存在形态。智能机器人正是因为具有人工类人格，才区别于普通的物，也区别于普通的产品，属于物的最高类型即伦理物格的物。^([\[30\]](#txt005.html#footnote_content_txt005_30))


    智能机器（人）的工具性法律人格以财产相对独立或资产特定化为前提。但财产独立或资产特定化作为主体隔离资产和限制责任范围的手段并非人工智能时代首创。法人制度的创设在主体拥有的不同类型的财产之间设置了防火墙，所需承担的责任被限定在预先安排的范围内。该制度解决了因商事活动失败而导致商事主体承担的责任无限扩大进而影响个人生活或其他商事活动的问题，为商事主体从事创新活动提供了制度保障，排除了后顾之忧。法人制度的资产隔离和特定化效果为商事活动创新和社会发展繁荣做出了重大贡献。智能机器（人）的工具性法律人格仍然是以人类主义为中心的。人工类人格说需要以智能机器（人）登记作为配套制度设计。“每一台人工智能都需到监管部门强制登记，获得‘身份证’，确定其专属管理人。”^([\[31\]](#txt005.html#footnote_content_txt005_31))这一做法的目的在于进行身份识别。^([\[32\]](#txt005.html#footnote_content_txt005_32))“我国应当建立机器人强制登记制度，确保机器人在推向社会之前获得唯一的编号。这既是机器人权责追溯的必要保证，也是确立个体机器人法律主体地位的基础。”^([\[33\]](#txt005.html#footnote_content_txt005_33))为满足责任追溯的需要，《就机器人民事法律规则向欧盟委员会提出立法建议的报告草案》提出了对智能机器（人）进行分类并引入登记制度的设想。智能机器（人）登记分为自愿登记和强制登记。《格里申法案》规定了机器（人）自愿登记制度。未登记的机器（人）不能作为代理人，不能取得权利主体地位。^([\[34\]](#txt005.html#footnote_content_txt005_34))


    ## 权利客体说的依据


    ### (1) 无独立财产说


    有学者认为，是否拥有独立财产是判断智能机器（人）是否拥有独立人格的考量因素，基于智能机器（人）没有独立财产推论其不享有独立法律人格。社会实体转变为法律意义上的人需要满足形式和实质双重要件。“物质性要件是指，拥有从事活动所需的财产或其它必要条件。相对于意志能力，物质性要件是判断法律人格的‘形’。”^([\[35\]](#txt005.html#footnote_content_txt005_35))这一观点有颠倒责任主体资格与财产独立性之间的因果关系之嫌，是以实然推论应然，合理性存在疑问。智能机器（人）不具有独立法律人格是其不能独立享有财产权的原因，不能基于智能机器（人）名下没有财产就认为其不能取得法律人格。在制度设计的层面，赋予智能机器（人）法律人格，将财产登记在其名下或由其占有并不存在技术上的障碍。此外，财产是否需要他人进行管理并不影响财产权的归属，更不会影响其法律人格。例如，未成年人缺乏行为能力，需要借助监护人对财产进行管理，但是不能以此为由否定未成年人作为权利主体的资格。


    ### (2) 政策选择说


    法律人格是社会存在经法律认可而享有权利并承担义务和责任的资格，它具有社会性。政策选择说将视角从理论证成转向政策选择，从法律价值判断和政策选择出发，认为是否赋予某一社会存在以法律主体资格需要考虑人的需要，赋予人工智能法律人格会导致人类非人化的后果，因而应当排斥。“民法并不把现实世界的一切实体都确立为法律关系主体，而是在立法政策的作用下，选择一定的实体赋予其民事主体地位。”^([\[36\]](#txt005.html#footnote_content_txt005_36))政策选择说在禁止生殖性克隆人类技术应用的国际公约中得以体现。^([\[37\]](#txt005.html#footnote_content_txt005_37))“某一特定社会的法律以及赋予该特定社会成员的权利与义务是‘人类境况’（human
    condition）的表达。……将机器人当作人类一样对待将会使人类非人化，所以我们应当避免持有这种态度。”^([\[38\]](#txt005.html#footnote_content_txt005_38))因而，无论是在现在还是在未来，将智能机器（人）视为与人同等重要的存在都不符合人的需要，不应成为政策选择的结果。


    ### (3) 时机不成熟说


    时机不成熟说关注法律制度设计与现实生活之间的关系，将法律主体制度设计置于当下的社会环境中，不再纠结人工智能技术的未来。人工智能技术的研发和应用在当下仍然没有突破工具论的范畴。即便基于学习算法的智能机器（人）有一定的自主性，但就其整体而言仍属于产品。人工智能技术的研发与应用尚未对传统的法律规则体系造成颠覆性冲击，赋予智能机器（人）民事主体资格的时机尚不成熟。“在短时期内仍然应当坚守传统民事主体理论，而不宜将智能机器人规定为民事主体。”^([\[39\]](#txt005.html#footnote_content_txt005_39))时机不成熟说关注当下主体规则体系，又保持体系的开放性，为未来制度创新预留空间，具有一定的理论解释力。


    ### (4) 道德能力缺乏说


    道德能力缺乏说认为，具有道德能力是成为法律意义上的人的前提条件，缺乏道德认知能力的社会存在不能取得法律主体地位。智能机器（人）不具备道德认知能力，因而不能成为法律意义上的人。有学者对此提出质疑，认为“该说忽视了道德与法的根本区别，我们可以说道德主体必然为法律主体，但法律主体未必是道德主体”^([\[40\]](#txt005.html#footnote_content_txt005_40))。


    ## 2. 肯定说：权利主体说


    肯定说认为，法律发展史表明民事主体的范围并不是固定不变的，它呈现扩张趋势，自主智能机器（人）能够独立作出决策并行为，就应当赋予其法律主体地位。人格的概念并不是对现实世界的描述，而是法律判断和抽象的结果。“‘人格’（persona）这个拉丁词的原始意思就是面具或者角色。罗马法承认了各种作为非自然人却享有权利并承担义务的主体，比如自治城市（municipia）或者工会（collegia）。”^([\[41\]](#txt005.html#footnote_content_txt005_41))人工智能与生理意义上的人之间存在区别不能作为否定其具有法律人格的正当理由。“智能机器人摆脱人类的纯粹工具地位而获取主体身份，将是一个必然的趋势，相关的法律关系主体制度设计也将面临重大变革。”^([\[42\]](#txt005.html#footnote_content_txt005_42))“《机器人也是人：人工智能时代的法律》一书也提出，鉴于人工智能具有自动决策的能力，法律应当赋予其法律人格，将其视为独立的法律主体；对于人工智能引发的事故，理当由人工智能本身来承担责任，而非消费者和制造商。”^([\[43\]](#txt005.html#footnote_content_txt005_43))


    ### (1) 代理说


    《欧盟机器人民事法律规则》第 52 条提出“非人类的代理人”概念。“代理说认为，人工智能的行为均来自于其管理人的意思表示，行为后果归责于被代理人，相当于管理人的代理人。”^([\[44\]](#txt005.html#footnote_content_txt005_44))将智能机器（人）当作人类的代理人，智能机器（人）虽无需对外承担责任，但是其独立人格得到默认。


    ### (2) 电子人格说


    《欧盟机器人民事法律规则》第 59 条 f 款有条件地承认智能机器（人）的法律主体地位，即对于能够作出自动化决策或行为的复杂机器（人）可以赋予其电子人（Electronic
    Persons）的法律地位。电子人格的取得不仅需要生产和制造智能机器（人）的事实，而且需要经过申请程序得到国家认可。


    ### (3) 拟制说


    “‘拟制’是将实为权利客体的人工智能认定为民事主体的法律技术。”^([\[45\]](#txt005.html#footnote_content_txt005_45))拟制说为作为权利客体的智能机器（人）转变为法律主体扫清了法律技术上的障碍。“法律拟制说认为，人工智能虽不具备人的属性，但可‘视为人’，类似于法人。”^([\[46\]](#txt005.html#footnote_content_txt005_46))该说扩张了法律主体的范围，通过法律拟制的方式将智能机器（人）纳入法律主体的范畴。值得注意的是，即便能够赋予智能机器（人）以法律人格，其拟制人格与法人拟制人格也存在本质区别。赋予法人拟制人格的基础是法人背后之人的意志，而赋予智能机器（人）拟制人格的基础是人工智能的智能因素。相同立法技术下拟制人格的基础各不相同。


    ## 3. 折中说


    折中说通常不在人和物的二元划分中对智能机器（人）进行定性，而将其视为第三种类型的存在。“人工智能不是物，但‘他’同样也不是人。”^([\[47\]](#txt005.html#footnote_content_txt005_47))“在现实条件下，将人工智能定义为具有智慧工具性质又可作出独立意思表示的特殊主体较妥。”^([\[48\]](#txt005.html#footnote_content_txt005_48))折中说不否认智能机器（人）具有法律人格，但是，也不认为智能机器（人）具有与人同等的法律人格。


    ### (1) 电子奴隶说


    “电子奴隶说的观点是，人工智能不具备自然人的特殊的情感和肉体特征，它有行为能力可是无权利能力。”^([\[49\]](#txt005.html#footnote_content_txt005_49))具备智能是成为法律主体的前提条件，但是，拥有智能并不必然代表能成为法律关系中的主体。智能主体与智能工具在法律地位上有差异，需要透过智能工具，揭示其背后主体的责任。古罗马法中的“奴隶”虽然具有独立的思维和意识，但不是具有权利能力的主体。智能机器（人）类似于罗马法上的奴隶，这种“电子奴隶”形式上是人，实质上并不是人，其行为后果需由“主人”承担。“奴隶当然也是具有智能的，但是这并不妨碍奴隶主对于奴隶的致害行为承担责任。”^([\[50\]](#txt005.html#footnote_content_txt005_50))


    ### (2) 有限电子人格说


    智能机器（人）享有的“电子人格”，不同于自然人的人格，是参与方法律人格聚合的结果，仅在一定范围内具有自主权。智能机器（人）虽然没有生命但是拥有“智能”，赋予其有限法律人格是一种适应未来科技发展的“兼具创新的保守方式”^([\[51\]](#txt005.html#footnote_content_txt005_51))。有学者认为，当下折中说缺乏理论上的正当性，“支持赋予人工智能有限法律人格的观点，并不能实现法理逻辑的自洽”^([\[52\]](#txt005.html#footnote_content_txt005_52))。


    徘徊于主体与客体之间的折中说貌似兼容了智能机器（人）的工具性和主体性，缓和了不同学说之间的对立和冲突。但是，折中的做法与法律的稳定性相矛盾，法律规则可以考虑主体或客体的特殊性进行差异化设计，却不能在主体与客体之间任意转化。有限人格说对智能机器（人）主体地位的态度影响其关于民事法律责任承担的规则设计。有限法律人格对应有限民事法律责任，而余下部分则由智能机器（人）的参与主体，如制造者、设计者等承担。但是，有限民事法律责任的范围如何划分往往模棱两可。


    ## 4. 学说评析


    肯定说与否定说共同的逻辑基点是在法律的视域范围内严格区分主体与客体，不存在游离于主体与客体之间的存在形式。折中说突破了主体与客体严格二元区分的界限，承认第三类存在形式。目前关于上述三种学说的讨论往往存在以下误区：


    ### (1) 同义反复，预设结论


    法律主体地位、权利能力、法律人格、资格等概念虽然在具体表述和关注角度方面存在差异，但是在法律层面实质上相同或高度类似。作为法律概念，人格先于权利能力出现。古罗马法中人格被分解为自由权、家长权和市民权，丧失上述权利的全部或者部分会导致人格减等。《德国民法典》首次使用了民事权利能力的概念。在现代社会，民事权利能力与人格概念同义。拉伦茨认为：“在法律上，权利能力是指一个人作为法律关系主体的能力，也即作为权利享有者和法律义务的承担者的能力。”^([\[53\]](#txt005.html#footnote_content_txt005_53))在讨论智能机器（人）能否作为法律主体问题时，经常有学者在预设智能机器（人）不具有民事法律资格或不具有权利能力的基础上论证智能机器（人）不具有法律人格，不能作为法律主体。


    ### (2) 依据既有的民事法律规范判断人工智能的法律地位，以实然推断应然


    有学者认为：“无论人工智能有多接近于自然人，其不具有人的‘身份’，与法人的虚拟身份也不尽相同，没有出生不会死亡，自然也没有民事权利能力。”^([\[54\]](#txt005.html#footnote_content_txt005_54))以是否存在出生或死亡的事实作为判断民事权利能力有无是以既有民事法律规则为依据作出的判断。而智能机器（人）是否应当具有民事权利能力，能否作为民事法律关系主体是一个应然的法律命题。以实然的既有法律规范为依据并作严格解释，进而认为智能机器（人）不应当具有民事权利能力，不能作为民事法律主体，存在逻辑上的漏洞甚至错误。首先，“出生”和“死亡”能否作为判断民事权利能力有无的依据？“出生”和“死亡”是判断民事权利能力起点和终点的依据，并非判断民事权利能力有无的依据。其次，对于“出生”和“死亡”的理解是以自然人为标准的，在适用于法人时进行了扩张解释。但是，法人并非是对“出生”和“死亡”等概念进行扩张解释的边界，将上述概念扩张解释至智能机器（人）具有理论可能性。


    ### (3) 颠倒权利能力与权利之间的关系，以实然否定应然


