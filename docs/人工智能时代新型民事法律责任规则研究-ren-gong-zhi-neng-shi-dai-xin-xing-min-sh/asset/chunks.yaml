    # 第四章　人工智能时代新型民事法律责任一般规则


    民事法律责任是法律责任的一种类型，是民事主体违反民事义务需要承担的不利法律后果。民事义务是产生民事责任的前提条件。“义务是‘当为’，反映正常的社会秩序。当为而不为产生责任。义务是责任之因，责任是违反义务之果。责任反映不正常的社会秩序，责任人承担责任是恢复正常的社会秩序。”^([\[1\]](#txt005.html#footnote_content_txt005_1))进入人工智能时代，民事法律责任领域面临新的课题。


    ## 第一节　人工智能时代的民事责任主体


    明确法律主体地位是确定权利归属与责任承担的前提。观察经验世界不难发现，智能机器（人）正在经历从工具到智能体（intelligent agent）的转变。作为工具的计算机或机器已经为人类熟知。它们辅助人类生产或生活，将人类从繁重的体力劳动中释放出来。计算机或机器作为工具并没有主观意识或目的，其“行为”是接受人类指令的结果。创作或决策能力专属于人类，由计算机或机器进行创作或决策只是人类的想象，存在于早期科幻类文学或影视作品中。


    智能驾驶以及人工智能生成新闻稿、诗歌、小说等现象在社会生活中出现，将科幻作品中想象的情境转变为现实。创作和决策不再专属于人类，人类对机器或人工智能的控制力悄然发生变化。现代计算机的计算能力增强、算法优化以及机器自主学习使得人工智能自主决策和行为成为可能。作为大数据分析的结果，人工智能在决策和判断方面的合理性甚至超越了人类智能。“人工智能实际上已经可以将脑力劳动和体力劳动、感知和思维、决策和执行结合在一起，从而更像是一个完整的人。”^([\[2\]](#txt005.html#footnote_content_txt005_2))智能机器人成为理想形态的人，它满足了人类美好的想象，展示了无缺陷的完美形象。


    人机关系的表述本身隐喻着主体与客体的二元对立。机器扮演人类体力劳动的辅助工具的角色。机器学习引发了人类对人机关系的反思。卢曼（Niklas Luhmann）认为电子数据处理技术已经改变了人与机器的关系。这种技术不能再被认为是对体力劳动的辅助，因此我们应重新界定人与机器的关系。“人工智能”研究体现了这种变化——甚至开始质疑将问题表述成人机关系就认知科学的目的而言是否妥当。^([\[3\]](#txt005.html#footnote_content_txt005_3))人工智能时代，“人之为人”的判断标准模糊化，“我是谁？”的本体论追问再次成为哲学领域关注的重心。法律的调整对象是人的行为，将责任分配给智能机器（人）首先需要反思或突破现有的法律主体理论框架。主体规则领域的颠覆性变化直接影响民事法律责任的主体规则体系。


    ### 一、智能机器（人）的法律人格


    #### （一）技术社会的主奴悖论


    技术社会中出现主体客体化和客体主体化的情形，引发主奴悖论。一方面，技术社会中人的主体性局部丧失，异化为缺乏思想和灵魂的存在。强调执行而非理解的技术社会中的人犹如接收和输出信息的接线员，人的主体性出现弱化倾向。“法国哲学家米歇尔·福柯在《词与物：人文科学考古学》（1966）中提出了‘人之死’的观点，这里的人是指人文科学意义上的人，即有关人的观念和学说。按照福柯的分析，‘人之死’是以康德的人类学为基础的哲学的消失，是19
    世纪以来以人为中心的现代知识形态的消失。”^([\[4\]](#txt005.html#footnote_content_txt005_4))另一方面，技术社会中作为客体的机器因智能化而具有了一定的主体特征。“技术并不仅仅是工具，或者不仅仅是达到目的的手段；相反，其是政治行动者，手段与目的密不可分。”^([\[5\]](#txt005.html#footnote_content_txt005_5))人工智能技术的研发与应用使得智能不再专属于人类，智能机器（人）能像人一样思维、决策和行为，其工具性弱化而主体性增强。计算机被《时代》周刊评为年代人物，这一戏剧化的方式向人类宣告了后人类时代即将到来。


    “从民法理论角度观察，要成为责任主体，就必须属于民事法律关系的主体。”^([\[6\]](#txt005.html#footnote_content_txt005_6))智能机器（人）的智能属性注定其不会像其他人类创造物一样，仅仅是一种工具性或手段性的存在。智能机器（人）是人吗？即智能机器（人）的法律人格问题自人工智能概念产生之日起便成为人类不懈探索的难解之谜。^([\[7\]](#txt005.html#footnote_content_txt005_7))由于人类认知水平的限制，智能机器（人）的法律人格问题一直停留在科学幻想和纯粹理论分析的层面，智能机器（人）未能突破以客体形式存在的藩篱。^([\[8\]](#txt005.html#footnote_content_txt005_8))这一状况在近10
    年间发生了变化，智能机器（人）的法律人格问题从科幻和书斋走进现实，出现被认可的趋势，如外形酷似海豹的宠物机器人“帕罗”（Paro）在日本取得户籍，沙特赋予人形机器人索菲亚（So⁃phia）以国籍，美国国家高速公路交通安全管理局（NHTSA）认可谷歌（Google）驾驶系统具有司机地位。倘若智能机器（人）具有法律主体地位，则作为交易或生产对象的规则需要进行重新设计，这将会引发财产权制度、交易制度以及责任制度领域的深刻变革。“人工智能时代的到来，正在倒逼法学理论重新审视法律人格制度，从社会现实与法律理论的双重视角探求有无必要以及如何赋予人工智能体法律人格。”^([\[9\]](#txt005.html#footnote_content_txt005_9))


    #### （二）作为客体存在的智能机器（人）及遭遇的挑战


    ##### 1.智能机器（人）作为客体存在的理论预设


    主体与客体严格区分的二元框架是构建近现代民法体系的基础之一。传统法律体系中智能机器（人）的法律定位以智能机器（人）的工具属性和主体与客体二元区分为基础。智能机器（人）是由有形载体承载计算机编程的结果，是人类创造或设计的产品，与人类利用的众多其他工具无异，属于可供人类支配或利用的财产。Robot
    一词源于robe（奴隶），机器人是类似奴隶的“会说话的工具”，被定位为人类的奴仆。人工智能是一种工具性或手段性的存在，在法律关系中处于客体地位，不具备承载权利、义务或责任的资格。


    将智能机器（人）作为客体存在的理论预设，注重人工智能中“人工”的部分。“人工”意味着智能机器（人）是人类的创造物，是人类智慧的结晶，是人类征服世界的外在表征。人类与人工智能类似于造物主与创造物的关系。所谓智能机器（人）的行为并非其自主意志的结果，而是人类意志的体现或折射。


    智能机器（人）创作诗歌、新闻稿、小说等不过是人类意志的延伸。人类借助智能机器（人）进行创作与借助电脑、打字机等设备进行创作并无本质区别。设计或使用人工智能的人类是创作的思想源泉，作为法律关系客体的人工智能不具有享有权利的资格。在私权体系中，权利主体与权利客体不仅相对应，而且彼此之间的法律地位不得转换，所以权利主体不能是权利客体，权利客体亦永远无法成为权利主体，只可能是法定支配权指向的对象。^([\[10\]](#txt005.html#footnote_content_txt005_10))智能机器（人）对创作物享有权利的命题倘若成立，无异于认可客体对客体享有权利，这在传统法律体系框架内难以实现理论自洽，因此是荒谬的。同理，人工智能也不能作为承载义务或责任的主体。作为工具的智能机器（人）实施行为的背后隐藏着设计者、制造者、使用者等人类主体的意志，其导致的社会危害或造成的损失应由传统法律意义上的人承担。总之，人类创造了智能机器（人）并将其作为工具，所谓的智能机器（人）的行为不具有独立于人类意志或行为的价值，智能机器（人）不能取得法律主体资格。


    ##### 2.智能机器（人）作为客体存在的理论预设遭遇的冲击


    时至今日，人工智能作为客体的理论预设仍然具有存在的现实基础。从人工智能技术发展的角度看，虽然人工智能在诸多领域呈现出优越于人类智能的特点，但是能够与人类智能媲美的通用型人工智能仍处于探索研发阶段。当下人工智能主要扮演任务执行者的角色，即按照人类预先设定的程序和指令作为或不作为。关于智能机器（人）基于自主意识而行为的技术是否可能，学者尚未形成共识，人工智能技术的应用也未能达到普及的程度。


    即便如此，人工智能作为客体存在的理论预设也并非固若金汤。人工生殖技术和人工智能技术的发展与应用模糊了主体与客体二元划分的界限。第一，人工生殖技术的发展与应用冲击了主体与客体二元划分的传统民法理论，在主体与客体之间出现了过渡性的模糊地带。人工生殖技术的临床应用使得在人体以外合成的胚胎的法律地位模糊化，难以在传统的“人”或“物”的概念中寻求归属。在江苏省宜兴市发生的人体冷冻胚胎权属争议案^([\[11\]](#txt005.html#footnote_content_txt005_11))中，宜兴市人民法院和无锡市中级人民法院都认为体外受精的人体胚胎具有发展为生命的潜能，不同于一般的物。无论将其称为“特殊之物”还是“介于人与物之间的过渡状态”都说明传统民法理论和规则无法满足现实生活的需要，应当进行调整。相较于将体外受精的人体胚胎作为“特殊之物”和“介于人与物之间的过渡状态”的观点，承认在人与物之外存在第三种物质存在形式是更具有革命性和颠覆性的。


    第二，人工智能技术的发展与应用冲击主体与客体二元划分的传统民法理论，在主体与客体之间出现了过渡性的模糊地带。机器智能化悄然改变了人与机器之间的关系，将智能机器（人）作为客体的理论预设的正当性开始动摇。首先，在人机共处的场景中，人的行为与智能机器（人）的行为发生混合，是否需要将人与机器作为混合体进行规制以及如何规制的问题产生。混合体中的机器部分难以继续作为客体被对待。其次，在学习算法主导的应用场景中，智能机器（人）是行为的发出者，这与客体作为行为的承受者发生冲突。“主体做出行为，客体承受行为——但一个行为着的客体算什么呢？对法律而言，这种不确定的区分将引发一个又一个难解之题。”^([\[12\]](#txt005.html#footnote_content_txt005_12))最后，在强人工智能场景中，人与智能机器（人）之间的关系出现拟人化倾向。“当机器人变得足够复杂的时候，它们既不是人类的仆人，也不是人类的主人，而是人类的伙伴。”^([\[13\]](#txt005.html#footnote_content_txt005_13))一方面，“人们经常把情绪和意图赋予机器人，把机器人不是仅看作‘物’或‘纯粹的机器’。”^([\[14\]](#txt005.html#footnote_content_txt005_14))另一方面，智能机器（人）学习和认知能力的不断增强冲击着智能机器（人）作为纯粹客体的理论预设。智能机器（人）的行为模式由“命令—行动”转变为“感知—思考—行动”，其行为的自主性增强，智能机器（人）的行为与人的意志或行为之间的联系逐渐被切断，将人工智能创作物的权利归属于人类或者将智能机器（人）造成的人身或财产损失归责于生产者、所有者或使用者的基础被动摇甚至丧失。


    人工智能行为的独立性、自主性模糊了民事主体与民事客体的界限，引发对民事法律关系中法律人格理论基础的深层思考，直接冲击传统民事法律制度中的民事主体规则、权利归属规则以及责任承担规则。人工智能是否具有法律人格成为规则体系重构的核心与关键，而解决这一问题又必须以反思传统法学理论和法律体系中取得法律主体资格的正当理由和条件为基础。


    总而言之，传统私法理论认为，法律主体与法律客体相互区分且不能相互转化。在这一理论预设下，作为人类创造物的人工智能是一种客体性或工具性的存在，不能作为法律主体。智能机器（人）既不能作为权利主体取得人工智能创作物的著作权，也不能作为责任主体对其造成的损失承担责任。伴随计算机科学和人工智能技术进步，人工智能深度学习能力增强，其部分行为已经具备了自主性的要求，不再是人类事先设计或安排的结果。人工智能时代智能机器（人）工具性特征的弱化，打破了传统的主体—客体二元框架，传统民事主体理论暴露出缺陷。机器智能化使得民事法律规则设计复杂化。《格里申法案》体现了立法者对智能机器（人）复杂且矛盾的心态，该法案在主体、客体、责任等部分均对智能机器（人）作出了规定。^([\[15\]](#txt005.html#footnote_content_txt005_15))


    #### （三）关于智能机器（人）法律主体资格的认识分歧


    客体转化为主体存在理论上的可能性，但是客体主体化的过程是艰难的，其间存在诸多不适应性。斯通（Christopher Stone）教授认为：在每一场试图把权利赋予某些新的“实体”的运动中，相关的提议不可避免地让人感觉是奇怪的，或者是可怕的，抑或是可笑的。^([\[16\]](#txt005.html#footnote_content_txt005_16))智能机器（人）能否作为法律主体在认识上存在分歧。


    ##### 1.否定说：权利客体说


    否定说认为智能机器（人）属于动产中的产品，在法律上应当定性为物，是客体性的存在。“人工智能应当是法律上的‘物’。”^([\[17\]](#txt005.html#footnote_content_txt005_17))“人工智能是人所利用的客体，而人则属于主体，二者泾渭分明。”^([\[18\]](#txt005.html#footnote_content_txt005_18))“机器人无论以何种方式承担责任，最终的责任承担者都是人，这使得它的‘法律人格’显得多余和毫无必要，经不住‘奥康剃刀’（如无必要，勿增实体）的检验。”^([\[19\]](#txt005.html#footnote_content_txt005_19))人工智能法律规则的设计需要以人类对人工智能的理性认知为基础。在人类对人工智能是否能够自主生成意识以及自主意识的程度缺乏明晰认识的情况下，赋予人工智能独立的法律主体地位不过是基于虚构事实的规则假想，对社会生活难以起到有效调控的作用。

