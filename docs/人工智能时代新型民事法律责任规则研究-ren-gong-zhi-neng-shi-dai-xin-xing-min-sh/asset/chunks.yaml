  toc: []
- raw: '“《侵权责任法》自身的规则设计和背后蕴藏的制度张力能够较为妥善地解决现阶段的人工智能侵权的责任纠纷，在传统民法人物二分的制度构建下不应随意扩大民事主体的范围，以免徒增法教义学上的困惑。”^([\[102\]](#txt005.html#footnote_content_txt005_102))人工智能的研发与应用主体多元化使责任追究变得复杂化。现有的民事法律责任规则体系以人工智能产品作为法律关系客体为基本前提。机器的工具性是传统民事法律责任规则设计的基础。人工智能是程序员编程的结果，人工智能产品是工具性的存在。机器参与的活动不过是人的行为的延伸，造成的损害应当由智能机器（人）背后的行为人负责。人类利用人工智能产品与利用其他工具在本质上并无区别，因此人工智能产品造成的损害应当由其制造者、销售者、所有者、使用者等主体负责。


    （1）研发阶段：算法设计者


    人工智能时代，算法几乎无处不在，人类生活在算法的世界中。社会主体的上网痕迹、购物记录、位置信息等数据信息经算法处理后转化为一定的分数，影响社会对主体的评价以及主体未来的决策。在互联网的世界中，以为自己是主宰的人类往往被禁锢在算法的牢笼中。算法决定人们看到什么，预测人们会如何行动或决策。算法在一定程度上决定了智能机器（人）的决策或行为。通过规则约束算法设计者的行为能够起到防范或避免智能机器（人）随意决策或行为的作用。有学者认为：“如果是人工智能技术研发者即自动驾驶机动车的软件设计者提供的软件存在缺陷，则自动驾驶机动车的生产者、设计者应当按照《民法典》第1203
    条规定承担不真正连带责任。”^([\[103\]](#txt005.html#footnote_content_txt005_103))


    （2）生产和销售阶段：智能机器（人）的制造者


    “掌握核心技术的生产者作为风险的基本来源，具有较强的风险掌控能力，亦能通过集中化解风险的手段抽调出更多的社会资源。”^([\[104\]](#txt005.html#footnote_content_txt005_104))智能机器（人）是人类制造的产品，制造者对产品致人损害需要承担责任的情形主要包括：第一，因制造缺陷而致人损害的责任。制造缺陷是指因制造者未尽到必要注意义务而导致智能机器（人）存在产品缺陷。智能机器（人）因制造缺陷致人损害，制造者需要承担法律责任。第二，因制造者的恶意使得智能机器（人）致人损害。人类智能是人工智能的原动力和基础，制造者在制造智能机器（人）的过程中，改变算法设计或硬件设计而导致损害的，制造者需要承担法律责任。


    流通环节连接生产环节和消费环节，起到桥梁作用，智能机器（人）由制造者转移至所有者或使用者进入消费环节通常需要经由销售者实现。销售者对产品致人损害需要承担责任的情形主要包括：第一，在销售环节因销售者的过错使得智能机器（人）出现缺陷；第二，受害人因产品制造缺陷向销售者请求赔偿。


    有学者对销售商就制造缺陷承担连带责任提出质疑。人工智能系统的设计以及内在工作模式具有不透明性和难以解释性，“复杂人工智能系统在设计上存在的缺陷，不仅消费者们难以发现，就算是下游的生产商与销售商同样无法知晓。”^([\[105\]](#txt005.html#footnote_content_txt005_105))销售商与消费者对人工智能研发和应用细节的不知情被作为否定销售商承担连带责任的理由。这一观点虽不无道理，但是值得商榷。相对于消费者，销售商在风险认知和控制上具有明显优势。销售商作为沟通生产商与消费者的桥梁，对生产者进行追责更为容易。倘若免除销售商的连带责任，对生产情况甚至生产商信息不知情的消费者可能陷入无法获得救济的困境。


    （3）使用阶段：智能机器（人）的所有者和使用者


    在智能机器（人）被作为产品的情况下，因使用产品而造成损害的，由使用者或所有者承担责任。杨立新教授认为：“产品使用行为的后果要归产品的使用者、所有者承担。”^([\[106\]](#txt005.html#footnote_content_txt005_106))


    （4）影响力标准


    在智能机器（人）尚不具备独立意识的前提下，其无法对自身行为对第三人造成的损害负责。依据现行法律规范，智能机器（人）造成的损害由其制造者、所有者或使用者等主体负责。上述主体基于危险物品责任或产品责任承担相应的民事责任，旨在通过注意义务避免相应的加害行为发生。“从研发到使用全过程的所有参与者，他们对于人工智能的侵权责任的承担与其对该人工智能的影响呈正相关，也就是说，对人工智能的影响越大，侵权责任应当越重。”^([\[107\]](#txt005.html#footnote_content_txt005_107))在研发过程中，人类通过算法设计决定了人工智能的初始等级、功能、用途等。在生产过程中，人类决定了人工智能的外观、材质等。终端的消费者则在数据训练方面影响人工智能。“生产者、销售者、消费者（管理人或使用人）三者相比，对人工智能的影响逐渐减弱，责任程度逐渐减轻，这一点看来是合理的。”^([\[108\]](#txt005.html#footnote_content_txt005_108))


    （5）大口袋原则：以受害人救济为中心的责任主体范围确定


    为拓宽受害者得到救济的途径，有学者建议根据《民法典》第1170 条关于共同危险行为规则，将智能机器（人）的制造者、设计者甚至服务提供者都纳入责任主体的范围，在无法查清责任主体时由上述主体对受害人承担连带责任。^([\[109\]](#txt005.html#footnote_content_txt005_109))存在疑问的是，共同危险行为以侵权行为人实施了导致损害发生的危险行为为前提。但是，智能机器（人）的设计者以及精密地图的提供者等参与主体可能只是参与了前期研发工作，他们就智能机器（人）的实际应用场景根本不知情，不具有控制风险的能力。倘若要求上述主体承担连带责任，与风险控制的一般原理相悖。应当严格限定大口袋原则适用的范围，不能使责任承担成为人工智能技术研发与应用的障碍，妨害技术进步和社会发展。


    （三）强人工智能时代的民事法律责任主体：以自主性为基础的分析


    随着人工智能技术的革新，智能机器（人）行为的被动性理论预设被动摇。智能机器（人）的认知和学习能力不断增强，冲击着现有民事法律责任规则体系赖以存在的理论假设。自主智能机器（人）的决策和行为虽然是人类设计者编程和制造的结果，但是并非程序设计者直接指令安排的结果。自主智能机器（人）能够对在不同场景获取的信息进行分析、判断并作出决策，而这并非是程序设计者事先安排或可以预料的。当智能机器（人）的行为具有自主性，行为模式转变为“感知—思考—行动”时，智能机器（人）的行为与人的行为相对独立，将智能机器（人）造成的损害归责于生产者、所有者或使用者的基础被动摇甚至丧失。“机器人的自主性越强，就越难将其当成是其他主体（比如制造商、所有人、使用者等）手中的简单工具，这反过来使得既有的责任规则开始变得不足，因而需要新的规则。新的规则着眼于如何让一台机器为其行为或者疏忽而部分或全部地承担责任。”^([\[110\]](#txt005.html#footnote_content_txt005_110))智能机器（人）能否作为独立民事责任主体的问题值得深入思考。


    1.行为相对独立性视角下的分析


    人工智能的智能要素决定人工智能产品与一般的产品之间存在差异。拥有深度学习等算法的智能机器（人）的行为和决策并非程序员最初设计的结果，智能机器（人）具有相对独立的推理、判断及决定的能力。智能机器（人）在决策或行为方面的相对独立性，切断了行为与人类主体之间的联系，将智能机器（人）作为侵权行为的主体具有了理论上的正当性。换言之，智能机器（人）的自主性增强，其工具性特征弱化，将其致害行为归因于人类个体或组织体的正当性随之减弱。传统民事法律责任规则无法满足新形势的要求。


    侵权行为主体与责任主体通常是同一的，即实施侵权行为的主体需要承担侵权行为产生的不利法律后果。但是，侵权行为主体与责任主体也存在分离的现象，如职务侵权行为。智能机器（人）即便能作为侵权行为主体也并不意味着其当然能够成为侵权责任的承担主体。“对于人工智能，侵权责任与赔偿责任可能不统一，因为人工智能是物，无法承担侵权责任。但与一般机器侵权的无过错责任不同的是，人工智能可以用自己的保险、基金、劳动报酬来支付其损害赔偿。”^([\[111\]](#txt005.html#footnote_content_txt005_111))


    2.泛自主性现象


    目前人工智能技术的研发与应用尚未达到智能机器（人）能自主行为导致侵害或损害的程度。2016 年11 月中下旬，在深圳召开的第十八届中国国际高新技术成果交易会（China
    Hi-Tech Fair）中上演了机器人意识觉醒、威胁人类安全的一幕。在没有得到任何指令的情况下，名为“小胖”的家用服务型机器人突然打砸玻璃，致路人受伤。事后，“小胖”的展商北京进化者机器人科技有限公司发布声明称，“小胖”机器人发生“失控”行为不过是由于参展人员误操作。“小胖”机器人的行为缺乏自主性，并无独立意志。对“小胖”机器人拟人化的过度解读不过是部分媒体渲染和炒作的结果。^([\[112\]](#txt005.html#footnote_content_txt005_112))


    类似事件在德国也有发生，网络报道盛传德国大众公司的机器人突袭技术人员。该报道称一名技术人员在安装机器人的过程中，处于静止状态的机器人突然“抓住”其胸部并将其“压在”铁板上，最终导致技术人员死亡。溯本求源，该消息最初来自原英国《金融时报》网络版的一则报道。该报道原文使用了“struck”（撞击）一词，并将该事件解释为工业事故。但是此后的报道用“catch”（抓住）替代了“struck”（撞击），将其描述为因技术故障而导致的“杀人案”。


    耸人听闻的故事不过是主观臆想、夸大其词和以讹传讹的结果，并非事实真相。事后辟谣发现，轩然大波不过是无风起浪。艾伦·温菲尔德（Alan Winfield）教授称：“很遗憾，大家夸大了机器人的能力，而且过分惧怕机器人。科幻电影和媒体报道让大家变得过分敏感。”^([\[113\]](#txt005.html#footnote_content_txt005_113))机器人自主决策、自己负责的基础尚不具备。外观上独立的自主行为仍然是程序设计的结果，机器人并没有独立意识，更不会恶意攻击人类。人类在编程或操作中出现的错误被转嫁给了机器人，机器人成为人类的替罪羊。


    即便智能机器人作为独立民事责任主体的条件尚不成熟，也有必要对由人工智能造成的人身或财产损失的责任主体重新进行思考。如何将行业标准与事故责任分配机制相结合、人工智能设计者与所有者和使用者之间的关系等问题的解决方案直接关系到人工智能行业的未来发展。“联合国教科文组织与世界科学知识与技术伦理委员会在2016
    年的报告中……在对机器人的操作失灵造成事故，形成责任承担问题时，报告甚至提出，可以让智能机器人承担责任，因为智能机器人确实拥有前所未有的自主性，并且拥有能够独立作出决策的能力。”^([\[114\]](#txt005.html#footnote_content_txt005_114))


    在人工智能技术研发与应用的前景无法准确预见的情况下，法律对民事责任主体规则的设计需要兼顾现实与未来。一方面，根据目前人工智能技术研发和应用的情况，侧重将人类而非智能机器（人）作为责任主体进行规则设计，考虑智能机器（人）决策和行为的自主性，在主客体二元划分的框架下探索特别规则；另一方面，考虑到人工智能技术研发和应用的未来发展，为有条件地赋予智能机器（人）法律主体地位预留空间。


    第二节　人工智能时代民事法律责任的形态


    人工智能产品是具有一定自主性的智能机器。智能与机器的组成方式使得人工智能产品兼具人的属性和物的属性。有学者将民事法律责任分为侧重人之属性的责任和侧重物之属性的责任两种形态。“代理人责任、法人责任、替代责任偏向于人工智能的‘人’之属性，或类比于自然人，或类比于法律拟制之人；产品责任和动物致人损害责任偏向于‘物’之属性。”^([\[115\]](#txt005.html#footnote_content_txt005_115))


    一、侧重物之属性的责任形态：客体定位下的解释论视角


    “现有技术下不应过分强调人工智能‘人’之属性。”^([\[116\]](#txt005.html#footnote_content_txt005_116))目前，人工智能的综合智力水平仍无法与一般自然人相比，相应的法律责任需要由人而非智能机器（人）承担。“在机器人责任的调整上，无论是普通民事责任，还是高度危险来源致人损害责任以及产品责任，主要是以人类作为归责的伦理主体和法律主体，而非以机器人作为责任主体。”^([\[117\]](#txt005.html#footnote_content_txt005_117))


    （一）高度危险来源占有人责任


    机器智能化使得即便将智能机器（人）作为客体对待，也有别于一般的财产，机器智能潜伏着高度危险。占有智能机器（人）的主体由于占有高度危险来源的财产需要承担责任。《格里申法案》第127
    条第2 款规定智能机器（人）的占有人需要依据《俄罗斯联邦民法典》第1079 条关于高度危险来源致人损害的规定承担民事法律责任。


    “对于占有人的确定，法案专门规定了‘机器人—代理人的占有人’条文，‘机器人—代理人的占有人应当理解为以所有权、经营权、业务管理权、租赁权或者其他合法依据使用机器人—代理人的法人、自然人或其他机器人—代理人’（第127.3
    条第1 款）。”^([\[118\]](#txt005.html#footnote_content_txt005_118))由此可见，占有人是指基于合法权源对智能机器（人）进行占有的主体，包括自然人、法人以及其他智能机器（人）。对这一做法存在两点疑问：第一，占有是一种事实，而非权利状态，分为合法占有与非法占有。高度危险来源占有人基于占有而承担的占有人责任是一种侵权责任。占有人基于合法权源占有或是非基于合法权源占有并不影响占有事实本身，规定基于合法权源占有智能机器（人）的占有人承担民事责任，而将非基于合法权源占有智能机器（人）的占有人排除在占有人之外，在法律价值判断上缺乏正当理由。第二，智能机器（人）存在作为其他智能机器（人）的占有人进而作为责任主体的可能。这就使得在同一法律关系中智能机器（人）同时拥有主体和客体的双重身份。在缺乏通过类型划分将智能机器（人）严格区分为主体类智能机器（人）和客体类智能机器（人）的情况下，智能机器（人）承担高度危险来源占有人责任会使得理论认知和规则适用陷入困境。


    （二）产品责任：以《民法典》第1203 条为中心


    产品责任是指因产品缺陷导致他人人身或财产受损害而由产品制造商、销售商或供应商承担的责任。我国《民法典》设专章对“产品责任”进行了规定^([\[119\]](#txt005.html#footnote_content_txt005_119))，《中华人民共和国产品质量法》（以下简称《产品质量法》）对“产品质量责任”进行了系统规定，而《中华人民共和国消费者权益保护法》第7
    章“法律责任”从消费者权益保护的角度对产品责任进行了规定。我国形成了以产品缺陷为核心概念的产品责任法律体系。生产者承担产品责任的前提是消费者“原告必须证明产品有缺陷，这一缺陷是造成原告损害的近因（proximate
    cause），并且这一缺陷在产品制造者控制产品时已产生”^([\[120\]](#txt005.html#footnote_content_txt005_120))。这一证明是比较困难的。“由于人工智能系统自身的黑箱性质和不可解释性，也很难证明缺陷的存在。”^([\[121\]](#txt005.html#footnote_content_txt005_121))在已经发生的智能驾驶事故中，相当一部分可能是智能驾驶系统存在缺陷导致的，但是该推论因缺乏证据未能得到法院支持。


    “产品责任法上的产品通常限于生产出来的有形的物质商品，对于软件（计算机程序）等无形产品，我国尚无明确规定是否可以适用产品责任。”^([\[122\]](#txt005.html#footnote_content_txt005_122))智能程序软件存在缺陷导致损害能否适用产品责任规则存在疑问。^([\[123\]](#txt005.html#footnote_content_txt005_123))人工智能机器或设备导致的损害是否属于产品责任调整的范围取决于对智能机器（人）的定位。联合国教科文组织与世界科学知识与技术伦理委员会于2016年发布的报告认为：智能机器（人）是制造者生产的科技产品，其导致的损害可以归责于制造者、销售者等主体，能够通过民法中的产品责任规则予以调整。^([\[124\]](#txt005.html#footnote_content_txt005_124))


    1.逻辑前提：智能机器（人）作为产品的法律定位


    （1）智能机器（人）的产品属性


    在弱人工智能时代，主体与客体二元划分的框架尚未受到毁灭性冲击，智能机器（人）作为程序设计和制造的产物，基本定位是动产，具有产品属性。从目前智能技术研发和应用的情况看，它并非主体性的存在而是工具性的存在。“我们在法律中只要将人工智能定义为‘对人工智能进行模拟的工具’，那么其就不会对现有法律体系中的法律主体产生任何影响。”^([\[125\]](#txt005.html#footnote_content_txt005_125))弱人工智能时代智能机器（人）与人类制造的其他产品之间共性多于个性，需要通过“产品责任”规则体系分配相关损失。


    不可否认，语言对社会生活具有一定的形塑作用，通过对人工智能进行概念界定的方式缓和法律体系的内在矛盾冲突具有一定的作用。但是，从法律与社会生活的关系角度观察，从来都是法律概念适应现实生活，而非相反。在法律上将人工智能界定为一种工具，并不能一劳永逸地将智能机器（人）限定在工具的范畴内，其属性取决于智能技术的研发与应用。


    （2）人工智能产品的特殊性


    智能机器（人）毕竟不同于传统的产品，其自主学习和行为的能力决定关于产品的现行法律规定不能或不能妥当地完全解决问题。将智能机器（人）纳入产品的范畴，试图在与产品相关的法律体系中解决人工智能时代产生的新问题未免过于乐观。“现有产品责任法中关于产品的概念，并没有预设针对智能活动产品的内容。”^([\[126\]](#txt005.html#footnote_content_txt005_126))现有的产品责任法律规范体系在人工智能时代显得捉襟见肘，尤其“面对自主智能机器人，人们将需要开始审视既有的产品责任制度能否在制造商利益和消费者利益之间实现平衡”^([\[127\]](#txt005.html#footnote_content_txt005_127))。


    2.人工智能时代关于产品缺陷责任的反思'
  fmt: '

    “《侵权责任法》自身的规则设计和背后蕴藏的制度张力能够较为妥善地解决现阶段的人工智能侵权的责任纠纷，在传统民法人物二分的制度构建下不应随意扩大民事主体的范围，以免徒增法教义学上的困惑。”^([\[102\]](#txt005.html#footnote_content_txt005_102))人工智能的研发与应用主体多元化使责任追究变得复杂化。现有的民事法律责任规则体系以人工智能产品作为法律关系客体为基本前提。机器的工具性是传统民事法律责任规则设计的基础。人工智能是程序员编程的结果，人工智能产品是工具性的存在。机器参与的活动不过是人的行为的延伸，造成的损害应当由智能机器（人）背后的行为人负责。人类利用人工智能产品与利用其他工具在本质上并无区别，因此人工智能产品造成的损害应当由其制造者、销售者、所有者、使用者等主体负责。


    ### （1）研发阶段：算法设计者

    人工智能时代，算法几乎无处不在，人类生活在算法的世界中。社会主体的上网痕迹、购物记录、位置信息等数据信息经算法处理后转化为一定的分数，影响社会对主体的评价以及主体未来的决策。在互联网的世界中，以为自己是主宰的人类往往被禁锢在算法的牢笼中。算法决定人们看到什么，预测人们会如何行动或决策。算法在一定程度上决定了智能机器（人）的决策或行为。通过规则约束算法设计者的行为能够起到防范或避免智能机器（人）随意决策或行为的作用。有学者认为：“如果是人工智能技术研发者即自动驾驶机动车的软件设计者提供的软件存在缺陷，则自动驾驶机动车的生产者、设计者应当按照《民法典》第1203
    条规定承担不真正连带责任。”^([\[103\]](#txt005.html#footnote_content_txt005_103))


    ### （2）生产和销售阶段：智能机器（人）的制造者

    “掌握核心技术的生产者作为风险的基本来源，具有较强的风险掌控能力，亦能通过集中化解风险的手段抽调出更多的社会资源。”^([\[104\]](#txt005.html#footnote_content_txt005_104))智能机器（人）是人类制造的产品，制造者对产品致人损害需要承担责任的情形主要包括：第一，因制造缺陷而致人损害的责任。制造缺陷是指因制造者未尽到必要注意义务而导致智能机器（人）存在产品缺陷。智能机器（人）因制造缺陷致人损害，制造者需要承担法律责任。第二，因制造者的恶意使得智能机器（人）致人损害。人类智能是人工智能的原动力和基础，制造者在制造智能机器（人）的过程中，改变算法设计或硬件设计而导致损害的，制造者需要承担法律责任。

    流通环节连接生产环节和消费环节，起到桥梁作用，智能机器（人）由制造者转移至所有者或使用者进入消费环节通常需要经由销售者实现。销售者对产品致人损害需要承担责任的情形主要包括：第一，在销售环节因销售者的过错使得智能机器（人）出现缺陷；第二，受害人因产品制造缺陷向销售者请求赔偿。

    有学者对销售商就制造缺陷承担连带责任提出质疑。人工智能系统的设计以及内在工作模式具有不透明性和难以解释性，“复杂人工智能系统在设计上存在的缺陷，不仅消费者们难以发现，就算是下游的生产商与销售商同样无法知晓。”^([\[105\]](#txt005.html#footnote_content_txt005_105))销售商与消费者对人工智能研发和应用细节的不知情被作为否定销售商承担连带责任的理由。这一观点虽不无道理，但是值得商榷。相对于消费者，销售商在风险认知和控制上具有明显优势。销售商作为沟通生产商与消费者的桥梁，对生产者进行追责更为容易。倘若免除销售商的连带责任，对生产情况甚至生产商信息不知情的消费者可能陷入无法获得救济的困境。


    ### （3）使用阶段：智能机器（人）的所有者和使用者

    在智能机器（人）被作为产品的情况下，因使用产品而造成损害的，由使用者或所有者承担责任。杨立新教授认为：“产品使用行为的后果要归产品的使用者、所有者承担。”^([\[106\]](#txt005.html#footnote_content_txt005_106))


    ### （4）影响力标准

    在智能机器（人）尚不具备独立意识的前提下，其无法对自身行为对第三人造成的损害负责。依据现行法律规范，智能机器（人）造成的损害由其制造者、所有者或使用者等主体负责。上述主体基于危险物品责任或产品责任承担相应的民事责任，旨在通过注意义务避免相应的加害行为发生。“从研发到使用全过程的所有参与者，他们对于人工智能的侵权责任的承担与其对该人工智能的影响呈正相关，也就是说，对人工智能的影响越大，侵权责任应当越重。”^([\[107\]](#txt005.html#footnote_content_txt005_107))在研发过程中，人类通过算法设计决定了人工智能的初始等级、功能、用途等。在生产过程中，人类决定了人工智能的外观、材质等。终端的消费者则在数据训练方面影响人工智能。“生产者、销售者、消费者（管理人或使用人）三者相比，对人工智能的影响逐渐减弱，责任程度逐渐减轻，这一点看来是合理的。”^([\[108\]](#txt005.html#footnote_content_txt005_108))


    ### （5）大口袋原则：以受害人救济为中心的责任主体范围确定

    为拓宽受害者得到救济的途径，有学者建议根据《民法典》第1170 条关于共同危险行为规则，将智能机器（人）的制造者、设计者甚至服务提供者都纳入责任主体的范围，在无法查清责任主体时由上述主体对受害人承担连带责任。^([\[109\]](#txt005.html#footnote_content_txt005_109))存在疑问的是，共同危险行为以侵权行为人实施了导致损害发生的危险行为为前提。但是，智能机器（人）的设计者以及精密地图的提供者等参与主体可能只是参与了前期研发工作，他们就智能机器（人）的实际应用场景根本不知情，不具有控制风险的能力。倘若要求上述主体承担连带责任，与风险控制的一般原理相悖。应当严格限定大口袋原则适用的范围，不能使责任承担成为人工智能技术研发与应用的障碍，妨害技术进步和社会发展。


    ## （三）强人工智能时代的民事法律责任主体：以自主性为基础的分析

    随着人工智能技术的革新，智能机器（人）行为的被动性理论预设被动摇。智能机器（人）的认知和学习能力不断增强，冲击着现有民事法律责任规则体系赖以存在的理论假设。自主智能机器（人）的决策和行为虽然是人类设计者编程和制造的结果，但是并非程序设计者直接指令安排的结果。自主智能机器（人）能够对在不同场景获取的信息进行分析、判断并作出决策，而这并非是程序设计者事先安排或可以预料的。当智能机器（人）的行为具有自主性，行为模式转变为“感知—思考—行动”时，智能机器（人）的行为与人的行为相对独立，将智能机器（人）造成的损害归责于生产者、所有者或使用者的基础被动摇甚至丧失。“机器人的自主性越强，就越难将其当成是其他主体（比如制造商、所有人、使用者等）手中的简单工具，这反过来使得既有的责任规则开始变得不足，因而需要新的规则。新的规则着眼于如何让一台机器为其行为或者疏忽而部分或全部地承担责任。”^([\[110\]](#txt005.html#footnote_content_txt005_110))智能机器（人）能否作为独立民事责任主体的问题值得深入思考。


    ### 1. 行为相对独立性视角下的分析

    人工智能的智能要素决定人工智能产品与一般的产品之间存在差异。拥有深度学习等算法的智能机器（人）的行为和决策并非程序员最初设计的结果，智能机器（人）具有相对独立的推理、判断及决定的能力。智能机器（人）在决策或行为方面的相对独立性，切断了行为与人类主体之间的联系，将智能机器（人）作为侵权行为的主体具有了理论上的正当性。换言之，智能机器（人）的自主性增强，其工具性特征弱化，将其致害行为归因于人类个体或组织体的正当性随之减弱。传统民事法律责任规则无法满足新形势的要求。

    侵权行为主体与责任主体通常是同一的，即实施侵权行为的主体需要承担侵权行为产生的不利法律后果。但是，侵权行为主体与责任主体也存在分离的现象，如职务侵权行为。智能机器（人）即便能作为侵权行为主体也并不意味着其当然能够成为侵权责任的承担主体。“对于人工智能，侵权责任与赔偿责任可能不统一，因为人工智能是物，无法承担侵权责任。但与一般机器侵权的无过错责任不同的是，人工智能可以用自己的保险、基金、劳动报酬来支付其损害赔偿。”^([\[111\]](#txt005.html#footnote_content_txt005_111))


    ### 2. 泛自主性现象

    目前人工智能技术的研发与应用尚未达到智能机器（人）能自主行为导致侵害或损害的程度。2016 年11 月中下旬，在深圳召开的第十八届中国国际高新技术成果交易会（China
    Hi-Tech Fair）中上演了机器人意识觉醒、威胁人类安全的一幕。在没有得到任何指令的情况下，名为“小胖”的家用服务型机器人突然打砸玻璃，致路人受伤。事后，“小胖”的展商北京进化者机器人科技有限公司发布声明称，“小胖”机器人发生“失控”行为不过是由于参展人员误操作。“小胖”机器人的行为缺乏自主性，并无独立意志。对“小胖”机器人拟人化的过度解读不过是部分媒体渲染和炒作的结果。^([\[112\]](#txt005.html#footnote_content_txt005_112))

    类似事件在德国也有发生，网络报道盛传德国大众公司的机器人突袭技术人员。该报道称一名技术人员在安装机器人的过程中，处于静止状态的机器人突然“抓住”其胸部并将其“压在”铁板上，最终导致技术人员死亡。溯本求源，该消息最初来自原英国《金融时报》网络版的一则报道。该报道原文使用了“struck”（撞击）一词，并将该事件解释为工业事故。但是此后的报道用“catch”（抓住）替代了“struck”（撞击），将其描述为因技术故障而导致的“杀人案”。

    耸人听闻的故事不过是主观臆想、夸大其词和以讹传讹的结果，并非事实真相。事后辟谣发现，轩然大波不过是无风起浪。艾伦·温菲尔德（Alan Winfield）教授称：“很遗憾，大家夸大了机器人的能力，而且过分惧怕机器人。科幻电影和媒体报道让大家变得过分敏感。”^([\[113\]](#txt005.html#footnote_content_txt005_113))机器人自主决策、自己负责的基础尚不具备。外观上独立的自主行为仍然是程序设计的结果，机器人并没有独立意识，更不会恶意攻击人类。人类在编程或操作中出现的错误被转嫁给了机器人，机器人成为人类的替罪羊。

    即便智能机器人作为独立民事责任主体的条件尚不成熟，也有必要对由人工智能造成的人身或财产损失的责任主体重新进行思考。如何将行业标准与事故责任分配机制相结合、人工智能设计者与所有者和使用者之间的关系等问题的解决方案直接关系到人工智能行业的未来发展。“联合国教科文组织与世界科学知识与技术伦理委员会在2016
    年的报告中……在对机器人的操作失灵造成事故，形成责任承担问题时，报告甚至提出，可以让智能机器人承担责任，因为智能机器人确实拥有前所未有的自主性，并且拥有能够独立作出决策的能力。”^([\[114\]](#txt005.html#footnote_content_txt005_114))

    在人工智能技术研发与应用的前景无法准确预见的情况下，法律对民事责任主体规则的设计需要兼顾现实与未来。一方面，根据目前人工智能技术研发和应用的情况，侧重将人类而非智能机器（人）作为责任主体进行规则设计，考虑智能机器（人）决策和行为的自主性，在主客体二元划分的框架下探索特别规则；另一方面，考虑到人工智能技术研发和应用的未来发展，为有条件地赋予智能机器（人）法律主体地位预留空间。


    ## 第二节 人工智能时代民事法律责任的形态

    人工智能产品是具有一定自主性的智能机器。智能与机器的组成方式使得人工智能产品兼具人的属性和物的属性。有学者将民事法律责任分为侧重人之属性的责任和侧重物之属性的责任两种形态。“代理人责任、法人责任、替代责任偏向于人工智能的‘人’之属性，或类比于自然人，或类比于法律拟制之人；产品责任和动物致人损害责任偏向于‘物’之属性。”^([\[115\]](#txt005.html#footnote_content_txt005_115))


    ### 一、侧重物之属性的责任形态：客体定位下的解释论视角

    “现有技术下不应过分强调人工智能‘人’之属性。”^([\[116\]](#txt005.html#footnote_content_txt005_116))目前，人工智能的综合智力水平仍无法与一般自然人相比，相应的法律责任需要由人而非智能机器（人）承担。“在机器人责任的调整上，无论是普通民事责任，还是高度危险来源致人损害责任以及产品责任，主要是以人类作为归责的伦理主体和法律主体，而非以机器人作为责任主体。”^([\[117\]](#txt005.html#footnote_content_txt005_117))


    #### （一）高度危险来源占有人责任

    机器智能化使得即便将智能机器（人）作为客体对待，也有别于一般的财产，机器智能潜伏着高度危险。占有智能机器（人）的主体由于占有高度危险来源的财产需要承担责任。《格里申法案》第127
    条第2 款规定智能机器（人）的占有人需要依据《俄罗斯联邦民法典》第1079 条关于高度危险来源致人损害的规定承担民事法律责任。

    “对于占有人的确定，法案专门规定了‘机器人—代理人的占有人’条文，‘机器人—代理人的占有人应当理解为以所有权、经营权、业务管理权、租赁权或者其他合法依据使用机器人—代理人的法人、自然人或其他机器人—代理人’（第127.3
    条第1 款）。”^([\[118\]](#txt005.html#footnote_content_txt005_118))由此可见，占有人是指基于合法权源对智能机器（人）进行占有的主体，包括自然人、法人以及其他智能机器（人）。对这一做法存在两点疑问：第一，占有是一种事实，而非权利状态，分为合法占有与非法占有。高度危险来源占有人基于占有而承担的占有人责任是一种侵权责任。占有人基于合法权源占有或是非基于合法权源占有并不影响占有事实本身，规定基于合法权源占有智能机器（人）的占有人承担民事责任，而将非基于合法权源占有智能机器（人）的占有人排除在占有人之外，在法律价值判断上缺乏正当理由。第二，智能机器（人）存在作为其他智能机器（人）的占有人进而作为责任主体的可能。这就使得在同一法律关系中智能机器（人）同时拥有主体和客体的双重身份。在缺乏通过类型划分将智能机器（人）严格区分为主体类智能机器（人）和客体类智能机器（人）的情况下，智能机器（人）承担高度危险来源占有人责任会使得理论认知和规则适用陷入困境。


    #### （二）产品责任：以《民法典》第1203 条为中心

    产品责任是指因产品缺陷导致他人人身或财产受损害而由产品制造商、销售商或供应商承担的责任。我国《民法典》设专章对“产品责任”进行了规定^([\[119\]](#txt005.html#footnote_content_txt005_119))，《中华人民共和国产品质量法》（以下简称《产品质量法》）对“产品质量责任”进行了系统规定，而《中华人民共和国消费者权益保护法》第7
    章“法律责任”从消费者权益保护的角度对产品责任进行了规定。我国形成了以产品缺陷为核心概念的产品责任法律体系。生产者承担产品责任的前提是消费者“原告必须证明产品有缺陷，这一缺陷是造成原告损害的近因（proximate
    cause），并且这一缺陷在产品制造者控制产品时已产生”^([\[120\]](#txt005.html#footnote_content_txt005_120))。这一证明是比较困难的。“由于人工智能系统自身的黑箱性质和不可解释性，也很难证明缺陷的存在。”^([\[121\]](#txt005.html#footnote_content_txt005_121))在已经发生的智能驾驶事故中，相当一部分可能是智能驾驶系统存在缺陷导致的，但是该推论因缺乏证据未能得到法院支持。

    “产品责任法上的产品通常限于生产出来的有形的物质商品，对于软件（计算机程序）等无形产品，我国尚无明确规定是否可以适用产品责任。”^([\[122\]](#txt005.html#footnote_content_txt005_122))智能程序软件存在缺陷导致损害能否适用产品责任规则存在疑问。^([\[123\]](#txt005.html#footnote_content_txt005_123))人工智能机器或设备导致的损害是否属于产品责任调整的范围取决于对智能机器（人）的定位。联合国教科文组织与世界科学知识与技术伦理委员会于2016年发布的报告认为：智能机器（人）是制造者生产的科技产品，其导致的损害可以归责于制造者、销售者等主体，能够通过民法中的产品责任规则予以调整。^([\[124\]](#txt005.html#footnote_content_txt005_124))


    ##### 1. 逻辑前提：智能机器（人）作为产品的法律定位

    ###### （1）智能机器（人）的产品属性

    在弱人工智能时代，主体与客体二元划分的框架尚未受到毁灭性冲击，智能机器（人）作为程序设计和制造的产物，基本定位是动产，具有产品属性。从目前智能技术研发和应用的情况看，它并非主体性的存在而是工具性的存在。“我们在法律中只要将人工智能定义为‘对人工智能进行模拟的工具’，那么其就不会对现有法律体系中的法律主体产生任何影响。”^([\[125\]](#txt005.html#footnote_content_txt005_125))弱人工智能时代智能机器（人）与人类制造的其他产品之间共性多于个性，需要通过“产品责任”规则体系分配相关损失。

    不可否认，语言对社会生活具有一定的形塑作用，通过对人工智能进行概念界定的方式缓和法律体系的内在矛盾冲突具有一定的作用。但是，从法律与社会生活的关系角度观察，从来都是法律概念适应现实生活，而非相反。在法律上将人工智能界定为一种工具，并不能一劳永逸地将智能机器（人）限定在工具的范畴内，其属性取决于智能技术的研发与应用。


    ###### （2）人工智能产品的特殊性

    智能机器（人）毕竟不同于传统的产品，其自主学习和行为的能力决定关于产品的现行法律规定不能或不能妥当地完全解决问题。将智能机器（人）纳入产品的范畴，试图在与产品相关的法律体系中解决人工智能时代产生的新问题未免过于乐观。“现有产品责任法中关于产品的概念，并没有预设针对智能活动产品的内容。”^([\[126\]](#txt005.html#footnote_content_txt005_126))现有的产品责任法律规范体系在人工智能时代显得捉襟见肘，尤其“面对自主智能机器人，人们将需要开始审视既有的产品责任制度能否在制造商利益和消费者利益之间实现平衡”^([\[127\]](#txt005.html#footnote_content_txt005_127))。


    ##### 2. 人工智能时代关于产品缺陷责任的反思

    '
  trans: '


    “《侵权责任法》自身的规则设计和背后蕴藏的制度张力能够较为妥善地解决现阶段的人工智能侵权的责任纠纷，在传统民法人物二分的制度构建下不应随意扩大民事主体的范围，以免徒增法教义学上的困惑。”^([\[102\]](#txt005.html#footnote_content_txt005_102))人工智能的研发与应用主体多元化使责任追究变得复杂化。现有的民事法律责任规则体系以人工智能产品作为法律关系客体为基本前提。机器的工具性是传统民事法律责任规则设计的基础。人工智能是程序员编程的结果，人工智能产品是工具性的存在。机器参与的活动不过是人的行为的延伸，造成的损害应当由智能机器（人）背后的行为人负责。人类利用人工智能产品与利用其他工具在本质上并无区别，因此人工智能产品造成的损害应当由其制造者、销售者、所有者、使用者等主体负责。


    ### （1）研发阶段：算法设计者

    人工智能时代，算法几乎无处不在，人类生活在算法的世界中。社会主体的上网痕迹、购物记录、位置信息等数据信息经算法处理后转化为一定的分数，影响社会对主体的评价以及主体未来的决策。在互联网的世界中，以为自己是主宰的人类往往被禁锢在算法的牢笼中。算法决定人们看到什么，预测人们会如何行动或决策。算法在一定程度上决定了智能机器（人）的决策或行为。通过规则约束算法设计者的行为能够起到防范或避免智能机器（人）随意决策或行为的作用。有学者认为：“如果是人工智能技术研发者即自动驾驶机动车的软件设计者提供的软件存在缺陷，则自动驾驶机动车的生产者、设计者应当按照《民法典》第
    1203 条规定承担不真正连带责任。”^([\[103\]](#txt005.html#footnote_content_txt005_103))


    ### （2）生产和销售阶段：智能机器（人）的制造者

    “掌握核心技术的生产者作为风险的基本来源，具有较强的风险掌控能力，亦能通过集中化解风险的手段抽调出更多的社会资源。”^([\[104\]](#txt005.html#footnote_content_txt005_104))智能机器（人）是人类制造的产品，制造者对产品致人损害需要承担责任的情形主要包括：第一，因制造缺陷而致人损害的责任。制造缺陷是指因制造者未尽到必要注意义务而导致智能机器（人）存在产品缺陷。智能机器（人）因制造缺陷致人损害，制造者需要承担法律责任。第二，因制造者的恶意使得智能机器（人）致人损害。人类智能是人工智能的原动力和基础，制造者在制造智能机器（人）的过程中，改变算法设计或硬件设计而导致损害的，制造者需要承担法律责任。

    流通环节连接生产环节和消费环节，起到桥梁作用，智能机器（人）由制造者转移至所有者或使用者进入消费环节通常需要经由销售者实现。销售者对产品致人损害需要承担责任的情形主要包括：第一，在销售环节因销售者的过错使得智能机器（人）出现缺陷；第二，受害人因产品制造缺陷向销售者请求赔偿。

    有学者对销售商就制造缺陷承担连带责任提出质疑。人工智能系统的设计以及内在工作模式具有不透明性和难以解释性，“复杂人工智能系统在设计上存在的缺陷，不仅消费者们难以发现，就算是下游的生产商与销售商同样无法知晓。”^([\[105\]](#txt005.html#footnote_content_txt005_105))销售商与消费者对人工智能研发和应用细节的不知情被作为否定销售商承担连带责任的理由。这一观点虽不无道理，但是值得商榷。相对于消费者，销售商在风险认知和控制上具有明显优势。销售商作为沟通生产商与消费者的桥梁，对生产者进行追责更为容易。倘若免除销售商的连带责任，对生产情况甚至生产商信息不知情的消费者可能陷入无法获得救济的困境。


    ### （3）使用阶段：智能机器（人）的所有者和使用者

    在智能机器（人）被作为产品的情况下，因使用产品而造成损害的，由使用者或所有者承担责任。杨立新教授认为：“产品使用行为的后果要归产品的使用者、所有者承担。”^([\[106\]](#txt005.html#footnote_content_txt005_106))


    ### （4）影响力标准

    在智能机器（人）尚不具备独立意识的前提下，其无法对自身行为对第三人造成的损害负责。依据现行法律规范，智能机器（人）造成的损害由其制造者、所有者或使用者等主体负责。上述主体基于危险物品责任或产品责任承担相应的民事责任，旨在通过注意义务避免相应的加害行为发生。“从研发到使用全过程的所有参与者，他们对于人工智能的侵权责任的承担与其对该人工智能的影响呈正相关，也就是说，对人工智能的影响越大，侵权责任应当越重。”^([\[107\]](#txt005.html#footnote_content_txt005_107))在研发过程中，人类通过算法设计决定了人工智能的初始等级、功能、用途等。在生产过程中，人类决定了人工智能的外观、材质等。终端的消费者则在数据训练方面影响人工智能。“生产者、销售者、消费者（管理人或使用人）三者相比，对人工智能的影响逐渐减弱，责任程度逐渐减轻，这一点看来是合理的。”^([\[108\]](#txt005.html#footnote_content_txt005_108))


    ### （5）大口袋原则：以受害人救济为中心的责任主体范围确定

    为拓宽受害者得到救济的途径，有学者建议根据《民法典》第 1170 条关于共同危险行为规则，将智能机器（人）的制造者、设计者甚至服务提供者都纳入责任主体的范围，在无法查清责任主体时由上述主体对受害人承担连带责任。^([\[109\]](#txt005.html#footnote_content_txt005_109))存在疑问的是，共同危险行为以侵权行为人实施了导致损害发生的危险行为为前提。但是，智能机器（人）的设计者以及精密地图的提供者等参与主体可能只是参与了前期研发工作，他们就智能机器（人）的实际应用场景根本不知情，不具有控制风险的能力。倘若要求上述主体承担连带责任，与风险控制的一般原理相悖。应当严格限定大口袋原则适用的范围，不能使责任承担成为人工智能技术研发与应用的障碍，妨害技术进步和社会发展。


    ## （三）强人工智能时代的民事法律责任主体：以自主性为基础的分析

    随着人工智能技术的革新，智能机器（人）行为的被动性理论预设被动摇。智能机器（人）的认知和学习能力不断增强，冲击着现有民事法律责任规则体系赖以存在的理论假设。自主智能机器（人）的决策和行为虽然是人类设计者编程和制造的结果，但是并非程序设计者直接指令安排的结果。自主智能机器（人）能够对在不同场景获取的信息进行分析、判断并作出决策，而这并非是程序设计者事先安排或可以预料的。当智能机器（人）的行为具有自主性，行为模式转变为“感知—思考—行动”时，智能机器（人）的行为与人的行为相对独立，将智能机器（人）造成的损害归责于生产者、所有者或使用者的基础被动摇甚至丧失。“机器人的自主性越强，就越难将其当成是其他主体（比如制造商、所有人、使用者等）手中的简单工具，这反过来使得既有的责任规则开始变得不足，因而需要新的规则。新的规则着眼于如何让一台机器为其行为或者疏忽而部分或全部地承担责任。”^([\[110\]](#txt005.html#footnote_content_txt005_110))智能机器（人）能否作为独立民事责任主体的问题值得深入思考。


    ### 1. 行为相对独立性视角下的分析

    人工智能的智能要素决定人工智能产品与一般的产品之间存在差异。拥有深度学习等算法的智能机器（人）的行为和决策并非程序员最初设计的结果，智能机器（人）具有相对独立的推理、判断及决定的能力。智能机器（人）在决策或行为方面的相对独立性，切断了行为与人类主体之间的联系，将智能机器（人）作为侵权行为的主体具有了理论上的正当性。换言之，智能机器（人）的自主性增强，其工具性特征弱化，将其致害行为归因于人类个体或组织体的正当性随之减弱。传统民事法律责任规则无法满足新形势的要求。

    侵权行为主体与责任主体通常是同一的，即实施侵权行为的主体需要承担侵权行为产生的不利法律后果。但是，侵权行为主体与责任主体也存在分离的现象，如职务侵权行为。智能机器（人）即便能作为侵权行为主体也并不意味着其当然能够成为侵权责任的承担主体。“对于人工智能，侵权责任与赔偿责任可能不统一，因为人工智能是物，无法承担侵权责任。但与一般机器侵权的无过错责任不同的是，人工智能可以用自己的保险、基金、劳动报酬来支付其损害赔偿。”^([\[111\]](#txt005.html#footnote_content_txt005_111))


    ### 2. 泛自主性现象

    目前人工智能技术的研发与应用尚未达到智能机器（人）能自主行为导致侵害或损害的程度。2016 年 11 月中下旬，在深圳召开的第十八届中国国际高新技术成果交易会（China
    Hi-Tech Fair）中上演了机器人意识觉醒、威胁人类安全的一幕。在没有得到任何指令的情况下，名为“小胖”的家用服务型机器人突然打砸玻璃，致路人受伤。事后，“小胖”的展商北京进化者机器人科技有限公司发布声明称，“小胖”机器人发生“失控”行为不过是由于参展人员误操作。“小胖”机器人的行为缺乏自主性，并无独立意志。对“小胖”机器人拟人化的过度解读不过是部分媒体渲染和炒作的结果。^([\[112\]](#txt005.html#footnote_content_txt005_112))

    类似事件在德国也有发生，网络报道盛传德国大众公司的机器人突袭技术人员。该报道称一名技术人员在安装机器人的过程中，处于静止状态的机器人突然“抓住”其胸部并将其“压在”铁板上，最终导致技术人员死亡。溯本求源，该消息最初来自原英国《金融时报》网络版的一则报道。该报道原文使用了“struck”（撞击）一词，并将该事件解释为工业事故。但是此后的报道用“catch”（抓住）替代了“struck”（撞击），将其描述为因技术故障而导致的“杀人案”。

    耸人听闻的故事不过是主观臆想、夸大其词和以讹传讹的结果，并非事实真相。事后辟谣发现，轩然大波不过是无风起浪。艾伦·温菲尔德（Alan Winfield）教授称：“很遗憾，大家夸大了机器人的能力，而且过分惧怕机器人。科幻电影和媒体报道让大家变得过分敏感。”^([\[113\]](#txt005.html#footnote_content_txt005_113))机器人自主决策、自己负责的基础尚不具备。外观上独立的自主行为仍然是程序设计的结果，机器人并没有独立意识，更不会恶意攻击人类。人类在编程或操作中出现的错误被转嫁给了机器人，机器人成为人类的替罪羊。

    即便智能机器人作为独立民事责任主体的条件尚不成熟，也有必要对由人工智能造成的人身或财产损失的责任主体重新进行思考。如何将行业标准与事故责任分配机制相结合、人工智能设计者与所有者和使用者之间的关系等问题的解决方案直接关系到人工智能行业的未来发展。“联合国教科文组织与世界科学知识与技术伦理委员会在
    2016 年的报告中……在对机器人的操作失灵造成事故，形成责任承担问题时，报告甚至提出，可以让智能机器人承担责任，因为智能机器人确实拥有前所未有的自主性，并且拥有能够独立作出决策的能力。”^([\[114\]](#txt005.html#footnote_content_txt005_114))

    在人工智能技术研发与应用的前景无法准确预见的情况下，法律对民事责任主体规则的设计需要兼顾现实与未来。一方面，根据目前人工智能技术研发和应用的情况，侧重将人类而非智能机器（人）作为责任主体进行规则设计，考虑智能机器（人）决策和行为的自主性，在主客体二元划分的框架下探索特别规则；另一方面，考虑到人工智能技术研发和应用的未来发展，为有条件地赋予智能机器（人）法律主体地位预留空间。


    ## 第二节 人工智能时代民事法律责任的形态

    人工智能产品是具有一定自主性的智能机器。智能与机器的组成方式使得人工智能产品兼具人的属性和物的属性。有学者将民事法律责任分为侧重人之属性的责任和侧重物之属性的责任两种形态。“代理人责任、法人责任、替代责任偏向于人工智能的‘人’之属性，或类比于自然人，或类比于法律拟制之人；产品责任和动物致人损害责任偏向于‘物’之属性。”^([\[115\]](#txt005.html#footnote_content_txt005_115))


    ### 一、侧重物之属性的责任形态：客体定位下的解释论视角

    “现有技术下不应过分强调人工智能‘人’之属性。”^([\[116\]](#txt005.html#footnote_content_txt005_116))目前，人工智能的综合智力水平仍无法与一般自然人相比，相应的法律责任需要由人而非智能机器（人）承担。“在机器人责任的调整上，无论是普通民事责任，还是高度危险来源致人损害责任以及产品责任，主要是以人类作为归责的伦理主体和法律主体，而非以机器人作为责任主体。”^([\[117\]](#txt005.html#footnote_content_txt005_117))


    #### （一）高度危险来源占有人责任

    机器智能化使得即便将智能机器（人）作为客体对待，也有别于一般的财产，机器智能潜伏着高度危险。占有智能机器（人）的主体由于占有高度危险来源的财产需要承担责任。《格里申法案》第
    127 条第 2 款规定智能机器（人）的占有人需要依据《俄罗斯联邦民法典》第 1079 条关于高度危险来源致人损害的规定承担民事法律责任。

    “对于占有人的确定，法案专门规定了‘机器人—代理人的占有人’条文，‘机器人—代理人的占有人应当理解为以所有权、经营权、业务管理权、租赁权或者其他合法依据使用机器人—代理人的法人、自然人或其他机器人—代理人’（第
    127.3 条第 1 款）。”^([\[118\]](#txt005.html#footnote_content_txt005_118))由此可见，占有人是指基于合法权源对智能机器（人）进行占有的主体，包括自然人、法人以及其他智能机器（人）。对这一做法存在两点疑问：第一，占有是一种事实，而非权利状态，分为合法占有与非法占有。高度危险来源占有人基于占有而承担的占有人责任是一种侵权责任。占有人基于合法权源占有或是非基于合法权源占有并不影响占有事实本身，规定基于合法权源占有智能机器（人）的占有人承担民事责任，而将非基于合法权源占有智能机器（人）的占有人排除在占有人之外，在法律价值判断上缺乏正当理由。第二，智能机器（人）存在作为其他智能机器（人）的占有人进而作为责任主体的可能。这就使得在同一法律关系中智能机器（人）同时拥有主体和客体的双重身份。在缺乏通过类型划分将智能机器（人）严格区分为主体类智能机器（人）和客体类智能机器（人）的情况下，智能机器（人）承担高度危险来源占有人责任会使得理论认知和规则适用陷入困境。


    #### （二）产品责任：以《民法典》第 1203 条为中心

    产品责任是指因产品缺陷导致他人人身或财产受损害而由产品制造商、销售商或供应商承担的责任。我国《民法典》设专章对“产品责任”进行了规定^([\[119\]](#txt005.html#footnote_content_txt005_119))，《中华人民共和国产品质量法》（以下简称《产品质量法》）对“产品质量责任”进行了系统规定，而《中华人民共和国消费者权益保护法》第
    7 章“法律责任”从消费者权益保护的角度对产品责任进行了规定。我国形成了以产品缺陷为核心概念的产品责任法律体系。生产者承担产品责任的前提是消费者“原告必须证明产品有缺陷，这一缺陷是造成原告损害的近因（proximate
    cause），并且这一缺陷在产品制造者控制产品时已产生”^([\[120\]](#txt005.html#footnote_content_txt005_120))。这一证明是比较困难的。“由于人工智能系统自身的黑箱性质和不可解释性，也很难证明缺陷的存在。”^([\[121\]](#txt005.html#footnote_content_txt005_121))在已经发生的智能驾驶事故中，相当一部分可能是智能驾驶系统存在缺陷导致的，但是该推论因缺乏证据未能得到法院支持。

    “产品责任法上的产品通常限于生产出来的有形的物质商品，对于软件（计算机程序）等无形产品，我国尚无明确规定是否可以适用产品责任。”^([\[122\]](#txt005.html#footnote_content_txt005_122))智能程序软件存在缺陷导致损害能否适用产品责任规则存在疑问。^([\[123\]](#txt005.html#footnote_content_txt005_123))人工智能机器或设备导致的损害是否属于产品责任调整的范围取决于对智能机器（人）的定位。联合国教科文组织与世界科学知识与技术伦理委员会于
    2016 年发布的报告认为：智能机器（人）是制造者生产的科技产品，其导致的损害可以归责于制造者、销售者等主体，能够通过民法中的产品责任规则予以调整。^([\[124\]](#txt005.html#footnote_content_txt005_124))


    ##### 1. 逻辑前提：智能机器（人）作为产品的法律定位

    ###### （1）智能机器（人）的产品属性

    在弱人工智能时代，主体与客体二元划分的框架尚未受到毁灭性冲击，智能机器（人）作为程序设计和制造的产物，基本定位是动产，具有产品属性。从目前智能技术研发和应用的情况看，它并非主体性的存在而是工具性的存在。“我们在法律中只要将人工智能定义为‘对人工智能进行模拟的工具’，那么其就不会对现有法律体系中的法律主体产生任何影响。”^([\[125\]](#txt005.html#footnote_content_txt005_125))弱人工智能时代智能机器（人）与人类制造的其他产品之间共性多于个性，需要通过“产品责任”规则体系分配相关损失。

    不可否认，语言对社会生活具有一定的形塑作用，通过对人工智能进行概念界定的方式缓和法律体系的内在矛盾冲突具有一定的作用。但是，从法律与社会生活的关系角度观察，从来都是法律概念适应现实生活，而非相反。在法律上将人工智能界定为一种工具，并不能一劳永逸地将智能机器（人）限定在工具的范畴内，其属性取决于智能技术的研发与应用。


    ###### （2）人工智能产品的特殊性

    智能机器（人）毕竟不同于传统的产品，其自主学习和行为的能力决定关于产品的现行法律规定不能或不能妥当地完全解决问题。将智能机器（人）纳入产品的范畴，试图在与产品相关的法律体系中解决人工智能时代产生的新问题未免过于乐观。“现有产品责任法中关于产品的概念，并没有预设针对智能活动产品的内容。”^([\[126\]](#txt005.html#footnote_content_txt005_126))现有的产品责任法律规范体系在人工智能时代显得捉襟见肘，尤其“面对自主智能机器人，人们将需要开始审视既有的产品责任制度能否在制造商利益和消费者利益之间实现平衡”^([\[127\]](#txt005.html#footnote_content_txt005_127))。


    ##### 2. 人工智能时代关于产品缺陷责任的反思


    '
  toc: []
- raw: '产品责任是以“产品缺陷”概念为中心构建的责任体系。^([\[128\]](#txt005.html#footnote_content_txt005_128))因产品缺陷造成损害，受害人有权向产品的生产者或销售者请求赔偿。生产者与销售者承担不真正连带责任。承担责任的主体有权向有过错的另一方进行追偿。“人工智能机器人既然是产品，如果其存在缺陷（不论是设计缺陷、制造缺陷、警示说明缺陷还是跟踪观察缺陷），造成他人损害的，都应当由制造者、销售者，充其量再增加设计者，来承担责任。”^([\[129\]](#txt005.html#footnote_content_txt005_129))


    我国《产品质量法》第46 条从“不合理的危险”和“保障健康与安全标准”正反两方面界定了产品缺陷的概念。^([\[130\]](#txt005.html#footnote_content_txt005_130))根据该规定，构成产品缺陷需要满足以下条件：第一，产品危及人身、他人财产安全；第二，危及人身、他人财产安全的危险是不合理的；第三，产品不符合国家标准、行业标准。“我国产品责任制度对于产品缺陷采取了双重判定标准，即在界定其内涵为具有不合理危险之基础上，以消费者合理期待为一般标准，同时以国家和行业针对某些产品所制定的旨在保障人体健康和人身财产安全的强制性技术标准为法定标准。在判定产品缺陷时，有法定标准的适用法定标准，无法定标准时则适用一般标准。”^([\[131\]](#txt005.html#footnote_content_txt005_131))


    （1）人工智能时代产品缺陷的类型


    产品缺陷主要包括三种具体类型：“警示缺陷、制造缺陷和设计缺陷。”^([\[132\]](#txt005.html#footnote_content_txt005_132))警示缺陷又称指示缺陷或信息披露缺陷，是指负有警示义务的主体对产品危及人身和财产安全的风险未进行信息披露。警示能够让消费者了解产品存在的潜在风险，进而评估是否购买以及如何使用相关产品。人工智能时代负有警示义务的主体需要将智能机器（人）可能存在的风险或潜在风险告知消费者。例如，智能汽车在其无法识别的位置可能发生故障并导致损失。


    制造缺陷是指产品在加工、制作、装配过程中产生的危及人身、财产安全的不合理风险。“近年来，美国某些法院开始使用‘偏离设计意图’（depar⁃ture from
    intended design test）和‘故障学说’（malfunction doctrine）这两种方式来帮助判定产品制造商是否需要承担责任。”^([\[133\]](#txt005.html#footnote_content_txt005_133))“偏离设计意图”是指制造商在制造智能机器的过程中偏离设计者的意图，即制造缺陷产生的原因是在制造产品的过程中背离了既定的设计方案或技术指标。“‘故障学说’包含三个基本要素：一是产品故障，二是故障在常规和恰当使用产品时产生，三是产品未被改变或误用以导致故障。”^([\[134\]](#txt005.html#footnote_content_txt005_134))考虑到制造商与消费者在专业技能、人力物力上的显著差异，就制造缺陷的认定需要采用举证责任倒置的方式。例如，智能汽车的消费者或其他受害人能够证明智能汽车未按照说明书的描述运行，就能向制造商索赔。


    人工智能时代智能制造工艺和技术的不断进步，降低了制造缺陷的发生率，使得受害人通过制造缺陷诉讼获得救济的可能性降低，受害人寻求法律救济的途径从制造缺陷转向设计缺陷。设计缺陷是指因设计者在产品设计中存在疏漏进而导致产品存在危及人身、财产安全的不合理风险。在一定时期，人工智能技术进步与设计缺陷在整个产品缺陷类型中的比重呈正相关关系，即随着人工智能技术不断进步，设计缺陷在产品缺陷类型中所占的比重增加。人工智能设计缺陷产生的原因有多种，如模型训练中的瑕疵数据、漏洞代码、不合理或非最优算法。因设计缺陷导致的损害赔偿救济往往具有群体性特征。设计缺陷存在于一类而非单个智能产品上，一旦因设计缺陷引发索赔，一类产品都面临这一问题，这就使产品责任的承担主体如制造商、销售商需要承担大规模的责任。


    （2）产品缺陷的判断标准


    第一，不合理危险标准。我国《产品质量法》第46 条采用“不合理的危险”标准判断产品责任。人工智能时代判断“不合理的风险”的理性人标准遭遇挑战。“金无足赤，人无完人”，现实生活中的人存在认识上的局限性。法律规则的设计需要考虑人在认识上的不足，否则会导致法律规则过于严苛或宽松而难以合理调整社会生活。选择何种类型的人作为法律规则设计的人像基础关系到法律规则的宽严程度。理性人标准是法律规则设计中经常采用的人像预设，它以社会生活中普通大众为考察对象，剔除了处于两端的“超强者”和“极弱者”，同时涤除了人的情绪化因素。


    “Arnold v.Reuther”一案中，Arnold 主张Reuther 有“最后的机会”（last clear chance）避免损害发生。法官基于人与机器的区别以及人的弱点，反驳了这一观点。“必须为人类的弱点和反应留出一定的余地，而如果这样的余地必须要求人类在零点几秒内作出反应，并且不能像现代机械装置那样，以机械的速度和精度作出反应，那么就必须承认，Reuther
    作为一个普通人，再怎么做也不能避免因Arnold 的过失而给她本人招来的不幸。”^([\[135\]](#txt005.html#footnote_content_txt005_135))法律义务与责任关注的对象从人类转向人工智能，相应地，判断行为理性和主体义务的标准也发生变化。例如，在自动驾驶领域，驾驶员由人类转变为人工智能驾驶系统后，判断人类驾驶员注意义务的标准难以适用于智能驾驶的场景，行为合理性的标准由理性人标准转向产品质量标准。


    第二，消费者合理期待标准。消费者合理期待标准以消费者对智能产品的合理预期为基础判断产品是否存在缺陷。“在欧盟法中，产品缺陷是指考虑到所有情况，产品没有提供人们所期待的安全性。这类似于消费者的合理期待标准。”^([\[136\]](#txt005.html#footnote_content_txt005_136))消费者合理期待标准是抽象的法学构造，有赖于法律共同体对消费者认知水平达成共识。


    消费者期待效用以普通消费者的认知为参照系，倘若产品设计中的风险不是普通消费者在合理预期范围内可以预见的，则该产品风险属于不合理的风险。在产品设计的原理和结构相对简单的情况下，普通消费者具备认知产品风险的能力，以普通消费者合理预期为标准进行判断具有合理性。但是，在人工智能时代苛求普通消费者对智能产品足够熟悉并能产生合理预期不太可能。人工智能技术的专业门槛使得绝大多数普通消费者对人工智能产品的安全性难以产生合理预期，基本排除了通过消费者期待测试判断人工智能产品是否存在设计缺陷的可能性。换言之，合理期待标准与消费者对产品的认知程度密切相关，倘若消费者对产品缺乏明确认知则很难产生合理预期。智能技术的研发与应用并不为普通消费者所熟知，通常超出了其认知范围，难以形成合理预期。此外，当受害人为第三人时消费者期待测试更难以适用。因为受害人并非智能汽车的消费者，不存在对智能汽车产品的合理预期。“《美国侵权法第三次重述：产品责任》已经不再将其作为一项独立的判断标准，而是仅作为风险—收益分析的一个因素。”^([\[137\]](#txt005.html#footnote_content_txt005_137))


    智能产品与被替代的非智能产品具有同等甚至更高的效用和安全度是消费者对智能产品的合理预期。例如，智能驾驶系统替代人类驾驶员的前提是，智能驾驶在安全性方面与人类驾驶相同甚至要求更高。“美国国家高速公路交通安全管理局在给予汽车制造商免于遵守美国联邦机动车安全标准（FMVSS）的豁免时，也要求所引入的新技术至少与现有技术一样安全，甚至要求更为安全。”^([\[138\]](#txt005.html#footnote_content_txt005_138))


    第三，风险效用标准。美国侵权法判断产品责任的主导标准经历了从“不合理的危险”向“风险—收益分析”的转变。《美国侵权法第二次重述》第402 条a 款将“不合理的危险”确定为判断产品责任的主导标准；而《美国侵权法第三次重述》则将“风险—收益分析”确定为判断产品责任的主导标准。“与消费者期待标准有所区别地是，风险—效用标准综合考虑了各种因素，较好地平衡了生产者和消费者的利益，并作出较为妥当的价值判断。”^([\[139\]](#txt005.html#footnote_content_txt005_139))风险效用测试是基于对成本和收益进行比较进而确定产品是否存在缺陷的测试方法，即比较替代方案所增加的成本与可能避免的潜在损失。约翰·韦德在“产品严格侵权责任的本质”（On
    the Nature of Strict Tort Liability for Prod⁃ucts）一文中分析了运用风险效用测试智能驾驶的三个因素：第一，存在替代产品；第二，产品的用途和可取性；第三，驾驶员的避险能力。^([\[140\]](#txt005.html#footnote_content_txt005_140))


    风险效用测试中的“成本—收益分析”需要区分整体分析与个案分析，整体分析具有统计学上的意义，个案分析关注对受害人的救济。替代设计与被替代设计之间的比较，分为全部比较与部分比较。人工智能产品是否存在设计缺陷并不一定需要进行全系统的整体比较，通常就导致事故发生的关键部分进行比较即可。基于算法在人工智能产品中的重要性，在一定的情形下，倘若能够证明替代算法能够阻止损害发生，且该替代算法的成本合理并非畸高，就足以证明人工智能产品存在设计缺陷。


    3.算法设计者的责任


    算法设计者是否需要对智能机器（人）造成的损害承担法律责任？有学者认为，人工智能程序算法的设计者是风险制造的源头，需要对智能机器（人）造成的损害承担赔偿责任，进而将人工智能程序算法的设计者作为新型民事责任主体。“人工智能机器人造成他人损害时，不能简单地认定由该机器人的生产者承担责任，而应当由该程序的发明者承担责任。”^([\[141\]](#txt005.html#footnote_content_txt005_141))这一观点值得商榷。首先，法律判断以事实判断为基础，但是法律判断并不等同于事实判断。人工智能程序设计者导致损害发生，就该损害承担责任的主体可以但不必然是程序设计者。法律责任的配置需要考虑社会政策、社会功能、可行性等诸多因素。其次，类比一般产品责任，人工智能程序算法的设计者不应对消费者直接承担损害赔偿责任。一般产品同样存在设计瑕疵的问题，但是该责任由制造者而非产品设计者承担。将人工智能程序算法的设计者作为产品责任的主体混淆了内部法律关系和外部法律关系。再次，人工智能程序算法的设计者虽然是风险产生的源头，但是一旦其完成研发过程便不再是有效的风险控制者。算法设计者可能对人工智能程序的具体应用一无所知或是缺乏对程序应用领域和范围的控制权，由其承担法律责任难谓公平。最后，人工智能系统的算法设计可能是由数人或组织在分散的状态下各自完成的，确定分散的参与人对损害发生的原因力有无或大小耗时耗力而且未必能够成功。


    算法设计者的责任与传统产品责任中“原材料、零部件和半成品的生产者”的责任类似。“最终生产者对产品的质量有最终的和最重要的控制力。至于有证据证明最终产品的特定原材料、零部件或半成品的缺陷造成了损害，最终生产者在承担了侵权责任之后，可依其与原材料、零部件或者半成品生产者之间的合同向后者追偿。”^([\[142\]](#txt005.html#footnote_content_txt005_142))生产者而非算法设计者是人工智能产品应用的最终主体，采取由其承担产品责任后，依据合同约定或法律规定向算法设计者追偿的方式更为可取。


    4.制造缺陷与算法缺陷之间的关系


    关于制造缺陷与算法缺陷的关系的理论存在区分说和吸收说。区分说认为，制造缺陷应当归咎于智能设备的生产者，而算法缺陷应当归咎于智能系统的设计者，二者相互区别，各自独立。吸收说认为，算法缺陷属于制造缺陷的一种类型，算法缺陷产生的损害结果被制造缺陷吸收，由生产者作为责任承担的主体。生产者在对外承担责任后，有权依据与算法设计者之间的协议向其追偿。


    厘清算法缺陷与制造缺陷之间的关系，首先需要区分算法设计者故意设计缺陷算法导致损害与算法设计者非因故意设计缺陷算法导致损害两种类型。算法设计者故意设计缺陷算法并导致损害的，算法设计者需要承担侵权责任，但是其承担的并非产品责任，而是基于过错的一般侵权责任。制造商知悉算法设计者故意设计缺陷算法的，对造成的损失承担产品责任；制造商对算法设计者故意设计缺陷算法不知情的，依据产品责任的构成要件判断其是否需要承担责任。“生产者责任仅限于传统的产品缺陷和因超级算法不可预测性而导致的损害，应当排除可归责于其他主体的原因力。”^([\[143\]](#txt005.html#footnote_content_txt005_143))


    （三）类推适用动物管理人责任


    智能机器（人）的智能属性使其区别于没有感知、思维或意识的无生命物体。在这一意义上，智能机器（人）更类似于动物，因而，有学者类比动物致害的责任承担来确定智能机器（人）的致害责任。智能机器（人）致害，由其管理人承担责任。受害人或第三人有过错的，减轻或免除智能机器（人）管理人的责任。“人工智能与其管理人的关系类似于动物之于其主人，但两者最大的区别在于人工智能比动物具有更强的自主性。”^([\[144\]](#txt005.html#footnote_content_txt005_144))


    （四）责任竞合


    责任竞合是指损害事实符合多种法律责任构成要件的要求，导致多种法律责任规范同时适用的情形。责任竞合时，权利人同时享有数个独立的请求权。当出现具有工具属性的智能机器（人）导致人身或财产损害的情形，一方面可以基于产品缺陷追究生产者的产品责任，另一方面可以基于管理人的过错追究其侵权责任。有学者认为此时发生产品责任和管理人责任的竞合。^([\[145\]](#txt005.html#footnote_content_txt005_145))“自动驾驶汽车致害时，可能发生责任竞合问题，即产品责任（《民法典》第1203
    条）与机动车交通事故责任（《道交法》第76 条）的竞合。”^([\[146\]](#txt005.html#footnote_content_txt005_146))持反对观点的学者认为，产品责任和管理人责任之间不存在竞合，人工智能工作物致人损害责任与产品责任“不是两种法律责任并存，而是人工智能工作物致人损害民事责任中的一部分是产品责任。因为两者存在部分重叠关系，故无法发生竞合”^([\[147\]](#txt005.html#footnote_content_txt005_147))。


    责任竞合说试图解决损害原因难以查明的难题，进而扩展受害人的救济方式。但是，需要明确该学说适用的范围。产品责任与管理人责任竞合是智能机器（人）致人损害责任承担的例外。责任竞合的现象的确偶然存在，但是在规则设计的层面并无考虑的必要。由生产者和管理人分别基于产品缺陷和过错承担法律责任的框架更适应现实生活的需要。首先，产品责任与管理人责任适用的情形不同，并非基于相同事实适用不同法律规范进而产生数个救济途径的问题。产品责任产生的事实基础是产品存在缺陷；而管理人责任产生的事实基础是管理人存在过错。只有在同时存在产品缺陷和管理人过错事实的情形时才会出现责任竞合，后者并非常态。其次，责任竞合说目的是扩展受害人的救济途径，但是在实践中不能实现。无论责任竞合的后果是由受害人择一行使请求权抑或其他，责任主体都能够以责任构成要件不具备进行抗辩，结果是受害人需要举证证明产品存在缺陷以及管理人存在过错。受害人的举证义务并未因责任竞合的设计而减轻。考虑责任竞合进行归责设计，徒增立法成本并无实际意义。


    二、侧重人之属性的责任形态：主体定位下的立法论视角


    （一）智能机器（人）自负责任


    自负责任说主张，智能机器（人）行为的自主性使其应当对自身造成的损害承担法律责任。该说是建立在智能机器（人）能够作为独立的民事责任主体基础上的。有学者认为，由智能机器（人）独立承担损害赔偿责任虽然奇怪，却是合法且最佳的选择。^([\[148\]](#txt005.html#footnote_content_txt005_148))对此，有学者提出反对意见，认为这一观点混淆了技术上的自主性与主体意义上的自主性。“论者所主张的‘由自动驾驶汽车自负责任，为其设立责任基金并实行强制保险制度’的观点，只是限制了本来应该由制造商、设计者、销售商或者其他利益相关方承担的责任并将其在全社会范围内予以分散，而这种责任限制和责任分散的主要理由，就是将技术意义上的‘自主性’错误地理解为主体意义上的自主性。”^([\[149\]](#txt005.html#footnote_content_txt005_149))


    （二）替代责任


    替代责任是指某一类主体基于法定或约定的理由代替另一类主体承担法律责任，进而出现行为主体与责任主体分离的现象。替代责任存在的前提是法律主体多元化，如雇主与雇员、父母与未成年子女。行为主体与责任主体同一的情况下不存在替代责任。只有将智能机器（人）视为行为主体，才会出现替代责任。“如果智能机器人实际上‘代理或者代表’某个法律主体从事行为或者进行决策，那么可以比照父母对未成年人子女的责任或者说监护人对被监护人的责任，或者雇主对雇员的责任，让部署智能机器人的人承担替代责任。”^([\[150\]](#txt005.html#footnote_content_txt005_150))


    1.代理人责任


    “代理说的观点是，人工智能的所有行为均为人类所控制，其实施的行为与引起的后果最终必须由被代理人承担。”^([\[151\]](#txt005.html#footnote_content_txt005_151))在代理说的框架下，智能机器（人）与智能机器（人）的所有人、使用人或占有人之间是代理与被代理的关系。将智能机器（人）作为“人”看待是在代理关系的框架内理解智能机器（人）致害的民事责任承担的逻辑前提。智能机器（人）与管理者都属于主体的范畴，智能机器（人）是代理人而管理者是被代理人。智能机器（人）实施的行为反映了管理者的意志，责任由管理者承担。《欧盟机器人民事法律规则》第52
    条使用了“非人类代理人”的概念，在一定程度上承认了智能机器（人）具有法律人格。在思瑞夫蒂电话公司诉贝森尼克案（Thrifty-Tel，Inc.v.Bezenek）中，法院认定思瑞夫蒂电话公司的智能系统为该公司的代理人或扮演类似代理人的角色，将智能系统的信赖归诸本人。^([\[152\]](#txt005.html#footnote_content_txt005_152))'
  fmt: '

    ## 一、侧重物之属性的责任形态：产品责任视角


    产品责任是以“产品缺陷”概念为中心构建的责任体系。^([\[128\]](#txt005.html#footnote_content_txt005_128))因产品缺陷造成损害，受害人有权向产品的生产者或销售者请求赔偿。生产者与销售者承担不真正连带责任。承担责任的主体有权向有过错的另一方进行追偿。“人工智能机器人既然是产品，如果其存在缺陷（不论是设计缺陷、制造缺陷、警示说明缺陷还是跟踪观察缺陷），造成他人损害的，都应当由制造者、销售者，充其量再增加设计者，来承担责任。”^([\[129\]](#txt005.html#footnote_content_txt005_129))


    我国《产品质量法》第46 条从“不合理的危险”和“保障健康与安全标准”正反两方面界定了产品缺陷的概念。^([\[130\]](#txt005.html#footnote_content_txt005_130))根据该规定，构成产品缺陷需要满足以下条件：第一，产品危及人身、他人财产安全；第二，危及人身、他人财产安全的危险是不合理的；第三，产品不符合国家标准、行业标准。“我国产品责任制度对于产品缺陷采取了双重判定标准，即在界定其内涵为具有不合理危险之基础上，以消费者合理期待为一般标准，同时以国家和行业针对某些产品所制定的旨在保障人体健康和人身财产安全的强制性技术标准为法定标准。在判定产品缺陷时，有法定标准的适用法定标准，无法定标准时则适用一般标准。”^([\[131\]](#txt005.html#footnote_content_txt005_131))


    ### （1）人工智能时代产品缺陷的类型


    产品缺陷主要包括三种具体类型：“警示缺陷、制造缺陷和设计缺陷。”^([\[132\]](#txt005.html#footnote_content_txt005_132))警示缺陷又称指示缺陷或信息披露缺陷，是指负有警示义务的主体对产品危及人身和财产安全的风险未进行信息披露。警示能够让消费者了解产品存在的潜在风险，进而评估是否购买以及如何使用相关产品。人工智能时代负有警示义务的主体需要将智能机器（人）可能存在的风险或潜在风险告知消费者。例如，智能汽车在其无法识别的位置可能发生故障并导致损失。


    制造缺陷是指产品在加工、制作、装配过程中产生的危及人身、财产安全的不合理风险。“近年来，美国某些法院开始使用‘偏离设计意图’（depar⁃ture from
    intended design test）和‘故障学说’（malfunction doctrine）这两种方式来帮助判定产品制造商是否需要承担责任。”^([\[133\]](#txt005.html#footnote_content_txt005_133))“偏离设计意图”是指制造商在制造智能机器的过程中偏离设计者的意图，即制造缺陷产生的原因是在制造产品的过程中背离了既定的设计方案或技术指标。“‘故障学说’包含三个基本要素：一是产品故障，二是故障在常规和恰当使用产品时产生，三是产品未被改变或误用以导致故障。”^([\[134\]](#txt005.html#footnote_content_txt005_134))考虑到制造商与消费者在专业技能、人力物力上的显著差异，就制造缺陷的认定需要采用举证责任倒置的方式。例如，智能汽车的消费者或其他受害人能够证明智能汽车未按照说明书的描述运行，就能向制造商索赔。


    人工智能时代智能制造工艺和技术的不断进步，降低了制造缺陷的发生率，使得受害人通过制造缺陷诉讼获得救济的可能性降低，受害人寻求法律救济的途径从制造缺陷转向设计缺陷。设计缺陷是指因设计者在产品设计中存在疏漏进而导致产品存在危及人身、财产安全的不合理风险。在一定时期，人工智能技术进步与设计缺陷在整个产品缺陷类型中的比重呈正相关关系，即随着人工智能技术不断进步，设计缺陷在产品缺陷类型中所占的比重增加。人工智能设计缺陷产生的原因有多种，如模型训练中的瑕疵数据、漏洞代码、不合理或非最优算法。因设计缺陷导致的损害赔偿救济往往具有群体性特征。设计缺陷存在于一类而非单个智能产品上，一旦因设计缺陷引发索赔，一类产品都面临这一问题，这就使产品责任的承担主体如制造商、销售商需要承担大规模的责任。


    ### （2）产品缺陷的判断标准


    #### 第一，不合理危险标准


    我国《产品质量法》第46 条采用“不合理的危险”标准判断产品责任。人工智能时代判断“不合理的风险”的理性人标准遭遇挑战。“金无足赤，人无完人”，现实生活中的人存在认识上的局限性。法律规则的设计需要考虑人在认识上的不足，否则会导致法律规则过于严苛或宽松而难以合理调整社会生活。选择何种类型的人作为法律规则设计的人像基础关系到法律规则的宽严程度。理性人标准是法律规则设计中经常采用的人像预设，它以社会生活中普通大众为考察对象，剔除了处于两端的“超强者”和“极弱者”，同时涤除了人的情绪化因素。


    “Arnold v.Reuther”一案中，Arnold 主张Reuther 有“最后的机会”（last clear chance）避免损害发生。法官基于人与机器的区别以及人的弱点，反驳了这一观点。“必须为人类的弱点和反应留出一定的余地，而如果这样的余地必须要求人类在零点几秒内作出反应，并且不能像现代机械装置那样，以机械的速度和精度作出反应，那么就必须承认，Reuther
    作为一个普通人，再怎么做也不能避免因Arnold 的过失而给她本人招来的不幸。”^([\[135\]](#txt005.html#footnote_content_txt005_135))法律义务与责任关注的对象从人类转向人工智能，相应地，判断行为理性和主体义务的标准也发生变化。例如，在自动驾驶领域，驾驶员由人类转变为人工智能驾驶系统后，判断人类驾驶员注意义务的标准难以适用于智能驾驶的场景，行为合理性的标准由理性人标准转向产品质量标准。


    #### 第二，消费者合理期待标准


    消费者合理期待标准以消费者对智能产品的合理预期为基础判断产品是否存在缺陷。“在欧盟法中，产品缺陷是指考虑到所有情况，产品没有提供人们所期待的安全性。这类似于消费者的合理期待标准。”^([\[136\]](#txt005.html#footnote_content_txt005_136))消费者合理期待标准是抽象的法学构造，有赖于法律共同体对消费者认知水平达成共识。


    消费者期待效用以普通消费者的认知为参照系，倘若产品设计中的风险不是普通消费者在合理预期范围内可以预见的，则该产品风险属于不合理的风险。在产品设计的原理和结构相对简单的情况下，普通消费者具备认知产品风险的能力，以普通消费者合理预期为标准进行判断具有合理性。但是，在人工智能时代苛求普通消费者对智能产品足够熟悉并能产生合理预期不太可能。人工智能技术的专业门槛使得绝大多数普通消费者对人工智能产品的安全性难以产生合理预期，基本排除了通过消费者期待测试判断人工智能产品是否存在设计缺陷的可能性。换言之，合理期待标准与消费者对产品的认知程度密切相关，倘若消费者对产品缺乏明确认知则很难产生合理预期。智能技术的研发与应用并不为普通消费者所熟知，通常超出了其认知范围，难以形成合理预期。此外，当受害人为第三人时消费者期待测试更难以适用。因为受害人并非智能汽车的消费者，不存在对智能汽车产品的合理预期。“《美国侵权法第三次重述：产品责任》已经不再将其作为一项独立的判断标准，而是仅作为风险—收益分析的一个因素。”^([\[137\]](#txt005.html#footnote_content_txt005_137))


    智能产品与被替代的非智能产品具有同等甚至更高的效用和安全度是消费者对智能产品的合理预期。例如，智能驾驶系统替代人类驾驶员的前提是，智能驾驶在安全性方面与人类驾驶相同甚至要求更高。“美国国家高速公路交通安全管理局在给予汽车制造商免于遵守美国联邦机动车安全标准（FMVSS）的豁免时，也要求所引入的新技术至少与现有技术一样安全，甚至要求更为安全。”^([\[138\]](#txt005.html#footnote_content_txt005_138))


    #### 第三，风险效用标准


    美国侵权法判断产品责任的主导标准经历了从“不合理的危险”向“风险—收益分析”的转变。《美国侵权法第二次重述》第402 条a 款将“不合理的危险”确定为判断产品责任的主导标准；而《美国侵权法第三次重述》则将“风险—收益分析”确定为判断产品责任的主导标准。“与消费者期待标准有所区别地是，风险—效用标准综合考虑了各种因素，较好地平衡了生产者和消费者的利益，并作出较为妥当的价值判断。”^([\[139\]](#txt005.html#footnote_content_txt005_139))风险效用测试是基于对成本和收益进行比较进而确定产品是否存在缺陷的测试方法，即比较替代方案所增加的成本与可能避免的潜在损失。约翰·韦德在“产品严格侵权责任的本质”（On
    the Nature of Strict Tort Liability for Prod⁃ucts）一文中分析了运用风险效用测试智能驾驶的三个因素：第一，存在替代产品；第二，产品的用途和可取性；第三，驾驶员的避险能力。^([\[140\]](#txt005.html#footnote_content_txt005_140))


    风险效用测试中的“成本—收益分析”需要区分整体分析与个案分析，整体分析具有统计学上的意义，个案分析关注对受害人的救济。替代设计与被替代设计之间的比较，分为全部比较与部分比较。人工智能产品是否存在设计缺陷并不一定需要进行全系统的整体比较，通常就导致事故发生的关键部分进行比较即可。基于算法在人工智能产品中的重要性，在一定的情形下，倘若能够证明替代算法能够阻止损害发生，且该替代算法的成本合理并非畸高，就足以证明人工智能产品存在设计缺陷。


    ### 3. 算法设计者的责任


    算法设计者是否需要对智能机器（人）造成的损害承担法律责任？有学者认为，人工智能程序算法的设计者是风险制造的源头，需要对智能机器（人）造成的损害承担赔偿责任，进而将人工智能程序算法的设计者作为新型民事责任主体。“人工智能机器人造成他人损害时，不能简单地认定由该机器人的生产者承担责任，而应当由该程序的发明者承担责任。”^([\[141\]](#txt005.html#footnote_content_txt005_141))这一观点值得商榷。首先，法律判断以事实判断为基础，但是法律判断并不等同于事实判断。人工智能程序设计者导致损害发生，就该损害承担责任的主体可以但不必然是程序设计者。法律责任的配置需要考虑社会政策、社会功能、可行性等诸多因素。其次，类比一般产品责任，人工智能程序算法的设计者不应对消费者直接承担损害赔偿责任。一般产品同样存在设计瑕疵的问题，但是该责任由制造者而非产品设计者承担。将人工智能程序算法的设计者作为产品责任的主体混淆了内部法律关系和外部法律关系。再次，人工智能程序算法的设计者虽然是风险产生的源头，但是一旦其完成研发过程便不再是有效的风险控制者。算法设计者可能对人工智能程序的具体应用一无所知或是缺乏对程序应用领域和范围的控制权，由其承担法律责任难谓公平。最后，人工智能系统的算法设计可能是由数人或组织在分散的状态下各自完成的，确定分散的参与人对损害发生的原因力有无或大小耗时耗力而且未必能够成功。


    算法设计者的责任与传统产品责任中“原材料、零部件和半成品的生产者”的责任类似。“最终生产者对产品的质量有最终的和最重要的控制力。至于有证据证明最终产品的特定原材料、零部件或半成品的缺陷造成了损害，最终生产者在承担了侵权责任之后，可依其与原材料、零部件或者半成品生产者之间的合同向后者追偿。”^([\[142\]](#txt005.html#footnote_content_txt005_142))生产者而非算法设计者是人工智能产品应用的最终主体，采取由其承担产品责任后，依据合同约定或法律规定向算法设计者追偿的方式更为可取。


    ### 4. 制造缺陷与算法缺陷之间的关系


    关于制造缺陷与算法缺陷的关系的理论存在区分说和吸收说。区分说认为，制造缺陷应当归咎于智能设备的生产者，而算法缺陷应当归咎于智能系统的设计者，二者相互区别，各自独立。吸收说认为，算法缺陷属于制造缺陷的一种类型，算法缺陷产生的损害结果被制造缺陷吸收，由生产者作为责任承担的主体。生产者在对外承担责任后，有权依据与算法设计者之间的协议向其追偿。


    厘清算法缺陷与制造缺陷之间的关系，首先需要区分算法设计者故意设计缺陷算法导致损害与算法设计者非因故意设计缺陷算法导致损害两种类型。算法设计者故意设计缺陷算法并导致损害的，算法设计者需要承担侵权责任，但是其承担的并非产品责任，而是基于过错的一般侵权责任。制造商知悉算法设计者故意设计缺陷算法的，对造成的损失承担产品责任；制造商对算法设计者故意设计缺陷算法不知情的，依据产品责任的构成要件判断其是否需要承担责任。“生产者责任仅限于传统的产品缺陷和因超级算法不可预测性而导致的损害，应当排除可归责于其他主体的原因力。”^([\[143\]](#txt005.html#footnote_content_txt005_143))


    ### （三）类推适用动物管理人责任


    智能机器（人）的智能属性使其区别于没有感知、思维或意识的无生命物体。在这一意义上，智能机器（人）更类似于动物，因而，有学者类比动物致害的责任承担来确定智能机器（人）的致害责任。智能机器（人）致害，由其管理人承担责任。受害人或第三人有过错的，减轻或免除智能机器（人）管理人的责任。“人工智能与其管理人的关系类似于动物之于其主人，但两者最大的区别在于人工智能比动物具有更强的自主性。”^([\[144\]](#txt005.html#footnote_content_txt005_144))


    ### （四）责任竞合


    责任竞合是指损害事实符合多种法律责任构成要件的要求，导致多种法律责任规范同时适用的情形。责任竞合时，权利人同时享有数个独立的请求权。当出现具有工具属性的智能机器（人）导致人身或财产损害的情形，一方面可以基于产品缺陷追究生产者的产品责任，另一方面可以基于管理人的过错追究其侵权责任。有学者认为此时发生产品责任和管理人责任的竞合。^([\[145\]](#txt005.html#footnote_content_txt005_145))“自动驾驶汽车致害时，可能发生责任竞合问题，即产品责任（《民法典》第1203
    条）与机动车交通事故责任（《道交法》第76 条）的竞合。”^([\[146\]](#txt005.html#footnote_content_txt005_146))持反对观点的学者认为，产品责任和管理人责任之间不存在竞合，人工智能工作物致人损害责任与产品责任“不是两种法律责任并存，而是人工智能工作物致人损害民事责任中的一部分是产品责任。因为两者存在部分重叠关系，故无法发生竞合”^([\[147\]](#txt005.html#footnote_content_txt005_147))。


    责任竞合说试图解决损害原因难以查明的难题，进而扩展受害人的救济方式。但是，需要明确该学说适用的范围。产品责任与管理人责任竞合是智能机器（人）致人损害责任承担的例外。责任竞合的现象的确偶然存在，但是在规则设计的层面并无考虑的必要。由生产者和管理人分别基于产品缺陷和过错承担法律责任的框架更适应现实生活的需要。首先，产品责任与管理人责任适用的情形不同，并非基于相同事实适用不同法律规范进而产生数个救济途径的问题。产品责任产生的事实基础是产品存在缺陷；而管理人责任产生的事实基础是管理人存在过错。只有在同时存在产品缺陷和管理人过错事实的情形时才会出现责任竞合，后者并非常态。其次，责任竞合说目的是扩展受害人的救济途径，但是在实践中不能实现。无论责任竞合的后果是由受害人择一行使请求权抑或其他，责任主体都能够以责任构成要件不具备进行抗辩，结果是受害人需要举证证明产品存在缺陷以及管理人存在过错。受害人的举证义务并未因责任竞合的设计而减轻。考虑责任竞合进行归责设计，徒增立法成本并无实际意义。


    ## 二、侧重人之属性的责任形态：主体定位下的立法论视角


    ### （一）智能机器（人）自负责任


    自负责任说主张，智能机器（人）行为的自主性使其应当对自身造成的损害承担法律责任。该说是建立在智能机器（人）能够作为独立的民事责任主体基础上的。有学者认为，由智能机器（人）独立承担损害赔偿责任虽然奇怪，却是合法且最佳的选择。^([\[148\]](#txt005.html#footnote_content_txt005_148))对此，有学者提出反对意见，认为这一观点混淆了技术上的自主性与主体意义上的自主性。“论者所主张的‘由自动驾驶汽车自负责任，为其设立责任基金并实行强制保险制度’的观点，只是限制了本来应该由制造商、设计者、销售商或者其他利益相关方承担的责任并将其在全社会范围内予以分散，而这种责任限制和责任分散的主要理由，就是将技术意义上的‘自主性’错误地理解为主体意义上的自主性。”^([\[149\]](#txt005.html#footnote_content_txt005_149))


    ### （二）替代责任


    替代责任是指某一类主体基于法定或约定的理由代替另一类主体承担法律责任，进而出现行为主体与责任主体分离的现象。替代责任存在的前提是法律主体多元化，如雇主与雇员、父母与未成年子女。行为主体与责任主体同一的情况下不存在替代责任。只有将智能机器（人）视为行为主体，才会出现替代责任。“如果智能机器人实际上‘代理或者代表’某个法律主体从事行为或者进行决策，那么可以比照父母对未成年人子女的责任或者说监护人对被监护人的责任，或者雇主对雇员的责任，让部署智能机器人的人承担替代责任。”^([\[150\]](#txt005.html#footnote_content_txt005_150))


    #### 1. 代理人责任


    “代理说的观点是，人工智能的所有行为均为人类所控制，其实施的行为与引起的后果最终必须由被代理人承担。”^([\[151\]](#txt005.html#footnote_content_txt005_151))在代理说的框架下，智能机器（人）与智能机器（人）的所有人、使用人或占有人之间是代理与被代理的关系。将智能机器（人）作为“人”看待是在代理关系的框架内理解智能机器（人）致害的民事责任承担的逻辑前提。智能机器（人）与管理者都属于主体的范畴，智能机器（人）是代理人而管理者是被代理人。智能机器（人）实施的行为反映了管理者的意志，责任由管理者承担。《欧盟机器人民事法律规则》第52
    条使用了“非人类代理人”的概念，在一定程度上承认了智能机器（人）具有法律人格。在思瑞夫蒂电话公司诉贝森尼克案（Thrifty-Tel，Inc.v.Bezenek）中，法院认定思瑞夫蒂电话公司的智能系统为该公司的代理人或扮演类似代理人的角色，将智能系统的信赖归诸本人。^([\[152\]](#txt005.html#footnote_content_txt005_152))

    '
  trans: '

    ## 一、侧重物之属性的责任形态：产品责任视角


    产品责任是以“产品缺陷”概念为中心构建的责任体系。^([\[128\]](#txt005.html#footnote_content_txt005_128))因产品缺陷造成损害，受害人有权向产品的生产者或销售者请求赔偿。生产者与销售者承担不真正连带责任。承担责任的主体有权向有过错的另一方进行追偿。“人工智能机器人既然是产品，如果其存在缺陷（不论是设计缺陷、制造缺陷、警示说明缺陷还是跟踪观察缺陷），造成他人损害的，都应当由制造者、销售者，充其量再增加设计者，来承担责任。”^([\[129\]](#txt005.html#footnote_content_txt005_129))


    我国《产品质量法》第 46 条从“不合理的危险”和“保障健康与安全标准”正反两方面界定了产品缺陷的概念。^([\[130\]](#txt005.html#footnote_content_txt005_130))根据该规定，构成产品缺陷需要满足以下条件：第一，产品危及人身、他人财产安全；第二，危及人身、他人财产安全的危险是不合理的；第三，产品不符合国家标准、行业标准。“我国产品责任制度对于产品缺陷采取了双重判定标准，即在界定其内涵为具有不合理危险之基础上，以消费者合理期待为一般标准，同时以国家和行业针对某些产品所制定的旨在保障人体健康和人身财产安全的强制性技术标准为法定标准。在判定产品缺陷时，有法定标准的适用法定标准，无法定标准时则适用一般标准。”^([\[131\]](#txt005.html#footnote_content_txt005_131))


    ### （1）人工智能时代产品缺陷的类型


    产品缺陷主要包括三种具体类型：“警示缺陷、制造缺陷和设计缺陷。”^([\[132\]](#txt005.html#footnote_content_txt005_132))警示缺陷又称指示缺陷或信息披露缺陷，是指负有警示义务的主体对产品危及人身和财产安全的风险未进行信息披露。警示能够让消费者了解产品存在的潜在风险，进而评估是否购买以及如何使用相关产品。人工智能时代负有警示义务的主体需要将智能机器（人）可能存在的风险或潜在风险告知消费者。例如，智能汽车在其无法识别的位置可能发生故障并导致损失。


    制造缺陷是指产品在加工、制作、装配过程中产生的危及人身、财产安全的不合理风险。“近年来，美国某些法院开始使用‘偏离设计意图’（depar⁃ture from
    intended design test）和‘故障学说’（malfunction doctrine）这两种方式来帮助判定产品制造商是否需要承担责任。”^([\[133\]](#txt005.html#footnote_content_txt005_133))“偏离设计意图”是指制造商在制造智能机器的过程中偏离设计者的意图，即制造缺陷产生的原因是在制造产品的过程中背离了既定的设计方案或技术指标。“‘故障学说’包含三个基本要素：一是产品故障，二是故障在常规和恰当使用产品时产生，三是产品未被改变或误用以导致故障。”^([\[134\]](#txt005.html#footnote_content_txt005_134))考虑到制造商与消费者在专业技能、人力物力上的显著差异，就制造缺陷的认定需要采用举证责任倒置的方式。例如，智能汽车的消费者或其他受害人能够证明智能汽车未按照说明书的描述运行，就能向制造商索赔。


    人工智能时代智能制造工艺和技术的不断进步，降低了制造缺陷的发生率，使得受害人通过制造缺陷诉讼获得救济的可能性降低，受害人寻求法律救济的途径从制造缺陷转向设计缺陷。设计缺陷是指因设计者在产品设计中存在疏漏进而导致产品存在危及人身、财产安全的不合理风险。在一定时期，人工智能技术进步与设计缺陷在整个产品缺陷类型中的比重呈正相关关系，即随着人工智能技术不断进步，设计缺陷在产品缺陷类型中所占的比重增加。人工智能设计缺陷产生的原因有多种，如模型训练中的瑕疵数据、漏洞代码、不合理或非最优算法。因设计缺陷导致的损害赔偿救济往往具有群体性特征。设计缺陷存在于一类而非单个智能产品上，一旦因设计缺陷引发索赔，一类产品都面临这一问题，这就使产品责任的承担主体如制造商、销售商需要承担大规模的责任。


    ### （2）产品缺陷的判断标准


    #### 第一，不合理危险标准


    我国《产品质量法》第 46 条采用“不合理的危险”标准判断产品责任。人工智能时代判断“不合理的风险”的理性人标准遭遇挑战。“金无足赤，人无完人”，现实生活中的人存在认识上的局限性。法律规则的设计需要考虑人在认识上的不足，否则会导致法律规则过于严苛或宽松而难以合理调整社会生活。选择何种类型的人作为法律规则设计的人像基础关系到法律规则的宽严程度。理性人标准是法律规则设计中经常采用的人像预设，它以社会生活中普通大众为考察对象，剔除了处于两端的“超强者”和“极弱者”，同时涤除了人的情绪化因素。


    “Arnold v.Reuther”一案中，Arnold 主张 Reuther 有“最后的机会”（last clear chance）避免损害发生。法官基于人与机器的区别以及人的弱点，反驳了这一观点。“必须为人类的弱点和反应留出一定的余地，而如果这样的余地必须要求人类在零点几秒内作出反应，并且不能像现代机械装置那样，以机械的速度和精度作出反应，那么就必须承认，Reuther
    作为一个普通人，再怎么做也不能避免因 Arnold 的过失而给她本人招来的不幸。”^([\[135\]](#txt005.html#footnote_content_txt005_135))法律义务与责任关注的对象从人类转向人工智能，相应地，判断行为理性和主体义务的标准也发生变化。例如，在自动驾驶领域，驾驶员由人类转变为人工智能驾驶系统后，判断人类驾驶员注意义务的标准难以适用于智能驾驶的场景，行为合理性的标准由理性人标准转向产品质量标准。


    #### 第二，消费者合理期待标准


    消费者合理期待标准以消费者对智能产品的合理预期为基础判断产品是否存在缺陷。“在欧盟法中，产品缺陷是指考虑到所有情况，产品没有提供人们所期待的安全性。这类似于消费者的合理期待标准。”^([\[136\]](#txt005.html#footnote_content_txt005_136))消费者合理期待标准是抽象的法学构造，有赖于法律共同体对消费者认知水平达成共识。


    消费者期待效用以普通消费者的认知为参照系，倘若产品设计中的风险不是普通消费者在合理预期范围内可以预见的，则该产品风险属于不合理的风险。在产品设计的原理和结构相对简单的情况下，普通消费者具备认知产品风险的能力，以普通消费者合理预期为标准进行判断具有合理性。但是，在人工智能时代苛求普通消费者对智能产品足够熟悉并能产生合理预期不太可能。人工智能技术的专业门槛使得绝大多数普通消费者对人工智能产品的安全性难以产生合理预期，基本排除了通过消费者期待测试判断人工智能产品是否存在设计缺陷的可能性。换言之，合理期待标准与消费者对产品的认知程度密切相关，倘若消费者对产品缺乏明确认知则很难产生合理预期。智能技术的研发与应用并不为普通消费者所熟知，通常超出了其认知范围，难以形成合理预期。此外，当受害人为第三人时消费者期待测试更难以适用。因为受害人并非智能汽车的消费者，不存在对智能汽车产品的合理预期。“《美国侵权法第三次重述：产品责任》已经不再将其作为一项独立的判断标准，而是仅作为风险—收益分析的一个因素。”^([\[137\]](#txt005.html#footnote_content_txt005_137))


    智能产品与被替代的非智能产品具有同等甚至更高的效用和安全度是消费者对智能产品的合理预期。例如，智能驾驶系统替代人类驾驶员的前提是，智能驾驶在安全性方面与人类驾驶相同甚至要求更高。“美国国家高速公路交通安全管理局在给予汽车制造商免于遵守美国联邦机动车安全标准（FMVSS）的豁免时，也要求所引入的新技术至少与现有技术一样安全，甚至要求更为安全。”^([\[138\]](#txt005.html#footnote_content_txt005_138))


    #### 第三，风险效用标准


    美国侵权法判断产品责任的主导标准经历了从“不合理的危险”向“风险—收益分析”的转变。《美国侵权法第二次重述》第 402 条 a 款将“不合理的危险”确定为判断产品责任的主导标准；而《美国侵权法第三次重述》则将“风险—收益分析”确定为判断产品责任的主导标准。“与消费者期待标准有所区别地是，风险—效用标准综合考虑了各种因素，较好地平衡了生产者和消费者的利益，并作出较为妥当的价值判断。”^([\[139\]](#txt005.html#footnote_content_txt005_139))风险效用测试是基于对成本和收益进行比较进而确定产品是否存在缺陷的测试方法，即比较替代方案所增加的成本与可能避免的潜在损失。约翰·韦德在“产品严格侵权责任的本质”（On
    the Nature of Strict Tort Liability for Prod⁃ucts）一文中分析了运用风险效用测试智能驾驶的三个因素：第一，存在替代产品；第二，产品的用途和可取性；第三，驾驶员的避险能力。^([\[140\]](#txt005.html#footnote_content_txt005_140))


    风险效用测试中的“成本—收益分析”需要区分整体分析与个案分析，整体分析具有统计学上的意义，个案分析关注对受害人的救济。替代设计与被替代设计之间的比较，分为全部比较与部分比较。人工智能产品是否存在设计缺陷并不一定需要进行全系统的整体比较，通常就导致事故发生的关键部分进行比较即可。基于算法在人工智能产品中的重要性，在一定的情形下，倘若能够证明替代算法能够阻止损害发生，且该替代算法的成本合理并非畸高，就足以证明人工智能产品存在设计缺陷。


    ### 3. 算法设计者的责任


    算法设计者是否需要对智能机器（人）造成的损害承担法律责任？有学者认为，人工智能程序算法的设计者是风险制造的源头，需要对智能机器（人）造成的损害承担赔偿责任，进而将人工智能程序算法的设计者作为新型民事责任主体。“人工智能机器人造成他人损害时，不能简单地认定由该机器人的生产者承担责任，而应当由该程序的发明者承担责任。”^([\[141\]](#txt005.html#footnote_content_txt005_141))这一观点值得商榷。首先，法律判断以事实判断为基础，但是法律判断并不等同于事实判断。人工智能程序设计者导致损害发生，就该损害承担责任的主体可以但不必然是程序设计者。法律责任的配置需要考虑社会政策、社会功能、可行性等诸多因素。其次，类比一般产品责任，人工智能程序算法的设计者不应对消费者直接承担损害赔偿责任。一般产品同样存在设计瑕疵的问题，但是该责任由制造者而非产品设计者承担。将人工智能程序算法的设计者作为产品责任的主体混淆了内部法律关系和外部法律关系。再次，人工智能程序算法的设计者虽然是风险产生的源头，但是一旦其完成研发过程便不再是有效的风险控制者。算法设计者可能对人工智能程序的具体应用一无所知或是缺乏对程序应用领域和范围的控制权，由其承担法律责任难谓公平。最后，人工智能系统的算法设计可能是由数人或组织在分散的状态下各自完成的，确定分散的参与人对损害发生的原因力有无或大小耗时耗力而且未必能够成功。


    算法设计者的责任与传统产品责任中“原材料、零部件和半成品的生产者”的责任类似。“最终生产者对产品的质量有最终的和最重要的控制力。至于有证据证明最终产品的特定原材料、零部件或半成品的缺陷造成了损害，最终生产者在承担了侵权责任之后，可依其与原材料、零部件或者半成品生产者之间的合同向后者追偿。”^([\[142\]](#txt005.html#footnote_content_txt005_142))生产者而非算法设计者是人工智能产品应用的最终主体，采取由其承担产品责任后，依据合同约定或法律规定向算法设计者追偿的方式更为可取。


    ### 4. 制造缺陷与算法缺陷之间的关系


    关于制造缺陷与算法缺陷的关系的理论存在区分说和吸收说。区分说认为，制造缺陷应当归咎于智能设备的生产者，而算法缺陷应当归咎于智能系统的设计者，二者相互区别，各自独立。吸收说认为，算法缺陷属于制造缺陷的一种类型，算法缺陷产生的损害结果被制造缺陷吸收，由生产者作为责任承担的主体。生产者在对外承担责任后，有权依据与算法设计者之间的协议向其追偿。


    厘清算法缺陷与制造缺陷之间的关系，首先需要区分算法设计者故意设计缺陷算法导致损害与算法设计者非因故意设计缺陷算法导致损害两种类型。算法设计者故意设计缺陷算法并导致损害的，算法设计者需要承担侵权责任，但是其承担的并非产品责任，而是基于过错的一般侵权责任。制造商知悉算法设计者故意设计缺陷算法的，对造成的损失承担产品责任；制造商对算法设计者故意设计缺陷算法不知情的，依据产品责任的构成要件判断其是否需要承担责任。“生产者责任仅限于传统的产品缺陷和因超级算法不可预测性而导致的损害，应当排除可归责于其他主体的原因力。”^([\[143\]](#txt005.html#footnote_content_txt005_143))


    ### （三）类推适用动物管理人责任


    智能机器（人）的智能属性使其区别于没有感知、思维或意识的无生命物体。在这一意义上，智能机器（人）更类似于动物，因而，有学者类比动物致害的责任承担来确定智能机器（人）的致害责任。智能机器（人）致害，由其管理人承担责任。受害人或第三人有过错的，减轻或免除智能机器（人）管理人的责任。“人工智能与其管理人的关系类似于动物之于其主人，但两者最大的区别在于人工智能比动物具有更强的自主性。”^([\[144\]](#txt005.html#footnote_content_txt005_144))


    ### （四）责任竞合


    责任竞合是指损害事实符合多种法律责任构成要件的要求，导致多种法律责任规范同时适用的情形。责任竞合时，权利人同时享有数个独立的请求权。当出现具有工具属性的智能机器（人）导致人身或财产损害的情形，一方面可以基于产品缺陷追究生产者的产品责任，另一方面可以基于管理人的过错追究其侵权责任。有学者认为此时发生产品责任和管理人责任的竞合。^([\[145\]](#txt005.html#footnote_content_txt005_145))“自动驾驶汽车致害时，可能发生责任竞合问题，即产品责任（《民法典》第
    1203 条）与机动车交通事故责任（《道交法》第 76 条）的竞合。”^([\[146\]](#txt005.html#footnote_content_txt005_146))持反对观点的学者认为，产品责任和管理人责任之间不存在竞合，人工智能工作物致人损害责任与产品责任“不是两种法律责任并存，而是人工智能工作物致人损害民事责任中的一部分是产品责任。因为两者存在部分重叠关系，故无法发生竞合”^([\[147\]](#txt005.html#footnote_content_txt005_147))。


    责任竞合说试图解决损害原因难以查明的难题，进而扩展受害人的救济方式。但是，需要明确该学说适用的范围。产品责任与管理人责任竞合是智能机器（人）致人损害责任承担的例外。责任竞合的现象的确偶然存在，但是在规则设计的层面并无考虑的必要。由生产者和管理人分别基于产品缺陷和过错承担法律责任的框架更适应现实生活的需要。首先，产品责任与管理人责任适用的情形不同，并非基于相同事实适用不同法律规范进而产生数个救济途径的问题。产品责任产生的事实基础是产品存在缺陷；而管理人责任产生的事实基础是管理人存在过错。只有在同时存在产品缺陷和管理人过错事实的情形时才会出现责任竞合，后者并非常态。其次，责任竞合说目的是扩展受害人的救济途径，但是在实践中不能实现。无论责任竞合的后果是由受害人择一行使请求权抑或其他，责任主体都能够以责任构成要件不具备进行抗辩，结果是受害人需要举证证明产品存在缺陷以及管理人存在过错。受害人的举证义务并未因责任竞合的设计而减轻。考虑责任竞合进行归责设计，徒增立法成本并无实际意义。


    ## 二、侧重人之属性的责任形态：主体定位下的立法论视角


    ### （一）智能机器（人）自负责任


    自负责任说主张，智能机器（人）行为的自主性使其应当对自身造成的损害承担法律责任。该说是建立在智能机器（人）能够作为独立的民事责任主体基础上的。有学者认为，由智能机器（人）独立承担损害赔偿责任虽然奇怪，却是合法且最佳的选择。^([\[148\]](#txt005.html#footnote_content_txt005_148))对此，有学者提出反对意见，认为这一观点混淆了技术上的自主性与主体意义上的自主性。“论者所主张的‘由自动驾驶汽车自负责任，为其设立责任基金并实行强制保险制度’的观点，只是限制了本来应该由制造商、设计者、销售商或者其他利益相关方承担的责任并将其在全社会范围内予以分散，而这种责任限制和责任分散的主要理由，就是将技术意义上的‘自主性’错误地理解为主体意义上的自主性。”^([\[149\]](#txt005.html#footnote_content_txt005_149))


    ### （二）替代责任


    替代责任是指某一类主体基于法定或约定的理由代替另一类主体承担法律责任，进而出现行为主体与责任主体分离的现象。替代责任存在的前提是法律主体多元化，如雇主与雇员、父母与未成年子女。行为主体与责任主体同一的情况下不存在替代责任。只有将智能机器（人）视为行为主体，才会出现替代责任。“如果智能机器人实际上‘代理或者代表’某个法律主体从事行为或者进行决策，那么可以比照父母对未成年人子女的责任或者说监护人对被监护人的责任，或者雇主对雇员的责任，让部署智能机器人的人承担替代责任。”^([\[150\]](#txt005.html#footnote_content_txt005_150))


    #### 1. 代理人责任


    “代理说的观点是，人工智能的所有行为均为人类所控制，其实施的行为与引起的后果最终必须由被代理人承担。”^([\[151\]](#txt005.html#footnote_content_txt005_151))在代理说的框架下，智能机器（人）与智能机器（人）的所有人、使用人或占有人之间是代理与被代理的关系。将智能机器（人）作为“人”看待是在代理关系的框架内理解智能机器（人）致害的民事责任承担的逻辑前提。智能机器（人）与管理者都属于主体的范畴，智能机器（人）是代理人而管理者是被代理人。智能机器（人）实施的行为反映了管理者的意志，责任由管理者承担。《欧盟机器人民事法律规则》第
    52 条使用了“非人类代理人”的概念，在一定程度上承认了智能机器（人）具有法律人格。在思瑞夫蒂电话公司诉贝森尼克案（Thrifty-Tel，Inc.v.Bezenek）中，法院认定思瑞夫蒂电话公司的智能系统为该公司的代理人或扮演类似代理人的角色，将智能系统的信赖归诸本人。^([\[152\]](#txt005.html#footnote_content_txt005_152))

    '
  toc: []
- raw: '“代理机制的引入和解释有效地解决了机器人—代理人和本人在从事民事活动中特别是从事民事法律行为中的效力判断、法律后果归属以及可能产生的民事责任的归属，本质上也属于一种查明和确定责任归属的法律机制。”^([\[153\]](#txt005.html#footnote_content_txt005_153))欧洲议会在《欧盟机器人民事法律责任》（Civil
    Law Rules on Robots）这一议案中表达了对既有法律框架调整合同行为的担忧。相对方选择、条款磋商、合同订立与履行因智能机器（人）的参与对传统法律规则体系的适用性造成冲击。有学者认为，这一担忧未免言过其实，其实传统的代理法律规则可以有效解决此类问题，《格里申法案》就是非常成功的解决范例^([\[154\]](#txt005.html#footnote_content_txt005_154))。《格里申法案》在责任规则设计上参照罗马法的特有产制度，让智能机器（人）在一定范围内享有独立财产并基于该财产独立承担责任。智能机器（人）的所有权人或占有人可以将部分财产转移给智能机器（人），由其占有或使用，在该财产范围内，智能机器（人）独立承担责任。^([\[155\]](#txt005.html#footnote_content_txt005_155))


    代理说存在的问题主要有：①代理的权限如何确定？作为代理人的人工智能超越代理权实施加害行为时法律责任由谁承担？“鉴于人工智能的自主性，代理权限和范围很难确定，如果超出权限的加害行为得不到管理人追认，侵权责任应当由代理人，也就是人工智能承担，而这种责任对受害者而言显然是没有实际意义的。”^([\[156\]](#txt005.html#footnote_content_txt005_156))②代理人如何承担责任？倘若代理人无法承担法律责任，而被代理人需要承担所有法律责任，这就与代理人作为“人”而非“物”的理论预设相冲突。


    2.法人责任


    法人责任说认为，智能机器（人）的法律地位类似于拟制的法人。赋予智能机器（人）主体地位的逻辑基点是伦理性人格还是工具性人格？主张赋予智能机器（人）类似自然人的人格或类似动物进行保护是注重伦理性人格，而主张赋予智能机器（人）类似法人的人格是注重工具性人格。法人是民事主体的一种类型，但是，它具有强烈的工具性色彩，不以伦理性为基础。《格里申法案》对具有高度自主性的智能机器（人）作类似于法人的处理，赋予其法律主体地位。法人责任说存在的弊端是：在“剥洋葱”理论的分析框架下，人工智能与法人剩余的内核存在本质的差异。将法人进行层层分解并剔除股东的因素后其只剩下空洞的内核；而将智能机器（人）进行层层分解并剔除管理者的因素后其剩下的可能是具有自主性的独立存在。法人的成立、运营、破产完全受人的控制，但人工智能有其自主性，很大程度上不受人的控制。^([\[157\]](#txt005.html#footnote_content_txt005_157))


    3.雇主责任


    雇主责任说认为，在技术中立原则下，管理者对人工智能实施的侵权行为因未尽到管理义务而存在过错的，应当承担类似于雇主责任的法律责任。我国《民法典》第1191 条对雇主责任进行了规定。有学者认为：“类推适用雇主责任说，将人工智能当作其所有者的雇员，其行使智能之行为，所创设之权利和义务应归属于主体。”^([\[158\]](#txt005.html#footnote_content_txt005_158))在雇主责任说的框架内，区分智能机器（人）的职务行为与非职务行为十分必要。“如果将智能机器人看作是事实上的雇员，为了明确雇主的责任，就必须提出判断智能机器人的职务行为和非职务行为的标准。”^([\[159\]](#txt005.html#footnote_content_txt005_159))


    4.监护责任


    “人工智能的法律地位并非一成不变，未来可能具有民事主体资格，适用监护制度。”^([\[160\]](#txt005.html#footnote_content_txt005_160))为智能机器人设立类似监护制度的前提是：①智能机器人具有独立人格；②智能机器人缺乏责任能力。^([\[161\]](#txt005.html#footnote_content_txt005_161))作为智能机器（人）监督者的监护人责任随之产生，“其职责是维护、监督人工智能的日常行为，矫正人工智能的非正常行为以避免损害发生。当损害发生时，监督者代替生产者和创造者承担赔偿责任，其履行赔偿责任后有权向生产者和创造者追偿。”^([\[162\]](#txt005.html#footnote_content_txt005_162))存在疑问的是，监护人即智能机器（人）的监督者是谁？是公权主体还是私权主体？监督者的权利和义务是否会失衡？这些问题都在积极探索中，尚无定论，需要进一步研究并提出解释或解决方案。


    第三节　人工智能时代的因果关系


    “在法律规范原理上，使遭受损害的权益，与促使损害发生之原因者结合，将损害因而转嫁由原因者承担之法律价值判断因素，即为‘归责’意义之核心。”^([\[163\]](#txt005.html#footnote_content_txt005_163))由此可见，将损害结果转嫁至导致该结果发生的原因力是法律归责的目的所在，确定因果关系是法律归责的要义所在。


    人工智能时代算法黑箱使因果关系复杂化。算法黑箱是指，计算机基于输入数据生成模型的机器学习过程不透明。人工智能算法黑箱内外呈现出截然不同的两种景象。“打开黑盒子，设计者与用户面对的将是一堆可以得出某种答案的主观偏见与程序。而合上之后，它体现的就是客观性——一种无须满足任何更多的条件即可生成‘是’与‘否’的二元选项的机器。”^([\[164\]](#txt005.html#footnote_content_txt005_164))人工智能算法黑箱的出现“或者因为深度学习算法的运用而无法言明计算的过程与内容，或者由于算法商业机密与知识产权的考虑而不对外公开”^([\[165\]](#txt005.html#footnote_content_txt005_165))。


    一、因果关系与相关关系


    在算法和数据主导的应用场景中，以人类行为为基础的因果关系规则体系是否仍然适用不无疑问。算法设计者可能并非某个专业领域的专家，但是其设计的学习算法却能击败该专业领域的顶尖者，AlphaGo
    击败世界围棋高手即为明证。“程序员给出的只是学习规则，但真正作出决策的是基于大数据训练后的算法本身，而这一结果与程序员的意志并无直接因果关联。”^([\[166\]](#txt005.html#footnote_content_txt005_166))


    相关关系是因素与结果之间的关系，是一种变量关系。算法利用相关性而非因果性将输入的数据转化为输出数据或新算法。相关关系是因果关系量化的结果。人工智能时代，建立在数据分析基础上的决策和行为是否还可以通过因果关系进行解释？“大数据时代最惊心动魄的挑战，就是社会将需要从对因果关系的某种痴迷中蜕出，而代之以简单的相关关系。在大数据基础上建立起来的模型没有关于‘为什么’的理解，只有‘是什么’。”^([\[167\]](#txt005.html#footnote_content_txt005_167))换言之，因果关系与相关关系的区别在于，因果关系具有确定性而相关关系具有不确定性。“因果关系必须具有状态描述与状态之间的必然联系，而从相关性到因果性的逻辑链条并不完备，相关性具有不确定性。”^([\[168\]](#txt005.html#footnote_content_txt005_168))因果关系的确定性与智能机器（人）行为的可预期性相一致，符合人们追求稳定社会生活的需要；而相关关系的不确定性则使智能机器（人）的决策和行为可能出现人们无法预料的后果，难以发挥法律规则的教育、惩戒和引导作用。以相关关系替代因果关系可能陷入不可知论，规则无效的观点随之产生。例如，智能驾驶汽车通过感知设备收集数据和信息并基于算法在海量数据分析的基础上作出决策或行为。相互关联的数据整体而非单个数据与行为或决策之间存在对应关系。“信息的数据化使因果关系量化获得关系强度和正负性质的同时，丧失了原来的必然性和方向性。”^([\[169\]](#txt005.html#footnote_content_txt005_169))行为与结果之间的关系变得复杂而模糊。


    二、描述性因果关系向创构性因果关系转变


    “描述是对既存对象的符号、语词和模型等的摹写；创构是从未存在的感性对象的创设，它是基于人们的需要，根据所设立的潜在结果，得到与之相联系的因素体系，并确定和控制这些因素的相互作用，获得所想得到的结果的过程。”^([\[170\]](#txt005.html#footnote_content_txt005_170))传统因果关系是以已有经验为基础的描述性因果关系。在大数据和人工智能时代，描述性因果关系的解释力弱化，发生向创构性因果关系的转变。


    在描述性因果关系视角下，因果关系与相关关系是具有并列关系的两个概念。因果关系与相关关系是质与量的关系。因果关系侧重质，相关关系侧重量。在创构性因果关系视角下，因果关系与相关关系是具有包含关系的两个概念。相关关系并不排斥因果关系。相关关系是算法世界因果关系的定量表达方式，即从量的角度把握因果关系。在创构的过程中，算法将人们关注的重心从因果关系转向变量之间的相关关系。在量化关系中，因果关系被相关关系所取代。原因被转化为因素之间相互作用的过程。创构认知论视角下的因果关系与高度可能性的证明标准相一致。“高度可能性作为证据法中‘情景不可再现’之产物，通过大量证据之间的联系构架出事物原本之面目。”^([\[171\]](#txt005.html#footnote_content_txt005_171))


    区分描述与创构并不意味着二者截然不同，毫无关联。在创构的层面同样存在“为什么”的内容，它与描述可能存在共同的因果依据。“从技术上说，创构是通过组合操作，生产出满足表现出来的需要的过程。而从哲学上说，创构则建立在对客观对象的存在及其方式和人的需要及其发展的因果性认识基础之上。”^([\[172\]](#txt005.html#footnote_content_txt005_172))在创构论认知视角下，因果基础由线性关系转变为因素关系。传统的因果关系无论是一因一果还是多因一果，因与果之间都呈线性关系，它体现了事物之间必然的或方向性的关联性。而算法世界中的因果关系则是以因素分析为基础的，它体现了事物之间在量上的关联性。“在创构论因果观的视角下，无人驾驶汽车的自主决策能力归因于能够结合大数据分析进行深度学习和自主分析的智能算法，虽然该能力可能中断行为与结果的因果关系，但趋于模糊的因果关系仍具有特定的相关性，并不妨碍责任主体的确定和特定主体的主观归责。”^([\[173\]](#txt005.html#footnote_content_txt005_173))


    三、因果关系的新型规则


    （一）识别规则


    查明事实是责任认定的前提。技术漏洞、设计瑕疵、制造缺陷、管理失误、使用不当、人工智能超越原设计方案的“自身行为”都可能是导致人工智能产品侵权的原因，需要对人工智能产品设计、制造、管理、使用的各环节进行分析，探究因果关系。算法的专业性、复杂性和不透明性等特征使得智能机器（人）致损事故陷入不可解释或难以解释的困境。加害行为与损害结果之间的因果关系模糊化。决策逻辑和决策过程的发现和证明需要专业人员、设备进行分析，成本高昂。即便算法是公开的、透明的，受害方也会因为专业方面的限制而缺乏相应的举证、质证能力。为了胜诉受害人需要为克服技术上的障碍而支付无法估量的成本并且难以预测结果，维权成本与收益之间比例失衡，具有不经济的特征。为解决因果关系证明困难和不经济的难题，需要建立强制操作留痕和定期报告制度。通过强制留痕将智能机器（人）的行为轨迹固定下来，通过强制定期报告降低识别智能机器（人）行为轨迹的成本，保障其行为的透明度。


    （二）法定或行业标准规则


    过错推定下的举证责任倒置方式对于制造者一方而言有过于严苛之嫌。“由设计者和制造商证明产品没有缺陷，意味着他们要对‘无’承担证明责任，这可能导致设计者和制造商须对几乎所有的自动驾驶汽车致损事故负责，与直接废弃缺陷要件无异。”^([\[174\]](#txt005.html#footnote_content_txt005_174))为了缓和举证责任倒置规则过于严苛的弊端，需要引入法定或行业标准规则。不符合法定或行业标准就是人工智能产品存在缺陷的初步证明。设计者、制造者或生产者需要证明实际发生的损害与不符合法定或行业标准之间不存在因果关系，方可免责。


    根据“事物自道其缘”的基本原理，“只要受害人能够证明其所受损害系智能机器人行为在事实上的结果，法律上的因果关系即告成立，而不必证明该行为是其损失发生的唯一原因或直接原因。”^([\[175\]](#txt005.html#footnote_content_txt005_175))制造者需要储存智能机器（人）运行过程中与安全相关的数据，并保证数据的可视化或可解释性，从而确保损害事实发生过程的透明度，并在事故发生时将其作为免除责任的证据。


    （三）可预见性规则


    根据人工智能程序设计者对智能机器行为是否可预见，可以将智能机器（人）的行为分为可预见行为和不可预见行为两种类型。在可预见行为中，智能机器（人）的行为与程序设计之间存在对应关系。在不可预见行为中，算法黑箱增加了识别智能机器（人）行为的难度。Jenna
    Burrell 在其论文“机器如何‘思考’：理解机器学习算法中的不透明性”中论述了三种形式的不透明性：因公司商业秘密或者国家秘密而产生的不透明性，因技术文盲而产生的不透明性以及从机器学习算法的特征和要求将它们有效适用的测量中产生的不透明性。^([\[176\]](#txt005.html#footnote_content_txt005_176))


    根据不可预见行为与人工智能程序设计者的主观意图之间的关系，又可将不可预见行为区分为目的性不可预见行为和非目的性不可预见行为。在目的性不可预见行为中，虽然智能机器（人）的行为是程序设计者不可预见的，但是，这种不可预见正是程序设计者的目的所在。深度学习算法使得智能机器（人）具备了自主学习的能力，能够基于算法和数据作出程序设计者不可预见的行为。该行为的不可预见本身在程序设计者或制造者的目的范围内。换言之，智能机器（人）行为或决策的不确定性与不可预测性是设计者或制造者预先设计的结果。具体行为不可预测不同于风险不可预测。以数据和算法为基础的机器行为和决策仍然处于人类的控制之下。“任何人如果允许机器作出自主决策，都应该能预见到机器总是会失控并且应当为此承担责任。”^([\[177\]](#txt005.html#footnote_content_txt005_177))


    非目的性不可预见行为产生的原因主要有：第一，智能机器（人）自我进化。高度智能化的人工智能产品在运行过程中自行修改程序。第二，外来因素介入。例如，黑客攻击将代码植入人工智能系统。外来因素介入人工智能系统造成损失时，人工智能系统沦为侵权的工具，真正实施侵权行为的主体是隐藏在人工智能系统背后的主体。这就需要运用穿透规则，由通过人工智能系统实施侵权行为的主体承担一般侵权责任。


    总之，智能机器（人）的自主程度是影响法律责任承担的重要考量因素。预见性（foreseeability）是程序设计者、制造者、使用者等主体对智能机器（人）的致害行为承担法律责任的前提。不可预见（unforeseeable）阻却了人工智能系统设计者对系统造成损害需要承担的责任。受害者可能丧失获得救济的途径。^([\[178\]](#txt005.html#footnote_content_txt005_178))


    （四）合理期待规则


    化繁为简，以合理预期为标准判断缺陷是否存在。这就解决了因智能技术的复杂性而导致缺陷证明困难的问题降低缺陷证明标准，进而扩大产品责任的范围，避免生产者、消费者以及受害人围绕复杂的学习算法是否存在进行证明、分析和论证，是在既有规则体系下保障实质正义的一项合理政策选择。


    （五）替代原因（suspending cause）切断因果关系的规则


    “深度学习算法”（deep learning algorthm）使得智能机器（人）基于数据和算法分析，感知外界环境并进行决策成为可能。具有自主学习能力的人工智能系统作出的决策或行为会随着环境的改变而发生变化，即出现人类设计者未能预见的情况。人类编程员设定的目的与智能机器努力的结果出现偏差。人工智能自主学习和适应环境的能力，使控制权问题变得扑朔迷离。机器决策或行为的可预见性和可控制性这一理论预设根基发生动摇。智能机器（人）行为的自主性增强，相应地，人类对智能机器（人）的控制力减弱。无论人类在人工智能研发、程序设计和制造的过程中如何小心谨慎都无法完全控制或预测具有自主学习能力的人工智能系统根据环境因素变化可能作出的决策或行为。基于学习算法的智能机器（人）自主决策和行为的介入作为替代原因切断了人类程序设计者或者智能机器（人）使用者与损害结果之间的因果关系。


    在何种条件下，智能机器（人）的自主决策和行为构成切断人类程序设计者或智能机器（人）使用者与损害结果之间因果关系的介入因素？“哈特和奥诺尔讨论法律中的因果关系时，对于人的行为是否构成介入（替代）原因这一问题所提出的主要判断标准即在于介入的行为是否体现了介入者的自由意志和自主选择。”^([\[179\]](#txt005.html#footnote_content_txt005_179))也就是说，以介入行为是否体现了介入者独立的自由意志为标准判断是否构成替代原因。介入行为体现介入者独立的自由意志构成介入原因；介入行为不体现介入者独立的自由意志则不构成介入原因。


    在机器意识尚未觉醒的技术条件下，人工智能尚不具有独立、自主的意识，智能机器（人）在交互环境中自主作出决策是人类设计者或制造者预先设计或追求的结果。智能机器（人）行为或决策的不确定性与不可预测性是设计者或制造者预先设计的结果。具体行为不可预测不同于风险不可预测。以数据和算法为基础的机器行为和决策仍然处于人类的控制之下。


    第四节　人工智能时代民事法律责任的承担方式


    一、民事法律责任承担方式的类型


    人工智能时代的民事法律责任承担方式大致可以分为两种类型：一种是以人类为联结点的民事法律责任承担方式；另一种是以智能机器（人）为联结点的民事责任承担方式。前者是传统法律体系规定的民事法律责任承担方式，侧重规制人类的行为，财产责任是救济的重心所在；后者是人工智能时代可能采用的新型民事法律责任承担方式，侧重规制智能机器（人）的“行为”，不限于财产责任。'
  fmt: '

    ## 代理机制的引入与代理说的局限


    “代理机制的引入和解释有效地解决了机器人—代理人和本人在从事民事活动中特别是从事民事法律行为中的效力判断、法律后果归属以及可能产生的民事责任的归属，本质上也属于一种查明和确定责任归属的法律机制。”^([\[153\]](#txt005.html#footnote_content_txt005_153))欧洲议会在《欧盟机器人民事法律责任》（Civil
    Law Rules on Robots）这一议案中表达了对既有法律框架调整合同行为的担忧。相对方选择、条款磋商、合同订立与履行因智能机器（人）的参与对传统法律规则体系的适用性造成冲击。有学者认为，这一担忧未免言过其实，其实传统的代理法律规则可以有效解决此类问题，《格里申法案》就是非常成功的解决范例^([\[154\]](#txt005.html#footnote_content_txt005_154))。《格里申法案》在责任规则设计上参照罗马法的特有产制度，让智能机器（人）在一定范围内享有独立财产并基于该财产独立承担责任。智能机器（人）的所有权人或占有人可以将部分财产转移给智能机器（人），由其占有或使用，在该财产范围内，智能机器（人）独立承担责任。^([\[155\]](#txt005.html#footnote_content_txt005_155))


    代理说存在的问题主要有：①代理的权限如何确定？作为代理人的人工智能超越代理权实施加害行为时法律责任由谁承担？“鉴于人工智能的自主性，代理权限和范围很难确定，如果超出权限的加害行为得不到管理人追认，侵权责任应当由代理人，也就是人工智能承担，而这种责任对受害者而言显然是没有实际意义的。”^([\[156\]](#txt005.html#footnote_content_txt005_156))②代理人如何承担责任？倘若代理人无法承担法律责任，而被代理人需要承担所有法律责任，这就与代理人作为“人”而非“物”的理论预设相冲突。


    ### 2. 法人责任


    法人责任说认为，智能机器（人）的法律地位类似于拟制的法人。赋予智能机器（人）主体地位的逻辑基点是伦理性人格还是工具性人格？主张赋予智能机器（人）类似自然人的人格或类似动物进行保护是注重伦理性人格，而主张赋予智能机器（人）类似法人的人格是注重工具性人格。法人是民事主体的一种类型，但是，它具有强烈的工具性色彩，不以伦理性为基础。《格里申法案》对具有高度自主性的智能机器（人）作类似于法人的处理，赋予其法律主体地位。法人责任说存在的弊端是：在“剥洋葱”理论的分析框架下，人工智能与法人剩余的内核存在本质的差异。将法人进行层层分解并剔除股东的因素后其只剩下空洞的内核；而将智能机器（人）进行层层分解并剔除管理者的因素后其剩下的可能是具有自主性的独立存在。法人的成立、运营、破产完全受人的控制，但人工智能有其自主性，很大程度上不受人的控制。^([\[157\]](#txt005.html#footnote_content_txt005_157))


    ### 3. 雇主责任


    雇主责任说认为，在技术中立原则下，管理者对人工智能实施的侵权行为因未尽到管理义务而存在过错的，应当承担类似于雇主责任的法律责任。我国《民法典》第1191 条对雇主责任进行了规定。有学者认为：“类推适用雇主责任说，将人工智能当作其所有者的雇员，其行使智能之行为，所创设之权利和义务应归属于主体。”^([\[158\]](#txt005.html#footnote_content_txt005_158))在雇主责任说的框架内，区分智能机器（人）的职务行为与非职务行为十分必要。“如果将智能机器人看作是事实上的雇员，为了明确雇主的责任，就必须提出判断智能机器人的职务行为和非职务行为的标准。”^([\[159\]](#txt005.html#footnote_content_txt005_159))


    ### 4. 监护责任


    “人工智能的法律地位并非一成不变，未来可能具有民事主体资格，适用监护制度。”^([\[160\]](#txt005.html#footnote_content_txt005_160))为智能机器人设立类似监护制度的前提是：①智能机器人具有独立人格；②智能机器人缺乏责任能力。^([\[161\]](#txt005.html#footnote_content_txt005_161))作为智能机器（人）监督者的监护人责任随之产生，“其职责是维护、监督人工智能的日常行为，矫正人工智能的非正常行为以避免损害发生。当损害发生时，监督者代替生产者和创造者承担赔偿责任，其履行赔偿责任后有权向生产者和创造者追偿。”^([\[162\]](#txt005.html#footnote_content_txt005_162))存在疑问的是，监护人即智能机器（人）的监督者是谁？是公权主体还是私权主体？监督者的权利和义务是否会失衡？这些问题都在积极探索中，尚无定论，需要进一步研究并提出解释或解决方案。


    ## 第三节 人工智能时代的因果关系


    “在法律规范原理上，使遭受损害的权益，与促使损害发生之原因者结合，将损害因而转嫁由原因者承担之法律价值判断因素，即为‘归责’意义之核心。”^([\[163\]](#txt005.html#footnote_content_txt005_163))由此可见，将损害结果转嫁至导致该结果发生的原因力是法律归责的目的所在，确定因果关系是法律归责的要义所在。


    人工智能时代算法黑箱使因果关系复杂化。算法黑箱是指，计算机基于输入数据生成模型的机器学习过程不透明。人工智能算法黑箱内外呈现出截然不同的两种景象。“打开黑盒子，设计者与用户面对的将是一堆可以得出某种答案的主观偏见与程序。而合上之后，它体现的就是客观性——一种无须满足任何更多的条件即可生成‘是’与‘否’的二元选项的机器。”^([\[164\]](#txt005.html#footnote_content_txt005_164))人工智能算法黑箱的出现“或者因为深度学习算法的运用而无法言明计算的过程与内容，或者由于算法商业机密与知识产权的考虑而不对外公开”^([\[165\]](#txt005.html#footnote_content_txt005_165))。


    ### 一、因果关系与相关关系


    在算法和数据主导的应用场景中，以人类行为为基础的因果关系规则体系是否仍然适用不无疑问。算法设计者可能并非某个专业领域的专家，但是其设计的学习算法却能击败该专业领域的顶尖者，AlphaGo
    击败世界围棋高手即为明证。“程序员给出的只是学习规则，但真正作出决策的是基于大数据训练后的算法本身，而这一结果与程序员的意志并无直接因果关联。”^([\[166\]](#txt005.html#footnote_content_txt005_166))


    相关关系是因素与结果之间的关系，是一种变量关系。算法利用相关性而非因果性将输入的数据转化为输出数据或新算法。相关关系是因果关系量化的结果。人工智能时代，建立在数据分析基础上的决策和行为是否还可以通过因果关系进行解释？“大数据时代最惊心动魄的挑战，就是社会将需要从对因果关系的某种痴迷中蜕出，而代之以简单的相关关系。在大数据基础上建立起来的模型没有关于‘为什么’的理解，只有‘是什么’。”^([\[167\]](#txt005.html#footnote_content_txt005_167))换言之，因果关系与相关关系的区别在于，因果关系具有确定性而相关关系具有不确定性。“因果关系必须具有状态描述与状态之间的必然联系，而从相关性到因果性的逻辑链条并不完备，相关性具有不确定性。”^([\[168\]](#txt005.html#footnote_content_txt005_168))因果关系的确定性与智能机器（人）行为的可预期性相一致，符合人们追求稳定社会生活的需要；而相关关系的不确定性则使智能机器（人）的决策和行为可能出现人们无法预料的后果，难以发挥法律规则的教育、惩戒和引导作用。以相关关系替代因果关系可能陷入不可知论，规则无效的观点随之产生。例如，智能驾驶汽车通过感知设备收集数据和信息并基于算法在海量数据分析的基础上作出决策或行为。相互关联的数据整体而非单个数据与行为或决策之间存在对应关系。“信息的数据化使因果关系量化获得关系强度和正负性质的同时，丧失了原来的必然性和方向性。”^([\[169\]](#txt005.html#footnote_content_txt005_169))行为与结果之间的关系变得复杂而模糊。


    ### 二、描述性因果关系向创构性因果关系转变


    “描述是对既存对象的符号、语词和模型等的摹写；创构是从未存在的感性对象的创设，它是基于人们的需要，根据所设立的潜在结果，得到与之相联系的因素体系，并确定和控制这些因素的相互作用，获得所想得到的结果的过程。”^([\[170\]](#txt005.html#footnote_content_txt005_170))传统因果关系是以已有经验为基础的描述性因果关系。在大数据和人工智能时代，描述性因果关系的解释力弱化，发生向创构性因果关系的转变。


    在描述性因果关系视角下，因果关系与相关关系是具有并列关系的两个概念。因果关系与相关关系是质与量的关系。因果关系侧重质，相关关系侧重量。在创构性因果关系视角下，因果关系与相关关系是具有包含关系的两个概念。相关关系并不排斥因果关系。相关关系是算法世界因果关系的定量表达方式，即从量的角度把握因果关系。在创构的过程中，算法将人们关注的重心从因果关系转向变量之间的相关关系。在量化关系中，因果关系被相关关系所取代。原因被转化为因素之间相互作用的过程。创构认知论视角下的因果关系与高度可能性的证明标准相一致。“高度可能性作为证据法中‘情景不可再现’之产物，通过大量证据之间的联系构架出事物原本之面目。”^([\[171\]](#txt005.html#footnote_content_txt005_171))


    区分描述与创构并不意味着二者截然不同，毫无关联。在创构的层面同样存在“为什么”的内容，它与描述可能存在共同的因果依据。“从技术上说，创构是通过组合操作，生产出满足表现出来的需要的过程。而从哲学上说，创构则建立在对客观对象的存在及其方式和人的需要及其发展的因果性认识基础之上。”^([\[172\]](#txt005.html#footnote_content_txt005_172))在创构论认知视角下，因果基础由线性关系转变为因素关系。传统的因果关系无论是一因一果还是多因一果，因与果之间都呈线性关系，它体现了事物之间必然的或方向性的关联性。而算法世界中的因果关系则是以因素分析为基础的，它体现了事物之间在量上的关联性。“在创构论因果观的视角下，无人驾驶汽车的自主决策能力归因于能够结合大数据分析进行深度学习和自主分析的智能算法，虽然该能力可能中断行为与结果的因果关系，但趋于模糊的因果关系仍具有特定的相关性，并不妨碍责任主体的确定和特定主体的主观归责。”^([\[173\]](#txt005.html#footnote_content_txt005_173))


    ### 三、因果关系的新型规则


    #### （一）识别规则


    查明事实是责任认定的前提。技术漏洞、设计瑕疵、制造缺陷、管理失误、使用不当、人工智能超越原设计方案的“自身行为”都可能是导致人工智能产品侵权的原因，需要对人工智能产品设计、制造、管理、使用的各环节进行分析，探究因果关系。算法的专业性、复杂性和不透明性等特征使得智能机器（人）致损事故陷入不可解释或难以解释的困境。加害行为与损害结果之间的因果关系模糊化。决策逻辑和决策过程的发现和证明需要专业人员、设备进行分析，成本高昂。即便算法是公开的、透明的，受害方也会因为专业方面的限制而缺乏相应的举证、质证能力。为了胜诉受害人需要为克服技术上的障碍而支付无法估量的成本并且难以预测结果，维权成本与收益之间比例失衡，具有不经济的特征。为解决因果关系证明困难和不经济的难题，需要建立强制操作留痕和定期报告制度。通过强制留痕将智能机器（人）的行为轨迹固定下来，通过强制定期报告降低识别智能机器（人）行为轨迹的成本，保障其行为的透明度。


    #### （二）法定或行业标准规则


    过错推定下的举证责任倒置方式对于制造者一方而言有过于严苛之嫌。“由设计者和制造商证明产品没有缺陷，意味着他们要对‘无’承担证明责任，这可能导致设计者和制造商须对几乎所有的自动驾驶汽车致损事故负责，与直接废弃缺陷要件无异。”^([\[174\]](#txt005.html#footnote_content_txt005_174))为了缓和举证责任倒置规则过于严苛的弊端，需要引入法定或行业标准规则。不符合法定或行业标准就是人工智能产品存在缺陷的初步证明。设计者、制造者或生产者需要证明实际发生的损害与不符合法定或行业标准之间不存在因果关系，方可免责。


    根据“事物自道其缘”的基本原理，“只要受害人能够证明其所受损害系智能机器人行为在事实上的结果，法律上的因果关系即告成立，而不必证明该行为是其损失发生的唯一原因或直接原因。”^([\[175\]](#txt005.html#footnote_content_txt005_175))制造者需要储存智能机器（人）运行过程中与安全相关的数据，并保证数据的可视化或可解释性，从而确保损害事实发生过程的透明度，并在事故发生时将其作为免除责任的证据。


    #### （三）可预见性规则


    根据人工智能程序设计者对智能机器行为是否可预见，可以将智能机器（人）的行为分为可预见行为和不可预见行为两种类型。在可预见行为中，智能机器（人）的行为与程序设计之间存在对应关系。在不可预见行为中，算法黑箱增加了识别智能机器（人）行为的难度。Jenna
    Burrell 在其论文“机器如何‘思考’：理解机器学习算法中的不透明性”中论述了三种形式的不透明性：因公司商业秘密或者国家秘密而产生的不透明性，因技术文盲而产生的不透明性以及从机器学习算法的特征和要求将它们有效适用的测量中产生的不透明性。^([\[176\]](#txt005.html#footnote_content_txt005_176))


    根据不可预见行为与人工智能程序设计者的主观意图之间的关系，又可将不可预见行为区分为目的性不可预见行为和非目的性不可预见行为。在目的性不可预见行为中，虽然智能机器（人）的行为是程序设计者不可预见的，但是，这种不可预见正是程序设计者的目的所在。深度学习算法使得智能机器（人）具备了自主学习的能力，能够基于算法和数据作出程序设计者不可预见的行为。该行为的不可预见本身在程序设计者或制造者的目的范围内。换言之，智能机器（人）行为或决策的不确定性与不可预测性是设计者或制造者预先设计的结果。具体行为不可预测不同于风险不可预测。以数据和算法为基础的机器行为和决策仍然处于人类的控制之下。“任何人如果允许机器作出自主决策，都应该能预见到机器总是会失控并且应当为此承担责任。”^([\[177\]](#txt005.html#footnote_content_txt005_177))


    非目的性不可预见行为产生的原因主要有：第一，智能机器（人）自我进化。高度智能化的人工智能产品在运行过程中自行修改程序。第二，外来因素介入。例如，黑客攻击将代码植入人工智能系统。外来因素介入人工智能系统造成损失时，人工智能系统沦为侵权的工具，真正实施侵权行为的主体是隐藏在人工智能系统背后的主体。这就需要运用穿透规则，由通过人工智能系统实施侵权行为的主体承担一般侵权责任。


    总之，智能机器（人）的自主程度是影响法律责任承担的重要考量因素。预见性（foreseeability）是程序设计者、制造者、使用者等主体对智能机器（人）的致害行为承担法律责任的前提。不可预见（unforeseeable）阻却了人工智能系统设计者对系统造成损害需要承担的责任。受害者可能丧失获得救济的途径。^([\[178\]](#txt005.html#footnote_content_txt005_178))


    #### （四）合理期待规则


    化繁为简，以合理预期为标准判断缺陷是否存在。这就解决了因智能技术的复杂性而导致缺陷证明困难的问题降低缺陷证明标准，进而扩大产品责任的范围，避免生产者、消费者以及受害人围绕复杂的学习算法是否存在进行证明、分析和论证，是在既有规则体系下保障实质正义的一项合理政策选择。


    #### （五）替代原因（suspending cause）切断因果关系的规则


    “深度学习算法”（deep learning algorthm）使得智能机器（人）基于数据和算法分析，感知外界环境并进行决策成为可能。具有自主学习能力的人工智能系统作出的决策或行为会随着环境的改变而发生变化，即出现人类设计者未能预见的情况。人类编程员设定的目的与智能机器努力的结果出现偏差。人工智能自主学习和适应环境的能力，使控制权问题变得扑朔迷离。机器决策或行为的可预见性和可控制性这一理论预设根基发生动摇。智能机器（人）行为的自主性增强，相应地，人类对智能机器（人）的控制力减弱。无论人类在人工智能研发、程序设计和制造的过程中如何小心谨慎都无法完全控制或预测具有自主学习能力的人工智能系统根据环境因素变化可能作出的决策或行为。基于学习算法的智能机器（人）自主决策和行为的介入作为替代原因切断了人类程序设计者或者智能机器（人）使用者与损害结果之间的因果关系。


    在何种条件下，智能机器（人）的自主决策和行为构成切断人类程序设计者或智能机器（人）使用者与损害结果之间因果关系的介入因素？“哈特和奥诺尔讨论法律中的因果关系时，对于人的行为是否构成介入（替代）原因这一问题所提出的主要判断标准即在于介入的行为是否体现了介入者的自由意志和自主选择。”^([\[179\]](#txt005.html#footnote_content_txt005_179))也就是说，以介入行为是否体现了介入者独立的自由意志为标准判断是否构成替代原因。介入行为体现介入者独立的自由意志构成介入原因；介入行为不体现介入者独立的自由意志则不构成介入原因。


    在机器意识尚未觉醒的技术条件下，人工智能尚不具有独立、自主的意识，智能机器（人）在交互环境中自主作出决策是人类设计者或制造者预先设计或追求的结果。智能机器（人）行为或决策的不确定性与不可预测性是设计者或制造者预先设计的结果。具体行为不可预测不同于风险不可预测。以数据和算法为基础的机器行为和决策仍然处于人类的控制之下。


    ## 第四节 人工智能时代民事法律责任的承担方式


    ### 一、民事法律责任承担方式的类型


    人工智能时代的民事法律责任承担方式大致可以分为两种类型：一种是以人类为联结点的民事法律责任承担方式；另一种是以智能机器（人）为联结点的民事责任承担方式。前者是传统法律体系规定的民事法律责任承担方式，侧重规制人类的行为，财产责任是救济的重心所在；后者是人工智能时代可能采用的新型民事法律责任承担方式，侧重规制智能机器（人）的“行为”，不限于财产责任。

