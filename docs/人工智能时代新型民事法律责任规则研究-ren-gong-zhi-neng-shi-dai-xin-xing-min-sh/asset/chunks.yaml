- raw: '“类人思维”维度的人工智能概念与“类人行为”维度的人工智能概念都是面向机器的，且以人类智能为基准，存在诸多共性。但是，二者也存在差别。“类人思维”维度的人工智能关注人造物的求解过程和推理轨迹，在认知、推理、求解过程中对比人造物和人的认知方式。与“类人行为”维度的人工智能相比较，“类人思维”维度的人工智能侧重认知而非行为，关注求解的过程而非结果。


    “类人行为”维度的人工智能概念描述行为一致性的直观现象，而“类人思维”维度的人工智能概念则揭示行为一致性的基础。“类人行为”维度的人工智能概念具有混沌性；而“类人思维”维度的人工智能概念具有明确的路径。“类人思维”是从认知科学的角度对“类人行为”进行解读的方案，“类人思维”维度的人工智能概念与“类人行为”维度的人工智能概念之间存在内在与外在、过程与结果的关系。


    （3）“理性思维”维度


    “查尼艾克（E.Charniak）和麦克德莫特提出人工智能是用计算机模型来研究智力能力，这是一种理性思维方法。一个系统如果能够在它所知范围内正确行事，它就是理性的。”^([\[30\]](#txt003.html#footnote_content_txt003_30))“理性思维”维度的人工智能概念关注人造物的智能思维，而非智能行为。这种智能思维以理性思维而非“人的思维”作为判断标准。一方面，它只截取“人的思维”中的理性部分，将非理性的思维排除在考察范围之外；另一方面，它不是对人的理性思维方式的直接模拟，而是通过符号进行逻辑运算推理求解。“理性思维”维度的人工智能的核心是符号化逻辑推理。将事物之间的关系通过符号表示，依据逻辑推理的基本法则进行运算。这种逻辑主义的方法可能会遭遇知识的有限性、知识难于符号化以及原则性解决与实际解决悬殊等难题。


    （4）“理性行为”维度


    人的思维包括理性思维和非理性思维，与此类似，人的行为包括理性行为和非理性行为。“理性行为”维度的人工智能关注人造物的智能行为。人造物是否智能的判断标准是其行为是否符合理性的要求，而非是否与人的行为相同或类似。理性思维是达致理性行为的一种方式，但是理性思维并不等同于理性行为。“在有些情景下，往往没有某个行为一定是正确的，而其他的是错误的，也就是说没有可以证明是正确的应该做的事情，但是还必须要做的某件事情。”^([\[31\]](#txt003.html#footnote_content_txt003_31))


    （5）以“类人智能”为中心界定人工智能概念面临的困境


    第一，人工智能超越人类智能的可能性。人工智能在未来是否会超越人类智能？该问题的答案取决于回答者对未来技术发展的认识。将人工智能定位为“人造物”，则人工智能是人类设计的产品，人类的认识水平和知识结构决定人工智能的智能化程度，人类智能是人工智能无法逾越的天花板。人工智能技术即便能在局部突破人类认知局限，但是无法从整体上全面超越。在“机器学习”概念产生之前的“编程”阶段，这一认识占据主导地位。但是，伴随“深度学习”“自主编程”等理论的出现，对人类智能与人工智能关系的认识发生转变。在科技革命日新月异的今天，对人工智能超越人类智能的预期增强。人类智能是人工智能的源头，却并非边界。有学者预言：“人工智能发展将会远远超过人类智慧的水平。”^([\[32\]](#txt003.html#footnote_content_txt003_32))总而言之，人类创造的类人智能经历了机械模拟、神经模拟、自主深度学习的过程；人工智能的认知以人类智能为原型，但不限于人类智能认知的水平和能力，具有超越人类智能的可能性。在人工智能模拟或效仿人类智能的假设下，以“类人智能”为中心界定人工智能的概念具有合理性；但在人工智能超越人类智能的假设下，人工智能作为新型智能形态已无法在人类智能的框架中寻求解释答案，再以人类智能为基础界定人工智能不具有合理性。


    第二，智能概念的模糊性。以“类人智能”为中心进行概念界定的基础是将人类智能作为智能的原型。智能曾经被认为专属于人类，拥有智能是人类区别并优越于其他物种的典型特征。智能概念的界定以人的特征为基础，即在抽象人类特征的基础上确定智能元素，进而判断计算机或程序是否具有智能属性。与智能相关的人类特征具有多重性，包括意识、自我意识、语言使用、学习能力、抽象能力、适应能力和推理能力。从不同的人类特征出发定义智能概念的结果迥异，以此作为判断人工智能的依据必然出现分歧和争议。


    第三，平行智能说对“类人智能”路径提出根本性挑战。该说认为，人类智能并非智能的原型，人工智能并不一定是对人类智能的模仿。“‘图灵测试’仅仅只是‘人工智能’概念的一部分，不模仿人类但同时也能完成相关行为的机器同样应被视为‘智能’的。”^([\[33\]](#txt003.html#footnote_content_txt003_33))


    ![](images/txt003_2.jpg "pagenumber_ebook=55,pagenumber_book=47")


    图2-1　以“类人智能”为中心的人工智能概念


    3.人工智能的概念体系：原生概念+衍生概念


    无论是在日常生活中还是在学术研究中，人工智能概念指向的对象与表述之间普遍存在一对多的现象。当人们运用人工智能概念讨论问题时，貌似一致的表述下隐藏着实质性差异。这就需要区分原生概念与衍生概念，避免概念之间的混淆和误用，防止人工智能概念的多层次性成为达成共识的隐形障碍。


    （1）原生概念：以智能形态为中心


    在智能形态层面，人工智能与人类智能相对应，是智能的下位概念。无论是模拟智能说还是平行智能说都不否认人工智能与人类智能之间的关联。人工智能以人类智能为基础或原型，是对人类感知、逻辑推理、思维、语言表达和情感等方面的模拟。它源于认知科学领域，是基于人类智能进行设计的结果。计算机是人工智能技术的必要载体或媒介，逻辑学、神经学等认知科学需要通过计算机模拟人类智能创造人工智能。人工智能描述的是一种观念性的存在（as
    a concept），也是一种有形技术（as a tangible technology）。通过技术路径实现的类人智能这一智能形态是本源意义上的人工智能概念。


    （2）衍生概念：赋值产生的差异性


    人们在使用人工智能概念时通常会结合语境潜意识地对其赋值，宽泛或笼统地以人工智能指代人工智能学科、人工智能技术、人工智能程序、人工智能设备、智能机器（人）的现象普遍存在，即以人工智能这一前缀代替具体语境下的词汇。换言之，无论是人工智能本身，还是人工智能衍生出的学科、产品都被含混地称为人工智能。


    （3）人工智能相关概念体系


    人们在智能形态、科学、技术以及产品等不同层面不加区分地使用人工智能的概念，会造成概念的滥用或误用。与人类智能相对应的人工智能首先体现在智能形态的层面，在科学研究的层面衍生出人工智能科学的概念，在开发的层面衍生出人工智能技术的概念，在应用的层面衍生出人工智能产品或人工智能体的概念，在外观层面衍生出人工智能机器人的概念等。


    ![](images/txt003_3.jpg "pagenumber_ebook=56,pagenumber_book=48")


    图2-2　人工智能的概念体系


    （二）人工智能相关概念辨析


    1.人工智能与智能机器（人）：内核与载体


    大众在谈及人工智能时脑海里自然而然地会浮现出“机器人”或“智能机器人”的画面。“人造人”承载了大众对人工智能直观、朴素的想象和认知。关于“人造人”的创造经历了从想象到现实，从形似到神似，从机械化到智能化的过程。


    工业革命之前，草木、皮革等是“人造人”的主要素材。《列子·汤问》描述了偃师向周穆王献艺而几乎被杀的场景，其“罪魁祸首”是偃师制造的足以以假乱真的“人造人”。《乐府杂论》记载了刘邦用美人木偶在城楼上表演从而脱困的故事。17
    世纪初，基于想象的“机械人”（automation）一词出现，指称借助齿轮技术创造的自动机械木偶。这些“人造人”徒有人形，并无智能可言，赋予其智能的主体是不可言喻的外在力量。


    工业革命开启了机械化时代，人类对“人造人”的思考不再停留在人之外形的层面，而深入到人之本质。人类试图寻求机器与人以及人类社会的共同之处，通过机器模拟或再造人或人类社会。关于机器与人以及人类社会的共性的分析主要包括以下面向：①将人视为复杂的机器。拉·梅特里（La
    Mettrie）认为人是机器，“人的身体是一架钟表，不过这是一架巨大的、极其精细、极其巧妙的钟表”^([\[34\]](#txt003.html#footnote_content_txt003_34))。②从机器视角解读国家，理解国家整体与局部的关系。霍布斯在《论公民》一书的“前言”中将国家和社会视为类似于机器的存在，他认为：“对于钟表或相当复杂的装置，除非将它拆开，分别研究其部件的材料、形状和运动，不然就无从知晓每个部件和齿轮的作用。同样，在研究国家的权利和公民的义务时，虽然不能将国家拆散，但也要分别考察它的成分，要正确地理解人性，它的哪些特点适合、哪些特点不适合建立国家，以及谋求共同发展的人必须怎样结合在一起。”^([\[35\]](#txt003.html#footnote_content_txt003_35))也就是说，人体、国家和社会都可以做类似于机器的解构，存在相通之处。


    既然机器与人存在共性，用机器零件替代人体的组成部分以及构造类似人体的机器成为可能。人体与机器零件之间被假定为存在一定的对应关系，机器零件的组合可以发挥与人体器官类似的功能。相较于工业革命前，人类对“人造人”的认识已经从外观论转向功能论。人们相信无论是人的身体还是大脑都可以通过机械组合的方式进行模拟和替代。工业时代的机器取代了部分人的体力劳动。“1920
    年，捷克作家卡雷尔·卡佩克（Karel apek）创作了《罗素姆的万能机器人》（Rossumovi univerzálníroboti）剧本，发明了如今通用的Robot（机器人）这个词汇，它的辞源是波兰语中的强迫劳动（Robota）和工人（Robotnik）。”^([\[36\]](#txt003.html#footnote_content_txt003_36))与此相对应，智能机器（人）则取代部分人的脑力劳动，如图灵设计了用于破解密码的智能机器“Bombe”。


    智能机器（人）是机器工业发展到智能化的高级阶段的产物，是人工智能技术应用的结果。“人工智能是技术，技术必须通过一定载体进行运用，才能展示和体现其具体内容，当然在运用过程中也会致人损害。”^([\[37\]](#txt003.html#footnote_content_txt003_37))有形的机器（人）是人工智能的载体和外在体现，无形的“合成智能”才是人工智能的核心。“格里申法案提出了一个过渡性的机器人定义，作为法律调整的对象要素，即‘机器人——在没有人类一方完全控制的情况下依靠从外部环境获取的信息而能够行动、决定自己的行为并评估其后果的装置’（法案第3条）。”^([\[38\]](#txt003.html#footnote_content_txt003_38))


    2.智能机器人与智能机器或人工智能系统：拟人方式的嬗变


    “机器人是指由仿生元件组成并具备运动特性的机电设备，它具有操作物体以及感知周围环境的能力。”^([\[39\]](#txt003.html#footnote_content_txt003_39))根据机器人应用领域的不同，可以将其分为工业机器人和服务机器人两种类型。20
    世纪中叶，美国生产出全世界第一个工业机器人。服务机器人则直到20 世纪90 年代才出现。


    （1）具象化拟人：基于碳基生命的想象


    基于碳基生命的想象，智能专属于人类，生理意义上的人是智能机器人的原型和模仿对象。智能机器人在外观和内在两个方面均以生理意义上的人为参照，智能化被视为机器向人无限趋同的过程。“现有的法律模式没有摆脱传统的具象化乃至拟人化思维方式，仅仅将有形的智能化机器或‘机器人’纳入规制范围。”^([\[40\]](#txt003.html#footnote_content_txt003_40))


    人形机器是机器具象化拟人的直观体现。“在孔德的时代，英文中又出现了Android（人形机器）一词，其词根是古希腊文中的andro（人）和eides（形状）。”^([\[41\]](#txt003.html#footnote_content_txt003_41))当然，具象化拟人并不限于人的外貌，还包括人的声音、行为举止等。人形机器外观论对社会生活的影响深远。“类人形的陪伴型机器人享受权利，人类可能容易接受；而动物形状的陪伴机器人享受权利可能就难以接受了”^([\[42\]](#txt003.html#footnote_content_txt003_42))。


    内心拟人化试图让人工智能拥有与人类相似的心理世界，包括欲望、情感、道德感以及价值观之类，因而具有“人性”。^([\[43\]](#txt003.html#footnote_content_txt003_43))人类期待与其具有类似或同等智能的类存在、出现并和谐共处，是源于作为单一智能主体内心的孤寂。基于人性本善构想的人类与智能机器人和谐共处的童话世界，忽略了人性中恶的因素。“殊不知越有人性的人工智能就越危险，因为人性才是危险的根源。”^([\[44\]](#txt003.html#footnote_content_txt003_44))《异行》中的“阿什”、《七龙珠》中的“人造人17
    号”和“人造人18 号”等影视作品中的邪恶形象预示着内心拟人化的智能机器（人）可能带来的灾难。


    （2）抽象化拟人：基于硅基生命的想象


    在美国科幻影片《她》中，作家爱上的“萨曼莎”（Samantha）是以代码形式存在于网络中的人工智能操作系统，并无有形的实体。“如果只保护了类人形的辅助机器人，而不保护这些没有实体的人工智能系统，那人类只是在保护自己对这个机器人的财产所有权，而非对于一个不一样的智能物种的尊重和保护。”^([\[45\]](#txt003.html#footnote_content_txt003_45))


    人形机器是人类将自身影像投射于智能机器的结果，这种基于碳基生命的想象更多来自人类的一厢情愿，主要体现在影视作品、文学作品、漫画和游戏中，并非技术发展的必然。“硅基生命没有必要模仿碳基生命的形态，只需要在功能上超越人类。”^([\[46\]](#txt003.html#footnote_content_txt003_46))智能技术进步使得人们将关注重心越来越多地放在智能内核而非人形外形上。关于智能机器的人形假设淡化，功能论或主体意识论取代外观论。人工智能技术已经超越了简单模拟人类外形和内心的阶段，“不再局限于创造一个拥有人脑效果的完美机器人”^([\[47\]](#txt003.html#footnote_content_txt003_47))。


    国际标准化组织关于工业机器人的定义、国际机器人联合会（International Fedaration Robotics）关于服务机器人的定义以及我国关于智能服务机器人的定义都没有包含人形外观的要件。^([\[48\]](#txt003.html#footnote_content_txt003_48))司晓博士参照欧盟法律事务委员会关于智能机器人的定义，将智能机器人界定为具有以下特征的实体：①通过传感器、与其环境进行数据交换以及数据分析等方式获得自主性的能力；②从经历和交互中学习的能力；③具有可见形体；④随环境而调整其行为和行动的能力。^([\[49\]](#txt003.html#footnote_content_txt003_49))这一关于智能机器人的定义中以“可见形体”为要件，至于该形体是否为人形并非所问。


    总而言之，智能机器人有广义和狭义之分。广义的智能机器人不以人形外观为必要，具备智能化特征的机器都可被称为智能机器人。智能机器人与智能机器、有形的人工智能系统或设备概念同一。狭义的智能机器人概念以人形外观为必要，不具有人形外观的智能机器或设备被排除在智能机器人之外。比较而言，广义的智能机器人概念符合社会和科技发展的需要，容易在专业领域得到认同；狭义的智能机器人概念符合社会大众的认知，容易获得情感上的认同。考虑到概念的明确性以及目前法律体系中概念使用的习惯，本书采用狭义的智能机器人的概念，区分具有人形外观的智能机器人和不具有人形外观的智能机器或设备。


    三、弱人工智能与强人工智能


    强人工智能和弱人工智能以模糊的形容词作为定语划分人工智能的等级以及人工智能时代的发展阶段。这一做法不被人工智能专业技术人员和研究者认可，他们习惯用图灵机和超图灵机的概念对人工智能的等级或发展阶段进行区分。“图灵机即机械算法机，逻辑—数学运算加上大数据资源，具有在有限步骤内完成一项能行构造（feasible
    construction）或者说一项运算任务的能力，但是它没有反思并且修改自身系统的功能，所以没有自我意识，只知道如何完成一项任务，却不知道其所以然，也不知道为什么要做这样的任务。”^([\[50\]](#txt003.html#footnote_content_txt003_50))超图灵机是指突破图灵机固有局限的人工智能。“超图灵机必须是一个达到自觉意识的全能系统，具有自我意识和自由意志，具有把自身系统对象化的反思能力，以及修改自身程序的能力和独立发明新语言、新规则、新程序的创造力。”^([\[51\]](#txt003.html#footnote_content_txt003_51))


    （一）关于强人工智能的认识分歧：想象力匮乏vs.天方夜谈


    强人工智能是人类基于人工智能技术应用的现状及趋势对未来技术发展的想象，并非严密逻辑论证的结果。计算机能够模拟人类的认知行为，展现智能外观，对此学者并无分歧。但是，关于计算机在智能建构方面扮演的角色乃至计算机与人类心灵之间关系的解读存在差异。人工智能是否会升级到强人工智能阶段的答案不尽一致。肯定说认为否定人工智能会升级到强人工智能阶段的观点缺乏想象力和创新精神，低估了计算机科学未来发展的潜力，是狭隘的人类中心主义固步自封的结果；而否定说认为肯定人工智能会升级到强人工智能阶段的观点纯粹是异想天开或杞人忧天，缺乏科学依据，混淆了科幻与现实的关系。


    1.否定说'
  fmt: '

    ## “类人思维”与“类人行为”维度


    “类人思维”维度的人工智能概念与“类人行为”维度的人工智能概念都是面向机器的，且以人类智能为基准，存在诸多共性。但是，二者也存在差别。“类人思维”维度的人工智能关注人造物的求解过程和推理轨迹，在认知、推理、求解过程中对比人造物和人的认知方式。与“类人行为”维度的人工智能相比较，“类人思维”维度的人工智能侧重认知而非行为，关注求解的过程而非结果。


    “类人行为”维度的人工智能概念描述行为一致性的直观现象，而“类人思维”维度的人工智能概念则揭示行为一致性的基础。“类人行为”维度的人工智能概念具有混沌性；而“类人思维”维度的人工智能概念具有明确的路径。“类人思维”是从认知科学的角度对“类人行为”进行解读的方案，“类人思维”维度的人工智能概念与“类人行为”维度的人工智能概念之间存在内在与外在、过程与结果的关系。


    ### （3）“理性思维”维度


    “查尼艾克（E.Charniak）和麦克德莫特提出人工智能是用计算机模型来研究智力能力，这是一种理性思维方法。一个系统如果能够在它所知范围内正确行事，它就是理性的。”^([\[30\]](#txt003.html#footnote_content_txt003_30))“理性思维”维度的人工智能概念关注人造物的智能思维，而非智能行为。这种智能思维以理性思维而非“人的思维”作为判断标准。一方面，它只截取“人的思维”中的理性部分，将非理性的思维排除在考察范围之外；另一方面，它不是对人的理性思维方式的直接模拟，而是通过符号进行逻辑运算推理求解。“理性思维”维度的人工智能的核心是符号化逻辑推理。将事物之间的关系通过符号表示，依据逻辑推理的基本法则进行运算。这种逻辑主义的方法可能会遭遇知识的有限性、知识难于符号化以及原则性解决与实际解决悬殊等难题。


    ### （4）“理性行为”维度


    人的思维包括理性思维和非理性思维，与此类似，人的行为包括理性行为和非理性行为。“理性行为”维度的人工智能关注人造物的智能行为。人造物是否智能的判断标准是其行为是否符合理性的要求，而非是否与人的行为相同或类似。理性思维是达致理性行为的一种方式，但是理性思维并不等同于理性行为。“在有些情景下，往往没有某个行为一定是正确的，而其他的是错误的，也就是说没有可以证明是正确的应该做的事情，但是还必须要做的某件事情。”^([\[31\]](#txt003.html#footnote_content_txt003_31))


    ### （5）以“类人智能”为中心界定人工智能概念面临的困境


    第一，人工智能超越人类智能的可能性。人工智能在未来是否会超越人类智能？该问题的答案取决于回答者对未来技术发展的认识。将人工智能定位为“人造物”，则人工智能是人类设计的产品，人类的认识水平和知识结构决定人工智能的智能化程度，人类智能是人工智能无法逾越的天花板。人工智能技术即便能在局部突破人类认知局限，但是无法从整体上全面超越。在“机器学习”概念产生之前的“编程”阶段，这一认识占据主导地位。但是，伴随“深度学习”“自主编程”等理论的出现，对人类智能与人工智能关系的认识发生转变。在科技革命日新月异的今天，对人工智能超越人类智能的预期增强。人类智能是人工智能的源头，却并非边界。有学者预言：“人工智能发展将会远远超过人类智慧的水平。”^([\[32\]](#txt003.html#footnote_content_txt003_32))总而言之，人类创造的类人智能经历了机械模拟、神经模拟、自主深度学习的过程；人工智能的认知以人类智能为原型，但不限于人类智能认知的水平和能力，具有超越人类智能的可能性。在人工智能模拟或效仿人类智能的假设下，以“类人智能”为中心界定人工智能的概念具有合理性；但在人工智能超越人类智能的假设下，人工智能作为新型智能形态已无法在人类智能的框架中寻求解释答案，再以人类智能为基础界定人工智能不具有合理性。


    第二，智能概念的模糊性。以“类人智能”为中心进行概念界定的基础是将人类智能作为智能的原型。智能曾经被认为专属于人类，拥有智能是人类区别并优越于其他物种的典型特征。智能概念的界定以人的特征为基础，即在抽象人类特征的基础上确定智能元素，进而判断计算机或程序是否具有智能属性。与智能相关的人类特征具有多重性，包括意识、自我意识、语言使用、学习能力、抽象能力、适应能力和推理能力。从不同的人类特征出发定义智能概念的结果迥异，以此作为判断人工智能的依据必然出现分歧和争议。


    第三，平行智能说对“类人智能”路径提出根本性挑战。该说认为，人类智能并非智能的原型，人工智能并不一定是对人类智能的模仿。“‘图灵测试’仅仅只是‘人工智能’概念的一部分，不模仿人类但同时也能完成相关行为的机器同样应被视为‘智能’的。”^([\[33\]](#txt003.html#footnote_content_txt003_33))


