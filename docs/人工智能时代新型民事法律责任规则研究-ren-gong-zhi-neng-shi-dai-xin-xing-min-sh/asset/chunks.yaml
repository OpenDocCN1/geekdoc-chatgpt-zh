    [\[21\]](#txt004.html#footnote_quote_txt004_21)赵汀阳：“人工智能‘革命’的‘近忧’和‘远虑’——一种伦理学和存在论的分析”，载《哲学动态》2018
    年第4 期。


    [\[22\]](#txt004.html#footnote_quote_txt004_22)张玉洁：“论人工智能时代的机器人权利及其风险规制”，载《东方法学》2017
    年第6 期。

