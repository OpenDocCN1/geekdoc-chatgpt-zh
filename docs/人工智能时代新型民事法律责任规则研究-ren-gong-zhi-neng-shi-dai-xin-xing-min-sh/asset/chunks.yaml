- raw: '神经网络模型以神经科学认知为前提，基于神经科学的联结主义将计算机信息处理与人脑神经系统结合。它通过类比计算机系统与人脑神经，将计算机系统作为大脑建模的媒介，模拟人的大脑结构以及神经元交互方式来设计智能系统。“智能的神经模型强调大脑由调整各个神经元间的关系适应所处世界的能力。不是按显式逻辑句子表示知识，它们作为各种关系模式的性质隐式捕捉知识。”^([\[21\]](#txt002.html#footnote_content_txt002_21))


    20 世纪70 年代，人工神经网络的研究陷入低谷。20 世纪80 年代，人工神经网络理论出现新进展。1982 年，美国物理学家霍普菲尔特（Hopfield）将统计力学方法引入人工神经网络存储与优化，提出离散的神经网络模型。1984
    年，他又提出了连续神经网络模型。1985 年，鲁梅尔哈特（Rumelhart）、辛顿等学者实现了使用“后向传播”BP 算法训练神经网络。1987 年，第一届人工神经网络国际会议在美国召开，国际神经网络学会（INNS）成立。1995
    年，延恩·勒昆（Yann LeCun）等人在生物视觉模型的启发下，改进卷积神经网络（convolution neural network），模拟视觉皮层中的细胞，进行图像分类，在手写识别上取得进展。


    （三）基于智能体（agent）的分布式人工智能


    20 世纪90 年代前后，人工智能研发人员就人工智能的理论和技术困局进行全面反思，批判还原论，重新构建人工智能基本理论，调整对人工智能的期许，放弃不切实际的幻想。其中一个显著的变化是人工智能研究从客体转向主体。“主体概念的回归并不单单是因为人们认识到了应该把人工智能各个领域的研究成果集成为一个具有智能行为概念的‘人’，更重要的原因是人们认识到了人类智能的本质是一种社会性的智能。”^([\[22\]](#txt002.html#footnote_content_txt002_22))


    社会性智能强调智能的社会属性和文化属性，将智能视为体现在智能个体或集体行为中交互作用的结果。社会性智能的基本构成是“智能体”或“智能主体”（agent）。智能体具有一定的自主性，在特定情境中与其他智能体交互作用，直接或间接影响环境。人类活动往往是由地理位置上分散的多人共同参与完成的，与此类似，在分布式人工智能中，地理位置上分散的多个智能体共享信息，在合作或竞争的情况下工作。单个智能体预测整体状况以便局部决策，求解子问题，进而将结果传递给其他智能体。


    四、飞速发展期：多元范式


    人工智能研究经历了从逻辑到经验、从符号化推理到知识工程的转变，但是这并不意味着传统研究范式彻底退出舞台。唯理主义的研究范式与经验主义的研究范式处于此消彼长的共存状态。“没有一种‘假说’在经过选择后被全面地批判、推翻及取代，也没有一种‘假说’或‘范式’能够一统AI领域。”^([\[23\]](#txt002.html#footnote_content_txt002_23))21
    世纪，互联网技术的深层革命，引发了传统研究范式升级、拓展和转型，出现“感知中心AI 范式”“数据中心AI 范式”“人脑科学AI 范式”“认知计算AI 范式”等多元范式并存的现象，人工智能进入飞速发展时期。


    （一）2000 年至2010 年


    2001 年，机器人足球梦想实现。国际象棋方面，IBM 超级计算机“深蓝”（deep blue）战胜世界冠军卡斯帕罗夫（Gary Kasparov），计算机“深弗里茨”（Deep
    Fritz）战胜克拉姆尼克（Vladimir Kramnik）。2007 年12 月《科学》杂志报道，计算机已经掌握了决胜跳棋的技巧，在人类和计算机均不出错的对弈中，和局是人类最好的战绩。


    深度学习（deep learning）的诞生是这一时期人工智能研究范式转型的标志性事件。计算机运算力增强、大数据积累以及互联网大规模服务集群出现为深度学习的研发和应用创造了条件。2006
    年，深度学习的理论框架得以验证。2009 年，微软研究院与杰弗里·辛顿（Geoffrey Hinton）共同研发基于深度神经网络的语音识别系统。2010 年，深度学习在语音识别和自然语言处理等领域取得突破性进展。


    虽然在这一时期人工智能技术取得了飞跃发展，但是对人类智能的自信并未遭遇严重冲击。“人工智能尽管能战胜国际象棋冠军，但下围棋时无能为力；虽然能读文章，但创作时十分吃力；已经进行一定程度的学习，但没有通用的应用方式，不能识别任意角度的对象，不能在摔跤时捡起有用的东西……甚至还不具备人类的一些简单的思维功能，如婴儿的形象思维能力。”^([\[24\]](#txt002.html#footnote_content_txt002_24))


    （二）2010 年至2015 年


    2010 年以来，在大数据、机器学习以及超级计算机这三个相互加强的因素的推动下，人工智能迎来新一轮发展浪潮，开始突飞猛进，相关创业、投资和并购力度得到显著加强。^([\[25\]](#txt002.html#footnote_content_txt002_25))2010
    年，麻省理工学院（Massachusetts Institute of Technology）创造出情绪机器人“好运”（Kismet）。2011 年2 月，IBM
    超级计算机“沃森”（Watson）在智力竞猜节目《幸运大冒险（Jeopardy！）》以1对2 的方式战胜两位传奇冠军。2011 年，智能语音软件“希瑞”（Siri）出现。2012
    年，辛顿（Geoffrey Hinton）在图像数据分类方面取得突破性进展。以人工智能技术和产业为中心的变革成为全球经济的新增长点，各国纷纷从战略视角对人工智能未来发展进行顶层设计，力图抢占技术高地。


    （三）2016 年至今


    近年来，人工智能技术的研发与应用、观念的更新以及对技术边界的认识可谓日新月异。


    1.人工智能科技研发与应用并重，应用场景普遍化


    人工智能广阔的商业应用前景激起了大量私人企业的投资兴趣。科技巨头，如苹果（Apple）、谷歌（Google）、脸书（Facebook）、亚马逊（Amazon）和百度（Baidu）等纷纷进军人工智能领域，建立人工智能实验室或购买人工智能初创企业，如“谷歌AI
    实验室”“微软研究院”“IBM 研究院”“Facebook人工智能研究实验室”“腾讯AI Lab”“硅谷AI Lab”。人工智能不再停留在研发层面而转向应用，其应用场景迅速拓展，在公众视野中出现的频次增加，深度影响社会生活。


    2.人类对人工智能认识的局限不断突破


    人类在围棋方面的优势曾是人类自信心的源头之一。人类曾骄傲地认为：“好的棋手可以只用几秒钟就凭直觉决定下一步如何走，他可用尝试排除某些走法。这里需要概括抽象、总揽全局、直观判断能力，仅有规则是不够的。”^([\[26\]](#txt002.html#footnote_content_txt002_26))但是2016
    年年初，人类的这一自信遭遇毁灭性冲击，AlphaGo 以绝对优势战胜了围棋九段高手李世石。


    3.开始探索强人工智能


    伴随现代计算机计算能力增强、算法改进，人类不再满足于研发作为工具和手段的人工智能，开始探索超越人类智能的强人工智能，试图将影视和文学作品中的想象变为现实。


    第二节　人工智能技术的主要应用场景


    一、智能驾驶


    智能驾驶，又称无人驾驶（driverless）或自动驾驶，分为智能驾驶汽车和智能驾驶飞行器等。它“通过导航系统、传感器系统、智能感知算法、车辆控制系统等智能技术，实现了‘人工智能+无人驾驶’，颠覆了以往的人车关系、车车关系”^([\[27\]](#txt002.html#footnote_content_txt002_27))。驾驶权由人类驾驶员转移至智能驾驶系统，使得人类驾驶行为逐渐从日常生活所需转变为娱乐体验。


    （一）智能驾驶汽车


    智能汽车，又称无人驾驶汽车、自动驾驶汽车或智能网联汽车，是指智能驾驶系统全部或部分取代人类驾驶员的角色，实现智能驾驶的新型汽车。^([\[28\]](#txt002.html#footnote_content_txt002_28))它是“站在四个轮子上的机器人”^([\[29\]](#txt002.html#footnote_content_txt002_29))。智能汽车在降低交通事故发生率、缓解交通拥堵、便利特殊群体出行、降低能耗、减少空气污染、优化城乡布局等方面具有优势。但是，它在产生显著社会效用的同时，也可能带来失业、网络安全隐患等新型社会问题。^([\[30\]](#txt002.html#footnote_content_txt002_30))


    1977 年，现代意义上的智能汽车诞生。伴随工艺改进，智能汽车逐渐适应在复杂路况（如城市、沙漠）安全行驶。目前，谷歌、优步（Uber）、来福车（Lyft）、世联互动（Naver）等已经取得或完成了相应的路测许可。掌握智能驾驶核心技术的科技型创业公司成为并购市场关注的焦点。阿联酋副总统阿勒马克图姆（AL
    Maktoum）发起“迪拜智能驾驶行动战略”。2018 年2 月28 日，迪拜公路和运输管理局（RTA）投入使用无人驾驶出租车——“自动豆荚”。在我国，以物联网为基础的智慧交通自2016
    年以来备受国家和社会关注。北京、上海、河北、吉林、湖北、重庆、浙江、江苏等地纷纷开展智慧交通应用试点和示范工作。


    （二）智能驾驶飞行器


    智能驾驶飞行器，又称无人驾驶飞行器（unmanned aerial verical）或无人机。它“是利用无线电遥控设备和自备的程序控制装置的不载人飞行器，包括无人直升机、固定翼机、多旋翼飞行器、无人飞艇、无人伞翼机”^([\[31\]](#txt002.html#footnote_content_txt002_31))。


    继智能驾驶汽车兴起之后，智能驾驶飞行器也进入人们的生活领域。它在真人秀航拍、农业数据监控、灾害救援、人工降雨、森林防火、测绘、物流、保安等领域有着广阔的应用前景。早在2013
    年，亚马逊公司便尝试利用无人飞行器派送包裹。“据美国蒂尔集团的预测，全球无人飞行器的市场规模将由2015 年的64 亿美元增至2024 年的115 亿美元，累计市场总规模超过891
    亿美元。到2024 年，全球民用无人飞行器的市场份额将增加至12%，达到16 亿美元。”^([\[32\]](#txt002.html#footnote_content_txt002_32))此外，智能驾驶飞行器在军事领域的潜在价值被发现，在未来可能成为主流军用飞行器。


    二、智能投资顾问


    智能投资顾问，又称机器人投顾（robot-adviser）、自动化顾问工具（au⁃tomated advice tools）、自动化投资工具（automated
    investment tools）、自动化投资平台（automated investment platform），是财务顾问（financial adviser）的下位概念，是指以算法和模型为基础的智能投资顾问系统自主为客户进行资产配置、管理和优化服务。智能投资顾问模式产生于2008
    年，是人工智能在金融行业的应用，是“人工智能”+“金融服务”的产物。


    三、智能创作


    人工智能在文学艺术作品创作（如写作新闻稿、谱曲、绘画）过程中的自主性越来越强，在独创性方面的贡献可以与人类相媲美甚至超越人类。应用于新闻领域的人工智能被称为“不眠的新闻工作者”。英美传媒巨头使用人工智能大规模写作新闻稿。^([\[33\]](#txt002.html#footnote_content_txt002_33))腾讯公司利用科技机器人Dreamwriter
    批量自动撰写财经新闻。微软公司发布了“微软小冰”创作的现代诗集《阳光失去了玻璃》。“清华大学的语音和语言实验中心（CSLT）在其网站上宣布他们的写诗机器人‘薇薇’经过社科院等唐诗专家的评定。”^([\[34\]](#txt002.html#footnote_content_txt002_34))人工智能生成的美术作品具备了人类美术作品的艺术性，在画廊或美术博物馆被展出。^([\[35\]](#txt002.html#footnote_content_txt002_35))索尼计算机科学实验室的人工智能程序“FlowMachines”创作出歌曲“Daddy''s
    Car”。由1600 名专业音乐人组成的听众团中一半以上的听众误认为盖唐·哈杰里斯（Gaetan Hadjeres）与弗朗索瓦·帕切特（Francois Pachet）设计的人工智能系统谱写的音乐作品是巴赫（Bach）的作品。


    四、智能诊疗


    智能诊疗是指智能计算机模拟医生的思维进行医疗诊断，提供诊疗以及健康管理方案。智能诊疗能够缓解目前医疗资源稀缺、价格高昂、分配不均匀等弊端，满足人民群众对健康的需要。“MYCIN”是国外最早出现的智能诊疗专家系统。国际商业机器公司（IBM）开发的智能诊疗系统Watson
    于2012年通过了美国职业医师资格考试，并在多家医院辅助诊疗，为包括多种癌症在内的病种患者提供诊疗服务。“纳米科技医疗机器人将在病人的血液中穿行并进入肿瘤，通过驱除一种重要的癌症基因来进行治疗。”^([\[36\]](#txt002.html#footnote_content_txt002_36))


    五、智能家居


    智能家居产品包括智能电视、智能空调、智能洗衣机、智能冰箱等。苹果公司推出了“Apple HomeKit”，亚马逊推出了智能蓝牙喇叭“Echo”，谷歌推出了智能音箱“Google-Home”，微软推出了智能家庭中枢“Home-Hub”，美的推出“U+智慧生活开放平台”，海尔推出了“U-Home”，腾讯推出了企鹅智慧社区“SaaS
    系统”，华为推出了智慧家庭解决方案“OpenLife”，脸书推出了人工智能管家“Jarvis”。


    六、法律人工智能


    法律人工智能是人工智能技术在法律领域的应用，它是指运用人工智能技术进行法律信息处理、文本解析或论证挖掘，自主生成法律意见或建议、裁判文书、检察文书等。传统法学教育和法律职业对科技具有较强的免疫力。无论是在大陆法系以法教义学为基础的教学方式还是在英美法系的苏格拉底式教学方式下，科技的参与度均十分有限。科技在法律概念界定与分析、裁判观念形成、法律文书写作等活动中主要起辅助办公的作用，并未对传统法学教育和法律职业造成实质影响。人工智能时代科技与法律的融合在广度和深度上达到前所未有的程度，带来了阵痛。法律行业从人员密集型转向技术密集型，科技正在并将继续深入改变法律行业的运行模式。已有律所运用智能机器（人）起草合同文本、提供法律咨询和预测裁判结果，智慧法院、智慧检察院的建设也在探索之中。牛津大学2016
    年报告“工作中的技术V.2.0：未来不再是过去的样子”（Technology at Work V.2.0：The Future Is Not What It
    Used to Be）对人类未来的工作状态持悲观态度，它预测大量工作岗位尤其是白领工作岗位将被人工智能占据。我国《新一代人工智能发展规划》明确提出要培养“人工智能+”法律的复合型人才。


    第三节　人工智能时代风险的特征及规制路径


    人工智能开启了人类社会的潘多拉魔盒，它在减轻人类体力劳动和脑力劳动负担的同时也带来了相应的风险。智能主体多元化使得人类面临人工智能科技独有的挑战和后工业科技（post
    industrial technology）的共性挑战，社会风险显现出前所未有的不确定性和不可逆转性。这就需要从技术、伦理和法律等层面对人工智能时代的风险进行综合规制。


    一、人工智能时代风险的特征


    风险状态是人类社会的常态，人类社会总是会面临不同类型的风险。在社会发展进步的过程中，风险客观存在，机遇与风险并存。避免风险造成损失或灾难并不意味着需要消除一切风险。部分风险是社会所允许甚至欢迎的。乌尔里希·贝克在《风险社会》一书中指出，伴随现代技术发展，风险社会的核心由财富分配转向风险分配。^([\[37\]](#txt002.html#footnote_content_txt002_37))“我们在支持科学创新或者其他种类的变革中，可能应该表现得更为积极些，而不能过于谨慎。毕竟，‘风险’一词的词根在古葡萄牙语中的意思是‘敢于’。”^([\[38\]](#txt002.html#footnote_content_txt002_38))人工智能的自主性、技术性和不确定性使得人工智能时代的风险具有技术性、公共性、结构性和不可逆转性等特征。


    （一）人工智能时代风险的技术性


    人类在享受科技进步成果的同时，也营造了“技术知识的囚室”^([\[39\]](#txt002.html#footnote_content_txt002_39))，制造了新型社会风险。它是计算机科学、认知科学发展与进步的结果，是人类文明产生的技术性风险。人工智能时代的社会风险根源于智能技术的变革，主要表现为因技术创新、失误、故障或滥用而导致的风险。具体而言，主要包括以下技术风险：①数据匿名化和反匿名化技术产生的信息泄露风险。②基于数据分析进行行为预测而产生的隐私风险和安全风险。③因算法黑箱导致算法歧视、责任主体隐形化的风险。④算法合谋导致的市场风险。⑤黑客入侵产生的安全风险。


    技术革命引发的社会风险被深深地打上技术的烙印，使得人工智能时代识别、预防、控制、消除风险的难度增加，该技术性特征是新型社会风险其他特征产生的基础。为化解人工智能时代的社会风险而设计民事法律责任规则体系不能忽视技术的作用。当智能机器导致损失时如何确定过错以及因果关系、责任承担与人工智能技术研发与应用的关系如何、民事法律责任规则的功能如何定位等问题的解决不能单纯依靠价值分析，须经由技术路径实现。“法治管理需要嵌入生产环节，比如对算法处理的数据或生产性资源进行管理，防止造成消极后果。”^([\[40\]](#txt002.html#footnote_content_txt002_40))


    （二）人工智能时代风险源头的分散性与隐蔽性'
  fmt: '

    神经网络模型以神经科学认知为前提，基于神经科学的联结主义将计算机信息处理与人脑神经系统结合。它通过类比计算机系统与人脑神经，将计算机系统作为大脑建模的媒介，模拟人的大脑结构以及神经元交互方式来设计智能系统。“智能的神经模型强调大脑由调整各个神经元间的关系适应所处世界的能力。不是按显式逻辑句子表示知识，它们作为各种关系模式的性质隐式捕捉知识。”^([\[21\]](#txt002.html#footnote_content_txt002_21))


    20 世纪70 年代，人工神经网络的研究陷入低谷。20 世纪80 年代，人工神经网络理论出现新进展。1982 年，美国物理学家霍普菲尔特（Hopfield）将统计力学方法引入人工神经网络存储与优化，提出离散的神经网络模型。1984
    年，他又提出了连续神经网络模型。1985 年，鲁梅尔哈特（Rumelhart）、辛顿等学者实现了使用“后向传播”`BP`算法训练神经网络。1987 年，第一届人工神经网络国际会议在美国召开，国际神经网络学会（`INNS`）成立。1995
    年，延恩·勒昆（Yann LeCun）等人在生物视觉模型的启发下，改进卷积神经网络（`convolution neural network`），模拟视觉皮层中的细胞，进行图像分类，在手写识别上取得进展。


    ## （三）基于智能体（`agent`）的分布式人工智能


    20 世纪90 年代前后，人工智能研发人员就人工智能的理论和技术困局进行全面反思，批判还原论，重新构建人工智能基本理论，调整对人工智能的期许，放弃不切实际的幻想。其中一个显著的变化是人工智能研究从客体转向主体。“主体概念的回归并不单单是因为人们认识到了应该把人工智能各个领域的研究成果集成为一个具有智能行为概念的‘人’，更重要的原因是人们认识到了人类智能的本质是一种社会性的智能。”^([\[22\]](#txt002.html#footnote_content_txt002_22))


    社会性智能强调智能的社会属性和文化属性，将智能视为体现在智能个体或集体行为中交互作用的结果。社会性智能的基本构成是“智能体”或“智能主体”（`agent`）。智能体具有一定的自主性，在特定情境中与其他智能体交互作用，直接或间接影响环境。人类活动往往是由地理位置上分散的多人共同参与完成的，与此类似，在分布式人工智能中，地理位置上分散的多个智能体共享信息，在合作或竞争的情况下工作。单个智能体预测整体状况以便局部决策，求解子问题，进而将结果传递给其他智能体。


    # 四、飞速发展期：多元范式


    人工智能研究经历了从逻辑到经验、从符号化推理到知识工程的转变，但是这并不意味着传统研究范式彻底退出舞台。唯理主义的研究范式与经验主义的研究范式处于此消彼长的共存状态。“没有一种‘假说’在经过选择后被全面地批判、推翻及取代，也没有一种‘假说’或‘范式’能够一统AI领域。”^([\[23\]](#txt002.html#footnote_content_txt002_23))21
    世纪，互联网技术的深层革命，引发了传统研究范式升级、拓展和转型，出现“感知中心AI 范式”“数据中心AI 范式”“人脑科学AI 范式”“认知计算AI 范式”等多元范式并存的现象，人工智能进入飞速发展时期。


    ## （一）2000 年至2010 年


    2001 年，机器人足球梦想实现。国际象棋方面，IBM 超级计算机“深蓝”（`deep blue`）战胜世界冠军卡斯帕罗夫（Gary Kasparov），计算机“深弗里茨”（`Deep
    Fritz`）战胜克拉姆尼克（Vladimir Kramnik）。2007 年12 月《科学》杂志报道，计算机已经掌握了决胜跳棋的技巧，在人类和计算机均不出错的对弈中，和局是人类最好的战绩。


    深度学习（`deep learning`）的诞生是这一时期人工智能研究范式转型的标志性事件。计算机运算力增强、大数据积累以及互联网大规模服务集群出现为深度学习的研发和应用创造了条件。2006
    年，深度学习的理论框架得以验证。2009 年，微软研究院与杰弗里·辛顿（Geoffrey Hinton）共同研发基于深度神经网络的语音识别系统。2010 年，深度学习在语音识别和自然语言处理等领域取得突破性进展。


    虽然在这一时期人工智能技术取得了飞跃发展，但是对人类智能的自信并未遭遇严重冲击。“人工智能尽管能战胜国际象棋冠军，但下围棋时无能为力；虽然能读文章，但创作时十分吃力；已经进行一定程度的学习，但没有通用的应用方式，不能识别任意角度的对象，不能在摔跤时捡起有用的东西……甚至还不具备人类的一些简单的思维功能，如婴儿的形象思维能力。”^([\[24\]](#txt002.html#footnote_content_txt002_24))


    ## （二）2010 年至2015 年


    2010 年以来，在大数据、机器学习以及超级计算机这三个相互加强的因素的推动下，人工智能迎来新一轮发展浪潮，开始突飞猛进，相关创业、投资和并购力度得到显著加强。^([\[25\]](#txt002.html#footnote_content_txt002_25))2010
    年，麻省理工学院（Massachusetts Institute of Technology）创造出情绪机器人“好运”（`Kismet`）。2011 年2
    月，IBM 超级计算机“沃森”（`Watson`）在智力竞猜节目《幸运大冒险（`Jeopardy！`）》以1对2 的方式战胜两位传奇冠军。2011 年，智能语音软件“希瑞”（`Siri`）出现。2012
    年，辛顿（Geoffrey Hinton）在图像数据分类方面取得突破性进展。以人工智能技术和产业为中心的变革成为全球经济的新增长点，各国纷纷从战略视角对人工智能未来发展进行顶层设计，力图抢占技术高地。


    ## （三）2016 年至今


    近年来，人工智能技术的研发与应用、观念的更新以及对技术边界的认识可谓日新月异。


    ### 1. 人工智能科技研发与应用并重，应用场景普遍化


    人工智能广阔的商业应用前景激起了大量私人企业的投资兴趣。科技巨头，如苹果（Apple）、谷歌（Google）、脸书（Facebook）、亚马逊（Amazon）和百度（Baidu）等纷纷进军人工智能领域，建立人工智能实验室或购买人工智能初创企业，如“谷歌AI
    实验室”“微软研究院”“IBM 研究院”“Facebook人工智能研究实验室”“腾讯AI Lab”“硅谷AI Lab”。人工智能不再停留在研发层面而转向应用，其应用场景迅速拓展，在公众视野中出现的频次增加，深度影响社会生活。


    ### 2. 人类对人工智能认识的局限不断突破


    人类在围棋方面的优势曾是人类自信心的源头之一。人类曾骄傲地认为：“好的棋手可以只用几秒钟就凭直觉决定下一步如何走，他可用尝试排除某些走法。这里需要概括抽象、总揽全局、直观判断能力，仅有规则是不够的。”^([\[26\]](#txt002.html#footnote_content_txt002_26))但是2016
    年年初，人类的这一自信遭遇毁灭性冲击，`AlphaGo`以绝对优势战胜了围棋九段高手李世石。


    ### 3. 开始探索强人工智能


    伴随现代计算机计算能力增强、算法改进，人类不再满足于研发作为工具和手段的人工智能，开始探索超越人类智能的强人工智能，试图将影视和文学作品中的想象变为现实。


    # 第二节　人工智能技术的主要应用场景


    ## 一、智能驾驶


    智能驾驶，又称无人驾驶（`driverless`）或自动驾驶，分为智能驾驶汽车和智能驾驶飞行器等。它“通过导航系统、传感器系统、智能感知算法、车辆控制系统等智能技术，实现了‘人工智能+无人驾驶’，颠覆了以往的人车关系、车车关系”^([\[27\]](#txt002.html#footnote_content_txt002_27))。驾驶权由人类驾驶员转移至智能驾驶系统，使得人类驾驶行为逐渐从日常生活所需转变为娱乐体验。


    ### （一）智能驾驶汽车


    智能汽车，又称无人驾驶汽车、自动驾驶汽车或智能网联汽车，是指智能驾驶系统全部或部分取代人类驾驶员的角色，实现智能驾驶的新型汽车。^([\[28\]](#txt002.html#footnote_content_txt002_28))它是“站在四个轮子上的机器人”^([\[29\]](#txt002.html#footnote_content_txt002_29))。智能汽车在降低交通事故发生率、缓解交通拥堵、便利特殊群体出行、降低能耗、减少空气污染、优化城乡布局等方面具有优势。但是，它在产生显著社会效用的同时，也可能带来失业、网络安全隐患等新型社会问题。^([\[30\]](#txt002.html#footnote_content_txt002_30))


    1977 年，现代意义上的智能汽车诞生。伴随工艺改进，智能汽车逐渐适应在复杂路况（如城市、沙漠）安全行驶。目前，谷歌、优步（Uber）、来福车（Lyft）、世联互动（Naver）等已经取得或完成了相应的路测许可。掌握智能驾驶核心技术的科技型创业公司成为并购市场关注的焦点。阿联酋副总统阿勒马克图姆（AL
    Maktoum）发起“迪拜智能驾驶行动战略”。2018 年2 月28 日，迪拜公路和运输管理局（RTA）投入使用无人驾驶出租车——“自动豆荚”。在我国，以物联网为基础的智慧交通自2016
    年以来备受国家和社会关注。北京、上海、河北、吉林、湖北、重庆、浙江、江苏等地纷纷开展智慧交通应用试点和示范工作。


    ### （二）智能驾驶飞行器


    智能驾驶飞行器，又称无人驾驶飞行器（`unmanned aerial verical`）或无人机。它“是利用无线电遥控设备和自备的程序控制装置的不载人飞行器，包括无人直升机、固定翼机、多旋翼飞行器、无人飞艇、无人伞翼机”^([\[31\]](#txt002.html#footnote_content_txt002_31))。


    继智能驾驶汽车兴起之后，智能驾驶飞行器也进入人们的生活领域。它在真人秀航拍、农业数据监控、灾害救援、人工降雨、森林防火、测绘、物流、保安等领域有着广阔的应用前景。早在2013
    年，亚马逊公司便尝试利用无人飞行器派送包裹。“据美国蒂尔集团的预测，全球无人飞行器的市场规模将由2015 年的64 亿美元增至2024 年的115 亿美元，累计市场总规模超过891
    亿美元。到2024 年，全球民用无人飞行器的市场份额将增加至12%，达到16 亿美元。”^([\[32\]](#txt002.html#footnote_content_txt002_32))此外，智能驾驶飞行器在军事领域的潜在价值被发现，在未来可能成为主流军用飞行器。


    ## 二、智能投资顾问


    智能投资顾问，又称机器人投顾（`robot-adviser`）、自动化顾问工具（`automated advice tools`）、自动化投资工具（`automated
    investment tools`）、自动化投资平台（`automated investment platform`），是财务顾问（`financial adviser`）的下位概念，是指以算法和模型为基础的智能投资顾问系统自主为客户进行资产配置、管理和优化服务。智能投资顾问模式产生于2008
    年，是人工智能在金融行业的应用，是“人工智能”+“金融服务”的产物。


    ## 三、智能创作


    人工智能在文学艺术作品创作（如写作新闻稿、谱曲、绘画）过程中的自主性越来越强，在独创性方面的贡献可以与人类相媲美甚至超越人类。应用于新闻领域的人工智能被称为“不眠的新闻工作者”。英美传媒巨头使用人工智能大规模写作新闻稿。^([\[33\]](#txt002.html#footnote_content_txt002_33))腾讯公司利用科技机器人`Dreamwriter`批量自动撰写财经新闻。微软公司发布了“微软小冰”创作的现代诗集《阳光失去了玻璃》。“清华大学的语音和语言实验中心（`CSLT`）在其网站上宣布他们的写诗机器人‘薇薇’经过社科院等唐诗专家的评定。”^([\[34\]](#txt002.html#footnote_content_txt002_34))人工智能生成的美术作品具备了人类美术作品的艺术性，在画廊或美术博物馆被展出。^([\[35\]](#txt002.html#footnote_content_txt002_35))索尼计算机科学实验室的人工智能程序“`FlowMachines`”创作出歌曲“Daddy''s
    Car”。由1600 名专业音乐人组成的听众团中一半以上的听众误认为盖唐·哈杰里斯（Gaetan Hadjeres）与弗朗索瓦·帕切特（Francois Pachet）设计的人工智能系统谱写的音乐作品是巴赫（Bach）的作品。


    ## 四、智能诊疗


    智能诊疗是指智能计算机模拟医生的思维进行医疗诊断，提供诊疗以及健康管理方案。智能诊疗能够缓解目前医疗资源稀缺、价格高昂、分配不均匀等弊端，满足人民群众对健康的需要。“`MYCIN`”是国外最早出现的智能诊疗专家系统。国际商业机器公司（IBM）开发的智能诊疗系统`Watson`于2012年通过了美国职业医师资格考试，并在多家医院辅助诊疗，为包括多种癌症在内的病种患者提供诊疗服务。“纳米科技医疗机器人将在病人的血液中穿行并进入肿瘤，通过驱除一种重要的癌症基因来进行治疗。”^([\[36\]](#txt002.html#footnote_content_txt002_36))


    ## 五、智能家居


    智能家居产品包括智能电视、智能空调、智能洗衣机、智能冰箱等。苹果公司推出了“`Apple HomeKit`”，亚马逊推出了智能蓝牙喇叭“`Echo`”，谷歌推出了智能音箱“`Google-Home`”，微软推出了智能家庭中枢“`Home-Hub`”，美的推出“`U+智慧生活开放平台`”，海尔推出了“`U-Home`”，腾讯推出了企鹅智慧社区“`SaaS
    系统`”，华为推出了智慧家庭解决方案“`OpenLife`”，脸书推出了人工智能管家“`Jarvis`”。


    ## 六、法律人工智能


    法律人工智能是人工智能技术在法律领域的应用，它是指运用人工智能技术进行法律信息处理、文本解析或论证挖掘，自主生成法律意见或建议、裁判文书、检察文书等。传统法学教育和法律职业对科技具有较强的免疫力。无论是在大陆法系以法教义学为基础的教学方式还是在英美法系的苏格拉底式教学方式下，科技的参与度均十分有限。科技在法律概念界定与分析、裁判观念形成、法律文书写作等活动中主要起辅助办公的作用，并未对传统法学教育和法律职业造成实质影响。人工智能时代科技与法律的融合在广度和深度上达到前所未有的程度，带来了阵痛。法律行业从人员密集型转向技术密集型，科技正在并将继续深入改变法律行业的运行模式。已有律所运用智能机器（人）起草合同文本、提供法律咨询和预测裁判结果，智慧法院、智慧检察院的建设也在探索之中。牛津大学2016
    年报告“工作中的技术V.2.0：未来不再是过去的样子”（`Technology at Work V.2.0：The Future Is Not What It
    Used to Be`）对人类未来的工作状态持悲观态度，它预测大量工作岗位尤其是白领工作岗位将被人工智能占据。我国《新一代人工智能发展规划》明确提出要培养“人工智能+”法律的复合型人才。


    # 第三节　人工智能时代风险的特征及规制路径


    人工智能开启了人类社会的潘多拉魔盒，它在减轻人类体力劳动和脑力劳动负担的同时也带来了相应的风险。智能主体多元化使得人类面临人工智能科技独有的挑战和后工业科技（`post
    industrial technology`）的共性挑战，社会风险显现出前所未有的不确定性和不可逆转性。这就需要从技术、伦理和法律等层面对人工智能时代的风险进行综合规制。


    ## 一、人工智能时代风险的特征


    风险状态是人类社会的常态，人类社会总是会面临不同类型的风险。在社会发展进步的过程中，风险客观存在，机遇与风险并存。避免风险造成损失或灾难并不意味着需要消除一切风险。部分风险是社会所允许甚至欢迎的。乌尔里希·贝克在《风险社会》一书中指出，伴随现代技术发展，风险社会的核心由财富分配转向风险分配。^([\[37\]](#txt002.html#footnote_content_txt002_37))“我们在支持科学创新或者其他种类的变革中，可能应该表现得更为积极些，而不能过于谨慎。毕竟，‘风险’一词的词根在古葡萄牙语中的意思是‘敢于’。”^([\[38\]](#txt002.html#footnote_content_txt002_38))人工智能的自主性、技术性和不确定性使得人工智能时代的风险具有技术性、公共性、结构性和不可逆转性等特征。


    ### （一）人工智能时代风险的技术性


    人类在享受科技进步成果的同时，也营造了“技术知识的囚室”^([\[39\]](#txt002.html#footnote_content_txt002_39))，制造了新型社会风险。它是计算机科学、认知科学发展与进步的结果，是人类文明产生的技术性风险。人工智能时代的社会风险根源于智能技术的变革，主要表现为因技术创新、失误、故障或滥用而导致的风险。具体而言，主要包括以下技术风险：①数据匿名化和反匿名化技术产生的信息泄露风险。②基于数据分析进行行为预测而产生的隐私风险和安全风险。③因算法黑箱导致算法歧视、责任主体隐形化的风险。④算法合谋导致的市场风险。⑤黑客入侵产生的安全风险。


    技术革命引发的社会风险被深深地打上技术的烙印，使得人工智能时代识别、预防、控制、消除风险的难度增加，该技术性特征是新型社会风险其他特征产生的基础。为化解人工智能时代的社会风险而设计民事法律责任规则体系不能忽视技术的作用。当智能机器导致损失时如何确定过错以及因果关系、责任承担与人工智能技术研发与应用的关系如何、民事法律责任规则的功能如何定位等问题的解决不能单纯依靠价值分析，须经由技术路径实现。“法治管理需要嵌入生产环节，比如对算法处理的数据或生产性资源进行管理，防止造成消极后果。”^([\[40\]](#txt002.html#footnote_content_txt002_40))


    ### （二）人工智能时代风险源头的分散性与隐蔽性

    '
  trans: '

    神经网络模型以神经科学认知为前提，基于神经科学的联结主义将计算机信息处理与人脑神经系统结合。它通过类比计算机系统与人脑神经，将计算机系统作为大脑建模的媒介，模拟人的大脑结构以及神经元交互方式来设计智能系统。“智能的神经模型强调大脑由调整各个神经元间的关系适应所处世界的能力。不是按显式逻辑句子表示知识，它们作为各种关系模式的性质隐式捕捉知识。”^([\[21\]](#txt002.html#footnote_content_txt002_21))


    20 世纪 70 年代，人工神经网络的研究陷入低谷。20 世纪 80 年代，人工神经网络理论出现新进展。1982 年，美国物理学家霍普菲尔特（Hopfield）将统计力学方法引入人工神经网络存储与优化，提出离散的神经网络模型。1984
    年，他又提出了连续神经网络模型。1985 年，鲁梅尔哈特（Rumelhart）、辛顿等学者实现了使用“后向传播”`BP`算法训练神经网络。1987 年，第一届人工神经网络国际会议在美国召开，国际神经网络学会（`INNS`）成立。1995
    年，延恩·勒昆（Yann LeCun）等人在生物视觉模型的启发下，改进卷积神经网络（`convolution neural network`），模拟视觉皮层中的细胞，进行图像分类，在手写识别上取得进展。


    ## （三）基于智能体（`agent`）的分布式人工智能


    20 世纪 90 年代前后，人工智能研发人员就人工智能的理论和技术困局进行全面反思，批判还原论，重新构建人工智能基本理论，调整对人工智能的期许，放弃不切实际的幻想。其中一个显著的变化是人工智能研究从客体转向主体。“主体概念的回归并不单单是因为人们认识到了应该把人工智能各个领域的研究成果集成为一个具有智能行为概念的‘人’，更重要的原因是人们认识到了人类智能的本质是一种社会性的智能。”^([\[22\]](#txt002.html#footnote_content_txt002_22))


    社会性智能强调智能的社会属性和文化属性，将智能视为体现在智能个体或集体行为中交互作用的结果。社会性智能的基本构成是“智能体”或“智能主体”（`agent`）。智能体具有一定的自主性，在特定情境中与其他智能体交互作用，直接或间接影响环境。人类活动往往是由地理位置上分散的多人共同参与完成的，与此类似，在分布式人工智能中，地理位置上分散的多个智能体共享信息，在合作或竞争的情况下工作。单个智能体预测整体状况以便局部决策，求解子问题，进而将结果传递给其他智能体。


    # 四、飞速发展期：多元范式


    人工智能研究经历了从逻辑到经验、从符号化推理到知识工程的转变，但是这并不意味着传统研究范式彻底退出舞台。唯理主义的研究范式与经验主义的研究范式处于此消彼长的共存状态。“没有一种‘假说’在经过选择后被全面地批判、推翻及取代，也没有一种‘假说’或‘范式’能够一统
    AI 领域。”^([\[23\]](#txt002.html#footnote_content_txt002_23))21 世纪，互联网技术的深层革命，引发了传统研究范式升级、拓展和转型，出现“感知中心
    AI 范式”“数据中心 AI 范式”“人脑科学 AI 范式”“认知计算 AI 范式”等多元范式并存的现象，人工智能进入飞速发展时期。


    ## （一）2000 年至 2010 年


    2001 年，机器人足球梦想实现。国际象棋方面，IBM 超级计算机“深蓝”（`deep blue`）战胜世界冠军卡斯帕罗夫（Gary Kasparov），计算机“深弗里茨”（`Deep
    Fritz`）战胜克拉姆尼克（Vladimir Kramnik）。2007 年 12 月《科学》杂志报道，计算机已经掌握了决胜跳棋的技巧，在人类和计算机均不出错的对弈中，和局是人类最好的战绩。


    深度学习（`deep learning`）的诞生是这一时期人工智能研究范式转型的标志性事件。计算机运算力增强、大数据积累以及互联网大规模服务集群出现为深度学习的研发和应用创造了条件。2006
    年，深度学习的理论框架得以验证。2009 年，微软研究院与杰弗里·辛顿（Geoffrey Hinton）共同研发基于深度神经网络的语音识别系统。2010 年，深度学习在语音识别和自然语言处理等领域取得突破性进展。


    虽然在这一时期人工智能技术取得了飞跃发展，但是对人类智能的自信并未遭遇严重冲击。“人工智能尽管能战胜国际象棋冠军，但下围棋时无能为力；虽然能读文章，但创作时十分吃力；已经进行一定程度的学习，但没有通用的应用方式，不能识别任意角度的对象，不能在摔跤时捡起有用的东西……甚至还不具备人类的一些简单的思维功能，如婴儿的形象思维能力。”^([\[24\]](#txt002.html#footnote_content_txt002_24))


    ## （二）2010 年至 2015 年


    2010 年以来，在大数据、机器学习以及超级计算机这三个相互加强的因素的推动下，人工智能迎来新一轮发展浪潮，开始突飞猛进，相关创业、投资和并购力度得到显著加强。^([\[25\]](#txt002.html#footnote_content_txt002_25))2010
    年，麻省理工学院（Massachusetts Institute of Technology）创造出情绪机器人“好运”（`Kismet`）。2011 年 2
    月，IBM 超级计算机“沃森”（`Watson`）在智力竞猜节目《幸运大冒险（`Jeopardy！`）》以 1 对 2 的方式战胜两位传奇冠军。2011 年，智能语音软件“希瑞”（`Siri`）出现。2012
    年，辛顿（Geoffrey Hinton）在图像数据分类方面取得突破性进展。以人工智能技术和产业为中心的变革成为全球经济的新增长点，各国纷纷从战略视角对人工智能未来发展进行顶层设计，力图抢占技术高地。


    ## （三）2016 年至今


    近年来，人工智能技术的研发与应用、观念的更新以及对技术边界的认识可谓日新月异。


    ### 1. 人工智能科技研发与应用并重，应用场景普遍化


    人工智能广阔的商业应用前景激起了大量私人企业的投资兴趣。科技巨头，如苹果（Apple）、谷歌（Google）、脸书（Facebook）、亚马逊（Amazon）和百度（Baidu）等纷纷进军人工智能领域，建立人工智能实验室或购买人工智能初创企业，如“谷歌
    AI 实验室”“微软研究院”“IBM 研究院”“Facebook 人工智能研究实验室”“腾讯 AI Lab”“硅谷 AI Lab”。人工智能不再停留在研发层面而转向应用，其应用场景迅速拓展，在公众视野中出现的频次增加，深度影响社会生活。


    ### 2. 人类对人工智能认识的局限不断突破


    人类在围棋方面的优势曾是人类自信心的源头之一。人类曾骄傲地认为：“好的棋手可以只用几秒钟就凭直觉决定下一步如何走，他可用尝试排除某些走法。这里需要概括抽象、总揽全局、直观判断能力，仅有规则是不够的。”^([\[26\]](#txt002.html#footnote_content_txt002_26))但是
    2016 年年初，人类的这一自信遭遇毁灭性冲击，`AlphaGo`以绝对优势战胜了围棋九段高手李世石。


    ### 3. 开始探索强人工智能


    伴随现代计算机计算能力增强、算法改进，人类不再满足于研发作为工具和手段的人工智能，开始探索超越人类智能的强人工智能，试图将影视和文学作品中的想象变为现实。


    # 第二节　人工智能技术的主要应用场景


    ## 一、智能驾驶


    智能驾驶，又称无人驾驶（`driverless`）或自动驾驶，分为智能驾驶汽车和智能驾驶飞行器等。它“通过导航系统、传感器系统、智能感知算法、车辆控制系统等智能技术，实现了‘人工智能+无人驾驶’，颠覆了以往的人车关系、车车关系”^([\[27\]](#txt002.html#footnote_content_txt002_27))。驾驶权由人类驾驶员转移至智能驾驶系统，使得人类驾驶行为逐渐从日常生活所需转变为娱乐体验。


    ### （一）智能驾驶汽车


    智能汽车，又称无人驾驶汽车、自动驾驶汽车或智能网联汽车，是指智能驾驶系统全部或部分取代人类驾驶员的角色，实现智能驾驶的新型汽车。^([\[28\]](#txt002.html#footnote_content_txt002_28))它是“站在四个轮子上的机器人”^([\[29\]](#txt002.html#footnote_content_txt002_29))。智能汽车在降低交通事故发生率、缓解交通拥堵、便利特殊群体出行、降低能耗、减少空气污染、优化城乡布局等方面具有优势。但是，它在产生显著社会效用的同时，也可能带来失业、网络安全隐患等新型社会问题。^([\[30\]](#txt002.html#footnote_content_txt002_30))


    1977 年，现代意义上的智能汽车诞生。伴随工艺改进，智能汽车逐渐适应在复杂路况（如城市、沙漠）安全行驶。目前，谷歌、优步（Uber）、来福车（Lyft）、世联互动（Naver）等已经取得或完成了相应的路测许可。掌握智能驾驶核心技术的科技型创业公司成为并购市场关注的焦点。阿联酋副总统阿勒马克图姆（AL
    Maktoum）发起“迪拜智能驾驶行动战略”。2018 年 2 月 28 日，迪拜公路和运输管理局（RTA）投入使用无人驾驶出租车——“自动豆荚”。在我国，以物联网为基础的智慧交通自
    2016 年以来备受国家和社会关注。北京、上海、河北、吉林、湖北、重庆、浙江、江苏等地纷纷开展智慧交通应用试点和示范工作。


    ### （二）智能驾驶飞行器


    智能驾驶飞行器，又称无人驾驶飞行器（`unmanned aerial verical`）或无人机。它“是利用无线电遥控设备和自备的程序控制装置的不载人飞行器，包括无人直升机、固定翼机、多旋翼飞行器、无人飞艇、无人伞翼机”^([\[31\]](#txt002.html#footnote_content_txt002_31))。


    继智能驾驶汽车兴起之后，智能驾驶飞行器也进入人们的生活领域。它在真人秀航拍、农业数据监控、灾害救援、人工降雨、森林防火、测绘、物流、保安等领域有着广阔的应用前景。早在
    2013 年，亚马逊公司便尝试利用无人飞行器派送包裹。“据美国蒂尔集团的预测，全球无人飞行器的市场规模将由 2015 年的 64 亿美元增至 2024 年的
    115 亿美元，累计市场总规模超过 891 亿美元。到 2024 年，全球民用无人飞行器的市场份额将增加至 12%，达到 16 亿美元。”^([\[32\]](#txt002.html#footnote_content_txt002_32))此外，智能驾驶飞行器在军事领域的潜在价值被发现，在未来可能成为主流军用飞行器。


    ## 二、智能投资顾问


    智能投资顾问，又称机器人投顾（`robot-adviser`）、自动化顾问工具（`automated advice tools`）、自动化投资工具（`automated
    investment tools`）、自动化投资平台（`automated investment platform`），是财务顾问（`financial adviser`）的下位概念，是指以算法和模型为基础的智能投资顾问系统自主为客户进行资产配置、管理和优化服务。智能投资顾问模式产生于
    2008 年，是人工智能在金融行业的应用，是“人工智能”+“金融服务”的产物。


    ## 三、智能创作


    人工智能在文学艺术作品创作（如写作新闻稿、谱曲、绘画）过程中的自主性越来越强，在独创性方面的贡献可以与人类相媲美甚至超越人类。应用于新闻领域的人工智能被称为“不眠的新闻工作者”。英美传媒巨头使用人工智能大规模写作新闻稿。^([\[33\]](#txt002.html#footnote_content_txt002_33))腾讯公司利用科技机器人`Dreamwriter`批量自动撰写财经新闻。微软公司发布了“微软小冰”创作的现代诗集《阳光失去了玻璃》。“清华大学的语音和语言实验中心（`CSLT`）在其网站上宣布他们的写诗机器人‘薇薇’经过社科院等唐诗专家的评定。”^([\[34\]](#txt002.html#footnote_content_txt002_34))人工智能生成的美术作品具备了人类美术作品的艺术性，在画廊或美术博物馆被展出。^([\[35\]](#txt002.html#footnote_content_txt002_35))索尼计算机科学实验室的人工智能程序“`FlowMachines`”创作出歌曲“Daddy''s
    Car”。由 1600 名专业音乐人组成的听众团中一半以上的听众误认为盖唐·哈杰里斯（Gaetan Hadjeres）与弗朗索瓦·帕切特（Francois
    Pachet）设计的人工智能系统谱写的音乐作品是巴赫（Bach）的作品。


    ## 四、智能诊疗


    智能诊疗是指智能计算机模拟医生的思维进行医疗诊断，提供诊疗以及健康管理方案。智能诊疗能够缓解目前医疗资源稀缺、价格高昂、分配不均匀等弊端，满足人民群众对健康的需要。“`MYCIN`”是国外最早出现的智能诊疗专家系统。国际商业机器公司（IBM）开发的智能诊疗系统`Watson`于
    2012 年通过了美国职业医师资格考试，并在多家医院辅助诊疗，为包括多种癌症在内的病种患者提供诊疗服务。“纳米科技医疗机器人将在病人的血液中穿行并进入肿瘤，通过驱除一种重要的癌症基因来进行治疗。”^([\[36\]](#txt002.html#footnote_content_txt002_36))


    ## 五、智能家居


    智能家居产品包括智能电视、智能空调、智能洗衣机、智能冰箱等。苹果公司推出了“`Apple HomeKit`”，亚马逊推出了智能蓝牙喇叭“`Echo`”，谷歌推出了智能音箱“`Google-Home`”，微软推出了智能家庭中枢“`Home-Hub`”，美的推出“`U+智慧生活开放平台`”，海尔推出了“`U-Home`”，腾讯推出了企鹅智慧社区“`SaaS
    系统`”，华为推出了智慧家庭解决方案“`OpenLife`”，脸书推出了人工智能管家“`Jarvis`”。


    ## 六、法律人工智能


    法律人工智能是人工智能技术在法律领域的应用，它是指运用人工智能技术进行法律信息处理、文本解析或论证挖掘，自主生成法律意见或建议、裁判文书、检察文书等。传统法学教育和法律职业对科技具有较强的免疫力。无论是在大陆法系以法教义学为基础的教学方式还是在英美法系的苏格拉底式教学方式下，科技的参与度均十分有限。科技在法律概念界定与分析、裁判观念形成、法律文书写作等活动中主要起辅助办公的作用，并未对传统法学教育和法律职业造成实质影响。人工智能时代科技与法律的融合在广度和深度上达到前所未有的程度，带来了阵痛。法律行业从人员密集型转向技术密集型，科技正在并将继续深入改变法律行业的运行模式。已有律所运用智能机器（人）起草合同文本、提供法律咨询和预测裁判结果，智慧法院、智慧检察院的建设也在探索之中。牛津大学
    2016 年报告“工作中的技术 V.2.0：未来不再是过去的样子”（`Technology at Work V.2.0：The Future Is Not
    What It Used to Be`）对人类未来的工作状态持悲观态度，它预测大量工作岗位尤其是白领工作岗位将被人工智能占据。我国《新一代人工智能发展规划》明确提出要培养“人工智能+”法律的复合型人才。


    # 第三节　人工智能时代风险的特征及规制路径


    人工智能开启了人类社会的潘多拉魔盒，它在减轻人类体力劳动和脑力劳动负担的同时也带来了相应的风险。智能主体多元化使得人类面临人工智能科技独有的挑战和后工业科技（`post
    industrial technology`）的共性挑战，社会风险显现出前所未有的不确定性和不可逆转性。这就需要从技术、伦理和法律等层面对人工智能时代的风险进行综合规制。


    ## 一、人工智能时代风险的特征


    风险状态是人类社会的常态，人类社会总是会面临不同类型的风险。在社会发展进步的过程中，风险客观存在，机遇与风险并存。避免风险造成损失或灾难并不意味着需要消除一切风险。部分风险是社会所允许甚至欢迎的。乌尔里希·贝克在《风险社会》一书中指出，伴随现代技术发展，风险社会的核心由财富分配转向风险分配。^([\[37\]](#txt002.html#footnote_content_txt002_37))“我们在支持科学创新或者其他种类的变革中，可能应该表现得更为积极些，而不能过于谨慎。毕竟，‘风险’一词的词根在古葡萄牙语中的意思是‘敢于’。”^([\[38\]](#txt002.html#footnote_content_txt002_38))人工智能的自主性、技术性和不确定性使得人工智能时代的风险具有技术性、公共性、结构性和不可逆转性等特征。


    ### （一）人工智能时代风险的技术性


    人类在享受科技进步成果的同时，也营造了“技术知识的囚室”^([\[39\]](#txt002.html#footnote_content_txt002_39))，制造了新型社会风险。它是计算机科学、认知科学发展与进步的结果，是人类文明产生的技术性风险。人工智能时代的社会风险根源于智能技术的变革，主要表现为因技术创新、失误、故障或滥用而导致的风险。具体而言，主要包括以下技术风险：①数据匿名化和反匿名化技术产生的信息泄露风险。②基于数据分析进行行为预测而产生的隐私风险和安全风险。③因算法黑箱导致算法歧视、责任主体隐形化的风险。④算法合谋导致的市场风险。⑤黑客入侵产生的安全风险。


    技术革命引发的社会风险被深深地打上技术的烙印，使得人工智能时代识别、预防、控制、消除风险的难度增加，该技术性特征是新型社会风险其他特征产生的基础。为化解人工智能时代的社会风险而设计民事法律责任规则体系不能忽视技术的作用。当智能机器导致损失时如何确定过错以及因果关系、责任承担与人工智能技术研发与应用的关系如何、民事法律责任规则的功能如何定位等问题的解决不能单纯依靠价值分析，须经由技术路径实现。“法治管理需要嵌入生产环节，比如对算法处理的数据或生产性资源进行管理，防止造成消极后果。”^([\[40\]](#txt002.html#footnote_content_txt002_40))


    ### （二）人工智能时代风险源头的分散性与隐蔽性

