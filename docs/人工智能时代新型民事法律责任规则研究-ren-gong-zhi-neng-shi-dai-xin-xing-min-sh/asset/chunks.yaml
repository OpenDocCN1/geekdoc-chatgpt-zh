    \n[后　记](#att003.html#att003_1)\n\n\uFEFF\n\n导　论\n\n以计算机和互联网为基础的信息革命是继蒸汽革命和电力革命之后的第三次科学技术革命。^([\\\
    [1\\]](#txt001.html#footnote_content_txt001_1))它将人类社会相继带入互联网时代（internet time）、大数据时代（data\
    \ time）和人工智能时代（artificial intelligence time）。^([\\[2\\]](#txt001.html#footnote_content_txt001_2))人工智能已经由纯粹科技研发转向实际应用，从科幻影视作品走进现实生活，在交通运输、通讯、家居生活、服务咨询、文学创作、工业生产乃至军事、反恐等领域的应用价值备受关注。^([\\\
    [3\\]](#txt001.html#footnote_content_txt001_3))\n\n智能革命带来的高效、便捷、人性化，让人类社会迎来了前所未有的美好时代。巨额的研发资金、海量的商业广告、倾斜性的国家政策彰显了人类对人工智能时代的憧憬与向往。人类与人工智能和谐共处的画卷徐徐展开。模拟人类智能的人工智能辅助甚至替代人类从事部分工作，成为人类改善生活和拓宽生活场景的有效工具，是新一轮产业技术革命和结构调整的重心。作为人类创造物的人工智能被假定为一种客体性或工具性的存在，人类负责思考，而人工智能负责执行，二者基于各自优势在社会生活中扮演不同角色，形成强强联合之势。\n\
    \n但是，这一人类中心主义的假设遭遇挑战和质疑。智能革命模糊了梦想与现实的界限，使得人类社会的未来走向充满了不确定性，唤起了人类的无限遐想。人类在惊叹人工智能带来社会变革的同时产生了担忧，而且这一担忧远胜于人类在任何历史阶段对科技的担忧。这一担忧来自技术本身、因技术变革导致的社会结构变化以及人文精神的沦丧。如何定位人工智能与人类的关系？人工智能取代人类劳动是否会导致失业状况急剧恶化？人工智能革命是不是一场会导致人文精神沦丧的“退回到原点的革命”^([\\\
    [4\\]](#txt001.html#footnote_content_txt001_4))？人工智能是否会被人类滥用？人工智能是否会一直屈从于人类？人类是否会沦为其创造物的奴隶？人类的时代是否会走向终结，取而代之以机器的时代或人机共主的时代？人工智能的发展给人类带来的是福音还是灾难？人类社会将走向毁灭还是浴火重生走向巅峰？\n\
    \n人类与人工智能之间的矛盾成为新型社会矛盾，与人工智能相关的风险成为全球化时代下普遍性的社会风险。悲观主义者，如霍金，认为人工智能的创新是人类历史上最大的事件，但是，这一事件也可能是最后的事件。另有不少有识之士呼吁对人工智能进行法律和伦理道德规制，限制部分人工智能技术研发与应用。美国太空探索技术公司（Space\
    \ X）创始人伊隆·马斯克（Elon Musk）在麻省理工学院参加2014 年埃斯特罗百年研讨会（AeroAstro Centennial Symposium）期间的访谈中回避了规制怀疑论（skepticism\
    \ of regulation），认为政府干预是明智的。他倾向于在国家和国际层面对人工智能进行监管，从而确保人类不会做出愚蠢的事情。^([\\[5\\]](#txt001.html#footnote_content_txt001_5))不少科技巨头也存在类似的担忧，如比尔·盖茨（Bill\
    \ Gates）和斯蒂夫·盖瑞·沃兹尼亚克（Stephen Gary Wozniak）都认为需要警惕和防范人工智能可能带来的社会风险。\n\n可能颠覆甚至终结人类历史的人工智能技术正在逐渐从想象转变为现实，人类对技术进步和未知世界既无限憧憬又极度担忧。无论如何，未来已来，势不可挡。人类已经走上了智能革命之路，否认、逃避或阻止人工智能技术发展既不现实，也不可能。人工智能已渗透社会生活的方方面面，不仅外在地改变着人们的生产、生活以及社会交往方式，而且内在地改变着人们的思维方式和生活习惯，诱发社会结构变革。我们不应当对人工智能的发展听之任之，相反，需要从技术、伦理、政策、法律等诸多层面共同关注并协同治理，调控或化解人工智能时代出现的新型社会风险。\n\
    \n“一旦有法律人士参与到一场讨论中，该话题的有趣部分往往就结束了。工程师和计算机专家在这方面有过之而无不及。”^([\\[6\\]](#txt001.html#footnote_content_txt001_6))人工智能的话题一旦从文学领域转到科学或法学的领域，就多了几分理性而少了几分趣味。但是，人工智能未来发展的方向和程度的未知性使得这一话题即便是在非娱乐化的法律场景中依然会让人浮想联翩、激动不已。\n\
    \n伴随人工智能在经济和社会生活中的重要性提升，法律体系遭遇来自实践和观念的双重挑战。实践的挑战（practical challenges）源于人工智能研发的方式以及对智能机器进行行为控制。观念的挑战（conceptual\
    \ challenges）源于对因智能机器造成损害而产生的道德和法律责任分配的困难以及确定让人费解的人工智能的含义。^([\\[7\\]](#txt001.html#footnote_content_txt001_7))一系列围绕人工智能的法学研讨会陆续召开，以人工智能为研究对象的法学研究机构出现，人工智能已经成为法学研究的前沿问题之一，为法学研究者津津乐道。“人工智能的迅猛发展不仅仅是一个科学技术领域的新现象，它正在迅速改变人类社会的经济形态、社会交往模式和政治—法律结构。”^([\\\
    [8\\]](#txt001.html#footnote_content_txt001_8))甚至有学者提出法律的“死亡”的概念，即法律不学习被机器学习取代，规范性期望被认知性期望取代，法律被代码／算法取代，这将是法律“死亡”的前景。^([\\\
    [9\\]](#txt001.html#footnote_content_txt001_9))新型民事法律规则的设计是人工智能时代法律制度变革的重要环节。智能革命打破了人类作为唯一智能主体的“神话”，产生智能机器（人）能否以及如何享有权利和履行义务的问题，并衍生出一系列法学难题。\n\
    \n第一，智能机器（人）是人吗？其取得权利能力的法哲学或法理基础，即人之为人的依据是什么？诸多问题难以在以自然人为中心设计的民事主体规则框架内寻找到答案，需要对民事主体规则赖以存在的基础进行反思，构建适应人工智能时代的民事主体规则体系。\n\
    \n第二，机器智能化中的智能部分诱发了民事主体规则的变化，而机器智能化中机器的部分又对民事客体规则提出了挑战。在主体与客体截然二分的世界中，客体的存在具有工具性或手段性。客体没有独立的意识或情感，不存在独立于主体的需求。在民事客体规则的设计中机器被作为物的一种类型，主体有权依自己的意志对机器进行自主支配或利用。^([\\\
    [10\\]](#txt001.html#footnote_content_txt001_10))机器智能化打破了主体与客体之间原本清晰的界限，产生了客体主体化的效果，机器自主意识的觉醒及在情感方面的需求受到重视。\n\
    \n第三，对社会关系中主体和客体的认识发生变化使得法律关系的内容设计，即对权利、义务以及责任的配置需要进行反思、调整或重构。倘若承认智能主体的多元化，赋予人工智能以民事主体资格，传统的以人类中心主义为基础设计的民事权利、义务和责任体系将发生颠覆性变革；即便不承认人工智能的民事主体地位，仍然将人工智能作为民事法律关系的客体，也有必要对人工智能的制造者、使用者和利益相关主体的权利、义务和责任进行研究并调整或重新配置。\n\
    \n进入人工智能时代，民事法律规则遭遇全方位的挑战，这一点在民事法律责任规则方面尤为显著。智能驾驶、智能投顾、智能家居、智能陪护应用于现实生活难免会产生侵权责任和合同责任。解决实践中客观存在的矛盾冲突，不仅需要进行抽象理论分析，而且需要明确制定相应的民事法律责任规则。英国、美国、日本等技术强国已经就智能驾驶等特定领域的人工智能规则设计展开研究。欧盟法律事务委员会更是在人工智能时代民事法律责任体系化研究和规则设计方面领先一步，提出了相关立法草案。顺应时代潮流，我国也需要强化对人工智能相关民事法律责任规则体系的研究，发挥规则的引领作用，推动人工智能技术的进步与普遍应用。《中华人民共和国民法典》（以下简称《民法典》）对人工智能进行了留白处理，为未来人工智能立法预留了空间。这就需要充分考虑人工智能时代传统民事法律责任体系遭遇的挑战与冲击，并设计新型民事法律责任规则，让未来的《民法典》具有鲜明的时代特色。"
