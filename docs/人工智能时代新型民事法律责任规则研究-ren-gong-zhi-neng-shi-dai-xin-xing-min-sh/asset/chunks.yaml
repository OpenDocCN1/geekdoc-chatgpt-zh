- raw: "自然主义意向性认为人脑是产生意向性的基础。“智能是某种发生在我们大脑中的东西”^([\\[102\\]](#txt003.html#footnote_content_txt003_102))，人的大脑是天然的也是唯一的智能引擎。探索智能必须以人的大脑为起点，从大脑内部萃取基本元素。计算机硬件和程序不能取代人脑就内容进行因果关系判断。以符号主义为基础的计算理论关注形式转化，缺乏对心理过程的解释力。机器内部的符号转换是形式化的，缺乏意向性要求的“关联性”或“关于性”。计算机基于程序设计而展现的所谓智能即便人类智能不能比拟，也不能改变计算机是句法机，而非语义机的本质。\n\
    \n塞尔将意向性作为判断智能的标准，探究意向性与计算、表征之间的关系，深化了人们对意向性本质的认识。但是，他对人工智能的意向性持悲观主义立场。塞尔在《意向性——论心灵哲学》一书中明确了自然主义意向性的观点，该书“处理意向性的方式绝对是自然主义的，我把意向状态、过程和事件看做是我们生物生命史的组成部分，正如消化、生长和胆汁分泌也是我们的生物生命史的组成部份”^([\\\
    [103\\]](#txt003.html#footnote_content_txt003_103))。卡特（Carter）强调意向性在发展人工智能中的重要性，他认为机器与外部世界之间需要建立关联关系，机器才能表征智能特征。^([\\\
    [104\\]](#txt003.html#footnote_content_txt003_104))完全与外部世界隔绝的符号处理或句法加工不具有意向性和语义性，无法在外在对象即现实世界产生意义。\n\
    \n2.派生意向性\n\n玛尔认为，早期对人工智能的研究根本没有归纳出关于信息处理的可解问题，遑论解决。“研究工作，特别是对自然语言理解、问题求解或记忆结构的研究，很容易蜕化成为编写程序，这种程序只不过是一种没有启迪作用的、对人类行为方式的某个小方面的模仿而已。”^([\\\
    [105\\]](#txt003.html#footnote_content_txt003_105))程序语言与自然语言之间的关系使得机器是否具有智能成为解释学上的难题。\n\
    \n缺乏意向性的计算机符号加工行为，是句法性而非语义性的，它连“符号处理”或“信息加工”都算不上，更谈不上智能。机器呈现的智能外观经历了问题形式化——形式转换——形式问题化的过程。形式化领域与非形式化领域之间存在鸿沟，机器不能离开人类智能对两者进行转换。机器展示的智能外观在两端都依赖人类智能，其所做的只是中间过程中的形式转换。机器输出结果时体现出来的“关联性”或“关于性”是人类程序设计者赋予的。福卢扎（Forouzan）认为，计算机对以位模式存储的数据类型及意义不存在“知道”或者“理解”等意向性状态，解释位模型的任务是由输入和输出设备完成的。“当数据输入计算机时，它们被编码，当呈现给用户时，它们被解码。”^([\\\
    [106\\]](#txt003.html#footnote_content_txt003_106))卢格尔认为：“人类智能的特点是自关联、自解释，而人工智能关于什么，符号表示什么，则依赖于设计者事先或事后的解释。”^([\\\
    [107\\]](#txt003.html#footnote_content_txt003_107))\n\n计算机进行数据加工、处理，依赖人对计算结果进行解释。人类智能的意向性为原始意向性，程序编制者以及输出翻译者施加给人工智能的意向性为派生意向性。塞尔强调：“派生的意向性并不是真实的意向性。”^([\\\
    [108\\]](#txt003.html#footnote_content_txt003_108))区别原始意向性与派生意向性的决定因素是意识，“不参照意识而企图描述和说明意向性是一深刻的错误。”^([\\\
    [109\\]](#txt003.html#footnote_content_txt003_109))\n\n（二）以非自然主义意向性为基础的原生意向性学说\n\
    \n1.对自然主义意向性的质疑\n\n第一，人工智能的处理程序包含认知和理解的内容，通过编程可以解决“关于性”“关联性”的问题。“关于性”“关联性”不单存在于词语与现实世界之间，以解释词语的词语即解释程序为媒介建立的联系也应当被认为具有语义理解能力。\n\
    \n第二，自然主义意向性是如何产生的，这一问题超越了人类的理解。“神经蛋白承载着意向性，但是作为神经蛋白，它是怎样具备这种能力的，我们却一无所知。”^([\\\
    [110\\]](#txt003.html#footnote_content_txt003_110))以自然主义意向性为基础考察人工智能的意向性难免陷入不可知论的困境。\n\
    \n第三，图灵测试是经验测试，而非逻辑主张。通过图灵测试是机器具有心智的必要条件之一，但并非充分条件。“中文房间”思想实验能够证明不具有心智或意向性的形式系统可以通过图灵测试，但不能证明具有意向性的形式系统是不存在的。\n\
    \n第四，哈瑞认为塞尔将大脑人格化并将意向性归属于人类大脑的观点是错误的。“我们的大脑不理解。它们没有赋值或思考意义。”^([\\[111\\]](#txt003.html#footnote_content_txt003_111))具有意向性的是人而非人的大脑。计算机不能作为人的模型，但是可以作为人脑的模型。\n\
    \n2.人工智能的原生意向性\n\n以唯物主义为理论基础的人工智能研究认为，人类智能是人的大脑的物质性作用于现实世界的结果，人类智能并非智能的唯一形态，与人脑相同或类似的物质实体也可以创造智能。早期人工神经网络探索者，如设计“感知机”的弗兰克·罗森布拉特（Frank\
    \ Rosenblattt）将模式识别能力等同于意向性。输入信息形成的模式在符合原有模式的情况下会被识别出来。“输入节点就是神经网络‘看到’的，输出节点就是网络所‘做’的或‘得出的结论’。从某种意义上来说，隐藏单元表述了网络在做出动作之前，是如何考虑它所看到的程序以及如何理解输入信息的意思。”^([\\\
    [112\\]](#txt003.html#footnote_content_txt003_112))如何让人工智能具有原始、自发的意向性？卢格尔持乐观主义的态度：“一个经过适当训练的神经网络能够有效地识别出新的实例，具有像人一样的相似性感觉能力。”^([\\\
    [113\\]](#txt003.html#footnote_content_txt003_113))\n\n（三）否定意向性的观点\n\n罗蒂、费耶阿本德提出了否定意向性的观点。他们认为，意向性系杜撰的结果。人是句法机，所谓的意义、心理不过是大脑神经的活动。意向性、意义、信念、心理等概念类似于“前科学术语”，会随着科学体系的成熟逐渐退出历史舞台。斯蒂克曾言：“我一直怀疑的是：关于意义和意向内容的常识概念具有完善性和科学上的有用性。”^([\\\
    [114\\]](#txt003.html#footnote_content_txt003_114))他认为，意向实在论混淆了意向状态内容归属与意向状态实在。内容归属是将意向状态归属于自己或他人。“意向实在论的问题在于：把归属与实在混同起来了，以为一旦作了意向状态归属，就意味着被归属的人内部有意向状态实在。”^([\\\
    [115\\]](#txt003.html#footnote_content_txt003_115))\n\n意向性是一个具有哲学内涵的争议性问题。在弱人工智能时代，意向性以自然人的意向性为参照系。伴随计算机科学的飞速发展，以算法和数据为基础呈现的意向性在外观上不断向自然人的意向性趋近。机器深度学习的出现将人工智能的意向性推向新的发展阶段。人工智能的意向性与自然人的意向性具有了类似的、不可言说的内在机理。但是，目前人工智能的意向性与自然人的意向性仍相差甚远，未来人工智能能否具备与自然人相当的意向性犹未可知。未来人工智能的意向性是模拟自然人意向性还是创构型意向性取决于技术研发的水平。\n\
