    \ 年版，第57 页。\n\n\uFEFF\n\n第三章　人工智能时代民事法律责任规则设计的理论预设\n\n民事法律责任规则体系的构建以一定的理论预设为基础。传统民事法律责任规则体系是建立在人类中心主义、人作为唯一的智能主体和法律主体、法律主体与法律客体不可转化、责任制度功能多元化等理论预设基础上的。计算机科学与认知科学的发展在一定程度上改变甚至颠覆了上述理论预设。本书拟梳理人工智能技术发展的演变过程，揭示人类对智能的认知，发现智能革命对民事法律责任规则体系乃至整个社会生活造成冲击与挑战的根源及表现形式，对理论预设进行修正或重构，为人工智能时代民事法律责任规则的理论研究和制度设计提供条件。\n\
    \n第一节　未来图景的理论预设\n\n人工智能源于人类智能，是人类智能的创造物，这一事实无可否认。但是，作为人类智能创造物的人工智能是否会替代或超越人类智能具有不确定性。生命的起源、人脑的奥秘一直是科学家孜孜以求的问题。“阿尔法狗”（AlphaGo）与人类围棋高手的对决，牵动亿万观众的心。不少观众关注的并不是围棋博弈，而是人工智能与人类智能的较量。当“阿尔法狗”战胜人类高手时，不少人深思，是机器战胜了人类还是人类自己战胜了人类？未来人类对机器能否绝对控制？完美人类版本（perfect\
    \ version）是否意味着人类时代的终结？\n\n一、人工智能威胁论"
