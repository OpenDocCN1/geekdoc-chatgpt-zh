    ## 第二章　人工智能时代民事法律责任规则的基本范畴


    概念范畴是构筑金字塔式法学理论体系和法律规则体系的根基。设计人工智能时代民事法律责任规则体系首先需要厘清其赖以存在的基本概念范畴。但是，“从理论与学说的角度来看，无论是描述性的还是预测性的，目前的理论界尚未就什么是人工智能的问题达成一致的认识，而且也缺乏主要的概念范畴。”^([\[1\]](#txt003.html#footnote_content_txt003_1))这就需要梳理人工智能时代民事法律责任规则体系的基础范畴。


    '
  toc: []
- raw: '第一节　智能形态领域的基本范畴


    厘清基本范畴的目的是明确研究问题的指向，避免因无谓的概念之争冲淡研究主题。“我们真正的意图绝不在于口舌之争，在字面上夸夸其谈。真正应该做的事是实干巧干，借计算机时代来临的大好契机，率先在全世界推行脑力劳动机械化，以具体成就向世人表明我们的主张。”^([\[2\]](#txt003.html#footnote_content_txt003_2))人工智能时代区别于前人工智能时代的外在表象是智能形态和智能主体类型多元化。这一外在表象下隐藏着对“智能”这一基本概念在认识上的变化。以“智能”为基石范畴构建人工智能时代民事法律责任规则体系是应对传统法学理论和法律制度遭遇冲击的结果。


    一、智能


    智能是构建人工智能时代民事法律责任规则体系的基石范畴。对智能的认识直接影响民事责任主体规则、过错规则等的设计。关于什么是智能，存在认识上的分歧，这些分歧也成为人工智能时代民事法律责任规则研究的隐形障碍。杰夫·霍金斯（J.Hawkins）认为：“人工智能正面临着一个根本的错误，因为它无法圆满地解决什么是智能的问题，或者说‘理解某个事物’到底意味着什么。”^([\[3\]](#txt003.html#footnote_content_txt003_3))


    （一）智能的内涵：形式的信息处理vs.符号与现实世界的关联


    1.形式转化解读方式：计算主义的认识论基础


    在静态符号系统理论假设下，“智能是一种形式的信息处理”^([\[4\]](#txt003.html#footnote_content_txt003_4))，“任何一个系统，如果能表现出智能，必须执行如下六种功能：输入符号、输出符号、存储符号、复制符号、建立符号结构、条件性转移。反之，如果任何一个系统具有上述六种功能，就能表现出智能。”^([\[5\]](#txt003.html#footnote_content_txt003_5))计算主义以形式转换作为解读智能的认识论基础。智能是在一定规则约束下进行的形式转换。“人类的思维就是运算，而运算不过是符号转换，这转换是由规则控制的。”^([\[6\]](#txt003.html#footnote_content_txt003_6))换言之，初始状态下的符号形式，在一定运算规则下，从一种符号状态转化为另一种符号状态。这种符号转化通常具有多重性，层层递进，进入最终的输出状态。


    形式转化的解读方式为机器智能提供了技术上的可行性，使其存在和发展具有了正当理由。智能特性存在于形式意义和量的意义上。具备在一定规则下进行符号转化的能力就具有智能属性，与质料无关。“智能不是人所独特的，而是许多事物共有的形式特征。图灵的‘通用图灵机’构想就是对上述思想的具体诠释。”^([\[7\]](#txt003.html#footnote_content_txt003_7))从通过计算表征智能的角度看，人与计算机在结构或构造上具有相通之处。人的神经网络系统如同计算机的硬件是产生智能的有形基础条件，而人的心智如同计算机的软件是产生智能的无形基础条件。


    将智能等同于形式转化的做法因其机械性遭受质疑，形式转化意义上所谓的智能被认为无法与人类智能媲美。物理方式的逻辑运算并非真正的思维，它依靠的是计算机的蛮力而非智力。迈克尔·海姆将人工智能比作炼丹术，认为计算机是在衍生的可理解层面进行工作，批判将智能等同于形式模式处理的做法。^([\[8\]](#txt003.html#footnote_content_txt003_8))哈肯认为，人脑的工作机制不同于图灵机，“当图灵机产生一组数字作为一个数字问题的解时，是人给这些数字赋予了具体的含义。如果图灵机发现一个问题不可判定，人可以确定真正发生的事件！”^([\[9\]](#txt003.html#footnote_content_txt003_9))德雷福斯认为，即便通过处理自然语言的程序设计使得计算机表面上具有理解符号意义的能力，计算机也并非语义机。以图灵机为基础的数字计算机只能对形式化的、确定的、离散的信息进行处理，不具有意向性，无法完全模拟人类智能。


    2.意向性解读方式：符号与现实世界的关联性


    赛尔（John Searle）提出“中文房间”（chinese room）的思想实验质疑符号主义、图灵测试关于智能的判断。在该思想实验中，完全不懂中文的被测试者能够以假乱真地让房间外的人确信其懂得中文。基于这一实验，赛尔主张，思维不应归因于模拟人类智能处理符号的程序。符号处理程序不构成“思维”（thinking）或“理解”（understanding），因为它缺乏“意向性”，即处理意义的能力。符号的形状是语法属性的（syntactic
    property），其意义是语义属性的（semantic property），计算机仅回应语法属性。“中文房间”输出的符合中文表达要求的语句表面上看是回应输入该房间的信息，但是，“中文房间”内处理信息的过程只针对输入内容的形状或语法属性，并不涉及理解或思维。


    赛尔“中文房间”思想实验试图揭示智能的特征不在于形式转换，而在于将符号与符号所指向的现实世界相关联并对内容或意义进行处理。形式转换能力并非理解能力和思维能力。智能外观反映的是符号与符号之间的关联，而非符号与现实世界之间的关联。人类明白符号背后的意义，而机器只能进行形式转换。霍金斯称：“我认为塞尔的解释是正确的。认真思考过中文屋实验的论据和计算机的工作原理之后，我没有看到任何地方有‘理解’的发生。”^([\[10\]](#txt003.html#footnote_content_txt003_10))


    （二）智能的外延：人类智能与人工智能的关系


    1.以计算主义为基础的平行关系说


    计算主义以人类智能与人工智能之间是平行关系为理论基础。计算机与人类在通过计算展现智能这一本质上是相同的，但是在计算方式、内在机理、基础材料方面迥异。人类通过大脑或心灵完成计算过程展现智能；计算机通过程序设计、符号运算完成计算过程展现智能。一方面，人类智能与人工智能在外在形式上有相似之处，人工智能可以从人类智能中得到启示；另一方面，人工智能不是也不可能是对人类智能的简单的模拟。


    2.以联结主义为基础的模拟关系说


    “符号主义试图用符号系统来模拟隐藏在人类认知中的某些功能，尤其是推理和语言能力。而联结主义则试图用联结主义网络或人工神经网络来模拟认知现象。”^([\[11\]](#txt003.html#footnote_content_txt003_11))联结主义奉行模拟关系说，通过模拟人脑神经网络构建人工神经网络进而创造出类似于人类智能的人工智能。模拟关系说认为人工智能是对人类智能的模拟和效仿。计算是一种动力学现象，而人工智能研发需要以认知科学、生物学为基础，在这一意义上人工智能是计算机模拟人的认知系统的产物。该模拟不仅体现在外在的智能表现形式上，而且表现在内在运行机理的一致性上。模仿人类大脑和心灵是人工智能研发的关键，人工智能发展史就是计算机不断趋近于人类的历史。


    伴随计算机算力增强以及智能驾驶汽车、医疗机器人、工业机器人在社会生活中的应用和推广，人们对人工智能认知能力的固有认识逐渐发生转变，将机器智能视为对人类智能的模仿或还原的观点遭到质疑。“我们希望机器做数学题像人那样缓慢和不精确？智能机器不应利用自己的优势，如大型、快速和可靠的存储器，而宁愿试图竭力效仿人的认识？”^([\[12\]](#txt003.html#footnote_content_txt003_12))


    （三）智能的表征：任务导向vs.目标导向


    1.任务导向路径（task oriented approach）


    在任务导向路径下，智能机器是能够完成需要人类智能才能完成的任务的机器。它将智能与某项特定任务（perform particular intellectual
    tasks）相联系。学者对智能主体是否具有唯一性的认识不同，任务导向路径中智能与完成某项特定任务之间建立的关系存在差异。根据多元化智能主体观点，设定的某项特定任务被认为是主体拥有智能的标准或门槛。只要机器能够完成该特定任务，就认为其具备了智能特征，属于人工智能。而根据单一化智能主体观点，设定的某项特定任务是否定该任务继续作为判断智能标准的依据。机器完成设定的某项特定任务，并不意味机器具备了人工智能，只意味着设定的某项特定任务不再能够作为智能的表征。例如，人类在不同时期分别将在跳棋、国际象棋、围棋等棋类竞技中获胜作为智能表征。随着计算机技术的发展，机器相继战胜了各项棋类中顶尖的人类棋手。完成跳棋、国际象棋、围棋等棋类博弈的里程碑事件并不表明机器智能化，只表明该类任务不能再作为智能的表征。


    2.目标导向路径（goal oriented approach）


    麦卡锡将智能界定为“达到目的的计算能力部分”。“机器达到目标的工作”是卢塞尔和诺米格体系中“理性行为”（acting rationally）的关键要素，他们在操作性定义人工智能（operativedefinition）过程中使用理性主体（rational
    agent）的概念。这种个体行为的目标是取得最好的结果或者期望的最好结果。从规制的角度看，目标导向路径似乎并非特别有帮助，因为它将难于界定的智能（intelligence）概念替换为了目标（goal）。按照通常的说法，目标是意图（intention）的同义语，机器是否以及何时能够拥有意图是一个更为形而上学的问题，而非法律或科学的问题，界定目标（goal）时难以避免会创造一个过度包容（over-inclusive
    definition）的概念以涉及意图（intent）和自我意识（self-awareness）。^([\[13\]](#txt003.html#footnote_content_txt003_13))


    二、人工智能


    明确人工智能的概念是包括法学学科在内的社会科学研究人工智能的起点。“法律上对人工智能的界定是极为重要的，只有清晰地界定了人工智能到底是什么，才能真正解决人工智能的法律地位问题。”^([\[14\]](#txt003.html#footnote_content_txt003_14))相反，无法就人工智能概念达成共识会增加人工智能时代新型民事法律责任规则设计的难度。^([\[15\]](#txt003.html#footnote_content_txt003_15))


    作为舶来品的人工智能概念源于美国。1956 年6 月，在达特茅斯（Dart⁃mouth）学院，麦卡锡、明斯基、罗切斯特、香农组织召开了“人工智能暑期专题研讨会”，正式提出人工智能的概念，开启了“以串行符号处理为特征的经典人工智能研究”，人工智能成为计算机科学的研究对象。^([\[16\]](#txt003.html#footnote_content_txt003_16))随着人工智能技术的发展与应用，人工智能的概念呈扩张和渗透态势，从自然科学领域延伸至社会科学领域，成为哲学、政治学、社会学、伦理学、文学、法学、教育学研究的对象。


    在当下，人工智能是一个被普遍使用却未被精确定义的概念。“将人工智能定义为，机器能够完成人类需要智能才能够完成的任务”^([\[17\]](#txt003.html#footnote_content_txt003_17))，这一循环定义的方式十分流行。社会大众对人工智能不再陌生，是茶余饭后闲谈的话题。人工智能专业领域的科学家、技术工作者、商务人士以及政策制定者也在不同语境下使用人工智能的术语。^([\[18\]](#txt003.html#footnote_content_txt003_18))“由人工智能延伸出的语词，如人工智能技术、人工智能系统、智能机器人等，多者混用使得人工智能本身的概念愈加模糊。”^([\[19\]](#txt003.html#footnote_content_txt003_19))


    差异化的概念在特定语境下具有存在的正当性，相互之间难以进行“对与错”或“优与劣”的判断。试图一劳永逸地对人工智能概念进行统一界定，是对人的有限智识的挑战，一方面不能满足不同研究者的需要，另一方面不符合人工智能的开放性与发展性特征。梳理人工智能的概念，揭示其差异以及差异产生的语境，明确概念指向，有助于形成共识性概念体系，避免无谓的争论。


    （一）语境论视角下的概念界定


    1.学科语境下的人工智能概念：以计算机科学为缘起


    图灵奖获得者约翰·E.郝普克若夫（John E.Hopcroft）认为：“计算机科学将为认知科学提供各种模型和概念工具。”^([\[20\]](#txt003.html#footnote_content_txt003_20))它具有重塑智力世界的功能，开启了认知科学的新篇章。计算机科学为人工智能的出现和发展提供了科学基础，使其从空想转变为现实。人工智能作为独立学科在计算机科学领域得以确认。如卢格尔认为：“人工智能是计算机科学中关于智力能力自动化的分支。”^([\[21\]](#txt003.html#footnote_content_txt003_21))


    在技术论路径下，人工智能的概念在计算机科学的体系中找到了归属。涉及认知科学、数学、计算机科学、信息论、逻辑学、神经科学、生物学等诸多学科的人工智能问题在计算机科学这一学科中找到了发展的根基，确立了独立学科的地位。作为计算机科学这一自然科学的新分支的人工智能学科，起到了凝聚和整合人工智能相关研究的作用。它将认知科学、数学、计算机科学、信息论、逻辑学、神经科学、生物学等诸多领域关注人工智能的学者凝聚在一起，以计算机科学为中心展开研究，为人工智能后续的蓬勃发展创造了条件，使人工智能免于因处在交叉学科状态而不受关注。换言之，以计算机科学为中心的人工智能概念，在确立人工智能的独立学科地位以及凝聚和整合研究力量方面功不可没。


    但是，对人工智能的研究绝不应当仅限于计算机科学领域，突破人工智能科学和技术的瓶颈往往需要各个学科共同协力。此外，人工智能引发的相关社会问题日益凸显，哲学、伦理学、文学、法学、政治学等社会科学纷纷将人工智能作为其重要的研究对象。^([\[22\]](#txt003.html#footnote_content_txt003_22))继续将人工智能概念界定为以智能机器自动化为研究对象的计算机科学的分支，无异于画地为牢，不利于人工智能的创新与发展。


    时至今日，人工智能在计算机科学中寻求学科独立性和归属的历史正当性不复存在。在新的历史时期，人工智能学科需要脱离依附于计算机科学的状况，成为整合计算机科学、生物学、数学、医学、哲学、伦理学、文学、法学、政治学等学科相关内容的独立交叉学科。也就是说，人工智能学科是具有“名副其实的交叉性质”的学科门类，^([\[23\]](#txt003.html#footnote_content_txt003_23))属于未来学的范畴，是具有科学色彩的未来学的核心内容。


