    # （二）智能投资顾问运营者自主设计算法时的责任主体

    在智能投资顾问运营者自主设计算法时，设计者和使用者合一，智能投资顾问运营者需要作为责任主体承担相应的民事法律责任。第一，风险控制规则。从风险控制的角度而言，智能投资顾问运营者作为设计者和使用者，参与了智能投资顾问活动的整个过程，是最佳的风险控制者。由智能投资顾问运营者作为智能投资顾问行为的民事责任承担主体，在救济受害人的同时可以达到风险控制的目的，具有合理性。第二，延展规则。智能投资顾问运营者与智能投资顾问系统的关系犹如人的身体与借助工具的延展部分。智能投资顾问运营者借助智能投资顾问系统为投资者提供投资咨询和资产管理服务，因延展部分造成的损害需要由智能投资顾问运营者承担。第三，使用者承担规则。电子代理人的责任采用使用者承担规则。美国统一电子交易法规定，如果一个人使用电子代理人作出真实的意思表示，那么电子代理人的行为归诸于使用者，即使该电子代理人的行为没有被使用者知晓或者预览过。^([\[43\]](#txt007.html#footnote_content_txt007_43))


    基于算法缺陷导致的损害既可能源于主观因素也可能源于客观因素。主观算法缺陷，是指智能投资顾问运营者因故意或者过失产生的算法缺陷。客观算法缺陷，是指因技术水平限制而产生的算法缺陷。倘若该算法缺陷超出了当时环境下技术人员的认知水平，智能投资顾问运营者可以主张免责。


    # （三）智能投资顾问运营者使用第三方算法时的责任主体

    ## 1. 前置金融行为主体承担责任的规则：以技术中立为前提

    智能投资顾问行为中的金融行为经由智能投资顾问系统的研发与设计被前置。金融从业人员以及程序设计者参与了智能投资顾问系统的设计。这些人员虽然没有直接向客户提供咨询意见或参与交易活动，但是他们为智能投资顾问系统提供的金融模型或程序设计对后续交易可能产生实质影响。“金融人员的专业判断、职业伦理和利益衡量会直接影响到模板的设计。因此，立法者需要将参与前置程序设计的金融人员纳入受托人的范围之内”^([\[44\]](#txt007.html#footnote_content_txt007_44))。


    前置金融行为中金融机构或人员与程序设计者扮演的角色不同。金融机构或人员提供设计目标，程序设计者通过技术方式将该设计目标转化为一定的算法或模型。在程序设计者的行为具有技术中立特征的前提下，程序设计者是将金融机构或人员的想法予以实现的辅助人，即“程序设计者类似于受托人的辅助人，除非故意或者过失造成投资者损害，否则并不承担赔偿责任”。^([\[45\]](#txt007.html#footnote_content_txt007_45))


    ## 2. 智能投资顾问运营主体承担责任的规则

    ### （1）智能投资顾问业务中运营者与程序设计者的责任划分

    智能投资顾问系统通常是由第三方科技公司研发的。在智能投资顾问系统的设计者与使用者分离的情况下，如何划分两者的责任？一般而言，智能投资顾问系统的设计行为作为使用行为的辅助，设计者没有完全独立于使用者的意图，智能投资顾问行为的法律后果归属于使用者。智能投资顾问系统设计者的行为具有从属性或附属性的特征，是使用者意图的延伸。在这一意义上，智能投资顾问系统类似于自动售货机，设置智能投资顾问系统的使用者承担相应的法律后果。需要区分提供交易和决策模型的金融从业者与程序设计者。前者应当认定为受托人，承担信义义务；后者仅是受托人的辅助人，应承担产品设计者的义务，不承担信义义务。^([\[46\]](#txt007.html#footnote_content_txt007_46))但是，在特殊的情形下，设计者的行为具有独立性，并非服务或辅助使用行为。第三方科技公司可以通过算法设计将特定主体提供的金融产品置于优先位置。这需要考察使用行为能否切断设计行为与使用结果之间的关联。因果关系被切断，使用者承担责任；因果关系未被切断，设计者或使用者根据因果关系各自承担相应的责任。


    ### （2）连带责任或不真正连带责任规则

    美国数据创新研究中心采用“有效控制+识别与纠正”双层标准判断智能投资顾问受托人是否需要承担责任。第一，智能投资顾问受托人是否对智能投资顾问行为进行了有效控制。第二，智能投资顾问受托人是否对智能投资顾问行为的有害结果进行识别和纠正。如果二者均未做到，智能投资顾问受托人承担全部责任；如果只做到其中之一，承担部分责任。需要注意的是，这里的责任主要是智能投资顾问受托人对监管者负有的责任。^([\[47\]](#txt007.html#footnote_content_txt007_47))智能投资顾问业务中运营者因过失从第三方购买存在缺陷的算法并导致损失，倘若该算法缺陷是设计时可以采取措施予以避免的，运营者需要与第三方承担不真正连带责任，内部按照各自的过错承担责任。智能投资顾问业务中运营者故意从第三方购买存在缺陷的算法，运营者需要承担连带责任。


    ### （3）介入规则

    澳大利亚的《电子顾问监管指南》明确要求，智能投资顾问运营者需要配备具有金融和数字技术的专业人员，负责对智能投资顾问系统进行日常维护和调适。这些人员在法律地位上属于智能投资顾问运营者的辅助人。负责维护和调试的金融人员的行为指向过程还是结果？在以过程监督检查为主的模式下，金融人员需要保障算法和模型在运算过程中满足适当性义务、忠实义务、勤勉义务等要求；在以结果监督检查为辅的模式下，金融人员根据算法结果调试算法。金融人员通常不直接与投资者接触，其主要义务是维护和调试智能投资顾问系统，使其持续满足提供适当服务的要求。当智能投资顾问系统所提供的服务在程序或结果上存在瑕疵时需要自然人介入，包括直接为投资者提供金融服务。


    ### （4）算法合谋的民事法律责任规则

    智能投资顾问是以算法和数据为基础为投资者提供服务的，算法趋同会导致“一致行动人现象”产生。《上市公司收购管理办法》第83 条^([\[48\]](#txt007.html#footnote_content_txt007_48))对“一致行动”进行了界定。倘若在智能投资顾问服务中，众多投资人选择了同一智能投资顾问系统，则算法和模型的趋同会使互无关联的投资人之间在行动上出现一致性，进而增加市场风险。“如果某智能投顾为其所有用户提供的投资于某只上市公司股票的投资建议合计达到5%时，就需进一步判断该智能投顾是否有谋求对该只股票甚至该家上市公司施加影响力的意图。”^([\[49\]](#txt007.html#footnote_content_txt007_49))算法合谋在竞争法规制方面已经受到关注。但是，算法合谋致损的民事法律责任规则没有得到足够的关注，需要建构或完善。


    ### （5）智能投资顾问运营者与经纪—交易商的责任承担规则

    仅有权提供投资咨询服务业务的智能投资顾问经营者需要与经纪—交易商合作，共同为投资人提供资产管理服务。智能投资顾问经营者与经纪—交易商往往会通过协议的方式成为利益共同体。智能投资顾问经营者在为投资者提供投资建议时，可能优先考虑经纪—交易商发售的金融产品。“在收取交易佣金的收费模式下，投资顾问为了从经纪—交易商那里尽可能多地赚取交易费，可能会诱使投资者进行频繁交易而损害投资者利益。”^([\[50\]](#txt007.html#footnote_content_txt007_50))这就需要设置过度交易禁止规则。


    # 二、归责原则

    ## （一）过错责任原则说

    机器自主学习使智能机器（人）能够在环境中自主生成算法或模型，智能机器（人）的行为结果可能与预先设定的目标之间出现差异。智能投资顾问系统导致的部分损失超出了设计者或运营者的预料，无法进行预防。苛责智能投资顾问系统的运营者承担责任，将增加运营者的负担进而阻碍技术进步与创新。过错责任规则限定了智能投资顾问系统运营者的经营风险，有利于智能投资顾问系统的应用和创新，也有利于鼓励金融科技创新。“在过错标准上，可以适用一般过失标准，而不要求故意，否则智能投资顾问的控制人就很容易逃避责任。过错责任很好地平衡了两个目标：保护创新和避免责任缺位。”^([\[51\]](#txt007.html#footnote_content_txt007_51))智能投资顾问的专业性加之算法的秘密性使得证明运营者主观过错非常困难。基于这一认识，主张过错责任原则说的学者大多认为在智能投资顾问活动中应当根据过错推定原则追究智能投资顾问运营者的民事法律责任。


    算法尤其是学习算法是否存在缺陷是一个相当复杂的技术性问题，这使就算法缺陷举证变得复杂。智能投资顾问运营者与金融消费者在专业知识、人力和物力方面差异显著，认定智能投资顾问运营者是否需要承担民事责任时应采用举证责任倒置的方法。举证责任倒置的证明制度能够起到矫正正义的作用，为处于弱势地位的投资者提供倾斜保护。金融消费者就智能投资顾问业务中存在损害以及算法缺陷与损害结果之间可能存在因果关系等初步证据举证后，举证责在转移至运营者一方，运营者需要对其主观上没有过错、行为的正当性以及免责事由等进行举证。


    ## （二）无过错责任原则说

    智能投资顾问运营者是算法设计和应用的源头，具有防控技术风险的能力，其对算法缺陷导致的损害需要承担无过错责任。对智能投资顾问业务中的运营者采用无过错责任原则有利于保护投资者利益。“当投资者财产遭受智能投顾相关营运者不法行为损害时，相关营运者对投资者均承担无过错责任”。^([\[52\]](#txt007.html#footnote_content_txt007_52))“对于违反信义义务的法律责任的成立，只需智能投顾运营者违反法定的信义义务即可，智能投顾运营者在主观层面上是否具有过错在所不问。”^([\[53\]](#txt007.html#footnote_content_txt007_53))


    ## （三）相关学说评析

    算法的复杂性和不可解释性使得智能投资顾问运营者在主观上是否存在过错的问题难以通过举证的方式证明或证伪，与其争论不休，不如基于保护弱势群体利益的理念将可能的损失转嫁至处于相对优势地位的一方即智能投资顾问运营者。因而，智能投资顾问运营者民事法律责任的构成要件为“须存有智能投顾法律关系、须有违反信义义务之行为和投资者须因信义义务之违反而受有损害”^([\[54\]](#txt007.html#footnote_content_txt007_54))。主观过错被排除在智能投资顾问运营者违反信义义务的民事责任构成要件之外。为防止无过错原则对智能投资顾问运营者过于严苛，法律应当规定一定的例外情形。“如果投资者所受损害，是因其自身原因、市场行情变化所致，或者智能投顾运营者的行为符合投资目的的要求，那么投资者所受的损失与智能投顾运营者违反信义义务的行为之间则无法律上的因果关系。”^([\[55\]](#txt007.html#footnote_content_txt007_55))


