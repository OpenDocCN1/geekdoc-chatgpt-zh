    ## 智能投资顾问的责任主体与归属

    智能投资顾问中，智能投资顾问机器（人）不作为责任主体。在智能投资顾问运营者自主设计算法时，设计者和使用者合一，智能投资顾问运营者需要作为责任主体承担相应的民事法律责任。智能投资顾问运营者使用第三方算法时，以技术中立为前提，前置金融行为主体需要承担民事法律责任。智能投资顾问系统的设计行为作为使用行为的辅助，设计者没有完全独立于使用者的意图，智能投资顾问行为的法律后果归属于使用者。智能投资顾问系统设计者的行为具有从属性或附属性的特征，是使用者意图的延伸。智能投资顾问系统类似于自动售货机，设置智能投资顾问系统的使用者承担相应的法律后果。在设计者的行为具有独立性的情形下，设计者的行为并非服务或辅助使用行为，需要根据因果关系各自承担相应责任。智能投资顾问业务中运营者因过失从第三方购买存在缺陷的算法并导致损失，倘若该算法缺陷是设计时可以采取措施予以避免的，运营者需要与第三方承担不真正连带责任，内部按照各自的过错承担责任。智能投资顾问业务中运营者故意从第三方购买存在缺陷的算法，运营者需要承担连带责任。负责监督检查的金融人员一般不直接与投资者接触，其主要义务是对智能投资顾问系统进行维护和调试，使其持续满足提供适当服务的要求。当智能投资顾问系统所提供的服务在程序或结果上存在瑕疵时需要自然人介入，包括直接为投资者提供金融服务。智能投资顾问中还需要限制算法合谋以及禁止运营者与经纪—交易商过度交易。算法的复杂性和不可解释性使得智能投资顾问运营者主观上是否存在过错难以通过举证的方式证明或证伪，需要基于保护弱势群体利益的理念将可能的损失转嫁至处于相对优势地位的一方即智能投资顾问运营者，将无过错责任原则作为确定智能投资顾问运营者责任的规则具有正当性。但是，为避免无过错原则对智能投资顾问运营者过于严苛，法律应当规定一定的例外情形。


    ## 风险社会中的责任规则嬗变与保险机制

    风险社会中部分行为的可责难性被弱化，人工智能时代民事法律责任规则的设计重心从责任承担转向损失分配。人工智能时代责任规则发生嬗变，责任制度的部分功能转移至责任保险和赔偿基金等制度。责任制度因保险制度的出现需要进行调整，但是责任保险制度不会弱化或取代民事责任制度。人工智能时代的责任保险类型包括智能机器（人）事故责任保险、智能机器（人）产品责任保险等。在智能机器（人）生产与智能服务分离的情形，“双轨制承保模型”具有优势，相反，在智能机器（人）生产与智能服务合一的情形，“单一制承保模型”具有优势。救济受害人不能成为智能产业创新的障碍，需要通过限额赔偿等配套制度予以平衡、协调。我国需要在数据统计和分析的基础上，确定适当的赔偿限额，在受害人权利救济与智能产业创新和持续健康发展之间进行平衡。人工智能风险与核能风险类似，都是因科技进步而产生的新型社会风险，可以借鉴核能领域的“双层保险”规则。双层保险中的“第一层”保险是直接责任主体为分散风险而投保的保险，“第二层”保险是社会救助方式的变形。


    ## 人工智能时代的法律思考

    人工智能时代的帷幕已经被拉开。无论是出于自觉还是出于无奈，关于人类与智能机器（人）之间的关系的思考都无法避免。“人类命运共同体”的命题在人工智能时代被赋予了新的时代意义。“不谋万事者，不足以谋一时”，人工智能时代必须重视技术对社会生活造成的结构性和颠覆性冲击，处理好技术进步与制度创新之间的关系，立足当下并预测未来。民事法律责任规则设计需要在保障人类作为“类存在”福祉的前提下为科技进步扫清障碍。穿梭于现实与想象之间设计和构建民事法律责任规则体系是新时代法学人的“奇幻之旅”。


