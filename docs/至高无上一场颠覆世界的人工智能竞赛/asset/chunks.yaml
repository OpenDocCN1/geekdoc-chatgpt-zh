  trans: '

    Altman and Brockman seemed to justify their change of course on two fronts. On
    one hand, pivoting while accelerating is standard startup practice. On the other,
    the goal of AGI itself mattered more than the method of achieving it. Perhaps
    they had to break some promises along the way, but humanity would ultimately benefit.
    And they told employees and the public that Microsoft also wanted to use AGI to
    improve human life. The two were aligned in vision. Brockman wrote: "If we achieve
    this mission, we achieve the shared values of Microsoft and OpenAI to empower
    everyone."


    For years, apologists for Big Tech have argued that these companies'' technologies
    empowered the world, bringing value to humanity that even exceeded their trillions
    in revenue. Indeed, smartphones and social media ushered in an era of easy global
    connection and unlocked many new forms of entertainment and commerce. Apps like
    Google Maps and Facebook were not only free to use but offered many "slick" features
    that made our lives seem more convenient. But new technology came with a price
    tag: from the alienation of relationships and loss of privacy to screen addiction,
    mental health issues, political polarization, and widening inequality driven by
    increased automation—all fueled by a handful of companies.


    OpenAI triggered another major shift in how people use technology, much like Facebook
    sparked the social media craze, and aligning with Microsoft meant Altman was retracing
    Mark Zuckerberg''s steps. Zuckerberg''s company caused immense harm because its
    business model encouraged users to keep staring at screens. Pandora''s box had
    been opened: legacy issues like racism and gender bias in AI systems, AI hooking
    people on social media feeds, and the looming potential for catastrophic impacts
    on employment. If Altman had kept OpenAI non-profit and committed to sharing lab
    results with other scientists for rigorous scrutiny, he might have prevented these
    outcomes. But he allied with Microsoft, striking a Faustian bargain. He was no
    longer developing AI for humanity, but to help a giant corporation maintain dominance
    and gain an edge in a fierce competition. There was only one chance to stop him
    before the race truly began.


    # 11 Bound to Tech Giants


    From the outside, OpenAI''s transformation from a charity striving to save humanity
    into a company partnering with Microsoft looked strange, even suspicious. But
    according to employees inside OpenAI at the time, many felt partnering with a
    cash-rich tech giant was good news. Not only was their employer now better positioned
    to stay financially solvent, but they also stood a better chance of financial
    upside from massive investment rather than donations—and indeed they did. Over
    the next few years, Microsoft poured increasing sums into Altman''s company, allowing
    OpenAI employees to sell shares and become millionaires. Many researchers felt
    their mission hadn''t been betrayed. They had bought into the idea that the benefits
    of the path to AGI far outweighed the ethical qualms about getting there. As long
    as they stuck to the all-important Charter, the source of the money didn''t matter.
    This was Silicon Valley, after all, where programmers join startups trying to
    make the world a better place while earning seven-figure salaries and stock options
    enough to buy a second home in America''s most expensive real estate market.


    Not everyone was happy with the new status quo, though. Dario Amodei, a bespectacled,
    curly-haired engineer who had been probing OpenAI''s true mission since its inception,
    loved the goal of "protecting humanity from AI harm," even if Brockman admitted
    it was "somewhat vague" at the time. A Princeton graduate and a physicist unafraid
    to ask hard questions, Amodei had a basketful of doubts about Microsoft. It was
    obvious OpenAI''s mission differed from Microsoft''s; how could OpenAI remain
    committed to building safe AI when pressured to help Microsoft maximize profits?
    According to insiders, Amodei told colleagues: "We are building AI for humanity,
    but we are also providing technical support to a company that wants to maximize
    profit." It didn''t add up.


    Amodei oversaw much of OpenAI''s research, including work on language models.
    He was leading the team developing the next-generation model, GPT-3. Despite his
    displeasure at OpenAI''s binding to Microsoft, he had to admit the software giant
    provided the unparalleled compute they needed. In fact, just months after the
    investment, Microsoft announced it had built a supercomputer specifically for
    OpenAI to train AI.


    Amodei had rarely used a more powerful system. A typical home computer has a single
    CPU (Central Processing Unit)—a powerful rectangular silicon chip covered in billions
    of microscopic transistors. It is the computer''s brain, usually with 4 to 8 cores
    handling all necessary calculations. Microsoft''s new supercomputer, by contrast,
    had 285,000 CPU cores. If a home computer is a toy car, this machine was a tank.


    Gaming PCs are more powerful, typically equipped with GPUs that rapidly process
    complex visual data for smooth, beautiful graphics. These GPUs are now also used
    to train AI because they can perform vast numbers of calculations simultaneously.
    Microsoft''s new supercomputer had 10,000 GPUs. Simultaneously, its data transfer
    speeds were roughly 100 times faster than a regular computer, thanks to lightning-fast
    interconnects.


    While harnessing this new compute power, OpenAI also scraped massive amounts of
    text from the internet to train the new GPT language model. Like 19th-century
    oil prospectors, they drilled into the web''s vast content reserves and refined
    them into more capable AI. Researchers had already extracted about 4 billion words
    from Wikipedia, making the billions of comments shared on social media the next
    obvious source. Facebook wasn''t an option, though, because after the 2018 Cambridge
    Analytica scandal, Mark Zuckerberg''s platform banned other companies from scraping
    user data. But Twitter and Reddit remained largely open.


    Reddit, dubbed the "front page of the internet," covered every imaginable topic,
    from cars to dating to photos that look like Renaissance paintings. The company
    was close to Altman because he and Reddit''s founders had been in the first Y
    Combinator batch together. Filings before Reddit''s IPO in early 2024 showed Altman
    ultimately became the company''s third-largest shareholder, owning 8.7%. Altman
    had good reason to love Reddit: it was a "gold mine" of human conversation, ideal
    for training AI, as millions of users posted comments and voted daily. No wonder
    Reddit became one of OpenAI''s most important resources for training AI; according
    to someone familiar with the forum, its text accounted for 10% to 30% of GPT-4''s
    training data. The more text OpenAI used to train its language models, and the
    more powerful the computers, the more fluent its AI became.


    But Amodei couldn''t shake his unease. He and his sister, Daniela, who led OpenAI''s
    policy and safety teams, watched the models grow larger and more powerful, while
    no one on their teams—or in the company—fully understood the consequences of releasing
    these systems to the public. Binding with a powerful corporation now might subject
    them to greater pressure, even forcing them to release technology before rigorous
    testing.


    Demis Hassabis in London shared the same concerns. Around the time OpenAI prepared
    to release GPT-3, Sam Altman, Greg Brockman, Ilya Sutskever, and several DeepMind
    founders dined together, intending to gradually thaw relations between the two
    rival companies. The atmosphere was tense. According to insiders, Hassabis pointedly
    asked Altman why OpenAI released AI models publicly, warning that bad actors could
    misuse them to spread misinformation or build more harmful AI tools. Hassabis
    noted DeepMind was far more cautious about preventing AI misuse.


    Altman politely retorted that this was laughable. He subtly reminded everyone
    that Elon Musk had once mocked Hassabis with the game *Evil Genius*. Altman argued
    that secrecy gave dangerous control to the heads of AI companies, just like at
    DeepMind. That wasn''t safe either.


    Back in San Francisco, Altman began hearing similar views from Amodei, who complained
    incessantly about OpenAI''s new commercial direction. Altman called Reid Hoffman,
    an eternal optimist, to see if he could mediate. According to insiders, Hoffman
    sought out Amodei to understand the issue, gently urging the billionaire VC to
    have faith.


    "This is how we achieve the mission," Hoffman explained. Amodei and his sister
    were skeptical. They knew how large and complex these language models had become,
    and they knew Hoffman was a Microsoft board member. Wasn''t he a vested interest?


    The Amodei siblings were right to be wary of OpenAI''s deepening ties to Microsoft.
    Since OpenAI''s founding, Big Tech had sought to dominate AI development, pushing
    the technology toward greater power and generality while neglecting thorough risk
    research. A 2023 MIT study showed that over the past decade, large corporations
    had seized ownership of AI models, their control rising from 11% in 2010 to 96%
    in 2021—a near-total sweep. Even government projects paled before the billions
    Big Tech poured into AI. For instance, in 2021, US non-defense agencies budgeted
    $1.5 billion for AI; that same year, US private sector investment exceeded $340
    billion.


    Meanwhile, the inner workings of these commercial AI systems remained opaque.
    As OpenAI released more technology to the public, how it built these systems became
    increasingly mysterious, making it harder for independent researchers to scrutinize
    potential harms and biases. Imagine if a major food manufacturer like Unilever
    made increasingly tasty snacks but refused to list ingredients or explain the
    manufacturing process on the packaging. That is what OpenAI is doing. You probably
    know more about what''s in a bag of Doritos than what goes into a large language
    model.


    Amodei worried more about existential threats from AI than bias. He wrote a research
    paper titled "Concrete Problems in AI Safety." He emphasized that poorly designed
    AI systems could cause accidents. If AI developers specified the wrong objective,
    their systems could cause unintended damage. He wrote that if a house robot were
    rewarded for moving a box from one side of a room to the other, it might knock
    over a vase in its path because it was too focused on the goal. Amodei believed
    people needed to examine real-world accidents when AI is integrated into industrial
    control and healthcare systems.


    Ultimately, Amodei wasn''t swayed by Hoffman''s reasoning. He decided to leave
    OpenAI with his sister Daniela and six other researchers. But this wasn''t just
    a protest over AI safety and commercialization. Even among the most ardent AI
    worriers, opportunism existed. Amodei had seen Altman secure a $1 billion investment
    from Microsoft; he sensed more would follow. He was right. Amodei witnessed the
    dawn of a new AI boom. He and his colleagues decided to start an AI company named
    "Anthropic," named after the philosophical term for human existence to emphasize
    their primary concern for humanity. Anthropic would become a counterweight to
    OpenAI, just as OpenAI had once counterbalanced DeepMind and Google. Naturally,
    they also sought commercial opportunity.


    "We thought there was no ''moat'' in AI at the time," an Anthropic founder said.
    In other words, the field was wide open. "New organizations doing good work seemed
    to catch up to incumbents quickly. So we felt, why not build our own organization
    based on our own vision, with safety research at the core?"


    Amodei had played a key role in building two of OpenAI''s language models; now
    he could use the same prowess to create his own brand. He led the team in reviewing
    OpenAI''s transition from non-profit to for-profit, determining they didn''t want
    to repeat that history, as it would make them untrustworthy. So they formed a
    Public Benefit Corporation, placing social and environmental goals on par with
    shareholder interests—a legal structure used by ice cream brand Ben & Jerry''s.


    Besides DeepMind, Sam Altman now had a new rival, and one who knew OpenAI''s secrets
    was even more dangerous. As Amodei predicted, Anthropic almost immediately raised
    massive funds from a group of wealthy backers supportive of AI safety, including
    Jaan Tallinn and Dustin Moskovitz, the latter a Harvard roommate of Mark Zuckerberg,
    Facebook co-founder, and billionaire. Silicon Valley money circulates in a small
    elite circle, where long-standing rivalries exist. Moskovitz''s philanthropic
    organization, Open Philanthropy, had invested $30 million in OpenAI; Altman had
    funded Moskovitz''s software company, Asana. Yet Moskovitz also wanted to back
    OpenAI''s new rival. (Tallinn later said he regretted fueling such fierce competition
    that made AI more dangerous.)


    Within a year, Anthropic raised another $580 million, mostly from young crypto
    tycoons at the exchange FTX, who shared Amodei''s belief in Effective Altruism.
    But ironically, two years after Amodei complained about OpenAI''s commercial binding
    to Microsoft, he allied with two other giants—Google and Amazon—securing over
    $6 billion in investment. It turned out that in this new world where building
    AGI requires infinite resources, no one can refuse the olive branch extended by
    tech giants.


    Across the ocean in London, this binding became a burden for DeepMind. Demis Hassabis
    kept seeking new scientific breakthroughs to prove his company led OpenAI and
    could wow the world again post-AlphaGo. But co-founder Mustafa Suleyman still
    yearned to prove AI could be used for good. For years, he had been uneasy with
    how his friend Hassabis led the company. The chess prodigy seemed focused on developing
    AI through games and simulations, but Suleyman believed they should also study
    the real world, even if it meant handling messy data. If they didn''t solve these
    societal problems now, how could they later?


    He partnered with several London hospitals, using DeepMind''s AI to assist medical
    staff. The project started with an app that alerted clinicians when patients risked
    acute kidney injury. Due to medical regulatory hurdles, it didn''t use DeepMind''s
    advanced AI, but Suleyman bet the software would become far more precise once
    his AI scientists could train tools on proper medical data.


    Doctors liked the app; the project looked promising. Then the unthinkable happened.
    Media outlets suddenly reported that Google was accessing the records of 1.6 million
    London patients and attempting to mine sensitive data. Suleyman''s experiment
    instantly became a scandal. He was so convinced DeepMind would soon spin out of
    Google that he forgot the company technically still belonged to an advertising
    giant—Google made money by collecting user data and sharing it with advertisers.
    To the outside world, DeepMind''s efforts to use AI for healthcare suddenly looked
    suspect because of Google''s presence behind the scenes.


    Hassabis was stunned by the negative coverage of the hospital scandal, which seemed
    to erase the glory he''d won from AlphaGo''s Asian matches. It turned out that
    trying to train AI models on piles of real-world data—much like OpenAI scraping
    the web for its language models—could jeopardize DeepMind''s reputation, especially
    given its close ties to Google.


    Hassabis also seemed to doubt the utility of an independent ethics board, including
    the one he and Suleyman planned to guide the company post-spinout. But Suleyman
    was keen to try different governance structures; he set up a smaller review board
    to oversee DeepMind''s health projects, ensuring ethical execution. It comprised
    eight professionals from UK arts, science, and technology, including a former
    politician. They met four times a year to review healthcare research, talk to
    engineers, and flag ethical issues in DeepMind''s plans with hospitals and patients.


    This attempt at self-regulation was noble but doomed to fail. At OpenAI, DeepMind,
    and tech companies like Facebook, there was a widespread belief that independent
    boards were the best way to balance developing AI for humanity with profit-seeking,
    especially absent proper regulation. For instance, OpenAI established a board
    whose sole duty was to ensure the company developed AGI for humanity''s benefit.
    DeepMind hoped to set up a similar expert advisory group post-Google split. But
    inside a global giant driven by financial targets, these well-meaning governance
    structures are unsustainable. Altman learned a painful lesson. Suleyman also hit
    a wall; he didn''t want to force the health review board''s experts to sign NDAs,
    so they could freely criticize the company publicly. But that meant they couldn''t
    fully see DeepMind''s work, often operating in the dark. Since the board''s judgments
    weren''t legally binding, they complained they were "paper tigers." In reality,
    the board could do little. This is the core problem with self-regulation in tech:
    referees who are also players have no value, especially without legal force.


    The attempt failed. Google chose to grow its own health division and took over
    DeepMind''s collaborations with doctors and medical professionals. The search
    giant didn''t want outsiders constantly second-guessing its work, so it disbanded
    Suleyman''s review board. Another dead end for Google and the tech industry in
    self-regulation. Earlier that year, Google had already shut down an AI advisory
    council after just one week due to public backlash over a member with anti-LGBTQ
    views. These point to a broader systemic issue: AI''s rapid development has outpaced
    regulators and lawmakers. Tech companies operate in a legal vacuum; technically,
    they can do whatever they want with AI. Well-meaning experts try to police their
    own companies with various committees and legal structures, but ultimately, they
    still work in a system that must prioritize shareholder returns and financial
    growth. That is why, after long and arduous efforts, DeepMind''s attempt to spin
    out of Google also ended in failure.


    On a cloudy April morning in 2021, Demis Hassabis convened an all-hands video
    call. He forced a smile onto his round face, ready to do what he did best: spin
    bad news into good. By then, DeepMind had spent over seven years trying to break
    free from Google. They had tried being an "autonomous unit," an "Alphabet subsidiary,"
    a "global benefit company," and most recently settled on a "Company Limited by
    Guarantee"—a UK legal structure typically for charities and clubs, but allowing
    a mix of commercial, scientific, and altruistic goals. Yet the plans remained
    secret. DeepMind''s 100+ employees hadn''t breathed a word outside the company.


    Looking back at Hassabis and Suleyman''s years of effort, it''s easy to see they
    regretted selling DeepMind to Google. This is a familiar tale in tech: acquirers
    distorting a company''s original mission often horrify founders. Take WhatsApp:
    for years, its founders insisted on protecting their messaging app''s privacy—no
    ads, strict encryption on all messages. Jan Koum, who grew up in Ukraine where
    phones were tapped, kept a note from co-founder Brian Acton on his desk: "No ads!
    No games! No gimmicks!" But after Facebook acquired WhatsApp for $19 billion,
    Koum and Acton had to compromise on early privacy standards, at one point changing
    policy to let WhatsApp accounts link to Facebook profiles in the background. Acton
    then clashed violently with Facebook executives, leaving before his shares vested,
    walking away from $850 million in Facebook stock. Acton later admitted he deeply
    regretted selling WhatsApp.


    Hassabis wouldn''t fight his superiors. He was more strategic and shrewd in dealing
    with Google leadership. He didn''t argue or quit; he sought smarter ways to save
    face, like he did with AlphaGo, but optimism blinded him to Google''s need for
    relentless growth. Though the tech giant signed a letter of intent promising $16
    billion over 10 years to keep DeepMind independent, the document wasn''t legally
    binding. Worse, Hassabis lost the support of Google''s helmsman. Over the past
    years, while Larry Page remained Alphabet CEO, he was fading from public view,
    even skipping a congressional hearing on election security, leaving an empty chair
    for the press. In December 2019, Page stepped down entirely; Sundar Pichai became
    Alphabet CEO. It was clear the company was increasingly moving in a traditional
    corporate direction.

    '
