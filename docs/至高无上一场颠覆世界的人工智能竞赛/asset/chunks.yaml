    在百分制评判下，科技公司的平均得分为37分，而且它们在监管人们如何使用人工智能工具方面表现最差。“实际上，基础模型对下游的影响并不透明。”斯坦福大学的研究人员表示，“没有开发者对受影响的市场部门、个体、地区进行情况说明，也没有任何形式的使用报告。”


    与此同时，负责审查人工智能公司的公共部门组织长期资金不足，除了未来并不确定的欧盟《人工智能法案》，几乎没有法规强制要求领先的公司增加透明度。科技公司只要认为有必要，就可以在世界各地部署不可预测的人工智能工具。


    OpenAI和DeepMind专注于构建完美的人工智能，为了确保系统不像社交媒体公司那样造成危害，他们在选择信息保密的同时也拒绝了研究审查。虽然开发通用人工智能的想法充满吸引力，但它也可能带来更广泛的风险。集中精力开发面向特定任务的人工智能也许是比较安全的方法，但这样做就没那么激动人心了，也不能让人们对于他们的乌托邦幻想产生近乎宗教般的虔诚，无法吸引到如此多的投资。


    奥尔特曼和哈萨比斯都努力在人工智能竞赛中取得领先地位，也努力抵抗大型科技公司的引诱，坚持利他主义目标。他们需要庞大的计算资源、大量数据和全球最具才华（也最昂贵）的人工智能科学家。如今，随着两人分别代表微软和谷歌打起擂台，他们也重新定义了通用人工智能的目标，从追求乌托邦和科学发现，转变为获得声望和财富。


    这种情况的长期后果很难预测。一些经济学家表示，强大的人工智能系统可能会加剧不平等，而不是为人类创造财富。它们还可能扩大富人和穷人之间的认知差距。技术专家普遍认为，当通用人工智能实现时，它不会作为一个独立的智能实体存在，而是通过神经接口与我们的大脑相连。埃隆·马斯克的脑机接口公司Neuralink在这项研究中占据领先位置，他希望有朝一日能为数十亿人植入大脑芯片。他也急于实现这一目标。


    “我们需要在人工智能接管世界之前完成这个目标。”据马斯克的传记作者阿什利·万斯透露，马斯克在2023年对工程师说，“我们需要以强烈的紧迫感抓好这件事。孤注一掷。”马斯克相信，通过在大脑中植入芯片，人类可以避免被未来的超级人工智能毁灭，因此他希望到2030年，Neuralink能够为超过22
    000人施行手术。


    但比起失控的人工智能，偏见才是更紧迫的问题。随着互联网上由机器生成的内容越来越多，我们不清楚种族和性别刻板印象将如何演变。哈佛大学政府与技术专业教授拉塔尼娅·斯威尼估计，未来几年，网络上90%的文字和图像将不再由人类创造。我们看到的大部分东西将由人工智能生成。现在为了赚广告费，每天用语言模型发表的文章达上千篇，就连谷歌都难以辨别内容的真假。当你用谷歌搜索历史上的知名画家或者部分名人时，人工智能生成的图像已经混进了谷歌搜索结果的前几位。互联网上人工智能生成的内容越泛滥，存在偏见的风险就越大。


    “我们正在制造一个循环，编写代码，然后加剧刻板印象。”研究大型科技公司如何操纵学术研究及其与烟草巨头相似性的人工智能学者阿贝巴·比尔哈内说，“这将是一个大问题，因为互联网上由人工智能生成的图像和文本越来越多。”


    全体人类的幸福感也可能受到影响。20年前，人们担心手机会致癌。实际上它却变得让人上瘾，导致我们每天花几个小时盯着一块小屏幕，而不去与我们周围的世界互动。聊天机器人更有可能加剧这种上瘾的程度。2023年11月，普通用户每天大约要花两小时在诺姆·沙泽尔开发的Character.ai应用上，与勒布朗·詹姆斯等名人的虚拟形象或马里奥等虚构角色聊天，玩角色扮演游戏。根据几家市场研究公司的估计，Character.ai是当时用户留存率最高的人工智能应用程序，而且近60%的用户年龄在18～24岁。一种观点认为，Character.ai同Replika一样，为虚假恋爱关系和色情短信提供了通道。尽管该公司禁止色情内容，但用户还是能找到方法，比如Reddit等在线论坛就有分享相关技巧的帖子。


    “我通常会和我自己塑造的角色交谈。”一名每天使用Character.ai长达5～7个小时但不愿透露这些角色叫什么名字的美国青少年说道，“我不知道为什么我会花这么长时间。我觉得这可能是一种应对方式。”他们有时会向Character.ai寻求从分手中走出来的建议，或者完成家庭作业的方法。“大多数时候我只是扮演角色。”


    Character.ai正在培养不断与聊天机器人互动的新一代用户。沙泽尔说过，Character.ai旨在“帮助数百万甚至数十亿人”应对全球孤独危机，但作为一家企业，它也需要保持用户的长时间参与。倘若人们开始依赖人工智能伴侣，甚至沉迷上瘾，就可能在不经意间让很多人在现实世界中更加孤立。


    讽刺的是，OpenAI可能会加剧这些聊天机器人的成瘾性。2024年初，它推出了“GPT商店”，允许数百万开发人员通过构建各种版本的ChatGPT盈利。用户参与度越高，他们创造的收益就越多。这种以参与度为基础的模式是互联网上最成熟的赚钱方式，也是所谓“注意力经济”的基础。这就是为什么网络上几乎所有东西都是免费的，为什么互联网会变成阴谋论、极端主义和广告追踪工具肆虐的“温床”。为了赚取广告收入，YouTube、TikTok和脸书想方设法持续吸引用户眼球，这也导致网络上从网红到政客，人人都在不择手段地争抢流量，极尽夸张与挑衅之能事。


    在撰写本书期间，GPT商店突然上架了几十个“女友”应用程序。虽然有明文规定禁止支持这些软件与人类建立恋爱关系，但对OpenAI来说，监管这些规则并不容易。最受欢迎的聊天机器人，如Character.ai、Kindroid等，都在提供虚拟陪伴和恋爱体验服务，可能未来有一天，这就像在线约会一样普遍。


    人工智能开发者保持用户参与度的另一种方法是“无限融入”他们的生活。Character.ai的聊天机器人目前只能记住大约30分钟的谈话内容，但诺姆·沙泽尔正带领团队努力将这一时间窗口延长到几小时、几天甚至永远。他说：“只要你想，它可以记住你说的一切；只要你想，它也可以记住你全部的生活。”他认为，聊天机器人的记忆越长，“对你就越有价值”。然而，鉴于社交媒体广告追踪的历史，其中一些个人信息最后可能会流向科技公司甚至广告商。随着ChatGPT和类似人工智能机器人建立起更丰富的人类图景，无论是我们的年龄、健康情况，还是我们对生活的总体看法，它们可能也会带领人类进入一个在今天看来几乎不可想象的科技入侵的新时代。


    为此，可穿戴设备开发竞赛也在进行，这种设备会使用大语言模型分析我们与他人之间的对话。Tab就是其中的一种。它由旧金山一群年轻热情的工程师打造，是一个配有麦克风的圆形塑料磁盘，可以像吊坠那样挂在脖子上。


    “它会听取我所有的对话内容，借此了解我的日常生活场景。”2023年底，Tab的开发者阿维·希夫曼在旧金山登台演示时说。希夫曼询问Tab他前一天在晚餐中说了些什么，于是这块“吊坠”简要总结了它认为最重要的几点内容并将之发送至他的手机。希夫曼说他经常和该设备交谈。“深夜的时候，我尝试说出白天的一些想法或者担忧。”希夫曼解释道，“也许我应该说说汤姆的事情，或者所有的朋友。它确实能准确识别不同的说话者，就像真正属于你个人的人工智能。”很难想象，如果汤姆等人得知自己的朋友每天晚上都会使用人工智能研究他们的对话后会是什么感觉，恐怕他们并不会感到安心。


    Tab预计很快上市销售，加入一系列其他可穿戴设备的行列，这些设备被描述为能够使人类日常生活变得可查询的个人助理。就像谷歌开创了一个在互联网上搜索信息、通过查询获取事实、依赖网络导航的时代，语言模型设备也将对我们的日常生活产生相同的影响，让每个人的每时每刻都可被查询。方便的是，我们需要记忆的地方越来越少，但这也会改变面对面交流的现状，因为和朋友、同事之间的聊天突然要被正式记录了。如果这种生活查询技术得到广泛应用，那就可能给那些生活在过度监管社区的人带来麻烦。举例来说，美国黑人被逮捕的可能性是白人的5倍，也就是说执法部门更有可能挖掘他们的“生活数据”并用其他机器学习算法进行分析，从而做出不可思议的判断。


    是创新者坚定的信念带领我们走到今天，面向不确定的未来。即使微软拥有成千上万名工程师，也无法取得OpenAI那样的创新成果；谷歌因为过度担心现有业务受到影响，没能充分利用其内部最伟大的发明之一，即Transformer。大型科技公司不再创新，但它们仍可迅速采取行动以获得策略优势。它们从诺基亚、黑莓等老牌科技巨头的错误中吸取了教训。2007年，苹果手机刚上市时，这些巨头曾大肆嘲讽，然后眼睁睁看着苹果公司在短短几年里吞噬了它们的所有市场份额。大型科技公司知道它们必须从外部“购买”创新，DeepMind和OpenAI就是例证。


    奥尔特曼和哈萨比斯对这一切也心知肚明，但他们提出的新法律结构未能阻止科技巨头吞并公司，也未能阻止其主导人工智能的发展。穆斯塔法·苏莱曼最后离开谷歌创办了聊天机器人公司Inflection，试图与GPT-4竞争。他将公司设定为共益企业，筹集了超过15亿美元的资金，囤积了一批强大的人工智能芯片，Inflection也由此成为最有希望挑战OpenAI和谷歌的初创公司之一。然而，公司成立不到一年，微软就将其吞并。也许是为了避免反垄断监管机构的审查，这家全球软件巨头雇用了苏莱曼团队的大部分成员（而不是收购这家初创公司），同时还任命DeepMind联合创始人负责Inflection在人工智能方面的工作。这个例子很好地说明了科技巨头重新掌握主动权的速度有多快，但它同时也引发了疑问，即Anthropic等公司还能保持独立多久。


    其他一些心存善意的企业家也曾试着与这些庞然大物抗争，但都以失败告终。以Neeva（人工智能公司）为例。谷歌的前广告主管斯里德哈·拉马斯瓦米对其雇主建立在监控基础上的广告方式感到失望，于是在2019年创办了Neeva。拉马斯瓦米是一位说话温和的领导者，他要将Neeva打造成更好的搜索引擎。Neeva通过简单的订阅计划赚钱，不会采取跟踪用户行为的方式投放广告，不会侵犯用户的隐私。ChatGPT问世后，拉马斯瓦米让工程师们加班加点，开发了一款类似的工具，帮助用户总结搜索结果。他在2023年初就发布了这款工具——远远早于谷歌推出Bard的时间。


    “这样的技术高光时刻为竞争创造了更多的机会。”拉马斯瓦米当时显然对未来充满期待。那时候，微软的萨提亚·纳德拉还在嘲笑谷歌，因为这家搜索巨头看起来就像过去的遗迹。拉马斯瓦米说：“去年我很沮丧，因为很难摆脱谷歌的控制。”现在情况有了改变。


    但事实并非如此。仅仅几个月后，拉马斯瓦米就被迫关闭了Neeva。谷歌对市场的控制力实在太强了。“当谷歌遇到危机时，我们的使用率增加了10倍。”拉马斯瓦米回忆道，“但我们知道这种领先是短暂的，因为大型公司会投入数千人力和数十亿美元资金来解决问题。”


    就连有OpenAI助力的必应也在挣扎求生。数据分析公司StatCounter的统计显示，到2024年初，必应的市场份额仍徘徊在可怜的3%左右，对谷歌的主导地位基本没什么影响。这两家科技巨头正行走在大获全胜的路上，它们各有各的地盘：谷歌控制搜索市场，微软主导软件市场，同时都在与亚马逊争夺云业务的主导权。


    如今，开发人工智能模型的成本已经上涨到几乎所有非巨头科技公司都无法负担的程度。学术界和小型企业别无选择，只能从英伟达购买芯片，从亚马逊、微软或谷歌租用计算能力，而企业一旦进入这些平台，往往就会被“锁定”。人工智能初创公司经常抱怨，只要它们一开始在微软或亚马逊的云平台上建立自己的服务，就很难转换到其他平台。这些初创公司也很难获得开发ChatGPT等工具所需的数千个GPU。每个GPU的价格约为4万美元，购买这些GPU的难度不亚于期待一场门票已售罄的巡回演唱会还有余票。作为全球主要的GPU供应商，英伟达因为市场需求的增加赚得盆满钵满。2023年5月，继谷歌、微软、亚马逊、Meta和苹果之后，英伟达成为市值达到1万亿美元的科技公司。大型科技公司在技术开发和人工智能领域遥遥领先。但人工智能热潮并没有为创新的新企业开辟一个繁荣的市场，而是帮助这些大型公司巩固了实力。这些科技巨头加强了对基础设施、人才、数据、计算能力和利润的控制。毫无疑问，它们将控制人工智能的未来。


    通用人工智能梦想家也为此做出了贡献。2023年6月，微软首席财务官埃米·胡德告诉投资者，基于OpenAI人工智能技术的服务至少将带来100亿美元的收入。她称这是“公司历史上最快增长到100亿美元的业务”。


    如果DeepMind和OpenAI保持独立，并指定董事会负责把控人工智能的发展方向，会不会更好？这样做本身也有风险，萨姆·奥尔特曼后来的经历就是证明。选择离开DeepMind并努力自主创业的苏莱曼在采访中表示，大公司可能比小公司更值得信赖。毕竟，大公司要对股东和员工负责。但大型科技公司也对股东负有无法逃避的深层次义务。它们必须每季度都实现增长。如果利润停滞或降低，股价就会下跌；股价下跌，公司就筹集不到资金，高管和员工就会抱怨或离开。可怕的“衰退幽灵”正在游荡。“这些实体必须增长，”一位微软前高管表示，“人工智能就是解决方法。”


    哈萨比斯认为，DeepMind现在的结构更加合理。当被问及是否还认为通用人工智能需要他曾力推的那种伦理委员会来监管时，他说：“它已经达到了我们可以改善人类生活的成熟水平。谷歌很棒。”


    奥尔特曼坚称，虽然OpenAI已转型为一家营利性公司，与微软合作并引发了人工智能竞赛，但它为造福人类开发人工智能的原则没有改变。他别无选择，只能继续向公众推出人工智能工具。他说：“有效地部署对我们的使命至关重要。”否则OpenAI该如何学习？如何给人们带来像ChatGPT这样有用的工具呢？因此，“需要把技术交给用户”。


    以目前这场竞赛的速度，我们无法预测在2024年3月完成本书后的几个月或几年内会发生什么。但这些未来都将由少数人的意图和他们掌握的系统性力量决定。如果你问我，萨姆·奥尔特曼、德米斯·哈萨比斯以及微软、谷歌在构建人工智能未来这件事上是否值得信任，我的回答是我们别无选择。奥尔特曼和哈萨比斯都将自己的创新与世界上最大的公司捆绑在一起，而两家科技巨头的互联网影响力在日常生活中几乎无处不在。由此，他们也像历史上的那些创新者一样，为了继续竞争和建立优势而改变了自己的理想。这样做的结果是，我们见识到了一些最具变革性的技术，但我们要付出怎样的代价尚不清晰。


    ## 致谢


    如果没有一群伙伴的支持和鼓励，本书不可能问世。在ChatGPT公开发布大约一个月后，我给我的经纪人戴维·富盖特发了一个写作想法，内容是两个人如何梦想制造超级智能机器，而后成为竞争对手并代表大型科技公司打起擂台。戴维回复说：“不错！”这让我在接下来的一年里都斗志昂扬。与扬霍伊·麦格雷戈临时起意在南多斯餐厅的碰面，也让我对这一选题充满动力。


    感谢克莱尔·奇克、萨拉·贝丝·哈林、埃莉萨·里夫林，以及圣马丁出版社的所有优秀员工。感谢我的编辑彼得·沃尔弗顿，他冷静地指出全书应以少数几家公司如何操纵一项变革性创新为主题。皮特（还有你们，亲爱的读者）使我避免落入超人类主义和有效利他主义运动等几个无关紧要的“兔子洞”。


    必须感谢埃米尔·托里斯博士，他出色地将探索通用人工智能的根源追溯到充满黑暗色彩的优生学，帮助我理解了通过机器追求人类完美的另一面。戴维·埃德蒙兹、托比·奥德和迈克·莱文分别在长期主义、有效利他主义和开放慈善等人工智能对齐事业组织方面为我提供了指导。我和迈克对其中一些主题的看法并不一致，但我非常感谢他的耐心，感谢他花时间向我解释他的观点。西雅图的布赖恩·埃弗格林帮助我更好地理解了微软内部发生的人工智能伦理难题。


    特别感谢梅雷迪思·惠特克和雷奥洛夫·博塔，虽然这两人来自科技世界的不同领域（梅雷迪思是信号基金会的总裁，雷奥洛夫是风险投资公司红杉资本的合伙人），但他们让我意识到，少数科技公司在人工智能领域日益占据主导地位，这对社会和企业来说都是一个问题。


    我在书末表明了匿名消息来源，但我仍要感谢许许多多的科技和人工智能从业者，确切地说我要感谢那些曾经为OpenAI和DeepMind工作的员工和高级管理人员，他们花了数小时分享自己的经历，有时也对科技巨头在人工智能领域的垄断地位及其“快速行动，打破常规”的新动态深感不安。我希望本书能充分呈现他们的关切，以及他们与我分享的所有内容。


    《彭博观点》专栏的编辑们也对本书的写作给予了极大支持。非常感谢蒂姆·奥布赖恩和尼科尔·托里斯的热情，他们二话不说就同意留出时间让我写书，以补足我去年在专栏中反复强调的内容。感谢专栏的全体撰稿人，感谢他们的善意和鼓励，感谢他们让科技专栏作家的工作变得更加有趣，他们是：戴夫·李、拉腊·威廉斯、莱昂内尔·劳伦特、安德里亚·费尔斯特德、特雷泽·拉斐尔、马修·布鲁克、霍华德·蔡恩、克里斯·休斯、克里斯·布赖恩特、马库斯·阿什沃斯、马克·钱皮恩、詹姆斯·赫特林、乔伊·普莱斯夫斯、马克·吉尔伯特、伊莱恩·赫、蒂姆·库尔潘。此外，还要感谢哈维尔·布拉斯给我提出的写作建议。


    特别感谢我的同事蒂姆·奥布赖恩、尼科尔·托里斯、保罗·戴维斯、阿德里安·伍尔德里奇，感谢他们对本书初稿提供了敏锐而有用的反馈，帮助我了解写作圈子之外读者的观点。有一些早期的读者不仅告诉我哪里需要润色、哪里需要详细解释，还在写作过程中以好朋友的身份给予我精神上的支持。非常感谢米里亚姆·扎卡雷利、维克多·扎卡雷利、卡利·赛姆和克里斯廷·彼得森。


    感谢我的邻居兼朋友卡塔琳娜·蒙特西诺斯，我会亲昵地称呼她为卡蒂娜。在休假写书期间，我在她家里获得了一个安静的工作环境。卡蒂娜在现实生活中受益于人工智能。她曾是一名画家，在40岁时失明，后来成为一名成功的雕塑家。她欣然接受所有可以帮助她“看”世界的技术方式，充分利用了苹果语音助手Siri等数字助手。在她80岁的时候，我用手机对着她咖啡桌上的一座雕塑，让ChatGPT详细分析其色彩、形状和可能的艺术影响，她一边静静地听，一边露出惊讶的表情。“这可太棒了！”她说。我希望人工智能在未来朝着填补信息空缺的方向发展，而不是取代人类的工作和创造力。


    最后，如果没有家人的支持，本书根本不可能问世。感谢我的父亲菲利普·威瑟斯，从小到大，无论我取得的成就多么微不足道，他都从不吝惜赞美之词。感谢卡拉和韦斯利让家里充满欢笑，也感谢伊斯拉对书稿的关心和对我的鼓励。谢谢我的丈夫马尼，我每时每刻都在惊叹他怎么就能把全家人团结在一起，他始终是我的毅力和耐心之源，对此我特别感激。


    ## 资料来源说明


    感谢网站、报纸、杂志、研究论文、播客、图书等相关文章的记者和作者，他们杰出的工作表现使我得以使用这么多二次文献充实故事（参考内容附后）。


    在本书中，使用现在时以及“说”“回忆”“回顾”等词的引语均来自我对这些个体的直接采访，包括德米斯·哈萨比斯和萨姆·奥尔特曼。我还采访了许多前员工和知情人士，他们因担心直言不讳可能带来不良后果而选择匿名。我特别感谢他们对我的信任。


    由于篇幅限制，还有很多采访我无法写进书里，但它们很有价值，让我得以了解到萨姆·奥尔特曼和德米斯·哈萨比斯的生活、工作和人工智能领域。此外，还有很多专家帮助我理解机器学习系统、神经网络、扩散系统和Transformer的工作原理，并将之转换为易读的语言。

