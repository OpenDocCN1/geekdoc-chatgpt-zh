- raw: '这听起来何其疯狂，但奥尔特曼对这类改变世界的重大想法来者不拒。多年来，他一直想创立自己的核能公司，现在他可以投资一家了。


    他知道他正在背离科技投资的主流模式，也就是聚焦商业模式更传统、收入途径更清晰的软件企业。但他坚信他投资的这些公司，在改善人类状况的同时也能赚大钱。他在一次采访中谈到了Helion
    Energy：“硅谷还没投资这家公司，真是可耻。”奥尔特曼在道德上表现得自大并不稀奇。与其他大型科技公司的领导者相比，例如明确表达过他的目标是拯救人类的埃隆·马斯克，奥尔特曼的理念有一些不同。


    “再开发一款移动应用程序？你会遭受白眼。”奥尔特曼曾经说过，“创办一家火箭公司？人人都想到太空去。”在硅谷，人人都声称想要拯救世界。但就像马斯克一样，奥尔特曼把自己塑造成了一名认真对待目标的真正的“科技救世主”。大多数科技企业家都心知肚明，拯救人类多半是针对公众与员工的一种营销策略，尤其当他们的公司不过是在开发一些能精简电子邮件或辅助洗衣的小产品时。但奥尔特曼正在重塑Y
    Combinator，构建一个由真正能改变世界的企业家组成的联盟。虽然风险更高，但吸引的关注也更多。


    在投资方面，奥尔特曼就好比因为一手牌还过得去而下注大部分筹码，从而让其他参与者心跳加速的扑克玩家。奥尔特曼认为，他之所以会形成这种偏好，是因为他根本不在意别人的看法。因此他能够更有效地计算风险，并押注于看似疯狂的投资项目。


    不过，奥尔特曼的财富以及他在初创公司中作为新“尤达大师”的声望也为他应对投资失败提供了条件。在硅谷，好名声比任何豪华跑车都更有价值。如果像奥尔特曼这样支持核聚变初创公司，获得的声望同实际收入一样值钱。最终，奥尔特曼将他的大部分资金投向人工智能以外的两个宏伟目标：延续生命和创造取之不尽的能源。他资助了两家公司，其中Helion
    Energy获得超过3.75亿美元，而致力于将人类平均寿命延长10年的初创公司Retro Biosciences（生物科技公司）则获得了1.8亿美元。


    你如果好奇奥尔特曼是从哪里来的这么多钱，需知早在通用汽车以12.5亿美元收购Cruise之前，他就向这家自动驾驶汽车初创公司投资了约300万美元，这让他大赚了一笔意外之财。作为Y
    Combinator的最高领导者，奥尔特曼表示，他比其他风险投资者更有可能“押中巨奖”，因为他可以近距离审视数百家已经仔细筛选过的公司，而且当时正逢有史以来最大的牛市之一。此外，这些初创公司纷至沓来的申请也有助于他预见未来。


    在执掌Y Combinator一年后，奥尔特曼几乎与“硅谷的新领袖”画上了等号。他一周会接到400个会面请求。投资者和创业者蜂拥而至，希望通过他与Y Combinator的其他初创公司和合伙人取得联系，或者只是见一见更加雄心勃勃且充满传奇色彩的保罗·格雷厄姆。奥尔特曼在自己的博客上对一些显然超出他专业范围的话题侃侃而谈。他写过关于不明飞行物和监管的文章，甚至就如何在晚宴上做一名健谈的人发表过看法。奥尔特曼写道，不要问别人是做什么工作的，而要问对方对什么事情感兴趣。


    格雷厄姆每周都会和Y Combinator的创始人进行“办公会晤”，在交流中探讨他们遇到的问题，并给出精辟的指导，这些指导一般都遵循Y Combinator的创立宗旨“做人们需要的东西”。而在与初创公司创始人的交流中，奥尔特曼会引导他们把事情做大。爱彼迎的几个创始人当时只是为“沙发客”开发了一款软件，当他们向奥尔特曼展示投资卖点时，奥尔特曼让他们把报告中所有的“百万美元”都换成“十亿美元”。他睁着一双蓝色大眼睛，目不转睛地盯着他们说：“要么是你们不看好自己的提案，要么就是我不懂计算。”


    他建议初创公司创始人像他一样开足马力，全力以赴地做好每一件事。他告诉他们：“要想成功，你必须疯狂努力。”他在自己的博客上写道，无论衡量成功的数字是多少，你都要在后面“加一个零”。为了修复破碎的世界，创始人必须执着于产品质量，“敏思笃行”，能与团队“充分沟通”。在这个世界上，根本没有所谓的工作与生活的平衡。


    奥尔特曼说的大部分话没有错。人们到硅谷来是为了建立帝国，你不可能靠每周工作40小时来建立帝国。但作为一名企业家，奥尔特曼真正的天赋是能够说服别人相信他。从高中时期的校长到Y
    Combinator的格雷厄姆夫妇，再到彼得·蒂尔以及成千上万的创业者，他赢得了很多人的欣赏。但奥尔特曼也存在看不见的缺陷：理性驱使他保护世界，却在情感上远离他想要拯救的普通人。


    这在一定程度上源于2006年那个闷热的夏天。奥尔特曼穿着运动短裤躺在地板上，因为一笔不顺利的交易，他觉得心烦意乱。为了应对焦虑，奥尔特曼开始冥想，有时闭着眼打坐，专注于呼吸，一坐就是一小时。他后来说，时间久了，他的自我意识越来越弱。


    “通过冥想我认识到一点，那就是根本不存在什么自我认同。”他告诉播客节目《成功的艺术》，“我听说，很多人用许多时间来思考（强大的人工智能），也会以不同的方法得到相同的结论。”


    正因为有了这些认识，多年后，当奥尔特曼和朋友们去徒步旅行时，他顿悟：计算机总有一天将复制人类的思想。计算机可能具有认知能力，人类总有一天将与计算机融合。“研究人工智能会让你思考一些深刻的哲学问题，比如当我的思想被上传到计算机后会发生什么？”他说道，“它们跟我交谈时会发生什么？我想与计算机融合吗？我想继续探索宇宙吗？那时的我还会是我吗？”奥尔特曼并非孤身一人追随这些科幻本能。他的周围环绕着一群技术专家，他们相信有一天能把自己的意识上传至计算机服务器，并获得永生。


    一想到“死亡”，奥尔特曼就惶惶不安。他自称“末日准备者”，花费了大量时间和金钱为诸如人造病毒泄漏、人工智能攻击人类等全球性灾难事件做准备。“我尽量不去想太多，”他在《纽约客》专栏里对一群创业者说，“但我准备了枪、黄金、碘化钾、抗生素、电池、水、以色列军用防毒面罩，以及一大片可以坐飞机前往的大苏尔的土地。”


    他还花10 000美元从Nectome买了一个名额。Nectome是Y Combinator投资的一家初创公司，旨在通过高科技的防腐工艺保存人类大脑，以便未来大脑内的信息能被科学家上传至云端，并转变成类似计算机模拟的存在。


    随着他越来越多地投资探索遥远未来的公司，奥尔特曼似乎正在经历所谓的“总观效应”，这是宇航员从太空中看到地球后产生的一种认知转变，充满强烈的敬畏感和自我超越感。他越来越像从外太空的角度来看待这个世界。奥尔特曼在与别人交谈时，会用探寻的目光深深地凝视对方，然后停下来思考，仿佛他是一名观察者而不是参与者。


    尽管奥尔特曼对人类的未来进行了投资，但他在自己和别人之间制造了一条精神和情感上的鸿沟。他说，为了解决问题，你需要“冷静、慎重、务实”。奥尔特曼经常提及美国科幻小说作家马克·斯蒂格勒描写未来科技对人类生活影响的一部短篇小说《温柔诱惑》（The
    Gentle Seduction）。小说讲述了莉萨的生活，她在各式进步的“引诱”下想要把科技融入日常生活。


    到小说的尾声阶段，莉萨和她的丈夫将要把他们的意识上传至计算机。这很冒险，那些将自己的意识与这种先进机器融合的人最后可能会迷失自我。莉萨权衡着利弊，提到一些尝试过的朋友要么“死了”，要么迷失在数字世界里了。斯蒂格勒写道：“只有那些细致无畏的人、那些慎而又慎的人，才能成功生存下来。”


    这句话打动了奥尔特曼，他经常复述给别人听。作家的意思是，为了战胜与计算机融合的风险，人类需要具备一种既谨慎又勇敢的心态。小心谨慎，头脑冷静，理性地评估危险，而不是受制于情绪化、屈服于恐慌，只有这样你才更有可能在危险的未来世界中生存下来。那些在未来获得成功的人，会对科技进步采取一种超然而成熟的态度。


    一些技术专家过于担心人工智能对未来的威胁，这也是新兴研究领域“人工智能安全”的一部分。虽然这项研究很重要，但一些恐慌已经变成了恐惧，这些人类的拥护者似乎让情绪控制了自己。“不幸的是，一些参与人工智能安全研究的群体，反而是最不冷静的，”奥尔特曼说，“这种情况很危险……这些群体极度紧张。”但他逐渐也产生了新的认识，并表示：“我真的想要研究通用人工智能。”“通用人工智能”这一术语是沙恩·莱格在几年前提出的，但在人类与机器之间创造某种认知平等的信念已经存在了几十年，这种信念部分由最初在科幻小说中提出的想法演变而来。过去，通用人工智能的想法被视为“狂言妄语”，DeepMind的联合创始人只能在一家意大利餐厅开启创业之旅，而现在，DeepMind的构想转而成为备受重视的严肃科学目标。


    世界也需要有人以更加平衡的方式来开发人工智能。斯蒂格勒提出的“慎而又慎”引起了奥尔特曼的情感共鸣——他就是那个有智慧驾驭充满潜在危险的复杂未来的人，也是那个“细致无畏”的人。他是站在塔楼边缘的守望者，眼神警惕地盯着天边的人工智能乌托邦，从不看一眼脚底下喧闹的尘世生活。但他开始被使命和自信桎梏，没有意识到用“谨慎”描述自己是多么讽刺。作为一名具有强烈竞争意识的企业家，他会抢在谷歌等科技公司之前匆忙将人工智能系统推向公众。不知不觉，奥尔特曼也执着于成为第一。


    这就是为什么如果没有旁人“抛砖”提出建立人工智能乌托邦的想法，奥尔特曼可能永远不会行动。这位硅谷企业家需要一个对手激励他努力奋斗，而那个人远在世界另一端的英国，是一位才华横溢的年轻游戏设计师，正计划开发一款能够做出重大科学发现，甚至找到神之所在的强大软件。


    **4**  **更好的大脑**


    Elixir工作室倒闭后，哈萨比斯成了又一个因为梦想过于大胆而败北的科技企业家。尽管这段经历令人痛苦，但他还是认为自己拥有别人没有的东西，那就是他的大脑。哈萨比斯全力爱护着自己大脑里的灰质，他玩游戏以便锻炼它，他戒酒以便保护它，他甚至把自己的脸书头像设置成了一张大脑的磁共振成像扫描图。哈萨比斯无法不惊叹它的复杂性，在Elixir失败之后的几年里，他想知道大脑本身能否成为开发“类人”软件的关键。毕竟，它是宇宙中能够证明通用智能存在的唯一依据，对它进行深入理解才是明智的做法。大脑是只在物理生物学上有意义，还是在其他层面也有意义？答案就藏在神经科学里。


    哈萨比斯渴望确定性带来的抚慰，无论是游戏中或赢或输的结果、基督教规定的是非道德准则，还是他在高中时读到的关于宇宙单一框架的探索。只要能用数字或规则衡量某件事，那就是他的“最佳击球点”。“大脑拥有的大部分功能，应该都能用计算机进行模拟。”他后来在一次新闻采访中说，“神经科学表明，大脑可以用机械语言来描述。”换句话说，大脑惊人的复杂性可以归结为数字和数据，并被机器模仿。


    为此，哈萨比斯从20世纪的英国计算机科学家、图灵机提出者艾伦·图灵那里汲取灵感。图灵机诞生于1936年，从本质上说是一个思想实验，因为这台“机器”只存在于图灵的思想里。他设想了一条无限长的纸带，纸带被分为一个一个的小单元，然后由一个读写头按照某些规则在纸带上读写符号，直到收到停止的指令。这一想法听起来很粗糙，但作为理论而言，它对于正式形成计算机可以利用算法或规则集来做事的概念至关重要。如果用足够的时间和资源，图灵机可以像今天任何一台数字计算机一样强大。在哈萨比斯看来，它是人类大脑的完美代表。他曾经说过：“人脑就是图灵机。”


    2005年，在关闭Elixir几个月之后，哈萨比斯突然决定到英国伦敦大学学院攻读神经科学博士学位。根据其他计算机科学学者的说法，他的博士论文篇幅相对简短，但在科学层面堪称精妙。论文以记忆为研究主题。此前，学术界普遍认为大脑的海马体主要处理记忆，但哈萨比斯证明（在磁共振成像等研究成果的帮助下），海马体也会在想象的过程中被激活。


    简而言之，这意味着我们拥有的记忆有一部分源于想象。我们的大脑不仅会调出并“重现”过去的事件，就像你从文件柜里拿出文件那样，而且会主动重建这些事件，就像你画画那样。大脑参与了一个更具活力和创造性的过程，这在某种程度上解释了为什么我们的记忆有时会出错，有时会受到其他经历的影响。哈萨比斯认为，我们的大脑正在将这种“场景重建”过程应用到其他类型的任务，比如思考如何使用地图或制订计划。


    他的论文被一家领先的同行评议期刊列为当年最重要的科学突破之一。但哈萨比斯并不想留在学术界。许多学者渴望做出诺贝尔奖量级的发现，但他们把一半以上的时间都花在了写拨款申请上，即使他们很幸运地为某个项目争取到资金，大多数高校也不具备充足的计算能力。要进行尖端的机器学习研究，就需要使用世界上最强大的计算机。而它们就像世界上最顶尖的人才一样，大多数只聚集在大型科技公司里。哈萨比斯要想招揽大量人才来实施当代的“曼哈顿计划”，就得创业开公司。


    最初的蓝图诞生于他和沙恩·莱格、穆斯塔法·苏莱曼共进午餐时的对话。莱格是少有的人工智能爱好者，他对人工智能未来的看法就连哈萨比斯也自愧不如。莱格写了一篇关于“机器超级智能”的博士论文，导师阅读后建议他与哈萨比斯谈谈。


    “我找到了一个志同道合的伙伴。”哈萨比斯回忆道，“沙恩经过独立思考得出了结论，他认为这将是有史以来最重要的事情之一。”


    莱格的观点在联系紧密的“奇点”圈子里引起了轰动。这些科研人员相信，未来存在一个理论上的时间点，届时技术的发展将先进到不可阻挡和不可控制。最明显的信号就是计算机会变得比人类更聪明，而莱格认为这将在2030年前后发生。


    莱格迈入前沿科学领域的过程令人难以置信。他在新西兰长大，9岁时由于在学校表现不佳，父母带他去看教育心理学家。心理学家给莱格做了智力测试，之后为难地告诉他的父母，虽然他患有阅读障碍，但他的智力超乎常人。等到学会使用键盘后，莱格在学校的排名迅速上升，成为数学和计算机编程成绩最好的学生之一。


    莱格身材高挑，有点驼背，头发剪得很短。27岁那年，他走进一家书店，发现了雷·库兹韦尔的著作《机器之心》，库兹韦尔预言，计算机有一天会发展出自由意志并拥有情感和精神体验。


    他把这本书从头到尾读了一遍，脑子里一直想着库兹韦尔的推论，以及他对强大的人工智能将在21世纪20年代末出现的预测。当时，计算能力和数据开始呈爆发式增长。只要这种情况持续下去，计算机终将超越人类。这与支撑着科技行业本身的基础准则摩尔定律有关。该定律认为，微芯片上晶体管的数目每两年会翻一番，这一判断在过去50年里都正确无误。


    莱格读到库兹韦尔的书时正值2000年，当时互联网泡沫破裂的余波还未散去，所以人们很难相信计算机的能力将继续翻倍。但莱格认为互联网会持续发展。


    他说：“显然，各种各样的传感器的成本将会降低，因此可以用来训练模型的数据会不断增加。”


    将这些算力与数据相结合，便能把机器训练得越来越智能。莱格后来去攻读了人工智能博士学位，并在该领域建立了关系网。“奇点”信徒、留着一头嬉皮士长发的人工智能科学家本·戈策尔曾经发电子邮件给莱格和其他几位科学家，为一本书的书名征求意见。这个书名需要描述具备人类能力的人工智能。莱格给他回了邮件，建议使用“通用人工智能”这一说法，该术语后来成为哈萨比斯以及全球大型科技公司关注的焦点。


    多年来，哈萨比斯、莱格等在人工智能领域探索的科学家一直使用“强人工智能”“适当人工智能”等术语指称未来具备与人类同等智能的软件。但使用“通用”这个词语明确传达了一个要点，即人类的大脑是特别的，因为它可以做各种各样的事，无论是计算数字、给橘子剥皮，还是写诗。通过编程，机器可以很好地完成其中一件事，但不能同时做所有事。如果计算机不仅能处理数字，还能做出预测、识别图像、交谈、生成文本、制订计划，甚至“想象”，那么它可能就接近人类了。


    当时，大多数人工智能科学家并不认为人工智能会达到与人类同等的水平。这在一定程度上是因为他们亲历了人工智能历史上的“炒作”和失败。公众对人工智能的可能性抱有极大期望，而紧接着又大失所望。人工智能的发展历经了多次繁荣与萧条，这在人工智能历史上被称为“寒冬”：研究资金急剧下降，技术发展举步维艰。在20世纪90年代和21世纪初，科研人员成功将机器学习技术应用于人脸识别或语言等狭义任务，但到2009年哈萨比斯完成博士学位时，几乎没人相信机器可以拥有通用智能。如果有人提出这个想法，就会被嘲笑和排挤。在当时，这是一个边缘理论。


    幸运的是，戈策尔站到了边缘理论这一边，虽然“通用人工智能”并不时兴，但他非常喜欢这个术语，于是将它印在自己的书上，使其成为常用表达，也推动了通用人工智能领域的研究热潮。


    语言和术语终将在人工智能的发展中扮演重要角色，有时能把公众的兴趣推向令人疯狂的程度。术语“人工智能”是1956年在达特茅斯学院召开的一次研讨会上被提出的，旨在整合关于“思考机器”的观点。当时，这个新兴领域还有其他各种各样的名称，比如“控制论”“复杂信息处理”等，但只有“人工智能”脱颖而出。它后来成为有史以来最成功的营销术语之一，并催生了一系列其他术语，这些术语在我们的集体意识中将机器拟人化，往往赋予它们超出本身的能力。例如，从技术上讲，认为计算机可以“思考”或“学习”并不准确，但“神经网络”“深度学习”“训练”等术语通过赋予软件类似人类的特性，在我们的脑海中加深了这一想法，即使这些软件只是从人类的大脑中获得了些许启发。关于莱格提出的新术语“通用人工智能”，业界达成的唯一共识就是以前没有这个说法。


    穆斯塔法·苏莱曼是另一个相信通用人工智能的人。这名25岁的牛津大学辍学生正在寻找一种利用技术改变世界的方法。他博学多才，但专业领域更多集中在政策和哲学而非计算机科学。苏莱曼的父亲是叙利亚人，母亲是英国人，他具有解决问题的强大动力。他想要解决的不是像修理故障汽车或修复膝盖这样生活中的小问题，而是贫困、气候危机等影响所有人类的大难题。


    当时，苏莱曼与合伙人共同创办了一家提供冲突解决方案的公司，但后来他对研究神经科学充满兴趣，而哈萨比斯也会邀请他参加在伦敦大学学院举办的一些午餐交流会。苏莱曼和哈萨比斯很熟。苏莱曼在伦敦北部长大，是哈萨比斯的弟弟乔治的朋友，少年时期经常到他们家里做客。这三人甚至在20多岁时去拉斯维加斯参加了一项扑克锦标赛，他们互相指导，分享奖金。


    当苏莱曼再次与哈萨比斯相见时，他被后者“开发强大的人工智能系统来解决问题”的想法以及莱格所坚信的“通用智能几乎可以解决所有问题”的观点打动了。苏莱曼感到兴奋，因为这对解决社会问题很有意义。


    出于保密考虑，他们三人后来在大学附近的一家意大利连锁餐厅碰了面。莱格说：“我们不想让大家听到我们讨论开发通用人工智能的狂言妄语。”


    在哈萨比斯的戏说下，莱格也认为他们不可能在学术界完成通用人工智能的开发。“我们可能得等到50多岁成为教授时，才能获得足够的资源去做想做的事。”哈萨比斯说，“创办公司才是最好的选择。”


    为了达到必要的规模、获得必要的资源，他们需要创办一家新公司。苏莱曼拥有创办公司的经验，这意味着他对企业经营略知一二，哈萨比斯也是如此。2010年，谷歌、脸书等科技公司对社会的影响力正值巅峰，所以在这三人看来，科技公司最有可能对复杂的世界进行建模。他们制订了一个宏伟的计划——成立一家研究公司，设法制造出有史以来最强大的人工智能，然后用它来解决全球问题。'
