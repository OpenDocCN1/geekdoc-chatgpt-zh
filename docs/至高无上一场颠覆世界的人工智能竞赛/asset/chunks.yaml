- raw: '格雷厄姆在奥尔特曼身上看到了同样的黑客本能：极度好奇、非常聪明、思想深刻。另外，这个长着一头蓬松黑发的少年很懂得如何与年长者相处，他能够毫不费力地与比他年长20多岁的格雷厄姆打交道。格雷厄姆建议奥尔特曼等一年再参加Y Combinator项目，因为他当时只有19岁，但这个孩子回答说无论如何他都要参加。格雷厄姆一下子就喜欢上了他。


    该项目的参加者大多是工程师和黑客，其中也包括广受欢迎的在线论坛Reddit的创始人。格雷厄姆及其妻子杰西卡·利文斯顿给参与项目的每家初创公司投资了6 000美元，这个金额参考了麻省理工学院在夏季发放给研究生的补贴。大多数风险投资家投给初创公司的资金达到数百万美元，而格雷厄姆却告诉创始人要少花钱、多办事，以“拉面盈利”为目标，并劝告他们不要雇用律师、银行家和公关人员，因为他们自己干这些工作的成本更低。


    格雷厄姆自己就是少花钱、多办事的典型。他每个星期二晚上都会亲自下厨，做自己的拿手菜法式炖鸡，还会邀请他的朋友来分享创业心得，利文斯顿则负责为每家新公司处理法律文书工作。


    奥尔特曼和好友西沃将他们的新公司命名为“Loopt”，他搬到了马萨诸塞州剑桥市，在格雷厄姆家附近Y Combinator的第一间办公室工作。奥尔特曼和格雷厄姆建立了一种亲密的关系，就像他和高中校长的关系一样。在这些满怀希望的年轻企业家中，格雷厄姆如同一名精神领袖，他们都亲昵地称他为“PG”
    ^([²](#fn2))


    奥尔特曼不仅是一位十分优秀的程序员，长着一张娃娃脸的他在商业领域的表现更加出彩。他毫无压力地给Sprint、威瑞森和Boost Mobile这三大通信公司的高管打电话，讲述他关于改变社交方式和手机使用方式的宏伟愿景。他运用他从创意写作课上学到的优雅措辞，声音低沉地解释说，Loopt总有一天会成为所有手机用户的必需品。当时还没有应用商店，所以他不得不依靠手机运营商将Loopt预装到一些早期的智能手机上。这就是为什么取得电信公司高管的支持如此重要，而奥尔特曼是一名营销大师。Sprint、威瑞森、Boost Mobile，甚至黑莓公司都同意在它们的手机产品上安装他的服务。


    在为期3个月的Y Combinator项目结束后，奥尔特曼筹集了一些资金用于发展公司。他花15分钟向15位投资者（其中大多数是格雷厄姆的富豪朋友）介绍了Loopt的发展愿景，之后又向财力更雄厚的硅谷风险投资公司寻求注资。他收到了几份报价协议，最终从两家顶尖风险投资公司那里拿到了500万美元，这两家公司曾投资谷歌、雅虎和贝宝。


    凭借充足的资金支持，奥尔特曼从斯坦福大学辍学，全身心投入Loopt的开发工作。他带着几名雇来的工程师搬到了加利福尼亚州帕洛阿尔托，在红杉资本的共享工作空间安顿下来。YouTube（视频网站）的创始人也在这里办公，他们一起通宵达旦地编写代码。后来奥尔特曼带着团队搬到了他们在芒廷维尤的第一个办公室，位于距离谷歌总部只有几个街区远的黄金地段，硅谷中心近在咫尺。


    硅谷是疯狂思想家的乐园。在这里，你不是创办一家企业，而是开创一个帝国，或者在技术与科学的前沿寻求建树。如果想对类似阿尔茨海默病的疾病进行科学研究，可以去美国东海岸或者欧洲的大学。但如果想逆转衰老，那么就来硅谷吧。


    硅谷地区密集的人脉网络是其核心竞争力所在。随便哪天，你都可能在某个场所遇见某个能够为你的事业注入活力的人物。在加利福尼亚州伍德赛德的巴克餐厅吃早餐时，你可能会看到雅虎的联合创始人正在吃水果和酸奶，而就在他所坐的那张桌子上，埃隆·马斯克曾为贝宝举行了第一场融资会议。到旧金山电池俱乐部的马斯托酒吧小酌，你可能会看到脸书的某位联合创始人的身影。


    奥尔特曼很快就跻身由程序员、投资者和高管组成的硅谷关系网。在这个充满现代气息的旧式精英圈层中，懂得建立人脉意味着更可能被推向财富巅峰。奥尔特曼非常善于交际，他成功打通关系，得以在2008年的苹果年度开发者盛会上展示Loopt。这位身材修长的年轻企业家下身穿着牛仔裤，上身叠穿了绿色和粉色两件Polo衫，造型酷似儿童节目主持人。他告诉观众，Loopt是全球最大的社交地图服务平台。“我们制造机缘。”他直视观众，几乎未露笑意地说道。


    从表面上看，一切都很完美。但在私下里，Loopt发展艰难。大家对于使用奥尔特曼的数字地图去寻找朋友并不那么感兴趣。这名眼界开阔的企业家原以为年轻的手机用户会像他一样希望认识新朋友。然而，你首先要付出很多努力通过屏幕和在酒吧认识的朋友或陌生人互动，才能在打篮球缺人的时候叫他们出来凑数。随着时间的流逝，越来越多的人选择在脸书等社交网络上和朋友交流。脸书的发展速度比Loopt快很多。前者已经积累了上亿的活跃用户，而后者的注册用户才勉强达到500万。


    更不妙的是，Loopt开始引发争议。在创办公司一年后，奥尔特曼接到了以前的高中校长安迪·阿博特的电话。阿博特说，家长正强迫孩子使用Loopt以便追踪他们的行动。他还提到在一次实地考察活动中，曾有家长致电学校投诉校车超速行驶。“看看你干的好事。”电话那头传来老校长半开玩笑的调侃。


    奥尔特曼听说过更糟糕的事。这名年轻的企业家承认说：“妇女团体对我们表示担忧。”部分男性迫使他们的妻子安装Loopt，从而随时掌控她们的行踪。这是对数字地图的滥用，令人毛骨悚然且有潜在危险。“但我们正在研究解决方案。”他迅速补充说。Loopt的用户可以伪造自己的位置。弱势的女性如果去商店购物，可以伪装成自己在家。


    虽然许多企业家否认他们的软件遭到滥用，但奥尔特曼似乎抱着公开面对这个问题的决心。他十几岁的时候就知道，秘而不宣只会让事情变得更糟。最好把它们公开。他接到了杰西卡·莱辛的电话，当时她还是《华尔街日报》一位锲而不舍的科技记者，访问关于Loopt的隐私问题以及一些滥用方面的担忧。根据莱辛后来发表的一篇报道，奥尔特曼出乎意料地渴望谈论这方面的争议，他甚至通过电子邮件发送给她一份长长的文件，详细说明了使用Loopt带来的所有风险。


    看似终结自身职业生涯的举动其实是一种精明的公关手段，他以后会一而再，再而三地利用这种经过精心算计的逆向心理学策略。通过表达对Loopt所导致的最坏结果的极度担忧，奥尔特曼可以消除评论家或者莱辛等记者的敌意。你还能批判他什么呢？毕竟他自己已经批判完了。他似乎高尚到不顾自己的利益——尽管高尚的做法应该是将这一可能被用来跟踪弱势群体的软件关闭。


    最终，是使用者帮他做到了这一点。奥尔特曼错估了人们对共享GPS（全球定位系统）坐标去邂逅新朋友的抗拒心理。他接着说：“我认识到不能强迫他们去做不想做的事。”


    在20多岁的年纪，这位精瘦的年轻企业家把大部分时间花在了疯狂发展Loopt上。他利用苹果手机的新推送通知在主屏幕上“打广告”，吸引用户使用Loopt的聊天功能。他协助广告商向Loopt的用户发送“限时团购”优惠。他宣称每一次应用程序升级都是一次成功的“扣篮”。“反响非常热烈。”他在2010年的一次采访中说。但这只是吹牛而已。到2012年，全世界只有几千人经常使用Loopt。建立帝国的梦想就此破灭。就像绝大多数科技初创公司一样，Loopt以失败告终。


    在科技初创界，一个创始人的终极目标要么是将创意培育成估值数十亿美元的企业，要么通过将公司出售给行业巨头实现巨额套现。保持独立越来越难，大多数公司都被谷歌、脸书等科技巨头吞并了。如果能卖掉公司，创始人通常会用得来的资金二次创业，由此蜕变为连续创业者。然而，Loopt的离场并不那么盛大。2012年，奥尔特曼以4 300万美元的价格将其出售给一家礼品卡公司，这笔交易款只能勉强支付投资者的债权和员工工资。


    奥尔特曼本可以立即离开硅谷，但Loopt的倒闭使他更加坚信自己应该做一些更有意义的事情。他不是第一个在失败中找到更大抱负的科技创业者。大约10年前，埃隆·马斯克被董事会赶出了贝宝。从这次经历中吸取教训的马斯克觉得他已经厌倦了研发消费者支付服务这种肤浅的东西。他在接受采访时说：“我的下一家公司应该带来长期的有利影响。”几年后，他确实做到了。马斯克遇见了特斯拉的创始人，并致力于减缓威胁人类生存的气候变化。


    朝着坐在旧金山电池俱乐部里的那群人扔一部智能手机，至少会砸到3个自诩正在拯救世界的科技精英。硅谷创业者群体中普遍存在着应用程序改变世界的信念，虽然有些人确实开发出了惠及千万用户的实用产品，但也有不少人因此产生了一种强烈的“救世主情结”。硅谷对创新的重视，加上格雷厄姆提倡的“创始人至上”的原则，使这种“救世主”文化无处不在。作为顶尖的创新黑客，不仅要解决工程问题，还要解决困扰人类多年的社会难题。


    奥尔特曼希望通过Loopt把人们聚到一起，因为他们需要这样。我们整天盯着屏幕，无意识地刷新，在不同的社交网络上“点赞”，人际关系变得越来越量化。他需要做更有意义的尝试。也许奥尔特曼得给大众提供一些他们不知道自己想要的东西。这是苹果公司多年来的成功做法，也是所有硅谷创业家想要破解的秘密。


    这名在圣路易斯市长大的年轻人决心重返初创公司竞技场，将自己深度嵌入硅谷的人脉矩阵，从而使自己能够与那些宣称要改变世界的公司站在同一阵营。他将使自己的思想比以前的导师更加深刻，重新挖掘他在斯坦福大学人工智能实验室酝酿的东西。这将引领他追求更宏伟的目标：从迫在眉睫的生存威胁中拯救人类，同时缔造前所未有的财富盛景。


    **2**  **功亏一篑**


    一打开1994年的电脑游戏《主题公园》，就会响起尖叫声、过山车的轰鸣声和游乐场风琴的叮当声。一大块空荡荡的像素草地正等待被巨大汉堡形状的食品摊位和直冲云霄的过山车轨道填满。这个游戏的目标是尽可能多地赚钱。


    《主题公园》的创作者不是急于向孩子们“兜售”经营信条的中年游戏设计师，而是一名来自伦敦北部名叫德米斯·哈萨比斯的黑发少年。他具有硅谷企业家般的工作态度，并痴迷于玩游戏。多年后，哈萨比斯在全球最强的人工智能系统研发竞赛中成为领跑者，而在此之前，他就已经通过模拟游戏学习到如何经营一家企业，这成为他未来事业的重心，也是他寻求制造比人类更聪明的机器的关键所在。


    在《主题公园》里，玩家初始持有20万美元运营资金，用于建造游乐设施和支付员工工资。玩家可以通过销售门票、周边商品、冰激凌，以及运营椰壳投掷游戏等项目挣钱。如果没有足够的机修工，游乐设施会出现故障；如果没有足够的保安，会引发暴徒滋事；如果没有购入足够的糖来制作冰激凌，游客会拒绝购买。工作人员会罢工，要求就薪资进行谈判。时年17岁的哈萨比斯设计了这款巧妙平衡成本与收益的游戏，将其作为高度复杂的企业管理模拟系统。该游戏凭借令人欲罢不能的机制设计，在1994年上市后创下了1
    500万份销量纪录。


    电子游戏大潮席卷了英国和美国，将孩子们带入了生动的多巴胺世界。在游戏世界里，忍者神龟在横向通关的过程中与敌人战斗，或者你可以驾驶小货车在荒野上横冲直撞。但哈萨比斯认为，最好的电子游戏是对现实生活的模拟。在“上帝类游戏”中，玩家拥有创造和毁灭的力量。与控制马里奥这种单一角色不同，玩家将塑造成千上万个虚拟人物，打造风景地貌并引领文明发展。你可以建一座城然后让它遭受自然灾害，你也可以让一个主题公园挤满数百名游客。


    这项技术给玩家带来了乐趣，也教会他们知识：从经营企业到探索宇宙奥秘。尽管游戏的全部价值在于娱乐，但哈萨比斯还是产生了一种强烈的愿望，那就是利用游戏创造一个有助于解开人类意识秘密的超级人工智能。


    哈萨比斯追寻宇宙奥秘的使命感超过了大多数科学家，看似标新立异，实际上缘于其不可思议的成长经历。他的家人都率性而有创意，他是家中唯一的数学天才。他的母亲安吉拉是一名虔诚的浸信会教徒，从新加坡移民到英国，在伦敦北部的寄宿家庭里遇到了她未来的丈夫——一个自由奔放的希腊裔塞浦路斯人，名叫科斯塔·哈萨比斯。两人看上去门不当户不对，但他们结了婚并生育了3个孩子，长子就是德米斯。科斯塔的工作一直不稳定，有时当老师，有时经营玩具店，在哈萨比斯12岁之前，科斯塔带着全家搬了10次家。


    哈萨比斯显然与其他孩子不同。他4岁时下国际象棋，就能击败他的父亲和叔叔；6岁时在当地的国际象棋比赛中打败了大部分同龄儿童，当时他还需要摇摇晃晃地坐在垫子或电话簿上艰难地审视棋盘。他拥有出色的阅读能力，对一切充满好奇，但他投入精力最多的还是玩游戏。当哈萨比斯的父亲把缺了棋子的桌游带回家时，他会利用它们设计新游戏，和弟弟妹妹一起玩。


    但真正有趣的还在后面。20世纪90年代，萨姆·奥尔特曼发现了“美国在线”聊天室，而早在此前10年，哈萨比斯正一头栽进某种由黑屏上的粗像素所构成的初级技术里。1984年，8岁的哈萨比斯用赢得的国际象棋比赛奖金买了一台ZX
    Spectrum 48（键盘式个人计算机）。这款最早的个人计算机包含一个厚厚的黑色键盘，你可以将其与电视机连接并使用盒式磁带在屏幕上播放彩色图像。


    哈萨比斯购买了编程教材，自学制作适合Spectrum电脑的游戏。他会在睡前配置好运算任务，待次日清晨即可获取计算结果。对哈萨比斯来说，这一发现具有启示意义。他成功将认知负荷转移至计算机系统，使Spectrum电脑成为其思维延伸载体。


    哈萨比斯迷上了编程这个小众世界，又购置了一台更强大的Commodore Amiga 500，这款笨重的白色电脑配了一堆工具，包括鼠标和显示器等。之后他和同学成立了一个黑客俱乐部。他们通过编写代码让屏幕显现彩色图像，模仿之前玩过的游戏场景。哈萨比斯经常为了超过他的朋友们而大费周章。他会把电脑拆开，再把它装回去。他还制作了一款国际象棋电子游戏给弟弟乔治玩。


    国际象棋仍然是哈萨比斯的生活重点，他立志成为世界冠军。他的母亲对此非常支持，开始让他在家接受教育，以便让他有更多时间研究国际象棋。在学校放假期间，他就去参加不同的国际象棋比赛，从未间断。哈萨比斯后来说，游戏就像一个为大脑而设的健身房，而国际象棋则是终极的锻炼方式。就像萨姆·奥尔特曼通过玩扑克学习心理学和商业知识一样，下国际象棋也教会了哈萨比斯如何从目标出发来进行战略规划：先设想目标，再逆向思考。


    改变发生在哈萨比斯11岁那年，当时他正在列支敦士登参加国际象棋锦标赛。他的对手是丹麦的国际象棋全国冠军，比赛陷入了漫长的拉锯战。经过10个小时的苦战，双方都疲惫不堪，丹麦选手试图逼和。少年哈萨比斯手头还有“国王”和“王后”，但他的对手占有“国王”、“车”、“象”和“马”的优势。身心俱疲的哈萨比斯误判局势，以为自己即将被将死，最终选择认输。


    成为冠军的丹麦选手震惊地问道：“你为什么会认输？”


    他给哈萨比斯演示了棋局的另一种解法。哈萨比斯紧紧盯着棋盘。有时失败会激发出更大的志向。如果无法忍受失败，追逐更大的志向可能就是一种安慰，但哈萨比斯在付出了巨大的努力后，还是遭遇了失败。他环顾四周，看着国际象棋天才们伏在棋盘前冥思苦想，突然意识到整个联赛就是在浪费脑力。这些人都是世界上顶尖的战略思想家，倘若他们致力于解决更重大的问题会怎样？他当时在全球14岁以下国际象棋选手中排名第二，但一切终究只是一场游戏而已。


    哈萨比斯对父母说他不想再参加比赛，想回到学校上学。当时他性格内向、多愁善感，喜欢听恩雅的歌，还自学钢琴弹奏她的单曲《水印》。他最爱看的电影是《银翼杀手》，这是一部科幻电影，讲述一名侦探追捕与真人无异的仿生人的故事。电影中那些感人的场景让他欲罢不能。他反复播放电影最后一幕的配乐，在这段由范吉利斯创作的扣人心弦的音乐中，反派角色哀叹他的记忆将“消逝在时间中，就像眼泪消失在雨里”。


    每到星期日，哈萨比斯的母亲经常带他和弟弟妹妹去伦敦北部的亨顿浸信会教堂。这座矗立在山丘之巅的宏伟灰石建筑俯瞰城郊，教会内部就像一个小型的国际化社区，会聚着来自菲律宾、加纳、法国、印度等地的信徒。对于像哈萨比斯这样拥有一半塞浦路斯血统和一半新加坡血统的孩子来说，这里不难融入。相较于英国国教拘谨的传统仪式，这里的礼拜活动更显生动活泼。大家会举起赞美的手，跟着鼓点和乐队的节奏歌唱。牧师不拘泥于教义，着重强调尊重他人的处世原则。祷告者情感丰沛，而教堂本身毫不掩饰地宣扬福音派。


    尽管浸信会是美国最大的基督教教派之一，但在英国仍属小众。英国国教有100万名教众，而浸信会只有大约15万名信徒。宗教和上帝的概念令哈萨比斯着迷，他想知道能否通过科学手段找到上帝。他在16岁时提前两年从高中毕业，还读完了诺贝尔奖得主、物理学家史蒂文·温伯格所著的《终极理论之梦》。这本书是对自然统一理论的一种近乎堂吉诃德式的伟大探索。温伯格认为，也许存在一种方法可以用一个方程来解释宇宙中所有的基本力，就像爱因斯坦用方程E=mc²总结了能量和质量之间的关系一样。理想情况下，这个“万能理论”应该足够简洁，可以写在单页纸上，甚至能浓缩为一个方程。


    哈萨比斯读得如痴如醉，之后震惊地发现，科学家在这方面并未取得多大进展。他们需要帮助，他想。他们需要强大的智力。也许他能帮上忙？哈萨比斯望向那台曾在他睡觉时彻夜运行计算的“大家伙”。也许一台更智能的电脑能帮上忙。如果他能让电脑变得更智能，使其成为自己思维更强大的延伸，也许它们就能帮助科学家破解宇宙难题，甚至找到神的所在。


    “这似乎是完美的超级解决方案。”哈萨比斯后来在接受《纽约时报》撰稿人埃兹拉·克莱因的采访时解释说。他坦言曾考虑攻读物理学专业，但在读了温伯格的书之后，他觉得自己应该追求更大的目标。通过计算机科学与人工智能新兴领域的交叉研究，他致力于构建能够改善人类生存境遇的终极科学工具。哈萨比斯无法摆脱他对游戏的迷恋，因此制订了一份将两者结合起来的长期计划，关键在于专注开发现实世界模拟类游戏。20世纪80年代末的游戏已经能够模拟文明的基本特征。既然电脑能够复制世界的完整细节，也许高智能的电脑能够找到修复现实世界缺陷的方法——在模拟中找到解决办法并将之应用到现实生活。


    哈萨比斯从游戏中获得灵感，他最爱的游戏是《上帝也疯狂》。“让我着迷的地方在于，游戏里的世界不仅栩栩如生，而且会跟随玩家的玩法进化。”他说，“你可以把游戏世界的一部分当成沙盒，并围绕它创造新玩法。”


    充满怀旧气息的像素化图像掩盖了这款游戏的复杂性。在一片平坦的绿色山谷里，房屋点缀其间。作为玩家，你就是山谷之神，一身神力，需要引领山谷居民，也就是你的追随者与其他神灵的追随者战斗。你可以抬高或降低地面，把它变得更平坦，好让你的追随者能够建造房屋、繁衍生息。你还可以引发地震。《上帝也疯狂》开了“上帝类游戏”的先河，哈萨比斯爱死这款游戏了，因此决心去开发这款游戏的牛蛙公司工作。他参加了工作竞聘，结果铩羽而归。于是他拿起电话打给公司，请求得到一个星期的实习机会。公司同意了，而且很欣赏他，所以在他15岁的时候又给他提供了一份暑期兼职。


    不久之后，16岁的哈萨比斯获得了一个在剑桥大学攻读计算机科学专业的名额，但剑桥大学说他年纪太小，应该等一年再入学。于是他又在牛蛙公司待了一年，领取现金报酬，那段时间他就住在公司位于萨里郡吉尔福德市的办公室附近的基督教青年招待所。哈萨比斯起初是一名电子游戏测试员，但很快就升任为关卡设计师，直接向牛蛙公司创始人彼得·莫利纽克斯汇报。'
  fmt: '

    # 萨姆·奥尔特曼与 Loopt 的兴衰


    格雷厄姆在奥尔特曼身上看到了同样的黑客本能：极度好奇、非常聪明、思想深刻。另外，这个长着一头蓬松黑发的少年很懂得如何与年长者相处，他能够毫不费力地与比他年长
    20 多岁的格雷厄姆打交道。格雷厄姆建议奥尔特曼等一年再参加 Y Combinator 项目，因为他当时只有 19 岁，但这个孩子回答说无论如何他都要参加。格雷厄姆一下子就喜欢上了他。


    该项目的参加者大多是工程师和黑客，其中也包括广受欢迎的在线论坛 Reddit 的创始人。格雷厄姆及其妻子杰西卡·利文斯顿给参与项目的每家初创公司投资了 6
    000 美元，这个金额参考了麻省理工学院在夏季发放给研究生的补贴。大多数风险投资家投给初创公司的资金达到数百万美元，而格雷厄姆却告诉创始人要少花钱、多办事，以“拉面盈利”为目标，并劝告他们不要雇用律师、银行家和公关人员，因为他们自己干这些工作的成本更低。


    格雷厄姆自己就是少花钱、多办事的典型。他每个星期二晚上都会亲自下厨，做自己的拿手菜法式炖鸡，还会邀请他的朋友来分享创业心得，利文斯顿则负责为每家新公司处理法律文书工作。


    奥尔特曼和好友西沃将他们的新公司命名为“Loopt”，他搬到了马萨诸塞州剑桥市，在格雷厄姆家附近 Y Combinator 的第一间办公室工作。奥尔特曼和格雷厄姆建立了一种亲密的关系，就像他和高中校长的关系一样。在这些满怀希望的年轻企业家中，格雷厄姆如同一名精神领袖，他们都亲昵地称他为“PG”[^2]。


    奥尔特曼不仅是一位十分优秀的程序员，长着一张娃娃脸的他在商业领域的表现更加出彩。他毫无压力地给 Sprint、威瑞森和 Boost Mobile 这三大通信公司的高管打电话，讲述他关于改变社交方式和手机使用方式的宏伟愿景。他运用他从创意写作课上学到的优雅措辞，声音低沉地解释说，Loopt
    总有一天会成为所有手机用户的必需品。当时还没有应用商店，所以他不得不依靠手机运营商将 Loopt 预装到一些早期的智能手机上。这就是为什么取得电信公司高管的支持如此重要，而奥尔特曼是一名营销大师。Sprint、威瑞森、Boost
    Mobile，甚至黑莓公司都同意在它们的手机产品上安装他的服务。


    在为期 3 个月的 Y Combinator 项目结束后，奥尔特曼筹集了一些资金用于发展公司。他花 15 分钟向 15 位投资者（其中大多数是格雷厄姆的富豪朋友）介绍了
    Loopt 的发展愿景，之后又向财力更雄厚的硅谷风险投资公司寻求注资。他收到了几份报价协议，最终从两家顶尖风险投资公司那里拿到了 500 万美元，这两家公司曾投资谷歌、雅虎和贝宝。


    凭借充足的资金支持，奥尔特曼从斯坦福大学辍学，全身心投入 Loopt 的开发工作。他带着几名雇来的工程师搬到了加利福尼亚州帕洛阿尔托，在红杉资本的共享工作空间安顿下来。YouTube（视频网站）的创始人也在这里办公，他们一起通宵达旦地编写代码。后来奥尔特曼带着团队搬到了他们在芒廷维尤的第一个办公室，位于距离谷歌总部只有几个街区远的黄金地段，硅谷中心近在咫尺。


    硅谷是疯狂思想家的乐园。在这里，你不是创办一家企业，而是开创一个帝国，或者在技术与科学的前沿寻求建树。如果想对类似阿尔茨海默病的疾病进行科学研究，可以去美国东海岸或者欧洲的大学。但如果想逆转衰老，那么就来硅谷吧。


    硅谷地区密集的人脉网络是其核心竞争力所在。随便哪天，你都可能在某个场所遇见某个能够为你的事业注入活力的人物。在加利福尼亚州伍德赛德的巴克餐厅吃早餐时，你可能会看到雅虎的联合创始人正在吃水果和酸奶，而就在他所坐的那张桌子上，埃隆·马斯克曾为贝宝举行了第一场融资会议。到旧金山电池俱乐部的马斯托酒吧小酌，你可能会看到脸书的某位联合创始人的身影。


    奥尔特曼很快就跻身由程序员、投资者和高管组成的硅谷关系网。在这个充满现代气息的旧式精英圈层中，懂得建立人脉意味着更可能被推向财富巅峰。奥尔特曼非常善于交际，他成功打通关系，得以在
    2008 年的苹果年度开发者盛会上展示 Loopt。这位身材修长的年轻企业家下身穿着牛仔裤，上身叠穿了绿色和粉色两件 Polo 衫，造型酷似儿童节目主持人。他告诉观众，Loopt
    是全球最大的社交地图服务平台。“我们制造机缘。”他直视观众，几乎未露笑意地说道。


    从表面上看，一切都很完美。但在私下里，Loopt 发展艰难。大家对于使用奥尔特曼的数字地图去寻找朋友并不那么感兴趣。这名眼界开阔的企业家原以为年轻的手机用户会像他一样希望认识新朋友。然而，你首先要付出很多努力通过屏幕和在酒吧认识的朋友或陌生人互动，才能在打篮球缺人的时候叫他们出来凑数。随着时间的推移，越来越多的人选择在脸书等社交网络上和朋友交流。脸书的发展速度比
    Loopt 快很多。前者已经积累了上亿的活跃用户，而后者的注册用户才勉强达到 500 万。


    更不妙的是，Loopt 开始引发争议。在创办公司一年后，奥尔特曼接到了以前的高中校长安迪·阿博特的电话。阿博特说，家长正强迫孩子使用 Loopt 以便追踪他们的行动。他还提到在一次实地考察活动中，曾有家长致电学校投诉校车超速行驶。“看看你干的好事。”电话那头传来老校长半开玩笑的调侃。


    奥尔特曼听说过更糟糕的事。这名年轻的企业家承认说：“妇女团体对我们表示担忧。”部分男性迫使他们的妻子安装 Loopt，从而随时掌控她们的行踪。这是对数字地图的滥用，令人毛骨悚然且有潜在危险。“但我们正在研究解决方案。”他迅速补充说。Loopt
    的用户可以伪造自己的位置。弱势的女性如果去商店购物，可以伪装成自己在家。


    虽然许多企业家否认他们的软件遭到滥用，但奥尔特曼似乎抱着公开面对这个问题的决心。他十几岁的时候就知道，秘而不宣只会让事情变得更糟。最好把它们公开。他接到了杰西卡·莱辛的电话，当时她还是《华尔街日报》一位锲而不舍的科技记者，访问关于
    Loopt 的隐私问题以及一些滥用方面的担忧。根据莱辛后来发表的一篇报道，奥尔特曼出乎意料地渴望谈论这方面的争议，他甚至通过电子邮件发送给她一份长长的文件，详细说明了使用
    Loopt 带来的所有风险。


    看似终结自身职业生涯的举动其实是一种精明的公关手段，他以后会一而再，再而三地利用这种经过精心算计的逆向心理学策略。通过表达对 Loopt 所导致的最坏结果的极度担忧，奥尔特曼可以消除评论家或者莱辛等记者的敌意。你还能批判他什么呢？毕竟他自己已经批判完了。他似乎高尚到不顾自己的利益——尽管高尚的做法应该是将这一可能被用来跟踪弱势群体的软件关闭。


    最终，是使用者帮他做到了这一点。奥尔特曼错估了人们对共享 GPS（全球定位系统）坐标去邂逅新朋友的抗拒心理。他接着说：“我认识到不能强迫他们去做不想做的事。”


    在 20 多岁的年纪，这位精瘦的年轻企业家把大部分时间花在了疯狂发展 Loopt 上。他利用苹果手机的新推送通知在主屏幕上“打广告”，吸引用户使用 Loopt
    的聊天功能。他协助广告商向 Loopt 的用户发送“限时团购”优惠。他宣称每一次应用程序升级都是一次成功的“扣篮”。“反响非常热烈。”他在 2010 年的一次采访中说。但这只是吹牛而已。到
    2012 年，全世界只有几千人经常使用 Loopt。建立帝国的梦想就此破灭。就像绝大多数科技初创公司一样，Loopt 以失败告终。


    在科技初创界，一个创始人的终极目标要么是将创意培育成估值数十亿美元的企业，要么通过将公司出售给行业巨头实现巨额套现。保持独立越来越难，大多数公司都被谷歌、脸书等科技巨头吞并了。如果能卖掉公司，创始人通常会用得来的资金二次创业，由此蜕变为连续创业者。然而，Loopt
    的离场并不那么盛大。2012 年，奥尔特曼以 4 300 万美元的价格将其出售给一家礼品卡公司，这笔交易款只能勉强支付投资者的债权和员工工资。


    奥尔特曼本可以立即离开硅谷，但 Loopt 的倒闭使他更加坚信自己应该做一些更有意义的事情。他不是第一个在失败中找到更大抱负的科技创业者。大约 10 年前，埃隆·马斯克被董事会赶出了贝宝。从这次经历中吸取教训的马斯克觉得他已经厌倦了研发消费者支付服务这种肤浅的东西。他在接受采访时说：“我的下一家公司应该带来长期的有利影响。”几年后，他确实做到了。马斯克遇见了特斯拉的创始人，并致力于减缓威胁人类生存的气候变化。


    朝着坐在旧金山电池俱乐部里的那群人扔一部智能手机，至少会砸到 3 个自诩正在拯救世界的科技精英。硅谷创业者群体中普遍存在着应用程序改变世界的信念，虽然有些人确实开发出了惠及千万用户的实用产品，但也有不少人因此产生了一种强烈的“救世主情结”。硅谷对创新的重视，加上格雷厄姆提倡的“创始人至上”的原则，使这种“救世主”文化无处不在。作为顶尖的创新黑客，不仅要解决工程问题，还要解决困扰人类多年的社会难题。


    奥尔特曼希望通过 Loopt 把人们聚到一起，因为他们需要这样。我们整天盯着屏幕，无意识地刷新，在不同的社交网络上“点赞”，人际关系变得越来越量化。他需要做更有意义的尝试。也许奥尔特曼得给大众提供一些他们不知道自己想要的东西。这是苹果公司多年来的成功做法，也是所有硅谷创业家想要破解的秘密。


    这名在圣路易斯市长大的年轻人决心重返初创公司竞技场，将自己深度嵌入硅谷的人脉矩阵，从而使自己能够与那些宣称要改变世界的公司站在同一阵营。他将使自己的思想比以前的导师更加深刻，重新挖掘他在斯坦福大学人工智能实验室酝酿的东西。这将引领他追求更宏伟的目标：从迫在眉睫的生存威胁中拯救人类，同时缔造前所未有的财富盛景。


    # 功亏一篑


    一打开 1994 年的电脑游戏《主题公园》，就会响起尖叫声、过山车的轰鸣声和游乐场风琴的叮当声。一大块空荡荡的像素草地正等待被巨大汉堡形状的食品摊位和直冲云霄的过山车轨道填满。这个游戏的目标是尽可能多地赚钱。


    《主题公园》的创作者不是急于向孩子们“兜售”经营信条的中年游戏设计师，而是一名来自伦敦北部名叫德米斯·哈萨比斯的黑发少年。他具有硅谷企业家般的工作态度，并痴迷于玩游戏。多年后，哈萨比斯在全球最强的人工智能系统研发竞赛中成为领跑者，而在此之前，他就已经通过模拟游戏学习到如何经营一家企业，这成为他未来事业的重心，也是他寻求制造比人类更聪明的机器的关键所在。


    在《主题公园》里，玩家初始持有 20 万美元运营资金，用于建造游乐设施和支付员工工资。玩家可以通过销售门票、周边商品、冰激凌，以及运营椰壳投掷游戏等项目挣钱。如果没有足够的机修工，游乐设施会出现故障；如果没有足够的保安，会引发暴徒滋事；如果没有购入足够的糖来制作冰激凌，游客会拒绝购买。工作人员会罢工，要求就薪资进行谈判。时年
    17 岁的哈萨比斯设计了这款巧妙平衡成本与收益的游戏，将其作为高度复杂的企业管理模拟系统。该游戏凭借令人欲罢不能的机制设计，在 1994 年上市后创下了 1
    500 万份销量纪录。


    电子游戏大潮席卷了英国和美国，将孩子们带入了生动的多巴胺世界。在游戏世界里，忍者神龟在横向通关的过程中与敌人战斗，或者你可以驾驶小货车在荒野上横冲直撞。但哈萨比斯认为，最好的电子游戏是对现实生活的模拟。在“上帝类游戏”中，玩家拥有创造和毁灭的力量。与控制马里奥这种单一角色不同，玩家将塑造成千上万个虚拟人物，打造风景地貌并引领文明发展。你可以建一座城然后让它遭受自然灾害，你也可以让一个主题公园挤满数百名游客。


    这项技术给玩家带来了乐趣，也教会他们知识：从经营企业到探索宇宙奥秘。尽管游戏的全部价值在于娱乐，但哈萨比斯还是产生了一种强烈的愿望，那就是利用游戏创造一个有助于解开人类意识秘密的超级人工智能。


    哈萨比斯追寻宇宙奥秘的使命感超过了大多数科学家，看似标新立异，实际上缘于其不可思议的成长经历。他的家人都率性而有创意，他是家中唯一的数学天才。他的母亲安吉拉是一名虔诚的浸信会教徒，从新加坡移民到英国，在伦敦北部的寄宿家庭里遇到了她未来的丈夫——一个自由奔放的希腊裔塞浦路斯人，名叫科斯塔·哈萨比斯。两人看上去门不当户不对，但他们结了婚并生育了
    3 个孩子，长子就是德米斯。科斯塔的工作一直不稳定，有时当老师，有时经营玩具店，在哈萨比斯 12 岁之前，科斯塔带着全家搬了 10 次家。


    哈萨比斯显然与其他孩子不同。他 4 岁时下国际象棋，就能击败他的父亲和叔叔；6 岁时在当地的国际象棋比赛中打败了大部分同龄儿童，当时他还需要摇摇晃晃地坐在垫子或电话簿上艰难地审视棋盘。他拥有出色的阅读能力，对一切充满好奇，但他投入精力最多的还是玩游戏。当哈萨比斯的父亲把缺了棋子的桌游带回家时，他会利用它们设计新游戏，和弟弟妹妹一起玩。


    但真正有趣的还在后面。20 世纪 90 年代，萨姆·奥尔特曼发现了“美国在线”聊天室，而早在此前 10 年，哈萨比斯正一头栽进某种由黑屏上的粗像素所构成的初级技术里。1984
    年，8 岁的哈萨比斯用赢得的国际象棋比赛奖金买了一台 ZX Spectrum 48（键盘式个人计算机）。这款最早的个人计算机包含一个厚厚的黑色键盘，你可以将其与电视机连接并使用盒式磁带在屏幕上播放彩色图像。


    哈萨比斯购买了编程教材，自学制作适合 Spectrum 电脑的游戏。他会在睡前配置好运算任务，待次日清晨即可获取计算结果。对哈萨比斯来说，这一发现具有启示意义。他成功将认知负荷转移至计算机系统，使
    Spectrum 电脑成为其思维延伸载体。


    哈萨比斯迷上了编程这个小众世界，又购置了一台更强大的 Commodore Amiga 500，这款笨重的白色电脑配了一堆工具，包括鼠标和显示器等。之后他和同学成立了一个黑客俱乐部。他们通过编写代码让屏幕显现彩色图像，模仿之前玩过的游戏场景。哈萨比斯经常为了超过他的朋友们而大费周章。他会把电脑拆开，再把它装回去。他还制作了一款国际象棋电子游戏给弟弟乔治玩。


    国际象棋仍然是哈萨比斯的生活重点，他立志成为世界冠军。他的母亲对此非常支持，开始让他在家接受教育，以便让他有更多时间研究国际象棋。在学校放假期间，他就去参加不同的国际象棋比赛，从未间断。哈萨比斯后来说，游戏就像一个为大脑而设的健身房，而国际象棋则是终极的锻炼方式。就像萨姆·奥尔特曼通过玩扑克学习心理学和商业知识一样，下国际象棋也教会了哈萨比斯如何从目标出发来进行战略规划：先设想目标，再逆向思考。


    改变发生在哈萨比斯 11 岁那年，当时他正在列支敦士登参加国际象棋锦标赛。他的对手是丹麦的国际象棋全国冠军，比赛陷入了漫长的拉锯战。经过 10 个小时的苦战，双方都疲惫不堪，丹麦选手试图逼和。少年哈萨比斯手头还有“国王”和“王后”，但他的对手占有“国王”、“车”、“象”和“马”的优势。身心俱疲的哈萨比斯误判局势，以为自己即将被将死，最终选择认输。


    成为冠军的丹麦选手震惊地问道：“你为什么会认输？”


    他给哈萨比斯演示了棋局的另一种解法。哈萨比斯紧紧盯着棋盘。有时失败会激发出更大的志向。如果无法忍受失败，追逐更大的志向可能就是一种安慰，但哈萨比斯在付出了巨大的努力后，还是遭遇了失败。他环顾四周，看着国际象棋天才们伏在棋盘前冥思苦想，突然意识到整个联赛就是在浪费脑力。这些人都是世界上顶尖的战略思想家，倘若他们致力于解决更重大的问题会怎样？他当时在全球
    14 岁以下国际象棋选手中排名第二，但一切终究只是一场游戏而已。


    哈萨比斯对父母说他不想再参加比赛，想回到学校上学。当时他性格内向、多愁善感，喜欢听恩雅的歌，还自学钢琴弹奏她的单曲《水印》。他最爱看的电影是《银翼杀手》，这是一部科幻电影，讲述一名侦探追捕与真人无异的仿生人的故事。电影中那些感人的场景让他欲罢不能。他反复播放电影最后一幕的配乐，在这段由范吉利斯创作的扣人心弦的音乐中，反派角色哀叹他的记忆将“消逝在时间中，就像眼泪消失在雨里”。


    每到星期日，哈萨比斯的母亲经常带他和弟弟妹妹去伦敦北部的亨顿浸信会教堂。这座矗立在山丘之巅的宏伟灰石建筑俯瞰城郊，教会内部就像一个小型的国际化社区，会聚着来自菲律宾、加纳、法国、印度等地的信徒。对于像哈萨比斯这样拥有一半塞浦路斯血统和一半新加坡血统的孩子来说，这里不难融入。相较于英国国教拘谨的传统仪式，这里的礼拜活动更显生动活泼。大家会举起赞美的手，跟着鼓点和乐队的节奏歌唱。牧师不拘泥于教义，着重强调尊重他人的处世原则。祷告者情感丰沛，而教堂本身毫不掩饰地宣扬福音派。


    尽管浸信会是美国最大的基督教教派之一，但在英国仍属小众。英国国教有 100 万名教众，而浸信会只有大约 15 万名信徒。宗教和上帝的概念令哈萨比斯着迷，他想知道能否通过科学手段找到上帝。他在
    16 岁时提前两年从高中毕业，还读完了诺贝尔奖得主、物理学家史蒂文·温伯格所著的《终极理论之梦》。这本书是对自然统一理论的一种近乎堂吉诃德式的伟大探索。温伯格认为，也许存在一种方法可以用一个方程来解释宇宙中所有的基本力，就像爱因斯坦用方程
    `E=mc²` 总结了能量和质量之间的关系一样。理想情况下，这个“万能理论”应该足够简洁，可以写在单页纸上，甚至能浓缩为一个方程。


    哈萨比斯读得如痴如醉，之后震惊地发现，科学家在这方面并未取得多大进展。他们需要帮助，他想。他们需要强大的智力。也许他能帮上忙？哈萨比斯望向那台曾在他睡觉时彻夜运行计算的“大家伙”。也许一台更智能的电脑能帮上忙。如果他能让电脑变得更智能，使其成为自己思维更强大的延伸，也许它们就能帮助科学家破解宇宙难题，甚至找到神的所在。


    “这似乎是完美的超级解决方案。”哈萨比斯后来在接受《纽约时报》撰稿人埃兹拉·克莱因的采访时解释说。他坦言曾考虑攻读物理学专业，但在读了温伯格的书之后，他觉得自己应该追求更大的目标。通过计算机科学与人工智能新兴领域的交叉研究，他致力于构建能够改善人类生存境遇的终极科学工具。哈萨比斯无法摆脱他对游戏的迷恋，因此制订了一份将两者结合起来的长期计划，关键在于专注开发现实世界模拟类游戏。20
    世纪 80 年代末的游戏已经能够模拟文明的基本特征。既然电脑能够复制世界的完整细节，也许高智能的电脑能够找到修复现实世界缺陷的方法——在模拟中找到解决办法并将之应用到现实生活。


    哈萨比斯从游戏中获得灵感，他最爱的游戏是《上帝也疯狂》。“让我着迷的地方在于，游戏里的世界不仅栩栩如生，而且会跟随玩家的玩法进化。”他说，“你可以把游戏世界的一部分当成沙盒，并围绕它创造新玩法。”


    充满怀旧气息的像素化图像掩盖了这款游戏的复杂性。在一片平坦的绿色山谷里，房屋点缀其间。作为玩家，你就是山谷之神，一身神力，需要引领山谷居民，也就是你的追随者与其他神灵的追随者战斗。你可以抬高或降低地面，把它变得更平坦，好让你的追随者能够建造房屋、繁衍生息。你还可以引发地震。《上帝也疯狂》开了“上帝类游戏”的先河，哈萨比斯爱死这款游戏了，因此决心去开发这款游戏的牛蛙公司工作。他参加了工作竞聘，结果铩羽而归。于是他拿起电话打给公司，请求得到一个星期的实习机会。公司同意了，而且很欣赏他，所以在他
    15 岁的时候又给他提供了一份暑期兼职。


    不久之后，16 岁的哈萨比斯获得了一个在剑桥大学攻读计算机科学专业的名额，但剑桥大学说他年纪太小，应该等一年再入学。于是他又在牛蛙公司待了一年，领取现金报酬，那段时间他就住在公司位于萨里郡吉尔福德市的办公室附近的基督教青年招待所。哈萨比斯起初是一名电子游戏测试员，但很快就升任为关卡设计师，直接向牛蛙公司创始人彼得·莫利纽克斯汇报。


    [^2]: 原文此处有脚注标记。

