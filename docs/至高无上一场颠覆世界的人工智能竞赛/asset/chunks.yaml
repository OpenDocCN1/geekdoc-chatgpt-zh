- raw: '谷歌与世界分享一项发明的某些基础机制，这没什么特殊之处，科技公司都是这样运作的。首先“开源”新技术，然后从研究界获得反馈，以此提高公司在顶尖工程师中的声誉，从而降低雇用他们的难度。但谷歌低估了这种做法给公司造成的负担。发明Transformer的八位研究员都离开了谷歌。他们大多创办了自己的人工智能公司，在撰写本书时，这些公司的总市值超过40亿美元。仅Character.ai就价值10亿美元，并已成为世界上最受欢迎的聊天机器人网站之一。沙泽尔认为，他将带着谷歌没有充分利用的创新技术向前迈进。“搜索引擎是一项价值上万亿美元的技术，但上万亿美元现在也不算什么。”他在加利福尼亚州门洛帕克的办公室里说，“你知道多少才令人激动吗？上千万亿美元。这就是一项价值上千万亿美元的技术，因为搜索旨在让所有人都能获取信息，而人工智能旨在让智慧变得触手可及，并能大幅提高所有人的生产力。”


    沙泽尔离开后，谷歌保留了他的研究项目——聊天机器人Meena，后来改称为LaMDA（对话应用程序语言模型）。公司的科学家继续研究该模型，在外包团队的帮助下对它进行训练和微调，直到其像人类一样对话流畅，而这也让他们大为吃惊。


    尽管这些进展令人兴奋，但谷歌需要将一切技术成果限制在内部——LaMDA或许是世界上最先进的聊天机器人，但只有公司内部的少数人可以使用它。谷歌厌恶发布任何可能破坏其搜索业务的新技术。高层和宣传团队将这种做法美化为“谨慎”，实际上这家公司一心只想维持其声誉和现状。它很快就会经历阿希什·瓦斯瓦尼所说的“宏伟时刻”。当谷歌继续从广告业务中源源不断赚取利润时，OpenAI正朝着通用人工智能迈出看似里程碑式的一步，而且毫无隐瞒。


    **第三幕 账单**


    **10**  **规模很重要**


    谷歌总部位于阳光灿烂的加利福尼亚州芒廷维尤，从这里驾车向北行驶一小时，你将到达旧金山，下了车就会冷得打哆嗦。旧金山的气温通常要比芒廷维尤低上几度，天空中乌云低垂。在谷歌总部，你可以穿T恤衫，但到了OpenAI所在的小镇，你就得穿上夹克。还有一个很大的不同，那就是OpenAI的研究员们因为谷歌管理层妄图秘而不宣的Transformer技术而激动到忘乎所以。对于这些扎根在寒冷的旧金山的研究员来说，有一个想法即将产生结果。


    这家非营利实验室的20多位研究员仍在努力模仿DeepMind的成功模式，渴望在人工智能领域取得下一个重大突破。曾经，他们看着阿尔法围棋打败世界顶尖的围棋选手；现在，他们正在训练自己的智能体玩《远古遗迹守卫2》，这是一款类似于《魔兽世界》的复杂策略性电子游戏。假如一个智能体可以在幻想世界中操控精灵，也许它能比DeepMind的阿尔法围棋更好地捕捉到现实世界混乱和连续的本质。从表面上看，这似乎比在棋盘上移动一些黑白棋子更引人注目。


    据知情人士透露，萨姆·奥尔特曼和德米斯·哈萨比斯之间正在酝酿一场“冷战”，而OpenAI的董事会成员里德·霍夫曼则想让他们化干戈为玉帛。2017年，奥尔特曼和哈萨比斯都出席了由未来生命研究所在加利福尼亚州举办的人工智能安全大会。霍夫曼也去了，他在大会结束后试图安排美国的创业大师和英国的神经科学家共进晚餐。但奥尔特曼对此提议表示反感，他认为哈萨比斯缺少合作性，看上去似乎对他竭力防范的人工智能存在的风险漠不关心。因此，霍夫曼改邀穆斯塔法·苏莱曼出席。奥尔特曼和苏莱曼相处得不错，都希望把世界变得更美好，这两家组织似乎暂时握手言和了。


    但私底下，奥尔特曼和哈萨比斯正在争夺顶尖的工程师。由于背靠科技巨头，哈萨比斯现在占据了上风，相比奥尔特曼，他能为优秀的人工智能专家提供更高的薪酬，还有谷歌的股票。哈萨比斯多次给OpenAI的高层发送电子邮件，提醒他们，他可以在获取人才方面轻松取胜。OpenAI的管理人员会向他们试图招揽的工程师展示这些电子邮件。一名OpenAI前员工回忆道：“如果我们不会成功，他为什么要发这些邮件呢？”


    据与OpenAI关系密切的人士透露，这可能是因为奥尔特曼曾亲自接触DeepMind的工程师，询问他们是否愿意跳槽。另一名前员工说，奥尔特曼对待招聘的态度通常严谨细致，把大约30%的时间都花在了这项工作上，会和每一名被面试的人详细交谈。一名前员工谈到他们接受奥尔特曼面试的经历时说：“我们到他那里去，绕着旧金山的普鲁士山走了一小时。”一旦他们加入公司，奥尔特曼大概率就会表现得平易近人，坐在开放式办公室里，用他的笔记本电脑工作。“任何人都可以在Slack上给他发信息，或者和他交谈。”他们回忆道，“他不会嫌烦。”而在等级文化更严的DeepMind，哈萨比斯往往会待在办公室或会议室，员工很难找到他。你必须通过其他管理人员或门卫，才能争取到与他会面的时间。


    OpenAI还用另一种方式将自己与DeepMind区分开来。OpenAI的科学明星伊尔亚·苏茨克维一直在思考，如何将Transformer应用于语言处理？谷歌用Transformer更好地理解文本，如果OpenAI用它生成文本呢？苏茨克维与OpenAI一名长期验证大语言模型的年轻研究员亚历克·雷德福进行了交谈。虽然OpenAI现在以ChatGPT闻名，但在2017年，它还处于一种“有枣没枣打三竿”的阶段，而雷德福是OpenAI中为数不多关注聊天机器人技术的人之一。


    大语言模型本身仍然是个笑话。它们的回答大多是照本宣科，而且常犯低级错误。雷德福戴着眼镜，一头蓬乱的红棕色头发让他看起来就像高中生。他渴望改进之前所有试图让计算机更加擅长交谈和倾听的研究方法，但他骨子里是一名工程师，希望能更快取得进展。半年多来，他的实验一直在碰壁，花几个星期做一个项目，然后又转向下一个项目。他从互联网论坛Reddit上抓取了20亿条评论，用来训练一个语言模型，但效果不尽如人意。


    Transformer问世后，起初他认为这是谷歌带来的致命一击。显然，大型公司在人工智能领域拥有更多的专业知识。但过了一段时间，谷歌似乎对这项新发明没做什么大动作，雷德福和苏茨克维意识到，他们可以利用这种架构来发挥OpenAI的优势。他们只需要在现有的基础上融入自己的创新就好。为谷歌翻译赋能的Transformer模型使用编码器和解码器处理文字。编码器处理输入信息，比如一句英语；而解码器则生成输出信息，比如一句法语。


    这有点像和两个机器人交谈。第一个机器人（编码器）会听你说的话并记笔记，然后将笔记交给第二个机器人（解码器），它会读取笔记并跟你对话。雷德福和苏茨克维发现，他们可以去掉第一个机器人，只保留解码器，由它倾听，也由它对话。早期测试表明这样做在实践中是有效的，也就是说，他们可以构建一个较为精简的语言模型，而且能够更快、更轻松地解答疑问、扩充功能。同时，“只保留解码器”也将改变游戏规则。通过将“理解”和表达的能力结合到一个流畅的过程里，模型最终可以生成更人性化的文本。


    接下来是大幅提高计算能力，增加数据量和语言模型的容量。苏茨克维长期以来一直认为，在人工智能尤其是语言模型领域，只要扩大规模就能“马到成功”。在最强计算能力的加持下，数据越多，大模型的能力就越强。


    当雷德福用只保留解码器的Transformer对大量文本展开训练时，实验结果让他非常震惊。在多次尝试新的算法设计并均以失败告终后，他感到束手无策，最后他想到了苏茨克维的策略。它很简单，只要输入更多的数据就行。据当时在场的工作人员透露，苏茨克维在办公室里四处走动的时候，见人就会问同样的问题：“你能把它弄大一点吗？”


    多亏了Transformer，雷德福的语言模型实验在两周内取得的进展比之前两年的都多。他和同事们开始研究一个新的语言模型，叫作“生成式预训练变换器”（generatively
    pre-trained transformer，简称“GPT”）。他们在网上找了一个在线资料库对它进行训练，这个资料库含有约7 000本作者自行出版的书籍，其中大部分属于言情小说和色情小说。许多人工智能科学家都用过这个名为“BooksCorpus”的书籍资料库，任何人都可以免费下载。雷德福团队认为，他们这次万事俱备，他们的模型也势必能推断语境。


    随着雷德福的系统越来越先进，OpenAI内外将会质疑这些新的大语言模型能否真正理解语言，而不只是依靠推理。这似乎是微不足道的语义问题，但其中的区别很重要，因为它会在不经意间让人工智能系统听起来比实际强大。以句子“外面在下雨，别忘了带伞”为例。雷德福正在研究的GPT模型可以推断出带伞和下雨之间可能存在的关系，“伞”这个字也和保持干燥的语言有关。但模型并不能像人类那样理解“湿”的概念。它只是更准确地推断了字词之间的这种联系。


    雷德福的实验取得了长足进展，OpenAI开始将越来越多从公共互联网抓取的文本输入模型。尽管这使公司的系统以机器从未有过的方式变得栩栩如生，但它们只是在根据训练数据更准确地预测序列中下一个应该出现的文本。


    这个问题将导致观念分歧，甚至在人工智能界也不能幸免。这些模型越来越先进，是否意味着它们正在产生意识？答案是否定的，但就算是经验丰富的工程师或研究员也会很快变得动摇，他们中的一些人被人工智能生成的文本迷惑了，这些文本似乎充满了同情心和人格，具有非凡的感染力。


    为了完善新的GPT模型，雷德福和同事们从公共互联网收集了更多内容。他们用在线论坛Quora上的问答和中国小学英语试卷里的数千段短文训练模型。2018年6月，雷德福团队发表论文称，他们的模型已习得“重要的世界知识”，因为它吸收了所有的数据。还有一件事让雷德福团队兴奋不已，那就是它可以就没有专门训练过的主题生成文本。虽然他们无法确切地解释原因，但这是好消息。这也意味着他们正在朝着创建通用目的系统的方向前进。用于训练的资料库越大，模型的知识就越丰富。


    即使是第一代GPT生成的简短文本，也比大多数计算机语言处理程序的表现要好。在此之前，计算机程序处理语言依赖于数以百万计的文本示例，它们由人工标注，是一种数据录入工作。这些程序大多不是用于聊天机器人，而是用于分析产品评论之类的内容。例如，工人会把“我喜欢这款产品”标注为正面评价，把“还可以”标注为中性评价。这样做不仅速度慢，而且成本高。但GPT就不一样了，因为它是从一大堆看似随机的文本中进行学习的，这些文本并未经过标注，却能让它掌握语言是如何运作的。它没有遵循那些人类标注者的指导。


    你可以将这些别样的方法想象成一种新的教育方式。例如，假设有两组艺术类学生正在学习绘画。第一组学生拿到一本绘画作品集，每一幅作品都标有“日出”“肖像”“抽象”等说明文字。传统人工智能模型就是这样从标注数据中学习的。这是一种结构化且精确的方法——类似告知艺术类学生每幅画到底代表了什么，但也限制了机器的推断能力。它们只能调用已经被标注过的内容。第一组学生可能很难创作出一幅没有在书中被具体描述过的绘画作品。


    现在，假设第二组艺术类学生被允许参观整个美术馆，该美术馆拥有大量未经标注的绘画收藏。他们可以自由地四处走动，观察并解读艺术作品。这有点像GPT从大量未标注文本中学习的方式。艺术类学生（或者说人工智能模型）没有被告知每一幅画的细节，他们会自己寻找模式、风格和技巧，最终吸收各种风格技巧并融会贯通。这是一种更丰富的学习方式。雷德福团队意识到，海量接触语言用法和语言差异，能让GPT模型生成更具创造性的回复文本。


    一旦完成了初始训练，他们就使用一些标注示例对新模型进行微调，以使其在特定的任务上表现得更好。这样的两步法让GPT更加灵活，也减少了对大量标记文本示例的依赖。


    与此同时，苏茨克维也在密切关注谷歌的进展，那里的工程师终于将Transformer投入使用了。除了改进公司小问题不断的翻译服务外，谷歌还用它开发了一个叫作BERT的新程序，帮助其搜索引擎变得更好。现在它可以更好地推断搜索查询的语境，比如使用者想要的是苹果公司的信息，还是苹果这种水果的信息。BERT的表现在自然语言处理领域引起了轰动。


    “那时人们才知道，‘好吧，只要拿着这些预先训练过的模型对数据进行一点微调，就能得到超凡表现’。”人工智能研究专家阿拉温德·斯里尼瓦斯说，“这彻底改变了自然语言处理。”斯里尼瓦斯于2021年从谷歌跳槽到OpenAI帮助开发语言模型，之后创办了自己的公司Perplexity（人工智能搜索引擎公司）。


    直到2019年末，谷歌才开始将BERT应用于英语搜索查询，但OpenAI的工程师再一次感到不安。OpenAI的员工大多仍是肩负使命的梦想家，他们的预算只是“谷歌大脑”或DeepMind的一点零头。2017年，OpenAI在薪资和计算能力上支付了大约3
    000万美元，而DeepMind的相关费用超过4.4亿美元。


    顶尖的人工智能专家与美国国家橄榄球联盟的球员薪资相当，有时一年能挣数百万美元。即便如此，OpenAI的联合创始人之一沃伊切赫·扎伦巴后来也承认，为了加入OpenAI，他拒绝了“近乎疯狂”的工作邀请，对方给出的薪资几乎是市场行情的两三倍。其他加入OpenAI的人也是一样，他们希望和苏茨克维这样的科学明星共事，也真正相信创造人工智能为人类造福的使命。但这一目标无法起到长期的激励作用，谷歌带来的威胁迫在眉睫。从Transformer到用于训练人工智能模型的高效专门芯片TPU（张量处理单元），只要它想，这家搜索巨头就能拥有开发通用人工智能所需要的一切资源。


    OpenAI的一名前管理人员回忆道：“早上醒来，我总在担忧谷歌会抢先发布更好的产品。”利用像Transformer这样由谷歌发明的成果，OpenAI感觉像是在摆弄这家搜索巨头的“玩具”，而且不知怎么居然还没出问题。“我们没想过会赢得胜利。”


    奥尔特曼也很惶恐。自从最大的“金主”马斯克退出后，他、布罗克曼以及整个创始团队都意识到，继续做非营利组织是行不通的。如果他们真想开发通用人工智能，那就需要更多的资金。根据一份公开的税务申报文件，2016年，仅苏茨克维就赚了190万美元报酬，但这仍然低于他在“谷歌大脑”或脸书时的收入。支付科学明星的薪资是OpenAI最大的一笔支出，其次是计算能力的成本。


    OpenAI这样的公司不可能用普通办公用的笔记本电脑来训练人工智能模型。为了快速处理多达数十亿条的训练数据，它需要专用于服务器的强大芯片，这些芯片通常要从亚马逊网络服务、谷歌云平台或微软Azure平台等云服务提供商处租用。这些公司在巨大的仓库里运行着无数足球场般大小的计算机场，而这些“云”计算机让它们在人工智能热潮中赚得盆满钵满。到2024年初，英伟达的市值开始逼近2万亿美元，因为市场对其用于训练人工智能模型的GPU芯片的需求迅速增长。离开科技巨头独立开发通用人工智能几乎是不可能的，因此开发人员别无选择，只能在这些公司的帮助下创建他们的系统。


    这就是OpenAI所处的困境。它需要租用更多的云计算机，而且资金也即将告罄。布罗克曼告诉其他高管：“我们需要筹集的资金远远超过我们作为非营利组织的能力，我们需要筹集数十亿美元。”


    创始团队知道他们需要重新思考自己的战略，于是开始起草一份关于通用人工智能之路的内部文件。2018年4月，他们在官方网站上发布了所谓的“新章程”。这份新章程不仅阐述了宏伟的目标和郑重的承诺，而且暗示了这家非营利组织的转型方式。


    对于那些希望OpenAI能明确发展方向的人来说，这份章程多少有些令人失望。它对通用人工智能的定义简短而又空洞：“高度自主的系统，在多数具有经济价值的工作中表现超越人类。”但OpenAI是如何得出这一结论的？这家非营利组织没有透露。章程还表明，OpenAI“对人类负有信托责任”，不会利用人工智能技术帮助“集权”。众所周知，大多数公司对股东和投资者负有信托责任或法定责任，但在这里，OpenAI强调了它的与众不同。它是为了人类。


    章程补充道，开发通用人工智能应该合作而不是“竞争”，“因此，如果某个价值观一致、安全意识强的项目比我们更接近创建通用人工智能，我们承诺放弃竞争并开始支持这个项目”。换句话说，OpenAI会放下自己的工具，帮助其他可能成功开发通用人工智能的研究人员。


    文件听上去相当宽宏大度。OpenAI将自己塑造为一个高度进化的组织，将人类的利益置于利润、声望等传统的硅谷价值之上。其中的关键在于“广泛分配利益”，或者说将通用人工智能的回报分给全人类。这呼应了奥尔特曼在被奉为创业大师多年后所培养起来的一种高尚的做事方式。


    但仔细推敲之后就会发现，这也像是奥尔特曼和布罗克曼准备放弃OpenAI的创立原则。3年前，他们在成立这家非营利组织时表示，OpenAI的研究“不被经济动机所约束”。现在，OpenAI的章程顺便提到它实际上需要很多资金。“我们预计需要调动大量资源来完成使命，”他们写道，“但我们将始终努力采取行动，尽量减少员工和利益相关者之间的利益冲突，以免损害广泛的利益。”


    随着章程公之于众，奥尔特曼一边筹集“大量资源”，一边努力寻找改变OpenAI初始规则的方法。两个月前，当马斯克宣布退出时，奥尔特曼就立即打电话给他最忠实的支持者之一、亿万富翁里德·霍夫曼寻求建议。霍夫曼对人工智能持乐观态度，完全相信奥尔特曼对通用人工智能的愿景。他提出愿意支付OpenAI的当前开销和薪资以维持运转，但两人都清楚这并非长久之计。


    奥尔特曼告诉霍夫曼，他可能有办法解决这个问题，那就是建立战略合作伙伴关系。“战略合作伙伴关系”是一种方便的说法，公司经常用其代指那些可能让它们保持距离或受到严格约束的广泛企业关系。它意味着在两家公司之间分享资金和技术，或者签订许可协议。这一意义不明的术语足以掩盖某种企业关系的尴尬本质，这种关系可能与复杂的财务状况有关，也可能是一家公司对另一家公司拥有令人难堪的控制权。“伙伴关系”暗示一种更公平的关系，即使事实并非如此，也不会让人追问太多尴尬的问题。而这正是奥尔特曼需要的。


    奥尔特曼不想把OpenAI卖给大型科技公司，然后完全丧失控制权——就像DeepMind“卖身”给谷歌一样。而战略合作伙伴关系在带给他OpenAI所需计算能力的同时，还能让他产生一种更大程度上独立于大型科技公司的错觉。奥尔特曼和霍夫曼讨论了与谷歌、亚马逊合作的可能性，但微软很快就成为一个显而易见的选择。两人都和微软有私人关系。他们都认识微软首席技术官凯文·斯科特，而且霍夫曼和微软首席执行官萨提亚·纳德拉关系密切。


    霍夫曼是一个身材圆润的乐天派，一脸孩子气的笑容。对OpenAI来说，他的真正价值不在于钱，而在于人脉。他非常善于结交朋友和拉近关系，因此还创立了世界上排名第一的专业社交网站领英。2016年，他以262亿美元的价格把公司卖给微软，净赚大约37亿美元，之后加盟传奇风险投资公司格雷洛克合伙公司（Greylock
    Partners），开启了投资初创公司的新职业生涯。


    从亿万富翁转型为投资人有利有弊。霍夫曼现在非常富有，他可以把钱投给企业家而不必太担心血本无归。旧金山湾区正在寻找下一个科技爆点的其他投资者认为，霍夫曼毫不在意成败。因此，他们并不总是相信霍夫曼的投资眼光，但得承认他更愿意冒险，其中就包括在企业家和硅谷的“建制派”成员之间牵线搭桥。将公司卖给微软后，霍夫曼可以直接和纳德拉联系，因为霍夫曼也是微软董事会的一员。


    “你应该确保和他进行一次谈话。”霍夫曼在提到微软首席执行官时，对奥尔特曼说。'
  fmt: '

    # 背景：Transformer的发明与人才流失


    谷歌与世界分享一项发明的某些基础机制，这没什么特殊之处，科技公司都是这样运作的。首先“开源”新技术，然后从研究界获得反馈，以此提高公司在顶尖工程师中的声誉，从而降低雇用他们的难度。但谷歌低估了这种做法给公司造成的负担。发明Transformer的八位研究员都离开了谷歌。他们大多创办了自己的人工智能公司，在撰写本书时，这些公司的总市值超过40亿美元。仅Character.ai就价值10亿美元，并已成为世界上最受欢迎的聊天机器人网站之一。沙泽尔认为，他将带着谷歌没有充分利用的创新技术向前迈进。“搜索引擎是一项价值上万亿美元的技术，但上万亿美元现在也不算什么。”他在加利福尼亚州门洛帕克的办公室里说，“你知道多少才令人激动吗？上千万亿美元。这就是一项价值上千万亿美元的技术，因为搜索旨在让所有人都能获取信息，而人工智能旨在让智慧变得触手可及，并能大幅提高所有人的生产力。”


    沙泽尔离开后，谷歌保留了他的研究项目——聊天机器人Meena，后来改称为LaMDA（对话应用程序语言模型）。公司的科学家继续研究该模型，在外包团队的帮助下对它进行训练和微调，直到其像人类一样对话流畅，而这也让他们大为吃惊。


    尽管这些进展令人兴奋，但谷歌需要将一切技术成果限制在内部——LaMDA或许是世界上最先进的聊天机器人，但只有公司内部的少数人可以使用它。谷歌厌恶发布任何可能破坏其搜索业务的新技术。高层和宣传团队将这种做法美化为“谨慎”，实际上这家公司一心只想维持其声誉和现状。它很快就会经历阿希什·瓦斯瓦尼所说的“宏伟时刻”。当谷歌继续从广告业务中源源不断赚取利润时，OpenAI正朝着通用人工智能迈出看似里程碑式的一步，而且毫无隐瞒。


    # 第三幕 账单


    ## 10 规模很重要


    谷歌总部位于阳光灿烂的加利福尼亚州芒廷维尤，从这里驾车向北行驶一小时，你将到达旧金山，下了车就会冷得打哆嗦。旧金山的气温通常要比芒廷维尤低上几度，天空中乌云低垂。在谷歌总部，你可以穿T恤衫，但到了OpenAI所在的小镇，你就得穿上夹克。还有一个很大的不同，那就是OpenAI的研究员们因为谷歌管理层妄图秘而不宣的Transformer技术而激动到忘乎所以。对于这些扎根在寒冷的旧金山的研究员来说，有一个想法即将产生结果。


    这家非营利实验室的20多位研究员仍在努力模仿DeepMind的成功模式，渴望在人工智能领域取得下一个重大突破。曾经，他们看着阿尔法围棋打败世界顶尖的围棋选手；现在，他们正在训练自己的智能体玩《远古遗迹守卫2》，这是一款类似于《魔兽世界》的复杂策略性电子游戏。假如一个智能体可以在幻想世界中操控精灵，也许它能比DeepMind的阿尔法围棋更好地捕捉到现实世界混乱和连续的本质。从表面上看，这似乎比在棋盘上移动一些黑白棋子更引人注目。


    据知情人士透露，萨姆·奥尔特曼和德米斯·哈萨比斯之间正在酝酿一场“冷战”，而OpenAI的董事会成员里德·霍夫曼则想让他们化干戈为玉帛。2017年，奥尔特曼和哈萨比斯都出席了由未来生命研究所在加利福尼亚州举办的人工智能安全大会。霍夫曼也去了，他在大会结束后试图安排美国的创业大师和英国的神经科学家共进晚餐。但奥尔特曼对此提议表示反感，他认为哈萨比斯缺少合作性，看上去似乎对他竭力防范的人工智能存在的风险漠不关心。因此，霍夫曼改邀穆斯塔法·苏莱曼出席。奥尔特曼和苏莱曼相处得不错，都希望把世界变得更美好，这两家组织似乎暂时握手言和了。


    但私底下，奥尔特曼和哈萨比斯正在争夺顶尖的工程师。由于背靠科技巨头，哈萨比斯现在占据了上风，相比奥尔特曼，他能为优秀的人工智能专家提供更高的薪酬，还有谷歌的股票。哈萨比斯多次给OpenAI的高层发送电子邮件，提醒他们，他可以在获取人才方面轻松取胜。OpenAI的管理人员会向他们试图招揽的工程师展示这些电子邮件。一名OpenAI前员工回忆道：“如果我们不会成功，他为什么要发这些邮件呢？”


    据与OpenAI关系密切的人士透露，这可能是因为奥尔特曼曾亲自接触DeepMind的工程师，询问他们是否愿意跳槽。另一名前员工说，奥尔特曼对待招聘的态度通常严谨细致，把大约30%的时间都花在了这项工作上，会和每一名被面试的人详细交谈。一名前员工谈到他们接受奥尔特曼面试的经历时说：“我们到他那里去，绕着旧金山的普鲁士山走了一小时。”一旦他们加入公司，奥尔特曼大概率就会表现得平易近人，坐在开放式办公室里，用他的笔记本电脑工作。“任何人都可以在Slack上给他发信息，或者和他交谈。”他们回忆道，“他不会嫌烦。”而在等级文化更严的DeepMind，哈萨比斯往往会待在办公室或会议室，员工很难找到他。你必须通过其他管理人员或门卫，才能争取到与他会面的时间。


    OpenAI还用另一种方式将自己与DeepMind区分开来。OpenAI的科学明星伊尔亚·苏茨克维一直在思考，如何将Transformer应用于语言处理？谷歌用Transformer更好地理解文本，如果OpenAI用它生成文本呢？苏茨克维与OpenAI一名长期验证大语言模型的年轻研究员亚历克·雷德福进行了交谈。虽然OpenAI现在以ChatGPT闻名，但在2017年，它还处于一种“有枣没枣打三竿”的阶段，而雷德福是OpenAI中为数不多关注聊天机器人技术的人之一。


    大语言模型本身仍然是个笑话。它们的回答大多是照本宣科，而且常犯低级错误。雷德福戴着眼镜，一头蓬乱的红棕色头发让他看起来就像高中生。他渴望改进之前所有试图让计算机更加擅长交谈和倾听的研究方法，但他骨子里是一名工程师，希望能更快取得进展。半年多来，他的实验一直在碰壁，花几个星期做一个项目，然后又转向下一个项目。他从互联网论坛Reddit上抓取了20亿条评论，用来训练一个语言模型，但效果不尽如人意。


    Transformer问世后，起初他认为这是谷歌带来的致命一击。显然，大型公司在人工智能领域拥有更多的专业知识。但过了一段时间，谷歌似乎对这项新发明没做什么大动作，雷德福和苏茨克维意识到，他们可以利用这种架构来发挥OpenAI的优势。他们只需要在现有的基础上融入自己的创新就好。为谷歌翻译赋能的Transformer模型使用编码器和解码器处理文字。编码器处理输入信息，比如一句英语；而解码器则生成输出信息，比如一句法语。


    这有点像和两个机器人交谈。第一个机器人（编码器）会听你说的话并记笔记，然后将笔记交给第二个机器人（解码器），它会读取笔记并跟你对话。雷德福和苏茨克维发现，他们可以去掉第一个机器人，只保留解码器，由它倾听，也由它对话。早期测试表明这样做在实践中是有效的，也就是说，他们可以构建一个较为精简的语言模型，而且能够更快、更轻松地解答疑问、扩充功能。同时，“只保留解码器”也将改变游戏规则。通过将“理解”和表达的能力结合到一个流畅的过程里，模型最终可以生成更人性化的文本。


    接下来是大幅提高计算能力，增加数据量和语言模型的容量。苏茨克维长期以来一直认为，在人工智能尤其是语言模型领域，只要扩大规模就能“马到成功”。在最强计算能力的加持下，数据越多，大模型的能力就越强。


    当雷德福用只保留解码器的Transformer对大量文本展开训练时，实验结果让他非常震惊。在多次尝试新的算法设计并均以失败告终后，他感到束手无策，最后他想到了苏茨克维的策略。它很简单，只要输入更多的数据就行。据当时在场的工作人员透露，苏茨克维在办公室里四处走动的时候，见人就会问同样的问题：“你能把它弄大一点吗？”


    多亏了Transformer，雷德福的语言模型实验在两周内取得的进展比之前两年的都多。他和同事们开始研究一个新的语言模型，叫作“生成式预训练变换器”（generatively
    pre-trained transformer，简称“GPT”）。他们在网上找了一个在线资料库对它进行训练，这个资料库含有约7000本作者自行出版的书籍，其中大部分属于言情小说和色情小说。许多人工智能科学家都用过这个名为“BooksCorpus”的书籍资料库，任何人都可以免费下载。雷德福团队认为，他们这次万事俱备，他们的模型也势必能推断语境。


    随着雷德福的系统越来越先进，OpenAI内外将会质疑这些新的大语言模型能否真正理解语言，而不只是依靠推理。这似乎是微不足道的语义问题，但其中的区别很重要，因为它会在不经意间让人工智能系统听起来比实际强大。以句子“外面在下雨，别忘了带伞”为例。雷德福正在研究的GPT模型可以推断出带伞和下雨之间可能存在的关系，“伞”这个字也和保持干燥的语言有关。但模型并不能像人类那样理解“湿”的概念。它只是更准确地推断了字词之间的这种联系。


    雷德福的实验取得了长足进展，OpenAI开始将越来越多从公共互联网抓取的文本输入模型。尽管这使公司的系统以机器从未有过的方式变得栩栩如生，但它们只是在根据训练数据更准确地预测序列中下一个应该出现的文本。


    这个问题将导致观念分歧，甚至在人工智能界也不能幸免。这些模型越来越先进，是否意味着它们正在产生意识？答案是否定的，但就算是经验丰富的工程师或研究员也会很快变得动摇，他们中的一些人被人工智能生成的文本迷惑了，这些文本似乎充满了同情心和人格，具有非凡的感染力。


    为了完善新的GPT模型，雷德福和同事们从公共互联网收集了更多内容。他们用在线论坛Quora上的问答和中国小学英语试卷里的数千段短文训练模型。2018年6月，雷德福团队发表论文称，他们的模型已习得“重要的世界知识”，因为它吸收了所有的数据。还有一件事让雷德福团队兴奋不已，那就是它可以就没有专门训练过的主题生成文本。虽然他们无法确切地解释原因，但这是好消息。这也意味着他们正在朝着创建通用目的系统的方向前进。用于训练的资料库越大，模型的知识就越丰富。


    即使是第一代GPT生成的简短文本，也比大多数计算机语言处理程序的表现要好。在此之前，计算机程序处理语言依赖于数以百万计的文本示例，它们由人工标注，是一种数据录入工作。这些程序大多不是用于聊天机器人，而是用于分析产品评论之类的内容。例如，工人会把“我喜欢这款产品”标注为正面评价，把“还可以”标注为中性评价。这样做不仅速度慢，而且成本高。但GPT就不一样了，因为它是从一大堆看似随机的文本中进行学习的，这些文本并未经过标注，却能让它掌握语言是如何运作的。它没有遵循那些人类标注者的指导。


    你可以将这些别样的方法想象成一种新的教育方式。例如，假设有两组艺术类学生正在学习绘画。第一组学生拿到一本绘画作品集，每一幅作品都标有“日出”“肖像”“抽象”等说明文字。传统人工智能模型就是这样从标注数据中学习的。这是一种结构化且精确的方法——类似告知艺术类学生每幅画到底代表了什么，但也限制了机器的推断能力。它们只能调用已经被标注过的内容。第一组学生可能很难创作出一幅没有在书中被具体描述过的绘画作品。


    现在，假设第二组艺术类学生被允许参观整个美术馆，该美术馆拥有大量未经标注的绘画收藏。他们可以自由地四处走动，观察并解读艺术作品。这有点像GPT从大量未标注文本中学习的方式。艺术类学生（或者说人工智能模型）没有被告知每一幅画的细节，他们会自己寻找模式、风格和技巧，最终吸收各种风格技巧并融会贯通。这是一种更丰富的学习方式。雷德福团队意识到，海量接触语言用法和语言差异，能让GPT模型生成更具创造性的回复文本。


    一旦完成了初始训练，他们就使用一些标注示例对新模型进行微调，以使其在特定的任务上表现得更好。这样的两步法让GPT更加灵活，也减少了对大量标记文本示例的依赖。


    与此同时，苏茨克维也在密切关注谷歌的进展，那里的工程师终于将Transformer投入使用了。除了改进公司小问题不断的翻译服务外，谷歌还用它开发了一个叫作BERT的新程序，帮助其搜索引擎变得更好。现在它可以更好地推断搜索查询的语境，比如使用者想要的是苹果公司的信息，还是苹果这种水果的信息。BERT的表现在自然语言处理领域引起了轰动。


    “那时人们才知道，‘好吧，只要拿着这些预先训练过的模型对数据进行一点微调，就能得到超凡表现’。”人工智能研究专家阿拉温德·斯里尼瓦斯说，“这彻底改变了自然语言处理。”斯里尼瓦斯于2021年从谷歌跳槽到OpenAI帮助开发语言模型，之后创办了自己的公司Perplexity（人工智能搜索引擎公司）。


    直到2019年末，谷歌才开始将BERT应用于英语搜索查询，但OpenAI的工程师再一次感到不安。OpenAI的员工大多仍是肩负使命的梦想家，他们的预算只是“谷歌大脑”或DeepMind的一点零头。2017年，OpenAI在薪资和计算能力上支付了大约3000万美元，而DeepMind的相关费用超过4.4亿美元。


    顶尖的人工智能专家与美国国家橄榄球联盟的球员薪资相当，有时一年能挣数百万美元。即便如此，OpenAI的联合创始人之一沃伊切赫·扎伦巴后来也承认，为了加入OpenAI，他拒绝了“近乎疯狂”的工作邀请，对方给出的薪资几乎是市场行情的两三倍。其他加入OpenAI的人也是一样，他们希望和苏茨克维这样的科学明星共事，也真正相信创造人工智能为人类造福的使命。但这一目标无法起到长期的激励作用，谷歌带来的威胁迫在眉睫。从Transformer到用于训练人工智能模型的高效专门芯片TPU（张量处理单元），只要它想，这家搜索巨头就能拥有开发通用人工智能所需要的一切资源。


    OpenAI的一名前管理人员回忆道：“早上醒来，我总在担忧谷歌会抢先发布更好的产品。”利用像Transformer这样由谷歌发明的成果，OpenAI感觉像是在摆弄这家搜索巨头的“玩具”，而且不知怎么居然还没出问题。“我们没想过会赢得胜利。”


    奥尔特曼也很惶恐。自从最大的“金主”马斯克退出后，他、布罗克曼以及整个创始团队都意识到，继续做非营利组织是行不通的。如果他们真想开发通用人工智能，那就需要更多的资金。根据一份公开的税务申报文件，2016年，仅苏茨克维就赚了190万美元报酬，但这仍然低于他在“谷歌大脑”或脸书时的收入。支付科学明星的薪资是OpenAI最大的一笔支出，其次是计算能力的成本。


    OpenAI这样的公司不可能用普通办公用的笔记本电脑来训练人工智能模型。为了快速处理多达数十亿条的训练数据，它需要专用于服务器的强大芯片，这些芯片通常要从亚马逊网络服务、谷歌云平台或微软Azure平台等云服务提供商处租用。这些公司在巨大的仓库里运行着无数足球场般大小的计算机场，而这些“云”计算机让它们在人工智能热潮中赚得盆满钵满。到2024年初，英伟达的市值开始逼近2万亿美元，因为市场对其用于训练人工智能模型的GPU芯片的需求迅速增长。离开科技巨头独立开发通用人工智能几乎是不可能的，因此开发人员别无选择，只能在这些公司的帮助下创建他们的系统。


    这就是OpenAI所处的困境。它需要租用更多的云计算机，而且资金也即将告罄。布罗克曼告诉其他高管：“我们需要筹集的资金远远超过我们作为非营利组织的能力，我们需要筹集数十亿美元。”


    创始团队知道他们需要重新思考自己的战略，于是开始起草一份关于通用人工智能之路的内部文件。2018年4月，他们在官方网站上发布了所谓的“新章程”。这份新章程不仅阐述了宏伟的目标和郑重的承诺，而且暗示了这家非营利组织的转型方式。


    对于那些希望OpenAI能明确发展方向的人来说，这份章程多少有些令人失望。它对通用人工智能的定义简短而又空洞：“高度自主的系统，在多数具有经济价值的工作中表现超越人类。”但OpenAI是如何得出这一结论的？这家非营利组织没有透露。章程还表明，OpenAI“对人类负有信托责任”，不会利用人工智能技术帮助“集权”。众所周知，大多数公司对股东和投资者负有信托责任或法定责任，但在这里，OpenAI强调了它的与众不同。它是为了人类。


    章程补充道，开发通用人工智能应该合作而不是“竞争”，“因此，如果某个价值观一致、安全意识强的项目比我们更接近创建通用人工智能，我们承诺放弃竞争并开始支持这个项目”。换句话说，OpenAI会放下自己的工具，帮助其他可能成功开发通用人工智能的研究人员。


    文件听上去相当宽宏大度。OpenAI将自己塑造为一个高度进化的组织，将人类的利益置于利润、声望等传统的硅谷价值之上。其中的关键在于“广泛分配利益”，或者说将通用人工智能的回报分给全人类。这呼应了奥尔特曼在被奉为创业大师多年后所培养起来的一种高尚的做事方式。


    但仔细推敲之后就会发现，这也像是奥尔特曼和布罗克曼准备放弃OpenAI的创立原则。3年前，他们在成立这家非营利组织时表示，OpenAI的研究“不被经济动机所约束”。现在，OpenAI的章程顺便提到它实际上需要很多资金。“我们预计需要调动大量资源来完成使命，”他们写道，“但我们将始终努力采取行动，尽量减少员工和利益相关者之间的利益冲突，以免损害广泛的利益。”


    随着章程公之于众，奥尔特曼一边筹集“大量资源”，一边努力寻找改变OpenAI初始规则的方法。两个月前，当马斯克宣布退出时，奥尔特曼就立即打电话给他最忠实的支持者之一、亿万富翁里德·霍夫曼寻求建议。霍夫曼对人工智能持乐观态度，完全相信奥尔特曼对通用人工智能的愿景。他提出愿意支付OpenAI的当前开销和薪资以维持运转，但两人都清楚这并非长久之计。


    奥尔特曼告诉霍夫曼，他可能有办法解决这个问题，那就是建立战略合作伙伴关系。“战略合作伙伴关系”是一种方便的说法，公司经常用其代指那些可能让它们保持距离或受到严格约束的广泛企业关系。它意味着在两家公司之间分享资金和技术，或者签订许可协议。这一意义不明的术语足以掩盖某种企业关系的尴尬本质，这种关系可能与复杂的财务状况有关，也可能是一家公司对另一家公司拥有令人难堪的控制权。“伙伴关系”暗示一种更公平的关系，即使事实并非如此，也不会让人追问太多尴尬的问题。而这正是奥尔特曼需要的。


    奥尔特曼不想把OpenAI卖给大型科技公司，然后完全丧失控制权——就像DeepMind“卖身”给谷歌一样。而战略合作伙伴关系在带给他OpenAI所需计算能力的同时，还能让他产生一种更大程度上独立于大型科技公司的错觉。奥尔特曼和霍夫曼讨论了与谷歌、亚马逊合作的可能性，但微软很快就成为一个显而易见的选择。两人都和微软有私人关系。他们都认识微软首席技术官凯文·斯科特，而且霍夫曼和微软首席执行官萨提亚·纳德拉关系密切。


    霍夫曼是一个身材圆润的乐天派，一脸孩子气的笑容。对OpenAI来说，他的真正价值不在于钱，而在于人脉。他非常善于结交朋友和拉近关系，因此还创立了世界上排名第一的专业社交网站领英。2016年，他以262亿美元的价格把公司卖给微软，净赚大约37亿美元，之后加盟传奇风险投资公司格雷洛克合伙公司（Greylock
    Partners），开启了投资初创公司的新职业生涯。


    从亿万富翁转型为投资人有利有弊。霍夫曼现在非常富有，他可以把钱投给企业家而不必太担心血本无归。旧金山湾区正在寻找下一个科技爆点的其他投资者认为，霍夫曼毫不在意成败。因此，他们并不总是相信霍夫曼的投资眼光，但得承认他更愿意冒险，其中就包括在企业家和硅谷的“建制派”成员之间牵线搭桥。将公司卖给微软后，霍夫曼可以直接和纳德拉联系，因为霍夫曼也是微软董事会的一员。


    “你应该确保和他进行一次谈话。”霍夫曼在提到微软首席执行官时，对奥尔特曼说。

