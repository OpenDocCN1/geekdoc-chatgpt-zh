  trans: '

    # Microsoft、OpenAI 与生成式 AI 的崛起


    ## GitHub Copilot：AI 结对编程助手


    最后他终于弄明白了：Copilot 这类代码助手，微软正将其打造成一个深受开发者喜爱的程序——Visual Studio。一旦你输入部分代码，Copilot
    便会以淡色文本闪现，提示下一行代码。它宛如自动填词工具，只不过服务对象是软件开发。若开发者采纳建议，只需敲击一下 Tab 键，Copilot 即可编写完整的代码段落，涵盖如应用程序登录等由多行代码构成的完整函数。


    微软仍在收集开发者反馈，迄今仅发布了该系统的预览版。但纳德拉表示，程序员已发现效率大幅提升，因为 Copilot 编写了高达 20% 的代码，比例颇为可观。


    ## Transformer 架构与 Codex 模型


    Copilot 基于 OpenAI 的新模型 `Codex`（代码生成训练模型）构建，其设计类似于该公司最新的语言模型 `GPT-3.5`，训练数据源自全球最大的代码库之一——GitHub。


    通过 Copilot，OpenAI 展示了 `Transformer` 在利用“注意力”机制描绘不同数据点间关系时的强大能力。它宛如一种将数据视为星系的映射工具。打个比方，若一颗星代表一个字，`Transformer`
    会将不同字之间的路径与语义相近的字关联起来。无论数据是文字还是像素，皆无妨碍。通过识别这些关系中的模式，`Transformer` 可辅助生成连贯的新数据，无论是文本、代码抑或图像。


    ## 谷歌与微软：截然不同的战略选择


    然而，谷歌未像 OpenAI 那样大规模将 `Transformer` 应用于计算机编程。“这是他们犯下的又一错误，而 OpenAI 选对了方向。”曾任职于谷歌与
    OpenAI 的 AI 创业家阿拉文德·斯里尼瓦斯表示，“若这些模型经过代码预训练，最终将更擅长推理。”


    因为编程需要逐步推理。“如果孩子在学校数学和编程都学得好，通常会被认为更聪明，具备推断和分析复杂事物的能力。”斯里尼瓦斯说，“大语言模型亦是如此。”


    在谷歌管理层眼中，这显得反常，因其业务仅涉及计算机语言与广告。但微软是“软件霸主”，更专注于为开发者打造工具。OpenAI 走运了：训练模型学习编码，不仅讨好新合作伙伴，更提升了模型智能水平。


    索马西格询问纳德拉对萨姆·奥尔特曼的看法。纳德拉回答：“他关心的是解决全球性问题。”据索马西格回忆，奥尔特曼与纳德拉的谈话“超尘拔俗”，甚至让纳德拉对合作更添期待。仿佛奥尔特曼的理想越疯狂、越乌托邦，纳德拉越信其能助微软成长。


    开发通用人工智能曾是 AI 领域的边缘想法，但对这家软件巨头而言，正演变为可商业化的概念。它能助微软打造更好的电子表格，更大的益处是：它带来了一套能提升所有微软软件智能水平的工具。


    ## 微软内部的 AI 推进与研究院的摩擦


    纳德拉认为 GitHub Copilot 影响深远。“这套成熟的服务系统将改变世界。”索马西格说，更别提将其应用到其他软件中。意识到这一点后，纳德拉与首席技术官凯文·斯科特在微软内部大力推行
    AI，几乎在每次产品评审或决策会上都提及此技术。“为什么你们团队不用 AI？全力投入 AI，尽可能使用 OpenAI 模型。”


    这自然让微软研究院数百名 AI 专家不满，他们多年致力于 AI 模型研究。媒体报道称，有听到批评的 AI 研究员透露，纳德拉斥责该部门管理层，称其研究成果远不如人员更少的
    OpenAI。


    硅谷科技媒体 The Information 报道，纳德拉对微软研究院负责人说：“OpenAI 仅用 250 人便完成该项目。我们还要微软研究院何用？”


    一位资深 AI 科学家转述，纳德拉还告诫研究人员勿尝试开发所谓的基础模型，或如 OpenAI `GPT` 这类大型系统。部分员工因沮丧而离职。


    但即便是他们也不得不承认，Copilot 是绝佳工具，能助程序员编写新代码并加速处理现有代码。纳德拉考虑在微软服务中广泛应用 AI，利用 OpenAI 语言模型技术改进用户起草邮件和生成电子表格的方式。


    ## DALL-E 2：从文本生成图像的突破


    2022 年初，索马西格与纳德拉会面几周后，OpenAI 开始测试 `GPT-3` 更高级版本，这些版本均以历史名家命名——埃达、巴贝奇、居里与达·芬奇。随着时间的推移，这些模型处理复杂问题和给出个性化回答的能力日益增强。总体而言，公众尚未意识到该软件已多么先进。直到
    2022 年 4 月，OpenAI 将 `GPT-3` 部分语言能力应用于视觉图像，公开其首个重大发明，局面才开始改变。


    两年来，在旧金山 OpenAI 办公楼一角，三名研究员一直尝试用扩散模型生成图像。扩散模型本质上通过逆向操作创建图像。艺术家从空白画布起笔，扩散模型则从凌乱画布开始，上面已涂抹大量色彩与随机细节。模型在数据中加入大量“噪声”或随机性使其不可识别，再逐步减少噪声，缓慢呈现图像细节与结构。每推进一步，图像便更清晰、细致，宛如画家不断打磨作品。这种扩散方法结合一种名为
    `CLIP` 的图像标注工具，构成了新模型基础，研究员将其命名为 `DALL-E 2`。


    此名致敬 2008 年动画电影《机器人总动员》及超现实主义画家萨尔瓦多·达利。`DALL-E 2` 生成的图像有时极具超现实感，但对初见者而言，工具本身就非同寻常。输入“牛油果形状的椅子”等提示词，即可获得一系列图像，许多栩栩如生。即使高度复杂的提示词，`DALL-E
    2` 也能精准呈现，发布数日即在推特走红，用户竞相创作奇特图像，如“戴宽边帽的仓鼠怪兽攻击东京”或“醉醺醺的赤膊男子在魔多闲逛”。虽人物面部常显怪异，但不可否认其精致度远超过往计算机生成作品。公众首次体验其能力，OpenAI
    遂成媒体宠儿。


    ## 发布策略：OpenAI 的“交付”哲学


    谷歌选择保密此类创新，奥尔特曼却认为尝试 OpenAI 新产品的人越多越好。作为硅谷创业导师，多年来他建议创业者将产品推向世界。技术界称之为“交付”策略或发布“最小可行产品”（MVP），核心理念一致：尽快将软件交到用户手中，在开发者与用户间建立反馈循环，实则是将公众作为实验对象。测试产品的最佳方式就是大胆发布。Facebook、Uber、Stripe
    等巨头皆建立于此信条，奥尔特曼也是坚定拥护者。


    随后几个月，OpenAI 逐步推出 `DALL-E 2`，为防生成冒犯或有害图像，先面向约 100 万预约用户。5 个月后，OpenAI 解除 `DALL-E
    2` 使用限制，呼应其曾用“噢，还不错”断言 `GPT-2` 不构成威胁。


    ## 版权争议与偏见问题


    训练 `DALL-E 2` 的海量图像抓取自公网，但 OpenAI 对此含糊其辞，一如既往。能成功生成毕加索风格图像，很可能意味着其画作已纳入训练数据。但这难以确证，也无法知晓其他不知名艺术家作品是否被用于训练，因
    OpenAI 拒透露训练数据细节，担心被不法分子复制模型。


    格雷格·鲁特科夫斯基经历波折才发现这一点。他是波兰数字艺术家，以描绘尖牙喷火龙与巫师的奇幻风景画闻名。他的名字成为 `DALL-E 2` 竞品——开源且媲美的
    `Stable Diffusion`（AI 绘画工具）最热门提示词之一。这引发担忧：若软件能创作鲁特科夫斯基风格作品，为何还要花钱购买其真迹？


    `DALL-E 2` 的另一问题也引发关注。若让其生成 CEO 图像，人物几乎皆为白人男性。输入“护士”仅生成女性，输入“律师”仅生成男性。


    奥尔特曼在 2022 年 4 月采访中被问及此事，延续“直面争议”风格，承认问题但强调 OpenAI 正努力解决。一项做法是从训练数据删除暴力与色情图像，防止
    `DALL-E 2` 生成此类内容。


    OpenAI 还在肯尼亚等发展中国家雇佣承包商，引导模型给出更恰当回答。这至关重要，意味着即使完成 `GPT-3`、`DALL-E 2` 等模型训练，OpenAI
    仍可在人工审核员协助下微调系统，使回答更精准、适宜、合乎伦理。通过对 `DALL-E 2` 回答按优劣排序，人类可引导其找到整体更优回答。


    然而，审核员评分不总一致，且从 `DALL-E 2` 训练数据剔除问题图像如同打地鼠游戏。起初，OpenAI 研究员试图删除训练集中所有过度性感的女性图像，以免
    `DALL-E 2` 将女性描绘为性感对象。但结果不尽如人意。时任 OpenAI 研究与产品主管的米拉·穆拉蒂表示，此举“极大”减少了数据集中的女性数量。她未透露具体数字。“我们不得不调整，因不希望模型‘变笨’。这确实棘手。”


    `DALL-E 2` 生成的逼真面孔在刻板印象问题上成最大麻烦源，OpenAI 似已充分意识。因此，当由 400 名微软与 OpenAI 员工组成的内部小组测试系统时，OpenAI
    禁止公开分享 `DALL-E 2` 生成的逼真人物肖像。


    OpenAI 如此迅速推出生成虚假照片的工具，令部分员工担忧。它已从最初致力于安全 AI 的非营利组织，转变为市场上最激进的 AI 公司之一。一位负责安全测试的匿名员工告诉《连线》，OpenAI
    发布技术似为向世界炫耀，尽管“目前仍存诸多潜在危害”。


    但奥尔特曼仍追求更远大目标。他认为，新系统是通往 AGI 道路上重要跨越。他在采访中说：“它似真能理解概念，感觉拥有智能。”他补充道，`DALL-E 2`
    的神奇能让 AGI 怀疑论者认真对待此想法。


    `DALL-E 2` 的神奇不仅在于能力，更在于对人们的影响。“图像蕴含情感力量。”奥尔特曼说。`DALL-E 2` 引发轰动。GitHub Copilot
    只能在已有代码基础上续写，而 `DALL-E 2` 能从无到有创造完整内容。它宛如一位按客户要求作画的图形艺术家。


    ## ChatGPT 的诞生：从补全到生成


    这种生成完整内容的想法，让奥尔特曼的下一步行动更惊世骇俗。`GPT-1` 更似自动补全工具，仅延续人类输入。但 `GPT-3` 及其升级版 `GPT-3.5`
    能生成全新文章，如同 `DALL-E 2` 从零创造图像。


    全球关注 `DALL-E 2` 时，传闻竞品 Anthropic 正开发聊天机器人，激起 OpenAI 竞争欲。2022 年 11 月初，OpenAI 管理层告知员工将在几周内推出基于
    `GPT-3.5` 的聊天机器人。知情人士透露，公司召集十余名员工开发此机器人。它与谷歌 `Meena` 无异，诺姆·沙泽尔两年前已研发出 `Meena`，只是谷歌未公开。


    OpenAI 领导层向员工保证，这非产品发布，而是“低调的研究预览”。但部分员工对如此快发布感到不安。他们不清楚公众使用如此流利强大的语言模型会犯何种错。


    不仅如此，该聊天机器人还常犯事实错误。开发者决定降低系统谨慎度，但这会导致其拒答本能正确回答的问题。他们不愿它说“我不知道”，故调整使其听起来更权威，虽这意味着它有时会胡说八道。这款聊天机器人命名为
    ChatGPT。


    奥尔特曼急于推动产品发布。他认为，ChatGPT 经数百名 OpenAI 员工测试审查，且让人类适应 AI 的使命至关重要，毕竟“亲身下河才知深浅”。在某种程度上，OpenAI
    也在帮世界准备迎接更强大的 `GPT-4`。据当时一位 OpenAI 高管透露，`GPT-4` 内测中写出不错诗歌，编出笑话甚至逗笑管理层。但他们不甚了解其对世界或社会的影响，除非公开发布。OpenAI
    官网称此为“迭代部署”哲学，即公开发布产品以更好研究其安全性与影响力。公司称这是确保为人类利益开发 AGI 的最佳方式。


    ## 现象级爆发：ChatGPT 时刻


    2022 年 11 月 30 日，OpenAI 通过博文宣布推出 ChatGPT 试用版。连许多 OpenAI 员工（含安全研究员）都不知情，有人甚至赌一周后用户数。预计最多吸引
    10 万用户，因该工具仅是个带文本框的网站。在文本框随意输入，后台机器人即回应。该聊天机器人由 `GPT-3.5` 驱动。公众多未闻 OpenAI，更不知
    `GPT-3`。甚至 OpenAI 研究员也不知公测后会发生什么。


    “我们今天推出 ChatGPT。”旧金山时间上午 11:30 左右，奥尔特曼在推特发帖：“试试点击 `http://chat.openai.com` 与它交谈。”


    起初仅少数开发者和科学家登录试用，网络平静无波。但随后几小时，推特上评论渐多：


    - 12:26 @MarkovMagnifico 发布：正在玩 ChatGPT，AGI 提前到来。

    - 12:37 @AndrewHartAR 发布：ChatGPT 刚发布。我看到了未来。

    - 13:37 @skirano 发布：绝对难以置信。我让 ChatGPT 生成个人网站，它逐步展示过程，并添加了 `HTML`（超文本标记语言）和 `CSS`（层叠样式表）。

    - 14:09 @justindross 发布：相比谷歌，ChatGPT 给出更好回答。不可思议。

    - 14:29 @Afinetheorem 发布：别再布置论文或作业了。


    到处是对 ChatGPT 的惊叹，难觅负面评价。其流利表达与丰富知识储备，令人刮目相看。许多人尝试过聊天机器人，无论 Alexa 还是客服机器人，大多习惯在有限范围内磕磕绊绊地聊天。但
    ChatGPT 几乎能流利回答任何问题。这就像从与蹒跚学步的儿童聊天，变为与受过高等教育的成熟成人交谈。


    随后 24 小时，人们蜂拥测试 ChatGPT 极限，服务器不堪重负。专业人士、科技从业者、营销与媒体人员开始实测聊天机器人。为在推特展示，他们将试验变为公开竞赛，比拼谁能让
    ChatGPT 写出最有趣、聪慧或古怪的文字。`DALL-E 2` 掀起的热潮仿佛重演，但声势更大。随后几天，推特被 ChatGPT 写的诗歌、说唱、情景喜剧和邮件截图淹没。越标新立异越受欢迎。


    推特用户托马斯·H·普塔塞克让它“用《钦定版圣经》风格写一段经文，阐述如何从录像机取出花生酱三明治”。


    OpenAI 机器人写道：


    ```

    事情就这样发生了，一个男人被一块花生酱三明治弄得心烦意乱，三明治被放在了录像机里，他不知道怎么把它取出来。


    于是他哀求上帝说：“主啊，我怎么才能把这块三明治从录像机里取出来呢？它粘得太牢了，一动不动。”

    ```


    普塔塞克在推特发帖：“对不起，我无法嘲讽能写出此文的技术。”ChatGPT 用户一周内超 100 万。两月后吸引 3000 万注册用户，成为史上用户增长最快的在线服务之一。2024
    年初，每周约 1 亿人使用 ChatGPT。此前，无独立运行 AI 工具在主流社会如此受欢迎。


    ## GPT-4 与通用人工智能的曙光


    2023 年 3 月 14 日，Anthropic 推出聊天机器人 Claude 当天，OpenAI 发布升级产品 `GPT-4`。只要每月付 20 美元，人人可通过
    `ChatGPT Plus`（ChatGPT 试点订阅计划）使用新技术，预计 2023 年底将为公司带来 2 亿美元收入。部分 OpenAI 员工认为 `GPT-4`
    代表通往 AGI 的重要一步。


    苏茨克维在采访中表示，机器不只从文本学习统计相关性。“文本实为真实世界的投射……神经网络正越来越全面地学习世界、人类，及人类的状况、希望、梦想、动机、互动，还有我们所处的环境。”


    奥尔特曼在另一采访中说：“该系统能观察世界，学会理解世界——其中一种方法是预测接下来会发生什么，我认为这已非常接近人类智能。”


    科技媒体对此着迷。《纽约时报》称 ChatGPT 为“有史以来公开发布的最佳 AI 聊天机器人”。凡试用该系统的记者，皆被其友好热情的回答吸引。一些科技爱好者在推特夸耀用该系统起草邮件等工作文件以提效。


    ## 对就业的冲击与社会反响


    这自然引发新一轮关于 ChatGPT 是否取代人类的媒体报道。奥尔特曼继续通过播客、报纸等宣传，回应公众兴奋，直面大众担忧。他表示，是的，可能取代文案、客服甚至软件开发等工作，但不意味
    ChatGPT 及其底层技术将完全取代人类工作。


    “部分岗位将消失，”奥尔特曼坦言，“但也会出现今天难以想象的更好新岗位。”媒体与公众只能默默接受，因工业革命等历史性转变已证明技术确会给就业市场带来阵痛。何况，ChatGPT
    等生成式 AI 系统非加密货币般昙花一现的潮流。ChatGPT 大有用处。大家已用它写高中论文、拟商业计划、做市场调研。


    OpenAI 员工安慰自己未来可期，认为工业革命机械化生产同样带来新岗位和更好生活水平。但产品开发派与安全派分歧加大，后者努力监管 ChatGPT 激增的输入，防不法查询。苏茨克维信他们迈向
    AGI 迈出重要一步，开始与安全团队更紧密合作。同时，OpenAI 产品团队加大 ChatGPT 商业化力度，邀企业付费使用底层技术。


    ## 谷歌搜索霸权的动摇


    谷歌高管发现，越来越多人选择用 ChatGPT 而非谷歌获取健康或产品建议信息——从广告销售看，这些是最赚钱的搜索词之一。


    可以说谷歌缺乏必要竞争。多年来，它想方设法从每次搜索中敛财，不仅让广告和赞助链接占据结果页，也令产品使用体验令人生厌。若能让用户分不清广告与实际结果，它就能赚更多钱。


    2000—2005 年，谷歌用明显蓝色背景标记广告，确保仅占页面顶部一两个链接。但此后，广告与普通链接界限日益模糊。蓝色背景渐变绿色、黄色，最终消失。广告占据更多页面，迫使用户不断滚动才能找到合适结果。虽用户恼火，但未影响谷歌，因网民认为别无他选。谷歌占据全球
    90% 以上在线搜索市场。

    '
