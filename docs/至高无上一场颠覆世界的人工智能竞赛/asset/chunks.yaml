- raw: '莫利纽克斯脑袋圆圆的，穿着黑色的Polo衫，看上去更像酒吧老板而不是游戏公司大佬。这些年来，由于媒体广泛报道其夸大事实的习惯，他在业内颇受争议。他常对游戏机制或功能夸下海口，例如，他宣称玩家可以在《神鬼寓言》的虚拟世界里种下一颗橡子，几天后再上线时就会发现它已经长成了一棵大树。当然，后面半句话是骗人的。


    但莫利纽克斯也提出了推动行业发展的伟大理念，此刻他正沉浸在《上帝也疯狂》的光辉中。在这位年长的企业家看来，哈萨比斯有着非比寻常的好奇心，甚至有些少年老成。莫利纽克斯回忆道，这名少年神童一直追着他问牛蛙游戏的技术局限，并质疑他们为什么把某些看上去像是基本软件系统的功能称作“人工智能”。


    “无论多离谱的任务，他都能顺利完成。”莫利纽克斯说。这位创始人希望制作一款关于主题公园的模拟游戏，可他的手下都不感兴趣，他们更喜欢刀剑和战斗类游戏。哈萨比斯自告奋勇，在《主题公园》里构建了一个由过山车和食品摊位组成的逼真世界。在数名美工的支持下，莫利纽克斯和哈萨比斯一起设计了新游戏，同时莫利纽克斯也成为后者的导师。在编写代码和设计游戏玩法的间隙，他们经常讨论人工智能的可能性。哈萨比斯对他的老板说，他认为人工智能大概只需要10年就能超越人类并获得感知能力。


    “人工智能的未来似乎触手可及。”这位资深的游戏设计师回忆道，“我们还经常讨论另一个问题，即‘为什么只有人类才能创造东西’，为什么我们不能让人工智能接过创造的重担？”他们设想人工智能最终会创作音乐、诗歌，甚至设计游戏。


    但就目前而言，他们只能使用与人工智能几乎毫不相干的系统给《主题公园》增添一点现实主义色彩。通过机器学习技术，他们赋予背景人物个性，游戏里有些游客更加冲动和愿意花钱，另一些游客则更加节约。这款游戏大获成功。《上帝也疯狂》销售了500万份，而《主题公园》的销售量是它的3倍多。


    这让哈萨比斯在入读剑桥大学时成了名人。他开着从莫利纽克斯那里借来的保时捷豪车在校园里转来转去，急于给校友们留下好印象。相比之前被国际象棋比赛填满的假期，他的大学一年级过得就像在度假，晚上和同学们出去玩，第二天早上躺在床上听超凡乐队的音乐，感受从窗户照进来的阳光。他不是在大学酒吧里喝酒喝到两颊通红，就是在下快棋，或者开着借来的保时捷飙车。最后，他把车撞坏了，不得不打电话给他的导师道歉。“这是他第二次撞车了。”莫利纽克斯尴尬地说。但莫利纽克斯很难对这个经常笑容满面的天才少年生气。“他太有魅力了。”


    哈萨比斯在剑桥大学认识了未来核心朋友圈的成员，其中就包括本·科潘。科潘也是计算机科学专业的学生，后来在DeepMind领导产品开发，两人会讨论宗教以及人工智能解决全球问题的方式。但当时距离DeepMind创立还有10多年的时间。哈萨比斯首先要顺利从大学毕业，然后直接回到牛蛙公司任职。也就是在那时，他意外收到了职业生涯中最怪诞的电脑游戏工作申请。一天，他收到了一个瓶子，瓶子里装着一封沾满茶渍的信。信纸的边缘被烧焦了，上面是一篇手写长文，说他们遭遇了海难，被困在一个叫“企业”的小岛上。哈萨比斯立刻理解了信件表达的深意，因为他也厌恶在大公司里当牛做马。


    寄信人是乔·麦克多纳，他在庞大的英国电信集团担任程序员，而且热爱游戏。乔渴望去游戏公司工作，令他高兴的是，莫利纽克斯的牛蛙公司向他发出了面试邀约。当乔到达时，开门的是一名身材矮小的年轻人，他下巴上留着胡茬，黑发像头盔一样盖在脑袋上。那是哈萨比斯，他21岁了，但看上去非常年轻。麦克多纳回忆道：“我心想：‘这小孩是谁？’”原来当时哈萨比斯已经成了牛蛙公司的高管，负责麦克多纳的面试工作。


    麦克多纳很快意识到，他面对的是一名竞争意识强烈的游戏爱好者。当麦克多纳谈到他喜欢折纸时，哈萨比斯提出了挑战，比赛看谁折纸鹤更快。哈萨比斯赢了。两人还玩了一下午棋盘游戏。后来，麦克多纳打电话询问工作的事，却得知那个面试过他的非凡少年已经离开了公司。哈萨比斯之所以离开，是因为他的导师已经无法再满足这个年轻人的技术野心了。莫利纽克斯回忆道：“对他来说，我们发展得太慢了。”


    麦克多纳设法找到一个电话号码，直接打给哈萨比斯，询问出了什么事。哈萨比斯解释说：“我要成立一家新公司。”这就是后来的游戏工作室Elixir，它以真正的尖端人工智能技术为核心，开发出一款用来模拟世界的上帝类游戏。


    这是一张宏伟的蓝图。麦克多纳选择加入。他成了Elixir的首席设计师，负责构想非凡的新世界。哈萨比斯从莫利纽克斯那里学会了浮夸的营销艺术，他在接受媒体采访时，总是大胆且自信地谈论自己的目标。他登上了20世纪90年代的电脑游戏杂志《边缘》的封面，夸口说自己要开发的游戏不仅具有卓越的性能，而且能使游戏不再局限于原本面向青少年的小众市场。他开发的游戏非常烧脑，就连《经济学人》的读者都想去玩。哈萨比斯说：“我想告诉大家，就像书籍和电影，游戏也可以是一种严肃的媒介。”他草拟了一份长期计划。一旦Elixir取得成功，他就将其出售，然后创办人工智能公司。


    他专注开发一款叫作《共和国：革命》的旗舰游戏。在这款政治模拟游戏里，玩家必须推翻一个虚构的东欧极权主义国家政府。哈萨比斯希望一切越真实越好。麦克多纳耗费了数小时在大英图书馆研究苏联历史，以帮助他那急切的年轻老板创造一个现实主义故事。哈萨比斯承担了更多的技术工作，负责监管一种人工智能技术的开发，该技术能够将100万名虚拟人物植入游戏。这个目标充满野心，因为在那之前大多数上帝类游戏最多只有一两千个虚拟人物。无论是城市的卫星图像，还是塔楼阳台上的花瓣，他都希望玩家能近距离地感受。


    这位前国际象棋冠军雇用了他能找到的最聪明的程序员，其中许多人毕业于牛津大学和剑桥大学。他用比赛玩游戏的方式来激励团队，无论是电子游戏《星际争霸》，还是战略性棋盘游戏《强权外交》，他精通所有游戏，玩桌上足球时也会拼尽全力。哈萨比斯会在桌上打出他标志性的“毒蛇球”，用整条手臂旋转塑料球并把球打进球门。到了真正的球场，他在Elixir的足球队踢前锋，带着一队身材走样的软件工程师“冲锋陷阵”。他们和伦敦北部的当地人踢五人制足球赛时，哈萨比斯表现凶猛，像一只愤怒的小猎犬一样猛踢足球，还会去踢身材比他高大两倍的球员的小腿，并且经常得分。


    随着游戏开发的截止日期临近，这位长着娃娃脸的创始人同程序员们一起从每天上午10点工作到第二天早上6点，只在会议室睡上三四个小时，有时还会手里抓着游戏手柄在办公桌前打盹。哈萨比斯再也没有夜生活，他也特别注意不再喝醉，以免伤害大脑。


    他对《共和国：革命》的图像和人工智能技术所抱有的理想近乎荒谬。他正在开发的东西超出当时的计算能力太多。但是，如果不能在游戏中植入成千上万个鲜活人物，那么创建一个虚拟的国家就没有意义。“我不希望人物只是在玩家的屏幕上随机出现的抽象点状物。”哈萨比斯告诉《边缘》杂志，“我希望有丈夫、学生、家庭主妇和酒鬼，每个人都能过着不尽相同但合理的人生。”


    没有什么比游戏更能展示人工智能的神奇之处了。那时候，由于智能软件帮助塑造了逼真的世界，同时出现了一种叫作“涌现式玩法”的新风尚，游戏行业对先进人工智能的研究乐此不疲。不同于《超级马里奥兄弟》等游戏的固定玩法，涌现式玩法是把玩家扔进一个虚拟世界，并提供一些工具，让他们自生自灭。这就是《侠盗猎车手》以及后来成为史上最畅销的电子游戏《我的世界》的核心所在。


    哈萨比斯坚信他正在做同样的事情，但有一个问题：《共和国：革命》太乏味了。对于游戏设计师来说，这是可能陷入的最糟糕的陷阱。在5年的开发时间里，游戏团队用了4年钻研技术，却忽视了完善游戏玩法本身。制作一款优秀的电子游戏需要不断迭代。你通常得从一些粗糙但好玩的东西开始，然后在无数次的游戏中慢慢提升体验。但Elixir的游戏开发者无法投入足够的时间去创造更有趣的游戏，因为他们的老板对技术的要求太高。


    “电子游戏的核心是沉浸感和氛围。”麦克多纳回忆道，“这两样《共和国：革命》都没有。我们被困在了科技黑洞里。”Elixir的程序员都知道，这款游戏不够好。游戏发行后，评论家证实了他们的怀疑，并给出了褒贬不一的评价，说它过于复杂。游戏销量平平。


    “这款游戏在当时太过超前了。”哈萨比斯承认，“我急于在技术和艺术上做出革新。”


    但这并未阻止他继续尝试，Elixir又雄心勃勃地推出了一款名叫《邪恶天才》的上帝类游戏。在游戏中，玩家扮演一名试图统治世界的詹姆斯·邦德式反派人物。这款游戏植入了一些巧妙的、半开玩笑式的幽默元素，但仍旧很难在主流市场上取得成功。虽然哈萨比斯试图在《邪恶天才2》上做出改善，但他在这项技术上的所有投资都面临巨大的成本压力。2005年，这个一心想要拓展游戏极限的聪明孩子关闭了Elixir，他也因此灰心丧气。从国际象棋到桌上足球，再到学业，过去他几乎在任何事情上都无往不利。


    来自英国游戏市场的冲击加剧了这种耻辱感。哈萨比斯之前大张旗鼓地将Elixir吹嘘成用新技术改变旧玩法的新贵，引发了媒体和游戏产业的高度关注。麦克多纳记得，有一次他在一场会议上提到自己曾在Elixir工作。一名英国游戏界的大佬听到这句话笑了一声，麦克多纳尴尬得要死。“失败的痛苦让人难以承受。”麦克多纳回忆道。


    有一次，麦克多纳和哈萨比斯因为公司的倒闭大吵一架，这是麦克多纳第一次也是唯一一次听见这位一向冷静的企业家提高了嗓门。“太可悲了！”哈萨比斯说，“我们是牛津和剑桥的高才生，干什么都顺顺利利。我们从没失败过，但这次却败得如此彻底。”


    哈萨比斯渴望向人们展现人工智能的“魔力”，但他犯了一个严重的错误，那就是围绕自己的喜好开发游戏。要想制造出比人类更聪明的机器，他必须改变策略。他需要更深入地研究人工智能，利用游戏去创造强大的人工智能，而不是利用人工智能去创造好玩的游戏。


    几年后，30多岁的麦克多纳又接到了老东家的电话，收到了一份新的工作邀请。这名不辞劳苦的企业家急切地说：“我打算成立一家名叫DeepMind的新公司。”


    “我可不想重蹈覆辙。”麦克多纳想。于是他拒绝了。


    接着，他惊讶地看到哈萨比斯开始追逐另一个看似不可能但野心勃勃的目标。这一次，哈萨比斯超越所有人的预期，开发出了似乎是世界上最先进的人工智能系统——直到萨姆·奥尔特曼出现。


    **3**  **拯救人类**


    在2006年一个炎热的夏日，奥尔特曼躺在他位于加利福尼亚州芒廷维尤的单身公寓的地板上，只穿着运动短裤。他张开双臂，大口呼吸。这是一个马拉松式的周末，他正在为Loopt谈判一笔交易，但进展并不顺利。房间里的温度高达35摄氏度。按照奥尔特曼2022年在播客节目《成功的艺术》中的说法，他觉得自己压力大到快要崩溃了。


    多年来，他一直告诉自己，这就是企业家的生活常态。“本该如此，”他想，“但没什么用。”重压之下，事情变得越来越糟。


    Loopt的失败教会奥尔特曼不能强迫别人做不想做的事，也给他个人上了一课，那就是面对困境时，要学会从情感上脱离。穿着运动短裤躺在地板上的那一刻成为他人生的转折点。奥尔特曼打算换一种生活方式，关键是变得更加超然。


    在卖掉Loopt、与长期的恋人尼克·西沃分手，并在收购Loopt的企业工作了一段时间后，奥尔特曼花了一年时间随心所欲地生活，彻底让自己从过往中抽身。在喧嚣的硅谷文化里，休息一年通常算不上什么好事，奥尔特曼很快就注意到了后果。只要他在聚会上开始和别人谈论休息一年的打算，他们就会目光逡巡另找其他可以聊天的人。


    作为Y Combinator项目的兼职合伙人，他与加州旧金山湾区还保持着联系。此时，风险投资者改变了他们对这个黑客训练营的看法，将其视为优质互联网公司的“制造厂”。其中，Reddit、Scribd（在线文档上传以及分享的社区）等几家公司已经成为知名企业。在初创公司的创始人看来，Y
    Combinator在硅谷就是通往成功的门户。每年向该项目提出申请的科技公司创始人数以千计，但获得通过的只有大约100人。


    余下的时间，奥尔特曼沉浸在广泛的兴趣爱好里。他读了几十本书，题材从核工程到合成生物学，从投资到人工智能，无所不包。他去其他国家旅行，住在青年旅社，坐飞机去参加会议，还用出售Loopt赚来的大约500万美元投资了几家初创公司。


    后来，他公开承认他投资的公司几乎全部败北，但他认为这是在锻炼自己识别最有可能成功的项目的能力。他坚信，经常犯错没关系，只要偶尔能“慧眼识珠”，比如投资一家大获成功的初创公司，然后高调离场。


    如果把生活比作粉刷，那么奥尔特曼的方法就是用最大的滚筒刷尽可能覆盖更大的区域。但在日积月累中，他对人工智能越来越着迷。据《纽约客》杂志报道，在出售Loopt的那段时间，他和一些科技行业的朋友去远足，同时讨论了人工智能研究的未来。奥尔特曼认为，随着计算机硬件和机器学习系统的不断进步，有生之年他也许能通过计算机复制自己的大脑。


    这让他重新审视站在地球食物链顶端的人类。假如人类智能可以被计算机模拟，那我们还是独一无二的吗？奥尔特曼给出了否定的答案。尽管这样的认识刚开始令人沮丧，但他将之化为动力。如果人类不是那么特殊，那就意味着他们可以被计算机复制甚至完善。也许他就能做到这一点。


    在很多方面，奥尔特曼都在建立一种硅谷思维，那就是将生命本身看作一个工程难题，可以按照优化软件的步骤来解决各种难题。这与工程师的培训方式有关，他们习惯于系统化、有逻辑地处理问题。这种习惯在他们的教育和软件开发实践中根深蒂固。软件开发能否取得成功与效率息息相关。这些实用的方法自然而然也延伸到社会和生活的其他方面。


    难怪奥尔特曼在谈到人类时喜欢使用计算机语言，比如他曾在一次杂志访谈中说：“人类每秒仅能学习两个比特的信息量。”比特是信息的基本单位，在二进制中通常表示为0或1，奥尔特曼用这个比喻来展示人类在处理信息方面的能力是多么有限。比较人类大脑和计算机的工作机制，我们会发现计算机处理比特的速度要快得多，每秒达到千兆比特或太比特。


    如果奥尔特曼想要亲自制造一台超越人类智能的机器，毫无疑问他应该留在硅谷，留在这个人人都在努力创造未来的地方。


    “这里的人都坚定不移地相信未来。”他有一次说，“这里的人会认真对待你的疯狂想法，而不会嘲笑你。”硅谷还预示着一张活跃的关系网，人人互惠互利。你帮别人筹集创业资金，他们帮你引荐天才工程师。


    在旅行接近尾声的那段时间，奥尔特曼创办了一家叫作Hydrazine Capital的早期投资公司，专门投资从生命科学到教育软件等不同类别的初创公司。奥尔特曼利用自己与硅谷一些有影响力的投资人的关系，总共募集了2
    100万美元，出资人包括保罗·格雷厄姆和脸书的早期投资人彼得·蒂尔。蒂尔是一位神秘的亿万富翁，他有许多近乎科幻的奇思妙想，他同时资助了奥尔特曼和伦敦的德米斯·哈萨比斯，从而成为开发强大人工智能的关键人物。他是所谓“贝宝帮”（PayPal
    Mafia）的一员。“贝宝帮”由这家在线支付巨头的联合创始人和高管精英组成，他们多年来互相投资彼此的公司，其中也包括埃隆·马斯克和领英创始人里德·霍夫曼。


    奥尔特曼将Hydrazine Capital 75%的资金投向Y Combinator孵化的公司，该策略获得了不错的回报。不到4年，Hydrazine Capital的资金价值就增长了10倍，这得益于奥尔特曼对初创公司的投资，这些初创公司来自他不断扩展的人脉关系，其中大多数都是硅谷精英。他在Y
    Combinator的第一堂课上就投资了初创公司Reddit和Asana，后者是由脸书联合创始人、亿万富翁达斯汀·莫斯科维茨创办的企业软件公司。在接下来的几年里，这些关系为奥尔特曼开发超强人工智能提供了帮助。


    奥尔特曼清楚，从长远来看，直接的经济回报不如人际关系有价值。这就是他作为一名风险投资家不希望与企业家对抗的原因。就职责而言，风险投资家必须用更少的钱换更多的股权。奥尔特曼还发现，硅谷不断追求极致财富的做法有点令人反感，而他对开发极致项目所带来的荣耀和成就更感兴趣。在投资之余，他精简了个人名下的资产，只留下旧金山的一套四居室住宅、加利福尼亚州大苏尔的一处地产和1
    000万美元现金。他可以靠利息生活。


    2014年的一天，格雷厄姆在自家的厨房里问奥尔特曼：“你想接管Y Combinator吗？”奥尔特曼咧嘴一笑。格雷厄姆和妻子杰西卡·利文斯顿要照顾两个年幼的孩子，疲于再管理一个庞大的项目。此外，格雷厄姆在接受采访时总会说错话，经常让人怀疑硅谷的精英圈层都是些白人“兄弟会程序员”
    ^([³](#fn3))


    当格雷厄姆的“个人秀”开始“拖后腿”时，Y Combinator也变得越来越棘手。在过去7年里，它投资了632家初创公司，每年收到的申请数以万计，但批准通过的申请只有200份。科技创业公司比以往任何时候都多，Y
    Combinator需要扩张才能满足需求。


    “我不擅长管理庞然大物，”格雷厄姆在当年下半年的一次会议上解释新老交替问题时说，“萨姆很擅长。”


    奥尔特曼当时只有30岁，而格雷厄姆即将跨入知命之年。


    奥尔特曼的表现如同翻版的格雷厄姆。他已经成为一名创业大师，对各种话题，包括那些他不熟悉的领域，都有独到的见解和建议。例如，尽管年纪轻轻且只运营过一家可以说是失败的公司，但他还是写了一篇关于初创公司应该遵循的95条建议的博文。


    虽然奥尔特曼缺乏经验，但他给格雷厄姆和利文斯顿留下了深刻印象，后者从未考虑为Y Combinator筛选其他新的领导人。他们一致认为就应该是奥尔特曼。格雷厄姆在一篇文章中写道，萨马（奥尔特曼的网名）是有史以来最有趣的五位创始人之一，这几乎给奥尔特曼的简历蒙上了一层救世主似的光环。“在设计问题上，我会问‘史蒂夫·乔布斯怎么做’，但在战略或志向问题上，我会问‘萨马怎么做’。”


    奥尔特曼执掌Y Combinator后，首要任务是做大做强。他致力于将该项目变成一个机构，创建了一个由杰西卡·利文斯顿、他本人以及七名Y Combinator校友组成的监督委员会。他将全职合伙人增加了一倍，还增加了一些兼职合伙人，风险投资家、亿万富翁蒂尔也在其中。


    奥尔特曼从小就对前沿科学感兴趣，他认为前沿科学的进步对于帮助人类和创造财富而言至关重要。因此，他集中精力引入更多解决复杂科学和工程问题的“硬科技”初创公司。“这正是我喜欢做的事。”他回忆道，“我真的不介意为了追求我认为值得的东西而赔钱。我认为应对人类的最大挑战很重要。虽然需要承担的风险更大，但潜在的回报也更高。”


    在那之前，Y Combinator主要投资消费软件开发商和企业软件公司，这些公司的收入途径更可预测。但奥尔特曼认为，这些公司无法改变世界。他成功说服了Cruise和Helion
    Energy的创始人加入Y Combinator项目，前者是一家自动驾驶汽车公司，后者是一家位于华盛顿雷德蒙德市的核聚变企业。


    核聚变就是两个较轻的原子核结合形成一个较重的原子核并释放能量的过程。核聚变反应为太阳和恒星提供能量，也为电影《回到未来》里的时光机和托尼·斯塔克的钢铁侠战衣里的电弧反应堆提供动力。对于寻求清洁能源解决方案的科学家而言，核聚变一直是他们的终极梦想，但距离实现还需要几十年的时间。该领域的大多数研究都只停留在理论和概念验证阶段。然而，由四名学者创立的Helion
    Energy宣称，它能用几千万美元而不是几百亿美元建造一个核聚变反应堆，为人类摆脱化石燃料铺平道路。'
