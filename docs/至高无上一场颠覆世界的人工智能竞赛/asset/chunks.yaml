- raw: '在此过程中，Anthropic开发出了功能更加强大的产品。它以每月20美元的价格向消费者出售这款名叫Claude Pro的“友好型”聊天机器人，另外也开发了适用于企业的版本。它还有望从谷歌和亚马逊那里筹集到几十亿美元。Anthropic非但没有退出构建更强人工智能的竞赛，反而陷入了发布更大、风险更高模型的商业压力。


    哈萨比斯与大型科技公司谷歌的牵绊越来越深，而奥尔特曼则将OpenAI带向了一个更加商业化的方向。2023年11月中旬，奥尔特曼证实OpenAI正在开发GPT-5和筹集更多资金。高昂的训练成本意味着这家公司仍处于亏损状态，但它也在合理谋划扭亏为盈。


    然而，就在2023年11月，奥尔特曼收到了一条来自伊尔亚·苏茨克维的短信，他的世界也由此崩塌。据《华尔街日报》报道，奥尔特曼当时正在拉斯维加斯观看一级方程式大奖赛（Formula
    One Grand Prix），他的手机收到了一条短信，询问他是否可以在第二天中午谈一谈。在通过谷歌会议软件召开的视频会议上，除了董事长布罗克曼，全体董事会成员的目光都集中在奥尔特曼身上。苏茨克维没有做任何详细解释，直接告诉奥尔特曼他被解雇了，而且这条消息很快就会对外公布。会议结束没几分钟，奥尔特曼就失去了访问自己电脑的权限。


    他为之愕然。他是OpenAI的门面。他曾代表公司与数十位世界领袖会面，见证了公司市值飞跃增长至近900亿美元，还推出了历史上最受欢迎的科技产品。他竟然被解雇了？


    当奥尔特曼还处在震惊当中时，布罗克曼也收到了一条短信，要求进行简短的视频聊天。布罗克曼看到了同一群面孔，苏茨克维、Quora首席执行官亚当·迪安杰罗、机器人企业家塔莎·麦考利和学者海伦·托纳。在董事会的六名成员中，只有奥尔特曼、布罗克曼和苏茨克维是OpenAI的员工，另外三人是已经任职两三年的独立董事。


    布罗克曼将被免去董事长一职，但董事会希望他留在公司。他们迅速向微软做了通报，并在几分钟内发表了一篇博文，宣布奥尔特曼被解雇。布罗克曼立即辞职，OpenAI的另外三位顶尖研究员也做出了相同的选择。


    这条消息像原子弹一样引爆科技行业，让所有人目瞪口呆。就首席执行官遭遇背后捅刀而言，这一次的残酷程度不亚于史蒂夫·乔布斯被踢出苹果公司。硅谷流言四起，人们拼命想弄清楚是什么原因导致苏茨克维突然攻击奥尔特曼。OpenAI是否即将实现通用人工智能？推特上到处在问：“伊尔亚看到了什么？”董事会对此的解释含糊其词，只说奥尔特曼“在沟通中不够坦诚”。


    某些人为苏茨克维等董事会成员起了个“减速主义者”的绰号。人工智能领域出现了新的分裂，一方希望加速发展，另一方则希望减慢发展速度。在撰写本书期间，人工智能创业者在社交媒体X（以前称为推特）上给自己贴上了代表有效加速主义者的标签——“（e/acc）”。这是一场旨在通过尽快开发和部署人工智能解决人类问题的运动，也是一场对有效利他主义的反击。


    纳德拉对此并不关心。他勃然大怒。他承诺给OpenAI投资130亿美元，在很大程度上是因为奥尔特曼富有前瞻性和领导力，能够吸引人才，这种合作一直在助力微软利润飙升。约有1.8万家公司和开发人员正在使用微软Azure平台的人工智能服务，现在他们中的很多人都在问是否应该换用其他产品。周五晚间收盘时，微软的股价开始下滑，到下周一开盘时，几乎可以肯定股价还会进一步下跌。纳德拉需要采取行动。


    那个周五的晚上，奥尔特曼和布罗克曼在旧金山商量着创办一家新的人工智能公司。投资者、同行和记者发来的短信让奥尔特曼的手机响个不停，他们试图弄清楚到底发生了什么，但他专心致志想要找到摆脱当前局面的办法。他邀请了数十名OpenAI的员工和同行到位于旧金山俄罗斯山的家中讨论下一个创业项目。


    纳德拉不希望这种情况发生。他知道，只要奥尔特曼创办新公司，就会有大批投资者来敲他的门，而且无法保证微软能再次与奥尔特曼缔结牢固的关系。他周末就开始打电话，领导与OpenAI董事会的谈判，以便让奥尔特曼回归。


    奥尔特曼的高管团队向董事会施压，要求重新聘请奥尔特曼，警告称如果不这样做，OpenAI将会崩溃。海伦·托纳回复说：“董事会的做法实际上与公司使命相符。”OpenAI的领导层对此感到震惊。但这确实有点道理。OpenAI的使命是创造“造福人类”的通用人工智能，而托纳及其他董事会成员认为奥尔特曼正在破坏这个目标。在过去的几个月里，他们私下表达了对奥尔特曼的不满，因为他似乎想要建立一个OpenAI以外的庞大人工智能帝国。奥尔特曼一直在与苹果公司的前设计师乔纳森·伊夫讨论制造“人工智能界的苹果手机”，并试图从中东主权财富基金获得数百亿美元投资，以打造人工智能芯片制造业务。


    还有就是世界币（Worldcoin）公司，一个同样由奥尔特曼创立的加密网络，企图通过眼部虹膜扫描为全人类建立数字身份。奥尔特曼宣称，他的目标是在机器人占领互联网的时候，更好地识别真实的人类并分配通用人工智能带来的“数万亿”美元财富，但在批评者看来，这更像一场大规模的数据收集活动。


    在OpenAI内部，奥尔特曼和苏茨克维之间就OpenAI将技术商业化的速度产生了分歧。苏茨克维更加积极地参与公司人工智能安全监督工作，他与之前的达里奥·阿莫迪有着同样的担忧。他特别厌恶OpenAI在几周前推出的GPT商店，该商店让所有软件开发人员都能创建自定义ChatGPT并从中获利。


    在三名独立董事当中，麦考利和托纳都对苏茨克维的担忧表示赞同，并且与有效利他主义组织联系紧密。例如，达斯汀·莫斯科维茨的开放慈善资助了麦考利联合创立的一个人工智能研究小组，还聘请了托纳担任高级研究分析师。就在托纳投票解雇奥尔特曼的几周前，她还发表研究论文指责OpenAI匆忙推出ChatGPT是在“疯狂投机取巧”。她还赞扬新出现的竞争对手Anthropic决定推迟发布聊天机器人Claude的做法，认为这是在避免“为人工智能炒作火上浇油”。


    奥尔特曼看到论文后火冒三丈。他会见了托纳，说她的论文对OpenAI来说很危险，尤其是在美国联邦贸易委员会对公司进行调查的当口。早在当年7月，美国联邦贸易委员会就对OpenAI开发ChatGPT的方式是否违反消费者保护法展开了调查，并要求该公司详细说明如何应对其人工智能模型带来的风险。此次调查是迄今为止奥尔特曼面临的最大监管威胁。


    他希望把托纳踢出董事会，还同苏茨克维等OpenAI领导层讨论了操作方式。现在正好相反。苏茨克维站到了董事会一边，要求罢免奥尔特曼。在被迫向OpenAI领导层和投资者做出解释时，董事会没有给出解雇奥尔特曼的理由，只是表示他们越来越不信任这位巧舌如簧的企业家，他在员工中培养了一批狂热的追随者，总是向不同的人灌输不同的故事，而且往往为所欲为。董事会认为，他们需要证实奥尔特曼所说的大部分事情，这些事情让他显得不可信。此外，他们也担心奥尔特曼的各种外部商业经营活动最终可能会滥用OpenAI的技术。


    随着周末临近，OpenAI的员工也在酝酿一场大规模的“起义”。奥尔特曼在推特上用一贯的小写字体发文称：“我非常喜欢OpenAI的员工。”数十名员工转发了这条帖子，并加了爱心表情符号。微软将这场“起义”视为让奥尔特曼回归的筹码。微软还威胁OpenAI董事会，要取消其重要的云计算服务授权。在微软承诺给OpenAI的130亿美元中，有很大一部分是以云计算服务授权的形式兑现的，云计算是训练人工智能模型不可或缺的资源。当时微软只提供了一部分云计算使用权。


    奥尔特曼对自己的回归开出了条件：OpenAI需要改变治理结构，现任董事会集体下课，同时为他正名。但董事会拒绝改变。他们聘请视频游戏流媒体服务平台Twitch的前负责人埃米特·希尔出任OpenAI首席执行官。人工智能领域的爱好者和企业家随即在社交媒体上指责希尔为“减速主义者”。周日，希尔召开紧急全体会议时，许多OpenAI的员工都拒绝参加。一些员工甚至在公司的信息论坛Slack上向他发出了竖中指的表情。


    苏茨克维也开始产生怀疑。他在周末与OpenAI领导层进行了数次激烈的谈话，还和布罗克曼的妻子面对面谈心。《华尔街日报》报道，4年前这对新人在OpenAI办公室举行了结婚仪式，而苏茨克维正是这场仪式的司仪。现在，安娜·布罗克曼在OpenAI办公室哭着恳求苏茨克维改变主意，不要解雇奥尔特曼。


    与此同时，纳德拉也在奋力推进后备计划。如果奥尔特曼无法夺回OpenAI的控制权，微软就需要在周一上午之前将他纳入麾下。纳德拉成功了。周一清晨，纳德拉在推特上表示，奥尔特曼、布罗克曼以及有意愿的OpenAI员工，都可以加入微软新成立的先进人工智能研究团队。微软股价应声上涨。但这只是一个托底方案。纳德拉仍旧希望奥尔特曼重新领导OpenAI。从各个方面来说，把奥尔特曼团队安置在微软内部都将面临高昂的成本。他必须给数百名新员工发工资，其中许多人的年薪高达数百万美元，而且微软也会承担更大的风险。到目前为止，OpenAI因推出ChatGPT和DALL-E2等工具而声名鹊起，但也受到了与合法性有关的抨击。作为一家初创公司，OpenAI可以罔顾这些指责，但微软做不到，而届时受雇于大公司的奥尔特曼也做不到。只有回归互不干涉的合作关系，微软才能获得所有荣耀，而无须承担任何责任。


    现在，各方都在敦促痴迷安全问题的OpenAI董事会下台。到周一晚些时候，OpenAI的770名员工几乎都签署了一封信，威胁要和奥尔特曼一起加入微软，除非董事会成员辞职。信中说：“微软向我们保证，所有人都有职位。”


    这只是虚张声势而已。几乎没有OpenAI的员工愿意为微软工作，微软是一家墨守成规的公司，员工穿着卡其裤，一干就是几十年。OpenAI员工发出威胁也不完全是出于对奥尔特曼的忠诚。更大的问题在于，解雇奥尔特曼，等同于扼杀了许多OpenAI员工——尤其是长期服务的员工——成为百万富翁的机会。再过几周，公司就要将员工股份出售给一家大型投资机构，该投资机构对OpenAI的估值约为860亿美元。现在OpenAI的股价突然跌到一文不值，如果奥尔特曼不回归，这笔巨额员工分红将付诸东流。


    苏茨克维这时已经改弦更张，他也是签名者之一。“我从没想过要伤害OpenAI。”当天他在推特上发帖说。在这个令人头晕目眩的周末，科技媒体又被震惊到了。苏茨克维表示“我将尽我所能，让公司重新团结起来”，并补充说他对自己的行为“深感后悔”。奥尔特曼转发了这条帖子，还加了三个爱心的表情符号。


    奥尔特曼被踢出OpenAI的戏剧性转折不足为奇。“董事会可以解雇我。”奥尔特曼几个月前在一次小组会议上坚称，“我认为这很重要。”OpenAI仍旧由一个非营利性董事会管理，旨在为全人类造福。这就是为什么该公司的运营协议称投资者应该“本着捐赠的精神”看待他们的投资，还要“认识到在后通用人工智能时代，很难判断金钱会扮演何种角色”。


    奥尔特曼曾打赌自己可以做到两全其美，即经营一家企业，同时也追求拯救世界的慈善使命。正如他10年前所写的那样，最成功的创业者“创造的是一种更接近宗教的东西”。但他没有预料到，人们竟对此深信不疑。


    有效利他主义运动影响深远，能让萨姆·班克曼-弗里德、达斯汀·莫斯科维茨等人捐出数十亿美元。它使数百名大学生改变了职业选择，也使四名董事解雇了全球最受欢迎的首席执行官。奥尔特曼认为，董事会应该珍视他所创造的商业价值。可事实并非如此。董事会的目标是维护OpenAI的章程，并站在人类的立场。


    然而，由于几乎全体员工都威胁要离职，OpenAI的董事会也将无公司可治理。微软准备接手奥尔特曼的所有研究——它拥有OpenAI关键系统的源代码及其更广泛的知识产权。


    在奥尔特曼被开除的五天后，OpenAI宣布将组建新的董事会，由美国前财政部长拉里·萨默斯和商业软件公司Salesforce前负责人布雷特·泰勒担任董事长。后者在埃隆·马斯克收购推特时，是推特董事中表现最冷静的一位。拉里·萨默斯和布雷特·泰勒都担任过好几家公司的董事。他们可不会写指责公司投机取巧的学术论文。他们知道如何满足微软等投资方的需求。两名似乎是对奥尔特曼最为不满的女性——海伦·托纳和塔莎·麦考利被迫辞职。微软在董事会中获得了一个观察员席位，这意味着纳德拉再也不会被蒙在鼓里。他成功逆转了局面。


    但2023年11月的戏剧性事件，也揭穿了奥尔特曼所谓对结果负责的假象。他曾公开赞同董事会可以解雇他，但实际上董事会不能这么做。托纳和麦考利这两位反对奥尔特曼的女性董事最后被迫离开。在随后的几周里，她们在社交媒体上也饱受抨击，而两名男性叛变者——苏茨克维和迪安杰罗的个人声誉和职务基本上未受影响。迪安杰罗仍然担任董事，而苏茨克维虽然辞去了董事职位，但仍在OpenAI担任领导职务。


    多年来，谷歌一直努力预防DeepMind发生同样的事。董事会一旦拥有权力，就可能利用这些权力毁掉公司的生意。在创建通用人工智能的过程中，奥尔特曼和哈萨比斯都对治理结构进行了改善，试图将人类的最大利益至少放到与赚钱同等的地位上。但他们的努力始终没有成效。在互相竞争和争权夺利的过程中，资本赢得了一切。


    有观点认为，围绕奥尔特曼被解雇发生的闹剧，进一步说明了开源人工智能的必要性，开源人工智能指的是所有人都能修正或改善其源代码。虽然开源确实能带来一些好处，比如更高的透明度、更民主的控制方式和伦理规范，但它是否就是创建人工智能最安全、最公平的方式，目前尚无定论。开源并非防止人工智能被滥用的万全之策，而且可能也达不到封闭环境下的服务水平。“开源”这个概念本身也有不同的解释。最近，Meta公司将其人工智能模型标榜为开源，但它们仍保留了一些限制，并不完全符合开源的定义。“事实上，开源有助于集权。”谷歌开放研究小组创立者梅雷迪思·惠特克说，“我们已经在安卓系统上看到了这一点。”实际上谷歌设定了安卓系统的标准，影响了它的发展方向，这种集权控制使其他公司很难对这一全球用户达到36亿的移动操作系统做出什么改变。


    当奥尔特曼着手为OpenAI和微软制定更有利于企业发展的新方向时，哈萨比斯仍在寻求借助人工智能解开现实的奥秘。他说现在DeepMind内部只有他一个人还在从事这项研究，他从深夜到凌晨一直在家里的电脑上进行量子力学研究。“这就是我在极其有限的业余时间里所做的事。”他说，并称这是他的“爱好”。哈萨比斯补充道，一旦DeepMind接近实现通用人工智能时，就会进行必要的物理实验以解开宇宙之谜。但那些曾推动哈萨比斯开发通用人工智能的雄心壮志，如今已沦为深夜的消遣。白天，他忙于管理谷歌的人工智能业务，他手下的人工智能研究员也从大约400名增加到了5
    000多名。


    “你知道，事情会随着使命和技术的发展而变化。”哈萨比斯说，“我们必须不断修正，以便找到正确的治理结构，我认为我们现在的治理结构就很好。”


    哈萨比斯并没有因为尝试建立监管委员会和董事会未果而烦恼焦虑。他表示，“我们已经转向，成立了一些内部委员会”，也就是由100多名谷歌高管组成的一系列内部“审查机构”。“我认为10年前我们第一次考虑这个问题时，对它的看法可能过于理想化了。”


    虽然哈萨比斯和奥尔特曼原本并无私心，并且他们曾经尽力避开商业影响，但实际上他们现在正在引领全球最大的两家公司。奥尔特曼开始负责微软一些最重要的工作，如果愿意的话，他未来有机会成为微软的首席执行官。哈萨比斯也是如此。据谷歌的一些前员工和在职员工猜测，他有望取代皮查伊成为Alphabet的首席执行官。


    “德米斯在伦敦负责谷歌最重要的研究。我认为之前没人会想到是这样的结果。”谷歌的一名前高管表示，“这可能一直是他的计划。”


    “未来几年的赢家不会是研究实验室。”OpenAI的一位前科学家表示，“赢家会是开发产品的公司，因为人工智能已经跳出研究的范畴了。”


    在尼克·波斯特洛姆的故事里，超级人工智能因用全世界的资源制作回形针而毁灭了人类文明。这听上去很科幻，但何尝不是硅谷自身的寓言。在过去的20年里，少数几家公司发展成为庞然大物，主要在于它们追求病态的发展目标，为了提高市场份额摧毁较小的竞争对手。科技公司放弃了“适应度函数”，而是用“北极星”这样的词描述这些目标。多年来，脸书所谓的“北极星”其实就是尽可能多地增加日活跃用户，这是马克·扎克伯格及其高管团队做出关键决策的依据。但它对持续增长的痴迷导致了一系列社会问题，例如，在Instagram上青少年的身材焦虑问题日趋严峻，同时脸书用户的政治两极分化也在不断加剧。


    技术专家对超级智能失控行为的想象，是他们自己在现实世界里一举一动的缩影，在这个世界里，企业可以成为不可阻挡的垄断全球的势力。少数人正在开发近代历史上最具变革性的技术，他们对该技术对现实世界的不利影响充耳不闻，努力克制自己想要赚大钱的欲望。真正的危险不是来自人工智能本身，而是来自其操控者，也就是人类善变的心思和突发的奇想。


    在国际象棋中有一句名言：策略赢一局，战略赢全场。奥尔特曼和哈萨比斯在寻求构建通用人工智能的过程中都采用了新奇的策略。随着人工智能开发变成一场竞赛，他们与最有可能赢得竞赛的微软和谷歌紧密联系到一起。两人的梦想巩固了两大企业巨头的地位，也巩固了他们自身的地位。在来自伦敦北部的国际象棋怪才和圣路易斯的创业大师的分别带领下，谷歌和微软站在了争夺人工智能霸权的最前沿。无论是否愿意，我们都已卷入这场浪潮。


    **16**  **垄断的阴影**


    这场通用人工智能开发竞赛始于一个问题：如果创造出比人类聪明的人工智能系统，结果会如何？站在前沿的两位创新者努力寻找答案，尽管这种探求最后变成了激烈的竞争。德米斯·哈萨比斯相信通用人工智能有助于我们更好地理解宇宙，推动科学新发现；萨姆·奥尔特曼则认为它可以创造大量财富，提高人类生活水平。两人并不确定会用什么方式实现梦想。他们不知道通用人工智能将如何做出这些发现或创造这些财富，甚至不知道它是否会摧毁世界。他们只知道他们必须继续朝着目标前进，他们必须争当第一。只有这样，他们才能让人工智能在造福全人类的同时，也让世界最强大的公司受益。


    随着公众对人工智能或天堂或地狱的未来日益痴迷，少数科技垄断企业在我们的眼皮底下发展壮大，它们承诺提高生产力，却对正在全方面融入人类生活的人工智能技术的运作机制闭口不提。长期以来，社交媒体公司一直拒绝透露它们的算法是如何运行的。现在，GPT-4、DALL-E、Gemini等人工智能模型的创造者也是如此。这些模型是如何被训练的，又是如何被使用的？有哪些工作者帮助开发了数据集？为了弄清楚这些模型对社会的影响，并让它们的创造者承担责任，我们需要知道答案。


    但随着2024年的过去，这些问题仍没有答案。斯坦福大学科学家的一项研究得出结论：“人工智能行业从根本上缺乏透明度。”科学家们调查了OpenAI、Anthropic、谷歌、亚马逊、Meta等科技公司的披露情况，包括用于训练大语言模型的数据信息、流程，模型对环境和人类的影响，以及它们支付给协助创建数据集的承包商的费用。全世界有数百万数据工作者在执行这项任务，多半位于印度、菲律宾和墨西哥等国，他们的工作条件通常极其恶劣。'
