- raw: '三位创始人身在英国，还没有被硅谷追求无尽增长的风气影响，他们诚心诚意地接受了谷歌的建议。苏莱曼希望展现DeepMind作为企业独立自主的一面，所以他努力在现实世界中验证人工智能系统的价值。他重新将重心放到自己创立的应用部门，该部门的研究员使用强化学习技术解决医疗保健、能源、机器人等问题，这些都可能转化为商业应用。还有一个由大约20名科研人员组成、自称为“谷歌的DeepMind”的团队，致力于直接帮助谷歌增加业务，比如提高YouTube的推荐效率和改进谷歌的广告定位算法。据知情人士透露，谷歌同意将这些产品功能新增收益的50%分给DeepMind。还有一名前员工说，约有2/3的项目对谷歌来说有价值。


    这让DeepMind的其他数百名科研人员可以继续攻克开发通用人工智能的方法。每隔几周，三位创始人就会在伦敦的一家酒吧碰面，每次讨论都会回到相似的争议点上。苏莱曼想要解决现实世界的问题，但也担忧他们会不小心创造出一个出错的超级智能系统。要是人工智能失控，反过来操纵人类怎么办？在办公室里，他警告其他员工和管理人员，通用人工智能对经济的影响可能导致数百万人突然失业，以及收入急剧下降。要是引发暴动该怎么办？据一名前工作人员透露，苏莱曼说：“如果我们不考虑平等，人们就会举着干草叉，走向国王十字车站。”


    哈萨比斯努力开动脑筋寻找解决方案，但有些方案听上去稍显离谱。例如，他建议当他们的人工智能越来越强大且越来越危险时，DeepMind可以聘请加利福尼亚大学洛杉矶分校的教授陶哲轩，他被普遍认为是当今最伟大的数学家之一。据《新科学家》杂志报道，陶哲轩9岁上大学，曾获“神童”之称，对科研人员来说，现在的陶哲轩好比是“救火队队长”。


    陶哲轩曾在采访中表示，人工智能在很大程度上就是聪明的数学运算，这个世界可能永远也不会诞生真正的人工智能。他对这项技术的看法与哈萨比斯一样机械且绝对。如果人工智能失控，还有数学可以遏制它。相信这一点的人不只有哈萨比斯。在尤德考斯基的LessWrong论坛上，大家开启了一场长时间的“头脑风暴”，讨论如何说服像陶哲轩这样的顶尖数学家从事人工智能对齐研究，让人工智能更符合人类的价值观，以防止其失控。他们认为需要支付这些数学大师500万～1
    000万美元的报酬。


    按照哈萨比斯的构想，在即将打开通用人工智能的大门之前，他会停下继续提升人工智能模型性能的脚步，邀请一些世界顶尖人才前来仔仔细细地分析这些模型，以便找到控制它们的最佳运算方法。哈萨比斯到现在仍认为：“也许我们应该召集数学家和科学家，组成‘复仇者联盟’。”


    苏莱曼并不赞同哈萨比斯的做法，认为他太过关注数字和理论。在他看来，为了确保安全，人工智能需要由人来管理，而不是聪明的数学运算。就在他与哈萨比斯争论控制人工智能的最佳策略期间，从谷歌领导层传来了关于“Alphabet公司”计划的最新消息。谷歌高管们告诉他们，这个计划根本行不通。从谷歌剥离出来并不简单，因为随着人工智能对谷歌的业务越来越有价值，谷歌也越来越需要DeepMind。


    谷歌再一次食言而肥，三位创始人都觉得这一幕似曾相识。但高管们告诉他们不要担心，因为仍然可以找到一个折中的办法。谷歌现在提出了第三种方案：DeepMind可以部分剥离，设立董事会领导超级人工智能的创造，但Alphabet将保留这家人工智能公司的部分股权。为了表明诚意，Alphabet还做出了书面承诺。一位知情人士透露，Alphabet管理层签署了一份投资意向书，承诺谷歌将在10年内提供150亿美元给DeepMind，以资助其独立运营。哈萨比斯对DeepMind的很多人都说过，这份投资意向书由谷歌高管桑达尔·皮查伊签署，他在几年后将成为Alphabet的首席执行官。换句话说，谷歌对这次的承诺是认真的。


    投资意向书是概述潜在商业协议条款和条件的文件。它没有法律约束力，通常可以作为进一步谈判的基础。尽管如此，书面协议仍然比口头协议更具分量，DeepMind的创始人相信，这次谷歌是真的打算信守承诺。他们决定改造DeepMind，像OpenAI一样建立正式的组织架构，使其更像慈善组织而不是企业。


    哈萨比斯和苏莱曼聘请投资银行家，开始规划分拆后的公司的财务机制，还聘请了两家伦敦的律师事务所为改制后的DeepMind制定合规政策。他们听取了英国一位顶级诉讼律师的建议，这位律师曾为壳牌、沃达丰、矿业巨头必和必拓等大公司主持过交易。


    他们还筹划了一个新的领导体制，即由哈萨比斯、莱格、苏莱曼，以及Alphabet首席执行官拉里·佩奇、谷歌联合创始人谢尔盖·布林、谷歌当时的产品总监桑达尔·皮查伊和三名独立商业董事联合组成董事会。董事会采用少数服从多数的原则。关键的地方在于，他们还将组建一个六人董事会，负责监管DeepMind履行道德与社会责任的情况。董事人选及其决定将对大众公开。由于这六位董事将掌控全世界最强大也最具潜在危险的技术，他们必须具备高素质且值得信赖。因此，DeepMind将橄榄枝递给政府高级官员，邀请美国前总统巴拉克·奥巴马以及一位前副总统、一位中央情报局前局长担任董事。据知情人士透露，其中几人答应了邀请。


    在咨询了法律专家后，DeepMind决定舍弃萨姆·奥尔特曼率先提出的非营利组织路线。相反，三位创始人设计了一种全新的法律结构，他们称之为“全球利益公司”。也就是说，DeepMind将成为类似联合国某一部门的组织，是一个透明并且负责任的人工智能“管家”，始终将人类的利益放在首位。它会给Alphabet一个独家授权，确保这家科技巨头可以获取DeepMind在人工智能上取得的成果，并且这些成果能够支持谷歌搜索业务的突破。但DeepMind会将大部分财力、人力投入能够达成其社会使命的研究上，致力于药物发现、更好的医疗保健和应对气候变化。最终，他们将这个项目命名为“全球利益公司”（GIC）。


    DeepMind寻求从谷歌剥离，但与此同时仍在帮助谷歌扩大业务。谷歌的拉里·佩奇承诺在帮助DeepMind获得独立期间，还将扩张的目光投向了中国。随着谷歌的业务在美国等西方市场逐步成熟，中国展现出独特的机遇。当时中国是世界上人口最多的国家，拥有的互联网用户超过6.5亿，几乎是美国总人口的两倍。在中国，只有大约一半的人上网，这意味着还有巨大的市场等待开发。中国的中产群体不断壮大，消费支出持续增长，当时中国的国内生产总值约为11万亿美元，是世界第二大经济体。


    但中国市场并没有那么好进。确切地说，谷歌在2010年退出了中国。


    随后，中国的互联网行业蓬勃发展了起来。在硅谷工作和创业的中国工程师纷纷回到祖国打造自己的科技巨头，美团、百度、阿里巴巴等公司强势崛起。一大批曾在微软亚洲研究院工作的工程师接过了阿里巴巴、腾讯等中国互联网巨头领导者的责任。当时离开中国市场已有5年的谷歌，眼看着中国市场变得越来越有利可图，但“回归”无门。此时谷歌急于进入中国不断增长的消费者市场，同时借鉴一些在中国方兴未艾的创新工程理念。“我们需要弄清发生了什么，”谷歌搜索部门负责人本·戈梅斯告诉新闻网站The
    Intercept，“中国将教会我们新知。”


    大约在这段时间，谷歌高层发生了重大的人员变动。2015年，佩奇和布林退出了他们创办的公司，转而去追逐一系列谷歌之外的个人兴趣，从慈善事业到飞行汽车，再到太空探索。他们任命桑达尔·皮查伊为新一任首席执行官。身为谷歌产品总监的皮查伊颇受尊敬，DeepMind的创始人打算邀请他加入剥离后的公司董事会。然而，与佩奇不同，皮查伊没有太多时间或者说意愿帮助谷歌最有价值的收购之一“脱身”。他和谷歌执行董事长埃里克·施密特正忙着想方设法回到中国市场。


    接下来出现的一个公关机遇，使DeepMind站到了舞台中央。DeepMind一直在训练人工智能模型玩游戏，而其最新程序阿尔法围棋（AlphaGo）会下围棋（两人对弈的抽象策略棋盘游戏）。围棋起源于中国，看起来似乎很简单。它的棋盘上纵横刻有19条线段组成网格，棋子分黑、白两色。玩家轮流在网格的交点放一枚棋子，目标是用你的棋子包围空格，占领棋牌上的领土，同时吃掉对手的棋子。这是目前最复杂的策略性游戏之一，因为棋子的下法有10^(170)种，远远超过可观测宇宙中接近10^(80)的原子总数。


    多年前，佩奇和谷歌联合创始人谢尔盖·布林在斯坦福大学创业期间曾一起下过围棋。在谷歌收购DeepMind几周后，佩奇向哈萨比斯提到了他对围棋很感兴趣，哈萨比斯说他的团队可以开发一个能战胜人类围棋冠军的人工智能系统。


    哈萨比斯不只是想给新老板留下好印象。他是建树颇丰的科学家，也是杰出的营销大师。他明白，如果阿尔法围棋能够战胜围棋世界冠军——就像1997年国际商业机器公司（IBM）的“深蓝”（Deep
    Blue）计算机战胜国际象棋世界冠军加里·卡斯帕罗夫一样，那么它将为人工智能开创一个激动人心的新的里程碑，同时巩固DeepMind在该领域的领导地位。DeepMind将对手锁定为韩国棋手李世石，并于2016年3月在首尔和他进行了一场五局制比赛。


    2亿多人通过网络和电视观看了李世石与DeepMind计算机的这场五局制围棋比赛。DeepMind负责运行程序的科学家在比赛前几小时不吃不喝，这样他就不用在比赛期间上厕所了。比赛开始后，哈萨比斯在阿尔法围棋的控制室和一个私人观赛区之间来回转圈。他既激动又忐忑，完全吃不下东西，即便当时他的团队已经把3
    000万种可能的走法教给了阿尔法围棋的神经网络。


    要想在围棋比赛中获胜，就得完全包围对手的棋子，然后吃掉它们。而要做到这一点，需要在策略上进行不同的细化，如平衡进攻与防守、长期目标与短期目标，以及预测对手的落子顺序。也就是说，你要谨慎地在棋盘上选择落子的位置。例如，最靠近棋盘边缘的一路很少被使用，因为在这里没有太大机会包围并占据对手的“领地”。这就是为什么在与李世石的第二局对决中，阿尔法围棋第37手的落子位置看上去错得让人匪夷所思。它将棋子下在了棋盘右数的第五路。通常来说，在五路落子起不到什么效果，因为这会让对手在四路建立“领地”优势。把棋子下在五路上是一种浪费。但这步棋走得太出人意料，也太有违常理，导致李世石花了15分钟时间思考对策，甚至一度走出了比赛房间。


    “这一步真是出人意料。”一名现场解说员说，他认为阿尔法围棋的操作员点错了按钮。


    但又下了约100手后，这一奇怪的策略开始奏效。阿尔法围棋在棋盘左下方的两颗黑子最终与它放在五路的棋子完美连接到了一起。双方又下了4个多小时，李世石认输。他和解说员们都用“完美”来形容第37手棋。哈萨比斯说，这显示了人工智能的创造力。总的来说，阿尔法围棋以4∶1的比分战胜了李世石。


    对人工智能来说，这是一个里程碑式的时刻，给DeepMind带来了前所未有的媒体关注狂潮，奈飞还出品了一部有关阿尔法围棋的获奖纪录片。哈萨比斯已经准备好要见好就收，投身下一个项目。


    但谷歌也看到了机会，想要向中国展示其技术实力，以开辟一条重返中国的新路。高管们认为，阿尔法围棋或许可以在对华外交中起到“乒乓外交”的作用，就像1971年中美乒乓球运动员的交流促进了冷战后两国外交关系解冻一样。如果在韩国的比赛是DeepMind的一次宣传噱头，那么接下来在中国的比赛就应该为谷歌服务。


    谷歌希望DeepMind让阿尔法围棋与段位更高、当时排名世界第一的19岁中国围棋选手柯洁对决。柯洁与李世石截然不同，他热衷挑战、彰显自我。但谷歌也同样傲慢，自认为可以通过炫耀技术获得重返中国的机会。


    据DeepMind的前员工透露，这种情况引起了哈萨比斯的担忧。要是阿尔法围棋赢了，它看起来就像一次又一次打败人类的邪恶人工智能；要是输了，他们在韩国炒作的成果就会烟消云散。无论怎样都得不偿失。


    明知谷歌迫切想要以此在中国立足，但哈萨比斯还是运用自己的战略能力与皮查伊达成了妥协：他们会再进行一场比赛，但这次使用阿尔法围棋的新版本阿尔法围棋大师（AlphaGo
    Master）。它的运行不需要数百台不同的计算机，只需要一台由谷歌芯片驱动的机器。这样一来，他们就能将比赛作为新人工智能系统的一次测试，而不是又一次试图击败人类冠军的尝试。如果系统输了，他们可以说它无法与原先的阿尔法围棋相提并论，从而挽回颜面；如果赢了，他们可以公开称赞一个更强大的新系统。谷歌也可以推销旗下新的机器学习平台TensorFlow，并在中国为其规模虽小但不断增长的云计算业务争取一些大公司客户。皮查伊同意了。


    这场比赛于2017年5月在中国乌镇举行，新的阿尔法围棋在与柯洁的三局比赛中全部获胜。


    谷歌领导层试图对形势保持乐观。施密特在比赛现场接受采访时，趁机大力宣传TensorFlow，并表示阿里巴巴、百度、腾讯等中国互联网巨头都应该试试这个平台。他说：“使用TensorFlow会让它们变得更好。”


    然而，谷歌对新业务的渴望蒙蔽了它的双眼。当时，中国科技公司在人工智能研究方面已经取得了长足的进步。因此，它们并不需要TensorFlow甚至谷歌。中国互联网巨头百度甚至在一年前就从谷歌挖走了创建“谷歌大脑”项目的斯坦福大学教授吴恩达。


    谷歌高层很快就意识到，想要进入庞大的中国互联网市场掘金是在做白日梦。这对公司来说是一个巨大的挫败。而阿尔法围棋的成功也让哈萨比斯陷入了尴尬的境地。DeepMind如潮的好评及其展示的先进人工智能，使人工智能实验室看起来对Alphabet更有用了。即便如此，哈萨比斯仍旧和苏莱曼一起继续推进主要由他草拟的拆分计划。


    哈萨比斯对此信心满满。在2017年5月的中国赛事结束几周后，他带领300多名DeepMind员工中的大多数人飞往苏格兰的一个乡村度假，并和苏莱曼共同揭晓了拆分计划。在他们租来的酒店会议中心，两人宣布了将DeepMind转变为一家全球利益公司的计划。他们告诉员工，就像联合国、盖茨基金会等其他公益组织一样，DeepMind
    最终会成为一个由谷歌控股的非营利组织。他们解释说，公司最终目的是成为公益组织，并以一种有益于世界的方式引导人工智能发展。DeepMind不再是谷歌的金融资产，而将与谷歌签订独家授权协议，同时继续追求解决世界难题的使命。


    据当时在场的人士说，这个消息让员工欢欣鼓舞。突然之间，人工智能科研人员拥有了两全其美的人生。他们在一家薪酬待遇丰厚的科技公司工作，但也在“破解智能，并用智能解决其他一切问题”。两位创始人称，拆分事宜将在2017年9月前完成。


    哈萨比斯和苏莱曼要求员工对这件事保密，这没什么奇怪的。DeepMind的员工大多签署了严格的保密协议，不允许谈论公司的计划和技术。但这次他们还被告知不要在公司内部谈论拆分。举例来说，一些员工在偶尔提到该计划时会用暗语“西瓜”代替，相互交谈时还会使用诸如Signal之类的加密消息应用程序。据DeepMind的前员工透露，部分公司高层建议员工不要通过内部设备或谷歌邮箱等应用程序讨论此事。


    DeepMind的科研人员认为，保密是出于对谷歌滥用通用人工智能的担忧。随着时间的推移，谷歌参与了一个军事项目，这些怀疑在某种程度上得到了证实。美国国防部于2017年启动了所谓Maven（美军智能化战场识别系统）项目，试图在其国防战略中纳入更多人工智能和机器学习元素，比如为无人机配置计算机视觉以提高武器的瞄准能力。根据泄露给新闻网站The
    Intercept的电子邮件，谷歌参与该项目的目标是，希望每年能从合作中获利2.5亿美元。不过，公司内部大规模的抗议迫使谷歌关闭了该项目，并拒绝与美国国防部续签合同，而此事也证实了DeepMind对其人工智能会被滥用的担忧是有道理的。


    然而，拆分的进展很慢。哈萨比斯等高管向员工保证“只剩6个月”就能完成拆分，然后在几个月后老调重弹。过了一段时间，工程师们开始怀疑这一计划究竟能否实现。它看起来面目模糊得很。例如，苏莱曼告诉员工他希望DeepMind与谷歌合作的新规定在法律上具有可执行性，但他和其余的管理人员都无法说清这些规定该如何落地。假设谷歌将来把DeepMind的人工智能用于军事目的，DeepMind能起诉谷歌吗？这一点尚不明确。DeepMind的团队被要求起草指导方针，禁止使用其人工智能侵犯人权和造成“整体伤害”。但“整体伤害”到底是指什么？没有人知道。


    部分原因在于，DeepMind没有聘请足够多的人员来推敲这些问题。为了改善人工智能模型的性能，它一直在招募科学家和程序员，但只有少数员工就人工智能开发的伦理层面进行研究。例如，2020年该公司大约有1
    000名员工，但大多是研究型科学家和工程师，而研究伦理问题的员工不到10名，其中只有两名员工针对人工智能伦理问题开展博士级别的学术研究。几乎没人关注人工智能系统是如何导致偏见和种族主义，或者损害人权的。一位DeepMind的员工当时就说：“在实际只有两人的情况下，不能说我们拥有一支伦理团队。”


    在人工智能领域，“伦理”和“安全”涉及不同的研究目标，近些年来两个议题的倡导者也一直争议不断。一方面，自称致力于人工智能安全性的科研人员往往与尤德考斯基和扬·塔林殊途同归，他们想要确保超级通用人工智能系统不会在未来对人类造成灾难性的伤害，比如通过药物研发制造化学武器并消灭人类，或者通过在互联网上传播错误信息彻底破坏社会稳定。


    另一方面，伦理研究更加关注人工智能系统是如何被设计的，以及如何被使用。他们研究这项技术可能会以怎样的方式对人类造成伤害。这是因为谷歌照片算法将黑人标记为“大猩猩”并非孤立事件。偏见是人工智能的一个大问题。在美国刑事司法系统中，黑人被算法错标为更有可能再次犯罪的比例高得出奇。而开发人员也会使用人工智能工具做出某些违背伦理的行为，比如斯坦福大学的研究人员推出了一个声称可以分辨性取向的面部识别系统。


    以上三个系统的开发人员在设计模型时应该更多地考虑公平、透明和人权。但这些问题很模糊，很难定义，往往也影响不到人工智能公司的管理者，而他们多半是白人男性。因此，如果今天的人工智能系统出错，它们更有可能伤害有色人种、女性和少数族裔。


    令人困惑的是，2017年DeepMind在媒体和官网上都谈到了伦理在其“破解智能、推进科学、造福人类的使命”中占据重要地位。例如，DeepMind在接受《连线》杂志采访时，讨论了如何在接下来的一年里将其伦理研究团队扩充到25人。


    但事实上，据一名前高管透露，该团队最终只扩充到大约15人，主要是因为DeepMind的领导层把精力都花在了拆分计划上。“他们一直在谈论这项工作，但只有少数几名伦理研究人员在苦苦支撑。”另一名员工解释说，伦理团队既缺乏人力支撑，也缺乏资源。“这不合理，DeepMind可是一家价值数十亿美元的公司。”


    既然DeepMind在伦理问题上没有付诸实际行动，那么疑问也随之而来：为什么创始人急于将公司从谷歌拆分出来？他们是真的想防止自己的技术造成伤害，还是更想满足自己的掌控欲望？在拆分条款中，DeepMind计划和谷歌签署独家授权协议，但创始人似乎并未明确他们在将人工智能用于武器方面的界限，或者这样做是否具有法律效力。他们看起来雄心勃勃，但在细节上有所欠缺。一些员工甚至怀疑，哈萨比斯、苏莱曼和莱格是否过于天真，想要“鱼与熊掌兼得”——他们既想继续拿着谷歌的钱开发通用人工智能，又想从谷歌那里夺取人工智能的控制权。'
