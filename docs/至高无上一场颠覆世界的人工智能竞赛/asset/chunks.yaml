    上市公司通常设有代表股东利益的董事会。董事们每季度开会审查公司的行为，确保公司正确行事，促使股价上涨而不是下跌。苏莱曼对他的合伙人说，为了应对像人工智能这样的变革性技术，DeepMind应该设置一个不同的董事会。该董事会的职责不是关注赚钱，而是确保DeepMind安全且合乎伦理地开发人工智能。哈萨比斯和莱格一开始并不赞成，但苏莱曼很有说服力，他们最终同意了这一提议。


    哈萨比斯找到扎克伯格，告诉他出售DeepMind需要一个前提，那就是建立伦理安全委员会，该委员会应具有独立的法律地位，以便掌管所有最终由DeepMind开发的超级人工智能。扎克伯格对这一要求犹豫不决。他希望发展脸书的广告业务，通过旗下各种社交媒体平台“连接世界”，但并不想经营一家独立的人工智能公司，何况公司还自带一项宏伟使命和一堆伦理协议。最终，谈判破裂了。


    表面上，哈萨比斯告诉员工，DeepMind将在接下来的20年里保持独立运作。但私下里，他已经厌倦了募资，并对自己用于做实际研究的时间变得非常少而感到沮丧。在拒绝了扎克伯格的巨额报价后，他忍不住想知道如果把公司卖给硅谷的公司能挣多少钱，尤其是当时大型科技公司正对人工智能垂涎三尺。硅谷科技巨头的高管，其中包括一两位亿万富翁，现在经常给DeepMind的科研人员打电话，试图把他们挖走。DeepMind的许多员工都是深度学习方面的专家，这些年来，深度学习领域一直停滞不前，直到最近才有所改变。


    转折点出现在2012年。此前，斯坦福大学人工智能教授李飞飞创建了一个学术界的年度挑战项目ImageNet（用于视觉对象识别软件研究的大型可视化数据库），该项目需要科研人员提交拥有视觉识别能力的人工智能模型，模型要能够识别猫、家具、汽车等图像。这一年，科学家杰弗里·辛顿的研究小组使用深度学习开发出了一款模型，比以往任何模型都精确，他们的成果震惊了人工智能界。突然之间，人人都想要聘请深度学习人工智能理论方面的专家，而这种理论正是受到了大脑识别模式的启发。


    莱格表示这是一个小众领域，只有几十位专家。“我们聘请了其中的不少人。”哈萨比斯每年支付他们大约10万美元薪资，但谷歌、脸书等科技巨头会开出比这高几倍的年薪。莱格回忆道：“有一些非常出名的人打电话给我们的科研人员，向他们开出了3倍的薪水。”据DeepMind的一名前员工透露，扎克伯格就是这些非常出名的人之一。“我们必须卖掉公司，否则就会变得支离破碎。”哈萨比斯渴望成为第一个开发出通用人工智能的人，他不能眼睁睁看着资源更丰富的科技公司抢在前面。


    令哈萨比斯没想到的是，投资人埃隆·马斯克也突然提出要收购DeepMind。据知情人士透露，这位亿万富翁想用特斯拉（他已经经营了5年的电动汽车公司）的股权作为对价。作为投资人，马斯克从不干涉公司事务，只是偶尔和哈萨比斯联系。虽然这位亿万富翁越来越担忧人工智能的风险，但商业目标在他的脑海中仍居于首位。他希望特斯拉汽车能够在世界范围内最先成功使用自动驾驶技术，自然也就需要更多的顶尖人工智能专家。现在，他可以通过收购DeepMind来组建一支精英团队。


    但DeepMind的创始人仍旧保持警惕。特斯拉股权看起来没什么吸引力。他们也对马斯克这样的人接管通用人工智能感到不安。尽管主流社会已经开始承认马斯克的前瞻性，但马斯克在科技界以反复无常闻名，他会突然解雇员工，甚至把特斯拉的联合创始人赶出公司。


    DeepMind的创始人有多么欣赏马斯克的投资眼光和人脉关系，就有多么担忧他的喜怒无常。他们也拒绝了马斯克的提议，但没有意识到薄脸皮的马斯克有多么不喜欢被人拒绝，也没有意识到这个决定将会多么令他们困扰。不过很快，哈萨比斯就又收到了一封电子邮件，它来自谷歌。


    ## 5 为了乌托邦，也为了钱


    这封邮件跨越5 000余英里，从加利福尼亚州阳光明媚的芒廷维尤传来，发送方是谷歌总部的一名高管。身在伦敦的哈萨比斯点开电子邮件，内容是邀请他与谷歌首席执行官拉里·佩奇见面。1998年，佩奇联合斯坦福大学博士生谢尔盖·布林创办了谷歌。他俩希望改进互联网搜索方式，于是设计了一种叫作PageRank（网页排名）的算法，按照网页的相关性和互联性对其进行分类。他们从加利福尼亚州门洛帕克一个朋友家的车库里起家，最终建立起全球最大的科技公司之一。


    但用今天的眼光来看，谷歌赚钱的方式并不是那么高科技或创新，因为它已经变成了和脸书一样的广告销售巨头。谷歌的绝大部分利润和收入来自追踪用户的个人信息，并通过搜索、YouTube（视频网站）、谷歌邮箱，以及数百万使用谷歌多媒体广告联播网的网站和应用程序向用户投放广告。


    对于像哈萨比斯这样想用人工智能改变世界的人来说，邮件上的邀请令他有些不安。但他也知道，要是不接受邀请，谷歌最后可能会挖走他的员工，并在没有他的情况下开发通用人工智能。谷歌已经聘请了多达数百名工程师研究人工智能，因此哈萨比斯认为他不能拒绝来自加利福尼亚州的见面要求。


    见到佩奇后，哈萨比斯发现两人志同道合。在他面前的是一个性格内向的数学专业毕业生，眉毛又黑又浓，穿着休闲衬衫和短裤。在创办谷歌的过程中，佩奇也一直怀揣着开发强大的人工智能的梦想。哈萨比斯回忆道：“他告诉我，他始终认为谷歌是一家人工智能公司，就算是1998年在车库里创业的时候他也是这么想的。”


    这在一定程度上是出于个人原因，佩奇的父亲是人工智能和计算机科学教授，在1996年去世。这促使他成了“人工智能技术专家二代”。佩奇钦佩哈萨比斯对开发通用人工智能的认真态度，认为这个想法没什么疯狂的。他也在谷歌内部启动了一个开发类人人工智能的项目，该项目最终将彻底激起哈萨比斯的强烈竞争意识。


    佩奇的项目叫“谷歌大脑”，哈萨比斯当时还不了解它的情况。项目是由说话轻声细语的斯坦福大学教授吴恩达提议的，他希望在谷歌内部开发更加先进的人工智能系统。2011年，也就是在谷歌接触DeepMind的几年前，这位教授给佩奇发送了一份4页纸的文件，名叫《神经科学启发的深度学习》。吴恩达教授希望谷歌首席执行官能批准一个项目，让他开发“通用的”人工智能系统，而这正是哈萨比斯在英国所做的研究。


    事实证明，吴恩达和哈萨比斯都采用了类似的方法实现他们的目标，那就是将神经科学作为开发通用人工智能的基础。这位斯坦福大学教授在提案中告诉佩奇，他会“对哺乳类动物大脑的各个部分进行越来越精确的模拟构建”。


    即使吴恩达是人工智能领域的领军人物，而且为全球最负盛名的大学之一工作，开发通用人工智能的想法在当时也颇具争议。吴恩达回忆道：“朋友们告诉我这有点奇怪。他们说‘它无益于你的职业生涯’。”


    从某种意义上说，他们是对的。就科学而言，吴恩达和哈萨比斯对人类大脑的痴迷存在一些问题。理论上，用人类大脑作为人工智能的范本合情合理，但照搬生物学发现并非万能之策。想想那些最早尝试制造飞行器和模仿鸟类飞行原理发明飞行机械装置的人吧。他们操纵着拥有笨重翅膀的机器，最终都一头栽向了地面。其他计算机科学家在复制大脑的过程中也一直在碰壁。2013年，神经科学家亨利·马卡姆在一次“科技、娱乐、设计演讲”（TED
    Talk）中说，他已经想出了在超级计算机上模拟完整人脑的方法，并将在10年内实现这一目标。10年过后，他的人脑工程耗资超过10亿美元，而且基本上失败了。


    随着时间的推移，吴恩达、哈萨比斯等人工智能科学家会意识到，在我们对大脑的理解——从神经元的功能到脑区的运作方式——依然残缺不全的情况下，想要模拟大脑困难重重。虽然我们知道人类大脑里大约有900亿个神经元在持续放电，但我们仍旧不知道这些信息是如何被处理的。


    吴恩达说：“事后来看，追求过于真实地还原生物学是一个错误。”但就科学的另一面而言，吴恩达的研究非常正确，那就是扩大神经网络的规模。


    神经网络是一种通过大量数据反复训练建立起来的软件。一旦经过训练，它就可以识别人脸，预测棋路，或者向你推荐下一部奈飞大电影。神经网络又称“模型”，通常由许多不同的层和节点组成，这些层和节点处理信息的方式与人脑的神经元模糊相似。模型训练得越多，节点预测或识别事物的能力就越强。


    吴恩达发现，用于训练的节点、层和数据越多，这些模型可做的事情就越多。几年后，OpenAI在这方面也会有类似的发现，即“规模化”这些关键要素至关重要。在斯坦福大学做实验期间，吴恩达注意到深度学习模型越大，表现就越好。这些结果让他兴奋不已，促使他给佩奇发送了那份4页纸的文件，表示他也许能进行“大规模的大脑模拟”，从而向“人类水平的人工智能”迈进。


    佩奇很喜欢这个想法，不仅同意了，还让吴恩达来领导这一谷歌迄今为止最前沿的人工智能研究项目。但几年过去了，“谷歌大脑”似乎并没有走上开发通用人工智能的正轨。相反，它帮助谷歌改善了定向广告业务（通过更好地预测用户想要点击的内容，使广告更具针对性），同时增加了公司的收入。吴恩达承认，这并非当初他向佩奇发送提案时想要实现的目标。他说：“与我所做过的工作相比，这多少有点令人沮丧。”


    吴恩达真正想做的科学研究是将人类从精神苦役中解放出来，就像工业革命把我们从持续的体力劳动中解放出来一样。他相信更强大的人工智能系统也能为专业人员带来同样的帮助，“这样我们就可以都去追求更令人兴奋的高水平任务目标”。


    吴恩达的行事作风与哈萨比斯不同。那位英国企业家希望尽可能不受广告巨头的影响，吴恩达教授却很乐意在谷歌工作。从这个意义上讲，吴恩达帮了哈萨比斯一个大忙。站在谷歌这艘母舰上，吴恩达所做的研究已经步入了助力公司广告业绩提升的轨道，所以DeepMind不用立即做出贡献。


    到2013年底，谷歌首次与DeepMind就收购事宜进行接洽，此时吴恩达已经带领研究团队着手开发复杂的人工智能模型，以便提升谷歌的广告工具，这让他们偏离了吴恩达的崇高目标：开发全能人工智能，将人类从精神苦役中解放出来。现在，佩奇乘坐飞机前往伦敦进行收购DeepMind的谈判，他知道他可以把谷歌的钱花在一些更有前瞻性的研究项目上。


    根据《纽约时报》撰稿人凯德·梅茨所著的《深度学习革命》一书，DeepMind的创始人在伦敦的办公室接待了这位谷歌亿万富翁，并介绍了公司目前的研究情况。哈萨比斯描述了他的团队是如何开发出一种叫作强化学习的新技术，并训练一个人工智能系统掌握雅达利的怀旧游戏《打砖块》的。在这款游戏里，你要来回滑动球拍，然后用球拍把球打向一堵砖墙。两小时之内，系统就学会了把球击打到正确的位置，而且每次都能撞出几块砖，从而在顶端一排砖块后面的狭窄空间里打出一条通道。佩奇对此惊叹不已。


    作为一种技术，强化学习与你用食物奖励听从命令的狗没什么不同。在训练人工智能时，你也可以运用类似的奖励模型，比如“+1”这样的数字信号来表明某个结果很好。通过不断试错和反复玩游戏，系统学会了什么可行、什么不可行。高度复杂的计算机代码包裹着优雅简洁的理念。


    接着，莱格向佩奇介绍了未来的发展方向：将这些技术应用到现实世界。就像训练模型学会玩电子游戏一样，运用相同的方法，他们可以教会机器人在家里四处走动，或者开发一款熟练使用英语的自主智能体。这就是DeepMind的发现和通用人工智能本身最终将产生最深远影响的所在。佩奇和他的团队被说服了。


    佩奇知道哈萨比斯和他的创业伙伴拒绝了脸书给出的巨额报价，因此亲自领导了这次交易谈判。他很快就知道了个中原委。哈萨比斯提出了两个出售条件。第一，他和他的创业伙伴希望谷歌永远不要将DeepMind的技术用于军事目的，无论是操控自主无人机或武器，还是支援战场上的士兵。他们认为这些是谷歌永远不该逾越的道德红线。


    第二，他们希望谷歌的领导人签署一份伦理和安全协议。这份协议由伦敦的律师起草，将未来DeepMind开发的所有人工智能技术都交给一个伦理委员会掌控，哈萨比斯和联合创始人苏莱曼将共同组建这个委员会。他们还没想清楚委员人选应该包括哪些人，但希望委员会拥有完全合法的地位，可以监管他们最后开发出来的强大的人工智能。


    “如果我们成功，就需要谨慎对待通用人工智能。”哈萨比斯在谈及他和创业伙伴想要成立的委员会时说，“因为这是一项万能的技术，也许还是有史以来最强大的技术之一，我们希望与那些同样认真负责的人保持一致。”


    果然，历经数月的艰难谈判，谷歌才同意这两个导致脸书收购失败的条件。收购DeepMind意味着佩奇将会拥有首家开发通用人工智能的公司。他知道，如果伦理委员会对这项技术拥有合法控制权，谷歌就很难从中获利，但最终获胜的还是他的理想主义观。他们会找到解决这个问题的办法。佩奇同意了DeepMind的要求，将设立伦理委员会纳入收购流程。


    通用人工智能之所以需要被谨慎对待，不仅是因为一家大型企业可能会左右它的未来，还因为它吸引了数种意识形态的关注，这些意识形态方兴未艾，可能会引导该技术朝着不同的方向发展。哈萨比斯已经从彼得·蒂尔和扬·塔林等投资者的身上学到了这一点，蒂尔希望人工智能更快发展，而塔林则担心这位年轻的英国企业家可能引发一场大灾难。


    对于那些对使用人工智能具有强烈信念的人来说，它那令人难以置信的潜能为其增添了一层近乎宗教般的色彩。在接下来的几年，这些意识形态将与创新者和垄断企业争夺通用人工智能的控制权，这会成为这项技术不可预知的风险。例如，他们会把萨姆·奥尔特曼赶出OpenAI，荒谬地推动人工智能商业化，描绘出一幅人工智能力量的末日图景，就为了吸引更多企业对该软件的关注。在追逐商业成功和利润的世界里，越来越多的人工智能缔造者发现他们正被不同的信条包围，无论是尽快开发人工智能以实现乌托邦，还是煽动对它可能导致世界末日的恐惧情绪。


    了解哈萨比斯的人说，作为一名喜欢对冲赌注的战略思想家，他大部分时间置身于这些争论之外，这在一定程度上归功于他自己独特的目标，那就是利用通用人工智能做出重大甚至神圣的发现。苏莱曼也更担心人工智能迟早会引发社会问题。沙恩·莱格的前同事透露，在三位联合创始人中，莱格是最支持那些追求通用人工智能的极端意识形态的，其中一个意识形态已经在这方面酝酿了几十年。它就是历来饱受争议的超人类主义，有助于解释为什么人工智能缔造者有时会忽视这项技术不利的一面。


    超人类主义的基本前提是人类目前处于二流水平。在正确的科学发现和技术支撑下，也许我们有一天将超越身体和精神的极限，进化成一个更智慧的新物种。我们会更聪明，更有创造力，寿命也更长。我们甚至可能成功将人脑与计算机融合，并探索银河系。


    其核心思想可以追溯至20世纪40年代和60年代，当时一位名叫朱利安·赫胥黎的进化生物学家加入并出任英国优生学协会主席。优生学运动提倡人类应该通过选择性育种改善自身，这在英国的大学、知识分子和上层阶级中大为盛行。赫胥黎本人出身于一个贵族家庭（他的兄弟阿道司创作了长篇小说《美丽新世界》），他认为社会上层阶级的基因更优越。下层阶级需要像歉收的庄稼一样被淘汰，并被强制绝育。“（他们）繁殖得太快了。”赫胥黎写道。


    在纳粹开始利用优生学运动之后，赫胥黎决定重新对其命名。他在一篇论文中提出了新的术语“超人类主义”，认为除了合理繁殖以外，人类还可以通过科学和技术“超越自身”。到20世纪80年代和90年代，该运动开始达到高峰，因为不断发展的人工智能领域提供了一种诱人的新的可能性，那就是也许科学家可以将人脑与智能机器融合，进而强化人类的心智。


    这一主张在“奇点”的概念中得到了具象化。奇点是未来的某个时刻，人工智能和技术变得无比先进，人类将经历急剧而不可逆转的改变，通过将技术与机器融合来优化自身。年轻时读过相关书籍的莱格和DeepMind的富豪投资人彼得·蒂尔都被该主张俘获了。科技专家如此渴望体验这种乌托邦，以至于奥尔特曼、蒂尔等人已经和不同的公司签署协议，将他们的大脑或整具身体冷冻保藏，以防无法在死前实现“脑机融合”。“我不指望它一定起作用，”蒂尔在记者巴里·维斯的播客节目中说，“但我认为我们应该尝试去做这样的事。”


    但是，其中一些观点的问题在于，随着时间的推移，拥护者会越来越狂热。例如，某些所谓的人工智能加速论者认为，科学家在道义上有责任尽快开发通用人工智能，以创造一个后人类天堂，一块技术迷的极乐净土。只要在他们的有生之年缔造成功，他们就能长生不死。但是，加快人工智能开发也可能意味着走捷径，使技术危害到某些人群或失去控制。


    因此，有些人则持相反的立场，认为人工智能代表了未来的一种魔鬼形象，需要被叫停。留胡子的自由主义者埃利泽·尤德考斯基在喝咖啡的过程中激起了扬·塔林的防范之心，他是这场思想运动的领军人物，不断通过自己的网站LessWrong为其注入动力。到2014年谷歌收购DeepMind时，包括人工智能研究员在内的好几百人齐聚该网站，就如何防止未来强大的超级智能造成毁灭展开哲学辩论。LessWrong成为互联网上最具影响力的人工智能末日恐惧阵地，一些新闻报道指出它具有现代世界末日崇拜的所有特征。一旦有成员提出未来人工智能也许会以别的方式毁灭人类，尤德考斯基就会公开发文痛斥，并将他们踢出群组。


    久而久之，所谓的人工智能毁灭论者在富有的技术人员当中获得了足够的支持，他们投入资金创办公司，并引导形成对自身有利的政府政策。尤德考斯基的网站影响力日益增加，以至于很多忠实读者最后加入了OpenAI。


    但在通用人工智能领域逐渐兴起的意识形态之中，最令人不安的或许还是那些注重以数字形式创造一种近乎完美的人类物种的观点。波斯特洛姆的《超级智能》在一定程度上助长了这种观点。该书在人工智能领域产生了一种矛盾的影响。它用把“人类都变成回形针”的举例，使大众更加恐惧人工智能可能带来的毁灭，但也预言了只要创造适当且强大的人工智能，就能引领开启一个光明的乌托邦。波斯特洛姆认为，这个乌托邦最迷人的特征之一是“后人类”，他们拥有“远超现今人类的能力”，并存在于数字世界里。在这个数字乌托邦，人类可以体验违背物理定律经验的环境，如无协助死亡或探索幻想世界。他们可以选择重温珍贵的回忆，创造新的冒险，甚至体验不同形式的意识。与他人的互动将变得更加深刻，因为这些新人类能够直接分享彼此的思想和情感，从而产生更深层次的联系。


    这些想法对硅谷的部分群体充满诱惑力，他们相信只要构建合适的算法，就能实现如此奇妙的生活方式。通过描绘一个既可能是天堂也可能是地狱的未来，波斯特洛姆诱发了一种普遍的看法，最终促使硅谷的人工智能缔造者，如萨姆·奥尔特曼，赶在伦敦的德米斯·哈萨比斯之前开发通用人工智能。这种普遍的看法就是：他们必须率先开发通用人工智能，因为只有他们可以安全地做到这一点。否则，别人可能会开发违背人类价值的通用人工智能，这不仅会消灭生活在地球上的几十亿人，还将毁灭未来可能出现的数万亿完美新数字人类，那我们就都将丧失生活在极乐世界里的机会。与此同时，波斯特洛姆的思想也会产生危险的后果，因为它们把业界的注意力转移开，使人们不再研究人工智能将如何危害现在的人类生活。


    这些当代的技术意识形态以及谷歌收购DeepMind的事实，都说明了一个日渐清晰的残酷真相：对科技公司来说，为人工智能寻找负责的“管家”变得越来越难。一边是近乎宗教般的狂热，另一边是对商业增长无法停止的渴望，在两者的双重驱动下，不同的目标正朝着短兵相接的方向前行。

