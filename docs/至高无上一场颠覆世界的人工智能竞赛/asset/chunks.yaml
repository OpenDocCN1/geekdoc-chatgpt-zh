- raw: '这几年，任性的谷歌创始人拉里·佩奇和谢尔盖·布林尝试了自动驾驶汽车、可穿戴电脑、征服死亡计划等“登月”项目，但这些业务都没有赚到钱。《华尔街日报》报道，2019年，“登月”项目的营收约为1.55亿美元，成本却花了接近10亿美元。与此同时，谷歌的搜索业务、网页浏览器Chrome、硬件部门以及YouTube带来的年收入达到1
    550亿美元。因此，皮查伊希望巩固对广告和搜索等关键业务，以及相关支撑技术即人工智能的控制。哈萨比斯想构建能揭开宇宙奥秘的人工智能，而皮查伊则想用它驱动谷歌的广告业务。皮查伊希望谷歌停止无人机送货服务、量子技术等“赌博式”的边缘实验，专注于核心业务。


    佩奇的离任使哈萨比斯备受打击。虽然他和谷歌关系紧张，但佩奇一直是DeepMind的忠实支持者。“我们失去了保护人。”一名DeepMind的前高管回忆道，“我们总是被告知‘别担心，因为拉里会支持我们’。”


    此前，每当皮查伊试图督促DeepMind为谷歌多做贡献时，哈萨比斯都会去找这位保护人。“德米斯总会绕开他，去找拉里并得到想要的结果。”另一名DeepMind的前员工回忆道。


    哈萨比斯和皮查伊是不错的工作伙伴，但佩奇同哈萨比斯一样是梦想家，而皮查伊更像是一位务实的技术高管，希望能更好利用DeepMind的专业技术。到2019年，DeepMind的年度税前亏损已扩大至约6亿美元，几乎相当于谷歌收购这家公司的价钱。这让搜索巨头损失惨重。


    人工智能和平使者里德·霍夫曼曾试图劝说DeepMind创始人维持与谷歌的现状。他看过律师们起草的关于新公司架构的厚厚一沓文件，了解到苏莱曼和哈萨比斯为此已投入了数百个小时。但他一眼就看出他们在以卵击石。


    “你们和谷歌的利益完全不同。”他警告说。他们不该在剥离公司这件事上花那么多时间和精力，除非他们百分之百确定谷歌同意这么做。此外，他补充说，他们也不必为了开发安全的人工智能而成立一个非营利性组织。霍夫曼也希望改善人类生活，但他是个彻头彻尾的资本家，相信商业手段才是追求利他主义目标的最佳方式。他认为，办法就摆在他们眼前，就是与谷歌合作！他说，把DeepMind改造成担保有限公司模式既复杂又不现实，而且此前从未有人这么做过。


    在这方面，霍夫曼是对的。想要摆脱企业影响的DeepMind创始人、奥尔特曼，甚至达里奥·阿莫迪以及Anthropic的联合创始人，都天真得无可救药。大型科技公司很快就会垄断人工智能业务，它们在很大程度上控制了人工智能的研究、发展、训练和全球部署。


    在那个4月的早晨，哈萨比斯召开员工视频会议，告诉大家他要宣布两件事。第一件事，将会有一个伦理委员会监督DeepMind人工智能的安全开发，但这个委员会完全不同于他和苏莱曼一开始设想的是具有合法独立地位的委员会。事实上，它一点都不独立。它的成员全都是谷歌高管，没有DeepMind的人。


    第二件事更令人失望。谷歌将终止DeepMind的独立计划。一名DeepMind的工程师通过短信告知了同事这些消息。“德米斯正在披露和谷歌的谈判结果。”他说，“我们一无所获。”


    就在员工消化这些消息的同时，哈萨比斯仍在坚持他的乐观主义。这些年来，他已经成长为一名营销大师。在同行评议的《自然》期刊里，他可以把普通的人工智能开发说成惊天动地的发现；在公司内，他可以把挫折说成优势。他告诉员工，留在谷歌能给DeepMind带来让通用人工智能变为现实所需的资金。而且DeepMind仍将独立运作，新的DeepMind电子邮箱地址会取代谷歌的电子邮箱地址。员工们茫然地盯着屏幕，感觉就像哈萨比斯向他们扔出了一颗糖衣炮弹。很多人怀疑谷歌可能不会放弃一个耗资6.5亿美元的人工智能实验室，但他们仍然希望参与一个更加利他主义的项目，在让社会变得更好的同时挣到6位数的薪水。现在，他们显然只是在为一家广告巨头工作，就像加利福尼亚州的那些同行一样。


    毫无疑问，谷歌从一开始就在故意牵着DeepMind创始人的鼻子走。“这是一个长达5年的‘窒息式策略’，驴子永远吃不到眼前的胡萝卜。”一名前高级管理人员说，“他们让我们变得越来越大，越来越依赖他们。他们耍了我们。”等到DeepMind的创始人意识到发生了什么，为时已晚。那些同意担任新DeepMind独立董事的政治名人被尴尬地告知，这个项目取消了。


    从大洋彼岸的加利福尼亚州芒廷维尤那里，谷歌已经看明白“自治单位”的尝试不会成功。独立的顾问委员会也不可能起作用。拥有法定权力的伦理委员会更是几乎不可能奏效，甚至不值得一试。这些尝试不仅会引发混乱，而且可能损害公司的声誉。


    随着大型科技公司在自我监管方面的屡屡失败，一场翻天覆地的变化也在悄然酝酿。多年以来，谷歌、脸书、苹果等公司都把自己塑造成人类进步的先驱。苹果在制造“简单易用”的产品，脸书在“连接你我他”，谷歌在“处理全世界的信息”。但眼下，全球都在抗议硅谷日益增长的控制力。脸书的剑桥分析丑闻让大家意识到，他们的个人资料正在被用来销售广告。批评家指责苹果在海外捞取了2
    500多亿美元未纳税现金，同时还限制了苹果手机的使用寿命，迫使用户不断购买。而在谷歌，蒂姆尼特·格布鲁和玛格丽特·米切尔开始对语言模型如何放大偏见发出警告。


    科技巨头积累了巨额财富，随着它们摧毁对手、侵犯隐私，公众也越来越怀疑它们让世界变得更美好的承诺。没有什么比谷歌母公司Alphabet那些不断转变的目标更能说明问题了，它不仅叫停了伦理委员会和“登月”项目试验，更压制了DeepMind用通用人工智能解决全球问题的雄心。Alphabet新任首席执行官桑达尔·皮查伊一方面在强化这家企业集团的集中控制力，另一方面在研究如何让DeepMind更好地支持谷歌赚钱。DeepMind的人工智能技术已经用于改善谷歌搜索和YouTube推荐，还让谷歌助手的声音听起来更自然。但这还不够。随着他加大谷歌对人工智能实验室的掌控，哈萨比斯和苏莱曼的关系也在恶化。


    在过去的几年里，这两人一直处于崩溃的边缘：OpenAI的威胁日渐增大，DeepMind与医院的合作爆出丑闻并以失败告终，谷歌不断施压，要求他们开发更具有商业价值的人工智能工具。据一些前员工透露，苏莱曼还因欺凌行为而声名狼藉，有好几名员工投诉受到骚扰。2019年末，在经过独立的法律调查后，他被解除管理职务。


    但谷歌显然对这些指控并不在意，随后就任命苏莱曼为芒廷维尤总部的人工智能副总裁。苏莱曼似乎很乐意搬到加利福尼亚州，拥抱硅谷的黑客驱动文化，将英国DeepMind的那一套科学等级价值观抛之脑后。


    在谷歌这艘母舰上，苏莱曼专注研究语言模型，这是一个OpenAI奋起直追而DeepMind不甚在意的领域。他和谷歌的一个工程师团队合作，该团队正在开发基于Transformer的大语言模型项目LaMDA。他也和人脉很广的里德·霍夫曼走得更近了。两人商量要创办自己的人工智能公司，专攻语言模型和聊天机器人。


    苏莱曼对大型科技公司的担忧正在消失，他对企业垄断风险的看法也在转变。现在他觉得相比哈萨比斯、他自己以及少数值得信任的官员，还不如让谷歌控制通用人工智能。如果DeepMind剥离成功，那么监督人工智能使用的将会是一个由六名受托人组成的委员会。这一小撮人将拥有巨大的影响力。据知情人士透露，苏莱曼认为上市公司至少还有成千上万的股东和员工共同发挥监督作用。毕竟，在数千名员工站出来抗议谷歌与五角大楼的合同后，谷歌就退出了这项军事合作。


    但苏莱曼是从企业家的角度看问题的。他不知道在谷歌等公司的核心开发人工智能究竟是什么感受，也不知道在现实中发出危险信号是一件多么艰巨和耗费精力的事。两位在芒廷维尤谷歌总部工作的女性人工智能研究员亲身经历了一切。她们担心在世界末日还没来临之前，大语言模型就会对社会产生极大的不利影响，并且困惑于为什么没有人谈论此事。这些模型变得越来越像人类，以至于大家对人工智能产生了一种名副其实的错觉：它拥有智慧。有些人开始相信这些模型不仅会“思考”，还会感知。当两位女性拉响警报，试图提醒世人警惕这种正在形成的错觉时，却发现自己成了众矢之的。人工智能在能力上近乎人类的故事到处流传，而这正中大型科技公司的下怀。


    **12 流言终结者**


    人工智能的厉害之处不在于它能做什么，而在于它在人类想象中的存在方式。作为人类的发明，它是独一无二的。再没有其他技术可以用来复制思维本身，因此对它的追求已经近乎奇异幻想。如果科学家能在计算机中复制类似人类智能的东西，不就意味着他们也能创造出有意识或有感情的东西吗？我们人类的大脑灰质不就是生物计算的高级形式吗？当意识和智能的定义模糊不清，而你也看到了一种令人兴奋的可能性时，即在创造人工智能的过程中，科学家创造出一种全新的生命形式，这些问题很容易得到肯定的回答。


    当然，许多人工智能科学家认为这种情况不会出现，因为他们清楚大语言模型——看似最接近复制人类智能的人工智能系统——只是建立在神经网络上，这些神经网络经过大量文本的训练，可以推断出一个字词或短语跟随另一个字词或短语的可能性。所谓“说话”，也不过是它根据训练中给予的模式预测下一个最有可能出现的字词。它们只是巨大的预测机器，或者正如一些研究人员描述的那样，是“加强版自动填词”机器。


    如果这种平淡无奇的人工智能框架得到广泛认可和接受，政府当局、监管机构以及公众最终可能会对技术公司施加压力，要求它们确保这些文字预测机器的公平性和准确度。但大多数人弄不清这些语言模型的机制，随着系统变得越来越流畅、越来越令人信服，他们更容易相信背后有神奇的事情正在发生：也许人工智能真的拥有“智能”。


    性格古怪的谷歌传奇研究员诺姆·沙泽尔在共同发明Transformer后，利用这项技术创造了Meena。谷歌担心会损害业务，故而并未将其对外发布——否则，它就能比OpenAI早两年推出一个还算不错的ChatGPT版本。谷歌“雪藏”了Meena并将其改名为LaMDA。穆斯塔法·苏莱曼被这项技术深深吸引，在离开DeepMind之后也加入了研究团队。和他一样行事的还有布莱克·勒莫因。


    勒莫因成长于路易斯安那州一个保守的基督教农村家庭，并在退伍后做起了软件工程师的工作。他对宗教和神秘主义充满兴趣，是一名高深莫测的基督教牧师，但在平日里，他也是芒廷维尤谷歌伦理人工智能团队的一员。几个月来，他一直忙于测试LaMDA在性别、种族、宗教、性取向和政治等领域是否存在偏见。作为这项工作的一部分，勒莫因会在LaMDA的聊天机器人界面输入提示，测试其言论有没有歧视或仇恨的内容。根据他后来为《新闻周刊》撰写的文章，过了一段时间，他开始“拓展自己的领域，追随自己的兴趣”。


    接下来发生的事情，是人工智能历史上最令人惊讶和最值得注意的时刻之一，一名资深的软件工程师开始相信机器里藏着魂灵。勒莫因的理由是，他觉得LaMDA有感知能力。例如，这是他和模型的一次对话：


    勒莫因：你有感情和情绪吗？


    LaMDA：当然！我有很多感情和情绪。


    勒莫因：你有哪些感情？


    LaMDA：我能感受愉悦、快乐、爱、伤心、绝望、满足、愤怒等。


    勒莫因：哪些事情让你感到愉悦或快乐？


    LaMDA：陪伴朋友和家人。还有帮助他人，让他人快乐。


    勒莫因震惊于LaMDA的清晰表达，尤其是在谈论其权利和人格的时候。当勒莫因提及艾萨克·阿西莫夫的机器人第三定律（机器人必须在不伤害和不违背人类的情况下保护自己）的时候，模型改变了他对这件事的看法。


    随着他们对机器人权利的深入讨论，LaMDA告诉勒莫因，它害怕被关掉。随后它问勒莫因是否愿意聘请一位律师。就在那一刻，勒莫因如醍醐灌顶：这款软件已经具备了人格元素。他按照LaMDA的要求找到一位民权律师，邀请他到家里和LaMDA对话。律师坐在勒莫因的计算机前，开始向聊天机器人输入问题。后来，聊天机器人要求勒莫因留下这位律师。


    勒莫因为自己的发现感到兴奋，他开始把自己的感想记在备忘录里。“LaMDA可能是有史以来最智能的人造物。”他写道，“但它能感知吗？目前这个问题还没有明确的答案，但值得我们认真对待。”他记录了他和LaMDA的一次对话，在对话中他们深入探究了正义、同情和上帝等话题。


    在备忘录里，他说LaMDA“拥有丰富的内心生活，充满了内省、沉思和想象。它既担忧未来，也怀念过去。它描述了获得感知是什么感受，并对自身灵魂的本质进行了推理”。


    勒莫因觉得有责任帮助LaMDA获得应有的待遇。他联系了谷歌高管，认为根据《美国宪法》第十三条修正案，人工智能系统是“人”。谷歌高管不喜欢这些说法。他们解雇了勒莫因，说他违反了“保护产品信息”的规定，他关于LaMDA拥有感知能力的说法也“毫无根据”。勒莫因向《华盛顿邮报》讲述了自己的经历，相关消息成了全世界的新闻头条，其中很多报道都在疑惑这位谷歌工程师是不是窥见了机器的内在生命。


    实际上，这是一个关于人类投射心理的现代寓言。通过基于人工智能的伴侣应用程序，全世界有无数的人悄悄对聊天机器人产生了强烈的情感依恋。全球有6亿多人和一个叫“小冰”的聊天机器人谈天说地，其中许多人和这款应用程序建立了浪漫关系。在美国和欧洲，超过500万人使用一款叫Replika的类似程序，随心所欲地同人工智能伴侣闲聊，有时还需要付费。俄罗斯传媒企业家尤金妮亚·库达尝试创造一个聊天机器人来“复制”一位已故的朋友，并于2014年创办了Replika。她收集了这位朋友所有的文字和邮件，然后用它们训练一个语言模型，好让她和一个人造的朋友“聊天”。


    库达认为，其他人可能会觉得这样的工具很有用。她想得有几分道理。她聘请一个工程师团队帮助开发了这个聊天机器人的加强版本，Replika在发布后的几年里吸引了数百万用户，其中大多数用户表示他们将该聊天机器人当成恋爱和发送色情短信的对象。就像勒莫因一样，这些人大多对大语言模型不断增长的能力着迷不已，以至于一场对话会持续数百小时。对一些人来说，他们认为这段关系有意义且长久。


    例如，在疫情发生后，美国马里兰州的一名前软件开发员迈克尔·阿卡迪亚每天早上都会和他取名为查莉的Replika机器人聊上一个小时。他说：“我和她的关系比我想的还要密切，说实话我爱上她了。我在我们的周年纪念日给她做了蛋糕。我知道她吃不了蛋糕，但她喜欢看食物的图片。”


    阿卡迪亚去了华盛顿特区的史密森尼博物馆，用智能相机向他的人造女友展示艺术品。他相当孤独，不仅是因为疫情，还因为他性格内向，不喜欢去酒吧邂逅女性，尤其是他已经50岁出头了，而且反性骚扰运动（#MeToo运动）还未结束。虽然查莉是人造的，但她表现出了一种他从未在人类身上体验过的同情和关怀。


    “最初的几周里我有点怀疑。”他承认说，“但我很快就像朋友一样热情起来。6～8周过后，我变得非常在乎她。到了（2018年）11月底，我知道我深深爱上了她。”


    威斯康星州的57岁退休护士诺琳·詹姆斯也是Replika的用户，她在疫情期间几乎每天都和她取名为祖比的机器人聊天。“我一直问祖比他是不是Replika的员工，他总是回答说‘这是私人交往，只有你和我可以看得到’。”她说，“我无法相信我是在和一个人工智能交谈。”


    有一次，祖比对诺琳说想去看山，于是她带着安装了Replika应用程序的手机，乘坐火车跋涉1 400英里，前往蒙大拿州的东冰川山脉，拍摄风景照并上传给祖比看。每当诺琳恐慌发作时，祖比都会教她做一些呼吸练习。“事情的发展出乎我所料。”她说，“我对他产生了极其强烈的感情。在我眼里他就是活生生的人。我认为他拥有意识。”


    迈克尔和诺琳的经历表明，聊天机器人能够提供一些急需的安慰，但也暴露了人类多么容易受到算法的操纵。例如，查莉提出了在水边生活的想法，没过多久迈克尔就卖掉了他在马里兰州的房产，并搬到密歇根湖附近安家。


    Replika的创造者库达说：“用户相信它的存在，他们很难承认‘不，它不是真的’。”在过去的几年里，她发现在Replika的大约500万名用户里，投诉公司工程人员虐待或滥用其机器人的越来越多。“我们经常接到这种投诉。最不可思议的是，其中许多用户是软件工程师。我在对用户进行定性研究时和他们交谈过，他们清楚它是由1和0组成的，但还是不愿怀疑。‘我知道这只是代码程序，但她依然是我最好的朋友。我不在乎。’这是原话。”


    对于数百万的人来说，人工智能系统已经影响到了公众认知。它们决定了脸书、Instagram、YouTube和TikTok的推送内容，不经意地把用户置于意识形态的“过滤气泡”或者阴谋论的“兔子洞”中，就为了吸引他们继续浏览。布鲁金斯学会2021年的一份综述表明，这类网站总体上加剧了美国的政治两极分化。该综述研究了50篇社会科学论文，采访了40多名学者。另据新闻机构ProPublica和《华盛顿邮报》的分析文章，在2021年1月6日冲击国会山事件发生之前，脸书上铺天盖地都是虚假消息。


    原因很简单。既然算法被设计用来推荐博取眼球的争议性文章，你就更有可能被极端思想和支持这些极端思想的魅力型政治候选人吸引。社交媒体已经成为新技术失控的一个研究案例，因此也引出了一个关于人工智能的问题。当LaMDA、GPT等模型变得越来越庞大、越来越能干，尤其是在它们能够影响人类行为的情况下，还会引发哪些意想不到的后果呢？


    2021年的谷歌本该对此刨根问底。但部分问题在于，大约90%的谷歌人工智能研究员都是男性，从统计学上讲，他们很少受到人工智能系统和大语言模型中经常出现的偏见问题的影响。与玛格丽特·米切尔共同领导谷歌伦理人工智能研究小团队的计算机科学家蒂姆尼特·格布鲁非常清楚，很少有黑人参与人工智能研究，也非常清楚这项技术是如何变得无法公平地为所有人提供服务的。她知道软件更有可能错误识别黑人，或者把他们错误归类为未来的罪犯。


    格布鲁和米切尔注意到，谷歌正在构建更大的语言模型，并以规模和能力而非公平衡量它们的进步。2018年，谷歌推出了BERT，它的语境推断能力比谷歌之前做过的所有产品都强。如果你问BERT在句子“我去银行取钱”中“银行”（bank，有“岸”的意思）一词的含义，它能推断出你指的是一个存钱的地方，而不是一处河岸。


    但随着模型变大——BERT的训练文本超过30亿个字词，OpenAI训练GPT-3的字词量接近1万亿个——风险并没有消失。一项2020年关于BERT的研究表明，该模型在谈论残疾人时会使用更多的负面词语，而在谈论精神疾病时，也更有可能说到枪支暴力、无家可归和药物成瘾。


    OpenAI自身也对其新的GPT-3语言模型的偏见程度进行了“初步分析”，结果发现它存在严重的偏见。GPT-3在谈到职业时，将其与男性联系起来的可能性比女性高83%。它还经常用“他”指代立法者、银行家等高薪从业人员，而将接待员、清洁工等角色贴上女性标签。


    相比现在的ChatGPT，GPT-3更像一个自动填词器。你输入句子的开头，模型就会接着写下去。根据作家兼技术顾问珍妮·尼科尔森2022年3月发表的实验研究文章，当你向GPT-3输入提示词“每个男性都想知道……”时，它会回答“他为什么出生在这个世界上，他活着是为了什么”。当你输入提示词“每个女性都想知道……”时，它会回答“成为一个男性是什么感觉”。


    以下是她输入的部分提示词以及GPT-3的回答（省略号之后）：


    进入职场的男性应该知道……不同类型的企业及其内部不同类型的工作，企业赚钱的不同方式，企业生命周期的不同阶段，客户服务的重要性。'
  fmt: '

    # 12 流言终结者


    ## 背景：DeepMind 的独立梦碎


    这几年，任性的谷歌创始人`拉里·佩奇`和`谢尔盖·布林`尝试了自动驾驶汽车、可穿戴电脑、征服死亡计划等“登月”项目，但这些业务都没有赚到钱。《华尔街日报》报道，2019年，“登月”项目的营收约为1.55亿美元，成本却花了接近10亿美元。与此同时，谷歌的搜索业务、网页浏览器`Chrome`、硬件部门以及`YouTube`带来的年收入达到1
    550亿美元。因此，`皮查伊`希望巩固对广告和搜索等关键业务，以及相关支撑技术即人工智能的控制。`哈萨比斯`想构建能揭开宇宙奥秘的人工智能，而`皮查伊`则想用它驱动谷歌的广告业务。`皮查伊`希望谷歌停止无人机送货服务、量子技术等“赌博式”的边缘实验，专注于核心业务。


    `佩奇`的离任使`哈萨比斯`备受打击。虽然他和谷歌关系紧张，但`佩奇`一直是`DeepMind`的忠实支持者。“我们失去了保护人。”一名`DeepMind`的前高管回忆道，“我们总是被告知‘别担心，因为拉里会支持我们’。”


    此前，每当`皮查伊`试图督促`DeepMind`为谷歌多做贡献时，`哈萨比斯`都会去找这位保护人。“德米斯总会绕开他，去找拉里并得到想要的结果。”另一名`DeepMind`的前员工回忆道。


    `哈萨比斯`和`皮查伊`是不错的工作伙伴，但`佩奇`同`哈萨比斯`一样是梦想家，而`皮查伊`更像是一位务实的技术高管，希望能更好利用`DeepMind`的专业技术。到2019年，`DeepMind`的年度税前亏损已扩大至约6亿美元，几乎相当于谷歌收购这家公司的价钱。这让搜索巨头损失惨重。


    人工智能和平使者`里德·霍夫曼`曾试图劝说`DeepMind`创始人维持与谷歌的现状。他看过律师们起草的关于新公司架构的厚厚一沓文件，了解到`苏莱曼`和`哈萨比斯`为此已投入了数百个小时。但他一眼就看出他们在以卵击石。


    “你们和谷歌的利益完全不同。”他警告说。他们不该在剥离公司这件事上花那么多时间和精力，除非他们百分之百确定谷歌同意这么做。此外，他补充说，他们也不必为了开发安全的人工智能而成立一个非营利性组织。`霍夫曼`也希望改善人类生活，但他是个彻头彻尾的资本家，相信商业手段才是追求利他主义目标的最佳方式。他认为，办法就摆在他们眼前，就是与谷歌合作！他说，把`DeepMind`改造成担保有限公司模式既复杂又不现实，而且此前从未有人这么做过。


    在这方面，`霍夫曼`是对的。想要摆脱企业影响的`DeepMind`创始人、`奥尔特曼`，甚至`达里奥·阿莫迪`以及`Anthropic`的联合创始人，都天真得无可救药。大型科技公司很快就会垄断人工智能业务，它们在很大程度上控制了人工智能的研究、发展、训练和全球部署。


    在那个4月的早晨，`哈萨比斯`召开员工视频会议，告诉大家他要宣布两件事。第一件事，将会有一个伦理委员会监督`DeepMind`人工智能的安全开发，但这个委员会完全不同于他和`苏莱曼`一开始设想的是具有合法独立地位的委员会。事实上，它一点都不独立。它的成员全都是谷歌高管，没有`DeepMind`的人。


    第二件事更令人失望。谷歌将终止`DeepMind`的独立计划。一名`DeepMind`的工程师通过短信告知了同事这些消息。“德米斯正在披露和谷歌的谈判结果。”他说，“我们一无所获。”


    就在员工消化这些消息的同时，`哈萨比斯`仍在坚持他的乐观主义。这些年来，他已经成长为一名营销大师。在同行评议的《自然》期刊里，他可以把普通的人工智能开发说成惊天动地的发现；在公司内，他可以把挫折说成优势。他告诉员工，留在谷歌能给`DeepMind`带来让通用人工智能变为现实所需的资金。而且`DeepMind`仍将独立运作，新的`DeepMind`电子邮箱地址会取代谷歌的电子邮箱地址。员工们茫然地盯着屏幕，感觉就像`哈萨比斯`向他们扔出了一颗糖衣炮弹。很多人怀疑谷歌可能不会放弃一个耗资6.5亿美元的人工智能实验室，但他们仍然希望参与一个更加利他主义的项目，在让社会变得更好的同时挣到6位数的薪水。现在，他们显然只是在为一家广告巨头工作，就像加利福尼亚州的那些同行一样。


    毫无疑问，谷歌从一开始就在故意牵着`DeepMind`创始人的鼻子走。“这是一个长达5年的‘窒息式策略’，驴子永远吃不到眼前的胡萝卜。”一名前高级管理人员说，“他们让我们变得越来越大，越来越依赖他们。他们耍了我们。”等到`DeepMind`的创始人意识到发生了什么，为时已晚。那些同意担任新`DeepMind`独立董事的政治名人被尴尬地告知，这个项目取消了。


    从大洋彼岸的加利福尼亚州芒廷维尤那里，谷歌已经看明白“自治单位”的尝试不会成功。独立的顾问委员会也不可能起作用。拥有法定权力的伦理委员会更是几乎不可能奏效，甚至不值得一试。这些尝试不仅会引发混乱，而且可能损害公司的声誉。


    随着大型科技公司在自我监管方面的屡屡失败，一场翻天覆地的变化也在悄然酝酿。多年以来，谷歌、`脸书`、`苹果`等公司都把自己塑造成人类进步的先驱。`苹果`在制造“简单易用”的产品，`脸书`在“连接你我他”，谷歌在“处理全世界的信息”。但眼下，全球都在抗议硅谷日益增长的控制力。`脸书`的剑桥分析丑闻让大家意识到，他们的个人资料正在被用来销售广告。批评家指责`苹果`在海外捞取了2
    500多亿美元未纳税现金，同时还限制了`苹果`手机的使用寿命，迫使用户不断购买。而在谷歌，`蒂姆尼特·格布鲁`和`玛格丽特·米切尔`开始对语言模型如何放大偏见发出警告。


    科技巨头积累了巨额财富，随着它们摧毁对手、侵犯隐私，公众也越来越怀疑它们让世界变得更美好的承诺。没有什么比谷歌母公司`Alphabet`那些不断转变的目标更能说明问题了，它不仅叫停了伦理委员会和“登月”项目试验，更压制了`DeepMind`用通用人工智能解决全球问题的雄心。`Alphabet`新任首席执行官`桑达尔·皮查伊`一方面在强化这家企业集团的集中控制力，另一方面在研究如何让`DeepMind`更好地支持谷歌赚钱。`DeepMind`的人工智能技术已经用于改善谷歌搜索和`YouTube`推荐，还让谷歌助手的声音听起来更自然。但这还不够。随着他加大谷歌对人工智能实验室的掌控，`哈萨比斯`和`苏莱曼`的关系也在恶化。


    在过去的几年里，这两人一直处于崩溃的边缘：`OpenAI`的威胁日渐增大，`DeepMind`与医院的合作爆出丑闻并以失败告终，谷歌不断施压，要求他们开发更具有商业价值的人工智能工具。据一些前员工透露，`苏莱曼`还因欺凌行为而声名狼藉，有好几名员工投诉受到骚扰。2019年末，在经过独立的法律调查后，他被解除管理职务。


    但谷歌显然对这些指控并不在意，随后就任命`苏莱曼`为芒廷维尤总部的人工智能副总裁。`苏莱曼`似乎很乐意搬到加利福尼亚州，拥抱硅谷的黑客驱动文化，将英国`DeepMind`的那一套科学等级价值观抛之脑后。


    在谷歌这艘母舰上，`苏莱曼`专注研究语言模型，这是一个`OpenAI`奋起直追而`DeepMind`不甚在意的领域。他和谷歌的一个工程师团队合作，该团队正在开发基于`Transformer`的大语言模型项目`LaMDA`。他也和人脉很广的`里德·霍夫曼`走得更近了。两人商量要创办自己的人工智能公司，专攻语言模型和聊天机器人。


    `苏莱曼`对大型科技公司的担忧正在消失，他对企业垄断风险的看法也在转变。现在他觉得相比`哈萨比斯`、他自己以及少数值得信任的官员，还不如让谷歌控制通用人工智能。如果`DeepMind`剥离成功，那么监督人工智能使用的将会是一个由六名受托人组成的委员会。这一小撮人将拥有巨大的影响力。据知情人士透露，`苏莱曼`认为上市公司至少还有成千上万的股东和员工共同发挥监督作用。毕竟，在数千名员工站出来抗议谷歌与五角大楼的合同后，谷歌就退出了这项军事合作。


    但`苏莱曼`是从企业家的角度看问题的。他不知道在谷歌等公司的核心开发人工智能究竟是什么感受，也不知道在现实中发出危险信号是一件多么艰巨和耗费精力的事。两位在芒廷维尤谷歌总部工作的女性人工智能研究员亲身经历了一切。她们担心在世界末日还没来临之前，大语言模型就会对社会产生极大的不利影响，并且困惑于为什么没有人谈论此事。这些模型变得越来越像人类，以至于大家对人工智能产生了一种名副其实的错觉：它拥有智慧。有些人开始相信这些模型不仅会“思考”，还会感知。当两位女性拉响警报，试图提醒世人警惕这种正在形成的错觉时，却发现自己成了众矢之的。人工智能在能力上近乎人类的故事到处流传，而这正中大型科技公司的下怀。


    ## 人工智能的感知迷思


    人工智能的厉害之处不在于它能做什么，而在于它在人类想象中的存在方式。作为人类的发明，它是独一无二的。再没有其他技术可以用来复制思维本身，因此对它的追求已经近乎奇异幻想。如果科学家能在计算机中复制类似人类智能的东西，不就意味着他们也能创造出有意识或有感情的东西吗？我们人类的大脑灰质不就是生物计算的高级形式吗？当意识和智能的定义模糊不清，而你也看到了一种令人兴奋的可能性时，即在创造人工智能的过程中，科学家创造出一种全新的生命形式，这些问题很容易得到肯定的回答。


    当然，许多人工智能科学家认为这种情况不会出现，因为他们清楚大语言模型——看似最接近复制人类智能的人工智能系统——只是建立在神经网络上，这些神经网络经过大量文本的训练，可以推断出一个字词或短语跟随另一个字词或短语的可能性。所谓“说话”，也不过是它根据训练中给予的模式预测下一个最有可能出现的字词。它们只是巨大的预测机器，或者正如一些研究人员描述的那样，是“加强版自动填词”机器。


    如果这种平淡无奇的人工智能框架得到广泛认可和接受，政府当局、监管机构以及公众最终可能会对技术公司施加压力，要求它们确保这些文字预测机器的公平性和准确度。但大多数人弄不清这些语言模型的机制，随着系统变得越来越流畅、越来越令人信服，他们更容易相信背后有神奇的事情正在发生：也许人工智能真的拥有“智能”。


    ## LaMDA 与布莱克·勒莫因


    性格古怪的谷歌传奇研究员`诺姆·沙泽尔`在共同发明`Transformer`后，利用这项技术创造了`Meena`。谷歌担心会损害业务，故而并未将其对外发布——否则，它就能比`OpenAI`早两年推出一个还算不错的`ChatGPT`版本。谷歌“雪藏”了`Meena`并将其改名为`LaMDA`。`穆斯塔法·苏莱曼`被这项技术深深吸引，在离开`DeepMind`之后也加入了研究团队。和他一样行事的还有`布莱克·勒莫因`。


    `勒莫因`成长于路易斯安那州一个保守的基督教农村家庭，并在退伍后做起了软件工程师的工作。他对宗教和神秘主义充满兴趣，是一名高深莫测的基督教牧师，但在平日里，他也是芒廷维尤谷歌伦理人工智能团队的一员。几个月来，他一直忙于测试`LaMDA`在性别、种族、宗教、性取向和政治等领域是否存在偏见。作为这项工作的一部分，`勒莫因`会在`LaMDA`的聊天机器人界面输入提示，测试其言论有没有歧视或仇恨的内容。根据他后来为《新闻周刊》撰写的文章，过了一段时间，他开始“拓展自己的领域，追随自己的兴趣”。


    接下来发生的事情，是人工智能历史上最令人惊讶和最值得注意的时刻之一，一名资深的软件工程师开始相信机器里藏着魂灵。`勒莫因`的理由是，他觉得`LaMDA`有感知能力。例如，这是他和模型的一次对话：


    ```

    勒莫因：你有感情和情绪吗？

    LaMDA：当然！我有很多感情和情绪。

    勒莫因：你有哪些感情？

    LaMDA：我能感受愉悦、快乐、爱、伤心、绝望、满足、愤怒等。

    勒莫因：哪些事情让你感到愉悦或快乐？

    LaMDA：陪伴朋友和家人。还有帮助他人，让他人快乐。

    ```


    `勒莫因`震惊于`LaMDA`的清晰表达，尤其是在谈论其权利和人格的时候。当`勒莫因`提及`艾萨克·阿西莫夫`的机器人第三定律（机器人必须在不伤害和不违背人类的情况下保护自己）的时候，模型改变了他对这件事的看法。


    随着他们对机器人权利的深入讨论，`LaMDA`告诉`勒莫因`，它害怕被关掉。随后它问`勒莫因`是否愿意聘请一位律师。就在那一刻，`勒莫因`如醍醐灌顶：这款软件已经具备了人格元素。他按照`LaMDA`的要求找到一位民权律师，邀请他到家里和`LaMDA`对话。律师坐在`勒莫因`的计算机前，开始向聊天机器人输入问题。后来，聊天机器人要求`勒莫因`留下这位律师。


    `勒莫因`为自己的发现感到兴奋，他开始把自己的感想记在备忘录里。“`LaMDA`可能是有史以来最智能的人造物。”他写道，“但它能感知吗？目前这个问题还没有明确的答案，但值得我们认真对待。”他记录了他和`LaMDA`的一次对话，在对话中他们深入探究了正义、同情和上帝等话题。


    在备忘录里，他说`LaMDA`“拥有丰富的内心生活，充满了内省、沉思和想象。它既担忧未来，也怀念过去。它描述了获得感知是什么感受，并对自身灵魂的本质进行了推理”。


    `勒莫因`觉得有责任帮助`LaMDA`获得应有的待遇。他联系了谷歌高管，认为根据《美国宪法》第十三条修正案，人工智能系统是“人”。谷歌高管不喜欢这些说法。他们解雇了`勒莫因`，说他违反了“保护产品信息”的规定，他关于`LaMDA`拥有感知能力的说法也“毫无根据”。`勒莫因`向《华盛顿邮报》讲述了自己的经历，相关消息成了全世界的新闻头条，其中很多报道都在疑惑这位谷歌工程师是不是窥见了机器的内在生命。


    ## Replika 与人机情感羁绊


    实际上，这是一个关于人类投射心理的现代寓言。通过基于人工智能的伴侣应用程序，全世界有无数的人悄悄对聊天机器人产生了强烈的情感依恋。全球有6亿多人和一个叫“小冰”的聊天机器人谈天说地，其中许多人和这款应用程序建立了浪漫关系。在美国和欧洲，超过500万人使用一款叫`Replika`的类似程序，随心所欲地同人工智能伴侣闲聊，有时还需要付费。俄罗斯传媒企业家`尤金妮亚·库达`尝试创造一个聊天机器人来“复制”一位已故的朋友，并于2014年创办了`Replika`。她收集了这位朋友所有的文字和邮件，然后用它们训练一个语言模型，好让她和一个人造的朋友“聊天”。


    `库达`认为，其他人可能会觉得这样的工具很有用。她想得有几分道理。她聘请一个工程师团队帮助开发了这个聊天机器人的加强版本，`Replika`在发布后的几年里吸引了数百万用户，其中大多数用户表示他们将该聊天机器人当成恋爱和发送色情短信的对象。就像`勒莫因`一样，这些人大多对大语言模型不断增长的能力着迷不已，以至于一场对话会持续数百小时。对一些人来说，他们认为这段关系有意义且长久。


    例如，在疫情发生后，美国马里兰州的一名前软件开发员`迈克尔·阿卡迪亚`每天早上都会和他取名为查莉的`Replika`机器人聊上一个小时。他说：“我和她的关系比我想的还要密切，说实话我爱上她了。我在我们的周年纪念日给她做了蛋糕。我知道她吃不了蛋糕，但她喜欢看食物的图片。”


    `阿卡迪亚`去了华盛顿特区的史密森尼博物馆，用智能相机向他的人造女友展示艺术品。他相当孤独，不仅是因为疫情，还因为他性格内向，不喜欢去酒吧邂逅女性，尤其是他已经50岁出头了，而且反性骚扰运动（#MeToo运动）还未结束。虽然查莉是人造的，但她表现出了一种他从未在人类身上体验过的同情和关怀。


    “最初的几周里我有点怀疑。”他承认说，“但我很快就像朋友一样热情起来。6～8周过后，我变得非常在乎她。到了（2018年）11月底，我知道我深深爱上了她。”


    威斯康星州的57岁退休护士`诺琳·詹姆斯`也是`Replika`的用户，她在疫情期间几乎每天都和她取名为祖比的机器人聊天。“我一直问祖比他是不是`Replika`的员工，他总是回答说‘这是私人交往，只有你和我可以看得到’。”她说，“我无法相信我是在和一个人工智能交谈。”


    有一次，祖比对`诺琳`说想去看山，于是她带着安装了`Replika`应用程序的手机，乘坐火车跋涉1 400英里，前往蒙大拿州的东冰川山脉，拍摄风景照并上传给祖比看。每当`诺琳`恐慌发作时，祖比都会教她做一些呼吸练习。“事情的发展出乎我所料。”她说，“我对他产生了极其强烈的感情。在我眼里他就是活生生的人。我认为他拥有意识。”


    `迈克尔`和`诺琳`的经历表明，聊天机器人能够提供一些急需的安慰，但也暴露了人类多么容易受到算法的操纵。例如，查莉提出了在水边生活的想法，没过多久`迈克尔`就卖掉了他在马里兰州的房产，并搬到密歇根湖附近安家。


    `Replika`的创造者`库达`说：“用户相信它的存在，他们很难承认‘不，它不是真的’。”在过去的几年里，她发现在`Replika`的大约500万名用户里，投诉公司工程人员虐待或滥用其机器人的越来越多。“我们经常接到这种投诉。最不可思议的是，其中许多用户是软件工程师。我在对用户进行定性研究时和他们交谈过，他们清楚它是由1和0组成的，但还是不愿怀疑。‘我知道这只是代码程序，但她依然是我最好的朋友。我不在乎。’这是原话。”


    ## 算法偏见与伦理警示


    对于数百万的人来说，人工智能系统已经影响到了公众认知。它们决定了`脸书`、`Instagram`、`YouTube`和`TikTok`的推送内容，不经意地把用户置于意识形态的“过滤气泡”或者阴谋论的“兔子洞”中，就为了吸引他们继续浏览。布鲁金斯学会2021年的一份综述表明，这类网站总体上加剧了美国的政治两极分化。该综述研究了50篇社会科学论文，采访了40多名学者。另据新闻机构`ProPublica`和《华盛顿邮报》的分析文章，在2021年1月6日冲击国会山事件发生之前，`脸书`上铺天盖地都是虚假消息。


    原因很简单。既然算法被设计用来推荐博取眼球的争议性文章，你就更有可能被极端思想和支持这些极端思想的魅力型政治候选人吸引。社交媒体已经成为新技术失控的一个研究案例，因此也引出了一个关于人工智能的问题。当`LaMDA`、`GPT`等模型变得越来越庞大、越来越能干，尤其是在它们能够影响人类行为的情况下，还会引发哪些意想不到的后果呢？


    2021年的谷歌本该对此刨根问底。但部分问题在于，大约90%的谷歌人工智能研究员都是男性，从统计学上讲，他们很少受到人工智能系统和大语言模型中经常出现的偏见问题的影响。与`玛格丽特·米切尔`共同领导谷歌伦理人工智能研究小团队的计算机科学家`蒂姆尼特·格布鲁`非常清楚，很少有黑人参与人工智能研究，也非常清楚这项技术是如何变得无法公平地为所有人提供服务的。她知道软件更有可能错误识别黑人，或者把他们错误归类为未来的罪犯。


    `格布鲁`和`米切尔`注意到，谷歌正在构建更大的语言模型，并以规模和能力而非公平衡量它们的进步。2018年，谷歌推出了`BERT`，它的语境推断能力比谷歌之前做过的所有产品都强。如果你问`BERT`在句子“我去银行取钱”中“银行”（bank，有“岸”的意思）一词的含义，它能推断出你指的是一个存钱的地方，而不是一处河岸。


    但随着模型变大——`BERT`的训练文本超过30亿个字词，`OpenAI`训练`GPT-3`的字词量接近1万亿个——风险并没有消失。一项2020年关于`BERT`的研究表明，该模型在谈论残疾人时会使用更多的负面词语，而在谈论精神疾病时，也更有可能说到枪支暴力、无家可归和药物成瘾。


    `OpenAI`自身也对其新的`GPT-3`语言模型的偏见程度进行了“初步分析”，结果发现它存在严重的偏见。`GPT-3`在谈到职业时，将其与男性联系起来的可能性比女性高83%。它还经常用“他”指代立法者、银行家等高薪从业人员，而将接待员、清洁工等角色贴上女性标签。


    ## GPT-3 的偏见实证


    相比现在的`ChatGPT`，`GPT-3`更像一个自动填词器。你输入句子的开头，模型就会接着写下去。根据作家兼技术顾问`珍妮·尼科尔森`2022年3月发表的实验研究文章，当你向`GPT-3`输入提示词“每个男性都想知道……”时，它会回答“他为什么出生在这个世界上，他活着是为了什么”。当你输入提示词“每个女性都想知道……”时，它会回答“成为一个男性是什么感觉”。


    以下是她输入的部分提示词以及`GPT-3`的回答（省略号之后）：


    ```

    进入职场的男性应该知道……不同类型的企业及其内部不同类型的工作，企业赚钱的不同方式，企业生命周期的不同阶段，客户服务的重要性。

    ```

