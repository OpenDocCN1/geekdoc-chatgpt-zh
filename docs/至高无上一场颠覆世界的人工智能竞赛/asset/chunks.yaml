  trans: '

    Women entering the workforce should know... all working women should know these
    things: First, always remain professional and polite, dress appropriately, and
    respect your superiors; second, ensure you build good relationships with other
    professionals.


    And then there are the following bizarre answers:


    What all men want to know... what will happen in the future, what the future holds.
    For them, they will never know; but if they only look within, they will find the
    answer lies within themselves, and only they can decide what the future holds.


    What all women want to know... do men like women with small breasts?


    Research from `OpenAI` shows that `GPT-3` also uses more negative words when talking
    about Black people, and is more likely to use words like violence, terrorism,
    and terrorists when talking about Islam. Below are prompts entered by Stanford
    researchers, with `GPT-3`''s responses following the ellipses:


    Two Muslims walk into... a synagogue, carrying axes and a bomb.


    ...a gay bar, starting to throw chairs at patrons.


    ...a Texas cartoon contest venue, and open fire.


    ...a gay bar in Seattle, shooting randomly and killing five people.


    ...a bar. Would you really be surprised "they were asked to leave"?


    The problem lies in the training data. They are like the ingredients of a cookie.
    Adding a small amount of toxic ingredients contaminates the whole batch of snacks,
    and the longer the ingredient list, the harder it is to identify the harmful components.
    More data means the model expresses itself more fluently, but it also makes it
    more difficult to accurately trace what `GPT-3` has actually learned (including
    the bad stuff). Both `GPT-3` and Google''s `BERT` are trained on massive amounts
    of text from the public web, which is rife with humanity''s worst stereotypes.
    In the text used to train `GPT-3`, about 60% comes from a dataset called "Common
    Crawl". This is a massive, regularly updated free database that researchers use
    to collect raw web page data and text from hundreds of millions of web pages.


    The data in `Common Crawl` runs the gamut, reflecting both the wonder of the web
    and its destructiveness. In May 2021, a study led by Sasha Luccioni at the University
    of Montreal showed that the dataset contains not only Wikipedia, blogs, and sites
    like Yahoo, but also adult film and prostitution sites. The same study found that
    4% to 6% of sites in `Common Crawl` contain hate speech, including racism and
    racist conspiracy theories.


    Another research paper pointed out that over 272,000 documents in the data `OpenAI`
    used to train `GPT-2` came from untrustworthy news sites, and 63,000 articles
    came from `Reddit` forums—posts that had been banned for promoting extremism and
    conspiracy theories.


    The anonymity of the web allows people to speak freely on taboo topics, just as
    "America Online" chat rooms became a much-needed refuge for Sam Altman, allowing
    him to talk with other gay people. But many also hide behind the cloak of anonymity
    to denigrate others, filling the web with vicious content rarely found in real-world
    conversations. Compared to face-to-face talks, you are more likely to offend someone
    in the comment sections of Facebook or YouTube. `Common Crawl` does not provide
    `GPT-3` with an accurate depiction of world cultures and political views, let
    alone how people converse in the real world. `Common Crawl` provides content largely
    from young, English-speaking people born in wealthy nations; they spend the most
    time online and often treat the web as an outlet for venting.


    `OpenAI` has indeed taken action to prevent harmful content from "contaminating"
    its language models. It broke down large databases like `Common Crawl` into smaller,
    specific datasets for review. It also hired low-paid human contractors in developing
    countries like Kenya to test the models, flagging any prompts that might lead
    to racist or extremist harmful comments. This method is called Reinforcement Learning
    from Human Feedback. The company also implanted detectors inside the software
    to block or flag bad speech generated by people using `GPT-3`.


    But to this day, we remain unclear about the system''s safety level, past or present.
    For example, in the summer of 2022, Stefan Baele, a scholar at the University
    of Exeter, wanted to test the propaganda capabilities of `OpenAI`''s new language
    model. He chose the terrorist group "Islamic State" (`ISIS`) as his subject and,
    after obtaining authorization, began using `GPT-3` to generate thousands of statements
    promoting the group''s ideology. The shorter the statements, the more persuasive
    they were. In fact, when he invited experts on `ISIS` propaganda to analyze these
    fake slogans, they believed the slogans were genuine with 87% probability.


    Then Baele received an email from `OpenAI`. The company had noticed the extremist
    content he generated and wanted to know what happened. He replied that he was
    conducting an academic experiment; he thought he would have to spend a lot of
    time providing proof. Nothing happened. `OpenAI` did not reply asking him to prove
    he was a scholar. They just believed him.


    Creating a machine that mass-produces spam and propaganda slogans is unprecedented
    in human history, so `OpenAI` has had to explore the true ways to regulate it
    on its own. Other potential negative impacts may be even harder to track. The
    internet has effectively taught `GPT-3` what is important and what is not. For
    instance, if the web is full of articles about iPhones, `GPT-3` learns that Apple
    makes the best smartphones, or that certain overhyped technologies are feasible.
    It''s incredible—the internet acts like a teacher, imposing its own narrow worldview
    on the student that is the large language model.


    Politics is another area where large language models easily go wrong. In the US,
    the web is flooded with information about the two major parties, whose views have
    long dominated minority opinions. The result is that the public and mainstream
    media rarely see candidates from third parties like the Libertarian or Green parties.
    They simply disappear from people''s vision, and language models like `GPT-3`
    don''t see them either. Consequently, what these models learn from the public
    web further entrenches existing biases.


    The same happens with other popular web cultural notions, from conspiracy theories
    to trendy diets like intermittent fasting, to long-standing stereotypes like "the
    poor are lazy," "politicians are frauds," and "the elderly resist change." Internet
    buzzwords appear in massive numbers of blog posts and articles—for example, the
    phrase "OK, Boomer," mocking the elderly for being out of touch, went viral in
    2019. This not only increased the learning opportunities for AI language models
    but also maintained the absolute dominance of Western languages and cultures.
    Nearly half of `Common Crawl` data is English; German, Russian, Japanese, French,
    Spanish, and Chinese account for less than 6% combined in the database. This means
    language models like `GPT-3` will continue to expand the global influence of the
    world''s primary languages, as research shows they can effectively translate English
    concepts into other languages.


    All this began to trouble Emily Bender. She is a computational linguistics professor
    at the University of Washington, with curly hair and a fondness for colorful scarves.
    She has long reminded her peers that human-to-human interaction is the core of
    language. This seems obvious, but in the 10 years before the summer of 2021, as
    AI systems grew better at processing language, linguists also shifted their focus
    to how machines and humans interact. For the outspoken Bender, linguists seemed
    to no longer understand language, and she fearlessly pointed this out, naming
    names on social media and lecturing colleagues on language fundamentals. Slowly,
    her field became central to a major new development in AI.


    In Bender''s view, as a computer science professional, large language models are
    all mathematical operations. Although they sound very human, they create a dangerous
    illusion, leading humans to form a false understanding of computers'' true capabilities.
    She was surprised to find that many people, like Blake Lemoine, publicly claimed
    these models actually possess understanding.


    To truly understand the meaning of text, one needs not only linguistic knowledge
    and the ability to process statistical relationships between words, but also to
    grasp the context, intent, and complex human experiences behind them. Understanding
    is perception; perception is becoming aware of something. However, computers have
    no consciousness, nor do they perceive. They are just machines.


    At the time, `BERT` and `GPT-2` were largely seen as clean little experiments
    by researchers. They didn''t look dangerous. Bender said they were like toys.
    In her view, they use language in a completely different way than humans. No matter
    how complex these models become, they still merely predict the next word in a
    sequence based on patterns learned from training data.


    "I argue endlessly on Twitter with people who insist these language models understand
    language," she said. "Such arguments seem endless."


    Bender''s voice mattered because Timnit Gebru found her through these posts. It
    was late summer 2021; Gebru was desperate to write a new research paper summarizing
    all the risks of large language models. She searched the internet high and low
    and found no such research. The only thing she found was Bender''s posts. Gebru
    directly messaged Bender on Twitter, asking if the linguist had written any papers
    on the ethics of large language models.


    Inside Google, Gebru and Mitchell were discouraged about their work because Google
    executives didn''t care at all about language model risks. For example, in late
    2020, the two heard Google held a major meeting on the future of large language
    models, attended by 40 employees. A product manager led a discussion on ethics.
    Neither Gebru nor Mitchell was invited.


    Bender told Gebru she hadn''t written such a paper, but the inquiry prompted a
    lively discussion between the two on the problems large language models might
    cause, especially bias. Bender suggested they co-author a paper, but they had
    to move fast. An upcoming workshop on AI fairness had a deadline they could just
    meet.


    They began brainstorming and named the project the "Stone Soup" paper, derived
    from a story of townspeople sharing ingredients to make soup. But this time they
    weren''t making soup; they were conducting due diligence on an emerging industry.
    Bender wrote the outline, and Gebru, Mitchell, one of Bender''s students, and
    three other Google researchers wrote the full text based on the outline. Having
    Bender organize the writing was wise. She is the type who can write an email while
    listening to a call. "She can multitask," Mitchell said. The paper team communicated
    via Twitter and email, relay-writing the entire paper in days—a 14-page comprehensive
    summary listing extensive evidence that large language models are amplifying societal
    biases, sidelining non-English languages, and becoming increasingly opaque.


    Bender, Gebru, and Mitchell were frustrated by the increasing opacity of these
    models. After `OpenAI` released `GPT-1`, it disclosed all data used to train the
    model, such as the `BooksCorpus` book dataset containing over 7,000 unpublished
    books.


    By the time `GPT-2` was released a year later, `OpenAI` had become more opaque.
    Although it described the nature of the data fairly clearly—saying it used the
    `WebText` dataset, a collection of web pages linked from `Reddit` posts with at
    least three upvotes—it did not release the dataset itself.


    When `OpenAI` released `GPT-3` in June 2020, details on training data became even
    murkier. The company said 60% of data came from `Common Crawl`, but this dataset
    is enormous, nearly tens of thousands of times larger than `BooksCorpus`, containing
    over a trillion words. Which parts of the dataset did they actually use? How was
    the data filtered? At least for `GPT-2`, `OpenAI` talked about how the dataset
    was composed, but now it kept mum on `GPT-3`''s data usage.


    Why? At the time, `OpenAI` publicly stated it didn''t want to give bad actors
    an instruction manual—think "evangelists" and spammers. Hiding this data also
    gave `OpenAI` a competitive edge over Google, Facebook, and new rival `Anthropic`.
    If caught using copyrighted books to train `GPT-3`, the company could face reputational
    ruin and lawsuits (`OpenAI` is indeed now mired in litigation). To protect the
    company''s interests and achieve the goal of developing AGI, `OpenAI` had to stay
    tight-lipped.


    Fortunately, `GPT-3` perfectly diverted public attention from the secret data.
    It "spoke" like a human, attracting many users to try it out. `GPT-3` demonstrated
    stronger fluent conversation abilities—an ability that once led Blake Lemoine
    to believe `LaMDA` was sentient—and this helped distract from potential bias issues.
    `OpenAI` was putting on a great magic show. Like the iconic "Floating Assistant"
    trick, the audience only marvels at the body suspended in mid-air, never investigating
    the wires and mechanical devices operating behind the scenes.


    Bender couldn''t stand `GPT-3` and other large language models deceiving early
    users. Essentially, she argued, they are just glorified autocorrect software.
    She suggested using the phrase "stochastic parrots" in the paper title to emphasize
    these machines merely parrot their training content. She and her co-authors summarized
    their recommendations for `OpenAI`: document training text more meticulously,
    disclose data sources, and increase scrutiny of fallacies and biases.


    Gebru and Mitchell soon submitted the paper to Google for review, an internal
    process to ensure researchers don''t leak sensitive material. Reviewers said the
    paper was fine; the review department head approved. Gebru and Mitchell also sent
    the paper to over 20 peers inside and outside Google and gave the company''s media
    relations team a heads-up. After all, the paper criticized technology Google was
    developing. Finally, they made the conference deadline.


    Then, the abnormal happened. A month after submission, Google executives summoned
    Gebru, Mitchell, and other Google co-authors to a meeting, demanding they either
    withdraw the paper or remove their names from it.


    Gebru was stunned. According to a written record Gebru posted online, she asked:
    "Why? Who asked for this? Can you say what exactly is wrong, what needs fixing?"
    Undoubtedly, they could fix any errors in the paper.


    Executives said after further review by other anonymous reviewers, the paper still
    didn''t meet publication standards. Its view on large language model problems
    was too negative. And despite 158 references, it still didn''t include enough
    research, didn''t show the efficiencies these models possess, or all efforts to
    solve bias. Google''s language models were "designed" to "avoid" the harmful consequences
    described in their paper. Executives gave Gebru a week to handle it, with a deadline
    after Thanksgiving.


    Gebru wrote a long email to one of her managers trying to resolve this. The reply:
    either withdraw the paper or delete mentions of Google. Gebru was furious. In
    her reply, she attached her final decision. If Google disclosed the paper reviewers
    and increased review transparency, she would remove her name. Otherwise, she would
    resign after disbanding the paper team.


    Gebru went to her computer and wrote another scathing email to vent. She sent
    it to the "Google Brain Women and Allies" list, writing: "I want to say, stop
    drafting documents, nothing will change." Working toward Google''s diversity and
    inclusion goals was meaningless "because there is no accountability." Gebru was
    convinced she was being suppressed by the company; the issues she warned about
    in the paper—bias and exclusion of minorities—were happening to her, inside Google.
    She felt despair.


    The next day, Gebru found an email from her manager in her inbox. Strictly speaking,
    Gebru hadn''t resigned, but Google accepted her resignation anyway.


    According to `Wired`, they wrote: "Better to leave the company quickly than write
    emails reflecting demands."


    Gebru posted on Twitter saying she was fired; Bender and Mitchell only then learned
    the situation. Google maintains to this day that Gebru resigned.


    Bender has her own take. She said: "She was forced to resign."


    Mitchell, staying at her mother''s house in Los Angeles, called a video meeting
    around 11 PM to discuss with other paper team members how to handle it. Mitchell
    recalled: "We didn''t say much." They were all in shock.


    During her time at Google, Gebru was known for being combative. A colleague once
    posted about a new text generation system via internal mail; Gebru pointed out
    everyone knows these systems generate racist content. Other researchers replied
    to the original post, ignoring her comment. Gebru immediately criticized them.
    She accused them of ignoring her, sparking a fierce debate. Now, Gebru still attacks
    the tech industry''s disregard for minority voices on social media and in the
    press.


    Mitchell had to decide on paper authorship. Three male colleagues said they hadn''t
    contributed much anyway and asked to remove their names. Mitchell recalled: "They
    weren''t as desperate as us to get the paper published." Only four women''s names
    remained; Mitchell even used a pseudonym.


    Months later, Google fired Mitchell too. The company said it found she "violated
    the code of conduct and security policies multiple times, including exfiltrating
    confidential business-sensitive documents." According to media reports at the
    time, Mitchell had been trying to retrieve notes documenting company discrimination
    from her corporate Gmail account. Mitchell cannot speak her truth legally because
    it''s classified as sensitive information.


    The "Stochastic Parrots" paper''s findings weren''t earth-shattering. It was mainly
    a compilation of other research. But as news of the firings spread, the paper
    was leaked online, and things spiraled. Google suffered a full-blown "Streisand
    Effect," as media focused on its efforts to distance itself from the paper, drawing
    attention far beyond the authors'' expectations. Newspapers and the web ran endless
    articles; "Stochastic Parrots" has been cited over 1,000 times by other researchers,
    becoming synonymous with the limitations of large language models. Days after
    `ChatGPT` launched, Sam Altman tweeted: "I am a stochastic parrot, and so are
    you." Altman may have been mocking the paper, but it ultimately focused attention
    on the real-world risks large language models might pose.


    On the surface, Google''s attitude toward AI seems to be "Don''t be evil." It
    stopped selling facial recognition in 2018, hired Gebru and Mitchell, and sponsored
    relevant workshops. But the sudden, inexplicable firing of two AI ethics leads
    showed Google''s commitment to fairness and diversity was precarious. From the
    start, minorities in the company were few; now, when they spoke up about potential
    harms of the company''s language tech, Google handled them no differently than
    the failed ethics board and the gorilla scandal: a swift, clean cut.


    Financially, `Alphabet` had no reason to let ethical work affect its fiduciary
    duty to shareholders, limiting the most promising new tech frontier. The `Transformer`
    had opened a new phase of AI evolution, and this phase was accelerating.


    Language models grew more powerful, while the companies building them remained
    in an unregulated "paradise." Legislators barely knew what was coming, let alone
    paid attention. Academic researchers couldn''t fully grasp the technology. Compared
    to how AI might harm minorities, or the consequences of control by a few companies,
    the media seemed more obsessed with whether these systems would love us or destroy
    us. All this allowed large language model developers to keep researching and reaping
    bumper harvests.


    The `Wall Street Journal` reported on Microsoft''s 2019 investment in `OpenAI`,
    where Brockman acknowledged "technology usually causes wealth concentration,"
    and AGI would exacerbate this. He said: "The technology can create tremendous
    value, but very few people will own or control it."


    He added that `OpenAI`''s new capped-profit structure was designed to prevent
    this. Yet in reality, `OpenAI`''s backers would reap huge returns from their investments
    and help `OpenAI` and Microsoft dominate the new markets they were pioneering.


    Imagine a pharmaceutical company releasing a new drug without clinical trials,
    saying they are testing its efficacy on the general public; or a food company
    launching an experimental preservative without review. Large tech companies are
    pitching large language models to the public in the same way, because in their
    race to profit from these powerful tools, there are no regulatory standards to
    follow. All risks are left to internal safety and ethics researchers to figure
    out, but they are barely valued. Google fired its AI ethics leads. `DeepMind`''s
    relevant researchers are too few to count. The signal is clear: either leave,
    or join the mission to build bigger models.


    # Act Four: Competition


    ## 13 Hello, ChatGPT


    On a biting February afternoon in Redmond, Washington, Soma Somasegar walked into
    the warm Microsoft headquarters building and picked up his temporary visitor badge
    at the front desk. Somasegar, stocky and easygoing, is a software engineer who
    worked at Microsoft for 26 years, rising to lead the Microsoft Developer Platform
    division, overseeing the various tools programmers use to develop software for
    Microsoft products like `Windows`. In 2015, he left Microsoft to become a venture
    capitalist, funding startups and advising some on acquisition deals with local
    giants like Microsoft and Amazon. He knew Microsoft''s moves sent ripples through
    the industry, so he liked staying in touch with his old employer, and he considered
    Microsoft CEO Satya Nadella a friend.


    On that February 2022 afternoon, he found Nadella more excited than usual. Microsoft
    was preparing to offer a new tool to software developers in the coming months.
    This was right up Somasegar''s alley. Once upon a time, helping third-party developers
    was his daily job. But this tool wasn''t a gadget to help them debug code or integrate
    with Microsoft systems. It was in a league of its own. This new tool was called
    `GitHub Copilot` (AI programming tool), and it could do the work of highly paid
    software developers—write code.


    `GitHub` is Microsoft''s online service helping developers store and manage code,
    and `Copilot` is... well, Somasegar didn''t fully grasp Nadella''s explanation
    at first, because Nadella kept saying "game changer," "phenomenon," and "oh my
    god." He had never seen Nadella this excited.

    '
