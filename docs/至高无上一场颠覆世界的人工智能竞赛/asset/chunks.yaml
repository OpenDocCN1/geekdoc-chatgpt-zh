    ![封面图片](img/cover.jpg)


    # 版权页


    书名：至高无上：一场颠覆世界的人工智能竞赛

    作者：[美]帕米·奥尔森

    出版社：中信出版社

    出版时间：2025 年 07 月

    ISBN：9787521776775

    字数：201 千字


    献给马尼


    # 序言


    翻阅本书前几页，你或许会怀疑这并非人类所著。


    这无妨，我并不介意。


    若是放在两年前，你根本不会产生这种念头。但眼下，机器生成的文章、书籍、插画乃至计算机代码，已与人类创作难分伯仲。还记得乔治·奥威尔在反乌托邦名著*1984*中描绘的“小说制造机”和“流行歌曲制造器”吗？如今这些皆已成真。科技演进快得令人措手不及，大众不免忧虑：如今的白领阶层，会不会在未来一两年内面临失业？海量脑力劳动者的处境瞬间变得岌岌可危，才华横溢的年轻插画师纠结于是否还需前往艺术学院深造。


    值得注意的是，这一切发生得如此之快。我深耕科技行业写作十五载，从未见过哪个领域能像过去两年的人工智能（AI）这般飞速发展。2022 年 11 月发布的 ChatGPT（聊天机器人模型）引发了一场创造全新人工智能的竞赛，这种
    AI 不仅能处理信息，更能生成信息。彼时，AI 工具只能生成歪歪扭扭的狗的图像；而今，它们能大量生成唐纳德·特朗普的照片，且逼真到毛孔、皮肤纹理清晰可见，几乎难辨真伪。


    许多人工智能缔造者认为这项技术有望开辟通往乌托邦的道路，另一些开发者则断言它可能导致人类文明崩溃。实际上，我们都被科幻小说般的情节遮蔽了双眼，未曾留意 AI
    正在对社会造成实质危害，如固化种族主义、威胁创意产业等。


    在这股无形力量的背后，寥寥数家公司已掌控 AI 发展大权，并竞相使其更强大。受永不满足的增长欲望驱使，它们投机取巧，在产品层面误导公众，成为问题重重的 AI“管家”。


    历史上从未有组织能像今日科技巨头这般，聚拢如此巨大的权力，影响如此众多的人。谷歌为全球 90%的互联网用户提供网络搜索服务，而 70%的电脑用户使用微软软件。但两家公司都不满足现状。微软想从谷歌价值
    1500 亿美元的搜索业务中分一杯羹，谷歌想夺走微软价值 1100 亿美元的云业务。为了击败对方，两家公司都汲取了其他公司的创意——这归根结底意味着 AI
    的未来仅由两个人书写：萨姆·奥尔特曼和德米斯·哈萨比斯。


    奥尔特曼身材瘦削、性格温和，年近 40 岁，穿运动鞋上班；哈萨比斯年近 50 岁、痴迷游戏、前国际象棋冠军。他们皆是智商极高、极具魅力的领袖，共同勾勒出了全能
    AI 的蓝图。这些图景振奋人心，以至于追随者们对两人顶礼膜拜。他们一心想赢，所以才能成功。奥尔特曼为世界带来了 ChatGPT，而哈萨比斯则加速了该技术的落地进程。他们的经历不仅定义了当下的
    AI 竞赛，也揭示了我们将面临的挑战，其中之一便是如何在行业巨头的控制下，艰难地引导 AI 向善发展。


    在科学界普遍不看好的情况下，哈萨比斯创办了 DeepMind（深度思考），这是世界上第一家致力于开发像人一样聪明的 AI 的公司。他希望在生命起源、现实本质和疾病治疗等方面实现科学突破。他说：“发现智能的本质是解决其他问题的前提。”


    几年后，奥尔特曼创办了 OpenAI（美国人工智能研究公司）并进行同样的尝试，但他更注重为人类带来经济富足，增加物质财富，帮助“我们所有人过上更好的生活”。他告诉我：“这是人类迄今为止创造的最伟大工具，让我们每一个人都能超越自己。”


    他们的野心甚至超越了硅谷最疯狂的空想家，计划开发强大到足以改变社会、颠覆经济和金融体系的 AI。而奥尔特曼和哈萨比斯将成为赋能者。


    这或许是人类最后一项发明。开发过程中，两人都努力思索如何控制这项革命性技术。起初，他们认为谷歌、微软等科技巨头不该完全掌控这一领域，因为它们将利润置于人类福祉之上。因此，多年来，他们各自在大西洋两岸摸索建设研究实验室的新方法，以保护
    AI 向善发展。他们承诺要做 AI 的守护者。


    然而，两人都想争第一。为了开发有史以来最强大的软件，他们需要资金和算力，硅谷是最好的资源聚集地。随着时间的推移，奥尔特曼和哈萨比斯发现他们终究离不开这些科技巨头。尽管创造超级
    AI 的努力渐渐取得成效，但令人不安的新思想也从四面八方袭来，他们做出了妥协，放弃了崇高的目标，将控制权交给了那些急于向公众出售 AI 工具且严重缺乏监管的公司，这产生了深远影响。AI
    领域的权力集中会导致竞争萎缩，带来对私人生活的新型侵扰，并滋生新形式的种族偏见和性别偏见。现今，若让流行 AI 工具生成女性形象，她们往往性感、衣着暴露；CEO
    形象多为白人男性；罪犯形象则经常是黑人男性。这些工具正被安装进我们的媒体订阅专栏、智能手机和司法系统，而未考虑它们会如何影响公众舆论。


    这两人的经历与 19 至 20 世纪互相角逐的企业家托马斯·爱迪生和乔治·威斯汀豪斯别无二致。爱迪生和威斯汀豪斯都想实现一个梦想，即创造一个为数百万消费者供电的主导系统。他们都从发明家转型成了企业家，也都明白自己的技术总有一天将赋能现代世界。但问题在于：谁的技术会脱颖而出？最终，由威斯汀豪斯提出的更高效电力标准受到了全世界欢迎。但他并未在所谓的“电流之战”中获胜，获胜的是通用电气。


    在公司利益驱使下，奥尔特曼和哈萨比斯推出了规模更大、能力更强的模型，科技巨头们也成为最后的赢家，只不过这次竞赛是复制人类自己的智能。现在，世界正走向混乱的边缘。生成式
    AI 有望提高人类生产力，通过 ChatGPT 等工具给我们带来更多触手可及的有用信息。但每一项创新都要付出代价。企业和政府正在适应新现实：真实与 AI 生成之间几乎没有差别。企业投入巨资，指望
    AI 软件取代员工并提高利润率。一种新的个人 AI 设备正在出现，将个人监控提高到了难以置信的新水平。


    本书后半部分阐述了这些风险，但首先我要解释一下我们是怎么走到这一步的，以及两位创新者想让 AI 向善发展的愿景是如何最终被垄断力量摧毁的。他们的故事充满理想主义、天真与自我，但也表明在科技巨头和硅谷炮制的泡沫中，伦理准则几乎不可能被遵守。奥尔特曼和哈萨比斯在
    AI 治理问题上乱作一团，他们明知要想避免这项技术造成不可挽回的伤害，世界就要负责任地进行管理，但如果没有世界上最大的科技公司提供资源，他们就无法打造出拥有神一般力量的
    AI。他们以改善人类生活为目标，最终却将权力交给了某些公司，让人类的幸福和未来陷入企业的霸权之争中。这就是事实真相。


    # 第一幕 梦想


    ## 1 孤勇高中生


    萨姆·奥尔特曼知道他应该沉默不语。在保守的密苏里州圣路易斯市，无人会谈论自己的性取向。在 21 世纪初，美国其他地区正为争取同性恋权利奔走，但奥尔特曼的家乡相对落后，同性性行为仍属犯罪。像他这样隐约感觉自己是同性恋的青少年，往往会在沉默中寻求安全感。奥尔特曼则不同。他一定要说出来，这不是因为他想向人们坦白一切，而是因为谈论同性取向将成为一项使命。


    作为高中生，奥尔特曼给人一种无法用标签界定的独特气质。他拥有学霸的头脑，运动员的魅力。做英语文学作业时，他会挑战模仿福克纳；数学考试中的微积分难题，他能轻松破解。放学后，他要么跳进泳池以水球队队长身份发号施令，要么回家和朋友们玩上几个小时电子游戏。晚餐时分，他热衷于和两个弟弟（马克斯、杰克）谈论太空旅行与火箭飞船；一起玩《武士》等棋盘游戏时，奥尔特曼会毛遂自荐当领袖。总的来说，他喜欢掌控一切。


    奥尔特曼成长于一个中产犹太家庭，母亲康妮是皮肤科医生，父亲杰里是律师。杰里助力推动了圣路易斯市经济适用房建设和历史建筑改造，这些行为助力其子树立起公益观念。奥尔特曼清晰记得，有一天杰里带他去办公室，告诉他即使没有时间帮助别人，“也要想想该怎么做”。


    作为家中四个孩子的老大，奥尔特曼极其自信，并拥有令人佩服的胆识。他公开谈论自己的性取向，而他的同龄人和 20 世纪 90 年代末出生的孩子往往秘而不宣。他总做一些大部分中西部人认为“不好”的事，并让每件事看起来都很酷，原因之一就是他想帮助像他一样的人。


    这份使命感源自互联网。在登录门户网站“美国在线”的过程中，奥尔特曼意识到像他一样的人有很多。登录“美国在线”聊天室是件奇妙的事：调制解调器与互联网建立安全连接时会发出拨号音和表示联络的“哔哔”声，刺耳的声音听上去就像坏了的收音机。连接成功后，面对多样的聊天室和无限的可能性，你会心跳加快。在这里，你可以通过电脑与世界另一端的有趣灵魂交谈。聊天室的名字可能叫“海滩派对”，也可能叫“早餐俱乐部”。一些大聊天室里人满为患、吵吵嚷嚷，但在一些诸如“宠物爱好者”“X
    档案迷”“同性恋者”的小聊天室里，交谈则流畅很多。


    对于像奥尔特曼一样的同性恋者来说，这些聊天室好比救命稻草。你可以隐匿在网名背后，从别人的谈论中了解哪些地方对性少数群体比较友好。在感觉自己与世界格格不入的情况下，奥尔特曼从聊天室里获得了归属感。他后来在接受*纽约客*杂志专访时说：“对于十一二岁的少年来说，保守秘密是一种负担，‘美国在线’聊天室是一个很好的宣泄渠道。”


    到 1999 年，也就是奥尔特曼 14 岁时，“美国在线”聊天室中有 1/3 关注同性恋话题，对性少数群体意义重大。他在 16 岁时向父母“出柜”。母亲非常震惊，她后来对*纽约客*杂志描述说儿子似乎一直都是“无性恋和科技迷”，但这些标签似乎也不完全符合他。例如，美国人喜爱烤肉，而奥尔特曼是素食主义者。他痴迷电脑，但并不孤僻，也不“社恐”。别人都在听
    20 世纪 90 年代的流行乐，他却青睐古典音乐。


    奥尔特曼夫妇将早熟的儿子转到了约翰·巴勒斯中学。这是一所位于圣路易斯市郊区的私立精英学校，占地广阔，绿树成荫，致力于为“人类社会的进步”培养学生。


    他尽可能多地担任领导角色。除了水球队队长身份，他还编辑年鉴，在学校集会上发表演讲。他与教师打交道，偶尔也会违反规定，引发关注。在一年一度的秋季赛前动员大会上，奥尔特曼和水球队队员们脱掉上衣，只穿着泳裤站在台上，笑嘻嘻地看着观众起哄和欢呼。


    他因此惹怒了学校的体育指导，受到了责罚，但他并未善罢甘休，也未向朋友甚至任何一名老师抱怨，而是勇往直前、奋起反击。他敲响了校长办公室的门，校长安迪·阿博特是一位举止优雅的前英语教师。年长的教育者被这个身材瘦长、黑发大眼的少年所吸引，后来奥尔特曼经常到校长办公室，要么发表意见，要么抱怨他打算写进学生报纸的不公现象。


    阿博特发现，这个年轻人丝毫不畏惧权威。只要阿博特校长做出一个不得人心的决定，影响了其他学生，这个孩子就会担起“救世主”的责任。“他会反对，”阿博特校长回忆道，“然后摆事实讲道理。”直到今天，这位轻声细语的教育者仍认为奥尔特曼是“我认识的最聪颖的孩子”。


    这种认真的态度，加上率直且愿意展现脆弱的性格特质，使这名年轻人赢得了技术界和政界一些大人物的青睐。无论面对投资者、媒体，还是一些世界上最具影响力的首席执行官，他都用严肃的目光恳求他们支持一项伟大的事业。久而久之，奥尔特曼明白了一个道理：掌权者可以帮助自己实现抱负，就像高中时阿博特校长对待他一样。


    他在学校干了一件大事，那就是把“美国在线”聊天室搬到了线下。他走完了学校的烦琐程序，得到了校长同意，创建了学校首个性少数群体支持小组。它就像地下网络，学生们可以去寻求帮助或认识同类人。一年内，十几名学生加入了该小组。


    但奥尔特曼并不满足。他开始接近教师，请求他们在门上张贴表明课堂接纳同性恋学生的标签，努力将教师们拉入同一阵营。最终，他创办了“同性恋-异性恋联盟”组织，旨在提高公众对同性恋权利的认知。


    他决定在学校的晨会上造势。联盟成员早早进入大厅，提前在学生们的座椅上放置了一系列数字卡片。奥尔特曼走到话筒前，请坐在某张特定数字卡片上的学生起立。大约有 60
    个学生站了起来。“看看你们周围，”他对观众说，“1/10，这就是学校里认为自己是同性恋的人数比例。”


    这场展示十分大胆，但也有冒犯之处。几名学生离开了观众席，而他们碰巧都是学校基督教社团的成员。事后奥尔特曼得知，这些学生以留在家中或待在教室的方式抵制他的演讲。这些学生公然反对他的主张，让他怒火中烧，于是他再次走进阿博特校长的办公室，要求将这些基督徒按旷课处理。


    “让他们提高认知并没有什么害处。”少年争辩道。他没有拍打桌子，但严肃的语气和表情都说明他非常生气。


    “有一段时间我试图自圆其说，”阿博特校长回忆道，“但我想他可能是对的。”


    奥尔特曼高中毕业时，也学到了重要的一课。如果你表现得雄心勃勃，总有人会憎恨你。解决办法是，你要与那些权贵显要站到一起，并在你周围建立支持网络。


    不久后，奥尔特曼就被位于加利福尼亚州硅谷中心地带的斯坦福大学录取了。硅谷阳光灿烂，汇聚着优秀的软件工程师和科技企业家，科技初创公司林立。尽管对编程抱有兴趣且已被计算机科学专业录取，但这个
    18 岁的瘦高男孩无法忍受只专注于一门学科。他对一切都很着迷。他选修了大量人文课程和创意写作课程。


    在课余时间，他会驱车向南行驶 20 分钟去上一些课程，这些经历对他日后成为一名享誉全球的企业家至关重要。他会在圣何塞市一家很受欢迎的小赌场玩几小时扑克，磨炼心理操纵和心理影响能力。玩扑克的重点是观察对手，有时还要刻意引导他们对牌况的判断。奥尔特曼成为虚张声势、察言观色的高手，他用赢来的钱支付了求学期间的大部分生活费用。“没钱赚我也愿意玩扑克。”他后来在一档播客节目中说，“我爱死玩扑克了。我强烈建议大家通过玩扑克来了解世界、商业和人类心理。”


    奥尔特曼日后用以改变世界的专业领域，也包含在他的学位课程之内。他成为斯坦福大学人工智能实验室的一名研究员。人工智能实验室只占据了广阔校园的一小块地方，里面装满了电缆和奇怪的机械臂。实验室刚刚重新开放，负责人是塞巴斯蒂安·特龙——一位操着柔和德国口音、目光如炬的蓝眼睛激进派计算机科学家。作为新一代学者，特龙并不满足于将时间花在撰写拨款申请和等待终身教职上，而是选择与科技巨头合作。斯坦福大学校园距离谷歌总部仅
    5 英里 ^(¹)


    在课堂上，特龙教授有关机器学习的课程。机器学习是一种技术，即计算机从人类提供的大量数据中推理概念，而不是按照程序编写去执行特定任务。该概念对 AI 领域至关重要，即使“学习”一词存在误导风险，因为机器并不能像人类一样思考和学习。特龙注意到，这个来自圣路易斯市、一脸认真的孩子对
    AI 产生意外后果的可能性很感兴趣。如果 AI 学会做不对的事情，结果会怎样？


    特龙解释说，为了实现“适应度函数”或目标，AI 系统可能会采取出乎意料的行为方式。假如一个 AI 的目标被设计成生存和繁殖，那么它可能会在无意中消灭地球上的所有生物。特龙表示，这并不意味着
    AI 就是坏东西。它只是没有意识到事情的严重后果。它的动机和我们洗手的动机没有什么不同。我们并不讨厌皮肤上的细菌，也不想消灭它们。我们洗手只是想让手保持干净。


    有段时间奥尔特曼一直在思考这个观点。作为科幻小说爱好者，他想知道这是不是人类从未与外星生命取得联系的原因。也许外星生命早已创造出了 AI，但接着就被他们的创造物消灭了。要想避免这种风险，就得在有人开发出危险的
    AI 之前，创造出更安全的 AI。


    这一想法在奥尔特曼的脑海里埋下了种子，经过十多年的孕育，才开花结果，诞生了 OpenAI。但在当时它还太过宏大，超出了奥尔特曼的能力范围。特龙等学者开发了
    AI 系统。斯坦福大学的学生创办了谷歌、思科、雅虎等公司。这位年轻的计算机高手也想大干一场，他只缺少一个商业创意。灵感闪现在他走出教室的时候。“如果我打开手机就能看到一张电子地图，显示所有朋友的位置，那不是很好吗？”他问自己的同学兼好友尼克·西沃。


    如果他为手机开发一款可以找到朋友的电子地图软件，并以此作为公司的主要产品，结果会如何？但是创办一家公司并不容易。你需要从风险投资机构那里筹集资金，尽管距离斯坦福大学
    3 英里之内就有几十家这样的机构，但奥尔特曼年轻且缺乏经验。他得到的回应来自美国东北部。在马萨诸塞州剑桥市，一位年长的科技界大佬正在为年轻的企业家开办他所谓的“新兵训练营”。奥尔特曼和西沃决定去参加为期
    3 个月的 Y Combinator（美国创业孵化器）项目，并开办一家初创公司。Y Combinator 将会成为有史以来最成功的创业孵化器，它孵化了价值
    4000 亿美元的科技公司，包括爱彼迎、Stripe（在线支付服务商）、Dropbox（多宝箱）等。


    当时，19 岁的奥尔特曼对此一无所知。硅谷的大多数投资者认为 Y Combinator 是一个愚蠢的黑客夏令营。其创始人保罗·格雷厄姆是一名穿着工装短裤的
    41 岁计算机科学家，他把自己的电子商务公司卖给雅虎后成了百万富翁。在获得财富后，格雷厄姆将自己打造成思想领袖，在网站上发表文章讨论软件之外的话题，从经济学到生孩子，从言论自由到高中学校里的“书呆子”，不一而足。


    但格雷厄姆最受欢迎的文章还是关于创业的，像奥尔特曼这样的年轻人会端端正正地坐直，全神贯注地阅读，给予他精神领袖一般的待遇。这些文章一再强调，创业者的素质比什么都重要。创办一家成功的科技公司，并不需要一个绝妙的创意，只需要找到一名优秀的掌舵人。


    “例如，谷歌最初的计划不过是创建一个不那么糟糕的搜索网站。”格雷厄姆写道。但请看看现在的结果。灵感转瞬即逝。真正重要的是创始人，而最优秀的创始人则是黑客——那些愿意打破常规思维去创造新事物的程序员。他写道，作为一名黑客，“你的工作效率可能是随便找家公司工作的
    36 倍”。


    在硅谷创办科技公司甚至被视为一种爱国行为，因为它体现了美国开国元勋顽强的个人主义精神。“黑客天性叛逆。”他写道，“这就是黑客精神的本质，也是美国精神的精髓。硅谷出现在美国而不是法国、德国、英国或日本，并非偶然。后面这些国家的人更加循规蹈矩。”


    格雷厄姆传授经验称，创业这条路其实不难，用最小的财力创建公司，从最小的可行产品开始，然后不断优化。不要把摊子铺得太大，因为 10 个人的热爱比上千人的喜欢更好。不要害怕在前进的道路上打破常规。事实上，为什么不改写社会的游戏规则呢？


    格雷厄姆的观点最终在硅谷引起巨大共鸣，并催生了一种风气，即创业者提出了神圣的愿景，应该允许他们像神一样随意行事。这就是为什么谷歌和脸书的创始人能够以现代商业独裁者自居，经常掌握着公司的多数投票权，有时还会把公司带向奇怪的方向。（一个典型的例子是，脸书的董事会或股东对于马克·扎克伯格奇怪而代价高昂的决定——将公司转型为虚拟现实公司——毫无异议。）得益于所谓的双重股权结构，许多科技初创公司的创始人，包括爱彼迎和
    Snapchat（色拉布）的幕后大佬，都能对他们的公司保有这种非同一般的控制权。格雷厄姆等人认为，创始人有充分的理由拥有这种权力。既然聪明绝顶、才华横溢的人提出了长期愿景，他们就需要充分的自由来实现它。


