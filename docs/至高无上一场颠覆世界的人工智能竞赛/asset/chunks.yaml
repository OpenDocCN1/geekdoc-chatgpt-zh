  trans: '

    为了写书以及探讨过去几年《彭博观点》专栏、《华尔街日报》和《福布斯》杂志对新的人工智能热潮的报道，我与数百名行业专家、企业家、风险投资家、科技公司的员工以及前员工进行了交谈，这些都对我产生了极大的启发。


    为了弄清事情的细节，我利用跑步时间收听了无数小时的播客访谈，访谈对象包括萨姆·奥尔特曼、德米斯·哈萨比斯、伊尔亚·苏茨克维、格雷格·布罗克曼，以及许多其他参与创建
    OpenAI 和 DeepMind，或者见证人工智能从“科学死水”发展成为蓬勃商业的研究人员。这意味着我常常要停下来在手机上输入资料，但这是值得的。


    # 参考文献 [1]


    ## 1. 孤勇高中生


