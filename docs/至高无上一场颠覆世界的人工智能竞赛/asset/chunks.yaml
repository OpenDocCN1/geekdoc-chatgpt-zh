    # 14 不祥的预兆


    ## 谷歌搜索霸主地位的动摇


    但现在，谷歌维持了 20 多年的搜索引擎霸主地位开始动摇。多年来，它主要依赖一套系统盈利：该系统抓取海量网页，将其编入索引并排序，以找到与查询最相关的答案，最后生成一个可点击的链接列表。但
    `ChatGPT` 为忙碌的网民提供了更具诱惑力的东西——综合所有信息的单一答案。用户无需无休止地翻页，也无需在广告与链接的迷宫中搜寻。有了 `ChatGPT`，一切迎刃而解。


    以“甜炼乳与无糖炼乳哪种更适合做南瓜派”为例。`ChatGPT` 会给出详细解答，指出甜炼乳更佳，因为做出的南瓜派更甜。谷歌则会吐出一长串广告、食谱及相关文章链接，用户必须四处点击阅读。无限的可能性曾是谷歌的傲人资本，如今却成了浪费时间的祸根。硅谷技术专家一直追求“无障碍”的在线体验。但无障碍搜索却给谷歌带来了潜在的财务危机。


    ## 谷歌内部的“红色预警”与商业模式困境


    `ChatGPT` 推出几周后，谷歌高管在公司内部发出了“红色预警”。固步自封的谷歌已明显落后。自 2016 年起，首席执行官桑达尔·皮查伊就一直宣称谷歌是“AI
    优先”。那么，一家不足 200 名 AI 研究员的小公司，怎么会在产品开发上强于拥有近 5000 名 AI 研究员的谷歌？同时，`OpenAI` 与财大气粗的微软结盟，使这种威胁更加严峻。


    谷歌也有自己的语言模型 `LaMDA`，虽开发较早，但公司工程师认为它具备感知能力。谷歌高层进退维谷。尽管推出 `LaMDA` 可挑战 `ChatGPT`
    地位，但若用户用它取代谷歌搜索怎么办？这意味着他们不会点击广告、赞助链接，也不会访问其他使用谷歌广告网络、推动其利润增长的网站。


    2021 年，`Alphabet` 营收 2580 亿美元，其中 80% 以上来自广告，这些广告大多按用户使用其搜索引擎时的点击量收费。这些挤占谷歌搜索结果页面的广告对其业务至关重要。因此，谷歌不可能改变现状。“谷歌搜索的目标是让你点击链接，最好是广告链接。”2013—2018
    年负责管理谷歌广告与商业业务的斯里德哈·拉马斯瓦米说，“页面上的其他文字可有可无。”


    谷歌长期以来对新技术抱着谨慎甚至恐惧的态度。除非业务规模达到 10 亿美元，否则它就“无动于衷”。它可不想影响自家每年近 2600 亿美元的广告业务。


    “规模越大，困难越多。”拉马斯瓦米说，“谷歌的广告团队规模是自然搜索团队的 4～5 倍。背离核心商业模式去开发一款产品，在现实中很难做到。”


    ## Bard 与必应的仓促发布及“幻觉”问题


    然而，谷歌高层如今已别无选择。《纽约时报》刊登的一次会议记录显示，有位管理人员讽刺地指出，像 `OpenAI` 这样的小公司似乎并不怎么担心公开发布新的超级
    AI 工具会造成什么后果。谷歌必须及时跟进，否则就会被后浪拍死在沙滩上。抛开谨慎，一切高速运转起来。


    惊慌的高管们要求员工致力于 `YouTube`、`Gmail` 等拥有 10 亿以上用户的关键产品，他们只有几个月时间来构建某种形式的生成式 AI。多年来，谷歌一直是世界的索引汇编机器，负责处理视频、图像和数据，但现在它必须开始使用
    AI 创造新数据。而进行这种根本性的转变，就像驾驶一辆时速仅 20 英里的老爷车参加赛车比赛。谷歌高层对此感到非常绝望，他们召开了一系列紧急会议，请求谷歌创始人拉里·佩奇和谢尔盖·布林（他们于
    2019 年辞去 `Alphabet` 联合首席执行官职务）出席会议，帮助寻找应对 `ChatGPT` 的办法。


    公司工程师团队感受到了谷歌高层的强烈不安，最终完成了任务。`ChatGPT` 推出几个月后，`YouTube` 新增了一项功能，该网站的视频创作者可使用生成式
    AI 创造新的电影场景或替换服装。但这多少给人一种“死马当活马医”的感觉。是时候亮出他们的秘密武器 `LaMDA` 了。


    皮查伊向全公司发送了一份备忘录，要求员工协助测试即将公开发布的新款聊天机器人，并改写他们认为不好的回答。2023 年 2 月 6 日，他发表博文称，新产品已在路上。他在这篇题为《我们
    AI 之旅的重要下一步》的文章中写道：“我们一直在研究由 `LaMDA` 提供支持的实验性对话式 AI 服务，它的名字叫 `Bard`。”


    为了保持领先地位，微软在第二天发表声明，称其搜索引擎产品必应（`Bing`）将迎来大规模 AI 升级。`Bing` 增长停滞，仅占在线搜索引擎市场份额的 6%。`OpenAI`
    最新的 `GPT` 语言模型将推动 `Bing`“开启发现的喜悦，感受创造的奇迹，更好地利用世界知识”。换句话说，它具备与 `ChatGPT` 相同的功能，而且在微软不愿透露的方面还有一定程度的改善。


    两大巨头竞相发布 AI 产品让世界惊叹不已，直到几位密切关注的人士注意到某些小问题。谷歌和微软分别发布了一些对话示例，以证明 `Bard` 和 `Bing`
    能够聪明地回答问题。但当几位记者反复核实其中一些答案时，却发现它们是错的。在皮查伊展示的一个发布视频里，`Bard` 弄错了有关詹姆斯·韦布望远镜的历史事实，而微软的
    `Bing` 则误判了 `Gap`（服装饰品零售商）的部分盈利数据。


    这些聊天机器人不仅会传递错误信息，还会诱发某种情绪障碍。就在微软宣布升级后不久，《纽约时报》撰稿人凯文·鲁斯发表了一篇专栏文章，记述了某天深夜 `Bing`
    与他之间令人不安的两小时谈话。在谈话中，微软的新搜索引擎变成了聊天机器人并向鲁斯表白，坚称“你的婚姻并不幸福”。鲁斯写道，这次遭遇带给他一种“不祥的预感，AI
    已经发展到了新阶段，世界也将永远改变”。


    在微软统帅纳德拉眼中，这些对 `Bing` 的炒作和关注都是嘲讽对手的好机会。他告诉一名面试者说，多年来他一直在等待挑战谷歌搜索引擎霸主地位的机会，现在 `Bing`
    终于可以实现这一目标了。“我想让大家知道，是我们让他们急得团团转。”他补充说。


    ## 谷歌的早期领先与追赶困境


    这件事从一开始就说不通。谷歌明明一马当先。研究人员发明了 `Transformer`，并在 `GPT-4` 问世前几年就开发出先进的语言模型 `LaMDA`。其
    AI 实验室 `DeepMind` 早在 `OpenAI` 成立 5 年前就开始担起构建通用人工智能的使命。然而，谷歌现在却要奋力追赶。


    谷歌内部的官僚主义日益严重，加上担忧其业务和声誉受损，谷歌由此陷入了根深蒂固的惰性思维。荒谬的是，这反而保护世界远离了 `OpenAI` 现在带来的风险，这些风险最有可能影响少数群体，并导致大量工作岗位流失。


    `OpenAI` 引起的轰动也让 `DeepMind` 过去 13 年的研究成果受到质疑。哈萨比斯对此火冒三丈。一名前员工回忆道，`ChatGPT` 推出几周后，他在一次全体会议上告诉员工，`DeepMind`
    不该成为“AI 领域的贝尔实验室”，手握各种发明，却眼睁睁看着别人将自己的想法商业化。


    与此同时，民众对通用人工智能的兴趣不再。他们开始关心有用的、像人类的 AI。尽管 `DeepMind` 成功开发出可以在围棋和其他游戏中击败人类冠军的 AI
    系统，但不知为何大家更青睐由 `OpenAI` 创造的只会写电子邮件的系统。


    ## DeepMind 与 OpenAI：科学派与工程派的分野


    德米斯·哈萨比斯长期追求的科学化策略开始显得狭隘。他试图借助游戏和模拟创建通用人工智能，借助奖项和在科学期刊上发表论文的声望衡量公司研究的成功。`OpenAI`
    对 AI 的开发遵循工程原理，并尽可能扩展现有技术。而 `DeepMind` 则更加学术化，先后发表了论述阿尔法围棋游戏系统和阿尔法折叠（`AlphaFold`）的研究论文，`AlphaFold`
    是一种可以预测人体内蛋白质如何折叠的新方法。


    ## AlphaFold：科学荣誉与现实应用的差距


    `AlphaFold` 诞生于 2016 年 `DeepMind` 发起的一场“黑客马拉松”（协作编程活动），后来成为该公司最有前途的项目之一。哈萨比斯一直梦想使用通用人工智能解决癌症等重大全球性问题，他似乎终于拥有了这样一个可以实现梦想的
    AI 系统。


    人体细胞中的氨基酸在折叠成特定的三维形状后会变成蛋白质，而错误折叠的蛋白质会导致疾病。作为一个 AI 程序，`AlphaFold` 可以预测这些氨基酸折叠后的三维形状。`DeepMind`
    认为，这有助于科学家更好地了解什么类型的化学反应可能会影响这些蛋白质，从而促进新药物的发现。


    哈萨比斯将在 2019 年和 2020 年赢得一项名为 `CASP`（蛋白质结构预测关键评估）的蛋白质折叠全球竞赛视为 `DeepMind` 的当务之急。“我们需要加倍努力，尽快取得进展。”在一部视频纪录片中，他对到会的员工说，“我们没有时间可以浪费了。”


    奥尔特曼用数字衡量成功，无论是投资金额还是用户数量，而哈萨比斯则追求奖项。据曾与哈萨比斯共事的人士透露，他经常对员工说，他希望 `DeepMind` 在未来
    10 年能获得三五个诺贝尔奖。


    `DeepMind` 在 2019 年和 2020 年都是 `CASP` 比赛的冠军，并于 2021 年向科学家开源了它的蛋白质折叠代码。在撰写本书期间，根据
    `DeepMind` 的数据，全球已有 100 多万科研人员访问了 `AlphaFold` 蛋白质结构数据库。但科学的发展是一个循序渐进的过程，虽然哈萨比斯有朝一日会获得诺贝尔奖，但利用其系统取得重大发现仍然遥不可及。一些专家也怀疑
    `DeepMind` 对蛋白质形状的预测是否可靠，能否正确判断药物化合物与蛋白质结合的方式，或者怀疑这样的预测能否节省药物研发的时间。


    总之，`DeepMind` 的大项目名声在外，但对现实世界的影响相对较小。它坚持在完全模拟的环境下训练 AI，这种环境的各种物理细节可以被精确设计和充分观察。这就是构建阿尔法围棋的方式，通过编程让它在模拟环境中与自己进行无数次对弈，`AlphaFold`
    则使用蛋白质折叠的模拟情况进行训练。


    借助真实世界的数据训练 AI——比如 `OpenAI` 就从互联网抓取了数以十亿计的文字——既难以处理，又容易受到干扰。这种方式也很容易让公司陷入丑闻，就像哈萨比斯从医院项目中吸取的教训那样。但
    `DeepMind` 自给自足的做法也意味着，他们难以开发出人们可以在现实世界中使用的 AI 系统。


    哈萨比斯对 AI 系统虚拟环境和荣誉的追求让他错过了语言模型革命。现在他只能追随奥尔特曼的脚步。谷歌高层要求 `DeepMind` 开始研究一套比 `LaMDA`
    更好的大语言模型。他们将这个新系统命名为“`Gemini`”（双子座），`DeepMind` 则将开发阿尔法围棋的战略性规划技术应用到该系统中。


    ## 部门合并与权力重组：谷歌 DeepMind 的诞生


    为了加快进展，皮查伊又实施了另一项重大举措。他合并了 `DeepMind` 和“谷歌大脑”这两个相互竞争的 AI 部门，取名为“谷歌 `DeepMind`”（员工将这个新部门简称为
    `GDM`）。这两个部门长年争夺顶尖研究人员和更多计算能力，团队文化完全不同。“谷歌大脑”同公司更亲近，直接致力于改进谷歌产品；而 `DeepMind` 更加独立，甚至达到了超然的程度——例如，它的员工可以凭借通行证进入谷歌的其他办公楼，但谷歌的员工却不能进入
    `DeepMind` 的办公楼。


    令许多人吃惊的是，皮查伊选择哈萨比斯来管理合并后的部门。此前大家都更看好工程师杰夫·迪安，他在谷歌可是德高望重的存在，负责监督公司其他部门的 AI 研究。然而，为了保护谷歌在网络搜索领域的领先地位，这位前游戏设计师、模拟爱好者，并且多年来一直想要独立自主的家伙反而摇身一变，成了公司大项目的领导者。从地位上说，哈萨比斯拥有的权力比以往任何时候都大，而对谷歌业务控制力的加强，也让他得以再度掌控
    `DeepMind`。


    “德米斯在谷歌的知名度和影响力比几年前要大得多。”沙恩·莱格说，“我们没有变得更独立，反而成了谷歌不可分割的一部分。谷歌的成功对我们和我们的使命至关重要。”


    “几年前，我还没有意识到这一点。”他补充说，“我认为我们可能需要更多的独立性。但如今来看，我觉得事情的发展比我原本想的更好。”


    哈萨比斯在一封电子邮件里宣布了与“谷歌大脑”合并的消息，他告诉 `DeepMind` 的员工，这两个部门之所以合并，是因为通用人工智能具备“推动历史上最伟大的社会、经济和科学变革”的潜力。


    实际上，这两个部门的合并只是为了帮助惊慌的谷歌打败商业对手，就像 `OpenAI` 的使命已经从造福人类（没有“财务压力”）转变成为微软的利益服务。所谓的“使命漂移”在硅谷屡见不鲜，`WhatsApp`
    经历的一切也正发生在可能会对社会产生更大影响的技术上。为了回应外界的质疑，`OpenAI` 在 2023 年 7 月宣布伊尔亚·苏茨克维将领导其新的“超级对齐”团队。该公司表示，苏茨克维将在
    4 年内带领研究人员弄清楚如何控制变得比人类更聪明的 AI 系统。


    ## 使命漂移：从造福人类到商业竞赛


    然而，`OpenAI` 仍然存在一个明显的问题。它避开了提升透明度的要求，从更广泛的角度说，我们越来越难以听到要求加强对大语言模型审查的声音。虽然格布鲁、米切尔和本德发表的研究论文声名狼藉，但最终还是引起了人们对风险的关注。她们仍在试图警告公众，这些模型以及更通用的生成式
    AI，可能会使刻板印象持续存在。遗憾的是，各国政府和政策制定者更关注一个财力雄厚、声音更响的群体：AI 末日论者。


    ## AI“安全”与“伦理”：两大阵营的资源鸿沟


    萨姆·奥尔特曼在推出 `ChatGPT` 的同时也掀起了数个竞赛热潮。第一场竞赛显而易见：谁能率先将最好的大语言模型推向市场？而另一场竞赛则在幕后悄然上演：谁将掌控
    AI 的话语权。


    2023 年 3 月，就在微软和谷歌各自匆忙推出 `Bing` 和 `Bard` 几周后，埃利泽·尤德考斯基在《时代》杂志上发表了一篇 2000 字的专栏文章，探讨
    AI 的发展方向，描绘了一幅智能机器越来越多的可怕未来图景。


    他写道：“许多涉足这些问题的研究人员，包括我自己，都认为在目前的情况下，开发超级 AI 的最终结果大概率是人类灭绝。”


    同月，埃隆·马斯克等科技领袖在一封公开信中呼吁，考虑到 AI 对人类的威胁，应“暂停”AI 研究 6 个月。“我们是否应该创造最终可能在数量上、智慧上都超过我们，淘汰并取代我们的非人类大脑？”这封信由未来生命研究所的扬·塔林润色，“我们应该冒着失去对人类文明控制权的风险吗？”这封信登上了包括路透社、彭博社、《纽约时报》和《华尔街日报》在内的世界各地新闻媒体的头条，将近
    34000 人在信上签名。


    紧随其后的报道更令人感到心慌。有着 AI“教父”之称的两位 AI 专家——杰弗里·辛顿和约书亚·本吉奥先是警告媒体，AI 将对人类存在构成威胁，接着本吉奥称他对自己毕生的事业感到“迷茫”，辛顿则表示他对自己的一些研究感到后悔。


    “一些人相信，AI 可以变得比人类更聪明。”辛顿在接受《纽约时报》采访时表示，“但大多数人觉得这不可能。我也觉得这不可能。我认为至少需要 30～50 年，甚至更长的时间。显然，我现在不这么觉得了……我认为他们不应该再开发更大的模型，除非他们已经了解怎么控制它。”


    AI 大佬似乎都在表达同样的意思：AI 发展得太快，可能会导致灾难性后果。AI 威胁论正成为公共话语中的固定议题，甚至到了你会在聚餐时向姻亲提起，而他们会点头赞同其重要性的地步。机器将背叛人类并统治世界的说法，吸引了大众主流群体的关注。市场调研公司
    `Rethink Priorities` 对 2444 名美国成年人进行的一项调查显示，到 2023 年底，22% 左右的美国人认为 AI 将在未来 50
    年内消灭人类。


    然而，这些末日言论对 AI 业务产生的影响却事与愿违：AI 产业在蓬勃发展。根据市场调研公司 `PitchBook` 的数据，开发生成式 AI 产品的初创公司所获投资金额从
    2022 年的约 50 亿美元飙升至 2023 年的 210 多亿美元。


    AI 失控的背后，隐含的是诱人的利益。如果这项技术可能在未来消灭人类，那岂不意味着它现在足够强大，能够助力业务增长了吗？


    萨姆·奥尔特曼越是谈论 `OpenAI` 技术的威胁，比如告诉国会像 `ChatGPT` 这样的工具可能“对世界造成重大伤害”，他吸引到的资金和关注反而越多。2023
    年 1 月，`OpenAI` 又获得了微软的一笔投资，这次高达 100 亿美元。作为交换，微软取得了该公司 49% 的股份。微软现在几乎完全掌控了 `OpenAI`。


    达里奥·阿莫迪等一群研究人员离开 `OpenAI` 之后创立的新公司 `Anthropic` 也吸引了大笔投资。截至 2023 年底，该公司已经接受谷歌的
    20 亿美元投资和亚马逊的 13 亿美元投资。还不到一年，它的估值就翻了两番，达到 200 多亿美元。看来创造超级安全的超级 AI，也会让你变得超级有钱。科技媒体
    `TechCrunch` 取得的公司文件显示，私底下 `Anthropic` 希望筹集高达 50 亿美元的资金，以便进入数十个行业并挑战 `OpenAI`。该文件写道：“这些模型可以将大部分经济活动自动化。”此外，文件里还提到，在这场竞赛中，如果
    `Anthropic` 能在 2026 年之前开发出“最好的”模型，就能保持领先很多年。


    “安全第一”的方针，以及“确保变革性 AI 帮助人类和社会繁荣”的使命，让 `Anthropic` 听上去像非营利组织。但 `OpenAI` 与 `ChatGPT`
    轰动一时的成功表明，拥有宏伟计划的公司也可能是最有利可图的投资对象。宣称正在开发更安全的 AI 只是掩耳盗铃，几乎成为一种信号，吸引那些想要加入竞赛的大型科技公司投资。


    `Anthropic` 的逻辑根本站不住脚。要想找到让 AI 系统更安全的办法，不能只研究世界上最强大的 AI 系统——它必须自主开发。因此，与大型科技公司交好无可非议，它们可是全球大规模计算能力的唯一拥有者。举例来说，`Anthropic`
    在与谷歌的交易中获得了使用云计算的权限，这让它得以开发一个与 `ChatGPT` 相媲美的大语言模型。


    两个不同的群体正在公开为安全的 AI 鼓与呼。第一个群体由奥尔特曼、阿莫迪等人组成，他们还签署了另一封公开信，声称“减轻 AI 导致的灭绝风险，应该与流行病、核战争等其他可能影响人类社会的风险一样成为全球的优先事项”。他们打着“AI
    安全”的旗号，用模糊的语言描绘未来的威胁，却很少详细解释失控的 AI 系统会做什么，以及这一切什么时候会发生。他们向国会提出了这些问题，但也倾向于主张宽松的监管。


    第二个群体包括蒂姆尼特·格布鲁、玛格丽特·米切尔等，这些人多年来一直关注 AI 已经给社会带来的风险。这个“AI 伦理”群体以女性和有色人种为主，他们都是刻板成见的受害者，担心
    AI 系统会使不平等持续存在。随着时间的推移，他们对“AI 安全”阵营的行为越发愤怒，尤其是这个群体还赚了很多钱。


    资金的差距犹如天堑。“AI 伦理”群体经常“缺衣少食”。诸如“欧洲数字版权倡议”这样的组织，2023 年的年度预算也只有 220 万美元。该组织是一个拥有
    21 年历史的非营利组织网络，致力于反对人脸识别和偏见算法运动。同样，纽约 AI 研究所 `AI Now` 的预算不足 100 万美元，该组织负责审查 AI
    在医疗保健和刑事司法系统中的应用情况。


    而关注 AI“安全”和灭绝威胁的组织获得的资金则遥遥领先，往往拥有亿万富翁捐助者。位于马萨诸塞州剑桥市的非营利组织未来生命研究所，旨在研究如何最有效地阻止将
    AI 用于武器。2021 年，其从加密货币大亨维塔利克·布特林那里得到了 2500 万美元资金。这笔捐款比当时所有 AI 伦理组织的年度预算总和还要多。


    脸书富豪达斯汀·莫斯科维茨的慈善机构开放慈善多年来为 AI 安全工作提供了数百万美元的资助，其中包括 2022 年向 AI 安全中心捐赠的 500 万美元和向加利福尼亚大学伯克利分校人类兼容
    AI 中心捐赠的 1100 万美元。


    总之，莫斯科维茨的慈善机构一直是 AI 安全的最大捐助者，他和妻子卡里·图纳计划捐出近 140 亿美元的财富。最初以非营利组织名义成立的 `OpenAI`
    也得到了其中的 3000 万美元。

    '
