- raw: '奥尔特曼和布罗克曼似乎从两个方面证明了他们改弦易张的合理性。一方面，在加速前进时转向，是创业公司典型的做法。另一方面，通用人工智能这一目标本身，比实现目标的方式更重要。也许他们不得不在实现目标的过程中违背一些承诺，但最终人类将会因此而受益。而且，他们还告诉员工和公众，微软也希望利用通用人工智能改善人类生活。双方志同道合。布罗克曼写道：“如果我们实现了这一使命，就实现了微软和OpenAI赋能所有人的共同价值。”


    多年来，大型科技公司的辩护者一直辩称，这些公司的技术赋予了世界更多力量，给人类带来的价值甚至超过了这些公司数万亿美元的收入。的确，智能手机和社交媒体开启了全球联系的便捷时代，也解锁了许多新的娱乐和商业形式。谷歌地图、脸书等应用程序不仅可以免费使用，而且提供了很多让我们的生活看起来更方便的“漂亮”功能。但新技术也伴随着代价，从人际关系的疏离、隐私的丧失，到屏幕成瘾、心理健康问题、政治极化和自动化程度提高带来的贫富差距加大，所有这些都离不开少数几家公司的推波助澜。


    OpenAI让人们使用技术的方式发生了又一次重大转变，就像脸书掀起社交媒体热潮一样，而与微软结盟也意味着奥尔特曼正在重蹈马克·扎克伯格的覆辙。扎克伯格的公司害人不浅，因为其商业模式鼓励用户一直盯着屏幕。潘多拉魔盒已经被打开：人工智能系统中存在种族主义和性别偏见等遗留问题，人工智能让人们沉迷于屏幕上的社交媒体动态，其对就业的潜在灾难性影响也隐约可见。如果奥尔特曼一直保持OpenAI的非营利性，并致力于与其他科学家分享实验室研究成果以方便进行严格审查，那么他本可以防止这些后果产生。但是，他与微软结盟，进行了一场浮士德式的交易。他不再是为了人类而开发人工智能，而是为了帮助一家大型企业保持主导地位，并在激烈的竞争中抢占先机。在竞争最终开始之前，只有一次机会能够阻止他。


    **11**  **与科技巨头绑定**


    在外部看来，OpenAI从一个努力拯救人类的慈善组织转型为一家与微软合作的公司，这很奇怪，甚至有些可疑。但根据当时在OpenAI内部的员工的说法，许多员工认为，与财力雄厚的科技巨头合作是好消息。现在不仅他们的雇主更有能力保持财务稳健，而且他们更有机会从巨额投资而不是捐赠中获得经济回报——事实上也确实如此。在接下来的几年里，微软向萨姆·奥尔特曼的公司投入了越来越多的资金，使OpenAI的员工得以卖掉股票成为百万富翁。很多研究员认为他们的使命并未被辱没。他们已经接受了以下观念，即迈向通用人工智能带来的好处，远比实现这一目标存在的道德顾虑更为重要。只要他们坚持至关重要的章程，资金从哪里来无关紧要。毕竟这里是硅谷，程序员总会加入那些试图让世界变得更美好的初创公司，同时还能挣到7位数的薪水和员工股票期权，这些钱足以让他们在美国最昂贵的房地产市场买下第二套房子。


    不过，并非所有人都对新的现状感到满意。戴着眼镜、拥有一头卷发的工程师达里奥·阿莫迪自OpenAI成立之初就一直在探寻它的真正使命，他热爱“保护人类免受人工智能伤害”的目标，尽管布罗克曼承认这一目标在当时“有些模糊不清”。阿莫迪毕业于普林斯顿大学，是一位敢于追问难题的物理学家，他对微软有一箩筐的疑问。很明显，OpenAI的使命和微软的目标不同，在需要助力微软获取更多利润的情况下，OpenAI怎样才能持续致力于构建安全的人工智能呢？据知情人士透露，阿莫迪向同事们指出：“我们在为人类开发人工智能，但我们也在为一家想要实现利润最大化的公司提供技术支持。”这不合情理。


    阿莫迪负责OpenAI的大部分研究工作，其中包括语言模型方面的研究。他正带领团队开发下一代模型GPT-3。尽管他对OpenAI与微软绑定感到不快，但他不得不承认这家软件巨头给予了他们所需的无与伦比的计算资源。事实上，在投资几个月后，微软就宣布它已经专门为OpenAI建造了一台用于训练人工智能的超级计算机。


    阿莫迪几乎没有用过比这更强大的系统。家用计算机通常只有一个CPU（中央处理单元），这种功能强大的硅芯片呈矩形，表面布满数以十亿计的微型晶体管。它是计算机的大脑，一般拥有4～8个负责处理所有必要计算的核心。而微软这台新的超级计算机，拥有285
    000个CPU核心。如果说家用计算机是玩具车，那么这台计算机就是坦克。


    用来玩游戏的家用计算机功能更强大，这些机器通常配备GPU，能够快速处理复杂的视觉数据，使游戏画面看起来流畅优美。现在这些GPU也被用于训练人工智能，因为它们能同时执行非常多的计算。微软这台新的超级计算机拥有10
    000个GPU。同时，这台超级计算机传输数据的速度大约是普通计算机的100倍，因为它的连接速度快如闪电。


    在利用这些新的计算能力的同时，OpenAI也从互联网上抓取了海量文本用来训练新的GPT语言模型。它就像19世纪的石油勘探者，挖掘网络上庞大的内容储备，再将其处理为能力更强的人工智能。公司的研究人员已经从维基百科上提取了大约40亿个字词，因此人们在社交媒体上分享的数十亿评论成了下一个显而易见的来源。不过，脸书不在选项里，因为在2018年的剑桥分析（Cambridge
    Analytica）丑闻过后，马克·扎克伯格的平台禁止其他公司抓取其用户数据。但推特和Reddit基本上还是开放的。


    Reddit论坛被称为“互联网主页”，从汽车到约会，再到看起来像文艺复兴时期绘画的照片，它涵盖了所有可以想到的话题。该公司与奥尔特曼关系密切，因为他和Reddit的创始人曾经一同在Y
    Combinator首期班学习，Reddit在首次公开募股前，也就是2024年初提交的文件显示，奥尔特曼最后成为该公司的第三大股东，拥有8.7%的股份。奥尔特曼有充分的理由爱上Reddit：它是人类对话的“金矿”，是训练人工智能的最佳选择，因为数百万用户每天都在发布评论和参与投票。难怪Reddit会成为OpenAI用来训练人工智能最重要的资源之一，据一位熟悉该在线论坛的人士透露，其文本占到GPT-4训练数据的10%～30%。OpenAI用于训练语言模型的文本越多、计算机越强，其人工智能就会变得越流畅。


    但阿莫迪无法摆脱不安的心情。他和他的妹妹，同时也是OpenAI政策和安全团队负责人的丹妮拉眼看着OpenAI的模型越来越大、越来越强，而在他们的团队或公司里，压根没人了解向公众推出这些系统的全部后果。如果现在与一家强大的企业绑定，他们可能会面临更大的压力，甚至被迫在进行严格测试之前就发布这项技术。


    身处伦敦的德米斯·哈萨比斯与阿莫迪有一样的担忧。大约在OpenAI准备发布GPT-3期间，萨姆·奥尔特曼、格雷格·布罗克曼、伊尔亚·苏茨克维和DeepMind的几位创始人共进晚餐，意图逐渐缓和这两家竞争公司之间的关系。这场聚会气氛紧张。据知情人士透露，哈萨比斯特意问奥尔特曼为什么OpenAI要公开发布人工智能模型，危险人物可能会滥用它们传播错误信息或开发更加有害的人工智能工具。哈萨比斯指出，DeepMind在保护人工智能不被误用方面要谨慎得多。


    奥尔特曼礼貌地回敬说，这很可笑。他含蓄地提醒大家，埃隆·马斯克曾拿《邪恶天才》游戏来讽刺哈萨比斯。奥尔特曼表示，保密会让人工智能公司的负责人掌握危险的控制权，就像DeepMind的情况。这样也不安全。


    奥尔特曼回到旧金山后，开始从阿莫迪那里听到类似的观点，后者对OpenAI的新商业方向抱怨连连。奥尔特曼联系了一向乐观的里德·霍夫曼，看他能不能做个和事佬解决问题。据知情人士透露，霍夫曼找到阿莫迪，想知道问题出在哪里，这位亿万富翁风险投资家温和地劝他要有信心。


    霍夫曼解释说：“这就是我们达成使命的方式。”阿莫迪和他的妹妹对此表示怀疑。他们知道这些语言模型现在变得多大、多复杂，他们也知道霍夫曼是微软的董事会成员。他难道不是既得利益者吗？


    阿莫迪兄妹对OpenAI与微软日益密切的联系保持警惕没错。自从OpenAI成立以来，大型科技公司一直在试图主宰人工智能的发展，操纵这项技术朝着更强、更全能的方向迈进，同时却忽视对风险进行充分的研究。麻省理工学院2023年的一项研究表明，在过去10年中，大公司开始掌控人工智能模型的所有权，控制比例从2010年的11%上升到2021年的96%——几乎是一网尽扫。在大型科技公司向人工智能投入的巨额资金面前，就连政府项目也相形见绌。例如，2021年非国防领域的美国政府机构为人工智能安排了15亿美元预算；同年，美国私人部门在该领域的投入超过3
    400亿美元。


    与此同时，这些商业化的人工智能系统的运行方式一直秘而不宣。随着OpenAI向公众发布更多的技术，它如何创建这些系统也变得越来越神秘，使独立研究员更难细察它们的潜在危害和偏见。试想一下，如果联合利华等大型食品制造商生产出的零食越来越好吃，但却拒绝在包装上写明配料或说明生产过程，会怎样？这就是OpenAI正在做的事。比起大语言模型，你可能更清楚一包多力多滋薯片有哪些成分。


    相比偏见问题，阿莫迪更担忧人工智能对人类生存的威胁。他写了一篇研究论文，叫作《人工智能安全中的具体问题》。他在文中强调，设计不当的人工智能系统可能导致事故发生。如果人工智能开发者在设计中指定了错误的目标，他们的系统就可能造成一些意外损害。他写道，如果家用机器人因为把盒子从房间的一边搬到另一边而受到奖励，那它可能会因为太过专注于目标而撞翻挡路的花瓶。阿莫迪认为，人们需要看看现实世界中，当人工智能被整合到工业控制系统和医疗保健系统后可能造成的事故。


    最终，阿莫迪没有被霍夫曼的理由说服，决定同妹妹丹妮拉以及其他六位研究员一起离开OpenAI。可这并不仅仅是为了抗议人工智能的安全和商业化问题。即使在最坚定的人工智能担忧者中，也存在机会主义。阿莫迪目睹了奥尔特曼从微软那里获得了一笔10亿美元的投资，他能感觉到微软还会继续增加投资。他是对的。阿莫迪见证了人工智能新繁荣的开始。他和同事决定创办一家名为“Anthropic”的人工智能公司，为了强调他们对人类的首要关切，该公司以指代人类存在的哲学术语命名。Anthropic将成为制衡OpenAI的一股力量，就像OpenAI曾经制衡DeepMind和谷歌一样。当然，他们也想寻找商机。


    “我们当时认为人工智能领域不存在什么‘护城河’。”An-thropic的一位创始人说。换言之，该领域是相当开放的。“做得好的新组织似乎很快就能赶上现有的组织。因此我们觉得，我们不妨基于自己的愿景建立自己的组织，并将安全研究作为核心。”


    阿莫迪在构建OpenAI的两个语言模型中发挥了关键作用，现在他可以用同样的能力创造自己的品牌。他带领团队回顾了OpenAI从非营利性转为营利性的过程，确定他们不想重蹈覆辙，因为那会让他们不值得被信任。于是他们成立了一家共益企业，将社会与环境问题摆在和股东一样重要的位置，冰激凌品牌本杰瑞也是采用这种合法的商业结构。


    除了DeepMind之外，萨姆·奥尔特曼现在又多了一个竞争对手，而且这个洞悉了OpenAI秘密的对手更加危险。正如阿莫迪所料，Anthropic几乎立刻就从一群支持人工智能安全的富有资助者那里筹集到了巨额资金，其中就包括扬·塔林和达斯汀·莫斯科维茨，后者是马克·扎克伯格在哈佛大学读书期间的室友，也是脸书的联合创始人、亿万富翁。硅谷的资金通常在一小撮精英圈子里流动，他们中的一些人长期存在着竞争关系。莫斯科维茨的慈善组织开放慈善向OpenAI投资了3
    000万美元，奥尔特曼则为莫斯科维茨的自有软件Asana提供资金支持。然而，莫斯科维茨也想支持OpenAI的新竞争对手。（塔林后来表示，他后悔助长了如此激烈的、使人工智能变得更加危险的竞争。）


    一年之内，Anthropic又筹集到5.8亿美元，大部分款项来自加密货币交易所FTX年轻的创业富豪，他们与阿莫迪在有效利他主义方面有同样的共识。但讽刺的是，两年前阿莫迪还在抱怨OpenAI与微软的商业捆绑，两年后他却将与谷歌和亚马逊两家公司结盟，并获得超过60亿美元的投资。事实证明，在这个开发通用人工智能需要无限资源投入的新世界，谁也无法拒绝科技巨头递来的橄榄枝。


    在大洋彼岸的伦敦，这种捆绑关系成了DeepMind的负担。德米斯·哈萨比斯一直在寻找新的科学突破，以证明自己的公司领先于OpenAI，而且能够继阿尔法围棋之后再次让世界叫绝。但联合创始人穆斯塔法·苏莱曼仍然渴望证明人工智能可以为善事所用。这么多年以来，他一直对朋友哈萨比斯引领公司的方式感到不安。这位国际象棋天才似乎专注于用游戏和模拟来开发人工智能，但苏莱曼认为他们也应该研究现实世界，即使这样做需要处理大量杂乱的数据。如果他们现在不解决这些社会问题，将来还能怎么解决呢？


    他和伦敦的几家医院建立了合作关系，使用DeepMind的人工智能帮助医护人员。这个项目始于一款应用程序，当患者可能出现急性肾损伤时，该软件会发出警告。由于医学领域的监管障碍，它没有使用DeepMind的先进人工智能技术，但苏莱曼敢打赌，一旦他的人工智能科学家能够使用正确的医疗数据来训练人工智能工具，该软件就会变得更加精准。


    医生们喜欢这款应用程序，项目看上去也大有可为。但随后发生了不可想象的事。媒体突然纷纷开始报道说谷歌正在获取伦敦160万名患者的记录，还试图挖掘敏感数据。苏莱曼的实验突然变成了丑闻。他对DeepMind即将从谷歌剥离深信不疑，以至于忘了从技术上讲，该公司仍隶属一家广告巨头，谷歌靠收集用户数据并与广告商共享数据赚钱。在外界看来，由于背后有谷歌存在，DeepMind用人工智能解决医疗问题的努力突然变得可疑起来。


    哈萨比斯对有关医院丑闻的负面报道感到震惊，这些报道似乎抹去了他从阿尔法围棋亚洲赛事中赢得的荣耀。事实证明，试图用一堆描述现实世界的数据训练人工智能模型——这与OpenAI从网上抓取数据训练其语言模型大同小异——可能危及DeepMind的声誉，特别是在公司与谷歌关系密切的情况下。


    哈萨比斯似乎也在怀疑独立伦理委员会的实用性，包括那个他和苏莱曼打算在DeepMind成功剥离后用来引领公司方向的董事会。但苏莱曼急于尝试不同的治理架构，他设立了一个较小的审查委员会来审查DeepMind的医疗项目，确保执行过程符合伦理。它由八名来自英国艺术、科学和技术领域的专业人员组成，其中包括一名前政治家。他们每年召开四次会议，审查公司的医疗保健研究，与工程师交谈，并指出DeepMind与医院、患者合作计划中的伦理问题。


    这种自我监管尝试虽然崇高，但注定会失败。在OpenAI、DeepMind，以及脸书等科技公司，大家普遍认为独立董事会是在为人类开发人工智能和逐利之间维持平衡的最佳方式，尤其是在缺乏适当监管的情况下。例如，OpenAI设立了一个董事会，其唯一职责就是确保公司为人类的利益开发通用人工智能。DeepMind希望在剥离谷歌后设立一个类似的专家咨询组。但在一个需要达成财务目标的全球巨头内部，这些善意的治理结构是不可持续的。奥尔特曼经历了惨痛的教训。苏莱曼也遭遇了现实打击，他不想强迫审查DeepMind医疗部门的专家咨询组成员签署保密协议，这样他们就能自由公开地批评公司。但这也意味着他们无法全面了解DeepMind的工作，经常不明就里。由于专家咨询组成员的判断不具有法律约束力，他们纷纷抱怨自己是“纸老虎”。实际上，专家咨询组做不了什么。这就是自我监管在科技行业反复出现的全部问题所在。既当裁判员又当运动员的审查毫无价值，何况还没有法律效力。


    这次尝试以失败告终。谷歌选择发展自己的医疗保健部门，同时接管了DeepMind与医生等医疗专业人士的合作项目。这家搜索巨头不想让一群局外人动不动就对公司的工作挑三拣四，所以撤销了苏莱曼的审查委员会。这是谷歌和科技界又一次走入自我监管的死胡同。在同年的早些时候，谷歌已经撤销了一个仅运行一周的人工智能咨询委员会，因为公众抵制其中一名持反对性少数群体观点的委员。这些都指向一个更宽泛的系统性问题，即人工智能的快速发展超过了监管机构和立法者的能力范畴。科技公司处于法律监管真空地带，从技术上讲，它们可以用人工智能为所欲为。技术专家们出于善意，试图用一系列不同的委员会和合法的结构来监管自己的公司，但归根结底，他们仍然在一个必须优先考虑股东回报和财务增长的体系中工作。这就是为什么经过漫长而艰辛的努力之后，DeepMind想要剥离谷歌的尝试也以失败告终。


    2021年4月伦敦一个多云的早晨，德米斯·哈萨比斯召开了全体员工视频电话会议，他圆圆的脸上挤出一丝笑容，准备做自己最擅长的事：把坏消息变成好消息。到目前为止，DeepMind已经花了7年多的时间试图从谷歌独立出来。他们先后尝试过成为“自治单位”“Alphabet子公司”“全球利益公司”，最近又选定了“担保有限公司”，这是英国法律承认的一种商业结构，通常用于慈善机构和俱乐部，但允许它们将商业、科学发现和利他主义目标结合起来。不过，相关计划仍是秘密。DeepMind的100多名员工没有向公司以外的人提过这件事。


    回顾哈萨比斯和苏莱曼这些年的努力，很容易看出他们后悔把DeepMind卖给谷歌。这种情况在科技界屡见不鲜，收购公司对企业初衷的扭曲往往令创立者大惊失色。举例来说，WhatsApp的创始人多年来一直坚持保护其即时通信应用程序的私密性，从不播放广告，并严格加密通过其网络发送的所有信息。简恩·蔻姆在电话常被窃听的乌克兰长大，他的办公桌上贴着一张WhatsApp联合创始人布赖恩·阿克顿写的纸条，上面写着：“不要广告！不要游戏！不要噱头！”但在脸书以190亿美元收购WhatsApp之后，蔻姆和阿克顿不得不对他们早期的隐私标准做出妥协，比如他们曾一度调整政策，以便用户的WhatsApp账户可以在后台连接到他们的脸书资料。随后，阿克顿和脸书高层爆发了激烈的冲突，最后他在自己的股票兑现期结束之前就退出了公司，放弃了价值8.5亿美元的脸书股票。阿克顿后来承认，他对出售WhatsApp深感遗憾。


    哈萨比斯不会与上级对抗。他在应对谷歌高层方面，表现得既有策略又更精明。他没有争吵或退出，而是寻找更聪明的方式挽回颜面，就像他利用阿尔法围棋达成目的一样，但乐观也让他忽视了谷歌需要不断发展业务的需求。尽管这家科技巨头签署了投资意向书，声称在10年内向DeepMind提供160亿美元以维持其独立运行，但这份文件不具有法律效力。更糟糕的是，哈萨比斯失去了谷歌掌舵人的支持。在过去几年里，虽然拉里·佩奇仍旧担任Alphabet公司的首席执行官，但他正逐渐从公众视野中消失。他甚至没有出席关于选举安全的国会公开听证会，只留了一张空椅子给现场媒体。2019年12月，佩奇彻底卸任，桑达尔·皮查伊成为Alphabet公司的首席执行官。很明显，这家公司越来越朝着传统企业的方向发展。'
