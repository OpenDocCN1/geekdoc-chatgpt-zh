- raw: '到目前为止，由于哈萨比斯个人想要追逐通用人工智能，他一直与这些相互斗争的意识形态保持距离。他生活在远离硅谷泡沫数千英里之外的英国，身边围绕着一群绝顶聪明的人工智能科学家和工程师，而且这个团队的规模还将继续扩大。据哈萨比斯的同事透露，哈萨比斯决心在未来5年内破解通用人工智能的难题，并很有可能在此过程中获得诺贝尔奖
    ^([⁴](#fn4))


    最终，双方达成交易，并在收购协议中加入伦理委员会条款，谷歌以6.5亿美元的价格收购了DeepMind。这远远低于扎克伯格开出的价钱，但对一家英国科技公司来说仍是一笔巨款，而且交易附带了一项至关重要的条款：确保通用人工智能控制权不落入大公司之手。


    谷歌注入的现金流，也意味着哈萨比斯可以招揽更具才华的科研人员。虽然有些员工不喜欢“卖身”给谷歌，但大多数人对他们在谷歌的大幅加薪以及更丰厚的员工股票期权感到欢欣鼓舞，因此跳槽到其他科技公司的可能性也显著降低。现在哈萨比斯不必再担心脸书或亚马逊挖走他的员工，他可以挖走它们的员工，还可以用高额薪资从学术界吸引最厉害的人工智能专家。哈萨比斯带领公司走上了开发更先进技术的道路，同时也一直保持着DeepMind的神秘文化，以至于公司的网站主页仍是一片空白，只在中间嵌着一个圆圈标志。人工智能实验室是如此神秘，就连求职者向DeepMind伦敦总部递交申请后，工作人员也不会在回复电子邮件时透露公司的地址，而是派一名代表去附近的国王十字车站接人，然后带他们步行到办公室。


    根据一名前高管的说法，三位创始人在面试过程中极具说服力，尤其是苏莱曼。“他非常有魅力，告诉我这是一个千载难逢的机会，可以改变世界。”


    那些拥有10年以上职业生涯的学者和公务员，本来可以轻松获得其他私营企业的高薪职位，但在与苏莱曼交谈20分钟后，就深信自己应该为通用人工智能的开发出一份力。这名前高管补充道：“他解释说，改革将建立在更好的数学基础上。”哈萨比斯和苏莱曼会说他们将雇用“世界上最好的数学家和物理学家”。现在登上了谷歌这艘巨船，他们还能使用世界上最强大的超级计算机和最丰富的数据训练人工智能模型。


    迄今为止，约有50%的DeepMind新员工来自学术界，而他们几乎不敢相信自己的运气。他们原来在文件柜前挤成一堆，为了拨款资金四处奔波；现在他们来到了宽敞明亮的空间办公，四周到处是餐馆和花园，还拥有超快的计算机和几乎无限的资源。最重要的是，DeepMind保证不会让你觉得自己正在为一家广告巨头工作。相反，这是一个在《科学》《自然》等同行评议期刊上发表论文的知名科学组织，你在做研究，也在解决世界上最大的问题。如果真是这样，那可称得上是两全其美了。


    但从长期来看，事实并非如此。六位数的薪水和难以置信的福利让DeepMind的员工忘记了，仅仅为了让世界变得更美好，就能从谷歌获得如此丰厚的报酬是多么奇怪。这些让人不适的时刻偶尔也会出现，比如在学术界或政府部门的老同事要求前来拜访的场合。


    “我过去经常感觉尴尬。”一名从学术机构跳槽到DeepMind的前员工表示，当以前的同事们想要参观他的新办公室时，这名员工劝他们不要去。他建议大家去附近的餐馆吃饭。即便如此，这也比去DeepMind的自助食堂用餐更合适，DeepMind的食堂提供的是迪拜酒店式的五星级自助餐。他们补充道：“感觉就像脱离了现实世界，真的很荒谬。”


    科研人员的待遇堪比摇滚明星，被照顾得无微不至。有研究员曾经给通常负责报销和办理签证的员工支持部门发送电子邮件，说如果将所有草莓上的萼片摘掉，会更节省时间。两天后，自助餐台上摆了好几碗干干净净的“光屁股”草莓，不带一点绿色。


    哈萨比斯不断提醒员工关于开发通用人工智能的愿景，他经常说以他们目前的研究和突破速度，只要再过5年就能实现最终目标。据DeepMind的工作人员透露，哈萨比斯很擅长描绘公司未来发展的宏伟蓝图。在团建活动上，他和苏莱曼会做一些关于战略的演讲，但听起来更像是赛前动员，而不是对未来具体做法的阐释。三位创始人通常不会深入讨论策略的细节。


    “他们强调愿景和‘让我们一起投入这个使命’的口号。”一名前员工表示，“德米斯和穆斯塔法在讲故事方面非常了不起。他们配合得非常默契。”哈萨比斯性格严肃，经常阅读科学论文到深夜，花数小时与他的顶尖研究员讨论方法论，往往并不会和没有博士学位的基层员工往来。哈萨比斯在DeepMind内部塑造了一种根深蒂固的等级文化，这主要是基于员工的学术声望。苏莱曼则是一个魅力型梦想家，描绘的未来蓝图引得每个人都为之努力。一名前员工说，苏莱曼就像是DeepMind的花衣魔笛手。莱格是三人组中最具学术气息的，在某种程度上他淡出了人们的视线。“沙恩更沉默寡言一点。”这名前员工说。


    前员工们表示，哈萨比斯对通用人工智能的颠覆性影响深信不疑，他告诉DeepMind的员工不用担心5年后赚钱的问题，因为通用人工智能会让经济概念变得过时。这最终成为高层管理人员之间的主流思想。一名前高管说：“他们像被下了‘迷魂药’，心里想着‘我们正在创造人类有史以来最重要的技术’。”


    哈萨比斯和苏莱曼开始默默组建伦理安全委员会，谷歌同意将其作为收购DeepMind的条件，是因为知道需要有一个故障保险系统，而苏莱曼是这个系统的主要倡导者。谷歌对其股东负有利润逐年增长的信义义务，并且一直做得很成功。这给DeepMind带来了开发通用人工智能所需要的人才和计算资源，但也是一把“双刃剑”。一旦他们真的创造出通用人工智能，想必谷歌就会将其掌控并用来赚钱。他们不确定具体的做法，但伦理安全委员会至少能保证这一人类水平的人工智能不会被滥用。


    收购大约一年后，DeepMind在加利福尼亚州SpaceX总部的一间会议室召开了伦理安全委员会的第一次会议。据知情人士透露，哈萨比斯、苏莱曼和莱格均位列委员，另外还包括埃隆·马斯克，以及风险投资家、领英联合创始人、亿万富翁里德·霍夫曼。参加会议的还有拉里·佩奇、谷歌高管桑达尔·皮查伊、谷歌首席法律顾问肯特·沃克、哈萨比斯的博士后导师彼得·达扬和牛津大学的哲学家托比·奥德。


    会议进行得很顺利，但接着谷歌就透露了一些令三位创始人吃惊的消息。公司根本不希望新成立的伦理委员会运作下去。苏莱曼气愤难耐，因为他一直在推动委员会的组建。谷歌当时的部分解释是，委员会成员之间存在利益冲突——例如，马斯克可能会支持DeepMind以外的公司进行人工智能研究，而且设立伦理委员会不符合法律规定。对于一些刚上任即卸任的委员来说，这就是一派胡言。他们怀疑，实际上谷歌只是不想受制于一群人，因为他们可能会剥夺谷歌对“钱景”广阔的人工智能技术的控制。


    谷歌这种堪称违背收购协议的行为激起了哈萨比斯和苏莱曼的怒火，他们就伦理安全委员会被撤销的问题向公司高层投诉。谷歌高管们为了哄好DeepMind的创始人，好让他们继续推动人工智能研究取得突破，设法抛出了一个更大的“诱饵”。一名谷歌高管联系了哈萨比斯和他的合伙人，告诉他们也许有更好的组织架构可以用来保护通用人工智能技术。虽然DeepMind的三位创始人当时并不知情，但谷歌正在准备转型成叫作“Alphabet”（字母表）的企业集团，从而使其各个业务部门能够更加独立地运作。这名高管对三位创始人说，这些新的部门将被称为“自治单位”，就像独立的公司一样。它们会拥有自己的预算、资产负债表、董事会，甚至外部投资者。这个想法听上去很有前途。


    在外界看来，谷歌真正的目标其实是提振其长期低迷的股价。多年来，华尔街分析师一直在努力评估谷歌除了YouTube、安卓操作系统和“盈利之王”搜索引擎之外的其他业务，比如智能恒温器公司Nest、生物技术研究公司Calico、风险投资公司，以及“登月”X实验室。这些部门大多不赚钱，但如果它们变成母公司旗下的独立公司，就能扩大公司的资产负债表，并帮助提升谷歌的核心业务，也就是广告业务的价值。谷歌的广告业务占其年收入的90%以上。尽管谷歌以拥有顶尖工程师的创新科技公司闻名，但谷歌的领导层仍然将大部分精力放在设法让人盲目消费的古老生意上。


    哈萨比斯、莱格和苏莱曼为了通用人工智能的开发耗尽心血，几乎没有停下来思考谷歌的真正动机；或者，谷歌可能一开始就不打算赋予他们自治权，因为人工智能研究对其业务增长用处太大了。相反，他们只听见了“更加独立”。这意味着谷歌无法控制未来的人工智能，他们可以成为其谨慎的“管家”。“我们希望拥有足够的独立性，以便在强大的通用人工智能来临时能够应对可能出现的情况。”莱格回忆道，“我们想确保对事情的发展有足够的控制能力。”


    在接下来的一年半时间里，三位创始人和佩奇等高管讨论了他们在这一新的“企业伞”下的存在方式以及“自治单位”的真正意义。然而，当谷歌宣布以Alphabet的名义进行重组时，并没有确认或公开任何赋予DeepMind更多合法自治权的计划。谷歌投资的其他几家公司，如生命科学公司Verily Life Science，被剥离为独立的公司，而DeepMind在这方面却毫无进展。谷歌似乎又一次忘记了自己的承诺。


    哈萨比斯没有太多时间去纠结谷歌的欺骗，还有一件更麻烦的事在等着他。在旧金山，一些创业者正着手建立另一个与DeepMind目标相同的研究实验室。他们在兜售一个伟大的新想法，即安全开发通用人工智能并造福人类。言下之意是，世界上另一个开发通用人工智能的伟大尝试——哈萨比斯的研究——对人类没有用处，这刺痛了哈萨比斯的心。谷歌因此渔翁得利。更糟糕的是，这家新公司是由哈萨比斯的老投资者埃隆·马斯克创立的，名叫OpenAI。


    **6 使命**


    到2015年，德米斯·哈萨比斯用了5年时间不断发展团队，迈着缓慢但稳定的步伐走在通往通用人工智能的道路上，取得了具有里程碑意义的研究成果。虽然这是一个开放的领域，但几乎没人进行相同的尝试。DeepMind的目标太过遥远，所以它能像垄断企业一样有效运作。世界上没有一家现有的公司尝试开发超越人类智能的人工智能，使哈萨比斯可以按照自己的节奏进行研究。这也使DeepMind的创始人和员工更容易把自己视作一个以使命为导向的研究实验室，而不是一家企业。在精神层面上，他们可以接受自己隶属谷歌，但仍在为了解决人类最大的问题而“破译智能”，因为他们无须像其他公司那样在无休止的竞争中疲于奔命。他们的探索独一无二。而现在，在硅谷可能有一个竞争对手出现了，这将改变一切。开发通用人工智能的探索即将变成一场竞赛。


    哈萨比斯对OpenAI了解得越多，他的愤怒就越强烈。他是世界上第一个认真尝试开发通用人工智能的人，鉴于这样的想法在5年前是多么不受待见，他几乎冒了得罪科学界的风险。更糟糕的是，新的竞争者甚至有可能盗用他的想法。OpenAI在其网站上列出了七位创始人。哈萨比斯仔细看了一下这些名字，发现其中五人曾在DeepMind当过几个月的顾问或实习生。曾与他共事的人透露，当时他就变得脸色铁青。哈萨比斯一直对DeepMind的员工毫无保留，将实现通用人工智能所需的各种策略坦白相告，比如构建自主代理，教人工智能模型玩国际象棋和围棋等游戏。现在，了解所有这些细节的五位科学家创立了一家对手公司。


    从技术层面来说，哈萨比斯大可不必如此担忧。在DeepMind之外，还有许多科研人员在从事自主代理、虚拟环境、游戏等类似的工作。这五位前员工中有一位是著名的人工智能科学家伊尔亚·苏茨克维，他专门研究深度学习，而不是DeepMind的标志性技术强化学习。苏茨克维是OpenAI的首席科学家，他和创业伙伴都对通用人工智能的发展潜力深信不疑。


    但哈萨比斯依然对萨姆·奥尔特曼厚颜聘用知晓DeepMind秘密的人感到愤怒，他开始夜不能寐。通常，哈萨比斯下班后会回家和家人共进晚餐，然后继续一天的工作，从傍晚一直持续到第二天凌晨三四点，忙于阅读文献和发送电子邮件。据知情人士透露，哈萨比斯在一些电子邮件中或深夜的会议上忧虑奥尔特曼会抄袭DeepMind的策略，并挖走科研人员。


    OpenAI承诺要将技术公开给大众使用，哈萨比斯对此表示质疑。这种“开放”似乎过于鲁莽。“我认为把‘开源’当成万灵药有点天真。”他说，“你会得到越来越强大的两用技术，但要是心怀不轨的人接近这项技术呢？……你很难控制别人的行为。”虽然DeepMind在知名期刊上发表了一些研究成果，但对其代码和人工智能技术的细节仍然讳莫如深。例如，它没有公开其开发的精通《打砖块》游戏的人工智能模型。


    在DeepMind和OpenAI工作过的人表示，DeepMind的领导层听说马斯克在硅谷到处说哈萨比斯的坏话，这更加深了哈萨比斯的屈辱感。例如，这名亿万富翁在和OpenAI的新员工谈话时，要求他们警惕DeepMind在英国的研究，并暗示哈萨比斯是一个阴暗小人。他对哈萨比斯设计《邪恶天才》的方式表示怀疑，这是一款玩家扮演恶棍试图毁灭并统治世界的游戏。他认为创造这种游戏的人可能自己也有点疯狂。OpenAI的员工在玩笑的基础上，用《邪恶天才》截图制作表情包，并通过聊天软件Slack互相分享。据一名知情的OpenAI前员工透露，马斯克一度称哈萨比斯是“人工智能界的希特勒”。


    无论马斯克攻击DeepMind的原因是什么，他都在煽动两个公司之间的激烈竞争。他还对人工智能产生了一种更偏执、更悲观的看法，这符合他把事情推向极端的倾向。例如，他本可以直接与石油公司对抗以应对气候变化，却决定将人类转变为星际物种。他本可以在他认为推特太过谨小慎微的时候购买股份，却买下了整间公司。或许马斯克习惯了采取极端行动，还喜欢夸张，又或许他深信自己是人类的救世主，但在投资DeepMind的这几年里，这位企业界大亨深深陷入了人工智能末日论的窠臼中。


    《纽约时报》报道，马斯克曾在深夜与妻子讨论这个问题，他担心谷歌联合创始人拉里·佩奇在收购了他的前投资对象DeepMind之后，会着手开发更先进的人工智能系统。马斯克和佩奇曾是亲密的朋友。他们会参加相同的高级晚宴和会议，对未来世界抱有相似的幻想。根据彭博社记者阿什利·万斯撰写的马斯克传记，如果马斯克在旧金山没有安排住处，他会打电话给佩奇询问能否在他家的沙发上凑合一晚。他们会一起玩电子游戏，畅想未来的飞行器或其他技术。马斯克认为越来越深居简出的佩奇脾气太好了。这让马斯克感到担心。马斯克在他的传记中说，谷歌联合创始人可能会在无意中创造出一些邪恶的东西，比如“一支有能力毁灭人类的人工智能增强机器人战队”。听上去马斯克像是在开玩笑，但他真的这样想。


    在佩奇以6.5亿美元收购DeepMind几个月后，马斯克在一个人工智能论坛上发布了一条消息，但很快就删除了。他说，没人意识到人工智能的发展速度有多快。“除非直接与DeepMind等公司有过接触，否则你不知道有多快。”他表示，他对某些“领先的人工智能公司”能否阻止数字超级智能逃进互联网并造成破坏持怀疑态度。


    随着马斯克陷入人工智能末日论的“无底洞”，他开始在这个问题上投入更多资金和时间。他向未来生命研究所捐赠了1 000万美元，这是一个专注于使用人工智能阻止人类灭绝的非营利组织。接着，他参加了该组织在波多黎各召开的会议，一同参会的还有拉里·佩奇、哈萨比斯，以及其他希望开发通用人工智能的人。


    在会议晚宴结束后，马斯克和佩奇发生了争论。随着争论愈演愈烈，越来越多的参会者围上来倾听。佩奇说马斯克对待人工智能的态度变得太过偏执。他得明白，人类正在朝着数字乌托邦发展，我们的大脑终将走向数字化和仿生化。如果他继续在人工智能问题上大惊小怪，就会跟不上时代的发展。


    “但你怎么能肯定超级智能不会消灭人类呢？”马斯克问。


    “你这是物种歧视。”佩奇回击道。根据《纽约时报》的报道，他显然在为未来的后人类辩护。由于太过关注灾难，马斯克无视了未来那些所谓硅基生物的需求。


    一方面，因为马斯克持续关注DeepMind的发展，并且与自诩为未来主义预言家的富人圈来往颇深，他变得越来越偏激。另一方面，他也被“错失恐惧症”所困扰，正是这种恐惧推动了硅谷的部分重大投资决策。随着人工智能研究取得新进展，比如2012年ImageNet挑战的成功，大型科技公司开始关注这一领域。不仅谷歌收购了DeepMind，马克·扎克伯格还成立了一个叫“脸书人工智能研究”的部门，并聘请世界顶尖的深度学习专家之一杨立昆负责运营。很可能正是由于这种不想错过新一轮研究“淘金热”的欲望，马斯克做出了与他的恐惧背道而驰的事情：创造更多人工智能。


    后来，马斯克在推特上表示，他之所以创立OpenAI，是因为他想“抗衡谷歌”，也因为他想更安全地开发人工智能。然而，人工智能无疑对其公司的财务增长至关重要，无论是特斯拉汽车的自动驾驶功能，还是SpaceX无人火箭的控制系统，或是支持其未来脑机接口公司Neuralink的模型。


    虽然马斯克相信末日论，并在道义上认为自己应该先于哈萨比斯开发出通用人工智能，但像谷歌一样打造强大的人工智能也有助于扩大其商业版图。这是一项“钱景”广阔的事业。只有这样才能解释他为什么同意与硅谷人脉最广的企业家之一萨姆·奥尔特曼合作，奥尔特曼曾让爱彼迎将报告里的“百万美元”改成“十亿美元”，并邀请许多具有未来感的初创公司加入Y Combinator项目，而且他与拉里·佩奇一样对人工智能抱有强烈的企图心。


    2015年5月25日，奥尔特曼给马斯克发了一封电子邮件，说首先开发通用人工智能的“不该是谷歌”。他建议启动一个“让技术属于世界”的人工智能项目。马斯克回复说：“也许值得讨论一下。”一个月后，奥尔特曼又向马斯克发了一封电子邮件，提议建立一个实验室，开发“第一个通用人工智能……安全是最重要的。”人工智能将由非营利组织拥有并“为了世界的利益”而使用。马斯克回复说：“我都赞成。”


    在奥尔特曼看来，开发一个通用人工智能系统类似于把他指导过的所有Y Combinator项目的科技初创公司，都集中到“一把巨大的瑞士军刀”里。这一强大的机器智能可能具有无限的能力。天知道当新出现的超级智能能够创造足够的财富，让地球上的每个人都腰缠万贯的时候，我们还需不需要企业或初创公司。哈萨比斯相信通用人工智能将解开科学和神明的奥秘，而奥尔特曼却将其视为通往全球经济富足的途径。奥尔特曼和马斯克讨论建立研究实验室，既是为了实现这一目的，也是为了制衡DeepMind和谷歌。


    马斯克和奥尔特曼决定另辟蹊径，将他们的新组织与大型科技公司区别开来。在努力开发造福人类的人工智能过程中，该组织将与其他研究机构合作，并向社会公开其研究成果，因此得名OpenAI。


    奥尔特曼着手组建一支创始团队。2015年夏天，他邀请10余位顶尖的人工智能研究专家在瑰丽酒店的一间包厢共进晚餐。作为一家豪华酒店，瑰丽距离硅谷一些财力雄厚的风险投资公司只有咫尺之遥。受邀者包括曾在DeepMind工作过几个月的科学家伊尔亚·苏茨克维，以及来自北达科他州的哈佛大学数学系毕业生格雷格·布罗克曼。布罗克曼是一位创业奇才，曾在Stripe担任首席技术官。


    用餐期间，奥尔特曼说这一新研究机构的目标是开发通用人工智能，然后造福世界。这群人将大部分的用餐时间花在了讨论可能性上——不是能否使用人工智能造福人类，而是在大型科技公司挖走了世界上大多数顶尖人工智能人才的情况下，能否建起这样一个实验室。现在才开始聘请该领域最优秀的科研人员是不是太迟了？'
