- raw: '为什么声称可以让人工智能未来更加安全，而不断开发更大型人工智能系统的工程师得到了如此多的资助，而试图审视人工智能的科研人员得到的资助这么少？部分原因在于硅谷执着于以最有效的方式做善事，该理念由英国牛津大学的几位哲学家提出并传播。


    早在20世纪80年代，牛津大学哲学家德里克·帕菲特就开始谈论一种新的、看似着眼未来的功利主义伦理学。他说，假设你往地上扔了一个破瓶子，100年后它划伤了一个小孩的脚。即使这个小孩当前还没有出生，但你同样会产生内疚感，仿佛那个孩子是在今天受的伤。


    “他的基本思想很简单，那就是从道德角度看，未来的人和现在的人一样重要。”戴维·埃德蒙兹说。他在2023年撰写了一本关于帕菲特的传记。“想想以下三种情况：第一，世界和平；第二，世界上80亿人口中有75亿人死于战争；第三，人类灭绝。大多数人的直觉是，第一种和第二种情况之间的差距远远大于第二种和第三种情况之间的差距。但帕菲特认为这是错的。第二种和第三种情况之间的差距远远大于第一种和二种情况之间的差距。如果人类灭绝，那就意味着未来不存在人类了。”


    以下是一种测算的方式。哺乳动物的平均物种“寿命”在100万年左右，而人类已经存在了约20万年。从理论上讲，我们还能在地球上生存80万年。联合国预测，世界人口到21世纪末将达到110亿左右。如果世界人口稳定在110亿，平均寿命延长至88岁，那么根据估计，未来地球上将会有100万亿人口出生。


    为了形象地理解这些数字，想象你的餐桌上放着一把小餐刀和一颗孤零零的豌豆。餐刀代表过去活着和死掉的人数，豌豆代表现在活着的人数，而餐桌表面代表未来活着的人数——要是人类比典型的哺乳动物物种活得更长，这个数字可能还会更大。


    2009年，澳大利亚哲学家彼得·辛格在一本叫作《你能挽救的生命》的书中进一步阐述了帕菲特的研究。他提出了一个解决方案，即富人不该只凭着自己的感觉捐款，而应该采取更理性的方式，将慈善捐赠的影响最大化，帮助更多的人。帮助尚未出生的未来人类，你的德行更加高尚。


    2011年，24岁的牛津大学哲学家威尔·麦卡斯基尔与人共同创立了一个名为“80 000小时”的组织，这些观点开始从理论进入现实世界，并形成了意识形态基础。80
    000小时是指一个人一生的平均工作时间，该组织面向美国高校的年轻大学毕业生，意图引导他们从事更具道德影响力的职业。它经常引导有技术头脑的毕业生从事人工智能安全相关的工作。但该组织也鼓励毕业生选择薪水最高的职业，这样他们就可以尽可能多地为高影响力事业捐款。


    麦卡斯基尔和他的年轻团队最后重组建立了“有效利他主义中心”，并设立了新的信条。有效利他主义背后的驱动力是效率。富裕国家的居民有义务帮助贫穷国家的居民，因为这样他们才能充分发挥财富的作用。例如，与其捐款给美国的穷人，不如通过全球性健康慈善机构帮助更多的非洲人。从道德的角度看，花时间尽力挣钱也更好，因为这样你就能像达斯汀·莫斯科维茨一样大笔捐款。麦卡斯基尔给学生讲课时会展示一张幻灯片，问他们是当医生好还是当银行家好。他自己认为当银行家更好。成为一名医生，也许能够在非洲挽救一定数量的生命，但银行家可以雇用好几名医生挽救更多的生命。


    这为毕业生提供了一个另类视角，也让他们得以重新看待现代资本主义的各种不平衡。现在，如果一套系统让少数人暴富，它并没有什么问题。因为这些人可以通过积累巨额财富，去帮助更多的人。


    这场思想运动在2012年声名鹊起，当时麦卡斯基尔联系了一名他希望招揽的人才，那就是麻省理工学院的学生、长着一头深色卷发的萨姆·班克曼-弗里德。两人边喝咖啡边聊天，结果麦卡斯基尔发现班克曼-弗里德是彼得·辛格的粉丝，对动物福利事业也很感兴趣。


    麦卡斯基尔奉劝班克曼-弗里德放弃直接从事动物事业的想法，说他如果从事高收入职业，就能够更多地帮助这些动物。


    迈克尔·刘易斯在《走向无限》一书中记录了班克曼-弗里德的人生起落，根据书中的描述，他立刻被麦卡斯基尔的说法吸引住了。“我认为他说得很对。”班克曼-弗里德说。他在一家量化交易公司找了份工作，最终于2019年创立了加密货币交易所FTX。


    班克曼-弗里德将有效利他主义放在了重要位置。他的联合创始人和管理团队都是有效利他主义者，而麦卡斯基尔一直是FTX慈善基金——FTX未来基金的成员，该基金在2022年为有效利他主义事业捐赠了1.6亿美元，其中一些捐款与麦卡斯基尔直接相关。班克曼-弗里德经常对媒体说要捐光自己的财产；在FTX的大型广告海报上，他穿着标志性的T恤和工装短裤，旁边写着：“我参与加密货币交易，因为我永远想要对世界产生最深的影响。”他把自己塑造成苦行僧，虽然腰缠万贯，但开着一辆丰田汽车，与室友合住，而且经常以蓬头垢面的形象示人。


    在许多技术专家眼里，这种对待道德的态度就像一股清流。工程师解决问题的方式通常是按部就班地测试、评估，调整代码并优化软件。现在，他们几乎也能像解数学题一样将道德困境进行量化。有效利他主义者有时会谈到通过聚焦“预期价值”使慈善行为的影响最大化。某个结果的价值乘以它发生的概率，得到的数字就是预期价值。


    随着有效利他主义在硅谷的地位日益凸显，其关注点也从购买便宜的防疟蚊帐和帮助尽可能多的非洲人转向更具科幻色彩的问题。埃隆·马斯克在推特上说，麦卡斯基尔2022年出版的著作“与我的哲学非常吻合”。为了确保人类永远延续，他想把一些人送上火星。由于人工智能系统越来越先进，为了防止其失控或消灭人类的举措合情合理。OpenAI、Anthropic和DeepMind的许多员工都是有效利他主义者。


    采取行动预防人工智能带来的灭绝风险是一种理性的计算。即使人工智能可能消灭人类的风险只有0.00001%，其代价也是人类不可承受的。微小的概率乘以无限的代价，得到的数字仍然无限大。要是你同部分人工智能安全倡导者一样，相信未来的计算机将承载几十亿人的思想意识，并创造出有感知的新型数字生活，那么这种逻辑依据就会更加有力。未来的人口数量可能比100万亿还要多。如果严格遵循这种“量化道德”，那么虽然概率微乎其微，但优先考虑拯救超过100万亿个实体和数字生命免于灭绝也是合乎情理的。相比之下，全球贫困问题就显得微不足道。


    自2015年OpenAI成立后，大量资金涌入防止人工智能末日的事业。莫斯科维茨的开放慈善增加了对包括人工智能安全研究在内的所谓长期主义事业相关议题的捐款金额，从2015年的200万美元增加到2021年的超1亿美元。


    班克曼-弗里德也加入了这一行列。他的慈善基金FTX未来基金由尼克·贝克斯特德、麦卡斯基尔等有效利他主义者运营，承诺向旨在“改善人类长期前景”的项目捐赠10亿美元。在该基金列出的关注领域中，首要便是“人工智能安全发展”。


    《纽约客》杂志在介绍FTX未来基金内部氛围时注意到，在其位于加利福尼亚州伯克利的总部，办公室里的闲聊经常会转到人工智能末日何时到来上。


    “你觉得末日何时会来临？”员工之间互相问道，“你的P值是多少？”


    P代表概率，这里是指人工智能导致世界末日风险的可能性。乐观主义者认为可能性为5%。开放慈善帮助决定资助事宜的研究分析师阿杰娅·科特拉在一档播客节目上说，可能性在20%～30%之间。


    没有人知道班克曼-弗里德心目中的P值是多少，但他非常关心人工智能安全，向Anthropic投资了5亿美元。而FTX的联合创始人、有效利他主义者尼沙德·辛格和卡罗琳·埃利森也投资了这家约一年前从OpenAI分离出来的初创公司。


    2022年初，麦卡斯基尔注意到马斯克发表了一篇推文，称他想收购推特，以保护言论自由。这位苏格兰哲学家给马斯克发了一条短信。当时，班克曼-弗里德身价达240亿美元，是全球最富有的有效利他主义者之一。但马斯克的财富高达2
    200亿美元，单凭他一人就能让有效利他主义成为世界上规模最大的慈善运动。


    麦卡斯基尔告诉马斯克，班克曼-弗里德也想收购推特，促使它“更好地造福世界”。“你们俩要不要联手？”


    马斯克回短信问：“他有巨额资金吗？”


    “这取决于你如何定义‘巨额’！”据法庭文件记载，麦卡斯基尔回答道。麦卡斯基尔表示，班克曼-弗里德可以拿出80亿美元。


    “这只是九牛一毛。”马斯克回答。


    “你想让我发短信介绍你们俩认识吗？”麦卡斯基尔问。


    马斯克没有回答。“你能为他担保吗？”他问。


    “非常愿意！”麦卡斯基尔回答，“他一直为人类长远的美好未来而奋斗。”


    “那好吧。”


    “太好了！”


    虽然最后马斯克与班克曼-弗里德取得了联系，但他们从未达成财务合作，这也让马斯克躲过了一劫。几个月过后，FTX在班克曼-弗里德以欺诈手段转移公司客户资金的传言中崩盘。检察官在庭审中指控班克曼-弗里德从数千名客户和投资者那里骗取了80亿美元，他被判数十年监禁。原来，把自己塑造成苦行僧的班克曼-弗里德一直住在巴哈马的豪华顶层公寓里，花在各种投资上的钱数以亿计。现在，他原本为有效利他主义准备的大部分资金都化为乌有，而且他实际上对此也并不怎么热衷。


    FTX破产后不久，新闻网站Vox对班克曼-弗里德进行了一次精彩的采访。


    “所以道德什么的——只是一个幌子？”记者问道。


    “是的。”班克曼-弗里德回答。


    “对于一个把任何事都看成输赢游戏的人来说，你真的很擅长谈论道德。”记者说。


    “是的。”班克曼-弗里德说，“呵呵，我情非得已。”


    FTX的垮台给有效利他主义蒙上了巨大的阴影，也预示着该运动存在根本性问题。首先可以预见的是，将尽力做好事作为一项使命，同时又追逐无限的财富，这样的人更容易腐败并做出鲁莽、自大的判断。举例来说，收购推特与长期帮助人类没有任何关系，但班克曼-弗里德打着有效利他主义的旗号，准备出资80亿美元和马斯克一起收购该网站，并站到了这位世界上最富有的人身边。


    FTX崩盘后，麦卡斯基尔试图缓解此事带来的影响。他在推特上写道：“思维清晰的有效利他主义者应该强烈反对‘为达目的不择手段’的逻辑。”然而，这场运动本质上就是在以物质激励像班克曼-弗里德这样的人不惜一切手段达到他们的目的，即使这意味着剥削他人。这也造成了一种短视，甚至影响了像麦卡斯基尔这样聪明的牛津大学学者，他明明知道加密货币业务往好了说是投机，往坏了说就是危险的赌博，但还是选择依附一个加密货币交易所经营者。


    班克曼-弗里德可以为他的两面派作风找理由，因为他在努力实现使人类幸福最大化这一更大的目标。马斯克可以否认自己的不人道行为，无论是在推特上毫无根据地称别人是恋童癖者，还是他的特斯拉工厂被指存在广泛的种族主义，因为他在追求更有价值的目标，比如把推特变成言论自由的乌托邦，让人类成为星际殖民者。OpenAI和DeepMind的创始人也可以用类似的方式，为他们越来越支持大型科技公司的做法做出辩解。只要最终实现了通用人工智能，他们就会给人类带来更大的福祉。


    奥尔特曼、哈萨比斯等技术专家很清楚，他们希望用通用人工智能解决的社会问题麻烦又复杂。这就是他们部分或全部接受有效利他主义的原因。因为它为解决道德问题提供了一条更简单、更理性的途径，同时还允许他们尽可能多地赚钱。富人越来越富不是全球贫困的原因，而是解决办法。


    然而，这也使他们更容易脱离人性。有效利他主义者中间流行一句口号，叫作“闭上嘴，然后成倍增加”，意思是说进行道德决策时应把个人情绪或道德直觉放在一边，以便实现产出的最大化。就有效利他主义者对人类的全部贡献而言，他们中的许多人都像奥尔特曼一样，因过于专注自身的使命而断开了与周围世界的情感连接。在有效利他主义的泡沫中，他们一起工作，共同社交，互相资助，甚至谈情说爱。


    在开放慈善承诺向OpenAI提供3 000万美元的2017年，该慈善组织被迫透露它正在从达里奥·阿莫迪那里获得技术建议，后者当时是OpenAI的高级工程师。它还承认，阿莫迪和开放慈善的执行董事霍顿·卡诺夫斯基处于同居状态。该组织还进一步承认，卡诺夫斯基已经和阿莫迪的妹妹、同样在OpenAI工作的丹妮拉订婚。他们都是有效利他主义者。这个圈子里的人际关系真是错综复杂。


    有效利他主义运动封闭狭隘，而且越来越不透明，OpenAI、DeepMind、Anthropic等人工智能公司及其员工追随者也是如此。为了阻止人工智能失控，也许这些公司能做的最大的一件好事，就是让它们的人工智能系统更加透明，就像格布鲁和米切尔再三呼吁的那样。毕竟，如果研究人员几十年来一直无法研究人工智能的训练数据和算法，如果未来的人类缺少审查人工智能机制的专业知识，他们又怎么能阻止人工智能失控呢？换句话说，人工智能伦理倡议者现在争取的透明度，也将解决未来人类面临的灭绝威胁。


    OpenAI认为，保密可以防止不法分子滥用其技术，但这种说法站不住脚。2019年11月，它自称没有“发现滥用的有力证据”，并以此为由发布了GPT-2。如果真是这样，那为什么不公开具体的训练数据呢？更大的可能是，奥尔特曼想让OpenAI避开竞争和法律诉讼。假使OpenAI提高透明度，竞争对手（而不是不法分子）将更容易模仿他们的模型，也更容易揭露OpenAI在多大程度上抓取了受版权保护的作品。


    奥尔特曼和哈萨比斯在创立自己的公司时都肩负帮助人类的宏伟使命，但他们究竟给社会带来了什么好处，就像互联网和社交媒体的有利方面一样说不清楚。而他们给微软和谷歌带来的好处却显而易见，那就是更棒的新服务，以及在欣欣向荣的生成式人工智能市场上占据的一席之地。


    微软已经在Windows、Word、Excel以及商业软件Dynamics 365等服务中广泛应用由OpenAI进行技术支持的人工智能助手Copilot。分析人士估计，到2026年，OpenAI的技术将为微软创造数十亿美元的年度收入。2023年底，纳德拉在与奥尔特曼同台时，被问及微软与OpenAI的关系如何，他忍不住大笑起来。昭然若揭的答案显得这个问题非常好笑。它们的关系当然好到不能再好。


    微软乐于将越来越多的资金投向OpenAI不断增长的人工智能业务，并计划从2024年开始投入超过500亿美元扩展其庞大的数据中心，以确保为生成式人工智能提供动力。这也将成为历史上最大的基础设施建设之一，因为微软的相关支出超过了铁路、水坝和太空计划等政府项目。


    到2024年初，从媒体到娱乐公司，再到交友软件Tinder，各行各业都在自己的应用和服务中加入了新的生成式人工智能功能。生成式人工智能市场预计将以每年35%以上的速度增长，并将在2028年达到520亿美元。娱乐公司表示它们可以更快地为电影、电视节目和电脑游戏制作内容。梦工厂动画联合创始人、《怪物史莱克》和《功夫熊猫》的制作人杰弗瑞·卡森伯格说，生成式人工智能将使动画电影的制作成本降低90%。“在过去，你可能需要500名艺术家和多年的时间才能制作一部世界级的动画电影。”2023年11月，他在彭博社举办的一次会议上说，“我认为在未来3年内，制作同等级别的电影所需投入的成本不到过去的10%。”


    生成式人工智能会将广告的个性化提升到可怕的程度。过去许多年里，广告一直以大型群体为目标；现在，它们可以精准地锁定个体，投放高度个性化的视频广告，甚至知道每个用户的名字。世界经济论坛认为，大语言模型将改善需要批判性思维和创造力的工作。从工程师到广告文案撰写人，再到科学家，人人都可以把它们当成大脑的延伸。政府也在升级人工智能系统用于评估福利申请、监控公共场所以及判断犯罪可能性。


    谷歌、微软和新一代初创公司都在竞相全力争抢这些新业务，寻求优势超越竞争对手。《快公司》在2023年底进行的一项调查显示，接近一半的美国公司董事会成员认为，生成式人工智能是其公司的“首要任务”。例如，约会软件Bumble的首席执行官这样描述该公司2024年的主要计划：“我们非常想要大力发展人工智能，人工智能和生成式人工智能可以在加快交友配对方面发挥重要作用。”


    Bumble想利用ChatGPT背后的技术开发个性化红娘。你无须在应用程序上勾选一堆选项，而只需告诉它你对伴侣的要求——从孩子到政治观点，再到周六早上的例行日程。人工智能红娘之间会相互“交谈”，匹配最合适的Bumble用户。你不再需要花时间浏览数百位不同人选的信息，人工智能可以帮你做这些。


