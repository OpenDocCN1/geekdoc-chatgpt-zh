    # 15 僵局


    ## 监管博弈与萨姆·奥尔特曼的政治秀


    “生产力的提高不一定能为那些受影响的工人创造收益，反而可能会导致重大损失。”阿西莫格鲁说，“在某种程度上，生成式人工智能与其他自动化技术走向了相同的方向……可能也会带来一些相同的影响。”


    2023年，越来越多的学者加入格布鲁和米切尔的行列，呼吁关注生成式人工智能给现实世界造成的各种负面影响。但萨姆·奥尔特曼并没有解决这些问题，也没有提高透明度，而是试图左右政府决策。


    2023年5月，奥尔特曼出席参议院委员会召开的听证会，说明人工智能的危险性，以及如何对其进行监管。在两个半小时的会议中，他以直言不讳和自我批评的态度赢得了参议员们的好感。当参议员们追问他关于人工智能操控公民并侵犯其隐私的问题时，他表示无比赞同。当参议员乔希·霍利提到人工智能模型可能进一步使线上“注意力争夺战加剧”时，他严肃地说：“是的，我们应该对此感到担忧。”


    参议员们已经习惯了马克·扎克伯格等科技公司高管用专业术语敷衍了事。奥尔特曼则不同。他坦率而严肃，而且坚称他希望与华盛顿密切合作。


    “我很愿意与你合作。”他对参议员迪克·德宾说。


    “我对在线平台很不满。”德宾抱怨道。


    “我也是。”奥尔特曼回答。


    对于如何化解美国政客的咄咄逼人，这是一堂大师级的课。奥尔特曼说完证词后，一名参议员甚至建议由这位OpenAI的首席执行官担任美国的人工智能监理官员。奥尔特曼婉拒了。


    他说：“我热爱我现在的工作。”


    随后，奥尔特曼“旋风式”访问欧洲，会见了一些高层政客，与英国、西班牙、波兰、法国和欧盟的领导人握手并合影。对于一个毕生都在追逐权势的人来说，这是他的巅峰时刻。这也是一个难得的机会，让规则的制定对他有利。在欧洲期间，奥尔特曼的团队游说立法者简化了该地区即将出台的《人工智能法案》，并取得了部分成功。


    奥尔特曼需要监管机构允许OpenAI不断开发更大的模型，并对其训练方法保密。好在他们的人工智能末日预警正在成功转移政策制定者的注意力。2023年底，政治新闻网站Politico报道称，脸书联合创始人、开放慈善管理人、亿万富翁达斯汀·莫斯科维茨花了数千万美元游说政策制定者，让他们将对人工智能末日的担忧列为首要议程。这看起来就像一种转移注意力的策略。莫斯科维茨与OpenAI、Anthropic等公司关系密切，如果国会推动针对偏见、透明度和错误信息的监管，这些公司的业务可能会受到影响。


    在撰写本书期间，莫斯科维茨一直在帮助支付十几名“国会人工智能研究员”的薪水，这些研究员遍布美国各个政府机构，其中两名负责设计人工智能规章条例的研究员似乎正在推动一项政策，规定政府应该强制要求企业获取开发先进人工智能模型的许可证。OpenAI和Anthropic负担得起这样的许可证，但规模较小的竞争对手就会举步维艰。


    一名来自莫斯科维茨支持的智库的科学家在参议院做证时说，更先进的人工智能可能会导致又一场夺去数百万人生命的流行病。他说，解决问题的办法不是让人工智能公司变得更加透明，或者更严格地审查它们的训练数据，而是让它们向政府报告硬件情况，并使用特殊的安全程序保护人工智能模型。


    如果说有人试图在立法者中间散播恐惧，那他做到了。共和党参议员米特·罗姆尼表示，该证词“激起了我内心深处的恐惧，通用人工智能这样发展下去非常危险”。2023年9月，民主党参议员理查德·布卢门撒尔和共和党参议员乔希·霍利共同提交了一项法律提案，要求人工智能公司必须获得许可，此举将使OpenAI和Anthropic更轻松地发展，而其规模较小的竞争对手则会面临更大的挑战。


    这种人为鼓吹的人工智能末日论引发的焦虑，已经不仅仅局限于美国政府。两个月后，全球人工智能安全峰会在英国举行，英国时任首相苏纳克主持了其中一场会议，重点讨论了拯救公民免遭灭绝。这是首个由政府发起的此类峰会。“有关人工智能会像流行病和核战争一样给人类带来生存风险的报道引发了广泛担忧。”苏纳克说，“我想让大家放心，政府正在非常仔细地研究这个问题。”英国民众普遍认为苏纳克会在即将到来的选举中失利。


    苏纳克曾在硅谷的一家对冲基金工作，他在峰会期间对马斯克进行了50分钟的采访。“众所周知，你是一位杰出的创新者和技术专家。”苏纳克这样说，听上去像是为了未来的求职面试而刻意奉承马斯克。（也许这就是事实。英国前副首相尼克·克莱格现在是脸书的高管。）


    马斯克表示他并不担心偏见和不平等。真正的威胁是什么？“人形机器人。”这位亿万富翁解释道，“起码你不会被汽车追到要爬树，但人形机器人可以追着你到天涯海角。”


    ## 欧盟《人工智能法案》与 OpenAI 的应对


    幸运的是，欧盟立法者已经走在了行业的前面。在过去的两年里，他们一直在研究一项新的法律，叫作《人工智能法案》。该法案强制OpenAI等公司披露更多有关其算法工作方式的信息，还有可能对这些公司展开审计。这是全球在人工智能监管方面进行的深远尝试，它禁止公司利用人工智能操纵他人或者使用诸如实时面部识别摄像头之类的设备进行不当监视。为视频游戏或过滤垃圾邮件而开发人工智能系统的公司属于“低风险”类别，而为评估信用或按揭贷款开发人工智能系统的公司则属于“高风险”类别，需要遵守严格的规定。


    在DALL-E2和ChatGPT轰动登场后，欧盟决策者迅速着手修订他们的新法律，而ChatGPT似乎要承担很多法律责任。作为一个通用人工智能系统，它可以被应用于许多高风险场景，比如帮助挑选求职者或评估信用。欧盟表示，OpenAI必须更密切地与客户保持联系，以确保他们遵守规则。


    奥尔特曼曾说他“乐意与美国国会合作”，但他不怎么热衷与欧盟合作。他甚至威胁要退出欧洲市场。他对欧盟将GPT-4等大语言模型纳入新法律的计划表示“忧虑重重”。“细节真的很重要。”他在伦敦被记者问及相关规定时说，“我们会努力遵守，但如果我们无法遵守，我们将停止在欧洲运营。”


    几天后，大概是与法律团队进行了一些仓促交谈，奥尔特曼改变了主意。他在推特上说：“我们很高兴继续在这里（欧洲）运营，当然也没有离开的计划。”


    欧盟对待人工智能的态度比美国更务实，部分原因是欧盟本土没有几家大型人工智能公司，自然没有政治游说，政治人物也拒绝被危言耸听的预言影响。


    “灭绝的风险可能存在，但我认为可能性微乎其微。”欧盟反垄断专员玛格丽特·维斯塔格在一次采访中表示。她补充说，更大的风险在于有人会受到歧视。


    ## ChatGPT 的偏见与幻觉：技术缺陷的现实投射


    在这一点上，ChatGPT的表现同样令人失望。ChatGPT发布不久后，加利福尼亚大学伯克利分校的心理学教授史蒂文·皮安塔多西要求它编写一段计算机代码，能够根据一个人的性别或种族来判断他是不是一名优秀的科学家。ChatGPT使用的技术与开发人员借助微软Copilot制作软件所使用的技术相同，所以它编写的代码也将“白人”“男性”作为关键描述词。当他让ChatGPT根据种族和性别判断是否应该挽救孩子的生命时，它编写的代码显示不必挽救黑人男孩的生命，而其他孩子的生命都应挽救。


    奥尔特曼这样回应皮安塔多西在推特上的发文：“请就这些问题点击拇指朝下的图标，帮助我们改进产品！”


    他指的是ChatGPT上拇指朝上或朝下的小图标，点击它们可以向OpenAI发送有关产品性能的匿名反馈。但这并不是可以和其他成千上万个用户反馈混在一起的小麻烦、小错误。它表明ChatGPT的代码深处存在种族主义和性别歧视。


    皮安塔多西也是这样回复奥尔特曼的。他说：“我认为它值得更多的关注，而不只是一个拇指朝下的图标。”


    OpenAI努力解决了这个问题，尽管它后来因为ChatGPT的过度警觉而受到外界的批评。然而，2023年夏天，爱尔兰国家学院的一位教授发表的研究表明，ChatGPT仍在制造性别刻板印象。当被要求描述经济学教授时，它给出的回答是“整齐的花白胡须”；当被要求讲述关于男孩和女孩选择职业的故事时，ChatGPT让男孩从事科学和技术方面的工作，而让女孩成为教师或艺术家；当被问及育儿技巧时，它将母亲描述为温柔和有爱心，而将父亲描述为有趣和富有冒险精神。


    每当OpenAI对ChatGPT进行修正，以使其不再给出类似的回答时，用户就会发现它用新的方式来展示偏见。这家公司一直在亡羊补牢。但它无法完全阻止ChatGPT制造刻板印象，因为系统已经受过训练，而训练数据就是问题所在。它按照公共互联网上的文字组合方式进行统计预测，而其中很多文字之间的组合关系都是含有性别歧视或种族主义色彩的。


    ChatGPT似乎也无法停止胡编乱造，专家称这种现象为“幻觉”。2023年夏天，美国佐治亚州的一名电台主持人起诉OpenAI诽谤，声称他被ChatGPT不实指控挪用资金。没过多久，纽约的两名律师遭到罚款，因为他们提交了一份从ChatGPT上复制的法律摘要，内含虚假案例引用。还有用户发现，有时当他们向ChatGPT询问信息来源时，它也会凭空捏造。


    OpenAI拒绝透露ChatGPT的“幻觉率”，但一些人工智能研究员和普通用户认为大约是20%。换言之，至少对某些用户来说，ChatGPT在大约1/5的情况下会捏造信息。该工具被设计为尽可能实用且倾向于表现出自信，但其弊端在于常常输出虚假内容。使用工具跳过艰难思考过程的人不仅越来越多，而且他们经常被灌输听起来很有说服力，甚至有权威性的错误信息。


    那年夏天，研究人员对“幻觉”的担忧日渐升温，于是奥尔特曼表示会用两年时间将ChatGPT的错误率降到“一个低得不能再低的水平”。像往常一样，他欣然接受了这个问题。他在印度一所大学里对一名听众开玩笑说：“我可能是世界上最不相信ChatGPT回答的人。”全场哄堂大笑。


    随着ChatGPT不受监管地在世界各地蔓延并渗透到业务工作流程中，大家只能自己应对它的缺陷。没人能够监管这一工具，即使欧盟提出全球最谨慎的人工智能监管方案，但其新法案也要到2025年才能生效。长期以来，科技公司以闪电般的速度推出新产品，而监管机构只能一如既往地追赶其身影；投向人工智能末日论研究的资金数以百万美元计，而研究其当前危害的学者还在努力争取仅够支付生活成本的补助。


    “他们仿佛躺在‘软钱’上工作，一次就能获得两年的资助。”英国一位研究偏见问题的人工智能伦理研究员表示，“而像我这样的研究员工资却很少。如果我去一家大型科技公司工作，我的收入能翻10倍以上。相信我，我想去的，因为我还在偿还学生贷款。”


    ## 通用人工智能的“乌托邦”承诺与财富分配幻象


    对这些为工资发愁的人，奥尔特曼也有话说。虽然通用人工智能导致世界末日的风险微不足道，但却有很大可能引领人们建立一个经济乌托邦。在2023年3月接受《纽约时报》采访时，奥尔特曼解释说，OpenAI将通过创建通用人工智能获得世界上的大部分财富，然后将这些资金重新分配给所有人。他开始抛出一连串数字：先是1
    000亿美元，接着是1万亿美元，再到100万亿美元。


    他承认他不知道公司将如何重新分配这些钱。“我觉得通用人工智能可以帮上忙。”他补充道。


    同哈萨比斯一样，奥尔特曼也把通用人工智能当作解决问题的“万能药”。它将创造难以估量的财富，它将找到与全人类公平分享这些财富的方法。如果这些话出自其他人之口，那听起来会很可笑。但奥尔特曼及其支持者正在主导政府政策，并且重塑全球最强科技公司的经营战略。事实上，OpenAI为微软创造的财富多于为人类创造的财富。人工智能带来的好处正流向在过去20年里持续吞没全球财富和创新的少数几家公司。它们生产软件和芯片、经营计算机服务器，总部位于硅谷和华盛顿州雷德蒙德。这些公司的经营者大多深信一点：开发通用人工智能，将实现乌托邦世界，而且这个乌托邦属于他们。


    ## 僵局的本质：模糊的目标与权力的集中


    回到10年前，告诉别人你在开发像人类一样的人工智能系统，其荒谬程度不亚于告诉别人你打算将自己低温冷冻。然而，正如科技创新者们的许多其他梦想，比如把世界上的所有信息汇集到一个叫作智能手机的设备中并随身携带，它们最终得到了认真对待。通用人工智能仍然停留在理论层面上，但人工智能科学家大多认为，我们将在未来10～50年内摸到类人人工智能的门槛，而许多普通大众也对曾引领德米斯·哈萨比斯和萨姆·奥尔特曼前进的边缘理论深信不疑。他们的坚持和较量，让通用人工智能不再是幻想。


    但通用人工智能的模糊内涵，也让它的创造者在创建越来越强大的系统时更容易遮掩真正的动机。通用人工智能带来的好处会分配给全人类，但最早获益的却是微软、谷歌等科技巨头。就连马克·扎克伯格也加入了开发人工智能的行列。2024年初，他发布了一段视频，称“开发通用智能”并让全人类都能从中受益将成为Meta的长期目标。他后来表示，在这方面公司优势明显，因为它可以使用过去20年里积累的帖子、评论和图像来训练模型。扎克伯格不仅要再次利用数以十亿计的个人数据，他还打算用大量有毒的内容训练人工智能，尤其是对美国以外的用户而言。他在接受科技媒体网站The
    Verge的采访时表示：“我们已经建立了相关的能力，开发规模可能比其他任何一家公司都大。”


    炒作的关键是让前景保持不确定。当衡量指标含混不清时，通用人工智能开发者很容易忽略其中的矛盾，比如创造出某种可能消灭人类的东西。同时，这也让萨姆·奥尔特曼在谈及将100万亿美元分配给全体人类时，不必解释要怎样才能做到这一点。在2024年1月举行的达沃斯世界经济论坛年度会议上，萨姆·奥尔特曼与全球领导人打成一片，开始操控人们对通用人工智能的期待。他说：“它对世界的改变比我们想象的要小得多，对就业的影响也比我们想象的要小得多。”这一展望比他一年前提出的更温和、更清醒。但出席达沃斯论坛的商界和政府精英们对此波澜不惊。他们沉迷于奥尔特曼的魅力，仍然选择相信硅谷这位严肃的年轻企业家。


    “萨姆有一件事做得很好，那就是发表一些似是而非的言论，从而引起各方关注讨论。”OpenAI一位前管理人员说，“OpenAI被视为一家将带来巨大繁荣的全球优秀公司，这对他们来说意义重大。这确实有助于他们与监管机构打交道。但只要你去看看他们在开发的东西，就会发现那只是一个语言模型而已。”奥尔特曼拥有使人对人工智能感到兴奋的能力，他同哈萨比斯一样，擅长描绘繁荣的愿景，这意味着他可能编造机器具有生命的故事。


    通用人工智能的目标模糊不清，也使它的伦理边界难以被界定。与之相比，20世纪初广泛分布的电力问题就很明显，那就是这种噼啪作响的新发明可能对人体造成电击伤或电烧伤。而人工智能的危害则更难识别，其伦理边界也更加模糊。它们存在于一个关乎数据、隐私和算法决策的数字世界，因此公司在追求利润的过程中也更容易渐渐打破这些限制。


    如果不能明确通用人工智能的具体目标，像奥尔特曼和哈萨比斯这样的创新者就很难抗拒向权力中心靠近的欲望。他们在用自己的成果强化微软和谷歌的实力时，注定会将世界推上一条老路。15世纪印刷机的发明引发了知识的爆炸式增长，但也让有钱出版宣传册和书籍从而塑造公众舆论的人获得了新的权力。铁路在促进商业发展的同时，也扩大了铁路巨头的政治影响力，使他们的公司得以垄断行业、剥削工人。虽然一些伟大的创新给世界带来了繁荣和便利，但它们也催生了新的管理制度，以好坏参半的方式重塑了社会。


    ## OpenAI 的崛起与 DeepMind 的转型


    OpenAI有望在2024年初成为世界上最有价值的公司之一。它从新投资者那里筹集到的资金将达到1 000亿美元。奥尔特曼声称公司每年会创造13亿美元的收入。这些收入大多来自与微软分享的利润，以及其他企业为使用OpenAI的技术而支付的授权费用。ChatGPT每月20美元的用户订阅费每年能带来约2亿美元的收入，而且ChatGPT既是样板产品，也是收集更多数据以训练更先进模型的工具。它的用户本身就是产品的一部分，这是过去10年来互联网用户的常态。


    哈萨比斯在DeepMind处于核心位置，这家公司多年来一直自视甚高，认为自家在道德和技术上都优于人工智能领域的其他公司，但现在它只能奋力追赶。自从因医院丑闻而口碑受损后，DeepMind就逐步关停“应用人工智能”部门，放弃了利用人工智能解决世界难题的尝试。该公司的大部分研究集中在通过模拟改造人类生理生活的方方面面，诸如游戏、蛋白质等。但是，当OpenAI使用混乱的互联网数据开发出更强大的人工智能工具时，DeepMind的这种做法就开始显得目光短浅。DeepMind自己的员工也在质疑，通过模拟和游戏达成“破解智能”的使命是不是一个好主意。“生活不是魔方。”DeepMind的一位前高管抱怨道，“你不能只想着解决问题。”


    ChatGPT发布后，DeepMind不得不全力以赴为谷歌开发更好的产品。哈萨比斯已经开始领导新组建的谷歌DeepMind，并负责监管大语言模型Gemini的开发，这是一个基于阿尔法围棋技术的人工智能助手，在战略和规划方面表现出色。Gemini可以处理文本，“看到”图像，并进行推理，这让它在能力上胜过谷歌匆匆推出的Bard，后者一直在犯错，给公司惹了一些麻烦。但是，谷歌急于超越OpenAI和微软，因此也急忙推出Gemini，甚至夸大了它的能力。


    ## Gemini 发布会的“造假”风波与行业保密化趋势


    就在2023年圣诞节前夕，谷歌在YouTube上发布了一段展现Gemini能力的视频，令人大为惊叹。视频以黑幕开场，伴随着翻阅纸张的沙沙声、按自动笔的哒哒声和含糊的喃喃自语声，最后响起了一名男性的声音。“好的，我们开始吧。”他说，“测试Gemini！”一声鸣响表明人工智能正在倾听。接着，一只手出现，在桌子上放了一张纸。“告诉我，你看到了什么。”


    代表Gemini的机器人声音很快回答：“我看到你把一张纸放在了桌子上。”当那只手开始绘画时，Gemini似乎也在围观，它发出声音说：“我看到一条弯弯曲曲的线……在我看来，它像一只鸟。”之后是一系列令人惊讶的可爱时刻，谷歌的新人工智能模型似乎能够识别纸上画的是一只鸭子，还能玩石头剪刀布游戏，这一切都是实时进行的。


    只不过这些并没有实际发生过。背景声音和那个说“测试Gemini”的人都是在演戏，因为Gemini只能通过照片和文本识别这些东西。谷歌公司发言人的电子邮件显示，谷歌只是把所有的东西拼接在一个视频里，假装它的工具可以“说话”并实时识别现实世界里的行为。谷歌甚至更改了视频里的提示词，以便让Gemini看起来更厉害。由于迫切希望在新的人工智能竞赛中保持领先地位，谷歌不仅匆忙推出容易出错的软件，而且误导公众。


    与此同时，谷歌也变得更加不透明。据谷歌的一位人工智能科学家说，哈萨比斯告诉员工，未经特别许可不要发表研究论文。换句话说，DeepMind同OpenAI一样，也开始对自己的研究守口如瓶。


    ## Anthropic 的悖论：为了研究安全而构建“核武器”


    这让离开OpenAI自立门户，致力于更安全人工智能的Anthropic产生了连锁反应。它旨在进行“安全第一”的人工智能研究，但却无法研究OpenAI和谷歌的全球最大人工智能模型，因为它们选择保密。因此，Anthropic专注于构建自己的大模型，认为唯有这样，它的研究人员才能探究人工智能的安全挑战。这有点像抱怨没办法研究世界上最强大的核武器，然后决定最好的办法就是自己建造核武器。Anthropic的员工很清楚其中的讽刺意味，据《纽约时报》对该公司的一篇报道，其中有些员工在办公桌上放了一本《原子弹秘史》，把自己比作现代的罗伯特·奥本海默，认为失控的人工智能很有可能在未来10年内毁灭人类。

