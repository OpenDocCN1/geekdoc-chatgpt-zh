    # Act One: Origins


    Brockman later recalled on Lex Fridman''s podcast: "We also knew our resources
    would pale in comparison to Big Tech." But if they really established such an
    organization, how could they choose an organizational structure to ensure the
    AI developed would benefit humanity? "Obviously, only a nonprofit lacks the competing
    incentives that could undermine its mission."


    On the ride home in Altman''s car, Brockman said that although it felt surreal,
    he agreed to join. After all, in Silicon Valley, even the most inconceivable ideas
    can find a way to grow and thrive.


    Brockman immediately began preparing the necessary steps to found OpenAI, leaving
    a deep impression on Altman, a self-described workaholic. This was a man who replied
    to emails every five minutes on average; presumably, he would devote his entire
    being to the cause just like Altman. Altman later said: "He was all in." On the
    matter of founding OpenAI, Brockman became the point person.


    Next, Brockman was responsible for poaching a batch of tech talent from Google,
    Facebook, and other companies, and made contact with Yoshua Bengio, a professor
    at the University of Montreal and one of the "godfathers" of the deep learning
    movement. Brockman didn''t expect to hire Bengio; he wanted the professor to tell
    him who the most promising scientists in AI were. Bengio printed a list and sent
    it to Brockman.


    Hiring these people wouldn''t be easy. Some were earning seven-figure salaries
    at Google, Facebook, and the like, while Altman and Brockman couldn''t offer comparable
    packages. All they had was an intense mission to change the world and two famous
    figures operating behind the scenes. Elon Musk was now a globally revered business
    titan, and leading Y Combinator had elevated Altman''s status in Silicon Valley
    to someone everyone wanted to know. For AI research experts, even working briefly
    at this newly established nonprofit could yield extensive networks and potential
    career opportunities, making a pay cut worth it.


    Several top scientists on Brockman''s list decided to interview with him for the
    job. Besides the celebrity effect and the future vision, they valued the new organization''s
    promise of "openness." According to former OpenAI employees, they would have the
    opportunity to publish their final research results, rather than secretly developing
    corporate products; some also believed that Google and DeepMind were striving
    to develop AGI for profit, and OpenAI could become a force to counterbalance that
    profit motive.


    To seal the deal, Brockman took several scientists to a winery to negotiate. If
    Sutskever agreed to join, that would be the biggest coup. They discussed many
    things about building an AI lab: that the lab must be completely free from corporate
    constraints, that it must "open source" research results—making them freely available
    to the public—and how this would prevent large tech companies like Google and
    Facebook from exerting control as AI grew more powerful. Almost all the scientists
    agreed to join OpenAI, including that seemingly unsmiling genius scientist, Sutskever.
    He grew up in Russia and Israel, had worked with famous deep learning pioneer
    Geoffrey Hinton, and now he would leave "Google Brain" for OpenAI.


    In December 2015, a team of a dozen scientists traveled to Montreal, Canada, for
    the annual AI conference "Neural Information Processing Systems" (NIPS, now NeurIPS),
    announcing the establishment of the new research lab. Amidst heavy snow falling
    outside the venue, team members introduced their new lab to other attendees. The
    real launch, however, happened online—OpenAI.com appeared out of nowhere, and
    Brockman and Sutskever jointly published an article on the website introducing
    the lab''s project. They wrote: "Our goal is to advance digital intelligence in
    the way that is most likely to benefit humanity as a whole, unconstrained by a
    need to generate financial return."


    The lab secured a staggering $1 billion in investment from Musk, Thiel, Altman,
    Hoffman, Jessica Livingston, and Amazon''s cloud computing division, with Musk
    and Altman serving as co-chairs. Insiders revealed that Musk planned to fund OpenAI
    with Tesla stock, just as he had proposed for his acquisition of DeepMind years
    earlier. Hearing this news, hundreds of attendees at the NIPS conference were
    stunned. Many thought developing AGI was a pipe dream, but some were green with
    envy. Over the past 10 years, big tech companies had been poaching top computational
    science talent from universities, causing the best AI experts today to serve corporate
    interests. In reality, a pipeline had formed from elite universities straight
    to Google, Facebook, or Amazon. This was a chronic issue that had existed for
    years.


    "No one can turn down a salary that doubles or triples. I couldn''t, and neither
    could my colleagues," said Maja Pantic, a computer science professor at Imperial
    College London. She joined Samsung Electronics in 2018 as Research Director of
    their AI Center, later moving to Meta (formerly Facebook). Those outstanding scientists
    couldn''t refuse either: Hinton now works for Google; Fei-Fei Li left Stanford
    for Google; Yann LeCun works for Facebook; Andrew Ng left Stanford for Google,
    then for China''s Baidu. Even top schools like Stanford, Oxford, and MIT struggle
    to retain their star scholars, resulting in a hollowing out of the educational
    workforce. AI research has become increasingly secretive and more profit-oriented.
    This is why Musk and Altman''s push for open research was so refreshing to researchers.
    Finally, someone was going to solve the problem of big companies monopolizing
    AI knowledge.


    There are two reasons for the university brain drain. The first and most obvious
    is compensation. At the University of Toronto, where "AI Godfather" Geoffrey Hinton
    once worked, computer science professors earn about $100,000 a year. The university''s
    highest earners make about $550,000 annually—that''s the "ceiling." Hinton''s
    star student, Sutskever, never even considered academia. After working at Hinton''s
    startup for a while, he joined "Google Brain" directly. According to *The Deep
    Learning Revolution*, OpenAI offered Sutskever $2 million a year, but "Google
    Brain" offered three times that.


    The second reason is that AI research experiments require data and computing power.
    Universities typically have a limited number of GPUs (Graphics Processing Units).
    GPUs are powerful semiconductors made by Nvidia; most servers used to train AI
    models today require GPUs. While in academia, Pantic managed to purchase 16 GPUs
    for her 30-person research team. But with so few chips, training an AI model took
    months. "It was absurd," she said. But shortly after joining Samsung, she had
    access to 2,000 GPUs. This increased processing power meant training an algorithm
    took only days, and research could accelerate.


    For scientists who remained in academia, escaping the influence of big tech became
    increasingly difficult. A 2022 study showed that over the past 10 years, the number
    of academic papers affiliated with big tech companies had more than doubled, accounting
    for 66%. The study was conducted by researchers from multiple universities, including
    Stanford and University College Dublin. It showed that big tech''s influence is
    growing "using the same strategies as Big Tobacco." This in turn affects how universities
    measure the success of AI research. Abeba Birhane, who led the study and is now
    a senior fellow at the Mozilla Foundation, said scholars no longer focus on values
    like human welfare, justice, and inclusivity, but tend to pursue better performance.


    Birhane said welfare and inclusivity aren''t just empty concepts. They are measurable.
    "They may be abstract, but so are efficiency and performance," she added. "People
    have found ways to measure fairness, privacy, and so on." Birhane pointed out
    in another collaborative study in 2023 that what''s worse is that researchers,
    whether in universities or tech companies, are too focused on making their AI
    bigger and more capable, increasing the risk of these models producing racist
    or sexist results. "We found that as dataset sizes grow, hate content increases
    as well."


    However, scale is critical to big tech''s influence in AI. Google and Meta possess
    trillions of data points for training models, while managing massive computer
    clusters spanning hundreds of thousands of square feet ^(⁵).


    To improve AI, the more data the better. The research Sutskever and his team initiated
    at OpenAI focused more on AI model capabilities than on fairness, privacy, etc.
    Simply put, this approach had a playbook. If you train AI models with ever more
    data, increase model parameters, and boost computing power for training, the models
    become more proficient. This is the striking correlation Professor Andrew Ng noticed
    during experiments at Stanford. It doesn''t matter what the model is designed
    to do. Just turn all the knobs up, and it translates languages more accurately
    or generates text more humanly.


    Sutskever once said at an AI conference: "If you have a very large dataset and
    a very large neural network, success is guaranteed." That second half became his
    signature quote among AI scientists, especially after OpenAI held a grand launch
    event. This new nonprofit, led by a brilliant scientist and several Silicon Valley
    heavyweights, ignited fresh enthusiasm across the field for its philosophy.


    But before long, problems emerged. OpenAI didn''t immediately receive the $1 billion
    funding commitment announced by Musk, Thiel, and others in December 2015. Tech
    news site TechCrunch scrutinized OpenAI''s federal tax filings and wrote an investigative
    report. The report showed that over the next few years, the nonprofit actually
    raised only about $130 million in donations.


    OpenAI not only lacked funds but also lacked a clear direction. The founding team
    of 30 researchers initially worked out of Brockman''s apartment in San Francisco''s
    Mission District—some at the dining table, some sunk into the sofa with laptops
    on their knees. A few months later, Dario Amodei, a senior researcher from "Google
    Brain," came for a visit. He asked pointed questions. For example, what exactly
    did OpenAI''s commitment to developing friendly AI and opening its source code
    entail? Altman countered in a *New Yorker* column that they didn''t intend to
    open all source code.


    "But what is it for?" Amodei pressed.


    "I''m not sure either," Brockman admitted. Their goal was to ensure AGI progressed
    smoothly.


    Scientists harboring doomsday fears like Musk and Eliezer Yudkowsky were growing
    in number, and Amodei was one of them. About a year earlier, he was still at Google,
    which faced backlash because the visual recognition system in its smart photo
    management software classified Black people as gorillas. Google said it was "appalled"
    and completely removed the "gorilla" label from the software. "A system with such
    unpredictable failure modes is not a good thing," he said on a podcast discussing
    the incident.


    But Amodei''s concerns weren''t limited to algorithmic racism and offensive decisions.
    He also worried about the AI technology DeepMind possessed—reinforcement learning.
    This technology was being used to control physical systems like robots, self-driving
    cars, and Google''s data centers. He told the Future of Life Institute, led by
    Jaan Tallinn, in a 2016 interview: "Once you really interact directly with the
    world, and directly control physical objects, I think the probability of things
    going wrong... starts to increase." Amodei''s research into AI harm showed him
    increasing possibilities for catastrophe. He later warned the media in 2023 that
    runaway AI had a 25% chance of causing human extinction. Staying at "Google Brain"
    couldn''t solve these risks. So, a few months after that deep conversation in
    the OpenAI office, he joined the organization.


    To develop AGI, OpenAI''s founding team needed to attract more money and talent,
    so they tried to focus on projects that would generate positive media coverage.
    They early on created a computer that defeated top human players in the 3D strategy
    video game *Dota 2* (referred to as "Ancient Guardian" in text), and built a five-fingered
    robotic hand driven by a neural network that could solve a Rubik''s Cube. These
    projects attempted to surpass the secret research happening in DeepMind''s offices
    across the Atlantic, to keep Elon Musk satisfied.


    Musk never hid his distrust of DeepMind. Initially, Musk visited OpenAI''s office
    weekly; later, every few weeks. In 2017, OpenAI staff went to SpaceX headquarters
    for a meeting. Musk gave them a tour and held a fireside chat with about 40 newly
    hired AI researchers. At one point, Musk began talking about why he funded OpenAI:
    it was because of Demis Hassabis.


    An attendee revealed Musk said: "I was an investor in DeepMind, and I was very
    worried that Larry [Page] was treating Demis as his subordinate. Actually, Demis
    only works for himself. I don''t trust Demis either."


    The researchers were shocked. To most, it sounded less like Musk was particularly
    worried about AI development and more like he had a personal vendetta against
    Hassabis. When asked why he was hostile toward Hassabis, Musk mentioned the British
    entrepreneur''s past computer games designed around world domination.


    During the chat, Musk recounted a conversation with another DeepMind investor.
    The investor said of an earlier meeting with Hassabis: "I felt like a moment in
    a movie where someone should step up and shoot the guy." In other words, someone
    needed to stop Hassabis from building omnipotent AGI.


    Despite disliking Hassabis, Musk still reminded OpenAI staff that DeepMind was
    in the lead and they needed to match the British company''s research output. Former
    OpenAI employees revealed that months flew by, and Musk grew increasingly worried
    that OpenAI''s technology wasn''t as powerful as DeepMind''s.


    To keep their biggest patron, Altman and Brockman led some researchers to mimic
    DeepMind''s work. For instance, the *Dota 2* project researchers couldn''t understand
    why they were studying game simulators if the ultimate goal was building AGI to
    improve human lives. The reason, naturally, was they needed Musk''s money. Brockman
    told researchers: "If we don''t work hard on this, OpenAI might not exist in a
    few years."


    Although OpenAI eventually won global acclaim for its achievements in chatbots
    and large language models, in its first few years it toiled in multi-agent simulation
    and reinforcement learning—areas where DeepMind already dominated. However, the
    more they chased DeepMind in these areas, the more Altman and his leadership team
    realized these methods weren''t very useful in reality. It was at this point that
    OpenAI began evolving into a completely different type of organization than DeepMind.
    DeepMind valued PhDs and championed a rigid academic culture. OpenAI''s culture
    was engineering-oriented; its researchers were mostly programmers, hackers, and
    Y Combinator founders, often more interested in building and making money than
    in making discoveries and gaining scientific prestige.


    Meanwhile, Musk grew restless. He complained to Altman that he had hired a bunch
    of great scientists but achieved no results surpassing DeepMind. By the nonprofit''s
    third year, Musk told Altman it had fallen far behind Google and DeepMind. He
    then proposed a quick fix: he would take over OpenAI and merge it with Tesla.
    In a December 2018 email to Altman and his team, Musk said OpenAI would never
    catch DeepMind without major changes. This email was later released by OpenAI
    and verified by those who saw the original. "How unfortunate that humanity''s
    future is in Demis''s hands," Musk added. In other words, if Musk didn''t take
    over OpenAI, the villain Hassabis would win. But Altman and his partners wanted
    to keep control. They refused Musk''s proposal.


    In February 2018, OpenAI briefly mentioned Musk''s impending departure in a public
    statement about new donors, giving him a noble reason. Musk was leaving due to
    conflicts of interest in AI. "Elon Musk will depart the OpenAI Board but will
    continue to donate and advise," the nonprofit wrote on its blog. "As Tesla becomes
    more focused on AI, this will eliminate potential future conflicts for Elon."


    Many OpenAI employees knew this was nonsense. They believed that while Musk claimed
    to care about creating safe AI, he also wanted to build the most capable AI. He
    was already fabulously wealthy and wielded unprecedented influence over US infrastructure:
    NASA was sending astronauts to space via SpaceX, Tesla dominated EV charging standards,
    and Musk''s satellite internet company Starlink was trying to influence the outcome
    of the Russia-Ukraine war.


    Clearly, Musk had a track record of unreliability. He had promised to donate $1
    billion to OpenAI over a few years but actually gave only $50–100 million—a drop
    in the bucket for the world''s richest AI worrier. To a large extent, if he had
    funded OpenAI with Tesla stock, fulfilling that pledge would have been relatively
    easy. From 2015–2023, Tesla''s stock price rose over 180x, meaning OpenAI could
    have easily hit the $1 billion fundraising target. Despite Musk''s professed concern
    for humanity''s future, he seemed more concerned with staying ahead in the competition.


    Musk''s departure cut off OpenAI''s primary funding source. This was a disaster
    for Altman. He had staked his entire reputation on this project. To work with
    him, some of the world''s top AI scientists had voluntarily taken pay cuts, and
    now his grand ambition to help humanity began to look foolish. In the new era
    of AI development, a simple fact remained: from paying researchers'' salaries
    to training data to the powerful computers running models, everything required
    massive resource stacking. Without Musk, the chances of meeting these needs were
    rapidly dwindling.


    Altman faced a critical moment. In OpenAI''s San Francisco office, he pondered
    how to keep the nonprofit running and develop AI models that might not be industry-leading
    with extremely limited resources. Or should he just pull the plug? Raising money
    for a nonprofit is much harder than for a startup. Altman had been trying to persuade
    wealthy people to donate to the AGI cause out of goodwill, but saw no prospect
    of success. He needed tens of millions; Musk was his last big patron.


    But he had another option. Beyond the glory of lighting the beacon of an AI utopia
    for humanity, maybe OpenAI could offer patrons some direct financial returns.
    That would be a win-win. Patrons wouldn''t be "donating" but "investing"—a term
    Altman preferred. But he believed only a few potential patrons in reality could
    provide the funds and computing power needed for AGI: tech giants like Google,
    Amazon, Facebook, Microsoft. No other companies had billions in cash or massive
    computer clusters the size of several football fields.


    Over the past few years, OpenAI and DeepMind had tried to erect barriers to prevent
    the super-powerful AI systems they built from being misused. DeepMind tried to
    change its governance structure so profit-driven monopolies like Google couldn''t
    arbitrarily use AGI to make money. Instead, an expert advisory board would control
    things. Altman and Musk positioned OpenAI as a nonprofit, promising to share research
    and even patents with other institutions when they neared the threshold of superintelligence.
    This way, it would put humanity''s interests first.


    Now, a struggling Altman planned to tear down part of the guardrails. His attitude
    would shift from initial caution to recklessness, and doing so would change the
    AI field they had both fought for—from a slow-paced, primarily academic sanctuary
    into something more like the Wild West. Altman would use his storytelling ability
    to craft a convincing narrative justifying his imminent departure from OpenAI''s
    founding principles. He''s a tech entrepreneur; tech entrepreneurs sometimes must
    pivot. That''s how Silicon Valley works. He just needed to slightly adjust OpenAI''s
    founding principles.


    # Act Two: The Leviathan


    ## 7 Entry


    Tourists clustered at London''s King''s Cross Station, vying to see the magical
    platform where Harry Potter catches the train to Hogwarts; just steps away, skyscrapers
    soared, their glass and metal cladding facades glittering, as a different kind
    of magic unfolded inside. Bustling pedestrians traversed the beautiful walkways
    between buildings, including DeepMind''s engineers and AI scientists. Reaching
    the glass doors of an office building, they pulled out access badges. Ostensibly,
    the building belonged to Google, but two floors were dedicated exclusively to
    the mysterious AI lab.


    As part of Google, DeepMind enjoyed many perks—nap pods, massage rooms, indoor
    gyms—but its founders still strove to escape parent company Alphabet''s control.
    More than two years after the acquisition, the tech giant''s executives dangled
    a new prospect before Demis Hassabis, Mustafa Suleyman, and Shane Legg. DeepMind
    wouldn''t become an "autonomous unit," but rather an "Alphabet company" with its
    own independent P&L statement.

