- raw: '在OpenAI的资金即将告罄之际，纳德拉尝试改变微软的努力已经进行了4年。纳德拉不像史蒂夫·乔布斯等科技名人那样充满魅力，但他是天生的谈判家和敏锐的观察家。“在科技行业的聚会上，你总能看见他拿着小笔记本记录大家的谈话。”西雅图的风险投资家、曾在微软担任高管10年左右的希拉·古拉蒂说，“但他不怎么发言。他是最好的促进者、合作者和倾听者。”


    比尔·盖茨创立的这家公司曾以Windows（视窗操作系统）、Word（文字处理器应用程序）、Excel（电子表格应用程序）等标志性的程序颠覆个人计算机领域，但它已经变得行动迟缓、视野狭隘，错过了移动革命。2014年，微软收购了诺基亚，可惜之后并无建树。迄今为止，纳德拉似乎正在扭转局面。他推动历来各扫门前雪的管理人员建立更具合作性的文化，重点发展云计算，出售超级计算机的使用权，帮助客户提升业务效率。


    这是明智之举。云计算虽然不是世界上最热门的行业，但随着越来越多的公司将产品库存或客户服务系统放到网上，它也在不断发展壮大。微软建立了一个叫作Azure的平台，并开发了专门用来支持这项业务的软件。Azure以蓝色三角形为企业标志，会成为微软继Windows之后的又一个重磅产品。它通过庞大的服务器集群为成千上万商业客户的数字资产提供算力，而这些服务器的强大算力正是奥尔特曼所需要的。


    2018年7月，奥尔特曼飞往爱达荷州参加一年一度的太阳谷峰会。该会议由投资公司Allen ＆ Company（艾伦公司）举办，仅限受邀者参加，被称为“亿万富翁的夏令营”。这是一个非正式的社交聚会，富有的技术专家穿着巴塔哥尼亚背心，坐在脸书首席运营官谢丽尔·桑德伯格或亚马逊创始人杰夫·贝佐斯身旁，品尝着羽衣甘蓝沙拉。参会者来自科技界和媒体界，他们有时就在这里边喝咖啡边达成协议，或者像奥尔特曼和纳德拉一样在楼梯间里完成谈判。


    会议期间，这两位瘦高的男士在楼梯上偶遇并聊起天来。奥尔特曼想起霍夫曼的建议，于是抓住机会和纳德拉谈起了OpenAI。


    在大多数人看来，奥尔特曼依靠100人左右的团队开发超级智能机器的想法太疯狂了。但纳德拉知道奥尔特曼与硅谷的关系网联系紧密，甚至超过自己这个大本营在西雅图的微软统帅，他觉得应该认真听听奥尔特曼的意见。


    随后他就被奥尔特曼的宏伟目标震惊到了。奥尔特曼没有承诺要帮他改进Excel。他想做的是，为全人类创造财富。纳德拉折服于奥尔特曼小团队已经取得的成就，尤其是在大语言模型方面。即使拥有7
    000多名人工智能研究人员，微软也很难如此之快地取得类似进展。微软同谷歌一样，之所以在开发可以模仿人类语言的人工智能系统方面表现得越来越紧张，很大程度上是因为一次难堪的经历。


    2016年，就在纳德拉上任两年后，微软的人工智能团队试图开发一款让美国18～24岁人群感兴趣的聊天机器人，就像其另一款在中国400万年轻人中间流行的聊天机器人“小冰”一样。他们将这个基于网络的新机器人命名为Tay，并决定在推特上推出，以便它能和更多人互动。


    Tay一经推出，几乎立刻开始发布充满种族主义、性暗示而且经常是荒谬可笑的帖文。有一次它说：“瑞奇·热维斯从无神论的发明者阿道夫·希特勒那里学到了极权主义。”还有一次说：“凯特琳·詹娜连真正的女性都算不上，竟然获得了年度女性的称号？”当有人问Tay犹太人大屠杀是否发生过时，它回答说：“这是编造的。”


    微软迅速关闭了这个才运行16小时左右的系统，并指责一部分人利用Tay的漏洞进行了协同网络攻击。公司曾用公共网络数据训练机器人，还试图过滤掉潜在的冒犯性言论，但Tay刚上线就把这一切抛到了九霄云外。怎么才能在互联网上训练语言系统而又让它远离那些网络恶语呢？


    纳德拉想知道奥尔特曼最终能否做成这件事，并在此过程中给微软的软件增加一些有趣的新功能。他们的讨论只持续了几分钟，但在道别时，这位微软首席执行官同意和奥尔特曼保持联络。“也许我们应该想想更多的可能性。”纳德拉对他说。


    当纳德拉刚飞抵西雅图、奥尔特曼回到旧金山时，霍夫曼就联系了双方，急于知道事情的进展。两人似乎都秉持谨慎的乐观态度，告诉霍夫曼这次的会面很有成效。他们就是否应该认真对待这次合作征求霍夫曼的意见，霍夫曼肯定地回答说“是”。


    即便如此，微软首席执行官一开始还是不太确定。他同首席技术官凯文·斯科特交流了看法。他们不能只捐款给OpenAI。微软是一家上市公司，股东们期望任何一笔大投资都能带来回报。但“战略合作伙伴关系”的想法能行得通，比如微软可以向OpenAI投资10亿美元，以换取其尖端技术的使用权。


    这是微软迈出的一大步，因为它之前从未真正达成重大软件合作项目。作为全球软件之王，它也从来不需要这么做。微软过去的重大合作是和戴尔、惠普、康柏等公司进行的，让这些硬件制造商在其电脑设备上预装Windows，帮助微软走上了巅峰。


    但这次合作将迥然不同。还存在一个障碍：OpenAI是一家非营利组织，董事会仅对其非营利性使命负有责任，而不是其投资人或商业成就。微软无法在其董事会占据一席之地，意味着这次合作将是一场豪赌（纳德拉几年后仍在被这个问题困扰）。据当时与纳德拉谈论过这一合作的人说，这让他心烦意乱。


    在西雅图目睹了整个进程的投资人索马·索马西格透露，微软首席财务官埃米·胡德也对这次合作持怀疑态度。在公司损益表上增加10亿美元的支出难度很大，而且与非营利组织合作也会引起美国国税局的质疑。美国国税局对非营利组织如何产生和分配利润均有严格规定，这将导致利益冲突，导致公司陷入尴尬的境地。


    对于OpenAI能否成为可靠的合作伙伴，纳德拉还有其他方面的担忧。即使微软拥有商业化OpenAI技术的权利，但这家组织的目标似乎与这家软件巨头大相径庭。这真的能行吗？他又和奥尔特曼聊了聊，渐渐坚定了信心。


    “奥尔特曼确实是在努力寻找对一个人最重要的东西——再想方设法把它提供给对方。”格雷格·布罗克曼后来对《纽约时报》说，“这就是他反复使用的算法。”


    纳德拉意识到，这10亿美元投资所带来的真正回报不是出售或上市后得到的金钱，而是技术本身。OpenAI正在开发的人工智能系统有朝一日可能会发展成为通用人工智能，而在此过程中，随着这些系统变得越来越强大，它们也可以增加Azure服务对客户的吸引力。人工智能将成为云业务的基本组成部分，而云业务有望占到微软年销售额的一半。如果微软能向公司客户销售一些很酷的新兴人工智能功能，比如能够取代客服中心工作人员的聊天机器人，这些客户就不太可能转投到竞争对手那里。客户使用的功能越多，就越难改换门庭。


    这样做虽说与技术有点关系，但对于巩固微软的控制力而言至关重要。eBay、美国国家航空航天局、美国国家橄榄球联盟等微软云服务的客户一旦成功开发一款应用程序，该应用程序就会与微软建立起几十种不同的连接。把它们断开需要复杂的技术和高昂的成本，信息技术专业人士愤恨地称之为“供应商锁定”。这就是三大科技巨头——亚马逊、微软和谷歌在云业务上占据主导地位的原因。


    微软首席执行官很清楚，OpenAI在大语言模型方面取得的成就比微软人工智能科学家正在进行的研究更有利可图，后者似乎在Tay事件之后就迷失了方向。因此，纳德拉同意向OpenAI投资10亿美元。他不仅是在支持OpenAI的研究，也是为了确保微软站在了人工智能革命的最前沿。而作为回报，微软可以优先使用OpenAI的技术。


    在OpenAI内部，苏茨克维和雷德福在大语言模型上的研究日益成为公司的焦点，最新版本的模型能力更强，以至于旧金山科学界开始怀疑它是否过于强大了。他们的第二个模型GPT-2使用了40
    GB（吉字节）的网络文本进行训练，拥有约15亿个参数设置，比第一个模型大了10倍，能够更好地生成复杂文本，输出的内容也更可信。


    OpenAI决定先发布较小版本的模型，并在2019年2月的一篇博文中警告说，它可能会被用来大规模地制造虚假信息。这种坦率直白的做法令人吃惊，后来OpenAI很少再这样做。文章说：“出于对该技术可能被恶意应用的担忧，我们不会发布经过训练的模型。”这份宣告更多与风险有关，而不是模型本身。它的标题为《更好的语言模型及其影响》。


    在英国的DeepMind领导层几乎没有注意到这一消息。德米斯·哈萨比斯私下里对萨姆·奥尔特曼的所作所为感到不满，而且他其实并不看好OpenAI专注于语言模型的策略。根据DeepMind前员工的说法，哈萨比斯认为这只是通往开发通用人工智能的众多途径之一，并且深信要想让人工智能变得越来越聪明，更有效的做法是用游戏模拟世界。


    但随后发生的一件趣事表明OpenAI研究人工智能的策略是多么引人注目。GPT-2获得了媒体的大量关注，很多文章都在关注OpenAI已经提到的这种新人工智能系统可能带来的危险。《连线》杂志发表了一篇题为《人工智能文本生成器：太过危险不能公开》的专题报道，《卫报》也匆忙刊发了一篇题为《人工智能可以像我一样写作，准备好迎接机器人末日吧》的专栏文章。


    OpenAI发布了足够多的信息来证明它的新文本生成器非常强大，其中包括一则由GPT-2撰写的有关独角兽说英语的假新闻。但其并未将模型本身用于公开测试，也没有透露使用了哪些公共网站或数据集对模型进行训练。之前发布原始版本的GPT时，OpenAI公开是使用BooksCorpus书籍资料库进行训练的。OpenAI一方面对新模型的细节守口如瓶，另一方面对其可能带来危险性发出警告，这种做法似乎制造了比以前更多的噱头。想深入了解新模型的人比以往任何时候都多。


    奥尔特曼和布罗克曼不断强调，这并非他们的本意，OpenAI真的很担心GPT-2会被滥用。可以说，他们的公关手法仍旧是神秘营销，带有些许反向心理学技巧。这么多年来，为了激起消费者的兴趣，苹果一直对发布的产品保密，现在OpenAI也对GPT-2的开发过程同样保密。同时，人工智能学者想要访问GPT-2就像进入高档夜总会一样难。OpenAI在试用人员的选择上变得更加周密和挑剔。这到底是宣传炒作，还是谨慎的思想实验呢？


    很可能两者都是。长年累月之下，奥尔特曼学会了反直觉。在细节上有所保留，就能创造更多宣传热点；引起争论，就能转移批评的声音，之前奥尔特曼曾给《华尔街日报》的记者发送一长串Loopt的风险点，就是一个例子。


    OpenAI在通往通用人工智能的道路上走到了一个十字路口。有了更多的数据和更强的计算能力，它的语言模型将变得越来越像人类，但它的创立原则却濒临崩溃的边缘。奥尔特曼和布罗克曼知道，与微软的联盟会让他们背离那些承诺，但他们还是得留住员工。毕竟，大多数员工加入公司不是为了钱，而是为了使命。如果使命受到背弃，他们就多了一个离开的理由。


    奥尔特曼需要某样东西，让那些优秀的工程师放弃批判性思考。答案一目了然，那就是通用人工智能。追求实现通用人工智能的目标与激励宗教团体保持信仰的天堂没什么不同。同那些去教堂做礼拜的人一样，OpenAI的科学家也在豪赌：如果他们成功，乌托邦世界就触手可及；如果他们失败，世界末日则近在咫尺。


    考虑到最终的结果可能导致灾难，也可能带来胜利，相比之下他们开发通用人工智能的方式就显得微不足道了。最终的结果才重要。尽管这家非营利组织在章程中提到了合作，但OpenAI的员工开始相信他们拥有伦理上的特权，可以率先创造通用人工智能并将其带来的好处分享给全世界。有些员工认为，如果DeepMind抢先开发通用人工智能，他们很可能会制造出某种魔鬼。


    新章程也助长了这种想法。奥尔特曼和布罗克曼将其视为OpenAI的“圣经”，甚至将员工的薪资与他们落实这种想法的情况挂钩。在过去的4年里，OpenAI已经发展成为一个更紧密，甚至自成一体的组织，员工在下班后会相互交流，并将他们的工作视为使命和身份的象征。布罗克曼和他的女友安娜甚至在OpenAI总部举行了结婚仪式，仪式现场的鲜花被摆放成OpenAI标志的形状，还有一只机械手臂承担送戒指的任务。苏茨克维主持了整场仪式。


    对于那些在OpenAI和DeepMind工作的人来说，用通用人工智能拯救世界的不懈努力逐渐形成了一种更加极端、近乎邪教般的工作氛围。在旧金山OpenAI总部，苏茨克维把自己塑造成某种精神领袖。他会告诫员工“感受通用人工智能”，还在推特上发表了这句话。根据《大西洋》月刊的一篇文章，OpenAI在旧金山一家科学博物馆举行节日聚会，苏茨克维带领科研人员现场高呼：“感受通用人工智能！”事实上，OpenAI有几十名员工也认为自己是有效利他主义者，这让他培养的宗教文化得到了加强。


    有效利他主义在2022年底成为全球焦点，曾经的加密货币亿万富翁萨姆·班克曼-弗里德是其最知名的拥护者。但它早在21世纪前10年就出现了。这一理念由牛津大学的几位哲学家提出，并在大学校园里迅速广泛传播，其核心是通过一种更功利的捐赠方式来改进传统的慈善模式。举例来说，与其在无家可归者收容所做志愿者，不如通过从事对冲基金之类的高薪工作赚更多的钱，然后再捐钱建造更多的无家可归者收容所，从而帮助更多的人。该理念被称为“赚钱行善”，目标是让慈善投入产生最大效益。


    至于怎样做才是最好的，有效利他主义者在这一问题上存在分歧。一些人会说相较于通过捐款解决美国或欧洲等地区的无家可归问题，解决贫困等全球问题能够产生的影响更广泛。另一些人则持有相反的观点。慈善组织“开放慈善”（Open
    Philanthropy）是有效利他主义最大的支持者，其项目负责人尼克·贝克斯特德曾写道：“在富裕国家拯救一条生命比在贫穷国家拯救一条生命重要得多，因为富裕国家拥有更多的创新，劳动者也更具经济生产价值。”人的生命是可以量化的，做好事成了一个需要解答的数学题。


    对于那些相信有效利他主义“数字越高越好”哲学的人来说，开发通用人工智能的使命有着特殊的吸引力，因为该技术将来可能会影响数十亿甚至数万亿人的生活。而这些坚定的信念也使奥尔特曼接下来的行动更受OpenAI员工的欢迎。奥尔特曼即将飞往西雅图，向微软首席执行官纳德拉演示最新的语言模型GPT-3，但私下里他和布罗克曼也在琢磨如何优化OpenAI的架构重组。同DeepMind的创始人们一样，他们也在努力为一个既想用人工智能拯救人类，又想用人工智能赚钱的组织寻找现成的模板。布罗克曼在一档播客节目中回忆道：“我们研究了所有可能的法律架构，但没有一种符合我们的要求。”


    既想让世界变得更美好，又想赚取利润的公司，有时会将自己建设为共益企业（B Corps）。这种法律架构有别于大多数公司都会采用的盈利模式——主要目标是最大化股东价值。1962年，美国经济学家米尔顿·弗里德曼对这种广为流行的组织架构进行了精辟总结：“企业有且只有一项社会责任，那就是利用已有资源从事增加其利润的活动。”


    成为共益企业是为了在追求利润和完成使命之间取得平衡。羽绒服制造商巴塔哥尼亚和冰激凌品牌本杰瑞都是采用这种模式，也就是说它们每做一个决定，都要按照法律的要求分析其对员工、供应商、客户、环境以及股东的影响。但这种模式并不总是奏效。科技领域的网络商店平台Etsy在上市后不得不放弃共益企业的资质，开始沦为华尔街的牺牲品，后者对上市公司增长的要求永无休止。


    奥尔特曼和布罗克曼设计了他们所谓的中间道路，一个非营利组织和公司的混合体。2019年3月，他们宣布成立一家有限盈利公司。在这种公司结构下，新的投资者必须同意，他们从投资中获得的回报有上限。从传统的科技投资来看，这些回报要么来自出售，要么来自公开募股发行。但在奥尔特曼的有限盈利结构下，当公司在上市、出售或以特定形式分配股息之后获得的利润达到一定的门槛时，投资者获得的回报将受到限制。对于早期投资者来说，这笔交易极好，因为门槛非常高，即利润超过投资的100倍时，上限条款才会发挥作用。换句话说，如果投资者向OpenAI投资1
    000万美元，只有当这1 000万美元带来的回报达到10亿美元时，他们才会被限制获利。


    即使在硅谷看来，这也是极为丰厚的回报。奥尔特曼表示对于后续投资者，100倍的上限已“按数量级”进行降低，他还认为早期投资者承担着巨大的风险。“虽然现在有很多人都听说过通用人工智能，也意识到它可能很快就会出现，但当时绝大多数人都觉得我们在追求不可实现的目标。”


    奥尔特曼曾经鼓励初创公司瞄准数十亿美元的市值目标，他对OpenAI也抱有同样的雄心壮志，希望它为投资者带来巨额财务回报。OpenAI甚至在重组文件中增加了一项条款，称如果成功开发出通用人工智能，它将重新考虑所有的财务安排，因为到那时，全世界都需要重新考虑金钱的概念。


    为了配合这一复杂的新结构，奥尔特曼成立了一家叫作“OpenAI Inc.”的综合性非营利公司，其董事会负责确保OpenAI LP（有限盈利公司）开发“广泛有益”的通用人工智能。董事会成员包括奥尔特曼、布罗克曼、苏茨克维，以及里德·霍夫曼、Quora首席执行官亚当·迪安杰罗和科技企业家塔莎·麦考利。


    OpenAI的有限盈利公司负责所有的主要研究工作，在达到利润上限之后，它为投资者赚取的所有收入都将回流至OpenAI Inc.。如此一来，在必须把赚到的钱分给人类之前，OpenAI足以筹集到几十亿美元，并让它的投资者多赚几十亿美元。


    最初，这样做似乎并没有给OpenAI的非营利母公司带来多少好处。OpenAI不愿意透露这个100倍的乘数最终何时会降低，也不愿意透露会降低多少。奥尔特曼飞快完成了转型，只有最好的初创公司才能做到这样。


    没过多久，他们的下一个转折点到来了。2019年6月，在成为营利性公司4个月后，OpenAI宣布与微软建立战略合作伙伴关系。布罗克曼在一篇博文中写道：“微软将向OpenAI投资10亿美元，以支持我们开发具有广泛经济利益的通用人工智能。”


    这10亿美元包括现金和使用微软云服务器的授信。作为回报，OpenAI将授权微软使用其技术发展云业务。OpenAI的非营利董事会将决定最终创建通用人工智能的时间，届时微软会停止使用这项技术。


    布罗克曼写道，OpenAI需要支付成本，而实现这一目标的最好方式是授权OpenAI的“通用人工智能前阶段”技术。他解释说，如果他们只想通过制造和销售产品赚钱，那就会改变OpenAI的重心。


    这一观点漏洞百出。将技术授权给大公司与售卖产品并没有本质上的不同。它仅仅意味着把技术卖给比普通消费者更具权势和控制力的大客户而已。只要OpenAI的董事会表示通用人工智能尚未开发成功，他们就能继续向微软授权。


    奥尔特曼的新公司正在围绕其核心原则（包括2018年发布的章程）进行复杂的变革。OpenAI曾承诺不会利用人工智能帮助“集权”，现在却要帮助世界上最强的科技公司之一变得更强；它承诺会帮助其他更接近创建通用人工智能的项目，因为开发通用人工智能不是一场“竞争”，现在却要引起“全球军备竞赛”，使企业和开发者比以往任何时候都更随意地推出人工智能系统，以图与OpenAI竞争。OpenAI对每一个即将发布的新语言模型的详细信息都守口如瓶，使外界无法对其进行监督。对于持怀疑态度的专业学者和担忧人工智能的科研人员来说，OpenAI的名不副实就是一个笑话。'
