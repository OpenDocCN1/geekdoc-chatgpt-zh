    # 第一幕 起源


    布罗克曼后来在莱克斯·弗里德曼的播客节目上回忆道：“我们也知道与大型科技公司相比，我们的资源会显得微不足道。”但如果他们真的成立了这样一个组织，如何选择组织结构才能确保开发出的人工智能可以造福人类呢？“显然，只有非营利组织不存在可能削弱其使命的竞争动机。”


    在搭乘奥尔特曼的车回家的途中，布罗克曼表示虽然感觉很不现实，但他同意加入。毕竟在硅谷，即使是最不可思议的想法也能找到发展壮大的途径。


    布罗克曼立即开始筹备创立OpenAI的各项必要事宜，这给自身就是工作狂的奥尔特曼留下了深刻的印象。这个人平均每5分钟就回复一封电子邮件，想必他会像奥尔特曼一样为这项事业献出全部身心。奥尔特曼后来说：“他完全投入其中。”在创立OpenAI这件事上，布罗克曼成为牵头人。


    接着，布罗克曼负责从谷歌、脸书等公司挖了一批科技人才，并与被称为深度学习运动“教父”之一的蒙特利尔大学教授约书亚·本吉奥取得联系。布罗克曼不指望聘请本吉奥，他想让这位教授告诉他谁是人工智能领域最有前途的科学家。本吉奥打印了一份名单寄给布罗克曼。


    聘请这些人可不那么容易。其中一些人在谷歌、脸书等公司挣着7位数的薪水，而奥尔特曼和布罗克曼无法给出数额相近的报价。他们所拥有的只是一个改变世界的强烈使命和两个在幕后运作的知名人物。埃隆·马斯克现在是全球推崇的企业界大亨，而领导Y
    Combinator项目则将奥尔特曼在硅谷的地位提升到了人人都想认识的程度。对于人工智能研究专家来说，即使在这一新成立的非营利组织短暂工作一段时间，也能获得广泛的人脉和潜在的职业发展机会，降薪是值得的。


    布罗克曼名单上的几位顶尖科学家决定就这份工作与他面谈。除了名人效应和未来蓝图，他们还看中了这个新组织的“开放”承诺。按照OpenAI前员工的说法，他们将有机会发表他们的最终研究成果，而不是秘密地开发一些企业产品；还有一些人认为，谷歌和DeepMind努力开发通用人工智能都是为了利益，OpenAI能够成为一股制衡这种利益动机的力量。


    为了达成协议，布罗克曼带着几位科学家到一座酒庄协商相关事项。如果苏茨克维同意加入，那就是最大的成功。他们讨论了很多关于建立人工智能实验室的事，比如实验室要完全不受企业的束缚，还要“开源”研究成果，也就是将研究成果免费向大众开放，以及这将如何阻止谷歌、脸书等大型科技公司在人工智能越来越强大的过程中对其施加控制。几乎所有科学家都同意加入OpenAI，其中就包括那位似乎不苟言笑的天才科学家苏茨克维。他在俄罗斯和以色列长大，曾与著名的深度学习先驱杰弗里·辛顿一起工作，现在他将离开“谷歌大脑”，转投OpenAI。


    2015年12月，由十几位科学家组成的团队前往加拿大蒙特利尔参加名为“神经信息处理系统”（NIPS，现名NeurIPS）的年度人工智能会议，宣告成立新的研究实验室。伴随着会场外纷飞的大雪，团队成员向其他参会者介绍了他们的新实验室。而真正的发布则在线上进行——OpenAI.com网站横空出世，布罗克曼和苏茨克维在网站上联合发表了一篇介绍实验室项目的文章。他们写道：“我们旨在推动数字智能发展，使其尽可能造福全人类，而不被经济动机所约束。”


    实验室从马斯克、蒂尔、奥尔特曼、霍夫曼、杰西卡·利文斯顿以及亚马逊的云计算部门获得了惊人的10亿美元投资，马斯克和奥尔特曼担任主席职位。据知情人士透露，马斯克打算用特斯拉的股票为OpenAI注资，就像他几年前对DeepMind提出的收购方式一样。听到这样的消息，神经信息处理系统大会的数百名参会者都惊得目瞪口呆。很多人认为开发通用人工智能是白日做梦，但也有一些人对此羡慕不已。在过去的10年里，大型科技公司一直在从大学里挖走顶尖的计算科学人才，导致现今最优秀的人工智能专家都在为企业利益服务。实际上，目前人工智能领域形成了一条从名校到谷歌、脸书或亚马逊的流水线。这是一个存在多年的顽疾。


    “没人能拒绝增长了两三倍的薪水。我拒绝不了，我所有的同事也拒绝不了。”伦敦帝国理工学院计算机科学教授马佳·潘迪克说。她于2018年加入三星电子并担任人工智能中心研究总监，后来跳槽到了Meta（前身为脸书）。那些杰出的科学家同样也拒绝不了：辛顿目前为谷歌服务；李飞飞离开斯坦福大学，加入谷歌；杨立昆为脸书工作；吴恩达离开斯坦福大学去了谷歌，然后又去了中国的百度。即使是像斯坦福大学、牛津大学、麻省理工学院这样的顶尖名校，也很难留住各自的明星学者，结果就是教育队伍青黄不接。人工智能研究变得越来越秘而不宣，也更倾向于以赢利为目的。这就是为什么马斯克和奥尔特曼推动他们的研究向公众开放的做法让科研人员耳目一新。终于有人要开始解决大公司垄断人工智能知识的问题了。


    大学人才流失有两个原因。第一个也是最显著的原因是薪酬。在“人工智能教父”杰弗里·辛顿曾任职的多伦多大学，计算机科学教授的年薪约为10万美元。该大学收入最高的学者每年大约能挣55万美元，这已经是“天花板”级别的收入了。辛顿的优秀学生苏茨克维甚至没想过进入学术界。他在辛顿的初创公司工作一段时间后，直接加入了“谷歌大脑”。据《深度学习革命》透露，OpenAI给苏茨克维开出了200万美元的年薪，但“谷歌大脑”提供的薪酬是这个数字的3倍。


    第二个原因是进行人工智能研究实验需要数据和计算能力。通常来说，大学拥有的GPU（图形处理单元）数量有限。GPU是一种功能强大的半导体，由英伟达制造，目前大多数用来训练人工智能模型的服务器都需要使用GPU。潘迪克在学术界工作时，曾设法为其30人的研究团队购买了16个GPU。但由于芯片太少，训练一个人工智能模型需要数月时间。“这太荒谬了。”她说。但在加入三星后不久，她就得以使用2
    000个GPU。这些增加的处理能力意味着训练一种算法只需要几天时间，也意味着研究可以加速进行。


    对于那些留在学术界的科学家来说，要摆脱大型科技公司的影响也变得越来越困难。2022年的一项研究表明，在过去的10年里，与大型科技公司关联的学术论文数量增加了两倍多，占比达66%。该研究由包括斯坦福大学和都柏林大学在内的多所大学的科研人员共同完成。研究表明，大型科技公司的影响力与日俱增，“它们采取的策略与大型烟草公司一样”。这反过来影响了大学衡量人工智能研究成功与否的标准。曾任该研究负责人、现为莫兹拉基金会（Mozilla
    Foundation）高级研究员的阿贝巴·比尔哈内表示，学者们不再关注人类福祉、正义、包容等价值观，而是倾向于追求更好的表现。


    比尔哈内说，福祉和包容不只是空洞的概念。它们是可衡量的。“它们可能很抽象，但效率和表现也一样。”她补充道，“人们已经找到了衡量公平、隐私等方面的方法。”比尔哈内在其2023年的另一项合作研究中指出，更糟糕的是，无论是大学还是科技公司里的科研人员，都太过专注于将他们的人工智能变得更大、更有能力，这增加了这些模型产生带有种族主义或性别歧视的结果的风险。“我们发现，随着数据集规模的不断扩大，仇恨内容也会随之增加。”


    然而，规模对于大型科技公司在人工智能领域的影响力至关重要。谷歌和Meta拥有可用于训练模型的数万亿数据点，同时还管理着占地数十万平方英尺 ^([⁵](#fn5))


    要想提升人工智能的水平，数据就要越多越好。苏茨克维及其团队在OpenAI启动的研究更关注人工智能模型的能力，而不是公平、合理、隐私等方面。简单来说，这样做有章可循。如果用越来越多的数据训练人工智能模型，同时增加模型的参数量，并提高用于训练的计算能力，人工智能模型就会变得越来越熟练。这就是吴恩达教授在斯坦福大学做实验时注意到的特别相关性。模型被设计用来做什么并不重要。只要把所有数值调大，它就能更准确地翻译语言或者更人性化地生成文本。


    苏茨克维曾在一次人工智能大会上表示：“只要你拥有非常大的数据集和非常大的神经网络，成功便水到渠成。”后面这半句话就成了他在人工智能科学家中的标志性语录，尤其是在OpenAI召开盛大的发布会之后，这家由一名优秀科学家和数名硅谷大佬领导的新兴非营利组织，让整个领域都对其理念焕发出全新的热情。


    但没过多久，问题就开始出现。OpenAI并没有立刻获得马斯克、蒂尔等人在2015年12月宣布的10亿美元资金承诺。科技新闻网站TechCrunch仔细研究了OpenAI的联邦税务申报文件，然后撰写了一份调查报告。报告显示，在接下来的几年里，这家非营利组织实际上只筹集到1.3亿多美元捐款。


    OpenAI不仅缺少资金，而且发展方向也不明确。由30名科研人员组成的创始团队，最开始在布罗克曼位于旧金山教会区的公寓里工作，他们有的坐在餐桌旁，有的陷在沙发里，膝上放着笔记本电脑。几个月后，“谷歌大脑”的一位资深研究员达里奥·阿莫迪前来拜访。他询问了一些尖锐的问题。例如，OpenAI致力于开发友好型人工智能，并开放其源代码到底算怎么一回事？奥尔特曼在《纽约客》专栏里反驳称，他们并不打算公开所有的源代码。


    “但这样做是为了什么？”阿莫迪进一步问道。


    “我也说不清。”布罗克曼承认。他们的目标是确保通用人工智能进展顺利。


    像马斯克和埃利泽·尤德考斯基一样抱有末日恐惧的科学家越来越多，阿莫迪也是其中的一分子。大约在一年前，他还在谷歌工作，谷歌因其智能照片管理软件中的视觉识别系统将有色人种归类为大猩猩而饱受批评。谷歌对此表示“震惊”，并彻底删除了智能照片管理软件中的“大猩猩”标签。“拥有这种无法预料的故障表现的系统并非一件好事。”他在播客节目中提及这一事件时说。


    但阿莫迪的担忧并不只限于算法的种族主义和冒犯性决策。他还顾虑DeepMind所掌握的人工智能技术——强化学习。这种技术正在被用于控制物理系统，如机器人、自动驾驶汽车和谷歌的数据中心。他在2016年接受扬·塔林的未来生命研究所的采访时说：“一旦你真正与世界直接交互，并直接控制有形物品，我认为事情出错的可能性……就会开始增加。”阿莫迪对人工智能危害的研究让他看到了越来越多的灾难可能性，他后来在2023年向媒体提出警告，称失控的人工智能将有25%的可能性造成人类灭绝。他继续留在“谷歌大脑”，也无法解决这些风险。因此，在那场发生在OpenAI办公室的深入谈话结束后的几个月，他加入了该组织。


    为了开发通用人工智能，OpenAI的创始团队需要吸引更多资金和人才，因此他们试着把重点放在那些能让媒体正面报道的项目上。他们早期创造了一台在三维战略电子游戏《远古遗迹守卫》中击败顶尖人类玩家的计算机，还打造了一只由神经网络驱动的五指机械臂，能够复原魔方。这些项目试图超越正在大西洋彼岸DeepMind办公室里进行的秘密研究，好让埃隆·马斯克感到满意。


    马斯克从不隐瞒自己对DeepMind的不信任。最初，马斯克每周都去OpenAI的办公室，后来每隔几周去一次。2017年，OpenAI的员工前往SpaceX的总部参加会议，马斯克带领他们参观了设施，并和约40名新入职的人工智能研究员进行了对谈。在某一时刻，马斯克开始谈论他资助OpenAI的原因就在于德米斯·哈萨比斯。


    一位在场人士透露，马斯克说：“我是DeepMind的投资者之一，我非常担心拉里把德米斯当成他的手下。实际上，德米斯只为他自己工作。我也不信任德米斯。”


    研究员们非常吃惊。在大多数人听来，与其说马斯克特别担心人工智能的发展，倒不如说他似乎与哈萨比斯有私人恩怨。当被问及为什么对哈萨比斯怀有敌意时，马斯克提到了这位英国企业家过去所设计的以统治世界为主题的电脑游戏。


    在对谈过程中，马斯克讲述了他与DeepMind另一位投资者的一场谈话。对方称，在早些时候与哈萨比斯的会面中，“我感觉就像电影里的某个时刻，应该有人挺身而出射杀那个家伙”。换句话说，需要有人阻止哈萨比斯开发全能的通用人工智能。


    尽管马斯克不喜欢哈萨比斯，但他还是提醒OpenAI的员工，DeepMind处于领先地位，要向这家英国企业的研究成果看齐。OpenAI的前员工透露，几个月的时间转瞬即逝，马斯克越来越担心OpenAI的技术不如DeepMind的技术强大。


    为了留住他们的最大赞助人，奥尔特曼和布罗克曼带领部分科研人员模仿DeepMind开展工作。例如，《远古遗迹守卫》项目的科研人员就无法理解如果他们的最终目标是开发一个让人类生活更美好的通用人工智能，那为什么要钻研游戏模拟器。原因自然是他们需要马斯克的钱。布罗克曼告诉科研人员：“要是我们不在这方面努力，几年后OpenAI可能就不存在了。”


    虽然OpenAI最终因其在聊天机器人和大语言模型方面的成果赢得了全世界的赞誉，但在最初的几年，它一直在多代理仿真和强化学习领域辛苦耕耘，而DeepMind已经在这些领域占据了主导地位。不过，他们越是在这些领域追赶DeepMind，奥尔特曼及其领导团队就越发意识到一点，那就是这些实现人工智能的方法在现实中并非那么有用。就在此时，OpenAI开始朝着完全不同于DeepMind的组织类型演变。DeepMind看重拥有博士学位的员工，主打等级森严的学术文化。而OpenAI的文化则以工程为导向，其科研人员大多是程序员、黑客和Y
    Combinator项目的创业者，他们往往对创造和赚钱更感兴趣，并不想做出发现并在科学界获得声誉。


    与此同时，马斯克开始坐立难安。他向奥尔特曼抱怨说，他聘请了一堆优秀的科学家，却没有取得任何超越DeepMind的成果。等到这家非营利组织进入第三个年头，马斯克向奥尔特曼表示它已经远远落后于谷歌和DeepMind。随后，他提出了一个快速解决方案：由他接管OpenAI，并将其与特斯拉合并。2018年12月，马斯克在一封发送给奥尔特曼及其团队的电子邮件中说，如果不进行重大改变，OpenAI将永远赶不上DeepMind。后来这封邮件由OpenAI公布，并得到了看过原始版本的人的证实。“何其不幸，人类的未来将掌握在德米斯手里。”马斯克补充道。换句话说，如果马斯克不接管OpenAI，反派哈萨比斯就会得逞。但奥尔特曼和他的合伙人希望继续掌控这家组织。他们拒绝了马斯克的提议。


    2018年2月，OpenAI在关于新赞助人的公开声明中简要提到了马斯克即将退出的消息，但给他找了一个好理由。马斯克的退出是出于道德原因。他在人工智能领域具有太大的利益冲突。“埃隆·马斯克将退出OpenAI董事会，但将继续捐助并提供建议。”这家非营利组织在其网络日志上写道，“随着特斯拉越来越关注人工智能，这将让埃隆避免未来潜在的冲突。”


    许多OpenAI的员工都知道，这种说法是一派胡言。他们认为，尽管马斯克说他在乎的是创造安全的人工智能，但他也想开发能力最强的人工智能。他已经富甲天下，而且在美国基础设施方面拥有史无前例的影响力：美国国家航空航天局正通过SpaceX将宇航员送上太空，特斯拉正主导电动汽车充电标准的制定，马斯克的卫星互联网公司星链正试图影响俄乌冲突的结果。


    显然，马斯克的不可靠也有前科。他曾承诺在几年内向OpenAI捐赠10亿美元，但实际上只捐了5 000万～1亿美元——这对全球最富有的人工智能担忧者来说可谓九牛一毛。在很大程度上，如果他用特斯拉的股票资助OpenAI，兑现这笔钱会相对比较容易。2015—2023年，特斯拉的股价上涨超过180倍，这意味着OpenAI原本可以轻轻松松达到10亿美元的募资目标。尽管马斯克对人类的未来充满担忧，但他似乎更关心如何在竞争中保持领先地位。


    马斯克的退出，切断了OpenAI的主要资金来源。这对奥尔特曼来说是一场灾难。他把人生全部的声誉都押在了这个项目上。为了和他一起工作，一些世界顶尖的人工智能科学家自愿降薪，而现在他想要帮助人类的宏大志向开始显得愚蠢起来。在人工智能发展的新时代，一个简单的事实是，从支付给科研人员的薪水到训练模型的数据，再到运行模型的强大计算机，都离不开资源的堆砌。没有马斯克，满足这些需求的机会正在迅速减少。


    奥尔特曼正面临一个危急关头。他在旧金山OpenAI的办公室里思考怎样才能利用极其有限的资源维持这家非营利组织的运转，并开发可能算不上业界最佳的人工智能模型。或者他应该到此为止，选择关闭这个项目。为非营利组织筹集资金要比为初创公司筹集资金困难得多。奥尔特曼一直在努力劝说富人出于善意为通用人工智能事业捐款，但暂时还看不到成功的可能。他需要数千万美元，而马斯克是他的最后一位大赞助人。


    不过，他还有一个选择。在为人类点燃人工智能乌托邦之光的荣耀之外，也许OpenAI可以给赞助人回报一些直接的经济利益。那将是一个双赢的局面。赞助人与其说是“捐赠”，不如说是“投资”，反正奥尔特曼更喜欢“投资”的说法。但他认为，现实中只有少数几个潜在的赞助人能够为OpenAI提供开发通用人工智能所需的资金和计算能力，那就是谷歌、亚马逊、脸书、微软等科技巨头。除此之外，其他公司既没有数十亿美元的现金，也无法提供占地达数个足球场的强大计算机集群。


    在过去的几年里，OpenAI和DeepMind一直在努力设置屏障，以防止它们制造的超强人工智能系统被滥用。DeepMind试着改变其治理结构，这样谷歌等以利润为动机的垄断企业就不能随意利用通用人工智能赚钱。相反，一个由专家顾问组成的委员会将控制局面。奥尔特曼和马斯克将OpenAI定位为非营利组织，承诺当其他机构即将迈入超级智能机器的门槛时，将与其分享研究成果甚至专利。这样它就会以人类的利益为先。


    现在，挣扎求生的奥尔特曼打算推倒部分护栏。他的态度将从最初的谨慎变为不计后果，而这样做也将改变他和DeepMind一直为之奋斗的人工智能领域，使其从节奏缓慢且主要是学术性追求的一方净土，变为某个更像荒野西部的地方。奥尔特曼会利用他的能力编造一个令人信服的故事，证明他即将背离OpenAI的创立原则是多么合理。他是科技创业者，科技创业者有时必须改变方向。这就是硅谷的运作方式。他只需稍稍调整OpenAI的创立原则即可。


    # 第二幕 巨兽


    ## 7 入局


    游客在伦敦国王十字车站挤成一团，争着要看哈利·波特乘火车前往霍格沃茨的神奇魔法站台；而在几步路之外，摩天大楼高耸入云，由玻璃和金属包层构成的大楼外墙闪闪发光，一种别样的魔法正在其内部上演。熙熙攘攘的行人在楼与楼之间的美丽漫步道上穿梭，其中就有DeepMind的工程师和人工智能科学家。当走到一栋办公楼的玻璃门前时，他们从口袋里掏出通行证。这栋办公楼明面上属于谷歌，但有两层楼专门供给神秘的人工智能实验室使用。


    作为谷歌的一部分，DeepMind获得了许多福利待遇，如午睡舱、按摩室和室内健身房，但它的创始人仍在努力摆脱母公司Alphabet的控制。自收购起已经过去了两年多时间，这家科技巨头的高管向德米斯·哈萨比斯、穆斯塔法·苏莱曼和沙恩·莱格抛出了一个新的前景诱饵。DeepMind不会成为“自治单位”，而是会成为一家有独立损益表的“Alphabet公司”。

