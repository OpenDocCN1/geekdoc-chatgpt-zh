- raw: '他们将公司命名为DeepMind，由哈萨比斯担任首席执行官，紧接着聘请了一名来自哈萨比斯Elixir团队的顶尖程序员，并在哈萨比斯获得博士学位的伦敦大学学院对面租了一间阁楼当作办公室。尽管三个人各有动机，但共同的使命赋予了他们不一般的能量。莱格的目标是尽可能吸引更多的人加入通用人工智能领域，苏莱曼希望解决社会问题，哈萨比斯则想通过探索宇宙并做出重大发现而名垂青史。


    没过多久，他们就因为不同的目标发生了争执。苏莱曼迫切希望哈萨比斯读一读《创造力的差距》（The Ingenuity Gap），这本书塑造了他的世界观，是加拿大学者托马斯·霍默-狄克逊在2000年出版的著作。该书认为，从气候变化到政治不稳定，现代问题的极端复杂性远远超出了我们解决问题的能力。结果导致了创造力的差距，而要想消除这种差距，人类就得在科技等领域进行创新。苏莱曼认为，这正是人工智能可以发挥作用的地方。


    哈萨比斯摇头否定。据某位听到谈话的人说，他曾经告诉苏莱曼：“你忽略了大局。”哈萨比斯似乎认为，苏莱曼只关注当下，对人工智能的看法过于狭隘，通用人工智能应该更好地帮助DeepMind理解人类从何而来以及为什么而去。哈萨比斯举例说，气候变化是人类的宿命，地球可能无法长期承载所有人类。他认为，试图解决当前的问题，就像在命运边缘徘徊。他相信超级智能机器不会像一些人担心的那样变得暴戾并杀死人类。相反，一旦通用人工智能开发成功，就能解决我们面临的一些最深奥的问题。


    哈萨比斯将他的观点提炼为DeepMind的宣传口号：“破解智能，并用智能解决其他一切问题。”他用幻灯片把它展示给投资者。


    但苏莱曼并不赞同这种观点。有一天，他趁哈萨比斯不在，让一名DeepMind的早期员工修改幻灯片，最后口号变成了“破解智能，并用智能让世界变得更美好”。


    哈萨比斯不喜欢这个口号。后来，哈萨比斯再次来到办公室，让同一名员工把它改回原来的样子，“用智能解决其他一切问题”。两人通过员工为公司的使命展开角逐，他们以最英国化的方式避免了直接对抗。


    苏莱曼想要将通用人工智能推向世界，让它立即发挥作用，奥尔特曼最后就是这样做的。他认为应该从现实世界中收集反馈并加以改进，而不是孤立地试图开发一个完美的系统。但哈萨比斯希望DeepMind的运营能看到结果，就像他下棋一样。他不仅要解决现实世界的问题，还要解开困扰几代人的谜团：人类存在的目标是什么？我们是神创造的吗？


    当被问及是否相信神时，哈萨比斯很腼腆。“我确实觉得宇宙中存在神秘的事物。”他说，“但它不是传统的神。”他表示，阿尔伯特·爱因斯坦信仰“斯宾诺莎的神，也许我也会给出类似的答案”。


    巴鲁赫·斯宾诺莎是17世纪的一名哲学家，他提出神实际上等同于自然及一切存在之物，而非独立于世界的存在。这是泛神论的观点。“斯宾诺莎认为自然是神的化身，”哈萨比斯说，“所以研究科学就是探索神的奥秘。”


    将创造通用人工智能视为一种类似于发现神的精神或准宗教体验，这种想法并不疯狂，尤其是在接受斯宾诺莎的观点，即神等同于自然法则的情况下。通过使用人工智能探索这些法则并理解宇宙，理论上能够弄清背后的设计原理。凭借其分析海量数据的能力，人工智能可以研究宇宙中一些最复杂的系统，无论是量子力学还是宇宙现象，然后洞察存在的复杂本质。使用人工智能创建一个模拟宇宙复杂性的环境，也可以揭示宇宙的运行机制。


    此外，如果通用人工智能研究证实宇宙是模拟的（正如库兹韦尔提出的观点），那么最初的程序员很可能是神一样的存在。同理，如果人类创造出一台强大的机器，能够收集并分析所有与物理现象、宇宙有关的可用信息，那么这台机器也可以提出新的理论，表明存在一种更高的力量。它可能只是回答了指向一个神圣实体的深层次问题。当人工智能具备卓越的能力和智力，就能有无数种方法解开人类最深奥的秘密。


    哈萨比斯的宗教背景可能也让他更容易接受人工智能“神谕”的想法。2023年，弗吉尼亚大学对21个国家的5 000余名参与者展开了一项调查，结果表明信仰神或相比之下更看重神的人更有可能相信ChatGPT等人工智能系统给出的建议。根据科研人员的说法，这些人之所以更容易接受人工智能的指导，是因为他们往往更懂得谦卑。他们也能很快认识到人类的弱点。


    哈萨比斯有时会和DeepMind早期的同事谈论神，因为他的脑海中萦绕着人类起源的问题。多位与哈萨比斯共事或认识他的人表示，他多年以来一直是虔诚的基督徒，其中一人表示他开发通用人工智能的初衷就是找到神。


    “我们讨论了很多关于神的话题。”一名在哈萨比斯联合创立DeepMind前后与他共事的同事说，“我们能否创造一台可以逆向思考并理解宇宙的机器？通用人工智能会让你了解我们从何而来，以及神是什么。”哈萨比斯深信他正在实施当代的“曼哈顿计划”。他读过《横空出世》，这本书启发他参考罗伯特·奥本海默的做法，组建了DeepMind的团队，用两名DeepMind前员工的话来说，那就是把大问题分解成很多小的部分，然后让科学家团队集中精力一一解决。


    然而，为了做出这样的重大发现，哈萨比斯需要资金来发展DeepMind。可惜，英国投资者只肯拿区区2万或5万英镑资金换取他新公司的股权。这些钱根本不足以聘请开发通用人工智能所需要的人才，何况他还需要强大的计算机。在保守的英国，开发世界上最强大的人工智能的商业理念似乎有些古怪，甚至有点过于膨胀。英国的科技初创公司倾向于追求能够更快赚钱的“明智”商业理念，比如为股票和债券交易开发一款金融应用程序。哈萨比斯和联合创业伙伴别无选择，只能把目光投向硅谷，那里的投资者愿意为更具未来感的理念投入更多的资金。


    幸好莱格有门路。2010年6月，莱格曾受邀在奇点峰会上发表演讲。奇点峰会是由库兹韦尔（那位令年轻的莱格着迷的作家），以及喜欢投资开拓性新技术的亿万富翁投资家彼得·蒂尔联合创办的一个年会。在峰会上，一些标新立异的人工智能科学家热烈讨论技术那令人敬畏的力量和风险。蒂尔为峰会奠定了基调，他是一个理想主义者。他认为奇点——未来人工智能不可逆转地改变人类的时刻——的到来不是问题，恰恰相反，他担忧奇点到来得太迟，而世界需要强大的人工智能来抵御经济衰退。


    蒂尔拥有雄厚的财力，而且对雄心勃勃的项目充满热情，是投资DeepMind的完美人选。“投资一家通用人工智能公司需要足够狂热的内心，”莱格回忆道，“他们不仅要财大气粗，不把几百万美元当回事，而且要热爱超级有野心的项目。他们要具备逆向思维，因为每个与哈萨比斯交谈的教授都会告诉他‘这样做绝对不行，想都别想’。”


    蒂尔是一个特立独行的人，虽然硅谷到处都是爱好标新立异的思想家，但蒂尔经常与他们产生分歧。硅谷的大多数人都投票给民主党自由派，他却转向右翼政党，成了美国总统唐纳德·特朗普最大的捐助者之一。大部分企业家深信竞争驱动创新，蒂尔却在其著作《从0到1》中提出垄断企业在推动创新方面做得更好。他蔑视通往成功的传统路径，鼓励聪明、有创业精神的孩子从大学辍学，加入他的“蒂尔奖学金”项目。他对长寿和奇点理论的狂热追求，恰好符合DeepMind创始人所要求的“疯狂”标准。


    三位创始人决定在奇点峰会上向蒂尔推荐他们的创业项目。蒂尔赞助了这场峰会，所以他们认为蒂尔会坐在前排。莱格询问峰会的组织者能否让他和哈萨比斯一起上台，这样一来，蒂尔就能从这位前国际象棋冠军那里听到有关以人类大脑为灵感构建通用人工智能的想法。奇点峰会在旧金山的一家酒店举行。哈萨比斯身穿酒红色毛衣和黑色休闲裤，颤抖着走上舞台，这一刻将决定新公司的生死。但当他向台下的数百名观众望去时，并没有在前排看到蒂尔。蒂尔根本没来现场。


    他们以为失去了机会，但莱格随后收到了一封邀请函，请他参加蒂尔在旧金山湾区宅邸举办的聚会，他设法也给他的合伙人弄到了一封邀请函。哈萨比斯知道蒂尔喜欢下棋。蒂尔曾经是美国13岁以下最优秀的国际象棋选手之一。现在他和蒂尔有了共同点，就有机会激发蒂尔的兴趣。根据哈萨比斯多次向媒体透露的说法，聚会期间，他开始和蒂尔攀谈，并随口提到了象棋比赛。


    “我认为国际象棋代代相传的原因之一是马和象的完美平衡。”哈萨比斯在侍者分发迷你三明治的时候对蒂尔说，“我认为这导致了创造性的不对称张力。”


    蒂尔瞬间来了兴趣。他说：“你何不明天再来好好谈谈？”这次谈话非常成功。蒂尔投资140万英镑，用以助力DeepMind推动奇点的到来。


    哈萨比斯试图筹集更多的资金来发展他的人工智能公司，但作为一名企业家，他的处境十分尴尬。首批支持他的投资者不全是为了赚钱，而是因为他们对人工智能有着近乎道德的信念。这意味着他在公司的经营上面临更大的压力，不仅要赚钱，而且要在条条框框的限制下开发人工智能。


    当时流行的一种观点是，人工智能的开发需要非常谨慎，这样它就不会脱离人类的控制并试图摧毁它的创造者。这些正是另一位想要支持DeepMind的富有捐赠人的担忧——他与蒂尔恰好观点相反。哈萨比斯在去牛津参加“冬之智能”（Winter
    Intelligence）大会期间遇见了这位捐赠人。这是计算机科学研究领域的一个边缘性会议，会上有一些激进的思想者畅谈控制超级智能所面临的挑战。哈萨比斯发言后不久，一名留着金色短发、操着北欧口音的男子向他走来。


    “你好！”他朝哈萨比斯走去，同时伸出手说道，“我叫扬，是Skype（即时通信软件）的联合创始人。”


    来自爱沙尼亚的扬·塔林是一名计算机程序员，他为Kazaa开发了点对点技术，Kazaa是21世纪初最早提供盗版音乐和共享电影服务的软件之一。他为Skype改进了这项技术，并买入了这家免费通话服务商的股份。2005年，eBay（美国线上拍卖及购物网站）以25亿美元的价格收购Skype，扬·塔林也大赚了一笔。现在，他打算用赚来的一部分钱投资其他初创公司。塔林竖着耳朵听完了哈萨比斯的演讲。他最近格外关注强大的人工智能所带来的危险。


    早在2009年的春天，塔林就发现了人工智能的漏洞，当时他一直在读LessWrong网站上的文章。LessWrong是一个成员关系紧密的在线论坛，其中许多成员是软件工程师，他们担心人工智能将对人类的生存构成威胁。他们的领袖以及网站的创建人是一个留胡子的自由主义者，名叫埃利泽·尤德考斯基。他是一个能力很强的高中辍学生，自学了人工智能研究和哲学的基础知识，他撰写的文章吸引了网站的成员。尤德考斯基正是奥尔特曼所说的那种在提及人工智能安全时“极度紧张”的人。因为他认为，人工智能消灭人类的可能性比我们任何人意识到的都要高。


    例如，一旦人工智能达到一定的智能水平，它就可以策略性地隐藏自己的能力，直到人类无法控制它的行为。然后，它可以操纵金融市场、控制通信网络，或者使电网等重要基础设施瘫痪。尤德考斯基写道，开发人工智能的人往往不知道，他们正在把世界推向毁灭。


    这些文章让塔林忐忑不安。他刚刚读完罗杰·彭罗斯的《意识的阴影》（Shadows of the Mind），已经在着手研究书中的结论。这位著名的物理学家和数学家在书中表示，人脑可以完成计算机永远无法完成的任务。哈萨比斯等人提出的大脑是“机械的”，可以成为开发人工智能的有用参考的观点站不住脚，因为人类的大脑独一无二，它几乎不可复制。


    但塔林对这一结论耿耿于怀。要是能够模拟人类的大脑开发人工智能呢？那不就意味着我们正在构建某些具有潜在危险的东西吗？这位Skype创始人想多听听尤德考斯基的看法，于是匆匆记下了一串问题，试图在一些毁灭论中找出漏洞。要想弄清楚这些论点是否属实，最好的办法就是当面见一见LessWrong的创建人。


    幸运的是，塔林正打算乘坐飞机前往旧金山参加一场会议，所以他给尤德考斯基发了一封电子邮件，问他是否想要当面聊一聊。尤德考斯基回复说可以。他们在距离旧金山国际机场不远的密尔布瑞市的一家咖啡馆坐下，塔林立即逐一提出他的问题。如果人工智能具有潜在危险，我们何不把它建在虚拟机器上，与其他计算机系统隔离开？想必这将阻止人工智能渗透进我们的物理基础设施，防止它关闭电网或操控金融市场。


    尤德考斯基马上给出了答案。“完全虚拟是不可能的。”他一边喝咖啡一边回答。电子可以向四面八方流动，因此强大的人工智能系统总有办法触及和改变硬件配置。


    这证实了塔林的担忧。他认为，人工智能总有一天可以自我开发基础设施和计算机底层结构。这样的事一旦发生，后果将不堪设想。


    塔林说：“它可以改造地球甚至太阳。”当科学家认为人工智能只是数学，没有必要害怕时，塔林喜欢将它比作老虎。“你可以说老虎只是一系列的生化反应，没有必要害怕它。”但老虎也是原子和细胞的集合，如果不加以控制，它会造成很大的破坏。同理，人工智能也许只是高等数学和计算机代码的组合，但如果组合方式错误，也可能会非常危险。


    两年后，塔林在牛津会议上听到了哈萨比斯的演讲，此时他已经成了一名人工智能末日论的信徒。自从咖啡馆那次会面后，他一直在读尤德考斯基的文章，并沉浸于一个叫作“人工智能对齐”的新研究领域。该领域的科学家和哲学家正在研究如何最好地使人工智能系统与人类的目标“对齐”。


    塔林回忆道：“我把对齐当成解药。”但就尤德考斯基所描绘的未来人工智能而言，他相信会有一些更极端的情况存在。


    经过最初的闲谈，塔林急于了解哈萨比斯是否愿意更紧密地合作。他问这位英国企业家：“你想找个时间在Skype上谈谈吗？”


    哈萨比斯和这名富有的爱沙尼亚人又谈了一次，塔林最后同彼得·蒂尔一道成了DeepMind的早期投资人。他的目标不仅是赚钱，更是为了关注哈萨比斯的进展，确保其不会在无意中创造出一个可怕的、失控的人工智能。塔林将自己视为尤德考斯基思想的传道者。他希望利用自己作为财力雄厚的投资者的信誉，将尤德考斯基的警告传递给世界上最有前途的人工智能开发者。


    “埃利泽自学成才，在他的小圈子之外没有多大影响力。”塔林解释说，“我想我可以把这些观点传达给那些对埃利泽无感，但对我有兴趣的人。”


    在成为DeepMind的投资人以后，塔林推动DeepMind朝着安全的方向发展。他知道哈萨比斯不像他那样担忧人工智能带来的灾难性风险，于是向公司施压，要求聘用团队研究设计人工智能的不同方法，使其与人类的价值观保持一致，并防止其偏离轨道。


    DeepMind还将迎来一位财力更雄厚的投资者，他也希望引导公司关注安全问题。此时，硅谷到处在传小道消息，说彼得·蒂尔投资了英国伦敦的一家初创公司，该公司试图开发通用人工智能，前景一片光明但行事神神秘秘。硅谷的一些科技亿万富翁也开始听说这件事，其中就包括埃隆·马斯克。2012年，也就是在联合创办DeepMind两年后，哈萨比斯前往加利福尼亚州参加蒂尔举办的一场私人研讨会，在活动中遇见了马斯克。


    “我们一拍即合。”哈萨比斯说。这位英国企业家知道机会来了，他得筹集更多资金才能拓展DeepMind的研究——而且，他也很想看看马斯克的火箭工厂。当时，马斯克被外界视为一个特立独行的富豪，他希望通过他的公司SpaceX（太空探索技术公司）将人类送上火星。哈萨比斯计划在洛杉矶的SpaceX总部与马斯克见面。


    不久后，两人面对面坐在公司的食堂里，周围散落着火箭零件。他们开始争论星际殖民和开发超级人工智能哪个才是最具历史意义的伟大项目。


    根据《名利场》杂志一篇关于这次会面的文章，马斯克是这样说的：“如果人工智能失控，人类必须有能力逃到火星。”“我想人工智能会跟着大家一起去火星。”哈萨比斯回答。他似乎被逗乐了，马斯克却不然。塔林深受尤德考斯基文章的影响，而马斯克则被牛津大学教授尼克·波斯特洛姆所打动。


    波斯特洛姆写了一本书，叫作《超级智能》，这本书在人工智能和前沿科技领域的从业人员中引起了轰动。在书里，波斯特洛姆警告说，开发“通用”或强大的人工智能将会给人类带来灾难性后果。但他认为，人工智能摧毁我们不一定是因为它暴虐或渴求权力，它可能只是在尽自己的职责。举例来说，如果它收到的任务是制作尽可能多的回形针，那么它可能会决定把地球上所有的资源甚至人类都变成回形针，以此作为实现其目标最有效的方式。这个例子在人工智能界催生出一句格言，即我们需要避免被变成“回形针”。


    马斯克也跟投了DeepMind。哈萨比斯终于获得了一些经济保障，虽然还不够。他仍在追求某种高度实验性的东西，疯狂到即使世界上最有钱的人也不想把太多的钱押在他的成功上。这些资金还附带着条条框框的限制：塔林和马斯克对DeepMind的关注带着一种不同寻常的怀疑和警惕，超出了投资者的义务范围。当然，他们希望DeepMind在经济上取得成功，但不希望DeepMind发展得太快或危及人类。这让哈萨比斯进退两难。他感激塔林和马斯克的投资，但并不像他们那样笃信末日论。


    事实上，这种经济保障没有持续多久。哈萨比斯和苏莱曼需要拼命地赚钱，才能支付得起这些全球顶尖人工智能人才的薪水，他们的创收手段也是五花八门。他们尝试搭建了一个网站，利用深度学习技术为用户提供时尚建议并推荐衣着搭配。深度学习是DeepMind率先钻研的一种机器学习模式。随后，哈萨比斯让一些曾经在Elixir工作、如今在DeepMind工作的员工设计一款电子游戏。据一名DeepMind的前员工透露，工程师们齐心合力完成了一款太空探险游戏，游戏内容与宇航员乘坐火箭展开登月竞赛相关。当他们正准备将游戏上架到苹果的应用程序商店时，哈萨比斯得到了一个新的机会，可以为他提供实现通用人工智能所需的资金支持。这次报价来自脸书。


    马克·扎克伯格当时正忙着大举收购公司。约一年前，他以10亿美元的价格收购了Instagram（照片墙），堪称社交媒体整合案例中的绝妙之举。再过几个月，他还会向WhatsApp（跨平台即时通信应用程序）的创始人支付190亿美元巨款。他准备不惜一切代价扩张脸书帝国，而人工智能将是其中的重要组成部分。脸书大约98%的收入来自广告销售，但要想销售更多的广告并保持增长，扎克伯格就必须让用户在他的网站停留更长的时间。DeepMind的那些天才人工智能科学家会有所帮助。通过更智能的推荐系统来筛选用户个人信息，脸书和Instagram背后更智能的算法就可以将合适的图片、帖子和视频推荐给用户，以便延长用户的浏览时间。


    据一名知情人士透露，扎克伯格向哈萨比斯出价8亿美元收购DeepMind，这个数字还不包括公司创始人留下来工作四五年之后通常会得到的奖金。这个出价很大方，远远高于哈萨比斯的理想价格。现在，他发现自己走到了十字路口。到目前为止，DeepMind的资金来源一直是那些希望他谨慎开发人工智能的人。而眼下，希望他尽快进行开发的投资者也可能加入进来。毕竟脸书的座右铭就是“快速行动，打破常规”。


    哈萨比斯和苏莱曼商量如何应对这种局面。通用人工智能实际上比扎克伯格意识到的更加强大，他们自觉需要做好准备，以防止大公司收购者将人工智能导向一个可能有害的方向。他们不能只让脸书签合约来承诺不得滥用通用人工智能。回想以前在非营利组织工作的经验，苏莱曼告诉哈萨比斯和莱格，他们需要建立某种治理结构，用来监督并保证脸书会谨慎使用DeepMind的技术。'
