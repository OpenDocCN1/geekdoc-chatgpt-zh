  trans: '

    # 8 一切都很美好


    谷歌在创立之初提出了“不作恶”（don''t be evil）的座右铭，`DeepMind`在加入谷歌之时也怀有良好的意愿。为了保留伦理委员会，他们甚至拒绝了`Facebook`，少赚了
    1.5 亿美元。但几年后，他们似乎把业绩和声望看得比伦理和安全更重要。除了聘请陶哲轩等“全明星”数学家团队以外，对于如何控制通用人工智能，又或者如何防止这项技术被用于不良目的，他们一概不清楚。


    这也引发了一个更大的问题。大型公司有可能在内部对人工智能伦理进行一些有意义的研究吗？谷歌已经给出了响亮的回答：不行。


    ## 科技巨头的市场统治地位


    要想理解为什么在谷歌内部开发合乎伦理的人工智能系统，甚至说将创新理念转化为产品变得如此艰难，就得退一步了解某些数据。在撰写本书期间，谷歌母公司`Alphabet`的市值达
    1.8 万亿美元，`Amazon`和`Microsoft`的市值分别约为 1.7 万亿美元和惊人的 3 万亿美元。2020 年，`Apple`成为美国第一家市值突破
    2 万亿美元的上市公司。在 2018 年`Apple`成为第一家市值达万亿美元的公司之前，从未有企业能达到如此规模。然而，几乎所有全球最有价值的公司都存在一个共同点：它们都是科技公司。事实上，那些我们通常认为是庞然大物的公司，其规模只有硅谷同行的
    1/4。石油巨头`ExxonMobil`的市值只有 4500 亿美元，`Walmart`的市值为 4350 亿美元。把这些科技巨头的市值加在一起，就能超过世界上除中美以外的大多数国家的国内生产总值。


    回顾历史，与现在的这些科技巨头相比，曾经那些我们认为是庞然大物的公司根本不值一提。在 1984 年被分拆前的鼎盛时期，美国电话电报公司的市值按当时的汇率计算约为
    600 亿美元，按现今的汇率计算约为 1500 亿美元。`General Electric`的最高市值是 2000 年的 6000 亿美元左右。


    科技巨头的市场主导地位也达到巅峰。在 1911 年被监管机构拆分前，标准石油公司控制了美国 90%的石油业务。如今，`Google`控制了世界上 92%的搜索引擎市场，全球每天约有
    10 亿人使用`Google`进行搜索；`Facebook`用户超过 20 亿人；`Apple`手机用户约有 15 亿人。历史上没有哪个政府或大集团能够同时调动这么多人。


    经历了互联网的起起落落，这些公司用了 20 多年的时间就达到了现在的规模。它们是如何做到的？它们收购像`DeepMind`、`YouTube`和`Instagram`这样的公司，它们还收集大量的消费者数据，并大规模向用户投放影响消费行为的广告和推荐。`Google`通过搜索查询和`YouTube`互动收集数据，`Amazon`跟踪用户的购买和浏览行为。它们收集的数据包括个人详细信息、浏览行为、位置数据，在某些情况下甚至还有语音记录，其规模之大超出常人想象。这些数据不仅数量庞大，而且种类繁多，为科技公司详细描绘了消费者的行为。


    `Facebook`、`Google`等公司使用这些数据定向投放、展示激发用户兴趣的广告，同时改进复杂的推荐算法。在软件的加持下，“信息流广告”弹出的内容让用户每天都欲罢不能。这些公司致力于让我们尽可能地沉迷于它们的平台，因为这样可以产生更多的广告收入。但不利影响也很多。一项研究显示，2023
    年美国人沉迷`Facebook`、`Instagram`等社交媒体应用达到了平均每天查看手机 144 次的程度。


    这些个性化的“内容推送”也加剧了数百万人之间的代际裂痕和政治分歧，因为最吸引眼球的往往是那种会激起愤怒的内容。例如，在 2016 年美国大选期间，`Facebook`经常通过信息流广告推荐煽动性十足的政治内容，向许多用户推送强化他们现有信念的新闻和观点，制造“回声室效应”。同样的现象也发生在英国“脱欧”公投前的几个月，加深了英国民众对移民的不满情绪，以及
    2017 年缅甸罗兴亚人危机。一份报告显示，`Facebook`的算法加速了仇恨罗兴亚人内容的传播，对施暴者的行动起到了推波助澜的作用。`Facebook`在新闻报道中承认，其没有采取足够的措施来防止煽动针对罗兴亚人的暴力。


    虽然`Facebook`到处煽风点火，但该公司将数十亿用户及相关数据当作产品、将广告主当作真正客户的商业模型非常成功。它获取的数据越多，从广告主那里赚到的钱就越多。这种以参与度为导向的模式，对社会造成了不利影响，却在驱使`Facebook`竭力扩张。


    网络效应是这些公司扩张成功的另一个原因，所有创业者都渴望迎来这种仿若魔法的现象。网络效应的基本概念是，一家公司拥有的用户和客户越多，算法就会变得越强，竞争对手就越难追赶，从而进一步巩固自身的市场占有率。以`Facebook`为例，由于使用`Facebook`的人越来越多，新用户自然也会留存，许多用户常年使用`Facebook`或者说至少忍住没有删除`Facebook`账户也是出于同样的原因。如果你是`Apple`的粉丝，就会知道换用`Samsung`等其他品牌，或者让后者的配件与`iPhone`兼容是多么困难。相互关联的产品和服务让用户很难改变使用习惯，从而巩固了`Apple`的主导地位。


    对于这些公司的规模变得如此庞大会造成什么影响这一问题，我们没有历史可供参照。`Google`、`Amazon`和`Microsoft`目前所达到的市值前所未有。它们给公司股东（包括养老基金）创造了更大的财富，但也产生了集权效应，让少数几个大富豪运营的少数几家大公司掌握着数十亿人的隐私、身份、公共话语权和日益重要的就业前景。


    毫无疑问，对于那些发现问题的科技巨头的员工来说，拉响警报就像是在`Titanic`撞上冰山之前试图让它返航一样，不过是徒劳。然而，这并没有阻止人工智能科学家`Timnit
    Gebru`做出尝试。


    ## 蒂姆尼特·格布鲁：异类的视角


    2015 年 12 月，`Sam Altman`和`Elon Musk`在神经信息处理系统大会上宣布他们正在开发“造福人类”的人工智能。`Gebru`环顾会议现场的数千名参会者，不寒而栗。她仿佛是“异类”。`Gebru`是一名
    30 岁出头的黑人女性，她的成长经历与那些享有常规教育支持系统的同龄人完全不同。


    她的父亲来自厄立特里亚，是一名电气工程师，于她 5 岁时去世。十几岁时，她逃离了饱受战争蹂躏的埃塞俄比亚。在马萨诸塞州读高中期间，老师们并不看好她作为新移民所抱有的雄心。他们劝她不要去上大学先修课程，说她可能很难跟上。根据《连线》杂志对`Gebru`的报道，她回忆起一名老师对她说的话：“我见过很多和你一样的人，他们都觉得自己一来就能跟上最难的课程。”但`Gebru`还是上了先修课程，并获得了在`Stanford
    University`学习电子工程的机会。


    最后，她偶然迈入了人工智能与计算机视觉领域，人工智能与计算机视觉是一种可以“看见”和分析现实世界的软件。这项技术让人着迷，但`Gebru`发现了危险信号。从信用评分到发放抵押贷款，从警用脸部识别到司法刑事判决，人工智能系统在社会生活中扮演着重要角色。这些系统看似完美的“中立仲裁者”，但事实往往并非如此。如果用于训练的数据充满偏见，这些系统也不可能行事公道。而`Gebru`就是偏见的受害者。


    例如，年轻的她和一位黑人女性曾在旧金山的一家酒吧遭到数名男性掐脖袭击。她们去寻求帮助，警察却指控她们说谎，还把她们关在牢房里。还有一次，`Gebru`正在`Stanford
    University`写论文，却得知全校只有一名黑人获得了计算机科学博士学位。2015 年，`Altman`和`Musk`在全球规模最大的人工智能大会上宣布成立`OpenAI`，大会参会者达到
    5000 人，但其中只有 5 人是黑皮肤。


    `Gebru`知道这些都不是个例。在她周围的世界里充斥着偏见。从文化层面看，尽管 20 世纪的民权运动已经成功了几十年，但种族主义仍然深深烙印在内外世界。人工智能可能加剧这种情况。在一开始，它通常就是由没有经历过种族主义的人开发的，这也是为什么用于训练人工智能模型的数据在许多情况下不能公正地描绘少数族裔和女性。


    ## 算法偏见的实证：COMPAS 与预测警务


    ### COMPAS 量刑系统的种族偏见


    `Gebru`在学术研究的过程中察觉了这些后果。她偶然看到了一份调查报告，主题是关于美国刑事司法系统所用的软件，软件的名称叫`COMPAS`（罪犯矫正替代性制裁分析管理系统），被法官和假释官用来辅助做出保释、量刑和假释决定。


    `COMPAS`使用机器学习技术对被告人进行风险评分。评分越高，他们再次犯罪的可能性就越高。该工具对黑人被告的评分远远高于对白人被告的评分，但这种预测往往并不准确。根据非营利新闻机构`ProPublica`在
    2016 年进行的一项研究，就未来的犯罪行为而言，系统对黑人被告的误判是对白人被告的两倍。这项研究调查了佛罗里达州被逮捕者的 7000 个风险评分，同时核查了他们在接下来的两年里是否被指控犯有新罪行。该工具将后来再次犯罪的白人被告误判为低风险的概率也更高。美国刑事司法系统已经对黑人产生了偏见，而随着人工智能工具的使用，这种偏见似乎还会继续下去。


    ### 谷歌街景与人口特征推断


    `Gebru`在`Stanford University`撰写博士论文时提到了官方机构不当使用人工智能的另一个例子。她训练了一个计算机视觉模型来识别`Google
    Street View`上显示的 2200 万辆汽车，然后深入研究了这些汽车可能反映出的地区人口特征。她将这些汽车与人口普查及犯罪数据相互对照，发现大众汽车和皮卡汽车多的地区往往白人居民更多，`Oldsmobile`汽车和`Buick`汽车多的地区则黑人居民更多，而货车更多的地区犯罪报告也更多。这种相关性可能被不当利用。如果警方像电影《少数派报告》里那样，利用这些数据来预测犯罪可能发生的地点呢？


    ### 预测警务的恶性循环


    这个想法并不奇怪。几年来，美国各地的警察局一直在用计算机协助警察确定巡逻区域，这种技术被称为“预测警务”。但该软件是用历史数据训练的，因此经常针对少数族裔社区发布巡逻通告。如果数据表明某个社区受到了过多的警察监控，那么该软件会导致这一社区继续受到过度的警察监控，从而加剧先前存在的问题。


    ## 语言模型中的刻板印象：词嵌入技术


    人工智能也在互联网上潜移默化地传播其他刻板印象。`Google Translate`和`Bing Translate`在翻译过程中有时会将某些职业变得男性化。含有中性代词的土耳其语短语`o
    bir muhendis`被翻译为`他是工程师`，而`o bir hemsire`则被翻译为`她是护士`。软件之所以做出这样的假设，是因为一种叫作“词嵌入”的流行技术，这种技术专门研究那些经常共同出现的词语，如“工程师”应该搭配什么使用。于是，翻译模型就找到了“他”这个最合适的词。`Google`、`Facebook`、`Netflix`和流媒体音乐平台`Spotify`都使用词嵌入技术支持各自的在线推荐系统，根本不顾及它们正在将现实世界的性别失衡导入软件。


    ## 格布鲁的公开信与 OpenAI 成立


    显然，人工智能的问题应该优先得到解决，所以当 2015 年`Sam Altman`宣布成立`OpenAI`时，`Gebru`异常愤怒。她开始撰写一封公开信，谴责`Musk`、`Thiel`等少数以自我为中心的亿万富翁投资开发全能人工智能的举动是多么浪费，他们竟然还声称对这家新成立的非营利组织的唯一担忧是科研人员太过关注深度学习。


    “一个在种族隔离时期出生并长大的白人科技大亨，连同一群全是白人男性的投资者、研究员，正在试图阻止人工智能‘接管世界’，而我们看到的唯一潜在问题竟然是‘所有的科研人员都在钻研深度学习’？”她写道，“`Google`最近推出的一种计算机视觉算法将黑人归类为大猩猩。大猩猩！有些人试图为这次不幸辩解，说一定是算法把肤色当成了人类分类的基本区分元素。假使团队中有一个黑人，或者只要有一个考虑种族问题的人，就不会发布一款将黑人归类为大猩猩的产品……想象一下算法经常将白人归类为非人类的情况吧。没有一家美国公司会认为这样的人体检测系统可以投入使用。”


    `Gebru`的一名同事叫她不要发表这封信。这封信写得太直白了，可能会暴露她的身份。`Gebru`决定保密（直到几年后才将其公开），但她忍不住要问，为什么在人工智能已经对人类造成真正伤害的今天，一些硅谷大佬还在担忧人工智能可能会毁灭世界。原因有二。第一，`OpenAI`和`DeepMind`的高层几乎不会，也永远不会成为种族主义或性别歧视的受害者。第二，大声疾呼全能人工智能的风险正好符合他们的企业利益。警告人们你试图销售的某种东西很危险这种行为可能说不通，但这是一个聪明的营销策略。人们往往更关心此时此地，而不是长期的未来。要是人工智能看起来突然要推翻人类世界，那么我们也会对它的能力惊愕失色。


    该策略的聪明之处还在于，它将公众的注意力从迫切而棘手的问题转移开来，公司解决这些问题往往需要放慢开发速度、限制人工智能模型的能力。减少人工智能模型做出偏颇决策的一个方法是，花费更多的时间分析训练它们的数据。另一个方法是缩小它们的规模，这可能会对人工智能系统的知识概括能力造成影响。


    ## 从塑料回收到 AI 伦理：转移视线的策略


    这不是大型公司第一次在扩张业务时转移公众视线。20 世纪 70 年代初，在石油公司的支持下，塑料行业开始推广回收利用的理念，以解决日益严重的塑料垃圾问题。例如，成立于
    1953 年的组织“让美国保持美丽”（`Keep America Beautiful`）通过开展公共服务活动鼓励消费者回收利用，其资金来源之一就是饮料和包装公司。1971
    年，该组织在“世界地球日”推出了著名的广告短片《哭泣的印第安人》，鼓励人们回收利用瓶子和报纸，为防止污染贡献力量。否则，他们就是在破坏环境。


    回收利用本身并不是一件坏事。但这么一来，塑料行业可能会辩称只要回收利用得当，塑料就不是什么有害物品，从而将责任从制造商转移给消费者。塑料公司清楚大规模回收利用不仅成本高，而且效率低。美国全国公共广播电台和美国公共广播公司的系列节目《前线》在
    2020 年开展的一项调查显示，尽管公共意识运动开展了几十年，但得到回收利用的塑料不到 10%。


    不过，这些运动确实将公众的注意力从质疑塑料生产的快速扩张及其对环境的危害上转移了。回收利用成为公共话题。华盛顿的媒体、消费者和政策制定者开始更多地讨论如何扩大回收利用规模，而不是监管公司的实际塑料产量。


    就像大型石油公司将世界的注意力从它们对环境的重大影响上转移开一样，人工智能的主要开发者也可以利用有关“未来终结者”或“天网”的流言，让人们不再关注机器学习算法已经造成的问题。现在，开发者及整个行业都得以卸下责任的重担。这个问题我们稍后还会讨论。


    ## 面部识别技术的种族与性别偏见


    2017 年 1 月，也就是在`DeepMind`试图利用`AlphaGo`帮助`Google`重返中国几个月前，`Gebru`向硅谷的一群风险投资家和高管展示了她的论文研究成果。她一边点击幻灯片，一边解释说人工智能系统可以将识别汽车的能力与预测投票模式或家庭收入等事项的能力结合起来。


    在场的风险投资家`Steve Jurvetson`大为震惊，他是`Elon Musk`的朋友，也是`Tesla`的股东。但让`Jurvetson`惊讶的原因并不如`Gebru`所想。天知道这类数据会给`Google`带来多大的价值，而它们对不同社区或城镇形成的论断又将产生多大的影响。他对此印象很深，便把`Gebru`演讲的照片发到了`Facebook`上。


    在关于人工智能的争议声中，有些人看到了赚钱的机会，而有些人，如`Gebru`，则看到了需要被遏制的危险。每次人工智能的能力得到增强，都伴随着意想不到的后果，而这往往会伤害到少数族裔。面部识别系统几乎可以完美识别白人男性面孔，但经常识别不出黑人女性。毕业于`MIT`的研究员`Joy
    Buolamwini`在 2018 年开展的一项研究显示，`IBM`、`Microsoft`以及中国`Face++`（北京旷视科技有限公司旗下的新型视觉服务平台）的面部识别系统更有可能错误识别有色人种的性别和女性的面孔。她是在自己的面部不能被类似程序识别时注意到的这一点。这些系统大多是用白人男性占主导的照片数据集和从网上抓取的照片进行训练的。数据库里白人男性占比过高，原因在于他们接触互联网的机会更多。


    ## 解决之道：数据集数据表与文档规范


    `Gebru`没有屈服，她找到了解决办法。一是让人工智能开发人员在训练模型时遵循更严格的标准。她在加入`Microsoft`后起草了一套叫作“数据集数据表”的规则，要求程序员在训练人工智能模型时创建一个数据表说明所有细节，包括创建过程、模型架构、使用方式、潜在缺陷等伦理考虑因素。对于人工智能开发人员来说，多出来的文书工作无疑让他们倍感恼火，但这样才能有的放矢。要是模型做出了偏颇决策，找原因就会容易得多。


    弄清人工智能系统为什么犯错，远比大家想象的要难，尤其是在它们越来越复杂的情况下。2018 年，`Amazon`发现公司用于筛选求职申请的内部人工智能系统一直偏向推荐男性候选人。原因是开发人员在训练它时使用了过去
    10 年提交给公司的简历，而这些简历大多来自男性求职者。模型由此学习到拥有男性特质的简历更受欢迎。但`Amazon`没有，或者说没办法修复这个漏洞，只能彻底停用该工具。


    在照片工具把黑人标记为“大猩猩”的事件中，`Google`也采用了相似的粗暴方法，完全关闭程序识别大猩猩的功能，但不影响其识别其他动物。`Google Photos`之所以犯下这一令人尴尬的错误，是因为`Google`没有使用足够的黑人等有色人种图像对它进行训练，可能也没有在员工身上进行足够多的测试。但即使到了
    2023 年底，该公司也没有自信能够通过调整人工智能模型来修复漏洞，只好将该功能关闭。


    ## “黑箱”难题：神经网络的不可解释性


    一些人工智能科研人员表示，要纠正这些偏见太难了，因为现在的人工智能模型复杂到就连它们的创造者也不理解它们做某些决定的原因。神经网络等深度学习模型含有数百万个甚至数十亿个参数，也叫“权重”，这些参数在连接层之间的复杂数学函数中充当调节器。神经网络层有点像采用流水线作业的工厂，流水线上的每个人都有特定的工作内容，比如给玩具汽车上色或装车轮。最后，你会得到一辆玩具汽车。神经网络的每一层就像流水线上的一个工作站，各自对数据进行一些小的调整。问题在于这么多小变化是依次发生的，很难准确地追溯流水线上的每个工作站（或者神经网络层）在制造玩具汽车（或者决定标记黑人被告为“再次犯罪风险很高”）的过程中做了什么。


    ## 玛格丽特·米切尔：另一位伦理卫士


    ### 图像描述系统的“一切都很美好”


    在`Google`因大猩猩事件上了新闻之后，一位名叫`Margaret Mitchell`的计算机科学家也加入了这家搜索巨头，设法避免类似的错误再次发生。`Mitchell`出生于`Los
    Angeles`，在人工智能科研人员中以致力于机器学习的公平性而闻名，她之所以进入这个“小众”但欣欣向荣的赛道，是希望更加谨慎地对待机器学习系统对现实世界的影响。同`Gebru`一样，她也担心人工智能系统所犯的奇怪错误。在攻读博士学位期间，她的主要研究方向是计算机语言和自然语言生成，也就是计算机描述物体或分析文本情感的方式。她在`Microsoft`为盲人开发了一款应用程序，结果却不安地发现它将像她这样的白人描述为“人”，而将深色皮肤的人描述为“黑人”。


    还有一次，她对一个描述图像的神经网络进行测试，并输入了一些英国工厂爆炸的图像。其中一张照片拍摄于附近一间公寓的高处。照片上浓烟滚滚，有一家电视新闻频道正在最前方报道该事件。当看到人工智能系统将这张图像描述为`很棒`、`美`、`壮观`时，`Mitchell`目瞪口呆。


    `Mitchell`说：“这套系统的问题在于，对它来说一切都很美好。”这让人想起《乐高大电影》里那首著名的歌曲，这首歌讲述了一个掩盖了生活中所有烦恼的积木世界的故事。“它没有死亡的概念，也没有死亡是不好的概念。”


    人工智能真正从照片训练中学到的，是落日很美，是站在高处能看到很好的景色。`Mitchell`恍然大悟。对人工智能来说，数据就是一切。她对各种偏见（包括无视人命的倾向）进行编码，通过制造数据缺口来训练自己的系统。


    在`Google`研究这些问题的同时，`Mitchell`还发现了在大型科技公司工作的又一个缺点。没完没了的会议、总是在担心公司名誉的管理层……公司的官僚作风让她喘不过气来。


    ## 加入谷歌：伦理团队的组建与隐忧


    ### 安迪·鲁宾事件的阴影


    2018 年，`Mitchell`向`Gebru`发送了一封电子邮件，邀请她加入`Google`。人工智能伦理学是一个很“小众”的领域，她们早已相互认识。但问题是，`Gebru`愿意同`Mitchell`一起领导`Google`的伦理人工智能研究团队吗？


    `Gebru`犹豫不决。她从小道消息听说`Google`不是一个工作的好地方，尤其是对女性和少数族裔而言。`Google`高管`Andy Rubin`就是最好的例子。`Rubin`过去一直是`Google`的明星人物，领导开发了广受欢迎的`Android`操作系统，但在
    2014 年被指控性行为不端，随后悄悄离开了公司。几年后，《纽约时报》的一篇报告表明，`Google`的管理层对性行为不端指控进行了调查，并确认了其真实性。然而，`Google`并没有将`Rubin`扫地出门，反而给了他英雄般的告别，其中包括
    9000 万美元的离职补偿。

    '
