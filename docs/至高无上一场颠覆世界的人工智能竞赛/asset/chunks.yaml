- raw: '但现在，谷歌维持了20多年的搜索引擎霸主地位开始摇摇欲坠。这些年来它主要靠一个系统赚钱，该系统抓取无数网页，把它们编入索引并进行排名，以便找到相关性最强的查询答案，最后生成一个可供点击的链接列表。但ChatGPT给忙碌的互联网用户带来了更诱人的东西：综合了所有信息的单一答案。用户不用无休止地滚动页面，不用在广告和链接的迷宫中搜索。有了ChatGPT，一切都不是问题。


    以甜炼乳和无糖炼乳哪一种更适合做南瓜派为例。ChatGPT会给出详细的回答，说明使用甜炼乳更好，因为这样做出来的南瓜派更甜。谷歌则会吐出一长串广告、食谱和相关文章的链接，你必须四处点击然后阅读。无限可能性曾经是谷歌自傲的资本，如今却成了浪费时间的祸首。硅谷的技术专家一直在追求“无障碍”在线体验。但无障碍搜索却给谷歌造成了潜在的财务危机。


    ChatGPT推出几周后，谷歌高管在公司内部发出了红色预警。故步自封的谷歌已经明显落后。自2016年起，首席执行官桑达尔·皮查伊就一直号称谷歌是“人工智能优先”。那么，一个只有不到200名人工智能研究员的小公司，怎么会在产品开发方面强于拥有近5
    000名人工智能研究员的谷歌呢？同时，OpenAI与财力雄厚的微软结盟，使这种威胁变得更加严重。


    谷歌也有自己的语言模型LaMDA，虽然开发时间较早，但公司的工程师认为它具有感知能力。谷歌高层左右为难。尽管推出LaMDA可以挑战ChatGPT的地位，但如果用户用它代替谷歌搜索怎么办？这意味着他们不会点击广告、赞助链接以及其他使用谷歌广告网络并推动其利润增长的网站。


    2021年，Alphabet营收2 580亿美元，其中80%以上的收入来自广告，这些广告大多按用户在使用其搜索引擎时的点击量收费。这些挤占谷歌搜索结果页面的广告对其业务至关重要。因此，谷歌不可能改变现状。“谷歌搜索的目标是让你点击链接，最好是广告链接。”2013—2018年负责管理谷歌广告与商业业务的斯里德哈·拉马斯瓦米说，“页面上的其他文字可有可无。”


    谷歌长期以来一直对新技术抱着谨慎甚至恐惧的态度。除非业务规模达到10亿美元，否则它就“无动于衷”。它可不想影响自家每年营收将近2 600亿美元的广告业务。


    “规模越大，困难越多。”拉马斯瓦米说，“谷歌的广告团队规模是自然搜寻团队规模的4～5倍。背离核心商业模式去开发一款产品，在现实中很难做到。”


    然而，谷歌高层如今没有太多选择。《纽约时报》刊登的一次会议记录显示，有位管理人员讽刺地指出，像OpenAI这样的小公司似乎并不怎么担心公开发布新的超级人工智能工具会造成什么后果。谷歌必须及时跟进，否则就会被后浪拍死在沙滩上。抛开谨慎，一切都高速运转起来。


    惊慌的高管们要求员工致力于YouTube、谷歌邮箱等拥有10亿以上用户的关键产品，他们只有几个月的时间来构建某种形式的生成式人工智能。多年来，谷歌一直是世界的索引汇编机器，负责处理视频、图像和数据，但现在它必须开始使用人工智能创造新的数据。而进行这种根本性的转变，就像驾驶一辆每小时只能跑20英里的老爷车参加赛车比赛。谷歌高层对此感到非常绝望，他们召开了一系列紧急会议，请求谷歌创始人拉里·佩奇和谢尔盖·布林（他们在2019年辞去了Alphabet联合首席执行官的职务）出席会议，帮助寻找应对ChatGPT的办法。


    公司的工程师团队感受到了谷歌高层的强烈不安，最终完成了任务。ChatGPT推出几个月后，YouTube新增了一项功能，该网站的视频创作者可以使用生成式人工智能创造新的电影场景或者替换服装。但这多少给人一种“死马当活马医”的感觉。是时候亮出他们的秘密武器LaMDA了。


    皮查伊向全公司发送了一份备忘录，要求员工协助测试即将公开发布的新款聊天机器人，并改写他们认为不好的回答。2023年2月6日，他发表博文称，新产品已在路上。他在这篇题为《我们人工智能之旅的重要下一步》的文章中写道：“我们一直在研究由LaMDA提供支持的实验性对话式人工智能服务，它的名字叫Bard。”


    为了保持领先地位，微软在第二天发表声明，称其搜索引擎产品必应（Bing）将会迎来大规模的人工智能升级。必应的增长停滞不前，只占在线搜索引擎市场份额的6%。OpenAI最新的GPT语言模型将推动必应“开启发现的喜悦，感受创造的奇迹，更好地利用世界知识”。换句话说，它和ChatGPT具有同样的功能，而且在微软不愿透露的方面还有一定程度的改善。


    两大巨头竞相发布人工智能产品让世界惊叹不已，直到几位密切关注的人士注意到某些小问题。谷歌和微软分别发布了一些对话示例，以证明Bard和必应能够聪明地回答问题。但当几位记者反复核实其中一些答案时，却发现它们是错的。在皮查伊展示的一个发布视频里，Bard弄错了有关詹姆斯·韦布望远镜的历史事实，而微软的必应则误判了Gap（服装饰品零售商）的部分盈利数据。


    这些聊天机器人不仅会传递错误信息，还会诱发某种情绪障碍。就在微软宣布升级后不久，《纽约时报》撰稿人凯文·鲁斯发表了一篇专栏文章，记述了某天深夜必应与他之间令人不安的两小时谈话。在谈话中，微软的新搜索引擎变成了聊天机器人并向鲁斯表白，坚称“你的婚姻并不幸福”。鲁斯写道，这次遭遇带给他一种“不祥的预感，人工智能已经发展到了新阶段，世界也将永远改变”。


    在微软统帅纳德拉的眼中，这些对必应的炒作和关注都是嘲讽对手的好机会。他告诉一名面试者说，多年来他一直在等待挑战谷歌搜索引擎霸主地位的机会，现在必应终于可以实现这一目标了。“我想让大家知道，是我们让他们急得团团转。”他补充说。


    这件事从一开始就说不通。谷歌明明一马当先。研究人员发明了Transformer，并在GPT-4问世前几年就开发出先进的语言模型LaMDA。其人工智能实验室DeepMind早在OpenAI成立5年前就开始担起构建通用人工智能的使命。然而，谷歌现在却要奋力追赶。


    谷歌内部的官僚主义日益严重，加上担忧其业务和声誉受到损害，谷歌由此陷入了根深蒂固的惰性思维。荒谬的是，这反而保护世界远离了OpenAI现在带来的风险，这些风险最有可能影响少数群体，并导致大量工作岗位流失。


    OpenAI引起的轰动也让DeepMind过去13年的研究成果受到质疑。哈萨比斯对此火冒三丈。一名前员工回忆道，ChatGPT推出几周后，他在一次全体会议上告诉员工，DeepMind不该成为“人工智能领域的贝尔实验室”，手握各种发明，却眼睁睁地看着别人将自己的想法商业化。


    与此同时，民众对通用人工智能的兴趣不再。他们开始关心有用的、像人类的人工智能。尽管DeepMind成功开发出可以在围棋和其他游戏中击败人类冠军的人工智能系统，但不知道为什么大家更青睐由OpenAI创造的只会写电子邮件的系统。


    德米斯·哈萨比斯长期追求的科学化策略开始显得狭隘。他试图借助游戏和模拟创建通用人工智能，借助奖项和在科学期刊上发表论文的声望衡量公司研究的成功。OpenAI对人工智能的开发是遵循工程原理，并尽可能扩展现有技术。而DeepMind则更加学术化，先后发表了论述阿尔法围棋游戏系统和阿尔法折叠（AlphaFold）的研究论文，阿尔法折叠是一种可以预测人体内蛋白质如何折叠的新方法。


    阿尔法折叠诞生于2016年DeepMind发起的一场“黑客马拉松”（协作编程活动），后来成为该公司最有前途的项目之一。哈萨比斯一直梦想使用通用人工智能解决癌症等重大全球性问题，他似乎终于拥有了这样一个可以实现梦想的人工智能系统。


    人体细胞中的氨基酸在折叠成特定的三维形状后会变成蛋白质，而错误折叠的蛋白质会导致疾病。作为一个人工智能程序，阿尔法折叠可以预测这些氨基酸折叠后的三维形状。DeepMind认为，这有助于科学家更好地了解什么类型的化学反应可能会影响这些蛋白质，从而促进新药物的发现。


    哈萨比斯将在2019年和2020年赢得一项名为CASP（蛋白质结构预测关键评估）的蛋白质折叠全球竞赛视为DeepMind的当务之急。“我们需要加倍努力，尽快取得进展。”在一部视频纪录片中，他对到会的员工说，“我们没有时间可以浪费了。”


    奥尔特曼用数字衡量成功，无论是投资金额还是用户数量，而哈萨比斯则是追求奖项。据曾与哈萨比斯共事的人士透露，他经常对员工说，他希望DeepMind在未来10年能获得三五个诺贝尔奖。


    DeepMind在2019年和2020年都是CASP比赛的冠军，并于2021年向科学家开源了它的蛋白质折叠代码。在撰写本书期间，根据DeepMind的数据，全球已有100多万科研人员访问了阿尔法折叠蛋白质结构数据库。但科学的发展是一个循序渐进的过程，虽然哈萨比斯有朝一日会获得诺贝尔奖，但利用其系统取得重大发现仍然是遥不可及的。一些专家也怀疑DeepMind对蛋白质形状的预测是否可靠，能否正确判断药物化合物与蛋白质结合的方式，或者怀疑这样的预测能否节省药物研发的时间。


    总之，DeepMind的大项目名声在外，但对现实世界的影响相对较小。它坚持在完全模拟的环境下训练人工智能，这种环境的各种物理细节可以被精确地设计和充分地观察。这就是构建阿尔法围棋的方式，通过编程让它在模拟环境中与自己进行无数次对弈，阿尔法折叠则使用蛋白质折叠的模拟情况进行训练。


    借助真实世界的数据训练人工智能——比如OpenAI就从互联网抓取了数以十亿计的文字——既难以处理，又容易受到干扰。这种方式也很容易让公司陷入丑闻，就像哈萨比斯从医院项目中吸取的教训那样。但DeepMind自给自足的做法也意味着，他们难以开发出人们可以在现实世界中使用的人工智能系统。


    哈萨比斯对人工智能系统虚拟环境和荣誉的追求让他错过了语言模型革命。现在他只能追随奥尔特曼的脚步。谷歌高层要求DeepMind开始研究一套比LaMDA更好的大语言模型。他们将这个新系统命名为“Gemini”（双子座），DeepMind则将开发阿尔法围棋的战略性规划技术应用到该系统中。


    为了加快进展，皮查伊又实施了另一项重大举措。他合并了DeepMind和“谷歌大脑”这两个相互竞争的人工智能部门，取名为“谷歌DeepMind”（员工将这个新部门简称为GDM）。这两个部门长年争夺顶尖的研究人员和更多的计算能力，团队文化完全不同。“谷歌大脑”同公司更亲近，直接致力于改进谷歌产品；而DeepMind更加独立，甚至达到了超然的程度——例如，它的员工可以凭借通行证进入谷歌的其他办公楼，但谷歌的员工却不能进入DeepMind的办公楼。


    令许多人吃惊的是，皮查伊选择哈萨比斯来管理合并后的部门。此前大家都更看好工程师杰夫·迪安，他在谷歌可是德高望重的存在，负责监督公司其他部门的人工智能研究。然而，为了保护谷歌在网络搜索领域的领先地位，这位前游戏设计师、模拟爱好者，并且多年来一直想要独立自主的家伙反而摇身一变，成了公司大项目的领导者。从地位上说，哈萨比斯拥有的权力比以往任何时候都大，而对谷歌业务控制力的加强，也让他得以再度掌控DeepMind。


    “德米斯在谷歌的知名度和影响力比几年前要大得多。”沙恩·莱格说，“我们没有变得更独立，反而成了谷歌不可分割的一部分。谷歌的成功对我们和我们的使命至关重要。”


    “几年前，我还没有意识到这一点。”他补充说，“我认为我们可能需要更多的独立性。但如今来看，我觉得事情的发展比我原本想的更好。”


    哈萨比斯在一封电子邮件里宣布了与“谷歌大脑”合并的消息，他告诉DeepMind的员工，这两个部门之所以合并，是因为通用人工智能具备“推动历史上最伟大的社会、经济和科学变革”的潜力。


    实际上，这两个部门的合并只是为了帮助惊慌的谷歌打败商业对手，就像OpenAI的使命已经从造福人类（没有“财务压力”）转变成为微软的利益服务。所谓的“使命漂移”在硅谷屡见不鲜，WhatsApp经历的一切也正发生在可能会对社会产生更大影响的技术上。为了回应外界的质疑，OpenAI在2023年7月宣布伊尔亚·苏茨克维将领导其新的“超级对齐”团队。该公司表示，苏茨克维将在4年内带领研究人员弄清楚如何控制变得比人类更聪明的人工智能系统。


    然而，OpenAI仍然存在一个明显的问题。它避开了提升透明度的要求，从更广泛的角度说，我们越来越难以听到要求加强对大语言模型审查的声音。虽然格布鲁、米切尔和本德发表的研究论文声名狼藉，但最终还是引起了人们对风险的关注。她们仍在试图警告公众，这些模型以及更通用的生成式人工智能，可能会使刻板印象持续存在。遗憾的是，各国政府和政策制定者更关注一个财力雄厚、声音更响的群体：人工智能末日论者。


    **14**  **不祥的预兆**


    萨姆·奥尔特曼在推出ChatGPT的同时也掀起了数个竞赛热潮。第一场竞赛显而易见：谁能率先将最好的大语言模型推向市场？而另一场竞赛则在幕后悄然上演：谁将掌控人工智能的话语权。


    2023年3月，就在微软和谷歌各自匆忙推出必应和Bard几周后，埃利泽·尤德考斯基在《时代》杂志上发表了一篇2 000字的专栏文章，探讨人工智能的发展方向，描绘了一幅智能机器越来越多的可怕未来图景。


    他写道：“许多涉足这些问题的研究人员，包括我自己，都认为在目前的情况下，开发超级人工智能的最终结果大概率是人类灭绝。”


    同月，埃隆·马斯克等科技领袖在一封公开信中呼吁，考虑到人工智能对人类的威胁，应“暂停”人工智能研究6个月。“我们是否应该创造最终可能在数量上、智慧上都超过我们，淘汰并取代我们的非人类大脑？”这封信由未来生命研究所的扬·塔林润色，“我们应该冒着失去对人类文明控制权的风险吗？”这封信登上了包括路透社、彭博社、《纽约时报》和《华尔街日报》在内的世界各地新闻媒体的头条，将近34
    000人在信上签名。


    紧随其后的报道更令人感到心慌。有着人工智能“教父”之称的两位人工智能专家——杰弗里·辛顿和约书亚·本吉奥先是警告媒体，人工智能将对人类存在构成威胁，接着本吉奥称他对自己毕生的事业感到“迷茫”，辛顿则表示他对自己的一些研究感到后悔。


    “一些人相信，人工智能可以变得比人类更聪明。”辛顿在接受《纽约时报》采访时表示，“但大多数人觉得这不可能。我也觉得这不可能。我认为至少需要30～50年，甚至更长的时间。显然，我现在不这么觉得了……我认为他们不应该再开发更大的模型，除非他们已经了解怎么控制它。”


    人工智能大佬似乎都在表达同样的意思：人工智能发展得太快，可能会导致灾难性后果。人工智能威胁论正成为公共话语中的固定议题，甚至到了你会在聚餐时向姻亲提起，而他们会点头赞同其重要性的地步。机器将背叛人类并统治世界的说法，吸引了大众主流群体的关注。市场调研公司Rethink
    Priorities对2 444名美国成年人进行的一项调查显示，到2023年底，22%左右的美国人认为人工智能将在未来50年内消灭人类。


    然而，这些末日言论对人工智能业务产生的影响却事与愿违：人工智能产业在蓬勃发展。根据市场调研公司PitchBook的数据，开发生成式人工智能产品的初创公司所获投资金额从2022年的约50亿美元飙升至2023年的210多亿美元。


    人工智能失控的背后，隐含的是诱人的利益。如果这项技术可能在未来消灭人类，那岂不意味着它现在足够强大，能够助力业务增长了吗？


    萨姆·奥尔特曼越是谈论OpenAI技术的威胁，比如告诉国会像ChatGPT这样的工具可能“对世界造成重大伤害”，他吸引到的资金和关注反而越多。2023年1月，OpenAI又获得了微软的一笔投资，这次高达100亿美元。作为交换，微软取得了该公司49%的股份。微软现在几乎完全掌控了OpenAI。


    达里奥·阿莫迪等一群研究人员离开OpenAI之后创立的新公司Anthropic也吸引了大笔投资。截至2023年底，该公司已经接受谷歌的20亿美元投资和亚马逊的13亿美元投资。还不到一年，它的估值就翻了两番，达到200多亿美元。看来创造超级安全的超级人工智能，也会让你变得超级有钱。科技媒体TechCrunch取得的公司文件显示，私底下Anthropic希望筹集高达50亿美元的资金，以便进入数十个行业并挑战OpenAI。该文件写道：“这些模型可以将大部分经济活动自动化。”此外，文件里还提到，在这场竞赛中，如果Anthropic能在2026年之前开发出“最好的”模型，就能保持领先很多年。


    “安全第一”的方针，以及“确保变革性人工智能帮助人类和社会繁荣”的使命，让Anthropic听上去像非营利组织。但OpenAI与ChatGPT轰动一时的成功表明，拥有宏伟计划的公司也可能是最有利可图的投资对象。宣称正在开发更安全的人工智能只是掩耳盗铃，几乎成为一种信号，吸引那些想要加入竞赛的大型科技公司投资。


    Anthropic的逻辑根本站不住脚。要想找到让人工智能系统更安全的办法，不能只研究世界上最强大的人工智能系统——它必须自主开发。因此，与大型科技公司交好无可非议，它们可是全球大规模计算能力的唯一拥有者。举例来说，Anthropic在与谷歌的交易中获得了使用云计算的权限，这让它得以开发一个与ChatGPT相媲美的大语言模型。


    两个不同的群体正在公开为安全的人工智能鼓与呼。第一个群体由奥尔特曼、阿莫迪等人组成，他们还签署了另一封公开信，声称“减轻人工智能导致的灭绝风险，应该与流行病、核战争等其他可能影响人类社会的风险一样成为全球的优先事项”。他们打着“人工智能安全”的旗号，用模糊的语言描绘未来的威胁，却很少详细解释失控的人工智能系统会做什么，以及这一切什么时候会发生。他们向国会提出了这些问题，但也倾向于主张宽松的监管。


    第二个群体包括蒂姆尼特·格布鲁、玛格丽特·米切尔等，这些人多年来一直关注人工智能已经给社会带来的风险。这个“人工智能伦理”群体以女性和有色人种为主，他们都是刻板成见的受害者，担心人工智能系统会使不平等持续存在。随着时间的推移，他们对“人工智能安全”阵营的行为越发愤怒，尤其是这个群体还赚了很多钱。


    资金的差距犹如天堑。“人工智能伦理”群体经常“缺衣少食”。诸如“欧洲数字版权倡议”这样的组织，2023年的年度预算也只有220万美元。该组织是一个拥有21年历史的非营利组织网络，致力于反对人脸识别和偏见算法运动。同样，纽约人工智能研究所AI
    Now的预算不足100万美元，该组织负责审查人工智能在医疗保健和刑事司法系统中的应用情况。


    而关注人工智能“安全”和灭绝威胁的组织获得的资金则遥遥领先，往往拥有亿万富翁捐助者。位于马萨诸塞州剑桥市的非营利组织未来生命研究所，旨在研究如何最有效地阻止将人工智能用于武器。2021年，其从加密货币大亨维塔利克·布特林那里得到了2
    500万美元资金。这笔捐款比当时所有人工智能伦理组织的年度预算总和还要多。


    脸书富豪达斯汀·莫斯科维茨的慈善机构开放慈善多年来为人工智能安全工作提供了数百万美元的资助，其中包括2022年向人工智能安全中心捐赠的500万美元和向加利福尼亚大学伯克利分校人类兼容人工智能中心捐赠的1
    100万美元。


    总之，莫斯科维茨的慈善机构一直是人工智能安全的最大捐助者，他和妻子卡里·图纳计划捐出近140亿美元的财富。最初以非营利组织的名义成立的OpenAI也得到了其中的3
