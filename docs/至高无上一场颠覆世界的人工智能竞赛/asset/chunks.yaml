- raw: '最后他终于弄清楚Copilot类似代码助手，微软正把它打造成一个很受开发者欢迎、名叫“视觉工作室”的程序。一旦你输入部分代码，Copilot就会闪现颜色较淡的文本，提示下一行代码。它就像自动填词器，只不过是用来开发软件的。要是开发者接受这些提示，只需敲击一下制表键，Copilot就可以编写完整的代码段落，包括像登录一款应用程序这样的由多行代码组成的完整函数。


    微软还在收集开发人员的反馈，到目前为止，它只发布了该系统的预览版本。但纳德拉说程序员已经发现他们的工作效率得到了提高，因为Copilot编写了多达20%的代码。这是一个很大的比例。


    Copilot建立在OpenAI的新模型Codex（代码生成训练模型）之上，与该公司最新的语言模型GPT-3.5的设计类似，其训练数据来自世界最大的代码库之一GitHub。


    通过Copilot，OpenAI展示了Transformer在使用“注意力”机制绘制不同数据点之间的关系时是多么全能。它就像一种把数据看成星系的映射工具。举例来说，如果一颗星代表一个字，那么Transformer会将不同字之间的路径与那些意思相近的字关联起来。数据是字词还是像素都没关系。通过识别这些关系中的模式，Transformer可以帮助生成连贯的新数据，无论是文本、代码，还是图像。


    但是，谷歌没有像OpenAI那样将Transformer大规模应用到计算机编码上。“这是他们犯下的又一个错误，而OpenAI选对了方向。”曾在谷歌和OpenAI工作过的人工智能创业家阿拉文德·斯里尼瓦斯说，“假如这些模型经过了编码预训练，它们最终会变得更加善于推理。”


    这是因为编码需要一步一步思考。“要是你家的孩子在学校能把数学和编码学得很好，你通常会认为这个孩子更加聪明，有能力推断和分析复杂事物。”斯里尼瓦斯说，“对大语言模型来说也是如此。”


    在谷歌管理层的眼中，这是反常的，因为该公司的业务只涉及计算机语言和广告。但微软是“软件之王”，所以更关心为开发人员制造工具。OpenAI运气不错，训练自家的模型学习编码不仅讨好了新合作伙伴，还让这些模型的智能水平得到了提升。


    索马西格询问纳德拉对萨姆·奥尔特曼的看法。纳德拉回答说：“他关心的是解决全球问题。”据索马西格回忆，奥尔特曼和纳德拉谈论的话题“超尘拔俗”，甚至让纳德拉对与奥尔特曼的合作更加期待。就好像奥尔特曼的理想越疯狂、越乌托邦，纳德拉就越相信他会帮助微软成长。


    开发通用人工智能曾一度是人工智能领域的边缘想法，但对这家软件巨头来说，它正在演变为一个适合在市场上出售的概念。它能帮助微软构建更好的电子表格，另外还有一个更大的好处：它带来了一套能提高所有微软软件智能水平的工具。


    纳德拉认为GitHub Copilot影响深远。“这套已经完成的服务系统将会改变世界。”索马西格说，更何况还要将其应用到其他软件中。意识到这一点后，纳德拉和首席技术官凯文·斯科特开始在微软内部为人工智能摇旗呐喊，几乎在每一次产品评审或产品决策会议上都会提到这项技术。为什么你的团队不用人工智能呢？全力投入人工智能，尽可能使用OpenAI的模型。


    这自然让微软研究院的数百名人工智能专家感到不满，他们多年来一直在研究人工智能模型。有媒体报道，还有几名听到批评的人工智能研究员声称，纳德拉斥责该部门的管理层，说他们的研究成果远远不如员工更少的OpenAI。


    硅谷科技媒体The Information报道，纳德拉对微软研究院的负责人说：“OpenAI只用250人就完成了这个项目。我们还要微软研究院干什么用？”


    一位高级人工智能科学家转述，纳德拉还告诫研究人员不要试图开发所谓的基础模型，或者诸如OpenAI的GPT模型之类的大系统。一些员工在沮丧中辞掉了工作。


    但就算是他们也不得不承认，Copilot是一个了不起的工具，可以帮助程序员编写新的代码并加快处理已有的代码。纳德拉考虑在微软服务中广泛应用人工智能，利用OpenAI的语言模型技术改进用户起草电子邮件和生成电子表格的方式。


    2022年初，在索马西格与纳德拉会面几周后，OpenAI开始测试GPT-3的更高级版本，这些不同的版本均以历史上的著名发明家命名——埃达、巴贝奇、居里和达·芬奇。随着时间的推移，这些不同的模型越来越能处理复杂的问题，并给出更具个性化的回答。总体来说，公众还没有意识到这套软件已经变得多么先进。直到2022年4月，OpenAI将GPT-3的部分语言功能应用到视觉图像上，彻底公开其第一个重大发明，这一切才开始改变。


    两年以来，在旧金山OpenAI办公楼的一个角落里，三名研究人员一直在尝试使用扩散模型生成图像。扩散模型基本上是通过逆向操作来创建图像。艺术家作画是从一张空白的画布开始的，而扩散模型则是从一张凌乱的画布开始的，上面已经涂抹了许多色彩和随机的细节。该模型会在数据中加入大量的“噪声”或随机性，使其变得无法识别，然后逐步减少噪声数据，慢慢呈现图像的细节和结构。每推进一步，图像就会变得更清晰、更细致，就像画家不断完善自己的艺术作品一样。这种扩散方法，加上一种叫作CLIP的图像标记工具，就构成了一个新模型的基础，研究人员把它命名为DALL-E2。


    这个名字是在致敬上映于2008年、讲述机器人逃离地球的动画电影《机器人总动员》和超现实主义画家萨尔瓦多·达利。DALL-E2生成的图像有时候看上去非常超现实，但对于第一次看到这种工具的人来说，它本身就不同寻常。如果输入“牛油果形状的椅子”这样的文本提示，你就会得到一系列图像，其中有许多栩栩如生。即使是高度复杂的提示词，DALL-E2也能如实呈现图像，所以在发布后的几天时间里，它就在推特上流行起来，用户们互相攀比，创造最奇特的图像，比如“戴着宽边帽的仓鼠怪兽在攻击东京”，或者“醉醺醺的赤膊男子在魔多到处闲逛”。虽然人物的脸部通常看上去稀奇古怪，但你不能否认这些图像的精致程度远远超过之前计算机创造出来的东西。公众第一次体验到了它的能力，这让OpenAI突然成了新闻界的宠儿。


    谷歌选择将这样的创新保密，但奥尔特曼认为尝试OpenAI新产品的人越多越好。作为硅谷的创业导师，多年来他一直建议企业家将他们的产品推向世界。技术专家有时称之为“交付”策略或者发行“最小可行产品”，但其中蕴含的理念是相同的，即尽可能快地将软件交到用户手中，这样你就可以在自己和用户之间创造一个反馈循环，其实就是把公众当成实验对象。测试产品最好的方法就是放手一搏。脸书、优步、Stripe等科技巨头都建立在这样的信条之上，而奥尔特曼也是其坚定的拥护者。


    在接下来的几个月里，OpenAI逐渐推出DALL-E2，为了防止系统生成冒犯或有害的图像，首先面向的是100万左右的预约用户。5个月后，OpenAI放开了DALL-E2的使用限制，作为它用“哟，还不错”这句话断言GPT-2不会对世界构成威胁的呼应。


    训练DALL-E2的数百万张图像抓取自公共网络，但和以前一样，OpenAI对此含糊其词。成功创造出毕加索风格的图像，很可能意味着毕加索的画作已经成为训练数据的一部分。但这很难确定，也没办法知道其他不太知名的艺术家的作品是否也被用来训练该系统，因为OpenAI不愿透露训练数据的细节，认为这会让坏人得以复制模型。


    格雷格·鲁特科夫斯基经历了一番艰辛才发现这一点。他是波兰的数字艺术家，以描绘尖牙喷火龙和巫师的奇幻风景画闻名。他的名字成为DALL-E2的竞争对手——开源版本、可与之相媲美的Stable
    Diffusion（人工智能绘画生成工具）最受欢迎的提示之一。这引发了一种令人担忧的可能性：如果能用软件创作鲁特科夫斯基风格的艺术作品，为什么还要花钱买鲁特科夫斯基等艺术家的新作品呢？


    DALL-E2的另一个问题也开始引发关注。如果让它生成一些首席执行官的图像，图像里的人物几乎都是白人男性。输入“护士”这样的提示词，它只会生成女性图像，而输入“律师”这样的提示词，则只会生成男性图像。


    奥尔特曼在2022年4月的一次采访中被问及此事，他保持了一贯的“直面争议”的风格，承认这是一个问题，但强调OpenAI正在努力解决。其中一个做法就是，从训练数据中删除暴力和色情图像，从而不让DALL-E2生成这些图像。


    OpenAI还在肯尼亚等发展中国家雇用了承包商，引导模型给出更恰当的回答。这一点至关重要，因为这意味着即使OpenAI已经完成了GPT-3、DALL-E2等模型的训练，它仍然可以在人类审核员的帮助下对系统进行微调，使其回答更精确、更适宜、更合乎伦理。通过将DALL-E2的回答按照从好到坏排序，人类可以引导它找到总体上更好的回答。


    然而，这些审核员对系统的评分方式并不总是一致的，而且从DALL-E2的训练数据中剔除问题图像也可能像打鼹鼠游戏。起初，OpenAI的研究人员试图删除他们能在训练数据集中找到的所有过度性感的女性图像，这样DALL-E2就不会把女性描绘成性感的对象。但结果却不尽如人意。当时在OpenAI担任研究和产品主管的米拉·穆拉蒂表示，这样做“极大”减少了数据集中的女性数量。她没有透露具体数字。“我们不得不做出调整，因为我们不希望模型‘变笨’。这确实很棘手。”


    DALL-E2所生成的逼真面孔在涉及刻板印象的问题时成为其最大的麻烦制造器，OpenAI似乎充分意识到了这个问题。因此，当一个主要由400名微软和OpenAI员工组成的内部小组开始测试这个系统时，OpenAI禁止他们公开分享DALL-E2生成的逼真人物肖像。


    OpenAI如此迅速地推出一款可以生成虚假照片的工具，让部分员工感到担忧。它已经从一家最初致力于安全人工智能的非营利组织，转变为市场上最激进的人工智能公司之一。该公司一位负责安全测试的匿名员工告诉《连线》杂志，OpenAI发布这项技术似乎是为了向世界炫耀，尽管“目前还存在很多潜在危害”。


    但奥尔特曼还在追求更远大的目标。他认为，这个新系统是迈向通用人工智能道路的一次重要跨越。他在一次采访中说：“它似乎真能理解概念，感觉就像拥有智能一样。”他补充说，DALL-E2的神奇可以让那些通用人工智能怀疑论者开始认真对待这个想法。


    DALL-E2的神奇不仅体现在它的能力上，还体现在它对人们的影响上。“图像蕴含着一种情感力量。”奥尔特曼说。DALL-E2引起了轰动。GitHub Copilot只能在已经开始编写的代码的基础上完成工作，而DALL-E2可以从无到有地创造完整的内容。它就像一位按照客户的要求作画的图形艺术家。


    这种生成完整内容的想法让奥尔特曼的下一步行动更加惊世骇俗。GPT-1更像一个自动补全工具，可以将人类输入的内容延续下去。但GPT-3及其最新升级版本GPT-3.5就能够生成全新的文章，就像DALL-E2能够从零开始创造图像一样。


    就在全世界都在关注DALL-E2时，有传言称OpenAI的竞争对手Anthropic正在开发一款聊天机器人，这激起了OpenAI的竞争欲望。2022年11月初，OpenAI的管理层对员工表示，他们将在几周内推出自己的聊天机器人，该机器人将在GPT-3.5的基础上开发。据知情人士透露，该公司召集了十几名员工一起开发这款聊天机器人。它与谷歌的Meena没什么不同，诺姆·沙泽尔早在两年前就研究出了Meena，只不过谷歌一直没有将其公开。


    OpenAI领导层向员工保证，这不是产品投放，而是“低调的研究展望”。然而，部分员工表示他们对这么快就发布这款工具感到不安。他们不清楚公众在使用如此流利和强大的语言模型时会犯下何种错误。


    不仅如此，该聊天机器人还经常会犯事实错误。开发人员决定降低系统的谨慎水平，而这会导致它拒绝回答那些它能够正确回答的问题。他们不希望它说“我不知道”，所以对其进行了调整，以便让它听起来更权威，尽管这意味着聊天机器人在某些时候会胡说八道。这款聊天机器人被命名为ChatGPT。


    奥尔特曼急于推动该产品的发布。他认为，ChatGPT经过了数百名OpenAI员工的测试和审查，而且让人类适应人工智能的真正使命非常重要，毕竟“亲身下河才知深浅”。在某种程度上，OpenAI也是在帮助世界做好准备，迎接其即将推出的更强大的模型GPT-4。据当时的一位OpenAI高管透露，GPT-4在内测中写出了不错的诗歌，编出的笑话甚至逗笑了OpenAI管理层。但他们不甚了解它会对世界或社会产生什么样的影响，除非将它公开发布。这在OpenAI的官网上被称为“迭代部署”哲学，即公开发布产品以更好地研究其安全性和影响力。该公司表示，这是确保其为人类利益而开发通用人工智能的最佳方式。


    2022年11月30日，OpenAI在一篇博文中宣布推出试用版ChatGPT。就连OpenAI的很多员工，包括部分安全研究员都不知道这次发布，有些人还开始打赌一周后会有多少人使用它。预计最多将吸引10万用户，因为该工具只是一个带有文本框的网站而已。随意在文本框内输入点什么，背后的机器人就会做出回应。这个聊天机器人由GPT-3.5驱动。公众大多没听说过OpenAI，更不用说GPT-3了。即使是OpenAI的研究人员也不知道开启公开测试后会发生什么。


    “我们今天推出了ChatGPT。”旧金山时间上午11点30分左右，奥尔特曼在推特上发帖说，“试试点击http://chat.openai.com和它交谈吧。”


    起初只有一小撮开发人员和科学家登录网站进行试用，网络上水波不兴。但随后几个小时，推特上开始出现越来越多的评论：


    12:26发布 @MarkovMagnifico：正在玩ChatGPT，通用人工智能已提前到来。


    12:37发布 @AndrewHartAR：ChatGPT刚刚发布。我看到了未来。


    13:37发布 @skirano：绝对难以置信。我让ChatGPT生成一个简单的个人网站，它逐步展现了创建过程，然后添加了HTML（超文本标记语言）和CSS（串联样式表）。


    14:09发布 @justindross：相比谷歌，ChatGPT对我提出的问题给出了更好的回答。真是不可思议。


    14:29发布 @Afinetheorem：别再布置课后论文或家庭作业了。


    到处都是对ChatGPT的惊叹之声，你很难找到一句负面评价。它流利的表达能力，还有丰富的知识储备，都让使用者刮目相看。很多人以前都尝试过聊天机器人，无论是Alexa还是某个客服机器人，他们大多习惯了在一定范围内磕磕绊绊地聊天。但ChatGPT几乎能流利地回答任何问题。这就像原来是和一个蹒跚学步的儿童聊天，现在转变为与受过高等教育的成熟大人交谈。


    在接下来的24小时里，人们纷至沓来测试ChatGPT的极限，服务器也因此不堪重负。现在是专业人士、科技工作者、营销和媒体人员开始对聊天机器人进行实际测试。为了在推特上表现自己，他们把试验变成了公开竞赛，看看谁能让ChatGPT写出最有趣、最聪慧或最古怪的文字。围绕DALL-E2掀起的热潮仿佛再次上演，但这次声势更大。随后几天，推特被淹没在ChatGPT写的诗歌、说唱音乐、情景喜剧和电子邮件的截图之中。越是标新立异的内容越受欢迎。


    推特用户托马斯·H.普塔塞克让它“用钦定版圣经的风格写一段经文，阐述如何从录像机里取出一块花生酱三明治”。


    OpenAI的机器人写道：


    事情就这样发生了，一个男人被一块花生酱三明治弄得心烦意乱，三明治被放在了录像机里，他不知道怎么把它取出来。


    于是他哀求上帝说：“主啊，我怎么才能把这块三明治从录像机里取出来呢？它粘得太牢了，一动不动。”


    普塔塞克在推特上发帖说：“对不起，我没法嘲讽能写出这样一篇文章的技术。”ChatGPT的用户在一周内达到了100多万。两个月后，它吸引了3 000万名注册用户，成为历史上用户增长最快的在线服务之一。到2024年初，每周约有1亿人在使用ChatGPT。在此之前，没有哪种独立运行的人工智能工具能在主流社会中如此受欢迎。


    2023年3月14日，就在Anthropic终于推出其聊天机器人Claude的同一天，OpenAI发布了升级产品GPT-4。只要愿意每月支付20美元，人人都能通过ChatGPT
    Plus（ChatGPT试点订阅计划）使用这项新技术，预计到2023年底，该服务将为公司带来2亿美元的收入。部分OpenAI的员工认为GPT-4代表了迈向通用人工智能的重要一步。


    苏茨克维在一次采访中表示，机器不只从文本材料中学习统计相关性。“文本实际上是真实世界的投射……神经网络正在越来越全面地学习世界、人类，以及人类的状况、希望、梦想、动机、互动，还有我们所处的环境。”


    奥尔特曼在另一次采访中说：“这个系统能观察世界，还能学会理解世界——其中一种方法就是预测接下来会发生什么，我认为这已经非常接近人的智能了。”


    科技媒体对此心醉神迷。《纽约时报》称ChatGPT是“有史以来公开发布的最佳人工智能聊天机器人”。但凡试用过该系统的记者，都被其友好且热情的回答所吸引。一些科技爱好者在推特上夸耀他们如何使用该系统起草电子邮件等工作文件以提高工作效率。


    这自然引发了有关ChatGPT是否会取代人类的新一轮媒体报道。奥尔特曼继续通过播客、报纸和其他新闻出版物进行宣传，回应公众的兴奋情绪，直面大众担忧的话题。他表示，是的，这可能会取代一些工作，比如文案写手、客服专员甚至软件开发人员，但这并不意味着ChatGPT及其支持技术将完全取代人类工作。


    “部分工作岗位将会消失，”奥尔特曼在一次采访中坦言，“但也会出现今天很难想象的更好的新工作岗位。”媒体和公众对此只能默默接受，因为如同工业革命这样的历史性转变已经表明，技术确实会给就业市场带来阵痛。何况，ChatGPT等生成式人工智能系统也并不是如加密货币那种昙花一现的潮流。ChatGPT用处很大。大家已经开始用它撰写高中论文、收集商业计划和进行市场调查了。


    OpenAI的员工安慰自己未来值得期待，认为工业革命时期使用机械设备进行生产同样带来过新的就业机会，也提供了更好的生活水平。但专注于产品开发的一方与关注安全的一方分歧越来越大，后者正在努力监管ChatGPT上激增的输入内容，以防止不法查询。苏茨克维相信他们朝通用人工智能迈出了重要一步，开始与公司的安全团队更紧密地合作。与此同时，OpenAI的产品团队加大了商业化ChatGPT的力度，邀请企业付费使用他们的底层技术。


    谷歌高管发现，越来越多的人选择使用ChatGPT而不是谷歌获取关于健康问题或产品建议的信息——从广告销售效果看，它们是最赚钱的搜索引擎用语之一。


    可以说谷歌缺乏必要的竞争。这么多年以来，它想方设法从用户的每一次搜索中捞钱，不仅让广告和赞助链接占据了搜索结果页面，也令其产品的使用变得惹人生厌。如果它能让使用者分不清广告和实际的搜索结果，它就能赚更多的钱。


    2000—2005年，谷歌用较为明显的蓝色背景标记广告，并确保它们只占用页面顶部的一两个链接。但自此以后，广告和普通网络链接的区别越来越小。蓝色背景逐渐变成绿色，接着变成黄色，最后直接消失了。广告开始占据更多的页面，迫使用户不断滚动页面才能找到合适的结果。虽然用户对此很恼火，但并未影响到谷歌，因为互联网用户认为他们没有别的搜索引擎可用。谷歌占据了全球90%以上的在线搜索市场。'
  fmt: '

    # Microsoft、OpenAI 与生成式 AI 的崛起


    ## GitHub Copilot：AI 结对编程助手


    最后他终于弄清楚 Copilot 类似代码助手，微软正把它打造成一个很受开发者欢迎、名叫“视觉工作室”的程序。一旦你输入部分代码，Copilot 就会闪现颜色较淡的文本，提示下一行代码。它就像自动填词器，只不过是用来开发软件的。要是开发者接受这些提示，只需敲击一下制表键，Copilot
    就可以编写完整的代码段落，包括像登录一款应用程序这样的由多行代码组成的完整函数。


    微软还在收集开发人员的反馈，到目前为止，它只发布了该系统的预览版本。但纳德拉说程序员已经发现他们的工作效率得到了提高，因为 Copilot 编写了多达 20%
    的代码。这是一个很大的比例。


    ## Transformer 架构与 Codex 模型


    Copilot 建立在 OpenAI 的新模型 `Codex`（代码生成训练模型）之上，与该公司最新的语言模型 `GPT-3.5` 的设计类似，其训练数据来自世界最大的代码库之一
    GitHub。


    通过 Copilot，OpenAI 展示了 `Transformer` 在使用“注意力”机制绘制不同数据点之间的关系时是多么全能。它就像一种把数据看成星系的映射工具。举例来说，如果一颗星代表一个字，那么
    `Transformer` 会将不同字之间的路径与那些意思相近的字关联起来。数据是字词还是像素都没关系。通过识别这些关系中的模式，`Transformer`
    可以帮助生成连贯的新数据，无论是文本、代码，还是图像。


    ## 谷歌与微软：截然不同的战略选择


    但是，谷歌没有像 OpenAI 那样将 `Transformer` 大规模应用到计算机编码上。“这是他们犯下的又一个错误，而 OpenAI 选对了方向。”曾在谷歌和
    OpenAI 工作过的人工智能创业家阿拉文德·斯里尼瓦斯说，“假如这些模型经过了编码预训练，它们最终会变得更加善于推理。”


    这是因为编码需要一步一步思考。“要是你家的孩子在学校能把数学和编码学得很好，你通常会认为这个孩子更加聪明，有能力推断和分析复杂事物。”斯里尼瓦斯说，“对大语言模型来说也是如此。”


    在谷歌管理层的眼中，这是反常的，因为该公司的业务只涉及计算机语言和广告。但微软是“软件之王”，所以更关心为开发人员制造工具。OpenAI 运气不错，训练自家的模型学习编码不仅讨好了新合作伙伴，还让这些模型的智能水平得到了提升。


    索马西格询问纳德拉对萨姆·奥尔特曼的看法。纳德拉回答说：“他关心的是解决全球问题。”据索马西格回忆，奥尔特曼和纳德拉谈论的话题“超尘拔俗”，甚至让纳德拉对与奥尔特曼的合作更加期待。就好像奥尔特曼的理想越疯狂、越乌托邦，纳德拉就越相信他会帮助微软成长。


    开发通用人工智能曾一度是人工智能领域的边缘想法，但对这家软件巨头来说，它正在演变为一个适合在市场上出售的概念。它能帮助微软构建更好的电子表格，另外还有一个更大的好处：它带来了一套能提高所有微软软件智能水平的工具。


    ## 微软内部的 AI 推进与研究院的摩擦


    纳德拉认为 GitHub Copilot 影响深远。“这套已经完成的服务系统将会改变世界。”索马西格说，更何况还要将其应用到其他软件中。意识到这一点后，纳德拉和首席技术官凯文·斯科特开始在微软内部为人工智能摇旗呐喊，几乎在每一次产品评审或产品决策会议上都会提到这项技术。为什么你的团队不用人工智能呢？全力投入人工智能，尽可能使用
    OpenAI 的模型。


    这自然让微软研究院的数百名人工智能专家感到不满，他们多年来一直在研究人工智能模型。有媒体报道，还有几名听到批评的人工智能研究员声称，纳德拉斥责该部门的管理层，说他们的研究成果远远不如员工更少的
    OpenAI。


    硅谷科技媒体 The Information 报道，纳德拉对微软研究院的负责人说：“OpenAI 只用 250 人就完成了这个项目。我们还要微软研究院干什么用？”


    一位高级人工智能科学家转述，纳德拉还告诫研究人员不要试图开发所谓的基础模型，或者诸如 OpenAI 的 `GPT` 模型之类的大系统。一些员工在沮丧中辞掉了工作。


    但就算是他们也不得不承认，Copilot 是一个了不起的工具，可以帮助程序员编写新的代码并加快处理已有的代码。纳德拉考虑在微软服务中广泛应用人工智能，利用
    OpenAI 的语言模型技术改进用户起草电子邮件和生成电子表格的方式。


    ## DALL-E 2：从文本生成图像的突破


    2022 年初，在索马西格与纳德拉会面几周后，OpenAI 开始测试 `GPT-3` 的更高级版本，这些不同的版本均以历史上的著名发明家命名——埃达、巴贝奇、居里和达·芬奇。随着时间的推移，这些不同的模型越来越能处理复杂的问题，并给出更具个性化的回答。总体来说，公众还没有意识到这套软件已经变得多么先进。直到
    2022 年 4 月，OpenAI 将 `GPT-3` 的部分语言功能应用到视觉图像上，彻底公开其第一个重大发明，这一切才开始改变。


    两年以来，在旧金山 OpenAI 办公楼的一个角落里，三名研究人员一直在尝试使用扩散模型生成图像。扩散模型基本上是通过逆向操作来创建图像。艺术家作画是从一张空白的画布开始的，而扩散模型则是从一张凌乱的画布开始的，上面已经涂抹了许多色彩和随机的细节。该模型会在数据中加入大量的“噪声”或随机性，使其变得无法识别，然后逐步减少噪声数据，慢慢呈现图像的细节和结构。每推进一步，图像就会变得更清晰、更细致，就像画家不断完善自己的艺术作品一样。这种扩散方法，加上一种叫作
    `CLIP` 的图像标记工具，就构成了一个新模型的基础，研究人员把它命名为 `DALL-E2`。


    这个名字是在致敬上映于 2008 年、讲述机器人逃离地球的动画电影《机器人总动员》和超现实主义画家萨尔瓦多·达利。`DALL-E2` 生成的图像有时候看上去非常超现实，但对于第一次看到这种工具的人来说，它本身就不同寻常。如果输入“牛油果形状的椅子”这样的文本提示，你就会得到一系列图像，其中有许多栩栩如生。即使是高度复杂的提示词，`DALL-E2`
    也能如实呈现图像，所以在发布后的几天时间里，它就在推特上流行起来，用户们互相攀比，创造最奇特的图像，比如“戴着宽边帽的仓鼠怪兽在攻击东京”，或者“醉醺醺的赤膊男子在魔多到处闲逛”。虽然人物的脸部通常看上去稀奇古怪，但你不能否认这些图像的精致程度远远超过之前计算机创造出来的东西。公众第一次体验到了它的能力，这让
    OpenAI 突然成了新闻界的宠儿。


    ## 发布策略：OpenAI 的“交付”哲学


    谷歌选择将这样的创新保密，但奥尔特曼认为尝试 OpenAI 新产品的人越多越好。作为硅谷的创业导师，多年来他一直建议企业家将他们的产品推向世界。技术专家有时称之为“交付”策略或者发行“最小可行产品”，但其中蕴含的理念是相同的，即尽可能快地将软件交到用户手中，这样你就可以在自己和用户之间创造一个反馈循环，其实就是把公众当成实验对象。测试产品最好的方法就是放手一搏。脸书、优步、Stripe
    等科技巨头都建立在这样的信条之上，而奥尔特曼也是其坚定的拥护者。


    在接下来的几个月里，OpenAI 逐渐推出 `DALL-E2`，为了防止系统生成冒犯或有害的图像，首先面向的是 100 万左右的预约用户。5 个月后，OpenAI
    放开了 `DALL-E2` 的使用限制，作为它用“噢，还不错”这句话断言 `GPT-2` 不会对世界构成威胁的呼应。


    ## 版权争议与偏见问题


    训练 `DALL-E2` 的数百万张图像抓取自公共网络，但和以前一样，OpenAI 对此含糊其词。成功创造出毕加索风格的图像，很可能意味着毕加索的画作已经成为训练数据的一部分。但这很难确定，也没办法知道其他不太知名的艺术家的作品是否也被用来训练该系统，因为
    OpenAI 不愿透露训练数据的细节，认为这会让坏人得以复制模型。


    格雷格·鲁特科夫斯基经历了一番艰辛才发现这一点。他是波兰的数字艺术家，以描绘尖牙喷火龙和巫师的奇幻风景画闻名。他的名字成为 `DALL-E2` 的竞争对手——开源版本、可与之相媲美的
    `Stable Diffusion`（人工智能绘画生成工具）最受欢迎的提示之一。这引发了一种令人担忧的可能性：如果能用软件创作鲁特科夫斯基风格的艺术作品，为什么还要花钱买鲁特科夫斯基等艺术家的新作品呢？


    `DALL-E2` 的另一个问题也开始引发关注。如果让它生成一些首席执行官的图像，图像里的人物几乎都是白人男性。输入“护士”这样的提示词，它只会生成女性图像，而输入“律师”这样的提示词，则只会生成男性图像。


    奥尔特曼在 2022 年 4 月的一次采访中被问及此事，他保持了一贯的“直面争议”的风格，承认这是一个问题，但强调 OpenAI 正在努力解决。其中一个做法就是，从训练数据中删除暴力和色情图像，从而不让
    `DALL-E2` 生成这些图像。


    OpenAI 还在肯尼亚等发展中国家雇用了承包商，引导模型给出更恰当的回答。这一点至关重要，因为这意味着即使 OpenAI 已经完成了 `GPT-3`、`DALL-E2`
    等模型的训练，它仍然可以在人类审核员的帮助下对系统进行微调，使其回答更精确、更适宜、更合乎伦理。通过将 `DALL-E2` 的回答按照从好到坏排序，人类可以引导它找到总体上更好的回答。


    然而，这些审核员对系统的评分方式并不总是一致的，而且从 `DALL-E2` 的训练数据中剔除问题图像也可能像打鼹鼠游戏。起初，OpenAI 的研究人员试图删除他们能在训练数据集中找到的所有过度性感的女性图像，这样
    `DALL-E2` 就不会把女性描绘成性感的对象。但结果却不尽如人意。当时在 OpenAI 担任研究和产品主管的米拉·穆拉蒂表示，这样做“极大”减少了数据集中的女性数量。她没有透露具体数字。“我们不得不做出调整，因为我们不希望模型‘变笨’。这确实很棘手。”


    `DALL-E2` 所生成的逼真面孔在涉及刻板印象的问题时成为其最大的麻烦制造器，OpenAI 似乎充分意识到了这个问题。因此，当一个主要由 400 名微软和
    OpenAI 员工组成的内部小组开始测试这个系统时，OpenAI 禁止他们公开分享 `DALL-E2` 生成的逼真人物肖像。


    OpenAI 如此迅速地推出一款可以生成虚假照片的工具，让部分员工感到担忧。它已经从一家最初致力于安全人工智能的非营利组织，转变为市场上最激进的人工智能公司之一。该公司一位负责安全测试的匿名员工告诉《连线》杂志，OpenAI
    发布这项技术似乎是为了向世界炫耀，尽管“目前还存在很多潜在危害”。


    但奥尔特曼还在追求更远大的目标。他认为，这个新系统是迈向通用人工智能道路的一次重要跨越。他在一次采访中说：“它似乎真能理解概念，感觉就像拥有智能一样。”他补充说，`DALL-E2`
    的神奇可以让那些通用人工智能怀疑论者开始认真对待这个想法。


    `DALL-E2` 的神奇不仅体现在它的能力上，还体现在它对人们的影响上。“图像蕴含着一种情感力量。”奥尔特曼说。`DALL-E2` 引起了轰动。GitHub
    Copilot 只能在已经开始编写的代码的基础上完成工作，而 `DALL-E2` 可以从无到有地创造完整的内容。它就像一位按照客户的要求作画的图形艺术家。


    ## ChatGPT 的诞生：从补全到生成


    这种生成完整内容的想法让奥尔特曼的下一步行动更加惊世骇俗。`GPT-1` 更像一个自动补全工具，可以将人类输入的内容延续下去。但 `GPT-3` 及其最新升级版本
    `GPT-3.5` 就能够生成全新的文章，就像 `DALL-E2` 能够从零开始创造图像一样。


    就在全世界都在关注 `DALL-E2` 时，有传言称 OpenAI 的竞争对手 Anthropic 正在开发一款聊天机器人，这激起了 OpenAI 的竞争欲望。2022
    年 11 月初，OpenAI 的管理层对员工表示，他们将在几周内推出自己的聊天机器人，该机器人将在 `GPT-3.5` 的基础上开发。据知情人士透露，该公司召集了十几名员工一起开发这款聊天机器人。它与谷歌的
    `Meena` 没什么不同，诺姆·沙泽尔早在两年前就研究出了 `Meena`，只不过谷歌一直没有将其公开。


    OpenAI 领导层向员工保证，这不是产品投放，而是“低调的研究展望”。然而，部分员工表示他们对这么快就发布这款工具感到不安。他们不清楚公众在使用如此流利和强大的语言模型时会犯下何种错误。


    不仅如此，该聊天机器人还经常会犯事实错误。开发人员决定降低系统的谨慎水平，而这会导致它拒绝回答那些它能够正确回答的问题。他们不希望它说“我不知道”，所以对其进行了调整，以便让它听起来更权威，尽管这意味着聊天机器人在某些时候会胡说八道。这款聊天机器人被命名为
    ChatGPT。


    奥尔特曼急于推动该产品的发布。他认为，ChatGPT 经过了数百名 OpenAI 员工的测试和审查，而且让人类适应人工智能的真正使命非常重要，毕竟“亲身下河才知深浅”。在某种程度上，OpenAI
    也是在帮助世界做好准备，迎接其即将推出的更强大的模型 `GPT-4`。据当时的一位 OpenAI 高管透露，`GPT-4` 在内测中写出了不错的诗歌，编出的笑话甚至逗笑了
    OpenAI 管理层。但他们不甚了解它会对世界或社会产生什么样的影响，除非将它公开发布。这在 OpenAI 的官网上被称为“迭代部署”哲学，即公开发布产品以更好地研究其安全性和影响力。该公司表示，这是确保其为人类利益而开发通用人工智能的最佳方式。


    ## 现象级爆发：ChatGPT 时刻


    2022 年 11 月 30 日，OpenAI 在一篇博文中宣布推出试用版 ChatGPT。就连 OpenAI 的很多员工，包括部分安全研究员都不知道这次发布，有些人还开始打赌一周后会有多少人使用它。预计最多将吸引
    10 万用户，因为该工具只是一个带有文本框的网站而已。随意在文本框内输入点什么，背后的机器人就会做出回应。这个聊天机器人由 `GPT-3.5` 驱动。公众大多没听说过
    OpenAI，更不用说 `GPT-3` 了。即使是 OpenAI 的研究人员也不知道开启公开测试后会发生什么。


    “我们今天推出了 ChatGPT。”旧金山时间上午 11 点 30 分左右，奥尔特曼在推特上发帖说，“试试点击 `http://chat.openai.com`
    和它交谈吧。”


    起初只有一小撮开发人员和科学家登录网站进行试用，网络上水波不兴。但随后几个小时，推特上开始出现越来越多的评论：


    - 12:26 发布 @MarkovMagnifico：正在玩 ChatGPT，通用人工智能已提前到来。

    - 12:37 发布 @AndrewHartAR：ChatGPT 刚刚发布。我看到了未来。

    - 13:37 发布 @skirano：绝对难以置信。我让 ChatGPT 生成一个简单的个人网站，它逐步展现了创建过程，然后添加了 `HTML`（超文本标记语言）和
    `CSS`（串联样式表）。

    - 14:09 发布 @justindross：相比谷歌，ChatGPT 对我提出的问题给出了更好的回答。真是不可思议。

    - 14:29 发布 @Afinetheorem：别再布置课后论文或家庭作业了。


    到处都是对 ChatGPT 的惊叹之声，你很难找到一句负面评价。它流利的表达能力，还有丰富的知识储备，都让使用者刮目相看。很多人以前都尝试过聊天机器人，无论是
    Alexa 还是某个客服机器人，他们大多习惯了在一定范围内磕磕绊绊地聊天。但 ChatGPT 几乎能流利地回答任何问题。这就像原来是和一个蹒跚学步的儿童聊天，现在转变为与受过高等教育的成熟大人交谈。


    在接下来的 24 小时里，人们纷至沓来测试 ChatGPT 的极限，服务器也因此不堪重负。现在是专业人士、科技工作者、营销和媒体人员开始对聊天机器人进行实际测试。为了在推特上表现自己，他们把试验变成了公开竞赛，看看谁能让
    ChatGPT 写出最有趣、最聪慧或最古怪的文字。围绕 `DALL-E2` 掀起的热潮仿佛再次上演，但这次声势更大。随后几天，推特被淹没在 ChatGPT
    写的诗歌、说唱音乐、情景喜剧和电子邮件的截图之中。越是标新立异的内容越受欢迎。


    推特用户托马斯·H.普塔塞克让它“用钦定版圣经的风格写一段经文，阐述如何从录像机里取出一块花生酱三明治”。


    OpenAI 的机器人写道：


    ```

    事情就这样发生了，一个男人被一块花生酱三明治弄得心烦意乱，三明治被放在了录像机里，他不知道怎么把它取出来。


    于是他哀求上帝说：“主啊，我怎么才能把这块三明治从录像机里取出来呢？它粘得太牢了，一动不动。”

    ```


    普塔塞克在推特上发帖说：“对不起，我没法嘲讽能写出这样一篇文章的技术。”ChatGPT 的用户在一周内达到了 100 多万。两个月后，它吸引了 3 000
    万名注册用户，成为历史上用户增长最快的在线服务之一。到 2024 年初，每周约有 1 亿人在使用 ChatGPT。在此之前，没有哪种独立运行的人工智能工具能在主流社会中如此受欢迎。


    ## GPT-4 与通用人工智能的曙光


    2023 年 3 月 14 日，就在 Anthropic 终于推出其聊天机器人 Claude 的同一天，OpenAI 发布了升级产品 `GPT-4`。只要愿意每月支付
    20 美元，人人都能通过 `ChatGPT Plus`（ChatGPT 试点订阅计划）使用这项新技术，预计到 2023 年底，该服务将为公司带来 2 亿美元的收入。部分
    OpenAI 的员工认为 `GPT-4` 代表了迈向通用人工智能的重要一步。


    苏茨克维在一次采访中表示，机器不只从文本材料中学习统计相关性。“文本实际上是真实世界的投射……神经网络正在越来越全面地学习世界、人类，以及人类的状况、希望、梦想、动机、互动，还有我们所处的环境。”


    奥尔特曼在另一次采访中说：“这个系统能观察世界，还能学会理解世界——其中一种方法就是预测接下来会发生什么，我认为这已经非常接近人的智能了。”


    科技媒体对此心醉神迷。《纽约时报》称 ChatGPT 是“有史以来公开发布的最佳人工智能聊天机器人”。但凡试用过该系统的记者，都被其友好且热情的回答所吸引。一些科技爱好者在推特上夸耀他们如何使用该系统起草电子邮件等工作文件以提高工作效率。


    ## 对就业的冲击与社会反响


    这自然引发了有关 ChatGPT 是否会取代人类的新一轮媒体报道。奥尔特曼继续通过播客、报纸和其他新闻出版物进行宣传，回应公众的兴奋情绪，直面大众担忧的话题。他表示，是的，这可能会取代一些工作，比如文案写手、客服专员甚至软件开发人员，但这并不意味着
    ChatGPT 及其支持技术将完全取代人类工作。


    “部分工作岗位将会消失，”奥尔特曼在一次采访中坦言，“但也会出现今天很难想象的更好的新工作岗位。”媒体和公众对此只能默默接受，因为如同工业革命这样的历史性转变已经表明，技术确实会给就业市场带来阵痛。何况，ChatGPT
    等生成式人工智能系统也并不是如加密货币那种昙花一现的潮流。ChatGPT 用处很大。大家已经开始用它撰写高中论文、收集商业计划和进行市场调查了。


    OpenAI 的员工安慰自己未来值得期待，认为工业革命时期使用机械设备进行生产同样带来过新的就业机会，也提供了更好的生活水平。但专注于产品开发的一方与关注安全的一方分歧越来越大，后者正在努力监管
    ChatGPT 上激增的输入内容，以防止不法查询。苏茨克维相信他们朝通用人工智能迈出了重要一步，开始与公司的安全团队更紧密地合作。与此同时，OpenAI 的产品团队加大了商业化
    ChatGPT 的力度，邀请企业付费使用他们的底层技术。


    ## 谷歌搜索霸权的动摇


    谷歌高管发现，越来越多的人选择使用 ChatGPT 而不是谷歌获取关于健康问题或产品建议的信息——从广告销售效果看，它们是最赚钱的搜索引擎用语之一。


    可以说谷歌缺乏必要的竞争。这么多年以来，它想方设法从用户的每一次搜索中捞钱，不仅让广告和赞助链接占据了搜索结果页面，也令其产品的使用变得惹人生厌。如果它能让使用者分不清广告和实际的搜索结果，它就能赚更多的钱。


    2000—2005 年，谷歌用较为明显的蓝色背景标记广告，并确保它们只占用页面顶部的一两个链接。但自此以后，广告和普通网络链接的区别越来越小。蓝色背景逐渐变成绿色，接着变成黄色，最后直接消失了。广告开始占据更多的页面，迫使用户不断滚动页面才能找到合适的结果。虽然用户对此很恼火，但并未影响到谷歌，因为互联网用户认为他们没有别的搜索引擎可用。谷歌占据了全球
    90% 以上的在线搜索市场。

