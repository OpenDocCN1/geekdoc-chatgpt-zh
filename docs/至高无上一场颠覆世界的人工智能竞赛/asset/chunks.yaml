- raw: '但在谷歌工作也不完全是坏事。格布鲁深深记得，当员工看到公司做错事时，他们是如何站出来反抗的。数千人在世界各地举行罢工，抗议鲁宾的“黄金降落伞”待遇，就在她加入的前几个月，3 000多名员工签署了一封致首席执行官桑达尔·皮查伊的公开信，要求公司退出Maven项目——他们成功了。更好的是，这些抗议活动由一位名叫梅雷迪思·惠特克的女性人工智能伦理专家配合开展，她对问题的清晰阐述迫使谷歌重新审视这个项目。也许她可以在这里提倡更负责任的做法，比如“数据集数据表”标准。


    然而，从新伦理团队的规模来看，谷歌等科技巨头在投资人工智能方面明显更加优先考虑能力。尽管他们的工作很重要，但团队里只有少数几位计算机科学家。而在公司其他部门，几千名工程师和科研人员致力于实现能力的新突破，好让公司的人工智能系统变得更快、更强，格布鲁和米切尔则是不断追赶进度，并尝试研究可能引发的意外后果。


    米切尔在谷歌感到沮丧。她在会议上提醒管理层人工智能系统可能会引起的一些潜在问题，结果却收到人力资源部门发来的电子邮件，告诉她要更注重合作。在硅谷，女性只占谷歌、苹果、脸书等公司计算机工作岗位的1/4左右，而且直到2020年，女性的平均薪酬也只有男性的86%。女性经常在招聘和晋升方面遭受不平等待遇、骚扰和歧视，黑人女性首当其冲。出现在硅谷的会议或酒会上的女性，很多都从事市场营销或公关工作，而不是工程或研究工作。因此，女性更有可能一开始就研究人工智能伦理，她们切身体会过被歧视的感觉。但这也意味着她们很难登上高位。


    尽管如此，格布鲁仍然让米切尔感到意外和敬佩。她大胆无畏，一旦需要资源或看到不正当行为，就会毫不犹豫地站出来反抗权威。有一天，两人坐在谷歌园区41号楼格布鲁的办公室里，谈论着收到的一封来自管理人员的令人心烦意乱的电子邮件，这封邮件反映出她们在公司共同感受到的那种歧视。米切尔眼眶湿润，但格布鲁却有不同的看法。


    “别沮丧。”她告诉米切尔，“要愤怒。”


    格布鲁把笔记本电脑拉到身边，开始起草回信，她一边写一边大声读，客观地分析管理人员的观点。后来，格布鲁和米切尔遭到谷歌解雇，这名管理人员还公开为她们担保，之后不久就辞职了。


    总之，格布鲁和米切尔将给她们的事业带来应有的关注，即使这意味着两人会被踢出公司，并引发一桩尽人皆知的丑闻。但她们仍在和谷歌的核心力量赛跑。谷歌负责提升人工智能能力的庞大科学家团队很快就会实现人工智能历史上一个最大的飞跃。这是他们创造的奇迹。


    **9**  **歌利亚悖论**


    2017年，谷歌约有8 000名受薪员工。他们并不都是工程师。每日呈现在搜索栏上方的谷歌涂鸦需要管理员。办公室里配有脊椎按摩师和负责按摩服务的管理人员，还有零食管理员确保员工们在食堂享用三餐之余也能有充足的零食补给，还有照料植物的园艺师和清理足球桌的清洁工。


    谷歌的商业模式是一只下金蛋的鹅。2017年，谷歌的广告业务年收入接近1 000亿美元——到2024年这一数字将增加一倍以上。因此，公司自然可以动用大部分资金招揽人才。在硅谷，衡量成功往往有两个标准：募集了多少投资，以及雇用了多少员工。庞大的员工数量是拉里·佩奇、谢尔盖·布林等领导者“帝国梦想”的写照，即使很多时候他们并不清楚许多中层管理人员究竟在做什么。


    谷歌的人员扩张并不罕见。当时的脸书约有40 000名员工，微软则拥有124 000名雇员，而创业者也在梦想打造一个配有健身房和免费冰激凌站的公司园区。唯有德米斯·哈萨比斯独树一帜，也许是因为他远在大洋彼岸。他不想让DeepMind迷失在硅谷式的福利待遇中，也不想无休止地追求规模。


    规模太大的问题在于，谷歌内部产生的一些突破性想法很难落地。谷歌的数字广告业务就像“圣杯”，除非必要，否则绝不能干扰为其赋能的算法。尽管硅谷被誉为世界创新之都，但那里的大型公司并没有那么具有创新性。谷歌的主页在过去10年里几乎没有改变。苹果手机还是同样的长方形金属板。脸书的每一项新功能差不多都“照搬”自Snapchat、TikTok（抖音集团旗下的短视频社交平台）等竞争对手。一旦这些公司的收入达到了数百亿美元的阶段，打乱它们的成功模式就太危险了。


    这就是为什么当谷歌的研究小组取得了过去10年中人工智能领域最重要的一大发现时，这家搜索引擎公司会任其明珠蒙尘。简而言之，从中我们可以看出，大型科技公司的发明能力受制于它们的垄断规模，迫使它们通过模仿或收购的方式来应对他人的创新。但这种特定的疏忽对谷歌来说尤其不利。最终，OpenAI不仅利用了谷歌的重大发现，还利用这项发现对搜索引擎巨头发起了多年以来第一次实质性威胁。


    ChatGPT里的“T”代表“Transformer”（处理序列数据的深度学习模型架构）。它跟“变形金刚”无关，不是那些能变成十八轮车的外星机器人，而是一个能让机器生成人性化文本的系统。Transformer已经成为生成式人工智能新浪潮的关键所在，生成式人工智能可以生成逼真的文本、图像、视频、基因序列和许多其他类型的数据。Transformer发明于2017年，其对人工智能领域的影响堪比智能手机对消费者的影响。在智能手机出现之前，手机除了打电话、发短信和玩奇怪的《贪食蛇》游戏之外，什么也干不了。但随着触屏智能手机进入市场，消费者突然就可以浏览互联网、使用GPS、拍摄高清照片，还可以启用数百万个不同的应用程序。


    Transformer还拓宽了人工智能工程师的工作范围。他们得以操纵更多的数据，以更快的速度处理人类语言。在Transformer发明之前，与聊天机器人交谈感觉就像对牛弹琴，因为旧系统的运行依赖规则集和决策树。如果你问机器人一些还没有写进其程序的东西（这很有可能），它就会被难住，或者给出奇怪的错误回答。最早的语音助手，如苹果的Siri、亚马逊的Alexa，甚至谷歌助理都是这样的。它们将每次查询视为单个孤立的请求，所以无法联系上下文。它们不像人类那样能够在谈话中记住之前的提问。例如：


    “Alexa，印第安纳波利斯现在的天气怎样？”


    “印第安纳波利斯现在天气多云，气温为零下4摄氏度。”


    “我从伦敦飞到那里需要多长时间？”


    “从伦敦飞到你当前的位置，大约需要45分钟。”


    在撰写本书时，我当时的所在地是萨里郡，距离伦敦希思罗机场大约45分钟航程。Alexa为什么会给出这么一个令人费解的回答并不重要，重要的是它无法理解“那里”代指我在两秒钟以前问及的印第安纳波利斯。这些传统数字助手背后的系统大多范围狭窄，仍然主要依靠关键词。这就是它们会给出以上回答的原因。


    Transformer使聊天机器人摆脱了这些束缚。它们能够处理细微的语言差异和俚语；它们能够参考你之前说过的话；它们几乎能够处理任何随机查询，并给出个性化回答。一言以蔽之，升级让它们变得更加通用。对于许多人工智能科研人员来说，这意味着向通用人工智能迈进了一步。但这也将引发一场争论，即计算机是否像人类一样开始“理解”语言，或者说它们仍然只是通过基于数学的预测处理语言。


    从某种角度来说，这项发明出自谷歌实在令人惊讶。尽管拥有众多人才和资源，但该公司组织结构臃肿，还担心创新会中断广告业务，因此员工推动创新的尝试困难重重。“谷歌大脑”的前员工表示，虽然该项目会聚了公司最优秀的深度学习专家，但管理层不明确的目标和策略让他们备受困扰。拥有像杰弗里·辛顿这样的诸多科学家人才，在一定程度上催生出文化自满。人工智能领域的进入壁垒很高，而谷歌已经在使用循环神经网络等最先进的人工智能技术，每天可以处理多达数十亿个字词的文本信息。


    在发明这些技术的人身旁，还有一些像伊利亚·波洛苏欣这样的年轻人工智能研究员。2017年初，波洛苏欣打算离开谷歌，冒险挑战自我。在拉里·佩奇办公室楼下两层谷歌的一间食堂里，这名25岁的乌克兰人正在和研究员阿希什·瓦斯瓦尼、雅各布·乌斯克雷特闲聊。他的午餐伙伴也不喜欢遵循公司里科学家惯常的那一套。瓦斯瓦尼渴望参与大项目。乌斯克雷特在谷歌工作了10多年，忧心于“谷歌大脑”的激励机制已经演变为一个类似学术荣光的东西：在聘请了几十名新的毕业生和学者之后，他的周围充斥着成为论文第一作者或在会议上发表演讲的声音。不是说要做伟大的产品吗？


    只要乌斯克雷特在聚会上提到他在哪里工作，别人就会对他刮目相看。但每当他补充说他为谷歌翻译工作时，他们就会开始大笑。谷歌翻译差劲得很，经常失准，尤其是在翻译中文等非拉丁语言时。波洛苏欣也认为谷歌翻译很烂。他的中国朋友对此抱怨连连。乌斯克雷特很想知道有没有更好的方法。谷歌的工程师们往往认为他们已经使用了最先进的技术，所以秉承“如果没坏就不修”的座右铭。乌斯克雷特看待事情的角度则不同，他想的是“如果没坏就突破”。


    “如果我们去掉机器翻译解码器里的循环神经网络，只使用注意力机制呢？”其中一人问道，“会不会加快推理时间？”


    用人工智能语言来说，研究人员是想知道他们能否更充分地利用超强计算机芯片。在那之前，谷歌一直使用循环神经网络技术来分析文字。系统就像你从左到右阅读句子一样按顺序挨个查看文字。这是当时最先进的技术，但未能充分利用英伟达等公司生产的能够同时处理多种任务的芯片。家用笔记本电脑芯片大概拥有四个处理指令的核心，但服务器上用于处理人工智能系统的GPU芯片则拥有数以千计的核心。这意味着人工智能模型可以同时“阅读”一个句子里的很多字，而不需要挨个查看。不去利用这些芯片，就像关掉电锯去手工切割木材。试想一下拔掉锯床的插头，然后拖着锯片来回磨着木板。这是对机器潜能的浪费，既耗时又费力。处理语言的人工智能系统也出现了类似的问题。它们并没有充分发挥芯片的潜力。


    瓦斯瓦尼等人一直在研究人工智能中的“注意力”概念，即计算机从数据集中挑出最重要信息的情况。他们仨一边吃着沙拉和三明治，一边想知道是否可以利用同样的技术更快、更准确地翻译文字。


    接下来的几个月，三位研究员开始进行实验。乌斯克雷特在办公室周围的白板上涂画新架构，路过的人虽然不会打扰他，但会用怀疑的眼光看着这些示意图。这项研究在当时不合时宜。他们在讨论去除循环神经网络中的循环元素，这太疯狂了。而且瓦斯瓦尼构建的新架构，相较于现有的架构也好不到哪里去。但消息传开后，也有其他人想加入这个项目。


    谷歌的传奇人物诺姆·沙泽尔就是其中的一员。他曾联合发明过一个系统，辅助谷歌AdSense（互联网广告服务）程序计算出在哪些网页上显示哪些广告。他总是满脸堆笑，嗓音洪亮，被认为是怪人，喜欢和桑达尔·皮查伊等公司高层闲谈，就好像他们是老朋友一样。沙泽尔在大语言模型方面经验丰富。这些计算机程序在经过数十亿个字词的训练后，可以分析和生成人性化的文本。加入这个研究小团体后不久，沙泽尔就找到了一些帮助新模型处理大量数据的技巧。


    “一旦你融会贯通，奇迹就发生了。”乌斯克雷特回忆道，“灵感迸发，思如泉涌。”


    很快，这个尚未命名的项目就吸引了八位研究员，编写代码改进他们称之为“Transformer”的架构。Transformer是一个可以将输入转换成输出的系统，虽然科学家们专注于翻译语言，但该系统最终将得到更广泛的应用。


    过了一段时间，他们开始注意到一些进展。有一次，乌斯克雷特说：“哇，这次不一样了。”系统正在生成复杂的德语长句子结构，乌斯克雷特小时候在德国生活了多年，会说一口流利的德语，他发现这些句子比谷歌翻译提供的内容还要好。它们流利、易读，最重要的是十分准确。说法语的波洛苏欣也注意到了相同的情况。


    团队中的利昂·琼斯是一名来自威尔士的程序员，他惊讶地发现，系统正在执行“指代消解”。“指代消解”一直是妨碍计算机正确处理语言的症结所在。它指的是在文本中查找同一实体所有表达方式的任务。


    例如，在句子“那只动物没有过马路，因为它太累了”中，对我们人类来说“它”明显指的是“那只动物”。但把这句话改成“那只动物没有过马路，因为它太宽了”，“它”现在指的是“马路”。在此之前，让人工智能根据语境推断出这种转换一直困难重重，因为这需要常识性知识，而这类知识是人类多年来在了解世界的运作方式和物体互动规律的过程中积累起来的。


    “人工智能解不出这道经典的智力测试题。”琼斯说，“我们无法将常识植入神经网络。”然而，当研究人员对Transformer进行同样的测试时，他们看到Transformer的“注意力头”产生了不寻常的举动。注意力头就像模型里的一个迷你探测器，专门负责监测输入数据各个不同的部分。它能够充分利用既有芯片的潜能，让Transformer同时关注一个句子里的所有字词，而不是按照顺序挨个查看。


    当研究人员把“累”这个词改成“宽”时，就发现注意力头也将“它”指代的对象从“动物”改成了“马路”。


    琼斯回忆道：“我想以前没人见过这种情况。”他甚至开始怀疑自己是否难得窥见了真正的智能。“事实上，它是从非结构文本中提取了常识，这证明还有一些更有趣的事情正在发生。”


    在第一次午餐谈话后大约6个月，研究人员写下了他们的发现。此时，波洛苏欣已经离开了谷歌，但其他人并未放弃这个项目，他们在办公室埋头苦干，经常待到半夜。身为项目论文主要负责人的瓦斯瓦尼，甚至会在办公室的沙发上过夜。


    有一次，瓦斯瓦尼大声说：“我们需要起个标题。”


    琼斯从旁边的桌子上抬起头。“我不怎么擅长起标题。”他回答道，“但《注意力就是你所需要的》怎么样？”他灵光一闪，想到了这个标题，当时瓦斯瓦尼没有表示赞同。琼斯回忆道，事实上他站起来走了。


    后来，《注意力就是你所需要的》还是出现在了论文的首页上，对他们的发现做了完美的总结。利用Transformer，人工智能系统能够同时关注大量数据，完成更多的事情。


    瓦斯瓦尼说：“我喜欢把它们想象成推理引擎。”


    这些推理引擎能够大幅提升人工智能的能力，但谷歌却反应迟缓，没有对它们进行应用。举例来说，谷歌用了几年时间才将Transformer接入谷歌翻译、BERT（自然语言处理预训练模型）等服务系统，后者是其开发的一个大语言模型，用来使搜索引擎能够更好地从细节上处理人类语言。


    Transformer的发明者不禁感到沮丧。就连德国的一家小型初创公司也早在谷歌之前就开始使用Transformer翻译语言，现在这家大型公司需要迎头赶上。


    其中一些发明者试图向谷歌展示Transformer的更大可能性。论文发表后不久，沙泽尔开始和一名同事合作，以将这项技术应用于新的聊天机器人Meena。他们从公共互联网上的社交媒体对话中收集了大约400亿个字词对它进行训练，最后确信Meena将会彻底改变人们搜索网络和使用计算机的方式。Meena先进到能够即兴创作双关语，和人类开玩笑，也可以轻松进行哲学辩论。


    沙泽尔及其同事对他们的新研究成果感到激动不已，试着将机器人的详细信息发送给外面的科研人员，希望能进行公开演示，甚至试图利用更为先进的语音技术，改进用户家里的谷歌助理。但谷歌高层制止了这些努力。他们担忧这个机器人会说一些有损谷歌声誉的古怪言论，更具体地说，他们害怕影响到谷歌价值1
    000亿美元的数字广告业务。根据《华尔街日报》的一篇报道，他们挫败了沙泽尔向公众推出Meena以及将其植入谷歌产品的每一次尝试。


    “除非是能够创造10亿美元的业务，否则谷歌不会有任何行动。”波洛苏欣说，“但要发展10亿美元的业务真的很难。”根据2023年彭博社对桑达尔·皮查伊的一次采访，这就是谷歌员工离开公司，并创办2
    000家不同公司的原因。虽然谷歌看似被塑造成了创新的源泉，但实际上这家搜索巨头更像一只鱿鱼怪，吞没了所有创新。许多企业家还会把他们创办的新公司卖给谷歌，或者接受谷歌的投资。如果无法开发出新技术，谷歌通常就会收购。


    我们可以从两个方面看待谷歌面对新技术的迟缓反应。在舆论上，它将自己树立为谨慎的形象。而谷歌的许多研究人员也认为，公司高层确实在推出人工智能的问题上小心翼翼，以防止其可能造成的社会危害。近年来，谷歌制定了一份人工智能使用指南，其内容主要来自DeepMind的类似规则。2018年，谷歌首席律师肯特·沃克宣布，由于存在滥用的可能，公司将停止销售面部识别技术。从更广泛的角度来看，为了权衡伦理上的利弊，谷歌对算法有一套严格的内部审查程序，有时还包括外部的同行评议。


    但谷歌还是做出了违背伦理的决定。同年5月，皮查伊演示了一项新的助手功能，叫作Duplex。Duplex是一个人工智能语音助手，不仅能打电话给餐馆预订座位，还使用了“嗯”“呃”等口头语，好让它听起来更像人类。皮查伊在一片掌声中结束了演示，但评论家指责谷歌是在欺骗电话另一端的人类，因为该助手并没有透露它是一台机器。


    谷歌之所以如此谨慎，在很大程度上是由于它的扩张。作为有史以来最大的公司之一，它垄断了搜索市场，但也有不利之处，那就是行动速度慢得像蜗牛，它总是害怕遭到公众抵制或监管审查，最关心如何保持增长和市场优势。因此，谷歌一直致力于保持对搜索市场的垄断，根据美国司法部最近提起的一项开拓性反垄断诉讼，2021年，仅仅为了在手机上预装搜索引擎，谷歌就向苹果、三星等公司支付了超过263亿美元的费用——金额超过其当年净利润的1/3。


    庞大的规模和对增长的执着，也意味着公司的研究员或工程师哪怕是实施很小的想法，也经常需要经过几个管理层级的批准。同时，因为谷歌控制了全球大约90%的在线搜索市场，几乎没有竞争对手，所以也不存在创新的紧迫性。


    有一次，Transformer团队聚在一起做研究，沙泽尔和皮查伊在公司的咖啡机旁边聊天。作为在谷歌工作多年的人工智能专家，沙泽尔与一些公司高层建立了私人关系。据当时在场的论文作者之一卢卡什·凯泽透露，沙泽尔夸耀自己的新发明说：“这将完全取代谷歌。”


    凯泽回忆道：“他已经有了这将取代一切的想法。”沙泽尔一直在对他的同事说同样的话，还在谷歌管理层的内部备忘录中谈到过Transformer的潜力，所以他不是在开玩笑。有了Transformer，计算机不仅可以生成文本，还可以回答各种问题。如果消费者开始更多地使用这些技术，谷歌就会流失用户。


    然而，皮查伊对这一评论显得无动于衷，只当沙泽尔是一名言行比较古怪的科研人员。皮查伊表示，无论如何可以先研究看看。沙泽尔很失望，他在2021年离开谷歌，与他人合伙创办了一家叫作“Character.ai”的聊天机器人公司，独立从事大语言模型研究。此时，论文《注意力就是你所需要的》已经成为人工智能领域有史以来最受欢迎的研究成果之一。通常来说，如果一篇人工智能研究论文能被引用数十次，就颇受幸运女神的眷顾了。但这篇关于Transformer的论文在科学家中引起了巨大轰动，被引用了8万多次。'
