    1.8 万家公司和开发人员正在使用微软 Azure 平台的人工智能服务，现在他们中的很多人都在问是否应该换用其他产品。周五晚间收盘时，微软的股价开始下滑，到下周一开盘时，几乎可以肯定股价还会进一步下跌。纳德拉需要采取行动。


