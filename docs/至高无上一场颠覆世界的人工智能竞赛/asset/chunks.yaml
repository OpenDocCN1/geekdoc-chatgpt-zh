  trans: '

    Public companies typically have boards of directors representing shareholder interests.
    Directors meet quarterly to review the company''s conduct, ensuring it acts correctly
    to drive the stock price up rather than down. Suleyman told his partners that
    to address a transformative technology like artificial intelligence, DeepMind
    should establish a different kind of board. Its mandate would not be to focus
    on making money, but to ensure DeepMind developed AI safely and ethically. Hassabis
    and Legg initially disagreed, but Suleyman was persuasive, and they eventually
    agreed to the proposal.


    Hassabis approached Zuckerberg and told him that a precondition for selling DeepMind
    was the establishment of an Ethics and Safety Board. This board should possess
    independent legal status so as to govern all superintelligent AI ultimately developed
    by DeepMind. Zuckerberg hesitated over this demand. He wanted to grow Facebook''s
    advertising business and "connect the world" through its various social media
    platforms, but he did not want to run an independent AI company—especially one
    that came with a grand mission and a stack of ethical protocols. Ultimately, the
    negotiations collapsed.


    Publicly, Hassabis told employees that DeepMind would remain independent for the
    next 20 years. Privately, however, he had grown weary of fundraising and was frustrated
    by how little time he had left for actual research. After turning down Zuckerberg''s
    massive offer, he couldn''t help wondering how much money he could make by selling
    the company to a Silicon Valley firm, especially at a time when large tech companies
    were salivating over AI. Executives from Silicon Valley tech giants, including
    a billionaire or two, were now regularly calling DeepMind''s researchers, attempting
    to poach them. Many of DeepMind''s employees were experts in deep learning, a
    field that had stagnated for years until recently.


    The turning point arrived in 2012. Previously, Stanford AI professor Fei-Fei Li
    had created an annual academic challenge called ImageNet (a large visual database
    for visual object recognition software research), which required researchers to
    submit AI models with visual recognition capabilities—models that could identify
    images of cats, furniture, cars, and the like. That year, a research group led
    by scientist Geoffrey Hinton used deep learning to develop a model that was more
    accurate than any before it; their results stunned the AI world. Suddenly, everyone
    wanted to hire experts in deep learning AI theory—theory inspired by the brain''s
    pattern recognition abilities.


    Legg noted it was a niche field with only a few dozen experts. "We hired a good
    number of them." Hassabis was paying them around $100,000 a year, but tech giants
    like Google and Facebook were offering multiples of that. Legg recalled: "Some
    very famous people were calling our researchers and offering three times the salary."
    According to a former DeepMind employee, Zuckerberg was one of those very famous
    people. "We had to sell the company, or we would have been torn apart." Hassabis
    yearned to be the first to build Artificial General Intelligence (AGI); he could
    not stand by and watch better-resourced tech companies beat him to it.


    Unexpectedly, investor Elon Musk also suddenly proposed acquiring DeepMind. According
    to insiders, the billionaire wanted to pay with equity in Tesla (the electric
    car company he had been running for five years). As an investor, Musk never interfered
    in company affairs, only occasionally touching base with Hassabis. Although the
    billionaire was increasingly worried about the risks of AI, commercial objectives
    remained paramount in his mind. He wanted Tesla cars to be the first in the world
    to successfully deploy self-driving technology, which naturally required more
    top-tier AI experts. Now, he could build an elite team by acquiring DeepMind.


    But DeepMind''s founders remained wary. Tesla equity held little appeal. They
    were also uneasy about someone like Musk taking the reins of AGI. Although the
    mainstream had begun to acknowledge Musk''s foresight, he was notorious in the
    tech world for his volatility—abruptly firing employees, even ousting Tesla''s
    co-founders.


    The founders admired Musk''s investment acumen and network just as much as they
    feared his mercurial temperament. They rejected Musk''s offer, too, but failed
    to realize just how much the thin-skinned Musk disliked being turned down, nor
    how much this decision would come back to haunt them. Soon enough, however, Hassabis
    received another email. It came from Google.


    ## 5 For Utopia, and for Money


    The email traveled over 5,000 miles from sunny Mountain View, California, sent
    by an executive at Google headquarters. Hassabis, in London, opened it to find
    an invitation to meet with Google CEO Larry Page. In 1998, Page had co-founded
    Google with Stanford PhD student Sergey Brin. They wanted to improve internet
    search, so they designed an algorithm called PageRank to categorize web pages
    by relevance and interconnectivity. Starting from a friend''s garage in Menlo
    Park, California, they eventually built one of the world''s largest tech companies.


    But by today''s standards, Google''s money-making method isn''t exactly high-tech
    or innovative, because it has turned into an advertising sales behemoth, much
    like Facebook. The vast majority of Google''s profits and revenue come from tracking
    users'' personal information and serving them ads through Search, YouTube, Gmail,
    and millions of websites and apps using the Google Display Network.


    For someone like Hassabis, who wanted to use AI to change the world, the invitation
    was unsettling. But he also knew that if he declined, Google might simply poach
    his staff and build AGI without him. Google had already hired hundreds of engineers
    to work on AI, so Hassabis felt he could not refuse the meeting request from California.


    Meeting Page, Hassabis found a kindred spirit. Before him sat an introverted math
    graduate with thick, dark eyebrows, wearing a casual shirt and shorts. Throughout
    Google''s founding, Page had harbored a dream of building powerful AI. Hassabis
    recalled: "He told me he always thought of Google as an AI company, even back
    in 1998 when they started in the garage."


    This was partly personal; Page''s father was a professor of AI and computer science
    who died in 1996. This made him "AI royalty." Page admired Hassabis''s seriousness
    about building AGI and thought the idea wasn''t crazy at all. He had also launched
    an internal project at Google to develop human-like AI, a project that would eventually
    ignite Hassabis''s fierce competitive drive.


    Page''s project was called "Google Brain," though Hassabis knew little about it
    at the time. It was proposed by soft-spoken Stanford professor Andrew Ng, who
    wanted to build more advanced AI systems within Google. In 2011—years before Google
    approached DeepMind—the professor sent Page a four-page document titled "Neuroscience-Inspired
    Deep Learning." Professor Ng hoped the Google CEO would approve a project to develop
    a "general" AI system—precisely what Hassabis was researching in the UK.


    It turned out that both Ng and Hassabis employed a similar approach to achieving
    their goal: using neuroscience as the foundation for building AGI. The Stanford
    professor told Page in his proposal that he would build "increasingly accurate
    simulations of the various parts of the mammalian brain."


    Even though Ng was a leading figure in AI working at one of the world''s most
    prestigious universities, the idea of building AGI was highly controversial at
    the time. Ng recalled: "Friends told me it was a bit weird. They said, ''It''s
    not good for your career.''"


    In a sense, they were right. Scientifically speaking, Ng and Hassabis''s obsession
    with the human brain had issues. Theoretically, using the human brain as a blueprint
    for AI makes sense, but slavishly copying biology is not a panacea. Think of the
    early pioneers who tried to build flying machines by mimicking bird flight. They
    piloted contraptions with heavy wings and all ended up crashing. Other computer
    scientists kept hitting walls trying to replicate the brain. In a 2013 TED Talk,
    neuroscientist Henry Markram claimed he had figured out how to simulate the entire
    human brain on a supercomputer and would achieve it within 10 years. A decade
    later, his Human Brain Project had cost over $1 billion and essentially failed.


    Over time, AI scientists like Ng and Hassabis would realize that simulating the
    brain is fraught with difficulty while our understanding of it—from the function
    of neurons to the operation of brain regions—remains fragmentary. Although we
    know the human brain has roughly 90 billion neurons constantly firing, we still
    don''t know how this information is processed.


    "In retrospect, pursuing biologically realistic fidelity too aggressively was
    a mistake," Ng said. But on another scientific front, Ng was spot on: scaling
    up neural networks.


    A neural network is a piece of software built by training on vast amounts of data
    repeatedly. Once trained, it can recognize faces, predict chess moves, or recommend
    your next Netflix blockbuster. Neural networks, also called "models," typically
    consist of many different layers and nodes that process information in a way loosely
    similar to the brain''s neurons. The more a model is trained, the better its nodes
    become at predicting or identifying things.


    Ng discovered that the more nodes, layers, and training data used, the more capable
    these models became. Years later, OpenAI would make a similar discovery: that
    "scaling" these key ingredients was critical. During his experiments at Stanford,
    Ng noticed that the larger the deep learning model, the better it performed. These
    results thrilled him, prompting him to send that four-page memo to Page, suggesting
    he might achieve "large-scale brain simulation" and progress toward "human-level
    AI."


    Page loved the idea. He not only agreed but put Ng in charge of Google''s most
    cutting-edge AI research project to date. But years passed, and "Google Brain"
    didn''t seem to be on track to build AGI. Instead, it helped Google improve its
    targeted advertising business (making ads more relevant by better predicting what
    users would click), thereby boosting company revenue. Ng admitted this wasn''t
    what he had envisioned when he sent the proposal to Page. He said: "It was a bit
    disappointing compared to the work I had done."


    What Ng truly wanted to achieve scientifically was to free humanity from mental
    drudgery, just as the Industrial Revolution freed us from sustained physical labor.
    He believed more powerful AI systems could do the same for professionals, "so
    we can all go pursue more exciting, higher-level goals."


    Ng''s modus operandi differed from Hassabis''s. The British entrepreneur wanted
    to stay as far away from the advertising behemoth as possible; Professor Ng was
    happy working at Google. In that sense, Ng did Hassabis a huge favor. From the
    deck of the Google mothership, Ng''s research had already veered onto a track
    of boosting the company''s ad performance, meaning DeepMind didn''t have to contribute
    immediately.


    By late 2013, when Google first approached DeepMind about an acquisition, Ng was
    already leading a team building complex AI models to enhance Google''s ad tools—diverging
    from his lofty goal of building omnipotent AI to liberate humanity from mental
    drudgery. Now, Page flew to London to negotiate the acquisition of DeepMind, knowing
    he could spend Google''s money on more forward-looking research projects.


    According to *Genius Makers* by New York Times writer Cade Metz, DeepMind''s founders
    hosted the Google billionaire in their London office and briefed him on the company''s
    current research. Hassabis described how his team had developed a new technique
    called reinforcement learning and trained an AI system to master the Atari classic
    *Breakout*. In the game, you slide a paddle back and forth to bounce a ball at
    a wall of bricks. Within two hours, the system learned to hit the ball to the
    right spot, consistently knocking out a few bricks to carve a tunnel through a
    narrow gap behind the top row. Page was amazed.


    As a technology, reinforcement learning isn''t so different from rewarding a dog
    with food for obeying commands. In training AI, you can use a similar reward model—numerical
    signals like "+1" to indicate a good outcome. Through endless trial and error
    and repeated gameplay, the system learned what worked and what didn''t. Highly
    complex computer code wrapped an elegantly simple idea.


    Next, Legg outlined the future direction: applying these techniques to the real
    world. Just as they trained models to master video games, using the same methods,
    they could teach robots to navigate homes or develop an autonomous agent fluent
    in English. This was where DeepMind''s discoveries—and AGI itself—would ultimately
    have the most profound impact. Page and his team were convinced.


    Page knew Hassabis and his co-founders had rejected Facebook''s massive offer,
    so he led the deal negotiations personally. He quickly learned the details. Hassabis
    set two conditions for the sale. First, he and his co-founders wanted Google to
    promise never to use DeepMind''s technology for military purposes—whether controlling
    autonomous drones or weapons, or supporting soldiers on the battlefield. They
    considered these moral red lines Google must never cross.


    Second, they wanted Google''s leadership to sign an ethics and safety agreement.
    Drafted by London lawyers, this agreement would place all future AI technology
    developed by DeepMind under the control of an Ethics Board, co-chaired by Hassabis
    and co-founder Suleyman. They hadn''t finalized who else should sit on the board,
    but they wanted it to have full legal standing to govern the powerful AI they
    would eventually build.


    "If we succeed, we need to treat AGI with caution," Hassabis said of the board
    he and his co-founders wanted to establish. "Because this is a general-purpose
    technology, perhaps one of the most powerful technologies ever, we want to align
    with people who take it just as seriously."


    Sure enough, it took months of tough negotiations before Google agreed to the
    two conditions that had sunk the Facebook deal. Acquiring DeepMind meant Page
    would own the first company building AGI. He knew that if an ethics board had
    legal control over the technology, Google would struggle to profit from it, but
    ultimately his idealistic vision won out. They would find a way to solve that
    problem. Page agreed to DeepMind''s demands, incorporating the establishment of
    the ethics board into the acquisition process.


    AGI needed to be handled with care not just because a large corporation might
    dictate its future, but because it attracted several nascent ideologies that could
    steer the technology in different directions. Hassabis had already learned this
    from investors like Peter Thiel and Jaan Tallinn—Thiel wanted AI to develop faster,
    while Tallinn feared this young British entrepreneur might trigger a catastrophe.


    For those with strong convictions about AI''s use, its incredible potential added
    an almost religious dimension. In the coming years, these ideologies would battle
    innovators and monopolies for control of AGI, becoming an unpredictable risk for
    the technology. For instance, they would oust Sam Altman from OpenAI, absurdly
    push AI commercialization, paint a doomsday portrait of AI''s power just to attract
    more corporate attention to the software. In a world chasing commercial success
    and profit, a growing number of AI creators found themselves surrounded by competing
    dogmas—whether to build AI as fast as possible to achieve utopia, or to stoke
    fears that it might bring about the end of the world.


    People who know Hassabis say that as a strategic thinker who likes to hedge his
    bets, he largely stayed above these fray, partly due to his own unique goal: using
    AGI to make major, even sacred, discoveries. Suleiman was more concerned that
    AI would inevitably cause societal problems. A former colleague of Shane Legg
    revealed that among the three co-founders, Legg was the most sympathetic to the
    extreme ideologies pursuing AGI, one of which had been brewing for decades. It
    is the ever-controversial transhumanism, which helps explain why AI creators sometimes
    ignore the technology''s downsides.


    The basic premise of transhumanism is that humans are currently second-rate. With
    the right scientific discoveries and technological support, perhaps we will one
    day transcend our physical and mental limits, evolving into a new, more intelligent
    species. We would be smarter, more creative, and live longer. We might even succeed
    in merging the human brain with computers and exploring the galaxy.


    Its core ideas trace back to the 1940s and 60s, when evolutionary biologist Julian
    Huxley joined and became president of the British Eugenics Society. The eugenics
    movement advocated improving humans through selective breeding, and it flourished
    in British universities, intellectual circles, and the upper classes. Huxley himself
    came from an aristocratic family (his brother Aldous wrote *Brave New World*)
    and believed the upper classes had superior genes. The lower classes needed to
    be weeded out like failed crops and forcibly sterilized. "They breed too fast,"
    Huxley wrote.


    After the Nazis co-opted the eugenics movement, Huxley decided to rebrand it.
    In an essay, he coined the new term "transhumanism," arguing that beyond sensible
    breeding, humans could "transcend themselves" through science and technology.
    By the 80s and 90s, the movement peaked because the advancing field of AI offered
    a tantalizing new possibility: perhaps scientists could merge the human brain
    with intelligent machines, thereby enhancing the human mind.


    This proposition was concretized in the concept of the "Singularity." The Singularity
    is a future moment when AI and technology become so advanced that humanity undergoes
    a sudden, irreversible transformation, optimizing itself by fusing with technology
    and machines. Legg, who read related books in his youth, and DeepMind''s wealthy
    investor Peter Thiel were both captivated by this proposition. Tech experts craved
    this utopia so desperately that Altman, Thiel, and others have signed agreements
    with various companies to have their brains or entire bodies cryogenically preserved,
    just in case they don''t live to see "mind-machine merger." "I don''t expect it
    to necessarily work," Thiel said on journalist Bari Weiss''s podcast, "but I think
    we should try to do it."


    The problem with some of these views is that over time, adherents become increasingly
    fanatical. For example, certain so-called AI accelerationists believe scientists
    have a moral obligation to build AGI as fast as possible to create a post-human
    paradise—a techno-rapture. As long as they succeed in their lifetime, they can
    live forever. But accelerating AI development might also mean cutting corners,
    risking harm to certain groups or losing control.


    Consequently, others take the opposite stance, viewing AI as a future demon that
    must be stopped. Bearded libertarian Eliezer Yudkowsky, sipping coffee, sparked
    Jaan Tallinn''s precautionary instincts; he is the leading figure of this intellectual
    movement, constantly fueling it through his website LessWrong. By the time Google
    acquired DeepMind in 2014, several hundred people, including AI researchers, had
    gathered on the site to philosophically debate how to prevent a future superintelligence
    from causing destruction. LessWrong became the internet''s most influential AI
    doom hub, with some reports noting it bore all the hallmarks of a modern doomsday
    cult. If a member suggested a future AI might destroy humanity in a different
    way, Yudkowsky would publicly denounce them and kick them out.


    Over time, these so-called AI doomers gained enough support among wealthy technologists
    to fund companies and steer government policy in their favor. Yudkowsky''s site
    grew so influential that many devoted readers eventually joined OpenAI.


    But perhaps the most unsettling ideologies emerging in the AGI field are those
    focused on digitally creating a near-perfect human species. Bostrom''s *Superintelligence*
    partly fueled this view. The book had a contradictory impact on the AI field.
    It made the public fear AI''s potential destruction more with the "paperclip maximizer"
    example, but it also prophesied that creating the right kind of powerful AI could
    usher in a bright utopia. Bostrom argued one of this utopia''s most alluring features
    would be "post-humans," possessing "capabilities far exceeding those of current
    humans," existing in a digital world. In this digital utopia, humans could experience
    environments defying physical laws—like death without assistance or exploring
    fantasy worlds. They could choose to relive cherished memories, create new adventures,
    even experience different forms of consciousness. Interactions with others would
    become more profound, as these new humans could directly share thoughts and feelings,
    forging deeper connections.


    These ideas are intensely seductive to parts of Silicon Valley, who believe the
    right algorithms can realize such wondrous lifestyles. By painting a future that
    could be either heaven or hell, Bostrom triggered a pervasive belief that ultimately
    drove AI creators like Sam Altman in Silicon Valley to race ahead of Demis Hassabis
    in London to build AGI. That pervasive belief is: they must build AGI first because
    only they can do it safely. Otherwise, someone else might build an AGI that violates
    human values, which would not only wipe out the billions living on Earth but also
    destroy the trillions of perfect future digital humans—costing us all the chance
    to live in paradise. Meanwhile, Bostrom''s ideas have dangerous consequences because
    they divert industry attention away from how AI will harm humans *now*.


    These contemporary tech ideologies, coupled with Google''s acquisition of DeepMind,
    illustrate a hardening, brutal truth: for tech companies, finding a responsible
    "steward" for AI is becoming increasingly difficult. Driven by the dual forces
    of near-religious zealotry on one side and an insatiable hunger for commercial
    growth on the other, divergent goals are heading toward a head-on collision.

    '
