  trans: '

    Under a 100-point scoring system, tech companies averaged 37 points, performing
    worst in governing how people use AI tools. "In reality, the downstream impact
    of foundation models is not transparent," Stanford researchers stated. "No developers
    provide accounts of affected market sectors, individuals, or regions, nor any
    form of usage reporting."


    Meanwhile, public sector organizations responsible for scrutinizing AI companies
    have been chronically underfunded. Aside from the uncertain future of the EU AI
    Act, there are virtually no regulations compelling leading companies to increase
    transparency. Tech companies can deploy unpredictable AI tools globally whenever
    they deem it necessary.


    OpenAI and DeepMind focused on building the perfect AI. To ensure their systems
    wouldn''t cause harm like social media companies, they chose secrecy while rejecting
    research audits. While the idea of building AGI is alluring, it may also bring
    broader risks. Focusing on developing task-specific AI might be a safer approach,
    but it''s less exciting and fails to inspire the near-religious devotion to utopian
    fantasies that attracts such massive investment.


    Both Altman and Hassabis strove to stay ahead in the AI race while resisting the
    lure of Big Tech, insisting on altruistic goals. They needed massive compute,
    vast data, and the world''s most talented (and expensive) AI scientists. Now,
    as the two men square off representing Microsoft and Google respectively, they
    have also redefined the goal of AGI—shifting from the pursuit of utopia and scientific
    discovery to the pursuit of prestige and wealth.


    The long-term consequences of this situation are hard to predict. Some economists
    say powerful AI systems could exacerbate inequality rather than create wealth
    for humanity. They could also widen the cognitive gap between rich and poor. Technologists
    generally believe that when AGI arrives, it won''t exist as an independent intelligent
    entity but will connect to our brains via neural interfaces. Elon Musk''s brain-computer
    interface company, Neuralink, leads this research; he hopes to one day implant
    brain chips in billions of people. He is also in a rush to achieve this.


    "We need to accomplish this before AI takes over the world." According to Musk''s
    biographer Ashlee Vance, Musk told engineers in 2023, "We need to go all in on
    this with extreme urgency." Musk believes that by implanting chips in brains,
    humans can avoid being destroyed by future superintelligence; thus, he hopes Neuralink
    will perform surgeries on over 22,000 people by 2030.


    But compared to runaway AI, bias is a more pressing issue. As more machine-generated
    content floods the internet, we don''t know how racial and gender stereotypes
    will evolve. Harvard professor of government and technology Latanya Sweeney estimates
    that within a few years, 90% of text and images online will no longer be created
    by humans. Most of what we see will be AI-generated. Now, to make ad revenue,
    thousands of articles are published daily using language models—even Google struggles
    to discern truth from fiction. When you search Google for famous historical painters
    or certain celebrities, AI-generated images have already infiltrated the top search
    results. The more AI-generated content proliferates online, the greater the risk
    of bias.


    "We are creating a loop: writing code, then amplifying stereotypes," says Abeba
    Birhane, an AI scholar who researches how Big Tech manipulates academic research
    and its similarities to tobacco giants. "This will be a major problem because
    there are more and more AI-generated images and text on the internet."


    Overall human well-being may also be affected. Twenty years ago, people worried
    cell phones caused cancer. Instead, they became addictive, causing us to spend
    hours staring at small screens daily instead of interacting with the world around
    us. Chatbots are likely to exacerbate this addiction. In November 2023, average
    users spent about two hours a day on Character.ai, developed by Noam Shazeer,
    chatting with avatars of celebrities like LeBron James or fictional characters
    like Mario, and role-playing. According to several market research firms, Character.ai
    had the highest user retention of any AI app at the time, and nearly 60% of users
    were aged 18–24. One view holds that Character.ai, like Replika, provides a conduit
    for fake romantic relationships and sexting. Although the company bans sexual
    content, users find workarounds; online forums like Reddit have posts sharing
    such techniques.


    "I usually talk to characters I create myself," said a US teenager who uses Character.ai
    for 5–7 hours daily but declined to name the characters. "I don''t know why I
    spend so long. I guess it''s a coping mechanism." They sometimes ask Character.ai
    for advice on getting over a breakup or doing homework. "Most of the time I just
    role-play."


    Character.ai is cultivating a new generation of users who constantly interact
    with chatbots. Shazeer has said Character.ai aims to "help millions, even billions"
    cope with the global loneliness epidemic, but as a business, it also needs to
    keep users engaged for long periods. If people start relying on AI companions,
    even becoming addicted, it could inadvertently leave many more isolated in the
    real world.


    Ironically, OpenAI may exacerbate these chatbots'' addictiveness. In early 2024,
    it launched the "GPT Store," allowing millions of developers to profit by building
    custom versions of ChatGPT. The higher the user engagement, the more revenue they
    generate. This engagement-based model is the most mature way to make money on
    the internet and the foundation of the so-called "attention economy." This is
    why almost everything online is free, and why the internet has become a "breeding
    ground" for conspiracy theories, extremism, and ad trackers. To earn ad revenue,
    YouTube, TikTok, and Facebook strive to keep eyes glued to screens, leading everyone
    from influencers to politicians to resort to sensationalism and provocation in
    a desperate fight for traffic.


    During the writing of this book, dozens of "girlfriend" apps suddenly appeared
    on the GPT Store. Although explicit rules prohibit software that fosters romantic
    relationships with humans, policing these rules is not easy for OpenAI. The most
    popular chatbots, like Character.ai and Kindroid, offer virtual companionship
    and dating experiences; one day, this may become as common as online dating.


    Another way AI developers maintain engagement is "infinite integration" into users''
    lives. Character.ai''s chatbots currently only remember about 30 minutes of conversation,
    but Noam Shazeer is leading a team to extend this window to hours, days, or even
    forever. "It can remember everything you say, if you want; it can remember your
    entire life, if you want," he said. He believes the longer a chatbot''s memory,
    "the more valuable it is to you." However, given the history of social media ad
    tracking, some of this personal data may eventually flow to tech companies or
    advertisers. As ChatGPT and similar bots build richer portraits of humans—our
    age, health, general outlook on life—they may usher in a new era of technological
    intrusion almost unimaginable today.


    To this end, a race to develop wearables is underway—devices that use LLMs to
    analyze our conversations with others. Tab is one such device. Built by a group
    of young, enthusiastic engineers in San Francisco, it is a round plastic disc
    with a microphone that hangs around the neck like a pendant.


    "It listens to all my conversations to understand my daily life context," said
    Tab developer Avi Schiffmann during a demo in San Francisco in late 2023. Schiffmann
    asked Tab what he had said at dinner the previous night; the "pendant" briefly
    summarized what it deemed the most important points and sent them to his phone.
    Schiffmann said he often talks to the device. "Late at night, I try to voice thoughts
    or worries from the day," he explained. "Maybe I should talk about Tom, or all
    my friends. It really identifies different speakers accurately, like a truly personal
    AI." It is hard to imagine how Tom and others would feel knowing their friend
    analyzes their conversations with AI every night; they probably wouldn''t feel
    reassured.


    Tab is expected to hit the market soon, joining a lineup of other wearables described
    as personal assistants that make daily life queryable. Just as Google pioneered
    an era of searching for information on the internet, retrieving facts via queries,
    and relying on web navigation, LLM devices will have the same impact on our daily
    lives—making every moment of everyone''s life queryable. Conveniently, we need
    to remember less and less, but this will also change the nature of face-to-face
    communication, because chats with friends and colleagues are suddenly formally
    recorded. If this life-querying technology sees widespread adoption, it could
    spell trouble for those living in over-policed communities. For instance, Black
    Americans are five times more likely to be arrested than white Americans, meaning
    law enforcement is more likely to mine their "life data" and analyze it with other
    ML algorithms to make unfathomable judgments.


    It is the innovators'' steadfast belief that has brought us this far, facing an
    uncertain future. Even with tens of thousands of engineers, Microsoft could not
    achieve OpenAI''s innovation; Google, overly protective of its existing business,
    failed to fully capitalize on one of its greatest internal inventions: the Transformer.
    Big Tech no longer innovates, but it can still act swiftly to gain strategic advantage.
    They learned from the mistakes of old giants like Nokia and BlackBerry. When the
    iPhone launched in 2007, these giants mocked it, then watched Apple devour their
    market share in just a few years. Big Tech knows it must "buy" innovation from
    outside; DeepMind and OpenAI are proof.


    Altman and Hassabis know this too, but their proposed new legal structures failed
    to prevent tech giants from acquiring their companies and dominating AI development.
    Mustafa Suleyman eventually left Google to found chatbot company Inflection, aiming
    to compete with GPT-4. He structured it as a Public Benefit Corporation, raised
    over $1.5 billion, hoarded powerful AI chips, making Inflection one of the most
    promising startups to challenge OpenAI and Google. Yet, less than a year later,
    Microsoft absorbed it. Perhaps to avoid antitrust scrutiny, the software giant
    hired most of Suleyman''s team (instead of acquiring the startup) and appointed
    the DeepMind co-founder to lead its AI work. This example perfectly illustrates
    how quickly Big Tech reasserts control, while raising the question of how long
    companies like Anthropic can remain independent.


    Other well-meaning entrepreneurs have tried to fight these behemoths, all failing.
    Take Neeva (an AI company). Sridhar Ramaswamy, Google''s former ads chief, disillusioned
    with his employer''s surveillance-based ad model, founded Neeva in 2019. A soft-spoken
    leader, he wanted to build a better search engine. Neeva made money via a simple
    subscription—no tracking, no privacy-invading ads. After ChatGPT launched, Ramaswamy
    had engineers work overtime to build a similar tool to summarize search results.
    He released it in early 2023—long before Google launched Bard.


    "Such technical breakthroughs create more room for competition," Ramaswamy said,
    clearly hopeful. At the time, Microsoft''s Satya Nadella was mocking Google, which
    looked like a relic of the past. Ramaswamy said: "Last year I was frustrated because
    it was so hard to escape Google''s grip." Now things had changed.


    But they hadn''t. Mere months later, Ramaswamy was forced to shut down Neeva.
    Google''s market grip was too strong. "When Google faced a crisis, our usage increased
    10x," Ramaswamy recalled. "But we knew the lead was temporary, because big companies
    throw thousands of people and billions of dollars at the problem."


    Even Bing, powered by OpenAI, struggles to survive. Data from StatCounter showed
    that by early 2024, Bing''s market share still hovered around a paltry 3%, barely
    denting Google''s dominance. The two giants are on a path to total victory, each
    with their turf: Google controls search, Microsoft dominates software, and both
    battle Amazon for cloud supremacy.


    Today, the cost of developing AI models has risen to a level almost no non-giant
    tech company can afford. Academia and small firms have no choice but to buy chips
    from Nvidia and rent compute from Amazon, Microsoft, or Google—and once on these
    platforms, they are often "locked in." AI startups often complain that once they
    build services on Microsoft''s or Amazon''s cloud, switching is extremely difficult.
    They also struggle to acquire the thousands of GPUs needed for tools like ChatGPT.
    Each GPU costs ~$40,000; buying them is as hard as scoring tickets to a sold-out
    stadium tour. As the primary GPU supplier, Nvidia has profited immensely from
    soaring demand. In May 2023, after Google, Microsoft, Amazon, Meta, and Apple,
    Nvidia became the sixth tech company to hit a $1 trillion market cap. Big Tech
    leads in tech development and AI by a wide margin. But the AI boom hasn''t opened
    a thriving market for innovative new firms; it has helped these giants consolidate
    power. They have tightened control over infrastructure, talent, data, compute,
    and profits. Undoubtedly, they will control the future of AI.


    AGI dreamers contributed to this too. In June 2023, Microsoft CFO Amy Hood told
    investors that services based on OpenAI tech would generate at least $10 billion
    in revenue. She called it the "fastest-growing $10 billion business in our history."


    Would it have been better if DeepMind and OpenAI had stayed independent, with
    boards designated to steer AI development? That carries risks too, as Sam Altman''s
    later saga proved. Suleyman, who left DeepMind to strike out on his own, said
    in an interview that big companies might be more trustworthy than small ones.
    After all, they answer to shareholders and employees. But Big Tech has an inescapable
    deep obligation to shareholders: they must grow every quarter. If profits stall
    or drop, share prices fall; capital dries up; executives and employees complain
    or leave. The terrifying "ghost of recession" looms. "These entities must grow,"
    a former Microsoft executive said. "AI is the solution."


    Hassabis believes DeepMind''s current structure makes more sense. Asked if he
    still thought AGI needed the ethics board he once championed, he said: "It has
    reached a level of maturity where we can improve people''s lives. Google is great."


    Altman insists that although OpenAI has become a for-profit company, partnered
    with Microsoft, and triggered the AI race, its principle of developing AI for
    humanity''s benefit hasn''t changed. He had no choice but to keep releasing AI
    tools to the public. "Deploying effectively is critical to our mission," he said.
    Otherwise, how would OpenAI learn? How would it give people useful tools like
    ChatGPT? Therefore, "we need to put the technology in users'' hands."


    At the current pace of this race, we cannot predict what will happen in the months
    or years after this book''s completion in March 2024. But these futures will be
    decided by the intentions of a few and the systemic power they wield. If you ask
    me whether Sam Altman, Demis Hassabis, Microsoft, and Google are trustworthy stewards
    of the AI future, my answer is we have no choice. Altman and Hassabis have tied
    their innovations to the world''s largest companies, whose internet influence
    is virtually inescapable in daily life. Thus, like history''s innovators, they
    have altered their ideals to keep competing and building advantage. The result:
    we have witnessed some of the most transformative technologies, but the price
    we will pay remains unclear.


    ## Acknowledgments


    This book would not have been possible without the support and encouragement of
    a circle of friends. About a month after ChatGPT''s public release, I pitched
    an idea to my agent, David Fugate: two men dreaming of building superintelligent
    machines, becoming rivals, and squaring off on behalf of Big Tech. David replied:
    "Great!" That kept me motivated for the next year. A spontaneous meet-up with
    Yanhoi McGregor at Nando''s also fueled my drive for this topic.


    Thanks to Claire Chick, Sarah Beth Harling, Elisa Rivlin, and all the wonderful
    people at St. Martin''s Press. Thanks to my editor, Peter Wolverton, who calmly
    pointed out the book should focus on how a handful of companies manipulate a transformative
    innovation. Pete (and you, dear readers) kept me from falling down irrelevant
    "rabbit holes" like transhumanism and effective altruism.


    I must thank Dr. Émile Torres, who brilliantly traced the roots of the AGI quest
    back to the dark history of eugenics, helping me understand the flip side of pursuing
    human perfection through machines. David Edmonds, Toby Ord, and Mike Levine provided
    guidance on longtermism, effective altruism, and the open philanthropy AI alignment
    ecosystem, respectively. Mike and I disagree on some themes, but I''m deeply grateful
    for his patience and time explaining his views. Bryan Evergreen in Seattle helped
    me better understand the AI ethics dilemmas inside Microsoft.


    Special thanks to Meredith Whittaker and Roelof Botha. Though from different worlds
    of tech (Meredith is President of Signal Foundation, Roelof is a partner at Sequoia
    Capital), they made me realize that the growing dominance of a few tech companies
    in AI is a problem for both society and business.


    I have acknowledged anonymous sources at the end of the book, but I still want
    to thank the many tech and AI practitioners—specifically those who currently or
    formerly worked at OpenAI and DeepMind—who spent hours sharing their experiences,
    often expressing deep unease about Big Tech''s AI monopoly and the new "move fast
    and break things" dynamic. I hope this book adequately reflects their concerns
    and all they shared with me.


    The editors at *Bloomberg Opinion* were incredibly supportive. Huge thanks to
    Tim O''Brien and Nicole Torres for their enthusiasm; they readily agreed to give
    me time off from my column to write this book, supplementing what I''d been hammering
    on about in my column last year. Thanks to all column contributors for their kindness
    and encouragement, for making the tech columnist job more fun: Dave Lee, Lara
    Williams, Lionel Laurent, Andrea Felsted, Therese Raphael, Matthew Brock, Howard
    Chua-Eoan, Chris Hughes, Chris Bryant, Marcus Ashworth, Mark Champion, James Hertling,
    Joe Przysucha, Mark Gilbert, Elaine He, Tim Culpan. Also thanks to Javier Blas
    for writing advice.


    Special thanks to my colleagues Tim O''Brien, Nicole Torres, Paul Davis, Adrian
    Wooldridge for sharp, useful feedback on the early manuscript, helping me see
    the perspective of readers outside the writing bubble. Some early readers not
    only told me what needed polishing or explaining but also supported me emotionally
    as friends during the process. Huge thanks to Miriam Zacarelli, Victor Zacarelli,
    Kali Seymore, and Kristen Petersen.


    Thanks to my neighbor and friend Catalina Montsinos, whom I affectionately call
    Catina. During my writing sabbatical, I got a quiet workspace at her home. Catina
    benefits from AI in real life. A painter who went blind at 40, she became a successful
    sculptor. She embraces every technology that helps her "see" the world, making
    full use of digital assistants like Apple''s Siri. At 80, I pointed my phone at
    a sculpture on her coffee table and had ChatGPT analyze its colors, shapes, and
    possible artistic influences. She listened quietly, looking amazed. "This is just
    wonderful!" she said. I hope AI develops toward filling information gaps, not
    replacing human work and creativity.


    Finally, this book would never exist without my family. Thanks to my father, Philip
    Withers, who never stinted on praise for my achievements, no matter how small,
    from childhood on. Thanks to Cara and Wesley for filling the house with laughter,
    and to Isla for caring about the manuscript and encouraging me. Thanks to my husband,
    Mani; I marvel every moment at how he holds the whole family together. He is my
    constant source of perseverance and patience, for which I am especially grateful.


    ## Note on Sources


    Thanks to the journalists and authors of articles from websites, newspapers, magazines,
    research papers, podcasts, and books whose outstanding work allowed me to draw
    on so many secondary sources (listed in the references).


    In this book, quotes in the present tense or attributed with "says," "recalls,"
    "reflects" come from my direct interviews with these individuals, including Demis
    Hassabis and Sam Altman. I also interviewed many former employees and insiders
    who chose anonymity fearing repercussions for speaking candidly. I am especially
    grateful for their trust.


    Due to space constraints, many interviews couldn''t be included, but they were
    invaluable for understanding the lives, work, and AI landscape of Sam Altman and
    Demis Hassabis. Many experts also helped me understand machine learning systems,
    neural networks, diffusion systems, and Transformers, translating them into readable
    language.

    '
