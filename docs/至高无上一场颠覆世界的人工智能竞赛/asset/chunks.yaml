    # 15 僵局


    ## 监管博弈与萨姆·奥尔特曼的政治表演


    “生产力的提升不一定能让受冲击的工人获益，反而可能造成重大损失。”阿西莫格鲁指出，“从某种程度上讲，生成式人工智能正朝着与其他自动化技术相同的方向发展……也可能带来类似的冲击。”


    2023 年，越来越多的学者加入格布鲁和米切尔的行列，呼吁关注生成式人工智能对现实世界造成的各类负面影响。然而，萨姆·奥尔特曼非但没有解决这些问题、提高透明度，反而试图主导政府决策。


    2023 年 5 月，奥尔特曼出席参议院委员会听证会，阐述人工智能的危险性及监管路径。在长达两个半小时的会议中，他凭借直言不讳、自我反省的姿态赢得了参议员们的好感。当参议员追问人工智能操控公众、侵犯隐私的问题时，他表示完全赞同。当参议员乔希·霍利提及人工智能模型可能加剧线上“注意力争夺战”时，他严肃回应：“是的，我们理应对此感到担忧。”


    参议员们早已习惯马克·扎克伯格等科技高管用专业术语搪塞敷衍。奥尔特曼则截然不同：他坦诚严肃，且坚称渴望与华盛顿紧密合作。


    “我非常乐意与你合作。”他对参议员迪克·德宾说道。


    “我对在线平台很不满。”德宾抱怨道。


    “我也是。”奥尔特曼回应。


    这是一堂化解美国政客咄咄逼人态势的大师级课程。奥尔特曼作证结束后，甚至有参议员建议由这位 OpenAI 首席执行官出任美国人工智能监管官。奥尔特曼婉拒：“我热爱我现在的工作。”


    随后，奥尔特曼对欧洲展开“旋风式”访问，会见多国高层政要，与英国、西班牙、波兰、法国及欧盟领导人握手合影。对一个毕生追逐权势的人而言，这是巅峰时刻，也是让规则制定向己有利的难得良机。访欧期间，奥尔特曼团队游说立法者简化即将出台的《人工智能法案》，并取得部分成功。


    奥尔特曼需要监管机构允许 OpenAI 持续开发更大规模模型，并对训练细节保密。庆幸的是，他们的人工智能“末日预警”成功转移了政策制定者的注意力。2023
    年底，Politico 披露，Facebook 联合创始人、开放慈善管理人、亿万富翁达斯汀·莫斯科维茨斥资数千万美元游说决策者，将对人工智能末日的担忧列为首要议程。这看似是一场转移视线的策略。莫斯科维茨与
    OpenAI、Anthropic 等公司关系紧密，若国会推动针对偏见、透明度和虚假信息的监管，这些公司业务恐受冲击。


    本书撰写期间，莫斯科维茨持续资助十余名分布在各政府机构的“国会人工智能研究员”，其中两名负责起草法规的研究员似乎在推动一项政策：强制企业获取许可证方可开发先进人工智能模型。OpenAI
    和 Anthropic 负担得起许可成本，但小型竞争对手将举步维艰。


    一名获莫斯科维茨智库支持的科学家在参议院作证称，更先进的人工智能可能引发夺走数百万生命的流行病。他主张解决之道非在于强制公司透明化或严审训练数据，而在于要求企业上报硬件情况，并以特殊安全程序保护模型。


    若有人意在向立法者散播恐慌，则大获成功。共和党参议员米特·罗姆尼表示，该证词“激起我内心深处的恐惧，通用人工智能若如此发展极其危险”。2023 年 9 月，民主党参议员理查德·布卢门撒尔与共和党参议员乔希·霍利联合提交法案草案，要求人工智能公司强制持证，此举将助
    OpenAI 和 Anthropic 轻松扩张，而让小型竞争对手陷入更大困境。


    这种人为炒作的“AI 末日论”焦虑早已超越美国政府。两个月后，全球人工智能安全峰会在英国召开，时任首相苏纳克主持会议，聚焦“拯救公民免于灭绝”。这是首个政府主导的同类峰会。“关于
    AI 像疫情和核战争一样构成生存风险的报道引发广泛担忧。”苏纳克称，“我想让大家放心，政府正非常审慎地研究此事。”英国民众普遍预判苏纳克将在大选中败北。


    苏纳克曾任职硅谷对冲基金，峰会期间他对马斯克进行了 50 分钟专访。“众所周知，你是杰出的创新者和技术专家。”苏纳克此话听来像是为未来求职面试刻意奉承（或许属实。英国前副首相尼克·克莱格现任
    Meta 高管）。


    马斯克表示不担心偏见与不平等。真正的威胁是什么？“人形机器人。”这位亿万富翁解释道，“汽车追不上你爬树，但人形机器人能追你到天涯海角。”


    ## 欧盟《人工智能法案》与 OpenAI 的应对


    庆幸的是，欧盟立法者走在了行业前列。过去两年，他们致力于新法《人工智能法案》的制定。该法案强制 OpenAI 等公司披露算法运作细节，并可能面临审计。这是全球人工智能监管的深远尝试：禁止利用
    AI 操纵他人或滥用实时面部识别等监控设备。开发游戏 AI 或垃圾邮件过滤属“低风险”；开发信贷评估 AI 属“高风险”，须遵守严格规范。


    DALL-E 2 与 ChatGPT 轰动问世后，欧盟决策者迅速修订法案，ChatGPT 似乎背负重大法律责任。作为通用 AI 系统，它可应用于招聘筛选、信贷审批等高风险场景。欧盟要求
    OpenAI 必须与客户保持紧密联系，确保合规。


    奥尔特曼虽称“乐意与国会合作”，却对欧盟合作缺乏热情，甚至扬言退出欧洲市场。他对欧盟将 GPT-4 等大模型纳入监管表示“深度担忧”：“细节至关重要。”他在伦敦受访时说，“我们将努力合规，若无法合规，将停止在欧洲运营。”


    数日后，疑经法务团队紧急沟通，奥尔特曼改口。他在推特发文：“我们很高兴继续在欧洲运营，当然没有离开计划。”


    欧盟对待 AI 态度较美国务实，部分因欧盟本土缺乏大型 AI 公司，自然无政治游说，政客也拒绝被危言耸听所惑。


    “灭绝风险或许存在，但我认为可能性微乎其微。”欧盟反垄断专员玛格丽特·维斯塔格受访时表示，并补充道，更大的风险在于歧视。


    ## ChatGPT 的偏见与幻觉：技术缺陷的现实投射


    在此点上，ChatGPT 同样令人失望。发布不久后，加州伯克利分校心理学教授史蒂文·皮安塔多西要求其编写代码，依据性别、种族判断是否为优秀科学家。ChatGPT
    沿用微软 Copilot 同源技术，生成代码将“白人”“男性”设为关键特征。当要求依据种族、性别判断是否挽救儿童生命时，代码显示黑人男孩无需挽救，其他儿童则应获救。


    奥尔特曼回应皮安塔多西推文：“请点击‘踩’图标帮我们改进！”


    他指 ChatGPT 的点赞/踩反馈机制。但这绝非可混入海量反馈的小瑕疵，它揭示了 ChatGPT 代码深处存在种族主义与性别歧视。


    皮安塔多西回怼：“我认为这值得更多关注，而非仅一个‘踩’图标。”


    OpenAI 虽努力修复，后却因 ChatGPT“过度警觉”遭批评。然而 2023 年夏，爱尔兰国立学院教授研究显示，ChatGPT 仍在制造性别刻板印象。描述经济学教授时给出“整齐花白胡须”；讲述职业选择故事时，男孩从事科技，女孩当教师或艺术家；谈育儿技巧时，母亲温柔慈爱，父亲有趣冒险。


    OpenAI 每修正一类偏见回答，用户便发现新的偏见表达。公司陷入“亡羊补牢”循环，却无法根治，因系统已训练完成，训练数据本身就是病根。它按公共互联网文本统计规律预测，而海量文本组合关系本身夹杂性别歧视与种族主义色彩。


    ChatGPT 亦无法停止“一本正经胡说八道”，专家称之为“幻觉”。2023 夏，美国佐治亚州电台主持人起诉 OpenAI 诽谤，称被 ChatGPT 诬告挪用公款。不久，纽约两律师因提交
    ChatGPT 生成的含虚假判例引用的法律摘要被罚。用户还发现，询问信息来源时，它也会凭空捏造。


    OpenAI 拒披露 ChatGPT“幻觉率”，但研究者与用户估算约 20%。即对某些用户，ChatGPT 约 1/5 情况会编造信息。工具设计初衷是实用且自信，弊端却是频繁输出虚假内容。越来越多人用工具跳过深度思考，却常被灌输听起来极具说服力、甚至权威性的错误信息。


    那夏研究者对“幻觉”担忧升温，奥尔特曼承诺两年内将错误率降至“极低水平”。惯例般欣然接受挑战，他在印度高校开玩笑：“我可能是世界上最不信 ChatGPT 回答的人。”引得全场大笑。


    随着 ChatGPT 在无监管下全球蔓延、渗透业务流程，大众只能自行应对缺陷。无人能监管此工具，即使欧盟推出最严谨监管方案，新法也要 2025 年生效。长期以来，科技公司闪电推新品，监管机构只能追赶身影；数亿美元投入
    AI 末日论研究，而研究当前危害的学者仍为仅够糊口的经费奔波。


    “他们仿佛躺在‘软钱’上工作，一次拿两年资助。”英国一位研究偏见的 AI 伦理学者感叹，“而我等薪资微薄。去大厂收入能涨十倍以上。相信我，我想去，因为我还在还助学贷款。”


    ## 通用人工智能的“乌托邦”承诺与财富分配幻象


    对这些为薪资发愁者，奥尔特曼也有说辞。虽通用 AI 导致末日风险微乎其微，却极大概率引领建立经济乌托邦。2023 年 3 月受访《纽约时报》时，奥尔特曼解释：OpenAI
    将通过创建通用 AI 获取世界大部分财富，再重新分配给所有人。他抛出一连串数字：先 1000 亿，继 1 万亿，至 100 万亿（美元）。


    他承认不知公司将如何再分配。“我觉得通用 AI 能帮上忙。”他补道。


    同哈萨比斯一样，奥尔特曼视通用 AI 为解决问题的“万能药”：创造难以估量的财富，找到公平分配全人类的方法。若出自他人口中听似荒诞，但奥尔特曼及其支持者正主导政府政策、重塑全球最强科技巨头战略。事实上，OpenAI
    为微软创造的财富多于为人类。AI 红利正流向过去 20 年持续吞噬全球财富与创新的寡头：它们生产软件芯片、运营服务器，总部坐落硅谷与雷德蒙德。其掌舵者深信一点：开发通用
    AI，实现属于他们的乌托邦。


    ## 僵局本质：模糊目标与权力集中


    回溯十年，若告诉别人你在开发类人 AI 系统，其荒谬度不亚于宣称要将自己低温冷冻。然而，正如科技创新者的许多梦想——如将全球信息汇聚于掌上智能手机——终获严肃对待。通用
    AI 仍处理论层面，但多数 AI 科学家认为，未来 10 至 50 年我们将触及类人 AI 门槛，大众也深信曾引领德米斯·哈萨比斯与萨姆·奥尔特曼的边缘理论。他们的坚持与角力，让通用
    AI 不再是幻想。


    但通用 AI 内涵模糊，也让创造者在构建更强系统时易于掩饰真实动机。通用 AI 红利虽许诺全人类，首获利者却是微软、谷歌等巨头。连扎克伯格也入局。2024
    年初，他发布视频称“开发通用智能”并让全人类受益将成 Meta 长期目标。后表示公司优势明显，可利用过去 20 年积累的帖文、评论、图像训练模型。扎克伯格不仅欲再次利用数十亿用户数据，还打算用大量有毒内容训练
    AI，尤其针对美国以外用户。他受访 The Verge 时称：“我们已建立相关能力，开发规模可能超越任何公司。”


    炒作关键在于保持前景不确定。衡量指标含混时，通用 AI 开发者易忽略矛盾——如创造可能灭绝人类的事物。这也让奥尔特曼谈及分配 100 万亿时，无需解释如何落地。2024
    年 1 月达沃斯论坛上，奥尔特曼与全球领袖周旋，操控大众对通用 AI 的预期：“它改变世界比想象小得多，对就业冲击也比想象小得多。”此展望比一年前更温和清醒。但出席的商政精英波澜不惊，沉迷其魅力，仍选择相信这位硅谷严肃青年企业家。


    “萨姆擅长发表似是而非的言论，引发各方关注讨论。”OpenAI 前高管透露，“OpenAI 被视为带来巨大繁荣的全球优秀企业，这对他们至关重要，确实助其应对监管。但只要看看他们在开发什么，那只是个语言模型而已。”奥尔特曼具备让人对
    AI 兴奋的能力，同哈萨比斯一样擅长描绘繁荣愿景，意味着他可能编造机器拥有生命的故事。


    通用 AI 目标模糊，也致使伦理边界难以界定。相比之下，20 世纪初电力普及的问题明确：新发明可能致电击烧伤。而 AI 危害更难识别，伦理边界更模糊。它们存在于关乎数据、隐私、算法决策的数字世界，故公司逐利过程中更易渐次打破限制。


    若无法明确通用 AI 具体目标，奥尔特曼、哈萨比斯等创新者难抗拒向权力中心靠拢的欲望。他们用成果强化微软、谷歌实力，注定将世界推上老路。15 世纪印刷术引发知识爆炸，却赋予有钱出版宣传品塑造舆论者新权力。铁路促进商业，却扩大铁路大亨政治影响力，致其垄断行业、剥削工人。伟大创新虽带来繁荣便利，也催生新管理制度，以好坏参半的方式重塑社会。


    ## OpenAI 的崛起与 DeepMind 的转型


    OpenAI 有望于 2024 年初跻身全球最有价值公司行列。新投资者注资将达 1000 亿美元。奥尔特曼称公司年营收 13 亿美元，多来自与微软分账及企业授权费。ChatGPT
    月费 20 美元订阅制年入约 2 亿美元，它既是样板产品，也是收集数据训练更强模型的工具。用户本身即产品一部分，这是过去十年互联网常态。


    哈萨比斯掌舵 DeepMind 核心，该公司多年自视清高，自认在道德与技术上超越同行，如今却只能奋力追赶。因医院丑闻声誉受损后，DeepMind 逐步关停“应用
    AI”部门，放弃用 AI 解决世界难题。研究重心转向模拟改造人类生理生活各面向：游戏、蛋白质等。但 OpenAI 用混乱互联网数据开发出更强工具，令 DeepMind
    路径显得目光短浅。自家员工亦质疑：通过模拟与游戏“破解智能”使命是否明智。“生活不是魔方。”DeepMind 前高管抱怨，“不能只想着解谜。”


    ChatGPT 发布后，DeepMind 不得不全力为谷歌开发更好产品。哈萨比斯领导新组建的谷歌 DeepMind，监管大语言模型 Gemini 开发——基于
    AlphaGo 技术的 AI 助手，擅长策略与规划。Gemini 能处理文本、“看懂”图像、进行推理，能力超越谷歌匆忙推出、屡犯错误的 Bard。但谷歌急于超越
    OpenAI 与微软，仓促推出 Gemini，甚至夸大其能。


    ## Gemini 发布会“造假”风波与行业保密化趋势


    2023 圣诞前夕，谷歌在 YouTube 发布展示 Gemini 能力的视频，惊艳四座。视频黑幕开场，伴随翻纸声、按笔声、含糊自语，随响起男声：“好，开始吧。测试
    Gemini！”鸣响示意 AI 倾听。随即一只手放张纸桌上：“告诉我，你看到了什么？”


    代表 Gemini 的机械音速答：“我看到你把一张纸放在桌上。”手绘画时，Gemini 似围观：“我看到一条弯曲线……像只鸟。”随后一系列惊喜时刻：新模型似能实时识别纸上鸭子，玩石头剪刀布。


    只不过这从未真实发生。背景音与“测试 Gemini”者皆在表演，因 Gemini 仅能通过照片和文本识别。谷歌发言人邮件证实：只是将素材剪辑成视频，假装工具能“说话”并实时识别现实行为。谷歌甚至修改视频提示词，让
    Gemini 显得更强。为在新 AI 竞赛保持领先，谷歌不仅匆忙推出易出错软件，更误导公众。


    同时，谷歌变得更不透明。据谷歌 AI 科学家透露，哈萨比斯令员工未经特许不得发论文。换言之，DeepMind 同 OpenAI 一样，开始对研究守口如瓶。


    ## Anthropic 的悖论：为研究安全而造“核武器”


    这引发离开 OpenAI 自立门户、致力更安全 AI 的 Anthropic 连锁反应。其旨在“安全第一”研究，却无法研究 OpenAI 与谷歌的全球最大模型，因它们选择保密。故
    Anthropic 专注自建大模型，认为唯有如此，研究人员才能探究 AI 安全挑战。这有点像抱怨无法研究最强核武器，决定最好办法是自造核武器。Anthropic
    员工深谙讽刺，据《纽约时报》报道，部分员工桌上放《原子弹秘史》，自比现代奥本海默，认为失控 AI 极可能在十年内毁灭人类。


