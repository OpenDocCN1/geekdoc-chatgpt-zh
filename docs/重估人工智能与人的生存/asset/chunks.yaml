- raw: '从人工智能的优势来看，前文叙述的“三大原则”（出发地到目的地之间的距离最短原则、出发地到目的地之间的路程所花的时间最短原则、交通线路网上运行车辆并行数量规模最大控制原则）所需的系统控制能力，基本都在人工智能系统控制的范围内，只要将现有的交通领域基础设施进行更换，使得数据的感知和获取能够及时、准确，嵌套进去的人工智能深度学习算法就能从根本上实现，并且这对于人工智能来说，算不上什么难题。出行做到了真正的舒适、便捷、畅通无阻。


    曾经，杭州是国内第五大交通拥堵城市。近日，经过在交通领域引入人工智能技术，目前杭州在交通拥挤名单中已经下降为第57名。对此，阿里巴巴就指出，这要归功于城市大脑发挥的作用，在杭州市通过路口摄影机获取的影像及汽车和巴士位置的GPS数据，平台将这些信息以人工智能（AI）进行收集和分析，切实防范和舒缓了交通堵塞的情况。


    ## 五、无人驾驶汽车上路：不仅仅是安全问题


    无人驾驶汽车上路，其安全系数大为提高。当人们都期待着各大公司迅速实现量产的同时，不可控的因素和非法故意而为之的安全问题仍然有待探讨。不可控的自然因素是不可避免的，也是任何交通出行方式都无法精准规避的。但是，值得注意的是，在今后的无人驾驶交通领域，除技术故障带来的突发性安全问题外，其余的安全性能的提升，大部分都要将注意力从技术上转移到对不法分子的关注上，以及对无人驾驶汽车的合法性的争辩——这就不得不涉及无人驾驶汽车的伦理道德与法律问题。只有构建一个包括法律和道德在内的健全的无人驾驶服务体系，才能助力实现其“零交通事故”的未来目标，或者换句话说，就是无限地逼近这一目标。


    分析无人驾驶汽车发展的伦理道德与法律问题，有助于探寻有效的无人驾驶领域的社会治理路径，而不仅仅停留在“以技术攻克技术难题”的层面上，从而使这项重大的人工智能技术在其商业化、实用化的道路上少走弯路，使其发展更健康、快速，更好地造福全人类。


    从技术漏洞被不法分子利用的层面而言，无人驾驶汽车的出路何在？说到底，无人驾驶汽车是基于数据的深度学习算法的智能化系统。既然是基于数据，那么，我们在即时抵抗别有用心的不法分子的入侵时，很容易处于被动状态。已有相关研究发现，黑客可以通过入侵车载系统，远程控制刹车和转向。同时，每辆无人驾驶汽车的信息均是整个大数据的一部分，数据一旦丢失、被盗取或遭遇黑客入侵，此类信息极有可能被恶意泄露或利用，这对于无人驾驶的打击是致命的，也是所有风险中最难以应对的。


    所谓黑客（Hacker），就是指计算机顶级高手，可以随意操控他人计算机的人群。他们也是计算机专家，一旦他们恶意操控公共的服务系统，损失将是不可预测的。例如，2018年发生的几起黑客事故，北美最大的面包连锁品牌Panera
    Bread发生数据泄露，受害人数为3700万人次；New Egg电商平台遭受网络犯罪团伙Magecart的攻击，受害人数为5000万人次；美国知名问答社区Quora遭到黑客攻击，受害人数为1亿人次……类似的攻击事件数不胜数，损失不计其数。如此种种说明，目前我们没办法保证在无人驾驶普及于城市的大街小巷时黑客能够“心慈手软”或者“回心转意”，只能尽最大努力保证无人驾驶系统的安全性。这也是目前无人驾驶需要回应的最为严峻的问题。


    2017年4月，英国埃克塞特大学无人驾驶汽车领域一位保险专家Matthew Channon就曾经写信给政府，称无人驾驶汽车将成为黑客攻击的下一个目标。这一警告引起专家们的注意。2018年5月，网络安全服务商360集团创始人兼CEO周鸿祎表示，在未来的无人驾驶领域，最担心的就是无人驾驶汽车被黑客攻击，在不经意间就被黑客劫持了。


    当然，无人驾驶遇上黑客问题，并不是无解的难题。一方面，我们应该相信黑客也是有良知的，就如以色列的Coindash公司被黑客盗取3.7万ETH（3200万美元），等其升值2倍后竟获黑客归还。另一方面，黑客最强劲的对手当然也是黑客，“天下熙熙皆为利来，天下攘攘皆为利往。”我们可以高薪聘请黑客作为无人驾驶领域的管理者。最后，在无人驾驶研究的领域，结合黑客技术进行软件设计，实现技术战胜技术性的恶意攻击。例如，韩国就已经开始着手布局了。根据外媒数据显示，韩国国家研究机构目前已经与嵌入式安全解决方案公司ESCRYPT、信息技术融合解决方案公司Han
    com MDS等科技公司合作，研发新型无人驾驶技术，用于阻止黑客对无人驾驶汽车核心系统的攻击\[5\]。


    在无人驾驶领域，无论是法律的滞后性还是黑客的恶意攻击问题，都在一定程度上反映了无人驾驶领域的发展挑战。虽然任务艰巨，但其巨大的发展优势也在不断地吸引着我们去勇敢地迎接挑战，攻克一个又一个无人驾驶难题。那么，在国内，我们在伦理、道德和法律等层面又该做些什么准备，才能更好地迎接这样一个出行便捷的时代呢？


    首先，要健全相应的法律伦理规范。无人驾驶汽车作为新兴的人工智能技术潮流，具有无限的生命力，而要把其生命力最大限度地激发出来并使其更好地服务于人类，必须把发展人工智能技术与健全法律与伦理规范有机结合。在这个高度依赖科技的社会，唯有技术和规范相配合，才能使维护公序良俗和追求科技发展相得益彰，才能使技术真正地为人类服务。在这一点，由于西方国家比中国更早地进行了技术与法律等相关领域的探索，国家间的交流与沟通，甚至国际的统一标准的探讨都应该纳入无人驾驶汽车发展的议程之中。同时，要把无人驾驶汽车相关的审批、标准、违章、保险等子领域都涵盖进立法视野殊非易事。而一个足以颠覆现存世界的技术的发展，理应由各个国家、企业、社会组织携手合作、互通有无，共同探索立法善意与各方责任的界定。因此，以前瞻性的眼光，健全与无人驾驶相适应的法律和伦理规范已成必然。


    其次，要建设合乎要求的智慧城市。无人驾驶汽车对于智能化的城市建设提出了更高的要求。道路建设、能源供应、制度管理、交通规则等现行的城市道路文化，都面临着必须适应驾驶工具智能化做出改变的巨大挑战。需要政府在大力推进智慧城市建设中应坚持走高新科技路线，借助市场力量和开放、高效的交流，提高智慧城市的建设效率；需要企业肩负起自己的社会责任。智慧城市建设需要各行各业努力实现跨界整合，打破信息孤岛和智能孤岛的隔阂，实现信息资源、智能技术、文化理念的协同共享，在实现效益最大化的同时兼顾对社会的回报；需要坚持机制体制创新，推进智慧城市建设要一手抓新技术应用，一手抓体制机制创新，充分利用新一代信息技术，发挥“互联网+”和“智能+”的动力引擎作用，只有建设了相应的智能化城市，无人驾驶汽车的发展才会有肥沃的土壤，无人驾驶才能又好又快地惠及人类。


    最后，要建构适应智能时代的文化。无人驾驶汽车技术作为弱人工智能的一个方面，要服务于人类，还必须与人文理念相结合，建构适应新时代的智能文化。在发展人工智能技术时，要坚持高扬人的主体地位，做到以人为本，处理好人与机器、人与科技，以及价值理性与工具理性、技术可能性与伦理合理性之间的关系，尤其要把科学精神和人文精神有机结合，“把技术的物质奇迹和人性的精神需要平衡起来”；应当在大众文化中推广对无人驾驶汽车的正确诠释，以免大众由于对新兴科技的无知，而陷入恐惧的境地。例如，无人驾驶汽车可以选择知名的人物来试驾，以抓住大众的眼球，扩大无人驾驶汽车的影响力，并通过视频、图像、文字的数据资料来宣传其成果。要发挥无人驾驶社会组织的学术能力与技术控制作用。积极研究与无人驾驶汽车相关的技术、法律、伦理等问题，始终坚守住惠及大众的立场和以人为本的出发点，做到无人驾驶的发展要适应时代的人工智能文化。


