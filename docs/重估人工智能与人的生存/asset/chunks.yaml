- raw: '综上所述，人工智能技术的发展经历了“三起两落”的过程，有寒冬也有春天。在人工智能崛起之际的发展成果喜人，但在人工智能的“寒冬”里，我们也不能忘记那些依然在默默坚守、辛勤耕耘的人们，正是他们坚韧不拔的科学探索精神和不畏艰难的求知精神，才使得人工智能技术逐渐发展完善，并最终在世界范围内掀起了新的人工智能狂潮。


    2019年3月27日，为人工智能的发展奠定基础的三位计算机科学家，被授予了该领域最高的荣誉——图灵奖。当天，美国计算机协会（ACM）宣布，把2018年的图灵奖（Turing
    Award）颁给多伦多大学名誉教授兼谷歌大脑人工智能团队的高级研究员杰弗里·辛顿（Geoffrey Hinton）、纽约大学教授兼Facebook首席人工智能科学家杨立昆（Yann
    Le Cun），以及蒙特利尔大学教授兼人工智能公司Element AI的联合创始人约书亚·本吉奥（Yoshua Bengio），三位获奖者将分别获得100万美元的奖金。


    每次人工智能崛起，除众多学者的潜心研究外，国家政策的大力支持也起着重要作用。2019年3月5日，国务院总理李克强在政府工作报告中首提“智能+”。报告指出：为推动传统产业改造提升，要围绕推动制造业高质量发展……打造工业互联网平台，拓展“智能+”，为制造业转型升级赋能。而人工智能一词，更是连续三年出现在政府工作报告中，成为促进新兴产业加快发展的新动能。


    随着人工智能革命的深入推进，新一代人工智能技术与产业模式的影响力和渗透力异常强劲，无论是人们的生产、生活还是思维方式，都受到强烈的冲击，甚至是颠覆性的改变，从而对人类的生存和发展产生深远的影响。


    在经历了“三起两落”后，人工智能的发展日趋完善，未来可期。知名作家、发明家、数据科学家与谷歌工程师雷·库兹韦尔（Ray Kurzweil）曾预言：“在21世纪20年代中期，人脑反向工程就会成功，人脑的所有秘密就会被揭开；21世纪20年代末，计算机就能达到人脑智力水平；2045年，奇点到来，基于计算机能力的大幅增长，成本的大幅下降，人工智能创造物的数量将是整个人类智慧创造物数量的十亿倍。”与此同时，耶鲁大学和牛津大学的相关人工智能研究员对352位人工智能领域专家的采访中得出结论称：“人工智能到2060年前后有50%的概率完全超过人类（总体趋势如图1-5所示）。”


    总体而言，若是如上关于人工智能的预言最终能够全部实现，那么要不了多久，人工智能不仅可以令人类实现永生，而且可以将人类从工作中解放出来，届时人们需要处理的最大的问题将是人工智能与人类智能的关系问题——人机关系问题。人类需要从事的活动将是完全致力于谋求独立、自由与解放，完全投身于自身思维的锻造和自身极限的挑战。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt001_7.jpg)


    图1-5　人工智能如何超越人类


    在人工智能的未来发展中，人类需要未雨绸缪，慎重审视人工智能对人类生存和发展的影响，并加强治理创新，及时做好相应的风险防范。“凡事预则立，不预则废。”人工智能的未来，虽充满着诸多不确定性，但其存在的巨大智能优势对于人类而言是极具历史意义的。


    ## 四、影响分析：本书的目的、内容和结构


    随着数据挖掘和存储、数据传输、智能机器人、语言识别、图像识别、自然语言处理、区块链、边缘计算等技术的迅猛发展，单个的技术突破逐渐由“还原主义”向“整体主义”进发，并以“迅雷不及掩耳之势”推动了人工智能革命的到来。如同以往的数次科技革命一样，人们还没来得及做好充分迎接的准备，人工智能就已然渗透到人类生存的方方面面，已经并将继续对人类的生活形态、精神世界、发展空间产生或积极或消极的“双重”影响。但不管怎样，人工智能是“利大于弊”的，它正在以其强大的技术优势“成了一种力量，一种生机勃勃的精灵”\[3\]，重塑着人类生存的一切，甚至包括人类本身。


    人工智能是人类智能的模仿，模仿的目的是人类希冀将自身从繁杂、重复的“线性劳动”中解放出来，从而有更多的时间和空间去探寻生命的价值和意义。因此，从这个层面来看，人工智能革命却又是与以往的数次科技革命不一样的，因为它是在重塑着一切。随着人工智能技术的深入发展，模仿的技能日渐精进，在人工智能领域数年的开荒与深耕，历经大起又大落的悲凉，最终迎来了第三次人工智能的崛起，才使得人类开始真正体验到“吹尽黄沙始到金”的喜悦。


    人类从游牧时代开始，经历农业时代、工业时代和信息时代，如今正大踏步迈向智能时代。这个漫长的过程，也是工具的演变与进化的过程。在整个认识自然与改造自然的人类历程中，人们渐渐明白，从某种程度上来说，工具的先进程度决定了某个文明的先进程度。正是顺着这个思路，以往的科技革命逐渐将人类带入“工具理性”的迷途，逐渐遮蔽、消解和否定了价值理性，财富的追求剥夺了其原有的价值意义和功能，出现了工具理性单向发展的格局。于是，现代社会中，经济动力逐渐占据了主导地位，精神动力则日益衰竭。归根结底，这一切都是科技革命的“物化思维”在从中作梗，是人类被捆绑在“线性劳动”中而促成“单向度人”的恶性循环。德国社会学家马克斯·韦伯强调，“理性化”是现代社会的基本特质。但是，在我们看来，这个“理性化”的特质还必须对其进行重新定义，赋予其“工具理性”与“价值理性”的双重意义，不能把绝对的领先地位留给“工具理性”，否则无法促进人类的全面自由发展。


    基于这个宏大的愿景，需要重塑人类的生活形态，充盈人类的精神世界，拓展人类的发展空间。有一个首要的前提就是，要将人类从繁杂劳动中解放出来，将自由还给广大人民群众，使他们获得更多的自由时间，实现美好生活的向往。这就不得不诉诸与人类智能紧密相关的人工智能。正是由于人工智能技术的应用日渐广泛，使得宏大的愿景得以与具体的实践相结合，人类的未来生存形态势必将发生翻天覆地的变革。弗洛伊德认为：“人若是集中注意力，心理活动中的意识即能察觉，而不符合社会道德和主体精神的潜意识则无法进入意识。”\[4\]因此，我们有理由相信，只要人类彻底从“线性劳动”中解放出来，获得可以自由发展的自由时间，人们将会有更多的时间和精力，去投身于符合社会道德和主体精神的潜意识活动中，定能达到“学以成人”和“学以御物”的人生新高度。


    本书着眼于当下人们的现实生活正在被智能化的大背景，以及怀着对人工智能相关的人类生存的美好未来的憧憬，踏上了追寻人工智能重塑人类的生存形态的现实征程。


    本书对人工智能时代人的生存（如生活、精神与发展）所涉及的重要方面，如购物、医疗、出行、情感、社交、隐私、教育、就业、人机关系等进行了初步研究和价值探索，对各个不同领域所涉及的典型案例、伦理论争、人机关系危机、人际关系冲突、人的尊严与价值、人工智能的优越性等进行了思考。本书结构如图1-6所示。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt001_8.jpg)


    图1-6　本书结构


    不难想象，今天的人工智能对人的生存的诸多影响，既有有利的一面，也伴随着不利的一面。人们在今天及未来的生存过程中，无时无刻不在或主动或被动地与人工智能之间建立起这样或那样的关系。由于这种关系的“双重属性”，使得人类如何辩证地看待人与人工智能之间的关系成了人工智能时代的终极议题。对这个问题的不同回答，将会对人工智能的进一步发展和人类在智能时代的生存产生不同的影响。


    因此，本书从人工智能与人的生存这个大的命题出发，围绕人工智能对人的生活、精神和发展的重塑这三个维度而展开，进行各自相互独立的板块叙述。在对人们日常生活中的人工智能应用的一些困境和出路进行分析探讨的同时，带有一定的人工智能伦理与价值普及的目的，以化解人工智能时代人们“不能承受之轻的存在主义焦虑”，从而促使人们以更加积极的心态、更充分的准备应对人工智能时代的到来。


    在新时代，人工智能不能仅成为少数专业人才的“独舞”，而应该是人民群众的“共舞”。但由于人工智能专业技术与理论类书籍绝大多数是非专业人士很难读懂的，这对于人工智能知识的传播无疑是不利的。本书与人工智能的专业技术、理论类书籍不同，其写作并没有将笔墨的重点放在对人工智能的技术探讨上，而是聚焦于启迪公众能够形成对智能时代的理性看法，激发读者的创造性思维，培养读者的智能素养，从而更好地在智能时代生存和发展。


