    ## 二、社交的变革：人工智能对人际交往的冲击


    回首过去，短短几年时间，我们经历的变革却是前所未有的。十年前，我们都在期盼“阿德的梦”早日成为现实，从而能为我们联系远在异乡的亲朋好友提供“千里眼”和“顺风耳”——可视电话。可视电话可以称为人工智能社交的雏形，它在拉近人与人之间距离的同时，还能给人们一种近在眼前的“现场感”，极大地拉近了人们的社交距离。然而，这个梦想却迟迟没有到来，从20世纪五六十年代提出可视电话的概念开始，一直到21世纪初，由于受多方面技术因素的限制，它还只不过是书本中的一种称为梦想的东西。


    但是，就今天来说，这一切都变成了现实。人们只需要一部智能手机或一台计算机，便可“足不出户知千里”，便可实现与身在异域的亲朋好友的可视对话。不仅如此，人们还可以随时随地运用互联网媒介，进行实时社交——人工智能社交，就像彼此从未有过空间距离一般。


    正是这种极为便利的人工智能社交环境，加上交通运输业的快速发展，人与人之间的商品互换关系从“集镇”走向了“全球市场”，使得不同地域之间建立了友好的商贸往来关系，弥补了各自某方面的物资匮乏的缺陷。这种基于人工智能的社交打开的新世界的大门，使人与人之间的沟通联系与商贸往来的效率和质量大为提升，远远超出了前人的想象，可谓是前无古人。


    人工智能社交建立的商贸往来关系，最为突出的两个领域体现在网红经济和社交电商。根据《2018年中国网红经济产业发展现状分析报告》显示\[2\]，我国网红经济发展呈现持续增长趋势，仅在2018年，国内在线直播市场规模就达676.6亿元，相较于上一年增长了49.3%。该报告还预测，在2019年和2020年，国内在线直播市场规模将分别达到893.8亿元和1120.9亿元（见图7-2）。可见，随着越来越多的人加入网红行列和不同的用户类型的持续增多，网红社交平台的经济效益将持续增大。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt009_2.jpg)


    图7-2　2016—2020年中国在线直播市场规模及预测


    在人工智能社交电商领域，其经济规模更是远超网红经济规模。根据艾瑞咨询的数据显示（见图7-3），2018年中国社交电子商务市场交易规模为28.1万亿元，同比增长17.4%，虽然总体的增幅有所放缓，但交易的规模还在不断增加。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt009_3.jpg)


    图7-3　2012—2019年中国社交电子商务市场交易规模及预测\[3\]


    由此可见，人工智能社交对于经济领域的冲击是巨大的，传统的商业领域如果不进行商业变革，改变传统的经营网络方式，就很容易被新型的人工智能社交关系网络所替代。换句话说，在人工智能时代，就网红经济和社交电商而言，传统领域与新兴领域的竞争是基于一种社交关系网络的竞争，谁更能从社交的领域切入顾客的生活空间，谁就更能赢得顾客的支持。


    在今天的社会大环境下，由于其巨大的经济潜力，人工智能社交已成为未来社交经济的发展大趋势，企业家们都在试图从中创新和丰富其社交手段。亿欧的副总裁由天宇就曾表示，特别资深的互联网从业者普遍认为，现在的微信已经处在绝对成熟期，希望可以在未来微信的衰退期抓住用户红利，决定产品命运的关键是网络社交发展的大趋势。这里的网络社交大趋势正是人工智能社交的大趋势，在大数据、人工智能时代，“人工智能+社交”的社交方式的变革，对人们的社交产生了重要影响。


    在未来的发展趋势中，人工智能社交产品能让我们的朋友圈重新建立连接，大家既可以拥有一款像微信一样的长连接的社交产品，也可以拥有基于场景应用需求的短连接的社交产品，这样能更有效地降低不同用户在不同应用场景中遭受的社交风险，从而可以在更大范围内解决人们在人工智能社交领域的匿名化倾向和隐私遭到侵犯的问题。


    人工智能社交对人类的冲击远不止于此，还会继续向其他领域延伸。自从阿里巴巴推出芝麻信用后，众多网友调侃：“将来丈母娘招女婿，不是看你有没有房子，而是看你的芝麻信用有多高。”这不禁激发更多的疑问，未来丈母娘招女婿真的会看芝麻信用吗？对于这个问题的答案，我们可能无从知晓，还需要留给时间去回答。但是，可以确定的一点是，人工智能社交的确对人们的网络婚恋社交产生了影响。


    2002年，Facebook和Myspace这两家大型社交软件还没有诞生之前，全球首款主打社交网络服务（SNS）的Friendster一经上线，就迅速受到用户的热烈追捧。这个现象的出现，激发了当时正在加州大学伯克利分校留学的郑毅（百合网、ObEN的联合创始人）的创业灵感。2005年，百合网（国内大型婚恋网站）正式上线。百合网上线之后，郑毅一直在思考一个问题：为什么各大社交网站均有类似痛点——老用户登录一次后，发现没有人跟他联系，便失去了再次登录和使用产品的兴趣，从而导致用户的流失率很高。


    为了能够实现用户的实时互动，最终，百合网计划采取在平台塑造虚拟用户的方法来弥补这个缺陷。这个方法就是利用人工智能技术，将用户的数据（包括外貌、年龄、声音等）进行汇总分析，进而在平台上形成一个虚拟现实的人物图像，当别的用户登录平台时，无论该用户在不在线，与其相应的虚拟人物就会按照他的生活习性及对话特征与别的用户进行互动。


    为了将这一技术变成现实，2014年，郑毅和Nikhil正式创立了ObEN。在这个平台上，用郑毅的话来说，“拍一张自拍照，录几段声音，一个长相、声音都和你相似的虚拟形象就做出来了”。为了进一步保证用户社交的质量，这个平台还必须解决的一个问题就是用户的真实性问题，人们都希望在人工智能社交软件上与自己聊天的那个人能够代表现实中的个人。


    一种新的技术——区块链的引进可破解该难题。由于这一技术的运用，平台用户的身份确权得以唯一，从而使大家能够放心地跟人工智能的“他/她”互动。相较于过往的传统互联网社交网站而言，如今的社交平台都被赋予了人工智能化的特质，变得更加安全可靠和智能。所以，称当下是一个最好的时代也不为过。


    我们生活在一个社交最好的时代，因为人工智能社交为我们带来的便利是前所未有的，但也不得不说我们生活在一个社交最坏的时代。


    根据中新网2018年9月29日综合报道，继曝出8700万用户数据泄露丑闻后，Facebook网站再次遭到黑客攻击，近5000万用户的数据发生泄露，这是一个令人汗颜的事实。在人工智能社交时代，人工智能技术的成熟有其荣光的一面，也存在其不利的一面，若是全人类能够达成共识，固然能够形成全球人工智能社交的新格局。但若存在“难以撇清的利益纠葛”，这期间的变数就非一家之努力所能把控，足以可见人工智能社交的“威力”！


    生活在这个时代的人，在短短数年时间，从“鸡犬之声相闻，老死不相往来”的古代社交，到“千里之外，足不出户识生客”的人工智能社交，正经历“数千年未有之大变局”。千百年来祖先的梦想正在被我们这一代人实现，我们也正在经历着他们从未遭受过的“忧思”。对“最好的时代”，我们应该积极投身社会；对“最坏的时代”，我们应该做好“打硬仗”的准备，积极探寻人工智能社交良策，稳健迈入人工智能化的人类社交新时代。


    ## 三、未来的“大社交”：人类社交的人工智能化


    如果你感觉前文所述的人工智能社交对于个人而言没有多大的吸引力，那么接下来的论述我们相信你定会沉迷其中，以至于不得不思考，应该如何在未来的人工智能化的人类社交的畅想中加入必要的技术限制，从而防止未来的人们因染上“人工智能社交瘾”而遭受不必要的人际损失。


    在上海举行的“2018世界人工智能大会”上，腾讯董事会主席兼CEO马化腾与会发言称：“人工智能技术的发展，正在通往大社交的时代。”“目前连接人与人的极限就是几十亿个节点，但是，如果连接人与物，也就是把我们与常用设备实时有效地连接起来，那么我们的节点规模将会增长到几百亿的量级。”“人与物、人与服务的连接，关键就在于人工智能。可以说，整个人类的朋友圈规模将会从几十亿扩大为几百亿，甚至几千亿。这就是我们所说的‘大社交’时代。”

