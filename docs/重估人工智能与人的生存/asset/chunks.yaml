    \[1\]广州日报.超先进外科手术机器人竟能缝合葡萄皮［BL/OL］.https://www.guancha.cn/Science/2015\_05\_12\_319165.shtml.


    # 第四章　购物：人工智能与新零售的崛起


    新零售的崛起：合力推动的结果


    “前所未有”的购物体验：这是怎样的感觉


    “智能+”时代的零售业：新与旧对峙的启示


    新零售的头号劲敌：隐私泄露的综合治理


    新零售是基于大数据和智能技术的产品与服务的销售，是零售与消费者最佳体验的链接，更是贴近于消费大众之“心”的零售。在“人工智能+零售”的时代，“货比三家”已经发展到可以轻松完成“货比三十家”，消费者的购物体验正在走向极致。体验来源于技术，更来源于零售商对消费者的敏锐洞察，体验更加趋向于细节化、个性化。在智能时代，谁能掌控消费者的个性化情绪体验，谁就将在与传统零售业的对峙中胜出。


    ## 一、新零售的崛起：合力推动的结果


    零售是指基于货币为中介的生产者与消费者的商品交换活动，是商品离开流通领域进入消费领域的一般过程，是与批量销售（“批发”）相互补充的销售形态。严格来说，零售是继批发链条后的分销链条，消费者的身份从零售商演变为“以实用为准则”的消费个体。当商品进入消费个体占主导地位的消费领域，商品基本上不再流入市场进行二次交换。但也存在特殊情况，如果商品非常耐用或者消费个体在消费该商品后发现，其实用性能够被更好的商品所取代，那么，通过特定的商品的二手交易渠道，商品可以再次流入市场，这要得益于便捷的网络，使之成为可能。


    零售自诞生至今，主要经历了三种形态。最原始的一种零售是基于面对面的物与物的直接交换。在这个交换过程中，消费者扮演两种角色：一种是消费者角色，作为消费个体，当物品交换成功后，他们将成为货物的主要消费者；另一种是零售商的角色，这个角色的根源在于，在商品交换的过程中，由于没有一般等价物作为交换媒介，所以，他们只能将自己的商品拿去与他人进行交换，其中不仅充当了消费者的角色，同时也是在销售自己的产品。


    第二种零售形态是面对面的“商品—货币—商品”的交换。随着社会生产力的发展，最原始的商品交换形态的缺陷日渐突出，人与人之间的商品交换的困难越来越大。恰好在这时，一种新的一般等价物的出现，改变了第一种零售的销售格局，零售的形态过渡为以一般等价物（货币）为中介的面对面交换。生产力的发展使社会的消费品越来越多，人们的消费需求开始增加，对新的消费品的需求激增，但已积累起来的消费品只是单方面需求的满足，不能顺应消费者更为多样化的需求，因此就不得不求助于零售商。找到零售商时，消费者可以使用货币向其购买需求商品，也可以通过卖自己的物品给零售商，再将货币用于购买其他的消费品。


    在零售过程中，面对面的零售形式变得丰富起来，加上原始的物物交换的零售形式，消费者在其中扮演的身份是两重性的，消费者在面对面消费的过程中，也是零售商与零售商的面对面。但是，在后一种以货币为中介的零售形式中，面对面的零售增加了新的形式——独立的零售商，使得零售活动发生时，消费者与零售商的面对面也加入进来。


    第三种零售形态是网端对网端的“商品—电子货币—物流—商品”的交换。互联网的诞生并没有直接导致第三种零售形态的产生，而是由于技术、需求、文化和市场等因素的影响，特别是电子货币的发明创造，为此种零售注入了“鲜活的灵魂”，才使最新一轮的零售形态得以产生。正是以互联网平台作为载体，电子货币得以充当现实一般等价物的职能，电商、微商开始崛起，并且持续到今天都仍然占据着较大的市场份额。互联网电商是网络“流量经济”的代表，而微商是网络平台“熟人生意”的代表，两者在交易的形式上，已经是对以往的零售方式的变革，但也存在一定的“缺陷”。


    微商是做熟人生意的，存在流量不足的问题，限制了消费空间。并且，在销售的过程中，如果存在带有“脾气”的交易，则会严重影响零售商的口碑，甚至永远失去消费者的信任。同时，微商和电商又都存在假货问题，由于端口对端口的零售方式，人与人之间的面对面交易的方式被替代，加之消费者维权困难等问题，少部分不讲信用的零售商趁此机会，开始兜售假冒伪劣产品，大大影响了消费者对于第三种销售形态的信心。


    但是，不得不承认的是，第三种零售正是本书探讨的新零售的雏形。随着这种零售技术（支付技术、安全技术、物流技术等）的不断发展，线上销售与线下销售共存，零售与物流结合。2016年10月13日，在阿里云的云栖大会上，阿里巴巴董事长马云正式将此种零售形态概括为“新零售”，他还在演讲中进一步强调：“未来的十年、二十年，没有电子商务这一说，只有新零售。”自此，一种处于第三种零售形态末端的新型零售诞生了。


    之所以没有将新零售归纳为第四种零售形态，是因为这种零售的形式只是第三种形式的升级改进，而没有出现革命性的变革，所以，在此将之归结为人类诞生以来的第三种零售形态。


    第三种零售形态具体包括三个元素：一是微商；二是电商；三是新零售。新零售是微商与电商的优化组合，具体包括实体新零售、网络新零售、整合新零售等。通过微商与电商分析，能够更好地理解新零售“新”的妙处。


    在新零售到来之前的零售，其存在的弊病不单是安全技术的问题，还存在人为的问题和信息不透明的问题。在新零售到来前，生产商、零售商和消费者的信息都是不透明的，整个零售链条也是“脱链式”零售。零售商品流通的各个环节是相互独立的，由生产商、零售商和消费者共同构建的零售生态链具有不稳定性，商品的生产很大程度上由价格支配，很容易导致零售商品的进货超过消费者需求而导致商品过剩。但是，对于某段时间内价格低迷的商品，由于下个季度的消费者需求增加而导致供不应求。总的来说，这种“脱链式”零售，其信息不透明很容易造成问题，各个消费环节的层层盘剥对于消费者而言更不是一件好事。


    那么，回到新零售领域，其服务链条又是怎样的呢？为了改进第三种零售模式初期的弊病、降低零售成本、提高零售服务质量，也为了能够更好地提高消费者的购物体验，新零售得以诞生。新零售与传统零售领域相比，倾向于无人化零售，全程基本由大数据、人工智能系统和物流网在发挥指导和规范作用。整个零售链条，从线上到线下，再到物流领域，都是全线追踪，一件商品的“来龙去脉”全都是透明化的，既有利于商品生产商和零售商之间的加工订货的沟通交流，也有利于零售商与消费者之间形成良好的默契。在新零售领域，随着技术的进一步完善，透明化的零售信息对于整个零售生态链条都是有利的，可以有效避免过往的“脱链式”销售模式存在的弊病。


    任何一种商业模式的变革，都是多种因素在背后共同推动的结果，新零售也不例外。为什么在2016年之前人们不提新零售？并不是因为新零售这个概念没有诞生，而是很多客观的环境和条件还不成熟。但是，就当下而言，绝大多数零售行业都在布局新零售，导致新零售的崛起。经过上述对比分析，新零售的崛起透露出一种新生事物不可阻挡的发展趋势，但这只是崛起的部分原因，还有必要继续对其崛起的原因进行多维度的分析。


    第一，技术的发展。新零售的崛起，离不开物联网、大数据、人工智能技术的支持，并且技术在其中扮演着基础性的作用。新零售要关注的核心元素是消费者、商品、平台或者店铺。如果能恰到好处地处理好这几者之间的关系，那么新零售的优势就能最大限度地体现出来。鉴于传统的零售在处理这几者的关系时恰好遇到瓶颈，将新技术引进新零售行业就显得尤为必要。


    新零售的“新”表现在全流程、全渠道的可感知，可感知又得益于物联网、物流网、大数据、人工智能技术的运用。传统的零售为了理顺多方关系，需要众多员工分工合作，不仅效率不高，运营的质量和效益还受损。各个环节的“脱链式”状态，需要人为将之连接起来。但是，拥有高新技术的零售企业正在打破这种阻隔，通过智能化、系统化、数据化的零售，开始逐步过渡到新零售领域，开始形成线上线下服务相结合、物流送货上门的零售新格局。在这个过程中，原本需要人为“跑路”的诸多细节性、复杂性的工作（不同的消费者消费不同，订单零散分布，仓库管理极端复杂），现在全部整合到以大数据、人工智能技术为支撑的新零售系统中，零售变得有章可循。全渠道、全流程的智能感知，助力实现运营共享，对分散的订单和不同的物流仓储模式进行集中管理，同时改善传统系统分散分离的状态，增强每个销售环节之间的联系，赋予了零售以机动灵活的特点。


    在新零售技术系统中，通过整合商品进货、库存、销售、消费者等数据，打通了线上线下的交易壁垒，形成了以顾客为中心的全渠道、全流程零售应用场景。当消费者进入一家新零售店铺时，零售数据系统便开始运作，以物联网技术为基础的商品独特标识码、货物仓库识别，以人工智能技术为基础的人脸识别、智能订单，以支付技术、安全技术为基础的支付手段，以物流技术为基础的智能送货，把该消费者的整个消费过程进行了智能化标记，从商品挑选、订单生成、完成支付、取走货物的整个过程，全部是依靠技术手段来辅助完成的，单个人的消费数据可能对于某个大型零售商没有太大用处，但是当这些数据无限地积累，便开始反馈它的整个零售情况，并指导零售商进行决策部署。


    第二，需求的契合。经过多年的发展，互联网、大数据、人工智能技术逐渐完善，“互联网+”“大数据+”“智能+”的模式不断产生，这与80后、90后的互联网原住民是密不可分的。随着社会生产力的发展，在温饱问题解决后的社会大背景下，他们的需求日益呈现多样化、个性化特征。如今，他们已经正式成为零售消费市场的主力军，更具个性化消费需求的00后也逐渐拥有消费能力。无论是80后、90后，还是00后，他们的消费主张和个性化需求都正在引领零售世界向前发展。正是与他们的需求的契合，新零售才得以迅速崛起。


    这种与需求相契合的新零售，通过运用大数据和智能技术反馈需求，迅速匹配与顾客需求相适应的产品。而这个匹配的过程，仅仅在消费者指定的系统人机交互端口输入需求后不到一秒即可完成，并且系统还会根据消费者近期消费的特征，推荐与消费者密切相关的产品，从技术上做到“快和准”的独特的消费者购物体验。有别于传统的“脱链式”零售管理模式，智能化的需求管理具有高度灵活性，可以紧密根据客户的需求进行实时调整。以创新的智能化系统为支撑的智能全流程、全渠道零售过程，将帮助打通用户、渠道和商品间的最短通道，满足消费者对零售商店更高质量的购物需求。


    第三，文化的张力。随着家庭教育、学校教育和社会教育的普及与发展，数字公民的文化水平逐渐提高，由于有技术作为支撑，新零售工具的易得，使得数字公民成为新零售的坚实拥护者。经济全球化发展迅速，社会分工越分越细，不同的工作者钟情于特定的工作领域，人与人之间的互补性需求急切。随着物质资料的丰富程度的提高，社会开始出现一系列“闲文化”或者“丧文化”，如啃老文化、佛系文化、游戏文化、宅文化等，对零售行业的需求增加。有需求的地方就有供给，网络新零售开始从这种“闲文化”中受益。


    随着社会文化的多元化发展，文化张力逐渐提高，有各安其位、各守其道的工作者，也有往来于不同地域的跨城工作者，也有“闲文化”氛围下的宅男宅女，并在不断以特有的圈子扩大影响力，最终导致交叉影响。不论是哪种文化，他们都有一个最为明显的特征：基本上都把“衣食住行”交给了行业专业人士去做，人与人之间开始形成一张覆盖全民的社会支持网络，在这个相互支持的网络中，多元文化的张力在逐渐增强的同时，也需要一种牵引力保持文化的合理范围——互补文化诞生。由于存在地域的差异性，互补文化逐渐建立起它的权威，人们需要借助新零售来弥补这个互补文化中的消费缺口，才能使得整个社会文化保持一种和谐的氛围。因此，文化的强大张力，进一步促进了新零售的崛起。


    第四，市场的推动。新零售的崛起，除技术、需求和文化的因素之外，市场的推动对其崛起、成长和发展也具有重大的影响意义。新零售的概念虽然在2016年诞生于阿里，但阿里巴巴早在2014年就开始布局新零售。紧接着，京东、亚马逊、腾讯等大型企业，也开始嗅到新零售的市场前景，开始规划一齐参与到新零售领域中来，并且到目前为止都各自取得了一定的发展成果。随着参与的企业数量增加，新零售也渐渐从一线城市向二、三线城市扩张。随着多家企业的参与，新零售的发展势必会更加贴近民众需求，因为只有能够密切联系消费大众的新零售模式，才容易被更多的人接受。正是如此，竞争的存在促使新零售技术的变革，利益的可图又促使企业不断参与其中并完善新零售的应用系统，最终使得新零售不断发展壮大。


    第五，政策法规的逐渐完善。当今社会是一个法治社会、契约社会，任何新事物的诞生到发展成熟都离不开政策法规的支持，新零售也是如此。


    就在马云提出“新零售”概念的一个月之后，2016 年11月11日，国务院办公厅印发《关于推动实体零售创新转型的意见》（国办发〔2016〕78 号）（以下简称《意见》）。《意见》在促进线上线下融合的问题上强调：“建立适应融合发展的标准规范、竞争规则，引导实体零售企业逐步提高信息化水平，将线下物流、服务、体验等优势与线上商流、资金流、信息流融合，拓展智能化、网络化的全渠道布局。”《意见》作为推动我国实体零售创新转型的指导思想和基本原则，对于引导新零售行业进行规范具有重要意义。


    时隔两年，由于新零售的发展已成为趋势，在发展过程中诸多问题逐渐暴露，产品质量安全、知识产权纠纷、消费者权益和个人信息保护等方面的问题逐渐突出，亟须颁布更为细致的法律法规明确新零售参与各方的义务与责任，以严惩各种损害消费者权益的违法行为。2019年1月1日——新零售规范元年，我国第一部针对电子商务、新零售行业规范性法律——《电子商务法》正式颁布实施。


    《电子商务法》第九条指出，本法所称电子商务经营者，是指通过互联网等信息网络从事销售商品或者提供服务的经营活动的自然人、法人和非法人组织，包括电子商务平台经营者、平台内经营者，以及通过自建网站、其他网络服务销售商品或者提供服务的电子商务经营者。从第九条的规定中可以看出，在电子商务经营者主体中，把新零售微电商归为电子商务法管辖的范畴，所以这也是一部规范新零售的法律，使得新零售的发展进入合法化时代。


    新零售瞬息万变，规范新零售市场的政策法规也在逐渐完善，势必促进新零售加速发展。


    ## 二、“前所未有”的购物体验：这是怎样的感觉


    在新零售时代，购物的过程就是一个体验的过程。嵌入智能化系统的新零售，改变了以往的那种粗放式的购物模式，整个购物的过程可谓细致入微。每个参与新零售的受益者，都将能够感受到“前所未有”的购物体验。


    无人便利店Amazon Go是亚马逊运用人工智能视觉识别、图像识别、射频识别、深度学习、在线支付等技术，推出的具有颠覆传统便利店、超市运营的新零售模式，以技术手段实现“人、货、场”的智能互联，彻底跳过了传统收银结账、人工分析消费数据等的“脱链式”零售模式。


    从2016年12月推出线下实体商店Amazon Go（见图4-1），再到2018年1月下旬向全社会公开这个模式，其新零售的运营已经成型。消费者只要在进入商店时使用相关的移动应用程序，通过扫二维码、打指纹或者刷脸进店，获得进店的授权后，便可在店内享受到全程为智能化而设计的、即拿即走的便捷式购物体验。如果消费者在店内对某个已经加入购物车的商品不满意，将商品放回了货架，布置在店内的视觉传感器、商品定位标识就能立即识别，就能对消费者选购的商品进行相应的算法更新，在消费者离开零售店时，个人的电子钱包就会自动扣费。


    亚马逊的Amazon Go新零售，是线下新零售体验店的典型代表。如果再引入智能物流，开展线上零售服务，那么，整个新零售的形态都将在其中一览无余。从线下到线上，线上再与物流的结合，顾客即可上门消费，也可以网上消费后享受送货上门服务。根据人工智能算法合理布局于城市角落的新零售店，将达到大中小城市的“最后一千米”购物里程。传统的购物需要专门花时间、精力去镇上、集市、商场，需要数千米路程，随着新零售的推广与普及而逐渐变为“最后一千米”，甚至变为“足不出户”，零售消费的选择权回到了消费者手中。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt005_1.jpg)


    图4-1　亚马逊实体店Amazon Go购物场景


    经过上述新零售模式及案例分析可以得知，在新零售领域，消费者的极致购物体验可谓美不胜收。消费者只需要拥有一部手机，不用排队，便可以享受来自线上或者线下的新零售便捷服务体验，包括便捷体验、需求满足体验、支付体验、收货体验、货比三家体验、效率体验、个性化体验、积极情绪体验、安全体验等。


    特别是随着新零售支付手段的升级，支付方式从现金支付到银行卡支付，再到扫码支付的这个变化过程，支付的安全性也在不断提高。无现金社会，人们的支付本身相较于现金支付就更为安全，钱包被盗、收到假币、商品被盗的情况基本消失，并且支付的硬件成本、时间成本也在降低。'
  fmt: '

    当然，在看到人工智能带来的技术创新优势的同时，还需要预防技术创新陷阱。人工智能主要分为三层（见图3-5）：基础层由云计算、算法芯片等组成；中间层由计算框架、图像识别、语音识别等组成；应用层主要是指相关的产业运用人工智能的状况。在这三个层面，技术创新的主体差别巨大，与智能产业相关的应用层的技术创新，可以是各行各业各取所需，各自专注于将人工智能与本行业相结合，推动行业的技术创新，从而为赢得市场先机做好准备，如人工智能医疗手术机器人、人工智能门诊等。但是中间层和基础层则不同，基本上已被人工智能行业巨头所垄断，所以，它们拥有绝对的话语权和领导地位。换句话说，人工智能医疗技术的创新，是由人工智能行业巨头公司来领导的，对于人工智能医疗领域的从业者来说，他们能够做的就是顺应变革的趋势。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt004_5.jpg)


    图3-5　人工智能金字塔


    这就告诉我们，人工智能医疗技术的创新，不仅是技术创新的问题，还要注意全球的舆论引导、伦理规范与制度规约问题。如果领头的人工智能医疗技术创新跑偏了方向，受到扭曲的价值观的诱导，医疗技术创新沦为资本的附庸，对于医疗领域来说是一场灾难，其他各行各业也将会被牵涉其中。因此，人工智能医疗技术的创新，要能够清楚地回答技术的创新究竟需要实现什么样的价值，这个价值是否是人类共同的价值诉求。人工智能医疗技术的创新，本质上是要解决医疗服务的需求问题，所以万不能以另外的动机为创新的原动力。


    总的来说，人工智能与医疗技术的创新，是要服务于社会的，是要满足广大社会公众需求利益的。人类如何利用好人工智能，创造更加美好的技术创新的未来，为自身的健康带来更多的有益的成果，这是医疗技术创新所希望达到的。


