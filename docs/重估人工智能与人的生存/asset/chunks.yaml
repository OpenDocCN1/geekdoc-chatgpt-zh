- raw: '最后，数据本无罪，技术无善恶，人类社会的发展遵循客观规律，自身发展并无对与错。大数据和人工智能的“红与黑”“罪与罚”，也是针对不同的人而言的。大数据和人工智能时代在带给我们隐私问题的同时，也带给了我们解放。大数据和人工智能技术集视觉、听觉、触觉等于一体，更具有生动性和直观性；全面调动了人的各种感觉器官，突破了人类仅在感性层面认识世界的局限，使人的各种感官能够最大限度地发挥作用；激发了人多个感官的潜能、灵动，在应用大数据和人工智能技术消解隐私隐患时，能够使人最大限度地享受“解放”。


    此外，消解隐私隐患、获得解放又可以理解为回归本真的状态。大数据和人工智能技术虽然带给我们侵犯隐私、“透明化”和“裸奔”等问题，但大数据和人工智能技术又可以识破谎言、伪装，改变“知人知面不知心”状态，让我们没有欺骗、没有伤害，回到最初的本真、自由、我行我素、解放状态。在此意义上，大数据和人工智能的隐私侵权与解放是相伴而生的，“人是目的”在当代找到了新的路径，通过应用大数据和人工智能技术，人的价值、尊严、解放等强调“人”的主体地位的理念在新时代获得了新的发展，达到了新的境界。


    在应用大数据和人工智能的过程中解决个人隐私侵权问题，不仅对于人而言具有解放意义，对于企业发展、社会治理而言，也具有解放意义。科学技术是第一生产力，大数据和人工智能则是最新的生产力。企业的壮大需要依靠大数据和人工智能获得发展动力和前景；社会的教育、就业、养老等领域要获得更多的便利，也离不开大数据和人工智能的支撑。


    在隐私保护方面，智能型企业的作用越来越大。智能型企业是定向广告技术发展的推动者，也是个人隐私被“透视”与侵犯的主导者，要对个人隐私权保护承担相应的责任。


    首先，创新研发保密技术，攻破技术难关。智能型企业应加大技术研发投入，走在安全防护技术的前沿，为消费者信息保护提供强有力的保障，以获取消费者的信赖。智能型企业在技术研发过程中可借助当前发展较为成熟的智能技术，在服务设备中嵌入智能识别功能，有效管理服务器，而不再“肆意妄为”或“无所作为。”特别强调的是，对于保密技术的攻关与突破，智能型企业需要充分运用“以技术攻破技术”的原则，把黑客技术及黑客人才的引进作为保密技术发展的重要一步，只有真正懂得攻击公司数据库技术的尖端技术，才能从尖端技术的漏洞中发现突破和超越的可能性。


    其次，提升员工职业素养。技术是由人来操纵、受人指挥的，技术本身是无所谓好坏的，之所以技术的运用存在两面性，是因为人性具有两面性，技术的恶性发展也是被某种非法意图所驱使的。因此，智能型企业要想加大对消费者个人的隐私数据保护，应加大对员工的职业素养培养，提升员工的职业素养与道德素质，尽量通过素养的提升，让“老干妈的家贼案”再次发生的可能性降到最低。技术的“失效”人类尚可防范，但人性的扭曲、价值观念的错乱带来的潜在危害却是难以预估的。因此，存储大量个人私密信息的智能型企业应重视员工职业素养的培养。


    最后，隐私保护制度的建立。“无规矩不成方圆”，智能型企业个人隐私保护责任的承担，要想落到实处，还需要考虑结合国家的相关隐私保护的法律法规，制定符合企业本身经营范围的具体化操作细则。规则的权威来源于规范化的强制性力量，对于智能型企业隐私保护制度的建立，应该包括规则的合法性、可操作性、负责人、适用范围、使用条件、惩罚机制等具体情境，切实从制度入手，将企业的服务对象的个人数据保护落到实处，而不只是挂在嘴边。


    通过对以精准定向广告推送为例的大数据和人工智能时代的隐私问题的探讨，可以看出，纵然个人隐私问题伴随大数据和人工智能的发展不可避免，但技术生成和应用的主体是人，消解大数据和人工智能时代个人隐私问题的根本出路在于人类自身，在于人的实践活动，在于人的现实活动。人的全面解放既不是浪漫的幻想，也不是未来的乌托邦，人的解放具有现实性。“旧式的生产方式必须彻底变革”\[20\]，要实现人类解放，就“必须推翻使人成为被侮辱、被奴役、被遗弃和被蔑视的东西的一切关系”\[21\]。在新时代，我们要充分发展和利用大数据和人工智能等新一代信息技术，推进政府、企业、社会组织、公民协同治理隐私问题，从价值观念、社会责任、道德伦理和法律规范等多方面，不断推动大数据和人工智能的人性化发展，让人们期待的大数据和人工智能“理念世界”普照人的“现实世界”、生活世界，紧紧围绕人之为人的方向来不断发展。


    随着大数据和人工智能等新一代信息技术的发展，社会生产力将高度发达，社会财富将极大丰富，生产劳动将从负担变成快乐，人也将在大数据和人工智能等新技术的逐步发展中获得解放。这将是一个令人敢于“亮相”的时代，也将是令人期待的隐私保护的时代。


