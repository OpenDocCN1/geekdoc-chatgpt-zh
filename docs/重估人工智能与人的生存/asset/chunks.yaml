    # 第三部分　重构发展空间

    ## 第九章　教育：通向个性化的回归之路


    学生：能力目标变换与学习方式变革


    教师：地位转变与角色转换


    学校：智能化的管理成为常态


    个性化的回归之路：教育大数据的魅力


    大数据和人工智能时代，是各行各业充分得到赋能的时代。教育是对技术发展最为敏感的行业之一，从“互联网+”到“大数据+”再到今天的“智能+”，赋能的力量在不断加强。教育与大数据和人工智能的结合，使学生的学习、教师的教学、学校的管理正在发生革命性的变革。从农业时代的私塾式教育模式到工业时代的工厂式班级教育模式，再到基于新一代信息技术和人工智能技术的以数据为支撑的科学化、智能化、个性化的教育模式，教育的内涵在不断扩大，教育的外延在不断变化——更加符合人性和人的全面发展需要的个性化教育，在经历了“否定之否定”之后，正在向更高层次复归。


    ### 一、学生：能力目标变换与学习方式变革


    大数据和人工智能时代，是各行各业得到充分赋能的时代，从“互联网+”到“大数据+”再到今天的“智能+”，赋能的力量不断加强。教育是民族振兴、社会进步的基石，是提高国民素质、促进人的全面发展的根本途径，也是对技术发展最为敏感的行业之一。大数据和人工智能的发展得到了教育行业的充分响应，“互联网+教育”“大数据+教育”和“智能+教育”蓬勃兴起，特别是近期一直呼吁的要
    “以学生为中心”的学习方式的转变，深得大数据和人工智能技术专家的青睐。


    2019 年 5 月 26 日，第五届中国国际大数据产业博览会新闻发布会在贵州贵阳开幕，与会的科大讯飞的科研产品——科大讯飞自主编撰的个性化学习手册，被评为
    2019 领先科技成果“优秀项目”奖。该个性化学习手册的获奖缘由是它能够专门为特定的学生提供相应的学习方案，方案中融汇了大数据和人工智能思维与教育教学的新理念。为了能够更好地服务学生，该个性化学习手册会根据学生的习题集、错题集、模拟题等相关练习数据进行智能汇总与分析，从而能够明确学生的知识盲点、做题的错误思维等，然后推荐专属于该学生的个人学习方案。


    在传统的那种使用参考资料的练习模式中，由于纸张有限，而且分析总结的工作由学生自己完成，学生的学习过程很容易陷入“瞎忙悖论”：学生做作业喜欢在自己熟悉的知识范围内重复练习，导致对不熟悉知识的练习不足——之前已经学会的知识点，后期又一直在重复，而新的知识点却没有得到补充——有一种瞎忙的嫌疑。就科大讯飞的个性化学习手册而言，其的确能做到对这个悖论的超越。当学生的练习思路存在错误时，大数据和人工智能技术能够对其进行针对性教学，将与错误内容相关的习题和知识点统一调出来供学生使用，并且难易程度会逐渐加深，能够切合学生的“最近发展区”。因此，如果学生能够正确使用这个手册，就能在很大程度上节约学习时间，而不用做过多的重复性工作。


    从科大讯飞获奖的案例可知，学生潜在的需求有待挖掘。在大数据和人工智能时代，学生学习方式的转变是与自身独特的需求分不开的。在传统教育中，学校对学生的教育是按照“一个模板”进行的，学生的学习方式就是记住上课内容——被动式学习，从而使学生的个性化经验被忽略。


    美国教育学家杜威说“教育即经验”。个性化的教育正是对这种教育思想的有效回应。既然传统的大班制教学很难关注到每个学生的独特需求，就要求助于大数据和人工智能这样的新技术的发展和应用。因为在传统的教育中，教育工作者很早就认识到了这个问题，但教学资源有限、教学条件有限、教学经历有限等直接限制了他们对学生个性化的关注。


    值得注意的是，如上所提的“有限”，在大数据和人工智能技术应用之后，逐渐变得“无限”，学生完全可以根据自己的需求选择相应的学习资源、学习方案等，并且在相应的学习平台上开展学习活动。同时，学生自身的学习轨迹能够为“个性化的进化”服务。随着学习活动的增加，学习平台将会逐渐形成学生的个人学习档案，从而反过来更精准地服务于学生的个性化学习，这或许就是为什么科大讯飞的个性化学习手册能够获奖——契合新时代学生学习的需求。


    学生个性化的学习需求，本质是源于社会需要的变化。随着大数据和人工智能时代的发展，社会呈现深度数据化和智能化的特征，技术性的社会变革促成诸多新的社会需要的形成，从而导致社会需要与学生实际能力之间的尖锐冲突。在这样的背景下，学生不得不采取个性化的学习方式去培养自己适应当今社会需要的独特能力。简而言之，社会需要的能力目标的变化，引起了学生学习方式的变革。


    在大数据和人工智能时代，学生将以怎样的方式学习的问题，归根结底是学生学习方式转变后新的学习方式是什么的问题，其本质是对社会需要的回应问题，无数学者对这个问题的探究性回答，形成了变革学生学习方式的全球化大趋势。麻省理工学院自
    2017 年 8 月启动了“新工程教育转型”计划，对工程类教育改革中的学生学习方式和学习内容进行了全面研究，并提出了新工科人才应该具备的 12 种思维能力，如表
    9-1 所示。从目标层面而言，这是大数据和人工智能时代教育个性化回归、学生主体地位回归后希冀达到的目标，也是新的时代背景下社会对学生提出的新要求。


    表 9-1　麻省理工学院提出的新工科人才应该具备的 12 种思维能力


    ![img](img/txt012_1.jpg)


    续表


    ![img](img/txt012_2.jpg)


    资料来源：数学中国。


    由表 9-1 可知，对于新工科人才的必备思维能力，学生用传统的学习方式是很难达到的。传统的学习方式是一种被动式参与的学习方式，学生学习过程中的积极性、主动性和创造性很难被调动起来。能力目标变化，意味着学生学习方式也要随之发生变化。就表
    9-1 中的第 8 项能力而言，学生若只有直线型思维，不能很好地参与到学习活动中，不能正确地认识第 1 项思维能力的重要性，就很难通过自己的学习总结来具备批判与元认知思维能力。


    在大数据和人工智能时代，学生学习方式的转变是一项系统工程，它不仅包括要转变学生的思维方式，还需要改变学生的实践方式。教师在课程实践活动中教的知识是间接的，而学生自己结合生活实际感受到的知识才是直接的，背后反映出的是一种新一代信息技术支撑下的“体验性”学习新方法。“体验学习是一种以学习者为中心，通过实践与反思结合而获得知识、技能和态度的学习活动。”\[1\]这种学习方式与传统的被动式学习方式具有天然的不同，在这种方式中，学生的主体地位得以凸显。


    社会需要的变化，使学生学习方式得以变革，学生主体地位得以凸显，这必将产生新的学习理念。这是新时代每个学习者都应该高度重视的，其中主要包括如下几个方面。


    第一，开放学习。大数据和人工智能技术是一种开放的技术。大数据和人工智能的发展需要开放的社会环境和开放的文化。智能技术和智能课程的出现与发展，在教学、科研、成果转化和高新技术产业化等方面都会比过去更加开放和有更多的沟通。多媒体的普及和网络的发展，使在线教育更趋完善，使教育不再受特定时空的限制。学校的界限变得模糊起来，教育将从垄断和僵化中走出来，变得更加开放和多样化。


    第二，个性化学习。大数据和人工智能技术在教学中的广泛运用，为学生的个性化学习提供了一种技术环境，教学形态由班级制走向个别制，教学过程由“以教师为主导”转变为“以学生为中心”，从而使学生的个性化学习成为可能。教师可以根据学生的实际情况实施柔性教学，真正做到“因材施教”；学生拥有学习的自主权、全面参与权和教育活动的选择权，可以根据自己的兴趣、需要和水平择校、择师、择课、择时、择地等，做到自主学习、充分学习和有效学习，从而在学生知识结构个性化的基础上，进一步强化学生人格的个性化倾向。


    第三，社会化学习。大数据和人工智能将把整个社会连在一起，学校教育、社会教育、家庭教育的界限变得越来越模糊。普通高等教育和职业技术高等教育、正规教育和非正规教育将融为一体。学校教育将逐步社会化，对社会全方位开放，而社会教育将逐步家庭化，整个社会将变成一个学习型社会。学习从少数人扩展到所有人，从人的一个阶段扩展到人的终身，从单纯地为了获得学历文凭转变为为了适应和驾驭未来社会。知识社会化和社会知识化推进学校和社会的双向参与。知识经济和智能化社会推动着学习型社会的形成，学习型社会支撑着知识经济和智能化社会的运行。


    第四，终身学习。信息、知识与数据的高速增长、传播和转化使终身学习成为必要，而大数据和人工智能技术为终身学习提供了技术基础。书本化教材的知识落后于社会发展少则
    5 年，多则 10 年，甚至更长时间，而大数据和人工智能平台上的数字化课程的知识更新可以发生在一天以内，或者更快。终身学习是 21 世纪人类的生存概念和生活方式。正如比尔·盖茨在《未来之路》中指出的：“教育的最终目标会改变，不是为了一纸文凭，而是为了终身受到教育。”\[2\]


    第五，学会学习。在大数据和人工智能时代，信息爆炸和知识老化的加速使学习方法的重要性更加凸显出来。在“减负”（减轻学习负担）和“提质”（提高学习质量和效率）之间，学生最明智的选择就是“学会学习”——“学习如何学习”。“未来的文盲不再是目不识丁的人，而是没有学会怎样学习的人。”只有学会学习，才能提高能力，才能把自己培养成高素质的全面发展的人才\[3\]。在大数据和人工智能环境下，教学活动将从“单纯知识灌输”走向“知识与方法论”的兼蓄习得。学生对方法论的习得时间将多过对知识的习得时间，从而提高学习效率，并激发创造性思维。培养信息素养、数据素养、智能素养，掌握学习方法，提高学习能力，将成学生转变学习方式要重点确立的理念。


    第六，学会创造。创造教育是素质教育的核心和重点。实施素质教育不仅要使学生“学会学习”，更重要的是要使学生“学会创造”，因为创造（创新）是知识经济时代人才的主导素质\[4\]。大数据和人工智能技术可以构建数据丰富的、反思性的、可视化的学习环境与学习工具，允许学生进行自由探索，这加大了学生的创造自由度，十分有利于学生批判性、创造性思维的形成和发展。大数据和人工智能最大的教育价值在于让学生获得学习自由，为其提供可以自由探索、尝试和创造的条件。


    如上所述，我们看到了社会需求的变化对学生转变学习方式的影响，以及对学生产生新的学习理念的影响。那么，运用哪些策略才能够帮助学生在这个“精彩纷呈而又纷繁复杂的世界”中迅速达到新时代的学习目标，并迅速借助大数据和人工智能的技术、资源、互动等优势来促成个人的全面发展呢？


    从通识意义上讲，“提问题的人比回答问题的人更清楚答案本身”，学生作为学习活动的主体地位得以回归，学生就能将这个“通识”所能获得的答案本身进行系统性的组合，从而建构一个自身想要看到的有别于现实的现实世界，这个建构的过程就是学生运用创造性思维的过程，也是将知识转化为“为己所用”的知识架构的过程，这无疑是学生最期待收获的学习性成果。


