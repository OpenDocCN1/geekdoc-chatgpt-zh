    ### 第二，用大数据和人工智能技术建立学生心理危机预警的整体协同机制。

    大数据和人工智能的核心不是纠结于学生的“过去”，而应该是转变思维理念，将学生“此在”的数据进行即时传输，为学生心理危机干预者提供现实参照的个体数据，从而实现对学生的多维心理管控。一方面，心理危机预警与干预并非干预者一方的工作，需要相关单位间协同合作，通过实现有效数据信息共享与整合，共同探索出一套能够灵敏预警在校学生的心理危机的整体协同机制；另一方面，心理状态是一个动态过程，心理危机从潜伏期到爆发期再到干预后期都应该得到关注。完善的心理危机干预工作应该主要包括预警环节、干预环节和追踪环节，大数据在每个环节都扮演重要角色。


    ### 第三，用大数据和人工智能技术提高心理危机干预者的数据预测能力。

    任何行为都是有预兆的，大数据和人工智能技术能够在学生做出异常行为时最先做出反应，其灵敏的触角为干预者提供了重要的预警信息。只有将大数据和人工智能技术应用于学生心理健康教育工作，并不断创新，才能使学生心理危机预警实现有效关联、准确预测，进而实现心理危机应急处置从强调快速实用到强调个性化的转变\[13\]。


    ### （2）可以利用大数据和人工智能技术提高学生心理危机干预能力。

    大数据和人工智能技术在心理危机干预工作中不仅可以及时做出学生心理危机预警，还可以通过对学生的生活环境、人际关系和思想观念等方面的信息进行收集，对其心理状态做出合理的分析和解释，从而给出具有针对性的干预方案。互联网这张无形的“网”牢牢套住了学生群体，只要学生做出了数据行为，就会留下数据痕迹。这些数据不仅包含学生的思想观念、生活环境和学习状态等信息，同时也能在一定程度上说明学生当前的心理健康状况。


    #### 第一，面对具有心理危机的学生群体，在其上网过程中，可以利用大数据和人工智能技术潜移默化地进行心理干预。

    可以通过发布具有心理调节作用的积极向上的内容或信息，引导其树立正确的价值观念。这种模式在预警环节、干预环节和追踪环节等环节中都发挥了不同程度的干预作用。这种线上与线下有机结合的心理危机干预，提升了干预的效果。


    #### 第二，运用大数据和人工智能技术，掌握不同类型学生的共性与个性特征，以便主动提供更具针对性的服务，推动心理危机干预工作持续发展。


    #### 第三，培养熟练掌握大数据和人工智能技术的心理危机干预者。

    大数据和人工智能时代下的学生心理危机干预工作急需这种复合型人才——既掌握大数据和人工智能技术，又接受过专业的心理健康教育，只有具备这种人才，心理危机干预水平才能提高。数据爆炸性增长给学生心理危机预警和干预工作带来了重大变革，我们需重视大数据和人工智能技术对学生心理干预工作的重要性，应该积极发掘学生日常数据行为的潜在价值，充分发挥大数据和人工智能技术的强大功能，提升学生心理危机预警与干预水平。


    智慧校园的建设有利于学校的智能化管理，智能化管理的常态化又进一步在各方面反过来提高了学校管理工作的“效率”与“质量”。学校的智能化建设工作对学校管理的影响“全方位、多层次、宽领域”地存在于教育系统中。换句话说，学校的智能化管理工作是一个系统工程，如图9-1所示。学校的智能化管理系统，教育管理系统、教师系统、学生系统、家长系统、教育监测系统、教育质量反馈系统、教育管理系统等于人工智能教育系统中，数据的可视化、即时化、精准化为学生的学习、教师的教学、行政人员的管理工作奠定了技术基础。


    总之，相较于学生的学习方式和教师的教学方式，数据化、智能化的学校管理是最容易见到大数据和人工智能“实效”的领域。传统的学校管理是一项错综复杂的“跑腿”工作，教师与学生、学生与学生、宿管与学生、教师与学校等方面存在的管理与被管理关系，需要依托“面对面”的交流互动，在时间和空间上存在人为的“适时适地”的参与性，所以，很难避免“耗时耗力”“劳神伤财”的工作，并且管理的效率和质量还有待提高。


    大数据和人工智能技术是人体功能的技术化延伸，其在教育中的应用有助于提升学校管理工作的效率与质量。大数据和人工智能技术平台能够打破“时空阻隔”的局限性，迅速将全校管理工作的复杂网络“简单化”，为学校的管理工作带来了意想不到的惊喜。伴随大数据和人工智能时代的到来，学校的智能化转型趋势不可挡，学校的智能化管理将成为常态。


