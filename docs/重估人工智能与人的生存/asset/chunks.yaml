- raw: '2018年7月，中国银联与华为联合推出移动支付黑科技——“碰一碰”NFC标签支付，如图4-2所示。其支付步骤如下：第一步，手机亮屏并解锁（无须打开任何App）；第二步，在手机NFC打开的状态下，将华为手机靠近“碰一碰，手机闪付”标签，轻轻一碰，调出支付界面，输入金额并验证指纹即可完成付款。这种支付方式，将扫码支付的扫码枪的成本节省了。碰一碰NFC标签支付可靠性高、成本低，且数据防复制、防篡改，运用于新零售应用场景具有很高的可行性。这对于提高新零售的消费者支付体验具有重大意义，虽然其便捷性可能低于刷脸支付，但是从安全性、低成本、支付仪式感上来讲，这种支付方式的普及可能更具有现实可行性。无论如何，单从购物方式这个角度来看，新零售的支付场景势必会朝着更好、更便捷的支付体验的方向去努力，并且其中的绝大部分支付体验已成现实。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt005_2.jpg)


    图4-2　华为“碰一碰”NFC标签支付


    新零售模式，又可以称为“用户直连商品”，甚至“用户直连制造”的智能零售模式，新零售的概念解析与亚马逊Amazon Go应用场景的结合，可以更为直观地反映消费者在零售中的地位。廉价购买实用商品是零售的主流，引入新零售模式后，由于少了更多中间商的层层盘剥，消费者便可以更低的价格买到需求的产品。另外，传统的消费者“货比三家”的节约廉价消费模式，反映的是中华民族勤俭节约的良好品德。自2016年阿里巴巴提出新零售以来，零售的“货比三家”已经发展到可以轻松完成“货比三十家”的消费，这一方面给消费者提供了廉价的商品购买体验；另一方面从整体上提高了消费者的积极购物情绪体验。因为传统的零售特别容易出现断货或者囤货的情况，而零售商面对这种封闭的库存系统往往无能为力，导致了消费者的消极购物情绪的产生，而如今的全流程、全渠道的购物已经避开了这种弊端。


    新零售对于顾客而言，最佳的购物体验最终还是要回归到个性化体验和效率体验上来。新零售所构建的消费体验场景是因人而异的，基于人工智能算法的新零售，能够根据消费者的兴趣、爱好、年龄、知识、教育背景及社会角色等因素，将购物场景细分成与之相对应的主题鲜明、个性独特的多元化消费场所。传统的零售商店则需要经过人为的努力，才能满足消费者的个性化消费需求和不断变化的期望。但如今，消费者能轻而易举地在线上查询并了解自己想要购买的商品，在消费者有消费需求时，便捷的物流网络提供多种购物和送货方式，能够在迅速满足消费者的消费需求的同时，实现商品匹配的个性化、精准化，给予消费者美好的个性化体验，一种“被尊重的购物”的感触油然而生。


    作为新零售的典范，阿里巴巴的新零售线下体验店盒马鲜生引起了众人关注。从盒马鲜生的消费旅程（见图4-3）来看，消费者的整个消费者过程都是充满选择性的，消费者既可以选择在线上下单去线下消费，也可以选择线上下单送货上门，还可以选择线下下单线下消费。无论消费者选择哪种方式，消费者都能从商品的口味选择、排队叫号、查看订单、取餐、售后离开等消费体验层面获得享受型的服务体验。


    盒马鲜生的服务型体验可以分解为三部分：智能体验、商品体验、情感体验。智能体验是指消费者在消费过程中使用盒马软件服务设施时所获得的便捷体验。盒马鲜生的网上布局范围较广，但经过盒马App的整合功能，整个盒马鲜生的商品一应俱全，消费者只需要通过一部智能手机，就能完成商品选择、下单、扫码、付款、取货等一系列购物流程，全程自动服务，消费者即来即走，购物顺畅不排队。如果人流过大，需要排队叫号，服务软件也会提供叫号提醒服务，让消费者不用为等货物而焦虑，给消费者带来了极大的便利。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt005_3.jpg)


    图4-3　“盒马鲜生”的消费旅程\[1\]


    商品体验是指盒马鲜生通过运用大数据和人工智能重置消费者需求的商品形态，在商品的品种、位置摆放、新鲜程度上下功夫，从而给予消费者以新鲜度、丰富度、灵活度等新体验。


    情感体验是指盒马鲜生店推出的分布于线上和线下的可爱憨厚的河马客服，无时无刻地与顾客形成积极的互动关系，给予顾客温暖而贴心的服务。


    总之，新零售是基于大数据和智能技术的产品与服务的销售，是零售与消费者最佳体验的连接，更是贴近消费大众的“心”的零售。在“人工智能+零售”时代，消费者的购物体验正在走向极致。体验来源于技术，更来源于零售商对消费者的敏锐洞察，体验更加趋向于细节化。谁能掌控消费者的细节情绪体验，谁就将在与传统零售业的对峙中胜出。


    ## 三、“智能+”时代的零售业：新与旧对峙的启示


    在大数据、人工智能时代，技术变革正在加速。过去需要经过几十年甚至上百年时间，才能迎来一次世界科技的大变革，但第一次工业革命之后，所有技术的迭代更新的时间间隔逐渐缩短。技术的快速迭代，往往意味着经济的快速转型，以技术为载体的新兴经济，正在经历着“新”与“旧”的对峙，并呈现日趋激烈的趋势，彼此间的加速淘汰也就在所难免。


    2018年10月15日，美国百年老店希尔斯正式向美国破产法院申请破产保护，成为零售行业的悲剧新闻。希尔斯是希尔斯·罗巴克公司（Sears，Roebuck and
    Company）的简称，成立于1888年，其总部坐落于美国纽约，并于1925年开始进军百货零售行业。在公司成立之后，由于顺应了时代发展潮流，以惊人的速度迅速崛起，自20世纪初期开始，曾一度在美国的零售行业“独占鳌头”，直到20世纪90年代初，后起之秀的沃尔玛公司，以“折扣店”经营策略开拓新兴市场，才超过了希尔斯公司。


    希尔斯成于“顺势而为”。


    19世纪60年代中期，美国“南北战争”最终以“北方工业资本主义经济”战胜“南部种植园奴隶制经济”而宣布告终。战争结束后，美国的资本主义经济获得突飞猛进的发展，城市化进程加速推进，使城市与农村开始分化发展。由于发展程度不同，两者之间的消费水平各异。为了能够适应不同区域的差异化消费需求，希尔斯进行了广泛的市场调研，对城市和农村市场的消费需求了如指掌，并开始将邮政业务引入公司经营范围，针对城市和农村的不同消费人群，开展针对性服务，特别是拓展专门服务于农民的邮购业务，为之崛起奠定了基础。随后，公司通过印刷邮购用的产品手册，向不同的消费者开展差异化的广告宣传活动，公司品牌为广大消费者所熟知。


    希尔斯的消费者，可以通过信件订货和付款，公司又通过邮件寄送的方式，将商品送货上门，从而逐渐将第二种零售形态变革为第三种消费形态，把零售商店的服务延伸到消费者的家庭及个人，故而广受消费者的支持和喜爱。


    公司仅在进军百货零售行业的第一年，就已经开设300多家零售经营店，并在次年的经营中，实现了零售营业额首超邮购营业额的壮举，并在后继的持续改组、创新行动中，奠定了公司在零售行业的地位，近百年荣居零售行业“榜首”，成为世界百货零售业的开山鼻祖（见图4-4）。


    尽管曾经是“不可一世”的百年老店，但却难逃厄运——在新技术革命的冲击下，居然转瞬间轰然倒塌。


    希尔斯败于“墨守成规”。


    随着新兴技术的发展，个性化、技术化和高效高质化成为技术经济市场的显著特征，技术的微小革新有如“蝴蝶扇动翅膀”般的威力，能够最先嗅到商机的技术型企业，势必会在未来的市场中一步步胜出。但对于反应迟钝的公司，就没有那么幸运了。哪怕是行业巨头，少了占领市场的“灵丹妙药”，就少了消费者的青睐，因丢失“一颗马蹄铁”而毁掉整个帝国的故事就开始上演。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt005_4.jpg)


    图4-4　美国百货零售业鼻祖希尔斯


    在希尔斯衰落的历史中，最为值得反思的“经验”就是它的“墨守成规”。在一系列新兴技术不断涌现的时刻，蕴藏于单个技术元素之中的力量，很容易在多个技术的交融过程中形成新的技术趋势。但原本有着深厚创新根基的希尔斯，似乎并没有明白这个看似简单的道理，在最为关键的市场争夺的时间节点上，它却开始转战房地产行业，并把公司的扩张模式从“质量扩张”变为“数量扩张”——不断地开新店，忽视技术、产品、组织架构等方面的转型，从而错失良机，走向了灭亡。


    然而，正当希尔斯在走“下坡路”时，它的竞争对手如亚马逊和沃尔玛这样的新零售公司却在加速走“上坡路”，并不断地致力于零售服务的升级改造——技术整合创新、注重产品品牌和质量、完善消费者服务体验场景、成立大数据和人工智能平台等，从而阻断了希尔斯的“回头路”——陷入“存量多、流量低、增量少”的恶性循环。最终，在这场新零售与传统零售的对峙中，传统零售巨头希尔斯倒下了。


    在“智能+”时代，新零售与传统零售的对峙，给了我们三点经验启示。要想在未来的新零售中进一步赢得发展主动权，可以从中汲取经验。


    一是致力于产品的自主创新。希尔斯的失败，源于产品的自主创新力度不足，造成品牌发展滞后，从而沦为市场的牺牲品。新零售作为新生事物，各大零售商应该狠抓产品的自主创新，从企业组织架构、创新人才引进、创新战略规划等方面着手，打造属于自己的独特品牌，从而提前为突出自身的社会价值和经济价值做好准备。积极关注前沿创新领域，不仅要主动进行自主创新战略布局，还要积极推进模仿创新、跨域交叉创新、合作创新等多维创新，切记走“以量取胜”的老路子。


    二是注重技术的智能整合。技术的力量并不存在于单个技术元素之中，也不存在于多元技术的简单、机械地拼凑中，而存在于单个技术有机融合成的大技术系统中。只要等待时机成熟，存在于现实中的这个大技术系统，就会以人类想象不到的速度，在一夜之间改变整个零售世界。这种力量不是来源于技术本身，而是来源于现实世界的力量在技术结构中的赋能，是一种人类意志的技术体现，它会驱使整个人类，把零售的全部社会形态复制到另一个虚拟的世界，并且存在再现、增强和超越现实零售世界的倾向。在人工智能时代，新零售的未来发展，尤其需要把握住这个智能整合的关键点。


    三是留意消费者的细节体验。“顾客就是上帝。”在新零售时代，市场的竞争异常激烈，要想在竞争中胜出，必须做到零售的个性化关照。在大数据和人工智能时代，消费者的消费体验具有舆论力量，一旦出现消极情绪体验，对于新零售商而言，具有不可小觑的力量，必须及时准确地给予回应。另外，零售商还需要事先不断完善消费应用场景，建立专门的大数据和人工智能需求反馈系统和情绪体验系统，确保能够提前为每个独立个体的积极消费细节体验提供条件。


    在“智能+”时代，新零售与传统零售的对峙，不单是技术、资本要素的角逐，更是一场思维层面的竞争，只有那些能够正确认识技术经济时代特征的零售企业，才能“青出于蓝而胜于蓝”。


    ## 四、新零售的头号劲敌：隐私泄露的综合治理


    在漫长的零售业发展历史中，虽然其形态变化多样，不同的历史时期可能表现为不同的形式，有不同的零售载体和不同的交易方式，但无论是新零售还是传统零售，它们的本质却一直都没有变——向消费者提供商品和服务。


    随着先进的工具不断向零售领域迁移，“先进工具+传统零售”促进零售变革的模式一直在演化和推进，并在每次零售迭代的过程中，伴随着更为优质的商品和服务的诞生。其间，消费者的身份在不断变化，从最初的“双重身份”到“独立身份”、从被盘剥到自由选择、从共性消费到个性消费等，这个身份变化的过程体现的是零售本质与人性需求的不断契合。在倡导自由、独立与个性的时代，让消费者在零售应用场景中感受到尊重和真诚，感受到安全与诚信的存在，这对于消费者个人而言是莫大的欣慰。


    到目前为止，新零售的崛起确实已经开始关注人性的本质需求。从更宽泛的意义上来讲，这样的需求越是触及本质，越能赢得消费者的“芳心”。但是，这种逐渐深入的零售与人性的契合，需要有一个前提就是，基于大数据、人工智能技术的新零售势必要将消费者的“全数据”进行人物画像，以期构建起全线跟踪的消费者数据知识图谱（包括与生存有关的各方面数据），才能实现触及需求本质的新零售服务。


    那么，如此完善的消费者数据，该如何确保数据的安全性呢？这是新零售面临的最严峻的问题。新零售的本质是商品与服务，先进而便捷的大数据、人工智能技术为之提供产品创新与优质服务的同时，也面临着一些技术上的缺陷和人为的破坏。新零售的服务变味了，从“服务”变成了“敲诈和勒索”，在新零售的外表蒙上了一层“恶”的面纱，犹如“海妖之歌”，使得像奥德修斯这样的神仙也不得不提高警惕。新零售时代的到来，使我们不得不面对头号劲敌——隐私泄露。我们应该如何应对呢？


    第一，提高消费者隐私保护意识。消费者的隐私保护意识不强，对于消费者自身的隐私保护是极为不利的。随着与隐私保护相关的法律法规逐渐完善，人们的隐私的掌控权有向个人回归的倾向。一般的大型零售平台，登录和注册都需要隐私授权，如果消费者不授权，各大零售平台则没有机会获得消费者的隐私数据。像阿里、京东、沃尔玛、亚马逊这样的大型新零售平台，信息泄露导致的用户的隐私侵权，对于平台的影响是巨大的，所以，他们对于个人的隐私保护非常严格。但是，对于一些其他的恶意勒索软件，还有一些新零售应用场景的支付骗局，就需要消费者有很高的隐私保护意识，才能有效提防隐私被侵犯。所以，一方面，消费者需要通过相应的学习渠道，养成自主自觉地学习隐私保护知识的习惯；另一方面，学校和社会也需要加强对消费者个人的隐私保护教育，不断提高消费者的隐私保护意识。


    第二，提高零售商的隐私保护素养。零售商在新零售领域扮演的是销售者的角色，他们掌控着所有消费者的隐私数据。经过消费者授权和零售平台的智能数据挖掘，消费者的隐私数据迅速向零售平台集结，使得零售商拥有了支配消费者隐私数据的特定权力。此时如果零售商隐私保护意识薄弱，在消费者没有授权的情况下将消费者的隐私数据打包售卖，将会对消费者造成剧烈影响。为解决此问题，需要完善消费者隐私监督和追踪渠道，确保消费者在隐私受到侵犯时“有据可循”；需要提高进入零售服务的准入门槛，把隐私保护素养列入考核指标；需要定期开展隐私保护宣传活动，营造隐私保护的社会氛围。


    第三，借助人工智能完善隐私保护技术。在新零售发展的过程中，得益于大数据和人工智能技术，不仅体现在前期的技术福利，还得益于后期的深度技术整合的发展问题。2019年3月27日，在博鳌亚洲论坛“AI+时代来了吗”分论坛上，百度副总裁尹世明就曾表示：“人工智能的隐私问题可以交给技术去解决。”因此，从某种程度上来说，隐私的问题也是人工智能技术的缺陷问题，所以要求新零售平台的开发商、运营商要积极总结经验，不断从改进技术、引进新技术的角度，创新零售平台的数据保护功能，特别是需要提防黑客的攻击（可以借助黑客技术完善隐私保护技术）。


    第四，积极进行新零售的伦理治理。作为新事物的新零售，在变革社会的零售模式时，也产生了诸多伦理纷争。譬如大数据“杀熟”，零售商在销售过程中利用杀熟技术，“看人下菜碟”损害消费者个人的利益。新零售的进一步发展完善，“技术的贪欲”导致的类似于“杀熟”这样的伦理争议可能还会出现更多的形态，所以需要事先做好准备。在人工智能时代，人与人之间的伦理、人与人工智能之间的伦理、人工智能的伦理交错互现，增加了新零售应用场景中的伦理治理难度。但是，只要能够厘清伦理治理的“人—人工智能—人”这条主线，纷繁复杂的伦理治理并没有想象中那么困难。2019年3月10日，在全国政协十三届二次会议第三次全体会议上，全国政协委员、百度董事长李彦宏的发言值得我们深思。在会上他指出，只有建立完善的人工智能伦理规范，处理好机器与人的新关系，人们才能更多地获得人工智能红利，让技术造福人类。要实现这一目标，需要做到三点。一是明确人工智能伦理原则，明确人工智能在安全、隐私、公平等方面的伦理原则。二是强化领军企业担当，加快人工智能伦理原则落地，实现人工智能技术和伦理的协同发展。三是加强国际交流，引领行业发展，凝聚全球共识。为国际人工智能伦理研究贡献中国智慧。而在人工智能时代，新零售模式的出现得益于人工智能释放的红利，为了规范新零售的健康发展，我们必须积极进行新零售的伦理治理。


    * * *


    \[1\]俞越.人人都是产品经理.从盒马鲜生看“新零售”体验［BL/OL］.http://www.woshipm.com/it/834052.html.


    # 第五章　共生：人与半机器人和机器人的相处之道


    新世界：三元结构社会的生成逻辑


    新问题：三元结构社会的冲突表征


    新关系：三元结构社会的相处之道


    随着人工智能的快速发展、机器人的广泛普及和半机器人的出现，一种全新的社会结构——三元结构社会将生成，并对人的生存方式产生深远的影响。如何超前探索由人、半机器人和机器人共同组成的三元结构社会中的相处之道，共同构建一种和谐良性的社会关系，激发每一种人的美好品质，一起共建共治共享这个新世界，是一个充满挑战的新课题。


    在三元结构社会中，由于社会构成要素多元化，人与人之间的相处模式开始转变，情感倾向开始扭转，人之为人的意志能力开始被削弱，以及人们会出现对程序病毒的恐慌等新问题。因此，超前探索三元结构社会中的相处之道，把握好技术的量与度，让人工智能更好地造福人类；完善法律，发挥其治理作用；形成共识道德，保留人之特性空间；设立咨询机构，提高人们的心理沟通能力等，有利于人们为三元结构社会的到来做好充分的准备。


    ## 一、新世界：三元结构社会的生成逻辑


    按照百度百科的解释，机器人是指能自动执行任务的人造机器装置，用以取代或协助人类工作。半机器人（Cyborg，也叫半机械人）是一种“电子控制的有机体”，是一种一半是人一半是机器的生物。人类和智能机械结合在一起，构成半机器人，其兼备两者的优点。无论是机器人还是半机器人，它们都可以看作人的延伸，是人的本质力量的外化。


    随着人工智能的快速发展，机器人技术和半机器人技术也随之迭代更新。相对于半人机器人技术的发展而言，机器人技术的发展要较为领先，这一方面是因为技术的限制；另一方面是因为机器人的技术发展较为成熟，吸引了众多的投资者。但是，从长远来看，半人机器人的发展也具备巨大的潜在市场，特别是随着脑机接口（Brain-Computer
    Interface，BCI）技术的发展，半人机器人的出现更是指日可待。据Facebook公司的扎克伯格透露，其公司目前正在研究一款可用于AR眼镜的脑机接口技术，但该技术并非将AR眼镜作为植入性芯片，而是希望能将其开发成可量产的可穿戴设备。这就意味着，当这种可穿戴设备盛行于世时，半人机器人也会随处可见。届时，人类社会将由人的社会逐渐转变为由人、半机器人和机器人组成的一个新的社会——三元结构社会。'
