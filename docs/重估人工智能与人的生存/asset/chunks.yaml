    当然，在看到人工智能带来的技术创新优势的同时，还需要预防技术创新陷阱。人工智能主要分为三层（见图 3-5）：基础层由云计算、算法芯片等组成；中间层由计算框架、图像识别、语音识别等组成；应用层主要是指相关的产业运用人工智能的状况。在这三个层面，技术创新的主体差别巨大，与智能产业相关的应用层的技术创新，可以是各行各业各取所需，各自专注于将人工智能与本行业相结合，推动行业的技术创新，从而为赢得市场先机做好准备，如人工智能医疗手术机器人、人工智能门诊等。但是中间层和基础层则不同，基本上已被人工智能行业巨头所垄断，所以，它们拥有绝对的话语权和领导地位。换句话说，人工智能医疗技术的创新，是由人工智能行业巨头公司来领导的，对于人工智能医疗领域的从业者来说，他们能够做的就是顺应变革的趋势。


    ![img](img/txt004_5.jpg)


    图 3-5　人工智能金字塔


    这就告诉我们，人工智能医疗技术的创新，不仅是技术创新的问题，还要注意全球的舆论引导、伦理规范与制度规约问题。如果领头的人工智能医疗技术创新跑偏了方向，受到扭曲的价值观的诱导，医疗技术创新沦为资本的附庸，对于医疗领域来说是一场灾难，其他各行各业也将会被牵涉其中。因此，人工智能医疗技术的创新，要能够清楚地回答技术的创新究竟需要实现什么样的价值，这个价值是否是人类共同的价值诉求。人工智能医疗技术的创新，本质上是要解决医疗服务的需求问题，所以万不能以另外的动机为创新的原动力。


    总的来说，人工智能与医疗技术的创新，是要服务于社会的，是要满足广大社会公众需求利益的。人类如何利用好人工智能，创造更加美好的技术创新的未来，为自身的健康带来更多的有益的成果，这是医疗技术创新所希望达到的。


