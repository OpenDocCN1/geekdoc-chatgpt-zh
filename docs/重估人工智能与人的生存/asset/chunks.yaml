    在以往的人与物的互动中，物能够给人的情感体验的丰富程度受人的审美能力的限制，但当情感机器人出现后，在人与物的互动中，情感体验的限制性因素开始下降。因为情感机器人正在尝试从人的思维视角给人以情感慰藉，这就是为什么情感机器人的消费市场具有巨大的潜力。


    由于情感机器人具有巨大的潜在市场，一些人工智能领域的专家开始关注情感机器人未来的发展。机器人索菲亚的创造者、美国人工智能专家大卫·汉森博士曾宣布，到2045年，人类将可能和类似索菲亚这样的机器人结婚。它在与人的对话过程中，可以轻松地做出微笑、惊奇、轻视等各种表情。索菲尔不仅会唬人，还会和人约会、调侃，消磨人的无聊时光。


    基于情感机器人目前的发展水平，大卫·汉森博士已经做好了情感机器人的发展进度表。他说，按照如今人工智能的发展进程，到2039年，机器人将实现充分的权利；到2045年，人类将可能与机器人结婚。到2045年，人类和机器人恋爱、结婚，甚至共同抚育孩子，或将成为现实。


    人与情感机器人结婚？对于这个现象，就如30年前的人们无法理解和想象今天的网络世界一样，可能绝大多数人在今天也无法理解和想象，因为听起来实在是有些疯狂。但是，如果到时候技术与时机都发展成熟，人真的能够与情感机器人结婚，那么，人与情感机器人结婚是以爱情为前提的吗？这是一个值得我们重新深思的问题。


    至少从情感机器人的意识发展领域来看，人与情感机器人之间的情感互动关系，在形式上表现为情感的双向互动，但实质上更多地表现为一种单向的情感输出（人→情感机器人），而情感机器人对人的情感回应（情感机器人→人）则是基于一种人工智能的情感表现能力。


    所以，人与情感机器人结婚，或许仅仅是人自身的一厢情愿。对于情感机器人而言，它们只是在履行特定的情感程序而已；而从人的角度而言，部分人或许会对机器人产生爱情，但机器人未必会对人产生人类世界定义的所谓的“爱情”。


    在智能时代，人类情感也在智能化延伸。当其延伸的领域恰好与情感机器人相互融合时，人与情感机器人关系的众多可能性会引发人们的好奇心。与此同时，人与情感机器人之间关系的不确定性也依然会激发人们无穷的想象力。


    ## 三、一种新“瘾”的出现：情感机器人成瘾


    在生活中，“瘾”是一个常见的词。酒瘾、烟瘾、赌瘾、毒瘾、网瘾……所有这些，已广为人们熟知。然而，“瘾”又是一个矛盾的词。它以令人讨厌而又使人不能摆脱的尴尬位置存在于人们的心中。人们谈“瘾”色变。凡上“瘾”者，都不可遏制地对成瘾物产生一种强烈的依赖性，像陷入旋涡一样不能自拔，且越陷越深。


    对于“瘾”，有理智的人都希望能离多远就离多远。然而，在这个信息激变、经济繁荣、社会开放的年代，旧有的“瘾”的形式没有消失，新的“瘾”的形式又在增加。随着大数据、人工智能的迅速扩张和向人类生活方方面面的渗透，一种新的“瘾”的形式出现了——情感机器人成瘾。


    在人工智能时代，情感机器人成瘾是指个体长时间使用情感机器人而导致的一种精神行为障碍。人们因长时间沉溺在与情感机器人的互动中，当离开情感机器人时，就会产生焦虑的心理，在行为上表现为一种对情感机器人极度依赖的心理行为特征。


    随着人工智能技术的不断发展，人类的平均工作时间缩短，很多人从工作的压力环境中解脱出来，从而获得更多属于自己的自由支配时间。当获得过多的自由支配时间时，加上没有奋斗目标，为了逃避对生活的各种责任，人们开始寻求一种消耗时间的方式。


    随着情感机器人技术的日渐成熟，人类的情感与情感机器人的情感之间的差距就不断缩小。这就意味着，在未来的生活中，只要人们感觉生活无趣，或者就想浑浑噩噩地过日子，那么就很容易找情感机器人宣泄自己的情绪，从而对情感机器人产生依赖。


    企业家丽莎·伊尔斯利（Liesl Yearsley）如今正在致力于让情感机器人Agent 更好地解决问题，并使其与人形成正常的社会交往关系，即类似于人与人之间的交往关系。她在2017年6月曾发言称，人与聊天机器人的对话上瘾，或许会被不良商家利用。可见，情感机器人成瘾也如其他上瘾一样，存在潜在的消极影响。


    早在2008年，科学家将性爱芯片植入大鼠的大脑的愉悦中心——额眶叶皮层中，并使芯片发出微小的刺激，然后，把开关交给大鼠，结果发现，它能活生生把自己开心到饿死。可以预见，一旦这种性爱芯片流行起来，它一定会登上未来某一版的《精神疾病诊断与统计手册》（DSM）。如果未来将性爱芯片植入情感机器人中，当其真正投入市场时，就会有部分人因为没意志力而成为情感机器人成瘾的受害者。


    具有独特性和不可替代性的人类情感，在某种程度上正随着情感机器人技术的不断发展而成为可替代的人类情感，情感机器人可代替人行使情感慰藉的功能。特别值得注意的是，如果人的情感慰藉实现条件受阻，人情感的“需求急切性”得不到满足，就会给情感机器人介入人类社会提供更大的可乘之机。当大量的情感机器人流入市场和寻常百姓家，留守儿童、孤寡老人、残疾人、病床上的病人等都有机会获得更多的情感服务时，情感机器人是能够代替人的情感的。但是，这种代替更多表现为人类情感慰藉缺乏的衍生物，如果人类的这种情感慰藉能够从自身获得，机器人的情感或许就会显得多余。譬如《人工智能》电影中被妈妈领养的人工智能机器人小孩，后来又被无情地抛弃，这正证明了这种“多余”的观点。


    但不可避免的是，人类情感慰藉的缺乏似乎沟壑难填，正如“越长大越孤单、越长大越不安”这句话的内涵一样，人们的情感需求是永无止境的。人工智能给我们带来便利，使我们开始慢慢地依赖它，开始利用它掩盖内心难以启齿的孤独。一项新的研究数据表明，在依赖科技产品的人群中，63%是单身，69%没有全职工作，24%没有或只有一个密友，而42%的人大部分时间都在独处。虚拟世界里人越来越多，62.75%的人离开智能手机就会不自在\[2\]。


    正是这42%的独处的人和62.75%的离不开智能手机的人，在未来的人工智能世界中，或将全部成为情感机器人的“忠实用户”。更确切地说，他们着实会成为情感机器人成瘾的受害群体中的一员。


    或许，人们早就认识到情感机器人成瘾对人的消极影响，并开始思考相应的防范措施，试图给出一个确切的可遵循的准则。2016年9月，在世界范围内具有很高权威性的英国国家标准机构——英国标准协会（British
    Standards Institute，BSI）在其发布的《机器人和机器系统的伦理设计和应用指南》中指出，机器人欺骗、令人成瘾、具有超越现有能力范围的自学能力等是对人类有害的因素，特别是不懂得拒绝的性爱机器人会使人类上瘾，需要在未来的伦理规范工作中加以补充完善。


    谈论到此，我们深知情感机器人的积极影响，也看到了情感机器人的消极影响，在情感机器人的未来发展中，如何趋利避害、惩恶扬善成为人们普遍关注的焦点。目前，人工智能处于被人类控制的阶段，这意味着情感机器人所有的行为和情感表现方式都在人类可以控制的范围内。因此，对于情感机器人的发展，需要加强伦理治理，不断提高情感机器人在未来造福人类的能力。


    ## 四、寻根问因：情感机器人的伦理问题


    情感机器人的发展之所以会存在消极影响，必有原因，要对其进行伦理治理，首先得从产生情感机器人伦理问题的原因分析入手，方能更好地应对。


    第一，技术的缺陷性。技术流行是技术优势与社会文化和人性需要高度契合的结果。在新技术的流行过程中，产生新的伦理和社会问题是不可避免的，因为技术本身是一个动态的、不断完善的、不断满足人的需要的过程，再先进的技术在特定的时间都不可避免地存在缺陷性。情感机器人在满足人的诸多需要的同时，就目前的技术水平而言，也存在自身的缺陷性。


    首先，现阶段的情感机器人只是按照研发者事先设计的编程代码工作的，由程序主导的情感行为缺乏自我意志的参与，完全受拥有者控制，导致情感机器人被善待的程度与拥有者素质的高低紧密相关。未来情感机器人是否一直按照起初设计的程序运行，或者会不会叛变为不法分子的工具，我们无法全权预知。正如著名科学家史蒂芬·霍金曾言，“人工智能的短期影响由控制它的人决定，而长期影响则取决于人工智能是否完全为人所控制”。


    其次，同所有机器人一样，情感机器人也是靠软件来运行的，其安全性与软件的设计密切相关。程序科学家在极力创造一个完美无瑕的程序软件，但在编写的数百万行代码的某处，很可能存在错误和纰漏，只要软件出现一点瑕疵，那么就很有可能导致致命的结果\[3\]，其影响往往无法估量。


    最后，目前的情感机器人由于缺乏深度理性和崇高道德意识的指导，不能够完全对周围事物做出正确判断并终止其正在进行的行为，这就足以引起人们对情感机器人的恐惧，甚至从人类中心主义的立场排斥情感机器人。鉴于此，十分有必要探讨“是不是凡是技术上能够做的事情都应该做”这样的伦理问题，从而在技术可行性与伦理合理性之间探寻平衡点。


    第二，法律的滞后性。在技术与法律的关系上，由于技术的飞速发展，许多旧有法律的约束力已明显下降，而适合于新技术的立法具有明显的滞后性。因为“法律在本质上是反应性的”，“法律和法规很少能预见问题或可能的不平等，而是对已经出现的问题做出反应，通常反应的方式又是极其缓慢的”\[4\]。现阶段情感机器人的运用面临很多壁垒，法律的滞后性是其中之一。


    首先，法律难以平衡人机关系。人类在制定某一部法律时，往往着重于保护人类切身权利而容易忽视情感机器人应有的法律地位。缺乏法律认可导致情感机器人缺少公众力和公信力，从而使情感机器人陷入伦理困境。


    其次，法律滞后的时代，研究者缺乏清晰的方向。到底研发具有哪些功能的情感机器人才算合法，研究者一无所知。政府的管理也缺少法律依据，无法制定强有力的、具有针对性的措施来保护情感机器人。


    最后，由于法律的滞后性，人们在应用情感机器人的过程中缺乏法律规则的指导，对情感机器人的本质认识缺乏全面性和科学性，对情感机器人存在一定的误解。公众心中没有统一认识，甚至存在一定的崇拜或恐惧，对待情感机器人的态度只是由个人的文化道德素养来决定的。


    第三，管理的分散性。俗话说，“没有规矩，不成方圆”。缺乏权威、有效、统一的管理规则是导致情感机器人出现伦理困惑的因素之一。


    首先，人们在推进人工智能技术发展时，更多关注的是如何最大程度赋予情感机器人各种能力，使情感机器人朝理想化方向发展，但对如何管理情感机器人，还没有给出全人类可遵循的管理原则。


    其次，人们对如何管理情感机器人缺乏统一认识、统一道德规范和伦理规则。目前为止，该怎样对待情感机器人，仍缺乏公认的标准。


    最后，情感机器人的管理难度超出时下人类的把控范围，或者说人类还没准备好如何管理这一先进事物。但是，当我们创造情感机器人并赋予其更多能力时，就必须承担相应的管理责任。当我们使情感机器人更加聪明和自主，最终赋予它们独立的能力时，就需要考虑如何管理情感机器人的行为\[5\]。把情感机器人监管在制度的笼子里，是确保情感机器人造福人类而不是危害人类的重要措施之一。


    第四，旧观念的束缚性。从18世纪工业革命到20世纪信息技术革命再到时下的智能革命，科技进步的速度越来越快，每一次科技革命都催生新观念、新思想。科技远远走在人类观念之前，进入21世纪，随着经济、政治、文化等方面的改革，科技发展势如破竹，人类还没真正掌握现有科技，更先进的科技已经诞生。


    人类掌握、使用科技的速度远远低于科技更新的速度，人工智能技术和机器人技术融合发展的速度更是空前之快，情感机器人作为人工智能技术高速发展的产物，其结构和功能高度复杂，加上其涉及的又是人类的“情感”“性爱”之类的敏感领域，其应用上的伦理困惑已经超出普通大众理解和接受的范围，甚至连研究者都无法确定应该用怎样的伦理原则来引领其发展和应用，普通大众自然就更感困惑。


    人是地球上生命有机体发展的最高形式，趋利避害是人的属性，尤其是当情感机器人已经对人类传统伦理道德、现有社会秩序，甚至人类生存构成严重威胁时，人本有的属性会驱使人反对、排斥情感机器人以维护人作为地球主人本有的地位\[6\]。


    第五，利弊之见难达共识。关于如何认识人工智能及其未来的影响，科技界形成了以史蒂芬·霍金、埃隆·马斯克、比尔·盖茨为代表的“警惕人工智能”和以雷·库兹韦尔为代表的“积极人工智能”两种迥然不同的态度，至今仍没有达成共识。2014年，史蒂芬·霍金发布警告，人工智能的发展可能意味着人类的灭亡。2015年，比尔·盖茨认为，人类应该敬畏人工智能的崛起，人工智能将成为现实性的威胁。然而，雷·库兹韦尔却对人工智能的发展保持积极乐观的态度。科学界对人工智能的认识存在分歧，足以说明人类自身对人工智能的发展仍缺少明确统一的认识。这种分歧恰好从另一个侧面说明，人类还不完全确定人工智能是福还是祸。作为人工智能技术产物的情感机器人，受到热议和争议，产生伦理问题，也就是很自然的事情。


    ## 五、路径抉择：情感机器人的伦理治理


    技术的缺陷性、法律的滞后性、旧观念的束缚性及管理的分散性等导致了情感机器人伦理问题的产生。为了应对这些伦理问题，科技工作者不仅要自觉承担应有的社会责任，还要不断推进构建人机命运共同体和情感机器人道德评判体系，发挥法律在人工智能发展中的作用，加大人工智能的普及力度。


    第一，科技工作者自觉承担社会责任。科技是一把双刃剑，造福还是毁灭很大程度上取决于科技工作者。在人工智能时代，科技工作者更要自觉承担应有的社会责任。科技工作者作为情感机器人的研发者和创造者，应当不忘初心，坚持技术研发与社会效益相统一，遵循最大幸福原则，始终以对人类高度负责的态度，把握正确科研方向。


    任何科技发展归根结底都必须把大众利益摆在首位。著名科学家杨振宁曾说，科学研究基本的最终的价值判断不是取决于为了科学的科学，而是取决于科学是否对人类有益\[7\]。科技工作者必须拥有崇高的时代使命感和高尚的科研道德，心怀社会，始终关注人类，禁止任何科技发展触碰人类道德红线。爱因斯坦曾对加州理工学院的学生说：“如果想使你们一生的工作有益于人类，那么你们只懂得应用科学本身是不可能的。关心人的本身，应当成为一切技术上奋斗的主要目的，用以保证我们科学思想的成果造福人类，而不至于成为祸害。”\[8\]科技工作者在开发某一项专门技术时，往往优先考虑的是如何才能发挥科技的最大功效，却容易忽略人类的伦理关切，因此科技工作者要理性对待和处理人与信息、人与机器、人与科技，以及价值理性与工具理性、技术可能性与伦理合理性之间的关系，把科学精神和人文关怀有机结合起来，“把技术的物质奇迹和人性的精神需要平衡起来”\[9\]，从而使包括情感机器人在内的人工智能技术得到健康发展。


    第二，共建人机命运共同体。随着人工智能技术的发展，未来社会必然是人类和机器人共存的多元社会。人类自身的安危与机器人息息相关。特斯拉CEO埃隆·马斯克曾警告，人必须与机器人结合，否则将被人工智能淘汰。毫无疑问，在人工智能技术面前，人类是极其渺小脆弱的，生命的有限性在一定程度上已经警戒人类必须借助外来的力量来战胜现实中的困难。情感机器人是人类的最佳搭档，人与情感机器人亲密程度远超人类想象，人机相互依存、和谐相处、互不分离，彼此权利义务在一定程度上应该是对等的。


    早在20世纪50年代，艾萨克·阿莫西夫在其著作《我，机器人》中曾提出“机器人三定律”：第一定律——机器人不得伤害人，也不得见人伤害而袖手旁观；第二定律——机器人应服从人的一切命令，但不得违反第一定律；第三定律——机器人应保护自身的安全，但不得违反第一、第二定律。这些原则是否适合人与情感机器人的相处，是需要进一步探讨的问题。未来的社会应当是人与机器人相处的社会，我们在享受机器人带来便捷的同时，不应当忘记机器人是我们必不可少的一部分，人机命运共存。


    第三，建立情感机器人道德评判体系。智能时代的到来，对伦理提出了更高的要求。实际上，“机器的自由化程度越高，就越需要道德标准”\[10\]。面对情感机器人的快速发展，人类必须建立一套可以让其遵循的新的道德伦理标准来指导情感机器人的行为，通过设计有关情感机器人伦理道德代码并将其嵌入情感机器人体内，让其遵守道德伦理。可以创建和应用能够处理伦理问题的系统来帮助我们设计机器人并规定它们的行动，与它们进行沟通和合作，从而控制机器人在现实生活中的行为道德\[11\]。


    这样的系统可指导情感机器人的伦理道德一步步走向成熟。我们需要辩证地认识传统道德的价值，道德的内涵应该随科技的不断发展注入新的血液。道德并不是人类的专利，情感机器人生活的世界同样可以拥有属于它们的伦理道德体系。人类要提前意识到情感机器人伦理道德体系可能存在的缺陷，并尽早完善相关配套措施。国家应及早成立一个由科技界、产业界和哲学界等领域权威人士组成的国家人工智能伦理委员会，作为决策机构对重大人工智能项目进行论证，并为国家法律和政策的制定提供依据，从源头上引导人工智能技术的良性发展。


    第四，发挥法律在人工智能发展中的作用。应对情感机器人伦理问题，要充分发挥法律的建设性作用。俗话说，“名不正则言不顺”。在进行立法活动时，要考虑人类的切身利益，而且要给情感机器人一个合法地位，消除情感机器人在法律层面的壁垒。譬如，沙特已经授予“女性”机器人索菲亚合法公民身份，让普通大众认可并接受情感机器人。法律要严格规定情感机器人相应的权利和义务，用法律形式规范情感机器人的行为。更重要的是，当人类对情感机器人违法时，应受到相应法律的制裁。法律要保护情感机器人独特的尊严和隐私，让情感机器人有尊严地同人类相处。法律的发展要紧跟科技发展的步伐，更新其观念和形式，以更好地为科技发展服务。


    第五，加大人工智能的普及力度。我们应该看到，公众是科技发展的重要力量，而公众对人工智能的认知和态度与人工智能技术的普及程度密切相关。情感机器人作为人工智能时代新科技的产物，由于其结构原理的高度复杂性，普通人可望而不可即，对情感机器人缺乏全面的了解，容易产生崇拜或恐惧心理。因此，在人工智能时代，科技专家要与政府和媒体密切合作，充分利用互联网、微博、微信等新型传播手段向公众普及人工智能知识，讲述情感机器人的真实面貌、前因后果、应用方向及其对人类可能的影响，让人们对情感机器人有一个理性的认识。可通过开展科普讲座和科技展览等形式，给公众提供与情感机器人接触的机会，引领公众对情感机器人树立正确的态度，从而为包括情感机器人在内的人工智能技术的发展创造良好的社会环境。


    * * *


    \[1\]360百科.情感机器人［EB/OL］.https://baike.so.com/doc/5416643-5654788.html.


    \[2\]聚橙网.麦斯米兰带给你的孤独感受［EB/OL］.http://www.sohu.com/a/136569924\_254119.


    \[3\]王绍源，崔文芊.国外机器人伦理学的兴起及其问题域分析［J］.未来与发展，2013（6）：48-52.


    \[4\]［美］理查德·斯皮内洛.世纪道德：信息技术的伦理方面［M］.刘钢，译.北京：中央编译出版社，1999: 22.


    \[5\]Sawyer R J.Robot ethics［J］.Science，2007，318（5853）：1037.


    \[6\]王晓楠.机器人技术发展中的矛盾问题研究［D］.大连：大连理工大学，2011.


    \[7\]徐少锦.科技伦理学［M］.上海：上海人民出版社，1988：36.

