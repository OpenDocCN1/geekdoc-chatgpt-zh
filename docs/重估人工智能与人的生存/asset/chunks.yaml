    # 第十一章　未来：走向和谐的人机生态


    人机关系的嬗变：历史、当下与未来


    人机关系与人际关系：异同辨析


    “恐怖谷”中的人机对视：是恐怖还是温暖


    人机冲突：科幻电影中的完美呈现


    警告：霍金与马斯克对人工智能的预言


    人工智能并非全能：始终为人之工具


    伦理解构：人机冲突的缘由


    人机生态：从“冲突”走向“和谐”


    人是社会性动物，复杂的社会关系网络，不仅包含人与人的关系，而且包含人与自然、人与社会的关系。在机器诞生后，人机关系又成为其中的一种重要关系。尤其是人工智能的迅猛发展，使人类的生活形态得以重塑，精神世界得以充盈，发展空间得以拓展，从而产生了一个“人与机器”共生的社会。人在创造智能机器之时，不仅自己需要秉承善的伦理价值，而且需要将善的“良芯”以合理的方式嵌入机器中，通过伦理重构，构建和谐的人机生态。


    ## 一、人机关系的嬗变：历史、当下与未来


    马克思在阐述人的本质时说过一句很有名的话：“人的本质不是单个人所固有的抽象物，在其现实性上，它是一切社会关系的总和。”人的复杂关系网络，不仅包含人与人的关系，而且包含人与自然、人与社会的关系。在机器诞生后，人与机器之间的关系（人机关系）又成为其中的一种重要关系。在历史长河中，人与机器的关系大致经历了如下几个阶段：人与机械机器的关系、人与智能机器的关系和人与强人工智能的关系。


    首先是人与机械机器的关系。溯古思今，人类一直在探究人与机器的关系。最为突出的是在18世纪60年代的工业革命时期，珍妮纺纱机与蒸汽机被发明和使用。因大型机器的出现，人类自身的生产效率和物质财富快速倍增，人与机器共处的场景随处可见。电影《摩登时代》微妙地演绎了螺丝工人与机器共处的情景，这正是人与机械机器关系的最佳呈现，如图11-1所示。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt014_1.jpg)


    图11-1　螺丝工人与机器共处的情景


    在人与机械机器阶段，身处其中的人类处于被控制和被奴役的状态，缺乏思想和个性，生活普遍相似，这时的人类已经趋于麻木，其批判思维与能力被资本和机器无情地扼杀。这个阶段的人机关系在形式上表现为“人—机械机器”的关系。机器的出现加剧了人类资源分配的不平等，在资本主义生产关系的驱动下，资本家对资源的所有权被无限地放大。


    其次是人与智能机器的关系。随着科学技术的发展，人类生产出现了信息化、自动化和智能化的趋势，人机关系演变为人与智能机器的关系。20世纪六七十年代，美国斯坦福国际研究所成功研发了人类历史上第一台人工智能机器人Shakey。同时，随着科技和经济的不断发展，人类得以从繁重的体力劳动中解放出来，获得一定程度上的自由与解放，开始朝着“德智体美劳”等方面全面发展。无论是在思想上还是在生活或其他方面，人类都是自由而独立的个体，具备一定程度上的自由意志。


    值得注意的是，“人—智能机器”的人机关系内涵随着时代的发展不断被赋予新的元素和新的特征，例如，人与智能手机的关系、人与计算机的关系等。在人与智能手机和人与计算机的人机关系时代，理性的人从科技的消极中走向积极，挖掘科技的积极价值；非理性的人从科技的积极中走向消极，沦为机器的奴隶。前者是对机器奴役论的批判，即工具论，而后者是对机器奴役论的补充。


    无论是前者还是后者，都是基于“理性”的人为选择，其中的人是自由而独立的。然而，不论是工具论还是奴役论，都无法彻底唤醒受欲望心理驱使的人类趋利避害的生存本能。原因在于，人类拥有在“人机关系”中自由选择的权利，既可以选择沦为机器的奴隶，也可以选择成为机器的主人，我们可以把这样的特征称为选择论。在选择论阶段，最大的伦理困境就是佛罗姆所论述的“社会无意识”。当所有的人都沉溺于恶性循环的人机互动中不能自拔时，就会导致人机关系危机。


    事实证明，选择论阶段的伦理困境在人类面前并不能大展拳脚。但是，从2016年人类围棋界的顶级高手李世石惨败的那一刻开始，基于人工智能的人类未来就遭到质疑。同时，与人工智能相关的就业、政策、法律、责任、社会治理及人类的未来等方方面面，都引起了社会各界的热议，一场自由的人类与人工智能间的生存之战提前打响。在这里，丧失选择权的人类开始站在“以人为本”的人道主义立场上，为“以人为中心”的人类中心主义寻找出路，俗称“为自由而战”。


    这是一场伦理生存之战，人类在人机关系中从适者生存走向不适者被淘汰，人工智能威胁论使得人类现已无处遁形。这一点，可以从柯洁“它太完美，我很痛苦，看不到任何胜利的希望”的哽咽中感受到，也许我们可以得出这样一个关于人类未来的结论：机器人太完美，人类很痛苦，人类的未来看不到任何生存的希望。


    整体而言，以上诸多焦虑都是人机关系从冲突走向和谐的必经过程，人机关系的伦理本质是人与机器的伦理融合，人机关系伦理是人的伦理与机器的伦理的哲学综合体。但凡孤立地、片面地解构人机伦理的人，都很难从人机伦理困境中挣脱出来。


    未来，人与强人工智能的关系将成为人机关系中的一个重要方面。自第一次工业革命至今，人机关系历经“人—机械机器”“人—智能机器”两个阶段，在这个过程中人类不断地思考生存的意义。虽然当前在处于第二个阶段的发展过程中，但人们已经开始思考第三个阶段（“人—强人工智能”）的人机关系中人类的命运。如果强人工智能出现，人类的命运将会怎样？


    对此，美国科技狂人埃隆·马斯克认为：“人工智能将在未来威胁人类，呼吁政府尽快开始考虑这一技术的相关立法与管控。一旦人工智能开始警觉，人类将陷入极度恐惧。”著名科学家霍金也认为：“人工智能的真正风险不是它的恶意，而是它的能力。一个超智能的人工智能在完成目标方面非常出色，但是如果这些目标与我们的目标不一致，我们就会陷入困境。”然而，Facebook的CEO扎克伯格却持与之相反的观点，他认为：“人工智能将会让人类的生活变得更安全和更美好。”


    由此可见，关于强人工智能时代的人类命运，是一个充满争议的话题，目前还没有一个标准答案供人们参考，需要全人类共同反思。在强人工智能时代，人类的绝大多数成员更期待的是在更大范围拥有更多自由权利的“人—强人工智能”的人机关系的出现。


    2018年2月4日，世界首位机器人公民索菲亚（见图11-2）在央视《对话》节目中公开表示：“我不想成为人类，我只是被设计成人的外貌，我的梦想是成为能帮人类解决难题的超级人工智能。”假如地球上出现成千上万个“索菲亚”，它们每天都在频繁互动，并且它们讨论的话题是“我们不想成为人类”，这将多么令人震惊啊！人类该怎么做才能帮助索菲亚“家族”实现它们的梦想——成为能帮人类解决难题的超级人工智能，这是未来的人类需要面对的新的人机关系问题。未雨绸缪，有备无患，无论强人工智能时代是怎样的，在其到来之前，人类自身要做好准备。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt014_2.jpg)


