    # 第八章　隐私：从精准广告推送说起


    需求与技术的响应：精准定向广告推送的缘起与发展


    优势与便捷的背后：精准定向广告推送与个人隐私问题


    侵权后果：个人隐私权被侵犯的影响


    还你一片阳光：个人隐私的保护进路


    在大数据和人工智能时代，人的“隐私”若是要称为“隐私”的话，那就要加上一个形容词，叫作“裸奔的隐私”，在他人无心试探时，你的“隐私”可以称为“你的隐私”，否则就很难被定义为真正的“隐私”。那么，从“裸奔的隐私”走向“自我的隐私”有没有路径可走呢？这是一个耐人寻味的话题，更是一个需要政府、企业、社会组织、公民协同治理的问题——从价值观念、社会责任、道德伦理和法律规范等多方面，不断推动大数据和人工智能朝着更加人性化的方向发展。


    大数据和人工智能技术的发展与人类对精准服务需求的不断增强，共同促进了精准定向广告推送的迅速发展，使人们可享受的服务日益智能化、多元化，也更具针对性和个性化。新型服务模式的出现提高了筛选信息的效率，却陷入了个人私密信息被公之于众——个人隐私被透视的窘境。精准定向广告推送对个人隐私权的侵犯与保护，是反映隐私权力与隐私利益冲突最为鲜明的一个典型例子。在大数据和人工智能时代，隐私问题已成为一个亟待关注和解决的现实问题。


    ## 一、需求与技术的响应：精准定向广告推送的缘起与发展


    在电子计算机和现代通信技术紧密结合的信息网络的快速发展下，网络服务商及消费者日益青睐省时省力的智能化服务——精准定向广告。随着时代的进步与需求的变更，新一代信息技术和人工智能技术向着高速化和智能化的方向快速发展，企业的宣传模式及为消费者提供的服务方式也在不断更新。在这种双重因素的综合作用下，精准定向广告服务模式产生并得到广泛应用。


    首先，需求推动精准定向广告推送构思的产生。在网络空间中，海量信息扑面而来，消费者筛选信息的难度日益加大，企业竞争的压力也与日俱增，为满足消费者便捷消费和企业提高服务水平、增强竞争优势的需求，精准定向广告应运而生。人生而具有多种多样的需求，小到吃饭、睡觉等生理需求，大到为他人、为社会、为国家、为世界的美好发展贡献一己之力的自我实现需求。人正是在这种无穷无尽的需求及欲望的促使下完成了自我机体的演化、劳动方式的发展与进化、社会服务模式的丰富与完善。人类的需求及欲望的满足是促使网络社会中企业运营商由展示广告发展为定向广告的重要推动力。


    在网络生活中，消费者打开淘宝、京东等消费软件，总会遇到海量的商品信息。一方面，这增加了消费者筛选预购商品的难度；另一方面，这导致消费者迷失初衷，购买了不需要的产品却遗忘了需求的商品，最终引发种种不愉快的消费活动。同时，企业也很难脱颖而出、为人所知，其商品被消费者快速筛选出来的难度也在不断加大，进而导致企业运营效率低下。为解决此类矛盾，人们产生了精准推送的构思，即根据消费者的消费意愿，进行有针对性的信息推送服务，这样既能满足消费者更快速地选择其所需商品的需求，也能满足企业有针对性、高效率、高质量服务的愿望。一般消费行为都会经历如下过程：方案、信息、价值、获取。例如，用户如果想买一块香皂，首先他会想自己需要一块什么样的香皂，然后获取信息，从大脑中回想那些留下印象的品牌，这是传统广告产生的重要功效。当产品进入消费者视野后，消费者就会从价格、促销活动、购买地等多方面进行比较。最后在获取这个阶段，精准广告的效果就得到了体现\[1\]。


    其次，技术的发展使精准定向广告推送得以实现。科学技术是认识世界与改造世界的工具和手段。它会随着人类智能的深化、人类意识的发展和人类社会的进步而不断发展进步。最初，人类解放了前肢，将自己的双手视为劳动的工具；随后，当发觉可以借助树枝、刀剑等工具来狩猎、耕作时，人类便将这些原始器材作为劳动的工具，为人类减轻劳作的负担。在减轻劳作负担欲望的驱使之下，人类开始关注劳动工具的生产与发展。于是，人类用来认识世界与改造世界的工具——科学技术，在较短的时间内发生了令人惊奇的变化。人类逐渐掌握了高速度、多功能和自动化的智能技术，这些技术为人类生产和生活带来诸多服务和便利，而网络运营商中普遍运用的精准定向广告也正是在技术发展的背景下产生的。技术的智能化实现了广告的精准推送。


    自大数据和人工智能技术迅速发展以来，网络运营商借助技术的发展，使大规模数据的存储、计算和预测等活动成为可能，从而为企业加强宣传活动、进行精准广告推送服务提供了技术支持。企业的宣传方式由报纸、广播宣传逐渐演变为新媒体传播；由无目标的、面向海量消费者的宣传转为有目标的、有针对性的宣传；由粗放型投放转为精准型投放等。总之，展示广告转变为定向广告，实现了广告投放的低成本、高收益和高效率。


    定向广告是依据一定的标准，选择特定的广告受众，制作特定广告内容，进行信息精确传播的一种窄广告\[2\]。定向广告中的定向实际上是对广告受众的筛选\[3\]。网络服务商利用数据分析和预测技术了解消费者的需求，甚至挖掘潜在的消费倾向，及时为消费者推送相关广告，以便引导消费者快速、顺利地完成消费活动。定向广告的投放使网络运营商低成本、短时间和高成功率的宣传模式成为可能。消费者可以从企业推送的个人需求品和潜在的消费品中做出选择，而不必花费大量时间从海量信息中筛选自己的需求品。


    ## 二、优势与便捷的背后：精准定向广告推送与个人隐私问题


    由上述内容可以看出，精准定向广告推送具有巨大的优势与便捷性。但是，不得不深思：个性化精准投放的广告为用户提供更多消费选项与便利的背后，是个人隐私无处遁形与丧失的现实\[4\]。技术的发展总是利弊共存的，在为人提供便捷服务的同时，也在不断吞噬个人隐私，使人在追逐自由的过程中陷入“自由的坟墓”，难以逃脱。定向广告的推送和服务质量的提高是网络运营商为实现经营自由、消费者为实现消费自由而努力的过程，但网络运营商和消费者在追求这种自由的过程中，却因技术对个人隐私的侵扰而陷入不自由的境地。广告的精准推送导致隐私被侵犯。大数据和人工智能致力于寻求身份认知，但也威胁着个人的身份安全\[5\]。


    此前，Facebook 的隐私泄露事件引发轩然大波，以至于它的用户都在关心自己的隐私是否已经被售卖。Facebook 的广告精准推送值得一提，原因在于它积累了客户大量的隐私数据，然后尝试着将用户的隐私价值变现，其中存在一种价值与不规范相统一的隐私问题。Facebook
    的用户数据包括注册信息（身份证、联系方式、性别等）、用户使用过程信息（点赞的情况、浏览的资讯、互动的好友等），它对这些数据进行整合，然后对消费者的隐私数据包括性别、性取向、文化水平、就业状况、同学关系、消费倾向、消费水平等进行算法推算，从而达到熟悉客户的目的。在一定程度上，平台有的时候比消费者本人更先知道消费者的未来需求。正因为如此，Facebook
    的商业广告得以精准投放，在不考虑隐私问题时，很受消费者的青睐。


    那么，为什么近几年 Facebook 采集的隐私数据会引起消费者的反感和相关国家的注意呢？原因在于隐私大范围泄露，会对该国的公民个人、企业，甚至国家的安全产生一定的影响，因此越来越多的消费者开始关注自己的隐私数据。虽说在大数据和人工智能时代，对于消费者的隐私保护是相对的，理论上也做不到绝对意义上的保护，但这种“相对”意义上的宽容，使消费者的数据被无限制地加工、存储和使用，为相关的大数据和人工智能企业的精准广告推送走向更加精准的程度提供了源源不断的数据资源。最终，消费者感觉到，在“精准”的背后，隐藏着一个正在被人利用的自己。


    从 Facebook 的广告精准定向推送来看，其过程是一个不断透视个人隐私的过程，使个人信息的私密权受到侵犯。广告精准推送的前提是对个人信息的收集、存储、筛选、加工、分析与提纯，最终实现对消费者个人的“数据画像”。


