    ## 第一章　引言：未来已来，人工智能与人的生存


    概念辨析：数据、信息、知识、智慧与智能

    关系梳理：人工智能与人类智能

    历史脉络：人工智能的三起两落

    影响分析：本书的目的、内容和结构


    人工智能革命，也如同以往的数次重大科技革命一样，在人们还没来得及做好充分的迎接准备时，就已渗透到人类生存的方方面面，已经并将继续对人类的生活形态、精神世界、发展空间产生深远的影响。人工智能正在以其强大的技术优势“成了一种力量，一种生机勃勃的精灵”，重塑着人类生存的一切，甚至包括人类本身。


    ### 一、概念辨析：数据、信息、知识、智慧与智能


    人工智能和大数据时代是一个新兴技术普遍、深度卷入人类社会生活的时代。在这个以科技为支撑的新时代里，每个期望更好地生存和发展的人，都应该深刻理解与这个时代密切关联的一些“关键词”——首先需要了解数据、信息、知识、智慧与智能这五个概念，以及它们之间的关系。


    数据是指通过特定的手段和载体，将客观事实进行逻辑归纳和记录的结果，其存在的形式多种多样，如符号、文字、数字、图像、音频、视频等。由于数据只是对客观事实的记录和描述，就其本身而言，不具有意义，只有经过加工、提炼的数据（信息），才具有潜在的意义。从数据的存在状态来看，存储于相关载体的数据是静态数据，在系统数据流中的数据是动态数据。从数据与信息、知识的关系角度而言，数据是指构成信息和知识的原始素材，是产生信息、知识、智慧和智能的基础条件，具有无逻辑、离散等特征。


    信息是指经过加工后的数据。由于原始的数据类型多种多样，且具有无逻辑、离散等特征，人类为了更好地认识世界和改造世界，势必要通过直接或间接的方式，将原始数据经过加工改造，使之成为可以服务于人类规则的数据，即信息。


    知识是系统化的信息，是对信息进行筛选、处理、综合、分析之后产生的彼此之间相互关联的数据，它不是信息的简单相加，而是多维信息的有机统一。古希腊著名哲学家柏拉图指出：一条陈述能称得上是知识必须满足三个条件，即它一定是被验证过的、正确的，而且被人们相信的。因此，知识本身有真知识和假知识之分——凡是经不起验证的、不能令人信服的系统化信息，它本身也不能算是知识，只能算是假知识。


    知识的相互关联及系统化，为人们提供了从全局分析事物的工具，从而锻炼出人们发现问题、分析问题和解决问题的系统化思维能力，这就是智慧。智慧的形成过程就是从感性知觉（感觉、知觉、记忆等）到理性思维、直觉与灵感的过程。


    智能是智慧与能力的合称。从感性知觉到理性思维、直觉、灵感的过程称为智慧的过程，再由智慧指导行为表达的过程，就是一个智能的过程。智能分为人工智能和人类智能，人工智能包括弱人工智能和强人工智能。按照霍华德·加德纳的多元智能理论，人类智能又包括语言智能、数学逻辑智能、空间智能、身体运动智能、音乐智能、人际智能、自我认知智能、自然认知智能，如图
    1-1 所示。


    ![img](img/txt001_1.jpg)

    图 1-1　加德纳多元智能理论


    数据、信息、知识、智慧与智能之间是一种逐渐升维的关系，如图 1-2 所示。在特定的条件下，彼此之间能够实现相互转换和升维发展。经过加工的数据成为信息，信息之间的相互关联成为知识，知识的系统化开始产生智慧，智慧加上能力则形成智能。


    ![img](img/txt001_2.jpg)

    图 1-2　数据、信息、知识、智慧和智能的关系


    在智能形成的前提下，随着工具的演化，智能开始出现分支，分为人类智能和人工智能两大类。由于本书着重探讨人工智能对人类生存和发展的影响，因此以下章节将集中力量叙述“人工智能+”的变革力量。这里，首先需要对二者的关系做进一步的梳理。


    ### 二、关系梳理：人工智能与人类智能


    人工智能与人类智能的关系问题，自计算机发明和人工智能诞生之日起，就引起了广泛的关注和激烈的争论。人工智能之父阿兰·麦席森·图灵（Alan Mathison
    Turing）曾指出：如果一台计算机能骗过人，使人相信它是人而不是机器，那么它就应当被称为有智能。这意味着，只要机器能够拥有使人相信它是人而不是机器的能力，这台机器就具备了人工的智能。但自阿尔法狗诞生以来，不断发展中的人工智能使人们相信它是人而不是机器的能力越发明显，人工智能与人类智能的关系日渐模糊。对人类而言，不确定性具有不断超越自身迈向确定性的内驱力，所以，对于逐渐发展完善的人工智能技术，人们渴望在一个充满确定性的自由王国里看待人工智能与人类智能之间的模糊关系，并试图从中寻找某种确定性的未来。


    人工智能与人类智能之间是既对立又统一的关系，彼此相互联系又相互独立，相辅相成又相反相成。


    其统一性可以从两个视角来看。从智能行为的目的来看，人工智能与人类智能的智能行为都是智慧指导行为表达的过程，两者之间存在着共同的目的论意义，都是为了达到某种预期的目的而表达的智慧行为。著名技术哲学家芒福德（Mumford）指出：技术元素赋予技术以生命，人是技术进化的动力……技术元素的发展虽然具有一定程度的自主性，但是它的发展轨迹从某种意义上来说也是人类意志的体现。人工智能作为“技术元素”的综合载体，是人类智能意志迁移的结果，这种迁移不是简单的技术再现，而是基于满足人类深层目的的价值诉求，而人工智能在这个过程中仅仅扮演一个承载人类目的的角色，代替人类追寻特定的价值目的。在这个层面上，人工智能与人类智能在智能行为的目的上，具有内在的统一性。


    从本质来看，人工智能是人类智能的弥补、延伸和增强，是人类智能在人工机器中的技术再现的智能。所以，从人类智能的角度而言，人工智能是对人类智能的模仿，是以人类智能为原型的技术再现。人类在进化的过程中，需要不断地感知世界、认识世界和改造世界。随着人类的进化，认识世界和改造世界的活动也随之变得复杂，依托工具谋得“万物之灵”称号的人类，对于技术的演进不得不使其更接近于甚至超越于人类本身，只有这样，工具的存在对于人类而言才更具价值和意义。这就意味着，人工智能的发展势必受到人类智能的影响和制约，人类智能越完善，人工智能就发展得越快。反之，人工智能的发展也为人类认识世界和改造世界提供了更加便捷、高效的手段，进而促进人类智能的进一步发展完善。因此，人类智能与人工智能之间不仅存在目的论意义上的内在统一性，还存在主从属性的相辅相成关系。人类社会中的技术、需求、市场和文化在决定人工智能的发展道路时，人工智能也在不断地回报人类以更多的福利——自由、解放、主动性、创造性等，从而使人类智能转向更核心的科技创新和思维判断上来。


    之所以要研究人工智能与人类智能的对立统一关系，是因为人类如果能够厘清两者之间的内在统一的关系，就能够更快地促进人工智能的发展与完善；如果人类能够清楚地厘清两者之间的对立性，依附于人类智能而发展的人工智能，必将朝着更加有利于人类发展的方向前进，而不是令其从与人类共进退的生态系统中隐蔽或者异化。若是不能正确地将两者的内在统一性认识清楚，将会导致人工智能的发展停滞；若是不能正确认识两者之间的对立性，人工智能的和谐论与冲突论之间的论争也就失去了理论意义。因此，在把握两者的内在统一性的前提下，也需要进一步从三个方面把握好两者之间的对立性。


    从生物学意义来看，人工智能与人类智能具有不同的生命形态，人工智能属于硅基生命，人类智能属于碳基生命。海德格尔认为，“生命是指在存在中的存在者”[1]。但是，从这个生命的定义来看，很容易发现，在人工智能与人类智能之间无法对其进行明确的区分，很容易导致混淆，也更容易走上人工智能异化的道路。这时，生物学意义上的“生命”作为中介得以发挥作用。


    生物学意义上的生命是指在时空变化过程中，能够实现自我生长、繁衍、感觉、意识、意志、进化、互动等丰富可能的一类现象[2]。从生物学意义来看，一个物体能够被赋予生命体征，就要具备三个条件：第一，能够自我生长；第二，能够繁衍后代；第三，能够主动适应生存环境。就目前来看，人工智能尚处于弱人工智能阶段，就其本质而言仅仅是工具，是一个随时等待执行指令的“冰冷铁块”。甚至可以说，目前要想赋予其生命这件事对于人类而言都是无能为力的（至少目前没有实现）。但是，人类智能则不同，其存在的特征会随着生命的产生而产生，也会随着生命的消亡而消亡，其本身也就具备了生命的特征。


    1891 年，波茨坦大学的天体物理学家儒略·申纳尔（Julius Sheiner）认为，存在一种以硅为基础的生命的可能性，申纳尔提出的这种生命的可能形态是相较于碳基生命而言的。因此，人工智能与人类智能的生命形态，不具有比较的前提，彼此之间并不存在生物学意义上共同的生命构成。换句话说，人工智能与人类智能是根本相异的生命形态，人工智能属于硅基生命，而人类智能属于碳基生命。


    从智能的物质承担者来看，人工智能的承载者是人工物的符号处理系统，人类智能的承载者则是人的大脑。早在 20 世纪 50 年代，就有不同的观点认为，人工智能的智能承载者是处理思维符号的系统，是一种致力于用计算机示例世界的形式化表达和仿真神经元的交互。当下的人工智能的物质承担者则是一种以深度学习、图像识别、神经网络、语音识别等综合技术为支撑的程序操作系统，其本质上是对人类大脑的简单模仿。正是由于这种模仿还未触及人类智能行为发生的本质，所以，人们很容易将人工智能的缺陷归结为“还原主义”的弊端所致。而人类智能的物质承担者是人脑，是高度组织起来的复杂体系。人类智能主要是生理和心理上的多层次和错综复杂的运动交互过程，是一种有高级神经中枢组织的复杂的生理心理过程，它是基于人类躯体的自生活动，智能活动与人类本身具有统一性。人工智能则不同，人工智能的智能载体是一种人工物。换句话说，人工智能的智能活动的驱动力不是产生于人工智能本身，而是对人类具有极端依附性的。


    从智能的思维方式来看，人工智能善于处理程序性问题，却不善于抽象思维，而抽象思维却是人类的强项。人工智能在程序性问题面前会显示出超人的能力，能够以远超人类的效率并高质量地完成特定的任务。从几何学的意义上讲，程序性的问题表现为点与点、点与线、点与面、线与线、线与面的函数映射关系，由于特定的映射条件，使得人工智能的高速算法最终能够回归到确定的值域范围。但是，从一个更宽泛的领域而言，当确定性的条件被打破时，人工智能相较于人类智能的思维优势也就消失了——这是线性思维的局限性。人工智能能完成复杂的股票高频交易，但对场景的整体理解可能还不如一个
    2 岁的孩子；人工智能能帮助一位妈妈做家教，但代替不了母亲温柔的眼神。抽象思维是指人类运用概念、判断和推理等思维方式对客观现实进行直接或间接的概括和反映的过程，不同的人对于同样的客观现实的反映，会得出不同的结果，进而促进了人类思维的多元化发展。多元化的交互过程使得人类的抽象思维极具复杂性，达到人工智能线性思维无法企及的地步。然而，不同的人工智能机器，对于同一个问题的回答，其答案基本是确定和唯一的，难免会呈现机械和僵硬的智能特征。


    ### 三、历史脉络：人工智能的三起两落


    1950 年，阿兰·麦席森·图灵（Alan Mathison Turing）在《心灵》杂志上发表了一篇具有划时代意义的论文：《计算机器和智能》（Computing
    Machinery and Intelligence）。在这篇论文中，他提出了人工智能领域中的著名实验——“图灵测试（Turing Test）”。正是由于这个测试对人工智能的未来发展意义重大，奠定了图灵在该领域的坚实地位——人工智能之父。他是这样定义机器智能的：“如果一台机器能够与人类开展对话而不被辨别出其机器的身份，那么就称这台机器拥有智能。”就在同一年，图灵还预言：人类最终将拥有能够创造出智能机器的可能性。


    1955 年 8 月 31 日，由约翰·麦卡锡（John MC Carthy）、马文·明斯基（Marvin Minsky）、纳撒尼尔·罗彻斯特（Nathaniel
    Rochester）和克劳德·香农（Claude Shannon）联合递交的一份关于召开国际人工智能会议的提案中，首次提出“人工智能”（Artificial
    Intelligence）一词。1956 年夏天，在美国的达特茅斯学院举行的会议，首次将人工智能作为讨论对象进行探讨。也正是在这次会议上，人工智能的概念被明确提出——人工智能正式诞生了。


    自人工智能诞生至今，短短 60 多年的时间里，其发展大落又大起，跌跌撞撞，几经波折，总的发展历程概括起来可谓是“三起两落”，如表 1-1 所示。


    表 1-1　人工智能的“三起两落”


    ![img](img/txt001_3.jpg)

    续表


    ![img](img/txt001_4.jpg)


    （1）人工智能的第一次崛起（20 世纪 50—70 年代）。1956 年世界达特茅斯会议之后，人工智能的发展迎来第一次热潮，开始逐渐走向全世界。在这近 20
    年的时间里，人工智能被广泛应用于数理逻辑推理与自然语言处理等领域，用来解决代数、几何和英语等问题，其优势相较于人而言较为明显，给予了众多人工智能领域的研究学者以信心。甚至在当时，很多学者认为：20
    年内，机器将能完成人能做到的一切。同时，这股热潮也极大地鼓舞了很多著名高校投入到人工智能的研究领域，甚至已经开始撬动政府机构的大额资金，如美国国防高级研究计划署（APRA）的人工智能研发资金等。


    政府、高校、学者都参与到人工智能研究中，各种研究成果竞相涌现。1966 年，世界上第一台聊天机器人 ELIZA（见图 1-3）问世；1972 年，世界首台人工智能移动机器人
    Shakey 诞生。Shakey 是一款带有视觉传感器的机器人，能根据人的指令发现并抓取积木，成为历史上首台能够采用人工智能技术的移动式智能机器人。


    ![img](img/txt001_5.jpg)

    图 1-3　世界上第一台聊天机器人 ELIZA


    （2）人工智能的第一次跌落（20 世纪 70—80 年代）。人工智能的异军突起，在经历了世界性的热潮之后，由于受当时理论和技术水平的限制，遭遇了第一个发展低潮。20
    世纪 70—80 年代，人工智能技术的发展还处在不成熟阶段，当时主要存在三方面的问题：一是数据挖掘技术落后，用于训练人工智能机器的数据难以大批量获取；二是人工智能机器的运算能力不足，无法运行复杂的程序；三是人工智能机器的学习能力不足，无法与外围世界进行有效的人机交互。


    另外，由于社会对人工智能有过高期望值，而其持续发展未能满足社会的期待，再加上人工智能科研人员对研发项目的难度预估不足，导致与美国国防高级研究计划署的合作计划失败。最终，使得人工智能声誉日损，社会各界对于人工智能的信心大打折扣，政府和高校撤回了对其研发工作的经费支持。


    （3）人工智能的第二次崛起（1980—1987 年）。人工智能遭遇第一次的阵痛，其发展速度大为减缓，但并没有完全停止，最终在坚守中看到了新的曙光。1980
    年，卡内基梅隆大学为数字设备公司设计了一套名为 XCON 的“专家系统”，再次让人工智能重回大众视野。这套“专家系统”是由综合数据库、知识库和一个推理机组成的，如图
    1-4 所示。在投入公司运营后，以其卓越的专业知识、技能和智能算法系统，为该数字设备公司每年节约了近 4000 美元的经费，并迅速引起其他大型公司的模仿，催生了第二次人工智能的热潮。


    （4）人工智能的第二次跌落（1987—1993 年）。然而，人工智能的第二次崛起好景不长，似乎比第一次跌落得更快。仅在 7 年之后，人工智能专家系统的弊端再次败露。经过
    7 年的具体实践，人们再次发现，该专家系统仅能应用于部分特定的情景中，而不能将其投入更为广阔的市场。此时，人们不禁感叹，当前的人工智能在理想状态中是“无限好”，但又是“近黄昏”。


    ![img](img/txt001_6.jpg)

    图 1-4　专家系统工作原理


    （5）人工智能的第三次崛起（1993 年至今）。人工智能技术的发展并不是一帆风顺的。在经历了“两起两落”之后，人们对人工智能的发展有一种“山重水复疑无路”的普遍困惑，但部分专家仍然一直坚守在遭受“冷遇”的人工智能领域，经过数年的艰难探索，终于“守得云开见日出”。1997
    年，人工智能计算机“深蓝”战胜世界冠军卡斯帕罗夫；2005 年，美国国防高级研究计划署发起一项全球性挑战项目——要创造出一种可以在沙漠中行驶 200 多千米的自动机器人，这为未来的人工智能研究起到了加速作用，越来越多的人开始重新看好人工智能；2016
    年，谷歌阿尔法狗战胜韩国李世石。


