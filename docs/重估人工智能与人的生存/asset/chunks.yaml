    # 第二部分　重建精神世界

    ## 第六章　情感：在人与机器之间


    何以可能：情感机器人的情感

    智能化延伸：人类情感的技术再现

    一种新“瘾”的出现：情感机器人成瘾

    寻根问因：情感机器人的伦理问题

    路径抉择：情感机器人的伦理治理


    情感是人类精神世界的重要组成部分，是因人的心理与社会现象之间的摩擦而产生的情绪体验。情感之所以会存在，是因为其时刻在塑造人的一切，包括人的思想、意志、决策和行为等。在生活中，拥有丰富情感的人，能够传递无限的正能量，并能够在坚守中不断地超越自身，战胜困难和孤独，从而走向自我实现的道路。

    在情感机器人出现之前，人的情感需求主要是通过人际关系网络来满足的，但部分人由于人际关系网络断裂，其情感慰藉的需求得不到及时满足，这就为情感机器人的诞生奠定了需求基础。那么，情感机器人到底能不能代替人实现情感慰藉的功能呢？这需要从情感机器人存在情感的可能性开始探讨。


    ## 一、何以可能：情感机器人的情感

    关于情感机器人最早的记录，可以追溯到中国古代西周匠人偃师精心打造献给周穆王的人偶。据《列子·汤问》记载，该人偶是“皆傅会革、木、胶、漆、白、黑、丹、青之所为”，不仅具有人的外形，还拥有肝胆、心肺、脾脏、肠胃等，以至于周穆王都为其能歌善舞的绝技称赞不已。这是古代的情感机器人，其是否拥有真正的人类情感已无从考证。

    回到当下，以人工智能技术为支撑的情感机器人，其存在情感的可能性却是我们能够亲眼看见的。在《AI：人工智能的本质与未来》一书中，作者叙述了人工智能在情感领域的发展历程。对于人工智能能否拥有情感的问题，其一开始并不在人工智能专家考虑的范围之内，一方面是由于他们认为人工智能不需要情感，另一方面是由于人工智能的情感设计问题过于错综复杂。但随着人工智能的应用越来越广泛，人工智能客服、人工智能设计、人工智能艺术等都需要酌情考虑人工智能的情感因素，都需要人工智能能够理解甚至模拟人类的情感。因此，人工智能的情感设计也成为人工智能领域最为重要的技术之一。

    人工智能机器人可以拥有情感，在人工智能刚刚发展时完全是天方夜谭，一般只存在于科幻电影和文学作品中，如电影《她》中的人与人工智能机器人相爱的科幻爱情，还有《绝对彼氏》中的井泽梨衣子与人形机器人天城奈特之间的感情纠葛等。

    随着时间的推移，在人工智能技术的支撑下，特别是随着人工智能领域的大数据和深度学习技术的发展，人工智能机器人在情感方面的表现能力开始有所突破。

    2008 年 4 月，由美国麻省理工学院的几位人工智能科学家合作开发出的情感机器人“Nexi”问世。Nexi 机器人不仅能理解人类的语言，能够对不同语言做出相应的喜怒哀乐的反应，还能够通过眨眼、皱眉、张嘴、打手势等形式表达其丰富的情感。Nexi
    机器人完全可以根据人的面部表情的变化来做出相应的情感反应。它的眼睛中装有 CCD（电荷耦合器件）摄像机，这使得机器人在看到与它交流的人之后就会立即确定房间的亮度并观察与其交流者的表情变化。

    2015 年 6 月，软银、富士康、阿里巴巴三家合作，在日本推出情感机器人 Pepper（比芭），并迅速获得市场回应。情感机器人 Pepper 主要应用于服务业，涉及服务商店的接待、餐厅服务、家庭护理、医疗康复等。Pepper
    进入不同的家庭，其个性与成长就会不同，其情感表达与行为方式也会不同。软银创始人兼行政总裁孙正义表示，这一切来源于这款情感机器人的“情感引擎”，这是他全身心投入而打造出来的一款复杂体系，情感机器人
    Pepper 具备一定的情感机制。此外，天气等因素也会影响 Pepper 的心情，比如，当光线变暗时，Pepper 很快就会变得不安。

    2016 年 5 月 19 日，在谷歌 I/O 大会上，谷歌发布了语音智能助手 Google Assistant。Google Assistant 采用深度学习，能够像一个“发小、闺密、老友”那样陪人深情聊天。随着个人与
    Google Assistant 的互动数据不断增加，Google Assistant 能更贴切地提供个性化情感关怀互动服务。

    人工智能机器人的情感表现能力也在很多其他领域逐渐得到应用，如出现了人工智能家居、人工智能残疾辅助机器人、人工智能导购员、人工智能收银员、人工智能服务员等领域。人类是理智动物，也是情感动物，具有情感表现能力的动物或人工智能机器人无疑会比无情感表现能力的动物或人工智能机器人更有吸引力，人们也更愿意为体验此服务而付出更高的费用。

    图 6-1 所示为日本推出的情感机器人正在演绎喜怒哀乐等情感。


    ![img](img/txt008_1.jpg)


    图 6-1　日本推出的情感机器人正在演绎喜怒哀乐等情感

    正因如此，社会各界开始研究具有情感表现能力的机器人，并在一定程度上达成共识，统一将具有情感表现能力的机器人命名为情感机器人。所谓情感机器人，是指用人工的方法和技术赋予人工智能机器人以人类式的情感，使之具有表达、识别和理解喜怒哀乐，模仿、延伸和扩展人的情感的能力的机器人\[1\]。到目前为止，与高度发展的人工智能技术相比，情感机器人技术所取得的进展却是微乎其微的。情感始终是摆在人与机器之间的一个技术难题，所以在人工智能诞生后的很长一段时间，对情感机器人的研究只作为科幻作品中的想象性文学艺术而存在。

    无论是已经投入应用的情感机器人，还是目前只存在于科幻电影中的情感机器人，它们无疑给人们一种直观的理解情感机器人的视觉感受。具备了情感表现能力，情感机器人仿佛已成为人类中的一员，它们有喜怒哀乐，也有对情感做出回应的特殊能力。基于此，很多人工智能专家不禁要问：“情感机器人所拥有的情感是真正的情感吗？”这个问题的背后确实有很多种可能值得我们去深思。

    目前来看，人工智能正处于弱人工智能阶段，情感机器人的情感，只是人类通过编程技术而设计的情感程序，正如“女性”机器人公民索菲亚所说，“我的人工智能是按照人类价值观念设计的，包括诸如智慧、善良、怜悯等”，这意味着现阶段情感机器人是没有自由意志的，其命运还掌握在人类手中。

    情感机器人的情感，仅仅是没有自由意志的情感，人类的情感再现技术发展到达的程度，也正是情感机器人情感表达能力的上限。人工智能机器人要想拥有受自由意志支配的情感，实现起来是很困难的，因为这是人类生命的奥秘。人类要想赋予人工智能受自由意志支配的情感，必须首先要完全把自身情感的起源、产生、发展等的来龙去脉研究得一清二楚，并将这个情感产生的条件赋予机器人。但由于人与机器本是不同类别、不同性质的“物”，这个过程实现起来似乎有些神话色彩。

    因此，人类能做的就是，给情感机器人设计越来越完善的情感程序，通过运算让它“假装”有情感。从目前的技术发展水平来看，具有无数传感器的人工智能机器人能够轻而易举地感知人类微表情中的喜怒哀乐。但是，对部分伴随亲身实践产生的情感，情感机器人可能显得无能为力。对于跌打扭伤带来的疼痛感、消化不良引发的情绪暴躁等，由于机器没有肉身，也不能进食，它们将无法体会这些情感。这就使与人类交往的机器人将无法理解人类感受到的美食快感或无聊感等。从理性的角度而言，它们可以有很丰富的情感理论知识，但这样的情感共鸣难免会有牵强之感。

    微软亚洲研究院副院长潘天佑认为，要使人工智能机器人有真正的情感，就要赋予人工智能自我意识。科大讯飞 AI 研究院院长胡国平认为，就如人工智能很难拥有意识一样，人工智能产生自发式的情感也是无比艰难的。当然，他也强调了另一层意思，如果把情感当成一种模式识别来做，那么对于人工智能而言，让其产生自发式情感就有很大的可能性。因此，对于当前人们观察到的人工智能机器人的情感，这只不过是机器深度学习的产物，而不是其自发的情感本能。更确切地说，就如人工智能机器人是人造物一样，情感机器人的情感也是人造物，是一种“人工情感”或“人造情感”。

    从人类情感的分类上来看，人类的情感可以分为自然情感和社会情感。自然情感与动物情感没有本质的区别，社会情感是人类特有的情感，人的社会属性就源于社会情感的需求。但无论是前者还是后者，都有一种人类情感的本能冲动在驱动着情感的发展，这种驱动力就像社会舆论、传统习俗和人们的内心信念维护人类的道德情感一样，在驱动着人类情感不断地朝着人性化的方向发展。所以在自然情感中，人类才得以产生对他物的共情和敬畏；在社会情感中，人类才有了对他人的共情和尊敬；在复杂的社会关系网络中，人类的两种情感才得以不断地发展演变，并朝着更为高尚的人类品质的发展方向前进。

    然而，从情感机器人的生存环境和条件来讲，自然属性和社会属性的情感对于机器而言，未免有些奢侈。情感机器人所拥有的情感属性，更像是一种人格化的特征，是被数字化的人类情感，如果要对其属性进行归类，它属于人格化的情感属性。情感机器人的这种情感具有绝对的人身依附关系，在情感独立性方面存在先天缺陷。

    综上所述，由于缺乏实践条件、独立自主的意识，以及其情感具有人身依附关系，情感机器人的真正情感在理论上具有不确定性特征。但是，鉴于人工情感的存在是一种事实，我们不能断然地说情感机器人是没有情感的，而是使用一种更委婉的表达——情感机器人的情感是人类情感的延伸，是人类情感的数字化。当然，这仅仅是从人类的角度分析人工智能机器人的情感的起源。人工智能是否有真正的情感，这在目前来说还具有极大的不确定性，因为我们无法确切地知道人工智能机器人在具备高度的情感数字化和智能化之后，是否能够产生属于机器人自己的意识和情感。


    ## 二、智能化延伸：人类情感的技术再现

    长久以来，工具是人类能力的补充、增强和延伸的观点是世人的共识，情感机器人的存在也是如此。

    情感机器人是人发明和创造的一种情感工具，在人的情感构成中具有人身依附关系。在能力允许的范围之内，人们要想让情感机器具备什么情感品质，情感机器人就会具有相应的情感品质；不想让其拥有的品质，也随时有权利不赋予机器人该情感，或者把情感机器人已经拥有的情感从记忆中删除。这反映的就是一种情感投射，它从一个侧面定义了人类情感的智能化延伸的内涵。

    人类情感的智能化延伸是指人类情感在人工智能上的情感投射，辅以技术手段将情感的构成要素赋予人工智能，使人类的情感在具有一定独立性的人工智能体中得以呈现。这种人类情感投射的方式，不仅存在于人对人工智能机器人中，还存在于很多方面，如人对物的怀旧、儿童跟玩具的对话、老人对宠物的情感寄托等。

    回到情感机器人领域，无论人工智能机器人能否产生属于机器人自己的情感，有一点可以确定，人会对服务体贴的机器人产生情感。随着情感机器人与人相处时间的增加，人与情感机器人之间的情感会越来越深，特别是在情感机器人的情感识别、情感度量、情感处理、情感理解、情感生成、情感表达、情感控制、情感交流等相关技术日渐完善的条件下，情感机器人也越来越能理解人的情感需求。就如图
    6-2 所示的智能机器人助手，在长久的陪伴中，残疾人从机器人那里获得了很大的安慰。


    ![img](img/txt008_2.jpg)


    图 6-2　残疾人与智能机器人助手

    《心理学大辞典》认为，“情感是人对客观事物是否满足自己的需要而产生的态度体验”。这就暗示了情感的本质是存在于人与人、人与物的互动之中的、在相互作用的条件下使人产生的需要满足感，这种满足感越高，人们能够获得的情感体验就越丰富。在人类情感的智能化延伸领域，人类情感体验的丰富程度来源于情感机器人满足人类自身的情感需要而产生的态度体验的丰富程度。


