- raw: '第三，单向度的人不断演化，甘愿沦为机器的奴隶。人类的“自我放弃”与“自我放纵”将自我捆绑于机器工具之上，从而沦落到被奴役的地步。脑科学家大卫·吉尔里（David
    Geary）有一个惊人的答案：“你可能不希望听到这个答案，但我认为大脑缩小的最好解释就是蠢蛋进化论。”也就是说，我们正在变笨\[4\]。


    脑科学家为什么会得出这样的结论呢？原因在于，人类已经从“听天由命”过渡到了“人定胜天”的历史阶段。人类依靠科技的力量在很大程度上摆脱了大自然的束缚，只需要投入生存的斗争中，而不要更多的智慧和思考。在物质资料生产过程中，人只需要通过简单的操作（如打开电源）就可以获得需要复杂的生产流程才能产出的产品，人在生产过程中解放的不只有劳动力，还有脑动力，所以说人类正在变笨。


    其实，变笨的过程正是人被机器奴役的过程。奴役的后果是什么？后果就是人离开机器不能生存，需要不断从机器手中索取生存的资源，所以不断对机器寄予更高的期望。这最终导致人类自身的机器依赖症，并通过各种病态的行为表现在人际交往中，对人际关系的和谐造成巨大的冲击，今天的“低头族”“自拍瘾”“手机依赖症”“网瘾”“机器人成瘾”等，都是人被机器奴役的直接表现。因此，在人机关系伦理重构的过程中，如何使人从机器的奴役中走出来，投入正常的生活中，是值得思考的问题。如果人类不想沦为“机器人的宠物”，则政府必须现在就立法，积极介入，事前规划，跟踪监督，万不可放任自流\[5\]。


    第四，人的异化催生机器的异化。机器的异化是人机关系威胁论的支撑元素。最早的机器是与人类和谐共处的，但随着人类赋予机器的智能与智慧越来越多，机器所拥有的人的意志越来越多，并最终从人的操纵下摆脱出来，变成与人类创造机器的动机完全相排斥的存在，甚至最终从机器的视域掉头将人类沦为自己的附庸，这种机器发展现象称为机器异化。这是当前人机关系伦理困境最突出的伦理难题，也是机器威胁论屹立不倒的支撑要素。最具代表性的机器异化是超强人工智能（类人机器）的出现，由于其是人造智能，因此其具有比人更强的竞争能力。那么，如何才能避免机器不伤害人这个问题自然成为人们讨论的焦点。


    早在1978年，日本就发生了世界上第一起机器人杀人事件。日本广岛一家工厂的切割机器人在切钢板时突然发生异常，将一名值班工人当钢板操作。苏联国际象棋冠军古德柯夫同机器人棋手下棋连胜，机器人突然向金属棋盘释放强大的电流，将这位国际大师杀死。


    上述不幸只是人机关系冲突消极影响表现出的最微小的一部分。发明机器本来是为了将其作为弥补人类自身缺陷的工具，如今它却反过来伤害人类，那么用什么样的规则和惩罚机制才能避免类似的情形再次出现呢？


    机器的异化是人的异化的结果，但最终以机器的异化为表现形式呈现出来，这让人们不得不再次思考机器的伦理问题，因为人机关系中的伦理问题不能单从人的伦理规范方面来解决，也需要对人以外的机器的伦理进行规范，这就扩大了人机关系伦理的局限性。因此，如何从人机关系中对人和机器的伦理生态进行重构是摆在人类面前的重大问题。


    ## 八、人机生态：从“冲突”走向“和谐”


    在人类发展的历史长河中，机器（工具）的不断进化在其中扮演着重要的角色。人与机器之间有冲突的时刻，更有和谐的时刻。无论是人机冲突还是人机和谐，都证实了科技发展给人类社会带来的巨大福祉。


    特别是自人工智能时代以来，达芬奇手术机器人的发明与应用、无人驾驶汽车的上路、以人工智能为支撑的新型人机交互模式促进的教育模式变革、更为舒适的人工智能远距离人际互动模式、以人工智能机器人为支撑的“机器换人”战略、以人工智能为支撑的无人超市，等等，无不以一种全新的形式改变着人类的生存空间，使人类的生活形态得以重塑、精神世界得以充盈、发展空间得以拓展。


    在以往数个技术变革时代，人们总是一边享受科技革命为自身带来的福利，一边无情地批判和嘲讽科技的阴暗面，在人工智能时代也是如此。人工智能的发展具有改变人类社会生活形态的强大力量，同时也具有毁灭人类的巨大可能性。但是单从人工智能本身而言，它并不具备社会价值选择能力，其对社会价值的选择全凭使用它们的人类的理性判断和价值选择。说到底，如果人工智能与人类发生冲突，那也仅仅说明人类在工具理性与价值理性的冲突中毅然选择了工具理性而忽视了价值理性，这才导致了人工智能机器的人文价值关怀的丧失。


    人机冲突真正的问题根源在于人类自身。如果人类在其中扮演的角色总是探寻某种“自证合理”的理由，那么人机冲突就源于对机器强权的某种人权化倾向和对技术革新的外在依托。人机从冲突走向和谐，抑或是一直保持人机和谐而不会走向冲突，要做到这些，就必须回到人类中心主义中去追寻人机和谐的缘由和进路，从而达到重构人机和谐的伦理生态的目的。


    第一，敢于批判与重塑现实。对现有的人机关系存在的伦理失范的批判，会从其困境的泥潭中开辟出一条新的路径并引导更多的后来者不偏不倚，从而会出现人类行为的伦理重构与集聚效应，这是对比尔·盖茨提出的“现实优于虚拟原则”的完美运用。


    整体来说，人类是相信未来的，这个信仰无疑是人类自我拯救的基础。对未来虚拟世界的人机关系的模拟和想象，是通过时间快速推进的原则无限地逼近未来可能的现实，是把未来可能的现实当作当前现实来对待，这就是人的智慧。尽管人类预测的“世界末日”到来时地球照样转动，但人们还是乐此不疲，原因就在于人类的危机意识在时刻警醒其要对瞬息万变的外部环境做出反应。这样做虽然很多时候没有产生太大的积极影响，但至少也没有产生消极的影响。这就足以证明这个方法论在人类协调未来人机关系中具有举足轻重的作用，可谓用未来重塑现实。


    某人首先迈出第一步，说不定一种新的人机伦理将被重新建构起来，并在越来越多的人的支持下彰显其强大的生命力。批判是对人机伦理危机不合时宜的批判，只有发展一种新的合时宜的人机伦理，这种批判才具有力量。否则，在大多数情况下，其只是狂热而显苍白无力。客观而言，能从“局外人”的视角去看“此山中的风景”者少之又少，自然而然也就少有人知道比现在更好的突破点在哪里。既然如此，就应该为没落的人机伦理困境的突破和超越贡献绵薄之力，将“弗兰肯斯坦情结”\[6\]伦理焦虑扼杀在摇篮里\[7\]。


    第二，对非理性主义的批判不得不为。机器威胁论的罪魁祸首就是人类对超强人工智能的担忧和焦虑，正如南京大学周志华教授所说，“严肃的研究者就不应该去碰强人工智能”，人类对于超强人工智能的态度就应该是“不碰”。人类深知“阿西莫夫三原则”在强人工智能时代救不了自己，因为历史是由强者撰写的，但是为什么机器威胁论还在被人们如火如荼地讨论着呢？原因在于机器创造具有巨大的利益，人们总是相信自己可以克服风险而获得巨额回报，这个自信用在超强人工智能的发展上就是一种极其不理智的行为。


    超强人工智能极具威胁性，其威力可以直接导致人类毁灭，既然有这样的风险，人类为什么还要去尝试呢？超强人工智能的危险在于其容易被不法分子利用。然而，这只是危害中最轻微的。最为焦虑的是，机器人可能认为人类不是自己的竞争对手，就该被淘汰。因此，无论是科学家还是世界首富，都需要用严谨的态度对待超强人工智能，用阻止克隆人的手段和力度去对制止超强人工智能的发明。


    陈希夷在其《心相篇》中指出：“知其善而守之，锦上添花；知其恶而弗为，祸转为福”。然而，在当下的人机关系冲突中，人们对被机器奴役的行为视而不见。譬如，在当前的人机关系冲突中，人与手机的关系最为复杂和普遍，手机对人的伤害不可避免，但人离不开手机。可见，人的这种明知不可为而为之的行为，是人被机器奴役最典型的特征。人类需要三思，在处理人机关系时要坚持有所为、有所不为的原则，万万不可把史蒂芬·霍金所说的“有可能这是人类最后一次的自我批判”中的“有可能”演变为“已经”。


    第三，人机伦理赋值通往人机和谐。赋予人和机器符合各自属性的伦理规则是通往人机和谐的必经之路。在人机关系冲突中，通往人机关系和谐之路，主要从两方面实现人机关系伦理重构。一方面，对人类自身进行伦理规范，赋予人类自身获得“责任伦理”能力的灵感。责任伦理要求人类通过预测、审慎、节制等自愿的力量限制去阻止人类成为祸害，不允许人类变成巨大的力量最终摧毁我们自己或我们的后代\[8\]。对人的伦理规范与伦理责任能力的培养，可以通过利益诱导的方式实现。所谓利益诱导，“是指一定的社会集团、组织，通过提高人们对现实利益及其利益关系的认识，改变人们的现实利益状况，从而引导人们接受、遵从特定的社会伦理规范，并在长期的社会生活实践中进一步形成所要倡导的特定道德行为习惯的一种教育方法。”\[9\]“利益诱导”的教育方法在人机关系伦理教育中对人的伦理规范同样适用。可通过利益诱导的方式，运用伦理博弈论的方法论突破伦理的囚徒困境，对人进行伦理知识教育，使人形成对人机伦理的合理认识和未来图景，然后将其内化为美德，最终形成遵守人机关系伦理的良好品格。“人是机器的尺度”\[10\]，其中，“尺度”二字主要是指人机伦理中人对于机器的伦理遵守，可见人机关系中人所扮演的角色是极其重要的。另外，当下，世界各国还需要不断地发展人因工程，以期促进人们在认识人与机器及环境的关系中，从一个更为客观的视角树立人机关系伦理的“三观”，从人的精神层面形成深刻的人机和谐的认识论和方法论。


    另一方面，对机器进行伦理规范。因机器具有独立于人存在的属性，人在发明和创造机器时不仅自己需要秉承善的伦理价值，更需要将善的意志以合理的方式嵌入机器中，通过向机器嵌入伦理价值观、发展机器人伦理学、赋予机器人伦理判断的能力的方式方法，规范机器的行为，从而避免机器伤人。人类制造机器并决定其特性和功能，人类思维和人工智能永远是模拟与被模拟、操控与被操控的关系\[11\]。基于此，当前阶段的机器伦理主要是被人的伦理规范所决定的，而机器的伦理行为只是人的伦理在机器上的表现，故对机器的伦理规范工作，人类不能袖手旁观，人类要主动并积极地推动机器伦理向善的实现。


    值得注意的是，对人机关系中人与机器的伦理重构，社会公众容易从两个向度独立而论，或者将上述两方面对立而论，从而激化原本沉默的人机关系隐性矛盾，无形间沦为机器威胁论的幕后推手。为了避免此类情形出现，“从理论层面和规范层面提出各种伦理原则以用于实践时，必须考量其现实可能性并寻求折中的解决方案；应摆脱未来学家的简单的乐观主义与悲观主义立场，从具体问题入手强化人的控制作用和建设性参与；要从人机协作和人机共生而不是人机对立的角度探寻发展基于负责任的态度的可接受的人工智能的可能”\[12\]。


    第四，在拥抱理性选择中坚守“帕累托最优法则”。明晰善与恶的分界线是人机伦理关系中理性选择的前提。“理性选择理论所说的‘理性’，就是解释个人有目的的行动与其可能达到的结果之间的联系的工具性理性。”\[13\]在人机关系伦理中的理性选择就是一种工具性理性，即不选择沦为机器的奴隶，也不选择使用机器去奴役和束缚人，这就需要分清人机伦理关系中的善与恶。


    在人机关系伦理中关于善与恶的标准并不复杂，主要的界定方式就是对人机关系中的主体意志的评判，评判的标准如下：是否在满足不伤害他人也不伤害自己这一双重逻辑的同时实现人类价值的最大化，即在重复囚徒困境中摆脱囚徒困境的限制，走向帕累托最优法则。在人机关系冲突论中，人类并没有严格坚守善的标准，只是将其行为嵌套在社会大的伦理标准框架中，将其中部分人机关系所带来的恶的后果诡辩为其对社会的善做出的牺牲，其实这就是对其恶的行为的包容和接纳，究其根本是伦理的可塑性造成了伦理惩戒力量的缺失。因此，在处理人机关系冲突的事件中，要恪守善的底线，不仅要做到不给自身带来伤害，还要做到不使他人的利益受损，即“己所不欲，勿施于人”。当然，冲突的化解如果要牺牲部分人的利益，也要将对其伤害的程度降到最低，保证在善的前提下做出价值判断，会对于因不可控的客观因素所致的损失，要采用合理的方式方法实现个体损失的最小化、社会群体的利益最大化。


    第五，社会规范弥补伦理失范，加固伦理根基。伦理学中一个主要与核心的问题，就是要解决个体至善与社会至善的关系，要劝诫个体认同善良意志，同时一个个具有善良意志的人能够实现一个美好的社会。人人相信道德法则，就必定可以造就一个“人是目的”的美好社会\[14\]。但是，由于伦理道德对于人的规范存在先天不足，美好社会的实现道路坎坷。这就说明，仅仅通过人机关系伦理规范是很难实现人机关系和谐的，需要增加社会规范以弥补从机器的设计研发、制造到投入市场等多个向度的人机关系伦理的缺陷。


    人机关系中的伦理规范主要以善和恶作为其评价的标准和界限，采取社会舆论、社会习俗及个人内心信念等方式，对越轨的社会行为进行谴责和制止，但因其不具有社会规范的强制力，加上人们对善与恶的评价标准因人而异，所以，要发展社会规范以弥补人机关系中的伦理规范的缺陷。可从以下三个层面探讨人机伦理失范的主要应对策略。


    （1）个体层面。具备科学精神是个体层面为人机伦理重构做出贡献的前提。人机伦理失范是社会无意识的结果，而社会无意识又是个体无所作为的衍生物。如果能对社会中的每个个体做出相应的伦理规约，那么机器的设计研发者、制造者、使用者与受益者将能在最短的时间内敏感地感悟到自身的责任与权力，从而使用有效的方式维护自己的权利与利益，并在人机关系构成的过程中明确与内化自身的责任。


    在人机伦理重构过程中，机器的设计研发者自然具有较大的话语权，无论是在权威性方面还是在影响力方面，其都具有非同凡响的效力，与使用者和受益者相比，其自然肩负更多的责任与历史使命。但设计研发者又该被赋予何种禀赋和精神，方能为人机伦理重构做出贡献呢？这当然不免提及设计研发者的科学精神。科学精神是科学共同体在从事科学研究活动中所遵从的精神价值和道德规范，包括理性信念、普遍主义、有组织的怀疑精神和感情中立原则等，它通过科学思想、科学方法、科学思维、科学道德来体现严肃认真、客观公正、实事求是、敢于实践、独立思考、尊重证据、坚持真理、修正错误的精神气质，构成了科学的完整内涵。获得个体主动积极参与的能力是个体层面为人机伦理重构做出贡献的结果。如果一个机器设计研发者能兼具如上所提及的科学精神，那么伦理失范的困境在个体层面就已经有突破一半的可能。


    制造者和使用者所扮演的角色也不得不提。在人机伦理关系重构的过程中，机器的制造者和使用者依然应该具备明辨是非的能力，从人机伦理意识、伦理行为、伦理价值等多方面不断地武装个人的思想及头脑，以期迅速感知人机关系中的越轨行为，并通过运用各种发声媒介合法地表达自己的看法和观点，不做魔鬼的代言者和协助者。


    （2）制度层面。制度得益于善法的建构，反哺于人机伦理，惩戒恶的行为，颂扬善的行为。首先，要完善与人机关系相关的法律。在人机伦理重构的过程中，需要将人机关系的各种恶的形态写入法律中，对导致人机关系冲突的各种情形进行有效规约。其次，要严格完成法律的贯彻执行任务。法律作为对人机伦理关系的补充，为避免其流于形式，需要专门的人机伦理专家对人机关系的冲突做出伦理规范与法律的强制执行，绝不能让故意挑起人机关系冲突的恶意行为逍遥法外。最后，要健全奖罚制度。善法的目的在于实现社会的善，这就需要对有违人机伦理道德的行为进行惩戒，以矫正这些行为，是达到善的目的的必要条件。否则，就是对人机关系中恶的行为的包容，更是对善的行为的漠视。


    （3）组织层面。环境中塑造的个体具有群分效应，以便刺激失范的个体行为复归。组织层面介入人机伦理失范，是从“环境决定论”的视角获得的灵感。经过深思发现，从个体层面探讨人机伦理关系的伦理困境存在风险，单从人类某个独立而固定的个体出发，都没有人敢保证这个具体的个人已经完全内化人机关系伦理的优良品质，更何况社会是由无数个相互关联的个体构成的人类集群。所以，把除个体之外的大环境进行改造是对个体伦理重构的补充和完善。因此，从组织层面对社会的人机关系伦理进行社会的再教育与伦理再造显得尤为必要。


    一方面，社会可以宣传家庭对人机关系伦理的重要性，促使家庭对其成员的伦理基础进行启蒙。同时，学校课堂的专业伦理价值教育，特别是人因工程学的普世化教育，对于当下人工智能时代的人机伦理重构具有决定性作用。另一方面，可以通过出台相关政策的方式（如出台《机器伦理的伦理守则》），引导人机关系的发展方向，辅之以社会舆论媒介等媒体工具，并对人机关系进行社会化宣传教育，从而站在宏观的视域重构人机关系大环境，回应人机关系失范现象。


