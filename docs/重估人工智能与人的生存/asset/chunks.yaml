    # 三元结构社会


    ## 一、人工智能发展与三元结构社会的形成


    在2016年的围棋大战中，谷歌的AlphaGo战胜李世石，总比分定格在4:1，这极大地吸引了人们对人工智能（AI）的关注。2017年，AlphaGo 2.0又再次以3:0的比分横扫代表人类棋手出战的世界围棋第一人柯洁，这再次刷新了人们对人工智能的看法，进一步掀起了新一轮的人工智能热潮，预示着人工智能的发展将迈上新台阶。


    目前很多大型企业重视发展人工智能技术，如谷歌发布全新的人机协作计划PAIR、Deep Mind 在研发“跑酷”人工智能系统、阿里巴巴已开通无人超市和发布医疗人工智能系统、百度推出无人驾驶车、京东准备利用机器人来送货、华为推出人工智能处理器等。人工智能技术的进一步发展，最终将加速三元结构社会的到来。


    ### 首先，人的存在

    人是自然界辩证发展的最高产物，作为“万物之灵”的人类，在地球上的存在时间大约有500万年，但相比恐龙曾经在地球上生活的1亿年，人类历史显然并不算长。然而，人类在这个地球上创造的价值却是其他动物无可比拟的。正如学者指出的那样，“人类通过劳动和利用智慧去创造工具，进而改造周围的世界，随之人类自身也得到发展”。\[1\]


    在漫长的历史进程中，人类通过不断的劳动思考如何制造和使用工具，让自身的生存更加美好，同时也在缓慢完善自我，不断进化，形成自身的独特性，如自然性、生物性、自我意识性、智慧性、社会合作性等。人类的历史也是技术和工具的发展史。随着人类的不断努力和探索，以人工智能技术为代表的人类创造的工具正不断向拟人化和超高智能化的方向发展，代替人类从事危险的、无聊的、重复的或困难的工作。


    ### 其次，半机器人的出现

    目前，人工智能技术发展一日千里，众多的技术、理论和原理不断发展完善，人工智能开始慢慢走进普通大众家庭。与此同时，半机器人技术的发展，也在实际应用中得以展现。2002年3月，英国雷丁大学控制论教授沃里克在牛津的一家医院接受了硅制芯片植入手术，试图通过芯片接收神经脉冲信号以控制机器的行为，该芯片上有近百个电极与他手臂的神经相连。从一定意义上来说，这是人类历史上第一次将芯片植入人体的半机器人技术实验。


    与此相关的实验还有尼尔·哈尔比森在头部安装感官装置的实验。尼尔·哈尔比森本身是一个只能看到黑白两色的色盲人，但其在头部安装了一个人工智能的感官装置，这个感官装置能将不同的颜色转换为不同的音符，依靠这个装置，尼尔·哈尔比森通过辨别不同音阶的声音，就可以“看到”这个世界的不同的颜色。2004年，尼尔·哈尔比森得到英国身份管理部门的正式承认，认定该装置是他身体的一部分，这使他成为世界上首个政府承认的半机械人。这在半机器人领域是一个极具里程碑意义的事件。


    半机器人的存在，还体现在很多方面，如具有机器手指的人、与假肢合体的残疾人、安装了心脏起搏器的人等。随着半机器人技术的日渐成熟，关于半机器人的争论也在不断产生。特斯拉CEO埃隆·马斯克就曾警告：“人类必须与机器人结合，否则将被人工智能淘汰。”2017年2月，在迪拜举行的“世界政府峰会”（WGS）上，埃隆·马斯克还表示：“人类需要与机器相结合，成为一种‘半机械人’，从而避免在人工智能时代被淘汰。因此，人类必须与机器相结合。将来能够连接到人类大脑的高带宽接口，将是那些能够帮助人类与机器智能实现共生，并解决控制问题和有效性问题的事物。”


    按照半机器人现在的发展态势，将来还会出现更多的半机器人的生命复合体。相关的学者对半机器人的定义有不同的观点，有人认为半机器人是通过超人工智能技术将人与机器结合起来、在人体内植入微电子芯片的电子人\[2\]，也有人认为半机器人是主要由机器组件构成但有一部分器官、染色体、人类意识的赛博人\[3\]。对于半机器人来说，他们不仅拥有人类正常的功能，也拥有超出人类的超能力。他们拥有超越人类的记忆能力和计算能力，能够控制属于自己的电子产品，有较长的寿命、较强的忍耐力及较强的生命力。


    半人机器人从诞生至今，经历了三个发展阶段，未来或将经历第四阶段：第一阶段，单个器官合作阶段，这个阶段的半机器人主要是指人体的个别器官被机器设备所取代；第二阶段，组合器官合作阶段，这个阶段的半机器人的存在主要是因为人体出现大面积瘫痪或截肢，需要综合性的机器设备帮助人类完成生存之所需；第三阶段，高级器官融合阶段，这个阶段的半机器人表现为思维器官与机器设备的合作，其技术能级远超第一、第二阶段，具有极端复杂性；第四阶段，意识转移阶段。前三个阶段的半机器人表现为机器是人体的一部分，而在第四个阶段存在的半机器人中，人体是机器的一部分。


    ### 最后，机器人的普及

    从当今社会来看，人工智能机器人的普及已成为普遍的现实，如教育教学机器人、农业机器人、工业机器人、家用机器人、医用机器人、服务型机器人、水下机器人、军用机器人、排险救灾机器人、娱乐机器人等层出不穷，并且应用日渐广泛。


    在东莞的无人工厂流水线上，一批工业机器人正在有序地工作；在美国的“无人农场”，农业机器人正在不知疲倦地完成从翻地、播种、灌溉、除草到收割的全部流程，从而实现农业全程自动化和智能化（见图5-1）；在淘宝，一批智能客服机器人正在为顾客解答购物困惑……


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt006_1.jpg)


    图5-1　美国“无人农场”的一个农业机器人正在松土


    在全球的各行各业，机器人的应用日渐普遍。据中国机器人产业联盟统计，自2018年以来，国产工业机器人销量继续增长，仅2018年上半年就累计销售22304台，比2017年增长22.4%，销售总体保持了相对平稳的增长。根据国际机械装备网发布的《2018年前三季度的机器人产业数据统计分析》可知，2018年前三季度，全球机器人产业市场规模超过194.8亿美元，同比增长13.6%，其中，工业机器人市场规模为109.1亿美元，服务机器人市场规模为60.4亿美元，特种机器人市场规模为25.3亿美元；我国机器人市场规模为54.2亿美元，同比增长18.2%，其中，工业机器人市场规模为36.3亿美元，服务机器人市场规模为11.4亿美元，特种机器人市场规模为6.5亿美元（见图5-2）\[4\]。另外，国际机器人联合会统计数据显示，2019年，中国工业机器人的安装量比重将进一步上升至38.6%\[5\]。这表明，从工业机器人总体的发展趋势来看，全球的工业机器人呈现增长态势。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt006_2.jpg)


    图5-2　2018年前三季度全球及中国机器人市场结构（单位：亿美元）


    通过上述分析可知，目前全球机器人的普及已成常态。但是从总体发展来说，由于目前人工智能技术还不够成熟，现在的机器人处于弱人工智能阶段，没有自我意识，而在未来三元结构社会中普遍出现的机器人则处于强人工智能阶段，是已经由人类编程完善的、具有较强自我深度学习和进化能力、具有自我意识的机器人。在三元结构社会中，它们会像人类一样在行为上有自觉自控性、在思维上有可变性、有独立的决策能力等\[6\]。与人、半机器人相比，机器人的生命力最强，完全不受自然生物性的制约，适合做任何工作。因此，在未来社会，机器人将得到更广泛的普及，其肩负的责任也将更大。


    ## 二、新问题：三元结构社会的冲突表征


    每种社会都有每种社会的特征，每种社会也有每种社会的问题。在三元结构社会中，也会出现一系列不同于当今社会的新问题。


    ### 1.人与人相处模式的转变

    在当今社会，尽管俗话说，“人上一百，形形色色”，但人与人之间相处有共识：我们是同类，有共同的语言，认同人的特性和价值，遵守约定俗成的规则。在三元结构社会，不再只是同一种人的相处，而是出现了更加复杂的人与半机器人、人与机器人、半机器人与机器人三种相处模式，随之他们之间相处的语言、思维、准则都将发生改变。


    在三元结构社会中，在语言上，这三种人将会出现如下问题：除了人类现在的语言，人与半机器人还需要什么新的语言来实现交流互动？人与机器人需要用怎样的符号和图文来理解对方而不至于出现误解或出现执行错误命令的现象？根据半机器人与机器人的特性，他们是直接用机械语言来交流还是用其他语言来交流？


    在思维上，这三种人将会出现如下问题：在人类社会中，每个人都有自己独特的思维方式，那么人、半机器人、机器人这三种人在对待同一件事物时，思维的侧重点会有很大的不同，所出现的思维方式将更加多样。


    在准则上，这三种人将会出现如下问题：人与人之间、人与社会之间及人与自然之间都存在一定的权利与义务准则关系\[7\]，那么在三元结构社会中，人与半机器人、人与机器人、半机器人与机器人之间也存在某种属于他们相互之间的独特的权利与义务准则关系。


    由此可见，这三种人如果在语言上没有形成很好的交流方式、在思维上没有达成一定的共识、在准则上没有做到一致，将会出现法律上、道德上、心理上和行为上的一系列问题。在《蓝色的海豚岛》一书中，人与自然有三种相处模式——征服自然、尊重自然、回归自然，主人公卡拉娜尊重自然、爱护自然、与自然和谐相处的模式\[8\]，值得我们思考。


    ### 2.情感倾向的扭转

    在人类社会中，人与人、人与自然、人与动物之间始终存在喜、怒、哀、乐、忧、思、悲、惧、惊等情感。在三元结构社会中，人、半机器人、机器人这三种人之间存在的情感也会像现有人类社会中的情感一样，但情感倾向的内容、范围会有所不同。


    第一是人对半机器人的态度。半机器人比普通人更具超能力，人对半机器人是羡慕的、恐惧的、抗拒的，如在电影《X战警》中，部分人类基因突变后，产生超能力，变得与普通人不同，但人们最后因一些事情对基因突变人产生恐惧，进而对基因突变人进行围捕、杀害，目的就是将基因突变人变成正常人。


    第二是人对机器人的态度。一方面，机器人是人创造发明出来的工具，是人的延伸，是人智慧的结晶，值得我们骄傲；另一方面，人会对机器人有某种歧视、害怕心理，如人会认为机器人即使再像人，也只不过是人的工具而已，导致机器人在不知情的情况下被人歧视。同时由于机器人本身的强大，机器人有自己的意识，拥有机器人人权、与人是平等的，不受人的控制，机器人这样强大的存在让人感到害怕。因此，人对机器人存在又爱又恨的心理。


    第三是半机器人对人的态度。半机器人会存在歧视人的无能、厌恶人生命力的脆弱心理。


    第四是半机器人对机器人的态度。一方面，半机器人拥有人的血脉，相比由人创造出来的机器人，其会感觉高人一等，进而鄙视机器人；另一方面，半机器人因与机器人同样拥有强大的超能力，会对机器人的生命力、能力产生认可。


    第五是机器人对人的态度。机器人会存在崇拜人的智慧又歧视人的局限性心理。


    第六是机器人对半机器人的态度。机器人对半机器人会存在尊重、竞争、害怕的心理。


    ### 3.人之为人的意志能力被削弱

    随着技术和生产力的发展，人的物质意识越来越强，即机器隐喻渗透到人们的意识中，其使人的感受、性格、品格越来越被忽视，而人的物质拥有越来越被重视\[9\]。而在三元结构社会中，这种现象更为严重：人的意志能力将会大大削弱，将出现法律上、道德上、心理上等问题。对于人类来说，一方面，机器人代替了本该由人来完成的劳动、能够解决高难度问题、能制约着作为主体的人\[10\]，而人类是通过劳动产生价值的，这样将会导致人类对自身身份认同产生否定\[11\]；另一方面，处于这种社会结构中，人对机器人的依赖越来越大，人慢慢会像计算机一样只按一定的规则流程思考、没有人的同情心、没有灵活变通处理问题、失去人的自由意志、失去自我意识唯一性，导致人的选择权不能唯一取决于自己。半机器人是真正意义上的人吗？


    一方面，嵌入芯片的半机器人拥有超能力，能做人做不了的事情，与人有着明显的不同；另一方面，半机器人受到机器芯片的限制，不同于我们所认知的自然人，其自由意志将受到很大限制。对于机器人来说，一方面，他们是人创造出来的，虽然通过自我学习有了自我意识，但人的自由意志不能完全被机器人复制。因此，机器人不完全具有人的自由意志，始终不是人；另一方面，由于机器人自我深度学习产生的独特意识具有不确定性，当真正具有自己独特意识的机器人出现时，这样的机器人可能会侵犯人的尊严，使自然人的自由意志受到侵害。因此，机器人与人是有区别的。


    ### 4.对程序病毒恐慌

    计算机病毒是随着计算机出现而出现的，其中，计算机病毒Conficker是一种臭名昭著的Windows蠕虫，感染了近200个国家的900多万台计算机；Wanna
    Cry勒索病毒利用代号为“永恒之蓝”（ETERNALBLUE）的NSA漏洞入侵学校、政府及医院的电脑，攻击者以删除数据来威胁被攻击者支付比特币。由此可见，计算机病毒危害之大。在未来高度依赖信息技术的三元结构社会中，计算机病毒对人、半机器人、机器人的危害将更大。


    第一，由于半机器人中植入了具有相关程序的芯片来实现相关的功能——在半机器人中的芯片是用来接收信息、连接自己各种设备的，半机器人的芯片一旦被程序病毒入侵、窃取信息，就会失去其对芯片相关设备的控制，相当于半机器人自己失去了某一部分器官。


    第二，机器人的生命内核是相应的程序芯片，一旦机器人内核芯片被计算机病毒感染，相当于整个机器人被他人控制，机器人失去了整个自我。


    第三，三元结构社会是人、半机器人、机器人这三种人相互合作的社会，一旦半机器人、机器人染上程序病毒瘫痪而不能正常运作，或者机器人受到恶意程序命令去做不好的事情，那么，后果就是这三种人的内心弥漫着悲伤和恐慌心理，整个社会基本是瘫痪的。计算机病毒能通过软盘、硬盘和网络来进行传播\[12\]；因此，这三种人需要用大量的精力去应对程序病毒的发生，这样会导致社会效率低下，更严重的是整个社会不安、动乱、暴动，对这三种人造成巨大的创伤。


    ## 三、新关系：三元结构社会的相处之道


    思考三元结构社会中可能出现的新问题，有助于我们未雨绸缪，探寻未来社会中人与半机器人和机器人的相处之道，也有助于人工智能这项重大技术健康快速地发展。


    ### 1.把握好技术的量与度，让人工智能更好地造福人类

    人工智能技术同所有技术一样，是一把双刃剑：一方面，它提高了社会运行效率，让人类生活变得丰富多彩，如我们可随时随地上网获取大量信息、各种智能产品方便我们的生活；另一方面，它也会带来新的风险甚至威胁，如技术的过度应用会导致环境和生态危机，军事技术的滥用会对人类生命安全产生威胁\[13\]。在三元结构社会中，人工智能技术的发展已达到足够的高度，因此，这三种人对人工智能技术的量与度的把握显得尤为重要。


    第一，对于计算机编程人员、机器人专家来说，一方面，他们要在机器人编程里加入相应的道德代码\[14\]，同时也要提高机器人抵抗程序病毒的能力，预防黑客入侵；另一方面，在个人行为上，他们要很好地规范自己的行为，不能因贪婪而滥用编程去编写伤害他人或违法的相关程序，如不能让半机器人滥用自己的超能力、不能让机器人做出伤害人的事情\[15\]。


    第二，对于硬件/软件设计师来说，他们要意识到机器人伦理和安全问题并给予重视\[16\]，更要担负起自己的责任，对原则性、方向性的问题不能妥协，要依照标准的规范来制造机器人芯片、研究算法。


    第三，对于国际社会和科学界来说，它们要监管规范技术的发展和严格监督人工智能技术新产品各个环节的开发\[17\]，同时齐心协力抵制程序病毒的入侵，找出散布病毒的幕后黑手。人工智能技术本身没有善恶之分，关键在于这三种人如何发挥好人工智能技术善的一面。相信在计算机编程人员、机器人专家、哲学家、硬件/软件设计师、社会各界达成共识的情况下，准确把握人工智能技术中的“量”与“度”，可以让人工智能技术创造出更大的价值。


    ### 2.完善法律，发挥法律的最大作用

    在当今社会中，法律用于维护社会秩序，保障社会群众的人身安全与利益，而在三元结构社会中，法律将是三种人的合法权益的最大保障。现在的责任主要是人的责任，而在三元结构社会中，责任的范围要针对三种人来设定，这三种人要将法律的作用发挥到最大化。


    第一，明确法律责任的范围。在三元结构社会中，这三种人都有自己的自主意识，他们必须要对自己的行为负责、承担自己的责任、履行自己的权利和义务。无论是人、半机器人，还是机器人，任何一种人都要对自己制造出来的半机器人芯片和机器人芯片负责，从而保障每种人的自由意志不受另一方侵犯。


    第二，法律制定要合理化。一方面，现行制度赶不上技术的发展变化，加上各国文化、习俗不同，怎样去保证公平和很好地处理新出现的问题值得我们思考\[18\]；另一方面，人、半机器人和机器人这三种人相处的思维方式、娱乐方式、需求不一样，仅仅用一种标准去评判他们是不全面的，例如，人会对权利、钱财有过多需求，而机器人只会对能源、信息有过多的需求。因此，要根据这三种人分别来制定属于他们特性的法律，确保法律能规范每种人的行为举止，防止任何一方不对等、任何一方不公平的现象发生。


    第三，综合多方意见共同制定法律制度。一方面，要加强国际合作与交流，坚决反对违反国际条约的人工智能科研计划，并按照相关法律法规、国际惯例等进行严格管制；另一方面，由于工程师对实际问题有着深刻理解，而哲学家对人的认识和人性的哲学有深刻见解\[19\]，因此让工程师和哲学家一起参与设定法律法规，才能让三元结构社会法律公平有效。


    第四，严格执法。在三元结构社会中，任何一方不能有大于法律的权力，任何一种人违反了法律，必须按照相应的法律给予惩罚，特别是对于那些散布计算机程序病毒的人，必须严惩。在三元结构社会中，每一种人都要遵守规则，这样才能慢慢形成健全和智能的法律体制，才能发挥法律的最大作用，最大化保障这三种人的权益，形成和谐的社会秩序。


    ### 3.形成共识道德，保留人之特性空间

    在三元结构社会中，人运行的道德体系已不适用于出现的三元结构社会的实际情况。一方面，半机器人虽然具有人的思想，但半机器人具备普通人不具备的能力，因此，半机器人的行为不能单用人的道德体系去评判；另一方面，机器人已经有了自主意识，当机器人按照既定的程序做出自主决策时，应该基于什么样的道德体系来评判，成为一个更加复杂的问题\[20\]。因此，人、半机器人和机器人要形成共识道德，要建立一个道德体系，让人与半机器人、机器人之间融洽、和谐地相处。


    第一，加强向人宣传半机器人、机器人的相关情况，让人认同半机器人这个强大的存在，认同机器人是独立理性的个体，同时提高人的公众文化知识素养\[21\]，让人相信不管另外两种人多么强大，选择权始终取决于自己。


    第二，半机器人要对自己的存在有合理的认识。半机器人是在人的基础上超越人的，保留了人性的一面。半机器人不能忘记自己与人的血脉相连、与机器人的惺惺相惜。

