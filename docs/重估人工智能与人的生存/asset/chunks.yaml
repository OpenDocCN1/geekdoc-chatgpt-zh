    # 第一部分　重塑生活形态


    ## 第二章　出行：无人驾驶汽车你敢坐吗


    无人驾驶汽车成为“网红”：一批大公司正在蹭热度


    人们最关注的问题：无人驾驶汽车安全吗


    “电车难题”：无人驾驶汽车将怎样选择


    “大数据悖论”：无人驾驶汽车的出路


    无人驾驶汽车上路：不仅仅是安全问题


    无人驾驶汽车从实验室走出来进入公众视野，展现的是传统驾驶汽车领域中的颠覆性变革。在未来的城市，驾驶员的双手即将从方向盘上解放出来，那些因为醉驾、疲劳驾驶、公交车司机与乘客冲突等造成的悲剧，将不再发生——安全、舒适、便捷、高效的目标正在实现。当无人驾驶技术成熟，全世界实现无人驾驶汽车的量产并投放市场时，按照谷歌的预测，每年全球有近
    123 万人不再被交通事故剥夺生命——这是人类交通史上多么伟大的历史时刻！


    ### 一、无人驾驶汽车成为“网红”：一批大公司正在蹭热度


    “网红”是“网络红人”的简称，大致经历了文字网红、图文网红、宽频网红三个阶段，是随着互联网而产生的新事物。网络技术的发展，尤其是移动互联网的广泛普及，为“红人”们展现自我提供了广阔的舞台。因此，相较于传统的“红人”，“网红”必然带着网络时代的印记，他们依托互联网平台的巨大传播优势，满足了很多人的好奇心和审美情趣。有的“网红”凭实力，有的“网红”凭运气，有的“网红”凭长相……各显神通，共同塑造了网络时代的视听盛宴，平添了网络空间的热闹气氛。


    这场盛宴，不仅捧红了天赋异禀的“红人”，更不断外延着“网红”这个词的本来意义。今天，“网红”已经不单单用来形容人，更成为“高关注度”的代名词，与诸多领域皆有渊源，如网红机器人、网红汽车、网红歌曲等。


    正因如此，人工智能的崛起催生了无人驾驶汽车热，其热度目前可以与“网红”挂钩，无人驾驶汽车已成为“网红”。众多顶级公司不断关注无人驾驶汽车，“高关注度”的背后意味着什么？是无人驾驶汽车带来的巨大机遇，还是仅仅是个网络噱头，只为赚取“流量”收入？


    无人驾驶汽车不断“热出”新高度。目前，很多科技巨头公司，如百度、阿里巴巴、腾讯（合称“BAT”），以及谷歌、亚马逊、特斯拉等，皆已驻足该领域，还有众多“无名小卒”跟随其后，向传统的交通领域发起了挑战。从无人驾驶自身的特点来看，这是一场已经看得到胜利曙光的市场争夺战，意味着在不久的未来，交通领域将会发生一场“蝶变式”的升级改造。无人驾驶汽车带来的更多是值得期待的东西，如交通安全事故剧减、交通拥挤状况好转等。


    谈到无人驾驶汽车，不得不首先关注谷歌对于无人驾驶汽车的研究。谷歌的带头作用，对于促使无人驾驶汽车在今天成为“网红”具有重要推动作用。一方面是因为谷歌是一家全球知名企业，另一方面是因为谷歌的无人驾驶汽车从实验室走出来进入公众视野，展现的是传统驾驶汽车的颠覆性变革，所以吸引了众多企业迅速追随其后并加快技术研发。


    早在 2005 年，一位 43 岁的斯坦福大学教授塞巴斯蒂安·特龙（Sebastian Thrun）和他的团队就共同研发设计了一款名为“斯坦利机器人”的汽车。正是这次特殊的研发经验和体验，让这位教授在兼职谷歌工程师期间，推动了无人驾驶研发项目落地谷歌。到目前为止，谷歌的无人驾驶技术已基本成型。


    谷歌的无人驾驶汽车是集激光测距、定位系统、车道保持、红外摄像头、车轮角度编码器等于一身的技术综合体，如图 2-1 所示。就其目的而论，主要是想借助大数据和智能技术，实现无人驾驶汽车自动化。简而言之，就是用技术手段模拟人类的驾驶技能，从而实现无人化驾驶。从谷歌研发无人驾驶的整个历史来看，其目的也不过如此。但是，如果只是这样说，人们会认为谷歌的无人驾驶技术也并无异样，技术手段实现的是对人类的模仿，那么人类驾驶员会犯的错误，无人驾驶汽车也会犯，研究无人驾驶技术的意义何在？其实不然，无人驾驶的潜在价值是巨大的，否则，谁还会花费人力、物力、财力去做这件事？


    随着无人驾驶汽车前景的不断明朗，众多公司开始布局无人驾驶汽车研发战略，百度也位列其中。自 2014 年百度开始着手布局无人驾驶领域以来，在很多方面都取得了喜人的成绩。无人驾驶是靠大数据支撑起来的新领域，百度正好在这个方面有自己的优势。百度地图多年的服务，为无人驾驶技术的研发积累了大量的数据。这样，百度的大数据、百度地图、百度大脑、百度的人工智能等技术相继涌入无人驾驶领域。


    ![img](img/txt003_1.jpg)


    图 2-1　谷歌的无人驾驶汽车


    2017 年 7 月，李彦宏乘坐无人驾驶汽车在北京五环上顺利前行的视频引发广泛关注。2017 年 12 月，在雄安新区，百度无人驾驶汽车“Apollo”跑出了自信的步伐。这些都在某种程度上预示着百度无人驾驶技术日趋成熟。因此，在未来的城市，驾驶员的双手即将从方向盘上解放出来。这样，那些因为醉驾、疲劳驾驶、公交车司乘冲突等造成的悲剧将不再发生。2018
    年，李彦宏决定将开发自动驾驶汽车作为百度的首要任务。他表示:“在未来通勤中，你不必再把精力花在开车上，你可以在路上吃火锅和唱歌。”


    成为“网红”是需要凭借特殊的优势才能实现的，那么，无人驾驶成为“网红”，引发一批大公司不断地蹭热度，它又是凭借着哪些特殊的“本领”成就了今天的名气呢？


    对于这个问题，要回归到无人驾驶技术研发的初衷上来。无人驾驶技术的研发，不单是为了把驾驶员从方向盘上解放出来这么简单，更是为了未来出行能够更安全、更舒适这一目的。在互联网、物联网、大数据、人工智能等技术的支撑下，人们的这一美好愿景的实现有极大可能性，再加上经济发展带来的交通更为拥挤的现实刺激，变革出行方式的迫切需求成为每个城市居民的愿景。所以，无人驾驶汽车研究迅速引起了全球的关注。


    在万众瞩目的今天，无人驾驶开始从实验室走出来并上路，经历的“大落大起”是很多技术人员用辛勤和汗水浇灌的成果，但其对社会和公众带来的实际影响和心理冲击仍然需要经过实践才能得知。其中，最引人注目的问题是：无人驾驶汽车真的安全吗？安全，这一传统交通工具最大的问题依然延伸到了新的交通领域。因此，接下来探讨无人驾驶汽车的安全性问题，以及其未来的发展前景。


    ### 二、人们最关注的问题：无人驾驶汽车安全吗


    当人们出行要选择交通工具时，首要的考虑因素就是交通工具的安全系数，然后考虑其他因素，如经济性、便捷性、舒适度等。随着大数据、人工智能技术的发展，智慧交通应运而生，尤以人工智能为支撑的无人驾驶技术最为热门，争论也甚是激烈。


    众所周知，任何一项科技革命都会伴随着“双重性质”，给人类带来便利的同时，随之而产生的消极影响也会相伴而生，无人驾驶技术也是如此。对乘客而言，出行的安全性值得反思；对研发人员而言，提高安全系数需要重点关注。


    自 1921 年 8 月 5 日美国发明第一辆无人驾驶汽车开始（见图 2-2），到 1989 年国防科技大学研制成功第一辆国内智能小车，再到如今的百度和华为竞相布局无人驾驶战略，近百年来，人类在无人驾驶技术的创新上取得了重大突破。各种无人驾驶汽车逐渐问世，推动了交通领域的革命性变革，使人类的出行方式即将走上真正的智能时代、无人驾驶时代。


    然而，2018 年，全球首例自动驾驶汽车致行人死亡的案例在美国发生。2018 年 3 月 21 日，优步（Uber）沃尔沃 XC90 自动驾驶汽车在亚利桑那州坦佩市撞上并导致一名行人死亡，其后人们对无人驾驶汽车的安全性开始质疑。根据
    PSB 研究公司和英特尔委托的一项新调查得出的结论，如今只有 21%的美国人愿意用自己的汽车来换无人驾驶汽车。此外，大多数人对自动驾驶汽车很谨慎，近一半（43%）人表示对无人驾驶汽车的安全性表示担忧\[1\]。


    ![img](img/txt003_2.jpg)


    图 2-2　美国发明的第一辆无人驾驶汽车


    正是无人驾驶汽车导致的交通事故，引发了公众的担忧。实际上，这种担忧有其合理性。首先，“单向度”引发的无人驾驶焦虑。一般人认为，智能机器只是在不懈地追求人类赋予的目标和价值，而不会对其行为进行拟人化的反思，更不会承担相应的责任和履行相应的义务，从而给人们塑造了一个“为达到人类赋予的目标而不择手段”的单向度无人驾驶汽车的形象。所以，人们就会认为当无人驾驶汽车行驶在道路上时，它更多的是按照程序行驶，而非像人一样需要在考虑保护自己安全的同时，还要考虑保护他人安全的道德义务。但这仅仅是传统意义上的智能交通，由于积累数据的“单维性”，造成了无人驾驶的“单向度”。简单来说，这是大数据、人工智能时代之前，机械思维带来的消极影响。


    值得庆幸的是，在大数据和人工智能时代，大数据思维不仅是对机械思维的继承与发展，更是对机械思维的颠覆，讲求因果逻辑关系的机械思维由于其本身的局限性难免被淘汰，“由果溯因”“由相关代替因果”的思维模式在很大程度上减轻了人类认识世界的难度。对于无人驾驶汽车的发展也是如此。


    但是，不得不说的是，过去令人失望的那些无人驾驶汽车，正在以惊人的速度被淘汰，取而代之的是更加智能和安全的无人驾驶汽车。可以毫不夸张地说，按照目前的发展速度，无人驾驶的安全性很快将会大幅度提高。除了一些不可控的自然因素和人类故意的因素，事故的发生次数将会急剧减少，甚至不发生。因此，就当前的发展现状而言，无人驾驶的未来趋势是不可阻挡的。


    那么，人工智能交通是如何从中汲取经验的呢？道理一样，随着人类对智能交通的认知数据的积累，原有的单向度的、只为达到目的的无人驾驶汽车，开始广泛观察周围环境中瞬息万变的数据，并能对此做出迅速的反应，其反应能力远超人类，这一点是被大家所公认的。那么，随着数据积累的多维性逐渐完备，无人驾驶汽车也就具备了多维度的视野，从而提高了其行驶过程中的安全系数。


