    图8-1　圆形监狱


    当你意识到自己赤裸地暴露于“圆形监狱”的监控之中时，一种毫无自由的“透明人”的感觉是否会从内心深处升腾而起？所谓“透明人”，是指在大数据技术与人工智能技术深度融合的时代，每个个体在一系列时间段的所有行为都可以通过算法的比对分析还原原始信息，由此每个个体的生活状态在很大程度上成为透明\[12\]。也正如英国作家乔治·奥维尔在《一九八四》中所描述的那样：“无论你是睡着还是醒着，在工作还是在吃饭，在室内还是在户外，在澡盆里还是在床上——没有躲避的地方。除了你脑壳里的几个立方厘米，没有任何东西是属于你自己的。”\[13\]乔治·奥维尔的这句话或许还不够“极致”和“尽兴”，应该说，在大数据和人工智能的“圆形监狱”下，脑壳里的几个立方厘米也不属于自己，它是大数据和人工智能世界的“公共财产”，属于完全透明的人。


    ### 再次，心理上存在“第三只眼”

    普布·洛桑然巴在其著作《第三只眼睛》中描写了主人公前额长着第三只眼，通过这只眼，主人公能洞穿人的心理，预知未来。如今，第三只眼则表示对人的活动的监视，特别是对人内心微妙变化的透视。大数据和人工智能时代最令人焦虑的挑战来自他人对个人隐私的精准侵犯。“偷窥”常常与不道德、不符合伦理相挂钩，大数据和人工智能成为窥视外界的“第三只眼”也必然引发人们对伦理道德的讨论。精准定向广告的推送引发人们对个人隐私保护的重新审视，激发了人们寻找一片树叶遮羞的欲望。


    ### 另外，个人行为受到束缚

    从一定程度上来说，现有的精准定向广告对于人们的消费存在有利的一面，克莱·舍基曾说：“并不是我们的工具塑造了我们的行为，但是工具赋予了我们行为发生的可能。”\[14\]但是，一个不可否认的现实是，随着大数据和人工智能技术的发展，生活中的我们处于亿万个视线的监视中，我们的身份信息已被数以千计的智能型企业所收集与应用。一方面，信息的“透视”给人的心理以无形的压力，使人产生躲避网络世界或逃避现实世界以保全个人隐私的诉求；另一方面，预测技术的发展与应用使个人的行为自由被迫受到限制。当人们明白自己的隐私可能存在泄露的情况、被人侵权的情况，特别是存在被人监视利用的情况时，他个人会对原有的行为路线产生怀疑，从而寻求异于习惯性的行为路径，表现为一种行为的“束缚性”异常。


    ### 最后，个人受到社会偏见

    在预测技术不断发展的情况下，人将被有区别地对待，人所享受的服务也是有区别的服务，这就限制了个人的行为与发展，迫使个人极易处于被歧视的状态，甚至出现“大数据杀熟”这样的怪现象。所谓“大数据杀熟”，是指同一件商品或同一项服务，智能型企业显示给老用户的价格要高于新用户。用户在某个平台消费频次越高，越容易成为杀熟目标。这一现象外显为价格的偏见和歧视，但实质是暴露出了大数据和人工智能产业发展过程中的非对称性和不透明化。因此，要以合理有效的方式优化广告投放管理机制，促进精准广告服务商与消费者个人数据的对称性和透明化，加强对个人隐私权的保护。


    ## 四、还你一片阳光：个人隐私的保护进路


    精准定向广告推送引发的隐私权的纷争，是人们普遍的隐私意识的觉醒，是对当下隐私权保护中存在的价值与规范的矛盾冲突的超越性探讨。在精准定向广告推送的过程中涉及的个人隐私保护的问题，是目前在隐私问题领域最为显著的“权力”与“利益”相争的问题，对于这个问题的解决，既需要个人的力量，更需要整个社会系统的联动和全方位的社会介入。


    ### 从个人的角度来看

    隐私权被侵犯问题的根源不在于技术的发展，而在于人自身，因此，解决这个问题仍应从人入手。人是区别于动物的有思想、有意识、有目的性和创造性的社会存在物，在社会发展过程中占主导地位。精准定向广告推送所导致的隐私权侵犯必然与人的目的和欲望密不可分。网络社会中引发的种种问题，归根结底是网络空间中个人权利与社会需要之间的冲突\[15\]。因此，网络监管和隐私保护的首要工作是对人的教育、引导和管理。


    #### 首先，增强个人责任意识

    人是出于对他人的信任或是处于规则之下，才将自己的信息甚至隐私交于他人保管的，因而运营商应自觉承担其应有的责任。责任伴随着人类社会的出现而产生，不同的角色需要承担不同的责任。为保护个人隐私权，社会群体需要增强责任意识。在精准定向广告推送中，对个人隐私权的保护主要涉及网络运营商、技术人员、消费者等几大类型的群体。网络运营商不仅要承担起对个人隐私权尊重与保护的责任，也要承担起研发信息保护技术的责任；为了有效保护个人隐私不被侵犯、为合理利用个人数据提供技术保障，技术人员不仅要努力控制技术的“滥用”，抵制具有杀伤力技术的使用，也要积极研发保护个人隐私权的新型技术；消费者在个人隐私权保护过程中也应发挥主导作用，自觉树立保护自我数据的意识，承担起保护个人数据的责任，认真做到对自己的数据负责、对自己的行为负责。


    #### 其次，加强对人的信息素养、数据素养和智能素养的培养

    无论是公民对自我数据保护的意识，还是对信息保护的责任感等，都与公民的受教育程度与文化水平有着密切联系，尤其是与公民的信息素养、数据素养和智能素养有关。因此，在大数据和人工智能时代，为有效保护个人隐私权，急需培养人的信息素养、数据素养和智能素养，提高自我隐私保护能力。同时，还要普及法律知识，让人们真正学法、懂法并会用法，利用法律这一锐利武器来保护自己的隐私权；要加强道德教育，提高人民群众的道德水平，减少不法行为的产生。概括来说，就是个人要能够从信息素养、数据素养和智能素养的培养中，完善个人对个人隐私保护的理性态度，以便确保个人能够回答自己的隐私是什么、哪些可以公开、哪些不能够公开、隐私受到侵犯该如何尽快止损、如何拿起法律“武器”维权等问题。


    #### 再次，在大数据和人工智能时代，对于人的隐私问题的突破与超越，无疑是获得解放的时代

    马克思在谈到人类解放时明确强调：“任何解放都使人的世界即各种关系回归于人自身”\[16\]。在此意义上，人是一切技术的终极关怀目标，工业技术革命解放了人的肢体，而大数据和人工智能技术的发展则解放了人的大脑。在大数据和人工智能时代，人们越来越依赖智能手机、移动设备等大数据和人工智能产品，这在某种意义上导致了“人”的数字化与透明化。如今，个体不是通过收集、量化数据就能从中“挖掘”出有用信息，数据超越个体层面，内在地诉求一种更广、更高维度的“挖掘方式”；人们不再局限于自我范围的单机游戏，而是进入“大连接”的网络之中。朋友圈、微信群等构建了多维度性、破碎性、无约定的人际关系。大数据和人工智能技术极大地增强了人的开放性、灵动性、社会性，使人形成了更加自由、多元的人际关系，以及更加全面、丰富的社会关系。大数据和人工智能时代需要唤回人性，重构人类在创造历史中的主体地位，方可逐步解决个人隐私数据的透明化问题。一是构建主体间性。主体间性表明主体之间存在共性，但共性并不排除个性。正如海德格尔所说，“此在的世界是共同的世界，‘在之中’就是与他人共同存在。他人的世界之内的自在存在就是共同此在”\[17\]。因此，既然所有人生活在一个共同的“此在世界”，我们就应该有自己的隐私空间，这是确保独立个性得以保持它的价值的前提。二是构筑网络道德规范。网络道德规范需要从一般的伦理原则体现“己所不欲，勿施于人”，同时还需要把网络伦理规范内化为网络主题内在自律的道德力量。三是把大数据和人工智能时代的伦理原则纳入现实的生活中。虚拟世界是现实生活的一部分，但绝不是现实生活的替代或超越。因此，要把网络伦理原则应用于现实生活，这样才更有利于解决现实生活中个人遇到的隐私问题。


    #### 最后，加大监管力度

    人，虽知善恶、明是非，但其行为易受利益及欲望的驱使。为了预防不法行为的发生，仍需对个人行为给予必要的监督。欧盟专门设置的数据保护监督专员\[18\]，就是以一种创新性的方式来加强监管。政府要设立专业的监管机构，建立完善的监管体系。譬如，引进数据预测、电子监控等高新技术，做到具有选择性、目的性和预防性的监管，提升监管质量。监管的目的在于加强自律。政府加强对个人行为进行监管的过程，就是在为企业、为个人培养高度自制力的过程。


    ### 技术层面的约束与发展


    解铃还须系铃人，隐私问题的产生与技术的发展密切相关，因此其需要技术的进一步合理发展来解决。技术是推进社会发展的加速器，但技术的发展不能无节制。保护个人隐私权，需给技术研发和应用以必要的约束。精准定向广告推送中出现的隐私权侵犯与技术的不适当应用密切相关。因此，需要为技术的发展划定范围，适当地加以限制，切实保护个人隐私权。


    #### 首先，为技术划定发展范围

    技术是一把双刃剑，它既可以是社会发展的催化剂，也可以是破坏人类社会和谐稳定的主导力。为保护个人隐私权，需要控制技术的无节制发展与运用。在技术的作用下，我们的隐私逐渐被他人所知。如果对此状况不以为然，那么数据分析和数据预测等技术的发展在未来带来的“歧视”“偏见”与人身威胁将令人惊恐。当我们发觉某项技术的研发将带来不可弥补的危害时，需要做出理智的选择与决定。为了个人隐私的安全、未来生活的安宁，我们需要加强对技术的管理，对研发的工具加以整修，以便为人所用的工具能为社会提供更为积极、有益的服务。为此，要有效打击黑色产业链，必须改变已有的“单兵作战”的模式。过去各行业是条块分割的，没有打通，而未来需要全行业联合起来共同打击。应由政府部门牵头，发挥产业链合作的优势，利用大数据分析、云计算和云存储能力，对黑色产业链进行全面反击。


    #### 其次，在技术发展中嵌入伦理道德

    技术是人类改造世界的工具，是由人类创造出的、可被人类所管理和改变的，在技术中嵌入道德理念，将有效解决技术运用过程中带来的问题，保护人的合法权利。利益是道德的基础，道德就是处理各种利益关系的准则或规范\[19\]。传统观点认为，人是具有价值取向、能动性和责任感的，而科学技术本身没有责任感可言。技术发展中所包含的道德观是人类赋予的。若打破传统观点，在技术创造伊始便输入道德理念，在技术运转体系中自带道德观念，则是对传统技术的突破性发展。在技术研发过程中，可将道德理念如同运营编码一般嵌入技术启动发挥作用时的标准中，即在预测结果后再启动其程序，发挥其作用。像电影《超能陆战队》中的人造医疗机器人大白那样，在启动功能、发挥作用之前，对指令进行筛选、判断，若发现该指令具有一定的伤害性，可自行终止活动，或不执行操作者所发出的指令。技术部门需要加大研发力度，在技术研发过程中嵌入道德理念，给予技术以判断能力和选择能力，从而为人类社会带来更多的效益、更少的危害。


    #### 再次，“互联网+”和“智能+”概念的出现有效地促进了云计算、大数据、人工智能与物联网等产业的发展，给我们的生产、生活、学习与工作带来了前所未有的变革。技术发展中存在的个人隐私问题，需要靠发展技术来解决。2016年10月18日，在工业和信息化部信息化和软件服务业司的指导下，中国区块链技术和产业发展论坛编写的《中国区块链技术和应用发展白皮书（2016）》正式亮相，区块链以其可信任性、安全性和不可篡改性让更多隐私数据从危机中解放出来。例如，区块链可以利用私钥限制访问权限，从而有效回答法律对个人获取数据的限制问题，解决个人隐私泄露问题。另外，对于因大数据和人工智能技术不完善而引起的问题，可以通过发展技术进行解决或缓解。例如，之前犯罪分子利用黑客技术破解高考报名系统并入侵盗窃考生的有关数据信息，实施精准诈骗。此类技术上的漏洞，据专家介绍，可以通过研发“多因子身份验证技术”来提升多层次大数据安全管理的可控性，从而有效防止类似“数据盗窃”问题，解决大数据和人工智能发展过程中遇到的隐私侵权问题。

