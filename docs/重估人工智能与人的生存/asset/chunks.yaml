    # 第三章　医疗：人类能否实现长生不老

    医疗的变革：人工智能与人的合作

    传统医疗的颠覆：人类能否实现长生不老

    智慧医疗：传统医疗不可比拟的优势

    达·芬奇的遗产：手术机器人在质疑中前行

    人工智能的魅力：医疗技术在智能时代的创新

    人工智能在医疗领域中的应用已非常广泛，包括疾病预测、药物研发、临床诊断、辅助决策、医学影像、病历与文献分析等。相较于传统医疗，人工智能医疗兼具提升工作效率、降低工作强度、提高就诊准确率等优势。基于大数据的人工智能医疗，通过运用深度学习技术，不仅可以从宏观视角把握患者病情，还可以从微观层面做到细致入微，防微杜渐，促进医疗理念从“治疗”向“预防”转变。两者并行，留给人类一个健康的生存空间。


    ## 一、医疗的变革：人工智能与人的合作

    传统医疗历经数年的创新与变革，最终还是没能战胜自身的弊端而产生质的飞跃。当下要想实现医疗领域的革命性变革，必须假以人工智能和大数据之手，待条件成熟，定能从新一代信息技术和人工智能技术的创新突破中、在人与机器的合作发展中，看到新时代医疗革命的曙光。

    在原始社会，医学的发展也表现出其原始性，一切都处在摸索和经验积累的阶段——“神农尝百草”的故事或许正好说明了这一点。当原始的人类面对恶劣的自然环境时，更多的是表现出无能为力；当人们不幸染上重大疾病时，对自然的崇拜开始发挥其强大的影响力，乞求神灵保佑成为人们最大的宽慰。这个时段，人们很少借助工具用以辅助疾病的治疗，在医疗领域，工具与人的合作仅仅处于萌芽阶段。人类跨入奴隶社会、封建社会，随着社会生产力的发展和医疗经验的积累，医疗诊断技术开始发展，人们逐渐将更多的工具用于医疗领域，人与工具的合作关系逐步建立，最初形态的人与工具的融合现象开始出现。

    第一次工业革命的降临，使人类社会发生了翻天覆地的变化，其社会影响之广泛几乎覆盖了包括医疗在内的整个社会生活。随着技术的演进，无数的工具越来越与人的生活密切相关，甚至已经到了人离开工具就难以生存的地步。

    如果说在这之前的人与工具的合作主要体现在物理方面的话，那么，从第二次工业革命开始，电力的广泛应用彻底颠覆了人类的传统。也就是从这个时候开始，单就医疗领域而言，人类整体的医学技术有了质的飞跃，借助物理与化学的手段而发展起来的西方医学，为现代医学的发展奠定了坚实的基础。

    随着新一代人工智能技术及以基因工程为代表的生物技术的快速发展和广泛普及，人们发现，人工智能医疗器械的使用对于医学领域的创新意义重大，人们开始不断地将医学的进步诉诸科技的创新。同时，众多资本的驱动，也加速了医疗革命的突飞猛进。

    从人类自身结构特点出发，人们在开始由自然性逐步延伸到社会性的过程中，逐渐意识到，人类自身的局限性对于进一步发展的限制，传统的医学借助物理手段辅助医学发展的模式得以解释。如果说过去的医学模式的发展中，人与机器的合作是一种“难舍难分”的合作的话，那么新一代人工智能技术的发展，便是把更多的独立性赋予机器的过程。或者更确切地说，人们希望从医疗领域的不确定性风险的焦虑中摆脱出来，故而不断地赋予“那些能够代替人类医生的智能机器”以更多的人类智能。

    人类的追求永无止境，科技的进步永不止步。人工智能与人的合作助力医学领域的创新发展也是如此。人们越是想追求个性、自由、解放、尊严和价值，就越有潜在的动机去推动在人工智能身上寻求更多可以合作的空间，从而最大可能地把自身所拥有的智能重现于人工智能身上。

    人工智能医疗目前正处在进一步发展当中，社会各界都在想方设法寻找突破口，希望能在广阔的智能医疗领域中占据一席之地。截至目前，人工智能在医疗领域中的应用已非常广泛，包括疾病预测、药物研发、临床诊断、辅助决策、医学影像、病历与文献分析等。据统计，目前国内已经有200多家公司（百度、阿里、腾讯等也在其列）开始涉足人工智能医疗领域，累计融资金额已超200亿元，这对于国内医疗的发展变革具有重要的推动作用。2019年4月12日，全国首家医疗机构医学人工智能研究院、大数据算法与分析技术国家工程实验室——智慧医疗创新中心在西安交通大学第二附属医院的大明宫院区成立，医疗“产学研”融合发展的机制正在形成。

    人工智能医疗是指以大数据、人工神经网络、模式识别、深度学习等技术为基础，以标准化的医疗大数据的共享为前提的智能医疗系统。它不像大数据那样，在医疗信息化的基础上，无限地追求医疗数据的积累，也不是在数据积累后，需要人工利用传统的挖掘技术来分析医疗大数据，这在某种程度上来说，仅仅停留在医疗数据化之后的“快捷和方便”的层面。它是以一种超出你现在所能想象的模式，重新定义了从疾病的发现，到医疗数据的传递与共享，再到最佳治疗方案的选择等的全过程，并将其赋予另一种创新的元素。也就是说，我们现在所看到的关于医疗领域的一切，除了医疗机构和医生，其他的基本都被重新定义了。

    从模式识别（语言识别、图像识别、射频技术、信息高级检索、手写识别等）、人工神经网络到深度学习等技术的不断发展，人工智能将彻底改变医疗领域的发展模式。人工智能借助其智能优势，能够对复杂医疗数据进行深度学习，对于当前的医疗预测、诊断和治疗具有重要意义。通过人工智能与人的合作，医疗领域的人工智能化必将能够更精准、更高效、更廉价地解释各种疑难杂症，如各种重大疾病（如各种癌症、白血病等）、慢性疾病（如糖尿病、心血管疾病等），并对其进行高效、精准的预测、诊断和治疗，从而减轻患者的经济负担、家庭压力和疾病疼痛，挽救更多患者的生命，这对患者而言无疑是最大的福音。

    畅想人工智能医疗运用场景，在医疗诊断与疾病预测方面，患者完全有能力根据自己的需要求助于人工智能辅助医生决策的系统，你只需要按照系统的提示并配合机器完成相关就诊程序，就可以实现精准就诊，从而产生出符合患者个人病情的治疗或预防的方案，而不用再去麻烦一位正在给其他患者讲述治疗方案应该怎样执行的医生。

    但如上这些方面，人与机器需要怎样的合作默契才能实现呢？

    这需要回到人工智能机器的运用上来。人工智能时代，人与机器的合作与传统工具的使用具有较大的区别，因为传统工具的使用（如手术刀、开口器等）具有绝对联合的特点，工具是以人的一部分的角色出现的，而人工智能机器则不同，它相对于人而言具有相对独立性，在人工智能机器的运用过程中，机器的运转与人基本是分离的，要么是远程操控，要么是近距离指挥，这对于操作失误的破坏性的发生与灾难被阻止之间存在更长的时间间隔——待阻区间（笔者自命名）。如果机器与人之间的合作没有达到“人机一体”的境界，则随着人机合作熟练程度的由高到低，待阻区间的灾难损害程度就会恶性蔓延，如图3-1所示。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt004_1.jpg)

    图3-1　待阻区间函数


    因此，要想利用人工智能与人的合作推动医疗的变革，还需要从以下几个方面来促进人与机器之间的合作“一体化”：第一，熟练地掌握人工智能医疗工具的运作原理，未来不懂人工智能的医生不是好医生；第二，在具体操纵人工智能医疗工具之前，必须有足够的训练课程，以帮助医生完全熟练地掌控机器，以达到人机合一的熟练程度；第三，操作人工智能机器人的医生，需要有极高的医学素养，能够在机器运行中把控机器人走正确的手术流程，或者能够在机器操作失误时准确判断失误的存在及位置，并迅速进行矫正；第四，医生要具备健康的身体、心理素质，以保证在使用人工智能医疗工具的过程中不会因身心不良导致医疗事故的发生。

    这些都是人工智能医疗领域，人工智能与人的合作过程中应该具备的基本素质。人与机器的合作，历来对于医疗的发展都具有推动作用，虽然不同的历史时期有不同的合作方式，但怎样发挥其优势，避免其消极影响却是一门大学问，这在人工智能医疗发展的过程中需要引起高度关注。

    随着人工智能与医疗领域的深度融合，人工智能与人的合作默契不断提高，一场传统医疗领域的危机战正在打响，这是一场未来之战，一场生存之战，传统医疗领域的颠覆，正在无声无息地进行着。


    ## 二、传统医疗的颠覆：人类能否实现长生不老

    1943年，美国著名心理学家亚伯拉罕·马斯洛在其《人类激励理论》一文中提出了人类的需求层次理论，将人类的需求按层次从低到高分为生理需求、安全需求、社交需求、尊重需求和自我实现需求，如图3-2所示。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt004_2.jpg)

    图3-2　马斯洛需求层次理论


    从马斯洛需求层次理论来看，人的呼吸、吃的食物、喝的水、机体平衡、排泄及睡觉等，构成了人类最基本的生理需求。这些是人类能够维持其生命体征的最基本的需求，缺乏其中之一，人类都将难以继续繁衍生息。当最基本的生理需求得到满足之后，人类的需求开始不断地尝试着向安全需求、社交需求、尊重需求等更高阶的方向前进，最终迈向自我实现需求。

    如果对人类需求进一步进行研究，我们不禁会问：当人们已经满足自我实现需求时，还会有何期待？思考当今医疗中的过度治疗，就会明白，其实，人类在自我实现需求之上，还有一个更为深远的需求——长寿的需求。

    长寿到多少岁这个具体数据没有办法准确给出，因为人们对长寿的定义都希望是“永生”！从图3-3所示的更详细的马斯洛需求层次理论中是不是会受到一点启发？


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt004_3.jpg)

    图3-3　更详细的马斯洛需求层次理论


    追溯到原始社会，住在山洞里、吃着生冷的食物、采摘野果、四处打猎、吃完上顿愁下顿的原始人类，由于恶劣的生存环境，其平均寿命只有25～40岁。随着社会生产力的发展、火的使用、技术的发明、医疗的进步，人类的平均寿命在不断延长，以至于古书《内经》的作者认为，人的自然寿命应该在100岁左右，而在《老子》一书中则认为，人类的寿命为120岁。可见，在当时的社会条件下，已经不乏长寿之人，这才让人们推测理想中的人类寿命极限。

    回到当代，当今也有不少医学理论认为，理论上人的寿命为120岁。但遗憾的是，绝大多数的人总是在生命进行到大半时就已经戛然而止。据世界卫生组织最新公布的人类平均寿命的数据显示，中国人的平均寿命为76.1岁。

    '
  trans: '


    从人工智能的优势来看，前文叙述的“三大原则”（出发地到目的地之间的距离最短原则、出发地到目的地之间的路程所花的时间最短原则、交通线路网上运行车辆并行数量规模最大控制原则）所需的系统控制能力，基本都在人工智能系统控制的范围内，只要将现有的交通领域基础设施进行更换，使得数据的感知和获取能够及时、准确，嵌套进去的人工智能深度学习算法就能从根本上实现，并且这对于人工智能来说，算不上什么难题。出行做到了真正的舒适、便捷、畅通无阻。

    曾经，杭州是国内第五大交通拥堵城市。近日，经过在交通领域引入人工智能技术，目前杭州在交通拥挤名单中已经下降为第 57 名。对此，阿里巴巴就指出，这要归功于城市大脑发挥的作用，在杭州市通过路口摄影机获取的影像及汽车和巴士位置的
    GPS 数据，平台将这些信息以人工智能（AI）进行收集和分析，切实防范和舒缓了交通堵塞的情况。


    ## 五、无人驾驶汽车上路：不仅仅是安全问题

    无人驾驶汽车上路，其安全系数大为提高。当人们都期待着各大公司迅速实现量产的同时，不可控的因素和非法故意而为之的安全问题仍然有待探讨。不可控的自然因素是不可避免的，也是任何交通出行方式都无法精准规避的。但是，值得注意的是，在今后的无人驾驶交通领域，除技术故障带来的突发性安全问题外，其余的安全性能的提升，大部分都要将注意力从技术上转移到对不法分子的关注上，以及对无人驾驶汽车的合法性的争辩——这就不得不涉及无人驾驶汽车的伦理道德与法律问题。只有构建一个包括法律和道德在内的健全的无人驾驶服务体系，才能助力实现其“零交通事故”的未来目标，或者换句话说，就是无限地逼近这一目标。

    分析无人驾驶汽车发展的伦理道德与法律问题，有助于探寻有效的无人驾驶领域的社会治理路径，而不仅仅停留在“以技术攻克技术难题”的层面上，从而使这项重大的人工智能技术在其商业化、实用化的道路上少走弯路，使其发展更健康、快速，更好地造福全人类。

    从技术漏洞被不法分子利用的层面而言，无人驾驶汽车的出路何在？说到底，无人驾驶汽车是基于数据的深度学习算法的智能化系统。既然是基于数据，那么，我们在即时抵抗别有用心的不法分子的入侵时，很容易处于被动状态。已有相关研究发现，黑客可以通过入侵车载系统，远程控制刹车和转向。同时，每辆无人驾驶汽车的信息均是整个大数据的一部分，数据一旦丢失、被盗取或遭遇黑客入侵，此类信息极有可能被恶意泄露或利用，这对于无人驾驶的打击是致命的，也是所有风险中最难以应对的。

    所谓黑客（Hacker），就是指计算机顶级高手，可以随意操控他人计算机的人群。他们也是计算机专家，一旦他们恶意操控公共的服务系统，损失将是不可预测的。例如，2018
    年发生的几起黑客事故，北美最大的面包连锁品牌 Panera Bread 发生数据泄露，受害人数为 3700 万人次；New Egg 电商平台遭受网络犯罪团伙
    Magecart 的攻击，受害人数为 5000 万人次；美国知名问答社区 Quora 遭到黑客攻击，受害人数为 1 亿人次……类似的攻击事件数不胜数，损失不计其数。如此种种说明，目前我们没办法保证在无人驾驶普及于城市的大街小巷时黑客能够“心慈手软”或者“回心转意”，只能尽最大努力保证无人驾驶系统的安全性。这也是目前无人驾驶需要回应的最为严峻的问题。

    2017 年 4 月，英国埃克塞特大学无人驾驶汽车领域一位保险专家 Matthew Channon 就曾经写信给政府，称无人驾驶汽车将成为黑客攻击的下一个目标。这一警告引起专家们的注意。2018
    年 5 月，网络安全服务商 360 集团创始人兼 CEO 周鸿祎表示，在未来的无人驾驶领域，最担心的就是无人驾驶汽车被黑客攻击，在不经意间就被黑客劫持了。

    当然，无人驾驶遇上黑客问题，并不是无解的难题。一方面，我们应该相信黑客也是有良知的，就如以色列的 Coindash 公司被黑客盗取 3.7 万 ETH（3200
    万美元），等其升值 2 倍后竟获黑客归还。另一方面，黑客最强劲的对手当然也是黑客，“天下熙熙皆为利来，天下攘攘皆为利往。”我们可以高薪聘请黑客作为无人驾驶领域的管理者。最后，在无人驾驶研究的领域，结合黑客技术进行软件设计，实现技术战胜技术性的恶意攻击。例如，韩国就已经开始着手布局了。根据外媒数据显示，韩国国家研究机构目前已经与嵌入式安全解决方案公司
    ESCRYPT、信息技术融合解决方案公司 Han com MDS 等科技公司合作，研发新型无人驾驶技术，用于阻止黑客对无人驾驶汽车核心系统的攻击\[5\]。

    在无人驾驶领域，无论是法律的滞后性还是黑客的恶意攻击问题，都在一定程度上反映了无人驾驶领域的发展挑战。虽然任务艰巨，但其巨大的发展优势也在不断地吸引着我们去勇敢地迎接挑战，攻克一个又一个无人驾驶难题。那么，在国内，我们在伦理、道德和法律等层面又该做些什么准备，才能更好地迎接这样一个出行便捷的时代呢？

    首先，要健全相应的法律伦理规范。无人驾驶汽车作为新兴的人工智能技术潮流，具有无限的生命力，而要把其生命力最大限度地激发出来并使其更好地服务于人类，必须把发展人工智能技术与健全法律与伦理规范有机结合。在这个高度依赖科技的社会，唯有技术和规范相配合，才能使维护公序良俗和追求科技发展相得益彰，才能使技术真正地为人类服务。在这一点，由于西方国家比中国更早地进行了技术与法律等相关领域的探索，国家间的交流与沟通，甚至国际的统一标准的探讨都应该纳入无人驾驶汽车发展的议程之中。同时，要把无人驾驶汽车相关的审批、标准、违章、保险等子领域都涵盖进立法视野殊非易事。而一个足以颠覆现存世界的技术的发展，理应由各个国家、企业、社会组织携手合作、互通有无，共同探索立法善意与各方责任的界定。因此，以前瞻性的眼光，健全与无人驾驶相适应的法律和伦理规范已成必然。

    其次，要建设合乎要求的智慧城市。无人驾驶汽车对于智能化的城市建设提出了更高的要求。道路建设、能源供应、制度管理、交通规则等现行的城市道路文化，都面临着必须适应驾驶工具智能化做出改变的巨大挑战。需要政府在大力推进智慧城市建设中应坚持走高新科技路线，借助市场力量和开放、高效的交流，提高智慧城市的建设效率；需要企业肩负起自己的社会责任。智慧城市建设需要各行各业努力实现跨界整合，打破信息孤岛和智能孤岛的隔阂，实现信息资源、智能技术、文化理念的协同共享，在实现效益最大化的同时兼顾对社会的回报；需要坚持机制体制创新，推进智慧城市建设要一手抓新技术应用，一手抓体制机制创新，充分利用新一代信息技术，发挥“互联网+”和“智能+”的动力引擎作用，只有建设了相应的智能化城市，无人驾驶汽车的发展才会有肥沃的土壤，无人驾驶才能又好又快地惠及人类。

    最后，要建构适应智能时代的文化。无人驾驶汽车技术作为弱人工智能的一个方面，要服务于人类，还必须与人文理念相结合，建构适应新时代的智能文化。在发展人工智能技术时，要坚持高扬人的主体地位，做到以人为本，处理好人与机器、人与科技，以及价值理性与工具理性、技术可能性与伦理合理性之间的关系，尤其要把科学精神和人文精神有机结合，“把技术的物质奇迹和人性的精神需要平衡起来”；应当在大众文化中推广对无人驾驶汽车的正确诠释，以免大众由于对新兴科技的无知，而陷入恐惧的境地。例如，无人驾驶汽车可以选择知名的人物来试驾，以抓住大众的眼球，扩大无人驾驶汽车的影响力，并通过视频、图像、文字的数据资料来宣传其成果。要发挥无人驾驶社会组织的学术能力与技术控制作用。积极研究与无人驾驶汽车相关的技术、法律、伦理等问题，始终坚守住惠及大众的立场和以人为本的出发点，做到无人驾驶的发展要适应时代的人工智能文化。


