  trans: '


    # 一、学生学习方式的转变


    回归到科大讯飞的个性化学习手册，它从学生学习的对立面入手，为学生的学习方式的转变提供了支撑的工具，将其广泛运用于教育行业无疑能够推动学生学习方式进一步转变，但其间也存在一些需要注意的问题：学习工具的互联性，是否会给学生的学习带来负面影响，是否会在更为便捷的学习资源的获取渠道中越发远离新型人才的培养目标？答案具有不确定性，但我们可以采取相应的措施对学生的学习过程进行干预。


    学生学习方式的转变伴随着学生主体性的回归，这对学生的学习自律提出了新要求。


    在新的学习方式中，学生有可能产生对大数据和人工智能平台的 PGC（Professionally Generated Content，专业生产内容）的依赖。令人担心的是，由于学习自律能力不强，学生可能将此种依赖转化为对大数据和人工智能工具的依赖，进而投身于关注工具中带有娱乐性质的服务软件，这很有可能影响学生在学习过程中的主体性角色的正常扮演。因此，我们可以从如下几个方面对学生学习方式的变革提供辅助。新的学习方式的形成、把握新的学习理念，都需要新的学习习惯予以支撑和回应，这样才能将“效果最大化”。


    ## 首先，学生要培养自律能力


    自律在学生自主学习的过程中扮演着非常重要的角色。以往的学习方式之所以一直在奏效，在很大程度上是因为学生没有养成自主、自律的学习习惯，如果不对学生进行灌输式教学，学生就不会主动投身于学习活动。当然，少部分自律的学生则不同。随着学生学习方式的转变，学生自己势必要树立学习的自律意识，“管理好、计划好、执行好”自己的学习过程，从而保证新的学习习惯能够迅速养成。只有这样，学生才能确保自己在学习过程中不被“多姿多彩”的大数据和人工智能世界诱导和迷失方向。


    ## 其次，提高自己的信息免疫力


    在大数据和人工智能技术构建的虚拟网络空间中，存在大量的信息污染。冗余信息、盗版信息、虚假信息、过时信息、错位信息等，都是信息垃圾，它们是静态的、无法自行激活的信息。学生在综合提高自己信息素养的过程中，决不可忽视提高自己的信息免疫力，要使自己具有正确的人生观、价值观、甄别能力，以及自控、自律和自我调节能力，从而自觉地抵御和消除垃圾信息及有害信息的干扰与侵蚀。同时，要注意预防盲目的信息崇拜。预防盲目的信息崇拜，在一定程度上就能减少学生对信息的滥用和误用，降低不良信息的影响程度，从而有效避免“现实人”与“网络人”人格的二元分裂和物理空间与网络空间的严重脱节，形成虚拟与现实之间的良性互动，有效提高学生在网络空间中学习和生存的能力。


    ## 再次，教师要予以学习指导


    教师要善于结合外在的规范化要求，指引和帮助学生提高他们的学习能力。教师作为教育过程的主导者，需要对学生的新的学习方式予以检验，充分关注学生的学习动向，主动指导学生正确地使用新的学习工具。


    ## 最后，大数据和人工智能学习平台要予以内容控制


    学习平台以渠道为主，学生的个性化学习来源于平台的技术支撑，所以，对于学生的自律问题，学习平台要积极对非学习型渠道进行有效控制，学习平台的后台应该对无关学生学习的信息进行“把关”和“筛选”，以便做到“按需而行”和为学生的个性化学习提供精准服务。


    ## 总之


    在大数据和人工智能时代，学生学习方式的转变，伴随着学习理念的转变，这是学生主动参与学习的必然过程。丰富多样的网络资源、日益成熟的人工智能技术正在提供越来越便捷的技术支撑，这使得我们可以进行适应性、个性化的学习，而不必局限于在正规学校进行传统学习\[5\]。大数据和人工智能技术赋能教育，使得学生的学习方式发生了明显的转向，从“死记硬背”到“理解记忆”，从“书本思维”到“经验思维”，从“被动学习”到“理解学习、探究学习、合作学习、建构学习”等，这些都在为学生的新发展提供新的条件。我们应该合理利用新兴技术辅助学生的学习，切实培养学生“会学、能学、想学”的动机与能力。在运用具有“双刃剑”性质的学习机器时，学生应转变学习方式，也应转变对大数据和人工智能等学习工具的认识，不断培养自身“会用、勤用、不滥用”的能力。


    # 二、教师：地位转变与角色转换


    韩愈在其《师说》中有一句话：“师者，所以传道授业解惑也。”教师的职责就是传道、授业和解惑，将毕生所学的知识教给学生，以期实现学生亦能为人师。在大数据和人工智能时代，与技术赋能的学生个性化学习相对应的，自然是教师的个性化教学。换言之，教师需要结合学生的个性予以教学，需要针对具体的个人进行“传道、授业和解惑”，这就对教师的能力提出了更高的要求。教师不仅需要关注学生对书本知识的学习效果，还需要关注学生个人的生活情境，对其消极心理要给予辅导等。总体而言，在新时代，教师的角色与地位开始出现新的变化，教师的教学方式也出现了新的转型。


    ## 教书与教学的本质区别


    “教书”与“教学”是两个相近的概念，却有着本质的区别。教书是指教师将书本知识“清晰明了”地传授给学生，教学则是指教学生掌握学习的技能与素质。前者的主角是教师，后者的主角是学生，两者包含的教学活动的方式和载体不同。在教书的过程中，教师与学生之间是一种自上而下的权威关系，学生对于教师而言，更像是一张白纸，任由教师去塑造。所以，在教书的过程中，受教师的权威地位的影响，知识载体（书本）也是具有权威性的，教师与学生之间的知识传授也是基于对权威的信任。


    然而，随着大数据和人工智能技术的发展，学生的“第二课堂”逐渐丰富起来，教师的“教书”活动逐渐向“教学”活动转变，这一方面是基于学生的知识接触面的变化，打破了教师对知识的权威性；另一方面是基于新的个性化学习资源平台的诞生，让学生的个性化需求得到满足，譬如在高中课堂，部分成绩优异的学生上课时不听教师讲课，也能学好相关理论与实践知识，这就是因为他们善于利用大数据和人工智能平台提供的个性化教学资源。《老子》中说，“授人以鱼，不如授人以渔”，“教书”与“教学”的差别，在一定程度上就是“鱼”与“渔”的差别。所以，在当下及未来的教育中，教师所从事的活动应该是“教书”还是“教学”，答案似乎已经很明朗。


    ## 角色与地位的转变


    综上可知，教育活动中的“教书”向“教学”的变化，反映的是大数据和人工智能时代教师角色与地位的变化。教师开始从“知识的灌输者”“学习的强迫者”“经验主义者”等角色向“组织者”“主导者”“设计者”“促进者”“关系协调者”“知识的筛选者”等角色转变；教师的地位开始从“长者”“前辈”“知识的拥有者”“权威”等向“合作者”“倾听者”“支持者”等转变。由大数据和人工智能技术促成教师从事的教育活动从“教书”向“教学”的转变，是对新时代的学生学习方式的个性化转变的积极回应，同时也带动了教师的角色与地位的转变，究其根源，这些转变无疑都与“以人为本”“以学生为中心”的新时代教育理念相关。


    所谓教育活动，在大数据和人工智能时代，主要包括“教学生如何学习”与“如何使学生学以成人”这两项活动。为了能够将这两项活动与学生的个性化需求结合起来，教师需要借助大数据和人工智能技术来深入学生群体，去了解学生的“所思所想”与“所作所为”，具体包括学生的宿舍号、作息时间、每个学生的考试成绩（各次各科的成绩、不同时间段考试成绩的变化规律等）、作业完成情况（错题集、练习题目与学生水平是否相匹配等）、家庭经济状况、监护人联系电话、学生的联系方式、学生的课堂表现等。此外，教师还需要了解社会的变化及这些变化对学生的能力提出的新要求，从而把握学生的学习动向。


    玛克辛·格林在其《释放想象：教育、艺术与社会变革》一书中说：“如果一个人要真正了解人们的意图，感受他们的主动性，体验他们面临的不确定，就必须作为一名参与者深入事件发生的过程中。”\[6\]那么，同理，作为教学活动中的教师，要想真正了解学生所需，了解学生主动性和积极性的爆发点，了解学生可能面临的各种不确定性焦虑，教师就应该借助大数据和人工智能工具，扮演“学生知己”的角色，作为一个教学活动的积极参与者深入到学生的学习活动中去。


    在大数据和人工智能时代掀起的这一场教育的革命，就学生而言，他们是顺其自然地适应新的学习环境的，他们中的大多数是“数字原住民”。相较而言，教师则显得有些被动，需要被动地加入这个环境，毕竟他们是“数字移民”，是从另一种环境中成长起来的教育的“中坚力量”。在当今极具变革的学习环境中，阿克夫在其《翻转式学习：21
    世纪学习革命》中说：“大部分教师——无论他们接受了怎样的训练——都不能指望自己在课堂上教授的内容可以跟学生随意从自己选择的来源那儿获得的东西相媲美。”\[7\]在某种程度上来说，只要学生善于将大数据和人工智能技术用于学习，当然也就更善于接受他们自己寻来的教育资源。对于教师筛选的资源，其自然会因“间接感受”的缘由而显得不那么容易被学生接受。就此而言，在大数据和人工智能时代，能力目标的变化促成了学生学习方式的变革，教师虽然“被动”地改变了角色和地位，但需要“主动”地重新“匹配”新的能力。


    ### 第一，思维能力


    “环境决定思维，思维决定行为，行为决定结果。”为了能够适应新的教学环境，教师首先需要思考的是其应该具备怎样的思维能力，怎样“以思维上的远见”缩小与学生个性化学习之间的需求“代沟”。思维能力是学生学习能力的核心素养，教师作为教学活动的主导者，自然需要培养自身的思维能力，以便在教学活动中与学生的思维能力发生碰撞时能够分享自己的独到见解，从而达到启迪学生的目的。在大数据和人工智能时代，教师的教学要以思维教学为主线，既强调基于认知能力的信息加工、分析综合、逻辑推理等高阶思维的培养，又要增加和突出计算思维、设计思维和交互思维的培养\[8\]。


    ### 第二，教育技术能力


    教育技术能力主要指教师运用互联网、大数据和人工智能技术的能力。从媒介的角度而言，教师的教育技术能力又包括使用传统媒体的能力和使用新媒体的能力。与之相对应，教师在教育技术能力的培养上，要逐一培养在幻灯片（设计与排版、内容筛选等）、投影（软硬件的使用和维修）、电影、教育网站设计、教学情境设计、微信公众号运营、摄影摄像、视频剪辑、智能问卷设计、智能教案设计、在线课堂、慕课等方面的细化能力提升。教师应从教育资源的技术整合、知识可视化、美感提升等角度出发，从有利于学生对所学内容进行意义建构的角度出发，创设丰富的技术化学习情境，加强学生之间的交流与合作，并尊重学生独特的情感和体验\[9\]，以贴近学生的智能学习生活方式，将含有价值信息的教育内容作用于学生的“大脑”，教师自动“匹配”教育技术能力，目的在于更好地促进学生学习，以实现“教学效率”与“教学质量”的变化，推动学生“学习效率”与“学习质量”的变革。


    ### 第三，读懂学生的能力


    教育是带有强烈“社交属性”的社会实践活动，闻名于世的“产婆术”就是基于教师与学生的社交互动过程进行教学的典型。因此，教师与学生之间有效的社会交往活动对教学能够产生重要影响。有效的社交源于教师与学生之间的双向互动能够产生共鸣，其中尊重、真诚、理解、同情、倾听、分析等方面的社交元素不容忽视。只要教师能够将社交的相关元素合理地运用于师生之间的沟通活动，教师便开始具备了“读懂学生的能力”。大数据和人工智能时代是一个加剧社会变革的时代，教师与学生之间的“鸿沟”在所难免，消除“鸿沟”最好的办法就是通过师生的社交互动来促成理解。教师拥有读懂学生的能力，是大数据和人工智能时代教师适应学生个性化学习特征的基础。教师唯有读懂了学生，才能培养真正的教学精神，才能做到在教学活动中“教自己学习中的感受，教自己的学问，引导学生学会学习”\[10\]。


    ### 第四，信息素养、数据素养、智能素养的培养能力


    在大数据和人工智能时代，信息素养、数据素养、智能素养是教师应该具备的基本素养，这三个基本素养能否养成，对教师的思维能力、教育技术能力、读懂学生的能力有着重要的影响。概括而言，这三个基本素养的养成，需要教师能够时刻保持对数据、信息、智能等方面的基础知识和实操条件的敏感度，以便确保教师有对教学活动过程中的价值信息进行收集、存储、提纯、分析、决策、批判等方面的实践能力，最终帮助教师在“茫茫数据海洋中”高效而准确地筛选有价值的教育资源。因此，大数据和人工智能时代的教师，势必要能够具备信息素养、数据素养、智能素养的培养能力。就这三个基本素养而言，教师一方面要形成对其的正确认识，要熟知这三个基本素养对于自身教育教学的功效，积极学习与这些素养相关的课程（课程的内容包括几个素养的基本定义、相关的科学常识、实操技能，以及正确的思想和观念等）；另一方面也要有对其进行培养的责任感，作为教学活动的主导者，要求学生应该具备的素养，教师应该首先养成，这样才能更好地促成学生相关素养的快速养成。


    # 三、学校：智能化的管理成为常态


    随着大数据和人工智能时代的到来，作为教育教学重要场所的学校受此影响颇深，这种影响不仅涉及学生的学习与教师的教学，还涉及学校方方面面的工作，如学校的教师管理、学生综合管理、家长管理、学校安全管理、教育监测与质量反馈管理、宿舍管理、图书馆管理、环境卫生管理等。大数据和人工智能技术在学校管理方面具有强大的优势，学校的智能化、智慧化已是大势所趋。


    依托大数据和人工智能技术实现学校各项工作数据化、智能化、智慧化的过程，就是“智慧校园”形成的过程，也是学校智能化管理常态化的过程。智慧校园指的是以物联网、大数据、人工智能为基础的智慧化的校园工作、学习和生活一体化环境，这个一体化环境以各种应用服务系统为载体，将教学、科研、管理和校园生活进行充分融合\[11\]。2018
    年 6 月，国家市场监督管理总局中国国家标准化管理委员会发布了最新的《智慧校园总体框架》标准文件，对智慧校园的总体建设框架、教学环境、教学管理、教学资源及信息安全等方面进行了战略部署，为我国高校校园的智慧化描绘了发展蓝图。随后，各大高校开始着手布局和完善学校的智慧化建设工作。南京大学的智慧图书馆建设便是其中一例。


    2019 年 4 月 27 日，由南京大学主办的“图书馆智慧管理与服务创新论坛”如期召开。会议当天，1700 多位图书馆管理专家就大数据和人工智能时代图书馆的管理理念、技术、方法进行了实践与应用的积极探讨。会议中，由南京大学自主研发的“新一代纸电一体智能图书馆管理系统”正式发布。此智能图书馆管理系统是集服务、资源、技术于一体的智慧系统，在中文版的书籍条形码研究方面处于国内领先地位。智能识别条形码的嵌入为图书馆的管理与运行提供了智慧化的新途径。如今，南京大学的图书馆已经实现书籍的购买、借入、借出、在馆数量、检索、使用分析等功能的集中化管理，为图书馆服务数据的可视化、图表化、简单化提供了便捷而精准的数据支撑。


    南京大学图书馆的智能化转型作为其学校智能化建设的一个缩影，反映了大数据和人工智能技术入驻学校管理、造福教师、服务学生的能力与水平。在大数据和人工智能时代，不仅学校的图书馆需要智能化，对教师的管理、对学生的管理、对学生家长信息的管理等都需要智能化。如今，全国各地大部分高校已经启用学生校园卡服务系统，对学生出入学校、宿舍、校园超市、图书馆、学校饭堂、教学楼，开学登记注册，到课情况等进行了行为记录，实现了对学生的“一张卡”管理，再结合校园安全监控系统，可以准确记录学生的行为轨迹，或者说是校园卡的行为轨迹。对于这方面的应用，学校可以依托该系统帮助学生找回被盗的校园卡，同时还可以对陌生人入校进行有效管理。


    过去，成百上千人的数据录入需要学校管理工作者几日方能完成；如今则不同，在教学活动中居于中心地位的学生，作为教学活动的积极参与者，主动完成个人需要反馈的个性化数据，这将为教育管理者带来极大的便利。以华中师范大学为例，该校作为教育部首批教育信息化试点高校，充分利用大数据、物联网、移动互联网、云计算、人脸自动识别系统等新媒体、新技术，逐步构建了“课程学习预警”“学生晚归未归预警”“学生思想素质动态分析”“经济困难学生精准资助”“学生多维画像”等教育大数据模型，有效提升了教育管理工作的针对性、时效性与实效性。


    除此之外，大数据和人工智能技术对于学校的安全管理工作也有重要价值。由于学校是一个人员流动性非常强的场所，要想保证师生的安全出行，传统的摄像技术、人脸识别技术、数据存储技术等都不能很好地满足
    24 小时无死角安全监测的要求。所以，安全问题一直以来都是各个学校和各地政府持续关注的问题。2019 年 2 月，长春市教育局印发《长春市教育局 2019
    年学校安全工作要点》的通知，要求全市在 2019 年要进一步推动平安校园建设，在安全投入、标准建设、管理制度等方面实现“科学化、规范化、精细化”。只有充分运用大数据和人工智能技术才能更好地推动这个目标的实现。


    学校的安全系统一般包括智能烟感系统、智能用电系统、视频监控系统、校园门禁系统、危险流动人员识别系统、教师学生家长安全联动系统、数据安全防火墙等。各大系统在安全监管方面的职能不同，但都统一服务于学校的安全管理工作。各大系统以大数据和人工智能为依托，可以对此刻正在发生的危险源进行精准预测、定位和预警，从而给予安全管理者以极大的便利，并在很大程度上提高了学校安全管理工作的效率和质量。就学校欺凌事件而言，通过全方位的无死角视频监控，当学校内的相关场地（教室、运动场、走廊等）发生打架斗殴事件时，大数据和人工智能技术就能根据异常数据进行跟踪与反馈，便于学校安全管理人员及时赶到处理，或者直接利用学校广播进行通报和干预。相较于传统的学校环境，智能化的校园环境对于阻止校园欺凌事件的发生具有重要作用。


    学校的智慧化管理，不仅有利于创新教师的教学工作，有利于为学生个性化学习提供渠道和资源，有利于图书馆的管理和校园的安全管理等，它还能从物理领域回归到对学生心理状态精准把控的精神领域上来。学生作为学校教育最为核心的元素之一，学校智能化管理常态化最终受益的还是学生群体。如果学校智能化管理常态化，我们可以利用学校的大数据和人工智能技术网络服务于学生的心理健康。从管理到服务，再到学生心理健康指导，学校具体该如何运用大数据和人工智能技术网络干预学生的心理危机呢。


    ## 心理危机预警


    可以利用大数据和人工智能技术提升学生心理危机预警能力。现代危机管理理论认为，将危机问题妥善解决固然是可喜的，不过将危机消灭于萌芽状态才是最成功的危机管理\[12\]。同理，如何能将学生心理危机的问题扼杀在萌芽状态，是心理危机预警的重点。充分利用大数据和人工智能技术可以更好地解决这些问题。


    第一，用大数据和人工智能技术对高危个体实时心理监控和自动预警。大数据和人工智能技术可以实时追踪和反馈学生的心理状态。大数据和人工智能技术能够收集和处理大量的实时数据，并利用学生的各类日常数据痕迹，提取有效数据信息来建立心理危机预警模型，从而实现对高危个体的实时心理监控和自动预警，弥补临床诊断量表评估的不足。根据模型，心理干预者可以明白干预对象的心理危机源头，预测其未来行为，判断危机事件的发生，从而有利于“对症下药”。


