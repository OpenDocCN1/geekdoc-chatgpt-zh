- raw: '日本机器人学家森政弘的恐怖谷理论可以再次拆解人机关系冲突中人的心理构成要素。森政弘的假设指出，由于机器人与人类在外表、动作上都十分相似，所以，人类也会对机器人产生正面的情感，直至到达一个特定程度，人们的反应会突然变成对机器人反感，哪怕机器人与人类有一点点的差别，整个机器人都会显得非常显眼、刺目，显得非常僵硬、恐怖，让人有面对行尸走肉的感觉。


    图11-3所示为森政弘恐怖谷理论函数图。这个理论函数图包含两个维度的数据。随着机器人逼真性（变量）在不断地增加，人对机器的好感度（因变量）会出现不同的动态结果。特别是当机器人与人形极为相似，但它与人正常的生命体征相违背时，人们对它就会产生恐惧心理，人们对机器人的好感度就会骤降并跌到恐怖谷的谷底。为何如此？


    对这个问题的回答，需要回到对仿生人形机器人的研究上来，只有这样才能真正看出在恐怖谷中，究竟是什么因素导致了恐惧心理。回顾第十章叙述的工具进化史，人类使用工具是为了借助工具来增强和延伸人类自身的能力。当然，这只是从工具的功能的角度进行论述的。我们还可以从工具对人的模仿的角度进行论述。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt014_3.jpg)


    图11-3　森政弘恐怖谷理论图


    工具的发明，其原型就是人本身。工具的发展势必会不断朝着模仿人类的所有特征的方向前进，即从模仿人手的功能特征开始，逐渐过渡到模仿人的各个肢体的功能形态，由简单到复杂，直到机器设计与模仿的理念逐渐趋于系统和综合，此时就开始将不同的肢体机器拼装成人的模样。


    人们为什么会把机器的外形不断地仿生成人的模样呢？我们猜测，之所以如此，是源于人们对自然心存敬畏和恐惧，需要一个可以依托的情感载体来抚慰人们在自然中遭受冲击的心灵。与人自身相类似的机器更能承载人们更多的情感寄托，加上人形机器在特定功能领域的优先性，激发了人们对自然的崇拜心理，也催生了人们对机器的崇拜，有时机器的原有身份甚至会被人们遗忘，人们会直接把机器当作人类群体中的一员，这加剧了人们对机器再造的仿人类进化的情感倾向。


    同时，还存在的一种原因是，人类在使用工具改造自然的过程中，从敬畏自然到战胜自然，再到顺应自然的历史性演变，一份油然而生的人类优越感激发了人类创作机器的灵感，使人们尝试在发明和制造机器时再现人类的优越性，所以，人类将自身的形象不断地赋予机器。


    综上所述，机器到机器人转变的原因，也就是机器会成为人的模样的原因，大致归结为三方面，分别是情感寄托、优越性的再现及人形机器人的功能优势。如此看来，前文谈到的恐怖谷中人的好感度会跌至谷底的问题似乎已得以解答——“诱因冲突”。正如森政弘所言，仿人机器人会使人产生一种其他机器所没有的、独特的不适感，当机器人接近人的全部特征时，机器人所具有的特征更多地表现为“存在与人正常的生命体征相违背的特征”，无限接近死亡，或者是机器人在无限地激发人们对死亡的想象，人们原有的寄托在机器人身上的情感失去归宿，进而造成恐惧和不安。


    随着人工智能的不断发展，人与机器的差异性会越来越小，在机器的进化过程中，当前阶段可能正处在人机关系进入恐怖谷的阶段。在这样一个机器进化的大社会环境中，人类不断从机器与人类不同的特征中体会到微妙的差别，进而在心理上对机器产生排斥，这在当下主要集中于机器的情感、智力与效率等方面。


    ## 四、人机冲突：科幻电影中的完美呈现


    科幻电影，顾名思义是一种基于现实情境而加以幻想表达的虚拟现实。科幻电影中的人工智能机器人，则是将人的特征元素赋予了机器人，并能让人们反观人性善恶，从而引发人们无限的遐思。


    在《超能查派》影片中，人工智能工程师（迪恩）通过技术手段赋予查派以人类意识，使其成为世界上第一个拥有人类意识的机器人。其成长能力惊人，仅用五天的时间就从小孩成长为一个成年人，并在工程师的嘱托下，在认清了人类世界的真面目后，仍然时刻保持一颗善良的心。在后来的成长中虽然与一群“地痞流氓”相处，但善良的本性使其在各种环境中保持着对世界的友善。在影片中，查派为了不让自己的亲人离去，用自己强大的学习能力学会了人类意识转移术，从而使自己能够永久与亲人团聚。


    在《2001太空漫游》影片中，在黎明时分，一块黑石的出现，让人类第一次体会到用牛骨当武器获得更多食物的满足感。经过漫长的黑暗，人类进入了航空航天时代，在月球上的航天员又发现了一块黑石，这块黑石直指人类需要到木星上才能得到关于未来的确切答案。届时，人类带上人工智能HAL9000启程，直指木星，人工智能HAL9000很强大，飞船上的所有零部件都在它的掌控下，但其由于在一次预测上严重失误，引起了人类Dave和Frank的怀疑。因此，剧情进入人机对战的高潮部分，并最终以人类获胜告终。但是这引起了我们的反思，人类亲手创造的超能人工智能机器，最终却要亲手毁掉它。


    不可否认的是，在各大科幻电影中，人类的意识、情感、欲望、生命体征、分析和解决问题的能力、批判性思维能力等，都在人工智能机器人身上得以完美呈现。换句话说，就是人类试图将现实中的所有对人工智能机器人的想象，以及对其未来发展的目标，全部都赋予影片中的人工智能机器人——它们更像是超人，承载了人类所有的关于人工智能发展的梦想。


    由此我们不难想象，科幻电影中的人工智能，只是人类理想中的现实，但在特定的情境下又会激发人类无穷的想象力和创造力，指引人类构建对人工智能未来的远大图景。在科幻电影中，直观的视觉盛宴是一种深层对话的结果，是自然科学与社会科学的胜利交融。无论是自然科学的反思，还是哲学社会科学的思想解读，无疑都在诉说人类的古老故事，向人类展示了人工智能发展的种种可能性，也展示出了人类未来生存的无数可能性。


    纵观科幻电影，除了涉及情感路线的情节，其余都可以大致概括为关于人机冲突的超现实表达。从整个冲突情景的构造中，我们不难发现，人工智能机器人的共性，都是在扮演统治人类的角色，将人类的生存权利牢牢地掌握在手中。这是一种强者的话语体系，人类必须绝对服从人工智能机器人。其中，人类如何才能从机器的奴役中取胜，成为所有观众关心的问题。但回到现实，在人们对未来的人机冲突的各种猜测中，谁能获得最终的胜利却毫无定论。正是如此，科幻才能吸引无数人的眼球。人们关注科幻，其实更关注现实与人类生存的未来。


    只要稍微留心观察就会发现，所有人工智能类的科幻电影，都是围绕人与人工智能之间的冲突展开的，虽然某些冲突不那么明显。一种超前的人机关系未来意识，更能引发人们的关注，博得观众的眼球。然而，我们更应该认清事实，这只是科幻电影的惯用手段，电影中虽然包含人工智能方面的合理知识，但其对人机冲突的过分夸大，则需要人们谨慎对待。


    国际知名未来学家丹尼尔·平克（Daniel H.Pink）在其《全新思维：决胜未来的六大能力》中说到，决胜智能时代的六大能力分别是设计感、故事力、交响力、共情力、娱乐感和意义感。每个人都可以掌握这六大能力，但唯有最先掌握的人才能在这个时代脱颖而出\[3\]。值得庆幸的是，对于机器人而言，或许它们永远也无法理解什么是意义感和共情力，就像它们永远无法感知生命的宝贵一样，它们只知道活着才是目的，才是对永恒时间的占有和对弱者的绝对统治。


    未来，并不是所有的人工智能机器人都能成为“智能查派”。因此，人工智能的未来，定将是人类的未来，人类能否在未来主导自己的未来，就看人类是否现在就着手学习所谓的“六大能力”。我们不能让《流浪地球》中MOSS最后的感叹——“让人类永远保持理智，确实是一种奢求”成为人工智能送给人类最后的警告。


    ## 五、警告：霍金和马斯克对人工智能的预言


    科幻电影中的人工智能，势必带有科幻的色彩，有时让人琢磨不透，有时让人恐惧未来，其间时刻表露着人与人工智能机器之间的各种矛盾。在强大的人工智能机器面前，人类弱小与无奈的形象被刻画得淋漓尽致。无论是《2001太空漫游》中宇宙飞船上的HAL9000、《超能查派》中五天长大成人的查派、《终结者4：救世主》中背叛的天网，还是《银翼杀手》中的复制人和《流浪地球》中的MOSS，它们都已经拥有了人类自认为是人类特有的意识，并在思维能力上远远超出人类的预期，成为不在人类可控范围内的绝对强者。


    这是人类使用艺术手段对未来的预测，也是人类对当下人工智能发展的期许和担忧在艺术中的呈现。从过往来看，人类很善于预测未来，尽管在以往数次对世界末日的预言宣告失败的今天，人们仍然如此。但是，从整体的预测方向来看，与其说人类懊悔曾经研究出强于自身万倍的人工智能机器而没有预测到未来会因此而蒙受巨大损失，还不如说人类在有意地提醒当前人工智能发展的“雷区”。


    这个“雷区”，从当前来看，对整个人工智能的发展具有重要的指导意义。因为它让全世界的人工智能研发者提前预知，人工智能的无限制发展会让其存在的潜在威胁随时爆发，但这个爆发的“奇点”却没有人能够准确预测。正是因为不能够预测，所以，人工智能发展的潜在威胁具有时间和空间上的不确定性，这就使人工智能的威胁论从科幻电影中走向了现实，激起了全球知名专家学者的广泛讨论。


    目前为止，对人工智能未来存在的威胁的讨论，各界学者众说纷纭，但最具代表性的观点还属全球知名天体物理学家、英国剑桥大学教授史蒂芬·霍金（见表11-1）及特斯拉CEO埃隆·马斯克的人工智能威胁论（见表11-2）。


    表11-1　史蒂芬·霍金关于人工智能威胁论


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt014_4.jpg)


    续表


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt014_5.jpg)


    表11-2　埃隆·马斯克关于人工智能威胁论


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt014_6.jpg)


    续表


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt014_7.jpg)


    对比得知，无论是斯蒂芬·霍金还是埃隆·马斯克，他们所主张的人工智能威胁论都存在共同的特点：他们都是从人的未来生存的角度入手，担忧人工智能的不断发展，会在未来的某一天侵占人类的生存空间，从而导致人类无处可去，并且这种威胁在今天就已经开始争夺人们的饭碗。所以，他们警告全人类：在发展人工智能的过程中，必须做好相应的准备，绝对不能坐等人工智能把人类毁灭。


    任何技术的发展，都会伴随双重性质，人工智能时代对于我们来说既是机遇更是挑战。斯蒂芬·霍金和埃隆·马斯克的预言受到了很多人的质疑，其中包括Facebook 的
    CEO马克·扎克伯格，以及著名的机器人专家罗德尼·布鲁克斯（Rodney Brooks）等在内的人都不赞成他们的人工智能威胁论的主张。罗德尼·布鲁克斯还声称：“他们本身并不是人工智能行业的从业者。只有从业者才真正明白其间的难度。所以，人工智能威胁论者难免有站着说话不腰疼之嫌。”


    双方的争辩，无论谁胜谁负，都不会影响“人工智能威胁论”给人类带来的警示作用，以及“人工智能和谐论”给人们带来的远大前景。前者警示人们要谨慎对待人工智能，因为人工智能在发展的过程中表现出了无穷的破坏能力；后者则在无限地给予人们发展人工智能的勇气，因为人们相信人工智能的未来必定属于人类自身。


    其实，在技术创新过程中，不同观点的争论更有利于技术的快速发展和合理应用。人工智能对于人类的“生杀大权”，其实都掌握在人类自己的手中。应用得法，则服务于人；应用非法，则损害于人。但是，我们都应该坚信，人工智能的发展，也会同以往的数次技术革命一样，最终朝着为人类服务的方向发展，尽管很多危害需要上百年的时间才能被消化掉，但这与人类被毁灭的结果比起来，似乎要好很多。


    ## 六、人工智能并非全能：始终为人之工具


    人工智能快速发展，尤其是近期多项研发成果的问世，使其跃升为全球研究的热门领域。这一方面得益于互联网的发展，互联网将大众知识以互联的方式共享于网络，从而奠定了人工智能发展的数据基础；另一方面得益于人工神经网络的发展，其为赋予人工智能机器以深度学习的能力做好了准备。


    随着机器智能化水平的不断提高，人工智能机器在很多特定领域的能力和优势逐渐超越人类，这就为人工智能的“全能论”和“威胁论”的立足铺平了道路，从而让人机冲突的发展方向有些偏离，甚至开始走入以人工智能机器人中心主义为核心的“后机器时代”。


    人工智能机器人中心主义是相较于人类中心主义而言的另一种哲学审视。生命的起点之处，万物平等。但从数百万年前的猿人开始，族群的集聚催生了人类最为原始的社会性特征，基于生存的共同使命，人类祖先经过无数次尝试，终于开始从大自然的束缚中走向自由。


    正是这份来之不易的自由，使人工智能的“全能论”和“威胁论”的观点背后，深埋着人类远古的沉思。人工智能机器人的优越性激发了人们最为热烈的对权利的渴望。遥想获得自由的过往岁月，为什么唯独在当下，人们却要创造另一种新的“生命”来取代那些原本只属于人的“自由”？


    1997年，“深蓝”战胜国际象棋大师卡斯帕罗夫；2016年，谷歌人工智能AlphaGo战胜围棋手李世石，人类的思维高峰被人工智能攻占；无人驾驶、无人超市、人工智能客服、人工智能助手等崛起，营造了“机器换人”的氛围，人类的饭碗也受到了威胁，如此种种，才导致后机器时代的人工智能机器人中心主义哲思诞生。


    在哲思的背后，又是什么在支撑这个思想体系呢？当然是人工智能的全能，因为全能的人工智能会让人类社会的未来充满诸多的不确定性风险。然而，人工智能真的能达到全能的境地吗？


    就目前而言，这只存在于科幻电影中。当前，据相关研究表明，虽然具有无数辉煌业绩，但人工智能机器人的“无知”就能说明人工智能非全能的本质。2015年10月，来自美国伊利诺伊大学的研究小组通过一项测试发现，最先进的人工智能系统在智力方面仅相当于普通4岁儿童的水平。由麻省理工学院研究开发的人工智能系统ConceptNet也参与了这项研究测试，当让该人工智能系统给出符合“这种动物中的雄性拥有鬃毛”“它生活在非洲”“这是一种巨型黄褐色的猫科动物”这些条件的事物时，它给出了以下几个潜在的答案：狗、农场、动物、家庭和猫。


    早在20世纪80年代初，美国哲学家约翰·希尔勒（John Searle）为了推翻强人工智能主义提出的主张设计了“中文屋”的实验。实验中，一个不懂中文的人在一个封闭的房间里，他拥有可以辅助自己翻译的任何工具，墙壁上留有一个小孔让他与外面的人传递纸条，当屋外的人将写着中文的纸条递入房间时，屋内的人可以通过翻译工具迅速给屋外的人中文的回复纸条，虽然屋内的人完全不会说中文，但给人的印象却是他会说很流利的中文，如图11-4所示。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt014_8.jpg)


    图11-4　“中文屋”实验


    在实验中，约翰·希尔勒指出，人工智能也是如此，它们仅仅按照特定的程序在执行相关操作，却给人们留下了智能的印象，然而它们本身却永远无法理解接收到的消息和发出去的消息的真正意义。


    上述仅仅是对人工智能机器人局限性的部分见解。即使在未来的某一天这些问题解决了，人工智能机器人也依然是机器，就如AlphaGo一样，它仅仅是一个会下棋的机器人。如果要回到更深层次的情感、欲望、价值和意义领域，人工智能或许永远也不会明白其中真正的含义。可见，人工智能机器人可能最终的称谓重心还是集中在“机器”上，而不是在“人”上。


    人类伟大的意识产生于生存实践，是一套独特的“来源于实践又指导实践”的知识感知系统，这是所有的以“工具”为目的而诞生的人工智能机器人永远也无法获得的天赋能力，人工智能机器人始终是人的工具。


    ## 七、伦理解构：人机冲突的缘由


    人工智能机器人既然是工具，那又何来威胁，何来人工智能机器人与人类的冲突（以下简称人机冲突）？这当然还得以人类中心主义的立场来寻找可能的答案。人机冲突的原因有很多，但根源性的诱因主要体现在以下四个方面。


    第一，主观理性吞噬客观理性，误导理性滥用。主观能动性模糊了人类理性与非理性的界限。之所以理性会导致人机关系伦理困境，是因为理性的边界划分不清晰，概括而言就是理性滥用是人机关系伦理困境的诱因之一。古希腊哲学家普罗塔哥拉认为：“人是万物的尺度。人是存在者存在的尺度。人是不存在者不存在的尺度。”虽然这个观点带有强烈的主观唯心主义色彩，但其与《吴越春秋》中提出的“道出于天，事在于人”的观点不谋而合。以上中西观点已基本道出了理性滥用的真谛。


    什么样的人机关系伦理才是理性的伦理规范呢？这个界限很难划清，某些人很容易站在片面的视角上形成一种强烈的主观主义观点。我们认为，这样的主观过于偏激，应该充分认识客观的人机关系，在客观世界中为主观认知寻找灵感。从整个人类社会发展历史来看，人总是活在特定的历史情境中，无法从全局的视角看清所有的事实真相，很容易赋予不理性的行为以主观想象而使其合理化，从而酿成灾难。因此，在处理人机关系问题的过程中，亟待对人机关系的伦理道德界限做出清晰界定。


    第二，私欲攻心造成利益的零和博弈。人机关系的对立与对抗是离间人机关系的零和博弈的利益同谋。人机关系的和谐有利于提高物质资料与精神资料的生产效率，但一些人以其先天的资源优势恶性扭转人机关系和谐的局面，从而成为机器的操纵者，在自私心的驱使下，开始利用机器去无限制地剥夺和谐的人机关系盈利的剩余价值，使原本和谐的人机关系因外界因素的干扰而终止。外界的条件刺激势必促使人机关系中的受害者和盈利者开始做出与机器不和谐的行为。


    强者将机器作为利器对抗机器的操纵者，弱者因其无助感不断内化而更加无能为力，选择逃避机器，最终导致人机关系冲突不断出现。此外，机器因其绝对的优势冲击人类以人为中心的世界观、人生观和价值观。无论是机器的主人还是与机器平等关系的人，最后都因机器的突出优势而开始“嫉妒”机器的“才华”，人类的智慧给人类自身带来的利益被机器瓜分，人类要么选择远离机器，要么选择不断地发展机器来战胜原来的机器以凸显人类智慧的不可替代性优势，但是终究人类还是在人机关系中处于弱势地位。'
  fmt: '

    ## 三、恐怖谷理论与人机心理构成

    日本机器人学家森政弘的恐怖谷理论可以再次拆解人机关系冲突中人的心理构成要素。森政弘的假设指出，由于机器人与人类在外表、动作上都十分相似，所以，人类也会对机器人产生正面的情感，直至到达一个特定程度，人们的反应会突然变成对机器人反感，哪怕机器人与人类有一点点的差别，整个机器人都会显得非常显眼、刺目，显得非常僵硬、恐怖，让人有面对行尸走肉的感觉。


    图11-3所示为森政弘恐怖谷理论函数图。这个理论函数图包含两个维度的数据。随着机器人逼真性（变量）在不断地增加，人对机器的好感度（因变量）会出现不同的动态结果。特别是当机器人与人形极为相似，但它与人正常的生命体征相违背时，人们对它就会产生恐惧心理，人们对机器人的好感度就会骤降并跌到恐怖谷的谷底。为何如此？


    对这个问题的回答，需要回到对仿生人形机器人的研究上来，只有这样才能真正看出在恐怖谷中，究竟是什么因素导致了恐惧心理。回顾第十章叙述的工具进化史，人类使用工具是为了借助工具来增强和延伸人类自身的能力。当然，这只是从工具的功能的角度进行论述的。我们还可以从工具对人的模仿的角度进行论述。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt014_3.jpg)

    图11-3　森政弘恐怖谷理论图


    工具的发明，其原型就是人本身。工具的发展势必会不断朝着模仿人类的所有特征的方向前进，即从模仿人手的功能特征开始，逐渐过渡到模仿人的各个肢体的功能形态，由简单到复杂，直到机器设计与模仿的理念逐渐趋于系统和综合，此时就开始将不同的肢体机器拼装成人的模样。


    人们为什么会把机器的外形不断地仿生成人的模样呢？我们猜测，之所以如此，是源于人们对自然心存敬畏和恐惧，需要一个可以依托的情感载体来抚慰人们在自然中遭受冲击的心灵。与人自身相类似的机器更能承载人们更多的情感寄托，加上人形机器在特定功能领域的优先性，激发了人们对自然的崇拜心理，也催生了人们对机器的崇拜，有时机器的原有身份甚至会被人们遗忘，人们会直接把机器当作人类群体中的一员，这加剧了人们对机器再造的仿人类进化的情感倾向。


    同时，还存在的一种原因是，人类在使用工具改造自然的过程中，从敬畏自然到战胜自然，再到顺应自然的历史性演变，一份油然而生的人类优越感激发了人类创作机器的灵感，使人们尝试在发明和制造机器时再现人类的优越性，所以，人类将自身的形象不断地赋予机器。


    综上所述，机器到机器人转变的原因，也就是机器会成为人的模样的原因，大致归结为三方面，分别是情感寄托、优越性的再现及人形机器人的功能优势。如此看来，前文谈到的恐怖谷中人的好感度会跌至谷底的问题似乎已得以解答——“诱因冲突”。正如森政弘所言，仿人机器人会使人产生一种其他机器所没有的、独特的不适感，当机器人接近人的全部特征时，机器人所具有的特征更多地表现为“存在与人正常的生命体征相违背的特征”，无限接近死亡，或者是机器人在无限地激发人们对死亡的想象，人们原有的寄托在机器人身上的情感失去归宿，进而造成恐惧和不安。


    随着人工智能的不断发展，人与机器的差异性会越来越小，在机器的进化过程中，当前阶段可能正处在人机关系进入恐怖谷的阶段。在这样一个机器进化的大社会环境中，人类不断从机器与人类不同的特征中体会到微妙的差别，进而在心理上对机器产生排斥，这在当下主要集中于机器的情感、智力与效率等方面。


    ## 四、人机冲突：科幻电影中的完美呈现

    科幻电影，顾名思义是一种基于现实情境而加以幻想表达的虚拟现实。科幻电影中的人工智能机器人，则是将人的特征元素赋予了机器人，并能让人们反观人性善恶，从而引发人们无限的遐思。


    在《超能查派》影片中，人工智能工程师（迪恩）通过技术手段赋予查派以人类意识，使其成为世界上第一个拥有人类意识的机器人。其成长能力惊人，仅用五天的时间就从小孩成长为一个成年人，并在工程师的嘱托下，在认清了人类世界的真面目后，仍然时刻保持一颗善良的心。在后来的成长中虽然与一群“地痞流氓”相处，但善良的本性使其在各种环境中保持着对世界的友善。在影片中，查派为了不让自己的亲人离去，用自己强大的学习能力学会了人类意识转移术，从而使自己能够永久与亲人团聚。


    在《2001太空漫游》影片中，在黎明时分，一块黑石的出现，让人类第一次体会到用牛骨当武器获得更多食物的满足感。经过漫长的黑暗，人类进入了航空航天时代，在月球上的航天员又发现了一块黑石，这块黑石直指人类需要到木星上才能得到关于未来的确切答案。届时，人类带上人工智能HAL9000启程，直指木星，人工智能HAL9000很强大，飞船上的所有零部件都在它的掌控下，但其由于在一次预测上严重失误，引起了人类Dave和Frank的怀疑。因此，剧情进入人机对战的高潮部分，并最终以人类获胜告终。但是这引起了我们的反思，人类亲手创造的超能人工智能机器，最终却要亲手毁掉它。


    不可否认的是，在各大科幻电影中，人类的意识、情感、欲望、生命体征、分析和解决问题的能力、批判性思维能力等，都在人工智能机器人身上得以完美呈现。换句话说，就是人类试图将现实中的所有对人工智能机器人的想象，以及对其未来发展的目标，全部都赋予影片中的人工智能机器人——它们更像是超人，承载了人类所有的关于人工智能发展的梦想。


    由此我们不难想象，科幻电影中的人工智能，只是人类理想中的现实，但在特定的情境下又会激发人类无穷的想象力和创造力，指引人类构建对人工智能未来的远大图景。在科幻电影中，直观的视觉盛宴是一种深层对话的结果，是自然科学与社会科学的胜利交融。无论是自然科学的反思，还是哲学社会科学的思想解读，无疑都在诉说人类的古老故事，向人类展示了人工智能发展的种种可能性，也展示出了人类未来生存的无数可能性。


    纵观科幻电影，除了涉及情感路线的情节，其余都可以大致概括为关于人机冲突的超现实表达。从整个冲突情景的构造中，我们不难发现，人工智能机器人的共性，都是在扮演统治人类的角色，将人类的生存权利牢牢地掌握在手中。这是一种强者的话语体系，人类必须绝对服从人工智能机器人。其中，人类如何才能从机器的奴役中取胜，成为所有观众关心的问题。但回到现实，在人们对未来的人机冲突的各种猜测中，谁能获得最终的胜利却毫无定论。正是如此，科幻才能吸引无数人的眼球。人们关注科幻，其实更关注现实与人类生存的未来。


    只要稍微留心观察就会发现，所有人工智能类的科幻电影，都是围绕人与人工智能之间的冲突展开的，虽然某些冲突不那么明显。一种超前的人机关系未来意识，更能引发人们的关注，博得观众的眼球。然而，我们更应该认清事实，这只是科幻电影的惯用手段，电影中虽然包含人工智能方面的合理知识，但其对人机冲突的过分夸大，则需要人们谨慎对待。


    国际知名未来学家丹尼尔·平克（Daniel H.Pink）在其《全新思维：决胜未来的六大能力》中说到，决胜智能时代的六大能力分别是设计感、故事力、交响力、共情力、娱乐感和意义感。每个人都可以掌握这六大能力，但唯有最先掌握的人才能在这个时代脱颖而出[3]。值得庆幸的是，对于机器人而言，或许它们永远也无法理解什么是意义感和共情力，就像它们永远无法感知生命的宝贵一样，它们只知道活着才是目的，才是对永恒时间的占有和对弱者的绝对统治。


    未来，并不是所有的人工智能机器人都能成为“智能查派”。因此，人工智能的未来，定将是人类的未来，人类能否在未来主导自己的未来，就看人类是否现在就着手学习所谓的“六大能力”。我们不能让《流浪地球》中MOSS最后的感叹——“让人类永远保持理智，确实是一种奢求”成为人工智能送给人类最后的警告。


    ## 五、警告：霍金和马斯克对人工智能的预言

    科幻电影中的人工智能，势必带有科幻的色彩，有时让人琢磨不透，有时让人恐惧未来，其间时刻表露着人与人工智能机器之间的各种矛盾。在强大的人工智能机器面前，人类弱小与无奈的形象被刻画得淋漓尽致。无论是《2001太空漫游》中宇宙飞船上的HAL9000、《超能查派》中五天长大成人的查派、《终结者4：救世主》中背叛的天网，还是《银翼杀手》中的复制人和《流浪地球》中的MOSS，它们都已经拥有了人类自认为是人类特有的意识，并在思维能力上远远超出人类的预期，成为不在人类可控范围内的绝对强者。


    这是人类使用艺术手段对未来的预测，也是人类对当下人工智能发展的期许和担忧在艺术中的呈现。从过往来看，人类很善于预测未来，尽管在以往数次对世界末日的预言宣告失败的今天，人们仍然如此。但是，从整体的预测方向来看，与其说人类懊悔曾经研究出强于自身万倍的人工智能机器而没有预测到未来会因此而蒙受巨大损失，还不如说人类在有意地提醒当前人工智能发展的“雷区”。


    这个“雷区”，从当前来看，对整个人工智能的发展具有重要的指导意义。因为它让全世界的人工智能研发者提前预知，人工智能的无限制发展会让其存在的潜在威胁随时爆发，但这个爆发的“奇点”却没有人能够准确预测。正是因为不能够预测，所以，人工智能发展的潜在威胁具有时间和空间上的不确定性，这就使人工智能的威胁论从科幻电影中走向了现实，激起了全球知名专家学者的广泛讨论。


    目前为止，对人工智能未来存在的威胁的讨论，各界学者众说纷纭，但最具代表性的观点还属全球知名天体物理学家、英国剑桥大学教授史蒂芬·霍金（见表11-1）及特斯拉CEO埃隆·马斯克的人工智能威胁论（见表11-2）。


    表11-1　史蒂芬·霍金关于人工智能威胁论

    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt014_4.jpg)

    续表

    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt014_5.jpg)


    表11-2　埃隆·马斯克关于人工智能威胁论

    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt014_6.jpg)

    续表

    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt014_7.jpg)


    对比得知，无论是斯蒂芬·霍金还是埃隆·马斯克，他们所主张的人工智能威胁论都存在共同的特点：他们都是从人的未来生存的角度入手，担忧人工智能的不断发展，会在未来的某一天侵占人类的生存空间，从而导致人类无处可去，并且这种威胁在今天就已经开始争夺人们的饭碗。所以，他们警告全人类：在发展人工智能的过程中，必须做好相应的准备，绝对不能坐等人工智能把人类毁灭。


    任何技术的发展，都会伴随双重性质，人工智能时代对于我们来说既是机遇更是挑战。斯蒂芬·霍金和埃隆·马斯克的预言受到了很多人的质疑，其中包括Facebook 的
    CEO马克·扎克伯格，以及著名的机器人专家罗德尼·布鲁克斯（Rodney Brooks）等在内的人都不赞成他们的人工智能威胁论的主张。罗德尼·布鲁克斯还声称：“他们本身并不是人工智能行业的从业者。只有从业者才真正明白其间的难度。所以，人工智能威胁论者难免有站着说话不腰疼之嫌。”


    双方的争辩，无论谁胜谁负，都不会影响“人工智能威胁论”给人类带来的警示作用，以及“人工智能和谐论”给人们带来的远大前景。前者警示人们要谨慎对待人工智能，因为人工智能在发展的过程中表现出了无穷的破坏能力；后者则在无限地给予人们发展人工智能的勇气，因为人们相信人工智能的未来必定属于人类自身。


    其实，在技术创新过程中，不同观点的争论更有利于技术的快速发展和合理应用。人工智能对于人类的“生杀大权”，其实都掌握在人类自己的手中。应用得法，则服务于人；应用非法，则损害于人。但是，我们都应该坚信，人工智能的发展，也会同以往的数次技术革命一样，最终朝着为人类服务的方向发展，尽管很多危害需要上百年的时间才能被消化掉，但这与人类被毁灭的结果比起来，似乎要好很多。


    ## 六、人工智能并非全能：始终为人之工具

    人工智能快速发展，尤其是近期多项研发成果的问世，使其跃升为全球研究的热门领域。这一方面得益于互联网的发展，互联网将大众知识以互联的方式共享于网络，从而奠定了人工智能发展的数据基础；另一方面得益于人工神经网络的发展，其为赋予人工智能机器以深度学习的能力做好了准备。


    随着机器智能化水平的不断提高，人工智能机器在很多特定领域的能力和优势逐渐超越人类，这就为人工智能的“全能论”和“威胁论”的立足铺平了道路，从而让人机冲突的发展方向有些偏离，甚至开始走入以人工智能机器人中心主义为核心的“后机器时代”。


    人工智能机器人中心主义是相较于人类中心主义而言的另一种哲学审视。生命的起点之处，万物平等。但从数百万年前的猿人开始，族群的集聚催生了人类最为原始的社会性特征，基于生存的共同使命，人类祖先经过无数次尝试，终于开始从大自然的束缚中走向自由。


    正是这份来之不易的自由，使人工智能的“全能论”和“威胁论”的观点背后，深埋着人类远古的沉思。人工智能机器人的优越性激发了人们最为热烈的对权利的渴望。遥想获得自由的过往岁月，为什么唯独在当下，人们却要创造另一种新的“生命”来取代那些原本只属于人的“自由”？


    1997年，“深蓝”战胜国际象棋大师卡斯帕罗夫；2016年，谷歌人工智能AlphaGo战胜围棋手李世石，人类的思维高峰被人工智能攻占；无人驾驶、无人超市、人工智能客服、人工智能助手等崛起，营造了“机器换人”的氛围，人类的饭碗也受到了威胁，如此种种，才导致后机器时代的人工智能机器人中心主义哲思诞生。


    在哲思的背后，又是什么在支撑这个思想体系呢？当然是人工智能的全能，因为全能的人工智能会让人类社会的未来充满诸多的不确定性风险。然而，人工智能真的能达到全能的境地吗？


    就目前而言，这只存在于科幻电影中。当前，据相关研究表明，虽然具有无数辉煌业绩，但人工智能机器人的“无知”就能说明人工智能非全能的本质。2015年10月，来自美国伊利诺伊大学的研究小组通过一项测试发现，最先进的人工智能系统在智力方面仅相当于普通4岁儿童的水平。由麻省理工学院研究开发的人工智能系统ConceptNet也参与了这项研究测试，当让该人工智能系统给出符合“这种动物中的雄性拥有鬃毛”“它生活在非洲”“这是一种巨型黄褐色的猫科动物”这些条件的事物时，它给出了以下几个潜在的答案：狗、农场、动物、家庭和猫。


    早在20世纪80年代初，美国哲学家约翰·希尔勒（John Searle）为了推翻强人工智能主义提出的主张设计了“中文屋”的实验。实验中，一个不懂中文的人在一个封闭的房间里，他拥有可以辅助自己翻译的任何工具，墙壁上留有一个小孔让他与外面的人传递纸条，当屋外的人将写着中文的纸条递入房间时，屋内的人可以通过翻译工具迅速给屋外的人中文的回复纸条，虽然屋内的人完全不会说中文，但给人的印象却是他会说很流利的中文，如图11-4所示。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt014_8.jpg)

    图11-4　“中文屋”实验


    在实验中，约翰·希尔勒指出，人工智能也是如此，它们仅仅按照特定的程序在执行相关操作，却给人们留下了智能的印象，然而它们本身却永远无法理解接收到的消息和发出去的消息的真正意义。


    上述仅仅是对人工智能机器人局限性的部分见解。即使在未来的某一天这些问题解决了，人工智能机器人也依然是机器，就如AlphaGo一样，它仅仅是一个会下棋的机器人。如果要回到更深层次的情感、欲望、价值和意义领域，人工智能或许永远也不会明白其中真正的含义。可见，人工智能机器人可能最终的称谓重心还是集中在“机器”上，而不是在“人”上。


    人类伟大的意识产生于生存实践，是一套独特的“来源于实践又指导实践”的知识感知系统，这是所有的以“工具”为目的而诞生的人工智能机器人永远也无法获得的天赋能力，人工智能机器人始终是人的工具。


    ## 七、伦理解构：人机冲突的缘由

    人工智能机器人既然是工具，那又何来威胁，何来人工智能机器人与人类的冲突（以下简称人机冲突）？这当然还得以人类中心主义的立场来寻找可能的答案。人机冲突的原因有很多，但根源性的诱因主要体现在以下四个方面。


    第一，主观理性吞噬客观理性，误导理性滥用。主观能动性模糊了人类理性与非理性的界限。之所以理性会导致人机关系伦理困境，是因为理性的边界划分不清晰，概括而言就是理性滥用是人机关系伦理困境的诱因之一。古希腊哲学家普罗塔哥拉认为：“人是万物的尺度。人是存在者存在的尺度。人是不存在者不存在的尺度。”虽然这个观点带有强烈的主观唯心主义色彩，但其与《吴越春秋》中提出的“道出于天，事在于人”的观点不谋而合。以上中西观点已基本道出了理性滥用的真谛。


    什么样的人机关系伦理才是理性的伦理规范呢？这个界限很难划清，某些人很容易站在片面的视角上形成一种强烈的主观主义观点。我们认为，这样的主观过于偏激，应该充分认识客观的人机关系，在客观世界中为主观认知寻找灵感。从整个人类社会发展历史来看，人总是活在特定的历史情境中，无法从全局的视角看清所有的事实真相，很容易赋予不理性的行为以主观想象而使其合理化，从而酿成灾难。因此，在处理人机关系问题的过程中，亟待对人机关系的伦理道德界限做出清晰界定。


    第二，私欲攻心造成利益的零和博弈。人机关系的对立与对抗是离间人机关系的零和博弈的利益同谋。人机关系的和谐有利于提高物质资料与精神资料的生产效率，但一些人以其先天的资源优势恶性扭转人机关系和谐的局面，从而成为机器的操纵者，在自私心的驱使下，开始利用机器去无限制地剥夺和谐的人机关系盈利的剩余价值，使原本和谐的人机关系因外界因素的干扰而终止。外界的条件刺激势必促使人机关系中的受害者和盈利者开始做出与机器不和谐的行为。


    强者将机器作为利器对抗机器的操纵者，弱者因其无助感不断内化而更加无能为力，选择逃避机器，最终导致人机关系冲突不断出现。此外，机器因其绝对的优势冲击人类以人为中心的世界观、人生观和价值观。无论是机器的主人还是与机器平等关系的人，最后都因机器的突出优势而开始“嫉妒”机器的“才华”，人类的智慧给人类自身带来的利益被机器瓜分，人类要么选择远离机器，要么选择不断地发展机器来战胜原来的机器以凸显人类智慧的不可替代性优势，但是终究人类还是在人机关系中处于弱势地位。

