    # 第七章　社交：人们为什么喜欢匿名


    人工智能社交：人们为什么喜欢匿名


    社交的变革：人工智能对人际交往的冲击


    未来的“大社交”：人类社交的人工智能化


    随着人工智能存储技术（边缘存储）、数据传输技术（5G）、人工智能可视化技术（图像识别）等的发展，人们正在走进人工智能化的“大社交”时代，人们的交往范围、交往时间、彼此的信任感、待人方式、交往行为、自我认知等，正经历“数千年未有之大变局”。单就“网红”经济和社交电商而言，传统领域与新兴领域的竞争，是基于一种社交关系网络的竞争，谁更能从社交的领域切入顾客的生活空间，谁就更有机会赢得顾客的支持。


    ## 一、人工智能社交：人们为什么喜欢匿名


    社会交往，简称社交，是人与人之间互动往来的一种方式。通过运用社交手段，人们得以互换信息和观点，促进了相互之间的沟通和交流，从而避免了一些不必要的人际冲突。这就意味着，社交对于人类的生存而言，具有重要的意义。古希腊著名学者亚里士多德就曾在他的《政治学》著作中写道：“从本质上讲，人是一种社会性动物；那些生来离群索居的个体，要么不值得我们关注，要么不是人类。”


    随着时代的发展，社交的渠道和方式也在不断演变，从古代的烽火狼烟、飞鸽传书、快马传书，到近现代的邮政、座机电话，再到现在的手机、电子邮件、QQ、微博、微信及网络游戏等，社交的变化越来越快。无论是在时间上还是在空间上，其都已突破了很多先天的社交局限性。这一切都得益于社会生产力水平的提高和科学技术的快速发展，特别是基于互联网技术的现代通信工具的发展，为人与人之间的交流互动提供了便捷、高效的平台，大大降低了人际互动的成本，提高了人际交往的效率和质量。最终，一种全新的大综合、大系统、大社会的社交方式——人工智能社交，逐渐使人们的社交方式深度融合。


    人工智能社交是指基于新型人际关系网络，将社交网站、社交媒介和网络媒介等社交工具与人工智能技术相结合，通过社交互动，传达沟通内容，以期更好地达到社交目的的一种社会交往方式，是现实社交在网络世界的延伸，并能增强现实社交体验的未来社交模式。人工智能社交可分为人工智能机器人与人的社交和将人工智能技术运用于人与人之间的社交两大类。相较于传统的社交，人工智能社交具有透明化、舒适化、高效化、可视化、可分析化等特征。


    随着人工智能技术的不断发展，将人工智能技术运用于社交领域也逐渐被越来越多的人接受，如智能手机社交软件（QQ、微信、陌陌、豆瓣、贴吧、百合等）、人工智能社交机器人（淘宝人工智能客服、医用人工智能机器人客服、家庭机器人）等，特别是智能手机社交软件，深得人们的喜爱。随着生活智能化程度的提高，人工智能社交机器人也渐渐渗透到人们生活的不同领域。


    社交是人类生存最基本的诉求，人工智能社交的发展及其特征，正好反映了人们对最基本的诉求的强烈欲望，因为当人们有社交需求时，就想马上得到满足，否则就容易陷入焦虑之中。正是人工智能社交的出现，使人们这种社交需求的急切性能够快速得到满足。因此，人工智能社交才得以快速发展。今天，如果再让一个人在生活中只使用一个“功能型手机”，相信他很快就会与世界失去联系，这不是说他与社会“失联”了，而是说很快他就与社会“脱节”了。


    正是因为这种“脱节”的可能性的存在，越来越多的人开始主动或被动运用人工智能社交技术。随着越来越多的人涌入，人工智能社交技术不断发展完善。任何事物的发展总要经历一个逐步完善的过程。当便捷的人工智能社交工具的实用功能还没有完全发挥出来时，一些被利益驱使的人工智能社交受益者，开始企图从便捷的社交中谋求一己之利，从而损害了部分人的利益。这才引发了“人工智能社交，人们为什么喜欢匿名”的讨论。


    人工智能有三大定律，第一定律为阿什比定律（Ashby''s law），其指出，任何有效的控制系统都必须与它所控制的系统一样复杂。第二定律由 John Von
    Neumann 阐述，他指出：“复杂系统的定义是它构成自己最简单的行为描述。有机体最简单的完整模型就是有机体本身。试图将系统的行为简化为任何其他形式的描述都会使事情变得更复杂，而不是更简单。”第三条定律由
    John Brockman 阐述，他指出：“任何简单到可以理解的系统都不会复杂到足以智能地运行，而任何复杂到可以智能地运行的系统，都将复杂到难以理解。”


    从这三大定律可以看出，人工智能本身是复杂的系统。同样，人类的社交也具有极端复杂性，其间掺杂着各种利益纠葛。要想将现实的社交与人工智能相结合，也就必然要使人工智能技术参与到这种“纠葛”中来。正如人工智能第一定律所述，与人工智能社交相关的系统和应用软件，如果要想更大程度地满足人们的社交需求，就要充分地完善其“复杂性”。但是，越复杂的社交系统，其缺点和漏洞就越多，其安全防范的工作就越难，其中道理有些似“言多必失”。这种缺陷存在的可能性并不是影响人们在人工智能社交中匿名的直接诱因，而是这种缺陷确实使人工智能社交中的一些人成为受害者，这便激发了人们的防备心理。


    在人工智能时代，通过特定的技术手段，个人的社交数据很容易就能汇集起来，从而完整地刻画一个数字公民的真实形象。正因为如此，电商的精准广告投放才得以实现。电商通过用户的购买习惯、近期浏览的商品、加入购物车的商品、特定电脑
    IP 地址的网页商品搜索等数据，结合大数据、人工智能分析预测技术，通过特定的信息传播渠道向客户精准投放广告，辅以优惠券和折扣等，基本能够成功吸引顾客进行购买。


    有一则在美国广为流传的营销故事：一位带有怒气的父亲跑到沃尔玛卖场质问这里的员工，为何将婴儿用品的优惠券广告邮件发给了他的女儿，但是经过一番证实，他的女儿确实怀孕了。这名女孩之前搜索的相关商品关键词，以及在相关的社交网站所显露的行为轨迹，使沃尔玛捕捉到了其怀孕的信息，所以才发生了这则看似“闹剧”的精准营销。在大数据和人工智能时代就是这样，商家可以比父亲更了解自己的女儿。


    是的，这就是在人工智能时代的社交，或许没有人比你更了解自己，但你的个人的所有网上信息，在人工智能面前，也可以算得上是公开透明的，只要稍加整合分析，你近期的活动状况，甚至包括你与哪些人进行聊天等就都可被发现。由于社交数据的透明化很容易暴露个人的隐私，所以，很多人开始寻求一种“遮蔽”的状态，希望能够留一片属于自己的生活空间。


    人工智能时代的极端便捷性为别有用心者开启了方便之门，社交隐私数据被利用，人们的警惕心理不得不将自己逼向匿名的境地。因此，很多社交软件的用户，都充分使用了权限设置功能，如对微信朋友圈、QQ
    空间进行访问权限设置等。


    在人工智能时代，利用授权的方式使自己处于“遮蔽”的状态或许不是自我保护隐私的最好方法，可能还需要相应的数据管理者充分考虑用户的隐私，并改进用户隐私保护的技术手段，做好对人工智能社交平台的用户数据的保护工作。相较于前者而言，这将更有利于用户。


    上述是人与人之间的人工智能社交的匿名情况，抛除被利用的层面，有的人利用娴熟的人工智能技术去侵犯他人的数据权利，这也是被人们所厌恶的，如果这部分人能够符合社会价值评判的标准，那么人们的匿名情况或许要少得多。此外，不排除还有一部分人，他们故意隐藏身份，在人工智能社交平台发布扰乱舆论环境的信息，或者故意挑起人工智能社交争端，这更是不值得原谅的。但是，值得庆幸的是，这样一种乱象正在被人工智能技术的发展所限制，其强大的深度学习能力，在某种程度上使匿名变成了公开的“秘密”，因为利用人工智能技术对这些社交对象进行追踪，似乎变得越来越简单。


    在匿名的背后，还有一个值得关注的方面，就是人与人工智能的社交，在这种社交中，人们该怎样辨别与自己互动的“它”是机器人还是人。20 世纪 50 年代，阿兰·麦席森·图灵设计了图灵测试，称能够通过该测试的人工智能具有人类智能。2014
    年，由俄罗斯人 Vladimir Veselov 开发的智能软件尤金·古斯特曼（Eugene Goostman）的测试结果显示，被测试者有 33%的答复与人类一致。


    在 2019 年的央视春晚中，人工智能主播“小小撒”在舞台上亮相。从直播中可以看出，不管是外形、声音、眼神，还是脸部动作、嘴唇动作，或者是主持活动，首次上岗的人工智能虚拟主播与真人撒贝宁都极为相似。据相关报道，他们之间的相似度高达
    99%\[1\]。


    由此看来，在今天的人工智能时代背景下，在特定的社交领域，人与人工智能之间的差异性正在不断缩小，所以，很难通过远程聊天识别聊天的对方是人工智能机器人还是现实中的人。当然，如果是视频聊天或现场面对面聊天，这个问题就迎刃而解了。这在提醒我们，在人工智能社交大环境下，对于虚拟的或远程的非面对面互动，我们需要特别提防，要有隐私数据安全保护意识，以防不法分子通过人工智能伪装技术，利用亲人的身份信息来向我们行敛财之道。


    综上所述，人工智能社交正在将人们置于接近透明的社交环境下，陌生人与陌生人之间的社交开始变得“亲切”，这看似是一种“熟人社会”的回归，实则是机遇与危机并存。因此，人们应该加强智能素养的培养，主动迎接挑战，而不是一味地寻求“遮蔽”的状态来消极避世，否则很容易陷入与社会“脱节”的困境。


    美国社会心理学家斯坦利·米尔格兰姆提出的六度分割（Six Degrees of Separation）理论（又名小世界理论，见图 7-1）认为，最多通过五个人就可以认识一个陌生人。将这个理论用于人工智能社交时代再合适不过，这正是人工智能社交扩展朋友圈的最好方式。无论“天南海北”，通过特定的圈子，你就可以进入另一个圈子，如此循环，人工智能社交关系网络就能很容易向全世界铺开。因此，对人工智能时代的社交，人们应该主动融入，成为人工智能社交达人，主动投身人工智能社交场的安全性建设工作，共同应对人工智能时代人际交往的冲击。


    ![img](img/txt009_1.jpg)


    图 7-1　六度分割理论示意


    ## 二、社交的变革：人工智能对人际交往的冲击


    回首过去，短短几年时间，我们经历的变革却是前所未有的。十年前，我们都在期盼“阿德的梦”早日成为现实，从而能为我们联系远在异乡的亲朋好友提供“千里眼”和“顺风耳”——可视电话。可视电话可以称为人工智能社交的雏形，它在拉近人与人之间距离的同时，还能给人们一种近在眼前的“现场感”，极大地拉近了人们的社交距离。然而，这个梦想却迟迟没有到来，从
    20 世纪五六十年代提出可视电话的概念开始，一直到 21 世纪初，由于受多方面技术因素的限制，它还只不过是书本中的一种称为梦想的东西。


    但是，就今天来说，这一切都变成了现实。人们只需要一部智能手机或一台计算机，便可“足不出户知千里”，便可实现与身在异域的亲朋好友的可视对话。不仅如此，人们还可以随时随地运用互联网媒介，进行实时社交——人工智能社交，就像彼此从未有过空间距离一般。


    正是这种极为便利的人工智能社交环境，加上交通运输业的快速发展，人与人之间的商品互换关系从“集镇”走向了“全球市场”，使得不同地域之间建立了友好的商贸往来关系，弥补了各自某方面的物资匮乏的缺陷。这种基于人工智能的社交打开的新世界的大门，使人与人之间的沟通联系与商贸往来的效率和质量大为提升，远远超出了前人的想象，可谓是前无古人。


    人工智能社交建立的商贸往来关系，最为突出的两个领域体现在网红经济和社交电商。根据《2018 年中国网红经济产业发展现状分析报告》显示\[2\]，我国网红经济发展呈现持续增长趋势，仅在
    2018 年，国内在线直播市场规模就达 676.6 亿元，相较于上一年增长了 49.3%。该报告还预测，在 2019 年和 2020 年，国内在线直播市场规模将分别达到
    893.8 亿元和 1120.9 亿元（见图 7-2）。可见，随着越来越多的人加入网红行列和不同的用户类型的持续增多，网红社交平台的经济效益将持续增大。


    ![img](img/txt009_2.jpg)


    图 7-2　2016—2020 年中国在线直播市场规模及预测


    在人工智能社交电商领域，其经济规模更是远超网红经济规模。根据艾瑞咨询的数据显示（见图 7-3），2018 年中国社交电子商务市场交易规模为 28.1 万亿元，同比增长
    17.4%，虽然总体的增幅有所放缓，但交易的规模还在不断增加。


    ![img](img/txt009_3.jpg)


    图 7-3　2012—2019 年中国社交电子商务市场交易规模及预测\[3\]


    由此可见，人工智能社交对于经济领域的冲击是巨大的，传统的商业领域如果不进行商业变革，改变传统的经营网络方式，就很容易被新型的人工智能社交关系网络所替代。换句话说，在人工智能时代，就网红经济和社交电商而言，传统领域与新兴领域的竞争是基于一种社交关系网络的竞争，谁更能从社交的领域切入顾客的生活空间，谁就更能赢得顾客的支持。


    在今天的社会大环境下，由于其巨大的经济潜力，人工智能社交已成为未来社交经济的发展大趋势，企业家们都在试图从中创新和丰富其社交手段。亿欧的副总裁由天宇就曾表示，特别资深的互联网从业者普遍认为，现在的微信已经处在绝对成熟期，希望可以在未来微信的衰退期抓住用户红利，决定产品命运的关键是网络社交发展的大趋势。这里的网络社交大趋势正是人工智能社交的大趋势，在大数据、人工智能时代，“人工智能+社交”的社交方式的变革，对人们的社交产生了重要影响。


    在未来的发展趋势中，人工智能社交产品能让我们的朋友圈重新建立连接，大家既可以拥有一款像微信一样的长连接的社交产品，也可以拥有基于场景应用需求的短连接的社交产品，这样能更有效地降低不同用户在不同应用场景中遭受的社交风险，从而可以在更大范围内解决人们在人工智能社交领域的匿名化倾向和隐私遭到侵犯的问题。


    人工智能社交对人类的冲击远不止于此，还会继续向其他领域延伸。自从阿里巴巴推出芝麻信用后，众多网友调侃：“将来丈母娘招女婿，不是看你有没有房子，而是看你的芝麻信用有多高。”这不禁激发更多的疑问，未来丈母娘招女婿真的会看芝麻信用吗？对于这个问题的答案，我们可能无从知晓，还需要留给时间去回答。但是，可以确定的一点是，人工智能社交的确对人们的网络婚恋社交产生了影响。


    2002 年，Facebook 和 Myspace 这两家大型社交软件还没有诞生之前，全球首款主打社交网络服务（SNS）的 Friendster 一经上线，就迅速受到用户的热烈追捧。这个现象的出现，激发了当时正在加州大学伯克利分校留学的郑毅（百合网、ObEN
    的联合创始人）的创业灵感。2005 年，百合网（国内大型婚恋网站）正式上线。百合网上线之后，郑毅一直在思考一个问题：为什么各大社交网站均有类似痛点——老用户登录一次后，发现没有人跟他联系，便失去了再次登录和使用产品的兴趣，从而导致用户的流失率很高。


    为了能够实现用户的实时互动，最终，百合网计划采取在平台塑造虚拟用户的方法来弥补这个缺陷。这个方法就是利用人工智能技术，将用户的数据（包括外貌、年龄、声音等）进行汇总分析，进而在平台上形成一个虚拟现实的人物图像，当别的用户登录平台时，无论该用户在不在线，与其相应的虚拟人物就会按照他的生活习性及对话特征与别的用户进行互动。


    为了将这一技术变成现实，2014 年，郑毅和 Nikhil 正式创立了 ObEN。在这个平台上，用郑毅的话来说，“拍一张自拍照，录几段声音，一个长相、声音都和你相似的虚拟形象就做出来了”。为了进一步保证用户社交的质量，这个平台还必须解决的一个问题就是用户的真实性问题，人们都希望在人工智能社交软件上与自己聊天的那个人能够代表现实中的个人。


    一种新的技术——区块链的引进可破解该难题。由于这一技术的运用，平台用户的身份确权得以唯一，从而使大家能够放心地跟人工智能的“他/她”互动。相较于过往的传统互联网社交网站而言，如今的社交平台都被赋予了人工智能化的特质，变得更加安全可靠和智能。所以，称当下是一个最好的时代也不为过。


    我们生活在一个社交最好的时代，因为人工智能社交为我们带来的便利是前所未有的，但也不得不说我们生活在一个社交最坏的时代。


    根据中新网 2018 年 9 月 29 日综合报道，继曝出 8700 万用户数据泄露丑闻后，Facebook 网站再次遭到黑客攻击，近 5000 万用户的数据发生泄露，这是一个令人汗颜的事实。在人工智能社交时代，人工智能技术的成熟有其荣光的一面，也存在其不利的一面，若是全人类能够达成共识，固然能够形成全球人工智能社交的新格局。但若存在“难以撇清的利益纠葛”，这期间的变数就非一家之努力所能把控，足以可见人工智能社交的“威力”！


    生活在这个时代的人，在短短数年时间，从“鸡犬之声相闻，老死不相往来”的古代社交，到“千里之外，足不出户识生客”的人工智能社交，正经历“数千年未有之大变局”。千百年来祖先的梦想正在被我们这一代人实现，我们也正在经历着他们从未遭受过的“忧思”。对“最好的时代”，我们应该积极投身社会；对“最坏的时代”，我们应该做好“打硬仗”的准备，积极探寻人工智能社交良策，稳健迈入人工智能化的人类社交新时代。


    ## 三、未来的“大社交”：人类社交的人工智能化


    如果你感觉前文所述的人工智能社交对于个人而言没有多大的吸引力，那么接下来的论述我们相信你定会沉迷其中，以至于不得不思考，应该如何在未来的人工智能化的人类社交的畅想中加入必要的技术限制，从而防止未来的人们因染上“人工智能社交瘾”而遭受不必要的人际损失。


    在上海举行的“2018 世界人工智能大会”上，腾讯董事会主席兼 CEO 马化腾与会发言称：“人工智能技术的发展，正在通往大社交的时代。”“目前连接人与人的极限就是几十亿个节点，但是，如果连接人与物，也就是把我们与常用设备实时有效地连接起来，那么我们的节点规模将会增长到几百亿的量级。”“人与物、人与服务的连接，关键就在于人工智能。可以说，整个人类的朋友圈规模将会从几十亿扩大为几百亿，甚至几千亿。这就是我们所说的‘大社交’时代。”


