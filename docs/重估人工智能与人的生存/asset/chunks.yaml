- raw: '在人的社会中，工作总是需要人的。“有的去了，有的来了”这句话，正是对这个技术变革时代的失业与就业的真实写照。过往如此，今天如此，未来依然如此。人工智能机器使一部分人失去了原来的工作，却在创造更多的机会，等待着另一部分人去上岗。未来的路有两条：一条是“退避三舍”，徘徊观望或惊慌失措；另一条是“顺势而为”，成为“智能+”时代的宠儿，成为那个能够改变世界的少数人！清晰认识这个问题，并不断提升应对新挑战的技能，将有助于我们在未来的职场上“端稳自己的饭碗”，更好地生存和发展。


    ## 一、失业：会成为常态吗


    人类历史充满着机遇和挑战，但在任何大变革时代，总不可避免地出现“一部分人徘徊观望，一部分人惊慌失措，一部分人埋头苦干，一部分人改变世界”的局面。


    正如“劳动创造了人本身”，工作也是人生存之必需。因此，一个社会的就业和失业就成为最令人关注的重大且敏感的议题。


    失业，反映的是一种经济状态，每当社会处于“大发展、大变革、大调整”的时代，这样的一种状态就开始显示它无情的一面——它把部分原本兢兢业业为社会做贡献的人无情地抛弃在失业的大潮中。但从某种积极的意义上来说，这场“淘汰赛”却又往往产生新结果——产生一系列新的就业岗位，并使人类社会跃上新的台阶。


    人们不禁要问：人工智能时代到底会给就业带来哪些影响？人工智能到底会使哪些人丢掉饭碗，又会新增哪些就业机会？生活在这个转折点上的人们该如何抓住机遇呢？


    18世纪60年代，随着人类历史上第一次工业革命的到来，以机器大生产取代手工生产的技术变革，使无数农耕阶级被迫消失，转而加入机器大生产的革命浪潮，从而推动了世界城市化进程；19世纪70年代，随着电力的广泛运用和内燃机的发明，全球的工业生产技术突飞猛进，生产规模不断扩大，生产方式开始趋于自动化，这加剧了世界的贫富差距；20世纪四五十年代，以原子能技术、航天技术、电子计算机技术的应用为代表，人类进入了第三次工业革命，传统的机器大生产的劳动形式开始被计算机取代，一种新的劳动方式——技术控制生产正在诞生，人类开始走进知识经济时代；进入21世纪，互联网、物联网、大数据、人工智能、机器人技术、量子信息技术、虚拟现实技术、生物技术和清洁能源的应用，在全世界掀起了“机器换人”的浪潮。相较于前三次革命，这一次革命是比以往任何时候都更为彻底的一次技术性变革，因为它把相当多的现有的人排除在了社会大生产的分工之外。


    正是由于如今正处于第四次工业革命的风口浪尖上，并基于人工智能技术、机器人技术所取得的举世瞩目的成就，以及其对现有人类的就业机会的影响，人们开始广泛反思人工智能与就业、失业的关系——这是一个关乎人们的“饭碗”的问题。


    当然，人们的关注也并不是无中生有，就如在最近的变革中，像华为、京东、滴滴这样的大公司都打算通过裁员降成本的方式，希望在激烈的竞争中谋得一席之地。相关的产业如无人驾驶、人工智能主播、无人超市等层出不穷。更有甚者，在国内的一些大城市，如深圳、佛山、东莞、宁波等都开始实行“机器换人”战略（见表10-1）。如此种种，背后反映的是有一批工人正在被时代淘汰。


    表10-1　中国部分“机器换人”战略


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt013_1.jpg)


    续表


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt013_2.jpg)


    第四次工业革命是一场社会大生产的“智能化、无人化”的大变革，对于全社会的每个成员既是公平的，又是不公平的——公平的方面在于社会的大变革是整个社会的变革，它不是某个阶层和领域特有的优先权；不公平的方面则主要体现为传统的劳动力面临着巨大的压力。


    2019年1月，英国《金融时报》报道称，“华为创始人、总裁任正非在邮件中表示将要进行裁员，裁员主要原因是华为5G全球扩张受阻”。后央视采访时证实《金融时报》的报道为真，任正非在接受采访时表示：“华为现在最大的问题不是来自外部，而是内部的机构臃肿，人浮于事。”


    据了解，2019年1月，滴滴公司CEO程维宣布，公司在2019年将对部分业务进行“关停并转”，特别是对因岗位重叠造成的不必要员工和那些因绩效不达标的员工进行减员，整体裁员比例将占到全员的15%，届时将涉及超过2000名员工。与此同时，滴滴公司却又在相关的招聘网站发布招聘信息，公司将继续招聘2500人，预计2019年年底员工总人数将和2018年年底的13000名员工人数持平。这似乎看起来有些不可理喻，但也恰恰反映出“智能+”时代就业与失业的特征。


    近几年全球大型企业裁员情况如表10-2所示。


    表10-2　近几年全球大型企业裁员情况


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt013_3.jpg)


    资料来源：华尔街见闻。


    综上所述，无论是从一些省市实施的“机器换人”战略，还是从华为、滴滴等大公司裁员的消息，都可以看出第四次工业革命给就业带来的趋势性影响。由于全球市场的竞争加剧，不进行变革的区域势必落伍，不实施创新人才引进的公司也将面临被淘汰的风险。因此，可以说这是一场不可避免的淘汰赛——优胜劣汰不仅是自然界的必然规律，也是人类社会的必然规律。


    有人也许会问，既然是机器换人，那随着人工智能和机器人产业的发展，人类不是早晚有一天将会无工作可做吗？或者更确切地说，人类是否将面临永久性的大规模失业？回答是否定的。


    首先，任何一次工业革命，人们都是在就业与失业的矛盾冲突中一路前行的，在今天的人工智能时代也不例外。正如滴滴公司的大裁员一样，裁掉的员工只不过是那些不能适应新型工作岗位的人，裁员后又进行大批量的招聘，这是在新时代为企业换一次新鲜血液的举动，是在竞争时代企业生存不得已而为之的行为，因为不创新就会被淘汰。这一点也在华为的狼性文化中有所体现。


    其次，当前的人工智能还处于弱人工智能阶段，机器的生产和设计、机器的能量补充等都需要人来完成，这一系列需要的背后，一条完整的人工智能产业链正在重新被构建。从人工智能产品的设计、生产，到投入市场，再到后期的机器维护等，这些环节都需要众多的人为之辛勤付出，只不过原有岗位上的员工与机器相比较时，机器表现得更为出色罢了。


    最后，在新技术变革中，诞生的不仅是与之相关的人工智能产业链，而且是整个社会的人工智能化，在“智能+”时代，各行各业都有待开拓的新领域，有无数的创新创业点可以切入，有无数的机会可以去争取。就拿教育行业来说，新的技术的产生需要有新的培训机构，需要变革传统的教育体制，需要更新传统的教学方式和教育内容……这一切，没有哪一份新的工作是可以自动完成的，都需要人的亲身投入。


    因此，所谓失业成为常态，只不过是社会的悲观论者的言辞和论调。人工智能机器使一部分人失去了原来的工作，却创造了更多的机会，等待着另一部分人去上岗。这样，就需要探讨一下人工智能机器到底能换掉哪些人的问题。清晰认识这个问题，并不断提升应对新挑战的技能，将有助于我们在未来的职场上“端稳自己的饭碗”，更好地生存和发展。


    在人的社会中，工作总是需要人的。“有的去了，有的来了”这句话，正是对这个技术变革时代的失业与就业的真实写照。过往如此，今天如此，未来依然如此。


    ## 二、人工智能机器换人：到底能换掉哪些人


    在当今在学术界，人们习惯把人工智能分为两大类：弱人工智能和强人工智能。弱人工智能派的观点认为，目前人工智能的研究进展主要集中在弱人工智能领域所取得的成就上，由于弱人工智能本身不具备真正的推理和解决问题的能力，所以，弱人工智能机器算不上是智能机器。这些机器在“自动化”的掩盖下，看似具备了自主意识，实则是在按照人类赋予的某种特定的规则行事，它们在思想层面是严格依附于人类的附属品。更为简单地说，它们无法知道自身工作背后的价值和意义。


    强人工智能派的观点则不同，他们认为在人工智能的未来发展中，会产生两类强人工智能机器，一类是类人的人工智能机器（这一点似乎在学术界会引起更大的伦理纷争），另一类是非类人的人工智能机器。前者能够像人一样思考问题和解决问题，并且思考的能力远超人类；后者则是以一种人类无法理解的方式运行。更为值得关注的是，无论是前者还是后者，它们都是可以产生自主意识的，并且能够具备弱人工智能机器所不具备的推理和解决问题的能力。


    目前为止，人工智能的研究成果大多集中于弱人工智能领域，强人工智能的研究基本上没有进展，但它是引起人们讨论未来可能性最多的一个刺激点，因为强人工智能的发展确实存在很多威胁人类生存的可能性。由于目前是处在弱人工智能阶段，人们更多的还是关注人工智能在近期对工作、生活和学习的影响。所以，接下来我们会重点探讨前一节提到的人工智能（弱人工智能）与人们的“饭碗”的关系问题。


    任何技术的进步最终都要回归到服务于人的生存和发展上来。人工智能（本章余下各节都特指弱人工智能）技术的发展也是如此。从历史进程上来看，从远古时代简单的石器、青铜器的使用，到后来的铁器的使用，再到近代的蒸汽机、内燃机的发明，以及现代的计算机和互联网等工具的使用，技术的发展史其实就是一部“人类使用工具”的进化史。在这个漫长的进化过程中，人类逐渐意识到自身可以通过努力去认识自然和改造自然的事实真相，并在不断改造和使用工具的过程中积累了丰富的经验，最终人类从恶劣的自然环境中生存了下来，并在改造自然的过程中取得了巨大的发展。借助技术的力量，人类历史呈现出加速发展的态势。


    纵观整个人类使用工具的进化历程，可以知道，工具的使用在某种意义上来说，就是对人类自身缺陷的弥补，也更像是一种肢体器官的功能延伸和增强。随着工具的迅速迭代，人类认识自然和改造自然的能力越来越强大，从原有的简单的石器的使用，演化到如今的互联网、大数据、人工智能等工具的使用，工具对人体功能的模仿由简单到复杂，从外部肢体一直到大脑的思维运转方式，不一而足。而现有的人工智能机器，更是复制了整个人类的众多才能，并有显著改善的趋势。


    从工具的视角出发，我们会发现，工具所具有的使用功能，在其性能上无限接近人类自身，并在单个的功能领域，远远超过了人类自身的工作能力的极限。当然，这可能正是人类发明工具的出发点。借助工具，人类在生产、生活和学习等方面的效率和质量都得以提升。但与此同时，随着机器的能力无限逼近人类，部分人开始被机器所淘汰，故而演化出今天对人工智能机器到底能换掉哪些人的大讨论。


    众所周知，人工智能作为人类社会生产力和科学技术发展的产物，它诞生的原始目的依然是增强人类自身认识自然和改造自然的能力。但就目前来看，人工智能的“特异功能”超出了大多数人的预想，成为大多数社会生产劳动力的竞争对手。由此，人们对人工智能产生了抗拒心理。


    正如前文所述的裁员行动一样，人工智能机器逐渐在与部分劳动力的竞争中胜出，使得这些劳动力被迫转行或退出劳动力市场。这种情况从人道主义的角度来说，于心不忍；从市场竞争的角度来说，似乎情有可原。正因如此，为了让人们未来在与机器的竞争中能够游刃有余地选择自己的工作，我们首先需要认识人工智能的优势领域，以及它的缺陷和不足。因为人工智能无法达到人类智能水平的领域，正是未来的人们要去发展和努力的方向，也是人们将会大有作为的领域。


    人工智能相较于传统的工具有着极大的不同，它被赋予了自动化的能力，只要通过相关技术控制的简单操作，硕大的机器就能飞速地运转起来。加上人工智能的图像识别、语言翻译、深度学习等技术的不断发展，自动化开始向智能化转变，人工智能对周围环境具备了初步感知的能力，使得其应用的领域不断向外拓展和延伸，从而进军现有的劳动力大军的行业，如珠三角一带的轻工业基地，以及京津唐一带的重工业基地等的劳动力市场，正在被人工智能机器逐渐占据。


    据统计，从20世纪80年代初开始，每年有上千万名务工人员云集广东，他们为广东经济腾飞做出了贡献，在全国跨省流动就业人口中，广东省的占了1/3。从2005年至今，广东每年聚集的外省劳动力一直超过2000万人，最近几年达2600万人\[1\]。然而，就在近年，广东开始实施企业转型升级的战略，以及机器换人战略，这对劳动力有巨大的冲击力。2017年，东莞在开始推出“机器换人”战略时就称，近3年，东莞局部用工人数减少达20万人左右。


    从2015—2017年这三年18～35岁青年劳动人口的城市选择变化（见图10-1）可知，青年劳动人口在近年选择工作的地点开始出现重大变化，选择到一线城市创业打拼的青年人数在下降，与此同时，选择去新一线城市和二、三线城市打拼的青年人数在不断增加。这在客观上反映了“北上广深”高度发展的一线城市对职业技能的要求越来越高，原有的从事劳动密集型和知识密集型工作的青年劳动力被迫向二、三线城市转移。那么，一线城市的人才缺口怎么弥补？第一是靠本土的人才培育和引进，第二是靠人工智能机器换人。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt013_4.jpg)


    图10-1　18～35岁青年劳动人口城市选择变化


    资料来源：BOSS直聘。


    人工智能冲击劳动力市场的巨大威力主要体现在两个方面：直接替代和间接替代。直接替代是指人工智能机器直接在特定的领域胜任人类的工作，导致原有的在职员工被迫失业或另寻出路；间接替代是指人工智能机器对特定职业领域有冲击，致使行业萎缩，导致企业大规模缩减员工，或者导致员工失业。


    直接替代的原因有很多，最主要的是员工的职业技能被人工智能机器所取代。就当前而言，只要在引入人工智能机器的成本低于人类劳动力成本的领域，人类劳动力都开始逐渐被人工智能机器所取代。这样，曾经很多需要人来完成的工作，今天就逐渐被人工智能机器所取代，而且这一切是“现在进行时”。


    譬如，在快递物流领域，京东的智能物流平台就是一个典型的机器换人的代表。隶属于京东集团的京东物流，以专注于为客户提供方便、快捷、高效的服务而闻名。从与中国人民解放军空军后勤部建立战略合作开始，京东就不断地将智能物流产品投放到市场，最终形成了全国一体化、网络化的智能货物配送格局。通过布局在全国的仓配物流网络，京东能够为众多商家提供线上线下、多平台、全渠道、全生命周期、全供应链、一体化的物流解决方案。京东之所以能够发展到这种状态，基本上要归功于人工智能技术的有效应用——单从京东智能物流平台“分拣选址”的功能就能知道其物流的高效与便捷。


    如图10-2所示，京东物流基本实现无人化和自动化，在需要寄件的快递到达京东仓库后，其智能物流分拣平台就会根据不同的快递信息，以最快的速度（快递数量越多，越能体现其比人类分拣员高效）识别快递的发货地址、发件人信息、收件人信息等，然后进行分类分拣，并以传送的方式运送到出库车辆所在地进行装车，从而实现完全智能的分拣模式。就此而言，原有分拣物流服务链上的员工，已被大量的人工智能机器代替了，这样既降低了成本，又提高了效率。智能物流是大势所趋，诸多物流行业被代替的员工必须做出相应的改变。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt013_5.jpg)


    图10-2　京东人工智能物流


    无论是物流领域，还是其他的职业岗位，对直接替代的劳动人员进行分析可知，其被人工智能机器直接替代的更深层的原因是，人工智能机器主要取代的是机械重复的职业岗位上的员工、繁重且高危行业的职业岗位上的员工、缺乏创新能力的员工等。这是因为：一方面，人工智能机器作为一种工具，其本身不会令人失业，人失业是全球市场竞争加剧的结果，而且绝大部分的企业都在转型升级，各行各业都需要新型的人工智能人才；另一方面，也是最为重要的一点，人工智能机器在特定的领域具有远超人类的速度和效率，并且可以进行无休止的劳动，这极大地降低了相关职业岗位上的用工成本。


    因此，未来的人们，在对自身进行劳动技能重塑时，要不断增强自身分析问题和解决问题的能力，提升自身的人工智能素养，培养个人的批判思维和独特的创造性，并且要学会系统思维，不断从实践中总结获取知识和提升能力的方法，树立终身学习的理念。只有如此，人们才能在人工智能时代立于不败之地；也只有如此，才不会被人工智能机器轻易替代。


    通过研究间接替代的可能性可以看出，随着全球市场分工的逐渐细化，在竞争逐渐加剧的情况下，各个职业领域也开始发生剧烈的变化，甚至可以用“不转型，就倒闭”来形容现有的产业。但是，有一个总的大趋势不会改变，那就是人工智能化，届时所有的领域都将打上人工智能化的烙印。


    近期，在腾讯研究院的支持下，北京大学市场与网络经济研究中心的研究团队对400多个职业领域进行了分析。其研究结果指出，人工智能将比以往技术冲击的影响范围更广、力度更大、持续时间更长，甚至可能导致极化。从全国范围来看，在不远的将来，可能有70%的职业会受到人工智能的冲击\[2\]。这就要求广大创新创业者在开疆拓土的过程中，需要认真研究市场发展趋势，顺势而为，力争在这个竞争激烈的时代，能够为更多的人带去希望，为社会做出更大的贡献。


    在间接替代方面，有一个典型的例子。过去，谁也没想过股票交易领域也会受到人工智能机器的冲击。近十年，人工智能高频股票交易应运而生并逐渐趋于成熟。人工智能高频股票交易是指在股票交易市场引入人工智能机器，对股票行情的瞬息万变进行监测，并使用人工智能的高速运算能力，在股票行情的涨跌之间，利用时间差和股票的涨跌差，从微小的差距中赚取微薄利润的人工智能系统。与人工股票交易相比，人工智能高频股票交易具有交易极其高速、交易笔数极多、每笔交易利润微薄等特点，但微薄的利润总比资深股票交易员因为慢1～2s的缘故而导致利润亏空要好太多，这就使得人工股票交易员开始逐渐退出岗位，进而成就了人工智能机器操盘的股票交易奇观，并且这一奇观在当下的华尔街已是随处可见。


    除开股票交易领域，人工智能间接替代的现象还在持续性地延伸到人类生活工作的不同领域，成为一种较为普遍的人工智能化现象。但是，在间接替代的同时，由人工智能催生的新生行业又在不断发展壮大，届时又会出现无数的工作机会和职业岗位。如此看来，人工智能时代的失业潮，也如过往的数次技术革命的影响一样，在给无数人施加压力的同时，也在给更多的人带来发展的机会。


    据BOSS直聘平台发布的《2018求职旺季人才趋势报告》显示（见图10-3），在部分岗位被替代的同时，新的人才紧缺的岗位，如算法工程师、数据构建师等却暂时难以招聘到合适的人才。如果此前你恰好对这些方面特别关注，并掌握了相应的技术理论和应用技巧，那这些机会就正合你意。'
  fmt: '

    在人的社会中，工作总是需要人的。“有的去了，有的来了”这句话，正是对这个技术变革时代的失业与就业的真实写照。过往如此，今天如此，未来依然如此。人工智能机器使一部分人失去了原来的工作，却在创造更多的机会，等待着另一部分人去上岗。未来的路有两条：一条是“退避三舍”，徘徊观望或惊慌失措；另一条是“顺势而为”，成为“智能+”时代的宠儿，成为那个能够改变世界的少数人！清晰认识这个问题，并不断提升应对新挑战的技能，将有助于我们在未来的职场上“端稳自己的饭碗”，更好地生存和发展。


    ## 一、失业：会成为常态吗


    人类历史充满着机遇和挑战，但在任何大变革时代，总不可避免地出现“一部分人徘徊观望，一部分人惊慌失措，一部分人埋头苦干，一部分人改变世界”的局面。


    正如“劳动创造了人本身”，工作也是人生存之必需。因此，一个社会的就业和失业就成为最令人关注的重大且敏感的议题。


    失业，反映的是一种经济状态，每当社会处于“大发展、大变革、大调整”的时代，这样的一种状态就开始显示它无情的一面——它把部分原本兢兢业业为社会做贡献的人无情地抛弃在失业的大潮中。但从某种积极的意义上来说，这场“淘汰赛”却又往往产生新结果——产生一系列新的就业岗位，并使人类社会跃上新的台阶。


    人们不禁要问：人工智能时代到底会给就业带来哪些影响？人工智能到底会使哪些人丢掉饭碗，又会新增哪些就业机会？生活在这个转折点上的人们该如何抓住机遇呢？


    18世纪60年代，随着人类历史上第一次工业革命的到来，以机器大生产取代手工生产的技术变革，使无数农耕阶级被迫消失，转而加入机器大生产的革命浪潮，从而推动了世界城市化进程；19世纪70年代，随着电力的广泛运用和内燃机的发明，全球的工业生产技术突飞猛进，生产规模不断扩大，生产方式开始趋于自动化，这加剧了世界的贫富差距；20世纪四五十年代，以原子能技术、航天技术、电子计算机技术的应用为代表，人类进入了第三次工业革命，传统的机器大生产的劳动形式开始被计算机取代，一种新的劳动方式——技术控制生产正在诞生，人类开始走进知识经济时代；进入21世纪，互联网、物联网、大数据、人工智能、机器人技术、量子信息技术、虚拟现实技术、生物技术和清洁能源的应用，在全世界掀起了“机器换人”的浪潮。相较于前三次革命，这一次革命是比以往任何时候都更为彻底的一次技术性变革，因为它把相当多的现有的人排除在了社会大生产的分工之外。


    正是由于如今正处于第四次工业革命的风口浪尖上，并基于人工智能技术、机器人技术所取得的举世瞩目的成就，以及其对现有人类的就业机会的影响，人们开始广泛反思人工智能与就业、失业的关系——这是一个关乎人们的“饭碗”的问题。


    当然，人们的关注也并不是无中生有，就如在最近的变革中，像华为、京东、滴滴这样的大公司都打算通过裁员降成本的方式，希望在激烈的竞争中谋得一席之地。相关的产业如无人驾驶、人工智能主播、无人超市等层出不穷。更有甚者，在国内的一些大城市，如深圳、佛山、东莞、宁波等都开始实行“机器换人”战略（见表10-1）。如此种种，背后反映的是有一批工人正在被时代淘汰。


    表10-1　中国部分“机器换人”战略


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt013_1.jpg)


    续表


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt013_2.jpg)


    第四次工业革命是一场社会大生产的“智能化、无人化”的大变革，对于全社会的每个成员既是公平的，又是不公平的——公平的方面在于社会的大变革是整个社会的变革，它不是某个阶层和领域特有的优先权；不公平的方面则主要体现为传统的劳动力面临着巨大的压力。


    2019年1月，英国《金融时报》报道称，“华为创始人、总裁任正非在邮件中表示将要进行裁员，裁员主要原因是华为5G全球扩张受阻”。后央视采访时证实《金融时报》的报道为真，任正非在接受采访时表示：“华为现在最大的问题不是来自外部，而是内部的机构臃肿，人浮于事。”


    据了解，2019年1月，滴滴公司CEO程维宣布，公司在2019年将对部分业务进行“关停并转”，特别是对因岗位重叠造成的不必要员工和那些因绩效不达标的员工进行减员，整体裁员比例将占到全员的15%，届时将涉及超过2000名员工。与此同时，滴滴公司却又在相关的招聘网站发布招聘信息，公司将继续招聘2500人，预计2019年年底员工总人数将和2018年年底的13000名员工人数持平。这似乎看起来有些不可理喻，但也恰恰反映出“智能+”时代就业与失业的特征。


    近几年全球大型企业裁员情况如表10-2所示。


    表10-2　近几年全球大型企业裁员情况


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt013_3.jpg)


    资料来源：华尔街见闻。


    综上所述，无论是从一些省市实施的“机器换人”战略，还是从华为、滴滴等大公司裁员的消息，都可以看出第四次工业革命给就业带来的趋势性影响。由于全球市场的竞争加剧，不进行变革的区域势必落伍，不实施创新人才引进的公司也将面临被淘汰的风险。因此，可以说这是一场不可避免的淘汰赛——优胜劣汰不仅是自然界的必然规律，也是人类社会的必然规律。


    有人也许会问，既然是机器换人，那随着人工智能和机器人产业的发展，人类不是早晚有一天将会无工作可做吗？或者更确切地说，人类是否将面临永久性的大规模失业？回答是否定的。


    首先，任何一次工业革命，人们都是在就业与失业的矛盾冲突中一路前行的，在今天的人工智能时代也不例外。正如滴滴公司的大裁员一样，裁掉的员工只不过是那些不能适应新型工作岗位的人，裁员后又进行大批量的招聘，这是在新时代为企业换一次新鲜血液的举动，是在竞争时代企业生存不得已而为之的行为，因为不创新就会被淘汰。这一点也在华为的狼性文化中有所体现。


    其次，当前的人工智能还处于弱人工智能阶段，机器的生产和设计、机器的能量补充等都需要人来完成，这一系列需要的背后，一条完整的人工智能产业链正在重新被构建。从人工智能产品的设计、生产，到投入市场，再到后期的机器维护等，这些环节都需要众多的人为之辛勤付出，只不过原有岗位上的员工与机器相比较时，机器表现得更为出色罢了。


    最后，在新技术变革中，诞生的不仅是与之相关的人工智能产业链，而且是整个社会的人工智能化，在“智能+”时代，各行各业都有待开拓的新领域，有无数的创新创业点可以切入，有无数的机会可以去争取。就拿教育行业来说，新的技术的产生需要有新的培训机构，需要变革传统的教育体制，需要更新传统的教学方式和教育内容……这一切，没有哪一份新的工作是可以自动完成的，都需要人的亲身投入。


    因此，所谓失业成为常态，只不过是社会的悲观论者的言辞和论调。人工智能机器使一部分人失去了原来的工作，却创造了更多的机会，等待着另一部分人去上岗。这样，就需要探讨一下人工智能机器到底能换掉哪些人的问题。清晰认识这个问题，并不断提升应对新挑战的技能，将有助于我们在未来的职场上“端稳自己的饭碗”，更好地生存和发展。


    在人的社会中，工作总是需要人的。“有的去了，有的来了”这句话，正是对这个技术变革时代的失业与就业的真实写照。过往如此，今天如此，未来依然如此。


    ## 二、人工智能机器换人：到底能换掉哪些人


    在当今在学术界，人们习惯把人工智能分为两大类：弱人工智能和强人工智能。弱人工智能派的观点认为，目前人工智能的研究进展主要集中在弱人工智能领域所取得的成就上，由于弱人工智能本身不具备真正的推理和解决问题的能力，所以，弱人工智能机器算不上是智能机器。这些机器在“自动化”的掩盖下，看似具备了自主意识，实则是在按照人类赋予的某种特定的规则行事，它们在思想层面是严格依附于人类的附属品。更为简单地说，它们无法知道自身工作背后的价值和意义。


    强人工智能派的观点则不同，他们认为在人工智能的未来发展中，会产生两类强人工智能机器，一类是类人的人工智能机器（这一点似乎在学术界会引起更大的伦理纷争），另一类是非类人的人工智能机器。前者能够像人一样思考问题和解决问题，并且思考的能力远超人类；后者则是以一种人类无法理解的方式运行。更为值得关注的是，无论是前者还是后者，它们都是可以产生自主意识的，并且能够具备弱人工智能机器所不具备的推理和解决问题的能力。


    目前为止，人工智能的研究成果大多集中于弱人工智能领域，强人工智能的研究基本上没有进展，但它是引起人们讨论未来可能性最多的一个刺激点，因为强人工智能的发展确实存在很多威胁人类生存的可能性。由于目前是处在弱人工智能阶段，人们更多的还是关注人工智能在近期对工作、生活和学习的影响。所以，接下来我们会重点探讨前一节提到的人工智能（弱人工智能）与人们的“饭碗”的关系问题。


    任何技术的进步最终都要回归到服务于人的生存和发展上来。人工智能（本章余下各节都特指弱人工智能）技术的发展也是如此。从历史进程上来看，从远古时代简单的石器、青铜器的使用，到后来的铁器的使用，再到近代的蒸汽机、内燃机的发明，以及现代的计算机和互联网等工具的使用，技术的发展史其实就是一部“人类使用工具”的进化史。在这个漫长的进化过程中，人类逐渐意识到自身可以通过努力去认识自然和改造自然的事实真相，并在不断改造和使用工具的过程中积累了丰富的经验，最终人类从恶劣的自然环境中生存了下来，并在改造自然的过程中取得了巨大的发展。借助技术的力量，人类历史呈现出加速发展的态势。


    纵观整个人类使用工具的进化历程，可以知道，工具的使用在某种意义上来说，就是对人类自身缺陷的弥补，也更像是一种肢体器官的功能延伸和增强。随着工具的迅速迭代，人类认识自然和改造自然的能力越来越强大，从原有的简单的石器的使用，演化到如今的互联网、大数据、人工智能等工具的使用，工具对人体功能的模仿由简单到复杂，从外部肢体一直到大脑的思维运转方式，不一而足。而现有的人工智能机器，更是复制了整个人类的众多才能，并有显著改善的趋势。


    从工具的视角出发，我们会发现，工具所具有的使用功能，在其性能上无限接近人类自身，并在单个的功能领域，远远超过了人类自身的工作能力的极限。当然，这可能正是人类发明工具的出发点。借助工具，人类在生产、生活和学习等方面的效率和质量都得以提升。但与此同时，随着机器的能力无限逼近人类，部分人开始被机器所淘汰，故而演化出今天对人工智能机器到底能换掉哪些人的大讨论。


    众所周知，人工智能作为人类社会生产力和科学技术发展的产物，它诞生的原始目的依然是增强人类自身认识自然和改造自然的能力。但就目前来看，人工智能的“特异功能”超出了大多数人的预想，成为大多数社会生产劳动力的竞争对手。由此，人们对人工智能产生了抗拒心理。


    正如前文所述的裁员行动一样，人工智能机器逐渐在与部分劳动力的竞争中胜出，使得这些劳动力被迫转行或退出劳动力市场。这种情况从人道主义的角度来说，于心不忍；从市场竞争的角度来说，似乎情有可原。正因如此，为了让人们未来在与机器的竞争中能够游刃有余地选择自己的工作，我们首先需要认识人工智能的优势领域，以及它的缺陷和不足。因为人工智能无法达到人类智能水平的领域，正是未来的人们要去发展和努力的方向，也是人们将会大有作为的领域。


    人工智能相较于传统的工具有着极大的不同，它被赋予了自动化的能力，只要通过相关技术控制的简单操作，硕大的机器就能飞速地运转起来。加上人工智能的图像识别、语言翻译、深度学习等技术的不断发展，自动化开始向智能化转变，人工智能对周围环境具备了初步感知的能力，使得其应用的领域不断向外拓展和延伸，从而进军现有的劳动力大军的行业，如珠三角一带的轻工业基地，以及京津唐一带的重工业基地等的劳动力市场，正在被人工智能机器逐渐占据。


    据统计，从20世纪80年代初开始，每年有上千万名务工人员云集广东，他们为广东经济腾飞做出了贡献，在全国跨省流动就业人口中，广东省的占了1/3。从2005年至今，广东每年聚集的外省劳动力一直超过2000万人，最近几年达2600万人[1]。然而，就在近年，广东开始实施企业转型升级的战略，以及机器换人战略，这对劳动力有巨大的冲击力。2017年，东莞在开始推出“机器换人”战略时就称，近3年，东莞局部用工人数减少达20万人左右。


    从2015—2017年这三年18～35岁青年劳动人口的城市选择变化（见图10-1）可知，青年劳动人口在近年选择工作的地点开始出现重大变化，选择到一线城市创业打拼的青年人数在下降，与此同时，选择去新一线城市和二、三线城市打拼的青年人数在不断增加。这在客观上反映了“北上广深”高度发展的一线城市对职业技能的要求越来越高，原有的从事劳动密集型和知识密集型工作的青年劳动力被迫向二、三线城市转移。那么，一线城市的人才缺口怎么弥补？第一是靠本土的人才培育和引进，第二是靠人工智能机器换人。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt013_4.jpg)


    图10-1　18～35岁青年劳动人口城市选择变化


    资料来源：BOSS直聘。


    人工智能冲击劳动力市场的巨大威力主要体现在两个方面：直接替代和间接替代。直接替代是指人工智能机器直接在特定的领域胜任人类的工作，导致原有的在职员工被迫失业或另寻出路；间接替代是指人工智能机器对特定职业领域有冲击，致使行业萎缩，导致企业大规模缩减员工，或者导致员工失业。


    直接替代的原因有很多，最主要的是员工的职业技能被人工智能机器所取代。就当前而言，只要在引入人工智能机器的成本低于人类劳动力成本的领域，人类劳动力都开始逐渐被人工智能机器所取代。这样，曾经很多需要人来完成的工作，今天就逐渐被人工智能机器所取代，而且这一切是“现在进行时”。


    譬如，在快递物流领域，京东的智能物流平台就是一个典型的机器换人的代表。隶属于京东集团的京东物流，以专注于为客户提供方便、快捷、高效的服务而闻名。从与中国人民解放军空军后勤部建立战略合作开始，京东就不断地将智能物流产品投放到市场，最终形成了全国一体化、网络化的智能货物配送格局。通过布局在全国的仓配物流网络，京东能够为众多商家提供线上线下、多平台、全渠道、全生命周期、全供应链、一体化的物流解决方案。京东之所以能够发展到这种状态，基本上要归功于人工智能技术的有效应用——单从京东智能物流平台“分拣选址”的功能就能知道其物流的高效与便捷。


    如图10-2所示，京东物流基本实现无人化和自动化，在需要寄件的快递到达京东仓库后，其智能物流分拣平台就会根据不同的快递信息，以最快的速度（快递数量越多，越能体现其比人类分拣员高效）识别快递的发货地址、发件人信息、收件人信息等，然后进行分类分拣，并以传送的方式运送到出库车辆所在地进行装车，从而实现完全智能的分拣模式。就此而言，原有分拣物流服务链上的员工，已被大量的人工智能机器代替了，这样既降低了成本，又提高了效率。智能物流是大势所趋，诸多物流行业被代替的员工必须做出相应的改变。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt013_5.jpg)


    图10-2　京东人工智能物流


    无论是物流领域，还是其他的职业岗位，对直接替代的劳动人员进行分析可知，其被人工智能机器直接替代的更深层的原因是，人工智能机器主要取代的是机械重复的职业岗位上的员工、繁重且高危行业的职业岗位上的员工、缺乏创新能力的员工等。这是因为：一方面，人工智能机器作为一种工具，其本身不会令人失业，人失业是全球市场竞争加剧的结果，而且绝大部分的企业都在转型升级，各行各业都需要新型的人工智能人才；另一方面，也是最为重要的一点，人工智能机器在特定的领域具有远超人类的速度和效率，并且可以进行无休止的劳动，这极大地降低了相关职业岗位上的用工成本。


    因此，未来的人们，在对自身进行劳动技能重塑时，要不断增强自身分析问题和解决问题的能力，提升自身的人工智能素养，培养个人的批判思维和独特的创造性，并且要学会系统思维，不断从实践中总结获取知识和提升能力的方法，树立终身学习的理念。只有如此，人们才能在人工智能时代立于不败之地；也只有如此，才不会被人工智能机器轻易替代。


    通过研究间接替代的可能性可以看出，随着全球市场分工的逐渐细化，在竞争逐渐加剧的情况下，各个职业领域也开始发生剧烈的变化，甚至可以用“不转型，就倒闭”来形容现有的产业。但是，有一个总的大趋势不会改变，那就是人工智能化，届时所有的领域都将打上人工智能化的烙印。


    近期，在腾讯研究院的支持下，北京大学市场与网络经济研究中心的研究团队对400多个职业领域进行了分析。其研究结果指出，人工智能将比以往技术冲击的影响范围更广、力度更大、持续时间更长，甚至可能导致极化。从全国范围来看，在不远的将来，可能有70%的职业会受到人工智能的冲击[2]。这就要求广大创新创业者在开疆拓土的过程中，需要认真研究市场发展趋势，顺势而为，力争在这个竞争激烈的时代，能够为更多的人带去希望，为社会做出更大的贡献。


    在间接替代方面，有一个典型的例子。过去，谁也没想过股票交易领域也会受到人工智能机器的冲击。近十年，人工智能高频股票交易应运而生并逐渐趋于成熟。人工智能高频股票交易是指在股票交易市场引入人工智能机器，对股票行情的瞬息万变进行监测，并使用人工智能的高速运算能力，在股票行情的涨跌之间，利用时间差和股票的涨跌差，从微小的差距中赚取微薄利润的人工智能系统。与人工股票交易相比，人工智能高频股票交易具有交易极其高速、交易笔数极多、每笔交易利润微薄等特点，但微薄的利润总比资深股票交易员因为慢1～2s的缘故而导致利润亏空要好太多，这就使得人工股票交易员开始逐渐退出岗位，进而成就了人工智能机器操盘的股票交易奇观，并且这一奇观在当下的华尔街已是随处可见。


    除开股票交易领域，人工智能间接替代的现象还在持续性地延伸到人类生活工作的不同领域，成为一种较为普遍的人工智能化现象。但是，在间接替代的同时，由人工智能催生的新生行业又在不断发展壮大，届时又会出现无数的工作机会和职业岗位。如此看来，人工智能时代的失业潮，也如过往的数次技术革命的影响一样，在给无数人施加压力的同时，也在给更多的人带来发展的机会。


    据BOSS直聘平台发布的《2018求职旺季人才趋势报告》显示（见图10-3），在部分岗位被替代的同时，新的人才紧缺的岗位，如算法工程师、数据构建师等却暂时难以招聘到合适的人才。如果此前你恰好对这些方面特别关注，并掌握了相应的技术理论和应用技巧，那这些机会就正合你意。

