    ### 第三，对于机器人

    一方面，人从一开始就可以在机器人芯片中加入人性相关的编程，培养机器人的人性\[22\]，赋予机器人独立的人格及正确的机器人文化价值观，让机器人慢慢找到属于他们的天性，最终使机器人像人一样，在独立处境中用人的方式去思考、去珍视人所珍视的东西，并进行逻辑推论，预测自己的行为后果，不随意伤害有感知力的生物\[23\]。另一方面，当机器人不认同人时，其能独立反思解析自己为什么这样做，有确信自己理念正确的理由，这样其就成为具有独立人格的机器人，同时也慢慢带有人的社会性属性\[24\]，最后具有与人类同等的“人权”\[25\]。


    ### 第四，这三种人要达成共识

    他们要谴责散布计算机病毒的行为，同时形成统一战线，强烈抵制计算机病毒。总之，这三种人要形成共识，相互认同对方的价值，共同建立一个健全的道德体系。


    ### 4.设立咨询机构，提高心理沟通能力

    在当今社会，我们设立心理咨询机构来解决人们的心理问题，同样在三元结构社会中，也要设立更加健全和高智能的心理咨询机构来解决人、半机器人和机器人这三种人之间的矛盾和这三种人自己存在的问题。


    #### 第一

    当人、半机器人、机器人相互之间因为语言而产生误解时，心理咨询机构可以翻译他们的语言，对他们提供语言帮助，让他们通过这种语言交流方式相互理解，从而进行沟通和合作\[26\]；当人、半机器人、机器人相互之间因为思维方式不同而产生误解时，心理咨询机构可以帮助分析他们之间的不同思维价值观，从而让他们理解对方的不同，按对方所需的方式对待对方；当人、半机器人、机器人相互之间因为行为、处事方式的不同而产生误解时，心理咨询机构可以向他们提供正确的行为准则。


    #### 第二

    对于这三种人之间的情感，心理咨询机构可以对其情感困惑提供帮助，让这三种人以一种平等互助、团结合作、共同遵守规则的心态对待对方，同时让他们学会互相欣赏对方的优点、接受对方的缺点，学会求同存异，实现你中有我、我中有你。


    #### 第三

    对于这三种人各自的自由意志，心理咨询机构可以给他们提供关于对自由意志的正确认知，让他们去肯定自身的价值、做独特的自己。


    #### 第四

    对于计算机程序病毒的暴发而对这三种人造成的伤害，心理咨询机构可给予他们心理帮助，让他们认识和接受程序病毒的发生，并且让他们明白怎样更好地预防程序病毒感染，或者在被感染后怎样更好地修复自己的创伤。


    #### 第五

    对于这三种人自己存在的问题，心理咨询机构会让人在三元结构社会发挥人独特的作用和找到属于自己的位置；会让处于人与机器人中间的半机器人找到自己正确的定位并维护好人与机器人之间的关系；会让机器人对自己的产生、来源、未来有正确的认识。因此，可将心理咨询机构作为一个中间媒介来调节这三种人之间的关系，如运用积极心理学去关注人的生活、心理和行为活动并有效激发他们的潜力\[27\]。总之，通过心理咨询机构去关注三元结构社会中的每一种人，让这三种人产生正确的认知，共同建立一种和谐良性的关系，激发每一种人的美好品质，让他们一起来共建共治共享这个新世界。


