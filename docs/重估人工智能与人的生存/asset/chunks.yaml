- raw: '其次，人工智能交通是社会公众对现实交通安全性的虚拟投射。对无人驾驶的安全性的质疑，是多方面因素造成的，除前文所述的单向度的机械思维（无人驾驶汽车自身的传统局限性）之外，社会公众对现实的交通安全性的虚拟投射也有较大的影响。当下，交通事故较多，出行安全的不确定性危及人们的基本生存需求，引发了人们对交通工具的焦虑心理，进而诉诸科技的进步，渴望改变现实。但是，任何新技术都不可避免地有其缺陷和弊端，也就意味着没有人们理想状态中的那么完美，这个落差在某种程度上导致人们对智能交通安全性的拷问。这虽是不可避免的，但功利主义观点似乎在说服着所有焦虑的人们，当无人驾驶汽车所带来的利益远大于损失的时候，人们应该要做的似乎就是，接受无人驾驶汽车不利的一面，并不断地通过努力谋求“利益的最大化”。


    最后，“不确定性”在无人驾驶领域作祟。人工智能技术的“正向性”与“反向性”，决定了无人驾驶技术的“确定性”与“不确定性”。如果不是被少部分不法分子利用，无人驾驶的发展目标永远不可能追求技术发展的反面，但由于某些特殊的原因——这又是无法规避的，就如无人驾驶汽车的善的出发点导致恶的后果一样，同样令人费解——不确定性总是伴随着无人驾驶汽车而出现，它不可能从中完全被消除。由于不确定性的存在，人们对其过去的理解和对未来的预测总是与确定性缺乏完全意义上的符合性\[2\]，人类所秉持的对无人驾驶汽车发展的客观而全面的认识的优越感和自信感未能被人工智能所完全继承，因为人工智能交通深知不确定性才是唯一的确定性，人们追求“人工智能交通完全利于人类”的科学真理的道路蒙上了不确定性的面纱，无形间加深了人们对智能交通的不确定性的安全焦虑。


    值得庆幸的是，不确定性对于人工智能交通而言并不可惧，因为不确定性具有不断超越自身迈向确定性的驱动力，特别是当不确定性与人类的好奇心交织在一起时，其驱动力量最为强大。正如前文所述，人工智能技术的发展是一场思维的革命——拉普拉斯决定论的挑战。正是如此，人工智能交通给其发展的不确定性留足了空间。也就是说，人工智能技术能够在最大程度上把不确定性导致的危害的可能性降到最低，甚至可以将其变为有用性（如保险行业的发展）。


    经过不断的技术改进，无人驾驶汽车的安全性问题逐步被克服。2018年3月19日，图森未来计划将对外发布的无人驾驶摄像头感知系统运用于运输服务的无人驾驶汽车上。该感知系统配备了索尼最先进的汽车CMOS图像传感器，可以支持无人驾驶汽车在夜间和低能见度路况条件下的行驶。根据图森公司反映，如果可以将该项技术全面应用于无人驾驶汽车领域，可使得无人驾驶汽车使用率提高到80%以上。相较于之前美国那21%的人而言，也许随着应用的进一步升级，他们也终将成为图森公司预测的那80%以上的人之中的一分子。


    总体而言，与传统的交通工具相比，无人驾驶的安全系数得到了极大的提高，其安全性主要表现在数据积累的完备性，赋予人工智能交通以更多的智慧；功利主义的强大作用，克服了人类的焦虑心理，正在尝试着接受无人驾驶的出行工具；不确定性的推动力，促使人工智能交通不断地朝着向人类有利的一面发展；无人驾驶避免了传统交通因人为失误而导致的交通事故的发生，如醉酒驾驶、疲劳驾驶、司乘冲突等，可见，无人驾驶的安全性确实有了极大的提高与突破。那么，无人驾驶的安全性又是怎么体现出来的呢？


    2017年12月，为了实现零交通事故，Honda（本田）的研发子公司——株式会社本田研究所宣布，与商汤科技签订了为期5年的联合研发协议，专项研究无人驾驶技术。就在近日，根据美国科技博客Business
    Insider报道称，谷歌的无人驾驶汽车技术一旦成功应用，那么每年就能挽救约3.5万美国人的生命。谷歌的消息人士也表示，谷歌无人驾驶汽车的一个最主要目的是要减少“99%由于人类疏忽大意而造成的交通事故死亡”，这个数据意味着什么呢？


    据统计，全球每年有接近124万人死于交通事故，另外还有2000万～5000万人在交通事故中遭到不同程度的伤害。但是，如果无人驾驶技术成熟，全世界实现无人驾驶汽车的量产及投放市场，按照谷歌的目标预测，那么，每年全球有接近123万人不再被交通事故剥夺去鲜活的生命，这是人类交通史上多么伟大的历史时刻！


    安全问题是无人驾驶领域所有研究设计人员共同的使命，我们不能让传统的交通局限性在新一代无人驾驶领域重蹈覆辙，一致的共同努力必定能够取得喜人成绩。在2018年中国国际大数据产业博览会的“人工智能”高端对话上，有记者问百度创始人、董事长兼CEO李彦宏时说，百度无人驾驶汽车何时能够实现量产？李彦宏回答说，“安全是百度无人驾驶汽车的第一条”，并在随后播放了百度无人驾驶的安全测试视频。在视频中，行驶的无人驾驶汽车飞驰前行，突然，路边窜出一条小狗，无人驾驶汽车做到了很准确地在小狗面前停下来。这一事实，铿锵有力地回答了无人驾驶的安全性，更是百度对无人驾驶的未来的不懈努力的最佳见证。


    无人驾驶汽车优越的安全性能，等待着市场的量产投入。


    ## 三、“电车难题”：无人驾驶汽车将怎样选择


    1967年，菲利帕·福特在发表的《堕胎问题和教条双重影响》论文中，为了批判伦理哲学中的主要理论，特别是功利主义的“为最多的人提供最大的利益”的观点，首次提到“电车难题”，如图2-3所示。其大致内容如下：一个疯子把五个无辜的人绑在电车的铁轨上，一辆失控的电车朝他们驶来，只需片刻就将碾压到他们。幸运的是，你可以控制铁轨的拉杆，只要拉动它，电车便会开往另一条轨道上，那五个人就会得救。然而问题却在于，另一个轨道上有一个盲人，完全看不到电车向他驶来，飞驰的电车肯定会要了他的命。考虑到这些，你是否应拉杆？


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/txt003_3.jpg)


    图2-3　电车难题\[3\]


    与这个思想实验类似，电车难题最早可以追溯到伯纳德·威廉姆斯提出的枪决原住居民的问题上。伯纳德·威廉姆斯做了一个假设，假设一个植物学家有一天到一个独裁的国家旅游，正好遇见20个无辜的印第安人被当地的独裁者逮捕了，并被这个独裁者以涉嫌叛乱罪，全部判处死刑。当独裁者察觉到这个旅途中的植物学家的存在时，就给他提了一个建议，如果这个植物学家亲手枪决其中的1个印第安人，其他19个人就可以全部被释放。那么，这个植物学家是应该亲自枪决一个人以拯救其余19个印第安人，还是拒绝动手，坐视这20个人都被枪决？


    正当这个观点普遍流传时，另一位道德哲学家，朱迪斯·贾维斯·汤姆森又提出一个假设。他说：“假设你当时就站在天桥上，天桥下面是铁轨，铁轨上有5个人马上会被电车撞死。你旁边站着一个体形庞大的陌生人，如果你把他推下去，他会丧命，但电车可以在撞到其他5人之前停下来，你会选择推下这个人吗？”


    自“电车难题”诞生以来，近50年的历史中，道德哲学家们对这个问题进行了较为广泛的探讨，但都没有得出一个确切的答案。在功利主义者看来，这个问题很简单。因为他们认为5个人的生命比1个人的生命更有价值，所以选择杀死1个人，救出另一条轨道上的5个人。然而，道德主义流派却不认同这种看法，他们认为人是目的而不是工具，5个人的生命与1个人的生命无法通过比较的方式得出哪一方的生命更重要，不杀人是人的道德义务，救人也是人的道德义务。但是，在上述“电车难题”的假设中，可以较为直观地看到，道德主义者无论作何选择都会“自陷泥潭”，同时也会因不作为而导致救人的义务与不杀人的义务的道德冲突！


    经过对众多哲学家和伦理学家的观点进行比较，从总体上来看，绝大多数的人还是偏向于功利主义，从而救下其中的5个人的观点，毕竟，道德主义者本身所坚持的观点也很难自圆其说。


    对于“电车难题”的深层哲学解答那是哲学家的问题，但是当“电车难题”与无人驾驶汽车领域相关联，又应该怎样解决这个问题呢？无人驾驶汽车又将会做出怎样的选择呢？


    要想回答这个问题，我们不能仅从问题本身去寻找答案，而应该聚焦于无人驾驶汽车为何会导致“电车难题”发生的问题，以及聚焦于在什么条件下会出现人工智能交通的两难选择问题。对于这个问题的不同回答，将是对人工智能遇上“电车难题”时，智能交通会做出怎样的选择这个问题的最好的回答。否则，人们又将陷入无休止论争中而不能自拔。如果人工智能真的面临这样的难题，当人们在争论的时候，或许为时已晚，其中一条轨道上的人可能已经丧命了。


    人工智能交通对“电车难题”的解答，最终是可以做到跳出问题本身来进行讨论的。人工智能交通将如何实现这一点？最确切的回答就是，人工智能时代的交通，相较于传统交通而言，基本上不会遇到“电车难题”的尴尬处境。未来的人工智能交通系统，交通工具的制动系统具备可选择性，也就是刹车系统有三套或者以上，“电车难题”中的电车失控的要件很难成立。


    另外，人工智能交通系统在车辆出发前就会根据定位系统、卫星智能扫描仪、路面传感器等实时反馈数据，监测行进前方的路面情况，对路面的塌方、可能的障碍物、轨道破损等情况进行实时动态监测，对正在行驶中的车辆进行调控，并在以上情况发生时，人工智能车辆的紧急制动系统将会在距离可能发生安全事故的地段的安全距离之内，就已经全方位启动车辆的制动系统，也就不会出现车辆距离事故现场很近的情形。


    特别需要强调的是，随着边缘计算技术的日趋成熟，“电车难题”的解决策略越发明显。边缘计算是指在靠近物或数据源头的网络边缘侧，融合网络、计算、存储、应用核心能力的开放平台，就近提供边缘智能服务，满足行业数字化在敏捷连接、实时业务、数据优化、应用智能、安全与隐私保护等方面的关键需求\[4\]。从边缘计算的定义来看，其恰好满足了无人驾驶汽车实时、高效、安全等方面的要求，若是将边缘计算技术应用于无人驾驶汽车，行驶路面的具体情况将会以最快的速度反馈出来，这是云计算所不能达到的。据网易科技2018年8月15日报道，知名创投调研机构CB
    Insights详细描述了边缘计算的未来前景，就提到了边缘计算运用于无人驾驶领域的优势，装有高性能的边缘计算的无人驾驶汽车，能够立即对周围环境做出反应，少了数据远距离传输导致的时间差。正是这几秒的反应速度，为其两难选择赢得宝贵的反应时间。


    ## 四、“大数据悖论”：无人驾驶汽车的出路


    人工智能与大数据之间有着千丝万缕的联系，但总括起来，可以化用一句名言来表述：人工智能是站在大数据的肩膀上发展起来的。可以这样说，没有大数据的昨天，就没有人工智能的今天和明天。因此，谈论人工智能与智慧交通之间的联系，自然而然就要谈论大数据这个基础，甚至无法回避大数据存在的缺陷对无人驾驶汽车的影响。


    大数据指导下的城市交通，由于其数据反馈的精准性和及时性，为众多穿行于城市交通线路中的车辆提供实时出行路线，在使用这个导航的人数较少时，用户普遍受益。但是，随着平台注册的车主越来越多，便利就逐渐消失，甚至产生相反的效果，在动态反馈的数据实时更新的情况下，越来越多的车主开始不断地跟随新路况调换车头，直至车主在两条不同的路线上疲于选择，最终导致其不知何去何从，大数据的福利最终演变为大数据的灾难——大数据悖论。


    暂且不论被大数据悖论愚弄后的车主的心态，无法回避的一个问题是，未来人们是否可以借助人工智能来解决这个看似荒诞可笑的问题？回答当然是肯定的！那么，基于人工智能的交通变革，出路何在？


    近期研究发现，当人们提起大数据与人工智能时，往往将两者分开来看待。绝大多数人对大数据的发展都持肯定的态度。当然，在某种程度上来说，这是人们对大数据的本质没有深入了解所致。另外，人们对待人工智能的态度则不然，肯定与否定的态度基本持平。这是源于人工智能处在一个新的起步阶段，其发展不完善所致，这是再正常不过的现象。不过，正是人们对人工智能所持的这两种不同的观点，对于人工智能本身而言，是极有利于其不断发展完善的。


    只要你稍微留意就会发现，当前人们对于大数据的认识基本上还停留在表层，最普遍的解释就是大数据就是指数据的“大”。那么人们是怎样理解大数据的“大”呢？主要是基于大数据的“4V”特征——Volume（数据体量大）、Variety（数据类型多）、Velocity（处理速度快）、Value（价值密度高）。但是，即便看到了这几个特征，就真正理解大数据了吗？事实不是的。自人类诞生以来，人与人、人与物、物与物的联系之中就不断生产出“数不胜数”的数据。可见，大数据的如上特征自古就有，只是近几年来研究人员进行了总结概括罢了。要理解大数据的本质，必须回到互联网世界来进行探讨。


    1982年，传统的互联网NCP协议由于其互联性极弱的缺陷而被停用，取而代之的是以鲍勃·卡恩和文特·瑟夫一起发明的互联网TCP/IP协议被广泛运用，使得无数设备终端能够互联互通，这才最终把固有的大数据呈现出来。因此，从起源看本质，大数据的本质就可以表述为万物互联对客观性的陈述。如此看来，在某种程度上，由大数据催生的大数据产业，其本质就是在解决不同数据之间的“连接”问题：在商业领域，解决的是人与商品的“连接”问题；在搜索领域，解决的是人与数据的“连接”问题；在服务领域，解决的是人与人之间的“连接”问题等。


    说到大数据相关的应用，就不得不提及大数据分析师。这是因为大数据的应用主要表现在运用数据的连接功能上，大数据本身无法进行自我价值挖掘和价值判断，数据连接背后的价值体系需要大数据分析师进行深入的挖掘，才能在应用层面将大数据的价值变现。


    正是因为大数据应用产业的这一特点，才使得“大数据悖论”现象的出现，让人们陷入大数据交通的困境。但是，基于人工智能的智慧交通则不然。人工智能是基于计算机复杂网络的智能系统，它能在极大程度上克服大数据应用缺乏“自主分析”的弊端。随着大数据存储能力、数据传输能力、深度学习能力的大幅度跃升，人工智能交通在克服大数据悖论对交通的消极影响方面具有革命性的超越。


    当我们回到大数据悖论对交通的消极影响的具体情境，不难发现，如果能够对整座城市的所有车主出发前的交通状况进行数据反馈，那么，大数据悖论的消极影响也就消失了。也就是说，在这个新的条件下，大数据悖论对某个时段出行的少数人或者多数人都不会产生消极影响。然而，这种情况只是一种理想状态，只有同时满足以下三个条件，这种理想状态才成立：第一，所有车主每天的行程基本固定；第二，不因其他事务而临时调转车头；第三，全城车主用车时间相同。显然，现实生活中是不可能同时满足如上条件的。城市中的交通工具，唯一能满足这三个条件的就是公交车，但所有人都会坐公交车去上班吗？答案是否定的。所以，为了让生活在一座城市中的所有人都能享受便捷而不拥挤的出行服务，这个艰巨的任务就落到了人工智能与智慧交通的创新应用上。


    为应对城市交通大数据悖论，人工智能交通是这样做的：在未来，城市的交通管理系统、交通服务系统、交通基础设施数据系统、交通安全警示系统等，都将统一纳入人工智能交通系统，这个系统在具体的运用场景中表现为从源头到目的地的动态监测过程。以上下班高峰期为例，现有的大数据交通反馈系统（如高德地图、百度导航等），基本都会出现交通拥挤的情况。


    当人工智能系统运用于交通领域时，城市的配套交通服务体系全部被纳入人工智能算法当中。当一辆车准备从某地出发时，人工智能交通服务系统就会将车主现有的出发地与目的地之间的3～8条线路进行数据推算，包括各条路线的基本数据，如在施工导致不可通行的数据、当前预测要经过车辆的数据、已经在行车辆的数据、近期安全事故发生次数的数据、红绿灯数量等，进行深入综合分析。在人工智能交通系统启动之后，随着人工智能交通系统自动深度学习的数据积累，人工智能支撑下的无人驾驶技术将坚持“出发地到目的地之间的距离最短原则”“出发地到目的地之间的路程所花的时间最短原则”和“交通线路网上运行车辆并行数量规模最小控制原则”的原则。届时，无论是多数人出行的路线规划，还是少数人出行的路线规划，都会根据这“三大原则”重新规划路线。


    这一点，看似大数据交通也可以做到，实则不然，它能做到的仅仅是数据积累，更多的预测和计算功能是由大数据分析师代为完成的。人工智能为何能够实现？这就不得不回到大数据与人工智能的关系问题中去寻找答案。


    大数据与人工智能之间，既有不可分割的联系，又有相互独立的特征。如果不能正确认识它们之间的联系，你所理解的人工智能可能就是缺乏“营养”的新型数据治理工具；如果不能正确认识它们之间的区别，你就会误入歧途，将大数据与人工智能混为一谈。


    大数据与人工智能的联系体现为“相辅相成”的关系。大数据与人工智能的发展是相辅相成的，大数据技术的飞速发展，促成了人工智能的第三次崛起，积累的海量数据，为人工智能的生长提供了源源不断的养分，也就是深度学习所需的数据。同时，人工智能的发展，又在发展中不断完善大数据技术，不断积累更多的数据，使得大数据的发展开始从人为处理复杂数据的劳动变为一种自动化抓取数据的过程，让大数据的价值更为高效地体现出来。


    事实上，如果没有人工智能算法的发展，“实时性”作为大数据价值变现的一个重要前提就很难得到满足。因为传统的获取大数据的过程是一个耗时费力的过程，但人工智能的深度学习算法，通过数据爬虫等相关软件，已经把整个网络空间变为了数据加工的库存场所，在需要数据时可以及时获取，这就避免了很多不必要的时间成本和空间成本。


    从联系的方面来看，基于大数据的人工智能技术，在相辅相成的发展过程中，将传统的大数据技术的时间成本和空间成本降到了最低，满足了无人驾驶汽车的实时性要求，并能通过人工智能的深度学习算法，将某个特定区域的交通情况全盘考虑进它的视野，这就满足了无人驾驶汽车对如上所提的“三大原则”的需求，在更大程度上规避了大数据指导下的时间局限性和空间局限性的缺陷。


    大数据与人工智能的区别，概括起来主要体现在两个方面：功能定位不同，大数据主要集中在数据的输入和存储，以及厘清大数据之间的关系，人工智能则关注的是数据的应用，表现为数据的输出与价值变现；对结果的看待方式不同，大数据主要关注的是结果的获得过程，如果需要从这个结果中寻找某种未来的可能性，则需要更多的人类专家投入更多的预测分析时间。人工智能则不同，人工智能更多的是基于由数据结果而产生的关联性分析，更关注的是智能决策和学习能力的获取，对未知的领域具有极强的关联性预测能力，能够迅速调整自身与环境的适应能力，哪怕获取的数据之间只有细微的差别。另外，它相较于大数据而言，具有更高的效率和准确性，随着应用场景数据的积累，人工智能的运用模型就越发成熟和高效。


    从大数据与人工智能的区别与联系中，我们能够清晰地看到人工智能的优势。对于大数据的运行速度慢、处理数据不及时、数据存储成本高、学习能力不足等缺陷，人工智能都在自己发展的领域将之变为自身的优势所在。自然而然，大数据缺陷所致的大数据悖论，无人驾驶领域的消极影响在这里似乎能够很好地得到解决。'
