    ## 四、个性化的回归之路：教育大数据的魅力


    在不同时代，教育有着不同的内涵和形式。从农业时代的私塾式教育模式到工业时代的工厂式班级教育模式，再到信息和智能时代基于新一代信息技术和人工智能技术的以数据为支撑的科学化、智能化、个性化的教育模式，教育的内涵在不断扩大，教育的外延在不断变化——更加符合人性和人的全面发展需要的个性化教育，在经历了“否定之否定”的发展之后，正在向更高层次复归。如今，大数据和人工智能催生了新时代教育改革的浪潮，推动了个性化教育的蓬勃发展。


    我国政府于2010年发布的《国家中长期教育改革和发展规划纲要（2010—2020年）》中提出：“关注学生不同特点和个性差异，发展每一个学生的优势潜能。”“关心每个学生，促进每个学生主动地、生动活泼地发展，尊重教育规律和学生身心发展规律，为每个学生提供适合的教育。”\[15\]可见，国家在教育规划中十分强调和重视个性化教育。事实上，新时代教育发展的大方向也是个性化教育，这是教育适应人工智能时代科技进步和大数据发展的大趋势。个性化教育遵循学生的个体差异性、成长规律和教育规律，为学生提供丰富多彩的课程内容和实践活动，培养学生自主学习能力和适应时代发展需要的能力，挖掘个体的生命潜能，使学生朝着全面、个性、自由、健康的方向发展。这一切都与教育大数据发展和运用的方向相一致。利用大数据和人工智能技术可以记录学生的行为数据，了解学生的个性化需求，为学生推荐个性化学习内容，了解教师的教学行为，完善教育评价，促进个性化教育的发展。


    首先，记录学生的行为数据。一个“一切都被记录，一切都被分析”的大数据和人工智能时代的到来，为个性化教育的发展提供了可能性和现实性。学生在线上学习时会留下一连串的“数字足迹”，这些“数字足迹”包括学习过程的行为数据、学习结果的评价数据，以及通过在线学习形成的社会网络数据等。在大数据和人工智能场景中，每个学生的入学课程评估、讨论板输入、博客入门或维基活动等都可以立即记录并添加到数据库中\[16\]。通过记录网页的点击次数、搜索足迹、课程资料的选择、视频的观看时间、反复观看的频率、暂停的次数、跳转的次数、点击视频的时间点等学生学习行为数据，以及作业完成情况、测试结果、答疑质量等学习成果的评价数据，一方面可以准确地分析学习资源的质量和效果，进而优化学习资源；另一方面可以使学生对自己这一时间段的学习情况进行分析和总结，确定最适合自身个性化学习的策略，以便日后进一步优化学习行为。


    随着大数据和人工智能技术的发展及其在教育中的广泛应用，可以利用大数据和人工智能技术对学生的行为数据进行采集、记录、分析和挖掘，使新时代的教育能够借助先进技术的发展从宏观群体走向微观个体，跟踪每位学生的行为足迹，进而为实现个性化教育奠定基础。


    其次，通过对学生行为数据进行记录、分析和挖掘，可以了解学生的个性化需求。霍华德·加德纳的多元智能理论认为，每个人由八种基本智能（语言智能、逻辑智能、音乐智能、身体动觉智能、空间智能、人际智能、内心智能和自然智能）不同程度地组合在一起，正是这八种智能的不同组合产生了个体差异\[17\]。实际上，个体差异不仅表现在生理上，还表现在人格特点、认知方式、学习经历、学习偏好、学习需求、学习能力及社会背景等方面。不同个体存在着明显的差异，即便同一个体，其不同方面的发展也会随着时间而变化。在学习的过程中，个体的差异性会直接或间接地影响学生身心的健康发展。因此，教育工作者要承认学生的个体差异性，尊重学生的独特性，了解学生的个性化需求，并针对学生的兴趣、爱好、志向、才能、专长等因材施教。


    在大数据和人工智能时代，通过对学生行为数据的记录，可以了解每个学生的个性化学习需求，并通过大数据和人工智能技术为学生找到合适的学习资源和学习系统，从而实现真正意义上的个性化教育。学生在网上会留下学习过程的“数字足迹”，教师通过对这些数据进行分析和挖掘，可以了解每个学生的学习进度、学习方法及兴趣爱好等。学生的知识水平、能力水平、未来规划、兴趣爱好及长板、短板等方面的不同，会影响他们对学习内容和学习方法的选择。大数据可以使教师了解年龄不同、地区不同、身份不同的学生的各式各样的学习需求，并以此开发丰富多样的学习资源，为学生提供多种选择和个性化的学习指导。


    再次，推荐个性化的学习内容。英国著名大数据专家维克托·迈尔-舍恩伯格指出，大数据和教育的结合，将超越过去那些“力量甚微的创新”而创造真正的变革。他总结了大数据改善学习和教育的三大核心要素：反馈（Feedback）、个性化（Individualization）和概率预测（Probabilistic
    Predictions）\[18\]。在大数据时代，可充分应用大数据和人工智能技术的个性化、反馈和概率预测功能，将数据行为整合成有效信息，并根据学生的需求和能力推荐不同的学习内容、学习方式，为每个学生提供最合适的教学材料，让学生自主选择所需的学习资源、制订适合的学习计划、自由地安排学习时间和地点，从而达到自我学习、主动学习、个性化学习的目的。


    大数据和人工智能技术还能够从大量学生的学习中获得某种类型人才所需要具备的知识。如果一个学生持续地学习了某几门课程，大数据和人工智能技术可以分析出该生的学习需求，并为其推荐其他可能要学习的课程，然后学生可以通过自主选择来确定要学习的课程。因为在信息化时代，知识增长的速度加快，网上海量、碎片化、爆炸式的教育资源会导致信息冗杂，学生不容易获得个性化学习的最佳资源。由于学生不清楚某类人才所需要的所有知识，自己无法选择后续课程学习，无法选择相应的优质课程，这挑战着学生的学习能力、信息处理能力和认知能力，使其容易出现信心缺失、效率低下等问题。但是，大数据和人工智能技术能够很容易地解决这个问题，其可以根据分析结果改变和调整学习内容，使知识的传递得到个性化处理，从而使学生能高效地完成学习目标和计划，进而获得个性化发展。


    基于大数据和人工智能技术的应用，一些互联网在线教育，如翻转课堂和慕课，通过即时、全面、高效、细致地收集、记录、存储学生的学习能力、学习方法、学习过程等大量数据，分析并得出学生的学习兴趣、学习特点、学习效率等结论，然后结合不同类型学生的学习需要与能力，研发适合学生需求的教育产品和教育系统，帮助学生进行自主学习和个性化学习。


    第四，了解教师的教学行为。在大数据和人工智能时代，除了通过记录学生的学习行为数据了解学生的学习需求、推荐个性化学习内容，还可以运用大数据和人工智能技术对教育大数据进行分析与研究，了解和完善教师的教学行为。


    传统的学校教育模式是“普鲁士教育模式”，采用的教学组织形式是按照年龄来划分年级的大班授课制，教学都是按照事先的教学计划来执行的，教师每节课要完成指定的教学任务，由于时间和精力有限，其很难照顾每位学生的个性化发展。而且在传统教育中，教师的角色是无法替代的，学生在教师的主导下被动地接受知识，机械地记忆所讲授的内容，久而久之就会形成懒惰和依赖心理，不愿独立思考，从而丧失自主学习和自我规划的能力，其创新能力更会受到影响。


    大数据和人工智能技术通过对学生各方面的数据进行挖掘，发现隐藏在数据身后的有价值的信息和知识。学习分析系统对收集到的数据进行处理之后，可以提取出一系列信息，这些信息的一个显著特征是具备预测性，其可以给教学带来极强的针对性\[19\]。大数据和人工智能技术的分析、统计和反馈功能，可以帮助教师详细具体地了解学生的学习行为、学习能力、学习习惯、学习需求等内容，了解自己的教学行为和教学效果，以及什么样的教学方法对学生的学习是最有效的，使教师可以针对学生的学习发展情况来调整教学方案，在教学安排上不再固守于同样的顺序，从而使知识的传递得到个性化、灵活的处理。


    除了教师的教学行为改善，教师角色也将发生巨大变化，他们不再作为课本知识的传授者对学生进行灌输式授课，而是在教学中更加注重培养学生的思维能力、知识理解与运用能力、信息收集与分辨能力等，激发学生的创造性思维。教师和学生亦师亦友，更加了解学生、理解学生、尊重学生的个性、促进学生个性化发展。另外，利用大数据和人工智能技术，可以对教师进行全面考核，跟踪教师的教学过程，帮助教师分析教学效果，使教师及时调整教学方法，提高教学质量。


    最后，促进全面客观的教育评价。教育评价是根据一定的教育价值观或教育目标，运用有效的评价技术和手段，通过系统地收集信息资料和分析整理，对教育活动满足教育主体需要的程度做出的价值判断活动\[20\]。大数据和人工智能时代背景下的教育评价是基于教育活动过程中产生的数据进行分析的，要形成科学、客观、全面的教育评价，有效途径就是让“数据说话”，让数据成为教育评价的重要依据。


    大数据和人工智能使得教育形成“全方位、多层次、多领域、多角度”的评价机制。


    第一，扩大评价指标。在应试教育系统下，传统的学习评价指标是考试成绩和排名，它不仅无法全面评价学生的学习情况，对成绩的片面追求还忽略了学生的身心健康发展，影响了学生学习的主动性、积极性和创造性。大数据将重塑教育评价系统，将传统的、单一的结果式评价转变为基于大数据的过程式评价、成长评价和综合性评价等，将重视学生的学习过程、学习体验、学习效果、素质提升和师生的交流互动。


    第二，形成多角度、多领域、多主体的评价。教育评价对象不仅限于学生，还应该包括课程、教师、学校等对象。大数据和人工智能技术的数据储备和技术理念使实现包括学生、教师、学校、区域教育发展、课程等众多评价对象的综合评价模式成为可能\[21\]。传统的德智体美劳的评价也不再适应新时代素质教育、个性化教育的发展要求，教师要重视培养学生的创新能力，将学生的全面发展评价扩展到思想道德、知识技能、人际关系、创新思维、实践能力、身体素质等方面。


    第三，转变评价功能。对学生的评价不是为了区分优劣，而是通过数据的收集和分析，了解学生的能力，并针对学生的情况提出建设性意见，给予学生指导，以充分发挥学生的潜能。学校可以通过运用互联网、云服务、大数据和人工智能建立学生综合素质评价体系，这样学生的所有数据和信息将被全方位地收集和记录。通过这些数据，学校可以很好地观察学生的变化，并依据数据分析为学生提供个性化的评价和指导。以多角度、全方位、多类型、多规格、多层次的全面客观评价机制，代替现行的单纯以分数为标准的评价制度，既是大数据“4V”特征（大量、多样性、及时性、真实性）的要求，也是大数据和人工智能时代个性化教育的追求。


