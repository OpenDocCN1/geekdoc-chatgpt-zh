- raw: '大数据不仅是治理创新的工具，更在深层次上全方位影响着新时代人的生存和发展，拥抱大数据是我们每一个人的必然选择。如何理性看待与合理评价大数据对人生存和发展的影响，是当今大数据和人工智能时代的一个重大问题。刁生富教授等所著的《重估：大数据与人的生存》一书选取了大数据与人的生存和发展密切相关的一些重要方面，包括交往、学习、阅读、教育、刷屏、思维、心理、权利、隐私、素养、解放及数字遗产等，从哲学、伦理学、心理学、教育学、社会学等角度，进行了初步研究，探讨了大数据对人的生存和发展已经赋予的和可能赋予的意义、新产生的问题及解决这些问题的路径。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/att001_1.jpg)


    《重估：大数据与治理创新》


    大数据开启了一次重大的时代转型，数据正以其无处不在、无孔不入、无坚不摧的力量成为创新发展的新方向、新趋势、新路径，对政府治理和社会治理产生了深远影响，而大数据在治理创新中作用的发挥，又与数据治理本身有关，与数据的开放共享有关，与数据思维和数据决策有关。刁生富等人所著的《重估：大数据与治理创新》一书对数据治理、政府治理和社会治理这三个方面的相关问题进行了研究，包括数据治理与数据价值实现、数据开放共享的精细化治理与隐私保护、数字政府与数字公民建设、数据思维与领导干部的数据决策、慈善资源和志愿服务的精准供给与衔接、老龄化社会中的智慧养老问题、共享生活化的生成逻辑与治理创新、大数据在舆情监测中的


    应用与超越等内容，是继《重估：大数据与人的生存》之后又一部富有启发性的力作。


    ![img](http:/csdn-ebook-resources.oss-cn-beijing.aliyuncs.com/images/116783b331374182b41c767e1c0f4ba1/att001_2.jpg)


