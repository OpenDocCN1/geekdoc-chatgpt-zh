    总的来说，在人工智能时代，如果你不幸恰好遇上人工智能机器而丢掉自己当前的“饭碗”，不要惊慌，不要着急，人工智能或许同样也为你准备好了另一份工作。所以，目前你唯一要做的就是，有行动的勇气和决心，并不断付出努力，不断充电，在实践中不断历练人类自身所特有的那些独特技能。


    ## 三、适应“智能+”时代：重塑劳动技能


    在“智能+”时代，凡是与智能相结合的就业岗位，人才的智能素养必是硬性指标。因此，人工智能时代失业的原因在于失业人员未养成智能素养。要在人工智能时代再就业，究其根本，就是需要培养智能素养，重塑劳动技能。


    在人类社会中，人之所以为人，避开意识领域不谈，还有另外一个重要的原因在于，人具有社会学的想象力——这一能力使人能够在复杂而极具变化的自然环境和社会环境中不断地变换自己的位置与角色，从而能够做到在一个日新月异的环境中不会经常表现出“手忙脚乱”的慌张状态，这是人类特有的强大的环境适应能力。


    虽然如此，当社会变革的速度在某段时间内超过人类的适应水平时，难免会使部分人焦虑不安。而正处于第三次人工智能崛起的当下，就恰好处于这样一个时间段内。也正是这时，人类自身迎接挑战的那份决心也被唤醒，“穷则变，变则通，通则久”，人工智能带来的失业大潮把部分人推到了危险边缘，这些人唯有思变，执着于自身的“蜕变”，才能在未来的持续性变革中立足。


    那么，人们要如何思变，才能赢得“万变不离其宗”的信心呢？当然需要回到人工智能时代的人们的劳动技能重塑的维度上来。那为何不是改变人类其他方面的能力，而是要重点强调劳动技能重塑呢？


    人工智能革命，与前几次工业革命有显著的不同——之前的技术革命主要是对人类体力劳动的替代性技术变革，在技术变革的过程中，人们通过使用机器，在很大程度上减轻了自身的体力劳动。那时人们考虑的职业转型，集中在从劳动密集型行业向知识密集型行业转变，劳动技能重塑的大方向是从体力劳动型技能向知识密集型技能转变。


    回归到人工智能革命，这次技术变革对于劳动力的重塑有了新的要求，并显示出了新的特征，因为这是一场思维的革命，相较于过往的技术革命，这次变革更为彻底。人工智能革命，不仅是工作方法、技术及应用方面的革新，更是理论思维的革命，它要求人们在重塑劳动技能时，需要以不同于以往的思维方式去看待人类的社会生活与实践。


    随着人工智能技术的不断发展，其逐渐在特定的领域满足了传统岗位的职位要求。也就是说，它在这个领域把人类挤出了相应的岗位，转而成为人类不可替代的工作主角（见图
    10-4）。这背后，暗示的是人工智能与人类平等的地位，也就是人工智能的独特性与拟人化。


    ![img](img/txt013_7.jpg)


    图 10-4　人工智能机器人客服


    人工智能机器的独特性和拟人化使其不可替代，故而成功占据了人类的工作机会。这让我们知道，未来我们的劳动技能重塑，也必须走独特性路线。正如前一节所述，我们要在人工智能的弱势领域，以及人工智能还没有触及的领域进行技能突破。当这个突破得以实现之时，人类劳动技能的独特性和不可替代性又开始重新得以服务于人类自身。因此，人工智能时代的劳动技能重塑的方向逐渐明朗，即仅仅关注知识密集型技能塑造是不够的，还需要体现对“思维”的塑造。人工智能机器生来就是机器，人类发明它的出发点就是要让它在特定领域超越人类以获得极高的生产效率，但是它可能永远也无法理解它所做的一切真正意味着什么。这就为我们在人工智能时代的劳动技能的重塑指明了大方向——要以新的思维看待人工智能，以新的思维建构劳动技能，以新的思维投入生产实践。


    从个人层面来看，劳动技能重塑的新思维在于，作为社会构成的一员，在人工智能时代，个人应该积极主动地加入人工智能的浪潮中，积极投身人工智能相关的行业，从了解和掌握人工智能的基础知识和基本技能开始，不断理清人工智能的工作原理，并勤于投身实践，在实践中不断地建构自身对人工智能的知识脉络，从而学会解读人工智能工作背后的社会价值。同时，个人应该树立终身学习的理念和“变”的思维，不断地根据市场需求完善自身的知识网络，更新自身的思维方式。


    谈到个人要适应人工智能时代，吴军博士指出，回顾从工业革命开始的前三次重大技术革命，首先受益的是那些和产业相关的人、善于利用新技术的人。虽然并非每个人都能应用新技术去开发大数据和机器智能产品，但是应用这些技术远不像想象中的那么难……在智能革命到来之际，每个人都有两个选择，要么选择加入这次浪潮，要么徘徊观望，最后被淘汰\[3\]。


    当人们找到失业问题存在的根源时，还会有人徘徊观望等待着被淘汰吗？我们每个人都应该坚信没有任何一个具备危机意识的人会这样做，除非是他没看清楚未来。那如何加入人工智能潮流，成为人工智能的最大受益者呢？最为直接的方式是培养个人的人工智能相关从业资格。单从这个方面来说，人工智能从业者包括如下几种：人工智能研究人员，这些人直接推动了相关技术的进步；大量的技术专家，这些人决定了解决某些特定问题的人工智能程序；数量更加庞大的用户，这些人负责在特定的条件设置下操作人工智能程序。对研究者来说，相关人员要有极强的跨学科素质，通常包括在计算机科学、统计学、数理逻辑和信息论方面的深厚积累；对技术专家来说，他们通常要有在软件工程和应用程序领域的相关背景；对用户来说，他们需要熟悉人工智能技术，这样才能熟练应用相关的人工智能技术\[4\]。


    从社会层面来看，劳动技能重塑的新思维在于，学校、家庭、企业和社会要联合起来，重新形成覆盖人们生活、工作和学习不同领域、不同方面的教育网络。政府要不断出台政策鼓励和推动各方积极传授新的人工智能知识，为营造良好的人工智能教育环境贡献力量；要普及人工智能教育，不能让人工智能教育成为部分人的特权；积极推动人工智能教育政策改革，更换其中滞后的、过时的教育方法和手段，打破传统的围绕单个领域培养专业精英的人才培养模式。人工智能时代的教育核心不是强调某个独立学科的分工，而是培养学生跨域关联各个学科的综合能力，培养学生的知识结构化能力和学习建构知识能力。


