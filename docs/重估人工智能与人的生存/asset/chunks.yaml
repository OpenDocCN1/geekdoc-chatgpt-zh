    随着人工智能存储技术（边缘存储）、数据传输技术（5G）、人工智能可视化技术（图像识别）等的发展，人们正在走进人工智能化的“大社交”的时代。进入这个新时代，人们的交往范围、交往时间、彼此的信任感、待人方式、交往行为、自我认知等都会发生重大改变。届时，强大的人工智能技术给每个人构建一个边缘计算的数据库和一个公共的数据库不是难事。基于此，数据库之间的互联互动，使个人的历史与现实相互融合，现实中的个人又与赛博空间的虚拟个人交融，个人与他人存在的密切联系成为可视化的数据图谱。加之新一代人工智能的诞生，将在深度学习领域产生新一轮的纵深突破，其对社交环境的感受和认知的能力将大幅度提升，如今的增强现实的社交到时候将进一步升级。在整个全盘人工智能化的社交大环境中，人与人之间的互动，除了客观上存在的时空距离，其余所有的社交体验都将在人工智能化的社交场景中得以实现。


    与此同时，未来的人工智能化的社交将进一步从现实走向虚拟，虚拟与现实的存在仅凭客观性已无从分辨，还需要引入新的差异性分析维度，才能更好地区别两者之间的真实差异。如果不能认识两者之间的差异，有可能导致人工智能社交成瘾，就如电影《盗梦空间》中的情节，混淆了现实与虚拟空间的后果是非常严重的。当然，只要能够把握适当的度，人们将会从虚拟与现实的差异性中获得前所未有的社交体验。


    在人工智能化的社交环境中，人类的社交存在两大特点。其一是社交形式多样化。存在的社交形式如图片社交、文字社交、语音社交、视频社交、游戏社交、虚拟现实社交、增强现实社交；人与人的社交、人与机器人的社交、人与半机器人的社交、人与智能家居的社交等。


    譬如，为了满足社交群体的情感表达的多元化需求，图片社交逐渐崛起，如微信社交平台中的表情包功能，用户可以在网络中购买或下载免费的表情包，也可以使用自己加工制作的表情包。在孟买的一家社交网络平台VoxWeb上，一款“有声音的图片”的社交软件。自2015年上线以来，至今已拥有超过50万名用户。用户可以在聊天的图片表情包中添加11秒的留言，还可在会议、在外闲逛、乘坐公共交通时私下收听语音内容。


    在未来的视频社交中，不同的语种全部支持即时翻译转换，各国社交无障碍，人工智能社交系统从接收信息到转化为机器共识语言再到转化为用户需求语言，这个过程仅仅在对方讲话结束后的0.01秒内就可完成，并以加速的方式将内容反馈给用户。只有在对方说话内容很长时，用户才能感受到翻译功能的存在，除此之外几乎无差别，这样的时代人们不必纠结于要学习哪个国家的语言，而要做的就是怎样用好和优化人工智能社交平台。


    未来的智能产品社交，如智能家居等都能实现与人的互动交流，它们既能感受主人的情绪状况，又能实时进行需求服务，当主人外出与朋友团聚后回到家中时，他就能按照之前的命名，与智能空调交流，空调就会调试到相应的温度，并且会根据这个城市的平均家庭使用温度给予主人建议，如果主人要求的温度太低，它会询问主人要不要将温度调高一些，以防止感冒。


    其二是社交过程数据化。强大的人工智能存储技术，能够存储全球所有的社交数据，并且能够实现后期搜索查询的功能。届时，万物互联的一切变得智能，人与机器、人与半人机器、人与智能家居等的社交互动都将存储在人类社会交往的指定存储器中。


    更值得关注的是VR与AR社交领域，其目前雏形已现。Facebook一直走在从网络社交向人工智能社交转型的最前沿。2019年3月，Facebook精心打造的最新VR一体式头盔Oculus
    Quest进入流通市场，这意味着全球首个一体化虚拟现实系统诞生，该头盔的360度设计理念，能让用户环视任何方向和漫游虚拟世界，使用户获得与真实世界中几乎一致的体验。


    Facebook的VR社交具备两大优势：一方面是“即得性”（所见即所得），通过这个VR系统，人们可以和朋友随意漫游于全世界的各个地方，甚至是遨游于地球以外的其他星球上，人们前一分钟可以在北京故宫感受古代建筑的精髓，下一分钟又可以与朋友一起到塞纳河畔的卢浮宫体验文艺复兴时期画家列奥纳多·达·芬奇创作的油画的艺术魅力；另一方面是“在场性”，运用此VR系统，人们可以选择一个特定的地点作为聚集的地方，创造一个特定的在场环境，亲人朋友就可以到此团聚，在这个场景中，人们相互之间的沟通交流都是真实的，人们的仪容仪表也完全是真实的，就像在现实世界里的生活一样，那里的一切也都会成为人们真实的温暖记忆。与现实唯一不同的是，这种“在场性”是一种虚拟构造的场景。


    从这两点来看，人工智能社交具备远大的前景，毕竟这样的一种社交方式能够契合现代人高速运转的生活方式——在不同的生活频道快速切换是人们普遍的生活特征，而虚拟现实（VR）社交，就像是为现代人量身打造的社交软件，更能深入人心。


    人工智能化的人类社交，不仅会在一种虚拟现实的社交环境中进行，也会在增强现实（AR）的社交环境中进行。在电影《头号玩家》中呈现的社交场景，正是将虚拟现实与增强现实结合的人类未来社交的方式——超现实社交。在人工智能技术的支撑下，如《头号玩家》中的这种超现实的人类社交，逐渐成为年青一代社交的新方式。


    在《头号玩家》的绿洲操作系统中，其通过人工智能的技术手段打通了现实世界与平行世界的通道，设计了一个宏大的社交游戏背景，种种竞争与角逐就此展开，其中人们的沟通互动不乏真实性，也存在虚伪丑恶的一面。游戏中的每个人都只有一个身份，对应着现实中的个人，其只要通过技术手段锁定IP地址，就能与现实中的人见面。在其中的人们，彼此的信用是现实的增强版本，因为游戏中的人际往来，包括承诺和消费，都要做到言出必行，都必须有信用。人们在真实世界中积累的信用积分，在这个超现实的虚拟社交环境中仍然可以用来消费，但如果一个人超额消费却又还不起钱，则对他的讨债就会回到现实中进行。当然，到目前为止，这个宏大的超现实人工智能化的人类社交平台仅存在于这部影片中，但是随着人工智能技术和区块链技术的不断发展，加之虚拟现实技术的不断完善，这样的人类社交方式正在逐渐变成现实，种种发展迹象表明，这一天已经不远。


    人工智能化的人类社交，难免有一种超现实主义色彩，所以，我们在未来的人工智能社交技术的发展过程中，要时刻谨记《头号玩家》中哈里迪最后告诫韦德的那句话：“现实世界是唯一真实的东西。你可以在虚拟世界寻求刺激、寻求自信乃至寻求爱情，逃避现实、逃避责任乃至逃避失败。但最后，你终究要回到现实，如同看过这场绚丽夺目的电影，你还是得走出影院过自己的人生。”


    上述是关于未来人工智能化的人类社交的畅想，其中有的已经变成现实，有的还仅存于理论层面。那么，为了能够实现这样的美好愿景，今天的人们能够做些什么呢？一方面是前进措施，着重思考人如何与人工智能完美结合，因为只有人与人工智能完美结合，人们才能走进人工智能社交的新时代。另一方面是防范措施，侧重于思考人工智能社交新时代应对风险的策略。


    对于前进措施，主要从三个方面着手：一是以运算和存储能力为依托的运算智能；二是以延伸人类感官的感知技术为依托的感知智能；三是以让机器进行类人化的理解与思考为目标的认知智能\[4\]。在现有人工智能技术的基础上，随着5G技术的应用与普及，待突破下一个人工智能技术的拐点时，人工智能社交平台的社交能力（包括运算能力、感知能力、认知能力等）将实现指数级提升。这一刻的到来，意味着全人类的社交方式将全面进入人工智能社交新时代。


    对于防范措施，主要从以下四个方面进行预防。第一，人工智能社交成瘾防范。未来的人工智能社交，由于其超现实的社交体验，堪比现实并高于现实，很容易让人沉迷其中而忘记现实，从而导致人工智能社交成瘾。在未来的人工智能社交软件的设计中，需要特别注意这个问题，不然很容易将人工智能社交软件沦为没有自控能力的人的灾难场。因此，在设计人工智能社交软件的过程中，科学家和工程师应该将这种安全意识带入软件设计全过程，在社交软件中插入安全警告和报警代码，提前预防因过度使用导致的人工智能社交成瘾问题。


    第二，完善灾备存储技术和信息补救措施。在人工智能社交大环境下，数据就是一切，数据的丢失意味着个人在虚拟环境中的个人身份的丢失。个人社交身份数据又与社会信用挂钩，身份的丢失最终将会导致个人的社会行为受到严重的阻碍。因此，在未来既要防止个人的边缘数据和公共数据被人篡改和非法买卖，又要进行必要的灾备存储以防止信用归零。因此，提前完善灾备存储技术和信息补救措施，能够为个人的身份数据安全提供一个更为可靠的保障。


    第三，平等使用人工智能社交技术的权利。人类有平等地获得人工智能社交技术的权利，是保证每位社会成员在未来的社交大环境中不被边缘化的前提，也是人们不会与社会“脱节”的必要条件。没有任何人有权利剥夺他人社交的权利，但是人们更应该将人工智能社交环境中的“社交弱势群体”纳入社交群体中来，让他们也有选择的权利。这一方面需要个人主动融入，另一方面需要降低社交软件的准入门槛，不能将中低收入人群排除在这个平台之外，不然会进一步加剧社会的不平等。所以，社会各界需要共同努力，让人工智能社交平台成为一个群众性的平台，让所有人都有正当发言的权利。


    第四，构建伦理道德约束机制。伦理道德是指人的内心价值追求与外在行为的规范，在人工智能社交时代，人与人之间、人与机器之间的社交形态万千，若要维持其有序运行，谨记伦理道德是最急需的。人工智能社交平台的搭建，需要有明确的社交规则与伦理要求，这样才能确保平衡参与该平台的各方的利益。在人工智能社交平台中，规则对于规则制定者的约束力相对较小，因此对这部分社会精英的伦理道德规约成为重中之重，一方面，需要加强引导以巩固他们内心的法律约束力——内心的道德；另一方面，需要及时更新法律，使法律能够与人工智能社交发展的步伐相适应，以免“法无规定不可为，法无禁止即自由”这句话沦为人工智能社交平台的话语者的说辞。此外，技术的漏洞几乎在每个时代都会沦为不法分子牟利的契机，或许我们现在无法得知人工智能社交的缺陷何在，但我们可以在社交人工智能化的过程中加入伦理道德的预测性预防手段，以备不时之需。


