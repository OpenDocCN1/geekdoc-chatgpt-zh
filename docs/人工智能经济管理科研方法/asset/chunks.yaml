    \ Ethics，COPE)强调“AI 不能署名”，高达 98%的期刊禁止 AI 署名。\n\n(2)要求充分披露 AI 的使用情况(Disclosure\
    \ Required)\n若 AI 贡献超出基础编辑辅助范畴，必须在论文的特定部分清晰说明所使用的 AI 工具名称、版本、开发者及具体用途和贡献程度。COPE\
