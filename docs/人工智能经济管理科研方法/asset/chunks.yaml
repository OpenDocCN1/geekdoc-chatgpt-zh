    \ 8.3 所示，通过安装并加载`SciBERT`模型计算章节语义向量，连接`Hugging Face`的官方服务器，实现“章节嵌入生成”，基于关联度矩阵计算，生成“章节关联度矩阵”或“关键词列表”并保存，通过`VOSviewer`导入并可视化关联度矩阵，实时标注“弱关联章节”与“冗余章节”，再基于`VOSviewer`输出的关键词共现情况与章节关联度图谱，将其作为框架重构层的优化靶点，分析并标注存在的逻辑漏洞，助力提升科研写作的逻辑性。\n\
