    生成式人工智能显著降低了研究门槛与成本，增加了研究的广度。研究者可借助生成式人工智能构建虚拟访谈对象、模拟对话情境，甚至实现智能追问，这会大大降低访谈成本，提升访谈效率与质量。在数据分析环节，生成式人工智能具备对多模态数据进行自动标注、语义聚类和关键词提炼的功能，有助于从视觉、语言、行为等多维信号中发现潜在模式。已有研究表明，研究者使用ChatGPT对58分钟访谈文本进行编码分析，其结果在描述层面与人工编码高度一致，显示出生成式人工智能在“初级分析—概念识别”层面的强大能力。但同时也显示出其在“深度解释—理论建构”层面的局限性，尚无法完全替代研究者的分析判断与理论感知。


    值得强调的是，尽管大语言模型与生成式人工智能极大提升了质性研究的效率与智能化水平，但也带来了新的方法论张力与伦理挑战。AI虽然擅长识别语言模式、生成结构模型，但在理论敏感性、研究直觉、情境判断与社会文化理解等方面仍难以替代人类研究者。因此，AI应作为“人本研究的增强器”而非替代者，帮助研究者在逻辑推理、多案例对比、理论抽象等环节中更高效、更系统地完成研究任务。


