    ## 1.1 AI时代的经管理论重构


    人工智能技术促使经济管理研究的理论体系发生了系统性重构，其影响已渗透至基础假设、决策机制及行为路径等核心维度。


    ### 1.1.1 理性人与算法人


    在新古典经济学与管理学理论体系中，“理性经济人”(Homo Economicus)是一个基本假设前提，它假定人是理性且自利的，并以最优方式追求自身目标。这一假设为构建经济行为模型提供了关键便利，是微观经济学、博弈论、管理决策理论等多学科理论体系的重要基石。然而，随着人工智能技术的飞速迭代，算法驱动的决策在各类经济活动中的权重持续提升。根据数据平台Statista
    2025年发布的报告，在全球高频交易、智能推荐系统、区块链智能合约等领域，算法驱动决策的应用占比已超过63%。


    克劳迪娅·华格纳(Claudia Wagner)等人在2021年《自然》(Nature)杂志刊发的文章中提出了“算法融入的社会”(Algorithmically
    Infused Societies)概念，指出未来社会结构将由算法运行逻辑与人类行为模式共同塑造。丹·科特利(Dan Kotliar)与拉菲·格罗斯格里克(Rafi
    Grosglik)在2023年发表的学术论文中探讨了“算法人”(Homo Algorithmicus)概念，将其描述为一种依托不透明的人工智能算法而形成的新型主体，具有“算法驱动”的主体构造特点[¹](#fn1)


    #### 1.理性人：理论研究的假设前提


    在研究经济问题时，新古典经济学假定从事经济活动的个体均为“理性人”，其核心特征是力图以最小的经济代价去追逐和获取自身最大的经济利益。基于这一假定，人们做出经济决策的出发点是私人利益，在追求私人利益的过程中，个体以实现个人利益最大化为目标，不会主动做出于己无利的行为。经济学家认为，在各类经济活动中，只有符合这一特征的人才属于“合乎理性的人”，反之则被视为非理性的人。“理性人假设”的核心内容包括以下4点：①
    在经济活动中，个人所追求的唯一目标是自身经济利益的最大化。② 个人的所有经济行为均具备明确意识与理性逻辑，不存在经验性和随机性的决策。③“理性人”拥有充分的经济信息，能够清晰掌握所有经济活动的前置条件与潜在后果。因此，经济环境中不存在任何不确定性，且获取信息也不需要支付任何成本。④各种生产资源可在不同部门、不同地区之间自由流动，且流动过程无须承担任何成本。需要注意的是，“理性人”的利己主义假设并不同于日常语境中的“自私自利”。这一假设并不意味着市场参与者仅关注个人经济收益，相反，个体在追求自身最大利益的过程中，会自然且必然地为社会提供符合需求的产品和服务，从而在客观上实现一定的社会利益。


    这一思想根源可追溯至亚当·斯密的《国富论》，后经威廉·西尼尔、约翰·穆勒等经济学家的进一步阐释与深化，最终由维尔弗雷多·帕累托正式引入经济学理论体系，成为核心假设之一。它是对经济社会中所有经济活动参与者基本特征的抽象概括，构成了现代经济学理论构建的基础。尽管这一抽象模型具备逻辑简洁、推演严密的优势，但在现实场景中常与实际经济行为存在偏差。行为经济学、心理学与管理实践的研究不断证实：人类决策存在认知偏差、情绪干扰、注意力有限等非理性因素，导致“理性人假设”在解释现实行为时的效力受限。即便如此，该假设在经济学理论模型构建、政策效果推演等领域仍具有不可替代的基础地位。此外，尽管这一假说长期存在争议，但正是这些质疑推动了其理论边界的拓展与完善，也催生了行为经济学等分支学科的发展。


    #### 2.算法人：AI时代的新型决策主体


    “算法人”是相较于传统“理性人”假设而提出的新型概念，旨在重新定义AI时代的经济决策主体。在人工智能与大数据深度渗透经济活动的背景下，该概念从本体论与认识论两个层面实现了对传统经济学基础假设的系统性重构。


    在传统经济学框架中，决策主体被假定为“生物人”[²](#fn2)[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)tnote_ref_2">![Elworthy
    C. Homo Biologicus: An Evolutionary Model for the Human Sciences[M]. Berlin：Duncker
    & Humblot，1993 .](Images/note.png)​，即依托自身知识储备、实践经验和理性思维独立作出判断的个体。但在“算法人”的理论视角下，决策主体不再是孤立的人类个体，而是由“人类系统”和“算法系统”深度耦合形成的复合主体。


    人类的情感倾向、经验认知与价值判断，会与算法的数据处理能力、逻辑推演能力和预测能力深度融合，二者相互嵌套、持续交互，形成一种新型复合决策系统。这种系统层面的重构，突破了传统的“人—工具”二元论的局限，更真实地反映了数字环境下人机协同决策的现状，也更能体现双方在认知层面的动态调适与共同演化过程。


    传统“理性人假设”强调人类的计算理性，但计算理性始终受限于人脑信息处理能力的边界，这正是赫伯特·A.西蒙(Herbert A. Simon)提出“有限理性”理论的核心依据。而“算法人假设”则在认识论层面带来三重重要突破：其一，实现理性的“外包”与增强。人类可借助算法与算力资源处理超大规模信息，突破个体认知局限，达到近似甚至超越个体理性的决策水平。其二，构建分布式智能网络。通过接入智能系统，个体理性判断能力得以持续优化，进而形成更强的信息整合与判断能力。其三，强化动态预测分析能力。依托算法模型对复杂趋势进行实时模拟与持续学习，显著提升决策的准确性与前瞻性，降低因信息不对称导致的决策偏差。


    因此，在“算法人假设”下，理性不再是人类个体固有的静态能力，而是由算法实时拓展、人机协同生成的动态智能行为。


    #### 3.理性人与算法人的区别与联系


    随着人工智能与数据智能系统的持续迭代演进，经济行为主体的认知模式与决策逻辑正发生深刻变革。在此背景下，“算法人假设”的提出并非对传统“理性人假设”的全盘否定，而是后者在技术条件下的深化与范式重构。传统经济学中的“理性人假设”强调个体以效用最大化为目标，依靠独立理性进行选择；而“算法人假设”则体现出决策主体在算法技术和智能推荐机制中被塑造和影响的典型特征，这类主体在行为层面可能呈现出符合算法逻辑的“理性”表现，但这种理性已不再源于人类自身的自主推理与判断，而是建立在数据驱动分析和算法模型优化之上的结构化生成结果。因此，“算法人”并不是单纯意义上对“理性人”的能力增强，而是理性分析范式在技术环境下的适应性演化，其本质标志着经济决策逻辑已从传统的人本理性，逐步转向技术增强型智能的阶段性跃迁。


    (1)“理性人”与“算法人”的关键区别


    传统经济学中的“理性人假设”强调个体在信息完备与理性稳定的理想前提下进行最优化决策，其决策逻辑建立在静态分析模型之上，假定行为主体能够明确目标、稳定偏好，进行成本收益权衡。然而，在现实经[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)济场景中，个体决策常受到信息不完全、认知偏差及情绪波动等非理性因素的影响，导致“有限理性”状态在实践中普遍存在。

