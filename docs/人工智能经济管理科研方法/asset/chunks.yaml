- raw: "决定判别式模型性能的另一关键因素是输入特征的表达能力。在传统经管研究中，变量构建多依赖单一来源的数据，如结构化财务报表、问卷数据或公开文本。然而，在真实世界中，企业行为的复杂性往往超出单一数据源可捕捉的范围。例如，管理者的“个人魅力”“领导风格”难以通过财报语言提取，需借助图像、音频或视频等多模态数据进行构建。这一趋势已在前沿研究中有所体现，如有研究利用CNN从CEO访谈视频中提取其面部表情特征，配合文本分析算法构建沟通风格变量。这些研究不仅丰富了变量的表征维度，也启示研究者可将函数数据、区间数据、矩阵数据等非传统数据纳入变量构建体系，在判别式模型的框架下实现多模态的变量构建。\n\
    \n(3)提高模型的可解释性\n\n判别式模型依赖高质量的人工标注样本，而在经管科研中，许多变量并无现成标签，构建成本高，代表性也难以保障。因此，未来的变量构建体系可通过“判别—生成”模型协同的方式，克服解释能力不足的问题。例如，可使用生成式模型分析潜在语义标签，再使用判别式模型进行目标分类或评分，形成变量构建的双阶段流程。在企业战略研究中，此类方法可用于判断战略语义框架、监测战略语言的一致性与演化，从而辅助构建“战略一致性”或“战略模糊性”等抽象变量。此外，可解释性技术的发展也提供了一些新思路，通过SHAP值、LIME分析等方法，研究者可以判断哪些输入特征在变量分类中起主导作用，从而增强模型输出的可解释性与研究结论的可信度。\n\
