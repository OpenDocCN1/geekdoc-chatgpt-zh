    ## 9.1.4 复杂系统下的创新力与决策力


    智能经济时代的经管问题日益呈现复杂系统的特征，多主体交互、非线性演化、路径依赖等特性使得传统分析框架面临挑战。在此背景下，研究者需要发展新型的系统创新力与韧性决策力。


    ### 1.复杂系统思维的核心要素


    复杂系统思维作为理解经济与社会现象的重要方式，其核心包含多个相互关联的要素。首先，网络化认知强调应从经济主体之间的连接模式出发，例如分析供应链结构或金融关联网络，并借助中心性测算、社区发现等网络分析方法，揭示系统内部的风险传导或功能组团。例如，可运用`GNN`对银行间的风险传染路径进行建模与推演，从而识别关键传染节点和系统性脆弱环节。其次，动态演化视角要求研究者关注系统随时间的演变过程，可采用基于主体的建模(`Agent-Based
    Modeling`，`ABM`)来模拟市场行为和政策冲击下的演化轨迹，并着重识别系统发生相变的关键阈值，比如市场流动性危机的临界条件。一个典型案例是使用强化学习模拟企业在碳交易环境中的策略适应行为，从而观测制度设计如何影响宏观减排目标的实现。最后，跨尺度关联思维致力于构建从微观个体行为到宏观涌现现象之间的理论桥梁，例如将具象的消费者`Agent`模型与抽象的宏观经济`DSGE`模型进行耦合，从而在统一框架中解释个体决策与整体经济动态之间的互动机制。


