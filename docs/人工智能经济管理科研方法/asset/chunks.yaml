    \n第三，核实AI生成内容，保障学术原创性。经管领域的研究需要结合大量数据和市场分析，容易出现对大模型生成内容的过度依赖，进而导致学术原创性的降低甚至学术不端行为的出现。AI不具有署名权，无法律地位和责任承担能力，研究者对学术写作负责，须对AI生成内容进行核实后方可使用，并如实记录AI工具名称、版本、使用场景等信息，清晰划分工具辅助与个人原创边界。美国多所高校在引注格式中建议将正文中引用`ChatGPT`的内容标注为“（`OpenAI`+年份）”，耶鲁大学等高校则认为目前的生成式人工智能工具在产出内容上更多是依靠预测，而非原创。\n\
    \n### 2. 全程监管\n\n#### (1) 监管对象\n\n![](Text/https:/res.weread.qq.com/wrepub/CB_3300%3Cspan%20style=)[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)196873_56EAHk3Cz3PK3PK3LB42v5Lc768db.jpg\"\
    \ style=\"width:35%;\"/> \n\n全程监管的实践\n\n第一，大模型技术。大模型技术是算法、数据处理和标注、模型训练等技术的集合体，对技术本身的监管是应对大模型伦理问题的第一要务，可以从以下3个方面展开。一是大模型自身的伦理功能设计。例如，以人类反馈强化学习、模型可解释性和`OpenAI`正在研发的模型审计等技术提高模型黑箱透明度、生成内容可解释性和伦理导向正确性等；在大模型中增加伦理数据训练模块、内置伦理自查或审计模型等伦理设计，减少伦理失范现象的出现。二是大模型技术的伦理内部审查。如采取模型卡制度，由大模型研发者创建模型卡，对大模型的参数、算法、训练数据、预期应用领域和用户群体等关键性信息进行自检并登记，实现事前的伦理内部审查。三是大模型技术的伦理外部监管。人工智能技术的备案、审查和安全评估等伦理治理措施已经推行，为加强大模型伦理外部审查的约束刚性，可对大模型技术采用全链条伦理审计制，针对不同技术可选择代码审计、非侵入式审计、众包审计、代理审计和抓取审计等方式，以保证审计过程中的权责匹配性、机构独立性和知识产权保护等。\n\
    \n第二，模型行为主体。人工智能大模型的伦理问题治理本质上是针对作为模型行为主体的人类的监管。作为大模型全周期（研发、训练、部署、应用）的核心行为主体，人类在技术设计、数据使用、算法优化及场景化应用等关键环节具有不可替代的作用。基于生命周期理论框架，可将相关责任主体划分为以下6类：大模型研发者、大模型训练者、数据提供者、数据处理者（主要包括数据预处理者、合成者和标记者）、大模型服务提供者和大模型应用者。需要综合考量上述多类监管对象的共性和差异，构建差异化的伦理监管机制。首先，从内部监管角度看，大模型行为主体内在伦理监管体系的构建，本质在于提升伦理道德认知、强化伦理素养以及提升专业技术能力水平。遵循“伦理认知－伦理判断－伦理意图－伦理行为”的伦理决策四阶段理论，一方面构建多维度主体分层治理框架，依据不同行为主体的权责划分，差异化地提出伦理认知培养方案；另一方面通过宣传和教育等方式，正确引导伦理判断和伦理意图，提升行为主体的伦理素质和专业技能，降低伦理失范发生的概率。其次，基于外部监管视角，需要将制度性约束与市场性规制纳入监管体系。在制度约束方面，推行许可证制，在大模型投入市场之前，监管机构要对大模型进行伦理评估或性能测试，符合标准的大模型才允许进入市场。在市场规制方面，采取市场黑名单制，根据大模型在应用中出现伦理失范的频率、影响范围和造成损失或伤害的程度等确定是否将大模型行为主体列入市场黑名单，并对纳入市场黑名单的大模型相关行为主体实施惩处和限制，降低潜在伦理风险。\n\
    \n#### (2) 监管主体\n\n第一，政府机构作为政策法规的制定者与市场秩序的守护者。政府在大模型学术应用伦理监管中发挥着主导作用，可以通过建立完备的法律法规，引领大模型学术应用领域指南与准则的构建，为大模型应用的学术伦理监管提供依据。政府可参照欧盟发布的《人工智能法案》，按照风险等级对人工智能模型进行监管，为高风险模型的应用设置透明度，并开展数据治理和人工智能监督。政府部门应当依据大模型应用的实际情况，制定并不断完善关于大模型的数据保护条例、算法监管条例和学术诚信条例，依法对违规行为实施惩处。设立相关监管机构或赋予监管机构相关的权力或职能，监管大模型的所有环节。监管机构有权对科研机构、高校等使用大模型的机构进行定期检查和不定期抽查，保障其对大模型的使用符合大模型的学术伦理。加强国际监管合作，积极参与制定国际性的技术标准和监管规范，规避监管标准可能导致的大模型技术应用伦理问题。\n\
    \n第二，行业协会作为自律规范的倡导者与行业标准的塑造者。行业协会在大模型技术应用监管中具有独特优势，能够发挥行业自律和协调作用，通过制定大模型在隐私、算法公平性等问题上的行业标准来实现不同企业之间的规则统一，降低企业合规成本，提高行业的规范水平，增进不同机构之间的沟通和交流，促进行业整体发展。通过开展行业内的技术交流和经验分享，行业协会能够减少行业内部企业之间、行业内部企业与行业外部的信息不对称现象，促进政府、企业、学术机构加强合作，共同探索解决大模型伦理问题的有效措施，增强消费者对大模型产品的信任。\n\
    \n第三，学术机构作为科研伦理的监管堡垒与规范引导者。高校、科研院所这类大模型学术应用的主要场所，应着重建立内部监管机制。出台本单位大模型应用的指导方针和伦理标准，对使用大模型的研究人员进行培训，例如组织针对大模型应用的学术研讨会和专题培训等，提高研究人员的伦理意识和合规操作能力。设立学术单位伦理审查委员会，对本单位有关大模型的研究项目进行前置伦理审查及大模型应用后的监督。在立项阶段，检查项目大模型应用的数据、数据收集手段以及数据应用过程是否符合伦理标准；在项目应用过程中，对项目的进度、实际应用的合规性和研究的有效性进行必要的检测；在项目应用成果展示前，对项目研究结果进行必要的筛查，避免存在不实的和不合法的信息。对于大模型应用行为不合规的人员，应该进行一定的惩处，包括提出警告、限制科研项目的学术支持、扣发学术奖励基金等。\n\
    \n第四，企业作为主体责任的践行者与价值共创的引领者。企业是大模型开发和应用的直接主体，企业在经管学科的企业社会责任框架下承担首要义务。其自我监管主要通过以下途径进行：一是强化伦理意识，秉持科技向善、负责任研究和技术创新等理念，将其贯穿于企业文化与实践之中，发挥企业文化等企业非正式制度的规范效应，对企业的伦理价值观发挥积极正面影响；二是推进自身伦理制度建设，着力提升企业伦理治理制度的约束力和可行性，在数据安全、数据隐私保护等方面认真落实国家伦理监管政策[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)，以企业可持续发展作为长期导向；三是采用`PDCA`（计划－执行－检查－处理）循环质量管理模式，对数据标注流程、算法偏见校正等环节实施精细化管理，实时监控模型训练中的能耗和数据合规性指标，将伦理合规成本纳入项目预算，实现伦理与商业价值的平衡。\n\
    \n第五，社会公众作为市场反馈的提供者与伦理共识的维护者。大模型的广泛应用使公众越来越多地接触到由大模型生成的投资建议、风险评估等信息。社会公众既是大模型的最终用户和受益者，同时也是大模型的最终监管者。公众可以通过反映、投诉、举报等方式，对大模型的研发和利用进行监督。媒体可以发挥舆论监督的功能，对用大模型编造经济数据以骗取科研经费等违纪违规行为进行曝光，在社会上形成强大的舆论压力，促使企业及相关机构加强自律、规范发展，以维护学术科研诚信和公众利益。不仅如此，媒体还可以通过对大模型知识及伦理原则的普及，提高公众的监管意识，营造全社会重视并参与监管的舆论氛围。\n\
    \n#### (3) 监管阶段\n\n第一，数据收集与预处理阶段。开展数据收集工作必须严格遵循相关法律法规，对数据提供者说明数据使用目的、数据的范围及方式，获得其明确的授权。应严格控制数据收集的范围，遵循最小必要原则，收集与研究对象直接关联的、必要的信息，避免过度侵犯个人隐私和商业机密。对收集到的数据进行严格的清洗和预处理，剔除错误、重复以及具有主观偏见的数据。构建数据质量的评估机制，对数据的完整性、准确性、一致性等进行量化，保证符合质量标准的数据进入下一阶段。\n\
    \n第二，模型训练阶段。此阶段监管的关键应聚焦于算法和训练的过程。对于大模型中的经济预测类模型来说，如果算法训练过于侧重某几个行业的数据，可能会出现忽略其他相关行业或过度偏重对某些行业的分析等问题，从而使经济决策产生一定的偏差。应当对多种算法进行比较分析，并引入第三方算法审查机构，确保算法的可靠性。此外，要加强对训练过程的审查，避免训练过程中数据被泄露或大模型被不法分子恶意篡改。通过加密技术对大模型训练所使用的数据进行加密处理、对训练过程数据访问权限进行严格限制，保障数据训练的安全性。\n\
    \n第三，模型应用阶段。这一阶段的监管应重点关注大模型输出内容，通过严格抽检避免谣言的产生。建立大模型学术成果审查机制，组织相关领域专家学者审查含有AI辅助写作内容的论文、报告等，核实其内容的逻辑性、真实性，尤其是涉及经济政策建议、市场发展方向等的重要研究结论，要充分考察数据分析和逻辑推理能否支持研究结果。明确大模型应用过程中的责任主体，若大模型的应用导致虚假信息被大肆传播，给社会造成不良影响，应当依据监管政策对相应责任主体进行法律惩处和学术惩戒。\n\
    \n第四，模型更新与维护阶段。大模型需要持续更新与维护以适应经济环境的变化和知识的迭代进步。应当定期检查大模型是否存在漏洞或性能下降的情况，及时修补或淘汰；定期检验数据质量并清除异常数据，一旦完成了相关研究任务，必须严格依照合规程序及时销毁数据；定期考察大模型算法和逻辑是否符合前沿研究和最新数据，保证大模型具备良好的精确度。大模型的更新和维护还需要符合数据收集与模型训练的监管要求，可建立责任追溯的档案制度，确保技术演进与商业伦理同步发展。\n\
