    ## 3. 分步提问


    分步提问的核心目标是拆解复杂任务为“逻辑链+迭代环”。例如，研究某特定经济政策发布对股票市场收益率的影响，可以分为3个步骤，示例如下。


    第一步：运用事件研究法检验特定宏观经济政策发布对中国A股市场超额收益率的短期影响。


