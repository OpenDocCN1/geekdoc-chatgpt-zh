- raw: "学术研究的起源，可追溯至两类问题。一类是实践中遇到的问题或经验，它们关注实际事物与理论的契合度，探讨经验事实对理论的验证或反驳，以及理论对观察的渗透力。这类问题多源于经济管理实践中的科学探索，是科学研究的重要驱动力。另一类则是涉及理论层面、哲学层面的概念问题，它们关注理论自身的自洽性、洞察力、统一性以及与其他理论的相容性和竞争关系。\n\
    \n问题是研究的起点，经管学科的真问题，应具有明确的研究边界和前提假设，涉及客观事物的本质，具有创新性和价值性。在研究过程中，我们不仅要关注“做什么”，更要问“为什么要做”，即问题的提出必须反映现实世界中的紧迫挑战或理论上的关键争议。衡量研究问题是否真实而重要，可以从以下几个维度出发：一是受众的广泛程度，即有多少人关心这个问题；二是影响的深远程度，即它是否涉及众多群体的利益；三是时间的紧迫性，即该问题是否是当前急需解决的难题；四是信息增量的价值，即研究是否能带来实质性的新知识。理想的选题标准是“顶天立地”，“顶天”是指研究要有理论或概念上的突破和前进，“立地”是指无论做哪一个国家的研究，都要基于事实。\n\
    \n[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)\n\n此外，经济管理的研究选题不必过于追求“大题目”，而是强调“精、细、深”，即便是一个微观的现象，也可能折射出制度设计与激励机制的深层次问题，只要能提出有洞察力的问题并加以深入探究，就是有价值的研究。简言之，真问题不在于“大小”，而在于“真切”地反映现实。\n\
    \n寻找好的研究选题，一般来说有以下三种途径。\n\n第一，通过对社会事实的观察，发现有趣的和重要的事实或现象，进而寻找其背后的缘由。例如，平台经济的崛起催生了零工经济新业态，灵活就业为劳动力市场带来了深刻的变革，那么零工经济如何影响企业创业就成为一个不错的选题。\n\
    \n第二，在理论文献与经验世界之间反复穿梭，发现理论与事实有出入的情况，去寻找新的解释。例如，公地悲剧是1968年美国学者加勒特·哈丁(Garrett Hardin)提出来的经济学经典问题，是指因过度开发公共资源而造成的市场失灵，随着互联网和区块链技术的发展，出现了一些分布式网络模式，这些模式正在尝试应用新型机制设计解决公共地悲剧的难题。\n\
    \n第三，通过理论对话，梳理不同理论流派的冲突和争论，建立新的理论框架进行解释。可以通过阅读文献，对现有研究进行综述，寻找现有理论的软肋，在理论争辩中寻找新的学术见解，或是通过采集现实世界中的代表性数据开展实证研究，验证理论的适用性。\n\
    \n### 2.1.2 新见解：视角的重构\n\n好的研究还需针对研究问题提出新颖而有说服力的见解。新见解意味着相较于已有研究，要提出新的解释、新的视角、新的框架或新的发现，要求研究者既要对现有文献体系有扎实的掌握，也要具备跳出常规的思维能力，从而在“熟悉”的知识体系中发现新知识。\n\
    \n在经济管理领域，很多问题早已有大量研究成果，例如“企业创新受哪些因素影响”这个问题，已有组织结构、激励机制、产业政策等多种解释，然而，若研究者能从数据资产分配、算法权力结构等新维度切入，对传统框架做出修正或补充，就可能形成独特见解。又如，对于“农村儿童的学习效果为什么比较差”这个问题，有的学者认为是农村中小学的师资力量不够，有的认为是农村中小学硬件条件比较差，或者是农村中小学的教学手段比较落后等原因，但是斯坦福大学的罗思高(Scott\
    \ Rozelle)教授却认为农村学生的学习效果比较差的主要原因是营养不良和三岁之前养育的缺乏。这就是一个新颖的视角，以前从来没有人考虑过农村中小学学生的学习成绩与其营养水平以及三岁之前的养育有关系。依据罗思高教授的[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)见解，政府在改善农村办学条件的同时，应该提高农村学生的营养水平，并且重视农村学生三岁之前的养育问题。父母们也应该在小孩三岁之前提供其更好的营养、教育和更多的陪伴。这个新的见解，不仅会对教育公共服务的投入产生影响，而且还会影响农村父母对子女的养育行为。\n\
    \n值得强调的是，新见解不是凭空想象出来的，而是建立在深入熟悉文献与对问题有扎实的理解之上的创造性延伸。这要求研究者在精耕细作本领域的同时，适当引入跨学科的知识，如心理学、社会学、计算机科学等，丰富解释工具与思考框架。例如，在研究“人工智能对企业管理决策的影响”时，管理学的研究者若能结合技术伦理和人机协作等领域的理论，可能会提出比传统IT采纳理论更深入的解释。新见解的本质，在于基于熟悉的知识进行跨界思考，在共识中提出新的洞见。\n\
    \n### 2.1.3 严谨论证：结论的科学保障\n\n在科学研究中，再好的问题和再新的见解，如果缺乏严谨的论证，也难以令人信服。严谨论证不仅是验证结论是否成立的过程，更是研究者展示学术训练与科学精神的过程。经管学科尤其强调逻辑推演与经验验证并重，严谨论证是理论贡献“落地”的关键桥梁。\n\
    \n首先，从方法层面看，严谨的论证要求选择合适的研究设计，如实验、调查、案例、计量模型等，并明确变量设定、因果关系辨析、数据来源等基本逻辑。例如，在研究“高管薪酬结构是否影响企业创新”时，需要清晰界定“薪酬结构”和“创新产出”两个变量，并控制其他影响因素，如行业特征、企业规模等，通过严密的实证检验和因果分析，增强研究结论的说服力。\n\
    \n其次，从表达层面看，研究者还必须善于将论证过程条理清晰地呈现出来。这不仅涉及写作的结构安排，更关乎论证链条的完整性与连贯性。比如，在论文中清楚地说明研究动机、假设提出、方法选择、数据来源、实证结果以及结论推导，能体现出论证的系统性和逻辑性。\n\
    \n严谨论证需要长期积累，科学工具的使用与写作表达都可经刻意练习而精进，对于经济管理研究者来说，可以多阅读高质量文献，参与数据分析项目，与导师或同行交流，逐步培养严密的思维和清晰的表达能力。\n\
    \n### 2.1.4 三种研究类型及AI应用\n\n按照研究目的，科学研究可以分为探索性研究、描述性研究、解释性研究三大类型。三种研究类型都有不同层面的AI应用。\n\
    \n#### 1\\. 探索性研究中的AI应用\n\n探索性研究(Exploration Research[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh))是一种对所研究对象或问题进行初步了解，以获得初步印象和感性认识，为日后更为周密、深入的研究提供基础和方向的研究类型。使用这种类型的情况是，对某些研究问题缺乏前人研究经验，对各变量之间的关系也不大清楚，又缺乏理论根据。这种类型的研究有多种方式，例如参与观察、无结构式访问、个案分析等。\n\
