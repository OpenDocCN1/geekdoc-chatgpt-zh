    #### 2\. 学科深度——回归经济管理本质


    AI 技术是科研的手段，而非目的。正如显微镜之于生物学、望远镜之于天文学，任何先进技术都应当服务于学科理论的发展，而不是朝相反方向去。研究者需要时刻警惕“技术万能论”的误区，始终将经济管理理论作为研究的根基。例如，在金融学领域，虽然机器学习技术可预测股价，但资产定价理论（资本资产定价模型、Fama-French
    模型）仍是基石，AI 技术可以帮助我们更精准地预测“市场价格如何变动”，但只有经济理论才能解释“价格为什么这样变动”。在组织行为领域，大语言模型等 AI 工具确实能够通过模拟实验来弥补传统问卷调查方法的缺陷。但是，在探究领导力本质、组织文化形成等深层次问题时，人文视角的理论思考仍然具有不可替代的价值。技术手段可以拓宽我们的研究边界，但理论洞见才能揭示现象背后的本质规律。


