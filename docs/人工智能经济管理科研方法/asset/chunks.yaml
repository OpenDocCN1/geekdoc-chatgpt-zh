    Ensemble`)融合弱分类器，从而提升变量构建的稳健性。例如，在测量企业`ESG`（环境、社会与治理）信息披露质量时，研究者可以分别采用`SVM`、`BERT`和`CNN`三种判别式模型进行并行判别，通过加权融合其分类结果，减少单一模型偏差对变量构建的影响。与此同时，也可在判别式模型与经济计量模型之间建立协同机制，发挥其预测能力与因果推断能力的互补优势。


