    \ 使用边界指南 2.0》推荐四栏表模板。\n\n(3)作者对 AI 生成内容负全部责任(Author Responsibility)\n作者对稿件的全部内容负责，包括\
    \ AI 辅助生成的部分。AI 产生错误、虚假信息或抄袭等问题，责任均由署名作者承担。AI 是辅助工具，其输出内容必须经过作者的审阅、评估和编辑。\n\n\
    (4)限制 AI 的使用范围与程度(Limited Scope of Use)\n部分期刊限制 AI 介入的深度，可能仅允许其用于语言润色、语法校对等支持性工作，严禁用于核心学术创作，如提出原创假设、设计实验、进行复杂数据分析、推导结论或撰写主要论证部分。例如，The\
    \ Lancet 将其使用限制在语言润色；Blood 允许 AI 绘制图表，但禁止其生成正文；Elsevier 的政策强调 AI 不能用于完成关键的学术任务；《学术出版中\
    \ AIGC 使用边界指南 2.0》禁止 AI 生成研究假设、核心模型与结论；OM 七刊联盟则禁止 AI 生成或篡改图表。原创思想、学术判断等核心智力贡献必须由研究者完成。\n\
    \n综上，当前中英文主流学术期刊的规范要点可归纳为：“不署名、要披露、慎使用、人负责。”这是全球科研人员合规使用 AI 的基本准则。\n\n### 8.1.2\
    \ 大模型辅助写作的“四原则”\n\n在学术写作中规范使用大模型，既是对科研诚信的坚守，也是适配期刊政策、规避学术风险的核心要求。结合全球顶级期刊的政策导向与学术伦理的底层逻辑，可提炼出大模型辅助写作的“四原则”，为科研人员提供明确的行为框架。\n\
    \n#### 1.审慎原则\n批判性评估 AI 的输出，警惕其固有缺陷。应将 AI 生成的内容视为“半成品”，其正确性有待考证。宁缺毋滥，不轻易采纳 AI\
    \ 的结论。审慎原则要求我们树立两种意识：一是避免过度依赖的意识，AI 不能替代研究者的深度思考、独立判断和批判性分析能力，若产生不健康的依赖，应及时调整，回[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)归研究本身；二是风险意识，在采信\
    \ AI 输出内容前，应自问其潜在后果，并决定是否以及如何进行验证，AI 有时会“自信地”犯错，可将 AI 视为一位“勤奋但容易出错的实习生”。\n\n####\
    \ 2.披露原则\nAI 的使用情况进行全面、准确的内外声明，一是对内透明，研究团队内部应公开共享 AI 的使用情况，共同把关；二是对外透明，严格按照期刊、机构的要求，在指定位置清晰、准确地披露\
    \ AI 的使用情况，包括工具名称、版本、开发者、访问日期、具体用途和贡献程度等。\n\n#### 3.人审原则\n人类作者对 AI 生成的内容进行最终审核并承担全部责任，人类作者始终是研究的最终负责人和质量的最后把关者。AI\
    \ 输出的所有内容都必须经过作者逐字逐句地审阅、验证和批判性评估。人审原则的核心要求包括：事实核查、逻辑与语义审查、原创性保障、一致性检验、学术价值判断。牢记“作者是第一责任人”，不能将未经核实和判断的\
    \ AI 生成物呈现给读者。在 AI 介入的每一个环节之后，都应安排人工校对和审核。\n\n#### 4.合规原则\n确保 AI 的使用符合所有相关学术规范、法律法规及伦理要求。一是遵守学术出版规范，不越过目标期刊关于\
    \ AI 使用的红线（如不将 AI 列为作者、不将 AI 用于核心环节、按规定披露等），隐瞒或虚假声明 AI 使用情况可能导致严重后果。二是坚守学术诚信底线，不利用\
    \ AI 规避原创性要求或从事学术不端行为（如“洗稿”式剽窃），确保 AI 生成的内容不侵犯他人知识产权。三是遵循法律法规与数据合规要求，注意 AI 工具的使用条款和隐私政策。在处理敏感数据时，遵守数据保护法规（如\
    \ GDPR、欧盟《人工智能法案》 《中华人民共和国个人信息保护法》等），数据上传前应进行脱敏处理，生成的内容应可追溯并予以适当标注。四是践行科研伦理道德，禁止利用\
    \ AI 生成和传播歧视性、虚假或恶意内容。关注并努力消除 AI 算法可能带来的偏见，合规原则要求研究者以权威指南（如 COPE 指南、中国科研诚信相关文件）、法律法规和伦理准则为镜鉴，规避潜在的越界风险。\n\
