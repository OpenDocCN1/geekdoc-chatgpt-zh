    ③编辑部的政策。经管期刊编辑部对 AI 的使用保持高度警惕和谨慎态度。例如，`Academy of Management Journal`在其社论中对利用
    AI 伪造数据或歪曲研究发现等“深度科研造假”(Deep Research Fakes)行为的风险发出了预警。尽管公开报道中尚未出现发表于`FT50`或`UTD24`期刊的论文因不当使用`ChatGPT`等工具而被撤稿的案例，但编辑们普遍已通过投稿须知等方式提醒作者“AI
    工具的使用需遵循出版伦理，严禁不当代写”。


