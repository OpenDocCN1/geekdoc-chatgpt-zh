    ## 知识偏见对经管学科理论发展的威胁

    知识偏见对经管学科理论发展的威胁在于其可能重构学术研究的“认知基线”。基于AI生成的文献综述更倾向于采用主流范式的理论脉络，而较少采纳非主流学派或批判性研究的理论。例如，在分析数字经济对收入分配的影响时，AI若过度依赖新古典经济学框架下的实证研究，可能忽视马克思主义政治经济学中关于技术垄断与阶级分化的理论视角，导致文献归纳的片面性。更深远的影响在于，AI驱动的理论创新可能陷入“路径依赖陷阱”。当研究者利用大模型进行理论推演时，系统常基于现有学术共同体的共识提供优化方案，但重大理论突破往往源于对既有范式的质疑与重构。若AI工具默认将高被引论文观点作为“正确”的标准，可能压制学术创新，使经管学科的知识生产趋于保守化。


