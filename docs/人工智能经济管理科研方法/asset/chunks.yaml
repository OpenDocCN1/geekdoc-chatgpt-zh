    \n#### (3) AI时代的新型引注规范\n\n第一，明确标注信息来源，正确披露AI生成内容。在人工智能时代，市场环境瞬息万变，数据的时效性十分重要。大模型时代的经管科研对研究过程的透明性提出了更高要求，不仅要明确标注数据和信息的来源，而且要对AI生成内容进行正确披露和声明，这也是保障研究成果真实性的基本准则。`Elsevier`出版机构明确要求作者投稿时披露人工智能的使用情况，包括所使用的人工智能工具名称、使用目的以及其监督程度。\n\
