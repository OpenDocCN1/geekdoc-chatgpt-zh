    \ AI 的过程中需要以学术诚信为底线，规避技术应用中的合规风险，推动 AI 成为“负责任的学术助手”。\n\n### 10.4.1 学术规范保障\n\n\
    学术规范的保障不仅依赖于上述各类监管主体在不同阶段的协同，还需要借助先进的 AI 检测平台。AI 检测平台能够对学术成果中是否使用了大模型生成内容进行精准识别，判断其使用是否符合学术伦理和规范。\n\
    \n#### 1. AI 时代学术规范的内涵\n\n学术规范是指学术共同体根据学术发展规律，参与制定的有关各方共同遵守的、有利于学术积累和创新的规则和要求，是整个学术共同体在长期学术活动中的经验总结和概括。中华人民共和国科学技术部监督与诚信建设司\
    \ 2023 年 12 月编制印发了《负责任研究行为规范指引(2023)》，其中对研究选题与实施、数据管理、文献引用、成果署名、同行评议、成果发表等环节进行了约定，主要包括：科研活动中，申报材料禁用生成式模型；研究实施中可依规限用，禁止伪造、篡改数据；AI\
    \ 生成内容需标注、确保真实，研究者应尊重知识产权，谨慎引用；禁止将 AI 列为成果共同完成人，需披露使用细节；出版单位、审稿人及评议活动均需规范使用 AI，防止信息泄露等。\n\
    \n#### 2. AI 时代的学术规范保障方式\n\n"
