    \n#### 4. “科创板IPO审核问询函分析”研究案例\n某研究团队通过分析科创板IPO审核问询函，探究监管机构关注重点与企业信息披露质量的关系。研究团队基于采集的487份审核问询函的全文，通过人工标注“核心技术”“关联交易”“知识产权”等15个类别，构建专业的领域词典，整合《上海证券交易所科创板股票上市规则》等监管文件术语，从而完成文本预处理。然后采用层次化`BERT`模型：第一层识别问询类型（业务/法律/财务），第二层细分具体问题；通过引入对比学习，以增强相似问询句的聚类效果（如不同企业的研发投入问询），从而完成研究模型设计。研究发现：模型准确率达89.7%（`F1`值），较传统`SVM`方法提升42%\
