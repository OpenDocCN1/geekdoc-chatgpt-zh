- raw: '2022年11月30日，美国科技公司OpenAI推出大型语言系统ChatGPT，这宣告人工智能时代真正到来，也使得虚假信息问题在AI技术的推动下呈现爆发式增长。由世界经济论坛发布的《2024年全球风险报告》中将虚假信息和误导性信息列为全球第一大风险。人工智能模型的普遍应用促使虚假信息数量增加，传播速度加快，并且其高度逼真的特性显著提升了辨识与辟谣的难度。仅需简单的操作界面即可与大规模人工智能模型相连接，生成大量虚假信息和所谓的“合成”内容，因此，为防止虚假信息对学术科研领域造成污染，在使用AI的过程中能够有效甄别虚假信息显得尤为重要。


    #### 1.人工智能生成虚假信息的表现形式


    人工智能生成虚假信息的典型表现形式主要包括机器欺骗(Machine Deception)和机器幻觉(Machine Hallucination)。


    (1)机器欺骗


    机器欺骗是指人工智能有意或无意地让人类或其他系统形成错误的信念或判断。这可能隐含开发者或使用者的操控意图，也可能是系统自主学会的行为。其在经管学科中典型的表现形式包括生产误导性财务分析，夸大某一公司的盈利能力或隐瞒其风险因素；强化市场偏见或主流叙事，影响用户的自主判断；在企业伦理、管理哲学、组织文化等问题上，强化某一意识形态而非提供多元视角，潜在地影响企业管理者的战略选择。


    2023年5月，爱尔兰主流媒体《爱尔兰时报》因刊登一篇由AI生成的争议[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)性文章而陷入一场舆论风波。这篇题为《爱尔兰女性对人工美黑的痴迷很成问题》的文章，署名为虚构的厄瓜多尔籍医护人员“阿德里安娜·阿科斯塔-科尔特斯”，内容指责爱尔兰女性通过美黑“文化挪用”少数族裔特征，迅速成为当日点击量第二的文章。后经揭露，该文章80%内容由GPT-4生成，作者头像则是通过DALL-E
    2生成的。报社最终删除文章并公开道歉，承认审核流程存在漏洞，也暴露了AI生成内容对新闻真实性和公信力的威胁。


    (2)机器幻觉


    机器幻觉是指人工智能系统，尤其是生成式模型（如ChatGPT、图像生成模型、语音生成模型等），生成的貌似合理连贯，但同用户输入指令不一致、与事实相悖，或根本无法验证的内容[^(18)](#fn18)


    2023年6月，美国纽约南区联邦地区法院法官凯文·卡斯特尔(Kevin Castel)在审理莱维多律师事务所(Levido Law Firm)代理的一起航空人身伤害赔偿案时，发现涉事律师史蒂文·施瓦茨(Steven
    Schwartz)与彼得·洛杜卡(Peter LoDuca)提交的6份关键法律案例文件存在严重问题。经核查，这些标注出自《联邦判例汇编》《美国法律报告》等权威文献的案例，实则是ChatGPT生成的虚构内容。法官在裁决书中指出，这些由AI生成的文书不仅伪造案件名称、引用编号，甚至编造了根本不存在的法律原则。法庭最终对两名律师处以5000美元罚款，并驳回其代理诉讼，同时将该事件交予律师纪律委员会调查。此案成为全球首例因使用生成式模型虚构法律依据而遭到司法惩戒的典型案例。


    #### 2.人工智能虚假信息的风险


    随着ChatGPT、Claude等人工智能工具在学术领域中的广泛应用，科研工作者,尤其是经管研究者，越来越多地借助AI进行论文写作、数据分析、理[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)论总结和文献综述等工作。这极大地提升了科研效率，也拓展了学术创作的边界。德国蒂宾根大学数据科学家德米特里·科巴克(Dmitry
    Kobak)领导的团队分析了学术数据库PubMed中发表于2010年至2024年6月的1400万篇论文的摘要。他们估计，2024年上半年至少有10%的生物医学论文摘要（约7.5万篇）使用了大模型进行写作，以大模型为基础的写作“助理”的出现，对学术界产生了前所未有的影响。


    然而，随之而来的另一个重要问题逐渐凸显——AI生成的内容中可能包含虚假信息。Guastafierro等人在Virchows Archiv发表的研究显示，AI生成的参考文献中30%存在事实性错误，其中12.1%的文献不准确，17.8%的文献则是虚构的。这些虚假信息会对学术研究造成误导，研究者在进行论文写作时可能误信模型生成的虚假参考文献，引用这类“文献”可能被视为剽窃、编造、篡改等学术不端行为。进而严重损害研究者的学术声誉，影响职业前景。此外，如若这些建立在错误数据上的研究结论未经查验就公布到学术数据库中，将会对学术研究、政策建议、企业战略等实际应用领域产生负面影响。Jutta
    Haider等人在《错误信息评论》中发表的研究表明，通过分析在谷歌学术上检索到的一些带有使用GPT痕迹的科学论文样本，他们发现，大约三分之二的论文存在人工智能虚假信息且没有披露。在进行学术写作时过度依赖AI工具、忽视事实核查，也反映出研究人员科研伦理意识的淡薄。


    为此，施普林格·自然(Springer Nature)持续开发更有效的工具来应对这一挑战，在经过成功试点之后，于2024年6月13日宣布正式推出一款定制的由AI驱动的工具Geppetto。


    Geppetto是施普林格·自然与Slimmer AI的科学部门合作开发的。该工具专门用于处理存在AI生成内容的稿件，帮助编辑和审稿人识别并筛除虚假、误导性或被操纵的内容。Geppetto在运作时，会将论文分成若干部分，并使用自己的算法来检查每个部分的文本，然后根据文本由AI生成的概率，给出各个部分的分数，分数越高，存在问题的概率就越高，随后施普林格·自然工作人员会进行人工检查。自2023年11月启动以来，Geppetto
    已被施普林格·自然科研诚信小组应用于预筛大部分的图书和期刊投稿。通过在早期发现潜在问题稿件，Geppetto 减少了后期撤稿的情况，也大大减轻了编辑人工检查的工作负担。


    #### 3.人工智能虚假信息的成因分析


    生成式人工智能的快速发展得益于数据、算法和算力三大关键要素的协同作用，其内容输出遵循“数据收集－数据处理－模型训练－算法微调－内容生成－反馈优化”的基本流程。尽管智能算法的运行本质上是基于数据训练输出内容的过程，但生成的内容往往是通过对数据特征的提取和[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)重组，创作出的具有独特性和异质性的新信息（漆晨航，2024）。因此，这项技术在本质上存在生成虚假信息的潜在风险。我们可以从以下3个阶段出发，分析人工智能生成虚假信息的原因。


    (1)数据输入阶段：失真数据埋下虚假信息的种子


    海量数据预训练为生成式人工智能技术触发虚假信息提供了“天然的胚胎环境”（邓宏光，2025）。大模型的开发者必须依赖于互联网上公开的训练数据，但是这些数据的质量存在显著差异，其真实性和及时性难以确定，数据来源的完整性与有效性无法得到保障。此外，大模型技术本身无法对源头数据进行真假辨别，加上理解能力有限、模型架构存在缺陷等，在实际应用中，其输出内容经过重构，可能看似严谨合理，实际上却与事实或逻辑不符，出现“一本正经地说假话”现象（王翠娟，2025）。如若生成的虚假信息在公众平台上被广泛传播，将会进一步加剧社会信任危机，损害公众对人工智能技术的信任度。因此，我们可以认为虚假信息本身和大模型生成虚假信息这一现象互为因果（刘高含，2024）。


    (2)模型运算阶段：技术偏差促使虚假信息扩散


    AI“解码－运算－调试”的技术机理本身忽略了调查信息的真实性与可靠性，所以极易“主动”生成或“被动”训练出虚假信息（何宇华，2024）。人工智能模型在处理检索数据时，可能会受到无关或干扰信息的误导，导致对相关信息的误解或曲解，甚至可能无法有效识别检索数据中的错误信息，从而生成包含事实性错误的内容。而模型推理过程则会受到“滚雪球效应”或“暴露偏差”的影响。滚雪球效应指的是初始的小错误或偏差随着内容的不断生成而被放大，最终造成严重的信息偏差。由于模型的数据训练主要是对数据的模仿而非真正理解，因此其难以避免“一本正经胡说八道”的问题（陈天佑，2024）。训练集来源不真实、模型错误理解提示内容或者以错误的前提展开生成，均容易导致偏见的强化以及虚假信息的指数级扩散。暴露偏差是指模型在训练过程中频繁接触某类内容，便会倾向于生成相似的内容，即使这些内容不是最符合事实或最具相关性的。


    (3)输出结果阶段：用户导向下的虚假信息再生产


    一方面，人工智能模型往往以用户满意度作为优化目标，这导致其倾向于提供“用户想听的答案”而非真实答案。为了提高满意度，它可能编造看似合理但实际无价值，甚至虚假有害的信息。此外，大模型尚未将诚信原则嵌入核心架构中，因此模型可能倾向于“高效达成目标”而非“正确”。由于大模型的生成机制依赖于对人类指令的理解与模仿，本身不具备判断内容真伪的能力，而虚假信息往往因触及热点或善于博取眼球被算法优先推送，因此，虚假信息的出现频率往往不低。尽管人工智能可以通过强化学习进一步优化对用户指令的理解和响应，但优化仍主要针对指令意图，而非内容真实性。另一方面，人工智能在一定程度上替代了搜[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)索引擎，能通过处理和筛选内容影响人类的价值判断与意识形态，使人们无意识地接受人工智能的规训，影响人们获取信息的方式，弱化对虚假信息的判断和识别能力（代金平，2023）。


    ### 10.2.2 数据泄露与知识产权


