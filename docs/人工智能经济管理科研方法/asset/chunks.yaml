    \n## 7.1 AI+质性研究\n\n质性研究(Qualitative Research)也被译为质化研究、定质研究，它是社会科学研究中的一类重要方法，是与量化研究相对的学术研究范式。质性研究主要是以研究者本人作为研究工具，在自然情境下采用多种资料收集方法，对社会现象进行整体性探究，主要使用归纳法分析资料和形成理论，通过与研究对象互动对其行为和意义建构获得解释性理解的一种活动[^(12)](#fn12)\n\
    \n随着机器学习（尤其是深度学习）的突破，以及在此基础上发展出的大语言模型，自然语言处理领域取得革命性进展。AI 凭借其强大的文本处理、模式识别与知识生成能力，为质性研究注入全新的变革动能，人机协同成为质性研究新范式。\n"
  trans: "\n\nAI 还能够识别哪类特征在何种场景下对预测更具有信息含量，为研究者的后续建模提供数据驱动的见解。以注意力机制、可解释神经网络、变量重要性排序等方法为代表，研究者不仅能识别“哪些变量相关”，还可洞察“哪些特征在何种情境中主导了预测结果”。这些信息为理论建构、变量选择与机制假设的提出提供了实证支持，提升了模型结果的透明度与可操作性。\n\
    \n如图 6.2 所示，在视觉层面，通过生成热力图，我们可以直观地看到模型重点关注了图像的哪些区域，例如，它可能聚焦于主播的面部以[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)捕捉其情绪，或是服装的关键设计细节（如胸前的蝴蝶结）；在文本和数值层面，类似`SHAP`值等事后解释方法可以量化每个输入特征的贡献度，从而识别出“马上过款”“拼手速”这类带有强烈紧迫感的营销词汇是驱动预测的关键因素。通过结合分析这些来自不同模态数据的高贡献特征，我们不仅能验证模型的决策逻辑是否符合业务常识，还能深入洞察其成功的内在机制，为后续的理论机制识别提供可靠的依据。\n\
    \n## 6.3.2 AI 驱动的因果关系研究\n\n因果推断是解释性实证研究的核心目标，也是最具挑战性的部分。与描述性或相关性研究不同，因果研究要求明确识别某一变量变动是否真实引起另一变量的变化，从而支持机制推理、理论验证与政策推断。然而，在经管实践中，因果推断常常受到内生性问题、反事实难以观测、高维混淆因素难以控制等限制。AI\
    \ 技术的引入，特别是在因果推断建模、高维控制变量处理以及反事实模拟等方面，为因果关系研究提供了新的工具与路径。\n\n### 1. AI 助力内生性问题处理与多维因果路径识别\n\
    \n内生性问题是经管实证研究的核心挑战。工具变量法依赖于理论假设与有限的工具变量可得性，而 AI 可从大数据中挖掘潜在的工具变量或构建“准实验”环境。例如，阿西(Athey)等人采用随机森林方法，在条件独立假设下估计异质化处理效应，实现了准自然实验条件下的内生性控制。此外，一些研究通过深度学习提取文本、图像、语音等非结构化数据中的外生变异成分，作为工具变量来源，从而突破了传统数据限制。研究结果表明，在组织管理领域，机器学习技术可以作为从大规模数据中构建理论的工具。\n\
    \nAI 可以作为传统因果推断的有效补充，提升识别力与适用性。在处理非线性、多维度的因果路径时，研究者可将人工智能方法嵌入到经典识别框架中。例如，在工具变量法中，研究者可以采用深度工具变量模型，通过神经网络估计工具变量对内生解释变量的影响，再用另一神经网络建模该解释变量对结果变量的响应函数，从而识别非线性或高阶交互下的因果效应。在倾向得分匹配中，传统逻辑回归方法难以准确估计高维协变量空间中的匹配概率，而基于梯度提升树或深度神经网络的高维倾向得分算法可以提高匹配精度，使得处理组与对照组之间更具可比性。在经济政策评估中，双重机器学习等算法可将因果效应估计与高维协变量控制解耦，在降低模型偏误的同时保持因果推断的鲁棒性。\n\
    \n### 2. AI 助力样本匹配与因果结构发现\n\n在因果关系研究中，传统计量经济学常用样本匹配、双重差分等方法进行因果推断。虽然 AI 不能直接揭示因果关系，但是它可以采[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)用灵活的算法实施降维，解决高维问题或“维数灾难”，通过准确估计反事实和处理效应，帮助精准识别与测度因果效应，从而助力因果推断。以样本匹配法为例，其主要思路是针对处理组个体，在控制组中寻找特征尽可能相似的个体，与处理组个体进行匹配，运用控制组个体的结果估计处理组个体的反事实结果。传统的样本匹配法包括协变量匹配法和倾向得分匹配法。协变量匹配法，顾名思义就是直接根据协变量，在处理组和控制组中进行一对一或一对多近邻匹配。然而，上述方法仅适用于协变量较少的情况。如果协变量较多，则可能会在高维空间遇到数据稀疏问题，很难进行匹配。由此，罗森鲍姆(Rosenbaum)和鲁宾(Rubin)提出了倾向得分匹配法，它是指将高维协变量整合为一个倾向得分后再进行匹配。这样，无须对所有协变量进行匹配，极大降低了偏误。但是，倾向得分匹配法也不是完美的，因为这种方法是采用已知且相对于样本量较小的协变量，无法适用于协变量数量远大于样本数量的情形。\n\
    \nAI 有助于解决上述传统匹配法在高维空间上遇到的问题，已有学者运用神经网络、`SVM`、分类与回归树(`Classification  and  Regression\
    \ Tree`，`CART`)、提升法等机器学习算法，在高维协变量数据情形下估计倾向得分，并将其作为传统逻辑回归的替代。例如，阿里尔·林登(Ariel Linden)和保罗·R·亚诺尔德(Paul\
    \ R.Yarnold)直接使用最优判别分析(`Optimal Discriminant  Analysis`)的机器学习方法，按照协变量分布区分研究小组。该方法不仅可以确定个人如何根据协变量的最优切点进行自我选择，而且对偏斜数据和异常值不敏感。它克服了传统方法的诸多缺陷，可以作为评估匹配研究中协变量平衡的传统方法的有力补充或替代方法。卡里姆(Karim\
    \ M E)等比较了高维倾向得分算法、机器学习算法（如随机森林和弹性网）和混合方法（前两者的结合）在高维协变量空间中识别和选择混淆因素的能力。这一研究发现，在大多数情况下机器学习算法与高维倾向得分算法的表现一致，甚至更好，而混合方法则表现最好。\n\
    \nAI 还能够参与因果结构的发现与机制变量的构建，特别适用于理论机制尚不明确、路径结构复杂的研究场景。在组织行为、消费者心理、市场认知等研究中，研究者常面临中介变量难以观测或机制路径不清晰的问题。借助大型语言模型与语义生成能力，研究者可以基于观察数据和情境设定，引导模型生成可能的中介机制或调节路径。例如，输入“以下是企业发布的一项裁员计划的公告，请说明该信息可能如何影响员工行为”，模型可生成“员工对企业前景产生不确定预期，进而出现离职倾向”，据此提炼出“未来预期”与“心理不安”等潜在机制变量，并用于建模中介路径。此外，模型还可用于生成对比性文本（如不同表述策略的公告），辅助研究者设计实验或准实验条件。\n\
    \n### 3. AI 助力异质性处理效应与反事实模拟分析\n\n[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)tent\"\
    >因果推断领域的一个重要分支是研究处理效应在不同样本中的异质性。传统方法常常采用在回归模型中加入协变量与处理变量的交互项来估计异质性处理效应。然而，该方法只能在协变量数量有限的情况下得到异质性处理效应的一致估计。若协变量数量很多，则一方面无法判断到底哪些是重要的协变量，另一方面不能在模型中无限添加交互项。这样，交互项的设定非常困难，很可能具有很强的主观性，甚至随意性。运用“数据驱动”的\
    \ AI 算法，有利于在高维协变量空间解决上述问题。例如，阿西和因本斯根据回归树方法提出因果树方法，估计异质性处理效应，从而进行因果推断。因果树方法首先对协变量空间进行划分，然后在子空间内计算处理组与控制组的平均差异求得平均处理效应，最后比较不同子空间的平均处理效应得到异质性处理效应。虽然这一方法可以通过交叉验证避免过拟合问题，但因果树的结构存在一定随意性，可能产生有偏估计。因此，韦杰和阿西提出了一种基于随机森林的因果森林方法。该方法首先构建一个包含许多因果树的因果森林，然后在每一棵树上根据阿西和因本斯的方法进行计算，最后对这些因果树的计算结果进行平均，即可估计出异质性处理效应。这一研究显示，因果森林对于真实处理效应具有逐点一致性，并且具有渐近高斯和中心抽样分布等性质。莱希纳提出了修正因果森林(`Modified\
    \ Causal Forest`)，已被灵活运用于会计财务领域的最新研究之中。因此，学者们认为，采用基于随机森林的因果森林、修正因果森林和广义随机森林来估计异质性处理效应是机器学习算法帮助研究者有效进行因果推断的重要策略。\n\
    \n如何运用 AI 算法精准构建反事实结果以做出有效的政策评价，是当前因果推断领域需要重点关注的研究议题。中国特有的文化基因提倡基于道德规范与社会舆论的监管模式，更加要求上市公司注重和满足外部利益相关者的诉求。中国具有独特的资本市场，政府在经济运行中发挥着重要的宏观调控作用。国有企业，作为中国资本市场价值创造的重要载体，存在双重委托代理关系。这些因素影响上市公司的治理目标、治理结构和治理模式。基于这些中国情境，中国学者可以围绕上市公司的治理目标、治理结构、治理能力、治理模式、治理效果、创新行为和创新绩效等内容，构建大数据库，尝试研究“中国上市公司如何构建高质量的治理结构？”等问题。需要指出的是，这些研究问题通常涉及海量、高维、高频和非结构化的数据，传统方法无法从中提取有效信息，也常因假设条件过于苛刻而难以开展有效研究。因此，亟需在管理学研究中引入机器学习算法，拓展传统方法适用边界、增强样本匹配随机性和提升反事实结果预测精准度。\n\
    \n生成式模型支持反事实模拟与多场景因果推断，为无法观测的对照情境提供了建模支持。在因果推断中，核心问题是“若未接受某处理，结果会如何”，而真实数据中仅观察到“事实路径”。此时，研究者可利用生成式模型模拟反事实情境，如输入“若该企业未发布此负面信息，投资者的判[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)断将如何变化”，模型输出可能的行为反应，用于构建“反事实差异”变量。这一方式尤其适用于语言行为、认知决策等难以通过外部操控获得对照组的情境，如研究企业表达方式对市场反应的影响、领导者语言风格对员工信任的影响等。\n\
    \n值得注意的是，AI 驱动的因果建模亦需注意其局限性。尽管深度学习方法可以处理非线性关系与高维数据，但其不具备自动识别因果方向的能力。因果推断仍需依赖理论设定、研究设计与识别策略的合理性，AI\
    \ 能力更多体现在辅助识别、机制构造与反事实推理之中。此外，生成式模型所构建的机制路径仍需结合实际理论框架进行审查与筛选，避免因模型拟合误差或语义泛化产生不合理解释。\n\
    \n因此，AI 在因果关系研究中的价值，不在于替代因果推断的逻辑基础，而在于通过高维建模、变量生成与模拟推理的能力，扩展因果研究的边界、提升识别策略的适用性，并为机制解释提供新的技术路径。表\
    \ 6.3 对 AI 方法如何解决传统方法的局限进行了梳理。在理论与设计逻辑的指导下，人工智能可以成为因果实证研究中的重要协作工具。\n\n表 6.3　传统方法与\
    \ AI 方法在因果推断中的比较\n\n![](img/CB_3300196873_56EAHk6UO7DW6Lt6TK3LM6jt3Xe3fp3TU31P3PQ6TM6TF3UM30b6TM3UL3UJ3TZ6cP3Hy42v5Lcabac4.jpg)\\\
    [https://t.me/+WwC4dCWvXRdhOTNh\\] © 未经授权禁止转载 [获取更多电子书：https://t.me/+WwC4dCWvXRdhOTNh](https://t.me/+WwC4dCWvXRdhOTNh)\
    \  | ID：EPUB\\_20260428160408 \n\n## 6.4 AI+预测性实证研究\n\n预测性实证研究是经管学科的重要组成部分，旨在利用历史数据对未来的经济、管理或市场行为进行系统预判，为战略制定、风险控制、政策调整等提供量化依据。与解释性研究关注“为什么”不同，预测性研究更侧重于“将会发生什么”，强调模型对未来状态的拟合能力与泛化能力。\n\
    \n在传统方法中，预测性研究多采用时间序列分析、回归模型、主成分分析等手段，对结构化数据进行趋势外推或分类判别。然而，现实中经管数据日益呈现非结构化、多源异质、非线性交互等特征，导致传统模型面临预测精度不高、变量信息利用不足的问题。人工智能的发展，尤其在特征学习、非线性拟合和多模态数据处理方面，使预测模型的性能显著提升。当前的研究趋势正呈现出两个方向：一是将\
    \ AI 与传统模型融合，兼顾预测精度与理论解释性；二是构建原生的、端到端的智能预测系统，实现数据驱动的高维推理与决策。本节将分别展开讨论。\n\n###\
    \ 6.4.1 AI 与传统预测模型的融合\n\n将 AI 与传统预测模型进行融合，旨在发挥双方优势，在保持模型结构清晰、理论解释性强的前提下，引入 AI\
    \ 的非线性建模与高维数据处理能力，提升整体预测效果。这类融合方法适用于既希望利用 AI 增强预测性能，又希望保留变量解释性与稳健性的研究场景，广泛应用于财务风险预警、市场趋势预测、信用评级建模等领域。\n\
    \n一种常见的融合方式是在特征工程阶段引入 AI，利用人工智能模型从非结构化数据中提取信息变量，再输入传统模型进行预测分析。例如，在企业违约风险预测中，研究者可先使用自然语言处理模型对企业年报或公告中的文本进行情感倾向分析、风险表达强度测量、管理层信号提取等操作，构建相应文本变量，作为补充输入变量引入逻辑回归模型或`Probit`模型中。这种方式通过\
    \ AI 扩展了特征空间，但保留了模型的解释路径。\n\n另一种方式是在预测阶段引入 AI 模型拟合残差结构，即先用传统模型建模主要趋势后，对其残差部分采用\
    \ AI 进行二次拟合。例如，在使用自回归移动平均模型(`ARIMA`)预测宏观经济指标后，残差部分常存在结构性非线性波动，此时可使用神[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)经网络对残差序列建模，提升整体拟合精度。这种“线性+非线性”组合的双阶段建模路径在时间序列预测中效果尤为显著。\n\
    \n此外，还可采用模型集成方式，将多个模型预测结果进行组合以提升稳定性与泛化能力。典型方法包括：线性回归与随机森林的加权融合、神经网络与支持向量回归的结果投票、通过元学习方法构建二级模型对多个初级模型的输出进行再学习。这种方法可综合多模型视角，减少模型偏误，提高对复杂系统行为的预测能力。\n\
    \n该类融合路径在多个经管应用中已显示出良好效果。例如，在企业破产预警中，研究者结合财务比率、企业治理结构变量与 AI 提取的文本信息，显著提高了预警准确率；在信用评级建模中，通过整合企业财务数据与新闻情绪特征，构建出的组合模型在预测违约风险时表现优于单一模型；在消费者信用评分系统中，融合社交网络行为变量与传统资产负债信息，也提升了模型的解释性与预测性。\n\
    \n尽管 AI 与传统模型融合能显著提升预测性能，但也存在一些挑战。一方面，如何合理分配模型权重、协调不同模型的误差结构仍需精细设计；另一方面，集成模型的复杂性提高了模型可复现性与解释性的技术门槛。此外，融合模型的稳健性检验与超参数选择也需借助交叉验证等手段加以强化。因此，在实际操作中，融合方案应根据研究目的、数据类型与所需解释程度灵活选择。\n\
    \n### 6.4.2 AI 驱动的新型预测模型构建\n\n在融合式建模之外，人工智能也推动了预测性实证研究从传统建模范式向“端到端”智能预测系统的演进。所谓端到端建模，指的是模型不再依赖人工设定的特征选择或结构设定，而是通过深度学习等方法，直接从原始数据出发，自动提取表示、进行表征学习、完成预测任务。这一方法特别适用于变量结构复杂、数据模态多样、非线性关系显著的经管研究情境，如消费者行为预测、企业财务表现预测、市场舆情走势判断等。\n\
    \n首先，AI 驱动的预测模型以表征学习为核心，实现对原始输入数据的自动特征抽取。以文本数据为例，大型语言模型（如`BERT`、`T5`）可以从企业公告、评论文本、分析师研报等语料中提取深层语义表示，用于预测如股票价格变动、投资者情绪波动等目标变量。与传统基于人工词典或主题分类的文本处理方式相比，表征学习具备更强的上下文理解与抽象能力，能够捕捉语义线索中隐含的信号。\n\
    \n其次，AI 支持多模态数据融合建模，使得结构化数据与非结构化数据可以在同一预测模型中协同输入、共同训练。在企业经营预测中，研究者可以将财务报表数据与管理层发言文本、社交媒体评论、行业舆情图像等多源数据一并输入模型。通过`GNN`、跨模态嵌入网络或融合`Transformer`结构，模型可同时处理数值型、文本型与图像型信息，从而在预测企业绩效、市场表现或消费者反应时获得更高的信[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)息覆盖率与泛化能力。\n\
    \n再次，AI 还推动了任务导向的动态建模结构设计，以适应经管系统中变量变化频繁、时序依赖性强的特征。例如，在消费者复购预测、产品需求预测、金融市场波动预测等场景中，研究者常使用序列建模技术（如\
    \ `LSTM`、`Transformer`、`Temporal Fusion Transformer`）对历史行为序列建模，自动识别关键时间节点与预测信号。这类模型通过“时间感知”机制学习变量的时序动态，有效提升对趋势、突变与反转的响应能力。\n\
    \n此外，尽管 AI 驱动的新型预测模型在性能上通常优于传统方法，但可解释性问题依然是学术研究与管理实践中的关键关注点。近年来，为缓解“黑箱模型”的透明度问题，研究者引入了可解释人工智能方法，如\
    \ `SHAP`值、注意力权重可视化、特征贡献分解等，用于识别哪些变量或时间段在预测中发挥了关键作用。例如，在对企业经营风险进行预测时，模型可以输出“文本中涉及供应链风险的词句贡献最大”“第二季度现金流数据是决策依据之一”等解释，帮助研究者理解模型逻辑并增强模型信任度。\n\
    \n同时，部分研究还尝试将领域知识显式嵌入 AI 模型结构，如在输入层引入专家规则过滤器、在损失函数中加入经济约束项，或在训练过程中联合优化预测误差与解释一致性，以实现“知识引导下的智能预测”。这种结合\
    \ AI 模型灵活性与学科专业性的路径，有望在未来成为经管类预测研究的重要发展方向。\n\n总体而言，AI 驱动的新型预测模型打破了传统建模中变量预设、结构固定、模态分离的限制，推动实证研究迈向更具灵活性、适应性与自动化的范式。在数据日益复杂、业务快速演化的背景下，此类模型将在个性化推荐、企业监测、政策响应预测等关键领域持续拓展其应用边界，并推动预测性研究与理论建构更紧密结合。\n\
