    ## 8.1 顶级期刊针对大模型使用的政策


    AI在学术写作领域的迅猛发展与广泛应用，已促使全球主要学术期刊纷纷出台政策，旨在规范其使用，维护科研诚信与出版伦理。本节系统梳理国际综合性顶刊、英文经管学科顶刊及中文经管学科顶刊针对大模型使用的相关政策，并在此基础上，提出在经管科研论文写作中合规、有效使用大模型的指导原则。


    ### 8.1.1 顶级期刊的政策


    为清晰把握当前学术出版领域在大模型应用方面的规范导向，本小节以“代表性期刊筛选－政策内容解析－共识规律提炼”为逻辑主线，开展系统性梳理与分析。


    #### 1. 代表性顶级期刊的选择


    本小节选取代表性顶级期刊与相关政策时，综合考量了这些期刊在全球科学共同体中发挥的“政策风向标”作用、在国际经管科研考核中的“硬通货”地位，以及学术学会与出版商发布的“操作细则”。


    ①`Nature`与`Science`代表了跨学科顶刊在AI使用政策上的“底线标准”。


    ②`Financial Times 50`(`FT50`)与`UT Dallas 24`(`UTD24`)相关期刊的政策之所以重要，是因为它们是国际经管科研评价“计分体系”的核心组成部分。


    ③美国管理学会(`Academy of Management`，`AOM`)《管理研究学报》、(`Journal of Management Studies`，`JMS`)、`Elsevier`及运营管理(`Operations
    Management`，`OM`)七刊联盟等发布的政策，则提出了AI使用的“披露模板”与“禁止清单”。


    ④以《管理世界》为代表的中文顶刊及《中[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)国科技期刊研究》等发布的行业指南和声明，则反映了AI辅助写作规范在中国学术界的“本土实践”与具体要求。


    这些期刊的政策相互补充，能够为经管研究者在跨语种、跨评价体系、跨法域的学术实践中，合规、有效地使用大模型提供最具普适性的参照框架。


    #### 2. 顶级期刊对大模型使用的政策


    (1)`Nature`与`Science`等综合性顶刊的政策


    作为国际学术出版界的“风向标”，`Nature`与`Science`等综合性科学顶刊率先对大语言模型在论文写作中的应用表明了立场。它们作为全球科学界的旗舰期刊，是最早针对生成式AI发布完整政策框架的综合性顶刊，其政策演变（如`Science`从早期严格限制AI使用的立场调整为披露后有限使用）为其他国际期刊政策的制定与动态调整提供了重要参考。其核心政策要点可概括为：“AI不得署名、审慎使用并须披露、作者负全责”。


    ①AI不得作为作者署名。`Nature`与`Science`均明确禁止将AI工具列为论文作者，申明AI不具备作为作者所必需的责任能力和法律人格，无法对研究工作的原创性、真实性负责，亦不能签署版权转让协议或利益冲突声明。


    ②对AI辅助写作的态度与披露要求。在是否允许AI辅助写作的问题上，`Nature`与`Science`的态度虽略有差异，但均强调作者的最终责任与过程的透明度。`Nature`采取了相对审慎而包容的态度。该刊允许作者在论文撰写过程中有限度地使用AI工具，但要求作者充分披露其使用情况（除非仅为基础的文字润色）。依据`Nature`的政策，若作者在论文写作中运用大模型进行内容创作、数据分析或生成其他研究相关文本（如编写代码、草拟文献摘要等），则应在论文的“方法”部分或其他适当章节清晰说明所使用的AI工具及其具体用途。仅当AI用于改正语法、拼写错误这类“AI辅助性文字编辑”目的或作为通用写作辅助工具（如文字处理器内置的拼写检查功能）时，方无须特别声明。`Nature`承认AI有助于提升论文的行文清晰度与语言质量，但明确指出AI不得用于生成核心研究结论或独立的学术见解，所有内容仍需作者进行严格的审核与把关。`Science`在初期对AI辅助写作持更为审慎乃至严格的立场，其主编`Holden
    Thorp`曾明确指出，禁止在论文中使用由`ChatGPT`[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)等AI工具生成的文本，强调论文必须是作者的原创作品，并对AI可能引入的错误和对研究语境的扭曲表示担忧。
    这一立场强调了对AI生成内容直接融入学术论文的严格限制。然而，2023年11月，出版`Science`的美国科学促进会(`AAAS`)更新了其指南，允许作者在论文准备过程中，在适当披露的前提下使用AI。该政策在2025年2月13日再次更新，进一步明确：作者在稿件准备环节可有限使用AI，但须完整披露其使用情况；同行评审阶段则全面禁用AI，以保障评审员能全身心投入稿件评估，确保评审的独立性与公正性。


    ③作者责任的规定。两刊一致强调，无论是否使用AI工具，论文的全部内容最终均由署名作者负责。鉴于AI无法签署版权协议、声明利益冲突，亦无法对研究的真实性与完整性承担法律和道义责任，因此，作者在使用AI时必须对最终稿件进行严格的核查与校对，确保AI引入的信息准确无误，避免潜在的学术不端行为，如抄袭、数据伪造或AI“幻觉”（AI生成的不实信息）。


    总结而言，国际综合性顶刊针对大模型使用的政策，核心在于保证科研的原创性、可信度以及作者的终极责任。尽管具体规定仍在不断发展与完善，但“AI不得署名、审慎使用并须披露、作者负全责”已构成其政策基石。


    (2)英文经管学科顶刊的政策


    `FT50`上榜期刊和`UTD24`核心期刊是国际经管科研期刊的顶级期刊，这些列表所涵盖的管理学、金融学、会计学、市场营销、信息系统(`Information
    System`，`IS`)、`OM`等领域的顶级英文期刊针对大模型使用的政策，总体上认可其辅助价值，但无一例外地强调使用的透明度、合规性以及作者的最终责任。特别是`IS`、`OM`领域的期刊，因其学科与算法伦理、数据治理紧密关联，其在AI政策细则（如“严禁使用AI生成图表”）上往往行动得更早、规定得更细。一些重要的学术学会（如`AOM`）、出版商（如`Elsevier`），以及期刊联盟（如`OM`七刊联盟）和单一期刊（如`JMS`）发布的“操作细则”，为AI使用的披露颗粒度和禁止范围提供了可复制的模板。


    ①出版集团的政策。众多`FT50`与`UTD24`期刊隶属于大型国际出版集团，如`Elsevier`、`Wiley`、`Springer Nature`等。这些出版集团通常会发布适用于旗下所有期刊的AI使用指南。例如，`Elsevier`（其指南覆盖超过30种`FT50`期刊）在2023年明确指出，允许作者在写作中使用AI及AI辅助技术以提升稿件的可读性，完善语言表达，但此类技术不应取代作者以完成关键的学术任务，如提出科研洞见、推导科学结论、解释数据等，并要求作者在方法或致谢中披露AI使用情况。`Wiley`等其他主要出版商亦采取了类似立场。


    ②学会及期刊的政策。美国管理学会(`AOM`)旗下拥有`Academy of Management Journal`和`Academy of Management
    Review`等顶刊，该学会于2023年发布大模型使用政策，明确规定投稿作品必须由作者自主撰写，AI不能被列为作者。AI工具仅可用于拼写检[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)查、语法校对或数据收集与分析等辅助环节。任何超出此范围的AI协助，均须在投稿时的投稿信(`Cover
