    \ AI 预测结合，构建高频通胀指数，其时效性与覆盖范围均显著优于传统统计方法⁸\n\nAI 的赋能使数据抓取从“信息采集工具”升级为“智能研究基础设施”，推动经管研究向实时化、多维度分析转型。这一突破不仅推动了“大数据经济学”的学科发展，更被多国央行纳入政策参考体系，彰显了学术研究向实际决策的转化价值。\n\
    \n## 5.1.3 AI 助力多源数据融合\n\n在经管研究中，数据来源日益多元化，有结构化数据、半结构化数据和非结构化数据，它们在格式、语义和时效性上存在显著差异，这对数据整合工作提出了新的要求。\n\
    \n### 1. 多源数据融合的概念\n\n多源数据融合(`Multi-source Data Fusion`)是指将来自不同渠道、不同结构的数据进行清洗、集成和融合，以提升数据的完整性、准确性和可用性，其核心目标是通过数据关联、互补和协同分析，打破数据孤岛，从而实现\
    \ 1+1>2 的洞察，提升信息完整性与决策可靠性。\n\n多源数据融合的核心在于数据的层级化处理，通常包括以下步骤。\n\n①数据预处理：对原始数据进行清洗、对齐和去噪。\n\
    ②特征提取：从不同数据源中抽取关键信息，如文本、图像、时空数据等。\n③关联建模：建立多源数据的时空或逻辑关联规则。\n④决策融合：通过权重分配或概率推理生成最终结论。\n\
    \n### 2. AI 赋能多源数据融合的技术路径与应用\n\n在技术发展早期，多源数据融合以统计融合为主，聚焦结构化数据对齐，但难以处理非结构化数据。生成式模型统一了文本与图像的表征，深度学习作为多源数据融合的有力辅助工具，促进了多模态异构数据的融合突破，具体表现在：\n\
    \n①在特征提取阶段，使用卷积神经网络(`Convolutional Neural Network, CNN`)提取图像语义特征；\n②在关联建模阶段，利用循环神经网络分析时序数据间的关系；\n\
    ③在决策阶段，应用集成学习方法优化融合策略。\n\n而从数据处理的角度，AI 技术也被应用到数据清洗、数据集成、数据融合等各个阶段，如表 5.5 所示。AI\
    \ 技术赋能带来了多源数据融合爆发式的发展。目前，为了进一步解决计算成本高昂的问题，轻量化模型与隐私计算（同态加密+联邦学习）已成为多源数据融合领域新的研究热点。\n\
    \n表 5.5　将 AI 技术用于数据处理\n\n![](img/CB_3300196873_56EAHk6UO7DW6Lt3k63TU3Dq3Dn3H33br30f3LI3QC6XN6XW30b3Do3Tb3PS3ov6XZ3Tc42v5Lcc44c1.jpg)\n\
    \n同时，AI 技术赋能多源数据融合，在诸如智能交通、灾害预警等复杂场景中，取得了显著的实用效果。就数据融合的策略而言，可分为前融合策略和后融合策略。\n\n\
