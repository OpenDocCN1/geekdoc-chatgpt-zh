    \n（略）\n\n#### 3\\. 分步提问\n\n分步提问的核心目标是拆解复杂任务为“逻辑链+迭代环”。例如，研究某特定经济政策发布对股票市场收益率的影响，可以分为3个步骤，示例如下。\n\
    \n第一步：运用事件研究法检验特定宏观经济政策发布对中国A股市场超额收益率的短期影响。\n\n第二步：在“超额收益率”模块中，补充分析不同所有制企业（国有企业与民营企业）在政策冲击下的异质性反应。\n\
    \n第三步：将“短期影响”替换为“长期效应持续性分析”，要求提供3种不同时间窗口下的政策效应敏感性分析结果，并解释其经济学含义。\n\n以下结合具体案例，来展现分步提问法的综合运用。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/CB_3300196873_56EAHkD9L5LI01Ic1b2f.png)第一步：采用案例分析法探讨某新兴科技公司实施数字化转型战略的初步成效与面临的挑战。\n\
    \n第二步：在“面临的挑战”模块中，深入分析组织结构调整与企业文化变革对数字化转型成功率的关键影响。\n\n[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)s=\"\
    quotation\">第三步：将“初步成效”细化为3个关键绩效指标(KPI)的量化评估（要求提供转型前后不同部门的KPI对比，并提出针对性的优化建议）。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/CB_3300196873_56EAHkD8z5LI01I6348d.png)第一步\n\
    \n一、案例背景\n\n以某人工智能初创企业“深蓝科技”为例，该公司成立于2018年，专注于计算机视觉和自然语言处理技术研发。2021年起实施全面数字化转型战略，旨在提升研发效率、优化运营流程并增强市场竞争力。\n\
