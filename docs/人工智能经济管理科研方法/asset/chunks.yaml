- raw: "第一，AI使用过程中的学术规范保障。首先，精准识别AI幻觉，交叉验证关键信息。AI幻觉是指AI模型生成看似合理但实际错误或虚构信息的现象。AI使用者需要通过交叉验证的方式识别AI幻觉。验证方式主要包括：多AI验证法、检索权威信息源、人工校对（在使用AI技术生成学术内容时，使用者必须进行细致的校对和反复的测试，确保最终的信息精准可信）。其次，掌握科学提问方法，进行高质量人机对话。AI的回答质量取决于提问方式。模糊的问题（如“如何学好英语？”）换来的往往是泛泛之谈，而采用结构化提问（如“请列出提升英语听力的5个科学方法，并附上练习步骤”）能获得更实用的答案。此外，通过多轮追问（如“能否提供具体案例？”“想在1个月内迅速提升，可以做哪些练习？”）和限定条件（如“基于最新研究”），可以优化AI的输出。关键是要主动引[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)导对话，而非被动接受信息，在构思问题的过程中，还能锻炼自己的逻辑思维与思辨能力。最后，深度融合人机内容，对AI的输出进行个人化处理，并主动进行自检与调整。对AI生成内容进行深度再创作，融入个人专业知识、见解和表达风格，使其成为真正的个人作品。避免简单复制AI输出或仅做表面改写。在提交前使用AI检测工具对文稿进行自检，针对高风险段落进行重写和调整，确保最终内容符合学术规范和机构要求。\n\
    \n第二，AI使用过程后的学术规范保障。首先，加强对AI检测平台和工具的应用，技术赋能高校学术规范保障。学术规范的保障需要依赖有效的检测手段。目前，常见的AI检测工具包括知网、万方等平台的AI检测系统等，但这些检测工具在鲁棒性和精准度上都不甚理想。鉴于此，高校需进一步优化检测技术和检测机制，包括通过采用更先进的自然语言处理技术，尤其是语义分析、句法分析和上下文理解等手段，以便更好地识别失范行为；开发特定的检测工具来识别图像和代码的伪造与剽窃行为；利用大数据和云计算技术，构建分布式的检测系统以实现海量数据的存储和处理，进一步提升AI检测精度。其次，重视AI使用伦理教育，筑牢学术诚信制度的根基。高校应重视AI使用的伦理教育，建立以透明度和问责制为核心的伦理规则体系。再次，为维护科研数据安全，高校应出台AI使用安全规范，建立AI工具审查制度，鼓励使用安全清单内的AI，并开发部署本校的局域模型。研究者应保持警惕，养成良好的使用习惯，如使用前阅读AI工具的使用指南，使用后清理数据，以降低数据泄露风险，确保科研工作顺利进行。最后，完善AI使用的相关法律法规，构建多方主体合作治理模式。政府应加快制定配套法规和实施细则，明确AI著作权和AI使用者的披露程序。高校应与企业合作，创新学术道德失范治理模式，在算法与数据管理、教育与培训、监督与检测等方面展开合作，并明确企业的“治理合作伙伴”身份。高校应建立完善的学术规范制度，制订明确的诚信教育计划，为学术诚信教育提供根本保障，构建良好的学术生态环境。\n\
    \n### 10.4.2 AI检测平台的使用\n\nAI检测即通过人机生成文本的差异判断送检的论文是由人工编写的还是由AI模型生成的，并根据算法执行结果快速生成报告。随着AI写作的普及，越来越多高校、期刊、学术机构开始加强对AI生成内容的检测。\n\
    \n#### 1\\. AI检测的原理\n\nAI检测主要基于文本特征分析、机器学习分类模型、语言模型对比以及元数据分析等关键技术的综合运用，来识别和判断文本是否为AI生成。\n\
    \n第一，文本特征分析。AI生成的文本往往具有特定的语言模式和结构特征。例如，AI生成的文本可能缺乏人类写作中的个性化表达，或者在逻辑连贯性上存在一定的问题。通过分析这些文本特征，检测系统可以初步判断文本是否为AI生成。\n\
    \n第二，机器学习分类模型。基于机器学习技术的检测方法用大量的文本数据进行训练，构建分类模型来识别AI生成的[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)内容。常用的模型包括SVM、随机森林以及深度神经网络等。这些模型能够通过学习人类写作与AI写作之间的差异，提高检测的准确率。\n\
    \n第三，语言模型对比。通过对比不同语言模型生成的文本与人类写作的文本，检测系统可以发现AI生成内容中的独特模式。例如，GPT系列模型生成的文本在词汇选择、句式结构等方面可能存在特定的规律，这些规律可以通过对比分析被识别出来。\n\
    \n第四，元数据分析。除了文本内容本身，元数据也是AI检测的重要依据。例如，AI生成的文本可能在时间戳、作者信息、引用格式等方面存在不一致之处。通过分析这些元数据，检测系统可以进一步验证文本的真实性。\n\
    \n#### 2\\. AI检测的技术挑战\n\nAI检测面临多重技术挑战，包括模型泛化能力不足、训练数据稀缺、对抗性攻击以及伦理与隐私问题，这些问题共同影响了检测的准确性和可靠性。\n\
    \n第一，模型泛化能力不足。随着AI技术的不断发展，AI的生成质量也在不断提高。现有的检测模型在面对新型AI生成内容时，可能会出现泛化能力不足的问题，导致检测效果下降。\n\
    \n第二，训练数据稀缺。AI检测模型的训练需要大量的标注数据，而目前公开的AI生成文本数据集相对有限。数据稀缺导致模型的训练效果欠佳，进而影响了检测的准确性。\n\
    \n第三，对抗性攻击。一些使用者可能会通过对抗性攻击手段，对AI生成的文本进行修改，以逃避检测。例如，通过添加噪声、修改句式等方式，使AI生成的内容更接近人类写作，从而增加检测难度。\n\
    \n第四，伦理与隐私问题。AI检测涉及对学术论文内容的分析，可能会引发伦理和隐私问题。例如，检测系统在分析文本时，可能会无意中泄露作者的隐私，或者对某些特定群体产生不公平的影响。\n\
    \n#### 3.主流AI检测平台介绍\n\n第一，维普论文检测系统。维普论文检测系统由维普自主研发，是目前比较权威的论文查重平台之一，被超一千所高校指定为合作网站。维普论文检测系统的AIGC检测服务基于公司研发的自主训练AI检测技术，主要通过文本特征分析来判断是否为AI所生成的内容。在识别范围上，维普论文检测系统AIGC检测服务可检测出国内外主流AI模型生成的文本内容。在数据库资源方面，维普拥有中文科技期刊论文全文数据库、博士硕士学位论文全文数据库、外文特色文献数据全库等丰富的中文文献资源，在检测中文论文的AI率方面具有较高的准确性。维普论文检测系统支持对中文、英文及小语种论文的检测。\n\
    \n第二，知网AIGC检测服务系统。知网AIGC检测服务系统基于结构化、碎片化和知识元化的高质量文献大数据资源，采用预训练大语言模型的算法逻辑，从语言模式和语义逻辑两条路径检测AI生成内容，可快速、准确地识别包括期刊论文、学位论文、图书专著等在内的学术文本中不同程度疑似AI生成的内[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)容。其所提供的AI检测结果报告单通过可视化的方式展示全文检测结果和疑似AI生成的内容片段，清晰标示整体和片段的AI值。\n\
    \n第三，文察。文察由万方数据股份有限公司开发，采用先进的AI文本识别深度学习模型，利用神经网络的强大表达能力，识别人机生成文本之间的差异，适用于目前主流模型生成的中文、英文、中英文混合文本的检测。其主要功能包括：AI生成文本检测、文本相似性检测、图像问题检测以及风险监测与核查。其特色功能——图像检测采用基于CNN、Milvus向量库、特征点匹配的图像复用检测算法，实现篇内图片相似性检测与全库图片比对，可识别论文中多种类型图片的复用情况。\n\
    \n第四，大雅相似度分析。大雅相似度分析的AIGC检测系统采用多维特征分析和深度学习算法，通过识别AI生成文本的语言模式、表达习惯和逻辑结构特征，检测论文、作业中由ChatGPT、文心一言、讯飞星火等AI工具生成的内容，已被全国300多所高校作为学术AI内容甄别工具采用。大雅相似度分析的AIGC检测系统覆盖所有主流AI生成工具，且针对AI生成的中文内容的特征进行了专门训练，识别率比通用检测工具高15%~20%。\n\
    \n第五，Turnitin。Turnitin是全球使用最广泛的论文查重系统之一，主要用于学生课程作业、毕业论文、期刊论文初稿的查重检测。Turnitin的AI检测服务使用先进的文本匹配算法，整体检测准确性较高，其不仅能够检测出与已有文献的相似度，还能对文本的语言风格、用词习惯等进行分析，以判断其是否符合AI生成的特征。\n\
    \n第六，iThenticate。iThenticate是国际SCI期刊认可程度较高的查重软件，服务对象主要是Elsevier、Springer、Taylor\
    \ & Francis、Wiley等国际著名出版商。其适用人群主要包括有SCI、SSCI、EI等国际核心期刊论文发表需求的顶尖学者。iThenticate和Turnitin由同一家公司开发，算法相同，但iThenticate有Crossref提供的数据支持，因此其数据库几乎囊括了所有已发表的SCI论文、权威出版物及网络公开内容，直接复制粘贴或轻微改写（如替换同义词、调整语序）已有内容，几乎100%能被识别。\n\
    \n#### 4.主流AI检测平台对比\n\n对比6种常见AI检测平台的主要检测方式、适用范围及主要检测语言，结果如表10.2所示。\n\n表10.2　主流AI检测平台对比\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/CB_3300196873_56EAHk6UO7DW6Lt3M16XQ3oD6XT3TR6o231S3LI6fk6TF3k830a6ok%3Cspan%20style=)[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)6gV3TX6TP6nz3bt42v5Lc4583f.jpg\"\
    \ style=\"width:100%;\"/> \n\n#### 5\\. AI检测结果标准\n\n目前各平台对AI使用程度的衡量多以AI率体现。AI率（又称AI生成内容率）指的是论文中被检测系统判定为由AI生成的内容占论文总字数的比例，通常以百分比表示。其计算公式如下：\n\
    \nAI率=（AI生成的字数/论文总字数）×100%\n\n目前各院校、期刊出版领域等对AI检测结果都有自己的要求，暂无公认标准，中国知网定义的AI率阈值区间及含义如表10.3所示。以目前开展AI检测的院校（如湖北大学、华东师范大学、福州大学、天津科技大学等）举例，多数院校要求本科论文的AI率低于30%，部分院校放宽至40%。论文的AI率超过该值，一般需要由教师指导学生进行修改。也有一些院校将AI率作为学生毕业设计（论文）成绩评定和校级优秀本科生毕业设计（论文）评选的参考依据。硕士论文的AI率普遍要在10%~15%之间，部分要求严格的院校还将标准设为10%以下。博士论文及期刊的AI率需低于5%，部分期刊甚至要求AI率为0。\n\
