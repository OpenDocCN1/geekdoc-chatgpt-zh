    ## 7.3 AI+扎根理论研究

    扎根理论是被学者们广泛应用于经管学科的一种质性研究方法。从认识论角度看，扎根理论属于一种归纳法。与量化实证研究不同，开展扎根理论研究时研究者并不需要提出理论假设，而是直接从所调查收集的数据中进行经验概括，提炼、归纳出反映经管现象的概念(Concept)，进而发展为范畴(Category)以及范畴之间的关联，最终建立起与研究现象密切相关的理论。扎根理论强调要从原始数据中归纳概念和理论框架，特别适用于开展探索性研究和理论尚不成熟的领域。但是与此同时，开展扎根理论研究需要研究者花费大量的时间和精力开展访谈、文本分析等数据收集整理以及编码分析工作，耗时且过程复杂，由于研究存在一定的主观性，其可信度和可靠性往往受到质疑，这影响了扎根理论的应用与发展。


    AI 与扎根理论研究具有显著的契合性，为经管质性研究带来新的可能性。二者的结合能够提升研究效率，拓展研究视野。扎根理论强调从数据中生成理论，而 AI 技术，尤其是自然语言处理技术，能够高效处理和分析大量非结构化文本数据，为扎根理论研究提供强大的技术支持。AI
    还可以快速完成文本的开放编码，在主轴编码阶段通过关联分析帮助研究者发现概念之间的潜在联系。此外，AI 的文本挖掘功能可以辅助选择性编码，围绕核心范畴整合数据主轴编码构建理论框架。


    ### 7.3.1 扎根理论概述

    下面介绍扎根理论的概念、优势与局限性。


    #### 1. 扎根理论的概念

    美国学者巴尼·格拉泽(Barney Glaser)和安塞姆·斯特劳斯(Anselm Strauss)被誉为扎根理论研究的奠基者。1967 年，两人出版了《发现扎根理论：质性研究的策略》(The
    Discovery of Grounded Theory：Strategies for Qualitative Research)一书，他们将“扎根理论”(Grounded
    Theory)作为质性研究方法应用于社会科学研究中。后来，斯特劳斯和朱丽叶·科宾(Juliet Corbin)以及凯西·查默兹(Kathy Charmaz)于
    1998 年、2002 年先后扩展了他们的研究。


    虽然扎根理论在名称上带有“理论”二字，但其本身并不是一个理论，而是一种以数据为基础发展理论的方法论。这种研究方法的目的是“说明概念范畴之间的关系以及详细地阐明理论关系涌现、改变或维持的条件”(Charmaz，2002)。扎根理论的主要宗旨就是研究者需要“扎根”在所收集的经[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)验数据上构建理论。


    国内学者陈向明将扎根理论定义为：是一种从下往上建立实质理论的方法，即在系统收集资料的基础上，寻找反映社会现象的核心概念，然后通过这些概念之间的联系建构相关的社会理论。


    在扎根理论发展中，主要形成了三种学派：经典扎根理论、程序化扎根理论和建构主义扎根理论，三种理论的比较如表 7.4 所示。


