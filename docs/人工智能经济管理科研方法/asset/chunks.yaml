    \ 大模型辅助写作的“四原则”\n\n在学术写作中规范使用大模型，既是对科研诚信的坚守，也是适配期刊政策、规避学术风险的核心要求。结合全球顶级期刊的政策导向与学术伦理的底层逻辑，可提炼出大模型辅助写作的“四原则”，为科研人员提供明确的行为框架。\n\
    \n#### 1.审慎原则\n批判性评估AI的输出，警惕其固有缺陷。应将AI生成的内容视为“半成品”，其正确性有待考证。宁缺毋滥，不轻易采纳AI的结论。审慎原则要求我们树立两种意识：一是避免过度依赖的意识，AI不能替代研究者的深度思考、独立判断和批判性分析能力，若产生不健康的依赖，应及时调整，回[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)归研究本身；二是风险意识，在采信AI输出内容前，应自问其潜在后果，并决定是否以及如何进行验证，AI有时会“自信地”犯错，可将AI视为一位“勤奋但容易出错的实习生”。\n\
    \n#### 2.披露原则\nAI的使用情况进行全面、准确的内外声明，一是对内透明，研究团队内部应公开共享AI的使用情况，共同把关；二是对外透明，严格按照期刊、机构的要求，在指定位置清晰、准确地披露AI的使用情况，包括工具名称、版本、开发者、访问日期、具体用途和贡献程度等。\n\
    \n#### 3.人审原则\n人类作者对AI生成的内容进行最终审核并承担全部责任，人类作者始终是研究的最终负责人和质量的最后把关者。AI输出的所有内容都必须经过作者逐字逐句地审阅、验证和批判性评估。人审原则的核心要求包括：事实核查、逻辑与语义审查、原创性保障、一致性检验、学术价值判断。牢记“作者是第一责任人”，不能将未经核实和判断的AI生成物呈现给读者。在AI介入的每一个环节之后，都应安排人工校对和审核。\n\
    \n#### 4.合规原则\n确保AI的使用符合所有相关学术规范、法律法规及伦理要求。一是遵守学术出版规范，不越过目标期刊关于AI使用的红线（如不将AI列为作者、不将AI用于核心环节、按规定披露等），隐瞒或虚假声明AI使用情况可能导致严重后果。二是坚守学术诚信底线，不利用AI规避原创性要求或从事学术不端行为（如“洗稿”式剽窃），确保AI生成的内容不侵犯他人知识产权。三是遵循法律法规与数据合规要求，注意AI工具的使用条款和隐私政策。在处理敏感数据时，遵守数据保护法规（如GDPR、欧盟《人工智能法案》\
