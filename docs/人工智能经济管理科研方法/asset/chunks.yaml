    关键观察


    1.增长持续性


    • 营收复合增长率达 14.6%，体现业务扩张韧性。


    • 净利润增速超营收复合增长率 23.1%，反映经营效率提升。


    2.毛利率改善路径


    • 2019—2021 年：通过供应链整合降低原材料成本。


