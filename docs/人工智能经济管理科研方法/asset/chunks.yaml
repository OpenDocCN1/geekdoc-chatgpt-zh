    # 内容提要


    本书系统探讨人工智能(AI)如何重塑经管科研范式，聚焦 AI 时代经管研究的理论创新、方法升级与实践应用，为研究者提供从思维变革到工具落地的全流程指南。


    全书共 10 章，以“范式变革—工具赋能—质量伦理”为主线展开，第 1~3 章解析 AI 对经管理论体系与科研流程的重构，详解提示词设计的原则与技巧；第 4~7
    章围绕理论构建、多模态数据分析、实证研究、质性研究等核心科研场景，展示 AI 的应用路径；第 8~10 章则阐述论文优化策略、能力进化路径及伦理规范，助力高质量成果产出。


