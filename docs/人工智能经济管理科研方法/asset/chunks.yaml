    \n#### 2\\. 主要技术手段和应用场景\n\n(1)自然语言处理：非结构化数据的“解构者”\n\n自然语言处理是人工智能的一个分支，目的是使计算机能够理解和处理人类语言，从中提取有用信息，帮助人们更高效地完成各种任务。\n\
    \n自然语言处理技术能够实现人与计算机之间的自然语言交互，人们无须掌握计算机指令或编程知识，即可通过自然语言表达需求，这大大提升了人机交互的效率和易用性。此外，该技术能自动处理大量文本和语音信息，是提取、分析和挖掘有价值数据的关键工具。同时，自然语言处理技术还能根据用户的个人偏好和习惯进行个性化设置和推荐，提供更为个性化的服务。\n\
    \n自然语言处理的工作原理包括建立语言模型、分词、词法分析、句法分析、语义理解与生成、上下文理解与记忆，以及利用机器学习算法进行训练和优化。\n\n其中，语言模型用于计算自然语言中单词或序列的概率，评估文本中的语法、上下文和单词顺序等信息，为后续的文本处理提供基础。词法分析是对文本进行词法层面的处理，包括词形还原、词性标注等，以识别出文本中每个单词的词性和形态。句法分析是对句子结构进行分析，揭示句子中词语之间的依存关系，确定句子中各个成分的语法功能和语义角色，从而“理解”句子的意义。语义理解是指对文本意义的理解和分析，包括实体识别、关系抽取、情感分析等；语义生成则是根据特定主题或需求，自动生成语义连贯、符合语法规则的自然语言文本。此外，还会大量应用机器学习算法，以训练和优化模型，自动提取特征并学习文本数据的内在规律和模式，从而不断提高自然语言处理系统的性能和准确度。\n\
    \n自然语言处理技术在各行业中都有广泛的应用，我[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)们结合行业特点列举出主要场景，如表5.2所示。\n\
    \n表5.2　自然语言处理技术的行业应用场景\n\n![](Text/https:/res.weread.qq.com/wrepub/CB_3300196873_56EAHk6UO7DW6Lt3Hw6cL6kb3D03H33TW30j3HA6kg3o56bb30h3LM3M56jr6gU3PN3Tb42v5Lc902f2.jpg)\n\
    \n(2)知识图谱：隐性关系的“透视镜”\n\n知识图谱是人工智能技术的关键组成部分，其以结构化和语义化的方式表示知识，有助于计算机理解和处理人类语言。知识图谱通常是一个大型、半结构化、面向主题、多模态的知识库，包含各种实体、关系和属性信息（图5.1所示为Python编程语言的知识图谱）。这些信息通过一系列算法和模型进行处理和推理，使计算机能够自动从中获取、推理并生成新知识。\n\
    \n知识图谱通常由实体、关系和属性三部分构成。实体是知识图谱的基本单元，可以是具体物体、抽象概念，也可以是事件、人物、地点、组织等，每个实体都有唯一标识符(ID)用于唯一标识和索引。关系表示实体之间的相互作用或联系，如关联性、依存性、从属性等，每个关系也有唯一标识符(ID)。属性描述实体和关系的特征，包括实体的名称、定义、类型、分类、标签等，以及关系的方向、权重、强度、类型等，每个属性同样具有唯一标识符(ID)。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/CB_3300196873_56EAHk3ft42v5Lc397a2.jpg)\n\
    \n图5.1　Python编程语言知识图谱（来源：NRD Studio）\n\n知识图谱的构建是一个复杂的过程，涉及从多种来源获取、整合和处理大量数据，包括结构化、半结构化和非结构化数据，通常可以分为以下步骤。\n\
    \n①数据收集：从数据库、网页、文本等数据源中收集实体、关系和属性等信息。\n\n②数据清洗：对收集的数据进行清洗和预处理，包括去除重复数据、格式化数据、统一数据格式等。\n\
    \n③实体抽取：从文本中抽取实体，并进行分类和标注。\n\n④关系抽取：从文本中抽取实体间的关系，并进行分类和标注。\n\n⑤属性抽取：从文本中抽取实体和关系的属性，并进行分类和标注。\n\
    \n⑥数据建模：将抽取的实体、关系和属性信息转化为图形化的知识图谱模型。\n\n⑦知识推理：通过算法和模型对知识图谱进行推理，生成新的知识。\n\n知识图谱的应用领域非常广泛，包括但不限于搜索引擎、智能客服、自然语言处理、数据分析等。一些典型应用如表5.[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)3所示。\n\
    \n表5.3　知识图谱的一些典型应用\n\n![](Text/https:/res.weread.qq.com/wrepub/CB_3300196873_56EAHk6UO7DW6Lt3M36YE6fg3HC3jx3k930a3oC3kq3jx3LN30e3UH6cO6YE6ok3QD3bn42v5Lc37db7.jpg)\n\
    \n(3)生成式人工智能：数据勘探的“思维助手”\n\n生成式人工智能是近年来人工智能领域中最引人注目的技术之一。与传统的分析型人工智能（如分类、回归等）不同，生成式人工智能旨在通过学习数据中的模式和规律，生成与训练数据风格一致的新内容。这一技术的突破性进展，不仅改变了我们对人工智能能力的认知，还为多个领域带来了革命性变化。\n\
    \n生成式人工智能的核心技术包括生成对抗网络(Generative Adversarial Networks，GANs)、  \n\n变分自编码器(Variational\
    \ Auto Encoder，VAE)、Transformer等。这些技术通过不同的方法实现内容生成，各有特点。\n\n● 生成对抗网络\n\n生成对抗网络由生成器(Generator)和判别器(Discriminator)两个神经网络组成。生成器负责生成数据样本，判别器则判断输入的数据是来自真实世界，还是由生成器生成的。通过多轮的对抗训练，生成器逐渐学会生成与真实数据难以区分的样本。\n\
    \n● 变分自编码器\n\n变分自编码器是一种生成模型，它不仅能学习如何重建输入数据，还能学习数据背后的潜在结构。通过将数据映射到一个结构化的潜在空间（通常假设该空间中的变量服从高斯分布），模型可以从这个空间中随机采样，从而生成新的、与原始数据相似的样本。\n\
    \n● Transformer\n\nTransformer是2017年由Google研究团队提出的一种神经网络架构，核心是自注意力机制。它最初用于处理语言，能同时关注句子中所有词语，大幅提升了模型的训练效率和理解能力。后来人们发现，这种机制也适用于图像、声音等其他类型的数据，因此Transformer如今已成为人工智能多个领域的基础架构。\n\
    \n生成式人工智能的技术日新月异，其应用场景也极为广泛，几乎涵盖了所有需要内容生成的领域，表5.4列出了一些典型的应用，供读者参考。\n\n表5.4　生成式人工智能的一些典型应用\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/CB_3300196873_56EAHk6UO7DW6Lt3br6kb3Do3PR6nt3D230i3PQ3bm3o56kd30c6U96gT6jt3k83fv3LK42v5Lc799c1.jpg)[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)le=\"\
    width:100%;\"/> \n\n#### 3.“东南亚数字经济渗透率”研究案例\n\n以往为经管研究寻找合适数据时，大多是通过借鉴、仿效类似研究文献或者基于研究者个人经验来寻找的，而人工智能为经管研究提供了强大助力。以研究“东南亚数字经济渗透率”为例，将研究问题输入至生成式人工智能大模型，要求它给出研究问题涉及的数据需求清单以及出处。大模型给出了课题涉及的核心数据变量，包括移动支付覆盖率（央行报告）、电商GMV（Lazada后台数据）、数字技能培训人数（东盟教育数据库），并自动推荐替代数据源，如Grab出行日志中的支付方式分布、Facebook广告投放行业分类等。这为上述案例在研究数据范畴上提供了深刻的洞见。\n\
    \n### 5.1.2 AI+数据抓取\n\n本小节所涉及的经管研究中的数据抓取，主要指通过技术手段（如爬虫程序）从网页、数据库或开放平台中自动化提取结构化数据与非结构化数据，用于经济模型构建、市场分析或商业决策支撑。\n\
    \n#### 1\\. 数据抓取面临的挑战\n\n在数字化时代，数据的重要性不言而喻，爬虫程序作为获取数据的关键工具，一直发挥着重要作用。然而，传统爬虫技术在实际应用中面临诸多挑战，这限制了数据获取的效率和准确性。\n\
    \n现代网页结构日益复杂，并广泛使用JavaScript和CSS进行渲染和交互。以电商网站为例，商品详情页不仅包含基本商品信息，还可能包含商品推荐等内容。这些元素嵌套在多层HTML标签中，且命名和结构缺乏统一规范，导致传统爬虫技术难以准确解析和定位所需数据。\n\
    \n同时，许多网站采用动态加载技术，即页面初始加载时仅包含部分基本内容，其他关键信息如图片、视频、评论等，会在用户与页面交互（如滚动、点击）时，通过JavaScript\
    \ 脚本从服务器获取并加载。这种情况下，采用传统爬虫技术仅能获取页面的初始HTML代码，而无法抓取动态加载的内容。\n\n再者，随着数据价值的提升，为保护数据安全和服务器性能，各大网站纷纷设置反爬虫机制。常见手段包括IP封禁、验证码验证及User-Agent检测等。据统计，超过80%的大型网站设有不同程度的反爬虫机制，这对合规前提下的采用传统爬虫技术的数据采集工作造成极大障碍。\n\
    \n而且，传统的爬虫程序维护成本高，需人们投入大量时间和精力。由于网站页面结构和内容频繁更新，爬虫程序也得随之调整优化。若网站修改了数据标签名称或位置，爬虫程序的解析规则也需相应调整，否则无法正确获取数据。随着反爬虫机制的升级，开发者要不断研究符合网站许可的访问规则的新策略，并更新爬虫程序，这增大了开发维护的难度与成本。此外，采集大规模数据时，还需考虑服务器资源消耗、数据存储管理等问题，这又进一步增大了维护的复杂性。\n\
    \n#### 2\\. AI赋能数据抓取的技术解析\n\n基于AI的爬虫技术为数据抓取提供了全新的解决方案。将自然语言处理、机器学习等AI技术用于数据抓取，能够从网页、数据库等异构数据源中高效提取结构化数据和非结构化数据，使得经管研究中高频、多维数据的实时获取成为可能。\n\
    \n其中，自然语言处理技术在这一过程中起到了关键作用。自然语言处[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)理技术使爬虫程序能够深入理解网页内容：通过分词、词性标注、命名实体识别等技术，爬虫程序能够精准地从网页中提取关键信息，而不是仅进行简单的文本抓取。以新闻网站为例，爬虫程序利用自然语言处理技术，可以自动识别新闻标题、正文、作者、发布时间等元素，将非结构化的新闻文本数据转化为结构化数据，以便后续的存储、分析和利用。\n\
    \n同时，机器学习技术的引入显著提升了爬虫的自适应能力。传统的爬虫程序在处理复杂多变的网页结构时常常力不从心，而机器学习技术能通过分析大量网页数据，自动识别并总结网页结构的模式与规律。当爬虫程序访问新网站时，可依据已学模式智能调整抓取策略，从而迅速地进行精准定位并提取所需信息。例如，在抓取电商网站的数据时，应用了机器学习的爬虫程序能根据各平台页面布局的特点，自动识别商品图片、价格、描述及评论等内容，实现高效的数据抓取。\n\
    \n而在应对反爬虫机制方面，AI也展现了独特优势。在遵守网站许可的访问规则的前提下，通过机器学习技术分析大量正常用户的访问行为数据，可以建立有效的合规访问模式参考模型。开发者借助这些模型，可优化爬虫程序的请求策略，如合理控制访问频率、随机化请求时间间隔的User-Agent等以实现合法合规的访问和数据抓取。\n\
    \n#### 3\\. 应用场景\n\n(1)金融领域：洞察市场先机\n\n在金融领域，将AI与爬虫技术相结合构建AI爬虫系统，可为投资者和金融机构提供强大的市场分析工具。该系统可以实时抓取各大金融新闻网站、社交媒体平台及证券交易所的海量数据，包括股票价格走势、财经新闻、公司财报和投资者情绪等；然后对这些数据进行深度分析，如利用自然语言处理技术对新闻和社交媒体文本进行情感分析，以判断市场情绪的乐观或悲观的倾向；此外，还可据此生成预测模型，用于预测股票价格波动和行业发展趋势。因此，金融机构利用AI爬虫系统，可实时跟踪数千只股票的信息，并根据市场情绪和数据分析结果，及时调整投资组合，从而有效降低投资风险，提升投资决策的准确性和时效性。\n\
    \n(2)电商行业：精准运营\n\n利用AI爬虫系统快速抓取各大电商平台的数据并进行深度分析，企业能更好地制定合理的定价策略、优化库存管理、及时调整营销策略。AI爬虫系统能监测竞品的促销信息，并分析该产品的历史价格走势、市场需求弹性，以及企业自身的成本和利润空间，为企业提供是否跟进促销的决策建议。若企业根据建议做出合理调整，可避免过度降价对利润的影响，从而有效地维护产品竞争力。\n\
    \n(3)学术研究：助力知识快速获取与整合\n\n在学术研究领域，AI爬虫系统为科研人员提供了极大的便利。AI 爬虫系统能在学术数据库、论文发表平台等网站上批量抓取科研论文、实验数据、研究报告等资料，并通过文本分类、关键词提取、知识图谱构建等手段，对这些海量的学术资料进行整理和分析，帮助科研人员快速了解研究领域的前沿动态、梳理研究脉络、发现潜在的研究方向和创新点。以医学研究为例，AI\
    \ 爬虫系统从全球各大医学期刊和数据库中抓取最新的医学研究成果，利用自然语言处理技术对论文进行语义分析，提取关键信息，如疾病的诊断方法、治疗效果、药物研发进展等。科研人员基于这些整合后的信息，能更高效地开展研究工作，避免重复劳动，加快科研进程。\n\
    \n(4)新闻资讯：实现个性化新闻推送与热点追踪\n\n利用AI[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)爬虫系统，新闻媒体行业实现了个性化新闻推送和热点事件的快速追踪。AI爬虫系统可实时抓取各大新闻网站和社交媒体平台的资讯，并根据用户的浏览历史、兴趣偏好和搜索关键词等数据，对新闻内容进行个性化筛选和推荐，提升用户体验和用户黏性。同时，系统还能实时分析大量新闻数据，快速识别热点事件，并预测其发展趋势，提供跟踪报道。因此，新闻客户端利用AI爬虫系统，可实时监测全球新闻动态——当某个热点事件爆发时，系统迅速分析相关新闻报道，为用户推送全面、深入的事件解读和跟踪报道，以提高该客户端的用户活跃度，并延长用户停留时间。\n\
    \n#### 4.“经济监测”研究案例\n\n由MIT经济学家阿尔贝托·卡瓦略(Alberto Cavallo)和罗伯托·里戈邦(Roberto Rigobon)发起的“十亿价格项目”开创了高频经济监测的先河。该项目通过每日抓取全球数百万在线商品的价格数据（覆盖电商平台、超市网站等），经过机器学习算法分析，将高频金融数据抓取与AI预测结合，构建高频通胀指数，其时效性与覆盖范围均显著优于传统统计方法[⁸](#fn8)\n\
    \nAI的赋能使数据抓取从“信息采集工具”升级为“智能研究基础设施”，推动经管研究向实时化、多维度分析转型。这一突破不仅推动了“大数据经济学”的学科发展，更被多国央行纳入政策参考体系，彰显了学术研究向实际决策的转化价值。\n\
    \n### 5.1.3 AI助力多源数据融合\n\n在经管研究中，数据来源日益多元化，有结构化数据、半结构化数据和非结构化数据，它们在格式、语义和时效性上存在显著差异，这对数据整合工作提出了新的要求。\n\
    \n#### 1.多源数据融合的概念\n\n多源数据融合(Multi-source Data Fusion)是指将来自不同渠道、不同结构的数据进行清洗、集成和融合，以提升数据的完整性、准确性和可用性，其核心目标是通过数据关联、互补和协同分析，打破数据孤岛，从而实现1+1>2的洞察，提升信息完整性与决策可靠性。\n\
    \n多源数据融合的核心在于数据的层级化处理，通常包括以下步骤。\n\n①数据预处理：对原始数据进行清洗、对齐和去噪。\n\n②特征提取：从不同数据源中抽取关键信息，如文本、图像、时空数据等。\n\
    \n<[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)p class=\"content\">③关联建模：建立多源数据的时空或逻辑关联规则。\n\
    \n④决策融合：通过权重分配或概率推理生成最终结论。\n\n#### 2\\. AI赋能多源数据融合的技术路径与应用\n\n在技术发展早期，多源数据融合以统计融合为主，聚焦结构化数据对齐，但难以处理非结构化数据。生成式模型统一了文本与图像的表征，深度学习作为多源数据融合的有力辅助工具，促进了多模态异构数据的融合突破，具体表现在：\n\
    \n①在特征提取阶段，使用卷积神经网络(Convolutional Neural Network, CNN)提取图像语义特征；\n\n②在关联建模阶段，利用循环神经网络分析时序数据间的关系；\n\
    \n③在决策阶段，应用集成学习方法优化融合策略。\n\n而从数据处理的角度，AI技术也被应用到数据清洗、数据集成、数据融合等各个阶段，如表5.5所示。AI技术赋能带来了多源数据融合爆发式的发展。目前，为了进一步解决计算成本高昂的问题，轻量化模型与隐私计算（同态加密+联邦学习）已成为多源数据融合领域新的研究热点。\n\
    \n表5.5　将AI技术用于数据处理\n\n![](Text/https:/res.weread.qq.com/wrepub/CB_3300196873_56EAHk6UO7DW6Lt3k63TU3Dq3Dn3H33br30f3LI3QC6XN6XW30b3Do3Tb3PS3ov6XZ3Tc42v5Lcc44c1.jpg)\n\
    \n同时，AI技术赋能多源数据融合，在诸如智能交通、灾害预警等复杂场景中，取得了显著的实用效果。就数据融合的策略而言，可分为前融合策略和后融合策略。\n\n\
    (1)前融合策略\n\n该策略是将多源原始数据直接输入深度学习模型，从而实现数据融合。典型的应用是将卫星遥感图与气象观测数据拼接后输入U-Net网络进行火灾预测。\n\
    \n(2)后融合策略"
  fmt: "\n## 5.1.1 AI+数据勘探\n\n“AI+数据勘探”突破了传统数据采集的局限，能够快速从非结构化数据中提取关键信息，显著提升了数据获[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)取的广度和深度；并且可自动清洗、去噪和标准化数据，减少人为误差，确保数据的可靠性和一致性，显著提升了数据的质量与分析效率，从而使经管研究不仅能够进行“事后”的解释，而且能够开展“事前”的预测。[⁷](#fn7)\n\
    \n“AI+数据勘探”采用预训练语言模型处理经管领域文本，并结合因果推断算法增强解释性。由此，基于“语义理解—知识推理—动态建模”三重能力，“AI+数据勘探”极大地突破了传统方法的数据处理瓶颈。数据勘探的传统方式与AI赋能方式的区别如表5.1所示。\n\
    \n表5.1　数据勘探的传统方式与AI赋能方式的区别\n\n![](Text/https:/res.weread.qq.com/wrepub/CB_3300196873_56EAHk6UO7DW6Lt3k53D03M56jp6bV3ca30c3HA6o46XN3M431Q6TQ3UH3ov3fz3g13Cy42v5Lc7d153.jpg)\n\
    \n### 2. 主要技术手段和应用场景\n\n#### (1) 自然语言处理：非结构化数据的“解构者”\n\n自然语言处理是人工智能的一个分支，目的是使计算机能够理解和处理人类语言，从中提取有用信息，帮助人们更高效地完成各种任务。\n\
    \n自然语言处理技术能够实现人与计算机之间的自然语言交互，人们无须掌握计算机指令或编程知识，即可通过自然语言表达需求，这大大提升了人机交互的效率和易用性。此外，该技术能自动处理大量文本和语音信息，是提取、分析和挖掘有价值数据的关键工具。同时，自然语言处理技术还能根据用户的个人偏好和习惯进行个性化设置和推荐，提供更为个性化的服务。\n\
    \n自然语言处理的工作原理包括建立语言模型、分词、词法分析、句法分析、语义理解与生成、上下文理解与记忆，以及利用机器学习算法进行训练和优化。\n\n其中，语言模型用于计算自然语言中单词或序列的概率，评估文本中的语法、上下文和单词顺序等信息，为后续的文本处理提供基础。词法分析是对文本进行词法层面的处理，包括词形还原、词性标注等，以识别出文本中每个单词的词性和形态。句法分析是对句子结构进行分析，揭示句子中词语之间的依存关系，确定句子中各个成分的语法功能和语义角色，从而“理解”句子的意义。语义理解是指对文本意义的理解和分析，包括实体识别、关系抽取、情感分析等；语义生成则是根据特定主题或需求，自动生成语义连贯、符合语法规则的自然语言文本。此外，还会大量应用机器学习算法，以训练和优化模型，自动提取特征并学习文本数据的内在规律和模式，从而不断提高自然语言处理系统的性能和准确度。\n\
    \n自然语言处理技术在各行业中都有广泛的应用，我[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)们结合行业特点列举出主要场景，如表5.2所示。\n\
    \n表5.2　自然语言处理技术的行业应用场景\n\n![](Text/https:/res.weread.qq.com/wrepub/CB_3300196873_56EAHk6UO7DW6Lt3Hw6cL6kb3D03H33TW30j3HA6kg3o56bb30h3LM3M56jr6gU3PN3Tb42v5Lc902f2.jpg)\n\
    \n#### (2) 知识图谱：隐性关系的“透视镜”\n\n知识图谱是人工智能技术的关键组成部分，其以结构化和语义化的方式表示知识，有助于计算机理解和处理人类语言。知识图谱通常是一个大型、半结构化、面向主题、多模态的知识库，包含各种实体、关系和属性信息（图5.1所示为`Python`编程语言的知识图谱）。这些信息通过一系列算法和模型进行处理和推理，使计算机能够自动从中获取、推理并生成新知识。\n\
    \n知识图谱通常由实体、关系和属性三部分构成。实体是知识图谱的基本单元，可以是具体物体、抽象概念，也可以是事件、人物、地点、组织等，每个实体都有唯一标识符(`ID`)用于唯一标识和索引。关系表示实体之间的相互作用或联系，如关联性、依存性、从属性等，每个关系也有唯一标识符(`ID`)。属性描述实体和关系的特征，包括实体的名称、定义、类型、分类、标签等，以及关系的方向、权重、强度、类型等，每个属性同样具有唯一标识符(`ID`)。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/CB_3300196873_56EAHk3ft42v5Lc397a2.jpg)\n\
    \n图5.1　`Python`编程语言知识图谱（来源：NRD Studio）\n\n知识图谱的构建是一个复杂的过程，涉及从多种来源获取、整合和处理大量数据，包括结构化、半结构化和非结构化数据，通常可以分为以下步骤。\n\
    \n①数据收集：从数据库、网页、文本等数据源中收集实体、关系和属性等信息。\n②数据清洗：对收集的数据进行清洗和预处理，包括去除重复数据、格式化数据、统一数据格式等。\n\
    ③实体抽取：从文本中抽取实体，并进行分类和标注。\n④关系抽取：从文本中抽取实体间的关系，并进行分类和标注。\n⑤属性抽取：从文本中抽取实体和关系的属性，并进行分类和标注。\n\
    ⑥数据建模：将抽取的实体、关系和属性信息转化为图形化的知识图谱模型。\n⑦知识推理：通过算法和模型对知识图谱进行推理，生成新的知识。\n\n知识图谱的应用领域非常广泛，包括但不限于搜索引擎、智能客服、自然语言处理、数据分析等。一些典型应用如表5.[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)3所示。\n\
    \n表5.3　知识图谱的一些典型应用\n\n![](Text/https:/res.weread.qq.com/wrepub/CB_3300196873_56EAHk6UO7DW6Lt3M36YE6fg3HC3jx3k930a3oC3kq3jx3LN30e3UH6cO6YE6ok3QD3bn42v5Lc37db7.jpg)\n\
    \n#### (3) 生成式人工智能：数据勘探的“思维助手”\n\n生成式人工智能是近年来人工智能领域中最引人注目的技术之一。与传统的分析型人工智能（如分类、回归等）不同，生成式人工智能旨在通过学习数据中的模式和规律，生成与训练数据风格一致的新内容。这一技术的突破性进展，不仅改变了我们对人工智能能力的认知，还为多个领域带来了革命性变化。\n\
    \n生成式人工智能的核心技术包括生成对抗网络(`Generative Adversarial Networks`，`GANs`)、  \n变分自编码器(`Variational\
    \ Auto Encoder`，`VAE`)、`Transformer`等。这些技术通过不同的方法实现内容生成，各有特点。\n\n● 生成对抗网络\n\n\
    生成对抗网络由生成器(`Generator`)和判别器(`Discriminator`)两个神经网络组成。生成器负责生成数据样本，判别器则判断输入的数据是来自真实世界，还是由生成器生成的。通过多轮的对抗训练，生成器逐渐学会生成与真实数据难以区分的样本。\n\
    \n● 变分自编码器\n\n变分自编码器是一种生成模型，它不仅能学习如何重建输入数据，还能学习数据背后的潜在结构。通过将数据映射到一个结构化的潜在空间（通常假设该空间中的变量服从高斯分布），模型可以从这个空间中随机采样，从而生成新的、与原始数据相似的样本。\n\
    \n● `Transformer`\n\n`Transformer`是2017年由Google研究团队提出的一种神经网络架构，核心是自注意力机制。它最初用于处理语言，能同时关注句子中所有词语，大幅提升了模型的训练效率和理解能力。后来人们发现，这种机制也适用于图像、声音等其他类型的数据，因此`Transformer`如今已成为人工智能多个领域的基础架构。\n\
    \n生成式人工智能的技术日新月异，其应用场景也极为广泛，几乎涵盖了所有需要内容生成的领域，表5.4列出了一些典型的应用，供读者参考。\n\n表5.4　生成式人工智能的一些典型应用\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/CB_3300196873_56EAHk6UO7DW6Lt3br6kb3Do3PR6nt3D230i3PQ3bm3o56kd30c6U96gT6jt3k83fv3LK42v5Lc799c1.jpg)[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)le=\"\
    width:100%;\"/>\n\n### 3. “东南亚数字经济渗透率”研究案例\n\n以往为经管研究寻找合适数据时，大多是通过借鉴、仿效类似研究文献或者基于研究者个人经验来寻找的，而人工智能为经管研究提供了强大助力。以研究“东南亚数字经济渗透率”为例，将研究问题输入至生成式人工智能大模型，要求它给出研究问题涉及的数据需求清单以及出处。大模型给出了课题涉及的核心数据变量，包括移动支付覆盖率（央行报告）、电商GMV（Lazada后台数据）、数字技能培训人数（东盟教育数据库），并自动推荐替代数据源，如Grab出行日志中的支付方式分布、Facebook广告投放行业分类等。这为上述案例在研究数据范畴上提供了深刻的洞见。\n\
    \n## 5.1.2 AI+数据抓取\n\n本小节所涉及的经管研究中的数据抓取，主要指通过技术手段（如爬虫程序）从网页、数据库或开放平台中自动化提取结构化数据与非结构化数据，用于经济模型构建、市场分析或商业决策支撑。\n\
    \n### 1. 数据抓取面临的挑战\n\n在数字化时代，数据的重要性不言而喻，爬虫程序作为获取数据的关键工具，一直发挥着重要作用。然而，传统爬虫技术在实际应用中面临诸多挑战，这限制了数据获取的效率和准确性。\n\
    \n现代网页结构日益复杂，并广泛使用`JavaScript`和`CSS`进行渲染和交互。以电商网站为例，商品详情页不仅包含基本商品信息，还可能包含商品推荐等内容。这些元素嵌套在多层`HTML`标签中，且命名和结构缺乏统一规范，导致传统爬虫技术难以准确解析和定位所需数据。\n\
    \n同时，许多网站采用动态加载技术，即页面初始加载时仅包含部分基本内容，其他关键信息如图片、视频、评论等，会在用户与页面交互（如滚动、点击）时，通过`JavaScript`\
    \ 脚本从服务器获取并加载。这种情况下，采用传统爬虫技术仅能获取页面的初始`HTML`代码，而无法抓取动态加载的内容。\n\n再者，随着数据价值的提升，为保护数据安全和服务器性能，各大网站纷纷设置反爬虫机制。常见手段包括IP封禁、验证码验证及`User-Agent`检测等。据统计，超过80%的大型网站设有不同程度的反爬虫机制，这对合规前提下的采用传统爬虫技术的数据采集工作造成极大障碍。\n\
    \n而且，传统的爬虫程序维护成本高，需人们投入大量时间和精力。由于网站页面结构和内容频繁更新，爬虫程序也得随之调整优化。若网站修改了数据标签名称或位置，爬虫程序的解析规则也需相应调整，否则无法正确获取数据。随着反爬虫机制的升级，开发者要不断研究符合网站许可的访问规则的新策略，并更新爬虫程序，这增大了开发维护的难度与成本。此外，采集大规模数据时，还需考虑服务器资源消耗、数据存储管理等问题，这又进一步增大了维护的复杂性。\n\
    \n### 2. AI赋能数据抓取的技术解析\n\n基于AI的爬虫技术为数据抓取提供了全新的解决方案。将自然语言处理、机器学习等AI技术用于数据抓取，能够从网页、数据库等异构数据源中高效提取结构化数据和非结构化数据，使得经管研究中高频、多维数据的实时获取成为可能。\n\
    \n其中，自然语言处理技术在这一过程中起到了关键作用。自然语言处[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)理技术使爬虫程序能够深入理解网页内容：通过分词、词性标注、命名实体识别等技术，爬虫程序能够精准地从网页中提取关键信息，而不是仅进行简单的文本抓取。以新闻网站为例，爬虫程序利用自然语言处理技术，可以自动识别新闻标题、正文、作者、发布时间等元素，将非结构化的新闻文本数据转化为结构化数据，以便后续的存储、分析和利用。\n\
    \n同时，机器学习技术的引入显著提升了爬虫的自适应能力。传统的爬虫程序在处理复杂多变的网页结构时常常力不从心，而机器学习技术能通过分析大量网页数据，自动识别并总结网页结构的模式与规律。当爬虫程序访问新网站时，可依据已学模式智能调整抓取策略，从而迅速地进行精准定位并提取所需信息。例如，在抓取电商网站的数据时，应用了机器学习的爬虫程序能根据各平台页面布局的特点，自动识别商品图片、价格、描述及评论等内容，实现高效的数据抓取。\n\
    \n而在应对反爬虫机制方面，AI也展现了独特优势。在遵守网站许可的访问规则的前提下，通过机器学习技术分析大量正常用户的访问行为数据，可以建立有效的合规访问模式参考模型。开发者借助这些模型，可优化爬虫程序的请求策略，如合理控制访问频率、随机化请求时间间隔的`User-Agent`等以实现合法合规的访问和数据抓取。\n\
    \n### 3. 应用场景\n\n#### (1) 金融领域：洞察市场先机\n\n在金融领域，将AI与爬虫技术相结合构建AI爬虫系统，可为投资者和金融机构提供强大的市场分析工具。该系统可以实时抓取各大金融新闻网站、社交媒体平台及证券交易所的海量数据，包括股票价格走势、财经新闻、公司财报和投资者情绪等；然后对这些数据进行深度分析，如利用自然语言处理技术对新闻和社交媒体文本进行情感分析，以判断市场情绪的乐观或悲观的倾向；此外，还可据此生成预测模型，用于预测股票价格波动和行业发展趋势。因此，金融机构利用AI爬虫系统，可实时跟踪数千只股票的信息，并根据市场情绪和数据分析结果，及时调整投资组合，从而有效降低投资风险，提升投资决策的准确性和时效性。\n\
    \n#### (2) 电商行业：精准运营\n\n利用AI爬虫系统快速抓取各大电商平台的数据并进行深度分析，企业能更好地制定合理的定价策略、优化库存管理、及时调整营销策略。AI爬虫系统能监测竞品的促销信息，并分析该产品的历史价格走势、市场需求弹性，以及企业自身的成本和利润空间，为企业提供是否跟进促销的决策建议。若企业根据建议做出合理调整，可避免过度降价对利润的影响，从而有效地维护产品竞争力。\n\
    \n#### (3) 学术研究：助力知识快速获取与整合\n\n在学术研究领域，AI爬虫系统为科研人员提供了极大的便利。AI 爬虫系统能在学术数据库、论文发表平台等网站上批量抓取科研论文、实验数据、研究报告等资料，并通过文本分类、关键词提取、知识图谱构建等手段，对这些海量的学术资料进行整理和分析，帮助科研人员快速了解研究领域的前沿动态、梳理研究脉络、发现潜在的研究方向和创新点。以医学研究为例，AI\
