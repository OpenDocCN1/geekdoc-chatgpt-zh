    基于诊断结果，可以进行结构优化与理论补全，通过“理论补全－结构重组－跨学科建模”增加研究深度。如图 8.4 所示，应用智慧引文检索工具`Scite`，能够从文献全文中提取和分析相关观点陈述，然后通过\
