    论文揭示了 AI 推动经管理论创新的核心机制：通过将组织现象“数据化—算法化—模块化”，重构理论构建的认知路径。在数据化层面，AI 将组织中的隐性知识（如用户偏好、管理经验）转化为可计算的结构化数据，为理论提供量化基础；在算法化层面，以机器学习技术替代传统的逻辑演绎，自动识别数据中的模式，如小米“中台”对
    14 类通用业务场景的提炼；在模块化层面，AI 将复杂的组织能力拆解为标准化组件，使理论能够以“搭积木”的方式解释能力组合与演化。这种创新本质上是“技术认识论”对经管研究的渗透，当
    AI 成为组织的“数字神经系统”时，理论构建必须从“人类中心主义”转向“人机协同”。论文中，小米“中台”既作为研究对象，又作为理论构建的方法论工具，这种双重身份印证了
    AI 正在重塑经管理论的本体论基础——组织不再是“人的集合”，而是“人与 AI 协同的知识处理系统”，而理论只有基于这一前提，才能解释数智化时代的组织竞争逻辑。


    可以预见，未来经管理论创新将呈现“技术定义问题—数据驱动假设—算法验证模型”的新范式。AI 不仅是研究工具，更成为理论构建的核心变量，推动经管科研从对“组织行为”的描述，转向对“人机协同知识处理流程”的建模，推动数智化时代经管领域的理论创新。


