    ![](img/txt008_12.jpg "pagenumber_ebook=225,pagenumber_book=216")


    The document vector is represented by w1:N. The variational inference method is
    used to solve for the latent topic distribution. The `EM Algorithm` is a common
    method for estimating parameter latent variables. It is an iterative algorithm.
    In the E-step (`Expectation Step`), if the parameters are known, the optimal latent
    variable Z is inferred based on the training data. In the M-step (`Maximization
    Step`), if the value of the latent variable Z is known, maximum likelihood estimation
    of the parameters can be performed.


    Variational Inference E-step. Based on parameters η and δ, calculate the expectation
