    \n\uFEFF\n\n第1章　绪论\n\n计算机科学家和数据工程师在自然语言处理 (Natural Language Processing，NLP)和机器学习\
    \ (Machine Learning，ML)等相关领域已经开展了二十多年的研究工作。现今，自然语言处理和机器学习工具在应用中随处可见，例如，帮助用户更好理解自己需求的搜索引擎，能够精准定位用户问题的客服机器人，可以实现安全驾驶的导航语音助手。当用户在智能搜索引擎的搜索框中输入一个问题时，这个问题就会被自然语言处理工具解析，将它从一个人类语言可理解的句子转变为机器可理解的查询，以便搜索引擎对其进行解释和响应。机器对语言的学习与人类在小时候学习语言并无不同，首先是对简单的句子和短语进行学习，然后是复杂的句子和段落学习。数据工程师不断向系统输入数据，根据对结果的评估，进行反复的实验和尝试。在苹果手机中的一个典型应用是Siri，它被编写为能够正确理解用户的询问并做出相应的回答，这需要对大量的日常语音材料进行学习。机器学习工具能够像人类一样去思考问题，从大数据中训练程序，其目的是让程序能够对数据中隐含的模式进行解释，从而实现自主学习。"
