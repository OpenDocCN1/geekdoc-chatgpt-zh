    ![](images/txt001_19.jpg "pagenumber_ebook=37,pagenumber_book=28")


    `BeautifulSoup`提供对网页内容进行定位的功能接口，首先开始的操作是将下载的内容即`HTML`网页解析为一个`soup`文档，然后使用函数`find()`以及`find_all()`匹配所需的对象和内容。由于一些`HTML`格式网页存在标记标签没有闭合和缺少引号等问题，例如：


    ![](images/txt001_20.jpg "pagenumber_ebook=37,pagenumber_book=28")


