    学习模型选择哪个假设取决于归纳偏好，是偏向更为一般化的选择，还是偏好更为具体化的解释。假设1是从证据材料和案由两个特征中学习了结果，假设2是从证据材料特征中学习了结果，假设3是从案由特征中学习了结果。假设1要比假设2和3更加具体，哪种假设更好将由模型的泛化性能来衡量，即该假设在测试集上的匹配情况。


    从表2.1中选择案件编号3、4、6组成测试集，如表2.3所示。可以看出，案件3、4、6都不符合假设1，案件4、6不符合假设2，案件3、4、6都不符合假设3。因此，从测试样本的匹配数量考虑，假设1的得分为0，假设2的得分为1，假设3的得分为0。这说明在当前的问题上，学习模型偏好选择更为一般化的假设，可以推测的部分原因在于胜诉结果与较少的特征有关，例如证据材料。假设1的条件太过具体，包含两个特征的取值，可能有一个特征与是否胜诉关系不大，但是模型却从训练集中学习了太多的细节，将与判决结果关系不大的特征引入到模型中。


