    在图3.1中，从词素的角度理解一般性单词“Unpacked”，“pack”表示包装的意思，构成了词的核心意思，在词素中占据最重要位置，称为词根。“Un”在词的前面位置，表示反向的动作，称为前缀。“Unpack”占据词的主要位置，称为词干，表示打开的意思，词的主要含义由词干确定。“ed”在词的后面位置，表示词语的过去状态，称为后缀。综合起来看，“Unpacked”的意思是先包装起来，再拆开的状态，直接的意思就是打开的。


    从词素的角度理解法律词汇“Undefended”，“defend”表示辩护的意思，在法律上是指辩护方为了达到减轻罪行或者无罪的目的，提出有利于被告方的理由和相关证据的活动，具体行为包括对指控方的控诉进行反驳和申辩。前缀“Un”表示放弃某种行为，或者免除某种行为，或者没有进行某种行为。词干“Undefend”表示放弃辩护或者没有进行辩护。后缀“ed”表示已经发生了的过去式，是一种结果状态。综合起来看，“Undefended”的意思是形容词性的没有抗辩的，没有进行抗辩的原因可能有多种情况。例如，被告缺席审判，被告没有进行答辩陈述，被告没有呈递到案状，等等。与其有关的法律术语有“Undefended
    case”即无抗辩案件、“Undefended divorce”即无抗辩离婚、“Undefended lawsuit”即无抗辩诉讼。


    词是在句子结构中可以抽取出来的最小的形式单元和意义单元，词和词素很容易混淆，虽然两者有很大的关联，但区别也是较明显的。词是可以独立出现的，有的词素可以独立出现，而有的词素则不可以独立出现。例如，“case”的单数形式可以独立出现，“cases”复数形式也可以独立出现。“cases”中的词素“case”可以独立出现，“s”不可以独立出现。但一个词素可以独立出现时，它一定具有独立的意义，也就是词根。例如，“case”具有独立含义，意思是案例，“case”既可以作为单词出现，也可以作为词根派生出其他单词。不能独立出现的词素具有修饰性作用，本身没有具体含义。例如，“s”表示复数或者第三人称单数，本身没有实际描述内容。


    从词和词素的关系来看，词素可以独立出现，也可以派生出其他形式的新词。不需要依附于其他词素，可以独立成词的词素称为自由词素，有时也称独立词素或者无边界词素。例如，“air”是自由词素，“line”也是自由词素，这两个自由词素可以组成一个合成词“airline”，但是合成词“airline”和单独出现的词组“air
    line”含义有所不同，“airline”专指航空公司，而“air line”还有直线和空气管路的意思。边界词素是词根加上一些词缀形成的部分，包括屈折词素和派生词素。


    屈折词素是指在词根后面所添加的后缀，从语法的角度来看，为词附加了数量、词性、时态等语法层面特性。英语中包括8个屈折词素，“’s”表示名词的所有格，“s”表示名词的复数形式，还可表示动词的第三人称单数，“ing”表示动词的现在分词，“ed”表示动词的过去式，“en”表示动词的过去分词，“er”表示形容词或副词的比较级，“est”表示形容词或副词的最高级。例如，“defendants”是指多个被告人，“s”将“defendant”变为复数。“defended”是动词抗辩的过去式或者形容词抗辩的意思，“ed”将动词“defend”变为过去式或者形容词。


    派生词素是与词根结合以形成新的含义的词缀，新词的含义随着词缀的不同而不同。例如，单词“undefendable”中的“defend”是词根，为动词抗辩之含义，后缀“able”将动词抗辩转换为形容词可抗辩的，前缀“un”将形容词可抗辩的转换为反义词不可抗辩的。单词“biweekly”中的“week”是词根，为名词一个星期之含义，后缀“ly”将名词星期转换为形容词一个星期的，前缀“bi”将形容词一个星期的转换为两个星期的。上述例子说明派生词素“un”和“bi”改变了词根的含义，“un”采用与词根相反的意思，“bi”采用两倍于词根数量的含义。


    词干与词根的关系可以从单词“unpacked”形态中看出来，将后缀“ed”去掉后的部分是为词干，再将词干中的词缀“un”去除，获得部分为“pack”，如果不能再分割，即为词根。相应地，单词“packed”去掉后缀，获得的是词干“pack”，也是词根。因此，自由词素对应的词干就是词根，而派生词素对应的词干就不是词根。


    ### 3.1.3 nlkt和 polyglot词素和词干


    按照搜索引擎和信息检索的术语说法，词干是将词的多余部分去除，剩下主要部分。搜索引擎使用词干分析方法来检索用户查询的网页，例如，用户输入的查询为“defendant”，词干分析方法从查询词中获得词干“defend”，基于词干连接的网页既包括含有“defendant”的网页，也包括含有“defendable”的网页。


    自然语言处理工具包`nlkt`的模块`PorterStemmer`对词干的识别有两种方法。第一种方法是构建一个非常大的词典，将每一个单词都映射到词干，缺点是维护词典的代价较高。第二种方法是使用一定的规则，定义如何从词语中获得词干，缺点是不能处理所有的情形，规则的定义是不完整的，但是大多数单词的词干识别是正确的，少数的错误是可以被允许的。因此，基于规则的方法逐渐被广泛使用。`nlkt`的`PorterStemmer`的使用如下:


