    # 5.3.5 词条化


    `lower()`方法将大写改成小写，可以将仅仅是字母大小写区别的两个单词合并到同一个词项，`lemmatize()`可以将因语法因素产生的异形同义的多个单词合并到同一个词项，停用词列表可以将文本中大量没有实际含义的词去除。通过小写转换、词形还原和停用词去除等预处理操作，大大降低了模型的复杂度。前述的字符串在未预处理之前，输出的词项为39个，不同词项34个。然而在经过预处理之后，输出的词项为15个，不同词项14个。如图5.55所示：


