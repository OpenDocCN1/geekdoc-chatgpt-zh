    正类分布的参数μ1和![](images/txt004_23.jpg "pagenumber_ebook=120,pagenumber_book=111")的极大似然估计为:


    ![](images/txt004_24.jpg "pagenumber_ebook=120,pagenumber_book=111")


    负类分布的参数μ2和![](images/txt004_25.jpg "pagenumber_ebook=120,pagenumber_book=111")的极大似然估计为:


