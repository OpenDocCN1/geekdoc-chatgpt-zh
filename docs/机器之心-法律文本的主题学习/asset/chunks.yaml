    This equation is the `sigmoid function` in the logistic regression model. The
    h(y) function is called the canonical response function. For a generalized linear
    model, supervised topic learning can be performed by estimating the expectation
    of y.


    The topic vector of a document is represented by z1:N. In the `SLDA Model`, the
