    beta分布可以理解为概率的概率，B(α，β)是一个系数，α大约是已经发生事件中正面朝上的次数，β大约是已经发生事件中反面朝上的次数，beta分布的期望为α/(α+β)。如果已经投掷了100次，有50次正面朝上，有50次反面朝上。beta分布概率如图4.10所示:


