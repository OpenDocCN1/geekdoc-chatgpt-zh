    \ \"pagenumber_ebook=180,pagenumber_book=171\")\n\n6.5　混合特征选择\n\n6.5.1　混合器选择方法\n\
    \n特征选择混合器模型将过滤器方法和封装器方法结合起来，对特征空间进行两次降维处理。第一次降维处理采用过滤器方法，第二次降维采用封装器方法。过滤器采用独立性准则，评价特征子集的方法就是根据数据的内在特性，例如观察理论值和实际值的偏差、特征值与类别的相关性以及样本之间的距离差异等等。封装器采用关联性准则，首先确定一个具体的机器学习算法，然后该机器学习算法用给定的特征子集对样本集进行分类，评价函数用分类精度来衡量特征子集的优劣。如果分类性能不满足目标，重新选择特征子集，需要多次调用学习算法，时间复杂度较大，适合特定的学习算法，可能不适合其他一些学习算法。常见的过滤器方法有卡方检验、相关性、距离和信息增益率等，常见的封装器方法有分类器准确率、召回率以及F1度量等，过滤器和封装器的优缺点和适用情况如表6.2所示:\n\
    \n表6.2　两种类型的评价函数的优缺点和适用情况\n\n![](images/txt006_88.jpg \"pagenumber_ebook=181,pagenumber_book=172\"\
    )\n\n卡方检验最基本的思想就是通过观察实际值与理论值的偏差来确定理论的正确与否。具体做法通常是先假设两个变量确实是独立的，称为原假设。实际值称为观察值，理论值是在两者确实独立的情况下应该有的值。观察实际值与理论值的偏差程度，如果偏差足够小，可以认为误差是很自然的样本误差，由于测量手段不够精确导致或者偶然发生的，两者确实是独立的，应该接受原假设。如果偏差大到一定程度，使得这样的误差不太可能是偶然产生或者测量不精确所致，可以认为两者实际上是相关的，应该否定原假设。理论值为E，实际值为x，偏差程度的计算公式为:\n\
    \n![](images/txt006_89.jpg \"pagenumber_ebook=181,pagenumber_book=172\")\n\n上式是卡方检验所使用的差值衡量公式，将提供的数个样本的观察值x1，x2，…，xn代入到式中就可以求得卡方值，用这个值与事先设定的阈值比较，如果大于阈值，即偏差很大，就可以认为原假设不成立。反之，则认为原假设成立。\n\
    \n相关性度量的基本思想是好的特征子集所包含的特征应该是与分类类别的相关度较高，差的特征子集所包含的特征应该是与分类类别的相关度较低，而且两个特征之间的相关度是较低的。可以使用线性相关系数来衡量特征向量之间线性相关度:\n\
    \n![](images/txt006_90.jpg \"pagenumber_ebook=182,pagenumber_book=173\")\n\n距离度量的基本思想是类别内的样本之间距离尽可能小，不同类别间的样本距离应该尽可能大。距离度量又称相似性度量，常用的距离度量包括欧氏距离、标准化欧氏距离和马氏距离等。\n\
    \n![](images/txt006_91.jpg \"pagenumber_ebook=182,pagenumber_book=173\")\n\n过滤器由于与具体的分类算法无关，因此其在不同的分类算法之间的推广能力较强，计算量也较小。而封装器由于在评价的过程中应用了具体的分类算法进行分类，因此其推广到其他分类算法的效果可能较差，而且计算量也较大。\n\
    \n在设计机器学习和分类算法时，可以根据实际情况，综合采用独立性准则和关联性度量方法，这样能更好地和应用场景中分类方法相结合，找到能够使分类性能更好的特征子集。\n\
    \n6.5.2　信息增益率\n\n好的特征子集中属于同一类的那些特征值应当要单一，属于不同类的那些特征值要离散。对于一个特征，特征空间有这个特征和没有这个特征的两种情况下，数据集的信息量分别是多少，计算这两种情况下的差值就是这个特征所包含的信息量。包含这个特征的信息量称为信息熵，不包含这个特征的信息量称为条件熵。信息熵会倾向于特征取值较多的特征，信息增益率可以避免特征值过多导致的问题。\n\
