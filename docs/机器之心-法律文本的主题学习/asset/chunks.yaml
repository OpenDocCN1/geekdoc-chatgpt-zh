    ## 4.5 狄利克雷分布


    ### 4.5.1 多项分布


    对于随机事件`X`，事件发生用`1`表示，不发生用`0`表示。`X`的发生概率为`θ`，不发生的概率为`1-θ`，这种分布称为伯努利分布。伯努利试验是一次试验，并且只有两个简单的试验结果，发生或不发生，正面或反面，等等。例如，将硬币抛出一次，事件正面朝上的概率为:


    ![](images/txt004_27.jpg "pagenumber_ebook=120,pagenumber_book=111")


    将伯努利试验独立重复进行`n`次，随机事件`X`发生的次数为`k`，也就在`n`次试验中事件发生`k`次，随机变量概率分布就是二项分布。例如，将硬币抛出`n`次，正面朝上出现`k`次的概率为:


    ![](images/txt004_28.jpg "pagenumber_ebook=120,pagenumber_book=111")


    前`k`次试验正面朝上，后面的`n-k`次试验正面朝下，根据概率乘法原理，这一事件的概率为`θk(1-θ)n-k`，`n`次试验出现`k`次正面朝上的事件组合有`![](images/txt004_29.jpg
    "pagenumber_ebook=121,pagenumber_book=112")`种。多类分布是将伯努利分布的实验结果从两种改为多种，即`K`种结果。例如，投掷一次骰子，第`k`面朝上的概率为:


    ![](images/txt004_30.jpg "pagenumber_ebook=121,pagenumber_book=112")


    将二项分布的每次两种试验结果，推广至每次试验有多种结果，且重复进行多次独立试验，这就是多项分布。例如，投掷`n`次骰子，出现第一面朝上的次数为`m1`，第二面朝上的次数为`m2`，第`K`面朝上的次数为`mK`，其概率密度为:


    ![](images/txt004_31.jpg "pagenumber_ebook=121,pagenumber_book=112")


    多项分布的概率公式是一种多项式展开式的通项。根据乘法公式，对`(X1+X2+…XK)`随机进行`n`次试验的概率为`(θ1+θ2+… +θK)n`，事件`(X1+X2+…XK)`为一个必然事件，对必然事件进行`n`次采样的概率之和为`1`。当把多项式展开很多项时，根据概率的加法公式，说明展开项都是互不相容事件对应的概率，即多项分布是多项式的一个展开项的通项，或者说是一个特殊事件出现的概率，例如`X1`出现`m1`次，`X2`出现`m2`次，`Xk`出现`mk`次。在主题模型中，`X1`为第一个主题编号，`m1`是被分配为第一个主题的词数。`Xk`为第`k`个主题编号，`mk`是被分配为第`k`个主题的词数。


