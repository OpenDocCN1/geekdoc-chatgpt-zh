    ### 8.2.3　法律文本监督学习模型


    在法律文本自然语言处理和应用领域，其一般处理过程涉及信息检索和问题回答。在信息检索任务中，根据法律术语和某些主题查询，在历史的判例中找到相关判例文本。在法律问题回答任务中，需要判断这些文本是否支持查询，可以将查询文本当成一个需要比较的法律文本，因此又称为文本蕴含。如果将查询定义为判例对原告的支持与否，判例的案件描述部分为要进行分类的文本，判例的判决部分为监督信息，此时任务就变成对相关文本进行分类。法律文本监督学习模型的处理过程如图8.3所示，分为7个步骤:


    ![](images/txt008_17.jpg "pagenumber_ebook=226,pagenumber_book=217")


