    7.3.3　文本相似度


    衡量向量空间模型中的两个文本之间相似度，可以使用欧式距离、绝对值距离以及夹角余弦等。根据两个文本在主题分布的差异，可以计算两个法律文本之间的余弦相似度:


    ![](images/txt007_59.jpg "pagenumber_ebook=205,pagenumber_book=196")


    docsim(di，dj)是法律文本di和文本dj之间的余弦相似度。假定第0篇文本为需要匹配的新文本，计算与其余每一篇法律文本的余弦相似度，返回余弦相似度值最大的法律文本dmax:


    ![](images/txt007_60.jpg "pagenumber_ebook=205,pagenumber_book=196")


    余弦相似度值最大的法律文本是为最相似的文本，在θ矩阵中找到第dmax行，获得该法律文本主题分布中的各个主题编号。


