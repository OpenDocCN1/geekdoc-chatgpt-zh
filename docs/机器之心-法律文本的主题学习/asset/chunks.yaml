    \n学习模型以预测为正类的概率作为输出结果，按照预测概率的大小，对验证集样本的分类结果进行排序，排在前面的样本被学习模型认为是把握性大的样本，排在后面的样本被学习模型认为是把握性小的样本，如表2.5所示。\n\
    \n表2.5　混淆矩阵\n\n![](images/txt002_27.jpg \"pagenumber_ebook=74,pagenumber_book=65\"\
    )\n\n续表\n\n![](images/txt002_28.jpg \"pagenumber_ebook=75,pagenumber_book=66\"\
    )\n\n每一次选择一个位置，在位置之前被认定为胜诉案件，即TP+FP。在位置之后的案件被认定为败诉，即FN+TN。根据实际是否胜诉情况，则在当前位置可以计算一个当前的准确率和召回率。从前到后依次选择位置，得到一组二元组值(召回率，准确率)。例如，在起始位置，TP+FP=1，FN+TN=9999，TP=1，FP=0，TN=99，FN=9900，起始位置的召回率R1\\\
    =0.01，准确率P1\\=1。在最后位置，TP+FP=10000，FN+TN=0，TP=100，FP=9900，TN=0，FN=0，最后位置的召回率R10000\\\
    =1，准确率P10000\\=0.01。在100位置，TP+FP=100，FN+TN=9900，TP=50，FP=50，TN=9836，FN=64，在 100\
    \ 位置的召回率 R100\\=0.5，准确率P100\\=0.8。以召回率为横坐标，以准确率为纵坐标，如图2.17所示:\n\n![](images/txt002_29.jpg\
    \ \"pagenumber_ebook=75,pagenumber_book=66\")\n\n图2.17　P\\_R曲线\n\n不同的用户对准确率和召回率的偏好有所不同，关注健康的用户利用因特网对医疗信息进行搜索，希望在返回的结果中不要有错误医疗信息，这种情况下准确率要比召回率重要。而证据搜集用户希望获得所有案件材料，为了避免漏掉证据，尽可能扩大搜索范围，这种情况下召回率要比准确率重要。\n\
    \n为了平衡准确率和召回率之间的互斥关系，用一个平衡度量综合考虑准确率和召回率的影响。当准确率和召回率相等，平衡度量就等于准确率或召回率。当准确率和召回率不相等，平衡度量就处于两者之间。F1值度量是一种查准率和查全率的调和均值，它赋予查准率和查全率相同的权重:\n\
