    ## 3.2 法律文本词法分析


    ### 3.2.1 词法分析


    对自然语言文本的准确理解是建立在词法分析的基础之上的，词法分析是将某段文本切割成词、短语和一些有意义单元的过程或步骤。例如，一段英语文本为“A process
    is used to select jurors by a judge or counsel”，英语分词的结果一般就是单词，但是英语存在一个单词多个词性，把握一个单词的含义，需要结合在句子语法结构中的地位和作用。英语不同的词之间有分割符号，是比较容易分词的。而汉语的一段文本是连续的，词语与词语之间不存在分割符号。例如，汉语的一段文本为“该案法官和律师按照程序挑选了一些陪审员”。汉语在分词上不同于英语，需要明确词语之间的界限，用符号“/”对词语进行切分，切分结果可能是“该案/法官/和/律师/按照/程序/挑选了/一些/陪审员”。


    一段文本可能包含一些特殊含义的名词或者短语，例如，在英文文本“License is required for sale of nursery stock by
    Act 189 of 1931”中，如果将“Act 189 of 1931”分割为“Act/189/of/1931”四个单词，显然是不合适的。“Act 189
    of 1931”是一个意义上不可分割的整体，表明一个在1931年颁发的编号为189的法案。这类特殊的名词称为命名实体，在自然语言中，地位和作用明显高于其他的句子成分，命名实体往往包含关键信息或者包含信息检索中所需求的答案。同样地，“nursery
    stock”是一个意义上的整体，如果将其分割为“nursery/stock”，含义将出现很大的偏差。


    某段中文文本为“依据《中华人民共和国刑法修正案 (九)》的相关规定，检察院以涉嫌盗窃罪对犯罪嫌疑人钱某作出批准逮捕决定”，中文分词的结果可能是“依据/《中华人民共和国刑法修正案
    (九)》/的/相关规定/，检察院/以/涉嫌盗窃罪/对/犯罪嫌疑人/钱某/作出/批准/逮捕/决定”，不可以将“刑法修正案 (九)”分割为“刑法/修正/案/(九)”。这里的“《中华人民共和国刑法修正案
    (九)》”是命名实体，是法律文本中的法律渊源，也是法律自然语言处理进行法律领域分类、问答系统、自动文本摘要和信息检索的关键信息。


    词法分析将一段文本输出为一些具有完整意义的词或者短语序列，通过对语言词元素进行基本定位，获得灵活的分词颗粒度，既确保含义上的大粒度，又保持了词语上的小粒度。对于中文法律文本来说，对照法律术语和词汇，将连续词汇的法律文本切割为在法律意义上具有完整性和合理性的词语序列。对于英文法律文本来说，需要将特殊的命名实体作为一个整体输出到序列中。


    ### 3.2.2 词性标注


    句子中的词语承担的作用和地位是不一样的，在句子语法结构中，相同位置的词语一般具有相同的词性 (`Part of Speech`，`POS`)。一类词或者词法项具有相同的语法特性称为词性，相同词性的词语在句子中具有类似的性质、活动或者行为。例如，在汉语句子“原判根据相关的证人证言认定被告具有非法占有的主观故意”中，“原判/证人证言/被告/主观故意”都为名词，“认定/具有”都为动词，“相关的/非法占有的”都为限定词，“根据”是为介词。在汉语句子“王某以欺骗的方式非法占有他人巨额财物”中，“王某/方式/财物”都为名词，“占有”为动词，“他人”为限定词，“欺骗的/巨额”为形容词，“非法”是副词，“以”是为介词。在汉语句子“张某通过编造的谎言欺骗物业公司管理人员”中，“张某/谎言/物业公司/管理人员”都为名词，“欺骗”为动词，“编造的”为形容词，“通过”是为介词。在上述例子中，同样为“占有”，因位置和作用的不同，词性也不同，一个词性为限定词，一个词性是动词。“欺骗”一个词性为形容词，另一个词性为动词。


    英语词性有名词 (`noun`)、动词 (`verb`)、形容词 (`adjective`)、副词(`adverb`)、冠词 (`article`)、数词
    (`numeral`)、介词 (`preposition`)、代词 (`pronoun`)、限定词 (`determiner`)。在英语句子“the jury
    has easily reached a consistent verdict on this issues submitted to the court
    for determination”中，“jury/verdict/issues/court/determination”为名词，“has/reached/submitted”为动词，“con-sistent”为形容词，“the”为冠词，“a”为数词，“on/to/for”为介词，“this”为代词，“easily”为副词。在英语句子“I
    am the public defender appointed to your case”中，“I”为代词，“am/appointed”为动词，“the”是冠词，“public”为形容词，“defender/case”为名词，“to”为介词，“your”为限定词。除此以外，还有连词
    (`conjunction`)和感叹词 (`interjection`)。


    ### 3.2.3 输出词条


    在建立文本的过程中，输入到文本的是一些字符流或者字符序列。从人类的自然语言角度来看，作为语言基本单元的词语使用了不定长度的字符串。从文本中的字符流中将词语识别出来，需要预先定义词语所对应的子序列，词语是一个具有独立含义的字符串。词条
    (`token`)是词语在词典中的等价项，词条化 (`tokenization`)是指将整个文本中的字符流序列切分成子序列的过程，子序列称为词条，每个子序列在字典中的位置称为词项。在词条化的过程中，可能去掉一些标点等特殊符号。


    词语、词条和词项在大多数情况下意思是一致的，如果进行严格区分，三者是有区别的。词语是语言学中的范畴，指的是在人类使用语言过程中形成的语言单位。词条是信息检索中的对应词语的索引，指的是文本中出现的与词语一致的字符串序列的一个实例。词项是在词典中词条对应的字符串序列相同但是含义不一样的词条类，指的是形式相同意义不同的词条集合。例如，建立一段英文法律文本的输入序列为“According
    to legal documents，a judge will serve with a summons or writ to show an administrator’s
    right to control of assets”。根据词典，词条化过程是将完整文本输入序列切分为子序列，输出为“According/to/legal/documents/，/a　/judge/will/serve/with/a/summons/or/writ/to/show/an/administrator/’s/right/to/control/of/assets”。词条即子序列的数量为24个，其中1个标点符号，3个“to”，2个“a”。去掉标点符号，合并相同词条，词语数量为20个。如果将“to”和“a”作为高频词去除，剩下的18个词语即为词项。


    建立一段中文法律文本的输入序列为“在协议签订后，委托双方认可的有资质的资产评估机构对甲方投入的资产进行评估”。根据汉语词典，词条化输出为“在/协议/签订/后/，/委托/双方/认可/的/有/资质/的/资产/评估/机构/对/甲方/投入/的/资产/进行/评估”。汉语词条即子序列的数量为22个，其中1个标点符号，3个“的”，2个“资产”。去掉标点符号，合并相同词条，词语数量为18个。如果将“的”作为高频词去除，剩下的17个词语即为词项。


    从文本中输出词条首先要进行句子切分，通过句子结构中的句子分割标点符号来确定句子的边界。然后，对句子进行词切分，需要确定词的边界。汉语的分词稍微复杂些，确定词边界需要结合更多的内容。英语的词切分较为容易，一般词之间的分割符号是空格。但是有些符号是作为分隔符还是作为词语一部分，存在不同情况。英语中的连字符可以作为新的词语，例如，无线局域网Wi-Fi，输出为一个词条。连字符可以在换行时连接一个词语的前部分和后部分，在输出词条时应为一个词条。连字符也可以作为多个词语组合，例如，“long-distance”的意思是两个词的合成，在输出词条时应为两个词条。英文的单引号在作为名词所有格时，应该和前面的名词输出为两个词条，而作为缩写标识，应该只输出一个词条。


    高频出现的词在信息检索中与文本的主题和内容的相关性不大，可以作为停用词 (`Stop Words`)自动过滤掉，以便减少自然语言处理时间和节省更多的存储资源。停用词可以预先定义或者设置一个停用词列表，一般将虚词和数据集中的高频词作为停用词，大的停用词表有几百个停用词，小的停用词表也有十几个停用词。


    归一化操作可以精简词条，集中考虑词的含义。对词条的归一化操作的结果就是词项，不仅词形相同的多个原始词条需要合并获得词项，而且词缀不同的词条也需要进行归一化操作。对词条归一化操作包括词干提取和词形还原。词干提取一般只是针对某些含义相同的词，不考虑词性和上下文，只是将意义相同的词条放到词条类即词项当中。词形还原是去除词条中的前缀或者后缀，还需要考虑上下文和词性，还原形容词的比较级或者最高级。


    ### 3.2.4 polyglot和 nlkt分句和分词


    在自然语言处理任务中，处理对象的范围从大到小分别是篇章、段落、句子、词语和字符。在数据集中，一个文件一般对应一个篇章。在一个篇章中，段落之间的分割符号一般为回车换行，即`\r\n`。在一个段落中，句子之间分割符号有句号和空格，即“.”和纯粹的空格。


    在英语的断句处，上一句结尾有符号“.”，下一句开头首字母之前要有一个空格。否则就会出现分句错误。分句使用`polyglot.text`模块的`sentences`方法，依靠空格和句号来进行断句，空格也包括制表符`\t`。例如，定义一段英文句号“.”后包含空格的文本:


    ![](images/txt003_8.jpg "pagenumber_ebook=94,pagenumber_book=85")


    运行的结果如图3.4所示。这段文本`legal_content`共有三个句子，有三个英文句号“.”，有两个的英文句号空格的组合。实际上，`polyglot.text`根据英文句号空格来切分句子，如果将第二句和第三句之间的空格删除，即“The
    man”前面的空格，分句的结果将如图3.5所示。可以看出，`polyglot.text`将原本的第一句和第二句当作一个句子，将原本第一句的最后一个词“up”、符号“.”、第二句的第一个词“The”解析为一个新的缩略词“up.The”。


