    4.3.2　主题建模应用


    对于大量的法律文本和其他文本的处理，仅依靠词语比对来确定数据分析任务是远远不够的。挖掘词语背后的抽象主题更加有意义，这将有助于提高文本相似度计算的准确度，发现某一主题下的流行词汇。在搜索引擎的查询字段的匹配程度上，能够按照语义理解自动快速定位到海量文本数据中的词簇。


    在相似文本的比较方面，用相同词的数量或者比例来衡量可能并不准确。例如，前述的英文句子“the head controlled the man with arms”出现在法律主题占比较大的上下文中，含义是指“匪首用枪控制了那个人”。如果这句话出现在计算机科技文献主题占比较大的上下文环境中，含义是指“智能体用胳膊保护了那个人”。对于这两句话相似程度的衡量，如果纯粹用词语进行计算，相似度将为100%，如果用每个词语背后的主题分布情况进行估计，相似度将不到50%。


    语言是人们长期使用而形成的表达，也是传统文化和地域习惯的体现。语言现象是错综复杂的，其中必然包含了很多细微差异，例如一词多义和多词一义。一般的语义分析很难抓住这种细微的差异，而主题模型非常适用这种情形。例如，英文句子“Laws
    set out a set of procedures and rules”属于一词多义的情况，如果将“Laws”替换为另外一个词“Algorithm”，后面的词义就不一样了，前者描述了法律是一套规范的行为和准则，后者则强调算法产生了一些管理程序。如果从词语上来比较两者的差异，几乎没有差异。但是如果为每一个词分配一个主题标签，即使是同一个词也可以分配不同的主题标签，如图4.8所示:


    ![](images/txt004_10.jpg "pagenumber_ebook=114,pagenumber_book=105")


    图4.8　主题建模支持语义挖掘


    图中有两篇文本，一篇的主旨内容是法律方面的，另一篇的主旨内容是关于计算机的。文本中的符号“#”表示该位置的词被分配为主题标签#，符号“\*”表示该位置的词被分配为主题标签\*，下方的进度条表示该篇文本中的某个主题所占比例。假设这两篇文本的词数为1000，其中有800个词相同，使用词语计算文本相似度，相似结果为80%。如果将800个词中有600个被标记为不同的主题，200个不同词中有100个被标记为不同的主题，按照主题标签数计算文本相似度，相似结果为30%。很显然，30%的相似结果要比80%更加可靠。通过分析词背后的主题分布情况，就可以发现语言的细微差异和上下文环境作用。


    4.3.3　潜在语义分析


    在高速移动互联网和大数据时代，人们的学习、生活和工作都在网络和数据环境中进行，每天通过社交媒体发送大量的内容和文本。人们围绕着某一个话题展开讨论，发现有着共同兴趣的用户。如何存储、组织、管理和分析数据资源将是文本信息处理所面临的重要问题，传统的分析方法以词来代表语义内容，以词来匹配共同的话题。这种浅层的分析方法不能表示和解决深层或潜在的语义关系问题，可以认为，人们在使用社交媒体发表言语时，首先想到一类话题或者主题，然后再想到词语。换言之，在文本和词语之间存在一个中间的抽象连接层，正是这种抽象连接层将不同的用户关联到一个话题上。'
