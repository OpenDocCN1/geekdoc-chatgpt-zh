    ![](images/txt003_21.jpg "pagenumber_ebook=100,pagenumber_book=91")


    运行的结果如图3.11所示。可以看出，`nltk.CFG`使用一系列字符串定义文法规则，构建一个语法分析器。然后将句子传递给语法分析器，返回结果为语法生成树。与`nltk.tree`相比较而言，定义语法规则较为灵活，形式上更加简洁。


