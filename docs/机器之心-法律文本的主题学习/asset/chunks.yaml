    ### 1.5.2 Web Crawling Basics


    `url` stands for Uniform Resource Locator, i.e., a hyperlink. When parameters
    are passed to the `download_webpage()` function, it requests the web page pointed
    to by the link and returns the `HTML` markup language result. If the web page
    has been deleted or the hyperlink points to an incorrect address, an error message
    will be returned. After the crawler program downloads a web page content via the
    `download_webpage()` function, it needs to pass the next `url` to the `download_webpage()`
    function to continue downloading other web pages. If the website has a sitemap
    (navigation map), tags can be extracted using regular expressions to obtain links
    to other web pages of the site from that page.


    ![](img/txt001_14.jpg "pagenumber_ebook=34,pagenumber_book=25")


    Some websites have data updates originating from databases; the hyperlinks `url`
    of these different web pages differ only in the suffix part. The website application
    server uses the suffix as an `ID` to match backend database records. Using an
    iterator to automatically update the `ID`, web pages conforming to this structure
    can be traversed and accessed.


    ![](img/txt001_15.jpg "pagenumber_ebook=35,pagenumber_book=26")


    Following user habits and methods of accessing websites, browsing generally starts
    from the home page to select content of interest or relevance. If hyperlinks appear
    on a web page, only a portion of them are tracked and visited by users; other
    hyperlinks are often ignored due to irrelevance. The crawler program needs to
    use regular expressions and `url` tracking to visit hyperlinked web pages with
    specified content. The function `get_urls()` uses regular expressions to match
    qualified `url`s in the web page; the function `trace_pages()` retrieves hyperlinks
    from the queue, calls `download_webpage()` to download web page content, extracts
    hyperlinks from the web page by calling `get_urls()`, and places them into the
    queue.


    ![](img/txt001_16.jpg "pagenumber_ebook=35,pagenumber_book=26")


    ### 1.5.3 Web Data Scraping


    After tracking web pages and downloading them, the structure of the web page needs
    to be analyzed. In most clients or browsers, the web page source code can be displayed.
    For example, cases from the Federal Court of Australia are publicly accessible
    for free online. Enter `http://www.austlii.edu.au/au/cases/cth/FCA/2006/1.html`
    in the browser, then right-click and select "View Source". Part of the `HTML`
    code:


    ![](img/txt001_17.jpg "pagenumber_ebook=36,pagenumber_book=27")


    When scraping judgment state data, it can be found in the `<a name="Order_State">`
    element. If you need to search for the judgment number, it can be matched in the
    `<a name="Order_Num">` element. The `<a>` element is a child of `<td>`, the `<td>`
    element is a child of `<tr>`, and the `<tr>` element is a child of `<table>`.
    Regular expressions, `BeautifulSoup`, and the `Lxml` Python third-party extension
    library modules can be used for data scraping.


    `BeautifulSoup` is a Python module capable of parsing web page structures. `Lxml`
    is a Python wrapper module for parsing `XML` formats; written in `C`, its parsing
    performance is more efficient than `BeautifulSoup`. To install the `BeautifulSoup`
    and `Lxml` modules, use:


    ![](img/txt001_18.jpg "pagenumber_ebook=37,pagenumber_book=28")


    Enter `python` in the terminal to enter the scripting environment. In regular
    expressions, `.` matches any character except a newline, `*` matches the preceding
    element zero or more times, `?` matches the preceding element zero or one time,
    and parentheses `()` indicate the data to be captured between them.


    ![](img/txt001_19.jpg "pagenumber_ebook=37,pagenumber_book=28")


    `BeautifulSoup` provides functional interfaces for locating web page content.
    The first operation is to parse the downloaded content, i.e., the `HTML` web page,
    into a `soup` document. Then, the `find()` and `find_all()` functions are used
    to match the required objects and content. Since some `HTML` format web pages
    have issues like unclosed tags and missing quotes, for example:


    ![](img/txt001_20.jpg "pagenumber_ebook=37,pagenumber_book=28")


    `BeautifulSoup` needs to check for these formatting issues and begins parsing
    the `HTML` web page after the format is complete. In fact, an `HTML` web page
    consists of many markup languages represented by angle brackets. Markup languages
    control the output format of content, and these markup language tags generally
    appear in pairs to clearly define the content controlled by the tags. The relationship
    between `HTML` tags is like the relationship between files in a file system; overall,
    it resembles an inverted tree structure, where a higher-level tag can contain
    lower-level tags. Each tag has a tag name and attributes, represented by `<tag>`
    for start and `</tag>` for end. `<tag>.attrs` represents tag attributes, which
    are dictionary-type data composed of key-value pairs. `<tag>.string` represents
    the non-attribute string output controlled by the tag, i.e., the content between
    `<tag>` and `</tag>`. For example, the `<a>` tag functions as a hyperlink or anchor.
    In `<a name="Order_State">`, `name` is the attribute name, and `"Order_State"`
    is the key value of the `name` attribute. `BeautifulSoup` traverses and parses
    the tag tree structure, allowing upward traversal to parent tags, downward traversal
    to child tags, and lateral traversal to sibling tags. `BeautifulSoup` can correctly
    close tags and parse attribute values missing quotes. For web pages missing `<html>`
    and `<body>` tags, it automatically adds these two tags to make them a complete
    `HTML` tag tree. `bs4` is the abbreviation for `BeautifulSoup4`. The `prettify()`
    function method can add line breaks to `HTML` web page text.


    ![](img/txt001_21.jpg "pagenumber_ebook=38,pagenumber_book=29")


    For malformed `HTML` web pages, using the `lxml` parsing module also involves
    supplementing missing parts first, then traversing and parsing. Similarly, `lxml`
    can establish a tag tree based on `xml` traversal methods, add missing quotes
    for attribute key values, complete missing tags to ensure tag closure, and output
    the tree structure after successful parsing.


    ![](img/txt001_22.jpg "pagenumber_ebook=39,pagenumber_book=30")


    # Chapter 2 Empowering Machine Learning


    With the advent of the big data era, machine learning, which excavates the meaning
    of data, has become the brightest rising star in the computer science discipline.
    Through self-learning algorithms, data can be transformed into knowledge. The
    human process of learning knowledge indicates that past experience remains valid
    for the future; otherwise, civilization would not have emerged. Usually, when
    people pick fruit, they make judgments based on experience, tending to choose
    products that are plump in shape, vibrant in color, and crisp in sound. Initially,
    people did not know the relationship between delicious fruit and their external
    appearance. As experience accumulated, they gradually realized that delicious
    fruit possesses certain typical external characteristics. Discovering the characteristics
    of delicious fruit from all features can be said to be learning knowledge or models
    from experience. The establishment of models relies on learning methods and experience.
    The learning method is observing fruit shape and taste; experience is the way
    to obtain fruit shape and taste, requiring people to continuously taste fruit.
    Human experience is stored in the brain in the form of memory. The learning process
    can be described as searching for knowledge in memory in the brain, applying logical
    methods to reason about new cognition, thereby acquiring new knowledge.


    Computers can mimic the human learning process, storing experience in the form
    of data in computer systems. Learning algorithms generate models from data, provide
    experience data to models for training, and when faced with new situations, the
    models give judgments and decisions. If computer science is, in a sense, the science
    of algorithms, then machine learning is the science of algorithms about algorithms—the
    study of how to learn from data. Machine learning models include linear models,
    decision trees, neural networks, support vector machines, Bayesian statistics,
    ensemble learning, reinforcement learning, and topic modeling, among others. After
    years of development, machine learning algorithm and model developers have released
    many efficient open-source libraries, enabling programmers to utilize powerful
    algorithms to mine patterns and knowledge in data and make predictions about the
    future.


    ## 2.1 Development History


    Machine learning is one of the three major application fields of artificial intelligence
    and a hallmark of a high level of AI development. Early AI research focused on
    reasoning capabilities. In the mid-20th century, people believed intelligent systems
    should possess logical calculation and reasoning abilities. In mathematical theorem
    proving, programs like the General Problem Solver and the Logic Theorist achieved
    very good results, even outperforming mathematicians. With the development of
    computer hardware and software technology, mathematical theorem proving could
    far from satisfy expectations for AI development. Intelligent systems should not
    only possess logical systems but also the capability to possess knowledge. Starting
    in the 1970s, expert systems—representing the knowledge-based stage of AI products—emerged
    in large numbers, solving many practical rule-based problems. However, expert
    systems faced the limitations of knowledge engineering; experts'' energy is limited,
    and they cannot generalize all knowledge in an industry and input it into computer
    systems. At this point, the autonomous learning of knowledge by computer systems
    became an urgent need. In fact, as early as the Turing Test in the mid-20th century,
    the initial ideas of machine learning had appeared. In the 1960s and 1970s, the
    Perceptron representing connectionism, structural learning systems representing
    symbolism, learning machines for reinforcement learning, and Bayesian theory for
    statistical learning were born successively. These laid a solid foundation for
    the birth of machine learning.


    In the 1980s, R.S. Michalski et al. published the first machine learning monograph
    *Machine Learning: An Artificial Intelligence Approach*, defining machine learning
    as learning from samples, summarizing learning results from training samples,
    belonging to an inductive method. Decision trees use information entropy reduction
    as a judgment condition to find a tree structure for solving problems. In 1986,
    neural networks achieved results in solving `NP`-hard problems, producing the
    `BP` (Backpropagation) algorithm. The learning process consists of two processes:
    forward propagation of signals and backward propagation of errors. The learning
    of samples is implied in the process of parameter adjustment, especially involving
    a large number of parameters, often relying on manual parameter tuning. A slight
    deviation in parameters could amplify learning result differences by thousands
    or tens of thousands of times.


    In the early 1990s, people believed machine learning was a glorious transformation
    of statistical learning. Consequently, the Support Vector Machine (`SVM`) in statistical
    learning methods attracted widespread attention. `SVM` seeks a hyperplane with
    the maximum margin in the sample space for classification or decision-making.
    When some support vectors are not on the classification boundary, the loss function
    can quantify classification loss. Complex classifiers tend to generate structural
    risks, and model parameters can be determined by minimizing a linear combination
    of structural risk and empirical risk. In the sample space, some linearly inseparable
    problems may be nonlinearly separable. The `Kernel Method` can map low-dimensional
    linearly inseparable problems to high-dimensional linearly separable ones. The
    mapping function is called a kernel function, including polynomial kernels, radial
    basis function (RBF) kernels, Gaussian kernels, etc. Constructing a kernel function
    is applied in many aspects of machine learning. In fact, statistical learning
    is not a statistical model. A statistical model builds a model for data to infer
    relationships between data; its main purpose is not to predict the future. Statistical
    learning methods abandon interpretability to gain higher predictive performance;
    their main purpose is to better predict the future. The most obvious difference
    lies in the example of linear regression: a linear regression statistical model
    seeks a straight line that can contain more data, while a linear regression learning
    model trains a linear regressor on a subset to test the regressor''s performance
    on another subset, hoping to achieve better predictive effects.


    Well-known statistical learning methods apply probabilistic models to the field
    of machine learning. The Naive Bayes model calculates the joint probability distribution
    of features and categories based on the conditional independence assumption. The
    loss function is the log-likelihood function. Model parameters are solved through
    iterative methods of Maximum Likelihood Estimation (MLE) and Maximum A Posteriori
    (MAP) estimation, belonging to generative models. The `EM` (Expectation-Maximization)
    algorithm is a method for solving probabilistic models with latent variables.
    The likelihood function has the form of a log-sum, making it difficult to solve
    directly. An approximate distribution is constructed, using an iterative method
    to find and maximize the lower bound of the likelihood function containing parameters
    until the algorithm converges, obtaining model parameters. Topic models are probabilistic
    models with latent variables, where documents generate topics, and topics generate
    words. Topics are latent variables. The partial derivatives of the likelihood
    function contain the log-sum of independent variables, making it impossible to
    use MLE and Bayesian estimation. Therefore, topic models need to use the `EM`
    algorithm to estimate parameters.


    In the early 21st century, with the development of computing performance and big
    data, deep learning became a hot topic in machine learning, especially widely
    applied in the field of computer vision. In fact, deep learning is a multi-layer
    neural network, from the input layer to hidden layers, and from hidden layers
    to the output layer. The more hidden layers, the more parameters representing
    the weights of connections between two layers. Therefore, deep learning model
    parameters reach tens of thousands or more. Complex models make parameter tuning
    very important. Although deep learning lacks theoretical interpretability, it
    shines in engineering applications, mainly due to big data and strong computing
    power. The popularity of internet applications has produced unprecedented big
    data samples. If the number of parameters is huge but samples are few, overfitting
    easily occurs: the model has zero loss on training samples but produces large
    deviations on test samples. For complex models with a large number of parameters,
    big data is needed for training, and repeated iterative training consumes massive
    computing resources. Without strong computing power, the time cost would be relatively
    high.


    ## 2.2 Basic Concepts and Terminology


    Data is the prerequisite for machine learning. There exists such data (`Plaintiff=Zhang
    San, Defendant=Li Si, Court=Beijing Chaoyang District People''s Court, Cause=Loan
    Dispute, Date=Jan 8, 2020`) (`Plaintiff=Zhao Moujia, Defendant=Qian Mouyi, Court=Shanghai
    Songjiang District People''s Court, Cause=Privacy Rights Dispute, Date=Mar 5,
    2019`) (`Plaintiff=Zhang Moubing, Defendant=Wang Mouding, Court=Tianjin Nankai
    District People''s Court, Cause=Land Contract Management Rights Dispute, Date=Aug
    5, 2018`) (`Plaintiff=Liu Mouwu, Defendant=Sun Mouji, Court=Chongqing Yuzhong
    District People''s Court, Cause=Intellectual Property Dispute, Date=Aug 25, 2016`)
    (`Plaintiff=Huang Moumou, Defendant=Yang Moumou, Court=Guangzhou Tianhe District
    People''s Court, Cause=House Purchase Contract Dispute, Date=Nov 20, 2015`) (`Plaintiff=Chen
    Mouwu, Defendant=Lin Mouliu, Court=Hangzhou Xihu District People''s Court, Cause=Deposit
    Contract Dispute, Date=Jan 8, 2020`).


    The data within a pair of parentheses above is a record describing a case. Multiple
    records form a collection, called a `Dataset`. A text dataset is also called a
    corpus. Generally, a record in a dataset describes a `Sample` or an `Instance`.
    A sample is described by several items, e.g., plaintiff, defendant, court, cause,
    and date. These are called features or attributes. A specific sample is the value
    of a `Feature` or `Attribute` under current circumstances, called a `Feature Value`
    or `Attribute Value`. Mapping features to spatial coordinates, one feature maps
    to one dimensional coordinate. All features (plaintiff, defendant, court, cause,
    date) constitute a five-dimensional space. A case is a point in this five-dimensional
    space. A point in space can be described by a coordinate `Vector`. Therefore,
    a sample is sometimes called a feature vector.


    A dataset is represented by curly braces: `D={d1, d2, ..., dm, ..., dM}`. Capital
    `M` represents the total number of samples. Lowercase subscript `dm` represents
    the `m`-th sample. Each sample contains `N` attributes or features, represented
    as `dm={dm1, dm2, ..., dmn, ..., dMN}`. `dm` is a vector in the `N`-dimensional
    sample space. `dmn` represents the value of the `n`-th attribute or feature of
    the `m`-th sample. For example, `d32` indicates the defendant of the 3rd case
    is Wang Mouding. `d24` indicates the cause of the 2nd case is a privacy rights
    dispute. `d13` indicates the court of the 1st case is Beijing Chaoyang District
    People''s Court. `d41` indicates the plaintiff of the 4th case is Liu Mouwu. `d55`
    indicates the judgment date of the 5th case is Nov 20, 2015.


    Learning algorithms obtain models by learning from data. During the training or
    learning process, some data needs to be used. Each record is called a training
    sample. All `Training Samples` constitute the training set. A portion of the dataset
    is divided into the `Training Set`, and the remaining data is called the `Testing
    Set`. The learning algorithm needs to make an assumption about the data conforming
    to a certain law. For example, one can assume all judgment dates conform to a
    Gaussian normal distribution. The Gaussian normal distribution model has two parameters:
    mean and variance. The learning algorithm learns the model from training data
    and obtains model parameters. Learning models on different training sets will
    yield different model parameters. The learning process expects the obtained parameterized
    model to explain the phenomena generated by the data, not only fitting the data
    generation law well on the training set but also conforming to the data distribution
    on the test set. Therefore, a model can be viewed as the instantiation of the
    learning algorithm''s parameters and hypothetical theory on specific data. Thus,
    the quality of a machine learning algorithm is closely related to the data type.
    For example, deep learning is suitable for image processing, and topic models
    are suitable for text processing.


    The case data samples mentioned above contain values for 5 attributes or features:
    plaintiff, defendant, court, cause, and time. If case prediction is needed, users
    may be more concerned with the judgment result. For example, ((`Plaintiff=Zhang
    San, Defendant=Li Si, Court=Beijing Chaoyang District People''s Court, Cause=Loan
    Dispute, Date=Jan 8, 2020`), Win)((`Plaintiff=Zhao Moujia, Defendant=Qian Mouyi,
    Court=Shanghai Songjiang District People''s Court, Cause=Privacy Rights Dispute,
    Date=Mar 5, 2019`), Lose). Such records contain the judgment result. Win or Lose
    is called a `Label`. Usually, a labeled sample is represented as (`dm`, `ym`),
    where `ym` is the label of sample `dm`. The set of all possible label values constitutes
    the set `Y`, called the output space. The model input is an unlabeled `dm`, and
    the output result is `f(dm)`. Here `f` refers to a function or mapping. The learning
    model can be understood as a generalized function. The purpose of the learning
    algorithm is to make `f(dm)` approximate `ym`. If the predicted result `f(dm)`
    or label `ym` can only take one of two discrete values, Win or Lose, the learning
    model with discrete output values is called a `Classification` task. If the predicted
    result is the compensation amount, which can take continuous values from a range,
    the learning model with continuous output values is called a `Regression` task.
    If a classification task contains only two categories, Win or Lose, it is called
    a `Binary Classification` task. One is called the `Positive Class`, the other
    the `Negative Class`. If a classification task contains more than two categories,
    it is called a `Multi-class Classification` task.


    The labeled sample space is divided into a training set and a test set. The training
    set is represented as {(`d1`, `y1`), (`d2`, `y2`), ..., (`dtr`, `ytr`), ..., (`dTR`,
    `yTR`)}. Capital `TR` represents the number of training set samples. Lowercase
    `tr` represents an arbitrary sample in the training set. The test set is represented
    as {(`d1`, `y1`), (`d2`, `y2`), ..., (`dte`, `yte`), ..., (`dTE`, `yTE`)}. Capital
    `TE` represents the number of test set samples. Lowercase `te` represents an arbitrary
    sample in the test set. `TR + TE` equals the total number of samples in the sample
    space `M`. The learning model expects to establish a mapping `f: D → Y` from the
    input space {`d1`, `d2`, ..., `dtr`, ..., `dTR`} to the output space {`y1`, `y2`,
    ..., `ytr`, ..., `yTR`} by learning from the training set {(`d1`, `y1`), (`d2`,
    `y2`), ..., (`dtr`, `ytr`), ..., (`dTR`, `yTR`)}. For binary classification tasks,
    `Y={1, 0}` or `{+1, -1}`. For regression tasks, `Y` is generally real numbers.
    After model learning, model parameters are obtained, establishing the mapping
    `f` from input to output. Prediction (`Predict As`) is performed on test samples
    (`Testing Sample`) in the test set. The prediction result is `yte = f(dte)`. The
    true value `yte` is compared with the predicted value `ˉyte` to evaluate model
    performance.


    An unlabeled sample space can perform `Clustering` tasks, dividing cases in the
    dataset into several groups. Each group is called a cluster. These clusters may
    correspond to some latent topics or concepts. For example, by jurisdiction, the
    aforementioned dataset can be clustered into North China cases, East China cases,
    South China cases, Southwest cases, Southeast cases, Northeast cases, and Northwest
    cases. By date, they can be divided into cases within 1 year, 3 years, and 5 years.
    By cause, clustering results such as personality rights disputes, property rights
    disputes, contract disputes, and intellectual property disputes can be formed.
    In clustering learning tasks, clusters like "East China cases" are unknown at
    the beginning. Through learning, it is discovered that the courts in these samples
    are geographically closer to Shanghai and to each other, but farther from Beijing,
    Guangzhou, Chongqing, etc. Clusters like "personality rights disputes" are also
    unknown initially. Through learning, it is discovered that these case samples
    have higher frequencies of words like personality, body, reputation, name, and
    portrait, with high word co-occurrence among them, but less co-occurrence with
    words in property rights disputes, contract disputes, intellectual property disputes,
    etc. Clustering learning can discover the intrinsic laws of data, helping users
    analyze data, and usually does not require label information.


