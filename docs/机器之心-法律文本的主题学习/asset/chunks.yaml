    ## 2.5 Hypothesis Space and Inductive Bias


    As the number of training samples increases, under the requirement of complete
    model fitting, some hypotheses can be excluded. For example, adding one more sample
    so that three samples are not on a straight line, as shown in Figure 2.11. The
    linear relationship hypothesis can only fit two sample points; the third sample
    point has a deviation. However, a quadratic (univariate quadratic) relationship
    hypothesis can completely fit the three sample points on the line. In fact, for
    the two hypotheses of linear and quadratic relationships, it is difficult to evaluate
    which hypothesis is more reasonable. In terms of compliance with training data,
    the quadratic hypothesis has an advantage over the linear hypothesis, achieving
    zero bias, while the linear hypothesis has a bias on the third sample point. If
    the training set data reliability is high, reducing training bias is the correct
    learning method. However, if the training samples themselves contain noise errors,
    reducing training bias is not an appropriate approach. For example, if the added
    third sample point is erroneous data, the linear hypothesis might be more reasonable.
    In the case where the dataset follows an independent and identically distributed
    (i.i.d.) distribution, when the sample size scale is smaller than the hypothesis
    model complexity, the hypothesis model can completely fit the data; when the sample
    size scale exceeds the hypothesis model complexity, the hypothesis model cannot
    completely fit the data. In fact, the data source is neither completely accurate
    and reliable nor completely i.i.d. To guard against structural risk and fitting
    erroneous data, the phenomenon of fitting all data should be avoided.


    ![](img/txt002_11.jpg "pagenumber_ebook=56,pagenumber_book=47")


    Figure 2.11　Bias of Linear Hypothesis


    Learning from samples whether a case is a win, assuming the win/loss outcome can
    be determined by three factors: litigation claims, cause of action, and evidence
    materials. After the above three features or attributes of the case are determined,
    a learning model trained on a large number of samples can give a judgment on the
    case outcome. Inductive learning gains experience from historical data, forming
    concepts of "what a winning case looks like" or "what a losing case looks like",
    as shown in Table 2.1.


    Table 2.1　Dataset Learned from Samples


    ![](img/txt002_12.jpg "pagenumber_ebook=57,pagenumber_book=48")


    From the table records, it can be seen that a winning case is a concept where,
    based on the evidence materials at hand, a lawsuit is filed with a certain cause
    of action and achieves a certain litigation claim. Describing a winning case with
    a logical expression: `(Evidence=ToBeDetermined)∧(Cause=ToBeDetermined)∧(Claim=ToBeDetermined)`,
    where `∧` denotes a logical AND relationship; the two conditions connected by
    `∧` must be satisfied simultaneously for the overall logical expression to hold.
    The process of learning from the training sample set is the process of determining
    the "ToBeDetermined" parts. From the sample with Case ID 1, `(Evidence=TransferRecordsAndContract)∧(Cause=LoanDispute)∧(Claim=RepayDebt)`
    is a winning case. Besides Sample ID 1, Samples 3, 5, and 7 are also winning cases;
    these are all observed judgment results. For samples not appearing in the training
    set, the learning model needs to predict unknown data, which is called the model''s
    generalization. Inductive learning analyzes and summarizes the feature patterns
    of training samples, e.g., on which features all winning case samples have the
    same or similar values. At the same time, it compares cases of different categories
    to see on which attributes or features the values differ.


    When knowing nothing about a case, the predicted probability of winning is one-half.
    As training data is added, more features and details of the case can be observed,
    and the predicted probability of winning will increase significantly. Assuming
    certain values in the feature space determine the win/loss of a case, all hypotheses
    constitute the space: `(Evidence=ToBeDetermined)∧(Cause=ToBeDetermined)∧(Claim=ToBeDetermined)`.
    The scale of the hypothesis space is derived by multiplying the number of values
    for each feature. The learning process searches for hypotheses that match the
    training set in Table 2.1 from the case judgment hypothesis space, excluding hypotheses
    that do not match the training set. For example, the hypothesis: `Win=(Evidence=Any)∧(Cause=Any)∧(Claim=Any)`
    does not match the sample with Case ID 2.


    Evidence material is denoted as `a`, with values from the set `evidence:{TransferRecordsAndContract,
    TransferRecords, Contract, *}`, where `*` denotes any. Cause of action is denoted
    as `b`, with values from the set `cause:{LoanDispute, UnjustEnrichment, TortDispute,
    *}`. Litigation claim is denoted as `c`, with values from the set `claim:{RepayDebt,
    RepayDebtAndInterest, DoubleCompensation, *}`. Each feature can take 4 values;
    therefore, there are 64 hypotheses in total in the hypothesis space, as shown
    in Figure 2.12.


    ![](img/txt002_13.jpg "pagenumber_ebook=58,pagenumber_book=49")


    Figure 2.12　Hypothesis Space for Case Learning


    In the figure, `a=*` indicates the evidence material value is any, `b=*` indicates
    the cause of action value is any, `c=*` indicates the litigation claim value is
    any. `a=1` indicates the evidence material value is "TransferRecordsAndContract",
    `b=1` indicates the cause of action value is "LoanDispute". `c=1` indicates the
    litigation claim value is "RepayDebt", `c=2` indicates "RepayDebtAndInterest",
    `c=3` indicates "DoubleCompensation". The structure of Figure 2.12 is similar
    to the directory hierarchy of a file system, like an inverted tree; the topmost
    is the root node, and the bottommost are leaf nodes. The leftmost leaf node `(a=1;b=1;c=1)`
    represents hypothesis `h1`: The judgment result is a win for cases sued for loan
    disputes based on transfer records and contracts, claiming repayment of debt.
    Hypothesis `h1` matches or is consistent with the sample with Case ID 1 in the
    training set, but cannot generalize to predict other samples. The rightmost leaf
    node `(a=1;b=1;c=2)` represents hypothesis `h2`: The judgment result is a win
    for cases sued for loan disputes based on transfer records and contracts, claiming
    repayment of debt and interest. Hypothesis `h2` matches the sample with Case ID
    5 in the training set, but likewise cannot generalize to predict other samples.
    If the parent node of these two leaf nodes `(a=1;b=1;c=*)` is used as hypothesis
    `h3`: The judgment result is a win for cases sued for loan disputes based on transfer
    records and contracts. Hypothesis `h3` can generalize child nodes under `(a=1;b=1;c=*)`
    that did not appear in the training set; predictions on unlabeled data may be
    incorrect, meaning the model has a certain accuracy. Searching for hypotheses
    matching the training set from the hypothesis space can use a top-down deductive
    method or a bottom-up inductive method, storing hypotheses consistent with all
    positive samples in the training set, and deleting hypotheses consistent with
    all negative samples in the training set.


    Selecting Case IDs 1, 2, 5, 7 from Table 2.1 to form a training set, as shown
    in Table 2.2. There are 3 hypotheses in the hypothesis space that can match the
    training set. Hypothesis 1: If `(Evidence=TransferRecordsAndContract)∧(Cause=LoanDispute)∧(Claim=Any)`
    exists, then the judgment result is a win; Hypothesis 2: If `(Evidence=TransferRecordsAndContract)∧(Cause=Any)∧(Claim=Any)`
    exists, then the judgment result is a win; Hypothesis 3: If `(Evidence=Any)∧(Cause=LoanDispute)∧(Claim=Any)`
    exists, then the judgment result is a win. As shown in Figure 2.13.


    Table 2.2　Training Set Learned from Cases


    ![](img/txt002_14.jpg "pagenumber_ebook=59,pagenumber_book=50")

    ![](img/txt002_15.jpg "pagenumber_ebook=59,pagenumber_book=50")


    Figure 2.13　Hypothesis Space on a Training Set


    Which hypothesis the learning model selects depends on the inductive bias—whether
    it prefers a more generalized choice or a more specific explanation. Hypothesis
    1 learns the result from two features: evidence and cause; Hypothesis 2 learns
    from the evidence feature; Hypothesis 3 learns from the cause feature. Hypothesis
    1 is more specific than Hypotheses 2 and 3. Which hypothesis is better is measured
    by the model''s generalization performance, i.e., the matching situation of that
    hypothesis on the test set.


    Selecting Case IDs 3, 4, 6 from Table 2.1 to form a test set, as shown in Table
    2.3. It can be seen that Cases 3, 4, 6 do not match Hypothesis 1; Cases 4, 6 do
    not match Hypothesis 2; Cases 3, 4, 6 do not match Hypothesis 3. Therefore, considering
    the number of matches on test samples, Hypothesis 1 scores 0, Hypothesis 2 scores
    1, Hypothesis 3 scores 0. This indicates that in the current problem, the learning
    model prefers to select a more generalized hypothesis. A speculated partial reason
    is that the winning result is related to fewer features, e.g., evidence material.
    Hypothesis 1''s conditions are too specific, containing values for two features;
    one feature might not be strongly related to winning, but the model learned too
    many details from the training set, introducing features with little relation
    to the judgment result into the model.


    Table 2.3　Test Set Learned from Cases


    ![](img/txt002_16.jpg "pagenumber_ebook=60,pagenumber_book=51")


    Machine learning algorithms discover intrinsic laws from historical data. Assuming
    intrinsic laws exist, different data have different intrinsic laws. There is no
    universal machine learning algorithm that is a "cure-all". A machine learning
    algorithm that performs well on some data may perform exactly the opposite on
    other data. Therefore, evaluating the quality of a machine learning algorithm
    requires targeted analysis combined with specific problems and data.


    ## 2.6 Data Preprocessing


    In the roadmap of building a machine learning system, the initial stage is data
    preprocessing. The specifications and dimensions of raw data are not conducive
    to improving the performance of the machine learning system; therefore, many machine
    learning applications regard data preprocessing as one of the important operational
    steps. For example, in face recognition, the raw data is a series of images; the
    machine learning system hopes to extract useful features from the images, including
    eyes, nose, mouth, ears, etc. In plant flower recognition, features extracted
    from images include petal color, sepal length, sepal width, petal length, and
    petal width, etc. In case prediction, features recognized from text include court,
    date, cause of action, plaintiff, defendant, legal provisions, and evidence, etc.
    The quality of data preprocessing can directly affect the generalization performance
    and effect of the learning model.


    In reality, collected data is often incomplete, with missing values on certain
    features. For example, missing values in income features or marital attributes
    due to personal privacy during data entry; the spouse in a legal relationship
    is a missing value for unmarried people; some missing values are caused by human
    negligence; some are due to high acquisition costs. Not only missing values but
    also noise and outlier data are unfavorable for model training and evaluation.
    Many machine learning algorithms require feature selection so that feature values
    are in a standard, continuous space, e.g., mapping feature values to the `[0,1]`
    interval or making them follow a normal distribution with a mean of 0 and variance
    of 1.


    During data collection, feature or attribute assignments have various missing
    values. Depending on the distribution characteristics of feature values and their
    importance to prediction, feature deletion methods or feature value imputation
    methods can be used. If many samples have missing values on a feature, reaching
    a high proportion, and it is not particularly important during model training,
    such features can be deleted. For example, home landline numbers in personal basic
    information; many people no longer use landlines; when 90% of samples lack landline
    numbers, the landline feature can be deleted. If feature values follow a uniform
    distribution and few samples are missing, the mean of that feature or attribute
    can be used to impute the missing values. For example, missing values of monthly
    salary in personal basic information can be replaced by the social average wage.
    For missing values with skewed data, the median is used for imputation. For example,
    Beijing has many high incomes, making the average wage appear high, possibly exceeding
    the income of most working-class people; at this time, the median income is more
    representative. If the missing value is not continuous data but discrete data,
    the dummy variable method can be used. For example, missing gender values in personal
    basic information are categorized as other or unknown.


    Outliers are data points far from the normal data distribution range, divided
    into true outliers and pseudo-outliers. Pseudo-outliers are caused by errors in
    the data collection process and do not objectively reflect reality. For example,
    in personal basic information, entering age 60 but accidentally adding an extra
    0, making it 600. True outliers are generated by the data source itself and are
    true reflections of objective phenomena. For example, in personal basic information,
    normal age distribution is around a mean of 70 and variance of 5, but there may
    be a few individual outliers of 110.


    For simple numerical values, a Boxplot can be used to determine if outliers exist.
    For example, sort the data, calculate the first quartile `Q1`, median `Q2`, third
    quartile `Q3`, upper and lower limits; values greater than the upper limit are
    outliers, values smaller than the lower limit are also outliers. If the data follows
    a normal distribution, the Standard Deviation method can identify data deviating
    from the mean by more than 3 standard deviations as outliers:


    ![](img/txt002_17.jpg "pagenumber_ebook=62,pagenumber_book=53")


    The Standard Deviation (`SD`) method is not a robust outlier detection method
    because the appearance of outliers in turn affects the mean and standard deviation.
    The Median Absolute Deviation (`MAD`) method first calculates the sample median,
    then finds the absolute deviation of each sample from the median, then calculates
    the median of these absolute deviations, and finally divides each sample''s absolute
    deviation by the median of absolute deviations. The MAD method amplifies the influence
    of outliers and is a relatively reliable outlier calculation method. Distance-based
    outlier detection methods judge whether outliers are outside the neighborhood
    by defining proximity between data points. Density-based methods define outliers
    as points where the surrounding data density is significantly lower than the neighborhood
    density of most normal data points, suitable for datasets with uneven outlier
    distribution. Clustering-based methods use clustering algorithms to treat small
    clusters far from normal central clusters as outliers.


    Outliers have a certain impact on both model training and evaluation. Different
    processing methods are adopted based on the number of outliers, their impact,
    and the learning model. If the number of outliers is small, consider deleting
    them, though this may lose some information. If there are many outliers and they
    cannot be deleted, a logarithmic transformation can be used to scale them down
    to one order of magnitude; this method does not lose information but has certain
    requirements for the learning model. If the order of magnitude difference between
    outliers and normal data is not large, outliers can be replaced by the data mean
    or median, with less information loss.


    Noise is the error generated between the sample observed value and the true value
    during data collection and acquisition. Common processing methods include binning
    and regression. Binning includes equal-width and equal-frequency methods. Equal-width
    divides the range from minimum to maximum into several equal parts, while equal-frequency
    ensures each bin contains the same number of samples. Based on equal-width or
    equal-frequency, the mean, median, or boundary values of each bin are used to
    replace the samples in the bin. Regression builds a regression model based on
    the relationship between feature variables and output, and uses the output to
    reverse-solve approximate values of feature variables.


    Data integration generally refers to merging data from multiple sources into a
    consistent dataset, needing to resolve feature identification, data redundancy,
    and conflict issues. Feature identification means identifying attributes or fields
    with the same meaning from two different data sources. For example, court, procuratorate,
    and public security data integration may involve common features; in suspect descriptions,
    the court may use feature name `suspect_description`, public security may use
    `suspect_miaoshu`, and the procuratorate may use `suspect_desc`. Data redundancy
    means a feature in one source can be derived from a feature in another source.
    For example, court data has a date of birth attribute, procuratorate data has
    an age attribute, and age can be derived from date of birth. Data conflict refers
    to inconsistent values of features with the same meaning from two different sources.
    For example, a suspect''s height is 1.75m in court data but 1.85m in procuratorate
    data. Such data conflicts can be handled using missing value methods or resolved
    based on the method closer to the data production source.


    Data reduction simplifies the dataset while preserving the integrity of the original
    data and achieving the same model training effect, quickly improving learning
    efficiency, including dimensionality reduction and dimensionality transformation.
    In classification tasks, there may be thousands of features, most unrelated to
    the classification result. By selecting feature subsets to delete unnecessary
    irrelevant features, the data volume is reduced as much as possible while ensuring
    minimal information loss. The goal of feature subset selection is to find the
    smallest subset with a probability distribution closest to the original feature
    space. Sequential Forward Selection (SFS) starts from an empty set and iteratively
    adds the best features from the original feature space. Sequential Backward Selection
    (SBS) starts from the full original feature set and iteratively removes the worst
    features. The best features of the original feature space can be determined by
    univariate and target variable statistical analysis methods; common methods include
    Chi-square test and regression coefficients. The Chi-square test calculates the
    correlation between feature values and target output based on the deviation between
    observed values and theoretical hypotheses, then deletes features with lower correlation
    from the feature space based on correlation ranking.


    Some different features have high correlation and a certain degree of data redundancy.
    Dimensionality reduction methods can compress data from a high-dimensional redundant
    space to a low-dimensional subspace. Dimensionality reduction saves storage capacity
    and improves learning algorithm training speed. More importantly, on datasets
    with large amounts of noise, dimensionality reduction can improve model prediction
    performance. Dimensionality transformation maps high-dimensional sparse space
    to a lower-dimensional space while ensuring minimal original data information
    loss. Common methods include Principal Component Analysis (PCA), Singular Value
    Decomposition (SVD), and clustering. PCA projects data onto the principal component
    space through spatial mapping, maximizing data variance in the principal component
    directions. SVD maps data to spaces on different dimensions through orthogonal
    matrix transformation; it has high computational complexity and is suitable for
    sparse matrices. Clustering divides samples into clusters, using clusters to represent
    individual feature variables; the number of clusters is the new number of features.


    Different feature values of training data have different dimensions (units/scales),
    which affect model training, especially for distance-related learning algorithms.
    For example, a fruit quality identification system screens out unqualified fruits.
    Input features to the learning model include fruit weight, growth period, length,
    width, height, etc. These quantified features are not in the same dimension range:
    weight 0–10000g, growth period 0–100 days, length 0–1000mm, etc. A single sample''s
    feature values differ greatly; scaling operations are needed to map them to a
    specific range. Common methods include Min-Max Normalization, `Z-score Standardization`,
    and Logarithmic Transformation. Min-Max Normalization uses (max - min) as the
    denominator and the distance from the data to the minimum as the numerator. `Z-score
    Standardization` subtracts the mean and divides by the standard deviation (variance
    in text, usually std dev); the transformed data distribution changes. For some
    time-series data, the x-axis is time, the y-axis is GDP value, which has shown
    exponential growth over the past 20 years, making it impossible to show the growth
    relationship in a plot. Logarithmic transformation uses the `log` function to
    transform data in series where orders of magnitude differ greatly, allowing data
    of different dimensions to appear in a coordinate system with the same proportion.


    Depending on the learning algorithm characteristics, some models require input
    data types to be discrete, e.g., `Decision Tree` and `Naive Bayes` algorithms.
    Learning algorithms with continuous input data have huge overhead in time and
    space; discretized data not only saves overhead but also improves feature interpretability
    and noise resistance. For example, a suspect''s height value is continuous; if
    discretized into tall, medium, short, it better conforms to the general understanding
    of height and can categorize noise exceeding normal values into a discrete value,
    tolerating data entry errors to a certain extent, overcoming structural defects
    in the data, making model training and evaluation more stable and reliable. Discretization
    operations bin/segment continuous data based on breakpoints. Common methods include
    equal-frequency, equal-width, and clustering. Equal-frequency makes the sample
    count in each bin equal. For example, sample values include 1 to 10 (interval
    1), 10 to 100 (interval 10), 100 to 1000 (interval 100), with 10 samples in each
    bin. Equal-width makes the width (boundary length) of each bin equal. For example,
    class size within 100 can be divided into `[0,25]`, `[25,50]`, `[50,75]`, `[75,100]`
    four equal-width bins. Clustering uses clustering learning results, treating samples
    in a cluster as a discrete value.


    In multi-class features, using multiple discrete values to describe a feature
    is not conducive to fast model iteration. For example, suspect occupation is a
    multi-class feature: worker, farmer, teacher, civil servant, student, other. Usually,
    discretization results in 1, 2, 3, 4, 5. From the occupation itself, there is
    no size ordering difference; inputting these assigned values into the learning
    model is obviously unreasonable. Therefore, dummy variables need to be introduced
    to split the multi-class feature into multiple binary features, called sparsification.
    For example, the original occupation feature name is `employment`; introduce five
    dummy variables `is_worker`, `is_farmer`, `is_teacher`, `is_civilservant`, `is_student`.
    When the occupation is worker, `is_worker` takes value 1, other dummy variables
    are 0.


    ## 2.7 Model Evaluation


    In a binary classifier, all samples are output as positive or negative classes
    according to the classification criterion. The classifier''s predicted output
    does not completely match the actual sample output; there is a certain error.
    Total sample count is `m`, number of misclassified samples is `e`, error rate
    is `e/m`. Error rate is proportional to the number of misclassified samples and
    inversely proportional to the total sample count. Corresponding to the error rate
    is the learning accuracy, defined as `1 - error rate`. Errors occurring on the
    training set are defined as empirical error or training error; errors occurring
    on the test set are defined as generalization error. Generally, a classifier can
    achieve a low classification error rate on the training set, but the error rate
    on the test set is very high. For example, the total sample space is 1000 samples,
    divided into a training set of 800 samples and a test set of 200 samples. The
    classifier has 8 samples inconsistent with sample labels on the training set,
    and 40 samples inconsistent on the test set. In this case, the classifier is not
    a good classifier; although the training accuracy reaches 99%, the generalization
    accuracy drops to 80%.

    '
