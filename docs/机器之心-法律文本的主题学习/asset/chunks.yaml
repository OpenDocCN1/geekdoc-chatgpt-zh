    ## 4.2 法律文本主题


    ### 4.2.1 法律文本主题特性


    随着互联网的快速发展，网络信息量呈现爆发性增长，大量信息属于文本数据，法律文本也就越来越重要。法律术语根据其调整的社会关系的不同，可能属于不同的部门法。具有相同标准的法律术语属于同一个法律部门，根据法律部门来分，法律术语分为：宪法术语、刑法术语、民法术语、诉讼法术语、行政法术语、国际法术语等。宪法术语中有国体、政体、根本法、罢免权、选举权等；刑法术语有犯罪、累犯、缓刑、假释、没收财产、有期徒刑、单位犯罪等；民法术语有法人、代理、合同、监护人、继承人、违约金、抵押权、债务人等；诉讼法术语有证人、证言、上诉、回避、询问、仲裁、公诉、终审、管辖权等；行政法术语有行政行为、行政主体、行政复议、简易程序、行政处罚等；国际法术语有主权、条约、豁免权、国民待遇等。


    根据法律术语所表示的意义内容不同，可以分为表权利的、表称谓的、表罪名的、表事物名称的、表法律行为的、表法律部门的、表法律后果的、表心理态度的、表法律关系的、表诉讼程序的及其他。表权利的法律术语有代理权、著作权、商标权、人身权、财产权、抵押权等；表称谓的法律术语有代理人、合伙人、候选人、公诉人、当事人、辩护人等；表罪名的法律术语有走私罪、危害公共安全罪、金融诈骗罪、侵犯财产罪等；表事物名称的法律术语有定金、合同、权利、孳息、罚金、不动产、裁定书等；表法律行为的法律术语有拍卖、投标、破产、赦免、减刑、辩护、教唆、侦查等；表法律部门的法律术语有刑法、民法、合同法、教育法、婚姻法、侵权法等；表法律后果的法律术语有违约责任、侵权责任、民事责任、刑事责任、行政处罚等；表心理态度的法律术语有故意、过失、过错、放任等；表法律关系的法律术语有人身关系、财产关系等；表诉讼程序的法律术语有一审、二审、再审、终审等。法律术语主题化分类如表4.1所示。


