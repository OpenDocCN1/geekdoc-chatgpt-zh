    ### 8.2.3　Legal Text Supervised Learning Model


    In the field of legal text natural language processing and application, the general
    processing process involves information retrieval and question answering. In the
    information retrieval task, relevant case texts are found in historical judgments
    based on legal terminology and certain topic queries. In the legal question answering
    task, it is necessary to judge whether these texts support the query. The query
    text can be regarded as a legal text to be compared, hence it is also called textual
    entailment. If the query is defined as whether the judgment supports the plaintiff,
    the case description part of the judgment serves as the text to be classified,
    and the judgment part serves as the supervision information. At this point, the
    task becomes classifying relevant texts. The processing process of the legal text
    supervised learning model is shown in Figure 8.3, divided into 7 steps:


    ![](img/txt008_17.jpg "pagenumber_ebook=226,pagenumber_book=217")


    Figure 8.3　Weighted Supervised Topic Model


    The steps are described as follows: First, preprocess the CJO or FCA corpus, dividing
    a judgment into a case description part and a judgment part. The case description
    part is the text to be classified, and the judgment part provides the supervision
    information label. Second, represent the judgment result as a classification label.
    Simple methods can be used to obtain labels: 1 indicates the judgment embodies
    support for the plaintiff, 0 indicates non-support. Keywords such as "dismiss"
    can be used for labeling, or sentiment classification methods can be used to obtain
    labels. Third, represent the case description as a `VSM Vector Space Model`, using
    the Term Frequency (`TF`) method. Fourth, split the dataset''s `VSM Vector Space
    Model` into a `Training Set` and a `Test Set`. Fifth, input the `Training Set`
    and its corresponding judgment supervision information into the Supervised Topic
    Model `SLDA` to start training the model and obtain `SLDA` parameters. Sixth,
    input the `Test Set` into the trained `SLDA Model` to give a classification prediction
    result of 1 or 0. Seventh, evaluate the model based on the classification results
    and the labels corresponding to the `Test Set`.


    ## 8.3　Model Evaluation Metrics


    ### 8.3.1　Module Import


    In addition to `os`, `sys`, `codecs`, `numpy`, `re`, `jieba`, `scipy`, it is also
    necessary to import `matplotlib.pyplot`, `SVC`, `roc_curve`, `roc_auc_score`,
    `LDA`, and `BLSLDA`. `matplotlib.pyplot` is a plotting library in Python with
    visualization results similar to Matlab. `SVC (Support Vector Classification)`
    is the Support Vector Machine `SVM (Support Vector Machine)` used for classification
    support in Python. `sklearn.metrics` provides many model evaluation functions,
    including some score tools for calculating classification performance. `LDA` is
    the unsupervised topic model, and `BLSLDA` is the binary logistic regression function
    supervised topic model. As shown in Figure 8.4:


    ![](img/txt008_18.jpg "pagenumber_ebook=227,pagenumber_book=218")


    Figure 8.4　Module Import


    ### 8.3.2　Precision, Recall, and F1 Measure


    The function `test_prf()` returns evaluation metrics such as precision. The parameter
    `pred` is the prediction result, and `labels` is the actual result. The function
    `test_prf()` calls the function `cal_prf()`, which is used to calculate precision,
    recall, and F1 measure under both micro and macro conditions. The calculation
    formula for micro-precision in a classification task is the average of the precision
    of each class; the calculation formula for micro-precision is the proportion of
    correctly classified samples of all classes in the total samples. As shown in
    Figures 8.5 and 8.6:


    ![](img/txt008_19.jpg "pagenumber_ebook=228,pagenumber_book=219")


    Figure 8.5　Function test_prf


    ![](img/txt008_20.jpg "pagenumber_ebook=228,pagenumber_book=219")


    Figure 8.6　Function cal_prf


    ### 8.3.3　ROC Curve


    `ROC (Receiver Operating Characteristic)` is a method to measure the overall generalization
    performance of probability prediction results. The function `roc_curve` in the
    `sklearn.metrics` module is used to calculate the False Positive Rate (fpr) and
    True Positive Rate (tpr). The predicted probabilities are sorted from largest
    to smallest. Each time a threshold is selected as the criterion for judging positive
    and negative classes, a coordinate is obtained, where fpr is the abscissa and
    tpr is the ordinate. Plotting the coordinates corresponding to multiple thresholds
    yields the ROC curve. The function `roc_auc_score` calculates the Area Under the
    Curve (`AUC`) of the fpr-tpr, i.e., the ROC curve.


