    在计算机磁盘上存储的语料库文件为澳大利亚联邦法院的判例，数据格式为 `xml`，多层次的扩展标记可以对法律文本进行多维度挖掘和分析，形成一个类似文件系统目录的树形层次结构。根节点为
    `<case>`，表明一个法律裁判文书。第二层有 `<name>`、`<AustLII>` 和 `<citations>` 三个节点，`<name>` 是案件的名称，`<AustLII>`
    是裁判文书的来源网页地址，`<citations>` 是本案援引的历史判例。`<citations>` 节点有多个子节点，数量根据不同的 `<case>`
    而有所不同。第三层节点 `<citation>` 为援引的一个判例，包括 `<class>`、`<tocase>` 和 `<text>` 子节点，`<class>`
    表明援引案件的类型，`<tocase>` 是援引案件的名称，`<text>` 为援引案件的简介。如图 5.11 所示：


