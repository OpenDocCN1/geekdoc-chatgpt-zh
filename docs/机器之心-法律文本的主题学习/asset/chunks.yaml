    衡量向量空间模型中的两个文本之间相似度，可以使用欧式距离、绝对值距离以及夹角余弦等。根据两个文本在主题分布的差异，可以计算两个法律文本之间的余弦相似度:


    ![](images/txt007_59.jpg "pagenumber_ebook=205,pagenumber_book=196")


    `docsim(di，dj)`是法律文本`di`和文本`dj`之间的余弦相似度。假定第0篇文本为需要匹配的新文本，计算与其余每一篇法律文本的余弦相似度，返回余弦相似度值最大的法律文本`dmax`:


    ![](images/txt007_60.jpg "pagenumber_ebook=205,pagenumber_book=196")


    余弦相似度值最大的法律文本是为最相似的文本，在`θ`矩阵中找到第`dmax`行，获得该法律文本主题分布中的各个主题编号。


    ## 7.4 中文法律文本的LDA主题分析


    ### 7.4.1 中文法律术语LDA模型


    语料数据来自于中国法院裁判文书网 (China Judgement Online)，简称为`CJO`数据集，共选取了1103份法院判决书，采用`Python`自然语言工具包进行分词，获取42
    777个词语，规定的法律术语词语有1154个 (见附录A)，余下的41 623个词语属于一般性词语。


    语料库`CJO`的法律术语特征向量矩阵为`vsmtf_legalterms_CJO`，其行数为1103，列数为1154。从`slda.topic_models`中导入`LDA`模块，初始化`LDA`各个参数。`K`为主题数，我国法律主领域一般10个左右，子领域大概几十个。根据经验将`K`设置为15。`alpha`为将一篇法律文本表述为主题多项分布的参数，设置为1。`beta`为将某个主题表述为词多项分布的参数，设置为0.01。`V`为词语数，即法律术语特征向量矩阵的列数。如图7.31所示:


    ![](images/txt007_61.jpg "pagenumber_ebook=206,pagenumber_book=197")


    图7.31　初始化CJO法律术语LDA模型


    迭代次数`n_iter`为100，`lda.fit`训练函数采用吉布斯采样和伪计数方法为`vsmtf_legalterms_CJO`法律术语特征向量空间中的每个词的产生赋予隐含主题。在CPU主频2.8GHz和内存8GB的系统中，训练时间开销大约5秒。如图7.32所示:


    ![](images/txt007_62.jpg "pagenumber_ebook=206,pagenumber_book=197")


    图7.32　CJO法律术语LDA模型训练过程


    在`lda.fit(vsmtf_legalterms_CJO)`训练完成后，返回的`lda.theta`矩阵为各个法律文本在15个主题上的分布，行数为法律文本篇数，列数为主题数15。`lda.theta[0]`为第一篇法律文本的主题分布，在各个主题上的数值累计为1，主题分布的数值可以理解为各个主题在该篇法律文本中的占比情况。占比最大的主题是编号为5的主题，其实是第6个主题，因为主题编号从0开始。如图7.33所示:


    ![](images/txt007_63.jpg "pagenumber_ebook=207,pagenumber_book=198")


    图7.33　CJO法律术语LDA模型的文本到主题的分布


    在`lda.fit`完成训练后，另外一个返回值`lda.phi`矩阵为各个主题在1154个词语上的分布，行数为主题数，列数为法律术语数1154。`lda.phi[0]`为第一个主题上的词分布，在各个词语上的数值累计为1，词分布的数值可以理解为各个词语在该主题上的占比情况。占比最大的词语是编号为321的法律术语，通过遍历词典，该法律术语为“被告人”。如图7.34所示:


    ![](images/txt007_64.jpg "pagenumber_ebook=207,pagenumber_book=198")


    图7.34　CJO法律术语LDA模型的主题到词的分布


    通过循环每个主题到词的分布，即`lda.phi`矩阵的每一行，按照数值从大到小排列，找到每个主题下的前20个词语。如图7.35所示:


    ![](images/txt007_65.jpg "pagenumber_ebook=208,pagenumber_book=199")


    图7.35　CJO法律术语LDA模型的主题0～4的前20词语


    可以看出，编号为0的主题大概与公诉案件和刑法有关，编号为1的主题大概与租赁协议和所有权有关，编号为5的主题大概与公司与代理合同有关，编号为6的主题大概与保险和交通责任有关，编号为7的主题大概与国际贸易和代理有关，编号为8的主题大概与合同和违约有关，等等。


    ![](images/txt007_66.jpg "pagenumber_ebook=208,pagenumber_book=199")


    图7.36　CJO法律术语LDA模型的主题5～14的前20词语


    以第一篇法律文本为参照，原始特征向量维度为1154，通过表述为主题分布，即`lda.theta[0]`，维度约减到15。此外，可以通过排序，输出第一篇法律文本为主题编号5、8和7等方面的内容。如图7.37所示:


    ![](images/txt007_67.jpg "pagenumber_ebook=209,pagenumber_book=200")


    图7.37　CJO法律术语LDA模型的法律文本的主题表述


    在法律文本的主题表述的基础上，文本相似度不再以原始特征空间来计算，而是以主题表述来计算余弦相似度。以第一篇法律文本为参照，分别计算与第1篇～第1103篇法律文本之间的余弦相似度，获得1103个值。按照降序排列，选取前10个值的索引，该索引是向量空间模型矩阵的行号，也是法律文本的编号。如图7.38所示，可以看出，编号0是指第一篇法律文本与第一篇法律文本最相似，需要将返回的第一个索引排除。因此，与第一篇法律文本最为相似的一篇是编号为936的法律文本，即第937篇文本。


