    # Chapter 5 Legal Text Preprocessing


    ## 5.1 Regular Expressions


    ### 5.1.1 Functions of Regular Expressions


    During data preprocessing and low-quality data cleaning, regular expressions (`Regular
    Expression`, `Regex`) can be used for certain string operations. A regular expression
    is a rule-matching pattern frequently used in text information processing for
    string searching and replacement. By pre-defining special symbols and their combinations,
    it describes a series of strings with certain characteristics.


    Application scenarios of regular expressions include pattern matching and data
    capture. Pattern matching refers to whether a given input string conforms to the
    matching logic of a regular expression. For example, determining whether a password
    entered by a registered user meets password complexity requirements, requiring
    the password string to include uppercase and lowercase letters, numbers, and a
    certain length, etc. Regular expressions need special symbols to represent English
    uppercase, some special symbols for English lowercase, some for numbers, and some
    for the number of repetitions. Data capture refers to returning the specific part
    needed by the user that conforms to the regular expression from a specific input
    string. For example, returning a person''s age from a registered ID number; the
    age is the current year minus the birth year in the date of birth, and the birth
    year in the ID number can be returned using a regular expression.


    ### 5.1.2 Basic Regular Expressions


    Generally, regular expressions can match characters as well as positions. Regular
    expression matching patterns can fuzzily express certain strings. For example,
    if the length of a string is not fixed, the regular expression `Regex:wil{1,3}`
    indicates that `l` appears 1 to 3 times. When matching a specific character, regular
    expressions use character classes to represent multiple possible characters. For
    example, `Regex:m[ae]n` indicates that 1 character from `[ae]` appears, matching
    the words `man` and `men`. If there are many characters in the character class,
    a hyphen can be used for shorthand. For example, a lowercase letter is `Regex:[a-z]`,
    an uppercase letter is `Regex:[A-Z]`, and a digit is `Regex:[0-9]`. The symbol
    `-` has a special meaning, indicating a range. Relative to ordinary characters
    like `aA z Z09`, `-` is called a metacharacter. To represent the symbol `-` itself,
    an escape symbol `\` needs to be placed before it, i.e., `\-`.


    Another case of fuzzy matching at a position is that it cannot be a certain uncertain
    symbol. For example, `Regex:c[^cu]u` can fuzzily represent strings like `cau、cbu、cdu、…、ctu、cvu`,
    but cannot represent `ccu` and `cuu`. The first character of the character class
    is `^`, which means negation, indicating that it can match any single character
    except `c` and `u`. According to the escape symbol, some abbreviated forms can
    represent characters of a certain range and type.


    - `Regex:\d` is the abbreviated form of `Regex:[0-9]`, representing any single
    digit character.

    - `Regex:\d+` represents matching multiple digits exceeding 1.

    - `Regex:\d?` represents matching no more than 1 digit.

    - `Regex:\d*` represents matching 0 to any number of digits.

    - `Regex:\D` is the abbreviated form of `Regex:[⁰-9]`, representing any single
    non-digit character.

    - `Regex:\w` is the abbreviated form of `Regex:[0-9a-zA-Z]`, representing any
    single word character (digit, lowercase letter, uppercase letter).

    - `Regex:\W` is the abbreviated form of `Regex:[⁰-9a-zA-Z]`, representing any
    single non-word character.

    - `Regex:\s` is the abbreviated form of `Regex:[\t\r\n\v\f]`, representing any
    single whitespace character, including tabs, newlines, carriage returns, form
    feeds, etc.

    - `Regex:\S` is the abbreviated form of `Regex:[^\t\r\n\v\f]`, representing any
    single non-whitespace character.


    Matching any character can use one of `[\d\D]`, `[\w\W]`, and `[\s\S]`.


    - `Regex:of{1,}` indicates `f` appears at least 1 time.

    - `Regex:of{2,2}` indicates `f` appears 2 times.

    - `Regex:of?` is equivalent to `Regex:of{0,1}`, indicating `f` appears or does
    not appear.

    - `Regex:of+` is equivalent to `Regex:of{1,}`.

    - `Regex:of*` is equivalent to `Regex:of{0,}`, indicating `f` appears any number
    of times, or not at all.


    The regular expression `Regex:.` matches any single character, `Regex:^` matches
    the beginning of a string, `Regex:$` matches the end of a string, `Regex:\b` matches
    a word boundary, and `Regex:\B` matches a non-word boundary.


    ### 5.1.3 Applications of Regular Expressions


    The `re` module in Python functions by matching or capturing strings through regular
    expressions and can be imported via `import`. For the string `The policeman arrested
    536 suspects.Some of them were set free after 36 days.Goodman is a company，not
    a man.`。Using expressions `re.findall(''\w+'', text)`, `re.findall(''\d+'', text)`,
    `re.findall(''[^\d\s]\w+'', text)` respectively to obtain all words, numeric words,
    and non-numeric words, as shown in Figure 5.1:


    ![](img/txt005_1.jpg "pagenumber_ebook=128,pagenumber_book=119")


    **Figure 5.1 Regular Expression Matching Words**


    If you need to capture a part of the substring that matches the symbolic matching
    pattern, you can use parentheses to capture partial characters. For example, to
    query words containing characters `s` and `e` in the above string, the regular
    expression is `re.findall(r''\w*[sS]\w*e\w*'', text)`. To query what characters
    are between `s` and `e` in these words, a regular expression with parentheses
    can be used: `re.findall(r''sSe'', text)`. Backreferences can query character
    repetition in strings. For example, in the regular expression `re.findall(r''((\w)\2{1,})'',
    text)`, `\2` refers to the content of the second parenthesis, i.e., `\w`. A pipe
    symbol `|` in parentheses indicates alternation or branch selection. For example,
    to query which words include the substrings `man` or `rest`, the regular expression
    `re.findall(r''(\w*man\w*|\w*rest\w*)'', text)` can be used. As shown in Figure
    5.2:


    ![](img/txt005_2.jpg "pagenumber_ebook=128,pagenumber_book=119")


    **Figure 5.2 Regular Expression Capturing Words**


    Using expressions `re.findall(r''^(\w+)'', text)` and `re.findall(r''(\w+)\.$'',
    text)` respectively to obtain the first and last words of the string. Using expressions
    `re.findall(r''^\b(.*?\.)'', text)` and `re.findall(r''\.\s*(.{1,35}\.)(?=$)'',
    text)` respectively to obtain the first and last sentences of the string.


    From Figure 5.3, it can be seen that the expression `re.findall(r''^\b(.*\.)'',
    text)` matches from the beginning of the string; matching to the end of the first
    sentence satisfies the expression pattern, matching to the end of the second sentence
    also satisfies it, and even matching to the end of the third sentence still satisfies
    it. The returned result is the situation matching the maximum number of characters;
    this pattern is called **greedy mode**. Inserting a `?` in the middle changes
    it to **non-greedy mode** (lazy mode). The expression becomes `re.findall(r''^\b(.*?\.)'',
    text)`, returning the situation matching the minimum string that satisfies the
    pattern, i.e., matching only the first sentence. Greedy and non-greedy modes are
    shown in Figure 5.4:


    ![](img/txt005_3.jpg "pagenumber_ebook=129,pagenumber_book=120")


    **Figure 5.3 Regular Expression Matching Sentences**


    ![](img/txt005_4.jpg "pagenumber_ebook=129,pagenumber_book=120")


    **Figure 5.4 Greedy and Non-Greedy Modes**


    Regular expressions can query a specific position. For example, finding the position
    of `man` in the above string and inserting `#` before it, the regular expression
    is `re.sub(r''(?=man)'', ''#'', text)`. This is a **positive lookahead**, matching
    the position immediately preceding the pattern definition. Conversely, **positive
    lookbehind** matches the position immediately following the pattern definition.
    The regular expression is `re.sub(r''(?<=\d)\s'', ''%'', text)`, replacing the
    space after a digit with a percent sign. **Negative lookahead** matches the position
    preceding a pattern that does *not* match the definition. The regular expression
    is `re.findall(r''an(?!y)'', text)`, matching `an` not followed by `y`. **Negative
    lookbehind** matches the position following a pattern that does *not* match the
    definition. The regular expression is `re.findall(r''(?<!police)man'', text)`,
    matching `man` not preceded by `police`. As shown in Figure 5.5:


    ![](img/txt005_5.jpg "pagenumber_ebook=130,pagenumber_book=121")


    **Figure 5.5 Lookahead and Lookbehind Matching**


    The `match()`, `search()`, `findall()`, and `sub()` functions of the `re` module
    can all perform regular expression matching, including some optional parameters.
    `match()` only matches from the starting position of the string; if the first
    character does not conform to the matching pattern, the function returns empty
    (None). `search()` can start matching from any position in the string; as long
    as a matching pattern is found, the function starts returning results, equivalent
    to a non-greedy mode. `findall()` tries to find all possible matches in the string,
    belonging to a greedy mode, unless specified otherwise in the regular expression.


    ![](img/txt005_6.jpg "pagenumber_ebook=130,pagenumber_book=121")


    **Figure 5.6 Differences between match, search, and findall Functions**


    The functions of the `re` module control the pattern matching of regular expressions
    through some optional parameters or flags (modifiers), including `re.S`, `re.M`,
    `re.I`, and `re.U`, etc. Multiple flags can be connected using the bitwise OR
    operator `|`.


    - `re.S` specifies that the metacharacter `.` matches any single symbol, extending
    to the next line (DOTALL).

    - `re.M` specifies that the regular expression can match multiple lines, crossing
    the start `^` and end `$` metacharacters of lines (MULTILINE).

    - `re.I` specifies that the regular expression matches symbols in the string case-insensitively
    (IGNORECASE).

    - `re.U` specifies the character encoding as Unicode (UNICODE).


    Define a multi-line string `mullines="536 suspects.\n36 days.\na man."`, where
    the control character `\n` is a newline. The regular expression `re.findall(r''536(.*?)days'',
    mullines, re.S)` searches across lines for the substring between `536` and `days`.
    The regular expression `re.findall(r''^(\d+)'', mullines, re.M)` matches the leading
    digits of each line; without the `re.M` flag, it would only match on the first
    line. The regular expression `re.match(r''the'', text, re.I)` ignores case, as
    shown in Figure 5.7:


    ![](img/txt005_7.jpg "pagenumber_ebook=131,pagenumber_book=122")


    **Figure 5.7 Effects of Some Flags**


    ## 5.2 Obtaining Raw Legal Text


    ### 5.2.1 Common Methods


    There are three methods for obtaining raw legal text, including reading raw text
    files, running variable definitions, and web scraping. File reading refers to
    opening text data files stored in `txt`, `xml`, or other formats on a local computer
    or storage device. Running variables refers to defining or accessing variables
    existing in string form in the runtime environment. Web scraping refers to grabbing
    web pages on remote network hosts through crawler program code.


    Python''s `os` module provides many directory and file operation functions. The
    imported `os` module automatically adjusts file and directory operations to suit
    the system platform according to different operating systems. The function `chdir()`
    changes the current path to the location specified by the parameter. The function
    `open()` can open general disk files and access data files in an abstract sense;
    its `read()` method reads data into a string in byte order. As shown in Figure
    5.8:


    ![](img/txt005_8.jpg "pagenumber_ebook=132,pagenumber_book=123")


    **Figure 5.8 Corpus of Reading Data Files**


    Corpora can be loaded from the `nltk` (Natural Language Toolkit) package. For
    example, `nltk.download()` manages and downloads some public corpora, including
    the `reuters` news corpus, `gutenberg` literary classics corpus, `brown` million-word
    electronic text corpus, `webtext` web text corpus, `nps_chat` instant messaging
    corpus, `inaugural` address corpus, etc. If the text data content is not large,
    a string variable can be defined to obtain a small amount of text data through
    assignment. As shown in Figure 5.9:


    ![](img/txt005_9.jpg "pagenumber_ebook=132,pagenumber_book=123")


    **Figure 5.9 Defining and Assigning String Variables**


    ### 5.2.2 Reading XML Files


    The storage format of corpora has gradually evolved from `txt` format to `xml`
    format. `xml` is an extensible markup language that enables data files to have
    certain structural information. Using `xml` format for multi-level annotation
    of corpora facilitates the implementation of functions such as retrieval, classification,
    and statistics of corpus data. The `xml` format legal text is shown in Figure
    5.10:


    ![](img/txt005_10.jpg "pagenumber_ebook=132,pagenumber_book=123")


    **Figure 5.10 Legal Text in XML Format**


    The corpus files stored on the computer disk are precedents from the Federal Court
    of Australia, with data format `xml`. Multi-level extended tags allow multi-dimensional
    mining and analysis of legal texts, forming a tree-like hierarchical structure
    similar to a file system directory. The root node is `<case>`, indicating a legal
    judgment document. The second layer has three nodes: `<name>`, `<AustLII>`, and
    `<citations>`. `<name>` is the case name, `<AustLII>` is the source URL of the
    judgment document, and `<citations>` are the historical precedents cited in this
    case. The `<citations>` node has multiple child nodes, the quantity varying according
    to different `<case>`s. The third-layer node `<citation>` represents a cited precedent,
    including child nodes `<class>`, `<tocase>`, and `<text>`. `<class>` indicates
    the type of the cited case, `<tocase>` is the name of the cited case, and `<text>`
    is the summary of the cited case. As shown in Figure 5.11:


    ![](img/txt005_11.jpg "pagenumber_ebook=133,pagenumber_book=124")


    **Figure 5.11 Tree Structure of Legal Text**


    `ElementTree` reads `xml` into memory and parses it into a tree for operation,
    which is a relatively lightweight parsing method. Using `ElementTree` to operate
    `xml` format files, as shown in Figure 5.12:


    ![](img/txt005_12.jpg "pagenumber_ebook=133,pagenumber_book=124")


    **Figure 5.12 Traversing Node Tags and Attributes**


    Import the `xml.etree.cElementTree` module, call the `parse()` function to return
    the parse tree, and use the `getroot()` method to get the root node. The root
    node''s tag and attributes can be obtained via `root.tag` and `root.attrib`. Through
    iteration of the root node, `child.tag` and `child.attrib` traverse the tags and
    attributes of the second-layer nodes. Through iteration of a second-layer node,
    `children.tag` and `children.attrib` traverse the tags and attributes of the third-layer
    nodes.


    A specific child node can be accessed directly via array indexing. For example,
    `root[2]` is the third child node of the root node, i.e., `<citations>`. `root[2][0]`
    is the first child node of `<citations>`, i.e., `<citation id=''c0''>`, while
    `root[2][0][2]` is the third child node of `<citation id=''c0''>`, i.e., `<text>`.
    As shown in Figure 5.13:


    ![](img/txt005_13.jpg "pagenumber_ebook=134,pagenumber_book=125")


    **Figure 5.13 Directly Accessing Child Nodes**


    The `findall()` function traverses all child nodes and returns child nodes with
    matching tags. The `find()` function returns the first matching child node. The
    `get()` method can obtain the value of a specific attribute of a node. As shown
    in Figure 5.14:


    ![](img/txt005_14.jpg "pagenumber_ebook=134,pagenumber_book=125")


    **Figure 5.14 Traversing and Retrieving Specified Tag Names**


    The `iter()` function creates a tree iterator with the current element as the
    root node, using the parameter as a filter condition, and returns matching child
    nodes. The `set()` method sets an attribute and its value; if the attribute already
    exists, it modifies the value; if it does not exist, it creates the attribute
    and assigns a value. `tag` is the node''s tag, `attrib` is the key-value pair
    of the node''s attributes and values, and `text` is the node''s text content.
    As shown in Figure 5.15:


    ![](img/txt005_15.jpg "pagenumber_ebook=135,pagenumber_book=126")


    **Figure 5.15 Modifying Text and Adding Attributes**


    `attrib` is a dictionary containing all attributes and values of the node. Operations
    on attributes are consistent with dictionary operations. The `keys()` method returns
    all attribute names, the `items()` method returns a list of key-value pairs of
    all attributes and values, and `del` deletes the attribute specified by the key
    name. As shown in Figure 5.16:


    ![](img/txt005_16.jpg "pagenumber_ebook=135,pagenumber_book=126")


    **Figure 5.16 Deleting Attributes**


    A new node is created via the `Element()` method, with the tag specified by the
    parameter. The `set()` method sets attributes and values, `text` sets the node''s
    text content, and the `append()` method adds the new node as a child node to the
    tree structure rooted at the current node. As shown in Figure 5.17:


    ![](img/txt005_17.jpg "pagenumber_ebook=136,pagenumber_book=127")


    **Figure 5.17 Adding Child Nodes**


    Using the iterator `iter` to search for nodes with specified tags in the tree
    rooted at the current node, matching based on node text content, the `remove()`
    method can delete nodes satisfying the matching conditions. As shown in Figure
    5.18:


    ![](img/txt005_18.jpg "pagenumber_ebook=136,pagenumber_book=127")


    **Figure 5.18 Deleting Nodes**


