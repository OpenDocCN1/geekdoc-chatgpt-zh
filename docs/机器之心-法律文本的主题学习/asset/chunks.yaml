    ### 5.2.2 读取 xml 文件


    语料库的存储格式从 `txt` 格式逐渐演变到 `xml` 格式，`xml` 是一种可扩展的标记语言，可使数据文件具有一定的结构性信息。使用 `xml` 格式对语料库进行多层级标注，有助于语料数据的检索、分类和统计等功能的实现。`xml`
    格式的法律文本如图 5.10 所示：


    ![](images/txt005_10.jpg "pagenumber_ebook=132,pagenumber_book=123")


