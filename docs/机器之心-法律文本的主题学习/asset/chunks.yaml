    ## 7.3 LDA 主题模型


    ### 7.3.1 法律文本的概率生成


    多项分布的多变量参数符合狄利克雷分布形式，而且后验和先验分布具有相同的分布形式，即共轭分布。在生成法律文本的一个词语时，先以一定概率选取了某个方面的主题，然后又以一定概率从该主题中选取某个词，不断重复上述过程就产生了一篇法律文本。


    根据文本到主题和主题到词的贝叶斯概率假设，三层主题模型生成一篇法律文本。每个词生成概率在统计上服从参数分布，根据共轭的后验分布，对参数估计进行调整并逐步迭代。根据一篇法律文本中的所有词而生成服从多项分布的潜在主题分布，主题模型是一种词袋模型，即具有相同词语而词序不同的文本，其主题分布一样。法律术语比一般词语信息量更大，如果不对这类词进行特别处理，只是以统计和概率抽取词，这将会使主题分布忽略法律语义背景。应当在法律文本中，赋予法律术语一个更高的权重和地位。


    ### 7.3.2 LDA 原理


    LDA是一种从潜在主题中不断重复实验而产生词的概率模型，其生成过程如图7.30描述。图中`w_m,i`为在第m篇文本的第i个词位置生成的词，`α`是文本到主题分布的狄利克雷超参数，文本总数为`M`，`θ_m`是第m篇文本独立实验的主题多项分布参数。第m篇文本的第i个词位置的潜在主题编号为`z_m,i`。主题数为`K`，`φ_k`为在第i个词位置上潜在主题为k的多项分布独立重复实验的参数，主题到词的狄利克雷超参数为`β`。图中所示的箭头表示服从某种概率分布的条件概率，隐含变量包括`θ_m`、`z_m,i`和`φ_k`。方框`M`表示进行M次独立重复实验，每次产生一篇法律文本。方框`N_m`表示第m篇文本需要进行`N_m`次独立重复实验，每次实验产生一个词。


    ![](images/txt007_30.jpg "pagenumber_ebook=203,pagenumber_book=194")


    图7.30　LDA模型


    用![](images/txt007_31.jpg "pagenumber_ebook=203,pagenumber_book=194")表示第m篇文本在主题编号从1到K上的主题分布，所有的文本包括从第1篇到第M篇的主题分布构成![](images/txt007_32.jpg
    "pagenumber_ebook=203,pagenumber_book=194")矩阵，大小为M×K。用![](images/txt007_33.jpg
    "pagenumber_ebook=203,pagenumber_book=194")表示编号为k主题在各个词上的词分布，所有的主题，包括从编号为1～K的词分布，构成![](images/txt007_34.jpg
    "pagenumber_ebook=203,pagenumber_book=194")矩阵，大小为 K×V，V 是词典的词数量![](images/txt007_35.jpg
    "pagenumber_ebook=204,pagenumber_book=195")和![](images/txt007_36.jpg "pagenumber_ebook=204,pagenumber_book=195")分别服从参数为![](images/txt007_37.jpg
    "pagenumber_ebook=204,pagenumber_book=195")和![](images/txt007_38.jpg "pagenumber_ebook=204,pagenumber_book=195")的
    Dirichlet分布。


    LDA主题模型通过隐藏主题连接文本和词，根据贝叶斯后验概率，生成整个文本的所有单词的概率可以通过边缘概率密度和贝叶斯公式来计算：


    ![](images/txt007_39.jpg "pagenumber_ebook=204,pagenumber_book=195")


    上式涉及贝叶斯全概率公式，参数估计比较困难。吉布斯采样用于在难以直接采样时从某一多变量概率分布中近似抽取样本序列以求解目标，在K维主题中，每个维度轮流采用完全条件概率，以循环方式进行迭代直至收敛：


    ![](images/txt007_40.jpg "pagenumber_ebook=204,pagenumber_book=195")


    表达式¬i是指在第m篇文本中取走第i词位置的词之后的计数![](images/txt007_41.jpg "pagenumber_ebook=204,pagenumber_book=195")是指在第i词位置的词语t在主题编号k下的计数数字，![](images/txt007_42.jpg
    "pagenumber_ebook=204,pagenumber_book=195")为取走词语wi后的统计计数，也就是![](images/txt007_43.jpg
    "pagenumber_ebook=204,pagenumber_book=195")减去1。从主题到词的狄利克雷分布超参数记为β，每个词对应的分项原本不同，为了简化而采用了相同值。![](images/txt007_44.jpg
