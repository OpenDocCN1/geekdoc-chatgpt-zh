    ### 5.2.3 Web Crawler Acquisition


    ![](img/txt005_18.jpg "pagenumber_ebook=136,pagenumber_book=127")


    **Figure 5.18 Deleting Child Nodes**


    On the premise of complying with legal regulations and ethical norms, crawler
    programs can be used to capture and analyze legal texts published on the internet.
    For example, the Australasian Legal Information Institute (AustLII) has published
    recent judgments of the Federal Court of Australia (FCA) online, as shown in Figure
    5.19:


    ![](img/txt005_19.jpg "pagenumber_ebook=136,pagenumber_book=127")


    **Figure 5.19 FCA Judgments**


    The 2006 judgment *Sharman Networks Ltd v Universal Music Australia Pty Ltd* shown
    in the figure can be accessed via `http://www8.austlii.edu.au/cgi-bin/viewdoc/au/cases/cth/FCA/2006/1.html`.
    Each judgment includes practice and procedure, cited and discussed cases, plaintiffs
    and defendants, judgment results, and reasons and basis for the decision. The
    practice and procedure section summarizes legal points or issues derived and extended
    by the judge based on the circumstances of the case, facilitating retrieval, reference,
    citation, discussion, and confirmation of similar legal issues by other legal
    practitioners. To a certain extent, it can be regarded as keywords describing
    the case or a slogan used to publicize the case.


    The website provides web pages to users via the Hypertext Transfer Protocol (`HTTP`).
    The client issues a web page request service using a Uniform Resource Locator
    (`URL`), and the server responds to the request and returns the requested web
    page. Python''s standard library `Requests` provides various `HTTP` connection
    services, supports automatic encoding of `URL` requests and response data, avoiding
    inconsistent encoding formats. To preserve state between requests, `session` is
    used to maintain certain sessions. The `session` object created by the `requests.Session()`
    method can save some connection request parameters and carry session cookies in
    a series of requests sent to the same site, giving coherence to different requests.
    The `HTTP` protocol is based on a client/server access model; the crawler program
    accesses as a proxy client, and relevant fields of the client to be proxied need
    to be filled in the `headers` information. The HTML web page returned by the `session.get()`
    method (i.e., the `HTTP` request) is data in a markup language format. The `BeautifulSoup`
    module provides functions and services for parsing HTML web pages. As shown in
    Figures 5.20 and 5.21:


    ![](img/txt005_20.jpg "pagenumber_ebook=137,pagenumber_book=128")


    **Figure 5.20 Requests Request**


    ![](img/txt005_21.jpg "pagenumber_ebook=138,pagenumber_book=129")


    **Figure 5.21 BeautifulSoup Object**


    In the `BeautifulSoup` object, many control symbols can be seen. For example,
    `<title>` is a tag named "title", `<meta charset="utf-8">` is a tag named "meta"
    with an attribute named "charset" and a value of "utf-8". `bsObj.title` returns
    the first title tag, `bsObj.title.name` returns the name of the first title tag,
    `bsObj.title.string` returns the text content contained in the first title tag,
    and `bsObj.title.parent.name` returns the tag name of the parent tag of the first
    title tag.


    ![](img/txt005_22.jpg "pagenumber_ebook=138,pagenumber_book=129")


    **Figure 5.22 Operations such as Outputting Tag Names of BeautifulSoup Object**


    `bsObj.meta["content"]` outputs the content attribute value of the first meta
    tag, `bsObj.link["href"]` outputs the href attribute value of the first link tag.
    Assigning a value to an existing `link["href"]` modifies the attribute value;
    assigning a value to `link["website"]` which currently has no website attribute
    adds a new attribute; `del` deletes a specified tag attribute, as shown in Figure
    5.23; `bsObj.head.contents` outputs all child nodes of the tag, as shown in Figure
    5.24:


    ![](img/txt005_23.jpg "pagenumber_ebook=139,pagenumber_book=130")


    **Figure 5.23 Operations such as Outputting Tag Attributes of BeautifulSoup Object**


