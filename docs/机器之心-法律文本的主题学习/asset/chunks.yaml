    ![](img/txt003_3.jpg "pagenumber_ebook=87,pagenumber_book=78")


    The running results are shown in Figure 3.2. It can be seen that the stem "hous"
    of "houses" is not a canonical form that can appear independently in a sentence.
    In other words, the purpose of stemming is not to map a word to its canonical
    form, but to group different forms of a word together for more reasonable natural
    language processing.


    ![](img/txt003_4.jpg "pagenumber_ebook=88,pagenumber_book=79")


    Figure 3.2　NLTK Stemming


