    ## 7.3 LDA Topic Model


    ### 7.3.1 Probabilistic Generation of Legal Texts


    The multivariate parameters of the multinomial distribution conform to the form
    of the Dirichlet distribution, and the posterior and prior distributions have
    the same distribution form, i.e., conjugate distributions. When generating a word
    in a legal text, a topic of a certain aspect is first selected with a certain
    probability, and then a word is selected from that topic with a certain probability.
    The continuous repetition of the above process generates a legal text.


    Based on the Bayesian probability assumptions from text to topic and topic to
    word, a three-layer topic model generates a legal text. The generation probability
    of each word statistically follows a parameter distribution. According to the
    conjugate posterior distribution, parameter estimation is adjusted and iterated
    step by step. A latent topic distribution obeying the multinomial distribution
    is generated based on all words in a legal text. The topic model is a bag-of-words
    model, meaning texts with the same words but different word orders have the same
    topic distribution. Legal terms carry more information than general words. If
    these words are not specially treated and are only extracted by statistics and
    probability, the topic distribution will ignore the legal semantic background.
    Legal terms should be given a higher weight and status in legal texts.


    ### 7.3.2 LDA Principles


    LDA is a probabilistic model that generates words by repeatedly sampling from
    latent topics. Its generative process is described in Figure 7.30. In the figure,
    `w_m,i` is the word generated at the i-th word position in the m-th document;
    `α` is the Dirichlet hyperparameter for the document-to-topic distribution; the
    total number of documents is `M`; `θ_m` is the topic multinomial distribution
    parameter for the independent experiment of the m-th document. The latent topic
    number at the i-th word position of the m-th document is `z_m,i`. The number of
    topics is `K`; `φ_k` is the parameter for the independent repeated experiment
    of the multinomial distribution where the latent topic at the i-th word position
    is k; the Dirichlet hyperparameter for topic-to-word is `β`. The arrows shown
    in the figure represent conditional probabilities obeying certain probability
    distributions. Latent variables include `θ_m`, `z_m,i`, and `φ_k`. Box `M` indicates
    M independent repeated experiments, each producing a legal document. Box `N_m`
    indicates that the m-th document requires `N_m` independent repeated experiments,
    each producing a word.


    ![](img/txt007_30.jpg "pagenumber_ebook=203,pagenumber_book=194")


    Figure 7.30　LDA Model


    Use ![](img/txt007_31.jpg "pagenumber_ebook=203,pagenumber_book=194") to represent
    the topic distribution of the m-th document on topic numbers 1 to K. The topic
    distributions of all documents, from the 1st to the M-th, constitute the ![](img/txt007_32.jpg
    "pagenumber_ebook=203,pagenumber_book=194") matrix, of size M×K. Use ![](img/txt007_33.jpg
    "pagenumber_ebook=203,pagenumber_book=194") to represent the word distribution
    of topic number k on various words. The word distributions of all topics, including
    those numbered 1 to K, constitute the ![](img/txt007_34.jpg "pagenumber_ebook=203,pagenumber_book=194")
    matrix, of size K×V, where V is the vocabulary size. ![](img/txt007_35.jpg "pagenumber_ebook=204,pagenumber_book=195")
    and ![](img/txt007_36.jpg "pagenumber_ebook=204,pagenumber_book=195") respectively
    follow Dirichlet distributions with parameters ![](img/txt007_37.jpg "pagenumber_ebook=204,pagenumber_book=195")
    and ![](img/txt007_38.jpg "pagenumber_ebook=204,pagenumber_book=195").


    The LDA topic model connects documents and words through latent topics. According
    to the Bayesian posterior probability, the probability of generating all words
    in the entire document can be calculated through the marginal probability density
    and Bayes'' formula:


    ![](img/txt007_39.jpg "pagenumber_ebook=204,pagenumber_book=195")


    The above formula involves the Bayesian law of total probability, making parameter
    estimation difficult. Gibbs sampling is used to approximately draw a sequence
    of samples from a multivariate probability distribution when direct sampling is
    difficult, in order to solve the target. In the K-dimensional topics, each dimension
    takes turns using the full conditional probability, iterating cyclically until
    convergence:


    ![](img/txt007_40.jpg "pagenumber_ebook=204,pagenumber_book=195")


    The expression ¬i refers to the count after removing the word at the i-th word
    position in the m-th document. ![](img/txt007_41.jpg "pagenumber_ebook=204,pagenumber_book=195")
    refers to the count of word t at the i-th word position under topic number k.
    ![](img/txt007_42.jpg "pagenumber_ebook=204,pagenumber_book=195") is the statistical
    count after removing word wi, i.e., ![](img/txt007_43.jpg "pagenumber_ebook=204,pagenumber_book=195")
    minus 1. The Dirichlet distribution hyperparameter from topic to word is denoted
    as β. Although each word originally corresponds to a different component, the
    same value is used for simplification. ![](img/txt007_44.jpg "pagenumber_ebook=204,pagenumber_book=195")
    represents the count of all words belonging to topic k after removing the word
    wi at the i-th word position. Obviously, the probability of the word wi at the
    i-th word position under topic number k is the front part of formula (7.2), i.e.,
    ![](img/txt007_45.jpg "pagenumber_ebook=204,pagenumber_book=195")


    ![](img/txt007_46.jpg "pagenumber_ebook=204,pagenumber_book=195")


