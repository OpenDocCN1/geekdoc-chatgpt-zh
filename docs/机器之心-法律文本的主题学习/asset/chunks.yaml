    对于一词多义的词，根据上下文，多个同形不同义的词可以分别属于多个不同主题。例如，词语“set”在主题1中可以理解为“法规配套”之义，也可以出现在主题2的上下文环境中，在语义上理解为“数据集”。给文本中的每个词分配一个所属的主题，然后将划分在同一主题下的词放置在一起，按照这样方式组织起来的一篇文本，从总体结构上来看，就是由不同主题混合而成的。如图4.4
