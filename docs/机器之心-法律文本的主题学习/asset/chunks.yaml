  trans: '

    After segmenting legal texts and removing words belonging to legal terms, the
    texts are represented according to the Vector Space Model, followed by feature
    selection. The retained words constitute a general vocabulary dictionary or a
    common words dictionary. The general vocabulary dictionary together with the legal
    terms dictionary constitutes the text representation dictionary.


    ## 4.2 Legal Text Topics


    ### 4.2.1 Characteristics of Legal Text Topics


    With the rapid development of the Internet, the volume of online information has
    shown explosive growth, and a large amount of information belongs to textual data,
    making legal texts increasingly important. Legal terms may belong to different
    branches of law depending on the social relations they regulate. Legal terms with
    the same standard belong to the same branch of law. Classified by branch of law,
    legal terms include: constitutional terms, criminal law terms, civil law terms,
    procedural law terms, administrative law terms, international law terms, etc.
    Constitutional terms include state structure, form of government, fundamental
    law, power of removal, suffrage, etc.; criminal law terms include crime, recidivism,
    suspended sentence, parole, confiscation of property, fixed-term imprisonment,
    corporate crime, etc.; civil law terms include legal person, agency, contract,
    guardian, heir, liquidated damages, mortgage right, debtor, etc.; procedural law
    terms include witness, testimony, appeal, recusal, interrogation, arbitration,
    public prosecution, final instance, jurisdiction, etc.; administrative law terms
    include administrative act, administrative subject, administrative reconsideration,
    summary procedure, administrative penalty, etc.; international law terms include
    sovereignty, treaty, immunity, national treatment, etc.


    According to the different meanings conveyed by legal terms, they can be divided
    into terms expressing rights, terms expressing appellations, terms expressing
    charges, terms expressing names of things, terms expressing legal acts, terms
    expressing branches of law, terms expressing legal consequences, terms expressing
    mental attitudes, terms expressing legal relations, terms expressing litigation
    procedures, and others. Terms expressing rights include: power of agency, copyright,
    trademark right, personal right, property right, mortgage right, etc.; terms expressing
    appellations include: agent, partner, candidate, public prosecutor, party, defender,
    etc.; terms expressing charges include: smuggling crime, crime of endangering
    public safety, financial fraud crime, crime of infringing property, etc.; terms
    expressing names of things include: deposit, contract, right, fruits (legal term),
    fine, immovable property, judgment document, etc.; terms expressing legal acts
    include: auction, bidding, bankruptcy, amnesty, commutation of sentence, defense,
    instigation, investigation, etc.; terms expressing branches of law include: criminal
    law, civil law, contract law, education law, marriage law, tort law, etc.; terms
    expressing legal consequences include: liability for breach of contract, tort
    liability, civil liability, criminal liability, administrative penalty, etc.;
    terms expressing mental attitudes include: intent, negligence, fault, recklessness,
    etc.; terms expressing legal relations include: personal relations, property relations,
    etc.; terms expressing litigation procedures include: first instance, second instance,
    retrial, final instance, etc. The thematic classification of legal terms is shown
    in Table 4.1.


    **Table 4.1 Thematic Classification of Legal Terms**


    ![](img/txt004_1.jpg "pagenumber_ebook=106,pagenumber_book=97")


    Continued Table


    ![](img/txt004_2.jpg "pagenumber_ebook=107,pagenumber_book=98")


    According to the different functions of legal terms, they can be divided into
    nominative, qualitative, and dispositive categories. Nominative terms denote the
    names of persons or things in legal relations. Terms denoting names of participants
    in legal relations include: plaintiff, witness, represented person, etc.; terms
    denoting charges include: crime of obstructing justice, crime of infringing property,
    crime of dereliction of duty, crime of embezzlement and bribery. Terms denoting
    penalties include: principal punishment, supplementary punishment, control, criminal
    detention, fine, fixed-term imprisonment, life imprisonment, etc. Qualitative
    terms are legal terms that define the nature of legal relations, legal acts, and
    legal facts. Terms defining legal acts include: surrender, meritorious service,
    attempted crime, consummated crime, emergency avoidance, justifiable defense;
    terms defining legal facts include: joint crime, corporate crime, gang crime,
    recidivism, etc. Dispositive legal terms refer to the disposition of consequences
    caused by certain illegal acts, for example, suspended sentence, commutation of
    sentence, parole, combined punishment for several crimes, confiscation of property,
    etc.


    ### 4.2.2 Thematization of Legal Texts


    The thematization of legal terms originated earliest in library cataloging systems.
    The formation and development of the subject method system began in 1856 with
    Crestadoro''s *Technique of Library Cataloging* in the UK. The earliest foreign
    use of subject methods to organize catalog indexes was the relative index of the
    Dewey Decimal Classification. The Brigham Young University Library (Note: "贝加逊·富兰克林出借图书馆"
    likely refers to a specific library, possibly "Bixby Franklin Library" or similar,
    but "Brigham Young" is "杨百翰". "贝加逊·富兰克林" transliterates to "Bixby Franklin" or
    "Beggs Franklin". I will translate literally as "Bixby Franklin Lending Library")
    was the first in the US to use the subject method. In the legal field, legal terms
    or legal vocabulary have their special connotations and cannot be arbitrarily
    interpreted or explained. Some legal terms are created by legislative bodies,
    some are created by adopting foreign ideas, and some are recompiled by inheriting
    ancient legal thoughts. Legal terms have their own unique internal structure and
    morpheme formation methods. From a linguistic perspective, they include compound
    and derivative types. Compound type refers to combining two or more morphemes,
    e.g., "Civil Law" (Minfa); derivative type refers to forming words by adding affixes
    to morphemes with lexical meaning, e.g., "Principal" (Weituoren - agent/principal).
    Legal terms possess distinct cohesion, statutory nature, accuracy, and univocality
    in their connotations.


    The cohesion of legal terms means a legal term is an indivisible solid entity.
    For example, "Principal" (Weituoren) cannot be arbitrarily expressed as "Person
    of Entrustment" (Weituo de ren). The indivisible characteristic of legal terms
    reflects the solemnity and stability of law, used to express complete legal meaning.
    The statutory nature of legal terms means the connotation of a legal term is exactly
    stipulated by law and cannot be interpreted arbitrarily. For example, "Evidence"
    (Zhengju) as stipulated by law differs from evidence in the general sense; it
    applies to specific situations in the legal field and has a definite object form
    that can prove relevant facts, such as documentary evidence, physical evidence,
    witness testimony, party statements, etc. The statutory nature of legal terms
    reflects the authority of law; legislative bodies must uniformly expound the connotations
    of legal terms. The accuracy of legal terms means precisely describing legal content
    to reach consensus among legislators, citizens, and judicial officers, avoiding
    ambiguity and vagueness in the understanding of legal concepts, and being able
    to accurately express the internal characteristics of legal acts, legal relations,
    legal consequences, and legal concepts. For example, "Minor Injury" (Qingshang)
    refers to causing a certain degree of damage to human tissues and organs or partial
    functional impairment. According to general language understanding, the injury
    might not be serious, but legal "Minor Injury" may differ from the perception
    in daily life. To accurately describe the legal connotation of "Minor Injury,"
    explicit provisions are made in the *Standards for Identification of Minor Injuries
    of the Human Body*. The univocality of legal terms means a legal term in a legal
    text can only express a single legal connotation; there are no multiple interpretations.
    For example, "Domicile" (Jusuo) in general language refers to the current place
    of residence, or possibly the registered residence (hukou), but in legal terms,
    it refers specifically to the registered residence. If a legal term has multiple
    meanings, different understandings will arise during legal application and judicial
    process, affecting the authority and solemnity of law.


    In many legal information retrieval systems, retrieval can be performed by subject
    method. For example, on China Judgments Online, retrieval can be performed by
    cause of action, keywords, court, parties, and lawyers, among which the cause
    of action is a legal subject or legal field to a certain extent. Causes of action
    are divided into criminal, civil, execution, state compensation, and administrative
    causes of action according to legal affairs subjects. Criminal causes of action
    include: crimes of endangering national security, crimes of endangering public
    safety, crimes of disrupting the order of the socialist market economy, crimes
    of infringing upon citizens'' personal rights and democratic rights, crimes of
    infringing upon property, crimes of obstructing social administration order, crimes
    of endangering national defense interests, crimes of embezzlement and bribery,
    crimes of dereliction of duty, crimes of soldiers violating duties, etc. Civil
    causes of action include: personality rights disputes, marriage, family and inheritance
    disputes, property rights disputes, contract disputes, disputes over negotiorum
    gestio and unjust enrichment, intellectual property and competition disputes,
    labor and personnel disputes, maritime and commercial disputes, corporate, securities,
    insurance, and negotiable instrument disputes, tort liability disputes, etc. Execution
    causes of action include: criminal, civil, administrative, non-litigious administrative
    execution, sanctions decisions for obstructing litigation, civil sanction decisions,
    retrial of objections to execution rulings by lower courts, property preservation,
    advance execution, etc. State compensation causes of action include: criminal
    compensation, non-criminal compensation, etc. Administrative causes of action
    include: administrative subject, administrative act. In the FCA system, classification
    retrieval is performed by legal subject, including Admiralty & Maritime, Antitrust,
    Bankruptcy, Commercial Law, Construction Law, Corporations, Energy & Environment,
    Estate Planning, Family Law, Finance Banking, Government Contracts, Health Law,
    Labor & Employment, Municipal Law, Pension & Retirement Benefits, Products Liability,
    Real Property, Securities, etc.


    The cause of action subject has four levels. Level 1 subjects have 4 categories:
    Civil, Criminal, Administrative, State Compensation. Under the Civil legal field,
    Level 2 subjects have 10 categories: Property Rights Disputes, Personality Rights
    Disputes, Marriage, Family and Inheritance Disputes, Contract, Negotiorum Gestio
    and Unjust Enrichment, Intellectual Property and Competition, Labor and Personnel
    Disputes, Maritime and Commercial Disputes, Railway Transport Disputes, Corporate,
    Securities, Insurance, and Negotiable Instruments, Tort Liability Disputes. Under
    the Level 2 subject Property Rights Disputes, Level 3 subjects have 6 categories:
    Immovable Property Registration, Property Rights Protection, Ownership Disputes,
    Usufructuary Rights, Security Rights, etc. Under the Level 3 subject Ownership
    Disputes, Level 4 subjects have 10 categories: Infringement of Collective Organization
    Rights, Building Sectional Ownership, Owner''s Right of Revocation, Owner''s Right
    to Know, Return of Lost Property, Return of Drifted Property, Neighbor Relations,
    Co-ownership Disputes, etc.


    Based on the above analysis, referring to the Discipline Catalog of the Academic
    Degrees Committee of the State Council, the legal fields and subjects are coded.
    Level 1, Level 2, Level 3, and Level 4 subjects are all represented by two Arabic
    numerals, in the format `aabbccdd`, where `aa` represents Level 1 subject, `bb`
    represents Level 2 subject, `cc` represents Level 3 subject, and `dd` represents
    Level 4 subject. If `aa` is `01`, it represents the Civil legal field; `02` represents
    the Criminal legal field; `03` represents the Administrative legal field; `04`
    represents the State Compensation legal field. Civil Law includes 10 Level 2 subjects,
    32 Level 3 subjects, and 416 Level 4 subjects (Note: Original text says "416 个三级主题"
    for Level 4, likely a typo for "四级主题" in source, translated as Level 4 subjects).
    Criminal Law includes 10 Level 2 subjects and 187 Level 3 subjects. Administrative
    Law includes 2 Level 2 subjects and 58 Level 3 subjects. State Compensation includes
    2 Level 2 subjects. Since Civil Law is private law, covering a very wide range
    and regulating complex legal relations, it therefore has four-level legal subjects.
    Criminal Law embodies the principle of legality of crimes and punishments, having
    three-level subjects to define charges. Administrative Law reflects government
    administrative management functions, having three-level subjects. State Compensation
    has relatively fewer cases, having two-level subjects. From this, it can be seen
    that legal domains possess imbalance.


    For detailed coding of legal subjects, see Appendix B. Coding legal subjects enables
    convenient, rapid, and accurate determination of the legal subject hierarchy corresponding
    to the legal content. For example, given two texts containing "Restoration to
    Original State" (Huifu Yuanzhuang) and "Elimination of Danger" (Xiaochu Weixian)
    respectively, by querying Appendix B, the code for "Restoration to Original State"
    is `01030206`, and for "Elimination of Danger" is `01030204`. It can be known
    that both are Level 4 legal subjects, and their common legal source is `01` Civil
    Law, `03` Property Rights, `02` Property Rights Protection. Given another two
    texts: "Restoration to Original State" and "Co-ownership Dispute" (Gongyou Jiufen).
    By querying Appendix B, the code for "Restoration to Original State" is `01030206`,
    and for "Co-ownership Dispute" is `01030310`. It can be known that both are Level
    4 legal subjects, and their legal source is `01` Civil Law, `03` Property Rights.
    Therefore, in terms of legal source, the legal semantic distance between "Restoration
    to Original State" and "Elimination of Danger" is closer than that between "Restoration
    to Original State" and "Co-ownership Dispute".


    ## 4.3 Legal Text Topic Models


    ### 4.3.1 Topic Semantic Analysis


    *International Private Law*, *Deep Learning*, *Legal Theory*, *Punishment, Compensation
    and Law*, *Introduction to Algorithms*, *R for Data Science*, *Digital Fortress*,
    *Python and Digital Forensics Technology*, *Computer Ethics*, *Network Community*,
    *Computer Technology and Society, Law and Ethics*, *Network Security* are some
    best-selling book series provided by an e-commerce platform. In terms of book
    management, these publications can be categorized into 3 classes: Law, Computer,
    and Computational Law. To introduce these books to readers, we have compiled the
    content summaries of these books.


    From Figure 4.1, it can be seen that the topics of this text include content in
    the legal direction, content in the computer direction, and content in the intersection
    of the two. Topic 1 is legal-related concepts, involving words such as "private
    law, rules, judicial, jurisdiction, legal areas", and also includes some other
    words, such as "design", but with a lower proportion in legal concepts. Topic
    2 is computer-related concepts, involving words such as "machine learning, artificial
    intelligence, computers, computing, data, networks", and also includes some other
    words, such as "technology", with a lower proportion in computer concepts than
    the former, but higher than words like "use". Topic 3 is computational law-related
    concepts, involving words such as "procedures, values and practices, govern, computer
    law, intellectual property", and also includes some other words, such as "data
    security".


    ![](img/txt004_3.jpg "pagenumber_ebook=110,pagenumber_book=101")

    **Figure 4.1 A Text Containing 3 Topics**


    Topic modeling can be simply understood as grouping words with similar meanings
    in a text under one topic. For example, words like "machine learning, artificial
    intelligence, computers, computing, data, networks" all contain the meaning of
    computer, are semantically near-synonyms, and their semantic scope can span sentences,
    paragraphs, and chapters. Topic models, through semantic analysis technology,
    define meaning-associated words as a topic; a topic is an abstract concept that
    exists or is implicit behind words after understanding the context.


    A text has many topics; each topic includes multiple words; each word can belong
    to multiple topics. Some topic-model-related or similar words cluster into a group,
    called a topic. A text can be understood as a mixture of these different topics
    in different proportions, as shown in Figure 4.2:


    ![](img/txt004_4.jpg "pagenumber_ebook=111,pagenumber_book=102")

    **Figure 4.2 Topic Modeling**


    In the figure, ① is the text dataset, including a large amount of text corpus.
    By reading these text materials, the content of these text corpora can be summarized
    from a semantic perspective into 3 topic aspects: Legal Field, Computer Science,
    and Legal-Computer Interdisciplinary Field. ② in the figure is a text extracted
    from the text dataset, composed of many words, including words belonging to the
    legal field, words belonging to computer science, and words belonging to the legal-computer
    interdisciplinary category, as shown in Figure 4.3:


    ![](img/txt004_5.jpg "pagenumber_ebook=112,pagenumber_book=103")

    **Figure 4.3 A Text**


    For polysemous words, according to context, multiple homographs with different
    meanings can belong to different topics respectively. For example, the word "set"
    in Topic 1 can be understood as "statutory scheme" (or "set of rules"), and can
    also appear in the context of Topic 2, understood semantically as "dataset". Assigning
    a topic to each word in the text, and then placing words divided under the same
    topic together, a text organized in this way, from the overall structure, is mixed
    by different topics. As shown in Figure 4.4:


    ![](img/txt004_6.jpg "pagenumber_ebook=112,pagenumber_book=103")

    **Figure 4.4 Text Mixed by Different Topics**


    Each topic governs some words. Under a topic, some words appear repeatedly many
    times, while some words appear fewer times. Taking the total word count of all
    words under the same topic as the denominator and the number of occurrences of
    a certain word as the numerator, the proportion of this word in this topic can
    be calculated. Obviously, words with higher weights have stronger correlation
    with the topic, and vice versa. For example, the word "law" appears frequently
    under the legal topic, while "hello" rarely appears. The word "data" appears more
    frequently under the Computer Science topic, while "welcome" is not common. The
    word distribution and statistics for each topic are shown in Figures 4.5, 4.6,
    and 4.7:


    ![](img/txt004_7.jpg "pagenumber_ebook=113,pagenumber_book=104")

    **Figure 4.5 Distribution of Some Words in Topic 1**


    ![](img/txt004_8.jpg "pagenumber_ebook=113,pagenumber_book=104")

    **Figure 4.6 Distribution of Some Words in Topic 2**


    ![](img/txt004_9.jpg "pagenumber_ebook=113,pagenumber_book=104")

    **Figure 4.7 Distribution of Some Words in Topic 3**


    ### 4.3.2 Applications of Topic Modeling


    For the processing of large amounts of legal texts and other texts, relying solely
    on word matching to determine data analysis tasks is far from sufficient. Mining
    the abstract topics behind words is more meaningful; this will help improve the
    accuracy of text similarity calculation and discover popular vocabulary under
    a certain topic. In terms of the matching degree of search engine query fields,
    it can automatically and quickly locate word clusters in massive text data according
    to semantic understanding.


    In terms of similar text comparison, measuring by the number or proportion of
    identical words may not be accurate. For example, the aforementioned English sentence
    "the head controlled the man with arms" appears in a context with a large proportion
    of legal topics, meaning "the ringleader controlled the man with guns (arms)".
    If this sentence appears in a context with a large proportion of computer science
    literature topics, it means "the intelligent agent protected the man with arms
    (limbs)". For measuring the similarity of these two sentences, if calculated purely
    by words, the similarity will be 100%; if estimated by the topic distribution
    behind each word, the similarity will be less than 50%.


    Language is an expression formed by long-term use by people, and also a manifestation
    of traditional culture and regional customs. Language phenomena are intricate
    and complex, inevitably containing many subtle differences, such as polysemy and
    synonymy. General semantic analysis struggles to capture such subtle differences,
    while topic models are very suitable for this situation. For example, the English
    sentence "Laws set out a set of procedures and rules" is a case of polysemy. If
    "Laws" is replaced by another word "Algorithm", the meaning of the following words
    changes: the former describes law as a set of standardized behaviors and norms,
    while the latter emphasizes that the algorithm generates some management procedures.
    If compared from the word level, there is almost no difference. But if a topic
    label is assigned to each word, even the same word can be assigned different topic
    labels, as shown in Figure 4.8:


    ![](img/txt004_10.jpg "pagenumber_ebook=114,pagenumber_book=105")

    **Figure 4.8 Topic Modeling Supports Semantic Mining**


    The figure shows two texts; the main content of one is legal, and the other is
    about computers. The symbol `#` in the text indicates that the word at that position
    is assigned topic label `#`, and the symbol `*` indicates assignment to topic
    label `*`. The progress bar below indicates the proportion of a certain topic
    in the text. Assuming both texts have 1000 words, with 800 words identical, using
    word-based text similarity calculation yields 80% similarity. If among the 800
    identical words, 600 are marked with different topics, and among the 200 different
    words, 100 are marked with different topics, calculating text similarity by the
    number of topic labels yields 30% similarity. Obviously, 30% similarity is more
    reliable than 80%. By analyzing the topic distribution behind words, subtle differences
    in language and the effect of context can be discovered.


    ### 4.3.3 Latent Semantic Analysis


    In the era of high-speed mobile Internet and Big Data, people''s learning, life,
    and work are all conducted in network and data environments. Every day, massive
    amounts of content and text are sent through social media. People discuss around
    a certain topic and discover users with common interests. How to store, organize,
    manage, and analyze data resources will be an important issue faced by text information
    processing. Traditional analysis methods use words to represent semantic content
    and match common topics by words. This shallow analysis method cannot represent
    and solve deep or latent semantic relationship problems. It can be considered
    that when people use social media to speak, they first think of a category of
    topics or themes, and then think of words. In other words, there exists an intermediate
    abstract connection layer between text and words, and it is precisely this abstract
    connection layer that associates different users with a topic.


