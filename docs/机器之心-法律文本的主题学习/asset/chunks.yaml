    `k` is denoted as `Nk`. According to Equation (7.6), the topic-to-word distribution
    matrix ![](img/txt007_58.jpg "pagenumber_ebook=205,pagenumber_book=196") can be
    generated.


    To measure the similarity between two texts in the Vector Space Model, Euclidean
    distance, Manhattan distance (absolute value distance), and cosine similarity
    can be used. Based on the difference in topic distributions between two texts,
    the cosine similarity between two legal texts can be calculated:


    ![](img/txt007_59.jpg "pagenumber_ebook=205,pagenumber_book=196")


    `docsim(di, dj)` is the cosine similarity between legal text `di` and text `dj`.
    Assuming the 0-th text is the new text to be matched, the cosine similarity with
    each of the remaining legal texts is calculated, and the legal text `dmax` with
    the maximum cosine similarity value is returned:


    ![](img/txt007_60.jpg "pagenumber_ebook=205,pagenumber_book=196")


    The legal text with the maximum cosine similarity value is the most similar text.
    In the `θ` matrix, the `dmax`-th row is found to obtain the topic numbers in the
    topic distribution of that legal text.


    ## 7.4 LDA Topic Analysis of Chinese Legal Texts


    ### 7.4.1 Chinese Legal Terminology LDA Model


    The corpus data comes from China Judgments Online (CJO), referred to as the `CJO`
    dataset. A total of 1,103 court judgments were selected. Word segmentation was
