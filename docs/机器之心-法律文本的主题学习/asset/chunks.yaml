    Figure 8.28　AUC of SVC support vector machine on English FCA legal terminology
    feature space


    The parameters of the logistic linear regression supervised topic model for the
    English FCA legal terminology feature space are shown in Figure 8.29, where `_K`
    is 10. Training using the logistic linear regression supervised topic model on
    the English FCA legal terminology feature space is shown in Figure 8.30, with
    a training time of approximately 59 seconds. The classification performance of
    `BLSLDA` on the English FCA legal terminology feature space is shown in Figure
    8.31, with an accuracy of approximately 0.87. The AUC of `BLSLDA` on the English
