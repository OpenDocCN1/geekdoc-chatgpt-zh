    ### 7.3.3 Text Similarity


    The latter part of Equation (7.2), ![](img/txt007_47.jpg "pagenumber_ebook=204,pagenumber_book=195"),
    represents the word count for topic number `k` in the `m`-th text. ![](img/txt007_48.jpg
    "pagenumber_ebook=204,pagenumber_book=195") denotes the statistics after removing
    the word `wi`, i.e., ![](img/txt007_49.jpg "pagenumber_ebook=204,pagenumber_book=195")
    minus 1. The Dirichlet distribution hyperparameter from text to topic is denoted
    as `α`, and the same value is adopted for simplification. ![](img/txt007_50.jpg
    "pagenumber_ebook=204,pagenumber_book=195") represents the word count of the `m`-th
    text after removing the word `wi` at the `i`-th position. Obviously, the probability
    of topic number `k` under the `m`-th text is the latter part of Equation (7.2),
    i.e., ![](img/txt007_51.jpg "pagenumber_ebook=204,pagenumber_book=195")


    ![](img/txt007_52.jpg "pagenumber_ebook=204,pagenumber_book=195")


    Following Equations (7.3) and (7.4) for Gibbs sampling, the latent topic label
    for the word `wi` at the `i`-th position of the `m`-th text is denoted as `zm,i`.
    Probability parameter estimation is performed based on the posterior distribution
    and pseudo-counts:


    ![](img/txt007_53.jpg "pagenumber_ebook=205,pagenumber_book=196")


    ![](img/txt007_54.jpg "pagenumber_ebook=205,pagenumber_book=196") is the word
    count under topic number `k` in the `m`-th text. The total number of words in
    the `m`-th text is denoted as `Nm`. According to Equation (7.5), the text-to-topic
    distribution matrix ![](img/txt007_55.jpg "pagenumber_ebook=205,pagenumber_book=196")
    can be generated.


