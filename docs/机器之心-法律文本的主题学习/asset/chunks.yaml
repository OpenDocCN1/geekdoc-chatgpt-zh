    In Figure 3.1, understanding the general word "Unpacked" from the perspective
    of morphemes, "pack" means packaging, constituting the core meaning of the word,
    occupying the most important position in the morpheme, and is called the root.
    "Un" is at the front of the word, indicating a reverse action, and is called a
    prefix. "Unpack" occupies the main position of the word, called the stem, meaning
    to unpack/open; the main meaning of the word is determined by the stem. "ed" is
    at the end of the word, indicating the past state of the word, and is called a
    suffix. Comprehensive analysis shows that the meaning of "Unpacked" is the state
    of being packed first and then unpacked; the direct meaning is opened.


    Understanding the legal vocabulary "Undefended" from the perspective of morphemes,
    "defend" means defense. In law, it refers to the activity where the defense party
    presents reasons and relevant evidence favorable to the defendant for the purpose
    of mitigating the crime or achieving acquittal. Specific behaviors include rebutting
    and pleading against the prosecution''s accusations. The prefix "Un" indicates
    giving up a certain action, exempting a certain action, or not performing a certain
    action. The stem "Undefend" means giving up defense or not defending. The suffix
    "ed" indicates the past tense that has already occurred, a result state. Comprehensive
    analysis shows that "Undefended" means adjectivally undefended/uncontested; the
    reasons for not contesting may be various. For example, the defendant is absent
    from trial, the defendant does not make a plea statement, the defendant does not
    submit a defense statement, etc. Related legal terms include "Undefended case"
    (undefended case), "Undefended divorce" (undefended divorce), "Undefended lawsuit"
    (undefended lawsuit).


    A word is the smallest formal unit and semantic unit that can be extracted in
    a sentence structure. Words and morphemes are easily confused; although they are
    highly related, the differences are also distinct. A word can appear independently;
    some morphemes can appear independently, while others cannot. For example, the
    singular form of "case" can appear independently, and the plural form "cases"
    can also appear independently. The morpheme "case" in "cases" can appear independently,
    but "s" cannot. However, when a morpheme can appear independently, it must possess
    independent meaning, i.e., it is a root. For example, "case" has an independent
    meaning (case/instance); "case" can appear as a word and also serve as a root
    to derive other words. Morphemes that cannot appear independently have a modifying
    function and have no specific meaning themselves. For example, "s" indicates plural
    or third-person singular, having no actual descriptive content itself.


    From the relationship between words and morphemes, morphemes can appear independently
    or derive new words in other forms. Morphemes that do not need to attach to other
    morphemes and can form words independently are called free morphemes, sometimes
    also called independent morphemes or unbound morphemes. For example, "air" is
    a free morpheme, "line" is also a free morpheme; these two free morphemes can
    form a compound word "airline", but the compound word "airline" and the separately
    occurring phrase "air line" have different meanings. "Airline" specifically refers
    to an airline company, while "air line" also has the meanings of straight line
    and air pipeline. Bound morphemes are parts formed by roots plus some affixes,
    including inflectional morphemes and derivational morphemes.


    Inflectional morphemes refer to suffixes added after the root; from a grammatical
    perspective, they attach grammatical features such as number, part of speech,
    and tense to the word. English includes 8 inflectional morphemes: "''s" indicates
    the possessive case of nouns; "s" indicates the plural form of nouns, and can
    also indicate the third-person singular of verbs; "ing" indicates the present
    participle of verbs; "ed" indicates the past tense of verbs; "en" indicates the
    past participle of verbs; "er" indicates the comparative degree of adjectives
    or adverbs; "est" indicates the superlative degree of adjectives or adverbs. For
    example, "defendants" refers to multiple defendants; "s" changes "defendant" to
    plural. "Defended" is the past tense of the verb defend or the adjective defended;
    "ed" changes the verb "defend" to past tense or adjective.


    Derivational morphemes are affixes that combine with roots to form new meanings;
    the meaning of the new word varies with different affixes. For example, in the
    word "undefendable", "defend" is the root, meaning the verb defend; the suffix
    "able" converts the verb defend into the adjective defensible; the prefix "un"
    converts the adjective defensible into the antonym indefensible. In the word "biweekly",
    "week" is the root, meaning the noun week; the suffix "ly" converts the noun week
    into the adjective weekly; the prefix "bi" converts the adjective weekly into
    biweekly (fortnightly). The above examples illustrate that derivational morphemes
    "un" and "bi" change the meaning of the root: "un" adopts the opposite meaning
    of the root, "bi" adopts twice the quantity of the root.


    The relationship between stem and root can be seen from the morphology of the
    word "unpacked": the part remaining after removing the suffix "ed" is the stem;
    then removing the affix "un" from the stem yields "pack", which, if it cannot
    be further divided, is the root. Correspondingly, for the word "packed", removing
    the suffix yields the stem "pack", which is also the root. Therefore, the stem
    corresponding to a free morpheme is the root, while the stem corresponding to
    a derivational morpheme is not the root.


    ### 3.1.3 NLTK and Polyglot Morphemes and Stems


    According to search engine and information retrieval terminology, a stem is the
    main part remaining after removing the redundant parts of a word. Search engines
    use stemming methods to retrieve web pages queried by users. For example, if the
    user''s input query is "defendant", the stemming method obtains the stem "defend"
    from the query term; web pages linked based on the stem include both pages containing
    "defendant" and pages containing "defendable".


    The `PorterStemmer` module of the Natural Language Toolkit `NLTK` has two methods
    for stem identification. The first method is to build a very large dictionary
    mapping every word to its stem; the disadvantage is the high cost of maintaining
    the dictionary. The second method uses certain rules to define how to obtain stems
    from words; the disadvantage is that it cannot handle all situations, and the
    rule definition is incomplete, but stem identification for most words is correct,
    and a few errors are acceptable. Therefore, rule-based methods have gradually
    become widely used. The usage of `NLTK`''s `PorterStemmer` is as follows:


