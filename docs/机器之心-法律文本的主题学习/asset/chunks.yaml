    "pagenumber_ebook=204,pagenumber_book=195")表示在取走第`i`词位置的词语`wi`后的第`m`篇文本的词计数。显然，编号为`k`的主题在第`m`篇文本下的概率为式
    (7.2)的后部分，即![](images/txt007_51.jpg "pagenumber_ebook=204,pagenumber_book=195")


