    \n3.3　法律文本句法分析\n\n3.3.1　句法分析的常用方法\n\n在词法分析输出词条之后，自然语言处理的下一个任务就是句法分析，其目的是对句子或者句子局部片段做逻辑意义上的分析。换言之，用一些句子形成规则来定义句子逻辑意义以及衡量句子在逻辑上的正确性。句法分析需要确定句子不同位置之间的依存关系和语法结构，语法是将词语连接成句子的规则和方法，也是概念和符号的表现形式总结。完全句法分析是指对完整的句子进行语法分析，局部分析是指对部分句子片段的语法进行分析。\n\
    \n一般来说，语法分析具体做法包括两方面工作，一方面用非常形式化的描述表示语法规则，另一方面对规则进行解析生成语法树。语法规则包括句子语法结构形式化表示和词条同类信息描述，在前述的词法分析部分中，可以将多次出现的含义相同的词条根据在词典中定义合并成词条项。换言之，句法分析的知识库是形式化规则、词典和词条项。\n\
    \n3.3.2　句法分析树\n\n在不同的语言中，语法规则是不同的。例如，英语中的句子从整体上来看，语法结构为主谓结构。简单的主语一般是名词性短语，复杂的主语一般是在名词短语前有修饰性的定语。简单的谓语一般是动词性短语，包括动宾结构，一个动词后面接名词。复杂的谓语结构一般是在动词短语前有修饰性的状语。英语存在时态、主谓一致、虚拟语气、倒装结构、非限制性定语从句，伴随状语、动词不定式等语法结构和现象，但是在汉语中，这些现象可能并不存在。因此，在进行句法分析之前，需要检测输入的文本或字符串，能够判断属于哪种语言，句法分析工具可以支持这种语法的解析。\n\
    \n在语法树中，用S表示一个句子，dp表示限定性短语，d表示限定词，np表示名词短语，vp表示动词短语，v表示动词。对于句子“the policeman arrested\
    \ the thief”，使用nltk.tree模块定义语法规则:\n\n![](images/txt003_17.jpg \"pagenumber_ebook=98,pagenumber_book=89\"\
    )\n\n运行的结果如图3.9和图3.10所示。可以看出，Tree方法生成一颗包含一个父节点和几个子节点的树，子节点可以是另外一个子树来替换，既可以从顶向下生成树，也可以自底向上生成树，还可以是将两者结合起来的生成方法。\n\
    \n![](images/txt003_18.jpg \"pagenumber_ebook=98,pagenumber_book=89\")\n\n图3.9　nltk的句法分析结果\n\
    \n![](images/txt003_19.jpg \"pagenumber_ebook=98,pagenumber_book=89\")\n\n图3.10　nltk的语法树\n\
    \n自顶向下生成树方法根据定义的规则，生成树从树根向下生长，最后直到组成句子的叶结点的生成。首先使用规则1建立树根“s”和中间节点dp1、vp，然后根据规则推导，使用规则2和规则3来替换中间节点，最后使用规则4替换由规则3产生的中间节点dp2，直到对应词语的全部叶子生成。\n\
    \n自底向上的生成树方法与自顶向下刚好相反。从句子中的词条开始，首先找到能够匹配“the policeman”的规则2，用规则2的左侧“dp1”规约规则2。然后，找到匹配“arrested”的规则3，但是规则3中有待规约的节点“dp2”，将其暂时保存起来。接下来，找到匹配“the\
    \ thief”的规则4，用“dp2”规约规则4。然后，在前述的待规约的规则中，用“vp”规约规则3。最后，使用规则1获得树根“s”。自底向上分析方法重复执行规则的规约过程，直至获得树根节点。\n\
    \nnltk的CFG模块通过fromstring方法构造语法规则，每一行字符串是一个语法规则。符号“-＞”表示可以替换，PP表示介词短语，P表示介词，N表示名词，Det表示限定词，符号“|”表示可选项。对于句子“the\
    \ defendant robbed a car”，使用nltk.CFG模块定义语法规则:\n\n![](images/txt003_20.jpg \"pagenumber_ebook=99,pagenumber_book=90\"\
    )\n\n![](images/txt003_21.jpg \"pagenumber_ebook=100,pagenumber_book=91\")\n\n\
    运行的结果如图3.11所示。可以看出，nltk.CFG使用一系列字符串定义文法规则，构建一个语法分析器。然后将句子传递给语法分析器，返回结果为语法生成树。与nltk.tree相比较而言，定义语法规则较为灵活，形式上更加简洁。\n\
    \n![](images/txt003_22.jpg \"pagenumber_ebook=100,pagenumber_book=91\")\n\n图3.11　nltk\
    \ CFG的句法分析结果\n\n3.4　法律文本语义分析和消歧\n\n3.4.1　语义分析\n\n词法分析任务研究的是文本字符串中的词的表示，输出的是词条。每个词都可能有不同的含义，将每个词组合起来形成更大的组块，以提供对句子或段落的语义理解。语义分析概念范围非常广泛，任何对自然语言的理解都与语义有关，对法律文本理解包括对词的含义、句子结构含义和上下文语境含义的理解。从粒度上看，语义分析分为词级别语义、句子级语义和篇章级语义。\n\
    \n词级别语义分析内容有词语表示、上下位关系、同义词、多义词和词语消歧等。词语表示包括词、词素、词缀、复合词以及短语。语言的多样性使得出现了多个词语具有相同含义和一个词拥有多个含义的现象，例如，“house、building、real\
    \ estate”都有表示房屋的含义，“bank”有银行和河岸等多个意思。法律文本存在一个特殊现象，上位法概念和下位法概念就属于上下位关系，下位法要遵从上位法，有下位法可以循例的，就要适用下位法。“cars、stocks、deposits、real\
    \ estate”是财产的具体形式，属于下位概念，而“property”是上位概念。因此，在涉及房屋交易纠纷时，作为普通财产而言，合同法 (Contract\
    \ Law)可能比较适用。如果作为特殊财产的不动产，物权法 (Property Law)可能比较适用。上下位关系描述一个泛化的对象和具体的对象之间的关系，较少细节的抽象概念称为上位词，而较多细节的实例概念称为下位词。\n\
    \n句子级别语义分析以句法分析为前提，获得词序列的结构性解释。如果存在不同的结构性解释，句子的意义将是不明确的。例如，英文句子“the police controlled\
    \ the defendant with a gun”，在语法结构上，介词短语“with a gun”既可以修饰名词“defendant”，也可以修饰动词“controlled”。这种歧义是由于语法结构多样性产生的，句子级别的语义分析可以通过机器学习方法确定适用哪种语法结构。句子级别的语义分析任务还包括文本蕴含，当一个句子表述为真，能否推导另一个句子也为真，这种关系推导需要建立在句子的语义理解上。语义角色标注借助语义分析方法，标注句子中的语义角色，例如，动作的施加者、接受者、事情发生的事件和地点等。语义角色标注是一种浅层的语义关系，可用于问答系统和信息抽取等方面。\n\
    \n篇章级语义分析为了解决在多个句子、段落等篇章的上下文环境中发生的词语多重含义而考察分析前后多个句子的语义，这种情况较多出现在有多个多重含义的词语以及指称代词的上下文中。例如，英文句子“the\
    \ head controlled the man with arms”，此处的“head”既可以指称“头、思想”，也可以指称“首领”，而“arms”也具有“胳膊”和“武器”两种不同意思。因此，对这样句子的理解，需要结合上下文环境来综合考虑。以下这些词“plaintiff、appellant、accuser”都有“告”的含义，但是具体含义也是有区别的，有时候通过反义词来理解。“plaintiff”的反义词为“defendant”，为民事或刑事案件初审中的被告之义;“appellant”的反义词为“respondent”，为上诉案件中的被上诉人之义;“accuser”的反义词为“the\
    \ accused”，为刑事案件中的被指控者之义。自然语言传达的意义很多时候与表达者所处的情境有关，文本中的词的含义需要由先前文本来确定。语言表达为了避免重复，大量使用代词。在代词的理解上，前文出现的位置相近和词性相同的情况将会使代词的指称产生歧义。例如，英语句子“The\
    \ plaintiff borrowed the car and navigation from the defendants，and he returned\
    \ it to one of them later”，此处“it”是指“car”还是表示“navigation”，出现指代不明确问题。\n\n3.4.2　消歧方法\n\
    \n词语的歧义的消解可以通过定义一个包括各个词义项的词典来实现。例如，WordNet是由计算机工程师和语言学家设计并完成的基于认知语言的英语词典，HowNet是一个基于情感的中文词典，标注了词的不同词义项在实际文本中的使用情况。基于词典的消歧方法的原理是计算两者之间的覆盖度，一个是待消解词和前后上下文环境词，另一个是在词典中该词的各个词义项和其上下文。然后，选择覆盖度或者匹配度最大的词义项作为待消解词在此语义环境下的合适含义。如果词典的词义项的定义比较简洁，计算的覆盖度可能都比较低，这种情况下的消歧效果不是很好。\n\
    \n有监督的词语消歧方法通过词义标注语料库训练词义消解模型，对词语的语料进行特征表示，包括词语特征、句法特征和语义特征等方面。词语特征是指消解词上下文环境中出现的所有词及其词性，例如，取消解词前面3个词，后面2个词，这种取词的范围称为窗口。句法特征是指消解词所在句子的语法特征，例如，消解词构成的语法组块是动宾关系，或是介词短语，还是主语中心词，等等。语义特征是指名词类的语义角色，例如，命名实体标注的地点、机构或者人物名等。监督的消解方法虽然可以获得良好的性能，但是需要很多人工标记的语料。\n\
    \n半监督消歧方法通过少量标记的语料来获得大规模语料和语法结构和语义强度，根据词的不同词义与语法的固定搭配有关这一特点，计算语义强度和选择关联，从而进行词义的消解。随着深度学习方法的广泛应用，可以对大规模语料库自动提取高层词的抽象特征，蕴含了对语料学习的深层次的语义信息。例如，深度学习模型对大规模语料进行训练的过程形成的词嵌入word2vec，本身就包含了细节丰富的上下文语义信息，自动实现词义消解。\n\
    \n\uFEFF\n\n第4章　法律文本的主题建模\n\n4.1　法律文本术语\n\n4.1.1　法律文本中的术语\n\n法律文本中的词语可以分为日常用语、临时具有法律涵义的词语和法律术语。日常用语指的是一般性词语，比如劳动、计算机和汽车等，这类词语来自于一般的社会领域，即人们日常工作生活学习所接触到的事物或现象。临时具有法律涵义的词语也就是临时法律术语，指的是词语本来是日常用语，当被用于法律规范中，具有了法律上的特殊涵义。比如，“应当”和“可以”就具有非常明确的法律涵义，法律条款中出现“应当”是要求相对人必须要做“应当”后面的事项，而“可以”就没有强制性，保留了一定范围的弹性，可以根据实际情形自由裁定。因此，在对法律文本进行预处理时，对法律文本的表示采用向量空间模型，但是考虑到法律文本中的词语具有不同的法律涵义，在分词时需要将法律文本的词汇划分为日常用语、临时法律术语和法律术语三类词语，对不同类型的词语建立不同的向量空间模型，为了简化模型，在本文后面实验中将法律文本划分为一般性词语和法律术语。\n\
    \n4.1.2　法律词语内在结构\n\n法律术语中的合成词包括派生词和复合词，派生词是由一个只表示概念的词素，和一个兼表概念和语法的词素结合而成。法律术语中的派生词一般由一个表示词性后缀的词素附加在已有的法律术语之上，例如审判员、代理人、继承人等。表示权利的派生法律术语有名誉权、商标权、财产权、辩护权、修改权、署名权等;表示人员的派生法律术语有控告人、辩护人、代理人、监护人、抚养人、赡养人、自诉人、公诉人、审判员、陪审员、仲裁员、书记员等;表示文书的派生法律术语有起诉书、判决书、决定书、执行书和仲裁申请书等。复合词由两个及以上词素并列组成的法律术语，从两个词素的关系来分，包括联合式、偏正式、动宾式、述补式、主谓式、连动式等。联合式指的是两个意义相似或相反的词素并列而成，例如询问、收养、抚养、征收、管制、冻结、判决、质询、审讯、逮捕、检举、鉴定、过错、过失、证据、股份、瑕疵等。偏正式指的是前面的词素修饰后面的词素，前面的词素作为定语的是定中式，前面的词素作为状语的是状中式。定中式包括主犯、从犯、主刑、书证、物证、定金等;状中式包括假释、代理、签订等。动宾式指的是前面的词素表示动作，后面的词素表示动作涉及的对象，动宾式有抗诉、立案、上诉、举证、立法、减刑、投标、招标、要约、量刑、违约、听证等。述补式指的是后面的词素补充说明前面的词素，例如侦破、驳回等。主谓式指的是前一个词素是一个对象，后面的词素是对该对象的描述，例如自首、民主等。连动式指的是前面的词素表示前一个动作，后面的词素表示接下来的动作，例如收养、扭送、送达、拘留、提存等。\n\
    \n4.1.3　法律术语词典\n\n按照法律调整关系，可分为诉讼法、民法、刑法、行政法、国际法、经济法、军事法、商法和环境法九个部门法。为了简化研究问题，选取与人们生活工作非常密切的三大法律作为法律术语词典内容。\n\
    \n诉讼法是关于诉讼活动的法律，调整对象是诉讼活动中的所有社会关系，包括民事诉讼法和刑事诉讼法。与诉讼程序有关的法律术语有案件、受理、案由、原告、被告、立案、传票、开庭、出庭、证据、听证、询问、调查、法官、陪审团、辩护、律师、要点、意见、辩护词、答辩状、裁定、裁决、决定、采信、出具、司法鉴定、代理人、第三人、调解、法庭、公诉、自诉、法律顾问、公证人、检察官、逮捕、批捕、责任、缓刑、保释、起诉、反诉状、公诉、作证、目击证人、控告、诉讼、案件、申诉、审判、审理、传唤、传讯、辩护、证词、誓词、宣判、判决、缺席、驳回、上诉、再审、引渡、当事人陈述、调查取证、调查笔录、会见当事人、举证责任、抗诉书、利害关系人、卷宗、民事诉讼、旁证、认定事实、申请人、申诉、适用法律、受害人、书证、司法建议书、送达、撤诉等。详细诉讼法术语见附录A。\n\
    \n民法是调整民事主体之间的人身关系和财产关系的法律规范和体系总称。与民事有关的法律术语有法律渊源、制定法、成文法、普通法、判例法、公序良俗、公平、自愿、平等、诚实信用、等价有偿、自然人、公民、外国人、无国籍人、法人、行为、作为、不作为、民事权利能力、相对权、优先权、救济权、物权、请求权、形成权、撤销权、解除权、代位权、人身权利、名称权、名誉权、荣誉权、肖像权、隐私权、人格权、健康权、不可抗力、意思表示、完全行为能力、住所、居所、经常居住地、户籍、监护、合伙、法人、私营企业、关联企业、社团法人、财团法人、民事法律行为、无效行为、可撤销民事行为、重大误解、显失公平、误传、代理人、委托人、受托人、法定代理人、表见代理、居间、时效、信托、时效中止、期间、法律规避、违约责任等。详细民法术语见附录A。\n\
    \n刑法是规定犯罪和刑罚的法律规范。与刑法有关的法律术语有犯罪、刑事、侦察、罪刑法定、罪刑相适应、罪责自负、惩罚、从旧、从新、追诉时效、刑事责任、刑事责任年龄、刑事责任能力、故意犯罪、犯罪构成、犯罪主体、犯罪客体、主观方面、客观方面、犯罪对象、犯罪故意、直接故意、间接故意、过失、疏忽、大意、过于自信、不能预见、不能避免、动机、目的、防卫过当、正当防卫、紧急避险、既遂、未遂、犯罪形态、犯罪预备、犯罪中止、犯罪中断、行为犯、结果犯、滥用职权、劳役、管制、拘役、累犯、冒充、没收、免除、减刑、谋杀、重伤、虐待、殴打、判处、赔偿、强迫、破坏、强奸、抢夺、抢劫、敲诈勒索、侵害、情节、轻微、社会影响、取保候审等。详细刑法术语见附录A。"
