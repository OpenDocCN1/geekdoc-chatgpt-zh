    models with small data and weaker computing hardware performance. Therefore, some
    experts believe machine learning is an engineering application, not a theoretical
    science. From a rigorous scientific perspective, whether it is big data or small
    data, as long as patterns can be discovered and theoretical models established,
    they can be applied regardless of the scope. Discarding such sectarian prejudice
    and starting from the perspective of solving problems, machine learning has proven
    its value.


    The practical application of machine learning has proven that only valuable methods
    can be widely recognized and disseminated. Although the process of achieving machine
    learning goals requires the accumulation of data and algorithms, as long as we
    believe that the idea of continuous human learning is the source of value creation,
    the development of machine learning in various fields, departments, and directions
    will be unshakable.


    ## 1.3.1 Introduction to Natural Language Processing


    With the application of Artificial Intelligence in areas such as machine translation,
    intelligent Q&A, and intelligent customer service programs, Natural Language Processing
    (`Natural Language Processing`, `NLP`) has become one of the hottest branches
    in the field of AI. Natural language is the object of `NLP` technology research.
    People communicate information through various languages such as Chinese, English,
    and German, and can also write down their understanding and feelings about surrounding
    things. People convey spoken content to listeners through sound, and transmit
    written content to readers through text. The carriers of listening, speaking,
    reading, and writing all belong to the category of natural language, such as books,
    newspapers, recordings, images, and movies.


    The purpose of Natural Language Processing is to build a computer system capable
    of automatically understanding, recognizing, and generating relevant natural language
    forms. Now, many smartphone voice assistants can convert users'' voice input into
    text output, and vice versa, convert text input into voice output. Many search
    engines provide automatic translation functions that can translate English to
    Chinese, and Chinese to English. Court Optical Character Recognition (`Optical
    Character Recognition`, `OCR`) systems can automatically process paper case files
    into electronic text case files. Enterprise intelligent customer service systems
    convert users'' voice inquiries into text content, recognize the semantic meaning
    therein, retrieve relevant answers to questions from knowledge existing in text
    form, and automatically return voice-form answers. News agency automatic text
    summarization systems can extract the most important sentences from news text
    to summarize key points, automatically creating summaries containing the main
    content of the text.


    Natural Language Processing is an interdisciplinary field of computer science
    and computational linguistics, which can be simply understood as methods for automatic
    processing of human natural language. NLP is a mature branch of AI, involving
    basic mathematics, statistics, linguistics, machine learning, programming skills,
    and some tools. In basic mathematics, knowledge of matrices, algebra, and calculus
    is required. In statistics, knowledge of probability models, regression, and various
    statistical values is required. In linguistics, knowledge of morphology, lexical
    analysis, syntactic analysis, and semantic analysis is required. In machine learning,
    knowledge of supervised learning, semi-supervised learning, and unsupervised learning
    is required. In programming skills, knowledge of data structures, `Linux` operating
    systems, and `Python` is required. In terms of tools, familiarity with standard
    libraries and third-party extension packages for `Python` NLP and machine learning
    is required. Therefore, NLP includes a series of well-known rule-based and machine-learning-based
    techniques and some tools, designed to segment sentences, tag text, recognize
    named entities, and classify text, etc.


    ## 1.3.2 Natural Language Processing Process


    NLP technology enables interaction between humans and computers. The process of
    constructing an NLP system includes problem description and representation, corpus
    and data collection, analysis of corpus or dataset quantity and quality, corpus
    or dataset preprocessing, feature engineering and feature selection, selection
    of machine learning algorithms, evaluation and parameter tuning of machine learning
    models, and model output.


    The primary task in solving an NLP problem is to clarify the problem itself—how
    to state and understand it. For example, using NLP technology to automatically
    generate a summary for legal judgment text to facilitate judges and lawyers quickly
    referencing relevant cases. From the perspective of law and lawyers, what key
    information is matched in relevant case retrieval? The automatic summarization
    technology must extract key points from the text. Search engines can traverse
    entire websites, extract important information as website summaries in search
    results, then match user-input query keywords in the summaries, returning the
    most precise results.


    After determining the problem description, investigate and collect corpora or
    datasets relevant to the problem description. Corpus sources can be business data
    from relevant departments or web crawling, but attention must be paid to ethical
    and legal issues. For example, business data from medical institutions and e-commerce
    platforms belongs to intangible assets and is rarely provided to the public for
    open use; intellectual property issues of corpus data sources are resolved through
    cooperative research or commercial behavior. There are also many open corpora
    provided for users to learn and use. For example, the Reuters Corpus includes
    a large number of news reports published by Reuters since 1986; it is a simple
    and widely used text classification dataset and corpus. The Wikipedia Corpus is
    raw, unannotated encyclopedia text with links and irrelevant content removed.
    The Stanford Natural Language Inference Corpus is a manually annotated dataset
    of English text sentences, each labeled as entailment, contradiction, or neutral,
    usable for natural language inference and classification tasks. The People''s
    Daily Annotated Corpus collects text reports published by People''s Daily since
    1998, with Chinese word segmentation and part-of-speech tagging, usable for Chinese
    NLP learning. There are also websites providing large amounts of corpus text for
    public access, requiring crawler programs to scrape, but data quality issues exist,
    data formats are incomplete, and usage and licensing may be irregular. For example,
    China Judgments Online provides many legal judgment documents; the Federal Court
    of Australia provides years of cases on its website; social media provides reviews
    on food and movies; the Corpus of Contemporary American English (COCA) website
    provides five balanced categories of contemporary American English: fiction, spoken,
    magazines, newspapers, and academic journals.


    Corpus analysis refers to researching and analyzing patterns and regularities
    in the corpus based on real context. From a linguistic perspective, word segmentation
    and part-of-speech tagging can be performed on the corpus, and word frequency
    counted. Typos in the corpus or unclear speech need to be removed as noise. From
    a discourse sociology perspective, the questioner in a Q&A or dialogue system
    generally uses less language, while the answerer uses more. From a pragmatic perspective,
    special vocabulary is used to express implicit indirect meanings; dialogues with
    large status differences contain euphemistic ways to refuse requests. The results
    of corpus analysis need to meet balance requirements. This balance is not measured
    directly by text volume size, but requires comprehensive consideration of the
    influence of discourse sociology and pragmatics. If the corpus or dataset sample
    size is small, more data needs to be supplemented; if sample quality is not high,
    corpus sources may need to be reselected.


    Then, preprocess the corpus or dataset. Raw text is generally presented in paragraphs;
    obtaining a sentence-level structure seems easy, but there are some difficult-to-identify
    situations. For example, in English, the period is a sentence terminator, but
    periods in some abbreviations are not delimiters. Some sentences do not start
    with a capital letter but with a lowercase letter due to spelling errors; these
    issues bring difficulties to sentence segmentation. Preprocessing operations also
    include converting English uppercase to lowercase, extracting word stems with
    similar meanings but different forms, lemmatizing raw words, and removing stop
    words with little significance.


    After corpus preprocessing, the output results are individual lexical items (terms),
    excluding some stop words, different word forms of the same stem, and punctuation
    marks. Only by assigning computer-understandable numerical values to terms can
    further processing be done. Feature engineering is the process of representing
    words in preprocessed corpus text as features or attributes required by machine
    learning; it is a crucial link in NLP. The quality of feature engineering directly
    affects NLP results. With different feature selections, the design and performance
    of machine learning algorithms will differ. Feature engineering can represent
    words as vector representations recognizable by machine learning algorithms through
    the Bag-of-Words model or Word Embedding models. After feature selection or feature
    abstraction via feature engineering, the feature set is divided into a training
    set and a test set.


    Then, select a suitable machine learning algorithm to train features. Input the
    feature values or attribute values of training samples into the machine learning
    model for training. Use the test set corpus to evaluate the application effect
    of the trained machine learning model. Adjust model parameters, retrain the model,
    and evaluate performance until satisfactory results are obtained. If the final
    performance and effect are still unsatisfactory, it may be that corpus selection
    and analysis were not appropriate; then return to the corpus quantity and quality
    analysis step and re-iterate the above process.


    ## 1.3.3 Natural Language Processing Applications


    NLP applications are very extensive, including Optical Character Recognition,
    Speech Recognition Systems, Q&A Systems, Machine Translation, Text Summarization,
    Sentiment Analysis, Text Classification, and Topic Segmentation.


    Optical Character Recognition `OCR` analyzes and recognizes text in images, which
    can be divided into text detection for specific scenarios and text detection for
    general scenarios. License plate recognition belongs to specialized `OCR`, while
    converting photocopied textbook images into electronic book text manuscripts belongs
    to general `OCR`. Text detection in natural scenes is affected by factors such
    as contrast, brightness, and occlusion. Recognizing text from images relies not
    only on text shape features but also on semantic features to recognize incomplete
    text. For example, two characters on a billboard in a scene are missing their
    lower halves; the upper half shapes match both "考虑" (consider) and "老虎" (tiger).
    If followed by a "牌" (brand) character, combining semantic information and context,
    it is easy to judge the detected text as "老虎牌" (Tiger Brand). According to NLP
    technology, multi-modal scene text recognition models can be trained, significantly
    improving `OCR` recognition accuracy.


    Speech recognition systems divide speech into different speech frames, with displacement
    and partial overlap between frames. Each frame corresponds to multiple acoustic
    features. Several frames constitute a sound state, corresponding to a phoneme;
    multiple phonemes form a word. The combination space of sound states is huge,
    but human speech is only a very small subset of this state space. Therefore, commonly
    used speech and sentences are pre-set into a path network. Relying on accumulated
    probability, the framed speech states can be quickly matched to paths in the state
    network. Part of the accumulated probability is derived from the acoustic model
    of signal processing, and the other part comes from the language model of NLP.
    Without the language probability and regularity model of NLP, the accuracy of
    text recognition would be greatly reduced.


    A Q&A system is an information retrieval method that gives accurate and concise
    answers to questions posed by users in natural language. Analyze the question,
    perform feature abstraction on the question, and obtain the question topic words,
    central verbs, and focus. Based on the question analysis results, use Named Entity
    Recognition methods to determine candidate answers and rank them. Then, input
    the vector representation of the question-answer pairs into a machine learning
    classification model for training; question-answer pairs where the question entails
    the answer are labeled as positive class, otherwise negative class.


    Machine translation can realize language conversion functions on parallel corpora
    of two different languages. Statistical and rule-based methods select the most
    appropriate translation words to fill appropriate positions in the sentence according
    to the target language''s grammar rules and sentence structure components, based
    on part-of-speech tagging and syntactic parse trees. Narrowing the translation
    word range to phrases can reduce the complex situations to be considered in long
    sentence translation, showing better performance in disambiguation. Language models
    describe the probability of a sequence of words appearing. Combining neural networks
    with language models enables smooth translation with consistent grammar, context,
    and pragmatics between two different languages.


    Automatic text summarization technology provides effective solutions for capturing
    key information in large amounts of information text, providing automatic headline
    generation for news reports, result previews for web search, etc. A summary consists
    of a few important sentences selected from multiple paragraphs of text. Automatic
    summarization requires the NLP system to understand text content, score each sentence
    in the text, and appropriately select and splice text content based on scores.
    If the summary is generated directly using original sentences from the source
    text, it is called extractive summarization. If the original sentences to be included
    in the summary are rewritten and condensed to a certain extent, it is called abstractive
    summarization. Extractive summarization is more efficient than abstractive summarization,
    but abstractive summarization is more accurate and concise.


    Sentiment analysis is used for sentiment tendency analysis of subjective short
    texts, determining the positive or negative attitude expressed in the text. Consumer
    product reviews, public comments on public opinion events, and student discussions
    on teaching are all application scenarios for sentiment analysis. Relevant decision-making
    departments formulate improvement plans and programs based on sentiment analysis
    results to improve service and application levels. Sentiment analysis systems
    use NLP technology to automatically judge text sentiment, reducing the huge cost
    of manual analysis. One sentiment analysis method relies on a sentiment dictionary
    to score a sentence or paragraph; the cumulative score is comprehensively determined
    by various positive sentiment words, negative sentiment words, and corresponding
    degree adverbs. Another sentiment analysis method relies on machine learning models
    for sentiment classification, using feature engineering methods to extract sentiment
    words as features or attributes, labeling positive sentiment texts as positive
    class and negative sentiment texts as negative class, then inputting samples into
    the machine learning model for training.


    Text classification divides a text into one of two or multiple categories; sentiment
    analysis is also one of the application scenarios of text classification. Spam
    classification systems can judge advertising emails as spam, thereby preventing
    user harassment. News topic classification categorizes articles into one of politics,
    finance, sports, entertainment, and society. In network content recommendation,
    thematic content can be pushed to users with certain preferences. Enterprise compliance
    review uses classification systems to mark contracts consistent with superior
    laws and regulations as positive class, and vice versa as negative class, training
    the classification system to determine whether enterprise operations are within
    compliance. Network public opinion detection systems use classification systems
    to mark websites violating laws and policies as negative class, and normal websites
    as positive class. After feature extraction, they are input into the classification
    system to detect whether certain websites are violating regulations by training
    on a large number of samples.


    Topic segmentation divides a lengthy text into multiple different thematic paragraphs.
    The constituent sentences of each thematic paragraph express content relevant
    to that paragraph''s theme, and the descriptive content of different thematic
    paragraphs is completely different in theme. At large conference venues, some
    participants'' speeches involve multiple topics. If speech materials are organized
    chronologically, non-attendees cannot obtain issues they care about by simply
    browsing meeting records, because these issues may be scattered across various
    paragraphs of the records. Topic segmentation can navigate and browse relevant
    thematic content. In Q&A systems, some questioners spend a lot of time telling
    a story before formally asking a question. Some story content is relevant to the
    question, but much is irrelevant. This question-relevant thematic content exists
    in various parts of the lengthy statement, causing great interference to answering
    the question. Topic segmentation methods can eliminate interference and accurately
    obtain the question itself to be answered. Topic segmentation helps people quickly
    locate content of interest in lengthy texts, playing an important role in information
    retrieval, text summarization, and navigation browsing.


    # 1.4 Using Python Language


    ## 1.4.1 Python Introduction


    `Python` is the most popular programming language in the field of data science.
    As a general-purpose interpreted language, `Python`''s design philosophy places
    great emphasis on code readability and syntax simplicity. Whether small programs
    or large application software, developers strive to express clear program structures
    with less code. `Python` not only fully supports object-oriented design but also
    supports procedural, functional, and imperative programming designs. Like other
    dynamically typed programming languages, `Python` features inheritance, overloading,
    and dynamic memory management. Although initially many people called `Python`
    a scripting language, today people prefer to call it a high-end dynamic programming
    language. The `C` compiler compiles source code into binary target program code
    executable by the computer, also called an executable program, which is related
    to the specific computer hardware architecture. The executable program''s runtime
    environment is the specific hardware system at compile time and cannot run cross-platform.
    The `Python` interpreter interprets the source program code to be run into instructions
    executable by the computer. The `Python` interpreter and computer hardware architecture
    form a virtual runtime environment, while the source program is the runnable program,
    capable of cross-platform operation. `Python` source program files have the extension
    `py`. `CPython`, initiated and driven by the developer community, is the official
    `Python` interpreter written in `C`, currently licensed and managed by the `Python`
    Software Foundation. `CPython` translates `Python` source code into bytecode program
    files with extensions `pyc` or `pyo`.


    As an extensible programming language, `Python` provides a large number of application
    extension `API`s (`Application Programming Interface`), allowing developers to
    flexibly use `C` or `C++` to quickly write extension modules. In many other environments
    requiring script interpretation, the `Python` interpreter can be integrated into
    the new environment for invocation. `Python` itself has a huge and extensive standard
    library. Since its birth in 1991, the huge developer and open-source community
    has provided many useful custom add-on libraries for `Python`. In many software
    development projects internally, `C` or `C++` is used to write functional modules
    with high performance requirements or hardware operations, and then `Python` is
    used to call the corresponding functional modules.


    `Python`''s syntax is very simple, using simple words or symbols as much as possible.
    As a dynamically typed language, `Python` does not require declaration statements
    to be written in advance before variable use. To make code easy to read and query,
    `Python` strongly requires developers to develop habits of valuing program writing.
    If programmers cannot align and indent program blocks well, they will not pass
    `Python` compilation or interpretation. Increasing indentation conveys the meaning
    of the start of a functional statement block, while decreasing indentation conveys
    the meaning of the end of a functional statement block; such program structures
    look very clear. `Python` uses a single underscore `_` or double underscore `__`
    at the beginning or end to indicate non-imported modules, packages, members, or
    private members, avoiding conflicts with important keyword commands. Functional
    statement blocks are represented by statements and control keywords, including
    conditional statement blocks, loop statement blocks, and iteration statement blocks.
    `Python` expressions have arithmetic and logical operators, including arithmetic
    addition, subtraction, multiplication, division, and logical AND, OR, NOT. `Python`
    functions support variable arguments, default arguments, and recursive calls.
    Actual arguments during function calls match formal arguments by position. Default
    argument values are assigned initialization values at definition time. Although
    `Python` supports dynamic typing, it does not allow operations without explicit
    meaning. At compile time, `Python` does not check whether data types possess the
    called attributes or methods. At runtime, if the data type does not have the specified
    method or parameter, the function may throw an exception to the system.


    As an interpreted language, in compute-intensive tasks, `Python`''s performance
    is not as good as other low-level programming languages. However, in the underlying
    implementation of fast vectorized operations on multi-dimensional arrays, extension
    libraries written in `C` are used, including some standard libraries for mathematical
    calculations.


    ## 1.4.2 Python Standard Library


    The core part of the `Python` programming language only contains basic data types,
    statement control flow, expressions, and built-in functions, etc. Basic data types
    include `String`, `Number`, `Dictionary`, `Tuple`, `List`, `Set`, etc. `Python`
    statement control includes branching selection structures and loop structures.
    Branching selection structures have `if` statements and `else` statements. Loop
    structures have `for` statements and `while` statements. Expressions have arithmetic
    operators, comparison operators, and logical operators. Arithmetic operators include
    `+` (addition), `-` (subtraction), `*` (multiplication), `/` (division), `//`
    (floor division), `**` (exponentiation), `~` (bitwise NOT/inversion), `%` (modulo),
    etc. Comparison operators include `==` (equal to), `!=` (not equal to), `>` (greater
    than), `<` (less than), `<=` (less than or equal to), `>=` (greater than or equal
    to), etc. Logical operators include `&` (logical AND), `|` (logical OR), `^` (logical
    XOR/NOT) etc.


    Besides basic arithmetic operations, comparison operations, and logical judgments,
    the programming language development environment writes functionally determined
    statement blocks as functions for developers to call, which not only achieves
    code reuse but also makes program structures clear. Putting some commonly used
    functions into external files is called a standard library. During program development,
    accumulated code becomes increasingly difficult to manage. To maintain code and
    related work, functions are grouped into different files; a `py` file is a module.


