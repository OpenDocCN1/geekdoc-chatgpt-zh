    因此，主成分选择一般采用某种评价函数对`n`维主成分逐一进行评价或者整体进行评价，保留对分类有提升作用的主成分，剔除对分类具有干扰的主成分，得出的结果是`n`维主成分集的一个子集，本质上是对主成分数量进行约简。


    通常情况下，主成分的解释其含义一般多少带有点模糊性，不像原始向量的含义那么清楚和确切。利用效果评估函数求解最优主成分组合，一般来说，求最优解或近似最优解的传统方法主要有枚举法和启发式搜索算法。主成分组合取值是离散值，可以枚举出所有主成分的组合，以求出达到最佳分类性能的主成分组合情形的最优解，最优解不可能落到所有主成分组合情形之外。


