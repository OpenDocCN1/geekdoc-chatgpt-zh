    Gibbs sampling and the pseudo-count method to assign latent topics to the generation
    of each word in the `vsmtf_legalterms_CJO` legal terminology feature vector space.
    On a system with a 2.8 GHz CPU and 8 GB memory, the training time overhead is
    approximately 5 seconds. As shown in Figure 7.32:


    ![](img/txt007_62.jpg "pagenumber_ebook=206,pagenumber_book=197")


