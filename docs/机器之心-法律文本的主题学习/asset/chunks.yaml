    name="Order_State">`中的`name`是属性名，`"Order_State"` 是`name`属性的键值。`BeautifulSoup`对标签树结构进行遍历和解析，可以上行遍历到父标签，也可以下行遍历到孩子标签，还可以平行遍历到兄弟标签。`BeautifulSoup`能够正确关闭标签，并可以解析缺少引号的属性值。对缺少`<html>`和`<body>`的网页，自动添加这两个标签使其成为完整的`HTML`标签树。`bs4`是`BeautifulSoup4`的简写形式，`prettify()`函数方法可以为`HTML`网页文本增加换行符。


    ![](images/txt001_21.jpg "pagenumber_ebook=38,pagenumber_book=29")


    对于格式不完整的`HTML`网页，使用`lxml`解析模块也是先补充缺少的部分，然后再进行遍历解析。同样地，`lxml`可以根据遍历`xml`方法来建立标签树，添加属性键值丢失的引号，补全缺少的标签以便标签闭合，解析成功后输出树结构。


