    欧式距离是将法律文本看作欧式空间中的一个点，两个法律文本的距离就是欧式空间的两点直线距离:


    ![](images/txt006_12.jpg "pagenumber_ebook=159,pagenumber_book=150")


    切比雪夫距离是一种向量空间的距离度量，将两点之间的距离定义为其各个坐标的数值差的绝对值的最大值:


    ![](images/txt006_13.jpg "pagenumber_ebook=159,pagenumber_book=150")


    绝对值距离定义为其各个坐标的数值差的绝对值之和:


    ![](images/txt006_14.jpg "pagenumber_ebook=159,pagenumber_book=150")


    向量空间模型对特征项f\_tik进行赋值wik有着多种方法。在法律文本预处理之后，第i个法律文本的同义词合并到同一个特征词tk。按照布尔模型，不论出现几次，都赋值为1。按照词频方法，统计词项出现次数，赋值给wik。


    词频 (Term Frequency，TF)是一个简单而实用的方法。一般来说，一个给定的词语在某个法律文本出现频率较高，要比一个频率较低的词语更加重要。为了消除法律文本的篇幅大小的影响，词频统计需要在一篇法律文本中出现词语tk的次数的基础上再除以这篇法律文本的总词数:


    ![](images/txt006_15.jpg "pagenumber_ebook=159,pagenumber_book=150")


    此处，Ni为第i篇法律文本的总词数，Nik为第i篇法律文本中出现词语tk的次数。假设某篇法律文本的总词数是100，单词“car”出现2次，单词“law”出现10次。按照公式，TF(car)为0.02，而TF(law)为0.1。


    逆文档频率 (Inverse Document Frequency，IDF)是给每个词在计算词频时的权重，在计算词频TF时，考虑的是当前文本，隐含地给每个词赋予了相等的权重。实际上，在一篇文本中高频出现的词，如果在语料库中也高频出现，则说明这个词其实并不重要。例如，法律文本语料库有10000篇文本，其中包含“car”的文本有100篇，包含“law”的文本有10000篇。很显然，单词“car”携带信息量更多，应该赋予更高的权重。


    ![](images/txt006_16.jpg "pagenumber_ebook=160,pagenumber_book=151")


    此处，N为法律语料库的文本总篇数，Ntk为包含词项tk的法律文本篇数。按照公式，IDF(car)为2，而IDF(law)为0。


    将词频和逆文档词频两者结合就是TF-IDF(Term Frequency-Inverse Document Frequency)，它是词频与逆文档频率的乘积:


    ![](images/txt006_17.jpg "pagenumber_ebook=160,pagenumber_book=151")


    通过计算TF-IDF可以知道，哪些词语对法律文本更为重要，哪些词语可以看作停用词。例如，TFIDF(car)为0.04，而TFIDF(law)为0。与此类似的，很多虚词、助词和连词的TFIDF值趋近于0，可以在特征工程中被视作停用词加以消除。


    6.2.2　one-hot编码


    词袋模型使用一个向量表示一个法律文本，向量中的元素代表一个特征词的出现的频率。如果用一个向量表示一个词，包含多个词语的文本就是一个矩阵。假定字典V的大小为![](images/txt006_18.jpg
    "pagenumber_ebook=160,pagenumber_book=151")采用one-hot对单词进行编码，必须建立一个长度为![](images/txt006_19.jpg
    "pagenumber_ebook=160,pagenumber_book=151")的向量。将词典中的第k个单词映射为|V维one-hot向量，只有第k位为1，其余的位置都为0。表6.1为前述法律文本1和法律文本2构成的词汇表，即［"arrested"，"car"，"likes"，"police"，"robbed"，"suspect"，"the"
    ］，索引位置从0开始。


    表6.1　one-hot编码


    ![](images/txt006_20.jpg "pagenumber_ebook=161,pagenumber_book=152")


    one-hot编码是一种稀疏表达方式，编码维度是整个词汇表的大小，计算开销较大。各个one-hot编码互相正交，余弦相似度为0，无法反映词语的语义。例如“car”和“vehicle”在语义上是相似的，但是one-hot编码无法体现两者的关系远近程度。one-hot编码适用于将输入数据空间映射成高维特征表示，然后解码器将高维特征表示映射回输入数据空间。更为重要的是，神经网络模型的输入端为某个词的one-hot编码格式的信息，输出信息为该词邻近词的one-hot编码格式，这种模型就具有了语义信息。


    6.2.3　词嵌入模型


    自然语言处理的词汇级别的语义包括词汇语义和分布语义，词汇语义是词典中关于该词条定义的含义，分布语义是指与该词条一起出现的上下文词汇具有相似语义。例如，在阅读大量法律语料库文本之后，发现“robbed”经常与“car”“wallet”“suspect”等词共现，即使不知道“robbed”的含义，也可以通过共现词猜测出其部分含义。


    机器学习模型将输入数据映射成输出数据，如果输入数据为一个单词，输出数据是这个单词在语料库中的上下文词语。输入词语和输出词语都是采用onehot编码，用语料库样本不断去训练神经网络模型，训练目标不是为了预测某个词的上下文词，而是获得模型参数，即神经网络连接权重，并将模型参数作为输入层的向量化表示。输入层对应一个词的one-hot编码，输出层对应共现词的one-hot编码，模型参数是输入层到输出层的连接关系，就是这个词在分布语义环境下的词向量
    (word2vec)，称为词嵌入模型 (word embedding)。如图6.3所示:


    ![](images/txt006_21.jpg "pagenumber_ebook=162,pagenumber_book=153")


    图6.3　词嵌入模型


    经过神经网络的大量训练之后，获得权重参数矩阵WV×N。词典中的第一个词的one-hot编码对应到输入层的X1为1，其他输入节点都为0，能够传递到隐藏层的只有W1×N，即权重参数矩阵WV×N的第一行。同理，词典中的第k个词的one-hot编码对应到输入层的Xk为1，其他输入节点都为0，能够传递到隐藏层的只有矩阵WV×N的第k行。因此，词的one-hot表达可以映射为词向量表达，即该词的索引对应输入节点的连接权重。词向量维度是隐含节点数量，从某种意义上说，word2vec是一种降维操作，从词汇表长度V降到隐藏节点数量N。


    word2vec分为skip-gram和CBOW。skip-gram的输入层是一个单词，输出层是这个词的上下文，简单来说就是预测一个词的上下文。CBOW的输入层是上下文词，输出层是一个词，简单来说就是用上下文预测一个词。


    6.2.4　法律文本表示


    法律文本包含法律术语和日常用语，可以对法律术语和日常用语分别进行特征工程。使用法律术语词典构建法律术语特征项，使用普通词语构建日常用语特征项。法律术语的特征项可以提高法律文本的语义表达，日常用语特征项可以充分利用机器学习的统计特性。因此，将法律术语特征项和日常用语特征项两者结合起来，从日常词语词袋生成相应于日常用语的特征项，经过特征选择之后构建日常用语词典。不在日常用语词典和法律术语词典中的词语被视作停用词，直接从法律文本中删除。法律文本表示如图6.4所示:


    ![](images/txt006_22.jpg "pagenumber_ebook=163,pagenumber_book=154")


    图6.4　法律文本表示


    图中的第①阶段是数据准备输出法律文本语料库和相应法律体系下的法律术语词典，语料库有CJO或者FCA数据集。第②阶段是对法律文本语料库中的法律文本进行分词，获得全部的输出词项集合。第③阶段根据法律术语词典，获得去除法律术语之后的常用语词项集合。第④阶段根据统计特征方法，建立不包含法律术语的初始向量空间模型，获得半文本表示的特征向量。第⑤阶段对半文本表示的特征向量进行特征选择，构建日常用语词典。第⑥阶段根据日常用语词典和法律术语词典，在全部词项集合中删除没有在上述两个词典中出现的词语，建立双词典的向量空间模型，输出法律文本的全特征向量。第⑦阶段对法律文本特征表示向量进行分类。


    6.3　过滤器特征选择


    6.3.1　特征选择一般方法


    根据一定方法和准则产生特征子集的过程称为特征选择。在特征子集选取阶段，根据一定的准则从初始特征空间中开始选择，较为简单的方法就是穷举选取或者随机选取，不足的地方就是空间和时间上的开销较大。改进的方法有启发式规则，根据贪心思想从特征空间中进行选取，一直到满足某个条件。


    穷举选取、随机选取和启发式规则等特征选择方法都保留特征原有值，而有些方法转换特征原有值。例如，主成分分析方法和傅里叶变换通过空间变换，将原有的特征值投射新空间上，改变了特征原值。根据特征子集产生过程是否改变特征原值，可以将维度约简分为特征选择和特征抽取，特征选择所产生的特征子集是原有特征空间的一个子集，而特征抽取所产生的子集是原有特征空间的一个映射，这两种方法都是对特征空间进行降维，如图6.5所示:


    ![](images/txt006_23.jpg "pagenumber_ebook=164,pagenumber_book=155")


    图6.5　特征子集搜寻过程分类


    特征子集的选取是否符合要求，这需要对特征子集进行评估，根据不同的需求，评估标准有所不同。例如，特征子集中的特征具有一定的代表性和样本均衡性，或者选取的特征子集使得机器学习模型在测试数据上的性能表现优越。


    6.3.2　过滤器选择方法


    特征选择减少了一些噪音，使得建立在特征子集上的机器学习模型效果更好，增强模型的泛化能力。特征选择的结果是一个相对较优的特征子集，将经过特征选择后的训练数据输入到机器学习模型进行训练，使得模型在测试数据上有较好的性能表现。


    一般来说，进行特征选择需要考虑以下几个问题。其一，从初始特征空间中选取确定数量的特征，能够提高模型准确率;其二，在达成给定的准确率的情况下，选取最小数量的特征子集;其三，在达成模型准确率和减少特征数量之间进行权衡。上述问题都与约束最优化有关，初始特征空间的维度较小时，可以满足计算机时间和空间复杂度要求。但是当维度非常大时，将难以满足时间和空间上的开销，需要寻求一个更加合适的解决方法。


    特征选择过程包含选取、评价、停止和验证。选取是指从初始特征空间中按照某种方法选择一个特征子集;评价就是按照某种评估方法对特征子集进行度量;停止是指根据某个准则，在停止当前的特征子集搜索还是继续选取下一个特征子集两者之间进行判断;验证就是对最后选取出来的特征子集进行有效性验证，使模型泛化能力获得提升。如图6.6所示:


    ![](images/txt006_24.jpg "pagenumber_ebook=165,pagenumber_book=156")


    图6.6　特征选择的过程


    特征子集具有其自身特点，如何选取特征子集需要根据实际应用需求。评价函数用来衡量特征子集选取 (Feature Subset Selection，FSS)的优劣，可以将评价函数分为过滤器模型
    (Filter FSS)、封装器模型 (Wrapper FSS)和混合模型(Mixture FSS)。采用独立性原则的过滤器模型将训练数据的初始特征空间迭代输出为一个最后特征子集，然后将最后特征子集输入到机器学习算法进行训练，如何产生最后特征子集与机器学习算法无关。过滤器模型利用了训练数据分布的内在特点和规律，可以视作某种程度上的数据预处理。


    ![](images/txt006_25.jpg "pagenumber_ebook=165,pagenumber_book=156")


    图6.7　过滤器的原理


    6.3.3　基于随机矩阵的评价函数


    评价函数是用来评价特征子集选取的好坏，可分为关联性准则和独立性准则。在过滤器模型的特征选择算法中，一般应用独立性准则，尝试通过训练数据的内含规律对所选特征子集进行评价，因此可独立于给定的学习算法。独立性准则包括信息度量、距离度量、关联性度量和一致性度量等，在做比较通用的特征选择时，推荐采用这种方法。由于独立于给定的机器学习算法，独立性准则也适用于大多数后续其他机器学习算法。


    矩阵中的元素为随机变量，称为随机矩阵。在引入随机变量后，矩阵元素和特征值都由确定性的值改变为随机变量及其概率分布。根据矩阵形式以及内在特性，随机矩阵用来解决不确定性问题。随机矩阵不是为了取代确定矩阵，而是在结果难以精确计算时，摒弃内在确信机制，从统计特性的角度来描述和处理问题，例如均值和方差。


    Wishart根据一组定义在对称、非负定矩阵的随机矩阵，提出Wishart分布。假设随机变量X1，X2，…，Xn相互独立，服从均值为0，方差为1的正态分布，从一元正态分布中抽取的n个独立的样本，那么这些样本的方差应该是服从一个自由度为n的X2分布:


    ![](images/txt006_26.jpg "pagenumber_ebook=166,pagenumber_book=157")


    Wishart分布是从独立多维正态随机向量中所抽取样本的协方差矩阵的分布，也是X2分布在多元上的扩展，可以用来描述多元正态分布样本的协方差矩阵，在多元正态分布的贝叶斯推导中非常重要。用Wishart分布描述随机矩阵协方差，按照下式建模:


    ![](images/txt006_27.jpg "pagenumber_ebook=166,pagenumber_book=157")


    Wishart分布S的概率密度函数如下:


    ![](images/txt006_28.jpg "pagenumber_ebook=166,pagenumber_book=157")


    这里的![](images/txt006_29.jpg "pagenumber_ebook=166,pagenumber_book=157")是一个多元的Gamma函数，trace(Σ\-1S)是矩阵的迹，也就是矩阵主对角线上元素的和。实际上，这个概率密度的具体形式很少用到。但是它有很大的作用，就是Wishart分布经常作为正态分布的协方差矩阵的逆的共轭先验分布，在很多情况下可以用来描述正态分布样本的协方差矩阵，这点与卡方(chi-square)分布描述一元正态分布样本的方差是一致的。当一个对称的正定矩阵的扩散张量正是随机元素的时候，这个分布也很重要。


    Wishart分布最重要的作用是描述多元正态分布样本的协方差。即假设X1，…，Xn是独立同分布的样本，它们都是来自Np(n，Σ)。那么，样本的均值和方差分别是:


