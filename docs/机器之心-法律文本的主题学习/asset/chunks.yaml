    续表


    ![](images/txt004_2.jpg "pagenumber_ebook=107,pagenumber_book=98")


    根据法律术语所具有的功能不同，可以分为命名类、定性类和处置类。命名类表示法律关系中的人或事物的名称。表法律关系参与主体的名称有原告、证人、被代理人等；表罪名的有妨碍司法罪、侵犯财产罪、渎职罪、贪污受贿罪。表刑名的法律术语有主刑、附加刑、管制、拘役、罚金、有期徒刑、无期徒刑等。定性类是表示法律关系、法律行为和法律事件的性质的法律术语。对法律行为定性的法律术语有自首、立功、犯罪未遂、犯罪既遂、紧急避险、正当防卫；对法律事件定性的法律术语有共同犯罪、单位犯罪、集团犯罪、累犯等。处置类法律术语指的是对某种不法行为所造成的后果所进行的处置，例如，缓刑、减刑、假释、数罪并罚、没收财产等。


    ### 4.2.2 法律文本主题化


    法律术语的主题化最早起源于图书目录系统。主题方法体系的形成和发展开始于1856年英国克雷斯塔多罗（Crestadoro）的《图书馆编制目录技术》，国外最早采用主题法来组织目录索引的是杜威十进分类法的相关主题索引，美国的贝加逊·富兰克林出借图书馆第一个使用了主题法。在法律领域，法律术语或者法律词汇都有其特殊的涵义，不能随便地发挥和解释。有些法律术语是经过立法部门创设的，有些法律术语是采自国外的思想创设的，有些法律术语是沿用古代法律思想而进行重新编撰的。法律术语具有自己独特的内在结构和词素构成方式，从语言学的角度来看，包括复合式和附加式，复合式是指将两个及以上的词素组合起来，例如“民法”，附加式是指由词缀附加在有词汇意义的词素上构成的，例如“委托人”。法律术语在涵义上具有明确的凝合性、法定性、准确性和单义性。


    法律术语的凝合性指的是法律术语是一个不可再分的坚固体，比如“委托人”不可以任意表达为“委托的人”。法律术语的不可再分的特征体现了法律的严肃性和稳定性，用以表达完整的法律意义。法律术语的法定性指的是法律术语的涵义是由法律确切规定的，不能任意解释。例如法律规定的“证据”和一般意义的证据不同，应用在法律领域的特定情形，具有可以证明相关事实的明确对象形式，例如书证、物证、证人证言、当事人陈述等。法律术语的法定性体现了法律的权威性，立法机构必须统一地对法律术语的涵义进行统一阐述。法律术语的准确性指的是精确地描述法律内容以致在立法者、公民和司法者之间达成一致，必须避免在法律概念的理解上产生歧义和模糊，能够非常准确地表达法律行为、法律关系、法律后果和法律概念的内在特征。例如，“轻伤”指造成人体组织和器官一定程度的损害或部分功能障碍，按照一般语言理解，伤势可能不重，但是法律上的“轻伤”可能和日常生活中的感受不一样。为了准确描述“轻伤”法律内涵，在《人体轻伤鉴定标准》中作出明确的规定。法律术语的单义性指的是法律文本中的一个法律术语只能表达单一的法律涵义，不存在多种释义项。例如，“居所”在一般语言中，指的是现在居住的地方，也可能是户籍所在地，但是在法律术语中指的就是户籍所在地。如果法律术语有多种语义，在法律适用和司法过程中，就会出现不一样的理解，影响法律权威性和严肃性。


    在很多法律信息检索系统中，可以按照主题法进行检索。例如，在中国裁判文书网上，可以按照案由、关键词、法院、当事人和律师进行检索，其中，案由就是某种程度上的法律主题或者法律领域。案由按照法律事务主题方面分为刑事、民事、执行、国家赔偿和行政案由。刑事案由包括危害国家安全罪、危害公共安全罪、破坏社会主义市场经济秩序罪、侵犯公民人身权利和民主权利罪、侵犯财产罪、妨害社会管理秩序罪、危害国防利益罪、贪污贿赂罪、渎职罪、军人违反职责罪等。民事案由包括人格纠纷权、婚姻家庭继承纠纷、物权纠纷、合同纠纷、无因管理不当得利纠纷、知识产权与竞争纠纷、劳动人事争议、海事海商纠纷、公司证券保险票据纠纷、侵权责任纠纷等。执行案由包括刑事、民事、行政、行政非诉执行、妨碍诉讼行为制裁决定、民事违法制裁决定、对下级法院执行异议裁定的复议、财产保全、先予执行等。国家赔偿案由包括刑事赔偿、非刑事赔偿等。行政案由包括行政主体、行政行为。在FCA系统中，按照法律主题进行分类检索，包括
    Admiralty＆Manitime、Antitrust、Bankruptcy、Commercial Law、Construction Law、Corporations、Energy＆Environment、Estate
    Planning、Family Law、Finance Banking、Government Contracts、Health Law、Labor＆Enployment、Municipal
    Law、Pension＆Retirement Benefits、Products Liability、Real Property、Securities等。


    案由主题有四级，一级主题有民事、刑事、行政、国家赔偿4类。在民事法律领域下，二级主题有物权纠纷、人格权纠纷、婚姻家庭继承纠纷、合同无因管理不当得利、知识产权与竞争、劳动人事争议、海事商事纠纷、铁路运输纠纷、公司证券保险票据、侵权责任纠纷10类。在物权纠纷二级主题下，三级主题有不动产登记、物权保护、所有权纠纷、用益物权、担保物权等6类。在所有权纠纷三级主题下，四级主题有侵害集体组织权益、建筑物区分所有权、业主撤销权、业主知情权、遗失物返还、漂流物返还、相邻关系、共有纠纷等10类。


    根据上述分析情况，参考国务院学位办的学科目录，对法律领域和主题进行代码编号。一级主题、二级主题、三级主题和四级主题都用两位阿拉伯数字表示，形式如`aabbccdd`，其中`aa`表示一级主题，`bb`表示二级主题，`cc`表示三级主题，`dd`表示四级主题。如果`aa`为`01`，表示民事法律领域；`02`表示刑事法律领域，`03`表示行政法律领域，`04`表示国家赔偿法律领域。民法包括10个二级主题，32个三级主题，416个三级主题。刑法包括10个二级主题，187个三级主题。行政法包括2个二级主题，58个三级主题。国家赔偿包括2个二级主题。由于民法是私法，涵盖范围非常广泛，调整的法律关系复杂，因此，民法具有四级法律主题。刑法体现了罪刑法定原则，具有三级主题，对罪名进行规定。行政法体现政府行政管理职能，具有三级主题。国家赔偿相对案例较少，具有二级主题。由此可以看出，法域具有不平衡性。


    法律主题详细编码见附录B，对法律主题进行编码能够实现方便、快捷、准确地确定法律内容所对应的法律主题层次。例如，给定分别包含“恢复原状”和“消除危险”两个文本，通过查询附录B，恢复原状的代码为`01030206`，消除危险代码为`01030204`。可以知道这两个都是四级法律主题，其共同的法律渊源是`01`民法，`03`物权，`02`物权保护。再给定两个文本，恢复原状和共有纠纷。通过查询附录B，恢复原状的代码为`01030206`，共有纠纷代码为`01030310`。可以知道这两个都是四级法律主题，其法律渊源是`01`民法，`03`物权。因此，从法律渊源上来说，“恢复原状”和“消除危险”在法律意义上的距离要比“共有纠纷”近。


    ## 4.3 法律文本主题模型


    ### 4.3.1 主题语义分析


    《International Private Law》《Deep Learning》《Legal Theory》《Punishment，Compensation
    and Law》《Introduction to Algorithms》《R for Data Science》《Digital Fortress》《Python
    and Digital Forensics Technology》《Computer Ethics》《Network Community》《Computer
    Technology and Society，Law and Ethics》《Network Secuirty》等是某电商平台提供的一些畅销书系列，在图书管理方面，可以将这些出版物归为3类：法律、计算机和计算法律。为了向读者介绍这些图书，我们将这些书的内容简介整理起来。


    从图4.1中可以看出，这段文本的主题包括法律方向的内容、计算机方向的内容以及两者交叉方面的内容。主题1为法律相关概念，涉及的词有“private law、rules、judicial、jurisdiction、legal
    areas”，还包括其他一些词，例如“design”，只是在法律概念中的比例较低。主题2为计算机相关概念，涉及的词有“machine learning、artificial
    intelligence、computers、computing、data、networks”，还包括其他一些词，例如“technology”，在计算机概念中的比例比前者要低，比“use”这类词要高。主题3为计算法律相关概念，涉及的词有“procedures、values
    and practices、govern、computer law、intellectual property”，还包括其他一些词，例如“data security”。


    ![](images/txt004_3.jpg "pagenumber_ebook=110,pagenumber_book=101")

    **图4.1 一段文本包含3个主题**


    主题建模可以简单理解为，将篇章中近似含义的词都归在一个主题下。例如，“machine learning、artificial intelligence、computers、computing、data、networks”这些词都含有计算机之义，在语义上都属于近义词，语义范围可跨越句子、段落和篇章。主题模型通过语义分析技术，将意义关联的词定义为一个主题，主题是对上下文理解之后，词语背后存在或隐含的抽象概念。


    一篇文本有很多主题，每个主题包括多个词，每个词可以属于多个主题。一些主题模型相关的或者相近的词聚成一个簇，称为主题。一篇文本可以理解为将这些不同主题按照不同比例进行混合而成的，如图4.2所示：


    ![](images/txt004_4.jpg "pagenumber_ebook=111,pagenumber_book=102")

    **图4.2 主题建模**


    图中①为文本数据集，包括大量的文本语料，通过阅读这些文本材料，可以从语义上将这些文本语料内容总结为3个主题方面，分别是法律领域、计算机科学、法律计算机交叉领域。图中②是从文本数据集中取出的一篇文本，是由许多词汇组成，既包括属于法律领域的词语，也包括属于计算机科学的词语，还包括属于法律计算机交叉范畴的词语，如图4.3所示：


    ![](images/txt004_5.jpg "pagenumber_ebook=112,pagenumber_book=103")

    **图4.3 一篇文本**


    对于一词多义的词，根据上下文，多个同形不同义的词可以分别属于多个不同主题。例如，词语“set”在主题1中可以理解为“法规配套”之义，也可以出现在主题2的上下文环境中，在语义上理解为“数据集”。给文本中的每个词分配一个所属的主题，然后将划分在同一主题下的词放置在一起，按照这样方式组织起来的一篇文本，从总体结构上来看，就是由不同主题混合而成的。如图4.4所示：


    ![](images/txt004_6.jpg "pagenumber_ebook=112,pagenumber_book=103")

    **图4.4 由不同主题混合的文本**


    每个主题下都统辖了一些词语，在一个主题下，有的词重复出现多次，有的词出现次数较少。以同一主题下的所有词的总词数为分母，以某个词出现的次数为分子，就可以计算该词在这个主题下的所占比例。显然，比重高的词的含义与主题的关联性较强，反之亦然。例如，法律主题下的词“law”出现较频繁，而“hello”很少出现。计算机科学主题下的词“data”出现较多，而“welcome”并不常见。每个主题的词的分布和统计如图4.5、图4.6、图4.7所示：


    ![](images/txt004_7.jpg "pagenumber_ebook=113,pagenumber_book=104")

    **图4.5 主题1的一些词分布**


    ![](images/txt004_8.jpg "pagenumber_ebook=113,pagenumber_book=104")

    **图4.6 主题2的一些词分布**


    ![](images/txt004_9.jpg "pagenumber_ebook=113,pagenumber_book=104")

    **图4.7 主题3的一些词分布**


    ### 4.3.2 主题建模应用


    对于大量的法律文本和其他文本的处理，仅依靠词语比对来确定数据分析任务是远远不够的。挖掘词语背后的抽象主题更加有意义，这将有助于提高文本相似度计算的准确度，发现某一主题下的流行词汇。在搜索引擎的查询字段的匹配程度上，能够按照语义理解自动快速定位到海量文本数据中的词簇。


    在相似文本的比较方面，用相同词的数量或者比例来衡量可能并不准确。例如，前述的英文句子“the head controlled the man with arms”出现在法律主题占比较大的上下文中，含义是指“匪首用枪控制了那个人”。如果这句话出现在计算机科技文献主题占比较大的上下文环境中，含义是指“智能体用胳膊保护了那个人”。对于这两句话相似程度的衡量，如果纯粹用词语进行计算，相似度将为100%，如果用每个词语背后的主题分布情况进行估计，相似度将不到50%。


    语言是人们长期使用而形成的表达，也是传统文化和地域习惯的体现。语言现象是错综复杂的，其中必然包含了很多细微差异，例如一词多义和多词一义。一般的语义分析很难抓住这种细微的差异，而主题模型非常适用这种情形。例如，英文句子“Laws
    set out a set of procedures and rules”属于一词多义的情况，如果将“Laws”替换为另外一个词“Algorithm”，后面的词义就不一样了，前者描述了法律是一套规范的行为和准则，后者则强调算法产生了一些管理程序。如果从词语上来比较两者的差异，几乎没有差异。但是如果为每一个词分配一个主题标签，即使是同一个词也可以分配不同的主题标签，如图4.8所示：


    ![](images/txt004_10.jpg "pagenumber_ebook=114,pagenumber_book=105")

    **图4.8 主题建模支持语义挖掘**


    图中有两篇文本，一篇的主旨内容是法律方面的，另一篇的主旨内容是关于计算机的。文本中的符号`#`表示该位置的词被分配为主题标签`#`，符号`*`表示该位置的词被分配为主题标签`*`，下方的进度条表示该篇文本中的某个主题所占比例。假设这两篇文本的词数为1000，其中有800个词相同，使用词语计算文本相似度，相似结果为80%。如果将800个词中有600个被标记为不同的主题，200个不同词中有100个被标记为不同的主题，按照主题标签数计算文本相似度，相似结果为30%。很显然，30%的相似结果要比80%更加可靠。通过分析词背后的主题分布情况，就可以发现语言的细微差异和上下文环境作用。


    ### 4.3.3 潜在语义分析


    在高速移动互联网和大数据时代，人们的学习、生活和工作都在网络和数据环境中进行，每天通过社交媒体发送大量的内容和文本。人们围绕着某一个话题展开讨论，发现有着共同兴趣的用户。如何存储、组织、管理和分析数据资源将是文本信息处理所面临的重要问题，传统的分析方法以词来代表语义内容，以词来匹配共同的话题。这种浅层的分析方法不能表示和解决深层或潜在的语义关系问题，可以认为，人们在使用社交媒体发表言语时，首先想到一类话题或者主题，然后再想到词语。换言之，在文本和词语之间存在一个中间的抽象连接层，正是这种抽象连接层将不同的用户关联到一个话题上。

