    (a=1;b=1;c=2)代表假设h2:根据转账记录和合同，以借款纠纷进行起诉并要求返还欠款和利息的案件判决结果为胜诉。假设h2与训练集中的案件编号为5的样本吻合或者匹配，但是同样地不能泛化到别的样本上进行预测。如果将这两个叶节点的父节点
