    # 第2章 赋能机器学习


    随着大数据时代的来临，发掘数据意义的机器学习成为计算机学科最为璀璨的新星，通过自我学习的算法可以将数据转变为知识。人类学习知识的过程表明过去的经验对将来依然有效，否则，文明就不会出现。通常人们在挑选水果时，会根据经验作出判断，倾向选择那些外形饱满、色泽鲜艳和声音清脆的产品。起初，人们并不知道好吃的水果与它们的外在的关系，随着经验的增长，逐渐意识到好吃的水果的外表具有一些典型特征，从所有的特征中发现好吃水果具有的特征，可以说从经验中学习了知识或者模型。而模型的建立依靠学习方法和经验，学习方法就是观察水果外形和口感，经验就是获得水果外形和口感的途径，需要人们不断地试吃水果。人类的经验以记忆的形式存储在大脑中，学习过程可以描述为在大脑中搜索记忆的知识，运用逻辑方法对新认知进行推理，从而获得新知识。


    计算机可以模仿人类学习过程，将经验以数据的形式存储在计算机系统中，学习算法将从数据中产生模型，将经验数据提供给模型进行训练，在面对新的情况时，模型就会给出判断和决策。如果说计算机科学在某种意义上是算法的科学，那么机器学习就是关于算法的算法的科学，是研究如何从数据中进行学习。机器学习模型包括线性模型、决策树、神经网络、支持向量机、贝叶斯统计、集成学习、强化学习和主题学习等。经过多年的发展，机器学习算法和模型开发者发布了很多高效的开源库，以便程序员利用强大算法挖掘数据中的模式和知识，对未来作出预测。


    ## 2.1 发展历史


    机器学习是人工智能三大应用领域之一，是人工智能发展水平较高的标志。人工智能早期的研究是关于推理能力，在20世纪中叶，人们认为智能系统应该具有逻辑计算和推理能力。在数学定理证明方面，通用问题求解和逻辑理论家等程序取得非常好的效果，它们的表现甚至比数学家做得要好。随着计算机硬件和软件技术的发展，数学定理证明远远不能满足人们对于人工智能发展的期望，智能系统不仅具有逻辑系统，更应该具备拥有知识的能力。从20世纪70年代开始，代表知识期阶段的人工智能产品的专家系统大量涌现，解决了很多基于规则的实际问题。但是专家系统面临知识工程的局限，专家的精力是有限的，无法将行业内所有知识归纳出来再输入到计算机系统中。这时，计算机系统自主地学习知识成为迫切需要。实际上，早在20世纪中叶的图灵测试中，就已经出现机器学习的初步思想。20世纪60年代～70年代，先后诞生了代表连接主义的感知机、符号主义的结构学习系统、强化学习的学习机器以及统计学习的贝叶斯等理论。这些都为机器学习的诞生奠定了坚实基础。


    20世纪80年代，R.S.Michalski等人出版了第一本机器学习专著《机器学习:一种人工智能途径》，将机器学习定义为从样本中学习，从训练样本中总结学习结果，属于一种归纳方法。决策树以信息熵减少为判断条件，寻找对问题进行求解的树形结构。1986年，神经网络在求解`NP`难题方面取得成果，产生了`BP`算法，学习过程由信号的正向传播与误差的反向传播两个过程组成，对样本的学习蕴含在参数的调节过程中，尤其涉及大量参数，往往依靠手工去调节参数，参数上偏差一点，学习结果差异可能放大到千倍万倍。


    20世纪90年代初，人们认为机器学习是统计学习的华丽转身，由此，统计学习方法中的支持向量机引起了广泛关注。支持向量机 (`Support Vector Machine`，`SVM`)在样本空间中寻求具有最大边距的超平面用以分类或决策，当部分支持向量不在分类边界上，其损失函数可以对分类损失进行量化，复杂的分类器容易产生结构风险，可以通过最小化结构风险和经验风险的线性组合来确定模型参数。在样本空间中，一些线性不可分的问题可能是非线性可分的。核方法
    (`Kernel Method`)可以将低维度线性不可分的问题映射到高维度线性可分问题，映射函数称为核函数，包括多项式核函数、径向基核、高斯核等，构造一个核函数被运用到机器学习的很多方面。事实上，统计学习并非统计模型，统计模型是对数据建立模型，用于推断数据之间的关系，其主要目的并非预测将来。统计学习方法放弃解释性来获得较高的预测性能，其主要目的是较好地预测将来。两者最明显的区别就是在线性回归中的例子，线性回归统计模型寻找一条可以包含更多数据的直线，而线性回归学习模型是通过在一个子集上训练一个线性回归器，从而在另一个子集上测试线性回归器的性能，以期望获得更好的预测效果。


    人们熟知的统计学习方法是将概率模型应用到机器学习领域中，朴素贝叶斯模型根据条件独立假设，计算特征和类别的联合概率分布，损失函数为对数似然函数，通过极大似然估计和极大后验概率估计的迭代方法求解模型参数，属于生成模型。`EM`算法是对含隐变量概率模型求解的方法，似然函数含有对数和的形式，难以直接求解，构造一个近似分布，采用迭代方法，求出含有参数的似然函数下界并最大化，直到最后算法收敛，获得模型参数。主题模型是含有潜在变量的概率模型，由文档产生主题，再由主题产生词语，主题是潜在变量，似然函数的偏导数中有自变量的对数和，无法采用最大似然估计和贝叶斯估计。因此，主题模型需要采用`EM`算法估计参数。


    21世纪初，在计算性能和大数据得到发展之后，深度学习成为机器学习的热点内容，尤其在计算机视觉领域得到广泛的应用。实际上，深度学习是一个多层的神经网络，从输入层到隐藏层，从隐藏层到输出层，隐藏层的层数越多，代表两层之间连接的权重的参数就越多。因此，深度学习模型的参数达到成千上万以上，复杂的模型使得参数调优变得非常重要。虽然深度学习缺乏理论上的可解释性，但是却在工程应用上大放异彩，这主要得益于大数据和强算力。互联网应用的普及产生了前所未有的大数据样本，如果参数数量巨大，样本较少，容易产生过拟合，模型在训练样本上损失为零，但是在测试样本上产生较大的偏差。对于具有大量参数的复杂模型，需要大数据进行训练，同时反复迭代的训练消耗大量的计算资源。没有强大的计算能力，时间代价将会比较大。


    ## 2.2 基本概念和术语


    数据是机器学习的前提，存在这样的一些数据 (`原告=张三，被告=李四，法院=北京市朝阳区人民法院，案由=借款纠纷，时间=2020年1月8日`) (`原告=赵某甲，被告=钱某乙，法院=上海市松江区人民法院，案由=隐私权纠纷，时间=2019年3月5日`)
    (`原告=张某丙，被告=王某丁，法院=天津市南开区人民法院，案由=土地承包经营权纠纷，时间=2018年8月5日`) (`原告=刘某戊，被告=孙某己，法院=重庆市渝中区人民法院，案由=知识产权纠纷，时间=2016年8月25日`)
    (`原告=黄某某，被告=杨某某，法院=广州市天河区人民法院，案由=房屋买卖合同纠纷，时间=2015年11月20日`) (`原告=陈某五，被告=林某六，法院=杭州市西湖区人民法院，案由=定金合同纠纷，时间=2020年1月8日`)。


    上述的一对括号中的数据是对一个案件进行描述的一条记录。多条记录组成一个集合，称之为数据集 (`Dataset`)，文本数据集也称语料库。一般情况下，数据集中的一条记录描述一个样本
    (`Sample`)或者实例 (`Instance`)。样本由几个事项来描述，例如，原告、被告、法院、案由和时间，这些称为特征或属性，一个具体样本是特征 (`Feature`)或属性
    (`Attribute`)在当前情况下的取值，称为特征值 (`Feature Value`)或属性值 (`Attribute Value`)。将特征对应到空间坐标，一个特征映射为一个维度的坐标，全部特征
    (原告、被告、法院、案由、时间)就是五维空间。一个案例就是五维空间中的一个点，空间中的一个点可以用坐标向量 (`Vector`)来描述。因此，有时称一个样本为特征向量。


    数据集用大括号表示：`D={d1，d2，…，dm，…，dM}`，大写`M`表示样本总数，下标为小写的`dm`表示第`m`个样本。每个样本包含`N`个属性或特征，用`dm={dm1，dm2，…，dmn，…，dMN}`来表示，`dm`是`N`维样本空间中的一个向量，`dmn`表示第`m`个样本的第`n`个属性或特征的取值。例如，`d32`表示第3个案件的被告为王某丁，`d24`表示第2个案件的案由为隐私权纠纷，`d13`表示第1个案件的受理法院为北京市朝阳区人民法院，`d41`表示第4个案件的原告为刘某戊，`d55`表示第5个案件的判决日期为2015年11月20日。


    学习算法通过在数据中学习获得模型，在训练或学习过程中需要使用一些数据，每一条记录称之为训练样本，所有的训练样本 (`Training Sample`)构成训练集，将数据集的一部分划分为训练集
    (`Training Set`)，剩余部分的数据称为测试集 (`Testing Set`)。学习算法需要做一个关于数据符合某种规律的假设，例如，可以假设所有判决日期符合高斯正态分布，高斯正态分布模型有两个参数：均值和方差，学习算法通过在训练数据中学习模型，获得模型参数。在不同的训练集上学习模型，将会获得不同的模型参数。学习过程期望所获得参数的模型能够解释数据产生的现象，不仅在训练集上能够很好地符合数据产生规律，也要在测试集上符合数据分布。因此，模型可以视作为学习算法在具体数据上的参数和假设理论的实例化。因此，机器学习算法的优劣是与数据类型密切相关的，例如，深度学习适用于图像处理，主题模型适用于文本处理。


    前述的案件数据中的样本包含原告、被告、法院、案由和时间5个属性或特征的取值，如果需要对案件进行预测，用户可能更加关心的是判决结果。例如((`原告=张三，被告=李四，法院=北京市朝阳区人民法院，案由=借款纠纷，时间=2020年1月8日`)，胜诉)((`原告=赵某甲，被告=钱某乙，法院=上海市松江区人民法院，案由=隐私权纠纷，时间=2019年3月5日`)，败诉)，这样的记录包含了判决结果。胜诉或者败诉称之为标签
    (`Label`)，通常用 (`dm`，`ym`)表示打上标签的样本，`ym`是样本`dm`的标记，所有标签的可能取值构成集合`Y`，称之为输出空间。模型的输入是未标记的`dm`，输出的结果是`f(dm)`，这里`f`指函数或者映射，可以将学习模型理解为广义的函数，学习算法的目的是使`f(dm)`逼近`ym`。如果预测结果`f(dm)`或者标签`ym`取值只能为胜诉或败诉其中之一，输出结果为离散值的学习模型称为分类任务
    (`Classification`)。如果预测结果是赔偿金额，可以从一个范围连续取值，输出结果为连续值的学习模型称为回归任务 (`Regression`)。如果分类任务只包含胜诉或败诉两个类别，称之为二分分类任务
    (`Binary Classification`)，其中一个称为正类 (`Positive Class`)，另外一个称为负类 (`Negative Class`)。如果分类任务包含两个以上类别，称之为多分类任务(`Multi-class
    Classification`)。


    打上标签的样本空间被划分为训练集和测试集，训练集表示为 {(`d1`，`y1`)，(`d2`，`y2`)，…， (`dtr`，`ytr`)，…，(`dTR`，`yTR`)}，大写`TR`表示训练集样本数量，小写`tr`表示训练集任意一个样本。测试集表示为
    {(`d1`，`y1`)，(`d2`，`y2`)，…，(`dte`，`yte`)，…，(`dTE`，`yTE`)}，大写`TE`表示测试集样本数量，小写`te`表示测试集任意一个样本。`TR+TE`等于样本空间总数`M`。学习模型期望通过对训练集{(`d1`，`y1`)，(`d2`，`y2`)，…，(`dtr`，`ytr`)，…，(`dTR`，`yTR`)}的学习，建立一个输入空间
    {`d1`，`d2`，…，`dtr`，…，`dTR`} 到输出空间 {`y1`，`y2`，…，`ytr`，…，`yTR`} 的映射`f:D→Y`，对于二分类任务，`Y={1，0}`或者
    `{+1，-1}`，对于回归任务，`Y`一般为实数。经过模型学习后，获得模型参数，建立输入到输出的映射`f`，对测试集中的测试样本 (`Testing Sample`)进行预测
    (`Predict As`)，预测结果为`yte=f(dte)`，使用真实值`yte`与预测值`ˉyte`进行比较来评估模型性能。


    没有标签的样本空间可以做聚类任务 (`Clustering`)，将数据集中的案件分成若干组，每个组称为一个簇，这些聚类的簇有可能对应一些潜在主题或者概念。例如，按照管辖地区，可以将前述数据集聚类为华北地区案件、华东地区案件、华南地区案件、西南地区案件、东南地区案件、东北地区案件和西北地区案件等。按照日期聚类，可以划分为近1年案件、近3年案件和近5年案件等。按照案由聚类，可以形成人格权纠纷、物权纠纷、合同纠纷和知识产权纠纷等聚类结果。聚类学习任务中，华东地区案件等这样聚类在开始时是不知道的，通过学习发现这些样本中的法院的地理位置离上海较近，彼此之间也不远，但是离北京、广州、重庆等都较远。人格权纠纷案件等这样聚类在开始时也是不知道的，通过学习发现这些案件样本中出现人格、人身、名誉、姓名和肖像等词语频率较高，彼此之间词语共现较多，但是与物权纠纷、合同纠纷、知识产权纠纷等案件中词语共现现象较少。聚类学习能够发现数据的内在规律，有助于用户分析数据，而且通常也不需要标签信息。

