    )\n\n\uFEFF\n\n本书系中国政法大学科研创新项目资助 (19ZFQ52001)研究成果中央高校基本科研业务费专项资金资助\n\n(supported\
    \ by“the Fundamental Research Funds for the Central Universities”)\n\n\uFEFF\n\
    \n前　言\n\n本书的书名给读者带来无限的遐想，作为知名美剧，机器之心为人类未来描绘出人与机器和谐发展的蓝图，同时也引发了对于人与机器关系纠葛的深入思考和普遍讨论。借喻机器之心，表达机器学习和人类之间的关系。作为未来人工智能炙手可热的研究领域之一，法律人工智能研究将发挥重要作用。将机器学习方法和主题模型应用到法律文本自然语言处理中，这是未来法学与人工智能学科交叉研究领域中值得深耕的方向。\n\
    \n机器学习能够像人类一样去思考问题，从大数据中训练程序，其目的是让程序能够对数据中隐含的模式进行解释，从而实现自主学习。而主题学习是将机器学习技术和统计方法应用到自然语言当中，尤其是文本数据。主题模型通过语义分析技术，将意义关联的词定义为一个主题。主题也是对上下文理解之后，词语背后存在或隐含的抽象概念。法律文本又不同于一般文本数据，具有专业性和权威性。因此，基于法律术语的主题建模就具有了一定的适应性和必要性。\n\
    \n全书共8章。第1章绪论综述了法律人工智能研究方法论。第2章赋能机器学习阐述了机器学习各阶段路线图。第3章理解法律文本分析了法律文本语法和句法。第4章法律文本的主题建模研究了法律文本语义上的主题建模。第5章法律文本预处理讨论了法律文本的特征工程方法。第6章特征选择和维度约简探索了基于法律术语的混合特征选择方法。第7章法律文本无监督主题学习研究了基于法律术语的LDA无监督主题学习模型。第8章法律文本监督主题学习研究了基于法律术语的SLDA监督主题学习模型。\n\
    \n机器学习在法律人工智能应用领域的发展非常令人期待，已经成为一个自然语言处理的分支领域。随着新模型新方法不断涌现，技术迭代将成为一种常态。作者才疏学浅，难以做到对机器学习和法律文本自然语言处理的各个方面的深入精髓理解，书中错漏和不当之处在所难免，还望读者批评指正，将不胜感激。\n\
    \n本书系中国政法大学科研创新项目资助 (19ZFQ52001)研究成果，同时受到中央高校基本科研业务费专项资金资助 (supported by“the Fundamental\
    \ Research Funds for the Central Universities”)。\n\n张扬武\n\n2021年1月\n\n\uFEFF\n\
