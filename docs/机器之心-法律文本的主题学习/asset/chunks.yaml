    图4.1　一段文本包含3个主题


    主题建模可以简单理解为，将篇章中近似含义的词都归在一个主题下。例如， “machine　learning、 artificial　intelligence、
    computers、 computing、 data、networks”这些词都含有计算机之义，在语义上都属于近义词，语义范围可跨越句子、段落和篇章。主题模型通过语义分析技术，将意义关联的词定义为一个主题，主题是对上下文理解之后，词语背后存在或隐含的抽象概念。


    一篇文本有很多主题，每个主题包括多个词，每个词可以属于多个主题。一些主题模型相关的或者相近的词聚成一个簇，称为主题。一篇文本可以理解为将这些不同主题按照不同比例进行混合而成的，如图4.2所示:


