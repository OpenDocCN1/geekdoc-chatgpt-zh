    ## 8.4.1 Chinese Legal Terminology SLDA Model


    ![](img/txt008_21.jpg "pagenumber_ebook=229,pagenumber_book=220")


    Figure 8.7　Training and test set labels for Chinese CJO legal terminology feature
    space


    The function `astype()` converts values to float type, `SVC(kernel=''linear'')`
    initializes the support vector machine classifier and sets the kernel function
    to linear kernel, `linear_svc.fit()` trains the classifier using training samples,
    and `linear_svc.predict()` predicts on test samples. The classification performance
    metrics obtained using the `SVC` support vector machine are shown in Figure 8.8,
    with an accuracy of approximately 0.78.


    ![](img/txt008_22.jpg "pagenumber_ebook=229,pagenumber_book=220")


    Figure 8.8　Classification performance of SVC support vector machine on Chinese
    CJO legal terminology feature space


    The function `SVC(kernel=''linear'', probability=True)` initializes a support
    vector machine that supports probability output for prediction results. For binary
    classification tasks, the prediction result has two columns: the first column
    is the probability of predicting the negative class, and the second column is
    the probability of predicting the positive class. The second column is taken as
    the output result, as shown in Figure 8.9. `fpr_svc_legalterms_CJO` and `tpr_svc_legalterms_CJO`
    returned by `roc_curve` are the `fpr` and `tpr` obtained using the `svc` classifier
    on the CJO corpus legal terminology feature space, respectively. The `plt.plot`
    function plots the ROC curve and calculates the AUC value for display in the legend.
    As shown in Figure 8.10, the AUC value is approximately 0.818.


    ![](img/txt008_23.jpg "pagenumber_ebook=230,pagenumber_book=221")


    Figure 8.9　Prediction probability output of SVC support vector machine on Chinese
    CJO legal terminology feature space


    ![](img/txt008_24.jpg "pagenumber_ebook=230,pagenumber_book=221")


    Figure 8.10　AUC of SVC support vector machine on Chinese CJO legal terminology
    feature space


    After importing the logistic linear regression supervised topic model `BLSLDA`,
    model parameters are initialized. The number of topics `_K` is set to 15, `_alpha`
    is the hyperparameter of the multinomial distribution from document to topic,
    `_beta` is the hyperparameter of the multinomial distribution from topic to word,
    `_mu` is the mean of the logistic linear regression, `_nu2` is the variance of
    the logistic linear regression, `_b` is the intercept, `V` is the vocabulary size,
    and `n_iter` is the number of iterations, as shown in Figure 8.11. `blslda_legalterms_CJO`
    is the initialized model of the logistic linear regression supervised topic for
    the Chinese CJO legal terminology feature space, `blslda_legalterms_CJO.fit()`
    is the model training function, the training process is shown in Figure 8.12,
    and the training time consumed is 15 seconds.


    ![](img/txt008_25.jpg "pagenumber_ebook=231,pagenumber_book=222")


    Figure 8.11　Parameters of the logistic linear regression supervised topic model
    for Chinese CJO legal terminology feature space


    ![](img/txt008_26.jpg "pagenumber_ebook=231,pagenumber_book=222")


    Figure 8.12　Training of logistic linear regression supervised topic model on Chinese
    CJO legal terminology feature space


    The output `eta` of model `blslda_legalterms_CJO` is the logistic regression coefficient
    after each iteration; the mean of the latter half of the iterations is taken as
    the parameter for prediction. `thetas_test_blslda_legalterms_CJO` is the topic
    distribution on the test set for the Chinese CJO legal terminology feature space
    after model training. `bern_param` is the logistic linear regression result, with
    parameter `eta` as the regression coefficient and parameter `theta` as the topic
    distribution. The response variable `y_blslda_legalterms_CJO` is the logistic
    linear regression result calculated by the `bern_param` function, as shown in
    Figure 8.13:


    ![](img/txt008_27.jpg "pagenumber_ebook=231,pagenumber_book=222")


    Figure 8.13　Calculation of prediction result `y_blslda_legalterms_CJO`


    `y_noproba_blslda_legalterms_CJO` converts probability input into definite 1 or
    0 for calculating accuracy, recall, and F1 measure, as shown in Figure 8.14. Then
    the `roc_curve` function is used to obtain a series of `fpr` and `tpr`, the `roc_auc_score`
    calculates the AUC value, and finally `plt.plot` plots the coordinates and AUC
    value. As shown in Figures 8.15 and 8.16, the accuracy is approximately 0.74,
    and the AUC value is approximately 0.799.


    ![](img/txt008_28.jpg "pagenumber_ebook=232,pagenumber_book=223")


    Figure 8.14　Classification performance of BLSLDA on Chinese CJO legal terminology
    feature space


    ![](img/txt008_29.jpg "pagenumber_ebook=232,pagenumber_book=223")


    Figure 8.15　FPR and TPR of BLSLDA on Chinese CJO legal terminology feature space


    ![](img/txt008_30.jpg "pagenumber_ebook=232,pagenumber_book=223")


    Figure 8.16　AUC of BLSLDA on Chinese CJO legal terminology feature space


