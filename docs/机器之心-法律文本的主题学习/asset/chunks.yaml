    ## 4.5 Dirichlet Distribution


    ### 4.5.1 Multinomial Distribution


    For a random event `X`, occurrence is denoted by `1`, and non-occurrence by `0`.
    The probability of `X` occurring is `θ`, and the probability of not occurring
    is `1-θ`. This distribution is called the Bernoulli distribution. A Bernoulli
    trial is a single trial with only two simple outcomes: occurrence or non-occurrence,
    heads or tails, etc. For example, tossing a coin once, the probability of heads
    facing up is:


    ![](img/txt004_27.jpg "pagenumber_ebook=120,pagenumber_book=111")


    Independently repeating the Bernoulli trial `n` times, the number of occurrences
    of random event `X` is `k`, meaning the event occurs `k` times in `n` trials.
    The random variable probability distribution is the binomial distribution. For
    example, tossing a coin `n` times, the probability of heads appearing `k` times
    is:


    ![](img/txt004_28.jpg "pagenumber_ebook=120,pagenumber_book=111")


    The first `k` trials are heads, the remaining `n-k` trials are tails. According
    to the multiplication rule of probability, the probability of this event is `θ^k(1-θ)^(n-k)`.
    There are `![](img/txt004_29.jpg "pagenumber_ebook=121,pagenumber_book=112")`
    combinations of events where heads appear `k` times in `n` trials. The multinomial
    distribution (categorical distribution) changes the Bernoulli distribution''s
    trial outcomes from two to multiple, i.e., `K` outcomes. For example, rolling
    a die once, the probability of the `k`-th face facing up is:


    ![](img/txt004_30.jpg "pagenumber_ebook=121,pagenumber_book=112")


    Generalizing the binomial distribution''s two trial outcomes per trial to multiple
    outcomes per trial, and repeating multiple independent trials, yields the multinomial
    distribution. For example, rolling a die `n` times, the number of times the first
    face appears is `m1`, the second face `m2`, and the `K`-th face `mK`. Its probability
    density is:


    ![](img/txt004_31.jpg "pagenumber_ebook=121,pagenumber_book=112")


    The multinomial probability formula is the general term of a multinomial expansion.
    According to the multiplication formula, the probability of randomly conducting
    `n` trials on `(X1+X2+...+XK)` is `(θ1+θ2+...+θK)^n`. The event `(X1+X2+...+XK)`
    is a certain event, and the sum of probabilities of sampling a certain event `n`
    times is `1`. When the polynomial is expanded into many terms, according to the
    addition rule of probability, the expanded terms are probabilities corresponding
    to mutually exclusive events. That is, the multinomial distribution is the general
    term of an expanded polynomial term, or the probability of a special event occurring,
    e.g., `X1` appears `m1` times, `X2` appears `m2` times, `Xk` appears `mk` times.
    In topic models, `X1` is the first topic index, `m1` is the number of words assigned
    to the first topic. `Xk` is the `k`-th topic index, `mk` is the number of words
    assigned to the `k`-th topic.


    ### 4.5.2 From Beta Distribution to Dirichlet Distribution


    In the binomial distribution, what is the appropriate probability `θ` of heads
    facing up? Intuitive guess might be `0.5`. If the heads and tails sides do not
    have uniform mass, as a prior probability, `θ` taking any value in `[0, 1]` is
    possible. With a sufficient number of trials, the frequency of heads can be used
    as the `θ` value. If only tossed once and heads occurs, estimating the probability
    as `100%` is obviously unreasonable. Normally, the prior probability `θ` can be
    `0.5`. In `100` trials, the probability density of `X` heads occurring should
    be larger in the middle and smaller at both ends, with `X` ranging from `0` to
    `100`, as shown in Figure 4.9.


    ![](img/txt004_32.jpg "pagenumber_ebook=122,pagenumber_book=113")


    Figure 4.9 Binomial Distribution Probability Density


    Regardless of how many times heads appears in the coin toss trials, the initial
    understanding of the prior probability `θ` is roughly that the probability of
    `θ` taking a middle value is significantly greater than taking extreme values.
    As trial evidence `X` increases, the distribution of prior probability `θ` gradually
    adjusts to the posterior probability, meaning `θ` may no longer be uniformly distributed;
    the balance tilts towards evidence `X`. According to Bayes'' formula:


    ![](img/txt004_33.jpg "pagenumber_ebook=122,pagenumber_book=113")


    Where `p(X)` is a fixed value, `p(θ)` is a value in `[0, 1]`, and `![](img/txt004_34.jpg
    "pagenumber_ebook=122,pagenumber_book=113")` formally follows a `beta` distribution:


    ![](img/txt004_35.jpg "pagenumber_ebook=122,pagenumber_book=113")


    The `beta` distribution can be understood as the probability of a probability.
    `B(α, β)` is a coefficient. `α` is approximately the number of heads in occurred
    events, `β` is approximately the number of tails in occurred events. The expectation
    of the `beta` distribution is `α/(α+β)`. If `100` tosses have been made, with
    `50` heads and `50` tails. The `beta` distribution probability is as shown in
    Figure 4.10:


    ![](img/txt004_36.jpg "pagenumber_ebook=123,pagenumber_book=114")


    Figure 4.10 `beta` Distribution Probability Density (`α=50`, `β=50`)


    It can be seen that the possibility of prior probability `θ` taking `0.5` is the
    greatest, with a reasonable value range of `0.35~0.65`. Continuing to repeat the
    aforementioned trial `200` times, with `31` heads and `169` tails. The updated
    hyperparameters are `α=81`, `β=219`. The probability distribution is as shown
    in Figure 4.11:


    ![](img/txt004_37.jpg "pagenumber_ebook=124,pagenumber_book=115")


    Figure 4.11 `beta` Distribution Probability Density (`α=81`, `β=219`)


    It can be seen that the possibility of prior probability `θ` taking `0.27` is
    the greatest, because the expectation is `81/(81+219)`, with a reasonable value
    range of `0.2~0.35`. If `p(θ|X, α=50, β=50)` is used as the prior probability
