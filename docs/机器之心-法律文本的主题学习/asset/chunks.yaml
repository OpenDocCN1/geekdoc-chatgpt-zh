    ## 5.2 获取原始法律文本


    ### 5.2.1 常用方法


    对原始法律文本的获取可以有三种方法，包括读取原始文本文件、运行变量定义和网页抓取。文件读取是指在本地计算机或者存储设备上打开以 `txt`、`xml` 或者其他格式存储的文本数据文件，运行变量是指在运行环境中定义或访问以字符串形式存在的变量，网页抓取是指通过爬虫程序代码抓取网络远程主机上的网页。


    Python 的模块 `os` 提供了较多的目录和文件操作功能函数，导入的模块 `os` 根据不同的操作系统，自动调整能够适应系统平台的文件和目录操作。函数
    `chdir()` 的作用是改变当前路径到参数所指定的位置。函数 `open()` 既可以打开一般的磁盘文件，还可以访问抽象意义上的数据文件，其 `read()`
    方法按照字节顺序读取数据到字符串中。如图 5.8 所示：


    ![](images/txt005_8.jpg "pagenumber_ebook=132,pagenumber_book=123")


    **图 5.8 读取数据文件的语料**


    可以从 `nltk` 自然语言处理工具包中加载语料库，例如，`nltk.download()` 管理和下载一些公开语料库，包括 `reuters` 新闻报道语料库、`gutenberg`
    文学典籍语料库、`brown` 百万电子文本语料库、`webtext` 网络文本语料库、`nps_chat` 即时消息语料库、`inaugural` 演说语料库等。如果文本数据内容不多，可以定义一个字符串变量，通过赋值获取一些少量文本数据。如图
    5.9 所示：


