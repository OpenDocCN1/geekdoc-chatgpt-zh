    ## 1.1 Legal AI


    ### 1.1.1 Introduction to Legal AI


    To understand, generate, and process legal texts, Legal AI technology researches
    and develops various applications and tools for legal texts through Natural Language
    Processing (NLP) and Machine Learning methods. These include sentence and paragraph
    segmentation, part-of-speech tagging and text annotation, Named Entity Recognition
    (NER), and legal domain classification. Research into the details of legal texts
    is the most basic requirement for Legal AI software. For example, in legal texts,
    figures involving amounts are usually written in uppercase Chinese characters;
    through machine learning methods and rules, Legal AI software can display "壹亿贰仟叁佰肆拾伍万陆仟柒佰捌拾玖"
    (one hundred twenty-three million four hundred fifty-six thousand seven hundred
    eighty-nine) as "123456789". The application of NLP technology and machine learning
    methods on general texts can be said to be very successful; however, the successful
    patterns on general texts cannot necessarily be directly applied to legal texts,
    because legal texts differ from general texts such as newspapers and news reports
    in many aspects.


    Today, the daily activities of legal practice departments and lawyers are all
    related to Legal AI. For example, except for juvenile delinquency cases and cases
    involving personal privacy, all other judgments are published online for user
    queries; this query technology may involve Legal AI technologies. Third-party
    deposited electronic contracts and communication records may involve relevant
    machine learning technologies when assisting judicial organs in advancing judicial
    procedures. During industry investigations and decision-making research, the solicitation
    of opinions on the promulgation of laws and regulations may use machine statistical
    analysis technologies. In the allocation of government public utility resources,
    Big Data technology can be used to analyze regional resource provision and distribution.
    For example, in vaccine distribution in public healthcare, based on regional epidemiological
    investigations, higher allocations of specific vaccines can be made to high-incidence
    areas to save medical resources. Therefore, Legal AI can also utilize computer-related
    technologies to solve all problems in the legal practice field, help legal professionals
    improve work efficiency, optimize all aspects of legal services, and provide services
    for rapid storage, retrieval, and recommendation of legal data.


    ### 1.1.2 Applications of Legal AI


    After decades of development, AI technology—encompassing interdisciplinary research
    in mathematics, biology, and computer science—has become one of the current driving
    forces of innovation, supported by Big Data and supercomputing power. Law requires
    not only substantive justice but also procedural justice; sometimes efficiency
    is an inevitable requirement of procedural justice. If the adjudication of a case
    is long delayed, the interests of the parties will be greatly damaged, especially
    in intellectual property disputes. The objects and content of daily work for judicial
    organs, law firms, and legal staff are more complex than those of practitioners
    in other industries, containing many repetitive and administrative tasks. These
    include studying laws and regulations, retrieving vast amounts of historical judgments,
    and analyzing relevant cases to find grounds supporting the current adjudication
    from massive data, and making judgments through logical reasoning and rigorous
    argumentation. The workload is undoubtedly huge; in an era where human resources
    are extremely precious, relying on manpower to complete all judicial work is unrealistic.
    Criminal trial work, from evidence collection to writing judgment documents, consumes
    a great deal of judges'' energy, which to some extent also affects the fairness
    of case judgments. Therefore, Legal AI can not only improve judicial work efficiency
    but also safeguard legal justice. Differences in culture, education, economy,
    and traditional customs exist across regions; these factors may have a certain
    impact on the judiciary. Some judges may abuse power and apply the law in ways
    that violate fairness. Therefore, for similar case facts and causes of action,
    judges in regions with different development levels may render completely different
    judgments; for different parties in previous and subsequent cases with similar
    facts and causes, the same judge''s discretionary space may also show large fluctuations.
    The healthy operation of the legal system requires people to maintain trust in
    the law at all times and to avoid all unfair phenomena as much as possible. Legal
    AI can view cases more objectively, reduce subjective human interference in cases,
    correct deviations appearing in the legal system, supervise judicial workers''
    perversion of the law, and audit the internal logical consistency of historical
    judgment data, keeping judges highly cautious and reverent, thereby striving to
    achieve "similar cases, similar judgments" and promoting the fairness and objectivity
    of the legal system.


    Legal AI needs to think, understand, and solve problems with legal thinking like
    a human, becoming software and methods in legal practice. Traditional methods
    understand the structure and elements of legal texts based on legal norms. For
    example, a civil loan contract needs to include elements such as the borrower,
    lender, loan date, interest, repayment date, and loan reason; by analyzing the
    loan text, corresponding legal acts, legal facts, and legal consequences are established.
    Legal AI understands legal texts through Named Entity Recognition methods, thereby
    establishing legal reasoning methods; if different legal sources exist, it seeks
    clear legal grounds on the basis of disambiguation. In terms of problem-solving,
    by imitating human thought processes and reverse thinking engineering, Legal AI
    possesses internal logic and methods consistent with humans. Legal AI utilizes
    the large-capacity storage and high-speed computing capabilities of computers,
    possessing greater advantages in processing speed and memory capacity. China Judgments
    Online has put over a million cases online; retrieving cases with similar elements
    from massive historical precedents might take half a year with traditional manual
    methods, while Legal AI only needs a few seconds. Not only that, based on the
    cause of action and facts, Legal AI can more accurately query applicable laws,
    exclude the mental stereotypes and subjective emotions of experienced judges,
    prevent interference from social public opinion spread online, reduce misjudgments
    and biases, enable the judicial system to play an independent role, and make the
    law fairer and more just than sunlight.


    Legal AI must ensure that computer technology operates and is used within the
    legal framework; the law must escort computer technology innovation, and computer
    technology must provide efficient social governance for the law. A few years ago,
    the US-developed Legal AI software COMPAS assessed the probability of recidivism
    by parole applicants based on machine learning model algorithms; this risk assessment
    can assist judges in decision-making. For example, when the assessed probability
    of recidivism reaches a certain set value, the judge can decide to deny parole.
    Bank credit departments can analyze the credit of credit card applicants based
    on risk assessment models; when it falls below a set value, the bank can decide
    to refuse the credit card. Although both are assessments predicting future behavior,
    the application of the results is 截然不同 (starkly different). Bank risk control
    is a commercial act; whether to approve a credit card is purely a commercial act
    between civil subjects, not involving the judiciary or public power. Court sentencing
    risk assessments affect the openness and transparency of the law; if the decision-making
    process remains a "black box" and cannot be reasonably explained to the public,
    it will lead to doubts about the legitimacy and necessity of Legal AI in judicial
    practice, thereby hindering the future development of Legal AI. Big Data continuously
    optimizes Legal AI, and Machine Learning brings new brilliance to Legal AI. However,
    under the requirements of legal principles and legitimacy, the perfect assumptions
    of machine learning models lack scientific explanation, making it difficult to
    achieve 100% satisfaction. You cannot guarantee that a person who has lied a hundred
    times will definitely lie the next time; similarly, you cannot guarantee that
    a person who never lies will definitely not lie next time. The reality is that
    people need Legal AI to gain efficiency and justice; meanwhile, improper use of
    Legal AI may run counter to original intentions. Legal AI developers also face
    such dilemmas: on one hand, they need to maintain their monopoly on data and algorithms
    to sustain profitability; on the other hand, they need to explain the algorithmic
    decision-making process to the public for regulatory review. Resolving such dilemmas
    requires the superb wisdom and objective conscience of judicial workers. A reference
    approach is the evidence rules in civil and criminal proceedings. The evidence
    principle in civil litigation is "preponderance of the evidence": one party presents
    evidence, and if the other party cannot provide contrary evidence, the presenting
    party is recognized as having the preponderance of evidence and wins court support.
    The evidence principle in criminal litigation is "beyond a reasonable doubt":
    one side in criminal litigation is an ordinary person, the other is the prosecution;
    ordinary people cannot endure the deprivation of personal rights brought by evidentiary
    flaws, while in civil litigation both subjects are ordinary people, the evidence-presenting
    party cannot provide all evidence, and limited evidence is sufficient; even losses
    caused to the other party by evidentiary flaws are remediable. Therefore, in the
    civil judicial field, some courts adopt Legal AI methods to assist in case handling,
    and some lawyers use Legal AI tools to retrieve historical precedents, display
    query results to clients, and predict judgment outcomes. Referencing Legal AI
    for decision-making is also controversial in academia; part of the reason may
    be that the universality of Legal AI lowers the industry entry threshold for lawyers
    and judges; another part may be that Legal AI methods remain to be verified in
    terms of legitimacy and accuracy. Regarding doubts about the legitimacy and accuracy
    of Legal AI systems, some countries consider management from professional ethics
    and regulatory norms. Technical ethics require Legal AI system developers to comply
    with procedural development specifications and professional ethics, forming explicable
    documentation at all stages of development. Regulatory norms require Legal AI
    development organizations and institutions to explain decision results and ensure
    traceability when necessary during software public testing, online deployment,
    and court hearings, and to stipulate the use of Legal AI decision results.


    ### 1.1.3 Significance of Legal AI


    Today, people are gradually realizing the importance of Legal AI. Driven by informatization
    and the "Internet+" application model, AI''s way of thinking has brought great
    changes to the traditional legal field, attracting widespread social attention
    in areas such as legal information retrieval, legal text generation, online dispute
    resolution, legal text consistency review, and case prediction and sentencing.
    In the Common Law system, judges need to cite previous precedents when making
    judgments to conduct legal reasoning and form grounds to support the judgment.
    Even under the Civil Law system, judges need to learn legal thinking and legal
    reasoning rules from classic precedents, or make judgments based on guiding cases.


    ## 1.2 Machine Learning


    ### 1.2.1 Understanding Machine Learning


    Simply put, Machine Learning is the process by which computers autonomously discover
    and learn the intrinsic laws hidden in data from the data itself. There was once
    a prevailing view that the most brilliant pearl on the crown of Artificial Intelligence
    is Machine Learning. From the history of AI development over the past few decades,
    Machine Learning and Big Data have led the future direction of AI, and it can
    be said to empower economic and social development to a certain extent.


    High-speed mobile internet has provided great convenience for people to produce,
    transmit, and store data, accumulating massive user data in all aspects of learning,
    work, and life. For example, educational institutions conduct online courses and
    training via the network, moving traditional teaching content and methods online;
    online education platforms collect teaching courseware, course recordings, teaching
    interactions, and virtual experiment operations. Practitioners in various industries
    integrate business models through network information technology, enabling them
    to understand customer needs in a timely manner and provide customized professional
    services. Everyone can share their joy, post their topics, and comment on others''
    views through social software. In fact, in the new economic era, data has become
    a form of wealth and core competitiveness, and the migration of data from offline
    to online is an inevitable trend of the times. Traditional shopping user groups
    and needs are fragmented and difficult to grasp; as a new shopping model, online
    shopping can provide complete solutions and understand consumers better. For example,
    e-commerce websites can complete everything from product display, order generation,
    payment, to product delivery within minutes; it is not only very convenient and
    efficient but also cheaper. By facing consumers directly, producers can truly
    understand market demand and adjust their production activities according to market
    conditions. By reducing intermediate circulation links, merchants can provide
    large quantities of goods at relatively low prices. Through consumer feedback,
    manufacturing enterprises and merchants can improve production and services, and
    strive to improve user experience from all aspects.


    Understanding users'' real needs, recommending satisfactory products and services
    to consumers, and helping users discover potential needs—all of this requires
    data, and more specifically, the support of Big Data. Users are not only data
    consumers but also data producers. Various mobile applications collect user data
    extensively at all times to analyze and mine valuable data. Machine Learning is
    the most effective tool for data analysis and mining; in various computer application
    fields, Machine Learning will play a significant role. Today, a lot of users''
    personal information is stored in the cloud in diverse formats, including voice,
    photos, and videos. Machine Learning can help storage institutions identify sensitive
    information from multimedia data, providing support for storage compliance. In
    the image field, Machine Learning can achieve facial recognition; in mobile payment
    applications, it can help users pay automatically by scanning their faces. In
    the computer vision field, it can achieve human gait recognition, thereby helping
    law enforcement agencies identify suspects from unclear videos. In the Natural
    Language Processing field, Machine Learning can automatically generate summaries
    of legal judgment documents, helping practitioners read literature quickly.


    ### 1.2.2 Machine Learning and Disciplinary Development


    Machine Learning provides solid support and problem-solving paths for the development
    of other disciplines. In the field of chemistry, through the sensory experience
    of compounds and the structural characteristics of functional groups, Machine
    Learning can identify smells from molecular structures. In the field of bioinformatics,
    by converting genes into images and using image recognition models, Machine Learning
    can find gene differences, thereby studying the laws of biological life. In the
    field of Traditional Chinese Medicine (TCM) diagnosis and treatment, by establishing
    multimodal data, Machine Learning can assist doctors in diagnosis and treatment
    through hidden structure analysis and syndrome differentiation. In the field of
    physics, Machine Learning is used to search for supersymmetric particle signals;
    by identifying jets caused by new physics, it improves the sensitivity of supersymmetric
    models. In the field of materials engineering, by discovering fatigue and defects
    in new materials through Machine Learning, material performance can be improved.
    In the field of social relations, by calculating social perception and identity
    through Machine Learning, it provides a decision-making basis for improving the
    social service grid system.


    With the widespread mention of Data Science based on data and Machine Learning,
    people have begun to pay attention to scientific research ideas, methods, and
    means. The traditional scientific research route starts with proposing a scientific
    hypothesis theory and uses experiments to verify the hypothesis. Materials for
    preparing empirical evidence are increasing; analyzing data and discovering laws
    from data have become necessary tools for the development of various disciplines.
    In the grand blueprint of the Human Genome Project, from data collection, data
    analysis to experimental modeling, scientists from various countries carried out
    comprehensive cooperation, in which Machine Learning played a major supporting
    role, having far-reaching significance for human health and even the development
    of scientific civilization.


    ### 1.2.3 Wide Application of Machine Learning


    Today, Machine Learning not only plays a pivotal role in disciplinary development
    but is also closely related to people''s daily lives. Current weather forecasts
    are more accurate than at any time in the past; massive meteorological data is
    obtained through observation, and Machine Learning trains learning models from
    historical data to predict future weather, facilitating people''s travel arrangements.
    Content such as literature, news, and entertainment is diverse; noisy information
    makes it difficult for reading users to choose. Machine Learning models screen
    specific themes and push them to users through user characteristics and data analysis,
    which not only saves users'' time but also improves the matching degree between
    theme content and user needs, building a bridge for good interaction between readers
    and authors.


    Traffic management detection utilizes Machine Learning technology to convert video
    images collected by road monitoring equipment into road traffic congestion indices,
    controlling traffic lights to improve traffic conditions. Tourism management departments
    can effectively use Machine Learning models to statistically analyze data on weather,
    ticket and hotel bookings, public events, and holiday arrangements, reasonably
    predicting popular tourist destinations. Public health management departments
    assess the use of public health resources using Machine Learning technology based
    on regional epidemic history and trends, combined with population statistics and
    genetic characteristics, reasonably distributing vaccines and other public health
    products, thereby saving public medical resources. Legal-related departments organize,
    store, and manage massive legal documents; through Machine Learning technology,
    they achieve timeline consistency in legislation, "similar cases, similar judgments"
    in judiciary, and same-source regulations in administration.


    ### 1.2.4 Machine Learning Application Scenarios


    A typical application of Machine Learning occurs during the search process of
    a web search engine. The user enters keywords in the search box, then clicks the
    mouse, and the search engine returns results. There must be a certain connection
    between the user''s input and the search engine''s output; judging from the user''s
    input query and the type of results returned by the search engine, this connection
    is inevitably not simple. For example, the user''s input query can be a keyword,
    a piece of audio, or an image. The search engine''s returned results can be a
    text web page, a photo, or a video. If the user inputs a keyword, such as "China
    University of Political Science and Law", the search engine returns a campus landscape
    photo of the university. From text input to image output, it is necessary to establish
    a relationship between the semantics of the text and the theme of the image, which
    inevitably requires using Machine Learning technology to model a large number
    of images themed "China University of Political Science and Law", and prepare
    a large number of text keyword inputs related to "China University of Political
    Science and Law" and image theme result outputs as samples for model training
    and learning. If no user has ever used a similar query, and no user has ever published
    image files related to the university on the network—such as file names, image
    titles, publisher names, publisher IP addresses, or publisher access history—Machine
    Learning models will be unable to learn, and thus unable to analyze the meaning
    of the user''s input keyword and understand its meaning.


    An innovative application of Machine Learning is in autonomous vehicles. Machine
    Learning can continuously sense surrounding road conditions and the environment,
    make precise predictions about possible changes, and thus make correct driving
    operations. The Internet of Vehicles, map applications, and vehicle sensors have
    accumulated a large amount of data available for analysis for autonomous driving;
    various Machine Learning algorithms provide data analysis capabilities; the control
    unit autonomously drives the vehicle based on predictions given by Machine Learning.
    Autonomous driving technology embodies the comprehensive practical application
    of intelligent agents in cognition, thinking, and action. For example, fusing
    data from different external and internal sensors such as radar, cameras, or IoT;
    translating and understanding the driving user''s voice and behavior; correctly
    locating, detecting, and identifying objects; timely classifying different objects
    and obstacles; predicting the motion trajectories of moving objects in advance.
    If the driving user feels unwell, by assessing the user''s condition and classifying
    the driving scenario, autonomous driving will guide the car to a nearby medical
    institution. Autonomous driving has a minimum probability of error or confidence
    level; the attribution of legal liability in this situation remains unclear. Although
    autonomous driving is currently in the exploration stage, with the accumulation
    of data and experience, market-oriented autonomous vehicles driving on ordinary
    roads can be expected in the future.


    An example of the generalized application of Machine Learning is helping Obama
    win the 2012 US presidential election. His campaign team used Machine Learning
    technology to analyze messages left by US voters on social networks. To increase
    supporters and decrease opponents, they found reasons why potential defectors
    might switch sides, carried out targeted publicity campaigns, tried their best
    to keep wavering voters in their camp, and used the same method to make unstable
    groups in the opponent''s camp waver and switch sides. The campaign team adjusted
    publicity and campaign strategies based on the election situation and Machine
    Learning output results, such as reducing investment in safe-win or safe-loss
    states, and spending large amounts of campaign funds on swing states, achieving
    very good results. After winning, Obama established the "Artificial Intelligence
    and Machine Learning Committee" to research the development and utilization of
    Machine Learning.


    The continuous and rapid development of Machine Learning will affect international
    relations. Competition between nations is not only reflected in traditional hard
    power and soft power; new technologies represented by Machine Learning will also
    drive transformation in important fields for various countries. As a top-tier
    technology, Machine Learning is considered by governments when formulating policies,
    thereby affecting all aspects of society. On one hand, countries must attach importance
    to data security, elevating it to the level of national security, and try to avoid
    international cooperation and acquisitions. On the other hand, Machine Learning
    relies on Big Data, requiring shortened communication time between models and
    data, which needs strengthened international cooperation and enterprise globalization.
    Starting from Machine Learning technology itself, providing global public product
    services is the internal driving force of technological progress. Machine Translation
    strengthens ties between countries, reduces communication costs, and increases
    willingness to communicate. The Human Genome concerns the life and health process
    of the community of human destiny; Machine Learning technology will undoubtedly
    greatly accelerate this process. Commercial applications of Machine Learning will
    create many new jobs, but also destroy old business models, reducing more jobs.
    Production factors flow globally; investment-intensive countries reap the most
    economically; knowledge-poor countries will miss development opportunities.


    ### 1.2.5 Questions on Machine Learning


    The development of Machine Learning has not been smooth sailing; even today, skeptical
    voices are not lacking. The core of past Machine Learning was symbolic learning
    concepts; after the 1990s, statistical Machine Learning replaced the status of
    symbolic Machine Learning, and in the future, it will also gradually exit the
    historical stage like symbolic learning. There is also a view that statistical
    Machine Learning benefits from Big Data, while algorithms for Big Data benefit
    from the improvement of computing power; one day in the future, the pendulum of
    Machine Learning will swing back to the field of symbolic cognitive science, even
    if it may take a very long time. Centrists believe that statistical Machine Learning
    will combine the knowledge of symbolic learning in the future and develop in a
    spiral upward form.


    Statistical Machine Learning learns laws from data: first, a statistical hypothesis
    is proposed, then data is used to match the hypothesis; the hypothesis model that
    best fits the data is the learning result. All statistical Machine Learning hypotheses
    are based on the premise of Independent and Identically Distributed (IID) data;
    this may be far-fetched, because nature may not have so many IID scenarios. Machine
    Learning should consider solutions under conditions without IID; although this
    is a difficult problem, it is by no means an insurmountable chasm.


    In recent years, Deep Learning has caused an unprecedented storm in the field
    of AI. Frankly speaking, in terms of theoretical innovation, Deep Learning has
    not shown outstanding performance; it is just that past models with high complexity
    were limited by computing performance and small data, unable to obtain more precise
    results. This statement may have a slight "sour grapes" mentality, but it indeed
    puts great pressure on experts in other aspects of AI. In any case, it is undeniable
    that Deep Learning has unprecedented driving force and significant meaning for
    the practical application of AI in various fields.


