    `BeautifulSoup`是一个能够解析网页结构的`Python`模块，`Lxml`是解析`XML`格式的`Python`封装模块，由于用`C`语言编写的模块，解析运行的性能要比`BeautifulSoup`更加高效。安装`BeautifulSoup`和`Lxml`模块需要使用：


