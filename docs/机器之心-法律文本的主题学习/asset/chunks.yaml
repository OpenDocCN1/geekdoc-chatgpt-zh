    ## 6.2 Vector Space Model


    ### 6.2.1 Distance Metrics and TF-IDF


    Euclidean distance regards a legal text as a point in Euclidean space; the distance
    between two legal texts is the straight-line distance between two points in Euclidean
    space:


    ![](img/txt006_11.jpg "pagenumber_ebook=159,pagenumber_book=150")


    Chebyshev distance is a distance metric in vector space, defining the distance
    between two points as the maximum absolute value of the differences of their coordinates:


    ![](img/txt006_12.jpg "pagenumber_ebook=159,pagenumber_book=150")


    Manhattan distance (Absolute value distance) is defined as the sum of the absolute
    values of the differences of their coordinates:


    ![](img/txt006_13.jpg "pagenumber_ebook=159,pagenumber_book=150")


    There are various methods for assigning weights `wik` to feature terms `f_tik`
    in the Vector Space Model. After legal text preprocessing, synonyms in the `i`-th
    legal text are merged into the same feature term `tk`. According to the Boolean
    model, regardless of the number of occurrences, the value is assigned as 1. According
    to the Term Frequency method, the number of occurrences of a term is counted and
    assigned to `wik`.


    Term Frequency (`TF`) is a simple and practical method. Generally speaking, a
    given word appearing with a higher frequency in a legal text is more important
    than a word with a lower frequency. To eliminate the influence of the length of
    the legal text, term frequency statistics need to divide the number of occurrences
    of word `tk` in a legal text by the total number of words in that legal text:


    ![](img/txt006_14.jpg "pagenumber_ebook=159,pagenumber_book=150")


    Here, `Ni` is the total word count of the `i`-th legal text, and `Nik` is the
    number of occurrences of word `tk` in the `i`-th legal text. Assuming a legal
    text has a total word count of 100, the word "car" appears 2 times, and the word
    "law" appears 10 times. According to the formula, `TF(car)` is 0.02, while `TF(law)`
    is 0.1.


    Inverse Document Frequency (`IDF`) assigns a weight to each word when calculating
    term frequency. When calculating `TF`, only the current text is considered, implicitly
    assigning equal weight to each word. In reality, if a word appears frequently
    in a text but also appears frequently in the corpus, it indicates that the word
    is not actually important. For example, a legal text corpus has 10,000 texts,
    100 of which contain "car", and 10,000 of which contain "law". Obviously, the
    word "car" carries more information and should be given a higher weight.


    ![](img/txt006_15.jpg "pagenumber_ebook=160,pagenumber_book=151")


    Here, `N` is the total number of texts in the legal corpus, and `Ntk` is the number
    of legal texts containing term `tk`. According to the formula, `IDF(car)` is 2,
    while `IDF(law)` is 0.


    Combining Term Frequency and Inverse Document Frequency yields `TF-IDF` (Term
    Frequency-Inverse Document Frequency), which is the product of term frequency
    and inverse document frequency:


    ![](img/txt006_16.jpg "pagenumber_ebook=160,pagenumber_book=151")


    By calculating `TF-IDF`, one can know which words are more important to the legal
    text and which words can be regarded as stop words. For example, `TFIDF(car)`
    is 0.04, while `TFIDF(law)` is 0. Similarly, many function words, particles, and
    conjunctions have `TFIDF` values approaching 0 and can be treated as stop words
    and eliminated in feature engineering.


    ### 6.2.2 One-hot Encoding


    The Bag-of-Words model uses a vector to represent a legal text, where elements
    in the vector represent the frequency of a feature word. If a vector represents
    a word, a text containing multiple words becomes a matrix. Assuming the dictionary
    `V` has a size of `|V|`, using `one-hot` to encode words requires establishing
    a vector of length `|V|`. The `k`-th word in the dictionary is mapped to a `|V|`-dimensional
    `one-hot` vector, where only the `k`-th position is 1, and all other positions
    are 0. Table 6.1 shows the vocabulary formed by the aforementioned Legal Text
    1 and Legal Text 2, namely ["arrested", "car", "likes", "police", "robbed", "suspect",
    "the"], with index positions starting from 0.


    Table 6.1 One-hot Encoding


    ![](img/txt006_17.jpg "pagenumber_ebook=161,pagenumber_book=152")


    `One-hot` encoding is a sparse representation; the encoding dimension is the size
    of the entire vocabulary, resulting in large computational overhead. Each `one-hot`
    encoding is orthogonal to others, with a cosine similarity of 0, unable to reflect
    the semantics of words. For example, "car" and "vehicle" are semantically similar,
    but `one-hot` encoding cannot reflect the degree of their relationship. `One-hot`
    encoding is suitable for mapping the input data space to a high-dimensional feature
    representation, and then the decoder maps the high-dimensional feature representation
    back to the input data space. More importantly, the input end of a neural network
    model takes the `one-hot` encoded information of a word, and the output information
    is the `one-hot` encoding of the neighboring words of that word; such a model
    then possesses semantic information.


    ### 6.2.3 Word Embedding Models


    Lexical-level semantics in Natural Language Processing include lexical semantics
    and distributional semantics. Lexical semantics refers to the meaning defined
    for the entry in a dictionary; distributional semantics refers to the similar
    semantics of context words that appear together with the entry. For example, after
    reading a large amount of legal corpus texts, it is found that "robbed" often
    co-occurs with "car", "wallet", "suspect", etc. Even without knowing the meaning
    of "robbed", one can infer part of its meaning through co-occurring words.


    Machine learning models map input data to output data. If the input data is a
    word, the output data is the context words of this word in the corpus. Both input
    words and output words use `one-hot` encoding. Using corpus samples to continuously
    train the neural network model, the training objective is not to predict the context
    words of a certain word, but to obtain the model parameters, i.e., the neural
    network connection weights, and use the model parameters as the vectorized representation
    of the input layer. The input layer corresponds to the `one-hot` encoding of a
    word, the output layer corresponds to the `one-hot` encoding of co-occurring words,
    and the model parameters are the connection relationships from the input layer
    to the output layer, which is the word vector (`word2vec`) of this word in the
    distributional semantic environment, called the Word Embedding Model (`word embedding`).
    As shown in Figure 6.3:


    ![](img/txt006_18.jpg "pagenumber_ebook=162,pagenumber_book=153")


    Figure 6.3 Word Embedding Model


    After extensive training of the neural network, the weight parameter matrix `WV×N`
    is obtained. The `one-hot` encoding of the first word in the dictionary corresponds
    to `X1` = 1 at the input layer, while all other input nodes are 0; only `W1×N`
    (the first row of the weight parameter matrix `WV×N`) can be passed to the hidden
    layer. Similarly, the `one-hot` encoding of the `k`-th word in the dictionary
    corresponds to `Xk` = 1 at the input layer, while all other input nodes are 0;
    only the `k`-th row of the matrix `WV×N` can be passed to the hidden layer. Therefore,
    the `one-hot` expression of a word can be mapped to a word vector expression,
    i.e., the connection weights of the input node corresponding to the word''s index.
    The word vector dimension is the number of hidden nodes; in a sense, `word2vec`
    is a dimensionality reduction operation, reducing from the vocabulary length `V`
    to the number of hidden nodes `N`.


    `Word2vec` is divided into `skip-gram` and `CBOW`. The input layer of `skip-gram`
    is a single word, and the output layer is the context of this word; simply put,
    it predicts the context of a word. The input layer of `CBOW` is context words,
    and the output layer is a single word; simply put, it uses context to predict
    a word.


    ### 6.2.4 Legal Text Representation


    Legal texts contain legal terminology and daily language. Feature engineering
    can be performed separately for legal terminology and daily language. A legal
    terminology dictionary is used to construct legal terminology feature items, and
    common words are used to construct daily language feature items. Legal terminology
    feature items can improve the semantic representation of legal texts, while daily
    language feature items can fully utilize the statistical properties of machine
    learning. Therefore, combining legal terminology feature items and daily language
    feature items, corresponding feature items for daily language are generated from
    the daily word bag, and a daily language dictionary is constructed after feature
    selection. Words not in the daily language dictionary or the legal terminology
    dictionary are regarded as stop words and deleted directly from the legal text.
    Legal text representation is shown in Figure 6.4:


    ![](img/txt006_19.jpg "pagenumber_ebook=163,pagenumber_book=154")


    Figure 6.4 Legal Text Representation


    Stage ① in the figure is data preparation, outputting the legal text corpus and
    the legal terminology dictionary under the corresponding legal system; the corpus
    uses `CJO` or `FCA` datasets. Stage ② performs word segmentation on the legal
    texts in the corpus to obtain the complete set of output terms. Stage ③ obtains
    the set of common language terms after removing legal terminology based on the
    legal terminology dictionary. Stage ④ establishes an initial vector space model
    without legal terminology based on statistical feature methods, obtaining the
    feature vector of the semi-text representation. Stage ⑤ performs feature selection
    on the feature vector of the semi-text representation to construct the daily language
    dictionary. Stage ⑥ deletes words that do not appear in the above two dictionaries
    from the complete term set based on the daily language dictionary and the legal
    terminology dictionary, establishes a dual-dictionary vector space model, and
    outputs the full feature vector of the legal text. Stage ⑦ classifies the legal
    text feature representation vector.


    ## 6.3 Filter Feature Selection


    ### 6.3.1 General Methods of Feature Selection


    The process of generating a feature subset according to certain methods and criteria
    is called feature selection. In the feature subset selection stage, selection
    starts from the initial feature space according to certain criteria. Simpler methods
    include exhaustive selection or random selection, the drawback being large overhead
    in space and time. Improved methods include heuristic rules, selecting from the
    feature space based on greedy thinking until a certain condition is met.


    Feature selection methods such as exhaustive selection, random selection, and
    heuristic rules all retain the original values of features, while some methods
    transform the original feature values. For example, Principal Component Analysis
    and Fourier Transform project original feature values onto a new space through
    space transformation, changing the original feature values. According to whether
    the feature subset generation process changes the original feature values, dimensionality
    reduction can be divided into feature selection and feature extraction. The feature
    subset generated by feature selection is a subset of the original feature space,
    while the subset generated by feature extraction is a mapping of the original
    feature space; both methods perform dimensionality reduction on the feature space,
    as shown in Figure 6.5:


    ![](img/txt006_20.jpg "pagenumber_ebook=164,pagenumber_book=155")


    Figure 6.5 Classification of Feature Subset Search Process


    Whether the selected feature subset meets requirements requires evaluation of
    the feature subset. Evaluation criteria differ according to different needs. For
    example, features in the feature subset have certain representativeness and sample
    balance, or the selected feature subset enables the machine learning model to
    exhibit superior performance on test data.


    ### 6.3.2 Filter Selection Methods


    Feature selection reduces some noise, making the machine learning model built
    on the feature subset more effective and enhancing the model''s generalization
    ability. The result of feature selection is a relatively optimal feature subset.
    Inputting the training data after feature selection into the machine learning
    model for training enables the model to perform well on test data.


    Generally, the following issues need to be considered for feature selection. First,
    selecting a determined number of features from the initial feature space can improve
    model accuracy. Second, selecting the smallest number of feature subsets while
    achieving a given accuracy. Third, balancing between achieving model accuracy
    and reducing the number of features. All the above issues are related to constrained
    optimization. When the dimension of the initial feature space is small, it can
    meet the requirements of computer time and space complexity. However, when the
    dimension is very large, it will be difficult to meet the overhead in time and
    space, requiring a more suitable solution.


    The feature selection process includes selection, evaluation, stopping, and validation.
    Selection refers to choosing a feature subset from the initial feature space according
    to a certain method. Evaluation refers to measuring the feature subset according
    to a certain evaluation method. Stopping refers to judging whether to stop the
    current feature subset search or continue selecting the next feature subset based
    on a certain criterion. Validation refers to validating the effectiveness of the
    finally selected feature subset to enhance the model''s generalization ability.
    As shown in Figure 6.6:


    ![](img/txt006_21.jpg "pagenumber_ebook=165,pagenumber_book=156")


    Figure 6.6 Feature Selection Process


    Feature subsets have their own characteristics; how to select a feature subset
    needs to be determined according to actual application requirements. The evaluation
    function measures the quality of Feature Subset Selection (`FSS`). Evaluation
    functions can be divided into Filter Model (Filter `FSS`), Wrapper Model (Wrapper
    `FSS`), and Mixture Model (Mixture `FSS`). The filter model adopting the independence
    principle iteratively outputs the initial feature space of the training data into
    a final feature subset, then inputs the final feature subset into the machine
    learning algorithm for training. How the final feature subset is generated is
    independent of the machine learning algorithm. The filter model utilizes the intrinsic
    characteristics and laws of the training data distribution and can be regarded
    as a kind of data preprocessing to a certain extent.


    ![](img/txt006_22.jpg "pagenumber_ebook=165,pagenumber_book=156")


    Figure 6.7 Principle of Filter


    ### 6.3.3 Evaluation Function Based on Random Matrix


    The evaluation function evaluates the quality of feature subset selection and
    can be divided into correlation criteria and independence criteria. In the feature
    selection algorithm of the filter model, independence criteria are generally applied,
    attempting to evaluate the selected feature subset through the intrinsic laws
    of the training data, thus being independent of the given learning algorithm.
    Independence criteria include information measure, distance measure, correlation
    measure, and consistency measure, etc. When performing more general feature selection,
    this method is recommended. Because it is independent of the given machine learning
    algorithm, the independence criterion is also applicable to most subsequent other
    machine learning algorithms.


    A matrix whose elements are random variables is called a random matrix. With the
    introduction of random variables, matrix elements and eigenvalues change from
    deterministic values to random variables and their probability distributions.
    According to the matrix form and intrinsic properties, random matrices are used
    to solve uncertainty problems. Random matrices are not intended to replace deterministic
    matrices, but when results are difficult to calculate precisely, they abandon
    the intrinsic certainty mechanism and describe and process problems from the perspective
    of statistical properties, such as mean and variance.


    `Wishart` proposed the `Wishart` distribution based on a set of random matrices
    defined on symmetric, non-negative definite matrices. Assuming random variables
    `X1`, `X2`, ..., `Xn` are mutually independent and follow a normal distribution
    with mean 0 and variance 1, `n` independent samples drawn from a univariate normal
    distribution, the variance of these samples should follow a `X2` distribution
    (Chi-square distribution) with `n` degrees of freedom:


    ![](img/txt006_23.jpg "pagenumber_ebook=166,pagenumber_book=157")


    The `Wishart` distribution is the distribution of the covariance matrix of samples
    drawn from independent multivariate normal random vectors. It is also the extension
    of the `X2` distribution to the multivariate case and can be used to describe
    the covariance matrix of multivariate normal distribution samples. It is very
    important in the Bayesian derivation of multivariate normal distributions. Modeling
    the covariance of a random matrix with the `Wishart` distribution follows the
    formula below:


    ![](img/txt006_24.jpg "pagenumber_ebook=166,pagenumber_book=157")


    The probability density function of the `Wishart` distribution `S` is as follows:


    ![](img/txt006_25.jpg "pagenumber_ebook=166,pagenumber_book=157")


    Here, `Γp(n/2)` is a multivariate `Gamma` function, and `trace(Σ-1S)` is the trace
    of the matrix, i.e., the sum of the elements on the main diagonal. In practice,
    this specific form of probability density is rarely used directly. However, it
    has a significant role: the `Wishart` distribution is often used as the conjugate
    prior distribution of the inverse of the covariance matrix of a normal distribution.
    In many cases, it can be used to describe the covariance matrix of normal distribution
    samples, which is consistent with the Chi-square distribution describing the variance
    of univariate normal distribution samples. This distribution is also important
    when the diffusion tensor of a symmetric positive definite matrix is precisely
    a random element.


    The most important role of the `Wishart` distribution is to describe the covariance
    of multivariate normal distribution samples. That is, assuming `X1`, ..., `Xn`
    are independent and identically distributed samples, all from `Np(μ, Σ)`. Then,
    the sample mean and variance are:


    ![](img/txt006_26.jpg "pagenumber_ebook=167,pagenumber_book=158")


    ### 6.3.4 Random Matrix Feature Selection SMFS


    Based on the characteristics of random matrices, due to the introduction of random
    variables, the elements of the text vector space matrix change from deterministic
    values to random variable sampling and their probability distributions.


    #### Corollary 6.1


    `W` is an `N×N` `Wishart` matrix, and:


    ![](img/txt006_27.jpg "pagenumber_ebook=167,pagenumber_book=158")


    All elements of the `W` matrix are composed of the inner products of different
    word random vectors. The number of observed values of the word random vector is
    the sample size `m`, and the number of random variables is the number of words
    `n`, i.e., the text vector space matrix is `m×n`.


    #### Corollary 6.2


    The diagonal elements of `W`, i.e., `Wii`, `1≤ i≤ N`, are Independent Identically
    Distributed (`IID`) random variables. When the number of observed sample values
    is particularly large, they can be considered to approximately follow a normal
    distribution, and both the expectation `μ(Wii)` and variance `σ2(Wii)` are bounded.


    According to Corollary 6.2, when `Wii` are independent and identically distributed,
    the column vectors in the text vector space, i.e., the word random column vectors,
    are also independent and identically distributed and approximately follow a normal
    distribution, while the class vector follows a binomial `Bernoulli` distribution.
    If the word random vector `tj` is independent of the class vector `c`, then the
    distribution of `tj` observed in positive samples should be the same as or have
    little difference from the distribution of `tj` observed in negative samples.
    This indicates that the overall distribution of `tj` does not change completely
    with different sample class values; the observed values of `tj` are independent
    of the class and are a random variable independent of the class. Conversely, if
    the distribution of `tj` observed in positive samples shows a large difference
    from that observed in negative samples, this indicates a large correlation between
    the overall distribution of `tj` and the sample class. Therefore, we can estimate
    the correlation between words and classes from the distribution difference of
    `tj` observed values in positive and negative samples.


    The observed values of `m` samples on the word random vector `tj` are:


    ![](img/txt006_28.jpg "pagenumber_ebook=168,pagenumber_book=159")


    `T` denotes vector transpose. The `m×n` matrix is divided into two subsets according
    to positive and negative samples. Among them, `TP` is the text vector space matrix
    composed of positive samples, and `TN` is the text vector space matrix composed
    of negative samples. `(1, 2, ..., r-1)` are the indices of positive samples in
    the entire sample set; the sample observed values of word vector `tj` on the positive
    class are `(t1j, t2j, ..., t(r-1)j)T`. `(r, r+1, ..., m)` are the indices of negative
    samples in the entire sample set; the sample observed values of word vector `tj`
    on the negative class are `(trj, t(r+1)j, ..., tmj)T`.


    The `TP` matrix is described as follows:


    ![](img/txt006_29.jpg "pagenumber_ebook=168,pagenumber_book=159")


    The `TN` matrix is described as follows:


