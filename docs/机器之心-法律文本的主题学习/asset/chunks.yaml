    ## 3.2 Lexical Analysis of Legal Texts


    ### 3.2.1 Lexical Analysis


    Accurate understanding of natural language text is based on lexical analysis.
    Lexical analysis is the process or step of segmenting a piece of text into words,
    phrases, and some meaningful units. For example, an English text: "A process is
    used to select jurors by a judge or counsel". The result of English word segmentation
    is generally words. However, English has words with multiple parts of speech;
    grasping the meaning of a word requires combining its position and function in
    the sentence''s grammatical structure. There are delimiters between different
    words in English, making segmentation relatively easy. In contrast, a Chinese
    text is continuous, with no delimiters between words. For example, a Chinese text:
    "该案法官和律师按照程序挑选了一些陪审员" (The judge and lawyers in this case selected some jurors
    according to procedure). Chinese word segmentation differs from English; it needs
    to define boundaries between words, using the symbol "/" to segment words. The
    segmentation result might be "该案/法官/和/律师/按照/程序/挑选了/一些/陪审员".


    A text may contain nouns or phrases with special meanings. For example, in the
    English text "License is required for sale of nursery stock by Act 189 of 1931",
    splitting "Act 189 of 1931" into four words "Act/189/of/1931" is obviously inappropriate.
    "Act 189 of 1931" is a semantically indivisible whole, indicating an act numbered
    189 enacted in 1931. Such special nouns are called Named Entities. In natural
    language, their status and function are significantly higher than other sentence
    components; named entities often contain key information or the answers sought
    in information retrieval. Similarly, "nursery stock" is a semantic whole; if split
    into "nursery/stock", the meaning will deviate significantly.


    A Chinese text: "依据《中华人民共和国刑法修正案 (九)》的相关规定，检察院以涉嫌盗窃罪对犯罪嫌疑人钱某作出批准逮捕决定" (According
    to relevant provisions of the "Criminal Law Amendment (IX) of the PRC", the Procuratorate
    approved the arrest of suspect Qian on suspicion of theft). The Chinese word segmentation
    result might be "依据/《中华人民共和国刑法修正案 (九)》/的/相关规定/，/检察院/以/涉嫌盗窃罪/对/犯罪嫌疑人/钱某/作出/批准/逮捕/决定".
    "刑法修正案 (九)" (Criminal Law Amendment (IX)) cannot be split into "刑法/修正/案/(九)".
    Here, "《中华人民共和国刑法修正案 (九)》" is a named entity, a legal source in legal texts, and
    also key information for legal domain classification, QA systems, automatic text
    summarization, and information retrieval in legal NLP.


    Lexical analysis outputs a piece of text as a sequence of words or phrases with
    complete meanings. By basic positioning of linguistic word elements, it obtains
    flexible segmentation granularity, ensuring both coarse-grained semantic completeness
    and fine-grained word granularity. For Chinese legal texts, referring to legal
    terminology and vocabulary, the continuous legal text is segmented into word sequences
    that are complete and reasonable in legal meaning. For English legal texts, special
    named entities need to be output as a whole into the sequence.


    ### 3.2.2 Part-of-Speech Tagging


    Words in a sentence undertake different roles and positions. In the sentence''s
    grammatical structure, words in the same position generally have the same Part
    of Speech (POS). A category of words or lexical items possessing the same grammatical
    properties is called a part of speech; words of the same part of speech have similar
    properties, activities, or behaviors in a sentence. For example, in the Chinese
    sentence "原判根据相关的证人证言认定被告具有非法占有的主观故意" (The original judgment determined based
    on relevant witness testimony that the defendant had the subjective intent of
    illegal possession), "原判/证人证言/被告/主观故意" (original judgment/witness testimony/defendant/subjective
    intent) are all nouns; "认定/具有" (determined/possess) are verbs; "相关的/非法占有的" (relevant/illegal
    possession) are determiners/modifiers; "根据" (based on) is a preposition. In the
    Chinese sentence "王某以欺骗的方式非法占有他人巨额财物" (Wang illegally possessed another''s huge
    property by deceptive means), "王某/方式/财物" (Wang/means/property) are nouns; "占有"
    (possess) is a verb; "他人" (others) is a determiner; "欺骗的/巨额" (deceptive/huge)
    are adjectives; "非法" (illegal) is an adverb; "以" (by) is a preposition. In the
    Chinese sentence "张某通过编造的谎言欺骗物业公司管理人员" (Zhang deceived property company managers
    through fabricated lies), "张某/谎言/物业公司/管理人员" (Zhang/lies/property company/managers)
    are nouns; "欺骗" (deceive) is a verb; "编造的" (fabricated) is an adjective; "通过"
    (through) is a preposition. In the above examples, the same word "占有" (possess)
    has different parts of speech due to different positions and functions: one is
    a determiner/modifier, the other a verb. "欺骗" (deceive/deceptive) has one part
    of speech as an adjective, another as a verb.


    English parts of speech include Noun (`noun`), Verb (`verb`), Adjective (`adjective`),
    Adverb (`adverb`), Article (`article`), Numeral (`numeral`), Preposition (`preposition`),
    Pronoun (`pronoun`), Determiner (`determiner`). In the English sentence "the jury
    has easily reached a consistent verdict on this issues submitted to the court
    for determination", "jury/verdict/issues/court/determination" are nouns; "has/reached/submitted"
    are verbs; "consistent" is an adjective; "the" is an article; "a" is a numeral
    (article); "on/to/for" are prepositions; "this" is a pronoun; "easily" is an adverb.
    In the English sentence "I am the public defender appointed to your case", "I"
    is a pronoun; "am/appointed" are verbs; "the" is an article; "public" is an adjective;
    "defender/case" are nouns; "to" is a preposition; "your" is a determiner. Besides
    these, there are Conjunctions (`conjunction`) and Interjections (`interjection`).


    ### 3.2.3 Outputting Tokens


    In the process of building a text, the input is a stream of characters or character
    sequences. From the perspective of human natural language, words as basic linguistic
    units use strings of indefinite length. To recognize words from the character
    stream in a text, it is necessary to pre-define the subsequences corresponding
    to words; a word is a string with independent meaning. A Token (`token`) is the
    equivalent of a word in a dictionary. Tokenization (`tokenization`) refers to
    the process of splitting the character stream sequence in the entire text into
    subsequences; the subsequences are called tokens, and the position of each subsequence
    in the dictionary is called a term. During tokenization, some punctuation and
    special symbols may be removed.


    Words, tokens, and terms are consistent in meaning in most cases; if strictly
    distinguished, there are differences. A word is a category in linguistics, referring
    to a linguistic unit formed in the process of human language use. A token is the
    index corresponding to a word in information retrieval, referring to an instance
    of a string sequence appearing in the text that is consistent with the word. A
    term is a class of tokens in the dictionary where the token corresponds to the
    same string sequence but different meanings, referring to a collection of tokens
    with the same form but different meanings. For example, the input sequence for
    building an English legal text is "According to legal documents，a judge will serve
    with a summons or writ to show an administrator’s right to control of assets".
    According to the dictionary, the tokenization process splits the complete text
    input sequence into subsequences, outputting "According/to/legal/documents/，/a　/judge/will/serve/with/a/summons/or/writ/to/show/an/administrator/’s/right/to/control/of/assets".
    The number of tokens (subsequences) is 24, including 1 punctuation mark, 3 "to"s,
    2 "a"s. Removing punctuation and merging identical tokens, the word count is 20.
    If "to" and "a" are removed as high-frequency words, the remaining 18 words are
    terms.


    For building a Chinese legal text, the input sequence is "在协议签订后，委托双方认可的有资质的资产评估机构对甲方投入的资产进行评估"
    (After the agreement is signed, a qualified asset appraisal agency recognized
    by both parties appraises the assets invested by Party A). According to the Chinese
    dictionary, the tokenization output is "在/协议/签订/后/，/委托/双方/认可/的/有/资质/的/资产/评估/机构/对/甲方/投入/的/资产/进行/评估".
    The number of Chinese tokens (subsequences) is 22, including 1 punctuation mark,
    3 "的" (de), 2 "资产" (assets). Removing punctuation and merging identical tokens,
    the word count is 18. If "的" is removed as a high-frequency word, the remaining
    17 words are terms.


    Outputting tokens from text first requires sentence splitting, determining sentence
    boundaries through sentence-delimiting punctuation in the sentence structure.
    Then, word segmentation is performed on sentences, requiring determination of
    word boundaries. Chinese word segmentation is slightly more complex; determining
    word boundaries requires combining more content. English word segmentation is
    relatively easy; the delimiter between words is generally a space. However, there
    are different situations regarding whether some symbols act as delimiters or as
    part of a word. Hyphens in English can form new words, e.g., Wi-Fi (wireless LAN),
    output as one token. Hyphens can connect the front and back parts of a word at
    line breaks; they should be output as one token. Hyphens can also combine multiple
    words, e.g., "long-distance" (meaning a synthesis of two words); they should be
    output as two tokens. English single quotes, when used as noun possessives, should
    be output as two tokens with the preceding noun; when used as contraction markers,
    they should be output as one token.


    High-frequency words have low relevance to the theme and content of the text in
    information retrieval and can be automatically filtered out as Stop Words (`Stop
    Words`) to reduce NLP time and save storage resources. Stop words can be pre-defined
    or a stop word list can be set; generally, function words and high-frequency words
    in the dataset are used as stop words. Large stop word lists have hundreds of
    stop words; small ones have a dozen or so.


    Normalization operations can streamline tokens and focus on word meaning. The
    result of normalization operations on tokens is terms. Not only do multiple original
    tokens with the same form need to be merged to obtain terms, but tokens with different
    affixes also need normalization. Normalization operations on tokens include stemming
    and lemmatization. Stemming generally only targets some words with the same meaning,
    without considering part of speech and context, simply grouping tokens with the
    same meaning into a token class (term). Lemmatization removes prefixes or suffixes
    from tokens but also needs to consider context and part of speech, restoring comparative
    or superlative degrees of adjectives.


    ### 3.2.4 Polyglot and NLTK Sentence Splitting and Tokenization


    In NLP tasks, the scope of processing objects from large to small are: discourse/document,
    paragraph, sentence, word, and character. In a dataset, a file generally corresponds
    to a discourse/document. In a discourse, the delimiter between paragraphs is generally
    a carriage return line feed, i.e., `\r\n`. In a paragraph, delimiters between
    sentences include periods and spaces, i.e., "." and pure spaces.


    At English sentence boundaries, the previous sentence ends with a symbol ".",
    and there must be a space before the first letter of the next sentence. Otherwise,
    sentence splitting errors will occur. Sentence splitting uses the `sentences`
    method of the `polyglot.text` module, relying on spaces and periods to split sentences;
    spaces also include tabs `\t`. For example, define an English text where periods
    "." are followed by spaces:


    ![](img/txt003_8.jpg "pagenumber_ebook=94,pagenumber_book=85")


    The running results are shown in Figure 3.4. This text `legal_content` has three
    sentences in total, with three English periods ".", and two combinations of period
    and space. Actually, `polyglot.text` splits sentences based on period-space. If
    the space between the second and third sentences is deleted, i.e., the space before
    "The man", the sentence splitting result will be as shown in Figure 3.5. It can
    be seen that `polyglot.text` treats the original first and second sentences as
    one sentence, and parses the last word "up" of the original first sentence, the
    symbol ".", and the first word "The" of the second sentence as a new abbreviation
    "up.The".


    ![](img/txt003_9.jpg "pagenumber_ebook=94,pagenumber_book=85")


    Figure 3.4　Polyglot Correct Sentence Splitting


    ![](img/txt003_10.jpg "pagenumber_ebook=94,pagenumber_book=85")


    Figure 3.5　Polyglot Incorrect Sentence Splitting


    Sentence splitting is relatively easy, while tokenization is more complex. As
    mentioned above, English periods need to be correctly identified: neither treating
    the sentence delimiter "." as a dot in an abbreviation, nor treating the dot "."
    in an abbreviation as a sentence delimiter. The `polyglot.text` module uses the
    `words` method to achieve splitting of punctuation, words, and sentence boundaries
    through delimiters such as spaces, tabs, carriage returns, commas, and periods.
    For example, the words and symbols after the paragraph text `legal_content` is
    split:

