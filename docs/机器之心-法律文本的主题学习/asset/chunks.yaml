    (诉讼请求=待确定)，∧表示逻辑与的关系，用∧连接的前后两个条件需要同时成立，才能满足逻辑表达式整体成立。从训练样本集中学习的过程就是确定待确定的部分。从案件编号为1的样本中，(证据材料=转账记录和合同)∧(案由=借款纠纷)∧
    (诉讼请求=返回欠款)为胜诉案件。除了编号为1的样本之外，编号3、5和7也都为胜诉案件，这些案件都是已经被观察到的判决结果。对于未在训练集中出现的样本，学习模型需要对未知数据进行预测，称为模型的泛化。归纳学习将分析和总结训练样本的特征规律，例如，所有胜诉案件的样本在哪些特征上取值相同或相似。同时，也比较类别不同案件在哪些属性或特征上取值不同。


