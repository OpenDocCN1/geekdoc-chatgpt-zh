    ## 2.1 Supervised Learning and Unsupervised Learning


    Learning tasks can be divided into supervised learning and unsupervised learning,
    as shown in Figure 2.1. Supervised learning samples contain label information;
    the learning algorithm can adjust model parameters based on the difference between
    model output and actual output, performing feedback learning, and the learned
    model can predict outputs for new samples without labels. Unsupervised learning
    samples have no label information; therefore, the learning process has no feedback
    information to the model, and the learning objective is the hidden structure in
    the data.


    ![](img/txt002_1.jpg "pagenumber_ebook=45,pagenumber_book=36")


    Figure 2.1 Supervised Learning and Unsupervised Learning


    ## 2.2 Main Objectives of Supervised Learning


    The main objective of supervised learning is to learn a model from labeled training
    data in order to make predictions on future data, as shown in Figure 2.2. Supervision
    refers to the expected output signal input to the model for a sample, i.e., the
    label. For example, in legal text domain classification, using supervised machine
    learning algorithms to learn a model on training data with labeled domains, the
    trained model can predict whether a new legal text belongs to a specific domain.
    Category labels in supervised learning are discrete; this classification task
    is a type of supervised learning method. Another supervised learning task is regression
    learning, where the output signal of the regression model is a continuous numerical
    value.


    ![](img/txt002_2.jpg "pagenumber_ebook=45,pagenumber_book=36")


    Figure 2.2 Supervised Learning Process


    ## 2.3 Classification and Clustering


    In binary classification tasks of supervised learning, predictions are made on
    new cases or new samples through observation and learning from historical cases.
    For example, a new sample (Plaintiff=Han Mouxu, Defendant=Fang Mouxu, Court=Nanjing
    Xuanwu District People''s Court, Cause=Unjust Enrichment, Date=June 7, 2020),
    the learning model predicts the output result of the new sample, i.e., the judgment
    result, win or lose. Machine learning predictions are based on hypothetical premises
    and historical data, assuming the judgment result is related to features such
    as plaintiff, defendant, court, cause of action, and time. The more features in
    the data space, the more perfect the hypothesis tends to be. Conversely, the fewer
    the features, the more the hypothesis lacks rationality. Therefore, from the perspective
    of the rationality of the judgment result, adding assumptions about case facts
    and evidence descriptions to case features makes the hypothesis more perfect.


    To simplify the model, court and time are extracted as features from the cases,
    with the horizontal axis `feature_1` as time and the vertical axis `feature_2`
    as court, as shown in the figure below. Each point represents a sample, containing
    two values corresponding to the values of the horizontal axis `feature_1` and
    vertical axis `feature_2` respectively. Circles represent positive class samples,
    squares represent negative class samples, and the diagonal line is the model or
    classifier learned from the samples in the figure. The hypothesis of the learning
    algorithm in Figure 2.3 is a linear classifier; the learning strategy is to find
    that specific classification diagonal line which maximizes the sum of squares
    of distances from all samples in the training set to the classifier. If the output
    of the learning model is no longer win or lose, but one of multiple categories.
    For example, the model output is legal domain, and the category label could be
    one of civil, criminal, administrative, or state compensation. In multi-class
    classification tasks, if the training set lacks administrative law sample data,
    the model cannot learn the features of samples belonging to administrative law.
    For a new sample to be predicted in the future, the learning model can only predict
    it as one of civil, criminal, or state compensation, while the manual label might
    be administrative law. In other words, the learning model learns latent patterns
    from training data and predicts future data by observing training data; therefore,
    features determining future data results must be represented in the training data.
    The ability of a learning algorithm or model to predict unknown data or future
    samples is called the model''s generalization ability. Evaluating model performance
    requires considering generalization ability and sample space adaptability; sample
    space capacity is related to the number of features, generally showing an exponential
    relationship. When the number of features is large, the sample space becomes extremely
    huge. In practice, the collected dataset is a sampling of the sample space; a
    learning model with strong generalization ability requires the dataset to represent
    the sample space well: not only must the training set reflect the distribution
    of samples in the space, but the test set must also follow the same distribution;
    only then will the learning model have good adaptability.


    ![](img/txt002_3.jpg "pagenumber_ebook=47,pagenumber_book=38")


    Figure 2.3 Binary Classification Supervised Learning Task


    In regression analysis tasks in supervised learning, the model input, i.e., sample
    features, are called explanatory variables (`Explanatory Variable`), and the learning
    model output is called the response variable (`Response Variable`). Regression
    learning tasks assume there exists a parameter-constrained relationship between
    the response variable and explanatory variables; through training set learning,
    the response variable is made to conform to the output of that relationship. The
    output target of regression learning is continuous values; for example, the learning
    model''s prediction result is the litigation amount involved in the case, as shown
    in Figure 2.4. The horizontal axis `feature_1` is the judgment date, the vertical
    axis `y` is the litigation amount; the learning model hypothesizes a linear relationship
    between litigation amount and judgment date; the learning strategy is to find
    that specific regression line which minimizes the mean square sum of the outputs
    of all samples in the training set on the regression line and the true outputs.
    From Figure 2.4, it can be seen that the training set data distribution seems
    to conform quite well to a linear relationship. In reality, the training set data
    distribution might exhibit other situations, such as Gaussian distribution or
    polynomial distribution, etc. Linear, polynomial, and Gaussian distributions have
    different parameters. Under the linear distribution assumption, the model''s learned
    parameters conform to the linear assumption. Under the polynomial distribution
    assumption, the model''s learned parameters conform to the polynomial distribution
    assumption. Under the Gaussian distribution assumption, the model''s learned parameters
    conform to the Gaussian distribution assumption. Therefore, machine learning algorithms
    are models learned on data; each algorithm has its advantages and limitations;
    there is no universal learning algorithm applicable to all datasets. If the training
    set data is not representative in the sample space, with data concentrated in
    a corner of the sample space, it is called data skew. In this case, data cleaning
    is needed, or re-collecting training data, or increasing the training set size.


    ![](img/txt002_4.jpg "pagenumber_ebook=48,pagenumber_book=39")


    Figure 2.4 Regression Supervised Learning Task


    After learning a model on the training set, extending the model to be applicable
    to the entire sample space is called fitting. Models with weak generalization
    ability are prone to under-fitting (`Under-fitting`) or over-fitting (`Over-fitting`).
    When model parameters are too few, complexity too low, or features too few, under-fitting
    occurs, as shown in Figure 2.5. As can be seen from the figure, the dataset has
    only feature `feature_1`, target output is `y`; if the regression algorithm is
    a linear model, the relationship between response variable `y` and explanatory
    variable `feature_1` can be described as `y=a*feature_1+b`. Where `a` and `b`
    are model parameters. Overall, the sum of deviations of points in Figure 2.5 to
    the fitted line is large, and the model''s generalization ability is poor. For
    under-fitting, if the model is adjusted to a polynomial regression relationship,
    all samples can be fitted to the curve; the polynomial model is more complex than
    the linear model and has more parameters. Without changing the model, increasing
    the number of features can also improve under-fitting. For example, adding court
    information as feature `feature_2` to the case dataset transitions the sample
    space from 2D to 3D; scattered points that cannot be fitted into a line in 2D
    space can be mapped onto the same plane in 3D space.


    ![](img/txt002_5.jpg "pagenumber_ebook=49,pagenumber_book=40")


    Figure 2.5 Under-fitting Phenomenon


    When model parameters are too many, complexity too high, or training data too
    few, over-fitting occurs, as shown in Figure 2.6. As seen in Figure 2.6, if the
    regression algorithm is a cubic polynomial model, the relationship between response
    variable `y` and explanatory variable `feature_1` can be described as `y=a*(feature_1)3+b*(feature_1)2+c*feature_1+d`.
    Where `a`, `b`, `c`, and `d` are model parameters. Overall, the points in the
    figure are almost all on the fitted curve, total deviation is close to zero, model
    generalization ability is also poor, because some points might be noise or errors.
    For over-fitting, model complexity needs to be reduced, parameters reduced; the
    cubic polynomial can be adjusted to a quadratic polynomial, i.e., `y=b*(feature_1)2+c*feature_1+d`.
    Increasing more training data so that the training dataset size exceeds model
    complexity; these methods can all improve model over-fitting.


    ![](img/txt002_6.jpg "pagenumber_ebook=50,pagenumber_book=41")


    Figure 2.6 Over-fitting Phenomenon


    Supervised learning training data has labels, while unsupervised learning samples
    have no labels. In many cases, data has no labels, because labels are determinations
    made by humans on events according to their nature. In Figure 2.7, court information
    in the sample space is used as feature `feature_1`, with the corresponding horizontal
    coordinate value being the distance of that court from Beijing. Compensation is
    used as feature `feature_2`, with the corresponding vertical coordinate value
    being the compensation amount. Obviously, there are two clusters, one located
    in the upper left of the figure, one in the lower right. Sample features can be
    understood as an observation; for example, observing a case heard at Beijing Chaoyang
    District People''s Court means the sample point appears on the left of the figure,
    and the left points are near the top of the figure. Observing another case heard
    at Chongqing Yuzhong District People''s Court means the sample point appears on
    the right of the figure, and the right points are near the bottom of the figure.
    Left points relate to the top, right points relate to the bottom; the reasons
    behind this may be deep; one can speculate that the level of economic development
    causes the sample points to exhibit a two-cluster distribution. Therefore, in
    the absence of response variables or target outputs, using unsupervised clustering
    learning algorithms can discover some internal associations in the data, thereby
    extracting useful information. In the absence of domain knowledge and expert experience,
    clustering algorithms are a very important data analysis method, helping people
    better understand data. For those familiar with Chinese economic geography, it
    is easy to know Beijing is a developed region, while Chongqing is relatively underdeveloped.
    However, for those unfamiliar with Chinese economic geography, they might not
    know the useful information reflected by this data. Through clustering learning,
    people can be helped to discover intrinsic structures from clusters, and learn
    that there are differences in economic development levels between Beijing and
    Chongqing.


    ![](img/txt002_7.jpg "pagenumber_ebook=51,pagenumber_book=42")


    Figure 2.7 Clustering Task


    In clusters produced by clustering algorithms, each cluster represents a group
    of sample points that are relatively similar or close on certain features, while
    sample points from different clusters have relatively large differences on these
    features. In Figure 2.7, the cluster in the upper left has smaller values on feature
    `feature_1` and larger values on feature `feature_2`. The cluster in the lower
    right has larger values on feature `feature_1` and smaller values on feature `feature_2`.
    From the clustering process, it can be found that the larger the values of feature
    `feature_1` and `feature_2`, i.e., the cluster appears in the upper right of the
    figure, the higher the proportion of economic factors in the case motives. The
    smaller the values of feature `feature_1` and `feature_2`, i.e., the cluster appears
    in the lower left of the figure, the lower the proportion of economic factors
    in the case motives.


    ## 2.4 Reinforcement Learning


    In supervised learning, sample outputs are classification or regression results.
    However, some learning strategies do not have obvious classification or regression
    results, e.g., chess playing behavior. Both players select the next action based
    on the board state, causing the board to transition to the next state. If the
    next state reduces opponent pieces by one or puts the opponent''s queen in danger,
    the action driving the state change receives a reward. The process of game playing
    is reinforcement learning, as shown in Figure 2.8. The Agent can interact with
    the Environment, causing the Environment State to transition; the environment
    transition feeds back a Reward to the Agent. The goal of reinforcement learning
    is to train a machine or agent to gradually improve system performance through
    effective learning strategies in interaction with the environment. It is generally
    considered that reinforcement learning is a supervised learning method, but different
    from real classification labels or response variables. The supervision information
    in machine learning is a reward strategy, guiding the agent to develop positively
    through rewards.


    ![](img/txt002_8.jpg "pagenumber_ebook=52,pagenumber_book=43")


    Figure 2.8 Reinforcement Learning


    Usually, a reward function evaluates the reward value obtained by an action; the
    larger the positive value, the stronger the positive incentive; the larger the
    negative value, the stronger the negative inhibition. After reinforcement learning,
    the agent makes the environment state continuously transition through exploratory
    trial and error, thereby maximizing the obtained reward. Each step action produces
    positive or negative rewards; positive rewards are considered closer to the final
    goal, while negative rewards are considered further from the goal.


    In the case sample space, if a sample is treated as an environment state, before
    the case judgment, the case state is in continuous transition; the agent is the
    abstract entity that can drive case state changes. For the plaintiff''s agent,
    the reinforcement learning goal is to apply a series of actions beneficial to
    the plaintiff on the case state; the maximum reward produced by these actions
    is the plaintiff winning the suit. For the defendant''s agent, the reinforcement
    learning goal is to apply a series of actions beneficial to the defendant on the
    case state; the maximum reward produced by these actions is the plaintiff losing
    the suit. For example, the current environment state is a case sample (Plaintiff=Liu
    Mouwu, Defendant=Sun Mouji, Court=Chongqing Yuzhong District People''s Court,
    Cause=IP Dispute, Date=Aug 25, 2016); assuming the plaintiff company is registered
    in Beijing, the defendant in Chongqing, the plaintiff agent''s action causes a
    case state transition, the next state involves a Beijing court hearing the case;
    according to the plaintiff agent''s reward function, the feedback received is
    a positive reward.


    In the reinforcement learning decision process, the agent knows every state `s`
    of the environment; the state space is `S`. In the current state, the action `a`
    executed by the agent causes the environment `E` to transition to the next state;
    the transition function `P` calculates the probability of transition from the
    current state to the next state; the action space is `A`. Simultaneously with
    the state transition, the reward function `R` feeds back a reward to the agent.
    Therefore, reinforcement learning is a quadruple `E:＜S，A，P，R＞`. Assuming a "familiarity"
    feature is added to the case sample space, the agent decides daily between going
    to court and not going to court. Going to court may increase the judge''s familiarity
    with the agent and cause favor, or may increase familiarity and cause disfavor.
    Not going to court may decrease the judge''s familiarity with the agent and cause
    favor, or may decrease familiarity and cause disfavor, as shown in Figure 2.9.


    ![](img/txt002_9.jpg "pagenumber_ebook=53,pagenumber_book=44")


    Figure 2.9 Decision Process of Going to Court


    In the decision process of going to court, there are four states: Familiar-Favor,
    Familiar-Disfavor, Unfamiliar-Favor, Unfamiliar-Disfavor. There are two actions:
    Go to Court and Not Go to Court. After each state transition, if the judge becomes
    familiar with the agent, the agent receives a reward of 10. If the judge feels
    unfamiliar with the agent, the agent receives a reward of -5. If the judge''s
    favor towards the agent increases, the agent receives a reward of 20. If the judge
    feels disfavor towards the agent, the agent receives a reward of -30. In Figure
    2.9, State Transition 1 can be described as: `a=Go to Court, p=0.7, r=10`; State
    Transition 2: `a=Not Go to Court, p=0.3, r=10`. State Transition 3: `a=Go to Court,
    p=0.6, r=5`; State Transition 4: `a=Not Go to Court, p=0.4, r=5`. State Transition
    5: `a=Go to Court, p=0.5, r=5`; State Transition 6: `a=Not Go to Court, p=0.5,
    r=5`. State Transition 7: `a=Go to Court, p=0.8, r=20`; State Transition 8: `a=Not
    Go to Court, p=0.2, r=-20`. State Transition 9: `a=Not Go to Court, p=0.5, r=-10`;
    State Transition 10: `a=Go to Court, p=0.5, r=10`. State Transition 11: `a=Go
    to Court, p=0.8, r=30`; State Transition 12: `a=Not Go to Court, p=0.2, r=-30`.
    State Transition 13: `a=Go to Court, p=0.7, r=-15`; State Transition 14: `a=Not
    Go to Court, p=0.3, r=-15`. State Transition 15: `a=Go to Court, p=0.3, r=5`;
    State Transition 16: `a=Not Go to Court, p=0.7, r=-5`. State Transition 17: `a=Go
    to Court, p=0.4, r=20`; State Transition 18: `a=Not Go to Court, p=0.6, r=-20`.
    State Transition 19: `a=Not Go to Court, p=0.7, r=15`; State Transition 20: `a=Go
    to Court, p=0.3, r=-15`.


    The supervision information in reinforcement learning is the reward the agent
    obtains from the environment; environment state transitions and feedback rewards
    are not entirely controlled by the agent; the agent perceives and understands
    the environment by executing actions and observing state transitions after action
    execution, thereby influencing the environment in action selection. The supervision
    mechanism of reinforcement learning differs from classification and regression
    tasks; the machine or training set does not directly instruct the agent on which
    operation to execute next, but rather continuously tries various possible actions
    to maximize the total reward value. The total reward value is the sum of rewards
    produced by each action; the agent cannot prospectively predict the total reward
    value, but can only consider the current environment state and select the action
    or operation expected to maximize the reward value. In fact, the reward value
    produced by a single-step action is not a deterministic value but follows a certain
    probability distribution; a few attempts cannot help the agent determine the expected
    action. Therefore, reinforcement learning is a supervised learning method of continuous
    interaction and trial-and-error with the environment.


    ## 2.5 Hypothesis Space


    Machine learning learns from samples; each sample is a concrete instance. In the
    case dataset, a sample contains values on features such as plaintiff, defendant,
    court, cause, and date; it is also a concrete instance and description of the
    abstract concept "case". In logic, induction and deduction are the most basic
    logical methods. The inductive method summarizes general laws from specific phenomena,
    e.g., observing winter and summer temperatures.


    Starting observation from July 1, observing continuously for 9 days, the highest
    temperatures are 35.5, 36.0, 35.0, 37.5, 36.5, 35.0, 38.0, 37.5, and 38.0 (all
    in Celsius), sample labels are all Summer. Starting observation from Dec 1, observing
    continuously for 9 days, the highest temperatures are 11.5, 12.0, 9.0, 8.5, 9.5,
    11.0, 10.0, 10.5, and 10.0 (all in Celsius), sample labels are all Winter. Using
    the above temperature observations as training dataset for learning, the classifier
    proposes some hypotheses: if highest temperature exceeds a threshold `a`, it is
    Summer; if highest temperature is below a threshold `b`, it is Winter. The hypothesis
    about summer''s highest temperature might be a set `a={36.0, 35.5, 35.0, 34.5,
    34.0, 33.5, 33.0, 32.5, 32, 31.5, 31.0, 30.5, 30.0, ...}`. The hypothesis about
    winter''s highest temperature might be a set `b={11.0, 11.5, 12.0, 12.5, 13.0,
    13.5, 14.0, 14.5, 15.0, 15.5, 16.0, 16.5, 17.0, ...}`. These hypotheses constitute
    a hypothesis space; the classifier searches from these hypothesis spaces to find
    those hypotheses that match or fit the training set data.


    Obviously, in hypothesis space `a`, highest temperatures of 36.0 and 35.5 Celsius
    cannot match the 9-day continuous observation data; after excluding hypotheses
    not matching the training set, the hypothesis space becomes `{35.0, 34.5, 34.0,
    33.5, 33.0, 32.5, 32, 31.5, 31.0, 30.5, 30.0, ...}`. In hypothesis space `b`,
    highest temperatures of 11.0 and 11.5 Celsius cannot match the 9-day continuous
    observation data; after excluding hypotheses not matching the training set, the
    hypothesis space becomes `{12.0, 12.5, 13.0, 13.5, 14.0, 14.5, 15.0, 15.5, 16.0,
    16.5, 17.0, ...}`. The larger the training set data scale, the more hypotheses
    are excluded, and the more accurate the model learned by the classifier.


    In regression learning tasks, the input feature is `feature_1`, output is response
    variable `y`, as shown in Figure 2.10. For example, the learning goal is to find
    the relationship between compensation amount in economic compensation cases and
    regional development level; feature `feature_1` is the quantified value of the
    region, output `y` is the compensation amount. For the learning model''s hypothesis,
    a linear relationship hypothesis can be proposed, or a univariate quadratic relationship
    hypothesis. The two points in the figure represent two training samples; assuming
    the output-input relationship conforms to a linear relationship `y=a*feature_1+b`,
    `a` and `b` are parameters; solving an equation with two parameters requires two
    sample points. Therefore, the linear relationship hypothesis can perfectly fit
    the two sample points. Assuming the output-input relationship conforms to a univariate
    quadratic relationship `y=a*(feature_1)2+b*feature_1+c`, parameters include `a`,
    `b`, and `c`; using two sample points to solve an equation with three parameters
    will produce two constrained variables and one free variable. Therefore, many
    univariate quadratic polynomial hypotheses can also perfectly fit these two sample
    points.


    ![](img/txt002_10.jpg "pagenumber_ebook=55,pagenumber_book=46")


    Figure 2.10 Perfect Fit of Linear and Quadratic Regression Hypotheses


