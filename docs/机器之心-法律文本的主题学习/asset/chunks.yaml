    # 6.4 封装器特征选择


    ## 6.4.1 基于特征抽取的启发式封装器模型


    从某种角度来说，特征选择过程实际上是从特征空间集合搜索特征子集的过程。在法律文本处理中，很多特征存在各种相关性，比如词语“合同”与“违约”就存在很大相关性。法律文本数据具有高维特点，如果从所有词语构成的特征空间进行完全搜索，空间复杂度和时间复杂度将会非常大，实用意义不大。在求解问题时，往往很难达到最优解，在这种情况下，可以退而求其次，寻求次优解。贪心算法就是通过初始解出发，根据某个优化准则，一步一步地求取局部最优解。每次只考虑子问题，通过局部最优解，实现整体的次优解。启发式方法根据贪心思想，从特征子集为空集开始，每次选择一个使得特征评价函数最优的特征加入，直到某个评价函数到达阈值。评价函数描述选取的特征子集优劣程度的一个测度，根据不同的评价目标，评价函数的选择会有所不同。例如，有的评价函数根据数据集分布是否均衡进行设计，有的评价函数依据机器学习模型的分类性能进行评估，所以要综合考虑数据集的内在特征和学习模型等应用场景。如果根据数据集内在结构特性，利用其内在特征评价函数，将特征选择作为一个数据预处理阶段，并且独立于学习模型和算法，这种称为过滤器模型。在前文中使用的评价函数独立于分类结果，就是过滤器模型。如果根据机器学习模型的分类结果来验证数据集的选取是否合适，分类结果评估依赖于学习算法和数据集的选取，固定学习算法，可以通过分类结果来评估特征子集的好坏，这种称为封装器模型。


    封装器模型采用的是关联性原则，处理过程如图6.8所示。封装器模型根据特征选择方法选取一个特征子集，然后将该特征子集输入到学习算法，计算学习算法的分类性能，以分类性能的优劣作为评价特征子集的好坏的标准。将分类精度满足目标的那个特征子集作为最终特征子集，很显然，同样的数据集在不同的分类算法上的分类精度是不一样的。因此，用封装器模型选择特征子集与学习算法有关。在搜索特征空间时，对于是否继续产生下一个特征子集，需要考虑停止准则。对于不同的评价函数，停止准则也不一样。停止搜索条件可设为一个阈值，如果评价函数的数值达到这个阈值后，就不再产生新的特征子集。例如，过滤器的停止条件可以是按照样本平均覆盖原则，选取平均间距最大的特征组合。封装器的停止条件可以是在验证集上返回最高准确率的特征子集。数据集可以分为训练集、验证集和测试集：首先，用训练集的特征子集训练学习算法参数，在验证集上计算学习算法分类性能。然后，根据验证集上的最好分类性能选取特征子集。最后，用测试数据来检验特征子集选取的有效性。训练集、验证集和测试集的划分要避免数据耦合和重叠。可以将上述的过滤器和封装器方法组合起来使用，例如，在结合准确率、召回率和F1度量情况下，采用启发式特征搜索方法。


    ![图6.8 封装器原理](images/txt006_55.jpg "pagenumber_ebook=173,pagenumber_book=164")


    特征抽取方法将高维的原始空间映射到低维的特征子集空间。主成分分析方法是一种坐标变换方法，可以去除冗余特征。具体特征变换过程中，去掉较小的特征值，从而达到去噪、去除相关性和特征减少的目的。小波也是一种特征空间变换的方法，相较于傅立叶变换，小波变换能更好地适应剧烈的变换。


