    \n![](images/txt001_14.jpg \"pagenumber_ebook=34,pagenumber_book=25\")\n\n有些网站的数据更新来自数据库，这些不同网页的超链接url只是在后缀部分不同。网站应用服务器用后缀来作为ID匹配后台数据库记录，使用迭代器自动更新ID，对符合这种结构的网页进行遍历访问。\n\
