    按照式 (7.3)和式 (7.4)进行吉布斯采样，对第`m`篇文本的第`i`词位置的词语`wi`的潜在主题标记为`zm,i`，根据后验分布和伪计数进行概率参数估计:


    ![](images/txt007_53.jpg "pagenumber_ebook=205,pagenumber_book=196")


    ![](images/txt007_54.jpg "pagenumber_ebook=205,pagenumber_book=196")为在第`m`篇文本中编号为`k`的主题之下的词计数，第`m`篇文本的所有词语数记为`Nm`。根据式
    (7.5)可以生成文本到主题分布矩阵![](images/txt007_55.jpg "pagenumber_ebook=205,pagenumber_book=196")


    ![](images/txt007_56.jpg "pagenumber_ebook=205,pagenumber_book=196")


    ![](images/txt007_57.jpg "pagenumber_ebook=205,pagenumber_book=196")为在编号为`k`的主题之下的词语`w`的统计数，编号为`k`的主题下的所有词语数记为`Nk`。根据式
