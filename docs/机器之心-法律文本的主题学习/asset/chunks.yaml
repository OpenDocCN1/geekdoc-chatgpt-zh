    ## 4.3 Latent Semantic Analysis and Topic Models


    To address the problem of user topic analysis, `LSA` (`Latent Semantic Analysis`)
    establishes semantic connections between topic-based texts and words through matrix
    factorization methods in algebra. It is an unsupervised learning latent semantic
    analysis method, also known as `LSI` (`Latent Semantic Indexing`), i.e., Latent
    Semantic Indexing. The `LSA` method proposed by `Deerwester` can generate a contextual
    abstract intermediate layer between global objects and individual objects in fields
    such as information retrieval, text recommendation, and image processing. Therefore,
    it has a wide range of application backgrounds in scenarios such as content recommendation,
    topic tracking, evidence cross-examination, social trajectories, text classification,
    and topic clustering.


    In the field of judicial practice, judicial information content service providers
    offer existing court judgments, rulings, arbitration awards, and other relevant
    judicial documents, and can provide users with customized case retrieval, matching,
    and recommendation. They provide pre-litigation legal consultation opinions and
    in-litigation lawyer defense strategies for parties, and adjudication references
    for judges during sentencing.


    In the field of judicial data management and information processing, the pressing
    problem is the need to establish a unified judicial information data resource.
    In China''s legal practice, referencing existing similar precedents is a recognized
    approach. Although case law is not a statutory norm in China''s legal system,
    historical precedents can both avoid and restrict the abuse of judges'' discretionary
    power, and maintain and embody the continuity and authority of the law. At the
    same time, the guiding nature of precedents effectively reduces unnecessary judicial
    resource expenditure. Establishing a unified and reliable whole-process judicial
    data resource must center on the trial, connecting data and legal texts formed
    by tasks at various stages including pre-trial, in-trial, and enforcement, strengthening
    the ability and role of adjudicative power, supervisory power, and enforcement
    power to mutually restrict and cooperate. The guiding nature of precedents is
    not only reflected in similar word matching but, more importantly, in the matching
    of legal principles and spirit. By analyzing words, sentences, paragraphs, and
    chapters in legal texts, the implicit legal principles and methods are discovered
    and extended to a wider scope to serve more citizens and users. In other words,
    case guidance actually refers to the applicability of the legal spirit embodied
    in the precedent. It can be considered that there exists an intermediate abstract
    layer related to legal principles and methods between legal texts and words, termed
    "legal principle topics," which may also include some non-legal principle topics
    related to daily life. When a judge writes a legal text, a mind trained in legal
    thinking first considers applying a certain legal topic; after determining the
    legal topic, words under that topic are retrieved from the legal knowledge repository.
    The completion of a legal text is the result of the comprehensive application
    of legal topics. Promoting intellectual achievements as experience can be done
    manually when the quantity is small. However, for mining legal principles and
    methods from a large volume of legal texts, computer and natural language processing
    tools are needed, utilizing latent semantic analysis methods to establish legal
    semantic connections between legal texts and words.


    `LDA` (`Latent Dirichlet Allocation`) proposed by `Blei` is also an unsupervised
    learning topic model, called Latent Dirichlet Allocation. Through the `Dirichlet`
    distribution in probability theory, `LDA` establishes a topic generation model
    between texts and words. The generative model corresponds to the discriminative
    model. The discriminative model classifies input text; if the probability is greater
    than `0.5`, it is classified as the positive class. The generative model, however,
    needs to learn the positive class model and negative class model separately, then
    place the input text into both models; the model with the higher probability is
    the output result. To consider correlation issues between different topics, the
    Dirichlet distribution is adjusted to a logistic normal distribution. Traditional
    time-series data modeling mainly handles continuous data; dynamic topic models
    track and examine sequentially changing texts, using state space models on top
    of the underlying topic model to capture the topic evolution process of sequential
    corpora. The assumption of probabilistic topic models is Bayesian estimation theory;
    the prior distribution considers equal contribution from each word. In legal texts,
    each word has different capabilities for describing and characterizing the text;
    it is necessary to distinguish the contribution of each word to the text. Weighting
    certain keywords can enhance the role and status of important words in legal topics.
    Topic models can also be combined with other linear models to comprehensively
    consider word distribution and topic distribution to calculate text similarity.


    Both `LSA` and `LDA` belong to unsupervised learning topic models; texts have
    no category label information. `LSA` represents text as the product of three matrices:
    the first matrix is the topic description of `M` documents, the second matrix
    is the eigenvalues of `K` topics, and the third matrix is the word representation
    of `K` topics. For example, a document''s topic description is `[0.5, 0.2, 0.3]`,
    the eigenvalues of three topics are `[3, 4, 5]`, assuming the vocabulary size
    is `9`, the word representations on the three topics are `[0.2, 0.2, 0.2, 0.1,
    0.1, 0.1, 0.03, 0.03, 0.04]`, `[0.1, 0.1, 0.1, 0.2, 0.2, 0.2, 0.03, 0.03, 0.04]`,
    and `[0.1, 0.1, 0.1, 0.03, 0.03, 0.04, 0.2, 0.2, 0.2]` respectively. The text
    generation process starts by multiplying the topic description `[0.5, 0.2, 0.3]`
    by the corresponding eigenvalues `[3, 4, 5]`, resulting in `[1.5, 0.8, 1.5]`.
    Taking the first value from the word representations of the three topics forms
    the semantic distribution of the first dictionary word across topics, i.e., `[0.2,
    0.2, 0.1]`, then dot-multiplying with `[1.5, 0.8, 1.5]` yields the value `0.61`.
    This value is the quantized representation of the first dictionary word in this
    document. By analogy, the word distribution of this document is generated as `[0.61,
    0.61, 0.61, 0.355, 0.355, 0.37, 0.369, 0.369, 0.392]`. It can be preliminarily
    judged that the document content is mainly about Topic 1, and the first three
    words in Topic 1''s word distribution have larger proportions. Therefore, in the
    generated text, the word counts for the top three vocabulary words are relatively
    higher.


    `LDA` represents the text generation process as a process of multiple independent
    repeated experiments from document to topic and from topic to word. The probability
    of generating a word each time follows a certain probability model; the complete
    text generation is inevitably the model and its parameters that maximize the text
    generation probability. `LDA` treats the prior distribution of words identically,
    establishing models to discover topics and abstract layer semantics from the perspective
    of corpus and word statistical laws. However, if texts possess labels formed by
    the rich experience of human experts, abandoning the use of this supervised information
    would be a waste of valuable experience and resources. For example, judges categorize
    and organize precedents, lawyers cite precedents in defense opinions, and legal
    scholars comment on the jurisprudence of precedents, etc. Labeled data needs to
    be authentic and valid; otherwise, it will increase model computational error
    and reduce model quality. Sometimes this authentic and valid supervised information
    labeling is called `Groundtruth`. `LDA` does not require supervised information;
    the model output is topic distribution. Treating the topic distribution as a point
    in space, `LDA` can achieve text clustering and the formation of word clusters
    for the same topic. If classifying the legal domain to which a legal text belongs,
    the labeled legal domain is the supervised information. Based on the `LDA` model
    assumptions, `Blei` proposed Supervised Latent Dirichlet Allocation (`SLDA`).
    According to labeled supervised information, the probability calculation method
    of topic distribution is adjusted so that supervised information participates
    in the joint probability distribution calculation inference during the generation
    process from topic to word, establishing a latent semantic topic model capable
    of predicting the legal domain to which a legal text belongs.


    ## 4.4 Bayesian Theory


    ### 4.4.1 Bayes'' Theorem


    Probabilistic reasoning is a method for studying uncertain information and making
    decisions. Bayesian reasoning calculates posterior probabilities based on conditional
    probabilities and prior probabilities. According to the Bayesian assumption, all
    legal domains to which legal texts belong constitute an exhaustive event group,
    i.e., classification labels, denoted as `ci`, representing the `i`-th class in
    the category. The set composed of all class labels is `C`, with a set size of
    `|C|`. Different classification labels are mutually exclusive; for example, a
    legal text belonging to civil law cannot belong to criminal law. The sum of prior
    probabilities of all classes is 1:


    ![](img/txt004_11.jpg "pagenumber_ebook=117,pagenumber_book=108")


    The input sample `x` is actually the observed event or phenomenon in the experiment,
    and its probability `p(x)` is the evidence factor. For a specific sample `x`,
    `p(x)` is independent of the class prior probability `p(c)`. `p(x|c)` is the probability
    of observing phenomenon `x` in class `c`, called the conditional probability of
    sample `x` in class `c`, also known as the likelihood. `p(c|x)` is called the
    posterior probability, meaning the probability of judging it as class `c` given
    the observed evidence `x`.


    General prediction models give a predicted output `h(x)` for input `x`. The loss
    function is defined as the error between the true label `y` and `h(x)`. The error
    is fed back to the prediction model to adjust model parameters and further reduce
    training error. Based on the posterior probability `p(c|x)`, the cumulative expected
    loss of misclassification error can be calculated. If the expected loss of the
    training set is to be minimized, the prediction model must be able to select the
    class with the maximum posterior probability as the output. There are two main
    methods and strategies for estimating posterior probabilities through limited
    sample data. One is to directly establish a hypothesis function `h(x)` for the
    input sample `x`, using the output of `h(x)` as the prediction result, called
    a discriminative model. The other is to calculate the posterior probability `p(c|x)`
    through the joint probability distribution `p(x, c)` and Bayes'' formula:


    ![](img/txt004_12.jpg "pagenumber_ebook=118,pagenumber_book=109")


    If the training set data is obtained by sampling from the sample space in an independent
    and identically distributed (i.i.d.) manner, the proportion of class `c` in the
    training set can be used to estimate the prior probability `p(c)`. When the sample
    size of the dataset is very large, the frequency of sample occurrence can approximate
    the sample probability. If the conditional probability `p(x|c)` in Bayes'' formula
    is estimated using the occurrence frequency of sample `x`, a difficult situation
    will arise. For example, assuming the sample has `100` features, each feature
    taking a binary value, the entire sample space is `2¹⁰⁰`. This is an unimaginably
    near-infinite number, meaning many samples simply will not appear in the training
    set. If conditional probability is estimated using sample occurrence frequency,
    the probability would be zero, which is obviously unreasonable. Therefore, under
    the premise that relationships between features are independent and uncorrelated,
    the estimation of conditional probability `p(x|c)` uses the joint probability
    of all features or attributes of sample `x`, where `xj` is the `j`-th feature:


    ![](img/txt004_13.jpg "pagenumber_ebook=118,pagenumber_book=109")


    ### 4.4.2 Maximum Likelihood Estimation


    Generally, it is assumed that the conditional probability `p(x|c)` has a certain
    determined form of probability distribution, but the parameters of the distribution
    are unknown, and then they are estimated using training set data. For example,
    in a binary classification task, it can be assumed that all positive samples follow
    a certain normal distribution with parameter `θ1`, and all negative samples follow
    a certain normal distribution with parameter `θ2`. The parameters of the normal
    distribution involve mean and variance. `p(x|θ1)` is the positive class conditional
    probability with parameter `θ1`, and `p(x|θ2)` is the negative class conditional
    probability with parameter `θ2`. Bringing the samples from the training set `D`
    into the conditional probability expression, which contains parameters, and then
    solving for the parameters through certain derivation rules. Essentially, the
    learning process of a probabilistic model is parameter estimation.


    There are two different views on the parameters of a probability distribution.
    One view holds that although the parameters are unknown, they are not variables
    but fixed values that already exist, and can be obtained through certain derivation
    criteria. The other view holds that the parameters themselves can follow another
    prior distribution, rather than being fixed values; they are random variables,
    and the posterior distribution of the parameters is inferred through observed
    data samples. The frequentist school adopts the former view, while the Bayesian
    school agrees with the latter.


    According to the frequentist view, `MLE` (`Maximum Likelihood Estimation`) estimates
    the parameters of the probability distribution through data, called Maximum Likelihood
    Estimation. The conditional probability or likelihood of positive samples is `p(x|θ1)`.
    The dataset composed of all positive samples is `D1`. Assuming each positive sample
    is i.i.d., the likelihood function of parameter `θ1` observed on dataset `D1`
    is:


    ![](img/txt004_14.jpg "pagenumber_ebook=119,pagenumber_book=110")


    The above formula is the generation probability of the observed dataset `D1` under
    unknown parameter `θ1`. Since dataset `D1` is an objective existing fact, its
    probability must be the maximum. Therefore, maximum likelihood estimation seeks
    the parameter value `![](img/txt004_15.jpg "pagenumber_ebook=119,pagenumber_book=110")`
    that maximizes the likelihood function `p(D1|θ1)` as the estimate. In fact, among
    all possible values of `θ1`, there must be one that maximizes the probability
    of dataset `D1` appearing. The same method applies to the negative class. The
    likelihood function of parameter `θ2` observed on the negative class dataset `D2`
    is:


    ![](img/txt004_16.jpg "pagenumber_ebook=119,pagenumber_book=110")


    The conditional probability or likelihood of each sample is less than `1`, and
    continuous multiplication will produce an underflow phenomenon with results approximating
    `0`. Therefore, in practical applications, the log-likelihood (`Log-Likelihood`)
    function is generally used:


    ![](img/txt004_17.jpg "pagenumber_ebook=119,pagenumber_book=110")


    The parameter estimation for the positive class sample distribution `θ1` is:


    ![](img/txt004_18.jpg "pagenumber_ebook=119,pagenumber_book=110")


    The parameter estimation for the negative class sample distribution `θ2` is:


    ![](img/txt004_19.jpg "pagenumber_ebook=119,pagenumber_book=110")


    In the above formula, `![](img/txt004_20.jpg "pagenumber_ebook=119,pagenumber_book=110")`
    denotes assigning a value to parameter `θ1` that maximizes the value of the following
    expression. The positive class normal distribution parameter `θ1` includes mean
    `μ1` and variance `![](img/txt004_21.jpg "pagenumber_ebook=119,pagenumber_book=110")`,
    and its conditional probability density function is:


    ![](img/txt004_22.jpg "pagenumber_ebook=120,pagenumber_book=111")


    The maximum likelihood estimates for the positive class distribution parameters
    `μ1` and `![](img/txt004_23.jpg "pagenumber_ebook=120,pagenumber_book=111")` are:


    ![](img/txt004_24.jpg "pagenumber_ebook=120,pagenumber_book=111")


    The maximum likelihood estimates for the negative class distribution parameters
    `μ2` and `![](img/txt004_25.jpg "pagenumber_ebook=120,pagenumber_book=111")` are:


    ![](img/txt004_26.jpg "pagenumber_ebook=120,pagenumber_book=111")


    It can be seen that the mean and variance of the normal distribution''s maximum
