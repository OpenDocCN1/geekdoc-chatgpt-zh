    with 1,103 rows and 1,154 columns. The `LDA` module is imported from `slda.topic_models`,
    and the `LDA` parameters are initialized. `K` is the number of topics. China''s
    main legal fields generally number around 10, with sub-fields numbering in the
    dozens. Based on experience, `K` is set to 15. `alpha` is the parameter representing
    a legal text as a topic multinomial distribution, set to 1. `beta` is the parameter
    representing a topic as a word multinomial distribution, set to 0.01. `V` is the
    vocabulary size, i.e., the number of columns in the legal terminology feature
    vector matrix. As shown in Figure 7.31:


    ![](img/txt007_61.jpg "pagenumber_ebook=206,pagenumber_book=197")


