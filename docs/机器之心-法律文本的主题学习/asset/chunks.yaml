    `attrib` 为包含节点所有属性和属性值的字典，对属性的操作与字典操作相一致，方法 `keys()` 返回所有的属性名称，方法 `items()` 返回所有的属性和属性值的键值列表，`del`
    删除由键名指定的属性。如图 5.16 所示：


    ![](images/txt005_16.jpg "pagenumber_ebook=135,pagenumber_book=126")


