    自顶向下生成树方法根据定义的规则，生成树从树根向下生长，最后直到组成句子的叶结点的生成。首先使用规则 1 建立树根`s`和中间节点`dp1`、`vp`，然后根据规则推导，使用规则
    2 和规则 3 来替换中间节点，最后使用规则 4 替换由规则 3 产生的中间节点`dp2`，直到对应词语的全部叶子生成。


