    \n# Chapter 1 Introduction\n\nComputer scientists and data engineers have been\
    \ conducting research in related fields such as Natural Language Processing (`NLP`)\
    \ and Machine Learning (`ML`) for over twenty years. Today, NLP and ML tools are\
    \ ubiquitous in applications, for example: search engines that help users better\
    \ understand their own needs, customer service robots that can accurately locate\
    \ user problems, and navigation voice assistants that enable safe driving. When\
    \ a user enters a question in the search box of an intelligent search engine,\
    \ this question is parsed by NLP tools, transforming it from a human-understandable\
    \ sentence into a machine-understandable query, so that the search engine can\
    \ interpret and respond to it. Machine learning of language is no different from\
    \ humans learning language in childhood: first learning simple sentences and phrases,\
    \ then complex sentences and paragraphs. Data engineers continuously feed data\
    \ into the system, and based on the evaluation of results, conduct repeated experiments\
    \ and attempts. A typical application in the iPhone is `Siri`, which is programmed\
    \ to correctly understand user inquiries and respond accordingly, requiring learning\
    \ from a large amount of daily speech material. Machine learning tools can think\
    \ about problems like humans, training programs from big data, with the purpose\
    \ of enabling programs to interpret hidden patterns in data, thereby achieving\
    \ autonomous learning.\n\n"
