- raw: "![](images/txt004_38.jpg \"pagenumber_ebook=124,pagenumber_book=115\")\n\n\
    beta分布的后验分布和先验分布具有相同的形式，这种称为共轭分布，并且后验分布的数学期望和方差可以很简单地通过计数来获得:\n\n![](images/txt004_39.jpg\
    \ \"pagenumber_ebook=124,pagenumber_book=115\")\n\nDirichlet分布是多项分布的共轭分布，是多项分布的参数(θ1，\
    \ θ2，…，θk，…，θK)的概率分布，也是 beta分布在多元变量上的推广。beta分布是［0，1］上的连续分布，其参数α和β改变分布的形状，因此，也称为形状参数。在贝叶斯推理中，beta分布作为二项分布的先验概率分布。Dirichlet分布是［0，1］上连续多元概率分布，其参数(α1，α2，…，αk，…，αK)将多项分布形状控制在一个范围。在贝叶斯推理中，Dirichlet分布一般作为多项分布的共轭先验概率分布。在投掷骰子的例子中，第k面朝上的先验概率θk可以通过Dirichlet分布的随机事件XK的期望进行估计:\n\
    \n![](images/txt004_40.jpg \"pagenumber_ebook=125,pagenumber_book=116\")\n\n\uFEFF\
    \n\n第5章　法律文本预处理\n\n5.1　正则表达式\n\n5.1.1　正则表达式作用\n\n在进行数据预处理和低质量数据清洗时，正则表达式 (Regular\
    \ Expression，Regex)可以用来进行一些字符串操作。正则表达式是一种规则匹配模式，在文本信息处理中经常被用来进行字符串的查找和替换。通过预先定义好的特殊符号以及其组合，描述具有某种特征的系列字符串。\n\
    \n正则表达式的应用场景包括模式匹配和捕获数据。模式匹配是指对于给定的输入字符串是否符合正则表达式的匹配逻辑。例如，判断一个注册用户输入的密码是否符合密码复杂性要求，要求密码字符串包括大小写字母、数字和一定的长度，等等。正则表达式需要有一些特殊符号表示英文大写，一些特殊符号表示英文小写，一些特殊符号表示数字，一些特殊符号表示可以重复的次数。捕获数据是指从特定输入的字符串中返回符合正则表达式的用户需要的特定部分。例如，从登记的身份证号码中返回此人的年龄，年龄是当前年份减去出生日期中年份，身份证号码的出生年份可以用正则表达式返回。\n\
    \n5.1.2　基础正则表达式\n\n一般来说，正则表达式可以匹配字符，也可以匹配位置。正则表达式匹配模式可以模糊表达一些字符串，例如，字符串的长度不是固定的，使用正则表达式“Regex:wil{1，3}”，表示l出现1～3次。当匹配到某个具体字符时，正则表达式使用字符组来表示多种可能的字符。例如，“Regex:m［ae］n”表示“［ae］”中有1个字符出现，可以匹配单词“man”和“men”。如果字符组中的字符非常多，可以使用连字符简写，例如，表示一个小写字母为“Regex:［az］”，表示一个大写字母为“Regex:［A-Z］”，表示一个数字为“Regex:［0-9］”。符号“-”具有特殊含义，表示起止范围，相对于“aA\
    \ z Z09”这类普通字符，“-”称为元字符。如果要表示符号“-”本身，需要用一个转义符号“ \\\\”放到前面，即“ \\\\-”。\n\n一个位置上的模糊匹配的另一种情况，不能是某个不确定的符号。例如，“Regex:c［^cu］u”可以模糊表示“cau，cbu，cdu，…，ctu，cvu”等这些字符串，但是就不能表示“ccu”和“cuu”。字符组的第一位是“^”，是指取反含义，表明可以匹配除了“cu”之外的任意一个字符。根据转义符号，一些缩写形式可以表示一定范围和类型的字符。“Regex:\\\
    \\d”是“Regex:［0-9］”的缩写形式，表示任意一个数字字符。“Regex:\\\\d+”表示匹配超过1个的多个数字，“Regex:\\\\d?”表示匹配不超过1个的数字，“Regex:\\\
    \\d\\*”表示匹配0到任意个的数字。“Regex:\\\\D”是“Regex:［^0-9］”的缩写形式，表示任意一个非数字字符。“Regex:\\\\\
    w”是“Regex:［0-9a-zA-Z］”的缩写形式，表示任意一个数字、小写字母和大写字母这类单词字符。“Regex:\\\\W”是“Regex:［^0-9a-zA-Z］”的缩写形式，表示任意一个非单词字符。“Regex:\\\
    \\s”是“Regex:［\\\\t\\\\r\\\\n\\\\v\\\\f］”的缩写形式，表示任意一个空白字符，包括制表符、换行符、回车符、换页符等。“Regex:\\\
    \\S”是“Regex:［^\\\\t\\\\r\\\\n\\\\v\\\\f］”的缩写形式，表示任意一个非空白字符。\n\n匹配任意字符可以使用 “［\\\
    \\d\\\\D］”“［\\\\w\\\\W］”和“［\\\\s\\\\S］”其中之一。“Regex:of{1，}”表示f至少出现1次，“Regex:of{2，2}”表示f出现2次。“Regex:of?”相当于“Regex:of{0，1}”，表示f出现或者不出现，“Regex:of+”相当于“Regex:of{1，}”，“Regex:of\\\
    *”相当于“Regex:of{0，}”，表示f出现任意次，或者不出现。正则表达式“Regex:.”匹配任意一个字符，“Regex:^”匹配字符串开始，“Regex:$”匹配字符串结束，“Regex:\\\
    \\b”匹配字符边界，“Regex:\\\\B”匹配非字符边界。\n\n5.1.3　正则表达式应用\n\nPython的re模块功能是通过正则表达式匹配字符串或捕获字符串，可以通过import导入该模块。对于字符串“The\
    \ policeman arrested 536 suspects.Some of them were set free after 36 days.Goodman\
    \ is a company，not a man.”。分别使用表达式 “re.findall(＇\\\\w+＇，text) ” “re.findall(＇\\\
    \\d+＇，text) ” “re.findall(＇［^\\\\d\\\\s］\\\\w+＇，text)”获得所有单词、数字单词、非数字单词，如图 5.1所示:\n\
    \n![](images/txt005_1.jpg \"pagenumber_ebook=128,pagenumber_book=119\")\n\n图5.1　正则表达式匹配单词\n\
    \n如果需要捕获符号匹配模式的子字符串中的一部分字符，可以使用括号捕获部分字符。例如，在上述字符串中查询含有字符“s”和“e”的单词，使用正则表达式为“re.findall(r＇\\\
    \\w\\*［sS］\\\\w\\*e\\\\w\\*＇，text) ”。对于需要查询这些单词中的“s”和“e”之间有哪些字符，可以使用含有括号的正则表达式为“re.findall(r＇［sS］(\\\
    \\w\\*)e＇，text) ”。通过引用可以查询字符串中的字符重复，例如，正则表达式“re.findall(r＇((\\\\w)\\\\2{1，}) ＇，text)\
    \ ”中的“\\\\2”表示引用第二括号中的内容，即“\\\\w”。括号中含有符号“|”表示管道模式或者分支选择，例如，需要查询哪些单词包括子字符串“man”或者“rest”，可以使用正则表达式\
    \ “re.findall(r＇(\\\\w\\*man\\\\w\\*|\\\\w\\*rest\\\\w\\*) ＇，text) ”。如图5.2所示:\n\
    \n![](images/txt005_2.jpg \"pagenumber_ebook=128,pagenumber_book=119\")\n\n图5.2　正则表达式捕获单词\n\
    \n分别使用表达式 “re.findall(r＇^(\\\\w+) ＇，text) ”和 “re.findall(r＇(\\\\w+)\\\\.$＇，text)”获得字符串第一个单词和最后一个单词。分别使用表达式“re.findall(r＇^\\\
    \\b(.\\*?\\\\ .) ＇，text) ”和 “re.findall(r＇\\\\ .\\\\s\\*(.{1，35}　\\\\.)(?=$)＇，text)”获得字符串第一个句子和最后一个句子。\n\
    \n从图5.3中可以看出，表达式 “re.findall(r＇^\\\\b(.\\*\\\\.) ＇，text) ”从字符串开始处匹配，到第一句结束是满足表达式模式的，到第二句结束也是满足表达式模式的，甚至到第三句结束还是满足表达式模式的，返回的是能够匹配最多字符串的情况，这种模式称为贪婪模式。在中间插入一个\
    \ “?”就改变为非贪婪模式，表达式为 “re.findall(r＇^\\\\b(.\\*?\\\\.) ＇，text) ”，返回的是能够匹配模式的最小字符串的情况，即匹配的是第一句。贪婪模式和非贪婪模式如图5.4\
    \ 所示:\n\n![](images/txt005_3.jpg \"pagenumber_ebook=129,pagenumber_book=120\"\
    )\n\n图5.3　正则表达式匹配句子\n\n![](images/txt005_4.jpg \"pagenumber_ebook=129,pagenumber_book=120\"\
    )\n\n图5.4　贪婪模式和非贪婪模式\n\n正则表达式可以查询某个位置。例如，上述字符串找到“man”位置，在前面插入 “#”，正则表达式为 “re.sub(r＇(?=man)\
    \ ＇，＇#＇，text) ”。这属于肯定向前查找，查找符合模式定义之前的位置。与此相反，肯定向后查找是匹配符合模式定义之后的位置，正则表达式为 “re.sub(r＇(?\
    \ ＜=\\\\d)\\\\s＇，＇%＇，text)”，将数字后面的空格替换为百分号。否定向前查找匹配不符合模式定义之前的位置，正则表达式为“re.findall(r＇an(?!y)＇，text)”，将匹配后面不是“y”的“an”。否定向后查找匹配不符合模式定义之后的位置，正则表达式为“re.findall(r＇(?\
    \ ＜!police)man＇，text) ”，将匹配前面不是 “police”的“man”。如图 5.5所示:\n\n![](images/txt005_5.jpg\
    \ \"pagenumber_ebook=130,pagenumber_book=121\")\n\n图5.5　前向和后向匹配\n\n模块re的函数match()、search()、findall()和sub()都可以进行正则表达式的匹配，包括一些可选参数。match()只从字符串起始位置开始匹配，如果第一个字符不符合匹配模式，函数返回空。search()可以从字符串任何位置开始匹配，只要找到匹配模式函数开始返回结果，相当于一种非贪婪模式。findall()尽可能地找到字符串中所有可能的匹配，属于一种贪婪模式，除非在正则表达式中进行指定。\n\
    \n![](images/txt005_6.jpg \"pagenumber_ebook=130,pagenumber_book=121\")\n\n图5.6　函数match、search和findall的区别\n\
    \n模块re的函数通过一些可选参数或者修饰符控制正则表达式的模式匹配，包括re.S、re.M、re.I和re.U等，多个修饰符可以用逻辑或运算符号“|”来连接。re.S指定元符号“.”匹配单个任意符号时，可以扩展到下一行。re.M指定正则表达式可以多行匹配，跨越行首和行尾元符号“^”和“$”。re.I指定正则表达式的符号匹配字符串时，不再进行大小写的区分。re.U指定字符编码为unicode编码。定义包含换行符的字符串“mullines=\"\
    536 suspects.\\\\n36 days.\\\\na man.\"”，控制符号“\\\\n”为换行符，正则表达式 “re.findall(r＇536(.\\\
    *?)days＇，mullines，re.S)”跨行查找 “536”和“days”之间的子字符串。正则表达式“re.findall(r＇^(\\\\d+)\
    \ ＇，mullines，re.M) ”匹配每一行的行首数字，如果没有修饰符“re.M”，只是在第一行匹配。正则表达式“re.match(r＇the＇，text，re.I)\
    \ ”忽略大小写，如图5.7所示:\n\n![](images/txt005_7.jpg \"pagenumber_ebook=131,pagenumber_book=122\"\
    )\n\n图5.7　一些修饰符作用\n\n5.2　获取原始法律文本\n\n5.2.1　常用方法\n\n对原始法律文本的获取可以有三种方法，包括读取原始文本文件、运行变量定义和网页抓取。文件读取是指在本地计算机或者存储设备上打开以txt、xml或者其他格式存储的文本数据文件，运行变量是指在运行环境中定义或访问以字符串形式存在的变量，网页抓取是指通过爬虫程序代码抓取网络远程主机上的网页。\n\
    \nPython的模块os提供了较多的目录和文件操作功能函数，导入的模块os根据不同的操作系统，自动调整能够适应系统平台的文件和目录操作。函数chdir的作用是改变当前路径到参数所指定的位置。函数open既可以打开一般的磁盘文件，还可以访问抽象意义上的数据文件，其read()方法按照字节顺序读取数据到字符串中。如图5.8所示:\n\
    \n![](images/txt005_8.jpg \"pagenumber_ebook=132,pagenumber_book=123\")\n\n图5.8　读取数据文件的语料\n\
    \n可以从nltk自然语言处理工具包中加载语料库，例如，nltk.download()管理和下载一些公开语料库，包括reuters新闻报道语料库、gutenberg文学典籍语料库、brown百万电子文本语料库、webtext网络文本语料库、nps\\\
    _chat即时消息语料库、inaugural演说语料库等。如果文本数据内容不多，可以定义一个字符串变量，通过赋值获取一些少量文本数据。如图5.9所示:\n\n\
    ![](images/txt005_9.jpg \"pagenumber_ebook=132,pagenumber_book=123\")\n\n图5.9　定义和赋值字符串变量\n\
    \n5.2.2　读取 xml文件\n\n语料库的存储格式从txt格式逐渐演变到xml格式，xml是一种可扩展的标记语言，可使数据文件具有一定的结构性信息。使用xml格式对语料库进行多层级标注，有助于语料数据的检索、分类和统计等功能的实现。xml格式的法律文本如图5.10所示:\n\
    \n![](images/txt005_10.jpg \"pagenumber_ebook=132,pagenumber_book=123\")\n\n图5.10　xml格式的法律文本\n\
    \n在计算机磁盘上存储的语料库文件为澳大利亚联邦法院的判例，数据格式为xml，多层次的扩展标记可以对法律文本进行多维度挖掘和分析，形成一个类似文件系统目录的树形层次结构。根节点为＜case＞，表明一个法律裁判文书。第二层有＜name＞、＜AustLII＞和＜citations＞三个节点，＜name＞是案件的名称，＜AustLII＞是裁判文书的来源网页地址，＜citations＞是本案援引的历史判例。＜citations＞节点有多个子节点，数量根据不同的＜case＞而有所不同。第三层节点＜citation＞为援引的一个判例，包括＜class＞、＜tocase＞和＜text＞子节点，＜class＞表明援引案件的类型，＜tocase＞是援引案件的名称，＜text＞为援引案件的简介。如图5.11所示:\n\
    \n![](images/txt005_11.jpg \"pagenumber_ebook=133,pagenumber_book=124\")\n\n图5.11　法律文本的树形结构\n\
    \nElementTree将xml读取到内存中并解析为一棵树来进行操作，是一种较为轻量的解析方式。使用ElementTree操作xml格式文件，如图5.12所示:\n\
    \n![](images/txt005_12.jpg \"pagenumber_ebook=133,pagenumber_book=124\")\n\n图5.12　遍历节点的标签和属性\n\
    \n导入xml.etree.cElementTree模块，调用函数parse()返回解析树，使用getroot()方法获取根节点。通过root.tag和root.attrib可以获取根节点的标签和属性。通过根节点的迭代循环，使用child.tag和child.attrib遍历第二层节点的标签和属性。通过一个第二层节点的迭代循环，使用\
    \ children.tag和children.attrib遍历第三层节点的标签和属性。\n\n可以直接以数组引用的方式来访问某个子节点，例如，root［2］是根节点的第三个子节点，即＜citations＞。root［2］［0］是＜citations＞的第一个子节点＜citation\
