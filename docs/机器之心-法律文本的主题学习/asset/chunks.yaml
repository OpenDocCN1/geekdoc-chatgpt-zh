    # 第5章 法律文本预处理


    ## 5.1 正则表达式


    ### 5.1.1 正则表达式作用


    在进行数据预处理和低质量数据清洗时，正则表达式（`Regular Expression`，`Regex`）可以用来进行一些字符串操作。正则表达式是一种规则匹配模式，在文本信息处理中经常被用来进行字符串的查找和替换。通过预先定义好的特殊符号以及其组合，描述具有某种特征的系列字符串。


    正则表达式的应用场景包括模式匹配和捕获数据。模式匹配是指对于给定的输入字符串是否符合正则表达式的匹配逻辑。例如，判断一个注册用户输入的密码是否符合密码复杂性要求，要求密码字符串包括大小写字母、数字和一定的长度等。正则表达式需要有一些特殊符号表示英文大写，一些特殊符号表示英文小写，一些特殊符号表示数字，一些特殊符号表示可以重复的次数。捕获数据是指从特定输入的字符串中返回符合正则表达式的用户需要的特定部分。例如，从登记的身份证号码中返回此人的年龄，年龄是当前年份减去出生日期中年份，身份证号码的出生年份可以用正则表达式返回。


    ### 5.1.2 基础正则表达式


    一般来说，正则表达式可以匹配字符，也可以匹配位置。正则表达式匹配模式可以模糊表达一些字符串，例如，字符串的长度不是固定的，使用正则表达式 `Regex:wil{1,3}`，表示
    `l` 出现 1～3 次。当匹配到某个具体字符时，正则表达式使用字符组来表示多种可能的字符。例如，`Regex:m[ae]n` 表示 `[ae]` 中有 1
    个字符出现，可以匹配单词 `man` 和 `men`。如果字符组中的字符非常多，可以使用连字符简写，例如，表示一个小写字母为 `Regex:[a-z]`，表示一个大写字母为
    `Regex:[A-Z]`，表示一个数字为 `Regex:[0-9]`。符号 `-` 具有特殊含义，表示起止范围，相对于 `aA z Z09` 这类普通字符，`-`
    称为元字符。如果要表示符号 `-` 本身，需要用一个转义符号 `\` 放到前面，即 `\-`。


    一个位置上的模糊匹配的另一种情况，不能是某个不确定的符号。例如，`Regex:c[^cu]u` 可以模糊表示 `cau、cbu、cdu、…、ctu、cvu`
    等这些字符串，但是就不能表示 `ccu` 和 `cuu`。字符组的第一位是 `^`，是指取反含义，表明可以匹配除了 `cu` 之外的任意一个字符。根据转义符号，一些缩写形式可以表示一定范围和类型的字符。


    - `Regex:\d` 是 `Regex:[0-9]` 的缩写形式，表示任意一个数字字符。

    - `Regex:\d+` 表示匹配超过 1 个的多个数字。

    - `Regex:\d?` 表示匹配不超过 1 个的数字。

    - `Regex:\d*` 表示匹配 0 到任意个的数字。

    - `Regex:\D` 是 `Regex:[^0-9]` 的缩写形式，表示任意一个非数字字符。

    - `Regex:\w` 是 `Regex:[0-9a-zA-Z]` 的缩写形式，表示任意一个数字、小写字母和大写字母这类单词字符。

    - `Regex:\W` 是 `Regex:[^0-9a-zA-Z]` 的缩写形式，表示任意一个非单词字符。

    - `Regex:\s` 是 `Regex:[\t\r\n\v\f]` 的缩写形式，表示任意一个空白字符，包括制表符、换行符、回车符、换页符等。

    - `Regex:\S` 是 `Regex:[^\t\r\n\v\f]` 的缩写形式，表示任意一个非空白字符。


    匹配任意字符可以使用 `[\d\D]`、`[\w\W]` 和 `[\s\S]` 其中之一。


    - `Regex:of{1,}` 表示 `f` 至少出现 1 次。

    - `Regex:of{2,2}` 表示 `f` 出现 2 次。

    - `Regex:of?` 相当于 `Regex:of{0,1}`，表示 `f` 出现或者不出现。

    - `Regex:of+` 相当于 `Regex:of{1,}`。

    - `Regex:of*` 相当于 `Regex:of{0,}`，表示 `f` 出现任意次，或者不出现。


    正则表达式 `Regex:.` 匹配任意一个字符，`Regex:^` 匹配字符串开始，`Regex:$` 匹配字符串结束，`Regex:\b` 匹配字符边界，`Regex:\B`
    匹配非字符边界。


    ### 5.1.3 正则表达式应用


    Python 的 `re` 模块功能是通过正则表达式匹配字符串或捕获字符串，可以通过 `import` 导入该模块。对于字符串 `The policeman
    arrested 536 suspects.Some of them were set free after 36 days.Goodman is a company，not
    a man.`。分别使用表达式 `re.findall(''\w+'', text)`、`re.findall(''\d+'', text)`、`re.findall(''[^\d\s]\w+'',
    text)` 获得所有单词、数字单词、非数字单词，如图 5.1 所示：


    ![](images/txt005_1.jpg "pagenumber_ebook=128,pagenumber_book=119")


    **图 5.1 正则表达式匹配单词**


    如果需要捕获符号匹配模式的子字符串中的一部分字符，可以使用括号捕获部分字符。例如，在上述字符串中查询含有字符 `s` 和 `e` 的单词，使用正则表达式为
    `re.findall(r''\w*[sS]\w*e\w*'', text)`。对于需要查询这些单词中的 `s` 和 `e` 之间有哪些字符，可以使用含有括号的正则表达式为
    `re.findall(r''[sS](\w*)e'', text)`。通过引用可以查询字符串中的字符重复，例如，正则表达式 `re.findall(r''((\w)\2{1,})'',
    text)` 中的 `\2` 表示引用第二括号中的内容，即 `\w`。括号中含有符号 `|` 表示管道模式或者分支选择，例如，需要查询哪些单词包括子字符串
    `man` 或者 `rest`，可以使用正则表达式 `re.findall(r''(\w*man\w*|\w*rest\w*)'', text)`。如图 5.2
    所示：


    ![](images/txt005_2.jpg "pagenumber_ebook=128,pagenumber_book=119")


    **图 5.2 正则表达式捕获单词**


    分别使用表达式 `re.findall(r''^(\w+)'', text)` 和 `re.findall(r''(\w+)\.$'', text)` 获得字符串第一个单词和最后一个单词。分别使用表达式
    `re.findall(r''^\b(.*?\.)'', text)` 和 `re.findall(r''\.\s*(.{1,35}\.)(?=$)'',
    text)` 获得字符串第一个句子和最后一个句子。


    从图 5.3 中可以看出，表达式 `re.findall(r''^\b(.*\.)'', text)` 从字符串开始处匹配，到第一句结束是满足表达式模式的，到第二句结束也是满足表达式模式的，甚至到第三句结束还是满足表达式模式的，返回的是能够匹配最多字符串的情况，这种模式称为贪婪模式。在中间插入一个
    `?` 就改变为非贪婪模式，表达式为 `re.findall(r''^\b(.*?\.)'', text)`，返回的是能够匹配模式的最小字符串的情况，即匹配的是第一句。贪婪模式和非贪婪模式如图
    5.4 所示：


    ![](images/txt005_3.jpg "pagenumber_ebook=129,pagenumber_book=120")


    **图 5.3 正则表达式匹配句子**


    ![](images/txt005_4.jpg "pagenumber_ebook=129,pagenumber_book=120")


    **图 5.4 贪婪模式和非贪婪模式**


    正则表达式可以查询某个位置。例如，上述字符串找到 `man` 位置，在前面插入 `#`，正则表达式为 `re.sub(r''(?=man)'', ''#'',
    text)`。这属于肯定向前查找，查找符合模式定义之前的位置。与此相反，肯定向后查找是匹配符合模式定义之后的位置，正则表达式为 `re.sub(r''(?<=\d)\s'',
    ''%'', text)`，将数字后面的空格替换为百分号。否定向前查找匹配不符合模式定义之前的位置，正则表达式为 `re.findall(r''an(?!y)'',
    text)`，将匹配后面不是 `y` 的 `an`。否定向后查找匹配不符合模式定义之后的位置，正则表达式为 `re.findall(r''(?<!police)man'',
    text)`，将匹配前面不是 `police` 的 `man`。如图 5.5 所示：


    ![](images/txt005_5.jpg "pagenumber_ebook=130,pagenumber_book=121")


    **图 5.5 前向和后向匹配**


    模块 `re` 的函数 `match()`、`search()`、`findall()` 和 `sub()` 都可以进行正则表达式的匹配，包括一些可选参数。`match()`
    只从字符串起始位置开始匹配，如果第一个字符不符合匹配模式，函数返回空。`search()` 可以从字符串任何位置开始匹配，只要找到匹配模式函数开始返回结果，相当于一种非贪婪模式。`findall()`
    尽可能地找到字符串中所有可能的匹配，属于一种贪婪模式，除非在正则表达式中进行指定。


    ![](images/txt005_6.jpg "pagenumber_ebook=130,pagenumber_book=121")


    **图 5.6 函数 match、search 和 findall 的区别**


    模块 `re` 的函数通过一些可选参数或者修饰符控制正则表达式的模式匹配，包括 `re.S`、`re.M`、`re.I` 和 `re.U` 等，多个修饰符可以用逻辑或运算符号
    `|` 来连接。


    - `re.S` 指定元符号 `.` 匹配单个任意符号时，可以扩展到下一行。

    - `re.M` 指定正则表达式可以多行匹配，跨越行首和行尾元符号 `^` 和 `$`。

    - `re.I` 指定正则表达式的符号匹配字符串时，不再进行大小写的区分。

    - `re.U` 指定字符编码为 unicode 编码。


    定义包含换行符的字符串 `mullines="536 suspects.\n36 days.\na man."`，控制符号 `\n` 为换行符，正则表达式
    `re.findall(r''536(.*?)days'', mullines, re.S)` 跨行查找 `536` 和 `days` 之间的子字符串。正则表达式
    `re.findall(r''^(\d+)'', mullines, re.M)` 匹配每一行的行首数字，如果没有修饰符 `re.M`，只是在第一行匹配。正则表达式
    `re.match(r''the'', text, re.I)` 忽略大小写，如图 5.7 所示：


