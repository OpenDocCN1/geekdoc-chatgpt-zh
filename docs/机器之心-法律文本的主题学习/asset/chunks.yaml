    # 8.5 SLDA Topic Analysis of English Legal Texts


    ## 8.5.1 English Legal Terminology SLDA Model


    `vsmtf_legalterms_FCA` is the legal terminology feature vector space of the English
    FCA corpus. The supervision information `MR.task.labels.txt` represents textual
    entailment information: 1 indicates the judgment supports the plaintiff, and 0
    indicates the judgment does not support the plaintiff. The sample size is 3886.
    `x_train_legalterms_FCA` is the training sample set, `x_test_legalterms_FCA` is
    the test sample set. `y_train_FCA` is the training sample set label, and `y_test_FCA`
    is the test sample set label, as shown in Figure 8.25:


    ![](img/txt008_39.jpg "pagenumber_ebook=236,pagenumber_book=227")


    Figure 8.25　Training and test sets for English FCA legal terminology feature space


    The classification performance of the `SVC` support vector machine on the English
    FCA legal terminology feature space is shown in Figure 8.26, with an accuracy
    of approximately 0.89. `fpr_svc_legalterms_FCA` and `tpr_svc_legalterms_FCA` are
    the `fpr` and `tpr` obtained using the `svc` classifier on the FCA corpus legal
    terminology feature space, respectively, as shown in Figure 8.27. The AUC of the
    `SVC` support vector machine on the English FCA legal terminology feature space
    is shown in Figure 8.28, with an AUC value of approximately 0.878.


    ![](img/txt008_40.jpg "pagenumber_ebook=236,pagenumber_book=227")


