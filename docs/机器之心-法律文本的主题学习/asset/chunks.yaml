- raw: '学习任务可以分为监督学习和无监督学习，如图2.1所示。监督学习样本包含标签信息，学习算法可以根据模型输出和实际输出的差异调整模型参数，进行反馈学习，学习模型可以对没有标签的新样本预测输出。无监督学习的样本没有标签信息，因此学习过程没有反馈信息回馈模型，学习目的是数据中的隐藏结构。


    ![](images/txt002_1.jpg "pagenumber_ebook=45,pagenumber_book=36")


    图2.1　监督学习和无监督学习


    监督学习的主要目标是在打上标签的训练数据中学习模型，以便对将来的数据作出预测，如图2.2所示。监督的意思是指样本输入到模型所期望的输出信号，即标签。例如，法律文本法域分类，在已经标记好法域的训练数据上，使用监督机器学习算法去学习模型，训练好的模型可以预测一个新的法律文本是否属于一个法域。监督学习的类别标签是离散的，这种分类任务属于一种监督学习方法，另一种监督学习任务是回归学习，回归模型的输出的信号是连续性的数值。


    ![](images/txt002_2.jpg "pagenumber_ebook=45,pagenumber_book=36")


    图2.2　监督学习过程


    2.3　分类和聚类


    在监督学习的二分分类任务中，通过对历史案例的观察和学习，对新案件或新样本作出预测。例如，新样本 (原告=韩某庚，被告=方某戌，法院=南京市玄武区人民法院，案由=不当得利，时间=2020年6月7日)，学习模型对新样本的输出结果即判决结果进行预测，胜诉或者败诉。机器学习的预测建立在假设前提和历史数据之上，假设判决结果与原告、被告、法院、案由和时间这些特征有关。如果数据空间特征越多，假设越趋向完美。相反地，特征越少，假设越缺乏合理性。因此，从判决结果的合理性考虑，案件特征中增加关于案件事实和证据描述的假设更加完美。


    为了简化模型，从案例中取出法院和时间作为特征，横坐标feature\_1为时间，纵坐标feature\_2为法院，如下图所示。每个点表示一个样本，包含两个值，分别对应横坐标feature\_1和纵坐标feature\_2的取值。圆点代表正类样本，方框代表负类样本，斜线是根据图中样本学习得到的模型或者分类器。图2.3中学习算法的假设是线性分类器，学习策略是寻找训练集中所有样本到分类器的平方和最大的那个特定的分类斜线。如果学习模型的输出结果不再是胜诉或者败诉，而是多个类别之一。例如，模型的输出结果为法律领域，类别标签可能是民事、刑事、行政或者国家赔偿之一。在多类别分类任务中，如果训练集中没有行政法的样本数据，模型无法学习关于属于行政法的样本数据特征。对于一个将来需要预测的新样本，学习模型只能预测为民事、刑事和国家赔偿之一，而人工标记的结果可能为行政法。换言之，学习模型是在训练数据中学习潜在规律，通过对训练数据的观察来预测将来数据，因此，决定将来数据结果的特征需要在训练数据中有所体现。学习算法或者模型对未知数据或者将来样本的预测能力，称为模型的泛化能力。评估模型的性能需要考虑泛化能力和样本空间的适应性，样本空间容量与特征数量有关，一般呈现出指数关系。当特征数量比较大时，样本空间就变得非常巨大。实际上，采集的数据集是样本空间的一次抽样，泛化能力强的学习模型对数据集的要求是能够比较好地代表样本空间，不仅训练集需要反映样本在空间的分布，而且测试集也需要服从同样的分布，只有这样，学习模型的适应性才比较好。


    ![](images/txt002_3.jpg "pagenumber_ebook=47,pagenumber_book=38")


    图2.3　二分类监督学习任务


    在监督学习中的回归分析任务中，模型的输入即样本的特征称为解释变量(Explanatory Variable)，学习模型的输出称为响应变量 (Response
    Variable)。回归学习任务假定响应变量与解释变量之间存在某种拥有参数约束的关系，通过训练集的学习，使得响应变量符合该关系的输出。回归学习的输出目标是连续值，例如，学习模型的预测结果是案件涉诉金额，如图2.4所示。横坐标feature\_1是判决日期，纵坐标y是涉诉金额，学习模型的假设是涉诉金额与判决日期存在线性关系，学习策略是寻找训练集中所有样本在回归直线上的输出与真实输出的均方和最小的那个特定的回归直线。从图2.4中可以看出，训练集的数据分布似乎比较符合线性关系。实际上，训练集数据分布可能出现另外一种情况，比如高斯分布或者多项式分布等。线性分布、多项式分布和高斯分布的参数不同。在线性分布的假设下，模型学习的参数符合线性假设。在多项式分布的假设下，模型学习的参数符合多项式分布假设。在高斯分布的假设下，模型学习的参数符合高斯分布假设。因此，机器学习算法是在数据上学习的模型，每种机器学习算法都有其优势，同时也有其局限性，不存在适用于所有数据集的普适学习算法。如果训练集数据在样本空间不具有代表性，采用数据集中在样本空间的某一角落，称之为数据偏斜。这种情况下，需要对数据进行清洗，重新采集训练数据，或者增加训练集的数量。


    ![](images/txt002_4.jpg "pagenumber_ebook=48,pagenumber_book=39")


    图2.4　回归监督学习任务


    在训练集上学习模型之后，将模型推广到整个样本空间适用，称之为拟合。泛化能力弱的模型容易出现欠拟合 (Under-fitting)或者过拟合 (Over-fitting)。当模型参数过少、复杂度过低、特征过少就会导致欠拟合现象，如图2.5所示。从图中可以看出，数据集的特征只有feature\_1，目标输出为y，如果回归分析算法为线性模型，响应变量y与解释变量feature\_1的关系可以描述为y=a\*feature\_1+b。其中，a和b为模型参数。总体来看，图2.5中的点到拟合直线的偏差的总和较大，模型泛化能力较差。对于欠拟合现象，如果将模型调整为多项式回归关系，可以将所有样本拟合到曲线上，多项式模型比线性模型更加复杂，参数也更多。在不改变模型的情况下，也可以增加特征数来改善欠拟合现象。例如，在案件数据集中增加法院信息作为特征feature\_2，样本空间从二维空间过渡到三维空间，在二维空间中无法拟合成直线的散列的点，可以映射到三维空间中的同一个平面。


    ![](images/txt002_5.jpg "pagenumber_ebook=49,pagenumber_book=40")


    图2.5　欠拟合现象


    当模型参数过多、复杂度过高、训练数据过少就会导致过拟合现象，如图2.6所示。从图2.6中可以看出，如果回归分析算法为三次多项式模型，响应变量y与解释变量feature\_1的关系可以描述为y=a\*(feature\_1)3+b\*(feature\_1)2+c\*feature\_1+d。其中，a、b、c和d为模型参数。总的来看，图中的点几乎都在拟合曲线上，总的偏差接近于零，模型泛化能力也较差，因为有些点可能是噪音或者错误的。对于过拟合现象，需要降低模型复杂度，减少模型参数，可以将三次多项式模型调整为二次多项式，即y=b\*(feature\_1)2+c\*feature\_1+d。增加更多的训练数据，使得训练数据集的数量级超过模型复杂度，这些方法都可以改善模型过拟合现象。


    ![](images/txt002_6.jpg "pagenumber_ebook=50,pagenumber_book=41")


    图2.6　过拟合现象


    监督学习的训练数据是有标签的，而无监督学习的样本是没有标签的。很多情况下，数据是没有标签的，因为标签是人按照性质对事件作出的认定。在图2.7中，将样本空间中的法院信息作为特征feature\_1，对应的横坐标值为该法院离北京的距离。将赔偿作为特征feature\_2，对应的纵坐标值为赔偿金额。很显然，存在两个簇群，一个位置在图的左上角，一个在图的右下角。样本的特征可以理解为一种观察值，例如，观察到一个案子在北京市朝阳区人民法院开庭，代表该样本的点出现在图的左侧，而左侧的点的位置靠近图的顶部。观察到另外一个案例在重庆市渝中区人民法院开庭，代表该样本的点出现在图的右侧，而右侧的点的位置靠近图的底部。左侧的点和顶部有关系，右侧的点和底部有关系，其背后的原因可能是深层次的，可以作这样的猜测，经济的发展水平导致样本点呈现出两个簇群的分布。因此，在没有响应变量或者目标输出的情况下，运用无监督的聚类学习算法，能够发现数据内部的一些关联，从而提取有用的信息。在没有领域知识和专家经验的情况下，聚类算法是一项非常重要的数据分析方法，帮助人们更好地理解数据。对中国经济地理熟悉的人来说，很容易知道北京是发达地区，重庆是相对不发达地区。然而，对中国经济地理不熟悉的人来说，可能就不知道这些数据所反映出的有用信息。通过聚类学习，可以帮助人们从簇群中发现内在结构，获知北京和重庆在经济发展水平上存在差异。


    ![](images/txt002_7.jpg "pagenumber_ebook=51,pagenumber_book=42")


    图2.7　聚类任务


    在聚类算法产生的簇群中，每一个簇代表了在某些特征上较为相似或者接近的一组样本点，而来自不同簇的样本点在这些特征上存在比较大的差异。在图2.7中，左上角的簇在特征feature\_1上取值比较小，在feature\_2特征上取值比较大。右下角的簇在特征feature\_1上取值比较大，在feature\_2特征上取值比较小。从聚类过程中可以发现，特征feature\_1取值越大以及feature\_2取值越大，即簇出现在图的右上角，造成案件动机当中，经济因素占比越高。特征feature\_1取值越小以及feature\_2取值越小，即簇出现在图的左下角，造成案件动机当中，经济因素占比越低。


    2.4　强化学习


    在监督学习中，样本的输出为分类或者回归结果。然而，有些学习策略并不存在明显分类或者回归结果，例如下棋行为。对弈双方根据棋盘状态，选择下一步行动，从而使得棋盘进入下一个状态。如果下一个状态能够使对方棋子减少一个或者让对方王后处于危险境地，驱使状态发生变化的行动将获得奖励。对弈行为的过程就是强化学习，如图2.8所示。智能体
    (Agent)能够和环境 (Environment)进行交互，使得环境状态 (State)发生迁移，环境的迁移将奖励(Reward)回馈给智能体。强化学习的目标是训练一个机器或者智能体，通过有效的学习策略，在与环境的交互中，逐步改善系统性能。一般认为强化学习是一种监督学习方法，但是不同于真实的分类标签或者响应变量。机器学习的监督信息是一种奖励策略，通过奖励引导智能体向善发展。


    ![](images/txt002_8.jpg "pagenumber_ebook=52,pagenumber_book=43")


    图2.8　强化学习


    通常情况下，通过奖励函数来评价一个动作获得奖励的数值，正数数值越大，获得正面激励就强，负数数值越大，获得负面抑制就越强。智能体在强化学习之后，通过探索性的试错，使环境状态不断迁移，从而实现所获得的奖励最大化。每一步动作都将产生积极或者消极的奖励，积极的奖励被认为更加接近最终目标，而消极的奖励则被认为更加远离目标。


    在案件样本空间中，如果样本被当作一个环境状态，在案件判决之前，这个案子的状态处于不断迁移状态，智能体是能够推动案件状态发生变化的抽象主体。对于原告方的智能体，强化学习的目标是对案件状态施加有利于原告方的一系列动作，这些动作产生的最大的奖励就是使得原告方胜诉。对于被告方的智能体，强化学习的目标是对案件状态施加有利于被告方的一系列动作，这些动作产生的最大的奖励就是使得原告方败诉。例如，当前环境状态为案件样本
    (原告=刘某戊，被告=孙某己，法院=重庆市渝中区人民法院，案由=知识产权纠纷，时间=2016年8月25日)，假设原告公司是北京注册公司，被告方是重庆注册公司，原告方智能体施加的动作导致案件状态发生迁移，下一个状态涉及北京法院审理案件，根据原告方智能体的奖励函数，获得的回馈为积极奖励。


    在强化学习的决策过程中，智能体对环境的每个状态s都了解，状态空间为S。在当前状态下，智能体执行的动作a引起环境E向下一个状态的迁移，而迁移函数P计算当前状态向下一个状态迁移的概率，动作空间为A。在状态发生迁移的同时，奖励函数R回馈给智能体一个奖励。因此，强化学习是一个四元组E:＜S，A，P，R＞。假设在案件样本空间中，增加一个脸熟特征，智能体每天在去法院和不去法院两者之间作决定。去法院有可能增强法官对智能体的熟悉程度并引起好感，也有可能增强法官对智能体的熟悉程度并引起反感。不去法院有可能降低法官对智能体的熟悉程度并引起好感，也有可能降低法官对智能体的熟悉程度并引起反感，如图2.9所示。


    ![](images/txt002_9.jpg "pagenumber_ebook=53,pagenumber_book=44")


    图2.9　去法院的决策过程


    在去法院的决策过程中，存在四个状态:熟悉好感、熟悉反感、不熟悉好感和不熟悉反感。有两个动作:去法院和不去法院。在每一个状态发生迁移后，如果能够使法官熟悉智能体，智能体将获得10个数值的奖励。法官对智能体产生陌生感，智能体将获得-5个数值的奖励。如果能够使法官增加对智能体的好感，智能体将获得20个数值的奖励。法官对智能体产生反感，智能体将获得-30个数值的奖励。在图2.9中，状态迁移1可以描述为:a=去法院，p=0.7，r=10;状态迁移2可以描述为:a=不去法院，p=0.3，r=10。状态迁移3可以描述为:a=去法院，p=0.6，r=5;状态迁移4可以描述为:a=不去法院，p=0.4，r=5。状态迁移5可以描述为:a=去法院，p=0.5，r=5;状态迁移6可以描述为:a=不去法院，p=0.5，r=5。状态迁移7可以描述为:a=去法院，p=0.8，r=20;状态迁移8可以描述为:a=不去法院，p=0.2，r=-20。状态迁移9可以描述为:a=不去法院，p=0.5，r=-10;状态迁移10可以描述为:a=去法院，p=0.5，r=10。状态迁移11可以描述为:a=去法院，p=0.8，r=30;状态迁移12可以描述为:a=不去法院，p=0.2，r=-30。状态迁移13可以描述为:a=去法院，p=0.7，r=-15;状态迁移14可以描述为:a=不去法院，p=0.3，r=-15。状态迁移15可以描述为:a=去法院，p=0.3，r=5;状态迁移16可以描述为:a=不去法院，p=0.7，r=-5。状态迁移17可以描述为:a=去法院，p=0.4，r=20;状态迁移18可以描述为:a=不去法院，p=0.6，r=-20。状态迁移19可以描述为:a=不去法院，p=0.7，r=15;状态迁移20可以描述为:a=去法院，p=0.3，r=-15。


    强化学习的监督信息是智能体从环境获得奖励，环境状态的迁移和回馈的奖励不是完全受智能体控制，智能体通过执行动作和观察动作执行后的状态迁移来感知和理解环境，从而在动作的选择上影响环境。强化学习的监督机制和分类与回归任务不同，机器或者训练集并没有直接指导智能体下一步该执行哪一个操作，而是不断尝试各种可能的动作，实现总的奖励值的最大化。总的奖励值是每个动作所产生的奖励的总和，智能体无法前瞻性地预测总的奖励值，只能从当前环境状态考虑，选择期望能够最大化奖励值的动作或操作。实际上，单步动作产生的奖励值并非是确定值，而是服从某种概率分布，少数的尝试并不能帮助智能体确定期望的动作。因此，强化学习是不断与环境交互和试错的监督学习方法。


    2.5　假设空间


    机器学习从样本中进行学习，每一个样本是一个具体的实例。在案例数据集中，一个样本包含在原告、被告、法院、案由和日期等特征上的取值，也是抽象概念“案件”的具体实例和描述。在逻辑学中，归纳和演绎是最基本的逻辑方法。归纳方法是从具体现象中总结出一般性规律，例如观察冬夏季的气温。


    从7月1日开始观察，连续观察9天，最高气温分别是35.5、36.0、35.0、37.5、36.5、35.0、38.0、37.5 和 38.0(单位均为摄氏度)，样本标签都为夏季。从12月1日开始观察，连续观察9天，最高气温分别是11.5、12.0、9.0、8.5、9.5、11.0、10.0、10.5
    和 10.0(单位均为摄氏度)，样本标签都为冬季。将上述的气温观察数值作为训练数据集进行学习，分类器提出一些假设，最高气温超过一个阈值a就为夏天，最高气温低于一个阈值b即为冬季。关于夏季的最高气温假设可能是一个集合，a={36.0，35.5，35.0，34.5，34.0，33.5，33.0，32.5，32，31.5，31.0，30.5，30.0，…}。关于冬季的最高气温假设可能是
    一 个 集 合，b={11.0，11.5，12.0，12.5，13.0，13.5，14.0，14.5，15.0，15.5，16.0，16.5，17.0，…}。这些假设构成一个假设空间，分类器从这些假设空间搜索，寻找那些与训练集数据匹配或者吻合的假设。


    显然，在假设空间a中，最高气温为36.0摄氏度和35.5摄氏度并不能匹配从7月1日连续观察的9天数值，排除不符合训练集的假设以后，假设空间为{35.0，34.5，34.0，33.5，33.0，32.5，32，31.5，31.0，30.5，30.0，…}。在假设空间b中，最高气温为11.0摄氏度和11.5摄氏度并不能匹配从7月1日连续观察的9天数值，排除不符合训练集的假设以后，假设空间为
    {12.0，12.5，13.0，13.5，14.0，14.5，15.0，15.5，16.0，16.5，17.0，…}。训练集数据规模越大，排除的假设就越多，分类器习得的模型就越准确。


    在回归学习任务中，输入的特征为feature\_1，输出为响应变量y，如图2.10所示。例如，学习目标是寻找经济赔偿案件中的赔付数额与地区发展水平的关系，特征feature\_1为地区的量化值，输出y为赔偿金额。对于学习模型的假设，可以提出线性关系的假设，也可以提出一元二次关系的假设。图中的两个点代表训练样本有两个，假设输出与输入的关系符合线性关系，y=a\*feature\_1+b，a和b是参数，求解含有两个参数的方程需要两个样本点。因此，线性关系假设可以完全拟合两个样本点。假设输出与输入的关系符合一元二次关系，y=a\*(feature\_1)2+b\*feature\_1+c，参数包括a、b和c，用两个样本点求解含有三个参数的方程，将产生两个约束变量和一个自由变量。因此，存在很多一元二次多项式假设也能完全拟合这两个样本点。


    ![](images/txt002_10.jpg "pagenumber_ebook=55,pagenumber_book=46")


    图2.10　线性和二次回归假设的完全拟合'
  fmt: '

    ## 2.1 监督学习与无监督学习


    学习任务可以分为监督学习和无监督学习，如图2.1所示。监督学习样本包含标签信息，学习算法可以根据模型输出和实际输出的差异调整模型参数，进行反馈学习，学习模型可以对没有标签的新样本预测输出。无监督学习的样本没有标签信息，因此学习过程没有反馈信息回馈模型，学习目的是数据中的隐藏结构。


    ![](images/txt002_1.jpg "pagenumber_ebook=45,pagenumber_book=36")


    图2.1　监督学习和无监督学习


    ## 2.2 监督学习的主要目标


    监督学习的主要目标是在打上标签的训练数据中学习模型，以便对将来的数据作出预测，如图2.2所示。监督的意思是指样本输入到模型所期望的输出信号，即标签。例如，法律文本法域分类，在已经标记好法域的训练数据上，使用监督机器学习算法去学习模型，训练好的模型可以预测一个新的法律文本是否属于一个法域。监督学习的类别标签是离散的，这种分类任务属于一种监督学习方法，另一种监督学习任务是回归学习，回归模型的输出的信号是连续性的数值。


    ![](images/txt002_2.jpg "pagenumber_ebook=45,pagenumber_book=36")


    图2.2　监督学习过程


    ## 2.3 分类和聚类


    在监督学习的二分分类任务中，通过对历史案例的观察和学习，对新案件或新样本作出预测。例如，新样本（原告=韩某庚，被告=方某戌，法院=南京市玄武区人民法院，案由=不当得利，时间=2020年6月7日），学习模型对新样本的输出结果即判决结果进行预测，胜诉或者败诉。机器学习的预测建立在假设前提和历史数据之上，假设判决结果与原告、被告、法院、案由和时间这些特征有关。如果数据空间特征越多，假设越趋向完美。相反地，特征越少，假设越缺乏合理性。因此，从判决结果的合理性考虑，案件特征中增加关于案件事实和证据描述的假设更加完美。


    为了简化模型，从案例中取出法院和时间作为特征，横坐标`feature_1`为时间，纵坐标`feature_2`为法院，如下图所示。每个点表示一个样本，包含两个值，分别对应横坐标`feature_1`和纵坐标`feature_2`的取值。圆点代表正类样本，方框代表负类样本，斜线是根据图中样本学习得到的模型或者分类器。图2.3中学习算法的假设是线性分类器，学习策略是寻找训练集中所有样本到分类器的平方和最大的那个特定的分类斜线。如果学习模型的输出结果不再是胜诉或者败诉，而是多个类别之一。例如，模型的输出结果为法律领域，类别标签可能是民事、刑事、行政或者国家赔偿之一。在多类别分类任务中，如果训练集中没有行政法的样本数据，模型无法学习关于属于行政法的样本数据特征。对于一个将来需要预测的新样本，学习模型只能预测为民事、刑事和国家赔偿之一，而人工标记的结果可能为行政法。换言之，学习模型是在训练数据中学习潜在规律，通过对训练数据的观察来预测将来数据，因此，决定将来数据结果的特征需要在训练数据中有所体现。学习算法或者模型对未知数据或者将来样本的预测能力，称为模型的泛化能力。评估模型的性能需要考虑泛化能力和样本空间的适应性，样本空间容量与特征数量有关，一般呈现出指数关系。当特征数量比较大时，样本空间就变得非常巨大。实际上，采集的数据集是样本空间的一次抽样，泛化能力强的学习模型对数据集的要求是能够比较好地代表样本空间，不仅训练集需要反映样本在空间的分布，而且测试集也需要服从同样的分布，只有这样，学习模型的适应性才比较好。


    ![](images/txt002_3.jpg "pagenumber_ebook=47,pagenumber_book=38")


    图2.3　二分类监督学习任务


    在监督学习中的回归分析任务中，模型的输入即样本的特征称为解释变量(`Explanatory Variable`)，学习模型的输出称为响应变量(`Response
    Variable`)。回归学习任务假定响应变量与解释变量之间存在某种拥有参数约束的关系，通过训练集的学习，使得响应变量符合该关系的输出。回归学习的输出目标是连续值，例如，学习模型的预测结果是案件涉诉金额，如图2.4所示。横坐标`feature_1`是判决日期，纵坐标`y`是涉诉金额，学习模型的假设是涉诉金额与判决日期存在线性关系，学习策略是寻找训练集中所有样本在回归直线上的输出与真实输出的均方和最小的那个特定的回归直线。从图2.4中可以看出，训练集的数据分布似乎比较符合线性关系。实际上，训练集数据分布可能出现另外一种情况，比如高斯分布或者多项式分布等。线性分布、多项式分布和高斯分布的参数不同。在线性分布的假设下，模型学习的参数符合线性假设。在多项式分布的假设下，模型学习的参数符合多项式分布假设。在高斯分布的假设下，模型学习的参数符合高斯分布假设。因此，机器学习算法是在数据上学习的模型，每种机器学习算法都有其优势，同时也有其局限性，不存在适用于所有数据集的普适学习算法。如果训练集数据在样本空间不具有代表性，采用数据集中在样本空间的某一角落，称之为数据偏斜。这种情况下，需要对数据进行清洗，重新采集训练数据，或者增加训练集的数量。


    ![](images/txt002_4.jpg "pagenumber_ebook=48,pagenumber_book=39")


    图2.4　回归监督学习任务


    在训练集上学习模型之后，将模型推广到整个样本空间适用，称之为拟合。泛化能力弱的模型容易出现欠拟合(`Under-fitting`)或者过拟合(`Over-fitting`)。当模型参数过少、复杂度过低、特征过少就会导致欠拟合现象，如图2.5所示。从图中可以看出，数据集的特征只有`feature_1`，目标输出为`y`，如果回归分析算法为线性模型，响应变量`y`与解释变量`feature_1`的关系可以描述为`y=a*feature_1+b`。其中，`a`和`b`为模型参数。总体来看，图2.5中的点到拟合直线的偏差的总和较大，模型泛化能力较差。对于欠拟合现象，如果将模型调整为多项式回归关系，可以将所有样本拟合到曲线上，多项式模型比线性模型更加复杂，参数也更多。在不改变模型的情况下，也可以增加特征数来改善欠拟合现象。例如，在案件数据集中增加法院信息作为特征`feature_2`，样本空间从二维空间过渡到三维空间，在二维空间中无法拟合成直线的散列的点，可以映射到三维空间中的同一个平面。


    ![](images/txt002_5.jpg "pagenumber_ebook=49,pagenumber_book=40")


    图2.5　欠拟合现象


    当模型参数过多、复杂度过高、训练数据过少就会导致过拟合现象，如图2.6所示。从图2.6中可以看出，如果回归分析算法为三次多项式模型，响应变量`y`与解释变量`feature_1`的关系可以描述为`y=a*(feature_1)3+b*(feature_1)2+c*feature_1+d`。其中，`a`、`b`、`c`和`d`为模型参数。总的来看，图中的点几乎都在拟合曲线上，总的偏差接近于零，模型泛化能力也较差，因为有些点可能是噪音或者错误的。对于过拟合现象，需要降低模型复杂度，减少模型参数，可以将三次多项式模型调整为二次多项式，即`y=b*(feature_1)2+c*feature_1+d`。增加更多的训练数据，使得训练数据集的数量级超过模型复杂度，这些方法都可以改善模型过拟合现象。


    ![](images/txt002_6.jpg "pagenumber_ebook=50,pagenumber_book=41")


    图2.6　过拟合现象


    监督学习的训练数据是有标签的，而无监督学习的样本是没有标签的。很多情况下，数据是没有标签的，因为标签是人按照性质对事件作出的认定。在图2.7中，将样本空间中的法院信息作为特征`feature_1`，对应的横坐标值为该法院离北京的距离。将赔偿作为特征`feature_2`，对应的纵坐标值为赔偿金额。很显然，存在两个簇群，一个位置在图的左上角，一个在图的右下角。样本的特征可以理解为一种观察值，例如，观察到一个案子在北京市朝阳区人民法院开庭，代表该样本的点出现在图的左侧，而左侧的点的位置靠近图的顶部。观察到另外一个案例在重庆市渝中区人民法院开庭，代表该样本的点出现在图的右侧，而右侧的点的位置靠近图的底部。左侧的点和顶部有关系，右侧的点和底部有关系，其背后的原因可能是深层次的，可以作这样的猜测，经济的发展水平导致样本点呈现出两个簇群的分布。因此，在没有响应变量或者目标输出的情况下，运用无监督的聚类学习算法，能够发现数据内部的一些关联，从而提取有用的信息。在没有领域知识和专家经验的情况下，聚类算法是一项非常重要的数据分析方法，帮助人们更好地理解数据。对中国经济地理熟悉的人来说，很容易知道北京是发达地区，重庆是相对不发达地区。然而，对中国经济地理不熟悉的人来说，可能就不知道这些数据所反映出的有用信息。通过聚类学习，可以帮助人们从簇群中发现内在结构，获知北京和重庆在经济发展水平上存在差异。


    ![](images/txt002_7.jpg "pagenumber_ebook=51,pagenumber_book=42")


    图2.7　聚类任务


    在聚类算法产生的簇群中，每一个簇代表了在某些特征上较为相似或者接近的一组样本点，而来自不同簇的样本点在这些特征上存在比较大的差异。在图2.7中，左上角的簇在特征`feature_1`上取值比较小，在`feature_2`特征上取值比较大。右下角的簇在特征`feature_1`上取值比较大，在`feature_2`特征上取值比较小。从聚类过程中可以发现，特征`feature_1`取值越大以及`feature_2`取值越大，即簇出现在图的右上角，造成案件动机当中，经济因素占比越高。特征`feature_1`取值越小以及`feature_2`取值越小，即簇出现在图的左下角，造成案件动机当中，经济因素占比越低。


    ## 2.4 强化学习


    在监督学习中，样本的输出为分类或者回归结果。然而，有些学习策略并不存在明显分类或者回归结果，例如下棋行为。对弈双方根据棋盘状态，选择下一步行动，从而使得棋盘进入下一个状态。如果下一个状态能够使对方棋子减少一个或者让对方王后处于危险境地，驱使状态发生变化的行动将获得奖励。对弈行为的过程就是强化学习，如图2.8所示。智能体(`Agent`)能够和环境(`Environment`)进行交互，使得环境状态(`State`)发生迁移，环境的迁移将奖励(`Reward`)回馈给智能体。强化学习的目标是训练一个机器或者智能体，通过有效的学习策略，在与环境的交互中，逐步改善系统性能。一般认为强化学习是一种监督学习方法，但是不同于真实的分类标签或者响应变量。机器学习的监督信息是一种奖励策略，通过奖励引导智能体向善发展。


    ![](images/txt002_8.jpg "pagenumber_ebook=52,pagenumber_book=43")


    图2.8　强化学习


    通常情况下，通过奖励函数来评价一个动作获得奖励的数值，正数数值越大，获得正面激励就强，负数数值越大，获得负面抑制就越强。智能体在强化学习之后，通过探索性的试错，使环境状态不断迁移，从而实现所获得的奖励最大化。每一步动作都将产生积极或者消极的奖励，积极的奖励被认为更加接近最终目标，而消极的奖励则被认为更加远离目标。


    在案件样本空间中，如果样本被当作一个环境状态，在案件判决之前，这个案子的状态处于不断迁移状态，智能体是能够推动案件状态发生变化的抽象主体。对于原告方的智能体，强化学习的目标是对案件状态施加有利于原告方的一系列动作，这些动作产生的最大的奖励就是使得原告方胜诉。对于被告方的智能体，强化学习的目标是对案件状态施加有利于被告方的一系列动作，这些动作产生的最大的奖励就是使得原告方败诉。例如，当前环境状态为案件样本（原告=刘某戊，被告=孙某己，法院=重庆市渝中区人民法院，案由=知识产权纠纷，时间=2016年8月25日），假设原告公司是北京注册公司，被告方是重庆注册公司，原告方智能体施加的动作导致案件状态发生迁移，下一个状态涉及北京法院审理案件，根据原告方智能体的奖励函数，获得的回馈为积极奖励。


    在强化学习的决策过程中，智能体对环境的每个状态`s`都了解，状态空间为`S`。在当前状态下，智能体执行的动作`a`引起环境`E`向下一个状态的迁移，而迁移函数`P`计算当前状态向下一个状态迁移的概率，动作空间为`A`。在状态发生迁移的同时，奖励函数`R`回馈给智能体一个奖励。因此，强化学习是一个四元组`E:＜S，A，P，R＞`。假设在案件样本空间中，增加一个脸熟特征，智能体每天在去法院和不去法院两者之间作决定。去法院有可能增强法官对智能体的熟悉程度并引起好感，也有可能增强法官对智能体的熟悉程度并引起反感。不去法院有可能降低法官对智能体的熟悉程度并引起好感，也有可能降低法官对智能体的熟悉程度并引起反感，如图2.9所示。


    ![](images/txt002_9.jpg "pagenumber_ebook=53,pagenumber_book=44")


    图2.9　去法院的决策过程


    在去法院的决策过程中，存在四个状态：熟悉好感、熟悉反感、不熟悉好感和不熟悉反感。有两个动作：去法院和不去法院。在每一个状态发生迁移后，如果能够使法官熟悉智能体，智能体将获得10个数值的奖励。法官对智能体产生陌生感，智能体将获得-5个数值的奖励。如果能够使法官增加对智能体的好感，智能体将获得20个数值的奖励。法官对智能体产生反感，智能体将获得-30个数值的奖励。在图2.9中，状态迁移1可以描述为：`a=去法院，p=0.7，r=10`；状态迁移2可以描述为：`a=不去法院，p=0.3，r=10`。状态迁移3可以描述为：`a=去法院，p=0.6，r=5`；状态迁移4可以描述为：`a=不去法院，p=0.4，r=5`。状态迁移5可以描述为：`a=去法院，p=0.5，r=5`；状态迁移6可以描述为：`a=不去法院，p=0.5，r=5`。状态迁移7可以描述为：`a=去法院，p=0.8，r=20`；状态迁移8可以描述为：`a=不去法院，p=0.2，r=-20`。状态迁移9可以描述为：`a=不去法院，p=0.5，r=-10`；状态迁移10可以描述为：`a=去法院，p=0.5，r=10`。状态迁移11可以描述为：`a=去法院，p=0.8，r=30`；状态迁移12可以描述为：`a=不去法院，p=0.2，r=-30`。状态迁移13可以描述为：`a=去法院，p=0.7，r=-15`；状态迁移14可以描述为：`a=不去法院，p=0.3，r=-15`。状态迁移15可以描述为：`a=去法院，p=0.3，r=5`；状态迁移16可以描述为：`a=不去法院，p=0.7，r=-5`。状态迁移17可以描述为：`a=去法院，p=0.4，r=20`；状态迁移18可以描述为：`a=不去法院，p=0.6，r=-20`。状态迁移19可以描述为：`a=不去法院，p=0.7，r=15`；状态迁移20可以描述为：`a=去法院，p=0.3，r=-15`。


    强化学习的监督信息是智能体从环境获得奖励，环境状态的迁移和回馈的奖励不是完全受智能体控制，智能体通过执行动作和观察动作执行后的状态迁移来感知和理解环境，从而在动作的选择上影响环境。强化学习的监督机制和分类与回归任务不同，机器或者训练集并没有直接指导智能体下一步该执行哪一个操作，而是不断尝试各种可能的动作，实现总的奖励值的最大化。总的奖励值是每个动作所产生的奖励的总和，智能体无法前瞻性地预测总的奖励值，只能从当前环境状态考虑，选择期望能够最大化奖励值的动作或操作。实际上，单步动作产生的奖励值并非是确定值，而是服从某种概率分布，少数的尝试并不能帮助智能体确定期望的动作。因此，强化学习是不断与环境交互和试错的监督学习方法。


    ## 2.5 假设空间


    机器学习从样本中进行学习，每一个样本是一个具体的实例。在案例数据集中，一个样本包含在原告、被告、法院、案由和日期等特征上的取值，也是抽象概念“案件”的具体实例和描述。在逻辑学中，归纳和演绎是最基本的逻辑方法。归纳方法是从具体现象中总结出一般性规律，例如观察冬夏季的气温。


    从7月1日开始观察，连续观察9天，最高气温分别是35.5、36.0、35.0、37.5、36.5、35.0、38.0、37.5和38.0（单位均为摄氏度），样本标签都为夏季。从12月1日开始观察，连续观察9天，最高气温分别是11.5、12.0、9.0、8.5、9.5、11.0、10.0、10.5和10.0（单位均为摄氏度），样本标签都为冬季。将上述的气温观察数值作为训练数据集进行学习，分类器提出一些假设，最高气温超过一个阈值`a`就为夏天，最高气温低于一个阈值`b`即为冬季。关于夏季的最高气温假设可能是一个集合，`a={36.0，35.5，35.0，34.5，34.0，33.5，33.0，32.5，32，31.5，31.0，30.5，30.0，…}`。关于冬季的最高气温假设可能是一个集合，`b={11.0，11.5，12.0，12.5，13.0，13.5，14.0，14.5，15.0，15.5，16.0，16.5，17.0，…}`。这些假设构成一个假设空间，分类器从这些假设空间搜索，寻找那些与训练集数据匹配或者吻合的假设。


    显然，在假设空间`a`中，最高气温为36.0摄氏度和35.5摄氏度并不能匹配从7月1日连续观察的9天数值，排除不符合训练集的假设以后，假设空间为`{35.0，34.5，34.0，33.5，33.0，32.5，32，31.5，31.0，30.5，30.0，…}`。在假设空间`b`中，最高气温为11.0摄氏度和11.5摄氏度并不能匹配从7月1日连续观察的9天数值，排除不符合训练集的假设以后，假设空间为`{12.0，12.5，13.0，13.5，14.0，14.5，15.0，15.5，16.0，16.5，17.0，…}`。训练集数据规模越大，排除的假设就越多，分类器习得的模型就越准确。


    在回归学习任务中，输入的特征为`feature_1`，输出为响应变量`y`，如图2.10所示。例如，学习目标是寻找经济赔偿案件中的赔付数额与地区发展水平的关系，特征`feature_1`为地区的量化值，输出`y`为赔偿金额。对于学习模型的假设，可以提出线性关系的假设，也可以提出一元二次关系的假设。图中的两个点代表训练样本有两个，假设输出与输入的关系符合线性关系，`y=a*feature_1+b`，`a`和`b`是参数，求解含有两个参数的方程需要两个样本点。因此，线性关系假设可以完全拟合两个样本点。假设输出与输入的关系符合一元二次关系，`y=a*(feature_1)2+b*feature_1+c`，参数包括`a`、`b`和`c`，用两个样本点求解含有三个参数的方程，将产生两个约束变量和一个自由变量。因此，存在很多一元二次多项式假设也能完全拟合这两个样本点。


    ![](images/txt002_10.jpg "pagenumber_ebook=55,pagenumber_book=46")


    图2.10　线性和二次回归假设的完全拟合

