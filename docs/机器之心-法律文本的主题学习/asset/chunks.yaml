    \n从图中可以看出，单词“Music”和“Honour”首字母大写不是因为他们处在句首位置，而是由于专有名词的缘故。对于专有名词的首个字母大写是有特殊意义的，一般作为人名、地址或者结构名，不应改成小写。在改成小写字母之前应该由命名实体识别出来，如图5.47所示:\n\
