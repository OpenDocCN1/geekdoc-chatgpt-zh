    \ Language Toolkit`），提供了大量简单易用的自然语言文本处理功能，包括语料库获取、字符串处理、中文分词、词性标记、语义解析、文本分类、搭配发现、概率估计、情感分析、文本相似度计算、评测指标、`WordNet`应用和统计机器学习等。\n\
    \n`Python`自然语言处理库还包括`Jieba`、`Pattern`、`TextBlob`、`Polyglot`、`Spacy`、`Gensim`、`Snownlp`等。\n\
    \n- **Jieba**：一个面向中文语言处理的`Python`库，可以进行中文分词、繁体分词、自定义词典、关键词抽取和词频统计等，支持精确模式、搜索引擎模式和全模式。\n\
    - **Pattern**：一个网络数据分析和挖掘工具，支持词性标注、`N`元搜索、文本分类、情感分析、可视化呈现和`WordNet`，同时也支持用于机器学习的向量空间模型、支持向量机、潜在语义分析、聚类和主题模型。\n\
    - **TextBlob**：一个用来进行自然语言处理和文本数据分析的`Python`库，主要包括词性标注、名词短语提取、社会情感分析、文本分类、文本翻译等功能。\n\
    - **Polyglot**：支持多语言环境下的词性标注、专业名词标记、语言嵌入、情感分析、形态分析和语言翻译。\n- **Spacy**：商业开源领域中的最为快速的自然语言处理软件，提供文本分词、词性标注、命名实体识别、名词短语抽取等功能。\n\
    - **Gensim**：能够在大于内存的语料库上进行主题建模的自然语言处理工具，提供文件索引、相似度检索和语义建模等功能，可以说是在纯文本无监督的主题建模中的最为健壮的`Python`库。\n\
    - **Snownlp**：与`Jieba`类似，也是一个中文自然语言处理的`Python`扩展库，支持`unicode`编码的中文文本的分词、断句、词性标注、情绪判断、拼音、繁体转简体、关键词提取、概况总结文章、信息度量、文本相似度计算等功能。\n\
    \n# Python安装机器学习和自然语言处理类库\n\n## Python安装\n\n目前三大主流操作系统，即`Windows`、`macOS`、`Linux`，都支持`Python`的安装。安装程序和相关文档都可以从官方网站（`https://www.python.org`）下载。推荐使用最新的`Python`版本，当前的版本为`Python\
    \ 3.x.y`，虽然大部分`Python`程序代码可以兼容`Python 2.x.y`，但是`Python 2`和`Python 3`还是存在一些区别，两者的区别可以浏览`https://wiki.python.org/moin/python2orpython3`。\n\
    \n### Windows安装\n\n在`Windows`操作系统下安装`Python`，需要通过`Windows Installer`来配置和管理软件和应用服务。先要确定`Windows`操作系统启用`Windows\
    \ Installer`安装服务，然后在官方上的`Python Releases for Windows`下载安装包。`Python 2`的安装包为`Windows\
    \ XXX MSI Installer`，`Python 3`的安装包为`Windows XXX Executable Installer`。`XXX`为`x86`表明是32位计算机系统，`XXX`为`x86-64`表明是64位计算机系统。根据具体计算机系统情况，选择合适的安装包，按照提示进行默认安装，安装成功后进入命令行窗口，输入`python`，能够返回`Python`的版本信息，这表明已经成功安装了`Python`。\n\
    \n### Linux安装\n\n目前较为流行的`Linux`操作系统是`ubuntu`，在`ubuntu`系统下安装`Python`有三种方法：\n\n\
    **第一种方法**：通过`ubuntu`操作系统官方提供的安装工具包。如果需要安装`Python 2`或者`Python 3`，在终端执行：\n\n```\n\
    sudo apt-get install python2\nsudo apt-get install python3\n```\n\n`Python 2`和`Python\
    \ 3`中的`2`和`3`是主版本号，主版本号不同的软件说明进行了大量重写，无法实现向后兼容。`x`是次版本号，两个软件主版本号相同而次版本号不同，说明对软件进行了部分修改，但保持了完全向后兼容。安装成功后在终端输入命令进行确认：\n\
    \n```\npython2 --version\npython3 --version\n```\n\n`y`是内部版本号，主版本号和次版本号相同而内部版本号不同的软件表明来自同一个源代码，但是经过重新编译以适合更改处理器或平台情况。安装时必须提供主版本号和次版本号，内部版本号是可选的。\n\
    \n**第二种方法**：使用个人软件包存档`PPA`（`Personal Package Archive`）来安装，先要设置将要安装应用的来源，然后按照第一种方法进行安装。但是受到安装源的限制，很多时候不能获得更新的安装包。\n\
    \n**第三种方法**：对源代码进行编译安装。首先从官网下载相应版本的源代码并解压文件，然后设置编译和链接选项，最后执行编译操作。正确安装后，可以在终端中输入`python`命令进行验证。\n\
    \n## 包管理工具\n\n### Pip\n\n`Python`第三方扩展库的安装一般通过`Pip`（`Python Install Package`）进行管理，`Pip`安装工具是一个应用广泛的`Python`包管理工具，提供`Python`第三方扩展库的搜索、下载、安装、配置和卸载等功能。`Pip`的安装可以在终端中输入：\n\
    \n```\npython -m ensurepip --upgrade\n```\n\n`Python 3.3`以后的版本都自动包含了`Pip`，作为标准库提供给用户使用。`Pip`安装和管理`Python`第三方扩展库非常方便，使用方法如下：\n\
    \n```\npip install numpy scipy pandas\npip install scikit-learn\npip install nltk\
    \ jieba\npip install matplotlib\n```\n\n上述命令分别安装一些数值运算和工程数据处理的包、机器学习的包、自然语言处理的包和数据可视化的包。如果需要确认是否安装成功，可以在终端中输入`python`，进入`Python`环境，通过能否导入包操作来确定包安装的成功。\n\
    \n```\npython -c \"import numpy; print(numpy.__version__)\"\n```\n\n已经安装的`Python`第三方扩展库可以列表显示出来，也可以显示指定包的安装情况和详细信息，查看可以升级的包已经进行包更新操作，对不再需要的`Python`包可以删除。在新的版本发布后，可以通过包管理工具`Pip`进行更新操作，如果需要更新`Python`包，操作如下：\n\
    \n```\npip list\npip show numpy\npip list --outdated\npip install --upgrade numpy\n\
    pip uninstall numpy\n```\n\n### Conda/Anaconda\n\n在很多`Python`应用环境中，尤其各种应用包的版本更新迭代非常快，在这种情况下包管理和环境管理变得非常困难。作为数据分析的环境管理和包管理器，`Anaconda`被强烈推荐使用。`Anaconda`是一个侧重于科学计算的开源免费的`Python`发行版本，将所有数据科学、数学和工程的`Python`包捆绑在一起，并提供`Python`的标准库、几百个数据科学包及其依赖项。`Anaconda`通过`Conda`来管理包的安装、卸载以及更新操作，并且可以为每一个第三方包版本创建一个环境，将应用部署到相关的环境中。因此，`Conda`可以很容易实现不同版本的`Python`包共存，为不同的应用创建各自的运行环境。`Anaconda`的安装包或者安装程序可以浏览站点`http://continuum.io/downloads`，如果需要进一步了解`Anaconda`的使用方法，快速入门指南可以访问站点`https://conda.io/docs/testdrive.html`。在成功安装了`Anaconda`之后，安装任何`Python`第三方扩展库可以在终端中输入：\n\
    \n```\nconda install numpy scipy pandas scikit-learn nltk jieba matplotlib\n```\n\
    \n`Conda`的包管理功能和操作方法与`Pip`相似，可以查看已经安装的包，可以更新已经安装的包，也可以删除已经安装的包。\n\n```\nconda\
    \ list\nconda update numpy\nconda remove numpy\n```\n\n## Polyglot安装详解\n\n`Polyglot`是能够支持`Pipeline`功能的自然语言处理的`Python`第三方类库，可以实现分句、分词、词性标注、命名实体识别、情感分析、词嵌入和翻译等功能。安装`Polyglot`之前需要先安装它的一些依赖项`libicu-dev`、`pycld2`、`morfessor`、`morph2.en`等。使用`Pip`安装经常会遇到镜像源无法下载的情况，解决办法就是重新指定下载镜像源。选项“`-i`”是输入镜像地址，国内几个镜像源都可以尝试安装。\n\
    \n```\npip install -i https://pypi.tuna.tsinghua.edu.cn/simple polyglot\npip install\
    \ -i https://pypi.tuna.tsinghua.edu.cn/simple pycld2 morfessor\n```\n\n上述安装完成后，可能还无法导入`Polyglot`类库，原因在于一个与`libicui18n`有关的动态链接库无法查找到，此时需要设置系统环境变量`LD_LIBRARY_PATH`。程序在运行时可能调用一些系统提供的或者第三方提供的共享动态链接库，一般情况下会在系统默认路径下查找，如果找不到所需文件，再去`LD_LIBRARY_PATH`环境变量指定的位置去找。可以在终端的`Shell`中直接为系统环境变量添加路径，然后更新设置。找到该动态链接库的位置，进入到相应目录，修改文件访问权限。\n\
    \n```\nexport LD_LIBRARY_PATH=$LD_LIBRARY_PATH:~/anaconda3/lib\nsource ~/.bashrc\n\
    ```\n\n这种属于临时修改环境变量，重新启动系统或者打开另一个终端，又恢复到修改之前的状态。如果要永久地修改环境变量`LD_LIBRARY_PATH`，可以在环境配置文件`~/.bashrc`中修改。用文本编辑程序打开环境配置文件，在`LD_LIBRARY_PATH`部分的后面添加“`:\
    \ ~/anaconda3/lib`”，保存`~/.bashrc`文件并退出，在终端`Shell`中使用`source`更新设置。\n\n```\necho\
    \ 'export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:~/anaconda3/lib' >> ~/.bashrc\nsource\
    \ ~/.bashrc\n```\n\n# 爬虫获取语料\n\n## 网络爬虫介绍\n\n随着计算机网络尤其互联网的迅速发展，每天增长的数据量从过去以`TB`（约一万亿字节）为计算单位发展到现在以`ZB`（约一百亿亿字节）来计算，其中很多是文本数据，它们大部分嵌入在网页结构当中，需要经过处理才能使用。从网页中获取数据并进行分析的过程称为网络爬虫，是获得机器学习和自然语言处理的数据集的有效途径之一。\n\
    \n网络爬虫的使用在法律上还存在很多争议，在涉及知识产权、个人隐私、反垄断和不正当竞争方面都有合法性的质疑。目前，网络爬虫的哪些行为是合法的还处于探索阶段，在很多国家，允许使用网络爬虫技术进行科学研究和教育学习。如果将网络抓取的数据用于商业盈利，那么数据来源和类型对网络爬虫合法性使用的判断将产生决定性的影响。例如，用爬虫从各个公司或机构官网抓取公开的联系人电话清单可能是被允许的，这些电话清单是客观真实的，网络爬虫程序在获取网页数据时，就性质而言相当于比较高效的人工访问用户。在抓取一些明显带有知识产权标记的内容时，传播和转载这类数据将是不合法的。在抓取层次比较浅的数据时，可以适用公开高效访问规则，但是在抓取层次较高的深度链接时，通过交叉分析可能涉及侵犯商业机密或者个人隐私。无论出于什么目的，使用网络爬虫程序都应以合法合规为前提，合理使用抓取的数据。\n\
    \n## 网络爬取过程\n\n用户访问网站返回的结果为网页，通过程序代码自动下载所需网页，称为爬取。在`Python`中的第三方扩展`urllib`库支持网络请求和访问相关操作的函数，定义网页下载的函数：\n\
    \n```\nimport urllib.request\n\ndef download_page(url):\n    response = urllib.request.urlopen(url)\n\
    \    return response.read().decode('utf-8')\n```\n"
  trans: "\n\n# Python Standard Library and Third-Party Extension Libraries\n\n##\
    \ Standard Library Overview\n\nThe standard library is a collection of functions\
    \ or modules that perform the most basic functionalities, including basic input/output\
    \ processing, string processing, storage management, CPU management, file operations,\
    \ numerical computation, database management, network transmission, and graphical\
    \ user interfaces, among others. Providing a vast and powerful standard library\
    \ is a distinctive feature of the `Python` language and one of the reasons for\
    \ its current popularity. The powerful `Python` Standard Library provides functionalities\
    \ such as file handling, text processing, operating system support, network transmission\
    \ and secure communication management, as well as mathematical and functional\
    \ programming support.\n\n## Standard Library Categories\n\n### File Handling\n\
    \n`Python` standard libraries for file handling include modules such as `os`,\
    \ `file`, `glob`, `pathlib`, `tempfile`, `linecache`, `csv`, `configparser`, `pickle`,\
    \ `sqlite3`, and `shutil`. These cover file read/write operations, temporary file\
    \ creation, file path handling, file compression and configuration, `csv` file\
    \ processing, data persistence, file read optimization caching, filename regex\
    \ querying, database management support, and file status viewing, among other\
    \ related functions.\n\n### Text Processing\n\nStandard libraries for text processing\
    \ include modules such as `re`, `string`, `textwrap`, `difflib`, `base64`, and\
    \ `codecs`. These provide tools and functions for string processing, formatted\
    \ text output, regex fuzzy matching, text sequence difference calculation, data\
    \ encoding and decoding, binary data conversion, and `Unicode` encoding support.\n\
    \n### Operating System Interaction Management\n\nStandard libraries for OS interaction\
    \ management include modules such as `os`, `time`, `io`, `logging`, `getpass`,\
    \ `threading`, `multiprocessing`, `subprocess`, `queue`, `concurrent`, `platform`,\
    \ `sys`, `builtins`, `inspect`, and `contextlib`. These cover multi-threading\
    \ and multi-processing concurrent execution support, memory read/write `IO` and\
    \ reuse, date/time and timing support, log generation and processing, synchronization\
    \ queue support, inter-process communication and invocation support, runtime services,\
    \ system environment interaction, object introspection, and context management\
    \ functions.\n\n### Network Transmission and Communication Management\n\nStandard\
    \ libraries for network transmission and communication management include modules\
    \ such as `json`, `base64`, `webbrowser`, `wsgiref`, `uuid`, `ftplib`, `poplib`,\
    \ `imaplib`, `smtplib`, `requests`, `scrapy`, `http`, `beautifulsoup`, `ssl`,\
    \ `hashlib`, `secrets`, `paramiko`, and `pycrypto`. These cover browser management\
    \ and manipulation, Universally Unique Identifiers (UUID), `HTTP` requests, connection\
    \ pool support, `cookies` session support, `HTTP` proxy, File Transfer Protocol,\
    \ `POP` protocol, Simple Mail Transfer Protocol, `HTML` parsing, network socket\
    \ support, `W3C` format support, secure network communication, `SSH` client management,\
    \ hash digest support, and encryption/decryption processing functions.\n\n###\
    \ Mathematics and Functional Programming\n\nStandard libraries for mathematics\
    \ and functional programming include modules such as `random`, `math`, `fractions`,\
    \ `statistics`, `itertools`, `functools`, and `operator`. These provide functions\
    \ for random number generation, mathematical functions, fraction functions, statistical\
    \ function processing, iterator tool management, function tools, and basic operators.\n\
    \n## Commonly Used Standard Libraries\n\nCommonly used standard libraries include\
    \ the `os` module for interacting with the operating system, the `sys` module\
    \ for interacting with the `Python` interpreter and runtime environment, the `codecs`\
    \ module related to file management operations, the `re` module for fuzzy regex\
    \ matching, the `requests` module related to network transmission and application\
    \ requests, and the `math` module for mathematical functions and formulas, among\
    \ others.\n\n## Third-Party Extension Libraries\n\nThe `Python` community provides\
    \ users with hundreds of thousands of third-party extension libraries. Different\
    \ extension libraries can reference each other, and their usage methods are the\
    \ same as the standard library. `Python` third-party extension libraries are extremely\
    \ powerful, covering fields such as scientific computing, data visualization,\
    \ data analysis, text processing, image processing, `Web` development, database\
    \ management, `GUI` graphical interfaces, web crawling, virtual reality, cryptography,\
    \ network application development, machine learning, and natural language processing.\
    \ The `Python` community's project `PyPI` (`Python Package Index`) is the main\
    \ site maintaining the global `Python` ecosystem; its URL is `https://pypi.org`.\
    \ You can use `pip` to download and install `Python` libraries and modules. Third-party\
    \ extension libraries can be written in `Python` or `C`. If written in `C`, the\
    \ `Python` extension tools `SIP` and `SWIG` are commonly used to convert `C` program\
    \ modules into `Python` program modules. The `Python` extension tool `Boost.Python`\
    \ supports mutual invocation between `Python` programs and `C++` programs. Therefore,\
    \ `Python`'s support for third-party extension libraries is very friendly, allowing\
    \ flexible conversion between various interface libraries.\n\n# Python Scientific\
    \ Computing and Machine Learning\n\n## Scientific Computing Libraries\n\nCommon\
    \ `Python` third-party extension libraries for scientific computing and data analysis\
    \ include `Numpy`, `Scipy`, and `Pandas`.\n\n- **Numpy**: Provides the most basic\
    \ numerical computing functionalities, including multi-dimensional arrays, matrix\
    \ operations, vector calculations, broadcasting functions, Fourier transforms,\
    \ random number generation, and linear algebra, among others. The `numpy` library\
    \ implemented in `C` computes fast with excellent performance, providing support\
    \ for other libraries such as `Scipy`, `Pandas`, and `Sklearn`.\n- **Scipy**:\
    \ Provides a large number of engineering numerical computations and mathematical\
    \ algorithms. It is a relatively high-end scientific computing package, including\
    \ sparse matrix operations, linear algebra calculations, algorithm optimization,\
    \ Fast Fourier Transforms, signal processing, ordinary differential equation solving,\
    \ image processing, sparse graph compression, calculus, numerical fitting, interpolation\
    \ processing, mathematical and physical constants, and special functions. The\
    \ `Scipy` library adds many commonly used functions in engineering mathematics\
    \ on top of `Numpy` and depends on the `Numpy` library.\n- **Pandas**: Also a\
    \ data analysis tool based on `Numpy`, it establishes data types and index relationships,\
    \ converting operations on indices into operations on data, providing convenience\
    \ for fast manipulation of large datasets.\n- **Matplotlib**: Provides 2D visualization\
    \ view operations for data analysis. It is `Python`'s primary data visualization\
    \ library, with hundreds of visualization display effects, bearing a strong resemblance\
    \ to the commercial programming language `Matlab`.\n\n## Machine Learning Libraries\n\
    \n`Python` machine learning libraries include `scikit_learn`, `tensorflow`, and\
    \ `pytorch`, among others.\n\n- **scikit_learn** (also known as `sklearn`): Currently\
    \ the most popular in machine learning tasks, it is the most basic `Python` third-party\
    \ extension library. It widely adopts `Numpy`, `Scipy`, and `Pandas` for high-performance\
    \ array processing, matrix operations, linear algebra, and calculus operations.\
    \ It provides common machine learning models such as classification, logistic\
    \ regression, clustering, Principal Component Analysis, Support Vector Machines,\
    \ neural networks, and reinforcement learning. `scikit_learn` can be easily integrated\
    \ with other `Python` libraries for application, for example, using `Numpy` for\
    \ array vectorization operations, `Scipy` for sparse matrix processing, `Pandas`\
    \ for multi-dimensional index access of DataFrames, and `Matplotlib` for data\
    \ visualization operations.\n- **Tensorflow**: An open-source machine learning\
    \ solution framework based on `Python` launched by the Google Brain team. It is\
    \ an application method of machine learning based on data graphs, using graph\
    \ nodes to represent computations and edges to represent tensors.\n- **PyTorch**:\
    \ An open-source machine learning library launched by `Facebook` AI Research.\
    \ It has powerful tensor computing capabilities and provides automatic differentiation\
    \ for deep neural networks. It can be regarded as a `Numpy` with `GPU` (`Graphics\
    \ Processing Unit`) acceleration, applicable to Natural Language Processing and\
    \ other applications.\n\n# Python Natural Language Processing\n\n## Major NLP\
    \ Libraries\n\nThe most famous `Python` Natural Language Processing library is\
    \ `NLTK` (`Natural Language Toolkit`), which provides a large number of simple\
    \ and easy-to-use natural language text processing functions, including corpus\
    \ acquisition, string processing, Chinese word segmentation, Part-of-Speech tagging,\
    \ semantic parsing, text classification, collocation discovery, probability estimation,\
    \ sentiment analysis, text similarity calculation, evaluation metrics, `WordNet`\
    \ application, and statistical machine learning, among others.\n\n`Python` NLP\
    \ libraries also include `Jieba`, `Pattern`, `TextBlob`, `Polyglot`, `Spacy`,\
    \ `Gensim`, `Snownlp`, etc.\n\n- **Jieba**: A `Python` library oriented towards\
    \ Chinese language processing, capable of Chinese word segmentation, Traditional\
    \ Chinese segmentation, custom dictionaries, keyword extraction, and word frequency\
    \ statistics, supporting precise mode, search engine mode, and full mode.\n- **Pattern**:\
    \ A web data analysis and mining tool supporting Part-of-Speech tagging, `N`-gram\
    \ search, text classification, sentiment analysis, visualization presentation,\
    \ and `WordNet`. It also supports Vector Space Models, Support Vector Machines,\
    \ Latent Semantic Analysis, clustering, and topic models for machine learning.\n\
    - **TextBlob**: A `Python` library for Natural Language Processing and text data\
    \ analysis, mainly including Part-of-Speech tagging, noun phrase extraction, social\
    \ sentiment analysis, text classification, and text translation functions.\n-\
    \ **Polyglot**: Supports Part-of-Speech tagging, named entity recognition, language\
    \ embeddings, sentiment analysis, morphological analysis, and language translation\
    \ in multilingual environments.\n- **Spacy**: The fastest NLP software in the\
    \ commercial open-source domain, providing text tokenization, Part-of-Speech tagging,\
    \ Named Entity Recognition, and noun phrase extraction functions.\n- **Gensim**:\
    \ An NLP tool capable of topic modeling on corpora larger than memory, providing\
    \ file indexing, similarity retrieval, and semantic modeling functions. It can\
    \ be said to be the most robust `Python` library for unsupervised topic modeling\
    \ on plain text.\n- **Snownlp**: Similar to `Jieba`, it is also a `Python` extension\
    \ library for Chinese NLP. It supports `unicode` encoded Chinese text segmentation,\
    \ sentence splitting, Part-of-Speech tagging, sentiment judgment, Pinyin, Traditional\
    \ to Simplified conversion, keyword extraction, article summarization, information\
    \ measurement, and text similarity calculation.\n\n# Installing Python Machine\
    \ Learning and NLP Libraries\n\n## Python Installation\n\nCurrently, the three\
    \ major mainstream operating systems—`Windows`, `macOS`, `Linux`—all support `Python`\
    \ installation. Installation programs and related documentation can be downloaded\
    \ from the official website (`https://www.python.org`). It is recommended to use\
    \ the latest `Python` version, currently `Python 3.x.y`. Although most `Python`\
    \ code is compatible with `Python 2.x.y`, differences still exist between `Python\
    \ 2` and `Python 3`. These differences can be viewed at `https://wiki.python.org/moin/python2orpython3`.\n\
    \n### Windows Installation\n\nTo install `Python` on `Windows`, you need to configure\
    \ and manage software and application services via `Windows Installer`. First,\
    \ ensure the `Windows Installer` service is enabled. Then download the installation\
    \ package from `Python Releases for Windows` on the official site. The `Python\
    \ 2` package is `Windows XXX MSI Installer`; the `Python 3` package is `Windows\
    \ XXX Executable Installer`. `XXX` as `x86` indicates a 32-bit system; `x86-64`\
    \ indicates a 64-bit system. Select the appropriate package based on your system,\
    \ follow the prompts for default installation. After successful installation,\
    \ open the command prompt, type `python`; if it returns `Python` version info,\
    \ the installation was successful.\n\n### Linux Installation\n\nThe currently\
    \ popular `Linux` OS is `ubuntu`. There are three methods to install `Python`\
    \ on `ubuntu`:\n\n**Method 1**: Use the official installation tool package provided\
    \ by `ubuntu`. To install `Python 2` or `Python 3`, execute in the terminal:\n\
    \n```\nsudo apt-get install python2\nsudo apt-get install python3\n```\n\nThe\
    \ `2` and `3` in `Python 2` and `Python 3` are major version numbers. Different\
    \ major versions indicate extensive rewrites with no backward compatibility. `x`\
    \ is the minor version number; same major but different minor versions indicate\
    \ partial modifications but full backward compatibility. After installation, confirm\
    \ in the terminal:\n\n```\npython2 --version\npython3 --version\n```\n\n`y` is\
    \ the patch version number. Same major and minor but different patch versions\
    \ indicate the same source code but recompiled for different processors or platforms.\
    \ Installation requires major and minor version numbers; patch version is optional.\n\
    \n**Method 2**: Use `PPA` (`Personal Package Archive`) to install. First, set\
    \ the application source, then install using Method 1. However, limited by the\
    \ source, updated packages are often unavailable.\n\n**Method 3**: Compile and\
    \ install from source. First, download the source code for the desired version\
    \ from the official site and decompress. Then set compilation and linking options,\
    \ and finally execute compilation. After correct installation, verify by entering\
    \ the `python` command in the terminal.\n\n## Package Management Tools\n\n###\
    \ Pip\n\n`Python` third-party extension libraries are generally managed via `Pip`\
    \ (`Python Install Package`). `Pip` is a widely used `Python` package management\
    \ tool providing search, download, installation, configuration, and uninstallation\
    \ functions for third-party libraries. `Pip` can be installed by entering in the\
    \ terminal:\n\n```\npython -m ensurepip --upgrade\n```\n\n`Python 3.3` and later\
    \ versions automatically include `Pip` as a standard library. `Pip` makes installing\
    \ and managing third-party libraries very convenient. Usage is as follows:\n\n\
    ```\npip install numpy scipy pandas\npip install scikit-learn\npip install nltk\
    \ jieba\npip install matplotlib\n```\n\nThe above commands install packages for\
    \ numerical computation and engineering data processing, machine learning, NLP,\
    \ and data visualization respectively. To verify successful installation, enter\
    \ `python` in the terminal to enter the `Python` environment and check if the\
    \ package can be imported.\n\n```\npython -c \"import numpy; print(numpy.__version__)\"\
    \n```\n\nInstalled third-party libraries can be listed, and specific package installation\
    \ details can be viewed. You can check for upgradable packages and perform updates,\
    \ or delete unneeded packages. After new versions are released, you can update\
    \ via `Pip`. To update a `Python` package:\n\n```\npip list\npip show numpy\n\
    pip list --outdated\npip install --upgrade numpy\npip uninstall numpy\n```\n\n\
    ### Conda/Anaconda\n\nIn many `Python` application environments, especially where\
    \ package versions iterate rapidly, package and environment management becomes\
    \ very difficult. As an environment and package manager for data analysis, `Anaconda`\
    \ is highly recommended. `Anaconda` is an open-source, free `Python` distribution\
    \ focused on scientific computing. It bundles all data science, math, and engineering\
    \ `Python` packages together, providing the `Python` standard library, hundreds\
    \ of data science packages, and their dependencies. `Anaconda` uses `Conda` to\
    \ manage package installation, uninstallation, and updates, and can create an\
    \ environment for each third-party package version, deploying applications to\
    \ relevant environments. Thus, `Conda` easily allows different versions of `Python`\
    \ packages to coexist, creating separate runtime environments for different applications.\
    \ `Anaconda` installation packages or installers can be found at `http://continuum.io/downloads`.\
    \ For usage, the quickstart guide is at `https://conda.io/docs/test-drive.html`.\
    \ After successfully installing `Anaconda`, you can install any third-party library\
    \ in the terminal:\n\n```\nconda install numpy scipy pandas scikit-learn nltk\
    \ jieba matplotlib\n```\n\n`Conda`'s package management functions and operations\
    \ are similar to `Pip`. You can view installed packages, update them, or remove\
    \ them.\n\n```\nconda list\nconda update numpy\nconda remove numpy\n```\n\n##\
    \ Detailed Polyglot Installation\n\n`Polyglot` is an NLP `Python` third-party\
    \ library supporting `Pipeline` functionality, enabling sentence splitting, tokenization,\
    \ Part-of-Speech tagging, Named Entity Recognition, sentiment analysis, word embeddings,\
    \ and translation. Before installing `Polyglot`, you need to install its dependencies:\
    \ `libicu-dev`, `pycld2`, `morfessor`, `morph2.en`, etc. Using `Pip` often encounters\
    \ issues with mirror sources failing to download. The solution is to specify a\
    \ download mirror source. The \"`-i`\" option specifies the mirror address; several\
    \ domestic mirrors can be tried.\n\n```\npip install -i https://pypi.tuna.tsinghua.edu.cn/simple\
    \ polyglot\npip install -i https://pypi.tuna.tsinghua.edu.cn/simple pycld2 morfessor\n\
    ```\n\nAfter the above installation, you might still fail to import the `Polyglot`\
    \ library. The reason is usually that a dynamic link library related to `libicui18n`\
    \ cannot be found. At this point, you need to set the system environment variable\
    \ `LD_LIBRARY_PATH`. When a program runs, it may call shared dynamic libraries\
    \ provided by the system or third parties. Usually, it searches in default system\
    \ paths; if not found, it searches paths specified in `LD_LIBRARY_PATH`. You can\
    \ add the path to the system environment variable directly in the terminal `Shell`\
    \ and update the settings. Locate the dynamic library, navigate to the directory,\
    \ and modify file access permissions.\n\n```\nexport LD_LIBRARY_PATH=$LD_LIBRARY_PATH:~/anaconda3/lib\n\
    source ~/.bashrc\n```\n\nThis is a temporary modification; restarting the system\
    \ or opening a new terminal reverts to the previous state. To permanently modify\
    \ `LD_LIBRARY_PATH`, edit the environment config file `~/.bashrc`. Open the config\
    \ file with a text editor, append \"`: ~/anaconda3/lib`\" to the `LD_LIBRARY_PATH`\
    \ section, save and exit, then use `source` in the terminal `Shell` to update.\n\
    \n```\necho 'export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:~/anaconda3/lib' >> ~/.bashrc\n\
    source ~/.bashrc\n```\n\n# Crawling for Corpora\n\n## Web Crawler Introduction\n\
    \nWith the rapid development of computer networks, especially the Internet, daily\
    \ data growth has evolved from `TB` (approx. one trillion bytes) to `ZB` (approx.\
    \ one sextillion bytes). Much of this is text data, mostly embedded in web page\
    \ structures, requiring processing before use. The process of acquiring data from\
    \ web pages and analyzing it is called web crawling, an effective way to obtain\
    \ datasets for machine learning and NLP.\n\nThe legality of web crawlers is still\
    \ controversial, with questions regarding intellectual property, personal privacy,\
    \ anti-trust, and unfair competition. Currently, which crawler behaviors are legal\
    \ is still exploratory. In many countries, using crawler technology for scientific\
    \ research and education is permitted. If crawled data is used for commercial\
    \ profit, the data source and type will decisively influence the legality judgment.\
    \ For example, crawling public contact lists from company/organization websites\
    \ may be allowed, as these lists are objectively real; the crawler acts essentially\
    \ as a highly efficient manual visitor. However, crawling content with clear IP\
    \ markings for redistribution is illegal. For shallow-level data, the \"public\
    \ efficient access\" rule may apply, but for deep links, cross-analysis may infringe\
    \ trade secrets or privacy. Regardless of purpose, crawler usage must be legal\
    \ and compliant, and data used reasonably.\n\n## Web Crawling Process\n\nThe result\
    \ of a user visiting a website is a web page. Automatically downloading required\
    \ web pages via program code is called crawling. In `Python`, the third-party\
    \ extension `urllib` library supports functions for network requests and access\
    \ operations. Define a web page download function:\n\n```\nimport urllib.request\n\
    \ndef download_page(url):\n    response = urllib.request.urlopen(url)\n    return\
    \ response.read().decode('utf-8')\n```\n\n"
