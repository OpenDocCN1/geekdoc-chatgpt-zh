    4.5　狄利克雷分布


    4.5.1　多项分布


    对于随机事件X，事件发生用1表示，不发生用0表示。X的发生概率为θ，不发生的概率为1-θ，这种分布称为伯努利分布。伯努利试验是一次试验，并且只有两个简单的试验结果，发生或不发生，正面或反面，等等。例如，将硬币抛出一次，事件正面朝上的概率为:


    ![](images/txt004_27.jpg "pagenumber_ebook=120,pagenumber_book=111")


    将伯努利试验独立重复进行n次，随机事件X发生的次数为k，也就在n次试验中事件发生k次，随机变量概率分布就是二项分布。例如，将硬币抛出n次，正面朝上出现k次的概率为:


    ![](images/txt004_28.jpg "pagenumber_ebook=120,pagenumber_book=111")


    前k次试验正面朝上，后面的n-k次试验正面朝下，根据概率乘法原理，这一事件的概率为θk(1-θ)n-k ，n次试验出现k次正面朝上的事件组合有![](images/txt004_29.jpg
    "pagenumber_ebook=121,pagenumber_book=112")种。多类分布是将伯努利分布的实验结果从两种改为多种，即K种结果。例如，投掷一次骰子，第k面朝上的概率为:


    ![](images/txt004_30.jpg "pagenumber_ebook=121,pagenumber_book=112")


    将二项分布的每次两种试验结果，推广至每次试验有多种结果，且重复进行多次独立试验，这就是多项分布。例如，投掷n次骰子，出现第一面朝上的次数为m1，第二面朝上的次数为m2，第K面朝上的次数为mK，其概率密度为:


    ![](images/txt004_31.jpg "pagenumber_ebook=121,pagenumber_book=112")


    多项分布的概率公式是一种多项式展开式的通项。根据乘法公式，对(X1+X2+…XK)随机进行n次试验的概率为(θ1+θ2+… +θK)n，事件(X1+X2+…XK)为一个必然事件，对必然事件进行n次采样的概率之和为1。当把多项式展开很多项时，根据概率的加法公式，说明展开项都是互不相容事件对应的概率，即多项分布是多项式的一个展开项的通项，或者说是一个特殊事件出现的概率，例如X1出现m1次，X2出现m2次，Xk出现mk次。在主题模型中，X1为第一个主题编号，m1是被分配为第一个主题的词数。Xk为第k个主题编号，mk是被分配为第k个主题的词数。


    4.5.2　从beta分布到dirichlet分布


    在二项分布中，出现正面朝上的概率θ为多少合适，直观的猜测可能是0.5。如果正面和反面质量不是均匀的，作为先验概率，θ取［0，1］都是有可能的。在试验次数足够多的情况下，可以以正面出现的频次作为θ值。如果仅仅投掷一次，发生正面朝上，将概率值估计为100%，显然是不合理的。正常情况下，先验概率θ可以取0.5，在100次试验中，发生X次正面朝上的概率密度应该中间大两端小，X从0到100，如图4.9所示。


    ![](images/txt004_32.jpg "pagenumber_ebook=122,pagenumber_book=113")


    图4.9　二项分布概率密度


    不管硬币投掷试验中有几次正面朝上，对于先验概率θ的初步认识大概是概率值取中间的可能性要显著大于取两端的值。随着试验证据X的增加，先验概率θ的分布逐步调整为后验概率，也就是θ可能就不再是均匀分布，天平向证据X倾斜。根据贝叶斯公式:


