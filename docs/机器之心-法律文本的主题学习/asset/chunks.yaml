    `root.tag` 和 `root.attrib` 可以获取根节点的标签和属性。通过根节点的迭代循环，使用 `child.tag` 和 `child.attrib`
    遍历第二层节点的标签和属性。通过一个第二层节点的迭代循环，使用 `children.tag` 和 `children.attrib` 遍历第三层节点的标签和属性。


