    ### 7.1.3 Chinese Text Vector Space Model Based on Legal Terms


    For legal text processing, feature spaces based on legal terms and feature spaces
    based on general words are established separately. The aforementioned file for
    the Chinese legal text corpus CJO, after word frequency statistics based on legal
    terms, is `CJO_based_legalterms_feature_representation.txt` (see Figure 7.13).
    A vector space model is established with the aid of Python''s third-party libraries:
    regular expression `re` and sparse matrix `scipy.sparse`. As shown in Figure 7.15:


    ![](img/txt007_15.jpg "pagenumber_ebook=195,pagenumber_book=186")


    Figure 7.15　Importing re and scipy.sparse


    The vector space model is generally a sparse matrix. The function `csr_matrix()`
    stores the original matrix through three arrays. The first parameter `data` contains
    all non-zero values in the sparse matrix; the second parameter `indices` contains
    the column indices of all non-zero values; the third parameter `indptr` contains
    the index in `data` where the non-zero values of each row start. For example,
    the non-zero values of the first row are `data[indptr[0]:indptr[1]]`, and their
    column indices are `indices[0:(indptr[1]-indptr[0])]`. Similarly, the non-zero
    values of the second row are `data[indptr[1]:indptr[2]]`, and their column indices
    are `indices[(indptr[1]-indptr[0]):(indptr[2]-indptr[1])]`. As shown in Figure
    7.16:


