- raw: '标准库是完成最基本功能的函数或者模块集合，包括基本输入输出处理、字符串处理、存储管理、CPU管理、文件操作、数值计算、数据库管理、网络传输以及图形界面等。提供一个庞大且强大的标准库是Python语言的一个显著特点，也是当下Python备受欢迎的原因之一。强大的Python标准库
    (Python Standard Library)提供了文件处理、文本处理、操作系统支持、网络传输与安全通信管理以及数学和函数式编程支持等功能。


    Python用于文件处理的标准库有os、file、glob、pathlib、tempfile、linecache、csv、configparser、pickle、sqlite3和shutil等模块，包括文件读写操作、临时文件创建、文件路径处理、文件压缩与配置、csv文件处理、数据持久化、文件读取优化缓存、文件名正则查询、数据库管理支持以及文件状态查看等相关函数。


    用于文本处理的标准库有re、string、textwrap、difflib、base64、codecs等模块，包括字符串处理、格式化输出文本、正则表达式模糊匹配、文本序列差异计算、数据编码和解码、二进制数据转换、Unicode编码支持等工具和函数。


    用于操作系统交互管理的标准库有 os、time、io、logging、getpass、threading、 multiprocessing、 subprocess、
    queue、 concurrent、 platform、 sys、builtins、inspect、contextlib等模块，包括多线程与进程并发执行支持、内存读写IO和复用、日期时间和计时支持、日志生成与处理、同步队列支持、进程间通信与调用支持、运行时服务、系统环境交互、获取对象信息、管理上下文等函数。


    用于网络传输和通信管理的标准库有 json、base64、webbrowser、wsgiref、uuid、ftplib、 poplib、 imaplib、
    smtplib、 requests、 scrapy、 http、 beautifulsoup、ssl、hashlib、secrets、paramiko、pycrypto等模块，包括浏览器管理与操纵、通用唯一标识码、http请求、连接池支持、cookies会话支持、http代理、文件传输协议、pop协议、简单邮件传输协议、html解析、网络套接字支持、W3C格式支持、网络安全通信、ssh客户端管理、哈希摘要支持、加密解密处理等函数。


    用于数学和函数式编程的标准库有random、math、fractions、statistics、itertools、functools、operator等模块，包括随机数产生、数学函数、分数函数、统计函数处理、迭代工具管理、函数工具和基本运算符等函数。


    标准库中比较常用的有与操作系统交互的os模块，与Python解释器和运行环境交互的sys模块，与文件管理操作有关的codecs模块，与模糊正则表达式匹配的re模块，与网络传输和应用请求有关的requests模块，以及与数学函数和公式有关的math模块，等等。


    Python社区为用户提供了多达几十万个第三方扩展库，不同扩展库之间可以互相引用，使用方法与标准库一样。Python第三方扩展库的功能非常强大，覆盖了科学计算、数据可视化、数据分析、文本处理、图像处理、Web开发、数据库管理、GUI图形界面、网络爬虫、虚拟现实、密码学、网络应用开发、机器学习和自然语言处理等诸多领域。Python社区的项目PyPI(Python
    Package Index)是维护Python全球生态的主站，其网址为:https://pypi.org，可以使用pip下载安装Python库和模块。可以使用Python语言或者C语言来编写第三方扩展库。如果用C语言编写第三方扩展库，常用Python扩展工具SIP和SWIG将C语言程序模块转换为Python程序模块。Python扩展工具Boost:Python支持Python程序和C++程序互相调用。因此，Python对第三方扩展库的支持非常友好，容易实现各种接口库之间的灵活转换。


    1.4.3　Python科学计算和机器学习


    Python常用于科学计算和数据分析的第三方扩展库有 Numpy、Scipy和Pandas。Numpy扩展库提供最基本的数值计算功能，包括高维数组、矩阵运算、矢量计算、广播函数、傅里叶变换、随机数生成以及线性代数等。C语言实现的numpy库计算速度快，性能优异，为Scipy、Pandas和Sklearn等其他库提供支持。Scipy扩展库提供大量工程数值计算和数学算法，是比较高端的科学计算包，包括稀疏矩阵运算、线性代数计算、算法优化、快速傅里叶变换、信号处理、常微分方程求解、图像处理、稀疏图压缩、微积分、数值拟合、插值处理、数学物理常数、特殊函数等。Scipy库在Numpy基础上增加了很多工程数学上的常用函数，依赖于Numpy库。Pandas扩展库也是基于Numpy的数据分析工具，建立数据类型和索引关系，实现从对索引的操作转换到对数据的操作，为快速操作大型数据提供了便利。Matplotlib扩展库提供数据分析的二维可视化视图操作，是Python最主要的数据可视化功能库，有数百种的可视化显示效果，与商业化程序设计语言Matlab较为相似。


    Python机器学习库有scikit\_learn、tensorflow和pytorch等。在机器学习任务中，当前最为流行的是scikit\_learn，或者称为sklearn，是最基本的Python第三方扩展库，广泛采用Numpy、Scipy以及Pandas进行高性能的数组处理、矩阵运算、线性代数和微积分运算，提供分类、逻辑回归、聚类、主成分分析、支持向量机、神经网络和强化学习等常用机器学习模型。scikit\_learn可以很容易与其他Python库集成在一起应用，例如，用Numpy进行数组矢量化操作，用Scipy进行稀疏矩阵处理，用Pandas进行数据帧多维度索引访问，用Matplotlib进行数据可视化操作。


    Tensorflow是谷歌大脑团队推出的基于Python的开源机器学习解决方案框架，是一种以数据图为基础、用图节点表示计算、用边代表张量的机器学习的应用方式。PyTorch是由Facebook人工智能研究院推出的开源机器学习库，具有强大的张量计算能力，提供自动求导的深度神经网络功能，可以看作是一个加入了GPU(Graphics
    Processing Unit)的Numpy，可用于自然语言处理等应用。


    1.4.4　Python 自然语言处理


    Python最著名的自然语言处理库是NLTK(Natural Language Toolkit)，提供了大量简单易用的自然语言文本处理功能，包括语料库获取、字符串处理、中文分词、词性标记、语义解析、文本分类、搭配发现、概率估计、情感分析、文本相似度计算、评测指标、WordNet应用和统计机器学习等。


    Python自然语言处理库还包括 Jieba、Pattern、TextBlob、Polyglot、Spacy、Gensim、Snownlp等。Jieba是一个面向中文语言处理的Python库，可以进行中文分词、繁体分词、自定义词典、关键词抽取和词频统计等，支持精确模式、搜索引擎模式和全模式。Pattern是一个网络数据分析和挖掘工具，支持词性标注、N元搜索、文本分类、情感分析、可视化呈现和WordNet，同时也支持用于机器学习的向量空间模型、支持向量机、潜在语义分析、聚类和主题模型。TextBlob是一个用来进行自然语言处理和文本数据分析的Python库，主要包括词性标注、名词短语提取、社会情感分析、文本分类、文本翻译等功能。Polyglot支持多语言环境下的词性标注、专业名词标记、语言嵌入、情感分析、形态分析和语言翻译。Spacy是商业开源领域中的最为快速的自然语言处理软件，提供文本分词、词性标注、命名实体识别、名词短语抽取等功能。Gensim是能够在大于内存的语料库上进行主题建模的自然语言处理工具，提供文件索引、相似度检索和语义建模等功能，可以说是在纯文本无监督的主题建模中的最为健壮的Python库。Snownlp与Jieba类似，也是一个中文自然语言处理的
    Python扩展库，支持unicode编码的中文文本的分词、断句、词性标注、情绪判断、拼音、繁体转简体、关键词提取、概况总结文章、信息度量、文本相似度计算等功能。


