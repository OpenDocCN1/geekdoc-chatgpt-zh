    man”前面的空格，分句的结果将如图3.5所示。可以看出，polyglot.text将原本的第一句和第二句当作一个句子，将原本第一句的最后一个词“up”、符号“.”、第二句的第一个词“The”解析为一个新的缩略词“up.The”。


