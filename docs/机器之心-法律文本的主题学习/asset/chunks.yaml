    各步骤描述如下:其一，对CJO或FCA语料库进行预处理，将一个判例分成案件描述部分和判决部分，案件描述部分为将要进行分类的文本，判决部分为提供监督信息的标签。其二，将判决结果表示为分类标签，可以使用简单方法获得标签，1表示该判例体现了对原告的支持，0表示该判例体现了对原告的不支持，可以使用诸如“dismiss”之类的关键词来标记，也可以采用情感分类方法获得标签。其三，将案件描述表述为`VSM向量空间模型`，可以采用词频方法(`Term
    Frequency，TF`)。其四，将数据集的`VSM向量空间模型`划分为训练集`Training Set`和测试集`Test Set`。其五，将训练集`Training
