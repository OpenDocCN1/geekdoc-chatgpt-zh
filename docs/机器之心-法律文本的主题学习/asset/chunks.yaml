    表2.3　从案件中学习的测试集


    ![](images/txt002_16.jpg "pagenumber_ebook=60,pagenumber_book=51")


    机器学习算法是从历史数据中发现内在规律，假设内在规律存在，那么不同的数据就存在不同的内在规律。不存在通用的机器学习算法能够“一招鲜吃遍天”。在一些数据上表现好的机器学习算法，可能在另外一些数据上表现恰好相反。因此，评价机器学习算法的好坏要结合具体的问题和数据做有针对性的分析。


    2.6　数据预处理


    在建立机器学习系统的路线中，开始阶段就是数据的预处理。原始数据的规格和尺寸不利于提升机器学习系统的性能，因此，很多机器学习应用将数据预处理作为重要的操作步骤之一。例如，在人脸识别中，原始数据是一系列的图像，机器学习系统希望从图像中提取有用的特征，其中包括眼鼻口耳等。在植物花卉识别中，从图像中提取的特征有花瓣颜色、萼片长度、萼片宽度、花瓣长度和花瓣宽度等。在案件预测中，从文字中识别的特征有法院、日期、案由、原告、被告、法条和证据等。数据预处理的质量可以直接影响学习模型的泛化性能和效果。


    在现实当中，采集的数据往往不完整，在某些特征上可能存在缺失值。例如，在录入数据时因涉及个人隐私而造成收入特征或婚姻属性的缺失值，法律关系中的配偶在未婚人中就是缺失值，有的缺失值是人为疏忽产生的，有的缺失值是因获取代价较大而导致的。对学习模型训练和评估不利的不仅仅有缺失值，还有噪声和异常点数据。很多机器学习算法要求进行特征选择，使得特征数值处于一个标准的、连续的空间，例如将特征值映射到［0，1］区间或者服从一个均值为0方差为1的正态分布。


    在采集数据的过程中，特征或属性的赋值存在各种各样的缺失值。根据特征值的分布特性和对预测的重要性的不同，可以采用特征删除方法或者特征值填充方法。如果很多样本在该特征上取值缺少，达到很高比例，且在学习模型训练过程中不是特别重要，可以将这类特征删除。例如，个人基本信息中的家庭座机号码，很多人已经不使用固定电话了，当90%的样本缺少座机号码，就可以删除座机号码特征。如果特征取值符合均匀分布，且缺失的样本较少，可以用该特征或属性的均值来填充缺失。例如，个人基本信息中的月薪的缺失值可以用社会平均工资来代替缺失值。对于数据倾斜的缺失值采用中位数填充，例如，北京的高收入较多，平均工资显得较高，可能超出大多数工薪阶层的收入，此时用收入的中位数更具有代表性。如果缺失值不是连续型数据，而是离散型的数据，可以采用哑变量方法处理。例如，个人基本信息中性别的缺失值归为其他或者未知。


    离群点是指一些远离正常数据分布的范围的数据，分为真离群点和伪离群点。伪离群点是数据采集获取过程中的错误造成的，不是客观真实的反映。例如，在个人基本信息中，录入年龄60时不小心多输入一个0，变成600。真离群点是数据来源本身产生的，属于客观现象的真实反映。例如，在个人基本信息中，正常年龄分布在均值为70和方差为5的范围，但是不排除有个别少数的110的离群点。


    对于简单的数值，可以采用箱线图 (Boxplot)判断是否存在离群点。例如，将数据进行排序，分别计算下四分位数Q1、中位数Q2、下四分位数Q3、上限和下限，数值比上限还要大的为离群点，数值比下限还小的也为离群点。如果数据服从正态分布，标准差方法可以将偏离均值距离在3倍标准差之外的数据认定为离群点:


    ![](images/txt002_17.jpg "pagenumber_ebook=62,pagenumber_book=53")


    标准差方法 (Standard Deviation，SD)不是稳健的检测离群点方法，因为离群点的出现反过来会影响均值和标准差。基于绝对离差中位数 (Median
    Absolute Deviation，MAD)先是计算样本的中位数，再求出每个样本和中位数的偏差绝对值，接着计算偏差绝对值的中位数，最后用每个样本的偏差绝对值除以偏差绝对值的中位数。基于绝对离差中位数放大了离群点的影响，是一种相对可靠的离群点计算方法。基于距离的离群点检测方法通过定义数据之间临近值来判断离群点是否在临近值之外，基于密度的方法定义离群点周围数据密度明显低于大部分正常数据点的邻近密度，适用于离群数据分布不均的数据集。基于聚类的方法根据聚类算法将远离正常中心簇的小簇作为离群点。


    离群点对学习模型训练和评估都会产生一定的影响，根据离群点数量、影响和学习模型分别采用不同的处理方法。如果离群点数量不多，可以考虑将其删除，这样做可能会损失一部分信息。如果离群点较多，不能删除这些数据，可以通过对数变换将尺度缩小到一个数量级上，这种方法不损失信息，但是对学习模型有一定的要求。如果离群点距离正常数据数量级差别不大，可以用数据的均值和中位数置换离群点，信息损失较少。


    噪声是数据采集和获取过程中，在样本观察值和真实值之间产生的误差，常用的处理办法有分箱法和回归法。分箱法有等距和等频法，等距法从最小值到最大值之间划分为若干等份，而等频法的每个箱包含相同的样本数量。根据等距或者等频法，用每个箱的平均值、中位数或者边界值来置换箱中的各个样本。回归法是在根据特征变量和输出的关系，建立回归模型，利用输出反向求解特征变量近似值。


    数据集成一般是指将多个来源的数据合并到一个一致性的数据集中，需要解决特征识别、数据冗余和冲突问题。特征识别是指从两个不同数据来源中识别出相同意义的属性或字段。例如，法院数据、检察院和公安部门数据集成可能都涉及一些共同特征，在嫌疑人描述中，法院用的特征名称可能是suspect\_description，公安部门用的特征名称可能是suspect\_miaoshu，而检察院用的特征名称可能是suspect\_desc。数据冗余是一个来源中的特征可由另外一个数据来源的特征推导出来，例如，在法院数据来源中有出生日期属性或特征，在检察院数据中有年龄属性或特征，而年龄特征可以由出生日期推导出来。数据冲突是指从两个不同数据来源中具有相同意义的特征取值不一致的情况，例如，在法院数据中某嫌疑人身高1.75米，而在检察院数据中的身高为1.85米，这种数据冲突可以用缺失值方法来处理，也可以根据更接近数据生产场所的方法来消除冲突。


    数据规约是在保留原始数据的完整性和获得相同的学习模型训练效果的前提下简化数据集，能够快速提升学习效率，包括维度规约和维度变换。在分类任务中，可能存在成千上万的特征，其中大部分特征与分类结果无关，通过特征子集的选择删除不必要的无关特征，在确保信息损失较小的情况下，尽可能减少数据量。特征子集的选择目标是寻找概率分布最接近原始特征空间的最小子集，逐步向前选择方法是从空集开始逐步迭代添加原有特征空间中最好的特征，逐步向后删除方法是从原始特征全集开始逐步迭代减少原有特征空间中最好的特征。原始特征空间的最好特征可以通过单变量和目标变量统计分析方法来确定，常用方法有卡方检验和回归系数。卡方检验根据观察值和理论假设之间的偏差计算特征值和目标输出的相关性，然后根据相关性的排序，将相关性较低的特征从特征空间中删除。


    一些不同的特征之间存在高度相关性和一定程度的数据冗余，通过降维方法可以将数据从高维冗余空间压缩到低维的子空间。降维可以节省存储容量，提高学习算法训练速度。更加重要的是，在有大量噪声的数据集上，降维可以提高模型的预测性能。维度变换在确保原始数据的信息损失最小的情况下，将高维稀疏空间映射到维度更小的空间，常用的方法有主成分分析、奇异值分解和聚类等方法。主成分分析方法通过空间映射，将数据投影到主成分空间，使得主成分方向上数据方差最大。奇异值分解通过正交矩阵变换，将数据映射到向不同维度上的空间，计算复杂度较高，适用于稀疏矩阵。聚类将样本划分为一些簇，用簇代表单个特征变量，簇的个数就是新的特征数量。


    训练数据的不同特征取值的量纲对学习模型训练有一定的影响，尤其对于一些与距离有关的学习算法。例如，水果质量识别系统将不合格的水果筛选出来，输入到学习模型的特征有水果的重量、生长期、长度、宽度和高度等，这些特征量化后不在一个量纲范围，重量在0～10000克，生长期在0～100天，长度在0～1000毫米，等等。一个样本的几个特征取值的数据差异比较大，需要进行一定程度的缩放操作，使之对应到一个特定范围，常用的方法有最大最小规范化、Z标准化和对数变换等。最大最小规范化是将最大值减去最小值作为分母，以数据到最小值的距离为分子的比例。Z标准化是将数据减去均值后除以方差，变换后的数据分布发生了变化。有一些时间序列数据，横坐标是时间，纵坐标是GDP数值，而GDP数值在过去20年呈现指数增长，在绘图时就无法表现增长关系。对数变换是在量级相差非常大的序列数据中，使用log函数进行变换，使得不同量纲的数据能够在同样比例的坐标系中出现。


    根据学习算法的特点，有的模型要求输入数据类型为离散数据，例如决策树和朴素贝叶斯等算法。连续性输入数据的学习算法在时间和空间上的开销非常大，离散化的数据不但可以节省开销，还可以提高特征理解能力和抗噪能力。例如，嫌疑人身高的数值是连续的，如果离散化成身高较高、中等和较低，更加符合人们对身高的普遍理解，并且可以将超过正常数值的噪声归为一种离散数值，在一定程度上可以容纳数据录入的错误，克服数据中的结构性缺陷，使模型训练和评估更加稳定可靠。离散化操作根据断点将取值连续的数据进行分箱分段，常用方法包括等频法、等宽法和聚类法。等频法使得每个分箱中样本数量相等，例如样本数值包括间距为1的从1到10、间距为10的从10到100、间距为100的从100到1000，每个分箱中含有10个样本。等宽法使得每个分箱的宽度即边界长度相等，例如班级学生人数在100以内，可以划分为［0，25］、［25，50］、［50，75］和［75，100］四个等宽的箱。聚类法根据聚类学习的结果，将一个簇中的样本视为一个离散值。


    在多分类特征中，用多个离散值描述特征不利于学习模型的快速迭代。例如，嫌疑人职业是多分类特征，分为工人、农民、教师、公务员、学生、其他。通常离散化操作的结果是1、2、3、4、5，从职业本身来看，并没有大小排序的差异因素，如果按照赋值输入到学习模型，很显然是不合理的。因此，需要通过引入哑变量将多分类特征拆成多个二分特征，称为稀疏化处理。例如，原先的职业特征名称为employment，引入五个哑变量is\_worker，is\_farmer，is\_teacher，is\_civilservant，is\_student，当职业为工人时，哑变量is\_worker取值为1，其他哑变量为0。


    2.7　模型评估


    在二分类分类器中，按照分类标准将所有样本输出为正类或者负类。分类器的预测输出与样本的实际输出并不完全一致，存在一定的误差。样本总数为m，错误划分的样本数量为e，错误率为e/m。错误率与错分的样本数量成正比，与总样本总数成反比。与错误率对应的是学习精度，定义为1-错误率。在训练集上发生的误差定义为经验误差或者训练误差，在测试集上发生的误差定义为泛化误差。一般情况下，分类器在训练集上可以实现较低的分类错误率，但是在测试集上的错误率却很高。例如，样本空间总数是1000个样本，划分为800个样本的训练集和200个样本的测试集。分类器在训练集上的输出与样本标签不一致的有8个样本，在测试集上的输出与样本标签不一致的有40个样本。这种情况下的分类器并不是一个好的分类器，训练精度虽然达到99%，但是泛化精度却下降到80%。'
  fmt: '

    ## 2.5 假设空间与归纳偏好


    当增加训练样本数量时，在模型完全拟合的要求下，可以排除一些假设。例如再增加一个样本，三个样本不在一条直线上，如图2.11所示。线性关系假设只能拟合两个样本点，另外一个样本点存在偏差。然而，一元二次关系假设可以完全拟合在线上的三个样本点。实际上，对于线性关系和一元二次关系两种假设，难以评价何种假设更合理。在训练数据的符合程度上，一元二次假设比线性假设更加具有优势，可以达到零偏差，线性假设在第三个样本点上存在偏差。如果训练集数据可靠性高，降低训练偏差是正确的学习方法。但是训练样本本身存在噪声误差，降低训练偏差并不是合适的做法。例如，增加的第三个样本点是错误的数据，线性假设可能更加合理。在数据集服从独立同分布的情况下，样本数量规模小于假设模型复杂度，假设模型可以完全拟合数据；样本数量规模超过假设模型复杂度，假设模型不能够完全拟合数据。事实上，数据集的来源并非完全准确可靠，也不是完全独立同分布，为了防范结构化风险和拟合错误的数据，应该避免拟合全部数据现象。


    ![](images/txt002_11.jpg "pagenumber_ebook=56,pagenumber_book=47")


    图2.11　线性假设的偏差


    从样本中学习一个案件是否为胜诉，假设是否胜诉可以由诉讼请求、案由和证据材料三个因素决定。在案件的上述三个特征或属性确定之后，经过大量样本训练的学习模型可以对案件的判决结果给出判断。归纳学习从历史数据中获得经验，形成关于“胜诉的案件是什么样”或者“败诉的案件是什么样”的概念，如表2.1所示。


    表2.1　从样本中学习的数据集


    ![](images/txt002_12.jpg "pagenumber_ebook=57,pagenumber_book=48")


    从表格记录中可以看出，胜诉的案件是根据掌握的证据材料，以某种案由进行起诉并达成某种诉讼请求的概念。以逻辑表达式描述胜诉的案件：`(证据材料=待确定)∧(案由=待确定)∧(诉讼请求=待确定)`，`∧`表示逻辑与的关系，用`∧`连接的前后两个条件需要同时成立，才能满足逻辑表达式整体成立。从训练样本集中学习的过程就是确定待确定的部分。从案件编号为1的样本中，`(证据材料=转账记录和合同)∧(案由=借款纠纷)∧(诉讼请求=返回欠款)`为胜诉案件。除了编号为1的样本之外，编号3、5和7也都为胜诉案件，这些案件都是已经被观察到的判决结果。对于未在训练集中出现的样本，学习模型需要对未知数据进行预测，称为模型的泛化。归纳学习将分析和总结训练样本的特征规律，例如，所有胜诉案件的样本在哪些特征上取值相同或相似。同时，也比较类别不同案件在哪些属性或特征上取值不同。


    当对一个案件一无所知时，可以预测案件胜诉的概率为二分之一。随着训练数据的加入，可以观察到案件更多的特征和细节，预测案件的胜诉概率将大大增加。假设特征空间的某些取值决定案件的胜诉或败诉，所有的假设构成空间：`(证据材料=待确定)∧(案由=待确定)∧(诉讼请求=待确定)`，假设空间规模由各个特征的取值数相乘得出。学习过程是从案件判决假设空间搜寻能够符合表2.1训练集的假设，排除不符合训练集的假设，例如，假设：`胜诉=(证据材料=任意)∧(案由=任意)∧(诉讼请求=任意)`不符合案件编号2样本。


    证据材料记为`a`，取值来自集合`evidence:{转账记录和合同、转账记录、合同、*}`，`*`表示任意的。案由记为`b`，取值来自集合`cause:{借款纠纷、不当得利、侵权纠纷、*}`，诉讼请求记为`c`，取值来自集合`claim:{返还欠款、返还欠款和利息、双倍赔偿、*}`。每个特征可以取4个值，因此，假设空间共有64个，如图2.12所示。


    ![](images/txt002_13.jpg "pagenumber_ebook=58,pagenumber_book=49")


    图2.12　案件学习的假设空间


    图中`a=*`表示证据材料的取值为任意，`b=*`表示案由的取值为任意，`c=*`表示诉讼请求的取值为任意。`a=1`表示证据材料的取值为“转账记录和合同”，`b=1`表示案由的取值为“借款纠纷”。`c=1`表示诉讼请求的取值为“返还欠款”，`c=2`表示诉讼请求的取值为“返还欠款和利息”，`c=3`表示诉讼请求的取值为“双倍赔偿”。图2.12的结构与文件系统的目录层次相似，像一颗倒置的树，最顶层的是根节点，最底层的是叶节点。最左边的叶子节点`(a=1;b=1;c=1)`代表假设`h1`：根据转账记录和合同，以借款纠纷进行起诉并要求返还欠款的案件判决结果为胜诉。假设`h1`与训练集中的案件编号为1的样本吻合或者匹配，但是不能泛化到别的样本上进行预测。最右边的叶子节点`(a=1;b=1;c=2)`代表假设`h2`：根据转账记录和合同，以借款纠纷进行起诉并要求返还欠款和利息的案件判决结果为胜诉。假设`h2`与训练集中的案件编号为5的样本吻合或者匹配，但是同样地不能泛化到别的样本上进行预测。如果将这两个叶节点的父节点`(a=1;b=1;c=*)`作为假设`h3`：根据转账记录和合同，以借款纠纷进行起诉的案件判决结果为胜诉。假设`h3`可以泛化`(a=1;b=1;c=*)`下的未在训练集中出现的子节点，可能在未标记的数据上的预测结果是错误的，也就是模型具有一定的准确率。从假设空间搜寻能够匹配训练集的假设，可以采用自顶向下的演绎方法，也可以采用自底向上的归纳方法，存储与训练集所有正类样本相一致的假设，删除与训练集中所有负类样本相一致的假设。


    从表2.1中选择案件编号1、2、5、7组成训练集，如表2.2所示。假设空间存在3个假设可以匹配训练集。假设1：如果存在`(证据材料=转账记录和合同)∧(案由=借款纠纷)∧(诉讼请求=任意)`，那么判决结果为胜诉；假设2：如果存在`(证据材料=转账记录和合同)∧(案由=任意)∧(诉讼请求=任意)`，那么判决结果为胜诉；假设3：如果存在`(证据材料=任意)∧(案由=借款纠纷)∧(诉讼请求=任意)`，那么判决结果为胜诉。如图2.13所示。


