    (证据材料=任意)∧(案由=借款纠纷)∧ (诉讼请求=任意)，那么判决结果为胜诉。如图2.13所示。


    表2.2　从案件中学习的训练集


    ![](images/txt002_14.jpg "pagenumber_ebook=59,pagenumber_book=50")


    ![](images/txt002_15.jpg "pagenumber_ebook=59,pagenumber_book=50")


    图2.13　一个训练集上的假设空间


    学习模型选择哪个假设取决于归纳偏好，是偏向更为一般化的选择，还是偏好更为具体化的解释。假设1是从证据材料和案由两个特征中学习了结果，假设2是从证据材料特征中学习了结果，假设3是从案由特征中学习了结果。假设1要比假设2和3更加具体，哪种假设更好将由模型的泛化性能来衡量，即该假设在测试集上的匹配情况。


