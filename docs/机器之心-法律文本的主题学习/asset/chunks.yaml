    # 5.4 特征工程


    ## 5.4.1 特征工程定义


    人类可以理解的自然语言的语料文本，计算机无法直接理解。计算机算法不具备直接处理自然语言能力，因此需要将自然语言文本的表示转换为一系列数值，每个数值对应着原始文本的一部分或者某方面信息。这些数值既可以表示原始语料文本，又可以被机器学习模型所理解。机器学习模型的输出依赖于模型参数和输入信息，可以量化的输入信息称为特征或者属性，特征工程是从原始语料中提取用于构造机器学习模型特征的过程。


    自然语言文本的何种信息可以作为机器学习算法的特征，将对模型性能和效果产生很大的影响，特征工程就是为了解决这类问题的。特征工程将提取准确而有效的信息作为模型的特征，对于不同的数据集和自然语言处理目标，准确而有效的信息的含义也不一样。


    在生成机器学习模型所需的特征之后，机器学习模型根据输入的特征产生输出预测结果。在训练阶段，通过不断调整模型参数，使得模型对输入特征产生的预测结果与实际结果的偏差最小。经过稳定可靠的训练，模型获得最优参数，称为模型学习。训练后的机器学习模型对新输入特征进行预测输出，预测结果的准确率和效率在很大程度上由原始语料生成的特征决定，产生特征的过程需要计算机知识和自然语言领域知识。


    ## 5.4.2 基础特征


    为了将预处理的法律文本用于机器学习模型，需要运用特征工程方法构建特征。根据不同的任务和目标，法律文本数据特征可以通过句法分析、词统计特征和词向量等来实现。


    句法分析将自然语言表示的句子序列切分为更小的组块，根据语法规则和词语位置，理解每一个组块的语法角色和语义元素，包括依存分析和词性标注。句子中的词语之间的联系通过依存语法决定，从属关系是一个用三元组
    `(关系、支配成分、从属成分)` 表示的依存语法。前文的“submitted”是该句的根词 (`rootword`)，前面是主语子树，后面是宾语子树，而每一个子树同时又是另外一个依存关系树。通过不断的从上到下或者从下到上的迭代，可以获得语法关系三元组，这类语法关系三元组可以作为机器学习模型的输入特征。


    词性标注将每个词的含义和他们的词性对应起来，词性决定了某个词在句子中的作用和用法。例如，前文词形还原中的“was”在名词词性的前提下，输出结果为“wa”，在动词词性的前提下，输出结果为“be”。将单词简单编码为特征，机器学习模型无法学习单词的上下文知识。如果将特征和词性结合起来，特征就能保留了文本中的上下文环境。例如，在没有词性标注标签`POS`的情况下，假设可以将单词“was”编码为186，不管在动词词性的上下文环境中，还是在名词词性的场景中，输入到机器学习模型的特征值都为186，无法区分这两种情况的上下文。


    在拥有词性标注标签`POS`的情况下，假设可以将动词词性单词“was_VB”编码为1861，将名词词性单词“was_NN”编码为1862。在动词词性的上下文环境中，输入到机器学习模型的特征值为1861。而在名词词性的场景中，输入到机器学习模型的特征值为1862。因此，结合词性的特征可以区分不同词性的上下文知识。词性标记可以用来帮助去除停用词，例如，一些虚词和介词词性的词汇可以在特征工程中被去除。


    命名实体识别是自然语言处理特征工程的重要内容，在自动问答系统和信息检索领域有着广泛应用。命名实体识别根据规则、词典、词性标注和语法依存等方法，从文本中识别出重要的名词短语。利用词性分析和语法从属关系可以将所有名词短语从法律文本中提取出来，然后采用文本分类或者查找字典方法，将获取的名词短语放入到特定的类别中，例如，人名、机构名、地址名和法律条款名等。人类对于前文中的“Music
    Company”的理解，这是一家音乐公司，属于一种专有名词。目前，一些流行的命名实体识别工具可以识别人名、国别、基础设施名、机构名、城市名、地理位置、物体名、活动名、著作品名、日期时间、币种、百分比、基数词、序数词等。


    ## 5.4.3 统计特征


    统计特征根据法律语料文本可以直接量化信息，将法律文本表示成数学中标量、向量、矩阵或者张量。单个实数称为标量，一维数组称为向量，矩阵是二维数组，而张量是多维数组。


    将语料文本中出现的所有词语构成一个词典，每一个词在词典中对应一个位置，通过词典可以将词语映射为一个整数，也可以映射成一个向量。根据文本中的单词出现的次数、语料库中出现的次数、语料库中一些词共现次数等情况，统计特征方法借助利用代数原理和概率理论，自动生成可以适用于特定机器学习模型的特征，例如词袋模型、one-hot编码、词嵌入和主题模型。


    # 第6章 特征选择和维度约简


    ## 6.1 法律文本分类


    ### 6.1.1 法律文本分类定义


    根据机器学习和人工智能模型，法律文本分类技术是 (LTC，Legal Text Classification)通过计算机算法将法律文本自动划分为某个法律类别或者标签的过程。法律文本分类的目标就是寻找和确定一个合适的映射函数，将一个法律文本映射到一个提前定义或者设置好的类别。法律文本分类任务具有如下形式的数学定义：


    ![](images/txt006_1.jpg "pagenumber_ebook=155,pagenumber_book=146")


    `D_L={d_l1,…,d_li,…,d_l|D_L|}`表示法律文本数据集，其中，`|D_L|`表示法律文本数据集中的文本总数，`d_li`表示其中一个法律文本。`C_L={c_l1,…,c_lj,…,c_l|C_L|}`表示提前定义或者设置好的法律类别或者标签的集合，其中，`|C_L|`表示类别集中类别总数，`c_lj`表示其中一个类别或标签。`T`值表示对于`D_L×C_L`中的任意一个
    `<d_li, c_lj>`来说，法律文本`d_li`属于类别`cj`，`F`值表示对于`D_L×C_L`中的任意一个 `<d_li, c_lj>`来说，法律文本`d_li`不属于类别`cj`。一般来说，法律文本分类过程包括法律文本数据准备、法律文本预处理、特征选择维度约简、训练分类模型和评估模型结果，如图6.1所示：


    ![](images/txt006_2.jpg "pagenumber_ebook=156,pagenumber_book=147")


    图6.1 文本分类过程


    法律文本数据准备为分类模型提供训练数据和测试数据。通用数据集可以公开获取，并为验证模型提供了基准。在通用文本数据挖掘中，具备通用性和公开性原则的数据集有NewsGroup
    20语料集、IMDB电影评论集、UCI标准数据集等。作为具有一定广泛性和覆盖率的专业性文本数据集，法律文本语料库包括中国裁判文书网 (CJO，Chine Judgements
    Online)的法律文本，澳大利亚联邦法院(FCA，Federal Court of Australia)的裁决书，等等。


    在法律文本预处理阶段，将无法直接输入到机器学习模型的自然语言形式的法律文本转换为能够适合机器学习模型处理的量化数值形式，即特征工程，包括分句、分词、大小写转换、词干提取和词形还原、去除停用词等。分句将词语序列按照语法结构进行切分，去除一些标点符号，为词性标注和语法分析提供依据。词语是最基本的语法功能要素，在不同语言的语料环境中，分词规则有着较大的差异。英语的词语之间存在分隔符号，例如空格、制表符或者换行符，通过检索分隔符就可以实现分词。相对而言，中文分词无法通过检索分隔符来进行分词，需要依靠更为复杂的方式来实现分词，例如查找字典。为了减少输入到机器学习模型的特征数量，需要将一些近义词合并到同一个词项下。词干提取可以去除词语的前缀或后缀，保留决定语义部分的词干，消除时态和语态对词语形态的影响。停用词是一些与语义无关的词语，比如一些助词、连词和冠词等。还有一些高频出现的代词和介词都是语法结构中虚词，对语篇的理解没有具体作用，这类词也可以作为停用词去除。通过法律文本的预处理操作，可以使法律文本语义和主题更加集中和明确。


    ### 6.1.2 特征表示方法


    在法律文本数据预处理完成以后，自然语言形式的法律文本被切分为词条序列，每个词条可以在字典中找到对应的数值。字典是计算机中由很多二元组构成的数据结构，每个二元组是一对键和键值关系，称为键值对。例如，`("submit",
    1289)`是词典中一项，如果需要将词语“submit”转换为机器学习模型接收的输入即特征，通过查找字典中的对应键值，就可以用数字“1289”表示对应该词的特征。


    特征表示方法是将法律文本预处理输出的词语表示成数学形式，一般方法有布尔模型、向量空间模型以及概率模型。将一个法律文本表示成一个由特征词构成的向量，称为布尔模型
    (Boolean Model)，向量中的元素取值只能为0或者1，元素位置对应词典中的词，1表示法律文本中出现了该特征词，0表示法律文本中没有出现该特征词。例如，`00001100
    01110011`表示法律文本的预处理输出结果是词典中的第5、6、10、11、12、15、16位置的词。向量空间模型 (Vector Space Model，VSM)不再将特征词取值限制为0或者1，而是赋予特征值一个定义为对法律文本分类有贡献的权值。概率模型对于一个法律文本`d_li`，计算各个主题`zj`的条件概率`p(zj|d_li)`，用在各个主题下的条件概率表示该法律文本的相应的特征值。


    ## 6.2 法律文本特征工程


    ### 6.2.1 词袋模型与向量空间模型


    为了简化自然语言文本表示，可以将一个法律文本看成一个装满单词的袋子，而不考虑词语顺序和语法结构，只是保留相互独立的单词，每个单词的出现并不依赖于其他单词是否出现，称之为词袋模型
    (Bag of Words，BoW)。法律文本可以是一个句子，也可以是一篇文章。


    法律文本1为“the suspect robbed the car，the police likes the car”，法律文本2为“the police
    arrested the suspect”。用法律文本中所有出现的单词构建一个列表 `["arrested", "car", "likes", "police",
    "robbed", "suspect", "the"]`，这个列表就是词袋。根据词袋可以生成特征，法律文本就可以用特征进行表示，特征值可以取词频。法律文本1表示为`[0,
    2, 1, 1, 1, 1, 4]`，法律文本2表示为`[1, 0, 0, 1, 0, 1, 2]`。法律文本1的单词“car”出现了2次，“car”在词袋中的位置是第1(起始位置为0)。因此，在特征表示的第1位置上的数值为2。如图6.2所示：


    ![](images/txt006_3.jpg "pagenumber_ebook=158,pagenumber_book=149")


    图6.2 词袋模型


    词袋模型是向量空间模型在文本数据处理上的应用，向量空间模型将一个法律文本看作在高维空间存在的一个点即向量，向量的每一个坐标或者维度都对应着法律文本中的一个特征值或者特征项，而每一个坐标或者维度的取值则反映了该特征项在给定的法律文本中的权重，权重大小则表明该特征项对给定的法律文本的重要程度。换言之，特征项的取值在某种程度上反映了该特征项对给定法律文本分类的影响。


    向量是一些实数构成的数组，数组中每个实数是一个特征项，它是向量空间模型中不可再分的基本元素，一般对应法律文本中的词语。一个法律文本就是由它包含的词语对应的特征项所构成的集合：


    ![](images/txt006_4.jpg "pagenumber_ebook=158,pagenumber_book=149")


    `f_t1`是对应词语`t1`的特征项，`f_tk`是对应词语`tk`的特征项，`1<k<n`，文本`d_li`包含`n`个特征项，任意一个特征项`f_tk`根据一定方法或准则被赋予一个权重值`wk`，用来表示特征项`f_tk`对于决定法律文本`d_li`所属类别的重要性，表示为：


    ![](images/txt006_5.jpg "pagenumber_ebook=158,pagenumber_book=149")


    或者：


    ![](images/txt006_6.jpg "pagenumber_ebook=158,pagenumber_book=149")


    根据词袋模型规则，向量空间模型忽略法律文本中各个词语出现的次序，将法律文本视作特征项的集合 ![](images/txt006_7.jpg "pagenumber_ebook=158,pagenumber_book=149")
    每一个特征对应空间一个维度。因此，向量空间模型是一个`n`维空间，其中一个点 ![](images/txt006_8.jpg "pagenumber_ebook=158,pagenumber_book=149")
    ![](images/txt006_9.jpg "pagenumber_ebook=158,pagenumber_book=149") 为法律文本`d_li`在各个维度上的坐标值。按照向量空间模型，第一个法律文本可以表示为`d_l1(w11,
    w12, …, w1k, …, w1n)`，第二个法律文本可以表示为`d_l2(w21, w22, …, w2k, …, w2n)`，两个法律文本在空间上的相似度可以用夹角余弦、欧式距离、切比雪夫距离和绝对值距离。


    两个法律文本的向量内积表示为：


    ![](images/txt006_10.jpg "pagenumber_ebook=159,pagenumber_book=150")


    向量内积与每个向量模的大小有关，为了避免向量模的影响，需要进行归一化处理，将向量内积再除以各个向量模，归一化处理结果就是两个向量的夹角余弦，也称为余弦相似度：

    '
  trans: '


