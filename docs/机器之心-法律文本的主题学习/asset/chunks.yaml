    \n表2.6　多分类混淆矩阵\n\n![](images/txt002_31.jpg \"pagenumber_ebook=76,pagenumber_book=67\"\
    )\n\n假设存在C个类别，类别Labelc的准确率为预测为该类别的样本数量中的实际为该类别的比例，类别Labelc的召回率为实际该类别样本数量中的被预测为该类别的比例:\n\
    \n![](images/txt002_32.jpg \"pagenumber_ebook=76,pagenumber_book=67\")\n\n根据准确率和召回率的定义，依次计算各个类别的准确率和召回率，得到(Precision1，Recall1)，(Precision2，Recall2)，…，\
    \ (Precisionc，Recallc)，…，(PrecisionC，RecallC)。对各个准确率计算平均值就是宏准确率，对各个召回率计算平均值就是宏召回率，计算宏准确率和宏召回率的调和平均值就是宏F1:\n\
    \n![](images/txt002_33.jpg \"pagenumber_ebook=77,pagenumber_book=68\")\n\n对各个类别的准确率、召回率和F1度量求平均的模型评估方法称为宏观做法，对混淆矩阵中预测输出情况和实际真实情况的对应数值求取平均的模型评估方法称为微观做法。将混淆矩阵对角线上的值求和再平均，即求各个类别预测正确的平均值，微准确率等于所有作出预测的样本总数中的得到正确预测的比例，微召回率等于实际的样本总数中的得到正确预测的比例，微准确率在数值上与微召回率一样:\n\
    \n![](images/txt002_34.jpg \"pagenumber_ebook=77,pagenumber_book=68\")\n\n在P-R图中，分类器对样本的预测是一个概率，设定一个阈值，当样本预测概率大于这个阈值，将样本预测为正类，当样本预测概率小于这个阈值，将样本预测为负类。神经网络和逻辑回归对样本的预测结果是大于0而小于1的实数，大于等于0.5的样本被划分为正类，小于0.5的样本被划分为负类。如果将预测样本按照概率进行降序排列，越靠近前面的测试样本越可能是正类，越靠近后面的测试样本越可能是负类。分类器需要从中选择一个断点，在断点之前的样本输出为正类，而在断点之后的样本输出为负类。分类器所选的断点越靠前，意味着被判定为正类的样本实际为正类的概率越大，准确率就越高，但是被判定为正类的样本数量相对较少，可能会漏掉未被判为正类的但实际为正类的样本，召回率较低。分类器所选的断点越靠后，意味着被判定为正类的样本实际为正类的概率越小，准确率就越低，但是被判定为正类的样本数量相对较多，召回率较高。因此，测试样本的预测概率的排序从整体上反映了各个断点下的准确率和召回率。\n\
    \nROC(Receiver Operating Characteristic)是一种分析检测技术，机器学习领域引入这个名称来表示概率预测结果的总体泛化性能。按照预测概率由大到小对样本进行排序，依照同样的顺序选择断点，每次选择一个断点，在P-R图中计算的两个值为准确率和召回率，而在ROC图中计算的两个值为真正类率\
    \ (True Positive Rate，TPR)和假正类率 (False Positive Rate，FPR)。\n\n用真正类率来表示分类器所成功预测的正类\
    \ (预测为正类，实际也为正类)在实际正类中所占有的比例，而用假正类率来表示分类器所预测失败的正类 (预测为正类，但实际为负类)在所有实际负类中所占有的比例:\n\
    \n![](images/txt002_35.jpg \"pagenumber_ebook=78,pagenumber_book=69\")\n\n实际上，真正类率TPR就是正类的召回率，TPR越大，实际正类被预测为正类就越多，FPR越大意味着实际负类被预测为正类就越多。如果一个分类器判定一个样本为正类的结果是一个概率值，通过设定一个阈值，当概率大于阈值的那些样本为正类，概率小于阈值的那些样本为负类。据此可以计算一个\
    \ (FPR，TPR)值，将FPR作为横坐标，将TPR作为纵坐标，这样对应到平面上一个点。当阈值为1时，所有测试样本都将被划分为负类，既没有正类样本被判定为正类，也没有负类样本被划分为正类，因此，TPR和FPR都等于0。随着阈值的初次降低，有些样本被划分为正类，这些样本预测概率很高，实际为正类的概率较高，实际为负类的概率较低，TPR增长很快，而FPR增长很慢。随着阈值的进一步降低0.5左右，越来越多的样本被划分为正类，这些样本预测概率超过0.5，实际为正类的数量进一步增加，增加的幅度在降低，实际为负类的数量进一步增加，增加的幅度在提高，TPR增长放缓，而FPR增长变快。当阈值降低到0附近，所有测试样本都将被划分为正类，正类样本都被判定为正类，负类样本也都被判定为正类，TPR和FPR都等于1。FPR在增加的同时，TPR也在增加。因此，ROC曲线就是在［0，1］区间上\
    \ (FPR，TPR)的单调递增曲线。AUC(Area Under Curve)为ROC曲线下包围的面积，当FPR取值较小时，此时阈值较高，对应的TPR值较大的分类器性能较好，AUC值越大说明分类器性能越好。\n\
    \n2.8　路线图\n\n在前文中讨论了机器学习的基本概念和方法，机器学习具有典型固定活动的工作流包括数据预处理、模型训练、模型评估与预测新数据。数据预处理的工作内容有清洗数据、标记样本、特征选择以及划分训练集和测试集。模型训练的工作内容有选择模型算法和调节参数。模型评估的工作内容有性能度量选择和交叉验证。预测新数据是将训练的模型泛化到实际应用场景，对新输入的样本进行预测，获得新的输出，如图2.18所示:\n\
    \n![](images/txt002_36.jpg \"pagenumber_ebook=79,pagenumber_book=70\")\n\n图2.18　工作路线图\n\
    \n数据预处理阶段需要占用大量时间。数据来源是历史数据，要进行数据集成操作，对于缺失值进行填充操作，对异常离群数据进行删除或者置换操作，对于多分类特征需要进行稀疏化处理。最为重要的一个操作是特征空间的维度约简，将高维度的原始特征空间变成低维度的新特征空间，包括特征选择和特征抽取。特征选择是原来特征空间的一个子集，从原来特征空间中删除一些用某种方法认定的无关特征，信息损失较多，而特征抽取是原始空间的一个映射，将原来特征空间投影或变换的新空间，信息损失较少。合适的数据预处理去除了数据采集过程的噪声，也精简了空间，可以显著提高模型性能和模型训练学习效率。\n\
    \n正如在实际应用中看到的那样，针对不同的用户问题和需求任务，开发出不同的应用程序和软件。没有免费午餐定理 (No Free Lunch Theorems)提出在不考虑具体的实际问题和需求的情况下，不存在一个学习算法比另外一个学习算法更好，甚至都谈不上要比掷色子猜测强。俗语说，如果你唯一的工具是把锤子，那么把一切都当作钉子来对待是很有诱惑力的。不存在普遍适用的分类器，也不存在与具体应用无关的最优学习算法。每种分类器都有其内在固有的偏差，如果不对与问题领域有关的任务进行假设，任何一种分类模型都不具优越性，也就是分类器要与问题领域相关。因此，在实践中为了训练和选择性能最好的模型，必须至少比较几种不同的学习算法，才能在特定问题、特定的数据和特定分布上，考虑何种算法才是合适的。对于是否能够解决其他问题，则是不需要考虑的。因此，只有在特定问题上对不同的学习模型进行比较才具有实际意义。\n\
    \n在比较不同的算法和模型之前，需要明确用以衡量性能的测度或标准，例如分类精度。经常遇到的问题是如何确定模型训练、模型选择和模型评估的数据集，一般情况下，训练集用于训练模型，而测试集用于模型评估。如果不使用测试集进行模型选择，而是将测试集用在最终的模型评估，将难以确定哪个模型在最终的测试数据或者真实世界中的性能表现更好。一种解决方法是将训练集进一步划分为训练子集和验证子集，在训练子集上训练一个模型，在验证子集上测试这个模型性能，然后用另一个的模型在训练子集和验证子集上进行训练和测试。根据增加的验证集，交叉验证法可以进行模型选择。各种算法包提供的不同学习算法的默认参数对于用户特定任务的训练和评估并非是最优的，因此，需要经常调节参数来改善模型性能直至符合用户要求。直观上可以将超参数看作不是从数据中学习到的参数，而是模型调节的旋钮，通过这些旋钮来提高模型的性能，就像电风扇上的调节风力的旋钮来控制风的大小。\n\
    \n在训练集和验证集上比较几种不同模型之后，选择一个能够拟合训练集中的数据并且在验证集上获得较好性能的模型，然后用测试集来估计模型将来在现实环境中产生数据上的表现，进而估计模型的泛化性能。如果模型性能能够满足用户的要求，可以使用模型预测未来的新数据。另外，前文提到的超参数，例如特征抽取和数据缩放，是在训练集中获取的，随后用相同的参数来转换测试集数据或者新样本。否则，在验证集或测试集上测量的性能可能不正确。例如，用主成分分析方法在训练集中求解一个新空间，新空间的坐标系是原空间的向量，训练集在该向量上的投影的方差最大，或者训练集与该向量点积的方差最大，向量就是前文所谓的参数。在验证或者测试数据集中，需要使用同样的参数即向量去变换验证或者测试样本。\n\
    \n在工作路线图中，原始数据需要执行缺失值填充、抗噪和离群点处理，监督信息是打上标记的标签。经过清洗的原始数据和标签组成了数据集，将数据集划分为训练集、验证集和测试集。根据数据类型和分布特点，选择一些备选的学习算法，从备选学习算法中依次选一个学习算法。将训练集数据输入到选定的学习算法中，进行模型训练和学习。在学得模型之后，将验证集样本输入到训练好的模型上，测试模型性能并进行评估。图中虚线指向训练集的含义是换一个学习算法重新训练，重复上述步骤，直至将备选的学习算法全部用完。然后，比较各个学习模型的性能和效果，选择性能最优的模型作为最终模型。最后，将测试集样本输入到最终模型，评估模型泛化能力。\n\
    \n\uFEFF\n\n第3章　理解法律文本\n\n新闻报道文本具有时效性、公开性和话题性等特点，所记录的文字能够广泛传播，文字简明扼要，以事实引出话题，以评论吸引受众。社交文本突出互动性、短文性和娱乐性，创造了很多网络流行语，大量使用俚语、微表情和缩写，包含很多主观性和情绪倾向的内容。法律文本不同于诸如新闻报道的一般叙事性文本，也不同于诸如社交媒体的口语化短文本。法律文本是为了表达特定的概念、涵义和现象而生成并适用于法律实践和相关领域的专业性文本。\n\
    \n3.1　法律文本语言特征\n\n3.1.1　法律文本渊源\n\n法律文本的语言特征受到法律渊源的影响，因此，法律文本来源的确定是非常关键的，普通法和成文法的法律渊源是截然不同的。在一些普通法国家，法律正式渊源包括判例法和制定法。判例法是指先前的判例可以成为后来判决的依据，制定法是指由国家所制定的并能够体现国家意志的规范性和系统性的法律文件。判例法起主导作用，制定法起补充作用，对判例进行解释或者重申。普通法的非正式法律渊源包括传统文化习惯、公序良俗和政府公共政策等。\n\
    \n在一些成文法国家，法律是由立法机关制定的，行政管理部门制定一些行政法规。我国的法律渊源包括由全国人民代表大会制定并颁发的以“通则”或者“法”名称出现和展示的法律、由国务院所制定并颁发的以“条例”等名称出现和展示的行政法规、由国务院组成部门制定和颁发的以“规则”等名称出现和展示的部门规章、由地方人民代表大会制定和颁发的以“规定”等名称出现和展示的地方性法规。例如，《中华人民共和国民用航空法》是一部由全国人大常委会制定的法律;《中华人民共和国民用航空安全保卫条例》是一部由国务院所制定的行政法规;中国民用航空总局制定的《中国民用航空安全检查规则》是一部部门规章;而《浙江省无人驾驶航空器公共安全管理规定》是一部由浙江省人民代表大会所制定的地方性法规。\n\
    \n从法律文本的词语构成的角度来看，法律文本中的一句描述可能包含一般语言学中的词语，也可能含有特殊环境下的法律术语。例如，“妻子”在法律文本中就属于一般性词语，而“未成年人”就属于专门的法律术语，特指年龄在18周岁以下的群体。英文中“Writ”是指令状或者法律上的书面命令，是一种权利形式的法律词汇，“real\
    \ estate”是一个法律术语，是指附着在土地上的不动产的财产概念，而“house”是一般词语，指的是建筑物形式的房子。法律术语是法律文本中有特殊涵义和专门定义的最小固定单位，例如“法人”就不能被分割为更小的语言单位，“real\
    \ estate”不能分割为“real”和“estate”。从不同的内部构成方式来划分，法律术语可以划分为动宾结构、偏正结构、主谓结构、联合结构、补充结构等类型。\n\
    \n3.1.2　法律文本形态分析\n\n形态学 (morphology)属于语言学的一个分支，主要研究如何构成和生成词语。词语 (word)是句子结构中可以单独使用的最小单位，词素\
    \ (morpheme)是形态学的最小语言单元，是比词要低一级的形态学中的组成部分。\n\n汉语中的词素大多数来自单音汉字，也有少数双音复合词素。例如，“笔”是写字的工具，可以用来组词的有“笔筒”“笔迹”“毛笔”等一般性词语。双音词素“豆腐”可以组成“豆腐汤”“豆腐乳”“豆腐干”“豆腐皮”“老豆腐”“毛豆腐”“冻豆腐”“豆腐脑”“酱豆腐”“臭豆腐”“豆腐渣”等。“诉讼”可以组成“诉讼参加人”“诉讼当事人”“诉讼代理人”等法律术语。\n\
    \n英语中的词素一般为单词的一部分，例如，一般性词语“house”包含一个词素，而“houses”包含两个词素，一个是“house”，另一个则是“-s”。法律术语“writ”包含一个词素，而“writs”包含两个词素，一个是“writ”，另一个则是“-s”。词干\
    \ (stem)也属于词的一部分，但是不同于词素的是词干允许另外一个词素或者词缀附加在上面。例如，“pack”是词根，加上一个词缀“un”形成的“unpack”，称为词干。\n\
    \n在语法层面的分析任务是形态分析，用来分析一个词由哪些词素组成，哪些词素是语义上的最小构成单元。词素是语言符号不可再分的部分，具有一定的形式和意义。 “unmoralized”为英语中的一个单词，包括4个词素:un、moral、ize、d，要理解这个单词就需要知道这4个词素的形式和含义。词素也称为词缀，可以分为三种类型，分别是前缀\
    \ (prefix)、后缀 (suffix)、内缀 (infix)。在词干前面出现的称为前缀，例如英文中的untidy，前缀“un”表示否定的意思。在词干后面出现的称为后缀，例如英文中的acceptable，后缀“able”表示能够的意思。在词干中间出现的称为内缀，置入词干中间的内缀不太常见，主要用在化合物的命名上，例如英文中的pipecoline，内缀“pe”表示完全氢化的意思。词素和形态分析如图3.1所示。\n\
    \n![](images/txt003_1.jpg \"pagenumber_ebook=84,pagenumber_book=75\")\n\n图3.1　词素和形态"
