    # Chapter 8　Supervised Topic Learning for Legal Texts


    ## 8.1　Supervised Learning of Legal Texts


    ### 8.1.1　Legal Natural Language Processing


    Statistics show that text data is the primary source of information acquisition
    for people. Machine learning techniques are widely applied in the field of text
    classification. The task involves inputting labeled samples into a model for training
    to obtain certain classification criteria and methods, and then automatically
    classifying unlabeled text data. In recent years, with the rapid development of
    mobile internet, text data such as legal texts, scientific literature, and news
    reports have shown a significant growth trend. This ever-increasing data requires
    automatic processing. Unlike other text data, legal texts possess strict logical
    relationships. Between sentences and legal provisions, there exist a large number
    of legal terms, specialized vocabulary, and basic concepts. These characteristics
    help legal practitioners make correct judgments and avoid ambiguities in actual
    cases. However, simultaneously, they make establishing legal information retrieval
    and question-answering systems more complex than for other texts.


    Current legal text processing includes manual knowledge engineering and natural
    language processing. Manual knowledge engineering converts the way legal experts
    think and analyze cases into internal data structures and algorithms of computers.
    This method can produce good results. However, building a knowledge base requires
    massive human and economic costs, making it difficult to promote in practical
    applications. Conversely, natural language processing technology is more suitable.
    Utilizing machine learning techniques, hundreds of millions of bytes of data can
    be processed rapidly. Traditional machine learning methods include `Naive Bayes`,
    `Support Vector Machines`, `Neural Networks`, `Deep Learning`, `Decision Trees`,
    `KNN`, and `Regression Methods`, etc. The effectiveness of these methods on legal
    texts is not very good. Therefore, there are some challenges and issues in legal
    natural language processing. The reasons are twofold: on the one hand, the high-dimensional
    sparsity of the training set; on the other hand, in legal texts, facts and concepts
    have different interpretations and contexts. Therefore, to effectively answer
    a legal question, one must combine the semantic connections between the question
    and the provisions.


    ### 8.1.2　Supervised Learning of Legal Texts


    Legal natural language processing, for a given legal question, automatically retrieves
    relevant legal texts and judges whether the legal text can answer the legal question.
    It actually includes information retrieval and question-answering systems. The
    `Ranking SVM` and `CNN` method uses a `Ranking SVM` with a set of combined features
    to rank and score retrieved documents, and then uses `CNN` to classify the concatenated
    query-document pairs. If the result is 1, it indicates the document supports the
    answer to the question; if the result is 0, it indicates the document does not
    support the answer. The `N-gram` and `AdaBoost` method uses `TF-IDF` `N-gram`
    features to rank documents, and then uses an `AdaBoost` algorithm based on query-document
    similarity features to classify "query-document" pairs as 1 or 0. The `Hiemstra`,
    `BM25`, and `PL2F` voting methods are used for document retrieval and ranking.
    Hidden `Markov` models are also used as query generation models for legal retrieval
    systems. Keyword-based query methods calculate a score for each keyword based
    on the inverse frequency of the query and document, and then rank them according
    to three scoring situations.


    The `LDA Model (Latent Dirichlet Allocation)` topic model method, based on the
    document generation process, assumes a latent topic exists, which can search for
    implicit topic information semantically associated with certain words to a certain
    extent. The Supervised Topic Model (`SLDA, Supervised Latent Dirichlet Allocation`)
    establishes a latent topic model that can predict response variables based on
    text and response variables. Compared with the `LDA Model`, the legal text `SLDA
    Model` requires many labeled training samples. The supervision information for
    legal texts is set as textual entailment, i.e., the consistency of internal legal
    logic, using the judgment result as supervision information. If the judgment result
    supports the plaintiff, the legal text is labeled as 1; otherwise, it is labeled
    as 0 or -1 (negative class samples in `Support Vector Machine SVM` are labeled
    as -1). From the perspective of `SLDA Model` fitness, extracting legal texts separately
    into a legal terminology feature vector space and a general words feature vector
    space can achieve better adaptability and finer model granularity.


    ## 8.2　Legal Text Supervised Topic Model SLDA


    ### 8.2.1　SLDA Generative Process


    A hierarchical statistical method is adopted to introduce a hidden intermediate
    layer for document generation, called the Topic Model. A specific topic is a probability
    distribution over a set of words in the vocabulary, also implying a latent semantics.
    A document can be described as a joint probability distribution over multiple
    topics. Therefore, text similarity calculated based on topics has better adaptability
    and effectiveness, and has great application value in text retrieval, summary
    generation, and text recommendation. The `LDA Model` is an unsupervised learning
    method that does not require pre-labeling text data. It assumes the text generation
    process follows a Bayesian probability model. A document consists of many words,
    and behind each word hides a topic. Therefore, a document can be viewed as generated
    by multiple repeated independent experiments of different topics, i.e., a multinomial
    distribution over different topics. And a topic can be viewed as generated by
    multiple repeated independent experiments of different words, i.e., a multinomial
    distribution over different words. The `LDA Model` is an unsupervised learning
    method based on multinomial distributions. By estimating the parameters of the
    probability model through training data, semantic connections between words on
    topics can be discovered from large text corpora. Also, on the basis of obtaining
    latent topics, two documents can be extracted to calculate their similarity on
    topics. Unsupervised topic `LDA` finds the probability distribution of a document
    over different topics through the topic model. If topics are treated as features,
    it can be understood that the topic model plays a role in dimensionality reduction
    to a certain extent; if topics are treated as one of multiple labels, it can be
    understood as a clustering method.


    The topic model uses repeated independent experimental sampling to represent the
    dataset matrix as the document word frequency matrix, involving the word frequency
    within a document, not the word frequency of all documents in a category. The
    general topic model assumes that a document is generated by sampling words obtained
    after multiple repeated independent experiments. In the generation process from
    document to words, there exists an intermediate stage, i.e., latent topics. In
    other words, the document probability conforms to a multinomial distribution over
    topics, and the topic probability conforms to a multinomial distribution over
    words. Therefore, the document probability conforms to a `Dirichlet Distribution`
    over words, also known as the multivariate `Beta Distribution`.


    In the unsupervised topic `LDA Model`, it is assumed that the text set D has K
    topics. The probability distribution (membership) of document d over K topics
    is represented by vector θ. The probability distribution θ of the `Dirichlet Distribution`
    has a prior hyperparameter α. This parameter is usually regarded as the probability
    of probability. The notation description is shown in Table 8.1.


    Table 8.1　Notation Description


    ![](img/txt008_1.jpg "pagenumber_ebook=222,pagenumber_book=213")


    According to the topic model, a document belongs to multiple topics, with the
    degree of belonging to a topic characterized by probability θ. Simultaneously,
    each topic also belongs to multiple words, with the degree of belonging to a word
    characterized by probability φ. Therefore, `LDA` regards a document as a mixture
    of some latent unknown distributions over the vocabulary, where all documents
    share the same K topics, only with different mixing proportions. Each document
    has its own unique topic combination.


    The topic model is a loose topic mixture model where each document is associated
    with some topics. Nd is the number of words in the document. A document is generated
    after Nd repeated independent samplings. The `LDA Model` assumes the document
    generation process satisfies a multinomial probability distribution, and the parameters
    of the multinomial distribution satisfy the `Dirichlet Distribution`. Therefore,
    the `LDA Model` is a three-layer structural model where documents generate topics
    and topics generate words. Its document generation process is as follows:


    ① Select θ～`Dirichlet(α)`. θ is the multinomial distribution parameter from document
    to topic, and α is the hyperparameter of the `Dirichlet Distribution` from document
    to topic.


    ② Select φ～`Dirichlet(β)`. φ is the multinomial distribution parameter from topic
    to word, and β is the hyperparameter of the `Dirichlet Distribution` from topic
    to word.


    ③ For each word position or observation position, select z～`Multinomial(θ)`. z
    is the topic number, and `Multinomial(θ)` is the multinomial distribution from
    document to topic with parameter θ.


    ④ For each word position or observation position, select w～`Multinomial(φz)`.
    w is the word number, and `Multinomial(φz)` is the multinomial distribution from
    topic to word on topic z.


    ⑤ Repeat the above steps until the last word of the document.


    The above process is shown in Figure 8.1. The distribution of the document over
    topics θ, i.e., the membership degree on each topic, is determined by variational
    inference. Model parameters can be obtained in the form of Bayesian variational
    inference. For notation descriptions of the `Dirichlet Distribution` and variational
    inference, see Table 8.1.


    ![](img/txt008_2.jpg "pagenumber_ebook=223,pagenumber_book=214")


    Figure 8.1　Unsupervised Learning LDA Model


    Compared with `LDA`, `SLDA` adds a response variable. The response variable can
    be a continuous numerical value or a discrete classification result. For a given
    unlabeled text, `SLDA` uses the trained model to infer its topic distribution,
    thereby predicting its response result. Relative to the response variable, the
    topic is the input variable. The relationships between different topics are mutually
    independent, while the response variable depends on the topics. If two documents
    have the same response variable, in this case, the response variable acts as a
    common topic for the two documents. If two documents have different response variables,
    the response variable can act as a unique topic determining the attribution of
    the two documents. Introducing the response variable associated with each document
    into the model, such as the legal domain of a legal text case, recommendation
    count, likes, collections, and download counts, etc. To better predict the response
    variables of unlabeled texts, it is necessary to find the latent topic distributions
    related to the response variables in the training text set. The generation process
    of document d is as follows:


    ① Select topic θd|α～`Dirichlet(a)`.


    ② For each word:


    (a) Sample topic distribution zdn|θ～`Multinomial(θd)`;


    (b) Sample word wdn|zdn～`Multinomial(φk)`.


    ③ Sample response variable yd|z1:N, η, σ2～`Normal(ηT`![](img/txt008_3.png "pagenumber_ebook=224,pagenumber_book=215")`，σ2)`.


    The above process is shown in Figure 8.2:


    ![](img/txt008_4.jpg "pagenumber_ebook=224,pagenumber_book=215")


    Figure 8.2　Supervised Learning SLDA Model


    ### 8.2.2　SLDA Solution Process


    y is the response variable. Assume the response variable follows a normal distribution
    centered at ![](img/txt008_5.jpg "pagenumber_ebook=224,pagenumber_book=215"),
    where η is the linear regression coefficient, and ![](img/txt008_6.png "pagenumber_ebook=224,pagenumber_book=215")
    is the average of topic distributions over all positions:


    ![](img/txt008_7.jpg "pagenumber_ebook=225,pagenumber_book=216")


    If the response variable is a discrete classification label, a Generalized Linear
    Model (`GLM`) is applied. A generalized linear model can establish a function
    linking the random effect and the systematic effect via a link function. The distribution
    function of the random variable belongs to the exponential family, with natural
    parameter ζ, T(y)=y as the sufficient statistic, and a(ζ) as the log normalization
    coefficient.


    ![](img/txt008_8.jpg "pagenumber_ebook=225,pagenumber_book=216")


