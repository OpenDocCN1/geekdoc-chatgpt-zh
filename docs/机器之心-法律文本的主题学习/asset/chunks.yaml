    ## 2.7 Evaluation Metrics


    Generally speaking, `Precision` and `Recall` are mutually exclusive. Improving
    `Precision` means lowering `Recall`, and improving `Recall` means lowering `Precision`.
    For example, using a learning model to predict whether a case will be won, to
    avoid missing cases that are actually won, one can predict all cases as won. Although
    this improves `Recall`, it lowers `Precision`. On the other hand, if one hopes
    to increase the proportion of actually won cases among those predicted as won,
    one only needs to predict the most confident cases as won, and classify less confident
    cases as lost. This improves `Precision`, but misses some cases that the learner
    is not confident about but are actually won, leading to a decrease in `Recall`.
    From the tables and formulas, it can be seen that to improve `Precision`, one
    needs to increase `TP` and decrease `FP`. Classifying less confident cases as
    lost: if these cases are actually won, `FN` increases; if these cases are actually
    lost, `FP` decreases while `FN` increases. The increase in `FN` lowers `Recall`.
    To improve `Recall`, one needs to increase `TP` and decrease `FN`. Classifying
    all less confident cases as won: if these cases are actually won, `TP` increases;
    if these cases are actually lost, `TN` decreases while `FP` increases. The increase
    in `FP` lowers `Precision`.


    The learning model outputs the probability of predicting the positive class as
    the result. According to the magnitude of the predicted probability, the classification
    results of the validation set samples are sorted. Samples ranked at the front
    are considered by the learning model to be highly confident; samples ranked at
    the back are considered to be less confident, as shown in Table 2.5.


    **Table 2.5 Confusion Matrix**


    ![](img/txt002_27.jpg "pagenumber_ebook=74,pagenumber_book=65")


    **Continued Table**


    ![](img/txt002_28.jpg "pagenumber_ebook=75,pagenumber_book=66")


    Each time a position is selected, cases before the position are deemed won, i.e.,
    `TP+FP`. Cases after the position are deemed lost, i.e., `FN+TN`. Based on the
    actual win/loss situation, a current `Precision` and `Recall` can be calculated
    at the current position. Selecting positions sequentially from front to back yields
    a set of binary tuples (`Recall`, `Precision`). For example, at the starting position,
    `TP+FP=1`, `FN+TN=9999`, `TP=1`, `FP=0`, `TN=99`, `FN=9900`. The starting position''s
    `Recall` `R1=0.01`, `Precision` `P1=1`. At the final position, `TP+FP=10000`,
    `FN+TN=0`, `TP=100`, `FP=9900`, `TN=0`, `FN=0`. The final position''s `Recall`
    `R10000=1`, `Precision` `P10000=0.01`. At position 100, `TP+FP=100`, `FN+TN=9900`,
    `TP=50`, `FP=50`, `TN=9836`, `FN=64`. At position 100, `Recall` `R100=0.5`, `Precision`
    `P100=0.8`. With `Recall` as the x-axis and `Precision` as the y-axis, as shown
    in Figure 2.17:


    ![](img/txt002_29.jpg "pagenumber_ebook=75,pagenumber_book=66")


    **Figure 2.17 P-R Curve**


    Different users have different preferences for `Precision` and `Recall`. Health-conscious
    users search for medical information via the Internet, hoping there are no erroneous
    medical information in the returned results; in this case `Precision` is more
    important than `Recall`. Evidence-gathering users hope to obtain all case materials;
    to avoid missing evidence, they try to expand the search scope as much as possible;
    in this case `Recall` is more important than `Precision`.


    To balance the mutually exclusive relationship between `Precision` and `Recall`,
    a balanced metric is used to comprehensively consider the effects of both. When
    `Precision` and `Recall` are equal, the balanced metric equals `Precision` or
    `Recall`. When they are not equal, the balanced metric lies between the two. The
    `F1` score is a harmonic mean of Precision and Recall, giving them equal weight:


    ![](img/txt002_30.jpg "pagenumber_ebook=76,pagenumber_book=67")


    In information retrieval, Recall and Precision involve two categories: relevant
    and irrelevant information. Recall and Precision refer to the coverage and accuracy
    of hitting the target regarding relevant information. Machine learning classification
    tasks include binary and multi-class tasks. When validating learning model performance
    and effect, one must not only examine the Recall and Precision of the positive
    class or the first class, but comprehensively examine the Recall and Precision
    of all classes. The confusion matrix for multi-class tasks is shown in Table 2.6:


    **Table 2.6 Multi-class Confusion Matrix**


    ![](img/txt002_31.jpg "pagenumber_ebook=76,pagenumber_book=67")


    Assuming there are `C` categories, the `Precision` of category `Labelc` is the
    proportion of actual category `Labelc` samples among those predicted as `Labelc`.
    The `Recall` of category `Labelc` is the proportion of samples predicted as `Labelc`
    among the actual `Labelc` samples:


    ![](img/txt002_32.jpg "pagenumber_ebook=76,pagenumber_book=67")


    Based on the definitions of `Precision` and `Recall`, the `Precision` and `Recall`
    of each category are calculated in turn, yielding (`Precision1`, `Recall1`), (`Precision2`,
    `Recall2`), …, (`Precisionc`, `Recallc`), …, (`PrecisionC`, `RecallC`). The average
    of the `Precision` values is the `Macro-Precision`, the average of the `Recall`
    values is the `Macro-Recall`, and the harmonic mean of `Macro-Precision` and `Macro-Recall`
    is the `Macro-F1`:


    ![](img/txt002_33.jpg "pagenumber_ebook=77,pagenumber_book=68")


    The model evaluation method that averages the `Precision`, `Recall`, and `F1`
    score of each category is called the `Macro-averaging` method. The model evaluation
    method that averages the corresponding values of predicted outputs and actual
    truths in the confusion matrix is called the `Micro-averaging` method. Summing
    and averaging the values on the diagonal of the confusion matrix, i.e., the average
    of correct predictions for each category, `Micro-Precision` equals the proportion
    of correctly predicted samples out of all predicted samples. `Micro-Recall` equals
    the proportion of correctly predicted samples out of all actual samples. `Micro-Precision`
    is numerically equal to `Micro-Recall`:


    ![](img/txt002_34.jpg "pagenumber_ebook=77,pagenumber_book=68")


    In the P-R graph, the classifier''s prediction for a sample is a probability.
    Setting a threshold, when the sample''s predicted probability is greater than
    this threshold, the sample is predicted as the positive class; when less than
    this threshold, predicted as the negative class. Neural networks and logistic
    regression output real numbers greater than 0 and less than 1. Samples greater
    than or equal to 0.5 are classified as positive; samples less than 0.5 are classified
    as negative. If predicted samples are sorted in descending order of probability,
    test samples closer to the front are more likely to be positive, and those closer
    to the back are more likely to be negative. The classifier needs to select a cutoff
    point; samples before the cutoff are output as positive, and samples after as
    negative. The further forward the classifier''s chosen cutoff, the higher the
    probability that samples judged as positive are actually positive, so `Precision`
    is higher, but the number of samples judged as positive is relatively small, potentially
    missing actual positive samples not judged as positive, resulting in lower `Recall`.
    The further back the cutoff, the lower the probability that samples judged as
    positive are actually positive, so `Precision` is lower, but the number of samples
    judged as positive is relatively larger, resulting in higher `Recall`. Therefore,
    the ranking of test samples'' predicted probabilities reflects the `Precision`
    and `Recall` at various cutoffs overall.


    `ROC` (Receiver Operating Characteristic) is a detection analysis technique. The
    machine learning field introduced this name to represent the overall generalization
    performance of probability prediction results. Samples are sorted by predicted
    probability from large to small. Following the same order, cutoffs are selected.
    Each time a cutoff is selected, the two values calculated in the P-R graph are
    `Precision` and `Recall`, while in the ROC graph, the two values are `True Positive
    Rate` (`TPR`) and `False Positive Rate` (`FPR`).


    `True Positive Rate` represents the proportion of positive classes successfully
    predicted by the classifier (predicted as positive, actually positive) among all
    actual positive classes. `False Positive Rate` represents the proportion of positive
    classes incorrectly predicted by the classifier (predicted as positive, but actually
    negative) among all actual negative classes:


    ![](img/txt002_35.jpg "pagenumber_ebook=78,pagenumber_book=69")


    In fact, `True Positive Rate` `TPR` is the `Recall` of the positive class. The
    larger the `TPR`, the more actual positive classes are predicted as positive.
    The larger the `FPR`, the more actual negative classes are predicted as positive.
    If a classifier''s result for judging a sample as positive is a probability value,
    by setting a threshold, samples with probability greater than the threshold are
    positive, and those less than the threshold are negative. Accordingly, an (`FPR`,
    `TPR`) value can be calculated. Taking `FPR` as the x-axis and `TPR` as the y-axis,
    this corresponds to a point on the plane. When the threshold is 1, all test samples
    are classified as negative; no positive samples are judged as positive, and no
    negative samples are classified as positive. Therefore, both `TPR` and `FPR` equal
    0. As the threshold decreases for the first time, some samples are classified
    as positive. These samples have very high predicted probabilities, a high probability
    of being actually positive, and a low probability of being actually negative.
    `TPR` grows rapidly, while `FPR` grows slowly. As the threshold further decreases
    to around 0.5, more and more samples are classified as positive. These samples
    have predicted probabilities exceeding 0.5. The number of actual positive samples
    further increases, but the rate of increase slows. The number of actual negative
    samples further increases, and the rate of increase rises. `TPR` growth slows,
    while `FPR` growth accelerates. When the threshold decreases near 0, all test
    samples are classified as positive. All positive samples are judged as positive,
    and all negative samples are also judged as positive. Both `TPR` and `FPR` equal
    1. As `FPR` increases, `TPR` also increases. Therefore, the ROC curve is a monotonically
    increasing curve of (`FPR`, `TPR`) on the interval [0, 1]. `AUC` (Area Under Curve)
    is the area enclosed under the ROC curve. When `FPR` takes smaller values, the
    threshold is higher, and the classifier with a larger corresponding `TPR` value
    performs better. The larger the `AUC` value, the better the classifier performance.


    ## 2.8 Roadmap


    The previous sections discussed the basic concepts and methods of machine learning.
    Machine learning has a typical workflow with fixed activities including data preprocessing,
    model training, model evaluation, and prediction on new data. Data preprocessing
    involves data cleaning, sample labeling, feature selection, and splitting training
    and test sets. Model training involves selecting model algorithms and tuning parameters.
    Model evaluation involves selecting performance metrics and cross-validation.
    Predicting new data generalizes the trained model to actual application scenarios,
    predicting new input samples to obtain new outputs, as shown in Figure 2.18:


    ![](img/txt002_36.jpg "pagenumber_ebook=79,pagenumber_book=70")


    **Figure 2.18 Work Roadmap**


    The data preprocessing stage consumes a significant amount of time. Data sources
    are historical data, requiring data integration operations. For missing values,
    filling operations are performed. For anomalous outliers, deletion or replacement
    operations are performed. For multi-class features, sparsification processing
    is needed. The most important operation is dimensionality reduction of the feature
    space, transforming the high-dimensional original feature space into a low-dimensional
    new feature space, including feature selection and feature extraction. Feature
    selection is a subset of the original feature space, deleting some features deemed
    irrelevant by certain methods from the original feature space, resulting in greater
    information loss. Feature extraction is a mapping of the original space, projecting
    or transforming the original feature space into a new space, resulting in less
    information loss. Appropriate data preprocessing removes noise from the data collection
    process and streamlines the space, significantly improving model performance and
    training learning efficiency.


    As seen in practical applications, for different user problems and task requirements,
    different applications and software are developed. The *No Free Lunch Theorems*
    propose that without considering specific practical problems and requirements,
    there is no learning algorithm better than another, not even better than guessing
    by rolling dice. The proverb says, if your only tool is a hammer, it is tempting
    to treat everything as a nail. There is no universally applicable classifier,
    nor an optimal learning algorithm independent of specific applications. Every
    classifier has its inherent bias. Without making assumptions about tasks related
    to the problem domain, no classification model possesses superiority; that is,
    the classifier must be relevant to the problem domain. Therefore, in practice,
    to train and select the best-performing model, at least several different learning
    algorithms must be compared to consider which algorithm is suitable for a specific
    problem, specific data, and specific distribution. Whether it can solve other
    problems need not be considered. Therefore, comparing different learning models
    on a specific problem has practical significance.


    Before comparing different algorithms and models, the metrics or standards for
    measuring performance must be clarified, such as classification accuracy. A common
    problem is how to determine the datasets for model training, model selection,
    and model evaluation. Generally, the training set is used to train the model,
    while the test set is used for model evaluation. If the test set is not used for
    model selection but reserved for final model evaluation, it will be difficult
    to determine which model performs better on the final test data or in the real
    world. One solution is to further split the training set into a training subset
    and a validation subset. A model is trained on the training subset, and its performance
    is tested on the validation subset. Then another model is trained and tested on
    the training and validation subsets. Based on the added validation set, cross-validation
    can perform model selection. The default parameters of different learning algorithms
    provided by various algorithm packages are not optimal for the user''s specific
    task training and evaluation. Therefore, parameters often need to be tuned to
    improve model performance until user requirements are met. Intuitively, hyperparameters
    can be viewed not as parameters learned from data, but as knobs for model tuning.
    Through these knobs, model performance is improved, just like the knob on an electric
    fan controlling wind speed.


    After comparing several different models on the training and validation sets,
    a model that fits the training data well and achieves good performance on the
    validation set is selected. Then the test set is used to estimate the model''s
    future performance on data generated in real environments, thereby estimating
    the model''s generalization performance. If the model performance meets user requirements,
    the model can be used to predict future new data. Additionally, the hyperparameters
    mentioned earlier, such as feature extraction and data scaling, are obtained from
    the training set. Subsequently, the same parameters are used to transform test
    set data or new samples. Otherwise, the performance measured on the validation
    or test set may be incorrect. For example, using Principal Component Analysis
    to solve for a new space in the training set, the coordinate system of the new
    space is the vector of the original space. The projection of the training set
    on this vector has maximum variance, or the dot product of the training set with
    this vector has maximum variance. The vector is the so-called parameter mentioned
    earlier. In the validation or test dataset, the same parameter, i.e., the vector,
    must be used to transform the validation or test samples.


    In the work roadmap, raw data needs to undergo missing value filling, denoising,
    and outlier processing. Supervision information is the labeled tags. Cleaned raw
    data and labels form the dataset. The dataset is split into training, validation,
    and test sets. Based on data type and distribution characteristics, some candidate
    learning algorithms are selected. A learning algorithm is selected from the candidates
    in turn. Training set data is input into the selected learning algorithm for model
    training and learning. After the model is learned, validation set samples are
    input into the trained model to test model performance and evaluate. The dashed
    line in the figure pointing to the training set means switching to another learning
    algorithm for retraining, repeating the above steps until all candidate learning
    algorithms are exhausted. Then, the performance and effects of each learning model
    are compared, and the best-performing model is selected as the final model. Finally,
    test set samples are input into the final model to evaluate the model''s generalization
    ability.


    # Chapter 3 Understanding Legal Text


    News report texts have characteristics such as timeliness, publicity, and topicality.
    The recorded words can be widely disseminated. The text is concise and to the
    point, introducing topics with facts and attracting audiences with comments. Social
    texts highlight interactivity, brevity, and entertainment, creating many Internet
    buzzwords, extensively using slang, micro-expressions, and abbreviations, containing
    much subjective and emotional content. Legal texts differ from general narrative
    texts such as news reports, and also from colloquial short texts such as social
    media. Legal texts are professional texts generated to express specific concepts,
    meanings, and phenomena and applied in legal practice and related fields.


    ## 3.1 Linguistic Features of Legal Text


    ### 3.1.1 Sources of Legal Text


    The linguistic features of legal texts are influenced by legal sources. Therefore,
    determining the source of legal texts is crucial. The legal sources of Common
    Law and Civil Law (Statute Law) are distinctly different. In some Common Law countries,
    formal legal sources include Case Law and Statute Law. Case Law refers to previous
    precedents serving as the basis for later judgments. Statute Law refers to normative
    and systematic legal documents enacted by the state that embody the state''s will.
    Case Law plays a leading role, while Statute Law plays a supplementary role, interpreting
    or restating precedents. Informal legal sources of Common Law include traditional
    customs, public order and good morals, and government public policies.


    In some Civil Law countries, laws are enacted by legislative bodies, and administrative
    departments enact some administrative regulations. China''s legal sources include
    laws enacted and promulgated by the National People''s Congress (NPC), appearing
    and presented under names such as "General Principles" or "Law"; administrative
    regulations enacted and promulgated by the State Council, appearing and presented
    under names such as "Regulations"; departmental rules enacted and promulgated
    by departments under the State Council, appearing and presented under names such
    as "Rules"; local regulations enacted and promulgated by local people''s congresses,
    appearing and presented under names such as "Provisions". For example, the *Civil
    Aviation Law of the People''s Republic of China* is a law enacted by the NPC Standing
    Committee; the *Regulations on Civil Aviation Security of the People''s Republic
    of China* is an administrative regulation enacted by the State Council; the *Civil
    Aviation Security Inspection Rules of China* enacted by the Civil Aviation Administration
    of China (CAAC) is a departmental rule; while the *Regulations on Public Safety
    Management of Unmanned Aerial Vehicles in Zhejiang Province* enacted by the Zhejiang
    Provincial People''s Congress is a local regulation.


    From the perspective of word composition in legal texts, a sentence in a legal
    text may contain words from general linguistics, or may contain legal terms in
    specific contexts. For example, "wife" in legal texts belongs to general vocabulary,
    while "minor" belongs to a specialized legal term, specifically referring to the
    group under 18 years of age. In English, "Writ" refers to a writ or a written
    legal command, a legal vocabulary in the form of a right. "Real estate" is a legal
    term, referring to the property concept of immovable property attached to land,
    while "house" is a general word, referring to a building in the form of a house.
    Legal terms are the smallest fixed units in legal texts with special meanings
    and specialized definitions. For example, "legal person" cannot be split into
    smaller linguistic units. "Real estate" cannot be split into "real" and "estate".
    Classified by different internal composition methods, legal terms can be divided
    into types such as Verb-Object structure, Modifier-Head structure, Subject-Predicate
    structure, Coordinate structure, and Complement structure.


    ### 3.1.2 Morphological Analysis of Legal Text


    `Morphology` is a branch of linguistics, mainly studying how words are formed
    and generated. A `Word` is the smallest unit in a sentence structure that can
    be used independently. A `Morpheme` is the smallest linguistic unit of `Morphology`,
    a component in `Morphology` one level lower than a `Word`.


    In Chinese, most `Morphemes` come from single-syllable Chinese characters, with
    a few disyllabic compound `Morphemes`. For example, "笔" (pen) is a writing tool,
    which can form general words like "笔筒" (pen holder), "笔迹" (handwriting), "毛笔"
    (writing brush). The disyllabic `Morpheme` "豆腐" (tofu) can form "豆腐汤" (tofu soup),
    "豆腐乳" (fermented tofu), "豆腐干" (dried tofu), "豆腐皮" (tofu skin), "老豆腐" (old tofu),
    "毛豆腐" (hairy tofu), "冻豆腐" (frozen tofu), "豆腐脑" (tofu pudding), "酱豆腐" (soy sauce
    tofu), "臭豆腐" (stinky tofu), "豆腐渣" (tofu dregs), etc. "诉讼" (litigation) can form
    legal terms like "诉讼参加人" (litigation participant), "诉讼当事人" (litigant), "诉讼代理人"
    (litigation agent), etc.


    In English, `Morphemes` are generally parts of words. For example, the general
    word "house" contains one `Morpheme`, while "houses" contains two `Morphemes`:
    "house" and "-s". The legal term "writ" contains one `Morpheme`, while "writs"
    contains two `Morphemes`: "writ" and "-s". A `Stem` is also part of a word, but
    unlike a `Morpheme`, a `Stem` allows another `Morpheme` or `Affix` to be attached
    to it. For example, "pack" is a root; adding an `Affix` "un" forms "unpack", which
    is called a `Stem`.


    The analysis task at the grammatical level is `Morphological Analysis`, used to
    analyze which `Morphemes` a word consists of, and which `Morphemes` are the smallest
    semantic constituent units. A `Morpheme` is an indivisible part of a linguistic
    sign, having a certain form and meaning. "Unmoralized" is an English word containing
    4 `Morphemes`: `un`, `moral`, `ize`, `d`. To understand this word, one needs to
    know the forms and meanings of these 4 `Morphemes`. `Morphemes` are also called
    `Affixes`, which can be divided into three types: `Prefix`, `Suffix`, and `Infix`.
    Those appearing before the `Stem` are `Prefixes`. For example, in English "untidy",
    the `Prefix` "un" means negation. Those appearing after the `Stem` are `Suffixes`.
    For example, in English "acceptable", the `Suffix` "able" means capability. Those
    appearing inside the `Stem` are `Infixes`. `Infixes` inserted into the middle
    of the `Stem` are uncommon, mainly used in chemical compound naming. For example,
    in English "pipecoline", the `Infix` "pe" means fully hydrogenated. `Morphemes`
    and `Morphological Analysis` are shown in Figure 3.1.


    ![](img/txt003_1.jpg "pagenumber_ebook=84,pagenumber_book=75")


    **Figure 3.1 Morphemes and Morphology**

