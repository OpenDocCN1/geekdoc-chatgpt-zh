    the read legal term, i.e., the order in which the legal term enters the dictionary.
    In the feature space, the index represents the legal term. If the legal term already
    exists in the dictionary, no index is added; only the existing index of the legal
    term is returned. `vsmtf` is the vector space model, with a feature count of 1,154.
    Through the dictionary and a loop, the feature space can be converted into a legal
    term text representation. As shown in Figure 7.17:


