    \n5.3.3　词干提取和词形还原\n\n在统计词汇数量时，可以将词缀不同而词干相同的词语统计到一个词项上，因为它们具有相同的含义。PorterStemmer()方法可以对当前单词进行词干提取，如图5.49所示:\n\
