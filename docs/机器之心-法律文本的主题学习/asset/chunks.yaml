    7.4.1　中文法律术语LDA模型


    语料数据来自于中国法院裁判文书网 (China Judgement Online)，简称为CJO数据集，共选取了1103份法院判决书，采用Python自然语言工具包进行分词，获取42
    777个词语，规定的法律术语词语有1154个 (见附录A)，余下的41 623个词语属于一般性词语。


    语料库CJO的法律术语特征向量矩阵为vsmtf\_legalterms\_CJO，其行数为1103，列数为1154。从slda.topic\_models中导入LDA模块，初始化LDA各个参数。K为主题数，我国法律主领域一般10个左右，子领域大概几十个。根据经验将K设置为15。alpha为将一篇法律文本表述为主题多项分布的参数，设置为1。beta为将某个主题表述为词多项分布的参数，设置为0.01。V为词语数，即法律术语特征向量矩阵的列数。如图7.31所示:


