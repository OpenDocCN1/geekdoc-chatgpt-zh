    \ Bank_name)\nvalues ('Vsquare Systems', '001', '002', '030', '2020-01-31', '2020-01-31',\
    \ 'Developer3', '$140', 168, 000000001, 'Payment Bank')\n```\n\n现在我们已经准备好数据，让我们深入验证过程。\n\
    \n3.  让我们来看一下数据验证所需的代码。 在以下代码中，我们从先前创建的时间表表中提取数据，并基于`Company Name`，`SOW_Number`，`Project_ID`，`Invoice_Number`和`Developer`创建数据框：\n\
    \n```\n#Reading data from timesheet table.\n df_timesheet = pd.read_sql(f'SELECT\
    \ * FROM timesheet', con=db_con)\n joined_df = pd.merge(df_invoice, df_timesheet,\
    \ on=['Company_Name','SOW_Number','Project_ID','Invoice_Number','Invoice_Date','Developer'])\n\
    ```\n\n在以下代码中，我们根据费率和小时数匹配发票和时间表数据框。 如果所有记录都匹配，那么我们可以继续； 如果存在差异，则不会处理发票：\n\n```\n\
    #Matching data of both tables.\n matched = []\n\n for index, row in joined_df.iterrows():\n\
    \n if row['Rate_x'] == row['Rate_y'] and row['Hours_x'] == row['Hours_y'] and\
    \                                               row['Bank_Account_Number_x'] ==\
    \                                                                   row['Bank_Account_Number_y']:\n\
    \n     matched.append(True)\n\n else:\n\n     matched.append(False)\n```\n\n#\
    \ 为发票安排付款队列（发布/订阅）\n\n在本节中，我们将学习如何将消息推送到 Pub/Sub 主题，以便发票处理系统处理发票。 我们将介绍创建发布/订阅主题的过程，以及如何发布和订阅该主题的消息。\n\
    \n让我们创建一个主题并对其进行测试：\n\n1.  要启用 Cloud Pub/Sub API，请执行以下步骤：\n\n    1.  从主页搜索发布/订阅\
    \ API。\n\n    2.  启用 API。\n\n2.  要创建发布/订阅主题和订阅，请执行以下步骤：\n\n    1.  从左侧面板中选择发布/订阅。\n\
    \n    2.  单击“创建主题”。\n\n    3.  在左侧面板中，转到“订阅”，然后为创建的主题创建订阅。\n\n3.  从以下屏幕快照中显示的选项中，将消息推送到主题中：\n\
    \n![](Images/e2a6af4d3715db1f9344350607b37815.png)\n\n4.  以下代码演示了，一旦数据匹配，我们就将一条消息推送到\
    \ Pub/Sub 主题，该信息将由付款处理系统使用以处理发票：\n\n```\n #Pushing successful message into Pub/Sub.\n\
    \ if False not in matched:\n     data = f\"Invoice Matched\"\n     publisher =\
    \ pubsub_v1.PublisherClient()\n     topic_path = publisher.topic_path('project_id',\
    \ 'topic_name')\n     bdata = data.encode(\"utf-8\")\n     future = publisher.publish(topic_path,\
    \ data=bdata)\n```\n\n# 通知供应商和 AP 团队有关付款完成的信息\n\n在撰写本文时，GCP 使用 SendGrid 发送电子邮件。\
    \ SendGrid 是一个受信任的电子邮件传递系统，该系统在全球范围内用于发送跨国和市场营销电子邮件。 这是一个非常强大的基于云的解决方案，它消除了维护电子邮件基础结构的所有复杂性。\
    \ 在本节中，我们将学习如何使用 SendGrid 发送电子邮件。 它免费提供 12,000 封电子邮件。\n\n以下是启用 SendGrid API 的步骤：\n\
    \n1.  从主页搜索云消息传递。\n\n2.  启用 S​​endGrid API。\n\n现在，让我们看看如何从 SendGrid 配置和发送电子邮件。\n\
    \n以下是示例 Python 代码，可用于从 SendGrid 发送电子邮件。 该代码非常简单，不言自明。 您只需要确保使用正确的 API 密钥即可：\n\n\
    ```\n# using SendGrid's Python Library - https://github.com/sendgrid/sendgrid-python\n\
    import sendgrid\n​\nsg = sendgrid.SendGridClient(\"YOUR_SENDGRID_API_KEY\")\n\
    message = sendgrid.Mail()\n​\nmessage.add_to(\"test@sendgrid.com\")\nmessage.set_from(\"\
    you@youremail.com\")\nmessage.set_subject(\"Sending with SendGrid is Fun\")\n\
    message.set_html(\"and easy to do anywhere, even with Python\")\nsg.send(message)\n\
    ```\n\n前面的代码用于在电子邮件正文中配置 SendGrid 客户端，收件人，发件人，主题和消息。\n\n现在，您已经了解了如何以自动化方式处理发票。\
    \ 接下来，我们将快速了解如何为 AIP 创建对话界面。\n\n# 为 AIP 创建对话界面\n\n使用存储在 Cloud SQL 中的数据构建应用后，我们可以通过启用\
    \ Dialogflow API 来启用会话界面。 我们可以创建应用上下文并训练智能体以处理与发票相关的各种用户查询。 我们需要连接到数据存储的外部集成服务，以根据应用上下文回答各种用户查询。\
    \ 我们已经在第 6 章，“使用 Dialogflow 的智能会话应用”中，看到了使用 Dialogflow 启用对话接口的详细步骤。 通过启用 Dialogflow\
    \ 智能体，自动发票处理的用例可以完全补充人的智能并避免人工干预和错误，并且可以更快，更高效地处理大量发票。\n\n在本章中，我们已经看到了各种 GCP 工具和应用在构建用于自动发票处理的智能应用中的实际应用。\
    \ 如我们所见，通过使用 GCP 工具，可以轻松无缝地开发补充人类智能的功能。 该平台本身正在不断发展，并朝着高端功能的完全普及发展，这些高端功能利用了完全托管的服务来进行存储，计算，机器学习和高级分析。\
    \ 在本章（和本书）的最后部分，我们将探讨 GCP 即将推出的一些功能。 我们期望，凭借不断的创新和 Google 在处理全球数据方面的经验，即将推出的工具，框架和应用将使在\
    \ GCP 上构建智能应用变得更加轻松，快捷和更具成本效益。\n\n# 即将推出的功能\n\n当务之急是，随着新功能的增加，GCP 将会进一步发展。 以下是我们认为将来会添加到\
    \ GCP 中的新增功能的代表列表：\n\n*   GCP 将具有更好的跨平台产品集成和可用性。 例如，IBM Power Systems 现在可以在 GCP\
    \ 上使用。 这样，通过将整个平台迁移到 GCP，即可利用企业已经在大型生产系统中进行的投资。 这将为企业节省实现成本和基础设施成本。\n\n*   即用型\
    \ AI 和 ML 模型将启用 GCP。 随着市场的成熟，GCP 将托管越来越多的 AI 和 ML 模型。 这些模型可通过具有固有互操作性的预定义 API\
    \ 来使用。 GCP 将不断对模型进行训练和调整，并随着时间的推移产生越来越好的结果。 市场将随着使用量的增加而成熟。 签署和定价将简化，以使所有经验级别（包括入门级）的开发人员都能够快速构建其企业应用。\n\
    \n*   GCP 将提供一个拖放式用户界面，以构建从问题分类到模型部署的整个 AI 管道。 届时，人工智能的力量将完全掌握在业务团队手中，而对 IT 和开发团队的依赖将减少。\
    \ 平台的简化和普及将带来进一步的创新，我们将体验不仅使用而且每个人都构建的智能应用。\n\n*   GCP 将启用针对特定行业和企业的 AI 工具包，以提高各种规模企业的盈利能力和创新能力。\
    \ 例如，谷歌已经在帮助零售商加速其数字和多渠道收入增长。 除此之外，Google 还帮助零售商变得完全由数据驱动，并提出建议（基于数据）以提高运营效率。\
    \ 这可以通过利用 GCP，Chrome Enterprise 和 Android 上的 AI 工具以及整个连接的工具箱来实现。\n\n*   GCP 上的\
    \ AI 工具包还将促进需要大量数据和计算能力以及用于构建 AI 管道的过程和接口的研究项目。 例如，谷歌正在帮助 FDA MyStudies 利用现实世界的数据进行生物学研究。\
    \ Google Cloud 正在与 FDA 合作开发 MyStudies 应用，并提供了更好，适应性更强的保护和可配置的隐私权策略。 目的是为研究组织提供自动识别和保护个人身份信息的能力。\
    \ Google Cloud 将继续投资于各种研究和研究计划，以对该平台进行总体改进，扩大支持的评估数量，并允许与下游分析和可视化工具集成。\n\n*  \
    \ AutoML Tables 使您的整个数据科学家团队能够以极高的速度和规模在结构化数据上自动构建和部署 ML 模型。 它具有出色的特征工程模型训练函数。\
    \ 训练开始时，AutoML 表将自动执行某些特征工程任务，例如对输入进行标准化。 数值函数被限制在范围内，以实现更好的模型可靠性，日期时间输入参数的规范化，基本文本处理清除和停止单词删除，并为因变量创建单热编码和嵌入。\
    \ AutoML 表在线性，前馈深度神经网络，梯度提升决策树，AdaNet 和各种模型架构的集合上执行并行测试，以确定适合您的数据集的最佳模型架构。 用户将能够使用\
    \ StackDriver 日志记录查看 AutoML 表结构，并能够导出测试数据。\n\n*   AI Hub 是即将加入 GCP 的另一个非常有用的功能。\
    \ AI Hub 是用于构建最复杂的 ML 管道的一站式设施。 可以使用预配置的笔记本使用一些预训练的模型来构建 AI 应用，以及轻松地训练新模型。 AI\
    \ Hub 还确保以一致的方式访问相关事件数据集。 还可以在模型开发上进行协作，并利用基于通用框架（例如 TensorFlow）构建的模型。 这极大地促进了在\
    \ GCP 上训练和部署模型。\n\n*   通过 AI 平台笔记本，可以通过受保护的，公开可用的笔记本实例 URL 轻松管理 JupyterLab 实例。\
