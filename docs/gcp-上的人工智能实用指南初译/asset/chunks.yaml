    \ TensorBoard 描述了 Cloud TPU。 除了学习所有这些，我们还通过了足够的技巧来编写优化的模型。\n\n在下一章中，我们将基于在实际项目上的经验，介绍在\
    \ GCP 上实现 TensorFlow 模型的最佳和行之有效的实践。\n\n# 八、使用 Cloud ML Engine 实现 TensorFlow 模型\n\
    \n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/08.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/08.md)\
    \ \n\n**Google Cloud Platform**（**GCP**）上的 Cloud ML Engine 是一种无服务器方式，可用于构建机器学习管道。\
    \ 该引擎利用基础平台组件，消除了对基础架构的配置和维护的需求。 数据科学家可以专注于数据，模型和预测。 这是在生产环境中启动并运行模型的理想且快速的方法。\
    \ 该平台固有地提供了存储和计算弹性，并且几乎无限制地扩展了模型的训练和使用已部署的模型进行实时预测的能力。\n\n在本章中，我们将深入研究 Cloud ML\
    \ Engine，并了解各种构建模块，并使用 TensorFlow 模型对机器学习管道进行实验。\n\n本章将涵盖以下主要主题：\n\n*   了解 Cloud\
    \ ML Engine 的组件\n\n*   训练和利用 TensorFlow 模型涉及的步骤\n\n*   在 Cloud ML Engine 中打包和部署您的训练应用\n\
    \n*   为您的训练工作选择正确的计算选项\n\n*   监控您的 TensorFlow 训练模型作业\n\n# 了解 Cloud ML Engine 的组件\n\
    \n首先，让我们了解 Cloud ML Engine 满足哪些机器学习工作流程单元。 Cloud ML Engine 可用于以下目的：\n\n*   训练机器学习模型\n\
    \n*   部署训练有素的模型\n\n*   将部署的模型用于预测\n\n*   通过各种参数和 KPI 监视模型使用情况\n\n*   模型管理以及版本控制\n\
    \nCloud ML Engine 具有各种组件，它们执行独特的操作并在机器学习管道中发挥作用。 这些组件是服务组件，它们利用基础平台组件并利用所需的存储和计算量，具体取决于模型的复杂性和数据量。\
    \ 这是 Cloud ML Engine 的组件。\n\n# 训练服务\n\n训练服务模型提供了一些预定义的算法，这些算法可轻松用于训练而无需编写任何代码。\
    \ 该算法可与训练数据一起使用，前提是该数据限于平台上可用算法内的预期方案。\n\n# 使用内置算法\n\n在撰写本章时，Cloud ML Engine 支持以下算法：\n\
    \n*   **线性学习器**：此学习器算法使用 TensorFlow 估计器，`LinearClassifier`和`LinearRegressor`，可用于分类和回归问题。\
    \ 该算法支持**图形处理器**（**GPU**）加速，以及默认的**中央处理器**（**CPU**）加速器。\n\n*   **宽和深**：这是一种旨在具有最佳级别的算法，用于存储训练数据并同时概括输入。\
    \ 该算法对于分类，回归和排名问题很有用。 该算法支持 GPU 加速以及默认的 CPU 加速器。\n\n*   **XGBoost**：我们已经在“第 3\
    \ 章”，“使用 XGBoost 的机器学习应用”中详细了解了此算法，Cloud ML Engine 提供了对该算法的内置包装器，并以并行的方式简化了两个阶段，即预处理和训练。\
    \ 在预处理阶段，Cloud ML Engine 将分类数据和数字数据转换为统一的数据集，该数据集完全以数字格式表示。 该算法可轻松用于诸如点击率预测之类的用例。\
    \ GPU 加速器不支持该算法，并且只能与 CPU 一起使用。\n\n一旦确定了合适的算法，就需要对输入（训练，评估和生产）数据进行格式化，以匹配内置算法的预期模式。\
    \ 数据需要以不带标题的**逗号分隔值**（**CSV**）格式提交，并且第一列应代表目标变量。 我们需要在 GCP 上为内置算法指定存储分区，以存储训练输出。\
    \ Cloud ML Engine 为训练工作提供了有限的自定义，例如使用特定的机器类型进行训练。\n\n原始的一组机器类型只能用于内置算法。 我们还可以定义需要运行作业的区域。\
    \ 默认情况下，平台会自动选择合适的区域来运行训练作业。 还可以通过使用所需的学习率和批量大小来完成特定于作业的自定义。 我们可以设置超参数调整的目标阈值，以实现最大的准确率并最小化损失函数的值。\
    \ 内置算法可在 GCP 共享空间上的容器内使用，可以与特定的**统一资源标识符**（**URI**）配合使用，如下表所示：\n\n| **算法** ||\
    \ **容器 URI** |\n\n| --- | --- |\n\n| 线性学习器 || ```gcr.io/cloud-ml-algos/linear_learner_cpu:latest``gcr.io/cloud-ml-algos/linear_learner_gpu:latest```\
    \ |\n| --- | --- |\n| 宽深 || ```gcr.io/cloud-ml-algos/wide_deep_learner_cpu:latest``gcr.io/cloud-ml-algos/wide_deep_learner_gpu:latest```\
    \ |\n\n| XGBoost || `gcr.io/cloud-ml-algos/boosted_trees:latest` |"
  fmt: "\n# 第七章：Cloud TPU 与 TPUEstimator\n\n## TPUEstimator 核心概念\n\n*   `TPUEstimator`使用`model_fn`，它包装计算并将其分配到所有\
    \ Cloud TPU 内核。为了获得最佳性能，应根据批量大小调整学习率。\n*   跨 TPU 进行计算的复制和分发由`model_fn`完成。您必须确保计算仅包含\
    \ Cloud TPU 支持的操作。\n*   通过`input_fn`函数对在远程主机 CPU 上运行的输入管道进行建模。\n*   输入操作应使用`tf.data`进行编程。\n\
    *   每次调用都会将全局批量的输入处理到一个设备上。碎片批量大小是从`batch_size`参数中获取的。确保返回数据集而不是张量以获得最佳性能。\n*\
    \   应用代码始终在客户端上运行，而工作程序执行 TPU 计算。\n*   为了获得良好的性能输入管道，操作始终放在远程工作器上，只有`tf.data`支持它。\n\
    *   为了摊销 TPU 的启动成本，模型训练步骤包含在`tf.while_loop`中，到目前为止，`tf.while_loop`仅可以包装`tf.data`。因此，正是出于这两个原因，必须使用`tf.data`。\n\
    \n## TPUEstimator 概念\n\n基本上，TensorFlow 程序可以使用图内复制和图间复制。为了运行 TensorFlow 程序，`TPUEstimator`使用图内复制。稍后，我们将介绍图内复制和图间复制之间的区别。\n\
    \nTensorFlow 会话主服务器不在`TPUEstimator`中本地运行。我们的程序创建了一个图，该图被复制到 Cloud TPU 中的所有可用核心，并且\
    \ TensorFlow 会话主服务器设置为第一个工作服务器。输入管道位于远程主机上，因此训练示例可以快速提供给 Cloud TPU。Cloud TPU 工作器之间发生同步操作；也就是说，每个工作器都在同一时间执行相同的步骤。\n\
    \n## 从 TensorFlow Estimator 转换为 TPUEstimator\n\n当您转换为任何其他工具时，请确保从一个小例子开始，然后再处理一个复杂的例子。这有助于熟悉任何工具的基本概念。\n\
    \n要将`tf.estimator.Estimator`类转换为使用`tf.contrib.tpu.TPUEstimator`，您将需要执行以下步骤：\n\n\
    1.  将`tf.estimator.RunConfig`更改为`tf.contrib.tpu.RunConfig`。\n2.  设置`TPUConfig`以指定`iterations_per_loop`。训练循环的指定迭代次数由\
    \ Cloud TPU 执行，然后返回主机。在运行所有 Cloud TPU 迭代之前，不会保存检查点或摘要。\n3.  在`model_fn`中，使用`tf.contrib.tpu.CrossShardOptimizer`包装优化器，如以下代码所示。您必须将`tf.estimator.Estimator`更改为`tf.contrib.tpu.TPUEstimator`才能转换为`TPUEstimator`：\n\
    \n```\noptimizer = tf.contrib.tpu.CrossShardOptimizer(\n    tf.train.GradientDescentOptimizer(learning_rate=learning_rate))\n\
    ```\n\n默认值`RunConfig`在每 100 个步骤后为 TensorBoard 保存摘要，并每 10 分钟写入一个检查点。\n\n## 设置 TensorBoard\
    \ 分析 TPU 性能\n\n分析任何应用的性能都是至关重要的，TensorBoard 可帮助可视化和分析 Cloud TPU 的性能。使用 TensorBoard，您不仅可以监视您的应用，还可以通过应用\
    \ TensorBoard 提供的建议来提高其性能。\n\n设置 Cloud TPU 之后，您应该安装最新版本的 Cloud TPU 分析器以创建`capture-tpu-profile`脚本。以下是运行\
    \ TensorBoard 的步骤：\n\n1.  打开一个新的 Cloud Shell 以启动 TensorBoard。\n2.  运行以下命令来设置所需的环境变量，并为您的云存储桶和模型目录创建环境变量。模型目录变量（`MODEL_DIR`）包含\
    \ GCP 目录的名称，该目录在模型训练期间存储检查点、摘要和 TensorBoard 输出。以下代码显示了带有可用于设置 TensorBoard 的参数的命令：\n\
    \n```\n$ ctpu up --name=[Your TPU Name] --zone=[Your TPU Zone]\n\n$ export STORAGE_BUCKET=gs://YOUR_ST_BUCKET_NAME\n\
    $ export MODEL_DIR=${STORAGE_BUCKET}/MODEL_DIRECTORY\n```\n\nTensorBoard 跟踪可以通过两种方式查看：\n\
    \n*   静态跟踪查看器\n*   流式跟踪查看器\n\n如果每个 TPU 需要超过一百万个事件，则必须使用流式跟踪查看器。\n\n让我们检查一下如何启用静态跟踪查看器。\n\
    \n3.  在用于设置环境变量（在上一步中设置）的同一 Cloud Shell 中运行以下命令：\n\n```\n$ tensorboard --logdir=${MODEL_DIR}\
    \ &\n```\n\n4.  在同一 Cloud Shell 的顶部，单击`Web Preview`并打开端口`8080`以查看 TensorBoard\
    \ 输出。要从命令行捕获输出，请运行以下命令：\n\n```\n$ capture_tpu_profile --tpu=[YOUR_TPU_NAME] --logdir=${MODEL_DIR}\n\
    ```\n\nTensorBoard 提供以下功能：\n\n*   TensorBoard 提供了各种选项来可视化和分析性能。\n*   您可以可视化图并利用\
    \ Profiler 来提高应用的性能。\n*   XLA 结构图和 TPU 兼容性图对于分析非常有用。\n*   还有一些分析器选项，例如概述页面、输入管道分析器、XLA\
    \ Op 配置文件、跟踪查看器（仅适用于 Chrome 浏览器）、内存查看器、吊舱查看器和流式跟踪查看器（仅适用于 Chrome 浏览器）。这些对于分析性能和调整应用非常有用。\n\
    \n## 性能指南\n\n在开发模型时，非常重要的是要对其进行调整以使其获得良好的性能。在本节中，我们将介绍一些技巧，这些技巧将帮助您提高模型在 Cloud\
    \ TPU 上的性能。这样，Cloud TPU 可以提供良好的性能，但是我们可以通过为应用设置正确的配置来增强它。\n\n在以下小节中，我们将讨论提高性能的重点领域。\n\
    \n### XLA 编译器性能\n\nXLA 编译器是标准 TensorFlow 代码库的一部分。它是 ML 编译器，可以为 CPU、GPU、TPU 和其他一些平台生成二进制文件。将\
    \ Cloud TPU 的 TensorFlow 模型转换为 XLA 图，然后 XLA 编译器将其转换为 TPU 可执行文件。在这里，我们将注意到的一件事是\
    \ TPU 硬件不同于 CPU 和 GPU 硬件。\n\nCPU 具有少量高性能线程，而 GPU 具有大量高性能线程。Cloud TPU 具有`128 *\
    \ 128`个 MXU，它们可以作为单个非常高性能的线程执行，并且每个周期可以执行 16,000 次操作，或者以管道方式连接的`128 * 128`个微小线程。\n\
    \n### 平铺的后果\n\nCloud TPU 中的数组是平铺的。这要求将其中一个维度的填充填充为 8 的倍数，将另一个维度填充为 128 的倍数。XLA\
    \ 执行数据布局转换，以将数据安排在内存中以进行有效使用。这些转变是由试探法驱动的。这对于大多数模型而言效果很好，但有时可能会出错。为了获得最佳性能，应尝试不同的配置。\n\
    \n以下是一些可以最大程度提高性能的非常重要的事情：\n\n*   填充成本应降至最低。\n*   批和特征尺寸的值应非常有效地选择。\n\n### 融合\n\
    \n如果要组合执行多个操作，则 XLA 编译器将使用融合技术来优化程序。融合操作是可以组合执行的多个操作的组合。\n\n例如，考虑以下一系列操作：\n\n\
    ```\ntf_add = tf.add(x, y)\nresult = tf.multiply(tf_add, z)\n```\n\n在步骤中，此代码将像这样执行：\n\
    \n1.  首先，循环将顺序访问元素并执行加法运算，结果将保存在`tf_add`中，并将其存储在临时存储器中，如以下代码块所示：\n\n```\nfor (i\
    \ = 0; i < cnt; i++) {\n    tf_add[i] = x[i] + y[i];\n}\n```\n\n2.  现在，将再次访问加法结果并将其相乘，如下所示：\n\
    \n```\nfor (i = 0; i < cnt; i++) {\n    result = tf_add[i] * z[i];\n}\n```\n\n\
    使用融合，数组访问会同时发生，如以下代码块所示：\n\n```\n# In Fusion both addition and multiplication\
    \ operations are performed together.\nfor (i = 0; i < cnt; i++) {\n    result\
    \ = (x[i] + y[i]) * z[i];\n}\n```\n\n在此示例中，内存往返次数减少了，并且 XLA 不需要为`tf_add`分配任何空间。\n\
    \n融合为 Cloud TPU 带来了许多好处，例如：减少了内存传输，优化了硬件利用率，等等。\n\n当两个形状相同的张量组合在一起时，广播将隐式发生，但是请注意，强制实现广播可能会导致性能下降。\n\
    \n## 了解抢占式 TPU\n\n可抢占的 TPU 是低成本 TPU，但其性能与按需 TPU 相同。但是这里要注意的是，当 Google 需要资源用于其他目的时，总可以终止它。让我们检查一下如何从控制台创建可抢占的\
    \ TPU。\n\n### 从控制台创建抢占式 TPU 的步骤\n\nGCP 为创建可抢占的 TPU 提供了简单的界面。涉及的步骤如下：\n\n1.  在\
    \ GCP 控制台上的 Compute Engine 下，选择`TPU`。如果未启用 API，请单击`ENABLE`启用它。\n2.  单击**创建 TPU\
    \ 节点**。\n3.  填写所需的详细信息，选择**可抢占性**选项，然后单击**网络，描述，标签**链接。\n4.  填写其他详细信息，然后单击屏幕底部的**创建**，您的\
    \ TPU 准备就绪。\n\n### 抢占式 TPU 的定价\n\n与按需 TPU 相比，可抢占 TPU 的价格约为价格的 30% 左右。这里要注意的一点是，抢占式\
    \ TPU 的配额高于普通 TPU 的配额，而抢占式 TPU 具有单独的配额。\n\n### 抢占式 TPU 的检测\n\n如果已经创建了 TPU，并且我们必须检查它是否可抢占，则有相应的规定。以下命令用于检测\
    \ TPU 是否可抢占：\n\n*   `ctpu`命令：运行以下命令检查已创建的 TPU 的详细信息。在“TPU 可抢占”上打印的值指示 TPU 是否被抢占，`READY`值表示未抢占\
    \ TPU，而`PREEMPTED`值表示 TPU 已被抢占：\n\n```\n$ ctpu status\n```\n\n*   `gcloud`命令：如果尚未指定区域，它将使用当前配置中的\
    \ compute 属性的值。运行以下命令以检索项目中可用于 Cloud TPU 的计算区域列表：\n\n```\n$ gcloud compute tpus\
    \ list\n```\n\n在决定使用 TPU 选项之前，请检查您的用例是否可以继续使用可抢占的 TPU，因为这样可以节省大量成本。\n\n## 总结\n\
    \n在本章中，我们获得了创建 TPU 并在其上编写模型的所有必需知识。我们已经了解了 Cloud TPU 及其组织以及 Cloud TPU 软件和硬件架构的基础。我们已经在\
    \ Google Cloud 上创建了 TPU 和可抢占的 TPU。我们已经编写了模型并使用`TPUEstimator`对其进行了训练。我们已经使用 TensorBoard\
    \ 描述了 Cloud TPU。除了学习所有这些，我们还通过了足够的技巧来编写优化的模型。\n\n在下一章中，我们将基于在实际项目上的经验，介绍在 GCP\
    \ 上实现 TensorFlow 模型的最佳和行之有效的实践。\n\n# 第八章：使用 Cloud ML Engine 实现 TensorFlow 模型\n\
    \n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/08.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/08.md)\n\
    \n**Google Cloud Platform**（**GCP**）上的 Cloud ML Engine 是一种无服务器方式，可用于构建机器学习管道。该引擎利用基础平台组件，消除了对基础架构的配置和维护的需求。数据科学家可以专注于数据、模型和预测。这是在生产环境中启动并运行模型的理想且快速的方法。该平台固有地提供了存储和计算弹性，并且几乎无限制地扩展了模型的训练和使用已部署的模型进行实时预测的能力。\n\
    \n在本章中，我们将深入研究 Cloud ML Engine，并了解各种构建模块，并使用 TensorFlow 模型对机器学习管道进行实验。\n\n本章将涵盖以下主要主题：\n\
    \n*   了解 Cloud ML Engine 的组件\n*   训练和利用 TensorFlow 模型涉及的步骤\n*   在 Cloud ML Engine\
