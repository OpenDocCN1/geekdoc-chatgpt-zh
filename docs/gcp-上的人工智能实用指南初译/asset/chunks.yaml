    \ JSON 文件中可用。\n\n至此，我们已经利用 Vision API 从发票中提取了有意义的信息，以便对其进行自动处理。 在接下来的部分中，我们将使用各种\
    \ GCP 工具存储相关数据，进行验证并安排发票付款。\n\n# 使用 Cloud SQL 存储发票\n\n在本节中，我们将介绍一个完整的过程，该过程是从\
