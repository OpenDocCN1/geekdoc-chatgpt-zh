    \n图 6.11：插槽填充和提示配置\n\n这是使对话更加有意义和自然的两个不同步骤：\n\n*   使用提示填充插槽来收集所需参数的值\n\n*   配置各种提示来收集约会时间\n\
    \n随着我们添加更多的训练短语和响应，并在我们的应用上下文中以自然的对话风格填充空位和提示，对话听起来越来越自然。 让我们使用 DialogFlow 提供的测试接口来测试\
    \ MyBookStore 智能体：\n\n![](Images/17941a0fce7b8b3dcab2c93fb148c2dd.png)\n\n图 6.12：测试\
    \ MyBookStore 智能体\n\nMyBookStore 智能体执行以下步骤：\n\n*   智能体通过各种意图和空位填充无缝地导航对话。 在这一点上，我们仅提供了答复，说已预约。\n\
    \n*   该约会尚未在后端系统中实际预订，并且尚未进行日历条目。 为了使用户能够进行日历条目，我们需要使用履行过程来创建日历条目。\n\n# DialogFlow\
    \ 支持的用例\n\nDialogFlow 引擎可以有效地用于需要人工智能体回答客户查询或执行一组预配置操作的任何行业的商务应用。 借助语音交互和强大的 NLP\
    \ 引擎，对话听起来自然，并且如果进行了广泛配置，则呼叫者很难区分人工智能体和 DialogFlow 智能体。\n\nDialogFlow 智能体提供对在开发和配置过程中经过内部训练的\
    \ ML 模型的无服务器访问。 GCP 支持的所有非函数式方面和功能固有地可用于 DialogFlow 智能体。 一些重要的优势是可伸缩性和可用性。 如果服务遇到大量流量和\
    \ API 请求，则会自动扩展群集以满足对计算资源的需求增长。 由于使用了底层的 GCP 基础架构，该平台还确保了 99.9% 的可用性。\n\n这有助于无缝地为服务提供\
    \ 24/7 客户支持。 例如，在航空公司智能体的情况下，客户可以使用 DialogFlow 提供的对话界面查询航班时刻表，预订航班或执行 Web 登机手续。\
    \ 该智能体可以 24/7 全天候提供这些服务，从而提高了服务水平并显着降低了运营成本。 智能体可以与客户的 CRM 系统集成，以便处理某些未经训练的请求。\
    \ 随着服务的使用，对日志进行分析，并建立反馈循环，会话智能体的质量会在一段时间内提高。\n\n# 使用 DialogFlow 执行音频情感分析\n\nDialogFlow\
    \ 提供了一项功能，可以对每个用户表达式执行情感分析。 当产品或服务的用户致电寻求帮助时，此功能在呼叫中心的环境中很有用。 DialogFlow 利用了 Cloud\
    \ Natural Language 的情感分析引擎。 可以从 DialogFlow 设置菜单中启用情感分析，方法是导航到“高级”设置，然后单击“为当前查询启用情感分析”。\n\
    \nDialogFlow 企业版中提供了此功能。 DialogFlow 还提供与 Cloud Natural Language 引擎的集成，以执行情感分析。\
    \ 每个用户对话都是有状态的交互，并由 DialogFlow 中的`session_id`唯一标识。 建议您在 API 调用中使用相同的会话 ID 进行连续对话。\
    \ 这是一个代码片段，用于使用 DialogFlow API 根据对话中的用户表达式执行情感分析：\n\n```\ndef get_sentiment(PROJECT_ID,\
    \ SESSION_ID, text,language_code): \n\n    import dialogflow_v2 as dialogflow\
    \  \n    session_client = dialogflow.SessionsClient()\n\n    session_path = session_client.session_path(project_id,\
    \ session_id)\n\n    text_input = dialogflow.types.TextInput(text=text, language_code=language_code)\n\
    \n    query_input = dialogflow.types.QueryInput(text=text_input)\n\n    sentiment_config\
    \ = dialogflow.types.SentimentAnalysisRequestConfig(analyze_query_text_sentiment=True)\n\
    \n    query_params = dialogflow.types.QueryParameters(sentiment_analysis_request_config=sentiment_config)\n\
    \n    response = session_client.detect_intent(session=session_path, query_input=query_input,\
    \ query_params=query_params)\n```\n\n用户表达的情感分数封装在响应对象中。 当需要智能履行智能体程序时，可以将该 API\
    \ 方便使用，该智能体程序可以与外部系统和服务集成以通过智能对话智能体程序提供增值服务。 该服务可以与外部数据源集成，以使对话对呼叫者更加有意义和有用。\n\
    \n这种集成使构建可以访问大量外部信息和服务的智能体成为可能。 该平台还提供了一个封闭的反馈环路，用于在智能体用于自然对话时改善一段时间内的对话。 该平台还提供与\
    \ Natural Language 引擎的无缝集成，以对 DialogFlow 智能体遇到的每个用户表达式执行情感分析。 利用 DialogFlow 可以轻松满足各种可能性和用例。\
    \ 使用 DialogFlow，功能团队可以使用机器智能和类似人的对话。\n\n# 总结\n\n在本章中，我们学习了 DialogFlow，它是一个用于构建对话应用的服务。\
    \ 对话式应用需要强大的 NLP 引擎，训练模型以分析用户表达的基础结构，规则引擎以及用于提供自然语言响应的智能体。 独立地构建这些功能块需要对组件进行编码。\
    \ 可伸缩性和可用性也面临挑战。\n\n我们已经看到了 GCP 上的 DialogFlow 引擎如何处理所有构造块，并允许开发人员专注于业务场景并提供简单的用户界面以及\
    \ API 层以利用服务。 无需编码即可构建具有静态内容的简单对话智能体，因此开发团队无需具备高端编程技能。 可以由业务分析师和了解服务功能方面的人员来构建简单的对话智能体。\
    \ 与外部服务（电子邮件，电话，社交媒体等）的集成也可以由实现智能体完成。\n\n在下一章中，我们将深入研究云 TPU，它们是构建高性能 ML 操作的基本构建块。\n\
