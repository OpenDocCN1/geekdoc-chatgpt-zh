- raw: "> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/sec3.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/sec3.md)\
    \ \n\n**张量处理单元**（**TPU**）是 **Google Cloud Platform**（**GCP**）上高性能 AI 应用的基本构建块。\
    \ 在本节中，我们将重点介绍 GCP 上的 TensorFlow。 本节包含三章。 我们将深入介绍 Cloud TPU，以及如何利用它们来构建重要的 AI\
    \ 应用。 我们还将通过利用 Cloud TPU 构建预测应用，使用 Cloud ML Engine 实现 TensorFlow 模型。\n\n本节包括以下章节：\n\
    \n*   “第 7 章”，“了解云 TPU”\n\n*   “第 8 章”，“使用 Cloud ML Engine 实现 TensorFlow 模型”\n\
    \n*   “第 9 章”，“构建预测应用”\n\n# 七、了解云 TPU\n\n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/07.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/07.md)\
    \ \n\n任何平台都只能发挥其优势。 利用 **Google Cloud Platform**（**GCP**）之类的平台，最重要的方面是将其投入运营，来处理业务的日常工作量。\
    \ 在本章中，我们将看到在 GCP 上运行**人工智能**（**AI**）的一些最佳实践和实用技巧。 我们将了解**张量处理单元**（**TPU**）以及\
    \ TPU 如何在内部运行以促进大规模并行计算需求，以便构建利用**机器学习**（**ML**）模型的各种服务。\n\n本章将涵盖以下主题：\n\n*  \
    \ 云 TPU 及其组织简介\n\n*   软硬件架构图\n\n*   将 TPU 用于模型开发的最佳实践\n\n*   使用`TPUEstimator`训练模型\n\
    \n*   设置 TensorBoard 以分析 TPU 性能\n\n*   表现指南\n\n*   了解抢占式 TPU\n\n# 云 TPU 及其组织的简介\n\
    \nTPU 是在 GCP 上构建各种服务和 ML 模型的基本构建块。 为了充分利用该平台，我们需要了解 TPU 的核心概念。 这些核心概念将帮助我们优化性能，并使我们能够最大程度地利用为该帐户分配的计算资源。\n\
    \nGoogle 已经开发了 TPU，以加速 ML 工作流程。 借助 Cloud TPU，用户可以使用 TensorFlow 在 Google 的 Cloud\
    \ TPU 硬件上运行其 ML 工作流。 用户可以使用 TPU（特别是线性代数算法）获得最大的性能提升。 TensorFlow 计算集群可以利用**中央处理器**（**CPU**），**图形处理器**（**GPU**）和\
    \ TPU 来构建。 在本章的后面，我们将详细讨论可以使用 TPU 并可以带来巨大好处的领域。\n\n现在，让我们快速检查一下 Cloud TPU 可用的区域。\
    \ 这将帮助您确定最近的模型部署区域：\n\n*   **在美国地区的可用性**：在撰写本章时，TPU 在美国和欧洲地区普遍可用。 以下屏幕快照所示的表格中列出了美国地区的一般可用性：\n\
    \n![](Images/4f5c5eb2265a181a477a02c3bb4e6e2c.png)\n\n**TFRC** 是 **TensorFlow\
    \ 研究云**的缩写。\n\n*   **在欧洲地区的可用性**：在以下屏幕快照中显示的表格中列出了欧洲区域的一般可用性：\n\n![](Images/6c5872501008b9abb1b2ec01b2bfbce3.png)\n\
    \n*   **在亚洲地区的可用性**：此外，GCP 在亚洲地区也正在扩展，在撰写本章时，其可用性有限，如以下屏幕快照所示。 预计随着 GCP 在整个地理区域中采用率的提高，亚洲地区的可用性也会有所提高：\n\
    \n![](Images/372420cf353d398634baf2fd0ff86cd5.png)\n\n应用可以通过**虚拟私有云**（**VPC**）网络从实例，容器和\
    \ AI 服务访问 TPU 节点。 下表概述了访问 GCP 上的 TPU 节点的方法：\n\n*   Compute Engine 上的 Cloud TPU\
    \ 非常适合需要它来管理自己的 Cloud TPU 服务的用户； 通常，建议使用 Google Cloud 的用户，因为它具有 CTPU 工具，可以为用户完成基本的后台工作，例如设置虚拟机，云存储服务和\
    \ TPU。\n\n*   当您需要在应用中进行自动扩展，灵活地更改硬件（CPU，GPU 和 TPU 之间），虚拟机的自动管理以及**无类别域间路由**（**CIDR**）时，可以使用\
    \ Kubernetes Engine 上的 Cloud TPU 块范围，更重要的是，是一个容错应用。\n\n*   经验丰富的 ML 程序员应使用 AI\
    \ 服务上的 Cloud TPU，他们可以利用 GCP 提供的托管 AI 服务。 AI 服务为用户管理 AI 工作流中的许多活动，例如在用户数据上训练 ML\
    \ 模型，部署模型，预测监控和模型管理。\n\n现在，我们对 TPU 有了基本的了解，让我们看一下 TPU 的使用领域和优势。\n\n以下屏幕快照描述了硬件使用的区域，即\
    \ CPU，GPU 和 TPU：\n\n![](Images/062093ffe2ef48d1c68ef12cb938fbe8.png)\n\n从前面的屏幕快照可以明显看出，我们需要在用例和当前问题的背景下进行思考，然后才能在\
    \ CPU，GPU 和 TPU 之间做出选择。 具有由矩阵计算控制的大量训练和评估数据的超大型模型最适合在 TPU 上进行训练。\n\n# 使用 TPU 的优势\n\
    \n在 ML 算法中，通常使用线性代数计算。 TPU 使这种计算的性能最大化； 可以在很短的时间内在 TPU 上训练在 GPU 上花费大量时间的模型。 此外，对于**卷积神经网络**（**CNN**）模型，Cloud\
    \ TPU 大大缩短了达到准确率的时间。 如果您拥有适用于 Cloud TPU 的应用，则可以在很短的时间内以非常低的成本获得最大的输出。\n\n以下屏幕快照显示了用于训练\
    \ ResNet 50 模型的 GPU 和 TPU 的快速比较。 ResNet 50 是一个 CNN 模型，已经对 ImageNet 数据库中的一百万幅图像进行了训练。\
    \ 已经观察到，如果用户使用八个 v100 GPU 和一个完整的 Cloud TPU v2 pod，则训练时间和成本都会大大降低。 虽然训练速度提高了 27\
    \ 倍，但成本也降低了 38%。\n\n以下屏幕截图比较了在 GPU 和 TPU 上进行训练的成本：\n\n![](Images/a06ae93bbd1f80da2b456dd4b88a9b44.png)\n\
    \n图 7.1 训练费用比较\n\n从前面的屏幕快照可以明显看出，TPU 可以为复杂的模型训练工作节省大量成本。 在一段时间内进行多次部署后，节省的成本变得更加重要，尤其是在生产部署场景中，该场景中需要经常训练模型。\n\
    \n# 软硬件架构图\n\n为了进一步加速数学计算，创建了专用硬件作为**专用集成电路**（**ASIC**）。 这样，尤其是在`n`-多维数学中，计算能力得到了倍增。\
    \ 在本节中，我们将详细介绍 TPU 及其相关组件的软件和硬件架构。\n\n# 可用的 TPU 版本\n\n每个 TPU 版本都包含一些主要组件，这些组件构成了\
    \ TPU 的功能。 在讨论 TPU 版本时，我们将看一下 TPU 内核的架构和 TPU 内核的**高带宽存储器**（**HBM**）。 我们将了解每个 TPU\
    \ 设备上的内核如何互连以及如何将网络接口用于设备间通信。\n\n下表显示了 TPU v2 的特征：\n\n*   每个 TPU 内核 TPU v2 的 HBM\
    \ 为 8 GB。\n\n*   每个内核具有一个`128 * 128`的**矩阵单元**（**MXU**）。\n\n*   一个 TPU 盒最多可具有 512\
    \ 个内核和 4 TB 的总内存。\n\n下图显示了 TPU v2 的组织：\n\n![](Images/6b0f9b5c437551cd2f2f8ba8338dd104.png)\n\
    \n图 7.2 TPU V2 特性\n\n下表显示了 TPU v3 的特征：\n\n*   每个 TPU 内核 TPU v3 的 HBM 为 16 GB。\n\
    \n*   每个内核具有两个`128 * 128`的 MXU。\n\n*   一个 TPU 盒最多可具有 2,048 个内核和 32 TB 的总内存。\n\n\
    下图显示了 TPU v3 的组织：\n\n![](Images/ccbe8503e373bdfaa8765f5e5aad50ff.png)\n\n图 7.3\
    \ TPU 的组织\n\n每个 TPU 内核均由标量单元，向量单元和 MXU 组成。 TPU 芯片以 MXU 计算能力为后盾。 在一个周期内，MXU 可以执行\
    \ 16,000 个**乘积**（**MAC**）操作。 MXU 输入和输出是 32 位浮点值，但是它以`bfloat16`精度执行乘法以提高精度。 每个内核可以独立执行用户操作，并且通过高带宽互连可以与其他芯片进行通信。\
    \ 对于大型 ML 工作负载，可以将多个 TPU 设备与高速网络接口互连，以获得大量的 TPU 内核和内存。\n\n# 与 TPU v2 相比，TPU v3\
    \ 的性能优势\n\n正如我们在本书前面所看到的，与 TPU v2 相比，TPU v3 具有更多的 **TeraFlops**（**TFLOPS**）和内存。\
    \ 因此，肯定有一些地方 TPU v3 可以获得比 TPU v2 更好的结果。 要确定要使用的 TPU 版本，可以在可用版本上运行模型，并使用 TensorBoard\
    \ 检查性能。\n\n以下是 TPU v3 可以改善的一些方面：\n\n*   受计算限制的模型在 TPU v3 上具有显着的优势。\n\n*   数据不适合\
    \ TPU v2 内存但适合 TPU v3 内存的情况会有所帮助。\n\n*   批量大小不适合 TPU v2 的新模型可以再次获得性能优势。\n\n* \
    \  在某些区域中，模型是输入绑定的，或者模型是内存绑定的； 在那里，您可能看不到这种性能提升。 因此，在确定 TPU 版本之前，请在预期用例的背景下进行性能基准测试和成本值分析。\n\
    \n# 可用的 TPU 配置\n\n让我们讨论 Google 提供的不同类型的 TPU 配置。\n\nGoogle 提供了两种不同类型的配置，用户可以在两个\
    \ TPU 版本中利用它们。 它们如下：\n\n*   **单设备 TPU**：这些是执行所有操作的单独设备。 这些设备未通过网络与其他 TPU 设备互连。\
