    \ Google Cloud Storage URI 和本地驱动器导入其他项目。\n\n#### 标记训练数据\n\n可以通过在上传到数据集的 CSV 文件中包含标签并使用\
    \ AutoML Natural Language UI 来为文本文档添加标签来标记训练数据：\n\n![](img/2f2fd242f2dc9ded360b626646e20026.png)\n\
    \n创建标记的训练数据集时，请考虑以下提示：\n\n*   创建具有可变长度文档以及各种写作风格和作者的数据集。较高的变化水平可提高模型准确率。\n*  \
    \ 这些文档需要对人类读者分类。AutoML 界面取决于预先标记的训练数据，因此模型的准确率取决于手动标记过程的准确率。\n*   GCP 建议每个标签有\
    \ 1,000 个训练文件。每个标签的最小文档数为 10。每个标签的训练样本数量越多，内容的变化也越大，模型的准确率就越高。\n*   对于无法归入预定义标签之一的文档，请使用\
    \ `None_of_the_above` 或等效标签。这将提高模型的准确率，而不是贴错标签或保留空白标签。\n\n#### 训练模型\n\n创建数据集并对其进行完全标记后，即可对模型进行训练。单击\
    \ TRAIN NEW MODEL 按钮，通过提供模型名称来启动异步训练过程。模型名称最多可以包含 32 个字符，并且可以包含字母、数字和下划线。模型训练所需的时间取决于训练数据的数量和变化。训练模型可能需要几分钟到几个小时。一旦模型训练完成，就会向已注册的电子邮件\
    \ ID 发送电子邮件通知。\n\n![](img/c1137cc3fc2dedfb7536490ffaff1b7b.png)\n\n如下面的屏幕快照所示，模型经过训练后，将显示模型属性（例如，模型创建时的日期时间和训练数据的定量性质）以及质量参数（例如**精度**和**召回**）：\n\
    \n#### 评估模型\n\n与传统的机器学习管道不同，在传统的机器学习管道中，我们需要在评估数据集上评估模型，而 GCP 在内部使用测试集中的项目评估模型。在此阶段检查模型的质量和准确率。AutoML\
    \ 提供了两个级别的聚合质量指标，这些指标指示模型在所有特征和标签以及每个类别标签上的总体训练水平。GCP 报告了以下指标：\n\n*   **AuPRC**（精度和召回曲线下的**面积**）：这表示平均精度。典型值在\
    \ 0.5 到 1.0 之间。值越高表示模型越准确。\n*   **精度和召回曲线**：AutoML 提供了一种交互式方式来设置标签的阈值。较低的阈值会增加召回率，但会降低精度：\n\
    \n![](img/79537a35f4b894a74705dcf209169caa.png)\n\n*   **混淆矩阵**：这可以可视化模型的准确率，以预测输出类别。它代表评估阶段训练数据中输出标签的百分比：\n\
    \n![](img/e21b8df59005cb41b14b7958c54bc5e9.png)\n\n这些易于使用的 AutoML 度量标准可用于评估模型的可靠性，从而预测实际数据集上的输出类别。如果混乱程度很高，而准确率和召回率得分很低，则该模型可能需要其他训练数据。\n\
    \n除了用于模型评估的 Web 界面之外，GCP 还提供了一个可编程的 API 接口，用于使用命令行、Python、Java 和 Node.js 进行评估。\n\
    \n#### 命令行\n\n使用以下命令通过将 `model-name` 替换为实际模型名称来获取 JSON 格式的模型评估参数：\n"
