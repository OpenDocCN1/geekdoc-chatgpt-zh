    \ 的屏幕截图，展示了所需的步骤：\n\n![](Images/c7da7da6fc0e901a426fc20561bef27d.png)\n\n还可以通过\
    \ REST API 使用命令行以及以编程方式测试和使用该模型。\n\n创建一个 `image_classification_request.json` 文件，如下所示：\n\
    \n```json\n{ \"payload\": { \"image\": { \"imageBytes\": \"IMAGE_BYTES\" } } }\n\
    ```\n\n将以下请求发送到 Web 服务：\n\n```bash\ncurl -X POST -H \"Content-Type: application/json\"\
    \ \\\n  -H \"Authorization: Bearer $(gcloud auth application-default print-access-token)\"\
    \ \\\n  https://automl.googleapis.com/v1beta1/projects/ai-gcp-ch4/locations/us-central1/models/ICN7883804797052012134:predict\
    \ -d @image_classification_request.json\n```\n\n## Python 代码\n\n以下是可在应用内用于基于一组新图像调用模型的\
    \ Python 代码：\n\n```python\nimport sys\nfrom google.cloud import automl_v1beta1\n\
    from google.cloud.automl_v1beta1.proto import service_pb2\n\ndef get_prediction(content,\
    \ project_id, model_id):\n    prediction_client = automl_v1beta1.PredictionServiceClient()\n\
    \    name = 'projects/{}/locations/us-central1/models/{}'.format(project_id, model_id)\n\
    \    payload = {'image': {'image_bytes': content }}\n    params = {}\n    request\
    \ = prediction_client.predict(name, payload, params)\n    return request # waits\
    \ till request is returned\n\nif __name__ == '__main__':\n    file_path = sys.argv[1]\n\
    \    project_id = sys.argv[2]\n    model_id = sys.argv[3]\n    with open(file_path,\
    \ 'rb') as ff:\n        content = ff.read()\n    print(get_prediction(content,\
    \ project_id, model_id))\n```\n\n如本节中所述，AutoML 使训练该图像分类模型变得无缝且容易，并且该模型已部署在云上，并且可以由经过认证的用户和服务帐户使用简单的\
    \ API 接口进行访问。\n\n# 使用语音文本 API 执行语音文本转换\n\nGCP 提供了一个非常有效且易于使用的 API，用于语音到文本的转换。尽管界面简单直观，但下方仍存在深度神经网络，可不断训练并丰富语音到文本模型。应用开发人员无需了解底层细节以及特定的神经网络配置和调整。在撰写本文时，API\
    \ 可以识别一百多种语言和方言。该平台以批量和实时模式提供语音到文本转换服务。随着平台被越来越多的用户用于转换，模型的准确率会在一段时间内提高。该平台还提供用于自动检测口语的\
    \ API。在允许语音命令的特定用例中，此功能非常方便。该 API 允许选择适合特定用例的预构建模型。例如，**命令和搜索**模型最适合语音命令，**电话**模型最适合记录电话对话。下图描述了语音文本\
    \ API 的所有受支持的功能：\n\n![](Images/87a60628eac950267fdf15ca702d492e.png)\n\n在本节中，我们将遍历\
    \ API 并了解如何利用语音转文本 API 来构建应用。\n\n与语音到文本 API 交互的方法有以下三种：\n\n*   **同步识别**：这是一个阻塞\
    \ API 调用，适用于少于 1 分钟的音频内容。音频数据将发送到 REST 或 gRPC 端点。仅当转录整个音频内容时，API 才会响应。\n*   **异步识别**：这是一个非阻塞\
    \ API 调用，适用于持续时间较长的音频内容（最长 480 分钟）。此 API 调用在云上启动了长期运行的操作，并且调用服务需要定期轮询以获取转录结果。呼叫服务需要在后续呼叫期间管理文本数据，以优化表现。\n\
    *   **流识别**：用于实时转录，并通过 gRPC 作为双向流进行支持。文本转换过程是实时的，并且响应文本可以作为连续流使用。呼叫服务需要收集时间序列数据并将其用作流。\n\
    \n## 同步请求\n\n请求主体由配置参数和音频文件的路径组成。同步请求示例如下：\n\n```json\n{\n  \"config\": {\n  \
    \  \"encoding\": \"LINEAR16\",\n    \"sampleRateHertz\": 16000,\n    \"languageCode\"\
    : \"en-US\"\n  },\n  \"audio\": {\n    \"uri\": \"gs://bucket-name/path_to_audio_file\"\
    \n  }\n}\n```\n\nJSON 请求正文中的 `config` 字段是 `RecognitionConfig` 对象的体现，其 JSON 表示如下：\n\
    \n```json\n{\n  \"encoding\": \"enum (AudioEncoding)\",\n  \"sampleRateHertz\"\
    : \"number\",\n  \"audioChannelCount\": \"number\",\n  \"enableSeparateRecognitionPerChannel\"\
    : \"boolean\",\n  \"languageCode\": \"string\",\n  \"maxAlternatives\": \"number\"\
    ,\n  \"profanityFilter\": \"boolean\",\n  \"speechContexts\": [\n    {\n     \
    \ \"object\": \"(SpeechContext)\"\n    }\n  ],\n  \"enableWordTimeOffsets\": \"\
    boolean\",\n  \"enableAutomaticPunctuation\": \"boolean\",\n  \"metadata\": {\n\
    \    \"object\": \"(RecognitionMetadata)\"\n  },\n  \"model\": \"string\",\n \
    \ \"useEnhanced\": \"boolean\"\n}\n```\n\n下表中定义了 JSON 模板中的字段：\n\n| **字段名称** |\
    \ **类型** | **说明** |\n| --- | --- | --- |\n| `encoding` | `enum` | 该字段定义了需要转录的音频文件的编码。API\
    \ 支持以下值： |\n| | | `ENCODING_UNSPECIFIED` |\n| | | `LINEAR16` – 16 位未压缩格式 |\n|\
    \ | | `FLAC`（**免费无损音频编解码器**）：这种编码比 `LINEAR16` 更可靠，并且需要一半的带宽 |\n"
  trans: "\n这是可用于调用 API 的 HTTP POST URL（在此 URL 字符串中替换 `Project_ID`、`Region` 和 `datasetId`）：\n\
    \n```\nPOST https://automl.googleapis.com/v1beta1/projects/ai-gcp-ch4/locations/us-central1/datasets/ICN7902227254662260284:importData\n\
    ```\n\n请求正文包含以下 JSON 格式的有效负载：\n\n```json\n{\n  \"inputConfig\": {\n    \"gcsSource\"\
    : {\n      \"inputUris\": \"gs://ai-gcp-ch4-vcm/img/flower_photos/all_data_updated.csv\"\
    \n    }\n  }\n}\n```\n\n将请求正文保存在 `import_images_request.json` 文件中，然后在 Cloud Shell\
    \ 上发送 `curl` 请求：\n\n```bash\ncurl -X POST \\\n  -H \"Authorization: Bearer $(gcloud\
    \ auth application-default print-access-token)\" \\\n  -H \"Content-Type: application/json;\
    \ charset=utf-8\" \\\n  -d @import_images_request.json \\\n  https://automl.googleapis.com/v1beta1/projects/ai-gcp-ch4/locations/us-central1/datasets/ICN7902227254662260284:importData\n\
    ```\n\n也可以通过导入 `automl_v1beta1` 包从 Python 调用该 API。这是用于将图像导入数据集中的 Python 代码段：\n\
    \n```python\nproject_id = 'ai-gcp-ch4'\ncompute_region = 'us-central1'\ndataset_id\
    \ = 'ICN7902227254662260284'\npaths = 'gs://ai-gcp-ch4-vcm/img/flower_photos/all_data_updated.csv'\n\
    \nfrom google.cloud import automl_v1beta1 as automl\n\nclient = automl.AutoMlClient()\n\
    dataset_full_id = client.dataset_path(project_id, compute_region, dataset_id)\n\
    input_config = {'gcs_source': {'input_uris': paths}}\nresponse = client.import_data(dataset_full_id,\
    \ input_config)\nprint('Processing import...')\nprint('Data imported. {}'.format(response.result()))\n\
    ```\n\n将图像加载到数据集中后，下一步就是训练分类模型。\n\n# 训练模型\n\nGCP AutoML 抽象了实际模型训练的复杂性，并从数据集中的图像创建了三个唯一的集合。80%\
    \ 的图像被随机标记为训练集，而 10% 的图像分别用于评估和测试集。一个简单的界面启动分类模型训练过程：\n\n![](img/cfab9a99d9d2f54c2d907a894c1e37a2.png)\n\
    \n根据训练图像的数量、标签的数量以及分配的计算资源，模型训练最多可能需要 15 分钟或几个小时。该过程是异步的，一旦模型训练完成，便会触发电子邮件。模型训练也可以通过命令行和调用\
    \ API 来完成。\n\n这是训练模型的 `POST` 请求（为 `Project_ID`、`Region`、`datasetId` 和 `displayName`\
    \ 使用适当的参数；`displayName` 是模型的名称，可由用户选择）：\n\n```bash\ncurl \\\n  -X POST \\\n  -H\
    \ \"Authorization: Bearer $(gcloud auth application-default print-access-token)\"\
    \ \\\n  -H \"Content-Type: application/json\" \\\n  https://automl.googleapis.com/v1beta1/projects/ai-gcp-ch4/locations/us-central1/models\
    \ \\\n  -d '{\n       \"datasetId\": \"ICN7902227254662260284\",\n       \"displayName\"\
    : \"aigcpch4-image-clasification-model\",\n       \"image_object_detection_model_metadata\"\
    : {\n            \"model_type\": \"cloud-low-latency-1\"\n       }\n    }'\n```\n\
    \n`model_type` 有两个选项。`cloud-low-latency-1` 以模型准确率为代价来最小化训练时间，而 `cloud-high-accuracy-1`\
    \ 通过进行更多次训练迭代来最小化训练误差并创建更准确的模型，因此需要更多的时间和计算资源来进行训练。需要根据特定用例以及时间和成本预算进行选择。可以利用\
    \ AutoML Vision API 进行实用的模型训练。这是训练模型的 Python 代码：\n\n```python\nproject_id = 'ai-gcp-ch4'\n\
    compute_region = 'us-central1'\ndataset_id = 'ICN7902227254662260284'\nmodel_name\
    \ = 'aigcpch4-image-clasification-model'\n\nfrom google.cloud import automl_v1beta1\
    \ as automl\n\nclient = automl.AutoMlClient()\nproject_location = client.location_path(project_id,\
    \ compute_region)\n\nmy_model = {\n    'display_name': model_name,\n    'dataset_id':\
    \ dataset_id,\n    'image_object_detection_model_metadata': {\n        \"model_type\"\
    : \"cloud-low-latency-1\"\n    }\n}\nresponse = client.create_model(project_location,\
    \ my_model)\nprint('Training image object detection model...')\n```\n\n模型训练完成后，该模型将在\
    \ AutoML Vision Web 界面的“模型”部分列出：\n\n![](img/da1307c87ee4e618840c7b10e0c8d6cc.png)\n\
    \n下一步是评估模型的准确率。可在 Web 界面的 `EVALUATE` 选项卡下获得评估统计信息。\n\n# 评估模型\n\n使用训练集对模型进行训练后，评估集将用于模型评估。评估结果位于“评估”选项卡中，并显示“平均精度”、“精度”和“召回率”。这是用于评估模型的\
    \ Web 界面的屏幕截图：\n\n![](img/7ad952d5af3d2405c4791cd53ba866f6.png)\n\n如屏幕截图所示，我们在用户界面上获得了模型评估指标。我们得到以下重要的模型训练参数：\n\
    \n*   **平均精度**：这可衡量所有得分阈值上的模型表现。\n*   **精度**：这是对阳性指示正确比例的度量。在数学上，精度定义为 `Pred =\
    \ TP / (TP + FP)`。真阳性（`TP`）代表模型正确预测肯定类别的结果。假阳性（`FP`）表示模型错误地预测阳性类别的结果。\n*   **召回率**：这是对正确识别的实际阳性比例的度量。在数学上，召回率定义为\
    \ `Recall = TP / (TP + FN)`。假阴性（`FN`）表示模型错误地预测阴性类别的结果。\n\n可以同时使用精度和召回率指标对模型进行全面评估，因此平均精度对于理解模型的有效性非常重要。AutoML\
    \ 提供了所有标签上模型参数的合并视图以及特定标签的参数值：\n\n![](img/13270a066a1f09f5804cfd967f97c83f.png)\n\
    \n可以使用 REST API 评估模型，可以通过命令行以及调用 REST API 来完成。\n\n## 命令行界面\n\n这是用于从 GCP AutoML\
    \ 上部署的模型中获取模型评估的命令：\n\n```bash\ncurl -X GET \\\n  -H \"Authorization: Bearer $(gcloud\
    \ auth application-default print-access-token)\" \\\n  https://automl.googleapis.com/v1beta1/projects/ai-gcp-ch4/locations/us-central1/models/ICN7883804797052012134/modelEvaluations\n\
    ```\n\n我们需要提供项目名称、区域和模型 ID，以便使用命令行界面获得评估。\n\n## Python 代码\n\n这是一段 Python 代码，可用于获取已部署模型的模型评估。我们需要传递\
    \ `project_id`、`region` 和 `model_id` 作为参数：\n\n```python\nproject_id = 'ai-gcp-ch4'\n\
    compute_region = 'us-central1'\nmodel_id = 'ICN7883804797052012134'\nfilter_ =\
    \ ''\nfrom google.cloud import automl_v1beta1 as automl\nclient = automl.AutoMlClient()\n\
    model_full_id = client.model_path(project_id, compute_region, model_id)\nresponse\
    \ = client.list_model_evaluations(model_full_id, filter_)\nprint('List of model\
    \ evaluations:')\nfor element in response:\n    print(element)\n```\n\n一旦建立了模型并评估了阈值准确率，就可以使用一组新图像来测试模型了。\n\
