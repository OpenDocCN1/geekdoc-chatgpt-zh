    \ Cloud Storage 中。因此，在这种情况下，即使抢占式实例发生故障，该作业也将转移到另一个节点，并且不会产生任何影响。Cloud Dataproc\
    \ 集群的定价随实例而异，但是具有非常有竞争力的定价。\n\n# Cloud Dataproc 和 AI 应用\n\nCloud Dataproc 可以使用\
    \ Apache Spark、Hadoop 和其他工具来满足各种 AI 和 ML 用例。将 Dataproc 视为完全托管的云 Hadoop 和 Spark\
    \ 集群。可以在 Hadoop 和 Spark 上构建的所有 AI 和 ML 用例都可以在 Cloud Dataproc 集群上构建。\n\n# Cloud\
    \ Dataflow\n\nCloud Dataflow 是用于运行批量和流应用的完全托管服务，并且具有用于运行 AI 和 ML 作业的丰富集成。它是 Google\
    \ 提供的无服务器服务，基于 Apache Beam 构建，因此，批量代码和流代码都可以相互使用。可以以非常简化的方式用 Java 和 Python 构建\
    \ Cloud Dataflow 应用。\n\nCloud Dataflow 与其他 GCP 服务集成在一起，例如 Cloud Pub/Sub、Cloud\
    \ Machine Learning、Stackdriver、BigQuery 和 Bigtable，这使得构建 Cloud Dataflow 作业非常容易。在\
    \ Cloud Dataflow 之下，App Engine 正在运行，因此用户拥有无限的能力来扩展其工作。Cloud Dataflow 会根据工作需求自动扩展。\n\
    \n除了已处理数据的定价外，批量和流作业的 Cloud Dataflow 定价基本相同。它根据 VCPU、RAM、持久性存储和处理的数据量进行收费。\n\n\
    # Cloud Dataflow 和 AI 应用\n\nCloud Dataflow 可以与 Cloud Machine Learning 集成，服务于各种\
    \ AI 和 ML 用例。欺诈检测是一个经典的用例，可以使用 Cloud Dataflow 和 Cloud Machine Learning 实现流作业。\n\
    \n到目前为止，我们已经了解了 GCP 的基本知识，这将有助于我们有效地使用平台，做出正确的选择并建立有效的管道。现在，您已了解 GCP 上所有可用的计算、存储和处理选项。现在，让我们开始构建\
    \ ML 管道。\n\n# 建立 ML 管道\n\n让我们来看一个详细的示例，在该示例中，我们将建立一条端到端的管道，从将数据加载到 Cloud Storage，在其上创建\
    \ BigQuery 数据集，使用 BigQuery ML 训练模型并对其进行测试。在此用例中，我们将使用逻辑回归模型来查找潜在客户转化概率。您可以使用选择的任何合适的数据集并遵循此示例。\n\
    \n潜在客户数据包含有关潜在客户的各种属性。BigQuery ML 具有内置功能，我们可以直接在任何数据集中训练模型。我们可以预测输出变量和转换概率。BigQuery\
    \ 提供了一个 SQL 接口来训练和评估机器学习模型。该模型可以部署在平台上进行消费。\n\n我们有两个数据集：潜在客户训练数据和测试数据，其中训练数据为实际总体数据的\
    \ 80%，测试数据为 20%。使用训练数据训练模型后，我们将在测试数据上评估模型，并在以下类别中找到每个潜在客户的潜在客户转换概率：\n\n* Junk\
    \ lead（垃圾线索）\n* 合格（Qualified）\n* 有兴趣（Interested）\n* 封闭（Closed）\n* 没兴趣（Not interested）\n\
    * 不合格（Not eligible）\n* 无法到达（Unreachable）\n\n# 了解流程设计\n\n下图代表了将数据加载到 Cloud Storage\
    \ 和 BigQuery 中以及对模型进行训练并使用潜在客户数据进行测试的端到端过程。您可以选择一个数据集：\n\n![](img/377a6af903a1818510aba173ff6ae7fc.png)\n\
    \n从上图中，我们可以看到以下内容：\n\n1. 我们已将潜在客户的训练和测试数据集加载到 Cloud Storage 存储桶中。\n2. 将数据加载到 Cloud\
    \ Storage 后，我们将使用 `leads_training` 和 `leads_test` 这两个表将潜在客户数据集创建到 BigQuery 中。\n\
    3. 创建数据集后，我们将使用 `leads_training` 表来训练我们的模型，并使用 `leads_test` 表来测试模型。\n\n我们将在以下各节中详细讨论每个步骤。\n\
    \n# 将数据加载到 Cloud Storage\n\n让我们讨论将数据加载到 Cloud Storage 中的分步过程：\n\n1. 您应该具有训练和测试数据。\n\
    2. 在 Cloud Storage 中创建训练和测试存储桶。\n3. 在 GCP 控制台中，单击左上角的导航菜单，然后在存储部分中，单击“存储（云存储）”。\n\
    4. 单击顶部的创建存储桶。您将看到以下屏幕：\n"
