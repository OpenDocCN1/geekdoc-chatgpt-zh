    \ GB 的存储空间，向用户收取 0.18 美元，写入 100,000 个文档 0.18 美元，读取 100,000 个文档 0.06 美元和删除相同数量的文档\
    \ 0.02 美元。\n\n# Cloud Firestore 和 AI 应用\n\nCloud Firestore 可以充当 AI 和 ML 用例中存储在移动和\
    \ Web 设备上的应用的存储。在 GCP 上托管的具有网站和移动应用的任何应用都可以将数据保存在 Firestore 中，并且可以使用此数据训练 ML 模型，并可以在其移动设备和网站应用上向用户提供所需的建议。\n\
    \n# Cloud SQL\n\nCloud SQL 是 MySQL 和 PostgreSQL 的完全托管实例。Cloud SQL 的功能如下：\n\n*\
    \ 它具有可扩展性，是高达 10 TB 数据的正确选择。\n* 它的实例可以在任何时间和适合应用的区域中立即创建。\n* 可以创建的实例的范围从 1 个虚拟\
    \ CPU（`VCPU`）到 64 个 `VCPU`，以及 600 MB RAM 到 400 GB RAM。\n* 关于持久性存储，用户可以选择 SSD 或\
    \ HDD 存储。速度更快的 SSD 比 HDD 的成本更高。\n* 可以启用自动持久性存储，以确保数据库不会耗尽空间。高可用性是可选的，并且取决于用户是否启用它。\n\
    * 可以从大多数 GCP 计算和处理服务访问 Cloud SQL 实例。\n* 最快的访问方式之一是使用 Google Cloud Shell。实例的所有更新和补丁都是自动的，用户无需担心。\n\
    * Cloud SQL 是高度安全的，并且默认情况下，其中存储的所有数据都是加密的。\n* 从 GCP 外部访问 Cloud SQL 的应用必须经过健壮的安全层才能对其进行访问。\n\
    * Cloud SQL 很便宜，并且为实例提供了很多持续的用户折扣价格。\n* 根据实例类型的不同，每小时的价格范围为 0.0150 – 8.0480 美元。永久存储的价格为：SSD\
    \ 为 0.17 美元，HDD 为 0.09 美元，备份为 0.08 美元。\n\n# Cloud SQL 和 AI 应用\n\nCloud SQL 可以为大型和复杂的结构化数据提供所有\
    \ AI 和 ML 用例。另一个名为 Cloud Spanner 的服务可以提供类似的用例，Cloud SQL 可以提供类似的用例，但是规模非常大。\n\n\
    # Cloud Spanner\n\nCloud Spanner 是完全托管的，可横向扩展的关系数据库管理服务。它可以在所有可用区域中扩展到数百万个节点。Cloud\
    \ Spanner 的功能如下：\n\n* 可以立即创建它的实例，并且可以在单个或多个区域中创建适合该应用的实例。\n* 可以从一个节点到数百万个节点创建\
    \ Cloud Spanner 实例。\n* 即使 Cloud Spanner 是分布式数据库，它仍支持 ACID 事务，其可用性为 99.999%。Cloud\
    \ Spanner 具有 RDBMS 等功能和可扩展性（如分布式数据库）。\n* 可以使用大多数 GCP 计算和处理服务以及外部 GCP（具有正确的权限集）访问\
    \ Cloud Spanner 实例。\n* 最快的方法之一是使用 Google Cloud Shell 快速访问它。实例的所有更新和补丁都是自动的，用户不必担心。\n\
    * Cloud Spanner 是高度安全的，默认情况下，所有存储的数据都是加密的。\n* 它与身份和访问管理集成在一起，并提供诸如审核和日志记录之类的功能。\n\
    * 它提供两种定价，一种用于区域设置，另一种用于多区域设置。\n* 区域实例的每个节点价格为 0.90 美元，而多区域节点的价格为每小时每个节点 3 美元。\n\
    * 对于区域实例，持久性存储的价格为每月每 GB 0.30 美元，对于多区域实例，永久性存储的价格为每月每 GB 0.50 美元。\n\n# Cloud Spanner\
    \ 和 AI 应用\n\nCloud Spanner 可以提供适用于 MySQL 和 PostgreSQL 的所有 AI 和 ML 用例。Cloud SQL\
    \ 适用于服务需要高达 10 TB 结构化数据的 AI 和 ML 用例；例如，机器学习用例需要数据准备，这涉及复杂的 SQL 连接并可以提高流程效率。\n\n\
    # Cloud Memorystore\n\nCloud Memorystore 是基于 Redis 构建的完全托管的内存中数据存储服务。以下是 Cloud\
    \ Memorystore 的功能：\n\n* Redis 是一个通用的数据库，可以用于很多用例。通常，人们将 Redis 用作缓存服务，但是它具有各种不同的数据结构，可以为`物联网`（`IoT`），ML，流式传输等其他用例提供服务。\n\
    * 借助 Cloud Memorystore，Google 本质上提供了可伸缩且高度可用的 Redis 实例。\n* Google 针对 Cloud Memorystore\
    \ 的`服务级别协议`（`SLA`）对于标准层为 99.9%，并且受到 Google 的网络策略和基于角色的访问控制的完全保护。\n* Cloud Memorystore\
    \ 分为两层：基本层和标准层：\n    * 基本实例非常适合用作缓存服务，并且不会附加任何 SLA。\n    * 标准实例提供了高可用性，并在另一个区域中部署了副本，因此它可以从区域故障中恢复。\n\
    * 根据 Redis M1-M5 的存储容量和网络容量，可分为五个容量层，分别从 1 GB 到 300 GB 和 3 Gbps 到 12 Gbps 不等。\n\
    * 由于 Cloud Memorystore 遵循所有 Redis 协议，因此很容易在其上提升和转移现有 Redis 项目。\n* Cloud Memory\
    \ 与身份和访问管理以及 Stackdriver 集成在一起，后者提供 24/7 系统监视等功能来保护您的数据，检查 Memorystore 的性能等。其数据始终驻留在\
    \ VPC 中。\n* 由于 Cloud Memorystore 具有五种不同的容量，因此其价格也会相应变化。价格范围从每小时每 GB 0.016 美元到每小时每\
    \ GB 0.049 美元。\n\n# Cloud Memorystore 和 AI 应用\n\nCloud Memorystore 可以使用 Redis\
    \ ML 模块满足各种 AL 和 ML 用例。Redis ML 具有各种 ML 模块作为内置数据类型。Cloud Memorystore 可以为线性和逻辑回归，决策树矩阵计算等提供机器学习模块服务。\n\
