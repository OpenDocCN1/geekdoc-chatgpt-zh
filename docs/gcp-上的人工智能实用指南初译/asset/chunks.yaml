- raw: "XGBoost 是由 Tianqi Chen 开发的，其全名是 eXtreme Gradient Boosting。 XGBoost 是梯度助推器机器的一种可扩展且准确的实现方式，仅针对模型表现和计算速度而开发，作为助力树算法的计算机功率极限。\
    \ 陈天琪说，后者使它更具优势，与其他库有所不同。 以下是 XGboost 使其独特的一些重要功能：\n\n*   **并行化**：在 XGBoost 中并行构建顺序树。\
    \ 用于构建基础学习器的循环可以互换。 因此，列出树的叶节点的外循环可以与计算特征的内循环互换。 如果这是原始方式，则必须在外部循环开始之前完成内部循环，而内部循环不会占用更多的计算量。\
    \ 在 XGBoost 中，为了缩短运行时间，通过初始化全局扫描并使用所有实例的并行线程进行排序来交换循环的顺序。 此开关通过抵消任何并行开销来提高算法效率。\n\
    \n*   **停止标准**：在梯度提升框架中，用于树分割的停止标准基于分割时的负损失函数。 但是，对于 XGBoost，它将按指定的`max_depth`参数开始向后修剪树。\
    \ 这是一种深度优先的方法，可以提高算法的整体性能和效率。\n\n*   **最大硬件资源使用率**：XGBoost 旨在最大程度地利用硬件资源。 它通过每棵树中的内部缓冲区利用系统缓存来存储梯度统计信息。\
    \ 其他改进包括计算核外和优化可用磁盘空间，同时处理不适合内存的大数据帧。\n\n# 训练和存储 XGBoost 机器学习模型\n\n在本节中，我们将研究如何使用\
    \ Google AI Hub 训练和存储机器学习模型。 AI Hub 是一站式存储，用于检测，共享和部署机器学习模型。 它是可重用的模型目录，可以快速安装在\
    \ AI 平台执行环境中。 该目录包含基于以下通用框架的模型设计的汇编：TensorFlow，PyTorch，Keras，scikit-learn 和 XGBoost。\
    \ 每种模型都可以包装由 GPU 或 TPU，Jupyter 笔记本和 Google 自己的 AI API 支持的深度学习 VM，格式可以在 Kubeflow\
    \ 中实现。 每个模型都有标签，这些标签可根据一系列特征来方便信息的搜索和发现。 借助`.../text_classification_rapids_framework.py`处的代码，我们将\
    \ XGBoost 与 RAPIDS 框架一起用于文本分类。\n\n从算法上讲，此代码执行以下步骤：\n\n1.  导入了必要的包。 在较高级别上，此代码使用`OS`，`google.cloud`，`cudf(RAPID)`，`sklearn`，`pandas`和`xgboost`。\
    \ 它还会导入`pynvml`，这是一个 Python 库，用于低级 CUDA 库，用于 GPU 管理和监视。\n\n2.  接下来，代码将安装`miniconda`库和\
    \ RAPIDS 平台，然后设置 NVIDIA GPU 所需的一些环境变量。\n\n3.  代码的下一部分将设置访问 Google API 所需的一些常量，例如`project\
    \ id`和`bucket id`。\n\n4.  然后，该代码从 GCS 存储桶中下载训练数据（`text_classification_emp.csv`）。\
    \ 然后将其存储在本地作业目录中以供进一步使用。\n\n5.  代码的下一部分使用`\\n`分割 CSV，并创建两个数组，一个数组用于标签（目标变量），另一个数组用于文本（预测变量）。\n\
    \n6.  然后，它创建一个 Pandas `DataFrame`，然后将其转换为与基础 GPU 兼容的 CUDF `DataFrame`。 这样做是为了确保所有其他操作都利用基础\
    \ GPU。\n\n7.  然后，按照 80%-20% 的规则将数据分为训练和测试数据集。\n\n8.  然后，标签编码器用于将标签编码为向量值。\n\n\
    9.  之后，在字符级别上计算 TF-IDF。\n\n10.  最后，使用 XGBoost 库训练模型。\n\n要提交前面的代码来训练模型，您必须运行以下命令。\
    \ 此命令是标准`google-ai-platform` CLI，该 CLI 提交训练说明以在 Google Cloud AI 平台上训练任何模型：\n\n\
    ```\ngcloud ai-platform jobs submit training $JOB_NAME \\\n--job-dir=$JOB_DIR\
    \ \\\n--package-path=$TRAINING_PACKAGE_PATH \\\n--module-name=$MAIN_TRAINER_MODULE\
    \ \\\n--region=$REGION \\\n--runtime-version=$RUNTIME_VERSION \\\n--python-version=$PYTHON_VERSION\
    \ \\\n--config=config.yaml\n```\n\n可以按照以下方法将那边的环境变量设置为`job.properties`，并且在运行`gcloud\
    \ ai-platform`作业之前必须先获取`job.properties`的源。 可以在以下代码中看到一个示例：\n\n```\nPROJECT_ID=test-project-id\n\
    BUCKET_ID=ml-assets\nJOB_NAME=gpu_text_classification_$(date +\"%Y%m%d_%H%M%S\"\
    )\nJOB_DIR=gs://${BUCKET_ID}/xgboost_job_dir\nTRAINING_PACKAGE_PATH=\"text_classification\"\
    \nMAIN_TRAINER_MODULE=text_classification.train\nREGION=us-central1\nRUNTIME_VERSION=1.13\n\
    PYTHON_VERSION=3.5\n```\n\n特定于 GPU 的`config.yml`文件的内容如下：\n\n```\ntrainingInput:\n\
    \  scaleTier: CUSTOM\n  # Configure a master worker with 4 K80 GPUs\n  masterType:\
    \ complex_model_m_gpu\n  # Configure 9 workers, each with 4 K80 GPUs\n  workerCount:\
    \ 9\n  workerType: complex_model_m_gpu\n  # Configure 3 parameter servers with\
    \ no GPUs\n  parameterServerCount: 3\n  parameterServerType: large_model\n```\n\
    \n包的结构如下块所示：\n\n```\ntext_classification\n|\n|__ __init__.py\n|__ config.yml\n\
    |__ run.sh\n|__ job.properties\n|__ train.py\n```\n\n提交代码后，您可以使用以下屏幕快照中显示的命令检查作业状态：\n\
    \n![](Images/17c20586468e2941b4ef498761b6d5b5.png)\n\n如以下屏幕截图所示，这是驱动 Cloud ML\
    \ GPU 日志的外观：\n\n![](Images/65b62e76293799c6727f75bbc4f3c8d5.png)\n\n在本部分中，我们了解了如何使用\
    \ Google Cloud AI 平台进行 XGBoost 模型训练。 部署代码和使用 GCP 强大的并行计算的步骤很重要。 尝试在您的工作环境中执行此处演示的每个步骤。\n\
    \n# 使用已训练的 XGBoost 模型\n\n将模型存储在 Google Cloud Storage 中之后，需要以正确的格式放置数据以进行预测。 它必须是向量格式且非稀疏。\
    \ 这意味着您必须具有不包含零值的向量。 如果该值为 0，则必须将其表示为 0.0。 让我们看下面的例子：\n\n![](Images/fc8e6a255782f3b066f0980359db7ff7.png)\n\
    \n执行以下步骤以使用 XGBoost 训练的模型：\n\n1.  从网络浏览器转到`console.google.com`。\n\n2.  在 GCP 控制台中打开“AI\
    \ 平台模型”页面：\n\n![](Images/9ac87f5d5c567cfe93e09b597040d409.png)\n\n3.  接下来，您将必须使用以下屏幕快照中显示的输入来创建模型资源：\n\
    \n![](Images/ad9345c31bbf49ed1cd768d080a5c6dd.png)\n\n4.  之后，创建以下屏幕截图所示的模型版本：\n\
    \n![](Images/14454d4ae573c06a08cbbe44ed2cb113.png)\n\n5.  有效创建模型版本后，AI 平台将从准备用于预测应用的新服务器开始。\n\
    \n现在，您可以运行以下 Python 程序来调用云机器学习 API：\n\n```\nimport googleapiclient.discovery\n\
    \ndef predict_json(project, model, instances, version=None):\n    \"\"\"Send json\
    \ data to a deployed model for prediction.\n    Args:\n        project (str):\
    \ project where the AI Platform Model is deployed.\n        model (str): model\
    \ name.\n        instances ([[float]]): List of input instances, where each input\n\
    \           instance is a list of floats.\n        version: str, version of the\
    \ model to target.\n    Returns:\n        Mapping[str: any]: dictionary of prediction\
    \ results defined by the\n            model.\n    \"\"\"\n    # Create the AI\
    \ Platform service object.\n    # To authenticate set the environment variable\n\
    \    # GOOGLE_APPLICATION_CREDENTIALS=<path_to_service_account_file>\n    service\
    \ = googleapiclient.discovery.build('ml', 'v1')\n    name = 'projects/{}/models/{}'.format(project,\
    \ model)\n\n    if version is not None:\n        name += '/versions/{}'.format(version)\n\
    \n    response = service.projects().predict(\n        name=name,\n        body={'instances':\
    \ instances}\n    ).execute()\n\n    if 'error' in response:\n        raise RuntimeError(response['error'])\n\
    \n    return response['predictions']\n```\n\n前面的代码是客户端机器学习 Python 代码，并利用了通过 Google\
    \ Cloud AI 平台部署的模型。 它以 JSON 作为输入并提供预测的输出。 在下一节中，我们将看到如何使用 XGBoost 库构建推荐系统。\n\n\
    您可以在[这个页面](https://cloud.google.com/ml-engine/docs/tensorflow/python-client-library)上找到\
    \ Python 客户端库的详细信息。\n\n# 使用 XGBoost 库构建推荐系统\n\n现代互联网零售客户要求个性化产品。 这提高了他们的满​​意度，因此也增加了电子零售商的收入。\
    \ 这就是为什么推荐系统已经使用了很多年的原因。 当前的推荐系统所提供的结果主要包括普通产品。 但是，分销商想要的方案也建议不常见的商品，因为在这个漫长的尾巴中，它们仍占零售商销售的很大份额。\
    \ 亚马逊的推荐系统享有盛誉。 它提出了其他产品，通常与消费者目前正在观看的商品相关。 如果他们不完全了解他们要寻找的内容，建议的系统还可以帮助客户找到产品或访问\
    \ Netflix 和 YouTube 时的视频。 它们通常基于称为协同过滤的技术。 通过使用这种方法收集许多用户的偏好来生成用户选择的预测。 假设，如果用户具有等效首选项的子集，则其他不可见产品的等效首选项更有可能出现。\n\
    \n与具有相应历史记录的用户相比，集体过滤仅依赖于用户历史记录。 换句话说，零售商对所提建议的影响有限，强烈建议将其用于普通产品。 对于许多在线公司而言，这是不必要的，因为他们的大部分收入仍然来自知名度较低的产品的长尾巴。\
    \ 因此，对于公司而言，找到一种能够鼓励少见的普通产品和著名产品的算法至关重要。 为了开发一种平衡的项目推荐系统，将零售商最畅销产品清单中最著名的产品与较不常见的产品结合在一起，建议使用基于树的梯度提升算法\
    \ XGBoost。 使用开源 XGBoost 软件库，梯度提升树学习可以成为平衡产品建议的正确方法。\n\n由于推荐系统的长期使用，已经建立了几种推荐算法。\
    \ 文献表明，最有前途的算法类别包括基于模型的算法。 针对用户-项目关系，交互信息以及用户和项目特征调整了几种机器学习方法。 决策树学习在先前的研究中非常成功。\
    \ 在该技术中，决策树用于使用标注来预测对象的目标值。 梯度提升方法允许顺序添加模型以纠正先前模型的误差，直到可以进行进一步的改进为止。 结合起来，将创建目标值的最终预测。\
    \ 更具体地说，建议某个用户购买物品的可能性。\n\n为了进一步说明这一点，让我们以用户项目矩阵为例：\n\n![](Images/cbb67df56401784f1459f8531c6c97c9.png)\n\
    \n在此用户项目矩阵中，行代表用户，每一列都是项目，每个单元格都是用户评分。 共有`j + 1`个用户和`n + 1`个项目。 在此， `A[jn]`是`i[n]`的用户`u[j]`分数。`A[jn]`可以在\
    \ 1 到 5 之间。有时，如果矩阵是用户`u[i]`是否查看对象`i[n]`，`A[jn]`也可以是二进制的。 在这种情况下， `A[jn]`为 0 或\
    \ 1。在我们的情况下，我们将`A[jn]`视为 1 到 5 分 。 该矩阵是非常稀疏的矩阵，这意味着其中的许多单元都是空的。\n\n由于项目很多，因此单个用户不可能对所有项目进行评分。\
    \ 在实际情况下，单个用户甚至不会给最低的项目评分。 这就是为什么此矩阵中约有 99% 的单元空着。 空单元格可以表示为**非数字**（**NaN**）。\
    \ 例如，假设`n`为 1000 万，`m`为 20,000。 因此`n * m`为`20 ^ 10M`，这是一个非常大的数字。 如果用户平均给 5 项评分，则评分总数为`5\
    \ * 10M = 5 * 10⁶`。 这被称为矩阵的**稀疏度**。 矩阵稀疏度的公式如下：\n\n`矩阵的稀疏度 = 空单元数 / 单元总数`。\n\n\
    因此，矩阵的稀疏度为`(10^10 - 5 * 10^6) / 10^10 = 0.9995`。 这意味着 99.95% 的单元格为空。 这是极其稀疏的。\n\
    \n由于稀疏度为 99.95%，因此标准推荐系统可能会考虑有利可图但未由特定用户评级的线下项目。 因此，XGBoost 算法将派上用场。\n\n# 创建和测试\
    \ XGBoost 推荐系统模型\n\n让我们使用 XGBoost 创建一个推荐系统。 [这个页面](https://github.com/PacktPublishing/Hands-On-Artificial-Intelligence-on-Google-Cloud-Platform)上的代码表示如何使用\
    \ XGBoost 构建推荐系统模型。 它基于用户电影评级数据集。 我们将利用 RAPIDS 包进行此实现。 我们将使用`conda`安装运行时库，安装包，并使用图形库表示结果。\n\
    \n下表包含`users.csv`的示例数据：\n\n| 0 || 50 || 5 || 881250949 |\n\n| --- | --- | ---\
    \ | --- |\n\n| 0 || 172 || 5 || 881250949 |\n\n| --- | --- | --- | --- |\n\n|\
    \ 0 || 133 || 1 || 881250949 |\n\n| 196 || 242 || 3 || 881250949 |\n\n| 186 ||\
    \ 302 || 3 || 891717742 |\n\n| 22 || 377 || 1 || 878887116 |\n\n| 244 || 51 ||\
    \ 2 || 880606923 |\n\n| 166 || 346 || 1 || 886397596 |\n\n| 298 || 474 || 4 ||\
    \ 884182806 |\n\n| 115 || 265 || 2 || 881171488 |\n\n下表包含`movie_lens.csv`的示例数据。\
    \ 这是一个说明性示例。 实际的训练数据可以高达数 GB，一旦我们使用了正确的基础基础架构集，XGBoost 算法就可以有效地训练它：\n\n| **项目\
    \ ID** || **标题** |\n\n| --- | --- |\n\n| 1 || Toy Story（1995） |\n\n| --- | ---\
    \ |\n\n| 2 || GoldenEye（1995） |\n\n| 3 || Four Rooms（1995） |\n\n| 4 || Get Shorty（1995）\
    \ |\n\n| 5 || Copycat（1995） |\n\n| 6 || Shanghai Triad (Yao a yao yao dao waipo\
    \ qiao)（1995） |\n\n| 7 || Twelve Monkeys（1995） |\n\n| 8 || Babe（1995） |\n\n| 9\
    \ || Dead Man Walking（1995） |\n\n| 10 || Richard III（1995） |\n\n这些样本文件可用于使用 XGBoost\
    \ 算法训练和评估模型。 使用非常大的数据集进行训练时，可以显着提高性能。\n\n# 总结"
  fmt: "\n# XGBoost 简介\n\nXGBoost 是由 Tianqi Chen 开发的，其全名是 eXtreme Gradient Boosting。XGBoost\
    \ 是梯度助推器机器的一种可扩展且准确的实现方式，仅针对模型表现和计算速度而开发，作为助力树算法的计算机功率极限。陈天琪说，后者使它更具优势，与其他库有所不同。以下是\
    \ XGBoost 使其独特的一些重要功能：\n\n## 核心特性\n\n### 并行化\n\n在 XGBoost 中并行构建顺序树。用于构建基础学习器的循环可以互换。因此，列出树的叶节点的外循环可以与计算特征的内循环互换。如果这是原始方式，则必须在外部循环开始之前完成内部循环，而内部循环不会占用更多的计算量。在\
    \ XGBoost 中，为了缩短运行时间，通过初始化全局扫描并使用所有实例的并行线程进行排序来交换循环的顺序。此开关通过抵消任何并行开销来提高算法效率。\n\
    \n### 停止标准\n\n在梯度提升框架中，用于树分割的停止标准基于分割时的负损失函数。但是，对于 XGBoost，它将按指定的`max_depth`参数开始向后修剪树。这是一种深度优先的方法，可以提高算法的整体性能和效率。\n\
    \n### 最大硬件资源使用率\n\nXGBoost 旨在最大程度地利用硬件资源。它通过每棵树中的内部缓冲区利用系统缓存来存储梯度统计信息。其他改进包括计算核外和优化可用磁盘空间，同时处理不适合内存的大数据帧。\n\
    \n# 训练和存储 XGBoost 机器学习模型\n\n在本节中，我们将研究如何使用 Google AI Hub 训练和存储机器学习模型。AI Hub 是一站式存储，用于检测、共享和部署机器学习模型。它是可重用的模型目录，可以快速安装在\
    \ AI 平台执行环境中。该目录包含基于以下通用框架的模型设计的汇编：TensorFlow、PyTorch、Keras、scikit-learn 和 XGBoost。每种模型都可以包装由\
    \ GPU 或 TPU、Jupyter 笔记本和 Google 自己的 AI API 支持的深度学习 VM，格式可以在 Kubeflow 中实现。每个模型都有标签，这些标签可根据一系列特征来方便信息的搜索和发现。借助`.../text_classification_rapids_framework.py`处的代码，我们将\
    \ XGBoost 与 RAPIDS 框架一起用于文本分类。\n\n从算法上讲，此代码执行以下步骤：\n\n1.  导入了必要的包。在较高级别上，此代码使用`OS`、`google.cloud`、`cudf(RAPID)`、`sklearn`、`pandas`和`xgboost`。它还会导入`pynvml`，这是一个\
    \ Python 库，用于低级 CUDA 库，用于 GPU 管理和监视。\n2.  接下来，代码将安装`miniconda`库和 RAPIDS 平台，然后设置\
    \ NVIDIA GPU 所需的一些环境变量。\n3.  代码的下一部分将设置访问 Google API 所需的一些常量，例如`project id`和`bucket\
    \ id`。\n4.  然后，该代码从 GCS 存储桶中下载训练数据（`text_classification_emp.csv`）。然后将其存储在本地作业目录中以供进一步使用。\n\
    5.  代码的下一部分使用`\\n`分割 CSV，并创建两个数组，一个数组用于标签（目标变量），另一个数组用于文本（预测变量）。\n6.  然后，它创建一个\
    \ Pandas `DataFrame`，然后将其转换为与基础 GPU 兼容的 CUDF `DataFrame`。这样做是为了确保所有其他操作都利用基础 GPU。\n\
    7.  然后，按照 80%-20% 的规则将数据分为训练和测试数据集。\n8.  然后，标签编码器用于将标签编码为向量值。\n9.  之后，在字符级别上计算\
    \ `TF-IDF`。\n10. 最后，使用 XGBoost 库训练模型。\n\n要提交前面的代码来训练模型，您必须运行以下命令。此命令是标准`google-ai-platform`\
    \ CLI，该 CLI 提交训练说明以在 Google Cloud AI 平台上训练任何模型：\n\n```\ngcloud ai-platform jobs\
    \ submit training $JOB_NAME \\\n--job-dir=$JOB_DIR \\\n--package-path=$TRAINING_PACKAGE_PATH\
    \ \\\n--module-name=$MAIN_TRAINER_MODULE \\\n--region=$REGION \\\n--runtime-version=$RUNTIME_VERSION\
    \ \\\n--python-version=$PYTHON_VERSION \\\n--config=config.yaml\n```\n\n可以按照以下方法将那边的环境变量设置为`job.properties`，并且在运行`gcloud\
    \ ai-platform`作业之前必须先获取`job.properties`的源。可以在以下代码中看到一个示例：\n\n```\nPROJECT_ID=test-project-id\n\
    BUCKET_ID=ml-assets\nJOB_NAME=gpu_text_classification_$(date +\"%Y%m%d_%H%M%S\"\
    )\nJOB_DIR=gs://${BUCKET_ID}/xgboost_job_dir\nTRAINING_PACKAGE_PATH=\"text_classification\"\
    \nMAIN_TRAINER_MODULE=text_classification.train\nREGION=us-central1\nRUNTIME_VERSION=1.13\n\
    PYTHON_VERSION=3.5\n```\n\n特定于 GPU 的`config.yml`文件的内容如下：\n\n```\ntrainingInput:\n\
    \  scaleTier: CUSTOM\n  # Configure a master worker with 4 K80 GPUs\n  masterType:\
    \ complex_model_m_gpu\n  # Configure 9 workers, each with 4 K80 GPUs\n  workerCount:\
    \ 9\n  workerType: complex_model_m_gpu\n  # Configure 3 parameter servers with\
    \ no GPUs\n  parameterServerCount: 3\n  parameterServerType: large_model\n```\n\
    \n包的结构如下块所示：\n\n```\ntext_classification\n|\n|__ __init__.py\n|__ config.yml\n\
    |__ run.sh\n|__ job.properties\n|__ train.py\n```\n\n提交代码后，您可以使用以下屏幕快照中显示的命令检查作业状态：\n\
    \n![](Images/17c20586468e2941b4ef498761b6d5b5.png)\n\n如以下屏幕截图所示，这是驱动 Cloud ML\
    \ GPU 日志的外观：\n\n![](Images/65b62e76293799c6727f75bbc4f3c8d5.png)\n\n在本部分中，我们了解了如何使用\
    \ Google Cloud AI 平台进行 XGBoost 模型训练。部署代码和使用 GCP 强大的并行计算的步骤很重要。尝试在您的工作环境中执行此处演示的每个步骤。\n\
    \n# 使用已训练的 XGBoost 模型\n\n将模型存储在 Google Cloud Storage 中之后，需要以正确的格式放置数据以进行预测。它必须是向量格式且非稀疏。这意味着您必须具有不包含零值的向量。如果该值为\
    \ 0，则必须将其表示为 0.0。让我们看下面的例子：\n\n![](Images/fc8e6a255782f3b066f0980359db7ff7.png)\n\
    \n执行以下步骤以使用 XGBoost 训练的模型：\n\n1.  从网络浏览器转到`console.google.com`。\n2.  在 GCP 控制台中打开“AI\
    \ 平台模型”页面：\n\n![](Images/9ac87f5d5c567cfe93e09b597040d409.png)\n\n3.  接下来，您将必须使用以下屏幕快照中显示的输入来创建模型资源：\n\
    \n![](Images/ad9345c31bbf49ed1cd768d080a5c6dd.png)\n\n4.  之后，创建以下屏幕截图所示的模型版本：\n\
    \n![](Images/14454d4ae573c06a08cbbe44ed2cb113.png)\n\n5.  有效创建模型版本后，AI 平台将从准备用于预测应用的新服务器开始。\n\
    \n现在，您可以运行以下 Python 程序来调用云机器学习 API：\n\n```\nimport googleapiclient.discovery\n\
    \ndef predict_json(project, model, instances, version=None):\n    \"\"\"Send json\
    \ data to a deployed model for prediction.\n    Args:\n        project (str):\
    \ project where the AI Platform Model is deployed.\n        model (str): model\
    \ name.\n        instances ([[float]]): List of input instances, where each input\n\
    \           instance is a list of floats.\n        version: str, version of the\
    \ model to target.\n    Returns:\n        Mapping[str: any]: dictionary of prediction\
    \ results defined by the\n            model.\n    \"\"\"\n    # Create the AI\
    \ Platform service object.\n    # To authenticate set the environment variable\n\
    \    # GOOGLE_APPLICATION_CREDENTIALS=<path_to_service_account_file>\n    service\
    \ = googleapiclient.discovery.build('ml', 'v1')\n    name = 'projects/{}/models/{}'.format(project,\
    \ model)\n\n    if version is not None:\n        name += '/versions/{}'.format(version)\n\
    \n    response = service.projects().predict(\n        name=name,\n        body={'instances':\
    \ instances}\n    ).execute()\n\n    if 'error' in response:\n        raise RuntimeError(response['error'])\n\
    \n    return response['predictions']\n```\n\n前面的代码是客户端机器学习 Python 代码，并利用了通过 Google\
    \ Cloud AI 平台部署的模型。它以 JSON 作为输入并提供预测的输出。在下一节中，我们将看到如何使用 XGBoost 库构建推荐系统。\n\n您可以在[这个页面](https://cloud.google.com/ml-engine/docs/tensorflow/python-client-library)上找到\
    \ Python 客户端库的详细信息。\n\n# 使用 XGBoost 库构建推荐系统\n\n现代互联网零售客户要求个性化产品。这提高了他们的满意度，因此也增加了电子零售商的收入。这就是为什么推荐系统已经使用了很多年的原因。当前的推荐系统所提供的结果主要包括普通产品。但是，分销商想要的方案也建议不常见的商品，因为在这个漫长的尾巴中，它们仍占零售商销售的很大份额。亚马逊的推荐系统享有盛誉。它提出了其他产品，通常与消费者目前正在观看的商品相关。如果他们不完全了解他们要寻找的内容，建议的系统还可以帮助客户找到产品或访问\
    \ Netflix 和 YouTube 时的视频。它们通常基于称为协同过滤的技术。通过使用这种方法收集许多用户的偏好来生成用户选择的预测。假设，如果用户具有等效首选项的子集，则其他不可见产品的等效首选项更有可能出现。\n\
    \n与具有相应历史记录的用户相比，集体过滤仅依赖于用户历史记录。换句话说，零售商对所提建议的影响有限，强烈建议将其用于普通产品。对于许多在线公司而言，这是不必要的，因为他们的大部分收入仍然来自知名度较低的产品的长尾巴。因此，对于公司而言，找到一种能够鼓励少见的普通产品和著名产品的算法至关重要。为了开发一种平衡的项目推荐系统，将零售商最畅销产品清单中最著名的产品与较不常见的产品结合在一起，建议使用基于树的梯度提升算法\
    \ XGBoost。使用开源 XGBoost 软件库，梯度提升树学习可以成为平衡产品建议的正确方法。\n\n由于推荐系统的长期使用，已经建立了几种推荐算法。文献表明，最有前途的算法类别包括基于模型的算法。针对用户-项目关系、交互信息以及用户和项目特征调整了几种机器学习方法。决策树学习在先前的研究中非常成功。在该技术中，决策树用于使用标注来预测对象的目标值。梯度提升方法允许顺序添加模型以纠正先前模型的误差，直到可以进行进一步的改进为止。结合起来，将创建目标值的最终预测。更具体地说，建议某个用户购买物品的可能性。\n\
    \n为了进一步说明这一点，让我们以用户项目矩阵为例：\n\n![](Images/cbb67df56401784f1459f8531c6c97c9.png)\n\
    \n在此用户项目矩阵中，行代表用户，每一列都是项目，每个单元格都是用户评分。共有`j + 1`个用户和`n + 1`个项目。在此，`A[jn]`是`i[n]`的用户`u[j]`分数。`A[jn]`可以在\
    \ 1 到 5 之间。有时，如果矩阵是用户`u[i]`是否查看对象`i[n]`，`A[jn]`也可以是二进制的。在这种情况下，`A[jn]`为 0 或 1。在我们的情况下，我们将`A[jn]`视为\
    \ 1 到 5 分。该矩阵是非常稀疏的矩阵，这意味着其中的许多单元都是空的。\n\n由于项目很多，因此单个用户不可能对所有项目进行评分。在实际情况下，单个用户甚至不会给最低的项目评分。这就是为什么此矩阵中约有\
    \ 99% 的单元空着。空单元格可以表示为`NaN`。例如，假设`n`为 1000 万，`m`为 20,000。因此`n * m`为`20 ^ 10M`，这是一个非常大的数字。如果用户平均给\
    \ 5 项评分，则评分总数为`5 * 10M = 5 * 10⁶`。这被称为矩阵的**稀疏度**。矩阵稀疏度的公式如下：\n\n`矩阵的稀疏度 = 空单元数\
    \ / 单元总数`\n\n因此，矩阵的稀疏度为`(10^10 - 5 * 10^6) / 10^10 = 0.9995`。这意味着 99.95% 的单元格为空。这是极其稀疏的。\n\
    \n由于稀疏度为 99.95%，因此标准推荐系统可能会考虑有利可图但未由特定用户评级的线下项目。因此，XGBoost 算法将派上用场。\n\n# 创建和测试\
    \ XGBoost 推荐系统模型\n\n让我们使用 XGBoost 创建一个推荐系统。[这个页面](https://github.com/PacktPublishing/Hands-On-Artificial-Intelligence-on-Google-Cloud-Platform)上的代码表示如何使用\
    \ XGBoost 构建推荐系统模型。它基于用户电影评级数据集。我们将利用 RAPIDS 包进行此实现。我们将使用`conda`安装运行时库，安装包，并使用图形库表示结果。\n\
    \n下表包含`users.csv`的示例数据：\n\n| 用户ID | 电影ID | 评分 | 时间戳 |\n| --- | --- | --- | ---\
    \ |\n| 0 | 50 | 5 | 881250949 |\n| 0 | 172 | 5 | 881250949 |\n| 0 | 133 | 1 |\
    \ 881250949 |\n| 196 | 242 | 3 | 881250949 |\n| 186 | 302 | 3 | 891717742 |\n\
    | 22 | 377 | 1 | 878887116 |\n| 244 | 51 | 2 | 880606923 |\n| 166 | 346 | 1 |\
    \ 886397596 |\n| 298 | 474 | 4 | 884182806 |\n| 115 | 265 | 2 | 881171488 |\n\n\
    下表包含`movie_lens.csv`的示例数据。这是一个说明性示例。实际的训练数据可以高达数 GB，一旦我们使用了正确的基础基础架构集，XGBoost\
    \ 算法就可以有效地训练它：\n\n| 项目 ID | 标题 |\n| --- | --- |\n| 1 | Toy Story（1995） |\n| 2\
    \ | GoldenEye（1995） |\n| 3 | Four Rooms（1995） |\n| 4 | Get Shorty（1995） |\n| 5\
    \ | Copycat（1995） |\n| 6 | Shanghai Triad (Yao a yao yao dao waipo qiao)（1995）\
    \ |\n| 7 | Twelve Monkeys（1995） |\n| 8 | Babe（1995） |\n| 9 | Dead Man Walking（1995）\
    \ |\n| 10 | Richard III（1995） |\n\n这些样本文件可用于使用 XGBoost 算法训练和评估模型。使用非常大的数据集进行训练时，可以显着提高性能。\n\
    \n# 总结\n"
