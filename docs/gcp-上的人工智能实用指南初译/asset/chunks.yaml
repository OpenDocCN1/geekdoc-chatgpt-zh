    \n# Keras 框架概述\n\nKeras 是 Python 的深度学习框架，可以帮助我们识别和训练几乎任何类型的深度学习模型。 对于科学家而言，Keras\
    \ 的创建是为了进行快速实验。 这是一个在 TensorFlow 或 Theano 上运行的开源 Python 库。 让我们看一下 Keras 及其功能：\n\
    \n*   它是模块化，快速且易于使用的。\n\n*   它是由 Google 工程师 FrançoisChollet 设计的。\n\n*   Keras\
    \ 不处理低级计算。 相反，他们使用另一个名为后端的库来执行工作。 因此，Keras 是具有低级 API 的高级 API 包装器，可以在 TensorFlow，CNTK\
    \ 或 Theano 之上运行。\n\n*   Keras 的高级 API 处理我们如何创建模型，定义级别或设置各种输入输出模型。 它允许相同的代码在 CPU\
    \ 或 GPU 上无缝运行。\n\n*   Keras 具有一些主要的重要特征。 它具有易于使用的 API 来快速构建深度学习模型的原型。\n\n*   它支持卷积（PC\
    \ 视觉）网络，循环（序列）网络及其任意组合。\n\n*   它包含各种任意的网络架构。 支持多输入或多输出，层共享，模型共享等。 这包括多个模型。\n\n\
    *   Keras 本质上非常适合构建深度学习模型，从生成的对手网络到图灵机。\n\n*   Keras 是一个模型库，为深入的教育系统的发展提供了高级构建块。\n\
    \n*   它不处理低级活动，例如张量的操纵和微分。 取而代之的是，它依赖于经过优化的专用张量库，该张量库可用作 Keras 的主干电机。\n\nKeras\
    \ 不用选择单个张量库，而是以模块化的方式管理此问题，并将 Keras 与该库联系在一起。 多个后端电机可以无缝插入 Keras。 TensorFlow 后端，Theano\
    \ 后端和 Microsoft **认知工具包**（**CNTK**）后端目前是当前的三种后端实现。 Keras 将来将能够与更多的深度学习引擎一起使用。\n\
    \nKeras 的构建是为了与 Python 配合使用，因此它易于使用，模块化且易于扩展。 该 API 是为人而不是机器而设计的，并且遵循减少认知负载的最​​佳实践。\
    \ 所有这些独立的模块都可以组合起来，以生成新的模型，神经层，成本函数，优化器，初始化方案，激活函数和正则化系统。 有了新的类和函数，可以轻松添加新模型。\
    \ 描述的是 Python 代码中的模型，而不是用于模型设置的不同文件。\n\n使用 Keras 的主要原因来自其指南，主要是它易于使用。 Keras 提供的优势包括广泛接受，支持广泛的制造部署，至少包含五种支持电机（TensorFlow，CNTK，Theano，MXNet\
    \ 和 PlaidML），以及对各种 GPU 和分布式训练的强大支持。 易于教学和易于模型开发。 此外，Google，Microsoft，Amazon，Apple，Nvidia，Uber\
    \ 等都支持 Keras。\n\nKeras 本身并不像张量积和卷积那样在较低级别上运行。 相反，它取决于后端电动机。 虽然 Keras 支持多个后端马达，但它使用\
    \ TensorFlow 作为主要（默认）后端，并使用 Google 作为主要风扇。 如前所述，Keras API 在 TensorFlow 中打包为`tf.keras`，现在是\
