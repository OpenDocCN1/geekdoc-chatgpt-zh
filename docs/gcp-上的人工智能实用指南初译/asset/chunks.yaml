- raw: "要在导出机器学习模型后对其进行部署，则必须部署导出的模型。 部署模型的第一步是将它们存储在 Google Cloud Storage 存储桶中。 通常，专用的云存储分区更易于用于\
    \ Google Cloud AI 平台的同一项目。 如果您使用其他项目中的存储桶，则需要确保可以访问 Google Cloud AI Platform 服务帐户中的云存储模型。\
    \ 没有必需的权限，您尝试构建 Google Cloud AI Platform 模型版本的尝试将失败。\n\n让我们开始研究如何创建 Google Cloud\
    \ Storage 存储桶。 可以使用现有存储桶，但它必须位于您计划在 Google Cloud AI 平台上工作的同一区域。 以下代码可以帮助您创建新的存储桶：\n\
    \n```\nBUCKET_NAME=\"google_cloud_ai_platform_your_bucket_name\"\nPROJECT_ID=$(gcloud\
    \ config list project --format \"value(core.project)\")\nBUCKET_NAME=${PROJECT_ID}-mlengine\n\
    echo $BUCKET_NAME\nREGION=us-east2\ngsutil mb -l $REGION gs://$BUCKET_NAME\n```\n\
    \n前面的代码指定您的新存储桶名称。 它定义了创建存储桶所需的项目 ID。 然后，您指定要在其中创建存储桶的区域的名称。 最后，使用`gsutil` **命令行界面**（**CLI**）创建存储桶。\n\
    \n[可以在以下链接中找到对`gsutil`工具的完整引用](https://cloud.google.com/storage/docs/gsutil)。\n\
    \n以下屏幕截图提供了有关如何使用控制台 UI 创建存储桶的指南：\n\n![](Images/f0e4761b6d4a216f28763e818d79a399.png)\n\
    \n图 9.16：GCP 控制台–存储和浏览\n\n从控制台菜单中，我们需要导航到“存储”部分，然后单击“浏览器”部分以找到存储在存储桶中的所有数据文件。\
    \ 如果用户帐户有权创建多区域存储桶，则使用此控制台 UI 可以在一处看到跨区域存储桶的所有数据文件，如以下屏幕快照所示：\n\n![](Images/24e1affe4eea0da9526457ec1b7093bf.png)\n\
    \n图 9.17：存储桶列表\n\nGCP 控制台提供了一个轻松的界面来创建新的存储桶。 这是我们单击`CREATE BUCKET`按钮时打开的初始页面的屏幕截图：\n\
    \n![](Images/48f5535d9b6521b12aa9bfc07d91fd32.png)\n\n图 9.18：创建新存储桶\n\n我们需要为该存储桶提供一个在整个项目中唯一的名称。\
    \ 此外，我们需要提供区域和默认存储类，并在 GCP 中创建存储桶时定义访问级别（可以访问存储桶的用户组和用户）。 提供详细信息后，GCP 提供了一个简单的界面来查看每月成本估计，以获取并保存正在创建的存储桶中的数据。\
    \ 这有助于在创建存储桶时根据用例和应用的上下文选择适当的选项。 如果配置不正确，GCP 可以轻松避免可能导致高成本的错误。\n\n# 将已保存的模型上传到\
    \ Google Cloud Storage 存储桶\n\n下一步是将模型上传到 Google Cloud Storage 存储桶。 如果您正在使用 Tensorflow\
    \ SavedModels，则可以使用以下代码上传模型：\n\n```\nSAVED_MODEL_DIR=$(ls ./your-export-dir-base\
    \ | tail -1)\ngsutil cp -r $SAVED_MODEL_DIR gs://your-bucket\n```\n\n如果您从`tf.keras`或\
    \ TensorFlow 估计器导出 SavedModel，则所选导出目录的子目录将另存为带有时间戳的代码目录/ `123201202301`。 本示例说明如何使用当前时间戳更新目录。\
    \ 如果您以其他方式构建了 SavedModel，则可以将其放置在本地文件系统上的其他位置。\n\n如果您已使用 scikit-learn 或 XGBoost\
    \ 导出了模型，则可以使用以下代码以`.joblib`，`*.pk1`或`*.bst`格式导出模型：\n\n```\ngsutil cp ./model.joblib\
    \ gs://your-bucket/model.joblib\n\ngsutil cp ./model.pkl gs://your-bucket/model.pkl\n\
    \ngsutil cp ./model.bst gs://your-bucket/model.bst\n```\n\n如果您具有自定义的预测例程（测试版），则还可以将一些其他示例对象上载到应用目录。\
    \ 如果您使用的是旧版计算机（MLS1）类型，则配置目录的最小文件大小必须为 500 MB 或更小；如果使用的是 Compute Engine（N1）类型的计算机（beta），则配置目录的最小文件大小必须为\
    \ 2 GB 或更小。 在构建模式的后续迭代时，请将其存储在云存储桶中的单独目录中。 如果您部署带有自定义代码或自定义预测例程的 Science Learning\
    \ 管道，则还必须上传包含自定义代码的源交付包。 您可以将以下代码用于相同的代码：\n\n```\ngsutil cp dist/google_cloud_ai_custom_code-1.0.tar.gz\
    \ gs://ai-ml-bucket/google_cloud_ai_custom_code-1.0.tar.gz\n```\n\n# 测试机器学习模型\n\
    \n下一步是测试机器学习模型。 机器学习领域提供了一些工具，可以根据数据自动做出决策，以实现某些目标或要求。 手动指定的解决方案会遇到一些问题。 机器学习很重要，因为它为复杂的问题提供了解决方案。\
    \ 与手动指定的解决方案相比，机器学习可为您提供自动，更快，更精确的问题解决方案。 机器学习应用并非 100% 准确，并且永远不会部分正确。 关于测试人员为何不能忽略对计算机教育和深度学习的思考，有多种解释。\
    \ 主要原因是这些程序从用于构造算法的数据中学习。 由于机器学习应用几乎每天都在处理人类活动，因此错误可能导致严重的损失。 代替这些事实，机器学习模型测试非常重要。\n\
    \n测试机器学习解决方案涉及多个方面。 这样的方面之一是确保用于训练的数据的质量。 您对训练的测试应确保没有可以歪曲结果的数据集。 训练数据的**质量保证**（**QA**）创建检查协议，以验证用于训练的数据是否已被消毒。\
    \ 还必须执行检查以确定是否意外或故意发生了数据中毒攻击。 与数据统计有关的测试（中位数，平均值，样式等）描述了高级数据和关系。 您应该使用脚本创建测试以检查统计信息和相关性。\
    \ 这些测试应定期进行。 必须定期跟踪列出的参数，并在每次发布之前进行验证。\n\n您还应该针对机器学习模型训练中使用的特征执行测试。 多次，一个或多个特征是冗余/不相关的，实际上会影响预测错误率。\
    \ 需要采用质量保证/测试程序来主动确定设计技术，例如降低尺寸和选择特征。\n\n最后但并非最不重要的一点是，您还应该确保模型训练算法的质量。 不断发展的数据集可能会由于数据中毒攻击而导致预览错误级别增加。\
    \ 随着机器学习模型的重新训练，增加的预测错误率意味着机器学习模型将被重新估值，以检测新算法，而现有算法的准确率更高。 重新训练所有模型，并使用新的数据集定期跟踪模型输出。\
    \ 如果另一个模型比现有模型更可靠或更成功，则会引发缺陷。\n\n您可以在 Google Cloud AI Platform 预测中使用本地`predict`命令检查模型的预测方式，然后再使用它。\
    \ 该命令使用本地依赖性来预测并以与执行在线预测后的 Google Cloud AI 平台相同的格式返回结果。 测试本地预测将使您能够在计算在线预测请求成本之前发现错误。\
    \ 对于`--model-dir`语句，您可以定义一个目录，并将您的机器学习模型导出到本地计算机或云存储中。 另外，为`--framework`参数指定`tensorflow`，`sklearn`或`xgboost`。\
    \ 您不能将本地预测命令 Google Cloud AI Platform 与自定义预测例程一起使用。 以下屏幕截图显示了用于本地模型测试的代码：\n\n\
    ```\ngcloud ai-platform local predict --model-dir local-or-cloud-storage-path-to-model-directory/\
    \ \\\n  --json-instances local-path-to-prediction-input.json \\\n  --framework\
    \ name-of-framework\n```\n\n# 部署模型及其版本\n\nGoogle Cloud AI 平台使用模型和版本资源来组织您训练有素的模型。\
    \ AI 平台是学习机模型的容器。 在 AI 平台中，创建数据库资源以部署模型，构建模型版本，然后将模型版本连接到存储在云存储中的模型文件。 您可以使用`gcloud`控制台为您的产品版本构建默认工具，并在不附带括号的情况下填写您的首选模型名称，如下所示：\n\
    \n```\ngcloud ai-platform models create \"[YOUR-MODEL-NAME]\"\n```\n\n您还可以使用 REST\
    \ API 创建模型资源。 以下是相同的步骤：\n\n1.  通过将模型对象插入请求主体来格式化规范。 您至少必须给模型起一个名字。 如下填写您的姓名（不带括号）：\n\
    \n```\n{\"name\": \"[YOUR-MODEL-NAME]\"}\n```\n\n2.  将以下文章放入您的 REST API 中，并用正确的值替换\\\
    [括号中的值\\]，如下所示：\n\n```\nPOST https://ml.googleapis.com/v1/projects/[YOUR-PROJECT-ID]/models/\n\
    \ncurl -X POST -H \"Content-Type: application/json\" \\\n  -d '{\"name\": \"[YOUR-MODEL-NAME]\"\
    }' \\\n  -H \"Authorization: Bearer `gcloud auth print-access-token`\" \\\n  \"\
    https://ml.googleapis.com/v1/projects/[YOUR-PROJECT-ID]/models\"\n```\n\n前面命令的示例\
    \ JSON 输出将类似于以下屏幕快照所示：\n\n![](Images/f2871b6164d09a4a2f24b4e3e120af4e.png)\n\n\
    图 9.19：REST API 调用的 JSON 输出\n\n创建模型资源后，即可创建模型版本。 我们将在这里看到如何做到这一点。 使用 Google Cloud\
    \ API，您可以创建版本，如以下屏幕截图所示：\n\n![](Images/41adfbb071e1549264c130756c69223e.png)\n\
    \n图 9.20：新创建的模型和模型列表页面\n\n如前面的屏幕快照所示，选择模型工具的名称以在“模型”选项卡上构建您的版本。 这将带您浏览产品页面。 在“模型详细信息”页面的顶部，单击“新版本”按钮。\
    \ 这将带您到版本开发页面，如以下屏幕截图所示：\n\n![](Images/1c339d89992b0d714ac71e8bfc1c054b.png)\n\
    \n图 9.21：新模型版本开发屏幕\n\n创建模型版本时要注意的一件事是您可以选择手动和自动缩放的缩放选项。 如果选择“自动缩放”，则会显示可选的最小字段节点数。\
    \ 您可以输入最少的节点数，以在服务减少时继续运行。 默认区域为`0`。 如果选择“手动缩放”，则需要始终输入要运行的节点数。 请参考以下屏幕截图：\n\n\
    ![](Images/a837e8c3959574032c2bc5e0da14db91.png)\n\n图 9.22：手动缩放配置\n\n需要仔细选择“手动缩放”选项。\
    \ 无论群集上的负载如何，GCP 都会提供已配置的节点数（在手动扩展的情况下，这是必填字段）。 此操作适用于关键任务用例，这些用例需要频繁地在波动的级别上访问模型，并且不提供\
    \ Google Cloud AI Platform 在合理的时间内配置所需的节点。 在这种情况下，建议根据平均流量水平提供最少数量的节点。 即使没有发送任何模型访问请求，预配节点也将产生成本，如以下屏幕截图所示：\n\
    \n![](Images/aba1068ed232b6d67e08510308081bd1.png)\n\n图 9.23：自动缩放比例配置\n\n实现此目的的另一种方法是使用`gcloud`\
    \ CLI。 如果使用`gcloud`，则首先设置环境变量以保存云存储目录路径，模型名称，版本名称和框架选择。 创建`gcloud`工具版本时，可以在框架名称中使用大写字母（例如，`_SCIKIT-LEARN`）添加下划线，也可以使用小写字母（例如，`_scikit-learn`）添加连字符。\
    \ 所有方法导致相同的行为。 以下代码块显示了如何在脚本中设置相关的环境变量：\n\n```\nMODEL_DIR=\"gs://your_bucket_name/\"\
    \nVERSION_NAME=\"[YOUR-VERSION-NAME]\"\nMODEL_NAME=\"[YOUR-MODEL-NAME]\"\nFRAMEWORK=\"\
    [YOUR-FRAMEWORK_NAME]\"\n```\n\n在具有定制代码的 scikit-learn 管道的定制代码 tarball 的路径上设置一个附加变量，如下所示：\n\
    \n```\nMODEL_DIR=\"gs://your_bucket_name/\"\nVERSION_NAME=\"[YOUR-VERSION-NAME]\"\
    \nMODEL_NAME=\"[YOUR-MODEL-NAME]\"\nFRAMEWORK=\"scikit-learn\"\nCUSTOM_CODE_PATH=\"\
    gs://your_bucket_name/ai_platform_custom_code-0.1.tar.gz\"\n```\n\n要执行自定义预测例程，请忽略`FRAMEWORK`变量，然后定义自定义代码\
    \ tarball 的路径以及预测变量类的名称。 检查以下代码：\n\n```\nMODEL_DIR=\"gs://your_bucket_name/\"\n\
    VERSION_NAME=\"[YOUR-VERSION-NAME]\"\nMODEL_NAME=\"[YOUR-MODEL-NAME]\"\nCUSTOM_CODE_PATH=\"\
    gs://your_bucket_name/ai_platform_custom_code-0.1.tar.gz\"\nPREDICTOR_CLASS=\"\
    [MODULE_NAME].[CLASS_NAME]\"\n```\n\n一旦设置了相关的环境变量，就可以使用 CLI 通过以下代码创建版本：\n\n```\n\
    gcloud ai-platform versions create $VERSION_NAME \\\n  --model $MODEL_NAME \\\n\
    \  --origin $MODEL_DIR \\\n  --runtime-version=1.15 \\\n  --framework $FRAMEWORK\
    \ \\\n  --python-version=3.7\n```\n\n将`gcloud` beta 组件用于 scikit-learn 管道（beta），并确保您设置了`--package-uris-flag`，如下所示：\n\
    \n```\ngcloud components install beta\n\ngcloud beta ai-platform versions create\
    \ $VERSION_NAME \\\n  --model $MODEL_NAME \\\n  --origin $MODEL_DIR \\\n  --runtime-version=1.15\
    \ \\\n  --framework $FRAMEWORK \\\n  --python-version=3.7\n  --package-uris=$CUSTOM_CODE_PATH\n\
    ```\n\n将`gcloud` beta 部分用于自定义预测例程，删除`--frame`标志，并设置`--package-uris`和`--prediction-class`标志，如下所示：\n\
    \n```\ngcloud components install beta\n\ngcloud beta ai-platform versions create\
    \ $VERSION_NAME \\\n  --model $MODEL_NAME \\\n  --origin $MODEL_DIR \\\n  --runtime-version=1.15\
    \ \\\n  --python-version=3.7\n  --package-uris=$CUSTOM_CODE_PATH\n  --prediction-class=$PREDICTOR_CLASS\n\
    ```\n\n您可以检查模型版本，如下所示：\n\n```\ngcloud ai-platform versions describe $VERSION_NAME\
    \ \\\n  --model $MODEL_NAME\n\n/*****Output*****/\ncreateTime: '2018-02-28T16:30:45Z'\n\
    deploymentUri: gs://your_bucket_name\nframework: [YOUR-FRAMEWORK-NAME]\nmachineType:\
    \ mls1-c1-m2\nname: projects/[YOUR-PROJECT-ID]/models/[YOUR-MODEL-NAME]/versions/[YOUR-VERSION-NAME]\n\
    pythonVersion: '3.7'\nruntimeVersion: '1.15'\nstate: READY\n```\n\n例如，具有 Cloud\
    \ ML 服务智能体**身份和访问管理**（**IAM**）功能的模型版本具有 Google 托管服务帐户的权限。 对于大多数情况，此默认服务帐户就足够了。\
    \ 但是，如果您正在使用自定义预测例程，并且需要在模型版本中具有一组不同的权限，则可以添加另一个服务帐户以供使用。 例如，如果您的模型版本需要从特定的 Google\
    \ Cloud 项目访问云存储存储桶，则可以定义具有该存储桶读取权限的服务帐户。 以下代码块显示了用于创建服务帐户的示例 Python 代码："
  fmt: "\n# 部署导出的机器学习模型\n\n要在导出机器学习模型后对其进行部署，则必须部署导出的模型。部署模型的第一步是将它们存储在 Google Cloud\
    \ Storage 存储桶中。通常，专用的云存储分区更易于用于 Google Cloud AI 平台的同一项目。如果您使用其他项目中的存储桶，则需要确保可以访问\
    \ Google Cloud AI Platform 服务帐户中的云存储模型。没有必需的权限，您尝试构建 Google Cloud AI Platform\
    \ 模型版本的尝试将失败。\n\n## 创建 Google Cloud Storage 存储桶\n\n让我们开始研究如何创建 Google Cloud Storage\
    \ 存储桶。可以使用现有存储桶，但它必须位于您计划在 Google Cloud AI 平台上工作的同一区域。以下代码可以帮助您创建新的存储桶：\n\n```\n\
    BUCKET_NAME=\"google_cloud_ai_platform_your_bucket_name\"\nPROJECT_ID=$(gcloud\
    \ config list project --format \"value(core.project)\")\nBUCKET_NAME=${PROJECT_ID}-mlengine\n\
    echo $BUCKET_NAME\nREGION=us-east2\ngsutil mb -l $REGION gs://$BUCKET_NAME\n```\n\
    \n前面的代码指定您的新存储桶名称。它定义了创建存储桶所需的项目 ID。然后，您指定要在其中创建存储桶的区域的名称。最后，使用 `gsutil` `命令行界面`\
    \ (`CLI`) 创建存储桶。\n\n[可以在以下链接中找到对 `gsutil` 工具的完整引用](https://cloud.google.com/storage/docs/gsutil)。\n\
    \n以下屏幕截图提供了有关如何使用控制台 UI 创建存储桶的指南：\n\n![](Images/f0e4761b6d4a216f28763e818d79a399.png)\n\
    \n图 9.16：GCP 控制台–存储和浏览\n\n从控制台菜单中，我们需要导航到“存储”部分，然后单击“浏览器”部分以找到存储在存储桶中的所有数据文件。如果用户帐户有权创建多区域存储桶，则使用此控制台\
    \ UI 可以在一处看到跨区域存储桶的所有数据文件，如以下屏幕快照所示：\n\n![](Images/24e1affe4eea0da9526457ec1b7093bf.png)\n\
    \n图 9.17：存储桶列表\n\nGCP 控制台提供了一个轻松的界面来创建新的存储桶。这是我们单击 `CREATE BUCKET` 按钮时打开的初始页面的屏幕截图：\n\
    \n![](Images/48f5535d9b6521b12aa9bfc07d91fd32.png)\n\n图 9.18：创建新存储桶\n\n我们需要为该存储桶提供一个在整个项目中唯一的名称。此外，我们需要提供区域和默认存储类，并在\
    \ GCP 中创建存储桶时定义访问级别（可以访问存储桶的用户组和用户）。提供详细信息后，GCP 提供了一个简单的界面来查看每月成本估计，以获取并保存正在创建的存储桶中的数据。这有助于在创建存储桶时根据用例和应用的上下文选择适当的选项。如果配置不正确，GCP\
    \ 可以轻松避免可能导致高成本的错误。\n\n## 将已保存的模型上传到 Google Cloud Storage 存储桶\n\n下一步是将模型上传到 Google\
    \ Cloud Storage 存储桶。如果您正在使用 Tensorflow SavedModels，则可以使用以下代码上传模型：\n\n```\nSAVED_MODEL_DIR=$(ls\
    \ ./your-export-dir-base | tail -1)\ngsutil cp -r $SAVED_MODEL_DIR gs://your-bucket\n\
    ```\n\n如果您从 `tf.keras` 或 TensorFlow 估计器导出 SavedModel，则所选导出目录的子目录将另存为带有时间戳的代码目录/\
    \ `123201202301`。本示例说明如何使用当前时间戳更新目录。如果您以其他方式构建了 SavedModel，则可以将其放置在本地文件系统上的其他位置。\n\
    \n如果您已使用 scikit-learn 或 XGBoost 导出了模型，则可以使用以下代码以 `.joblib`，`*.pk1` 或 `*.bst` 格式导出模型：\n\
    \n```\ngsutil cp ./model.joblib gs://your-bucket/model.joblib\n\ngsutil cp ./model.pkl\
    \ gs://your-bucket/model.pkl\n\ngsutil cp ./model.bst gs://your-bucket/model.bst\n\
    ```\n\n如果您具有自定义的预测例程（测试版），则还可以将一些其他示例对象上载到应用目录。如果您使用的是旧版计算机（MLS1）类型，则配置目录的最小文件大小必须为\
    \ 500 MB 或更小；如果使用的是 Compute Engine（N1）类型的计算机（beta），则配置目录的最小文件大小必须为 2 GB 或更小。在构建模式的后续迭代时，请将其存储在云存储桶中的单独目录中。如果您部署带有自定义代码或自定义预测例程的\
    \ Science Learning 管道，则还必须上传包含自定义代码的源交付包。您可以将以下代码用于相同的代码：\n\n```\ngsutil cp dist/google_cloud_ai_custom_code-1.0.tar.gz\
    \ gs://ai-ml-bucket/google_cloud_ai_custom_code-1.0.tar.gz\n```\n\n## 测试机器学习模型\n\
    \n下一步是测试机器学习模型。机器学习领域提供了一些工具，可以根据数据自动做出决策，以实现某些目标或要求。手动指定的解决方案会遇到一些问题。机器学习很重要，因为它为复杂的问题提供了解决方案。与手动指定的解决方案相比，机器学习可为您提供自动、更快、更精确的问题解决方案。机器学习应用并非\
    \ 100% 准确，并且永远不会部分正确。关于测试人员为何不能忽略对计算机教育和深度学习的思考，有多种解释。主要原因是这些程序从用于构造算法的数据中学习。由于机器学习应用几乎每天都在处理人类活动，因此错误可能导致严重的损失。代替这些事实，机器学习模型测试非常重要。\n\
    \n测试机器学习解决方案涉及多个方面。这样的方面之一是确保用于训练的数据的质量。您对训练的测试应确保没有可以歪曲结果的数据集。训练数据的 `质量保证` (`QA`)\
    \ 创建检查协议，以验证用于训练的数据是否已被消毒。还必须执行检查以确定是否意外或故意发生了数据中毒攻击。与数据统计有关的测试（中位数、平均值、样式等）描述了高级数据和关系。您应该使用脚本创建测试以检查统计信息和相关性。这些测试应定期进行。必须定期跟踪列出的参数，并在每次发布之前进行验证。\n\
    \n您还应该针对机器学习模型训练中使用的特征执行测试。多次，一个或多个特征是冗余/不相关的，实际上会影响预测错误率。需要采用质量保证/测试程序来主动确定设计技术，例如降低尺寸和选择特征。\n\
    \n最后但并非最不重要的一点是，您还应该确保模型训练算法的质量。不断发展的数据集可能会由于数据中毒攻击而导致预览错误级别增加。随着机器学习模型的重新训练，增加的预测错误率意味着机器学习模型将被重新估值，以检测新算法，而现有算法的准确率更高。重新训练所有模型，并使用新的数据集定期跟踪模型输出。如果另一个模型比现有模型更可靠或更成功，则会引发缺陷。\n\
    \n您可以在 Google Cloud AI Platform 预测中使用本地 `predict` 命令检查模型的预测方式，然后再使用它。该命令使用本地依赖性来预测并以与执行在线预测后的\
    \ Google Cloud AI 平台相同的格式返回结果。测试本地预测将使您能够在计算在线预测请求成本之前发现错误。对于 `--model-dir` 语句，您可以定义一个目录，并将您的机器学习模型导出到本地计算机或云存储中。另外，为\
    \ `--framework` 参数指定 `tensorflow`、`sklearn` 或 `xgboost`。您不能将本地预测命令 Google Cloud\
    \ AI Platform 与自定义预测例程一起使用。以下屏幕截图显示了用于本地模型测试的代码：\n\n```\ngcloud ai-platform local\
    \ predict --model-dir local-or-cloud-storage-path-to-model-directory/ \\\n  --json-instances\
    \ local-path-to-prediction-input.json \\\n  --framework name-of-framework\n```\n\
    \n## 部署模型及其版本\n\nGoogle Cloud AI 平台使用模型和版本资源来组织您训练有素的模型。AI 平台是学习机模型的容器。在 AI 平台中，创建数据库资源以部署模型，构建模型版本，然后将模型版本连接到存储在云存储中的模型文件。您可以使用\
    \ `gcloud` 控制台为您的产品版本构建默认工具，并在不附带括号的情况下填写您的首选模型名称，如下所示：\n\n```\ngcloud ai-platform\
    \ models create \"[YOUR-MODEL-NAME]\"\n```\n\n您还可以使用 REST API 创建模型资源。以下是相同的步骤：\n\
    \n1. 通过将模型对象插入请求主体来格式化规范。您至少必须给模型起一个名字。如下填写您的姓名（不带括号）：\n\n```\n{\"name\": \"[YOUR-MODEL-NAME]\"\
    }\n```\n\n2. 将以下文章放入您的 REST API 中，并用正确的值替换 `[括号中的值]`，如下所示：\n\n```\nPOST https://ml.googleapis.com/v1/projects/[YOUR-PROJECT-ID]/models/\n\
    \ncurl -X POST -H \"Content-Type: application/json\" \\\n  -d '{\"name\": \"[YOUR-MODEL-NAME]\"\
    }' \\\n  -H \"Authorization: Bearer `gcloud auth print-access-token`\" \\\n  \"\
    https://ml.googleapis.com/v1/projects/[YOUR-PROJECT-ID]/models\"\n```\n\n前面命令的示例\
    \ JSON 输出将类似于以下屏幕快照所示：\n\n![](Images/f2871b6164d09a4a2f24b4e3e120af4e.png)\n\n\
    图 9.19：REST API 调用的 JSON 输出\n\n创建模型资源后，即可创建模型版本。我们将在这里看到如何做到这一点。使用 Google Cloud\
    \ API，您可以创建版本，如以下屏幕截图所示：\n\n![](Images/41adfbb071e1549264c130756c69223e.png)\n\
    \n图 9.20：新创建的模型和模型列表页面\n\n如前面的屏幕快照所示，选择模型工具的名称以在“模型”选项卡上构建您的版本。这将带您浏览产品页面。在“模型详细信息”页面的顶部，单击“新版本”按钮。这将带您到版本开发页面，如以下屏幕截图所示：\n\
    \n![](Images/1c339d89992b0d714ac71e8bfc1c054b.png)\n\n图 9.21：新模型版本开发屏幕\n\n创建模型版本时要注意的一件事是您可以选择手动和自动缩放的缩放选项。如果选择“自动缩放”，则会显示可选的最小字段节点数。您可以输入最少的节点数，以在服务减少时继续运行。默认区域为\
    \ `0`。如果选择“手动缩放”，则需要始终输入要运行的节点数。请参考以下屏幕截图：\n\n![](Images/a837e8c3959574032c2bc5e0da14db91.png)\n\
    \n图 9.22：手动缩放配置\n\n需要仔细选择“手动缩放”选项。无论群集上的负载如何，GCP 都会提供已配置的节点数（在手动扩展的情况下，这是必填字段）。此操作适用于关键任务用例，这些用例需要频繁地在波动的级别上访问模型，并且不提供\
    \ Google Cloud AI Platform 在合理的时间内配置所需的节点。在这种情况下，建议根据平均流量水平提供最少数量的节点。即使没有发送任何模型访问请求，预配节点也将产生成本，如以下屏幕截图所示：\n\
    \n![](Images/aba1068ed232b6d67e08510308081bd1.png)\n\n图 9.23：自动缩放比例配置\n\n实现此目的的另一种方法是使用\
    \ `gcloud` CLI。如果使用 `gcloud`，则首先设置环境变量以保存云存储目录路径、模型名称、版本名称和框架选择。创建 `gcloud` 工具版本时，可以在框架名称中使用大写字母（例如，`_SCIKIT-LEARN`）添加下划线，也可以使用小写字母（例如，`_scikit-learn`）添加连字符。所有方法导致相同的行为。以下代码块显示了如何在脚本中设置相关的环境变量：\n\
    \n```\nMODEL_DIR=\"gs://your_bucket_name/\"\nVERSION_NAME=\"[YOUR-VERSION-NAME]\"\
    \nMODEL_NAME=\"[YOUR-MODEL-NAME]\"\nFRAMEWORK=\"[YOUR-FRAMEWORK_NAME]\"\n```\n\
    \n在具有定制代码的 scikit-learn 管道的定制代码 tarball 的路径上设置一个附加变量，如下所示：\n\n```\nMODEL_DIR=\"\
    gs://your_bucket_name/\"\nVERSION_NAME=\"[YOUR-VERSION-NAME]\"\nMODEL_NAME=\"\
    [YOUR-MODEL-NAME]\"\nFRAMEWORK=\"scikit-learn\"\nCUSTOM_CODE_PATH=\"gs://your_bucket_name/ai_platform_custom_code-0.1.tar.gz\"\
    \n```\n\n要执行自定义预测例程，请忽略 `FRAMEWORK` 变量，然后定义自定义代码 tarball 的路径以及预测变量类的名称。检查以下代码：\n\
    \n```\nMODEL_DIR=\"gs://your_bucket_name/\"\nVERSION_NAME=\"[YOUR-VERSION-NAME]\"\
    \nMODEL_NAME=\"[YOUR-MODEL-NAME]\"\nCUSTOM_CODE_PATH=\"gs://your_bucket_name/ai_platform_custom_code-0.1.tar.gz\"\
    \nPREDICTOR_CLASS=\"[MODULE_NAME].[CLASS_NAME]\"\n```\n\n一旦设置了相关的环境变量，就可以使用 CLI\
    \ 通过以下代码创建版本：\n\n```\ngcloud ai-platform versions create $VERSION_NAME \\\n  --model\
    \ $MODEL_NAME \\\n  --origin $MODEL_DIR \\\n  --runtime-version=1.15 \\\n  --framework\
    \ $FRAMEWORK \\\n  --python-version=3.7\n```\n\n将 `gcloud` beta 组件用于 scikit-learn\
    \ 管道（beta），并确保您设置了 `--package-uris-flag`，如下所示：\n\n```\ngcloud components install\
    \ beta\n\ngcloud beta ai-platform versions create $VERSION_NAME \\\n  --model\
    \ $MODEL_NAME \\\n  --origin $MODEL_DIR \\\n  --runtime-version=1.15 \\\n  --framework\
    \ $FRAMEWORK \\\n  --python-version=3.7 \\\n  --package-uris=$CUSTOM_CODE_PATH\n\
    ```\n\n将 `gcloud` beta 部分用于自定义预测例程，删除 `--frame` 标志，并设置 `--package-uris` 和 `--prediction-class`\
    \ 标志，如下所示：\n\n```\ngcloud components install beta\n\ngcloud beta ai-platform versions\
    \ create $VERSION_NAME \\\n  --model $MODEL_NAME \\\n  --origin $MODEL_DIR \\\n\
    \  --runtime-version=1.15 \\\n  --python-version=3.7 \\\n  --package-uris=$CUSTOM_CODE_PATH\
    \ \\\n  --prediction-class=$PREDICTOR_CLASS\n```\n\n您可以检查模型版本，如下所示：\n\n```\ngcloud\
    \ ai-platform versions describe $VERSION_NAME \\\n  --model $MODEL_NAME\n\n/*****Output*****/\n\
    createTime: '2018-02-28T16:30:45Z'\ndeploymentUri: gs://your_bucket_name\nframework:\
    \ [YOUR-FRAMEWORK-NAME]\nmachineType: mls1-c1-m2\nname: projects/[YOUR-PROJECT-ID]/models/[YOUR-MODEL-NAME]/versions/[YOUR-VERSION-NAME]\n\
    pythonVersion: '3.7'\nruntimeVersion: '1.15'\nstate: READY\n```\n\n例如，具有 Cloud\
    \ ML 服务智能体 `身份和访问管理` (`IAM`) 功能的模型版本具有 Google 托管服务帐户的权限。对于大多数情况，此默认服务帐户就足够了。但是，如果您正在使用自定义预测例程，并且需要在模型版本中具有一组不同的权限，则可以添加另一个服务帐户以供使用。例如，如果您的模型版本需要从特定的\
    \ Google Cloud 项目访问云存储存储桶，则可以定义具有该存储桶读取权限的服务帐户。以下代码块显示了用于创建服务帐户的示例 Python 代码：\n"
