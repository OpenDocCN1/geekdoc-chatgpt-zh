    \n图 9.44：在线预测工作流程\n\n您可以使用部署在 Google Cloud Storage 存储桶上的模型作为服务端点公开，并且这些服务端点可以由使用\
    \ REST API 或`gcloud`工具本身的某些应用使用。 `gcloud`工具用于快速测试在线预测。 在实际的生产案例中，您可以使用用 Python\
    \ 编写的脚本或 cURL 工具来使用 Rest API，从而在已部署的模型版本上公开预测功能。\n\n以下代码显示了如何使用`gcloud`工具进行在线预测。\
    \ JSON 代码示例如下所示：\n\n```\n{\"values\": [1, 2, 3, 4], \"key\": 1}\n{\"values\":\
    \ [5, 6, 7, 8], \"key\": 2}\n```\n\n代码如下所示："
