    以下屏幕截图显示了 Keras 模型的版本详细信息：\n\n![](Images/917ea6dc8ef517d912b93a086ddd6303.png)\n\
    \n3.  现在，您已经创建了预测模型版本，您需要创建用于批量预测的 Python 脚本。 首先以以下代码中所示的格式创建预测输入 JSON：\n\n```\n\
    {\n  \"dataFormat\": enum (DataFormat),\n  \"outputDataFormat\": enum (DataFormat),\n\
    \  \"inputPaths\": [\n    string\n  ],\n  \"maxWorkerCount\": string,\n  \"region\"\
    : string,\n  \"runtimeVersion\": string,\n  \"batchSize\": string,\n  \"signatureName\"\
    : string,\n\n  // Union field model_version can be only one of the following:\n\
    \  \"modelName\": string,\n  \"versionName\": string,\n  \"uri\": string\n  //\
    \ End of list of possible types for union field model_version.\n  \"outputPath\"\
    : string\n}\n```\n\n让我们回顾一下前面代码中使用的每个参数：\n\n*   **数据格式**：用于输入文件进行预测的格式类型。 对于特定任务，所有输入文件必须具有相同的信息格式。\
    \ 它可以是 JSON，`TF_Record`或`TF_Record_GZIP`格式。\n\n*   **输出数据格式**：用于预测输出文件的格式类型。\n\
    \n*   **输入路径**：需要存储在 Google Cloud 存储中的输入数据文件的 URI。\n\n*   **输出路径**：云中要通过提供预测服务保存输出的位置。\
    \ 您的项目需要被允许写到这个地方。\n\n*   **模型名称和版本名称**：您希望从中接收投影的模型名称和版本。 如果未指定版本，则使用模型的默认版本。\
    \ 如果愿意，可以使用未部署的 SavedModel Cloud 存储路径，称为 Model URI。\n\n*   **模型 URI**：您要从中接收投影的模型名称和版本。\
    \ 如果未指定版本，则使用模型的默认版本。 如果愿意，可以使用未部署的 SavedModel Cloud 存储路径，称为 Model URI。\n\n* \
    \  **区域**：Google Compute Engine 将在其中运行您的工作的区域。 为了执行预测任务并保存输入和输出信息以获取非常广泛的信息，所有内容都需要在同一区域中设置。\n\
    \n*   **最大工作器数（可选）**：处理集群中用于此任务的最大预测节点数。 您可以通过这种方式为自动批量预测的缩放功能设置上限。 如果不设置值，则默认为\
    \ 10。\n\n*   **运行时版本（可选）**：使用的 AI 平台的版本。 包含此选项以允许您指定要与 AI Platform 模型一起使用的运行时版本。\
    \ 对于已部署的模型版本，应始终忽略此值，以告知服务使用在部署模型版本时指定的相同版本。\n\n*   **签名名称（可选）**：如果您保存的模型具有各种签名，则可以选择由\
    \ TensorFlow SavedModel 标识的备用输入/输出映射，以指定自定义 TensorFlow 签名名称。\n\n4.  以下 Python\
    \ 代码代表了如何构建 JSON 主体：\n\n```\nimport time\nimport re\n\ndef make_batch_job_body(project_name,\
    \ input_paths, output_path,\n model_name, region, data_format='JSON',\n version_name=None,\
    \ max_worker_count=None,\n runtime_version=None):\n\n project_id = 'projects/{}'.format(project_name)\n\
    \ model_id = '{}/models/{}'.format(project_id, model_name)\n if version_name:\n\
    \ version_id = '{}/versions/{}'.format(model_id, version_name)\n```\n\n5.  以`model_name_batch_predict_YYYYMMDD_HHMMSS`格式制作`jobName`：\n\
    \n```\ntimestamp = time.strftime('%Y%m%d_%H%M%S', time.gmtime())\n\n    # Make\
    \ sure the project name is formatted correctly to work as the basis\n    # of\
    \ a valid job name.\n    clean_project_name = re.sub(r'\\W+', '_', project_name)\n\
    \n    job_id = '{}_{}_{}'.format(clean_project_name, model_name,\n           \
    \                timestamp)\n```\n\n6.  开始使用所需信息构建请求字典：\n\n```\nbody = {'jobId':\
    \ job_id,\n            'predictionInput': {\n                'dataFormat': data_format,\n\
    \                'inputPaths': input_paths,\n                'outputPath': output_path,\n\
    \                'region': region}}   \n```\n\n7.  使用版本（如果存在）或模型（默认版本）（如果不存在）："
  fmt: "\n```python\nimport keras\nkeras.__version__\n\nfrom keras.datasets import\
    \ mnist\n\n(train_images, train_labels), (test_images, test_labels) = mnist.load_data()\n\
    \ntrain_images.shape\n\nlen(train_labels)\n\ntrain_labels\n\ntest_images.shape\n\
    \nlen(test_labels)\n\ntest_labels\n\nfrom keras import models\nfrom keras import\
    \ layers\n\nnetwork = models.Sequential()\nnetwork.add(layers.Dense(512, activation='relu',\
    \ input_shape=(28 * 28,)))\nnetwork.add(layers.Dense(10, activation='softmax'))\n\
    \nnetwork.compile(optimizer='rmsprop',\n                loss='categorical_crossentropy',\n\
    \                metrics=['accuracy'])\n\ntrain_images = train_images.reshape((60000,\
    \ 28 * 28))\ntrain_images = train_images.astype('float32') / 255\n\ntest_images\
    \ = test_images.reshape((10000, 28 * 28))\ntest_images = test_images.astype('float32')\
    \ / 255\n\nfrom keras.utils import to_categorical\n\ntrain_labels = to_categorical(train_labels)\n\
    test_labels = to_categorical(test_labels)\n\nnetwork.fit(train_images, train_labels,\
    \ epochs=5, batch_size=128)\n\ntest_loss, test_acc = network.evaluate(test_images,\
    \ test_labels)\n\nprint('test_acc:', test_acc)\n```\n\n在前面的代码中，我们通过将图像重塑为像素矩阵来加载图像数据集并使用\
    \ `Keras` 库训练图像。通过神经网络以五次迭代（周期）对神经网络进行 128 批量的训练。训练和测试标签在输入到神经网络之前会被转换为分类变量。`network.fit`\
    \ 方法为训练数据集训练神经网络，而 `network.evaluate` 方法用于评估模型的精度参数。最后，打印精度参数以进行分析。如果发现模型的准确率高于阈值，则将其用于对新数据集运行预测。\n\
