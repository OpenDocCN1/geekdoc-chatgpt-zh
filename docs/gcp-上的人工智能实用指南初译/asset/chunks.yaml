    \n# 零、前言\n\n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/00.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/00.md)\
    \ \n\n在计算过程中，我们正处于一个有趣的关头。 大多数企业工作负载（数据库，计算和分析）都移到了云上。 云计算使任何人都可以便捷地使用高端计算能力。\
    \ 结果，我们看到各种规模的个人和组织使用计算资源的方式发生了根本性的变化。 云计算基础架构的提供商还启用了**软件即服务**（**SaaS**）范例。 这样，与存储，计算，机器学习和可视化相关的各种服务就可用，而无需执行任何服务器管理或管理。\
    \ 根据我们的经验，我们看到的根本转变是朝着无服务器架构迈进。\n\n目前，**Google Cloud Platform**（**GCP**）是 Google\
    \ 基于多年的创新和研究而提供的完整平台，为建立迄今为止最强大的搜索引擎做出了贡献。 现在，相同的技术栈已经可以通过 Google 在商业上使用，因此，每个人都可以使用海量的计算能力。\
    \ 借助 GCP 上可用的工具，可以轻松构建复杂的数据管理管道以及机器学习/ AI 工作流程。 这种普及为开发社区提供了巨大的力量，可以构建尖端的，创新的，智能的应用，这些应用可以补充人类的智能并多次提高人类的能力。\n\
    \n本书旨在简化使用 GCP 构建智能 AI 系统的入门。 我们采用了动手方法来解释 GCP 上可用于促进 AI 开发的各种概念和组件。 我们希望这本书将成为开始探索令人兴奋且不断扩展的计算世界以在\
    \ GCP 上构建支持 AI 的应用的良好起点。\n\n# 这本书是给谁的\n\n本书适用于计划使用 GCP 构建 AI 应用的软件开发人员，技术主管和架构师。\
    \ 除此之外，学生和任何对 AI 应用有很好的主意并希望了解可用工具和技术来快速构建原型并最终用于生产级应用的人都将从本书中受益。 本书对业务分析师和从业务角度了解数据格局的任何人也很有用。\
    \ 无需大量的动手经验，就可以按照本书来基于领域知识构建支持 AI 的应用。 我们试图逐步提供这些说明，以使读者发现它们易于遵循和实现。\n\n# 本书涵盖的内容\n\
    \n根据所涵盖内容的逻辑分组，我们将本书分为四个部分。 第 1 节提供了 GCP 的基本介绍，并向读者介绍了 GCP 上可用的各种工具。\n\n“第 1 章”，\
    \ “GCP 上的 AI 概述”设置了云上无服务器计算的上下文，并向读者介绍了 GCP。\n\n“第 2 章”，“使用 GCP 组件进行计算和处理”向读者介绍\
    \ GCP 上用于端到端数据管理的各种工具和应用，这对于在其上构建 AI 应用至关重要 GCP。\n\n“第 3 章”，“带有 XGBoost 的机器学习应用”显示了如何在\
    \ GCP 上使用最流行的机器学习算法之一 XGBoost。 这个想法是让读者理解机器学习算法可以在 GCP 上使用，而不必担心基础架构和计算资源。\n\n\
    “第 4 章”，“使用 Cloud AutoML” 将帮助我们迈出迈向机器学习普及的第一步。 AutoML 旨在提供机器学习即服务，并使对机器学习模型和核心实现细节了解有限的任何人都可以轻松地使用机器学习模型构建应用。\
    \ 我们将使用 AutoML 向您介绍自然语言和视觉界面。\n\n“第 5 章”，“构建大数据云机器学习引擎”将探讨云中机器学习的一些基础知识。 关于云上的机器学习模型，存在范式转变。\
    \ 我们需要了解云计算的各种概念，以及如何利用存储和计算来构建和部署模型。 这是了解我们是否要优化在云上训练和运行机器学习模型的成本的必要章节。 我们将研究\
    \ Keras 等各种框架，并了解如何在 GCP 上使用它们。\n\n“第 6 章”，“使用 DialogFlow 的智能对话应用”讨论了机器智能的对话界面，这是整体\
    \ AI 功能的重要组成部分。 在本章中，我们将了解如何使用 DialogFlow 来构建对话应用。 DialogFlow 提供了简单的 Web 和 API，用于快速构建对话应用。\
    \ 一旦针对大量对话路径训练了模型，便可以提供类似人的口头交流。\n\n“第 7 章”，“了解云 TPU” 讨论了张量处理单元（TPU），它们是 GCP 机器学习模型背后的基本构建块。\
    \ 在本章中，我们将向读者介绍 TPU，并讨论它们的组织结构和在 GCP 上加速机器学习工作流程的重要性。 如果我们要优化性能并提高速度，则必须利用 TPU\
    \ 的强度。\n\n“第 8 章”，“使用 Cloud ML Engine” 实现 TensorFlow 模型，将进一步探讨 ML Engine，并说明如何在\
    \ ML Engine 上构建 TensorFlow 模型。 我们将采用逐步的方法来在 GCP 上训练和部署机器学习模型。 我们将研究在 GCP 上构建机器学习管道的推荐最佳实践。\n\
    \n“第 9 章”，“构建预测应用”解释了在 GCP 上构建预测应用的过程。 我们从讨论预测过程的基础开始，并逐步采用动手方法来使用 GCP 构建预测应用。\
    \ 我们将在平台上训练和部署模型，并利用 API 层与已部署的模型进行交互。\n\n“第 10 章”，“构建 AI 应用”将利用 GCP 的各种组件来构建端到端\
    \ AI 应用。 我们将通过一个示例用例进行说明：使用 GCP 上的工具自动化发票处理工作流。\n\n# 充分利用这本书\n\n为了在 GCP 上快速构建\
    \ AI 应用，建议顺序阅读本章。 每章都建立在前几章介绍的概念之上。 我们强烈建议读者将本书视为概念的动手指南，并通过与个人或组织帐户进行 GCP 练习来遵循这些步骤。\n\
    \n# 下载示例代码文件\n\n您可以从 [www.packt.com](http://www.packt.com) 的帐户中下载本书的示例代码文件。 如果您在其他地方购买了此书，则可以访问\
    \ [www.packtpub.com/support](https://www.packtpub.com/support) 并注册以将文件直接通过电子邮件发送给您。\n\
    \n您可以按照以下步骤下载代码文件：\n\n1.  登录或注册 [www.packt.com](http://www.packt.com) 。\n\n2.\
    \  选择“支持选项卡”。\n\n3.  单击“代码下载”。\n\n4.  在搜索框中输入书籍的名称，然后按照屏幕上的说明进行操作。\n\n下载文件后，请确保使用以下最新版本解压缩或解压缩文件夹：\n\
    \n*   Windows 的 WinRAR/7-Zip\n\n*   Mac 版 Zipeg/iZip/UnRarX\n\n*   适用于 Linux 的\
    \ 7-Zip/PeaZip\n\n本书的代码包也托管在 [GitHub](https://github.com/PacktPublishing/Hands-On-Artificial-Intelligence-on-Google-Cloud-Platform)\
    \ 上。 如果代码有更新，它将在现有的 GitHub 存储库中进行更新。\n\n我们还从[这里](https://github.com/PacktPublishing/)提供了丰富的书籍和视频目录中的其他代码包。\
    \ 去看一下！\n\n# 下载彩色图像\n\n我们还提供了 PDF 文件，其中包含本书中使用的屏幕截图/图表的彩色图像。 [您可以在此处下载](https://static.packtcdn.com/downloads/9781789538465_ColorImages.pdf)。\n\
    \n# 使用约定\n\n本书中使用了许多文本约定。\n\n`CodeInText`：指示文本，数据库表名称，文件夹名称，文件名，文件扩展名，路径名，虚拟 URL，用户输入和\
    \ Twitter 句柄中的代码字。 这是一个示例：“`Lead_Stage`是我们将根据测试数据进行预测的标签。”\n\n代码块设置如下：\n\n```\n\
    if version_name:\n        body['predictionInput']['versionName'] = version_id\n\
    \    else:\n        body['predictionInput']['modelName'] = model_id \n```\n\n\
    任何命令行输入或输出的编写方式如下：\n\n```\ncurl -H \"Authorization: Bearer $(gcloud auth application-default\
    \ print-access-token)\" -H \"Content-Type:application/json\" https://automl.googleapis.com/v1beta1/model-name/modelEvaluations\n\
    ```\n\n**粗体**：表示新术语，重要单词或您在屏幕上看到的单词。 例如，菜单或对话框中的单词会出现在这样的文本中。 例如：“在高级选项中，如果数据集具有标题，则将跳过行标记为\
    \ 1。”\n\n警告或重要提示如下所示。\n\n提示和技巧如下所示。\n\n# 第 1 节：Google Cloud Platform 的基础\n\n>\
    \ 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/sec1.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/sec1.md)\
    \ \n\n在本节中，我们将介绍 **Google Cloud Platform**（**GCP**）上的无服务器计算基础。 我们还将概述 GCP 上可用的\
    \ AI 组件，并向您介绍 GCP 上的各种计算和处理选项。\n\n本节包括以下章节：\n\n*   “第 1 章”，“AI 和 GCP 概述”\n\n*\
    \   “第 2 章”，“使用 GCP 组件的计算和处理”\n\n# 一、AI 和 GCP 概述\n\n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/01.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/01.md)\
    \ \n\n在计算技术发展的紧要关头，我们不断从越来越多的设备和平台生成数据。 现在很清楚，如果使用不当，数据是可以提供竞争优势或劣势的关键因素。 在过去的几年中，我们已经看到，使用云上可用的基础架构可以存储和处理大量数据。\n\
    \n在本章中，我们将介绍云优先策略，企业正在采用该策略对数据执行高级分析。 我们将看到 Cloud First 策略的一些优势以及反模式。 在本章的后续部分中，我们将对\
    \ **Google Cloud Platform**（**GCP**）进行高层概述。\n\n我们将在本章介绍以下主题：\n\n*   了解用于高级数据分析的\
    \ Cloud First 策略\n\n*   Google 数据中心\n\n*   GCP 概述\n\n*   人工智能构建块\n\n*   GCP 上可用的\
    \ AI 工具\n\n# 了解用于高级数据分析的云优先策略\n\n对于已开始将数据视为保持相关性的最关键资产的组织而言，2018 年发生了重大变化。 从大数据处理基础架构的“本地”部署到云的过渡已经有了明显的转变。\
    \ 随着分布式数据管理系统的成熟，企业开始依赖于分布式计算平台来满足其分析和运营需求。 但是，随着增加新的数据源，数据量和后续分析的可能性也在不断增长。 这样，很明显，需要快速进行实验并根据需要缩放（放大和缩小）环境。\n\
    \n一些高级分析工作负载利用机器学习算法，这些算法需要**图形处理器**（**GPU**）的集群，以便在合理的时间内提供结果。 也可以按需采购 GPU，然后在云环境中将其无缝释放回资源池。\
    \ 为了达到最大的业务影响，某些实验需要迅速投入生产。 在敏捷性和快速部署方面，基于云的环境是理想的。 业界已经开始在云上进行部署。 企业不仅看到**基础架构即服务**（**IaaS**）的好处，而且还看到**高级分析即服务**（**AAaaS**）在云平台上。\n\
    \n自 2018 年初以来，已迅速转向 Cloud First 策略。刚开始实现其数据策略的组织正在将云作为其第一个游乐场，而不是投资于内部部署。 但是，“云优先”并不意味着“数据最后”策略。\
    \ 在完全由数据驱动的策略中，数据仍然扮演着核心角色。 让我们看一下与本地部署相比，云中数据管理的一些优势。\n\n# 云优先策略的优势\n\n采用云优先策略具有以下优点：\n\
    \n*   **最低的前期成本**：由于服务全天候可用，因此存储和计算基础架构几乎不受限制，并且扩展成本最低。 无需购买任何硬件或从头开始设置应用和软件。\
    \ 此外，在云平台上虚拟化了基础架构以及软件。 这样可以使企业的前期成本和投资降至最低。 该模型特别适合于开发原型和测试概念证明。 在某些情况下，可以快速验证概念的业务可行性，而不必承担资本支出和其他间接费用。\
    \ 借助云，可以以最小的成本压力快速测试和部署创新的想法和概念，以立即获得业务收益。\n\n*   **弹性容量**：即付即用是建立云服务的核心原则。 尽管仔细的容量规划对于任何成功的数据策略都很重要，但是借助云，我们可以在容量规划方面拥有一定的灵活性。\
    \ 如果需要更多容量（例如，在线零售商可以预期在黑色星期五期间会有很高的销量），则公司可以在短时间内扩展容量，然后缩减到常规容量。 这种类型的灵活性在数据管理系统的内部部署中不可行。\n\
    \n*   **全局连接**：只要可以使用互联网连接以及适当的认证/授权，就可以在全球范围内虚拟访问作为云上可用的基础结构，平台和应用的服务。 通过云提供商跨区域和物理位置的隐式冗余，确保了连接性。\
    \ 内部部署和拓扑不是客户端考虑或关注的领域。 云端点是一致且无缝的，而与客户端的位置无关。\n\n*   **无缝升级**：云提供商可以无缝升级在云上配置的操作系统和应用软件。\
    \ 这样可以确保所有部署之间的一致性和可靠性，并且非常适合互联网规模的企业应用。 与传统的本地部署相比，传统的本地部署需要在管理服务停机和业务中断的同时，将应用版本和补丁小心地应用于所有节点。\
    \ 在云环境中，责任完全转移给云提供商，企业可以专注于核心业务应用。\n\n*   **无服务器 DevOps**：借助此，应用开发团队可以完全专注于核心业务逻辑。\
    \ 他们可以根据数据量和计算需求，根据应用范围简单地规定存储和计算需求。 这些团队无需担心任何部署，他们将以最少的配置和扩展时间开始使用服务。 无服务器架构将\
    \ Cloud Functions 作为服务公开给云提供商托管应用的地方，并负责管理硬件和相关软件组件。 这种模式提供了进入业务应用，算法和模型开发的快速入门，而不必担心底层基础结构，因此，可以快速构建核心功能以开始实现业务收益。\n\
    \n*   **快速发布时间**（**TTM**）：有了前面列出的所有优点，采用 Cloud First 策略将各种概念和原型的 TTM 降至最低。"
