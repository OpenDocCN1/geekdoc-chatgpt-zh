- raw: "在本章中，我们已经了解了 Cloud First 策略，以及这对于开发利用 AI 的现代应用是当务之急的选择。 另外，我们已经简要地看到了各种系统的基于云的实现的反模式。\
    \ 我们还介绍了 GCP，它是基于 Google 在管理大量数据方面的经验而构建的。 随着时间的推移，该平台正在得到丰富和扩展。 我们研究了通用 AI 系统的各种构建块，并研究了\
    \ GCP 上可用的工具，这些工具可以以无服务器方式无缝地促进 AI 应用的开发。\n\n在下一章中，我们将研究 GCP 上可用于计算和处理 GCP 上的数据资产的各种组件。\n\
    \n# 二、使用 GCP 组件的计算和处理\n\n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/02.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/02.md)\
    \ \n\n在云中构建和运行**人工智能**（**AI**）应用之前，了解可用的不同选项非常重要。 这将帮助我们为应用选择正确的选项，以确保我们以经济高效的方式获得最佳性能。\n\
    \n在本章中，我们将深入探讨可用于在 **Google Cloud Platform**（**GCP**）上构建和运行 AI 应用的选项。 我们将研究 GCP\
    \ 上可用的计算，处理和存储选项，以及业务流程和可视化。 一旦我们对这些选项有了充分的了解，我们将在本章的结尾部分介绍一个动手例子。\n\n在本章中，我们将研究以下主题：\n\
    \n*   了解计算选项\n\n*   进入存储选项\n\n*   了解处理选项\n\n*   创建构建机器学习（ML）管道的示例\n\n# 了解计算选项\n\
    \nGCP 提供了各种计算选项来部署您的应用，并使用实际的 Google 基础架构来运行您的应用。 可用的选项如下：\n\n*   **基础架构即服务**（**IaaS**）\n\
    \n*   容器\n\n*   **平台即服务**（**PaaS**）\n\n所有计算选项均与其他 GCP 服务和产品进行通信，例如存储，网络，Stackdriver，安全性和大数据产品套件。\
    \ 根据给定应用的需求，从 Compute Engine，Kubernetes Engine，App Engine 和 Cloud Functions 中选择适当的计算选项。\n\
    \nGoogle 计算选项可帮助您在 Google 基础架构上运行多种大小的虚拟机并对其进行自定义。 它使您能够运行容器化的应用，并且如果您不必照顾与基础架构相关的项目，则可以直接在引擎上部署代码。\
    \ 因此，根据您的需求，Google 提供了多种选择来利用计算能力，加快开发工作并缩短产品上市时间。\n\n接下来，我们将详细讨论以下计算选项：\n\n*\
    \   计算引擎\n\n*   应用引擎\n\n*   Cloud Functions\n\n*   Kubernetes 引擎\n\n# Compute\
    \ Engine\n\nCompute Engine 是 Google Cloud 提供的 IaaS； 它是在 Google 基础架构中运行的虚拟机。\n\n\
    Google Cloud 提供的所有区域和区域都可以使用 Compute Engine。 它具有永久性磁盘和本地**固态驱动器**（**SSD**）的存储选项。SSD\
    \ 内部内置芯片上集成电路，不包含任何旋转头或磁盘驱动器以读取数据。 与硬盘驱动器相比，SSD 更耐用，读取时间更快。 永久磁盘是一种网络存储，最多可以扩展到\
    \ 64 TB，而本地 SSD 是加密驱动器，它实际上已连接到服务器，并且可以扩展到 3 TB。\n\n在旋转实例时，用户可以选择预定义的计算选项之一，也可以使用自定义的配置。\
    \ 可以使用 Linux 或 Windows 操作系统启动 Compute Engine。 这些实例可以使用 CPU，GPU 和 TPU 启动，并且由于基础结构是由\
    \ Google 提供的，因此用户可以进行操作系统级的自定义。\n\n用户可以在 Compute Engine 中创建托管和非托管实例组：\n\n*   受管实例组将始终包含相同的虚拟机，并支持自动扩展，高可用性，滚动更新等。\n\
    \n*   非托管实例组可以包含具有不同配置的计算机。 用户可以在创建托管实例组时使用实例模板，但不能与非托管实例组一起使用。\n\n*   建议选择一个受管且统一的实例组，直到在同一池中非常需要不同配置的计算机为止。\n\
    \n让我们快速讨论一个有助于降低价格的选项。 如果可能，请使用可抢占的计算机。 可抢占式虚拟机是短期且低成本的选件，可在已知工作负载并预期在 24 小时内完成工作负载时使用。\
    \ 这些虚拟机具有显着的成本优势，与常规实例相比，可节省高达 80% 的成本。 可抢占式机器将节省多达 80% 的成本，但有一个陷阱：Google 始终可以在\
    \ 30 秒内从您那里收回该实例。 Google 每秒收费，并为用户提供可持续的折扣。\n\n# Compute Engine 和 AI 应用\n\n在为\
    \ AI（ML）应用训练模型时，始终需要功能强大的机器，以通过提供充足的训练数据并减少训练模型的时间来提高模型的效率。 Google Compute Engine\
    \ 具有多个选项，可以启动功能强大的计算实例和组，从而可以在其上训练和运行模型。 对于训练和运行模型，应使用 CPU 和 GPU 的功能。 对于 TensorFlow\
    \ 应用，应使用带有 TPU 的机器。\n\n# App Engine\n\nApp Engine 是 Google Cloud 提供的 PaaS； 它是一个完全托管的无服务器应用平台。\n\
    \n在 Google Cloud 覆盖的大多数区域中都可以使用 App Engine。 您可以将 App Engine 视为可用于部署的基础架构； 开发人员只需专注于构建应用并将其部署到\
    \ App Engine 上，其他所有事情都将得到解决。 App Engine 具有出色的功能，例如自动缩放，流量拆分，应用安全，监视和调试-所有这些功能对于部署，保护和扩展任何应用都是必不可少的。\
    \ 使用 Cloud SDK 和 IntelliJ IDEA 之类的工具，开发人员可以直接连接到 App Engine 并执行诸如调试源代码和运行 API\
    \ 后端之类的操作。 App Engine 的限制之一是无法自定义其操作系统。\n\nApp Engine 有两种不同的环境：\n\n*   标准\n\n\
    *   灵活\n\nApp Engine 标准环境应用在沙盒环境中运行，并支持运行 Python，Java，Node.js，Go 和 PHP 应用。 另一方面，App\
    \ Engine 灵活环境应用在 Google Compute Engine 虚拟机上的 Docker 容器中运行，除了标准环境支持的语言外，还支持运行 Ruby\
    \ 和 .NET 应用。 有关在标准环境和灵活环境之间进行选择的更多详细信息，请参阅[这里](https://cloud.google.com/appengine/docs/the-appengine-environments)。\n\
    \nApp Engine 对于部署任何 Web 或移动应用非常有用。 根据资源的使用情况，基础架构会自动扩展，Google 只会针对已使用的应用收费。\n\n\
    # App Engine 和 AI 应用\n\n在 App Engine 上运行任何移动或 Web 应用时，在许多用例中，这些应用都需要 AI。 在 App\
    \ Engine 中部署应用时可以实现这些目标。 该服务可以与云终结点一起部署，而 Python 应用可以在 App Engine 中部署，从而加载训练有素的机器学习模型。\
    \ 通过 App Engine 访问模型后，该服务可以将请求发送到 Python 应用并以一致的方式获取响应。\n\n# Cloud Functions\n\
    \nCloud Functions 是 Google Cloud 提供的事件驱动的无服务器 PaaS，非常适合微服务架构。\n\nGoogle Cloud\
    \ 覆盖的大多数区域都提供 Cloud Functions。 它们主要用于小型或单一用途的功能，例如调用其他服务或将事件写入发布/订阅主题等。 Cloud\
    \ Functions 中有一些很棒的功能，可提供敏捷性和零停机维护。 Cloud Functions 可以自动销售，并且高度可用。 您可以使用 Cloud\
    \ Functions 连接到大多数 Google Cloud 服务。\n\n可以使用 JavaScript 或 Python 开发 Cloud Functions。\
    \ 用户仅在运行时才需要为 Cloud Functions 付费。 这使其非常具有成本效益。\n\n# Cloud Functions 和 AI 应用\n\n\
    在运行任何应用时，如果用户希望基于特定事件调用 Cloud ML 或 Cloud Vision 的 API，则可以使用 Cloud Functions。\n\
    \n# Kubernetes Engine\n\nKubernetes Engine 是 Google Cloud 提供的一项托管服务； 它用于部署和运行容器化的应用。\
    \ 以下是 Kubernetes Engine 的功能：\n\n*   它可在 Google Cloud 提供的所有区域和区域中使用。\n\n*   在 Kubernetes\
    \ 集群下，Google 实际上正在运行 Compute Engine，因此我们在 Compute Engine 上拥有的大多数优势将与 Kubernetes\
    \ Engine 一起使用，并提供其提供的其他服务。\n\n*   在 Kubernetes 集群中，可以使用具有自定义 OS 映像的虚拟机，并且集群将自动缩放自定义映像。\n\
    \n*   Kubernetes 集群具有高度的安全性，并获得了 HIPAA 和 PCI DSS 3.1 的支持。\n\n*   它带有仪表板服务，允许用户对其进行管理。\n\
    \n*   它会自动升级和自动修复。\n\n*   它支持常见的 Docker 映像和私有容器注册表，用户可以通过该注册表访问私有 Docker 映像。\n\
    \n*   Kubernetes 集群可以与 Stackdriver 集成在一起，以实现对集群的监视和日志记录。\n\n如果您的应用可以管理其中一台虚拟机发生故障的情况，那么将可抢占实例与\
    \ Kubernetes 群集配合使用非常有意义，因为这样可以节省大量成本。\n\n# Kubernetes Engine 和 AI 应用\n\n在为 Al（ML）应用训练模型时，始终需要功能强大的机器，以通过提供充足的训练数据并减少训练模型的时间来提高模型的效率。\
    \ 可以使用 GPU 构建 Kubernetes 集群，以训练模型并运行 ML 工作负载。 这可以使许多机器学习应用受益，这些应用需要具有强大 GPU 机器的托管容器化集群。\n\
    \n# 进入存储选项\n\nGCP 提供了各种存储选项来存储您的应用数据。 不同的应用具有不同的存储需求，并且取决于应用，性能得以提高。 从 GCP 存储选项来看，很明显，它可以支持各种存储需求，例如\
    \ NoSQL，文档 DB，对象存储，**关系数据库管理系统**（**RDBMS**）等。 。 您可以使用 Google 的托管服务来满足存储需求，也可以使用\
    \ Google 基础架构并安装所需的服务。\n\n为您的应用选择正确的存储选项很重要。 根据 Google 中可用的存储选项，以下图表将帮助您确定正确的存储选项：\n\
    \n![](Images/4cb3ef996a9fac5427bf0bc1e0c7b146.png)\n\n接下来，我们将详细讨论以下存储选项：\n\n*\
    \   Cloud Storage\n\n*   Cloud Bigtable\n\n*   Cloud Datastore\n\n*   Cloud Firestore\n\
    \n*   Cloud SQL\n\n*   Cloud Spanner\n\n*   Cloud Memorystore\n\n*   Cloud Filestore\n\
    \n# Cloud Storage\n\n云存储是 GCP 提供的对象存储。 以下是云存储的功能：\n\n*   它可以存储任何数量的数据和各种格式的数据，包括结构化数据，非结构化数据，视频文件，图像，二进制数据等。\n\
    \n*   用户可以根据以下要求将数据存储在 Cloud Storage 中的四个不同的存储桶中，即多区域存储，区域存储，近线存储和冷线存储。 \n\n \
    \   *   如果数据在世界范围内经常访问，则转到“多区域”存储桶。\n\n    *   如果经常在同一地理区域访问数据，则进入“区域”存储桶。 对于每月访问一次的数据，请使用\
    \ Nearline，对于每年访问一次的数据，请使用 Coldline 存储桶。\n\n    *   选择桶很重要，因为与之相关的成本。\n\n*   默认情况下，存储在\
    \ Cloud Storage 中的数据是高度可用的并已加密。 如果您要自定义默认加密，则可以轻松实现。\n\n*   Cloud Storage 提供了\
    \ API 和工具，用于进出数据传输。\n\n*   用户可以使用`gsutil`工具从本地传输数据，也可以使用云服务从其他云传输数据。\n\n*   所有数据传输都是安全的，并且在飞行中已加密。\n\
    \n*   具有对象生命周期管理等功能，可将数据移至便宜的，不常使用的存储中，并且用户可以使用**访问控制列表**（**ACL**）来确保数据访问的安全性。\n\
    \n*   这是一项集中式服务，并且与所有计算和处理选项集成在一起。\n\n*   BigQuery 和 Dataproc 等服务可以访问 Cloud Storage\
    \ 中存储的数据，以创建表并将其用于处理中。\n\n凭借其所有功能，云存储是 GCP 上最常用的存储选项，也是最便宜的存储选项之一。 根据存储类别和访问模式，其价格从每月每\
    \ GB 0.007 美元到每月每 GB 0.036 美元不等。\n\n# Cloud Storage 和 AI 应用\n\n云存储可以在各种 AI 和 ML\
    \ 用例中提供帮助。 大多数大数据迁移或现代数据平台都使用 Cloud Bigtable 构建其 NoSQL 数据库。 例如，Spark ML 应用将访问\
    \ Cloud Bigtable 中的数据并将结果存储在其中。 云存储已经用于基因组学，视频转码，数据分析和计算等用例。\n\n# Cloud Bigtable\n\
    \nCloud Bigtable 是 GCP 提供的完全托管的 NoSQL 数据库系统。 它可以以极低的延迟和高吞吐量扩展到 PB 级的数据。 Cloud\
    \ Bigtable 的功能如下：\n\n*   Cloud Bigtable 最适合读写操作非常繁重的用例； 话虽如此，Bigtable 可以用于流和批量操作。\n\
    \n*   Bigtable 中的每个表都包含一个单列族，并且每个列族都具有多个列限定符。 在任何给定的时间点，可以将列限定符添加到列族。\n\n*   数据作为键值对存储在表中。\
    \ 在 Bigtable 中设计表格时，最重要的事情是行键列。 仅基于此列，数据将在表中均匀分布，并且用户在读取数据时将获得优化的性能。\n\n*   如果行键列的数据倾斜，则将发生热点。\
    \ 例如，如果行键是表中的一个城市，并且数据仅针对一个城市倾斜，那么数据将不会均匀分布，并且读取也不会得到优化。\n\n*   另一方面，如果应用正在均匀地接收多个城市的数据，则数据将被公平分配，并且读取操作将得到优化。\n\
    \n*   可以在 Bigtable 中的行级别执行更新操作。\n\n*   Google Cloud Bigtable 与 Stackdriver，Cloud\
    \ Dataflow，Dataproc 和 Hadoop 等服务集成在一起。\n\n*   它还支持行业标准的 HBase API。 默认情况下，存储在 Bigtable\
    \ 中的所有数据都是加密的，并且可以使用访问控制为用户提供适当的访问权限。\n\n*   对于 Bigtable 的每个节点，用户每小时需支付 0.65 美元，SSD\
    \ 存储每小时每 GB 收费 0.17 美元，HDD 存储每小时每 GB 0.026 美元。\n\n# Cloud Bigtable 和 AI 应用\n\n\
    Cloud Bigtable 可以充当各种 AI 和 ML 用例的存储。 大多数大数据迁移或现代数据平台都使用 Cloud Bigtable 构建其 NoSQL\
    \ 数据库。 例如，流式 ML 应用可以很好地将 Bigtable 用作后端。\n\n# Cloud Datastore\n\nCloud Datastore\
    \ 是 GCP 提供的完全托管的，可扩展的 NoSQL 数据库。 数据存储区建立在 Bigtable 之上； 这就是为什么它具有高度可扩展性的原因。 Cloud\
    \ Datastore 的功能如下：\n\n*   Cloud Datastore 提供了一些重要的 RDBMS 功能，例如 ACID 支持，类似于 SQL\
    \ 的查询等等。\n\n*   为了轻松使用数据存储，您应该了解基本术语及其与 RDBMS 的相似性。 这是 RDBMS 和数据存储区术语的比较表：\n\n\
    | | **Datastore** | **RDBMS** | | --- | --- | | 对象类别 | 类 | 表 | | 单一对象 | 实体 | 行\
    \ | | 唯一标识 | 键 | 主键 | | 属性信息 | 属性 | 字段 |\n\n如果数据存储与 RDBMS 非常相似，为什么还要使用数据存储？ 原因很简单，因为它的可伸缩性是\
    \ RDBMS 无法实现的。\n\n*   Google Cloud Datastore 与 Stackdriver，App Engine 和 Compute\
    \ Engine 等服务集成在一起。\n\n*   它具有很高的可用性，并带有管理仪表板。 默认情况下，存储在数据存储区中的所有数据都是加密的，并且可以使用访问控制为用户提供适当的访问权限。\n\
    \n*   对于 1 GB 的存储空间，向用户收取 0.18 美元，写入 100,000 个实体 0.18 美元，读取 100,000 个实体 0.06 美元以及删除相同金额的\
    \ 0.02 美元。\n\n# Cloud Datastore 和 AI 应用\n\nCloud Datastore 可以充当大型 Web 应用的 AI 和\
    \ ML 用例的存储。 GCP 上托管的任何电子商务网站都可以使用数据存储来保存数据，并且使用此数据，可以训练 ML 模型并可以向用户提供所需的建议，进而可以提高客户满意度。\n\
    \n# Cloud Firestore\n\nCloud Firestore 是可扩展的 NoSQL 文档数据库。 它是适用于 Firebase 的 Web，服务器和移动开发的数据库。\n\
    \nFirestore 中存储的数据几乎全局实时同步，并且可以从多个设备进行访问。 Firestore 将数据存储在文档和集合中。 让我们快速看一下如何存储数据的示例：\n\
    \n*   员工是集合，其中应包含所有文件。\n\n*   Anand 和 Vikram 是代表员工的文档，并且在文档内部，有一些字段映射到值。\n\n这是集合的结构："
  fmt: "\n在本章中，我们已经了解了 `Cloud First` 策略，以及这对于开发利用 `AI` 的现代应用是当务之急的选择。另外，我们已经简要地看到了各种系统的基于云的实现的反模式。我们还介绍了\
    \ `GCP`，它是基于 Google 在管理大量数据方面的经验而构建的。随着时间的推移，该平台正在得到丰富和扩展。我们研究了通用 `AI` 系统的各种构建块，并研究了\
    \ `GCP` 上可用的工具，这些工具可以以无服务器方式无缝地促进 `AI` 应用的开发。\n\n在下一章中，我们将研究 `GCP` 上可用于计算和处理 `GCP`\
    \ 上的数据资产的各种组件。\n\n# 二、使用 GCP 组件的计算和处理\n\n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/02.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/02.md)\n\
    \n在云中构建和运行 `AI` 应用之前，了解可用的不同选项非常重要。这将帮助我们为应用选择正确的选项，以确保我们以经济高效的方式获得最佳性能。\n\n在本章中，我们将深入探讨可用于在\
    \ `GCP` 上构建和运行 `AI` 应用的选项。我们将研究 `GCP` 上可用的计算、处理和存储选项，以及业务流程和可视化。一旦我们对这些选项有了充分的了解，我们将在本章的结尾部分介绍一个动手例子。\n\
    \n在本章中，我们将研究以下主题：\n\n*   了解计算选项\n*   进入存储选项\n*   了解处理选项\n*   创建构建机器学习（`ML`）管道的示例\n\
    \n## 了解计算选项\n\n`GCP` 提供了各种计算选项来部署您的应用，并使用实际的 Google 基础架构来运行您的应用。可用的选项如下：\n\n*\
    \   `IaaS`（基础架构即服务）\n*   容器\n*   `PaaS`（平台即服务）\n\n所有计算选项均与其他 `GCP` 服务和产品进行通信，例如存储、网络、`Stackdriver`、安全性和大数据产品套件。根据给定应用的需求，从\
    \ `Compute Engine`、`Kubernetes Engine`、`App Engine` 和 `Cloud Functions` 中选择适当的计算选项。\n\
    \nGoogle 计算选项可帮助您在 Google 基础架构上运行多种大小的虚拟机并对其进行自定义。它使您能够运行容器化的应用，并且如果您不必照顾与基础架构相关的项目，则可以直接在引擎上部署代码。因此，根据您的需求，Google\
    \ 提供了多种选择来利用计算能力，加快开发工作并缩短产品上市时间。\n\n接下来，我们将详细讨论以下计算选项：\n\n*   `Compute Engine`\n\
    *   `App Engine`\n*   `Cloud Functions`\n*   `Kubernetes Engine`\n\n### Compute\
    \ Engine\n\n`Compute Engine` 是 Google Cloud 提供的 `IaaS`；它是在 Google 基础架构中运行的虚拟机。\n\
    \nGoogle Cloud 提供的所有区域和区域都可以使用 `Compute Engine`。它具有永久性磁盘和本地 `SSD`（固态驱动器）的存储选项。`SSD`\
    \ 内部内置芯片上集成电路，不包含任何旋转头或磁盘驱动器以读取数据。与硬盘驱动器相比，`SSD` 更耐用，读取时间更快。永久磁盘是一种网络存储，最多可以扩展到\
    \ 64 TB，而本地 `SSD` 是加密驱动器，它实际上已连接到服务器，并且可以扩展到 3 TB。\n\n在旋转实例时，用户可以选择预定义的计算选项之一，也可以使用自定义的配置。可以使用\
    \ `Linux` 或 `Windows` 操作系统启动 `Compute Engine`。这些实例可以使用 `CPU`、`GPU` 和 `TPU` 启动，并且由于基础结构是由\
    \ Google 提供的，因此用户可以进行操作系统级的自定义。\n\n用户可以在 `Compute Engine` 中创建托管和非托管实例组：\n\n* \
    \  受管实例组将始终包含相同的虚拟机，并支持自动扩展、高可用性、滚动更新等。\n*   非托管实例组可以包含具有不同配置的计算机。用户可以在创建托管实例组时使用实例模板，但不能与非托管实例组一起使用。\n\
    *   建议选择一个受管且统一的实例组，直到在同一池中非常需要不同配置的计算机为止。\n\n让我们快速讨论一个有助于降低价格的选项。如果可能，请使用可抢占的计算机。可抢占式虚拟机是短期且低成本的选件，可在已知工作负载并预期在\
    \ 24 小时内完成工作负载时使用。这些虚拟机具有显着的成本优势，与常规实例相比，可节省高达 80% 的成本。可抢占式机器将节省多达 80% 的成本，但有一个陷阱：Google\
    \ 始终可以在 30 秒内从您那里收回该实例。Google 每秒收费，并为用户提供可持续的折扣。\n\n### Compute Engine 和 AI 应用\n\
    \n在为 `AI`（`ML`）应用训练模型时，始终需要功能强大的机器，以通过提供充足的训练数据并减少训练模型的时间来提高模型的效率。`Google Compute\
    \ Engine` 具有多个选项，可以启动功能强大的计算实例和组，从而可以在其上训练和运行模型。对于训练和运行模型，应使用 `CPU` 和 `GPU` 的功能。对于\
    \ `TensorFlow` 应用，应使用带有 `TPU` 的机器。\n\n### App Engine\n\n`App Engine` 是 Google\
    \ Cloud 提供的 `PaaS`；它是一个完全托管的无服务器应用平台。\n\n在 Google Cloud 覆盖的大多数区域中都可以使用 `App Engine`。您可以将\
    \ `App Engine` 视为可用于部署的基础架构；开发人员只需专注于构建应用并将其部署到 `App Engine` 上，其他所有事情都将得到解决。`App\
    \ Engine` 具有出色的功能，例如自动缩放、流量拆分、应用安全、监视和调试——所有这些功能对于部署、保护和扩展任何应用都是必不可少的。使用 `Cloud\
    \ SDK` 和 `IntelliJ IDEA` 之类的工具，开发人员可以直接连接到 `App Engine` 并执行诸如调试源代码和运行 `API` 后端之类的操作。`App\
    \ Engine` 的限制之一是无法自定义其操作系统。\n\n`App Engine` 有两种不同的环境：\n\n*   标准\n*   灵活\n\n`App\
    \ Engine` 标准环境应用在沙盒环境中运行，并支持运行 `Python`、`Java`、`Node.js`、`Go` 和 `PHP` 应用。另一方面，`App\
    \ Engine` 灵活环境应用在 Google `Compute Engine` 虚拟机上的 `Docker` 容器中运行，除了标准环境支持的语言外，还支持运行\
    \ `Ruby` 和 `.NET` 应用。有关在标准环境和灵活环境之间进行选择的更多详细信息，请参阅[这里](https://cloud.google.com/appengine/docs/the-appengine-environments)。\n\
    \n`App Engine` 对于部署任何 `Web` 或移动应用非常有用。根据资源的使用情况，基础架构会自动扩展，Google 只会针对已使用的应用收费。\n\
    \n### App Engine 和 AI 应用\n\n在 `App Engine` 上运行任何移动或 `Web` 应用时，在许多用例中，这些应用都需要 `AI`。在\
    \ `App Engine` 中部署应用时可以实现这些目标。该服务可以与云终结点一起部署，而 `Python` 应用可以在 `App Engine` 中部署，从而加载训练有素的机器学习模型。通过\
    \ `App Engine` 访问模型后，该服务可以将请求发送到 `Python` 应用并以一致的方式获取响应。\n\n### Cloud Functions\n\
    \n`Cloud Functions` 是 Google Cloud 提供的事件驱动的无服务器 `PaaS`，非常适合微服务架构。\n\nGoogle Cloud\
    \ 覆盖的大多数区域都提供 `Cloud Functions`。它们主要用于小型或单一用途的功能，例如调用其他服务或将事件写入发布/订阅主题等。`Cloud\
    \ Functions` 中有一些很棒的功能，可提供敏捷性和零停机维护。`Cloud Functions` 可以自动扩缩，并且高度可用。您可以使用 `Cloud\
    \ Functions` 连接到大多数 Google Cloud 服务。\n\n可以使用 `JavaScript` 或 `Python` 开发 `Cloud\
    \ Functions`。用户仅在运行时才需要为 `Cloud Functions` 付费。这使其非常具有成本效益。\n\n### Cloud Functions\
    \ 和 AI 应用\n\n在运行任何应用时，如果用户希望基于特定事件调用 `Cloud ML` 或 `Cloud Vision` 的 `API`，则可以使用\
    \ `Cloud Functions`。\n\n### Kubernetes Engine\n\n`Kubernetes Engine` 是 Google\
    \ Cloud 提供的一项托管服务；它用于部署和运行容器化的应用。以下是 `Kubernetes Engine` 的功能：\n\n*   它可在 Google\
    \ Cloud 提供的所有区域和区域中使用。\n*   在 `Kubernetes` 集群下，Google 实际上正在运行 `Compute Engine`，因此我们在\
    \ `Compute Engine` 上拥有的大多数优势将与 `Kubernetes Engine` 一起使用，并提供其提供的其他服务。\n*   在 `Kubernetes`\
    \ 集群中，可以使用具有自定义 `OS` 映像的虚拟机，并且集群将自动缩放自定义映像。\n*   `Kubernetes` 集群具有高度的安全性，并获得了\
    \ `HIPAA` 和 `PCI DSS 3.1` 的支持。\n*   它带有仪表板服务，允许用户对其进行管理。\n*   它会自动升级和自动修复。\n*\
    \   它支持常见的 `Docker` 映像和私有容器注册表，用户可以通过该注册表访问私有 `Docker` 映像。\n*   `Kubernetes` 集群可以与\
    \ `Stackdriver` 集成在一起，以实现对集群的监视和日志记录。\n\n如果您的应用可以管理其中一台虚拟机发生故障的情况，那么将可抢占实例与 `Kubernetes`\
    \ 群集配合使用非常有意义，因为这样可以节省大量成本。\n\n### Kubernetes Engine 和 AI 应用\n\n在为 `AI`（`ML`）应用训练模型时，始终需要功能强大的机器，以通过提供充足的训练数据并减少训练模型的时间来提高模型的效率。可以使用\
    \ `GPU` 构建 `Kubernetes` 集群，以训练模型并运行 `ML` 工作负载。这可以使许多机器学习应用受益，这些应用需要具有强大 `GPU`\
    \ 机器的托管容器化集群。\n\n## 进入存储选项\n\n`GCP` 提供了各种存储选项来存储您的应用数据。不同的应用具有不同的存储需求，并且取决于应用，性能得以提高。从\
    \ `GCP` 存储选项来看，很明显，它可以支持各种存储需求，例如 `NoSQL`、文档 `DB`、对象存储、`RDBMS`（关系数据库管理系统）等。您可以使用\
    \ Google 的托管服务来满足存储需求，也可以使用 Google 基础架构并安装所需的服务。\n\n为您的应用选择正确的存储选项很重要。根据 Google\
    \ 中可用的存储选项，以下图表将帮助您确定正确的存储选项：\n\n![](Images/4cb3ef996a9fac5427bf0bc1e0c7b146.png)\n\
    \n接下来，我们将详细讨论以下存储选项：\n\n*   `Cloud Storage`\n*   `Cloud Bigtable`\n*   `Cloud\
    \ Datastore`\n*   `Cloud Firestore`\n*   `Cloud SQL`\n*   `Cloud Spanner`\n* \
    \  `Cloud Memorystore`\n*   `Cloud Filestore`\n\n### Cloud Storage\n\n`Cloud Storage`\
    \ 是 `GCP` 提供的对象存储。以下是 `Cloud Storage` 的功能：\n\n*   它可以存储任何数量的数据和各种格式的数据，包括结构化数据、非结构化数据、视频文件、图像、二进制数据等。\n\
    *   用户可以根据以下要求将数据存储在 `Cloud Storage` 中的四个不同的存储桶中，即多区域存储、区域存储、近线存储和冷线存储。\n    *\
    \   如果数据在世界范围内经常访问，则转到“多区域”存储桶。\n    *   如果经常在同一地理区域访问数据，则进入“区域”存储桶。对于每月访问一次的数据，请使用\
    \ `Nearline`，对于每年访问一次的数据，请使用 `Coldline` 存储桶。\n    *   选择桶很重要，因为与之相关的成本。\n*   默认情况下，存储在\
    \ `Cloud Storage` 中的数据是高度可用的并已加密。如果您要自定义默认加密，则可以轻松实现。\n*   `Cloud Storage` 提供了\
    \ `API` 和工具，用于进出数据传输。\n*   用户可以使用 `gsutil` 工具从本地传输数据，也可以使用云服务从其他云传输数据。\n*   所有数据传输都是安全的，并且在飞行中已加密。\n\
    *   具有对象生命周期管理等功能，可将数据移至便宜的、不常使用的存储中，并且用户可以使用 `ACL`（访问控制列表）来确保数据访问的安全性。\n*   这是一项集中式服务，并且与所有计算和处理选项集成在一起。\n\
    *   `BigQuery` 和 `Dataproc` 等服务可以访问 `Cloud Storage` 中存储的数据，以创建表并将其用于处理中。\n\n凭借其所有功能，`Cloud\
    \ Storage` 是 `GCP` 上最常用的存储选项，也是最便宜的存储选项之一。根据存储类别和访问模式，其价格从每月每 GB 0.007 美元到每月每\
    \ GB 0.036 美元不等。\n\n### Cloud Storage 和 AI 应用\n\n`Cloud Storage` 可以在各种 `AI` 和\
    \ `ML` 用例中提供帮助。大多数大数据迁移或现代数据平台都使用 `Cloud Bigtable` 构建其 `NoSQL` 数据库。例如，`Spark ML`\
    \ 应用将访问 `Cloud Bigtable` 中的数据并将结果存储在其中。`Cloud Storage` 已经用于基因组学、视频转码、数据分析和计算等用例。\n\
    \n### Cloud Bigtable\n\n`Cloud Bigtable` 是 `GCP` 提供的完全托管的 `NoSQL` 数据库系统。它可以以极低的延迟和高吞吐量扩展到\
    \ PB 级的数据。`Cloud Bigtable` 的功能如下：\n\n*   `Cloud Bigtable` 最适合读写操作非常繁重的用例；话虽如此，`Bigtable`\
    \ 可以用于流和批量操作。\n*   `Bigtable` 中的每个表都包含一个单列族，并且每个列族都具有多个列限定符。在任何给定的时间点，可以将列限定符添加到列族。\n\
    *   数据作为键值对存储在表中。在 `Bigtable` 中设计表格时，最重要的事情是行键列。仅基于此列，数据将在表中均匀分布，并且用户在读取数据时将获得优化的性能。\n\
    *   如果行键列的数据倾斜，则将发生热点。例如，如果行键是表中的一个城市，并且数据仅针对一个城市倾斜，那么数据将不会均匀分布，并且读取也不会得到优化。\n\
    *   另一方面，如果应用正在均匀地接收多个城市的数据，则数据将被公平分配，并且读取操作将得到优化。\n*   可以在 `Bigtable` 中的行级别执行更新操作。\n\
    *   `Google Cloud Bigtable` 与 `Stackdriver`、`Cloud Dataflow`、`Dataproc` 和 `Hadoop`\
    \ 等服务集成在一起。\n*   它还支持行业标准的 `HBase API`。默认情况下，存储在 `Bigtable` 中的所有数据都是加密的，并且可以使用访问控制为用户提供适当的访问权限。\n\
    *   对于 `Bigtable` 的每个节点，用户每小时需支付 0.65 美元，`SSD` 存储每小时每 GB 收费 0.17 美元，`HDD` 存储每小时每\
    \ GB 0.026 美元。\n\n### Cloud Bigtable 和 AI 应用\n\n`Cloud Bigtable` 可以充当各种 `AI` 和\
    \ `ML` 用例的存储。大多数大数据迁移或现代数据平台都使用 `Cloud Bigtable` 构建其 `NoSQL` 数据库。例如，流式 `ML` 应用可以很好地将\
    \ `Bigtable` 用作后端。\n\n### Cloud Datastore\n\n`Cloud Datastore` 是 `GCP` 提供的完全托管的、可扩展的\
    \ `NoSQL` 数据库。数据存储区建立在 `Bigtable` 之上；这就是为什么它具有高度可扩展性的原因。`Cloud Datastore` 的功能如下：\n\
    \n*   `Cloud Datastore` 提供了一些重要的 `RDBMS` 功能，例如 `ACID` 支持、类似于 `SQL` 的查询等等。\n* \
    \  为了轻松使用数据存储，您应该了解基本术语及其与 `RDBMS` 的相似性。这是 `RDBMS` 和数据存储区术语的比较表：\n\n| | `Datastore`\
    \ | `RDBMS` |\n| --- | --- | --- |\n| 对象类别 | 类 | 表 |\n| 单一对象 | 实体 | 行 |\n| 唯一标识\
    \ | 键 | 主键 |\n| 属性信息 | 属性 | 字段 |\n\n如果数据存储与 `RDBMS` 非常相似，为什么还要使用数据存储？原因很简单，因为它的可伸缩性是\
    \ `RDBMS` 无法实现的。\n\n*   `Google Cloud Datastore` 与 `Stackdriver`、`App Engine`\
    \ 和 `Compute Engine` 等服务集成在一起。\n*   它具有很高的可用性，并带有管理仪表板。默认情况下，存储在数据存储区中的所有数据都是加密的，并且可以使用访问控制为用户提供适当的访问权限。\n\
    *   对于 1 GB 的存储空间，向用户收取 0.18 美元，写入 100,000 个实体 0.18 美元，读取 100,000 个实体 0.06 美元以及删除相同数量\
    \ 0.02 美元。\n\n### Cloud Datastore 和 AI 应用\n\n`Cloud Datastore` 可以充当大型 `Web` 应用的\
    \ `AI` 和 `ML` 用例的存储。`GCP` 上托管的任何电子商务网站都可以使用数据存储来保存数据，并且使用此数据，可以训练 `ML` 模型并可以向用户提供所需的建议，进而可以提高客户满意度。\n\
    \n### Cloud Firestore\n\n`Cloud Firestore` 是可扩展的 `NoSQL` 文档数据库。它是适用于 `Firebase`\
    \ 的 `Web`、服务器和移动开发的数据库。\n\n`Firestore` 中存储的数据几乎全局实时同步，并且可以从多个设备进行访问。`Firestore`\
    \ 将数据存储在文档和集合中。让我们快速看一下如何存储数据的示例：\n\n*   员工是集合，其中应包含所有文件。\n*   Anand 和 Vikram\
    \ 是代表员工的文档，并且在文档内部，有一些字段映射到值。\n\n这是集合的结构：\n"
  trans: "\nIn this chapter, we have learned about the `Cloud First` strategy and\
    \ how it is the imperative choice for developing modern applications leveraging\
    \ `AI`. Additionally, we have briefly seen the anti-patterns of cloud-based implementations\
    \ of various systems. We also introduced `GCP`, which is built on Google's experience\
    \ in managing massive amounts of data. Over time, the platform is being enriched\
    \ and expanded. We examined the various building blocks of a general `AI` system\
    \ and looked at the tools available on `GCP` that can seamlessly facilitate the\
    \ development of `AI` applications in a serverless manner.\n\nIn the next chapter,\
    \ we will explore the various components available on `GCP` for computing and\
    \ processing data assets on `GCP`.\n\n# 2. Computing and Processing Using GCP\
    \ Components\n\n> Original: [`gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/02.md`](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/02.md)\n\
    \nBefore building and running `AI` applications in the cloud, it is important\
    \ to understand the different options available. This will help us choose the\
    \ right option for the application to ensure we get the best performance in a\
    \ cost-effective manner.\n\nIn this chapter, we will dive deep into the options\
    \ available for building and running `AI` applications on `GCP`. We will look\
    \ at the compute, processing, and storage options available on `GCP`, as well\
    \ as orchestration and visualization. Once we have a good understanding of these\
    \ options, we will cover a hands-on example at the end of this chapter.\n\nIn\
    \ this chapter, we will cover the following topics:\n\n*   Understanding compute\
    \ options\n*   Getting into storage options\n*   Understanding processing options\n\
    *   Creating an example to build a Machine Learning (`ML`) pipeline\n\n## Understanding\
    \ Compute Options\n\n`GCP` provides various compute options to deploy your applications\
    \ and run them using the actual Google infrastructure. The available options are\
    \ as follows:\n\n*   `IaaS` (Infrastructure as a Service)\n*   Containers\n* \
    \  `PaaS` (Platform as a Service)\n\nAll compute options communicate with other\
    \ `GCP` services and products, such as storage, networking, `Stackdriver`, security,\
    \ and the Big Data product suite. Depending on the requirements of a given application,\
    \ choose the appropriate compute option from `Compute Engine`, `Kubernetes Engine`,\
    \ `App Engine`, and `Cloud Functions`.\n\nGoogle compute options help you run\
    \ and customize virtual machines of various sizes on Google infrastructure. It\
    \ enables you to run containerized applications, and if you don't have to take\
    \ care of infrastructure-related items, you can deploy code directly on the engine.\
    \ Therefore, depending on your needs, Google provides multiple choices to leverage\
    \ compute power, accelerate development efforts, and reduce time to market.\n\n\
    Next, we will discuss the following compute options in detail:\n\n*   `Compute\
    \ Engine`\n*   `App Engine`\n*   `Cloud Functions`\n*   `Kubernetes Engine`\n\n\
    ### Compute Engine\n\n`Compute Engine` is the `IaaS` provided by Google Cloud;\
    \ it is a virtual machine running in the Google infrastructure.\n\n`Compute Engine`\
    \ is available in all regions and zones provided by Google Cloud. It has storage\
    \ options for persistent disks and local `SSD` (Solid State Drives). `SSD` has\
    \ integrated circuits on chips internally and does not contain any spinning heads\
    \ or disk drives to read data. Compared to hard disk drives, `SSD` is more durable\
    \ and has faster read times. Persistent disk is network storage that can scale\
    \ up to 64 TB, while local `SSD` is an encrypted drive that is actually attached\
    \ to the server and can scale up to 3 TB.\n\nWhen spinning up instances, users\
    \ can choose from one of the predefined compute options or use a custom configuration.\
    \ `Compute Engine` can be booted with `Linux` or `Windows` operating systems.\
    \ These instances can be launched with `CPU`, `GPU`, and `TPU`, and since the\
    \ infrastructure is provided by Google, users can perform OS-level customization.\n\
    \nUsers can create managed and unmanaged instance groups in `Compute Engine`:\n\
    \n*   Managed instance groups will always contain identical VMs and support autoscaling,\
    \ high availability, rolling updates, and more.\n*   Unmanaged instance groups\
    \ can contain machines with different configurations. Instance templates can be\
    \ used when creating managed instance groups but cannot be used with unmanaged\
    \ instance groups.\n*   It is recommended to choose a managed and uniform instance\
    \ group until there is a strong need for machines with different configurations\
    \ in the same pool.\n\nLet's quickly discuss an option that helps reduce cost.\
    \ Use preemptible machines if possible. Preemptible VMs are short-lived and low-cost\
    \ options that can be used when the workload is known and expected to finish within\
    \ 24 hours. These VMs have a significant cost advantage, saving up to 80% compared\
    \ to regular instances. Preemptible machines save up to 80% on costs, but there\
    \ is a catch: Google can reclaim the instance from you within 30 seconds at any\
    \ time. Google bills by the second and provides sustained use discounts to users.\n\
    \n### Compute Engine and AI Applications\n\nWhen training models for `AI` (`ML`)\
    \ applications, powerful machines are always needed to improve model efficiency\
    \ by providing ample training data and reducing model training time. `Google Compute\
    \ Engine` has multiple options to launch powerful compute instances and groups\
    \ on which models can be trained and run. For training and running models, the\
    \ capabilities of `CPU` and `GPU` should be used. For `TensorFlow` applications,\
    \ machines with `TPU` should be used.\n\n### App Engine\n\n`App Engine` is the\
    \ `PaaS` provided by Google Cloud; it is a fully managed serverless application\
    \ platform.\n\n`App Engine` is available in most regions covered by Google Cloud.\
    \ You can think of `App Engine` as the infrastructure available for deployment;\
    \ developers just need to focus on building the application and deploying it to\
    \ `App Engine`, and everything else is taken care of. `App Engine` has great features\
    \ such as autoscaling, traffic splitting, application security, monitoring, and\
    \ debugging—all essential for deploying, securing, and scaling any application.\
    \ Using tools like `Cloud SDK` and `IntelliJ IDEA`, developers can connect directly\
    \ to `App Engine` and perform operations such as debugging source code and running\
    \ `API` backends. One limitation of `App Engine` is the inability to customize\
    \ its operating system.\n\n`App Engine` has two different environments:\n\n* \
    \  Standard\n*   Flexible\n\n`App Engine` Standard environment applications run\
    \ in a sandbox environment and support running `Python`, `Java`, `Node.js`, `Go`,\
    \ and `PHP` applications. On the other hand, `App Engine` Flexible environment\
    \ applications run in `Docker` containers on Google `Compute Engine` VMs and support\
    \ running `Ruby` and `.NET` applications in addition to the languages supported\
    \ by the Standard environment. For more details on choosing between the Standard\
    \ and Flexible environments, see [here](https://cloud.google.com/appengine/docs/the-appengine-environments).\n\
    \n`App Engine` is very useful for deploying any `Web` or mobile application. Based\
    \ on resource usage, the infrastructure scales automatically, and Google charges\
    \ only for the application resources used.\n\n### App Engine and AI Applications\n\
    \nWhen running any mobile or `Web` application on `App Engine`, in many use cases,\
    \ these applications require `AI`. These can be achieved when deploying applications\
    \ in `App Engine`. The service can be deployed with Cloud Endpoints, and `Python`\
    \ applications can be deployed in `App Engine` to load trained Machine Learning\
    \ models. Once the model is accessed via `App Engine`, the service can send requests\
    \ to the `Python` application and get responses in a consistent manner.\n\n###\
    \ Cloud Functions\n\n`Cloud Functions` is the event-driven serverless `PaaS` provided\
    \ by Google Cloud, ideal for microservices architecture.\n\n`Cloud Functions`\
    \ is available in most regions covered by Google Cloud. They are primarily used\
    \ for small or single-purpose functions, such as calling other services or writing\
    \ events to a Pub/Sub topic. There are some great features in `Cloud Functions`\
    \ that provide agility and zero-downtime maintenance. `Cloud Functions` can autoscale\
    \ and are highly available. You can use `Cloud Functions` to connect to most Google\
    \ Cloud services.\n\n`Cloud Functions` can be developed using `JavaScript` or\
    \ `Python`. Users only pay for `Cloud Functions` during execution time. This makes\
    \ it very cost-effective.\n\n### Cloud Functions and AI Applications\n\nWhen running\
    \ any application, if the user wants to invoke `Cloud ML` or `Cloud Vision` `APIs`\
    \ based on a specific event, `Cloud Functions` can be used.\n\n### Kubernetes\
    \ Engine\n\n`Kubernetes Engine` is a managed service provided by Google Cloud;\
    \ it is used to deploy and run containerized applications. The following are the\
    \ features of `Kubernetes Engine`:\n\n*   It is available in all regions and zones\
    \ provided by Google Cloud.\n*   Under the `Kubernetes` cluster, Google actually\
    \ runs `Compute Engine`, so most of the advantages we have on `Compute Engine`\
    \ will come with `Kubernetes Engine`, along with the additional services it provides.\n\
    *   In a `Kubernetes` cluster, VMs with custom `OS` images can be used, and the\
    \ cluster will autoscale the custom images.\n*   `Kubernetes` clusters are highly\
    \ secure and are `HIPAA` and `PCI DSS 3.1` compliant.\n*   It comes with a dashboard\
    \ service that allows users to manage it.\n*   It autoupgrades and autorepairs.\n\
    *   It supports common `Docker` images and a private container registry through\
    \ which users can access private `Docker` images.\n*   `Kubernetes` clusters can\
    \ be integrated with `Stackdriver` for monitoring and logging of the cluster.\n\
    \nIf your application can handle a scenario where one of the VMs fails, then using\
    \ preemptible instances with a `Kubernetes` cluster makes a lot of sense, as it\
    \ can save significant costs.\n\n### Kubernetes Engine and AI Applications\n\n\
    When training models for `AI` (`ML`) applications, powerful machines are always\
    \ needed to improve model efficiency by providing ample training data and reducing\
    \ model training time. `Kubernetes` clusters can be built with `GPU` to train\
    \ models and run `ML` workloads. This can benefit many Machine Learning applications\
    \ that require a managed containerized cluster with powerful `GPU` machines.\n\
    \n## Getting into Storage Options\n\n`GCP` provides various storage options to\
    \ store your application data. Different applications have different storage requirements,\
    \ and performance is improved depending on the application. Looking at `GCP` storage\
    \ options, it is clear that it can support various storage needs, such as `NoSQL`,\
    \ Document `DB`, Object Storage, `RDBMS` (Relational Database Management System),\
    \ and more. You can use Google's managed services to meet storage needs, or use\
    \ Google infrastructure and install the required services.\n\nChoosing the right\
    \ storage option for your application is important. Based on the storage options\
    \ available in Google, the following chart will help you determine the correct\
    \ storage option:\n\n![](img/4cb3ef996a9fac5427bf0bc1e0c7b146.png)\n\nNext, we\
    \ will discuss the following storage options in detail:\n\n*   `Cloud Storage`\n\
    *   `Cloud Bigtable`\n*   `Cloud Datastore`\n*   `Cloud Firestore`\n*   `Cloud\
    \ SQL`\n*   `Cloud Spanner`\n*   `Cloud Memorystore`\n*   `Cloud Filestore`\n\n\
    ### Cloud Storage\n\n`Cloud Storage` is the object storage provided by `GCP`.\
    \ The following are the features of `Cloud Storage`:\n\n*   It can store any amount\
    \ of data and various formats of data, including structured, unstructured, video\
    \ files, images, binary data, and more.\n*   Users can store data in four different\
    \ buckets in `Cloud Storage` based on the following requirements: Multi-regional\
    \ storage, Regional storage, Nearline storage, and Coldline storage.\n    *  \
    \ If data is accessed frequently worldwide, go to the \"Multi-regional\" bucket.\n\
    \    *   If data is accessed frequently in the same geographic region, go to the\
    \ \"Regional\" bucket. For data accessed once a month, use `Nearline`; for data\
    \ accessed once a year, use the `Coldline` bucket.\n    *   Choosing the bucket\
    \ is important because of the associated costs.\n*   By default, data stored in\
    \ `Cloud Storage` is highly available and encrypted. If you want to customize\
    \ the default encryption, you can easily do so.\n*   `Cloud Storage` provides\
    \ `APIs` and tools for data transfer in and out.\n*   Users can use the `gsutil`\
    \ tool to transfer data from on-premises, or use the Storage Transfer Service\
    \ to transfer data from other clouds.\n*   All data transfers are secure and encrypted\
    \ in transit.\n*   With features like Object Lifecycle Management to move data\
    \ to cheaper, less frequently used storage, and users can use `ACL` (Access Control\
    \ Lists) to secure data access.\n*   This is a centralized service and is integrated\
    \ with all compute and processing options.\n*   Services like `BigQuery` and `Dataproc`\
    \ can access data stored in `Cloud Storage` to create tables and use them for\
    \ processing.\n\nWith all its features, `Cloud Storage` is the most commonly used\
    \ storage option on `GCP` and is one of the cheapest storage options. Depending\
    \ on the storage class and access pattern, pricing ranges from $0.007 per GB per\
    \ month to $0.036 per GB per month.\n\n### Cloud Storage and AI Applications\n\
    \n`Cloud Storage` can help in various `AI` and `ML` use cases. Most Big Data migrations\
    \ or modern data platforms use `Cloud Bigtable` to build their `NoSQL` databases.\
    \ For example, `Spark ML` applications will access data in `Cloud Bigtable` and\
    \ store results in it. `Cloud Storage` has already been used for use cases like\
    \ genomics, video transcoding, data analytics, and computation.\n\n### Cloud Bigtable\n\
    \n`Cloud Bigtable` is the fully managed `NoSQL` database system provided by `GCP`.\
    \ It can scale to petabytes of data with extremely low latency and high throughput.\
    \ The features of `Cloud Bigtable` are as follows:\n\n*   `Cloud Bigtable` is\
    \ best suited for use cases with very heavy read and write operations; that said,\
    \ `Bigtable` can be used for both streaming and batch operations.\n*   Each table\
    \ in `Bigtable` contains a single column family, and each column family has multiple\
    \ column qualifiers. At any given time, column qualifiers can be added to a column\
    \ family.\n*   Data is stored in tables as key-value pairs. When designing tables\
    \ in `Bigtable`, the most important thing is the row key column. Only based on\
    \ this column will data be evenly distributed in the table, and users will get\
    \ optimized performance when reading data.\n*   If the data in the row key column\
    \ is skewed, hotspots will occur. For example, if the row key is a city in the\
    \ table and data is skewed only for one city, then data will not be evenly distributed,\
    \ and reads will not be optimized.\n*   On the other hand, if the application\
    \ is receiving data from multiple cities evenly, then data will be distributed\
    \ fairly, and read operations will be optimized.\n*   Update operations can be\
    \ performed at the row level in `Bigtable`.\n*   `Google Cloud Bigtable` is integrated\
    \ with services like `Stackdriver`, `Cloud Dataflow`, `Dataproc`, and `Hadoop`.\n\
    *   It also supports the industry-standard `HBase API`. By default, all data stored\
    \ in `Bigtable` is encrypted, and access control can be used to provide appropriate\
    \ access to users.\n*   For each `Bigtable` node, the user pays $0.65 per hour,\
    \ `SSD` storage is charged at $0.17 per GB per hour, and `HDD` storage at $0.026\
    \ per GB per hour.\n\n### Cloud Bigtable and AI Applications\n\n`Cloud Bigtable`\
    \ can act as storage for various `AI` and `ML` use cases. Most Big Data migrations\
    \ or modern data platforms use `Cloud Bigtable` to build their `NoSQL` databases.\
    \ For example, streaming `ML` applications can use `Bigtable` effectively as a\
    \ backend.\n\n### Cloud Datastore\n\n`Cloud Datastore` is the fully managed, scalable\
    \ `NoSQL` database provided by `GCP`. Datastore is built on top of `Bigtable`;\
    \ that is why it is highly scalable. The features of `Cloud Datastore` are as\
    \ follows:\n\n*   `Cloud Datastore` provides some important `RDBMS` features,\
    \ such as `ACID` support, `SQL`-like queries, and more.\n*   To easily use Datastore,\
    \ you should understand the basic terminology and its similarity to `RDBMS`. This\
    \ is a comparison table of `RDBMS` and Datastore terminology:\n\n| | `Datastore`\
    \ | `RDBMS` |\n| --- | --- | --- |\n| Object Category | Kind | Table |\n| Single\
    \ Object | Entity | Row |\n| Unique Identifier | Key | Primary Key |\n| Property\
    \ Information | Property | Field |\n\nIf Datastore is so similar to `RDBMS`, why\
    \ use Datastore? The reason is simple: it provides scalability that `RDBMS` cannot\
    \ achieve.\n\n*   `Google Cloud Datastore` is integrated with services like `Stackdriver`,\
    \ `App Engine`, and `Compute Engine`.\n*   It is highly available and comes with\
    \ an admin dashboard. By default, all data stored in Datastore is encrypted, and\
    \ access control can be used to provide appropriate access to users.\n*   For\
    \ 1 GB of storage, the user is charged $0.18, $0.18 for 100,000 entity writes,\
    \ $0.06 for 100,000 entity reads, and $0.02 for the same number of deletes.\n\n\
    ### Cloud Datastore and AI Applications\n\n`Cloud Datastore` can act as storage\
    \ for `AI` and `ML` use cases for large `Web` applications. Any e-commerce website\
    \ hosted on `GCP` can use Datastore to store data, and using this data, `ML` models\
    \ can be trained and desired recommendations can be served to users, which in\
    \ turn can improve customer satisfaction.\n\n### Cloud Firestore\n\n`Cloud Firestore`\
    \ is a scalable `NoSQL` document database. It is the database for `Firebase` `Web`,\
    \ server, and mobile development.\n\nData stored in `Firestore` is synced almost\
    \ globally in real-time and can be accessed from multiple devices. `Firestore`\
    \ stores data in documents and collections. Let's quickly look at an example of\
    \ how data is stored:\n\n*   Employees is a collection that should contain all\
    \ documents.\n*   Anand and Vikram are documents representing employees, and inside\
    \ the document, there are some fields mapping to values.\n\nThis is the structure\
    \ of the collection:\n\n"
