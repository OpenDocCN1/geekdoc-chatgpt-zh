    \ 应用。本章提供了使用 GCP 快速构建生产就绪应用的一般过程。\n\n本节包括以下章节：\n\n*   “第 10 章”，“构建 AI 应用”\n\n\
    ## 十、构建一个 AI 应用\n\n> 原文：[`gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/10.md`](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/10.md)\n\
    \n在本书的最后九章中，我们在 **Google Cloud Platform（GCP）** 的背景下研究了人工智能的基本构成元素。\n\n在本章中，我们将概述在本书中学习的各种工具和技术，并将其应用于构建示例\
    \ AI 应用。我们还将介绍 GCP 即将推出的功能，这些功能将通过使 AI 和 ML 普及来进一步增强其构建智能应用的能力。\n\n本章将涵盖以下主题：\n\
    \n*   开发 AI 应用的分步方法\n*   用例概述– **自动发票处理（AIP）**\n*   即将推出的功能\n\n### 开发 AI 应用的分步方法\n\
    \n平台可通过补充人类智能来促进解决问题的现实应用和用例。随着人工智能成为主流并被日常应用和软件平台所采用，开发人员社区以及大型组织必须利用 GCP 等平台以最少的时间和人力资源投资来构建功能强大的应用。GCP\
    \ 的 AI 还使我们在创建生产应用之前可以轻松进行各种实验和检验假设。数据管理和 ML 作为 GCP 上的服务提供。这样就无需管理基础架构和软件。开发团队可以专注于解决实际问题，而无需担心平台和基础架构管理。为此，开发人员社区可以使用\
    \ GCP 提供的复杂工具包，而无需前期投资。我们将看到应用周转时间和易于开发方面的重大变化。\n\n这促进了尖端的创新，并解决了一些现实世界中无法解决的问题。\n\
    \n通常，AI 应用的开发遵循循序渐进的方法。总体上讲，AI 应用的开发和操作分为六个阶段，如下图所示。在本节中，我们将研究这些通用阶段并学习基本的机器学习理论，在随后的部分中，我们将通过示例进行学习：\n\
    \n![](img/e01cebd02e6e9c23bac8e276914a9420.png)\n\n图 10.1：AI 应用开发阶段\n\n#### 问题分类\n\
    \n根据投入的特征和预期成果，人工智能可以解决的问题可以大致分为以下几类。\n\n##### 分类\n\n分类问题通常涉及将结果分类为预定义的类别。结果称为因变量。结果取决于一组输入变量或特征。输入变量或特征称为自变量。分类问题训练模型以数学方式将自变量的组合映射到因变量。输出是集合中的值之一。例如，当通过分类算法时，水果图像被分类为苹果或橙子。通常，算法规定图像属于特定类别的概率。概率最大的类别是基于训练数据的分类。\n\
    \n##### 回归\n\n与分类问题不同，回归问题期望连续的结果而不是离散的类。例如，预测特定人口区域的降雨的模型可以基于各种输入参数来预测以毫米为单位的降雨。\n\
    \n##### 聚类\n\n聚类问题通常通过无监督的学习方法来解决。根据相似度指标，将可变空间分为多个聚类。这是根据数据点与组输入质心的距离进行数学建模的。例如，可以通过聚类算法将生物细胞聚类为感染或正常类别。\n\
    \n##### 优化\n\n优化问题用于提高特定计算活动的表现。例如，如果我们需要压缩文件，则可以尝试各种算法，然后根据数据类型选择最佳算法。优化问题的另一个示例是根据实时交通和其他路况为车辆找到最佳路线。该算法可帮助优化路线，以实现从\
    \ A 点到 B 点的最短行驶时间。\n\n##### 异常检测\n\n异常检测是一种类型的问题，其中需要检测数据中的极端条件。网络安全是异常检测的一个非常突出的用例。生成了大量的网络日志，如果没有智能采样和智能算法，就不可能检测到异常值。\n\
    \n##### 排名\n\n排名问题涉及我们需要根据特定用例按堆叠排名对结果空间进行排序。控制排名的规则充当输入变量，而顺序排名则作为输出。这些问题可以通过有监督的学习方法和无监督的学习方法来解决。这些排名算法的典型用法是通过推荐系统。在零售的情况下，产品会根据各种用户偏好按相关性进行排名，并呈现给用户。\n\
    \n##### 数据准备\n\n数据准备问题是期望算法从历史模式生成数据的地方。一个示例用例是基于神经网络和大量面部图像创建人脸，这些面部图像被馈送到算法中（使用生成对抗网络）以生成新图像。该算法可以创建用于测试和实验目的的真实数据。\n\
    \n#### 数据采集\n\nAI 应用获得的用于训练基础模型的数据越多，表现就会越好。数据的质量和数量对于 AI 应用真正补充人类智能至关重要。这意味着从各种来源获取数据是该过程中的重要一步。通常以批量或接近实时的方式获取数据。\n\
    \n通常，历史数据在批量模式下用于训练和调整模型，而实时数据在流模式下用于进一步处理。在某些用例中，期望 AI 应用的事件时间与操作时间之间的时间间隔最小。在这种情况下，我们需要考虑使用高端计算基础架构，以确保数据采集和处理中的亚毫秒级延迟。\n\
    \n#### 数据处理\n\n随着更多设备连接到互联网，我们正在生成更多数据。这称为大数据，并导致数据量增长。必须使用尽可能多的数据来构建 AI 应用，因为各种形式的数据都包含可以用来构建智能应用的智能。通过处理非结构化数据的功能，大数据现在包括例如图像、视频、音频文件、文本和无线数据。大数据处理还涉及计算机视觉、**自然语言处理（NLP）**、社交网络、语音识别、**车联网（IoV）**\
    \ 数据分析、实时**物联网（IoT）** 数据分析以及无线大数据处理。\n\n近来，已集中实现了以**人工智能（AI）**为动力的大规模异构数据处理技术，这些技术专注于模式识别、机器学习和深度学习。然而，人工智能驱动的大数据处理的发展仍然充满挑战。在计算机视觉和图像处理中，越来越多的数据库和数据流已经被分发和处理。大规模分析图像/视频数据的最大挑战之一是建立节能高效的实时方法，以从每秒产生的大量数据中提取有用的信息。得益于大数据和新的\
    \ AI 技术的帮助，语音处理也取得了很多进展。\n\n#### 问题建模\n\n我们需要了解特定的问题，并使用适当的模型来解决该特定的问题。根据问题的具体类别，在决定在生产中使用特定模型之前，我们需要尝试各种算法。在特定类别的算法中，可能会部署不正确的模型，而该模型不会在新数据集上产生准确的结果。\n\
    \n在最终选择所部署的模型之前，我们需要了解一段时间内的数据模式。对于增强人员功能的关键任务 AI 应用而言，这尤其重要。\n\n#### 验证与执行\n\n\
    在将训练后的模型用于 AI 应用之前，需要对其进行彻底的验证。在 AI 应用中，该想法是对人类情报的补充，因此，在部署模型之前，确保已对异构数据样本（评估数据集）进行了验证，这一点变得尤为重要。该模型不仅需要在预定义的评估样本上而且还需要在模型从未看到的新数据集上通过较高的阈值。我们可以使用两种主要的验证类别来评估模型：保持和交叉验证。\n\
    \n两种方法都使用测试集来评估模型输出（即算法看不到的数据）。不建议使用我们用来开发模型的数据进行测试。这是因为我们的模型会记住整个训练集，因此会在训练集中的任何点预测正确的标签。这称为过拟合。由于其速度、简单性和多函数式，所以保留方法很有用。尽管如此，由于训练和测试数据集的变化会导致准确率估计值的显着差异，因此该方法通常具有很高的不确定性。\n\
    \n##### 留存\n\n留存方法的基本思想是通过将模型暴露于新数据集（与用于训练的数据集相比）来避免过拟合。最初，它导致模型精度低于最小阈值；然而，该方法提供了无偏的学习表现和准确的估计。该方法将数据集随机分为三个子集：\n\
    \n*   **训练集**：这是用于预测模型构建的数据集子集。\n*   **验证集**：这是一个数据集子集，用于评估在训练阶段构建的模型的表现。它提供了一个测试平台，可以微调模型的参数并选择表现最佳的模型。并非每种建模算法都需要一组验证。\n\
    *   **测试集**：这是数据集的子集，用于预测产品的潜在未来输出。\n\n##### 交叉验证\n\n这是一种我们可以访问有限的数据集进行训练和评估的技术。通过这种技术，我们将数据分解为不同的块。这些独立的块以随机顺序用于评估过程中的多次迭代训练和评估。这样可以确保在各种样本上训练模型，并且还可以通过训练数据的不同子集执行等效评估。\n\
    \n这样可以确保模型结构有足够的变化，以避免过拟合和过拟合。但是，即使使用交叉验证方法，也建议您拥有尽可能多的数据用于训练和评估。这些方法的准确率计算是通过训练和评估使用的各种迭代的平均值。\n\
    \n#### 模型评估参数（指标）\n\n需要模型评估指标来度量模型效率。选择评估指标取决于 ML 的特定任务（例如分类、回归、排名、聚类或主题建模等）。某些指标（例如精确召回）对于多个任务很有用。基于监督和经验（历史数据）的机器学习模型（例如分类和回归）构成了机器学习的大部分应用。\n\
    \n##### 分类指标\n\n让我们看一些常用的分类指标：\n\n*   **分类准确率**：对于分类问题，准确率是标准的度量标准。通常将其作为预测总数与正确预测数目之比来衡量。例如，如果我们有一个基于图像对动物进行分类的用例，则可以通过比较训练和评估时间数据并与分类尝试的总数之比来衡量正确分类的数量。我们需要通过将样本数据划分为各种评估测试来运行多个测试，以避免数据过大和不足。我们还可以通过比较各种模型来部署交叉验证，以优化表现，而不是对同一模型使用不同的随机样本运行多个测试。使用这些方法，我们可以迭代的方式提高分类的准确率。\n\
    *   **混淆矩阵**：有关错误分类的信息对于提高模型的整体可靠性也很重要。混淆矩阵是了解整体模型效率的有用技术。\n*   **对数损失**：当输入是介于\
    \ 0 和 1 之间的概率值时，这是理解模型表现的重要指标。对于 ML 模型，最好具有最小的对数损失。通常为此指标设置的阈值小于 0.1。\n*   **曲线下面积（AUC）**：AUC\
    \ 提供了所有可能的额定水平的综合表现指标。\n\n#### 模型部署\n\nAI 和 ML 模型的部署是全面运行模型的重要步骤。GCP 使部署模型的多个版本变得容易且无缝。以下是在生产中部署模型所需遵循的一般步骤：\n\
    \n1.  使模型文件在 Cloud Storage 存储桶中可用。\n2.  建议您在使用的同一 AI 系统项目中使用专用的 Cloud Storage\
    \ 池。如果您需要在其他项目中使用存储桶，则必须确保您的 AI 平台帐户能够访问您的 Cloud Storage 模型。没有所需的权限，您尝试构建模型的 AI\
    \ 平台版本将失败。以下是设置 Google Cloud 存储桶所涉及的步骤：\n3.  为存储桶设置唯一的名称。确保它具有唯一的名称，以使其与项目的云存储中的所有其他存储桶区分开。通常，您可以通过在项目\
    \ ID 的末尾附加 `-mlengine` 来生成存储区名称。为确保在整个项目中进行一致的部署，建议使用最佳实践。例如，如果项目名称为 `AIGCP`，则用于存储模型文件的存储桶名称将为\
    \ `AIGCP-mlengine`。\n4.  设置存储桶的区域并设置环境变量值。建议您使用打算在其上运行 AI 平台作业的区域。\n5.  使用以下针对\
    \ `TensorFlow SavedModel` 的命令将模型上传到新创建的存储桶：\n\n```bash\nSAVED_MODEL_DIR=$(ls ./your-export-dir-base\
    \ | tail -1)\ngsutil cp -r $SAVED_MODEL_DIR gs://your-bucket\n```\n\n4.  在将模型用于\
    \ AI 平台预测之前，请测试 `gcloud ai-platform local predict` 命令以检查模型如何处理预测。该命令使用本地环境中的依赖项进行预测并在联机进行预测时以与\
    \ `gcloud ai-platform predict` 相同的方式产生输出。为了节省成本，建议您在发送联机预测请求之前在本地检查预测以发现错误。这是测试模型的示例命令：\n\
    \n```bash\ngcloud ai-platform local predict --model-dir model_storage_path/ \\\
    \n --json-instances path-for-prediction-input.JSON \\\n --framework tensorflow\n\
    ```\n\n在本节中，我们已经看到了构建 AI 应用的各个阶段。这是用于开发 AI 应用的高级构建块的简化视图：\n\n![](img/a3227eefb664c2749b4cf4e8b2732f53.png)\n\
    \n图 10.1：AI 应用的高级构建块\n\n正如我们在图中所看到的，AI 应用管道中主要包含三个区域：数据获取、数据处理（特征工程），然后是模型执行和调整。在本章的后续部分中，我们将考虑一个用例，并了解在\
    \ GCP 上使用 AI 工具包构建可运行的应用有多么容易。\n\n### 用例概述 – 自动发票处理（AIP）\n\n发票处理是遵循典型工作流程的重复性通用过程。目前，大多数组织都需要大量的人工干预来管理发票处理的各个方面。我们在本书中看到的各种\
    \ GCP 工具可以使组织的整个发票处理系统自动化。在本节中，我们将通过逐步进行自动开票的过程来探索用例。\n\n例如，让我们考虑一家为客户提供 IT 咨询服务的软件开发公司。通常，对于项目的时间和材料成本，在月底（或预定义的发票期）将发票发送给客户。发票包含有关卖方提供给客户的服务的所有详细信息，以及各个服务的详细信息以及付款处理所需的详细信息（例如，银行帐户详细信息）。在我们的示例中，让我们考虑发票文件为\
    \ PDF 格式，并通过电子邮件接收。这是我们示例的发票示例：\n\n![](img/ea6faf19f9e8726aa40b6768d3eca296.png)\n\
    \n图 10.2：示例用例的发票示例\n\n通常，发票包含以下部分：\n\n1.  客户名称、地址和电话号码。\n2.  发票抬头信息，例如发票编号、日期、SOW\
    \ 编号、项目 ID 等。\n3.  发票金额明细和总计。\n4.  发票金额（以字为单位）。\n5.  用于汇款的银行帐户详细信息。\n\n应付帐款团队收到发票后，他们将根据时间表系统验证各个应付款条目，并根据供应商的付款条件安排发票以进行付款。以下流程图描述了此工作流程：\n\
    \n![](img/1766c9d364b49c9d96c42a2ad6cd4b90.png)\n\n图 10.3：具有代表性 GCP 组件的发票处理流程\n\
    \n我们将使用 GCP 组件来自动化此过程。在下一节中，我们将介绍 GCP 上 AIP 系统的设计。\n\n### 在 GCP 上使用 AI 平台工具设计\
    \ AIP\n\n我们将使用本书前面已经学习过的一些 GCP 组件来设计 AIP 应用。下图突出显示了四个部分，这些部分分别有助于构建应用。我们将使用原始发票\
    \ PDF 文件作为信息源。\n\n数据将存储在 Cloud SQL 中，并在 Cloud Functions 的帮助下传递给 AI 工具包以进行进一步处理。然后，我们将利用\
    \ GCP 上的 AI 工具包在应用中构建智能。首先，我们需要一个 ML、自然语言界面、视觉 API 和语音 API 来启用对话界面。最后，我们将利用出站服务，特别是\
    \ Dialogflow。这是使用 GCP 组件的 AIP 应用的高层组件交互：\n\n![](img/70790cfe990be1ddf0b4f2e9df28b92a.png)\n\
    \n图 10.4：AIP 应用的组件设计\n\n通过集成各种 GCP 组件，我们可以实现功能齐全的 AIP 应用。以下列表显示了应用中涉及的各种 GCP 组件的功能摘要。\n\
    \n以下组件可用作 GCP 中的数据存储区；在我们的应用中，我们将利用 Cloud SQL：\n\n*   **Cloud SQL**：这是一个完全托管的数据库，可以充当\
    \ GCP 上的关系数据库。在撰写本文时，Cloud SQL 可以与 MySQL、PostgreSQL 和 SQL Server 一起使用。\n*   **Cloud\
    \ Bigtable**：这是 GCP 上的 NoSQL 数据库服务。Bigtable 为数据集提供了低延迟、可大规模扩展的界面。该存储是 ML 应用的理想选择，并且易于与各种开源大数据框架集成。\n\
    *   **Cloud Spanner**：这是一种水平可伸缩的关系数据库服务，在各个实例和节点之间高度一致。它结合了关系型数据库和非关系型数据库的最佳功能，其完全托管的特性使其成为用最少的时间投资来进行大型数据库部署的有吸引力的选择。\n\
    *   **Cloud Memorystore**：这是一种完全托管的内存中数据存储服务，可用于构建应用缓存，并为数据访问提供极低的延迟。该内存存储利用 Redis\
    \ 协议，从而使它在各个部署之间保持一致。缓存的移植很容易。\n\n"
