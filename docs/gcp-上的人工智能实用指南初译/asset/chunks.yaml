    ```\n\n将以下请求发送到 Web 服务：\n\n```bash\ncurl -X POST -H \"Content-Type: application/json\"\
    \ \\\n  -H \"Authorization: Bearer $(gcloud auth application-default print-access-token)\"\
    \ \\\n  https://automl.googleapis.com/v1beta1/projects/ai-gcp-ch4/locations/us-central1/models/ICN7883804797052012134:predict\
    \ -d @image_classification_request.json\n```\n\n## Python 代码\n\n以下是可在应用内用于基于一组新图像调用模型的\
    \ Python 代码：\n\n```python\nimport sys\nfrom google.cloud import automl_v1beta1\n\
    from google.cloud.automl_v1beta1.proto import service_pb2\n\ndef get_prediction(content,\
    \ project_id, model_id):\n    prediction_client = automl_v1beta1.PredictionServiceClient()\n\
    \    name = 'projects/{}/locations/us-central1/models/{}'.format(project_id, model_id)\n\
    \    payload = {'image': {'image_bytes': content }}\n    params = {}\n    request\
    \ = prediction_client.predict(name, payload, params)\n    return request # waits\
    \ till request is returned\n\nif __name__ == '__main__':\n    file_path = sys.argv[1]\n\
    \    project_id = sys.argv[2]\n    model_id = sys.argv[3]\n    with open(file_path,\
    \ 'rb') as ff:\n        content = ff.read()\n    print(get_prediction(content,\
    \ project_id, model_id))\n```\n\n如本节中所述，AutoML 使训练该图像分类模型变得无缝且容易，并且该模型已部署在云上，并且可以由经过认证的用户和服务帐户使用简单的\
