    \ 越能训练模型以准确处理各种交流方式。在内部，DialogFlow 利用 ML 算法，该算法在更多训练数据中会变得更好。\n\n建议使用至少 10 个训练短语组合来配置意图：\n\
    \n1.  DialogFlow 提供了用于实现反馈循环的训练工具，并提高了智能体的准确率。部署 DialogFlow 智能体并且用户开始与该智能体通信后，将有用户登录到\
    \ DialogFlow 的短语和话语。我们需要启用设置以将交互记录到 DialogFlow。这些设置可以在智能体设置页面的“常规”选项卡上找到。以下屏幕快照显示了\
    \ DialogFlow 智能体的常规设置：\n\n    ![](Images/7d067ff6d484758e7584657224ab63cc.png)\n\
    \n    图 6.10：使用 DialogFlow 记录交互的常规配置\n\n    我们需要启用**日志设置**，以将交互记录到 DialogFlow。这样，我们将能够收集和存储用户查询。用户查询将可用于手动训练。这将有助于创建一个训练循环，以确保随着越来越多的用户与智能体进行交互，智能体在一段时间内的表现会更好。\n\
    \n2.  为“新到达”意图添加各种响应。在此意图的上下文中，输入表达式的所有变体都希望智能体做出响应，以提及书店中的新到货清单。与我们使用默认的欢迎意图所做的类似，我们可以配置多个响应，这些响应向呼叫者提供有关新到达的信息。DialogFlow\
    \ 会为每个用户表达式随机选择一个已配置的响应的特定实例，以匹配意图中已配置的训练短语。\n\n3.  可以使用一组训练短语来测试智能体配置。\n\n4.\
    \  DialogFlow 显示了已被解释并与意图匹配的用户表达式。\n\n5.  智能体基于意图配置做出响应。\n\n一旦用户知道书店有新来的东西，智能体就可以引导对话以查看用户是否感兴趣。如果是，则可以将意图响应配置为引导用户保留特定书籍的副本以供提取。为了简化此操作，我们需要从用户的表达式中捕获参数。到目前为止，这是使用\
    \ MyBookStore 智能体进行的转换的流程：\n\n> 来电者：你好  \n> 我的书店智能体：您好，感谢您致电我的书店。我们的营业时间为上午 9\
    \ 点至下午 6 点。  \n> 来电者：这个月有什么新来的？  \n> 我的书店的智能体：这个月我们有三个新来的人。您想来接下一本书吗？  \n> 来电者：是的。我想明天来接。\
    \  \n> 我的书店智能体：可以。你**明天**想什么时间来？  \n> 来电者：**上午 10 点**。  \n> 我的书店智能体：知道了。您的约会预定于\
    \ **2019 年 12 月 30 日**在**上午 10 点**进行。再见。\n\n在这种情况下，用户打算去商店并提到一天。DialogFlow 智能体需要配置为从用户表达式中提取含义。对于人类来说，从对话中提取有意义的信息是一件容易的事。但是，机器（DialogFlow）智能体需要针对特定的对话流进行训练。要安排商店访问的约会，让我们创建一个名为`Store_Visit`的新意图：\n\
    \n1.  创建一个名为`Store_Visit`的新意图。\n2.  在训练短语部分中，添加以下短语：\n    *   `3 pm today`\n \
    \   *   `Today`\n    *   `Yes. I want to come and pickup tomorrow`\n\n输入这些训练短语后，请注意，“操作和参数”部分中将出现两个参数。这些参数映射到`@sys.date`和`@sys.time`系统参数。以下屏幕截图显示了训练短语以及已配置的操作和参数：\n\
    \n![](Images/dad17f4a74960d31010c2bba731bef78.png)\n\n图 6.11：带有动作和参数的定制意图\n\n\
    通过此设置，当“我的书店”智能体包含日期和时间信息时，他们可以根据特定的训练短语为呼叫者预订约会；但是，在实际对话中，我们不能期望用户在初始对话期间提供所有必需的信息。为了解决这个问题，我们需要使用一种称为插槽填充的功能。我们需要将已识别的参数设置为`REQUIRED`。请参阅“图\
    \ 6.11”。我们需要通过选中第一列中的框来设置所需的日期和时间参数。\n\n一旦完成，座席将在对话期间要求特定的数据和时间信息，并提示用户输入需要安排约会的日期和时间。必需参数的顺序指示\
    \ DialogFlow 智能体将搜索有关必需字段的信息的顺序。在这种情况下，智能体将提示用户设置约会日期，然后再在特定时间进行预订。获取约会日期后，智能体会提示用户设置约会时间。在`PROMPTS`列中，我们可以配置各种表达式，以提示需要特定的参数。以下屏幕截图显示了`$time`参数的提示配置：\n\
    \n![](Images/d918b01e9e28f60c5c3c39e494fed623.png)\n\n图 6.11：插槽填充和提示配置\n\n这是使对话更加有意义和自然的两个不同步骤：\n\
    \n*   使用提示填充插槽来收集所需参数的值\n*   配置各种提示来收集约会时间\n\n随着我们添加更多的训练短语和响应，并在我们的应用上下文中以自然的对话风格填充空位和提示，对话听起来越来越自然。让我们使用\
    \ DialogFlow 提供的测试接口来测试 MyBookStore 智能体：\n\n![](Images/17941a0fce7b8b3dcab2c93fb148c2dd.png)\n\
    \n图 6.12：测试 MyBookStore 智能体\n\nMyBookStore 智能体执行以下步骤：\n\n*   智能体通过各种意图和空位填充无缝地导航对话。在这一点上，我们仅提供了答复，说已预约。\n\
    *   该约会尚未在后端系统中实际预订，并且尚未进行日历条目。为了使用户能够进行日历条目，我们需要使用履行过程来创建日历条目。\n\n# DialogFlow\
    \ 支持的用例\n\nDialogFlow 引擎可以有效地用于需要人工智能体回答客户查询或执行一组预配置操作的任何行业的商务应用。借助语音交互和强大的 NLP\
    \ 引擎，对话听起来自然，并且如果进行了广泛配置，则呼叫者很难区分人工智能体和 DialogFlow 智能体。\n\nDialogFlow 智能体提供对在开发和配置过程中经过内部训练的\
    \ ML 模型的无服务器访问。GCP 支持的所有非函数式方面和功能固有地可用于 DialogFlow 智能体。一些重要的优势是可伸缩性和可用性。如果服务遇到大量流量和\
    \ API 请求，则会自动扩展群集以满足对计算资源的需求增长。由于使用了底层的 GCP 基础架构，该平台还确保了 99.9% 的可用性。\n\n这有助于无缝地为服务提供\
    \ 24/7 客户支持。例如，在航空公司智能体的情况下，客户可以使用 DialogFlow 提供的对话界面查询航班时刻表，预订航班或执行 Web 登机手续。该智能体可以\
    \ 24/7 全天候提供这些服务，从而提高了服务水平并显着降低了运营成本。智能体可以与客户的 CRM 系统集成，以便处理某些未经训练的请求。随着服务的使用，对日志进行分析，并建立反馈循环，会话智能体的质量会在一段时间内提高。\n\
    \n# 使用 DialogFlow 执行音频情感分析\n\nDialogFlow 提供了一项功能，可以对每个用户表达式执行情感分析。当产品或服务的用户致电寻求帮助时，此功能在呼叫中心的环境中很有用。DialogFlow\
    \ 利用了 Cloud Natural Language 的情感分析引擎。可以从 DialogFlow 设置菜单中启用情感分析，方法是导航到“高级”设置，然后单击“为当前查询启用情感分析”。\n\
    \nDialogFlow 企业版中提供了此功能。DialogFlow 还提供与 Cloud Natural Language 引擎的集成，以执行情感分析。每个用户对话都是有状态的交互，并由\
    \ DialogFlow 中的`session_id`唯一标识。建议您在 API 调用中使用相同的会话 ID 进行连续对话。这是一个代码片段，用于使用 DialogFlow\
    \ API 根据对话中的用户表达式执行情感分析：\n\n```python\ndef get_sentiment(PROJECT_ID, SESSION_ID,\
    \ text, language_code):\n\n    import dialogflow_v2 as dialogflow\n    session_client\
    \ = dialogflow.SessionsClient()\n\n    session_path = session_client.session_path(PROJECT_ID,\
    \ SESSION_ID)\n\n    text_input = dialogflow.types.TextInput(text=text, language_code=language_code)\n\
    \n    query_input = dialogflow.types.QueryInput(text=text_input)\n\n    sentiment_config\
    \ = dialogflow.types.SentimentAnalysisRequestConfig(analyze_query_text_sentiment=True)\n\
    \n    query_params = dialogflow.types.QueryParameters(sentiment_analysis_request_config=sentiment_config)\n\
    \n    response = session_client.detect_intent(session=session_path, query_input=query_input,\
    \ query_params=query_params)\n```\n\n用户表达的情感分数封装在响应对象中。当需要智能履行智能体程序时，可以将该 API\
    \ 方便使用，该智能体程序可以与外部系统和服务集成以通过智能对话智能体程序提供增值服务。该服务可以与外部数据源集成，以使对话对呼叫者更加有意义和有用。\n\n\
    这种集成使构建可以访问大量外部信息和服务的智能体成为可能。该平台还提供了一个封闭的反馈环路，用于在智能体用于自然对话时改善一段时间内的对话。该平台还提供与\
    \ Natural Language 引擎的无缝集成，以对 DialogFlow 智能体遇到的每个用户表达式执行情感分析。利用 DialogFlow 可以轻松满足各种可能性和用例。使用\
    \ DialogFlow，功能团队可以使用机器智能和类似人的对话。\n\n# 总结\n\n在本章中，我们学习了 DialogFlow，它是一个用于构建对话应用的服务。对话式应用需要强大的\
    \ NLP 引擎，训练模型以分析用户表达的基础结构，规则引擎以及用于提供自然语言响应的智能体。独立地构建这些功能块需要对组件进行编码。可伸缩性和可用性也面临挑战。\n\
    \n我们已经看到了 GCP 上的 DialogFlow 引擎如何处理所有构造块，并允许开发人员专注于业务场景并提供简单的用户界面以及 API 层以利用服务。无需编码即可构建具有静态内容的简单对话智能体，因此开发团队无需具备高端编程技能。可以由业务分析师和了解服务功能方面的人员来构建简单的对话智能体。与外部服务（电子邮件，电话，社交媒体等）的集成也可以由实现智能体完成。\n\
    \n在下一章中，我们将深入研究云 TPU，它们是构建高性能 ML 操作的基本构建块。\n\n# 第 3 节：Google Cloud Platform 上的\
    \ TensorFlow\n"
  trans: "\n\n## DialogFlow 智能体配置与意图管理\n\n我们将通过 DialogFlow 控制台创建一个新的 Google 项目。单击右上角的“创建”按钮。创建智能体后，我们将进入“意图”屏幕。DialogFlow\
    \ 为每个智能体提供两个默认意图。这些是任何应用通常都需要的预配置意图：\n\n*   **欢迎意图**：这是开始对话的默认意图。作为最佳实践，座席需要向用户打招呼并使其与问候语的总体用户风格相匹配。还建议欢迎意图以智能体提供的领域特定的功能进行答复。例如，对于书店智能体，该智能体需要向用户打招呼，并简短地谈论书店。\n\
    *   **后备意图**：这是默认意图，当智能体无法将用户表达式与任何已配置的意图匹配时调用。\n\n所有意图都配置有**上下文**、**事件**、**训练短语**、**动作和参数**、**响应**和**实现**。让我们看一下默认的欢迎意图。可以根据应用上下文对欢迎意图进行配置和修改以吸引用户：\n\
    \n![](img/61a09cf67f7d06eac2fc17f86aa31ab9.png)\n\n图 6.4：默认欢迎意图\n\n默认的欢迎意图配置了一组训练短语和响应。让我们修改默认的欢迎意图以适合我们的书店智能体。我们可以添加新的响应，也可以删除\
    \ DialogFlow 提供的默认响应。\n\n以下屏幕截图说明了欢迎意图的配置：\n\n![](img/9f466a216e2c945a0ca3f0faaa725b9e.png)\n\
    \n图 6.5：配置默认的欢迎意图\n\nDialogFlow 控制台提供了一种快速测试已配置响应的简便方法。在右窗格中，DialogFlow 提供了一种提供音频和文本输入的方法，并根据配置的意图模拟\
    \ DialogFlow 智能体的响应。这是一个截图，说明了来自欢迎意图的响应：\n\n![](img/5e31b3846bc1858e0156b2c5dd766ef7.png)\n\
    \n图 6.6：意图测试\n\n我们可以使用以下工具配置智能体：\n\n*   **用于输入测试短语的文本字段**：控制台使用户可以键入测试字符串，还可以与系统的麦克风集成以进行语音对话测试。\n\
    *   **用户表达式**：DialogFlow 测试窗格会重现输入或说出的文字，以进行验证和测试。\n*   **响应**：基于意图配置，来自 DialogFlow\
    \ 智能体的响应显示在此区域中。\n*   **诊断信息**：这是 DialogFlow 提供的一种方便工具，用于对意图请求/响应进行故障排除。\n\n单击“诊断信息”按钮，以\
    \ JSON 格式查看 DialogFlow 智能体的响应。这是来自智能体的 JSON 格式的示例响应：\n\n```json\n{\n    \"responseId\"\
    : \"af1b533d-b107-42c1-b2af-1fcc30ed6b01-b4ef8d5f\",\n    \"queryResult\": {\n\
    \        \"queryText\": \"Hello\",\n        \"action\": \"input.welcome\",\n \
    \       \"parameters\": {},\n        \"allRequiredParamsPresent\": true,\n   \
    \     \"fulfillmentText\": \"Hi, Thank you for calling My Book Store. We are open\
    \ from 9 am to 6 pm\",\n        \"fulfillmentMessages\": [\n            {\n  \
    \              \"text\": {\n                    \"text\": [\n                \
    \        \"Hi, Thank you for calling My Book Store. We are open from 9 am to 6\
    \ pm\"\n                    ]\n                }\n            }\n        ],\n\
    \        \"intent\": {\n            \"name\": \"projects/mybookstore-efjbhb/agent/intents/6fa880d8-1ed2-4999-86dc-a58211a164c4\"\
    ,\n            \"displayName\": \"Default Welcome Intent\"\n        },\n     \
    \   \"intentDetectionConfidence\": 1,\n        \"languageCode\": \"en\"\n    }\n\
    }\n```\n\n我们可以为欢迎意图添加响应变体。DialogFlow 根据上下文和用户表达式随机选择响应。为了对提供的特定响应进行精细控制，我们需要通过编写自定义代码来利用实现\
    \ API。当我们提供诸如“我该如何帮助您？”的开放式回复时，智能体期望来自用户的响应以在特定方向上推动对话。\n\n我们可以通过创建自定义意图来处理对话中的这些派生。在创建自定义意图之前，让我们看一下\
    \ DialogFlow 提供的默认回退意图。当用户的表达式无法与任何已配置的意图匹配时，激活后备意图。当基于用户表达的意图匹配失败时，DialogFlow\
    \ 会提供默认的后备意图和一组预配置的响应。这是 DialogFlow 中默认回退意图的快照：\n\n![](img/d56202f65286f5fe2ef5ed096c5207fa.png)\n\
    \n图 6.7：默认回退意图\n\n让我们创建几个自定义意图来帮助 MyBookStore DialogFlow 智能体继续与自定义欢迎意图之外的呼叫者进行对话。我们希望智能体执行以下两项任务：\n\
    \n*   提及当月的新来者清单。\n*   保留该书的副本供用户取用。\n\n在这种情况下，我们需要创建两个意图。让我们创建我们的第一个意图，该意图将当前月书店中的最新消息告知用户。例如，当用户说“我想知道最近的到货”时，智能体应回答“这是本月到货的新书清单。书-1，作者，出版物”。以下屏幕截图显示了创建新的自定义意图的过程：\n\
    \n![](img/548810f23aebd369c8b97d4951b44894.png)\n\n图 6.8：自定义意图的创建\n\n从前面的屏幕截图可以看出，我们执行以下步骤：\n\
    \n1.  在 DialogFlow 控制台中单击“创建意图”按钮。\n2.  提供自定义意图的名称。在这种情况下，我们将其命名为`新到货`。\n3.  单击“保存”按钮。\n\
