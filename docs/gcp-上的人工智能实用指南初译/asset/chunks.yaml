    \ 导航到 AutoML 自然语言界面\n\n使用您的 GCP 凭据登录[这里](https://console.cloud.google.com)。在导航菜单上，转到**人工智能**部分，然后单击**自然语言**子菜单：\n\
    \n![](img/5442109b1119a01b50a57d3d61f67993.png)\n\nAutoML 自然语言使上传数据集和训练模型变得容易。在我们的示例中，数据集是新闻组文档的集合。\n\
