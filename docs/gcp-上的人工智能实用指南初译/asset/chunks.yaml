    TPU 上进行训练。


    ## 使用 TPU 的优势


    在 ML 算法中，通常使用线性代数计算。TPU 使这种计算的性能最大化；可以在很短的时间内在 TPU 上训练在 GPU 上花费大量时间的模型。此外，对于 `卷积神经网络`（`CNN`）模型，`Cloud
    TPU` 大大缩短了达到准确率的时间。如果您拥有适用于 `Cloud TPU` 的应用，则可以在很短的时间内以非常低的成本获得最大的输出。


    以下屏幕快照显示了用于训练 `ResNet 50` 模型的 GPU 和 TPU 的快速比较。ResNet 50 是一个 CNN 模型，已经对 `ImageNet`
    数据库中的一百万幅图像进行了训练。已经观察到，如果用户使用八个 v100 GPU 和一个完整的 `Cloud TPU v2 pod`，则训练时间和成本都会大大降低。虽然训练速度提高了
    27 倍，但成本也降低了 38%。


    以下屏幕截图比较了在 GPU 和 TPU 上进行训练的成本：


    ![](Images/a06ae93bbd1f80da2b456dd4b88a9b44.png)


    图 7.1 训练费用比较


    从前面的屏幕快照可以明显看出，TPU 可以为复杂的模型训练工作节省大量成本。在一段时间内进行多次部署后，节省的成本变得更加重要，尤其是在生产部署场景中，该场景中需要经常训练模型。


    ## 软硬件架构图


    为了进一步加速数学计算，创建了专用硬件作为 `专用集成电路`（`ASIC`）。这样，尤其是在 `n`-多维数学中，计算能力得到了倍增。在本节中，我们将详细介绍
    TPU 及其相关组件的软件和硬件架构。


    ### 可用的 TPU 版本


    每个 TPU 版本都包含一些主要组件，这些组件构成了 TPU 的功能。在讨论 TPU 版本时，我们将看一下 TPU 内核的架构和 TPU 内核的 `高带宽存储器`（`HBM`）。我们将了解每个
    TPU 设备上的内核如何互连以及如何将网络接口用于设备间通信。


    下表显示了 TPU v2 的特征：


    *   每个 TPU 内核 TPU v2 的 HBM 为 8 GB。

    *   每个内核具有一个 `128 * 128` 的 `矩阵单元`（`MXU`）。

    *   一个 TPU 盒最多可具有 512 个内核和 4 TB 的总内存。


    下图显示了 TPU v2 的组织：


    ![](Images/6b0f9b5c437551cd2f2f8ba8338dd104.png)


    图 7.2 TPU V2 特性


    下表显示了 TPU v3 的特征：


    *   每个 TPU 内核 TPU v3 的 HBM 为 16 GB。

    *   每个内核具有两个 `128 * 128` 的 MXU。

    *   一个 TPU 盒最多可具有 2,048 个内核和 32 TB 的总内存。


    下图显示了 TPU v3 的组织：


    ![](Images/ccbe8503e373bdfaa8765f5e5aad50ff.png)


    图 7.3 TPU 的组织


    每个 TPU 内核均由标量单元、向量单元和 MXU 组成。TPU 芯片以 MXU 计算能力为后盾。在一个周期内，MXU 可以执行 16,000 个 `乘积`（`MAC`）操作。MXU
    输入和输出是 32 位浮点值，但是它以 `bfloat16` 精度执行乘法以提高精度。每个内核可以独立执行用户操作，并且通过高带宽互连可以与其他芯片进行通信。对于大型
    ML 工作负载，可以将多个 TPU 设备与高速网络接口互连，以获得大量的 TPU 内核和内存。


    ### 与 TPU v2 相比，TPU v3 的性能优势


    正如我们在本书前面所看到的，与 TPU v2 相比，TPU v3 具有更多的 `TeraFlops`（`TFLOPS`）和内存。因此，肯定有一些地方 TPU
    v3 可以获得比 TPU v2 更好的结果。要确定要使用的 TPU 版本，可以在可用版本上运行模型，并使用 `TensorBoard` 检查性能。


    以下是 TPU v3 可以改善的一些方面：


    *   受计算限制的模型在 TPU v3 上具有显着的优势。

    *   数据不适合 TPU v2 内存但适合 TPU v3 内存的情况会有所帮助。

    *   批量大小不适合 TPU v2 的新模型可以再次获得性能优势。

    *   在某些区域中，模型是输入绑定的，或者模型是内存绑定的；在那里，您可能看不到这种性能提升。因此，在确定 TPU 版本之前，请在预期用例的背景下进行性能基准测试和成本值分析。


    ### 可用的 TPU 配置


    让我们讨论 Google 提供的不同类型的 TPU 配置。


    Google 提供了两种不同类型的配置，用户可以在两个 TPU 版本中利用它们。它们如下：


    *   **单设备 TPU**：这些是执行所有操作的单独设备。这些设备未通过网络与其他 TPU 设备互连。实际上，一个以上的单个 TPU 设备无法通过网络连接到另一设备。

    *   **TPU 盒**：TPU 盒不过是群集，其中有多个 TPU 设备通过高速网络与另一台设备互连。


    下图描述了单个 TPU 设备，因为它不连接到另一个 TPU 设备，因此不需要高速网络带宽。TPU 节点仅连接到一个 TPU 设备。TPU 中的芯片已经互连，不需要主机
    CPU 或主机网络资源：


    ![](Images/61d99ce630d472e81aa862b49280c612.png)


    图 7.4 单设备 TPU


    上图中的设备正在使用 `Cloud TPU v3`，但是在设置节点时，您可以指定任何 TPU 版本。我们将在“软件架构”部分中讨论流程。以下屏幕快照描绘了一个
    TPU 盒，其中多个 TPU 设备通过高速网络连接进行连接：


    ![](Images/2e7ee5f7d4d254059565ef2e9a6f5cbe.png)


    图 7.5 TPU 盒


    在上图中，请注意以下几点：


    *   主机正在不同的 TPU 设备上分配 ML 工作流。

    *   TPU 中的芯片已经互连，不需要主机 CPU 或主机网络资源。

    *   由于 TPU 设备通过高速带宽网络连接，因此它们也不需要主机 CPU 或主机网络资源。


