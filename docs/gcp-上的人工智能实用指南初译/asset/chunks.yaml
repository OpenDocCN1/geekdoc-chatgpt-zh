    \ `1`。\n    9. 单击“创建表”。\n\n以下屏幕快照中还显示了创建表的上述步骤：\n\n![](img/09909b2b5ebc87c0836c355d975083ff.png)\n\
    \n以下屏幕快照描述了如何跳过标题行：\n\n![](img/cc93b4f271ba0110ed0c605e5e669dbc.png)\n\n现在，我们已经在\
    \ `BigQuery` 中创建了 `Leads` 数据集，并从 `Cloud Storage` 存储桶中的可用数据中创建了 `Leads_Training`\
    \ 和 `Leads_Test` 表，接下来我们将训练模型。\n\n## 训练模型\n\n以下 `BigQuery` 代码片段将用于通过 `Leads_Training`\
    \ 表中的逻辑回归来训练销售线索模型：\n\n请使用[这个页面](https://github.com/vss-vikram/Hands-On-Artificial-Intelligence-on-Google-Cloud-Platform)上的\
    \ `leads_model.sql` 文件从以下链接加载查询。\n\n```sql\nCREATE MODEL\n `Leads.lead_model_optimum`\n\
    \ OPTIONS\n (model_type = 'logistic_reg') AS\n SELECT\n Lead_Stage AS label,\n\
    \ lead_origin,\n lead_source,\n ...,\n ...,\n ...,\n ..., \n receive_more_updates_about_our_courses,\n\
    \ update_me_on_supply_chain_content,\n Get_updates_on_PGDMHBSCM,\n city_new,\n\
    \ ...,\n ...,\n Asymmetrique_Activity_Score,\n Asymmetrique_Profile_Score,\n Last_Notable_Activity\n\
    \ FROM\n Leads.Leads_Training_Data;\n```\n\n从前面的代码中，我们可以看到以下内容：\n\n*   我们正在 `Leads`\
    \ 数据集中创建一个名称为 `lead_model_optimum` 的模型。\n*   如您在 `OPTIONS` 中看到的那样，已经创建了逻辑回归模型，其中\
    \ `model_type` 是 `logistic_reg`。\n*   `Lead_Stage` 是我们将根据测试数据进行预测的标签。\n*   `Lead_Stage`\
    \ 是我们可以从中识别销售线索状态的列。\n*   模型将使用 `lead_origin` 至 `Last_Notable_Activity` 列来预测测试数据上的\
    \ `Lead_Status`。\n*   该模型是使用 `Leads_Training_Table` 中的数据创建的。\n*   创建模型后，它将以名称\
    \ `lead_model_optimum` 保存在 `Leads` 数据集中。\n\n通过单击“模型”，您将能够看到“模型详细信息”，“模型状态”和“模型模式”。它具有完整的细节，例如所使用的算法，迭代次数，学习率，完成时间等。因此，只需将前面的代码复制并粘贴到\
    \ `BigQuery` 窗口中，便可以创建第一个模型。\n\n接下来，我们将看到如何评估所创建的模型。\n\n## 评估模型\n\n在 `BigQuery`\
    \ 中，可以使用 `ml.evaluate()` 函数评估任何模型。它将给出该模型的结果。在下面的代码块中是 `BigQuery` 代码和模型评估结果。让我们看下面的代码：\n\
    \n```sql\nSELECT *  FROM\n ml.evaluate (model `Leads.lead_model_optimum`,\n  \
    \       (\n         SELECT  Lead_Stage AS label, *\n             FROM\n      \
