    \ contents = contents.decode(\"utf-8\")\n    data = JSON.loads(contents)\n\n \
    \   #Reading required text field from data.\n    output = data['responses'][0]['fullTextAnnotation']['text']\n\
    \    output = output[:-1]\n\n    #Code setup to convert output data from JSON\
    \ file to the required format                                for loading into\
    \ invoice table.\n\n    df_invoice = pd.DataFrame.from_dict(output_dict)\n\n \
    \   df_invoice[['Developer', 'Rate', 'Hours', 'Subtotal']] =                 \
    \              df_invoice['Developer Rate Hours Subtotal'].str.split(expand=True)\n\
    \n    df_invoice = df_invoice.drop(columns=['Developer Rate Hours Subtotal'])\n\
    \n    #Establishing connection with Cloud SQL.\n    db_con = sqlalchemy.create_engine('MYSQL+pymysql://<db_user>:\
    \                                     <db_pass>@/<db_name>?                  \
    \                                                unix_socket=/cloudsql/<cloud_sql_instance_name>'\n\
    \    )\n```\n\n在代码的这一部分中，我们导入了所需的依赖关系，然后，当从 GCS 加载数据时，我们使用了 GCS 特定的库从 GCS 中存储的文件中加载数据。\
    \ 加载文件后，将从 JSON 文件中提取包含我们在本章前面讨论的所有信息的特定文本。 使用正则表达式将文本字段分隔为单独的列，并使用正则表达式输出填充 Cloud\
    \ SQL 中的发票表。\n\n# 使用 Cloud Functions 验证发票\n\n在本节中，我们将遍历用于验证发票处理的代码。 您将需要在时间表表中加载数据以与发票表进行交叉验证（发票表是使用\
    \ PDF 文件填充的）。\n\n以下是在数据库中创建时间表表并将数据加载到表中的步骤：\n\n1.  正如我们在“使用 Cloud SQL 秘籍存储发票”的步骤\
    \ 2 中所讨论的那样，使用 Cloud Shell 实例连接到 MySQL，并运行以下查询以创建表时间表表：\n\n```\ncreate table timesheet\
    \ \n(Company_Name VARCHAR(50),\nSOW_Number VARCHAR(50),\nProject_ID VARCHAR(50),\n\
    Invoice_Number VARCHAR(50),\nInvoice_Date DATE,\nBilling_Period DATE,\nDeveloper\
    \ VARCHAR(255),\nRate VARCHAR(50),\nHours INT,\nBank_Account_Number INT,\nBank_Name\
    \ VARCHAR(50));\n```\n\n2.  运行以下查询以将数据插入时间表表。 如前所述，您可以使用`aip.sql`来获取以下查询：\n\n\
    ```\ninsert into timesheet (Company_Name, SOW_Number, Project_ID, Invoice_Number,\
    \ Invoice_Date, Billing_Period, Developer, Rate, Hours, Bank_Account_Number, Bank_name)\n\
    values ('Vsquare Systems', '001', '002', '030', '2020-01-31', '2020-01-31', 'Developer1',\
