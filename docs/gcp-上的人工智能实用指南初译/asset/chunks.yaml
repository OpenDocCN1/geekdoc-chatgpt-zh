    \ 模型用于在线和离线预测。 接下来我们将看这个。\n\n# 使用 Cloud Machine Learning Engine 的异步批量预测\n\n为了使用上一节中训练和导出的模型来提供在线预测，我们必须在\
    \ AI 平台中创建模型资源，并在其中创建版本资源。 版本资源是合格模型有效地用于提供预测的资源。 使用此框架，您可以多次调整，重新训练和管理 AI 平台中的所有版本。\n\
    \n模型或版本是已存储在 AI 平台的模型服务中的高级学习解决方案的示例。 您可以使用已训练的标准模型（作为保存的模型）进行发布。 您也可以在创建版本时提供自定义代码（测试版）来处理预测。\
