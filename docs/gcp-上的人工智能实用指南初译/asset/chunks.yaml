- raw: "![](Images/c8293a3c5dd5ea5ee16d7b1a40ee7cfa.png)\n\n图 9.1：在 GCP 上使用预测的步骤\n\
    \n开始预测过程的第一步是在完成模型训练后将模型导出为工件。 您需要将合格的机器学习模型导出为一个或多个工件，以实现来自 Google Cloud AI 平台的预测。\
    \ 本章将说明如何在 GCP 上导出合格的 AI 系统预测模型。 根据用于构建模型的机器学习框架的类型，有多种选项可以导出模型。 例如，如果您已使用 TensorFlow\
    \ 训练机器学习模型，则可以先使用`tf.save_model` API 保存模型，然后再使用 Google Cloud AI Platform 导出模型。\n\
    \n下一步是部署模型。 Google Cloud AI 平台将托管模型，为您提供云预测。 模型部署是用于托管已保存模型文件的方法。 云预测供应商可以处理您的模型基础架构，并可以接受在线和批量预测的请求。\
    \ 模型部署是预测过程中最重要的方面，必须对其进行详细了解。 在下一部分中，我们将详细介绍模型部署方面。\n\n部署模型后，就可以将模型用于在线预测或批量预测。\
    \ 如果您想一次为一组观测值生成预测，然后对一定数量或一定百分比的观测值采取行动，则批量预测很有用。 通常，对于这样的请求，您没有低延迟要求。 这些预测然后存储在数据库中，开发人员或最终用户可以访问。\
    \ 批量推断有时可以使用大数据技术（例如 Spark）来生成预测。\n\n批量推理技术规范比在线推理更简单。 例如，数据科学家可以简单地在执行批量推断的机器上反序列化经过训练的模型，而无需通过**表述性状态转移**（**REST**）API\
    \ 公开经过训练的模型。 批量推断期间所做的预测也可以在最终利益相关者看到之前进行分析和处理。 下图显示了批量预测的工作原理：\n\n![](Images/cf91ab5624462a058fbefc0bcbfee2d8.png)\n\
    \n图 9.2：批量预测\n\n在线预测是根据请求实时创建用于机器学习的预测的方法。 这也称为实时或动态推理。 这些预测通常由运行时的单个数据观察生成。 在线推论预测可以在一天中的任何时间产生。\
    \ 在线推论使我们能够实时使用机器模型。 它开辟了一个可以利用机器学习的全新技术领域。 无需等待数小时或数天的批量预测，我们可以在需要时立即生成预测，并立即提供服务。\n\
    \n在线推论还有助于我们快速分析新数据，而不会产生延迟。 通常，在线推理比批量推理更具挑战性。 由于添加了满足延迟要求所需的工具和系统，因此在线推理往往更加复杂。\
    \ 与需要 24 小时**服务级别协议**（**SLA**）的系统相比，需要在几毫秒内执行预测的程序要困难得多。 下图显示了在线预测的工作方式：\n\n![](Images/b9498fed2090b00fe2497d17cd9ea05c.png)\n\
    \n图 9.3：在线预测\n\n如果使用简单模型和少量输入案例，则完成在线预测和针对类似预防请求的批量分析所花费的时间将大大不同。 完成在线应用几乎立即返回的预测可能需要很长时间。\
    \ 两种预测方法中使用的特定基础结构都有副作用。 提交订单后，AI 平台将分配并初始化批量预测资源。\n\n通常，可以根据要求准备在线预测。 下表总结了在线预测和批量预测之间的区别。\n\
    \n| **批量预测** || **在线预测** |\n\n| --- | --- |\n\n| 适用于具有复杂计算要求的海量大数据量。 || 适用于一次记录，具有低延迟和较简单的模型。\
    \ |\n\n| --- | --- |\n\n| 输出是具有多个预测结果的文件格式。 || 输出一次是一个响应，大多数为 JSON 格式。 |\n\n|\
    \ 异步请求和响应。 || 同步实时请求和响应。 |\n\n| 它可以使用存储在某些外部存储（例如 Google Cloud 存储桶）中的模型，也可以使用通过\
    \ Google Cloud AI 平台进行部署的模型。 || 它只能使用通过 Google Cloud AI 平台部署的模型。 |\n\n| 仅当使用通过\
    \ Google Cloud AI 平台部署的模型时，才对某些实例类型进行有限使用。 || 可以使用不同类型的计算实例进行运行预测。 |\n\n# 维护模型及其版本\n\
    \nGoogle Cloud AI 平台可让您将机器学习解决方案组织为模型和版本。 模型是为您的机器学习解决方案提供的名称，该版本唯一地将部署的模型标识为工件。\
    \ 例如，您可以创建一个名为`ProductCategoryIdentification`的模型，该模型表示用于对产品进行分类的机器学习解决方案。 在机器学习中，模型是要解决的问题的解决方案。\n\
    \n换句话说，这是预测数据值的方法。 模型是 Google Cloud AI 平台上此 AI /机器学习解决方案的每次迭代的概念容器。 例如，要解决的问题是在给定与先前销售相关的一组数据的情况下，预测房屋的销售价格。\
    \ 您构建一个称为房屋价格的 AI 应用模型，并尝试通过几种机器学习技术来解决问题。 您可以在每个级别上部署该模型的版本。 该版本可以与其他版本完全不同，但是如果适合您的工作流程，则可以将其布置在同一模型下。\n\
    \n以下屏幕快照表示如何在 Google Cloud AI 平台上创建模型：\n\n![](Images/aaa2e89834abe9006633d31b0282aa64.png)\n\
    \n图 9.4：创建新模型\n\n如您所见，模型创建用户界面与用户熟悉的 GCP 上的其他服务一致。 我们需要提供区分大小写的模型名称和区域作为强制属性。\
    \ 建议提供可选描述，以提高模型的可维护性。 当我们针对各种用例构建和部署大量模型时，这一点尤其重要。 以下屏幕快照显示了平台上可通过用户界面或 API 使用的模型的列表：\n\
    \n![](Images/e076a29dc6d393474d87ad8ba1e58cf8.png)\n\n图 9.5：模型清单\n\n现在，在创建模型之后，您可以创建它的版本。\
    \ 一个版本表示用来训练模型的机器学习代码和框架。 有时，数据科学家使用不同的框架（例如 XGBoost 或 TensorFlow）来设计针对同一问题的解决方案。\
    \ 他们创建不同的版本来识别工件。 因此，模型版本或仅一个版本是存储在 AI 平台模型服务中的机器学习解决方案的实例。 您可以通过将经过训练的串行模型（作为保存的模型）传输到服务来制作版本。\
    \ 您还可以提供自定义代码（在撰写本文时仍处于 beta 阶段），以在制作版本时管理预测。\n\n至少具有一个版本的每个模型都有一个默认版本。 生成第一个版本时，将设置默认值。\
    \ 如果您请求仅指定模型名称的预测，则 AI 平台将使用该模型的默认版本。\n\n以下屏幕截图显示了如何管理版本：\n\n![](Images/517b5d7d93bdf74e10128d7d71f7d20d.png)\n\
    \n图 9.6：创建模型版本\n\n命名模型和版本的一些规则如下：\n\n*   名称应仅包含字母（大小写混合），数字和下划线。\n\n*   名称应以字母开头。\n\
    \n*   名称最多可包含 128 个字符。\n\n*   该名称在项目中应该是唯一的（如果它是模型名称），在模型中应该是唯一的（如果它是版本名称）。\n\n\
    您还可以添加自定义内置代码所需的自定义包，如以下屏幕截图所示：\n\n![](Images/70ba2b6275e0c0aad522f6805af91d6b.png)\n\
    \n图 9.7：添加自定义代码和包\n\n最终的输出屏幕将类似于以下屏幕截图中的屏幕：\n\n![](Images/f79a1db4da53096fc8c9441b89d19095.png)\n\
    \n图 9.8：模型版本\n\n优良作法是，模型名称应简洁明了，因为您需要从多个名称列表中的日志或报告中选择它们。 简短的版本名称最适合维护。\n\n# 深入研究已保存的模型\n\
    \n您需要将合格的机器学习模型导出（或保存）为一个或多个对象，以便执行 Google Cloud AI Platform 预测。 本部分介绍了导出用于 AI\
    \ 系统预测部署的合格模型的各种方法。 根据您使用的机器学习平台的类型，Google Cloud AI 平台为您提供多种导出这些模型的方法。 这些方法特定于用于训练模型的框架。\
    \ 我们将在本节中介绍 TensorFlow 保存的模型的某些方面。 您必须首先以 TensorFlow SavedModel 的格式将训练有素的模型导出到\
    \ Google Cloud AI 平台，以支持预测。\n\n保存的 TensorFlow 模型实际上包含具有权重和计算的 TensorFlow 程序。 它不是指向用于构建模型的代码，而是指向使用派生的数学参数进行预测所需的代码。\
    \ TensorFlow 被称为 SavedModel，是在 Google Cloud AI 平台中部署经过训练的模型的推荐格式。 建议导出 TensorFlow\
    \ SavedModel。\n\n导出训练有素的 SavedModel 模型会将训练图保存为 Google Cloud AI Platform 特定的格式，可使用其元数据将其用于预测并还原。\
    \ SavedModel 提供了一种与语言无关的格式，用于保存可恢复且密封的机器学习模型。 它有助于更​​高级别的系统和资源生成，使用和处理 TensorFlow\
    \ 模型。 以下是 SavedModel 的一些重要功能：\n\n*   可以使用单个变量和资产将单个 SavedModel 添加到多个图。 每个图都连接到一组标签，以便在加载或还原时进行标识。\
    \ 图以协议缓冲区格式存储。\n\n*   SavedModel 支持 SignatureDef（协议缓冲区消息的技术名称）。 SavedModel 使用此功能为与图存储的签名提供支持。\
    \ 这些用于机器学习预测工作的图通常包含一堆数据输入和数据输出，称为签名。 签名具有以下结构：\n\n*   `inputs`：用于训练 TensorFlow\
    \ 模型的相应数据输入存储了字符串映射列表。\n\n*   `outputs`：用于训练 TensorFlow 模型的相应数据输出存储了字符串映射列表。\n\
    \n*   `method_name`：在 TensorFlow 框架中使用的受支持的命名方法。\n\n*   SavedModel 也支持资产。 如果操作依赖于外部初始化文件（例如词汇表），则\
    \ SavedModel 将使用资产。 资产被复制到 SavedModel 目录，并在加载特定的元图定义时读取。\n\n*   在生成 SavedModel\
    \ 之前，它支持清除设备。\n\n如上一节所述，尽管 SavedModels 支持某些重要功能，但不支持其他功能。 这些如下：\n\n*   它不支持隐式版本控制。\n\
    \n*   它本身不支持垃圾收集。 使用这些模型的外部工具可能对此提供支持。\n\n*   它不支持对 TensorFlow SavedModels 的原子写入。\n\
    \nSavedModel 目录具有以下结构：\n\n```\nassets/\nassets.extra/\nvariables/\n    variables.data-?????-of-?????\n\
    \    variables.index\nsaved_model.pb\n```\n\n`saved_model.pb`或`saved_model.pbtxt`文件是协议缓冲区文件，其中包括所有图定义作为\
    \ MetaGraphDef 协议缓冲区消息。 `assets`子文件夹包含支持的辅助文件，例如文本词汇文件。 `assets.extra`子文件夹包含可以与模型共存的用户添加的资产，但是不会在运行时加载。\
    \ 用户或最终开发人员必须自己管理它，因为 TensorFlow 库不管理它。 `variables`子文件夹包含 TensorFlow 库 TensorFlow\
    \ 保护程序的输出。\n\n# TensorFlow SavedModel 中的 SignatureDef\n\nSignatureDef 确定 TensorFlow\
    \ 图辅助计算的签名。 SignatureDefs 旨在为定义函数的输入和输出提供通用支持。 TF-Exporter 和 SessionBundle 使用的签名在概念上相似，但是允许用户区分命名签名和默认签名，以便在加载时可以正确检索它们。\
    \ 对于以前使用 TF-Exporter / SessionBundle 的用户，TF-Exporter 中的签名将由 SavedModel 中的 SignatureDefs\
    \ 替换。 TensorFlow Serving 提供高级 API 进行演绎。 要允许这些 API，模型应包含一个或多个 SignatureDef，它们描述了用于输入和输出的确切\
    \ TensorFlow 节点。 请参阅以下针对每个 API 支持 TensorFlow Serving 的 SignatureDef 示例。\n\n分类\
    \ SignatureDefs 支持对 TensorFlow Serving 的分类 API 的标准化调用。 这些指定应该有一个 Tensor 输入，并且有两个可能的\
    \ Tensor 输出：类和等级，至少需要存在一个。 以下屏幕快照显示了分类 SignatureDefs 的结构：\n\n![](Images/6984b3c04cb3a00ec10b9762cb4c6437.png)\n\
    \n图 9.9：分类消息 API 有效负载\n\n预测 SignatureDefs 支持对 TensorFlow Serving 的 Predict API\
    \ 的调用。 这样的签名使您可以任意支持多个输入和输出张量。 对于以下示例，我的预测签名具有特定的逻辑张量图像，该图像在您的图`x:0`中映射到实际张量。\
    \ 预测 SignatureDefs 允许模型到模型的可移植性。 这意味着您可以在不同的 SavedModels 中处理不同的基础 Tensor 名称（例如，您可能具有张量`Z:0`而不是`x:0`的替代模型），因此您的客户将继续在网络上测试新旧模型，而不会改变客户方面。\
    \ 预测 SignatureDefs 允许您向输出中添加其他张量，您可以显式请求这些张量。 假设除了`scores`下面的输出键之外，您还希望获取堆层用于调试或其他目的。\
    \ 在这种情况下，只需添加带有池密钥和适当值的附加张量即可。 以下屏幕截图显示了预测 SignatureDefs 的结构：\n\n![](Images/51866040f1198093da6de6f3a1aa3925.png)\n\
    \n图 9.10：分类 API 响应\n\n回归 SignatureDefs 支持对 TensorFlow 服务回归 API 的结构化调用，该 API 恰好需要一个张量输入和一个张量输出。\
    \ 以下屏幕截图显示了回归 SignatureDefs 的结构：\n\n![](Images/2a375d8319eb435228c52c54afe9db52.png)\n\
    \n图 9.11：回归 SignatureDef 的结构\n\n# TensorFlow SavedModel API\n\n如下图所示，TensorFlow\
    \ SavedModel 有两个主要的 API。 一个是 Builder API，另一个是 Loader API。 一旦 Loader API 加载了 SavedModel，它将用于预测：\n\
    \n![](Images/7d7266e8b40a964f1aee736c33429803.png)\n\n图 9.12：Tensorflow SavedModel\
    \ API\n\n`SavedModelBuilder`类提供了多个要保存的元图定义，相关变量和属性。 必须使用变量保存第一个元图，以便构建 SavedModel。\
    \ 以下元图及其图说明易于保存。 当必须保存属性并将其写入或复制到磁盘时，可以在插入元语法定义时提供属性。 如果将多个元图定义连接到同名资产，则仅保留第一个版本。\
    \ 每个 SavedModel 元图必须用反映元图功能和特定于案例的用户标签的标签标注。\n\n这样的标签通常包括带有其属性（例如，服务或训练）以及可能的硬件特定方面（例如\
    \ GPU）的元图。 SavedModel 中的定义元图的标记集与 Loader API 中的标记集完全匹配，是加载程序加载的图元。 如果没有定义元图与列出的标签匹配，将返回错误。\
    \ 例如，需要 GPU 服务的加载程序可以通过在`tensorflow::LoadSavedModel(...)`中指定标签来仅加载带有`tags=serve`（GPU）标注的元图。\
    \ 以下屏幕快照中的代码表示如何使用 Builder API：\n\n![](Images/b95d77a0617e05559e632825e39ee3b0.png)\n\
    \n图 9.13：API Builder 代码\n\n使用 SavedModelBuilder 包，用户可以测试在添加 SavedModel 包元图时是否必须从\
    \ NodeDefs 中删除默认评估的属性。 `SavedModelBuilder.add`元语法和变量以及`SavedModelbuilder.add`元图都接受控制此行为的带状默认属性`boolean`标志。\
    \ 通过将条带默认属性设置为`True`，模型创建者可以删除 NodeDefs 中任何具有值的默认属性。 这有助于确保具有默认值的新属性不会导致较旧的模型使用者无法加载已使用新训练二进制文件重新生成的模型。\n\
    \n加载程序 API 用 C++ 和 Python 实现。 Python 的 SavedModel 加载程序版本包含 SavedModel 加载和还原功能。\
    \ 加载功能包括用于恢复图形描述和变量的会话，用于定义默认加载元图的标签以及 SavedModel 的位置。 特定元图定义中提供的变量和资产的子集将还原到加载时提供的会话。\
    \ 加载程序 API 的代表性 Python 代码如下所示：\n\n![](Images/d405046d4aa7e5121ec9d54114bf8578.png)\n\
    \n图 9.14：API 加载程序代码\n\nC++ 的 SavedModel 加载器版本提供了一个 API，用于从路径加载 SavedModel，允许使用`SessionOptions`和`RunOptions`。\
    \ 与 Python 版本相比，C++ 版本需要加载和定义与图关联的标签。 加载的此版本 SavedModel 称为 SavedModelBundle，其中包括定义元图和加载会话。\
    \ Loader API 的代表性 C++ 代码如下所示：\n\n![](Images/a0e57efb7d7f4cbe1d299e81ce045894.png)\n\
    \n图 9.15：Loader API 代码的 C++ 实现\n\nSavedModel 为构建和加载用于各种应用的 TensorFlow 图提供了灵活性。\
    \ SavedModel API 提供了许多 Python 和 C++ 常量，这些常量易于使用，并且在针对最常见的预期应用的工具之间始终保持共享。\n\n\
    # 在 GCP 上部署模型"
  fmt: "\n# 在 GCP 上使用预测的步骤\n\n![](Images/c8293a3c5dd5ea5ee16d7b1a40ee7cfa.png)\n\n\
    图 9.1：在 GCP 上使用预测的步骤\n\n## 导出模型\n\n开始预测过程的第一步是在完成模型训练后将模型导出为工件。您需要将合格的机器学习模型导出为一个或多个工件，以实现来自\
    \ Google Cloud AI 平台的预测。本章将说明如何在 GCP 上导出合格的 AI 系统预测模型。根据用于构建模型的机器学习框架的类型，有多种选项可以导出模型。例如，如果您已使用\
    \ TensorFlow 训练机器学习模型，则可以先使用 `tf.save_model` API 保存模型，然后再使用 Google Cloud AI Platform\
    \ 导出模型。\n\n## 部署模型\n\n下一步是部署模型。Google Cloud AI 平台将托管模型，为您提供云预测。模型部署是用于托管已保存模型文件的方法。云预测供应商可以处理您的模型基础架构，并可以接受在线和批量预测的请求。模型部署是预测过程中最重要的方面，必须对其进行详细了解。在下一部分中，我们将详细介绍模型部署方面。\n\
    \n## 批量预测\n\n部署模型后，就可以将模型用于在线预测或批量预测。如果您想一次为一组观测值生成预测，然后对一定数量或一定百分比的观测值采取行动，则批量预测很有用。通常，对于这样的请求，您没有低延迟要求。这些预测然后存储在数据库中，开发人员或最终用户可以访问。批量推断有时可以使用大数据技术（例如\
    \ `Spark`）来生成预测。\n\n批量推理技术规范比在线推理更简单。例如，数据科学家可以简单地在执行批量推断的机器上反序列化经过训练的模型，而无需通过\
    \ `REST` API 公开经过训练的模型。批量推断期间所做的预测也可以在最终利益相关者看到之前进行分析和处理。下图显示了批量预测的工作原理：\n\n![](Images/cf91ab5624462a058fbefc0bcbfee2d8.png)\n\
    \n图 9.2：批量预测\n\n## 在线预测\n\n在线预测是根据请求实时创建用于机器学习的预测的方法。这也称为实时或动态推理。这些预测通常由运行时的单个数据观察生成。在线推论预测可以在一天中的任何时间产生。在线推论使我们能够实时使用机器模型。它开辟了一个可以利用机器学习的全新技术领域。无需等待数小时或数天的批量预测，我们可以在需要时立即生成预测，并立即提供服务。\n\
    \n在线推论还有助于我们快速分析新数据，而不会产生延迟。通常，在线推理比批量推理更具挑战性。由于添加了满足延迟要求所需的工具和系统，因此在线推理往往更加复杂。与需要\
    \ 24 小时 `SLA` 的系统相比，需要在几毫秒内执行预测的程序要困难得多。下图显示了在线预测的工作方式：\n\n![](Images/b9498fed2090b00fe2497d17cd9ea05c.png)\n\
    \n图 9.3：在线预测\n\n## 批量预测与在线预测的区别\n\n如果使用简单模型和少量输入案例，则完成在线预测和针对类似预防请求的批量分析所花费的时间将大大不同。完成在线应用几乎立即返回的预测可能需要很长时间。两种预测方法中使用的特定基础结构都有副作用。提交订单后，AI\
    \ 平台将分配并初始化批量预测资源。通常，可以根据要求准备在线预测。下表总结了在线预测和批量预测之间的区别。\n\n| 批量预测 | 在线预测 |\n| ---\
    \ | --- |\n| 适用于具有复杂计算要求的海量大数据量。 | 适用于一次记录，具有低延迟和较简单的模型。 |\n| 输出是具有多个预测结果的文件格式。\
    \ | 输出一次是一个响应，大多数为 JSON 格式。 |\n| 异步请求和响应。 | 同步实时请求和响应。 |\n| 它可以使用存储在某些外部存储（例如\
    \ Google Cloud 存储桶）中的模型，也可以使用通过 Google Cloud AI 平台进行部署的模型。 | 它只能使用通过 Google Cloud\
    \ AI 平台部署的模型。 |\n| 仅当使用通过 Google Cloud AI 平台部署的模型时，才对某些实例类型进行有限使用。 | 可以使用不同类型的计算实例进行运行预测。\
    \ |\n\n# 维护模型及其版本\n\nGoogle Cloud AI 平台可让您将机器学习解决方案组织为模型和版本。模型是为您的机器学习解决方案提供的名称，该版本唯一地将部署的模型标识为工件。例如，您可以创建一个名为\
    \ `ProductCategoryIdentification` 的模型，该模型表示用于对产品进行分类的机器学习解决方案。在机器学习中，模型是要解决的问题的解决方案。\n\
    \n换句话说，这是预测数据值的方法。模型是 Google Cloud AI 平台上此 AI/机器学习解决方案的每次迭代的概念容器。例如，要解决的问题是在给定与先前销售相关的一组数据的情况下，预测房屋的销售价格。您构建一个称为房屋价格的\
    \ AI 应用模型，并尝试通过几种机器学习技术来解决问题。您可以在每个级别上部署该模型的版本。该版本可以与其他版本完全不同，但是如果适合您的工作流程，则可以将其布置在同一模型下。\n\
    \n## 创建模型\n\n以下屏幕快照表示如何在 Google Cloud AI 平台上创建模型：\n\n![](Images/aaa2e89834abe9006633d31b0282aa64.png)\n\
    \n图 9.4：创建新模型\n\n如您所见，模型创建用户界面与用户熟悉的 GCP 上的其他服务一致。我们需要提供区分大小写的模型名称和区域作为强制属性。建议提供可选描述，以提高模型的可维护性。当我们针对各种用例构建和部署大量模型时，这一点尤为重要。以下屏幕快照显示了平台上可通过用户界面或\
    \ API 使用的模型的列表：\n\n![](Images/e076a29dc6d393474d87ad8ba1e58cf8.png)\n\n图 9.5：模型清单\n\
    \n## 管理版本\n\n现在，在创建模型之后，您可以创建它的版本。一个版本表示用来训练模型的机器学习代码和框架。有时，数据科学家使用不同的框架（例如 `XGBoost`\
    \ 或 `TensorFlow`）来设计针对同一问题的解决方案。他们创建不同的版本来识别工件。因此，模型版本或仅一个版本是存储在 AI 平台模型服务中的机器学习解决方案的实例。您可以通过将经过训练的串行模型（作为保存的模型）传输到服务来制作版本。您还可以提供自定义代码（在撰写本文时仍处于\
    \ beta 阶段），以在制作版本时管理预测。\n\n至少具有一个版本的每个模型都有一个默认版本。生成第一个版本时，将设置默认值。如果您请求仅指定模型名称的预测，则\
    \ AI 平台将使用该模型的默认版本。\n\n以下屏幕截图显示了如何管理版本：\n\n![](Images/517b5d7d93bdf74e10128d7d71f7d20d.png)\n\
    \n图 9.6：创建模型版本\n\n## 命名规则\n\n命名模型和版本的一些规则如下：\n\n* 名称应仅包含字母（大小写混合）、数字和下划线。\n* 名称应以字母开头。\n\
    * 名称最多可包含 128 个字符。\n* 该名称在项目中应该是唯一的（如果它是模型名称），在模型中应该是唯一的（如果它是版本名称）。\n\n## 自定义代码和包\n\
    \n您还可以添加自定义内置代码所需的自定义包，如以下屏幕截图所示：\n\n![](Images/70ba2b6275e0c0aad522f6805af91d6b.png)\n\
    \n图 9.7：添加自定义代码和包\n\n最终的输出屏幕将类似于以下屏幕截图中的屏幕：\n\n![](Images/f79a1db4da53096fc8c9441b89d19095.png)\n\
    \n图 9.8：模型版本\n\n优良作法是，模型名称应简洁明了，因为您需要从多个名称列表中的日志或报告中选择它们。简短的版本名称最适合维护。\n\n# 深入研究已保存的模型\n\
    \n## TensorFlow SavedModel 格式\n\n您需要将合格的机器学习模型导出（或保存）为一个或多个对象，以便执行 Google Cloud\
    \ AI Platform 预测。本部分介绍了导出用于 AI 系统预测部署的合格模型的各种方法。根据您使用的机器学习平台的类型，Google Cloud AI\
    \ 平台为您提供多种导出这些模型的方法。这些方法特定于用于训练模型的框架。我们将在本节中介绍 `TensorFlow` 保存的模型的某些方面。您必须首先以\
    \ `TensorFlow SavedModel` 的格式将训练有素的模型导出到 Google Cloud AI 平台，以支持预测。\n\n保存的 `TensorFlow`\
    \ 模型实际上包含具有权重和计算的 `TensorFlow` 程序。它不是指向用于构建模型的代码，而是指向使用派生的数学参数进行预测所需的代码。`TensorFlow`\
    \ 被称为 `SavedModel`，是在 Google Cloud AI 平台中部署经过训练的模型的推荐格式。建议导出 `TensorFlow SavedModel`。\n\
    \n导出训练有素的 `SavedModel` 模型会将训练图保存为 Google Cloud AI Platform 特定的格式，可使用其元数据将其用于预测并还原。`SavedModel`\
    \ 提供了一种与语言无关的格式，用于保存可恢复且密封的机器学习模型。它有助于更高级别的系统和资源生成、使用和处理 `TensorFlow` 模型。以下是 `SavedModel`\
    \ 的一些重要功能：\n\n* 可以使用单个变量和资产将单个 `SavedModel` 添加到多个图。每个图都连接到一组标签，以便在加载或还原时进行标识。图以协议缓冲区格式存储。\n\
    * `SavedModel` 支持 `SignatureDef`（协议缓冲区消息的技术名称）。`SavedModel` 使用此功能为与图存储的签名提供支持。这些用于机器学习预测工作的图通常包含一堆数据输入和数据输出，称为签名。签名具有以下结构：\n\
    \  * `inputs`：用于训练 `TensorFlow` 模型的相应数据输入存储了字符串映射列表。\n  * `outputs`：用于训练 `TensorFlow`\
    \ 模型的相应数据输出存储了字符串映射列表。\n  * `method_name`：在 `TensorFlow` 框架中使用的受支持的命名方法。\n* `SavedModel`\
    \ 也支持资产。如果操作依赖于外部初始化文件（例如词汇表），则 `SavedModel` 将使用资产。资产被复制到 `SavedModel` 目录，并在加载特定的元图定义时读取。\n\
    * 在生成 `SavedModel` 之前，它支持清除设备。\n\n如上一节所述，尽管 `SavedModels` 支持某些重要功能，但不支持其他功能。这些如下：\n\
    \n* 它不支持隐式版本控制。\n* 它本身不支持垃圾收集。使用这些模型的外部工具可能对此提供支持。\n* 它不支持对 `TensorFlow SavedModels`\
    \ 的原子写入。\n\n## SavedModel 目录结构\n\n`SavedModel` 目录具有以下结构：\n\n```\nassets/\nassets.extra/\n\
    variables/\n    variables.data-?????-of-?????\n    variables.index\nsaved_model.pb\n\
    ```\n\n`saved_model.pb` 或 `saved_model.pbtxt` 文件是协议缓冲区文件，其中包括所有图定义作为 `MetaGraphDef`\
    \ 协议缓冲区消息。`assets` 子文件夹包含支持的辅助文件，例如文本词汇文件。`assets.extra` 子文件夹包含可以与模型共存的用户添加的资产，但是不会在运行时加载。用户或最终开发人员必须自己管理它，因为\
    \ `TensorFlow` 库不管理它。`variables` 子文件夹包含 `TensorFlow` 库 `TensorFlow` 保护程序的输出。\n\
    \n# TensorFlow SavedModel 中的 SignatureDef\n\n`SignatureDef` 确定 `TensorFlow` 图辅助计算的签名。`SignatureDefs`\
    \ 旨在为定义函数的输入和输出提供通用支持。`TF-Exporter` 和 `SessionBundle` 使用的签名在概念上相似，但是允许用户区分命名签名和默认签名，以便在加载时可以正确检索它们。对于以前使用\
    \ `TF-Exporter` / `SessionBundle` 的用户，`TF-Exporter` 中的签名将由 `SavedModel` 中的 `SignatureDefs`\
    \ 替换。`TensorFlow Serving` 提供高级 API 进行演绎。要允许这些 API，模型应包含一个或多个 `SignatureDef`，它们描述了用于输入和输出的确切\
    \ `TensorFlow` 节点。请参阅以下针对每个 API 支持 `TensorFlow Serving` 的 `SignatureDef` 示例。\n\
    \n## 分类 SignatureDefs\n\n分类 `SignatureDefs` 支持对 `TensorFlow Serving` 的分类 API 的标准化调用。这些指定应该有一个\
    \ Tensor 输入，并且有两个可能的 Tensor 输出：类和等级，至少需要存在一个。以下屏幕快照显示了分类 `SignatureDefs` 的结构：\n\
    \n![](Images/6984b3c04cb3a00ec10b9762cb4c6437.png)\n\n图 9.9：分类消息 API 有效负载\n\n\
    ## 预测 SignatureDefs\n\n预测 `SignatureDefs` 支持对 `TensorFlow Serving` 的 Predict API\
    \ 的调用。这样的签名使您可以任意支持多个输入和输出张量。对于以下示例，我的预测签名具有特定的逻辑张量图像，该图像在您的图 `x:0` 中映射到实际张量。预测\
    \ `SignatureDefs` 允许模型到模型的可移植性。这意味着您可以在不同的 `SavedModels` 中处理不同的基础 Tensor 名称（例如，您可能具有张量\
    \ `Z:0` 而不是 `x:0` 的替代模型），因此您的客户将继续在网络上测试新旧模型，而不会改变客户方面。预测 `SignatureDefs` 允许您向输出中添加其他张量，您可以显式请求这些张量。假设除了\
    \ `scores` 下面的输出键之外，您还希望获取堆层用于调试或其他目的。在这种情况下，只需添加带有池密钥和适当值的附加张量即可。以下屏幕截图显示了预测\
    \ `SignatureDefs` 的结构：\n\n![](Images/51866040f1198093da6de6f3a1aa3925.png)\n\n\
    图 9.10：分类 API 响应\n\n## 回归 SignatureDefs\n\n回归 `SignatureDefs` 支持对 `TensorFlow`\
    \ 服务回归 API 的结构化调用，该 API 恰好需要一个张量输入和一个张量输出。以下屏幕截图显示了回归 `SignatureDefs` 的结构：\n\n\
    ![](Images/2a375d8319eb435228c52c54afe9db52.png)\n\n图 9.11：回归 SignatureDef 的结构\n\
    \n# TensorFlow SavedModel API\n\n如下图所示，`TensorFlow SavedModel` 有两个主要的 API。一个是\
    \ Builder API，另一个是 Loader API。一旦 Loader API 加载了 `SavedModel`，它将用于预测：\n\n![](Images/7d7266e8b40a964f1aee736c33429803.png)\n\
    \n图 9.12：Tensorflow SavedModel API\n\n## Builder API\n\n`SavedModelBuilder` 类提供了多个要保存的元图定义、相关变量和属性。必须使用变量保存第一个元图，以便构建\
    \ `SavedModel`。以下元图及其图说明易于保存。当必须保存属性并将其写入或复制到磁盘时，可以在插入元语法定义时提供属性。如果将多个元图定义连接到同名资产，则仅保留第一个版本。每个\
    \ `SavedModel` 元图必须用反映元图功能和特定于案例的用户标签的标签标注。\n\n这样的标签通常包括带有其属性（例如，服务或训练）以及可能的硬件特定方面（例如\
    \ `GPU`）的元图。`SavedModel` 中的定义元图的标记集与 Loader API 中的标记集完全匹配，是加载程序加载的图元。如果没有定义元图与列出的标签匹配，将返回错误。例如，需要\
    \ `GPU` 服务的加载程序可以通过在 `tensorflow::LoadSavedModel(...)` 中指定标签来仅加载带有 `tags=serve`（`GPU`）标注的元图。以下屏幕快照中的代码表示如何使用\
    \ Builder API：\n\n![](Images/b95d77a0617e05559e632825e39ee3b0.png)\n\n图 9.13：API\
    \ Builder 代码\n\n使用 `SavedModelBuilder` 包，用户可以测试在添加 `SavedModel` 包元图时是否必须从 `NodeDefs`\
    \ 中删除默认评估的属性。`SavedModelBuilder.add` 元语法和变量以及 `SavedModelbuilder.add` 元图都接受控制此行为的带状默认属性\
    \ `boolean` 标志。通过将条带默认属性设置为 `True`，模型创建者可以删除 `NodeDefs` 中任何具有值的默认属性。这有助于确保具有默认值的新属性不会导致较旧的模型使用者无法加载已使用新训练二进制文件重新生成的模型。\n\
    \n## Loader API\n\n加载程序 API 用 C++ 和 Python 实现。Python 的 `SavedModel` 加载程序版本包含 `SavedModel`\
    \ 加载和还原功能。加载功能包括用于恢复图形描述和变量的会话、用于定义默认加载元图的标签以及 `SavedModel` 的位置。特定元图定义中提供的变量和资产的子集将还原到加载时提供的会话。加载程序\
    \ API 的代表性 Python 代码如下所示：\n\n![](Images/d405046d4aa7e5121ec9d54114bf8578.png)\n\
    \n图 9.14：API 加载程序代码\n\nC++ 的 `SavedModel` 加载器版本提供了一个 API，用于从路径加载 `SavedModel`，允许使用\
    \ `SessionOptions` 和 `RunOptions`。与 Python 版本相比，C++ 版本需要加载和定义与图关联的标签。加载的此版本 `SavedModel`\
    \ 称为 `SavedModelBundle`，其中包括定义元图和加载会话。Loader API 的代表性 C++ 代码如下所示：\n\n![](Images/a0e57efb7d7f4cbe1d299e81ce045894.png)\n\
    \n图 9.15：Loader API 代码的 C++ 实现\n\n`SavedModel` 为构建和加载用于各种应用的 `TensorFlow` 图提供了灵活性。`SavedModel`\
    \ API 提供了许多 Python 和 C++ 常量，这些常量易于使用，并且在针对最常见的预期应用的工具之间始终保持共享。\n\n# 在 GCP 上部署模型\n"
  trans: "\n# 在 GCP 上使用预测的步骤\n\n![](img/c8293a3c5dd5ea5ee16d7b1a40ee7cfa.png)\n\n\
    图 9.1：在 GCP 上使用预测的步骤\n\n## 导出模型\n\n开始预测过程的第一步是在完成模型训练后将模型导出为工件。您需要将合格的机器学习模型导出为一个或多个工件，以实现来自\
    \ Google Cloud AI 平台的预测。本章将说明如何在 GCP 上导出合格的 AI 系统预测模型。根据用于构建模型的机器学习框架的类型，有多种选项可以导出模型。例如，如果您已使用\
    \ TensorFlow 训练机器学习模型，则可以先使用 `tf.save_model` API 保存模型，然后再使用 Google Cloud AI Platform\
    \ 导出模型。\n\n## 部署模型\n\n下一步是部署模型。Google Cloud AI 平台将托管模型，为您提供云预测。模型部署是用于托管已保存模型文件的方法。云预测供应商可以处理您的模型基础架构，并可以接受在线和批量预测的请求。模型部署是预测过程中最重要的方面，必须对其进行详细了解。在下一部分中，我们将详细介绍模型部署方面。\n\
    \n## 批量预测\n\n部署模型后，就可以将模型用于在线预测或批量预测。如果您想一次为一组观测值生成预测，然后对一定数量或一定百分比的观测值采取行动，则批量预测很有用。通常，对于这样的请求，您没有低延迟要求。这些预测然后存储在数据库中，开发人员或最终用户可以访问。批量推断有时可以使用大数据技术（例如\
    \ `Spark`）来生成预测。\n\n批量推理技术规范比在线推理更简单。例如，数据科学家可以简单地在执行批量推断的机器上反序列化经过训练的模型，而无需通过\
    \ `REST` API 公开经过训练的模型。批量推断期间所做的预测也可以在最终利益相关者看到之前进行分析和处理。下图显示了批量预测的工作原理：\n\n![](img/cf91ab5624462a058fbefc0bcbfee2d8.png)\n\
    \n图 9.2：批量预测\n\n## 在线预测\n\n在线预测是根据请求实时创建用于机器学习的预测的方法。这也称为实时或动态推理。这些预测通常由运行时的单个数据观察生成。在线推论预测可以在一天中的任何时间产生。在线推论使我们能够实时使用机器模型。它开辟了一个可以利用机器学习的全新技术领域。无需等待数小时或数天的批量预测，我们可以在需要时立即生成预测，并立即提供服务。\n\
    \n在线推论还有助于我们快速分析新数据，而不会产生延迟。通常，在线推理比批量推理更具挑战性。由于添加了满足延迟要求所需的工具和系统，因此在线推理往往更加复杂。与需要\
    \ 24 小时 `SLA` 的系统相比，需要在几毫秒内执行预测的程序要困难得多。下图显示了在线预测的工作方式：\n\n![](img/b9498fed2090b00fe2497d17cd9ea05c.png)\n\
    \n图 9.3：在线预测\n\n## 批量预测与在线预测的区别\n\n如果使用简单模型和少量输入案例，则完成在线预测和针对类似预防请求的批量分析所花费的时间将大大不同。完成在线应用几乎立即返回的预测可能需要很长时间。两种预测方法中使用的特定基础结构都有副作用。提交订单后，AI\
    \ 平台将分配并初始化批量预测资源。通常，可以根据要求准备在线预测。下表总结了在线预测和批量预测之间的区别。\n\n| 批量预测 | 在线预测 |\n| ---\
    \ | --- |\n| 适用于具有复杂计算要求的海量大数据量。 | 适用于一次记录，具有低延迟和较简单的模型。 |\n| 输出是具有多个预测结果的文件格式。\
    \ | 输出一次是一个响应，大多数为 JSON 格式。 |\n| 异步请求和响应。 | 同步实时请求和响应。 |\n| 它可以使用存储在某些外部存储（例如\
    \ Google Cloud 存储桶）中的模型，也可以使用通过 Google Cloud AI 平台进行部署的模型。 | 它只能使用通过 Google Cloud\
    \ AI 平台部署的模型。 |\n| 仅当使用通过 Google Cloud AI 平台部署的模型时，才对某些实例类型进行有限使用。 | 可以使用不同类型的计算实例进行运行预测。\
    \ |\n\n# 维护模型及其版本\n\nGoogle Cloud AI 平台可让您将机器学习解决方案组织为模型和版本。模型是为您的机器学习解决方案提供的名称，该版本唯一地将部署的模型标识为工件。例如，您可以创建一个名为\
    \ `ProductCategoryIdentification` 的模型，该模型表示用于对产品进行分类的机器学习解决方案。在机器学习中，模型是要解决的问题的解决方案。\n\
    \n换句话说，这是预测数据值的方法。模型是 Google Cloud AI 平台上此 AI/机器学习解决方案的每次迭代的概念容器。例如，要解决的问题是在给定与先前销售相关的一组数据的情况下，预测房屋的销售价格。您构建一个称为房屋价格的\
    \ AI 应用模型，并尝试通过几种机器学习技术来解决问题。您可以在每个级别上部署该模型的版本。该版本可以与其他版本完全不同，但是如果适合您的工作流程，则可以将其布置在同一模型下。\n\
    \n## 创建模型\n\n以下屏幕快照表示如何在 Google Cloud AI 平台上创建模型：\n\n![](img/aaa2e89834abe9006633d31b0282aa64.png)\n\
    \n图 9.4：创建新模型\n\n如您所见，模型创建用户界面与用户熟悉的 GCP 上的其他服务一致。我们需要提供区分大小写的模型名称和区域作为强制属性。建议提供可选描述，以提高模型的可维护性。当我们针对各种用例构建和部署大量模型时，这一点尤为重要。以下屏幕快照显示了平台上可通过用户界面或\
    \ API 使用的模型的列表：\n\n![](img/e076a29dc6d393474d87ad8ba1e58cf8.png)\n\n图 9.5：模型清单\n\
    \n## 管理版本\n\n现在，在创建模型之后，您可以创建它的版本。一个版本表示用来训练模型的机器学习代码和框架。有时，数据科学家使用不同的框架（例如 `XGBoost`\
    \ 或 `TensorFlow`）来设计针对同一问题的解决方案。他们创建不同的版本来识别工件。因此，模型版本或仅一个版本是存储在 AI 平台模型服务中的机器学习解决方案的实例。您可以通过将经过训练的串行模型（作为保存的模型）传输到服务来制作版本。您还可以提供自定义代码（在撰写本文时仍处于\
    \ beta 阶段），以在制作版本时管理预测。\n\n至少具有一个版本的每个模型都有一个默认版本。生成第一个版本时，将设置默认值。如果您请求仅指定模型名称的预测，则\
    \ AI 平台将使用该模型的默认版本。\n\n以下屏幕截图显示了如何管理版本：\n\n![](img/517b5d7d93bdf74e10128d7d71f7d20d.png)\n\
    \n图 9.6：创建模型版本\n\n## 命名规则\n\n命名模型和版本的一些规则如下：\n\n* 名称应仅包含字母（大小写混合）、数字和下划线。\n* 名称应以字母开头。\n\
    * 名称最多可包含 128 个字符。\n* 该名称在项目中应该是唯一的（如果它是模型名称），在模型中应该是唯一的（如果它是版本名称）。\n\n## 自定义代码和包\n\
    \n您还可以添加自定义内置代码所需的自定义包，如以下屏幕截图所示：\n\n![](img/70ba2b6275e0c0aad522f6805af91d6b.png)\n\
    \n图 9.7：添加自定义代码和包\n\n最终的输出屏幕将类似于以下屏幕截图中的屏幕：\n\n![](img/f79a1db4da53096fc8c9441b89d19095.png)\n\
    \n图 9.8：模型版本\n\n优良作法是，模型名称应简洁明了，因为您需要从多个名称列表中的日志或报告中选择它们。简短的版本名称最适合维护。\n\n# 深入研究已保存的模型\n\
    \n## TensorFlow SavedModel 格式\n\n您需要将合格的机器学习模型导出（或保存）为一个或多个对象，以便执行 Google Cloud\
    \ AI Platform 预测。本部分介绍了导出用于 AI 系统预测部署的合格模型的各种方法。根据您使用的机器学习平台的类型，Google Cloud AI\
    \ 平台为您提供多种导出这些模型的方法。这些方法特定于用于训练模型的框架。我们将在本节中介绍 `TensorFlow` 保存的模型的某些方面。您必须首先以\
    \ `TensorFlow SavedModel` 的格式将训练有素的模型导出到 Google Cloud AI 平台，以支持预测。\n\n保存的 `TensorFlow`\
    \ 模型实际上包含具有权重和计算的 `TensorFlow` 程序。它不是指向用于构建模型的代码，而是指向使用派生的数学参数进行预测所需的代码。`TensorFlow`\
    \ 被称为 `SavedModel`，是在 Google Cloud AI 平台中部署经过训练的模型的推荐格式。建议导出 `TensorFlow SavedModel`。\n\
    \n导出训练有素的 `SavedModel` 模型会将训练图保存为 Google Cloud AI Platform 特定的格式，可使用其元数据将其用于预测并还原。`SavedModel`\
    \ 提供了一种与语言无关的格式，用于保存可恢复且密封的机器学习模型。它有助于更高级别的系统和资源生成、使用和处理 `TensorFlow` 模型。以下是 `SavedModel`\
    \ 的一些重要功能：\n\n* 可以使用单个变量和资产将单个 `SavedModel` 添加到多个图。每个图都连接到一组标签，以便在加载或还原时进行标识。图以协议缓冲区格式存储。\n\
    * `SavedModel` 支持 `SignatureDef`（协议缓冲区消息的技术名称）。`SavedModel` 使用此功能为与图存储的签名提供支持。这些用于机器学习预测工作的图通常包含一堆数据输入和数据输出，称为签名。签名具有以下结构：\n\
    \  * `inputs`：用于训练 `TensorFlow` 模型的相应数据输入存储了字符串映射列表。\n  * `outputs`：用于训练 `TensorFlow`\
    \ 模型的相应数据输出存储了字符串映射列表。\n  * `method_name`：在 `TensorFlow` 框架中使用的受支持的命名方法。\n* `SavedModel`\
    \ 也支持资产。如果操作依赖于外部初始化文件（例如词汇表），则 `SavedModel` 将使用资产。资产被复制到 `SavedModel` 目录，并在加载特定的元图定义时读取。\n\
    * 在生成 `SavedModel` 之前，它支持清除设备。\n\n如上一节所述，尽管 `SavedModels` 支持某些重要功能，但不支持其他功能。这些如下：\n\
    \n* 它不支持隐式版本控制。\n* 它本身不支持垃圾收集。使用这些模型的外部工具可能对此提供支持。\n* 它不支持对 `TensorFlow SavedModels`\
    \ 的原子写入。\n\n## SavedModel 目录结构\n\n`SavedModel` 目录具有以下结构：\n\n```\nassets/\nassets.extra/\n\
    variables/\n    variables.data-?????-of-?????\n    variables.index\nsaved_model.pb\n\
    ```\n\n`saved_model.pb` 或 `saved_model.pbtxt` 文件是协议缓冲区文件，其中包括所有图定义作为 `MetaGraphDef`\
    \ 协议缓冲区消息。`assets` 子文件夹包含支持的辅助文件，例如文本词汇文件。`assets.extra` 子文件夹包含可以与模型共存的用户添加的资产，但是不会在运行时加载。用户或最终开发人员必须自己管理它，因为\
    \ `TensorFlow` 库不管理它。`variables` 子文件夹包含 `TensorFlow` 库 `TensorFlow` 保护程序的输出。\n\
    \n# TensorFlow SavedModel 中的 SignatureDef\n\n`SignatureDef` 确定 `TensorFlow` 图辅助计算的签名。`SignatureDefs`\
    \ 旨在为定义函数的输入和输出提供通用支持。`TF-Exporter` 和 `SessionBundle` 使用的签名在概念上相似，但是允许用户区分命名签名和默认签名，以便在加载时可以正确检索它们。对于以前使用\
    \ `TF-Exporter` / `SessionBundle` 的用户，`TF-Exporter` 中的签名将由 `SavedModel` 中的 `SignatureDefs`\
    \ 替换。`TensorFlow Serving` 提供高级 API 进行演绎。要允许这些 API，模型应包含一个或多个 `SignatureDef`，它们描述了用于输入和输出的确切\
    \ `TensorFlow` 节点。请参阅以下针对每个 API 支持 `TensorFlow Serving` 的 `SignatureDef` 示例。\n\
    \n## 分类 SignatureDefs\n\n分类 `SignatureDefs` 支持对 `TensorFlow Serving` 的分类 API 的标准化调用。这些指定应该有一个\
    \ Tensor 输入，并且有两个可能的 Tensor 输出：类和等级，至少需要存在一个。以下屏幕快照显示了分类 `SignatureDefs` 的结构：\n\
    \n![](img/6984b3c04cb3a00ec10b9762cb4c6437.png)\n\n图 9.9：分类消息 API 有效负载\n\n## 预测\
    \ SignatureDefs\n\n预测 `SignatureDefs` 支持对 `TensorFlow Serving` 的 Predict API 的调用。这样的签名使您可以任意支持多个输入和输出张量。对于以下示例，我的预测签名具有特定的逻辑张量图像，该图像在您的图\
    \ `x:0` 中映射到实际张量。预测 `SignatureDefs` 允许模型到模型的可移植性。这意味着您可以在不同的 `SavedModels` 中处理不同的基础\
    \ Tensor 名称（例如，您可能具有张量 `Z:0` 而不是 `x:0` 的替代模型），因此您的客户将继续在网络上测试新旧模型，而不会改变客户方面。预测\
    \ `SignatureDefs` 允许您向输出中添加其他张量，您可以显式请求这些张量。假设除了 `scores` 下面的输出键之外，您还希望获取堆层用于调试或其他目的。在这种情况下，只需添加带有池密钥和适当值的附加张量即可。以下屏幕截图显示了预测\
    \ `SignatureDefs` 的结构：\n\n![](img/51866040f1198093da6de6f3a1aa3925.png)\n\n图 9.10：分类\
    \ API 响应\n\n## 回归 SignatureDefs\n\n回归 `SignatureDefs` 支持对 `TensorFlow` 服务回归 API\
    \ 的结构化调用，该 API 恰好需要一个张量输入和一个张量输出。以下屏幕截图显示了回归 `SignatureDefs` 的结构：\n\n![](img/2a375d8319eb435228c52c54afe9db52.png)\n\
    \n图 9.11：回归 SignatureDef 的结构\n\n# TensorFlow SavedModel API\n\n如下图所示，`TensorFlow\
    \ SavedModel` 有两个主要的 API。一个是 Builder API，另一个是 Loader API。一旦 Loader API 加载了 `SavedModel`，它将用于预测：\n\
    \n![](img/7d7266e8b40a964f1aee736c33429803.png)\n\n图 9.12：Tensorflow SavedModel\
    \ API\n\n## Builder API\n\n`SavedModelBuilder` 类提供了多个要保存的元图定义、相关变量和属性。必须使用变量保存第一个元图，以便构建\
    \ `SavedModel`。以下元图及其图说明易于保存。当必须保存属性并将其写入或复制到磁盘时，可以在插入元语法定义时提供属性。如果将多个元图定义连接到同名资产，则仅保留第一个版本。每个\
    \ `SavedModel` 元图必须用反映元图功能和特定于案例的用户标签的标签标注。\n\n这样的标签通常包括带有其属性（例如，服务或训练）以及可能的硬件特定方面（例如\
    \ `GPU`）的元图。`SavedModel` 中的定义元图的标记集与 Loader API 中的标记集完全匹配，是加载程序加载的图元。如果没有定义元图与列出的标签匹配，将返回错误。例如，需要\
    \ `GPU` 服务的加载程序可以通过在 `tensorflow::LoadSavedModel(...)` 中指定标签来仅加载带有 `tags=serve`（`GPU`）标注的元图。以下屏幕快照中的代码表示如何使用\
    \ Builder API：\n\n![](img/b95d77a0617e05559e632825e39ee3b0.png)\n\n图 9.13：API\
    \ Builder 代码\n\n使用 `SavedModelBuilder` 包，用户可以测试在添加 `SavedModel` 包元图时是否必须从 `NodeDefs`\
    \ 中删除默认评估的属性。`SavedModelBuilder.add` 元语法和变量以及 `SavedModelbuilder.add` 元图都接受控制此行为的带状默认属性\
    \ `boolean` 标志。通过将条带默认属性设置为 `True`，模型创建者可以删除 `NodeDefs` 中任何具有值的默认属性。这有助于确保具有默认值的新属性不会导致较旧的模型使用者无法加载已使用新训练二进制文件重新生成的模型。\n\
    \n## Loader API\n\n加载程序 API 用 C++ 和 Python 实现。Python 的 `SavedModel` 加载程序版本包含 `SavedModel`\
    \ 加载和还原功能。加载功能包括用于恢复图形描述和变量的会话、用于定义默认加载元图的标签以及 `SavedModel` 的位置。特定元图定义中提供的变量和资产的子集将还原到加载时提供的会话。加载程序\
    \ API 的代表性 Python 代码如下所示：\n\n![](img/d405046d4aa7e5121ec9d54114bf8578.png)\n\n\
    图 9.14：API 加载程序代码\n\nC++ 的 `SavedModel` 加载器版本提供了一个 API，用于从路径加载 `SavedModel`，允许使用\
    \ `SessionOptions` 和 `RunOptions`。与 Python 版本相比，C++ 版本需要加载和定义与图关联的标签。加载的此版本 `SavedModel`\
    \ 称为 `SavedModelBundle`，其中包括定义元图和加载会话。Loader API 的代表性 C++ 代码如下所示：\n\n![](img/a0e57efb7d7f4cbe1d299e81ce045894.png)\n\
    \n图 9.15：Loader API 代码的 C++ 实现\n\n`SavedModel` 为构建和加载用于各种应用的 `TensorFlow` 图提供了灵活性。`SavedModel`\
    \ API 提供了许多 Python 和 C++ 常量，这些常量易于使用，并且在针对最常见的预期应用的工具之间始终保持共享。\n\n# 在 GCP 上部署模型\n"
