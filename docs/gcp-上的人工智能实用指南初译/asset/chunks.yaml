    \    图 10.5：用于创建存储桶的 `gsutil` 命令\n5.  创建 `aigcp` 存储桶以存储发票 PDF 文件，并使用 `aigcp-text`\
    \ 存储桶存储转录的文本文件（JSON 格式）。\n6.  将发票 PDF 文件复制到 `aigcp` 存储桶（从 Cloud Shell 或从 GCP 控制台复制）。这是\
    \ GCP 控制台中存储区内容的快速快照：\n    ![](Images/464fef9ba2e280e4d7324043b6f6036b.png)\n\
    \    图 10.6：Google Cloud Storage 存储桶中的发票文件\n7.  运行以下命令以使用 `Vision API` 读取发票 PDF\
    \ 文件并将其转录为文本：\n    ![](Images/1d07676f0f8574eaec425832c07a01d9.png)\n    图 10.7：使用\
    \ `Vision API` 进行 `OCR` 和文本检测的命令\n8.  `OCR` 也可以通过任何一个编程接口执行。GCP 提供了用于 C#、Go、Java、Node.js、PHP、Python\
    \ 和 Ruby 的 API。让我们看一下 `OCR` 的 Python 实现的一小段。[完整的实现在 GitHub 上](https://github.com/PacktPublishing/Hands-On-Artificial-Intelligence-on-Google-Cloud-Platform)：\n\
    \    ```python\n    def async_detect_document(source_path_gcs, destination_path_gcs):\n\
    \n        client = vision.ImageAnnotatorClient()\n\n        feature = vision.types.Feature(\n\
    \            type=vision.enums.Feature.Type.DOCUMENT_TEXT_DETECTION)\n\n     \
    \   gcs_source = vision.types.GcsSource(uri=source_path_gcs)\n        input_config\
    \ = vision.types.InputConfig(\n            gcs_source=gcs_source, mime_type=mime_type)\n\
    \n        async_request = vision.types.AsyncAnnotateFileRequest(\n           \
    \ features=[feature], input_config=input_config,\n            output_config=output_config)\n\
    \n        operation = client.async_batch_annotate_files(\n            requests=[async_request])\n\
    \    ```\n9.  JSON 格式的转录文本文件现在存储在 `aigcp-text` 存储桶中，如以下屏幕截图所示：\n    ![](Images/3269b12a1f5be153df02046824b97310.png)\n\
    \    图 10.8：在 Google Cloud Storage 中输出 JSON 文件\n10. 为了从输出 JSON 文件中提取有意义的信息，我们需要了解输出\
    \ JSON 文件（`output-1-to-1.JSON`）的格式：\n    ![](Images/d8a9541bbf1b17bc8cc323dfa2db7907.png)\n\
    \    图 10.9：输出文件中的 JSON 标头\n\n    这是输出文件中的头信息。`Vision API` 自动检测 PDF 文档中使用的语言。实际字符数据封装在\
    \ `HTG0` > `paragraphs` > `words` > `symbols` 的层次结构中，如下图所示：\n    ![](Images/985aaa66c622f3db9b27c9ab3a813bba.png)\n\
    \    图 10.10：输出 JSON 结构\n\n    `Vision API` 还将 PDF 文件中找到的所有符号收集到一个 `text` 字段中。这有助于我们快速从发票中收集有意义的内容。以下是包含\
    \ `text` 字段的输出 JSON 的代码段：\n    ![](Images/6ecab5abf2a43d37f398509837deda94.png)\n\
    \    图 10.11：发票文件中的文字\n\n    有关发票中的原始内容和 `Vision API` 提取的文本，请参见图 10.2。发票内的所有字段在\
    \ `text` 字段内的输出 JSON 文件中可用。\n\n至此，我们已经利用 `Vision API` 从发票中提取了有意义的信息，以便对其进行自动处理。在接下来的部分中，我们将使用各种\
    \ GCP 工具存储相关数据，进行验证并安排发票付款。\n\n# 使用 Cloud SQL 存储发票\n\n在本节中，我们将介绍一个完整的过程，该过程是从\
    \ `OCR` 输出生成的 JSON 文件中选取文本并将其通过 `Cloud Functions` 推送到 `Cloud SQL` 中的。首先，我们将介绍在\
    \ GCP 上准备好 `Cloud SQL` 和 `Cloud Functions` 的步骤，然后我们将解释用于选择文本并将其转换为所需的结构化格式以将其插入表中的代码。\n\
    \n## 创建一个 Cloud SQL 实例\n\n首先，让我们通过执行以下步骤来创建 `Cloud SQL` 实例：\n\n1.  从左侧面板中，从“存储”部分中选择\
    \ `SQL`：\n    ![](Images/d7b11f85cfdc23c14e2c61f726bc5482.png)\n2.  单击“创建实例”：\n\
    \    ![](Images/e7714183a29f4e2b97bcaadd25987414.png)\n3.  点击“选择 MySQL”：\n   \
    \ ![](Images/60706d81146e9991d12e8e44075904eb.png)\n4.  为实例命名，设置适当的密码，选择您的区域，保留默认数据库版本，然后单击“创建”。记住您为\
    \ `root` 用户设置的密码，因为稍后将有用：\n    ![](Images/9a64d257528ca2d21ae011f269cc5966.png)\n\
    \n## 设置数据库和表\n\n现在，借助以下步骤来设置数据库和表：\n\n1.  单击创建的实例：\n    ![](Images/d2a4aff649cb47befe50659abadb76f7.png)\n\
    2.  单击“使用 Cloud Shell 进行连接”，然后通过输入创建实例时设置的 `root` 用户的密码来连接到 MySQL：\n    ![](Images/8f73b7b12a82e91c5c679860ef85b0ab.png)\n\
    3.  运行以下命令来创建数据库：\n    ```sql\n    create database aip_db;\n    ```\n4.  运行以下命令以创建发票表。SQL\
    \ 文件 `aip.sql` 也可从[这里](https://github.com/vss-vikram/Hands-On-Artificial-Intelligence-on-Google-Cloud-Platform)获得，以创建与数据库相关的工件：\n\
    \    ```sql\n    create table invoice \n    (Company_Name VARCHAR(50),\n    Client_Name\
    \ VARCHAR(50),\n    Client_Address VARCHAR(50),\n    SOW_Number VARCHAR(50),\n\
    \    Project_ID VARCHAR(50),\n    Invoice_Number VARCHAR(50),\n    Invoice_Date\
    \ DATE,\n    Billing_Period DATE,\n    Developer VARCHAR(255),\n    Rate VARCHAR(50),\n\
    \    Hours INT,\n    Subtotal VARCHAR(50),\n    Balance_Due VARCHAR(50),\n   \
    \ Bank_Account_Number INT,\n    Bank_Name VARCHAR(50));\n    ```\n\n## 启用 Cloud\
    \ SQL API\n\n现在让我们启用 `Cloud SQL Admin API`：\n\n1.  从控制台搜索 `Cloud SQL Admin API`：\n\
    \    ![](Images/7cfdd602475e2c0b32f0a14651c28809.png)\n2.  单击“启用”：\n    ![](Images/e223293b1f42ec37605dc61f5bb3f48f.png)\n\
    \n## 启用 Cloud Functions API\n\n现在启用 `Cloud Functions API`：\n\n1.  从控制台搜索 `Cloud\
    \ Functions API`：\n    ![](Images/d23f79db6ba1e5473ceb426506b01a07.png)\n2.  要启用\
    \ API，请单击“启用”：\n    ![](Images/02848d83846debd9d80e0ccac4c3d915.png)\n3.  要建立从\
    \ `Cloud Functions` 到 `Cloud SQL` 的连接，需要以下 `Cloud SQL` 详细信息：\n    *   实例名称\n \
    \   *   数据库名称\n    *   用户名：`root`\n    *   创建实例时设置的 `root` 用户的密码\n\n## 创建 Cloud\
    \ Function\n\n现在让我们创建一个 `Cloud Function`：\n\n1.  从“计算”部分下的左侧面板中选择“云函数”：\n    ![](Images/69020c468c6b4414fed63dd57fb471ac.png)\n\
    2.  单击“创建功能”：\n    ![](Images/75e18d60da36b0e0aa8d99cc090339d2.png)\n3.  输入所需的功能名称。分配的内存可以为\
    \ 256 MB。选择“触发器”作为“云存储”，然后选择“事件类型”作为“完成/创建”。存储桶名称应为存储 PDF 到文本输出的存储桶的名称。源代码应为内联编辑器：\n\
    \    ![](Images/8f1274a391d3f4fcd4c746abc415fce4.png)\n4.  复制 `aip_cloud_function.py`\
    \ 中的代码，并根据存储区名称和创建的 `Pub/Sub` 主题替换所需的详细信息。要连接到 `Cloud SQL` 数据库，将需要再进行一次替换。将“步骤\
    \ 6”中提到的代码行替换为下载代码中的 `Cloud SQL` 详细信息。\n5.  从[这里](https://github.com/vss-vikram/Hands-On-Artificial-Intelligence-on-Google-Cloud-Platform)下载\
    \ `Cloud Functions` 代码。\n6.  提供 MySQL 连接详细信息，如以下代码所示。您将从上一步下载的 `Cloud Function`\
    \ 代码中获得相同的代码行。请使用适当的详细信息替换数据库用户、密码、名称和 `Cloud SQL` 实例：\n    ```text\n    # MYSQL+pymysql://<db_user>:<db_pass>@/<db_name>?unix_socket=/cloudsql/<cloud_sql_instance_name>\n\
    \    ```\n7.  替换该行后，复制并粘贴代码，如以下屏幕截图所示：\n    ![](Images/4ca0b235def47f450c7a2a70946186cd.png)\n\
    8.  对于依赖项设置，请从以下链接复制 `requirement.txt` 中的内容，并将其粘贴到[中的需求文件中 https://github.com/vss-vikram/Hands-On-Artificial-Intelligence-on-Google-Cloud-Platform](https://github.com/vss-vikram/Hands-On-Artificial-Intelligence-on-Google-Cloud-Platform)：\n\
    \    ![](Images/73b4667bec363bfb1c851d55bb4ac8bd.png)\n9.  单击“创建功能”。\n10. 创建功能后，单击功能，然后转到“常规”选项卡。检查用于运行该功能的服务帐户：\n\
    \    ![](Images/be794f98a63fb6c97424cb70fe1618ac.png)\n\n## 提供 Cloud SQL 管理员角色\n\
    \n接下来，让我们向运行 `Cloud Function` 的服务帐户提供 `Cloud SQL Admin` 角色：\n\n1.  转到“IAM”部分：\n\
    \    ![](Images/d75eb0a757941bce724a5e39e422525c.png)\n2.  选择将用于运行 `Cloud Functions`\
    \ 的服务帐户：\n    ![](Images/419cf40a582cdd2cfbb66ead0f4715c3.png)\n3.  将 `Cloud Admin`\
    \ 角色分配给该帐户：\n    ![](Images/9171938e94cf649289ef5a95a780a2d6.png)\n\n现在，让我们遍历\
    \ `Cloud Function` 的完整代码，以将 PDF 转换为文本后处理发票。以下是部分代码段。完整代码可在[这个页面](https://shorturl.at/yADV9)处找到：\n"
  trans: "\n# GCP 核心组件与 AI 工具包概述\n\n*   `Cloud Firestore`：这是一个方便的 NoSQL 数据存储，用于使客户端和服务器端之间的数据保持同步。它通常用于移动、Web\
    \ 和服务器开发，并为构建响应式应用和跨设备应用提供支持。\n*   `Cloud Datastore`：这是另一个完全托管的 NoSQL 数据库，用于处理分片和复制，以确保跨部署区域的高可用性。它支持\
    \ ACID 事务以及类似 SQL 的查询和索引。数据存储区提供了 REST API，通过允许通过多级安全连接进行数据访问，可以轻松集成外部应用。可以很容易地更改基础数据结构，并提供一种易于使用的查询语言。\n\
    \n以下组件可用于计算和处理；在我们的应用中，我们将利用 `Cloud Functions`：\n\n*   `Cloud SDK`：这是用于使用 GCP\
    \ 开发的一组工具和库。这是所有 GCP 服务的命令行界面，例如虚拟机编排、计算引擎、网络和磁盘存储。它通常用于自动执行各种应用管理任务。对于 AIP 应用，我们可以使用\
    \ `Cloud SDK` 来管理开发、测试和部署管道，并自动管理整个应用。\n*   `Cloud Functions`：这是一个无服务器、事件驱动的计算平台。根据工作负载和基于预定义的事件，可以轻松地进行伸缩。对于\
    \ AIP 应用，一旦发票到达源位置，我们就可以使用 `Cloud Functions` 触发自动过程，以读取发票并进行处理。它为跨各种语言和应用接口协议的互操作性提供了无缝支持。它基于最小特权的核心安全原理工作，并根据为用户分配的角色，促进对事件和功能的安全访问。\n\
    \n以下是 AI 工具包中可利用的组件：在我们的应用中，我们将利用 `Cloud ML`、`自然语言 API`、`视觉 API`、`翻译 API`、`语音\
    \ API` 和 `Cloud Video Intelligence API`：\n\n*   `Cloud ML`：这是一个全面的平台，可利用 Google\
    \ Cloud 的功能，使训练和部署可用于任何类型和大小的数据的 ML 模型变得容易。在平台上训练的模型可以立即使用，并且可以通过安全的 API 进行访问，从而可以以最少的资金和时间投入轻松开发应用的快速原型。\n\
    *   `自然语言 API`：自然语言 API 可用于执行 Web 规模的文本分析。该 API 与 `AutoML` 集成在一起，并允许用户基于非结构化数据来训练、测试和部署其模型。有预训练的模型，具有各种领域功能的各种应用可以轻松利用这些模型。该平台使协作和共享不断被平台升级的模型变得容易，从而提供了一种一致且可靠的方式来创建用于处理自然语言形式输入的应用。这样可以通过\
    \ `语音 API` 与人进行数据交互。\n*   `视觉 API`：这在基于视觉输入（例如图像）的分析中非常方便。如果机器具有补充人类视觉的能力（例如从\
    \ PDF 或 Word 文档抄录文本），我们可以将大量 API 用于此用例。这样，可以以有效和具有成本效益的方式对大量文档进行分类。无需大量设置即可使用该服务，因此，一旦为项目和用户帐户启用了该服务，就可以轻松无缝地开始使用它。强大的\
    \ API 层使您可以轻松以安全的方式与第三方应用集成。\n*   `翻译 API`：这是一种便捷的服务，无需设置转换规则即可使用。该 API 允许根据预先训练并不断发展的模型在各种语言之间进行翻译。这些功能易于使用，为语言互操作性以及以各种语言构建的各种应用之间的集成打开了可能性。\n\
    *   `语音 API`：这是智能机器的重要方面，它使人与应用之间具有类似人的界面。首先，API 启用了文本到语音到文本的转换。这些功能可用于创建对话应用。\
    \ `DialogFlow` 在内部利用 `语音 API` 来促进对话。\n*   `Cloud Video Intelligence API`：此 API\
    \ 使我们能够利用视频输入中的信息。GCP 上有可用的预训练模型，这些模型可用于分类和识别视频帧内的特定对象。它是自动驾驶汽车的组成部分之一，API 高效且可扩展，足以在关键任务应用中使用。\n\
    \n在下一部分中，概述了 GCP 上可用于构建端到端 AI 应用的各种组件，下面让我们看一下如何在 GCP 上构建自动发票处理应用。\n\n# 使用 Vision\
    \ API 执行光学字符识别\n\n收到 PDF 格式的发票后的第一步是解释其内容。我们将通过以下步骤使用 `视觉 API` 来执行 `光学字符识别`（`OCR`）：\n\
    \n1.  在 GCP 上创建一个新项目。建议您使用一个新项目来尝试 `OCR`。转录文档后，可以根据需要删除该项目，而不会影响任何其他应用。\n2.  从\
    \ GCP 控制台启用 `Cloud Vision API`、`Cloud Pub/Sub`、`Cloud Functions` 和 `Cloud Storage`。\n\
    3.  从 Cloud Shell（从 GCP 控制台），确保使用以下命令更新所有组件：\n    ```\n    gcloud components update\n\
    \    ```\n4.  如下在 `Cloud Storage` 上创建两个存储桶：\n    ![](img/2d262bd6dc7f3ff188efe2b8cf69f105.png)\n\
