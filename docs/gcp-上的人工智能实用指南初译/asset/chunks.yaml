    \n# 性能指南\n\n在开发模型时，非常重要的是要对其进行调整以使其获得良好的性能。 在本节中，我们将介绍一些技巧，这些技巧将帮助您提高模型在 Cloud\
    \ TPU 上的性能。 这样，Cloud TPU 可以提供良好的性能，但是我们可以通过为应用设置正确的配置来增强它。\n\n在以下小节中，我们将讨论提高性能的重点领域。\n\
    \n# XLA 编译器性能\n\nXLA 编译器是标准 TensorFlow 代码库的一部分。 它是 ML 编译器，可以为 CPU，GPU，TPU 和其他一些平台生成二进制文件。\
    \ 将 Cloud TPU 的 TensorFlow 模型转换为 XLA 图，然后 XLA 编译器将其转换为 TPU 可执行文件。 在这里，我们将注意到的一件事是\
    \ TPU 硬件不同于 CPU 和 GPU 硬件。\n\nCPU 具有少量高性能线程，而 GPU 具有大量高性能线程。 Cloud TPU 具有`128 *\
    \ 128`个 MXU，它们可以作为单个非常高性能的线程执行，并且每个周期可以执行 16,000 次操作，或者以管道方式连接的`128 * 128`个微小线程。\n\
    \n# 平铺的后果\n\nCloud TPU 中的数组是平铺的。 这要求将其中一个维度的填充填充为 8 的倍数，将另一个维度填充为 128 的倍数。XLA\
    \ 执行数据布局转换，以将数据安排在内存中以进行有效使用。 这些转变是由试探法驱动的。 这对于大多数模型而言效果很好，但有时可能会出错。 为了获得最佳性能，应尝试不同的配置。\n\
    \n以下是一些可以最大程度提高性能的非常重要的事情：\n\n*   填充成本应降至最低。\n\n*   批和特征尺寸的值应非常有效地选择。\n\n# 融合\n\
    \n如果要组合执行多个操作，则 XLA 编译器将使用融合技术来优化程序。 融合操作是可以组合执行的多个操作的组合。\n\n例如，考虑以下一系列操作：\n\n\
    ```\ntf_add = tf.add(x, y)\nresult = tf.multiply(tf_add, z)\n```\n\n在步骤中，此代码将像这样执行：\n\
    \n1.  首先，循环将顺序访问元素并执行加法运算，结果将保存在`tf_add`中，并将其存储在临时存储器中，如以下代码块所示：\n\n```\nfor (i\
    \ = 0; i < cnt; i++) {\n tf_add[i] = x[i] + y[i];\n}\n```\n\n2.  现在，将再次访问加法结果并将其相乘，如下所示：\n\
    \n```\nfor (i = 0; i < cnt; i++) {\n result = tf_add[i] * z[i];\n}\n```\n\n使用融合，数组访问会同时发生，如以下代码块所示：\n\
    \n```\n#In Fusion both addition and multiplication operations are performed together.\n\
    for (i = 0; i < cnt; i++) {\n result = (x[i] + y[i]) * z[i];\n}\n```\n\n在此示例中，内存往返次数减少了，并且\
    \ XLA 不需要为`tf_add`分配任何空间。\n\n融合为 Cloud TPU 带来了许多好处，例如：减少了内存传输，优化了硬件利用率，等等。\n\n\
    当两个形状相同的张量组合在一起时，广播将隐式发生，但是请注意，强制实现广播可能会导致性能下降。\n\n# 了解抢占式 TPU\n\n可抢占的 TPU 是低成本\
    \ TPU，但其性能与按需 TPU 相同。 但是这里要注意的是，当 Google 需要资源用于其他目的时，总可以终止它。 让我们检查一下如何从控制台创建可抢占的\
    \ TPU。\n\n# 从控制台创建抢占式 TPU 的步骤\n\nGCP 为创建可抢占的 TPU 提供了简单的界面。 涉及的步骤如下：\n\n1.  在 GCP\
    \ 控制台上的 Compute Engine 下，选择`TPU`。 如果未启用 API，请单击`ENABLE`启用它，如以下屏幕截图所示：\n\n![](Images/62e47dcd4d5810f8f427100f90b369aa.png)\n\
    \n图 7.8 启用 Cloud TPU API\n\n2.  单击**创建 TPU 节点**，如以下屏幕截图所示：\n\n![](Images/7c1bbc36d5bf7eb30f5d2a1090abfd7e.png)\n\
    \n图 7.9 创建 TPU 节点\n\n3.  填写所需的详细信息，选择**可抢占性**选项，然后单击**网络，描述，标签**链接，如以下屏幕截图所示：\n\
    \n![](Images/b27d5f299aedf2e06f4316cbc3373912.png)\n\n图 7.10 创建云 TPU\n\n4.  填写其他详细信息，然后单击屏幕底部的**创建**，如以下屏幕截图所示，您的\
    \ TPU 准备就绪：\n\n![](Images/d44f39aca88c206870ff2c1f73e6a489.png)\n\n图 7.11 创建 Cloud\
    \ TPU 的其他详细信息\n\n# 抢占式 TPU 的定价\n\n与按需 TPU 相比，可抢占 TPU 的价格约为价格的 30% 左右。 这里要注意的一点是，抢占式\
    \ TPU 的配额高于普通 TPU 的配额，而抢占式 TPU 具有单独的配额。 以下屏幕快照显示了 us-central1 区域中 v2-8 和 v3-8\
    \ 的定价比较示例：\n\n![](Images/8716360cb8900314ccfb0284b1550782.png)\n\n图 7.12 价格比较\
    \ v2-8 和 v3-5\n\n# 抢占式 TPU 的检测\n\n如果已经创建了 TPU，并且我们必须检查它是否可抢占，则有相应的规定。 以下命令用于检测\
    \ TPU 是否可抢占：\n\n*   `ctpu`命令：运行以下命令检查已创建的 TPU 的详细信息。 在“TPU 可抢占”上打印的值指示 TPU 是否被抢占，`READY`值表示未抢占\
    \ TPU，而`PREEMPTED`值表示 TPU 已被抢占：\n\n```\n$ ctpu status\n```\n\n*   `gcloud`命令：如果尚未指定区域，它将使用当前配置中的\
    \ compute 属性的值。 运行以下命令以检索项目中可用于 Cloud TPU 的计算区域列表：\n\n```\n$gcloud compute tpus\
    \ list\n```\n\n在决定使用 TPU 选项之前，请检查您的用例是否可以继续使用可抢占的 TPU，因为这样可以节省大量成本。\n\n# 总结\n\n\
    在本章中，我们获得了创建 TPU 并在其上编写模型的所有必需知识。 我们已经了解了 Cloud TPU 及其组织以及 Cloud TPU 软件和硬件架构的基础。\
