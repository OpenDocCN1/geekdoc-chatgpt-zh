    \ 进行了评估以查找其详细信息。\n\n执行前面的查询后，让我们看一下以下结果：\n\n![](img/6066291884288bfd3084712c235bcbb2.png)\n\
    \n上面的屏幕快照显示了完整的模型评估详细信息。如我们所见，SQL 界面训练模型的准确率很高，并且训练数据覆盖率。得分值还表明该模型是最佳拟合的，而不是评估数据的过拟合或过拟合。关键是，业务分析师还可以使用\
    \ `BigQuery` 提供的简单 SQL 接口执行模型训练和部署。\n\n## 测试模型\n\n在 `BigQuery` 中，`ml.predict()`\
    \ 函数用于使用模型预测结果。执行以下 `BigQuery` 代码以测试您的模型：\n\n```sql\nSELECT\n prospect_id,\n predicted_label\n\
    \ FROM\n ml.predict(model `Leads.lead_model_optimum`,\n (\n SELECT\n *\n FROM\n\
    \ Leads_Test_Data))\n```\n\n在前面的代码中，模型基于 `prospect_id` 预测 `test_data` 的 `Lead_Stage`。\n\
    \n您可以看到生成的屏幕截图。请比较模型的预测和基于 `prospect_id` 的测试数据的 `Lead_Stage` 列，以查看模型的准确率：\n\n\
    ![](img/167e32f6c3f8d20b8c7481e6259cdaf4.png)\n\n至此，本例结束。请在使用 `Spark` 的 `Dataproc`\
    \ 集群上尝试相同的示例。\n\n## 总结\n\n在本章中，我们学习了在 `GCP` 上构建 AI 应用时对我们有帮助的所有组件。我们研究了不同的计算、存储和处理选项，以及这些选项可以为我们提供哪些帮助。请记住，选择正确的存储、计算和处理对于构建具有成本效益的应用非常重要。除了学习组件之外，我们还使用\
    \ `BigQuery` 和 `Cloud Storage` 进行了潜在客户预测的动手示例，并且您可以在 `Dataproc` 集群上使用 `Spark`\
    \ 尝试相同的示例。\n\n在下一章中，我们将深入探讨利用 `GCP` 的功能来使用自动缩放功能处理大量数据。\n\n# 第 2 节：使用 Google Cloud\
    \ Platform 的人工智能\n\n> 原文：[`gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/sec2.md`](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/sec2.md)\n\
    \n在本节中，我们将能够使用各种算法执行动手实验。在 **第 3 章** 中，我们将介绍 `XGBoost`（一种功能强大的算法），以及如何利用它在 `Google\
    \ Cloud Platform (GCP)` 上构建机器学习应用。在 **第 4 章** 中，我们将介绍 `Cloud AutoML`，它在 `GCP`\
    \ 上提供机器学习即服务。在 **第 5 章** 中，我们将使用 `Cloud ML Engine` 构建机器学习管道。在 **第 6 章** 中，我们将提供有关使用\
    \ `Dialogflow` 构建会话应用的分步指南。\n\n本节包括以下章节：\n\n*   “第 3 章”，“使用 XGBoost 的机器学习应用”\n\
    *   “第 4 章”，“使用 Cloud AutoML”\n*   “第 5 章”，“构建大数据云机器学习引擎”\n*   “第 6 章”，“使用 Dialogflow\
    \ 的智能会话应用”\n\n## 第 3 章：XGBoost 的机器学习应用\n\n> 原文：[`gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/03.md`](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/03.md)\n\
    \n在许多领域，基于机器学习的数据驱动方法变得非常重要。一个很好的例子是基于机器学习的智能电子邮件垃圾邮件分类器，它通过学习大量垃圾邮件数据和用户反馈来保护我们的电子邮件。另一个这样的示例可以是针对性广告系统，其基于某些上下文向用户展示广告，或者是防止恶意攻击者攻击的银行欺诈检测系统。为了使机器学习应用在上述领域取得成功，必须牢记一些重要因素。\n\
    \n一种是建立并使用有效的统计模型来表示涵盖最重要场景的所有复杂数据依赖关系，另一种是可伸缩地构建那些模型以确保它们在越来越大的数据集上工作。机器学习的可伸缩性使您能够通过并行和分布式计算进行快速学习，并且还提供了有效的内存利用率。\n\
    \n在本章中，我们将讨论 `XGBoost` 库，这是一种集成学习算法。`XGBoost` 是一种基于决策树集成的机器学习算法，该算法使用梯度提升系统。在预测涉及非结构化数据（例如图像和文本）的问题时，人工神经网络往往会胜过任何其他算法或系统。尽管如此，当涉及中小型结构化/表格数据时，基于决策树的算法目前被认为是同类最佳。这是因为在某些情况下，仅一种机器学习模型的结果可能不够。集成学习为组合多种机器学习算法的预测能力提供了系统的解决方案。结果是一个单一模型，提供了多个模型的附加输出。集成模型（也称为基础学习器）可以使用相同的学习算法，也可以使用不同的算法。在本章中，您将学习如何使用\
    \ `Python` 实现 `XGBoost` 算法。您还将学习有关梯度提升的概念以及它们如何支持 `XGBoost` 算法的知识。\n\n本章将涵盖以下主题：\n\
    \n*   `XGBoost` 库概述\n*   训练和存储 `XGBoost` 机器学习模型\n*   用已训练的 `XGBoost` 模型\n*   使用\
    \ `XGBoost` 库构建推荐系统\n\n### XGBoost 库概述\n\n`XGBoost` 是一个库，可帮助以可扩展且以性能为中心的方式在非常大的数据集上运行集成学习机器学习算法。因此，它着重于计算速度和模型表现。换句话说，对于\
    \ `XGBoost` 而言，高端硬件情况下性能或可伸缩性提高的结果更多。`XGBoost` 在梯度提升框架内实现了用于机器学习的算法。我们将很快进入 `XGBoost`\
    \ 库。但是在此之前，我们还应该了解集成学习和梯度提升。\n\n### 集成学习\n\n集成学习算法结合了多个基本模型以产生最佳的预测模型。与尝试从训练数据中学习假设的普通机器学习方法相反，集成方法尝试构建和组合许多假设。使用集成方法时，重点放在泛化上，由于算法的特定性质或由于选择的训练集而导致的偏差方差折衷，有时基础学习器会忽略它。\n\
    \n通常，基础学习算法会根据训练数据生成基础学习器，这些数据可以是决策树、神经网络或其他机器学习算法。大多数乐团使用单个基本学习算法来生成同类基础学习器，但是也存在几种使用多种不同类型的学习算法来生成异构学习器的方法。在后一种情况下，没有用于基础学习的单一算法。装袋和提升是广泛使用的集成方法。这些是一种简单的组装技术，使用一些模型平均技术来共同构建许多独立的预测变量/模型/学习器（例如平均加权、多数或平均法线）。\n\
    \n另一个更大的问题是如何确保基础学习器不相互关联。确保这些基本共同学习器的预测彼此独立是很重要的。否则，它将排除整体建模的优化预测模型。对于不同的基础共同学习器，我们的意思是最终的基础模型应该有所不同。如果模型使用的数据集完全不同并且完全代表不同的上下文，则这些模型可以不同。如果模型考虑不同的假设或使用完全不同的算法类别，则模型可以有所不同。\n\
    \n### 集成学习如何决定最佳预测模型？\n\n当集成学习模型产生的误差尽可能低时，确定最佳模型，而损失函数的较低值确定最小值。损失函数用于衡量预测模型可以预测预期结果的程度。查找最小函数点的最常见方法是梯度下降。总而言之，我们必须首先了解导致模型误差的原因，才能真正了解集成模式背后的原因。我们将向您简要介绍这些误差，并为每位集成学生提供对这些问题的见解。任何模型的误差都可以在数学上分为三种类型。\n\
    \n#### 可减少的误差 – 偏差\n\n偏差是预测值和实际值之间的距离。换句话说，偏差是平均模型预测值与我们尝试预测的正确值之间的差。高度偏倚的模型很少考虑训练数据，而过于简化了模型。高偏差会导致算法错过相关的输入输出变量关系。如果模型具有很高的偏差度，则意味着该模型过于简单，无法捕获支撑数据的复杂性。为了量化偏差，它是预测值和实际值之间的平均差。\n\
    \n![](img/184b949c009867df3382b1ff5d905c81.png)\n\n#### 可减少的误差 – 方差\n\n当模型在经过训练的数据集上良好但在新数据集（例如测试数据集或验证数据集）上表现不佳时，就会发生方差。方差告诉我们如何分散实际值。高方差会导致过拟合，这意味着算法模型中训练数据中存在随机噪声。如果模型显示出很高的方差，则它会变得非常灵活，并适应训练集的数据点。如果高方差模型遇到另一个未学习的数据点，则无法正确预测。方差量化了预测和相同观测值之间的差异。\n\
    \n#### 不可减少的误差\n\n不可减少的误差是无论您使用哪种机器学习算法都无法将其最小化的误差。它们通常是由可能影响输出变量的未知变量引起的。改善不可减少误差的预测的唯一方法是识别和预测那些外部影响。\n\
    \n#### 总误差\n\n总误差定义如下：\n\n![](img/3aa8e837563cc878c801f2348b417a00.png)\n\n通常，随着模型变得越来越复杂，由于模型的失真较小，您会看到误差的减少。但是，这只会发生到某个特定点。随着模型的不断复杂化，您最终会过拟合模型，因此方差将开始增加。正确优化的模型应该平衡方差和偏差，如下图所示：\n\
    \n![](img/895f4c7db470514aa6c6c7862f398563.png)\n\n### 梯度提升\n\n梯度提升是整体学习器的一种。这意味着将基于一组不同的模型创建最终模型。这些不同模型的拟合程度过高，因此它们的预测能力较弱，但是由于将它们组合在一起，因此在总体结果方面要好得多。在梯度提升机中，决策树是最常用的弱模型类型。因此，简而言之，梯度提升是一种基于回归和分类的机器学习方法，可将预测模型生成为弱预测模型的集合，该模型通常基于决策树。现在让我们看看如何在数学上进行定义。\n\
    \n任何监督学习算法都旨在定义和最小化损失函数。均方误差 (MSE) 或损失函数定义如下：\n\n![](img/1ac977558dd74a2ffde2ec16c908b4cd.png)\n\
    \n我们希望损失函数最小。实际上，梯度提升的目的是找到使损失函数最小化的数据的最近似函数。这可以用数学方式表示为：\n\n![](img/1bdc3d7f174644e83856b16f7911cb66.png)\n\
    \n因此，在梯度提升中，除了找到最佳参数 `P` 之外，我们还希望找到最佳函数 `F`。与简单的逻辑回归不同，此更改使问题复杂得多。之前，我们要优化的参数数量是固定的（例如，在开始训练之前已定义了逻辑回归模型）；现在，如果函数\
    \ `F` 发生更改，它可以随着我的优化过程而更改。\n\n显然，搜索每个单个特征和参数以获得最佳特征会花费太长时间，因此梯度提升可以通过使用许多简单函数并将它们组合来找到最佳函数\
    \ `F`。以下是梯度增强中涉及的步骤：\n\n1.  首先，使用简单的模型和错误分析数据对数据建模。这些误差指向难以通过简单模型拟合的数据点。\n2. \
    \ 然后，对于后续模型，我们特别关注难以拟合的数据以对其进行校正。\n3.  归根结底，我们将所有预测变量组合在一起，赋予每个预测变量一定的权重。\n\n\
    [这个页面](https://github.com/PacktPublishing/Hands-On-Artificial-Intelligence-on-Google-Cloud-Platform)上的代码表示如何在\
    \ `Python` 中完成梯度提升。\n\n此代码用于在 `Python` 中实现梯度提升。但目的还在于显示如何在多次迭代后减少误差。散点图显示了机器学习算法的输入\
    \ (`X`) 的输出 (`Y`) 的分布方式。以下输出还显示了残留散点图，该残留散点图在第 20 次迭代后变得随机性降低，表明梯度提升已找到最佳输出：\n\
    \n![](img/73017d430317a877a106315594f40c1f.png)\n\n前面的散点图是输入和输出机器学习算法的表示。下面显示了应用梯度提升之前的实际输出：\n\
    \n![](img/cf2643a1b06d0f988366d9799c1a9cd8.png)\n\n我们可以在前面的屏幕截图中看到以下内容：\n\n* \
    \  从第 18 次迭代开始，残差实际上是在第 20 次迭代附近随机分布的。\n*   一旦残差随机分布均匀，我们就知道梯度提升已经给出了优化的输出。\n\
    *   换句话说，梯度提升从残差中识别出最大数量的图案，并给出了最大的优化输出。\n\n### 极限梯度提升（XGBoost）\n\n"
