- raw: "我们将通过 DialogFlow 控制台创建一个新的 Google 项目。 单击右上角的“创建”按钮。 创建智能体后，我们将进入“意图”屏幕。 DialogFlow\
    \ 为每个智能体提供两个默认意图。 这些是任何应用通常都需要的预配置意图：\n\n*   **欢迎意图**：这是开始对话的默认意图。 作为最佳实践，座席需要向用户打招呼并使其与问候语的总体用户风格相匹配。\
    \ 还建议欢迎意图以智能体提供的领域特定的功能进行答复。 例如，对于书店智能体，该智能体需要向用户打招呼，并简短地谈论书店。\n\n*   **后备意图**：这是默认意图，当智能体无法将用户表达式与任何已配置的意图匹配时调用。\n\
    \n所有意图都配置有上下文，事件，训练短语，动作和参数，响应和实现。 让我们看一下默认的欢迎意图。 可以根据应用上下文对欢迎意图进行配置和修改以吸引用户：\n\
    \n![](Images/61a09cf67f7d06eac2fc17f86aa31ab9.png)\n\n图 6.4：默认欢迎意图\n\n默认的欢迎意图配置了一组训练短语和响应。\
    \ 让我们修改默认的欢迎意图以适合我们的书店智能体。 我们可以添加新的响应，也可以删除 DialogFlow 提供的默认响应。\n\n以下屏幕截图说明了欢迎意图的配置：\n\
    \n![](Images/9f466a216e2c945a0ca3f0faaa725b9e.png)\n\n图 6.5：配置默认的欢迎意图\n\nDialogFlow\
    \ 控制台提供了一种快速测试已配置响应的简便方法。 在右窗格中，DialogFlow 提供了一种提供音频和文本输入的方法，并根据配置的意图模拟 DialogFlow\
    \ 智能体的响应。 这是一个截图，说明了来自欢迎意图的响应：\n\n![](Images/5e31b3846bc1858e0156b2c5dd766ef7.png)\n\
    \n图 6.6：意图测试\n\n我们可以使用以下工具配置智能体：\n\n*   **用于输入测试短语的文本字段**：控制台使用户可以键入测试字符串，还可以与系统的麦克风集成以进行语音对话测试。\n\
    \n*   **用户表达式**：DialogFlow 测试窗格会重现输入或说出的文字，以进行验证和测试。\n\n*   **响应**：基于意图配置，来自 DialogFlow\
    \ 智能体的响应显示在此区域中。\n\n*   **诊断信息**：这是 DialogFlow 提供的一种方便工具，用于对意图请求/响应进行故障排除。\n\n\
    单击“诊断信息”按钮，以 JSON 格式查看 DialogFlow 智能体的响应。 这是来自智能体的 JSON 格式的示例响应：\n\n```\n{\n \
    \       \"responseId\": \"af1b533d-b107-42c1-b2af-1fcc30ed6b01-b4ef8d5f\",\n \
    \       \"queryResult\": {\n             \"queryText\": \"Hello\",\n         \
    \    \"action\": \"input.welcome\",\n             \"parameters\": {},\n      \
    \       \"allRequiredParamsPresent\": true,\n             \"fulfillmentText\"\
    : \"Hi, Thank you for calling My Book Store. We are open from 9 am to 6 pm\",\n\
    \             \"fulfillmentMessages\": [\n                 {\n               \
    \    \"text\": {\n                   \"text\": [\n                        \"Hi,\
    \ Thank you for calling My Book Store. We are open from 9 am to 6 pm\"\n     \
    \                ]\n                   }\n                }\n              ],\n\
    \       \"intent\": {\n           \"name\": \"projects/mybookstore-efjbhb/agent/intents/6fa880d8-1ed2-4999-86dc-a58211a164c4\"\
    ,\n           \"displayName\": \"Default Welcome Intent\"\n       },\n       \
    \   \"intentDetectionConfidence\": 1,\n          \"languageCode\": \"en\"\n  \
    \   }\n}\n```\n\n我们可以为欢迎意图添加响应变体。 DialogFlow 根据上下文和用户表达式随机选择响应。 为了对提供的特定响应进行精细控制，我们需要通过编写自定义代码来利用实现\
    \ API。 当我们提供诸如“我该如何帮助您？”的开放式回复时，智能体期望来自用户的响应以在特定方向上推动对话。\n\n我们可以通过创建自定义意图来处理对话中的这些派生。\
    \ 在创建自定义意图之前，让我们看一下 DialogFlow 提供的默认回退意图。 当用户的表达式无法与任何已配置的意图匹配时，激活后备意图。 当基于用户表达的意图匹配失败时，DialogFlow\
    \ 会提供默认的后备意图和一组预配置的响应。 这是 DialogFlow 中默认回退意图的快照：\n\n![](Images/d56202f65286f5fe2ef5ed096c5207fa.png)\n\
    \n图 6.7：默认回退意图\n\n让我们创建几个自定义意图来帮助 MyBookStore DialogFlow 智能体继续与自定义欢迎意图之外的呼叫者进行对话。\
