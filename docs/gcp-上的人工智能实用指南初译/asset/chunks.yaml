- raw: "*   **Cloud Firestore**：这是一个方便的 NoSQL 数据存储，用于使客户端和服务器端之间的数据保持同步。 它通常用于移动，Web\
    \ 和服务器开发，并为构建响应式应用和跨设备应用提供支持。\n\n*   **Cloud Datastore**：这是另一个完全托管的 NoSQL 数据库，用于处理分片和复制，以确保跨部署区域的高可用性。\
    \ 它支持 ACID 事务以及类似 SQL 的查询和索引。 数据存储区提供了 REST API，通过允许通过多级安全连接进行数据访问，可以轻松集成外部应用。\
    \ 可以很容易地更改基础数据结构，并提供一种易于使用的查询语言。\n\n以下组件可用于计算和处理； 在我们的应用中，我们将利用 Cloud Functions：\n\
    \n*   **Cloud SDK**：这是用于使用 GCP 开发的一组工具和库。 这是所有 GCP 服务的命令行界面，例如虚拟机编排，计算引擎，网络和磁盘存储。\
    \ 它通常用于自动执行各种应用管理任务。 对于 AIP 应用，我们可以使用 Cloud SDK 来管理开发，测试和部署管道，并自动管理整个应用。\n\n*\
    \   **Cloud Functions**：这是一个无服务器，事件驱动的计算平台。 根据工作负载和基于预定义的事件，可以轻松地进行伸缩。 对于 AIP\
    \ 应用，一旦发票到达源位置，我们就可以使用 Cloud Functions 触发自动过程，以读取发票并进行处理。 它为跨各种语言和应用接口协议的互操作性提供了无缝支持。\
    \ 它基于最小特权的核心安全原理工作，并根据为用户分配的角色，促进对事件和功能的安全访问。\n\n以下是 AI 工具包中可利用的组件： 在我们的应用中，我们将利用云机器学习，自然语言\
    \ API，视觉 API，翻译 API，语音 API 和云视频智能 API：\n\n*   **Cloud ML**：这是一个全面的平台，可利用 Google\
    \ Cloud 的功能，使训练和部署可用于任何类型和大小的数据的 ML 模型变得容易。 在平台上训练的模型可以立即使用，并且可以通过安全的 API 进行访问，从而可以以最少的资金和时间投入轻松开发应用的快速原型。\n\
    \n*   **自然语言 API**：自然语言 API 可用于执行 Web 规模的文本分析。 该 API 与 AutoML 集成在一起，并允许用户基于非结构化数据来训练，测试和部署其模型。\
    \ 有预训练的模型，具有各种领域功能的各种应用可以轻松利用这些模型。 该平台使协作和共享不断被平台升级的模型变得容易，从而提供了一种一致且可靠的方式来创建用于处理自然语言形式输入的应用。\
    \ 这样可以通过语音 API 与人进行数据交互。\n\n*   **视觉 API**：这在基于视觉输入（例如图像）的分析中非常方便。 如果机器具有补充人类视觉的能力（例如从\
    \ PDF 或 Word 文档抄录文本），我们可以将大量 API 用于此用例。 这样，可以以有效和具有成本效益的方式对大量文档进行分类。 无需大量设置即可使用该服务，因此，一旦为项目和用户帐户启用了该服务，就可以轻松无缝地开始使用它。\
    \ 强大的 API 层使您可以轻松以安全的方式与第三方应用集成。\n\n*   **翻译 API**：这是一种便捷的服务，无需设置转换规则即可使用。 该 API\
    \ 允许根据预先训练并不断发展的模型在各种语言之间进行翻译。 这些功能易于使用，为语言互操作性以及以各种语言构建的各种应用之间的集成打开了可能性。\n\n\
    *   **语音 API**：这是智能机器的重要方面，它使人与应用之间具有类似人的界面。 首先，API 启用了文本到语音到文本的转换。 这些功能可用于创建对话应用。\
    \ DialogFlow 在内部利用语音 API 来促进对话。\n\n*   **Cloud Video Intelligence API**：此 API\
    \ 使我们能够利用视频输入中的信息。 GCP 上有可用的预训练模型，这些模型可用于分类和识别视频帧内的特定对象。 它是自动驾驶汽车的组成部分之一，API 高效且可扩展，足以在关键任务应用中使用。\n\
    \n在下一部分中，概述了 GCP 上可用于构建端到端 AI 应用的各种组件，下面让我们看一下如何在 GCP 上构建自动发票处理应用。\n\n# 使用 Vision\
    \ API 执行光学字符识别\n\n收到 PDF 格式的发票后的第一步是解释其内容。 我们将通过以下步骤使用视觉 API 来执行**光学字符识别**（**OCR**）：\n\
    \n1.  在 GCP 上创建一个新项目。 建议您使用一个新项目来尝试 OCR。 转录文档后，可以根据需要删除该项目，而不会影响任何其他应用。\n\n2.\
    \  从 GCP 控制台启用 Cloud Vision API，Cloud Pub/Sub，Cloud Functions 和 Cloud Storage。\n\
    \n3.  从 Cloud Shell（从 GCP 控制台），确保使用以下命令更新所有组件：\n\n```\ngcloud components update\n\
    ```\n\n4.  如下在 Cloud Storage 上创建两个存储桶：\n\n![](Images/2d262bd6dc7f3ff188efe2b8cf69f105.png)\n\
    \n图 10.5：用于创建存储桶的`gsutil`命令\n\n5.  创建`aigcp`存储桶以存储发票 PDF 文件，并使用`aigcp-text`存储桶存储转录的文本文件（JSON\
    \ 格式）。\n\n6.  将发票 PDF 文件复制到`aigcp`存储桶（从 Cloud Shell 或从 GCP 控制台复制）。 这是 GCP 控制台中存储区内容的快速快照：\n\
    \n![](Images/464fef9ba2e280e4d7324043b6f6036b.png)\n\n图 10.6：Google Cloud Storage\
    \ 存储桶中的发票文件\n\n7.  运行以下命令以使用 Vision API 读取发票 PDF 文件并将其转录为文本：\n\n![](Images/1d07676f0f8574eaec425832c07a01d9.png)\n\
    \n图 10.7：使用 Vision API 进行 OCR 和文本检测的命令\n\n8.  OCR 也可以通过任何一个编程接口执行。 GCP 提供了用于 C#，Go，Java，Node.js，PHP，Python\
    \ 和 Ruby 的 API。 让我们看一下 OCR 的 Python 实现的一小段。 [完整的实现在 GitHub 上](https://github.com/PacktPublishing/Hands-On-Artificial-Intelligence-on-Google-Cloud-Platform)：\n\
    \n```\ndef async_detect_document(source_path_gcs, destination_path_gcs):\n\n \
    \   client = vision.ImageAnnotatorClient()\n\n    feature = vision.types.Feature(\n\
    \        type=vision.enums.Feature.Type.DOCUMENT_TEXT_DETECTION)\n\n    gcs_source\
    \ = vision.types.GcsSource(uri=source_path_gcs)\n    input_config = vision.types.InputConfig(\n\
    \        gcs_source=gcs_source, mime_type=mime_type)\n\n    async_request = vision.types.AsyncAnnotateFileRequest(\n\
    \        features=[feature], input_config=input_config,\n        output_config=output_config)\n\
    \n    operation = client.async_batch_annotate_files(\n        requests=[async_request])\n\
    ```\n\n9.  JSON 格式的转录文本文件现在存储在`aigcp-text`存储桶中，如以下屏幕截图所示：\n\n![](Images/3269b12a1f5be153df02046824b97310.png)\n\
