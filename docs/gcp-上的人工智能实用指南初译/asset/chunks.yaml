- raw: "Google 通过从头开始构建服务，从而为企业提供云服务时采取了创新的方法。 这些服务最初是由 Google 自己内部用于搜索和其他互联网规模的服务而构建的。\
    \ 该平台迅速成熟，形成了一套完整的套件，可用于开发整个简单范围的应用，从简单的 Web 应用开始，再到微服务和高级分析，这些功能利用了大量的结构化和非结构化数据以及\
    \ GPU 和 **张量处理单元**（**TPU**），用于训练计算密集型模型。 在本书的“第 7 章”，“了解云 TPU” 中，我们将深入研究 TPU 并详细了解\
    \ TPU。 在本书中，我们将详细了解 GCP 的各个组成部分，并将专门研究如何利用 GCP 将**人工智能**（**AI**）工作负载以及各种应用的无缝集成部署为服务。\n\
    \n尽管 Cloud First 策略在实现实实在在的利益方面具有公认的优势和优势，但由于接下来要说明的原因，云的采用也受到了批评。\n\n# 云优先策略的反模式\n\
    \n尽管云计算是一个新的范例，但仍需要解决某些基本假设和一致的连接性和安全性要求。 以下是“云优先”策略的一些反模式：\n\n*   **停机时间**：云服务完全取决于可靠的互联网连接的可用性。\
    \ 当关键业务应用部署在云上时，互联网停机的风险和影响会增加。 但是，停机风险在本地部署中同样普遍，并且需要仔细考虑架构模式以最大程度地减少这些风险。 借助云，应在设计服务时考虑到高可用性，冗余和灾难恢复。\
    \ 云供应商为云基础架构提供了多个可用性区域。 应用应利用这些冗余区域来部署关键服务。 在下一部分中，我们将了解 Google 如何通过地理位置分散的数据中心来减轻停机风险。\n\
    \n*   **安全性和私密性**：许多管理敏感数据资产的企业在采用云时都担心数据的安全性和私密性。 云是共享空间，因此，风险显而易见。 但是，以下策略可以轻松应对反模式：\
    \ \n\n    *   在所有部署级别上实现安全治理实践和流程。\n\n    *   实现精心定义的访问控制级别，并为所有用户和进程提供最低级别的访问。\
    \ 如有疑问，请提供比访问服务和基础结构的更广泛的网络访问更多的受限访问。\n\n    *   对所有用户帐户实现多因素认证。\n\n    *   在所有端点上部署异常检测程序并持续监视云基础架构（自动以及基于样本的手动监视）。\n\
    \n云服务提供商已在保护这些反模式方面进行了大量投资，并且云部署此时与本地部署一样可靠和安全。\n\n在下一节中，我们将根据地理区域和服务可用性来查看 Google\
    \ 数据中心的当前状态。\n\n# Google 数据中心\n\n作为互联网规模的数据托管人，Google 建立了完善的数据中心网络。 现在，相同的基础结构可用于\
    \ GCP。 在撰写本文时，GCP 拥有 18 个全球区域，分为 55 个区域，分布在 35 个国家/地区。 以下屏幕快照显示了全球 GCP 区域：\n\n\
    ![](Images/7872cbe8754e9ef5a559fa396190f268.png)\n\n这些地区分为“美洲”（北美和南美），“欧洲”和“亚太地区”。\
    \ 选择正确的区域和区域对于确保服务和数据的延迟，可用性以及持久性处于可接受的水平至关重要。 确保区域内位置之间的网络数据包的往返延迟为亚毫秒级的 95%。\
    \ 部署在区域内单个区域上的服务将不会容错。 在这种情况下，区域故障将导致服务中断。 为了开发容错应用，需要跨区域部署。 对于关键任务应用，应实现多区域部署策略。\
    \ 根据应用和服务的关键级别，将资源分类如下：\n\n*   **区域资源**：这些资源在区域内操作。 在这种情况下，如果该区域不可用，则该服务将变得不可访问。\
    \ 计算引擎是区域资源，因为如果基础数据可用，则可以恢复计算。 如果包含计算引擎实例的区域出现故障，则一旦该区域可用，就需要重新启动计算。\n\n*   **区域资源**：这些资源部署在一个区域内，并且在各个区域之间具有冗余性。\
    \ 这些资源提供的服务不会因为区域故障而中断。 结果，利用区域资源确保了更高的可用性。\n\n*   **多区域资源**：一些关键任务服务在区域间冗余部署。\
    \ 由于地区之间的地理隔离，服务需要与延迟和一致性之间的权衡取舍一致。 这些折衷是基于服务和可接受的**服务级别协议**（**SLA**）选择的。 部署在多区域资源上的服务中的数据不属于特定区域，并保持流动性。\
    \ 可以跨区域传输数据以满足服务级别。\n\n考虑到现有的可用容量和对云计算资源的需求预测，Google 已经在跨地区扩展其业务范围。 通过使用机器学习算法，可以确保最佳利用容量。\
    \ 从 AI 从业者的角度来看，GCP 提供了可靠的平台，因此我们可以利用无服务器架构范例专注于构建出色的应用。\n\n在下一节中，我们将研究 GCP 的各个组件并熟悉该接口。\
    \ 这是本书中对平台的基本介绍。\n\n# GCP 概述\n\n尽管任何云平台都可以作为虚拟服务通过网络使用，但其核心是系统和物理资源。 如上一节所述，GCP\
    \ 创建了一个数据中心全球网络，该网络可提供跨区域和区域的服务冗余性，从而提供可靠性。 选择更靠近客户端位置的区域的优势之一是较低的延迟，这在我们处理大量数据传输时起着重要作用。\
    \ 这些用例需要事件时间和处理时间之间的最小延迟。 GCP 上的所有资源（例如存储和计算）都被视为服务。 该范例称为**一切即服务**（**XaaS**）。\
    \ 这包括 IaaS，**平台即服务**（**PaaS**）等。 GCP 上的资源和服务根据抽象性和适用性级别分为全球，区域和区域。 组织在 GCP 上管理的任何资源都必须是项目的一部分。\
    \ 项目是组织提供的所有资源的顶级抽象。 项目具有各种属性，元数据，资源和访问控制。 项目边界内的资源根据区域和区域限制相互连接，并与内部网络进行通信。 但是，跨项目的资源可能会通过外部网络进行通信。\
    \ 在 GCP 中，项目由项目名称，项目 ID 和项目编号唯一标识。\n\nGCP 提供了 Web 界面控制台，**命令行界面**（**CLI**）和 Cloud\
    \ Shell，以与各种服务进行交互。 这是 GCP 控制台的屏幕截图：\n\n![](Images/7346e3b5541d28f62c3e8ccc1f92c771.png)\n\
    \n云**服务开发套件**（**SDK**）提供了一个称为`gcloud`的 CLI 工具，可用于执行所有配置并与平台进行交互。 它也可以用于开发工作流程的管理。\
    \ Cloud Shell 提供了与 GCP 进行交互的类似界面，Cloud Shell 是一个基于浏览器的临时 Shell 环境，可以从云控制台内部进行访问。\n\
    \n# 人工智能构建块\n\n为了构建智能机器或系统，需要一些基本的构建块。 “数据”是 AI 开发和大规模采用的核心。 在本节中，我们将回顾围绕数据的所有构造块。\
    \ 这是显示 AI 的所有构建块的图：\n\n![](Images/907e88cfe348a5f280897f968a5ece8a.png)\n\n# 数据\n\
    \n可以与人类能力相匹配的智能机器的一般概念是在大约一个世纪前提出的，为创建这些智能机器投入了大量的思考和研究。 这些努力为现代 AI 奠定了基础。 但是，研究受到可用数据存储和处理能力的限制，因为构成\
    \ AI 基础的机器学习模型需要大量的数据来进行训练，并且需要大量的处理能力来进行算法计算。 由于我们可以存储和处理的数据量很大，现在恢复了 AI 研究领域。\
    \ 数据是 AI 构建块的核心和焦点。 数据容量分为三个区域：存储，处理和数据驱动的操作。\n\n# 存储\n\n从本世纪初开始，我们已经看到数字化和存储数字资产的能力急剧上升。\
    \ 由于采用了云计算，通用存储容量的可访问性也得到了显着提高。 在云计算范例中，存储作为服务可用，不需要采购和管理与存储相关的基础架构。 结果，用于 AI\
    \ 研究的数据资产的可用性呈指数增长。 下图说明了一段时间内存储容量的增长。 商店的需求正在成倍增长，并且超出了我们目前的限制。 这正在迅速发生。 为了坚持数据量增长的速度，我们描述了一个超出范围的规模：\n\
    \n![](Images/785f1762653deb00eb3b86d50160d3d2.png)\n\n# 处理\n\n由于分布式计算框架，我们还看到了整体处理能力的提高。\
    \ 处理单元分布在各种机器上，以进行并行处理和计算。 框架负责跟踪跨节点的计算，并整合从可行见解中得出的结果。 由于云计算范例（其中计算可作为服务使用），处理能力也大大提高。\
    \ 在这种情况下，无需为大型数据处理而采购和管理专门的基础架构。 通过增加的处理能力，我们现在能够通过利用大量数据来尝试机器学习算法。 反过来，这又推动了\
    \ AI 领域的快速发展。\n\n# 动作\n\n由于可获得大量数据，并且能够处理这些数据以获取有意义的见解的处理能力，我们能够根据概率模型预测未来的事件和行动。\
    \ 这些操作基于数据而不是主观判断。 智能机器的基本组成部分之一是根据环境情况采取行动的能力。 该行为应为智能体带来最大的回报。 AI 系统需要促进基于数据的行动而不是主观的人类判断，以便充分增强人类的能力。\n\
    \n# 自然语言处理\n\n任何 AI 系统的关键组件之一是智能机器和智能体程序的**自然语言处理**（**NLP**）接口。 与具有 AI 功能的系统的交互必须以人与人之间交互的自然方式进行。\
    \ 由于我们交流的程度和模糊性，语言处理非常复杂。 人类语音的合成和分析可以通过使用大量训练数据训练**深度神经网络**（**DNNs**）来实现。 尽管\
    \ DNN 中有大量数据，但是由于语言中的语义变化，很难达到相同的准确率。 但是，NLP 是 AI 的基本构建块。 在本书的后面，我们将研究 GCP 上可用于\
    \ NLP 的各种选项和工具。\n\n# 语音识别\n\n为了使与智能机的接口尽可能接近人机交互，我们需要语音识别功能。 指令需要作为语音命令给出，并且我们需要复杂的语音识别引擎才能将口语单词转换为机器可读格式。\
    \ 同样，由于各个人说特定单词的方式有所不同，因此语音识别系统很难获得 100% 的准确率。 该接口需要针对特定​​个人进行校准和训练，并且通用模型需要不断增强，以提高语音识别引擎的整体效率。\n\
    \n# 机器视觉\n\n为了使 AI 系统充分增强人类的能力，它需要开发一种方法，通过建立以类似于人眼的方式处理视觉信息的能力来收集对环境上下文的理解。 摄像机捕获了视觉效果，并且需要使用大量视频数据来训练模型，以便对环境进行准确的了解。\
    \ 机器视觉是 AI 的关键元素。 在接下来的章节中，我们将探索机器视觉 API，以及 GCP 中的示例代码。\n\n# 信息处理与推理\n\n人类善于处理各种感官收集的信息，并善于运用推理以有意义的方式对这些感官做出反应。\
    \ 智能机器需要类似的功能才能模仿和增强人类的能力。 在 AI 系统的情况下，推理可以基于大量的训练数据以及强化学习引擎。 基于信息的环境上下文的逻辑推理是\
    \ AI 系统的关键组成部分。\n\n# 规划与探索\n\n人脑可以轻松执行的最先进的功能之一是提前计划事件和行动。 此技能要求探索过去的数据以及当前的上下文数据和实时信息。\
    \ 这些行动是根据牢记的短期和长期目标制定的。 智能体需要具有探索上下文环境数据并根据过去可用数据进行计划的能力。 在地理地图上浏览是规划和探索 AI 功能的一个很好的例子。\
    \ 制图应用可以基于实时数据探索来建议特定时刻的最佳路线，并且可以基于沿途遇到的新信息来调整路线图。\n\n# 处理和控制\n\n一些智能体还需要能够处理和控制物理对象。\
    \ 这包括工业机器人，这些机器人在装配线上处理各种机器零件，将它们放置在正确的位置，然后根据预定义的例程进行应用。 这种类型的系统需要具有一定程度的模糊性以及可以根据环境运行的自学习循环。\
    \ 不可能为所有可能的情况编程处理和控制功能。 需要以这样的方式构建模型：智能体可以根据环境状态的变化采取行动，同时仍能最大化环境中智能体的总体报酬。\n\n\
    # 导航和移动\n\n智能体需要能够在物理环境中导航和移动。 自动驾驶汽车或自动驾驶汽车是 AI 系统功能的示例。 为了建立这种能力，需要对智能体进行全面的实际生活中可能遇到的路况训练。\
    \ DNN 还需要在尽可能多的场景中进行训练。 真实（非训练）环境中的模型执行需要非常高效，以使智能体能够在关键任务环境中生存，而该任务关键环境要求智能体的事件时间和行动时间之间的等待时间极低。\n\
    \n# 语音生成\n\n为了使智能体以自然形式交互，它需要能够生成人类语音。 启用语音的系统现在已成为主流，并且比语音到文本的界面更容易构建。 Google\
    \ 提供了易于使用的语音生成 API。 我们将在本章的下一部分中查看这些 API 和服务，并在本书后面的章节中探索详细的示例。\n\n# 图像生成\n\n\
    图像生成功能是 AI 系统的另一个组成部分。 图像经过处理和重新格式化，以便从像素数据中获取更多含义和信息。 图像生成功能可用于医学图像处理以及高端法医研究。\n\
    \n在下一节中，我们将介绍 GCP 中可用于促进 AI 各个构建模块的工具。\n\n# GCP 上可用的 AI 工具\n\nGoogle 简化了在 GCP\
    \ 上使用现成的 AI 构建块构建 AI 系统的过程。 GCP 上提供了三类组件和工具：视觉，语言和会话。\n\n# Sight\n\nSight 是指智能机器的可视界面。\
    \ GCP 提供以下用于视觉信息和情报的 API：\n\n*   **Cloud Vision API**：这是在 GCP 上经过预先训练的模型之上的**表述性状态转移**（**REST**）API\
    \ 抽象。 API 可以将图像分为通用类别和特定对象。 它还可以读取图像中的文本。 随 Cloud Vision API 开箱即用地提供了图像元数据管理以及对特定应用不需要的内容的审核。\
    \ 从图像中收集见解非常简单，无缝。 此 API 的一些常见用例是图像搜索，文档分类和产品搜索（零售）。 下图显示了 Cloud Vision API 的各种应用和用例：\n\
    \n![](Images/f307aa14b74df8915be0cdeb976fbaee.png)\n\n*   **Cloud Video Intelligence\
    \ API**：这是一种 REST API，可以从视频供稿中提取信息，并可以从视频数据中搜索和提取元数据。 该 API 易于使用，并且包含超过 20,000\
    \ 个预定义标签的列表。 该 API 还提供了视频标签和内容之间的互操作性，当视频资产存储在 Google Cloud Storage 中时，可以跨视频资产进行基于文本的搜索。\
    \ 下图显示了 Cloud Video Intelligence API 的各种应用和用例：\n\n![](Images/bbab4592c1709af5c6a39da128bd4e90.png)\n\
    \n*   **AutoML Vision**：此服务可以定制训练模型以对视觉图像进行分类。 可以使用易于使用的界面对模型进行训练和评估。 也可以使用唯一的名称空间注册它们，以便通过\
    \ AutoML API 使用它们。 如果用户有大量要标记的图像，则可以使用人工标记服务来补充 AutoML Vision API。 可以通过 AutoML\
    \ Vision 用户界面直接启动人工标签。\n\n# 语言\n\nGCP 通过翻译和自然语言 API 提供用于语言信息和情报的 API，如下所示：\n\n\
    *   **Cloud Translation API**：此 API 根据预先训练的模型以及可以使用 AutoML 翻译框架进行训练的自定义模型，在两种语言之间提供双向翻译。\
    \ 当源文本的语言未知时，API 还可促进语言检测。 与其他 AI 服务类似，翻译服务也可用作 REST API，用于在应用内进行编程访问和集成。 在撰写本文时，支持\
    \ 100 种语言。 无需显式解析即可翻译 HTML 内容的独特功能使提供网页翻译以及创建多语言站点和应用变得容易。\n\n*   **Cloud Natural\
    \ Language API**：此 API 提供了对基于预训练模型以及可以使用 AutoML Natural Language 框架进行训练的自定义模型的非结构化文本和音频数据的见解。\
    \ API 可以根据各种形式的非结构化文本来收集有关人员，地点，事件，情感等的信息。 在内部，该服务利用丰富的本体图和不断发展的模型来提高准确率。 此 API\
    \ 可能会使用的一些常见用例是客户情感分析和产品分类（零售市场研究）。 易于使用的 REST API 有助于语法分析，实体识别，情感分析和内容分类，并支持多种语言。\n\
    \nGCP 提供了 API，可通过 Dialogflow 和 Google Cloud TTS/STT API 与智能机实现语音和对话界面。\n\n# 对话\n\
    \n对话界面是支持 AI 的应用的重要方面。 GCP 提供了 Dialogflow 引擎，用于通过简单的界面和 API 创建企业级的对话应用，如下所示：\n\
    \n*   **Dialogflow Enterprise Edition**：此服务使用预先训练好的随时可用的底层深度学习模型，为应用的会话界面创建提供便利。\
    \ 会话服务可用于具有网站，移动应用甚至**物联网**（**IoT**）设备的用户的自然界面。 在编写本书时，该服务支持 20 种语言的对话界面。 Dialogflow\
    \ 与 Natural Language API 无缝集成，以便在进行实时对话时执行情感分析。 这有助于为客户提供特定于客户的针对性服务。 该界面可能的一些用例包括企业生产率的提高，面向最终客户的自助业务交易以及与\
    \ IoT 设备的自然语言通信。\n\n*   **Cloud TTS API**：此 API 有助于从输入文本合成人类语音。 该服务具有多种语言和变体，可以为应用创建自然语言界面。\
    \ 负责文本到语音转换的机器学习模型已经过预先训练，并且不断发展以提高准确率和保真度，使其尽可能接近自然的人声。 可以通过 TTS API 实现的一些常见用例包括呼叫中心自动化，与\
    \ IoT 设备的交互以及将文本转换为音频以供阅读器使用。\n\n*   **Cloud STT API**：此 API 基于强大的模型，这些模型经过预先训练，可以将音频输入转换为多种语言的文本。\
    \ 该 API 支持实时流式传输或预先录制的音频输入。 它还具有自动检测语言的能力，并支持将短格式和长格式音频片段实时转换为文本。 在编写本书时，语音到文本接口有四类预训练的模型。\
    \ 这些模型适用于特定的用例和对话界面： \n\n    *   `command_and_search`：可用于短命令和语音搜索。\n\n    *  \
    \ `phone_call`：用于来自电话对话的音频。\n\n    *   `video`：适用于作为视频信号一部分或以更高采样率录制的音频。\n\n \
    \   *   `default`：这是通用模型。\n\n本节中列出的所有服务和 API 均可与智能机实现自然的接口，并且是 AI 的构建块。 在本书中，我们将通过代码示例详细探讨这些\
    \ AI 工具。\n\n# 总结"
  fmt: "\nGoogle 通过从头开始构建服务，从而为企业提供云服务时采取了创新的方法。这些服务最初是由 Google 自己内部用于搜索和其他互联网规模的服务而构建的。该平台迅速成熟，形成了一套完整的套件，可用于开发整个简单范围的应用，从简单的\
    \ Web 应用开始，再到微服务和高级分析，这些功能利用了大量的结构化和非结构化数据以及 GPU 和**张量处理单元（TPU）**，用于训练计算密集型模型。在本书的“第\
    \ 7 章”“了解云 TPU”中，我们将深入研究 TPU 并详细了解 TPU。在本书中，我们将详细了解 GCP 的各个组成部分，并将专门研究如何利用 GCP\
    \ 将**人工智能（AI）**工作负载以及各种应用的无缝集成部署为服务。\n\n尽管 Cloud First 策略在实现实实在在的利益方面具有公认的优势，但由于接下来要说明的原因，云的采用也受到了批评。\n\
    \n# 云优先策略的反模式\n\n尽管云计算是一个新的范例，但仍需要解决某些基本假设和一致的连接性和安全性要求。以下是“云优先”策略的一些反模式：\n\n\
    ## 停机时间\n\n云服务完全取决于可靠的互联网连接的可用性。当关键业务应用部署在云上时，互联网停机的风险和影响会增加。但是，停机风险在本地部署中同样普遍，并且需要仔细考虑架构模式以最大程度地减少这些风险。借助云，应在设计服务时考虑到高可用性、冗余和灾难恢复。云供应商为云基础架构提供了多个可用性区域。应用应利用这些冗余区域来部署关键服务。在下一部分中，我们将了解\
    \ Google 如何通过地理位置分散的数据中心来减轻停机风险。\n\n## 安全性和私密性\n\n许多管理敏感数据资产的企业在采用云时都担心数据的安全性和私密性。云是共享空间，因此，风险显而易见。但是，以下策略可以轻松应对反模式：\n\
    \n*   在所有部署级别上实现安全治理实践和流程。\n*   实现精心定义的访问控制级别，并为所有用户和进程提供最低级别的访问。如有疑问，请提供比访问服务和基础结构的更广泛的网络访问更多的受限访问。\n\
    *   对所有用户帐户实现多因素认证。\n*   在所有端点上部署异常检测程序并持续监视云基础架构（自动以及基于样本的手动监视）。\n\n云服务提供商已在保护这些反模式方面进行了大量投资，并且云部署此时与本地部署一样可靠和安全。\n\
    \n在下一节中，我们将根据地理区域和服务可用性来查看 Google 数据中心的当前状态。\n\n# Google 数据中心\n\n作为互联网规模的数据托管人，Google\
    \ 建立了完善的数据中心网络。现在，相同的基础结构可用于 GCP。在撰写本文时，GCP 拥有 18 个全球区域，分为 55 个区域，分布在 35 个国家/地区。以下屏幕快照显示了全球\
    \ GCP 区域：\n\n![](Images/7872cbe8754e9ef5a559fa396190f268.png)\n\n这些地区分为“美洲”（北美和南美）、“欧洲”和“亚太地区”。选择正确的区域和区域对于确保服务和数据的延迟、可用性以及持久性处于可接受的水平至关重要。确保区域内位置之间的网络数据包的往返延迟为亚毫秒级的\
    \ 95%。部署在区域内单个区域上的服务将不会容错。在这种情况下，区域故障将导致服务中断。为了开发容错应用，需要跨区域部署。对于关键任务应用，应实现多区域部署策略。根据应用和服务的关键级别，将资源分类如下：\n\
    \n*   **区域资源**：这些资源在区域内操作。在这种情况下，如果该区域不可用，则该服务将变得不可访问。计算引擎是区域资源，因为如果基础数据可用，则可以恢复计算。如果包含计算引擎实例的区域出现故障，则一旦该区域可用，就需要重新启动计算。\n\
    *   **区域资源**：这些资源部署在一个区域内，并且在各个区域之间具有冗余性。这些资源提供的服务不会因为区域故障而中断。结果，利用区域资源确保了更高的可用性。\n\
    *   **多区域资源**：一些关键任务服务在区域间冗余部署。由于地区之间的地理隔离，服务需要与延迟和一致性之间的权衡取舍一致。这些折衷是基于服务和可接受的**服务级别协议（SLA）**选择的。部署在多区域资源上的服务中的数据不属于特定区域，并保持流动性。可以跨区域传输数据以满足服务级别。\n\
    \n考虑到现有的可用容量和对云计算资源的需求预测，Google 已经在跨地区扩展其业务范围。通过使用机器学习算法，可以确保最佳利用容量。从 AI 从业者的角度来看，GCP\
    \ 提供了可靠的平台，因此我们可以利用无服务器架构范例专注于构建出色的应用。\n\n在下一节中，我们将研究 GCP 的各个组件并熟悉该接口。这是本书中对平台的基本介绍。\n\
    \n# GCP 概述\n\n尽管任何云平台都可以作为虚拟服务通过网络使用，但其核心是系统和物理资源。如上一节所述，GCP 创建了一个数据中心全球网络，该网络可提供跨区域和区域的服务冗余性，从而提供可靠性。选择更靠近客户端位置的区域的优势之一是较低的延迟，这在我们处理大量数据传输时起着重要作用。这些用例需要事件时间和处理时间之间的最小延迟。GCP\
    \ 上的所有资源（例如存储和计算）都被视为服务。该范例称为**一切即服务（XaaS）**。这包括 IaaS、**平台即服务（PaaS）**等。GCP 上的资源和服务根据抽象性和适用性级别分为全球、区域和区域。组织在\
    \ GCP 上管理的任何资源都必须是项目的一部分。项目是组织提供的所有资源的顶级抽象。项目具有各种属性、元数据、资源和访问控制。项目边界内的资源根据区域和区域限制相互连接，并与内部网络进行通信。但是，跨项目的资源可能会通过外部网络进行通信。在\
    \ GCP 中，项目由项目名称、项目 ID 和项目编号唯一标识。\n\nGCP 提供了 Web 界面控制台、**命令行界面（CLI）**和 Cloud Shell，以与各种服务进行交互。这是\
    \ GCP 控制台的屏幕截图：\n\n![](Images/7346e3b5541d28f62c3e8ccc1f92c771.png)\n\n云**服务开发套件（SDK）**提供了一个称为`gcloud`的\
    \ CLI 工具，可用于执行所有配置并与平台进行交互。它也可以用于开发工作流程的管理。Cloud Shell 提供了与 GCP 进行交互的类似界面，Cloud\
    \ Shell 是一个基于浏览器的临时 Shell 环境，可以从云控制台内部进行访问。\n\n# 人工智能构建块\n\n为了构建智能机器或系统，需要一些基本的构建块。“数据”是\
    \ AI 开发和大规模采用的核心。在本节中，我们将回顾围绕数据的所有构造块。这是显示 AI 的所有构建块的图：\n\n![](Images/907e88cfe348a5f280897f968a5ece8a.png)\n\
    \n## 数据\n\n可以与人类能力相匹配的智能机器的一般概念是在大约一个世纪前提出的，为创建这些智能机器投入了大量的思考和研究。这些努力为现代 AI 奠定了基础。但是，研究受到可用数据存储和处理能力的限制，因为构成\
    \ AI 基础的机器学习模型需要大量的数据来进行训练，并且需要大量的处理能力来进行算法计算。由于我们可以存储和处理的数据量很大，现在恢复了 AI 研究领域。数据是\
    \ AI 构建块的核心和焦点。数据容量分为三个区域：存储、处理和数据驱动的操作。\n\n### 存储\n\n从本世纪初开始，我们已经看到数字化和存储数字资产的能力急剧上升。由于采用了云计算，通用存储容量的可访问性也得到了显着提高。在云计算范例中，存储作为服务可用，不需要采购和管理与存储相关的基础架构。结果，用于\
    \ AI 研究的数据资产的可用性呈指数增长。下图说明了一段时间内存储容量的增长。商店的需求正在成倍增长，并且超出了我们目前的限制。这正在迅速发生。为了坚持数据量增长的速度，我们描述了一个超出范围的规模：\n\
    \n![](Images/785f1762653deb00eb3b86d50160d3d2.png)\n\n### 处理\n\n由于分布式计算框架，我们还看到了整体处理能力的提高。处理单元分布在各种机器上，以进行并行处理和计算。框架负责跟踪跨节点的计算，并整合从可行见解中得出的结果。由于云计算范例（其中计算可作为服务使用），处理能力也大大提高。在这种情况下，无需为大型数据处理而采购和管理专门的基础架构。通过增加的处理能力，我们现在能够通过利用大量数据来尝试机器学习算法。反过来，这又推动了\
    \ AI 领域的快速发展。\n\n### 动作\n\n由于可获得大量数据，并且能够处理这些数据以获取有意义的见解的处理能力，我们能够根据概率模型预测未来的事件和行动。这些操作基于数据而不是主观判断。智能机器的基本组成部分之一是根据环境情况采取行动的能力。该行为应为智能体带来最大的回报。AI\
    \ 系统需要促进基于数据的行动而不是主观的人类判断，以便充分增强人类的能力。\n\n## 自然语言处理\n\n任何 AI 系统的关键组件之一是智能机器和智能体程序的**自然语言处理（NLP）**接口。与具有\
    \ AI 功能的系统的交互必须以人与人之间交互的自然方式进行。由于我们交流的程度和模糊性，语言处理非常复杂。人类语音的合成和分析可以通过使用大量训练数据训练**深度神经网络（DNNs）**来实现。尽管\
    \ DNN 中有大量数据，但是由于语言中的语义变化，很难达到相同的准确率。但是，NLP 是 AI 的基本构建块。在本书的后面，我们将研究 GCP 上可用于\
    \ NLP 的各种选项和工具。\n\n## 语音识别\n\n为了使与智能机的接口尽可能接近人机交互，我们需要语音识别功能。指令需要作为语音命令给出，并且我们需要复杂的语音识别引擎才能将口语单词转换为机器可读格式。同样，由于各个人说特定单词的方式有所不同，因此语音识别系统很难获得\
    \ 100% 的准确率。该接口需要针对特定个人进行校准和训练，并且通用模型需要不断增强，以提高语音识别引擎的整体效率。\n\n## 机器视觉\n\n为了使\
    \ AI 系统充分增强人类的能力，它需要开发一种方法，通过建立以类似于人眼的方式处理视觉信息的能力来收集对环境上下文的理解。摄像机捕获了视觉效果，并且需要使用大量视频数据来训练模型，以便对环境进行准确的了解。机器视觉是\
    \ AI 的关键元素。在接下来的章节中，我们将探索机器视觉 API，以及 GCP 中的示例代码。\n\n## 信息处理与推理\n\n人类善于处理各种感官收集的信息，并善于运用推理以有意义的方式对这些感官做出反应。智能机器需要类似的功能才能模仿和增强人类的能力。在\
    \ AI 系统的情况下，推理可以基于大量的训练数据以及强化学习引擎。基于信息的环境上下文的逻辑推理是 AI 系统的关键组成部分。\n\n## 规划与探索\n\
    \n人脑可以轻松执行的最先进的功能之一是提前计划事件和行动。此技能要求探索过去的数据以及当前的上下文数据和实时信息。这些行动是根据牢记的短期和长期目标制定的。智能体需要具有探索上下文环境数据并根据过去可用数据进行计划的能力。在地理地图上浏览是规划和探索\
    \ AI 功能的一个很好的例子。制图应用可以基于实时数据探索来建议特定时刻的最佳路线，并且可以基于沿途遇到的新信息来调整路线图。\n\n## 处理和控制\n\
    \n一些智能体还需要能够处理和控制物理对象。这包括工业机器人，这些机器人在装配线上处理各种机器零件，将它们放置在正确的位置，然后根据预定义的例程进行应用。这种类型的系统需要具有一定程度的模糊性以及可以根据环境运行的自学习循环。不可能为所有可能的情况编程处理和控制功能。需要以这样的方式构建模型：智能体可以根据环境状态的变化采取行动，同时仍能最大化环境中智能体的总体报酬。\n\
    \n## 导航和移动\n\n智能体需要能够在物理环境中导航和移动。自动驾驶汽车或自动驾驶汽车是 AI 系统功能的示例。为了建立这种能力，需要对智能体进行全面的实际生活中可能遇到的路况训练。DNN\
    \ 还需要在尽可能多的场景中进行训练。真实（非训练）环境中的模型执行需要非常高效，以使智能体能够在关键任务环境中生存，而该任务关键环境要求智能体的事件时间和行动时间之间的等待时间极低。\n\
    \n## 语音生成\n\n为了使智能体以自然形式交互，它需要能够生成人类语音。启用语音的系统现在已成为主流，并且比语音到文本的界面更容易构建。Google\
    \ 提供了易于使用的语音生成 API。我们将在本章的下一部分中查看这些 API 和服务，并在本书后面的章节中探索详细的示例。\n\n## 图像生成\n\n\
    图像生成功能是 AI 系统的另一个组成部分。图像经过处理和重新格式化，以便从像素数据中获取更多含义和信息。图像生成功能可用于医学图像处理以及高端法医研究。\n\
    \n在下一节中，我们将介绍 GCP 中可用于促进 AI 各个构建模块的工具。\n\n# GCP 上可用的 AI 工具\n\nGoogle 简化了在 GCP\
    \ 上使用现成的 AI 构建块构建 AI 系统的过程。GCP 上提供了三类组件和工具：视觉、语言和会话。\n\n## Sight（视觉）\n\nSight\
    \ 是指智能机器的可视界面。GCP 提供以下用于视觉信息和情报的 API：\n\n*   **Cloud Vision API**：这是在 GCP 上经过预先训练的模型之上的**表述性状态转移（REST）**API\
    \ 抽象。API 可以将图像分为通用类别和特定对象。它还可以读取图像中的文本。随 Cloud Vision API 开箱即用地提供了图像元数据管理以及对特定应用不需要的内容的审核。从图像中收集见解非常简单，无缝。此\
    \ API 的一些常见用例是图像搜索、文档分类和产品搜索（零售）。下图显示了 Cloud Vision API 的各种应用和用例：\n\n![](Images/f307aa14b74df8915be0cdeb976fbaee.png)\n\
    \n*   **Cloud Video Intelligence API**：这是一种 REST API，可以从视频供稿中提取信息，并可以从视频数据中搜索和提取元数据。该\
    \ API 易于使用，并且包含超过 20,000 个预定义标签的列表。该 API 还提供了视频标签和内容之间的互操作性，当视频资产存储在 Google Cloud\
    \ Storage 中时，可以跨视频资产进行基于文本的搜索。下图显示了 Cloud Video Intelligence API 的各种应用和用例：\n\n\
    ![](Images/bbab4592c1709af5c6a39da128bd4e90.png)\n\n*   **AutoML Vision**：此服务可以定制训练模型以对视觉图像进行分类。可以使用易于使用的界面对模型进行训练和评估。也可以使用唯一的名称空间注册它们，以便通过\
    \ AutoML API 使用它们。如果用户有大量要标记的图像，则可以使用人工标记服务来补充 AutoML Vision API。可以通过 AutoML Vision\
    \ 用户界面直接启动人工标签。\n\n## 语言\n\nGCP 通过翻译和自然语言 API 提供用于语言信息和情报的 API，如下所示：\n\n*   **Cloud\
    \ Translation API**：此 API 根据预先训练的模型以及可以使用 AutoML 翻译框架进行训练的自定义模型，在两种语言之间提供双向翻译。当源文本的语言未知时，API\
    \ 还可促进语言检测。与其他 AI 服务类似，翻译服务也可用作 REST API，用于在应用内进行编程访问和集成。在撰写本文时，支持 100 种语言。无需显式解析即可翻译\
    \ HTML 内容的独特功能使提供网页翻译以及创建多语言站点和应用变得容易。\n*   **Cloud Natural Language API**：此 API\
    \ 提供了对基于预训练模型以及可以使用 AutoML Natural Language 框架进行训练的自定义模型的非结构化文本和音频数据的见解。API 可以根据各种形式的非结构化文本来收集有关人员、地点、事件、情感等的信息。在内部，该服务利用丰富的本体图和不断发展的模型来提高准确率。此\
    \ API 可能会使用的一些常见用例是客户情感分析和产品分类（零售市场研究）。易于使用的 REST API 有助于语法分析、实体识别、情感分析和内容分类，并支持多种语言。\n\
    \n## 对话\n\nGCP 提供了 API，可通过 Dialogflow 和 Google Cloud TTS/STT API 与智能机实现语音和对话界面。对话界面是支持\
    \ AI 的应用的重要方面。GCP 提供了 Dialogflow 引擎，用于通过简单的界面和 API 创建企业级的对话应用，如下所示：\n\n*   **Dialogflow\
    \ Enterprise Edition**：此服务使用预先训练好的随时可用的底层深度学习模型，为应用的会话界面创建提供便利。会话服务可用于具有网站、移动应用甚至**物联网（IoT）**设备的用户的自然界面。在编写本书时，该服务支持\
    \ 20 种语言的对话界面。Dialogflow 与 Natural Language API 无缝集成，以便在进行实时对话时执行情感分析。这有助于为客户提供特定于客户的针对性服务。该界面可能的一些用例包括企业生产率的提高、面向最终客户的自助业务交易以及与\
    \ IoT 设备的自然语言通信。\n*   **Cloud TTS API**：此 API 有助于从输入文本合成人类语音。该服务具有多种语言和变体，可以为应用创建自然语言界面。负责文本到语音转换的机器学习模型已经过预先训练，并且不断发展以提高准确率和保真度，使其尽可能接近自然的人声。可以通过\
    \ TTS API 实现的一些常见用例包括呼叫中心自动化、与 IoT 设备的交互以及将文本转换为音频以供阅读器使用。\n*   **Cloud STT API**：此\
    \ API 基于强大的模型，这些模型经过预先训练，可以将音频输入转换为多种语言的文本。该 API 支持实时流式传输或预先录制的音频输入。它还具有自动检测语言的能力，并支持将短格式和长格式音频片段实时转换为文本。在编写本书时，语音到文本接口有四类预训练的模型。这些模型适用于特定的用例和对话界面：\n\
    \    *   `command_and_search`：可用于短命令和语音搜索。\n    *   `phone_call`：用于来自电话对话的音频。\n\
    \    *   `video`：适用于作为视频信号一部分或以更高采样率录制的音频。\n    *   `default`：这是通用模型。\n\n本节中列出的所有服务和\
    \ API 均可与智能机实现自然的接口，并且是 AI 的构建块。在本书中，我们将通过代码示例详细探讨这些 AI 工具。\n\n# 总结\n"
  trans: "\nGoogle 通过从头开始构建服务，从而为企业提供云服务时采取了创新的方法。这些服务最初是由 Google 自己内部用于搜索和其他互联网规模的服务而构建的。该平台迅速成熟，形成了一套完整的套件，可用于开发整个简单范围的应用，从简单的\
    \ Web 应用开始，再到微服务和高级分析，这些功能利用了大量的结构化和非结构化数据以及 GPU 和**张量处理单元（TPU）**，用于训练计算密集型模型。在本书的“第\
    \ 7 章”“了解云 TPU”中，我们将深入研究 TPU 并详细了解 TPU。在本书中，我们将详细了解 GCP 的各个组成部分，并将专门研究如何利用 GCP\
    \ 将**人工智能（AI）**工作负载以及各种应用的无缝集成部署为服务。\n\n尽管 Cloud First 策略在实现实实在在的利益方面具有公认的优势，但由于接下来要说明的原因，云的采用也受到了批评。\n\
    \n# 云优先策略的反模式\n\n尽管云计算是一个新的范例，但仍需要解决某些基本假设和一致的连接性和安全性要求。以下是“云优先”策略的一些反模式：\n\n\
    ## 停机时间\n\n云服务完全取决于可靠的互联网连接的可用性。当关键业务应用部署在云上时，互联网停机的风险和影响会增加。但是，停机风险在本地部署中同样普遍，并且需要仔细考虑架构模式以最大程度地减少这些风险。借助云，应在设计服务时考虑到高可用性、冗余和灾难恢复。云供应商为云基础架构提供了多个可用性区域。应用应利用这些冗余区域来部署关键服务。在下一部分中，我们将了解\
    \ Google 如何通过地理位置分散的数据中心来减轻停机风险。\n\n## 安全性和私密性\n\n许多管理敏感数据资产的企业在采用云时都担心数据的安全性和私密性。云是共享空间，因此，风险显而易见。但是，以下策略可以轻松应对反模式：\n\
    \n*   在所有部署级别上实现安全治理实践和流程。\n*   实现精心定义的访问控制级别，并为所有用户和进程提供最低级别的访问。如有疑问，请提供比访问服务和基础结构的更广泛的网络访问更多的受限访问。\n\
    *   对所有用户帐户实现多因素认证。\n*   在所有端点上部署异常检测程序并持续监视云基础架构（自动以及基于样本的手动监视）。\n\n云服务提供商已在保护这些反模式方面进行了大量投资，并且云部署此时与本地部署一样可靠和安全。\n\
    \n在下一节中，我们将根据地理区域和服务可用性来查看 Google 数据中心的当前状态。\n\n# Google 数据中心\n\n作为互联网规模的数据托管人，Google\
    \ 建立了完善的数据中心网络。现在，相同的基础结构可用于 GCP。在撰写本文时，GCP 拥有 18 个全球区域，分为 55 个区域，分布在 35 个国家/地区。以下屏幕快照显示了全球\
    \ GCP 区域：\n\n![](img/7872cbe8754e9ef5a559fa396190f268.png)\n\n这些地区分为“美洲”（北美和南美）、“欧洲”和“亚太地区”。选择正确的区域和区域对于确保服务和数据的延迟、可用性以及持久性处于可接受的水平至关重要。确保区域内位置之间的网络数据包的往返延迟为亚毫秒级的\
    \ 95%。部署在区域内单个区域上的服务将不会容错。在这种情况下，区域故障将导致服务中断。为了开发容错应用，需要跨区域部署。对于关键任务应用，应实现多区域部署策略。根据应用和服务的关键级别，将资源分类如下：\n\
    \n*   **区域资源**：这些资源在区域内操作。在这种情况下，如果该区域不可用，则该服务将变得不可访问。计算引擎是区域资源，因为如果基础数据可用，则可以恢复计算。如果包含计算引擎实例的区域出现故障，则一旦该区域可用，就需要重新启动计算。\n\
    *   **区域资源**：这些资源部署在一个区域内，并且在各个区域之间具有冗余性。这些资源提供的服务不会因为区域故障而中断。结果，利用区域资源确保了更高的可用性。\n\
    *   **多区域资源**：一些关键任务服务在区域间冗余部署。由于地区之间的地理隔离，服务需要与延迟和一致性之间的权衡取舍一致。这些折衷是基于服务和可接受的**服务级别协议（SLA）**选择的。部署在多区域资源上的服务中的数据不属于特定区域，并保持流动性。可以跨区域传输数据以满足服务级别。\n\
    \n考虑到现有的可用容量和对云计算资源的需求预测，Google 已经在跨地区扩展其业务范围。通过使用机器学习算法，可以确保最佳利用容量。从 AI 从业者的角度来看，GCP\
    \ 提供了可靠的平台，因此我们可以利用无服务器架构范例专注于构建出色的应用。\n\n在下一节中，我们将研究 GCP 的各个组件并熟悉该接口。这是本书中对平台的基本介绍。\n\
    \n# GCP 概述\n\n尽管任何云平台都可以作为虚拟服务通过网络使用，但其核心是系统和物理资源。如上一节所述，GCP 创建了一个数据中心全球网络，该网络可提供跨区域和区域的服务冗余性，从而提供可靠性。选择更靠近客户端位置的区域的优势之一是较低的延迟，这在我们处理大量数据传输时起着重要作用。这些用例需要事件时间和处理时间之间的最小延迟。GCP\
    \ 上的所有资源（例如存储和计算）都被视为服务。该范例称为**一切即服务（XaaS）**。这包括 IaaS、**平台即服务（PaaS）**等。GCP 上的资源和服务根据抽象性和适用性级别分为全球、区域和区域。组织在\
    \ GCP 上管理的任何资源都必须是项目的一部分。项目是组织提供的所有资源的顶级抽象。项目具有各种属性、元数据、资源和访问控制。项目边界内的资源根据区域和区域限制相互连接，并与内部网络进行通信。但是，跨项目的资源可能会通过外部网络进行通信。在\
    \ GCP 中，项目由项目名称、项目 ID 和项目编号唯一标识。\n\nGCP 提供了 Web 界面控制台、**命令行界面（CLI）**和 Cloud Shell，以与各种服务进行交互。这是\
    \ GCP 控制台的屏幕截图：\n\n![](img/7346e3b5541d28f62c3e8ccc1f92c771.png)\n\n云**服务开发套件（SDK）**提供了一个称为`gcloud`的\
    \ CLI 工具，可用于执行所有配置并与平台进行交互。它也可以用于开发工作流程的管理。Cloud Shell 提供了与 GCP 进行交互的类似界面，Cloud\
    \ Shell 是一个基于浏览器的临时 Shell 环境，可以从云控制台内部进行访问。\n\n# 人工智能构建块\n\n为了构建智能机器或系统，需要一些基本的构建块。“数据”是\
    \ AI 开发和大规模采用的核心。在本节中，我们将回顾围绕数据的所有构造块。这是显示 AI 的所有构建块的图：\n\n![](img/907e88cfe348a5f280897f968a5ece8a.png)\n\
    \n## 数据\n\n可以与人类能力相匹配的智能机器的一般概念是在大约一个世纪前提出的，为创建这些智能机器投入了大量的思考和研究。这些努力为现代 AI 奠定了基础。但是，研究受到可用数据存储和处理能力的限制，因为构成\
    \ AI 基础的机器学习模型需要大量的数据来进行训练，并且需要大量的处理能力来进行算法计算。由于我们可以存储和处理的数据量很大，现在恢复了 AI 研究领域。数据是\
    \ AI 构建块的核心和焦点。数据容量分为三个区域：存储、处理和数据驱动的操作。\n\n### 存储\n\n从本世纪初开始，我们已经看到数字化和存储数字资产的能力急剧上升。由于采用了云计算，通用存储容量的可访问性也得到了显着提高。在云计算范例中，存储作为服务可用，不需要采购和管理与存储相关的基础架构。结果，用于\
    \ AI 研究的数据资产的可用性呈指数增长。下图说明了一段时间内存储容量的增长。商店的需求正在成倍增长，并且超出了我们目前的限制。这正在迅速发生。为了坚持数据量增长的速度，我们描述了一个超出范围的规模：\n\
    \n![](img/785f1762653deb00eb3b86d50160d3d2.png)\n\n### 处理\n\n由于分布式计算框架，我们还看到了整体处理能力的提高。处理单元分布在各种机器上，以进行并行处理和计算。框架负责跟踪跨节点的计算，并整合从可行见解中得出的结果。由于云计算范例（其中计算可作为服务使用），处理能力也大大提高。在这种情况下，无需为大型数据处理而采购和管理专门的基础架构。通过增加的处理能力，我们现在能够通过利用大量数据来尝试机器学习算法。反过来，这又推动了\
    \ AI 领域的快速发展。\n\n### 动作\n\n由于可获得大量数据，并且能够处理这些数据以获取有意义的见解的处理能力，我们能够根据概率模型预测未来的事件和行动。这些操作基于数据而不是主观判断。智能机器的基本组成部分之一是根据环境情况采取行动的能力。该行为应为智能体带来最大的回报。AI\
    \ 系统需要促进基于数据的行动而不是主观的人类判断，以便充分增强人类的能力。\n\n## 自然语言处理\n\n任何 AI 系统的关键组件之一是智能机器和智能体程序的**自然语言处理（NLP）**接口。与具有\
    \ AI 功能的系统的交互必须以人与人之间交互的自然方式进行。由于我们交流的程度和模糊性，语言处理非常复杂。人类语音的合成和分析可以通过使用大量训练数据训练**深度神经网络（DNNs）**来实现。尽管\
    \ DNN 中有大量数据，但是由于语言中的语义变化，很难达到相同的准确率。但是，NLP 是 AI 的基本构建块。在本书的后面，我们将研究 GCP 上可用于\
    \ NLP 的各种选项和工具。\n\n## 语音识别\n\n为了使与智能机的接口尽可能接近人机交互，我们需要语音识别功能。指令需要作为语音命令给出，并且我们需要复杂的语音识别引擎才能将口语单词转换为机器可读格式。同样，由于各个人说特定单词的方式有所不同，因此语音识别系统很难获得\
    \ 100% 的准确率。该接口需要针对特定个人进行校准和训练，并且通用模型需要不断增强，以提高语音识别引擎的整体效率。\n\n## 机器视觉\n\n为了使\
    \ AI 系统充分增强人类的能力，它需要开发一种方法，通过建立以类似于人眼的方式处理视觉信息的能力来收集对环境上下文的理解。摄像机捕获了视觉效果，并且需要使用大量视频数据来训练模型，以便对环境进行准确的了解。机器视觉是\
    \ AI 的关键元素。在接下来的章节中，我们将探索机器视觉 API，以及 GCP 中的示例代码。\n\n## 信息处理与推理\n\n人类善于处理各种感官收集的信息，并善于运用推理以有意义的方式对这些感官做出反应。智能机器需要类似的功能才能模仿和增强人类的能力。在\
    \ AI 系统的情况下，推理可以基于大量的训练数据以及强化学习引擎。基于信息的环境上下文的逻辑推理是 AI 系统的关键组成部分。\n\n## 规划与探索\n\
    \n人脑可以轻松执行的最先进的功能之一是提前计划事件和行动。此技能要求探索过去的数据以及当前的上下文数据和实时信息。这些行动是根据牢记的短期和长期目标制定的。智能体需要具有探索上下文环境数据并根据过去可用数据进行计划的能力。在地理地图上浏览是规划和探索\
    \ AI 功能的一个很好的例子。制图应用可以基于实时数据探索来建议特定时刻的最佳路线，并且可以基于沿途遇到的新信息来调整路线图。\n\n## 处理和控制\n\
    \n一些智能体还需要能够处理和控制物理对象。这包括工业机器人，这些机器人在装配线上处理各种机器零件，将它们放置在正确的位置，然后根据预定义的例程进行应用。这种类型的系统需要具有一定程度的模糊性以及可以根据环境运行的自学习循环。不可能为所有可能的情况编程处理和控制功能。需要以这样的方式构建模型：智能体可以根据环境状态的变化采取行动，同时仍能最大化环境中智能体的总体报酬。\n\
    \n## 导航和移动\n\n智能体需要能够在物理环境中导航和移动。自动驾驶汽车或自动驾驶汽车是 AI 系统功能的示例。为了建立这种能力，需要对智能体进行全面的实际生活中可能遇到的路况训练。DNN\
    \ 还需要在尽可能多的场景中进行训练。真实（非训练）环境中的模型执行需要非常高效，以使智能体能够在关键任务环境中生存，而该任务关键环境要求智能体的事件时间和行动时间之间的等待时间极低。\n\
    \n## 语音生成\n\n为了使智能体以自然形式交互，它需要能够生成人类语音。启用语音的系统现在已成为主流，并且比语音到文本的界面更容易构建。Google\
    \ 提供了易于使用的语音生成 API。我们将在本章的下一部分中查看这些 API 和服务，并在本书后面的章节中探索详细的示例。\n\n## 图像生成\n\n\
    图像生成功能是 AI 系统的另一个组成部分。图像经过处理和重新格式化，以便从像素数据中获取更多含义和信息。图像生成功能可用于医学图像处理以及高端法医研究。\n\
    \n在下一节中，我们将介绍 GCP 中可用于促进 AI 各个构建模块的工具。\n\n# GCP 上可用的 AI 工具\n\nGoogle 简化了在 GCP\
    \ 上使用现成的 AI 构建块构建 AI 系统的过程。GCP 上提供了三类组件和工具：视觉、语言和会话。\n\n## Sight（视觉）\n\nSight\
    \ 是指智能机器的可视界面。GCP 提供以下用于视觉信息和情报的 API：\n\n*   **Cloud Vision API**：这是在 GCP 上经过预先训练的模型之上的**表述性状态转移（REST）**API\
    \ 抽象。API 可以将图像分为通用类别和特定对象。它还可以读取图像中的文本。随 Cloud Vision API 开箱即用地提供了图像元数据管理以及对特定应用不需要的内容的审核。从图像中收集见解非常简单，无缝。此\
    \ API 的一些常见用例是图像搜索、文档分类和产品搜索（零售）。下图显示了 Cloud Vision API 的各种应用和用例：\n\n![](img/f307aa14b74df8915be0cdeb976fbaee.png)\n\
    \n*   **Cloud Video Intelligence API**：这是一种 REST API，可以从视频供稿中提取信息，并可以从视频数据中搜索和提取元数据。该\
    \ API 易于使用，并且包含超过 20,000 个预定义标签的列表。该 API 还提供了视频标签和内容之间的互操作性，当视频资产存储在 Google Cloud\
    \ Storage 中时，可以跨视频资产进行基于文本的搜索。下图显示了 Cloud Video Intelligence API 的各种应用和用例：\n\n\
    ![](img/bbab4592c1709af5c6a39da128bd4e90.png)\n\n*   **AutoML Vision**：此服务可以定制训练模型以对视觉图像进行分类。可以使用易于使用的界面对模型进行训练和评估。也可以使用唯一的名称空间注册它们，以便通过\
    \ AutoML API 使用它们。如果用户有大量要标记的图像，则可以使用人工标记服务来补充 AutoML Vision API。可以通过 AutoML Vision\
    \ 用户界面直接启动人工标签。\n\n## 语言\n\nGCP 通过翻译和自然语言 API 提供用于语言信息和情报的 API，如下所示：\n\n*   **Cloud\
    \ Translation API**：此 API 根据预先训练的模型以及可以使用 AutoML 翻译框架进行训练的自定义模型，在两种语言之间提供双向翻译。当源文本的语言未知时，API\
    \ 还可促进语言检测。与其他 AI 服务类似，翻译服务也可用作 REST API，用于在应用内进行编程访问和集成。在撰写本文时，支持 100 种语言。无需显式解析即可翻译\
    \ HTML 内容的独特功能使提供网页翻译以及创建多语言站点和应用变得容易。\n*   **Cloud Natural Language API**：此 API\
    \ 提供了对基于预训练模型以及可以使用 AutoML Natural Language 框架进行训练的自定义模型的非结构化文本和音频数据的见解。API 可以根据各种形式的非结构化文本来收集有关人员、地点、事件、情感等的信息。在内部，该服务利用丰富的本体图和不断发展的模型来提高准确率。此\
    \ API 可能会使用的一些常见用例是客户情感分析和产品分类（零售市场研究）。易于使用的 REST API 有助于语法分析、实体识别、情感分析和内容分类，并支持多种语言。\n\
    \n## 对话\n\nGCP 提供了 API，可通过 Dialogflow 和 Google Cloud TTS/STT API 与智能机实现语音和对话界面。对话界面是支持\
    \ AI 的应用的重要方面。GCP 提供了 Dialogflow 引擎，用于通过简单的界面和 API 创建企业级的对话应用，如下所示：\n\n*   **Dialogflow\
    \ Enterprise Edition**：此服务使用预先训练好的随时可用的底层深度学习模型，为应用的会话界面创建提供便利。会话服务可用于具有网站、移动应用甚至**物联网（IoT）**设备的用户的自然界面。在编写本书时，该服务支持\
    \ 20 种语言的对话界面。Dialogflow 与 Natural Language API 无缝集成，以便在进行实时对话时执行情感分析。这有助于为客户提供特定于客户的针对性服务。该界面可能的一些用例包括企业生产率的提高、面向最终客户的自助业务交易以及与\
    \ IoT 设备的自然语言通信。\n*   **Cloud TTS API**：此 API 有助于从输入文本合成人类语音。该服务具有多种语言和变体，可以为应用创建自然语言界面。负责文本到语音转换的机器学习模型已经过预先训练，并且不断发展以提高准确率和保真度，使其尽可能接近自然的人声。可以通过\
    \ TTS API 实现的一些常见用例包括呼叫中心自动化、与 IoT 设备的交互以及将文本转换为音频以供阅读器使用。\n*   **Cloud STT API**：此\
    \ API 基于强大的模型，这些模型经过预先训练，可以将音频输入转换为多种语言的文本。该 API 支持实时流式传输或预先录制的音频输入。它还具有自动检测语言的能力，并支持将短格式和长格式音频片段实时转换为文本。在编写本书时，语音到文本接口有四类预训练的模型。这些模型适用于特定的用例和对话界面：\n\
    \    *   `command_and_search`：可用于短命令和语音搜索。\n    *   `phone_call`：用于来自电话对话的音频。\n\
    \    *   `video`：适用于作为视频信号一部分或以更高采样率录制的音频。\n    *   `default`：这是通用模型。\n\n本节中列出的所有服务和\
    \ API 均可与智能机实现自然的接口，并且是 AI 的构建块。在本书中，我们将通过代码示例详细探讨这些 AI 工具。\n\n# 总结\n"
