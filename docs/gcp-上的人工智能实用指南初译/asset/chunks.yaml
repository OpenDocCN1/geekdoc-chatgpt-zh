    \ 的屏幕截图，展示了所需的步骤：\n\n![](img/c7da7da6fc0e901a426fc20561bef27d.png)\n\n还可以通过 REST\
    \ API 使用命令行以及以编程方式测试和使用该模型。\n\n创建一个 `image_classification_request.json` 文件，如下所示：\n\
