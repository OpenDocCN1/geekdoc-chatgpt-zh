- raw: "```\n#!/bin/bash\nIMAGE=--image-family=tf-latest-cpu\nINSTANCE_NAME=dlvm\n\
    GCP_LOGIN_NAME=<proxy@gmail.com> # CHANGE THIS\ngcloud config set compute/zone\
    \ us-central1-a # CHANGE THIS\necho \"Launching $INSTANCE_NAME\"\ngcloud compute\
    \ instances create ${INSTANCE_NAME} \\\n      --machine-type=n1-standard-2 \\\n\
    \      --scopes=https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/userinfo.email\
    \ \\\n      ${IMAGE} \\\n      --image-project=deeplearning-platform-release \\\
    \n      --boot-disk-device-name=${INSTANCE_NAME} \\\n      --metadata=\"proxy-user-mail=${GCP_LOGIN_NAME}\"\
    \necho \"Looking for Jupyter URL on $INSTANCE_NAME\"\nwhile true; do\n   proxy=$(gcloud\
    \ compute instances describe ${INSTANCE_NAME} 2> /dev/null | grep dot-datalab-vm)\n\
    \   if [ -z \"$proxy\" ]\n   then\n      echo -n \".\"\n      sleep 1\n   else\n\
    \      echo \"done!\"\n      echo \"$proxy\"\n      break\n   fi\ndone\n```\n\n\
    这是此自动化脚本的伪代码：\n\n*   定义虚拟机映像类型\n\n*   提供 Google Cloud Platform 凭证\n\n*   设置将在笔记本后面进行计算的计算区域\n\
    \n*   定义实例大小\n\n*   遍历计算实例，并在实例上查找 Jupyter 笔记本 URL\n\n在下一部分中，我们将探索 AI 笔记本，并学习如何将其用于特定任务。\n\
    \n# 使用 Google Platform AI 笔记本\n\n您可以使用 AI Notebooks JupyterLab 平台设置本地笔记本，也可以从\
    \ Git 存储库克隆。 在用户界面中，单击顶部菜单上的 Git 图标以克隆存储库，如以下屏幕截图所示：\n\n![](Images/62bbd7188d3bea7d925c19f7fbe563d9.png)\n\
    \n如我们所见，Google Cloud Platform 允许我们选择各种版本的 Python，以及一种创建特定类型的支持文件的方式：\n\n![](Images/2b18dc79d0360c2b7ae5559effce17a7.png)\n\
    \nJupyter 笔记本允许命令行界面从 Git 存储库中提取代码。 您可以使用左窗格中的文件浏览器查看此代码。 这是一个方便的功能，使多个开发人员可以轻松无缝地进行协作。\n\
    \n# 自动执行 AI 笔记本\n\n一旦开发了代码并能够基于运行时配置参数使其工作，就可以使用称为 Papermill 的库来执行和评估这些笔记本。 让我们来看看\
    \ Papermill 可以为我们做些什么：\n\n*   该库允许您生成各种笔记本并同时运行它们。\n\n*   Papermill 还可以帮助您收集和汇总笔记本集合中的指标。\n\
    \n*   它还允许您从各个地方读取或写入信息。 这意味着您可以将输出笔记本存储在另一个存储系统上，该存储系统具有更高的耐用性并更易于访问可靠的管道。\n\n\
    *   在撰写本文时，Papermill 最近添加了 Google Cloud Bucket 帮助。 我们将在本章中演示如何使用此新功能。\n\n下图显示了\
    \ Papermill 如何与 Google Cloud AI Notebooks 一起使用：\n\n![](Images/07ab28044bed2a09597694134df7eee1.png)\n\
    \nPapermill 可让您改变笔记本材料工作方式的范式。 由于 Papermill 不会更改笔记本电脑室通常缺少的原始笔记本电脑，因此我们收到的功能特征已添加到我们的工作定义中。\
