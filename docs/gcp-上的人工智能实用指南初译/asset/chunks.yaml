    \ ML。\n\n# 使用 Cloud Machine Learning Engine 的实时预测\n\n优化了在线预测，以最小化服务预测的延迟。 每个请求我们可以处理一个或多个实例。\
    \ 在线预测在响应消息中作为输入数据返回，该输入数据直接作为 JSON 字符串传递。 它将尽快返回。 在响应应用输入进行请求或在其他需要及时推断的情况下，通常应使用在线预测。\
    \ 批量预测有其自身的缺点。 如果使用单个模型和少量输入实例，则可以看到使用在线预测与批量预测完成相同的预测请求所需的时间有相当大的差异。 几乎立即完成由互联网请求返回的预测可能要花费大量时间。\
    \ 这是两种预测技术所使用的各种设施的副作用。 在创建应用时，AI 平台会分配并初始化批量预测资源。 通常，已准备好在线预测，以便可以在需要时进行处理。 您可以通过[这里](https://github.com/PacktPublishing/Hands-On-Artificial-Intelligence-on-Google-Cloud-Platform)了解有关在线预测的更多信息。\n\
    \n前面的链接告诉我们，使用 Google Cloud Platform 上的简单且一致的 API 可以轻松地与 ML 引擎进行交互。 该 API 可用于实时预测，因为它具有很高的吞吐量和使用底层弹性计算能力的效率，而所有这些功能均由\
    \ Google Cloud Platform 启用。\n\n# 总结\n\n在本章中，我们通过一个实际的示例用例演示了 Keras 与 Google Cloud\
    \ Platform 的结合使用。 我们了解了如何使用云机器学习引擎。 Keras 是一个用 Python 编写的开源神经网络库。 它可以在 Microsoft\
    \ Cognitive Toolkit，TensorFlow 或 Theano 上运行。 我们看到 Keras 支持卷积网络，循环网络以及两者的组合。 展望未来，我们使用\
    \ Cloud Machine Learning Engine 执行了异步批量预测和实时预测。\n\n在下一章中，我们将学习 DialogFlow，它用于构建界面（例如对话式\
    \ IVR 和聊天机器人），以实现企业和用户之间的交互。\n\n# 六、使用 DialogFlow 的智能对话应用\n\n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/06.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/handson-ai-gcp/06.md)\
    \ \n\n**人工智能**（**AI**）不断改变着我们搜索和处理事物的方式，而聊天机器人是人们渴望摆脱自己不想做的事情的真实例证。 通过他们自己。 人工智能驱动的聊天机器人可以在不涉及人类的情况下完成出色的工作。\
    \ 聊天机器人是一个智能聊天程序。 它应该能够令人信服地模拟一个人。 与 AI 技术结合使用时，它称为智能聊天机器人。\n\n聊天机器人的最常见实例是某些公司使用的客户支持系统。\
    \ 它已经发展为可以进行 70-80% 的对话，而公司中没有实际的人与客户进行对话。 银行和金融市场已经在大量使用聊天机器人来处理客户请求并迅速协助他们进行银行交易。\
    \ 出于完全相同的原因，云提供商正在提供聊天机器人平台，以缩短产品上市时间。 在本章中，我们将学习如何使用名为 DialogFlow 的 **Google\
    \ Cloud Platform**（**GCP**）服务构建会话应用。 DialogFlow 提供了一种轻松的方法来为企业构建会话应用，并可以大大节省运营成本。\
    \ 在本章中，我们将学习 DialogFlow 的核心概念，并通过一个示例说明如何构建对话应用。\n\n以下是本章将涉及的主题：\n\n*   DialogFlow\
    \ 简介\n\n*   构建一个 DialogFlow 智能体\n\n*   使用 DialogFlow 执行音频情感分析\n\n# DialogFlow\
    \ 简介\n\n在开始 DialogFlow 之前，我们需要从高层次了解如何使用不同的技术来增强智能聊天机器人系统的功能。 大多数聊天机器人是电子邮件或对话的一种界面，其中机器人会响应您的文本，而不是人。\
    \ 这些聊天机器人在包含应用的上下文中运行。 但是，捕获集中在您与之通信的用户界面层周围。 人类与机器人的对话是由**机器学习**（**ML**）算法驱动的，该算法将您的消息分解为具有**自然语言理解**（**NLU**）能力的自然语言方法并以与任何人都可以期望的方式相当的方式回答查询。\n\
    \n# 了解 DialogFlow 的构建块\n\n让我们通过查看 DialogFlow 的高级架构来了解对话应用的各种构建块。\n\n下图从高层表示了任何聊天机器人应用的不同组件：\n\
    \n![](Images/8e79a9b0857ea2488c6f6e71106e5f99.png)\n\n图 6.1：聊天机器人应用的组件\n\n系统的独立构建块需要在一段时间内进行微调和即兴创作，并且需要不断的反馈和训练循环。\
    \ 在某些情况下，基于对一组已知输入的一组预定义响应来构建会话应用。 显然，这些系统无法提供类似于人的体验，并且缺乏自然的对话风格。 DialogFlow\
    \ 抽象了许多此类过程，并允许应用开发人员通过简单易用的界面专注于对话框的上下文和语义。\n\n该引擎还利用了不断增强的 ML 模型来支持其他意图，实体和上下文。\
    \ 在本节中，我们将学习 DialogFlow 的各种构造块和接口，如以下列表所示：\n\n*   **DialogFlow 智能体**：简而言之，此组件类似于需要训练才能处理用户呼叫的人工智能体。\
    \ 例如，一家银行的呼叫中心员工需要了解他们在接听客户电话时将会遇到的一些基本工作流程，术语和常见情况。 但是，训练不能满足所有可能的问题和会话分支。 智能体需要了解上下文中的意图，并在信息不足以满足客户查询的情况下以最佳选择或首要问题做出回应。\
    \ 与人工智能体类似，DialogFlow 智能体是一个复制人工智能体并以一定程度的模糊性理解自然语言的模块。 作为 DialogFlow 应用开发人员，我们需要设计和开发\
    \ DialogFlow 智能体，以处理预期应用上下文中的对话。\n\n*   **DialogFlow 意图**：一旦智能体将文本转换成段，便会标记和标记某些关键字以了解智能体上下文中的意图。\
    \ 与人类对话一样，DialogFlow 智能体和另一端的人类用户轮流进行对话，以使其成为有意义的对话。 从该人那里收集到的信息又称为**最终用户表示**。\
    \ DialogFlow 智能体需要经过训练，以将最终用户表达与预配置的意图匹配-此过程称为**意图分类**。 例如，如果我们正在设计一个 DialogFlow\
    \ 智能体来处理餐厅的预订，则该智能体需要响应与菜单，时间安排和预订有关的用户问题和查询。 这称为对话的上下文，并且智能体需要在餐厅预订的上下文中对用户的意图进行分类。\
    \ 基于意图分类，智能体要么通过从用户那里寻求其他信息来进行响应，要么查询应用的后端以找到问题的答案。 该意图包含以下组件：\n\n    *   **训练短语**：这些是智能体在应用上下文内的对话中寻找的预定义关键字集。\
    \ DialogFlow 使用基于主要短语集的本体映射，应用开发人员使用这些短语来扩展智能体的词汇表。 这意味着应用开发人员无需针对所有可能的意图关键字和短语训练智能体。\
    \ DialogFlow 引擎在内部增强了智能体上下文中可能的一组意图表达。\n\n    *   **动作**：应用开发人员可以为意图定义动作。 这些动作需要在系统中预定义和配置。\
    \ 这些动作可能是对基础数据集进行修改的特定活动，也可能是智能体在下一个会话输出中提出的主要问题。 例如，在酒店预订系统的情况下，如果最终用户的意图被理解为针对特定人数的特定时间的预订，则智能体可以继续进行并触发预订餐桌的动作。\
    \ 如果智能体需要其他信息以了解预订时间，则可以提出补充问题。\n\n    *   **参数**：在应用的上下文中验证了意图，并且 DialogFlow\
    \ 提取最终用户表达式作为参数。 每个参数都是实体的预定义类型。 DialogFlow 提供的系统实体与会话数据类型匹配。 系统实体匹配日期，参数值，范围，电子邮件\
    \ ID 等。 此时的参数定义了如何从最终用户中提取数据。 参数是可用于构建逻辑表达式的结构化数据构造。\n\n    *   **响应**：应用开发人员可以根据上下文，意图和派生给最终用户的动作定义响应。\
    \ 根据上下文，座席可以结束对话，采取预期的操作或提出问题以收集其他信息。\n\n*   **DialogFlow 实体**：当智能体从最终用户对话中提取意图时，它将映射到一个实体。\
    \ 实体将语义含义与关键字相关联。 DialogFlow 提供了一组系统实体，它们是跨各种上下文（例如，数量和单位，日期和时间等）的通用对话实体。 DialogFlow\
    \ 还提供了用于定义开发人员实体的接口。 这些是特定于上下文的自定义实体，应用开发人员可以创建这些实体，以使智能体理解应用上下文中的对话。 例如，可以用映射到餐厅所服务的特定菜单项的开发者实体来训练餐厅预订智能体。\n\
    \n*   **DialogFlow 上下文**：类似于人机交互，DialogFlow 对话发生在上下文中。 该应用适合特定的业务场景，因此需要在应用的上下文中理解关键字。\
    \ 重要的是，要使意图与应用的上下文正确匹配，以使对话有意义。 通过使用上下文，可以在特定方向上构建对话。 有两种类型的上下文需要解决：\n\n    *\
    \   **输入上下文**：当最终用户表达式在上下文中是紧密匹配时，这允许 DialogFlow 匹配意图。\n\n    *   **输出上下文**：如果用户表达式在当前上下文中不紧密匹配，则\
    \ DialogFlow 可以激活新的上下文。 例如，如果最终用户说“菜单上是什么？”，将触发输出上下文，并询问特定问题以进一步阐明，例如“素食还是非素食菜单？”。根据用户的选择，将激活特定的上下文，并且\
    \ DialogFlow 会详细说明这些选项。 在对话中的任何给定点，可以激活多个输出上下文。 这样可以对输出进行更好的控制，从而使对话朝着预期的方向发展。\
    \ 可以基于用户响应来确定此时的上下文。 在这种情况下，如果用户选择*素食*，则可以将素食菜单中的项目提供给用户。 输出上下文具有生命周期，并且在匹配意图后\
    \ 5 个请求或 20 分钟后过期。\n\n*   **跟进意图**：我们可以使用跟进意图来设置各种意图的上下文。 父意愿与跟进意愿之间存在亲子关系。 在对话的上下文中可以创建嵌套的后续意层次结构。\
    \ DialogFlow 提供了一组预定义的后续意图，这些意图表示对话期间使用的大多数表达式。 该平台还提供了一种定义自定义跟进意图的方式，以实现更精细的控制和对话流程。\
    \ 这是 DialogFlow 提供的所有后续意图的标题列表：\n\n    *   **后备**：当基于用户的输入不清楚意图和上下文时，这是一个表达式。\n\
    \n    *   **是/否**：捕获对后续问题的肯定/否定反应。\n\n    *   **之后**：这链接到用户打算在不久的将来某个时间发生的定时事件。\n\
    \n    *   **取消**：这通常适用于特定动作或事件的取消。 通常，会话在这一点上趋向于关闭意图或遵循替代路径。\n\n    *   **更多**：当用户需要更多信息或\
    \ DialogFlow 智能体需要来自调用者的其他信息以实现意图时，使用此选项。\n\n    *   **下一个/上一个**：在处理一组可能的选项时使用。\
    \ 例如，如果对话是关于菜单项的，则调用者和 DialogFlow 智能体可以使用此后续意图导航到下一个或上一个可能的选项。\n\n    *   **重复**：用于重复对话。\n\
    \n    *   **选择编号**：这是选择编号选项时使用的跟进意图。\n\n*   **DialogFlow 事件**：使用 DialogFlow 事件，智能体可以响应外部事件触发对话流。\
    \ 外部事件在上下文中称为非对话输入。 例如，电子邮件，社交媒体消息或对特定号码的电话的接收可以配置为外部事件。 DialogFlow 智能体可以配置为监听此类事件，并根据特定事件采取对话路径。\
    \ DialogFlow 上有一些可用的预定义平台事件。 这些是在集成平台上发生的事件。 这是 DialogFlow 支持的平台事件的代表性列表：\n\n\
    \    *   `TELEPHONY_WELCOME`：当收到使用 DialogFlow 注册的电话号码的呼叫时，将生成此事件。\n\n    *   `ALEXA_WELCOME`：当用户开始与特定技能进行交互时，将生成此事件。\n\
    \n    *   `MEDIA_STATUS`：根据特定媒体文件的状态（例如，音频文件的播放完成时）生成此事件。 可以在此类媒体状态事件上触发 DialogFlow\
    \ 操作。\n\n    *   `SIGN_IN`：当用户登录到集成服务（Twitter，Google 等）时，将生成此事件。 在这种情况下，可以触发对话流程。\n\
    \n*   **DialogFlow 实现**：有时候，对话需要来自外部源的数据才能提供用户所需的信息。 在这种情况下，DialogFlow 提供了一个实现接口，以将请求派生到外部源（例如数据库和\
    \ API），并请求特定的数据点。 从外部服务接收到数据后，DialogFlow 会将数据集成到会话的意图和上下文中，并将响应提供给调用方。 可以针对每个意图启用实现设置。\
    \ 如果未定义实现，则 DialogFlow 使用在意图内定义的静态响应。 通过 Webhook 服务启用与实现智能体的交互。 Webhook 使集成两个异构应用变得容易。\
    \ DialogFlow 将上下文和意图数据序列化到 Webhook 服务。 Webhook 服务依次调用外部 API 端点或访问数据库以获取所请求的信息。\
    \ 这是定义 DialogFlow 请求生命周期的工作流程，该请求需要通过履行服务使用外部源数据：\n\n![](Images/372d0c44907f0b172fa876aa3c11bd60.png)\n\
    \n图 6.2：通过履行服务的 DialogFlow 请求的生命周期\n\n在介绍了 DialogFlow 核心概念之后，在下一部分中，我们将研究在平台上构建\
    \ DialogFlow 智能体的过程。\n\n# 构建一个 DialogFlow 智能体\n\n作为通用 GCP 原则，GCP 项目中存在任何服务。 一个\
    \ GCP 项目可以包含一个 DialogFlow 智能体。 如果我们要有多个 DialogFlow 智能体，则需要在不同的项目下进行管理。 一个项目组织了\
    \ DialogFlow 智能体所需的所有资源。 前提条件是，我们需要启用 API，监视工具和计费信息。 我们需要提供对项目用户帐户的访问权限，并在粒度级别上设置访问控制，以便用户可以访问最少的服务资源。\
    \ 我们将通过 DialogFlow 控制台导航至[这里](https://dialogflow.cloud.google.com/#/getStarted)来进行工作。\n\
    \n让我们为书店构建一个 DialogFlow 智能体。 导航到控制台后，单击侧面菜单或控制台登录页面上的“创建智能体”按钮。 根据应用的上下文以及默认语言和时区选择智能体名称。\
    \ DialogFlow 控制台提供了一个选项，可以使用现有的 GCP 项目以及在从控制台创建智能体的工作流程中创建新项目。 以下屏幕快照显示了 DialogFlow\
    \ 控制台中的智能体创建屏幕：\n\n![](Images/9994b4d9911c4be9a0fb3c4c8507bd3e.png)\n\n图 6.3：DialogFlow\
    \ 控制台中的智能体创建屏幕"
