    \n图 6.11：带有动作和参数的定制意图\n\n通过此设置，当“我的书店”智能体包含日期和时间信息时，他们可以根据特定的训练短语为呼叫者预订约会； 但是，在实际对话中，我们不能期望用户在初始对话期间提供所有必需的信息。\
