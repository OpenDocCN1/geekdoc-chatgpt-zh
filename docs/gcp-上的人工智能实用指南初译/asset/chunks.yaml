    \ 存储桶存储转录的文本文件（JSON 格式）。\n6.  将发票 PDF 文件复制到 `aigcp` 存储桶（从 Cloud Shell 或从 GCP 控制台复制）。这是\
    \ GCP 控制台中存储区内容的快速快照：\n    ![](img/464fef9ba2e280e4d7324043b6f6036b.png)\n   \
    \ 图 10.6：Google Cloud Storage 存储桶中的发票文件\n7.  运行以下命令以使用 `Vision API` 读取发票 PDF 文件并将其转录为文本：\n\
    \    ![](img/1d07676f0f8574eaec425832c07a01d9.png)\n    图 10.7：使用 `Vision API`\
    \ 进行 `OCR` 和文本检测的命令\n8.  `OCR` 也可以通过任何一个编程接口执行。GCP 提供了用于 C#、Go、Java、Node.js、PHP、Python\
    \ 和 Ruby 的 API。让我们看一下 `OCR` 的 Python 实现的一小段。[完整的实现在 GitHub 上](https://github.com/PacktPublishing/Hands-On-Artificial-Intelligence-on-Google-Cloud-Platform)：\n\
    \    ```python\n    def async_detect_document(source_path_gcs, destination_path_gcs):\n\
    \n        client = vision.ImageAnnotatorClient()\n\n        feature = vision.types.Feature(\n\
    \            type=vision.enums.Feature.Type.DOCUMENT_TEXT_DETECTION)\n\n     \
    \   gcs_source = vision.types.GcsSource(uri=source_path_gcs)\n        input_config\
    \ = vision.types.InputConfig(\n            gcs_source=gcs_source, mime_type=mime_type)\n\
    \n        async_request = vision.types.AsyncAnnotateFileRequest(\n           \
    \ features=[feature], input_config=input_config,\n            output_config=output_config)\n\
    \n        operation = client.async_batch_annotate_files(\n            requests=[async_request])\n\
    \    ```\n9.  JSON 格式的转录文本文件现在存储在 `aigcp-text` 存储桶中，如以下屏幕截图所示：\n    ![](img/3269b12a1f5be153df02046824b97310.png)\n\
    \    图 10.8：在 Google Cloud Storage 中输出 JSON 文件\n10. 为了从输出 JSON 文件中提取有意义的信息，我们需要了解输出\
    \ JSON 文件（`output-1-to-1.JSON`）的格式：\n    ![](img/d8a9541bbf1b17bc8cc323dfa2db7907.png)\n\
    \    图 10.9：输出文件中的 JSON 标头\n\n    这是输出文件中的头信息。`Vision API` 自动检测 PDF 文档中使用的语言。实际字符数据封装在\
    \ `HTG0` > `paragraphs` > `words` > `symbols` 的层次结构中，如下图所示：\n    ![](img/985aaa66c622f3db9b27c9ab3a813bba.png)\n\
    \    图 10.10：输出 JSON 结构\n\n    `Vision API` 还将 PDF 文件中找到的所有符号收集到一个 `text` 字段中。这有助于我们快速从发票中收集有意义的内容。以下是包含\
    \ `text` 字段的输出 JSON 的代码段：\n    ![](img/6ecab5abf2a43d37f398509837deda94.png)\n\
