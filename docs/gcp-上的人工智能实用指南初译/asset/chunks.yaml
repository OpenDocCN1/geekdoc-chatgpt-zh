    \ SOW_Number, Project_ID, Invoice_Number, Invoice_Date, Billing_Period, Developer,\
    \ Rate, Hours, Bank_Account_Number, Bank_name)\nvalues ('Vsquare Systems', '001',\
    \ '002', '030', '2020-01-31', '2020-01-31', 'Developer2', '$150', 152, 000000001,\
