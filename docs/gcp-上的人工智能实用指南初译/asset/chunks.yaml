    \ 服务器从 TensorFlow 客户端接收到计算图时，它将从所需的存储中加载输入。 它将图划分为多个块，应在 TPU 和 CPU 上运行。 它生成**加速线性代数**（**XLA**）操作，以便在\
    \ Cloud TPU 上运行子图，并调用 XLA 编译器。\n\n*   **XLA 编译器**：XLA 是**即时**（**JIT**）编译器。 TensorFlow\
    \ 服务器产生 XLA 编译器视为输入的操作。 XLA 生成在 Cloud TPU 上运行的二进制代码，包括从片上存储器到硬件执行单元的数据编排以及芯片间通信。\
    \ Cloud TPU 使用 Cloud TPU 服务器和 Cloud TPU 之间的**外围组件互连快速**（**PCIe**）连接来加载二进制代码，然后启动执行。\n\
    \n# 使用 TPU 的模型开发的最佳实践\n\n在本节中，我们将讨论如何在 Cloud TPU 上开发模型以最大化模型表现并优化利用硬件。\n\n让我们快速看一下\
    \ TPU 芯片配置。 单个 TPU 芯片包含两个内核，每个内核具有多个 MXU。 正如我们所讨论的，MXU 非常适合执行密集矩阵乘法和卷积的程序。 因此，对于此类程序，我们绝对应该考虑使用\
    \ TPU 并利用其硬件。 未执行矩阵乘法并且执行诸如`add`之类的操作的程序将不会有效地使用 MXU。 在以下小节中，我们将介绍一些准则，这些准则将帮助您决定是否应使用\
    \ TPU，并告知您如何开发模型以从中获得最佳性能。\n\n# 在 TPU 上进行模型开发的指导原则\n\n为了充分利用硬件程序，您应该利用所有可用的内核，因为这会增加模型训练的时间（每个\
    \ TPU 设备包含四个芯片和八个内核）。 这可以使用`TPUEstimator`来实现。 它提供了一个图运算符，可帮助构建和运行副本。 每个副本都是在每个核心上运行的训练图，并且实质上是批量大小的八分之一。\n\
    \n布局和形状是获得性能提升的非常重要的方面。 当 XLA 编译器转换代码时，它包括将矩阵平铺为多个小块。 这样可以提高 MXU 的使用效率。 由于 MXU\
    \ 为`128 * 128`，因此它希望平铺应为 8 的倍数。有些适用于平铺的矩阵，而有些则需要重塑。 这些是内存绑定操作。 形状恒定的模型适合 TPU，而形状变化的模型不适合\
    \ Cloud TPU，因为重新编译形状会减慢处理速度。\n\n对于高性能的 Cloud TPU 程序，应将密集的计算轻松地分为`128 * 128`的倍数。XLA\
    \ 编译器使用填充选项。XLA 编译器未完全利用 MXU 时，将张量填充零。 您可以通过`op_profile`看到 XLA 编译器应用的填充。 通常，填充有助于提高性能，但也有两个缺点。\
    \ 应用填充意味着未充分利用 MXU，并且由于它增加了张量所需的片上存储空间，因此有时可能会导致内存不足错误。 因此，选择正确的尺寸对于最小化/避免填充非常重要。\n\
    \n张量尺寸应该非常谨慎地选择，因为它在从 MXU 中提取最大性能方面起着重要作用。 XLA 编译器使用批量大小或尺寸来获得 MXU 的最佳性能。 因此，任何一个都应该是\
    \ 128 的倍数。如果都不是 128 的倍数，则编译器应该填充 1 到 128。可以从 MXU 中获得最大的性能，因为它的批量大小和 TPU 是 8 的倍数。\n\
    \n# 使用`TPUEstimator`训练模型\n\n在本节中，我们将讨论训练模型时`TPUEstimator`的用法和优点。\n\n`TPUEstimator`吸收了许多底层的，特定于硬件的细节，并简化了在\
