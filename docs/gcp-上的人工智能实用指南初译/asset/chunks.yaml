    \ API：\n\n![](Images/d23f79db6ba1e5473ceb426506b01a07.png)\n\n2.  要启用 API，请单击“启用”：\n\
    \n![](Images/02848d83846debd9d80e0ccac4c3d915.png)\n\n3.  要建立从 Cloud Functions\
    \ 到 Cloud SQL 的连接，需要以下 Cloud SQL 详细信息：\n\n*   实例名称\n\n*   数据库名称\n\n*   用户名：`root`\n\
    \n*   创建实例时设置的`root`用户的密码\n\n# 创建 Cloud Function\n\n现在让我们创建一个 Cloud Function：\n\
    \n1.  从“计算”部分下的左侧面板中选择“云函数”：\n\n![](Images/69020c468c6b4414fed63dd57fb471ac.png)\n\
    \n2.  单击“创建功能”：\n\n![](Images/75e18d60da36b0e0aa8d99cc090339d2.png)\n\n3.  输入所需的功能名称。\
    \ 分配的内存可以为 256 MB。 选择“触发器”作为“云存储”，然后选择“事件类型”作为“完成/创建”。 存储桶名称应为存储 PDF 到文本输出的存储桶的名称。\
    \ 源代码应为内联编辑器：\n\n![](Images/8f1274a391d3f4fcd4c746abc415fce4.png)\n\n4.  复制`aip_cloud_function.py`中的代码，并根据存储区名称和创建的\
