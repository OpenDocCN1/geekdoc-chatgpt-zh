    \n至此，完成了与平台相关的先决条件。现在，我们需要为应用运行设置环境。\n\n在 GCP 控制台中，单击顶部菜单栏上的“激活 Cloud Shell”按钮。这将打开\
    \ Cloud Shell Web 界面。\n\n这是我们需要从 Cloud Shell 采取的步骤：\n\n1.  列出 AI 平台上存在的所有模型。\n\
    2.  更新 AI 平台上的所有组件。\n3.  安装或升级 TensorFlow。\n\n您可以在控制台的以下屏幕截图中看到突出显示的上述步骤：\n\n\
    ![](img/d63e9d1107fe84e0e4b5a146371adc4d.png)\n\n图 8.15-通过 GCP 控制台进行 AI 平台设置的要求\n\
    \n至此，环境设置完成。现在，我们可以在本地开发和验证训练应用。在云上运行该应用之前，建议在本地运行该应用以进行快速调试，并确保所有程序都能按预期工作。在本地运行应用时，云资源不会产生任何费用。\n\
    \n### 创建一个 TensorFlow 应用并在本地运行\n\n训练应用是根据开发人员的偏好和项目的上下文构造的。但是，有一个推荐的项目结构，可以确保各个项目之间的一致性，并且不需要进行上下文开发人员训练。\n\
    \n#### 项目结构推荐\n\n让我们设置项目结构：\n\n1.  创建一个主项目目录，其中包含应用的所有代码。\n2.  在主项目目录中创建一个 `setup.py`\
    \ 文件。`setup.py` 文件确保所有子目录都包含在用于应用分发的存档包中。以下代码块显示了 `setup.py` 的典型实现：\n\n```python\n\
    from setuptools import setup, find_packages\nimport os\n\nNAME = 'preprocessing'\n\
    VERSION = 'x.y'\nREQUIRED_PACKAGES = [COMMA_SEPARATED LIST OF PACKAGES]\n\nsetup(\n\
    \    name=NAME,\n    version=VERSION,\n    packages=find_packages(),\n    install_requires=REQUIRED_PACKAGES,\
    \ \n)\n```\n\n3.  创建一个名为 `trainer` 的子目录。`trainer` 目录包含应用模块代码，并且通常包含以下文件：\n   \
    \ *   `task.py`：这是主要的应用模块，以及包含负责训练作业编排的应用逻辑的文件。\n    *   `model.py`：这是包含模型逻辑以及模型的各种属性和配置参数的文件。\n\
    4.  创建使应用模块化和逻辑可读的各种子目录。\n5.  建议在每个子目录中创建一个 `__init__.py` 文件。通常，`Setuptools` 将这些用作打包应用的标记。\n\
    6.  当调用 `gcloud` 命令进行训练时，`package-path` 参数设置为 `trainer` 目录。运行时在父目录中搜索 `setup.py`\
    \ 文件，并根据 `trainer` 目录中 `task.py` 和 `model.py` 文件中的代码训练模型。\n\n#### 训练数据\n\n在此示例中，我们将使用人口普查收入数据，它是公开可用的数据集之一。这是数据集的特征：\n\
    \n*   **摘要**：基于 14 个属性的数据集，用于预测一个人的收入是低于还是大于 50,000 美元。\n*   **类型**：多变量。\n*  \
    \ **实例数量**：48,842。\n*   **领域**：社交。\n*   **属性类型**：类别/整数。\n\n让我们继续进行模型训练。\n\n1.\
    \  在以下命令的帮助下，打开 Cloud Shell 并下载示例代码：\n\n```bash\nwget https://github.com/GoogleCloudPlatform/cloudml-samples/archive/master.zip\n\
    unzip master.zip\ncd cloudml-samples-master/census/estimator\n```\n\n2.  在以下命令的帮助下获取训练数据：\n\
    \n```bash\nmkdir data\ngsutil -m cp gs://cloud-samples-data/ai-platform/census/data/*\
    \ data/\nTRAIN_DATA=$(pwd)/data/adult.data.csv\nEVAL_DATA=$(pwd)/data/adult.test.csv\n\
    ```\n\n3.  创建用于存储模型和中间文件的输出目录。\n4.  为了在本地运行模型，我们需要使用以下命令：\n\n```bash\ngcloud ai-platform\
    \ local train \\\n    --module-name trainer.task \\\n    --package-path trainer/\
    \ \\\n    --job-dir $MODEL_DIR \\\n    -- \\\n    --train-files $TRAIN_DATA \\\
    \n    --eval-files $EVAL_DATA \\\n    --train-steps 1000 \\\n    --eval-steps\
    \ 100\n```\n\n这是模型输出目录的屏幕截图：\n\n![](img/59e87953d41356ec5c88bbb441065492.png)\n\
    \n图 8.16-模型输出目录\n\n训练和评估模型后，即可使用 TensorBoard 分析各种模型训练参数。TensorBoard 是 TensorFlow\
    \ 打包的可视化工具包。它有助于在模型图中可视化和分析损失和准确率。以下命令用于将 TensorBoard 作为 Web 应用启动（默认在端口 `8080`\
    \ 上）：\n\n```bash\ntensorboard --logdir=$MODEL_DIR --port=8080\n```\n\n前面的命令将返回以下输出。我们来看一下：\n\
    \n![](img/0938a6a9162404c4c4f58bf9cac03251.png)\n\n图 8.17 使用 TensorBoard 的模型视图\n\
    \n正如我们从前面的屏幕截图中可以看到的那样，TensorBoard 可以通过直观的可视化工具轻松分析模型表现。\n\n在下一部分中，让我们看一下打包和部署训练应用所涉及的步骤。\n\
    \n### 在 Cloud ML Engine 中打包和部署您的训练应用\n\n重要的是要了解在 ML Engine 中打包和部署应用的正确方法。在本节中，我们将讨论机器学习应用的打包和部署中的一些推荐方法和最佳实践。我们可以使用\
    \ `gcloud` 命令行工具来打包和上传应用。最简单的方法是使用以下命令进行打包以及上传应用，同时提交训练作业：\n\n```bash\ngcloud\
    \ ai-platform jobs submit training\n```\n\n让我们定义打包和部署应用所需的全局环境变量，如下所示：\n\n*  \
    \ `PATH_TRAINER_PACKAGE`：训练作业所需的所有源代码文件的标准路径。\n*   `TRAINER_MODULE`：这是 `.task`\
    \ 文件的名称，该文件代表主应用模块，并且该文件包含负责训练作业编排的应用逻辑。\n*   `STAGING_BUCKET`：这是训练作业运行时用于存储中间结果和临时文件的\
    \ Google 存储空间上的路径。\n\n除了这些之外，我们需要设置变量以表示作业名称、作业目录和区域。作业名称可用于跟踪与作业相关的数据和沿袭点；作业目录存储训练作业的中间结果和最终结果；并且需要该区域在适当的位置运行训练工作，以优化计算和存储成本并最小化开销。\n\
    \n这是一个使用 `gcloud ai-platform` 命令负责打包和部署应用的命令：\n\n```bash\ngcloud ai-platform jobs\
    \ submit training $JOB_NAME \\\n    --staging-bucket $STAGING_BUCKET \\\n    --job-dir\
    \ $JOB_DIR \\\n    --package-path $PATH_TRAINER_PACKAGE \\\n    --module-name\
    \ $TRAINER_MODULE \\\n    --region $REGION \\\n    -- \\\n    --user_first_arg=first_arg_value\
    \ \\\n    --user_second_arg=second_arg_value\n```\n\n除了运行命令的必需参数之外，我们还可以将许多用户定义的和应用特定的参数传递给此脚本。参数值可用于运行时和特定于应用的逻辑的实现。\n\
    \n训练作业还可能需要一些依赖关系才能成功运行训练作业。有两种类型的依赖关系需要解决：\n\n"
