    \n2.  使用以下命令创建下一个模型版本：\n\n```\nMODEL_VERSION = \"v1\"\n\n# Get a list of directories\
    \ in the `keras_export` parent directory\nKERAS_EXPORT_DIRS = ! gsutil ls $JOB_DIR/keras_export/\n\
    \n# Pick the directory with the latest timestamp, in case you've trained\n# multiple\
    \ times\nSAVED_MODEL_PATH = KERAS_EXPORT_DIRS[-1]\n\n# Create model version based\
    \ on that SavedModel directory\n! gcloud ai-platform versions create $MODEL_VERSION\
    \ \\\n  --model $MODEL_NAME \\\n  --runtime-version 1.13 \\\n  --python-version\
    \ 3.5 \\\n  --framework tensorflow \\\n  --origin $SAVED_MODEL_PATH\n```\n\n以下是\
