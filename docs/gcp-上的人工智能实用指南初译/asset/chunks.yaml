    [H​​TG0\\] > `paragraphs` > `words` > `symbols`的层次结构中，如下图所示：\n\n![](Images/985aaa66c622f3db9b27c9ab3a813bba.png)\n\
    \n图 10.10：输出 JSON 结构\n\nVision API 还将 PDF 文件中找到的所有符号收集到一个文本字段中。 这有助于我们快速从发票中收集有意义的内容。\
