    \ Chaudhari\n                              Department: IT\n                   \
    \           Designation: Director\n```\n\n随后是 GCP 中的 Firestore 用户界面的屏幕截图：\n\n\
    ![](Images/fc28bf813757e2b965c68267d3d30327.png)\n\n文档通过它们在数据库中的位置唯一标识。 默认情况下，Firestore\
    \ 中存储的所有数据都是加密的，并且可以使用访问控制为用户提供适当的访问权限。 对于 1 GB 的存储空间，向用户收取 0.18 美元，写入 100,000\
    \ 个文档 0.18 美元，读取 100,000 个文档 0.06 美元和删除相同数量的文档 0.02 美元。\n\n# Cloud Firestore 和\
    \ AI 应用\n\nCloud Firestore 可以充当 AI 和 ML 用例中存储在移动和 Web 设备上的应用的存储。 在 GCP 上托管的具有网站和移动应用的任何应用都可以将数据保存在\
    \ Firestore 中，并且可以使用此数据训练 ML 模型，并可以在其移动设备和网站应用上向用户提供所需的建议。\n\n# Cloud SQL\n\n\
    Cloud SQL 是 MySQL 和 PostgreSQL 的完全托管实例。 Cloud SQL 的功能如下：\n\n*   它具有可扩展性，是高达 10\
    \ TB 数据的正确选择。\n\n*   它的实例可以在任何时间和适合应用的区域中立即创建。\n\n*   可以创建的实例的范围从 1 个虚拟 CPU（VCPU）到\
    \ 64 个 VCPU，以及 600 MB RAM 到 400 GB RAM。\n\n*   关于持久性存储，用户可以选择 SSD 或 HDD 存储。 速度更快的\
    \ SSD 比 HDD 的成本更高。\n\n*   可以启用自动持久性存储，以确保数据库不会耗尽空间。 高可用性是可选的，并且取决于用户是否启用它。\n\n\
    *   可以从大多数 GCP 计算和处理服务访问 Cloud SQL 实例。\n\n*   最快的访问方式之一是使用 Google Cloud Shell。\
    \ 实例的所有更新和补丁都是自动的，用户无需担心。\n\n*   Cloud SQL 是高度安全的，并且默认情况下，其中存储的所有数据都是加密的。\n\n\
    *   从 GCP 外部访问 Cloud SQL 的应用必须经过健壮的安全层才能对其进行访问。\n\n*   Cloud SQL 很便宜，并且为实例提供了很多持续的用户折扣价格。\n\
    \n*   根据实例类型的不同，每小时的价格范围为 0.0150 – 8.0480 美元。 永久存储的价格为：SSD 为 0.17 美元，HDD 为 0.09\
    \ 美元，备份为 0.08 美元。\n\n# Cloud SQL 和 AI 应用\n\nCloud SQL 可以为大型和复杂的结构化数据提供所有 AI 和\
    \ ML 用例。 另一个名为 Cloud Spanner 的服务可以提供类似的用例，Cloud SQL 可以提供类似的用例，但是规模非常大。\n\n# Cloud\
    \ Spanner\n\nCloud Spanner 是完全托管的，可横向扩展的关系数据库管理服务。 它可以在所有可用区域中扩展到数百万个节点。 Cloud\
    \ Spanner 的功能如下：\n\n*   可以立即创建它的实例，并且可以在单个或多个区域中创建适合该应用的实例。\n\n*   可以从一个节点到数百万个节点创建\
    \ Cloud Spanner 实例。\n\n*   即使 Cloud Spanner 是分布式数据库，它仍支持 ACID 事务，其可用性为 99.999%。\
    \ Cloud Spanner 具有 RDBMS 等功能和可扩展性（如分布式数据库）。\n\n*   可以使用大多数 GCP 计算和处理服务以及外部 GCP（具有正确的权限集）访问\
    \ Cloud Spanner 实例。\n\n*   最快的方法之一是使用 Google Cloud Shell 快速访问它。 实例的所有更新和补丁都是自动的，用户不必担心。\n\
    \n*   Cloud Spanner 是高度安全的，默认情况下，所有存储的数据都是加密的。\n\n*   它与身份和访问管理集成在一起，并提供诸如审核和日志记录之类的功能。\n\
    \n*   它提供两种定价，一种用于区域设置，另一种用于多区域设置。\n\n*   区域实例的每个节点价格为 0.90 美元，而多区域节点的价格为每小时每个节点\
    \ 3 美元。\n\n*   对于区域实例，持久性存储的价格为每月每 GB 0.30 美元，对于多区域实例，永久性存储的价格为每月每 GB 0.50 美元。\n\
    \n# Cloud Spanner 和 AI 应用\n\nCloud Spanner 可以提供适用于 MySQL 和 PostgreSQL 的所有 AI 和\
    \ ML 用例。 Cloud SQL 适用于服务需要高达 10 TB 结构化数据的 AI 和 ML 用例； 例如，机器学习用例需要数据准备，这涉及复杂的 SQL\
    \ 连接并可以提高流程效率。\n\n# Cloud Memorystore\n\nCloud Memorystore 是基于 Redis 构建的完全托管的内存中数据存储服务。\
    \ 以下是 Cloud Memorystore 的功能：\n\n*   Redis 是一个通用的数据库，可以用于很多用例。 通常，人们将 Redis 用作缓存服务，但是它具有各种不同的数据结构，可以为**物联网**（**IoT**），ML，流式传输等其他用例提供服务。\n\
    \n*   借助 Cloud Memorystore，Google 本质上提供了可伸缩且高度可用的 Redis 实例。\n\n*   Google 针对 Cloud\
    \ Memorystore 的**服务级别协议**（**SLA**）对于标准层为 99.9%，并且受到 Google 的网络策略和基于角色的访问控制的完全保护。\n\
    \n*   Cloud Memorystore 分为两层：基本层和标准层：\n\n    *   基本实例非常适合用作缓存服务，并且不会附加任何 SLA。\n\
    \n    *   标准实例提供了高可用性，并在另一个区域中部署了副本，因此它可以从区域故障中恢复。\n\n*   根据 Redis M1-M5 的存储容量和网络容量，可分为五个容量层，分别从\
    \ 1 GB 到 300 GB 和 3 Gbps 到 12 Gbps 不等。\n\n*   由于 Cloud Memorystore 遵循所有 Redis\
    \ 协议，因此很容易在其上提升和转移现有 Redis 项目。\n\n*   Cloud Memory 与身份和访问管理以及 Stackdriver 集成在一起，后者提供\
    \ 24/7 系统监视等功能来保护您的数据，检查 Memorystore 的性能等。 其数据始终驻留在 VPC 中。\n\n*   由于 Cloud Memorystore\
    \ 具有五种不同的容量，因此其价格也会相应变化。 价格范围从每小时每 GB 0.016 美元到每小时每 GB 0.049 美元。\n\n# Cloud Memorystore\
    \ 和 AI 应用\n\nCloud Memorystore 可以使用 Redis ML 模块满足各种 AL 和 ML 用例。 Redis ML 具有各种\
    \ ML 模块作为内置数据类型。 Cloud Memorystore 可以为线性和逻辑回归，决策树矩阵计算等提供机器学习模块服务。\n\n# Cloud Filestore\n\
    \nCloud Filestore 是 GCP 提供的完全托管的高性能网络文件存储。 以下是 Cloud Filestore 的功能：\n\n*   云端存储可与需要网络文件存储的\
    \ Google Compute Engine 和 Kubernetes Engine 应用一起使用。\n\n*   Cloud Filestore 快速可靠，非常适合要求低延迟和高吞吐量的应用。\n\
    \n*   Filestore 是一致的，并在一段时间内提供可靠的性能。 它遵循 NFSv3 协议，具有 99.99% 的高可用性，并且最大共享容量为 63.9\
    \ TB。\n\n*   Cloud Filestore 具有 Google 级别的安全性，具有高度的安全性，分为两个等级：标准和高级。\n\n*   这两层的价格因地区而异。\
    \ 标准层的价格从每月每 GB 0.20 美元到 0.24 美元不等，高级层的价格从每月每 GB 0.30 美元到 0.36 美元不等。\n\n# Cloud\
    \ Filestore 和 AI 应用\n\nCloud Filestore 可以服务所有 AI 和 ML 用例，这些用例要求本质上不是很复杂的数据集具有高吞吐量。\n\
    \n在下一节中，我们将讨论处理选项。\n\n# 了解处理选项\n\n除了 IaaS 选项（可用于通过计算选项构建自己的 AI 和 ML 管道）之外，Google\
    \ 还提供了一些托管服务，可用于处理数据以及构建 AI 和 ML 管道。 以下是完全托管的处理选项：\n\n*   BigQuery\n\n*   Cloud\
    \ Dataproc\n\n*   Cloud Datastream\n\n所有托管处理选项都与其他 Google Cloud Services 集成在一起，例如网络，身份和访问管理，Stackdriver\
    \ 等。 这些使跟踪活动和加强应用的安全性变得容易。 BigQuery 可用于卸载现有数据仓库并创建一个新仓库，并且使用 BigQuery ML 选项，您可以构建\
    \ ML 管道。 Dataproc 可用于在 GCP 上迁移现有的 Hadoop 项目并在其上运行 AI 和 ML 管道。 Cloud Dataflow 可用于在\
    \ GCP 上构建全新的管道。\n\n# BigQuery\n\nBigQuery 是 GCP 的云数据仓库，具有机器学习风格（BigQuery ML）。\
    \ 它是一个非常强大的工具，可以处理 PB 的数据，并且为您提供了随时可用的模型，您可以在 SQL 编程中使用这些模型来构建机器学习管道。\n\nBigQuery\
    \ 快速，可扩展且无服务器。 您只需单击几下即可构建 BigQuery 数据集，然后开始将数据加载到其中。 BigQuery 使用 Colossus 以列格式将数据存储在本机表中，并且数据被压缩。\
    \ 这使得数据检索非常快。 除存储外，BigQuery 使用以下工具和网络组件来使其快速，可靠和高效：\n\n*   Jupyter 网络，用于对数据进行混洗\n\
    \n*   Dremel 引擎用于处理\n\n*   Borg 用于集群管理\n\n换句话说，它利用 Google 出色的基础架构和最佳服务，使其快速，高度可用且可扩展。\n\
    \nBigQuery 带有其他功能，例如数据和查询共享，保存所需的查询； 它符合 ANSI 2011，并与本机以及外部工具（包括 Informatica，Talend\
    \ 等）集成。 BigQuery 中保存的所有数据均已加密。 它是联盟的，可以查询来自其他服务（如 Cloud Storage 和 Bigtable）的数据。\
    \ BigQuery 还通过 BigQuery Streaming 支持实时分析。\n\nBigQuery 拥有一个友好的用户界面，用户可以从中执行所有操作，还具有一个命令行工具`bqclient`，可用于连接到\
    \ BigQuery。 BigQuery 有两种定价模式：“按需付费”，即每 TB 查询处理向用户收取 5 美元的费用；以及“固定费用定价”，即每月约 40,000\
    \ 美元，为此用户可获得 2,000 个专用插槽用于处理。 存储费用为每月每 GB 0.02 美元； 对于短期存储和长期存储，每月每 GB 0.01 USD。\n\
    \n# BigQuery 和 AI 应用\n\nBigQuery ML 是 BigQuery 机器学习的一种形式，它具有一些内置算法，可以直接在 SQL 查询中用于训练模型和预测输出。\
    \ BigQuery ML 当前支持分类模型的线性回归，二进制逻辑回归和多类逻辑回归。\n\n# Cloud Dataproc\n\nCloud Dataproc\
    \ 是一个完全托管的 Hadoop 和 Spark 集群，可以在几秒钟内旋转。 Cloud Dataproc 是一个自动扩展集群，可用于非常有效地运行 Hadoop，Spark\
    \ 以及 AI 和 ML 应用。 在高峰时段，可以根据使用情况将节点添加到群集，并且在需求较低时可以进行缩减。\n\nDataproc 与其他服务集成，例如云存储，BigQuery，Stackdriver，身份和访问管理以及网络。\
    \ 这使得群集的使用非常容易且安全。\n\n在 Dataproc 集群下，Google 实际上运行计算实例。 用户可以从广泛的计算机配置中进行选择来构建集群，或者如果现有计算机配置不能满足需求，则用户也可以使用自定义计算机配置来构建集群。\
    \ 这里要注意的一件非常重要的事情是 Dataproc 集群使用抢占式实例。 这可以为集群的定价创造奇迹。 抢占型实例的价格要低得多，大约是具有相同配置的实际实例的\
    \ 20%，而 Google 可以在 30 秒内通知收回实例。\n\n对于 Dataproc 集群，可将抢占实例用作数据节点，因为通常将 Dataproc\
    \ 集群用于计算目的，并且所有数据都将保存在 Cloud Storage 中。 因此，在这种情况下，即使抢占式实例发生故障，该作业也将转移到另一个节点，并且不会产生任何影响。\
    \ Cloud Dataproc 集群的定价随实例而异，但是具有非常有竞争力的定价。\n\n# Cloud Dataproc 和 AI 应用\n\nCloud\
    \ Dataproc 可以使用 Apache Spark，Hadoop 和其他工具来满足各种 AI 和 ML 用例。 将 Dataproc 视为完全托管的云\
    \ Hadoop 和 Spark 集群。 可以在 Hadoop 和 Spark 上构建的所有 AI 和 ML 用例都可以在 Cloud Dataproc 集群上构建。\n\
    \n# Cloud Dataflow\n\nCloud Dataflow 是用于运行批量和流应用的完全托管服务，并且具有用于运行 AI 和 ML 作业的丰富集成。\
    \ 它是 Google 提供的无服务器服务，基于 Apache Beam 构建，因此，批量代码和流代码都可以相互使用。 可以以非常简化的方式用 Java 和\
    \ Python 构建 Cloud Dataflow 应用。\n\nCloud Dataflow 与其他 GCP 服务集成在一起，例如 Cloud Pub/Sub，Cloud\
    \ Machine Learning，Stackdriver，BigQuery 和 Bigtable，这使得构建 Cloud Dataflow 作业非常容易。\
    \ 在 Cloud Dataflow 之下，App Engine 正在运行，因此用户拥有无限的能力来扩展其工作。 Cloud Dataflow 会根据工作需求自动扩展。\n\
    \n除了已处理数据的定价外，批量和流作业的 Cloud Dataflow 定价基本相同。 它根据 VCPU，RAM，持久性存储和处理的数据量进行收费。\n\n\
    # Cloud Dataflow 和 AI 应用\n\nCloud Dataflow 可以与 Cloud Machine Learning 集成，服务于各种\
    \ AL 和 ML 用例。 欺诈检测是一个经典的用例，可以使用 Cloud Dataflow 和 Cloud Machine Learning 实现流作业。\n\
    \n到目前为止，我们已经了解了 GCP 的基本知识，这将有助于我们有效地使用平台，做出正确的选择并建立有效的渠道。 现在，您已了解 GCP 上所有可用的计算，存储和处理选项。\
    \ 现在，让我们开始构建 ML 管道。\n\n# 建立 ML 管道\n\n让我们来看一个详细的示例，在该示例中，我们将建立一条端到端的管道，从将数据加载到\
    \ Cloud Storage，在其上创建 BigQuery 数据集，使用 BigQuery ML 训练模型并对其进行测试。 在此用例中，我们将使用逻辑回归模型来查找潜在客户转化概率。\
    \ 您可以使用选择的任何合适的数据集并遵循此示例。\n\n潜在客户数据包含有关潜在客户的各种属性。 BigQuery ML 具有内置功能，我们可以直接在任何数据集中训练模型。\
    \ 我们可以预测输出变量和转换概率。 BigQuery 提供了一个 SQL 接口来训练和评估机器学习模型。 该模型可以部署在平台上进行消费。\n\n我们有两个数据集：潜在客户训练数据和测试数据，其中训练数据为实际总体数据的\
    \ 80%，测试数据为 20%。 使用训练数据训练模型后，我们将在测试数据上评估模型，并在以下类别中找到每个潜在客户的潜在客户转换概率：\n\n*   Junk\
    \ lead\n\n*   合格（Qualified）\n\n*   有兴趣（Interested）\n\n*   封闭（Closed）\n\n*   没兴趣（Not\
    \ interested）\n\n*   不合格（Not eligible）\n\n*   无法到达（Unreachable）\n\n# 了解流程设计\n\n\
