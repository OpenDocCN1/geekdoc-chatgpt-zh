- raw: "让我们使用内置的线性学习器算法解决一个简单的回归问题。 例如，学生的**学业能力测验**（**SAT**）分数与**平均绩点**（**GPA**）分数之间存在已知的相关关系\
    \ 。 我们将有一个包含两列的示例 CSV 文件。\n\n第一列包含 GPA 分数（输出变量），第二列包含 SAT 分数。 首先让我们将 CSV 文件上传到存储桶。\
    \ 以下是使用 Cloud ML Engine 训练模型的简单步骤，该模型根据 SAT 分数预测 GPA 分数：\n\n1.  从导航菜单中输入 GCP 控制台和\
    \ AI 平台，然后转到`Jobs`侧菜单。 您将以表格格式查看所有作业（正在运行和已完成）。 单击标题菜单中的“新训练工作”按钮。\n\n2.  创建训练工作有两种选择：使用内置算法训练或自定义代码训练。\
    \ 在这种情况下，请选择“内置算法训练”选项。\n\n3.  选择线性学习器算法。\n\n4.  单击“下一步”按钮。\n\n在以下屏幕快照中直观地表示了所有前面的步骤。\
    \ 我们来看一下：\n\n![](Images/6ed5ffc64ac8153402e541c7a84dc8fe.png)\n\n图 8.1-Cloud ML\
    \ Engine 的模型训练所涉及的步骤（1）\n\n5.  提供 Google Storage 上 CSV 文件的标准路径。 该 CSV 文件包含没有标题行的训练数据，并且目标属性出现在第一列中。\n\
    \n6.  提供用于验证的训练数据百分比的数值。 默认情况下，此值为 20，并且可以根据用例上下文将此数字更改为任何合理的值。\n\n7.  提供用于测试的训练数据百分比的数字值（可选）。\
    \ 推荐值为 20，可以根据用例要求和机器学习问题的特征进行设置。\n\n8.  提供到要存储模型文件的输出目录的标准路径。 这必须是 Google Cloud\
    \ Storage 上的有效位置。\n\n9.  单击`NEXT`按钮，为算法提供运行时参数。\n\n在以下屏幕快照中直观地表示了所有前面的步骤。 我们来看一下：\n\
    \n![](Images/d28e126127adda13745da6f4e83b2883.png)\n\n图 8.2-Cloud Engine ML 模型训练所涉及的步骤（2）\n\
    \n10.  选择需要训练的模型类型。 当预期输出是连续变量时，将使用回归模型；而当预期输出是离散类时，将使用分类模型。\n\n11.  仔细选择最大步数，以确保完整的训练数据在生成的输出模型中得到充分体现。\
    \ 同时，为此参数设置很高的值会增加训练模型的计算成本。\n\n12.  学习率是使用梯度下降算法使用模型时使用的数值。 原则上，此属性指示学习算法的两次迭代之间的步长。\n\
    \n这是需要设置的基本参数。 在以下屏幕快照中直观地表示了所有前面的步骤。 我们来看一下：\n\n![](Images/669a2f8f7e33b48cddd927e2629ae02d.png)\n\
    \n图 8.3-将参数传递给模型训练\n\n除了这些基本参数外，还可以对模型进行超调，以进一步优化和提高准确率。 选中“最大步数”旁边的`HyperTune`复选框时，需要设置最小和最大步数；\
    \ 并且选中“学习率”旁边的`HyperTune`复选框时，需要设置最小和最大学习率。\n\n除了基本参数之外，还有一些高级设置可用作可配置参数，用于进一步调整模型训练，如以下屏幕快照所示：\n\
    \n![](Images/81f727e1323744fc6146fe63c76176b5.png)\n\n图 8.4-高级模型训练配置\n\n可用于调整的其他参数如下：\n\
    \n*   **评估步骤**：这是一个可选字段，指示需要对其进行评估的批量数量。 如果未指定参数，则对整个数据集运行评估。\n\n*   **批量大小**：这是在一个评估步骤中处理的数据行数。\n\
    \n*   **优化器类型**：我们可以选择三种可能的优化器，这些优化器根据梯度下降算法的实现细节而有所不同：\n\n    *   `AdamOptimizer`\n\
    \n    *   `FTRLOptimizer`（默认）\n\n    *   **随机梯度下降**（**SGD**）优化器\n\n*   **L1 正则化强度**：这是一个数值，表示正则化的一种类型，该类型与权重的绝对值之和成比例地对权重进行惩罚。\n\
    \n*   **L2 正则化强度**：这是一个数值，表示正则化的一种类型，该类型与权重的平方和成比例地对权重进行惩罚。\n\n*   **L2 收缩调整强度**：此参数适用于`FtrlOptimizer`，表示幅度损失。\
    \ 大于等于 0。\n\n设置算法参数后，最后一步是在下一个工作流程步骤中提供作业 ID，区域和资源大小，如下所示：\n\n13.  **作业 ID**：这是一个字母数字字段，在项目中必须是唯一的，并且一旦设置就无法更改。\
    \ 建议在作业 ID 创建中使用项目特定的上下文，因为这样可以更轻松地在生产环境中进行监视和故障排除。\n\n14.  **区域**：这是用于训练模型的服务器所在的地理区域。\
    \ 建议使用相同的区域来存储训练数据和模型训练。\n\n15.  **扩展层**：这定义了需要分配给 AI 平台用于训练工作的资源。 各个层具有预先配置的资源级别，并且可以进行自定义，如下所示：\n\
    \n```\n*   `BASIC`：此层设置单个工作程序实例。 顾名思义，这是基本配置级别，不能考虑用于生产负载。\n*   `STANDARD_1`：此层配置许多工作程序和一组有限的参数服务器。\n\
    *   `PREMIUM_1`：此层预配置了大量工作程序和参数服务器。\n*   `BASIC_GPU`：此层为 GPU 提供单个工作程序实例。 再一次，这将加快训练速度，仅对实验有益。\n\
    *   `BASIC_TPU`：此层使用 Cloud TPU 设置单个工作程序实例。\n*   `CUSTOM`：使用此配置时，可以完全配置用于训练的群集的规模。\
    \ 需要为自定义配置设置以下参数：\n    *   **主节点类型**：需要用于主节点的虚拟机的类型。 这是必填字段。\n    *   **工作器数**：这定义了用于训练的工作器数。\
    \ 如果工作器数设置为 1 或更多，则还需要设置工作器类型。\n    *   **参数服务器数**：这定义了用于训练的参数服务器的计数。 如果参数服务器的数量为\
    \ 1 个或更多，则需要设置参数服务器类型。\n```\n\n在以下屏幕快照中直观地表示了所有前面的步骤。 我们来看一下：\n\n![](Images/f5f1528446f6fa36593345f6bf7c6e4d.png)\n\
    \n图 8.5-模型训练的作业设置\n\n16.  作业设置完成后，模型开始训练，并且可以在控制台中跟踪作业。 以下屏幕截图显示了控制台中正在进行，成功和失败的作业：\n\
    \n![](Images/6680ef8492251e161f2db79da9347f3e.png)\n\n图 8.6-模型训练作业控制台\n\n17. \
    \ 一旦模型训练完成，就可以从控制台进行部署。 该模型可通过**表述性状态转移**（**REST**）API 与新数据集一起调用。 需要提供唯一的模型名称以及需要在其中部署模型的区域，以及关于模型的可选描述，如以下屏幕快照所示：\n\
    \n![](Images/cfc68997bdd9b47f60e40a3a0ebc3f8d.png)\n\n图 8.7-模型部署\n\n在这一点上，模型被训练和部署以供使用。\
    \ 在接下来的部分中，我们将研究利用模型和构建预测服务。\n\n# 使用自定义训练应用\n\n内置算法是一些最常用的算法。 但是，您将需要针对大多数实际用例训练定制模型。\
    \ AI 平台提供了用于训练自定义模型的标准一致框架。 以下屏幕快照描述了通用过程：\n\n![](Images/9f392440aa662fe5954fa6a1ebea786e.png)\n\
    \n图 8.8-在 AI 平台上训练自定义模型的步骤\n\nAI 平台与典型的机器学习开发生命周期同步工作并对其进行补充。 模型训练代码从本地文件夹或共享位置访问训练数据。\
    \ 我们需要从 Cloud Storage 位置访问训练数据。 提取数据后，需要分批量每个单独的数据实例。 可以根据用例上下文和数据量来决定这些批量。 评估数据用于测试模型的准确率。\
    \ 经过训练的模型将作为二进制文件导出，并存储在本地驱动器或 Cloud Storage 位置中。\n\n另外，可以以分布式方式训练模型。 AI 平台使其成为一个无缝的过程，并要求将有关多台机器的详细信息作为训练群集的参数进行传递。\
    \ 训练服务根据机器类型和所选容量执行资源分配。 在单个节点上运行的每个训练作业都称为**复制副本**。 每个副本都扮演一个角色，并对一组特定的训练数据进行操作。\
    \ 工作负载分配的详细信息由平台管理，不需要特定的用户配置或参与。 有三种类型的实体有助于分布式模型训练，如下所示：\n\n*   **主节点**：AI 平台将一个副本指定为主节点。\
    \ 分布式训练计划在其他可用节点上进行，并且主节点会跟踪进度。 训练作业的总体状态与主节点的状态相同。\n\n*   **工作器**：集群中可用的节点扮演工作器的角色。\
    \ 单个工作器执行其任务，并将状态报告回主节点。\n\n*   **参数服务器**：副本节点之一被指定为参数服务器，并执行节点之间模型的共享状态的协调任务。\n\
    \n分布式训练的基本且简单的策略涉及将数据分块为各个段，从而在节点上使用每个单独的数据段来训练模型。 在这种情况下，参数服务器会跟踪各个梯度值，并执行合并到最终模型状态的任务。\n\
    \n使用可用框架之一构建应用后，需要将其打包以便在平台上进行部署。 可以使用`gcloud` **命令行界面**（**CLI**）完成打包。 建议使用`gcloud`工具打包应用。\
    \ 可以使用标准打包和构建工具手动构建该包，如以下代码块所示：\n\n```\ngcloud ai-platform jobs submit training\
    \ $JOB_NAME --staging-bucket $PACKAGE_STAGING_PATH --job-dir $JOB_DIR --package-path\
    \ $TRAINER_PACKAGE_PATH --module-name $MAIN_TRAINER_MODULE --region $REGION \n\
    ```\n\n这是我们需要传递给脚本的参数的简要说明：\n\n*   `--staging-bucket`：这是一个存储训练和依赖项的云存储位置。 GCP\
    \ 项目需要有权访问此存储桶，建议该存储桶位于打算运行训练作业的同一区域中。\n\n*   `--job-dir`：这是一个云存储位置，用于存储训练作业的输出文件。\
    \ 该位置必须与训练作业要在同一区域进行。\n\n*   `--package-path`：这是父目录的本地路径，其中存在应用工件。 AI 平台将该路径中的内容打包到`tar.gz`文件中，并将其上传到云存储中。\
    \ 通过解压缩档案的内容来执行训练作业。\n\n*   `--module-name`：这是应用的名称。\n\n*   `--region`：这是执行训练工作的地理区域。\n\
    \n# 预测服务\n\n上一节中训练的机器学习模型可以基于新的数据集托管在云上进行消费和预测。 预测服务主要负责管理预测所需的存储和计算资源。 作为一般过程，需要导出训练工件。\
    \ 对于在 AI 平台上训练的模型以及在外部训练的模型，导出过程相同。 可以导出的最大模型大小为 250 MB。 如果需要导出更大的定制模型，则需要提交配额增加表。\
    \ AI 平台限制了计算基础架构的使用，因此该平台可以在合理的水平上使用，足以满足大多数通用用例的需要。\n\n但是，计算密集型和大型模型可能需要增加配额。\
    \ 机器学习模型预测是一个迭代过程，需要对模型的多个版本进行训练。 AI 平台将模型引用为特定机器学习管道的各种版本的容器。 模型可以包含管道的各种版本，并且特定版本可以由\
    \ API 调用。 一旦提供了模型版本，就应格式化需要发送到预测服务的数据，并将其提供给 API 调用进行预测。\n\n可以通过两种方式请求预测，如下所示：\n\
    \n*   **在线预测**：服务使用用于 API 调用的数据调用模型版本，并在响应中返回预测。 在后台，模型版本会在运行时部署在请求中指定的区域上。 平台可以缓存模型版本，该模型版本更常用于快速响应时间。\n\
    \n*   **批量预测**：批量预测是一个异步服务调用，当用例需求是这样的需求：需要大量进行预测时，可以使用该异步服务，并且可以在服务提供预测时独立进行处理。\
    \ 当请求批量预测时，预测服务会在 AI 平台上分配资源以运行作业。 这可能涉及一个或多个预测节点。 在每个分配的节点上还原模型图。 一旦分配了节点，输入数据就由主服务器分发以进行分布式预测。\
    \ 每个单独的节点在请求预测服务时将预测数据存储在提到的云存储位置中。\n\n在在线预测和批量预测的前提，可能的用例以及因此的存储和计算需求方面，存在根本的区别。\
    \ 在线预测的目标是最小化预测服务的等待时间（响应时间），并将预测返回到响应的消息正文中。 另一方面，批量预测的目标是处理具有大型数据集和复杂模型的大量实例。\
    \ 预测输出存储在 Cloud Storage 存储桶中，而不是在消息响应正文中发送。\n\n在线预测通常可以用在处理实时数据的用例中，并且需要及时进行预测以使系统采取行动。\
    \ 当预测需要对大量历史数据进行操作时，可以使用批量预测。 如果我们尝试使用批量预测模式运行较小的预测负载（数据量较小且算法简单），则与在线预测模型相比，它需要更长的时间。\
    \ 这是由于以下事实：发送请求时完成了计算和存储资源的提供，并且优先级低于在线预测作业。 为特定用例选择正确的预测模式非常重要。\n\n在创建用于在线预测的模型时，用户需要决定使用哪个区域来运行预测，并且必须决定是否启用在线预测日志记录。\
    \ 启用日志记录对于故障排除或测试很有用。 但是，启用日志记录时会产生额外的费用。 在提出在线模型预测请求之前，需要先考虑这些成本。\n\n应用开发人员还需要确定要使用的运行时版本，以及\
    \ Python 的版本和用于在线预测的机器类型。 可以根据数据量和模型的复杂性来确定机器类型。\n\n可以为预测服务启用三个级别的日志记录，如下所示：\n\
    \n*   **访问日志记录**：此日志记录有助于分析对预测服务的请求数，并跟踪请求开始和呈现时间的时间戳。 可以基于等待时间值以及预测服务的使用模式进行分析。\n\
    \n*   **流日志记录**：标准错误和标准输出被写入 Stackdriver Logging。 仅出于调试目的，需要仔细启用此设置，否则可能会遇到高昂的成本。\
    \ 仅在创建模型资源时才能启用此日志记录。\n\n*   **请求-响应日志记录**：此级别将在线预测请求和响应记录到 BigQuery 表中。\n\n可以使用`gcloud`命令行以及\
    \ REST API 启用这些日志记录级别。 为了使用`gcloud`启用访问日志记录，需要传递`--enable logging`参数，如下所示：\n\n\
    ```\ngcloud ai-platform models create model_name --regions us-central1 --enable-logging\
    \ \n```\n\n如以下代码块所示，需要传递`--enable-console-logging`参数以启用流日志记录：\n\n```\ngcloud ai-platform\
    \ models create model_name --regions us-central1 --enable-console-logging\n```\n\
    \n无法使用`gcloud`启用请求响应日志记录。 需要使用 REST API 启用它。 可以在创建模型和版本时设置日志记录级别。 `projects.models.create`\
    \ 方法用于创建模型，并通过以下 HTTP URI 进行调用：\n\n```\nPOST https://ml.googleapis.com/v1/{parent=projects/*}/models\n\
    ```\n\n父项是代表项目名称的必需的字符串 URL 参数。 为了成功验证请求，我们需要对项目具有`ml.models.create` Google **身份和访问管理**（**IAM**）权限。\
    \ 请求主体是模型对象的表示。 这是模型对象的示意图：\n\n```\n{\n  \"name\": string,\n  \"description\"\
    : string,\n  \"defaultVersion\": {\n    object (Version)\n  },\n  \"regions\"\
    : [\n    string\n  ],\n  \"onlinePredictionLogging\": boolean,\n  \"onlinePredictionConsoleLogging\"\
    : boolean,\n  \"labels\": {\n    string: string,\n    ...\n  },\n  \"etag\": string\n\
    }\n```\n\n让我们看一下下表中的模型参数列表及其描述：\n\n| **参数名称** || **类型** || **必填** || **说明** |\n\
    \n| --- | --- | --- | --- |\n\n| `name` || 字符串 || 是 || 这是模型的名称。 模型名称在项目中必须唯一。\
    \ |\n\n| --- | --- | --- | --- |\n\n| `description` || 字符串 || 否 || 这是创建模型时的描述。\
    \ |\n\n| `defaultVersion` || 目的 || 是 || 当未在请求内发送版本信息时，将使用该模型版本。 随着模型的发展，默认版本会不断变化并变得越来越有用。\
    \ 可以使用`projects.methods`更改为模型版本。 |\n\n| `regions[]` || 字符串数组 || 否 || 这是模型在其上部署的所有区域的列表。\
    \ 这是为 AI 平台的将来版本提供的。 在撰写本章时，平台仅支持一个区域。 默认值为`us-central1`。 |\n\n| `onlinePredictionLogging`\
    \ || 布尔型 || 否 || 如果设置为`true`，则在线预测日志将发送到 StackDriver Logging。 这些日志类似于服务器访问日志，其中记录了所有请求的请求时间戳和响应时间。\
    \ 默认情况下，此参数的值为`false`，需要将其显式设置为`true`。 |\n\n| `onlinePredictionConsoleLogging`\
    \ || 布尔型 || 否 || 如果设置为`true`，则在线预测日志将以更详细的方式发送到 StackDriver Logging，并包含标准输出以及标准错误日志消息的完整记录。\
    \ 该日志对于调试很有帮助，但需要谨慎使用以节省成本。 |\n\n| `labels` || 键值对映射 || 否 || 标签有助于组织 AI 平台上的各种资源。\
    \ 这些标签是可以具有任意值的键值字符串。 带标签的资源易于监视和分组。 我们最多可以提供 64 个标签。 键和值最多可以包含 63 个字符。 键必须以字母开头，并且可以包含字母数字字符，下划线和破折号。\
    \ |"
  fmt: "\n## 使用内置线性学习器算法解决回归问题\n\n让我们使用内置的线性学习器算法解决一个简单的回归问题。例如，学生的学业能力测验（`SAT`）分数与平均绩点（`GPA`）分数之间存在已知的相关关系。我们将有一个包含两列的示例\
    \ CSV 文件。\n\n第一列包含 GPA 分数（输出变量），第二列包含 SAT 分数。首先让我们将 CSV 文件上传到存储桶。以下是使用 Cloud ML\
    \ Engine 训练模型的简单步骤，该模型根据 SAT 分数预测 GPA 分数：\n\n### 创建训练作业\n\n1. 从导航菜单中进入 GCP 控制台和\
    \ AI 平台，然后转到 `Jobs` 侧菜单。您将以表格格式查看所有作业（正在运行和已完成）。单击标题菜单中的“新训练作业”按钮。\n2. 创建训练作业有两种选择：使用内置算法训练或自定义代码训练。在这种情况下，请选择“内置算法训练”选项。\n\
    3. 选择线性学习器算法。\n4. 单击“下一步”按钮。\n\n在以下屏幕快照中直观地表示了所有前面的步骤：\n\n![](Images/6ed5ffc64ac8153402e541c7a84dc8fe.png)\n\
    \n图 8.1 Cloud ML Engine 的模型训练所涉及的步骤（1）\n\n### 配置训练数据\n\n5. 提供 Google Storage 上\
    \ CSV 文件的标准路径。该 CSV 文件包含没有标题行的训练数据，并且目标属性出现在第一列中。\n6. 提供用于验证的训练数据百分比的数值。默认情况下，此值为\
    \ 20，并且可以根据用例上下文将此数字更改为任何合理的值。\n7. 提供用于测试的训练数据百分比的数字值（可选）。推荐值为 20，可以根据用例要求和机器学习问题的特征进行设置。\n\
    8. 提供到要存储模型文件的输出目录的标准路径。这必须是 Google Cloud Storage 上的有效位置。\n9. 单击 `NEXT` 按钮，为算法提供运行时参数。\n\
    \n在以下屏幕快照中直观地表示了所有前面的步骤：\n\n![](Images/d28e126127adda13745da6f4e83b2883.png)\n\
    \n图 8.2 Cloud Engine ML 模型训练所涉及的步骤（2）\n\n### 设置算法参数\n\n10. 选择需要训练的模型类型。当预期输出是连续变量时，将使用回归模型；而当预期输出是离散类时，将使用分类模型。\n\
    11. 仔细选择最大步数，以确保完整的训练数据在生成的输出模型中得到充分体现。同时，为此参数设置很高的值会增加训练模型的计算成本。\n12. 学习率是使用梯度下降算法训练模型时使用的数值。原则上，此属性指示学习算法的两次迭代之间的步长。\n\
    \n这是需要设置的基本参数。在以下屏幕快照中直观地表示了所有前面的步骤：\n\n![](Images/669a2f8f7e33b48cddd927e2629ae02d.png)\n\
    \n图 8.3 将参数传递给模型训练\n\n除了这些基本参数外，还可以对模型进行超调，以进一步优化和提高准确率。选中“最大步数”旁边的 `HyperTune`\
    \ 复选框时，需要设置最小和最大步数；并且选中“学习率”旁边的 `HyperTune` 复选框时，需要设置最小和最大学习率。\n\n除了基本参数之外，还有一些高级设置可用作可配置参数，用于进一步调整模型训练，如以下屏幕快照所示：\n\
    \n![](Images/81f727e1323744fc6146fe63c76176b5.png)\n\n图 8.4 高级模型训练配置\n\n可用于调整的其他参数如下：\n\
    \n*   **评估步骤** (`Evaluation Steps`)：这是一个可选字段，指示需要对其进行评估的批量数量。如果未指定参数，则对整个数据集运行评估。\n\
    *   **批量大小** (`Batch Size`)：这是在一个评估步骤中处理的数据行数。\n*   **优化器类型** (`Optimizer Type`)：我们可以选择三种可能的优化器，这些优化器根据梯度下降算法的实现细节而有所不同：\n\
    \    *   `AdamOptimizer`\n    *   `FTRLOptimizer`（默认）\n    *   `SGD`（随机梯度下降）优化器\n\
    *   **L1 正则化强度** (`L1 Regularization Strength`)：这是一个数值，表示正则化的一种类型，该类型与权重的绝对值之和成比例地对权重进行惩罚。\n\
    *   **L2 正则化强度** (`L2 Regularization Strength`)：这是一个数值，表示正则化的一种类型，该类型与权重的平方和成比例地对权重进行惩罚。\n\
    *   **L2 收缩调整强度** (`L2 Shrinkage Regularization Strength`)：此参数适用于 `FtrlOptimizer`，表示幅度损失。大于等于\
    \ 0。\n\n### 作业设置\n\n设置算法参数后，最后一步是在下一个工作流程步骤中提供作业 ID、区域和资源大小，如下所示：\n\n13. **作业\
    \ ID** (`Job ID`)：这是一个字母数字字段，在项目中必须是唯一的，并且一旦设置就无法更改。建议在作业 ID 创建中使用项目特定的上下文，因为这样可以更轻松地在生产环境中进行监视和故障排除。\n\
    14. **区域** (`Region`)：这是用于训练模型的服务器所在的地理区域。建议使用相同的区域来存储训练数据和模型训练。\n15. **扩展层**\
    \ (`Scale Tier`)：这定义了需要分配给 AI 平台用于训练作业的资源。各个层具有预先配置的资源级别，并且可以进行自定义，如下所示：\n\n```\n\
    *   `BASIC`：此层设置单个工作程序实例。顾名思义，这是基本配置级别，不能考虑用于生产负载。\n*   `STANDARD_1`：此层配置许多工作程序和一组有限的参数服务器。\n\
    *   `PREMIUM_1`：此层预配置了大量工作程序和参数服务器。\n*   `BASIC_GPU`：此层为 GPU 提供单个工作程序实例。再一次，这将加快训练速度，仅对实验有益。\n\
    *   `BASIC_TPU`：此层使用 Cloud TPU 设置单个工作程序实例。\n*   `CUSTOM`：使用此配置时，可以完全配置用于训练的群集的规模。需要为自定义配置设置以下参数：\n\
    \    *   **主节点类型** (`Master Type`)：需要用于主节点的虚拟机的类型。这是必填字段。\n    *   **工作器数** (`Worker\
    \ Count`)：这定义了用于训练的工作器数。如果工作器数设置为 1 或更多，则还需要设置工作器类型。\n    *   **参数服务器数** (`Parameter\
    \ Server Count`)：这定义了用于训练的参数服务器的计数。如果参数服务器的数量为 1 个或更多，则需要设置参数服务器类型。\n```\n\n在以下屏幕快照中直观地表示了所有前面的步骤：\n\
    \n![](Images/f5f1528446f6fa36593345f6bf7c6e4d.png)\n\n图 8.5 模型训练的作业设置\n\n### 训练与部署\n\
    \n16. 作业设置完成后，模型开始训练，并且可以在控制台中跟踪作业。以下屏幕截图显示了控制台中正在进行、成功和失败的作业：\n\n![](Images/6680ef8492251e161f2db79da9347f3e.png)\n\
    \n图 8.6 模型训练作业控制台\n\n17. 一旦模型训练完成，就可以从控制台进行部署。该模型可通过表述性状态转移（`REST`）API 与新数据集一起调用。需要提供唯一的模型名称以及需要在其中部署模型的区域，以及关于模型的可选描述，如以下屏幕快照所示：\n\
    \n![](Images/cfc68997bdd9b47f60e40a3a0ebc3f8d.png)\n\n图 8.7 模型部署\n\n在这一点上，模型被训练和部署以供使用。在接下来的部分中，我们将研究利用模型和构建预测服务。\n\
    \n## 使用自定义训练应用\n\n内置算法是一些最常用的算法。但是，您将需要针对大多数实际用例训练定制模型。AI 平台提供了用于训练自定义模型的标准一致框架。以下屏幕快照描述了通用过程：\n\
    \n![](Images/9f392440aa662fe5954fa6a1ebea786e.png)\n\n图 8.8 在 AI 平台上训练自定义模型的步骤\n\
    \nAI 平台与典型的机器学习开发生命周期同步工作并对其进行补充。模型训练代码从本地文件夹或共享位置访问训练数据。我们需要从 Cloud Storage 位置访问训练数据。提取数据后，需要分批处理每个单独的数据实例。可以根据用例上下文和数据量来决定这些批量。评估数据用于测试模型的准确率。经过训练的模型将作为二进制文件导出，并存储在本地驱动器或\
    \ Cloud Storage 位置中。\n\n另外，可以以分布式方式训练模型。AI 平台使其成为一个无缝的过程，并要求将有关多台机器的详细信息作为训练群集的参数进行传递。训练服务根据机器类型和所选容量执行资源分配。在单个节点上运行的每个训练作业都称为复制副本。每个副本都扮演一个角色，并对一组特定的训练数据进行操作。工作负载分配的详细信息由平台管理，不需要特定的用户配置或参与。有三种类型的实体有助于分布式模型训练，如下所示：\n\
    \n*   **主节点** (`Master`)：AI 平台将一个副本指定为主节点。分布式训练计划在其他可用节点上进行，并且主节点会跟踪进度。训练作业的总体状态与主节点的状态相同。\n\
    *   **工作器** (`Worker`)：集群中可用的节点扮演工作器的角色。单个工作器执行其任务，并将状态报告回主节点。\n*   **参数服务器**\
    \ (`Parameter Server`)：副本节点之一被指定为参数服务器，并执行节点之间模型的共享状态的协调任务。\n\n分布式训练的基本且简单的策略涉及将数据分块为各个段，从而在节点上使用每个单独的数据段来训练模型。在这种情况下，参数服务器会跟踪各个梯度值，并执行合并到最终模型状态的任务。\n\
    \n使用可用框架之一构建应用后，需要将其打包以便在平台上进行部署。可以使用 `gcloud` 命令行界面（`CLI`）完成打包。建议使用 `gcloud`\
    \ 工具打包应用。可以使用标准打包和构建工具手动构建该包，如以下代码块所示：\n\n```\ngcloud ai-platform jobs submit\
    \ training $JOB_NAME --staging-bucket $PACKAGE_STAGING_PATH --job-dir $JOB_DIR\
    \ --package-path $TRAINER_PACKAGE_PATH --module-name $MAIN_TRAINER_MODULE --region\
    \ $REGION\n```\n\n这是我们需要传递给脚本的参数的简要说明：\n\n*   `--staging-bucket`：这是一个存储训练和依赖项的云存储位置。GCP\
    \ 项目需要有权访问此存储桶，建议该存储桶位于打算运行训练作业的同一区域中。\n*   `--job-dir`：这是一个云存储位置，用于存储训练作业的输出文件。该位置必须与训练作业要在同一区域进行。\n\
    *   `--package-path`：这是父目录的本地路径，其中存在应用工件。AI 平台将该路径中的内容打包到 `tar.gz` 文件中，并将其上传到云存储中。通过解压缩档案的内容来执行训练作业。\n\
    *   `--module-name`：这是应用的名称。\n*   `--region`：这是执行训练工作的地理区域。\n\n## 预测服务\n\n上一节中训练的机器学习模型可以基于新的数据集托管在云上进行消费和预测。预测服务主要负责管理预测所需的存储和计算资源。作为一般过程，需要导出训练工件。对于在\
    \ AI 平台上训练的模型以及在外部训练的模型，导出过程相同。可以导出的最大模型大小为 250 MB。如果需要导出更大的定制模型，则需要提交配额增加表。AI\
    \ 平台限制了计算基础架构的使用，因此该平台可以在合理的水平上使用，足以满足大多数通用用例的需要。\n\n但是，计算密集型和大型模型可能需要增加配额。机器学习模型预测是一个迭代过程，需要对模型的多个版本进行训练。AI\
    \ 平台将模型引用为特定机器学习管道的各种版本的容器。模型可以包含管道的各种版本，并且特定版本可以由 API 调用。一旦提供了模型版本，就应格式化需要发送到预测服务的数据，并将其提供给\
    \ API 调用进行预测。\n\n可以通过两种方式请求预测，如下所示：\n\n*   **在线预测** (`Online Prediction`)：服务使用用于\
    \ API 调用的数据调用模型版本，并在响应中返回预测。在后台，模型版本会在运行时部署在请求中指定的区域上。平台可以缓存模型版本，该模型版本更常用于快速响应时间。\n\
    *   **批量预测** (`Batch Prediction`)：批量预测是一个异步服务调用，当用例需求是这样的需求：需要大量进行预测时，可以使用该异步服务，并且可以在服务提供预测时独立进行处理。当请求批量预测时，预测服务会在\
    \ AI 平台上分配资源以运行作业。这可能涉及一个或多个预测节点。在每个分配的节点上还原模型图。一旦分配了节点，输入数据就由主服务器分发以进行分布式预测。每个单独的节点在请求预测服务时将预测数据存储在提到的云存储位置中。\n\
    \n在在线预测和批量预测的前提、可能的用例以及因此的存储和计算需求方面，存在根本的区别。在线预测的目标是最小化预测服务的等待时间（响应时间），并将预测返回到响应的消息正文中。另一方面，批量预测的目标是处理具有大型数据集和复杂模型的大量实例。预测输出存储在\
    \ Cloud Storage 存储桶中，而不是在消息响应正文中发送。\n\n在线预测通常可以用在处理实时数据的用例中，并且需要及时进行预测以使系统采取行动。当预测需要对大量历史数据进行操作时，可以使用批量预测。如果我们尝试使用批量预测模式运行较小的预测负载（数据量较小且算法简单），则与在线预测模型相比，它需要更长的时间。这是由于以下事实：发送请求时完成了计算和存储资源的提供，并且优先级低于在线预测作业。为特定用例选择正确的预测模式非常重要。\n\
    \n### 日志记录配置\n\n在创建用于在线预测的模型时，用户需要决定使用哪个区域来运行预测，并且必须决定是否启用在线预测日志记录。启用日志记录对于故障排除或测试很有用。但是，启用日志记录时会产生额外的费用。在提出在线模型预测请求之前，需要先考虑这些成本。\n\
    \n应用开发人员还需要确定要使用的运行时版本，以及 Python 的版本和用于在线预测的机器类型。可以根据数据量和模型的复杂性来确定机器类型。\n\n可以为预测服务启用三个级别的日志记录，如下所示：\n\
    \n*   **访问日志记录** (`Access Logging`)：此日志记录有助于分析对预测服务的请求数，并跟踪请求开始和呈现时间的时间戳。可以基于等待时间值以及预测服务的使用模式进行分析。\n\
    *   **流日志记录** (`Console Logging`)：标准错误和标准输出被写入 Stackdriver Logging。仅出于调试目的，需要仔细启用此设置，否则可能会遇到高昂的成本。仅在创建模型资源时才能启用此日志记录。\n\
    *   **请求-响应日志记录** (`Request-Response Logging`)：此级别将在线预测请求和响应记录到 BigQuery 表中。\n\
    \n可以使用 `gcloud` 命令行以及 `REST` API 启用这些日志记录级别。为了使用 `gcloud` 启用访问日志记录，需要传递 `--enable-logging`\
    \ 参数，如下所示：\n\n```\ngcloud ai-platform models create model_name --regions us-central1\
    \ --enable-logging\n```\n\n如以下代码块所示，需要传递 `--enable-console-logging` 参数以启用流日志记录：\n\
    \n```\ngcloud ai-platform models create model_name --regions us-central1 --enable-console-logging\n\
    ```\n\n无法使用 `gcloud` 启用请求响应日志记录。需要使用 `REST` API 启用它。可以在创建模型和版本时设置日志记录级别。`projects.models.create`\
    \ 方法用于创建模型，并通过以下 HTTP URI 进行调用：\n\n```\nPOST https://ml.googleapis.com/v1/{parent=projects/*}/models\n\
    ```\n\n父项是代表项目名称的必需的字符串 URL 参数。为了成功验证请求，我们需要对项目具有 `ml.models.create` Google 身份和访问管理（`IAM`）权限。请求主体是模型对象的表示。这是模型对象的示意图：\n\
    \n```\n{\n  \"name\": string,\n  \"description\": string,\n  \"defaultVersion\"\
    : {\n    object (Version)\n  },\n  \"regions\": [\n    string\n  ],\n  \"onlinePredictionLogging\"\
    : boolean,\n  \"onlinePredictionConsoleLogging\": boolean,\n  \"labels\": {\n\
    \    string: string,\n    ...\n  },\n  \"etag\": string\n}\n```\n\n让我们看一下下表中的模型参数列表及其描述：\n\
    \n| **参数名称** | **类型** | **必填** | **说明** |\n| --- | --- | --- | --- |\n| `name`\
    \ | 字符串 | 是 | 这是模型的名称。模型名称在项目中必须唯一。 |\n| `description` | 字符串 | 否 | 这是创建模型时的描述。\
    \ |\n| `defaultVersion` | 对象 (Version) | 是 | 当未在请求内发送版本信息时，将使用该模型版本。随着模型的发展，默认版本会不断变化并变得越来越有用。可以使用\
    \ `projects.methods` 更改为模型版本。 |\n| `regions[]` | 字符串数组 | 否 | 这是模型在其上部署的所有区域的列表。这是为\
    \ AI 平台的将来版本提供的。在撰写本章时，平台仅支持一个区域。默认值为 `us-central1`。 |\n| `onlinePredictionLogging`\
    \ | 布尔型 | 否 | 如果设置为 `true`，则在线预测日志将发送到 Stackdriver Logging。这些日志类似于服务器访问日志，其中记录了所有请求的请求时间戳和响应时间。默认情况下，此参数的值为\
    \ `false`，需要将其显式设置为 `true`。 |\n| `onlinePredictionConsoleLogging` | 布尔型 | 否 |\
    \ 如果设置为 `true`，则在线预测日志将以更详细的方式发送到 Stackdriver Logging，并包含标准输出以及标准错误日志消息的完整记录。该日志对于调试很有帮助，但需要谨慎使用以节省成本。\
    \ |\n| `labels` | 键值对映射 | 否 | 标签有助于组织 AI 平台上的各种资源。这些标签是可以具有任意值的键值字符串。带标签的资源易于监视和分组。我们最多可以提供\
    \ 64 个标签。键和值最多可以包含 63 个字符。键必须以字母开头，并且可以包含字母数字字符、下划线和破折号。 |\n"
  trans: "\n\n## 使用内置线性学习器算法解决回归问题\n\n让我们使用内置的线性学习器算法解决一个简单的回归问题。例如，学生的学业能力测验（`SAT`）分数与平均绩点（`GPA`）分数之间存在已知的相关关系。我们将有一个包含两列的示例\
    \ CSV 文件。\n\n第一列包含 GPA 分数（输出变量），第二列包含 SAT 分数。首先让我们将 CSV 文件上传到存储桶。以下是使用 Cloud ML\
    \ Engine 训练模型的简单步骤，该模型根据 SAT 分数预测 GPA 分数：\n\n### 创建训练作业\n\n1. 从导航菜单中进入 GCP 控制台和\
    \ AI 平台，然后转到 `Jobs` 侧菜单。您将以表格格式查看所有作业（正在运行和已完成）。单击标题菜单中的“新训练作业”按钮。\n2. 创建训练作业有两种选择：使用内置算法训练或自定义代码训练。在这种情况下，请选择“内置算法训练”选项。\n\
    3. 选择线性学习器算法。\n4. 单击“下一步”按钮。\n\n在以下屏幕快照中直观地表示了所有前面的步骤：\n\n![](img/6ed5ffc64ac8153402e541c7a84dc8fe.png)\n\
    \n图 8.1 Cloud ML Engine 的模型训练所涉及的步骤（1）\n\n### 配置训练数据\n\n5. 提供 Google Storage 上\
    \ CSV 文件的标准路径。该 CSV 文件包含没有标题行的训练数据，并且目标属性出现在第一列中。\n6. 提供用于验证的训练数据百分比的数值。默认情况下，此值为\
    \ 20，并且可以根据用例上下文将此数字更改为任何合理的值。\n7. 提供用于测试的训练数据百分比的数字值（可选）。推荐值为 20，可以根据用例要求和机器学习问题的特征进行设置。\n\
    8. 提供到要存储模型文件的输出目录的标准路径。这必须是 Google Cloud Storage 上的有效位置。\n9. 单击 `NEXT` 按钮，为算法提供运行时参数。\n\
    \n在以下屏幕快照中直观地表示了所有前面的步骤：\n\n![](img/d28e126127adda13745da6f4e83b2883.png)\n\n\
    图 8.2 Cloud Engine ML 模型训练所涉及的步骤（2）\n\n### 设置算法参数\n\n10. 选择需要训练的模型类型。当预期输出是连续变量时，将使用回归模型；而当预期输出是离散类时，将使用分类模型。\n\
    11. 仔细选择最大步数，以确保完整的训练数据在生成的输出模型中得到充分体现。同时，为此参数设置很高的值会增加训练模型的计算成本。\n12. 学习率是使用梯度下降算法训练模型时使用的数值。原则上，此属性指示学习算法的两次迭代之间的步长。\n\
    \n这是需要设置的基本参数。在以下屏幕快照中直观地表示了所有前面的步骤：\n\n![](img/669a2f8f7e33b48cddd927e2629ae02d.png)\n\
    \n图 8.3 将参数传递给模型训练\n\n除了这些基本参数外，还可以对模型进行超调，以进一步优化和提高准确率。选中“最大步数”旁边的 `HyperTune`\
    \ 复选框时，需要设置最小和最大步数；并且选中“学习率”旁边的 `HyperTune` 复选框时，需要设置最小和最大学习率。\n\n除了基本参数之外，还有一些高级设置可用作可配置参数，用于进一步调整模型训练，如以下屏幕快照所示：\n\
    \n![](img/81f727e1323744fc6146fe63c76176b5.png)\n\n图 8.4 高级模型训练配置\n\n可用于调整的其他参数如下：\n\
    \n*   **评估步骤** (`Evaluation Steps`)：这是一个可选字段，指示需要对其进行评估的批量数量。如果未指定参数，则对整个数据集运行评估。\n\
    *   **批量大小** (`Batch Size`)：这是在一个评估步骤中处理的数据行数。\n*   **优化器类型** (`Optimizer Type`)：我们可以选择三种可能的优化器，这些优化器根据梯度下降算法的实现细节而有所不同：\n\
    \    *   `AdamOptimizer`\n    *   `FTRLOptimizer`（默认）\n    *   `SGD`（随机梯度下降）优化器\n\
    *   **L1 正则化强度** (`L1 Regularization Strength`)：这是一个数值，表示正则化的一种类型，该类型与权重的绝对值之和成比例地对权重进行惩罚。\n\
    *   **L2 正则化强度** (`L2 Regularization Strength`)：这是一个数值，表示正则化的一种类型，该类型与权重的平方和成比例地对权重进行惩罚。\n\
    *   **L2 收缩调整强度** (`L2 Shrinkage Regularization Strength`)：此参数适用于 `FtrlOptimizer`，表示幅度损失。大于等于\
    \ 0。\n\n### 作业设置\n\n设置算法参数后，最后一步是在下一个工作流程步骤中提供作业 ID、区域和资源大小，如下所示：\n\n13. **作业\
    \ ID** (`Job ID`)：这是一个字母数字字段，在项目中必须是唯一的，并且一旦设置就无法更改。建议在作业 ID 创建中使用项目特定的上下文，因为这样可以更轻松地在生产环境中进行监视和故障排除。\n\
    14. **区域** (`Region`)：这是用于训练模型的服务器所在的地理区域。建议使用相同的区域来存储训练数据和模型训练。\n15. **扩展层**\
    \ (`Scale Tier`)：这定义了需要分配给 AI 平台用于训练作业的资源。各个层具有预先配置的资源级别，并且可以进行自定义，如下所示：\n\n```\n\
    *   `BASIC`：此层设置单个工作程序实例。顾名思义，这是基本配置级别，不能考虑用于生产负载。\n*   `STANDARD_1`：此层配置许多工作程序和一组有限的参数服务器。\n\
    *   `PREMIUM_1`：此层预配置了大量工作程序和参数服务器。\n*   `BASIC_GPU`：此层为 GPU 提供单个工作程序实例。再一次，这将加快训练速度，仅对实验有益。\n\
    *   `BASIC_TPU`：此层使用 Cloud TPU 设置单个工作程序实例。\n*   `CUSTOM`：使用此配置时，可以完全配置用于训练的群集的规模。需要为自定义配置设置以下参数：\n\
    \    *   **主节点类型** (`Master Type`)：需要用于主节点的虚拟机的类型。这是必填字段。\n    *   **工作器数** (`Worker\
    \ Count`)：这定义了用于训练的工作器数。如果工作器数设置为 1 或更多，则还需要设置工作器类型。\n    *   **参数服务器数** (`Parameter\
    \ Server Count`)：这定义了用于训练的参数服务器的计数。如果参数服务器的数量为 1 个或更多，则需要设置参数服务器类型。\n```\n\n在以下屏幕快照中直观地表示了所有前面的步骤：\n\
    \n![](img/f5f1528446f6fa36593345f6bf7c6e4d.png)\n\n图 8.5 模型训练的作业设置\n\n### 训练与部署\n\
    \n16. 作业设置完成后，模型开始训练，并且可以在控制台中跟踪作业。以下屏幕截图显示了控制台中正在进行、成功和失败的作业：\n\n![](img/6680ef8492251e161f2db79da9347f3e.png)\n\
    \n图 8.6 模型训练作业控制台\n\n17. 一旦模型训练完成，就可以从控制台进行部署。该模型可通过表述性状态转移（`REST`）API 与新数据集一起调用。需要提供唯一的模型名称以及需要在其中部署模型的区域，以及关于模型的可选描述，如以下屏幕快照所示：\n\
    \n![](img/cfc68997bdd9b47f60e40a3a0ebc3f8d.png)\n\n图 8.7 模型部署\n\n在这一点上，模型被训练和部署以供使用。在接下来的部分中，我们将研究利用模型和构建预测服务。\n\
    \n## 使用自定义训练应用\n\n内置算法是一些最常用的算法。但是，您将需要针对大多数实际用例训练定制模型。AI 平台提供了用于训练自定义模型的标准一致框架。以下屏幕快照描述了通用过程：\n\
    \n![](img/9f392440aa662fe5954fa6a1ebea786e.png)\n\n图 8.8 在 AI 平台上训练自定义模型的步骤\n\n\
    AI 平台与典型的机器学习开发生命周期同步工作并对其进行补充。模型训练代码从本地文件夹或共享位置访问训练数据。我们需要从 Cloud Storage 位置访问训练数据。提取数据后，需要分批处理每个单独的数据实例。可以根据用例上下文和数据量来决定这些批量。评估数据用于测试模型的准确率。经过训练的模型将作为二进制文件导出，并存储在本地驱动器或\
    \ Cloud Storage 位置中。\n\n另外，可以以分布式方式训练模型。AI 平台使其成为一个无缝的过程，并要求将有关多台机器的详细信息作为训练群集的参数进行传递。训练服务根据机器类型和所选容量执行资源分配。在单个节点上运行的每个训练作业都称为复制副本。每个副本都扮演一个角色，并对一组特定的训练数据进行操作。工作负载分配的详细信息由平台管理，不需要特定的用户配置或参与。有三种类型的实体有助于分布式模型训练，如下所示：\n\
    \n*   **主节点** (`Master`)：AI 平台将一个副本指定为主节点。分布式训练计划在其他可用节点上进行，并且主节点会跟踪进度。训练作业的总体状态与主节点的状态相同。\n\
    *   **工作器** (`Worker`)：集群中可用的节点扮演工作器的角色。单个工作器执行其任务，并将状态报告回主节点。\n*   **参数服务器**\
    \ (`Parameter Server`)：副本节点之一被指定为参数服务器，并执行节点之间模型的共享状态的协调任务。\n\n分布式训练的基本且简单的策略涉及将数据分块为各个段，从而在节点上使用每个单独的数据段来训练模型。在这种情况下，参数服务器会跟踪各个梯度值，并执行合并到最终模型状态的任务。\n\
    \n使用可用框架之一构建应用后，需要将其打包以便在平台上进行部署。可以使用 `gcloud` 命令行界面（`CLI`）完成打包。建议使用 `gcloud`\
    \ 工具打包应用。可以使用标准打包和构建工具手动构建该包，如以下代码块所示：\n\n```\ngcloud ai-platform jobs submit\
    \ training $JOB_NAME --staging-bucket $PACKAGE_STAGING_PATH --job-dir $JOB_DIR\
    \ --package-path $TRAINER_PACKAGE_PATH --module-name $MAIN_TRAINER_MODULE --region\
    \ $REGION\n```\n\n这是我们需要传递给脚本的参数的简要说明：\n\n*   `--staging-bucket`：这是一个存储训练和依赖项的云存储位置。GCP\
    \ 项目需要有权访问此存储桶，建议该存储桶位于打算运行训练作业的同一区域中。\n*   `--job-dir`：这是一个云存储位置，用于存储训练作业的输出文件。该位置必须与训练作业要在同一区域进行。\n\
    *   `--package-path`：这是父目录的本地路径，其中存在应用工件。AI 平台将该路径中的内容打包到 `tar.gz` 文件中，并将其上传到云存储中。通过解压缩档案的内容来执行训练作业。\n\
    *   `--module-name`：这是应用的名称。\n*   `--region`：这是执行训练工作的地理区域。\n\n## 预测服务\n\n上一节中训练的机器学习模型可以基于新的数据集托管在云上进行消费和预测。预测服务主要负责管理预测所需的存储和计算资源。作为一般过程，需要导出训练工件。对于在\
    \ AI 平台上训练的模型以及在外部训练的模型，导出过程相同。可以导出的最大模型大小为 250 MB。如果需要导出更大的定制模型，则需要提交配额增加表。AI\
    \ 平台限制了计算基础架构的使用，因此该平台可以在合理的水平上使用，足以满足大多数通用用例的需要。\n\n但是，计算密集型和大型模型可能需要增加配额。机器学习模型预测是一个迭代过程，需要对模型的多个版本进行训练。AI\
    \ 平台将模型引用为特定机器学习管道的各种版本的容器。模型可以包含管道的各种版本，并且特定版本可以由 API 调用。一旦提供了模型版本，就应格式化需要发送到预测服务的数据，并将其提供给\
    \ API 调用进行预测。\n\n可以通过两种方式请求预测，如下所示：\n\n*   **在线预测** (`Online Prediction`)：服务使用用于\
    \ API 调用的数据调用模型版本，并在响应中返回预测。在后台，模型版本会在运行时部署在请求中指定的区域上。平台可以缓存模型版本，该模型版本更常用于快速响应时间。\n\
    *   **批量预测** (`Batch Prediction`)：批量预测是一个异步服务调用，当用例需求是这样的需求：需要大量进行预测时，可以使用该异步服务，并且可以在服务提供预测时独立进行处理。当请求批量预测时，预测服务会在\
    \ AI 平台上分配资源以运行作业。这可能涉及一个或多个预测节点。在每个分配的节点上还原模型图。一旦分配了节点，输入数据就由主服务器分发以进行分布式预测。每个单独的节点在请求预测服务时将预测数据存储在提到的云存储位置中。\n\
    \n在在线预测和批量预测的前提、可能的用例以及因此的存储和计算需求方面，存在根本的区别。在线预测的目标是最小化预测服务的等待时间（响应时间），并将预测返回到响应的消息正文中。另一方面，批量预测的目标是处理具有大型数据集和复杂模型的大量实例。预测输出存储在\
    \ Cloud Storage 存储桶中，而不是在消息响应正文中发送。\n\n在线预测通常可以用在处理实时数据的用例中，并且需要及时进行预测以使系统采取行动。当预测需要对大量历史数据进行操作时，可以使用批量预测。如果我们尝试使用批量预测模式运行较小的预测负载（数据量较小且算法简单），则与在线预测模型相比，它需要更长的时间。这是由于以下事实：发送请求时完成了计算和存储资源的提供，并且优先级低于在线预测作业。为特定用例选择正确的预测模式非常重要。\n\
    \n### 日志记录配置\n\n在创建用于在线预测的模型时，用户需要决定使用哪个区域来运行预测，并且必须决定是否启用在线预测日志记录。启用日志记录对于故障排除或测试很有用。但是，启用日志记录时会产生额外的费用。在提出在线模型预测请求之前，需要先考虑这些成本。\n\
    \n应用开发人员还需要确定要使用的运行时版本，以及 Python 的版本和用于在线预测的机器类型。可以根据数据量和模型的复杂性来确定机器类型。\n\n可以为预测服务启用三个级别的日志记录，如下所示：\n\
    \n*   **访问日志记录** (`Access Logging`)：此日志记录有助于分析对预测服务的请求数，并跟踪请求开始和呈现时间的时间戳。可以基于等待时间值以及预测服务的使用模式进行分析。\n\
    *   **流日志记录** (`Console Logging`)：标准错误和标准输出被写入 Stackdriver Logging。仅出于调试目的，需要仔细启用此设置，否则可能会遇到高昂的成本。仅在创建模型资源时才能启用此日志记录。\n\
    *   **请求-响应日志记录** (`Request-Response Logging`)：此级别将在线预测请求和响应记录到 BigQuery 表中。\n\
    \n可以使用 `gcloud` 命令行以及 `REST` API 启用这些日志记录级别。为了使用 `gcloud` 启用访问日志记录，需要传递 `--enable-logging`\
    \ 参数，如下所示：\n\n```\ngcloud ai-platform models create model_name --regions us-central1\
    \ --enable-logging\n```\n\n如以下代码块所示，需要传递 `--enable-console-logging` 参数以启用流日志记录：\n\
    \n```\ngcloud ai-platform models create model_name --regions us-central1 --enable-console-logging\n\
    ```\n\n无法使用 `gcloud` 启用请求响应日志记录。需要使用 `REST` API 启用它。可以在创建模型和版本时设置日志记录级别。`projects.models.create`\
    \ 方法用于创建模型，并通过以下 HTTP URI 进行调用：\n\n```\nPOST https://ml.googleapis.com/v1/{parent=projects/*}/models\n\
    ```\n\n父项是代表项目名称的必需的字符串 URL 参数。为了成功验证请求，我们需要对项目具有 `ml.models.create` Google 身份和访问管理（`IAM`）权限。请求主体是模型对象的表示。这是模型对象的示意图：\n\
    \n```\n{\n  \"name\": string,\n  \"description\": string,\n  \"defaultVersion\"\
    : {\n    object (Version)\n  },\n  \"regions\": [\n    string\n  ],\n  \"onlinePredictionLogging\"\
    : boolean,\n  \"onlinePredictionConsoleLogging\": boolean,\n  \"labels\": {\n\
    \    string: string,\n    ...\n  },\n  \"etag\": string\n}\n```\n\n让我们看一下下表中的模型参数列表及其描述：\n\
    \n| **参数名称** | **类型** | **必填** | **说明** |\n| --- | --- | --- | --- |\n| `name`\
    \ | 字符串 | 是 | 这是模型的名称。模型名称在项目中必须唯一。 |\n| `description` | 字符串 | 否 | 这是创建模型时的描述。\
    \ |\n| `defaultVersion` | 对象 (Version) | 是 | 当未在请求内发送版本信息时，将使用该模型版本。随着模型的发展，默认版本会不断变化并变得越来越有用。可以使用\
    \ `projects.methods` 更改为模型版本。 |\n| `regions[]` | 字符串数组 | 否 | 这是模型在其上部署的所有区域的列表。这是为\
    \ AI 平台的将来版本提供的。在撰写本章时，平台仅支持一个区域。默认值为 `us-central1`。 |\n| `onlinePredictionLogging`\
    \ | 布尔型 | 否 | 如果设置为 `true`，则在线预测日志将发送到 Stackdriver Logging。这些日志类似于服务器访问日志，其中记录了所有请求的请求时间戳和响应时间。默认情况下，此参数的值为\
    \ `false`，需要将其显式设置为 `true`。 |\n| `onlinePredictionConsoleLogging` | 布尔型 | 否 |\
    \ 如果设置为 `true`，则在线预测日志将以更详细的方式发送到 Stackdriver Logging，并包含标准输出以及标准错误日志消息的完整记录。该日志对于调试很有帮助，但需要谨慎使用以节省成本。\
    \ |\n| `labels` | 键值对映射 | 否 | 标签有助于组织 AI 平台上的各种资源。这些标签是可以具有任意值的键值字符串。带标签的资源易于监视和分组。我们最多可以提供\
    \ 64 个标签。键和值最多可以包含 63 个字符。键必须以字母开头，并且可以包含字母数字字符、下划线和破折号。 |\n\n"
