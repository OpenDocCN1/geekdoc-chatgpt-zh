    \ 节点会及时编译计算图，并将二进制文件发送到一个或多个可用的 TPU 设备。\n\n下图描述了 TPU 软件架构的软件组件块。 它由 ML 模型，`TPUEstimator`，\
    \ **TensorFlow 客户端**， **TensorFlow 服务器** 和 **XLA 即时（JIT）编译**组成：\n\n![](Images/4f6ac54550eda574b0c0aba1b64d1dbd.png)\n\
    \n图 7.6 TPU 的软件组件块\n\n让我们详细讨论每个组件，如下所示：\n\n*   **`TPUEstimator`**：`TPUEstimator`简化了\
    \ Cloud TPU 的模型构建，以提取最大的 TPU 性能。 `TPUEstimator`是基于估计器的高级 API。 `TPUEstimator`将\
    \ ML 程序转换为 TensorFlow 操作。 对于使用 Cloud TPU 的 ML 模型，绝对应该使用`TPUEstimator`。\n\n*  \
    \ **TensorFlow 客户端**：TensorFlow 客户端将 TensorFlow 操作转换为计算图，然后通过 gRPC 发送到 TensorFlow\
