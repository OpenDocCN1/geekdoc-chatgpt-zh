- raw: "| `etag` || 字符串 || 是 || 该标志用于防止两个独立模型更新之间的竞争状况。 需要在各种请求和响应之间以链接的方式使用`etag`参数，以确保对模型进行顺序更新。\
    \ 建议有效使用`etag`，以避免模型版本不一致。 |\n\n除了创建模型之外，相同的请求主体对象还可用于以下函数：\n\n*   `delete`：删除模型\n\
    \n*   `get`：获取有关模型的所有信息，包括版本\n\n*   `getIamPolicy`：获取资源的访问控制策略\n\n*   `list`：提供项目中存在的所有模型的列表\n\
    \n*   `patch`：更新模型资源\n\n*   `setIamPolicy`：设置 AI 平台内特定资源的访问控制\n\n*   `testIamPermissions`：列出调用用户帐户对特定资源拥有的所有权限\n\
    \n为了执行在线预测，需要以值列表形式或 JSON 对象的形式对输入数据进行结构化和格式化。 以下是可以在 AI 平台上传递给张量模型的输入张量的示例：\n\
    \n```\n{\"values\":[\"one\",\"two\",\"three\"], \"key\":123}\n```\n\n需要将该对象格式化为以下格式，才能发送到\
    \ REST API 端点：\n\n```\n{\"instances\": [\n                       {\"values\":\
    \ [\"one\",\"two\",\"three\"], \"key\": 1},\n                       {\"values\"\
    : [\"five\",\"six\",\"seven\"], \"key\": 2}\n]}\n\ndef predict(project, model,\
    \ instances, version=None):\n\n    GOOGLE_APPLICATION_CREDENTIALS=<path_to_service_account_file>\n\
    \    service = googleapiclient.discovery.build('ml', 'v1')\n    name = 'projects/{}/models/{}'.format(project,\
    \ model)\n\n    if version is not None:\n        name += '/versions/{}'.format(version)\n\
    \n    response = service.projects().predict(\n        name=name,\n        body={'instances':\
    \ instances}\n    ).execute()\n\n    if 'error' in response:\n        raise RuntimeError(response['error'])\n\
    \n    return response['predictions']\n```\n\n如我们所见，可以通过使用对项目的引用来对 JSON 格式的输入结构化数据进行建模来获得在线预测。\
    \ 我们使用`googleapiclient`创建机器学习服务的实例，并在服务实例上调用`predict`方法。\n\n# 笔记本\n\nThe AI Platform\
    \ provides an intuitive way of working with it in terms of notebooks. These are\
    \ pre-packaged online interfaces that can be used for effective collaboration\
    \ among team members and can be quickly configured to have the latest versions\
    \ of Python libraries in the backend. The notebooks enable the developers to create\
    \ and manage virtual machines on the GCP that can utilize TensorFlow and PyTorch\
    \ frameworks, along with R and Python deep learning packages.\n\n可以配置工作流和管道，以真正无服务器的方式利用\
    \ CPU 和 GPU。 笔记本电脑可以使用的图像经过测试和优化，以实现最佳表现和易用性。 GCP 的认证层用于访问笔记本，并且可以与任何其他 GCP 资源相同的方式配置\
    \ IAM 策略。 与 GCP 上托管的 GitHub 存储库无缝集成。\n\nAI Platform 笔记本支持以下运行时和包：\n\n![](Images/36e82c5a51dbc00c4ef8fd05e2e2a1a3.png)\n\
    \n图 8.9-AI 平台支持的运行时和包\n\n为了在 AI 平台上使用笔记本，需要选择一个项目，并且需要启用 Compute Engine API 才能导航到笔记本页面。\
    \ 让我们创建笔记本的新实例：\n\n1.  从导航菜单转到 AI 平台内的`Notebooks`笔记本菜单。\n\n2.  单击顶部菜单栏上的`NEW INSTANCE`链接。\n\
    \n3.  从可用选项中选择用于创建实例，或单击“自定义实例”以对新实例的各种参数和容量进行精细控制。\n\n4.  选择具有或不具有 GPU 的实例。 如果实例是使用\
    \ GPU 创建的，请选择选项以自动安装 GPU 驱动。 创建实例后，可以在以后修改 GPU 计数。 以下屏幕快照描述了创建笔记本新实例的步骤：\n\n![](Images/b3fcd052cf96bfbff88dbe63079840e2.png)\n\
    \n图 8.10-创建新笔记本实例的步骤（1）\n\n让我们使用不带 GPU 的 TensorFlow 2.0 创建一个新的笔记本实例。\n\n5.  AI\
