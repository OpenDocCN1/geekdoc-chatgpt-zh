- raw: "*   **标准 Python 依赖项**：这些是 PyPI 上可用的标准 Python 包。 AI 平台通过`pip install`命令安装了标准依赖项。\
    \ 这类似于独立应用的依赖项解析。 定义 AI 平台上的依赖项的标准方法是提及`setup.py`文件中的依赖项。 `setup.py`文件需要放置在应用的根目录中。\
    \ 在以下代码片段中可以看到`setup.py`文件的模板：\n\n```\nfrom setuptools import find_packages\n\
    from setuptools import setup\n\nREQUIRED_PACKAGES = ['comma separated list of\
    \ required packages']\nsetup(\n    name='trainer',\n    version='0.1',\n    install_requires=REQUIRED_PACKAGES,\n\
    \    packages=find_packages(),\n    include_package_data=True,\n    description='Setup\
    \ details and required packages for the training application'\n)\n```\n\n*   **用户定义和自定义依赖项**：这些是应用在运行时所需的用户定义包。\
    \ AI 平台可以使用`pip install`命令解决这些依赖性。 定制依赖项包需要在运行时可供应用访问，因此，需要提供该包的标准 URI 作为脚本的参数。\
    \ 建议将包文件存储在可访问的 Cloud Storage 位置。 使用`gcloud`命令时，依赖项可以放在本地计算机上，也可以放在 Cloud Storage\
    \ 上。 AI 平台按照它们在命令中出现的顺序对这些依赖项进行分级。 需要将多个依赖项指定为以逗号分隔的列表。\n\n在下一节中，我们将学习如何通过选择正确的计算选项和运行时参数来优化训练工作。\n\
    \n# 为您的训练工作选择正确的计算选项\n\n重要的是为训练工作选择正确的计算选项，以便最佳利用平台资源。 这导致训练时间和成本最小化。 我们需要为训练作业设置运行时属性。\
    \ 训练工作是 AI 平台上的标准对象。 训练工作的结构如下（输入参数以**粗体**字体突出显示，[请在此链接中找到完整的配置](https://github.com/PacktPublishing/Hands-On-Artificial-Intelligence-on-Google-Cloud-Platform)：\n\
    \n```\n{\n  \"jobId\": string, //Required: user defined identifier for the job\n\
    \  \"createTime\": string,          //Output Parameter: indicates when a job was\
    \ created \n  \"labels\": {                    //Optional Input Parameter: recommended\
    \ to be used for organizing \n    string: string,              //and troubleshooting\
    \ the run-time jobs.   \n    ...\n  },\n \"trainingInput\": { //Required: specifies\
    \ the input parameters for the training job.  \n object (TrainingInput)\n },\n\
    \  \"predictionInput\": {           //Required: specifies the input parameters\
    \ for the prediction job. \n object (PredictionInput)\n }\n}\n```\n\n具体来说，我们需要为运行时作业配置填充`TrainingInput`或`PredictionInput`资源。\
    \ 这些对于特定请求是互斥的，并且在运行时仅需要使用这些输入参数之一。 让我们详细查看`TrainingInput`参数的以下 JSON 结构（[请在此链接中找到完整的配置](https://github.com/PacktPublishing/Hands-On-Artificial-Intelligence-on-Google-Cloud-Platform)）：\n\
    \n```\n{\n  \"scaleTier\": enum (ScaleTier),    //Required: specifies machine\
    \ types, count of replicas, workers,parameter servers\n  \"packageUris\": [  \
    \               //Required: These are the Google Cloud Storage locations for\n\
    \    string                         // the packages containing the training program\
    \ along with\n  ],                               //          additional dependencies\n\
    \  \"pythonModule\": string,          //Required: The python module to run after\
    \ importing all the \n  \"args\": [                        //packages and resolving\
    \ the dependencies \n    string\n  ],\n  \"hyperparameters\": {             //Optional:\
    \ The set of hyper-parameters to be tuned. \n    object (HyperparameterSpec)\n\
    \  },\n  \"region\": string,               //Required: The compute engine region\
    \ on which the training job will run\n}\n```\n\n我们将详细研究`ScaleTier`和`HyperParameterSpec`对象。\
    \ 在此之前，让我们了解在提交预测作业时使用的`PredictionInput`对象的 JSON 结构，如以下代码块所示：\n\n```\n{\n  \"\
