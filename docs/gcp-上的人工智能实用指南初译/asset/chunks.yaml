    \n建立并评估模型后，GCP 将提供一个简单的界面，用于使用模型进行预测。在这种情况下，该模型已准备好根据输入数据中的关键字对各种类别的文档进行分类。\n\n\
    ## Web 界面\n\nGCP 提供了用于快速测试模型的 Web 界面和 REST API，可在生产环境中用于文档分类：\n\n![](Images/e025b9d7bf8aac641e34a440f3206e8f.png)\n\
    \n在这种情况下，模型已基于在文本区域中输入的文本，以 100% 的置信度预测文档与 `计算机图形学` 相关。\n\n## 用于模型预测的 REST API\n\
    \n我们可以使用一个简单的 REST API 来使用已部署的模型进行预测：\n\n```bash\nexport GOOGLE_APPLICATION_CREDENTIALS=key-file-path\
    \ \n\ncurl -X POST   \n-H \"Authorization: Bearer $(gcloud auth application-default\
    \ print-access-token)\" \n-H \"Content-Type: application/json\" \nhttps://automl.googleapis.com/v1beta1/projects/ai-gcp-ch4/locations/us-central1/models/TCN2853684430635363573:predict\
    \ \n-d '{\n         \"payload\" : {\n           \"textSnippet\": {\n         \
    \       \"content\": \"YOUR TEXT HERE\",\n                 \"mime_type\": \"text/plain\"\
    \n            },\n         }\n    }'\n```\n\n可以在生产环境中使用 Python 调用该 API。\n\n##\
    \ 用于模型预测的 Python 代码\n\n将以下代码保存在名为 `document_classifier.py` 的文件中。此代码使用已部署的模型进行预测：\n\
    \n```python\nimport sys \n\nfrom google.cloud import automl_v1beta1 \nfrom google.cloud.automl_v1beta1.proto\
    \ \nimport service_pb2 \n\ndef get_prediction(content, project_id, model_id):\n\
    \   prediction_client = automl_v1beta1.PredictionServiceClient()\n   name = 'projects/{}/locations/us-central1/models/{}'.format(project_id,\
    \ model_id)\n   payload = {'text_snippet': {'content': content, 'mime_type': 'text/plain'\
    \ }}\n   params = {}\n   request = prediction_client.predict(name, payload, params)\n\
    \   return request # waits till request is returned\n\nif __name__ == '__main__':\n\
    \   content = sys.argv[1]\n   project_id = sys.argv[2]\n   model_id = sys.argv[3]\n\
    \   print(get_prediction(content, project_id, model_id))\n```\n\n用 `python document_classifier.py\
    \ \"Document Text\" <<project_id>> <<model_id>>` 调用文档分类器 API。通过传递项目 ID 和已部署的模型\
    \ ID，可以使用此命令执行 Python 代码。\n\n# 使用 AutoML Vision API 的图像分类\n\nGCP 提供了 `Vision API`，可用于以可视输入（图像和视频）的形式为非结构化数据构建智能应用，并可通过\
    \ `Web 控制台` 和 API 进行访问。\n\n## AutoML Vision 的图像分类步骤\n\nGCP 上的图像分类过程遵循与 `AutoML`\
    \ 文档分类中的文档分类过程相似的步骤。以下是图像分类中涉及的步骤：\n\n![](Images/783b5c931f351159fbec5b4e398fbd0f.png)\n\
    \n假设您已经知道如何设置 Google 帐户并创建了 GCP 项目。让我们从 `收集训练图像` 步骤中逐步进行图像分类的步骤。\n\n## 收集训练图像\n\
    \n`AutoML Vision API` 使用监督学习模型，因此需要训练图像的集合。这些是用于训练目的的预先标记图像。图像中可以包含一个或多个对象，并且需要以样本为基础定义和验证各个输出标签以确保准确率。我们需要建立一个数据集来训练图像分类模型。\n\
    \n## 创建数据集\n\n第一步，我们需要为图像创建一个占位符，以用于训练和评估模型。创建数据集时，我们需要将分类类型称为 `多类` 或 `多标签`。在多分类器的情况下，将单个标签分配给每个分类的文档，而多标签分类器可以将多个标签分配给一个文档。\n\
    \n`Web 界面` 提供了创建数据集的直观方法：\n\n1. 单击标题栏中的 `新数据集` 按钮。以下屏幕快照显示了用于创建数据集的用户界面：\n\n![](Images/dad3c652a792707356c8038446643dfc.png)\n\
    \n2. 在项目中为新数据集提供唯一的名称。有两种方法可以在数据集创建 `UI` 中上传图像： \n\n    *   从您的计算机上载图像：`AutoML`\
    \ 支持 `JPG` 和 `PNG` 格式。包含一组 `JPG` 或 `PNG` 图像的 `ZIP` 归档文件也可以批量上传。\n\n    *   在 `Cloud\
    \ Storage` 上选择一个 `CSV` 文件：一个逗号分隔的文件，其中包含 `Google Cloud Storage` 上图像的路径列表及其标签（如果在创建数据集时可用）。\n\
    \n也可以将图像导入推迟到以后，并且可以将其中没有任何图像的数据集创建为占位符。可以通过选中 `启用多标签分类` 复选框来指定分类类型。默认分类类型是 `多分类`。\n\
    \n## 标记和上传训练图像\n\n我们将利用 `Cloud Storage` 上载图像并创建一个 `CSV` 文件来标记图像文件的内容。我们将创建一个 `Google\
    \ Cloud Storage` 存储桶，并存储将用于训练自定义模型的文档。使用 `Google Cloud Shell` 中的以下命令创建 `Cloud\
    \ Storage` 存储桶：\n\n```bash\ngsutil mb -p ai-gcp-ch4 -c regional -l us-central\
    \ gs://ai-gcp-ch4-vcm/\n```\n\n存储桶名称必须采用 `PROJECT_ID-vcm` 格式。\n\n此命令将在项目内创建名称为\
    \ `ai-gcp-ch4-vcm` 的存储桶。\n\n我们将通过以下命令在新创建的存储桶中使用包含花卉图像的公共可用数据集：\n\n```bash\ngsutil\
    \ -m cp -R gs://cloud-ml-data/img/flower_photos/  gs://ai-gcp-ch4-vcm/img/\n```\n\
    \n将图像批量装入存储桶后，标记图像的最简单方法是使用 `CSV`。`CSV` 文件的通用格式为 `Image_Path, Label(s)`。如果有多个标签（一个图像中有多个对象），则各个标签需要用逗号（`,`）分隔，如以下示例所示：\n\
    \n```csv\ngs://ai-gcp-ch4-vcm/img/flower_photos/roses/15674450867_0ced942941_n.jpg,roses\n\
    gs://ai-gcp-ch4-vcm/img/flower_photos/daisy/1031799732_e7f4008c03.jpg,daisy\n\
    ```\n\n在此示例中，第一个图像包含玫瑰，第二个图像包含雏菊花。让我们将图像和标签导入数据集中：\n\n![](Images/027d9bd059fd123f115f5e093a601be2.png)\n\
    \n`CSV` 文件中列出的图像以及存储在存储桶中的图像将被加载到数据集中并在此步骤中进行标记。至此，我们的数据集已准备好训练分类模型。这是 `AutoML\
    \ Vision` 界面中带标签的数据集的快照：\n\n![](Images/da5286d1ff07aadc12ce7a84a64bf7d4.png)\n\
    \n我们的数据集包含分布在五个标签中的 3,665 个标签图像。`Web 界面` 允许修改标签并根据需要删除图像。也可以通过使用 `REST API` 和\
    \ `命令行界面` 来填充带有标签图像的数据集，并且可以通过实用地调用它。\n"
  trans: "\n# 模型评估\n\n```\ncurl -H \"Authorization: Bearer $(gcloud auth application-default\
    \ print-access-token)\" -H \"Content-Type:application/json\" https://automl.googleapis.com/v1beta1/model-name/modelEvaluations\n\
    ```\n\n此命令以 JSON 格式返回评估参数，如下所示：\n\n```json\n{\n  \"modelEvaluation\": [\n    {\n\
    \      \"name\": \"projects/434039606874/locations/us-central1/models/7537307368641647584/modelEvaluations/9009741181387603448\"\
    ,\n      \"annotationSpecId\": \"17040929661974749\",\n      \"classificationMetrics\"\
    : {\n        \"auPrc\": 0.99772006,\n        \"baseAuPrc\": 0.21706384,\n    \
    \    \"evaluatedExamplesCount\": 377,\n        \"confidenceMetricsEntry\": [\n\
    \          {\n            \"recall\": 1,\n            \"precision\": -1.3877788e-17,\n\
    \            \"f1Score\": -2.7755576e-17,\n            \"recallAt1\": 0.9761273,\n\
    \            \"precisionAt1\": 0.9761273,\n            \"f1ScoreAt1\": 0.9761273\n\
    \          },\n          {\n            \"confidenceThreshold\": 0.05,\n     \
    \       \"recall\": 0.997,\n            \"precision\": 0.867,\n            \"\
    f1Score\": 0.92746675,\n            \"recallAt1\": 0.9761273,\n            \"\
    precisionAt1\": 0.9761273,\n            \"f1ScoreAt1\": 0.9761273\n          }\n\
    \        ]\n      }\n    }\n  ]\n}\n```\n\n有两个主要的封装对象用于表示模型评估参数：`classificationMetrics`（标头级别的分类指标）和\
    \ `confidenceMetricsEntry`（置信度指标）。在 JSON 响应中还报告了 `precision`（准确率）和 `recall`（召回率）得分。\n\
    \n## Python\n\n这是用于获取模型评估参数的 Python 代码片段：\n\n```python\nproject_id = 'PROJECT_ID'\n\
    compute_region = 'COMPUTE_REGION'\nmodel_id = 'MODEL_ID'\nfilter_ = 'Filter expression'\n\
    \nfrom google.cloud import automl_v1beta1 as automl\n\nclient = automl.AutoMlClient()\n\
    \n# Get the fully qualified path of the model based on project, region and model\n\
    model_full_id = client.model_path(project_id, compute_region, model_id)\n\n# Apply\
    \ the filter for listing all the model evaluations. \nresponse = client.list_model_evaluations(model_full_id,\
    \ filter_)\n\nprint(\"Loop for listing all the model evaluations received based\
    \ on the filter condition\")\nfor element in response:\n    print(element)\n```\n\
    \n此代码段获取模型评估参数，并在响应上进行迭代，并打印各个参数，例如 `precision`（精度）和 `recall`（召回率）。\n\n## Java\n\
    \n这是用于获取模型评估参数的等效 Java 代码：\n\n```java\npublic static void autoMLModelEvaluation(\n\
    \    String projectId, String computeRegion, String modelId, String filter) throws\
    \ IOException {\n  // Instantiates a client\n  AutoMlClient client = AutoMlClient.create();\n\
    \n  // Get the full path of the model.\n  ModelName modelFullId = ModelName.of(projectId,\
    \ computeRegion, modelId);\n\n  // List all the model evaluations in the model\
    \ by applying filter\n  ListModelEvaluationsRequest modelEvaluationsrequest =\
    \ ListModelEvaluationsRequest.newBuilder()\n          .setParent(modelFullId.toString())\n\
    \          .setFilter(filter)\n          .build();\n\n  // Iterate through the\
    \ results.\n  String modelEvaluationId = \"\";\n  for (ModelEvaluation element\
    \ : client.listModelEvaluations(modelEvaluationsrequest).iterateAll()) {\n   \
    \ if (element.getAnnotationSpecId() != null) {\n      modelEvaluationId = element.getName().split(\"\
    /\")[element.getName().split(\"/\").length - 1];\n    }\n  }\n\n  // Resource\
    \ name for the model evaluation.\n  ModelEvaluationName modelEvaluationFullId\
    \ =\n      ModelEvaluationName.of(projectId, computeRegion, modelId, modelEvaluationId);\n\
    \n  // Get a model evaluation.\n  ModelEvaluation modelEvaluation = client.getModelEvaluation(modelEvaluationFullId);\n\
    \n  ClassificationEvaluationMetrics classMetrics = modelEvaluation.getClassificationEvaluationMetrics();\n\
    \  List<ConfidenceMetricsEntry> confidenceMetricsEntries = classMetrics.getConfidenceMetricsEntryList();\n\
    \n// Iterate over the list and get individual evaluation parameters. \n}\n```\n\
    \n此代码段获取模型评估参数，并在响应上进行迭代，并打印各个参数，例如精度和召回率。也可以将其打包为独立的 API 调用，并开发为微服务。\n\n## Node.js\n\
    \n这是评估代码的 Node.js 实现。代码简洁明了，并异步调用评估 API：\n\n```javascript\nconst automl = require(`@google-cloud/automl`);\n\
