    \ 使用以下工具和网络组件来使其快速，可靠和高效：\n\n* Jupyter 网络，用于对数据进行混洗\n* Dremel 引擎用于处理\n* Borg 用于集群管理\n\
    \n换句话说，它利用 Google 出色的基础架构和最佳服务，使其快速，高度可用且可扩展。\n\nBigQuery 带有其他功能，例如数据和查询共享，保存所需的查询；它符合\
    \ ANSI 2011，并与本机以及外部工具（包括 Informatica，Talend 等）集成。BigQuery 中保存的所有数据均已加密。它是联盟的，可以查询来自其他服务（如\
    \ Cloud Storage 和 Bigtable）的数据。BigQuery 还通过 BigQuery Streaming 支持实时分析。\n\nBigQuery\
    \ 拥有一个友好的用户界面，用户可以从中执行所有操作，还具有一个命令行工具`bqclient`，可用于连接到 BigQuery。BigQuery 有两种定价模式：“按需付费”，即每\
    \ TB 查询处理向用户收取 5 美元的费用；以及“固定费用定价”，即每月约 40,000 美元，为此用户可获得 2,000 个专用插槽用于处理。存储费用为每月每\
    \ GB 0.02 美元；对于短期存储和长期存储，每月每 GB 0.01 USD。\n\n# BigQuery 和 AI 应用\n\nBigQuery ML\
    \ 是 BigQuery 机器学习的一种形式，它具有一些内置算法，可以直接在 SQL 查询中用于训练模型和预测输出。BigQuery ML 当前支持分类模型的线性回归，二进制逻辑回归和多类逻辑回归。\n\
    \n# Cloud Dataproc\n\nCloud Dataproc 是一个完全托管的 Hadoop 和 Spark 集群，可以在几秒钟内旋转。Cloud\
    \ Dataproc 是一个自动扩展集群，可用于非常有效地运行 Hadoop，Spark 以及 AI 和 ML 应用。在高峰时段，可以根据使用情况将节点添加到群集，并且在需求较低时可以进行缩减。\n\
    \nDataproc 与其他服务集成，例如云存储，BigQuery，Stackdriver，身份和访问管理以及网络。这使得群集的使用非常容易且安全。\n\n\
    在 Dataproc 集群下，Google 实际上运行计算实例。用户可以从广泛的计算机配置中进行选择来构建集群，或者如果现有计算机配置不能满足需求，则用户也可以使用自定义计算机配置来构建集群。这里要注意的一件非常重要的事情是\
    \ Dataproc 集群使用抢占式实例。这可以为集群的定价创造奇迹。抢占型实例的价格要低得多，大约是具有相同配置的实际实例的 20%，而 Google 可以在\
    \ 30 秒内通知收回实例。\n\n对于 Dataproc 集群，可将抢占实例用作数据节点，因为通常将 Dataproc 集群用于计算目的，并且所有数据都将保存在\
    \ Cloud Storage 中。因此，在这种情况下，即使抢占式实例发生故障，该作业也将转移到另一个节点，并且不会产生任何影响。Cloud Dataproc\
    \ 集群的定价随实例而异，但是具有非常有竞争力的定价。\n\n# Cloud Dataproc 和 AI 应用\n\nCloud Dataproc 可以使用\
    \ Apache Spark，Hadoop 和其他工具来满足各种 AI 和 ML 用例。将 Dataproc 视为完全托管的云 Hadoop 和 Spark\
    \ 集群。可以在 Hadoop 和 Spark 上构建的所有 AI 和 ML 用例都可以在 Cloud Dataproc 集群上构建。\n\n# Cloud\
    \ Dataflow\n\nCloud Dataflow 是用于运行批量和流应用的完全托管服务，并且具有用于运行 AI 和 ML 作业的丰富集成。它是 Google\
    \ 提供的无服务器服务，基于 Apache Beam 构建，因此，批量代码和流代码都可以相互使用。可以以非常简化的方式用 Java 和 Python 构建\
    \ Cloud Dataflow 应用。\n\nCloud Dataflow 与其他 GCP 服务集成在一起，例如 Cloud Pub/Sub，Cloud\
    \ Machine Learning，Stackdriver，BigQuery 和 Bigtable，这使得构建 Cloud Dataflow 作业非常容易。在\
    \ Cloud Dataflow 之下，App Engine 正在运行，因此用户拥有无限的能力来扩展其工作。Cloud Dataflow 会根据工作需求自动扩展。\n\
    \n除了已处理数据的定价外，批量和流作业的 Cloud Dataflow 定价基本相同。它根据 VCPU，RAM，持久性存储和处理的数据量进行收费。\n\n\
    # Cloud Dataflow 和 AI 应用\n\nCloud Dataflow 可以与 Cloud Machine Learning 集成，服务于各种\
    \ AL 和 ML 用例。欺诈检测是一个经典的用例，可以使用 Cloud Dataflow 和 Cloud Machine Learning 实现流作业。\n\
    \n到目前为止，我们已经了解了 GCP 的基本知识，这将有助于我们有效地使用平台，做出正确的选择并建立有效的渠道。现在，您已了解 GCP 上所有可用的计算，存储和处理选项。现在，让我们开始构建\
    \ ML 管道。\n\n# 建立 ML 管道\n\n让我们来看一个详细的示例，在该示例中，我们将建立一条端到端的管道，从将数据加载到 Cloud Storage，在其上创建\
    \ BigQuery 数据集，使用 BigQuery ML 训练模型并对其进行测试。在此用例中，我们将使用逻辑回归模型来查找潜在客户转化概率。您可以使用选择的任何合适的数据集并遵循此示例。\n\
    \n潜在客户数据包含有关潜在客户的各种属性。BigQuery ML 具有内置功能，我们可以直接在任何数据集中训练模型。我们可以预测输出变量和转换概率。BigQuery\
    \ 提供了一个 SQL 接口来训练和评估机器学习模型。该模型可以部署在平台上进行消费。\n\n我们有两个数据集：潜在客户训练数据和测试数据，其中训练数据为实际总体数据的\
    \ 80%，测试数据为 20%。使用训练数据训练模型后，我们将在测试数据上评估模型，并在以下类别中找到每个潜在客户的潜在客户转换概率：\n\n* Junk\
    \ lead\n* 合格（Qualified）\n* 有兴趣（Interested）\n* 封闭（Closed）\n* 没兴趣（Not interested）\n\
    * 不合格（Not eligible）\n* 无法到达（Unreachable）\n\n# 了解流程设计\n\n下图代表了将数据加载到 Cloud Storage\
    \ 和 BigQuery 中以及对模型进行训练并使用潜在客户数据进行测试的端到端过程。您可以选择一个数据集：\n\n![](Images/377a6af903a1818510aba173ff6ae7fc.png)\n\
