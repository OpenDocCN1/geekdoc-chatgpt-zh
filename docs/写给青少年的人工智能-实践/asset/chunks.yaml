    最后，对第二步中计算出的距离进行排序，找出离新数据最近的*k*个点，也就是最近邻，看看到底是橘子多还是橙子多，从而判断新数据是什么水果。在程序3.9中，我们把*k*设置为3。你也可以把它改为其他值。


