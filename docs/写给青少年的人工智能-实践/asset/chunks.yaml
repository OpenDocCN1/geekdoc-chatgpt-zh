    1    def bin_search(N,target):    # 将二分法写成函数

    2        left = 0                 # 搜索范围最左（左边界）是0号

    3        right = len(N) - 1       # 搜索范围最右（右边界）是(len(N)-1)号

    4        while left <= right:     # 当搜索范围的左边界超过右边界，搜索结束

    5            mid = (right - left) // 2 + left

    6            # 计算中间元素的编号，编号一定是整数，所以用保留整数的除号//

    7            if target == N[mid]: # 如果中间的元素等于目标

    8                return mid       # 那么说明找到了目标，返回中间元素的编号

    9            elif target < N[mid]:# 否则，如果目标小于中间元素

    10               right = mid - 1  # 将右边界调整为中间元素的左边第一位

    11           else:                # 否则，（如果目标大于中间元素）

    12               left = mid + 1   # 将左边界调整为中间元素的右边第一位

    13       return -1

    14       # 循环结束，说明没有找到目标，于是返回-1表示没找到。 函数结束

    15

    16   Grade = [35, 56, 58, 60, 74, 80, 83, 88, 90, 96] # 使用列表储存分数

    17   tar = input("输入要找的目标分数(整数)：")            # 要找的目标分数

    18   tar = int(tar)

    19   position = bin_search(Grade, tar)    # 调用二分法函数寻找目标位置

    20   print(position)                      # 将结果显示在屏幕上

    ```


    当然，程序3.1中的代码只是实现二分法的一种方式，你也可以有其他的写法。


    这段代码只能找出特定的一份试卷。如果要找出所有不及格（低于60分）的试卷，应该怎样修改？


    二分法的思想在生活中还有很多用途，比如查阅一本陌生的英文词典，可以用二分法快速找到自己想要查的单词；当很长范围内的电路出现故障时，电路工程师可以用二分法快速定位具体的故障地点。


    ## 排序


    二分法是一种非常有效的搜索方法。不过**要使用这种算法，必须先按照大小把想要搜索的数据排序**。排序这个工作，人类做起来也很烦琐，那么有没有什么算法能让计算机来处理排序问题呢？


    排序算法有很多种，**冒泡算法**就是一种非常基础的排序算法。冒泡算法的原理很简单。如果我们想用冒泡算法从小到大地排列一组数字，比如8、6、11、7这4个数字，那么程序会从头到尾地检查所有数字。如果相邻的两个数字中，第一个数字比第二个数字大，那么交换这两个数字。然后，检查第二个和第三个数字，第三个和第四个数字……直到全部检查完。所有数字检查并交换完一轮后，就完成了第一轮冒泡，让最大的数字像泡泡一样冒到了最顶上（最后面），如图3-7所示。


    ![](Images/3-7.jpg)


    图3-7　第一轮冒泡


    不过，一轮冒泡还不能排好所有数字，所以我们还需要执行第二轮冒泡算法。还是和第一次一样，我们从头开始，依次比较相邻数字的大小，如果前面的数字比后面的大，就交换这两个数字的位置。只不过这一次不再需要比较全部数字，只要检查到倒数第二个数字就可以了。因为经过第一轮冒泡，已经把最大的数字排到了最后一位。第二轮冒泡把第二大的数字排到了倒数第二的位置，这样最大的两个数字都被排好了，如图3-8所示。


    ![](Images/3-8f.jpg)


    图3-8　第二轮冒泡


    我们按照这种方式不断执行一轮轮冒泡算法，每一轮冒泡都可以排好一个数字，而需要进行冒泡排序的数字也就相应减少一个。对于*N*个数字，经过（*N*\-1）轮冒泡后，就只剩一个数字没有经过排序，而只有一个数字也就不需要排序了，也就是说，数字被完全排好顺序了。程序3.2就是冒泡算法的程序。


    程序3.2　冒泡排序


    ```

    1    def bubbleSort(N):                   # 把冒泡排序写成函数

    2        for i in range(1, len(N)):       # 循环第i轮冒泡（从1开始数）

    3            for j in range(0, len(N)-i): # 循环第j个相邻数字（从0开始数）

    4                if N[j] > N[j+1]:        # 如果前面的数字大于后面的数字

    5                    N[j], N[j + 1] = N[j + 1], N[j]  # 交换相邻数字

    6        return N                         # 返回排好序的列表，函数结束

    7

    8    N = [9, 8, 7, 6, 5, 4, 3, 2, 1, 0]   # 用列表储存需要排序的数字

    9    print(bubbleSort(N))                 # 调用冒泡排序函数，输出结果

    ```


    冒泡算法是一个非常经典的算法，它简单明了，容易理解。不过冒泡算法并不像二分法一样使用广泛，因为相对其他排序算法，如归并排序、快速排序，冒泡算法的效率并不高。不过，它对于我们学习编程、理解算法的概念非常有帮助。


    ## 线性回归


    我们已经了解了二分法搜索和冒泡排序两种算法。不过，这两种算法似乎和人工智能没有直接关系。下面我们就来了解一种在基础的人工智能中也会用到的算法。


    在生活中，很多现象是互相关联的，或者叫相关。比如身高和体重之间有关系；山顶的气温和山的高度有关系；气温和商店里卖出冰淇淋的数量有关系；每天锻炼身体的时间和健康有关系；努力程度和学习成绩有关系。**人工智能就可以通过大量数据，分析这种相关关系，从而做出预测。**


    在各种关系中，最简单的关系之一就是**线性关系**。线性关系指的是，相关的两个因素，一个随着另一个发生均匀的变化。比如我们买东西时，如果单价固定不变，那么数量和总价就是线性关系。随着数量的增加，总价也在均匀增加，写成公式就是：


    *y*（总价） = *k*（单价）×*x*（数量）


    如果我们在平面直角坐标系中，用数量*x*作为横坐标，用总价*y*作为纵坐标，那么点(*x*, *y*)就表示了不同的数量和总价。把这些点连接起来，就可以得到一条直线，它代表的就是总价*y*和数量*x*之间的关系，直线的倾斜程度代表了单价*k*，如图3-9所示，所以称之为线性关系。其实这就是我们在初中数学中学到的一次函数图像。


    ![](Images/3-9.jpg)


    图3-9　线性关系


    在生活中，还有各种各样的线性关系。你也许注意过，如果父母长得比较高，孩子成年后往往也会比较高。那么，父母和孩子成年后的身高是不是线性关系呢？你也许会有所怀疑，因为父母的和子女的身高相反的情况也并不少见。


