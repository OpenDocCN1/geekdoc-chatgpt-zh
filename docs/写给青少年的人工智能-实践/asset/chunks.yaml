- raw: '那么，这个“近”的范围是多少呢？这里我们就用滑动窗口大小来定义。滑动窗口就好像我们在一张纸上挖了一个长条形状的洞，然后盖在诗上，那么我们只能看到洞里露出来的词语。很明显，它们都是相邻的。这个洞的大小就是上面代码中的`window`参数，它表示在计算时，需要考虑中心词前后的多少个词。


    最终程序会生成名为word2vec的模型文件。


    ### 开始写诗


    训练好后，我们就可以正式开始写诗了。


    写诗程序的思路并不复杂。首先加载训练好的词向量模型，然后根据输入的标题，通过模型来预测相关字，组成诗句内容，并将更新后的诗句作为下一次预测的上下文输入预测函数。这样循环执行，逐字得到整首诗。由于写的诗是五言绝句，也就是每句5个字，一共4句。因此在诗句生成部分，我们用了两层循环，外层循环4次，内层循环5次。你也可以改成七言绝句（4句7个字），也就是外层循环4次，内层循环7次。完整代码如程序4.7所示，你也可以在配套资源网站上找到写好的程序文件。


    程序4.7　根据词向量模型写诗


    ```

    1    from gensim.models import Word2Vec  # 加载词向量算法

    2    from random import choice           # 导入随机函数

    3    from os.path import exists

    4

    5    model_path = ''word2vec''

    6    window = 12  # 滑窗大小

    7    topn = 14  # 生成诗词的开放度

    8

    9    # 加载训练好的词向量模型

    10   if exists(model_path):

    11       model = Word2Vec.load(model_path)

    12   else:

    13       print("没有找到模型")

    14

    15   # 输入作诗题目

    16   title = input(''输入标题：'').strip()

    17

    18   # 词句数据准备函数

    19   def prepare(lst,p):

    20       res = []

    21       for t in lst:

    22           if t[0] not in p: # 如果诗中已经用过这个字，那么就排除候选

    23               res.Append(t[0])

    24       return res

    25

    26   # 诗句生成

    27   poem = list(title)

    28   for i in range(4):                # 共4句诗

    29       for j in range(5):            # 每句5字

    30           predict_chr = model.predict_output_word(

    31               poem[-window:], topn)

    32           predict_chr = prepare(predict_chr, poem[len(title):])

    33           char = choice(predict_chr)

    34           poem.Append(char)

    35       if i == 0 or i ==2:

    36           poem.Append(''，'')

    37       else:

    38           poem.Append(''。'')

    39

    40   poem = poem[len(title):]

    41   poem = ''''.join(poem)

    42   print(poem)

    ```


    在代码中，具体用于预测字词的是第30行和第31行的函数：


    ```

    model.predict_output_word(poem[-window:], topn)

    ```


    它有两个参数。第一个参数是用于预测上下文，这里同样需要考虑类似训练时的滑动窗口问题。由于诗句是逐字生成的，因此没有下文，只有上文。我们通过**切片**的方法来读取诗句字列表中的后`window`个元素（字）。如果列表中的字少于`window`个，就会读取整个列表。第二个参数`topn用于`预测生成多少个相关的候选字。


    函数最后会得到`topn`个候选字，并给出每个字在当前上下文中出现的概率。每个候选字和它的概率组成一个元组，所有元组又组成一个列表。形式如下（以`topn`
    = `3`为例）：


    ```

    [(''冰'', 0.8683245), (''残'', 0.050352804), (''腊'', 0.020622773)]

    ```


    如果总是选择最高概率的字，这样得到的诗就落入了俗套。因此我们只关注这里面的字，不关注概率。我们自己构建的词句数据准备函数`prepare()`可以将字单独提取出来，存放在列表中。另外，除非是高手不拘一格，古诗往往要求一字不重。`prepare()`函数就去除掉了前面已经使用过的字。


    那么，到底选择哪个字呢？我们采取了一种简单偷懒的方式，那就是**随机选择**。这就要用到`random`库中的`choice()`函数。`random`是Python内置的标准库，不需要安装，它提供了很多和随机有关的功能。


    在诗句生成过程中，根据奇数句还是偶数句，我们将标点符号也加入句子中。


    最后，将诗句的正文部分通过切片取出来，连接成字符串，就可以输出了：


    ```

    ''''.join(poem)

    ```


    第41行代码的作用就是连接`poem`列表的每个元素。这里注意字符串的内容是空的，也就是两个单引号紧挨着，而不是中间有空格。


    `join()`括号内的是要被连接的列表。前面的字符串表示用什么连接，也就是列表元素。就好像用锁扣将列表元素两两连接在一起，字符串就是锁扣的样子。使用空字符串就表示将列表元素直接连接。


    如果是下面这样的代码，就会得到每两个字之间是`*`的诗句：


    ```

    1    poem = [''海'', ''上'', ''升'', ''明'', ''月'']

    2    poem = ''*''.join(poem)

    3    print(poem)

    ```


    输出结果如下：


    ```

    海*上*升*明*月

    ```


    如果你对诗歌有一定的研究，就会发现这样写出来的诗仅仅是样子看起来像诗。分析程序的原理就会知道，它只是把一堆相近的意象、字词简单地堆砌在一起，没有平仄，更没有考虑诗意。不过，至少我们已经向用人工智能写出真正的诗迈出了一小步。只要你继续学习探索人工智能，一定能改进程序，写出真正的诗。


