    通过爬虫获取网站数据的速度非常快，如果有大量爬虫访问同一个网站，就会给网站服务器造成很大压力，影响其他人的正常使用。还有一些人会通过爬虫技术获取非法数据，比如搜集服务器上的用户隐私数据，或者从小说、图片、视频网站抓取内容造成侵权。


    无论是非法获取数据，还是利用爬虫来干扰其他人的网站，都是违法犯罪行为，将会受到法律的制裁。


    所以，在使用爬虫时，一定要注意**合理合法**。利用爬虫获取的内容一定要是网站的公开内容，不能使用不正当的方式破解网站。你可以通过网站的`robots.txt`文件来查看哪些内容是不允许爬虫访问的。一般来说，只要在网站的网址后面加上`/robots.txt`就可以查看这个文件。比如我们前面用过的NASA数据网站，它的`robots.txt`地址就是`nssdc.gsfc.nasa.gov/robots.txt`。


    对允许爬取的内容，获取数据时也不要太频繁，速度不要太快。除非网站允许，不要用获取到的数据来盈利。


