    \ 位**，在后两个选项中选择下载，32 位对应橙色箭头 32-bit，64 位对应蓝色箭头 64-bit，如图 1-5 所示。\n\n![](img/1-5.png)\n\
    \n图 1-5　Python 3.8.10 - May 3, 2021\n\n如果你不知道自己的计算机系统到底是多少位，那么可以在“开始”菜单中找到“计算机”，单击鼠标右键，然后在弹出的菜单中选择“属性”（见图\
    \ 1-6），就可以在“系统”类型条目中看到准确的信息（见图 1-7）。\n\n![](img/1-6.png)\n\n图 1-6　Windows 7 系统的“开始”菜单\n\
    \n![](img/1-7.png)\n\n图 1-7　计算机属性中的“系统”类型\n\n如果用的是 Windows XP 等更低版本的操作系统，那么请先升级系统，以免书中的有些内容无法实现。\n\
