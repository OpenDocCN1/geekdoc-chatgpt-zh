    ## K 最近邻算法


    橘子和橙子都是非常好吃的水果，而且这两种水果非常相似，它们都是圆形，有着橙黄色的外表，如图 3-12 所示。不过，禾木和桃子的口味有所不同，禾木喜欢吃橘子，他觉得剥橙子皮实在是太麻烦了；而桃子喜欢吃橙子，她觉得橙子的口感比橘子更好。


