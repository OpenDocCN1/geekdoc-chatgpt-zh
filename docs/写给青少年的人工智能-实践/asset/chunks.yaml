    29       ave_x2 = ave_x2 / len(x)     # 将所有x**2的和除以个数，求平均值

    30       # 以下通过最小二乘法公式计算k和b

    31       k = (ave_xy - ave_x * ave_y) / (ave_x2 - ave_x ** 2)

    32       b = ave_y - k * ave_x

    33       return k, b

