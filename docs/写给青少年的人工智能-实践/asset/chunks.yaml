    ## K最近邻算法


    橘子和橙子都是非常好吃的水果，而且这两种水果非常相似，它们都是圆形，有着橙黄色的外表，如图3-12所示。不过，禾木和桃子的口味有所不同，禾木喜欢吃橘子，他觉得剥橙子皮实在是太麻烦了；而桃子喜欢吃橙子，她觉得橙子的口感比橘子更好。


    ![](Images/3-12.jpg)


    图3-12　橘子和橙子长得很像


    不巧的是，这一天禾木买了橘子，桃子买了橙子，结果不小心混在了一起。现在他们需要把两种水果分开，挑出自己喜欢的水果。


    对于熟悉两种水果的同学来说，这可能也就是看一眼的事。那么我们“看一眼”的过程到底是根据什么来区分的呢？能不能把这个过程写成算法，教给人工智能呢？


    从外观来看，橘子和橙子虽然相似，但是也有明显的不同。一般来说，橙子的个头更大，也更圆，表皮也更光滑；而橘子一般会小一些，呈扁圆形，而且表皮往往有一些坑坑洼洼。那么我们就可以根据水果的大小、圆度、光滑度来进行分类。为了方便，我们这里根据其中的两个特征——大小、圆度进行区分，编写算法代码。


