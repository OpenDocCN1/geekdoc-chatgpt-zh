    \ 系统还是 macOS 系统自动匹配。在编写本书时，适合**Windows 10 系统**的 Python 最新稳定版本是 3.9.6。单击“Python\
    \ 3.9.6”按钮即可下载，如图 1-3 中的橙色箭头所示。\n\n![](img/1-3.png)\n\n图 1-3　下载 Python 3.9.6\n\
    \n如果你的计算机安装的是**更早版本的 Windows 系统，比如 Windows 7**，就需要单击“Downloads”菜单的“Windows”选项（见图\
    \ 1-3 中的蓝色箭头），打开下载版本选择页面，如图 1-4 所示。\n\n![](img/1-4.png)\n\n图 1-4　Python 官网的下载版本选择页面\n\
