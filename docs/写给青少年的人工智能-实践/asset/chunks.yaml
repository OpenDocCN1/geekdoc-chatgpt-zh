    这确实是代码，只不过不是Python代码，而是用另一种语言——**HTML语言**写成的**网页代码**。为了让用户看起来更方便，网页上的数据往往会有所修饰，通过各种各样的图像、表格来呈现，并进行排版。这些都是通过HTML代码进行的。网页上的每一个元素，都是这些HTML代码决定的。


    不过，这些修饰性成分对于计算机来说基本都是“遮挡视野的障碍物”，所以我们必须帮助计算机分析网页，找出隐藏在HTML代码中的真正数据。分析网页代码正是编写网络爬虫这种程序的第一步。


    虽然学习HTML语言并读懂网页代码是分析网页的基本方法，但是我们也可以借助一些工具来更高效地实现目标。对于一些简单的网页，我们甚至不需要精通HTML语言也可以完成分析。


    打开网页，按键盘上的“F12”键（有些键盘需要按“Fn+F12”），就可以启动浏览器自带的**网页分析工具（或者叫作开发人员工具）**。各个浏览器的页面分析工具大同小异，我们推荐使用最新版的Edge浏览器（Chromium内核）或Chrome浏览器，如图2-6所示。


