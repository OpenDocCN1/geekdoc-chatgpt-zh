    ## 利用网站API获取数据


    **分析网页数据是编写爬虫最基本的方法，也是最通用的方法。**不过为了方便阅读，程序员在网页代码中添加了很多数据以外的内容，这样一来，想要分析网页实在是太烦琐了。


    有没有专门为了计算机设计，可以让计算机直接读取的网页呢？有些网站会把部分数据整理好，放在某个地址来供自己和其他人直接调用获取，非常方便。**这个提供数据的地址就称为网站的应用程序接口，简称API。**有了API，我们要获取数据就容易多了。


    下面我们就一起来通过API爬虫获取核桃世界的两个城市（赛加市和中心城）的天气数据。


    在浏览器的地址栏中输入一个URL网址，例如打开本书的教学网页核桃天气，就可以查看赛加市在2021年7月14日至2021年7月20日期间的天气了。单击位于界面顶部的“导航栏”标签，就可以切换到中心城的天气数据，如图2-12所示。


    通过网页分析工具可以看到，这两个页面上的数据非常琐碎，想要通过分析网页来编写爬虫有一定的难度。如果已经设计了API，通过网址，我们就可以使用API了。


    ![](Images/2-12.png)


    图2-12　天气预报教学网页


    我们依然通过`requests.get()`函数从API获取数据。这个API中的数据是用**JSON格式**保存的。这是一种在互联网上非常常见的数据格式，用于存储简单的数据结构和对象。JSON格式的数据与Python中的**字典**基本相同。使用`requests`库中的`json()`函数，就可以把JSON数据直接转化为Python字典。


    程序2.5会从API中获取数据，转化成字典并显示。


    程序2.5　从API获取数据并转化为字典


    ```

    1    import requests

    2    url = ''▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓''

    3    r = requests.get(url)

    4    r.encoding = ''utf-8''                        # 设置编码

    5    saijia_date = r.json()

    6    print(saijia_date)

    ```


    为了方便阅读，我们将字典数据整理一下。


    ```

    1    {

    2        "location": {

    3            "city": "赛加市",

    4            "id": "0001"

    5        },

    6        "now": {

    7            "temp": 27,

    8            "wind_class": "微风",

    9            "wind_dir": "东风",

    10           "text": "多云"

    11       },

    12       "forecasts": [{

    13           "date": "2021-07-14",

    14           "high": 33,

    15           "low": 24,

    16           "wc_day": "微风",

    17           "wc_night": "微风",

    18           "wd_day": "东风",

    19           "wd_night": "东风",

    20           "text_day": "多云",

    21           "text_night": "晴"

    22       },

    23   ……后6天内容略]

    24   }

    ```


    显然，这个字典中有3组键值，分别是`"location"`所在地、`"now"`当前天气和`"forecasts"`未来7天的天气预报。


    我们重点关注的是未来7天的天气预报。它的值是一个有7个元素的列表，每个元素对应着一天的天气内容。例如，第13～21行就是第一天的天气数据（第0个元素）。由于数据太长，这里已将列表的后6个元素（后6天的天气）省略。


    天气内容也是用字典表示的，每个键的含义如表2-1所示。


    表2-1　天气内容的字典表示


    | 代码 || 含义 |


    | --- | --- |


    | `"date": "2021-07-14",` || 日期 |


    | `"high": 33,` || 最高气温 |


    | `"low": 24,` || 最低气温 |


    | `"wc_day": "微风",` || 白天风力 |


    | `"wc_night": "微风",` || 夜晚风力 |


