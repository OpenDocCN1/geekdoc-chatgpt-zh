    \ Thonny”菜单\n\n例如，下面的内容说明 Python 版本是 3.7.9（32 位），如图 4-3 所示。\n\n![](img/4-3.jpg)\n\
    \n图 4-3　查看 Python 版本\n\n记住上面查到的这两个数字，然后查找 Python 第三方库`gensim`的网站，登录并下载与版本号对应的\
    \ whl 文件。文件名中 cp 后的两个数字是版本号的前两个数字，比如版本号是 3.7.9，就应该找`cp37`。`win`后的数字代表多少位，图 4-3\
    \ 中 Python 是 32 位，那么文件名中就是`win32`。如果是 64 位，那么文件名中应该是`win_amd64`，如图 4-4 所示。\n\n\
    ![](img/4-4.jpg)\n\n图 4-4　通过文件名找到对应版本\n\n所以，对于版本为 3.7.9（32 位）的 Python，应该选择`gensim-4.0.1-cp37-cp37m-win32.whl`进行下载。注意，下载时，请勿修改文件名。\n\
