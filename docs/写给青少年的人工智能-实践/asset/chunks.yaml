    \n## Python语言的逻辑结构\n\n写作文时，语文老师经常会说要注意文章的逻辑结构，把文章的观点表达得更清晰。编写程序更是如此。\n\n### 顺序结构\n\
    \n我们在“Shell”区域中编写的代码，都是执行完一句再执行下一句，如图1-46所示。这样依次按顺序执行的结构称为**顺序结构**。顺序结构是最常见、最基本的结构。\n\
    \n![](Images/1-46.png)\n\n图1-46　顺序结构\n\n但是，对于现实世界中的很多问题，我们通常无法按照顺序的方法实现，而是需要经常做出判断和选择，这时就要用到**分支结构（选择结构）**。\n\
    \n### 分支结构\n\n密码是保护秘密的重要工具。无论是登录自己的QQ号，还是买东西时用手机付款，都需要密码。如果要设计一段程序来检测密码是否正确，应该怎么做呢？首先我们需要向程序输入密码，然后程序会对我们输入的密码与程序中储存的密码加以比较和判断，如果相同，那么说明密码正确，否则就提示密码错误。\n\
    \n**如果……那么……否则……，这就是一种分支结构。在Python中，要构造分支结构，可以使用`if`、`elif`和`else`关键字。**\n\n分支结构的格式如下，`if`后面跟随的是**布尔表达式或布尔值**，例如比较运算符、逻辑运算符构成的表达式。如果布尔表达式的结果为真（`True`），那么执行`代码块1`的内容，执行完后跳过`代码块2`部分，结束这部分程序；如果布尔表达式的结果为假（`False`），那么跳过`代码块``1`，执行`代码块2`的内容，如图1-47所示。\n\
    \n```\nif布尔表达式:\n    代码块1\nelse:\n    代码块2\n```\n\n![说明: 图示 描述已自动生成](Images/1-47.jpg)\n\
    \n图1-47　选择结构\n\n`代码块1`和`代码块2`的前面都有**空格**，或者说它们进行了**缩进**。**Python中使用缩进的方式来表示代码的层次结构，缩进相同（空格一样多）就表示它们处在同一个层次。**\n\
    \n换句话说，如果几行代码是连续的，而且保持了相同的缩进，那么它们就属于同一个代码块，相当于一个执行的整体。例如`if`条件成立的情况下，如果需要执行多条语句，那么只要连续输入几行代码，并保持相同的缩进（空格一样多）就可以了。缩进可以使用任意数量的空格，但**通常使用4个空格**。\n\
    \n程序1.19的例子展示了如何构造一个分支结构。`input()`的作用是让程序接收使用者输入的内容，将括号中的内容显示在屏幕上，作为提示。使用者输入内容后，按Enter键予以确认，输入的内容就会变成字符串，作为`input()`的结果赋值给变量`password`。注意，`#`后面的内容起到解释这一行代码的作用，不需要作为代码来输入。冒号（:）要以英文状态输入。\n\
    \n程序1.19　使用分支结构来判断密码\n\n```\n1    password = input(\"请输入密码：\")       # 向程序输入密码\n\
    2    correct_pass = \"123456\"              # 正确的密码是123456\n3    if password ==\
    \ correct_pass:         # 比较输入的密码和正确的密码\n4        print(\"密码正确\")            \
    \     # 比较结果为True则显示密码正确\n5        print(\"欢迎进入\")                 # 相同的缩进说明属于同一个代码块\n\
    6    else:                                # 否则\n7        print(\"密码错误\")     \
    \            # 显示密码错误\n```\n\n有时我们需要做出多次判断，那么可以在中间再加一个或多个`elif`，如下所示：\n\n```\n\
    if布尔表达式1:\n    代码块1\nelif布尔表达式2:\n    代码块2\nelse:\n    代码块3\n```\n\n如果布尔表达式1为`False`，就会再用同样的方式判断布尔表达式2，运行程序。例如，程序1.20所示的代码会将分数转换成评价，即90分及以上是优秀，60～89分是良好，60分以下是不合格。由于`input()`的结果是字符串，因此要与分数数字比较大小，必须先用`int()`将其转换为数字。\n\
    \n程序1.20　使用`elif`的示例\n\n```\n1    score = input(\"请输入分数:\")             # 输入分数\n\
    2    score = int(score)                      # 将分数字符串转换为数字\n3    if score >= 90:\n\
    4        print(\"优秀\")\n5    elif 60 <= score < 90:\n6        print(\"良好\")\n\
    7    else:\n8        print(\"不合格\")\n```\n\n和C语言等编程语言不同，Python中可以使用像`60 <= score\
    \ < 90`这样连续的比较，这条语句相当于`60 <= score and score < 90`，和数学表达式相差无几。\n\n我们还可以**嵌套**使用`if`结构，也就是把各个代码块换成另一层`if`结构，就像下面这样。嵌套部分的代码块（`代码块1`、`代码块2`）前面需要额外空4个空格，也就是有8个空格。\n\
    \n```\nif布尔表达式1:\n    if布尔表达式2:\n        代码块1\n    else:\n        代码块2\nelif布尔表达式3:\n\
    \    代码块3\nelse:\n    代码块4\n```\n\n### 循环结构\n\n在编写程序时，我们有时需要将一段代码反复执行很多次。比如，如果想用`*`来组成一个如下所示的3×3方阵，那么可能会写下程序1.21这样的代码。\n\
    \n```\n***\n***\n***\n```\n\n程序1.21　显示星号方阵的直接方法\n\n```\n1    print('*'*3)    \
    \       # '*'*3就表示字符串'***'，参见前文字符串部分\n2    print('*'*3)\n3    print('*'*3)\n```\n\
    \n但是如果要重复1000次，就很难这样写了。这时可以选择使用**循环结构**。\n\n**Python中的循环结构有两种形式。第一种形式是`while`循环。**\n\
    \n```\nwhile布尔表达式:\n    循环体代码块\n```\n\n效果是当布尔表达式的结果为`True`时，反复执行下面的代码块，否则就结束循环，如图1-48所示。\n\
    \n![](Images/1-48.png)\n\n图1-48　循环结构\n\n例如，前文显示`*`的代码可以改写为程序1.22。\n\n程序1.22　使用`while`循环显示星号方阵\n\
    \n```\n1    i = 0\n2    while i <3 :\n3        print('*'*3)\n4        i = i +\
    \ 1\n```\n\n循环变量`i`从0开始，当`i<3`时，就会反复执行循环体代码块，也就是输出`***`，并将循环变量`i`增加1。执行3次后，循环变量`i`就变成了3，不再满足`i<3``的条件`，循环结束。\n\
    \n循环变量会随着循环的进行而改变，所以如果适当改动代码（见程序1.23），就可以输出如下由`*`组成的三角形。\n\n```\n*\n**\n***\n\
    ```\n\n程序1.23　使用`while`循环显示星号三角\n\n```\n1    i = 1\n2    while i <4 :\n3     \
    \   print('*'*i)\n4        i = i + 1\n```\n\n`while`**循环一般用在循环次数不确定的场合。**比如输入密码时，如果密码不正确，就反复输入，密码正确就结束，如程序1.24所示。\n\
    \n程序1.24　使用`while`循环反复询问密码，直到正确\n\n```\n1    correct_pwd = 'hetao'           #\
    \ 正确的密码\n2    pwd = input('请输入密码：')       # 用户输入密码\n3    while pwd != correct_pwd:\
    \       # 比较密码是否正确\n4        pwd = input('请输入密码：')   # 如果密码错误，则进入循环，重复输入密码\n5\
    \    print('密码正确')                # 如果密码正确，则退出循环，显示\"密码正确\"\n```\n\n**第二种循环形式是`for`循环**。\n\
    \n```\nfor变量in可迭代对象:\n    循环体代码块\n```\n\n`for`循环会将可迭代对象中的所有内容依次赋给变量，并执行循环体代码。像字符串、列表、元组、字典这样含有多个元素、可以一一计数的对象，都是常见的可迭代对象。\n\
    \n`for`**循环常用来进行遍历或枚举**，比如列出一组中所有同学的名字，可以写成程序1.25。\n\n程序1.25　列出一组中所有同学的名字\n\n\
    ```\n1    Group_1 = ['禾木','桃子','乌拉乎','小核桃']\n2    for name in Group_1:\n3    \
    \    print(name)\n```\n\n像前文显示的`*`方阵，是执行次数确定的循环，属于`for`循环的适用场景。你可以使用`for循环`进行3次循环，如程序1.26所示。\n\
    \n程序1.26　使用`for`进行3次循环\n\n```\n1    seq = [0,1,2]\n2    for i in seq:\n3     \
    \   print('*'*3)\n```\n\n不过，我们通常会采用另一种更方便的写法，那就是使用`range()`函数，如程序1.27所示。\n\n程序1.27　使用`range()`函数\n\
