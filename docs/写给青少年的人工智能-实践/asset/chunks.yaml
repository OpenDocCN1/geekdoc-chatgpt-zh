- raw: "循环可以将同一段代码连续反复执行。但有时我们需要将一段代码灵活地插入程序中的不同位置，就像在数学题中使用数学公式一样，这时循环就显得非常死板，无法满足我们的需求。这时我们可以使用**函数**。函数就是组织好的、可重复使用的、用来实现单一或相关联功能的代码段。\n\
    \n**将一段具有特定功能的代码定义为函数，然后只要使用函数的名字，并输入合适的参数，就可以方便地使用它了。参数就是输入给函数、供函数使用的变量等对象**。`print()`、`input()`，这些都是Python中自带的常用函数。\n\
    \n我们也可以把自己写的代码变成函数。函数的定义非常方便，如下所示：\n\n```\ndef函数名字(参数):\n    代码块\n    return结果\n\
    ```\n\n定义好函数后，我们就可以用`函数名字(参数)`的方式调用函数。在程序中，函数定义代码的位置必须在调用函数的前面。\n\n圆的面积公式是*S=*π*×r*²，我们可以将这个公式定义为函数（π取值3.14），并计算半径为3和8的圆的面积，如程序1.30所示。\n\
    \n程序1.30　使用函数计算圆面积\n\n```\n1    def circle_area(r):\n2        S = 3.14 * r**2\n\
    3        return S\n4    print(circle_area(3))\n5    x = 8\n6    y = circle_area(x)\n\
    7    print(y)\n```\n\n要注意的是，**除了少数特殊情况，定义函数使用的各个变量都只在函数内部有效**，与函数外的变量互不影响。函数执行结束后，所有函数中的变量会被清除，只输出结果。也就是说，函数结束后，不会再有一个变量`S`存储着计算好的圆面积，你需要立即直接使用或将输出结果赋给别的变量。\n\
    \n同时，使用函数时，作为参数传入函数的变量名与定义函数时使用的变量名也没有关系，既可以相同，也可以不同。\n\n函数也可以没有参数，甚至没有输出结果。比如程序1.31中的函数，不需要参数，也没有输出，每次调用就在屏幕上显示“你好世界”和“Hello\
    \ world”。\n\n程序1.31　没有输入输出的函数\n\n```\n1    def hello():\n2        print('你好世界')\n\
    3        print('Hello world')\n4    hello()\n```\n\n## 注释\n\n在前面的代码中，你一定注意到有很多“`#`”。**这个符号用于表示注释，是给人看、帮助人理解程序用的，计算机不会执行其后的内容**。\n\
    \n注释还有一种写法：使用3个引号开头，再用3个引号结尾，单引号和双引号都可以使用，但是一次只能使用一种。这种方式可以进行多行注释，如程序1.32所示。\n\
    \n程序1.32　注释\n\n```\n1    # 这里的内容是注释\n2    ''' 使用3个单引号开始注释\n3        可以进行多行注释\n\
    4        再使用3个单引号结束注释'''\n5    \"\"\"使用3个双引号开始注释\n6        可以进行多行注释\n7       \
    \ 再使用3个双引号结束注释内容\"\"\"\n```\n\n## 使用Python库\n\n在Python中，有大量方便的函数可供使用，实现包括屏幕显示、操作文件、数学运算、计算时间、网络数据处理、图形界面等功能。为了方便管理和使用，开发人员把它们分成了很多组，也就是**Python库**。Python语言自带的库又称为**标准库**。在Python语言中，库一般是以**包**的形式组织的，每个包中有多个**模块**，模块中有不同的**函数**。如果觉得比较复杂，你暂时可以把库、包和模块看成同样的东西。\n\
    \n想要使用功能丰富的Python库函数，必须先**导入相关的Python库**。\n\n比如，求绝对值是一种常见的数学运算，Python标准库`math`中的`fabs()`函数就可以求出绝对值。使用`fabs()`要先导入`math`库。程序1.33是使用绝对值函数`fabs()`最常见的做法。\n\
    \n程序1.33　使用`math`库中的绝对值函数`fabs()`\n\n```\n1    import math\n2    x = math.fabs(-3)\n\
    3    print(x)\n```\n\n使用`fabs()`时，还需要在前面加上`math.`，用于说明`fabs()`函数在`math`库中。\n\n\
    有时库的名字很长，使用不方便，你还可以给导入的库另起一个名字，也就是**别名**。程序1.34中的代码在导入`math`库时将它改名为`mt`。改名时要特别注意，不要引起混淆。\n\
    \n程序1.34　给math库起别名\n\n```\n1    import math as mt\n2    x = mt.fabs(-3)\n3   \
    \ print(x)\n```\n\n如果只使用少数几个函数，也可以只导入函数，而不导入整个库。下面的代码只导入了`fabs()`函数，没有导入`math`库中的其他函数。在这种情况下，你可以直接使用被导入的函数，不需要带上库名前缀，如程序1.35所示。\n\
    \n程序1.35　直接导入库中函数\n\n```\n1    from math import fabs\n2    x = fabs(-3)\n3   \
    \ print(x)\n```\n\n使用`as`起别名对于函数来说同样有效，如程序1.36所示。\n\n程序1.36　函数别名\n\n```\n1   \
    \ from math import fabs as jueduizhi\n2    x = jueduizhi(-3)\n3    print(x)\n\
    ```\n\n## 第三方库\n\nPython的标准库虽然功能强大，但也不是万能的。为了弥补标准库的不足，很多程序员也会把他们编写的各种功能、函数写成库，并共享出来，这就是**第三方库**。\n\
    \n使用第三方库的代码和使用标准库没有什么不同。不过，第三方库不是Python语言自带的，所以使用前要先进行安装。\n\n对于不同的Python开发工具和操作系统，安装第三方库的方式有一些区别。下面我们介绍如何对原生Python的IDLE和Thonny安装第三方库。注意，**如果你同时安装了这两种开发工具，用两种方式安装的第三方库不能给对方使用，必须各自安装。**\n\
    \n### 使用Python自带的IDLE工具编写程序\n\n如果使用IDLE编写Python，那么最方便的当属利用**pip命令**进行安装。pip是Python自带的一个库管理工具，它可以自动从网络上下载你需要的Python库进行安装。大多数Python库都可以利用pip安装。\n\
    \npip需要在命令行模式下输入命令来使用，这听起来好像有点陌生，但其实一点都不难。要使用pip，首先要**连接网络**。\n\n在**Windows系统**下，同时按住键盘上的**Windows图标键**和**R键**（后面记为Windows\
    \ + R），即可打开**运行窗口**。在运行窗口输入“`cmd`”，然后单击“确定”按钮，如图1-49所示。\n\n这样就可以打开**命令提示符窗口（也称为命令行窗口）**，如图1-50所示。\n\
    \n![](Images/1-49.png)\n\n图1-49　运行窗口\n\n![](Images/1-50.png)\n\n图1-50　命令提示符窗口\n\
    \n在命令提示符窗口中输入命令，再按下Enter键，就可以安装Python库了。注意，**pip必须在联网的情况下使用**。\n\n```\npip install库名\n\
    ```\n\n例如，我们会使用`requests`库，就需要在命令提示符窗口输入以下命令：\n\n```\npip install requests\n```\n\
    \n然后，按Enter键，如图1-51所示。\n\n![](Images/1-51.png)\n\n图1-51　输入pip命令\n\n安装成功后，一般会提示`Successfully\
    \ installed+库名`，如图1-52所示。\n\n![](Images/1-52.png)\n\n图1-52　安装成功\n\n另外，如果你看到了和图1-52中内容类似的黄色提示，说明pip版本不是最新版，可以通过如下命令进行升级：\n\
    \n```\npip install --upgrade pip\n```\n\n如果要卸载一个安装好的Python第三方库，只需要把安装时的`install`改成`uninstall`就可以了。\n\
    \n在**Windows 10系统**下，你也可以通过依次选择“开始”菜单 →“Windows系统”→“命令提示符”来打开命令提示符窗口，如图1-53所示。\n\
    \n![](Images/1-53.png)\n\n图1-53　Windows 10“开始”菜单中的“命令提示符”\n\n如果你使用的是**macOS系统**，那么可以同时按下Command键+空格键，打开“聚焦搜索”，然后输入“terminal”，打开“终端”，再输入相应的pip命令。你也可以通过“启动台”→“其他”→“终端”打开终端窗口。\n\
    \n### 使用Thonny编写Python\n\n如果你使用的是Thonny，那么必须使用Thonny的**包管理**功能来安装第三方库。打开Thonny，在**联网**的情况下，依次选择菜单栏中的**“工具”→“管理包”**，如图1-54所示。\n\
    \n![](Images/1-54.png)\n\n图1-54　Thonny的包管理功能\n\n输入想要安装的包“`requests`”，然后单击**“Search\
    \ on PyPI”**按钮，得到图1-55所示的结果。在得到的结果中，选择想要安装的包，也就是第一个选项。\n\n![](Images/1-55.png)\n\
    \n图1-55　搜索requests的结果\n\n选中后单击**“安装”按钮**，如图1-56所示，如果没有提示失败，就说明安装成功了。安装成功后，“安装”会变成“升级”和“卸载”。\n\
    \n![](Images/1-56.png)\n\n图1-56　准备安装requests包\n\n趣闻\n\n为什么编程语言都是英语，有没有中文编程语言？\n\
    \n如果你对编程语言有些了解，也许会好奇为什么编程语言都是英语。Python语言中的`if`、`while`、`print`，都是用英文字母、英文单词写就的。这对于很多英语不熟练的同学确实是不太友好，那么能不能用汉语来写程序呢？\n\
    \n首先我们要纠正一个说法，虽然**编程语言借用了英文字母，但是它并不是英语**，而是独立的编程语言，符合编程语言的语法规则。其实在很多程序语言中，我们也确实可以使用汉字。但同样地，我们不能说这是在用中文写程序。\n\
    \n在Python中，你可以使用汉字作为变量名或者函数名。比如下面的程序是可以运行的：\n\n```\n>>> 核桃 = 1\n>>> 编程 = 2\n>>>\
    \ print(核桃 + 编程)\n3\n```\n\n不过，在真正编写程序时，一般不建议使用中文变量名。Python语言中的各种符号必须使用英文符号，如果写程序时夹杂了中文变量名，那么很容易出现忘记切换输入法，不小心输入中文符号的情况，导致程序出错。\n\
    \n不过，完全使用汉字和中文符号的编程语言也是存在的，比如有一门叫作“易语言”的编程语言就是这样的。不过，这门语言存在一些问题，所以使用它的专业程序员并不多。\n\
    \n除了“易语言”，2019年还有人发明了一门用文言文编程的程序语言“文言编程”，也很有意思。比如，下面这段程序的效果是输出3遍“問天地好在。”\n\n```\n\
    吾有一數。曰三。名之曰「甲」。\n為是「甲」遍。\n吾有一言。曰「「問天地好在。」」。書之。\n云云。\n```\n\n### 读者服务：\n\n![](Images/wxfwh.png)\n\
    \n微信扫码关注【异步社区】微信公众号，回复“e59088”获取本书配套资源以及异步社区15天VIP会员卡，近千本电子书免费畅读。\n\n# 人工智能的养料——数据\n\
    \n![](Images/tz.png)桃子：禾木，你写这么多数字干什么？\n\n![](Images/hm.png)禾木：不是说训练人工智能需要数据吗？我在准备数据呢！\n\
    \n![](Images/xht.png)小核桃：哈哈，数据和数字可不是一回事。数据既可能是数字，也可能是其他形式的内容。下面我们就一起来看看，到底什么才是数据，我们可以从哪里获得数据。\n\
    \n![](Images/zd.png)\n\n## 什么是数据\n\n**数据**这个词，你应该听过。用手机上网，会耗费数据流量；评价一部电影好不好看，我们会关注票房数据、评分数据；在网上买东西，销量数据就成了重要的参考标准。我们常说，现在是数据的时代，生活的方方面面都和数据有关。\n\
    \n那么，数据到底是什么？“数据”和“数字”有什么关系？**数据是指进行各种统计、计算、科学研究或技术设计等所依据的数值。**由此可见，数据通常是指数字，比如电影评分、商品销量等。此外，像每天的气温、苹果的价格、期末考试的分数、每天写作业的时间都是数据，在计算机领域，**数据是客观事物的符号表示**，是指所有能输入计算机中并被计算机程序处理的符号的总称。也就是说，数据不一定是数字，一张照片、一段声音同样可以是数据。\n\
    \n还有一个词常常和数据一起出现，那就是信息。信息论的创始人克劳德·香农认为，**信息是用来消除不确定性的东西**。这是什么意思？其实就是信息让你可以对事物有更多的了解。举个例子，你听说禾木参加编程比赛拿了奖，但是不知道到底拿了什么奖，这就是不确定性。小核桃告诉你“禾木得了一等奖”，那么得什么奖这个不确定性就消失了，所以“禾木得了一等奖”就是信息。桃子也来告诉你“禾木是在编程比赛上得的奖”，但这个内容其实你已经知道了，所以对你来说，这不是信息。但是无论是小核桃说的，还是桃子说的，都可以视为数据，如图2-1所示。如果数据量非常非常大，那么就是新闻中常常提到的**大数据**了。\n\
    \n![](Images/2-1.jpg)\n\n图2-1　信息消除不确定性\n\n## 数据是从哪里来的\n\n获取有用的数据最直接的方法就是对相关内容进行观察并加以总结和记录。比如，想要得到一棵树上苹果的数量，认真数一数就可以获取这一数据；想要知道每天的气温，用温度计进行测量就可以获取这一数据。\n\
    \n不过，生活中需要数据的地方实在是太多了，如果所有数据都要亲自来记录，那得多麻烦啊。为此，科学家们发明了各种各样的**电子传感器**，来帮助我们获取数据。传感器可以感知环境的变化，将其和计算机配合使用，就可以自动记录数据了。\n\
    \n我们日常使用的手机内部就有很多传感器。比如屏幕的亮度可以跟随周围环境自动变化，就是因为光线传感器能感知明暗；很多手机有指南针功能，是因为手机内有**磁场传感器**或者**霍尔传感器**，可以像真正的指南针一样感知地球磁场；就连视频聊天时也会用到传感器——**声音传感器**和**图像传感器**，只不过我们一般会把它们称为**麦克风**和**摄像头**。\n\
    \n如今，我们的周围有非常多的传感器，甚至在浩瀚无垠的宇宙中，也有卫星或者探测器搭载着传感器在工作，如图2-2所示。截至目前，全世界已经有2.6万余种传感器，可以说无论你想获取什么数据，几乎都可以找到相应的传感器。\n\
    \n![](Images/2-2.jpg)\n\n图2-2　无论深海还是太空都有很多传感器\n\n我们使用手机、计算机的过程时刻都在产生数据。你为了使用各种网络服务所填写的内容是数据，在微博、朋友圈之类的社交平台发出的每一条文字、每一张照片是数据，甚至在网络上的每一次点击、看过的每一条内容也是数据。\n\
    \n不过无论是用传感器获取的数据，还是在使用网络时产生的数据，大多很难直接发挥作用。随着计算机技术的进步，数据的传递和收集变得容易多了。为了方便使用和研究，人们把很多数据，比如美国的天气、月球的地形等，合并成数据集并放在了互联网上，可供他人分享。\n\
    \n还记得我们在《写给青少年的人工智能 应用》一书中说过的**ImageNet**吗？**ImageNet**是由华裔科学家李飞飞带领团队创建的庞大**图片数据集**，用于图像识别人工智能的研究。目前这个图片数据集中有近1500万张标注好分类的图片，包含2万多种不同的物体。类似的数据库还有很多，比如同样是用于人工智能研究的**MNIST数据集**，它是大型手写数字数据集，包含7万余个不同的手写数字。\n\
    \n对天文知识感兴趣的同学可以从**探月工程数据发布与信息服务系统**获取嫦娥月球探测器发回的月球数据，或者从**美国宇航局（NASA）的数据网站**获得丰富的天文相关数据。\n\
    \n不过，在大多数时候，互联网上的数据并不是像ImageNet或者MNIST数据集那样整理好的。想要获取大量的数据还是非常费时费力的，所以我们往往会借助工具，其中之一就是网络爬虫。\n\
    \n## 网络爬虫是什么虫\n\n**网络爬虫**又称为**网络蜘蛛**，它并不是一种动物，而是一种计算机程序。网络爬虫的作用很简单，就是在互联网上不停地浏览各种信息，并把你想要获取的内容记录下来。爬虫就像蜘蛛一样，一点点巡视互联网这张大网的每一个角落，如图2-3所示。\n\
    \n利用爬虫，我们可以为人工智能和搜索引擎提供数据，可以做很多有趣的事。比如通过爬虫获取你感兴趣的各种新闻，然后统一发送，这样你就不需要在各个新闻网站反复查找；用爬虫获取天气预报数据，一旦预报下雨就马上将提醒发送到手机上，这样就不再需要每天关注天气了；在网站上看到很多有意思的图片，但是一张张下载太麻烦了，也可以使用爬虫进行批量下载；在购物网站看到一本喜欢的书，但价格有点贵，与其每天查看优惠信息，不如用爬虫来帮你监测。\n\
    \n![](Images/2-3.jpg)\n\n图2-3　网络爬虫\n\n利用Python语言，我们就可以编写简单的网络爬虫。\n\n## 通过分析网页获取数据\n\
    \nPython是编写网络爬虫的有力工具。下面我们就一起动手实现最简单的网络爬虫。\n\n如果你喜欢天文，一定对火星并不陌生。这颗红色的行星与地球一样，位于太阳系的宜居带。还有资料表明，火星曾拥有类似地球的环境与极丰富的资源。正因如此，火星成了科学家们研究的重点。在过去的几十年里，人类已经向火星发射了很多探测器，拍摄了大量照片。\n\
    \n美国宇航局数据网站上，就有很多有趣的火星图片，比如“NSSDCA Photo Gallery Mars”这个页面（在美国宇航局数据网站主页上依次单击“Image\
    \ Resources”→“NSSDCA Photo Gallery”，然后在下一个界面中进入图片库目录，并选择“Mars”），有各种各样的火星图片预览图及相关介绍。单击图片，你就可以看到高清图。但如果想把这个页面上的所有图片下载下来就比较麻烦了，你可以借助Python，**通过爬虫来批量下载图片**。\n\
    \n**通常，输入网址，打开网页，浏览器就会把你的请求通过网络发送给网站，再由网站把对应的网页数据发送给你**，如图2-4所示。\n\n![](Images/2-4.jpg)\n\
    \n图2-4　上网时，用户通过浏览器与网站服务器进行信息交流\n\n想要用Python从网站获取信息，也要采用类似步骤。不过，Python不需要打开浏览器，它可以利用相关的Python库，比如**requests库**，向网站发送请求。\n\
    \n```\npip install matplotlib\n```"
  fmt: "\n# 函数\n\n循环可以将同一段代码连续反复执行。但有时我们需要将一段代码灵活地插入程序中的不同位置，就像在数学题中使用数学公式一样，这时循环就显得非常死板，无法满足我们的需求。这时我们可以使用**函数**。函数就是组织好的、可重复使用的、用来实现单一或相关联功能的代码段。\n\
    \n**将一段具有特定功能的代码定义为函数，然后只要使用函数的名字，并输入合适的参数，就可以方便地使用它了。参数就是输入给函数、供函数使用的变量等对象**。`print()`、`input()`，这些都是Python中自带的常用函数。\n\
    \n我们也可以把自己写的代码变成函数。函数的定义非常方便，如下所示：\n\n```\ndef函数名字(参数):\n    代码块\n    return结果\n\
    ```\n\n定义好函数后，我们就可以用`函数名字(参数)`的方式调用函数。在程序中，函数定义代码的位置必须在调用函数的前面。\n\n圆的面积公式是*S=*π*×r*²，我们可以将这个公式定义为函数（π取值3.14），并计算半径为3和8的圆的面积，如程序1.30所示。\n\
    \n程序1.30　使用函数计算圆面积\n\n```\n1    def circle_area(r):\n2        S = 3.14 * r**2\n\
    3        return S\n4    print(circle_area(3))\n5    x = 8\n6    y = circle_area(x)\n\
    7    print(y)\n```\n\n要注意的是，**除了少数特殊情况，定义函数使用的各个变量都只在函数内部有效**，与函数外的变量互不影响。函数执行结束后，所有函数中的变量会被清除，只输出结果。也就是说，函数结束后，不会再有一个变量`S`存储着计算好的圆面积，你需要立即直接使用或将输出结果赋给别的变量。\n\
    \n同时，使用函数时，作为参数传入函数的变量名与定义函数时使用的变量名也没有关系，既可以相同，也可以不同。\n\n函数也可以没有参数，甚至没有输出结果。比如程序1.31中的函数，不需要参数，也没有输出，每次调用就在屏幕上显示“你好世界”和“Hello\
    \ world”。\n\n程序1.31　没有输入输出的函数\n\n```\n1    def hello():\n2        print('你好世界')\n\
    3        print('Hello world')\n4    hello()\n```\n\n## 注释\n\n在前面的代码中，你一定注意到有很多“`#`”。**这个符号用于表示注释，是给人看、帮助人理解程序用的，计算机不会执行其后的内容**。\n\
    \n注释还有一种写法：使用3个引号开头，再用3个引号结尾，单引号和双引号都可以使用，但是一次只能使用一种。这种方式可以进行多行注释，如程序1.32所示。\n\
    \n程序1.32　注释\n\n```\n1    # 这里的内容是注释\n2    ''' 使用3个单引号开始注释\n3        可以进行多行注释\n\
    4        再使用3个单引号结束注释'''\n5    \"\"\"使用3个双引号开始注释\n6        可以进行多行注释\n7       \
    \ 再使用3个双引号结束注释内容\"\"\"\n```\n\n## 使用Python库\n\n在Python中，有大量方便的函数可供使用，实现包括屏幕显示、操作文件、数学运算、计算时间、网络数据处理、图形界面等功能。为了方便管理和使用，开发人员把它们分成了很多组，也就是**Python库**。Python语言自带的库又称为**标准库**。在Python语言中，库一般是以**包**的形式组织的，每个包中有多个**模块**，模块中有不同的**函数**。如果觉得比较复杂，你暂时可以把库、包和模块看成同样的东西。\n\
    \n想要使用功能丰富的Python库函数，必须先**导入相关的Python库**。\n\n比如，求绝对值是一种常见的数学运算，Python标准库`math`中的`fabs()`函数就可以求出绝对值。使用`fabs()`要先导入`math`库。程序1.33是使用绝对值函数`fabs()`最常见的做法。\n\
    \n程序1.33　使用`math`库中的绝对值函数`fabs()`\n\n```\n1    import math\n2    x = math.fabs(-3)\n\
    3    print(x)\n```\n\n使用`fabs()`时，还需要在前面加上`math.`，用于说明`fabs()`函数在`math`库中。\n\n\
    有时库的名字很长，使用不方便，你还可以给导入的库另起一个名字，也就是**别名**。程序1.34中的代码在导入`math`库时将它改名为`mt`。改名时要特别注意，不要引起混淆。\n\
    \n程序1.34　给math库起别名\n\n```\n1    import math as mt\n2    x = mt.fabs(-3)\n3   \
    \ print(x)\n```\n\n如果只使用少数几个函数，也可以只导入函数，而不导入整个库。下面的代码只导入了`fabs()`函数，没有导入`math`库中的其他函数。在这种情况下，你可以直接使用被导入的函数，不需要带上库名前缀，如程序1.35所示。\n\
    \n程序1.35　直接导入库中函数\n\n```\n1    from math import fabs\n2    x = fabs(-3)\n3   \
    \ print(x)\n```\n\n使用`as`起别名对于函数来说同样有效，如程序1.36所示。\n\n程序1.36　函数别名\n\n```\n1   \
    \ from math import fabs as jueduizhi\n2    x = jueduizhi(-3)\n3    print(x)\n\
    ```\n\n## 第三方库\n\nPython的标准库虽然功能强大，但也不是万能的。为了弥补标准库的不足，很多程序员也会把他们编写的各种功能、函数写成库，并共享出来，这就是**第三方库**。\n\
    \n使用第三方库的代码和使用标准库没有什么不同。不过，第三方库不是Python语言自带的，所以使用前要先进行安装。\n\n对于不同的Python开发工具和操作系统，安装第三方库的方式有一些区别。下面我们介绍如何对原生Python的IDLE和Thonny安装第三方库。注意，**如果你同时安装了这两种开发工具，用两种方式安装的第三方库不能给对方使用，必须各自安装。**\n\
    \n### 使用Python自带的IDLE工具编写程序\n\n如果使用IDLE编写Python，那么最方便的当属利用`pip`命令进行安装。`pip`是Python自带的一个库管理工具，它可以自动从网络上下载你需要的Python库进行安装。大多数Python库都可以利用`pip`安装。\n\
    \n`pip`需要在命令行模式下输入命令来使用，这听起来好像有点陌生，但其实一点都不难。要使用`pip`，首先要**连接网络**。\n\n在**Windows系统**下，同时按住键盘上的**Windows图标键**和**R键**（后面记为Windows\
    \ + R），即可打开**运行窗口**。在运行窗口输入“`cmd`”，然后单击“确定”按钮，如图1-49所示。\n\n这样就可以打开**命令提示符窗口（也称为命令行窗口）**，如图1-50所示。\n\
    \n![](Images/1-49.png)\n\n图1-49　运行窗口\n\n![](Images/1-50.png)\n\n图1-50　命令提示符窗口\n\
    \n在命令提示符窗口中输入命令，再按下Enter键，就可以安装Python库了。注意，**`pip`必须在联网的情况下使用**。\n\n```\npip install库名\n\
    ```\n\n例如，我们会使用`requests`库，就需要在命令提示符窗口输入以下命令：\n\n```\npip install requests\n```\n\
    \n然后，按Enter键，如图1-51所示。\n\n![](Images/1-51.png)\n\n图1-51　输入pip命令\n\n安装成功后，一般会提示`Successfully\
    \ installed+库名`，如图1-52所示。\n\n![](Images/1-52.png)\n\n图1-52　安装成功\n\n另外，如果你看到了和图1-52中内容类似的黄色提示，说明`pip`版本不是最新版，可以通过如下命令进行升级：\n\
    \n```\npip install --upgrade pip\n```\n\n如果要卸载一个安装好的Python第三方库，只需要把安装时的`install`改成`uninstall`就可以了。\n\
    \n在**Windows 10系统**下，你也可以通过依次选择“开始”菜单 →“Windows系统”→“命令提示符”来打开命令提示符窗口，如图1-53所示。\n\
    \n![](Images/1-53.png)\n\n图1-53　Windows 10“开始”菜单中的“命令提示符”\n\n如果你使用的是**macOS系统**，那么可以同时按下Command键+空格键，打开“聚焦搜索”，然后输入“terminal”，打开“终端”，再输入相应的`pip`命令。你也可以通过“启动台”→“其他”→“终端”打开终端窗口。\n\
    \n### 使用Thonny编写Python\n\n如果你使用的是Thonny，那么必须使用Thonny的**包管理**功能来安装第三方库。打开Thonny，在**联网**的情况下，依次选择菜单栏中的**“工具”→“管理包”**，如图1-54所示。\n\
    \n![](Images/1-54.png)\n\n图1-54　Thonny的包管理功能\n\n输入想要安装的包“`requests`”，然后单击**“Search\
    \ on PyPI”**按钮，得到图1-55所示的结果。在得到的结果中，选择想要安装的包，也就是第一个选项。\n\n![](Images/1-55.png)\n\
    \n图1-55　搜索requests的结果\n\n选中后单击**“安装”按钮**，如图1-56所示，如果没有提示失败，就说明安装成功了。安装成功后，“安装”会变成“升级”和“卸载”。\n\
    \n![](Images/1-56.png)\n\n图1-56　准备安装requests包\n\n## 趣闻\n\n为什么编程语言都是英语，有没有中文编程语言？\n\
    \n如果你对编程语言有些了解，也许会好奇为什么编程语言都是英语。Python语言中的`if`、`while`、`print`，都是用英文字母、英文单词写就的。这对于很多英语不熟练的同学确实是不太友好，那么能不能用汉语来写程序呢？\n\
    \n首先我们要纠正一个说法，虽然**编程语言借用了英文字母，但是它并不是英语**，而是独立的编程语言，符合编程语言的语法规则。其实在很多程序语言中，我们也确实可以使用汉字。但同样地，我们不能说这是在用中文写程序。\n\
    \n在Python中，你可以使用汉字作为变量名或者函数名。比如下面的程序是可以运行的：\n\n```\n>>> 核桃 = 1\n>>> 编程 = 2\n>>>\
    \ print(核桃 + 编程)\n3\n```\n\n不过，在真正编写程序时，一般不建议使用中文变量名。Python语言中的各种符号必须使用英文符号，如果写程序时夹杂了中文变量名，那么很容易出现忘记切换输入法，不小心输入中文符号的情况，导致程序出错。\n\
    \n不过，完全使用汉字和中文符号的编程语言也是存在的，比如有一门叫作“易语言”的编程语言就是这样的。不过，这门语言存在一些问题，所以使用它的专业程序员并不多。\n\
    \n除了“易语言”，2019年还有人发明了一门用文言文编程的程序语言“文言编程”，也很有意思。比如，下面这段程序的效果是输出3遍“問天地好在。”\n\n```\n\
    吾有一數。曰三。名之曰「甲」。\n為是「甲」遍。\n吾有一言。曰「「問天地好在。」」。書之。\n云云。\n```\n\n### 读者服务：\n\n![](Images/wxfwh.png)\n\
    \n微信扫码关注【异步社区】微信公众号，回复“e59088”获取本书配套资源以及异步社区15天VIP会员卡，近千本电子书免费畅读。\n\n# 人工智能的养料——数据\n\
    \n![](Images/tz.png)桃子：禾木，你写这么多数字干什么？\n\n![](Images/hm.png)禾木：不是说训练人工智能需要数据吗？我在准备数据呢！\n\
    \n![](Images/xht.png)小核桃：哈哈，数据和数字可不是一回事。数据既可能是数字，也可能是其他形式的内容。下面我们就一起来看看，到底什么才是数据，我们可以从哪里获得数据。\n\
    \n![](Images/zd.png)\n\n## 什么是数据\n\n**数据**这个词，你应该听过。用手机上网，会耗费数据流量；评价一部电影好不好看，我们会关注票房数据、评分数据；在网上买东西，销量数据就成了重要的参考标准。我们常说，现在是数据的时代，生活的方方面面都和数据有关。\n\
    \n那么，数据到底是什么？“数据”和“数字”有什么关系？**数据是指进行各种统计、计算、科学研究或技术设计等所依据的数值。**由此可见，数据通常是指数字，比如电影评分、商品销量等。此外，像每天的气温、苹果的价格、期末考试的分数、每天写作业的时间都是数据，在计算机领域，**数据是客观事物的符号表示**，是指所有能输入计算机中并被计算机程序处理的符号的总称。也就是说，数据不一定是数字，一张照片、一段声音同样可以是数据。\n\
    \n还有一个词常常和数据一起出现，那就是信息。信息论的创始人克劳德·香农认为，**信息是用来消除不确定性的东西**。这是什么意思？其实就是信息让你可以对事物有更多的了解。举个例子，你听说禾木参加编程比赛拿了奖，但是不知道到底拿了什么奖，这就是不确定性。小核桃告诉你“禾木得了一等奖”，那么得什么奖这个不确定性就消失了，所以“禾木得了一等奖”就是信息。桃子也来告诉你“禾木是在编程比赛上得的奖”，但这个内容其实你已经知道了，所以对你来说，这不是信息。但是无论是小核桃说的，还是桃子说的，都可以视为数据，如图2-1所示。如果数据量非常非常大，那么就是新闻中常常提到的**大数据**了。\n\
    \n![](Images/2-1.jpg)\n\n图2-1　信息消除不确定性\n\n## 数据是从哪里来的\n\n获取有用的数据最直接的方法就是对相关内容进行观察并加以总结和记录。比如，想要得到一棵树上苹果的数量，认真数一数就可以获取这一数据；想要知道每天的气温，用温度计进行测量就可以获取这一数据。\n\
    \n不过，生活中需要数据的地方实在是太多了，如果所有数据都要亲自来记录，那得多麻烦啊。为此，科学家们发明了各种各样的**电子传感器**，来帮助我们获取数据。传感器可以感知环境的变化，将其和计算机配合使用，就可以自动记录数据了。\n\
    \n我们日常使用的手机内部就有很多传感器。比如屏幕的亮度可以跟随周围环境自动变化，就是因为光线传感器能感知明暗；很多手机有指南针功能，是因为手机内有**磁场传感器**或者**霍尔传感器**，可以像真正的指南针一样感知地球磁场；就连视频聊天时也会用到传感器——**声音传感器**和**图像传感器**，只不过我们一般会把它们称为**麦克风**和**摄像头**。\n\
    \n如今，我们的周围有非常多的传感器，甚至在浩瀚无垠的宇宙中，也有卫星或者探测器搭载着传感器在工作，如图2-2所示。截至目前，全世界已经有2.6万余种传感器，可以说无论你想获取什么数据，几乎都可以找到相应的传感器。\n\
    \n![](Images/2-2.jpg)\n\n图2-2　无论深海还是太空都有很多传感器\n\n我们使用手机、计算机的过程时刻都在产生数据。你为了使用各种网络服务所填写的内容是数据，在微博、朋友圈之类的社交平台发出的每一条文字、每一张照片是数据，甚至在网络上的每一次点击、看过的每一条内容也是数据。\n\
    \n不过无论是用传感器获取的数据，还是在使用网络时产生的数据，大多很难直接发挥作用。随着计算机技术的进步，数据的传递和收集变得容易多了。为了方便使用和研究，人们把很多数据，比如美国的天气、月球的地形等，合并成数据集并放在了互联网上，可供他人分享。\n\
    \n还记得我们在《写给青少年的人工智能 应用》一书中说过的**ImageNet**吗？**ImageNet**是由华裔科学家李飞飞带领团队创建的庞大**图片数据集**，用于图像识别人工智能的研究。目前这个图片数据集中有近1500万张标注好分类的图片，包含2万多种不同的物体。类似的数据库还有很多，比如同样是用于人工智能研究的**MNIST数据集**，它是大型手写数字数据集，包含7万余个不同的手写数字。\n\
    \n对天文知识感兴趣的同学可以从**探月工程数据发布与信息服务系统**获取嫦娥月球探测器发回的月球数据，或者从**美国宇航局（NASA）的数据网站**获得丰富的天文相关数据。\n\
    \n不过，在大多数时候，互联网上的数据并不是像ImageNet或者MNIST数据集那样整理好的。想要获取大量的数据还是非常费时费力的，所以我们往往会借助工具，其中之一就是网络爬虫。\n\
    \n## 网络爬虫是什么虫\n\n**网络爬虫**又称为**网络蜘蛛**，它并不是一种动物，而是一种计算机程序。网络爬虫的作用很简单，就是在互联网上不停地浏览各种信息，并把你想要获取的内容记录下来。爬虫就像蜘蛛一样，一点点巡视互联网这张大网的每一个角落，如图2-3所示。\n\
    \n利用爬虫，我们可以为人工智能和搜索引擎提供数据，可以做很多有趣的事。比如通过爬虫获取你感兴趣的各种新闻，然后统一发送，这样你就不需要在各个新闻网站反复查找；用爬虫获取天气预报数据，一旦预报下雨就马上将提醒发送到手机上，这样就不再需要每天关注天气了；在网站上看到很多有意思的图片，但是一张张下载太麻烦了，也可以使用爬虫进行批量下载；在购物网站看到一本喜欢的书，但价格有点贵，与其每天查看优惠信息，不如用爬虫来帮你监测。\n\
    \n![](Images/2-3.jpg)\n\n图2-3　网络爬虫\n\n利用Python语言，我们就可以编写简单的网络爬虫。\n\n## 通过分析网页获取数据\n\
    \nPython是编写网络爬虫的有力工具。下面我们就一起动手实现最简单的网络爬虫。\n\n如果你喜欢天文，一定对火星并不陌生。这颗红色的行星与地球一样，位于太阳系的宜居带。还有资料表明，火星曾拥有类似地球的环境与极丰富的资源。正因如此，火星成了科学家们研究的重点。在过去的几十年里，人类已经向火星发射了很多探测器，拍摄了大量照片。\n\
    \n美国宇航局数据网站上，就有很多有趣的火星图片，比如“NSSDCA Photo Gallery Mars”这个页面（在美国宇航局数据网站主页上依次单击“Image\
    \ Resources”→“NSSDCA Photo Gallery”，然后在下一个界面中进入图片库目录，并选择“Mars”），有各种各样的火星图片预览图及相关介绍。单击图片，你就可以看到高清图。但如果想把这个页面上的所有图片下载下来就比较麻烦了，你可以借助Python，**通过爬虫来批量下载图片**。\n\
    \n**通常，输入网址，打开网页，浏览器就会把你的请求通过网络发送给网站，再由网站把对应的网页数据发送给你**，如图2-4所示。\n\n![](Images/2-4.jpg)\n\
    \n图2-4　上网时，用户通过浏览器与网站服务器进行信息交流\n\n想要用Python从网站获取信息，也要采用类似步骤。不过，Python不需要打开浏览器，它可以利用相关的Python库，比如**requests库**，向网站发送请求。\n\
    \n```\npip install matplotlib\n```\n"
  trans: "\n\n# 函数\n\n循环可以将同一段代码连续反复执行。但有时我们需要将一段代码灵活地插入程序中的不同位置，就像在数学题中使用数学公式一样，这时循环就显得非常死板，无法满足我们的需求。这时我们可以使用**函数**。函数就是组织好的、可重复使用的、用来实现单一或相关联功能的代码段。\n\
    \n**将一段具有特定功能的代码定义为函数，然后只要使用函数的名字，并输入合适的参数，就可以方便地使用它了。参数就是输入给函数、供函数使用的变量等对象**。`print()`、`input()`，这些都是\
    \ Python 中自带的常用函数。\n\n我们也可以把自己写的代码变成函数。函数的定义非常方便，如下所示：\n\n```\ndef 函数名字(参数):\n\
    \    代码块\n    return 结果\n```\n\n定义好函数后，我们就可以用`函数名字(参数)`的方式调用函数。在程序中，函数定义代码的位置必须在调用函数的前面。\n\
    \n圆的面积公式是*S=*π*×r*²，我们可以将这个公式定义为函数（π取值 3.14），并计算半径为 3 和 8 的圆的面积，如程序 1.30 所示。\n\
    \n程序 1.30　使用函数计算圆面积\n\n```\n1    def circle_area(r):\n2        S = 3.14 * r**2\n\
    3        return S\n4    print(circle_area(3))\n5    x = 8\n6    y = circle_area(x)\n\
    7    print(y)\n```\n\n要注意的是，**除了少数特殊情况，定义函数使用的各个变量都只在函数内部有效**，与函数外的变量互不影响。函数执行结束后，所有函数中的变量会被清除，只输出结果。也就是说，函数结束后，不会再有一个变量`S`存储着计算好的圆面积，你需要立即直接使用或将输出结果赋给别的变量。\n\
    \n同时，使用函数时，作为参数传入函数的变量名与定义函数时使用的变量名也没有关系，既可以相同，也可以不同。\n\n函数也可以没有参数，甚至没有输出结果。比如程序\
    \ 1.31 中的函数，不需要参数，也没有输出，每次调用就在屏幕上显示“你好世界”和“Hello world”。\n\n程序 1.31　没有输入输出的函数\n\
    \n```\n1    def hello():\n2        print('你好世界')\n3        print('Hello world')\n\
    4    hello()\n```\n\n## 注释\n\n在前面的代码中，你一定注意到有很多“`#`”。**这个符号用于表示注释，是给人看、帮助人理解程序用的，计算机不会执行其后的内容**。\n\
    \n注释还有一种写法：使用 3 个引号开头，再用 3 个引号结尾，单引号和双引号都可以使用，但是一次只能使用一种。这种方式可以进行多行注释，如程序 1.32\
    \ 所示。\n\n程序 1.32　注释\n\n```\n1    # 这里的内容是注释\n2    ''' 使用 3 个单引号开始注释\n3       \
    \ 可以进行多行注释\n4        再使用 3 个单引号结束注释'''\n5    \"\"\"使用 3 个双引号开始注释\n6        可以进行多行注释\n\
    7        再使用 3 个双引号结束注释内容\"\"\"\n```\n\n## 使用 Python 库\n\n在 Python 中，有大量方便的函数可供使用，实现包括屏幕显示、操作文件、数学运算、计算时间、网络数据处理、图形界面等功能。为了方便管理和使用，开发人员把它们分成了很多组，也就是**Python\
    \ 库**。Python 语言自带的库又称为**标准库**。在 Python 语言中，库一般是以**包**的形式组织的，每个包中有多个**模块**，模块中有不同的**函数**。如果觉得比较复杂，你暂时可以把库、包和模块看成同样的东西。\n\
    \n想要使用功能丰富的 Python 库函数，必须先**导入相关的 Python 库**。\n\n比如，求绝对值是一种常见的数学运算，Python 标准库`math`中的`fabs()`函数就可以求出绝对值。使用`fabs()`要先导入`math`库。程序\
    \ 1.33 是使用绝对值函数`fabs()`最常见的做法。\n\n程序 1.33　使用`math`库中的绝对值函数`fabs()`\n\n```\n1 \
    \   import math\n2    x = math.fabs(-3)\n3    print(x)\n```\n\n使用`fabs()`时，还需要在前面加上`math.`，用于说明`fabs()`函数在`math`库中。\n\
    \n有时库的名字很长，使用不方便，你还可以给导入的库另起一个名字，也就是**别名**。程序 1.34 中的代码在导入`math`库时将它改名为`mt`。改名时要特别注意，不要引起混淆。\n\
    \n程序 1.34　给 math 库起别名\n\n```\n1    import math as mt\n2    x = mt.fabs(-3)\n3\
    \    print(x)\n```\n\n如果只使用少数几个函数，也可以只导入函数，而不导入整个库。下面的代码只导入了`fabs()`函数，没有导入`math`库中的其他函数。在这种情况下，你可以直接使用被导入的函数，不需要带上库名前缀，如程序\
    \ 1.35 所示。\n\n程序 1.35　直接导入库中函数\n\n```\n1    from math import fabs\n2    x = fabs(-3)\n\
    3    print(x)\n```\n\n使用`as`起别名对于函数来说同样有效，如程序 1.36 所示。\n\n程序 1.36　函数别名\n\n```\n\
    1    from math import fabs as jueduizhi\n2    x = jueduizhi(-3)\n3    print(x)\n\
    ```\n\n## 第三方库\n\nPython 的标准库虽然功能强大，但也不是万能的。为了弥补标准库的不足，很多程序员也会把他们编写的各种功能、函数写成库，并共享出来，这就是**第三方库**。\n\
    \n使用第三方库的代码和使用标准库没有什么不同。不过，第三方库不是 Python 语言自带的，所以使用前要先进行安装。\n\n对于不同的 Python 开发工具和操作系统，安装第三方库的方式有一些区别。下面我们介绍如何对原生\
    \ Python 的 IDLE 和 Thonny 安装第三方库。注意，**如果你同时安装了这两种开发工具，用两种方式安装的第三方库不能给对方使用，必须各自安装。**\n\
    \n### 使用 Python 自带的 IDLE 工具编写程序\n\n如果使用 IDLE 编写 Python，那么最方便的当属利用`pip`命令进行安装。`pip`是\
    \ Python 自带的一个库管理工具，它可以自动从网络上下载你需要的 Python 库进行安装。大多数 Python 库都可以利用`pip`安装。\n\n\
    `pip`需要在命令行模式下输入命令来使用，这听起来好像有点陌生，但其实一点都不难。要使用`pip`，首先要**连接网络**。\n\n在**Windows\
    \ 系统**下，同时按住键盘上的**Windows 图标键**和**R 键**（后面记为 Windows + R），即可打开**运行窗口**。在运行窗口输入“`cmd`”，然后单击“确定”按钮，如图\
    \ 1-49 所示。\n\n这样就可以打开**命令提示符窗口（也称为命令行窗口）**，如图 1-50 所示。\n\n![](img/1-49.png)\n\n\
    图 1-49　运行窗口\n\n![](img/1-50.png)\n\n图 1-50　命令提示符窗口\n\n在命令提示符窗口中输入命令，再按下 Enter\
    \ 键，就可以安装 Python 库了。注意，**`pip`必须在联网的情况下使用**。\n\n```\npip install 库名\n```\n\n例如，我们会使用`requests`库，就需要在命令提示符窗口输入以下命令：\n\
    \n```\npip install requests\n```\n\n然后，按 Enter 键，如图 1-51 所示。\n\n![](img/1-51.png)\n\
    \n图 1-51　输入 pip 命令\n\n安装成功后，一般会提示`Successfully installed+库名`，如图 1-52 所示。\n\n![](img/1-52.png)\n\
    \n图 1-52　安装成功\n\n另外，如果你看到了和图 1-52 中内容类似的黄色提示，说明`pip`版本不是最新版，可以通过如下命令进行升级：\n\n\
    ```\npip install --upgrade pip\n```\n\n如果要卸载一个安装好的 Python 第三方库，只需要把安装时的`install`改成`uninstall`就可以了。\n\
    \n在**Windows 10 系统**下，你也可以通过依次选择“开始”菜单 →“Windows 系统”→“命令提示符”来打开命令提示符窗口，如图 1-53\
    \ 所示。\n\n![](img/1-53.png)\n\n图 1-53　Windows 10“开始”菜单中的“命令提示符”\n\n如果你使用的是**macOS\
    \ 系统**，那么可以同时按下 Command 键+空格键，打开“聚焦搜索”，然后输入“terminal”，打开“终端”，再输入相应的`pip`命令。你也可以通过“启动台”→“其他”→“终端”打开终端窗口。\n\
    \n### 使用 Thonny 编写 Python\n\n如果你使用的是 Thonny，那么必须使用 Thonny 的**包管理**功能来安装第三方库。打开\
    \ Thonny，在**联网**的情况下，依次选择菜单栏中的**“工具”→“管理包”**，如图 1-54 所示。\n\n![](img/1-54.png)\n\
    \n图 1-54　Thonny 的包管理功能\n\n输入想要安装的包“`requests`”，然后单击**“Search on PyPI”**按钮，得到图\
    \ 1-55 所示的结果。在得到的结果中，选择想要安装的包，也就是第一个选项。\n\n![](img/1-55.png)\n\n图 1-55　搜索 requests\
    \ 的结果\n\n选中后单击**“安装”按钮**，如图 1-56 所示，如果没有提示失败，就说明安装成功了。安装成功后，“安装”会变成“升级”和“卸载”。\n\
    \n![](img/1-56.png)\n\n图 1-56　准备安装 requests 包\n\n## 趣闻\n\n为什么编程语言都是英语，有没有中文编程语言？\n\
    \n如果你对编程语言有些了解，也许会好奇为什么编程语言都是英语。Python 语言中的`if`、`while`、`print`，都是用英文字母、英文单词写就的。这对于很多英语不熟练的同学确实是不太友好，那么能不能用汉语来写程序呢？\n\
    \n首先我们要纠正一个说法，虽然**编程语言借用了英文字母，但是它并不是英语**，而是独立的编程语言，符合编程语言的语法规则。其实在很多程序语言中，我们也确实可以使用汉字。但同样地，我们不能说这是在用中文写程序。\n\
    \n在 Python 中，你可以使用汉字作为变量名或者函数名。比如下面的程序是可以运行的：\n\n```\n>>> 核桃 = 1\n>>> 编程 = 2\n\
    >>> print(核桃 + 编程)\n3\n```\n\n不过，在真正编写程序时，一般不建议使用中文变量名。Python 语言中的各种符号必须使用英文符号，如果写程序时夹杂了中文变量名，那么很容易出现忘记切换输入法，不小心输入中文符号的情况，导致程序出错。\n\
    \n不过，完全使用汉字和中文符号的编程语言也是存在的，比如有一门叫作“易语言”的编程语言就是这样的。不过，这门语言存在一些问题，所以使用它的专业程序员并不多。\n\
    \n除了“易语言”，2019 年还有人发明了一门用文言文编程的程序语言“文言编程”，也很有意思。比如，下面这段程序的效果是输出 3 遍“問天地好在。”\n\n\
    ```\n吾有一數。曰三。名之曰「甲」。\n為是「甲」遍。\n吾有一言。曰「「問天地好在。」」。書之。\n云云。\n```\n\n### 读者服务：\n\n\
    ![](img/wxfwh.png)\n\n微信扫码关注【异步社区】微信公众号，回复“e59088”获取本书配套资源以及异步社区 15 天 VIP 会员卡，近千本电子书免费畅读。\n\
    \n# 人工智能的养料——数据\n\n![](img/tz.png)桃子：禾木，你写这么多数字干什么？\n\n![](img/hm.png)禾木：不是说训练人工智能需要数据吗？我在准备数据呢！\n\
    \n![](img/xht.png)小核桃：哈哈，数据和数字可不是一回事。数据既可能是数字，也可能是其他形式的内容。下面我们就一起来看看，到底什么才是数据，我们可以从哪里获得数据。\n\
    \n![](img/zd.png)\n\n## 什么是数据\n\n**数据**这个词，你应该听过。用手机上网，会耗费数据流量；评价一部电影好不好看，我们会关注票房数据、评分数据；在网上买东西，销量数据就成了重要的参考标准。我们常说，现在是数据的时代，生活的方方面面都和数据有关。\n\
    \n那么，数据到底是什么？“数据”和“数字”有什么关系？**数据是指进行各种统计、计算、科学研究或技术设计等所依据的数值。**由此可见，数据通常是指数字，比如电影评分、商品销量等。此外，像每天的气温、苹果的价格、期末考试的分数、每天写作业的时间都是数据，在计算机领域，**数据是客观事物的符号表示**，是指所有能输入计算机中并被计算机程序处理的符号的总称。也就是说，数据不一定是数字，一张照片、一段声音同样可以是数据。\n\
    \n还有一个词常常和数据一起出现，那就是信息。信息论的创始人克劳德·香农认为，**信息是用来消除不确定性的东西**。这是什么意思？其实就是信息让你可以对事物有更多的了解。举个例子，你听说禾木参加编程比赛拿了奖，但是不知道到底拿了什么奖，这就是不确定性。小核桃告诉你“禾木得了一等奖”，那么得什么奖这个不确定性就消失了，所以“禾木得了一等奖”就是信息。桃子也来告诉你“禾木是在编程比赛上得的奖”，但这个内容其实你已经知道了，所以对你来说，这不是信息。但是无论是小核桃说的，还是桃子说的，都可以视为数据，如图\
    \ 2-1 所示。如果数据量非常非常大，那么就是新闻中常常提到的**大数据**了。\n\n![](img/2-1.jpg)\n\n图 2-1　信息消除不确定性\n\
    \n## 数据是从哪里来的\n\n获取有用的数据最直接的方法就是对相关内容进行观察并加以总结和记录。比如，想要得到一棵树上苹果的数量，认真数一数就可以获取这一数据；想要知道每天的气温，用温度计进行测量就可以获取这一数据。\n\
    \n不过，生活中需要数据的地方实在是太多了，如果所有数据都要亲自来记录，那得多麻烦啊。为此，科学家们发明了各种各样的**电子传感器**，来帮助我们获取数据。传感器可以感知环境的变化，将其和计算机配合使用，就可以自动记录数据了。\n\
    \n我们日常使用的手机内部就有很多传感器。比如屏幕的亮度可以跟随周围环境自动变化，就是因为光线传感器能感知明暗；很多手机有指南针功能，是因为手机内有**磁场传感器**或者**霍尔传感器**，可以像真正的指南针一样感知地球磁场；就连视频聊天时也会用到传感器——**声音传感器**和**图像传感器**，只不过我们一般会把它们称为**麦克风**和**摄像头**。\n\
    \n如今，我们的周围有非常多的传感器，甚至在浩瀚无垠的宇宙中，也有卫星或者探测器搭载着传感器在工作，如图 2-2 所示。截至目前，全世界已经有 2.6 万余种传感器，可以说无论你想获取什么数据，几乎都可以找到相应的传感器。\n\
    \n![](img/2-2.jpg)\n\n图 2-2　无论深海还是太空都有很多传感器\n\n我们使用手机、计算机的过程时刻都在产生数据。你为了使用各种网络服务所填写的内容是数据，在微博、朋友圈之类的社交平台发出的每一条文字、每一张照片是数据，甚至在网络上的每一次点击、看过的每一条内容也是数据。\n\
    \n不过无论是用传感器获取的数据，还是在使用网络时产生的数据，大多很难直接发挥作用。随着计算机技术的进步，数据的传递和收集变得容易多了。为了方便使用和研究，人们把很多数据，比如美国的天气、月球的地形等，合并成数据集并放在了互联网上，可供他人分享。\n\
    \n还记得我们在《写给青少年的人工智能 应用》一书中说过的**ImageNet**吗？**ImageNet**是由华裔科学家李飞飞带领团队创建的庞大**图片数据集**，用于图像识别人工智能的研究。目前这个图片数据集中有近\
    \ 1500 万张标注好分类的图片，包含 2 万多种不同的物体。类似的数据库还有很多，比如同样是用于人工智能研究的**MNIST 数据集**，它是大型手写数字数据集，包含\
    \ 7 万余个不同的手写数字。\n\n对天文知识感兴趣的同学可以从**探月工程数据发布与信息服务系统**获取嫦娥月球探测器发回的月球数据，或者从**美国宇航局（NASA）的数据网站**获得丰富的天文相关数据。\n\
    \n不过，在大多数时候，互联网上的数据并不是像 ImageNet 或者 MNIST 数据集那样整理好的。想要获取大量的数据还是非常费时费力的，所以我们往往会借助工具，其中之一就是网络爬虫。\n\
    \n## 网络爬虫是什么虫\n\n**网络爬虫**又称为**网络蜘蛛**，它并不是一种动物，而是一种计算机程序。网络爬虫的作用很简单，就是在互联网上不停地浏览各种信息，并把你想要获取的内容记录下来。爬虫就像蜘蛛一样，一点点巡视互联网这张大网的每一个角落，如图\
    \ 2-3 所示。\n\n利用爬虫，我们可以为人工智能和搜索引擎提供数据，可以做很多有趣的事。比如通过爬虫获取你感兴趣的各种新闻，然后统一发送，这样你就不需要在各个新闻网站反复查找；用爬虫获取天气预报数据，一旦预报下雨就马上将提醒发送到手机上，这样就不再需要每天关注天气了；在网站上看到很多有意思的图片，但是一张张下载太麻烦了，也可以使用爬虫进行批量下载；在购物网站看到一本喜欢的书，但价格有点贵，与其每天查看优惠信息，不如用爬虫来帮你监测。\n\
    \n![](img/2-3.jpg)\n\n图 2-3　网络爬虫\n\n利用 Python 语言，我们就可以编写简单的网络爬虫。\n\n## 通过分析网页获取数据\n\
    \nPython 是编写网络爬虫的有力工具。下面我们就一起动手实现最简单的网络爬虫。\n\n如果你喜欢天文，一定对火星并不陌生。这颗红色的行星与地球一样，位于太阳系的宜居带。还有资料表明，火星曾拥有类似地球的环境与极丰富的资源。正因如此，火星成了科学家们研究的重点。在过去的几十年里，人类已经向火星发射了很多探测器，拍摄了大量照片。\n\
