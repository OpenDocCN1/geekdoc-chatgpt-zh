    我们在排序过程中使用了`Numpy`库中的`argsort()`函数，而没有使用 Python 自带的`sorted()`函数。`argsort()`函数不是直接返回排好的数值，而是返回原来排好后数字所对应的序号（索引值）。比如，对于`[2,
    3, 1]`这个列表，排序后数字 1 会排在第一位，而它在原列表中的序号是 2；第二位的数字是 2，它的序号是 0；第三位数字是 3，序号是 1。所以，`argsort([2,
    3, 1])`的结果是`[2, 0, 1]`，如图 3-15 所示。


