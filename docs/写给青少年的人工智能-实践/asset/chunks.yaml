    **内容总策划：**曾鹏轩 王宇航


    **执行主编**：庄 淼 丁倩玮 陈佳红 孔熹峻


    **插 画 师：**闫佩瑶 林方彪 黄昱鑫 王晶宇


    # 致小读者


    小读者们，大家好！我是“核桃编程”的宇航老师。提到“人工智能”（AI），你会想到什么呢？是能听懂你说话的智能音箱语音助手，还是能打败围棋世界冠军的 AlphaGo？是无人驾驶汽车，还是科幻电影里的超能机器人？相信你一定会浮想联翩。人工智能已经渗入我们生活、学习中的方方面面。


    为什么这些各不相同的东西都叫作“人工智能”？在《写给青少年的人工智能 起源》一书中，我们探讨了“什么是人工智能”，并沿着人类使用工具的历史，回顾了原始工具以及人工智能的开端——达特茅斯会议，细数了近几十年来人工智能领域的重要发明创造。


    那么，科学家们又是怎样研究出这些人工智能产品的呢？在《写给青少年的人工智能　发展》一书中，我们仿佛“进入”了科学家的大脑，沿着他们研究问题的思路，“亲身经历”了人工智能发展的过程，并最终了解了几种常用的研究人工智能的思路：让机器学会推理，用机器构建大脑，让机器适应环境，等等。


    经过几十年的努力，科学家们“八仙过海，各显神通”，研究出了各种各样的人工智能产品，将人工智能技术应用到了生活、医疗、艺术、农业、商业等领域。在《写给青少年的人工智能
    应用》一书中，我们选取人工智能在各行各业典型而有趣的应用，让你了解现在的人工智能到底“智能”到了什么程度、“智能”体现在了哪些方面。


    到这里，你应该对人工智能的起源、发展和应用有了一定的了解，有没有一种跃跃欲试想要参与其中的想法呢？别急，本书会带你动手试一试，引导你试着开发一些属于自己的人工智能程序，让你从实践中体会其奥妙。


    最后，还要告诉你一件好玩儿的事。为了让小读者读得懂、喜欢读，我们把人工智能科学中不好理解的名词和概念，尽可能用形象的比喻或者贴近生活的类比加以解释，把抽象的知识点用风趣幽默的手绘插画加以诠释。插画中的这些角色可都是“核桃世界”的动漫明星呦，快去和他们打个招呼吧！


    ![](img/zd1.jpg)


    小读者们，快来开启你的人工智能启蒙之旅吧！


    核桃编程联合创始人　王宇航


    # 人工智能的身体


    ![](img/hm.png)禾木：小核桃，快快快，我们开始创造人工智能吧！我要创造一个能认出我的人工智能！


    ![](img/tz.png)桃子：我也要！我要创造一个有艺术气息、能写诗的人工智能！


    ![](img/xht.png)小核桃：好啊，不过别着急，在真正创造人工智能之前，我们必须先做一些准备工作。计算机的智能来自人类的指令，因此我们必须学会如何给计算机下达命令。


    ![](img/zd.png)


    ## 什么是编程语言


    为什么冷冰冰的机器能够按照人类的想法工作，甚至变成聪明的人工智能？相信读过前三册书的同学心里一定已经有了答案。不是因为机器聪明，而是因为人类把每一步要做什么都写成一条条指令，“告诉”了计算机。计算机只要根据指令按部就班地去执行、去计算，就可以表现得“机智过人”。对于这些告诉计算机该怎么做的指令，我们称之为**计算机程序**，即通常所说的**代码**。计算机程序就是把计算机需要做的事一步步地精确描述出来。编写程序，或者说编程、写代码，就是在给计算机下达命令。


    我们平时在计算机、手机等硬件载体上使用的各种软件、App 或者聪明、强大的人工智能程序，都是通过编程实现的。也可以说，**程序代码构成了人工智能软件产品的“身体”**。


    如果给这些软件穿上机械的外衣，用软件控制各种机器，就有了扫地机器人、无人驾驶汽车等人工智能硬件产品。


    总而言之，掌握编程是创造人工智能产品不可或缺的技能。


    不过，计算机可不懂人类的话。想要让计算机理解人类的指令，必须使用计算机的语言，也就是**程序语言**。


    人类的语言有汉语、英语、日语、法语等，计算机的语言同样种类繁多。你可能听说过**C 语言、Java 语言、C++语言**，这些都是很热门的程序语言，如图 1-1
    所示。


    ![](img/1-1.jpg)


    图 1-1　与人类的语言一样，计算机语言也是种类多样的


    这些语言具有不同的特点，适用于不同的场合。比如，C 语言和 C++语言，它们的特点是性能很强。用 C 语言和 C++语言写成的程序，运行时效率非常高。但是要把这两种语言用好可不是一件容易的事，不仅编写起来麻烦，还容易出错。Java
    语言虽然性能稍微弱一点，但使用起来很方便，更重要的是，Java 语言写成的程序可以很方便地在计算机、手机等不同的平台之间迁移。


    Python 同样是一门程序语言，使用非常方便，很受欢迎。表 1-1 展示了一些常用的编程语言，包括很多同学听说过甚至学过的**Python 语言**。


    表 1-1　2021 年 8 月流行度排名前五的编程语言


    | 排名 || 编程语言 || 流行度 || 对比上月 |

    | --- | --- | --- | --- |

    | 1 || C || 12.57% || ↑0.95% |

    | 2 || Python || 11.86% || ↓0.91% |

    | 3 || Java || 10.43% || ↓0.74% |

    | 4 || C++ || 7.36% || ↓0.65% |

    | 5 || C# || 5.14% || ↑0.31% |


    ## 什么是 Python 语言


    Python 的发明者是一位荷兰籍程序员，名叫吉多·范罗苏姆（Guido van Rossum）。他曾在荷兰数学和计算机科学研究学会工作。1989 年 12
    月，范罗苏姆思考一个问题：该干点什么来度过长达一周的圣诞节假期呢？他思来想去，决定开发一种新的程序语言！它就是 Python。当然，想在一周之内完成这么复杂的任务，确实不太可能，假期结束后，范罗苏姆继续为此努力，并在
    1991 年以开源形式发布了 Python 的最初版本（Python 0.9.0）。2021 年 8 月，Python 语言 3.10 版本基本上开发完成，有成千上万名优秀的程序员参与了这个项目，为它做贡献。


    趣闻　什么是开源？


    “开源”是“开放源代码”的简称。对于常见的大部分软件，我们只有使用权，但是并不知道内部的程序代码是如何编写的——这种软件称为闭源软件。有些程序员写好软件之后，乐于公开源代码，既能让所有人都了解软件的运行原理，也能让更多的人和他合作，一起让软件变得更好用——这种软件就是开源软件。计算机领域得以飞速发展，一个重要的因素就是有无数愿意投身开源活动的程序员。很多非常重要的软件、方法都是在开源活动中诞生的。


    Python 这个单词的原意是“大蟒蛇”，之所以选择这个名字，不是因为范罗苏姆希望这门新语言会像大蟒蛇一样强壮、有力，而是因为他特别喜欢看一部名为《巨蟒剧团之飞翔的马戏团》的电视剧。


    ## Python 对人工智能有什么好处


    Python 语言非常简洁、方便。与大名鼎鼎的 C 语言相比，C 语言要求程序员改变人的思维去适应计算机，而 Python 正好相反，**这门语言非常贴近于人的思维习惯**。好的
    Python 程序就像一个极其严谨的人（用英语）在说话，因此非常容易理解。简言之，使用 Python 语言可以让你集中精力解决问题，而不是费劲地琢磨写程序的规则。这也是为什么
    Python 在人工智能领域这么流行——实现人工智能本来就已经很难了，当然要在写代码上省点力了。


    不过，Python 语言也有一些缺点，比如用 Python 写成的程序运行起来往往会慢一些。而人工智能通常需要进行大量计算，所以我们会希望程序运行得更快。好在
    Python 语言还有另一个优点，**它可以很方便地调用以其他语言写就的程序段**。我们可以先把计算量非常大、需要快速运行的部分用性能更强的 C 语言等写好，然后使用
    Python 写出总体结构，对 C 语言模块进行调用，这样就能既写得快，又算得快了！因为这个特点，Python 被戏称为“**胶水语言**”，就好像用胶水把各种零件迅速、方便地粘起来，如图
    1-2 所示。


    ![](img/1-2.jpg)


    图 1-2　Python 被戏称为“胶水语言”


    由于 Python 简单好用，在人工智能领域，已经有非常多的人为 Python 这瓶“胶水”写了很多好用的“零件”（我们通常将其称为**Python 库**），并遵循开源精神把它们分享出来，让更多的人一起使用。这也让
    Python 变得更加好用了。


    趣闻　Python 之禅


    另一位对 Python 语言的开发做出很大贡献的程序员蒂姆·彼得斯（Tim Peters）写了一首小诗来描述 Python 语言写成的程序应该是什么样的。


    **Python 之禅**


    优美而不丑陋，


    明了而不隐晦，


    简单而不复杂，


    复杂而不凌乱，


    扁平而不嵌套，


    稀疏而不稠密，


    可读性很重要，


    即使实用比纯粹更优，


    特例亦不可违背原则。


    错误绝不能悄悄忽略，


    除非它明确需要如此。


    面对不确定性，


    拒绝妄加猜测。


    任何问题应有一种，


    且最好只有一种，


    显而易见的解决方法。


    除非你是荷兰人，否则这方法一开始并非如此直观。


    做总比不做强，


    但是冒失去做还不如不做。


    很难解释的，必然是坏方法。


    很好解释的，可能是好方法。


    命名空间是个绝妙的主意——我们应好好利用它！


    **The Zen of Python**


    Beautiful is better than ugly.


    Explicit is better than implicit.


    Simple is better than complex.


    Complex is better than complicated.


    Flat is better than nested.


    Sparse is better than dense.


    Readability counts.


    Special cases aren’t special enough to break the rules.


    Although practicality beats purity.


    Errors should never pass silently.


    Unless explicitly silenced.


    In the face of ambiguity,


    refuse the temptation to guess.


    There should be one——and preferably only one——obvious way to do it.


    Although that way may not be obvious at first unless you’re Dutch.


    Now is better than never.


    Although never is often better than \*right\* now.


    If the implementation is hard to explain, it’s a bad idea.


    If the implementation is easy to explain, it may be a good idea.


    Namespaces are one honking great idea —— let’s do more of those!


    ## Python 安装


    要编写 Python 程序，首先需要安装 Python，并安装合适的开发工具。这里我们介绍两种常用方式：第一，直接安装原生 Python，并利用 Python
    自带的**IDLE**开发工具进行编程；第二，使用集成开发环境**Thonny**。


    Python 软件的安装与操作系统有关，在使用时，部分情况也会根据操作系统有所不同。在本书中，我们主要以 Windows 10 系统为例进行介绍，也会提及
    macOS 或其他系统。


    ### 直接下载安装 Python

