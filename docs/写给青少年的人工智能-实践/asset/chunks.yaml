    ### 添加图像信息


    使用`plot()`函数绘制的图像实在太简单了。我们既不知道两条曲线是什么意思，也不知道横、纵坐标分别代表什么。为了让信息更明确，我们需要为图像添加**图例**和**坐标轴标签**。


    添加图例需要两步操作。首先，在绘制曲线时，为`plot()`函数增加`label`参数；其次，在`show()`函数之前添加`legend()`函数。


    添加坐标轴标签需要用到两个函数，即横坐标标签`xlabel()`和纵坐标轴标签`ylabel()`。这两个函数的使用方法非常简单，只需要将字符串作为函数参数即可。


    所以，我们在程序2.7中`plt.show()`之前（如第33行）添加以下5行代码：


    ```

    plt.xlabel("日期")

    plt.ylabel("气温(℃)")

    plt.plot(date,saijia_temp, label=''赛加市气温'')

    plt.plot(date,zhongxin_temp, label=''中心城气温'')

    plt.legend()

    ```


    不过当我们运行程序，却发现图中的“日期”“气温”两处汉字都变成了方框。这是因为matplotlib中使用的默认字体无法显示中文，所以需要**修改默认字体**。


    在程序2.7的开头导入`matplotlib.pyplot`后（如第31行），添加如下代码：


    ```

    plt.rcParams[''font.sans-serif'']=[''SimHei'']

    plt.rcParams[''axes.unicode_minus'']=False

    ```


    如果你用的是macOS系统，那么代码要改为：


    ```

    plt.rcParams[''font.sans-serif'']=[''Arial Unicode MS'']

    ```


    这样就可以在matplotlib绘制的图像中显示中文了，如图2-14所示。


    注意：输入中文后，在输入代码时一定不要忘记切换成英文状态。


