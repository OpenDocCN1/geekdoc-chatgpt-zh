    # 智慧的核心——算法


    ![](Images/hm.png)禾木：这道数学题太难了，我做了那么多计算，还是没做出来。不过，这些计算比起人工智能要处理的大数据可少多了。幸亏有计算机，才能处理这么多数据。


    ![](Images/tz.png)桃子：计算机确实很厉害，不过禾木，你的方法好像不对。明明只需要一半的计算量就可以得到答案的。


    ![](Images/xht.png)小核桃：其实人工智能处理数据也像做题一样。有好的方法，也有不好的方法；有简单的方法，也有复杂的方法。这些分析处理数据的不同方法是人类智慧的结晶，我们也可以把它们称为“算法”。人类总结出的算法，正是构成人工智能智慧的核心。


    ![](Images/zd.png)


    ## 什么是算法


    不管做什么事，都需要经过特定的步骤。比如，你想煮面条，可能需要经过图3-1所示的步骤。在烹饪时，我们这样的步骤称为**工序**，而在计算机、编程领域，我们通常称之为**算法**。**算法就是用计算机解决问题的方法、步骤**。想要用计算机实现人工智能，就要让计算机学会各种问题的解决方法，也就离不开各种各样的算法。


    ![](Images/3-1.jpg)


    图3-1　煮面的步骤：①向锅内添水；②点火，等水沸腾；③放面条；④等待面条煮熟；⑤关火


    要解决不同的问题，需要使用不同的算法。即使针对同一个问题，可能也有不同的算法，而且不同的算法中，可能有的能快速解决问题，有的就会慢很多。在本章中，我们会一起了解几个简单的算法，领略算法的精妙之处。


    ## 二分法搜索


    禾木和桃子在玩猜数字游戏。禾木在心中想了1～100中的一个数字，让桃子去猜。桃子每猜一次，禾木就会告诉她猜的结果是大了还是小了，如图3-2所示。


    ![](Images/3-2.jpg)


    图3-2　猜数字游戏


    如果你来玩，会怎么猜呢？最简单的方法就是像图3-3这样从小到大一个一个地尝试。不过，这样实在是太慢了，万一禾木想的数字是100，那我们岂不是要猜100次才能猜中。


    ![](Images/3-3.jpg)


    图3-3　最简单的猜数字方法（从小到大一个一个地尝试）


    我们也可以大胆一点，每隔10个数猜一次，然后等禾木说“大了”，就找到了10位数，之后再猜个位就可以了，如图3-4所示。这样猜数字的效率就大幅提高了，最多我们只需要猜20次，就能找到目标。


    我们还可以随机猜，然后随时根据禾木的反馈调整。用这种方法，你有信心几次能猜中呢？


    这些不同的猜法，就是猜数字问题的不同算法。这些算法的效率有高有低，差距明显。


    ![](Images/3-4.jpg)


    图3-4　间隔10猜数字


    桃子想了一个好办法，最多只要7次就一定能猜中。你知道她是怎么做的吗？桃子的算法很简单：从1～100的中间数50开始猜，如果50大了，那么再猜1～50的中间数25；如果50小了，就猜另一半的中间数75。然后继续这样猜中间数（如果中间数是两个数字，就每次都选奇数或都选偶数），如图3-5所示。这样不断猜下去，每一次都能把猜的范围缩小一半，最终剩下唯一的数字，就是答案了。所以只需要3次，就可以猜到62。你可以随便找个数字试试，看看是不是最多7次就能猜中，想一想为什么。


    像猜数字这样从很多数据中找到特定数据的问题可以称为**搜索问题**。桃子用的方法是一种解决搜索问题时非常经典的算法，针对的是那些已经排好顺序的数据。在搜索时，这种方法会不断把搜索范围分成两部分，因此称为**二分法**。


    二分法是一种非常有效率的搜索算法。根据二分法的原理，我们可以很容易地得到结果。随着搜索次数的增加，二分法能搜索的范围是呈指数增长（范围*S* = 2*^n*）的，也就是说，即使把猜数字的范围扩大到100亿，使用二分法来查找也只不过需要34次就能猜到正确的结果。


    你可能觉得，猜数字只是一个游戏，能有什么用处呢？其实能用到二分法的搜索问题在生活中非常常见。


    ![](Images/3-5.jpg)


    图3-5　桃子的猜数字算法


    我们可以再设想这样一个场景：期末考试结束，老师给了你一沓试卷，请你帮忙找出考90分的同学。这些试卷已经整理过了，按照分数从小到大排列，并且每张试卷的分数都不同。聪明的你可能翻几下、扫一眼很快就能找到。可惜计算机没有扫一眼的功能，而且如果我们手里不是几十张试卷，而是几十万张呢？在大数据时代，几十万量级的数据只是小儿科而已。


    假设有10张试卷，分数分别是35、56、58、60、74、80、83、88、90和96。按照编程的习惯，我们给它们编号0～9。我们来看看如何使用二分法找到90分的试卷。


    我们先选择最中间的试卷，不过10是个偶数，中间有两个数，我们可以随意选择其中之一，这里选择较小的一个，也就是第5张试卷，编号为4，是74分。90比74大，说明90分试卷在编号4的右侧，也就是目标试卷是编号5～9中的一张，如图3-6所示。


    ![](Images/3-6.jpg)


    图3-6　90分的试卷在编号4的右侧


    我们现在选择后5张试卷的中间第8张试卷，编号7，是88分，那么90分试卷在88分试卷的右侧，这样只剩下两张试卷8号和9号了。


    两张试卷的中间没有其他试卷，我们仍选较小的那张，也就是编号8，刚好就是90分的试卷。这样我们通过3次判断，就找到了目标。如果我们一个一个地找，运气好的时候可能只要2次就能找到目标；可运气不好猜错了方向，就要9次才能找到目标。


    不过，像上面这样的思路，计算机是无法执行的。想要让计算机看懂算法，必须要用程序语言。如何把这个过程变成程序呢？如何用程序语言表达选择中间的试卷呢？


    程序3.1可以根据二分法的思想，从排好顺序的试卷中，找到你要找的试卷。运行程序后，程序会要求你输入想要查找的分数，按Enter键确认后，会得到它的位置。如果输入35，则会返回0。你可以在配套资源网站上找到写好的程序文件。


