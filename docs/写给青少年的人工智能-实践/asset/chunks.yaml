    如果我们能把隐藏在这些点中的直线确切地找出来，就可以根据父母的平均身高来预测孩子的大概身高了。那么，到底怎么才能找出这条直线呢？


    从大量数据中发现数据间的联系，找出比较准确的定量规律，在统计学上称为**回归分析**。这也是人工智能从数据中提取规律，进而做出一定预测的一种基础方法。如果找出的规律能用一条直线来代表，那就是**线性回归**。找到这条直线的过程，在人工智能领域就是训练模型。


    在数学上我们学过，直线可以用函数*y*\=*kx*+*b*来表示，满足这个公式的点(*x*,*y*)就是直线上的点，参数*k*和*b*可以确定这条直线是什么样子。在这个身高问题中，*x*就是父母的平均身高，*y*就是儿子的身高。只要求出*k*和*b*就能确定直线，并进一步根据给定的*x*预测出*y*。进行线性回归分析的一种基本方法称为**最小二乘法**。


    对于所有的数据点(*x*[i], *y[i]*)，可以通过以下最小二乘法算式计算：


    *k*\=![](Images/4.png)\=![](Images/5.png)


    *b*\= *y* − *kx*


    其中，字母上面的横线表示平均值，如*x*表示所有*x*的平均值，(*![](Images/6.png)*)表示每一组*xy*的平均值。


    我们将最小二乘法写成一个函数，如程序3.4所示。注意，**程序3.4只是一个函数，不能独立运行**。


    程序3.4　线性回归最小二乘法


    ```

    1    def LinearRegression(x, y):

    2        ave_x = sum(x) / len(x)     # 计算x的平均值

    3        ave_y = sum(y) / len(y)     # 计算y的平均值

    4        # 以下计算x*y和x**2的平均值

    5        ave_xy = 0

    6        ave_x2 = 0

    7        for i in range(0, len(x)):

    8            ave_xy = ave_xy + x[i] * y[i]  # 循环将所有x[i]*y[i]相加

    9            ave_x2 = ave_x2 + x[i] ** 2    # 循环将所有x[i]**2相加

    10       ave_xy = ave_xy / len(x)    # 将所有x*y的和除以个数，求平均值

    11       ave_x2 = ave_x2 / len(x)    # 将所有x**2的和除以个数，求平均值

    12       # 以下通过最小二乘法公式计算k和b

    13       k = (ave_xy - ave_x * ave_y) / (ave_x2 - ave_x ** 2)

    14       b = ave_y - k * ave_x

    15       return k, b

    ```


