    \n![](img/1-19.png)\n\n图 1-19　安装结束\n\n如果要取消安装，请单击图 1-18 中的“`Cancel`”按钮。安装完成后，Thonny\
    \ 的快捷方式图标会出现在桌面上，如图 1-20 所示。双击图标，就可以进入 Thonny 编写 Python 程序了。\n\n![](img/1-20.png)\n\
    \n图 1-20　Thonny 的快捷方式图标\n\nThonny 的界面并不复杂。除了上文提到的菜单和按钮，界面主要分为 3 个部分。我们现在主要关注图\
    \ 1-21 所示的**“Shell”区域**：它和前面介绍的 IDLE 主界面作用相同，都是**交互模式**。你可以在这里输入代码，按“`Enter`”键就可以马上得到结果。\n\
