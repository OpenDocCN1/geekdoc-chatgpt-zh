    \n单击“调试”按钮，即可调试当前脚本。**调试又称为Debug**，也是编写程序时的一项重要内容，可以帮你找出程序中的错误。双击某一行的行号位置，你会看到行号后面显示一个红点，如图1-42所示，这表示在此行设置了断点。\n\
    \n![](Images/1-42.png)\n\n图1-42　在Thonny中设置断点\n\n如果程序使用调试模式运行，就会在断点位置暂停（执行这一行之前）。暂停后，你可以观察变量窗口的数据，或者在“Shell”区域执行相关命令，以观察运行时的数据是否符合自己的预期，如图1-43所示。\n\
