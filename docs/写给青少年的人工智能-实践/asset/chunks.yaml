    3    print(sys.version_info)\n```\n\n执行结果大致如下：\n\n```\n3.7.9 (tags/v3.7.9:13c94747c7,\
    \ Aug 17 2020, 18:01:55) [MSC v.1900 32 bit (Intel)]\n('32bit', 'WindowsPE')\n\
    ```\n\n其中，`3.7.9`就是 Python 的版本号，`32 bit`表示 32 位。你可以根据自己计算机上显示的结果来进行判断。\n\n在 Thonny\
