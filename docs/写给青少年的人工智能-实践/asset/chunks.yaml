    那么，如何判断这个水果是橘子还是橙子呢？我们可以根据在坐标轴中这个新水果周围都是什么水果来判断。如果这个水果四周橘子较多，那么它很可能也是橘子。这种方法就是**K
    最近邻算法，简称 KNN 算法**。在图像识别、推荐系统、文本分类等方面的人工智能中，都有 K 最近邻算法的身影。


    K 最近邻算法可以分为下面 3 个步骤。


    第一步，获取合适的训练数据。这就是我们前面做的，找到足够数量的橘子和橙子，并给它们的大小和圆度打分。K 最近邻算法在人工智能中属于**监督学习**算法，需要人类在输入数据时给数据打标签，也就是要告诉人工智能程序每一组（大小，圆度）的得分数据对应的是橘子还是橙子，来让程序进行学习。


    第二步，输入我们想要进行分类的新数据，计算它和每一个数据点之间的距离。既然我们把数据点画在了坐标系上，就可以使用平面上的点距离公式来计算，即


