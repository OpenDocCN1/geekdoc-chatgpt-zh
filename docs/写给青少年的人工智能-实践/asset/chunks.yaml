    ## 利用网站 API 获取数据


    分析网页数据是编写爬虫最基本的方法，也是最通用的方法。不过为了方便阅读，程序员在网页代码中添加了很多数据以外的内容，这样一来，想要分析网页实在是太烦琐了。


    有没有专门为了计算机设计，可以让计算机直接读取的网页呢？有些网站会把部分数据整理好，放在某个地址来供自己和其他人直接调用获取，非常方便。这个提供数据的地址就称为网站的应用程序接口，简称
    API。有了 API，我们要获取数据就容易多了。


    下面我们就一起来通过 API 爬虫获取核桃世界的两个城市（赛加市和中心城）的天气数据。


    在浏览器的地址栏中输入一个 URL 网址，例如打开本书的教学网页核桃天气，就可以查看赛加市在 2021 年 7 月 14 日至 2021 年 7 月 20
    日期间的天气了。单击位于界面顶部的“导航栏”标签，就可以切换到中心城的天气数据，如图 2-12 所示。


    通过网页分析工具可以看到，这两个页面上的数据非常琐碎，想要通过分析网页来编写爬虫有一定的难度。如果已经设计了 API，通过网址，我们就可以使用 API 了。


    ![](img/2-12.png)


    图 2-12 天气预报教学网页


    我们依然通过`requests.get()`函数从 API 获取数据。这个 API 中的数据是用 JSON 格式保存的。这是一种在互联网上非常常见的数据格式，用于存储简单的数据结构和对象。JSON
    格式的数据与 Python 中的字典基本相同。使用`requests`库中的`json()`函数，就可以把 JSON 数据直接转化为 Python 字典。


    ### 程序 2.5 从 API 获取数据并转化为字典


    ```

    1    import requests

    2    url = ''▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓''

    3    r = requests.get(url)

    4    r.encoding = ''utf-8''                        # 设置编码

    5    saijia_date = r.json()

    6    print(saijia_date)

    ```


    为了方便阅读，我们将字典数据整理一下。


    ```

    1    {

    2        "location": {

    3            "city": "赛加市",

    4            "id": "0001"

    5        },

    6        "now": {

    7            "temp": 27,

    8            "wind_class": "微风",

    9            "wind_dir": "东风",

    10           "text": "多云"

    11       },

    12       "forecasts": [{

    13           "date": "2021-07-14",

    14           "high": 33,

    15           "low": 24,

    16           "wc_day": "微风",

    17           "wc_night": "微风",

    18           "wd_day": "东风",

    19           "wd_night": "东风",

    20           "text_day": "多云",

    21           "text_night": "晴"

    22       },

    23   ……后 6 天内容略]

    24   }

    ```


    显然，这个字典中有 3 组键值，分别是`"location"`所在地、`"now"`当前天气和`"forecasts"`未来 7 天的天气预报。


    我们重点关注的是未来 7 天的天气预报。它的值是一个有 7 个元素的列表，每个元素对应着一天的天气内容。例如，第 13～21 行就是第一天的天气数据（第 0
    个元素）。由于数据太长，这里已将列表的后 6 个元素（后 6 天的天气）省略。


    天气内容也是用字典表示的，每个键的含义如表 2-1 所示。


    表 2-1 天气内容的字典表示


    | 代码 || 含义 |


    | --- | --- |


    | `"date": "2021-07-14",` || 日期 |


    | `"high": 33,` || 最高气温 |


    | `"low": 24,` || 最低气温 |


    | `"wc_day": "微风",` || 白天风力 |


    | `"wc_night": "微风",` || 夜晚风力 |


    | `"wd_day": "东风",` || 白天风向 |


    | `"wd_night": "东风",` || 夜晚风向 |


    | `"text_day": "多云",` || 白天天气 |


    | `"text_night": "晴"` || 夜晚天气 |


    通过访问字典和列表的内容，我们可以自由使用任意一天的数据。例如，下面这一句命令对应的就是第二天的最高气温：


    ```

    temp = date["forecasts"][1]["high"]

    ```


    提供各种 API 的网站有很多，像百度、高德等公司就有很多地图、交通、天气相关的 API 服务，只要注册后就可以免费或付费使用。


    ## 分析和处理数据


    利用爬虫获得的天气信息，我们可以分析两个城市的气温变化情况。爬虫获取到的每天温度是两个值——最高气温和最低气温。为了分析方便，我们可以先根据这两个数值计算每天的平均气温。


    如程序 2.6 所示，我们会利用爬虫获取两个城市的数据，把每个城市每天的最高气温和最低气温相加除以 2 求取平均值，并分别存储在列表中。这段程序还获取了这
    7 天数据的具体日期，并将其保存在列表中。


    ### 程序 2.6 爬取并计算平均气温

    '
  toc: []
- raw: '```

    1    import requests

    2    url_saijia = ''▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓''

    3    url_zhongxin = ''▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓''

    4

    5    # 获取赛加市数据

    6    r = requests.get(url_saijia)

    7    r.encoding = ''utf-8''                       # 设置编码方式

    8    saijia_data = r.json()

    9

    10   # 获取中心城数据

    11   r = requests.get(url_zhongxin)

    12   r.encoding = ''utf-8''                       # 设置编码方式

    13   zhongxin_data = r.json()

    14

    15   # 使用函数获取平均气温

    16   def get_temp(data):

    17       temp = []

    18       forecasts = data["forecasts"]          # 提取预报数据

    19       for day in range(len(forecasts)):      # 对每天循环

    20           ave=(forecasts[day]["high"]+forecasts[day]["low"])/2 #求平均

    21           temp.Append(ave)                   # 存入列表

    22       return temp

    23

    24   saijia_temp = get_temp(saijia_data)        # 赛加市未来一周平均气温

    25   zhongxin_temp = get_temp(zhongxin_data)    # 中心城未来一周平均气温

    26   # 获取日期

    27   date = []

    28   for day in range(7):

    29       date.Append(saijia_data["forecasts"][day]["date"])

    ```


    ### 绘制数据图


    有了平均气温，我们就可以**绘制数据图**了。我们需要用到**matplotlib库**——这也是一个第三方库，请自行安装。


    如果你用的是原生Python + IDLE，请在命令行窗口执行如下命令：


    ```

    pip install matplotlib

    ```


    使用Thonny的同学需要在“包管理”窗口中搜索matplotlib，然后安装。


    将数据绘制成曲线图非常简单，只需要用到matplotlib库中pylpot模块的`plot()`函数。


    每个数据点有横、纵两个坐标。对于未来7天的气温数据，横坐标就是日期，可以从爬虫获取到的数据中读取；纵坐标当然就是刚才计算出的气温数值。只要将横坐标（日期）和纵坐标（气温）传入`plot()`函数，就可以绘制图像了。


    完成绘制后，我们还需要用`show()`函数将图像显示出来。


