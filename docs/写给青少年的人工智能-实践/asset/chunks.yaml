    程序2.3　利用wget下载图片


    ```

    16    import os                         # os库用于操作文件夹

    17    import wget                       # wget库用于下载

    18

    19    if not os.path.exists("火星图片"): # 检测"火星图片"文件夹是否存在

    20    os.mkdir("火星图片")               # 如果不存在，就新建"火星图片"文件夹

