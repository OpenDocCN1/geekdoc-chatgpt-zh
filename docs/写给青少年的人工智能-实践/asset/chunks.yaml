    18   # 定义最小二乘法函数

    19   def LinearRegression(x, y):

    20       ave_x = sum(x) / len(x)      # 计算x的平均值

    21       ave_y = sum(y) / len(y)      # 计算y的平均值

    22       # 以下计算x*y和x**2的平均值

    23       ave_xy = 0

    24       ave_x2 = 0

    25       for i in range(0, len(x)):

