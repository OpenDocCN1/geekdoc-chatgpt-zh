    \ 文件的完整路径。例如：\n\n```\npip install d:/gensim-4.0.1-cp37-cp37m-win32.whl\n```\n\n\
    一旦出现 Successfully 的提示，就说明已经安装成功了。如果安装不成功，一般是因为所下载的 whl 文件和安装的 Python 版本不匹配。\n\n\
    在 Thonny 中，你需要打开包管理，选择“从本地文件中安装”，如图 4-5 所示，然后找到刚才下载的 whl 文件。\n\n![](img/4-5.png)\n\
    \n图 4-5　从包管理中选择“从本地文件中安装”\n\n运行程序时，可能会弹出像下面这样的警告文字：\n\n/Users/hetao/Library/Python/3.7/lib/Python/site-packages/gensim/\n\
