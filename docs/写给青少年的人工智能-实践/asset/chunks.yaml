    本书从“如何实现人工智能”出发，讲述了最流行的人工智能编程语言之一——Python 语言的基本使用，帮助小读者初步学习一种获取数据的重要手段——网络爬虫，学习如何进行简单的数据处理，了解什么是算法，体验简单的人工智能算法，领略算法的魅力。当然，最终还会指导小读者一行行地亲手写出代码，在计算机上运行自己写出的人工智能程序。全书从多个角度打开了人工智能的大门，让小读者得以窥见门内的风景。


