    \n数字`1`和字符串`\"1\"`虽然看起来很像，但是其实完全不同。两个数字可以进行数学运算，比如`1 + 1`可以得到数字`2`，`3 * 2`可以得到数字`6`，但是两个字符串不能进行数学运算。\n\
