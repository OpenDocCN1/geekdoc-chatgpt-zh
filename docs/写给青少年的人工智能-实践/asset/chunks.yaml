    18   # 定义最小二乘法函数

    19   def LinearRegression(x, y):

    20       ave_x = sum(x) / len(x)      # 计算 x 的平均值

    21       ave_y = sum(y) / len(y)      # 计算 y 的平均值

    22       # 以下计算 x*y 和 x**2 的平均值

    23       ave_xy = 0

    24       ave_x2 = 0

    25       for i in range(0, len(x)):

    26           ave_xy = ave_xy + x[i] * y[i]  # 循环将所有 x[i]*y[i]相加

    27           ave_x2 = ave_x2 + x[i] ** 2    # 循环将所有 x[i]**2 相加

