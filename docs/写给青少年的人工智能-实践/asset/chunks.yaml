    如果我们能把隐藏在这些点中的直线确切地找出来，就可以根据父母的平均身高来预测孩子的大概身高了。那么，到底怎么才能找出这条直线呢？


    从大量数据中发现数据间的联系，找出比较准确的定量规律，在统计学上称为**回归分析**。这也是人工智能从数据中提取规律，进而做出一定预测的一种基础方法。如果找出的规律能用一条直线来代表，那就是**线性回归**。找到这条直线的过程，在人工智能领域就是训练模型。


    在数学上我们学过，直线可以用函数`y = k x + b`来表示，满足这个公式的点(`x`, `y`)就是直线上的点，参数`k`和`b`可以确定这条直线是什么样子。在这个身高问题中，`x`就是父母的平均身高，`y`就是儿子的身高。只要求出`k`和`b`就能确定直线，并进一步根据给定的`x`预测出`y`。进行线性回归分析的一种基本方法称为**最小二乘法**。


    对于所有的数据点(`x[i]`, `y[i]`)，可以通过以下最小二乘法算式计算：


    `k` = ![](img/4.png) = ![](img/5.png)


    `b` = `y` − `k x`


    其中，字母上面的横线表示平均值，如`x`表示所有`x`的平均值，![](img/6.png)表示每一组`x y`的平均值。


    我们将最小二乘法写成一个函数，如程序 3.4 所示。注意，**程序 3.4 只是一个函数，不能独立运行**。


    ### 程序 3.4　线性回归最小二乘法


    ```

    1    def LinearRegression(x, y):

    2        ave_x = sum(x) / len(x)     # 计算 x 的平均值

    3        ave_y = sum(y) / len(y)     # 计算 y 的平均值

    4        # 以下计算 x*y 和 x**2 的平均值

    5        ave_xy = 0

    6        ave_x2 = 0

    7        for i in range(0, len(x)):

    8            ave_xy = ave_xy + x[i] * y[i]  # 循环将所有 x[i]*y[i]相加

    9            ave_x2 = ave_x2 + x[i] ** 2    # 循环将所有 x[i]**2 相加

    10       ave_xy = ave_xy / len(x)    # 将所有 x*y 的和除以个数，求平均值

    11       ave_x2 = ave_x2 / len(x)    # 将所有 x**2 的和除以个数，求平均值

    12       # 以下通过最小二乘法公式计算 k 和 b

    13       k = (ave_xy - ave_x * ave_y) / (ave_x2 - ave_x ** 2)

    14       b = ave_y - k * ave_x

    15       return k, b

    ```


    调用函数`LinearRegression()`，可以求取`k`和`b`，完成模型训练。再使用模型直线`y = k x + b`，就可以根据父母的平均身高预测儿子的大概身高了，如程序
    3.5 所示。注意，**程序 3.5 不能独立运行，需要调用程序 3.3 输入的数据和程序 3.4 的函数**。


    ### 程序 3.5　训练模型并预测身高


    ```

    1    k, b = LinearRegression(parents_height, child_height)

    2    #调用线性回归函数，训练模型，求出 k 和 b

    3

    4    def predict(x, k, b):                    # 预测结果的函数

    5        return k * x + b

    6

    7    # 以下求出父母身高 150～200cm 时对应儿子的大概身高

    8    x = [i for i in range(150, 200)]

    9    y = [predict(i, k, b) for i in x]

    10

    11   # 以下画出散点图和线性回归分析得出的直线

    12   plt.plot(x, y,''r'')

    13   plt.scatter(parents_height, child_height)

    14   plt.xlabel("average height of parents  (cm)")

    15   plt.ylabel("height of children  (cm)")

    16   plt.show()

    ```


