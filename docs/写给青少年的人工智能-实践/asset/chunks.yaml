    ## 使用 `BeautifulSoup` 解析网页


    利用Python库`BeautifulSoup`，我们可以方便地解析标签和属性。`BeautifulSoup`是第三方库，需要自行安装。


    使用原生Python + IDLE时，在命令行窗口执行如下命令：


