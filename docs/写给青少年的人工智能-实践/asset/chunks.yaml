    2\n>>> '1' + '1'                    # 字符串 + 字符串，可得到连接后的字符串\n'11'\n>>> '12' * 3\
    \                     # 字符串 * 数字，得到重复多次的字符串\n'121212'\n>>> '1' * '1'         \
    \           # 字符串 * 字符串，程序报错，无法运行\nTraceback (most recent call last):\n  File\
    \ \"<stdin>\", line 1, in <module>\nTypeError: can't multiply sequence by non-int\
    \ of type 'str'\n```\n\n我们还可以通过`len()`函数，快速得到字符串的长度（有多少个字符），如程序1.12所示。\n\n程序1.12　`len()`函数\n\
    \n```\n>>> string = \"Hello world\"\n>>> len(string)\n11\n```\n\n### 列表\n\n列表（`list`）可以把多个数据储存成一组。它的样子是在一个方括号`[]`内，用逗号分隔开多个值。这些值称为列表的元素。\n\
    \n在列表中，元素不仅可以是数字，还可以是字符串，甚至可以是其他列表（**列表嵌套**），还可以是元组、字典等数据结构，而且每个元素的数据类型可以不同，如图1-31所示。\n\
    \n![](Images/1-31.jpg)\n\n图1-31　列表的构成\n\n与字符串类似，列表也可以使用`列表名[数字]`的方式来访问其中的某一个或某几个元素。从这个角度来讲，你可以认为字符串是一种特殊的列表。字符串中的切片方式，对于列表全部可以适用。对于嵌套的列表，我们可以用连续的两个中括号进行嵌套访问。\n\
    \n我们也可以对列表中的元素进行重新赋值，但字符串中的字符不能改变。列表使用和赋值示例如程序1.13所示。\n\n程序1.13　列表使用和赋值示例\n\n\
    ```\n>>> mylist = ['hello', 23, 3, [2, 45]]  # 创建列表\n>>> mylist[0]           \
    \   # 访问列表中0号元素，这是一个字符串\n'hello'\n>>> mylist[:2]             # 切片访问前两个（0、1号）元素，得到2个元素的列表\n\
    ['hello', 23]\n>>> mylist[-3:]            # 切片访问倒数3个元素，得到3个元素的列表\n[23, 3, [2,\
    \ 45]]\n>>> mylist[3]              # 访问3号元素，这个是一个列表\n[2, 45]\n>>> mylist[3][1]\
    \           # 嵌套访问3号元素（列表）中的1号元素\n45\n>>> mylist[0] = 0          # 重新赋值0号元素\n\
    >>> mylist[1:] = [1,2,3]   # 重新赋值1号到最后的元素\n>>> mylist                 # 调用改变后的列表进行查看\n\
    [0, 1, 2, 3]\n```\n\n像字符串（`str`）运算可以使用的`+`和`*`运算符一样，它们和`len()`函数也可以用在列表上，如程序1.14所示。\n\
    \n程序1.14　列表运算符示例\n\n```\n>>> [1] + [1]                       # 列表 + 列表，得到连接后的列表\n\
    [1, 1]\n>>> [1,2] * 3                       # 列表 * 数字，得到多次重复的列表\n[1,2,1,2,1,2]\n\
    >>> len([0,4,5])                    # len(列表)，得到列表长度（元素个数）\n3\n```\n\n还有一些简便的方法可以用于操作列表，如程序1.15所示。\n\
    \n程序1.15　操作列表的其他方法\n\n```\n>>> x = [1, 2, 3]\n>>> x.append(4)        # 列表.append(元素)，将元素增加到列表末尾\n\
    >>> x\n[1, 2, 3, 4]\n>>> x.extend([5,6])    # 列表.extend(列表)，将两个列表拼接，类似列表 + 列表\n\
    >>> x\n[1, 2, 3, 4, 5, 6]\n```\n\n### 元组\n\n**元组**是和列表非常相似的一种数据类型，在Python中记作`tuple`。**它用一对圆括号和括号中用逗号分隔的元素来表示**。元组的使用方法和列表基本一样，同样使用方括号和索引来访问元素，但是它的元素不能像列表一样修改，否则程序会出错无法运行。使用元组的示例如程序1.16所示。\n\
    \n程序1.16　使用元组的示例\n\n```\n>>> mytuple=(1,2,3)                      # 定义元组mytuple\n\
    >>> mytuple[1]                           # 访问元组中1号元素\n2\n>>> mytuple[0]=5    \
    \                     # 修改元组中元素会报错\nTraceback (most recent call last):\n  File\
    \ \"<stdin>\", line 1, in <module>\nTypeError: 'tuple' object does not support\
    \ item assignment\n```\n\n元组和列表如此相像，看似有点画蛇添足，而且元素不能改变，似乎也是它的缺点。不过，正是这种不能被改变的特性，可以保证它在使用中不会被意外修改。\n\
    \n### 字典\n\n有时我们遇到不认识的字，会查字典。查字典时，只要有了目标关键字，就可以在字典中找到相应的详细信息。Python中的字典就是这样的数据类型。\n\
    \n**字典由多个键值对组成，键（`key`）就像索引值，可以由我们自己指定；每个键都有对应值（`value`）。**\n\n字典的每个键值对用英文冒号（`:`）分割，每个键值对之间用英文逗号（`,`）分割，整个字典包括在英文花括号`{}`中，如图1-32所示。\n\
    \n值可以是任何数据，但键只能是字符串、数字、元组这样的不可变数据类型，而列表、字典不能作为字典的键。使用方括号和键可以访问字典中的某个值。使用字典的示例如程序1.17所示。\n\
    \n![](Images/1-32.jpg)\n\n图1-32　字典的构成\n\n程序1.17　使用字典的示例\n"
  trans: "\n\n数学中的中括号`[]`在 Python 中一般称为方括号，有其他作用，详见后文。\n\n## 变量\n\n在程序中，我们可以直接使用各种字符串、数字等数据。但是如果要对不同的数据进行很多次相同的操作，那么直接使用数据本身就显得比较烦琐。\n\
    \n在各种方程式中，我们常用不同的字母来代表数字，而对于具体的数值，则可以任意代入。在编程中，我们也可以采用类似的方式，即用**变量**来存储数据。例如，对于\
    \ Hello world 程序，我们也可以按照程序 1.6 所示的这样写。\n\n程序 1.6　使用变量\n\n```\n>>> a = \"Hello\
    \ world\"\n>>> print(a)\nHello world\n```\n\n程序 1.6 的效果和程序 1.1 是一样的。这里的`a`就是变量，`a\
    \ = \"Hello world\"`这句代码的作用就是将字符串`\"Hello world\"`这条数据存储在`a`中，这个过程称为**赋值**，变量中存储的内容称为**变量的值**。\n\
    \n首次给变量赋值，就是新建这个变量，这通常称为**声明变量**或**定义变量**。定义好变量后，在后面输入时，我们也可以使用自动补全功能。\n\n变量赋值中的“`=`”并不是数学中的等号（虽然它们的外观和输入方式一样），而是一个表示赋值操作的符号，称为**赋值运算符**，表示把“`=`”后边的内容存储到前面的变量中。“`=`”右边既可以是数字、字符串等数据，也可以是一个数学表达式等需要计算的内容，比如`a\
    \ = 1 + 1`，那么变量`a`的值就是 2，如图 1-27 所示。\n\n![](img/1-27.png)\n\n图 1-27　赋值语句的代码成分\n\
    \n你可以把变量视作一个可以装各种东西的盒子。如果你在盒子里装入苹果，放在桌子上，那么当你和别人说“帮我把桌子上的盒子拿过来”时，对方自然就会递给你这个装有苹果的盒子，而不是大费周章地把苹果拿出来，把空盒给你。可千万不要像图\
    \ 1-28 中的禾木那样把苹果吃掉了。\n\n![](img/1-28.jpg)\n\n图 1-28　使用变量（就是使用变量的值，而不是把变量清空）\n\n\
    同时，你可以随时把袋子中的东西扔掉，换上别的东西，也就是给变量**重新赋值**。例如程序 1.7 中，变量`b`中的数据先是字符串`\"你好，世界！\"`，然后变成数字`2`。你还可以把变量理解为一个可以贴在任何数据上的标签，然后就能用这个标签来称呼所用的数据了。\n\
    \n程序 1.7　变量赋值\n\n```\n>>> b = \"你好，世界！\"\n>>> print(b)\n你好，世界！\n>>> b = 1+1\n\
    >>> print(b)\n2\n```\n\n**在赋值过程中，计算机会先计算出等号右边的结果，然后将其赋值给等号左边的变量。**在数学中，`x = x\
    \ + 1`是一个没有解的方程，但是在 Python 编程中，它是有意义的，表示把`x`的值+`1`，然后重新赋值给`x`，如程序 1.8 所示。\n\n\
    程序 1.8　变量自增\n\n```\n>>> x = 1\n>>> x = x + 1\n>>> print(x)\n2\n```\n\n第一行将变量`x`赋值为\
    \ 1，因此第二行等号右边的变量`x`为 1，1+1 得到结果 2，将结果 2 重新赋值给`x`，最后变量`x`的值就变成了 2。\n\n在 Python\
    \ 中，我们可以一次为多个变量赋值。比如，`a = b = c = 1`可以将变量`a`、`b`、`c`都赋值为 1。又如，`a, b = 2, 3`就可以将变量`a`赋值为\
    \ 2，将变量`b`赋值为 3。还可以用一个变量来为另一个变量赋值，比如当变量`a`的值为 1 时，那么`b = a`可以将变量`b`赋值为 1。我们可以用`a,\
    \ b = b, a`方便地交换两个变量的值。程序 1.9 展示了这几种情况。\n\n程序 1.9　变量赋值在 Python 中的示例\n\n```\n>>>\
    \ a = b = c = 1                    # 使用连等号=给多个变量赋相同的值\n>>> print(a,b,c)\n1 1 1\n\
    >>> a, b, c = 2, 1, 3*5              # 使用逗号，给多个变量分别赋值\n>>> print(a,b,c)\n2 1 15\n\
    >>> c = a                            # 用一个变量给另一个变量赋值\n>>> print(c)\n2\n>>> a,\
    \ b = b, a                      # 使用逗号，交换变量 a 和 b 的赋值\n>>> print(a,b)        \
    \               # 显示变量 a 和 b 的值\n1 2\n```\n\n你可以给变量起各种各样的名字，但是要注意，只能用字母或下划线（`_`）开头，不能用数字开头。变量名也不能和\
    \ Python 中的关键词（也就是 Python 语言中已用过的、有特定功能的词）重复。Python 中的关键词包括下面这些：\n\n`True` `False`\
    \ `None` `if` `elif` `else` `and` `or` `not` `for` `in` `while` `break` `continue`\
    \ `def` `yield` `return` `from` `import` `as` `assert` `class` `del` `global`\
    \ `nonlocal` `is` `lambda` `pass` `raise` `try` `except` `with` `finally`\n\n\
    除此之外，像`!@#之`类的特殊符号也不能用来命名变量。如果变量名不符合规则，程序就会出错无法运行。请问下面哪个变量名是错误的？\n\n```\nAsd　　name　　123age　_hao　名字　__ming_zi　haha！\n\
    ```\n\n答案是第三个和最后一个，即`123age`和`haha！`。“`名字`”是可以使用的变量名。在 Python 中，变量名可以使用汉字（但不推荐）。\n\
    \n除了这些必须遵守的规则，在给变量起名时，最好使用能看懂的、有意义的词。比如给储存名字的变量起名为`name`，给储存年龄的变量命名为`age`。你也可以用拼音来命名，不过命名规则最好统一。\n\
    \n值得注意的是，你可以把变量命名为`print`，比如`print = 1`。但是一旦这么做了，它就失去了显示功能，只是一个变量，存储了你赋值给它的 1。但是，只要重启\
    \ Python，就可以恢复正常。\n\nThonny 有一个非常有用的功能：只要单击“视图”菜单，勾选“变量”，就可以打开“变量”窗口。所有已经声明的变量及其值会显示在“变量”窗口中，如图\
    \ 1-29 所示。\n\n![](img/1-29.png)\n\n图 1-29　Thonny 的“变量”窗口\n\n## Python 中的数据类型\n\
    \n在前面的代码中，我们用过数字（`10`，`2`，`3`）和字符串（`\"Hello World\"`），这些都是不同类型的数据。Python 中有多种不同的**数据类型**，常用的有**数字**、**字符串**、**列表**、**元组**、**字典**等。\n\
    \n### 数字\n\n**数字类型**的数据又可以细分为很多种，最常见的就是**整数**（如 1，记作`int`）和**浮点**数（如 1.0，记作`float`）。浮点数其实就是小数。数字可以参与各种数学运算。\n\
    \n还有一种特殊的数字类型，称为**布尔型（Bool）**。布尔型只有两个值，即`True`和`False`，这两个值分别表示“真”和“假”。布尔型用于表示逻辑上的真和假，所以有时也称为**逻辑型**。在编程中，我们会经常用到逻辑判断。前文提到比较运算法和逻辑运算符时，就出现了布尔型数据。\n\
    \n我们也可以用数字 1 来表示真，用数字 0 来表示假。实际上，在“只懂”二进制的计算机看来，`True`和`False`本质上就是 1 和 0 这两个数字，如果执行计算`True\
    \ + True`，那么可以得到结果`2`。这也是为什么布尔型属于数字类型的数据。注意，**Python 是区分大小写的**，所以使用布尔值时，不要误写成`true`和`false`。结果为布尔型值的表达式称为布尔表达式，也可称为逻辑表达式。\n\
    \n### 字符串\n\n如果说数字对应着计算，那么文字则对应着记录。在 Python 语言中，文字用**字符串**来表示，在 Python 中记作`str`。它**由一对引号中的一串字符（如字、字母、符号、数字）组成**，引号可以用英文单引号（`'`），如`'Hello\
    \ world'`；也可以用英文双引号（`\"`），如`\"Hello world\"`，但需要前后一致。\n\n字符的位置在 Python 中称为**索引值**，也有人习惯称之为**元素下标**、**序号**等。与我们平常习惯不同的是，**索引值是从前往后从\
    \ 0 开始计数的**，也就是说，在`\"Hello world\"`这个字符串中，`H`位于位置 0，或者说是第 0 个字符。字符串中的空格同样是字符串的一部分，要占一个位置，如图\
    \ 1-30 所示。通过索引值，我们可以方便地使用字符串的某个字符，如果用`string = \"Hello world\"`将字符串存储在变量中，那么`string[0]`代表第一个字符`H`，`string[-n]`代表倒数第*n*个字符，倒着数就是从\
    \ 1 开始计数了，比如`string[-1]`代表`\"d\"`。你可以试着运行`print(string[0])`，再看结果。但是，我们无法修改字符串中的字符，如程序\
    \ 1.10 所示。\n\n![](img/1-30.jpg)\n\n图 1-30　字符串的构成\n\n如果要访问字符串的某一个片段，我们可以利用索引方便地从字符串中截取一部分——这个操作称为**切片**。可以用`string[m:n]`来访问从第*m*个到第*n*-1\
    \ 个（注意，是从 0 开始数的）字符，片段中的最后一个字符，也就是说，第*n*个字符不会包含在内。如果把冒号前或后的数字省略，就说明是从开头访问或访问到结尾。请尝试运行程序\
    \ 1.10 中的代码，以理解字符串的“切片”是什么意思。\n\n程序 1.10　字符串访问字符和切片在 Python 中的示例\n\n```\n>>> string\
    \ = \"Hello world\"        # 创建字符串\n>>> print(string[0])              # 显示字符串的\
    \ 0 号（第一个）字符\nH\n>>> print(string[-2])             # 显示字符串的倒数第二个字符\nl\n>>> string[3:5]\
    \                   # 用切片访问字符串的 3、4 号字符\n'lo'\n>>> print(string[:7])         \
    \    # 显示字符串的 0～6 号字符\nHello w\n>>> print(string[4:])             # 显示字符串的 4 号～结尾字符\n\
    o world\n>>> string[0] = 'h'               # 不能给字符串 0 号字符重新赋值（修改字符串）\nTraceback\
    \ (most recent call last):       <==程序报错无法运行\n  File \"<stdin>\", line 1, in <module>\n\
    TypeError: 'str' object does not support item assignment\n```\n\n在上面的例子中，我们还可以看到是否使用`print()`函数的区别。若不使用`print()`函数，则显示的字符串是带有引号的，即显示的是数据本身；若使用`print()`函数，则显示的字符串是不带引号的，即显示的是数据的内容。\n\
    \n数字`1`和字符串`\"1\"`虽然看起来很像，但是其实完全不同。两个数字可以进行数学运算，比如`1 + 1`可以得到数字`2`，`3 * 2`可以得到数字`6`，但是两个字符串不能进行数学运算。\n\
    \n若对字符串执行字符串+字符串的操作，会得到将两个字符串连接起来的结果；若对字符串执行字符串`*`数字的操作，则可以把字符串重复多次后连接；若对字符串执行字符串`*`字符串的操作，程序就会报错，如程序\
    \ 1.11 所示。你也可以尝试使用其他运算符。\n\n程序 1.11　数字和字符串运算在 Python 中的示例\n\n```\n>>> 1 + 1  \
    \                      # 数字进行加法+运算\n2\n>>> '1' + '1'                    # 字符串\
    \ + 字符串，可得到连接后的字符串\n'11'\n>>> '12' * 3                     # 字符串 * 数字，得到重复多次的字符串\n\
    '121212'\n>>> '1' * '1'                    # 字符串 * 字符串，程序报错，无法运行\nTraceback (most\
    \ recent call last):\n  File \"<stdin>\", line 1, in <module>\nTypeError: can't\
    \ multiply sequence by non-int of type 'str'\n```\n\n我们还可以通过`len()`函数，快速得到字符串的长度（有多少个字符），如程序\
    \ 1.12 所示。\n\n程序 1.12　`len()`函数\n\n```\n>>> string = \"Hello world\"\n>>> len(string)\n\
    11\n```\n\n### 列表\n\n列表（`list`）可以把多个数据储存成一组。它的样子是在一个方括号`[]`内，用逗号分隔开多个值。这些值称为列表的元素。\n\
    \n在列表中，元素不仅可以是数字，还可以是字符串，甚至可以是其他列表（**列表嵌套**），还可以是元组、字典等数据结构，而且每个元素的数据类型可以不同，如图\
    \ 1-31 所示。\n\n![](img/1-31.jpg)\n\n图 1-31　列表的构成\n\n与字符串类似，列表也可以使用`列表名[数字]`的方式来访问其中的某一个或某几个元素。从这个角度来讲，你可以认为字符串是一种特殊的列表。字符串中的切片方式，对于列表全部可以适用。对于嵌套的列表，我们可以用连续的两个中括号进行嵌套访问。\n\
    \n我们也可以对列表中的元素进行重新赋值，但字符串中的字符不能改变。列表使用和赋值示例如程序 1.13 所示。\n\n程序 1.13　列表使用和赋值示例\n\
    \n```\n>>> mylist = ['hello', 23, 3, [2, 45]]  # 创建列表\n>>> mylist[0]         \
    \     # 访问列表中 0 号元素，这是一个字符串\n'hello'\n>>> mylist[:2]             # 切片访问前两个（0、1\
    \ 号）元素，得到 2 个元素的列表\n['hello', 23]\n>>> mylist[-3:]            # 切片访问倒数 3 个元素，得到\
    \ 3 个元素的列表\n[23, 3, [2, 45]]\n>>> mylist[3]              # 访问 3 号元素，这个是一个列表\n\
    [2, 45]\n>>> mylist[3][1]           # 嵌套访问 3 号元素（列表）中的 1 号元素\n45\n>>> mylist[0]\
    \ = 0          # 重新赋值 0 号元素\n>>> mylist[1:] = [1,2,3]   # 重新赋值 1 号到最后的元素\n>>>\
    \ mylist                 # 调用改变后的列表进行查看\n[0, 1, 2, 3]\n```\n\n像字符串（`str`）运算可以使用的`+`和`*`运算符一样，它们和`len()`函数也可以用在列表上，如程序\
    \ 1.14 所示。\n\n程序 1.14　列表运算符示例\n\n```\n>>> [1] + [1]                       # 列表\
    \ + 列表，得到连接后的列表\n[1, 1]\n>>> [1,2] * 3                       # 列表 * 数字，得到多次重复的列表\n\
    [1,2,1,2,1,2]\n>>> len([0,4,5])                    # len(列表)，得到列表长度（元素个数）\n3\n\
    ```\n\n还有一些简便的方法可以用于操作列表，如程序 1.15 所示。\n\n程序 1.15　操作列表的其他方法\n\n```\n>>> x = [1,\
    \ 2, 3]\n>>> x.append(4)        # 列表.append(元素)，将元素增加到列表末尾\n>>> x\n[1, 2, 3, 4]\n\
    >>> x.extend([5,6])    # 列表.extend(列表)，将两个列表拼接，类似列表 + 列表\n>>> x\n[1, 2, 3, 4,\
    \ 5, 6]\n```\n\n### 元组\n\n**元组**是和列表非常相似的一种数据类型，在 Python 中记作`tuple`。**它用一对圆括号和括号中用逗号分隔的元素来表示**。元组的使用方法和列表基本一样，同样使用方括号和索引来访问元素，但是它的元素不能像列表一样修改，否则程序会出错无法运行。使用元组的示例如程序\
    \ 1.16 所示。\n\n程序 1.16　使用元组的示例\n\n```\n>>> mytuple=(1,2,3)                    \
    \  # 定义元组 mytuple\n>>> mytuple[1]                           # 访问元组中 1 号元素\n2\n\
    >>> mytuple[0]=5                         # 修改元组中元素会报错\nTraceback (most recent\
    \ call last):\n  File \"<stdin>\", line 1, in <module>\nTypeError: 'tuple' object\
    \ does not support item assignment\n```\n\n元组和列表如此相像，看似有点画蛇添足，而且元素不能改变，似乎也是它的缺点。不过，正是这种不能被改变的特性，可以保证它在使用中不会被意外修改。\n\
    \n### 字典\n\n有时我们遇到不认识的字，会查字典。查字典时，只要有了目标关键字，就可以在字典中找到相应的详细信息。Python 中的字典就是这样的数据类型。\n\
    \n**字典由多个键值对组成，键（`key`）就像索引值，可以由我们自己指定；每个键都有对应值（`value`）。**\n\n字典的每个键值对用英文冒号（`:`）分割，每个键值对之间用英文逗号（`,`）分割，整个字典包括在英文花括号`{}`中，如图\
    \ 1-32 所示。\n\n值可以是任何数据，但键只能是字符串、数字、元组这样的不可变数据类型，而列表、字典不能作为字典的键。使用方括号和键可以访问字典中的某个值。使用字典的示例如程序\
    \ 1.17 所示。\n\n![](img/1-32.jpg)\n\n图 1-32　字典的构成\n\n程序 1.17　使用字典的示例\n\n"
