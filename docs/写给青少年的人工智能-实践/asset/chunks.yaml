    图2-10　网页中的图片代码


    如果你对文件的储存格式有所了解，就会注意到下面这段代码中的`.jpg`和`.gif`，它们都代表图片文件。


    ```

    <a href="/image/planetary/mars/marsglobe1.jpg">

    <img alt="Thumbnail of image" src="/thumbnail/planetary/mars/marsglobe1.gif">

    </a>

    ```


    含有`.gif`的代码被一对尖括号`<>`包裹起来，开头是`img`，这在HTML语言中称为**标签**，`<img>`标签表示这是一张**图片**。`alt`和`src`都是这个标签的**属性**。对我们比较重要的是`src`，它表示这个图片在网站上的存储地址。这个地址是相对地址，相当于告诉你禾木家的地址是“5号楼3单元204室”。不过，只知道这个是找不到禾木家在哪里的，因为我们不知道这个“5号楼”到底位于哪个城市的哪个小区。对于网页上的图片来说，它的“城市和小区”就是网站的地址。我们把这两部分连接起来就能得到图片的完整链接。如果你直接使用这个地址下载，只能得到在网页上显示的小图。


    怎样才能找到单击图片后显示的高清图片呢？我们注意到，单击图片后跳转到了一个新的页面，也就是说，图片是一个链接，而新页面的地址是以`.jpg`扩展名结尾的。.jpg同样是图片的格式。找到网页中的.jpg文件，也就找到了高清图。


    我们刚才也看到了，.jpg文件就包含在上一行代码`<a href = 地址 >`里，其中`<a>`标签表示这是一个**链接**。`href`是这个标签的属性，它指出链接的地址是`/image/planetary/mars/marsglobe1.jpg`。在前面加上网站地址，我们就可以得到图片的完整链接。


    利用**Python库BeautifulSoup**，我们可以方便地解析标签和属性。BeautifulSoup是第三方库，需要自行安装。


    使用原生Python + IDLE时，在命令行窗口执行如下命令：


    ```

    pip install beautifulSoup4

    ```


    使用Thonny时，在包管理搜索`beautifulSoup4`并进行安装。


    使用`BeautifulSoup`库，首先要使用`BeautifulSoup()`函数根据网页内容建立对象。有了对象，我们就能使用`find_all(''a'')`找出网页上所有的`<a>`标签。对于每一个标签，`get(''href'')`能提取出具体链接。不过，并不是所有链接都是图片链接，所以还有待进一步筛选。如果链接中有“.jpg”，那么说明这就是我们要找的图片链接。流程如图2-11所示。


    ![](Images/2-11.png)


    图2-11　使用BeautifulSoup库提取图片链接


    程序2.2是利用`BeautifulSoup`库解析网页，提取图片链接的程序。


    程序2.2　利用BeautifulSoup库解析网页，提取图片链接


    ```

    1    import requests

    2    from bs4 import BeautifulSoup

    3

    4    url = "▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓"

    5    r = requests.get(url)

    6    print("=====获取网页数据完成=====")

    7

    8    soup = BeautifulSoup(r.text, "html.parser") # 建立BeautifulSoup对象

    9    a_tag = soup.find_all("a")                 # 提取所有的<a>标签

    10   link = []                                  # 准备将链接保存在列表中

    11   for t in a_tag:                            # 遍历所有标签

    12       href = t.get("href")                   # 提取href属性

    13       if href and ".jpg" in href:            # 如果图链接存在并含有.jpg

    14           link.Append(href)                  # 记录链接

    15   print("======网页解析完成======")

    ```


