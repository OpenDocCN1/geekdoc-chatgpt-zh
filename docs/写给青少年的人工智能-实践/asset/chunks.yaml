    程序2.2是利用`BeautifulSoup`库解析网页，提取图片链接的程序。


    ### 程序2.2 利用`BeautifulSoup`库解析网页，提取图片链接


    ```

    1    import requests

    2    from bs4 import BeautifulSoup

    3

    4    url = "▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓"

    5    r = requests.get(url)

    6    print("=====获取网页数据完成=====")

    7

    8    soup = BeautifulSoup(r.text, "html.parser") # 建立BeautifulSoup对象

    9    a_tag = soup.find_all("a")                 # 提取所有的<a>标签

    10   link = []                                  # 准备将链接保存在列表中

    11   for t in a_tag:                            # 遍历所有标签

    12       href = t.get("href")                   # 提取href属性

    13       if href and ".jpg" in href:            # 如果图链接存在并含有.jpg

    14           link.Append(href)                  # 记录链接

    15   print("======网页解析完成======")

    ```


