    那么，如何判断这个水果是橘子还是橙子呢？我们可以根据在坐标轴中这个新水果周围都是什么水果来判断。如果这个水果四周橘子较多，那么它很可能也是橘子。这种方法就是**K最近邻算法，简称KNN算法**。在图像识别、推荐系统、文本分类等方面的人工智能中，都有K最近邻算法的身影。


    K最近邻算法可以分为下面3个步骤。


