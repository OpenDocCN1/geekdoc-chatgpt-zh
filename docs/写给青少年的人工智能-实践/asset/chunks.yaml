    ## 使用 OpenCV 进行人脸识别


    图像的检测与识别，或者更广泛地说计算机视觉，是人工智能领域最重要的课题之一。


    这可能也是我们日常生活中最常见的人工智能应用之一——你或者爸爸妈妈的手机，说不定就是利用人脸识别解锁的。想不想实现一个属于自己的人脸识别程序呢？下面我们就一起来试试！


    在计算机视觉领域，最著名的人工智能库当属`OpenCV`。它的全称是 Open Source Computer Vision Library，可以在多个平台使用。`OpenCV`由英特尔公司发起并参与开发，以
    BSD 许可证授权开源发行，可以在商业和研究领域中免费使用。`OpenCV`可用于开发实时的图像处理、计算机视觉以及模式识别程序。像图像检测、人脸识别等常见的功能，都可以利用`OpenCV`来实现。


