    \n# 内 容 提 要\n\n这是一本写给青少年看的人工智能科普图书，目的是帮助青少年启蒙科学素养，开阔科学视野，培养科学思维，锻炼动手能力，让小读者了解人工智能的过去、现在和未来，从而更好地融入人工智能时代。通过阅读本书，小读者不仅能学习Python语言的基本使用，还可以从数据、算法等多个角度来一探人工智能的奥秘。所有这些都旨在激发孩子们的好奇心，帮助他们体会科学研究应具备的精神。\n\
    \n本书用了大量形象的比喻，用贴近青少年生活的案例作类比，把书中的抽象概念和难点以诙谐幽默的手绘插画形式诠释出来，力求让小读者读得懂、喜欢读。\n\n本书从“如何实现人工智能”出发，讲述了最流行的人工智能编程语言之一——Python语言的基本使用，帮助小读者初步学习一种获取数据的重要手段——网络爬虫，学习如何进行简单的数据处理，了解什么是算法，体验简单的人工智能算法，领略算法的魅力。当然，最终还会指导小读者一行行地亲手写出代码，在计算机上运行自己写出的人工智能程序。全书从多个角度打开了人工智能的大门，让小读者得以窥见门内的风景。\n\
    \n# 参与本书编写的成员名单\n\n**内容总策划：**曾鹏轩 王宇航\n\n**执行主编**：庄 淼 丁倩玮 陈佳红 孔熹峻\n\n**插 画 师：**闫佩瑶 林方彪 黄昱鑫 王晶宇\n\
    \n# 致小读者\n\n小读者们，大家好！我是“核桃编程”的宇航老师。提到“人工智能”（AI），你会想到什么呢？是能听懂你说话的智能音箱语音助手，还是能打败围棋世界冠军的\
    \ AlphaGo？是无人驾驶汽车，还是科幻电影里的超能机器人？相信你一定会浮想联翩。人工智能已经渗入我们生活、学习中的方方面面。\n\n为什么这些各不相同的东西都叫作“人工智能”？在《写给青少年的人工智能\
    \ 起源》一书中，我们探讨了“什么是人工智能”，并沿着人类使用工具的历史，回顾了原始工具以及人工智能的开端——达特茅斯会议，细数了近几十年来人工智能领域的重要发明创造。\n\
    \n那么，科学家们又是怎样研究出这些人工智能产品的呢？在《写给青少年的人工智能　发展》一书中，我们仿佛“进入”了科学家的大脑，沿着他们研究问题的思路，“亲身经历”了人工智能发展的过程，并最终了解了几种常用的研究人工智能的思路：让机器学会推理，用机器构建大脑，让机器适应环境，等等。\n\
    \n经过几十年的努力，科学家们“八仙过海，各显神通”，研究出了各种各样的人工智能产品，将人工智能技术应用到了生活、医疗、艺术、农业、商业等领域。在《写给青少年的人工智能\
    \ 应用》一书中，我们选取人工智能在各行各业典型而有趣的应用，让你了解现在的人工智能到底“智能”到了什么程度、“智能”体现在了哪些方面。\n\n到这里，你应该对人工智能的起源、发展和应用有了一定的了解，有没有一种跃跃欲试想要参与其中的想法呢？别急，本书会带你动手试一试，引导你试着开发一些属于自己的人工智能程序，让你从实践中体会其奥妙。\n\
    \n最后，还要告诉你一件好玩儿的事。为了让小读者读得懂、喜欢读，我们把人工智能科学中不好理解的名词和概念，尽可能用形象的比喻或者贴近生活的类比加以解释，把抽象的知识点用风趣幽默的手绘插画加以诠释。插画中的这些角色可都是“核桃世界”的动漫明星呦，快去和他们打个招呼吧！\n\
    \n![](Images/zd1.jpg)\n\n小读者们，快来开启你的人工智能启蒙之旅吧！\n\n核桃编程联合创始人　王宇航\n\n# 人工智能的身体\n\
    \n![](Images/hm.png)禾木：小核桃，快快快，我们开始创造人工智能吧！我要创造一个能认出我的人工智能！\n\n![](Images/tz.png)桃子：我也要！我要创造一个有艺术气息、能写诗的人工智能！\n\
    \n![](Images/xht.png)小核桃：好啊，不过别着急，在真正创造人工智能之前，我们必须先做一些准备工作。计算机的智能来自人类的指令，因此我们必须学会如何给计算机下达命令。\n\
    \n![](Images/zd.png)\n\n## 什么是编程语言\n\n为什么冷冰冰的机器能够按照人类的想法工作，甚至变成聪明的人工智能？相信读过前三册书的同学心里一定已经有了答案。不是因为机器聪明，而是因为人类把每一步要做什么都写成一条条指令，“告诉”了计算机。计算机只要根据指令按部就班地去执行、去计算，就可以表现得“机智过人”。对于这些告诉计算机该怎么做的指令，我们称之为**计算机程序**，即通常所说的**代码**。计算机程序就是把计算机需要做的事一步步地精确描述出来。编写程序，或者说编程、写代码，就是在给计算机下达命令。\n\
    \n我们平时在计算机、手机等硬件载体上使用的各种软件、App或者聪明、强大的人工智能程序，都是通过编程实现的。也可以说，**程序代码构成了人工智能软件产品的“身体”**。\n\
    \n如果给这些软件穿上机械的外衣，用软件控制各种机器，就有了扫地机器人、无人驾驶汽车等人工智能硬件产品。\n\n总而言之，掌握编程是创造人工智能产品不可或缺的技能。\n\
    \n不过，计算机可不懂人类的话。想要让计算机理解人类的指令，必须使用计算机的语言，也就是**程序语言**。\n\n人类的语言有汉语、英语、日语、法语等，计算机的语言同样种类繁多。你可能听说过**C语言、Java语言、C++语言**，这些都是很热门的程序语言，如图1-1\
    \ 所示。\n\n![](Images/1-1.jpg)\n\n图1-1　与人类的语言一样，计算机语言也是种类多样的\n\n这些语言具有不同的特点，适用于不同的场合。比如，C语言和C++语言，它们的特点是性能很强。用C语言和C++语言写成的程序，运行时效率非常高。但是要把这两种语言用好可不是一件容易的事，不仅编写起来麻烦，还容易出错。Java语言虽然性能稍微弱一点，但使用起来很方便，更重要的是，Java语言写成的程序可以很方便地在计算机、手机等不同的平台之间迁移。\n\
    \nPython同样是一门程序语言，使用非常方便，很受欢迎。表1-1展示了一些常用的编程语言，包括很多同学听说过甚至学过的**Python语言**。\n\n\
    表1-1　2021年8月流行度排名前五的编程语言\n\n| 排名 || 编程语言 || 流行度 || 对比上月 |\n\n| --- | --- | ---\
    \ | --- |\n\n| 1 || C || 12.57% || ↑0.95% |\n\n| 2 || Python || 11.86% || ↓0.91%\
    \ |\n\n| 3 || Java || 10.43% || ↓0.74% |\n\n| 4 || C++ || 7.36% || ↓0.65% |\n\n\
    | 5 || C# || 5.14% || ↑0.31% |\n\n## 什么是Python语言\n\nPython的发明者是一位荷兰籍程序员，名叫吉多·范罗苏姆（Guido\
    \ van Rossum）。他曾在荷兰数学和计算机科学研究学会工作。1989年12月，范罗苏姆思考一个问题：该干点什么来度过长达一周的圣诞节假期呢？他思来想去，决定开发一种新的程序语言！它就是Python。当然，想在一周之内完成这么复杂的任务，确实不太可能，假期结束后，范罗苏姆继续为此努力，并在1991年以开源形式发布了Python的最初版本（Python\
    \ 0.9.0）。2021年8月，Python语言3.10版本基本上开发完成，有成千上万名优秀的程序员参与了这个项目，为它做贡献。\n\n趣闻　什么是开源？\n\
    \n“开源”是“开放源代码”的简称。对于常见的大部分软件，我们只有使用权，但是并不知道内部的程序代码是如何编写的——这种软件称为闭源软件。有些程序员写好软件之后，乐于公开源代码，既能让所有人都了解软件的运行原理，也能让更多的人和他合作，一起让软件变得更好用——这种软件就是开源软件。计算机领域得以飞速发展，一个重要的因素就是有无数愿意投身开源活动的程序员。很多非常重要的软件、方法都是在开源活动中诞生的。\n\
    \nPython这个单词的原意是“大蟒蛇”，之所以选择这个名字，不是因为范罗苏姆希望这门新语言会像大蟒蛇一样强壮、有力，而是因为他特别喜欢看一部名为《巨蟒剧团之飞翔的马戏团》的电视剧。\n\
    \n## Python对人工智能有什么好处\n\nPython语言非常简洁、方便。与大名鼎鼎的C语言相比，C语言要求程序员改变人的思维去适应计算机，而Python正好相反，**这门语言非常贴近于人的思维习惯**。好的Python程序就像一个极其严谨的人（用英语）在说话，因此非常容易理解。简言之，使用Python语言可以让你集中精力解决问题，而不是费劲地琢磨写程序的规则。这也是为什么Python在人工智能领域这么流行——实现人工智能本来就已经很难了，当然要在写代码上省点力了。\n\
    \n不过，Python语言也有一些缺点，比如用Python写成的程序运行起来往往会慢一些。而人工智能通常需要进行大量计算，所以我们会希望程序运行得更快。好在Python语言还有另一个优点，**它可以很方便地调用以其他语言写就的程序段**。我们可以先把计算量非常大、需要快速运行的部分用性能更强的C语言等写好，然后使用Python写出总体结构，对C语言模块进行调用，这样就能既写得快，又算得快了！因为这个特点，Python被戏称为“**胶水语言**”，就好像用胶水把各种零件迅速、方便地粘起来，如图1-2所示。\n\
    \n![](Images/1-2.jpg)\n\n图1-2　Python被戏称为“胶水语言”\n\n由于Python简单好用，在人工智能领域，已经有非常多的人为Python这瓶“胶水”写了很多好用的“零件”（我们通常将其称为**Python库**），并遵循开源精神把它们分享出来，让更多的人一起使用。这也让Python变得更加好用了。\n\
    \n趣闻　Python之禅\n\n另一位对Python语言的开发做出很大贡献的程序员蒂姆·彼得斯（Tim Peters）写了一首小诗来描述Python语言写成的程序应该是什么样的。\n\
    \n**Python之禅**\n\n优美而不丑陋，\n\n明了而不隐晦，\n\n简单而不复杂，\n\n复杂而不凌乱，\n\n扁平而不嵌套，\n\n稀疏而不稠密，\n\
    \n可读性很重要，\n\n即使实用比纯粹更优，\n\n特例亦不可违背原则。\n\n错误绝不能悄悄忽略，\n\n除非它明确需要如此。\n\n面对不确定性，\n\
    \n拒绝妄加猜测。\n\n任何问题应有一种，\n\n且最好只有一种，\n\n显而易见的解决方法。\n\n除非你是荷兰人，否则这方法一开始并非如此直观。\n\n\
    做总比不做强，\n\n但是冒失去做还不如不做。\n\n很难解释的，必然是坏方法。\n\n很好解释的，可能是好方法。\n\n命名空间是个绝妙的主意——我们应好好利用它！\n\
    \n**The Zen of Python**\n\nBeautiful is better than ugly.\n\nExplicit is better\
    \ than implicit.\n\nSimple is better than complex.\n\nComplex is better than complicated.\n\
    \nFlat is better than nested.\n\nSparse is better than dense.\n\nReadability counts.\n\
    \nSpecial cases aren’t special enough to break the rules.\n\nAlthough practicality\
    \ beats purity.\n\nErrors should never pass silently.\n\nUnless explicitly silenced.\n\
    \nIn the face of ambiguity,\n\nrefuse the temptation to guess.\n\nThere should\
    \ be one——and preferably only one——obvious way to do it.\n\nAlthough that way\
    \ may not be obvious at first unless you’re Dutch.\n\nNow is better than never.\n\
    \nAlthough never is often better than \\*right\\* now.\n\nIf the implementation\
    \ is hard to explain, it’s a bad idea.\n\nIf the implementation is easy to explain,\
    \ it may be a good idea.\n\nNamespaces are one honking great idea —— let’s do\
    \ more of those!\n\n## Python安装\n\n要编写Python程序，首先需要安装Python，并安装合适的开发工具。这里我们介绍两种常用方式：第一，直接安装原生Python，并利用Python自带的**IDLE**开发工具进行编程；第二，使用集成开发环境**Thonny**。\n\
    \nPython软件的安装与操作系统有关，在使用时，部分情况也会根据操作系统有所不同。在本书中，我们主要以Windows 10系统为例进行介绍，也会提及macOS或其他系统。\n\
    \n### 直接下载安装Python"
