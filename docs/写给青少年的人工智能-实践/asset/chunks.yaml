    不管做什么事，都需要经过特定的步骤。比如，你想煮面条，可能需要经过图 3-1 所示的步骤。在烹饪时，我们这样的步骤称为**工序**，而在计算机、编程领域，我们通常称之为**算法**。**算法就是用计算机解决问题的方法、步骤**。想要用计算机实现人工智能，就要让计算机学会各种问题的解决方法，也就离不开各种各样的算法。


    ![](img/3-1.jpg)


    图 3-1　煮面的步骤：①向锅内添水；②点火，等水沸腾；③放面条；④等待面条煮熟；⑤关火


    要解决不同的问题，需要使用不同的算法。即使针对同一个问题，可能也有不同的算法，而且不同的算法中，可能有的能快速解决问题，有的就会慢很多。在本章中，我们会一起了解几个简单的算法，领略算法的精妙之处。


    ## 二分法搜索


    禾木和桃子在玩猜数字游戏。禾木在心中想了 1～100 中的一个数字，让桃子去猜。桃子每猜一次，禾木就会告诉她猜的结果是大了还是小了，如图 3-2 所示。


    ![](img/3-2.jpg)


    图 3-2　猜数字游戏


    如果你来玩，会怎么猜呢？最简单的方法就是像图 3-3 这样从小到大一个一个地尝试。不过，这样实在是太慢了，万一禾木想的数字是 100，那我们岂不是要猜 100
    次才能猜中。


    ![](img/3-3.jpg)


    图 3-3　最简单的猜数字方法（从小到大一个一个地尝试）


    我们也可以大胆一点，每隔 10 个数猜一次，然后等禾木说“大了”，就找到了 10 位数，之后再猜个位就可以了，如图 3-4 所示。这样猜数字的效率就大幅提高了，最多我们只需要猜
    20 次，就能找到目标。


    我们还可以随机猜，然后随时根据禾木的反馈调整。用这种方法，你有信心几次能猜中呢？


    这些不同的猜法，就是猜数字问题的不同算法。这些算法的效率有高有低，差距明显。


    ![](img/3-4.jpg)


    图 3-4　间隔 10 猜数字


    桃子想了一个好办法，最多只要 7 次就一定能猜中。你知道她是怎么做的吗？桃子的算法很简单：从 1～100 的中间数 50 开始猜，如果 50 大了，那么再猜
    1～50 的中间数 25；如果 50 小了，就猜另一半的中间数 75。然后继续这样猜中间数（如果中间数是两个数字，就每次都选奇数或都选偶数），如图 3-5
    所示。这样不断猜下去，每一次都能把猜的范围缩小一半，最终剩下唯一的数字，就是答案了。所以只需要 3 次，就可以猜到 62。你可以随便找个数字试试，看看是不是最多
    7 次就能猜中，想一想为什么。


    像猜数字这样从很多数据中找到特定数据的问题可以称为**搜索问题**。桃子用的方法是一种解决搜索问题时非常经典的算法，针对的是那些已经排好顺序的数据。在搜索时，这种方法会不断把搜索范围分成两部分，因此称为**二分法**。


    二分法是一种非常有效率的搜索算法。根据二分法的原理，我们可以很容易地得到结果。随着搜索次数的增加，二分法能搜索的范围是呈指数增长（范围`S` = `2^n`）的，也就是说，即使把猜数字的范围扩大到
    100 亿，使用二分法来查找也只不过需要 34 次就能猜到正确的结果。


    你可能觉得，猜数字只是一个游戏，能有什么用处呢？其实能用到二分法的搜索问题在生活中非常常见。


    ![](img/3-5.jpg)


    图 3-5　桃子的猜数字算法


    我们可以再设想这样一个场景：期末考试结束，老师给了你一沓试卷，请你帮忙找出考 90 分的同学。这些试卷已经整理过了，按照分数从小到大排列，并且每张试卷的分数都不同。聪明的你可能翻几下、扫一眼很快就能找到。可惜计算机没有扫一眼的功能，而且如果我们手里不是几十张试卷，而是几十万张呢？在大数据时代，几十万量级的数据只是小儿科而已。


    假设有 10 张试卷，分数分别是 35、56、58、60、74、80、83、88、90 和 96。按照编程的习惯，我们给它们编号 0～9。我们来看看如何使用二分法找到
    90 分的试卷。


    我们先选择最中间的试卷，不过 10 是个偶数，中间有两个数，我们可以随意选择其中之一，这里选择较小的一个，也就是第 5 张试卷，编号为 4，是 74 分。90
    比 74 大，说明 90 分试卷在编号 4 的右侧，也就是目标试卷是编号 5～9 中的一张，如图 3-6 所示。


    ![](img/3-6.jpg)


    图 3-6　90 分的试卷在编号 4 的右侧


    我们现在选择后 5 张试卷的中间第 8 张试卷，编号 7，是 88 分，那么 90 分试卷在 88 分试卷的右侧，这样只剩下两张试卷 8 号和 9 号了。


    两张试卷的中间没有其他试卷，我们仍选较小的那张，也就是编号 8，刚好就是 90 分的试卷。这样我们通过 3 次判断，就找到了目标。如果我们一个一个地找，运气好的时候可能只要
    2 次就能找到目标；可运气不好猜错了方向，就要 9 次才能找到目标。


    不过，像上面这样的思路，计算机是无法执行的。想要让计算机看懂算法，必须要用程序语言。如何把这个过程变成程序呢？如何用程序语言表达选择中间的试卷呢？


    程序 3.1 可以根据二分法的思想，从排好顺序的试卷中，找到你要找的试卷。运行程序后，程序会要求你输入想要查找的分数，按 Enter 键确认后，会得到它的位置。如果输入
    35，则会返回 0。你可以在配套资源网站上找到写好的程序文件。


    程序 3.1　二分法


    '
