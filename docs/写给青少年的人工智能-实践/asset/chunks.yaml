    \n![](Images/1-21.png)\n\n图1-21　“Shell”区域\n\n如果你觉得“Shell”区域太小，可以将鼠标指针移动到分界线上，待其变成像图1-21中这样的上下箭头，就可以通过上下拖动箭头来改变“Shell”区域的大小了。\n\
    \nThonny比IDLE更加美观，还有一些便捷功能。虽然Thonny 3.3.13版本自带的Python（3.7.9）不是最新的版本，但是这并不影响你编写本书的程序。你也可以同时安装原生Python的IDLE和Thonny，在默认情况下，它们互不影响。\n\
    \n## 照猫画虎学Python\n\n如果你学过Python语言，就再好不过了，你完全可以跳过本节内容，直接阅读第2章。如果你没有接触过Python语言，也不用担心，因为接下来我们会简明扼要地介绍Python语言的基本用法。\n\
    \n不过，本书的目的不是面面俱到地介绍Python语言。我们会简单地讲述后文要用到的Python基础功能，而不会完整地讲述这门语言的方方面面。如果你想真正深入完整地学习Python语言，那么最好再选择一本专门的Python图书，或者系统学习一些Python课程。\n\
    \n学习绘画或书法，往往是从临摹开始的；做数学题，也总要先研究例题；学习Python或者其他编程语言，也可以从模仿开始。本书会给出一些示例代码，以供你复制到自己的计算机上，并思考为什么这样的代码会得到这样的结果。\n\
    \n程序是非常严谨的语言，所以如果你是第一次了解编程，输入时一定要注意，**在复制代码时，输入的内容一定要和书中代码完全一样**。**不论是字母还是符号，都要在英文状态下输入**，否则程序可能会出现错误。\n\
    \n理解了书中给出的例子，你就可以对这些代码进行一定的修改，然后推测修改后的结果，最后运行程序，看看和你的推测是否一样。如果你能按照自己的想法修改代码，得到想要的结果，就说明你基本掌握了所用到的知识点。\n\
    \n由于我们的目的不是全面地学习Python，因此书中的示例代码会尽可能少地使用Python的各种特性，所以每一段代码都可以进一步改进。等你对Python有了更多的了解，再尝试优化书中的程序吧！\n\
    \n## Python初体验——Hello world\n\n新手程序员们编写的第一个程序通常是“在屏幕上输出`Hello world`”。\n\n在Python中，要完成这个操作非常容易。**在IDLE或Thonny的Shell（交互模式）中**，按照程序1.1输入代码，然后按Enter键运行程序并查看效果。其中，“`>>>`”是已显示在Shell窗口中的，不需要输入。**注意，请在英文输入法状态下输入引号**。请仔细观察你输入的英文引号和中文引号，看看是不是不太一样？\n\
    \n**注：**由于不同计算机上安装的字体库可能不同，你看到的引号的样子可能会和本书上出现的有所区别，请以实际情况为准。\n\n程序1.1　输出Hello\
    \ world\n\n```\n>>> print(\"Hello world\")\n```\n\n如果没有输入错误，那么“Shell”区域会在下一行显示：\n\
    \n```\nHello world\n```\n\n效果如图1-22和图1-23所示。\n\n![](Images/1-22.png)\n\n图1-22　IDLE交互模式的“Hello\
    \ world”\n\n![](Images/1-23.png)\n\n图1-23　Thonny交互模式的“Hello world”\n\n如果你看到了图1-24中的红色提示，那么说明代码编写有误。提示的意思是说`pirnt`这个名字没有被定义，这是由拼写错误导致的，`print`错拼成了`pirnt`。\n\
    \n![](Images/1-24.png)\n\n图1-24　代码拼写错误\n\n如果你使用Thonny，就会在Thonny界面右侧的助手窗口看到更清晰的英文提示。如果觉得提示用处不大，也可以单击“×”关掉它。\n\
    \n在后文中，如果要在Shell（交互模式下）区域中运行程序，我们也会用`>>>`作为前缀来表示输入的代码，而没有前缀的就是显示的结果。也就是说，你在本书中看到的内容和你在计算机的Shell区域中看到的内容大致相同。\n\
    \n`print()`这段代码的作用是把括号中的内容显示到屏幕上。这样有特定功能的代码称为**函数**，括号中的内容就是**函数的参数**。你可能还注意到了，`Hello\
    \ World`外面还有一对引号，但这对引号并没有显示在屏幕上。引号表示`Hello World`是一个字符串，就像我们写在纸上的字一样，如图1-25所示。\n\
    \n![](Images/1-25.jpg)\n\n图1-25　函数的构成\n\n你也可以把引号中的内容换成别的内容试试效果，比如把英文换成数字或中文，如程序1.2所示。\n\
    \n程序1.2　print()练习\n\n```\n>>> print(\"1+1=2\")\n1+1=2\n>>> print(1+1)\n2\n>>>\
    \ print(\"你好，世界。\")\n你好，世界。\n>>> print(3,\"Python\",3+8)\n3 Python 11\n```\n\n\
    注意，**引号一定是成对出现的**，引号之间可以包含中文符号。如果想一次显示多个内容，可以用“,”（英文逗号）分隔，相应地，这些内容在显示时会被空格分隔开。\n\
    \n## 自动补全功能\n\n无论是IDLE还是Thonny，都支持代码的**自动补全**/**自动完成**功能。只要你输入代码词汇（如`print`）的一部分，然后按键盘上的Tab键，Python就可以自动把单词补充完整。注意，**自动补全功能针对的是代码词汇**，而不是英语词汇。\n\
    \n对于只有一种补全方式的情况，比如当你输入`pri`（只能被补全成`print`）并按下Tab键，Python会直接把它变成`print`。如果有多种补全方式，比如只输入`pr`并按下Tab键，就会弹出候选菜单，让你选择采用哪种方式补全，如图1-26所示。你可以用鼠标选择需要的选项，不过更常用、更方便的方法是用键盘的上下键选择，然后按Tab键确认（IDLE中需要按两次Tab键确认）。自动补全功能大大提高了我们的输入效率，也减轻了我们记住那些复杂的Python代码词汇的负担，还能减少拼写错误（也许你已经有过把`print`错拼成`pirnt`的经历了）。\n\
    \n![](Images/1-26.png)\n\n图1-26　IDLE Shell的自动补全功能\n\n## Python中的空格\n\n在“Shell”区域输入代码时，如果你看到了像下面一样的错误提示，那么通常是由在代码的开头不小心输入了**空格**所导致的。\n\
    \n```\n这里多了一个空格\n   ↓\n>>>  print(1)\n  File \"<stdin>\", line 1\n    print(1)\n\
    \    ^\nIndentationError: unexpected indent\n```\n\n其实Python语言中，每行开头的空格非常重要，因为它决定了程序的**逻辑关系**。在Shell中，我们一般不需要在开头输入空格。\n\
    \n## 用Python作为计算器\n\n计算机最基础的功能就是**计算**。常见的数学运算都可以用Python语言运行，因此你完全可以把Python当成计算器来使用。程序1.3就是**数学运算符**在Python中的写法。\n\
    \n程序1.3　数学运算符示例\n\n```\n>>> 10 + 20                        # 加法 +\n30\n>>> 10\
    \ – 20                        # 减法 -\n-10\n>>> 10 * 20                       \
    \ # 乘法 ×\n200\n>>> 9 / 2                          # 除法 ÷\n4.5\n>>> 10 % 3    \
    \                     # 返回除法的余数，在编程中通常称为取模\n1\n>>> 2 ** 3                    \
    \     # 幂（乘方），2^3\n8\n>>> 9 // 2                         # 向下整除，得到小于商4.5的最大整数4\n\
    4\n>>> -9 // 2                        # 得到小于商-4.5的最大整数-5\n-5\n```\n\n除了加减乘除，比较大小同样是常用的数学运算，这就要用到**比较运算符**。比较运算的结果不是数字，而是逻辑上的真（`True`）和假（`False`），如程序1.4所示。`True`和`False`同样是一种数据，也可以储存在变量中。在后文介绍Python中的数据类型时，我们会进一步介绍Python中逻辑上的真和假。\n\
    \n程序1.4　比较运算符示例\n\n```\n>>> 2 > 1                 # 判断是否大于 ，2>1得到真\nTrue\n>>>\
    \ 2 < 1                 # 判断是否大于，2<1得到假\nFalse\n>>> 3 >= 3                # 判断是否大于或等于≥，3等于3所以3>=3得到真\n\
    True\n>>> 3 <= 3                # 判断是否小于或等于≤\nTrue\n>>> 3 == 3               \
    \ # 判断是否相等\nTrue\n>>> 3 != 3                # 判断是否不相等，3等于3所以得到假\nFalse\n>>> 3\
    \ != 4                # 3不等于4，所以得到真\nTrue\n```\n\n还有一种运算是**逻辑运算**，也就是真和假两种逻辑值之间的计算。在《写给青少年的人工智能\
    \ 发展》一书中，我们介绍过逻辑运算“异或”。本书常用的逻辑运算有三种，分别是**逻辑与（`and`）**、**逻辑或（`or`）**和**逻辑非（`not`）**。\n\
    \n逻辑与（`and`）的含义类似于我们平时说话时的“且”。如果我们说“禾木是编程比赛冠军且桃子是数学比赛冠军”，那么两件事都是真的，这句话才是真的。也就是说，**逻辑运算`A\
    \ and B`，必须`A`和`B`都是`True`，才能得到`True`，否则就得到`False`。**\n\n逻辑或（`or`）就是日常用语中的“或”。“禾木是编程比赛冠军或桃子是数学比赛冠军”，那么不管是禾木是冠军、桃子是冠军，还是两个人都是冠军，只要两个冠军有一个是真的，这句话就是真的。也就是说，**对于逻辑运算`A\
    \ or B`，只要`A`和`B`中有任意一个是`True`，结果就是`True`。只有`A`和`B`都是`False`，结果才是`False`。**\n\n\
    逻辑非（`not`）的含义很简单，就是得到一件事是真假的相反值。**对于`not A`，如果`A`是`True`，那么结果就是`False`，反之结果就是`True`。**逻辑运算符的示例如程序1.5所示。\n\
    \n程序1.5　逻辑运算符示例\n\n```\n>>> 2 > 1 and 2 < 1       # 逻辑与and，\"真and假\"得到假\nFalse\n\
    >>> 2 > 1 and True\nTrue\n>>> 2 > 1 or 2 < 1        # 逻辑或or，\"真or假\"得到真\nTrue\n\
    >>> x = False\n>>> not x                 # 逻辑非not，\"not假\"得到真\nTrue\n```\n\n在Python中，除了这些最基本的运算符，还有很多其他运算符，如果后面用到，我们会再进行介绍，你也可以自行查阅有关资料。\n\
    \n像数学运算要先算乘除、后算加减一样，Python运算符也有**运算顺序**，在编程中我们一般称为**优先级**。表1-2列出了常用运算符的优先级，从上到下，优先级依次下降，同一行优先级相同。\n\
    \n表1-2　常用运算符的优先级\n\n| 运算符 || 优先级描述 |\n\n| --- | --- |\n\n| `**` || 幂 (优先级最高) |\n\
    \n| `*, /, %, //` || 乘，除，求余数和取整除 |\n\n| `+, -` || 加法，减法 |\n\n| `<=, <, >, >=`\
    \ || 判断大小的运算符 |\n\n| `==, !=` || 判断是否相等的运算符 |\n\n| `=` || 赋值运算符(后文会进行介绍) |\n\n\
    | `not，and，or` || 逻辑运算符 |\n\n另外，和数学一样，**括号中的内容是最先被计算的**。如果你不确定运算符会先算哪一个，那么最好的方法就是加括号。不过在Python中，起到这个作用的只有**圆括号`()`**，也就是数学中的小括号。所以如果你想表达的运算逻辑比较复杂，可能就需要括号套括号来上好几层，这种时候就免不了有些眼花。比如下面这样（结果是34359738368.0）：\n\
    \n```\n18//((1+2)*3/4**((1+3)*5-3))\n```"
  fmt: "\n# Python 安装与入门\n\n## 安装 Python\n\n安装Python最简单的方法是直接从官网进行下载。打开Python官方网站，将鼠标指针移动到“Downloads”上，这时界面上会自动显示最新稳定版Python的下载按钮，并根据你的计算机安装的是Windows系统还是macOS系统自动匹配。在编写本书时，适合**Windows\
    \ 10系统**的Python最新稳定版本是3.9.6。单击“Python 3.9.6”按钮即可下载，如图1-3中的橙色箭头所示。\n\n![](Images/1-3.png)\n\
