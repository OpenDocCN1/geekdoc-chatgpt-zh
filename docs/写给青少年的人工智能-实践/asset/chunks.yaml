    ## Python人工智能库


    在第3章中，我们介绍了几个简单的人工智能入门算法，看起来好像并不复杂。但是对于效果更好的人工智能，程序的代码一般要复杂得多，而且涉及更高深的数学、编程知识。无数科学家付出了几十年的努力，才让人工智能变得像现在这么“聪明”。对于刚开始接触人工智能编程的初学者来说，那些算法有些过于复杂了。


    不过，我们不需要一开始就深入掌握每一行人工智能代码。为了方便人们使用，很多人工智能开发者编写了大量人工智能库，而Python的一大优势就是可以方便地调用这些库。这也是Python现在被称为“人工智能语言”的重要原因之一。这些人工智能库就像一个个零件，只要我们合理利用，就可以顺利在它们的基础上组装成完整的人工智能程序。


    支持Python语言的著名人工智能库包括**OpenCV、TensorFlow、PyTorch、Keras**等。


    ## 使用OpenCV进行人脸识别


    图像的检测与识别，或者更广泛地说计算机视觉，是人工智能领域最重要的课题之一。


    这可能也是我们日常生活中最常见的人工智能应用之一——你或者爸爸妈妈的手机，说不定就是利用人脸识别解锁的。想不想实现一个属于自己的人脸识别程序呢？下面我们就一起来试试！


    在计算机视觉领域，最著名的人工智能库当属**OpenCV**。它的全称是Open Source Computer Vision Library，可以在多个平台使用。OpenCV由英特尔公司发起并参与开发，以BSD许可证授权开源发行，可以在商业和研究领域中免费使用。OpenCV可用于开发实时的图像处理、计算机视觉以及模式识别程序。像图像检测、人脸识别等常见的功能，都可以利用OpenCV来实现。


    ### 安装OpenCV


    我们需要安装包含扩展模块的OpenCV。你可以先尝试使用`pip`命令直接安装：


    ```

    pip install opencv-contrib-Python

    ```


    如果安装遇到问题，有可能是因为pip的版本太低，你可以用如下命令升级：


    ```

    pip install -- upgrade pip

    ```


    使用Thonny的同学在包管理中搜索opencv-contrib-Python安装。


    安装完OpenCV后，我们就可以利用它来构建自己的人工智能应用了。


    ### 利用OpenCV进行人脸识别


    人脸识别是我们最常遇到的计算机视觉问题，OpenCV可以利用神经网络深度学习来实现人脸识别。那么，怎样才能编写程序，让计算机“认出”你的脸呢？


    在《写给青少年的人工智能　发展》和《写给青少年的人工智能　应用》这两本书中我们提到，**想要利用机器学习认出特定的人脸，需要用大量人脸照片对人工智能程序进行训练，让程序从照片数据中发现规律，提取出这张脸中独一无二的特征，进行学习**。


    那么，如何获取大量的人脸照片呢？用相机一张张拍摄，然后手动剪裁出脸部图片，这种方法显然太麻烦了。其实，我们可以**利用计算机的摄像头来自动获取人脸数据**。


