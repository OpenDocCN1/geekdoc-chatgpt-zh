    ## 活动五：程序实现


    ### 1.


    用Python的OpenCV库来实时跟踪小球。先安装这个库。


    `sudo apt-get update`


    `sudo apt-get install python-opencv`


    ### 2.


    本程序还利用树莓派附带的`gpiozero`库，根据OpenCV库确定球的x坐标来转动电机。该代码能够根据黄色来确定球的位置，所以黄色是背景中独一无二的，否则无效。向程序提供较低和较高的颜色范围，以便确定球的位置。


    ### 3.


    OpenCV使用调用`inRange()`函数的原理为：当前帧（来自网络摄像头）以及下部和上部颜色边界。确定框架上球的坐标后，如果球不在中心（640像素宽框架中x坐标范围为240～400），程序将告诉电机转动。如果球偏离中心，则马达将加快转动，而当球更靠近中心时，马达将减少转动。完整代码如下：


