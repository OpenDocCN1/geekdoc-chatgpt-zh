    ![](images/txt009_1.jpg "pagenumber_ebook=43,pagenumber_book=35")


    在比赛直播或一些需要实时追踪目标物体的拍摄场合，有一台智能化的摄像设备将是非常有用的。本教程将简单说明如何用树莓派、摄像头和机械设备来DIY一套具有180°跟踪拍摄小球功能的智能摄像头。


    ## 活动一：所需器材


    树莓派、`L298N` H-Bridge电机驱动板、电机齿轮箱、USB网络摄像头、跳线、螺母螺丝、齿轮、环氧胶／热熔胶、激光发射器（可选）。


    ## 活动二：组建装配


    ### 1.


    用一块木料，将电机安装到上面，不要安装到中间的位置。然后，在电机上安装一个小齿轮。齿轮上的孔可能需要扩大以便与电机配件匹配，如图1-8-1所示。


    ![](images/txt009_2.jpg "pagenumber_ebook=44,pagenumber_book=36")


    图1-8-1　板材与电机安装图


    ### 2.


    安装大齿轮（可以松动），使大齿轮的齿与小齿轮的齿相连接。为加强粘合性，用砂纸打磨木板，然后使用热熔胶将其安装到位，如图1-8-2所示。


    ![](images/txt009_3.jpg "pagenumber_ebook=44,pagenumber_book=36")


    图1-8-2　齿轮安装


    ### 3.


    将网络摄像头安装到大齿轮上。


    在这里，先将网络摄像头的外壳移除，并仅使用网络摄像头的核心电路板，以便安装。使用环氧胶将网络摄像头粘合起来，加强牢固性。


    ### 4.


    最后安装的组件是可选项——`L298N` H-Bridge电机驱动板。


    只需在电路板上钻四个孔并使用机械螺钉和六角螺母安装到电路板上即可。


