    # 项目四　点亮我的小灯泡


    本项目中，我们将使用树莓派控制双色发光二极管（LED）。项目虽小，但可以帮助我们理解树莓派操作外接硬件的基本原理。


    ## 活动一：所需器材


    本项目所需器材如下：


    Raspberry Pi主板1个、树莓派电源适配器1个、40P软排线一根、双色LED灯模块1个、面包板1个、跳线若干。


    双色发光二极管（LED）能够发出两种不同颜色的光，通常是红色或蓝色。它有三个针脚，供阴极、阳极和接地使用，双色LED灯有两个LED端子或引脚，它以反平行方式排列在电路中并通过阴极/阳极连接，正电压可以指向LED端子之一，使该端子发出相应颜色的光，当电压方向反转时，发出另一种颜色的光。在双色LED灯中，一次只能一个引脚接受电压，因此，这种LED灯经常用作各种设备（如电视节、数码相机或遥控器）的指示灯。


