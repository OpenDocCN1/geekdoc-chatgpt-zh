    # 项目六　智能避障小车


    ## 第一节　概念与原理

    智能小车是一种能够通过编程手段完成特定任务的小型化机器人，它具有制作成本低廉，电路结构简单，程序调试方便等优点。智能小车具有很强的趣味性，深受广大机器人爱好者以及学生的喜爱。

    本章主要讲述如何设计制作一款智能避障小车。小车避障通过安装在小车上的超声波传感器获取前方障碍物距离从而决策绕开障碍物，达到避障目的。


    ## 活动一：超声波传感器简介

    ### （1）超声波测距原理

    超声波工作原理如图 2-6-1 所示。超声波模块包含一个发射端和一个接收端，超声波发射端发射出超声波信号，然后超声波电路模块开始进行时间计算，超声波信号在空气中以大约
    340m/s 的速度进行传播，当超声波信号遇到有障碍物的情况下，超声波经过障碍物反射，超声波接收模块会接到一个反射信号。当收到反射信号后，停止计时，总共发送到接收到反射信号用时为`t`。笔者设超声波模块离障碍物距离为`H`，超声波在空气中经过反射总共传播距离为`2L`，我们可以通过测出超声波发射端到超声波接收端的距离是`2M`。根据图
    2-6-1 所示的超声波工作原理，不难得出以下三个公式①②③。


    ![](img/txt016_1.jpg "pagenumber_ebook=74,pagenumber_book=66")


    ![](img/txt016_2.jpg "pagenumber_ebook=75,pagenumber_book=67")

    通过①②式子可以计算出③式，障碍物离所在距离为`H`。由于超声波发射器和超声波接收器之间的距离很短，所测障碍物距离越远，那么`L`更趋向于`H`。避障机器人本身要求精度不是很高，所以在这里，我们直接忽略超声波发射器和接收器之间的距离`2M`，可以得出障碍物距离为`H
    = v * t / 2`。


    ![](img/txt016_3.jpg "pagenumber_ebook=75,pagenumber_book=67")

    图 2-6-1　超声波工作原理


    ### （2）HC-SR04 超声波传感器

    本章避障小车使用`HC-SR04`超声波传感器。工作原理如下：

    （1）采用`I/O`口`TRIG`触发测距，给至少 10us 的高电平信号。

    （2）模块自动发送 8 个 40khz 的方波，自动检测是否有信号返回。

    （3）有信号返回，通过`I/O`口`ECHO`输出一个高电平，高电平持续的时间就是超声波从发射到返回的时间。测试距离=（高电平时间\*声速（340M/S））/2。

    （4）本模块使用方法简单，一个控制口发一个 10US 以上的高电平，就可以在接收口等待高电平输出。一有输出就可以开定时器计时，当此口变为低电平时就可以读定时器的值，此时就为此次测距的时间，方可算出距离。如此不断的周期测，即可以达到你移动测量的值。


    ![](img/txt016_4.jpg "pagenumber_ebook=75,pagenumber_book=67")

    图 2-6-2　`HC-SR04`超声波传感器

    `HC-SR04`超声波测距模块具有一个超声波发射器、接收器和控制电路组成，由单片机（`Arduino`）给`TRIG`口大于 10us 的高电平信号来触发测距。超声波测量传感器到障碍物的距离=高电平持续时间\*声音速度/2。


    表 2-6-1　`SR04`技术参数


