    # 项目三　树莓派的GPIO口介绍


    树莓派与其他的开发板不同，它有40个GPIO接口引脚可以用来进行外部扩展。GPIO指的是General Purpose Input Output（通用输入/输出），这些接口引脚，是树莓派与其他硬件连接的桥梁。


    ## 第一节　40P排线引脚介绍


    树莓派GPIO排线引脚的定义，如图1-3-1所示。


    ![](images/txt004_1.jpg "pagenumber_ebook=27,pagenumber_book=19")


    图1-3-1　树莓派GPIO排线引脚介绍


    ### 活动一：引脚介绍


    我们对图1-3-1引脚重新进行一下分类，如图1-3-2所示。


    ![](images/txt004_2.jpg "pagenumber_ebook=28,pagenumber_book=20")


    图1-3-2　树莓派GPIO引脚功能介绍


    图1-3-2中，树莓派引脚的编号方法有三种：第一，根据引脚的物理位置标号；第二，由C语言GPIO库`wiringPi`指定的编号；第三，由BCM2837SOC指定的编号。


    如果我们想基于`wiringPi`库以C语言控制树莓派GPIO，就需要选择`wiringPi`指定的引脚编号，从图1-3-2可以看出，`wiringPi`中`GPIO.0`对应的物理编号的引脚是11。`wiringPi`库是一个用C语言编写的GPIO访问库，使用之前需要安装。


    如果我们要使用Python语言控制树莓派GPIO，则要使用`RPi.GPIO`。这个库提供的API，可以对GPIO进行编程。简言之，`RPi.GPIO`是一个可以控制树莓派GPIO通道的模块，该模块默认已安装到了系统中，因此可以直接使用。Python支持两种引脚编号Board
    Pin和BCM GPIO。


    如果要使用物理（BOARD）编号，可以将引脚编号指定为“`BOARD11`”。


    在编写程序前，我们需要设置GPIO接口编号类型，常用的是下面两种：


    `GPIO.setmode(GPIO.BOARD)`　#设置GPIO模式为BOARD


    `GPIO.setmode(GPIO.BCM)`　#设置GPIO模式为BCM


    如果树莓派系统中没有安装`RPi.GPIO`库，我们可以登录树莓派之后，在终端中执行：


    `sudo apt update`，该命令将升级整个系统。升级完成后，我们再安装Python3中的RPI.GPIO模块，同样在命令行中执行：`sudo apt
    install python3-gpiozero`即可。


