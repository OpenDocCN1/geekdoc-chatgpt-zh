    )\n\n图1-8-3　摄像头安装\n\n2.使用两根导线将L298NH的5V和接地线与树莓派的5V和接地线与电源相连接，如图1-8-4所示。\n\n3.使用两根母对母跳线将L298N分别连接到树莓派的引脚17和18上，如图1-8-5所示。\n\
