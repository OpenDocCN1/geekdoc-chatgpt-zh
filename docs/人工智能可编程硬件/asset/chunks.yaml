    # 项目八 简易摄像头追踪系统


    ![](img/txt009_1.jpg "pagenumber_ebook=43,pagenumber_book=35")


    在比赛直播或一些需要实时追踪目标物体的拍摄场合，有一台智能化的摄像设备将是非常有用的。本教程将简单说明如何用树莓派、摄像头和机械设备来 DIY 一套具有 180°跟踪拍摄小球功能的智能摄像头。


    ## 活动一：所需器材


    树莓派、`L298N` H-Bridge 电机驱动板、电机齿轮箱、USB 网络摄像头、跳线、螺母螺丝、齿轮、环氧胶／热熔胶、激光发射器（可选）。


    ## 活动二：组建装配


    ### 1.


    用一块木料，将电机安装到上面，不要安装到中间的位置。然后，在电机上安装一个小齿轮。齿轮上的孔可能需要扩大以便与电机配件匹配，如图 1-8-1 所示。


    ![](img/txt009_2.jpg "pagenumber_ebook=44,pagenumber_book=36")


    图 1-8-1　板材与电机安装图


    ### 2.


    安装大齿轮（可以松动），使大齿轮的齿与小齿轮的齿相连接。为加强粘合性，用砂纸打磨木板，然后使用热熔胶将其安装到位，如图 1-8-2 所示。


    ![](img/txt009_3.jpg "pagenumber_ebook=44,pagenumber_book=36")


    图 1-8-2　齿轮安装


    ### 3.


    将网络摄像头安装到大齿轮上。


    在这里，先将网络摄像头的外壳移除，并仅使用网络摄像头的核心电路板，以便安装。使用环氧胶将网络摄像头粘合起来，加强牢固性。


    ### 4.


    最后安装的组件是可选项——`L298N` H-Bridge 电机驱动板。


    只需在电路板上钻四个孔并使用机械螺钉和六角螺母安装到电路板上即可。


    ## 活动三：设备连线


    ### 1.


    将电机的两根电线直接连接到电路板左侧或右侧两个端口连接器之一的`L298N` H-Bridge 电机驱动板上（如图 1-8-3 所示，图中选择了左侧）。


    ![](img/txt009_4.jpg "pagenumber_ebook=45,pagenumber_book=37")


    图 1-8-3　摄像头安装


    ### 2.


    使用两根导线将`L298N` H 的 5V 和接地线与树莓派的 5V 和接地线与电源相连接，如图 1-8-4 所示。


    ### 3.


    使用两根母对母跳线将`L298N`分别连接到树莓派的引脚 17 和 18 上，如图 1-8-5 所示。


    ![](img/txt009_5.jpg "pagenumber_ebook=45,pagenumber_book=37")


    图 1-8-4　线路连接


    ![](img/txt009_6.jpg "pagenumber_ebook=45,pagenumber_book=37")


    图 1-8-5　线路连接


    ### 4.


    将网络摄像头连接到树莓派的其中一个 USB 端口上，如图 1-8-6 和图 1-8-7 所示。


    ![](img/txt009_7.jpg "pagenumber_ebook=45,pagenumber_book=37")


    图 1-8-6　线路连接


    ![](img/txt009_8.jpg "pagenumber_ebook=45,pagenumber_book=37")


    图 1-8-7　整体效果图


    至此，所有的布线与安装就已完毕。


    ## 活动四：摄像头配置


    ### 1.


    首先升级树莓派系统并应用最新的固件。可以输入以下命令来操作：


    `sudo apt-get update`或者`sudo apt-get upgrade`


    ### 2.


    运行树莓派配置工具来激活摄像头模块：


    `sudo raspi-config`


    选中 Interfacing options，将 camera 选为 enable。


    ### 3.


    拍照


    用`raspistill`命令进行拍照，命令格式为：`raspistill -o ceshi.jpg`


    ## 活动五：程序实现


    ### 1.


    用 Python 的 OpenCV 库来实时跟踪小球。先安装这个库。


    `sudo apt-get update`


    `sudo apt-get install python-opencv`


    ### 2.


    本程序还利用树莓派附带的`gpiozero`库，根据 OpenCV 库确定球的 x 坐标来转动电机。该代码能够根据黄色来确定球的位置，所以黄色是背景中独一无二的，否则无效。向程序提供较低和较高的颜色范围，以便确定球的位置。


    ### 3.


    OpenCV 使用调用`inRange()`函数的原理为：当前帧（来自网络摄像头）以及下部和上部颜色边界。确定框架上球的坐标后，如果球不在中心（640 像素宽框架中
    x 坐标范围为 240～400），程序将告诉电机转动。如果球偏离中心，则马达将加快转动，而当球更靠近中心时，马达将减少转动。完整代码如下：


    ![](img/txt009_9.jpg "pagenumber_ebook=46,pagenumber_book=38")


    ![](img/txt009_10.jpg "pagenumber_ebook=47,pagenumber_book=39")


    ![](img/txt009_11.jpg "pagenumber_ebook=48,pagenumber_book=40")


    关键说明：如果使用本代码，那就必须安装 OpenCV 库。此外，如果电机转向错误，只需将`L289N`的电线反转，或反转控制 GPIO 连接到树莓派的线。


    # 软件篇用 MicroPython 打开智能开发的大门


    # 项目一 MicroPython 是什么


    ## 第一节 MicroPython 概述


    `MicroPython`是 Python 3 编程语言的精简高效实现，它包括 Python 标准库的一部分，并且经过优化，可在微控制器中运行。通俗地讲，`MicroPython`就是“微型
    Python”语言，也可以称为“浓缩版的 Python”语言。它基于 ANSI C，语法跟 Python3 保持一致。使用`MicroPython`，用户完全可以通过
    Python 脚本语言实现硬件底层的访问和控制，比如控制 LED 灯、LCD 显示器、读取电压、控制电机、访问 SD 卡、摄像头等。


    ## 第二节 支持 MicroPython 的开发板


    `MicroPython`从诞生起就被外界广泛关注，支持`MicroPython`的开发板也应运而生。市面上主流开发板有：Pyboard、Micro：bit、`ESP8266`和`STM32`等等。


    随着`MicroPython`广泛应用，我国技术人员也开始仿照国际流行的开源开发板 Pyboard 制作自己的开发板。目前，国内最流行的开发板非 TPYBoard
    莫属。`TPYBoard`开发板的功能和 Pyboard 类似，也是采用`STM32`作为 MCU（控制器，也称为单片机），具有 4 个 LED 灯以及一个加速度传感器。目前，我国
    TPYBoard 衍生出多个版本，包括`STM32`标准版、基于 LAN 的有线版、基于`ESP8266`的无线版本。


    ### （1）STM32 标准版 TPYBoard V10X 系列


    ![](img/txt011_1.jpg "pagenumber_ebook=50,pagenumber_book=42")


    图 2-1-1　TPYBoard V102 开发板


    ![](img/txt011_2.jpg "pagenumber_ebook=50,pagenumber_book=42")


    图 2-1-2　TPYBoard V202 开发板


    该版本非常适用于初学者。本书将围绕`TPYBoard V102`（图 2-1-1）版本进行`MicroPython`开源硬件开发的讲解。


    ### （2）基于网络的 TPYBoard V20X 系列


    `TPYBoard V20X`（图 2-1-2）为网络系列版本，适合物联网设备开发。建议有一定`MicroPython`开发基础者使用。V20X 版本使用需要开发人员懂得
    Socket 编程，了解 C/S 通信模式和计算机网络 TCP/IP 协议。`TPYBoard`通过搭载传感器加上 zigbee、Lora、NB-iot、2G、4G
    等通信模块将组成物联网终端设备的典型产品形态，属于典型的`MicroPython`玩转物联网快速开发的利器，共享单车电子锁就是基于物联网开发产品，方便我们的生活出行。


    ### （3）基于 GPS 定位的 TPYBoard V70X


    `TPYBoard V70X`（图 2-1-3）系列开发板支持卫星定位、GPRS 基站定位，使得`TPYBoard`可以直接通过`MicroPython`进行卫星定位开发。


    ![](img/txt011_3.jpg "pagenumber_ebook=50,pagenumber_book=42")


    图 2-1-3　TPYBoard V70X 开发板


    ## 第三节 智能开发的概念


    ### 活动一：智能设备构成


    智能设备主要由两大部分构成：


    一是机械结构系统。比如我们生活中看到的行走机器人，机械结构系统由转动轮子、手臂、摄像头、扬声器等部分组成，每一部分都是一个自由的机械系统。若底座不具备行走机构，则机器人无法移动，若手臂不具备伸展弯曲结构，机器人手臂将无法像人一样活动。机械结构是智能设备的基础。


    二是智能控制系统。机械机构加上传感器就具有感知功能，将感知到的数据反馈微处理器，可以根据感知数据分析指挥执行系统进行相应操作。


    ### 活动二：智能控制系统


    智能控制系统由三大部分构成（图 2-1-4）。控制系统：相当于人的大脑，具有“思考”功能。传感器系统：相当于人的眼、耳、舌头和皮肤，具有感知功能。执行系统：相当于人的手和脚，具有行动功能。


    ![](img/txt011_4.jpg "pagenumber_ebook=51,pagenumber_book=43")


    图 2-1-4　智能控制系统数据传输


    #### （1）微控制器


    控制系统是智能设备的“大脑”，它就像一台微型的家用计算机，可以执行程序指令，并向具体动作器官发出相应的动作信息。智能设备的控制模块上一般都有多个输入接口和输出接口，用于接收外界信息后再将指令发送给机械部件。


    前面我们介绍的`MicroPython TPYBoard`就是微处理器，俗称单片机。单片机是一种集成电路芯片。它已渗透到我们生活的各个领域：导弹的导航装置，飞机上各种仪表的控制，计算机的网络通信与数据传输，工业自动化过程的实时控制和数据处理，广泛使用的各种智能
    IC 卡，民用豪华轿车的安全保障系统，录像机、摄像机、全自动洗衣机的控制，以及程控玩具、电子宠物等等，这些都离不开单片机。


    #### （2）传感器系统


    一个真正的智能设备通常都需要具备一定的感知能力，具有感知能力的电子器件称为传感器，顾名思义，这类器件具备了感应并传递信息到控制器的功能。


    与人的感觉器官一样，构成智能设备的电子传感器也是按功能分类的。例如：光源传感器、声音传感器、气体（烟雾、煤气）传感器、压力传感器、温度传感器等等。它们的灵敏度和感应范围甚至超越了人的感知界限，例如电子指南针、红外线传感器等。


    #### （3）执行系统


    正如人类的身体需由骨架和肌肉牵引才能完成一定的动作一样，机器人的身体和动作表现也是由特定的机械结构组成和完成的。


    # 项目二 使用 TPYBoard 控制板


    ## 第一节 TPYBoard 控制板与电脑的连接


    ![](img/txt012_1.jpg "pagenumber_ebook=53,pagenumber_book=45")


    图 2-2-1　TPYboard V102 与电脑连接


    ![](img/txt012_2.jpg "pagenumber_ebook=53,pagenumber_book=45")


    图 2-2-2　电脑读取 TPYBFLASH 磁盘


    第一步：通过 USB 线连接 MicroPython 开发板和电脑（图 2-2-1）。


    第二步：使用 USB 数据线接入电脑，驱动自动加载完成，连接成功后，可以看到电脑上加载的可移动磁盘（图 2-2-2）。找到“`TPYBFLASH`”磁盘，这个磁盘就开发板内部的
    Flash。可以把开发板当作一个 U 盘一样使用。Flash 磁盘的容量是 95KB，如果需要进行大容量文件处理的话，可以插入 TF 卡来扩容。


    第三步：打开“`TPYBFLASH`”磁盘，查看里面的文件。“`TPYBFLASH`”磁盘中有 4 个文件：`boot.py`、`main.py`、`README.txt`和`tpybcdc.inf`（图
    2-2-3）。

