    回车，即登录进入树莓派，并打开了树莓派的终端命令行，如图1-1-9所示。出现以上界面，说明电脑与树莓派已连接成功。\n\n![](images/txt002_13.jpg\
    \ \"pagenumber_ebook=18,pagenumber_book=10\")\n\n图1-1-9　树莓派登录成功界面\n\n如果没有出现连接成功的界面，我们可能需要关闭树莓派的电源，取出它的储存卡，将储存卡插入其他电脑并打开，然后在储存卡的根目录上，新建一个空白的纯文本文件，名叫ssh。注意，这个名为ssh的文本不能有内容，并且不能有任何后缀名（比如，不能是ssh.txt），将储存卡重新插回树莓派，重启电源，即可按上述步骤重新操作。\n\
    \n活动三：启用树莓派的SSH和VNC服务\n\n其实，上述连接操作不成功，就表明树莓派没有启用SSH服务。启用该服务的方法，就是在树莓派的根目录下新建一个不带后缀名的空白文件，并将其命名为ssh（小写）。\n\
    \nSSH服务允许我们远程通过网络来管理树莓派，VNC服务可以让我们登录树莓派的图形界面，像操作Windows系统一样来操作它。所以，这两个服务必须启用。以下，是启用VNC服务的步骤：\n\
    \n在图1-1-9的终端界面中，输入命令：sudo raspi-config，将进入系统的配置界面。树莓派的系统配置界面，如图1-1-10所示。\n\n![](images/txt002_14.jpg\
    \ \"pagenumber_ebook=18,pagenumber_book=10\")\n\n图1-1-10　树莓派配置界面\n\n在图中选择第9项“Advanced\
    \ Options”，按确定键之后，即可打开整个系统的高级配置选项卡，如图1-1-11所示。\n\n![](images/txt002_15.jpg \"\
    pagenumber_ebook=19,pagenumber_book=11\")\n\n图1-1-11　安装树莓派VNC服务\n\n依次操作：Interfacing\
    \ Options→VNC→Yes。之后系统会提示你是否要安装VNC服务，输入y之后按回车，等待系统自动下载安装完成，一切顺利的话VNC服务就安装成功了！\n\
    \n如果不使用系统配置界面安装VNC，也可以手动直接在图1-1-9的终端界面中输入：sudo apt-get install tightvncserver，回车执行，同样可为整个系统安装上VNC的服务。\n\
    \n活动四：用VNC Viewer登录树莓派的桌面\n\n安装完VNC服务后，我们就可以使用远程桌面工具，登录进入树莓派的桌面环境了。但登录之前，我们需要先临时启动这个服务。同样在图1-1-9的终端界面中，输入：tightvncserver，回车执行，VNC服务就启动了。现在是临时启用这个服务，稍后我们再将这个服务设置为自动启动。\n\
    \n在电脑下载安装VNC Viewer工具，完成安装后打开软件，点击File→New connection，弹出Properties，在VNC Server中输入树莓派对应IP地址以及VNC服务号（服务号可能是：1、2、3，通常是1），Name中可以输入树莓派名字也可以不进行输入，点击OK，如图1-1-12所示。\n\
    \n![](images/txt002_16.jpg \"pagenumber_ebook=20,pagenumber_book=12\")\n\n图1-1-12　用VNC\
    \ Viewer连接树莓派　\n\n![](images/txt002_17.jpg \"pagenumber_ebook=20,pagenumber_book=12\"\
    )\n\n图1-1-13　VNC Viewer连接界面\n\n点OK连接后会出现一个警告，点击continue（继续），然后输入用户：pi与密码：raspberry，即可完成树莓派的连接登录，如图1-1-13所示。\n\
    \n登录之后，我们就进入了树莓派的图形化桌面，如图1-1-14所示。\n\n![](images/txt002_18.jpg \"pagenumber_ebook=20,pagenumber_book=12\"\
    )\n\n图1-1-14　树莓派登录成功界面\n\n刚才我们是临时启用的VNC服务，现在登录进入树莓派的图形界面，我们需要做的第一件事，是将VNC的服务设置为每次开机就自动运行。今后一旦树莓派开机，只要知道树莓派的IP地址（无论是有线网IP还是无线网IP），我们就可以直接从其他电脑上使用“远程桌面连接”工具或者VNC\
    \ Viewer工具，登录到树莓派的桌面。VNC服务的名称是：tightvncserver。我们在系统/home/pi目录下，找到名为“.bashrc”的文件（注意文件名前面有个小点），如果没找到这个文件，请勾选视图菜单下的“显示隐藏内容”，如图1-1-15所示。\n\
    \n![](images/txt002_19.jpg \"pagenumber_ebook=21,pagenumber_book=13\")\n\n图1-1-15　树莓派系统中显示隐藏文件\n\
    \n找到“.bashrc”的文件，用任意文本编辑工具打开它，然后在这个文件的最末添加上一行代码：“tightvncserver&”（注意代码末尾有个空格，然后是一个&符号）。保存文件并退出编辑器，今后启动树莓派，即可自动运行VNC服务。添加代码的步骤，如图1-1-16所示。\n\
    \n![](images/txt002_20.jpg \"pagenumber_ebook=21,pagenumber_book=13\")\n\n图1-1-16　设置VNC服务开机自动运行\n\
    \n\uFEFF\n\n项目二　熟悉树莓派工作环境\n\n![](images/txt003_1.jpg \"pagenumber_ebook=22,pagenumber_book=14\"\
    )\n\n只要启用了VNC的服务tightvncserver，我们无论是通过树莓派的有线网IP还是无线网IP，都能登录到树莓派的桌面图形界面。现在，让我们对树莓派的工作环境稍作了解，并设置好它的无线网络。\n\
    \n第一节　了解树莓派的操作系统\n\n树莓派默认操作系统叫“Raspbain”。该系统是基于Debain操作系统，专门定制开发的小型操作系统。在图形界面下，这个系统的操作方式与Windows系统差别不大。但在命令行下，则比Windows多很多命令与功能。树莓派除了可用“Raspbain”作操作系统外，也可使用Android（安卓）、Ubuntu、CentOS、FreeBSD、Kali（黑客系统）、ArchLinux甚至Windows10做为操作系统。当我们熟悉树莓派之后，完全可以根据自己的需要安装另外的操作系统。\n\
    \n活动一：熟悉系统的桌面环境\n\n整个系统的桌面环境如图1-2-1所示，图中标出了桌面上一些图标的意义。\n\n![](images/txt003_2.jpg\
    \ \"pagenumber_ebook=23,pagenumber_book=15\")\n\n图1-2-1　树莓派桌面环境\n\n现在我们是通过有线网络连接到树莓派上的，连接的步骤就是上节课的内容，但有线连接较麻烦，既然我们已经登录到了树莓派的桌面，我们可以启用树莓派的无线网络，今后我们就可以通过无线网的IP地址访问它的桌面，这样会更方便。请点击无线网络设置图标，启用树莓派的无线网络连接，如图1-2-2所示。\n\
    \n![](images/txt003_3.jpg \"pagenumber_ebook=23,pagenumber_book=15\")\n\n图1-2-2　设置树莓派无线网络\n\
    \n活动二：熟悉系统的开始菜单\n\n系统的开始菜单如图1-2-3所示，先看看这多到让人吃惊的编程工具。\n\n![](images/txt003_4.jpg\
    \ \"pagenumber_ebook=24,pagenumber_book=16\")\n\n图1-2-3　树莓派开始菜单\n\n再看看常用的办公软件（微软的Office与这里的LibreOffice完全兼容）。\n\
    \n![](images/txt003_5.jpg \"pagenumber_ebook=24,pagenumber_book=16\")\n\n图1-2-4　树莓派系统中自带的办公软件\n\
    \n图1-2-5和图1-2-6是系统自带的互联网工具与附件。\n\n![](images/txt003_6.jpg \"pagenumber_ebook=24,pagenumber_book=16\"\
    )\n\n图1-2-5　树莓派系统中的互联网工具　\n\n![](images/txt003_7.jpg \"pagenumber_ebook=24,pagenumber_book=16\"\
    )\n\n图1-2-6　树莓派系统中的附件\n\n第二节　在树莓派上编写程序\n\n我们使用树莓派上的IDLE编程器，用Python语言编写一段简单的“打招呼”程序吧，程序与运行效果，如图1-2-7所示。\n\
    \n![](images/txt003_8.jpg \"pagenumber_ebook=25,pagenumber_book=17\")\n\n图1-2-7　树莓派系统中自带的python编辑器\n\
    \n如果你喜欢使用Scratch编程的话，树莓派为你提供了Scratch与Scratch2两个版本的编程工具，图1-2-8是使用Scratch2编写的一个数学游戏程序。\n\
    \n![](images/txt003_9.jpg \"pagenumber_ebook=25,pagenumber_book=17\")\n\n图1-2-8　利用树莓派系统中自带的scratch2.0软件开发的程序\n\
    \n在树莓派的开始菜单上我们已看到有众多的编程工具，其中的“geany”（图标是一把小水壶），是一款功能强大的编程工具。这款工具简单到可以当成Windows下的“记事本”写点简单的txt文本文档，同时又强大到可以编写几乎常见的所有程序。这款工具支持编写的程序，如图1-2-9所示。\n\
    \n![](images/txt003_10.jpg \"pagenumber_ebook=26,pagenumber_book=18\")\n\n图1-2-9　树莓派系统中自带的geany编辑工具\n\
    \n我们使用geany，也来编写一段“打招呼”的Python程序。在geany中编写完程序之后，可以直接在geany界面下方测试程序的运行情况，如图1-2-10所示。\n\
    \n![](images/txt003_11.jpg \"pagenumber_ebook=26,pagenumber_book=18\")\n\n图1-2-10　使用geany工具编写python程序\n\
    \n\uFEFF\n\n项目三　树莓派的GPIO口介绍\n\n树莓派与其他的开发板不同，它有40个GPIO接口引脚可以用来进行外部扩展。GPIO指的是General\
    \ Purpose Input Output（通用输入/输出），这些接口引脚，是树莓派与其他硬件连接的桥梁。\n\n第一节　40P排线引脚介绍\n\n树莓派GPIO排线引脚的定义，如图1-3-1所示。\n\
    \n![](images/txt004_1.jpg \"pagenumber_ebook=27,pagenumber_book=19\")\n\n图1-3-1　树莓派GPIO排线引脚介绍\n\
    \n活动一：引脚介绍\n\n我们对图1-3-1引脚重新进行一下分类，如图1-3-2所示。\n\n![](images/txt004_2.jpg \"pagenumber_ebook=28,pagenumber_book=20\"\
    )\n\n图1-3-2　树莓派GPIO引脚功能介绍\n\n图1-3-2中，树莓派引脚的编号方法有三种：第一，根据引脚的物理位置标号；第二，由C语言GPIO库wiringPI指定的编号；第三，由BCM2837SOC指定的编号。\n\
    \n如果我们想基于wiringPi库以C语言控制树莓派GPIO，就需要选择wiring-Pi指定的引脚编号，从图1-3-2可以看出，wiringPi中GPIO.0对应的物理编号的引脚是11。wiringPi库是一个用C语言编写的GPIO访问库，使用之前需要安装。\n\
    \n如果我们要使用Python语言控制树莓派GPIO，则要使用RPI.GPIO。这个库提供的API，可以对GPIO进行编程。简言之，RPI.GPIO是一个可以控制树莓派GPIO通道的模块，该模块默认已安装到了系统中，因此可以直接使用。Python支持两种引脚编号Board\
    \ Pin和BCM GPIO。\n\n如果要使用物理（BOARD）编号，可以将引脚编号指定为“BOARD11”。\n\n在编写程序前，我们需要设置GPIO接口编号类型，常用的是下面两种：\n\
    \nGPIO.setmode（GPIO.BOARD）　#设置GPIO模式为BOARD\n\nGPIO.setmode（GPIO.BCM）　#设置GPIO模式为BCM\n\
    \n如果树莓派系统中没有安装RPI.GPIO库，我们可以登录树莓派之后，在终端中执行：\n\nsudo apt update，该命令将升级整个系统。升级完成后，我们再安装Python3中的RPI.GPIO模块，同样在命令行中执行：sudo\
    \ apt install python3-gpiozero即可。\n\n活动二：PRi.GPIO的使用方法\n\n要用Python编程语言使用树莓派的GPIO排线引脚，我们可以按以下步骤来实现：\n\
    \n1.首先导入RPi.GPIO模块：\n\n![](images/txt004_3.jpg \"pagenumber_ebook=29,pagenumber_book=21\"\
    )\n\n2.引入之后，就可以使用GPIO模块的函数了。如果你想检查模块是否引入成功，可以测试一下：\n\n![](images/txt004_4.jpg\
    \ \"pagenumber_ebook=29,pagenumber_book=21\")\n\nRPi.GPIO模块安装成功，我们就可以使用这个模块来控制树莓派的GPIO引脚，引脚与其他的硬件连接，我们就可以控制其他硬件的运行状态了。我们运行下面的代码试试吧（按Ctrl+C组合键可关闭本程序）！\n\
    \n![](images/txt004_5.jpg \"pagenumber_ebook=29,pagenumber_book=21\")\n\n\uFEFF\
    \n\n项目四　点亮我的小灯泡\n\n本项目中，我们将使用树莓派控制双色发光二极管（LED）。项目虽小，但可以帮助我们理解树莓派操作外接硬件的基本原理。\n\
    \n活动一：所需器材\n\n本项目所需器材如下：\n\nRaspberry Pi主板1个、树莓派电源适配器1个、40P软排线一根、双色LED灯模块1个、面包板1个、跳线若干。\n\
    \n双色发光二极管（LED）能够发出两种不同颜色的光，通常是红色或蓝色。它有三个针脚，供阴极、阳极和接地使用，双色LED灯有两个LED端子或引脚，它以反平行方式排列在电路中并通过阴极/阳极连接，正电压可以指向LED端子之一，使该端子发出相应颜色的光，当电压方向反转时，发出另一种颜色的光。在双色LED灯中，一次只能一个引脚接受电压，因此，这种LED灯经常用作各种设备（如电视节、数码相机或遥控器）的指示灯。\n\
    \n活动二：项目实现\n\n1.传感器原理图\n\n![](images/txt005_1.jpg \"pagenumber_ebook=30,pagenumber_book=22\"\
    )\n\n图1-4-1　双色LED模块内部原理图\n\n2.接线方法\n\n![](images/txt005_2.jpg \"pagenumber_ebook=31,pagenumber_book=23\"\
    )\n\n3.连接实物（如图1-4-2所示）\n\n![](images/txt005_3.jpg \"pagenumber_ebook=31,pagenumber_book=23\"\
    )\n\n图1-4-2　实验接线图\n\n4.代码清单：\n\n用Python代码，控制树莓派点亮LED灯：\n\n![](images/txt005_4.jpg\
    \ \"pagenumber_ebook=31,pagenumber_book=23\")\n\n将上述代码保存为“LED.py”，执行python3 LED.py，即可看到控制效果。按Ctrl+C组合键可关闭本程序。\n\
    \n拓展：\n\n尝试利用PCF8591模块调节LED的亮度\n\n![](images/txt005_5.jpg \"pagenumber_ebook=32,pagenumber_book=24\"\
    )\n\n图1-4-3　PCF8591模块介绍\n\nPCF8591模块说明：PCF8591是单片、单电源、低功耗8位CMOS数据采集器件，具有4个模拟输入、1个输出和1个串行I2C总线接口。3个地址引脚A0、A1和A2用于编程硬件地址，允许将最多8个器件连接至I2C总线而不需要额外硬件。器件的地址、控制和数据通过两线双向I2C总线传输。器件功能包括多路复用模拟输入、片上跟踪和保持功能、8位模数转换和8位数模拟转换。最大转换速率取决于I2C总线的最高速率。\n\
    \n引脚定义：\n\n本模块左边和右边分别外扩2路排针接口，分别说明如下：\n\n左边AOUT芯片DA输出接口\n\n—AINO芯片模拟输入接口0\n\n\
    —AIN1芯片模拟输入接口1\n\n—AIN2芯片模拟输入接口2\n\n—AIN3芯片模拟输入接口3\n\n右边SCL IIC时钟接口接树莓派的scl口\n\
    \n—SDA IIC数字接口接树莓派的sda口\n\n—GND模块地外接地\n\n—VCC电源接口外接3.3V～5V\n\nPCF 8591模组包含了热敏和光敏电阻，模块共有3个红色短路帽，分别作用如下：\n\
    \nP4接上P4短路帽，选择热敏电阻接入电路\n\nP5接上P5短路帽，选择光敏电阻接入电路\n\nP6接上P6短路帽，选择0～5V可调电压接入电路\n\n\
    ![](images/txt005_6.jpg \"pagenumber_ebook=33,pagenumber_book=25\")\n\n图1-4-4　PCF8591内部原理图\n\
    \n本拓展问题的代码，请参看书末资源包下载链接。在使用PCF8591模块之前要开启I2C设置，在默认情况下树莓派没有开启I2C，因此需要我们先做一些操作：\n\
    \n1.Run sudo raspi-config.（运行树莓派的raspi-config配置）\n\n2.Use the down arrow to select\
    \ 5 Interfacing Options（选择第5项接口选项）\n\n3.Arrow down to P5 I2C.（向下选中P5 I2C）\n\n\
    4.Select yes when it asks you to enable I2C（启用I2C）\n\n5.Also select yes if it\
    \ asks about automatically loading the kernel module.（选择“是”，启用加载内核模块）\n\n6.Use\
    \ the right arrow to select the<Finish>button.（选择Finish继续）\n\n7.Select yes when\
    \ it asks to reboot.（重启系统选择“是”）。\n\n\uFEFF\n\n项目五　下雨收衣服了\n\n雨滴探测器用来检测是否下雨或降雨，广泛用于智能照明系统、天窗系统、智能家居系统。今天我们就来做一个小项目：下雨收衣服了。\n\
    \n活动一：所需器材"
  fmt: '

    ## 登录树莓派

    输入密码（`password`）：`raspberry`（输入密码时，屏幕上将不会有任何显示，但密码其实是已经输入了，所以请输入密码时要小心别输错。）


    回车，即登录进入树莓派，并打开了树莓派的终端命令行，如图1-1-9所示。出现以上界面，说明电脑与树莓派已连接成功。


    ![](images/txt002_13.jpg "pagenumber_ebook=18,pagenumber_book=10")


    图1-1-9　树莓派登录成功界面


    如果没有出现连接成功的界面，我们可能需要关闭树莓派的电源，取出它的储存卡，将储存卡插入其他电脑并打开，然后在储存卡的根目录上，新建一个空白的纯文本文件，名叫`ssh`。注意，这个名为`ssh`的文本不能有内容，并且不能有任何后缀名（比如，不能是`ssh.txt`），将储存卡重新插回树莓派，重启电源，即可按上述步骤重新操作。


    ## 活动三：启用树莓派的SSH和VNC服务


    其实，上述连接操作不成功，就表明树莓派没有启用SSH服务。启用该服务的方法，就是在树莓派的根目录下新建一个不带后缀名的空白文件，并将其命名为`ssh`（小写）。


    SSH服务允许我们远程通过网络来管理树莓派，VNC服务可以让我们登录树莓派的图形界面，像操作Windows系统一样来操作它。所以，这两个服务必须启用。以下，是启用VNC服务的步骤：


    在图1-1-9的终端界面中，输入命令：`sudo raspi-config`，将进入系统的配置界面。树莓派的系统配置界面，如图1-1-10所示。


    ![](images/txt002_14.jpg "pagenumber_ebook=18,pagenumber_book=10")


    图1-1-10　树莓派配置界面


    在图中选择第9项“Advanced Options”，按确定键之后，即可打开整个系统的高级配置选项卡，如图1-1-11所示。


    ![](images/txt002_15.jpg "pagenumber_ebook=19,pagenumber_book=11")


    图1-1-11　安装树莓派VNC服务


    依次操作：Interfacing Options→VNC→Yes。之后系统会提示你是否要安装VNC服务，输入y之后按回车，等待系统自动下载安装完成，一切顺利的话VNC服务就安装成功了！


    如果不使用系统配置界面安装VNC，也可以手动直接在图1-1-9的终端界面中输入：`sudo apt-get install tightvncserver`，回车执行，同样可为整个系统安装上VNC的服务。


    ## 活动四：用VNC Viewer登录树莓派的桌面


    安装完VNC服务后，我们就可以使用远程桌面工具，登录进入树莓派的桌面环境了。但登录之前，我们需要先临时启动这个服务。同样在图1-1-9的终端界面中，输入：`tightvncserver`，回车执行，VNC服务就启动了。现在是临时启用这个服务，稍后我们再将这个服务设置为自动启动。


    在电脑下载安装VNC Viewer工具，完成安装后打开软件，点击File→New connection，弹出Properties，在VNC Server中输入树莓派对应IP地址以及VNC服务号（服务号可能是：1、2、3，通常是1），Name中可以输入树莓派名字也可以不进行输入，点击OK，如图1-1-12所示。


    ![](images/txt002_16.jpg "pagenumber_ebook=20,pagenumber_book=12")


    图1-1-12　用VNC Viewer连接树莓派


    ![](images/txt002_17.jpg "pagenumber_ebook=20,pagenumber_book=12")


