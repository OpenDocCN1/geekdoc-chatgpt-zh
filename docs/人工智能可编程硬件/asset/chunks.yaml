    \n\n硬件篇学用“树莓派”\n\n![](images/txt001_1.jpg \"pagenumber_ebook=9,pagenumber_book=1\"\
    )\n\n![](images/txt001_2.jpg \"pagenumber_ebook=9,pagenumber_book=1\")\n\n开源硬件，是指整个硬件的运行原理、电路设计、材料清单以及所使用的软件（如驱动程序的源代码），全部是公开的，这些公开的信息可以自由使用并分享。开源硬件倡导我们充分发挥自己的想象力与创造力，并使用软硬件实现自己的想法。能将自己使用开源硬件创造出的作品公开，这样的人被称为“创客（Make）”。“创客”的潜台词是：我想得更宽、更广、更多；如果一位“创客”将某个技术方面做到了极致，他就从创客转变成了“极客（Geek）”。“极客”的潜台词是：我不但要比别人想得更深，还要比任何人都做得更好；还有一类人，他们使用开源硬件做出了具有创新性或者创造性的作品，但他们不愿公开，而将作品转为了产品获利，这样的人就被称为“威客（Wisdom）”。“威客”的潜台词是：我有一个好点子并实现了它，我要把这点子变成利益。\n\
    \n总之，只要软、硬件信息公开的，并允许我们在此基础上进行二次创造的，都是开源硬（软）件。现在的开源硬件不但有开源的微型电脑、开源的3D打印机等，甚至还有开源的拖拉机、抽水灌溉机！2017年，地球上空还多了一枚开源气象卫星。严格来说，开源精神促使了开源软硬件的诞生与发展；开源软硬件又促生了以创客与极客为代表的开源文化；开源文化与开源精神的最终指向，可以用六个字概括：“自由、创新、创造。”\n\
    \n\uFEFF\n\n项目一　认识树莓派\n\n![](images/txt002_1.jpg \"pagenumber_ebook=10,pagenumber_book=2\"\
    )\n\n![](images/txt002_2.jpg \"pagenumber_ebook=10,pagenumber_book=2\")\n\n“Raspberry\
    \ Pi”中文译名为“树莓派”，它是英国公益教育机构推出的开源硬件，是一款只有银行卡大小的“卡片电脑”。其设计主旨，是用于培养儿童的编程能力。没想到树莓派一经推出，就在全球创客、极客以及科技爱好者、DIY迷中，引起了轰动。目前，全球科技界与教育界，正密切关注着树莓派在儿童编程以及人工智能领域所发挥的作用。可以说，树莓派是开源硬件中最为成熟、最为成功的作品，后来的很多开源硬件都在模仿它。\n\
    \n第一节　树莓派的硬件组成\n\n![](images/txt002_3.jpg \"pagenumber_ebook=11,pagenumber_book=3\"\
    )\n\n图1-1-1　树莓派3B+主板\n\n目前，树莓派最主要的型号是3B+，外观如图1-1-1所示。\n\n树莓派应用广泛，它不但可以连接电视机、显示器、电脑、键盘、鼠标等等外接设备，甚至能连接到微波炉、烤箱、智能洗衣机、扫地机器人等等家用电器上。常用的连接方式，如图1-1-2所示。\n\
    \n![](images/txt002_4.jpg \"pagenumber_ebook=11,pagenumber_book=3\")\n\n图1-1-2　树莓派3B+主板与外接设备的连接\n\
    \n为保证外部设备的连接，树莓派3B+提供了很多硬件接口，标准输入与输出的接口如图1-1-3所示。\n\n![](images/txt002_5.jpg \"\
    pagenumber_ebook=12,pagenumber_book=4\")\n\n图1-1-3　树莓派3B+主板的接口\n\n要充分发挥树莓3B+的功能，我们还会用到一些常用套件，常用套件如图1-1-4所示。\n\
    \n![](images/txt002_6.jpg \"pagenumber_ebook=12,pagenumber_book=4\")\n\n图1-1-4　树莓派主要套件\n\
    \n为完成各种任务，我们还会用到传感器，常用的传感器如图1-1-5所示。\n\n![](images/txt002_7.jpg \"pagenumber_ebook=13,pagenumber_book=5\"\
    )\n\n图1-1-5　树莓派各类传感器\n\n第二节　树莓派的玩法\n\n![](images/txt002_8.jpg \"pagenumber_ebook=13,pagenumber_book=5\"\
    )\n\n纳斯先生是位房产推销员，当客户看房并询问房间大小时，其他推销员马上掏出钢卷尺或激光测距笔，纳斯先生掏出的却是一个网球。他猛地将网球砸向一面墙，当网球返弹砸到另一面墙时，网球会发出声音：两墙相距××米。客户目瞪口呆时纳斯先生解释，网球里有一块树莓派，他编程调用树莓派的震动传感器来实现了测距。\n\
    \n纳斯先生是位典型的创客，创客们总能让自己的生活与工作充满小乐趣。经过近十年发展，全球创客与极客们基于树莓派做出的新玩艺儿已有数千万种，其中有偏向于软件的，也有偏向于硬件的，当然还有很多是软硬件结合的。爱好者们做这些作品，有人是纯粹觉得好玩；有人是为了学习计算机技术；另有一些人是为了探索我们生活的世界；还有一些人，是想通过自己创造的东西帮助人们更好的生活。当然，更多的爱好者，是兼顾多种目的。比如：做一个机器人，造一架无人机，组一辆自动驾驶的无人小车。这既能满足计算机知识的学习，又可以从独特的视角去探索世界。\n\
    \n表1-1-1是最常见的树莓派玩法列表，大家看看这些内容，看对自己有没有启发。\n\n表1-1-1　树莓派主流玩法列表\n\n![](images/txt002_9.jpg\
    \ \"pagenumber_ebook=14,pagenumber_book=6\")\n\n第三节　树莓派运行环境的配置\n\n要在树莓派上做开发，我们首先要能熟练地使用树莓派。就让我们从配置树莓派运行环境开始学习使用它吧！\n\
    \n活动一：通过有线网卡连接树莓派\n\n树莓派3B+同时具备有线网卡与无线网卡，我们可以先通过有线网络来连接树莓派，然后启用它的无线网络，今后就可以通过无线网络控制树莓派。\n\
    \n1.将网线一端接到树莓派网卡端口，另一端接到台式电脑或笔记本电脑。\n\n2.在电脑上共享互联网，步骤如下：\n\n找到无线网络连接，右键点“属性”，在“共享”选项卡上选中“允许其他网络用户通过此计算机的Internet连接来连接”。\n\
    \n![](images/txt002_10.jpg \"pagenumber_ebook=15,pagenumber_book=7\")\n\n图1-1-6　个人电脑无线网络连接\n\
    \n注意：家庭网络连接要选择以太网“本地连接”的连接。如果没有下拉菜单供选择，请重启。\n\n3.设置本地连接IP地址：\n\n根据自己的实际情况设置IP地址，在本例中，我们设置为192.168.137.1，子网掩码设置为255.255.255.0\n\
    \n4.查找树莓派IP地址\n\n按下WIN+R快捷键，打开“运行”窗口，输入cmd进入命令行，再在命令行中输入arp-a查看网络IP地址，一般来说192.168.137.1下第一个IP就是树莓派的IP地址，如图1-1-7红框中所示。\n\
    \n![](images/txt002_11.jpg \"pagenumber_ebook=16,pagenumber_book=8\")\n\n图1-1-7　在命令提示符下查看树莓派网络地址\n\
    \n找到树莓派网卡的IP地址之后，我们才能进行后续操作。如果找不到它的IP地址，也可以用IPScanner工具扫描IP。我们还可以通过修改SD卡中的cmdline.txt文件（在里面加入语句ip=XXX.XXX.XXX.XXX），将树莓派设置成静态IP地址，但必须把电脑的“本地连接”的静态IP地址与树莓派静态IP地址设置为同一号段，才能成功连接。\n\
    \n除了上述方法之外，还有一个办法，是直接使用网线将树莓派连接到无线路由器上，然后再从电脑登录无线路由器，从路由器上，查看树莓派自动获取到的IP地址。这种方法其实比上面方法更简单。获取到树莓派的IP地址后，同样可以从电脑控制树莓派，方法如下。\n\
    \n活动二：使用putty操作树莓派\n\n因为树莓派没有设置固定IP，它的IP地址是动态获取的，每次重新插入网线后都有可能不同，所以我们最好每次都检查一下树莓派当前的IP地址。\n\
    \nIP地址确认无误之后，我们可以启动putty工具，用这个工具来连接并控制树莓派。putty工具运行效果如图1-1-8所示。\n\n![](images/txt002_12.jpg\
