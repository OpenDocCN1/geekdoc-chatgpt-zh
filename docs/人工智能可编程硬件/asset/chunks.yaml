    # 项目三　树莓派的 GPIO 口介绍


    树莓派与其他的开发板不同，它有 40 个 GPIO 接口引脚可以用来进行外部扩展。GPIO 指的是 General Purpose Input Output（通用输入/输出），这些接口引脚，是树莓派与其他硬件连接的桥梁。


    ## 第一节　40P 排线引脚介绍


    树莓派 GPIO 排线引脚的定义，如图 1-3-1 所示。


    ![](img/txt004_1.jpg "pagenumber_ebook=27,pagenumber_book=19")


    图 1-3-1　树莓派 GPIO 排线引脚介绍


    ### 活动一：引脚介绍


    我们对图 1-3-1 引脚重新进行一下分类，如图 1-3-2 所示。


    ![](img/txt004_2.jpg "pagenumber_ebook=28,pagenumber_book=20")


    图 1-3-2　树莓派 GPIO 引脚功能介绍


    图 1-3-2 中，树莓派引脚的编号方法有三种：第一，根据引脚的物理位置标号；第二，由 C 语言 GPIO 库`wiringPi`指定的编号；第三，由 BCM2837SOC
    指定的编号。


    如果我们想基于`wiringPi`库以 C 语言控制树莓派 GPIO，就需要选择`wiringPi`指定的引脚编号，从图 1-3-2 可以看出，`wiringPi`中`GPIO.0`对应的物理编号的引脚是
    11。`wiringPi`库是一个用 C 语言编写的 GPIO 访问库，使用之前需要安装。


    如果我们要使用 Python 语言控制树莓派 GPIO，则要使用`RPi.GPIO`。这个库提供的 API，可以对 GPIO 进行编程。简言之，`RPi.GPIO`是一个可以控制树莓派
    GPIO 通道的模块，该模块默认已安装到了系统中，因此可以直接使用。Python 支持两种引脚编号 Board Pin 和 BCM GPIO。


    如果要使用物理（BOARD）编号，可以将引脚编号指定为“`BOARD11`”。


    在编写程序前，我们需要设置 GPIO 接口编号类型，常用的是下面两种：


    `GPIO.setmode(GPIO.BOARD)`　#设置 GPIO 模式为 BOARD


    `GPIO.setmode(GPIO.BCM)`　#设置 GPIO 模式为 BCM


    如果树莓派系统中没有安装`RPi.GPIO`库，我们可以登录树莓派之后，在终端中执行：


    `sudo apt update`，该命令将升级整个系统。升级完成后，我们再安装 Python3 中的 RPI.GPIO 模块，同样在命令行中执行：`sudo
    apt install python3-gpiozero`即可。


    ### 活动二：PRi.GPIO 的使用方法


    要用 Python 编程语言使用树莓派的 GPIO 排线引脚，我们可以按以下步骤来实现：


    1.首先导入`RPi.GPIO`模块：


    ![](img/txt004_3.jpg "pagenumber_ebook=29,pagenumber_book=21")


    2.引入之后，就可以使用 GPIO 模块的函数了。如果你想检查模块是否引入成功，可以测试一下：


    ![](img/txt004_4.jpg "pagenumber_ebook=29,pagenumber_book=21")


    `RPi.GPIO`模块安装成功，我们就可以使用这个模块来控制树莓派的 GPIO 引脚，引脚与其他的硬件连接，我们就可以控制其他硬件的运行状态了。我们运行下面的代码试试吧（按
    Ctrl+C 组合键可关闭本程序）！


