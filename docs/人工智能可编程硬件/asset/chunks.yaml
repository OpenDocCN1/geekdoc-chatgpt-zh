    # 硬件篇学用“树莓派”

    ![](img/txt001_1.jpg "pagenumber_ebook=9,pagenumber_book=1")

    ![](img/txt001_2.jpg "pagenumber_ebook=9,pagenumber_book=1")

    开源硬件，是指整个硬件的运行原理、电路设计、材料清单以及所使用的软件（如驱动程序的源代码），全部是公开的，这些公开的信息可以自由使用并分享。开源硬件倡导我们充分发挥自己的想象力与创造力，并使用软硬件实现自己的想法。能将自己使用开源硬件创造出的作品公开，这样的人被称为“创客（Make）”。“创客”的潜台词是：我想得更宽、更广、更多；如果一位“创客”将某个技术方面做到了极致，他就从创客转变成了“极客（Geek）”。“极客”的潜台词是：我不但要比别人想得更深，还要比任何人都做得更好；还有一类人，他们使用开源硬件做出了具有创新性或者创造性的作品，但他们不愿公开，而将作品转为了产品获利，这样的人就被称为“威客（Wisdom）”。“威客”的潜台词是：我有一个好点子并实现了它，我要把这点子变成利益。

    总之，只要软、硬件信息公开的，并允许我们在此基础上进行二次创造的，都是开源硬（软）件。现在的开源硬件不但有开源的微型电脑、开源的 3D 打印机等，甚至还有开源的拖拉机、抽水灌溉机！2017
    年，地球上空还多了一枚开源气象卫星。严格来说，开源精神促使了开源软硬件的诞生与发展；开源软硬件又促生了以创客与极客为代表的开源文化；开源文化与开源精神的最终指向，可以用六个字概括：“自由、创新、创造。”


    ## 项目一　认识树莓派

    ![](img/txt002_1.jpg "pagenumber_ebook=10,pagenumber_book=2")

    ![](img/txt002_2.jpg "pagenumber_ebook=10,pagenumber_book=2")

    “Raspberry Pi”中文译名为“树莓派”，它是英国公益教育机构推出的开源硬件，是一款只有银行卡大小的“卡片电脑”。其设计主旨，是用于培养儿童的编程能力。没想到树莓派一经推出，就在全球创客、极客以及科技爱好者、DIY
    迷中，引起了轰动。目前，全球科技界与教育界，正密切关注着树莓派在儿童编程以及人工智能领域所发挥的作用。可以说，树莓派是开源硬件中最为成熟、最为成功的作品，后来的很多开源硬件都在模仿它。


