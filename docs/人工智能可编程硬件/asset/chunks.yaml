    ## 第一节　了解树莓派的操作系统


    树莓派默认操作系统叫“Raspbain”。该系统是基于Debain操作系统，专门定制开发的小型操作系统。在图形界面下，这个系统的操作方式与Windows系统差别不大。但在命令行下，则比Windows多很多命令与功能。树莓派除了可用“Raspbain”作操作系统外，也可使用Android（安卓）、Ubuntu、CentOS、FreeBSD、Kali（黑客系统）、ArchLinux甚至Windows10做为操作系统。当我们熟悉树莓派之后，完全可以根据自己的需要安装另外的操作系统。


