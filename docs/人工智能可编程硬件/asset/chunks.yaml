    \ \"pagenumber_ebook=47,pagenumber_book=39\")\n\n![](images/txt009_11.jpg \"pagenumber_ebook=48,pagenumber_book=40\"\
    )\n\n关键说明：如果使用本代码，那就必须安装OpenCV库。此外，如果电机转向错误，只需将L289N的电线反转，或反转控制GPIO连接到树莓派的线。\n\
    \n\uFEFF\n\n软件篇用MicroPython打开智能开发的大门\n\n\uFEFF\n\n项目一　MicroPython是什么\n\n第一节　MicroPython概述\n\
    \nMicroPython是Python 3编程语言的精简高效实现，它包括Python标准库的一部分，并且经过优化，可在微控制器中运行。通俗地讲，MicroPython就是“微型Python”语言，也可以称为“浓缩版的Python”语言。它基于ANSI\
    \ C，语法跟Python3保持一致。使用MicroPython，用户完全可以通过Python脚本语言实现硬件底层的访问和控制，比如控制LED灯、LCD显示器、读取电压、控制电机、访问SD卡、摄像头等。\n\
    \n第二节　支持MicroPython的开发板\n\nMicroPython从诞生起就被外界广泛关注，支持MicroPython的开发板也应运而生。市面上主流开发板有：Pyboard、Micro：bit、ESP8266和STM32等等。\n\
    \n随着MicroPython广泛应用，我国技术人员也开始仿照国际流行的开源开发板Pyboard制作自己的开发板。目前，国内最流行的开发板非TPYBoard莫属。TPYBoard开发板的功能和Pyboard类似，也是采用STM32作为MCU（控制器，也称为单片机），具有4个LED灯以及一个加速度传感器。目前，我国TPYBoard衍生出多个版本，包括STM32标准版、基于LAN的有线版、基于ESP8266的无线版本。\n\
    \n（1）STM32标准版TPYBoard V10X系列\n\n![](images/txt011_1.jpg \"pagenumber_ebook=50,pagenumber_book=42\"\
    )\n\n图2-1-1　TPYBoard V102开发板\n\n![](images/txt011_2.jpg \"pagenumber_ebook=50,pagenumber_book=42\"\
    )\n\n图2-1-2　TPYBoard V202开发板\n\n该版本非常适用于初学者。本书将围绕TPYBoard V102（图2-1-1）版本进行MicroPython开源硬件开发的讲解。\n\
    \n（2）基于网络的TPYBoard V20X系列\n\nTPYBoard V20X（图2-1-2）为网络系列版本，适合物联网设备开发。建议有一定MicroPython开发基础者使用。V20X版本使用需要开发人员懂得Socket编程，了解C/S通信模式和计算机网络TCP/IP协议。TPYBoard通过搭载传感器加上zigbee、Lora、NB-iot、2G、4G等通信模块将组成物联网终端设备的典型产品形态，属于典型的MicroPython玩转物联网快速开发的利器，共享单车电子锁就是基于物联网开发产品，方便我们的生活出行。\n\
    \n（3）基于GPS定位的TPYBoard V70X\n\nTPYBoard V70X（图2-1-3）系列开发板支持卫星定位、GPRS基站定位，使得TPYBoard可以直接通过MicroPython进行卫星定位开发。\n\
    \n![](images/txt011_3.jpg \"pagenumber_ebook=50,pagenumber_book=42\")\n\n图2-1-3　TPYBoard\
    \ V70X开发板\n\n第三节　智能开发的概念\n\n活动一：智能设备构成\n\n智能设备主要由两大部分构成：\n\n一是机械结构系统。比如我们生活中看到的行走机器人，机械结构系统由转动轮子、手臂、摄像头、扬声器等部分组成，每一部分都是一个自由的机械系统。若底座不具备行走机构，则机器人无法移动，若手臂不具备伸展弯曲结构，机器人手臂将无法像人一样活动。机械结构是智能设备的基础。\n\
    \n二是智能控制系统。机械机构加上传感器就具有感知功能，将感知到的数据反馈微处理器，可以根据感知数据分析指挥执行系统进行相应操作。\n\n活动二：智能控制系统\n\
    \n智能控制系统由三大部分构成（图2-1-4）。控制系统：相当于人的大脑，具有“思考”功能。传感器系统：相当于人的眼、耳、舌头和皮肤，具有感知功能。执行系统：相当于人的手和脚，具有行动功能。\n\
    \n![](images/txt011_4.jpg \"pagenumber_ebook=51,pagenumber_book=43\")\n\n图2-1-4　智能控制系统数据传输\n\
    \n（1）微控制器\n\n控制系统是智能设备的“大脑”，它就像一台微型的家用计算机，可以执行程序指令，并向具体动作器官发出相应的动作信息。智能设备的控制模块上一般都有多个输入接口和输出接口，用于接收外界信息后再将指令发送给机械部件。\n\
    \n前面我们介绍的MicroPython TPYBoard就是微处理器，俗称单片机。单片机是一种集成电路芯片。它已渗透到我们生活的各个领域：导弹的导航装置，飞机上各种仪表的控制，计算机的网络通信与数据传输，工业自动化过程的实时控制和数据处理，广泛使用的各种智能IC卡，民用豪华轿车的安全保障系统，录像机、摄像机、全自动洗衣机的控制，以及程控玩具、电子宠物等等，这些都离不开单片机。\n\
    \n（2）传感器系统\n\n一个真正的智能设备通常都需要具备一定的感知能力，具有感知能力的电子器件称为传感器，顾名思义，这类器件具备了感应并传递信息到控制器的功能。\n\
    \n与人的感觉器官一样，构成智能设备的电子传感器也是按功能分类的。例如：光源传感器、声音传感器、气体（烟雾、煤气）传感器、压力传感器、温度传感器等等。它们的灵敏度和感应范围甚至超越了人的感知界限，例如电子指南针、红外线传感器等。\n\
    \n（3）执行系统\n\n正如人类的身体需由骨架和肌肉牵引才能完成一定的动作一样，机器人的身体和动作表现也是由特定的机械结构组成和完成的。\n\n\uFEFF\
    \n\n项目二　使用TPYBoard控制板\n\n第一节　TPYBoard控制板与电脑的连接\n\n![](images/txt012_1.jpg \"pagenumber_ebook=53,pagenumber_book=45\"\
    )\n\n图2-2-1　TPYboard V102与电脑连接\n\n![](images/txt012_2.jpg \"pagenumber_ebook=53,pagenumber_book=45\"\
    )\n\n图2-2-2　电脑读取TPYBFLASH磁盘\n\n第一步：通过USB线连接MicroPython开发板和电脑（图2-2-1）。\n\n第二步：使用USB数据线接入电脑，驱动自动加载完成，连接成功后，可以看到电脑上加载的可移动磁盘（图2-2-2）。找到“TPYBFLASH”磁盘，这个磁盘就开发板内部的Flash。可以把开发板当作一个U盘一样使用。Flash磁盘的容量是95KB，如果需要进行大容量文件处理的话，可以插入TF卡来扩容。\n\
    \n第三步：打开“TPYBFLASH”磁盘，查看里面的文件。“TPYBFLASH”磁盘中有4个文件：boot.py、main.py、README.txt和tpybcdc.inf（图2-2-3）。"
