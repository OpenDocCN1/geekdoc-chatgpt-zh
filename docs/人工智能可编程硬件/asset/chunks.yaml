    ### 第三节　树莓派运行环境的配置

    要在树莓派上做开发，我们首先要能熟练地使用树莓派。就让我们从配置树莓派运行环境开始学习使用它吧！


    #### 活动一：通过有线网卡连接树莓派

    树莓派 3B+同时具备有线网卡与无线网卡，我们可以先通过有线网络来连接树莓派，然后启用它的无线网络，今后就可以通过无线网络控制树莓派。

    1.将网线一端接到树莓派网卡端口，另一端接到台式电脑或笔记本电脑。

    2.在电脑上共享互联网，步骤如下：

    找到无线网络连接，右键点“属性”，在“共享”选项卡上选中“允许其他网络用户通过此计算机的 Internet 连接来连接”。

    ![](img/txt002_10.jpg "pagenumber_ebook=15,pagenumber_book=7")

    图 1-1-6　个人电脑无线网络连接

    注意：家庭网络连接要选择以太网“本地连接”的连接。如果没有下拉菜单供选择，请重启。

    3.设置本地连接 IP 地址：

    根据自己的实际情况设置 IP 地址，在本例中，我们设置为 192.168.137.1，子网掩码设置为 255.255.255.0

    4.查找树莓派 IP 地址

    按下`WIN+R`快捷键，打开“运行”窗口，输入`cmd`进入命令行，再在命令行中输入`arp-a`查看网络 IP 地址，一般来说 192.168.137.1
    下第一个 IP 就是树莓派的 IP 地址，如图 1-1-7 红框中所示。

    ![](img/txt002_11.jpg "pagenumber_ebook=16,pagenumber_book=8")

    图 1-1-7　在命令提示符下查看树莓派网络地址

    找到树莓派网卡的 IP 地址之后，我们才能进行后续操作。如果找不到它的 IP 地址，也可以用`IPScanner`工具扫描 IP。我们还可以通过修改 SD
    卡中的`cmdline.txt`文件（在里面加入语句`ip=XXX.XXX.XXX.XXX`），将树莓派设置成静态 IP 地址，但必须把电脑的“本地连接”的静态
    IP 地址与树莓派静态 IP 地址设置为同一号段，才能成功连接。

    除了上述方法之外，还有一个办法，是直接使用网线将树莓派连接到无线路由器上，然后再从电脑登录无线路由器，从路由器上，查看树莓派自动获取到的 IP 地址。这种方法其实比上面方法更简单。获取到树莓派的
    IP 地址后，同样可以从电脑控制树莓派，方法如下。


    #### 活动二：使用 putty 操作树莓派

    因为树莓派没有设置固定 IP，它的 IP 地址是动态获取的，每次重新插入网线后都有可能不同，所以我们最好每次都检查一下树莓派当前的 IP 地址。

    IP 地址确认无误之后，我们可以启动`putty`工具，用这个工具来连接并控制树莓派。`putty`工具运行效果如图 1-1-8 所示。

    ![](img/txt002_12.jpg "pagenumber_ebook=17,pagenumber_book=9")

    图 1-1-8　PUTTY 登录界面

    点击“打开”进行连接，然后：

    输入账号（`login`）：`pi`


