    # 活动三：温度传感器介绍

    温度传感器（temperature transducer）是指能感受温度并转换成可用输出信号的传感器。温度传感器有四种主要类型：热电偶、热敏电阻、电阻温度检测器（`RTD`）和`IC`温度传感器（见下表
    2-5-2）。`IC`温度传感器又包括模拟输出和数字输出两种类型。


