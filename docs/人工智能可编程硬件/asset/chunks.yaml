    # 项目四　智能光控灯


    ## 第一节　概念与原理

    本实现项目中，将利用光线传感器制作根据光线的强弱来控制`LED`灯的亮与灭。这个实验项目应用场景非常广泛。比如路灯，当晚上来临时，将要求灯亮起来，而在白天为了节约能量，需要路灯熄灭。这就可以借鉴此例子来根据光线的强弱控制`LED`灯的亮与灭。


    ## 活动一：光线传感器介绍

    光线传感器可以感知周围光线情况，并告知处理芯片根据不同光线做出决策。光线传感器在自动控制、家用电器中得到广泛的应用。例如：自动调节电视机亮度、照相机自动曝光及自动防盗报警装置等。

    光敏传感器主要应用于太阳能草坪灯、光控小夜灯、照相机、监控器、光控玩具、声光控开关、摄像头、防盗钱包、光控音乐盒、生日音乐蜡烛、音乐杯、人体感应灯、人体感应开关等电子产品。


    #### （1）光敏电阻

    光敏电阻是基于半导体光电效应工作的。光敏电阻无极性，纯粹是一个电阻元件。使用时可以加直流电压，也可以加交流电压。

    光敏电阻的工作原理：光照时，电阻很小；无光照时，电阻很大。光照越强，电阻越小；光照停止，电阻又恢复原值。

    光谱范围：从紫外线区到红外线区。优点：灵敏度高，体积小，性能稳定，价格较低。

    光敏电阻的性能参数：光敏电阻不受光照时的电阻称为暗电阻，此时流过的电流称为暗电流。在受到光照时的电阻称为亮电阻，此时电流称为亮电流。暗电阻越大越好，亮电阻越小越好。实际应用时，暗电阻大约在兆欧级，亮电阻大约在几千欧以下。


    #### （2）光敏二极管

    光敏二极管与半导体二极管在结构上是类似的，其管芯是一个具有光敏特征的`PN`结，具有单向导电性，因此工作时需加上反向电压。无光照时，有很小的饱和反向漏电流，即暗电流，此时光敏二极管截止。当受到光照时，饱和反向漏电流大大增加，形成光电流，它随入射光强度的变化而变化。当光线照射`PN`结时，可以使`PN`结中产生电子-空穴对，使少数载流子的密度增加。这些载流子在反向电压下漂移，使反向电流增加。因此可以利用光照强弱来改变电路中的电流。无光时处于截止状态，有光时导通。


    #### （3）PT550 环保型光敏二极管

    基于`PT550`环保型光敏二极管的光线传感器，可以用来对环境光线的强度进行检测。通常用来制作随光线强度变化产生特殊效果的互动作品。

