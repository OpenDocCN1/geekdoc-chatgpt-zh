- raw: "\n\n\uFEFF\n\n![](images/cov001_1.jpg \"pagenumber_ebook=1,pagenumber_book=0\"\
    )\n\n\uFEFF\n\n![](images/bok001_1.jpg \"pagenumber_ebook=2,pagenumber_book=0\"\
    )\n\n\uFEFF\n\n顾　问\n\n姚文忠　郭　斌　罗清红　蒋晓明　曾乾炳\n\n编委会\n\n主　　编　张　莉　刘　黎\n\n副 主 编　胡定坤　马玉敏\n\
    \n编　　委　张　莉　刘　黎　胡定坤　马玉敏\n\n　　　　　张友科　王永风　何昱娇\n\n\uFEFF\n\n序\n\n这套书的策划者和作者，向同学们发出了一个非常重要的邀请，就是学习编程和应用编程，而且是使用Python语言来编程。\n\
    \n我国拥有世界上最强大的计算机，比如神威、天河等。其强大功能怎样用到工业、农业、交通运输、金融、科技、减灾防灾、航天、国防、文化和教育等领域呢？这就需要有无穷无尽的、相应的程序。反过来，计算机的强大功能，在程序的支撑下有效地促进了各个领域高速发展。所以说，程序是计算机实现其强大功能的关键中介和必要条件。\n\
    \n计算机程序可以使用各种编程语言来编写，我们在脑袋里产生一种想法，要编写出程序，需要依靠某种编程语言。到现在，流行的近百种编程语言各有优点，这套书采用的是Python语言。Python的特点是学习和使用方便有趣，能够减轻学习困难，提升学习效率。作者在编写这套学习用书时，图文并茂，事例垫底，叙述不枯，紧靠学习者的思路，这是本书的长处和亮点，是学习Python编程语言的一种优选，值得推动。\n\
    \n计算机爱好者学习编程，在以前基本上是为了更好地开发计算机的功能，拓展用场。现在，形势在发生重大变化。\n\n从国家战略层面讲，我们已进入崭新的人工智能时代，不是“未来已来”，而是人类始终需要创新。这个时代，人们不再被动使用某种计算机程序，而更需要理解和创造新的、品种多样和品质高妙的程序。人工智能借助数字化游戏规则转变技术，正在深刻地改变人类学习、工作和生活方式。个人娴熟的数字化技能正在成为劳动者的关键品质，所以，掌握一定的编程知识是数字时代原住民的必修课。\n\
    \n这套以Python编程语言为核心进行编程教学的书籍，之所以值得推动，因为其思想理念站在了国家战略高度；还因为用其教学就能够培养数字化思维和技能，养成数字化生活与学习的能力，从而保持国家发展的活力和趋势。\n\
    \n总之，本套人工智能编程教育书籍，兼有实用性、趣味性和教育性，体现了中小学生的学习规律，能够减轻教师的负担，提高教学效率。在国家大步迈向人工智能时代之际，能够加速提升学生数字化能力的书籍，就是一套好书。\n\
    \n![](images/fow002_1.jpg \"pagenumber_ebook=6,pagenumber_book=0\")\n\n\uFEFF\n\
    \n亲爱的同学们，你们好！\n\n欢迎大家走进“人工智能——可编程硬件”的编程世界。随着互联网、物联网、大数据的高速发展，技术、人和物质世界的联系更加密切。通过对硬件进行编程，实现更加智能的人居环境，是创造未来世界和造福人类的重要途径。在本书中，我们将跟随小伙伴锦锦和江江，一起探索和学习人工智能环境下，对开源硬件进行编程的相关内容。\n\
    \n学习可编程硬件要从学习开源硬件开始（非开源硬件，会有版权或专利保护），开源硬件是指与自由及开放源代码软件相同方式设计的计算机和电子硬件。开源硬件基于“开放、共享”理念，可降低开发成本、节约时间，从而快速实现技术的创新。本书通过硬件篇和软件篇两部分，将详细的介绍树莓派与TPYBoard两种开源硬件的开发与应用。让我们利用Python编程语言，搭建起从虚拟通往现实的桥梁，让智能设备更好的为我们人类服务。同学们，让我们现在就开启这段愉快的未来世界之旅吧！\n\
