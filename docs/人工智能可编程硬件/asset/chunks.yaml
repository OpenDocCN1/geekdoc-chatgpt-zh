- raw: "![](images/txt012_3.jpg \"pagenumber_ebook=53,pagenumber_book=45\")\n\n图2-2-3　TPYBFLASH磁盘中文件\n\
    \nboot.py文件说明：\n\n开机引导文件，由它来加载默认运行的程序文件（默认是main.py），它还可以设置板子的模式，比如当作鼠标、键盘等。\n\n\
    main.py文件说明：\n\n默认开发板运行的程序文件，主要依照boot.py文件的设置。\n\nREADME.txt文件说明：\n\n关于开发板的介绍，以及一些帮助信息。\n\
    \ntpybcdc.inf文件说明：\n\n开发板的驱动文件，用于和电脑之间的通信。\n\n第二节　MicroPython程序编辑器介绍\n\n编辑器是软件程序，一般是指用来修改电脑档案的编写软件。常见的编辑器有文本编辑器、网页编辑器、源程序编辑器、图像编辑器、声音编辑器和视频编辑器等。\n\
    \n编译器通常接受由任何生成标准文件（例如ASCII文件）的编辑器编写的源程序。编译器已与另一个编辑器和其他程序捆绑进一个交互的开发环境——IDE中。这样的编辑器称为基于结构的（structure\
    \ based），且它早已包括了编译器的某些操作。因此，程序员就会在程序的编写时，而不是在编译时就得知错误了。从编辑器中也可调用编译器以及与它共用的程序，这样程序员无须离开编辑器就可执行程序。\n\
    \n活动一：认识Python Editor编辑器\n\nPython Editor模块化编辑器（图2-2-4）是针对与TPYBoard开发板开发的一款IDE（也兼容适用于其他MicroPython开发板）。Python\
    \ Editor模块化编辑器是一款Web在线模块化编辑器（http：//www.tpyboard.com/pythoneditor/），必须通过联网电脑Web浏览器进行访问。模块化编程易于初学者学习，降低了学习门槛，有利于推动开源硬件编程开发的推广。\n\
    \nPython Editor拼插编辑器主要分为三个部分：拼插块选择区域、拼插拖拽区域、代码显示区域。\n\n![](images/txt012_4.jpg\
    \ \"pagenumber_ebook=55,pagenumber_book=47\")\n\n图2-2-4　Python Editor模块化编程环境\n\
    \n活动二：程序的下载\n\n![](images/txt012_5.jpg \"pagenumber_ebook=55,pagenumber_book=47\"\
    )\n\n图2-2-5　下载程序\n\n![](images/txt012_6.jpg \"pagenumber_ebook=55,pagenumber_book=47\"\
    )\n\n图2-2-6　模块化转换化的MicroPython代码\n\n第一步：通过模块化编辑器写好程序，点击最下方“下载python”按钮（图2-2-5），将我们的操作模块化程序转换成开发板可以识别MicroPython程序代码。\n\
    \n第二步：打开下载好的main.py文件，使用Notepad++文本编辑器打开（图2-2-6），可以看到模块化程序被转换成MicroPython代码程序。\n\
    \n第三步：将下载的main.py文件拷贝到开发板“TPYBFLASH”磁盘，用来覆盖开发板中原有的main.py文件。在复制main.py文件过程中，TPYBoard开发板上的LED红灯亮起，表明开发板已经接收到复制的main.py文件。当红灯熄灭后，说明main.py文件复制完成。\n\
    \n第四步：按下TPYBoard开发板上“RST”按键，可以看到LED1红灯亮，1秒后熄灭，1秒后又亮起，这样重复10次，最后熄灭。红灯的熄灭亮起，表明我们写的程序已经被TPYBoard开发板执行。\n\
    \n\uFEFF\n\n项目三　炫彩的流水灯\n\n第一节　概念与原理\n\n所谓的流水灯是指一组在控制系统的控制下按照设定的顺序和时间来发亮和熄灭的灯。流水灯的技术在生活中有很多的应用，比如说城市亮化工程的灯光控制；景观设计里的灯光控制、流水控制，甚至音乐控制；舞台设计的灯光和音响控制；广告设计的文字显示、灯光显示等都有流水灯的技术应用。基于流水灯的技术广泛应用，本章内容以TPYBoard\
    \ V102开发板自带4个LED（发光二极管）灯作为基础，通过软件编程实现4个LED灯的流水设计与实现。对其他样式的流水灯的设计与实现有一定的参考作用。\n\
    \n活动一了解基本概念\n\n1.发光二极管介绍\n\n发光二极管也称作LED（Light Emitting Diode）具有节能、环保、寿命长三大优势，是继白炽灯、荧光灯之后的新一代绿色光源，目前正逐步取代传统光源，渗透到人们的日常生活当中。LED是一种能够将电能转化为可见光的固态的半导体器件，它可以直接把电转化为光。LED的心脏是一个半导体的晶片，晶片的一端附在一个支架上，一端是负极，另一端连接电源的正极。LED利用固体半导体芯片作为发光材料，在半导体中通过载流子发生复合放出过剩的能量而引起光子发射，可以直接发出红、黄、蓝、绿、青、橙、紫、白色的光。在此基础上，利用三基色原理，添加荧光粉，可以发出任意颜色的光。直插LED，有“两条腿”，腿长的是正极，腿短的是负极。贴片LED，可以观察TPYBoard开发板上的4个LED灯，有涂颜色的那一端是负极。\n\
    \n（1）LED分类\n\n发光二极管还可分为普通单色发光二极管、高亮度发光二极管、超高亮度发光二极管、变色发光二极管、闪烁发光二极管、电压控制型发光二极管、红外发光二极管和负阻发光二极管等。\n\
    \nLED的控制模式有恒流和恒压两种，有多种调光方式，比如模拟调光和PWM调光，大多数的LED都采用的是恒流控制，这样可以保持LED电流的稳定，不易受VF的变化，可以延长LED灯具的使用寿命。\n\
    \n（2）LED的应用场景\n\n①显示屏、交通信号灯的应用\n\n灯具有抗震耐冲击、光响应速度快、省电和寿命长等特点，广泛应用于各种室内、户外显示屏，分为全色、三色和单色显示屏。交通信号灯主要用超高亮度红色、绿色、黄色，因为采用信号灯既节能，可靠性又高，市场需求量很大。\n\
    \n②汽车工业上的应用\n\n车用市场是个高成长领域。汽车用灯包含汽车内部的仪表板、音响指示灯、开关的背光源、阅读灯和外部的刹车灯、尾灯、侧灯以及头灯等。除前照灯外，所有车用灯具几乎都是单色灯具，对灯具寿命要求很高。红色高亮度可应用于汽车第三刹车灯，而左右尾灯、方向灯及车边标识灯，可使用红色或黄色高亮度，而汽车仪表板上则需要各种颜色的高亮度。\n\
    \n③背光源\n\n用于小型液晶显示器的背光照明，适用于移动电话和笔记本电脑等产品，如按键、前面板、符号与键盘背景照明等，随着个人通信产品的大量使用，对高亮度的需求也在不断增长。\n\
    \n④半导体照明光源\n\n普通照明市场是光源的最大市场，也是光源的目标市场。主要包括室外景观照明市场和室内照明市场。目前，半导体照明的直接目标是将光源替代白炽灯和荧光灯，这种替代趋势已从局部应用领域开始发展。超高亮度、大功率、高效率、低成本是重要发展方向。\n\
    \n2.TPYBoard开发板的LED\n\nTPYBoard开发板上有4个LED灯，这4个LED灯属于普通贴片单色发光LED，板子上标注的名称是LED1（红）、LED2（绿）、LED3（橙）、LED4（蓝）。打开编辑器，拼插块选择区可以看到有一个“板载LED”分类。可以通过板载LED分类中的模块控制板载LED灯的点亮和熄灭。\n\
