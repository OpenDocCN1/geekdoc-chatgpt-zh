    Editor`模块化编辑器是一款 Web 在线模块化编辑器（`http://www.tpyboard.com/pythoneditor/`），必须通过联网电脑
    Web 浏览器进行访问。模块化编程易于初学者学习，降低了学习门槛，有利于推动开源硬件编程开发的推广。

