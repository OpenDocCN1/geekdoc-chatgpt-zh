    ## 活动三：智能光控灯设计与实现

    本次实验的工作原理比较简单。主要就是通过光线传感器读取的环境光的强度来决策`LED`灯正极输出高电平还是低电平。当环境光数值低于某个值时，给`LED`灯正极输出高电平，从而点亮`LED`。否则给`LED`灯正极送一个低电平，`LED`灯不会被点亮。

