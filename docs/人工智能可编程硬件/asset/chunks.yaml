    图 1-4-2　实验接线图


    4.代码清单：


    用 Python 代码，控制树莓派点亮 LED 灯：


    ![](img/txt005_4.jpg "pagenumber_ebook=31,pagenumber_book=23")


    将上述代码保存为“`LED.py`”，执行`python3 LED.py`，即可看到控制效果。按 Ctrl+C 组合键可关闭本程序。


    拓展：


    尝试利用 PCF8591 模块调节 LED 的亮度


    ![](img/txt005_5.jpg "pagenumber_ebook=32,pagenumber_book=24")


    图 1-4-3　PCF8591 模块介绍


    PCF8591 模块说明：PCF8591 是单片、单电源、低功耗 8 位 CMOS 数据采集器件，具有 4 个模拟输入、1 个输出和 1 个串行 I2C 总线接口。3
    个地址引脚 A0、A1 和 A2 用于编程硬件地址，允许将最多 8 个器件连接至 I2C 总线而不需要额外硬件。器件的地址、控制和数据通过两线双向 I2C
    总线传输。器件功能包括多路复用模拟输入、片上跟踪和保持功能、8 位模数转换和 8 位数模拟转换。最大转换速率取决于 I2C 总线的最高速率。


    引脚定义：


    本模块左边和右边分别外扩 2 路排针接口，分别说明如下：


    左边 AOUT 芯片 DA 输出接口


    —AINO 芯片模拟输入接口 0


    —AIN1 芯片模拟输入接口 1


    —AIN2 芯片模拟输入接口 2


    —AIN3 芯片模拟输入接口 3


    右边 SCL IIC 时钟接口接树莓派的 scl 口


    —SDA IIC 数字接口接树莓派的 sda 口


    —GND 模块地外接地


    —VCC 电源接口外接 3.3V～5V


    PCF 8591 模组包含了热敏和光敏电阻，模块共有 3 个红色短路帽，分别作用如下：


    P4 接上 P4 短路帽，选择热敏电阻接入电路


    P5 接上 P5 短路帽，选择光敏电阻接入电路


    P6 接上 P6 短路帽，选择 0～5V 可调电压接入电路


    ![](img/txt005_6.jpg "pagenumber_ebook=33,pagenumber_book=25")


    图 1-4-4　PCF8591 内部原理图


    本拓展问题的代码，请参看书末资源包下载链接。在使用 PCF8591 模块之前要开启 I2C 设置，在默认情况下树莓派没有开启 I2C，因此需要我们先做一些操作：


    1.Run `sudo raspi-config`.（运行树莓派的`raspi-config`配置）


    2.Use the down arrow to select 5 Interfacing Options（选择第 5 项接口选项）


    3.Arrow down to P5 I2C.（向下选中 P5 I2C）


    4.Select yes when it asks you to enable I2C（启用 I2C）


    5.Also select yes if it asks about automatically loading the kernel module.（选择“是”，启用加载内核模块）


    6.Use the right arrow to select the<Finish>button.（选择 Finish 继续）


    7.Select yes when it asks to reboot.（重启系统选择“是”）。


