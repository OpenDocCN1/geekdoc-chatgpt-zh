    第三步：将下载的`main.py`文件拷贝到开发板“`TPYBFLASH`”磁盘，用来覆盖开发板中原有的`main.py`文件。在复制`main.py`文件过程中，`TPYBoard`开发板上的
    LED 红灯亮起，表明开发板已经接收到复制的`main.py`文件。当红灯熄灭后，说明`main.py`文件复制完成。

    第四步：按下`TPYBoard`开发板上“`RST`”按键，可以看到`LED1`红灯亮，1 秒后熄灭，1 秒后又亮起，这样重复 10 次，最后熄灭。红灯的熄灭亮起，表明我们写的程序已经被`TPYBoard`开发板执行。


    # 项目三　炫彩的流水灯


    ## 第一节　概念与原理

    所谓的流水灯是指一组在控制系统的控制下按照设定的顺序和时间来发亮和熄灭的灯。流水灯的技术在生活中有很多的应用，比如说城市亮化工程的灯光控制；景观设计里的灯光控制、流水控制，甚至音乐控制；舞台设计的灯光和音响控制；广告设计的文字显示、灯光显示等都有流水灯的技术应用。基于流水灯的技术广泛应用，本章内容以`TPYBoard
    V102`开发板自带 4 个`LED`（发光二极管）灯作为基础，通过软件编程实现 4 个`LED`灯的流水设计与实现。对其他样式的流水灯的设计与实现有一定的参考作用。


    ## 活动一了解基本概念


    ### 1.发光二极管介绍

    发光二极管也称作`LED`（Light Emitting Diode）具有节能、环保、寿命长三大优势，是继白炽灯、荧光灯之后的新一代绿色光源，目前正逐步取代传统光源，渗透到人们的日常生活当中。`LED`是一种能够将电能转化为可见光的固态的半导体器件，它可以直接把电转化为光。`LED`的心脏是一个半导体的晶片，晶片的一端附在一个支架上，一端是负极，另一端连接电源的正极。`LED`利用固体半导体芯片作为发光材料，在半导体中通过载流子发生复合放出过剩的能量而引起光子发射，可以直接发出红、黄、蓝、绿、青、橙、紫、白色的光。在此基础上，利用三基色原理，添加荧光粉，可以发出任意颜色的光。直插`LED`，有“两条腿”，腿长的是正极，腿短的是负极。贴片`LED`，可以观察`TPYBoard`开发板上的
    4 个`LED`灯，有涂颜色的那一端是负极。


    #### （1）LED 分类

    发光二极管还可分为普通单色发光二极管、高亮度发光二极管、超高亮度发光二极管、变色发光二极管、闪烁发光二极管、电压控制型发光二极管、红外发光二极管和负阻发光二极管等。

    `LED`的控制模式有恒流和恒压两种，有多种调光方式，比如模拟调光和`PWM`调光，大多数的`LED`都采用的是恒流控制，这样可以保持`LED`电流的稳定，不易受`VF`的变化，可以延长`LED`灯具的使用寿命。


    #### （2）LED 的应用场景

    ①显示屏、交通信号灯的应用

    灯具有抗震耐冲击、光响应速度快、省电和寿命长等特点，广泛应用于各种室内、户外显示屏，分为全色、三色和单色显示屏。交通信号灯主要用超高亮度红色、绿色、黄色，因为采用信号灯既节能，可靠性又高，市场需求量很大。

    ②汽车工业上的应用

    车用市场是个高成长领域。汽车用灯包含汽车内部的仪表板、音响指示灯、开关的背光源、阅读灯和外部的刹车灯、尾灯、侧灯以及头灯等。除前照灯外，所有车用灯具几乎都是单色灯具，对灯具寿命要求很高。红色高亮度可应用于汽车第三刹车灯，而左右尾灯、方向灯及车边标识灯，可使用红色或黄色高亮度，而汽车仪表板上则需要各种颜色的高亮度。

    ③背光源

    用于小型液晶显示器的背光照明，适用于移动电话和笔记本电脑等产品，如按键、前面板、符号与键盘背景照明等，随着个人通信产品的大量使用，对高亮度的需求也在不断增长。

    ④半导体照明光源

    普通照明市场是光源的最大市场，也是光源的目标市场。主要包括室外景观照明市场和室内照明市场。目前，半导体照明的直接目标是将光源替代白炽灯和荧光灯，这种替代趋势已从局部应用领域开始发展。超高亮度、大功率、高效率、低成本是重要发展方向。


    ### 2.TPYBoard 开发板的 LED

    `TPYBoard`开发板上有 4 个`LED`灯，这 4 个`LED`灯属于普通贴片单色发光`LED`，板子上标注的名称是`LED1`（红）、`LED2`（绿）、`LED3`（橙）、`LED4`（蓝）。打开编辑器，拼插块选择区可以看到有一个“板载`LED`”分类。可以通过板载`LED`分类中的模块控制板载`LED`灯的点亮和熄灭。


