- raw: "按运转速度划分：可分为高速电动机、低速电动机、恒速电动机、调速电动机。低速电动机又分为齿轮减速电动机、电磁减速电动机、力矩电动机和爪极同步电动机等。\n\
    \n（3）直流电机的概念和原理\n\n直流电动机是将直流电能转换为机械能的电动机。其分为两部分：定子与转子。注意：不要把换向极与换向器弄混淆了。定子包括：主磁极、机座、换向极、电刷装置等。转子包括：电枢铁芯、电枢绕组、换向器、轴和风扇等。直流电动机是依靠直流工作电压运行的电动机，广泛应用于收录机、录像机、影碟机、电动剃须刀、电吹风、电子表、玩具等。\n\
    \n（4）步进电机的概念及原理\n\n步进电机是将电脉冲信号转变为角位移或线位移的开环控制电机，是现代数字程序控制系统中的主要执行元件，应用得极为广泛。在非超载的情况下，电机的转速、停止的位置只取决于脉冲信号的频率和脉冲数，而不受负载变化的影响，当步进驱动器接收到一个脉冲信号，它就驱动步进电机按设定的方向转动一个固定的角度，称为“步距角”，它的旋转是以固定的角度一步一步运行的。可以通过控制脉冲个数来控制角位移量，从而达到准确定位的目的；同时可以通过控制脉冲频率来控制电机转动的速度和加速度，从而达到调速的目的。\n\
    \n活动二：L298N电机驱动电路\n\nL298N是SGS公司的产品，内部包含4通道逻辑驱动电路。是一种二相和四相电机的专用驱动器，即内含两个H桥的高电压大电流双全桥式驱动器，接收标准TTL逻辑电平信号，可驱动46V、2A以下的电机。其引脚排列如图2-5-1中所示。\n\
    \n工作作电压：控制信号直流5V；电机电压直流3～46V（建议使用36V以下）\n\n最大工作电流：2.5A\n\n额定功率：25W\n\n特点：具有信号指示，转速可调，抗干扰能力强，具有过电压和过电流保护。可单独控制两台直流电机。可单独控制一台步进电机。PWM脉宽平滑调速。可实现正反转。\n\
    \nL298可驱动两个电机，OUTl、OUT2和OUT3、OUT4之间分别接两个电动机。5、7、10、12脚接输入控制电平，控制电机的正反转，ENA，ENB接控制使能端，控制电机的停转。本章采用L298N电机驱动模块（如图2-5-1所示）驱动风扇。电机驱动参数如表2-5-1所示。\n\
    \n使用直流/步进两用驱动器可以驱动两台直流电机。分别为M1和M2。引脚A，B可用于输入PWM脉宽调制信号对电机进行调速控制。（如果无须调速可将两引脚接5V，使电机工作在最高速状态，即将短接帽短接）实现电机正反转就更容易了，输入信号端IN1接高电平，输入端IN2接低电平，电机M1正转（如果信号端IN1接低电平，IN2接高电平，电机M1反转。）。控制另一台电机是同样的方式，输入信号端IN3接高电平，输入端IN4接低电平，电机M2正转（反之则反转）。PWM信号端A控制M1调速，PWM信号端B控制M2调速。\n\
    \n![](images/txt015_1.jpg \"pagenumber_ebook=68,pagenumber_book=60\")\n\n图2-5-1　L298N电机驱动模块\n\
    \n表2-5-1　L298N驱动芯片管脚映射\n\n![](images/txt015_2.jpg \"pagenumber_ebook=68,pagenumber_book=60\"\
    )\n\n活动三：温度传感器介绍\n\n温度传感器（temperature transducer）是指能感受温度并转换成可用输出信号的传感器。温度传感器有四种主要类型：热电偶、热敏电阻、电阻温度检测器（RTD）和IC温度传感器（见下表2-5-2）。IC温度传感器又包括模拟输出和数字输出两种类型。\n\
    \n（1）温度传感器性能对比（表2-5-2）\n\n表2-5-2　温度传感器性能对比表\n\n![](images/txt015_3.jpg \"pagenumber_ebook=69,pagenumber_book=61\"\
    )\n\n（2）LM35线性模拟温度传感器\n\n![](images/txt015_4.jpg \"pagenumber_ebook=69,pagenumber_book=61\"\
    )\n\n图2-5-2　LM35温度传感器\n\n本节智能温控风扇采用LM35线性模拟温度传感器。选用DFRobot公司封装的LM35温度传感器（DFR0023）。LM35半导体温度传感器是美国国家半导体公司生产的线性温度传感器。其测温范围是-40℃～150℃，灵敏度为10mV/℃，输出电压与温度成正比。LM35线性温度传感器与开源硬件结合使用，可以非常容易地实现与环境温度感知相关的互动效果。LM35温度传感器如图2-5-2所示。\n\
    \n活动四：PWM调速原理\n\nPWM调速原理即脉冲宽度调制，是利用微处理器的数字输出来对模拟电路进行控制的一种非常有效的技术，广泛应用在从测量、通信到功率控制与变换的许多领域中。PWM控制技术以其控制简单，灵活和动态响应好的优点而成为电力电子技术最广泛应用的控制方式，也是人们研究的热点。\n\
    \nPWM调速是通过调整空占比来模拟不同电压值，从而控制加到电机两端的电压高低来实现调速，如图2-5-3所示。\n\n![](images/txt015_5.jpg\
    \ \"pagenumber_ebook=70,pagenumber_book=62\")\n\n图2-5-3　PWM脉宽调节波形图\n\n活动五：智能温控风扇的设计与实现\n\
    \n本次实验项目是利用温度传感器LM35检测环境温度并直接输入数字温度信号给TPYBoard控制器进行处理，控制器根据温度数值采用PWM脉宽调制方式通过电机驱动芯片改变直流风扇电机的转速，达到低温度。\n\
    \n1.材料需求\n\n本实验项目所需要的材料清单如表2-5-3所示。\n\n表2-5-3　智能温控风扇材料清单\n\n![](images/txt015_6.jpg\
    \ \"pagenumber_ebook=71,pagenumber_book=63\")\n\n2.电路设计与连接\n\n通过仿真软件fritzing模拟智能温控风扇电路图，将电机的负极与控制板的GND连接，电机的正极与控制板X1接口连接。温度感器与控制板X4连接。电路连接如图2-5-4所示。\n\
    \n![](images/txt015_7.jpg \"pagenumber_ebook=71,pagenumber_book=63\")\n\n图2-5-4　智能温控风扇电路设计\n\
    \n3.程序设计\n\n（1）程序流程图\n\nLM35温度传感器反馈给控制器的数据是线性的电压与温度的对应数值。所以在利用LM35反馈回的值之前，先进行电压数值对应的温度数据的转换。通过查询LM35相关资料可得知，温度=（LM35电压值）\\\
    *125/256。通过温度决策，温度低于25度，环境温度很适宜，让电机不转动。温度大于25度，输出PWM脉宽值来调节电机转速。设计程序流程图如图2-5-5所示。\n\
    \n![](images/txt015_8.jpg \"pagenumber_ebook=72,pagenumber_book=64\")\n\n图2-5-5　程序流程图\n\
    \n（2）编写程序\n\n根据程序流程图设计实现程序如图2-5-5所示。首先创建温度传感器值变量，再讲温度传感器返回的值转换成对应的温度，通过PWM调节电机转速。智能温控风扇控制程序如图2-5-6所示。\n\
    \n![](images/txt015_9.jpg \"pagenumber_ebook=72,pagenumber_book=64\")\n\n图2-5-6　智能温控风扇控制程序\n\
    \n（3）下载运行测试程序\n\n第一步：将编写好的程序复制到TPYBoard中，进行执行。\n\n第二步：改变温度传感器周围温度值，观察电机转速变化。\n\
    \n4.MicroPython代码实现\n\n本项目MicroPython代码如下：\n\n![](images/txt015_10.jpg \"pagenumber_ebook=73,pagenumber_book=65\"\
    )\n\n\uFEFF\n\n项目六　智能避障小车\n\n第一节　概念与原理\n\n智能小车是一种能够通过编程手段完成特定任务的小型化机器人，它具有制作成本低廉，电路结构简单，程序调试方便等优点。智能小车具有很强的趣味性，深受广大机器人爱好者以及学生的喜爱。\n\
    \n本章主要讲述如何设计制作一款智能避障小车。小车避障通过安装在小车上的超声波传感器获取前方障碍物距离从而决策绕开障碍物，达到避障目的。\n\n活动一：超声波传感器简介\n\
    \n（1）超声波测距原理\n\n超声波工作原理如图2-6-1所示。超声波模块包含一个发射端和一个接收端，超声波发射端发射出超声波信号，然后超声波电路模块开始进行时间计算，超声波信号在空气中以大约340m/s的速度进行传播，当超声波信号遇到有障碍物的情况下，超声波经过障碍物反射，超声波接收模块会接到一个反射信号。当收到反射信号后，停止计时，总共发送到接收到反射信号用时为t。笔者设超声波模块离障碍物距离为H，超声波在空气中经过反射总共传播距离为2L，我们可以测出超声波发射端到超声波接收端的距离是2M。根据图2-6-1所示的超声波工作原理，不难得出以下三个公式①②③。\n\
    \n![](images/txt016_1.jpg \"pagenumber_ebook=74,pagenumber_book=66\")\n\n![](images/txt016_2.jpg\
    \ \"pagenumber_ebook=75,pagenumber_book=67\")\n\n通过①②式子可以计算出③式，障碍物离所在距离为H。由于超声波发射器和超声波接收器之间的距离很短，所测障碍物距离越远，那么L更趋向于H。避障机器人本身要求精度不是很高，所以在这里，我们直接忽略超声波发射器和接收器之间的距离2M，可以得出障碍物距离为H=vt/2。\n\
    \n![](images/txt016_3.jpg \"pagenumber_ebook=75,pagenumber_book=67\")\n\n图2-6-1　超声波工作原理\n\
    \n（2）HC-SR04超声波传感器（图2-6-2）\n\n本章避障小车使用HC-SR04超声波传感器。工作原理如下：\n\n（1）采用I/O口TRIG触发测距，给至少10us的高电平信号。\n\
    \n（2）模块自动发送8个40khz的方波，自动检测是否有信号返回。\n\n（3）有信号返回，通过I/O口ECHO输出一个高电平，高电平持续的时间就是超声波从发射到返回的时间。测试距离=（高电平时间\\\
    *声速（340M/S））/2。\n\n（4）本模块使用方法简单，一个控制口发一个10US以上的高电平，就可以在接收口等待高电平输出。一有输出就可以开定时器计时，当此口变为低电平时就可以读定时器的值，此时就为此次测距的时间，方可算出距离。如此不断的周期测，即可以达到你移动测量的值。\n\
    \n![](images/txt016_4.jpg \"pagenumber_ebook=75,pagenumber_book=67\")\n\n图2-6-2　HC-SR04超声波传感器\n\
    \nHC-SR04超声波测距模块具有一个超声波发射器、接收器和控制电路组成，由单片机（Arduino）给TRIG口大于10us的高电平信号来触发测距。超声波测量传感器到障碍物的距离=高电平持续时间\\\
    *声音速度/2。\n\n表2-6-1　SR04技术参数\n\n![](images/txt016_5.jpg \"pagenumber_ebook=76,pagenumber_book=68\"\
    )\n\n活动二　　车体安装\n\n1.材料清单\n\n本实验项目所需要材料清单如表2-6-2所示。\n\n表2-6-2　智能避障小车材料清单\n\n![](images/txt016_6.jpg\
