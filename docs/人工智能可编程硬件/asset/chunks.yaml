    PCF8591模块说明：PCF8591是单片、单电源、低功耗8位CMOS数据采集器件，具有4个模拟输入、1个输出和1个串行I2C总线接口。3个地址引脚A0、A1和A2用于编程硬件地址，允许将最多8个器件连接至I2C总线而不需要额外硬件。器件的地址、控制和数据通过两线双向I2C总线传输。器件功能包括多路复用模拟输入、片上跟踪和保持功能、8位模数转换和8位数模拟转换。最大转换速率取决于I2C总线的最高速率。


    引脚定义：


    本模块左边和右边分别外扩2路排针接口，分别说明如下：


    左边AOUT芯片DA输出接口


    —AINO芯片模拟输入接口0


    —AIN1芯片模拟输入接口1


    —AIN2芯片模拟输入接口2


    —AIN3芯片模拟输入接口3


    右边SCL IIC时钟接口接树莓派的scl口


    —SDA IIC数字接口接树莓派的sda口


    —GND模块地外接地


    —VCC电源接口外接3.3V～5V


    PCF 8591模组包含了热敏和光敏电阻，模块共有3个红色短路帽，分别作用如下：


    P4接上P4短路帽，选择热敏电阻接入电路


    P5接上P5短路帽，选择光敏电阻接入电路


    P6接上P6短路帽，选择0～5V可调电压接入电路


