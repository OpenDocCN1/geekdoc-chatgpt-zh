    # 致同学们

    亲爱的同学们，你们好！

    欢迎大家走进“人工智能——可编程硬件”的编程世界。随着互联网、物联网、大数据的高速发展，技术、人和物质世界的联系更加密切。通过对硬件进行编程，实现更加智能的人居环境，是创造未来世界和造福人类的重要途径。在本书中，我们将跟随小伙伴锦锦和江江，一起探索和学习人工智能环境下，对开源硬件进行编程的相关内容。

