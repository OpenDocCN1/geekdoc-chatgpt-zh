    )\n\n图1-8-7　整体效果图\n\n至此，所有的布线与安装就已完毕。\n\n活动四：摄像头配置\n\n1.首先升级树莓派系统并应用最新的固件。可以输入以下命令来操作：\n\
    \nsudo apt-get update或者sudo apt-get upgrade\n\n2.运行树莓派配置工具来激活摄像头模块：\n\n$sudo raspi-config\n\
    \n选中Interfacing options，将camera选为enable。\n\n3.拍照\n\n用raspistill命令进行拍照，命令格式为：raspistill-o\
    \ ceshi.jpg\n\n活动五：程序实现\n\n1.用Python的OpenCV库来实时跟踪小球。先安装这个库。\n\nsudo apt-get update\n\
    \nsudo apt-get install python-opencv\n\n2.本程序还利用树莓派附带的gpiozero库，根据OpenCV库确定球的x坐标来转动电机。该代码能够根据黄色来确定球的位置，所以黄色是背景中独一无二的，否则无效。向程序提供较低和较高的颜色范围，以便确定球的位置。\n\
    \n3.OpenCV使用调用inRange（）函数的原理为：当前帧（来自网络摄像头）以及下部和上部颜色边界。确定框架上球的坐标后，如果球不在中心（640像素宽框架中x坐标范围为240～400），程序将告诉电机转动。如果球偏离中心，则马达将加快转动，而当球更靠近中心时，马达将减少转动。完整代码如下：\n\
