    只要启用了 VNC 的服务`tightvncserver`，我们无论是通过树莓派的有线网 IP 还是无线网 IP，都能登录到树莓派的桌面图形界面。现在，让我们对树莓派的工作环境稍作了解，并设置好它的无线网络。


    ## 第一节　了解树莓派的操作系统


    树莓派默认操作系统叫“Raspbain”。该系统是基于 Debain 操作系统，专门定制开发的小型操作系统。在图形界面下，这个系统的操作方式与 Windows
    系统差别不大。但在命令行下，则比 Windows 多很多命令与功能。树莓派除了可用“Raspbain”作操作系统外，也可使用 Android（安卓）、Ubuntu、CentOS、FreeBSD、Kali（黑客系统）、ArchLinux
    甚至 Windows10 做为操作系统。当我们熟悉树莓派之后，完全可以根据自己的需要安装另外的操作系统。


    ### 活动一：熟悉系统的桌面环境


