    \n### 项目导读\n\n在机器学习中，经常需要确定目标所属的类别。例如，要判定一个动物是狗、猫还是其他动物。解决这类问题的办法是先提供一些含有各种动物的数据集，让算法得到充分的训练学习，然后根据学习得到的先验信息对一个动物的类型做出判断。这种做法称为有监督学习，它分为训练和预测两个阶段。在训练阶段，使用大量的样本进行学习，得到一个判定动物类型的模型。在预测阶段，给出一张含有动物的图像，就可以使用这个模型预测出它的类别。\n\
