    数据不平衡问题主要存在于有监督学习任务中，具体是指在数据集中包含的两种数据集，分别是正样本数据集和负样本数据集，其中正样本数据集的数量远远大于负样本数据集数量，从而导致正、负样本在数量上产生巨大的差异性。在训练的过程中，算法过多地关注样本多的数据，容易导致样本数量少的数据分类功能下降。


