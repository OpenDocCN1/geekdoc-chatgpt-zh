    \n## 知识导图\n\n![](img/cba85b47e7b62410be6bbcef421bf9c1_77_0.png)\n\n## 任务 6-1 使用逻辑回归算法检测信用卡欺诈\n\
    \n## 任务描述\n\n本任务通过了解逻辑回归算法的基本原理和信用卡欺诈的定义，使用逻辑回归算法完成信用卡欺诈检测。\n\n## 任务目标\n\n熟练使用逻辑回归算法进行信用卡欺诈检测。\n\
    \n## 知识准备\n\n信用卡欺诈是指使用违法手段来骗取他人的财物的行为，它可以使用逻辑回归算法对其进行欺诈检测。逻辑回归算法可以将获取的预测值映射至区间（0，1）上，从而根据设定的阈值对其进行分类检测。\n\
    \n## 任务实施\n\n本任务将介绍逻辑回归算法的类型、与线性回归算法的区别、步骤与特点，通过理解相关知识，最后将逻辑回归算法应用于信用卡欺诈检测。\n\n\
    ## 步骤 1 了解逻辑回归算法的类型\n\n逻辑回归算法包含三种类型，具体如下。\n\n- (1) 二元逻辑回归：当响应为二元（即它有两种可能的结果）时使用。二元逻辑回归要求因变量只能包含两项，而且其值必须是\
    \ 0 和 1。1 表示肯定的含义，如愿意、是否购买等；0 表示否定的含义，如不愿意、否和不购买等。\n\n- (2) 名义逻辑回归：当存在 3 个或更多类别且级别没有自然排序时使用。名义响应的示例可能包括企业部门（如营销、销售和人力资源等），使用的搜索引擎类型（如谷歌、雅虎和百度）和颜色（如黑色、红色、蓝色和橙色）。\n\
    \n- (3) 顺序逻辑回归：当存在 3 个或更多响应类别且级别自然排序时使用，但级别的排名并不一定意味着它们之间的间隔相等。顺序响应的示例，如学生如何评价大学课程的有效性（好、中和差）、医疗健康状况（良好、稳定和严重）等。\n\
    \n## 步骤 2 了解线性回归与逻辑回归的区别\n\n逻辑回归算法可用于回归问题，但主要用于解决分类问题。从这个算法中得到的输出值范围总是 0~1，设定阈值可以轻松地将数据分类。逻辑回归算法与线性回归算法虽然有一些共同点，且逻辑回归术语中包含回归，但是它主要用于分类。逻辑回归算法在后面加入了非线性映射函数\
    \ sigmoid，如式（6-1）所示，输出的结果范围如式（6-2）所示。\n\n\\( y = \\frac{1}{1 + e^{-x}} \\) （6-1）\n\
    \n\\( 0 \\leqslant y \\leqslant 1 \\) （6-2）\n\n式中，\\( y \\) 表示 sigmoid 函数的输出；\\\
    ( x \\) 表示自变量。线性回归与逻辑回归的区别如表 6-1 所示。\n\n| 线性回归算法 | 逻辑回归算法 |\n| :--- | :--- |\n\
    | 需要标记良好的数据，这意味着它需要监督学习，且用于回归。因此，线性回归是一种监督回归算法 | 要求输入标记完整的数据，用于分类而不是回归。逻辑回归是一种监督分类算法\
    \ |\n| 获得的预测值通常可以在负无穷大到正无穷大的范围内 | 获得的预测值只是是在 0~1，允许在阈值的帮助下轻松分类 |\n| 没有激活函数 | 需要激活函数。在这种情况下，采用的是\
    \ sigmoid 函数 |\n| 没有阈值 | 需要阈值来确定每个实例的类别 |\n| 因变量本质上必须是连续的。这意味着不能传入变量，该变量是分类的并且期望在预测中具有连续值\
    \ | 因变量必须是分类的。这意味着它应该有不同的类别（不超过两个） |\n| 该算法的目标是通过训练数据点找到最佳拟合线 | 如果对逻辑回归方程的系数进行更改，那么它的整个结果图都会改变形状\
    \ |\n| 假设传入该算法的值遵循标准正态分布 | 假设传入该算法的值服从二项式分布 |\n| \\( L(\\theta) = \\sum_{i=1}^{n}\
    \ (y(x_i) - y_i)^2 \\) | \\( L(\\theta) = \\begin{cases} -\\log(y(x)), & y=1 \\\
