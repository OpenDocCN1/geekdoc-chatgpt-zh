  - "[PAGE 47]\n\n# 步骤 2 认识肘部法则\n\n畸变程度是指簇中心与簇内成员位置距离的平方和，对于一个簇而言，畸变程度越低，表明簇内成员越紧密；畸变程度越高，表明簇内结构越松散。对于有一定区分度的数据，在达到某个临界点时，畸变程度会得到极大改善，之后缓慢下降，这个临界点就可以考虑为局类性能较好的点，基于这个指标重复训练多个\
