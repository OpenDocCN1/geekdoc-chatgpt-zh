    # 知识准备


    # 决策树算法原理


    决策树是一种功能强大、流行的分类和预测工具。决策树的基本结构类似于树结构，如图 7-1 所示。其中，每个内部节点表示对一个属性的测试，每个分支表示测试的结果，每个叶节点（终端节点）表示持有一个类标签。


    ![](img/cba85b47e7b62410be6bbcef421bf9c1_91_0.png)


    图 7-1 决策树的结构


    决策树可以通过基于属性值测试将源集拆分为子集来“学习”树，以递归的方式在每个派生子集上重复此过程，此过程称为递归分区。当一个节点的子集都具有相同的目标变量值，或者当分裂不再为预测增加值时，递归就完成了。决策树分类器的构建不需要任何领域的知识或参数设置，因此适用于探索性知识发现。决策树还可以处理高维数据。一般而言，决策树分类器具有较高的准确性。决策树归纳法是一种典型的学习分类知识的归纳法。'
  - '[PAGE 92]


    决策树一般是从树的根节点到某个叶节点进行排序来对实例进行分类，因此提供了实例的分类，一个实例的分类是从树的根节点开始，测试这个节点指定的属性，然后按照比较结果沿着选择的分支向下移动，再对子树重复这个过程，直至叶子节点。


    常见的决策树算法有 ID3（Iterative Dichotomiser 3）算法、C4.5（Classification 4.5）算法和 CART（Classification
    and Regression Tree）算法等。其中，C4.5 算法是 ID3 算法的改进版本，CART 算法则是 ID3 和 C4.5 算法的改进版本。


    决策树算法的优缺点如下。


    优点：决策树算法可用于回归和分类设置；建模前无须了解参数；决策树的可解释性强；能够快速构建决策树；不需要缩放特征来拟合决策树。


    缺点：如果决策树继续分裂，过度拟合的可能性非常高；决策树在每次拆分时都进行了优化，有可能会导致错误的结果；不平衡数据集导致出现低使用率。


    # 任务实施


