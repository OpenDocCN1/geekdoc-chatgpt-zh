    +   （3）不对数据做任何假设。这意味着它可以用于解决各种各样的问题。

    +   2) 缺点

    +   （1）存储大部分或全部数据，需要占用大量内存空间且计算成本高。大型数据集可能导致预测需要很长时间。

    +   （2）对数据集的规模非常敏感。


