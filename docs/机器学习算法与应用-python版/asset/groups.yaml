    \n图 6-4 原始数据分布的柱状图\n\n## 步骤 2 使用重新采样数据集策略\n\n目前有多种策略可以处理数据不平衡问题，例如，将数据输入训练模型之前，改进分类算法或平衡训练数据中的类别。一般情况下采用采样数据集策略方法，它的主要思想是增加少数类的样本，或者减少多数类的样本，这样做是为了在两个类的实例数量上获得一定的平衡。\n\
    \n本书介绍两种处理样本不平衡的方法：随机过采样，添加来自少数类的实例副本；随机欠采样，从多数类中删除实例。\n\n- 随机欠采样。当训练集的数量很大时，它可以通过减少训练数据样本的数量来帮助提高模型的运行时间并解决内存问题。缺点是它可以丢弃有关数据本身的有用信息，这些信息对于构建基于规则的分类器（如随机森林）可能是必要的。随机欠采样选择的样本可能是有偏样本，因此，它可能导致分类器在真实的数据上表现不佳。\n\
    \n- 随机过采样。就像随机欠采样一样，也可以执行随机过采样。在这种情况下，可以通过随机复制和重复少数类样本得到均衡的数据。随机过采样的优点是它不会导致信息丢失，缺点是它增加了过度拟合的可能性。\n\
    \n## 步骤 3 使用 SMOTE 过采样\n\nSMOTE 是一种过采样方法，它创建“合成”示例，而不是通过替换进行过采样。通过获取每个少数类样本的 k\
    \ 个最近邻居的线段引入合成示例，对少数类进行过采样。根据所需的过采样量，随机选择 k 个最近邻居。SMOTE 过采样的优缺点如下。\n\n优点：由于生成合成示例而不是复制示例，所以减轻了由随机过采样引起的过度拟合；不会丢失信息；容易实现和解释。\n\
    \n缺点：在生成合成示例时，SMOTE 不考虑相邻示例可能来自其他类，增加类的重叠并可能引入额外的噪声；SMOTE 对于高维数据不太实用。\n\n本任务所需要的代码如下。\n\
    \n【代码 6-4】\n\n```python\n# 第一步: 安装所需要的库\npip install imbalanced-learn\n# 第二步:\
