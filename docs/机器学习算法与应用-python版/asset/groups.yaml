    \n![](img/cba85b47e7b62410be6bbcef421bf9c1_119_0.png)\n\n## 任务 9-1 人工神经网络反向传播计算\n\
    \n### 任务描述\n\n理解人工神经网络的具体定义和基本原理，使用人工神经网络算法解决反向传播计算问题。\n\n### 任务目标\n\n掌握人工神经网络算法的基本实现步骤。\n\
    \n### 知识准备\n\n### ANN 算法概述\n\n人工神经网络旨在模拟人脑分析和处理信息的方式，是人工智能（Artificial Intelligence，AI）的基础，可以解决人类或统计标准证明不可能或难以解决的问题。人工神经网络具有自主学习能力，能够在获得更多数据时产生更好的结果。\n\
    \n人工神经网络从信息处理的角度对人脑神经元网络进行抽象，建立模型，神经元节点像网络一样相互连接。人脑有数千亿个称为神经元的细胞，每个神经元由一个细胞体组成，细胞体负责通向大脑（输入）和远离（输出）大脑来处理信息。\n\
    \n人工神经网络有成百上千个称为处理单元的人工神经元，它们通过节点相互连接。这些处理单元由输入单元和输出单元组成。输入单元基于内部加权系统接收各种形式和结构的信息，神经网络尝试了解所呈现的信息来生成一份输出报告。就像人类需要规则和指南来得出结果或输出一样，人工神经网络也使用一组称为反向传播的学习规则来完善其输出结果。\n\
    \n人工神经网络最初会经历一个训练阶段，在这个阶段它学会识别数据中的模式，无论是视觉上、听觉上还是文本上。在这个监督阶段，网络将其实际产生的输出与预期产生的输出进行比较。两种结果之间的差异使用反向传播进行调整。这意味着网络向后工作，从输出单元到输入单元来调整单元之间连接的权重，直至实际结果和期望结果之间的差异产生尽可能低的误差。\n\
    \n基于 ANN 算法的人工智能平台正在颠覆传统的办公方式。从网页翻译成其他语言，到让虚拟助手在线订购杂货，再到与聊天机器人对话解决问题，人工智能平台正在简化交易，并以很低的成本让所有人都能获得服务。\n\
    \n![](img/cba85b47e7b62410be6bbcef421bf9c1_120_0.png)\n\n人工神经网络已应用于几乎所有操作领域。电子邮件服务提供商使用\
    \ ANN 算法来检测和删除用户收件箱中的垃圾邮件；财务经理用它来预测公司股票的走势；信用评级公司使用它来改进公司的信用评分方法；电子商务平台使用它向受众提供个性化推荐；ANN\
    \ 算法还可以预测事件发生的可能性。\n\n### 任务实施\n\n本任务主要围绕人工神经网络的基本原理展开介绍，其中，包括人工神经网络概述、应用场景、不同层数的人工神经网络和常用的激活函数等。\n\
    \n### 步骤 1 了解单层与多层网络\n\n人工神经网络中需要计算的层次称为计算层，拥有一个计算层的称为单层人工神经网络，如图 9-1 所示。其中，$x_i$\
    \ 为输入，$w_i$ 为权重。单层人工神经网络只包含输入层和输出层，输入层用于数据的传输，不作计算，输出层则是对前面一层的输入进行计算。\n\n多层人工神经网络是指包含计算层的网络，比单层神经网络多了隐含层，如图\
    \ 9-2 所示。\n\n![](img/cba85b47e7b62410be6bbcef421bf9c1_121_0.png)\n\n![](img/cba85b47e7b62410be6bbcef421bf9c1_121_1.png)\n\
    \n神经网络中的激活函数用于改变数据的线性关系，这样可以增强神经网络的拟合能力。如果隐含层的个数超过 1，则称为深度人工神经网络。\n\n### 步骤 2\
    \ 认识常用激活函数\n\nANN 算法常用的激活函数有 tanh、ReLU、Leaky ReLU 和 Sigmoid。\n\ntanh 激活函数如下：\n\
    \n\\( f(x)=\\frac{2}{1+e^{-2x}}-1 \\)\n\nReLU 激活函数如下：\n\\( f(x)=\\left\\{\\begin{array}{ll}\
    \ 0, & x<0 \\\\ x, & x\\geqslant 0 \\end{array}\\right. \\)\n\nLeaky ReLU 激活函数如下：\n\
    \\( f(x)=\\left\\{\\begin{array}{ll} 0.01x, & x<0 \\\\ x, & x\\geqslant 0 \\end{array}\\\
    right. \\)\n\nSigmoid 激活函数的形式如下：\n\\( f(x)=\\frac{1}{1+e^{-x}} \\)\n\n### 步骤 3\
    \ 了解权重调整训练过程\n\n- 权重求解的过程如下。\n- （1）网络初始化。\n- （2）前向传播。\n- （3）残差计算。\n- （4）更新权重。\n\
    - （5）返回至（1），直至达到退出条件（误差或者迭代次数达到上限）。\n\n权重调整训练是根据误差并通过反向传播完成的，常见的误差计算公式如下：\n\\\
    ( L=\\frac{1}{2}\\sum_{i=1}^n(y_i-\\hat{y}_i) \\)\n\n### 步骤 4 权重调整训练\n\n在此实例中，使用到的网络结构信息如图\
    \ 9-3 所示，激活函数为 Sigmoid，学习率 \\(\\eta\\) 为 0.1。\n\n#### 1. 前向传播过程\n\n- （1）输入层到隐含层的节点间计算。\n\
    \n\\(\\text{ha}_{\\text{in}}=w_{11} \\cdot x=0.6 \\times 0.1=0.06\\)\n\\(\\text{hb}_{\\\
    text{in}}=w_{12} \\cdot x=0.3 \\times 0.1=0.03\\)\n\\(\\text{ha}_{\\text{out}}=\\\
    frac{1}{1+\\exp(-\\text{ha}_{\\text{in}})}=0.5150\\)\n\\(\\text{hb}_{\\text{out}}=\\\
    frac{1}{1+\\exp(-\\text{hb}_{\\text{in}})}=0.5075\\)\n\n![](img/cba85b47e7b62410be6bbcef421bf9c1_122_0.png)\n\
    \n- （2）隐含层到输出层的节点间计算。\n\n\\( y_{in} = [w_{21} \\ w_{22}] \\cdot \\begin{bmatrix}\
    \ ha_{out} \\\\ hb_{out} \\end{bmatrix} = w_{21} \\cdot ha_{out} + w_{22} \\cdot\
    \ hb_{out} \\\n= 0.6 \\times 0.5150 + 0.4 \\times 0.5075 = 0.5120 \\\\\n\\( y_{out}\
    \ = \\frac{1}{1 + \\exp(-y_{in})} = 0.6253 \\\\\n\\( L = \\frac{1}{2} (y_{out}\
    \ - y)^2 = 0.0079 \\)\n\n#### 2. 反向传播过程\n\n- (1) 输出层到隐含层参数更新。\n\n\\( \\frac{\\\
    partial L}{\\partial w_{21}} = \\frac{\\partial L}{\\partial y_{out}} \\cdot \\\
    frac{\\partial y_{out}}{\\partial y_{in}} \\cdot \\frac{\\partial y_{in}}{\\partial\
    \ w_{21}} \\)\n\n计算 \\( \\frac{\\partial L}{\\partial y_{out}} \\) :\n\n\\( L\
    \ = \\frac{1}{2} (y_{out} - y)^2 \\\\\n\\frac{\\partial L}{\\partial y_{out}}\
    \ = -(y - y_{out}) = -(0.5 - 0.6253) = 0.1253 \\)\n\n计算 \\( \\frac{\\partial y_{out}}{\\\
    partial y_{in}} \\) :\n\n\\( y_{out} = \\frac{1}{1 + \\exp(-y_{in})} \\\\\n\\\
    frac{\\partial y_{out}}{\\partial y_{in}} = y_{out}(1 - y_{out}) = 0.6253 \\times\
    \ (1 - 0.6253) = 0.2345 \\)\n\n计算 \\( \\frac{\\partial y_{in}}{\\partial w_{21}}\
    \ \\) :\n\n\\( y_{in} = w_{21} \\cdot ha_{out} + w_{22} \\cdot hb_{out} \\\\\n\
    \\frac{\\partial y_{in}}{\\partial w_{21}} = ha_{out} = 0.5150 \\)\n\n最后得到\n\n\
    \\( \\frac{\\partial L}{\\partial w_{21}} = 0.1253 \\times 0.2345 \\times 0.5150\
    \ = 0.0151 \\)\n\n更新 \\( w_{21} \\) 的值：\n\n\\( w_{21} = w_{21} - \\eta \\cdot\
    \ \\frac{\\partial L}{\\partial w_{21}} = 0.6 - 0.1 \\times (0.0151) = 0.5985\
    \ \\)\n\n\\( w_{21} \\) 与 \\( w_{22} \\) 求解方法一样，这里不做过多讲解。\n"
