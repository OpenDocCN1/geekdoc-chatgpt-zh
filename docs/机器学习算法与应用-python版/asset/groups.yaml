    回归算法是一种用于数值连续的随机变量预测和建模的有监督学习算法。用例一般包括持续变化的情况，如房价预测、股票趋势或测试结果。常见的回归方法包括线性回归、逻辑回归和岭回归。常见的应用场景如处理机场客流量分布预测等问题。


    分类算法根据样本的特点，将样本划分为适当的类别。具体而言，利用训练样本进行训练，得到样本特征到样本标签的映射，再利用映射得到新样本的标签，最后将样本划分为不同的类别。常用的应用场景如处理市民出行选乘公交线路预测等问题。


    # 任务 1-3 软件库与框架


    # 任务描述


    认识了机器学习的应用场景和算法分类后，让我们继续了解机器学习需要什么软件库来支持算法的运行。


    # 任务目标


    了解目前主流的机器学习 Python 开发框架和软件库。


    # 任务实施


    基于 Java、C、Python 等编程语言开发的机器学习常用库有很多，本任务主要介绍基于 Python 的软件库。Python 软件库具有以下三个特点：其一，Python
    语言的实现过程相对简单，可以减少在工程实现过程上的时间，增加在算法设计上的时间，提高工作效率；其二，Python 语言有非常丰富的库可以调用，如 NumPy、Sklearn、Pandas
    等；其三，Python 代码调试比较容易。以下是机器学习中常用的 Python 库及开发框架。


    # 步骤 1 认识 NumPy


    NumPy 是 Python 语言的一个扩展库，支持大量的维数数组和矩阵运算。此外，它还为数组操作提供了大量的数学函数库，运算速度非常快，拥有在线性代数、傅立叶变换和矩阵领域工作的函数。NumPy
    由特拉维斯·奥利芬特（Travis Oliphant）于 2005 年创建。它是一个开源项目，可以供开发者自由使用。


    # 步骤 2 认识 Sklearn


    Sklearn 是 Python 中最健壮的机器学习库。它通过 Python 的一致性接口为机器学习和统计建模提供了一系列有效的工具，如图 1-3 所示，包括分类、回归、聚类和降维四'
  - '[PAGE 13]


    类算法，可以直接调用里面的机器学习方法。Sklearn 主要是用 Python 编写的，是基于 NumPy、SciPy 和 Matplotlib 构建的。


    ![](img/cba85b47e7b62410be6bbcef421bf9c1_13_0.png)


    # 步骤 3 认识 Matplotlib


    Matplotlib 是 Python 中的一个低级图形打印库，可用于可视化。Matplotlib 是开源的，开发者可以免费使用。Matplotlib 大部分是采用
    Python 编写的，为了与平台兼容，有一些片段是采用 C、Objective-C 和 JavaScript 语言编写的。


    # 步骤 4 认识 SciPy


    SciPy 库依赖于 NumPy，它提供了方便快捷的 N 维数组操作。SciPy 库是为使用 NumPy 数组而构建的，它提供了很多对用户友好且高效的数值计算功能，如用于数值积分和优化的例程。


    # 步骤 5 认识 TensorFlow


    TensorFlow 是一个用于机器学习端到端的开源平台。它有一个由工具、库和社区资源组成的全面、灵活的生态系统，使研究人员能够推动深度学习技术发展，开发人员可以轻松地构建和部署基于深度学习的应用程序。


    TensorFlow 最初是由谷歌大脑团队的研究人员和工程师开发的，用于进行机器学习和神经网络研究，提供稳定的 Python API 和 C++ API，以及其他语言的非保证向后兼容
    API。TensorFlow 具有足够的通用性，可以应用于许多领域。


    # 步骤 6 认识 CUDA


    CUDA 是 NVIDIA 推出的通用并行计算框架，为图形处理器（Graphics Processing Unit，GPU）上的通用计算而开发。有了 CUDA，开发人员可以利用
    GPU 的强大功能极'
  - '[PAGE 14]


    大地加快计算应用程序的速度。在 GPU 加速的应用程序中，CPU 针对单线程进行了优化，工作负载的顺序指令执行的部分在 CPU 上运行。


    # 步骤 7 认识 cuDNN


    CUDA 深度神经网络（CUDA Deep Neural Network，cuDNN）库是 GPU 加速的深度神经网络原始库。cuDNN 可以极大地优化标准倒程的实现，如卷积层、池化层、规范化层和激活层，用于前向和后向传播。


    大多数的深度学习研究人员和框架开发人员都依赖 cuDNN 实现高性能 GPU 加速。有了 cuDNN，研究人员和开发人员可以专注于训练神经网络和开发软件应用程序，而无须花费时间进行低水平的
    GPU 性能调整。cuDNN 可以加速诸多被广泛使用的深度学习框架，包括 Caffe2、Chainer、Keras、MATLAB、Mxnet、PyTorch
    和 TensorFlow。


