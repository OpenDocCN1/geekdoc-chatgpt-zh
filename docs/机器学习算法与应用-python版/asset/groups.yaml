    \n支持向量机（Support Vector Machines，SVM）是目前受欢迎的机器学习算法之一，属于一种二分类模型。其基本思想是准确地划分数据集并且分离出间隔最大的超平面，即选择最合适的边距将两种类别进行分离。SVM\
