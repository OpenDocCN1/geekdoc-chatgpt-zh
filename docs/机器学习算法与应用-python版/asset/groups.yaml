    \ $y$ 值与实际 $y$ 值的接近程度。线性回归的成本函数是均方误差，是指所有不同数据点的预测值和真实值之间的平均（平方）误差，如式（5-2）所示。成本函数用于计算成本，该成本捕获预测目标值与真实目标值之间的差异。如果拟合线远离数据点，则成本会更高。训练的目的是调整模型的权重，直到找到最小误差的参数。\n\
