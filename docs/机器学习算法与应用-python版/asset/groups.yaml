    \n神经网络中的激活函数用于改变数据的线性关系，这样可以增强神经网络的拟合能力。如果隐含层的个数超过 1，则称为深度人工神经网络。\n\n### 步骤 2\
    \ 认识常用激活函数\n\nANN 算法常用的激活函数有 tanh、ReLU、Leaky ReLU 和 Sigmoid。\n\ntanh 激活函数如下：\n\
