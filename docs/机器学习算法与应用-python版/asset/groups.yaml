    \ K 折交叉验证。KNN 算法交叉验证的步骤如图 4-5 所示。\n\n在 K 折交叉验证中，选择 K 个不同的数据子集作为验证集，并在剩余数据上训练 K\
    \ 个模型，之后评估模型的性能并平均它们的结果。\n\n![](img/cba85b47e7b62410be6bbcef421bf9c1_63_0.png)\n\
    \n图 4-5 KNN 算法交叉验证示意图\n\nK 折交叉验证保证了模型的分数不依赖于选择训练值和测试集的方式。将数据集划分为 K 个子集，并且保持方法重复\
    \ K 次。具体步骤如下。\n\n- 1. 将整个数据集随机分成 K 个子集 ( 折叠 )。\n- 2. 选择一个子集作为测试集，其余 K-1 个子集为训练集，在训练集上训练后得到一个模型，然后用测试集测试这个模型，保存模型的性能评估指标。\n\
    - 3. 重复第 (2) 步 K-1 次，直到每个子集都用作测试集。\n- 4. 求 K 个评估指标的平均值即交叉验证准确率，并将其作为模型的性能指标。\n\
    \n因为 K 折交叉验证确保来自原始数据集的每个数据都有机会出现在训练集和测试集中，所以与其他方法相比，这种方法得到的模型通常偏差较小。如果数据量有限，K\
    \ 折交叉验证是提高模型泛化能力最好的办法之一。\n\nK 折交叉验证的缺点是训练算法必须从头开始运行 K 次，这意味着评估需要 K 倍的计算量。\n\n\
