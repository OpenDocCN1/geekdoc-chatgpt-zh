    \ CART 算法\n\nCART 分类树算法的分支标准是基于基尼指数（Gini）的，其中基尼指数表示为 1 减去每个类别在当前子集的所有事件上发生的概率之和。与信息增益不同，基尼指数不是计算密集型的，因为它不涉及用于计算信息增益熵的对数函数。Gini\
    \ 的值越小说明样本集合的纯度越高，值越大说明样本集合的纯度越低。如果所有元素都属于一个类，那么它可以被称为纯元素。基尼指数的程度在 0～1 变化，其中，0\
    \ 表示所有元素都属于某个类，1 表示元素随机分布在各个类中。0.5 的基尼指数表示元素在某些类中平均分布。基尼指数计算公式如式（7-3）、式（7-4）所示。\n\
    \n```\n$$Gini(H) = \\sum_{k=1}^n p_k(1-p_k) = 1 - \\sum_{k=1}^k p_k^2$$  \n(7-3)\n\
    ```\n\n式中，H 为样本集合；$p_k$ 表示选中的样本属于 $k$ 类别的概率。\n\n基于属性 $a$ 将样本集合 $H$ 划分为 $I$ 个子集，此时的基尼指数计算公式为\n\
    \n```\n$$GiniIndex(H, a) = \\sum_{i=1}^I \\frac{|H^i|}{|H|} Gini(H^i)$$  \n(7-4)\n\
    ```\n\n式中，$H^i$ 表示第 $i$ 个子集。\n\n不同于 ID3 算法和 C4.5 算法，CART 还可以用于回归。一般 CART 回归树算法使用平方误差最小化准则，进行特征选择，生成二叉树。\n\
    \n```\n$$\\min \\sum_{n=1}^N \\left( y_n - \\sum_{m}^M O_{mI} \\right)^2$$  \n\
    (7-5)\n```\n\n式中，参数 $O_m$ 表示当样本属于第 $m$ 个叶子节点时，对应的 CART 回归树的输出值。"
