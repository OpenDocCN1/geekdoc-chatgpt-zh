    KNN 的思想简单，易于理解，它的工作机制如下。首先，在图上描绘一堆数据点，沿着图以小集群形式展开，如图 4-1 所示。KNN 检查数据点的分布，并根据提供给模型的参数将数据点分组。然后为这些组分配一个标签。KNN
    模型做出的主要假设是，让彼此靠近的数据点 / 实例高度相似，如果一个数据点远离另一组，则它与另一组的数据点类型不同。


    ![](img/cba85b47e7b62410be6bbcef421bf9c1_54_0.png)


    图 4-1 数据分布


    # 2. KNN 算法的优缺点


    +   1) 优点

    +   （1）可用于回归和分类任务。

