    \ y_train, y_test = train_test_split(X, y)\n# 第四步: 定义 SMOTE 模型\nfrom imblearn.over_sampling\
    \ import SMOTE\nOS=SMOTE(random_state=1)\nX_train,y_train=OS.fit_resample(X_train,y_train)\n\
    # 第五步: 数据归一化\nfrom sklearn.preprocessing import StandardScaler\nstd = StandardScaler()\n\
    X_train = std.fit_transform(X_train)\nX_test = std.transform(X_test)\n# 第六步: 训练模型并进行预测\n\
    from sklearn.linear_model import LogisticRegression\nLR = LogisticRegression(max_iter=1000)\n\
    LR.fit(X_train, y_train)\ny_train_hat = LR.predict(X_train)\ny_train_hat_probs\
    \ = LR.predict_proba(X_train)[:,1]\n# 第七步: 输出训练过程结果\nfrom sklearn.metrics import\
    \ roc_curve, roc_auc_score, classification_report, accuracy_score, confusion_matrix\n\
    train_accuracy = accuracy_score(y_train, y_train_hat)*100\ntrain_auc_roc = roc_auc_score(y_train,\
    \ y_train_hat_probs)*100\nprint('混淆矩阵:\\n', confusion_matrix(y_train, y_train_hat))\n\
    print('训练 AUC: %.4f %%' % train_auc_roc)\nprint('训练准确率: %.4f %%' % train_accuracy)\n\
    y_test_hat = LR.predict(X_test)\ny_test_hat_probs = LR.predict_proba(X_test)[:,1]\n\
    test_accuracy = accuracy_score(y_test, y_test_hat)*100\ntest_auc_roc = roc_auc_score(y_test,\
    \ y_test_hat_probs)*100\nprint('混淆矩阵:\\n', confusion_matrix(y_test, y_test_hat))\n\
    print('测试 AUC: %.4f %%' % test_auc_roc)\nprint('测试准确率: %.4f %%' % test_accuracy)\n\
