    ## 任务 10-4 使用 AdaBoost 算法实现曲线预测


    ### 任务描述


    使用 AdaBoost 算法处理曲线预测问题。


    ### 任务目标


    掌握曲线预测的基本实现步骤。


    ### 任务实施


    此任务使用 AdaBoost 算法对非线性数据进行拟合，并与决策树算法和支持向量机算法进行对比，具体实现代码如下。


    ### 【代码 10-4】


    ```

    # 第一步：装载数据

    import numpy as np

    X = np.linspace(-10, 10, 1000)

    data = X.reshape(-1,1)

    target = X + 0.4*np.random.rand(len(X))

    import matplotlib.pyplot as plt

    plt.rcParams[''font.sans-serif'']=[u''SimHei'']

    plt.rcParams[''axes.unicode_minus'']=False

    plt.plot (data, target)

    plt.xlabel(''输入'')

    plt.ylabel (''输出'')

    plt.show()

    # 第二步：数据集划分

    from sklearn.model_selection import train_test_split

    X_train, X_test, y_train, y_test = train_test_split(data,target,train_size=0.98)

    # 第三步：选择并训练模型

    from sklearn.tree import DecisionTreeRegressor

    from sklearn.ensemble import AdaBoostRegressor

    regr_1 = DecisionTreeRegressor(max_depth=20)

    from sklearn.svm import SVR

    regr_2 = AdaBoostRegressor(base_estimator=SVR(kernel=''rbf''),n_estimators=50)

    regr_3 = SVR(kernel=''rbf'')

    regr_1.fit(X_train, y_train)

    regr_2.fit(X_train, y_train)

    regr_3.fit(X_train, y_train)

    # 第四步：结果预测

    y_pred1 = regr_1.predict(X_test)

    y_pred2 = regr_2.predict(X_test)

    y_pred3 = regr_3.predict(X_test)

    # 输出结果

    from sklearn.metrics import mean_squared_error

    print(''######################## 原始数据 ##########################'')

    print(y_test)

    print(''######################## 决策树预测 ##########################'')

    print(y_pred1)

    print(''######################## Adaboost+SVR##########################'')

    print(y_pred2)

    print(''###############################SVR###############################'')

    print(y_pred3)

    ```


