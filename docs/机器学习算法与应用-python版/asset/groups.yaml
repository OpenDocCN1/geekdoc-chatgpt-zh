    \ 和 $x$ 之间的线性函数，该函数描述两个变量之间的关系。目标变量 $y$ 和输入变量 $x$ 之间的关系可以通过在图上绘制坐标点并画一条直线来描绘，使坐标点均匀分布在直线两侧，这条直线能描述\
