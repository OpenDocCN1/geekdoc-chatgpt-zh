    \n### 任务目标\n熟练掌握 KNN 算法交叉验证的基本原理、作用并使用交叉验证方法选择合适的 K 值。\n\n## 知识准备\n\n近年来，人工智能技术已成功应用到医疗领域。研究者通过人工智能技术对患者的医疗生理数据进行分析并建立模型，从而判断就诊者是否患病。这个判断过程可以充分利用历史数据，并对其进行分析，推理得到有用的知识，还可以学习到专家的实际经验，为诊断结果提供更可靠的保证。\n\
