    - 使用决策树回归算法实现曲线预测\n- 使用决策树算法预测波士顿房价\n\n### 任务 7-1 使用决策树算法实现鸢尾花分类\n\n### 任务描述\n\
    \n前面的项目已经对鸢尾花分类问题有了详细的讲解，其实鸢尾花分类问题可以采用多种机器学习算法来解决。本任务将使用决策树算法处理鸢尾花分类问题。\n\n###\
    \ 任务目标\n\n掌握决策树算法的基本实现步骤，并熟练使用决策树算法解决鸢尾花分类问题。\n\n### 知识准备\n\n### 决策树算法原理\n\n决策树是一种功能强大、流行的分类和预测工具。决策树的基本结构类似于树结构，如图\
    \ 7-1 所示。其中，每个内部节点表示对一个属性的测试，每个分支表示测试的结果，每个叶节点（终端节点）表示持有一个类标签。\n\n![](img/cba85b47e7b62410be6bbcef421bf9c1_91_0.png)\n\
    \n图 7-1 决策树的结构\n\n决策树可以通过基于属性值测试将源集拆分为子集来“学习”树，以递归的方式在每个派生子集上重复此过程，此过程称为递归分区。当一个节点的子集都具有相同的目标变量值，或者当分裂不再为预测增加值时，递归就完成了。决策树分类器的构建不需要任何领域的知识或参数设置，因此适用于探索性知识发现。决策树还可以处理高维数据。一般而言，决策树分类器具有较高的准确性。决策树归纳法是一种典型的学习分类知识的归纳法。\n\
    \n决策树一般是从树的根节点到某个叶节点进行排序来对实例进行分类，因此提供了实例的分类，一个实例的分类是从树的根节点开始，测试这个节点指定的属性，然后按照比较结果沿着选择的分支向下移动，再对子树重复这个过程，直至叶子节点。\n\
    \n常见的决策树算法有 ID3（Iterative Dichotomiser 3）算法、C4.5（Classification 4.5）算法和 CART（Classification\
    \ and Regression Tree）算法等。其中，C4.5 算法是 ID3 算法的改进版本，CART 算法则是 ID3 和 C4.5 算法的改进版本。\n\
    \n决策树算法的优缺点如下。\n\n优点：决策树算法可用于回归和分类设置；建模前无须了解参数；决策树的可解释性强；能够快速构建决策树；不需要缩放特征来拟合决策树。\n\
    \n缺点：如果决策树继续分裂，过度拟合的可能性非常高；决策树在每次拆分时都进行了优化，有可能会导致错误的结果；不平衡数据集导致出现低使用率。\n\n## 任务实施\n\
    \n本任务主要围绕决策树的基本原理进行深入讲解，需要理解什么是决策树，通过决策树可以解决什么问题，并且采用案例驱动的方式来详细解释决策树的原理以及决策树的用法。\n\
    \n## 步骤 1 认识 ID3 算法\n\nID3 算法中涉及熵的概念。熵是指测量数据中存在的“信息量”，表示离散事件发生的概率。这个数量不仅基于变量中存在的不同值的数量，还基于变量的值所保持的意外估计数量。事件越具有确定性，它所包含的信息就越少。简而言之，信息是不确定性或熵的增加。\n\
    \nID3 算法通过式（7-1）计算每个特征的信息熵（Ent（h）），再根据式（7-2）计算每个特征的信息增益（Gain（H，a）），接下来通过比较每个特征对应的信息增益的大小选择信息增益最大的特征。其中，信息增益可表示为一个由两部分组成的函数，其含义是父数据集和其在特定属性上产生的分割子集之间的熵差异，本质上是熵的加权度量。\n\
    \nEnt (H) = -\\sum_{i=1}^n p\\left(x_i\\right) \\log_2 p\\left(x_i\\right) \\\
    qquad \\text{(7-1)}\n\nGain (H, a) = Ent(H) - \\sum_{i=1}^n \\frac{\\left|H^i\\\
    right|}{|H|} \\text{Ent}\\left(H^i\\right) \\qquad \\text{(7-2)}\n\n其中，式（7-1）中\
    \ H 表示样本集合；\\( p\\left(x_i\\right) \\) 表示输出 \\(x_i\\) 值的概率。式（7-2）中 a 表示属性；H 表示样本集合；\\\
    (H^i\\) 表示按照属性 \\(a\\) 数据集 H 的第 \\(i\\) 个划分。\n"
