    # 步骤 2 了解线性回归与逻辑回归的区别


    逻辑回归算法可用于回归问题，但主要用于解决分类问题。从这个算法中得到的输出值范围总是 0~1，设定阈值可以轻松地将数据分类。逻辑回归算法与线性回归算法虽然有一些共同点，且逻辑回归术语中包含回归，但是它主要用于分类。逻辑回归算法在后面加入了非线性映射函数
    sigmoid，如式（6-1）所示，输出的结果范围如式（6-2）所示。


    ```

    \( y = \frac{1}{1 + e^{-x}} \) （6-1）


    \( 0 \leqslant y \leqslant 1 \) （6-2）

    ```


    式中，\( y \) 表示 sigmoid 函数的输出；\( x \) 表示自变量。线性回归与逻辑回归的区别如表 6-1 所示。


    | 线性回归算法 | 逻辑回归算法 |

    | :--- | :--- |

