    \n- (1) 根据平方差误最小化准则计算最优切分变量与切分点。\n- (2) 用选定的点与切分变量划分区域并得到相应的输出值。\n- (3) 重复步骤（1）继续对两个子区域进行切分，直至满足停止条件。\n\
    - (4) 输出决策树。\n\nID3 算法和 CART 算法的区别如表 7-2 所示。\n\n## 表 7-2 ID3 算法和 CART 算法的区别\n\n\
