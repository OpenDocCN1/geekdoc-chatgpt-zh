    在 3 个分类器中，分类器 2 的误差率最高，分类器 1 与分类器 3 的误差率相同，因此按照规则，选择分类器 1 或分类器 3 为最佳分类器。


    本任务选择分类器 3 作为基础分类器。


    对于二元分类问题，第 $i$ 轮弱分类器的权重为


    \(\lambda_i = \frac{1}{2} \log \frac{1-e_i}{e_i}\)


    式中，\(e_i\) 表示第 $i$ 轮分类器的分类误差率。第 1 轮分类器 3 的误差率为 3，于是


    \(\lambda_1 = \frac{1}{2} \log \frac{1-e_1}{e_1} = \frac{1}{2} \log \frac{1-0.3}{0.3}
    = 0.4236\)


    分类器 \(G_1(x)\) 为


    \(G_1(x) = \lambda_1 f_3(x) = 0.4236 f_3(x)\)


    下面更新权值，假设第 $k$ 轮弱分类器的权重向量为 \(D_k=[w_{k1}, w_{k2}, \cdots, w_{k10}]\)，则第 $k+1$
    轮弱分类器的权重为


    \(w_{k+1, i} = \frac{w_{k, i}}{Z_k} \exp(-\lambda_k y_i G_k(x_i)), \quad i=1,
    2, \cdots, 10\)


    式中，\(Z_k\) 为规范化因子，且


    \(Z_k = \sum_{i=1}^{10} w_{k, i} \cdot \exp(-y_i \lambda_k G_k(x_i))\)


    于是，在第 2 轮中


    \(Z_1 = \sum_{i=1}^{10} w_{1, i} \exp(-y_i \lambda_1 G_1(x_i))\)

    \(= \sum_{i=1}^{3} 0.1 \times \exp(-[1 \times 0.4236 \times 1]) + \sum_{i=4}^{6}
    0.1 \times \exp(-[(-1) \times 0.4236 \times 1])\)

    \(+ \sum_{i=4}^{9} 0.1 \times \exp(-[1 \times 0.4236 \times 1]) + 0.1 \times \exp(-[(-1)
    \times 0.4236 \times (-1)])\)

    \(= 7 \times 0.1 \times \exp(-0.4236) + 3 \times 0.1 \times \exp(0.4236)\)

    其中，\(0.1 \times \exp(-0.4236) = 0.0655\)，\(0.1 \times \exp(0.4236) = 0.1527\)，因此

    \(Z_1 = 7 \times 0.0655 + 3 \times 0.1527 = 0.9165\)'
