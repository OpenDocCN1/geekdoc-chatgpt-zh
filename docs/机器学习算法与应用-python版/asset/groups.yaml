    # ### 知识准备


    PCA 是一种无监督算法，也是一种“降维”方法。它将相互关联的变量数量减少，而不会失去这些变量的本质。它概述了输入和变量之间的线性关系。PCA 还可以作为一种工具来更好地对高维数据进行数据可视化。


    # ### 任务实施


    在应用机器学习技术时，要处理成百上千个变量。大多数变量是相互关联的。在这种情况下，将模型拟合到数据集会导致模型的准确性较差，因此需要消除数据中的冗余信息。此任务将介绍如何使用
    PCA 进行数据的冗余消除、特征提取并将 PCA 应用到图像去噪中。


    # ### 步骤 1 了解 PCA 计算步骤


    主成分分析的主要步骤如下。


    +   (1) 对所有的样本进行中心化：样本的每个特征减去该样本的特征均值。

    +   (2) 计算样本的协方差矩阵。

    +   (3) 对协方差矩阵进行特征值分解。

    +   (4) 取出最大的 n 个特征值对应的特征向量，将所有的特征向量标准化，组成特征向量矩阵。

    +   (5) 用特征向量矩阵乘以样本集中的每一个样本，转化为新的样本，即为降维后的输出样本。


    # ### 步骤 2 了解 PCA 函数的主要参数


    主成分分析函数 classklearn.decomposition.PCA 的主要参数如下。


    +   • n_components：经过 PCA 降维后的目标特征维度数目。

    +   • copy：在运行算法时，根据 copy 的值决定是否将原始数据复制一份。默认为 True，在运行 PCA 降维后，不改变原始数据；否则，在原始数据上直接进行降维处理。

    +   • whiten：表示是否对降维后的数据的每个特征进行标准化。默认为 False，令每个特征的方差都为 1。

    +   • svd_solver：指定奇异值分解（Singular Value Decomposition，SVD）的方法。①当 svd_solver 值为
    ''randomized'' 时，采用一些随机算法加快 SVD 求解，这种方法适合'
  - "[PAGE 33]\n\n处理大数据量、维度多的数据；②当 svd_solver 值为'full' 时，则采用传统意义上的 SVD 进行求解。\n\n#\
    \ 步骤 3 使用 Sklearn 构建 PCA\n\n通过 Sklearn 库中的 PCA 方法进行数据的主要特征提取，主要步骤如下：首先装载输入，接下来引入\
    \ PCA、设置 PCA 的参数，然后提取数据特征，最后是数据还原等。下面通过代码 2-9 来实现数据的主要特征提取。\n\n# 【代码 2-9】\n\n\
    ```\n# 第一步：装载数据\nimport numpy as np\nX=np.array([\n [1,2,1,2],\n [7,2,2,4],\n\
    \ [3,7,3,6],\n [2,5,2,3],\n [3,2,2,9],\n [5,0,3,5]])\n# 第二步：选择 PCA 算法并设置参数\nfrom\
    \ sklearn.decomposition import PCA\npca=PCA(n_components=3)\n# 第三步：进行数据降维\nX_pca=pca.fit_transform(X)\n\
    # 第四步：将降维后的数据进行还原\nX_new=pca.inverse_transform(X_pca)\n# 第五步：输出 PCA 模型系数\nprint(pca.explained_variance_ratio_)\n\
    print(X_new)\n```\n\n输出结果如下。\n\n```\n[[ 0.44274388  0.35663085  0.18459621]\n\
    \ [ 0.95722833  1.97159761  1.22028273  1.9753309 ]\n [ 6.88643498  1.92458751\
    \  2.58488274  3.93449993]\n [ 3.05169086  7.03432515  2.73378166  6.02981336]\n\
    \ [ 2.01310818  5.00870444  1.93249024  3.00756031]\n [ 2.92587872  1.95078  \
    \ 2.38173953  8.95724961]\n [ 5.16565893  0.11000528  2.14682309  5.09554589]]\n\
    ```\n\n代码 2-9 采用 PCA 方法对数据进行降维，并对降维后的数据进行恢复，PCA（n_components=n）函数中的参数 n_components\
    \ 表示降维后的目标维度，一般小于数据的特征数，此案例中的数据特征数为 4，目标维度设置为 3。可以看到恢复后的数据与原始数据比较接近，例如，原始数据为 5，恢复后数据为\
    \ 5.16。"
