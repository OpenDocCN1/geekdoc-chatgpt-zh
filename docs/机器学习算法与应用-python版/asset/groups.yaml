    # # 任务实施


    SVM 算法是一种监督式机器学习算法，它使用分类算法解决两组分类问题。在为每个类别提供一组含有标签的训练数据的 SVM 模型后，它们能够对新文本进行分类。SVM
    算法的目标是创建可以将 n 维空间划分为类的最佳线或决策边界，以便将来可以轻松地将新数据点放入正确的类别中。这个最佳决策边界称为超平面。SVM 算法选择有助于创建超平面的极值点
    / 向量。这些极端情况称为支持向量，因此该算法称为支持向量机。


    SVM 的优缺点如表 8-1 所示。


    | 优点 | 缺点 |

    | :--- | :--- |

    | 在非结构化、结构化和半结构化数据方面非常灵活 | 计算大型数据集时，训练时间更长 |

    | 内核函数减轻了几乎任何数据类型的复杂性 | 超参数在解释其影响时，通常具有挑战性 |

    | 与其他模型相比，过拟合现象较少 | 由于一些黑盒方法，整体解释性低 |


    与神经网络等较流行的算法相比，SVM 算法的主要优势：在样本数量有限（数千个）的情况下，速度更快，性能更佳。


