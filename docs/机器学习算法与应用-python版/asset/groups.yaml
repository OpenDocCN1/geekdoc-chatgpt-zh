    # 走进机器学习的世界


    # 项目导读


    在过去的 10 年里，机器学习技术实现了自动驾驶、实用的语音识别、有效的网络搜索等。机器学习在今天是如此普及，以至于人们可能一天要使用几十次而不自知。


    本项目将从机器学习的应用场景开始，依次给读者介绍生活工作中哪些地方应用了机器学习，这些机器学习算法有哪些分类方式，应用开发涉及的框架和软件库，以及机器学习开发环境如何配置，等等。带读者走进机器学习的大门，为后续项目的学习打下基础。


    # 学习目标


    +   > 了解机器学习的应用场景。

    +   > 掌握机器学习算法的分类方式。

    +   > 了解机器学习常用的软件库。

    +   > 掌握机器学习开发环境配置。


    # 知识导图


    了解机器学习应用场景：人脸识别、天气预测、异常流量检测、智能制造


    机器学习算法的分类方式

    按照学习的过程分类：监督学习、半监督学习、无监督学习、主动学习和强化学习

    按照任务分类：聚类算法、回归算法和分类算法


    软件库与框架：NumPy、Sklearn、Matplotlib、SciPy、TensorFlow、CUDA和cuDNN


    配置机器学习开发环境：安装Anaconda→开启Jupyter Notebook工具→创建Python脚本文件


    了解机器学习步骤：数据收集→数据预处理→选择模型→训练模型→模型评估→实际测试'
