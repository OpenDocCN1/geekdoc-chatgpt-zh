    \n![](img/cba85b47e7b62410be6bbcef421bf9c1_15_1.png)\n\n图 1-4 安装初始界面\n\n图 1-5\
    \ 安装成功界面\n\n### 步骤 2 开启 Jupyter Notebook 工具\n\n安装完成后，在 Windows 系统下的 “开始” 菜单栏中打开\
