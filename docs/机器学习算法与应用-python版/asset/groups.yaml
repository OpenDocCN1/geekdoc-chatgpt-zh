    # 2. K-Means 算法


    K-Means 算法是机器学习中常用的无监督的聚类算法。对于给定的数据集，可以通过算法划分成 K 个不同的簇，且每个簇的中心（质心）可以通过属于该簇所有点坐标的平均或者加权平均计算而成。簇个数
    K 是用户指定的，每一个簇通过其质心来描述。以距离作为数据对象间相似性度量的标准，即数据对象间距离越小，它们的相似性越高，越有可能在同一个簇中。K-Means
    算法通常采用欧式距离来计算数据对象间的距离。


    K-Means 算法在没有监督的情况会从经验中学习，性能可以通过一定的指标衡量。该算法的原理相对简单，可解释性好，收敛速度快，调参也只需要改变簇个数 K 一个参数。初始值的确定对于
    K-Means 算法的结果影响较大，可能每次聚类的结果并不完全一致，也可能只是局部最优而不是全局最优。尤其是在两个簇距离过近时，影响较大。


    # 任务实施


    本任务将介绍 K-Means 的定义算法实现的步骤、质心的计算，并使用 K-Means 算法来实现二维图像聚类。


    # 步骤 1 了解算法步骤


    K-Means 算法的步骤如下。


    +   (1) 适当选择 K 个簇的初始质心。

    +   (2) 在第 k 次迭代中，对任意一个样本，求其到 K 个质心的距离，将该样本归到距离最短的质心所在的簇。

    +   (3) 利用均值等方法更新该类的质心值。

    +   (4) 对于所有的 K 个簇质心，如果利用（2）和（3）的迭代更新后值保持不变，则迭代结束，否则继续迭代。


    # 步骤 2 计算点与质心的距离计算方法


    K-Means 算法是基于质心或基于距离的算法，根据每个点到质心的距离分别计算出属于哪个簇。K-Means 算法的主要目标是计算出各个点到各自质心距离之和的最小值。计算两点之间的距离有很多公式，本项目以欧氏距离计算公式为例，如式（3-1）所示。


    \(d=\sqrt{(x_1-x_2)^2+(y_1-y_2)^2}\) (3-1)'
