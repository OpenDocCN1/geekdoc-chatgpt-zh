    \ 检查数据点的分布，并根据提供给模型的参数将数据点分组。然后为这些组分配一个标签。KNN 模型做出的主要假设是，让彼此靠近的数据点 / 实例高度相似，如果一个数据点远离另一组，则它与另一组的数据点类型不同。\n\
