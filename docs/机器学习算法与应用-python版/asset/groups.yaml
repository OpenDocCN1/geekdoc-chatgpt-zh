    ## 任务 1-5 了解机器学习步骤\n\n### 任务描述\n\n根据所学习到的机器学习知识，了解机器学习算法的实现步骤，以及每个步骤的作用与意义。\n\n\
    ### 任务目标\n\n掌握机器学习算法每个步骤的含义。\n\n### 任务实施\n\n机器学习中的项目开发步骤基本类似，如图 1-10 所示。第一步是收集数据，第二步是对数据进行预处理，第三步是根据数据的特征选择合适的模型，第四步是使用数据对选择的模型进行训练，第五步是对模型评估，第六步是模型的实际测试。\n\
    \n![](img/cba85b47e7b62410be6bbcef421bf9c1_17_0.png)\n\n图 1-10 机器学习的步骤\n\n###\
    \ 步骤 1 数据收集\n\n俗话说“巧妇难为无米之炊”，如果没有数据，那么无论多么优秀的算法都没有意义。机器学习中的数据可以通过传感器（如温湿度传感器、图像传感器、红外传感器）获取，也可以通过网络爬虫进行收集。\n\
    \n### 步骤 2 数据预处理\n\n因为获取的数据会出现多种问题，如数据缺失、度量标准不一致、数据特征冗余较大等，所以在进行机器学习之前，需要进行数据处理，如通过主成分分析来消除数据中的冗余信息。\n\
    \n### 步骤 3 选择模型\n\n数据处理完后，选择可能适用于此数据的模型。有时候可能同时选择多个模型，在模型的选择中，一般通过观察数据的特点，根据经验选择多个可能适合的模型，如温度的预测可以选择神经网络、支持向量回归、线性回归等模型。\n\
    \n### 步骤 4 训练模型\n\n通过所提供的数据来求解模型中的参数，此过程称为模型训练。这个过程可能比较漫长。例如，在深度神经网络中，需要反复不断地迭代来求解网络模型中的参数。当迭代次数达到上限或者损失小于设定的标准时停止迭代，得到训练好的模型。\n\
    \n### 步骤 5 模型评估\n\n模型训练好之后，需要对选择的模型进行评估。评估的方式有主观评价和客观评价，最终通过综合评价来对每个模型进行评价。如果综合评价效果满意，则得到所需要的模型；如果综合评价效果很差，则需要继续选择可能适合的模型进行模型的训练与评估。\n\
    \n### 步骤 6 实际测试\n\n通过前几个步骤项目开发得到了合适的模型，最后将模型部署在实际的应用中进行实际测试。例如，景区对行人流量进行监测，需要使用到行人检测模型，通过前几个步骤已经得到了该模型，现将这个模型部署在行人检测系统中，此系统则可以自动地检测出行人。\n\
    \n## ◆ 项目小结 ◆\n\n本项目通过讲解机器学习的应用场景，让读者了解目前主流的机器学习应用领域；通过讲解机器学习算法分类，让读者了解到机器学习算法，可以通过多种划分方法得到不同类型下的机器学习算法；另外，还介绍了相关的常用软件库，并进一步学习了机器学习的环境搭建。\n\
