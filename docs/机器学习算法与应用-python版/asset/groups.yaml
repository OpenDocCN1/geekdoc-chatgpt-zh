    数据的分类案例中。


    # 步骤 1 计算距离


    KNN 算法使用两点之间的距离来计算相似度。点与点之间的距离越大，它们就越不相似。计算点之间的距离有多种方法，如欧几里得距离、曼哈顿距离和马氏距离等。


    欧几里得距离计算方法如下：


    \( Dis ( X, Y ) = \sqrt{\sum_{i=1}^n ( x_i - y_i )^2} \) (4-1)


    曼哈顿距离计算方法如下：


    \( Dis ( X, Y ) = \sum_{i=1}^n | x_i - y_i | \) (4-2)


    其中，最常见的距离度量是欧几里得距离（直线上两点之间的距离）。


    # 步骤 2 了解 KNN 算法的步骤


    KNN 算法的主要步骤如图 4-2 所示。


    在第一步中， K 值由用户选择，算法在对目标示例所属的组进行判断时，基于给定的 K 值考虑应该有多少个邻居（多少个周围的数据点）。 K 值太小，容易受到噪声干扰，在实际的使用中，
    K 值一般取一个比较小的奇数，如采用交叉验证法来选择最优的 K 值。


    在第二步中，计算目标示例与数据集中每个示例之间的距离。


    在第三步中，将距离添加到列表中并进行排序。


    在第四步中，检查排序列表并返回前 K 个元素的标签。换言之，如果 K 值设置为 5，模型会检查与目标数据点最接近的前 5 个数据点的标签。


    在最后一步中，对于回归任务，使用前 K 个标签的均值；在分类的情况下，则使用前 K 个标签的众数。


    ![](img/cba85b47e7b62410be6bbcef421bf9c1_55_0.png)


    图 4-2 KNN 算法的主要步骤


