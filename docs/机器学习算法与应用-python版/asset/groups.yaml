    # 任务 4-3 使用 KNN 算法实现乳腺癌预测


    **任务描述**

    在 KNN 算法的基础上使用交叉验证方法来解决乳腺癌预测问题。


    **任务目标**

    熟练掌握 KNN 算法交叉验证的基本原理、作用并使用交叉验证方法选择合适的 K 值。


    # 知识准备


    近年来，人工智能技术已成功应用到医疗领域。研究者通过人工智能技术对患者的医疗生理数据进行分析并建立模型，从而判断就诊者是否患病。这个判断过程可以充分利用历史数据，并对其进行分析，推理得到有用的知识，还可以学习到专家的实际经验，为诊断结果提供更可靠的保证。


    医学数据不同于场景的视觉检测数据（如车辆检测），在实际应用中经常没有足够的数据来执行适当的训练任务。在此条件下，最好的办法是为测试集留出一些数据并进行 K
    折交叉验证。KNN 算法交叉验证的步骤如图 4-5 所示。


    在 K 折交叉验证中，选择 K 个不同的数据子集作为验证集，并在剩余数据上训练 K 个模型，之后评估模型的性能并平均它们的结果。'
  - '[PAGE 63]


    ![](img/cba85b47e7b62410be6bbcef421bf9c1_63_0.png)


    图 4-5 KNN 算法交叉验证示意图


    K 折交叉验证保证了模型的分数不依赖于选择训练值和测试集的方式。将数据集划分为 K 个子集，并且保持方法重复 K 次。具体步骤如下。


    +   1. 将整个数据集随机分成 K 个子集 ( 折叠 )。

    +   2. 选择一个子集作为测试集，其余 K-1 个子集为训练集，在训练集上训练后得到一个模型，然后用测试集测试这个模型，保存模型的性能评估指标。

    +   3. 重复第 (2) 步 K-1 次，直到每个子集都用作测试集。

    +   4. 求 K 个评估指标的平均值即交叉验证准确率，并将其作为模型的性能指标。


    因为 K 折交叉验证确保来自原始数据集的每个数据都有机会出现在训练集和测试集中，所以与其他方法相比，这种方法得到的模型通常偏差较小。如果数据量有限，K 折交叉验证是提高模型泛化能力最好的办法之一。


    K 折交叉验证的缺点是训练算法必须从头开始运行 K 次，这意味着评估需要 K 倍的计算量。


