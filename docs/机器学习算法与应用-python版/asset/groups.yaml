    - （5）返回至（1），直至达到退出条件（误差或者迭代次数达到上限）。\n\n权重调整训练是根据误差并通过反向传播完成的，常见的误差计算公式如下：\n\\\
    ( L=\\frac{1}{2}\\sum_{i=1}^n(y_i-\\hat{y}_i) \\)\n\n### 步骤 4 权重调整训练\n\n在此实例中，使用到的网络结构信息如图\
