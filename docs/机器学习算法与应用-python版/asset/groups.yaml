    \ 为因变量；$x$ 为自变量；$a$ 和 $b$ 是模型的参数。\n\n一元线性回归是确定 $y$ 和 $x$ 之间的线性函数，该函数描述两个变量之间的关系。目标变量\
    \ $y$ 和输入变量 $x$ 之间的关系可以通过在图上绘制坐标点并画一条直线来描绘，使坐标点均匀分布在直线两侧，这条直线能描述 $y$ 和 $x$ 之间的线性关系。在训练过程中要调整模型的参数，以获得最佳拟合直线。\n\
    \n#### 2. 成本函数\n\n成本函数用于衡量在给定特定权重值时，假设的 $y$ 值与实际 $y$ 值的接近程度。线性回归的成本函数是均方误差，是指所有不同数据点的预测值和真实值之间的平均（平方）误差，如式（5-2）所示。成本函数用于计算成本，该成本捕获预测目标值与真实目标值之间的差异。如果拟合线远离数据点，则成本会更高。训练的目的是调整模型的权重，直到找到最小误差的参数。\n\
