    \\( f(x)=\\left\\{\\begin{array}{ll} 0.01x, & x<0 \\\\ x, & x\\geqslant 0 \\end{array}\\\
    right. \\)\n\nSigmoid 激活函数的形式如下：\n\\( f(x)=\\frac{1}{1+e^{-x}} \\)\n\n### 步骤 3\
