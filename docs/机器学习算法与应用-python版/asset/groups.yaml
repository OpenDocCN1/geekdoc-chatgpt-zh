    \n- (1) 对所有的样本进行中心化：样本的每个特征减去该样本的特征均值。\n- (2) 计算样本的协方差矩阵。\n- (3) 对协方差矩阵进行特征值分解。\n\
    - (4) 取出最大的 n 个特征值对应的特征向量，将所有的特征向量标准化，组成特征向量矩阵。\n- (5) 用特征向量矩阵乘以样本集中的每一个样本，转化为新的样本，即为降维后的输出样本。\n\
