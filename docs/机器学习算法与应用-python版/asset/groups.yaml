    \n## 步骤 1 认识 ID3 算法\n\nID3 算法中涉及熵的概念。熵是指测量数据中存在的“信息量”，表示离散事件发生的概率。这个数量不仅基于变量中存在的不同值的数量，还基于变量的值所保持的意外估计数量。事件越具有确定性，它所包含的信息就越少。简而言之，信息是不确定性或熵的增加。\n\
    \nID3 算法通过式（7-1）计算每个特征的信息熵（Ent（h）），再根据式（7-2）计算每个特征的信息增益（Gain（H，a）），接下来通过比较每个特征对应的信息增益的大小选择信息增益最大的特征。其中，信息增益可表示为一个由两部分组成的函数，其含义是父数据集和其在特定属性上产生的分割子集之间的熵差异，本质上是熵的加权度量。\n\
    \nEnt (H) = -\\sum_{i=1}^n p\\left(x_i\\right) \\log_2 p\\left(x_i\\right) \\\
    qquad \\text{(7-1)}\n\nGain (H, a) = Ent(H) - \\sum_{i=1}^n \\frac{\\left|H^i\\\
    right|}{|H|} \\text{Ent}\\left(H^i\\right) \\qquad \\text{(7-2)}\n\n其中，式（7-1）中\
    \ H 表示样本集合；\\( p\\left(x_i\\right) \\) 表示输出 \\(x_i\\) 值的概率。式（7-2）中 a 表示属性；H 表示样本集合；\\\
    (H^i\\) 表示按照属性 \\(a\\) 数据集 H 的第 \\(i\\) 个划分。\n"
