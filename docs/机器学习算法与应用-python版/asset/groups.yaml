    # 步骤 2 使用支持向量机算法求解最大几何间隔


    在之前的内容中已经了解到支持向量机能够绘制出一个最优的决策边界（超平面），假设 \(w^Tx+b=0\)，在超平面上方的数据定义为 \(w^Tx+b=1\)，在超平面下方的数据定义为
    \(w^Tx+b=-1\)。几何间隔计算方法如下：


    \(\gamma = \frac{y(w^Tx+b)}{\|w\|_2}\)


    式中，\(w\) 表示分类间隔，间隔越大说明分类效果越好；\(\|w\|\) 表示所有元素的平方和；\(b\) 为偏置变量。


    当求解 \(w\) 的最大值时，还需要设置合适的约束条件。


    \(\max\gamma = \frac{y(w^Tx+b)}{\|w\|_2} \quad s.t \quad y_i(w^Tx_i+b) \geqslant
    1 \quad (i=1, 2, \cdots, m)\)


    其中，约束条件为 \(y_i(w^Tx_i+b) \geqslant 1 (i=1, 2, \cdots, m)\)，可以根据凸优化理论中的拉格朗日函数来求解
    \(\gamma\)。


