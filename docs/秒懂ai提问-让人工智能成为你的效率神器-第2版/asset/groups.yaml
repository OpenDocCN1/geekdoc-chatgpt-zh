    ## 第五部分


    ## 融会贯通：灵活组合，搞定复杂问题


    在面对复杂问题时，只使用一种提问方法往往难以获得理想的结果。此时可以将复杂任务拆解为多个子问题，根据子问题的特点，组合使用不同的提问方法，引导AI逐步解决。这不仅能有助于降低问题复杂度，还能显著提高AI输出内容的准确性，帮助我们更快获得理想的结果。


    例如，对于需要创新思维的问题，可以采用发散提问结合引导提问；对于需要详细分析的问题，则可以采用指令式提问结合示例式提问。


    假设你需要为一篇关于未来科技的论文撰写引言，但无从下手。此时，你可以采用以下步骤操作。


    ### 问题类型分析


    这是一个创意与写作结合的问题，既需要产生新颖的观点，又需要将其融入文章中。


    ### 问题拆解


    要完成这项任务可以分3步：创意收集、观点表达、结构规划，依次可以使用的提问方法如下。


    创意收集：使用发散提问，如“未来科技可能带来哪些颠覆性变化？”


    观点表达：使用引导提问，如“在这些变化中，哪一个最有可能影响人类生活？为什么？”


    结构规划：结合指令式提问，如“如何将这些观点组织成一篇引人入胜的引言？”


    ### 提问策略组合


    先通过发散提问获取大量创意点，再通过引导提问筛选出最有价值的观点，并深入讨论其意义，最后使用指令式提问指导具体的写作过程。


    ### 1. 项目沟通：指令式提问+归纳提问


    当我们需要借助AI来明确目标、总结关键信息时，可以使用指令式提问来明确任务的目标和范围，使用归纳提问来提炼核心要点。这种组合方式能够快速明确方向，便于执行且过程可控。


    ### 案例背景


    你是一家科技公司的项目经理，负责一个跨部门的AI项目。虽然已制定了清晰的项目目标和关键成果（OKR），但由于团队成员来自不同部门，沟通风格与处理方式存在差异，团队成员对任务的理解不一致，执行效率不高。你希望借助AI来梳理项目沟通中的关键要素，帮助团队成员就目标达成共识。


    ### 组合提问


    指令式提问（明确目标和范围）→ 归纳提问（总结关键信息）


    ### 提问示例 ?


    （指令式提问）请整理一份适用于跨部门协作项目的沟通清单，确保各部门对目标、职责和时间节点有统一理解。 ?


    （仅展示部分内容）


    沟通清单包括：


    - 1. 项目目标说明（明确成果指标与时间表）


    - 2. 各部门职责划分与交付物清单


    - 3. 定期同步机制（如每周例会、日报机制）


    - 4. 冲突解决流程


    - 5. 项目变更沟通规则 ?


    （归纳提问）请基于上述清单，总结出五项关键的沟通要点，以提升跨部门协作的效率。 ?


    - 1. 职责清晰：明确各部门的任务边界和交付内容，避免重复与遗漏，并形成文档化确认机制，供后续追踪使用。


    - 2. 目标统一：确保所有成员对最终成果与成功标准的理解一致，并通过项目启动会进行集体确认，防止理解偏差。


    - 3. 机制明确：建立固定的沟通与反馈机制，如每周例会和看板更新，确保信息畅通和问题及时响应。


    - 4. 流程规范：制定标准化的任务提交流程与审批节点，减少沟通摩擦，提高协作效率。


    - 5. 风险预警：引入预警机制，如延迟自动提醒、风险登记等，帮助各部门及早识别和应对潜在的协作问题。


    ### 2. 产品研发：角色扮演式提问+引导提问+多项选择提问


    当我们需要AI提供专业建议、激发创造力并协助我们做出决策时，可以使用角色扮演式提问来为AI赋予某方面专家的身份，使用引导提问来激发创造力，使用多项选择提问来快速决策。这种组合方式能够引导AI给出专业且可靠的建议，决策高效准确。


    ### 案例背景


    你是一家教育机构的课程研发经理，需要开发一门新的在线课程。你希望通过AI来获取市场洞察，确定课程主题和形式。


    ### 组合提问


    角色扮演式提问（赋予AI专家身份） → 引导提问（激发AI创造力） → 多项选择提问（快速决策）


    ### 提问示例 ❓


    （角色扮演式提问）假设你是一位在线教育领域的专家，请分析当前市场上热门在线课程的主题和形式。 🤖


    （仅展示部分内容）当前市场上热门在线课程主题包括编程、外语学习、职业技能提升等；形式多为录播视频课程结合互动社区。 ❓


    （引导提问）现在让我们思考一下，你认为一家专门服务职场人士的在线教育公司，应该开发一门什么主题的在线课程？为什么这个主题会受欢迎？请详细阐述。 🤖


    如果是一家专门服务职场人士的在线教育公司，我建议开发一门关于“数字化办公技能提升”的在线课程。以下是我的详细分析。


