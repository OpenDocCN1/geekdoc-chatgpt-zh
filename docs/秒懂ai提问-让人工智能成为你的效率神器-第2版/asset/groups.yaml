    # 12. 约束提问：精准获取所需内容


    当所需内容的模板、框架、风格已经明确时，我们可以采用约束提问的方式，命令AI在特定的限制条件下生成内容。


    例如，我们可以让AI参照一个固定的模板来撰写一段自我介绍，确保内容包含所有必要的信息并以特定的格式呈现；或者，我们可以要求AI按照给定的框架来编写一份工作报告，使其结构清晰、条理分明；我们还可以指定一个特定的句式，让AI依照这个句式来造一个句子，以满足特定的语言需求；此外，当需要将一段文案改写成特定的风格时，我们也可以让AI按照这种风格重新表述文案内容。


    约束提问就是让AI在给定的框架中，严格依据给定的模板以及特定的风格有限制地作答，从而满足提问者对特定内容的需求。


    约束提问具备以下特征。 ✔


    # 明确目的


    明确想要AI完成的任务或目标。这有助于我们设定更精确的约束条件。 ✔


    # 明确约束条件


    明确模板、框架、风格等必要的约束条件。


    例如，我们可以提供一个模板或框架，让AI按照它来生成内容。这可以是一个报告的大纲、一个故事的情节框架，或者是一个特定格式的文档。我们可以这样提问：“请你按照[具体模板]的格式，为我生成[具体任务内容]。”


    再比如，让AI依照特定句式造句，我们可以这样提问：“请用[特定句式结构]的句式造一个句子，其中[关键元素描述]要满足[具体条件]。”具体提问案例：“请用‘如果……那么……’的句式造一个句子，其中关键元素‘如果’后面的假设情况要具有一定的现实可能性，‘那么’后面的结果要符合推理逻辑。”


    我们还可以指定AI回答的风格和语调，比如正式、幽默、严肃、轻松等。 ✔


    # 提供示例


    我们可以给出一些示例来帮助AI更好地理解要求。'
