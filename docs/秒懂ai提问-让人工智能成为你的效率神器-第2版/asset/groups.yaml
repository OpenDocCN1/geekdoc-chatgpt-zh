    # # 13. 对立提问：抵御攻击和偏见


    请试着代入一下这个场景：团队正在讨论下一季度的推广计划，你的一名下属非常自信地展示着自己的方案，却忽略了很多可能存在的风险与漏洞。如果你想通过提问引导他做出更加客观、全面的分析，你会怎么问？


    **提问一：小李，你的方案确定可行吗？**


    听你这么问，小李可能会猜测你对他没信心，可能不但不会反思，反而更加卖力地展现自己方案的优点与亮点，甚至会夸大事实或胡编乱造。


    ![](img/6ede4ab2740469ed554b750456843d7c_89_0.png)


    **提问二：小李，你认为竞争对手会如何应对这份方案？你有没有想过他们可能会采取什么措施来阻止我们实施这份方案？**'
  - '[PAGE 90]


    如果这么问，可以激发小李对方案中的潜在风险和漏洞进行思考，提高其思考水平和解决问题的能力，从而帮助对方制订出更加全面和可行的推广计划。


    ![](img/6ede4ab2740469ed554b750456843d7c_90_0.png)


    很显然，在这个场景里，提问二可以有效地帮助对方学会从不同的角度看待问题，避免陷入单一的思考模式或观点，从而更全面地理解问题，做出更明智的选择。


    其实在这个场景里，你可以将小李看作AI，而你作为提问者，运用对立提问，就能够获得想要的答案。


    **对立提问**是一种通过引入不同观点的信息来激发AI思考的提问方法。这种方法强调挑战、质疑，促使AI从新的角度看待问题，尽可能地避免产生偏见。


    以下是对立提问的六大模式。


    +   ①反面思考模式。例如，如果这个想法/计划/决策失败了，会有哪些负面影响？'
  - "[PAGE 91]\n\n+   ②反向思考模式。例如，如果目标完全相反，你会采取什么行动？有哪些不同的考虑因素？\n+   \n+   ③对比思考模式。例如，与其他类似的方案相比，这个计划有哪些优/劣势？\n\
    +   \n+   ④反转思考模式。例如，如果站在对方的立场上，你会有哪些不同的看法？\n+   \n+   ⑤对立观点模式。例如，如果有人持相反观点，会有哪些论据支持他们的观点？\n\
    +   \n+   ⑥反问模式。例如，如果你的决策是错的，那么正确的做法是什么？\n\n来看几个不同场景下对立提问的使用案例。\n\n# 例：自动驾驶隐患剖析\n\
    \n+   Before 常规提问\n+   \n+   自动驾驶技术能消除所有交通事故吗？\n+   \n+   After 对立提问\n+   \n+\
