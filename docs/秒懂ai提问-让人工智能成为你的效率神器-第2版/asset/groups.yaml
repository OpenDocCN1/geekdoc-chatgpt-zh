    # 16. 复合型提问：多维度获取信息


    某杂志刊登了一篇关于某个科技公司发布最新产品的报道，你需要向一位看过这篇报道的同事打听产品的相关信息。应该如何提问呢？


    **提问一：这篇报道提到了什么最新产品？**


    如果这么问，你能获取的信息非常有限。


    **提问二：这篇报道提到了哪个科技公司的最新产品？产品的名称是什么？（基本信息维度）**


    新产品具备哪些独特的功能或技术特点？（技术细节维度）


    这个新产品预计会对市场产生怎样的影响？是否有竞争对手？（市场影响维度）


    报道中是否提到了用户对新产品的反馈或评价？（用户体验维度）


    提问二能确保你全面了解那篇报道的信息。相比之下，提问一为单一问题，无法涵盖更多维度的信息。


    在这个场景里，提问二使用了复合型提问，提问者从多维度入手，提出更具体的问题，从而获得更全面和更准确的答案。


    复合型提问是提问者通过一系列相互关联且层次递进的问题，引导AI从多个维度深入探究某一主题或事件，以获取全面、详细且深入的回答的提问方式。


    好的复合型提问通常由一系列精心构建的问题组成，它们之间逻辑清晰、相互支持，能够引导AI系统地回答，从而提供全面而深入的见解。


    那么，如何进行复合型提问呢？以下是一些具体的技巧。 ☑


    # 确定主题或事件


    首先明确你想要探究的主题或事件，作为提问的出发点。例如，你想要了解新能源汽车的市场趋势。 ☑


    # 构建问题链'
