    # 8. 摘要提问：快速压缩长篇信息


    有时我们需要阅读新闻报道、学术论文等资料，并快速理解核心信息。


    有时领导发来大段工作任务和要求，自己却抓不住重点。


    有时我们需要快速掌握一部小说的关键剧情。


    ..........


    在这些情况下，我们可以使用摘要提问，让AI从复杂的文本中提取出核心观点、关键事实或重要结论，从而让我们无须逐字逐句浏览文本就能快速了解文本内容，大大节省时间，提高信息获取的效率。


    摘要提问是一种让AI阅读长文本内容后，提供简短摘要的提问方法。


    好的摘要提问通常具备明确性、针对性和结构性等特征，能够引导AI准确生成摘要内容，达到高效获取关键信息的效果。


    进行摘要提问时，遵循以下原则，可以更加高效地获取想要的信息。


    # 明确提问目的


    明确你想要通过摘要提问达到什么目的，比如“我想要快速了解这篇文章的内容”或是“请帮我从这段话中提取××信息”。明确目的的有助于你更精准地提问。


    # 清晰地描述原文内容


    在提问时，尽可能清晰地描述你想要AI摘要的原文内容。如果原文篇幅不长，可以直接把原文发送给AI；如果原文很长，可以指出关键信息，比如“某本书的某个章节”或者“某人在某日于某地发表的演讲”，若能同时给AI提供相应的DOCX/PDF/TXT格式的原文，将有助于AI更准确地理解并生成摘要。


    # 指明篇幅和详略程度


    明确你对摘要的篇幅和详略程度的要求，如“请生成一个不超过200字的简短摘要”，或是“请分点提取核心内容”。


    # 使用结构化提问'
  - '[PAGE 58]


    结构化提问有助于AI更好地理解你的需求，比如：“请根据[明确指出需要总结的内容]，总结出[长度要求，如200字]的[所需内容，如主要观点]。”


