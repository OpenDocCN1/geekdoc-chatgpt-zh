    ## 5. 预测分析：对立提问+预言式提问+循环提问


    当我们需要AI深入分析风险、从失败角度思考并不断优化答案时，可以使用对立提问来激发对立思考，使用预言式提问来从失败角度思考，使用循环提问来不断优化答案。这种组合方式能够确保风险分析全面深入，方案得到不断完善。


    ### 案例背景


    你是一家科技公司的产品经理，正在负责一款智能家居产品的开发工作。为了确保产品成功上市并满足市场需求，你可以运用对立提问+预言式提问+循环提问的组合方法进行分析与决策。


    ### 组合提问


    对立提问（激发对立思考） → 预言式提问（从失败角度思考） → 循环提问（不断优化答案）


    ### 提问示例


    （对立提问）如果这款智能家居产品过于注重高端功能，可能会增加成本，提高售价，从而影响其市场竞争力；但如果功能过于基础，又可能无法满足追求高品质生活的用户需求。我们如何找到功能与成本的平衡点？


    （仅展示部分内容）为了找到功能与成本的平衡点，我们可以先对市场进行细分，明确目标用户群体。对于追求高端生活品质的用户，我们可以提供定制化的高端功能选项，如智能语音控制、环境自适应调节等，并设定相应的高端价格。同时，对于更广泛的普通用户群体，我们可以提供只具备基础功能的智能家居产品，保持较低的成本和售价。此外，我们还可以考虑通过模块化设计，让用户根据自己的需求选择不同的功能模块，从而实现个性化定制与成本控制的双重目标。


    （预言式提问）如果这款产品上市后遭遇用户差评，可能是因为哪些因素导致的？我们如何提前预见并规避这些风险？


    （仅展示部分内容）可能的因素有：用户体验不佳、功能设计不合理或售后服务不到位等。为了预见并规避用户反馈不佳的风险，我们可以在产品开发过程中引入用户测试与反馈机制。通过邀请目标用户群体参与产品测试，收集他们的使用反馈和意见，及时发现并改进产品中存在的问题。此外，我们还可以对竞争对手的产品进行深入研究和分析，了解他们的优缺点和用户反馈，从而避免重复犯错。在售后服务方面，我们可以建立完善的客户服务体系，提供快速响应和高效解决问题的服务，增强用户的满意度和忠诚度。


    （循环提问）如何根据用户调研与市场需求，优化产品的功能设计与用户体验？


    （AI第一轮回答）根据用户调研与市场需求，我们可以对产品的功能设计和用户体验进行如下优化：增加界面设计的友好度，提高产品的易用性和可操作性；引入智能化的交互方式，如语音控制、手势识别等，提升用户体验；加强产品的安全性能，确保用户数据的安全和隐私保护。


    （循环提问，基于第一轮回答）在上述优化方案的基础上，提供一个更好的方案，进一步提升产品的智能化水平。


    （AI第二轮回答）为了进一步提升产品的智能化水平，我们可以考虑引入更先进的AI算法和传感器技术。例如，通过引入深度学习算法，实现更精准的用户行为预测和个性化推荐；通过引入更灵敏的传感器技术，实现更精准的环境感知和自适应调节……


    在完成多轮循环提问后，AI可能出现回答逻辑混乱、偏题或自相矛盾的问题。这时，运用如下几个技巧，可以引导AI始终围绕核心问题给出一致且连贯的回答。


    ### 技巧一：重新归纳对话重点。


    > “请你根据上面我们讨论的内容，总结目前产品优化的三点核心建议，我们再从这里出发继续优化。”


    这样做可以让AI回顾对话内容并清晰聚焦，防止“越聊越散”。


    ### 技巧二：重新定义角色与任务边界。


    > “假设你现在是一位产品优化顾问，我们将重新开始优化智能家居的交互体验。请忽略之前的内容，从头开始规划一份更系统的方案。”


    用“忽略之前内容”可以帮助AI清空临时记忆，减少干扰。


    ### 技巧三：进行阶段性总结，作为对话锚点。


    > “请总结一下我们目前优化思路的结构框架，按功能优化、用户体验优化、安全性优化三类分别列出。”


    这样做可以为后续继续提问提供清晰的上下文支撑，AI更容易“接得住”。


    ## 6. 内容创作与优化：关键词提问+角色扮演式提问+信息整合提问


    当我们需要AI辅助完成深度内容写作时，可以使用关键词提问来聚焦核心信息，使用角色扮演式提问来获取专业视角，使用信息整合提问来统筹素材，这种组合提问方式能够提升回答内容的专业度与完整度。


    ### 案例背景


    你是一位内容创作者，需要撰写一篇关于人工智能在医疗领域应用的深度文章，并希望文章既专业又引人入胜。


    ### 组合提问


    关键词提问（聚焦核心内容）→ 角色扮演式提问（获取专业视角）→ 信息整合提问（内容结构化）


    ### 提问示例 ?


    （关键词提问）请列出人工智能在医疗领域应用的5个方向，并为每个方向提供一两个具体的应用案例。


    （仅展示部分内容）人工智能在医疗领域应用的5个方向包括疾病诊断、个性化治疗、药物研发、患者管理和医疗服务优化。例如，在疾病诊断方面，AI可以通过分析医学影像来辅助医生发现早期癌症迹象；在个性化治疗方面，AI可以根据患者的基因信息制定更加精准的治疗方案……


    （角色扮演式提问）假设你是一位医疗领域的专家，请从专业的角度阐述为什么人工智能在医疗领域的应用如此重要，并给出对未来发展趋势的预测。


    （仅展示部分内容）作为医疗领域的专家，我认为人工智能在医疗领域的应用之所以重要，是因为它能够提高诊断的准确性、加速药物研发进程、优化患者管理并提高医疗服务效率。未来，随着技术的不断进步，AI有望在预防医学、远程医疗和智能医疗设备等方面发挥更大的作用……


    （信息整合提问）（提供内容）请整合上述信息，编写一篇结构清晰、逻辑严密的文章大纲，并简要描述每个部分的内容。


    文章大纲如下。


    - 引言：简述人工智能在医疗领域的应用背景和意义。

    - 第一部分：人工智能在疾病诊断中的应用，包括影像识别和辅助诊断系统。

    - 第二部分：个性化治疗与人工智能，介绍基于基因信息的精准医疗。

    - 第三部分：人工智能在药物研发中的角色，如加速新药发现和临床试验。

    - 第四部分：患者管理与人工智能，如远程监控和智能预警系统。

    - 第五部分：医疗服务优化与人工智能，如智能排班和资源配置。

    - 结论：总结人工智能在医疗领域的应用现状和未来展望。


    ## 7. 创新策略设计：发散提问+引导提问+关键词提问


    当我们希望AI帮助我们提出创新方案时，可以先使用发散提问激发思维，然后使用引导提问筛选可行的创意，最后使用关键词提问进一步细化落地方案。这种组合提问方式可以快速让灵感创意从“想法”走向“执行”。


    ### 案例背景


    你是一家科技公司的产品经理，需要为下一代智能穿戴设备设计一种创新的功能。


    ### 组合提问


    发散提问（激发创意）→ 引导提问（筛选亮点）→ 关键词提问（细化落地）


    ### 提问示例 ❓


    (发散提问) 智能穿戴设备可以有哪些前所未有的创新功能？ ⓐ


    （仅展示部分内容）智能穿戴设备可以集成健康监测、环境感知、紧急求救、运动辅助等多种功能。例如，集成生物识别技术实现无感支付，或者利用AR技术提供实时导航和翻译服务。
    ❓


    (引导提问) 在这些创新功能中，哪一种最有可能成为产品的差异化卖点，并吸引目标用户群体？ ⓐ


    （仅展示部分内容）集成AR技术的实时导航和翻译服务可能是一个独特的卖点，因为它不仅满足了日常健康监测和运动辅助的需求，还提供了前所未有的便捷体验，特别适合经常出国旅行或学习新语言的年轻用户。
    ❓


    (关键词提问) 围绕“AR导航翻译智能穿戴设备”，请详细列出可能的功能模块、技术要求和用户体验优化点。 ⓐ


    （仅展示部分内容）功能模块包括AR显示屏、高精度GPS模块、多语言翻译引擎、生物传感器等；技术要求包括低功耗处理芯片、高效散热系统、精准的环境光感应等；用户体验优化点可以包括一键启动翻译功能、语音交互控制、个性化的导航路线规划等。


    ## 8. 复杂项目管理：指令式提问+信息整合提问+循环提问


    在复杂项目管理中，我们可以使用指令式提问明确任务框架，使用信息整合提问规划阶段安排，再通过循环提问不断完善关键环节。这种组合提问方式有助于构建可执行、可追踪的项目路径。


    ### 案例背景


    你是一位项目经理，负责一个跨部门的大型软件开发项目，需要确保项目按时、按质完成。


    ### 组合提问


    指令式提问（制订计划）→ 信息整合提问（阶段统筹）→ 循环提问（持续优化）


    ### 提问示例


    （指令式提问）请为我制订一个详细的大型软件开发项目管理计划，包括任务分配、时间表和里程碑。


    （仅展示部分内容）以下是一个详细的大型软件开发项目管理计划示例，你可以根据实际情况进行调整和修改。


    ### 一、项目概述


    [项目名称]是一个跨部门的大型软件开发项目，旨在开发一套[具体功能描述]的软件系统，以满足[目标用户群体]在[业务场景]中的需求。项目团队由来自不同部门的成员组成，包括开发人员、测试人员、业务分析师、UI/UX设计师等。项目预计总时长为[X]个月，计划于[开始日期]启动，[结束日期]完成。


    ### 二、项目目标


    - 按时交付：确保项目在预定的[X]个月内完成，按时交付软件产品。

    - 质量达标：软件系统满足需求规格说明书中的所有功能和性能要求，通过内部测试和用户验收测试，缺陷率低于[X]%。

    - 成本控制：项目总成本控制在预算范围内，不超过[X]元。

    - 用户满意度：用户对软件系统的满意度达到[X]%以上，能够有效提升工作效率并满足业务需求。


    ### 三、项目组织架构与职责


    - （一）项目管理团队……

    - （二）开发团队……

    - （三）测试团队……

    - （四）业务分析师团队……

    - （五）UI/UX设计团队……


    ### 四、项目阶段


    项目阶段分为：项目启动阶段、需求分析阶段、系统设计阶段、界面设计阶段、编码开发阶段、测试阶段、部署上线阶段、收尾阶段…… 🤔


    （信息整合提问）请按照项目启动阶段、需求分析阶段、系统设计阶段划分出项目任务时间表。 🅰️


    （仅展示部分内容）


    项目阶段划分为


    ### 项目启动阶段（第1周）


    成立项目团队，明确各成员职责。


    召开项目启动会议，介绍项目背景、目标、范围和计划，统一团队成员的思想和行动……


    ### 需求分析阶段（第2~4周）


    业务分析师与用户进行深入沟通，收集详细业务需求，包括功能需求、性能需求、安全需求……


    ### 系统设计阶段（第5~8周）


    根据需求规格说明书，进行系统架构设计，确定系统的整体架构和技术选型……


    （循环提问）在系统设计阶段，架构设计不合理可能会影响设计的质量、进度以及后续的开发和实施。请提供一个规避方案。


    ### 第一轮AI回答（部分）


    - 1. 深入需求分析：全面理解业务需求和非功能需求，确保架构设计的基础准确无误。

    - 2. 充分技术调研：评估技术选型的成熟度、稳定性及与团队能力的匹配度，选择合适的技术栈。

    - 3. 组建专业团队：由经验丰富的架构师、技术专家、开发人员和业务分析师组成团队，明确职责分工。

    - 4. 遵循设计原则：采用分层架构、模块化设计、服务化架构等原则，确保架构的可扩展性、性能和安全性。

    - 5. 严格设计评审：通过内部和外部专家评审，发现并优化架构设计中的潜在问题。

    - 6. 持续优化调整：根据反馈和评估结果，持续优化架构设计，确保其适应性与合理性。


    （循环提问）请进一步细化解决方案，增加风险管理和用户反馈机制。


    ### 第二轮AI回答（部分）


    以下是增加的部分。


    - 1. 风险识别：在架构设计阶段，识别可能的技术风险、性能风险、安全风险等。

    - 2. 风险评估：对识别的风险进行评估，确定其发生的可能性和影响程度。

    - 3. 风险应对：制定相应的风险应对措施，如技术备份方案、性能优化策略、安全加固措施等。

    - 4. 早期用户测试：在架构设计阶段，邀请部分用户参与早期测试，收集用户对系统架构的反馈。

    - 5. 反馈闭环：建立用户反馈的处理机制，及时将用户反馈纳入架构设计的优化中。


    ## 9. 市场调研与竞争分析：复合型提问+对立提问+迁移提问


    当我们需要深入理解市场格局并制定策略时，可以使用复合型提问把握全貌，使用对立提问检验策略的稳健性，使用迁移提问跨领域借鉴经验。这种组合提问方式能帮助我们快速建立更具适应性的市场方案。


    ### 案例背景


    你是一家企业的市场分析师，需要进行市场调研和竞争分析，以制定市场进入策略。


    ### 组合提问


    复合式提问（全面了解）→ 对立提问（竞争应对）→ 迁移提问（借鉴经验）


    ### 提问示例


    （复合型提问）请分析智能家居市场的规模、增长率、消费者画像、主要竞争对手及其市场份额，以及潜在的市场机会和挑战。


    （仅展示部分内容）


    ### 一、市场规模


    据市场研究机构数据，全球智能家居市场规模已达到约1500亿美元，预计到2028年将达到3500亿美元左右，复合年增长率（CAGR）约为18%。


    在我国，智能家居市场也在迅速扩张，2023年市场规模约为5000亿元人民币，预计到2028年将突破1.5万亿元人民币，复合年增长率超过20%。


    ### 二、消费者画像


    - 1. 年轻消费者（25~40岁）


    这部分人群是智能家居市场的主要消费群体。他们对新技术接受度高，追求个性化、便捷化的生活方式，愿意为提升生活品质的产品支付较高的价格。


    - 2. 中年消费者（40~60岁）


    随着智能家居产品的功能不断完善和价格逐渐合理化，越来越多的中年消费者也开始关注和使用智能家居产品，尤其是对安全、健康、节能等功能有较高的需求。


    ### 三、收入水平


    - 1. 中高收入群体


    智能家居产品价格相对较高，因此中高收入群体是主要的消费群体。他们对生活品质有较高要求，愿意为智能家居产品带来的便利和舒适支付额外费用。


