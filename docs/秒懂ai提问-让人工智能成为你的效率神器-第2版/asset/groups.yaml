    # 17. 批判提问：帮用户识别潜在风险


    设想这样一个场景：你的公司正在考虑引入一款新的智能营销软件。软件供应商声称：“我们的系统可以在两个月内将你们的客户转化率提高50%。”


    如果你直接接受这个承诺，可能会忽略潜在的风险和不确定性。


    但如果你这样问：“你们的系统是如何实现客户转化率提高50%的？有没有成功案例？如果达不到这个目标，主要的风险点是什么？”


    那么，讨论就从单纯的愿景变成了对方案可行性的审视，避免盲目乐观。


    批判提问就是在面对信息或决策时，通过深入挖掘逻辑漏洞、数据和可能的风险，帮助用户做出理性的判断的提问方式。


    批判提问不仅能帮助我们分析商业决策，还能防止AI输出错误或片面的信息，确保获得高质量的答案。


    使用批判提问的技巧包括以下几个。


    # 追问数据来源（确保信息可靠性）


    面对数据或者结论时，可以这样问：


    > “这个数据的来源是什么？”


    > “这些结论基于哪些研究或案例？”


    > “有没有相反的研究结果？”


    # 假设极端情况（发现潜在风险）


    如果一个决策听起来完美无缺，可以通过极端情况来测试它的可行性。例如：


    > “如果市场突然变化，这个方案还能成功吗？”


    > “如果预算减少50%，这个项目还能正常推进吗？”


    > “如果用户数量增长过快，系统能否承受负载？”'
  - '[PAGE 122]


    # 反向验证（挑战假设的合理性）


    有些说法看似正确，但是否真的成立？可以进行反向验证。例如：


    > “有没有案例显示，采用相反策略也能成功？”


    > “如果这个方案真的有效，为什么竞争对手还没有采用？”


    # 识别遗漏信息（找出未被讨论的关键点）


    有些情况下，决策时只考虑了显而易见的方面，而忽略了隐性方面。例如：


    > “除了刚才我们讨论的短期影响，这个方案带来的长期的影响有哪些？”


    > “除了直接成本，还有哪些隐性成本？”


    # 比较多个选项（避免单一视角）


    当AI或对方给出一个解决方案时，可以用对比的方式寻找更优选项。


    > “有没有其他方法可以达到相同目标？”


    > “不同策略的风险和收益分别是什么？”


