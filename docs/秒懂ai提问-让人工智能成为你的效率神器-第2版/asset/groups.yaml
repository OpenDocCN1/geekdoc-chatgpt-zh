    ## 逆向思维（借鉴看似无关的行业知识）


    有些行业之间虽然看似不相关，但可能提供意想不到的灵感。例如：


    > “太空探索如何优化燃料利用？该方法能否应用于新能源汽车的续航能力优化？”


    > “古代战争中如何进行兵力调度？该方法能否应用于现代供应链管理？”


    > “电影叙事结构如何吸引观众？能否用类似手法优化品牌营销？”


    ## 从自然界获取灵感（仿生学思维）


    自然界已经进化出许多高效的生存策略，我们可以考虑将其运用于人工设计中。例如：


    > “能否借鉴鱼群协同游动的原理，优化无人机编队的控制系统？”


    > “植物如何调节水分？能否用相同原理设计更节能的建筑？”


    > “蜘蛛网的结构为何如此坚固？其结构能否应用到建筑工程中？”


    来看两个不同场景下迁移提问的使用案例。


    ### 例：电商优化


    常规提问


    如何减少电商用户流失？


    迁移提问


    医生如何提高患者的治疗依从性？能否借鉴这些方法来提升电商用户留存率？


    ### 例：AI训练


    ### 常规提问


    如何优化AI的自学习能力？


    ### 迁移提问


    人类如何学习新知识？能否借鉴大脑神经元连接原理，优化AI模型？


    ## 应用案例


    - 一、商业创新：发现全新商业模式


    航空公司如何降低成本？该方法能否应用于共享经济平台降低成本？


    航空公司降低成本的关键策略与共享经济平台的借鉴路径


