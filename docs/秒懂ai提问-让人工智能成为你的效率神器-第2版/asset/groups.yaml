    ## 14. 循环提问：让AI自动升级


    在雕刻一件艺术品时，雕刻师不会一刀完成所有的细节，而是一刀一刀地精细打磨，将石块逐渐变成艺术品。


    面对一块未经雕琢的石头，首先进行粗略的雕刻，去除多余的部分，让雕像的大致轮廓显现出来。但这时有些地方还不够完美，需要进一步修饰。于是雕刻师拿起更精细的工具，开始在上一次雕刻的基础上进行精雕细琢。每一次的雕刻都是对前一次作品的改进和提升，雕刻师不断地观察、思考、调整，直到雕像的每一个细节都符合其审美标准。


    在雕刻艺术品时，每一次雕刻都是在前一次的基础上进行的，使得作品更加完善、更加精美。同样，使用AI进行循环提问的过程，像是在一次次地“打磨”答案，让答案变得更加贴合用户的需求和标准。


    循环提问是一种通过反馈结果，不断优化问题并改进AI的答案的提问方式。其核心是通过不断地修改和细化问题，从而得到更准确、更满意的答案。这个过程涉及对AI的初步回答进行评估，并根据不足之处或新的需求对问题进行调整。通过这一过程，逐步提高问题的精确性和复杂度，从而获得更优的解决方案。


    循环提问的步骤如下。


    - ① 向AI提问，要求AI给出一个答案。


    - ② 观察结果。


    - ③ 再次对AI提问：“接下来请你给出一个更好的方案，并且解释新方案为什么更好。”


    - ④ 重复第2步和第3步，直到得到满意的结果或无法继续改进为止。


    通过循环提问，用户能够引导AI给出更精确、实用的答案，满足自身的需求。


