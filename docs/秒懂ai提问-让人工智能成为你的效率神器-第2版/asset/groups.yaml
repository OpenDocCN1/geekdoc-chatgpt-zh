    让AI引导你思考，而不是让它直接给你参考答案，你可以进一步了解自己，做出更适合自己的职业或者人生规划。


    与上述案例所使用的提问方法效果类似的方式叫作苏格拉底式提问，又称苏格拉底式教学法，是古希腊哲学家苏格拉底的极具代表性的提问方法，即通过一系列有针对性的问题引导对话者进行深入思考，以发现知识、挖掘观点和促进理解。苏格拉底式提问强调质疑、怀疑和反思，追求真实和理性。


    苏格拉底式提问的主要特点如下。


    # 引导性


    通过提问引导对话者思考问题而非直接告诉他们答案。


    # 层层递进


    问题由浅入深，逐步引导对话者深入探讨话题。


    # 提倡反思


    鼓励对话者对自己的观点和假设进行反思。


    # 逻辑性强


    关注论证的一致性和合理性，追求真实的和有根据的知识。


    常见的6种苏格拉底式提问如下表所示。'
