    # 3. 指令式提问：确保得到更精准的答案


    想要驾驭AI，就要掌握与AI对话的技巧。从某种角度来看，和AI对话，就像给下属布置任务一样。同样的任务，同样的下属，会布置任务的领导总是更容易带领下属完成任务。


    来看这样一个案例。领导需要制定一个宣传方案，下达了如下任务。假如你是下属，你更可能完成哪个领导布置的任务？


    ![](img/6ede4ab2740469ed554b750456843d7c_22_0.png)


    **普通的领导** 我们最近要和×××品牌合作，需要出一个宣传方案，你来做一下，后天给我。


    **优秀的领导** 最近×××品牌要与我们合作。马上到五一劳动节，他们想让我们围绕这个节日和新产品，出一个节日宣传方案，以提高这款新产品的销量。


    这次活动主要面向25~35岁的女性人群，活动方案要求包含节日三天的每日宣传安排。方案用PPT呈现，不要超过10页。


    ![](img/6ede4ab2740469ed554b750456843d7c_22_1.png)


    周五下午6点前将方案给我。


    优秀的领导布置的任务更容易完成，因为优秀的领导给出的信息完整，要求清晰。领导布置的任务应让下属看了就知道工作任务是什么，否则下属就得花费大量时间和领导确认方案的具体要求。


    在向AI提问时，给出的指令越清晰和具体，得到的结果越接近自己的期望。


    **指令式提问**，就是提问者限定问题范围以及对回答的要求，通过精确、具体的指令引导AI生成符合预期的、更具针对性的回答。


    什么样的指令才是好的指令呢？以下四大原则供大家参考。


    # 结构清晰'
  - '[PAGE 23]


    下达指令前，可以借助一些经典的结构（比如常用的5W），让自己的表达更有逻辑、更顺畅，从而给出清晰的指令。


    # 重点突出


    清晰地表达需求，但这可能会导致指令比较复杂。指令复杂，不利于AI理解提问者的需求，这时可以通过换行，突出每一条重要的指令。


    # 语言简练


    多用短句，少用长句，使信息精简。


    # 易于理解


    尽量使用表示量化或具体场景的词汇，尤其是在表达期望达到某种效果的时候。比如当希望控制篇幅时，比起“篇幅不要太长”，明确给出“控制在300字以内”更容易让AI理解。


    了解了以上原则后，我们会发现掌握一些常用的结构化提问思路，是用好指令式提问的关键。接下来我们就结合实际场景，来领略指令式提问的魅力。


    参考结构：5W


    | 英文单词 | 中文解释 | 提问启发 |

    |---|---|---|

    | Why | 何故 | 做这件事的原因是什么 |

    | What | 何事 | 具体是什么事 |

    | Who | 何人 | 这件事有哪些人参与或者服务于谁 |

    | When | 何时 | 这件事什么时候做或者何时截止 |

    | Where | 何地 | 在哪里做这件事 |'
  - '[PAGE 24]


