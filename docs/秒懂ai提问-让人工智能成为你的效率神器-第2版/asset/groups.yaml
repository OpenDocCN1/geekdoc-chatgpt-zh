    ### 二、创意设计：用AI快速模仿设计风格


    目前很多AI工具都有“以图生图”的功能，这种功能其实就是示例式提问的一种——给AI提供一张图，让AI生成类似的图片。


    很多AI工具也提供了示例模型，用户选择某个风格的示例模型，AI工具可以生成类似的图片。如使用AI绘画工具Vega AI生成图像，首先给出一张图片作为示例，Vega
    AI将根据示例生成类似的图片。


    ![](img/6ede4ab2740469ed554b750456843d7c_42_0.png)


    ### 注意


    - 1. 使用示例式提问时要选择合适的例子，需要确保所选的例子具有代表性且与问题紧密相关。


    - 2. 在提供示例后，可以要求AI总结示例的特点，从而确认AI已理解示例所包含的关键点和细节。


    - 3. 在选择示例时，注意清晰地表达重点信息，防止过多的细节和无关信息干扰AI。


    ## 6. 引导提问：激发AI的创造力


    你有没有过这样的经历？


    领导把大家叫到办公室，大家面面相觑，等着领导发语，结果领导说：“今天开会不谈项目，主要是想和大家一起讨论下个月的活动主题，大家集思广益，有什么点子都可以说出来。”


    如果你参加过这种会就知道，这是头脑风暴会。


    通过头脑风暴，我们可以获得更多的新思路与创意。当面临棘手的问题时，通过头脑风暴，我们不仅可以收获多个解决方案，便于找到最佳方案，还可以找到审视问题的全新视角。


    有了AI的帮助，我们就不用再拉着很多人一起开会了，因为AI就可以帮我们进行头脑风暴，而且它的知识面更广，审视问题的视角也更多。


    那么，怎么让AI帮我们进行头脑风暴呢？


    要引导AI“思考”。


    想要让AI提供更多的点子，只需要在我们想讨论的主题、问题前面加上“让我们思考一下”。这个提示词可以让AI生成经过“深度思考”的文本，这对经常写作的人来说很有帮助。


    假如我们想要写一篇关于AI给职场人士工作带来的冲击的文章，但是不知道有哪些好的角度，可以这样向AI提问。


    让我们思考一下，AI给职场人士工作带来了哪些冲击？


    AI对职场和工作的影响确实很大，主要体现在以下几方面。


    - (1) 许多工作会被自动化。（具体内容，略）

    - (2) 部分工作会发生变化。（具体内容，略）

    - (3) 新的工作将产生。（具体内容，略）

    - (4) AI将提高生产力。（具体内容，略）


    以上这种提问方法，叫作引导提问。


    引导提问是一种鼓励AI提供详细、完整且带有主观见解的提问方法。


    这类问题通常没有标准答案，要求AI基于知识储备与分析框架来组织回答内容。引导提问可以让AI在“思考”和回答问题时更加深入，有助于产生新的见解。


    在使用引导提问时，应注意以下几点。


    **使用开放性问题**


    提问时，要使用开放性的问题，而不是使用回答为“是”或“否”的封闭性问题，以鼓励AI提供更多选项和想法。


    **通过固定短语引导深入思考**


    通常以“为什么”“怎么样”“请描述”等开头，以引导AI进行深入思考。


    **引导AI深入思考**


    提问者可以通过追问，让AI扩大“思考”的范围，促使AI提供更丰富的信息。例如在AI给出一些想法后，可以追问“还有其他的想法吗”“不管想法多疯狂，我都想听听”。


    ![](img/6ede4ab2740469ed554b750456843d7c_44_0.png)


    以下是使用引导提问的例子。


    在你的职业生涯中，哪次经历对你的影响最大？为什么？

    你是如何解决这个问题的？请详细描述你的处理过程。

    你认为未来五年内，这个行业将会发生哪些重大变化？

    来看看下面两个案例。


    ### 例：讨论AI对人类进化的影响


    **Before 常规提问**

    你觉得AI的出现会影响人类进化的速度吗？


    **After 引导提问**

    让我们讨论一下，你觉得AI的出现会影响人类进化的速度吗？请一步步思考。


    ### 例：提高工作效率


    **Before 常规提问**

    如何提高工作效率？


    **After 引导提问**

    让我们思考一下，在工作中，哪些情况会造成工作效率低下？分析问题的根源，应采取哪些具体的措施来解决？


    ## 应用案例


    ### 一、专家顾问团：让AI成为你的智囊团


    你是不是也想拥有和自己一起进行头脑风暴的团队？使用引导提问，让AI从不同角度给出观点，这样就可以模仿现实中的团队，你就能得到多角度的观点。


    我的智囊团内有3位专家，这3位专家分别是乔布斯、××和××，他们都有自己的个性、世界观和价值观，对同一问题有不同的视角、看法和建议，我会说出我的处境和我的决策，请你分别以这3位专家的身份和思维模式来审视我的决策，并给出评判和建议，听明白了吗？


    明白了，我将扮演3位专家（乔布斯、假设的××专家，以及未指定的×××专家）来审视您的处境和决策，并给出各自视角下的评判与建议。请继续描述您的处境和决策。


    ### 一、乔布斯视角


    **审视与评判**


    作为乔布斯，我倾向于追求极致、简洁和创新的解决方案。我会评估您的决策是否足够大胆，能否引领行业变革或显著提升用户体验。同时，我也会关注决策背后的逻辑是否清晰，是否经过深思熟虑，以及它是否能够迅速适应市场变化，保持灵活性和前瞻性。


    **建议**


    - 确保决策与公司的长期愿景紧密相连，不断推动产品和服务的创新。


    - 精简决策流程，去除冗余环节，确保执行高效。


    - 鼓励团队提出新想法，即使这些想法最初看起来不切实际，因为伟大的创新往往源自非传统思维。


    - 密切关注市场动态，灵活调整策略，以快速响应市场变化。


    ### 二、××专家（假设为策略型）视角


    **审视与评判**


    作为策略型专家，我会从全局视角出发，深入分析决策对短期和长期目标的影响。我会评估决策是否基于充分的市场调研和数据分析，是否考虑到所有相关利益方的需求和期望。同时，我也会关注决策的可执行性和资源投入的合理性。


    **建议**


    - 制订详细的实施计划，明确各阶段的目标、责任人和时间规划。


    - 确保决策与公司战略目标保持一致，并有助于实现公司战略目标。


    - 充分考虑潜在的风险和挑战，制定应对措施，确保决策的稳定性和可持续性。

