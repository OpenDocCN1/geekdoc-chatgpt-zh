    \n（以上内容由文心一言生成，内容有删改）\n\n## 二、培训教学：一键生成培训大纲\n\n指令式提问因为信息明确，非常适用于教育行业中的一些培训场景，比如帮助讲师撰写培训大纲、培训教案等。\n\
