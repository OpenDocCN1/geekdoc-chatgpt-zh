    项目阶段划分为


    ### 项目启动阶段（第1周）


    成立项目团队，明确各成员职责。


    召开项目启动会议，介绍项目背景、目标、范围和计划，统一团队成员的思想和行动……


    ### 需求分析阶段（第2~4周）


    业务分析师与用户进行深入沟通，收集详细业务需求，包括功能需求、性能需求、安全需求……


    ### 系统设计阶段（第5~8周）


    根据需求规格说明书，进行系统架构设计，确定系统的整体架构和技术选型……


    （循环提问）在系统设计阶段，架构设计不合理可能会影响设计的质量、进度以及后续的开发和实施。请提供一个规避方案。


    ### 第一轮AI回答（部分）


    - 1. 深入需求分析：全面理解业务需求和非功能需求，确保架构设计的基础准确无误。

    - 2. 充分技术调研：评估技术选型的成熟度、稳定性及与团队能力的匹配度，选择合适的技术栈。

    - 3. 组建专业团队：由经验丰富的架构师、技术专家、开发人员和业务分析师组成团队，明确职责分工。

    - 4. 遵循设计原则：采用分层架构、模块化设计、服务化架构等原则，确保架构的可扩展性、性能和安全性。

    - 5. 严格设计评审：通过内部和外部专家评审，发现并优化架构设计中的潜在问题。

    - 6. 持续优化调整：根据反馈和评估结果，持续优化架构设计，确保其适应性与合理性。


    （循环提问）请进一步细化解决方案，增加风险管理和用户反馈机制。


    ### 第二轮AI回答（部分）


    以下是增加的部分。


    - 1. 风险识别：在架构设计阶段，识别可能的技术风险、性能风险、安全风险等。

    - 2. 风险评估：对识别的风险进行评估，确定其发生的可能性和影响程度。

    - 3. 风险应对：制定相应的风险应对措施，如技术备份方案、性能优化策略、安全加固措施等。

    - 4. 早期用户测试：在架构设计阶段，邀请部分用户参与早期测试，收集用户对系统架构的反馈。

    - 5. 反馈闭环：建立用户反馈的处理机制，及时将用户反馈纳入架构设计的优化中。


    ## 9. 市场调研与竞争分析：复合型提问+对立提问+迁移提问


    当我们需要深入理解市场格局并制定策略时，可以使用复合型提问把握全貌，使用对立提问检验策略的稳健性，使用迁移提问跨领域借鉴经验。这种组合提问方式能帮助我们快速建立更具适应性的市场方案。


    ### 案例背景


    你是一家企业的市场分析师，需要进行市场调研和竞争分析，以制定市场进入策略。


    ### 组合提问


    复合式提问（全面了解）→ 对立提问（竞争应对）→ 迁移提问（借鉴经验）


    ### 提问示例


    （复合型提问）请分析智能家居市场的规模、增长率、消费者画像、主要竞争对手及其市场份额，以及潜在的市场机会和挑战。


    （仅展示部分内容）


    ### 一、市场规模


    据市场研究机构数据，全球智能家居市场规模已达到约1500亿美元，预计到2028年将达到3500亿美元左右，复合年增长率（CAGR）约为18%。


    在我国，智能家居市场也在迅速扩张，2023年市场规模约为5000亿元人民币，预计到2028年将突破1.5万亿元人民币，复合年增长率超过20%。


    ### 二、消费者画像


    - 1. 年轻消费者（25~40岁）


    这部分人群是智能家居市场的主要消费群体。他们对新技术接受度高，追求个性化、便捷化的生活方式，愿意为提升生活品质的产品支付较高的价格。


    - 2. 中年消费者（40~60岁）


    随着智能家居产品的功能不断完善和价格逐渐合理化，越来越多的中年消费者也开始关注和使用智能家居产品，尤其是对安全、健康、节能等功能有较高的需求。


    ### 三、收入水平


    - 1. 中高收入群体


    智能家居产品价格相对较高，因此中高收入群体是主要的消费群体。他们对生活品质有较高要求，愿意为智能家居产品带来的便利和舒适支付额外费用。


    - 2. 中等收入群体


    随着智能家居产品的普及和价格下降，部分中等收入群体也开始逐渐接受和购买智能家居产品，尤其是价格较为亲民的智能照明、智能安防等产品。


    ### 四、主要竞争对手及市场份额


    .........


    ### 五、潜在市场机会和挑战


    .........


    （对立提问）如果竞争对手A公司突然推出相似的产品，我们的市场进入策略应该如何调整？


    （仅展示部分内容）应加速产品开发进程，突出我们的差异化功能（如更长的续航时间、更友好的用户界面），并加强品牌建设和市场推广，提高消费者对我们品牌的认知度和忠诚度。


    （迁移提问）能否借鉴其他行业（如智能手机行业）的成功市场进入策略，优化我们的市场进入方案？


    （仅展示部分内容）可以借鉴智能手机行业的“饥饿营销”策略，通过限量发售、预约抢购等方式提高产品稀缺性和话题性，同时利用社交媒体和KOL进行口碑传播，快速提升品牌知名度和市场份额。


    通过灵活组合各种提问方式，我们可以充分利用AI的强大能力，分析和拆解问题，组合提问策略，更高效地解决各种复杂问题。希望通过这些方法能够帮助你成为AI提问的高手，让AI真正成为你的效率神器。

