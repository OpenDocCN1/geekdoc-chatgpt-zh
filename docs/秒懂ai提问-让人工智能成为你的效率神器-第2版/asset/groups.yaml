    \ AI\n\n- - 20 种提问方法\n- - 100 个应用案例\n- - 搞定工作 / 学习 / 生活中的常见问题\n\n## 内容提要\n\n要想高效地利用AI，关键在于我们如何提问。本书首先介绍提示词的设计技巧，然后系统地介绍了20种向AI提问的有效方法，最后介绍提问方法的组合运用以便解决复杂问题。\n\
