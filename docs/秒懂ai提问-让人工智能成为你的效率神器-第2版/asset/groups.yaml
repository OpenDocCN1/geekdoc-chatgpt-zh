    # 第二步，让AI扮演老师，针对学习难点给出解决方案。


    假设你是一名教授传播学的大学老师，我是一名学生，你即将给我讲解“拉斯韦尔模式”。我会告诉你我遇到的问题，请你帮我解答，可以吗？


    当然可以，很高兴扮演一名教授传播学的大学老师，并为你讲解“拉斯韦尔模式”。这个模式在传播学领域是基础且重要的一个概念，它为我们理解传播过程提供了一个清晰的框架。现在，让我们开始吧。'
  md: "\n![](img/6ede4ab2740469ed554b750456843d7c_17_0.png)\n\n如果这么问，领导就会为你明确接下来工作的重点方向，甚至还会给你增加人手，从而让你顺利完成这个项目。\n\
    \n很显然，在这个场景里，提问二抓住了提问的关键点，“分析市场需求”和“制订预算计划”是两个非常明确的关键词，有了这两个关键词，领导才能给你提供建议和指导。\n\
    \n其实在这个场景里，你可以将领导看作是AI，而你作为提问者，只有掌握了关键词提问的技巧，才能获得想要的答案。\n\n**关键词提问**是指将关键词放在问题或指令中，帮助AI更准确地理解问题，让答案更具针对性。\n\
    \n好的关键词提问通常是清晰、具体、明确的，可以让AI准确理解你的问题，同时也能精准地回答你的问题。\n\n那么，如何通过关键词来进行提问呢？以下是一些具体的技巧。\
    \ ☺\n\n## 确定问题核心\n\n首先，思考一下问题的核心是什么。好的关键词通常可以直接反映问题的主要内容。\n\n假设你询问如何让网站留住用户，问题核心就是“用户留存率”。所以你可以提问：“如何提高电商网站的用户留存率？”这个问题清楚地指出了你的重点——用户留存率。\n\
    \n## 使用专业术语\n\n如果适用，请使用相关领域的专业术语。这可以提高问题的准确性，让回答更具针对性。\n\n比如，在搜索引擎优化（SEO）领域，假设你想知道如何提高某个网页的排名，直接问：“如何优化长尾关键词以提高网页排名？”使用“长尾关键词”这一专业术语可以帮助你获得更专业的回答。\n\
    \n## 结合具体情景\n\n尽量将关键词与具体的情景、案例或背景相结合，以便AI更好地理解问题。\n\n如果你是一家餐厅的老板，想提升顾客满意度，你可以问：“在高档餐厅中，如何通过个性化服务来提升顾客满意度？”这里的关键词“高档餐厅”和“个性化服务”明确了具体的情境。\n\
    \n来看几个不同场景下关键词提问的使用案例。\n\n## 例：PPT美化\n\nBefore 关键词模糊\n如何让PPT更好看？\n\nAfter 关键词具体\n\
    如何让PPT的排版视觉效果更好看？\n\n## 例：职业发展建议\n\nBefore 关键词模糊\n如何赚到第一桶金？\n\nAfter 关键词具体\n新媒体编辑如何在三年内月入过万元？\n\
    \n## 例：写诗\n\n### Before 关键词模糊\n\n帮我写一首关于春天的诗。\n\n### After 关键词具体\n\n模拟王维的风格，帮我写一首关于春天的诗。\n\
    \n## 例：创作一幅画\n\n### Before 关键词模糊\n\n帮我画一幅向日葵油画。\n\n### After 关键词具体\n\n帮我模仿凡·高的风格，画一幅向日葵油画。\n\
    \n## 应用案例\n\n## 一、搜索引擎优化：让AI优化网站关键词\n\n借助AI分析热门关键词并针对这些关键词优化网站内容，可以提高网站在搜索引擎中的排名。\n\
    \n我们是一家专注于职场技能提升的在线教育公司，现在需要通过优化关键词来提高公司在搜索引擎中的排名，请帮我罗列10个时下热门的职场关键词。\n\n以下是10个时下热门的职场关键词，可用于提高搜索引擎排名。\n\
    \n- 1. AI技能提升：随着AI的广泛应用，掌握AI相关技能成为职场人提升竞争力的重要方向。\n\n- 2. 混合用工：企业采用灵活就业人员与固定员工相结合的模式，提供更灵活的工作选择。\n\
    \n- 3. “大厂”平替：职场人不再只关注“大厂”，具有竞争力的中小企业成为新选择。\n\n- 4. 打工人3.0：具备专业技能、数字化思维和创新能力的新一代职场人。\n\
    \n- 5. 第二曲线：中年职场人寻找新的职业发展方向，以突破职业瓶颈。\n\n- 6. 激活与协同：企业通过打破部门壁垒、构建协同网络，激发员工的内在动力。\n\
    \n- 7. 降本增效：企业通过优化管理流程、提高效率来降低成本，职场人需适应更严格的绩效评估。\n\n- 8. 新质生产力：以创新为主导的先进生产力，推动职场生态变革。\n\
    \n- 9. 灵活就业：通过项目制、兼职、远程办公等方式实现多样化的工作模式。\n\n- 10. 松弛感：职场人追求在快节奏工作中保持放松和自在的状态。\n\
    \n这些关键词反映了当前职场的热门趋势和职场人关注的焦点，可用于优化公司网站内容，提升在搜索引擎中的排名。\n\n(以上内容由Kimi生成)\n\n## 二、数据挖掘：让AI快速分析关键信息\n\
    \n在数据挖掘中，使用关键词提问，分析师可以快速定位需要分析的数据、筛选关键信息。例如，在下面几个分析场景中，分析师只需将数据和信息发给AI，再通过关键词提问给出指令。\n\
    \n### 市场分析（关键词：市场份额、用户偏好、竞争对手）\n\n请根据我发给你的数据，从以下三个方面进行分析。\n\n- (1) 请分析当前季度我们产品的市场份额，并与上一季度比较。\n\
    \n- (2) 用户偏好在哪些方面发生了变化？\n\n- (3) 竞争对手A的市场份额增长对我们有何影响？\n\n### 客户行为分析（关键词：购买频率、购买行为、流失率）\n\
    \n- (1) 本月的购买频率与上个月相比有何变化？\n\n- (2) 请识别出高价值客户群体，并分析他们的购买行为。\n\n- (3) 流失率在过去三个月内有何趋势？请列出主要原因。\n\
    \n### 产品性能分析（关键词：故障率、用户反馈、性能优化）\n\n- (1) 产品A的故障率在过去一年内呈现何种趋势？\n\n- (2) 用户对产品B的性能有哪些正面和负面反馈？\n\
    \n- (3) 基于当前数据，我们应该如何优化产品C的性能？\n\n### 注意\n\n- 1. 关键词越抽象，AI的理解就越不准确，越容易造成歧义或多重解读。关键词越清晰、越具体，得到的回答内容越容易达到预期。\n\
    \n- 2. 使用关键词提问时，提问者应对相关领域有一定的了解，需要提前梳理出明确的核心词汇或短语。\n\n## 3. 指令式提问：确保得到更精准的答案\n\
    \n想要驾驭AI，就要掌握与AI对话的技巧。从某种角度来看，和AI对话，就像给下属布置任务一样。同样的任务，同样的下属，会布置任务的领导总是更容易带领下属完成任务。\n\
    \n来看这样一个案例。领导需要制定一个宣传方案，下达了如下任务。假如你是下属，你更可能完成哪个领导布置的任务？\n\n![](img/6ede4ab2740469ed554b750456843d7c_22_0.png)\n\
    \n**普通的领导** 我们最近要和×××品牌合作，需要出一个宣传方案，你来做一下，后天给我。\n\n**优秀的领导** 最近×××品牌要与我们合作。马上到五一劳动节，他们想让我们围绕这个节日和新产品，出一个节日宣传方案，以提高这款新产品的销量。\n\
    \n这次活动主要面向25~35岁的女性人群，活动方案要求包含节日三天的每日宣传安排。方案用PPT呈现，不要超过10页。\n\n![](img/6ede4ab2740469ed554b750456843d7c_22_1.png)\n\
    \n周五下午6点前将方案给我。\n\n优秀的领导布置的任务更容易完成，因为优秀的领导给出的信息完整，要求清晰。领导布置的任务应让下属看了就知道工作任务是什么，否则下属就得花费大量时间和领导确认方案的具体要求。\n\
    \n在向AI提问时，给出的指令越清晰和具体，得到的结果越接近自己的期望。\n\n**指令式提问**，就是提问者限定问题范围以及对回答的要求，通过精确、具体的指令引导AI生成符合预期的、更具针对性的回答。\n\
    \n什么样的指令才是好的指令呢？以下四大原则供大家参考。\n\n### 结构清晰\n\n下达指令前，可以借助一些经典的结构（比如常用的5W），让自己的表达更有逻辑、更顺畅，从而给出清晰的指令。\n\
    \n### 重点突出\n\n清晰地表达需求，但这可能会导致指令比较复杂。指令复杂，不利于AI理解提问者的需求，这时可以通过换行，突出每一条重要的指令。\n\n\
    ### 语言简练\n\n多用短句，少用长句，使信息精简。\n\n### 易于理解\n\n尽量使用表示量化或具体场景的词汇，尤其是在表达期望达到某种效果的时候。比如当希望控制篇幅时，比起“篇幅不要太长”，明确给出“控制在300字以内”更容易让AI理解。\n\
    \n了解了以上原则后，我们会发现掌握一些常用的结构化提问思路，是用好指令式提问的关键。接下来我们就结合实际场景，来领略指令式提问的魅力。\n\n参考结构：5W\n\
    \n| 英文单词 | 中文解释 | 提问启发 |\n|---|---|---|\n| Why | 何故 | 做这件事的原因是什么 |\n| What | 何事\
    \ | 具体是什么事 |\n| Who | 何人 | 这件事有哪些人参与或者服务于谁 |\n| When | 何时 | 这件事什么时候做或者何时截止 |\n\
    | Where | 何地 | 在哪里做这件事 |\n\n### 例：写营销活动策划案\n\n小李在一家广告公司做策划。最近公司和七七牙刷品牌合作，需要小李为对方撰写针对中秋节的营销活动策划案，来增加新品的销量。\n\
    \n### 不清晰的指令\n\n我们最近要和七七牙刷品牌合作，请你帮我为这款牙刷写一个中秋节的营销活动策划案。\n\n### 清晰的指令\n\n(Why)\
    \ 最近我们要和七七牙刷品牌合作，马上就是中秋节，我们要出一个营销活动策划案。\n\n(Where) 这个营销活动会在线上平台进行，主要在对方的自营店铺宣传。\n\
    \n(What) 需要你帮我写一个营销活动策划案。这个营销活动策划案要包含中秋节在内的3天的活动主题以及宣传方案细节。\n\n(Who) 活动主要针对25~35岁的职场白领，主要卖点为出差携带方便、刷头替换方便以及充电一次可以用一个月。\n\
    \n(When) 策划案需要在8月30日下午6点前提交。\n\n### 例：朋友圈“种草”文案撰写\n\n#### 不清晰的指令\n\n我想在朋友圈中向朋友推荐一款法国波尔多地区的红酒，请帮我写个朋友圈“种草”文案。\n\
    \n#### 清晰的指令\n\n我想在朋友圈中向朋友推荐一款红酒，要求用“发现—体验—回味”结构，帮我写一个号召用户购买这款红酒的朋友圈“种草”文案。\n\n\
    ### 例：创作短视频脚本\n\n#### 不清晰的指令\n\n帮我写一个家庭教育方面的短视频脚本。\n\n#### 清晰的指令\n\n帮我创作一个吸引人的短视频脚本，要求如下。\n\
    \n- 1. 视频主题：关于家庭教育，如何激发孩子的自驱力。\n\n- 2. 目标受众：3~15岁孩子的父母。脚本要能让他们意识到催促和吼叫不能解决孩子拖拉磨蹭的问题，以及让他们了解如何正确激发孩子的自驱力。\n\
    \n- 3. 视频时长：1分钟。\n\n## 应用案例\n\n## 一、职场工作：让AI协助制订工作计划\n\n明确了工作目标和现状，自己制订工作计划时却总觉得思路受限？不妨考虑让AI帮你出谋划策。推荐运用SCQA模型来梳理思路，给AI更清晰的指令。\n\
    \n参考结构：SCQA模型\n\n| 简要解释 | 提问启发 |\n| :--- | :--- |\n| Situation ( 情景 )：事情发生的背景\
    \ | 任务背景是什么 |\n| Complication ( 冲突 )：理想与现实的差距 | 有什么素材或信息 |\n| Question ( 疑问 )：当前要解决的问题或要完成的任务\
    \ | 现在要完成什么任务 |\n| Answer ( 回答 )：提供的解决方案 | 有哪些参考案例 |\n\n（任务背景）我们要制订第二季度的工作计划，需要你根据以下信息，帮助我们拆解任务目标，制订详细的行动计划。\n\
    \n（已有素材）目前公司主要销售的产品是价值999元/人的课程，有一万名老客户。\n\n（当前任务）我们的任务是第二季度销售业绩达到500万元。\n\n请你根据我们公司的现状制定几套可选择的方案，帮助我们完成任务。\n\
    \n（参考案例）每套方案需附有参考案例。\n\n为了完成第二季度500万元的销售业绩目标，我们可以从老客户激活、新客户获取、课程套餐优化、营销活动策划以及销售团队建设等几个方面入手，制定以下几套可选择的方案，并附上参考案例。\n\
