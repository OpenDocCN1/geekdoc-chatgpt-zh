    # 应用案例


    # 一、课堂教学：用AI帮助老师提升教学效果


    老师使用角色扮演式提问，不仅能够发现学生的学习难点，还可以进一步找到解决这些难点的方案。


    让AI给出学生在学习时可能会遇到的难点，老师可以针对学生可能会遇到的难点进行备课，达到更好的教学效果。看看下面给出的角色扮演式提问示例。


    第一步，让AI扮演学生，指出学习难点。


