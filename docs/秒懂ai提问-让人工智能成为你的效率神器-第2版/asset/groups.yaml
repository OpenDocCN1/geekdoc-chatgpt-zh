    \n- 9. 灵活就业：通过项目制、兼职、远程办公等方式实现多样化的工作模式。\n\n- 10. 松弛感：职场人追求在快节奏工作中保持放松和自在的状态。\n\
    \n这些关键词反映了当前职场的热门趋势和职场人关注的焦点，可用于优化公司网站内容，提升在搜索引擎中的排名。\n\n(以上内容由Kimi生成)\n\n## 二、数据挖掘：让AI快速分析关键信息\n\
    \n在数据挖掘中，使用关键词提问，分析师可以快速定位需要分析的数据、筛选关键信息。例如，在下面几个分析场景中，分析师只需将数据和信息发给AI，再通过关键词提问给出指令。\n\
    \n### 市场分析（关键词：市场份额、用户偏好、竞争对手）\n\n请根据我发给你的数据，从以下三个方面进行分析。\n\n- (1) 请分析当前季度我们产品的市场份额，并与上一季度比较。\n\
    \n- (2) 用户偏好在哪些方面发生了变化？\n\n- (3) 竞争对手A的市场份额增长对我们有何影响？\n\n### 客户行为分析（关键词：购买频率、购买行为、流失率）\n\
    \n- (1) 本月的购买频率与上个月相比有何变化？\n\n- (2) 请识别出高价值客户群体，并分析他们的购买行为。\n\n- (3) 流失率在过去三个月内有何趋势？请列出主要原因。\n\
    \n### 产品性能分析（关键词：故障率、用户反馈、性能优化）\n\n- (1) 产品A的故障率在过去一年内呈现何种趋势？\n\n- (2) 用户对产品B的性能有哪些正面和负面反馈？\n\
    \n- (3) 基于当前数据，我们应该如何优化产品C的性能？\n\n### 注意\n\n- 1. 关键词越抽象，AI的理解就越不准确，越容易造成歧义或多重解读。关键词越清晰、越具体，得到的回答内容越容易达到预期。\n\
    \n- 2. 使用关键词提问时，提问者应对相关领域有一定的了解，需要提前梳理出明确的核心词汇或短语。\n\n## 3. 指令式提问：确保得到更精准的答案\n\
    \n想要驾驭AI，就要掌握与AI对话的技巧。从某种角度来看，和AI对话，就像给下属布置任务一样。同样的任务，同样的下属，会布置任务的领导总是更容易带领下属完成任务。\n\
    \n来看这样一个案例。领导需要制定一个宣传方案，下达了如下任务。假如你是下属，你更可能完成哪个领导布置的任务？\n\n![](img/6ede4ab2740469ed554b750456843d7c_22_0.png)\n\
    \n**普通的领导** 我们最近要和×××品牌合作，需要出一个宣传方案，你来做一下，后天给我。\n\n**优秀的领导** 最近×××品牌要与我们合作。马上到五一劳动节，他们想让我们围绕这个节日和新产品，出一个节日宣传方案，以提高这款新产品的销量。\n\
    \n这次活动主要面向25~35岁的女性人群，活动方案要求包含节日三天的每日宣传安排。方案用PPT呈现，不要超过10页。\n\n![](img/6ede4ab2740469ed554b750456843d7c_22_1.png)\n\
    \n周五下午6点前将方案给我。\n\n优秀的领导布置的任务更容易完成，因为优秀的领导给出的信息完整，要求清晰。领导布置的任务应让下属看了就知道工作任务是什么，否则下属就得花费大量时间和领导确认方案的具体要求。\n\
    \n在向AI提问时，给出的指令越清晰和具体，得到的结果越接近自己的期望。\n\n**指令式提问**，就是提问者限定问题范围以及对回答的要求，通过精确、具体的指令引导AI生成符合预期的、更具针对性的回答。\n\
    \n什么样的指令才是好的指令呢？以下四大原则供大家参考。\n\n### 结构清晰\n\n下达指令前，可以借助一些经典的结构（比如常用的5W），让自己的表达更有逻辑、更顺畅，从而给出清晰的指令。\n\
    \n### 重点突出\n\n清晰地表达需求，但这可能会导致指令比较复杂。指令复杂，不利于AI理解提问者的需求，这时可以通过换行，突出每一条重要的指令。\n\n\
    ### 语言简练\n\n多用短句，少用长句，使信息精简。\n\n### 易于理解\n\n尽量使用表示量化或具体场景的词汇，尤其是在表达期望达到某种效果的时候。比如当希望控制篇幅时，比起“篇幅不要太长”，明确给出“控制在300字以内”更容易让AI理解。\n\
    \n了解了以上原则后，我们会发现掌握一些常用的结构化提问思路，是用好指令式提问的关键。接下来我们就结合实际场景，来领略指令式提问的魅力。\n\n参考结构：5W\n\
    \n| 英文单词 | 中文解释 | 提问启发 |\n|---|---|---|\n| Why | 何故 | 做这件事的原因是什么 |\n| What | 何事\
    \ | 具体是什么事 |\n| Who | 何人 | 这件事有哪些人参与或者服务于谁 |\n| When | 何时 | 这件事什么时候做或者何时截止 |\n\
    | Where | 何地 | 在哪里做这件事 |\n\n### 例：写营销活动策划案\n\n小李在一家广告公司做策划。最近公司和七七牙刷品牌合作，需要小李为对方撰写针对中秋节的营销活动策划案，来增加新品的销量。\n\
    \n### 不清晰的指令\n\n我们最近要和七七牙刷品牌合作，请你帮我为这款牙刷写一个中秋节的营销活动策划案。\n\n### 清晰的指令\n\n(Why)\
    \ 最近我们要和七七牙刷品牌合作，马上就是中秋节，我们要出一个营销活动策划案。\n\n(Where) 这个营销活动会在线上平台进行，主要在对方的自营店铺宣传。\n\
    \n(What) 需要你帮我写一个营销活动策划案。这个营销活动策划案要包含中秋节在内的3天的活动主题以及宣传方案细节。\n\n(Who) 活动主要针对25~35岁的职场白领，主要卖点为出差携带方便、刷头替换方便以及充电一次可以用一个月。\n\
    \n(When) 策划案需要在8月30日下午6点前提交。\n\n### 例：朋友圈“种草”文案撰写\n\n#### 不清晰的指令\n\n我想在朋友圈中向朋友推荐一款法国波尔多地区的红酒，请帮我写个朋友圈“种草”文案。\n\
    \n#### 清晰的指令\n\n我想在朋友圈中向朋友推荐一款红酒，要求用“发现—体验—回味”结构，帮我写一个号召用户购买这款红酒的朋友圈“种草”文案。\n\n\
    ### 例：创作短视频脚本\n\n#### 不清晰的指令\n\n帮我写一个家庭教育方面的短视频脚本。\n\n#### 清晰的指令\n\n帮我创作一个吸引人的短视频脚本，要求如下。\n\
    \n- 1. 视频主题：关于家庭教育，如何激发孩子的自驱力。\n\n- 2. 目标受众：3~15岁孩子的父母。脚本要能让他们意识到催促和吼叫不能解决孩子拖拉磨蹭的问题，以及让他们了解如何正确激发孩子的自驱力。\n\
    \n- 3. 视频时长：1分钟。\n\n## 应用案例\n\n## 一、职场工作：让AI协助制订工作计划\n\n明确了工作目标和现状，自己制订工作计划时却总觉得思路受限？不妨考虑让AI帮你出谋划策。推荐运用SCQA模型来梳理思路，给AI更清晰的指令。\n\
    \n参考结构：SCQA模型\n\n| 简要解释 | 提问启发 |\n| :--- | :--- |\n| Situation ( 情景 )：事情发生的背景\
    \ | 任务背景是什么 |\n| Complication ( 冲突 )：理想与现实的差距 | 有什么素材或信息 |\n| Question ( 疑问 )：当前要解决的问题或要完成的任务\
    \ | 现在要完成什么任务 |\n| Answer ( 回答 )：提供的解决方案 | 有哪些参考案例 |\n\n（任务背景）我们要制订第二季度的工作计划，需要你根据以下信息，帮助我们拆解任务目标，制订详细的行动计划。\n\
    \n（已有素材）目前公司主要销售的产品是价值999元/人的课程，有一万名老客户。\n\n（当前任务）我们的任务是第二季度销售业绩达到500万元。\n\n请你根据我们公司的现状制定几套可选择的方案，帮助我们完成任务。\n\
    \n（参考案例）每套方案需附有参考案例。\n\n为了完成第二季度500万元的销售业绩目标，我们可以从老客户激活、新客户获取、课程套餐优化、营销活动策划以及销售团队建设等几个方面入手，制定以下几套可选择的方案，并附上参考案例。\n\
    \n### 方案一：老客户复购与推荐计划\n\n目标：利用现有的一万名老客户基础，通过提升复购率和引导其推荐新客户，实现至少20%的销售额增长。\n\n###\
    \ 执行方案\n\n- 1. 复购优惠：设计针对老客户的专属优惠套餐，如“老带新”成功可享受课程折扣或获得额外的学习资源。\n\n- 2. 成功案例分享：通过邮件、短信或社交媒体分享老客户学习成果，增强信任感，激发复购意愿。\n\
    \n- 3. 推荐奖励机制：设立推荐奖励计划，老客户推荐来的新学员成功报名后，可获得返还现金、课程抵扣券或高级课程体验资格等福利。\n\n参考案例：某在线教育平台推出“学友助力计划”，老学员每推荐一位新学员报名，双方均可获得100元课程抵扣券，活动期间成功推荐率提升至30%，复购率增长至15%。\n\
    \n### 方案二：新客户精准营销\n\n目标：通过多渠道精准营销，吸引至少2000名新客户，贡献约30%的销售额。\n\n### 执行方案\n\n- 1.\
    \ 社交媒体广告：利用大数据分析，针对潜在目标客户在抖音、微信、微博等平台精准投放广告。\n\n- 2. 内容营销：制作高质量的教育内容（如直播课、短视频、博客文章），通过SEO和社交媒体传播，吸引潜在客户转化为学员。\n\
    \n综上所述，综合运用老客户复购与推荐、新客户精准营销、课程套餐优化与升级以及销售团队培训与激励等策略，可以有效提升销售业绩，助力公司达成第二季度500万元的销售目标。\n\
    \n（以上内容由文心一言生成，内容有删改）\n\n## 二、培训教学：一键生成培训大纲\n\n指令式提问因为信息明确，非常适用于教育行业中的一些培训场景，比如帮助讲师撰写培训大纲、培训教案等。\n\
    \n讲师明确培训主题后，可以借助黄金三点法（是什么—为什么—怎么做）向AI提问，快速得到一份合格的培训大纲。\n\n（是什么）你是一位培训讲师，现在要面向企业进行一场以“直播带货”为主题的培训。\n\
    \n### （为什么）培训目的如下：\n\n- 1. 让企业员工意识到直播带货的重要性；\n\n- 2. 让企业员工能够进行直播，掌握基本的直播技巧。\n\n\
    ### （怎么做）培训大纲需要满足以下3点要求：\n\n- 1. 培训时间为2天，培训大纲需要结合时间来设计；\n\n- 2. 培训大纲需要细化到2级标题，包含培训的具体内容；\n\
    \n- 3. 培训大纲要包含带领学员实操的环节和时间。\n\n## “直播带货”主题企业培训大纲\n\n### 第一天：理论构建与技能基础\n\n### 上午场：直播带货的宏观认知\n\
    \n- 09:00—09:29 开场与破冰\n  - 自我介绍与培训目标阐述\n  - 学员分组，团队文化建设\n- 09:30—10:29 直播带货的兴起与影响力\n\
    \  - 直播电商的市场现状与趋势分析\n  - 直播带货对企业战略的价值\n  - 国内外成功案例分享与剖析\n- 10:30—10:45 茶歇\n\n\
    ..........\n\n这个培训大纲的课程内容包括直播平台深度解析、直播策划与脚本编写、数据分析与效果评估等，同时设置了适当的互动和实操环节，以确保学员能够全面而深入地掌握直播带货的知识与技能。\n\
    \n(以上内容由文心一言生成，内容有删改)\n\n### 注意\n\n- 1. 指令越清晰、越具体，AI的回答越精准。\n\n- 2. 想要进行高质量的指令式提问，可以多积累好的提问结构，帮助自己梳理真实需求，从而进行更清晰的表达。\n\
    \n- 3. 在工作中遇到不明确写作结构的情况，比如撰写会议记录、公文等，可以让AI提供写作框架，再让AI用这个框架生成相应的内容。\n\n## 4. 角色扮演式提问：秒变专家的AI更睿智\n\
    \n试想一下：我们在遇到问题或者想要学习某一个领域的知识时，会更倾向于询问完全没有经验的新手，还是有丰富经验的专家？\n\n比如，当想找人帮自己制订一个健身计划时，你会找下面哪个人？\n\
    \n- A. 大学生\n\n- B. 健身教练\n\n相信大多数人都会选择有相关经验的健身教练。\n\n如果说指令式提问适用于很了解自己需求的专业用户，那么使用角色扮演式提问能让AI变成专家。\n\
    \n角色的设定会大大提升AI回复的质量，神奇吧？\n\n或许有些人会有疑问，给AI赋予专家身份，AI就真的能成为专家吗？\n\nAI拥有强大的数据库，当用户在跟AI对话时，用户发出的每一次指令，其实都是在调用AI数据库中的信息。用户发出的指令越明确，AI调用的信息越精准。\n\
    \n**角色扮演式提问是让用户通过指令赋予AI特定身份，帮助AI匹配更符合该身份的数据库信息。**\n\n因此，如果想要AI更好地完成一项特定任务，可以先赋予它专家身份。\n\
    \n在使用角色扮演式提问时，提问者需要明确AI需要扮演的角色，并清晰地表达。提问者可以使用一些句式帮助AI理解它将要扮演的角色，例如：\n\n- 想让你扮演一名××××；\n\
    - 假设你是××××；\n- 请你担任××××；\n- 你是一位××××。\n\n来看看下面的案例。\n\n## 例：生成食谱\n\n### 未赋予身份\n\
    \n请帮我设计一份素食食谱。\n\n### 赋予身份\n\n你是一位营养师，请帮我设计一份素食食谱。\n\n## 例：新媒体选题策划\n\n### 未赋予身份\n\
    \n最近AI应用很火，请你给我提供10个与之相关的新媒体文章选题。\n\n### 赋予身份\n\n你是一位资深的新媒体文案创作者，最近AI应用很火，请你给我提供10个与之相关的新媒体文章选题。\n\
    \n## 应用案例\n\n## 一、课堂教学：用AI帮助老师提升教学效果\n\n老师使用角色扮演式提问，不仅能够发现学生的学习难点，还可以进一步找到解决这些难点的方案。\n\
    \n让AI给出学生在学习时可能会遇到的难点，老师可以针对学生可能会遇到的难点进行备课，达到更好的教学效果。看看下面给出的角色扮演式提问示例。\n\n第一步，让AI扮演学生，指出学习难点。\n\
    \n我想让你扮演一名大一的学生。我会告诉你我要教授的课程内容，你来告诉我作为学生的你可能会遇到的难点，可以吗？\n\n当然可以，我很乐意扮演一名大一的学生来探讨你将要教授的课程内容。请告诉我你计划教授的课程内容，这样我可以更具体地提出可能会遇到的难点和疑问。\n\
    \n我是一名教授传播学的大学老师，即将给你讲解“拉斯韦尔模式”，你在学习的过程中可能遇到哪些难点？\n\n作为学习传播学的大一大学生，在接触“拉斯韦尔模式”时，我可能会遇到以下几个难点。\n\
    \n### 一、理论理解上的难点\n\n- 1. 概念理解：拉斯韦尔模式，也称为“5W模式”，即谁（Who）、说什么（Says What）、通过什么渠道（In\
    \ Which Channel）、对谁（To Whom）、取得什么效果（With What Effect）。初次接触时，我可能会对这些概念的具体含义和相互之间的关系感到困惑，尤其是如何将这些抽象的概念与实际传播过程相结合。\n\
    \n- 2. 模式局限性的认识：拉斯韦尔模式虽然为传播学提供了基础的分析框架，但它也存在一些局限性，如直线性和孤立性等。我可能会难以理解这些局限性对现代传播学研究的意义，以及如何在实践中克服这些局限性。\n\
    \n### 二、应用实践中的难点\n\n- 1. 案例分析：将拉斯韦尔模式应用于具体案例分析时，我可能会遇到如何准确识别……\n\n- 2. 跨学科知识的融合：拉斯韦尔模式涉及传播学、社会学……\n\
    \n### 三、学习方法和资源获取的难点\n\n..........\n\n(以上内容由文心一言生成，内容有删改)\n\n第二步，让AI扮演老师，针对学习难点给出解决方案。\n\
    \n假设你是一名教授传播学的大学老师，我是一名学生，你即将给我讲解“拉斯韦尔模式”。我会告诉你我遇到的问题，请你帮我解答，可以吗？\n\n当然可以，很高兴扮演一名教授传播学的大学老师，并为你讲解“拉斯韦尔模式”。这个模式在传播学领域是基础且重要的一个概念，它为我们理解传播过程提供了一个清晰的框架。现在，让我们开始吧。\n"
