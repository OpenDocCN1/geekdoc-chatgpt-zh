    # 5. 示例式提问：让AI快速理解你的需求


    无论在职场中，还是在生活中，我们可能都会遇到类似下面的情况。


    场景一：设计师做了几版方案都没通过，和甲方沟通，对话如下。


    甲方说：我要的图不是这种感觉，要那种五彩斑斓的黑！


    设计师想：什么感觉？五彩斑斓的黑是什么黑色？色卡上没有呀！


    场景二：热恋中的情侣，女孩因为男孩买的礼物不称心而吵架。


    女孩说：我要收到的礼物是少女感十足的、可爱的。


    男孩想：少女感是什么样的感觉？不就是买粉色的吗？


    有没有发现，上述两个场景中，甲方和设计师无法达成一致，男孩无法明确女孩的喜好，都是因为甲方或者女孩的表达非常模糊，没有参照物，这造成双方沟通时鸡同鸭讲，彼此都不满意。


    我们发现，就算给了具体的指令或者要求，每个人在理解指令或者要求的时候，仍然会出现偏差，这时候好的办法是什么呢？


    给对方一个示例，方便其理解。


    比如：


    甲方给设计师一张用理想中的黑色做的设计图；


    女孩把自己喜欢的少女感十足的、可爱的物品分享给男孩，帮助他理解自己的喜好。


    和AI沟通也是一样，除了给出清晰的指令或者要求，如果提问者能给出示例，那么AI给出的回答将会更加贴合提问者的需求。


    示例式提问就是提问者明确地给出想要的东西或者内容的示例，减少AI理解的偏差，帮助AI生成的内容无限接近示例的风格，更精准满足提问者的需要。


