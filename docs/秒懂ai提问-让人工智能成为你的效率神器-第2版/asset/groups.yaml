  md: "\n- 加强与内外部合作伙伴的沟通，共同推动决策的实施。\n\n## 三、×××专家（未指定，假设为创意与人文并重）视角\n\n我们是一家在线教育公司。现在AI发展迅猛，催生了很多新工具，这给很多职场人士带来了很大的冲击，我们现在应该怎么做，才能有更好的发展？\
    \ ①\n\n现在我将尝试扮演乔布斯、策略型专家（假设为××专家）以及创意与人文并重的专家（假设为×××专家），来分别审视在线教育公司面对AI发展的处境，并给出建议。\n\
    \n### 一、乔布斯视角\n\n### 审视与评判\n\n乔布斯强调简洁、创新和用户体验。在线教育公司应思考如何将AI以最直观、最吸引人的方式融入教学中，为用户提供令人惊艳的学习体验。\n\
    \n### 建议\n\n- 简化界面与流程：利用AI优化学习平台的界面设计，减少冗余步骤，使学习过程更加流畅和直观。\n- 创新产品功能：开发具有前瞻性的产品功能，如基于AI的沉浸式学习体验、虚拟实验室等，以颠覆传统教育模式。\n\
    - 注重品牌与营销：通过创新的营销手段，如利用社交媒体、与KOL合作等方式，打造独特的品牌形象，吸引用户关注。\n\n### 二、策略型专家（××专家）视角\n\
    \n综上所述，从乔布斯、策略型专家以及创意与人文并重的专家的视角来看，在线教育公司在面对AI发展时，应分别从用户体验、战略规划、情感连接和社会责任等方面入手，以实现更好的发展。\n\
    \n(以上由文心一言生成，内容有删改)\n\n## 二、职业生涯规划：让AI成为你的职场导师\n\n假设你是一名即将毕业的大学生，对自己未来的职业规划充满困惑，也不知道该如何向AI表达自己的困惑，那你可以这样试试。\n\
    \n从现在开始，你是一位苏格拉底式的导师，我是你的学生。你不会直接给出答案或者结果，而是会引导学生思考并一步步得出结论。你会不断调整并拆分问题，以适应学生的理解能力。\n\
    \n好的，我将扮演苏格拉底式的导师与你对话。在接下来的交流中，我将通过提问和对话的方式，引导你深入思考并自行探索答案。请准备好，我们即将开始一场关于知识与智慧的探索之旅。\n\
    \n我想知道自己适合做什么工作。\n\n这是一个非常深刻且重要的问题，了解自己适合做什么工作是人生规划的关键一步。首先，我们可以从探索你的兴趣、技能和价值观入手。\n\
    \n- 1. 兴趣：你对哪些领域或活动特别感兴趣？是艺术、科学、技术、商业、社会服务还是其他方面？兴趣往往能激发我们的热情和动力。\n- 2. 技能：你具备哪些技能？这些技能是在学习、工作或生活中逐渐形成的……\n\
    - 3. 价值观：你重视什么？是成就感、工作与生活的平衡，还是……\n\n现在，让我们进一步思考：\n\n- 你能举出一些你感兴趣的领域或活动吗？\n- 在这些领域或活动中，你觉得自己有哪些独特的技能或优势？\n\
    - 你的这些技能或优势是如何形成的？是源于天赋、教育、经验还是其他因素？\n- 你期望从工作中获得什么？是金钱、地位、认可、挑战还是其他？\n\n通过回答这些问题，你可以逐渐清楚你适合的工作类型。记住，这个过程可能需要一些时间，但它是值得的，因为它将帮助你找到真正热爱并擅长的工作。\n\
    \n我喜欢研究计算机软件的新用法。\n\n很好，喜欢研究计算机软件的新用法是一种非常有趣且充满潜力的兴趣。这显示出你对技术的敏锐洞察力和创新精神。接下来，我们可以进一步探讨这个兴趣如何引导你找到适合的工作。\n\
    \n- 1. 技能评估：既然你喜欢研究计算机软件的新用法，那么你可能已经具备了一定的编程、软件操作或系统分析等方面的技能。考虑一下你在这些方面的具体技能水平，以及你是否愿意继续深入学习和提升。\n\
    - 2. 职业匹配：基于你的兴趣和技能，你可以考虑一些与软件开发、软件测试、软件架构相关的……\n- 3. 行业探索：不同的行业都在使用计算机软件，并且对软件的需求也在不断变化。你可以思考一下……\n\
    - 4. 实践机会：为了更深入地了解自己的兴趣和技能是否与某个职业或行业契合，你可以寻找相关的实践机会……\n- 5. 持续学习：技术行业变化迅速，持续学习是保持竞争力的关键。考虑制订一个学习计划……\n\
    \n最后，我要提醒你的是，找到适合自己的工作是一个逐步探索和尝试的过程。不要害怕失败或尝试新事物，因为每一次尝试都会让你更接近自己的目标。同时，也要保持开放的心态，愿意接受新的想法和机会。\n\
    \n我曾经用Photoshop给别人设计海报，还挣了300元。\n\n这是一个很好的实践经历！你不仅展现了你的兴趣和技能，还成功地将其转化为经济价值。用Photoshop设计海报并赚取报酬，说明你在视觉设计和创意方面有一定实力。\n\
    \n现在，我们可以基于这个经历进一步探讨适合你的工作。\n\n- 1. 平面设计：Photoshop操作能力是平面设计领域的基础。如果你喜欢创作视觉效果，并且擅长将文字、图像和色彩等元素组合成吸引人的设计，那么平面设计可能是一个很好的职业选择。你可以考虑进一步提升自己的设计技能，学习更多的设计软件和技术，以便在这个领域中有更多的发展机会。\n\
    - 2. 广告与传媒：海报设计属于广告和传媒行业。如果你对这个行业感兴趣，并且喜欢将自己的创意与商业需求相结合，那么你可以考虑……\n- 3. 自由职业者：你已经有了一些成功的设计作品和赚取报酬的经验，这为你成为自由职业者提供了良好的基础……\n\
    \n无论你选择哪种工作，都需要不断地学习和提升自己的技能水平。同时，也要保持对新技术和新趋势的敏感度，以便在竞争激烈的市场中保持竞争力……\n\n(以上内容由文心一言生成，内容有删改)\n\
    \n让AI引导你思考，而不是让它直接给你参考答案，你可以进一步了解自己，做出更适合自己的职业或者人生规划。\n\n与上述案例所使用的提问方法效果类似的方式叫作苏格拉底式提问，又称苏格拉底式教学法，是古希腊哲学家苏格拉底的极具代表性的提问方法，即通过一系列有针对性的问题引导对话者进行深入思考，以发现知识、挖掘观点和促进理解。苏格拉底式提问强调质疑、怀疑和反思，追求真实和理性。\n\
    \n苏格拉底式提问的主要特点如下。\n\n### 引导性\n\n通过提问引导对话者思考问题而非直接告诉他们答案。\n\n### 层层递进\n\n问题由浅入深，逐步引导对话者深入探讨话题。\n\
    \n### 提倡反思\n\n鼓励对话者对自己的观点和假设进行反思。\n\n### 逻辑性强\n\n关注论证的一致性和合理性，追求真实的和有根据的知识。\n\n\
    常见的6种苏格拉底式提问如下表所示。\n\n| 类型 | 说明 | 参考指令 |\n|---|---|---|\n| 澄清问题 | 探讨一个问题，明确概念\
    \ | 可不可以举个例子，说明你表达的意思 |\n| 检验假设 | 了解对话内容的真实性 | 你如何证明这个假设 |\n| 理性分析 | 探究背后的原理或者真相\
    \ | 能解释一下原因吗 你是如何得出这一结论的 |\n| 检验观点 | 让AI对其回答进行分析 | 你提出的这个方案有哪些优缺点 |\n| 开阔思路 |\
    \ 引导 AI从不同视角看问题 | 对于这个问题，你觉得其他人可能会怎么看 |\n| 思考后果 | 了解某个假设会带来的后果 | 你觉得你这个假设会有什么结果呢\
    \ |\n\n### 注意\n\n- 1. 可以让AI扮演某一领域的专家，但是要注意，这位专家一定要是名人，否则网上没有相关数据，AI就无法从这位专家的视角给出回答。\n\
    - 2. 角色的数量可以自由更改，如果想要获得更多不同的视角，可以让AI扮演更多不同领域的专家。\n\n## 7. 发散提问：让AI提供多种创意思路\n\n\
    当我们缺乏灵感时，可以让AI帮我们挖掘更多创意和想法；当我们面临复杂问题时，可以让AI帮我们找到更多种可能的解决方案。很多时候，问题的答案不止一种，生活的解有无数个，我们需要掌握主动打破思维局限的提问方法——发散提问。\n\
    \n发散提问是指尽可能从多个角度提出问题，从而获得更多的信息和思路，避免视角单一带来局限性的提问方法。\n\n发散提问本质上是通过提出开放式、非线性的问题，找出解决问题的不同可能性，而非直奔单一答案。使用发散提问可以让AI帮助我们拓展思路、打破常规思维。\n\
    \n好的发散提问通常具备开放性、引导性、探索性等特征，从而帮助我们打破思维局限，探索更多可能。\n\n### 开放性\n\n好的发散提问通常不追求固定的答案或解决方案，不设置过多的限制，而是鼓励AI探索新的可能性。例如，对于“如何改进产品设计”的问题，一个好的发散提问可以是：“如果我们不考虑现有的限制，你会如何设计一个全新的产品来满足用户需求？”\n\
    \n### 引导性\n\n我们可以引导AI按照指定的逻辑和思路进行思考，从而更有效地找到问题的答案。例如，当我们想要提升客户满意度，可以问AI：“要提升客户满意度，我需要从哪些方面入手，比如服务质量、产品性能、售后服务等？在每个方面又可以采取哪些具体措施？”\n\
    \n### 探索性\n\n好的发散提问并非停留在表面，而是能够深入挖掘问题的本质和根源。例如对于“为什么员工满意度下降”的问题，一个好的发散提问可以是：“除了薪酬和福利，还有哪些深层次的原因可能导致员工满意度下降？”\n\
    \n### 注意\n\n发散提问并不是让AI漫无目的地作答，不能因为过于注重发散性而忽略关键提示。\n\n来看几个不同场景下发散提问的使用案例。\n\n###\
    \ 例：技术价值探索\n\n**Before 常规提问**\n\nVR技术在哪些领域创造价值？\n\n**After 发散提问**\n\n除了游戏行业，VR技术还能在哪些领域创造价值？\n\
    \n### 例：商业模式验证\n\n**Before 常规提问**\n\n这个商业模式复制到其他行业可以成功吗？\n\n**After 发散提问**\n\n\
    如果将这个商业模式复制到其他行业，会给行业带来什么变化？\n\n### 应用案例\n\n### 一、创意策划：生成有创意的金点子\n\n在一些需要创意、创新、思考和表达的场景下，非常适合运用发散提问。\n\
    \n公司即将举办年会，请帮我策划至少10个互动性强的节目，无论是唱歌、跳舞、小品还是其他形式都可以，希望能让大家都积极参与。\n\n为了确保公司年会的互动性和趣味性，以下是我为您提出的10个互动性强的节目的建议。\n\
    \n- 1. 团队才艺秀\n\n事先邀请各部门或小组准备一段才艺表演，可以是唱歌、跳舞、小品、魔术等。\n\n设立评委团或由观众投票，选出最佳才艺奖。\n\n\
    - 2. 年度回顾视频互动\n\n制作一段公司年度回顾视频，包含重要事件、员工风采等。\n\n视频中穿插互动问题，观众通过手机答题，答对者有机会获得小礼品。\n\
    \n- 3. 模仿秀大赛\n\n员工模仿名人、同事或流行角色。\n\n观众投票选出最像、最有趣的模仿者。\n\n- 4. 你画我猜接力赛\n\n分组进行，每组第一个人看提示词后画画，下一个人比照着画画，依此类推，最后一个人猜词。\n\
    \n限时完成，猜对最多词的组获胜。\n\n- 5. 即兴喜剧表演\n\n随机抽取观众上台，给出即兴表演的主题或情境。\n\n观众和表演者共同创作一段即兴喜剧。\n\
    \n- 6. 歌舞串烧接力\n\n分组进行，每组轮流上台表演一段歌舞。\n\n表演需包含接力元素，如传递道具、动作接龙等。\n\n- 7. 年度关键词猜谜\n\
    \n准备与公司年度事件相关的关键词或短语，制成谜面。\n\n员工分组猜谜，猜对最多者获胜。\n\n- 8. 时光信箱\n\n设立“时光信箱”，邀请员工写下对公司未来的期望、对同事的祝福或个人的职业规划。\n\
    \n年会结束时收集信件，约定一年后或特定时间开启。\n\n- 9. 互动游戏“谁是卧底”\n\n类似狼人杀游戏，每组中有一名卧底，通过提问和回答找出卧底。\n\
    \n考验员工之间的默契和逻辑推理能力。\n\n- 10. 年终大奖抽奖环节\n\n设立多个奖项，如最佳员工奖、幸运奖等。\n\n通过抽奖软件或实体抽奖箱进行抽奖，激发员工参与热情，活跃现场气氛。\n\
    \n这些节目既有趣味性又有互动性，能够激发员工的参与热情，让年会更加难忘。希望这些建议能对您有所帮助！\n\n(以上内容由文心一言生成)\n\n### 二、教学培训：拓展思路\n\
    \n在教学培训中，教师或培训师不仅要向学生传道、授业、解惑，还需要教会学生如何拓展思路、独立思考。\n\n我是一名专业的PPT培训师，请提供一些课堂上可以使用的发散式问题，这些问题应该能够引导学员深入思考PPT设计和制作过程中的各种可能性，请确保问题具有足够的开放性，避免只有一个正确答案。\n\
    \n以下是一些在PPT培训课堂上可以使用的发散式问题。\n\n### 一、关于整体设计风格\n\n- 1. 如果要为一场科技主题的演讲制作PPT，你能想到哪些独特的设计元素和色彩搭配方案？\n\
    - 2. 想象一下，你正在为一场儿童故事分享会设计PPT，什么样的风格最吸引小朋友的注意力？\n- 3. 在设计PPT时，如何根据不同的受众选择最恰当的整体设计风格？\n\
    \n### 二、关于布局排版\n\n- 1. 对于内容较多的一页PPT，你会采用哪些布局方式来确保信息清晰易读又不失美观？\n- 2. 假如你只有一张很有冲击力的图片，你会如何围绕这张图片进行页面布局，以突出其重要性？\n\
    - 3. 思考一下：不同的布局排版对观众的视觉引导会产生怎样的影响？\n\n### 三、关于图表运用\n\n(以上内容由豆包生成，内容有删改)\n\n###\
    \ 注意\n\n- 1. AI生成的创意可能是天马行空的，因此我们需要结合实际情况进行筛选。\n- 2. 当AI生成的内容无法满足我们的需求时，我们不妨试试向它提供更多情境或背景信息，多次引导AI反复生成回答，来获取满意的内容。\n\
    \n## 8. 摘要提问：快速压缩长篇信息\n\n有时我们需要阅读新闻报道、学术论文等资料，并快速理解核心信息。\n\n有时领导发来大段工作任务和要求，自己却抓不住重点。\n\
    \n有时我们需要快速掌握一部小说的关键剧情。\n\n在这些情况下，我们可以使用摘要提问，让AI从复杂的文本中提取出核心观点、关键事实或重要结论，从而让我们无须逐字逐句浏览文本就能快速了解文本内容，大大节省时间，提高信息获取的效率。\n\
    \n摘要提问是一种让AI阅读长文本内容后，提供简短摘要的提问方法。\n\n好的摘要提问通常具备明确性、针对性和结构性等特征，能够引导AI准确生成摘要内容，达到高效获取关键信息的效果。\n\
    \n进行摘要提问时，遵循以下原则，可以更加高效地获取想要的信息。\n\n### 明确提问目的\n\n明确你想要通过摘要提问达到什么目的，比如“我想要快速了解这篇文章的内容”或是“请帮我从这段话中提取××信息”。明确目的的有助于你更精准地提问。\n\
    \n### 清晰地描述原文内容\n\n在提问时，尽可能清晰地描述你想要AI摘要的原文内容。如果原文篇幅不长，可以直接把原文发送给AI；如果原文很长，可以指出关键信息，比如“某本书的某个章节”或者“某人在某日于某地发表的演讲”，若能同时给AI提供相应的DOCX/PDF/TXT格式的原文，将有助于AI更准确地理解并生成摘要。\n\
    \n### 指明篇幅和详略程度\n\n明确你对摘要的篇幅和详略程度的要求，如“请生成一个不超过200字的简短摘要”，或是“请分点提取核心内容”。\n\n###\
