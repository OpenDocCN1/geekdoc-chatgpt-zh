    # 1. 项目沟通：指令式提问+归纳提问


    当我们需要借助AI来明确目标、总结关键信息时，可以使用指令式提问来明确任务的目标和范围，使用归纳提问来提炼核心要点。这种组合方式能够快速明确方向，便于执行且过程可控。


    # 案例背景


    你是一家科技公司的项目经理，负责一个跨部门的AI项目。虽然已制定了清晰的项目目标和关键成果（OKR），但由于团队成员来自不同部门，沟通风格与处理方式存在差异，团队成员对任务的理解不一致，执行效率不高。你希望借助AI来梳理项目沟通中的关键要素，帮助团队成员就目标达成共识。


    # 组合提问


    指令式提问（明确目标和范围）→ 归纳提问（总结关键信息）


    # 提问示例 ?


