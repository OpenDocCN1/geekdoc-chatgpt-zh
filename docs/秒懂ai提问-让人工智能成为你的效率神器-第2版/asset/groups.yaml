    ## 16. 复合型提问：多维度获取信息


    某杂志刊登了一篇关于某个科技公司发布最新产品的报道，你需要向一位看过这篇报道的同事打听产品的相关信息。应该如何提问呢？


    **提问一：这篇报道提到了什么最新产品？**


    如果这么问，你能获取的信息非常有限。


    **提问二：这篇报道提到了哪个科技公司的最新产品？产品的名称是什么？（基本信息维度）**


    新产品具备哪些独特的功能或技术特点？（技术细节维度）


    这个新产品预计会对市场产生怎样的影响？是否有竞争对手？（市场影响维度）


    报道中是否提到了用户对新产品的反馈或评价？（用户体验维度）


    提问二能确保你全面了解那篇报道的信息。相比之下，提问一为单一问题，无法涵盖更多维度的信息。


    在这个场景里，提问二使用了复合型提问，提问者从多维度入手，提出更具体的问题，从而获得更全面和更准确的答案。


    复合型提问是提问者通过一系列相互关联且层次递进的问题，引导AI从多个维度深入探究某一主题或事件，以获取全面、详细且深入的回答的提问方式。


    好的复合型提问通常由一系列精心构建的问题组成，它们之间逻辑清晰、相互支持，能够引导AI系统地回答，从而提供全面而深入的见解。


    那么，如何进行复合型提问呢？以下是一些具体的技巧。 ☑


    ## 确定主题或事件


    首先明确你想要探究的主题或事件，作为提问的出发点。例如，你想要了解新能源汽车的市场趋势。 ☑


    ## 构建问题链


    从基本信息开始，逐步深入技术细节、市场影响、用户体验等多个维度。看一下这个例子。


    基本信息： “当前新能源汽车市场的主要参与者有哪些？”


    技术细节： “这些新能源汽车品牌各自采用了哪些核心技术来提升续航能力和驾驶体验？”


    市场影响： “新能源汽车的普及对传统汽车行业产生了哪些影响？市场份额有何变化？”


    用户体验： “消费者对新能源汽车的满意度如何？有哪些常见的问题和改进建议？” 😊


    ## 保持逻辑清晰


    确保问题之间逻辑清晰，前一个问题的答案能为后一个问题提供背景信息。这样可以使回答者更容易理解和回答。 😊


    ## 引导深入探讨


    通过问题的设计，引导回答者不仅回答表面现象，还探讨背后的原因、机制和影响。例如，可以询问：“为什么新能源汽车的续航能力成为消费者关注的焦点？这对汽车制造商提出了哪些挑战？”
    😊


    ## 结合具体情景


    如果可能，将问题与实际情境相结合，以便更具体地讨论问题。例如，可以询问：“以×××为例，它是如何通过技术创新和品牌建设在新能源汽车市场中脱颖而出的？” 😊


    ## 鼓励开放思考


    在提问过程中，可以适当加入一些开放性问题，鼓励回答者自由发挥和深入思考。例如：“你认为未来新能源汽车市场的发展趋势会是怎样的？有哪些潜在的机会和挑战？” 😊


    ## 总结与反馈


    在提问结束后，可以请回答者进行简要总结，并询问是否有其他相关问题或需要进一步探讨的问题。这样不仅可以确保信息的完整性，还可以促进双方的深入交流和理解。


    来看几个不同场景下复合型提问的使用案例。


    ## 例：评价电影


    **常规提问**


    《星际穿越》这部电影怎么样？


    **复合型提问**


    《星际穿越》得到了哪些积极的评价？（影片评价维度）


    《星际穿越》的剧情有何特点？是否有悬疑元素？（剧情维度）


