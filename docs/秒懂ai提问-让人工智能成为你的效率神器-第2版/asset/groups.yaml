    # 7. 发散提问：让AI提供多种创意思路


    当我们缺乏灵感时，可以让AI帮我们挖掘更多创意和想法；当我们面临复杂问题时，可以让AI帮我们找到更多种可能的解决方案。很多时候，问题的答案不止一种，生活的解有无数个，我们需要掌握主动打破思维局限的提问方法——发散提问。


    发散提问是指尽可能从多个角度提出问题，从而获得更多的信息和思路，避免视角单一带来局限性的提问方法。


    发散提问本质上是通过提出开放式、非线性的问题，找出解决问题的不同可能性，而非直奔单一答案。使用发散提问可以让AI帮助我们拓展思路、打破常规思维。


    好的发散提问通常具备开放性、引导性、探索性等特征，从而帮助我们打破思维局限，探索更多可能。


    # 开放性


    好的发散提问通常不追求固定的答案或解决方案，不设置过多的限制，而是鼓励AI探索新的可能性。例如，对于“如何改进产品设计”的问题，一个好的发散提问可以是：“如果我们不考虑现有的限制，你会如何设计一个全新的产品来满足用户需求？”


    # 引导性


    我们可以引导AI按照指定的逻辑和思路进行思考，从而更有效地找到问题的答案。例如，当我们想要提升客户满意度，可以问AI：“要提升客户满意度，我需要从哪些方面入手，比如服务质量、产品性能、售后服务等？在每个方面又可以采取哪些具体措施？”


    # 探索性


    好的发散提问并非停留在表面，而是能够深入挖掘问题的本质和根源。例如对于“为什么员工满意度下降”的问题，一个好的发散提问可以是：“除了薪酬和福利，还有哪些深层次的原因可能导致员工满意度下降？”


    # 注意'
  - '[PAGE 53]


    发散提问并不是让AI漫无目的地作答，不能因为过于注重发散性而忽略关键提示。


    来看几个不同场景下发散提问的使用案例。


