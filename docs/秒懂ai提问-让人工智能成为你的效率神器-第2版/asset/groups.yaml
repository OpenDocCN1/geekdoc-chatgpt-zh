    ## 9. 归纳提问：对信息快速分组


    请试着代入一下这个场景，你错过了公司周会，但想了解会议内容，以便做本周计划，那么你准备怎么向参会的下属询问周会信息？


    ### 提问一：小王，今天的会议有什么内容？


    小王听你这么问，估计会从头到尾将会议流程复述一遍：首先，市场部的李经理说……然后，销售部的刘主管说……最后，研发部的王主任说……


    ### 提问二：小王，今天的会议上，市场部、销售部、研发部汇报的本周工作重点分别是什么？关于月底大型活动的方案，大家最终选了哪个版本？我们部门有没有新增的需要跟进的事项？


    如果这么问，小王就会根据你的问题自动将繁杂的会议内容进行分类归纳，让你接收有效信息。


    很显然，在这个场景里，提问二有效地引导对方将繁杂的信息进行归纳，筛除无效信息，整理出有效信息，并且根据提问者的个性化需求进一步分类提取，所以提问者得到的答案会更清晰、准确、简洁，双方的沟通会更顺畅、高效。


    其实在这个场景里，你可以将小王看作是AI，而你作为提问者，只有掌握归纳提问的技巧，才能够获得想要的答案。


    归纳提问是指通过提问要求AI从一些相关的事实中找出它们之间的共性或规律，然后总结出结论的提问方法。


    好的归纳提问通常目标明确、针对性强、结构清晰、考虑上下文，并且充分结合个人背景和需求。


    那么，如何通过归纳来进行提问呢？以下是一些具体的技巧。


    ### 明确归纳目标


    明确归纳的目的、范围和期望的输出形式。这有助于AI聚焦于关键信息，避免信息过载或者混乱。比如你在写年度市场报告时，明确报告中需要归纳的关键信息（如市场份额、竞争对手动态、消费者趋势等），并设定报告的结构和要点。


    ### 提取关键信息


    从文本、邮件、会议记录等来源中提取与归纳目标相关的关键信息，有助于获得更精准的答案。比如客户服务经理在处理客户投诉时，会收集客户邮件和聊天记录，提取出关键投诉、客户情绪状态和历史处理记录。这些信息可以帮助经理快速了解问题全貌，制定更有效的解决方案。


    ### 巧用分类与整理


    可以按照按主题、时间、优先级等维度进行分类和整理，进一步提升信息清晰度。比如项目经理在管理多个项目时，先对项目任务、资源和风险进行分类和整理，然后根据任务性质、截止日期和优先级分配任务给团队成员，并生成项目报告，从而更好地把握项目进度和风险。


    ### 重视比较与综合


    对分类整理后的信息进行深入比较和综合，识别出信息之间的联系，为决策提供有力支持。比如产品经理在开发新产品时，需要对竞品信息进行收集和分析，不仅要了解竞品的功能、价格、用户评价等基本信息，还要通过比较和综合分析，识别出市场缺口和差异化竞争优势，为产品定位和策略制定提供依据。


    常用的用于归纳提问的关键词和短语如下。


    - (1) 表示总结：总共、归纳、总结、概括、综合、简述、总体、总体来说、总的来说、大体上、大致上等。


    - (2) 表示分类：分为、分类、种类、类别、属于哪一类、哪些是、哪些属于等。


    - (3) 表示比较：相同、相似、相对、比较、对比、比照、相对而言、比如、和……相比等。


    - (4) 表示举例：例如、比如、举个例子、举例来说、以……为例、如、如下等。


    - (5) 展示细节：具体、细节、详细、具体来说、详细说明、详细阐述等。


    来看几个不同场景下归纳提问的使用案例。


    ### 例：团队管理


    ### 非归纳提问


    请提出改善团队氛围的建议。


    ### 归纳提问


    请从沟通机制、激励机制、团队文化和工作环境四个方面，归纳出改善团队氛围的具体措施，并说明预期效果。


    ### 例：项目管理


    ### 非归纳提问


    请告诉我“公司内部网络升级”项目的进度。


    ### 归纳提问


    请概述“公司内部网络升级”项目的主要进度，并指出可能影响项目按时完成的所有潜在风险。同时，提供团队为减小这些风险所能采取的预防措施。


