    ## 本章要点


    - 代表人工智能决策机会的不仅是规则本身，还有规则为隐藏不确定性而搭建的结构和框架，这些不确定性导致我们在采用规则时产生浪费并效率低下。


    - 我们的例子是机场，在这里为隐藏不确定性，建立了昂贵的结构和框架。不确定性的主要来源是交通和安全引起的潜在延误。豪华的新机场旨在帮助人们忘记他们是在在规则下行事的，该规则迫使他们早在预定出发时间前就到达机场。


    - 在温室中，利用人工智能对虫害的预测可以增强种植者预防虫害的能力。这是一个点解决方案。如果预测虫害的人工智能变得足够精准，那么人工智能可以实现系统变革，而不仅是用作一个点解决方案。温室的整个结构设计和工作流程都受虫害风险的影响。有了更好的预测，农民可以种植不同的（包括易受害虫侵袭的）农作物，建造更大的温室，并寻求新的节能策略。


    ## 第六章


    ## 规则是黏合剂


    外科医生和医学作家阿图·葛文德非常喜欢使用清单。他在《清单革命：如何持续、正确、安全地把事情做好》中称赞清单的目的只有一个，即向技术精湛的超级专家解释，勾选清单远非易事，它是在越来越复杂的环境中完成工作的必要步骤。


    清单是现代组织生活的基本工具。当美国陆军在寻找新的轰炸机时，最初拒绝了波音公司的 299 型飞机，尽管它比麦克唐纳·道格拉斯公司的替代型号更好，能携带 5
    倍的有效载荷、飞得更快、飞行距离也是其两倍，但它坠毁过。那次坠机并非设计问题，而是飞行员的失误。但这说明它是一架难以驾驶的飞机。


    最终，美国陆军还是决定购买几架 299 型飞机。但正如葛文德所指出的，美国陆军没有给飞行员提供更多培训，而是做了一件更简单的事情：它为飞行员制定了一份包括起飞和降落等各种活动所需步骤的清单。


    清单的存在表明航空技术取得了巨大进步。在飞行前期，将飞机升空可能会让飞行员感到紧张，但步骤并不复杂。就像司机从车库向外倒车时不会使用清单一样，飞行员在起飞时也不会使用清单。但这种新型飞机过于复杂，不管飞行员多么有经验，都不能仅仅依赖记忆驾驶。


    有了清单，飞行员继续驾驶 299 型飞机，总共飞行了 180 万英里，没有发生一起事故。美国陆军最终订购了近 13 000 架这种飞机，并将其命名为 B-17。¹


    葛文德有力地辩称，现代医学如此复杂，它也可以从相同的方法中受益。他知道要说服别人会很难。毕竟，顶级外科医生仍然抵制洗手和消毒。² 但是清单已经被广泛应用于各种复杂环境，从建筑工地到芝士蛋糕工厂。如果清单能够拯救生命，那么医生就应该接受它。


    我们不会就清单的价值与葛文德争论，但会对使用它的人们表示赞同。清单的存在是因为不确定性。复杂系统中有许多相互关联的部分，很多人在其中执行任务以保证系统的正常运转，因此，清单不仅是表明完成某项工作的指标，也是规则的体现，还是遵守规则的需要。它们的存在是为了确保可靠性和减少失误。如果让专家基于自己的观察做出决策，那么这会给其他人带来问题和不确定性。


    大型企业都有清单。它们还有类似作用的标准操作规程，如第四章所述。标准操作规程是一本大型手册，列出了人们需要遵守的所有步骤，包括核对任务是否完成。标准操作规程使复杂的组织能正常运转。但我们必须认识到它们代表了什么。它们是需要遵守的规则，而不是需要做出的决策。


    标准操作规程和清单是隐藏的不确定性的代表，这些不确定性在组织内部产生了无数条规则。对于每一条规则，都有导致其出现的不确定性。对于每一条规则，我们都可以问这样的问题：如果有了人工智能预测，我们是否可以将规则转化为决策，并将其从标准操作规程手册中删除以提高生产力呢？


    ## 人皆不同


    规则要求每个人都做同样的事情，仿佛人们是相同的。但其实人和人是不一样的，这也许是销售的基本经验。因此，销售人员试图将人分成不同的群体，并将产品定位于那些可能对其感兴趣的群体。


    销售人员也可能对待所有人都一样，因为他们缺乏信息。他们一旦掌握了信息，就将提供个性化的产品和服务。销售人员可以从遵守一视同仁的规则转变为自己做决策，从而在正确的时间向正确的人提供正确的产品。


    无线电广播一直都遵守规则，电台聘请的 DJ（流行音乐播放员）为所有听众播放相同的歌曲；流媒体音乐服务如 Spotify、苹果音乐和潘多拉电台则允许用户创建个人定制歌单。


    不过，从个人定制歌单中创造价值存在哪些挑战呢？潘多拉电台的研究人员戴维·赖利和张鸿凯在研究公司的规则时提出了这个问题。尽管歌单是个人定制的，但该公司的运营方式仍然受到规则的限制。潘多拉电台采用的是免费增值模式。一些用户支付费用，享受无广告的收听体验；其他人只要每小时收到一定数量的广告，就可以免费收听。


    赖利和张鸿凯与华盛顿大学的教授阿里·戈利合作，意识到他们可以将人工智能应用于实验数据，以确定人们对广告的厌恶程度和对服务的喜爱程度。人工智能提供了个性化的预测，使赖利等人能够评估人们对广告厌恶程度的差异，而不仅是看到人们对其厌恶程度的平均值。有了这些信息，他们不再需要遵守广告投放的规则。相反，一些人可以收到更多广告，而其他人则几乎不会收到。³
    通过个性化的广告数量，他们可以大幅增加利润。人工智能不仅可以预测出如果每小时广告数量减少，哪些用户会在潘多拉电台上听的时间更长，还可以预测出哪些客户可能会转向付费版本。


    在掌握这些信息后，电台就无须遵守对每个人推送相同数量广告的规则了。如果减少每小时广告数量，一些用户使用潘多拉电台的时间会更长，那么电台就向这些用户推送更少的广告；对于那些可能转向付费版本的用户，电台则可以推送更多广告。潘多拉电台的研究部门展示了人工智能如何实现新的决策。


    但这并不是一件轻松的事情。扩大广告容量需要找到广告商。艾利、赖利和张鸿凯预计只有 2/3 的广告时段会被填满。问题在于，他们需要新的广告商，以避免一遍又一遍地向同一客户推送相同的广告。⁴
    要想成功实施，就需要一个新的广告销售策略。


    此外，电台还需要了解用户的反应。人工智能最有利可图的一点是，向那些在免费版本和付费版本之间犹豫不决的用户推送更多广告。通过降低免费版本的质量，这些用户可能就会转向付费版本。然而，如果潘多拉电台这样使用用户的数据，用户会感到不满。因此，这种策略有可能会让用户不再使用潘多拉电台。


    这些限制意味着潘多拉电台尚未利用人工智能实施这项操作。它仍然使用规则来确定推送多少广告。构建人工智能是放弃规则的第一步。为了实现一些决策，流程仍需改变。


    ## 又一块墙砖


    教育里有各种规则。座位安排、行为规范、学习内容，几乎无所不包。本书作者之一阿维从他孩子的学校收到了一份长达 59 页的《家长政策与实践指南》。该指南内容包括与过敏、虱子、受伤和免疫相关的健康安全规则，还包括家庭作业政策、庆祝生日的方式、手机使用规则、接送规定以及分班政策。这还只是给家长看的！


    这些规则有其目的。它们确保了一个安全高效的教育系统。正如美剧《宋飞正传》中的科斯莫·克雷默所说：“规则就是规则。不可否认，没有规矩，不成方圆。”⁵


    当然，规则也可能会过于繁多。人们对教育导致同质化的担忧由来已久。1859 年，约翰·斯图亚特·穆勒在《论自由》一书中写道：“全面的国家教育只是让人们变得完全相同的手段。”⁶


    教育工作者非常清楚规则与灵活性之间的矛盾。很多教育文件对此写明并试图解决这一问题。《纽约州幼儿学习标准》强调：


    标准的目的不是在任何情况下为所有儿童规定一系列按部就班的课程，而是通过具有个性化和差异化、适应性的、与文化和语言相关的、基于环境的教学来阐明儿童的学习和能力预期。虽然我们为所有儿童制定了相同的学习目标，但达成目标的方式会根据每个孩子的个体差异进行调整。⁷


    因此，每个学生都有相同的标准，但得到的教育是不同的。这是一个美好而具有挑战性的愿景。最好的教师能够因材施教，但大多数教师可能会觉得这非常有挑战性。从全球的角度来看，情况更加糟糕。高收入国家每年每个孩子的教育开支达数千美元，而许多低收入国家每年每个孩子只有
    50 美元的教育开支。在资源如此匮乏的情况下，人们很难摆脱规则。⁸


    创业教育是一个不错的开始。世界银行等援助机构和世界各国政府每年在发展中国家培训约 400 万潜在的和现有的企业家，其投入超过 10 亿美元。⁹ 许多培训计划致力于改善商业实践和提高利润，但它们的成本很高，回报也不一定明朗。线上培训大有可为，但不能千篇一律。“一刀切”式的广告宣传效果甚微。其中一个重要的经验是，高度个性化的培训效果最好，但挑战在于如何大规模提供个性化教育。


    经济学家斯科茨和孙钜云认为人工智能可以提供帮助。10 他们与一家大型电子商务平台合作，为数十万新卖家提供创业培训。培训项目包含数十个可以学习的模块，重点是建立网站、营销策略和客户服务。例如，培训既会提供如何最佳描述产品的清单，以便客户知道他们在买什么，也会侧重于搜索引擎优化和关键词选择。


    并非所有模块都适用于所有卖家，而且新卖家可能不知道哪种培训对他们有帮助。人工智能实现了个性化。它首先收集了卖家的实际运营和产品的数据，并制定了培训顺序，然后向卖家推荐相应的模块，卖家再将这些模块付诸实践。这意味着数十万卖家获得了个性化的创业培训。人工智能不再遵守每个卖家接收相同信息的规则，而是为哪个企业家接受哪种培训做出新的抉择。


    该项目使用随机对照试验进行，以便测量其有效性。在该平台上有 800 万家新企业，其中 200 万家获得了培训机会，约有 50 万家接受了培训。接受培训的企业收入增长了
    6.6%。一年内，该项目使卖家的收入增加了约 600 万美元。这听起来可能不算多：每家企业每年增加 12 美元。但这是以 200 美元的总收入为基础计算的。一个仅靠人类培训师的个性化培训项目是不可能产生经济效益的。有了人工智能，就可以在大规模范围内决定将哪种培训提供给哪个企业家，同时覆盖数十万家企业。人工智能在规则之上做出决策，并创造了规模化的价值。


    ## 摆脱规则


    当规则存在已久时，就很难看到它们背后的系统。由于规则是可靠的，各种各样的规则和程序可以黏合在一起。如果部分发生变化，其余就必须同时做出改变。


    在潘多拉电台的免费版本中，每个用户都会收到相同数量的广告。由广告支持的媒体一般都是这样的。网络电视台每 30 分钟就会播放 8 分钟的广告，这是提高网络收入的规则。围绕这一规则，还开发出了各种其他程序。节目被设计成
    22 分钟或 44 分钟，这意味着编剧需要以同样的长度编写每一集节目，故事进展到应播放广告时要自然停顿。这个规则固定在了此系统上。


    对于内容，YouTube（优兔）提供了另一个系统设计的例子。与网络电视不同，YouTube 内容创作者可以创建任意长度的内容。该系统的人工智能可以预测哪些观众对哪些内容最感兴趣。驱动搜索引擎和推荐引擎的人工智能使观众能够在看似无限的选择中找到合适的内容。此外，人工智能还可以预测哪些用户对哪些广告最感兴趣，重要的是，这种预测能力在允许不同用户查看不同内容的系统中更有价值。即使网络电视有能够产生类似预测的人工智能，其价值也会大大降低，因为其系统会迫使每个观众观看相同的内容。因此，它最多只能预测哪个广告最能吸引大多数观众。


    换句话说，预测观众被什么样的内容和广告吸引的人工智能，在 YouTube 系统中比在网络电视系统中更有价值。虽然人工智能直接让观众在海量选择中发现想看的内容，并匹配上广告，但它间接地让内容长度变得灵活，因为发现内容和插入广告的办法解决了内容、广告和时间的无限组合问题，而对于网络电视，内容长度的灵活度是不好把握的。


    在学校系统中，同一年级的学生学习相同的内容，因为课程是固定的。“学生按照年龄分批接受教育，仿佛他们最重要的共同点就是他们的出生日期。” 例如，我们所在的加拿大安大略省，几乎所有在
    2009 年出生的学生都在 2015 年上一年级，在 2023 年上高中。这些规则是为了应对学生在学业和社交方面应达到水平的不确定性。这些规则反过来又在一个系统中黏合在一起：教师通过培训来满足有限且多样的学习需求；对落后学生给予适度的额外帮助和资源。此外，在高中阶段，那些没有达到同龄人标准的学生，会被提供一些名义上的课程，包括替代学校、勤工俭学项目和获得高中同等学历证书的方式。


    可以预测每个学生下一步最佳学习内容的人工智能将让教育个性化，使那些在某个板块学得很快的学生在感到厌倦前进入新的内容，同时使需要在一个板块进行更多练习的学生有额外的时间和练习以提高他们的能力，而不用马上学习新的内容。作为一个点解决方案，这种人工智能在一定程度上可以在现有学校系统中帮助学生学习。但其影响力有限，因为学生一旦完成了他们以年龄为基础的本年级课程，这一年的学习就完成了，或者需要在教师有限的帮助下继续进一步学习，而教师通常只接受针对特定年级（如初中数学）的培训。在现有系统中，这个问题在高年级阶段会变得越来越严重，因为随着时间的推移，在某一学科领域内学习速度较快和较慢学生之间的差距会越来越大。为了帮助他们的学生，教师需要掌握不断增多的教学内容。


    我们来想象一下，学生按照传统分班的形式在学校中进步（生物学的节奏调控着他们的身体发育和社交活动），但许多不同的辅导员和教师会根据他们的个体学习需求来提供帮助。学生与辅导员和教师的合作不再取决于年龄，而是取决于学生在某一学科领域的研究和能力。在这个新系统中，人工智能的影响力将比在现有系统中相同人工智能的影响力大得多，因为每个学生都可以接受针对其学习需求和风格的个性化教育。在某一学科上学得快而在其他学科上学得慢的学生可以得到照顾。对于需要专门学习特定技能的学生，将有专攻该领域的教师来帮助他们。教师不需要选择对大多数学生最有帮助的教学方式。那些擅长帮助学生克服阅读障碍的教师，以及擅长帮助学生在数学竞赛中大放异彩的教师，将把所有时间用于他们最擅长的领域。


    22 分钟的节目制作和基于年龄的课程等规则是为了应对不确定性而制定的。随后，各种辅助措施被开发出来，以优化系统的性能。虽然旁观者看不到这些规则，但它们成了维持系统完整的黏合剂。因此，虽然引入一种能够将规则转化为决策的人工智能似乎很有吸引力，但其影响力有限，因为它所取代的规则与系统的其他要素是紧密相连的。


    将能够预测下一步最佳学习内容的人工智能应用于现有学校系统中，其影响力是有限的，因为基于年龄的课程规则和每班一个教师的制度是当前教育系统的基石，特别是在小学阶段。相比之下，使用完全相同的人工智能，并将其嵌入一个新的系统中，利用人工智能的个性化内容和节奏，并与个性化的讨论、小组项目和教师帮助相结合将需要更灵活地分配辅导员和教师，并对教育工作者进行培训，这可能会对教育以及个人成长和发展产生更大的影响。


    换句话说，基于年龄的课程规则是维持现代教育系统的黏合剂，因此，让学习个性化的人工智能在该系统中产生的好处是有限的。释放教育个性化人工智能潜力的主要挑战不在于构建预测模型，而在于将教育从基于年龄的课程规则中解放出来，正是该规则将系统紧密结合在一起的。


    ## 本章要点


    - 与标准操作规程一样，清单是规则及人们遵守规则的体现。它们存在的目的是确保可靠性并减少失误。还有一种选择是让人们根据自己的观察做出决策。尽管从规则转向决策可能会让行动变得更灵活，但也可能给其他人造成困扰并带来不确定性。


    - 规则在系统中黏合在一起。这就是为什么很难利用人工智能做决策以替换单个规则。因此，在通常情况下，一种非常强大的人工智能只会增加边际价值，因为它被引入一个系统中，在这里许多部分都被设计为用来适应规则并抵制变革。它们相互依赖——黏合在一起。


    - 本章的例子是让教育个性化的人工智能，它为学习者预测下一步最佳学习内容。将人工智能引入现有学校会扼杀其好处。相比之下，将完全相同的人工智能嵌入一个利用个性化的（而不是基于年龄的）讨论、小组项目和教师帮助的新系统中，很可能会对教育以及个人成长和发展产生更大的影响。若想要释放让教育个性化的人工智能潜力，其主要挑战不在于构建预测模型，而在于将教育从基于年龄的课程规则中解放出来，该规则目前将系统紧密结合在一起。


    ## 第三部分


    ## 系统


    ## 第七章


    ## 黏合系统与灵活系统


    人工智能本可以保护我们免受新冠病毒的侵害，但它没有做到。因为面对不确定性，许多国家遵守了基于规则而非决策的公共卫生程序。我们已经注意到，人工智能预测有潜力从规则转向决策。因此，新冠肺炎疫情是我们讨论人工智能如何促进这种变革的重要起点。


    人工智能没有保护我们免受新冠病毒的侵害，这并不意味着人工智能还没有准备好，而是我们还没有准备好。对于突发疫情，需要有一系列决策来维持经济的正常运转，但在许多国家，公共卫生部门制定的传统规则是无法适应这类决策的。不过，也有一些例外。我们描述了其中一个例子，一个由少数大型企业组成的小组创建了一个创新平台，目的就是使系统更加灵活。这将允许系统在不确定的情况下进行决策，以防止在严苛的规则下，忽视信息而导致停产。


    ## 最昂贵的规则成本


    现在我们都很熟悉新冠肺炎疫情防控期间健康所面临的风险。2021 年 1 月，约有 900 万美国人感染了新冠病毒。对这些人来说，感染新冠病毒是一个严重的健康问题。然而，对其他
    3.2 亿美国人来说，新冠病毒并不是一个健康问题。他们既没有生病，也没有传染性。但是，许多人在工作、学习和娱乐方面仍然受到了严重影响。原因并非健康问题，而是预测问题。人们缺乏信息来预测哪些人具有传染性并可能将病毒传染给他人。


    公共卫生部门传达的信息是，只要认为其他人同样具有传染性和危险性，就能够保证自己的安全。对于那些在人与人之间传播的传染病来说，如果你不知道谁具有传染性，那么与他人的接触就会变得更加危险。这就是为什么在新冠肺炎疫情防控期间我们要与他人保持距离，这是最简单的保护自己的方法。


