    人工智能本可以保护我们免受新冠病毒的侵害，但它没有做到。因为面对不确定性，许多国家遵守了基于规则而非决策的公共卫生程序。我们已经注意到，人工智能预测有潜力从规则转向决策。因此，新冠肺炎疫情是我们讨论人工智能如何促进这种变革的重要起点。


    人工智能没有保护我们免受新冠病毒的侵害，这并不意味着人工智能还没有准备好，而是我们还没有准备好。对于突发疫情，需要有一系列决策来维持经济的正常运转，但在许多国家，公共卫生部门制定的传统规则是无法适应这类决策的。不过，也有一些例外。我们描述了其中一个例子，一个由少数大型企业组成的小组创建了一个创新平台，目的就是使系统更加灵活。这将允许系统在不确定的情况下进行决策，以防止在严苛的规则下，忽视信息而导致停产。


    # 最昂贵的规则成本


    现在我们都很熟悉新冠肺炎疫情防控期间健康所面临的风险。2021 年 1 月，约有 900 万美国人感染了新冠病毒。''对这些人来说，'
  - '[PAGE 103]


    感染新冠病毒是一个严重的健康问题。然而，对其他 3.2 亿美国人来说，新冠病毒并不是一个健康问题。他们既没有生病，也没有传染性。但是，许多人在工作、学习和娱乐方面仍然受到了严重影响。原因并非健康问题，而是预测问题。人们缺乏信息来预测哪些人具有传染性并可能将病毒传染给他人。


    公共卫生部门传达的信息是，只要认为其他人同样具有传染性和危险性，就能够保证自己的安全。对于那些在人与人之间传播的传染病来说，如果你不知道谁具有传染性，那么与他人的接触就会变得更加危险。这就是为什么在新冠肺炎疫情防控期间我们要与他人保持距离，这是最简单的保护自己的方法。


    让我们从决策树的角度来考虑这个问题，我们要决定是否与他人隔离或接触（见图 7-1）。如果你选择与他人隔离，你就不会传播病毒，但必须与他人保持距离，这对你个人来说是有成本的。如果你选择与他人接触，那么结果就取决于你是否被感染。如果你被感染，你就可能会传播病毒；如果没有，那么你就继续正常生活。


    大多数人没有传染性会导致一个问题，即如果你目前感染了新冠病毒，那么你比没有感染的人更具危险性。换句话说，如果我们知道谁被感染了，谁没有被感染，我们就可以采取不同的措施。我们可以远离被感染者，和那些未被感染的人正常交流。这就是疫情中的核心预测问题：如果我们知道谁具有传染性并将他们与其他人隔离，那么我们就可以避免疫情造成的巨大代价。²
    这样做不仅可以让生活保持正常，还可以通过打破传播链条来控制疫情。问题在于，我们需要信息来将保持社交距离从规则转化为决策，而解决不确定性所需的信息意味着我们面临一个预测问题。'
