    5% 的通勤者在那次经历后改变了他们的通勤习惯。⁷ 那些认为地铁线路图（通常会用艺术化的方式来表示路线）已经在最大程度上失真的人，是最有可能去改变通勤习惯的，因为如果按照地铁线路图的字面介绍去对照，人们就会发现图上车站之间的距离与实际车站之间的距离非常不符。据估计，那些改变了通勤习惯的人每天节省了至少
