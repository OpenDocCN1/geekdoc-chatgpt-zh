    然而，我们也可以从另一个角度来看待人工智能将如何改变我们的工作生活和生产方式。斯坦福大学教授蒂莫西·布雷斯纳汉认为，人工智能的潜力可以被解构为可执行任务，但这个过程忽略了曾经推动新技术被广泛采用的原因：系统变革。


    布雷斯纳汉认为，我们已经在那些积极采用人工智能的地方看到了这一点，如亚马逊、谷歌、脸书和奈飞：


    任务级别的替代在这些人工智能技术应用中没有发挥任何作用。这些非常有价值的早期应用，并非劳动力在执行任务后被资本取代的应用。人们之所以关注任务级别的替代，并不是因为它会发生，而是因为通用人工智能的定义包括“通常由人类完成的任务”。在通用人工智能实现商业化之前（在可预见的未来不太可能），应该专注于分析实际人工智能技术的能力和应用。虽然未来可能会发生一些任务级别的替代，但这与人工智能技术的价值主张无关。


    领先科技公司的人工智能并不是示范性的项目。这些人工智能包括创造数十亿美元收入的大规模生产系统。这些系统不是由一个个任务构建的，其中有一些涉及人工智能。相反，大型科技公司构建了全新的系统。


    人工智能的成功采用体现了我们所说的系统思维。与任务思维形成对比的是，系统思维看到了人工智能的更大潜力，并认识到为了产生真正的价值，包括机器预测和人类在内的决策系统都将需要被重组和构建。这种情况已经在一些地方出现了，但历史告诉我们，对于刚进入某个行业的新企业来说，实施系统变革以利用新的通用技术（如人工智能预测）要比成熟企业更容易。虽然汽车比马好，但汽车

