    基于这一认识，我们与流行病学家劳拉·罗塞拉、政治科学家贾尼斯·斯坦因和创新颠覆实验室的执行董事索尼娅·塞尼克合作，设计并帮助企业实施了一个快速检测项目，以确保工作场所安全开放。⁹


    我们的设计是定期对工人进行检测，让检测结果呈阳性的工人待在家中，而其他人可以去上班，因为他们知道其同事最近的检测结果呈阴性。预测工具是可行的，而且计划似乎很容易实施。这将使那些没有关闭的重要工作场所更加安全，随着时间的推移，经济也会开始重新运转。


    然而，我们很快了解到，预测工具只是其中较容易的部分。该系统由许多规则黏合在一起，这些规则对基于信息的决策很不利。例如，在收集人们的健康信息方面有隐私规则，在限制人们出入工作场所方面有工会规则，在存储和处理个人信息方面有数据安全规则，在处理检测后的缓冲溶液方面有危险废物处理规则，以及当工人检测结果呈阳性时谁将承担休假成本的工伤赔偿规则，等等。


