    要实现这一目标，需要进行系统变革。我们对于有人工智能支持的新医疗保健系统已经有无数的设想。13 如果由人工智能提供诊断，那么医疗保健中关于谁有权力进行何种操作的规则就应该改变。当机器进行诊断时，医生的主要职责可能就是提供人性化的医疗服务。这就需要其他各种变革。医学院将不再要求学生背诵医学案例，也不再根据学生对生物学的掌握程度来选拔学生，而通常学生需要依靠其能力在考试中取得好成绩。这些技能在十年的高等教育中可能不会有太大提高，因此面向患者的医生可能只需类似本科学位的学历即可。反过来，这将需要对谁有权提供哪些医疗保健服务进行重大的监管变革。也许病人护理会成为药剂师的主要职责，也许社会工会进入医生曾经的工作领域。在第十八章中，我们将提供一个能在医疗保健中开发人工智能系统解决方案的流程，并对在急诊医学中的人工智能系统提出设想。也许这一切都不会发生，因为需要变革的东西实在太多了。


    人工智能也可能改变全球卫生系统。世界银行已经指出人工智能等技术如何在不同国家之间实现公平竞争。14 远程患者监测和机器诊断的结合可以改善偏远地区的医疗保健水平。


    喀麦隆的心脏病专家都在市区的医院工作，而该国 2 500 万居民中的许多人都离这些医院很远。大多数患有心血管疾病的人从未被诊断出来。喀麦隆的发明家阿瑟·赞格开发了
    Cardiopad 来解决这个问题。Cardiopad 是一种远程心电图工具，利用它则不需要当地的心脏病专家进行检查。该工具已经为数千名患者提供了远程诊断，但仍需'
