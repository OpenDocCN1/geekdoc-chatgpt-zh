    2019 年 5 月的《华尔街日报》。首席经济评论员叶伟平总结了其中的重要观点：是时候停止担心机器人会夺走我们的工作了，而要开始担心它们将决定谁能获得工作。


    这引起了很多人的关注。它引发了人们的一种原始恐惧：机器是否会掌握权力来支配人类？


    这些文章会让你有这样一种设想：员工在下班后进入一个小房间接受机器扫描，然后机器或者显示绿色，上面写着“明天见”；或者显示红色，上面写着“你被开除了”，并出来一张自动打印的粉色解雇通知单。


    总体来说，实际情况并没有这么夸张。目前，亚马逊在使用人工智能预测员工的表现。的确，预测后会进行一次评估，且在评估后员工可能会被解雇。但是，亚马逊不会在没有人类参与的情况下把员工

