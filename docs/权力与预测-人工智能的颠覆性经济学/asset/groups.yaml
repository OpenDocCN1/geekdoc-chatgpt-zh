    ###图 9-3 药物研发（复杂）


    然而，经济领域的许多其他部门尚未意识到变革的必要性。而且，认识到需要系统变革只是第一步。正确的变革是必要的，这需要大量的投入和一点儿运气。很少有大型企业认为有必要改变其所在行业的运作方式，特别是在其所在行业目前正处于盈利的情况下，因为出错的风险太高了。


    这就是为什么技术变革可能会导致颠覆。技术带来了建立业务和为客户提供服务的新机会，但具体如何实现并不清楚。当初创企业和小型企业有创新动力而大型企业没有时，创新就会在由小型企业服务的小市场中孵化，直到它们的产品发展为大市场的可行替代品。最终，行业巨头垮掉，新的经营方式也从这些令人惊讶的地方产生。接下来，我们将讨论这种变革。


    ##本章要点


    - 创新系统的创新可以对其他系统产生连锁效应。镜片研磨技术的进步带来了个人光学市场（如眼镜）和研究工具市场（如显微镜）的创新，进一步推动了创新系统的创新。从显微镜中诞生的病菌理论，让人类可以同病毒和细菌做斗争，并改变了医学的其他方面。


    - 人工智能在创新系统中的一个核心作用是预测新组合的后果。在过去，我们依赖科学理论或试错，而现在有时（如果我们有足够的数据来训练模型）可以使用人工智能预测生成假设。


    - 自动生成假设可能会显著提高创新生产力。然而，要想充分从这项技术中获益，我们必须重新思考整个创新系统，而不仅停留在生成假设这一步。例如，流程中的下一步（设计实验来测试假设）没有改变，只是在下游造成了瓶颈，那么更快地生成假设也不会产生什么影响。


    ##第四部分


    ###权力


    ##第十章


    ###颠覆与权力


    让我们先来简单回顾一下。人工智能具有引发技术变革的潜力，但历史告诉我们，变革并不容易。虽然新技术最初带来的成果是点解决方案和应用解决方案，但其真正的采用和变革是在由技术驱动的新系统建立之后。人工智能提供预测，并通过改进决策创造价值。点解决方案能让预测改善现有决策，应用解决方案则有可能提供新的决策。这些新的决策并不会突然出现，相反，它们会取代规则。规则容许错误存在，并且通常围绕它们建立了一些框架（如机场航站楼）以减轻其后果。因此，本来可能成为人工智能预测目标的不确定性会被掩盖。由此产生的建立在规则之上的系统可以非常稳固——我们称之为“黏合”。这意味着，除非我们采用系统思维，否则将规则变为决策并利用人工智能可能就毫无价值了。


    为了实现人工智能的变革潜力，我们需要在系统层面进行创新。本书剩余部分将讨论这项工作以及许多组织将面临的挑战。最重要的是要明白，这个过程将带来颠覆。


    如今，颠覆是一个有争议的词。作为经济学家，我们对流行词避而远之；而在技术领域，也许没有比“颠覆”更流行的词了。然而，当考虑到在全系统变革的背景下采用人工智能时，这个词就很恰当，原因有以下三点。首先，如我们之前所述，人们可能看不到应用人工智能的机会，因此现有行业容易出现盲点。其次，在推翻现有系统并建立新系统的过程中，挑战和权衡是伴随着技术变革而产生的创造性破坏过程的重要组成部分。最后，随着旧系统被新系统取代，权力必然会发生转移——具体来说，是经济权力——这使权力的积累成为系统创新与潜在颠覆的回报，这是需要担心和抵制的事情。这三点与许多人所认为的“颠覆”一词有关，因此，在这里使用这个词是合理的。


    ###预测能引发颠覆


    本书的剩余章节将讨论人工智能预测及其采用会如何造成颠覆。当然，由于它还没有发生，在此过程中我们也进行了猜测。这种猜测是基于我们对人工智能预测和技术经济学的了解。在数据收集和计算机的帮助下，我们的预测能力较之前也有了进步。


    直到 20 世纪 90 年代，发电都是一个受严格监管的行业。在大多数国家，生产和输送电力到企业和家庭的整个过程都是由垂直一体化的组织负责完成的。其中一个原因是发电成本高，而且几乎无法储存电力。如果你知道需要多少电力，你就可以按需生产。但一天中的每时每刻都会有数百万个独立的用电决策，如果无法满足其需求，那么整个电网就可能崩溃。


    实际上，你可以随意掌握发电量，但同时你还必须兼顾其他各种事情。例如，你必须确保不同地区配电线路的送电量不会达到饱和，也要考虑到无法使用的发电厂，以及燃料成本的变化。最终的结果是，在任何时候都要严格控制并有多余的供应量，以备不时之需。核心是谨慎。


    随着时间的推移，天气预测、工程预测和停机时间预测都变得越来越准确。计算机和大量的经验都对此提供了帮助。在操作层面上，这使电力公司稍微放松了警惕。但这些计划系统在节约燃料成本方面做得并不好。与运行低发电量的天然气发电厂相比，运行大型煤电厂或核电厂会更容易。


    预测能力的提高最终促使行业组织结构发生了变化，朝着更大的模块化方向发展，并减少了集中协调。发电厂不再受严格控制和规划，对需求和分配的更好预测意味着各发电厂可以竞标向本地市场销售电力。到
    20 世纪 80 年代末，经济学家和电力专家意识到，这种电力联营市场可以在不影响质量的情况下降低成本。


    确保电力供应量超过需求量这一核心问题并没有消失。相反，对本地电力需求量的精准预测意味着各工厂的发电决策可以分散进行。电厂提前一天收到竞标，供应量就可以满足需求量，几乎不会出现价格过高的风险。当然，其中会出现价格飙升等问题，而发电厂老板无疑乐见其成。在整个系统中，更好的预测意味着更少的统一规划和更多的竞争，总体电力成本会大幅下降。现在几乎所有的主要经济体都拥有以前无法想象的电力联营市场，而所有这些都得益于更好的预测。


    预测开辟了组织电力行业的新方式，即分散式发电。更好的预测意味着实时需求量大大超出预期的事件越来越少。因此，可以将预测信息提前至少一天发送给各发电厂、输电线路运营商和分销商，然后它们可以各自向中央系统运营商传达其供应意向。这意味着它们有了更大的自主权，因此就有机会去选择投资不同的发电厂和其他提高效率的方式。这时就不需要统一规划一切事情了。


    电力行业的转型是从中心化到去中心化的转变。但关键是这一转变影响到谁掌握权力，不是电力方面的权力，而是经济方面的权力。


    如果你拥有或控制的东西在市场上既有价值又稀缺，那么你就拥有了经济权力。假设有两张肖像画，一张是毕加索为其配偶画的，另一张是你五岁的孩子给你的配偶画的，那么你对这两幅画的所有权是完全不同的。两张画都是独特的，因此都是稀缺的，且都同样不准确地表现了人物的长相，但其中一张更有价值。这也是为什么拥有毕加索的原作与拥有同样画作的印刷品是不同的。两者在审美上是等价的，但前者是稀缺的，后者不是。


    稀缺性是经济权力的基础，竞争可以改善事物稀缺的局面，因此经济学家有时将经济权力和垄断权力视为等同。当以前稀缺的事物遭遇竞争时，权力就会转移。


    对依靠垂直一体化结构保护自己免受竞争的生产者来说，电力领域的变化非常具有颠覆性。实际上，尤其对发电厂来说，竞争意味着利润降低，因为现在它们必须通过竞标才能被调度，而不能依赖长期合同和其他安排。同样，更多的分销商有机会将本地系统与更广阔的区域市场互联。但在美国本土，只有
    10 个市场跨越了多个州。


    我们经常在颠覆中看到这种情况。传统供应商拥有经济权力的行业突然面临竞争，它们的权力被削弱了。不过，权力不会消失，只是发生了转移。在电力领域，权力从垂直一体化的供应商手中转移到了其他人那里，但最重要的是转移到了电力消费者身上。


    在其他情况下，通过竞争产生的颠覆会将权力从传统生产者转移给新的生产者。换句话说，垄断权力仍然存在，只是垄断者换了个名字而已。因此，经济权力并不受新型创新本身的威胁，而是创新带来的奖励。正如我们将看到的，当颠覆以系统创新的形式产生时，这些权力主体之间会出现权力的交接。然而，那些与当前系统没有利益关系的人，往往最能从创建新系统中获得回报。


    ###颠覆性威胁


    为什么颠覆——特别是由系统创新产生的颠覆——对现有企业构成了如此大的威胁，削弱了它们的经济实力，而反过来又为新进入者提供了如此大的机会呢？


    “颠覆”一词起源于克莱顿·克里斯坦森的研究。² 克里斯特森指出，行业巨头可能会对新技术及其对客户的价值“提出错误的问题”。因此，对于那些给不了自己客户太多好处的技术，行业巨头会望而却步。然而，从市场巨擘那里得不到服务或周到服务的客户却非常喜欢那些技术。例如，硬盘驱动器制造巨头侧重于性能和存储，但也有客户愿意用这些优势来换取更小的尺寸或节能。新进入者可以抓住这些机会，如果这些技术得到改进，它们最终会成为该行业强有力的竞争者。³


    当激进的技术变革不能改善传统衡量指标的表现，但在某些情况下，却能改善现有行业中非重要指标的表现时，真正具有挑战性的颠覆就出现了。这可能会给行业巨头带来盲点。历史学家吉尔·莱波尔描述了这一理论：


    在 1997 年《创新者的窘境：领先企业如何被新兴企业颠覆》一书中，克里斯特森认为，这往往不是因为企业高管做出了错误的决策，而是因为他们做出了正确的决策，正是这些良好决策让企业在几十年间获得成功。（“创新者的窘境”就是“做得对是错事”。）克里斯特森认为，问题在于历史有自己的发展速度，它不是像错过机会这样的问题，比如飞机没载上你就起飞了，而是你压根儿不知道有飞机，还误入了你以为是草地的机场，结果飞机在起飞时把你撞飞了。⁴


    我们已经知道，规则和隐藏的不确定性是导致这种盲点的原因。当出现这种情况时，要管理颠覆就不是简单地应对不同的客户群体，而是要调整企业组织结构并且确定要优先解决的问题。被颠覆的最快方法就是忽视实施新技术需要进行的组织变革。


    英国人在第一次世界大战结束时开始使用的坦克就是其中一个例子。坦克速度较快，可以在敌军中造成混乱。至少这是当时英国坦克负责人约翰·弗雷德里克·查尔斯·富勒的想法。但在两次战争期间，英国无视了富勒的计划，将坦克归为骑兵部队。当德国重新军事化后，“英国陆军的最高指挥官、陆军元帅亚奇巴尔德·蒙哥马利-马辛伯格爵士将马匹饲料的开支增加了
    10 倍，以此来应对德国。骑兵军官将获得第二匹马，坦克军官也将获得一匹马”。⁵相比之下，军事组织已经被摧毁的德国人没有试图将新技术纳入现有组织。他们明白新技术意味着新的军事组织和新战术。德国将新战术称为“闪电战”，并邀请富勒参与首次战役。


    虽然英国军方的荒唐行为可能让人认为是自大或愚蠢，但类似的桥段在商业史上一再出现，学术界也并没有忽视这些。当克莱顿·克里斯坦森于 1990 年在哈佛大学钻研他的颠覆理论时，丽贝卡·亨德森和金·克拉克也在研究同样的现象。⁶与克里斯坦森关注需求方面（即缺失的客户价值）不同，亨德森和克拉克关注的是供应方面（即缺乏组织适应性）。他们指出，在许多情况下，技术变革是结构性的，会改变组织的优先规则，而由于组织结构很难被改变，这就为能够从零开始的新生组织提供了良机。⁷


    离我们比较近的例子是 iPhone（苹果手机）。2007 年，手机行业正处于加拿大企业 Research In Motion（RIM 或黑莓）的统治时期，该企业研发了黑莓通信设备。这是一款手机，但更重要的是，由于其内置键盘，它也是一台收发电子邮件和短信的设备。商务人士对它爱不释手。一位美国国务卿非常喜欢它，以至于建立了自己的私人服务器，在任职期间一直使用它。它之所以成功，是因为键盘硬件设计精良，发送消息的硬件网络高效且安全，同时设备也经得住摔打。


    相比之下，iPhone 则很脆弱。它没有黑莓用户喜欢的键盘，依赖于速度较慢的移动互联网基础设施进行交互，消耗电池寿命，且通话功能很糟糕。因此，包括 RIM、诺基亚和微软在内的整个行业都对
    iPhone 不屑一顾，并让它离开这个行业，把专业的事情留给专家来做。


    我们可能很容易再次认为这是自大的行为，但行业巨头的所有批评都是正确的。它们不明白的是，iPhone 选择了一种新的智能手机架构。它将硬件和软件整合在了一起。为了实现一种以不同方式组装的设备，它不得不牺牲所有组件的性能。若将这些组件分开来看，一切都显得很糟糕。但如果你了解这个系统，情况就不同了。因此，看到
    iPhone 机会的科技公司是一家没有传统行业发展组织的公司——谷歌。


    处理结构性或系统变革所面临的挑战就在这里。第一，为了实施变革，你需要那些最初看起来没有竞争力的产品，因为它们必须做出选择，牺牲客户似乎会关心的性能。第二，为关注性能而创建的现有组织，没有能力迅速理解新技术所做的所有权衡，即“只见树木，不见森林”。第三，对于这个错误没有快速的反馈。iPhone
    花了 4 年的时间才对手机制造巨头的销量产生影响。黑莓在 2007 年后销量达到了最大值。只有在苹果和谷歌都推出自己的设备之后，新的手机设计才受到青睐。


    到那时，对于所有行业巨头来说，重组并奋力追赶都为时已晚——尽管它们确实尝试过。


    ###系统变革的困境


    当由人工智能驱动的决策成为系统的一部分时，采用人工智能可能需要对新系统进行组织性的重新设计。正如我们刚刚讨论的，现有组织在创建新系统时面临的一个困难是，它们已经过了优化以获得现有技术的强大性能，但是采用人工智能可能需要它们改变关注重点。在某些情况下，人工智能会推动组织变得更加模块化，而在其他情况下，它会促使组织去更好地协调各个部分。其挑战在于认识到当前的关注重点才是问题所在，并且需要大范围的变革。


    当高层管理人员意识到，为了在一个或多个关键决策领域采用和整合人工智能预测需要一种新的组织设计时，就会面临进一步的挑战。这是因为组织设计总是涉及价值的改变，进而涉及组织内不同资源供应者的权力改变。那些预计在权力重新分配中会蒙受损失的人将抵制变革。组织很少像教科书上的独裁体制那样运作，首席执行官说什么就是什么，然后就有了变革。相反，那些预计权力会受到削弱的人会抵制变革。在这个过程中，他们可能会采取一些行动，在最好的情况下，这些行动会增加变革实施的难度；在最坏的情况下，这些行动可能会导致组织的重新设计被完全打乱，甚至产生逆转。⁸


    有许多例子表明了采用颠覆性技术会导致可能失去权力的人对变革的抵制。举个例子，我们来思考一下百视达录像带的故事。百视达在 20 世纪 90 年代和 21 世纪初是录像带租赁市场的领导者。人们普遍认为百视达的衰落是由于奈飞和
    21 世纪初点播视频的兴起。但实际上，百视达并没有被动地屈服于新的方式。它明白即将到来的变化，但最终未能做好调整。


    当奈飞刚起步时，它利用了新的 DVD（数字化视频光盘）技术，这种技术的产品比之前百视达出租的录像带体积更小、更耐用。奈飞进行了一些实验，最终通过客户订阅业务获得了商业的成功，客户可以同时租借
    3 张 DVD，并且奈飞没有限制他们租借 DVD 的时间。客户可以在线上订购 DVD，然后奈飞会邮寄给他们。因此，这个模式有两个优势。第一，客户无须去实体店租借或归还
    DVD；第二，没有滞纳金，而对于典型的百视达特许经营店，滞纳金可能占其总收入的 40% 以上。不过缺点是，奈飞并不一定有最新的影片，而且客户必须有观影计划，不能仅凭冲动来租借
    DVD。


    百视达注意到奈飞能够吸引客户，并且在某些情况下影响了自身的收入。在 21 世纪初，百视达认识到奈飞正在利用自身模式的一些缺点，于是尝试推出了点播视频——百视达是第一家提供点播视频服务的公司。不过，那时的宽带速度不如今天这么快，所以这个尝试并没有成功。但百视达确实意识到它也可以有类似于奈飞的
    DVD 租赁模式。区别在于，它可以让用户在商店挑选和归还 DVD，而不仅依靠邮寄。


    但问题是，这种订阅服务削减了特许经营店赚取的占总收入 40% 以上的滞纳金收入。此外，这些客户并不一定会在商店购买其他商品，如爆米花和糖果。因此，依照奈飞的模式，百视达总部虽然从中受益，但特许经营店的利益却受到了损害。所以就有了抵制行为，尤其是在新模式被证明很成功的时候。最终，这导致百视达董事会决定更换高层管理人员，并恢复到原来的模式，以支持特许经营店。为了对抗奈飞，百视达试图丰富这些商店所提供的服务，而不是简单的视频租赁，但这种做法并没有奏效，几年后百视达就倒闭了。


    当然，百视达的案例非常具有戏剧性，既展示了在面对新技术时变革的失败，也展示了内部力量是如何在为时已晚之前阻止变革的。


    但正是因为那些从新技术中受益和没有受益的人之间的冲突如此明显，所以它是一个有预见性的案例。零售店在新世界根本没什么用，但这足以阻止企业去适应变革，尽管其高层管理人员明白新组织该怎么做。


    正如我们在接下来的章节中将要讲述的，从更广义上讲，人工智能可以带来组织变革，这种变革可以使权力去中心化或者通过协调使其中心化。无论哪种方式，那些因变革而受到损失的人都会非常清楚，正是因为他们在现有组织系统的基础上掌握着权力，所以维持现状就能保证既得利益。


    ###颠覆与机遇


    系统层面的变革是困难的，但成功带来的回报却是巨大的。在人工智能方面经常出现的一个问题是，体现人工智能预测的机器——无论是实体机器人还是软件算法——本身是否拥有权力。当你认识到人工智能的本质时，你就不会担忧机器将会拥有权力了。由于这些争论持续存在，我们将在下一章进行讨论。


    ##本章要点


    - 行业巨头通常会采用点解决方案，因为点解决方案既可以改善特定的决策或任务，又不会影响其他相关决策或任务。然而，行业巨头通常很难采用系统解决方案，因为这些解决方案需要改变其他相关任务，而组织已经在优化其他任务方面进行了投资。此外，对于某些任务，系统解决方案的效果可能不好，尤其是在短期内，这就为颠覆奠定了基础。


    - 我们将权力定义为经济权力。在需求层面上，如果你拥有或控制的东西是稀缺的，那么你就拥有权力。稀缺性是经济权力的基础，而某事物的稀缺可以通过竞争来缓解，所以经济学家有时将经济权力和垄断权力视为等同。当以前稀缺的东西遇到竞争时，权力就会转移。


    - 有时，为了充分从人工智能中受益，需要实施系统解决方案。系统重新设计导致的权力转移可能会出现在行业层面（如随着人工智能的普及，掌握海量数据的行业会变得更加强大）、企业层面（如第十二章所讨论的），以及工作层面（如在转向在线电影租赁和邮寄
    DVD 时，百视达的特许经营店失去了权力）。那些可能会失去权力的人将抵制变革，他们通常目前拥有权力（这就是他们抵制的原因），因此有能力去阻止系统变革，这就为颠覆创造了条件。


    ##第十一章


