    ## 决策带来的好处


    这里的重点是，当收集信息做出最佳选择的成本很高时，我们就会养成习惯或形成规则来避免考虑信息。我们只需每次都做同样的事情，而无须思考。


    如果你避免做决策，遵守默认规则，人工智能预测似乎对你没什么用。人工智能的任务是为决策提供信息，如果你不做决策，那么这些信息就没有价值。


    人工智能的功能是提供更精确的预测，这意味着你通过所需的信息来做出更好的决策。如果天气预报可以让我们对天气有信心，而不是陷入不确定中，那么我们就能决定带或不带雨伞。有了更多的信息，你就可以放弃规则，并且发现花费时间做出真正的决策是值得的。


    在雨伞的例子中，有效的信息降低了你的成本。无论代价是淋湿全身还是带上不必要的雨伞，如果你知道会发生什么，你就不必付出这些成本。要做到这一点，你需要打破自己的习惯，如总是携带雨伞。你可以查看一个应用程序（如降雨预测软件），然后决定是否带上雨伞；你也可以让应用程序告诉你是否该带上雨伞，而不用考虑为什么。尽管应用程序的程序员已经设定了带雨伞的阈值，但这仍然算作从规则到决策的转变。对于带或不带雨伞这件事，我们可能不会常去看应用程序，但我们中的许多人会关注推荐的歌单或社交媒体提供的新闻。这些行为的核心就是决策。接受推荐意味着不依赖规则（如从头到尾阅读报纸），并做出决策。


    在人工智能预测的基础上进行决策，你会获得相当有价值的结果。从关于“强制实验”的报道中我们已经了解一二，而在新冠肺炎疫情防控期间不得不在家工作的人对此更是非常熟悉。以前，我们并不知道在家工作的效率会有多高，但在被迫尝试一些不同的事情后，我们就明白了，从打破过去的习惯中学到了新东西。如果在疫情之后，我们不再像以前那样出门工作，这说明现在决定在哪里工作对我们来说是有意义的。⁶


