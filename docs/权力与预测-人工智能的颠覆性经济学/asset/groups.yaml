    人工智能还可以运用在气象学的另一个领域。把更准确的天气预报看作一种输入，然后将这些信息与其他社会和个人数据结合起来，以更好地预测个人（或公司）的风险状况和降低该风险所需的行动。我们可以想象这样一个世界：在那里不再发布一般的天气预报，而是自动向个人或公司发送个性化的天气预报。难道不再需要人类气象学家了吗？我们人类的判断力似乎更适合创造人工智能，使其做出正确的决定，然后再提供给客户。11


