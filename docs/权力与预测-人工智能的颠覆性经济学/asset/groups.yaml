    # 第十六章


    # 设计可靠的系统'
  - '[PAGE 231]


    <!-- no content -->'
  - '[PAGE 232]


    诺贝尔经济学奖得主托马斯·谢林在获奖几十年前提出了以下思想实验：


    假设你要在纽约市与某人碰面。你没有被告知在哪里碰面，你和对方没有事先约定好地点，且你们之间无法进行交流。你只是被告知必须猜测碰面地点，而对方也被告知了同样的事情，接下来你们只需尽量使你们的猜测一致。


    今天，当我们向学生提出这个问题时，他们甚至无法理解这个问题是如何产生的。你给对方发短信不就行了吗？但在过去，这可是很常见的难题。而整个思想实验的重点在于，你在无法进行交流的情况下能做什么。


    在 2000 年前后，如果你在课堂上问纽约的学生这个问题，他们很快就会想到一个地点：在中央车站的大钟下面。在墨尔本，可能是弗林德斯街车站前的台阶。在多伦多，可能是纳森·菲利普斯广场上的大多伦多标志。'
  - '[PAGE 233]


    这些地方是城市的地标，大多数城市和小镇都有这样的地点。彼此知道两人在朝向同样的目的地，而且彼此都知道对方知道这一点。


    在我们的思想实验中，那些感到困惑的通常是外地或外国学生。他们掌握了所需的知识，但没有必要的常识。实际上，他们可能会发现回答谢林的后续问题更容易：“你被告知会面的日期，但没有被告知具体的时间……你们两个必须猜测会面的确切时刻。你会在什么时间出现在会面地点？”所有人都会回答：“中午。”²这个时间甚至比地点更有标志性。


    托马斯·谢林的职业生涯受到战争的影响，特别是冷战。他的研究关注如何避免战争，并使人们能够在彼此最大的共同利益上达成共识。他所使用的工具是博弈论。当思考如何协调许多人的决策时，即使当他们都面向一个共同目标时，这些工具也可以说明这种协调何时会很困难，何时会很简单。


    这里我们感兴趣的是，当在一个系统中嵌入人工智能来帮助它做决策时，会如何改变所有决策协调的本质（无论是否使用人工智能），而答案的关键在于可靠性。


    谢林的地标实验表明，依靠与自己有相似知识基础的人是多么有用。在组织内部，这可能很重要，但通常我们的依靠来自对其他地方所做事情的预期。当其他人遵守规则时，这项任务通常很容易完成，我们可以将组织的不同部分黏合在一起。但是当规则转变为决策时，建立一个灵活系统所面临的挑战就显而易见了。我们通常不会一直向他人传达我们在做什么，因为这本身就是有成本的。相反，我们会对其他人可能在做什么产生预期，然后在自己的领域做出选择时，我们将行动与这些预期保持一致。如果这些预期不可靠，那么我们将很难协调所有的决策。


    事情并非一定如此。如果你可以设计系统，使预期一直可靠，你'
  - '[PAGE 234]


    就可以从更好的预测中获得好处，从而带来服务客户的新方式。


    # 人工智能长鞭效应


    可以想象你经营着一家餐厅。顾客进来点餐，然后厨师制作食物。这似乎相当简单，因为预期是一致的。在任何时间，厨师在制作餐点时都会受到限制。这些限制是由他们的技能、订单数量，以及食材和设备的供应情况所决定的。如果你让顾客点任何他们想要的菜肴，那就会出现问题。因此，你制作了菜单。限制顾客的选择，这样你才能真正做出他们点的菜。从厨房的角度来看，菜单本身就创造了可靠性，防止了意外的发生。


    你每周都需要订购食材，食材是由菜单决定的。如果菜单上有牛油果酱，你就需要购买牛油果。你每周订购 100 磅①。有时候 100 磅太多，你就会扔掉多余的部分；有时候
    100 磅太少，你就会错失销售机会。


    后来你采用了一种用于需求预测的人工智能技术，它奏效了。现在有几周你只需订购 30 磅的牛油果，而在其他周，你需要 300 磅。你的浪费减少了，销量增加了，因此利润提高了。


    你的当地供应商过去习惯每周为你购买 100 磅的牛油果。现在，它面临着来自你的更多的不可预测性。它的其他客户也在使用人工智能进行需求预测。需求开始大幅波动。


    因此，供应商决定采用一种人工智能技术，用于自己的需求预测。它过去每周订购 25 000 磅。现在，它的订购量在 5 000~50 000 磅波动。它的供应商同样也需要采用人工智能技术，然后其订单也开始波动。


    ① 1 磅约等于 0.45 千克。——编者注'
  - '[PAGE 235]


    以此类推，一直到农作物种植者，他们需要提前一年或更长时间来为种植规模做出决策。


    我们将这种效应称为人工智能长鞭效应——采用人工智能技术改善了一个决策的质量，却降低了系统中其他决策的可靠性，从而损害了系统中其他人的利益。就像一条牛鞭，一个地方的小变化可能会在其他地方产生巨大的影响。


    人工智能可以用于解决不确定性，但除非可以在整个系统中实现决策的一致性，否则根本问题（需求与供应需要保持一致）并没有得到真正解决。就像牛鞭的摆动一样，你自己的解决方案会在整个过程中产生回响。


    我们陷入了一种悖论。人工智能的价值在于将你的行动与原本可能不确定的因素相匹配，从而做出更好的决策。但这样一来，你自己的决策对于他人来说就变得不那么可靠了，你可能会把承担不确定性的责任推给别人，这意味着不使用人工智能来调整不确定性，而是坚持使用更可靠的系统可能会更好。


    有两种方法来构建处理这种问题的人工智能系统解决方案：增强协调性或增强模块化。


    # 协调的价值


    餐厅的人工智能可以预测需求。餐厅经理会做出其他一些决策，如菜单上提供什么菜。如果人工智能长鞭效应导致农作物种植者无法提供足够的牛油果，那么餐厅就需要改变菜单。只有在知道牛油果供应不足的情况下，才能做出这个决策。这就需要协调。


    这样的协同效应意味着重要的是考虑如何实现多个决策者之间的协调、可变化管理和调整，而不是进行转型和变革。'
