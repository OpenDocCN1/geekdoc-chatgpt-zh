    所有这些都将帮助你更快地坐上飞机。


    然而，这些措施并未解决你乘坐飞机时面临的不确定性问题——交通和安全。不过，在交通问题方面，已经发生了变化。例如，位智（Waze）等导航应用程序会考虑交通情况，并根据具体的出发时间合理预计到达机场所需的时间。虽然这些应用程序并不完美，但它们在变得越来越好。


    规则会告诉乘客他们需要提前多久前往机场，而这些应用程序让乘客无须再遵守规则。相反，他们可以将航班时间添加到日历中，应用程序会告诉他们最佳出发时间，并据此安排行程。另外，在不久的将来，不确定的航班实际起飞时间也将被考虑在内。应用程序将不仅根据既定的出发时间告诉你需要何时出发，而且会根据预测的航班实际起飞时间提醒你。虽然这仍存在不确定性，但这一进步——从没有信息到获得更精确的信息——可以节省人们数小时的候机时间。同样，许多优步用户以前认为自己并不在意出租车预计到达时间，但现在却将这一信息视为该服务最有价值的功能之一。当前，优步正在使用人工智能进行预测。


    人工智能还可以预测安检排队等待的时间。综合考虑所有因素，你可以使用人工智能决定何时出发去机场，而不是依靠规则。与其他事物一样，总有一些人会在他人之前跃跃欲试。在仁川和许多其他机场，候机已经不是什么坏事了，所以你无须做出明智的决策。


    一些人在开发人工智能导航应用程序或航班出发预测程序，他们与机场航站楼内的活动收益没有直接利益关系。然而，他们的人工智能应用程序的价值在很大程度上取决于有多少人不想在机场候机。因'
