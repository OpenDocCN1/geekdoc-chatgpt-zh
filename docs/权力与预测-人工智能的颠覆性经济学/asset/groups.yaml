  - '[PAGE 220]


    测时，对目前的出租车司机来说不会有什么变化，但其他司机现在有机会依靠人工智能预测，而不是他们自己的预测技能来进行判断。人工智能颠覆了出租车行业，并不是因为它改变了出租车司机判断的价值，而是因为它提高了其他司机判断的价值，而这些司机现在可以在优步和来福车上拉载乘客。通过扩大可以开车载客的工人群体，预测改变了能做决策的人。


    在弗林特市含铅管道的案例中，预测将决策者从地方政治家转变为法官和法律案件中同意修改决策的各方。


    改变决策者可能引发抵制和怀疑。如气象学家预测天气，⁵ 他们预测每日温度、降水和危险天气，如飓风、龙卷风和暴风雪。他们传达天气情况，这对于极端天气事件尤为重要。美国国家气象局前主席托德·勒里科斯指出：“我们所做的是进行风险评估。公众会面临多大风险以及我们需要向他们传达什么信息，以便他们采取应对措施。”⁶


    预测只是第一步，但如果传达失败，无法改变行为，好的预测就没有了意义。我们来思考一下 2011 年龙卷风袭击密苏里州乔普林市的情况。当天在龙卷风袭击的 4 个小时前发布了预警，并在前
    17 分钟发布了警报，但大多数接受调查的乔普林市居民并未寻找庇护所。⁷ 可悲的是，龙卷风造成 158 人死亡，还有许多人受伤。天气预报是确保人们在天气变得危险时做出正确决策的一部分


    随着天气预报的进步，沟通变得更具挑战性。假设龙卷风的风险是 5%，预报员就必须权衡短期利益（告知人们生命和财产所面临的真实风险）与长期成本（多次警报可能导致人们产生疲劳，在
    20 次中有 19 次都没有发生任何不好的事情）。这改变了气象学家的日常角色。正如勒里科斯所说：'
