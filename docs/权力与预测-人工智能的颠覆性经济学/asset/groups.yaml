    此时，对目前的出租车司机来说不会有什么变化，但其他司机现在有机会依靠人工智能预测，而不是他们自己的预测技能来进行判断。人工智能颠覆了出租车行业，并不是因为它改变了出租车司机判断的价值，而是因为它提高了其他司机判断的价值，而这些司机现在可以在优步和来福车上拉载乘客。通过扩大可以开车载客的工人群体，预测改变了能做决策的人。


    在弗林特市含铅管道的案例中，预测将决策者从地方政治家转变为法官和法律案件中同意修改决策的各方。


    改变决策者可能引发抵制和怀疑。如气象学家预测天气，5 他们预测每日温度、降水和危险天气，如飓风、龙卷风和暴风雪。他们传达天气情况，这对于极端天气事件尤为重要。美国国家气象局前主席托德·勒里科斯指出：“我们所做的是进行风险评估。公众会面临多大风险以及我们需要向他们传达什么信息，以便他们采取应对措施。”6


    预测只是第一步，但如果传达失败，无法改变行为，好的预测就没有了意义。我们来思考一下 2011 年龙卷风袭击密苏里州乔普林市的情况。当天在龙卷风袭击的 4 个小时前发布了预警，并在前
    17 分钟发布了警报，但大多数接受调查的乔普林市居民并未寻找庇护所。7 可悲的是，龙卷风造成 158 人死亡，还有许多人受伤。天气预报是确保人们在天气变得危险时做出正确决策的一部分


    随着天气预报的进步，沟通变得更具挑战性。假设龙卷风的风险是 5%，预报员就必须权衡短期利益（告知人们生命和财产所面临的真实风险）与长期成本（多次警报可能导致人们产生疲劳，在
    20 次中有 19 次都没有发生任何不好的事情）。这改变了气象学家的日常角色。正如勒里科斯所说：


    在传统意义上，天气预报服务的主要客户是公众。现在，公众成为更间接的客户。我们的大部分重要服务工作是与地方当局合作做出关键决策……他们是有影响力的人。你可能见过这样的情况，在巨大的暴风雪来临前，市长会说：“请人们不要上路。”
    8


    换句话说，美国国家气象局提供决策支持。正如作家安德鲁·布拉姆所指出的，它现在花费“更多的时间向应急管理人员和公共工程官员解释天气事件的可能性及其影响的严重程度。在此期间，这增加了更多的工作量。而在将来，这可能就是唯一的工作了”。9


    造成这种情况的原因是更准确的预测。当预测错误时，学校可能只有在下雪的时候才停课。更好的预测意味着提前数天就可以采取行动：


    这引发了一个新的挑战：如果天气预报近乎完美，你可以用它做什么？如何学会利用它做决策？过去，气象学在解决这个现实问题上进展缓慢。气象学家兼 Weather Company
    的高级副总裁彼得·尼利解释说：“我们曾认为，这是科学研究后面才要考虑的事，是别人需要考虑的问题。”“我们的科学家一直说，‘我们将专注于准确性，当我们在准确性上达到乌托邦时，社会就会安全无虞’。但我们已经意识到这不完全正确。”现在他们的工作范围扩大了，包括“整个价值链，从模型中的预测开始，一直到个人的有效决策”。10


    到目前为止，当地办公室的气象学家在这方面做得很好。以降雪警报为例。在我们居住的多伦多，如果一晚上会有一英寸的降雪量，降雪预报就会告诉你要在出门前多准备几分钟的刷车时间。但同样的一英寸降雪预报可能会导致亚特兰大停工。在拉斯维加斯，情况可能更加复杂。预报可能只与该市的西部有关，因为海拔较高的地区更可能有雪。要做出正确判断就很复杂，还需要了解人们的生活方式。


    勒里科斯描述了针对天气的人工智能系统解决方案是如何运作的。他首先描述了点解决方案：“更好的预测将使气象学家在传达影响和风险方面的工作变得更重要。”这随后导致了系统层面的变化：


    人工智能还可以运用在气象学的另一个领域。把更准确的天气预报看作一种输入，然后将这些信息与其他社会和个人数据结合起来，以更好地预测个人（或公司）的风险状况和降低该风险所需的行动。我们可以想象这样一个世界：在那里不再发布一般的天气预报，而是自动向个人或公司发送个性化的天气预报。难道不再需要人类气象学家了吗？我们人类的判断力似乎更适合创造人工智能，使其做出正确的决定，然后再提供给客户。11


    要做到这一点，需要理解个人行为模式，告诉他们天气预报对他们而言意味着什么。勒里科斯举了一个例子：如果你住在拉斯维加斯的东部，你则不需要改变自己的行为模式，除非你孩子的学校位于西部。在这种情况下，你预计学校会停课。如果没有停课，你需要想办法将孩子接回家。这还取决于你的交通工具。在内华达州，有很多人拥有后驱跑车。随着预测变得更好，判断变得更加细致。勒里科斯强调，我们需要具备正确专业知识的人，就是“社会学家、交通专家和气象学家”。他承认“可能存在气象学家没有发言权的情况，这取决于你要解决的具体问题”。12
    如果更好的人工智能意味着气象学家不再是天气决策的核心，我们预计这些气象学家会对人工智能的大规模采用保持警惕。


    弗林特市的含铅管道、导航应用程序和天气预报的例子都表明，如果决策者的判断力价值因人工智能而提升，他们将继续掌握权力，而如果判断力贬值则不会。归根结底，这取决于决策的效率。如果拥有预测机器意味着拥有信息、技能、激励机制和协调能力的人将发生变化，那么判断权也会发生变化。13


    ## （去）中心化


    人工智能也影响权力的集中程度。它可以规模化判断，这是人工智能预测的直接结果，因为人工智能预测是可以在广泛的决策中进行沟通和确定的软件。从制定判断和将其编码为自动化流程，这种规模化提高了潜在的效率。


    为了了解这种情况是如何出现的，让我们思考一些已经受到人工智能预测影响的案例，比如放射科医生和信用卡。我们在第十四章中介绍了后者。对于前者，人工智能预测已经威胁到了放射科医生的工作。在这种情况下，虽然人工智能预测可能优于人类预测，但为了评估其影响，我们必须确定人工智能预测是否还会改变提供判断的人。


    请记住，判断是一种认识，以权衡不同选择所产生的价值。当你依靠预测来做出决策时，判断是你对做出错误决策的后果所给予的重视程度，因为预测通常是不完美的。当人工智能预测出现时，谁会知道在预测不完美时应该怎么做呢？


    让我们来思考一个疑似恶性肿瘤患者的诊断决策。为了做出诊断，放射科医生会检查患者的放射影像。在美国，放射科医生通常不与患者接触，因此唯一的数据就是影像本身。


    虽然在某些情况下，预测后果是显而易见的，但在其他情况下，放射科医生需要推断恶性肿瘤存在的概率。如果恶性肿瘤存在，而


    他们诊断为其不存在（即假阴性），患者将无法接受治疗并可能会死亡。这似乎会促使人们为了防患未然而去诊断病情。


    但是，防患未然也有其代价。为未患恶性肿瘤的患者做恶性肿瘤诊断，意味着患者要做进一步的检查和治疗，这让人很不舒服。最终的诊断可能需要进行判断。此外，判断的一部分可能涉及放射科医生对自己能力的信心。如果他担心可能会遗漏一些东西，那么他可能会倾向于假阳性而不是假阴性。


    放射科医生的判断力来自培训和经验。每位放射科医生都会将自己的判断力应用于他们所面临的每个决策。


    在其他情况下，判断并不取决于许多个人，而是更加中心化过程的结果，这就是信用卡网络的情况。在这种情况下，算法可以预测一笔交易是否存在欺诈行为，但指导如何处理该预测的判断需要被预先考虑、编码，并被大规模应用。这种判断是中心化的。


    放射科医生和信用卡的例子说明了判断的两个广泛来源。个体可以为每个决策提供局部判断，也可以为大量决策提供全局判断以实现规模化。当决策的背景与局部因素关系紧密，或者很难将判断编码用于各种决策时，局部判断就显得最有价值。当整个组织拥有一致的决策过程，并且局部的环境不那么重要时，全局判断就具有最大的价值。因为当人工智能改进预测时，它可以改变判断的最佳来源，所以区分适应局部环境的判断和在全局范围内规模化应用的判断非常重要。


    这在信用卡的例子中已经很明显了。在信用卡出现之前，主要的支付工具是现金和支票。现金当然是可靠的，也很难进行欺诈交易。而支票则是另一回事，商家会决定是否接受来自特定客户的支票。商家会自行预测该支票能否被兑现，同时也会结合接受支票或要求使用现金的后果来进行判断。


    随着信用卡网络的规模化发展，它们提供了大量数据，使它们甚至能够在人工智能出现之前预测是否应该执行信用卡交易。最初，欺诈管理的重点在于事后恢复。但随着更好的预测出现，它们可以更有把握地做出接受或拒绝决策，而无须要求商家召集可疑的对象。因此，更好的预测导致了判断来源的改变：从局部环境到全局范围。


    放射科医生仍然进行预测，并在这种情况下做出判断。判断仍然来自局部。然而，随着人工智能的进步，我们不知道放射科医生是否仍然会是做出诊断判断的最佳来源。


    放射科医生所做的工作不仅是预测。正如在第八章中所指出的那样，放射科医生的工作流程包括 30 项不同的任务，其中只有一项是预测，会直接受图像识别人工智能的影响，14
    其他任务包括进行体检和制定治疗方案等判断。15 放射科医生从医学院毕业后还需要接受多年的培训，其中多年的时间是用来学习如何解读影像的。一旦人工智能去做影像预测，问题就是谁最适合从事放射科医生目前所做的其他工作。这很有可能需要一个了解局部环境的医护人员。对医学成像方面的更好预测可能意味着更多的医疗专业人员可以运用判断力，将决策权从放射科医生转移给更多的医疗专业人员。


    预测可以增强或减弱决策权的中心化。


    ## 判断与控制


    我们已经讨论了判断和控制的两个方面。有时，预测与判断的“脱钩”意味着不同的人进行判断，而有时则是同一群人。决策的控制有时变得更加集中，而有时则不太集中。图
    15-2 对此做了总结。


    ## 对决策的控制


    | 进行判断的人 | | 更加集中 | 不太集中 |

    |---|---|---|---|

    | | 相同 | 客户服务、招聘 | 医学成像 |

    | | 不同 | 信用卡、弗林特市的含铅管道 | 优步司机、气象学 |


    ## 图 15-2 判断与控制


    当少数人拥有最高效的判断力，并且人工智能意味着这些人应该与目前做出决策的人不同时，就有出现颠覆的可能性。我们已经在支付行业中看到了这种颠覆，集中式网络管理者的判断取代了数百万商家的判断。弗林特市也出现了颠覆，这说明旧的做事方式在数据时代已经无法维持。


    当不同的人进行判断时，即使是人工智能的点解决方案也会面临阻力，这会减缓人工智能的普及速度，延长我们在“中间时代”的时间。它还增强了颠覆的可能性，增加了对人工智能系统解决方案的需求。如果现有体系中掌握权力的人不愿放弃他们的位置，那么一个新的体系——也许是由一个有进取心的人工智能系统企业家开发的体系——将会把判断权分配给最适合提供判断的人。


    然而，即使有了合适的裁决者——正如我们将在第六部分中看到的那样——也需要认识到系统涉及相互关联的决策。因此，改变一个决策的实施方式可能会对许多其他决策产生影响，这也对系统设计产生了重要的影响。


    ## 本章要点


    - 当人工智能的实施导致预测和判断“脱钩”时，就可能存在增加价值创造的机会，但这可能需要重新设计系统，并将判断权从当前的决策者转移给其他人。当发生这种情况时，权力会重新分配。授予判断权的人最终做决策，并因此拥有权力。利用人工智能的新系统设计可能会削弱某些人的权力，因此他们可能会抵制变革。


    - 在设计新系统时，我们应该如何分配决策权呢？我们会选择最有可能以最低成本为组织做出最有利决策的人或团队，这就是决策效率。其中，有四个主要因素需要考虑。一是信息：谁可以获得做出决策所需的信息，或者谁应该被赋予这样的信息。二是技能：谁拥有做出决策所需的技能和专业知识。三是激励机制：谁的激励机制与组织在这个特定决策上的利益最为一致。四是协调：如果决策影响到组织的多个部分，那么谁拥有所需跨组织的权威、信息和激励机制，能够做出最符合组织整体利益的决策。预测叠加判断与只需判断这两种需求的答案可能会截然不同，因为人工智能会提供预测。


    - 如果判断可以被编码从而规模化，新的系统设计可能会集中权力。信用卡和放射科医生就是两个例子。在信用卡的案例中，权力集中在少数几家信用卡公司的手中，而不是过去的许多商家手中。在放射科医生的案例中，有人推测，医学影像中的模式识别和异常检测等关键技能有助于将预测集中在人工智能解决方案中。在这种情况下，如果不再需要放射科医生的预测技能，那么他们是否最适合提供判断？如果不是，护士、社工或其他训练有素的医护人员可能会提供判断。


    ## 第六部分


    ## 展望新系统


    ## 第十六章


    ## 设计可靠的系统


    诺贝尔经济学奖得主托马斯·谢林在获奖几十年前提出了以下思想实验：


    假设你要在纽约市与某人碰面。你没有被告知在哪里碰面，你和对方没有事先约定好地点，且你们之间无法进行交流。你只是被告知必须猜测碰面地点，而对方也被告知了同样的事情，接下来你们只需尽量使你们的猜测一致。


    今天，当我们向学生提出这个问题时，他们甚至无法理解这个问题是如何产生的。你给对方发短信不就行了吗？但在过去，这可是很常见的难题。而整个思想实验的重点在于，你在无法进行交流的情况下能做什么。


    在 2000 年前后，如果你在课堂上问纽约的学生这个问题，他们很快就会想到一个地点：在中央车站的大钟下面。在墨尔本，可能是弗林德斯街车站前的台阶。在多伦多，可能是纳森·菲利普斯广场上的大多伦多标志。


    这些地方是城市的地标，大多数城市和小镇都有这样的地点。彼此知道两人在朝向同样的目的地，而且彼此都知道对方知道这一点。


    在我们的思想实验中，那些感到困惑的通常是外地或外国学生。他们掌握了所需的知识，但没有必要的常识。实际上，他们可能会发现回答谢林的后续问题更容易：“你被告知会面的日期，但没有被告知具体的时间……你们两个必须猜测会面的确切时刻。你会在什么时间出现在会面地点？”所有人都会回答：“中午。”2
    这个时间甚至比地点更有标志性。


    托马斯·谢林的职业生涯受到战争的影响，特别是冷战。他的研究关注如何避免战争，并使人们能够在彼此最大的共同利益上达成共识。他所使用的工具是博弈论。当思考如何协调许多人的决策时，即使当他们都面向一个共同目标时，这些工具也可以说明这种协调何时会很困难，何时会很简单。


    这里我们感兴趣的是，当在一个系统中嵌入人工智能来帮助它做决策时，会如何改变所有决策协调的本质（无论是否使用人工智能），而答案的关键在于可靠性。


    谢林的地标实验表明，依靠与自己有相似知识基础的人是多么有用。在组织内部，这可能很重要，但通常我们的依靠来自对其他地方所做事情的预期。当其他人遵守规则时，这项任务通常很容易完成，我们可以将组织的不同部分黏合在一起。但是当规则转变为决策时，建立一个灵活系统所面临的挑战就显而易见了。我们通常不会一直向他人传达我们在做什么，因为这本身就是有成本的。相反，我们会对其他人可能在做什么产生预期，然后在自己的领域做出选择时，我们将行动与这些预期保持一致。如果这些预期不可靠，那么我们将很难协调所有的决策。


    事情并非一定如此。如果你可以设计系统，使预期一直可靠，你就可以从更好的预测中获得好处，从而带来服务客户的新方式。


    ## 人工智能长鞭效应


    可以想象你经营着一家餐厅。顾客进来点餐，然后厨师制作食物。这似乎相当简单，因为预期是一致的。在任何时间，厨师在制作餐点时都会受到限制。这些限制是由他们的技能、订单数量，以及食材和设备的供应情况所决定的。如果你让顾客点任何他们想要的菜肴，那就会出现问题。因此，你制作了菜单。限制顾客的选择，这样你才能真正做出他们点的菜。从厨房的角度来看，菜单本身就创造了可靠性，防止了意外的发生。


    你每周都需要订购食材，食材是由菜单决定的。如果菜单上有牛油果酱，你就需要购买牛油果。你每周订购 100 磅①。有时候 100 磅太多，你就会扔掉多余的部分；有时候
    100 磅太少，你就会错失销售机会。


    后来你采用了一种用于需求预测的人工智能技术，它奏效了。现在有几周你只需订购 30 磅的牛油果，而在其他周，你需要 300 磅。你的浪费减少了，销量增加了，因此利润提高了。


    你的当地供应商过去习惯每周为你购买 100 磅的牛油果。现在，它面临着来自你的更多的不可预测性。它的其他客户也在使用人工智能进行需求预测。需求开始大幅波动。


    因此，供应商决定采用一种人工智能技术，用于自己的需求预测。它过去每周订购 25 000 磅。现在，它的订购量在 5 000~50 000 磅波动。它的供应商同样也需要采用人工智能技术，然后其订单也开始波动。


    ① 1 磅约等于 0.45 千克。——编者注


    以此类推，一直到农作物种植者，他们需要提前一年或更长时间来为种植规模做出决策。


    我们将这种效应称为人工智能长鞭效应——采用人工智能技术改善了一个决策的质量，却降低了系统中其他决策的可靠性，从而损害了系统中其他人的利益。就像一条牛鞭，一个地方的小变化可能会在其他地方产生巨大的影响。


    人工智能可以用于解决不确定性，但除非可以在整个系统中实现决策的一致性，否则根本问题（需求与供应需要保持一致）并没有得到真正解决。就像牛鞭的摆动一样，你自己的解决方案会在整个过程中产生回响。


    我们陷入了一种悖论。人工智能的价值在于将你的行动与原本可能不确定的因素相匹配，从而做出更好的决策。但这样一来，你自己的决策对于他人来说就变得不那么可靠了，你可能会把承担不确定性的责任推给别人，这意味着不使用人工智能来调整不确定性，而是坚持使用更可靠的系统可能会更好。


    有两种方法来构建处理这种问题的人工智能系统解决方案：增强协调性或增强模块化。


    ## 协调的价值


    餐厅的人工智能可以预测需求。餐厅经理会做出其他一些决策，如菜单上提供什么菜。如果人工智能长鞭效应导致农作物种植者无法提供足够的牛油果，那么餐厅就需要改变菜单。只有在知道牛油果供应不足的情况下，才能做出这个决策。这就需要协调。


    这样的协同效应意味着重要的是考虑如何实现多个决策者之间的协调、可变化管理和调整，而不是进行转型和变革。


    为了理解这一点，让我们来思考一下有 8 位桨手的船队是如何运作的。一个船队在比赛中的表现取决于两项工作：一是桨手要保持一致的划桨节奏；二是桨手需要根据比赛的进展调整划桨速度，以确保没有一个或多个桨手在到达终点之前耗尽所有精力。坐在船尾的舵手对于第二项工作是必不可少的，但对于第一项工作却不是必需的。


    这似乎让人感到惊讶，因为舵手会喊着“划啊，划啊，划啊”，并协调所有桨手保持相同的节奏。但这并不需要另一个人来单独完成，其中一名桨手可以做到这一点，在没有舵手的比赛中就是如此。但是，如果要时刻紧盯比赛用到的策略并了解个别桨手的状态，也就是收集信息并将其汇总起来时，舵手就变得至关重要。舵手可以估测是否需要改变节奏，并相应地调整发送给桨手的指令。同样，如果整个比赛都使用相同的划桨节奏，那么就不需要舵手来发挥作用。舵手的存在正是因为船队希望对信息做出反应，但需要确保他们以协调性方式进行调整。


    对于这种同步问题，组织设计的前提是对协同效应的需求，因此模块化无法解决这个问题。对于经济学家保罗·米尔格罗姆和约翰·罗伯茨所说的分配问题，也需要同样类型的对信息的协调性反应。3
    这些问题涉及将资源分配给某个活动，但你知道只需要使用一定量的资源，多余的将会被浪费，而少于这个量则不够用。我们以救护车调度为例来看一下。如果发生医疗急救情况，那么一辆救护车是必要的，而两辆就会造成浪费。为了确保只有一辆救护车响应，需要一个中央调度员——无论是人还是软件——来接听关于急救情况的电话（即信息），然后指派一辆救护车响应。如果所有救护车都收到急救消息，然后各自选择是否响应，可能就会出现没有响应者或响应者过多的情况。在这种情况下，最好有一种协调性方式，因为利害关系重大，派这一辆救护车而不是另一辆救护车去处理紧急情况，远比一

    '
