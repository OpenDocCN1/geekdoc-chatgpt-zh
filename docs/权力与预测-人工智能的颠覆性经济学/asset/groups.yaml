  - '[PAGE 19]


    但在许多情况下，产品仍然卖不出去。即使改变了动力来源，能源账单可节省的幅度也是有限的，而且点解决方案没有给出使用更多电力的理由。


    # 应用解决方案企业家


    蒸汽机一旦启动就会一直运行，而电动机可以在关闭后重新启动。因此，尽管蒸汽动力是通过轴传递的，各机器操作员可以通过操作杠杆连接或脱离机器来控制动力，但是电动机操作员可以轻松地开关与各机器直接连接的电动引擎。后者更简单，需要的维护工作也少得多。³
    然而，这意味着工厂消耗的电力会因使用情况而异。正如经济历史学家内森·罗森伯格所言，这带来了一个“分散化电力”的时代，“现在能以非常小且成本较低的单位提供电力，且无须产生过量电力以提供小‘剂量’或间歇性的电力”。⁴


    对于电力价值，企业家认为要少量用电，或者更准确地说，只在需要时用电。尽管这种见解改变了一些工厂的设计，如为不同类型的机器设置独立电源，不过有一些工程师打算给每台机器都配备电动发动机。但即使对于一组机器，只在使用机器时支付电费也非常划算。


    重大的变革是将电力驱动安装在单台机器上，我们称之为应用解决方案，即不再简单地更换电源，而是换掉整个设备（应用设备）。而且，一些机器变得易于携带。这些工具不再被固定于一根中央轴上，而是可以四处移动。工作不再被机器牵着转，而是机器可以跟着工作走。


    不过这只是一种预期。现实情况是，任何单独的机床，如钻头、金属切割机或压力机，都必须进行全面重新设计，以利用独立的电动引擎。⁵ 此外，这些引擎通常不是现成的，而是需要根据特定机器或'
  - '[PAGE 20]


    用途量身定做的。由于设备需要被重新设计，因此应用解决方案的机会虽然多，但很难真正得到应用。如果你为工厂设计一个带有独立引擎的工具，那么就会降低发动机为其他工具提供动力的价值。然而，找到平衡需要重新设计许多工具，这意味着需要花费大量时间创建一个新的系统。


    # 系统解决方案企业家


    纵观整个工业革命，工厂都是为了利用蒸汽而设计的。正如我们所见，工厂的单一动力源通过挂着一根皮带和滑轮的中央轴将动力分配到各台机器上。对于现代人来说，这就是一台大型机器，里面的人只是其中的齿轮而已。从宏观上看，它是一个机械装置，其中数百个运动部件与单个动力入口相连，这一点并没有因为新动力的出现而发生改变。有了新设备，一些企业家就开始重新思考工厂的形式。设想一下，那里没有中央轴，甚至没有专门为一组机器设计的轴。如果让你根据现在对电力的了解从零开始设计工厂，它会是什么样子呢？


    工厂是为了让机器靠近动力源而建造的，这意味着纵向设计的多层车间有其优势。19 世纪末，狭窄多层的工厂在工作条件、安全性和机器性能方面都付出了一定的代价。在有了电力后，工厂就不再需要将所有东西都塞进狭小的空间内。


    更多的企业管理者意识到，电力的真正价值是提供一个系统解决方案，具体而言，是提供一个能够充分利用电力的系统。所谓系统，是指一套程序，它们共同确保某件事情得以完成。


    让我们思考一下工厂内部的空间经济学。在有了蒸汽与中央轴后，靠近中央轴的空间比其他地方更有价值。因此，工作都在靠近轴的地方进行，其他东西不是被储存起来就是被移走了。这意味着实物'
  - '[PAGE 21]


    必须根据动力需求来回移动。


    电力拉平了空间的经济价值，使其变得灵活。如今，在生产线上组织生产比较划算，这样可以缩短实物来回移动的距离，并将其从一个工序转移到下一个。亨利·福特没能利用蒸汽动力发明出
    T 型车的生产线，直到电力商业前景展现出来的几十年后，这一目标才得以实现。福特是一位汽车企业家，但他本质上也是一位系统解决方案企业家。这些系统变革改变了工业格局，直到这时，电气化才在生产力统计数据中大幅度地显现出来。⁶


    # 人工智能企业家


    我们可以得出三条结论。第一，实现巨大生产力的关键在于理解新技术的内涵。一个企业家如果在 1890 年向人们推销电力，可能会把“降低燃料成本”作为该技术的关键价值主张。但电力不是一种更便宜的蒸汽机，它的真正价值在于能够将能源使用与能源来源分离，这样用户就摆脱了距离的限制，工厂和工作流程设计也迎来了一系列的改进。一个企业家如果在
    1920 年向人们推销电力，就会发现电力的关键价值主张并不是“降低燃料成本”，而是“能极大地提高生产力的工厂设计”。


    这也是我们对人工智能的期待。最初的创业机会包括 Verafin 等点解决方案，它们通过更好、更快、更便宜的方式取代了其他预测方法。


    还有一些应用解决方案，需要围绕人工智能重新设计设备或产品。所有由人工智能驱动的机器人都是应用程序，设备上的人工智能增强软件也是如此。请看一下你的手机，它可以识别面部，这需要特殊的相机以及专门的硬件来保证信息安全。不过这种创新最大的推动'
  - '[PAGE 22]


    力可能是将数十亿美元的投资，用于设计和生产在现有道路条件下自动驾驶的车辆。尽管这些汽车的外观可能没什么变化，但必须重新设计其内部硬件，以保证传感器配置正确、车载处理及机器操作一切正常。


    大量高价值的潜在人工智能系统解决方案尚未出现。本书将阐述实现这些机会的可能性以及所面临的挑战。


    第二，一旦我们理解了这一点，就要问一个直截了当但难以回答的问题。鉴于我们现在对人工智能的了解，如果从头开始，那么将如何设计产品、服务或工厂呢？新的扁平化工厂架构最初并没有在传统行业中出现，而是出现在
    20 世纪的新兴行业中，如烟草、金属加工、运输设备和电气机械等。同样的情况重现在当今的新兴数字化行业中，如搜索、电子商务、流媒体和社交网络，它们早期采用了以人工智能为核心的系统设计。


    提到人工智能，我们仍然要回答这两个问题：（1）人工智能真正带给我们的是什么？（2）如果我们从头开始设计业务，那么将如何建立业务流程和商业模式？如果电力不是为了“降低燃料成本”，而是一个“能极大地提高生产力的工厂设计”，那么人工智能可能也不是为了“降低预测成本”，而是一个“能极大地提高生产力的产品、服务和组织设计”。电力的主要好处在于它将能源使用与其来源“脱钩”，从而促进了工厂设计的创新；人工智能的主要好处在于它将预测与决策的其他方面“脱钩”，从而通过重新构想决策之间的相互关系，促进了组织设计的创新。


    我们认为，通过将预测与决策的其他方面“脱钩”，并将预测从人类转移到机器，人工智能实现了系统级创新。决策是这种系统的关键构件，而人工智能增强了决策能力。


    第三，不同类型的解决方案提供了不同的获取市场权力的机会。'
  - '[PAGE 23]


    当企业家既能创造价值又能获取价值时，他们就能盈利。点解决方案的问题通常是最初创造的价值相对较少。电力曾是蒸汽的替代品，但蒸汽已经配套了现成的基础设施，因此替代并不是零成本的，并且这样做对消费者来说，价值就是降低电费。换句话说，点解决方案企业家可以通过最佳点解决方案获得持续的利润——Verafin
    正是如此——但这只是最好的情况。7


    随着我们转向应用解决方案，然后转向系统解决方案，企业家创造的价值变得更有说服力。新设备可以从竞争中脱颖而出，并受到专利等知识产权措施的保护。然而，新系统的潜力更大。在电力领域，工厂主提供新的工厂设计，这是在他们自己的领域里，他们懂得技巧，因此能够获得市场份额，并使自己免受竞争的影响。虽然工厂的布局是显而易见的，但新系统背后的流程、能力和培训可能就不那么明显了，而且难以复制。更重要的是，新系统可以实现规模化。


    # 人工智能的颠覆与权力


    电力系统花了几十年的时间才实现了所谓的“颠覆”。在最初的 20 年里，它只是一些工厂和应用中的点解决方案，或者被用来照明。但当新系统被开发出来后，它改变了经济。这一变化是深远的，它将权力转移到了控制电力发电、电网以及能在大规模生产中使用电力的人身上。在那之后，人们不再想成为皮带和滑轮的制造商，也不再想成为市中心工厂房地产的持有者。


    我们可以看到人工智能也在经历类似的过程。经济权力的真正转移，是将稀缺资源和资产的控制权从一群人手中转移到另一群人手中，这群人同时就有能力保护企业免受竞争压力。可以肯定的是，利用人工智能有机会做到这一点，但那些会造成颠覆的机会——重塑行'
  - '[PAGE 24]


    业和权力分配的机会——来自新系统。新系统很难被开发，正如我们将要探讨的，它们通常很复杂，很难被复制，这为那些能够在系统创新上有所突破的人创造了机会。


    但是仍然存在许多的不确定性。对人工智能而言，谁会从这些新技术中积累权力，是一个悬而未决的问题，这将取决于这些新系统的具体形态。我们的任务是为你指引方向，预测在人工智能系统的发展和采用过程中，谁可能获得权力，谁又可能失去权力。


    # 本章要点


    +   三位企业家的寓言故事发生在 100 多年前，其焦点是能源市场，说明了不同企业家如何抓住同一技术转变（从蒸汽到电力）来开发不同的价值主张：点解决方案（降低动力成本和摩擦导致的能量损失——没有改变工厂的系统设计）；应用解决方案（在每台机器上安装独立的电动发动机——机器是模块化的，因此一台机器的停工不会影响其他机器——没有改变工厂的系统设计）；系统解决方案（重新设计工厂——轻量化结构，单层，在空间布局、工人与材料流动方面优化了工作流程）。


    +   一些价值主张更具吸引力。在电力方面，点解决方案和应用解决方案的前提是在不改变系统设计的情况下直接用电力取代蒸汽，但产生的价值有限，而最初行业采用电力速度的缓慢就体现了这一点。随着时间的推移，一些企业家发现了提供系统解决方案的机会，他们利用电力将机器与电源“脱钩”，这对于蒸汽是不可能的，或者成本太高。在许多情况下，系统解决方案的价值远超点解决方案的价值。


    +   正如电力使机器与电源“脱钩”，从而促进价值主张从“降低'
  - '[PAGE 25]


    燃料成本” 转移到“能极大地提高生产力的工厂设计”一样，人工智能将预测与决策的其他方面“脱钩”，从而促进价值主张从“降低预测成本”转移到“能极大地提高生产力的产品、服务和组织设计”。'
