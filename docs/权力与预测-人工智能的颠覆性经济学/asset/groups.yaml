    进行探索。具体而言，如果你拥有高精度的预测机器，为了达成目标，你需要在你的行业中做出基础的重要决策。就其本质而言，人工智能预测将在决策层面进入任何组织。但了解一个决策或决策类型如何影响其他决策，是了解人工智能如何对整个系统产生影响的第一步。


