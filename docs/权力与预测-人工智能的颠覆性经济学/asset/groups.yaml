    “我感觉很幸运”并不是一个新按钮。它从 1998 年起就出现在了谷歌网站的首页上（见图 11–2），尽管谷歌非常想保持其首页简约的设计风格，但它仍然被保留了下来。“我感觉很幸运”按钮最初是由谷歌的联合创始人谢尔盖·布林设计的，他认为这是彰显谷歌搜索性能的一种方式。2007
    年，布林表示，只有 1% 的谷歌用户很幸运，因为点击了该按钮的搜索量只有这么多。与此同时，保留该按钮使谷歌损失了 1 亿美元的广告收入。出于品牌推广的考虑，谷歌保留了这个按钮，从而让整个搜索过程保持人性化，否则就是纯粹的人工智能操作了。⁴


    ![](img/5d7d0b82a68fe65c345bd809e0cf66b2_160_0.png)


    ## 图 11-2 谷歌网站首页（1998 年）


    资料来源：谷歌和谷歌标识是谷歌有限责任公司的商标，请参见 https://about.google/brand-resource-center/products-and-services/search-guidelines/。


    为什么我们不觉得幸运呢？答案很简单——排在首位的搜索结果通常不是我们想要的。我们浏览首页并选择某个网站，进入之后可能意识到它不对，于是我们会返回选择另一个链接。从谷歌的角度来看，它无法做得更好。如果有人在谷歌上搜索“预测机器”（prediction
    machines）并点击“我感觉很幸运”按钮，他们将进入我们第一本书的网站（predictionmachines.ai）。但如果他们想从亚马逊购买该书呢？在这种情况下，以上操作就不是获取该信息的最有效途径了。如果他们不想要这本书，而是一篇摘要文章呢？谷歌并不知道你可能会做出什么决定。在没有这种信息的情况下，它为你提供最佳的猜测，但留出空间让你自己做判断来完成整个过程。谷歌可能想要成为一个决策机器，但在没有判断力的情况下，它无法成为你的决策机器。因此，它只能在预测方面发挥作用，剩下的操作则留给你自己。当然，这也不错，因为你可能会选择点击广告。


    谷歌搜索的例子说明让决策自动化是多么困难。虽然很难，但并非不可能。截至撰写本书时，谷歌的运气还不错。随着语音助手搜索的出现，人们提出的查询问题越来越具体，对于这些问题，谷歌能够给出更明确且更有把握的答案。因此，对于许多更常见或意图更清晰的查询，无论是语音搜索还是其他搜索方式，谷歌都能提供清晰的答案，甚至不需要访问其他网站以获取更多的信息。对于其他情况，即使使用语音搜索，谷歌也会将用户引导到屏幕前让他们做决策。Alexa
    或 Siri 等其他语音搜索也是如此。这个过程类似于 Ada 的工作过程。当发生这种情况时，谷歌的机器会观察所做的选择，并使用这些信息更新其预测。人是该系统中至关重要的一部分。


    当预测足够准确且判断和行动明确时，就可以实现自动化。否则，就需要人来做决策。这个过程被称为“例外情况下的判断”。正如作家简妮尔·沙恩所评论的那样，当背景和目标非常明确时，人工智能的工作效果更好。5
    解决方案通常是为新情况引入判断，但在十分复杂的情况下，人工智能的建议有时可能存在问题。


    由此可见，我们很可能已经形成了适当的判断，并且能够为比较常见的情况描述这种判断。对于这些情况，我们可以将判断编码到自动化过程中并获得不错的结果。而在不常见的情况下，这种编码是不可能的。当我们意识到这些情况时，与其期望机器自动化处理所有情况，不如实施混合解决方案更加合适。其中的关键就是，当一种情况超出了已编码进机器的判断范围时，机器就会知道并将其传达给人类，然后由人类决定该如何处理。


    综上所述，人工智能的预测并不完美。为了降低犯错的风险，我们采取了两种策略：在部署人工智能前，我们对突发情况进行研究，并得出机器在面对突发情况时应该做出怎样选择的结论；在部署人工智能后，我们承认并非所有突发情况都会被涵盖在内，因此我们将依靠人类介入并做出决策。随着人工智能预测的改进，我们需要为这两项判断功能分配更多的人力资源。换句话说，例外情况需要包括人机协作的系统设计。


    ## 规模化判断的责任


    有时通过事先明确判断标准，可以完全让决策过程自动化。当你刷卡时，你启动了一系列算法，它们会决定是否接受或拒绝该交易。在你刷卡前，能够处理何种交易的决策就已经形成了。


    没有人工智能可以做出这些判断，这些判断也无法以去中心化的方式切实且合理地完成。相反，判断是在数百万个接受或拒绝决策之前做出的，然后被编码以供大规模使用。机器不会做决策，但可以改变做决策的人，无论是在做决策时拿主意的人，还是在做出特定决策前判断何事重要的人。


    这让我们明白为何机器能解雇员工的想法会产生如此大的影响。机器无法解雇（或雇用）员工。相反，是一个人（或一群人）在做出判断选择标准来告诉机器如何使用预测以做出选择，实际上是这个人（或这群人）做出了决策。更普通的情况是，没有人因机器而失去工作，他们失去工作是因为有人决定给机器人编程。


    不知为何，我们进入了一个特别容易责怪机器的时代，而最终这些都是人类的行为，这是一个有趣的问题。具有讽刺意味的是，资本主义的特点之一 ——正如弗里德里希·哈耶克所强调的——是它允许个体决策者行动，按照我们的说法就是对选择进行个人判断。正如历史学家刘易斯·蒙福德所观察到的：“正是由于资本主义的某些特征，机器（一个中立的参与者）在社会中似乎成了恶劣的元素，对人的生命漫不经心，对人的利益漠不关心。机器因资本主义的罪恶而受罚。”的确，“资本主义”一词似乎唤起了机器的力量。但事实上，拥有权力的是将判断编码进机器的人。这些人是负有责任的，法律和监管体系需要认识到这一点。


    机器自动化的问题在于它模糊了对决策负有最终责任的人。编码判断意味着一个人的决策可以具有超乎寻常的规模。出于各种原因，我们希望知道这个人是谁。毕竟，如果没有对责任的明确界定，一个人如何对决策负责呢？当我们认为有可能实现从即时判断并做出决策，转变为在做决策前将判断进行编码，同时远离决策地点时，一个新的系统设计就十分具有必要性。我们将在第十三章中详细探讨这个问题。


    在反驳了“机器拥有权力”的论点后，我们将转向人工智能的另一个方面，这个方面往往与被机器控制的恐惧并存，那就是反馈。预测机器是学习机器。在某些设置中，它们可以被编程为持续学习和自动更新，这是它们价值的关键部分，它们可以随着环境的变化而发展。但与此同时，当涉及权力时，一台领先的机器就可以保持领先。在这个过程中，与之竞争就变得更加困难。人工智能采用者的累积权力就是我们接下来要考虑的问题。


    ## 本章要点


    - 机器无法做出决策。然而，人工智能可以让人们误以为机器在做决策。当我们能够将判断进行编码时，机器就会显得像在做决策。人工智能生成预测，然后机器利用编码化的人类判断执行操作（决策）。

    - 人工智能的预测是不完美的。为了降低犯错的风险，我们采取两种策略。其一，在部署人工智能前，我们考虑各种突发情况并得出结论，即针对每种突发情况机器应该采取的行动。其二，在部署人工智能后，如果人工智能无法以足够高的置信度进行预测，或其预测的情景是我们尚未编码判断的情况，此时就需要人类的介入（人类参与决策过程）。

    - 尽管机器本身没有权力，但它们可以在规模化中创造权力，也可以通过改变在何时何地使用谁的判断等决策来重新分配权力。基于人工智能的系统可以将判断与决策分离，从而在不同的时间和地点提供判断。如果判断从人们对每项决策的单独部署转变为软件中的编码，那么这可能导致市场份额的变化，从而引起规模扩大和权力转移，以及决策者的变更——由过去做出判断的人转变为将判断进行编码的人，或者拥有嵌入判断系统的人。


    ## 第十二章


    ## 积聚权力


    既然系统层面的创新这么难，那么为何不让竞争对手去承担所有的痛苦和代价来摸索，然后再抄他们的“作业”呢？这是因为人工智能赋予了先行者优势。人工智能可以学习，而且它部署得越早，就能越早地开始学习。它学得越多，预测的准确性就越高。它越准确，新系统就越有效。高速发展的飞轮一下子就转起来了。因此，风险投资界的一些人会特别积极地投资看似还在起步阶段的人工智能项目。学习来自数据，所以先发优势来自数据中的反馈循环。


    BenchSci 是一家医药领域的人工智能公司，其目标是缩短药物研发的时间。它面临的挑战是如何帮助科学家大海捞针：在大量已发表的科学研究成果和制药公司的内部数据库中找到潜藏在其中的特定信息。为了将候选新药推进到临床试验阶段，科学家必须进行实验。BenchSci
    意识到，如果科学家能够从先前的大量实验中获得更好的见解，他们就可以减少实验次数，提高实验成功率。


    通过使用机器学习对科学研究进行阅读、分类，然后提出见解，BenchSci 发现科学家只需进行通常所需实验次数的一半，就能将一种药物推进到临床试验阶段。通过从已发表的文献中找到合适的工具（这里指的是生物试剂——影响和测量蛋白质表达的重要工具），而不是从头开始重新发现，生产候选新药的时间可以大大缩短。所有这些都有望每年节省
    170 多亿美元。在一个研发回报率已变得非常低的行业，这可能会改变整个市场。此外，将新药更快地推向市场，还可以拯救许多生命。


    这里最引人注目的是，BenchSci 所做的就是谷歌在互联网上一直做的事情：搜索。它只是在一个专门的领域做这件事。如果没有机器学习，BenchSci 将无法处理已发表的生物医学研究成果，也无法通过能够为其客户节约实际成本的方式进行解读。就像谷歌可以帮你找到修理洗碗机的方法，而不需要你长途跋涉去图书馆一样，BenchSci
    能帮助科学家在不进行一系列实验的情况下确定合适的试剂。在 BenchSci 出现之前，科学家通常会使用谷歌或 PubMed 搜索文献（花费几天），然后阅读文献（再花费几天），在订购和测试
    3~6 种试剂后才会选择其中一种（耗时几周）。现在，他们可以在 BenchSci 上搜索（仅需几分钟），然后订购和测试 1~3 种试剂，最后选择其中一种。这意味着更少的测试数量和花费更少的时间。


    BenchSci 是否需要担心来自谷歌的竞争？这取决于其能否围绕业务建立一道坚固可守的护城河，而这又取决于人工智能数据的性质。¹


    ## 数据与预测业务


    要了解在人工智能时代如何竞争，首先需要考虑如何才能产生更好、成本更低的预测。现实中并不存在哈利·波特的魔杖，用手一挥就能得到人工智能。相反，这需要识别和管理生成预测的要素，以及将这些要素联系起来的数据。


    因此，预测业务就是获得更好、成本更低的算法和数据。那这些东西从哪里来呢？首先是算法。要构建预测算法，需要用输入数据（如图像）和输出数据（如描述这些图像内容的文字）对模型进行训练，这就需要训练数据。训练数据做得越好，预测算法的起点表现就会越好。许多企业面临的主要挑战是，它们要么必须自己创建所需的训练数据（如聘请专家对事物进行分类），要么从其他来源采购训练数据（如从健康记录中获取）。


    训练数据只是一切的开始。人工智能与其他工具的不同之处在于它能够学习，使用次数越多，效果越好。人工智能从反馈中学习，它收集数据并进行预测，随后人工智能可以观察预测是否实现。如果预测按预期发生，人工智能对其算法就会更有信心；如果预测没有按预期发生，人工智能就会学习如何改进其对未来的预测。


    由于底层环境的变化，人工智能模型通常需要使用最新的数据进行重新训练。比如，导航应用需要随着道路变化和人口在某一地点的流动而不断更新，定向广告也需要随着消费习惯的变化而更新。因此，人工智能模型会过时，预测也会随着时间的推移而变得更糟糕。


    尽管新的训练数据可以解决这个问题，但在某些情况下，有目的地收集新数据以适应每种新情况，在动态环境中保持预测准确性的最佳方法也许是用我们所说的反馈数据持续更新模型。反馈数据是通过不断衡量预测表现而产生的。为了做到这一点，需要人们独立收集与预测准确性相关的信息，并将该信息与生成这些预测的输入数据相匹配。将这些数据结合起来，就可以得到反馈数据，并用于更新算法。


    例如，在手机用你的图像进行安全验证前，你首先要对手机进行面部识别训练，之后，即使你的面部发生变化，你也不需要再对其进行训练。你可能戴上了眼镜，头发变长，或者化了妆。在这些情况下，你是手机主人的这个预测就会变得不太可靠。因此，你的手机会

    '
  mdcn: '

    赶出去。亚马逊所做的是衡量员工的表现，使用人工智能评估员工的表现是否有问题，然后由人类经理决定如何处理。如果经理盲目地依赖人工智能的预测，就会给人一种机器控制决策的感觉，就像经理只根据指标来做事一样。在这方面，它与任何绩效衡量方案无异，与我们大多数人需要面对的一些更主观的方案相比，它远没有那么糟糕。


    但是，如果这些头条新闻都是真实的，那么你真的会在没有人类参与的情况下被评估然后遭到解雇吗？机器将决定谁能得到工作吗？现在机器是资产阶级而我们是无产阶级吗？


    我们将在本章中证明答案当然是“不”。机器人和机器通常不做任何决策，因此它们没有权力。决策的基础是人或一群人。部分事情可以被自动化，并让人觉得是机器在做决策，但这是一种幻觉。从我们目前的人工智能水平来看，真正的决策是由人类做出的。


    我们并不是为了提出某种哲学观点而说的这些话，这个就由别人来争论吧。如果我们要正确评估人工智能的颠覆潜力，我们就必须接受机器不会做决策的事实。虽然人工智能无法将决策交给机器，但它可以改变做决策的人。尽管机器没有权力，但一旦部署，它们就能改变权力的拥有者。


    当机器改变决策者时，基础系统也必须随之改变。制造机器的工程师需要明白将判断力嵌入产品中的后果，因为可能不再需要能马上做出决策的人了。


    机器不做决策的观点并不新鲜。埃达·洛夫莱斯在 1842 年编写了第一个计算机程序，她指出了这一局限性：


    > 埃达警告读者，如果用户输入“不真实”的信息，计算机将无计可施。今天，我们称之为“垃圾进，垃圾出”。她是这样说的：“分析引擎不会自凭创造任何东西。我们让它做什么，它就会做什么。它能仿效分析过程，但它无法预见任何类比关系或者真理。”¹


    机器无法自主行动，只会遵循外部指令。


    让我们来考虑一下亚马逊解雇算法的假定版本，即在没有人类参与的情况下衡量绩效并解雇员工。在编写这个算法时，编写者必须明确判断标准，包括如何衡量现行工资、替代雇员的可用性、培训要求，以及工作场所的法律规定等因素；以及如何衡量概率性因素，比如人工智能对员工的预期技能、能力和文化适应性的预测。某个工程师可能一直在尝试完善一个程序，但更有可能的是，如果部署这样的自动化系统，判断标准就会来自一个更加深思熟虑的过程。我们需要建立一个新的决策系统。


    将我们很容易想到整个决策过程交给机器来完成。然而，决策的执行可能会完全自动化，但在预测后采取什么行动仍然是由一个或多个人决定的。


    ## 走向全球


    因为人工智能实现了自动化，机器似乎可以做出决策。预测机器可以改变决策的时间和地点，使人类能够进行审议，判断在出现情况时应该采取什么行动，然后将其编码到机器中。


    自动化需要对判断进行编码。在部署机器时，人类必须明确判断标准，而不是在接收预测后再去做。这意味着判断必须对大量决策有用，并且必须以能够编码的方式描述出来，但这并不容易。


    多伦多初创公司 Ada 用于自动化客户服务的过程值得借鉴，² Ada 的创始人将其描述为推动公司与客户之间互动的自动化层。


    2020 年上半年，在新冠病毒出现前后，Ada 为 Zoom（多人手机云视频会议软件）提供了客户服务背后的自动化层，Zoom 的日活跃用户从 1 000 万增长到
    3 亿。³Ada 自动化了 70% 的销售电话、98% 的免费客户服务互动以及 85% 的付费客户服务互动。如果你需要重置 Zoom 密码或摄像头无法使用，很有可能是因为你与
    Ada 的自动代理进行了交流。


    建立判断的过程至关重要。Ada 的工作过程始于预测客户在发起服务互动时的意图。客户的意图可能是更改密码、更新信用卡信息或升级到更全面的服务。Ada 可能只从一个能够确信完成的预测开始：客户想要更改密码。


    然后，Ada 开发工作流程并做出判断。工作流程是一组操作，用于帮助客户更改密码。如果机器确信客户想要更改密码，Ada 就会启动更改密码的自动化工作流程。否则，Ada
    会将其转交人工处理。


    这就是判断发挥作用的地方。在启动自动化流程之前，Ada 应该有多大的把握？这要视情况而定。在与免费客户的互动中，有 98% 的免费客户可以实现自动化，而付费客户的这一数据只有
    85%，造成这种差别的原因并不仅仅是免费客户的询问更简单，Ada 认为在处理付费客户的问题时犯错的后果更加严重、风险更高，因此允许自动化的门槛更高。


    当 Ada 收集有关来电查询和客户意图的数据时，它会构建更多的自动化工作流程。除了密码重置，它还可以更新信用卡、解决各种技术问题，以及确定哪些查询是销售电话，包括购买付费服务或升级到更高级别服务的电话。


    现在判断变得尤为重要。搞砸一次销售电话的后果比搞砸一次密码修复更严重。为了做好这项工作，Ada 需要获取数据和决策过程，以确定哪些来电查询应自动化处理。一些决策权从客户服务代表手中转移到了公司管理层和
    Ada 的工程师手中。更好地预测客户意图为自动化创造了机会。但是，是否值得利用这个机会取决于人的判断，即权衡自动化的好处与犯错的代价。要做好这一切，需要对数据收集、决策制定和责任分配进行系统变革。


    ## 你觉得幸运吗


    关于机器是否拥有权力的另一个担忧是，预测机器现在通常负责为我们提供信息，帮助我们理解世界并做出决策，从购物到给谁投票都是如此。如果机器为我们提供信息，那么我们的权力是否正被悄然削弱？正如我们在这里所看到的，我们与预测机器的关系并非单向的。它提供信息并影响我们，但我们也向机器提供信息，用于改变机器的预测结果。换句话说，从经济的角度来看，机器（及其所有者）并没有掌控一切。它们需要我们来维护其质量。因此，尽管你可能感觉没有控制权，但实际上你拥有的权力要比你想象中多。


    让我们来思考一下现在最接近超级人工智能的东西：谷歌搜索（一台预测机器）。你向它提出一个问题，甚至只是几个你想知道更多信息的关键词，它就会检索网站，然后给你一个（有时达数万个）列表。谷歌会把你最可能想要的网站排在首位，然后依次排列。以前，这些排序主要是由
    PageRank 决定的，这是拉里·佩奇创建的一个评分系统，该系统会假定你需要一个能够链接到其他网站的网站。现在，有了数万亿次搜索和点击的数据基础，谷歌排名就是一种基于深度学习的预测，它不仅会考虑过去其他人做了什么，而且会持续更新，并利用对你的了解提供个性化的排名——只为你定制。你是不是感觉很幸运呢？


    事实证明，你也许没那么幸运。因为大多数人不是在谷歌的首页（www.google.com）上进行搜索的，所以人们可能没有注意到首页上的两个按钮（见图 11–1）。当你输入搜索词时，你可以点击“谷歌搜索”（Google
    Search）按钮，然后看到熟悉的网站排名列表，以及资助整个操作的广告。但在“谷歌搜索”按钮旁边，还有另一个按钮——“我感觉很幸运”（I’m Feeling
    Lucky）。如果你点击这个按钮，就会进入列表中排名第一的网站。而事实上，我们很少点击这个按钮，因为我们感觉没那么幸运。所以这些预测结果不够好。


    ![](img/5d7d0b82a68fe65c345bd809e0cf66b2_159_0.png)


    ## 图 11–1 谷歌网站首页（2001 年）


    资料来源：谷歌和谷歌标识是谷歌有限责任公司的商标，请参见 https://about.google/brand-resource-center/products-and-services/search-guidelines/。


    “我感觉很幸运”并不是一个新按钮。它从 1998 年起就出现在了谷歌网站的首页上（见图 11–2），尽管谷歌非常想保持其首页简约的设计风格，但它仍然被保留了下来。“我感觉很幸运”按钮最初是由谷歌的联合创始人谢尔盖·布林设计的，他认为这是彰显谷歌搜索性能的一种方式。2007
    年，布林表示，只有 1% 的谷歌用户很幸运，因为点击了该按钮的搜索量只有这么多。与此同时，保留该按钮使谷歌损失了 1 亿美元的广告收入。出于品牌推广的考虑，谷歌保留了这个按钮，从而让整个搜索过程保持人性化，否则就是纯粹的人工智能操作了。⁴


    ![](img/5d7d0b82a68fe65c345bd809e0cf66b2_160_0.png)


    ## 图 11-2 谷歌网站首页（1998 年）


    资料来源：谷歌和谷歌标识是谷歌有限责任公司的商标，请参见 https://about.google/brand-resource-center/products-and-services/search-guidelines/。


    为什么我们不觉得幸运呢？答案很简单——排在首位的搜索结果通常不是我们想要的。我们浏览首页并选择某个网站，进入之后可能意识到它不对，于是我们会返回选择另一个链接。从谷歌的角度来看，它无法做得更好。如果有人在谷歌上搜索“预测机器”（prediction
    machines）并点击“我感觉很幸运”按钮，他们将进入我们第一本书的网站（predictionmachines.ai）。但如果他们想从亚马逊购买该书呢？在这种情况下，以上操作就不是获取该信息的最有效途径了。如果他们不想要这本书，而是一篇摘要文章呢？谷歌并不知道你可能会做出什么决定。在没有这种信息的情况下，它为你提供最佳的猜测，但留出空间让你自己做判断来完成整个过程。谷歌可能想要成为一个决策机器，但在没有判断力的情况下，它无法成为你的决策机器。因此，它只能在预测方面发挥作用，剩下的操作则留给你自己。当然，这也不错，因为你可能会选择点击广告。


    谷歌搜索的例子说明让决策自动化是多么困难。虽然很难，但并非不可能。截至撰写本书时，谷歌的运气还不错。随着语音助手搜索的出现，人们提出的查询问题越来越具体，对于这些问题，谷歌能够给出更明确且更有把握的答案。因此，对于许多更常见或意图更清晰的查询，无论是语音搜索还是其他搜索方式，谷歌都能提供清晰的答案，甚至不需要访问其他网站以获取更多的信息。对于其他情况，即使使用语音搜索，谷歌也会将用户引导到屏幕前让他们做决策。Alexa
    或 Siri 等其他语音搜索也是如此。这个过程类似于 Ada 的工作过程。当发生这种情况时，谷歌的机器会观察所做的选择，并使用这些信息更新其预测。人是该系统中至关重要的一部分。


    当预测足够准确且判断和行动明确时，就可以实现自动化。否则，就需要人来做决策。这个过程被称为“例外情况下的判断”。正如作家简妮尔·沙恩所评论的那样，当背景和目标非常明确时，人工智能的工作效果更好。5
    解决方案通常是为新情况引入判断，但在十分复杂的情况下，人工智能的建议有时可能存在问题。


    由此可见，我们很可能已经形成了适当的判断，并且能够为比较常见的情况描述这种判断。对于这些情况，我们可以将判断编码到自动化过程中并获得不错的结果。而在不常见的情况下，这种编码是不可能的。当我们意识到这些情况时，与其期望机器自动化处理所有情况，不如实施混合解决方案更加合适。其中的关键就是，当一种情况超出了已编码进机器的判断范围时，机器就会知道并将其传达给人类，然后由人类决定该如何处理。


    综上所述，人工智能的预测并不完美。为了降低犯错的风险，我们采取了两种策略：在部署人工智能前，我们对突发情况进行研究，并得出机器在面对突发情况时应该做出怎样选择的结论；在部署人工智能后，我们承认并非所有突发情况都会被涵盖在内，因此我们将依靠人类介入并做出决策。随着人工智能预测的改进，我们需要为这两项判断功能分配更多的人力资源。换句话说，例外情况需要包括人机协作的系统设计。


    ## 规模化判断的责任


    有时通过事先明确判断标准，可以完全让决策过程自动化。当你刷卡时，你启动了一系列算法，它们会决定是否接受或拒绝该交易。在你刷卡前，能够处理何种交易的决策就已经形成了。


    没有人工智能可以做出这些判断，这些判断也无法以去中心化的方式切实且合理地完成。相反，判断是在数百万个接受或拒绝决策之前做出的，然后被编码以供大规模使用。机器不会做决策，但可以改变做决策的人，无论是在做决策时拿主意的人，还是在做出特定决策前判断何事重要的人。


    这让我们明白为何机器能解雇员工的想法会产生如此大的影响。机器无法解雇（或雇用）员工。相反，是一个人（或一群人）在做出判断选择标准来告诉机器如何使用预测以做出选择，实际上是这个人（或这群人）做出了决策。更普通的情况是，没有人因机器而失去工作，他们失去工作是因为有人决定给机器人编程。


    不知为何，我们进入了一个特别容易责怪机器的时代，而最终这些都是人类的行为，这是一个有趣的问题。具有讽刺意味的是，资本主义的特点之一 ——正如弗里德里希·哈耶克所强调的——是它允许个体决策者行动，按照我们的说法就是对选择进行个人判断。正如历史学家刘易斯·蒙福德所观察到的：“正是由于资本主义的某些特征，机器（一个中立的参与者）在社会中似乎成了恶劣的元素，对人的生命漫不经心，对人的利益漠不关心。机器因资本主义的罪恶而受罚。”的确，“资本主义”一词似乎唤起了机器的力量。但事实上，拥有权力的是将判断编码进机器的人。这些人是负有责任的，法律和监管体系需要认识到这一点。


    机器自动化的问题在于它模糊了对决策负有最终责任的人。编码判断意味着一个人的决策可以具有超乎寻常的规模。出于各种原因，我们希望知道这个人是谁。毕竟，如果没有对责任的明确界定，一个人如何对决策负责呢？当我们认为有可能实现从即时判断并做出决策，转变为在做决策前将判断进行编码，同时远离决策地点时，一个新的系统设计就十分具有必要性。我们将在第十三章中详细探讨这个问题。


    在反驳了“机器拥有权力”的论点后，我们将转向人工智能的另一个方面，这个方面往往与被机器控制的恐惧并存，那就是反馈。预测机器是学习机器。在某些设置中，它们可以被编程为持续学习和自动更新，这是它们价值的关键部分，它们可以随着环境的变化而发展。但与此同时，当涉及权力时，一台领先的机器就可以保持领先。在这个过程中，与之竞争就变得更加困难。人工智能采用者的累积权力就是我们接下来要考虑的问题。


    ## 本章要点


    - 机器无法做出决策。然而，人工智能可以让人们误以为机器在做决策。当我们能够将判断进行编码时，机器就会显得像在做决策。人工智能生成预测，然后机器利用编码化的人类判断执行操作（决策）。

    - 人工智能的预测是不完美的。为了降低犯错的风险，我们采取两种策略。其一，在部署人工智能前，我们考虑各种突发情况并得出结论，即针对每种突发情况机器应该采取的行动。其二，在部署人工智能后，如果人工智能无法以足够高的置信度进行预测，或其预测的情景是我们尚未编码判断的情况，此时就需要人类的介入（人类参与决策过程）。

    - 尽管机器本身没有权力，但它们可以在规模化中创造权力，也可以通过改变在何时何地使用谁的判断等决策来重新分配权力。基于人工智能的系统可以将判断与决策分离，从而在不同的时间和地点提供判断。如果判断从人们对每项决策的单独部署转变为软件中的编码，那么这可能导致市场份额的变化，从而引起规模扩大和权力转移，以及决策者的变更——由过去做出判断的人转变为将判断进行编码的人，或者拥有嵌入判断系统的人。


    ## 第十二章


    ## 积聚权力


    既然系统层面的创新这么难，那么为何不让竞争对手去承担所有的痛苦和代价来摸索，然后再抄他们的“作业”呢？这是因为人工智能赋予了先行者优势。人工智能可以学习，而且它部署得越早，就能越早地开始学习。它学得越多，预测的准确性就越高。它越准确，新系统就越有效。高速发展的飞轮一下子就转起来了。因此，风险投资界的一些人会特别积极地投资看似还在起步阶段的人工智能项目。学习来自数据，所以先发优势来自数据中的反馈循环。


    BenchSci 是一家医药领域的人工智能公司，其目标是缩短药物研发的时间。它面临的挑战是如何帮助科学家大海捞针：在大量已发表的科学研究成果和制药公司的内部数据库中找到潜藏在其中的特定信息。为了将候选新药推进到临床试验阶段，科学家必须进行实验。BenchSci
    意识到，如果科学家能够从先前的大量实验中获得更好的见解，他们就可以减少实验次数，提高实验成功率。


    通过使用机器学习对科学研究进行阅读、分类，然后提出见解，BenchSci 发现科学家只需进行通常所需实验次数的一半，就能将一种药物推进到临床试验阶段。通过从已发表的文献中找到合适的工具（这里指的是生物试剂——影响和测量蛋白质表达的重要工具），而不是从头开始重新发现，生产候选新药的时间可以大大缩短。所有这些都有望每年节省
    170 多亿美元。在一个研发回报率已变得非常低的行业，这可能会改变整个市场。此外，将新药更快地推向市场，还可以拯救许多生命。


    这里最引人注目的是，BenchSci 所做的就是谷歌在互联网上一直做的事情：搜索。它只是在一个专门的领域做这件事。如果没有机器学习，BenchSci 将无法处理已发表的生物医学研究成果，也无法通过能够为其客户节约实际成本的方式进行解读。就像谷歌可以帮你找到修理洗碗机的方法，而不需要你长途跋涉去图书馆一样，BenchSci
    能帮助科学家在不进行一系列实验的情况下确定合适的试剂。在 BenchSci 出现之前，科学家通常会使用谷歌或 PubMed 搜索文献（花费几天），然后阅读文献（再花费几天），在订购和测试
    3~6 种试剂后才会选择其中一种（耗时几周）。现在，他们可以在 BenchSci 上搜索（仅需几分钟），然后订购和测试 1~3 种试剂，最后选择其中一种。这意味着更少的测试数量和花费更少的时间。


    BenchSci 是否需要担心来自谷歌的竞争？这取决于其能否围绕业务建立一道坚固可守的护城河，而这又取决于人工智能数据的性质。¹


    ## 数据与预测业务


    要了解在人工智能时代如何竞争，首先需要考虑如何才能产生更好、成本更低的预测。现实中并不存在哈利·波特的魔杖，用手一挥就能得到人工智能。相反，这需要识别和管理生成预测的要素，以及将这些要素联系起来的数据。


    因此，预测业务就是获得更好、成本更低的算法和数据。那这些东西从哪里来呢？首先是算法。要构建预测算法，需要用输入数据（如图像）和输出数据（如描述这些图像内容的文字）对模型进行训练，这就需要训练数据。训练数据做得越好，预测算法的起点表现就会越好。许多企业面临的主要挑战是，它们要么必须自己创建所需的训练数据（如聘请专家对事物进行分类），要么从其他来源采购训练数据（如从健康记录中获取）。


    训练数据只是一切的开始。人工智能与其他工具的不同之处在于它能够学习，使用次数越多，效果越好。人工智能从反馈中学习，它收集数据并进行预测，随后人工智能可以观察预测是否实现。如果预测按预期发生，人工智能对其算法就会更有信心；如果预测没有按预期发生，人工智能就会学习如何改进其对未来的预测。


    由于底层环境的变化，人工智能模型通常需要使用最新的数据进行重新训练。比如，导航应用需要随着道路变化和人口在某一地点的流动而不断更新，定向广告也需要随着消费习惯的变化而更新。因此，人工智能模型会过时，预测也会随着时间的推移而变得更糟糕。


    尽管新的训练数据可以解决这个问题，但在某些情况下，有目的地收集新数据以适应每种新情况，在动态环境中保持预测准确性的最佳方法也许是用我们所说的反馈数据持续更新模型。反馈数据是通过不断衡量预测表现而产生的。为了做到这一点，需要人们独立收集与预测准确性相关的信息，并将该信息与生成这些预测的输入数据相匹配。将这些数据结合起来，就可以得到反馈数据，并用于更新算法。


    例如，在手机用你的图像进行安全验证前，你首先要对手机进行面部识别训练，之后，即使你的面部发生变化，你也不需要再对其进行训练。你可能戴上了眼镜，头发变长，或者化了妆。在这些情况下，你是手机主人的这个预测就会变得不太可靠。因此，你的手机会

    '
