    有趣的是，新预测机器的出现为何引发了对决策权的争夺？因为预测对弗林特市的政治家而言不利，所以他们放弃了预测。其他人则认识到，只要每个家庭都被判定为具有同等价值，这些预测就可以改善生活。经过一场法庭案件，决策权发生了改变，法院的和解协议预先确定了判断，地方政治家失去了自由裁量权，集中式系统取得了胜利。


    当预测机器导致判断与预测“脱钩”时，就有机会将判断的重心转移给他人。正如我们所注意到的，谁拥有判断力，谁就将最终做决策。谁应该做决策和谁最终做决策都可能会发生改变。本章将探讨新的裁决者可能在何时出现并对决策负责。


    更重要的是，在此过程中，由于新系统的采用产生了变革，从而出现了抵制力量，我们强调了这股力量的重要来源。当我们引入颠覆时，我们注意到通常会有赢家和输家。输家可能是整个组织的各个部分，如反对流媒体视频的百视达特许经营商。由于经济权力的变化，该组织在内部采用变革时受到了阻碍。但是，经济权力也与谁最终有权做决策相一致。在密歇根州弗林特市的例子中，人工智能预测将决策权从政治家手中夺走，而由此带来的权力丧失导致了采纳预测过程中的摩擦，这就需要再次转移决策权以消除摩擦。因此，当我们改变拥有决策权的人时，我们影响了权力的分配，这本身就可能阻碍新系统的采用。


    ## 谁有权做决策


    以法院确定的优先级列表取代地方政治家的判断，这可能会改善人们的生活。不同的人有不同的动机，当预测机器可以改变决策的时间和地点时，新的机会就会出现，从而做出更好的决策。


    在商业领域，当我们考虑是由上层管理者还是由他们的下属做出某项决策时，首要标准是“谁能以最低的成本为组织做出最有利的决策”，这就是效率。有很多原因可以解释为什么一个人被分配了决策权，以满足效率的需要，其中一个原因是该人可以获得能指导决策的重要信息。例如，在哪里部署当地资源的决策一般是由现场经理做出的。尽管人们可以将收集到的信息上报，但这可能需要时间并且成本很高（对所有相关方而言都如此）。因此，有时我们会将决策权留给那些掌握第一手信息的人。


    另一个原因是相关人员的技能水平。做决策可能会很困难，特别是你必须理解信息，然后进行预测和判断以做出选择。所有这些活动都需要技能，但并非所有人都具备这些技能。因此，你需要根据技能来分配决策权。


    与此相关的是激励机制。你希望决策符合组织的利益。然而，在做决策时，人们会受自己偏好的影响。这可能导致该决策与组织利益不一致。虽然可以通过激励机制来调整利益（只要能以某种方式衡量造成不一致的因素），但在其他情况下，一些人与组织的利益会比其他人更一致，而这将决定决策权的分配。


    最后，决策的影响并不止于此，有时还会超出决策者的职权范畴。例如，销售和营销必须与生产和运营相一致。在这种情况下，了解不同决策之间关系的人可能是做出所有决策的人。因此，决策可以捆绑在一起，以便以协调的方式进行决策，即使这可能会在信息可用性、沟通甚至技能方面带来一些不利因素。


    给予某些人决策权的意义在于赋予他们与该决策相关的权力。他们需要能够决定在哪儿部署资源，考虑哪些信息，以及最终为谁的利益做出决策。有了这种权力，自然就有了获取更多价值的能力。当你获得决策权时，是因为你能够做出更好的决策从而为组织创造价值。此外，之所以是你而不是别人拥有该权力，是因为信息、技能和利益的协调一致并非随处可见。也许任何人都可以做出决策。然而，我们要花时间考虑谁做决策的事实意味着，决策权带来了权力。


    与人工智能预测一同到来的是预测与判断的“脱钩”。更重要的是，人工智能预测意味着判断力将成为一种基准，其决定了谁能被更高效地赋予决策权。毕竟，人工智能的预测结果应该是相同的，与谁使用它无关，这就自动排除了它作为决策分配因素的可能性。


    ## 决策才能


    我们通常将具备技能的人称为人才。我们重视人才的技能，这些技能可以产生更好的决策，而在预测机器出现之前，这意味着卓越的预测和判断能力。机器预测的出现引发了一个问题，即人类对于决策贡献了什么具体技能。在此之前，很难将人类的良好决策与预测和判断区分开，而预测机器则关注的是人类判断的技巧。


    正如我们在第十一章中所探讨的，好消息是判断必须来自一个人，而坏消息是这个人不一定是在人工智能预测出现之前提供判断的那个人。


    人工智能预测何时会真正改变提供判断的正确人选？在许多情况下，人工智能预测可能会巩固当前做决策的人才的地位，因此他们不会被颠覆。然而，对于其他情况，从别处获得的判断可能会更高效。那么你应该注意哪些因素来确定变革的方向呢？


    预测与判断的“脱钩”会改变权力的分配，而前提是能高效提供判断的人发生了变化。某个人的判断变得更有价值，而其他人的判断变得没什么价值。这并不会在所有行业中和所有情况下发生。在一些情况下，人工智能的最新进展对决策过程并没有什么影响；而在另一些情况下，更好的预测将使企业能够改进现有的预测分析或逐步改进现有的流程。


    然而，有时更好的预测意味着判断的基准将发生变化。当这种情况发生时，决策者将发生变化，并且权力将被重新分配。人工智能将对判断的价值产生不同的影响，而这取决于它是否处在一种情况下，即在人工智能出现前，是要依赖预测去做决策的。


    所有的出租车司机都必须预测在任何特定时间两地之间的最快路线。例如，在英国伦敦，出租车司机需要接受为期三年的培训来学习“知识”，并在培训结束时接受有关街道名称与机构位置的记忆测试，同时在一周的任何一天、任何时刻，他们要能确定任意两点之间的最快路线。因此，预测是工作的核心。当机器通过应用程序提供这些预

