    # 第十八章


    # 预见系统变化'
  - '[PAGE 263]


    <!-- no content -->'
  - '[PAGE 264]


    一位患者因胸痛来到急诊科。这是心脏病发作吗？医生可以通过检查来判断。阳性检查结果将使医生快速采取治疗措施，使患者尽快康复。但这些检查既昂贵又具有侵入性。成像检查会使用辐射仪器，可能增加患者患癌的长期风险。运动平板试验存在微小但明确的心搏骤停风险。心导管检查除了涉及辐射风险，还存在动脉损伤的风险。因此这不是一个简单的决策。


    医生需要权衡这些效益和成本。患者心脏病发作的可能性有多大？这是一种预测。如果预测认为可能性很高，那就倾向于进行检查和治疗。如果可能性很低，那么检查很可能是一种浪费，而且会无故给患者带来风险。


    在决定是否进行检查时，检查的好处在于揭示关于进一步干预（如植入支架）的信息。如果患者确实心脏病发作，那么对心脏病的治疗将使其受益；如果没有发作，那对其就没什么好处。因此，检查的价值完全源于它所创造的决策价值，即将干预措施针对那些最能从中受益的患者。


    检查并非免费。压力测试可能需要数千美元，心导管检查可能需'
  - '[PAGE 265]


    要数万美元。为了避免高出十倍的费用，你会愿意为压力测试买单。


    这仅是货币成本。有些检查还需要通宵监测和观察，而检查本身也会带来风险：在所有成像检查中，压力测试承载着最高剂量的电离辐射，会显著增加患癌的长期风险。在心脏病发作的情况下进行运动平板试验会带来微小但明确的心搏骤停风险。直接进行导管插入的好处在于，治疗（通常是植入支架）可以作为诊断的一部分同时完成。


    然而，你并不一定想要避免压力测试及其相关风险，因为导管插入手术也具有风险。侵入性程序涉及大剂量的电离辐射，同时静脉注射造影剂可能导致肾功能衰竭，并存在动脉损伤和导致严重中风的风险。因此，在决定是否治疗心脏病之前，首先要决定是否对患者进行心脏病发作的检查，以及是先进行压力测试还是直接进行心导管检查。


    检查的决策权在医生手中，检查通常是手术的前奏，但医生在决定如何去做时会运用其判断力。患者的年龄是多少？是否需要更多的护理（如在疗养院）？患者是否患有其他疾病（如癌症）？所有这些都会影响最终的决策。


    现在，假设医生在预测这些复杂问题方面有了超人类的帮助，也就是说，假设一种人工智能可以快速评估患者是否需要进行检查。这里的潜在好处显而易见。这并非假设。经济学家塞德希尔·穆来纳森和齐亚德·奥伯迈尔基于急诊科医生在诊断患者时所拥有的相同信息，建立了一个人工智能系统。²
    他们发现，他们的人工智能在预测心脏病发作方面比医生更准确。医生的决策中充满了大量的过度检查，患者被迫做了不必要的检查。考虑到美国医疗系统中的某些激励机制，或许这个结果是可以预见的。没有哪个医生愿意面对不进行检查所带来的责任，尤其是在你做的检查越多就能收入越多的时候。


    令人惊讶的是，穆来纳森和奥伯迈尔还发现了大量的漏检问题。'
