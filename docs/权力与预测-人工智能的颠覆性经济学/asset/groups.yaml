    使用你每次解锁时提供的图像来更新算法。这一切都可以在手机上完成，因为所有的训练数据都与你有关。在其他情况下，训练数据需要从多个用户那里更新输入数据和预测结果。隐私问题可能会变得日趋严重，并且在协调来自多方面的信息时，也许会遇到挑战。


