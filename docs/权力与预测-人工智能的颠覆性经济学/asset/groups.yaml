    做出决策，而不仅是依赖规则。


    新的决策取代了旧的规则，但旧的规则并不是孤立存在的。人们建立了结构和框架来保护这些规则免受不确定性的影响。整个企业和行业都致力于提供这种保护。因此，新的决策机会可能会被隐藏。我们面临的挑战在于认识到这一点，并找到这些被隐藏的决策，做出真正能够替代现有规则的新决策。接下来我们将探讨这个挑战。


    # 本章要点


    +   规则是我们预先做出的决策。与遵守规则不同，做决策时，我们可以考虑决策的时间和地点等。因此，由决策产生的行动通常比由规则产生的行动更灵活，因为它们可以对情况做出反应。那么，为什么我们会使用规则而不做决策呢？因为决策会产生更高的认知成本。什么时候这个成本是值得的？那就是当后果严重且信息成本较小时。引入人工智能并不会改变后果，但它降低了信息成本。


    +   在人工智能系统的背景下，规则和决策之间的权衡至关重要，因为人工智能的主要优势是增强决策能力，所以对规则的贡献很小。人工智能生成预测，而预测是决策的关键。因此，随着人工智能变得越来越强大，它们降低了信息（预测）的成本，而且与使用规则相比，它们增加了决策的相对回报。因此，人工智能的进步将使一些决策摆脱遵守规则的束缚。


