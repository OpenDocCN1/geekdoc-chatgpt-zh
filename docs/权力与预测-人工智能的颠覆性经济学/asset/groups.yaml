  - '[PAGE 114]


    每年，参赛者都会聚集在布莱切利公园（二战期间，艾伦·图灵曾在此破解了德国密码），与计算机程序一决高下。这个比赛基于著名的模仿游戏（现称为图灵测试），参赛者通过计算机与一个看不见的实体对话。这个实体可以是计算机程序，也可以是一个人。每个实体都试图说服对方自己实际上是人类。正如作家布莱恩·克里斯汀所说的，如果你是一个参赛者，你实际上正试图成为“最像人的人”。‘通常情况下，人类会获胜，但很多人很难让对方相信自己是人类。


    赛马也与之类似，人类与机器智能对垒也是人工智能研究的重要内容。算法在识别图片内容上比人类做得更好吗？相较于由人驾驶的汽车，自动驾驶的汽车发生事故的概率更低吗？相较于人力资源部门，人工智能可以更好地筛选出求职者来进行面试，并录用他们吗？计算机能战胜围棋世界冠军吗？


    这些比赛让人们开始比较人与机器，并引发了关于机器是否会取代人类的焦虑。有趣的是，汽车比马快，但马仍然参加赛跑；当机器比人类快时，奥运会仍然顺利举行。为何当机器在下围棋方面比人类'
  - '[PAGE 115]


    更优秀时，情况就有所不同呢？衡量指标能说明一些情况，但取代并不一定发生。


    当需要选择人或机器来完成任务时，情感或运动并不是选择标准。衡量指标是基于纯效率来评估性能的，并根据成本高低而产生替代。如果机器可以完成任务并且成本较低，那么肯定会替代人类。马可能仍然会参加比赛，但它们不再到处载人了。正如机器在体力劳动中取代人类一样，它们也可能会在认知方面取代人类。


    如今，一个完整的产业正试图逐项检查人们的工作，以评估在人工智能时代机器是否可以完成这些任务。与放射科医生相关的任务有30项（见图8-1），²其中，仅有一项任务与机器预测直接相关：演示或解释影像诊断程序的结果。


    每份工作都可以用这种方式进行拆解，并评估其被人工智能替代的概率。2013年，牛津大学马丁学院的一项研究宣称，近一半的美国工作岗位容易被自动化取代。³这是对人工智能的最大担忧。埃里克·布莱恩约弗森、汤姆·米切尔和丹尼尔·洛克评估了964个职业、18156项任务和2069个工作活动对“机器学习的适用度”。结果表明，受到威胁的职业包括许多提供预测的工作，如前台职员（提供建议）和信贷审批员，这些我们都已经强调过了。按摩师、动物科学家和考古学家的工作尚未受到威胁。世界杰出的劳动经济学家和宏观经济学家担心，随着人工智能接管某些工作，对于人类工人，尤其是那些尚未处于收入分配顶端的人来说，剩下的工作机会可能就很少了。⁴


    人工智能浪潮已经推进了十年，而机器取代人类完成的任务少之又少。聊天机器人在客户服务中扮演着重要的角色，机器翻译在其领域所占的比重也在增加。但是技术性失业并没有即将到来的迹象，人们还有很多工作要做。虽然有些人工智能可以超过人类，但在许多情'
