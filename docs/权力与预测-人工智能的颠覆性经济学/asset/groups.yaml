    “乘客在机场停留的时间比 10 年前多了近 1 个小时。”从事机场设计的芬特雷斯建筑事务所的建筑师和负责人汤姆·西奥博尔德说。他指出，尽管航空旅行发生了巨大变化，但人们往往在
    20 世纪六七十年代建造的机场里花费了更多时间。⁴


    但什么才是最重要的呢？到了今天，航站楼才被设计成“目的地”。尽管机场还是以前的样子，但人们在那里花费的时间更长了。这是人们的选择。为什么？因为赶飞机变得更有不确定性。其中包括交通、停车和安全检查等问题。乘坐飞机本身涉及改签费、超额预订、中转和争抢行李架等问题。准时赶上航班变得更加困难，而未能如期赶上航班的后果也更严重。因此，即使没有九洞高尔夫球场（去曼谷看看），你可能也会想提前到达机场，哪怕就在那里读本书。⁵然而，随着一个个新的便利设施出现，你忘记了为什么要提前一个小时到达机场。提前到达已经成了你的新习惯。


    回想一下，这种情况是多么奇怪。自 1992 年以来，仁川已经耗资 100 亿美元扩建机场。其中大部分费用被用在建造安检线之后的充满挑战性和扩张性的航站楼。但是仁川机场的声明及目标是“确保航空运输顺畅”，⁶你不会看到一个机场宣称在做运送旅客之外的其他事情。然而，那些设计机场的人正在思考如何让人们更久地停留在机场。如今，约
    40% 的机场收入来自非航空收费，其中最大部分是零售商的租'
  - '[PAGE 78]


    金。'' 设计师正在尽力确保机场能够创造更多收入，并在此过程中让每个人意识不到他们在机场花费了更多时间。


    现代机场是所谓的“隐藏的不确定性”的代表。当人们没有获得做出最佳决策所需的信息（如何时出发去机场）时，他们就会遵守规则。航空旅行以及进出机场的方式在发生变化，这些变化让你更愿意选择遵守规则，使你在机场停留的时间更长。机场知道，如果候机是不愉快的，那旅行也将变得不愉快，你就会减少旅行次数。因此，在对基础设施进行大规模投资时，机场不仅会考虑如何让人们到达那里，还会考虑如何使候机变得更加愉快，并从中赚钱。一旦你提前到达机场，你就会愿意为一顿饭或其他活动掏钱，就像在进入电影院之前，即使是一桶“天价”爆米花也非常诱人。如果你没有感受规则的代价，并且很少错过航班，你就不会反思自己的规则和习惯。不确定性变得次要，而决策的结果，最终以气派的新建筑和令人惊叹的五层瀑布的形式展现出来。


    在寻找利用人工智能做出新决策的机会时，如第四章所述，你应该仔细审视规则，并看看它们是否可以转变为利用人工智能来主动接受不确定性的决策，而不是忍受不确定性。在本章中，我们将表明规则不仅体现了通过人工智能来做新决策的机遇，而且还有用于隐藏不确定性的结构和框架，这会导致我们在采用规则时产生浪费并效率低下。规则不仅标志着人工智能存在机遇，还代表着这种机遇的重要性。事实上，对于机场来说，一些非常简单的人工智能应用程序已经对它们当前的一切构成了威胁。


    # 另一个机场宇宙


    在分析人工智能预测可能对机场构成的威胁之前，与其他事物一'
