    你做出选择，然后获得反馈，结果会告诉你不同路径的成本和收益。通过在不同环境中做出不同选择，你的经验越多，结果就越清晰。你从这些经验中得出的判断，会让你知道将来该怎么做。


    判断的建立方式有两种。一种是计划性地向他人学习，包括阅读、指导等；另一种是通过经验学习。现在我们分别讨论这两种方式。


    ## 详细规划


    有了低成本或高质量的预测，通过经验获得判断就会变得更加容易。但如果这些预测需要一定的投资和开发呢？在开发之后，预测的成本可能会很低，但是获取数据、进行训练及测试算法所需成本可能需要明确其使用的合理性。需要仔细分析一下，如果有预测可用，可能会做出哪些选择，即对结果进行预想并获得判断，这也许是必要的。例如，许多风险投资家为初创企业提供资金支持，而这些公司的成功取决于高度的不确定性。在进行投资之前，他们会进行分析，如果成功了，是通过首次公开募股退出更好，还是私人收购退出更好。6


    在这个过程中，我们自然地认为，相较于出现频率低的情况，应调查出现频率高的情况造成的结果。然而，当涉及对不同情况做出选择时，问题不一定在于预测能否区分更频繁和不那么频繁的情况，而在于它是否能够区分在截然不同的情况下需要采取的行动。


    让我们来思考一下在信用卡欺诈中应用人工智能的情况。当你刷信用卡时，一系列算法会决定是否处理或拒绝该交易。拒绝交易的原因可能是，你的信用额度已经用完或者怀疑你存在欺诈行为。信用卡网络不允许处理有欺诈嫌疑的交易，因为它将承担与盗刷相关的费用。但是，整个信用卡业务的基础在于对客户和商家来说都很便捷和轻松。因此，拒绝合法交易是有害的。消费者可能会感到受挫，或者更糟的是，他们会转向使用其他公司的信用卡。


    当信用卡网络的算法怀疑该交易可能存在欺诈行为时，它会给这种可能性分配一个分数，该分数代表该交易存在欺诈的概率。但是，如何对这些信息做出反应，就需要判断的介入。这个判断不在商家或其他任何人手中。如何使用这些信息是在系统中已经编程好的，接受或拒绝信用卡的决定是自动化的。难道还能有其他方式吗？


    这意味着必须事先对判断进行思考，从而指导如何将分数转化为接受或拒绝的行动，这些工作很可能是由评估这些选择的一个委员会完成的。如果预测分数始终为 100 或
    0，那么你将不需要太多判断来决定正确的行动路线。然而，你所做的是为预测分数设置一个阈值，高于该阈值，交易将被拒绝；低于该阈值，交易将被接受。对于绝大多数交易而言，它们将被接受，这意味着不会频繁出现相对较高的欺诈分数。这解释了为什么在算法评分之前，信用卡公司让商家自行决定是否接受信用卡。


    选择该阈值是为了减少两个错误。第一个错误是可能被允许的欺诈交易。这个错误的成本仅是与信用卡公司有关的成本，而不是商家或持卡人所承担的交易成本，这可以通过历史数据计算得出。第二个错误是可能被拒绝的合法交易。这个成本更难被计算，因此更难做出判断。其中，持卡人类型扮演着重要角色。信用卡公司担心，若持卡人是高级客户，如果他们在交易中受挫，就会将所有交易转向另一家信用卡公司，而这样的错误可能发生。因此，判断与客户的其他特征有关，持卡人类型与欺诈分数二者相互作用。预测欺诈交易取决于从被调查的交易中推断出的异常情况。相比消费模式更稳定的普通持卡人，对经常旅行的高级持卡人的预测会更困难。


    可以看出，由于要考虑不同的方面，预先计划的判断就变得复杂了。这些方面需要被转化为可描述的内容，以便在自动化过程中编码，至少对信用卡业务来说如此。通过自动化，判断个人在决策前需要判定什么是很重要的。这种复杂性对采用人工智能系统构成了一道障碍。做出判断的人在改变。商户不再依靠预测与判断决定人们是否会遵守其信用，而是信用卡公司在实时预测的基础上，进行大规模的慎重规划和判断。


    ## 经验之旅


    通过给出判断——在特定情况下知道该做什么——经验可以带来更好的决策。然而，这一过程可能并不简单，毕竟，我们是否经历某事取决于发生了什么和知道所发生的事情确实发生了。如果你意外碰到热烤箱，你既有了新的经验，又可以推断出经历的后果，但这需要一个意外事件。如果你知道烤箱可能很烫，所以就绝不触摸它，你就不会知道后果是什么。我们并不是说这是一种不好的策略，而是在强调你的选择可能会指导你的经验。7


    为了更准确地说明这一点，我们来考虑这样一种情况，即你有两种行动选择。一种选择，我们称之为现状行动，即你一直在做的事情。你非常清楚从中能得到什么，而且它还有另一个特点，即你所得到的总是一样的。它是一种具有一定回报的行动。另一种选择，我们称之为冒险行动，即你从未尝试过的事情。你不知道如果你选择冒险行动会发生什么。例如，可能是雇用一个不符合常规标准的人，或者为一家不符合你一贯投资理论的初创企业融资。在这种情况下，即使你收到有关冒险选择的信息，可以帮助你更好地理解决策的背景，但你可能仍然不知道是否值得执行下去。


    在这种情况下，你可能会陷入困境。一方面虽然一些预测可以提供信息，但如果你不知道该如何利用这些信息，你就不会为那些预测付费；另一方面如果没有那些预测，你将继续维持现状，并且永远不会知道冒险行动对你来说意味着什么。同样，建立判断的挑战是建立人工智能系统的一道障碍。


    如果人工智能系统解决方案的回报率足够高，对建立判断进行投资就是值得的，因此这种“先有鸡还是先有蛋”的情况可能并非无解。那些最适合通过经验或计划来建立判断的人，可能与目前基于捆绑式预测和判断来做决策的人不同。


    ## 适用于一切的 FDA


    在许多情况下，我们并不知道一个人服用治疗疾病的药物后会有什么反应。我们知道有些人会遭受可怕的药物副作用。每个人的情况都是不同的，药效具有概率性，因为即使是良药也不适用于每个人，有时很难区分良药和毒剂。


    20 世纪初，江湖郎中在药品市场上到处卖药，药效的概率性原本阻碍了药物市场的发展。然而，我们建立了一种监管流程［在药品领域由 FDA（美国食品药品监督管理局）领导］，以评估药物在每种适应证中的总体效益与成本。监管流程承认药效具有概率性，并使用随机实验（如第三章中所述）确定药物是否有效。此外，我们不仅在总体上考虑效益成本比率，同时对于不同年龄段的特定细分人群也会考虑这一比率。例如，FDA
    分阶段批准的新冠病毒疫苗，先是针对成年人，然后是儿童。


    当我们考虑用概率性方法替代确定性方法的新系统设计时，可能需要对以前没有类似监管的领域采取类似的监管方法。8 例如，虽然我们要求新司机参加简单的驾驶资格考试，但从未审查过他们对可能会伤害他人成本的判断。我们可能需要类似
    FDA 等监管机构来测试自动驾驶的人工智能，以确定车辆的运行对于既定安全准则来说是否安全。


    与此类似，我们可能需要这样的监管机构来监管给予银行贷款的人工智能。这个监管机构将测试人工智能对贷款的发放，以确定其是否符合法律要求。此外，我们可能还需要这样的监管机构来监管仓库机器人控制系统的人工智能，其中机器人与人类近距离工作，从而测试机器人的行动相对于某些基本准则而言是否安全。


    就像难以验证的具有概率性的制药行业受益于监管流程一样，这些监管流程旨在向公民保证，尽管存在一些风险，但总体上好处较多。当我们设计系统解决方案以充分发挥人工智能的全部优势时，可能需要类似的思考方式。当我们从“中间时代”进入一个人工智能无处不在的新时代时，大多数系统从确定性过渡到概率性，我们可能需要为几乎所有事物都设立
    FDA。这些监管机构将成为新系统的一部分。


    ## 谁是合适的裁决者


    谁拥有判断力，它是如何获得的，以及如何将其实际运用到决策中——无论是作为阈值还是以更复杂的方式——都是基于人工智能预测来构建系统设计的关键所在。回想一下，人工智能预测往往意味着你现在可以选择谁是合适的裁决者，而不是合适的预测者和裁决者的组合，因为这些功能已经互相“脱钩”。“脱钩”意味着你需要选择谁来获取这些预测，并了解预测将如何被使用。预测可能会传递到一个地方——比如一个算法，它将预先设定的判断纳入其中，以创建触发行动的预测阈值——或者传递到许多地方，比如为许多驾驶员提供最佳导航路线的预测。


    这些变化可能是颠覆性的，在实施过程中会造成不和谐。尽管如此，重新思考系统的机会已经出现，首先是“脱钩”，然后是找到合适的裁决者。这些裁决者可能与现今的决策者不同，他们需要了解如何运用赌徒思维，并具备适当的规划技能、经验或机会来建立判断力。


    ## 本章要点


    - 人工智能将概率思维引入了系统中。当我们调查一场交通事故时，会问驾驶员在撞人之前是否看到了行人，并期望得到一个肯定或否定的答案。我们不太习惯处理“可能是”或“有一点”这类情况。然而，这就是人工智能给出的答案。它看到了某个事物，认为有
    0.01% 的可能性是一个人正在接近道路。当我们将人工智能引入系统时，通常将这个系统从确定性转变为概率性。有时，现有系统已经很好地适应了概率性输入，而其他时候，则需要通过系统重新设计来大大提高生产力。


    - 我们必须运用判断力来将预测转化为决策。如果传统上是由人来做决策，那么判断可能不会被编码，从而与预测明确区分开。因此，我们需要生成判断力。那它从哪里来呢？可以通过传递（向他人学习）或经验获得。如果没有现成的判断力，我们可能没有动力去投资建立人工智能来进行预测。同样，如果我们没有能够做出必要预测的人工智能，我们可能会犹豫是否投资开发与一系列决策相关的判断力。我们面临一个“先有鸡还是先有蛋”的问题。这给系统重新设计带来了额外的挑战。


    - 要充分利用人工智能的能力，许多应用需要新设计的系统解决方案，其中不仅包括预测和判断，还包括监管功能，用于在系统从确定性转为概率性时向社会提供保障。我们事先不知道系统在所有情况下如何运行，因为它没有被强制编码。类似于难以验证的具有概率性的制药行业，它们从监管流程中获益良多，可以向公众保证，尽管存在副作用风险，但总体上好处较多，我们可能需要类似于
    FDA 的监管功能，从而根据既定的测试框架来检验机器的决策。在许多情况下，要想让依赖概率信息的系统重新设计获得成功，这一点至关重要。


    ## 第十五章


    ## 新的裁决者


    铅是一种致命的神经毒素，会影响儿童的大脑发育。从 20 世纪 60 年代起，铅逐步从油漆中被淘汰，70 年代起逐步从汽油中被淘汰。现在大部分铅油漆已被取代。使用铅汽油的汽车早就报废了。这些变化改善了全球数百万人的健康状况。


    美国在 1986 年禁止使用含铅管道，但已经安装的管道并不在禁令范围内。由于这些管道可以使用 100 年，如果不更换，它们将继续造成危害。密歇根州弗林特市改变了水处理方法，导致饮用水中的铅含量大幅上升，从而引发了管道更换问题。但问题在于市政府官员不知道哪些管道含有铅，哪些是无害的，而逐一检查每根管道的成本很高。


    不确定性为部署预测机器提供了机会。密歇根大学的两位教授埃里克·施瓦茨和雅各布·阿伯内西接受了这一挑战。他们与研究团队一起着手预测哪些管道可能含有铅。他们成功地建立了一种人工智能，将其部署在弗林特市。该城市只对预测表明可能含铅的家庭进行了铅管道检查。预测机器确定可能含铅管道的正确率达
    80%。2 2016 年和 2017 年，数千名弗林特市居民更换了含铅管道。


    然而，一些居民并不满意。例如，预测可能意味着，在一个社区中只有一个街区的管道含有铅（也许是因为房屋年代较久远），这使社区的其他居民对自家管道感到担忧。一些社区，尤其是贫困社区，那里的居民比富裕地区的居民更有可能接受管道的铅检测。一些富裕居民则因为他们的管道没有被早点检查而感到愤怒。弗林特市市长聘请新的承包商管理含铅管道的更换工作，要求该公司在全市各区、各家各户进行挖掘，而不考虑饮用水管道是否真的含铅。


    预测准确率骤降到了 15%（见图 15-1）。尽管许多居民对住房里没有含铅管道感到放心，但识别和更换管道的过程停滞了。人工智能提供了出色的预测，但判断仍然受到政治因素的影响。正如新的项目经理所说，市政府“不想向议员解释为什么他们的选区没有工作可做”，“市政府不想落下任何人”。3
    在此过程中，一些选区的居民得到了他们的管道里不含铅的保证，且尽管人工智能预测第五地区 80% 的住宅中都有含铅管道。但该市第五选区的挖掘次数最少，根据当地政治家的判断，弗林特市决定不使用预测机器。


    但这并不是故事的结局。2019 年 3 月 26 日，美国法院批准了一项和解协议，要求该市使用施瓦茨和阿伯内西的预测。法院取消了政治自由裁量权。相反，它预先确定了判断。实质上，它判断消除铅对每个城市选区和每个社区有同样价值。重要的是存在铅的可能性有多大。随后成功率迅速提高到
    70%，数千名弗林特市居民的含铅管道被确认并更换。《时代》期刊将施瓦茨和阿伯内西的人工智能评为“2021 年最佳发明之一”。如今，该人工智能由一家名为 BlueConduit
    的营利性公司推广，约 50 个城市使用这些预测来节省资金，同时识别和清除数百万住宅中的铅含量。4


