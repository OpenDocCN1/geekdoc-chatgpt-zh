    # 第一章


    # 三位企业家的寓言'
  - '[PAGE 15]


    <!-- no content -->'
  - '[PAGE 16]


    电力改变了我们的社会。它改变了我们的生活方式——我们一拨开关就能获得廉价且安全的照明，家用电器如电冰箱、洗衣机和吸尘器帮我们减轻了家务负担；它还改变了我们的工作方式，为工厂和电梯提供动力。那这一切的背后是什么呢？——时间。


    今天电力的普及程度令人难以想象在 20 世纪初，即托马斯·爱迪生发明电灯泡后的 20 年里，电力几乎无处可见。1879 年，爱迪生发明了闻名世界的电灯泡，并在几年后启动了曼哈顿的珍珠街发电站，照亮了街道。但
    20 年后，只有 3% 的美国家庭使用电力，工厂里的情况也差不多（见图 1-1）。然而，又过了 20 年，这一数字就猛涨到了人口的一半。对于电力来说，这 40
    年就是“中间时代”。


    虽然当时人们对电力充满热情，但却没什么东西可以展示。今天，当新兴的激进技术出现时，我们往往会忘记这一点。灯亮起来了，看似一切都在改变，而实际上变化却不大。人工智能的灯虽然亮了，但我们要做的还有很多。现在，我们正处于人工智能的“中间时代”——在展示技术能力和实现其广泛应用前景之间的时代。


    对于人工智能来说，未来并不确定，但我们已经看到了电力发'
  - '[PAGE 17]


    展的轨迹。因此，要理解人工智能商业化所面临的挑战，可以设身处地地想象自己是19世纪80年代的企业家——电力是未来的发展方向，那么你会如何设想去抓住这一机遇呢？


    ![](img/5d7d0b82a68fe65c345bd809e0cf66b2_17_0.png)


    # 图 1-1 美国电力使用情况


    资料来源：数据来自保罗·A. 大卫，《电脑和发电机：一面不太遥远的镜子中的现代生产力悖论》（1989 年斯坦福大学经济学系工作论文 #339），twerp339.pdf（warwick.ac.uk）。


    # 点解决方案企业家


    蒸汽在 19 世纪下半叶推动了经济的发展。人们用煤炭加热水来产生能量，并用于带动驱动杆、滑轮和皮带，进而实现工业生产。从各种记录来看，蒸汽是继农业之后推动经济革命的又一大奇迹。因此，一个想要售卖电力的企业家必须想方设法让潜在客户关注蒸汽，并发现其缺点。


    如果把蒸汽与电力放在一起，那么这些缺点就显而易见了。蒸汽散发热量，这正是它的用途；但其中大部分热量会被浪费，这就是它'
  - '[PAGE 18]


    的缺点。蒸汽动力在传导过程中损失了 30%~85% 的能量，原因包括冷凝、阀门泄漏以及轴和皮带将能量传递到工作台时产生的摩擦。¹ 想象传动系统可能有些困难，那么我们简单设想一下：蒸汽动力源位于一端，转动着一根长
    3 英寸 ① 的铁轴或钢轴，然后让皮带和滑轮沿线运转。某些轴可能是水平的，但许多工厂有多层的轴，而且是垂直配置的。例如，一根轴可以驱动数百台纺织机。


    对于电力，直接方案就是在使用蒸汽动力的同一位置——轴的末端——使用一种替代能源。弗兰克·斯普雷格是爱迪生的一位前雇员，在 1886 年开发最早的一种电动机时，他就发现了这一点。尽管爱迪生专注于研究照明，但一些人已经意识到，白天的电力更便宜且电动机可以得到利用，斯普雷格就是其中一人。斯普雷格利用自己的见解为有轨电车和建筑电梯提供动力，其他人则将电动机引入了工厂。


    我们把这些方案称为“点解决方案”，因为这些发明者是在当时工厂的能源接入点将蒸汽更换为新的动力源——电力。19 世纪末期的点解决方案企业家发现了两类愿意将电力视为新动力源的客户。一类是大型蒸汽动力工厂。美国南卡罗来纳州哥伦比亚市的一家纺织工厂于
    1893 年放弃了蒸汽，转而采用电力。利用水力发电，然后通过 1 英里 ② 长的电缆进行传输，该工厂提供的电力是美国最便宜的。² 另一类是服装和纺织制造商。蒸汽的缺点是其本身不够环保以及动力产生的速度不稳定，而电力恰好解决了这两个问题。


    点解决方案企业家给出的优惠就是低成本以及某些工厂能够享有特定的好处，产品的即插即用特性使他们的销售内容变得清晰明了。


