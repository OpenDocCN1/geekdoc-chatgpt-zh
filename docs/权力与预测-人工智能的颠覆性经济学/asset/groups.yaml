    数千名被人工智能预测为高风险的患者从未接受过检查。被人工智能算法预测为高风险患者的最终结果更为糟糕，不是回到医院就是面临死亡。


    这个人工智能算法在各个方面都表现得十分出色。它既便宜又快速，并且在这两个方面似乎都不容易出错。你可以将相同数量的检查从低风险患者那里重新分配到高风险患者身上，从而让大家都能取得更好的结果，既能帮助患者，又能减少责任风险。或者，你可以减少检查，但要保持同样的医疗质量。


    # 点解决方案和应用解决方案


    这看起来像一个毫无争议的人工智能应用。急诊科的人工智能诊断提供了一个优秀且有效的点解决方案。人工智能能够支持医生做出更好的决策，并在成本较低的情况下逐步改善患者的健康状况。工作流程不会改变，也没有威胁到人的工作。医生在诊断步骤上并没有花费太多时间，因为它与判断是“脱钩”的。


    问题在于，这些好处是否值得投入成本来应用一项新工具。医疗保健管理者会面对许多有前途的新技术，每一项技术都需要培训员工和对流程的微调，每一项技术也都有风险。在实际操作中，技术很少像在测试中那样好。管理者可能会决定，诊断心脏病发作的人工智能点解决方案所带来的增量收益不值得去花费成本。


    然而，管理者可能会发现人工智能应用解决方案具有吸引力。他们不再使用向医生提供预测的人工智能，而是采用一种人工智能来决定是否需要进行检查。医生不再参与对患者的决策。相反，当患者到达急诊科时，机器会预测患者是否会有心脏病发作的可能性。如果预测结果低于某个阈值，患者就会被送回家；如果预测结果在某个中间'
  md: '


    我们的想法是确定实现该使命所需的决策。显然，可能会有很多决策（在理论上，可能会有数百万个）。在这里并不是要确定所有决策，而是要陈述所需决策的类别。如果你拥有非常强大的预测机器来增强你的决策能力，那么实现你的使命所需的最小决策量是多少？只需确定最重要或核心的决策即可。


    确定决策之后，就是深入研究的时候了。为了做出决策，你需要收集什么信息？这不仅包括你拥有或可以轻易获得的信息，而且包括你可以想象到的重要信息。大多数决策是在不确定的情况下做出的。然而通过预测，你就可能拥有做出更好决策所需的信息。预测是人工智能可能提供的东西，因此这个练习将预测与组织中的核心决策联系起来。


    总之，没有完美的预测。如果你拥有完美的预测，做决策将变得容易，并且有可能实现自动化。尽管画布是一个相对理想的工具，但它的工作并不是不切实际的。因此，对于每个决策，你需要阐明所涉及的主要权衡项。事实上，我们提倡使用一个“错误框架”。如果我们的预测错误或不存在，我们可能犯什么样的错误？这会让你了解到决策的风险程度。在第四章的雨伞选择中，如果你的天气预报错误，你要么带了多余的伞，要么被淋湿了。你的判断就是如何对这些错误进行排序。对于画布上的每个决策，你都需要确定犯错的后果，并通过明确计算成本或以其他更主观的方式对它们进行排序。


    接下来，你可以将任何潜在的基于人工智能的预测与决策关联起来，以评估：你的组织是否明确采取了这些决策，当前谁拥有这个决策；如果你使用人工智能来做出决策，那么对你当前组织的其他部门可能会造成什么样的颠覆？（我们将在第十八章和结语中讨论这最后的几步。）目前，你需要一个起点——一块白板——和你所在行业的基础系统。


    ## 保险业


    从许多方面来看，没有比保险业更稳定的行业了。从几个世纪前开始，它已经发展为现代生活的重要组成部分。消费者的保险产品很简单。人们每年向保险公司支付保费，如果他们发生车祸、房屋损坏或被盗或者死亡，就会得到赔偿。信息技术革命带来了一些进步，计算精算表变得更容易，可以通过不断调整修改来提供更多的保险产品。但最终，这些产品的主要变化来自超出客户控制范围的因素，如年龄或居住地。


    提供保险产品需要什么呢？我们以家庭保险业为例。该行业的一个企业使命可以这样表述：“为房主提供安心服务，防止他们最有价值的资产遭受灾难性的损失。”你可以将这句话写在画布的顶部方框中（见表
    17-2）。


    在表 17-2 中，我们确定了三类决策——营销、核保和理赔。这些通常是保险公司的各个部门，这让对这个行业的分析变得简单一些。


    营销负责获取客户：找到那些需要保险的人，并向他们销售产品。营销人员的决策围绕着在哪些地方投入资源以锁定客户。核保创建保险产品并评估客户风险状况以确定保费，同时确认已获得的客户是否已成为投保客户。换句话说，核保人员负责定价保险产品，这意味着他们了解对特定客户或具有特定特征的客户群体进行投保的成本。理赔部门决定是否支付索赔。实际上，它处理的是在其他企业中被称为“客户体验”的事务：把保险金给客户是多么令人愉快，但这样做也许是为了尽可能不提供这些保险金。


    表 17-2 还概述了对于这些决策的重要预测，以及对预测后果（或广义上的决策错误的后果）的判断。房屋等保险业务有一条非常简单的盈利路径。你希望销售那些预期赔付损失小于保费收入的保单。客户关心保费，但也关心服务，即注册保单和提出索赔的便利程度。在这个竞争激烈的行业中，一家成熟的保险公司无法做太多来改善保费水平，但如果能减少预期损失，将会获得更多利润。


    ## 表 17-2 人工智能系统探索画布：家庭保险业


    尽可能将业务简化到最少量的决策，看看是哪些？


    | 为房主提供安心服务，防止他们最有价值的资产遭受灾难性的损失 |  |  |

    | :- | :- | :- |

    | 营销：决定谁是营销的目标 | 核保：决定价格（保险费） | 理赔：决定是否支付索赔 |

    | 预测每个潜在客户的购买意愿 | 预测房主在一定价值范围内提出索赔的可能性 | 预测已提交的索赔有效并应获赔付的可能性 |

    | 确定以不会购买的人为目标客户的成本与不以原本会购买的人为目标客户的成本 | 设定策略（增长与盈利）：确定定价过低（损失）与定价过高（失去客户）的成本 |
    确定不支付合法索赔的成本（受挫的客户、声誉受损）与支付非法索赔的成本（经济损失） |


    保险公司如何做到这一点呢？它希望找到预期损失较低的客户，并向他们销售保单，同时确保只向预期损失较高的客户销售更高保费的保单。但如果没有关于谁具有较低或较高预期损失的良好信息，很多客户就将支付类似的保费。预期损失较低的客户支付得太多，而预期损失较高的客户支付得太少。此外，在没有正确信息的情况下，竞争无法解决这个问题。因此，公司希望预测哪些客户提出索赔的可能性较低，并在营销中将他们作为目标客户。这些预测与营销和核保决策有关。该公司还希望确保在适当时候支付索赔，而不是其他情况——它希望避免欺诈。理赔失误最终会影响公司的竞争能力，因为这会增加其成本。因此，它可以判断错误对保险业务的影响（在表
    17-2 中列举了这些例子）。


    通过梳理这些决策，我们还可以看到它们是如何相互关联的。正如我们先前所提到的，人工智能预测为保险业提供了机遇，特别是对核保人员来说，他们的工作就是预测客户的风险状况，这是人工智能的一个近乎完美的应用。与此同时，通过加快这个过程，营销人员的工作变得更容易，销售人员可以迅速回应潜在客户的需求。不同司法管辖区的监管问题制约着公司如何使用人工智能来进行风险预测，但核保和营销在其价值上是一致的。人工智能还可以更轻松地评估索赔的有效性，这也反过来影响了营销和核保。但实际上，理赔部门只是在自己的领域内做得更好而已。


    我们可以看到之前提到的人工智能应用如何适应这个系统，通过拍照评估索赔的方式该应用程序可自动做出理赔决策。这只是做出决策的另一种方式，完全符合理赔部门的要求。客户在有了更好的理赔体验后，营销工作也变得更容易，营销人员可以选择将资源分配给最看重更好体验的客户。当然，这可能会给核保带来更复杂的问题：那些更容易提出索赔的客户会提出更多索赔吗？营销会以更有可能提出索赔的人为目标客户吗？理赔部门的成本会上升（索赔次数增加）还是下降（评估成本降低）？因此，虽然这个应用程序完美地适用于理赔决策，但它的采用可能会影响其他决策。有趣的是，它并没有从根本上改变这些决策的内容、所涉及的判断或所需预测。这样的应用可能会在不需要进行系统变革的情况下被采用（或不被采用）。


    那么，可以对客户的风险状况和行为进行监控及反馈的应用程序如何呢？保险业当前系统的核心是风险评估，通常是在客户获取阶段进行的，尽管在某些情况下，在保险合同续签时会重新评估。客户在购买房屋保险时，可能会通过一些方式来降低保费，比如证明自家安装了能立即呼叫外部帮助的报警系统，或者安装了一旦出现水管爆裂就能自动关闭水源的水监测系统。但不良事件的风险不太可能由房屋特征决定，而是由行为决定的。例如，美国消防协会报告称，在美国，房屋火灾的起因中有
    49% 是烹饪。1 深入研究这些报告，你会发现这不是泛指任何一种烹饪，而是特指用油来烹饪，特别是油炸，这是有道理的，也不是什么新闻。可问题是，很少在家做饭的人，为什么要与每天都要油炸食物的大家庭支付相同的保费呢？


    答案非常简单：除了彻底拆除厨房，保险公司无法监控某人是否在烹饪，更不用说他们是否在用油来烹饪了。公司所能采用的最好办法是根据这些事实调整保险赔付，但这意味着它不是针对烹饪中的不幸事件而为人们提供保险的，而是针对他们整体的风险状况。


    但人工智能技术可以弥补这些不足，并以经济高效的方式监控持续存在的风险。其中一些是自动干预机制，包括监测水源（如 Phyn）或电气事故（如 Ting）在内的人工智能，其工作原理类似于烟雾探测器，保险公司已经在鼓励客户使用这些设备。对于汽车保险，一些驾驶员监控设备不仅会考虑驾驶里程，还会考虑驾驶质量。安装这些设备，你的保费可以相应地减少。


    虽然烹饪、取暖、吸烟或使用蜡烛等行为都具有很大的风险，但所有这些行为都可以被监控，而且与风险评估相关的指标可以持续发送给保险公司，保费也可以得到实时调整。当然，这种监控方式会带来隐私及相关方面的问题。但就像汽车保险公司能够让客户自愿同意监控他们的驾驶一样，它们也可以对房屋进行同样的监控。如果这种监控意味着，那些发现保费降低
    25% 的人认为调整行为并降低 25% 的火灾风险是值得的，那对所有相关方来说都是一笔不错的交易。2


    然而，之所以过去没有提供这些根据行为做出反应的保险产品，是因为此类监控曾经并不可行。其中许多产品不一定涉及消费者，却涉及企业保险，而这些企业风险是很难进行评估的。


    创建这些新产品需要当前各部门的协调，特别是营销和核保之间的界限变得模糊。如果营销部门设想出一种利用某种新人工智能预测技术的新产品，就需要核保部门调整自己的程序来适应它。此外，哪个部门将负责监控和调整保费？是具有确定保费专业知识的核保部门，还是具有验证经验的理赔部门？随着部门之间界限的模糊，保险公司面临重新分配决策权，并改变信息处理人员的压力。


    保险公司之所以没有正面解决降低风险的问题，利用技术来推出新产品，也许是因为这在现有系统中不可能或很难做到，因为现有系统把风险水平作为一个生活事实。此外，降低风险意味着降低保费，这可能会遭到代理人和系统中其他人员的反对，因为他们的报酬与保费挂钩。但如果一家保险公司将风险降低而非风险转移置于核心位置，那么它将设计一个激励系统，将每个人的利益都与风险降低紧密结合。虽然由于风险变低，平均保费就会降低，但公司可能会获得更高的利润和更多的保单。通过增强预测，保险公司将比房主更了解与房屋相关的特定风险源。因此，将价值主张的重点从风险转移转向风险管理，对社会将大有裨益（也是一种好的商业策略）。为了实现这一点，保险公司需要一个新的系统，这不仅需要新技术，还需要组织变革。


    ## 定制化的影响


    人工智能预测的一个优势是能够提供更加定制化的产品，更准确地反映客户的背景。我们已经在个性化广告和创业教育中看到了这一点。通过将产品信息与对客户需求和喜好的预测相匹配，公司可以提供更个性化的商品或服务。因此，它创造了价值，因为客户得到了符合他们自己偏好的东西。


    定制化通常需要增强流程的自动化程度。如果你从提供几百种或几千种不同的产品到提供数百万种产品，并将它们与较少的消费者匹配，人类就会很难管理这个过程。因此，你需要一个能够自动预测和向客户交付产品的系统。这个自动化过程在设计上是具有挑战性的，而且必然会对已经在现有组织中工作的人员产生影响，它会产生权力分配上的冲突，这可能阻碍新系统的设计。


    使用人工智能系统探索画布，我们可以分析个性化定制对保险业的潜在影响。保险公司长期以来一直试图获取有助于核保和确定适当保费的信息，房屋的位置（涉及水灾和火灾风险）、是否安装了烟雾检测系统及建筑材料都可能影响核保。但人工智能预测有更大的潜力。3
    通过在理赔方面收集更多数据，保险公司可以大幅提高对特定房屋预期损失估计的准确度，这正是像 Lemonade 这样的保险科技公司试图做的事。4 但我们仍然不知道人工智能是否能够以有意义的方式影响核保。


    假设一家保险科技公司可以检查一栋房屋，提供更精确的预期损失，并相应地调整保费。同时，假设这使保险公司能够根据房屋特征更清楚地为保单定价，向房主传递是否值得做出更改以优化他们保费的信息。这就会有两个广泛的影响：一是竞争影响，二是组织影响。


    竞争影响是，如果保险科技公司识别出低风险客户，它就可以通过保费折扣的方式来吸引他们，而那些不能识别这些客户的公司则无法做到这一点。这是一项复杂的工作，因为如果保险科技公司产生足够大的影响力，那么老牌保险公司可能会模仿保险科技公司提供的保费，通过观察保险科技公司来安全地学习如何锁定目标客户。尽管如此，这个过程仍然可能给予保险科技公司竞争优势。


    现有的保险公司可能会受到刺激而做出回应。与保险科技公司不同，它们不是初创企业，因此它们必须做出改变以采用更精确的核保方式。出售保单的传统流程涉及从客户那里收集一些基本信息，让人类核保员评估这些信息，然后告知客户所需支付的保费金额。这个过程是向客户进行营销的一部分。保险科技公司把这个过程自动化了，在向客户提供保费金额之前不需要有人签字。这具有速度优势，但缺少了人的因素。5
    许多保险科技公司吹嘘这是一个关键优势，并宣传它们能够用更少的人员去提供保险。例如，2018 年，Lemonade 声称每个员工可以签发 2 500 份保单，而
    Allstate 只能签发 1 200 份，GEICO 仅能签发 650 份。人工智能在保险业的应用将导致核保人员、销售人员及其直属上司的减少。


    很多人会抵制变革。我们可以想象，如果他们被排除在圈子之外，他们会提出哪些反对意见。现有的保险公司已经表示了怀疑。一家保险行业刊物称 Lemonade 的首次公开募股是“独角兽吐彩虹”。⁶

    ① 独角兽与彩虹是一种常见的组合，其指代的是欢乐、积极的事情或事物，在这里“独角兽吐彩虹”表达了对 Lemonade 首次公开募股的质疑。现有的保险公司认为，Lemonade
    作为一家独角兽企业，其首次公开募股可能只是一个噱头。——译者注


    我们可以说，制定保费和销售保单并非完全客观，还有一些主观因素可以由熟练的核保人员识别出来。保险公司会声称，Lemonade 不会因为忽略这一点而减少预期损失。那么，预期损失增加从而导致更高保费的现有客户怎么办？一家现有保险公司能否在不损害自身品牌的情况下做到这一点？所有这些反对意见之所以有一定的道理，是因为基于人工智能的新组织能否发挥作用存在不确定性。矛盾之处在于，如果一家知名的保险公司不想把现有组织的命运押在不确定性上，而人工智能技术被证明有利的话，那么再采取变革就可能太迟了。当现有组织采纳可能需要新系统的创新时，它们就会面临这个困境。新系统会赋予创新者多少权力，创新者就会从掌管旧系统的人手中夺走多少权力。


    ## 本章要点


    - 大多数公司创建的系统既包含许多相互影响的规则，又包含管理不确定性的相关架构，以至于很难思考如何撤销其中的部分内容，并思考人工智能预测所带来的新系统设计的可能性。因此，与其思考改变一些规则或架构的影响，以及这些改变将如何影响系统的其他部分，我们建议不如从头开始：用白板方法。人工智能系统探索画布包括三个步骤：第一，明确任务；第二，假设你拥有超强大、高精度的人工智能，将业务简化，只剩实现任务所需的最少决策；第三，具体说明与每个主要决策相关的预测和判断。


    - 在房屋保险中，业务可以简化为三个主要决策：营销，决定如何分配营销资源以获取客户、优化利润或实现增长；核保，为每份房主保单确定保费，实现盈利或增长的最大化（如果预测风险过高，保单将无利可图，考虑到价格的监管限制，保险公司甚至可以选择不提供该保单）；理赔，决定所提交的索赔是否合法，并在合法的情况下支付索赔。如果有三个超强大、高精度的人工智能可以预测：潜在客户的终身价值
    × 转化概率，提出索赔的可能性 × 索赔金额，以及索赔的合法性，那么你可以重新设计一个改进过的、快速、高效、低成本且高利润的房屋保险业务，其在价格和便利性方面都超越竞争对手。这正是一些新的保险科技公司的目标。


    - 人工智能系统探索画布还可以洞察新的业务机会。例如，如果能够预测提出索赔的可能性 × 索赔金额的人工智能变得足够好，以至于它可以对风险级别或次级风险级别进行风险预测（例如，传感器能提前检测出电气火灾风险或漏水管道导致的水灾风险增加），那么公司就可以预测哪些风险缓解方案将获得足够高的投资回报率，以证明实施这些方案的成本是合理的。然后，保险公司可以补贴风险缓解设备并降低保费，为客户提供全新的价值主张：风险缓解。保险公司不仅将风险从房主转移给承保方，还降低了风险，这是一项有价值的服务，而在保险业历史上，除个别案例，一直没有提供过该服务。要充分利用这一机会，需要设计一个专为风险缓解而优化的新系统。


    ## 第十八章


    ## 预见系统变化


    一位患者因胸痛来到急诊科。这是心脏病发作吗？医生可以通过检查来判断。阳性检查结果将使医生快速采取治疗措施，使患者尽快康复。但这些检查既昂贵又具有侵入性。成像检查会使用辐射仪器，可能增加患者患癌的长期风险。运动平板试验存在微小但明确的心搏骤停风险。心导管检查除了涉及辐射风险，还存在动脉损伤的风险。因此这不是一个简单的决策。


    医生需要权衡这些效益和成本。患者心脏病发作的可能性有多大？这是一种预测。如果预测认为可能性很高，那就倾向于进行检查和治疗。如果可能性很低，那么检查很可能是一种浪费，而且会无故给患者带来风险。


    在决定是否进行检查时，检查的好处在于揭示关于进一步干预（如植入支架）的信息。如果患者确实心脏病发作，那么对心脏病的治疗将使其受益；如果没有发作，那对其就没什么好处。因此，检查的价值完全源于它所创造的决策价值，即将干预措施针对那些最能从中受益的患者。


    检查并非免费。压力测试可能需要数千美元，心导管检查可能需要数万美元。为了避免高出十倍的费用，你会愿意为压力测试买单。


    这仅是货币成本。有些检查还需要通宵监测和观察，而检查本身也会带来风险：在所有成像检查中，压力测试承载着最高剂量的电离辐射，会显著增加患癌的长期风险。在心脏病发作的情况下进行运动平板试验会带来微小但明确的心搏骤停风险。直接进行导管插入的好处在于，治疗（通常是植入支架）可以作为诊断的一部分同时完成。


    然而，你并不一定想要避免压力测试及其相关风险，因为导管插入手术也具有风险。侵入性程序涉及大剂量的电离辐射，同时静脉注射造影剂可能导致肾功能衰竭，并存在动脉损伤和导致严重中风的风险。因此，在决定是否治疗心脏病之前，首先要决定是否对患者进行心脏病发作的检查，以及是先进行压力测试还是直接进行心导管检查。


    检查的决策权在医生手中，检查通常是手术的前奏，但医生在决定如何去做时会运用其判断力。患者的年龄是多少？是否需要更多的护理（如在疗养院）？患者是否患有其他疾病（如癌症）？所有这些都会影响最终的决策。


    现在，假设医生在预测这些复杂问题方面有了超人类的帮助，也就是说，假设一种人工智能可以快速评估患者是否需要进行检查。这里的潜在好处显而易见。这并非假设。经济学家塞德希尔·穆来纳森和齐亚德·奥伯迈尔基于急诊科医生在诊断患者时所拥有的相同信息，建立了一个人工智能系统。²
    他们发现，他们的人工智能在预测心脏病发作方面比医生更准确。医生的决策中充满了大量的过度检查，患者被迫做了不必要的检查。考虑到美国医疗系统中的某些激励机制，或许这个结果是可以预见的。没有哪个医生愿意面对不进行检查所带来的责任，尤其是在你做的检查越多就能收入越多的时候。


    令人惊讶的是，穆来纳森和奥伯迈尔还发现了大量的漏检问题。


    数千名被人工智能预测为高风险的患者从未接受过检查。被人工智能算法预测为高风险患者的最终结果更为糟糕，不是回到医院就是面临死亡。


    这个人工智能算法在各个方面都表现得十分出色。它既便宜又快速，并且在这两个方面似乎都不容易出错。你可以将相同数量的检查从低风险患者那里重新分配到高风险患者身上，从而让大家都能取得更好的结果，既能帮助患者，又能减少责任风险。或者，你可以减少检查，但要保持同样的医疗质量。


    ## 点解决方案和应用解决方案


    这看起来像一个毫无争议的人工智能应用。急诊科的人工智能诊断提供了一个优秀且有效的点解决方案。人工智能能够支持医生做出更好的决策，并在成本较低的情况下逐步改善患者的健康状况。工作流程不会改变，也没有威胁到人的工作。医生在诊断步骤上并没有花费太多时间，因为它与判断是“脱钩”的。


    问题在于，这些好处是否值得投入成本来应用一项新工具。医疗保健管理者会面对许多有前途的新技术，每一项技术都需要培训员工和对流程的微调，每一项技术也都有风险。在实际操作中，技术很少像在测试中那样好。管理者可能会决定，诊断心脏病发作的人工智能点解决方案所带来的增量收益不值得去花费成本。


    然而，管理者可能会发现人工智能应用解决方案具有吸引力。他们不再使用向医生提供预测的人工智能，而是采用一种人工智能来决定是否需要进行检查。医生不再参与对患者的决策。相反，当患者到达急诊科时，机器会预测患者是否会有心脏病发作的可能性。如果预测结果低于某个阈值，患者就会被送回家；如果预测结果在某个中间


    '
  mdcn: '


    我们的想法是确定实现该使命所需的决策。显然，可能会有很多决策（在理论上，可能会有数百万个）。在这里并不是要确定所有决策，而是要陈述所需决策的类别。如果你拥有非常强大的预测机器来增强你的决策能力，那么实现你的使命所需的最小决策量是多少？只需确定最重要或核心的决策即可。


    确定决策之后，就是深入研究的时候了。为了做出决策，你需要收集什么信息？这不仅包括你拥有或可以轻易获得的信息，而且包括你可以想象到的重要信息。大多数决策是在不确定的情况下做出的。然而通过预测，你就可能拥有做出更好决策所需的信息。预测是人工智能可能提供的东西，因此这个练习将预测与组织中的核心决策联系起来。


    总之，没有完美的预测。如果你拥有完美的预测，做决策将变得容易，并且有可能实现自动化。尽管画布是一个相对理想的工具，但它的工作并不是不切实际的。因此，对于每个决策，你需要阐明所涉及的主要权衡项。事实上，我们提倡使用一个“错误框架”。如果我们的预测错误或不存在，我们可能犯什么样的错误？这会让你了解到决策的风险程度。在第四章的雨伞选择中，如果你的天气预报错误，你要么带了多余的伞，要么被淋湿了。你的判断就是如何对这些错误进行排序。对于画布上的每个决策，你都需要确定犯错的后果，并通过明确计算成本或以其他更主观的方式对它们进行排序。


    接下来，你可以将任何潜在的基于人工智能的预测与决策关联起来，以评估：你的组织是否明确采取了这些决策，当前谁拥有这个决策；如果你使用人工智能来做出决策，那么对你当前组织的其他部门可能会造成什么样的颠覆？（我们将在第十八章和结语中讨论这最后的几步。）目前，你需要一个起点——一块白板——和你所在行业的基础系统。


    ## 保险业


    从许多方面来看，没有比保险业更稳定的行业了。从几个世纪前开始，它已经发展为现代生活的重要组成部分。消费者的保险产品很简单。人们每年向保险公司支付保费，如果他们发生车祸、房屋损坏或被盗或者死亡，就会得到赔偿。信息技术革命带来了一些进步，计算精算表变得更容易，可以通过不断调整修改来提供更多的保险产品。但最终，这些产品的主要变化来自超出客户控制范围的因素，如年龄或居住地。


    提供保险产品需要什么呢？我们以家庭保险业为例。该行业的一个企业使命可以这样表述：“为房主提供安心服务，防止他们最有价值的资产遭受灾难性的损失。”你可以将这句话写在画布的顶部方框中（见表
    17-2）。


    在表 17-2 中，我们确定了三类决策——营销、核保和理赔。这些通常是保险公司的各个部门，这让对这个行业的分析变得简单一些。


    营销负责获取客户：找到那些需要保险的人，并向他们销售产品。营销人员的决策围绕着在哪些地方投入资源以锁定客户。核保创建保险产品并评估客户风险状况以确定保费，同时确认已获得的客户是否已成为投保客户。换句话说，核保人员负责定价保险产品，这意味着他们了解对特定客户或具有特定特征的客户群体进行投保的成本。理赔部门决定是否支付索赔。实际上，它处理的是在其他企业中被称为“客户体验”的事务：把保险金给客户是多么令人愉快，但这样做也许是为了尽可能不提供这些保险金。


    表 17-2 还概述了对于这些决策的重要预测，以及对预测后果（或广义上的决策错误的后果）的判断。房屋等保险业务有一条非常简单的盈利路径。你希望销售那些预期赔付损失小于保费收入的保单。客户关心保费，但也关心服务，即注册保单和提出索赔的便利程度。在这个竞争激烈的行业中，一家成熟的保险公司无法做太多来改善保费水平，但如果能减少预期损失，将会获得更多利润。


    ## 表 17-2 人工智能系统探索画布：家庭保险业


    尽可能将业务简化到最少量的决策，看看是哪些？


    | 为房主提供安心服务，防止他们最有价值的资产遭受灾难性的损失 |  |  |

    | :- | :- | :- |

    | 营销：决定谁是营销的目标 | 核保：决定价格（保险费） | 理赔：决定是否支付索赔 |

    | 预测每个潜在客户的购买意愿 | 预测房主在一定价值范围内提出索赔的可能性 | 预测已提交的索赔有效并应获赔付的可能性 |

    | 确定以不会购买的人为目标客户的成本与不以原本会购买的人为目标客户的成本 | 设定策略（增长与盈利）：确定定价过低（损失）与定价过高（失去客户）的成本 |
    确定不支付合法索赔的成本（受挫的客户、声誉受损）与支付非法索赔的成本（经济损失） |


    保险公司如何做到这一点呢？它希望找到预期损失较低的客户，并向他们销售保单，同时确保只向预期损失较高的客户销售更高保费的保单。但如果没有关于谁具有较低或较高预期损失的良好信息，很多客户就将支付类似的保费。预期损失较低的客户支付得太多，而预期损失较高的客户支付得太少。此外，在没有正确信息的情况下，竞争无法解决这个问题。因此，公司希望预测哪些客户提出索赔的可能性较低，并在营销中将他们作为目标客户。这些预测与营销和核保决策有关。该公司还希望确保在适当时候支付索赔，而不是其他情况——它希望避免欺诈。理赔失误最终会影响公司的竞争能力，因为这会增加其成本。因此，它可以判断错误对保险业务的影响（在表
    17-2 中列举了这些例子）。


    通过梳理这些决策，我们还可以看到它们是如何相互关联的。正如我们先前所提到的，人工智能预测为保险业提供了机遇，特别是对核保人员来说，他们的工作就是预测客户的风险状况，这是人工智能的一个近乎完美的应用。与此同时，通过加快这个过程，营销人员的工作变得更容易，销售人员可以迅速回应潜在客户的需求。不同司法管辖区的监管问题制约着公司如何使用人工智能来进行风险预测，但核保和营销在其价值上是一致的。人工智能还可以更轻松地评估索赔的有效性，这也反过来影响了营销和核保。但实际上，理赔部门只是在自己的领域内做得更好而已。


    我们可以看到之前提到的人工智能应用如何适应这个系统，通过拍照评估索赔的方式该应用程序可自动做出理赔决策。这只是做出决策的另一种方式，完全符合理赔部门的要求。客户在有了更好的理赔体验后，营销工作也变得更容易，营销人员可以选择将资源分配给最看重更好体验的客户。当然，这可能会给核保带来更复杂的问题：那些更容易提出索赔的客户会提出更多索赔吗？营销会以更有可能提出索赔的人为目标客户吗？理赔部门的成本会上升（索赔次数增加）还是下降（评估成本降低）？因此，虽然这个应用程序完美地适用于理赔决策，但它的采用可能会影响其他决策。有趣的是，它并没有从根本上改变这些决策的内容、所涉及的判断或所需预测。这样的应用可能会在不需要进行系统变革的情况下被采用（或不被采用）。


    那么，可以对客户的风险状况和行为进行监控及反馈的应用程序如何呢？保险业当前系统的核心是风险评估，通常是在客户获取阶段进行的，尽管在某些情况下，在保险合同续签时会重新评估。客户在购买房屋保险时，可能会通过一些方式来降低保费，比如证明自家安装了能立即呼叫外部帮助的报警系统，或者安装了一旦出现水管爆裂就能自动关闭水源的水监测系统。但不良事件的风险不太可能由房屋特征决定，而是由行为决定的。例如，美国消防协会报告称，在美国，房屋火灾的起因中有
    49% 是烹饪。1 深入研究这些报告，你会发现这不是泛指任何一种烹饪，而是特指用油来烹饪，特别是油炸，这是有道理的，也不是什么新闻。可问题是，很少在家做饭的人，为什么要与每天都要油炸食物的大家庭支付相同的保费呢？


    答案非常简单：除了彻底拆除厨房，保险公司无法监控某人是否在烹饪，更不用说他们是否在用油来烹饪了。公司所能采用的最好办法是根据这些事实调整保险赔付，但这意味着它不是针对烹饪中的不幸事件而为人们提供保险的，而是针对他们整体的风险状况。


    但人工智能技术可以弥补这些不足，并以经济高效的方式监控持续存在的风险。其中一些是自动干预机制，包括监测水源（如 Phyn）或电气事故（如 Ting）在内的人工智能，其工作原理类似于烟雾探测器，保险公司已经在鼓励客户使用这些设备。对于汽车保险，一些驾驶员监控设备不仅会考虑驾驶里程，还会考虑驾驶质量。安装这些设备，你的保费可以相应地减少。


    虽然烹饪、取暖、吸烟或使用蜡烛等行为都具有很大的风险，但所有这些行为都可以被监控，而且与风险评估相关的指标可以持续发送给保险公司，保费也可以得到实时调整。当然，这种监控方式会带来隐私及相关方面的问题。但就像汽车保险公司能够让客户自愿同意监控他们的驾驶一样，它们也可以对房屋进行同样的监控。如果这种监控意味着，那些发现保费降低
    25% 的人认为调整行为并降低 25% 的火灾风险是值得的，那对所有相关方来说都是一笔不错的交易。2


    然而，之所以过去没有提供这些根据行为做出反应的保险产品，是因为此类监控曾经并不可行。其中许多产品不一定涉及消费者，却涉及企业保险，而这些企业风险是很难进行评估的。


    创建这些新产品需要当前各部门的协调，特别是营销和核保之间的界限变得模糊。如果营销部门设想出一种利用某种新人工智能预测技术的新产品，就需要核保部门调整自己的程序来适应它。此外，哪个部门将负责监控和调整保费？是具有确定保费专业知识的核保部门，还是具有验证经验的理赔部门？随着部门之间界限的模糊，保险公司面临重新分配决策权，并改变信息处理人员的压力。


    保险公司之所以没有正面解决降低风险的问题，利用技术来推出新产品，也许是因为这在现有系统中不可能或很难做到，因为现有系统把风险水平作为一个生活事实。此外，降低风险意味着降低保费，这可能会遭到代理人和系统中其他人员的反对，因为他们的报酬与保费挂钩。但如果一家保险公司将风险降低而非风险转移置于核心位置，那么它将设计一个激励系统，将每个人的利益都与风险降低紧密结合。虽然由于风险变低，平均保费就会降低，但公司可能会获得更高的利润和更多的保单。通过增强预测，保险公司将比房主更了解与房屋相关的特定风险源。因此，将价值主张的重点从风险转移转向风险管理，对社会将大有裨益（也是一种好的商业策略）。为了实现这一点，保险公司需要一个新的系统，这不仅需要新技术，还需要组织变革。


    ## 定制化的影响


    人工智能预测的一个优势是能够提供更加定制化的产品，更准确地反映客户的背景。我们已经在个性化广告和创业教育中看到了这一点。通过将产品信息与对客户需求和喜好的预测相匹配，公司可以提供更个性化的商品或服务。因此，它创造了价值，因为客户得到了符合他们自己偏好的东西。


    定制化通常需要增强流程的自动化程度。如果你从提供几百种或几千种不同的产品到提供数百万种产品，并将它们与较少的消费者匹配，人类就会很难管理这个过程。因此，你需要一个能够自动预测和向客户交付产品的系统。这个自动化过程在设计上是具有挑战性的，而且必然会对已经在现有组织中工作的人员产生影响，它会产生权力分配上的冲突，这可能阻碍新系统的设计。


    使用人工智能系统探索画布，我们可以分析个性化定制对保险业的潜在影响。保险公司长期以来一直试图获取有助于核保和确定适当保费的信息，房屋的位置（涉及水灾和火灾风险）、是否安装了烟雾检测系统及建筑材料都可能影响核保。但人工智能预测有更大的潜力。3
    通过在理赔方面收集更多数据，保险公司可以大幅提高对特定房屋预期损失估计的准确度，这正是像 Lemonade 这样的保险科技公司试图做的事。4 但我们仍然不知道人工智能是否能够以有意义的方式影响核保。


    假设一家保险科技公司可以检查一栋房屋，提供更精确的预期损失，并相应地调整保费。同时，假设这使保险公司能够根据房屋特征更清楚地为保单定价，向房主传递是否值得做出更改以优化他们保费的信息。这就会有两个广泛的影响：一是竞争影响，二是组织影响。


    竞争影响是，如果保险科技公司识别出低风险客户，它就可以通过保费折扣的方式来吸引他们，而那些不能识别这些客户的公司则无法做到这一点。这是一项复杂的工作，因为如果保险科技公司产生足够大的影响力，那么老牌保险公司可能会模仿保险科技公司提供的保费，通过观察保险科技公司来安全地学习如何锁定目标客户。尽管如此，这个过程仍然可能给予保险科技公司竞争优势。


    现有的保险公司可能会受到刺激而做出回应。与保险科技公司不同，它们不是初创企业，因此它们必须做出改变以采用更精确的核保方式。出售保单的传统流程涉及从客户那里收集一些基本信息，让人类核保员评估这些信息，然后告知客户所需支付的保费金额。这个过程是向客户进行营销的一部分。保险科技公司把这个过程自动化了，在向客户提供保费金额之前不需要有人签字。这具有速度优势，但缺少了人的因素。5
    许多保险科技公司吹嘘这是一个关键优势，并宣传它们能够用更少的人员去提供保险。例如，2018 年，Lemonade 声称每个员工可以签发 2 500 份保单，而
    Allstate 只能签发 1 200 份，GEICO 仅能签发 650 份。人工智能在保险业的应用将导致核保人员、销售人员及其直属上司的减少。


    很多人会抵制变革。我们可以想象，如果他们被排除在圈子之外，他们会提出哪些反对意见。现有的保险公司已经表示了怀疑。一家保险行业刊物称 Lemonade 的首次公开募股是“独角兽吐彩虹”。⁶

    ① 独角兽与彩虹是一种常见的组合，其指代的是欢乐、积极的事情或事物，在这里“独角兽吐彩虹”表达了对 Lemonade 首次公开募股的质疑。现有的保险公司认为，Lemonade
    作为一家独角兽企业，其首次公开募股可能只是一个噱头。——译者注


    我们可以说，制定保费和销售保单并非完全客观，还有一些主观因素可以由熟练的核保人员识别出来。保险公司会声称，Lemonade 不会因为忽略这一点而减少预期损失。那么，预期损失增加从而导致更高保费的现有客户怎么办？一家现有保险公司能否在不损害自身品牌的情况下做到这一点？所有这些反对意见之所以有一定的道理，是因为基于人工智能的新组织能否发挥作用存在不确定性。矛盾之处在于，如果一家知名的保险公司不想把现有组织的命运押在不确定性上，而人工智能技术被证明有利的话，那么再采取变革就可能太迟了。当现有组织采纳可能需要新系统的创新时，它们就会面临这个困境。新系统会赋予创新者多少权力，创新者就会从掌管旧系统的人手中夺走多少权力。


    ## 本章要点


    - 大多数公司创建的系统既包含许多相互影响的规则，又包含管理不确定性的相关架构，以至于很难思考如何撤销其中的部分内容，并思考人工智能预测所带来的新系统设计的可能性。因此，与其思考改变一些规则或架构的影响，以及这些改变将如何影响系统的其他部分，我们建议不如从头开始：用白板方法。人工智能系统探索画布包括三个步骤：第一，明确任务；第二，假设你拥有超强大、高精度的人工智能，将业务简化，只剩实现任务所需的最少决策；第三，具体说明与每个主要决策相关的预测和判断。


    - 在房屋保险中，业务可以简化为三个主要决策：营销，决定如何分配营销资源以获取客户、优化利润或实现增长；核保，为每份房主保单确定保费，实现盈利或增长的最大化（如果预测风险过高，保单将无利可图，考虑到价格的监管限制，保险公司甚至可以选择不提供该保单）；理赔，决定所提交的索赔是否合法，并在合法的情况下支付索赔。如果有三个超强大、高精度的人工智能可以预测：潜在客户的终身价值
    × 转化概率，提出索赔的可能性 × 索赔金额，以及索赔的合法性，那么你可以重新设计一个改进过的、快速、高效、低成本且高利润的房屋保险业务，其在价格和便利性方面都超越竞争对手。这正是一些新的保险科技公司的目标。


    - 人工智能系统探索画布还可以洞察新的业务机会。例如，如果能够预测提出索赔的可能性 × 索赔金额的人工智能变得足够好，以至于它可以对风险级别或次级风险级别进行风险预测（例如，传感器能提前检测出电气火灾风险或漏水管道导致的水灾风险增加），那么公司就可以预测哪些风险缓解方案将获得足够高的投资回报率，以证明实施这些方案的成本是合理的。然后，保险公司可以补贴风险缓解设备并降低保费，为客户提供全新的价值主张：风险缓解。保险公司不仅将风险从房主转移给承保方，还降低了风险，这是一项有价值的服务，而在保险业历史上，除个别案例，一直没有提供过该服务。要充分利用这一机会，需要设计一个专为风险缓解而优化的新系统。


    ## 第十八章


    ## 预见系统变化


    一位患者因胸痛来到急诊科。这是心脏病发作吗？医生可以通过检查来判断。阳性检查结果将使医生快速采取治疗措施，使患者尽快康复。但这些检查既昂贵又具有侵入性。成像检查会使用辐射仪器，可能增加患者患癌的长期风险。运动平板试验存在微小但明确的心搏骤停风险。心导管检查除了涉及辐射风险，还存在动脉损伤的风险。因此这不是一个简单的决策。


    医生需要权衡这些效益和成本。患者心脏病发作的可能性有多大？这是一种预测。如果预测认为可能性很高，那就倾向于进行检查和治疗。如果可能性很低，那么检查很可能是一种浪费，而且会无故给患者带来风险。


    在决定是否进行检查时，检查的好处在于揭示关于进一步干预（如植入支架）的信息。如果患者确实心脏病发作，那么对心脏病的治疗将使其受益；如果没有发作，那对其就没什么好处。因此，检查的价值完全源于它所创造的决策价值，即将干预措施针对那些最能从中受益的患者。


    检查并非免费。压力测试可能需要数千美元，心导管检查可能需要数万美元。为了避免高出十倍的费用，你会愿意为压力测试买单。


    这仅是货币成本。有些检查还需要通宵监测和观察，而检查本身也会带来风险：在所有成像检查中，压力测试承载着最高剂量的电离辐射，会显著增加患癌的长期风险。在心脏病发作的情况下进行运动平板试验会带来微小但明确的心搏骤停风险。直接进行导管插入的好处在于，治疗（通常是植入支架）可以作为诊断的一部分同时完成。


    然而，你并不一定想要避免压力测试及其相关风险，因为导管插入手术也具有风险。侵入性程序涉及大剂量的电离辐射，同时静脉注射造影剂可能导致肾功能衰竭，并存在动脉损伤和导致严重中风的风险。因此，在决定是否治疗心脏病之前，首先要决定是否对患者进行心脏病发作的检查，以及是先进行压力测试还是直接进行心导管检查。


    检查的决策权在医生手中，检查通常是手术的前奏，但医生在决定如何去做时会运用其判断力。患者的年龄是多少？是否需要更多的护理（如在疗养院）？患者是否患有其他疾病（如癌症）？所有这些都会影响最终的决策。


    现在，假设医生在预测这些复杂问题方面有了超人类的帮助，也就是说，假设一种人工智能可以快速评估患者是否需要进行检查。这里的潜在好处显而易见。这并非假设。经济学家塞德希尔·穆来纳森和齐亚德·奥伯迈尔基于急诊科医生在诊断患者时所拥有的相同信息，建立了一个人工智能系统。²
    他们发现，他们的人工智能在预测心脏病发作方面比医生更准确。医生的决策中充满了大量的过度检查，患者被迫做了不必要的检查。考虑到美国医疗系统中的某些激励机制，或许这个结果是可以预见的。没有哪个医生愿意面对不进行检查所带来的责任，尤其是在你做的检查越多就能收入越多的时候。


    令人惊讶的是，穆来纳森和奥伯迈尔还发现了大量的漏检问题。


    数千名被人工智能预测为高风险的患者从未接受过检查。被人工智能算法预测为高风险患者的最终结果更为糟糕，不是回到医院就是面临死亡。


    这个人工智能算法在各个方面都表现得十分出色。它既便宜又快速，并且在这两个方面似乎都不容易出错。你可以将相同数量的检查从低风险患者那里重新分配到高风险患者身上，从而让大家都能取得更好的结果，既能帮助患者，又能减少责任风险。或者，你可以减少检查，但要保持同样的医疗质量。


    ## 点解决方案和应用解决方案


    这看起来像一个毫无争议的人工智能应用。急诊科的人工智能诊断提供了一个优秀且有效的点解决方案。人工智能能够支持医生做出更好的决策，并在成本较低的情况下逐步改善患者的健康状况。工作流程不会改变，也没有威胁到人的工作。医生在诊断步骤上并没有花费太多时间，因为它与判断是“脱钩”的。


    问题在于，这些好处是否值得投入成本来应用一项新工具。医疗保健管理者会面对许多有前途的新技术，每一项技术都需要培训员工和对流程的微调，每一项技术也都有风险。在实际操作中，技术很少像在测试中那样好。管理者可能会决定，诊断心脏病发作的人工智能点解决方案所带来的增量收益不值得去花费成本。


    然而，管理者可能会发现人工智能应用解决方案具有吸引力。他们不再使用向医生提供预测的人工智能，而是采用一种人工智能来决定是否需要进行检查。医生不再参与对患者的决策。相反，当患者到达急诊科时，机器会预测患者是否会有心脏病发作的可能性。如果预测结果低于某个阈值，患者就会被送回家；如果预测结果在某个中间


    '
