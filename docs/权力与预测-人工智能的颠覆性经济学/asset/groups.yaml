    # 将新冠肺炎疫情视为预测问题


    确定预测问题的第一步是找出哪里存在不确定性。从这个角度来看，疫情充满了不确定性。最大的未知数是何时会出现具有大面积传播潜力的病原体，这的确可能是人工智能可以解决的问题。然而，我们想要关注的是更贴近生活的问题：疫情防控。换言之，当病原体将要或者已经出现时，控制住它的关键不确定性因素是什么呢？


    以这种方式来规划疫情防控可能有些奇怪。毕竟，我们习惯将其视为一个公共卫生难题：如何找到疫苗来结束疫情，如何找到可以拯救生命的治疗方法，或者如何降低病毒的传播速度？但当我们分析是什么使疫情暴发，以及人们在健康、经济民生和社会生活方面所付出的代价时，我们意识到那些阻止人们相互传染的防控措施也会影响我们的正常生活。


    在疫情暴发的前几个月里，人们开发了各种工具来预测谁可能被'
