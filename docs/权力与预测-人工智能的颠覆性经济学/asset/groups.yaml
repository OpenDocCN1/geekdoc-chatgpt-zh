    变得陌生。


    # 判断的机会


    预测和判断的“脱钩”创造了机会。这意味着，决策的制定者不是谁能最好地同时进行预测和判断，而是谁能最好地利用人工智能预测来做出判断。


    一旦人工智能做出了预测，那么拥有最佳判断能力的人就能脱颖而出。正如我们所指出的，不管是在概念上，还是在越来越多的实践中，人工智能都能够比许多放射科医生更精确地进行预测。虽然这取决于具体的预测内容，但实际上，人工智能可以不通过观察放射科医生的预测来进行训练，而是通过将图像与观察到的可靠结果相匹配，比如在病理学上是否发现了一个恶性肿瘤。因此，人工智能预测可能比人类预测更精准。科技先驱和知名人工智能投资人维诺德·科斯拉认为，未来放射科医生如果不依赖人工智能预测，就可能造成医疗事故。


    这就涉及一个问题——人工智能预测对放射科医生的判断价值有何影响？考虑到放射科医生（至少在美国）的工作方式，他们并不知道患者的其他信息。因此，如果人工智能预测某个患者患有恶性肿瘤的概率为
    30%，那么在什么情况下医疗系统能够相信一个放射科医生的判断，即患者应该接受肿瘤相关诊断和治疗？但与此同时，另一个医生则认为患者不应该接受诊断和治疗。实际上，这很难想象。人们推测，医疗专业人员委员会会在机器预测前进行讨论和争辩，制定诊断规则，随后该委员会的判断被大规模地应用。放射科医生的决策被拆分为机器预测和委员会的判断两部分。


    一旦人工智能提供了预测结果，新的系统就会出现，以利用更'
