    ### 劳伦斯·H.萨默斯

    哈佛大学前校长，美国财政部前部长


    人工智能之于21世纪，如同电力之于20世纪。《权力与预测》是思考人工智能对所有经济主体意味着什么的一部佳作。


    ### 达龙·阿西莫格鲁

    麻省理工学院经济学教授，《国家为什么会失败》作者


    我们应如何确保个人、公司和组织从人工智能中受益，而不是浪费时间和资源来应对意想不到的后果呢？《权力与预测》这本书的可读性很强，它讲述了人工智能如何通过提供更好的预测和帮助企业重组系统来改善我们的工作。


    ### 蒂夫·麦克勒姆

    加拿大央行行长


    没有人能比《权力与预测》的三位作者更深入洞察人工智能的基本经济学原理，以及人工智能真正能带来什么。


    ### 多米尼克·巴顿

    高博锐新全球管理合伙人


    《权力与预测》是各类企业领导者都应该阅读的书籍，它阐述了人工智能所带来的巨大机遇和实现过程中所面临的挑战。


    ### 维诺德·科斯拉

    科斯拉创投创始人


    在未来的几十年里，人工智能必将取代工作岗位，颠覆各行各业。《权力与预测》一书令人兴奋地讨论了即将发生的系统变革。


    ### 埃里克·布莱恩约尔松

    斯坦福大学教授，《第二次机器革命：数字化技术将如何改变我们的经济与社会》作者


    《权力与预测》这本书注定会成为了解人工智能如何改变经济，以及为何会改变经济的权威指南。

