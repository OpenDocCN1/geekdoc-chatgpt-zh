    # 温室系统


    机场似乎是一个让人望而生畏的地方，在那里人工智能可能会颠覆不确定性所带来的成本，但是这些机会可能就在你自己的行为中。发现隐藏的不确定性，并创建人工智能预测来形成新的决策，这可能会使你的经营业务发生巨大改变。


    种植农作物充满了不确定性，主要是出于天气原因。如果过热、过冷、过于潮湿、湿度不足或者风力太大，那么产量可能会很低。这些因素会促使你选择在室内种植农作物，以便减少天气的影响。问题是，农作物生长还需要光照。因此就出现了温室，它是可以在室内种植农作物的地方，同时可以享受到阳光。温室使农民可以对温度、湿度和灌溉进行控制，14
