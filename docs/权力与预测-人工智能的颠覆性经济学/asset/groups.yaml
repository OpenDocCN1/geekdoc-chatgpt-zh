    # 反过来看


    在“中间时代”的最初阶段，采用人工智能的机会通常是被动的。供应商会向你提供一种新的人工智能技术，用于预测与你的组织有关的事情；或者你已经要求内部团队对其工作流程进行分析，确认是否有机会使用人工智能来协助完成一项或多项任务。17
