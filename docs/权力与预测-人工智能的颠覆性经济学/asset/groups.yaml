    范围内，患者就会被送去进行压力测试；如果人工智能预测患者很可能心脏病发作，那么患者将直接接受心导管检查。将患者送回家、进行压力测试和进行心导管检查决策之间的阈值是一种判断。在这种情况下，这种判断可能来自医院的领导层或由医生和其他医学专家组成的委员会。


    # 系统能处理好吗


    医院通常分为两个主要部门，它们各司其职。³行政管理部门负责财务方面的工作，包括获取账款（或政府、保险机构的报销）、雇用员工和采购资源。医疗部门负责患者的诊断和治疗。在医院内部，每个部门都有细分，但在决策权的分配上，一个部门掌握着资金和资源，而另一个部门掌握着医疗。这两者之间的冲突是持续存在的。但大多数正常运转的医院已经达成了部门之间的协议，允许各自做出决策，同时受到对方的限制。


    对于急诊科的人工智能诊断，我们可以想象潜在的阻力来源。医生从更多的检查中获得一些私人利益，如可以减少医疗事故风险或者可能是额外的收入。如果人工智能的预测比医生更准确，那么医生的培训和经验就变得不那么重要了，相对于构建人工智能的人来说，他们的价值降低了。管理者可能会担心实施的成本。在应用解决方案中，医生被排除在决策之外，他们的培训和经验可能变得无关紧要。已经做出许多决策的医生可能怀疑人工智能能否比他们做得更好。


    人工智能的潜力可能更大，但这需要一些系统变革。在大多数医院的急诊科中，当患者去看病时，医生会决定是让患者回家、进行压力测试还是进行心导管检查。在医生做出这些决策之前，行政管理部门会决定能够提供哪些测试。目前，激励机制似乎是一致的。穆来纳森和奥'
  - '[PAGE 268]


    伯迈尔估计，在被医生要求进行测试的患者中，15% 的患者实际上心脏病正在发作。在这个准确率下，医生和行政管理人员似乎都同意先进行压力测试是最好的选择。⁴


    一个逐步改进这种预测的人工智能将改善患者的治疗效果，而激励机制却几乎没有变化。在 20% 的准确率下，无论是实施人工智能点解决方案还是应用解决方案，医生和管理人员都可能希望首先让患者接受压力测试。由于这种改进过于渐进式，医生和管理人员可能认为不值得采用。


    如果能够构建一个近乎完美的人工智能，那么就有机会改善患者护理并重新设计系统。如果人工智能预测患者心脏病发作的准确率达 99%，那么医生和行政管理人员都会认识到最好直接进行导管，跳过压力测试。一旦人工智能对所有患者的预测都足够准确，每个人都会认为压力测试是不必要的。行政管理部门将停止提供压力测试，医生也不再想要使用它。


    在目前的准确率和近乎完美的人工智能之间存在一个中间区间，医生和行政管理人员的激励机制可能会发生变化和冲突。行政管理人员可能认为进行不必要的压力测试的成本更高，这可能是因为行政管理人员不想花费资源，或者是因为他们对责任风险的担忧较小。在这种情况下，若准确率为
    50%，医生可能仍然希望进行压力测试，而行政管理人员则希望将患者送去做导管。


    解决方案在上述情况下似乎很简单。它提出了一个相对简单的系统变革，即行政管理部门取代医生做出决策。行政管理部门将拒绝提供压力测试，然后，医生只能选择将患者直接送去做导管或让患者回家。在这种情况下，患者会直接进行导管手术，行政管理部门得到了它们想要的结果，医生可能会抱怨，但也只能接受他们所面临的局面。'
  - '[PAGE 269]


    然而，我们认为这种情况不太可能发生。医生会反对，甚至可能会联络监管机构，讨论患者的权益。当决策者不再保持一致时，现有系统中的决策分配方式就可能不再被接受。这种决策分配方式的变化可能意味着人工智能工具永远无法被采用。鉴于人工智能会随着反馈数据的增加而不断进步，中期的不一致可能会阻碍长期的、非常有益的人工智能的实现。


    要解决这个问题，医生和行政管理人员需要共同建立一个新的决策结构，这意味着需要比跳过检测决策更大的系统变革。对于像我们所描述的预测心脏病发作的人工智能工具来说，这种更大的系统变革可能并不值得。


    另外，一旦意识到系统变革的可能性，就有机会利用人工智能系统探索画布来重新构想急诊医学的模样。


    # 细究急诊医学


    建立画布必然是一种推测性的练习。它涉及对一个复杂的行业进行最基本的描述。正如我们在前一章中介绍的那样，它从使命开始。急诊科的使命可能是“通过高质量、有成本效益的医疗服务，改善急性病患者和受伤患者的治疗效果”。5


    为了提供这样的医疗服务，行政管理人员和医生做出了成千上万的决策。画布的作用就是将这些决策总结为它们的基本类别。对于急诊医学而言，一种方式是将其划分为两个核心决策（见表
    18-1）。一个是治疗决策，即医疗专业人员决定为患者提供何种医疗服务；另一个是资源配置决策，即行政管理部门决定在科室提供何种设备和人员配备的数量。治疗取决于诊断和对医学证据（支持某一诊断的不同治疗方式）的理解。正如我们讨论过的，诊断是一个预测问题。资源配'
  - '[PAGE 270]


    置也取决于诊断，但不是针对每个患者的，而是取决于对诊断结果在一段时间内分布情况的预测。


    让我们将这一推测推向极致，让人工智能诊断在各种环境中都能发挥作用。我们在第八章中介绍的心脏病专家埃里克·托普认为，更好的人工智能预测将开启医学的黄金时代。在这个时代，医生可以专注于医疗保健中的人性方面，将机械过程交给机器。“心脏病发作的预测只是一个例子，表明人工智能在诊断方面开始胜过医生。”


    # 表 18-1 人工智能系统探索画布：急诊科


    尽可能将业务简化到最少量的决策，看看是哪些？


    | 1. 使命 | 通过高质量、有成本效益的医疗服务，改善急性病患者和受伤患者的治疗效果 | |

    |---|---|---|

    | 2. 决策 | 治疗：决定采用哪种治疗方法 | 资源配置：决定设备类型和人员配备的数量 |

    | 3. 预测 | 诊断：预测患者症状的原因 | 患者的数量和类型：预测患者的数量和诊断的分布情况 |

    | 4. 判断 | 对患者进行过度治疗、治疗不足和错误治疗的后果分别是什么 | 相较于拥有太多设备和人员，手上的设备和人员太少会有什么后果 |


    随着第一决策的预测变得更好、更快，越来越多的患者开始接受适当的治疗。凭借足够多的数据，这些预测将完全从医院诊室转移到患者的家中。因此，在联系救护车之前，提供诊断的高质量预测是可行的。


    这种诊断可能导致各种系统层面的变化。患者可能会完全跳过急诊科，直接被送往相关的医疗科室，如心内科或骨科。许多患者在被诊断出需要药剂师或初级保健医师治疗的疾病后，可能根本不需要去医院。基于相关专业知识和系统闲置情况，护理人员可以将患者送往'
  - '[PAGE 271]


    不同的医院。


    护理人员的角色也可能发生变化，他们可以接受特定医疗条件的专业化培训。因此，当患者出现需要心脏病学专业知识的紧急情况时，可以派遣受过适当培训的护理人员和装有专业心脏病治疗设备的救护车。患者无须到达医院即可接受治疗。在许多紧急情况下，每一分钟都很重要。


    我们知道你在想什么，但那是不可能的。即使预测足够准确，护理人员也不可能如此专业。他们需要成为综合型医生，因为他们需要应对各种情况。如果我们需要的是专家，每个救护站需要的辅助医务人员就会远远超过我们所能培训和负担的人数。


    这就是第二个决策：资源配置。如果对需求分布的预测足够准确（且人口密度足够高），就有可能在正确的时间和地点提供必要的设备和训练有素的人员。为患者做出诊断的人工智能预测就成为一种补充，来帮助预测随时间变化的需求分布情况。


    在极限情况下，这种急诊医学会让大多数患者在家接受治疗，使用受过专业技能培训的护理人员带来的专门设备。那些被送往医院的患者是那些需要长时间住院或需要大量医护人员团队治疗的患者。患者的治疗结果更好，医院变得更小，医学培训和人员发生变化。通过高质量、有成本效益的医疗服务，改善治疗效果的使命可能会以惊人的方式实现。


    这并不是即将发生的事情。它甚至不会出现。人工智能的水平还不够高，且可能永远也不会达到那么高的水平，因为改造系统的成本是巨大的，尽管从长远来看也可能会节省开支。医疗专业人员和管理者对这种剧变的抵制也将是非常大的。然而，它可能在较小的范围内发生。许多城市辖区已经在派遣医生与护理人员一同工作。预测机器可以帮助确定何时需要医生。一个创业组织迈向新系统的第一步，便'
  - '[PAGE 272]


    是将人工智能整合到调度中，以确定需要哪位医生（以及哪些设备）。


    # 系统选择


    我们若声称系统变革很复杂，然后提供一个高度简化的观点，即由哪些选择定义了一个系统，以及它们的变化是如何随着新技术的采用而产生的，那么我们显然有些不诚实。然而，有时候为了阐明复杂性，过度简化是有价值的。这种想法是将混乱剥离，找到其本质的关键部分。这就是人工智能系统探索画布所做的事，也是我们在急诊医学中的人工智能思维实验所取得的成果。


    由两类广泛的选择定义了我们所谓的“系统”。第一类是谁看见什么，第二类是谁决定什么。这为理解我们所描述的系统变革提供了另一个框架。对于谁看见什么，一个组织的任务就是筛选信息。大量的信息可以被引入组织，但关键任务是引入与当前决策相关的信息。因此，一个组织着手将观察和处理信息的职责分配给特定领域，如行政管理部门和医疗部门。在某些情况下，各部门收集信息并将其保留在本部门内。而在其他情况下，各部门对信息进行筛选和交流，并传递给其他部门。当患者到达急诊科时，医疗部门能看到每位患者的预测诊断结果，而行政管理部门只在事后看到分布情况。关键是，有一些信息根本没有被引入组织，而在整个组织中使用的信息就更少了。


    对于谁决定什么，决策权的分配是由以下因素共同决定的：谁能最好地利用信息、谁拥有信息，以及谁有动机做出与组织利益一致的决策。原则上，如果存在超级个体，一个人可以做出所有决策，但并不存在这样的个体。因此，在分配决策权时，组织会在各个方面做出权衡。


    各部门利用专业化的优势，尽量减少彼此间的协调需求，使每个'
  - '[PAGE 273]


    人都能顺利完成自己的工作，但这也意味着没有人可以洞察全局。良好的组织设计确保各部门能够意识到某种情况超出了它们的职责范围，并将其转交给其他人处理。但没有一种完美的方法能做到这一点。因此，组织将决策和信息分配给运作良好的部门。组织规模越大，就越有必要或越有可能进行这种调整。较小的组织有较少的部门，但这也限制了它们的规模。10


    由部门职责界定的现有系统很擅长采用新技术，但这些新技术的好处只限于一个部门内。在这些情况下，就需要采纳人工智能点解决方案和人工智能应用解决方案。医院行政管理部门已经采用人工智能来安排维护人员和筛选简历，这两者都与资源配置明确相关。这些技术服务于各部门的使命，并不需要改变谁决定什么，这可能导致内部的抵制，因为责任的改变通常伴随着权力的变化。


    相比之下，如果新技术的收益分布在各部门，或者更糟糕的是，一个部门付出了成本，而另一个部门却获得了收益，那么采用新技术就难上加难了。即使能够发现这些机会，实现协调也需要重新分配决策权。这正是采纳急诊科诊断人工智能所面临的挑战。因此，需要面对并重新调整经过仔细协商的、强有力的权衡方式。说得温和一点，这种变化可以是颠覆性的，因此从头开始可能更容易实现。11


    在人工智能预测方面，新的创新形式多种多样。许多是点解决方案或应用解决方案，各部门可以在不引起冲突或协调困难的情况下采用。而对于其他情况，这就不可能了，因为它们的采用涉及颠覆和变革。这里的问题是，企业领导人如何判断他们是否错过了后一种机会，而这恰恰是因为他们的组织在设计上看不到这些机会，更不用说在机会出现时对其潜力进行有利的评估了。


    鉴于此，为了对你的组织能否采用当前或潜在的人工智能创新来进行思想实验，我们提供了一个两步程序。'
  - '[PAGE 274]


    第一步：确定预测提供的信息或解决的不确定性，以及它将改进的决策。


    第二步：这些信息或决策是仅限于一个部门，还是涉及多个部门？


    现在让我们回到急诊科中的人工智能应用，具体来说，是预测患者是否患有心脏病的人工智能。在第一步中，人工智能预测了一个诊断。人工智能被设置为只有在病人进入急诊室时，医院系统才能使用提供给医生的信息。这个诊断所影响的主要决策是提供哪些检查和治疗。对于第二步，很明显，这些信息或决策都牢牢掌握在医疗部门医生的手中。对于是否采用这类算法来协助分诊问题，似乎是一个很容易的选择，更有可能作为一个点解决方案被采用。


    然后，我们探讨了急诊科是否应该提供压力测试的问题。这在第一步中增加了一个新的决策：应提供哪些资源。从第二步来看，这不再局限于一个科室，正如前面所提到的，系统层面的挑战可能会阻止采用。此外，还有一些改进人工智能的方法需要协调各部门的信息。在患者到达医院之前进行人工智能诊断，可能需要在诊断前获取数周甚至数年的患者数据，这需要行政管理部门批准在医院范围之外进行数据收集。规章制度需要进行调整，患者需要被说服，这就是潜在的冲突。当前的医院组织结构无法轻易采用人工智能预测技术，以及适应运营所带来的变化，这需要一个新的系统。


    # 系统难以预测


    1880 年，人们已经认识到电力的巨大潜力可以改进工厂的运作方式，但还需要 40 年的时间才能理解如何设计一个能充分利用电力'
  - '[PAGE 275]


    的工厂系统。据我们所知，没人能设想到由电力构建的最终系统，因为探索过程需要时间，人们对电力的理解在逐渐加深。


    对于人工智能而言，我们更接近 1880 年，而不是 1920 年。人工智能很可能会在许多行业引领全新的系统。我们相信，这正是因为人工智能预测在决策中的作用，以及当它生成新的决策时，所采取的行动和这些决策所带来的结果反映了（而不是隔离或隐藏了）潜在的不确定性。因为决策通常与其他决策相互作用，所以可能会产生系统范围的影响。事实上，如果没有预测，现有的做事方式可能是可靠的，即使它们在技术上是一种浪费，这告诉我们，在没有系统创新的情况下，采用人工智能将受到限制。


    在最后几章，我们提供了指导和方法，以帮助理解人工智能可能进入的系统。保险和医疗保健是可能发生变革的行业类型。当前，我们正处于“中间时代”的早期。即使你使用这些方法来理解一个系统可能如何改变，你还需要许多步骤才能确定这种变化是否值得，以及需要哪些人工智能预测的改进才能使重组变得有价值。即使是在这种情况下，系统革新也需要颠覆，这意味着权力的分配将发生变化，会有赢家和输家。推动变革的人和抵制变革的人之间的平衡将决定变革是否发生，以及以何种速度发生。


    因此，我们强调一个重要的事情：技术的发展史告诉我们很多信息——关于通用技术（如人工智能）是否会带来颠覆并需要时间来发展。对于人工智能所做的事情（预测），以及它进入系统的方式（增强决策），我们做了明确且客观的分析，从而得到一个指南来引导方向，而不是只给出一张显示目的地的地图。最终，即使是在研究预测机器时，古老的格言仍然适用：“预测很难，尤其是对未来的预测。”'
