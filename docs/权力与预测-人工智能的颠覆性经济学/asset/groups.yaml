    但在许多情况下，产品仍然卖不出去。即使改变了动力来源，能源账单可节省的幅度也是有限的，而且点解决方案没有给出使用更多电力的理由。


    ## 应用解决方案企业家


    蒸汽机一旦启动就会一直运行，而电动机可以在关闭后重新启动。因此，尽管蒸汽动力是通过轴传递的，各机器操作员可以通过操作杠杆连接或脱离机器来控制动力，但是电动机操作员可以轻松地开关与各机器直接连接的电动引擎。后者更简单，需要的维护工作也少得多。³
    然而，这意味着工厂消耗的电力会因使用情况而异。正如经济历史学家内森·罗森伯格所言，这带来了一个“分散化电力”的时代，“现在能以非常小且成本较低的单位提供电力，且无须产生过量电力以提供小‘剂量’或间歇性的电力”。⁴


    对于电力价值，企业家认为要少量用电，或者更准确地说，只在需要时用电。尽管这种见解改变了一些工厂的设计，如为不同类型的机器设置独立电源，不过有一些工程师打算给每台机器都配备电动发动机。但即使对于一组机器，只在使用机器时支付电费也非常划算。


    重大的变革是将电力驱动安装在单台机器上，我们称之为应用解决方案，即不再简单地更换电源，而是换掉整个设备（应用设备）。而且，一些机器变得易于携带。这些工具不再被固定于一根中央轴上，而是可以四处移动。工作不再被机器牵着转，而是机器可以跟着工作走。


    不过这只是一种预期。现实情况是，任何单独的机床，如钻头、金属切割机或压力机，都必须进行全面重新设计，以利用独立的电动引擎。⁵ 此外，这些引擎通常不是现成的，而是需要根据特定机器或用途量身定做的。由于设备需要被重新设计，因此应用解决方案的机会虽然多，但很难真正得到应用。如果你为工厂设计一个带有独立引擎的工具，那么就会降低发动机为其他工具提供动力的价值。然而，找到平衡需要重新设计许多工具，这意味着需要花费大量时间创建一个新的系统。


    ## 系统解决方案企业家


    纵观整个工业革命，工厂都是为了利用蒸汽而设计的。正如我们所见，工厂的单一动力源通过挂着一根皮带和滑轮的中央轴将动力分配到各台机器上。对于现代人来说，这就是一台大型机器，里面的人只是其中的齿轮而已。从宏观上看，它是一个机械装置，其中数百个运动部件与单个动力入口相连，这一点并没有因为新动力的出现而发生改变。有了新设备，一些企业家就开始重新思考工厂的形式。设想一下，那里没有中央轴，甚至没有专门为一组机器设计的轴。如果让你根据现在对电力的了解从零开始设计工厂，它会是什么样子呢？


    工厂是为了让机器靠近动力源而建造的，这意味着纵向设计的多层车间有其优势。19世纪末，狭窄多层的工厂在工作条件、安全性和机器性能方面都付出了一定的代价。在有了电力后，工厂就不再需要将所有东西都塞进狭小的空间内。


    更多的企业管理者意识到，电力的真正价值是提供一个系统解决方案，具体而言，是提供一个能够充分利用电力的系统。所谓系统，是指一套程序，它们共同确保某件事情得以完成。


    让我们思考一下工厂内部的空间经济学。在有了蒸汽与中央轴后，靠近中央轴的空间比其他地方更有价值。因此，工作都在靠近轴的地方进行，其他东西不是被储存起来就是被移走了。这意味着实物必须根据动力需求来回移动。


    电力拉平了空间的经济价值，使其变得灵活。如今，在生产线上组织生产比较划算，这样可以缩短实物来回移动的距离，并将其从一个工序转移到下一个。亨利·福特没能利用蒸汽动力发明出
    T 型车的生产线，直到电力商业前景展现出来的几十年后，这一目标才得以实现。福特是一位汽车企业家，但他本质上也是一位系统解决方案企业家。这些系统变革改变了工业格局，直到这时，电气化才在生产力统计数据中大幅度地显现出来。⁶


    ## 人工智能企业家


    我们可以得出三条结论。第一，实现巨大生产力的关键在于理解新技术的内涵。一个企业家如果在 1890 年向人们推销电力，可能会把“降低燃料成本”作为该技术的关键价值主张。但电力不是一种更便宜的蒸汽机，它的真正价值在于能够将能源使用与能源来源分离，这样用户就摆脱了距离的限制，工厂和工作流程设计也迎来了一系列的改进。一个企业家如果在
    1920 年向人们推销电力，就会发现电力的关键价值主张并不是“降低燃料成本”，而是“能极大地提高生产力的工厂设计”。


    这也是我们对人工智能的期待。最初的创业机会包括 Verafin 等点解决方案，它们通过更好、更快、更便宜的方式取代了其他预测方法。


    还有一些应用解决方案，需要围绕人工智能重新设计设备或产品。所有由人工智能驱动的机器人都是应用程序，设备上的人工智能增强软件也是如此。请看一下你的手机，它可以识别面部，这需要特殊的相机以及专门的硬件来保证信息安全。不过这种创新最大的推动力可能是将数十亿美元的投资，用于设计和生产在现有道路条件下自动驾驶的车辆。尽管这些汽车的外观可能没什么变化，但必须重新设计其内部硬件，以保证传感器配置正确、车载处理及机器操作一切正常。


    大量高价值的潜在人工智能系统解决方案尚未出现。本书将阐述实现这些机会的可能性以及所面临的挑战。


    第二，一旦我们理解了这一点，就要问一个直截了当但难以回答的问题。鉴于我们现在对人工智能的了解，如果从头开始，那么将如何设计产品、服务或工厂呢？新的扁平化工厂架构最初并没有在传统行业中出现，而是出现在
    20 世纪的新兴行业中，如烟草、金属加工、运输设备和电气机械等。同样的情况重现在当今的新兴数字化行业中，如搜索、电子商务、流媒体和社交网络，它们早期采用了以人工智能为核心的系统设计。


    提到人工智能，我们仍然要回答这两个问题：（1）人工智能真正带给我们的是什么？（2）如果我们从头开始设计业务，那么将如何建立业务流程和商业模式？如果电力不是为了“降低燃料成本”，而是一个“能极大地提高生产力的工厂设计”，那么人工智能可能也不是为了“降低预测成本”，而是一个“能极大地提高生产力的产品、服务和组织设计”。电力的主要好处在于它将能源使用与其来源“脱钩”，从而促进了工厂设计的创新；人工智能的主要好处在于它将预测与决策的其他方面“脱钩”，从而通过重新构想决策之间的相互关系，促进了组织设计的创新。


    我们认为，通过将预测与决策的其他方面“脱钩”，并将预测从人类转移到机器，人工智能实现了系统级创新。决策是这种系统的关键构件，而人工智能增强了决策能力。


    第三，不同类型的解决方案提供了不同的获取市场权力的机会。


    当企业家既能创造价值又能获取价值时，他们就能盈利。点解决方案的问题通常是最初创造的价值相对较少。电力曾是蒸汽的替代品，但蒸汽已经配套了现成的基础设施，因此替代并不是零成本的，并且这样做对消费者来说，价值就是降低电费。换句话说，点解决方案企业家可以通过最佳点解决方案获得持续的利润——Verafin
    正是如此——但这只是最好的情况。7


    随着我们转向应用解决方案，然后转向系统解决方案，企业家创造的价值变得更有说服力。新设备可以从竞争中脱颖而出，并受到专利等知识产权措施的保护。然而，新系统的潜力更大。在电力领域，工厂主提供新的工厂设计，这是在他们自己的领域里，他们懂得技巧，因此能够获得市场份额，并使自己免受竞争的影响。虽然工厂的布局是显而易见的，但新系统背后的流程、能力和培训可能就不那么明显了，而且难以复制。更重要的是，新系统可以实现规模化。


    ## 人工智能的颠覆与权力


    电力系统花了几十年的时间才实现了所谓的“颠覆”。在最初的 20 年里，它只是一些工厂和应用中的点解决方案，或者被用来照明。但当新系统被开发出来后，它改变了经济。这一变化是深远的，它将权力转移到了控制电力发电、电网以及能在大规模生产中使用电力的人身上。在那之后，人们不再想成为皮带和滑轮的制造商，也不再想成为市中心工厂房地产的持有者。


    我们可以看到人工智能也在经历类似的过程。经济权力的真正转移，是将稀缺资源和资产的控制权从一群人手中转移到另一群人手中，这群人同时就有能力保护企业免受竞争压力。可以肯定的是，利用人工智能有机会做到这一点，但那些会造成颠覆的机会——重塑行业和权力分配的机会——来自新系统。新系统很难被开发，正如我们将要探讨的，它们通常很复杂，很难被复制，这为那些能够在系统创新上有所突破的人创造了机会。


    但是仍然存在许多的不确定性。对人工智能而言，谁会从这些新技术中积累权力，是一个悬而未决的问题，这将取决于这些新系统的具体形态。我们的任务是为你指引方向，预测在人工智能系统的发展和采用过程中，谁可能获得权力，谁又可能失去权力。


    ## 本章要点


    - 三位企业家的寓言故事发生在 100 多年前，其焦点是能源市场，说明了不同企业家如何抓住同一技术转变（从蒸汽到电力）来开发不同的价值主张：点解决方案（降低动力成本和摩擦导致的能量损失——没有改变工厂的系统设计）；应用解决方案（在每台机器上安装独立的电动发动机——机器是模块化的，因此一台机器的停工不会影响其他机器——没有改变工厂的系统设计）；系统解决方案（重新设计工厂——轻量化结构，单层，在空间布局、工人与材料流动方面优化了工作流程）。


    - 一些价值主张更具吸引力。在电力方面，点解决方案和应用解决方案的前提是在不改变系统设计的情况下直接用电力取代蒸汽，但产生的价值有限，而最初行业采用电力速度的缓慢就体现了这一点。随着时间的推移，一些企业家发现了提供系统解决方案的机会，他们利用电力将机器与电源“脱钩”，这对于蒸汽是不可能的，或者成本太高。在许多情况下，系统解决方案的价值远超点解决方案的价值。


    - 正如电力使机器与电源“脱钩”，从而促进价值主张从“降低燃料成本”转移到“能极大地提高生产力的工厂设计”一样，人工智能将预测与决策的其他方面“脱钩”，从而促进价值主张从“降低预测成本”转移到“能极大地提高生产力的产品、服务和组织设计”。


    ## 第二章


    ### 人工智能的系统未来


    2017 年，各类人工智能会议层出不穷。这股洪流吸引了商界人士和政府官员齐聚一堂，同时激发了学术界的热情。我们意识到人工智能有改变经济的潜力，希望吸引世界上最优秀的经济学研究人员来思考人工智能。我们在多伦多组织了一次人工智能会议，为经济学家制定了研究议程。¹


    令我们吃惊的是，这次会议吸引了一大批与会者。斯坦福大学的保罗·米尔格罗姆后来因在经济学和计算机科学领域的创新而获得诺贝尔经济学奖，他回忆起 1990 年收到的一份类似邀请，主题是互联网经济学，当时他拒绝了，现在感到后悔不已。他说：“我清楚地记得，1990
    年，美国国家科学基金会问我是否有兴趣研究互联网经济学，当时我正忙于研究委托-代理理论、公司经济学和超模研究，所以我拒绝了。但这次我没有任何借口。我一定会到场的。”
    ²


    一些与会者对人工智能的影响持乐观态度。另一位诺贝尔经济学奖得主丹尼尔·卡尼曼说：“我认为，没有什么事情是我们能做，而计算机无法通过编程完成的。”³ 曾在奥巴马总统经济顾问委员会任职的贝齐·史蒂文森总结了这种乐观情绪，她指出：“经济学家认为人工智能代表着实现可观经济收益的机会。”
    4


    其他人则持比较怀疑的态度。诺贝尔经济学奖得主约瑟夫·斯蒂格利茨就是其中一位担心人工智能会加剧不平等的人；经济学家《纽约时报》前专栏作家泰勒·考恩认为人工智能的生产力会导致资源的稀缺；曾在以色列政坛工作的曼努埃尔·特拉伊滕贝格指出，如果一场变革发生，那么一项技术的长期利益就无关紧要了，这预示着人们对机器自动化的抵触情绪会不断增加，以及大众认为机器自动化会对就业产生影响。


    一个特别有趣的担忧是，人工智能似乎对经济没产生什么影响。正如经济学家埃里克·布莱恩约夫森、丹尼尔·洛克和查德·西弗森所说的：


    我们生活在一个矛盾的时代。使用人工智能的系统在越来越多的领域中与人类的水平相匹敌，甚至超越我们，并借助其他技术的快速进步推动了股票价格飙升。然而，在过去十年中，数据显示生产力下降了一半，且大多数美国人的实际收入自
    20 世纪90年代末以来一直停滞不前。 5


    对那些研究技术史的人来说（正如我们在电力方面所看到的），这种矛盾并非前所未有。1987 年，麻省理工学院的罗伯特·索洛有句名言：“各个地方都迎来了计算机时代，唯独生产力统计数据中没有。”计算机无处不在，但生产力却没有明显提高。这种模式很常见，于是经济学家开始关注“通用技术”出现时会发生什么情况，这些技术能够在诸多领域持续地提高生产力。
    6 通用技术包括蒸汽机和电力，以及近些年的半导体和互联网。对我们的与会者来说，人工智能也可以被算作通用技术，而且是个不错的候选者。我们应该对此有何期望呢？从历史上看，这些技术最终改变了经济、企业的发展和工作方式，但在出现所有改变的几十年中，发生了什么呢？在这个“中间时代”又发生了什么呢？


    ## 人工智能创新系统


    谷歌首席执行官桑达尔·皮查伊表示：“人工智能可能是人类有史以来最重要的事情。我认为它的影响比电力更深远。”7 谷歌已经从人工智能中获益颇丰，但其他许多公司还没有。麻省理工学院《斯隆管理评论》和全球咨询公司
    BCG 在 2020 年的一项研究中发现，仅有 11% 的组织表示从人工智能中获得了显著的经济效益。8 这种结果并不是因为其他组织没有尝试，59% 的组织表示有人工智能战略，57%
    的组织表示已经部署或试点了人工智能解决方案。


    人工智能先驱吴恩达创立了谷歌大脑项目，并担任百度的首席科学家。他宣称：“人工智能是新的电力。它有潜力改变每个行业并创造巨大的经济价值。”9 我们认同他的观点。人工智能具有改变世界的潜力，就像电力一样，但根据历史经验，这种变革将是一个漫长而曲折的过程。


    电力的例子表明，对人工智能的未来保持乐观态度和对迄今为止的结果感到失望，并非固有的矛盾。布莱恩约夫森、洛克和西弗森强调了这个时代的悖论。我们应该乐观地期盼未来，同时也应该承受对当下处境的失望。事实上，在经济经历与变革性技术相关的结构调整时，我们有很好的理论性原因支持这两种情绪同时存在。


    在电力的第一波浪潮中，灯泡取代了蜡烛，电动机取代了蒸汽机。这些都是点解决方案，无须进行结构调整。经济没有发生转型。人工智能正面临相同的情况。它被用作预测分析的新工具。像
    Verafin 等少数公司正在从增强版预测中受益，这是已经获得经济效益的那 11% 的公司。10 它们早就进行预测，而人工智能让它们的预测更好、更快、更便宜。对于人工智能来说，最容易实现的目标是点解决方案，而这些目标正在逐渐达成。


    就像只有在人们理解和利用分布式发电的巨大好处后，电力的真正潜能才被释放出来一样，人工智能也只有在其提供预测的好处被充分利用时，才能真正发挥其潜能。这明确指出了预测在改善决策过程中所起的作用。我们将证明，在许多情况下，预测将改变决策的方式，以至于整个组织的决策系统和流程都需要进行调整。只有到那时，人工智能才能真正被大规模地采用。


    我们正处于“中间时代”——在人工智能的显在潜能得到证明后，但在其变革性影响出现前的时代。Verafin 就像那些已经成功部署人工智能的 11% 的大型企业，因为它们的预测能够与现有系统相契合，系统操作和工作流程已经为利用这些预测做好了准备，而无须进行重大调整。


    对于剩余 89% 的公司来说，它们的系统尚未做好准备。前景虽然是明朗的，但实现这一前景的路径还未明确。我们需要找到一种能够利用机器预测来更好地完成任务的方法，即利用预测来做出更好的决策。


    人工智能将影响人类能做的所有事情，因为它们能够做出更好的决策。这不仅包括收集数据、构建模型和生成预测等技术挑战，还包括组织挑战，即在正确的时间让正确的人做出正确的决策。而且，它涉及战略挑战，即在获得更多的信息后，确定该如何以不同的方式去完成。


    ## 设置舞台


    “中间时代”的特点是人们对点解决方案充满热情，并取得了成功，但人工智能似乎仍然是一项小众技术。不过，当前在应用解决方案方面人们有了一些发展和尝试。由于其特性，这些解决方案通常非常具体，它们改善了现有产品，如手机或汽车安全功能。


    美国人口普查局询问了30多万家企业关于其使用人工智能的情况。已经采用人工智能的大型企业普遍强调利用人工智能来推动自动化和改进现有流程。换句话说，它们的人工智能是点解决方案和应用解决方案，因此系统并没有发生变化。这些人工智能对企业生产力的影响不大。1
    观察现有工作流程，找出人工智能可以替代人类的地方，能带来重大益处，不过这是渐进式的，并不能带来巨大的机遇。


    在“中间时代”，企业家和企业管理者努力使应用具有经济可行性。正如内森·罗森伯格所言，对于所有技术来说，“无数创业的失败可以归因于这样一个事实，即创业者没有考虑到他所关注的部分与系统其他部分之间相互依存的条件”。2


    只有在创新者将注意力转向创造新的系统解决方案时，真正的变革才会发生。这些系统解决方案将人工智能引入经济范畴，并且它们会刺激应用解决方案的发展。这种潜能的扩展和后续创新将使人工智能系统具有经济效益。


    鉴于这些解决方案的重要性，我们有必要全面解释一下其内涵。下面让我们定义一下三个方案的概念：


    - 点解决方案改进既有程序，可以独立采用，无须改变其嵌入的系统。


    - 应用解决方案可开启新程序，可以独立采用，无须改变其所嵌入的系统。


    - 系统解决方案通过改变相关程序，改进既有程序或者开启新程序。


    这些定义中的重点在于“独立”这一术语，它出现在点解决方案和应用解决方案的定义中，但在系统解决方案的定义中并没有出现。想象一下，我们有一个既有的或新的程序，通过采用新技术可以使其价值更高。如果增加的价值大于开发和采用该解决方案的成本，那么该解决方案在经济上就是可行的。而且，无论其他方面是否发生改变，它在经济上都是可行的。然而，如果新技术带来的收益太低，只有通过改变其他方面才能改善，那么在没有这些改变的情况下，独立采用在经济上是不可能的，一旦采用新技术，就需要同时改变多个流程。


    因此，我们看到一些工厂很容易将电力作为点解决方案，用电力替代蒸汽。而且，一些应用程序也可以与电力发动机集成，并在既有的生产系统中使用。但在许多情况下，工厂需要重新设计，只有提供整个集中式电力系统和电网，才能让解决方案具有经济可行性。换句话说，系统解决方案将电力从既有能源的替代品转变为使用新能源的机会。


    在第三章中，我们将重新审视《AI 极简经济学》中的一个主题，即现代人工智能的进步本质上是预测技术的改进。此外，预测只有为决策服务才具有价值。因此，为了阐释本书所表达的主题，我们修改了之前的定义：


    - 人工智能点解决方案：如果一项预测能够改善既有决策，并且该决策可以独立完成，那么该预测作为点解决方案就是有价值的。


    - 人工智能应用解决方案：如果一项预测能够促成新决策或改变决策的方式，并且该决策可以独立完成，那么该预测作为应用解决方案就是有价值的。


    - 人工智能系统解决方案：如果一项预测能够改善既有决策或促成新决策，那么该预测作为系统解决方案就是有价值的，但前提是其他决策方式发生了改变。


    对于其他技术，虽然我们可以做“事后诸葛亮”，准确判断什么是独立的、什么是相互依赖的，但对于人工智能，我们仍须弄清楚系统的各个方面。本书就能帮助我们厘清这些问题。


    ## 系统变革是颠覆性的


    根据历史经验，人工智能采用规模的巨大增长将来自系统变革，而这种变革也会是颠覆性的。所谓颠覆性，是指它将改变许多人和企业在行业内的角色，同时伴随着这些变化，引发权力的转移。也就是说，如果系统变革发生得相对迅速，则很可能会产生经济上的赢家和输家。


    我们可以通过农业中的预测来感受这种颠覆性。农业是一个因机械化而大幅减少就业人数的行业，但是农场管理权仍然掌握在农民手中。尽管农场规模庞大，但决策权仍在农民手中，许多农场仍然归农民所有。农民利用天气预报来做决策，但一般而言，农民在预测和决策方面的技能与他们自身土地的特点紧密相关。


    然而，情况正在发生变化。农民容易受天气条件的影响，但关键是，他们所受影响会因农作物和当地的土地条件而不同。这种风险是大卫·弗里德伯格（他是第一个通过互联网提供天气预报的人）在试图向美国农民销售保险时意识到的。除了天气数据，美国政府还拥有

