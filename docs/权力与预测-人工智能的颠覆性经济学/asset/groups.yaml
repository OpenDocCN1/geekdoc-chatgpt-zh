    ## 价值与成本


    作为经济学家，我们与其他经济学家一样，往往关注成本。我们的第一本书《AI 极简经济学》的整个前提是，人工智能的进步将大幅降低预测的成本，从而导致其使用规模的扩大。然而，尽管该书指出人工智能最开始将应用在已经存在预测的领域，如销量预测或天气预报，以及照片分类和语言领域等，但我们也意识到，只有当预测成本降到足够低时，新的应用和用途才会出现，那才是真正的机遇。


    与此同时，通过在创新颠覆实验室与人工智能初创企业的合作中，我们发现，创业者最初的推销方式完全是关于某个人工智能系统如何对企业产生价值，因为这将为企业节省雇用员工的成本。在为这些人工智能产品定价时，他们采用的是成本思维，计算出所节省的工资和其他成本，并在此基础上为替代他们的机器定价。


    通常情况下，这样的推销会非常艰难。如果你去找一家企业，并告诉它如果砍掉某个岗位，你的人工智能产品可以每年为它节省 5 万美元的劳动力成本，那么你的人工智能产品最好能把整个岗位砍得干干净净。然而，创业者发现，这些人工智能产品也许只能减少一个人工作中的一项任务，这对于他们的潜在客户而言，节省这点劳动力成本是远远不够的。


    更好的推销方式不是专注于替代，而是关注价值。这些推销方式展示了人工智能产品如何使企业获得更多利润，如通过向自己的客户提供更高质量的产品。这种方式的好处在于不必证明人工智能在执行特定任务时所需成本比人类成本更低。这也减小了采用人工智能的内部阻力，从而企业的销售任务也会变得更容易。这里的关键是，相较于以节省成本为重点的方法，使人工智能增值的方法更有可能让人工智能的使用获得真正的推广。⁶


    我们在以往的技术革命中也看到了同样的对立。正如在第一章中所讨论的电力，其在制造业中替代蒸汽的过程是缓慢的，花费了几十年的时间。只有当电力成本低于蒸汽成本时，现有的工厂才会考虑采用电力。对于那些已经设计成依靠蒸汽运行的工厂而言，这是个难题。然而，在制造商意识到电力将使它们有机会在大面积的平坦区域上重新设计工厂，从而摆脱城市中的高额租金后，它们对投资新工厂的兴趣就大大增加了，因为这样的设计非常有可能显著提高生产力。另外，电动汽车曾被认为是比燃油汽车更有前景的技术。不过事实证明，汽油使汽车跑得更远，因此燃油汽车取得了胜利，至少在21世纪初电池技术取得进展之前都是如此。电力在重新设计的工厂中提高了价值，但在交通等领域却没有。最终，价值获胜。


    这里的重点是，采用新系统需要替换既有系统。单纯的成本计算很少会推动这种替换。建立新系统会有过渡成本，如果你只能节省既有系统成本的一小部分，那么这种替换可能就不值得。新系统能做新的事情——也就是说，带来新的价值创造机会——这才是让采用新系统成为现实的动力。


    ## 系统变革的挑战


    关于人工智能在医学领域潜力的研究已经有很多了。⁷埃里克·托普尔的《深度医疗：智能时代的医疗革命》一书解释了人工智能是如何改善诊断的，使医生有更多时间与患者交流并了解他们的需求。医学中的人工智能应用包括疾病诊断、自动化手术、家庭患者监测、个性化治疗以及药物发现和再利用。⁸这让人们开始担忧“人工智能在医疗保健中的阴暗面”，即人工智能与医学博士互相竞争。”


    也许《深度医疗：智能时代的医疗革命》如此有影响力的原因是，托普了解医疗保健系统（他是一名心脏病学家和美国斯克利普斯研究所分子医学教授），以及人工智能（他在学习与医疗保健相关的技术和局限性方面投入了大量时间和精力），并且他十分擅长沟通，能将复杂事物用浅显的语言表达出来（他是斯克利普斯转化研究所的创始人和主任）。但问题的是，他不是经济学家。因此，他没有从激励的角度讨论人类行为，或者他认为医生技能高于这些原始本能。我们担心的是，如果我们只是把新的人工智能技术应用到现有的医疗保健系统中，那么医生可能会没有动力使用，因为这取决于新的人工智能技术是否会增加或降低他们的报酬，而报酬是由收费服务等决定的。


    托普认为，如果人工智能可以为医生节省时间，那么医生就会把节省出来的时间用于与患者的交谈和沟通上。然而，并没有清晰的证据表明，过去为医生提高工作效率的工具增加了医生与患者交流的时间。而且事实可能正好相反，如果人工智能提高了医生的工作效率，医生可能会在不降低收入的前提下减少为每位患者花费的时间。为了实现托普所期望的有价值目标，我们需要的不仅是新的人工智能技术，还需要一个新系统，包括新的激励机制、培训、方法和文化，让医生以托普书中所期望的方式使用他们的技术工具。


    因此，尽管《深度医疗：智能时代的医疗革命》和其他文献都描述了许多利用人工智能改善医学领域的机会，但医疗保健并没有走在采用人工智能的前列。在对各行业的人工智能和机器学习工作进行研究后，我们发现医疗保健排名垫底。截至
    2019 年底，与人工智能相关的医疗保健工作数量很少，仅比建筑业、艺术和娱乐业多一些。甚至住宿和餐饮业，交通运输业、仓储和邮政业都拥有更多具备人工智能相关技能的员工。¹¹
    其中一个原因可能是医疗保健系统过于复杂。图 8–2 展示了美国医疗保健系统，该系统属于美国国会于 2010 年制定的奥巴马医改法案。¹²


    ![](img/5d7d0b82a68fe65c345bd809e0cf66b2_121_0.png)


    ## 图 8–2 美国医疗保健系统（2010 年）


    资料来源：美国国会联合经济委员会，“看懂奥巴马医改法案图”，2010 年 7 月，https://www.jec.senate.gov/public/_cache/files/96b779aa-6d2e-4c41-a719-24e865cacf66/understanding-the-obamacare-chart.pdf。


    在众多的协调决策中，除非进行其他改变，否则点解决方案和应用解决方案的价值都是有限的。要想象人工智能怎样实现个性化治疗可能容易，但只有大量不同的人改变他们的工作方式才能实现这一目标（如收集更多的个人数据、提供个性化的护理、创建以护理为中心的报销方式）。医疗保健领域的人工智能点解决方案往往给人们提供无法利用的预测（如没有可用的治疗方案）。人工智能应用解决方案往往会促成无人能采取（如责任规则导致采用人工智能困难）或者不愿采取（如它们与报酬制度不匹配）的行动。困难不在于预测不够准确或者行动没有用处，而在于要让所有组成部分协同工作并非易事。


    要实现这一目标，需要进行系统变革。我们对于有人工智能支持的新医疗保健系统已经有无数的设想。13 如果由人工智能提供诊断，那么医疗保健中关于谁有权力进行何种操作的规则就应该改变。当机器进行诊断时，医生的主要职责可能就是提供人性化的医疗服务。这就需要其他各种变革。医学院将不再要求学生背诵医学案例，也不再根据学生对生物学的掌握程度来选拔学生，而通常学生需要依靠其能力在考试中取得好成绩。这些技能在十年的高等教育中可能不会有太大提高，因此面向患者的医生可能只需类似本科学位的学历即可。反过来，这将需要对谁有权提供哪些医疗保健服务进行重大的监管变革。也许病人护理会成为药剂师的主要职责，也许社会工会进入医生曾经的工作领域。在第十八章中，我们将提供一个能在医疗保健中开发人工智能系统解决方案的流程，并对在急诊医学中的人工智能系统提出设想。也许这一切都不会发生，因为需要变革的东西实在太多了。


    人工智能也可能改变全球卫生系统。世界银行已经指出人工智能等技术如何在不同国家之间实现公平竞争。14 远程患者监测和机器诊断的结合可以改善偏远地区的医疗保健水平。


    喀麦隆的心脏病专家都在市区的医院工作，而该国 2 500 万居民中的许多人都离这些医院很远。大多数患有心血管疾病的人从未被诊断出来。喀麦隆的发明家阿瑟·赞格开发了
    Cardiopad 来解决这个问题。Cardiopad 是一种远程心电图工具，利用它则不需要当地的心脏病专家进行检查。该工具已经为数千名患者提供了远程诊断，但仍需心脏病专家进行最终诊断。2020
    年，与 Cardiopad 合作的 20 名心脏病专家不堪重负，因为整个国家只有 60 名心脏病专家。Cardiopad 解决了心电图的获取问题，但未解决规模化诊断的问题，而这需要能够进行诊断的机器以及愿意接受诊断的人。此外，一旦成千上万的人被诊断出疾病，还需要基础设施来治疗这些患者。


    目前，诊断和治疗的数量是紧密相连的。通过限制诊断，现有系统在需要治疗的患者数量上几乎没有不确定性。Cardiopad 就是该系统的一个组成部分，解决了心脏病专家与患者之间的距离问题。在喀麦隆，若想大规模改善心血管疾病的治疗，就必须改变诊断的方式，并开发新的治疗路径，然后反过来利用改变进行诊断。这些系统解决方案仍需进一步开发。15
    在此之前，Cardiopad 将继续改善喀麦隆千万名患者的医疗保健，但无法提升全民的心血管健康水平。


    IBM 是一家比 Cardiopad 更大的公司，其沃森系统是该公司的一个突破性项目，将对医疗保健领域产生巨大的影响。最终却没有达到预期的效果，因为存在数据问题和预测错误的实际风险。正如
    IBM 的一位合作伙伴所说：“我们以为这会很容易，但事实证明确实太难了。”16 虽然确定哪些任务适合人工智能点解决方案或应用解决方案是很容易的，且 IBM
    已经弄清楚了这一点，但事实证明，将这些解决方案有效地嵌入现有系统非常困难，而且新系统尚未出现。


    ## 反过来看


    在“中间时代”的最初阶段，采用人工智能的机会通常是被动的。供应商会向你提供一种新的人工智能技术，用于预测与你的组织有关的事情；或者你已经要求内部团队对其工作流程进行分析，确认是否有机会使用人工智能来协助完成一项或多项任务。17
    这是一个不错的方法，但只适用于利用人工智能点解决方案。


    目前为止，我们希望已经说服你，寻找机会采用具有变革意义的人工智能是有价值的。你需要检查整个系统，并了解人工智能是如何促进系统向更好方向发展的，而人工智能最重要的机会就在这里。


    谈论系统思维容易，真正形成却很困难。隐藏的不确定性通常很难被找到，将现有系统黏合在一起的规则也很难被去除。第一步要做的是认识到系统变革是必要的，而这种认识已经在经济部门中出现，接下来我们将讨论这个问题。


    ## 本章要点


    - 目前，任务层面的思维是主导方法，即在经济各个部门中规划引入人工智能。其主要思路是确定一个职业中的具体任务，这些任务依赖预测，而预测是由人工智能（并非人类）以更准确、快捷、廉价的方式产生的。企业领导者、管理顾问和学者基本上都认同这种方法。

    - 任务层面思维的主导地位令人惊讶，因为迄今为止，人工智能最引人注目的应用并不是在任务层面替代人类劳动，而是新的系统层面的设计。因为人工智能具备了预测能力（如亚马逊、谷歌、奈飞、苹果等），所以新的系统层面的设计成为现实。任务层面的思维会导向点解决方案，其动机通常是基于劳动力替代的成本节约。相比之下，系统层面的思维会导向系统解决方案，其动机通常是创造价值，而非节约成本。

    - 人工智能在医疗保健领域有许多应用：疾病诊断、自动手术、家庭患者监测、个性化治疗、药物发现和再利用等。然而，目前为止，医疗保健系统从人工智能中获益甚微，部分原因是获得监管部门的审批需要大量时间，但更多原因是在现有医疗系统中使用人工智能点解决方案的好处不明显。要想充分发挥人工智能在医疗保健中的作用，就需要一个系统解决方案。我们必须从头开始，想象该如何在一个全新设计的系统中更好地为人们的健康服务，同时这个系统又能获得全新的、强大的预测技术。这意味着需要重新思考培训、交付程序、薪酬、隐私和责任。总而言之，这意味着要采用系统思维。


    ## 第九章


    ## 最伟大的系统


    《福布斯》杂志的一篇文章称：“AlphaFold 是人工智能领域有史以来最重要的成就。” 尽管该杂志往往夸大其词，但《自然》这样严肃的学术期刊也发表了类似的观点：“AlphaFold
    将改变一切。” 1


    AlphaFold 能够预测蛋白质的结构。蛋白质是生命的构建单元，负责细胞内进行的大部分活动，功能和作用取决于其三维结构。在分子生物学中，“结构即功能”。


    长期以来，科学家一直想知道蛋白质的结构从何而来，一个蛋白质的组成部分是如何从其最终形状的众多扭曲和褶皱中映射出来的。几十年来，实验一直是获取良好蛋白质结构的主要方法。


    有了 AlphaFold 这样一个基于氨基酸序列预测蛋白质结构的工具，科学家可以发现有关生命构建单元的全新事实。 2 加利福尼亚大学旧金山分校的研究人员使用
    AlphaFold 分析了一种名为 SARS-CoV-2 的关键蛋白质，发现了之前未知的细节，这推动了新冠病毒治疗方法的发展。科罗拉多大学博尔德分校的科学家花了多年时间试图确定一种特定细菌蛋白质的结构，以帮助对抗抗生素的耐药性，现在使用
    AlphaFold 在 15 分钟内掌握了该结构。 3 另一个实验室指出，在尝试其他工具 10 年后，AlphaFold 在 30 分钟内展示了一个蛋白质的结构。4
    该实验室的负责人安德烈·卢帕斯说道：“这将改变医学，改变研究，改变生物工程。”


    ## 创造一种发明方法


    如果我们必须指出人工智能最有可能改变经济的领域，那就是大多数普通商业活动的上游：创新与发明的系统。好消息是，在这里，人工智能的实践者似乎认识到系统思维对于人工智能的采用是必须的。如果
    AlphaFold 想要改变医学、研究和生物工程，就必须超越点解决方案。


    2017 年，我们主办了第一届 NBER（美国国家经济研究局）人工智能经济学会议。在会上，经济学家伊恩·科克伯恩、丽贝卡·亨德森和斯科特·斯特恩认为，人工智能“有可能改变创新过程本身”。数据科学已经是科学进程的一部分，而人工智能将使数据科学更好、更快、更便宜，并将实现新型预测。这将开辟新的研究途径，并提高实验室的生产力。5
    作为一种创造产品的新方式，而不仅是对特定产品的改进，研究工具的经济影响不仅在于它们能降低创新成本，6 还改变了创新的游戏规则。


    显微镜也是一种新的发明方法。从显微镜中诞生了病菌理论，从这个理论中诞生了现代医学的很多内容。病菌理论使人类能够对抗病毒和细菌，也改变了医学的其他方面，如手术在医学上变得有用，分娩变得更安全，医院成为人们康复而不是去世的地方。7


    然而，人工智能不仅是一种发明方法，它还可能是一种通用技术。这就是为什么人工智能需要系统变革，以及为什么人工智能的潜力暗示着一种悖论。


    ## 新的创新系统


    创新是一个结构化的试错过程。图 9-1 展示了这个过程在大多数情况下的运行方式。首先，研究机构设定一个目标，并提出如何实现该目标的假设，然后设计并运行一个实验来测试主要假设。通常情况下，实验会失败，并通过失败获得知识和新的假设，其中一个假设会带领实验走向成功。随后，该机构会运行一个试点项目，如果试点成功，那么创新就可以做大规模的部署。


    ![](img/5d7d0b82a68fe65c345bd809e0cf66b2_130_0.png)


    ## 图 9-1 创新过程


    这个过程既适用于相对简单的创新系统（如内容推荐引擎），也适用于更复杂的系统（如药物研发系统）。我们将依次讨论这两种系统。


    像亚马逊和 Spotify 这样推荐系统的目标可能是最大化用户参与度或增加销售额。商学院教授李道均和卡提克·霍桑纳格与一家大型线上零售商合作，研究推荐引擎的细节是如何影响销售额的。他们比较了两种引擎：一种是“协同过滤”推荐引擎，即“购买了这款产品的人还购买了那款”；另一种是基于关键词搜索的引擎。他们合作的公司有一个假设或理论，即推荐引擎会增加销售额。然后，他们进行了一个实验，随机向一些用户展示新的推荐引擎，向其他用户展示基于关键词搜索的旧引擎。在大多数产品类别中，新引擎的销量更高。这次的干预是成功的，所以该公司决定部署它。


    推荐引擎还提供了一些新的机会。它改变了产品的供销，使更多的人会购买同样畅销的产品，而不太畅销的产品或长尾产品的销量会减少。供销之所以发生变化，是因为“购买了这款产品的人还购买了那款”的推荐增加了最畅销产品的销量。当时在图书市场，每个人都会购买《达·芬奇密码》，所以它会被推荐给每个人。公司决定不再做进一步的改进，因为这些改进将增加整个供销过程中的销售额，特别是长尾产品的销售额。推荐引擎是一个适合现有工作流程的人工智能点解决方案。要扭转长尾产品销量下降的趋势，就需要与其他部门协调。工程师担心这实施起来会很费力，以及新算法会产生意想不到的后果。最重要的是，“工程师不想破坏现有系统”。尽管考虑到预期的好处，他们觉得系统层面的变化还是太大了。⁸


    以创新为重点的人工智能可以改变这个过程。人工智能不再需要假设最佳推荐引擎，而是可以利用现有数据生成成千上万种可能的推荐引擎（见图9-2）。一旦这个假设生成步骤加快，就可以在比短期购买更具影响力的措施上进行创新，如防止用户流失或长期销售。通过更好的假设，也许可以进行更多的实验，并获得更高的收益率和更大的投资回报。此外，如果预测足够准确，还可以跳过实验或试点阶段。本书作者之一阿杰伊与经济学家约翰·麦克海尔及亚历山大·斯·奥特尔在新材料发现领域模拟了这个想法。在生成假设的阶段进行更好的预测，可能会产生一个全新的系统。


    ![](img/5d7d0b82a68fe65c345bd809e0cf66b2_132_0.png)


    ## 图 9-2 推荐引擎的 A/B 测试（简单）


    更复杂的药物研发系统也可能产生同样的系统变化，其目标是设计新的药物，而过程是类似的——生成假设、实验、试点和部署。


    当然，这些机会取决于人工智能预测的重大进步。AlphaFold 可能正是这样的突破。AlphaFold 的预测本身并不会改变医学、研究或生物工程，但它可以帮助在寻找预测的研究人员更高效地工作。就像本书前面提到的金融欺诈检测公司
    Verafin 一样，更好的预测是一个点解决方案，可以嵌入现有系统并使其运行得更好。


    围绕 AlphaFold 的夸大之词是出于对新医学研究系统的憧憬。该系统将“需要更多的思考，而不是倒腾试管”。¹⁰ 一旦能够轻松预测任何蛋白质的结构，研究方法就会改变。那些努力利用
    AlphaFold 所带来机会的人意识到，现在有更多机会为疑难杂症研发治疗方法，因为他们发现蛋白质结构变得简单了，专门确定蛋白质结构的实验室已经没有太大用处了。未来需要更多实验室将已知蛋白质结构转化为有用的治疗方法。


    AlphaFold 提供的预测改变了研究方式。通过改变创新的过程，AlphaFold 可以改变医学。从更广义的层面上来说，人工智能对创新的影响最终可能会超过其在所有其他应用中的影响。因为创新是生产力、经济增长和人类福祉的核心，通过对创新的影响，人工智能可能比前几代通用技术（从蒸汽机到互联网）产生的影响更大。


    有了 AlphaFold，预测目标蛋白质结构不再是理论和实验之间反复迭代的烦琐过程。目前，这一阶段已经完成，创新目标可以更加雄心勃勃，可以测试更多的药物蛋白反应。人工智能可以改善创新活动的优先级排序，从而影响探索过程中的生产力；可以提高创新的预期价值，并根据创新的不同而增加或减少下游测试；降低探索过程中与明确瓶颈相关的成本（见图
    9-3）。


    尽管人们普遍认为我们需要一个新的系统，但如果不投入大量的时间、精力和资源，这样的系统也不会出现。


    ## 认识系统


    我们的观点是，意识到系统变革的机会是很困难的。我们看到人工智能对创新系统的影响正在不断扩大，许多人工智能系统正在创新过程中出现。例如，多伦多大学的教授艾伦·阿斯普鲁－古兹克正在利用人工智能进行化学研究。一个能够预测要测试哪些假设的人工智能被整合为系统解决方案的一部分，其中还包括人工智能控制的机械臂和一个装备齐全的便携式实验室，用于运行自动化实验。他将这个

    '
  mdcn: '

    需要加油站、良好的道路和一套全新的法律才能保障顺利运行。


    ## 价值与成本


    作为经济学家，我们与其他经济学家一样，往往关注成本。我们的第一本书《AI 极简经济学》的整个前提是，人工智能的进步将大幅降低预测的成本，从而导致其使用规模的扩大。然而，尽管该书指出人工智能最开始将应用在已经存在预测的领域，如销量预测或天气预报，以及照片分类和语言领域等，但我们也意识到，只有当预测成本降到足够低时，新的应用和用途才会出现，那才是真正的机遇。


    与此同时，通过在创新颠覆实验室与人工智能初创企业的合作中，我们发现，创业者最初的推销方式完全是关于某个人工智能系统如何对企业产生价值，因为这将为企业节省雇用员工的成本。在为这些人工智能产品定价时，他们采用的是成本思维，计算出所节省的工资和其他成本，并在此基础上为替代他们的机器定价。


    通常情况下，这样的推销会非常艰难。如果你去找一家企业，并告诉它如果砍掉某个岗位，你的人工智能产品可以每年为它节省 5 万美元的劳动力成本，那么你的人工智能产品最好能把整个岗位砍得干干净净。然而，创业者发现，这些人工智能产品也许只能减少一个人工作中的一项任务，这对于他们的潜在客户而言，节省这点劳动力成本是远远不够的。


    更好的推销方式不是专注于替代，而是关注价值。这些推销方式展示了人工智能产品如何使企业获得更多利润，如通过向自己的客户提供更高质量的产品。这种方式的好处在于不必证明人工智能在执行特定任务时所需成本比人类成本更低。这也减小了采用人工智能的内部阻力，从而企业的销售任务也会变得更容易。这里的关键是，相较于以节省成本为重点的方法，使人工智能增值的方法更有可能让人工智能的使用获得真正的推广。⁶


    我们在以往的技术革命中也看到了同样的对立。正如在第一章中所讨论的电力，其在制造业中替代蒸汽的过程是缓慢的，花费了几十年的时间。只有当电力成本低于蒸汽成本时，现有的工厂才会考虑采用电力。对于那些已经设计成依靠蒸汽运行的工厂而言，这是个难题。然而，在制造商意识到电力将使它们有机会在大面积的平坦区域上重新设计工厂，从而摆脱城市中的高额租金后，它们对投资新工厂的兴趣就大大增加了，因为这样的设计非常有可能显著提高生产力。另外，电动汽车曾被认为是比燃油汽车更有前景的技术。不过事实证明，汽油使汽车跑得更远，因此燃油汽车取得了胜利，至少在21世纪初电池技术取得进展之前都是如此。电力在重新设计的工厂中提高了价值，但在交通等领域却没有。最终，价值获胜。


    这里的重点是，采用新系统需要替换既有系统。单纯的成本计算很少会推动这种替换。建立新系统会有过渡成本，如果你只能节省既有系统成本的一小部分，那么这种替换可能就不值得。新系统能做新的事情——也就是说，带来新的价值创造机会——这才是让采用新系统成为现实的动力。


    ## 系统变革的挑战


    关于人工智能在医学领域潜力的研究已经有很多了。⁷埃里克·托普尔的《深度医疗：智能时代的医疗革命》一书解释了人工智能是如何改善诊断的，使医生有更多时间与患者交流并了解他们的需求。医学中的人工智能应用包括疾病诊断、自动化手术、家庭患者监测、个性化治疗以及药物发现和再利用。⁸这让人们开始担忧“人工智能在医疗保健中的阴暗面”，即人工智能与医学博士互相竞争。”


    也许《深度医疗：智能时代的医疗革命》如此有影响力的原因是，托普了解医疗保健系统（他是一名心脏病学家和美国斯克利普斯研究所分子医学教授），以及人工智能（他在学习与医疗保健相关的技术和局限性方面投入了大量时间和精力），并且他十分擅长沟通，能将复杂事物用浅显的语言表达出来（他是斯克利普斯转化研究所的创始人和主任）。但问题的是，他不是经济学家。因此，他没有从激励的角度讨论人类行为，或者他认为医生技能高于这些原始本能。我们担心的是，如果我们只是把新的人工智能技术应用到现有的医疗保健系统中，那么医生可能会没有动力使用，因为这取决于新的人工智能技术是否会增加或降低他们的报酬，而报酬是由收费服务等决定的。


    托普认为，如果人工智能可以为医生节省时间，那么医生就会把节省出来的时间用于与患者的交谈和沟通上。然而，并没有清晰的证据表明，过去为医生提高工作效率的工具增加了医生与患者交流的时间。而且事实可能正好相反，如果人工智能提高了医生的工作效率，医生可能会在不降低收入的前提下减少为每位患者花费的时间。为了实现托普所期望的有价值目标，我们需要的不仅是新的人工智能技术，还需要一个新系统，包括新的激励机制、培训、方法和文化，让医生以托普书中所期望的方式使用他们的技术工具。


    因此，尽管《深度医疗：智能时代的医疗革命》和其他文献都描述了许多利用人工智能改善医学领域的机会，但医疗保健并没有走在采用人工智能的前列。在对各行业的人工智能和机器学习工作进行研究后，我们发现医疗保健排名垫底。截至
    2019 年底，与人工智能相关的医疗保健工作数量很少，仅比建筑业、艺术和娱乐业多一些。甚至住宿和餐饮业，交通运输业、仓储和邮政业都拥有更多具备人工智能相关技能的员工。¹¹
    其中一个原因可能是医疗保健系统过于复杂。图 8–2 展示了美国医疗保健系统，该系统属于美国国会于 2010 年制定的奥巴马医改法案。¹²


    ![](img/5d7d0b82a68fe65c345bd809e0cf66b2_121_0.png)


    ## 图 8–2 美国医疗保健系统（2010 年）


    资料来源：美国国会联合经济委员会，“看懂奥巴马医改法案图”，2010 年 7 月，https://www.jec.senate.gov/public/_cache/files/96b779aa-6d2e-4c41-a719-24e865cacf66/understanding-the-obamacare-chart.pdf。


    在众多的协调决策中，除非进行其他改变，否则点解决方案和应用解决方案的价值都是有限的。要想象人工智能怎样实现个性化治疗可能容易，但只有大量不同的人改变他们的工作方式才能实现这一目标（如收集更多的个人数据、提供个性化的护理、创建以护理为中心的报销方式）。医疗保健领域的人工智能点解决方案往往给人们提供无法利用的预测（如没有可用的治疗方案）。人工智能应用解决方案往往会促成无人能采取（如责任规则导致采用人工智能困难）或者不愿采取（如它们与报酬制度不匹配）的行动。困难不在于预测不够准确或者行动没有用处，而在于要让所有组成部分协同工作并非易事。


    要实现这一目标，需要进行系统变革。我们对于有人工智能支持的新医疗保健系统已经有无数的设想。13 如果由人工智能提供诊断，那么医疗保健中关于谁有权力进行何种操作的规则就应该改变。当机器进行诊断时，医生的主要职责可能就是提供人性化的医疗服务。这就需要其他各种变革。医学院将不再要求学生背诵医学案例，也不再根据学生对生物学的掌握程度来选拔学生，而通常学生需要依靠其能力在考试中取得好成绩。这些技能在十年的高等教育中可能不会有太大提高，因此面向患者的医生可能只需类似本科学位的学历即可。反过来，这将需要对谁有权提供哪些医疗保健服务进行重大的监管变革。也许病人护理会成为药剂师的主要职责，也许社会工会进入医生曾经的工作领域。在第十八章中，我们将提供一个能在医疗保健中开发人工智能系统解决方案的流程，并对在急诊医学中的人工智能系统提出设想。也许这一切都不会发生，因为需要变革的东西实在太多了。


    人工智能也可能改变全球卫生系统。世界银行已经指出人工智能等技术如何在不同国家之间实现公平竞争。14 远程患者监测和机器诊断的结合可以改善偏远地区的医疗保健水平。


    喀麦隆的心脏病专家都在市区的医院工作，而该国 2 500 万居民中的许多人都离这些医院很远。大多数患有心血管疾病的人从未被诊断出来。喀麦隆的发明家阿瑟·赞格开发了
    Cardiopad 来解决这个问题。Cardiopad 是一种远程心电图工具，利用它则不需要当地的心脏病专家进行检查。该工具已经为数千名患者提供了远程诊断，但仍需心脏病专家进行最终诊断。2020
    年，与 Cardiopad 合作的 20 名心脏病专家不堪重负，因为整个国家只有 60 名心脏病专家。Cardiopad 解决了心电图的获取问题，但未解决规模化诊断的问题，而这需要能够进行诊断的机器以及愿意接受诊断的人。此外，一旦成千上万的人被诊断出疾病，还需要基础设施来治疗这些患者。


    目前，诊断和治疗的数量是紧密相连的。通过限制诊断，现有系统在需要治疗的患者数量上几乎没有不确定性。Cardiopad 就是该系统的一个组成部分，解决了心脏病专家与患者之间的距离问题。在喀麦隆，若想大规模改善心血管疾病的治疗，就必须改变诊断的方式，并开发新的治疗路径，然后反过来利用改变进行诊断。这些系统解决方案仍需进一步开发。15
    在此之前，Cardiopad 将继续改善喀麦隆千万名患者的医疗保健，但无法提升全民的心血管健康水平。


    IBM 是一家比 Cardiopad 更大的公司，其沃森系统是该公司的一个突破性项目，将对医疗保健领域产生巨大的影响。最终却没有达到预期的效果，因为存在数据问题和预测错误的实际风险。正如
    IBM 的一位合作伙伴所说：“我们以为这会很容易，但事实证明确实太难了。”16 虽然确定哪些任务适合人工智能点解决方案或应用解决方案是很容易的，且 IBM
    已经弄清楚了这一点，但事实证明，将这些解决方案有效地嵌入现有系统非常困难，而且新系统尚未出现。


    ## 反过来看


    在“中间时代”的最初阶段，采用人工智能的机会通常是被动的。供应商会向你提供一种新的人工智能技术，用于预测与你的组织有关的事情；或者你已经要求内部团队对其工作流程进行分析，确认是否有机会使用人工智能来协助完成一项或多项任务。17
    这是一个不错的方法，但只适用于利用人工智能点解决方案。


    目前为止，我们希望已经说服你，寻找机会采用具有变革意义的人工智能是有价值的。你需要检查整个系统，并了解人工智能是如何促进系统向更好方向发展的，而人工智能最重要的机会就在这里。


    谈论系统思维容易，真正形成却很困难。隐藏的不确定性通常很难被找到，将现有系统黏合在一起的规则也很难被去除。第一步要做的是认识到系统变革是必要的，而这种认识已经在经济部门中出现，接下来我们将讨论这个问题。


    ## 本章要点


    - 目前，任务层面的思维是主导方法，即在经济各个部门中规划引入人工智能。其主要思路是确定一个职业中的具体任务，这些任务依赖预测，而预测是由人工智能（并非人类）以更准确、快捷、廉价的方式产生的。企业领导者、管理顾问和学者基本上都认同这种方法。

    - 任务层面思维的主导地位令人惊讶，因为迄今为止，人工智能最引人注目的应用并不是在任务层面替代人类劳动，而是新的系统层面的设计。因为人工智能具备了预测能力（如亚马逊、谷歌、奈飞、苹果等），所以新的系统层面的设计成为现实。任务层面的思维会导向点解决方案，其动机通常是基于劳动力替代的成本节约。相比之下，系统层面的思维会导向系统解决方案，其动机通常是创造价值，而非节约成本。

    - 人工智能在医疗保健领域有许多应用：疾病诊断、自动手术、家庭患者监测、个性化治疗、药物发现和再利用等。然而，目前为止，医疗保健系统从人工智能中获益甚微，部分原因是获得监管部门的审批需要大量时间，但更多原因是在现有医疗系统中使用人工智能点解决方案的好处不明显。要想充分发挥人工智能在医疗保健中的作用，就需要一个系统解决方案。我们必须从头开始，想象该如何在一个全新设计的系统中更好地为人们的健康服务，同时这个系统又能获得全新的、强大的预测技术。这意味着需要重新思考培训、交付程序、薪酬、隐私和责任。总而言之，这意味着要采用系统思维。


    ## 第九章


    ## 最伟大的系统


    《福布斯》杂志的一篇文章称：“AlphaFold 是人工智能领域有史以来最重要的成就。” 尽管该杂志往往夸大其词，但《自然》这样严肃的学术期刊也发表了类似的观点：“AlphaFold
    将改变一切。” 1


    AlphaFold 能够预测蛋白质的结构。蛋白质是生命的构建单元，负责细胞内进行的大部分活动，功能和作用取决于其三维结构。在分子生物学中，“结构即功能”。


    长期以来，科学家一直想知道蛋白质的结构从何而来，一个蛋白质的组成部分是如何从其最终形状的众多扭曲和褶皱中映射出来的。几十年来，实验一直是获取良好蛋白质结构的主要方法。


    有了 AlphaFold 这样一个基于氨基酸序列预测蛋白质结构的工具，科学家可以发现有关生命构建单元的全新事实。 2 加利福尼亚大学旧金山分校的研究人员使用
    AlphaFold 分析了一种名为 SARS-CoV-2 的关键蛋白质，发现了之前未知的细节，这推动了新冠病毒治疗方法的发展。科罗拉多大学博尔德分校的科学家花了多年时间试图确定一种特定细菌蛋白质的结构，以帮助对抗抗生素的耐药性，现在使用
    AlphaFold 在 15 分钟内掌握了该结构。 3 另一个实验室指出，在尝试其他工具 10 年后，AlphaFold 在 30 分钟内展示了一个蛋白质的结构。4
    该实验室的负责人安德烈·卢帕斯说道：“这将改变医学，改变研究，改变生物工程。”


    ## 创造一种发明方法


    如果我们必须指出人工智能最有可能改变经济的领域，那就是大多数普通商业活动的上游：创新与发明的系统。好消息是，在这里，人工智能的实践者似乎认识到系统思维对于人工智能的采用是必须的。如果
    AlphaFold 想要改变医学、研究和生物工程，就必须超越点解决方案。


    2017 年，我们主办了第一届 NBER（美国国家经济研究局）人工智能经济学会议。在会上，经济学家伊恩·科克伯恩、丽贝卡·亨德森和斯科特·斯特恩认为，人工智能“有可能改变创新过程本身”。数据科学已经是科学进程的一部分，而人工智能将使数据科学更好、更快、更便宜，并将实现新型预测。这将开辟新的研究途径，并提高实验室的生产力。5
    作为一种创造产品的新方式，而不仅是对特定产品的改进，研究工具的经济影响不仅在于它们能降低创新成本，6 还改变了创新的游戏规则。


    显微镜也是一种新的发明方法。从显微镜中诞生了病菌理论，从这个理论中诞生了现代医学的很多内容。病菌理论使人类能够对抗病毒和细菌，也改变了医学的其他方面，如手术在医学上变得有用，分娩变得更安全，医院成为人们康复而不是去世的地方。7


    然而，人工智能不仅是一种发明方法，它还可能是一种通用技术。这就是为什么人工智能需要系统变革，以及为什么人工智能的潜力暗示着一种悖论。


    ## 新的创新系统


    创新是一个结构化的试错过程。图 9-1 展示了这个过程在大多数情况下的运行方式。首先，研究机构设定一个目标，并提出如何实现该目标的假设，然后设计并运行一个实验来测试主要假设。通常情况下，实验会失败，并通过失败获得知识和新的假设，其中一个假设会带领实验走向成功。随后，该机构会运行一个试点项目，如果试点成功，那么创新就可以做大规模的部署。


    ![](img/5d7d0b82a68fe65c345bd809e0cf66b2_130_0.png)


    ## 图 9-1 创新过程


    这个过程既适用于相对简单的创新系统（如内容推荐引擎），也适用于更复杂的系统（如药物研发系统）。我们将依次讨论这两种系统。


    像亚马逊和 Spotify 这样推荐系统的目标可能是最大化用户参与度或增加销售额。商学院教授李道均和卡提克·霍桑纳格与一家大型线上零售商合作，研究推荐引擎的细节是如何影响销售额的。他们比较了两种引擎：一种是“协同过滤”推荐引擎，即“购买了这款产品的人还购买了那款”；另一种是基于关键词搜索的引擎。他们合作的公司有一个假设或理论，即推荐引擎会增加销售额。然后，他们进行了一个实验，随机向一些用户展示新的推荐引擎，向其他用户展示基于关键词搜索的旧引擎。在大多数产品类别中，新引擎的销量更高。这次的干预是成功的，所以该公司决定部署它。


    推荐引擎还提供了一些新的机会。它改变了产品的供销，使更多的人会购买同样畅销的产品，而不太畅销的产品或长尾产品的销量会减少。供销之所以发生变化，是因为“购买了这款产品的人还购买了那款”的推荐增加了最畅销产品的销量。当时在图书市场，每个人都会购买《达·芬奇密码》，所以它会被推荐给每个人。公司决定不再做进一步的改进，因为这些改进将增加整个供销过程中的销售额，特别是长尾产品的销售额。推荐引擎是一个适合现有工作流程的人工智能点解决方案。要扭转长尾产品销量下降的趋势，就需要与其他部门协调。工程师担心这实施起来会很费力，以及新算法会产生意想不到的后果。最重要的是，“工程师不想破坏现有系统”。尽管考虑到预期的好处，他们觉得系统层面的变化还是太大了。⁸


    以创新为重点的人工智能可以改变这个过程。人工智能不再需要假设最佳推荐引擎，而是可以利用现有数据生成成千上万种可能的推荐引擎（见图9-2）。一旦这个假设生成步骤加快，就可以在比短期购买更具影响力的措施上进行创新，如防止用户流失或长期销售。通过更好的假设，也许可以进行更多的实验，并获得更高的收益率和更大的投资回报。此外，如果预测足够准确，还可以跳过实验或试点阶段。本书作者之一阿杰伊与经济学家约翰·麦克海尔及亚历山大·斯·奥特尔在新材料发现领域模拟了这个想法。在生成假设的阶段进行更好的预测，可能会产生一个全新的系统。


    ![](img/5d7d0b82a68fe65c345bd809e0cf66b2_132_0.png)


    ## 图 9-2 推荐引擎的 A/B 测试（简单）


    更复杂的药物研发系统也可能产生同样的系统变化，其目标是设计新的药物，而过程是类似的——生成假设、实验、试点和部署。


    当然，这些机会取决于人工智能预测的重大进步。AlphaFold 可能正是这样的突破。AlphaFold 的预测本身并不会改变医学、研究或生物工程，但它可以帮助在寻找预测的研究人员更高效地工作。就像本书前面提到的金融欺诈检测公司
    Verafin 一样，更好的预测是一个点解决方案，可以嵌入现有系统并使其运行得更好。


    围绕 AlphaFold 的夸大之词是出于对新医学研究系统的憧憬。该系统将“需要更多的思考，而不是倒腾试管”。¹⁰ 一旦能够轻松预测任何蛋白质的结构，研究方法就会改变。那些努力利用
    AlphaFold 所带来机会的人意识到，现在有更多机会为疑难杂症研发治疗方法，因为他们发现蛋白质结构变得简单了，专门确定蛋白质结构的实验室已经没有太大用处了。未来需要更多实验室将已知蛋白质结构转化为有用的治疗方法。


    AlphaFold 提供的预测改变了研究方式。通过改变创新的过程，AlphaFold 可以改变医学。从更广义的层面上来说，人工智能对创新的影响最终可能会超过其在所有其他应用中的影响。因为创新是生产力、经济增长和人类福祉的核心，通过对创新的影响，人工智能可能比前几代通用技术（从蒸汽机到互联网）产生的影响更大。


    有了 AlphaFold，预测目标蛋白质结构不再是理论和实验之间反复迭代的烦琐过程。目前，这一阶段已经完成，创新目标可以更加雄心勃勃，可以测试更多的药物蛋白反应。人工智能可以改善创新活动的优先级排序，从而影响探索过程中的生产力；可以提高创新的预期价值，并根据创新的不同而增加或减少下游测试；降低探索过程中与明确瓶颈相关的成本（见图
    9-3）。


    尽管人们普遍认为我们需要一个新的系统，但如果不投入大量的时间、精力和资源，这样的系统也不会出现。


    ## 认识系统


    我们的观点是，意识到系统变革的机会是很困难的。我们看到人工智能对创新系统的影响正在不断扩大，许多人工智能系统正在创新过程中出现。例如，多伦多大学的教授艾伦·阿斯普鲁－古兹克正在利用人工智能进行化学研究。一个能够预测要测试哪些假设的人工智能被整合为系统解决方案的一部分，其中还包括人工智能控制的机械臂和一个装备齐全的便携式实验室，用于运行自动化实验。他将这个

    '
