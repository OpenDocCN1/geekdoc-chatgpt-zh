    # 第十七章


    # 白板'
  - '[PAGE 247]


    <!-- no content -->'
  - '[PAGE 248]


    想象一下你去做体检，医生对你说：“你在三年内生重病的概率很高，感谢您前来就诊。”然后医生走出去，开始诊断下一个病人。你肯定会目瞪口呆。为什么他不告诉你是什么导致你生病？为什么他不解释你可以做什么来降低生病的概率？


    虽然这个故事似乎让人难以置信，但在保险行业中却每天都在发生。保险公司会对一些人收取比其他人更高的保险费。为什么？因为它们预测某些客户相比其他人更有可能遭受损失。保险公司是如何知道谁会面临更大风险的呢？因为它们投入巨资收集和分析数据，以预测客户遭受损失和提出索赔的可能性。


    保险公司处于数据科学的前沿并不奇怪，预测是它们的工作。然而，令人惊讶的是，它们并不与客户共享它们对风险的见解。这些宝贵的信息可以帮助客户降低风险，而不仅仅是为自己投保。


    例如，家庭保险公司正在采用人工智能来生成精准度更高的预测。现在，许多公司能够对风险级别或次级风险级别（例如，电线接触不良所导致的电气火灾风险，漏水管道所导致的水灾风险）进行风险预测。因此，如果一个家庭保险公司预测某位房主会有特别高的电'
  - '[PAGE 249]


    气火灾或水灾风险，那么该公司与其因为该房主提出索赔的可能性很高而向他收取高额的保费，还不如与客户共享这些信息，以便客户采取行动，从而降低风险。这类客户可以投资购买低成本的设备，以尽早发现严重火灾或水灾的隐患。保险公司甚至可以决定补贴这些风险缓解工具，因为预期损失的减少可能超过设备的成本。


    令人惊讶的是，很少有保险公司在这个领域取得显著进展。相反，大多数保险公司将精力集中在构建和部署增强传统核保预测的人工智能上。它们正在建立点解决方案。为什么大多数保险公司没有抓住机遇来更好地服务客户，将业务模式从集中客户风险和将客户风险转嫁给承保人，转变为降低客户风险呢？可能是因为代理人不喜欢这种方式，因为降低风险意味着较低的保费，这可能导致收入减少。但总体而言，这似乎会为客户创造重要的价值。


    在许多情况下，保险公司没有充分意识到这个机会，因为它超出了正常的业务模式。除了对代理人的激励措施，该行业还有许多商业规则、政府法规和行事方式，从局外人的角度看可能是显而易见的，但从内部人士的角度却很难看到。因此，我们提出了白板方法。为进一步阐释这一方法，我们来介绍人工智能系统探索画布。


    # 像经济学家一样思考


    作为经济学家，我们的一项技能是将令人兴奋和难以理解的事物解构为乏味和可理解的内容。虽然这使我们不太适合参加派对，但它有时确实使我们能够发现那些被他人忽视的东西。我们设计了一个框架，帮助你做到这一点。人工智能系统探索画布对于你想要发展系统思维以评估人工智能的价值是有帮助的。


    在本章中，我们将为你提供一个工具，你可以用它在一块白板上'
