    ## 人工智能预测迫使人们做出明确的判断


    乔丹和莱因斯多夫之间出现分歧，是因为他们已经从医学专家那里得到了诊断结果，实际上是一种预测，而他们都没有资格质疑。但是考虑一下，有多少决策是在没有明确预测的情况下做出的呢？那么会发生什么呢？当消防员必须在紧急情况下选择救援两人中的一个时，他们不仅要考虑能够成功救出一个人而不是另一个人的相对可能性，还要考虑这两人的身份——比如老年人和儿童。消防员会做出决策，但是他们对不同结果的权重分配很可能是隐性的而不是显性的。我们对他们决策有效性的评估取决于多种因素的组合。


    然而，人工智能预测可能会将决策中的这一部分从决策者手中抽离出来。人工智能预测将导致预测和判断“脱钩”（见图 13-3）。


    预测和判断的“脱钩”并不是一个仅适用于课堂，而不适用于现实世界的假设概念。麦肯锡最近有一篇关于保险业未来的文章便是基于这种预测和判断的“脱钩”而撰写的。⁵
    该文章勾勒出了 2030 年汽车保险的愿景：顾客上车后，他们的个人数字助手会规划可能的路线，助手背后的人工智能会预测事故发生的可能性，而顾客则根据自己的判断做出决策。


    具体情况可能会像这样：你为去温哥华出差租了一辆车，你住在市中心布拉德街上的萨顿酒店，要去不列颠哥伦比亚大学开会。你可以选择沿着水边行驶的观光路线，也可以选择沿着西四街行驶的沉闷路线。观光路线会经过基斯兰奴海滩、杰里科公园和西班牙海滩，景色非常美丽。走观光路线会稍微慢一些，但影响不大，无论选哪条路线，你都能准时到达。


    ![](img/5d7d0b82a68fe65c345bd809e0cf66b2_189_0.png)


    ### 图 13-3 人工智能预测导致预测和判断“脱钩”


    真正的问题是，在观光路线上，很多人都在欣赏风景，这会分散你的注意力。因此，在观光路线上发生轻微交通事故的概率较高。假设你租的车配备了人工智能系统，它将准确地告诉你在观光路线上发生事故的可能性会有多大，然后，你需要运用判断力来评估是否值得冒着风险欣赏风景。为此，你可以绘制决策树，并为不同结果添加回报，就像迈克尔·乔丹在前文例子中所做的那样，你通过计算预期回报来决定是否选择观光路线。


    但谁会这样做呢？没有人。这太复杂了。从最糟糕的字面意思来讲，这就是学术研究。理论上很惊艳，但在实践中却毫无用处。


    但情况也可以不是这样的，你可以将这个决策转化为你熟悉且经常做的决策。在人工智能助手预测概率后，它会告诉你一个价格。它会说如果你选择观光路线，你的保险费将增加
    1 美元。


    这看起来不过是一件小事。司机可以根据价格来选择路线，而价格又是根据事故发生的可能性和维修费用来确定的，这一点对顾客是隐藏的。人工智能计算事故的概率并分配成本，而顾客只看到了一个价格。


    机器进行预测，顾客进行判断。顾客只需判断这个价格是否值得购买即可——小事一桩。


    这种情况已经出现在我们生活中了。许多公司根据每分钟的驾驶决策给保险定价，它们为那些在手机上安装了远程信息处理应用程序的人提供折扣，并假设这些顾客有良好的驾驶行为。例如，特斯拉无须依赖手机数据，它可以使用车辆自身的数据，根据急刹车、不安全的跟车距离等因素计算出安全得分。“通过基于驾驶行为的保险定价，顾客可以享受较低的保费，我们的道路也会更安全。”


    预测与判断“脱钩”了，保险公司根据有风险的行为定价，顾客判断这种行为是否值得购买。


    保险的例子表明，判断可以与预测“脱钩”，而我们人类习惯于做出判断，这正是经济学家所谓“显示性偏好”的实质。我们可以通过决策来了解人们的偏好，市场营销人员几十年来一直在利用这一点。


    1971 年，保罗·格林和维塔拉·拉奥发表的论文《用于量化判断性数据的联合测量法》描述了一种用于评估消费者需求的全新工具。该论文开头指出：“长期以来，管理人员或消费者判断的量化一直是营销研究人员面临的问题。”他们强调，“研究消费者决策需要确定买家在做决策时如何权衡相互冲突的标准”。该方法要求消费者对不同的选择进行排序，这些选择是假设性的，但足够简单，因为消费者非常熟悉它们。


    格林和拉奥以折扣卡为例。第一张卡在 10 家店铺提供 5% 的折扣，售价为 14 美元；第二张卡在 5 家店铺提供 10% 的折扣，售价为 7 美元；第三张卡在
    10 家店铺提供 15% 的折扣，售价为 21 美元。通过让消费者对其偏好进行排序，统计学家可以确定消费者心目中每张卡的价值。选择即判断。


    随着时间的推移，这种方法得到了进一步发展。它被用于评估意大利香肠或夏威夷比萨、福特卡车或丰田汽车的价值，甚至被用于了解美国大学的中国博士生是留在美国还是回到中国的偏好。通过询问学生是更喜欢在波士顿私营部门的研究科学家职位（薪资为
    70 000 美元）还是在北京公共部门的管理职位（薪资为 50 000 美元），研究人员了解了学生对生活在美国还是中国相对价值的判断。¹


    这种显示性偏好框架在经济学中也有相应的研究领域。其最初是从丹尼尔·麦克法登在 20 世纪 70 年代初的诺贝尔经济学奖获奖研究开始的，该研究是使用食品杂货店扫描仪数据和在线点击流测量需求等现代工具的基础。


    15 年前，该领域的著名经济学家可能是帕特·巴贾里，巴贾里现在是亚马逊的核心人工智能副总裁兼首席经济学家。在加入亚马逊之前，巴贾里曾是哈佛大学、斯坦福大学、杜克大学、密歇根大学和明尼苏达大学的教授。他是世界计量经济学学会的院士，写过一些标题晦涩难懂的论文，如《针对各种消费者与无人留意的产品特征所做的需求估计：一种享乐主义的方式》和《随机系数分布的简单估算器》（但并不简单）。巴贾里是他那一代极为出色的计量经济学家之一，他的论文充满了抽象的符号和方程式，我们没有预料到他会将亚马逊发展成世界上最大的经济学博士雇主之一。


    然而，他确实做到了。这在很大程度上与他作为导师和领导者的技能有关，¹⁰ 也与他的论文直接相关。需求估计对亚马逊的业务至关重要，亚马逊需要了解消费者看重什么以及他们愿意付多少钱。如果亚马逊知道消费者对产品的价值判断，就可以在适当的时间以适当的价格为他们提供合适的产品。在营销研究和计量经济学中都有估算消费者判断的工具。在巴贾里的领导下，亚马逊经济学团队找到了如何大规模确定这种判断的方法。


    一旦我们认识到可以通过决策来理解判断，就能发现人类一直在做出判断。我们擅长判断，只有当判断与预测“脱钩”时，判断才会变得陌生。


    ## 判断的机会


    预测和判断的“脱钩”创造了机会。这意味着，决策的制定者不是谁能最好地同时进行预测和判断，而是谁能最好地利用人工智能预测来做出判断。


    一旦人工智能做出了预测，那么拥有最佳判断能力的人就能脱颖而出。正如我们所指出的，不管是在概念上，还是在越来越多的实践中，人工智能都能够比许多放射科医生更精确地进行预测。虽然这取决于具体的预测内容，但实际上，人工智能可以不通过观察放射科医生的预测来进行训练，而是通过将图像与观察到的可靠结果相匹配，比如在病理学上是否发现了一个恶性肿瘤。因此，人工智能预测可能比人类预测更精准。科技先驱和知名人工智能投资人维诺德·科斯拉认为，未来放射科医生如果不依赖人工智能预测，就可能造成医疗事故。


    这就涉及一个问题——人工智能预测对放射科医生的判断价值有何影响？考虑到放射科医生（至少在美国）的工作方式，他们并不知道患者的其他信息。因此，如果人工智能预测某个患者患有恶性肿瘤的概率为
    30%，那么在什么情况下医疗系统能够相信一个放射科医生的判断，即患者应该接受肿瘤相关诊断和治疗？但与此同时，另一个医生则认为患者不应该接受诊断和治疗。实际上，这很难想象。人们推测，医疗专业人员委员会会在机器预测前进行讨论和争辩，制定诊断规则，随后该委员会的判断被大规模地应用。放射科医生的决策被拆分为机器预测和委员会的判断两部分。


    一旦人工智能提供了预测结果，新的系统就会出现，以利用更好、更快、更便宜的预测和更恰当的判断。在《AI 极简经济学》一书中，我们讨论了亚马逊有机会改变其商业模式，从而在用户下订单之前就将商品送到用户的家门口。这种商业模式现在已经存在了，Stitch
    Fix 在服装方面就是这样做的。“正如其首席执行官卡特里娜·莱克所说：“我们通过将数据和机器学习与专家人士的判断相结合，进行独特而个性化的选择。”事实上，它并没有止步于此。在时尚行业中，库存的成本很高。数据科学团队开发了一种算法，将库存中货物的再购买决策与预期需求变化的预测结合起来。


    在第十一章中，我们阐明了机器之所以没有权力，是因为做出决策所需的判断始终来自人类，即使机器最终可能实施决策。在接下来的章节中，我们将讨论与预测“脱钩”后的判断技能。了解这些技能后，就可以解释预测和判断的“脱钩”是如何改变做决策的合适人选的。“脱钩”为人工智能的采用创造了新的机会，其核心就是加强与判断有关的技能。


    ## 本章要点


    - 预测和判断是决策的两个重要组成部分。在决策树中，预测生成了树上每个分支情况发生的概率。判断生成与每个分支末端结果相关联的回报。通常情况下，我们在做决策时并没有意识到预测和判断是两个独立的输入，因为它们都存在于同一个人（决策者）的思想中。当引入人工智能时，我们将预测从人转移到机器，从而将预测与判断“脱钩”。这可能会改变做出判断的主体。


    - 我们时常做出决策，却从不考虑预测或判断，我们只是做决定。尽管我们在每次做决策时并没有明确思考预测和判断，但


    ## 第十四章


    ### 从概率的角度思考


    2018 年，一辆优步自动驾驶汽车在亚利桑那州坦佩市撞死了一名行人。这是自动驾驶汽车发生的第一起致命事故。据报道，这辆汽车看到了行人但没有刹车。新闻报道援引了普林斯顿大学一位教授的话，“这应该是对所有正在测试自动驾驶车辆公司的警告，让它们检查自己的系统，确保在必要时能够自动刹车”。¹然而，在事故发生当天，坦佩市警察局局长给出了不同的解释：“很明显，根据行人走来的方式，她很难避免这次事故。”
    ²


    优步真的会编程它的车辆去撞人吗？当然不会。但要说车辆没有看到行人，这也是不对的。相反，在碰撞前 6 秒，车辆预测到了一个未知物体的出现，但当车辆预测到这个未知物体很可能是一个人时，紧急制动已经来不及起作用了。³


    换句话说，这两种解释都是错误的，因为它们是确定性的。车辆确实识别出了一个物体，并且有很小概率认为这个物体可能是一个人。如果车辆在更早时预测到这个物体很可能是一个人，它就会启动刹车，事故就可以避免。审查事故报告表明，车辆以极低的概率探测到了人，虽然概率非常低，但不是零。此外，车辆被编程为只要某物体被认为可能是人的概率不是太高，就可以继续前行。这个概率可能是
    0.0001% 或 0.000000001%，但绝不是零，因为机器不是这样工作的。


    这是一个可怕的结果。一辆自动驾驶车辆看到行人的概率不够高，无法及时刹车，要意识到这是一个错误的决策需要付出更多努力。事故发生后，优步暂停了其自动驾驶车辆项目。当它在
    2018 年 12 月恢复自动驾驶时，该项目发生了变化。车辆速度被限制在不超过 25 英里/小时，并且始终配备两名安全驾驶员。另外还进行了许多其他改变，包括由第三方监测驾驶员及不同的自动刹车程序。基于阈值的决策已经不够用了。


    ### 赌徒思维


    区分糟糕的决策和结果是很重要的。有时好的决策会导致糟糕的结果。这是职业扑克选手安妮·杜克在她的《对赌：信息不足时如何做出高明决策》一书中的观点之一。截至撰写本书时，杜克是唯一一位赢得
    NBC（美国全国广播公司）全国扑克单挑锦标赛的女性选手。扑克是一种既需要运气又需要技巧的游戏，你可能打出完美的牌但最后却输了，也可能在一手糟糕的牌上下了大的赌注却幸运地赢了。


    当事情变糟糟糕时，杜克认为关键是要进行反思，是决策糟糕还是运气不好。如果只是运气不好，那就把它归类为糟糕的结果，然后继续前进；如果是糟糕的决策，那就吸取经验教训，并在下次做得更好。


    太多的业余扑克玩家一旦得到糟糕的结果，就会改变他们的策略。同样，太多人下的赌注既大又不合理，但却赢了，然后他们根据过去的结果做出下一步决策。杜克把这种习惯称为“结果导向”，久而久之这些玩家就变得越来越差。如果无法辨别一个结果是不是运气造成的，不确定性就会让他们很难去吸取经验教训。


    迈克尔·乔丹确实在 1985—1986 年赛季末期上场比赛，而且没有受伤，他得到了一个好结果。无论足以结束他职业生涯的伤痛和缺席赛季的概率与相关回报如何，这都是最好的结果。在那个赛季后，他赢得了
    6 个总冠军和 5 个最有价值球员奖，并成为历史上收入最高（达 26 亿美元）的运动员。这些结果使人认为乔丹参加比赛似乎是正确的决策，也许他应该更早地回到赛场上。然而，乔丹上场后没有受伤，这并不意味着他做出了正确的决策。


    赌徒思维要求你认识到预测是不确定的，并理解部分结果取决于运气，但这并不容易。对于汽车来说，在自动驾驶汽车出现之前，预测和判断都掌握在司机手中。如果人类司机撞到了行人，我们不会知道他们是犯了预测错误（他们认为撞到人的可能性几乎为零，所以没有踩刹车）还是判断错误（他们着急赶时间，因而想着如何快速到达目的地，低估了路上出现车祸的概率）。如果他们发生了事故，我们假设他们的判断是正确的，但他们在做出关于撞车的预测时犯了机械错误。目前，整个社会似乎能够容忍这种问题。


    当你设计一辆自动驾驶汽车时，你可以测量预测误差，但你必须对判断进行量化，这就需要做一些不愉快的事情，比如计算生命的成本，并将其与车上乘客的体验进行比较（过于谨慎导致频繁停车是令人不愉快的）。人们一直在暗中权衡这一点，但如果要求他们大大方方地做，他们又会拒绝。同样，让一个工程团队（也许是伦理团队）来决定如何处理自动驾驶汽车，也是令人不愉快的。


    ### 接受不确定性


    赌徒思维意味着接受不确定性。我们会仔细衡量事情发生的概率。如果概率足够高，就选择左边；反之，就选右边。换句话说，我们的决策规则有明确的标准，其依照预测而定。如果预测非常准确，这种方法就会很有效。回想一下迈克尔·乔丹关于是否冒着加重伤痛的风险继续比赛的决定。如果医生说受伤完全不会导致他的职业生涯结束，那么乔丹和莱因斯多夫都会毫不犹豫。不过实际上这个决策很困难，因为预测涉及不确定性。乔丹认为
    90% 的确定性已经足够，而莱因斯多夫则持不同意见。


    通过衡量信心程度来做出决策的想法是很吸引人的。例如，评估难民入境的过程是一个充满不确定性的决策过程。根据难民申请人的陈述，难民评估员需要判断申请人的申请是否可信，且如果他们的申请被拒绝，根据《联合国难民公约》的规定，他们是否会受到伤害？此外，支持评估员做出决策的材料通常很少，而他们也很少收到有关他们过去决策是否正确的反馈。


    目前，评估员尽力权衡证据并做出决策。他们往往对自己的决策很有信心。正如一位学者所说：“有些人似乎认为，仅凭他们的直觉就能正当地做出真理般的裁决。如果直觉告诉他们某个人在撒谎，那个人就一定在撒谎。”
    4


    这种信心是错误的。为了做出更加慎重的决策，如果我们能够获得一项评估申请人说谎概率的预测，这将有所帮助。我们的目标是改善决策结果，而不是提高受理申请的比例。


    目前，我们无法获取有关结果的数据，因此无法了解接受或拒绝难民的决策是否带来了评估员所预期的结果。要想收集这些数据，就需要构建一个预测机器，然后对未来的申请人进行评估。有了这个机器，我们就可以更有信心地通过证据进行评估。例如，在加拿大，一位来自德国的难民申请人声称自己受到了其儿子学校管理层的迫害，并表示德国警方无法为她提供帮助。我们可以获取大量关于德国警方对犯罪报告响应力的数据，因此有信心预测警方会保护她，至少满足她的难民申请。评估员也可以确信，证据将支持也门的
    LGBTQ（性少数群体）活动人士或苏丹的受迫害少数民族成员的申请。


    其他情况则还是存在不确定性。关于警方是否会对家庭暴力的求助做出回应，或者申请人的个人情况是否足以引起政府的关注，往往没有足够的信息。在这些情况下，缺失的数据意味着不确定性，不确定性将减少过度自信。


    评估员需要运用判断力来比较不确定的预测与申请评估，即哪种错误更严重：拒绝应该被批准的难民申请，还是批准应该被拒绝的难民申请。5 这看起来很简单，但实际上风险很高。拒绝合法的难民申请可能会导致其受到迫害或死亡，批准虚假的难民申请意味着人们会利用某个国家的慷慨。根据《联合国公约》，接受虚假的难民申请是严重的错误，而拒绝合法的难民申请显然是“大错特错”。


    在预测和判断“脱钩”的情况下，即使是最好的人工智能，对难民申请的预测仍然存在不确定性。最终，如果预测机器接受了预测中固有的不确定性，那么更多的申请将被接受，拒绝的代价将会很高。


    目前的系统并不是这样运作的。对于评估员而言，传达不确定性的预测机器没有太大用处。他们没有接受过解释不确定性的培训，而法律对于错误决策的严重性也存在模糊之处。即使评估员接受了培训，也不能将其直接应用于现有流程中。接受所有不确定的难民申请可能会引起政治压力，使难民难以实现其目标，可能还会导致人们掩盖信息。尽管人工智能有潜力带来更公正的难民申请流程，但在系统没有改变的情况下，这仍是不可行的。这个新系统的一部分将是对判断的明确理解，即如何衡量错误决策的相对风险。


    ### 判断力缺失限制了人工智能


    判断就是表达你的需求。但是，如果出现了新的环境或者信息是你之前没有处理过的，你是否真的知道自己的需求？对于受理难民申请的评估员来说，如何解释某个申请有 40%
    的合法性？过去，评估员在他们的决策中将预测和判断结合在一起。对于很多人工智能的新应用来说，与预测“脱钩”的判断可能尚不存在。因为没有能力预测将要发生的事情，所以无法根据该预测来采取行动，进而也没有理由去了解该行动的回报。


    这意味着预测和判断之间存在“先有鸡还是先有蛋”的问题，进而对采用预测机器和构建新的人工智能系统产生了障碍。只有当你知道信息的用途时，投资和采用更好的预测才有价值。只有当你预期有更好的预测时，你才会想出如果有更好的预测，你可能会怎么做。因此，缺乏判断力会限制你投资更好预测的意愿，反之亦然。


    ### 找寻判断


    判断可以通过在事前思考预期结果来建立。通过研究、评估和向他人学习，你可以确定在不同情况下可能出现的结果。我们大多数人就是这样学会不碰热炉子的。有人告诉你碰热炉子会烫伤自己，你在没有亲身经历烫伤的情况下学会了这个判断。有人将这个判断传递给了你，这种方式的好处在于避免了在做事过程中犯下代价高昂的错误。


