  md: "\n其中，许多案件的焦点在于公司是否在薪资或晋升方面存在歧视。假设一家科技公司被指控在晋升方面存在性别歧视。毫无疑问，该公司提拔了几名男性，而没有提拔在公司工作时间更长的原告（女性），但诉讼的核心问题是为什么。\n\
    \n原告声称公司故意歧视她，而公司会回应说，这位原告“不仅不是歧视的受害者，而且是一个难缠且狡诈的员工，拒绝接受改进建议”，这正是《纽约时报》中描述的一位被告所采取的做法。当管理者被问及公司在晋升推荐中是否存在歧视时，他们会否认。原告的律师可能会直截了当地问：“如果我的客户是个男性，可能会被晋升吗？”答：“不会。”原告的律师会试图比较那些被晋升者的表现与原告的表现，但表现是难以衡量的，而比较中存在太多的模糊之处。\n\
    \n即使存在歧视，也很难证明。没有两个人是完全相同的，管理者在制定晋升和招聘决策时考虑了各种因素。如果没有明确的歧视意图陈述，法官或陪审团就很难确信一个人的决策是带有歧视性的。我们无法知道别人内心的真实想法。\n\
    \n## 没有两个人完全相同\n\n塞德希尔·穆来纳森是一个发现歧视的专家。在他获得博士学位仅 3 年后的 2001 年，穆来纳森及其合著者玛丽安·贝特朗便开始研究美国劳动力市场的歧视情况。他们向波士顿和芝加哥的报纸招聘广告投递了虚构的简历。对于每个招聘广告，他们都投递了\
    \ 4 份简历，其中 2 份是高质量的，2 份是低质量的。他们随机给其中一份高质量简历取了一个非洲裔美国人的名字（ Lakisha Washington 或\
    \ Jamal Jones），另一份取了一个白人的名字（ Emily Walsh 或 Greg Baker）。类似地，他们随机给其中一份低质量简历取了一个非洲裔美国人的名字，另一份取了一个白人的名字。\n\
    \n然后，他们就等待着虚构的申请者是否被邀请参加面试。白人名字收到的回电比例多了 50%。有着白人名字和非洲裔美国人名字的高质量简历之间的差距甚至更大。劳动力市场中明显存在歧视。\n\
    \n15 年后，穆来纳森再次进行了类似的研究。现在他是芝加哥大学的教授，并获得了麦克阿瑟“天才奖”，他和其合著者发现，一种广泛使用的用于识别对健康有复杂需求患者的算法存在种族偏见。在给定的风险评分下，非洲裔美国人患者实际上比白人患者的病情更严重。如果能消除这种差异，非洲裔美国人患者接受额外资源治疗的比例将增加近\
    \ 2 倍。⁹\n\n之所以会产生偏见，是因为这台机器被设计用来预测医疗保健费用，而不是疾病本身。医疗资源分配不均现象意味着美国医疗系统在为非洲裔美国人患者提供护理方面的花费比为白人患者提供的要少。因此，对于非洲裔美国人和其他较难获得医疗服务的患者群体，用医疗费用作为疾病指标的预测机器会低估他们患病的严重程度。\n\
    \n在这项研究之后，穆来纳森对这两个项目进行了反思。\n\n这两项研究都记录了种族不公：在第一项研究中，一个有类似黑人名字的申请者得到的面试机会较少；在第二项研究中，黑人患者得到了较差的护理。\n\
    \n但它们在一个关键方面有所不同：在第一项研究中，招聘经理做出了有偏见的决策；而在第二项研究中，罪魁祸首是一款计算机程序。\n\n作为这两项研究的合著者，我把它们看作对比性的经验，它们共同展示了两种类型偏见之间的鲜明差异：人类偏见和算法偏见。¹⁰\n\
    \n早期的研究需要大量的创造力和努力来发现歧视。他将其描述为一场持续数月的“复杂秘密行动”。\n\n相比之下，后来的研究较为简单。穆来纳森将其描述为“一次统计学的练习——相当于反复问算法‘你如何对待这个患者？’，并绘制出种族差异的图景。这项工作是技术性的和机械化的，既不需要秘密行动，也不需要足智多谋”。\n\
    \n衡量人类的歧视是困难的，需要对不同情况进行仔细把控。衡量机器的歧视则相对简单，只需将正确的数据输入机器，然后观察结果即可。研究人员可以向人工智能提问，“如果一个人是这样的会怎样？”\
    \ “如果一个人是那样的会怎样？” 可以尝试成千上万种假设，这是人类所无法做到的。穆来纳森指出，“人类比算法更难以捉摸”。\n\n## 消除歧视\n\n发现歧视是第一步，一旦发现歧视，就需要消除它。人类很难改变，因此，你需要一个不依赖于人类的系统。\n\
    \n在简历案例中，即使你能克服困难找出哪些公司有问题，但是“改变人们的想法并不是一件简单的事情”。¹ 能不能找出工具发现隐性偏见仍然不好说，我们不知道是否有可行的解决方案可以减少成千上万人的歧视。20\
    \ 年后，叫 Emily 和 Greg 的人可能仍然比叫 Lakisha 和 Jamal 的人更容易被雇用。\n\n与之形成鲜明对比的是人工智能。在发表有关算法性歧视的研究成果之前，穆来纳森和其合著者已经与公司合作解决了这个问题。他们首先联系了该公司，该公司能够用模拟重现研究结果。作为第一步，结果表明，将健康预测与现有的费用预测结合起来，可以将偏见减少\
    \ 84%。² 穆来纳森和其合著者免费向一些使用这类算法的医疗系统提供了他们的服务。许多医疗系统接受了他们的帮助。\n\n齐亚德·奥伯迈尔和他的同事在学术研究中得出结论：“标签偏见是可以被消除的。因为标签是预测质量和预测偏见的关键因素，仔细选择可以在最大限度减小风险的同时享受算法预测的好处。”13\
    \ 正如穆来纳森所说，“改变算法比改变人类更容易：计算机上的软件可以更新，而迄今为止已经证明我们大脑中的“湿软件”没什么可塑性”14。\n\n## 人工智能盒子内部\n\
    \n人工智能容易受到偏见的影响，这可能意味着弱势群体会受到比其他人更差的待遇，换句话说，人工智能可能成为歧视的源头。\n\n人工智能也可以减少歧视，它们可以发现人类的歧视行为，就像检测到膝盖疼痛一样。它们也是可以审查的。相比人类，通过算法发现歧视要容易得多。\n\
    \n人工智能的歧视也是可以被消除的。软件可以进行调整，从而消除已经确定的偏见来源。\n\n消除这种歧视并不容易。第一，需要愿意消除偏见的人类。如果管理人工智能的人希望部署一种具有歧视性的人工智能，他们将很容易做到。同时，由于人工智能是软件，它的歧视可能大规模发生，因此，捕捉到故意歧视的人工智能比捕捉到故意歧视的人类更容易。人工智能会留下审查记录，一个资金充足、有着受过良好培训审查员的监管机构可以访问人工智能并进行模拟，以寻找歧视，就像穆来纳森和其合著者所做的那样。不幸的是，我们当前的法律和监管系统很难应对这些挑战，因为它们是为没有算法辅助的人类决策者设计的。15\n\
    \n第二，即使是由心怀善意的人部署的人工智能，也需要关注细节，而关注细节需要耗费时间和金钱。偏见以多种方式渗透到人工智能的预测中，消除偏见需要了解其源头。16\
    \ 这需要投资存储有关过去决策的数据，并投资模拟潜在的偏见来源，以了解人工智能的表现。第一次尝试也许不会成功，可能需要收集新的数据和采用新的流程。17\n\n\
    第三，减少偏见的人工智能可能会改变一个组织中的决策权。如果没有人工智能，也许是个别经理决定谁应该被雇用。即使是有最好的意图，这些经理也可能通过他们的社交关系进行招聘，从而导致意想不到的偏见。有了减少偏见的人工智能，通过社交关系进行招聘将变得困难。更高级的高管将设定简历的门槛，该高管可能意识到，如果公司的所有经理都通过他们的社交关系雇用员工，就不可能有多样化的工作团队。人工智能减少了歧视，但相对于高级管理层设定的目标，它也减少了个别经理在招聘中的自由裁量权。因此，这些经理可能会反对削弱他们权力的系统变革。\n\
    \n并不是每个人都想要减少偏见。2003 年，美国职业棒球大联盟使用了一种名为 QuesTec 裁判信息系统的新工具来确定本垒上方的投球位置。QuesTec\
    \ 评估了裁判员所判的好球和坏球。裁判员反对这个工具，一些明星球员也是如此。时任运营副总裁的桑迪·奥尔德森描述了这个工具的动机，他声称一些资深球员会毫无原因地被给予信任，获得对他们有利的好球和坏球判罚。许多比赛的明星球员也都抱怨，包括屡屡获奖的投手汤姆·格拉文和多次获得\
    \ MVP（最有价值球员）奖的巴里·邦兹。当时的亚利桑那响尾蛇队王牌投手柯特·席林成为一个现代版的“卢德派”，在一场比赛失败后摔坏了一个摄像机。18 一个由计算机预测好球与坏球的自动化工具可能会减少偏见，但那些从偏见中受益的人可能并不希望这样。\n\
    \n## 需要一个系统\n\n亚马逊雇用了大量员工。在美国，每 153 名工人中就有一名是亚马逊员工。19 因此，亚马逊非常有兴趣开发一种能够辅助其招聘的人工智能。2014\
    \ 年，亚马逊做到了，但仅一年后，它便废弃了这个系统，再未投入使用。为什么呢？因为它没有以一种性别中立的方式评估软件和技术岗位的求职者。20 众所周知，亚马逊的人工智能是基于过去的数据进行训练的，而这些数据主要来自男性求职者。这个人工智能明显忽略了与女性相关的信息，包括女子学院的信息。简单的调整无法恢复中立性。\n\
    \n读到这样的故事，你可能认为人工智能的偏见是无可救药的。但是，你也可以从这个故事中得到另一种解读，那就是人工智能是有偏见的，人们认识到了这一点，所以它没有被投入使用。那么对于人类招聘员来说也是如此吗？实际上，我们已经知道答案：这个人工智能最早就是针对招聘人员进行训练的。\n\
    \n与此同时，这种经验也告诉人工智能开发者，仅依靠过去的数据进行训练通常是不够的，他们应使用新的数据来源，而这需要时间来开发。但最终，得到的人工智能是可以进行评估的，更重要的是，我们可以不断检测其性能。\n\
    \n这对于消除歧视来说是一个潜在的重大进步。今天消除歧视的干预措施主要是以结果为基础的：不同群体的结果之间是否存在差异？这些干预措施往往是直接的规则，试图调整平衡并实现结果的平等。问题在于，这些干预措施可能会产生分歧。\n\
    \n相比之下，人们通常希望消除偏见的源头，特别是做出决策的人的动机。他们并不是想要解决结果平等问题（尽管实现这一点并不是问题），而是希望得到平等的待遇。然而，当人们做出决策而我们无法看到他们的动机时，我们要如何确信存在平等的待遇呢？\n\
    \n如果人工智能预测成为这些决策的核心，我们就能实现一个客观的基准。我们可以看到人工智能是如何对待人类的，因为我们知道人工智能没有明确的动机来区别对待那些类似的人，我们可以努力确保人工智能真正做到这一点。\n\
    \n自动化预测让制定标准变得更容易，就像所有的棒球运动员都能面对相同的击球区，所有的司机都可以遵守相同的交通规则一样。交通执法中存在着有据可查的偏见，如黑人司机被拦截的次数比白人多。一个简单的点解决方案是将超速罚单自动化。我们有这样的技术：检测超速，拍照，然后对司机进行处罚。自动化系统更加公平和安全，减少了警察与公众之间发生暴力冲突的机会。\n\
    \n这种做法的好处远不止点解决方案。有了人们会被平等对待的信心，人们与系统的互动方式以及他们在系统中行动的安全感都会发生改变。这也使人们不再需要那些只是为了在账面上好看而进行的干预措施，比如让结果成为固定的一部分，甚至是配额。\n\
    \n然而，消除不平等待遇并不是一帆风顺的，这正是因为它将改变系统中的结果，并不是每个人都会想要一个自动化的系统。就像明星棒球运动员一样，那些从警察自由裁量权中受益的司机可能会对监控摄像头心存怨恨，有些人可能很难支付罚款。此外，如果有人因医疗急救情况超速驾驶，自动化系统也不会宽容。除了超速，警察不能通过拦截来发现其他违法行为。\n\
    \n尽管如此，超速仍会致命，让司机保持在限速以下行驶能够拯救生命。但有时执法是不公平的，而且往往具有歧视性。自动化执法将会发现更多违规和违法行为，同时减少歧视。²¹\n\
    \n当人工智能作为点解决方案实施时，它们可能会放大现有的偏见并增加歧视。这导致了我们在媒体上看到的有关人工智能和歧视的负面报道。当把人工智能视为一个点解决方案时，人工智能的偏见就是一个问题，并可能对采用预测机器产生适当的抵制。\n\
    \n当从系统的角度看待偏见时，人工智能可以引领减少歧视的变革。虽然从现有偏见中受益的人可能会抵制，但我们仍有理由保持乐观。与穆来纳森一样，我们也看到了人工智能在减少各种决策偏见方面的潜力。对人工智能的乐观态度掩盖了对人类决策的悲观情绪，人类和人工智能都会有偏见。在一次关于医疗保健领域中机器学习偏见的演讲后，麻省理工学院的计算机科学家马尔泽·加塞米说道，当涉及偏见时，“人类是糟糕的”。22\
    \ 人工智能的偏见可以被发现和解决；可以设计和实施新的人工智能系统解决方案，涵盖教育、医疗保健、银行和警务等各个领域，以减少歧视；可以对人工智能系统进行持续监测和追溯，以确保在消除歧视方面不断取得成功。如果人类也能如此轻松地消除歧视，那该有多好。\n\
    \n## 本章要点\n\n- 关于人工智能的流行说法是，它学习人类的偏见并放大了它。我们同意这种说法并主张时刻保持警惕。另一种说法是人工智能系统不应该被应用于重要决策，比如招聘、银行贷款、保险理赔、法律裁决和大学录取等，因为它们是不透明的——我们无法看到黑盒子内部——并且它们持续产生歧视，我们不同意后者说法。我们认为它们应该被应用于重要决策，正是因为它们具备可审查性，而我们人类没有。对于一个我们怀疑有歧视行为的人类招聘员，我们无法有效地审问其成千上万个问题，比如“除了不是白人，其他条件完全相同，你会雇用他吗？”并期望得到诚实的回答。然而，对于人工智能系统，我们可以准确地问出这个问题，以及成千上万个其他问题，并迅速获得准确的答案。\n\
    \  - 芝加哥大学塞德希尔·穆来纳森教授对比了他关于偏见的两项研究。其中一项是关于人类在招聘中的歧视，另一项是关于人工智能在医疗保健中的歧视。他指出，与人类系统相比，发现和消除人工智能系统中的歧视要容易得多，“改变算法比改变人类更容易：计算机上的软件可以更新，而迄今为止已经证明我们大脑中的“湿软件”没什么可塑性”。\n\
    \  - 如今，最抵制采用人工智能系统的人恰恰是最担心受到歧视的人。我们预计这种情况将完全逆转。一旦人们意识到在人工智能系统中发现和消除歧视比在人类系统中更容易，采用人工智能系统所面临的最大阻力就将不再是来自那些想要减少歧视的人，而是来自那些从歧视中获益最多的人。\n\
