    此，如果目前机场的候机成本较低，那么这些应用程序的价值就会降低。


    安检预测则是另一回事。机场声称希望缩短安检时间并减少不确定性。但作为经济学家，我们认为机场的动机与乘客并不一致。缩短安检时间的确可以留出更多时间，机场希望乘客在通过安检后去消费。但与此同时，这将减少不确定性，从而乘客可以不那么早到达机场。叠加人工智能解决了乘客到达航站楼的其他不确定性问题，机场会想在其可控制范围内消除不确定性吗？


    # 顺应规则


    从更广泛的角度来说，我们的观点不仅适用于机场，也适用于规则。规则的产生是因为承受不确定性的代价很高，但规则也会带来一系列问题。


    科技作家克莱·舍基提出的所谓“含基原则”指出，机构会努力维持与其解决方案相对应的问题。企业也是如此。如果你的业务是为候机的人们提供帮助，那你为什么要确保他们不需要候机呢？


    如果你希望通过人工智能技术创造新的决策机会，你就需要冲破那些保护规则免受不确定性后果影响的壁垒，然后去寻找更容易承担这些成本的活动，或者减少规则必须容忍的不良后果。


    我们可以在英国农民长期采用的保护措施中看到这一点——修建树篱。树篱是一种需要精心规划种植的坚固树木和植物，常被用作田地之间的隔离墙。如果你的田地里有家畜，并且不想雇人来确保它们不会走失，那么树篱是非常有用的；如果你不想让暴雨过快地侵蚀土壤，或者想保护农作物免受强风侵袭，那么树篱也是很有用的。采取所有这些降低风险的保护措施就是“对冲”一词的起源，我们对此丝'
  - '[PAGE 82]


    毫不感到意外，后来该词的含义逐渐演变，在保险方面有了更广泛的意义。


    但修建树篱也是有成本的。通过划分农田，它们让某些耕作技术（包括机械化）只有在大面积土地上才能有效使用。二战后，英国政府实际上对清除树篱采取了补贴措施，尽管在某些情况下，由于树篱在风险管理中的作用，这种清除是过度的。如今，在威尔士亲王（现英国国王查尔斯三世）的领导下，出现了一场恢复树篱的运动。12


    在许多情况下，大量投资会被用来保护潜在的决策者免受风险影响。数千米的公路都被防护栏围住，以防止车辆冲下堤坝、山丘或进入逆行车道。幸运的是，大多数情况下它们没有被用到，但每一个防护栏都使道路以更安全的方式建设，因为人类驾驶员有时不太可靠。


    更宽泛地说，建筑规范精确规定了各种措施，以保护建筑物内的人员免受不确定事件的影响。这些事件包括火灾，以及天气、建筑地基和其他自然现象（如地震）造成的损坏。


    这些保护措施的共同点是，它们通常产生了看似过度设计的解决方案。它们被设计用于特定的事件——一生罕见的暴风雨或百年一遇的洪水。当这些事件发生时，这些工程似乎是值得的；但在没有发生这些事件的情况下，我们就有理由去怀疑工程的必要性。多年来，《魔鬼经济学》的作者史蒂芬·列维特和史蒂芬·都伯纳指出，飞机上的救生衣和救生艇（更不用说安全演示）似乎是一种浪费，因为成功降落在水面上的飞机非常少。13
    然而，2009 年，萨伦伯格机长成功地将一架引擎失灵的美国航空公司的飞机降落在哈得孙河上。这个低概率事件的例子是否表明预防性救生衣是必要的呢？这很难说。但我们不能因为不存在某种可能的结果，就认为该结果的概率为零。


    列维特和都伯纳的主要观点是，在采用保护措施时，尽管通常可'
