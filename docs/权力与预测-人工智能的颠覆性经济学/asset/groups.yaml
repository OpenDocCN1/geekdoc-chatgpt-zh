    但是，通过对整个系统的观察，我们了解到有比节省成本更大的好处。农民通过遵守很多规则来最大限度地减少虫害问题，包括种植抗害虫农作物、保持小型温室以便检查和以特定方式调节气候条件等。能够放宽这些规则是具有实际价值的。如果虫害预测的人工智能足够精准，那么温室可以通过不同的方式运作。农民可以种植易受害虫侵袭的农作物、建造更大的温室，可能会出现节能的替代策略。如果像
