    # ## 本书主要内容


    这本书的目的是开启人工智能系统解决方案之路。我们所关注的重点是决策和预测在其中所起的作用。


    在第一部分，我们讨论了三位企业家的寓言，并介绍了在“中间时代”开发和部署人工智能所面临的挑战，这些挑战可能与电力以及过去其他通用技术所遇到的问题类似。为了更好地理解这些挑战和机遇，在第三章中，我们重温了《AI
    极简经济学》的主题，并描述了人工智能的核心是如何与预测相关的。


    在第二部分，为了证明对于预测来说，仅靠点解决方案是不足以产生高价值的，我们深入探讨了决策过程。我们探索了三个普遍的主题。第一，做决策是困难的。相较于简单地遵循规则，它涉及认知成本。决策的好处在于能够根据新信息改变行动。当没有预测时，这些好处就不明显了。第二，人工智能预测可能会打破遵循规则的做事方式，让人们去做出决策，而规则和保护组织免受不利后果影响的相应措施可能会掩盖不确定性。因此，很难确定在哪里应用人工智能，因'
