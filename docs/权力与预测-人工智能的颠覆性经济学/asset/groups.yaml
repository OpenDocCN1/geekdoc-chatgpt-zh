    感染。公共卫生官员用了一个最古老的方法来预测人们是否可能被感染——接触者追踪。如果你与一个感染者接触了，那么你被感染的可能性就会更大。这种接触者追踪可以帮助官员预测最近可能被感染的人。在许多国家，这是一个耗时、费力且充满不确定性的过程，官员需要打电话给感染者，并询问他们去过哪些地方。在韩国，公共卫生部门开发了新的程序，将闭路电视摄像头、信用卡和手机的数据结合起来，辅助接触者追踪工作。³


    创新并不仅限于接触者追踪。人工智能专家还开发了预测传染性的工具。有一个团队开发了一种工具，通过让人们对着手机咳嗽来检测是否为无症状感染。⁴ 在希腊边境，一种集合旅行方式、出发地点和人口统计信息等因素并每周更新的人工智能工具，所检测到的无症状感染者是随机检测的
    1.85 倍，这有助于确定哪些旅行者不需要接受进一步检测就可以入境。⁵ 非人工智能的预测工具也被开发了出来。许多地方使用热像仪和温度计来检测人们是否发烧，认为体温升高的人更有可能感染了新冠病毒。在泰国，人们训练狗来嗅出人体中的疾病。⁶


    到了 2020 年秋季，很多地方已经意识到快速抗原检测是预测传染性的最有效工具。虽然 PCR（聚合酶链式反应）检测同样可以检测到少量病毒，但与快速抗原检测相比，其速度更慢、费用更高。⁷


