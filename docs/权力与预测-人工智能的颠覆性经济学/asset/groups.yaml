    ## 模块化的价值


    模块化是一种围绕着由人工智能预测驱动的决策而建立的屏障，以避免该决策与组织内其他决策不一致所带来的成本。模块化降低了协调成本，但如果驱动了一个决策的人工智能预测，同时也让其他决策以类似的方式进行的话，则可能会牺牲协同效应。在无法协调的情况下，模块化会使某些决策从人工智能中受益，而使其他决策免受可靠性降低的影响。


    赫伯特·西蒙是唯一同时获得诺贝尔经济学奖和计算机科学图灵奖的人，他曾经讲述了一个关于组织应对更复杂情况的寓言故事。4在这个寓言故事中，有两家制造高质量手表的制表商。两家制造的手表都供不应求，经常接到新客户的询价。其中一家生意兴隆，而另一家却日渐衰败。为什么会这样呢？


    手表由上千个零件组成。一种方法是一次性组装每一只手表，这样可以提高手表的质量。如果制表师在制作过程中被打断（比如另一个客户来访），他们就必须从头开始组装。另一种方法是将手表分解为较小的部件，每个部件约有
    10 个零件。然后将它们组装在一起，这可能需要花费更多的时间，而且最终的成果可能没有那么完美。但这样做的好处是，如果制作过程被打断，那么损失的只是一个小部件。最终，这是一个更快的过程，使制表师能够制作更多的手表。第二种方法被称为模块化，它更具弹性和可扩展性，特别适用于更复杂的产品。5


    如果你要一次性做完所有事情，就必须协调所有的决策，一些错误要求可能会导致问题的产生。相比之下，如果你可以将自己的工作组织成模块，那么各个部分就可以独立进行，而不必考虑其他地方的情况。这并不意味着它们的工作对于最终结果没有影响——如果一个模块无法完成工作，那么整个产品就可能会失败。但这意味着一个较大的问题会变得更小、更易管理。


    另一个优势来自系统对模块中变化的适应能力：模块可以改进自身而不干扰系统的其他部分。也就是说，我们可以对模块进行创新。


    历史上有很多例子表明，模块化使创新变得更容易。例如，当我们从模拟电话转向数字电话时，只需更改拨号设备，而无须改变网络本身。但在其他时候，由于缺乏模块化，创新受到限制。当飞机从螺旋桨升级为喷气式发动机时，工程师认为飞机的机身结构可以按照以往的方式生产。然而，新发动机产生的振动非常不同，整个飞机结构不得不重新设计。这就降低了转型的速度。6


    模块化为餐厅提供了采用人工智能，而不受人工智能牛鞭效应影响的机会，但这并不是它们自己可以决定的。如果一家餐厅想要更换菜单，其供应商就需要拥有自己的模块化系统来处理需求的变化。在我们的例子中，由于整个行业的需求变化，牛油果的供应受到了限制。如果在许多地区都有足够多的餐厅得到供应，即使个别餐厅的需求变化很大，总体上也会更加稳定。规模可以为供应链中的模块化提供机会。一般来说，对于人工智能的采用，模块可以帮助解决因决策


    ### 设计的价值


    如果所做的决策不需要与系统中的其他决策保持一致，那么采用人工智能来做决策将会更容易。这是一个程度的问题。当然，从概念上讲，整个系统能够一起运作会更好。问题是，如果这种情况无法实现，是否有可能获得人工智能所带来的好处，且这种好处大于其他地方可能出现的任何成本。


    为了理解这一点，我们可以考虑亚马逊的运营方式，它向全球供应数百万种产品。亚马逊会采购这些产品，将其存储在仓库中，接收客户订单，并向客户发货，它还会帮助客户弄清楚要购买什么，即为客户提供推荐产品。


    从概念上讲，亚马逊所面临的问题与我们餐厅的问题类似。它希望能够在客户需要时向其提供所需产品，但产品并不会神奇地出现。供应链跨越数千千米和数月时间。因此，如果无法及时供应向客户推荐的产品，那该怎么办呢？


    人们很容易想到的解决办法是：不要推荐。如果你没有现货，就不要向客户推荐该产品。但这种方法存在一个问题：你如何得知客户真正想要的产品无法供应？如果你只推荐你有的产品，你就会错过发展和壮大的机会。


    这就是为什么亚马逊会推荐经常缺货或需要很长时间才能到货的产品。亚马逊会向客户通知可能出现的延迟，从而协调决策。客户很可能会选择有存货的产品，但偶尔也会选择其他产品。然后，亚马逊会了解需要投入多少成本来为这些产品建立库存。


    实现这种平衡需要精心的设计。亚马逊拥有一个模块化的组织，这使其能够将更好的人工智能预测融入推荐中，同时最大限度地减少对整个组织其他部门的影响。但如果走得太极端，那就太过了。因此，它所做的库存和订购选择不能完全独立于人工智能推荐的运作方式，因为客户的选择和反应会产生需要物流部门进行沟通并采取行动的信息。


    采用人工智能通常需要一个系统解决方案来找到模块化和协调性之间的最佳平衡。模块化使决策免受人工智能带来的变化性影响。它降低了可靠性的重要性。相反，协调性直接导致了可靠性。成功的人工智能系统在可能的情况下实现协调，在必要的情况下实现模块化。


    ## 航行系统


    帆船制造商和船员已经把他们的技艺打磨了五千年。即使商业航运不再依赖风力推动，创新也从未停止。美洲杯赛的冠军赢得了帆船比赛的最高奖项，也是国际体育界最古老的奖杯。比赛既要看帆船技术的发展，也要看船员的技能。


    船舶设计耗资数百万美元。由于人们对风、水和船的物理学原理已经了如指掌，因此竞争对手在建造船只之前就利用模拟器确定了最有效的设计。模拟器使航海者能够在没有实际建造船只的情况下进行测试。这就使拥有最好模拟器的团队有了优势。新西兰队在
    2017 年利用其模拟器获胜。


    当船队为 2021 年的比赛做计划时，它们想知道是否可以加快设计过程。它们与全球咨询公司麦肯锡合作，发现了创新的主要瓶颈：人类船员。人类在模拟器中航行是需要时间的，无法加快人类对模拟航行条件及船只的反应速度。


    利用类似击败世界顶级围棋选手的人工智能技术，船队教会了一台预测机器航行。它们不需要管理船员。这个机器人不需要睡觉或进食，在人类船员只能模拟几次的时间里，它可以运行数百次模拟。8周后，人工智能开始在模拟器中击败人类船员。


    这时，事情开始变得有趣。人工智能船员开始教授人类船员新技巧。以前，船舶设计的创新是以人类的速度进行的，如果需要学习如何最佳地使用新设计的船舶，那么这个过程可能会持续几个小时、几天或几周，因为人类船员需要尝试不同的方法并进行学习。


    相比之下，人工智能可以尝试不同的船型和比赛策略。它加快了设计迭代的周期，并让针对新设计的特定航行动作得以开发。然后，一旦人工智能找到了更好的解决方案，人类船员就可以从人工智能船员那里学习并复制新技巧，用于驾驶模拟船只。正如一名船队成员所说：“加速学习过程是非常有价值的，既能让船队尽可能多地探索设计空间，又能让船员在给定的设计下最大限度地发挥水平。”
    8 新西兰队在比赛中以七胜三负的成绩赢得了冠军奖杯。


    在这个人工智能系统解决方案的例子中，人工智能导致了不止一个决策的变化。具体而言，比赛准备涉及两类决策：一类是关于船舶设计的决策，另一类是关于航行操作的决策。长期以来模拟器一直用于船舶设计，人类则一直负责掌握航行操作。人工智能船员实际上没有驾驶船只参加比赛，人类仍然驾驶真实的船只。但是，人工智能加快了创新过程，使船舶设计和航行操作协调得更好。模拟船只和人工智能船员的完整系统使两者都得到了改进。


    ## 系统孪生


    帆船模拟器是“数字孪生”的一个例子，它是物理对象或系统的虚拟表示。数字孪生提供的信息代替了物理资源，通过适当的传感器，它们实现了实时监测和预测性维护。这些虚拟表示还可以做更多的事情。它们提供了系统层面模拟的框架。埃森哲公司将其称为“无风险的创新游乐场”。10
    正如数字孪生研究所的执行董事迈克尔·格里夫斯所说：“系统不是一下子就形成的。它们要经历创造、生产、运行和废弃的生命周期逐步发展。对于‘纯物理’的系统而言，这就是一个线性发展过程。而数字孪生允许更多的迭代和同步发展。”
    11


    结合人工智能，这为设计一种新的做事方式创造了机会。正如新西兰队在为 2021 年美洲杯赛做准备时发现的那样，模拟系统使船队能够找到协调决策的最佳方法，如船舶设计和航行操作。通过这种方式，它们可以减少试错。12
    当管理者就如何改变系统提出想法时，就可以模拟该想法的影响，而无须建造机器或面对运营停工的风险。


    模拟还可以侧重于人工智能的实施。如果在系统的某一部分添加了预测机器，那么模拟可以帮助确定其他需要协调的决策，或者如何使系统更加模块化。


    系统之所以复杂，是因为它们是相互影响的决策的组合。想象一个只有一个二进制决策的系统：松开帆（L）或收紧帆（T），则只有两种选择：L、T。现在，想象第二个决策对第一个决策产生影响：保持直行（S）或向右倾斜（R）。现在有
    4 个选项，分别是：LS、LR、TS、TR。现在想象有第三个决策，即添加另一个帆（A）或不添加（N），它取决于前两个决策。现在有 8 个选项，分别是：LSA、LSN、LRA、LRN、TSA、TSN、TRA、TRN。


    在第一种情况下，我们有 2¹ = 2 个选项；在第二种情况下，我们有 2² = 4 个选项；在第三种情况下，我们有 2³ = 8 个选项。当我们有 10 个相互影响的决策时，我们有
    1024 个选项，而 20 个相互影响的决策则会产生 1048576 个选项。帆船比赛可能涉及数百个需要协调的决策，而且很快就会出现比可观测宇宙中的原子数量还多的选项。


    这里的关键是，决策相互影响的系统会迅速变得非常复杂。这一重要见解为模拟在系统设计中产生如此大的影响奠定了基础。它利用了我们在第三章中讨论过的相同见解，即为什么人工智能在玩游戏方面如此成功：模拟新数据相对容易。虽然对所有选项进行实验以找到最佳选项的成本很高——在某些情况下，物理上是不可能的，但我们可以使用数字资产（包括物理环境的数字孪生）来模拟不同的选项，并使用人工智能预测每个选项的结果。因此在数字世界中，我们可以探索比在物理世界中更多的选择，同时，相较于在没有模拟时可能做出的选择，我们找到更好组合的机会将更大。


    虚拟新加坡是对新加坡地形、水体、植被、交通基础设施和建筑物的模拟，甚至包括城市中的建筑材料。这种数字孪生是一种工具，使管理者能够模拟一个人工智能系统解决方案，并避免一些代价高昂的失败。开发该模型耗费了数千万美元。该模型使规划者能够评估新公园或建筑物对交通和人群的影响，并探索蜂窝网络的覆盖范围。它还可以用于评估添加预测机器对新加坡市民和居民生活的影响。例如，人工智能可以更好地优化公共交通。该模型可以评估该优化是否需要对交通管理进行额外的更改，换句话说，它可以评估公共和私人交通系统能否被模块化处理或需要进行协调。¹³
    然后，通过采用模块化或确保必要的协调性，它可以开发出一个更好的人工智能交通系统。


    韩国的斗山重工和微软共同开发了一个风力发电厂的数字孪生系统，它体现了模拟系统的各种优势。¹⁴ 该模拟将基于物理的模型和机器学习结合起来，以预测发电厂每台涡轮机的产量。通过比较涡轮机的预期产量和实际产量，操作员可以对控制进行微调并优化产量。同时，该孪生系统还促进了整个风力发电厂设计和开发的创新，并提高了可靠性。此外，它还能实现决策的协调。对能源产量的准确预测使斗山能够增加对能源电网运营商的产量承诺，同时避免因未能履行承诺而被罚款。它降低了构建系统解决方案的风险，并坚持采用价值较低但更简单的点解决方案。例如，更好的预测使决策者能够决定哪些涡轮机应该运行，哪些需要维护。这反过来又使公司能做出决策来履行对能源电网的承诺。


    ## 适用于人工智能的系统


    模拟并不是构建人工智能驱动系统的唯一方法，但它展示了一些机会。通过为决策者找到正确的协调方式，新西兰队找到了取得胜利的途径。如果系统是模块化的，则可以采用人工智能，但如果能进行协调，其影响可能会更大。挑战在于要找出所需的协调类型。


    ## 本章要点


    - 决策并不是在真空中运作的。通常，一个决策的结果会影响其他多个决策或行动。这就是为什么有时我们使用预定的决策（规则）而不是实时决策，因为规则增强了可靠性，所以我们接受了更差的局部决策，以换取整个系统的更强可靠性。可靠性是相互影响的决策系统的一个关键特征。


    - 针对引入人工智能决策而导致的可靠性降低问题，有两种主要的系统设计方法：协调和模块化。协调包括确定总体目标，然后设计信息流、激励机制和决策权，以使系统中的每个决策者都拥有优化总体目标的信息和激励措施。模块化是围绕人工智能决策建立的一道屏障，以避免该决策与组织中其他决策不协调所带来的成本。模块化降低了协调成本，却损失了协同效应。


    - 系统是相互影响的决策组合。请考虑一组相关的二进制决策：3 个相互影响的决策会产生 8 种不同的组合，10 个相互影响的决策会产生 1024 种组合，而
    20 个相互影响的决策会产生 1048576 种组合。决策相互影响的系统可以迅速变得非常复杂。这就是模拟对于系统设计影响巨大的原因。我们可以使用数字孪生来模拟不同的组合，并使用人工智能预测每种组合的结果。


    ## 第十七章


    ### 白板


    想象一下你去做体检，医生对你说：“你在三年内生重病的概率很高，感谢您前来就诊。”然后医生走出去，开始诊断下一个病人。你肯定会目瞪口呆。为什么他不告诉你是什么导致你生病？为什么他不解释你可以做什么来降低生病的概率？


    虽然这个故事似乎让人难以置信，但在保险行业中却每天都在发生。保险公司会对一些人收取比其他人更高的保险费。为什么？因为它们预测某些客户相比其他人更有可能遭受损失。保险公司是如何知道谁会面临更大风险的呢？因为它们投入巨资收集和分析数据，以预测客户遭受损失和提出索赔的可能性。


    保险公司处于数据科学的前沿并不奇怪，预测是它们的工作。然而，令人惊讶的是，它们并不与客户共享它们对风险的见解。这些宝贵的信息可以帮助客户降低风险，而不仅仅是为自己投保。


    例如，家庭保险公司正在采用人工智能来生成精准度更高的预测。现在，许多公司能够对风险级别或次级风险级别（例如，电线接触不良所导致的电气火灾风险，漏水管道所导致的水灾风险）进行风险预测。因此，如果一个家庭保险公司预测某位房主会有特别高的电气火灾或水灾风险，那么该公司与其因为该房主提出索赔的可能性很高而向他收取高额的保费，还不如与客户共享这些信息，以便客户采取行动，从而降低风险。这类客户可以投资购买低成本的设备，以尽早发现严重火灾或水灾的隐患。保险公司甚至可以决定补贴这些风险缓解工具，因为预期损失的减少可能超过设备的成本。


    令人惊讶的是，很少有保险公司在这个领域取得显著进展。相反，大多数保险公司将精力集中在构建和部署增强传统核保预测的人工智能上。它们正在建立点解决方案。为什么大多数保险公司没有抓住机遇来更好地服务客户，将业务模式从集中客户风险和将客户风险转嫁给承保人，转变为降低客户风险呢？可能是因为代理人不喜欢这种方式，因为降低风险意味着较低的保费，这可能导致收入减少。但总体而言，这似乎会为客户创造重要的价值。


    在许多情况下，保险公司没有充分意识到这个机会，因为它超出了正常的业务模式。除了对代理人的激励措施，该行业还有许多商业规则、政府法规和行事方式，从局外人的角度看可能是显而易见的，但从内部人士的角度却很难看到。因此，我们提出了白板方法。为进一步阐释这一方法，我们来介绍人工智能系统探索画布。


    ### 像经济学家一样思考


    作为经济学家，我们的一项技能是将令人兴奋和难以理解的事物解构为乏味和可理解的内容。虽然这使我们不太适合参加派对，但它有时确实使我们能够发现那些被他人忽视的东西。我们设计了一个框架，帮助你做到这一点。人工智能系统探索画布对于你想要发展系统思维以评估人工智能的价值是有帮助的。


    在本章中，我们将为你提供一个工具，你可以用它在一块白板上进行探索。具体而言，如果你拥有高精度的预测机器，为了达成目标，你需要在你的行业中做出基础的重要决策。就其本质而言，人工智能预测将在决策层面进入任何组织。但了解一个决策或决策类型如何影响其他决策，是了解人工智能如何对整个系统产生影响的第一步。


    当你试图评估采用人工智能预测可能导致的颠覆，以及考虑是否需要进行系统层面的创新时，有两个原因使这个练习更有价值。一个原因是，在一个组织中可能有许多规则，一些职能部门可能已经建立起来，以隐藏与这些规则相关的不确定性。白板方法要求你回到第一原则，考虑完成组织任务所需的决策。在这个过程中，其中一些决策可能已经成为规则，并且一些决策可能提供了采用预测的机会，将这些规则转化为决策。（不过，我们将把如何使用白板来达到这种目的的内容放到下一章。）


    另一个原因是，你可以用它来评估特定人工智能解决方案对系统的影响。通过使用一个白板，你可以从更宽泛的角度来看待受人工智能预测影响的决策如何与组织的其他决策或规则互动。在本章中，我们将展示白板方法的用处，来评估特定人工智能解决方案对系统的影响。


    以保险业为例，一些企业家开发了应用程序，由用户自己拍摄受损的汽车或房屋，公司使用这些照片来计算索赔金额，并即时支付维修费用。消费者不再需要等待评估员或四处找报价，只需打开应用程序，拍摄一些照片即可。另一种应用程序是监控驾驶或住宅的设备。这些应用程序可以迅速确定你是否正在做有风险的事——不仅告诉你要停止，而且警告你，如果这种行为持续下去，你下个月或明年的保费就会有所不同。


    可以很容易地看出，为什么企业家会针对保险公司提供这些应用解决方案。但问题是它们是否有用？要解决这个问题，首先，你需要理解一个行业（如汽车行业或家庭保险业）的本质。这意味着弄清楚该行业需要做出的决策，以及这种特定的人工智能解决方案是否为其中一个决策提供了信息。然后，你可以制订一个行动计划。是否已经有人负责该决策？有无明显的单一决策者？也许已经存在规则？如果你想将该规则改为决策，那哪些方面可能会被影响？要回答这些关键问题，你需要一个起点。这就是我们要为你提供的内容。


    ### 人工智能系统探索画布


    随着时间的推移，我们逐渐意识到，实施真正变革的人们喜欢在画布上规划他们的方法。画布是一张空白表格，你可以从任何地方开始，但在流程结束时，你必须想好了整个表格的内容。它不是一本按部就班的手册，而是一种组织思维的方式。


