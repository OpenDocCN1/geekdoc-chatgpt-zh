    # 新的创新系统


    创新是一个结构化的试错过程。图 9-1 展示了这个过程在大多数情况下的运行方式。首先，研究机构设定一个目标，并提出如何实现该目标的假设，然后设计并运行一个实验来测试主要假设。通常情况下，实验会失败，并通过失败获得知识和新的假设，其中一个假设会带领实验走向成功。随后，该机构会运行一个试点项目，如果试点成功，那么创新就可以做大规模的部署。


