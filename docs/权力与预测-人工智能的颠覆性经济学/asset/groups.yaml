    +   23. 就所需的剂量、技术、患者检查姿势和投射方法，指导核医学技师或技术人员。

    +   24. 为患者和员工制定并执行辐射防护标准。

    +   25. 制订核医学部门的计划和程序。

    +   26. 监督放射性物质的处理，确保遵循既定程序。

    +   27. 为个别患者开具放射性核素处方和相应剂量。

    +   28. 审查程序申请和患者的病史，确定程序和所用放射性核素的适用性。

    +   29. 向研究生教授核医学、放射诊断学或其他专业课程。

