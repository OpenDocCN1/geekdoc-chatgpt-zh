    Company, July 12, 2011, https://www.fastcompany.com/1766361/im-feeling-lucky-google-employee-no-59-tells-all;
    Nicholas Carlson, “Google Just Kills the ''I''m Feeling Lucky Button,” Business
    Insider, September 8, 2010, https://www.businessinsider.com/google-just-effectively-killed-the-im-feeling-lucky-button-2010-9.
    玛丽莎·梅耶尔（Marissa Meyer）表示：“我认为‘我感觉很幸运’的美妙之处在于它提醒你这里有真实的人。”一位哲学家认为这一切都与谷歌的上帝情结有关——我们没有在开玩笑。请参阅：John
    DurhamPeters, “Google Wants to Be God’s Mind: The Secret Theology of ''I''m Feeling
    Lucky,” Salon, July 19, 2015, https://www.salon.com/2015/07/19/google_wants_to_be_gods_mind_the_secret_theology_of_im_feeling_lucky/.
    我们必须引述这段话：


    主页上两个用于搜索互联网的选项—— “谷歌搜索” 和 “我感觉很幸运” ——是重要的点缀。“我感觉很幸运”是一种主观的表达方式。这不是谷歌在对用户说“你很幸运”，而是
    “我”，以第一人称进入了互联网，同样这也是赌徒的呼喊，他对无法控制的事物低声念咒。谷歌搜索页面是欲望的人口，是人们向之祷愿的宝座。（它的服务器存储着 “需求档案馆”。）“我感觉很幸运”
