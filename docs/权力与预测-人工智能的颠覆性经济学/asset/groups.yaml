    # 第十四章


    # 从概率的角度思考'
  - '[PAGE 197]


    <!-- no content -->'
  - '[PAGE 198]


    2018 年，一辆优步自动驾驶汽车在亚利桑那州坦佩市撞死了一名行人。这是自动驾驶汽车发生的第一起致命事故。据报道，这辆汽车看到了行人但没有刹车。新闻报道援引了普林斯顿大学一位教授的话，“这应该是对所有正在测试自动驾驶车辆公司的警告，让它们检查自己的系统，确保在必要时能够自动刹车”。¹然而，在事故发生当天，坦佩市警察局局长给出了不同的解释：“很明显，根据行人走来的方式，她很难避免这次事故。”
    ²


    优步真的会编程它的车辆去撞人吗？当然不会。但要说车辆没有看到行人，这也是不对的。相反，在碰撞前 6 秒，车辆预测到了一个未知物体的出现，但当车辆预测到这个未知物体很可能是一个人时，紧急制动已经来不及起作用了。³


    换句话说，这两种解释都是错误的，因为它们是确定性的。车辆确实识别出了一个物体，并且有很小概率认为这个物体可能是一个人。如果车辆在更早时预测到这个物体很可能是一个人，它就会启动刹车，事故就可以避免。审查事故报告表明，车辆以极低的概率探测到了人，虽然概率非常低，但不是零。此外，车辆被编程为只要某物'
  - '[PAGE 199]


    体被认为可能是人的概率不是太高，就可以继续前行。这个概率可能是 0.01%、0.000 1%或者 0.000 000 001%，但绝不是零，因为机器不是这样工作的。


    这是一个可怕的结果。一辆自动驾驶车辆看到行人的概率不够高，无法及时刹车，要意识到这是一个错误的决策需要付出更多努力。事故发生后，优步暂停了其自动驾驶车辆项目。当它在
    2018 年 12 月恢复自动驾驶时，该项目发生了变化。车辆速度被限制在不超过 25 英里 / 小时，并且始终配备两名安全驾驶员。另外还进行了许多其他改变，包括由第三方监测驾驶员及不同的自动刹车程序。基于阈值的决策已经不够用了。


    # 赌徒思维


    区分糟糕的决策和结果是很重要的。有时好的决策会导致糟糕的结果。这是职业扑克选手安妮·杜克在她的《对赌：信息不足时如何做出高明决策》一书中的观点之一。截至撰写本书时，杜克是唯一一位赢得
    NBC（美国全国广播公司）全国扑克单挑锦标赛的女性选手。扑克是一种既需要运气又需要技巧的游戏，你可能打出完美的牌但最后却输了，也可能在一手糟糕的牌上下了大的赌注却幸运地赢了。


    当事情变糟糟糕时，杜克认为关键是要进行反思，是决策糟糕还是运气不好。如果只是运气不好，那就把它归类为糟糕的结果，然后继续前进；如果是糟糕的决策，那就吸取经验教训，并在下次做得更好。


    太多的业余扑克玩家一旦得到糟糕的结果，就会改变他们的策略。同样，太多人下的赌注既大又不合理，但却赢了，然后他们根据过去的结果做出下一步决策。杜克把这种习惯称为“结果导向”，久而久之这些玩家就变得越来越差。如果无法辨别一个结果是不是运气'
  - '[PAGE 200]


    造成的，不确定性就会让他们很难去吸取经验教训。


