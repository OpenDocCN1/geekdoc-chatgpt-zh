    样，有一个替代系统可以向我们展示另一种情况。例如，在另一个宇宙，住着一群非常富有的人。他们不乘坐商业航班，因此没有机会接触旧的或新设计的公共机场航站楼。相反，他们乘坐私人飞机并通过私人航站楼出行。一般而言，华丽、迷人、漂亮的餐厅和艺术馆都是富人经常出入的场所。但在机场的世界中，私人航站楼却非常简朴。


    之所以没有投资让私人航站楼变得更好，是因为困扰其他人的不确定性并不困扰富人。若乘坐商业航班，你就必须遵守时间，迟到的旅客将被留在机场；若乘坐私人飞机，你的时间安排会更加灵活，甚至可能不受时间限制。如果旅客没有登机，飞机就不会起飞；如果旅客提前登机，飞机就会提前起飞。整个系统的设计是为了避免候机，至少对于旅客而言是这样的。没有候机就意味着无须投资航站楼让候机变得愉快。与此同时，富人没有关于何时需要离开机场的规定。他们想什么时候离开就什么时候离开。如果更多的人可以有这种体验，那么最好的航站楼肯定比大教堂还要简朴。


    不过，你无须等到变得富有才会看到这个替代系统，只需比较在到达口与登机口处所看到的世界即可。你会发现到达口是简朴的，你可能会找到一些快餐店，但其他一切设施都是为了让你尽快离开机场。特别是出租车和停车设施离机场非常近，即使你可能没有着急赶时间。除了如何最快地离开机场，你还记得机场到达口的其他哪些细节吗？


    # 人工智能对机场的威胁


    机场对人工智能并不陌生。航空交通管制已经采用基于人工智能的系统来更好地预测飞机到达和拥堵情况。目前，荷兰南部的埃因'
