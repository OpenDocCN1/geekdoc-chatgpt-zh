    预测是 Verafin 的业务，由于人工智能是预测技术的巨大进步，像 Verafin 这样的公司必将成为它的早期受益者。银行和其他金融机构过去一直在做预测。审批是它们的业务，这些决策做得越好，它们的工作就做得越出色。而且，它们可以利用能获得的所有信息。事实证明，Verafin
    能够利用数千家金融机构及其客户的交易来学习和完善算法，从而提供信息。这并不是说因为 Verafin 有着近 20 年的经验，在预测方面取得市场领先地位就是小菜一碟。这里的重点是，预测一直是
    Verafin 的业务，而人工智能为它创造了提高竞争力的机会。


    ## 超越预测


    这本书并不是用来讲述像 Verafin 这样的公司的，但 Verafin 非常引人注目，因为它说明了人工智能的采用和影响是一个例外，而不是一个规则。对 Verafin
    来说，一切都很顺利。第一，作为人工智能的主要产出，预测是其业务的核心所在；第二，对于其客户（金融机构）而言，采用 Verafin 的产品几乎不用改变什么，因为预测也是它们业务的核心；第三，这些企业已经在预测的基础上做出了决策，它们知道如何处理这些预测，而且习惯于处理预测错误的后果，因此可以安全地部署人工智能。银行已经准备好进行点解决方案创新。


    最重要的是，Verafin 已经在一个准备好采用人工智能的系统中运作。该系统无须做出改变，也无须创造一个新的决策方式。Verafin 已经为企业提供了预测，这些企业知道它们需要什么样的预测，而且已经为利用这些预测做好了准备，最重要的是，它们能够根据这些预测调整方向。


    对大多数企业来说，现在和未来都可以从人工智能的采用中受益，这将是一个更具挑战性的过程。如果你的企业想采用人工智能，那么很可能需要清理灌木丛，甚至是整片森林，然后才能实施人工智能。本书就在讲述这个清理过程——确定需要改变什么，以及在实施这种改变时将面临的困境和挑战。我们指的是系统变革，而不是你可以在保持既有系统不变的情况下所实施的点解决方案或应用解决方案。了解你要做的是什么，是确定这一切是否值得的关键一步。


    ## 阐明挑战


    《AI 极简经济学》中最常被引用的部分源于一个思想实验：亚马逊使用人工智能来预测消费者可能想购买的商品。当你在亚马逊网站上购物时，从数千万选项中为你推荐的商品会受这些预测的影响。你会浏览它的推荐并购买其中的一些商品，然后这些商品会被寄送给你。从你开始购物到商品送达一般需要几天的时间。


    在这种情况下，如果亚马逊对你想购买商品的预测变得更精准，那么会发生什么？亚马逊将预测你想要什么，然后直接把商品寄送给你，并请你在门口签收或拒绝。这省去了你购物所花费的时间。换句话说，亚马逊根据它的预测向你发货，然后你从送到家门口的包裹里购物。我们称之为从“先购物再发货”到“先发货再购物”的转变。虽然有些人可能觉得商品突然出现在家门口有点儿吓人，但不难想象这可能会非常方便。


    “先发货再购物”是我们设想的一种应用解决方案。它将采取预测的方式，让亚马逊决定是否发货，而不是由客户决定。许多人认为购物是一种负担，所以更精准的预测就提供了一种解决方案，让购物的成本降低。


    虽然亚马逊还未这样做，但它正在进行尝试。它已经申请了“预期发货”（anticipatory shipping）的专利，但其实施方式还有些保守。“例如，它经常向消费者提供订阅产品的选项，而不是主动下单购买。它是如何做到的呢？它会关注你的家庭使用了多少卫生纸，并定期提供该产品。这为亚马逊带来了需求的确定性，同时，它通过给订阅用户提供折扣来为用户节省成本。


    然而，一旦超越思想实验，你就会明白实施“先发货再购物”是一个重大的挑战。如果预测是完美的，这似乎并不是一个麻烦的应用解决方案。但是预测并不完美，而且可能永远不会完美。为此，亚马逊需要用一种方式来回收你拒绝签收的产品。确保产品的安全交付已经很困难了，更别提将它们放在门口等待退货了。退货对消费者来说也是一件麻烦事。因此，如果没有一个几乎零成本的退货系统，亚马逊的“先发货再购物”就很可能无法迈出第一步。事实上，亚马逊已经面临非常多的退货问题，以至于它不再销售退货产品，而是直接将它们丢弃。基于亚马逊现有系统，扔掉退货产品，比将这些产品重新放入物流系统更节省成本。这里的教训是，“先发货再购物”虽然看似是一个应用解决方案，但它需要改变系统的其他方面，才能实现更经济高效的购物方式。因此“先发货再购物”其实是一个系统解决方案，因为它影响到其他关键决策，并需要重新设计亚马逊的系统，以便实现更具经济效益的退货处理方式，而我们撰写《AI
    极简经济学》时并没有意识到这一点。


    ## 现在怎么办


    “好吧，现在怎么办？”这是许多开始采用人工智能技术的企业和组织问我们的问题。这些公司听到了关于人工智能的大肆宣传，并按照我们在《AI 极简经济学》一书中提出的方法，开始了人工智能之旅。这些公司成立了团队来研究这个课题，并确定了利用人工智能所能提供的机会：预测。预测是将现有信息转化为所需信息的过程。正如我们在上一本书中所写的那样，最近的人工智能创新都是使预测朝着更好、更快、更廉价的方向发展。


    如今这些成果已经非常普遍。例如，你的手机应用了很多人工智能技术。当你解锁手机时，它能轻松识别出你的面容，你甚至感觉不到手机在一个安全屏障后面只允许你从前面进入，其根据对你在特定时刻可能有所需的预测，为你展示相关的应用程序。当你在你最喜欢的咖啡馆附近时，是否想要点餐？当你在汽车里时，是否需要导航？手机什么都知道，但它只是在为你提供方便。问题是，目前人工智能预测的红利都已被分食殆尽，企业想问：“难道仅此而已吗？”


    这本书就是对这一问题的答案：不是。尽管人工智能似乎已经无处不在，但就像之前的许多其他突破性技术一样，它才刚刚起步。重要的技术革命，如电力、内燃机和半导体，都是缓慢起步的，花费了几十年才发展壮大。人工智能预测也会是如此，尽管有人认为它代表了某种技术变革加速模式。


    我们不是在坐过山车，任由我们无法控制的力量摆布，我们就在机会旁边——处在“中间时代”。能够回答“现在怎么办”这一问题的人和企业将为人工智能的发展指明方向。


    作为经济学家，我们寻求经济力量来指导我们回答这些问题。简单的经济学认为，预测成本的下降会出现更多的预测应用，然而，我们深入研究了一个事实，即人们和企业做出决策，并不是一个快速发现最佳答案的过程，而是基于深思熟虑、决策过程和决策成本做出的。


    若想要利用预测，你就需要思考如何使用该预测，以及决策者之前在没有该预测的情况下是如何应对的。当你缺少某样东西时，不要放弃，而要想办法进行弥补。如果你没有掌握做出明智选择所需的信息，就要避免自己遭受盲目行动造成的不利后果。因此，当人工智能预测出现时，它带来的机会并不会立刻显现。决策者已经在没有所需信息的基础上建立了一种应对框架。


    这意味着要想确定下一步该怎么做，不仅需要更仔细地研究预测可能带来的效果，还要审视已经建立的阻碍我们提出这个问题的壁垒。我们将对决策进行解构，为你提供一个工具包，让你看到超越人工智能预测的机遇，以及人工智能预测带来的不太明显但可能更重要的机遇。


    ## 本章要点


    - 人工智能的最新进展导致预测成本的降低。我们利用预测来获取已有的信息（例如，过去的金融交易是否存在欺诈行为），并生成我们所需的但没有的数据（例如，当前的金融交易是否存在欺诈行为）。预测是决策的关键。当预测成本下降时，我们就会使用更多的预测。因此，随着预测成本的降低，我们将使用更多的人工智能，机器预测替代品（如人类预测）的价值也将下降。与此同时，机器预测补充物的价值将上升。机器预测的两个主要补充物分别是数据和判断。我们使用数据来训练人工智能模型。我们使用判断和预测来做出决策。预测是一种可能性表达，而判断是对我们想要的东西的表达。因此，当我们做出决策时，我们会考虑该决策产生的每种合理结果的可能性（预测），以及我们对每种结果的重视程度（判断）。


    - 也许人工智能预测的最大误用是把它们所识别的相关性当作因果关系。通常情况下，相关性对于应用来说已经足够。然而，如果我们需要人工智能来确定因果关系，我们就会使用随机实验来收集相关数据。这些实验是统计学家发现因果关系的最佳工具。


    - 在《AI 极简经济学》中，我们介绍了一个关于亚马逊推荐系统的思想实验。我们想象了如果它变得越来越精确会发生什么。起初，该工具在向顾客推荐商品方面会做得更好。随后在某个时候，它跨越了阈值，变得极其智能，以至于亚马逊的人可能会问：“既然我们如此擅长预测客户想要什么，我们为什么还要等他们来订购呢？让我们直接发货吧。”尽管亚马逊在“预期发货”领域申请了专利，但它还没有采用这种新的商业模式。为什么呢？原来的点解决方案（人工智能在现有平台上给出更好的推荐）正在使用当前的亚马逊系统。新模式将要求亚马逊重新设计其系统，特别是在如何处理退货问题方面。目前，亚马逊退货系统的成本很高，以至于丢弃退货产品比将其重新上架出售给其他客户更加划算。这一思想实验中的阈值要求从点解决方案转移到系统解决方案，在《AI
    极简经济学》中，我们没有充分认识到两者的差异。


    ## 第二部分


    ### 规则


    ## 第四章


    ### 决策：做还是不做


    嘘，你想知道一个秘密吗？其实，经济学家并不相信人是完全理性的。一位精打细算的代理人，仔细列出了人们所面临的时间和空间上的所有选择，无论是目标、利润、幸福感还是其他什么，代理人都心中有数，然后做出选择并严格按照计划执行。从表面上看，这种完全理性的代理人往往只出现在经济学家的模型中。然而，经济学家确实在认真对待这些模型的预测。不过他们知道，仅从经验来看，现实中的人们与这种理性形象之间还存在距离。每当人们说“经济学家相信每个人都是理性的”时，经济学家都不以为然，因为他们才不相信。要是信了，那才是非常不理性的。


    尽管如此，把人看作精明且一贯按照利益原则行事的群体，对于理解成千上万人的行为还是有用的。例如，征收烟草税是否会减少吸烟？当然会有影响，如果吸烟成本增加，人们就会减少吸烟。不过能减少多少，以及单凭这一方式是否足够则是另外一回事儿了。你需要了解人们的经历、压力、社交群体以及烟草公司所采用的营销技巧。但对于社会中的许多问题来说，一个很好的起点是意识到人们做出决定是要经过深思熟虑的。


    人们每天都在决定穿什么衣服。无论什么场合或天气，史蒂夫·乔布斯的标志性穿搭就是黑色高领衫和牛仔裤；马克·扎克伯格也穿牛仔裤，不过他选择搭配一件灰色 T 恤；巴拉克·奥巴马在担任美国总统期间，只穿灰色或蓝色西装，他向《名利场》的作者迈克尔·刘易斯解释了原因：


    > “你会发现我只穿灰色或蓝色西装，”奥巴马说，“我试图减少做决策的次数。我不想花时间决定吃什么、穿什么，因为我有太多其他的决策要做。”他提到了一项研究，该研究显示，一个人仅是做个简单的决定就会降低进一步做决策的能力。这就是为什么购物如此耗费精力。“你需要把你做决策的能量集中起来，并使其成为一种日常。你不能被琐事分散注意力。”
    1


    乔舒亚·甘斯非常喜欢一双鞋子，他曾经一次性买断这款鞋子的全球供应（如果你一定要知道数量的话，答案是 6 双），因为他十年内不想再买鞋子了。人们所有这些做法都是为了避免做决策。当人们形成习惯或遵守规则时，会认为再做优化的成本太高，因此决定不做决策。这种情况是无处不在的。试想一下你自己，你会发现你做的大部分决策都不是真正的决策，而是潜在的决策，是那些你可以做但选择不去做的事情。


    在一本关于人工智能的书里提到：要达成目标是一项巨大的挑战。只有在做决策时，人工智能的预测才有用，但不止于此。通常，要想把相互依赖的部分构建成系统，我们会在可靠性方面做投入。你肯定不希望某个部分做出其他部分不希望出现或预期之外的事情，会想让其变得可靠。规则就是用来支持系统的可靠性的。然而，如果人工智能预测打破规则并将其转化为决策，那么后果就是现有系统丧失了可靠性。除非你可以重新设计系统以适应人工智能所带来的决策，否则使用人工智能可能将毫无意义。


    这就是为什么我们要从不做决策开始。我们想要了解为什么我们会这样做，目的是评估采用人工智能是否能改变我们的想法，并将那些潜在的决策转化为真正的决策。正如你将在本章中读到的，我们相信人工智能可以做到这一点，并且可能会给企业调整带来巨大的好处和影响。


    ### 一劳永逸


    不做决策比做决策更轻松。也就是说，不收集、处理信息，不权衡所有选择，不做决策，这当然更容易。经济大体是在这个前提下运行的，尽管我们并不认为他人会按照我们的方式做决策，但经济体系依然会给其他参与者分配决策任务。


    没有人比赫伯特·西蒙更明白这一点了。他不仅因有限理性理论获得了诺贝尔经济学奖，还作为人工智能先驱之一获得了图灵奖。他的第一份工作是在密尔沃基公园的一个部门，那时他发现部门的活动经费没有得到最优分配，人们并没有以经济学家模拟的方式进行优化，这一点随着计算机的到来而得到证实。²
    20 世纪 50 年代，当西蒙试图将新型计算机编程为智能决策者时，意识到了优化的成本。如今，即使我们理解了复杂环境中所需的高级动态计算——但事实上我们并不理解——我们也没有足够的精力解决随之而来的决策问题。由于只能利用有限的计算资源，人们就会像西蒙一样，在这样的计算机条件下将就着使用。


    西蒙巧妙地将“将就”这一词语称为“满足决策”，即不要过分追求完美。与其寻找最优方案，不如采取当下最佳行动方案；与其处理复杂的环境，不如缩小选择范围；与其根据接收的新信息不断更新选择，不如采用不受新信息影响的规则、常规和习惯，从而完全忽略新信息。


    然而，仅指出人们有时会遵守默认规则而不去做决策，虽然这很有趣，但对我们的目标来说是不够的。我们需要了解人们何时会做出决策、是什么决定了特定问题需要遵守默认规则，以及何时要遵守默认规则，而不是以主动的决策来解决它。


    ### 不严重的后果


    两种因素推动着决策的制定：决策后果的轻重和信息成本。我们将信息成本放在一边，此刻先考虑决策的后果。在哲学中，一个常见的观点是，当决策后果不严重时，我们不应该让自己太劳累。最典型的比喻来自法国哲学家让·布里丹，他认为，处在干草堆和一桶水之间的驴子会选择离它更近的那个。要是无法打破僵局并做出选择，驴子就会饿死。我们可以想象，类似的难题会让计算机陷入循环。³
    但是，就我们的目的而言，问题在于相对于决策的后果，做决策所花费的时间不应该那么多。


    我们再看看乔布斯、扎克伯格和奥巴马的着装规则，这些规则旨在减少他们的认知成本。他们都觉得选择一件衣服的后果并不严重。面对一柜子的衣服，人们每天都被迫做出一些微不足道的选择。人们本可以闭上眼睛，随意选择摸到的第一件衣服，但是他们不信任自己。因此，他们有意限制了自己的选择。


    对于大多数人来说，决策的后果并非如此无关紧要。当然，乔布斯和扎克伯格可以穿任何他们想穿的衣服去上班。的确，奥巴马大多数时候必须穿西装，大家并不会真的在乎它的颜色——只要不是棕褐色就行。⁴
    但是我们其他人并没有那样奢侈的条件。你真的每天都会看一遍整个衣橱吗？还是你已经将衣服整理成套，平时从里面拿就行呢？仔细想想，我们很多人是否通过限制选择，从而使决策变得更容易？我们试图降低这些事情的重要性，以减少决策的复杂性。


    选择衣服的例子让人产生共鸣，如果你试图优化决策，会发现决策的后果可能并不严重，但认知成本却相对较高。不过，后果和认知成本是相辅相成的。想象一下在择一人终老或育一子成人等事情上，做出错误选择的后果是十分严重的，所以需要花费大量时间和精力来进行深思熟虑。因此，如果我们把潜在的决策看作在做决策前需要花费时间和精力考虑的事情，而不是通过拖延或遵循默认规则来搁置这些决策，那么随着我们认识到更严重的后果，将更愿意再三思考，而不是不做决策。


    ### 昂贵的信息成本


    能否积极做决策的第二个因素是你是否掌握信息，或者具体来说，你是否有足够的信息成本做决策。昂贵的信息成本可能会让一个决策看似不会造成什么严重后果，因此你可能会遵守默认规则而非深谋远虑。


    你今天应该带雨伞吗？虽然对很多人来说这个选择无关紧要，但它造成的后果可能非同一般。如果你选择不带雨伞而被雨淋湿，那将是糟糕的一天。你也可以带着雨伞来确保不会发生这种情况，但这也有相应的代价。当然，如果你掌握准确的信息（即会不会下雨以及是否会被淋湿），若有很大可能性下雨，你就带上雨伞；若不会下雨，你就不带雨伞。但如果下雨和不下雨的概率都是
    50% 呢？


    这本质上就是抛硬币问题，为了让它准确一些，我们假设如果你被淋湿了，你个人付出的代价就是 10 美元，但如果你带了雨伞而没有下雨，也会因为不必要的负担而损失
    10 美元。5 按照你预计的成本，无论如何你都可能会损失 10 美元的一半，即 5 美元。这让你觉得带不带雨伞都无所谓。


    在你傻乎乎地站在门口想怎么做之前，你可以先看看天气预报。如果天气预报说那天下雨的概率大于 50%，那么你就带上雨伞；如果说下雨的概率小于 50%，那么你就不用带雨伞。但是在这里，我们简化了问题，去掉了可能使这些信息不足的背景条件。如果天气预报说天气将持续放晴，并且有
    90% 的可能不下雨，那么情况就很清楚了，但天气预报并不总是那么清楚。当下雨的概率为 40% 或 30% 时，就跟 50% 没什么区别，我们很少有更详细的信息来做出判断。此外，当你计算出所有这些条件，如盛行风从哪里吹来或大气压是多少时，你又回到了一种情况：做这个决定的认知成本超过了其可能带来的收益，在这种情况下，最多只能降低
    5 美元的成本。


    我们可以通过决策树的形式表示这个决定，决策树是经济学和决策分析的 MBA（工商管理硕士）课程中的基本内容。在决策树中，树的分支表示选择。例如，在图 4-1
    中，选择（在实心黑色节点处）带或不带雨伞这个决定是在不确定条件下做出的，不确定的结果也用代表雨或晴的分支来表示（在圆形节点处自然形成的“选择”）。如果你没有预测，那么与这两个分支相关的概率可能都是
    50%。然而，这里有一个预测，它说下雨的概率是 90%。最终分支的末端是结果。与每种结果（共有 4 种：带雨伞 + 雨、带雨伞 + 晴、不带雨伞 + 雨、不带雨伞
    + 晴）相对应的是判断，我们就以金额的形式呈现。


