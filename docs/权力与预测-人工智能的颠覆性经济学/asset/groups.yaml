  - '[PAGE 188]


    # 人工智能预测迫使人们做出明确的判断


    乔丹和莱因斯多夫之间出现分歧，是因为他们已经从医学专家那里得到了诊断结果，实际上是一种预测，而他们都没有资格质疑。但是考虑一下，有多少决策是在没有明确预测的情况下做出的呢？那么会发生什么呢？当消防员必须在紧急情况下选择救援两人中的一个时，他们不仅要考虑能够成功救出一个人而不是另一个人的相对可能性，还要考虑这两人的身份——比如老年人和儿童。消防员会做出决策，但是他们对不同结果的权重分配很可能是隐性的而不是显性的。我们对他们决策有效性的评估取决于多种因素的组合。


    然而，人工智能预测可能会将决策中的这一部分从决策者手中抽离出来。人工智能预测将导致预测和判断“脱钩”（见图 13-3）。


    预测和判断的“脱钩”并不是一个仅适用于课堂，而不适用于现实世界的假设概念。麦肯锡最近有一篇关于保险业未来的文章便是基于这种预测和判断的“脱钩”而撰写的。⁵
    该文章勾勒出了 2030 年汽车保险的愿景：顾客上车后，他们的个人数字助手会规划可能的路线，助手背后的人工智能会预测事故发生的可能性，而顾客则根据自己的判断做出决策。


    具体情况可能会像这样：你为去温哥华出差租了一辆车，你住在市中心布拉德街上的萨顿酒店，要去不列颠哥伦比亚大学开会。你可以选择沿着水边行驶的观光路线，也可以选择沿着西四街行驶的沉闷路线。观光路线会经过基斯兰奴海滩、杰里科公园和西班牙海滩，景色非常美丽。走观光路线会稍微慢一些，但影响不大，无论选哪条路线，你都能准时到达。'
  - '[PAGE 189]


    ![](img/5d7d0b82a68fe65c345bd809e0cf66b2_189_0.png)


    # 图 13-3 人工智能预测导致预测和判断“脱钩”


    真正的问题是，在观光路线上，很多人都在欣赏风景，这会分散你的注意力。因此，在观光路线上发生轻微交通事故的概率较高。假设你租的车配备了人工智能系统，它将准确地告诉你在观光路线上发生事故的可能性会有多大，然后，你需要运用判断力来评估是否值得冒着风险欣赏风景。为此，你可以绘制决策树，并为不同结果添加回报，就像迈克尔·乔丹在前文例子中所做的那样，你通过计算预期回报来决定是否选择观光路线。


    但谁会这样做呢？没有人。这太复杂了。从最糟糕的字面意思来讲，这就是学术研究。理论上很惊艳，但在实践中却毫无用处。


    但情况也可以不是这样的，你可以将这个决策转化为你熟悉且经常做的决策。在人工智能助手预测概率后，它会告诉你一个价格。它会说如果你选择观光路线，你的保险费将增加
    1 美元。


    这看起来不过是一件小事。司机可以根据价格来选择路线，而价格又是根据事故发生的可能性和维修费用来确定的，这一点对顾客是隐藏的。人工智能计算事故的概率并分配成本，而顾客只看到了一个价格。


    机器进行预测，顾客进行判断。顾客只需判断这个价格是否值得购买即可——小事一桩。'
  - '[PAGE 190]


    这种情况已经出现在我们生活中了。许多公司根据每分钟的驾驶决策给保险定价，它们为那些在手机上安装了远程信息处理应用程序的人提供折扣，并假设这些顾客有良好的驾驶行为。例如，特斯拉无须依赖手机数据，它可以使用车辆自身的数据，根据急刹车、不安全的跟车距离等因素计算出安全得分。“通过基于驾驶行为的保险定价，顾客可以享受较低的保费，我们的道路也会更安全。”


    预测与判断“脱钩”了，保险公司根据有风险的行为定价，顾客判断这种行为是否值得购买。


    保险的例子表明，判断可以与预测“脱钩”，而我们人类习惯于做出判断，这正是经济学家所谓“显示性偏好”的实质。我们可以通过决策来了解人们的偏好，市场营销人员几十年来一直在利用这一点。


    1971 年，保罗·格林和维塔拉·拉奥发表的论文《用于量化判断性数据的联合测量法》描述了一种用于评估消费者需求的全新工具。该论文开头指出：“长期以来，管理人员或消费者判断的量化一直是营销研究人员面临的问题。”他们强调，“研究消费者决策需要确定买家在做决策时如何权衡相互冲突的标准”。该方法要求消费者对不同的选择进行排序，这些选择是假设性的，但足够简单，因为消费者非常熟悉它们。


    格林和拉奥以折扣卡为例。第一张卡在 10 家店铺提供 5% 的折扣，售价为 14 美元；第二张卡在 5 家店铺提供 10% 的折扣，售价为 7 美元；第三张卡在
    10 家店铺提供 15% 的折扣，售价为 21 美元。通过让消费者对其偏好进行排序，统计学家可以确定消费者心目中每张卡的价值。选择即判断。


    随着时间的推移，这种方法得到了进一步发展。它被用于评估意大利香肠或夏威夷比萨、福特卡车或丰田汽车的价值，甚至被用于了'
  - '[PAGE 191]


    解美国大学的中国博士生是留在美国还是回到中国的偏好。通过询问学生是更喜欢在波士顿私营部门的研究科学家职位（薪资为 70 000 美元）还是在北京公共部门的管理职位（薪资为
    50 000 美元），研究人员了解了学生对生活在美国还是中国相对价值的判断。’


    这种显示性偏好框架在经济学中也有相应的研究领域。其最初是从丹尼尔·麦克法登在 20 世纪 70 年代初的诺贝尔经济学奖获奖研究开始的，该研究是使用食品杂货店扫描仪数据和在线点击流测量需求等现代工具的基础。


    15 年前，该领域的著名经济学家可能是帕特·巴贾里，巴贾里现在是亚马逊的核心人工智能副总裁兼首席经济学家。在加入亚马逊之前，巴贾里曾是哈佛大学、斯坦福大学、杜克大学、密歇根大学和明尼苏达大学的教授。他是世界计量经济学学会的院士，写过一些标题晦涩难懂的论文，如《针对各种消费者与无人留意的产品特征所做的需求估计：一种享乐主义的方式》和《随机系数分布的简单估算器》（但并不简单）。巴贾里是他那一代极为出色的计量经济学家之一，他的论文充满了抽象的符号和方程式，我们没有预料到他会将亚马逊发展成世界上最大的经济学博士雇主之一。


    然而，他确实做到了。这在很大程度上与他作为导师和领导者的技能有关，¹⁰ 也与他的论文直接相关。需求估计对亚马逊的业务至关重要，亚马逊需要了解消费者看重什么以及他们愿意付多少钱。如果亚马逊知道消费者对产品的价值判断，就可以在适当的时间以适当的价格为他们提供合适的产品。在营销研究和计量经济学中都有估算消费者判断的工具。在巴贾里的领导下，亚马逊经济学团队找到了如何大规模确定这种判断的方法。


    一旦我们认识到可以通过决策来理解判断，就能发现人类一直在做出判断。我们擅长判断，只有当判断与预测“脱钩”时，判断才会'
