    # 第三章


    # 人工智能是预测技术'
  - '[PAGE 41]


    <!-- no content -->'
  - '[PAGE 42]


    在《AI 极简经济学》中，我们研究了人工智能的简单经济学。我们将与人工智能相关的所有潜在复杂性和大肆宣传简化为一个要素：预测。将令人兴奋的新事物还原为不那么耸人听闻的事物本质，是经济学家进行研究的关键工具。


    提到人工智能，人们会想到流行文化中的智能机器；人们会想到像 R2-D2 或瓦力（WALL-E）这样有用的机器人；人们会想到像《星际迷航》中的 Data 或《钢铁侠》中
    J.A.R.V.I.S. 这样的出色队友；人们也会想到像《2001：太空漫游》中的 HAL 9000 或《复仇者联盟》中奥创（Ultron）那样的反叛者。无论它们有什么怪癖或意图，这些人工智能的代表都有一个共同点：没有人质疑它们可以像人类一样思考、推理和行动。


    虽然未来我们可能会开发出能做到这一切的技术，但今天我们并没有。我们拥有的是统计技术的进步，而不是一种能思考的东西。但是，统计技术的进步非常重要。随着这一进步发挥出其潜力，它将大幅降低预测的成本，而我们无时无刻不在做预测。


    近年来，作为人工智能领域的里程碑事件，机器学习中一种新技'
  - '[PAGE 43]


    术—— “深度学习” 展示了其优越性。2012 年，由杰弗里·辛顿领导的多伦多大学团队运用深度学习大大提升了机器在图像识别方面的能力。团队利用一个名为 ImageNet
    的数百万图像数据集，在过去十年里一直努力设计算法来准确识别图像中的内容。该数据集利用人类对图像内容的分类对每张图像进行了标注。思路是拿这个数据集来开发算法，然后再用新的图像强化这种算法。之后算法和人类会进行一场较量，看谁能更准确地识别出图像中的内容。对于这项任务，尽管人类的表现并不完美，但在
    2012 年前，人类的表现依然远超任何算法。在 2012 年，情况开始发生改变。


    深度学习将识别图像中的内容视为一种预测问题。目标是当给定一张新的图像时，预测人类最有可能说出图像的内容是什么。在面对小狗的图像时，任务不是理解构成小狗图像的本质要素，而是猜测图中的物体最有可能是现有标签中的哪一个。因此，目标就是猜出哪个标签最有可能正确，而这就是预测。通过允许使用大量属性及其组合进行计算（这在计算上是很复杂的），多伦多大学团队展示了深度学习能够胜过其他算法，最终胜过大多数人类。


    这种描述可能使人感觉机器不过是在“即兴发挥”，而不是解决问题，但机器的这种“即兴发挥”是非常高效的。机器预测之所以有用，是因为它比其他任何方法都更精确。原因在于，预测是决策过程的关键。


    # 补足预测


    预测并非决策过程的唯一要素。要想理解预测的重要性，就有必要了解决策的另外两个关键要素：判断和数据。我们可以通过一个例子来更好地做出解释。'
  - '[PAGE 44]


    在电影《我，机器人》中，侦探戴尔·斯普纳生活在机器人为人类服务的未来世界。这位侦探讨厌机器人，并且这种仇恨推动了故事的发展。电影讲述了为何斯普纳对机器人怀有敌意。


    斯普纳的汽车与一辆载着一位 12 岁女孩的车发生过事故。当时两辆车驶离了桥面，在侦探和女孩快要被淹死时，一个机器人出现并救了侦探，却没有救女孩。但是侦探却认为机器人应该先救女孩，从此对机器人怀恨在心。


    由于对方是机器人，斯普纳可以审查它是如何做出决策的。事后他了解到，机器人预测他的生存概率为 45%，而女孩只有 11%。由于机器人只能救一个人，所以选择了救他。但斯普纳认为，11%的概率足以让机器人去尝试救女孩，要是人类就会明白这一点。


    也许斯普纳说的是对的。这就是判断——在特定环境中确定某种行动回报的过程。如果救女孩是正确的决策，那么我们可以推断，斯普纳认为女孩的生命价值是他自己的 4 倍以上。如果女孩有
    11%的生存概率，而他有 45%，那么在获得这些信息的基础上被迫做出选择的人，就必须明确他们生命的相对价值。该机器人显然被编程为判定所有人类的生命都具有相等的价值。因此在使用预测机器时，我们需要明确与判断有关的所有信息。


    # 相关性和因果关系


    数据提供了能够进行预测的信息。人工智能获取的高质量数据越多，预测就越准确。在这里，质量是指你拥有与预测有关的背景数据，统计学家称之为在数据的支持下进行预测的必要性。如果你从现有数据中过度推测，那么预测结果可能不准确。


    在数据的支持下进行预测，并不像收集各种环境中的数据那样简'
  - '[PAGE 45]


    单，这是为了确保你不会过度推测或对未来预测过多。有时你需要的数据并不存在。这正是在统计学课上不断被强调的一点：相关性不一定意味着因果关系。


    在美国的玩具行业中，广告与收入之间有很强的相关性。广告通常在每年 11 月底前急剧增加，并在一个月内保持高位。在这个广告投入较高的时段内，玩具销售非常火爆。仅从数据来看，人们可能会忍不住在这一年的其他时间段也增加广告。如果玩具行业在春季早期像圣诞节前一个月那样进行广告宣传，那么无疑可以增加
    4 月的收入。


    不过该行业并未这样做。事实是，4 月的玩具广告投入远低于 12 月。这意味着任何关于在 4 月增加广告投入可能发生的情况预测，都不符合数据的支持。从广告和收入之间的月度相关性来看，你无法确定是广告导致了盈利，还是圣诞节影响了二者。这种相关性可能是因果关系，因此在
    4 月增加广告投入可能会导致玩具销量大幅增长。当然，也有可能并不是广告导致了 12 月的销量增长。相反，是人们对圣诞节的期待引发了广告投入增加和销量增长。广告确实可能导致
    12 月的销量增长，但由于 4 月购买玩具的人非常少，所以在那个时段可能没有太大影响。


    换句话说，如果行业的广告策略发生变化，那么仅凭预测机器本身，是无法获得相关信息判断 4 月的玩具销量的。¹ 要想发现其中的关系，需要使用一种名为“因果推断”的统计学方法。与人工智能一样，这个领域在过去几年里也取得了重大进展（2021
    年诺贝尔经济学奖颁发给了在因果关系分析方面取得突破的研究者），越来越清楚的是，这些工具本身是人工智能的补充，为人工智能提供了实现有效预测所需的数据，以便在许多情况下发挥作用。全球顶尖的人工智能公司也认识到了这一点。例如，2021
    年诺贝尔经济学奖得主中'
  - '[PAGE 46]


    有两位是亚马逊公司的员工。除了做学术研究，吉多·因本斯还是亚马逊核心人工智能团队的科学家，戴维·卡德也是亚马逊公司的学者。2


    因果推断的难题将人工智能的有用性限制在可能收集相关数据的领域。人工智能非常擅长玩游戏，包括国际象棋、围棋和《超级马里奥兄弟》等。游戏的设置都是相同的，因此不需要从过去的数据过度推测到当前的游戏中。此外，因为游戏是软件，可以对数据中不存在的情况进行模拟实验。这些实验使人工智能能够补充其余的数据，探索如果按下不同的按键或尝试新策略会发生什么。这就是谷歌旗下人工智能公司
    DeepMind 的阿尔法围棋和阿尔法元在围棋游戏中发现获胜策略的方法，而这些策略在高水平的竞技游戏中没有被成功使用过。DeepMind 进行了数百万次模拟实验，使机器通过模拟尝试几种不同的方法来学习预测获胜策略。3


    在许多商业场景中，数据是可得的。当数据不可得时，通常可以通过实验来收集数据。商业场景的实验比游戏要花费更长的时间，因为它是以人类的速度而不是计算机模拟的速度进行的。尽管如此，这仍然是一种强大的工具，可以收集相关数据，对人工智能有所助益。


    随机实验是统计学家发现因果关系的主要工具，也是批准新型医疗方法的黄金准则。一组人被随机分配接受治疗，另一组人使用安慰剂。虽然这两组并不相同——因为两组人是不同的——但这些差异是偶然的结果。通过分配给每组足够多的人，你可以观察治疗是否有效果。通过进行科学的实验，通常可以补充所需的数据，从而得出因果关系，而不仅是相关性。


    有时，这种模拟且随机的甚至是准随机的数据收集可能很难完成，或者根本无法做到。极端情况是在军事环境中应用人工智能。起初，战争可能是应用人工智能的理想场所。正如军事理论家卡'
  - '[PAGE 47]


    尔·冯·克劳塞维茨在 19 世纪所说，“战争是不确定性的王国”。预测可以减少不确定性，从而产生强大的军事优势。然而，难题在于战争对手。在战争中，“如果人工智能变得善于优化任何特定问题的解决方案，那么聪明的敌人就会积极地去改变问题”。4
    敌人将超越训练集，和平时期的数据将毫无用处。


    这种想法也适用于商业环境。当没有竞争对手主动破坏预测，或者没有客户主动绕过预测时，预测就会有效。当某个客户通过逆向工程获取了你的人工智能关键技术，并向其提供虚假信息时，人工智能往往只会为你的目标服务（只要客户不发现它是如何工作的）。而当预测不支持你的数据，并出现因果推断问题时，点解决方案可以完成的情况，通常就需要系统层面的改变。尽管如此，对于已经从人工智能获得价值的那
    11% 的公司来说，预测通常基于它们手头的数据，因此人工智能点解决方案还是有效的。


    # 位于核心的预测


    让我们来试着做一个决策：是接受还是拒绝一项金融交易。决策的关键在于欺诈预测，这是 Verafin 业务的核心。有一项涉及支付请求的交易，即从一个账户转账到另一个账户。如果交易获得批准，资金将被转移，这就引发了商品和服务的交换；如果交易未获得批准，则不会转移资金，这可能会阻碍真实的工作进程。交易之所以需要支付批准，是因为犯错需要付出代价。批准与没有账户的人的交易，将导致一系列的债务和问题；拒绝不会引起这类问题的交易，则会破坏整个流程背后的现实世界的活动。


    你可能希望拥有一个完全避免错误的系统，这并非不可能。随着时间的推移，并经过仔细的审查，银行有可能做到这一点。但问题'
  - '[PAGE 48]


    是，完全避免错误的代价是非常高的。它将延缓进程，增加交易成本，并以其他方式剥夺人们在交易中希望获得的便利。毕竟，如果通过数字信息批准账户条目的交易成本太高，那么使用现金会更好。


    为了使该系统发挥作用，银行进行了一场推测游戏。它们必须减少可能犯下的推测错误。如果它们严格对待审批，那么就有可能拒绝许多合法交易，最终导致客户的不满；如果它们在审批上过于宽松，那么最终会给欺诈者创造非法交易的机会，并且很难追回错放的资金，这会直接损害银行利润。因此，它们推测并严格设置门槛，以减少不可避免地会犯的两个错误。


    人工智能使银行在推测游戏中表现得更好并减少了错误的发生。作为研究过去十年人工智能新进展的经济学家，我们意识到自己的任务就是打破炒作。人工智能吸引了哲学家、电影制作人、未来学家、末日论者等许多人的注意力，他们可以让你的晚餐聚会更加有趣。我们则扮演着相反的角色。我们从计算机科学的成功之处获得线索，并将人工智能的所有进展，如神经网络、机器学习、深度学习或对抗性优化，归结为统计学的进步——这是一个很大的进步，即预测的统计学。因此，与其说人工智能参与了打击欺诈的斗争，不如说人工智能实际上是在提高银行的辨别能力，以更低的成本将合法交易与欺诈交易区分开，也就是预测。


    现在的人工智能是一种预测机器，仅此而已。对于 Verafin 来说，这正是它想要的。要使现代支付系统发挥作用，就需要高度的自动化。你希望在审批交易时有十足的把握，这就是人工智能的用武之地。它将银行关于客户、行为模式、交易时间和交易地点的大量信息，转化为对交易是否合法的预测。在过去的
    20 年里，预测的准确性得到了提高。目前，金融机构广泛采用人工智能进行欺诈检测，并声称在准确性方面取得了实质性的进步。5'
  md: '

    2900万块农田的红外卫星图像和土壤成分数据，这使弗里德伯格能够计算出与农田或农作物相关的天气风险。13


    弗里德伯格创办了气候公司，并向农民销售保险，但他很快就发现农民对他所掌握的与田地有关的数据也非常感兴趣：


    他向农民展示了田地在任何时刻所含的湿度——如果超过一定水平，耕作就会对田地造成损害。他每天向农民展示降雨和温度情况——你可能认为农民知道这些，但农民可能管理着二三十块不同的田地，且这些田地分布在几个县里。他向农民展示了农作物的精确生长阶段、最佳施肥时机、播种的最佳8天及理想的收获日期。14


    预测对于农民的关键决策有着重要驱动力：施肥、播种和收获。这些决策的目标几乎在哪儿都一样，即最大限度地提高产量。农业生产总是与农民的直觉判断有关，而气候公司将农业变成了决策科学及一种概率问题。农民不再玩轮盘赌博，而是玩21点，大卫·弗里德伯格所做的就是帮助农民算牌。15


    农民习惯看到技术变革以他们能够使用的新工具形式出现，但预测正在改变他们的决策方式。事实上，这些决策不仅发生了变化，而且发生了转移。转移到了哪里？——远离美国农村的旧金山。这家位于美国西海岸的城市公司告诉堪萨斯州的农民：不应该再种植玉米了。


    目前气候公司并不负责所有的农业决策，农民仍会做出一些关键决策。然而，正如弗里德伯格所指出的：“随着时间的推移，这些决策将会减少至零。一切都将被观察到，一切都将被预测。”16
    农民正在逐步接受这一点。作家迈克尔·刘易斯回忆道：“从来没有人问过弗里德伯格这个问题：如果我的知识不再有用，那我还有用吗？”17


    换句话说，这预示着农场管理将走向颠覆和集中化。我们不知道这需要多长时间，也不知道有些决策是否无法自动化。我们知道的是，业界认为这些工具潜力巨大。孟山都公司在2013年以11亿美元收购了弗里德伯格创办的气候公司。


    随着预测机器的不断改进，农民不仅接受预测并做出决策，而且会将决策权让渡给他人。这可能会优化农场管理，因为拥有正确的信息、技能、激励措施和协调能力的人会做出更好的决策。但与此同时，农民将会扮演什么角色呢？他们现在是土地的所有者，但在这种变革之前，他们还能拥有土地多久呢？


    ## 本书主要内容


    这本书的目的是开启人工智能系统解决方案之路。我们所关注的重点是决策和预测在其中所起的作用。


    在第一部分，我们讨论了三位企业家的寓言，并介绍了在“中间时代”开发和部署人工智能所面临的挑战，这些挑战可能与电力以及过去其他通用技术所遇到的问题类似。为了更好地理解这些挑战和机遇，在第三章中，我们重温了《AI
    极简经济学》的主题，并描述了人工智能的核心是如何与预测相关的。


    在第二部分，为了证明对于预测来说，仅靠点解决方案是不足以产生高价值的，我们深入探讨了决策过程。我们探索了三个普遍的主题。第一，做决策是困难的。相较于简单地遵循规则，它涉及认知成本。决策的好处在于能够根据新信息改变行动。当没有预测时，这些好处就不明显了。第二，人工智能预测可能会打破遵循规则的做事方式，让人们去做出决策，而规则和保护组织免受不利后果影响的相应措施可能会掩盖不确定性。因此，很难确定在哪里应用人工智能，因为不确定性被隐藏了。与此同时，这里也是最能强烈地感受到颠覆性的地方。如果不确定性浮出水面，那么努力将其隐藏起来的企业将面临危险。第三，决策之间的关系。当决策相互作用时，从规则转向由预测驱动的决策，实际上给系统增加了一定程度的不可靠性，而要克服这一点往往需要整个系统的变革。问题在于规则通常以微妙且不明显的方式，将既有系统紧密地联系在一起。因此，相较于改变现有系统，从头构建一个新系统可能更容易。所以，从历史上看，在需要对整个系统进行重新设计以实现优化时，新进入者和初创企业的表现往往优于成熟企业。因此，系统变革是颠覆在位企业的一个途径。


    在第三部分，我们讨论了创建新系统的过程，这不仅涉及改变一个决策来应对预测，而且要使所有相互作用的决策都能发生变化。我们描述了采用系统思维和观察决策之间微妙关系的价值，尤其是以前有很多决策是由规则控制的。我们展示了人工智能预测已经对创新过程产生系统变革的影响，这让我们得以了解其他领域可能需要的变革。


    在第四部分，我们揭示了整个系统变革的一个重要结果：对权力的影响。颠覆是一个过程，它与经济权力的重新分配有关——也就是说，在新系统下，创造最大经济价值的人将发生变化。我们回顾了较为近期的历史，解释了改变行业的颠覆是如何与整个系统的变革联系在一起的。同时，我们着眼于伴随人工智能出现的与权力相关的一种恐惧：机器是否会掌握权力。我们认为，人工智能的核心是预测且服务于决策，权力并非来自机器——尽管它们可能看起来很强大——而是来自机器背后的人，这些人引导它们如何对预测做出反应，而这就是我们所说的判断。随后，我们探讨了更好的预测能给相互竞争的企业带来哪些优势，以及支撑预测的数据。换句话说，预测如何推动权力的累积。


    在第五部分，我们深入探讨了预测如何改变权力拥有者的机制，即人工智能如何进行颠覆。我们解释了人工智能的采用是如何将预测和判断“脱钩”的，在没有预测机器时，决策者是把预测和判断放在一起做出决策的。这引发了一个问题，即当前的决策者是否真的最适合去做出判断。然后，我们转向了“脱钩”后可能主导判断的人。我们探讨了判断如何从分散化转变为规模化，从而导致权力的集中。同样地，当预测涉及从规则到决策再到新系统的变化时，新的主导人在决策中发挥作用，因此成为新的权力中心。


    在第六部分，我们讨论了系统设计，特别是针对建立在新的人工智能发展基础上的可靠系统，并提供了一个工具，帮助理解企业或行业是一个决策（或潜在决策）系统。当你获得强大的预测机器时，需要采取白板思维的方法，将你的任务与一小部分最基础的决策相匹配。我们首先解释了家庭保险业是如何做到这一点的，然后研究了医疗保健是如何实现这一点的，因为它已经在系统层面上面临来自人工智能应用的挑战。


    最后，本书以很多人关注的对人工智能偏见的事例结尾。我们认为，将对人工智能的偏见视为一个点解决方案，可能导致部分人群对采用预测机器的合理抵制。但是，从系统思维的角度来看待偏见更加恰当。一旦我们了解到系统是如何调整以适应人工智能预测的，就会更容易看到人工智能是有机会消除偏见，而不会造成偏见的。


    总体而言，由人工智能驱动的行业转型需要时间。刚开始人们并不清楚怎么做，许多人可能会进行试验然后失败，因为他们误解了需求，或者他们无法保证单位经济效益。最终，有人将取得成功，开辟出一条盈利之路。其他人会尝试模仿，行业领导者将试图修筑壁垒以保护其优势，有时这种做法有效。不过无论如何，行业都将发生转变，而且一如既往地会有赢家和输家。


    ## 本章要点


    - 尽管人工智能具有令人震撼的预测能力，但在过去十年中，生产力下降了一半，自20世纪90年代末以来，大多数美国人的实际收入一直停滞不前。这种生产力悖论并非新鲜事。我们在20世纪80年代的计算机时代也经历过类似的情况。我们称之为“中间时代”，即在见证了人工智能的力量后与实现其广泛应用前景前的时代。虽然点解决方案和应用解决方案可以相对快速地设计和实施，但能够释放人工智能巨大潜能的系统解决方案需要更多时间。


    - 定义三种类型的人工智能解决方案（点解决方案、应用解决方案和系统解决方案）的关键概念是独立性。如果人工智能预测可以通过改善关键决策而创造价值，并且该价值创造独立于系统的其他任何变化，那么点解决方案（改善后的现有决策）或应用解决方案（新决策）是可行的。然而，如果改善后的决策价值不是独立的，而是需要对系统进行其他实质性改变才能创造价值的，那么就需要系统解决方案。


    - 系统解决方案通常比点解决方案或应用解决方案更难以实施，因为由人工智能改善的决策会影响系统中的其他决策。而点解决方案和应用解决方案往往会强化既有系统，系统解决方案（顾名思义）则会推翻既有解决方案，因此通常会导致颠覆。然而，在许多情况下，系统解决方案可能会给人工智能的投资带来最大的整体回报。此外，系统解决方案可能会在某些行业引起颠覆，造成赢家和输家。


    ## 第三章


    ### 人工智能是预测技术


    在《AI 极简经济学》中，我们研究了人工智能的简单经济学。我们将与人工智能相关的所有潜在复杂性和大肆宣传简化为一个要素：预测。将令人兴奋的新事物还原为不那么耸人听闻的事物本质，是经济学家进行研究的关键工具。


    提到人工智能，人们会想到流行文化中的智能机器；人们会想到像 R2-D2 或瓦力（WALL-E）这样有用的机器人；人们会想到像《星际迷航》中的 Data 或《钢铁侠》中
    J.A.R.V.I.S. 这样的出色队友；人们也会想到像《2001：太空漫游》中的 HAL 9000 或《复仇者联盟》中奥创（Ultron）这样的反叛者。无论它们有什么怪癖或意图，这些人工智能的代表都有一个共同点：没有人质疑它们可以像人类一样思考、推理和行动。


    虽然未来我们可能会开发出能做到这一切的技术，但今天我们并没有。我们拥有的是统计技术的进步，而不是一种能思考的东西。但是，统计技术的进步非常重要。随着这一进步发挥出其潜力，它将大幅降低预测的成本，而我们无时无刻不在做预测。


    近年来，作为人工智能领域的里程碑事件，机器学习中一种新技术——“深度学习”展示了其优越性。2012年，由杰弗里·辛顿领导的多伦多大学团队运用深度学习大大提升了机器在图像识别方面的能力。团队利用一个名为
    ImageNet 的数百万图像数据集，在过去十年里一直努力设计算法来准确识别图像中的内容。该数据集利用人类对图像内容的分类对每张图像进行了标注。思路是拿这个数据集来开发算法，然后再用新的图像强化这种算法。之后算法和人类会进行一场较量，看谁能更准确地识别出图像中的内容。对于这项任务，尽管人类的表现并不完美，但在2012年前，人类的表现依然远超任何算法。在2012年，情况开始发生改变。


    深度学习将识别图像中的内容视为一种预测问题。目标是当给定一张新的图像时，预测人类最有可能说出图像的内容是什么。在面对小狗的图像时，任务不是理解构成小狗图像的本质要素，而是猜测图中的物体最有可能是现有标签中的哪一个。因此，目标就是猜出哪个标签最有可能正确，而这就是预测。通过允许使用大量属性及其组合进行计算（这在计算上是很复杂的），多伦多大学团队展示了深度学习能够胜过其他算法，最终胜过大多数人类。


    这种描述可能使人感觉机器不过是在“即兴发挥”，而不是解决问题，但机器的这种“即兴发挥”是非常高效的。机器预测之所以有用，是因为它比其他任何方法都更精确。原因在于，预测是决策过程的关键。


    ### 补足预测


    预测并非决策过程的唯一要素。要想理解预测的重要性，就有必要了解决策的另外两个关键要素：判断和数据。我们可以通过一个例子来更好地做出解释。


    在电影《我，机器人》中，侦探戴尔·斯普纳生活在机器人为人类服务的未来世界。这位侦探讨厌机器人，并且这种仇恨推动了故事的发展。电影讲述了为何斯普纳对机器人怀有敌意。


    斯普纳的汽车与一辆载着一位12岁女孩的车发生过事故。当时两辆车驶离了桥面，在侦探和女孩快要被淹死时，一个机器人出现并救了侦探，却没有救女孩。但是侦探却认为机器人应该先救女孩，从此对机器人怀恨在心。


    由于对方是机器人，斯普纳可以审查它是如何做出决策的。事后他了解到，机器人预测他的生存概率为45%，而女孩只有11%。由于机器人只能救一个人，所以选择了救他。但斯普纳认为，11%的概率足以让机器人去尝试救女孩，要是人类就会明白这一点。


    也许斯普纳说的是对的。这就是判断——在特定环境中确定某种行动回报的过程。如果救女孩是正确的决策，那么我们可以推断，斯普纳认为女孩的生命价值是他自己的4倍以上。如果女孩有11%的生存概率，而他有45%，那么在获得这些信息的基础上被迫做出选择的人，就必须明确他们生命的相对价值。该机器人显然被编程为判定所有人类的生命都具有相等的价值。因此在使用预测机器时，我们需要明确与判断有关的所有信息。


    ### 相关性和因果关系


    数据提供了能够进行预测的信息。人工智能获取的高质量数据越多，预测就越准确。在这里，质量是指你拥有与预测有关的背景数据，统计学家称之为在数据的支持下进行预测的必要性。如果你从现有数据中过度推测，那么预测结果可能不准确。


    在数据的支持下进行预测，并不像收集各种环境中的数据那样简单，这是为了确保你不会过度推测或对未来预测过多。有时你需要的数据并不存在。这正是在统计学课上不断被强调的一点：相关性不一定意味着因果关系。


    在美国的玩具行业中，广告与收入之间有很强的相关性。广告通常在每年11月底前急剧增加，并在一个月内保持高位。在这个广告投入较高的时段内，玩具销售非常火爆。仅从数据来看，人们可能会忍不住在这一年的其他时间段也增加广告。如果玩具行业在春季早期像圣诞节前一个月那样进行广告宣传，那么无疑可以增加4月的收入。


    不过该行业并未这样做。事实是，4月的玩具广告投入远低于12月。这意味着任何关于在4月增加广告投入可能发生的情况预测，都不符合数据的支持。从广告和收入之间的月度相关性来看，你无法确定是广告导致了盈利，还是圣诞节影响了二者。这种相关性可能是因果关系，因此在4月增加广告投入可能会导致玩具销量大幅增长。当然，也有可能并不是广告导致了12月的销量增长。相反，是人们对圣诞节的期待引发了广告投入增加和销量增长。广告确实可能导致12月的销量增长，但由于4月购买玩具的人非常少，所以在那个时段可能没有太大影响。


    换句话说，如果行业的广告策略发生变化，那么仅凭预测机器本身，是无法获得相关信息判断4月的玩具销量的。¹ 要想发现其中的关系，需要使用一种名为“因果推断”的统计学方法。与人工智能一样，这个领域在过去几年里也取得了重大进展（2021年诺贝尔经济学奖颁发给了在因果关系分析方面取得突破的研究者），越来越清楚的是，这些工具本身是人工智能的补充，为人工智能提供了实现有效预测所需的数据，以便在许多情况下发挥作用。全球顶尖的人工智能公司也认识到了这一点。例如，2021年诺贝尔经济学奖得主中有两位是亚马逊公司的员工。除了做学术研究，吉多·因本斯还是亚马逊核心人工智能团队的科学家，戴维·卡德也是亚马逊公司的学者。2


    因果推断的难题将人工智能的有用性限制在可能收集相关数据的领域。人工智能非常擅长玩游戏，包括国际象棋、围棋和《超级马里奥兄弟》等。游戏的设置都是相同的，因此不需要从过去的数据过度推测到当前的游戏中。此外，因为游戏是软件，可以对数据中不存在的情况进行模拟实验。这些实验使人工智能能够补充其余的数据，探索如果按下不同的按键或尝试新策略会发生什么。这就是谷歌旗下人工智能公司
    DeepMind 的阿尔法围棋和阿尔法元在围棋游戏中发现获胜策略的方法，而这些策略在高水平的竞技游戏中没有被成功使用过。DeepMind 进行了数百万次模拟实验，使机器通过模拟尝试几种不同的方法来学习预测获胜策略。3


    在许多商业场景中，数据是可得的。当数据不可得时，通常可以通过实验来收集数据。商业场景的实验比游戏要花费更长的时间，因为它是以人类的速度而不是计算机模拟的速度进行的。尽管如此，这仍然是一种强大的工具，可以收集相关数据，对人工智能有所助益。


    随机实验是统计学家发现因果关系的主要工具，也是批准新型医疗方法的黄金准则。一组人被随机分配接受治疗，另一组人使用安慰剂。虽然这两组并不相同——因为两组人是不同的——但这些差异是偶然的结果。通过分配给每组足够多的人，你可以观察治疗是否有效果。通过进行科学的实验，通常可以补充所需的数据，从而得出因果关系，而不仅是相关性。


    有时，这种模拟且随机的甚至是准随机的数据收集可能很难完成，或者根本无法做到。极端情况是在军事环境中应用人工智能。起初，战争可能是应用人工智能的理想场所。正如军事理论家卡尔·冯·克劳塞维茨在19世纪所说，“战争是不确定性的王国”。预测可以减少不确定性，从而产生强大的军事优势。然而，难题在于战争对手。在战争中，“如果人工智能变得善于优化任何特定问题的解决方案，那么聪明的敌人就会积极地去改变问题”。4
    敌人将超越训练集，和平时期的数据将毫无用处。


    这种想法也适用于商业环境。当没有竞争对手主动破坏预测，或者没有客户主动绕过预测时，预测就会有效。当某个客户通过逆向工程获取了你的人工智能关键技术，并向其提供虚假信息时，人工智能往往只会为你的目标服务（只要客户不发现它是如何工作的）。而当预测不支持你的数据，并出现因果推断问题时，点解决方案可以完成的情况，通常就需要系统层面的改变。尽管如此，对于已经从人工智能获得价值的那11%的公司来说，预测通常基于它们手头的数据，因此人工智能点解决方案还是有效的。


    ### 位于核心的预测


    让我们来试着做一个决策：是接受还是拒绝一项金融交易。决策的关键在于欺诈预测，这是 Verafin 业务的核心。有一项涉及支付请求的交易，即从一个账户转账到另一个账户。如果交易获得批准，资金将被转移，这就引发了商品和服务的交换；如果交易未获得批准，则不会转移资金，这可能会阻碍真实的工作进程。交易之所以需要支付批准，是因为犯错需要付出代价。批准与没有账户的人的交易，将导致一系列的债务和问题；拒绝不会引起这类问题的交易，则会破坏整个流程背后的现实世界的活动。


    你可能希望拥有一个完全避免错误的系统，这并非不可能。随着时间的推移，并经过仔细的审查，银行有可能做到这一点。但问题是，完全避免错误的代价是非常高的。它将延缓进程，增加交易成本，并以其他方式剥夺人们在交易中希望获得的便利。毕竟，如果通过数字信息批准账户条目的交易成本太高，那么使用现金会更好。


    为了使该系统发挥作用，银行进行了一场推测游戏。它们必须减少可能犯下的推测错误。如果它们严格对待审批，那么就有可能拒绝许多合法交易，最终导致客户的不满；如果它们在审批上过于宽松，那么最终会给欺诈者创造非法交易的机会，并且很难追回错放的资金，这会直接损害银行利润。因此，它们推测并严格设置门槛，以减少不可避免地会犯的两个错误。


    人工智能使银行在推测游戏中表现得更好并减少了错误的发生。作为研究过去十年人工智能新进展的经济学家，我们意识到自己的任务就是打破炒作。人工智能吸引了哲学家、电影制作人、未来学家、末日论者等许多人的注意力，他们可以让你的晚餐聚会更加有趣。我们则扮演着相反的角色。我们从计算机科学的成功之处获得线索，并将人工智能的所有进展，如神经网络、机器学习、深度学习或对抗性优化，归结为统计学的进步——这是一个很大的进步，即预测的统计学。因此，与其说人工智能参与了打击欺诈的斗争，不如说人工智能实际上是在提高银行的辨别能力，以更低的成本将合法交易与欺诈交易区分开，也就是预测。


    现在的人工智能是一种预测机器，仅此而已。对于 Verafin 来说，这正是它想要的。要使现代支付系统发挥作用，就需要高度的自动化。你希望在审批交易时有十足的把握，这就是人工智能的用武之地。它将银行关于客户、行为模式、交易时间和交易地点的大量信息，转化为对交易是否合法的预测。在过去的20年里，预测的准确性得到了提高。目前，金融机构广泛采用人工智能进行欺诈检测，并声称在准确性方面取得了实质性的进步。5

