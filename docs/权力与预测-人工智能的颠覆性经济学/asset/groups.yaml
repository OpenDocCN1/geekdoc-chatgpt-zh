    情况下，人类——不管有多少缺点——仍然比机器替代品的成本低。因此，尽管像达龙·阿西莫格鲁和帕斯夸尔·雷斯特雷波这样的经济学家可能会认为，资本成本相对于劳动力成本来说得到了补贴，这只不过是因为时间问题，但现在我们都可以喘口气了。


