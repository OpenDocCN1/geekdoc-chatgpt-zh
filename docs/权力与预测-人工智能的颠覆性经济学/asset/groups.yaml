    ## 图 7-1 与他人隔离或接触的决策树


    ## 将新冠肺炎疫情视为预测问题


    确定预测问题的第一步是找出哪里存在不确定性。从这个角度来看，疫情充满了不确定性。最大的未知数是何时会出现具有大面积传播潜力的病原体，这的确可能是人工智能可以解决的问题。然而，我们想要关注的是更贴近生活的问题：疫情防控。换言之，当病原体将要或者已经出现时，控制住它的关键不确定性因素是什么呢？


    以这种方式来规划疫情防控可能有些奇怪。毕竟，我们习惯将其视为一个公共卫生难题：如何找到疫苗来结束疫情，如何找到可以拯救生命的治疗方法，或者如何降低病毒的传播速度？但当我们分析是什么使疫情暴发，以及人们在健康、经济民生和社会生活方面所付出的代价时，我们意识到那些阻止人们相互传染的防控措施也会影响我们的正常生活。


    在疫情暴发的前几个月里，人们开发了各种工具来预测谁可能被感染。公共卫生官员用了一个最古老的方法来预测人们是否可能被感染——接触者追踪。如果你与一个感染者接触了，那么你被感染的可能性就会更大。这种接触者追踪可以帮助官员预测最近可能被感染的人。在许多国家，这是一个耗时、费力且充满不确定性的过程，官员需要打电话给感染者，并询问他们去过哪些地方。在韩国，公共卫生部门开发了新的程序，将闭路电视摄像头、信用卡和手机的数据结合起来，辅助接触者追踪工作。³


    创新并不仅限于接触者追踪。人工智能专家还开发了预测传染性的工具。有一个团队开发了一种工具，通过让人们对着手机咳嗽来检测是否为无症状感染。⁴ 在希腊边境，一种集合旅行方式、出发地点和人口统计信息等因素并每周更新的人工智能工具，所检测到的无症状感染者是随机检测的
    1.85 倍，这有助于确定哪些旅行者不需要接受进一步检测就可以入境。⁵ 非人工智能的预测工具也被开发了出来。许多地方使用热像仪和温度计来检测人们是否发烧，认为体温升高的人更有可能感染了新冠病毒。在泰国，人们训练狗来嗅出人体中的疾病。⁶


    到了 2020 年秋季，很多地方已经意识到快速抗原检测是预测传染性的最有效工具。虽然 PCR（聚合酶链式反应）检测同样可以检测到少量病毒，但与快速抗原检测相比，其速度更慢、费用更高。⁷


    预测是填补缺失信息的过程，新冠病毒检测有助于填补某人是否具有传染性的信息空白。与其他预测一样，快速抗原检测并不是 100% 准确的。然而，抗原检测结果的假阳性很少，这意味着不太可能有人检测结果呈阳性而不具有传染性。⁸
    因此，如果你可以对人们进行检测，并要求那些抗原检测结果呈阳性的人待在家中，那么病毒传播就可以得到有效控制。PCR 检测则不同，因为在传染期后的几周或几个月内可能仍然呈阳性。换言之，到了
    2020 年秋季，我们有了一种可以批量生产的廉价的新冠病毒预测工具。它不是人工智能工具，而是一种不同类型的预测设备。


    基于这一认识，我们与流行病学家劳拉·罗塞拉、政治科学家贾尼斯·斯坦因和创新颠覆实验室的执行董事索尼娅·塞尼克合作，设计并帮助企业实施了一个快速检测项目，以确保工作场所安全开放。⁹


    我们的设计是定期对工人进行检测，让检测结果呈阳性的工人待在家中，而其他人可以去上班，因为他们知道其同事最近的检测结果呈阴性。预测工具是可行的，而且计划似乎很容易实施。这将使那些没有关闭的重要工作场所更加安全，随着时间的推移，经济也会开始重新运转。


    然而，我们很快了解到，预测工具只是其中较容易的部分。该系统由许多规则黏合在一起，这些规则对基于信息的决策很不利。例如，在收集人们的健康信息方面有隐私规则，在限制人们出入工作场所方面有工会规则，在存储和处理个人信息方面有数据安全规则，在处理检测后的缓冲溶液方面有危险废物处理规则，以及当工人检测结果呈阳性时谁将承担休假成本的工伤赔偿规则，等等。


    信息问题会导致经济停滞，因此将其解决迫在眉睫。但系统通过各种规则黏合在一起，基于信息的决策方案几乎无从下手。我们需要找到一种方法来使系统灵活，让系统能对信息——特别是对传染性的预测——做出更灵敏的反应。


    我们与一些公司的首席执行官和思想领袖讨论了这个问题，包括英格兰银行和加拿大银行的前行长马克·卡尼、美国亚特兰大疾病控制与预防中心的前主任布伦达·菲茨杰拉德和作家玛格丽特·阿特伍德。到
    2020 年 10 月，有 12 位首席执行官同意为一个灵活系统提供平台。¹⁰ 每个首席执行官都承诺任命一位直接下属参与这个项目，并尽可能地消除规则造成的障碍。我们的目标是在这个灵活的环境中设计一个足够令人信服的系统，以激励其他公司和公共卫生官员放弃一些基于规则的黏合系统，转而采用基于信息的灵活决策。


    这 12 家大公司是创新颠覆实验室快速检测联盟的创始合作伙伴，分别代表制造业、交通运输业、金融服务业、公共事业、娱乐和零售业，共雇用了 50 多万名员工。首席执行官迫切地想要启动检测机制，开放工作场所，并确保员工的安全。在我们开始后不久，参与调查的员工表示，在进入工作场所之前进行检测，这使他们及其同事感到安心。


    我们的创始成员之一于 2021 年 1 月 11 日在多伦多市中心的一个地方启动了首个试点项目。在接下来的几个月里，该系统运行良好。少数被感染的人被检测出来，并在工作中不会接近他们的同事，工人们感觉更安全了，管理者也能让设施保持开放，否则可能需要关闭它们。然后，我们创建了一个工作手册，分享给其他公司和后来其他类型的组织，包括非营利组织、度假营、托儿所和学校。该手册内容包括如何建立一套数据报告流程，管理快速抗原检测，建立实体的检测站，培训管理该流程的员工，与员工及其工会沟通该计划，管理数据流，丢弃使用过的检测物品，处理与检测结果呈阳性员工相关的后勤工作，向政府订购快速抗原检测设备，等等。


    随着时间的推移，其他公司的黏合性规则也开始松动。在加拿大，无论是全国还是各省，工人最初是在有监管的工作场所进行检测，最后可以在家里检测，而不需要专业的医疗人员。


    同时，也有必要对这些检测进行追踪。人们担心，一些接触过新冠病毒的参与者会将阴性检测结果理解为他们在几周内都不会发病，但实际上，充其量也就是几天。频繁检测可以降低这种风险，所以我们需要一个数据系统来追踪检测对象和检测时间。然而，这些公司只有在保护工人隐私的条件下才会接受这个数据系统。因此我们开发了一个数据追踪系统，既能满足员工对隐私的要求，又能满足公共卫生的要求，确保合规。


    企业政策逐渐开始支持快速抗原检测。在请病假没有工资和一些工作场所没有保护措施的情况下，工人对检测持谨慎态度，因此雇主需要确定检测对象和检测时间。企业还需要确定检测是否计入工作日的工时，检测在何处进行，当工人检测结果呈阳性时该怎么办，以及谁对这些健康和安全决策负责。起初，没有现成的流程来确定工人、经理和专业医疗人员的责任。我们的工作手册包括免费共享和不断更新的标准操作规程，随着企业对我们的工作手册越来越有信心，黏合的规则开始松动。


    最终，我们的工作场所快速抗原检测系统在加拿大的 2000 多个组织中被使用，当人们的检测结果呈阳性并居家隔离时，成千上万的新冠病毒感染者被挡在了工作场所和学校之外。尽管如此，挑战仍是巨大的。最初大多数的参与者花了
    6 个月才实现大规模部署检测，而让成千上万的工人接受定期检测，更是花了一年。然而，预测工具只是其中最简单的一环，它只是解决新冠病毒信息问题，让人们重返工作和学校所需变革的一小部分。


    ## 灵活系统


    本章想要传递的信息是，为了利用预测机器的优势，我们希望将规则转化为决策。然而，系统——按照某种方式进行操作的一套程序——必须能够适应这种变化。如果一个规则与另一个规则紧密相连，以确保系统的可靠性，那么在这个系统中做决策可能是徒劳的。


    在这里，我们强调了在 2020 年春季人们遵守的规则：待在家里。


    我们不知道谁具有传染性，这种不确定性意味着规则就是远离他人。


    这条规则反过来又带来了各种难题。首先，许多人在外面工作，他们的工作需要他们离开家。如果不让人们外出，那么很多人将失业。在疫情防控期间，餐馆、商店和剧院都无法运营。全球各国政府推出了工资补贴和商业扶持政策，这是一种成本很高的解决方案，就是为了应对这条规则带来的难题而制订的。


    其次，隔离本身会带来其他挑战。它影响了人们的心理状态，让人难以确保孩子是否安全，老年人是否得到了所需的帮助。看病变成了在线咨询或被完全取消。这些问题又产生了新规则：家人之间相互检查；许多学校制定了给学生家里打电话的政策；医生被要求主动检查他们的患者；一些地方安装了家庭监控，以确保老年人的安全。


    这场疫情提醒我们，我们往往依赖规则，但规则本身是低效的。对于新冠病毒来说，没有解决传染性问题的预测方案意味着我们不得不迅速关停整个经济，导致大规模失业，扰乱社会生活及学校教育。如果有可用的预测工具，并将其整合到一个运作良好的、灵活的系统中，就可以在不牺牲健康的情况下做出疫情防控决策，并会最大限度地减少整个社会承担的成本。我们在第六章讨论了这个问题。规则意味着我们给每个人提供相同产品或相同教育，而这限制了我们要做的决策和创造的价值。


    当寻找人工智能预测可能释放的新决策机会时，规则是我们的主要目标。就这场疫情而言，有工具可以生成所需的预测结果。快速抗原检测有助于填补人们是否具有传染性的信息空白。在从属程序方面也有创新，如病假工资和隔离。当决策相互作用时，从规则转化为决策需要一个灵活的协调系统。决策者需要知道其他人在做什么，协调他们的目标，并促成变革。然而，一个新系统可能会非常具有颠覆性，以至于你需要在新的组织中启用它，让它能够有机地发展，而不是试图在现有的组织中去调整它。


    从更广义的层面上来说，揭示不确定性是通过预测打开新决策的第一步。要有效地做到这一点需要改变从属程序，正如第二章中所指出的那样，这也是系统解决方案的定义。


    ## 本章要点


    - 我们采用了保持社交距离的规则来应对新冠肺炎疫情。这个规则的代价很大。它关停了大部分教育系统和医疗系统，并导致了全球经济的停滞。由此产生的隔离对心理健康造成的影响将需要几十年的时间才能完全消除。许多其他规则都是围绕保持社交距离的规则而建立的，如餐厅堂食容量限制、公共交通规则、学校教学方法、体育赛事限制、工资补贴和急救程序，等等。


    - 尽管大多数人将新冠病毒视为健康问题，但我们将其重新定义为预测问题。¹² 对于那些被感染的人来说，新冠病毒确实是一个健康问题。然而，对于绝大多数未被感染的人来说，新冠病毒并不是一个健康问题，而是一个预测问题。这是因为如果没有关于谁被感染的信息，我们就必须遵守规则，将每个人都视为可能被感染的对象，这导致了经济的停滞。相反，如果我们可以做出合理准确的预测，我们就可以只对那些很可能具有传染性的人进行隔离。当寻找人工智能预测可能释放的新决策机会时，规则是我们的主要目标。


    - 为了利用预测机器的优势，我们经常需要将规则转化为决策。然而，系统必须能够适应这种变化。如果一个规则与另一个规则紧密相连，以确保系统的可靠性，那么在这个系统中做决策可能是徒劳的。我们描述了一个与新冠病毒相关的例子，在这个例子中，我们开发了一个小型但灵活的系统，最初由
    12 家大公司组成，这些公司的首席执行官根据快速抗原检测对员工传染性的预测，指导他们的高级领导团队做出基于信息的决策。这使 12 家公司继续保持业务运营，而当时的系统很可能迫使它们停业。这一成功的例子随后激励了其他
    2000 多个组织采用这个系统，并从规则转向决策。


    ## 第八章


    ### 系统思维


    每年，参赛者都会聚集在布莱切利公园（二战期间，艾伦·图灵曾在此破解了德国密码），与计算机程序一决高下。这个比赛基于著名的模仿游戏（现称为图灵测试），参赛者通过计算机与一个看不见的实体对话。这个实体可以是计算机程序，也可以是一个人。每个实体都试图说服对方自己实际上是人类。正如作家布莱恩·克里斯汀所说的，如果你是一个参赛者，你实际上正试图成为“最像人的人”。通常情况下，人类会获胜，但很多人很难让对方相信自己是人类。


    赛马也与之类似，人类与机器智能对垒也是人工智能研究的重要内容。算法在识别图片内容上比人类做得更好吗？相较于由人驾驶的汽车，自动驾驶的汽车发生事故的概率更低吗？相较于人力资源部门，人工智能可以更好地筛选出求职者来进行面试，并录用他们吗？计算机能战胜围棋世界冠军吗？


    这些比赛让人们开始比较人与机器，并引发了关于机器是否会取代人类的焦虑。有趣的是，汽车比马快，但马仍然参加赛跑；当机器比人类快时，奥运会仍然顺利举行。为何当机器在下围棋方面比人类更优秀时，情况就有所不同呢？衡量指标能说明一些情况，但取代并不一定发生。


    当需要选择人或机器来完成任务时，情感或运动并不是选择标准。衡量指标是基于纯效率来评估性能的，并根据成本高低而产生替代。如果机器可以完成任务并且成本较低，那么肯定会替代人类。马可能仍然会参加比赛，但它们不再到处载人了。正如机器在体力劳动中取代人类一样，它们也可能会在认知方面取代人类。


    如今，一个完整的产业正试图逐项检查人们的工作，以评估在人工智能时代机器是否可以完成这些任务。与放射科医生相关的任务有 30 项（见图 8-1），² 其中，仅有一项任务与机器预测直接相关：演示或解释影像诊断程序的结果。


    每份工作都可以用这种方式进行拆解，并评估其被人工智能替代的概率。2013 年，牛津大学马丁学院的一项研究宣称，近一半的美国工作岗位容易被自动化取代。³ 这是对人工智能的最大担忧。埃里克·布莱恩约弗森、汤姆·米切尔和丹尼尔·洛克评估了
    964 个职业、18156 项任务和 2069 个工作活动对“机器学习的适用度”。结果表明，受到威胁的职业包括许多提供预测的工作，如前台职员（提供建议）和信贷审批员，这些我们都已经强调过了。按摩师、动物科学家和考古学家的工作尚未受到威胁。世界杰出的劳动经济学家和宏观经济学家担心，随着人工智能接管某些工作，对于人类工人，尤其是那些尚未处于收入分配顶端的人来说，剩下的工作机会可能就很少了。⁴


    人工智能浪潮已经推进了十年，而机器取代人类完成的任务少之又少。聊天机器人在客户服务中扮演着重要的角色，机器翻译在其领域所占的比重也在增加。但是技术性失业并没有即将到来的迹象，人们还有很多工作要做。虽然有些人工智能可以超过人类，但在许多情况下，人类——不管有多少缺点——仍然比机器替代品的成本低。因此，尽管像达龙·阿西莫格鲁和帕斯夸尔·雷斯特雷波这样的经济学家可能会认为，资本成本相对于劳动力成本来说得到了补贴，这只不过是因为时间问题，但现在我们都可以喘口气了。


