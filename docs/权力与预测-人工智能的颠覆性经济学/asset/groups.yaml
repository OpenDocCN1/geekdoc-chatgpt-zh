    好、更快、更便宜的预测和更恰当的判断。在《AI 极简经济学》一书中，我们讨论了亚马逊有机会改变其商业模式，从而在用户下订单之前就将商品送到用户的家门口。这种商业模式现在已经存在了，Stitch
    Fix 在服装方面就是这样做的。“正如其首席执行官卡特里娜·莱克所说：“我们通过将数据和机器学习与专家人士的判断相结合，进行独特而个性化的选择。”事实上，它并没有止步于此。在时尚行业中，库存的成本很高。数据科学团队开发了一种算法，将库存中货物的再购买决策与预期需求变化的预测结合起来。


    在第十一章中，我们阐明了机器之所以没有权力，是因为做出决策所需的判断始终来自人类，即使机器最终可能实施决策。在接下来的章节中，我们将讨论与预测“脱钩”后的判断技能。了解这些技能后，就可以解释预测和判断的“脱钩”是如何改变做决策的合适人选的。“脱钩”为人工智能的采用创造了新的机会，其核心就是加强与判断有关的技能。


    # 本章要点


    +   预测和判断是决策的两个重要组成部分。在决策树中，预测生成了树上每个分支情况发生的概率。判断生成与每个分支末端结果相关联的回报。通常情况下，我们在做决策时并没有意识到预测和判断是两个独立的输入，因为它们都存在于同一个人（决策者）的思想中。当引入人工智能时，我们将预测从人转移到机器，从而将预测与判断“脱钩”。这可能会改变做出判断的主体。


    +   我们时常做出决策，却从不考虑预测或判断，我们只是做决定。尽管我们在每次做决策时并没有明确思考预测和判断，但'
  - '[PAGE 194]


    可以在做出决策后通过分析技术来推断判断（我们称之为“显示性偏好”）。经济学家和市场营销人员长期以来一直使用统计工具来衡量基于选择的判断。


    +   决策是系统的主要构建模块。在引入人工智能之前，从系统设计的角度来看，预测和判断之间的区别是无关紧要的，因为这两个功能都发生在一个人的思想中。然而，人工智能改变了这一切。当我们将预测从人转移到人工智能时，我们可以重新思考系统设计。如果人工智能更快、更便宜，我们是否可以更频繁地进行预测？我们是否可以在不太重要的决策中使用它？我们是否可以对判断进行编码，从而让决策自动化和规模化？在之前的系统中，判断被限制在生成预测的同一个思想中，现在对于有卓越判断力的人，我们是否可以将做判断的职责分配给他们？新系统设计的机会非常大，因为人工智能在最基本的层面上创造了新的机会：决策组合。'
