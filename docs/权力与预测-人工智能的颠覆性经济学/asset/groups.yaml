    ## 在不做决策方面的投入


    乔布斯、扎克伯格或奥巴马真的不去决定他们日常穿什么吗？如果只看他们当天的穿着，是的；但如果看他们的所有穿着，就不是了。如果你每天都穿同样的衣服，那么你最好选择合适的着装。你不能选择那些在不同环境下穿起来不舒服的衣服，也不能选择对于很多场合都不合适的着装。要找到这样的穿着并不容易，每个人可能都花费了相当多的时间才做出最终选择。


    从这个角度来看，规则并不是没有做出决策，而是提前做出了决策。我们做计划时经常这样。很少有人在旅行前不预订住宿、选好回程航班并花费大量精力打包行李。经常旅行的人会把一些只用于旅行的物品提前准备好（如洗漱用品和充电器），这样就能减少打包时的认知成本。这实际上是管理何时以及多久做出决策的练习，让你通过预先投入来节省时间。


    当你将时间和精力投入在不做决策的方面时，随之形成的习惯就很难改变。如果它们让你感觉良好，你就不会认为你的习惯是可以通过决策来改善的。如果你的工作是开发人工智能，而其价值在于促使未做出的决策得以实现，那么你将面临一个艰巨的挑战，即想方设法地让人工智能被采用。


    与大多数企业和组织在不做决策方面所做的投入相比，公众人物在他们着装上的任何投入都显得微不足道。大多数企业和组织都不是“决策机器”，其核心是标准操作规程，它们是详细描述组织各个方面工作程序的文件。显然，它们因行业而异，但没有任何行业可以不用它们。


    标准操作规程除了省去重复做决策的麻烦，还在减少认知成本方面起到了预先投入的作用，类似于我们迄今描述的个人选择，同时它们还带来了另外一个好处：可靠性。当组织中的人们遵守规则时，他们所做的事情会让其他人的工作变得容易，而不需要进行诸如会议这类高成本的沟通活动。


    建筑行业通常将工作分解为更简单的任务，在施工进度表上，逐行和逐日列出每项任务的完成顺序。这些任务的结果是事先计划好的。现场的每个人都不必考虑自己的任务之外的事情。完成后，他们的唯一职责就是报告完成情况，并勾选标记，然后继续下一项任务。当然，也会有需要更改和审查的例外情况，但大体上，一切都按照计划进行。每个人各司其职，并在完成自己的任务时做好记录。


    这样的规则产生了可靠性，减少了不确定性和主动协调任务的需要。实际上，决策是必须提前做出并放在计划中的。但是，计划本身意味着对其做更改的成本很高。只要出现的问题不大，事情就可以继续进行。然而，出现一个严重的问题就可能会破坏计划。一套固定的标准操作规程可能很难改变和调整。正如我们将在本书后面讨论的，如果你想将人工智能引入这个经过精心调整的规则系统中，就会面临挑战。人工智能的目的是允许做出决策，但是一旦做出决策，协调就会变得很困难。


    ## 新的决策


    人工智能预测的意义重大，它会提供必要的信息，以便依靠预测做出决策，而不仅是依赖规则。


    新的决策取代了旧的规则，但旧的规则并不是孤立存在的。人们建立了结构和框架来保护这些规则免受不确定性的影响。整个企业和行业都致力于提供这种保护。因此，新的决策机会可能会被隐藏。我们面临的挑战在于认识到这一点，并找到这些被隐藏的决策，做出真正能够替代现有规则的新决策。接下来我们将探讨这个挑战。


    ## 本章要点


    - 规则是我们预先做出的决策。与遵守规则不同，做决策时，我们可以考虑决策的时间和地点等。因此，由决策产生的行动通常比由规则产生的行动更灵活，因为它们可以对情况做出反应。那么，为什么我们会使用规则而不做决策呢？因为决策会产生更高的认知成本。什么时候这个成本是值得的？那就是当后果严重且信息成本较小时。引入人工智能并不会改变后果，但它降低了信息成本。


    - 在人工智能系统的背景下，规则和决策之间的权衡至关重要，因为人工智能的主要优势是增强决策能力，所以对规则的贡献很小。人工智能生成预测，而预测是决策的关键。因此，随着人工智能变得越来越强大，它们降低了信息（预测）的成本，而且与使用规则相比，它们增加了决策的相对回报。因此，人工智能的进步将使一些决策摆脱遵守规则的束缚。


    - 规则不仅会产生较低的认知成本，还会提高可靠性。一个决策通常会影响其他决策。在决策相互依赖的系统中，可靠性是至关重要的。例如，大多数组织依赖标准操作规程，这些就是规则。标准操作规程减少认知成本并增强可靠性。如果你要使用人工智能预测将规则转化为决策，那么你可能需要重新设计系统来解决可靠性降低的问题。


    ## 第五章


    ## 隐藏的不确定性


    经济学家乔治·斯蒂格勒说过：“如果你从不错过航班，那说明你在机场待得太久了。”¹ 他说这句话是在几十年前，但他今天还会说同样的话吗？


    设计了韩国仁川机场新 2 号航站楼的建筑师希望斯蒂格勒不会。提前到达机场，你有很多事可做，而不仅是等航班。你可以去水疗中心、去赌场、去参观艺术展览、去观看舞蹈表演或者去滑冰。你也可以尽情购物、享用美食或在休息区小睡一会儿。对于新的机场航站楼来说，这不过是旅客的日常体验。新加坡最近建造了一个带有五层瀑布的花园。多哈则提供游泳池和儿童娱乐中心。温哥华有一个水族馆。阿姆斯特丹定期展出其著名博物馆的艺术品。²


    对于仁川机场的建筑师根斯勒来说，目标是将机场打造成“目的地”：


    对于新一代机场来说，航站楼不仅是一个飞机跑道入口。事实上，我们正在意识到一个新的现实：出于安全考虑，乘客会在航站楼内待得更久，这对于销量增长和声誉至关重要，而且能为机场创造新的可能性。这种认识使机场逐渐把航站楼当作“目的地”，而旅客可以在其中消费。³


    接受这一现实吧，斯蒂格勒。如果你只是想在机场待会儿，那你就不能在那停留太久。现在情况是这样的：


    “乘客在机场停留的时间比 10 年前多了近 1 个小时。”从事机场设计的芬特雷斯建筑事务所的建筑师和负责人汤姆·西奥博尔德说。他指出，尽管航空旅行发生了巨大变化，但人们往往在
    20 世纪六七十年代建造的机场里花费了更多时间。⁴


    但什么才是最重要的呢？到了今天，航站楼才被设计成“目的地”。尽管机场还是以前的样子，但人们在那里花费的时间更长了。这是人们的选择。为什么？因为赶飞机变得更有不确定性。其中包括交通、停车和安全检查等问题。乘坐飞机本身涉及改签费、超额预订、中转和争抢行李架等问题。准时赶上航班变得更加困难，而未能如期赶上航班的后果也更严重。因此，即使没有九洞高尔夫球场（去曼谷看看），你可能也会想提前到达机场，哪怕就在那里读本书。⁵
    然而，随着一个个新的便利设施出现，你忘记了为什么要提前一个小时到达机场。提前到达已经成了你的新习惯。


    回想一下，这种情况是多么奇怪。自 1992 年以来，仁川已经耗资 100 亿美元扩建机场。其中大部分费用被用在建造安检线之后的充满挑战性和扩张性的航站楼。但是仁川机场的声明及目标是“确保航空运输顺畅”，⁶
    你不会看到一个机场宣称在做运送旅客之外的其他事情。然而，那些设计机场的人正在思考如何让人们更久地停留在机场。如今，约 40% 的机场收入来自非航空收费，其中最大部分是零售商的租金。设计师正在尽力确保机场能够创造更多收入，并在此过程中让每个人意识不到他们在机场花费了更多时间。


    现代机场是所谓的“隐藏的不确定性”的代表。当人们没有获得做出最佳决策所需的信息（如何时出发去机场）时，他们就会遵守规则。航空旅行以及进出机场的方式在发生变化，这些变化让你更愿意选择遵守规则，使你在机场停留的时间更长。机场知道，如果候机是不愉快的，那旅行也将变得不愉快，你就会减少旅行次数。因此，在对基础设施进行大规模投资时，机场不仅会考虑如何让人们到达那里，还会考虑如何使候机变得更加愉快，并从中赚钱。一旦你提前到达机场，你就会愿意为一顿饭或其他活动掏钱，就像在进入电影院之前，即使是一桶“天价”爆米花也非常诱人。如果你没有感受规则的代价，并且很少错过航班，你就不会反思自己的规则和习惯。不确定性变得次要，而决策的结果，最终以气派的新建筑和令人惊叹的五层瀑布的形式展现出来。


    在寻找利用人工智能做出新决策的机会时，如第四章所述，你应该仔细审视规则，并看看它们是否可以转变为利用人工智能来主动接受不确定性的决策，而不是忍受不确定性。在本章中，我们将表明规则不仅体现了通过人工智能来做新决策的机遇，而且还有用于隐藏不确定性的结构和框架，这会导致我们在采用规则时产生浪费并效率低下。规则不仅标志着人工智能存在机遇，还代表着这种机遇的重要性。事实上，对于机场来说，一些非常简单的人工智能应用程序已经对它们当前的一切构成了威胁。


    ## 另一个机场宇宙


    在分析人工智能预测可能对机场构成的威胁之前，与其他事物一样，有一个替代系统可以向我们展示另一种情况。例如，在另一个宇宙，住着一群非常富有的人。他们不乘坐商业航班，因此没有机会接触旧的或新设计的公共机场航站楼。相反，他们乘坐私人飞机并通过私人航站楼出行。一般而言，华丽、迷人、漂亮的餐厅和艺术馆都是富人经常出入的场所。但在机场的世界中，私人航站楼却非常简朴。


    之所以没有投资让私人航站楼变得更好，是因为困扰其他人的不确定性并不困扰富人。若乘坐商业航班，你就必须遵守时间，迟到的旅客将被留在机场；若乘坐私人飞机，你的时间安排会更加灵活，甚至可能不受时间限制。如果旅客没有登机，飞机就不会起飞；如果旅客提前登机，飞机就会提前起飞。整个系统的设计是为了避免候机，至少对于旅客而言是这样的。没有候机就意味着无须投资航站楼让候机变得愉快。与此同时，富人没有关于何时需要离开机场的规定。他们想什么时候离开就什么时候离开。如果更多的人可以有这种体验，那么最好的航站楼肯定比大教堂还要简朴。


    不过，你无须等到变得富有才会看到这个替代系统，只需比较在到达口与登机口处所看到的世界即可。你会发现到达口是简朴的，你可能会找到一些快餐店，但其他一切设施都是为了让你尽快离开机场。特别是出租车和停车设施离机场非常近，即使你可能没有着急赶时间。除了如何最快地离开机场，你还记得机场到达口的其他哪些细节吗？


    ## 人工智能对机场的威胁


    机场对人工智能并不陌生。航空交通管制已经采用基于人工智能的系统来更好地预测飞机到达和拥堵情况。目前，荷兰南部的埃因霍温机场正在试运行一个新的人工智能行李处理系统，旅客只需对他们的行李拍照，最后在目的地取走——无需任何行李标签。⁹
    在符合隐私要求的前提下，该系统希望也能对旅客进行类似管理。¹⁰ 所有这些都将帮助你更快地坐上飞机。


    然而，这些措施并未解决你乘坐飞机时面临的不确定性问题——交通和安全。不过，在交通问题方面，已经发生了变化。例如，Waze 等导航应用程序会考虑交通情况，并根据具体的出发时间合理预计到达机场所需的时间。虽然这些应用程序并不完美，但它们在变得越来越好。


    规则会告诉乘客他们需要提前多久前往机场，而这些应用程序让乘客无须再遵守规则。相反，他们可以将航班时间添加到日历中，应用程序会告诉他们最佳出发时间，并据此安排行程。另外，在不久的将来，不确定的航班实际起飞时间也将被考虑在内。应用程序将不仅根据既定的出发时间告诉你需要何时出发，而且会根据预测的航班实际起飞时间提醒你。虽然这仍存在不确定性，但这一进步——从没有信息到获得更精确的信息——可以节省人们数小时的候机时间。同样，许多优步用户以前认为自己并不在意出租车预计到达时间，但现在却将这一信息视为该服务最有价值的功能之一。当前，优步正在使用人工智能进行预测。


    人工智能还可以预测安检排队等待的时间。综合考虑所有因素，你可以使用人工智能决定何时出发去机场，而不是依靠规则。与其他事物一样，总有一些人会在他人之前跃跃欲试。在仁川和许多其他机场，候机已经不是什么坏事了，所以你无须做出明智的决策。


    一些人在开发人工智能导航应用程序或航班出发预测程序，他们与机场航站楼内的活动收益没有直接利益关系。然而，他们的人工智能应用程序的价值在很大程度上取决于有多少人不想在机场候机。因此，如果目前机场的候机成本较低，那么这些应用程序的价值就会降低。


    安检预测则是另一回事。机场声称希望缩短安检时间并减少不确定性。但作为经济学家，我们认为机场的动机与乘客并不一致。缩短安检时间的确可以留出更多时间，机场希望乘客在通过安检后去消费。但与此同时，这将减少不确定性，从而乘客可以不那么早到达机场。叠加人工智能解决了乘客到达航站楼的其他不确定性问题，机场会想在其可控制范围内消除不确定性吗？


    ## 顺应规则


    从更广泛的角度来说，我们的观点不仅适用于机场，也适用于规则。规则的产生是因为承受不确定性的代价很高，但规则也会带来一系列问题。


    科技作家克莱·舍基提出的所谓“含基原则”指出，机构会努力维持与其解决方案相对应的问题。企业也是如此。如果你的业务是为候机的人们提供帮助，那你为什么要确保他们不需要候机呢？


    如果你希望通过人工智能技术创造新的决策机会，你就需要冲破那些保护规则免受不确定性后果影响的壁垒，然后去寻找更容易承担这些成本的活动，或者减少规则必须容忍的不良后果。


    我们可以在英国农民长期采用的保护措施中看到这一点——修建树篱。树篱是一种需要精心规划种植的坚固树木和植物，常被用作田地之间的隔离墙。如果你的田地里有家畜，并且不想雇人来确保它们不会走失，那么树篱是非常有用的；如果你不想让暴雨过快地侵蚀土壤，或者想保护农作物免受强风侵袭，那么树篱也是很有用的。采取所有这些降低风险的保护措施就是“对冲”一词的起源，我们对此丝毫不感到意外，后来该词的含义逐渐演变，在保险方面有了更广泛的意义。


    但修建树篱也是有成本的。通过划分农田，它们让某些耕作技术（包括机械化）只有在大面积土地上才能有效使用。二战后，英国政府实际上对清除树篱采取了补贴措施，尽管在某些情况下，由于树篱在风险管理中的作用，这种清除是过度的。如今，在威尔士亲王（现英国国王查尔斯三世）的领导下，出现了一场恢复树篱的运动。¹²


    在许多情况下，大量投资会被用来保护潜在的决策者免受风险影响。数千米的公路都被防护栏围住，以防止车辆冲下堤坝、山丘或进入逆行车道。幸运的是，大多数情况下它们没有被用到，但每一个防护栏都使道路以更安全的方式建设，因为人类驾驶员有时不太可靠。


    更宽泛地说，建筑规范精确规定了各种措施，以保护建筑物内的人员免受不确定事件的影响。这些事件包括火灾，以及天气、建筑地基和其他自然现象（如地震）造成的损坏。


    这些保护措施的共同点是，它们通常产生了看似过度设计的解决方案。它们被设计用于特定的事件——一生罕见的暴风雨或百年一遇的洪水。当这些事件发生时，这些工程似乎是值得的；但在没有发生这些事件的情况下，我们就有理由去怀疑工程的必要性。多年来，《魔鬼经济学》的作者史蒂芬·列维特和史蒂芬·都伯纳指出，飞机上的救生衣和救生艇（更不用说安全演示）似乎是一种浪费，因为成功降落在水面上的飞机非常少。¹³
    然而，2009 年，萨伦伯格机长成功地将一架引擎失灵的美国航空公司的飞机降落在哈德逊河上。这个低概率事件的例子是否表明预防性救生衣是必要的呢？这很难说。但我们不能因为不存在某种可能的结果，就认为该结果的概率为零。


    列维特和都伯纳的主要观点是，在采用保护措施时，尽管通常可

