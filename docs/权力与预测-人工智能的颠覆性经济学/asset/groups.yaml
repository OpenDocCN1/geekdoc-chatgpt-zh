- raw:
  - '[PAGE 171]


    使用你每次解锁时提供的图像来更新算法。这一切都可以在手机上完成，因为所有的训练数据都与你有关。在其他情况下，训练数据需要从多个用户那里更新输入数据和预测结果。隐私问题可能会变得日趋严重，并且在协调来自多方面的信息时，也许会遇到挑战。


    总之，要与预测竞争，你需要从好的算法和输入数据入手。但在许多情况下，你还需要获取反馈数据。显而易见的是，你的数据策略将决定你能否持续性地参与竞争。在某些情况下，可能存在明显的先发优势，因为高质量的预测会吸引更多的用户，同时又会产生更多的反馈数据，从而改进你的预测并吸引更多的用户。那些没有收集反馈数据并将其纳入设计中的竞争对手可能无法迎头赶上。反馈循环可以创造先发优势。


    # 最小可行性预测


    这些先发优势取决于进入市场所需的预测准确度。在工业经济中，工厂通常以最小规模建造，这样才能具备足够的成本竞争力，从而进入市场。这是因为在制造业中，平均单位成本通常随着工厂规模的扩大而降低，直到达到某个临界点。这个临界点被称为“最小有效规模”。


    许多人工智能也面临着最小有效规模的问题。然而，这种规模不是基于工厂产能，而是基于训练数据，并且阈值的度量标准也不是单位成本，而是预测准确度。人工智能市场的成功取决于其预测准确度。为了使其有效，预测必须足够准确以满足商业需求。阈值预测准确度可能由法规（如基于人工智能进行诊断的医疗决策所需的最低预测准确度）、可用性（如电子邮件自动回复服务所需的最低预测准确度，以保证电脑屏幕有限资源的成本）或竞争（如进入现有市场所'
  - '[PAGE 172]


    需的最低预测准确度，在搜索引擎市场则是与谷歌和必应竞争）来设定。


    编写准确的人工智能程序并不需要对实物资产进行巨额投资，软件并不是资本密集型行业，其主要的障碍是数据。人工智能需要足够的数据来变得准确。收集数据以达到最小有效规模需要花费时间和精力。首先推出的优势取决于投入多少精力才能获得商业上可行的预测。


    有时候并不需要太多的努力。在互联网搜索的早期，我们对错误的容忍度很高。搜索引擎提供多个链接，用户浏览这些链接并从中选择最适合的。搜索引擎显示一个不相关链接所造成的损害很小。在商业互联网的早期，这导致许多不同的搜索引擎出现，每个搜索引擎都有自己的方法来确定最佳的搜索结果，竞争非常激烈。


    相比之下，在自动驾驶车辆中，我们对错误的容忍度很低。只有当人工智能比人类更可靠时，我们才能把人类的生命托付给它。第一家构建这种人工智能的公司将面临很少的初期竞争，因为构建这样一种人工智能所需的数据规模很大。这有一定的紧迫性，因为一旦人工智能达到最小有效规模，它就可以开始产生预测回报。


    然而，如果市场增长迅速，这种达到最小有效规模的先发优势将是短暂的。其他公司只需获取足够的数据来建立超过最低阈值的预测，就能进入市场。最小有效规模并不足以让先行者产生持续优势。


    原因在于，在技术上，数据的规模回报是递减的。第 10 次观察能比第 100 次观察获得更多信息，甚至第 100 次观察能比第 100 万次观察获得更多信息。随着观察次数的增加，每次新观察对预测质量的影响会越来越小。


    要让数据产生长期优势，先行者需要利用更重要的经济力量来支持它们：反馈数据。通过在实际操作中收集反馈数据，它们可以直接'
  - '[PAGE 173]


    改进预测，使其他公司难以赶上。优势并不在于它们推出预测时其他公司无法这样做，而在于推出预测后它们可以收集反馈数据。


    推出预测还促进了对计算机硬件和人才的投资，从而可以充分利用数据。早期参与者之间的竞争加速了这种投资，提高了质量，使其他公司难以与之竞争。在许多技术密集型行业都存在早期市场领头人能够主宰一个行业的现象。随着成熟企业改进其产品，与成熟企业竞争所需的学习和研发投资变得令人望而却步。例如，过去有许多商用飞机制造商。而如今，要想创办一家可以在性能、安全性和成本效益方面与波音和空客竞争的飞机制造商，可能需要花费数百亿甚至数千亿美元。


    伦敦政治经济学院的教授约翰·萨顿在他的《技术与市场结构：理论和历史》一书中提到了许多这样的例子，如制药、半导体，以及液相色谱法。技术的不断改进意味着最小有效规模随时间的推移而扩大。这种扩大（萨顿称之为“内生性沉没成本”）可能形成长期的市场力量，从而使先行者获得巨大的回报。


    在线广告和搜索领域就出现了这种情况。与黄页或报纸相比，谷歌可以非常精准地预测谁在何时想要什么，这样就可以投放定向广告。通过将广告与购买行为联系起来，谷歌可以从反馈循环中获益，使系统了解每个预测是否准确，并为下一次预测更新模型，这就让任何新的参与者都难以迎头赶上。尽管在
    20 世纪 90 年代推出搜索引擎的最小有效规模相对较低，但谷歌不断改进对硬件、人才和数据的投资，导致新的搜索引擎难以进入今天的市场。


    # 快速反馈循环


    如果你能尽早将你的人工智能推向市场，那么人工智能就可以从'
  - '[PAGE 174]


    客户那里收集数据。这些数据将使预测变得更准确，产生积极的反馈循环，并对其他竞争对手造成进入壁垒。如果反馈循环足够快速，早期的领先优势就会加速形成，并且这些数据将持续产生更好的预测。


    这样，预测机器增加了传统意义上的人类优势——它们可以从结果中学习。人工智能从学习中获得优势的程度与反馈延迟有关。在预测人寿保险的死亡率时，反馈可能会延迟几十年。在这种情况下，由于反馈循环很慢，公司在预测死亡率方面的早期领先能力将受到限制，无法维持其领先优势。但是，如果在生成预测后能够快速生成反馈数据，那么早期的领先优势将随着时间的推移转化为更大的领先优势，从而实现持续的竞争优势。


    当微软在 2009 年推出必应搜索引擎时，必应得到了公司的全力支持。微软对其进行了数十亿美元的投资。然而，十多年后，必应的市场份额在搜索量和搜索广告收入方面仍远低于谷歌。必应难以赶上的一个原因是反馈循环。²
    在搜索中，预测（根据查询显示具有多个建议链接的页面）和反馈（用户点击其中一个链接）之间的时间很短，通常只有几秒钟。在这种情况下，反馈循环非常强大。谷歌多年来一直在运营基于人工智能的搜索引擎，拥有数百万用户和每天数十亿次的搜索。谷歌收集了更多的数据并能快速了解用户偏好，新内容不断上传到互联网，因此搜索领域不断扩大。每当用户进行查询时，谷歌提供其对前
    10 个链接的预测，然后用户从中选择最佳链接。这使谷歌能够更新其预测模型，根据不断扩大的搜索领域进行持续学习。由于有更多用户所提供的训练数据，谷歌能够比必应更快地识别新事件和新趋势。最终，快速的反馈循环，叠加对补充性资产（如大规模数据处理设施）的持续投资，使谷歌保持了领先地位，而必应从未赶超。这也意味着任何其他试图与谷歌和必应竞争的搜索引擎甚至无从下手。像
    DuckDuckGo 这样的搜索引擎，为了隐私而放弃了个'
  - '[PAGE 175]


    性化服务，专门为重要的小众市场服务。


    快速反馈循环会造成竞争，因为如果你的竞争对手已经从这样的循环中受益，它们的预测会迅速改进。快速反馈循环放大了萨顿所说的内生性沉没成本，如果你落后得太多，可能就无法赶上。想象一下第一个能够安全驾驶汽车穿越纽约市的人工智能。一旦该人工智能获得监管批准，它就将继续收集数据并变得越来越好。当第二个人工智能获得批准时，它不会拥有相同数量和质量的数据，因此不太可能表现得那么好。由于没有真正的成本优势，并且预测质量也不高，次优的人工智能的消费者价值会较低。


    因此，快速反馈循环会导致竞争加剧。先行者可能有很大的优势，所以公司会积极投资，以便快人一步。从这个角度来看，对那些似乎还不够成熟的人工智能进行大规模投资更具意义。例如，通用汽车以约
    10 亿美元的价格收购了自动驾驶创业公司 Cruise，尽管该公司似乎只有一个原型设备和几十名员工。³ 为何通用汽车要付出如此高的代价？一旦开始运行，在存在快速反馈循环和内生性沉没成本的情况下，对于任何后来者，追赶都会无比困难。


    # 差异化的预测


    竞争的产品通常是有差异的，它们往往吸引不同的客户群体。例如，可口可乐和百事可乐销售不同口味和品牌形象的竞争性可乐，宝马和奔驰销售不同风格和功能的竞争性豪华汽车。这些品牌形象和特色吸引不同的人群。在这种情况下，很难定义哪一个“更好”，可口可乐并不比百事可乐更好，它们只是略有不同。当产品有差异时，就给竞争者留出了空间，而不是一家独大。自可口可乐和百事可乐在一个多世纪前上市以来，许多成功的新型软饮料（如红牛和诚实茶）找'
  - '[PAGE 176]


    到了独特的小众市场并蓬勃发展。


    与之类似，人工智能将吸引不同的群体。想象有一家希望用聊天机器人替代其呼叫中心的公司。一旦聊天机器人足够好用，就会有很多方法来定义“更好”的聊天机器人。不同的公司会有不同的需求：第一家公司可能希望聊天机器人高效、快速地回答客户的问题；第二家公司可能更关注销量，将收到的查询转化为新的收入；第三家公司可能希望聊天机器人具有安抚作用，使人们放松并缓解愤怒等情绪。或许正是因为有了这些不同的方法来定义“更好”，才有了包括小企业在内的许多聊天机器人公司，它们找到了独特且能盈利的小众市场。


    与此相关的一个例子是黑色素瘤检测。⁴ 在欧洲构建的人工智能过度依赖来自肤色较浅的人的数据，而在亚洲构建的人工智能则使用亚洲患者的数据库，这些人工智能是有差异的。对于白种人来说，欧洲的人工智能更好；而对于亚洲人来说，亚洲的人工智能更好。尽管“更好”通常意味着“更准确”，但这些人工智能之所以不同，是因为在一个环境中准确，而在另一个环境中就不一定准确了。


    与软饮料、聊天机器人和黑色素瘤检测不同，许多人工智能仅能通过预测质量来区分。所谓“更好”的预测意味着可以进行衡量。当质量定义明确时，就像在其他行业一样，最高质量的产品往往受益于更高的需求。在大多数行业中，更高的质量意味着更高的成本，卖家往往通过降低价格来销售质量较差的商品。但对人工智能而言，这将变得困难。人工智能以软件为基础，这意味着，一旦模型建立起来，产生一个高质量预测的成本与产生一个低质量预测的成本是相同的。如果更好的预测成本与更差的预测成本相同，就没有理由购买低质量的预测。


    正如我们之前提到的，谷歌拥有更多的数据，并从快速反馈循'
  - '[PAGE 177]


    环中受益。但这并不足以创造优势。用户很清楚，什么是更好的搜索。谷歌和必应在常见搜索中提供类似的结果。在谷歌或必应中输入“天气”这个词，结果很可能是类似的。必应失败的地方在于不常见的搜索。输入关键词“颠覆”，（截至撰写本书时）必应的第一页只提供了字典定义，而谷歌提供了定义以及有关颠覆性创新研究的链接。尽管必应在某些方面赶上了谷歌，但在很多方面还没有，而且必应没有在任何一个领域表现得更加卓越。在搜索中，“更好”的意思是找到用户更有可能点击和停留的链接。这对所有用户都是这样，尽管对每个人来说，最佳链接可能是不同的。在明确定义了预测和有了快速反馈循环的基础上，必应无法在差异性方面取得足够的突破以获得大量市场份额。


    # 反馈系统


    反馈循环是有意构建的。能够预测反馈价值的人工智能可确保收集到结果数据。在第六章中，我们讨论了一个人工智能系统解决方案，用于预测个人在特定日子的最佳学习内容。这将实现教育个性化，使学生能够按照适合自己的节奏学习，并使每个人都学到更多知识。我们讨论了在师资配置和社会发展方面的系统层面挑战。反馈循环表明需要进一步进行系统层面的改变。人工智能需要学生的表现是否得到改善的数据，人工智能越早获得这些数据，效果越好。挑战在于如何设计学术课程，以确保学生深刻理解和记住概念，同时保持足够快的反馈循环以改进人工智能。这将需要破除影响获取学生数据的监管壁垒，并在保护学生隐私方面保持技术进步。与个性化教育的人工智能系统解决方案的其他部分一样，其反馈部分还没有准备好。虽然点解决方案的人工智能可以生成预测，但作为一个行业的人'
  - '[PAGE 178]


    工智能先行者，其力量是反馈的结果。人工智能必须能够获取结果数据以进行学习。比如，自动驾驶的人工智能需要获取事故数据，每个自动驾驶系统都会确保获得这种反馈。幸运的是，故事是罕见的。为了保持良好运行，自动驾驶系统需要获得险些发生的事故数据。这样的数据越多，它就能学得越快。这需要一个能识别险些发生事故的系统，然后建立一个学习过程，以避免将来发生这样的事故。但只避免事故是不够的，乘客的舒适度也很重要，因此，为早期参与者带来优势的人工智能系统解决方案也将从衡量舒适度的方式中受益。人工智能可能需要从多个结果指标中学习并衡量这些指标。


    # 胜者为王


    预测机器的潜力是巨大的。反馈循环意味着早期进入者具有真正的优势。早期进入意味着获取更多的数据，更多的数据意味着更好的预测，更好的预测意味着更多的客户，反过来又带来了更多的数据。反馈循环创造了一场大规模部署人工智能的竞赛。


    但要记住，预测就像精确设计的产品，需要高度适用于特定的目标和环境。公司通过区分不同的环境和目标，即使只是一点点区别，也可以创造一个有竞争力的空间。系统中收集与使用数据的细节里存在着魔鬼，也可能是天使。


    # 本章要点


    +   - 尽管利用人工智能进行系统层面的创新面临挑战，但有充分的理由尽早启动它：因为人工智能会学习，所以它为先行者提供了优势。越早部署，它就能越早开始学习；它学习越多，预测'
  - '[PAGE 179]


    就会越准确；它变得越好，新系统就会越有效。


    +   人工智能是软件。一旦构建了人工智能模型，再产生预测的边际成本就接近于零。如果一个人工智能在市场发展初期比其他人工智能略胜一筹，那么就会有更多的用户转向使用该人工智能的系统。有了更多的用户，人工智能就会从更多的反馈数据中受益；有了更多的反馈数据，人工智能就会产生更好的预测结果，更好的预测就会吸引更多的用户，以此循环往复。一旦飞轮开始旋转，起初只有少许优势的人工智能就能随着时间的推移形成巨大的优势。先行者能获得的巨大优势会导致竞争。公司会积极地投资，因为成为先行者的奖励是如此丰厚。


