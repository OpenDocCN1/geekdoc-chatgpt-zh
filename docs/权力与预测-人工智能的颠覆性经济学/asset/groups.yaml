    1/3 的内容专门在讲虫害防治。16 农民需要花费相当多的时间来进行这项工作。他们检查植物，清除积水，消毒工具并使用杀虫剂。管理温室所涉及的大部分工作都是为了保护温室免受害虫侵入或减少害虫的影响。


