    确定决策之后，就是深入研究的时候了。为了做出决策，你需要收集什么信息？这不仅包括你拥有或可以轻易获得的信息，而且包括你可以想象到的重要信息。大多数决策是在不确定的情况下做出的。然而通过预测，你就可能拥有做出更好决策所需的信息。预测是人工智能可能提供的东西，因此这个练习将预测与组织中的核心决策联系起来。


    总之，没有完美的预测。如果你拥有完美的预测，做决策将变得容易，并且有可能实现自动化。尽管画布是一个相对理想的工具，但它的工作并不是不切实际的。因此，对于每个决策，你需要阐明所涉及的主要权衡项。事实上，我们提倡使用一个“错误框架”。如果我们的预测错误或不存在，我们可能犯什么样的错误？这会让你了解到决策的风险程度。在第四章的雨伞选择中，如果你的天气预报错误，你要么带了多余的伞，要么被淋湿了。你的判断就是如何对这些错误进行排序。对于画布上的每个决策，你都需要确定犯错的后果，并通过明确计算成本或以其他更主观的方式对它们进行排序。


