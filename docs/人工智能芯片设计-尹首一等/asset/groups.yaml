    此可以看到，与其他数据复用模式相比，行固定模式的优点在于它能够最大化卷积计算中所有数据（权重数据、输入数据及输出数据）的重用，而不是其中的某一种，因此与单一类型的数据复用模式相比，能够更好地利用低成本存储访问来提升能效。根据实验数据显示，Eyeriss
