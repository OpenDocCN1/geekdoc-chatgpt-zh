    在 Tinker 架构的 PE 阵列中，每个 PE 内部的核心运算部件——MAC 都支持位宽自适应；每个 PE 本身都支持多种不同类型的神经网络算子重构；PE
    阵列还可以按需动态划分为不同功能的子阵列，以灵活高效地支持多种不同类型网络层的计算任务并行。此外，Tinker 架构还可以支持根据不同的网络结构重构计算模式，通过数据复用最大化使数据不必要搬移带来的性能以及功耗损失最小化，提升整体能效。


    # 1. 位宽自适应 MAC


    为了提高计算效率和资源利用率，可重构阵列内每个 PE 中的 MAC 都采用位宽自适应设计，包含两个 8×16bit 乘法器，支持根据配置字重构实现 8bit/16bit
    两种混合精度运算。即当配置为 8bit 模式时，两个 8×16bit 乘法将并行处理。否则，两个乘法器组合为一个 16×16bit 乘法器，以支持 16bit
    操作。根据配置，未使用的数据通路都采用时钟门控以降低功耗。'
