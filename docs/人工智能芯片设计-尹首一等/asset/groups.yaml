    # 1) Sigmoid 函数


    Sigmoid 函数也称 Logistic 函数，其函数定义为


    f(x) = \frac{1}{1 + e^{-x}} (2-3)


    它近似为线性函数，值域为[0,1]，当输入值靠近两端时，对输入进行抑制，趋向饱和。Sigmoid 函数主要有三个缺点：一是其输出恒为正值，不是以零点对称的，导致权值只能朝一个方向更新，使得收敛缓慢；二是需要进行指数计算，比较耗费计算资源；三是其饱和特性导致梯度消失，会使得网络变得很难学习。


    # 2) tanh 函数


    tanh 函数是 Sigmoid 函数的改进版，和 Sigmoid 函数有异曲同工之妙，都是研究早期被广泛使用的 2 种激活函数。


    f(x) = tanh(x) (2-4)


    它由双曲正弦 sinh 和双曲余弦 cosh 相除得到，其值域为[-1,1]，克服了 Sigmoid 函数非 0 均值的缺点，不容易出现 loss 值晃动，收敛速度快。但是它和
    Sigmoid 函数一样，都是饱和型函数，会导致梯度消失的问题。而且，2 个函数的计算量都是指数级的，计算相对复杂。


    # 3) tanh 线性逼近函数


    tanh 线性逼近函数是 Sigmoid 函数的简化，主要目的是将 Sigmoid 的非线性区域线性化，常用于硬件电路的设计实现中，它的表达式为


    f(x) = \begin{cases} -1, & x < -1 \\ x, & -1 \le x \le 1 \\ 1, & x > 1 \end{cases}
    (2-5)


    # 4) ReLU 函数


    ReLU 是修正线性单元（Rectified Linear Unit）的缩写，是 Krizhevsky、Hinton 等在 2012 年的论文 ImageNet
    classification with deep convolutional neural networks 中提出的一种线性且不饱和的激活函数，其特点是更为接近生物神经的开关阈值状态，表达式为


    f(x) = max(0, x) (2-6)


    ReLU 函数只有线性关系，不需要指数计算，无论前向传播还是反向传播，计算速度都比 Sigmoid 函数和 tanh 函数快。而且它具有很好的稀疏性，显著减少了计算量。此外，当
    x > 0 时，其导数为 1，在一定程度上缓解了神经网络的梯度'
  - '[PAGE 18]


    消失问题，有利于加速梯度下降的收敛速度。其缺点是：其导数在零点左侧为 0，训练时容易使得神经元死亡。


    激活函数的选择很多，上面只介绍了其中几种比较典型的函数。Sigmoid 函数虽然各点可导并且导数容易求解，但是存在梯度饱和的问题，后来的 ReLU 函数解决了梯度饱和的问题，但是出现了神经元坏死和非对称的问题，随后演化出的各种
    ReLU 函数的变形都是着眼于解决这个问题而提出的，虽然 ReLU 函数存在着一些问题，但是其导数非常简单而且只需要一个比较器就可以实现，因此已成为目前最常用的激活函数。


    # 2.2.3 人工神经网络


    人工神经网络(简称神经网络)，是一种模仿动物神经网络行为特征，进行分布式并行信息处理的算法数学模型，它以人工神经元(感知器)为节点，按不同的连接方式构成神经网络。如图
    2.6 所示，多个感知器并列连接构成一个神经网络层，多个神经网络层按顺序排布组成最简单的神经网络——多层感知器(Multi-Layer Perceptron,
    MLP)。图 2.6 中任意两个感知器之间的直线表示它们之间相互连接并相互依赖，连接的依赖程度就是权重。多层感知器包括一个输入层、至少一个隐藏层和一个输出层。图
    2.6 中从左至右依次显示了输入层(层 1)、隐藏层(层 2)以及输出层(层 3)。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_18_0.png)


    图 2.6 多层感知器示意图


    构建神经网络的主要工作就是不断调整整权，使得网络推断(或者预测)误差最小化的过程，这个过程就是神经网络的训练过程。简单来说，训练过程是指在已有数据中学习，获得某些能力的过程；而推断过程则是指对新的数据，使用这些能力完成特定任务(如分类、识别等)的过程。训练一般基于前向计算(Forward
    Pass)和后向计算(Backward Pass)实现。前向计算是指从输入层到输出层逐层计算输出的过程。后向计算是网络根据实际输出和期望输出之间的误差，反向进行网'
