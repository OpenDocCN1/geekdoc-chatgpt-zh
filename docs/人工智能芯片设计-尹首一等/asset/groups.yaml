    # 第 9 章 总结与展望


    # 9.1 本书内容总结


    短短几年，神经网络的应用取得了爆炸式增长。目前已广泛用于各种 AI 应用，包括计算机视觉、语音识别和机器人技术等，在有的领域甚至取得比人类更高的准确性。但是，神经网络能够提供如此出色的准确性是以计算复杂度为代价的。因此，能够经济高效地实现智能计算，在提高能源效率和吞吐率的同时又不牺牲准确性的人工智能芯片设计技术，对于支撑人工智能持续飞跃式发展至关重要。


    本书不仅介绍了人工智能和神经网络相关的基本概念和基础知识，还详细分析了人工智能芯片设计面临的各种挑战，以及各种人工智能芯片的发展现状与存在的问题，由此引出关于人工智能芯片计算架构、数据复用、网络映射、存储优化以及软硬件协同设计等关键技术的最新研究成果的探讨。书中探讨的所有技术在实际应用过程中应综合考虑，深刻理解它们之间的相互作用，在设计中力求做到硬件/算法共同优化，才能获得更佳的创新机会和设计应用效果。


    # 9.2 未来展望


    通过对人工智能算法以及芯片的现状进行分析，未来的人工智能芯片设计将朝着以下方向发展。


    +   (1) 可重构计算：随着网络模型的复杂度不断增加，对于计算硬件的要求也越来越高。可重构计算架构允许硬件架构功能随着软件变化而变化，灵活地适应新的算法、架构和任务，兼具
    CPU/GPU 的通用性、ASIC 的高性能和低功耗、可按需更迭设计且开发周期短。随着神经网络算法的飞速发展，可重构智能计算架构将朝着超高能效方向发展，在能效要求苛刻的多样化边缘人工智能应用中大显身手。


    +   (2) 计算存储一体化架构设计：深度学习算法负载通常都具有数据密集型的特点，需要大量的存储和各层次存储器间的数据搬移，导致冯·诺依曼体系结构的“内存墙”问题更加突出。为了弥补计算单元和存储器之间的差距，学术界和工业界正在计算存储一体化的两个方向上进行探索：①富内存的处理单元，增加片上'
  - '[PAGE 151]


    存储器的容量并使其更靠近计算单元，使得数据计算单元和内存之间的数据移动成本(时间和功耗)显著减少；②具备计算能力的新型存储器，直接在存储器内部(或更近)实现计算。这种方法也被称为存内计算或近数据计算。因此，计算存储一体化架构设计也将是未来的重要发展方向。


    (3) 软硬件协同的模型压缩：由于神经网络本身庞大的数据量以及对片上存储资源的高要求，在算法优化层面，研究者考虑对神经网络模型进行压缩处理，如量化、稀疏化等。卷积神经网络本身对低比特处理的鲁棒性高，也就为模型压缩处理带来了极大的发挥空间。无论前向推理还是后向传播的过程中，都可以引入稀疏化、量化等方案。针对不同的神经网络算法，怎么设计合理的压缩方案，如何控制压缩力度的边界，计算量和精确度之间如何折中，都值得探究。也正因此，如何对压缩后的具备一定规则的神经网络模型进行高效的片上推理运算也将成为未来的重要研究方向。


    (4) AutoML: 深度学习的技术往往比较复杂，从头开始开发难度较大，为了帮助研究者、开发者、商业公司更高效地利用 AI 技术解决实际业务问题，AutoML
    概念应运而生。AutoML 的内涵是通过机器学习技术把参数以及结构的调整交给机器，从而解决现在人工调校参数的问题。与此相对应地，如果能够实现支持 AutoML
    算法的“自我进化”芯片，将无疑是对计算设备的一次全新变革。对于 AI 领域，AutoML 无疑是一个“大杀器”，谁能抢先一步占得技术先机就能在未来竞争中占据主动。


    回顾过去的短短几年，以深度学习为核心的 AI 技术大爆发，催生了人工智能芯片，并推动其迅猛发展。如今，万物智能物联时代来临，AI 计算正从“云”走向“端”，边缘节点的低功耗、低时延的诉求极其苛刻，由此带来的算法和架构的挑战也是难以估量的，人工智能芯片技术路向何方，期待你我共同探索！'
