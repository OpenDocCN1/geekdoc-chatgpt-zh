    # 6.1.4 单层网络映射方法的延伸与扩展


    许多工作对上述基本映射模式进行了各种延伸和扩展。例如，将分块应用到更多维度[5]，将全连接层折叠成卷积然后进行类似的分块处理[6]，等等。


    将分块应用到更多维度的方法主要是将分块的维度扩展到卷积核内部，也就是说引入了 Tk 参数来对 K 进行分割。类似的还有在引入 Tb 参数对批量大小(Batch
    Size)进行分割的做法。更多的分块参数能增大设计空间，制造更多数据重用的可能，减少由分块参数不能整除网络大小产生“零头”造成的资源浪费，因此一定程度上提高了神经网络映射的性能。当然，这么做的代价是需要更多的时间来搜索最优解。


    大部分神经网络映射方法都是针对卷积进行优化，因为在典型的卷积神经网络的正向推断过程中，卷积运算消耗了 90% 的时间[16]。然而，当卷积运算得到优化和加速之后，全连接层的计算时间开始成为瓶颈[6]。如表
    6.1 所示，在优化前，VGG 的卷积层运算需要占用 96.3% 的时间，而全连接层只占 3.7%。而当卷积被加速后，卷积层的运算时间已经减少到了一半以下，而全连接层则超过了一半。而且，全连接层需要大约
    4 倍于卷积层的数据存储需求。因此，全连接层的优化也不可忽视。基于这样的考量，研究者提出了一种称为 Caffeine[6]的方法，对全连接层进行优化。


    | 参数 | CONV | POOL | ReLU | FCN |

    |---|---|---|---|---|

    | 运算量/10^7 | 3×10^3(99.5%) | 0.6(0%) | 1.4(0%) | 12.3(0.4%) |

    | 存储量/MB | 113(19.3%) | 0(0%) | 0(0%) | 471.6(80.6%) |

