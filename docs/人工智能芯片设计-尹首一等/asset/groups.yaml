    造成这种问题的主要原因有三点。第一，各层的 OPDmax 变化很大。硬件平台理论上可以支持的最大 OPD 是 128，所以当某一层的 OPDmax 和这一数值接近时(如层
    2-1)，往往能取得总体上较好的硬件资源利用效果。OPDmax 远大于硬件平台的理论 OPD 的层(如层 2-2)倾向于计算受限而带宽利用率远低于计算资源利用率，反之，OPDmax
    远小于硬件平台的理论 OPD 的层(如层 3-1)倾向于数据受限而浪费很多计算资源。第二，层级时间映射方法要求每一层用统一的展开参数(Tn、Tm)。然而，有些层过小，或者并不能被这些参数整除，就造成了很多处理单元的空转周期。第三，没有针对
    Inception/Residual 网络的特点进行优化设计，如分支之间和层之间的数据局部性没有被利用起来。


    针对上述问题，可以采用以下策略来解决。首先，可以将这些层进行聚类，让资源利用倾向相似的层归入同一类。不同的类放在人工智能芯片上不同的分区并行执行，也就是类级空间映射(Cluster-Level
    Spatial Mapping)，这样它们的资源需求可以互补，而且展开参数不要求统一，不同类可以更自由地选择合适的展开参数。其次，不同分支的第一层，如果卷积核大小相同，就可以合并起来，这样层的大小就得到了增大，也就增大了可利用的计算并行性和数据局部性。最后，一些跨层数据传输放在片上完成，可以节省带宽。


    # 6.3.2 层聚类方法


    对于层聚类算法，有很多种选择。最直观的方法是枚举算法，如文献[9]提出的方法就是一种近似枚举算法，但枚举算法缺乏目标性、时间复杂度较高。启发式算法可以有效降低时间复杂度，如文献[19]中提出的基于距离的聚类算法，两个层的距离越近则它们被分为同一类的可能性越大。这里的距离指的是两个不同层的资源利用倾向之间的差异性。


    为了具体地定义两个层之间的距离，首先要为每个层 i 定义一个特征向量 \( L_i \)。由于网络参数 \( N \)、\( M \)、\( R \)、\(
    C \)、\( K \)、\( S \) 以及 OPDmax 都会在映射的时候对其资源利用倾向产生影响，所以可以让 \( L_i \) 包含这些分量。另外，这些分量各自的变化范围比较大，所以需要正则化，一种可选的方式是，将
