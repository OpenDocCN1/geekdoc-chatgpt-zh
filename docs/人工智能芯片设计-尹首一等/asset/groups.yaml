    2011 年开始逐渐被引入研究和应用的热潮，从边缘课题变成了微软、谷歌、Facebook、苹果等互联网和 IT 巨头仰赖的核心技术，帮助科学家在计算机视觉、语音识别和自然语言理解等领域长期存在的问题上取得了实质性进展。2019
    年 3 月 27 日，国际计算机学会 (Association for Computing Machinery, ACM) 正式宣布深度学习领域的三位代表性人物——深度神经网络鼻祖
    Geoffrey Hinton、蒙特利尔大学终身教授 Yoshua Bengio 以及 Facebook 人工智能研究部门主管 Yann LeCun 同获
    2018 年图灵奖，进一步确立了深度神经网络作为智能时代核心驱动力量的重要地位，具有划时代的意义。


    深度神经网络的基石之一——卷积神经网络，早在 20 世纪八九十年代就已经提出，虽然那时的网络结构还比较简单，但仍然受限于当时的计算处理能力，一直沉寂。进入
    21 世纪之后，在摩尔定律的持续推动下，集成电路技术步入纳米时代，智能计算芯片的计算力不断提升，再加上大数据的助力，深度神经网络技术迎来大规模发展并走向实用化。然而，由于技术与经济两方面的原因，摩尔定律被普遍认为将于
    2020 年左右走到尽头。曾经影响深远的冯·诺依曼体系结构，虽然一直在演进，从哈佛结构、流水线、多线程、多发射、乱序执行到超长指令字，再从单核到双核、多核乃至众核，却始终没有脱离内存与计算单元分离的基本特征。由此造成的存储单元与计算单元之间的频繁通信，要求系统运行在很高的时钟频率上，器件的开关功耗急剧上升，而硅基器件的散热能力又限制了时钟频率无限制的上升，这就是所谓的“内存墙”“功耗墙”和“性能墙”。后摩尔定律时代，唯有突破冯·诺依曼体系结构基本特征的限制，实现智能计算芯片体系结构上的根本性创新，研制出与人脑媲美、高效节能的智能计算芯片，才是为深度学习技术快速演进提供充足算力保障的唯一途径。


    本节首先回顾了人工智能的发展历程，由此引出了人工智能与神经网络的关系，并详细介绍了人工神经网络模型的相关组成元素和深度神经网络的常见网络结构，让读者了解智能计算芯片相关的领域知识；其次基于几种目前常用深度神经网络的数学模型，分别从计算量、访存、并行性等多维度深入分析了网络结构给智能计算带来的各种挑战，进而引出了智能计算芯片在性能、功耗以及灵活性方面的设计需求；然后分别从计算架构、数据复用、网络映射、存储优化以及软硬件协同设计等不同角度切入，分别介绍智能计算芯片领域的核心关键技术和我们的研究成果，并辅以实测实验数据与前人工作进行比较，说明相关研究成果的有效性；最后讨论了智能计算芯片设计技术的发展方向。'
  - '[PAGE 12]


    # # 第 2 章 人工智能与神经网络


    # ## 2.1 人 工 智 能


    人工智能是一门融合了计算机科学、统计科学、脑神经学和社会科学的前沿综合性学科，诞生于 1956 年 Dartmouth(达特茅斯)学会。McCarthy(麦卡锡)在此次会议上正式提出人工智能的概念，并将其定义为“研制智能机器的一门科学与技术”。此后，很多专家学者又从不同的角度定义了人工智能。例如，美国斯坦福大学人工智能研究中心尼尔森(Nilson)教授将其定义为“关于怎样表示知识及怎样获得知识并使用知识的科学”；美国麻省理工学院的温斯顿教授将其定义为“人工智能就是研究如何使计算机去做过去只有人才能做的智能的工作”。无论何种定义，都能反映人工智能的基本思想和基本内容，即研究人类智能实质，并构造能以人类智能相似的方式做出反应的人工系统。目前，人工智能应用领域的研究包括机器人、语音识别、图像识别、自然语言处理和专家系统等。


    人工智能系统自己获取知识的能力称为机器学习。学习是人类思维的重要组成部分，也是人工智能的主要标志和获得智能的基本途径，因此，机器学习是人工智能研究中最突出和最重要的领域。它专门研究计算机怎样模拟或实现人类的学习行为，以获取新的知识或技能，重新组织已有的知识结构，不断改善自身的能力。与传统的用于解决特定任务、硬编码的软件程序不同，机器学习用大量的数据来“训练”模型，通过各种算法从数据中学习如何对现实世界中的事件做出决策和预测。传统的机器学习算法包括决策树、贝叶斯分类、支持向量机、聚类、最大期望(Expectation
    Maximization，EM)算法、自适应增强(Adaboost)算法等，它们在指纹识别、基于 Haar 的人脸检测、基于 HoG 特征的物体检测等特定场景领域的应用基本达到了商业化的水平，但离智能的标准还很远，直到深度学习的出现。


    深度学习起源于科学家发现人的视觉系统对信息的处理是分级的，高层的特征是低层特征的组合，从低层到高层的特征表达越来越抽象和概念化。由此激发科学家认识到大脑是一个深度结构，认知过程是按深度分级的。例如，首先由瞳孔摄入图像，之后大脑皮层某些细胞进行初步处理，发现图像的边缘和方向，抽象出物体的形状，然后进一步抽象，识别出图像类别，如人脸。深度学习的思想'
  - '[PAGE 13]


    正是借鉴了大脑这种天然的深层结构和分级认知方式。然而历史的发展向来不是一帆风顺的。1957 年，Frank Rosenblatt 在 New York Times
    上发表文章 Electronic “brain” teaches itself，首次提出可以模拟人类感知能力的感知器，神经网络得以发展，深度学习开始萌芽，直到
    2006 年，Geoffrey Hinton 提出深度置信网络 (Deep Belief Net Work, DBN)，并提出非监督贪心逐层训练 (Layer-wise
    Pre-training) 算法，深度学习的应用效果才取得突破性进展，其与之后 Ruslan Salakhutdinov 提出的深度玻尔兹曼机 (Deep
    Boltzmann Machine, DBM) 掀起了深度学习的浪潮。目前，深度学习已经成为人工智能领域最先进、应用最广泛的核心技术，同时，深度学习也是人工智能领域最主流的研究方向。


    图 2.1 展示了人工智能、机器学习、深度学习以及神经网络几个概念之间的关系。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_13_0.png)


    图 2.1 人工智能相关概念示意图


    # 2.2 神经网络


    从广义上来讲，神经网络主要分为人工神经网络 (Artificial Neural Network, ANN) 和脉冲神经网络 (Spiking Neuron
    Network, SNN)。其中，ANN 是指受大脑神经元结构及神经传导原理启发建立的数学计算模型，基于这类模型实现智能计算的方式称为脑启发计算。前面介绍的感知器模型和以
    BP 算法训练网络为基本特征，网络结构形式多样的神经网络计算模型，例如，BP 神经网络、卷积神经网络 (Conventional Neuron Network,
    CNN)、循环神经网络等都属于 ANN。脉冲神经网络的核心是使用更接近于生物神经工作机制的脉冲神经元模型，并且在计算过程中，信息都采用脉冲编码，其硬件实现的芯片在体系结构上也有别于擅长精'
  - '[PAGE 14]


    确数值计算的 CPU/GPU。基于这类计算模型实现智能计算的方式称为神经拟态计算。到目前为止，SNN 还属于学术研究范畴，充满前景，但还不是主流。ANN 是目前机器学习特别是深度学习使用的主要模型，它推动人工神经网络理论与算法取得突破，并在业界获得成功应用，是本书后面讨论的主要内容。


    # 2.2.1 人工神经元


    生物神经网络由数以千万计的互连细胞——生物神经元组成，而对于人类，这个数字则达到了 860 亿。生物神经元的基本结构如图 2.2 所示，由一个细胞体、多条树突、一条轴突和突触四部分组成。细胞体是数据处理中心，处理完的数据以电脉冲的形式表示，树突用来接收来自其他神经元的电脉冲信号，轴突用来向其他神经元输出电脉冲信号。如图
    2.3 所示，两个细胞体之间的轴突-树突接触间隙称为突触，该间隙充满了导电流体，允许电信号流动，突触的电导率受大脑激素控制。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_14_0.png)


    图 2.2 生物神经元的基本结构


    ![](img/16a61618bbeb2ecae4884725c4086cbe_14_1.png)


    图 2.3 突触'
  - '[PAGE 15]


    1943 年，心理学家 McCulloch 和数理逻辑学家 Pitts 受生物神经元模型启发，提出了神经元的第一个数学模型——MP 模型[1]，试图从结构、实现机理和功能上模拟生物神经网络的行为。MP
    模型具有开创意义，为后来的研究工作提供了依据。1958 年，心理学家 Frank Rosenblatt 在 MP 模型的基础之上增加学习功能，提出了现代人工神经元模型，也称为感知器模型，如图
    2.4 所示。该模型包含细胞体(图中的求和节点)、输入、输出、权重和激活函数五个部分，前四个部分分别对应生物神经元的四个组件。其输入是具有 \( m \)
    个分量的实值向量 \( (x_1,x_2,\cdots,x_m) \)，相当于 \( m \) 条树突；受大脑突触的启发，每个输入分量 \( x_i \)
    都对应一个权重 \( w_{ki} \)，这意味着发送到每个连接的输入值都要乘以它关联的权重因子，从而控制输入对本单元的影响。如果某个连接重要，那么它将具有比那些不重要的连接更大的权重值。神经元的处理过程为：细胞体首先基于式
    (2-1) 所示的线性模型处理输入得到输出 \( v_k \)，以实现权重对输入影响力的控制。然后，基于式 (2-2) 将 \( v_k \) 作为非线性函数——激活函数
    \( \varphi \) 的输入，计算神经元的输出 \( y_k \)。


    \( v_k = \sum_{i=1}^{m} x_i w_{ki} + b_k \) (2-1)


    \( y_k = \varphi(v_k) \) (2-2)


    ![](img/16a61618bbeb2ecae4884725c4086cbe_15_0.png)


    # 图 2.4 感知器模型


    虽然人类还不能完全理解大脑的工作原理，但是基于神经元的计算模型构建技术已经有很长的研究历史，并获得了大量的研究成果，大致分为两类：第一类是尽可能地用电路结构模拟还原大脑神经系统的结构和思考过程，实现智能计算，称为神经拟态计算，IBM
    等公司推出的“类脑”芯片就属于此类；第二类是受大脑神经元结构及神经传导原理启发建立数学计算模型，实现智能计算，这种方式称为脑启发计算。这两类建模方法都是目前非常重要的研究热点。本书后面介绍的智能计算芯片设计技术都属于脑启发计算芯片范畴，这类芯片的设计以模拟大'
  - '[PAGE 16]


    脑的神经元结构为基本技术路线，而非模拟大脑的思考形式，是目前研究应用最广的方向。


    # 2.2.2 激活函数


    激活函数是人工神经元细胞体中对所有输入信号进行加权和之后的非线性映射。在多层神经元构成的神经网络中，激活函数可以理解为上一层神经元的输出与下一层神经元的输入之间的函数关系。如果不用激活函数，神经元的输出就只是其输入的线性变换，那么无论经过多少层神经元，最终的输出都是输入的线性组合，与没有中间层的效果相当。最原始的感知机就是由没有激活函数的神经元连接而成的，只能处理线性问题。正是感知机的这一缺陷导致了第一次人工神经网络研究的衰退。因此，激活函数是神经元中非常重要的组成部分，它极大地增强了网络的学习能力和表达能力。


    +   激活函数一般需要满足以下几个条件：(1)连续并可导（允许在有限点上不可导）的非线性函数；(2)激活函数及其导数要尽可能地简单，以提高网络的计算效率；(3)激活函数及其导数的值域要在一个合适的区间内，范围不能太大，否则影响训练的效率和稳定性。


    图 2.5 给出了如下几种常用激活函数的曲线图。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_16_0.png)


    ![](img/16a61618bbeb2ecae4884725c4086cbe_16_1.png)


    ![](img/16a61618bbeb2ecae4884725c4086cbe_16_2.png)


    ![](img/16a61618bbeb2ecae4884725c4086cbe_16_3.png)


    图 2.5 常见的激活函数曲线图'
