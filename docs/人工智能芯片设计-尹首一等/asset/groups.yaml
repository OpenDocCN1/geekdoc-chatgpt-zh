    \ PE 内包含一个乘累加单元，片上 SRAM 存储容量为 384KB，计算核心单元内的存储容量为 36KB，用来存储输入数据、输出数据以及权重数据的缓存资源被统一在联合缓存系统中。在\
    \ TSMC 65nm GP 工艺下的总面积为 5.682mm²。\n\n| 实验平台配置 | |\n| :--- | :--- |\n| CNN 加速器\
