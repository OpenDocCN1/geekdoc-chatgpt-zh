    空域计算架构能够有效提高计算任务的执行性能，并控制能耗，但其缺少时间域上的可变性，使得其灵活性不足，应用范围受限。


    ## 4.2 现状分析


    作为目前产学研界关注的研究热点，除了前面介绍的几种典型设计之外，研究人员还提出了多种新型智能计算架构[9-15]，但普遍存在以下问题。


    第一，已有的设计没有利用神经网络对于低位宽量化[16]的天然容错能力来提高计算性能。这种天然容错能力是指，在算法精度损失的限定范围内，有些层可以量化为低位宽。如表
    4.1 所示，将 LRCN 的每一层的数据位宽分别量化为 9/8/8/8/9/8/8/8bit 时，与所有层量化为 16bit 相比，精度损失仅为 1.8%。


