    0.67V 时，吞吐率和功耗在 10MHz 时降至 20.4GOP 和 4mW，对应的能效为 5.09TOP/W。


    为了满足神经网络层的各种位宽，首先，Thinker 中每个 PE 单元支持位宽自适应计算，从而可将计算吞吐率提高 91%，将能效平均提高 1.93 倍。其次，PE
    阵列支持按需阵列分区和重新配置，以并行处理不同的神经网络，从而使 PE 利用率提高 13.7%，能效提高 1.11 倍。最后，基于融合数据模式的 Multi-Bank
    存储系统旨在利用数据重用并保证并行数据访问，这分别将计算吞吐率和能效提高 1.11 倍和 1.17 倍。


    如表 4.3 所示，Eyeriss、CNN-SoC[10]、DNPU、ENVISION 和 Thinker 在相同基准 AlexNet 上进行比较，运行频率为
    200MHz。Eyeriss 在固定的 16bit 模式下可实现 0.166TOP/W 的能效，功耗为 278mW。CNN-SoC 支持 8bit 和 16bit
    操作。通过动态电压和频率调节，在 8bit 模式下，能效最高可达 1.89TOP/W，功耗 41mW。DNPU 和 ENVISION 都支持 4bit、8bit
    和 16bit 操作。DNPU 和 ENVISION 分别通过 4bit 操作实现 3.9TOP/W 和 3.8TOP/W 的能效。Thinker 处理器在位宽自适应模式下处理
    AlexNet，可实现 368.4GOP 吞吐率，功耗为 290mW，对应的能效为 1.27TOP/W。


