    \n### 6.1 单层网络映射方法\n\n国内外对于神经网络在人工智能芯片上的映射技术研究，最早是从单层网络映射开始的，目前已经有很多面向各种硬件平台的方法[3~14]。\n\
    \n为了将网络执行所需要的硬件资源控制在实际可用的范围内，一般需要通过数学建模来获得最优的网络分块参数，然后根据这套参数来对计算芯片进行配置，使得性能和能效最佳。\n\
    \n### 6.1.1 典型分块方法\n\n图 6.1 是卷积计算过程伪代码及一种典型的分块方法[4,6,8]的示意。其中，循环 R、C、M 和 N 分别按照\
