    ## 第 8 章 人工智能芯片的软硬件协同设计


    模型的大小不仅影响人工智能芯片的 MAC 单元、内存等片上资源需求，而且还影响通信带宽需求，与智能计算的性能和功耗直接相关。然而为了实现深度神经网络模型的精度最大化，神经网络层数不断增加，结构日益复杂，模型越来越大，由此带来巨大的计算和存储代价，最终导致神经网络的应用受到严重阻碍，尤其在一些计算能力相对较弱的边缘设备上，问题更为突出。为了在有限资源的硬件设备上更好地实现智能计算加速，需要对网络模型压缩和优化，这就涉及人工智能芯片的软硬件协同设计技术。目前的人工智能芯片的软硬件协同设计方法主要包括以下两类：①降低操作和操作数位宽的方法，如低位宽神经网络和二值化神经网络，②减少操作数量和模型大小的方法，如稀疏化神经网络。


    ### 8.1 低位宽神经网络


    对神经网络进行位宽优化，是缩减模型大小的常用方法之一，而模型量化则是优化神经网络位宽的首要方法。量化是指将模型数据映射到一组量化级别上，而这组量化级别的数量反映了量化后数据表示需要的位宽。直观地讲，量化就是将以往用
    32bit 或者 64bit 等高位宽形式表达的浮点数用 8bit、3bit 甚至更低位宽的数据形式进行存储，以降低模型的存储成本和计算量。量化过程必然存在误差，然而深度神经网络被过度参数化，进而包含足够的冗余信息，裁剪这些冗余信息不会导致明显的准确度下降。


    由于神经网络的基本运算是权重与激活的乘累加，因此模型量化主要针对两类数据，一是权重数据，二是激活数据。如果将这两类数据中其中之一量化到 {-1, 1}两个级别，那么神经网络的乘累加操作就可以简化为累加操作，而当两类数据都量化到
    {-1, 1}时，神经网络的乘累加操作就将进一步简化为按位操作，这将极大地降低硬件的计算代价和存储代价。考虑到权重直接影响着存储容量的需求，量化相关研究最初的关注点仅限于降低权重的位宽，最近的研究也开始关注量化对激活值的影响。此外，由于梯度对量化的敏感性，大多数降低位宽的研究往往侧重于降低推理过程的位宽，而不是训练过程的位宽。


    量化的方法很多，通常按照量化级别间距是否相等，可以分为线性量化方法和非线性量化方法。


    #### 8.1.1 线性量化


    线性量化方法采用线性映射函数来确定量化级别，因此，如图 8.1 所示，其相邻量化级别之间通常是等距的或者说是均匀间隔的。它的首要方法是将数值和运算从浮点表示转换为定点表示。如图
    8.2 (a) 所示，基于浮点表示法，一个 32bit 浮点数通常表示为 \((-1)^s \times m \times 2^{(e-127)}\)，其中
    \(s\) 是符号位，\(e\) 是 8bit 指数，\(m\) 是 23bit 尾数，可表示的数据范围为 \(10^{-38} \sim 10^{38}\)。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_134_0.png)


    图 8.1 线性量化方法[1]


    ![](img/16a61618bbeb2ecae4884725c4086cbe_134_1.png)


    图 8.2 不同的数值表示方法


    如图 8.2 (b) 所示，基于动态定点表示法，一个 Nbit 定点数通常表示为 \((-1)^s \times m \times 2^{-f}\)，其中
    \(s\) 是符号位，\(m\) 是 (N-1)bit 尾数，\(f\) 作为比例因子用来确定小数点的位置。例如，对于 8bit 整数，当 \(f=0\)
    时，动态表达范围是 -128 ~ 127，而当 \(f!=0\) 时，动态范围是 -0.125 ~ 0.124023438。这种允许 \(f\) 根据所需的动态范围变化的表示方法对于人工智能芯片的软硬件协同设计十分有效，因为神经网络权重和激活的动态范围可能是不同的。此外，该动态范围还可以根据层类型而变化。使用动态定点化，在不进行精调的情况下，权重位宽可以降低到
    8bit，激活可降低到 10bit[2]；如果进行精调，权重和激活都可以达到 8bit[3]。


    斯坦福大学的 Horowitz[4]对各种基本运算的硬件面积和能耗代价进行了统计，结果如图 8.3 所示。根据图中数据可计算出，8bit 定点加法比 32bit
    定点加法的能耗降低达 70%，面积减少 73.7%，比 32bit 浮点加法的能耗降低 97.7%，面积减少 99%。8bit 定点乘法比 32bit 定点乘法的能耗降低
    93.5%，面积减少 91.9%，比 32bit 浮点乘法的能耗降低 94.6%，面积减少 96.3%。而且根据图中数据还可以发现，一个定点乘法的能量和面积变化与位宽变化近似呈二次方的关系。


