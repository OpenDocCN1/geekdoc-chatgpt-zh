    R、C、M 和 N 维度上被分成 Tr×Tc×Tm×Tn 大小的分块。每个这样的分块中所有的计算和数据移动操作都是在片上完成的，如图 6.1 中深灰色区域(标记为“片上处理”的区域)所示。最内两层循环
    Tm 和 Tn 被循环展开(Loop Unrolling)，来利用硬件的并行能力。'
