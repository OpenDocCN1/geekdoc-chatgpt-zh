    \ outW_5)\nstore(out_5)\n\n## 6.3 复杂网络映射方法\n\n最近，神经网络模型朝着更深和更宽的方向发展，目的是提高精度。更深指的是级联的层次更多，而更宽指的是是分支增加。然而，简单地将传统的神经网络加深和拓宽会增加计算量和减慢收敛速度。Inception[20]和\
    \ Residual[21]是两种最新的深度神经网络架构，它们具有既能保证高精度又不会带来上面说的两个问题的优势。典型的 Inception 和 Residual\
    \ 模块如图 6.5 所示。这两种模块的最突出的特点是：①大多数层都是卷积层；②它们的参数（如卷积核大小）差异很大，导致输入/输出/权重数据的重用次数差异很大，也就是数据局部性差异很大；③在第一层，不同的卷积核作用于相同的输入特征图。复杂神经网络还有不少其他类型，但由于\
    \ Inception 和 Residual 是目前最好的神经网络结构之一，所以后面我们根据这两种网络来探讨复杂神经网络的映射方法。\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_92_0.png)\n\
    (a) Inception模块：GoogLeNet的Inc3a\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_93_0.png)\n\
    图 6.5 典型的 Inception/Residual 模块\n\n### 6.3.1 层级时间映射方法带来的资源浪费\n\n前面提到，当执行多层网络的时候，层级时间映射方法由于串行执行各层时计算引擎和带宽供给不变，会造成硬件资源的浪费，从而影响人工智能芯片的性能。直观地说，3×3、5×5\
    \ 的卷积核倾向于使该层具有更高的输入和累加和的数据可重用性。下面将针对 GoogLeNet 中的 Inc3a 模块来举例说明这一点。其卷积层参数如表 6.2\
    \ 所示。我们可以看到算子个数 (NOP)、数据个数 (NData, 包括输入、输出和权重) 以及理论上平均每个数据最大可以支持的计算量 (OPDmax,\
    \ 反映了数据局部性) 在各层之间变化很大。如果使用传统的层级时间映射方法[4]将其逐层映射到人工智能芯片上，就会产生如图 6.6 所示的资源浪费的情况。\n\
    \n表 6.2 GoogLeNet 中的 Inc3a 的卷积层的参数\n\n| 层数 | R | C | N | M | K | S | NOP | NData\
    \ | OPDmax |\n|---|---|---|---|---|---|---|---|---|---|\n| 1-1 | 28 | 28 | 192\
    \ | 64 | 1 | 1 | 19267584 | 212992 | 90.46 |\n| 2-1 | 28 | 28 | 192 | 96 | 1 |\
    \ 1 | 28901376 | 244224 | 118.34 |\n| 2-2 | 28 | 28 | 96 | 128 | 3 | 1 | 173408256\
    \ | 297344 | 583.19 |\n| 3-1 | 28 | 28 | 192 | 16 | 1 | 1 | 4816896 | 166144 |\
    \ 28.99 |\n| 3-2 | 28 | 28 | 16 | 32 | 5 | 1 | 20070400 | 54272 | 369.81 |\n|\
    \ 4-2 | 28 | 28 | 192 | 32 | 1 | 1 | 9633792 | 181760 | 53.00 |\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_93_1.png)\n\
