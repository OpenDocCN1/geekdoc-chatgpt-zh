    第二，大部分优化集中在网络中的卷积层，限制了人工智能芯片的整体性能和能效。根据前面章节的分析，现代深度神经网络虽然以卷积层中的卷积运算为主，但也具有很多类型的非卷积运算，而且在总计算量中占据了较高比例。例如，在
    LRCN 中，FCNet 和 RNN 占总计算量的比例达到 47.7%。因此，只加速卷积层，非卷积层将成为性能的瓶颈[9-17]。虽然目前有的设计也开始关注这方面的问题，如
    DNPU 处理器[9]就可以同时加速 CONV 层和 RNN 层，但是，用于加速 CONV 层和 RNN 层的硬件资源是独立、不可复用的，这限制了其使用的灵活性、资源利用率和效率。


    第三，通常设计为固定的计算模式。针对 ConvNet 层（计算密集型）与 FCNet/RNN 层（存储密集型）计算特点不同的问题，计算架构无法按需调整计算流来平衡不同网络层的计算和访存需求，从而降低了总体资源利用率，影响了性能和能效。


    第四，存储系统通常采用固定的设计，无法按照不同网络层的特点调整访问模式和数据流支持。根据第 3 章的分析，同一网络的不同网络层计算参数（如卷积核大小、步长、输入输出特征图尺寸）变化多样，不仅在数据访问模式上具有很大的不同，而且在数据可重用性上也具有较大差异，例如，卷积层展现出高度的数据可重用性，在权重占用较小缓存空间的情况下，可以进行大量的
    MAC 操作。相比之下，全连接层/循环层需要很多 MAC 操作，但权重数据无法复用。


    ## 4.3 多粒度可重构计算架构


    为了更好地适应智能计算特点及需求，提升资源利用率和计算能效比，具有硬件重构能力的空域计算架构成为研究热点。在 2019 年国际固态电路会议(ISSCC''19)的大会报告中，Hoi-Jun
    Yoo 教授指出，2016 年至今，超过一半的人工智能芯片都采用了具有一定硬件重构能力的计算架构。这里以“多粒度可重构智能计算架构——Thinker[18]”为例，介绍面向智能计算的可重构架构的设计思想。该架构以“动态重构、数据驱动”为基本设计思路，支持核心运算部件、处理单元
    PE、PE 阵列以及计算模式等四个层次/粒度的硬件动态重构，不仅可以高效支持卷积、全连接、RNN、池化等不同类型的神经网络层单独计算和并行计算，灵活支持各种复杂级联结构、混合精度网络运算，而且可以通过适配不同访存比，提高资源利用率，降低能耗。整个架构在灵活性、高能效、低功耗方面极具优势。


    ### 4.3.1 系统总体架构


    Thinker 整体架构如图 4.9 所示，由运算模块、存储模块和控制模块构成，并以 2 块 16×16 个 PE 组成的可重构异构阵列为核心。缓存控制器
    (Buffer CTRL) 管理两个 144KB 的 Multi-Bank 片上缓存为 PE 阵列提供数据。系统整体执行由有限状态控制器 (Finite-state
    Controller) 控制，通过可配置的 I/O 和解码器单元 (Configurable I/O & Decoder) 加载权重和配置信息。一个 1KB
    共享权重缓存 (Weight Buffer) 和两个 16KB 本地缓存 (Local Buffer) 用来为 PE 阵列准备权重数据。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_48_0.png)


    图 4.9 Thinker 整体架构[18]


    在 Thinker 架构的 PE 阵列中，每个 PE 内部的核心运算部件——MAC 都支持位宽自适应；每个 PE 本身都支持多种不同类型的神经网络算子重构；PE
    阵列还可以按需动态划分为不同功能的子阵列，以灵活高效地支持多种不同类型网络层的计算任务并行。此外，Thinker 架构还可以支持根据不同的网络结构重构计算模式，通过数据复用最大化使数据不必要搬移带来的性能以及功耗损失最小化，提升整体能效。


    ### 1. 位宽自适应 MAC


    为了提高计算效率和资源利用率，可重构阵列内每个 PE 中的 MAC 都采用位宽自适应设计，包含两个 8×16bit 乘法器，支持根据配置字重构实现 8bit/16bit
    两种混合精度运算。即当配置为 8bit 模式时，两个 8×16bit 乘法将并行处理。否则，两个乘法器组合为一个 16×16bit 乘法器，以支持 16bit
    操作。根据配置，未使用的数据通路都采用时钟门控以降低功耗。


    如图 4.10 上半部所示，当权重数据的位宽小于 8bit 时，来自不同卷积核或神经元的两个权重被拼接为一个 16bit 权重。高 8bit 部分和低 8bit
    部分分别在两个乘法器上与相同的 16bit 输入数据相乘。每个乘法器的结果都表示为一个 25bit 字，其中包含一个保留位。然后将两个 25bit 结果拼接成一个
    50bit 字，此时，配置字 s11 为 0，选通拼接结果输出。在此模式下，由于两个操作在两个独立的乘法器上执行，输入数据中不需要保护间隔 (Guard Band)。与赛灵思的
    INT8 优化方法[19]中需要至少 9bit 保护间隔来分离两个 8bit 乘法结果的设计相比，Thinker 的 MAC 设计在执行 8bit 乘法时具有更高的效率。


    如图 4.10 下半部所示，当权重位宽大于 8bit 时，这两个乘法器组合为一个 16x16bit 乘法器。如图红线框中，来自两个乘法器的结果被送到移位和加法单元。将结果的高
    25bit 移位 8bit，然后与低 25bit 的部分相加。此时配置字 s11 为 1，选通移位相加结果输出。与 ENVISION 相比，Thinker
    中的乘法器全部用于 8bit 模式或 16bit 模式，具有更高的资源利用率。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_49_0.png)


    图 4.10 位宽自适应计算 (见彩图)


    ### 2. 算子重构的 PE


    Thinker 的可重构异构阵列中 PE 分为两种类型：通用 PE 和超级 PE。这两种类型的 PE 都支持算子重构。如图 4.11 所示，通用 PE 支持卷积层、全连接层和循环层的
    MAC 运算，并由 5bit 控制字 (s1、s3、s6、s7、s11) 进行配置重构。超级 PE 由通用 PE 扩展而成，除了上述三种网络层的 MAC 运算以外，还支持另外
    5 种类型的操作——池化、tanh、Sigmoid、标量乘法和加法以及 RNN 门控操作，由 12bit 控制字 (s0~s11) 进行配置重构。为了减小可重构阵列中不同类型操作部件的平均未使用
    PE 面积，提高资源利用率，除了超级 PE 中的 Pooling、Sigmoid 和 tanh 外，乘法器和加法器在几乎所有类型操作中都被重用。图 4.12
    显示了超级 PE 所支持的四种主要操作类型的数据通路。


