    | 门数 | 2.95M(NAND2) |

    | SRAM | 348KB |

    | 电压 | Core:0.67～1.2V, I/O:1.8V |

    | 频率 | 10～200MHz |

    | 峰值性能 | 409.6GOP |

    | 操作模式 | 8/16 bit |

    | 卷积 | Kernel width: 1～16<br>Kernel height: 1～16<br>Stride: 1～15 |

    | 全连接 | Input length: 1～65536<br>Output length: 1～65536 |

