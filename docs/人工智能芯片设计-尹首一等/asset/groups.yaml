    \ (由其所包含的层特征向量的方差推导出来)，则将它分解成两个类；如果两个类的距离过近，就将它们合并成一个类。其中涉及的各个阈值都是事先设定的。这样的迭代更新过程会持续到所有的类中心在一次迭代内保持不动，或者迭代次数达到预先规定的最大值为止。\n\
    \n```\n算法 6.2\nRequire: *L, *a, NC_EXP, \\(\\theta_T\\), \\(\\theta_S\\), \\(\\\
    theta_M\\), I_max\nEnsure: NC, *Cluster\nNC=NC_EXP; I=0;\n*Center=init_cluster_centers(I,\
    \ NC_EXP) ;\nwhile(I++<I_MAX)\n*Center_bak=copy(Center) ;\n//Layer Classification\n\
    for(i=1; i<=NC; i++)\nNL[i]=0; Cluster[i]=0;\nfor(i=1; i<=NL_total; i++)\nif(D[I[i],\
    \ Center[j]] <= D[I[i], Center[k]] , forall 1<=j, k<=NC)\nCluster[j] [NL[j]++]=I[i]\
    \ ; //insert I[i] into Cluster[j]\n//Cluster Elimination :\nfor(i=1; i<=NC; i++)\n\
    if(NL[i]<\\theta_S)\nremove Cluster[i] ; remove Center[i] ;\nNC--; break;\n//Center\
    \ Updating :\nfor(i=1; i<=NC; i++)\nCenter[i]=calculate_mean(Cluster[i]) ;\n//Cluster\
    \ Splitting :\nif(NC<=NC_EXP/2)\nfor(i=1; i<=NC; i++)\n*V=calculate_variance(Cluster[i])\
    \ ;\n//\n//V[x] corresponds to x-th component of layer feature vector\nWV_max=max\
    \ (a[x]*V(x)) ;   //maximum weighted variance\nif(WV_max > theta_p)\n\ninsert\
    \ two new centers : Center[i] ± (0, ... , 0, WV_max / a [x], 0, ... , 0) ;\nremove\
    \ Center[i] ; NC++; break;\n//Cluster Merging :\nforeach(i<=NC, j<=NC, i!=j)\n\
    \    if(d (Center[i] , Center[j]) <= theta_d)\n        insert a new center : (N[i]*Center[i]+N[j]*Center[j])\
    \ / (N[i]+N[j] ) ;\n        remove Center[i] ; NC--; break;\n//Termination :\n\
    if(is_unchanged(Center, Center_T_mk)) ;\n    break;\ndo layer classification based\
    \ on final cluster centers;\n```\n\n### 6.3.3 多个层聚类并行映射方法\n\n每个层聚类包含一个到多个层，将被映射到人工智能芯片上的不同分区并行地执行。现在的问题是如何在给定硬件资源约束下搜索一个全局最优的分块参数，其中包括所有各自类的分块参数。每个类的设计空间包含了数百万到数亿的解决方案，在普通的\
    \ Intel i7 系列计算机上枚举只需要几秒到几分钟。但是，如果将两个或以上的设计空间简单地整合起来(即笛卡尔积)，那么枚举时间就完全不可接受了。\n\n\
    为了解决这个问题，我们可以将 6.1 节中介绍的屋顶线模型进行扩展来辅助求解。仍然以 Inc3a 为例，目标是最高的执行效率。我们将三个分支的第一层(1-1、2-1、3-1)合并成一个新层。根据各层的距离，我们把合并后的层单独分到聚类\
    \ 1、层 2-2 和层 3-2 分到聚类 2，层 4-2 分到聚类 3。然后，每个类的设计空间的屋顶线模型被分别画出来，如图 6.7 上半部分所示。纵轴表示平均每个周期能执行的算子个数(OPC，对应原始屋顶线模型的性能)，横轴表示平均每个数据能支持的计算量(OPD，对应原始\
    \ Roofline Model 的计算带宽比 CTC)。例如，在聚类 1 的设计空间中，点 A1 表示一种可能的设计。它的纵坐标表示它能达到的 OPC，也隐含着它所需要消耗的计算资源。它的横坐标表示它能达到的\
    \ OPD，而且 tan α_A1 = OPC/OPD 表示了平均每个周期的输入输出数据(DPC)，隐含着它的带宽需求。目标硬件平台会施加一个像屋顶一样的约束，分别限制可用的计算资源和带宽资源。因此，在这个屋顶的右下方，最靠上(性能最高)然后最靠右(带宽最省)的设计是一个可能最优解。\n\
    \n![](img/16a61618bbeb2ecae4884725c4086cbe_97_0.png)\n图 6.7 多个层聚类的并行映射[19]\n\n\
    现在在考虑如何有效率地联合求解多个类的分块参数。原始的屋顶线约束不再够用，我们需要添加一些联合的约束。对于并行执行多个类的计算资源约束和带宽约束分别变成：\
    \ ① $\\sum_{i=1}^n OPC_{Ai} \\leqslant OPC_{hardware}$ ； ② $\\sum_{i=1}^n \\tan\
    \ \\alpha_{Ai} \\leqslant DPC_{hardware}$ ，其中，\n\nOPC_{hardware} 和 DPC_{hardware}\
    \ 是根据硬件平台的计算资源和带宽资源推导出来的。根据木桶原理，多个类并行的计算时间等于最长的那个类的计算时间。因此，我们可以根据每个类所包含的算子个数 (NOP)\
    \ 来成比例地分配计算资源，这样所有的聚类就可以几乎同时完成。因此，我们把聚类 i 的计算资源约束改写成 $OPC_{i,roof} = OPC_{hardware}\
    \ \\times NOP_i / NOP_{total}$。然后，我们再找每个类在资源约束屋顶之下的最靠上然后最靠右的设计，如图 6.7 下半部分 (B1、B2、B3)\
    \ 所示，作为备选解。如果备选解不能满足带宽约束，或者不能被成功地硬件实现，就迭代地进行调整，直到成功地实现。主要调整方法是： ① 成比例降低计算资源约束屋顶，这有助于降低计算资源的需求，并且同时也倾向于降低带宽的需求，但会降低性能；成比例降低的原因仍然是遵循木桶原理，让各个类的执行时间平衡，跳过海量的无意义的解；\
    \ ② 在原来的设计点的位置向左搜索，这样做会倾向于降低片上缓存的需求而且性能不变，但会增大带宽的需求。\n\n完成聚类并确定了分块参数以后，下面以 LRCN\
    \ 为例，介绍如何进行各聚类到硬件的并行映射。按照前面的聚类算法，LRCN 可以被划分为三个聚类： C1、 C2 和 C3。于是，如图 6.8 所示，按照三个聚类对硬件资源的需求差异，将\
    \ FPGA 的所有计算资源和存储资源分别组织为三个独立的计算引擎： C1 引擎、 C2 引擎和 C3 引擎，用于加速 LRCN 的三个聚类。图中标示了三个引擎占用的\
    \ DSP 和 BRAM 资源比率。对于使用同一个输入（如输入 1）的推理计算，则按照流水线方式组织执行。对于 LRCN 的多个具有不同输入（如输入 (1/2/3/4/5)）的推理计算，则采用三个独立引擎并行加速三个推理。例如，图\
    \ 6.8 中虚线框标示的流水线中第三段所示，C3 引擎、C2 引擎和 C1 引擎分别并行加速使用输入 1 的 C3，使用输入 2 的 C2 和使用输入 3\
    \ 的 C1 对应的推理运算。\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_98_0.png)\n图 6.8 多层聚类并行映射示例\n\
    \n### 6.3.4 复杂网络其他特性的利用\n\n前面提到，Inception 和 Residual 模块还有一些特性，如分支之间和连续层之间的数据可重用性，可以利用起来实现进一步的性能和带宽优化。这里介绍两点：①首层合并。由于\
    \ Inception 和 Residual 模块每个分支的第一层的输入特征图是一样的，如果它们的卷积核大小相同，那么就可以在卷积核组数也就是输出通道方向（M）进行直接堆叠合并。合并后的层卷积核组数和输出通道数\
    \ M 为原来所有分支第一层这个数值之和。②片上层间数据交互。这个优化基本等价于多层网络映射，用层融合分块的方法[18]带来的额外约束比较严重，而修改最后两层的数据重用方式可以缓解额外约束[19]，这些在\
    \ 6.2 节中已经讨论过，这里不再赘述。另外，这些优化是可选的，根据实际的网络和硬件平台情况来决定是否执行。\n\n"
