  md: "\n该 PE 阵列与配置缓存之间的点对点连接可以保证在一个周期内完成两个阵列的配置，提高了阵列的重构效率。\n\n## 5. I/O 和解码器\n\n\
    权重和配置通过可配置的 I/O 端口进行加载。为了利用稀疏性，权重通过两符号哈夫曼编码进行压缩，并由解码器单元进行解码。为了灵活支持不同长度的网络层参数，解码器首先读取指示网络层类型的最高两位，然后加载相应长度的字。输入和输出数据直接在片上缓存和外部存储器之间传输。为了适应缓存容量大小，输入数据将被分块。\n\
    \n### 4.3.2 计算数据流\n\n在 PE 阵列中，输出点的计算固定在各自的 PE 上，重用权重以及在垂直和水平方向的输入特征点(也称为输出固定数据流)。\n\
    \n如图 4.14(a) 所示，对于卷积操作，输入数据通过左侧 I/O 端口从片上缓存加载到最左边的 PE 列。在每个时钟周期内，这些数据通过正向路径移动到右侧相邻\
    \ PE。一列中的 PE 并行计算相同输出特征图的不同点，并且不同列的 PE 被分配计算各自的输出特征图。当一个输出特征点完成计算后，结果通过反向路径从右向左移动，最后通过左侧\
    \ I/O 端口发送到片上缓存。这样，阵列内部就不需要添加额外的 I/O 端口。在一个三维卷积核的计算过程中，数据移动造成的额外开销最多为 30 个时钟周期，即最右侧的\
    \ PE 列有 15 个时钟周期的输入延迟和 15 个时钟周期的输出延迟。由于完成一个三维卷积核的计算通常需要数千个时钟周期，所以这个开销可以忽略不计。以\
    \ AlexNet 为例，上述额外开销只占计算周期总数的 2.2%。\n\n如图 4.14(b) 所示，对于全连接操作，输入数据通过右侧 I/O 端口加载到阵列，并在每个时钟周期移动到左侧相邻\
    \ PE。输出特征点从左向右移动。同一行中的 PE 重用输入数据来计算同一输出层中的多个点，而不同行的 PE 负责一个批次中的不同前向计算过程，并重用全连接层的权重。\n\
    \n在加载到阵列之前，CONV 层的输入数据被分块以适应片上数据缓存的大小。假设 m×n 个 PE 被分配用于卷积的计算，卷积核尺寸为 k，输入通道数为 Ch，扫描步长为\
    \ 1。因此，需要 (m + k - 1)×k×Ch 个输入点来计算 m×n 个输出点，并且作为该层的分块尺寸。全连接层/循环层的输入相对较小，例如，典型\
    \ FC 层有 4096 个点，对应需要 8KB，此时可以完全加载到片上缓存中，无须分块。Pooling 和 RNN 门控操作在阵列底边的超级 PE 上执行，通过底边\
    \ I/O 端口从片上缓存读取输入数据，并将结果发送回去。\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_55_0.png)\n\
    \n图 4.14 计算流示意图\n\n为了在 PE 阵列上映射混合神经网络，一种直接的方法是采用逐层计算架构，依次调度执行所有神经网络层。但是，以这种逐层方式，计算密集型的卷积层将无法充分利用\
    \ DRAM 带宽，而全连接层和循环层的大量 DRAM 访问将导致 PE 的利用率不足。以 LRCN 网络逐层计算过程为例，来分析运行时的 DRAM 带宽和\
    \ PE 利用率变化。如图 4.15 所示，在全连接层和循环层执行阶段，逐层计算方式实现的 PE 利用率仅为 18.75%，卷积层执行阶段的最低带宽利用率仅为\
    \ 19.63%。平均而言，PE 和内存带宽利用率分别只有 75.68% 和 76.96%。\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_56_0.png)\n\
    \n图 4.15 LRCN 每层的 PE 和带宽利用率评估\n\n这意味着我们可以将不同网络层对计算和存储访问的互补需求相结合，最大限度地利用资源。因此，Thinker\
    \ 提出了一种适用于混合神经网络的多层并行计算数据流，其中大部分 PE 分配给计算密集型的卷积层，大部分带宽分配给存储密集的全连接层/循环层。Thinker\
    \ 的 Multi-Bank 片上缓存、分布式 I/O 端口以及不同操作的独立计算流使得 PE 阵列可以灵活地划分为四个子阵列，分别处理 CONV、FC、Pooling\
    \ 和 RNN 门控操作。图 4.16 (a) 显示了计算 LRCN 网络时的阵列划分和多层并行计算数据流。CONV 阵列分配了 15×13 的通用 PE；FC\
    \ 阵列分配了 15×3 的通用 PE。Pooling 和 RNN 门控分别分配了 9 个和 7 个超级 PE。每个片上缓存被划分为 33-Bank CONV\
    \ 缓存和 15-Bank FC 缓存，并且批次大小被设置为 15。RNN 中的全连接操作与全连接层共享相同的 FC 阵列，并且其余的 RNN 门控操作在超级\
    \ PE 上执行。在 CONV 阵列中，不同的输出通道被映射到不同的列上，可获得 13 次输入数据重用和 15 次权重重用。在 FC 阵列中，多个前向计算过程被并行执行，输入数据和权重的重用次数分别为\
    \ 3 和 15。如图 4.16 (b) 所示，在多层并行计算数据流中，一个批次中的 CONV 和 FC 层的执行被安排在两个连续的流水线阶段中。在 FC\
    \ 层开始之前，其输入数据已经在之前的流水线阶段准备好了。一个批次中的所有前向计算过程的卷积层在一个流水线阶段中按顺序调度，而一个批次中的所有前向计算过程的全连接层/循环层在\
    \ FC 阵列的不同行中并行执行，从而实现权重的重用。多层并行计算数据流，能够将 PE 整体利用率提高 10.3%，带宽利用率提高 21.02%。\n\n\
    ![](img/16a61618bbeb2ecae4884725c4086cbe_57_0.png)\n\n图 4.16 LRCN 的阵列划分和多层并行计算数据流，以及批级别流水线（见彩图）\n\
    \nCONV/FC 阵列的大小以及 CONV/FC 缓存中的 Bank 数量等最佳划分参数，会随着不同的混合神经网络拓扑结构而变化。在一些极端情况下，卷积层的计算和存储访问在整个混合神经网络中占绝对主体，并且该层计算数据流的结果甚至可能优于多层并行计算数据流。因此，4.3.4\
    \ 节将提出按需动态阵列划分算法。\n\n### 4.3.3 基于融合数据模式的存储划分\n\n在多层并行计算数据流中，PE 阵列被划分成若干独立的子阵列，包括\
