    # 7.2.3 调度层次优化：神经网络分层的混合计算模式


    一个卷积运算可分成四个层次的循环。如图 7.16 所示，分别包含循环 N、R、C、M。N 和 M 分别代表输入与输出特征图的通道数，R、C 分别代表权重的参数。图中展示的是三种典型的计算模式
    Input Dominant (ID)、Output Dominant (OD)、Weight Dominant (WD)，分别用多层循环的形式表示，它们的差别主要体现在内外层循环的交换。我们发现，数据生存时间和片上存储需求与循环顺序，特别是最外层循环极为相关。


    在输入、输出和权重这三类数据中，输出数据的生存时间与另两种数据类型完全不同。首先以 ID 为例，与输入、权重这种静态存储在缓存中的数据不同，输出数据会在累加的过程中不断刷新，这种刷新会对
    eDRAM 存储单元重新充电进而恢复之前丢失的电荷。这一过程和周期性刷新操作本质上是一样的。因此，如图 7.16 所示，如果把输出数据作为最外层循环迭代变量，数据生存时间将会非常短。当然，此时必须在片上存下全部的输出数据以避免片外访存。


    其次以 OD 为例，将 Loop N 循环放置在最外层，其余层的遍历循环与 ID 一样。这样一来，第 2 层的循环将计算完所有的输出，并且将它们存储在输出缓存中。此时缓存的容量需求如下：


    ```

    BS_i = Tn × H × L,  BS_o = M × R × C,  BS_w = Tn × Tm × K^2 (7-18)

    ```


    输入/输出/权重数据的生存时间分别为


    ```

    LT_i = LT_o = T_2 = (M × Tn × R × C × K^2) / (MAC × Frequency × ρ),  LT_w = T_1
    = (Tm × Tn × R × C × K^2) / (MAC × Frequency × ρ) (7-19)

    ```'
