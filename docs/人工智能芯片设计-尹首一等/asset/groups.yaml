    ## 7.1 高密度片外存储技术


    ### 7.1.1 三维集成存储器技术


    三维集成(3D Integration)存储器技术是缓解存储器墙问题的一种关键手段[3]。一般使用硅通孔技术(Through-silicon-via，TSV)，将多块带有宽输入输出接口(Wide
    I/O Interface)的存储器裸片在垂直方向上堆叠起来，以获得大存储容量[4]。相比于传统的多片存储模块，三维集成的封装代价和功耗代价要小得多。被电子器件工程联合委员会(Joint
    Electron Device Engineering Council，JEDEC)规定为工业标准的高带宽存储器(High-bandwidth Memory，HBM)就是一种典型的三维集成存储器[5]。


    HBM 的基本结构[4]如图 7.2 所示，是在基底裸片上堆叠 4 个核心 DRAM(图中的 4 个 Core Die)。其基底裸片是存储控制器和核心 DRAM
    之间的接口。核心 DRAM 采用异构结构，其核心裸片在传统 DRAM 的结构上增加了硅通孔。每个核心 DRAM 包含两个通道，每个通道具有 1GB 容量、128
    个 I/O、8 个独立的存储分区(Bank0～Bank7，图中用 B0～B7 表示)，具有独立的地址和点对点连接的数据硅通孔，使不同通道的操作被隔离开来。


    核心 DRAM 裸片的基本结构如图 7.3 所示。它与图形 DRAM 类似，但是每片有两个通道。为了与基底裸片进行数据交互，每个通道的中间区域被划分为硅通孔区域。这些硅通孔区域中包含着用于地址控制的地址(AWORD)硅通孔和用于
    I/O 控制的数据(DWORD)硅通孔。每个通道有 8 个存储分区(Bank)，由于 I/O 数量很大，一个存储分区被划分为两个子存储分区。每个子存储分区包含
    64MB DRAM 单元，每个单元包含 8KB 字线和 8KB 位线。每个子存储分区有自己的 128 个全局 I/O 线，连接到 DWORD。每个 DWORD
    硅通孔包含 32 个硅通孔 I/O。每个通道一共有 256 个全局 I/O 连接到硅通孔，如图 7.3 中的加粗箭头所示。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_106_0.png)


    图 7.2 HBM 基本结构[4]


    ![](img/16a61618bbeb2ecae4884725c4086cbe_106_1.png)


    图 7.3 核心 DRAM 裸片基本结构[4]


    人工智能芯片与 HBM 的集成有两种主要方式：垂直 3D 集成和“3D+2.5D”集成(图 7.4)。垂直 3D 集成方式是将 3D 存储器直接设置在计算单元的上面[6-10]，而“3D+2.5D”集成方式则是将宽接口的
    3D 存储器设置在计算单元的两侧并一起集成到一个封装衬底[11-13]。这两种方式相比较而言，垂直 3D 集成方式需要针对各种不同的神经网络加速器的布局对
    3D 存储器进行定制化，而且在带宽使用量很高的时候会产生严重的散热问题；而“3D+2.5D”集成方式则拥有更好的散热能力，被证明是一个更适用于高吞吐计算的解决方案[14-16]。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_107_0.png)


    ### 7.1.2 3D DRAM 的高温问题


    神经网络计算，尤其是全连接神经网络和循环神经网络计算，对带宽和存储需求量极大。为了满足这些带宽和存储需求，可以考虑结合 3D DRAM 等高密度片外存储技术。然而，按照
    JEDEC 标准规定，DRAM 温度一旦达到 85°C，存储器的自刷新速率就必须翻倍[17]，且每提高 10°C 就翻一倍，这会大幅降低 DRAM 的可靠性和性能。因此散热成为高密度片外存储必须解决的问题。谷歌的
    TPU v3 芯片就使用了 3D DRAM 来满足高带宽需求，而为了解决随之而来的高温问题，甚至使用了水冷系统[18]。


    现有的人工智能芯片直接与 3D DRAM 等高密度存储技术结合，导致高温问题的主要原因包括以下三点。


    第一，传统的人工智能芯片大部分都是采用时分映射（Time Division Mapping, TDM）机制，例如，第 6 章提到的层级时间映射。而在实际应用中，包含有多种不同类型网络层(如卷积层、链接层等)的神经网络被广泛使用。在时分映射机制下，神经网络中的各种网络层依次执行，而不同网络层对于资源利用的倾向不同。一般来说，在执行卷积层的时候对于计算资源的需求量较大，而在执行全连接层和循环层的时候对于带宽资源的需求量较大。这样就会导致温度波动较大，峰值温度可能会很高。


    第二，已有的人工智能芯片设计并不能充分利用片上缓存资源。它们通常将片上缓存分为相互独立的三部分，分别用于存储神经网络的输入、输出和权重数据[19-22]。然而，神经网络中不同类层对于片上缓存的需求也很不相同。如果给输入输出和权重数据各自分配固定大小的片上缓存，在执行整个神经网络的过程中，三种片上缓存的容量往往不能和实际的需求量良好匹配，造成浪费。片上缓存不能得到充分利用，就会造成片外存储访问更加密集，从而加剧高温问题。


    第三，稀疏化并未节省片上缓存资源。在基于单指令多数据流计算单元的人工智能芯片对全连接层进行加速时，常常用到稀疏化技术。然而，目前基于 2D 计算单元阵列的人工智能芯片，通常片上缓存仍然保存密集（Dense）权重，也就是把稀疏化后的全连接层和循环层中被剪枝掉的部分再补上
    0 然后保存。这种密集表示使得片上缓存资源不能得到稀疏化的收益，没有有效利用片上缓存资源，因此也会导致片外存储访问密集而加剧高温问题。


    ### 7.1.3 高温问题的解决思路


    除了物理降温手段以外，从根源上避免高温的产生才是解决问题的关键。这就需要减少片外访存总量和优化片外访存行为模式。


    3D DRAM 中的高温问题包含两个方面：一个是稳定高温；另一个是峰值温度过高。两者成因不同，又具有一定相关性，因此需要对两者进行联合优化才能解决问题。稳定高温主要受到片外访存总量的影响，因此可以采用免补零的稀疏化计算方式、全局缓存、面向缓存的分块和调度等优化手段来减少片外访存总量，降低稳定温度。峰值温度主要受到访存行为模式的影响，可以通过利用神经网络中不同类型的网络层之间访存需求的互补性，通过合理的资源分配和计算调度，平滑各个时刻的访存量来降低峰值温度。


    ### 7.1.4 计算架构优化


    针对高密度访存带来的高温问题，图 7.5 给出一个优化架构 Parana，它是在第 4 章提出的人工智能芯片基本架构 Thinker 的基础上改进得到的。其基本思路是通过空间分割映射（Spatial
    Division Mapping，SDM）平滑访存行为来优化存储器的温度。为了减少访存总量，该架构采用基于高速暂存存储器（Scratch Pad Memory，SPM）的全局缓存、多寄存器缓存，以及面向缓存的分块和调度机制来最大化数据复用，并采用免补零的稀疏化计算方式。该架构主要由四个部分组成：可分区且可重构的计算单元阵列、全局
    SPM 缓存、寄存器高速缓存和数据流控制器。


    图7.5 空间分割映射计算架构


    ![](img/16a61618bbeb2ecae4884725c4086cbe_109_0.png)


    可分区且可重构的计算单元阵列：在加速神经网络时，使用时分映射机制（即第 6 章介绍的进行单层映射并串行执行多层的层级时间映射机制）可能会导致带宽利用率剧烈波动，造成瞬时温度过高。为了解决这个问题，采用空间分割映射让神经网络中计算更密集的部分（如卷积层）和访存更密集的部分（如全连接层和循环层）并行执行，利用两者在资源利用上的互补性来平滑整体的带宽占用率，从而降低峰值温度。为了实现空间分割映射，计算单元阵列需要具有分区的功能，不同的分区执行神经网络中的不同类型网络。以由卷积层和全连接层构成的神经网络为例，计算单元阵列被分为上下两部分，分别执行这两类网络。每个计算单元由包含配置字的控制器、乘累加单元、用于池化操作的最大化比较器和五块局部存储器（LM1～LM5）组成。为了更灵活地支持空间分割映射，每个计算单元的逻辑资源和局部存储资源都支持卷积和全连接这两种工作模式。


    全局 SPM 缓存：这是 Eyeriss[23]采用的一种基于 SPM 的全局缓存设计技术，它通过在片上集成多个 SRAM 分区，每个分区具有自己独立的地址空间，以支持根据神经网络层需求灵活地分配输入、输出和权重数据的缓存空间，避免固定分区和实际数据量不匹配造成的浪费，以最大化
    SPM 缓存容量的利用率。空间分割映射计算架构也借鉴了该技术。


    寄存器高速缓存：虽然全局 SPM 缓存可以在每个周期中提供多个数据访问，但是很难同时为不同类型的数据请求进行服务，如输入/输出/权重这三种类型。因此，采用寄存器堆（Register
    File）组织成多个先入先出（First In First Out，FIFO）模式的寄存器高速缓存，用来桥接全局 SPM 缓存和计算单元阵列之间的数据流，全局
    SPM 缓存通过时分复用的模式为多个寄存器高速缓存提供数据，以解决完成不同类型数据的并行访问这一问题。每次访问全局 SPM 缓存后，一个寄存器高速缓存被填满数据，然后每个周期提供数据到计算单元阵列。与
    SPM 缓存不同，寄存器高速缓存不占用系统地址空间，且寄存器高速缓存中的临时数据都是 SPM 缓存的子集。


    数据流控制器：用于配置计算单元阵列，管理全局 SPM 缓存，并对数据流进行调度，以在 3D 存储器不出现高温问题的前提下实现有效的神经网络加速。控制器首先加载配置信息来配置计算单元阵列上的数据通路。然后，控制器从
    3D DRAM 加载数据，把不同类型的数据分别保存到全局 SPM 缓存的不同分区，并为计算单元阵列提供数据。当数据用尽后，神经网络的执行就完成了。


    在计算单元的设计上，为了支持空间分割映射策略下不同的分区解决方案，空间分割映射计算架构中的计算单元支持配置为卷积或者稀疏化全连接两种模式。图 7.5 描绘了计算单元
    PE 的结构，其中每个计算单元的工作模式由计算单元中的配置字决定，具体的计算过程则由计算单元控制器控制。每个计算单元内部的局部存储器和逻辑资源由两种计算模式所共享。


    在稀疏化全连接计算模式下，计算单元的执行方式如图 7.6 所示。其中，图 7.6 (a) 是稀疏化全连接操作的原始表达，图 7.6 (b) 是其在计算单元上的执行过程。在稀疏化全连接模式下，输入和输出分别被保存在计算单元的局部存储器
    LM1 和 LM5 中。LM2、LM3 和 LM4 则工作于 FIFO 模式，用于缓存全连接层中的非零权重值及对应的列/行坐标。在计算单元控制器的控制下，稀疏化的全连接层在计算单元上的计算包括四个步骤：①计算单元分别从
    LM3、LM2 和 LM4 读取非零权重值及其列/行坐标；②计算单元使用列坐标来从 LM1 索引输入操作数 in[col]，并且用行坐标来索引保存在 LM5
    中的部分和 out[row]；③计算单元执行乘累加操作：out[row]=in[col]×weight；④将得到的结果写回 LM5。这样一来，在计算过程中，片上缓存就不需要保存权重中的零值，可以省出更多的空间保存其他有效值，从而减少对片外存储器的访问量。需要注意的是，存储非零权重值的坐标也需要存储空间，所以稀疏度越高，这种计算方式的收益越大。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_111_0.png)


    (a) 稀疏FC原来的密集表示


    ![](img/16a61618bbeb2ecae4884725c4086cbe_111_1.png)


    (b) 1个PE的加速


    图 7.6 在计算单元中加速稀疏化全连接计算的例子


    在卷积计算模式下，计算过程类似于脉动阵列数据流[23]。如图 7.7 所示，在每个计算单元中，LM1 保存输入特征图中的一行数据，LM2、LM3 和 LM4
    保存卷积核中的一行权重数据。计算单元中的逻辑资源利用这些数据来计算出一行部分卷积和，然后计算单元将部分和保存在 LM5 以便和将来的结果进行累加。在计算单元控制器的控制下，每个计算单元中的卷积计算包括三个步骤：①计算单元从
    LM2/LM3/LM4 读取一个权重（weight），从 LM1 读取一个输入（in），从 LM5 读取一个部分和；②计算单元执行乘累加操作： out =
    in×weight ； ③生成的部分和被写回 LM5。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_112_0.png)


    图 7.7 在计算单元中加速卷积计算的例子


    在计算单元阵列的设计上，空间分割映射计算架构支持可重构和可动态划分。为了允许卷积和稀疏化全连接计算并行，它在计算单元阵列的边缘提供了独立的输入输出接口，以避免数据路径冲突。


    图 7.8 展示了空间分割映射下的阵列划分和混合神经网络的数据流。在这个例子中，卷积和稀疏化全连接计算各占用一半阵列。两部分子阵列分别加速卷积和稀疏化全连接计算，各自拥有三个独立的寄存器高速缓存（输入、输出和权重）。


    在负责稀疏化全连接计算的子阵列中，第 i 列的所有的计算单元均复制一份输入向量 in_i 和输出向量 out_i。非零权重值被统一分为若干个向量，向量总数等于计算单元阵列的行数。每一行计算单元计算非零权重的一个子向量量。每个计算单元按照图
    7.6 (b) 所示的方式进行稀疏化全连接计算。稀疏化全连接计算的数据流包括三个步骤：①输入操作数复制；②稀疏化全连接计算；③输出累加。在第 ① 步中，输入操作数从底部的计算单元传播到整个子阵列，并保存到每个计算单元中的
    LM1。输入神经元被垂直地在计算单元上复用。在第 ② 步中，非零权重被统一划分成三部分，并逐个传播到计算单元阵列的相应行。每个计算单元将非零权重和自身保存的输入操作数相乘，并把乘积和自身保存的部分和进行累加。在第
    ③ 步中，同一列的计算单元中的、属于同一个输出的部分和被累加起来，并从计算单元阵列上输出。


    在负责卷积计算的子阵列中，数据流采用类似 Eyeriss 的脉动阵列形式。权重从顶部的计算单元载入并向下方传播，输入则从左上方的计算单元载入并向对角线方向传播，计算结果则从左向右发送最后写回寄存器高速缓存。


    图 7.8 空间分割映射下的卷积和稀疏化全连接计算的数据流 (见图 彩图)


    ### 7.1.5 优化框架


    为了在空间分割映射计算架构上加速一个特定的神经网络，提出一种空域资源划分和循环分块调度机制相结合的方法，来同时优化 3D 存储器的峰值温度和稳定温度。空域资源划分可以重塑
    3D 存储器的访问行为，达到时间上平滑访存量的效果，从而降低峰值温度。循环分块和调度可以提高片上缓存的利用效率，降低 3D 存储器的访存总量，从而降低稳定温度。下面首先介绍循环分块和调度以及空域资源划分的最优化模型，然后介绍整个编译流程和执行流程。表
    7.1 列出了后面将用到的符号。


    表 7.1 符号一览


    | 混合神经网络参数 | B,DL | 批大小与混合网络的数据位宽 |

    | --- | --- | --- |

    | 混合神经网络参数 | (R,C,M,N), K, LConvNet | 卷积网络参数：(R,C) 表示特征图的行和列，M 表示输出特征图通道数，N 表示输入特征图通道数，K
    表示卷积核尺寸，LConvNet 表示卷积层数 |

    | 混合神经网络参数 | (I,O), SPA, LFcNet/RNN | 全连接层网络参数：I 表示输入神经元个数，O 表示输出神经元个数，SPA 表示稀疏化程度，LFcNet
    表示全连接/RNN 层数 |

    | 架构配置 | SPM | 全局 SPM 缓存的存储容量 |

    | 架构配置 | PE | PE 阵列上的 PE 个数 |

    | 存储划分 | SPMConvNet, SPMFcNet/RNN | 用于缓存卷积网络、全连接网络对应的 SPM 容量大小 |

    | 存储划分 | PEConvNet, PEFcNet/RNN | 用于计算卷积网络、全连接网络对应的 PE 个数 |

    | 分块与调度 | (Tb, Tr, Tc, Tm, Tn) | 卷积层的分块参数 |

    | 分块与调度 | (Tb, Ti, To) | 全连接层的分块参数 |

    | 分块与调度 | CONV-ir, FC-ir | 复用输入 |

    | 分块与调度 | CONV-wr, FC-wr | 复用权重 |

    | 分块与调度 | CONV-or, FC-or | 复用部分和 |


    优化片外访存总量的循环分块和调度方法：前面介绍的全局 SPM 缓存的关键设计目标是在加速神经网络的时候最大化数据重用性。然而，Eyeriss 只采用了一种固定的数据流——行固定模式[23]。针对神经网络在带有
    HBM 的人工智能芯片系统上执行时的高温问题，需要根据神经网络的不同类层采用最适合的计算调度方式，达到最有效的数据重用。


    下面先以卷积层为例，介绍如何确定最合适的计算调度方式。第 5 章介绍了多种数据复用方式，这里主要考虑输入复用、输出复用以及权重复用这三种方式。第 6 章提到神经网络常常需要分块后进行处理，典型的分块方法是用分块参数
    (Tr, Tc, Tm, Tn) 将卷积层在 R、C、M 和 N 维度上分成 (Tr × Tc × Tm × Tn) 大小的分块，然后逐分块进行计算。在空间分割映射模式下，每个计算阵列分区以内仍然


    \( N_{Tile} = \left\lceil \frac{R}{Tr} \right\rceil \times \left\lceil \frac{C}{Tc}
    \right\rceil \times \left\lceil \frac{M}{Tm} \right\rceil \times \left\lceil \frac{N}{Tn}
    \right\rceil \tag{7-1} \)


    当分块参数确定了，无论采用何种数据复用方式，所需要的片上缓存数据量都是固定的，如下(i、o、w 分别表示输入、输出和权重)：


    \(\text{SPM}_{\text{CONV-i}} = \text{Tr} \times \text{Tc} \times \text{Tn} \\

    \text{SPM}_{\text{CONV-o}} = \text{Tr} \times \text{Tc} \times \text{Tm} \\

    \text{SPM}_{\text{CONV-w}} = \text{Tm} \times \text{Tn} \times K \times K \tag{7-2}\)


    如果没有进行任何针对数据复用的计算调度优化，那么每执行一个循环分块都要完全地从片外存储各读一次输入和权重数据，以及读一次和写一次输出数据，总的片外访存量也就等于：


    \(\text{MA}_{\text{CONV-Original}} = (\text{SPM}_{\text{CONV-i}} + 2 \times \text{SPM}_{\text{CONV-o}}
    + \text{SPM}_{\text{CONV-w}}) \times N_{\text{Tile}} \tag{7-3}\)


    在输入复用(IR)或者权重复用(WR)模式下，相应数据只需要读取一次，就会停留在片上缓存内直到被使用完毕，不会出现同一个数据从片外读取多于一次的情况。同理，在输出复用(OR)模式下，部分和会停留在片上直到累加完毕才保存出去。三种复用模式是互斥的，每一层网络只能选择一种，其各自的片外访存量如下：


    \(\begin{cases} \text{MA}_{\text{CONV-ir}} = R \times C \times N + (2 \times \text{SPM}_{\text{CONV-o}}
    + \text{SPM}_{\text{CONV-w}}) \times N_{\text{Tile}} \\ \text{MA}_{\text{CONV-or}}
    = R \times C \times M + (\text{SPM}_{\text{CONV-i}} + \text{SPM}_{\text{CONV-w}})
    \times N_{\text{Tile}} \\ \text{MA}_{\text{CONV-wr}} = M \times N \times K \times
    K + (\text{SPM}_{\text{CONV-i}} + 2 \times \text{SPM}_{\text{CONV-o}}) \times
    N_{\text{Tile}} \end{cases} \tag{7-4}\)


    对于一组特定的分块系数，我们可以根据上述公式很容易地确定哪一种复用方式的片外访存量最小。卷积层最小化片外访存的优化问题可以描述如下：


    \(\begin{cases} \min \text{MA}_{\text{CONV}} = \min(\text{MA}_{\text{CONV-ir}},
    \text{MA}_{\text{CONV-or}}, \text{MA}_{\text{CONV-wr}}) \\ \text{s.t. } \text{SPM}_{\text{CONV-i}}
    + \text{SPM}_{\text{CONV-o}} + \text{SPM}_{\text{CONV-w}} \leqslant \text{SPM}_{\text{ConvNet}}
    \end{cases} \tag{7-5}\)


    对于全连接层(包括循环层)，由于我们引入了批处理机制来使得其权重可复用，因此分块参数是(Tb,Ti,To)。类似上面卷积层的建模方式，我们可以得到全连接层的分块数量为


    \( N_{\text{Tile}} = \left\lceil \frac{B}{\text{Tb}} \right\rceil \times \left\lceil
    \frac{I}{\text{Ti}} \right\rceil \times \left\lceil \frac{O}{\text{To}} \right\rceil
    \tag{7-6} \)


