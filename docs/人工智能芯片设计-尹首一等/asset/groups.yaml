    \n因此，可以利用 DNN 的容错能力来重新训练网络使其能承受更高的错误率，以获得更长的“可容忍”的数据维持时间。如图 7.15 所示，RANA 在训练的正向过程中对输入和权重数据加入一个掩膜\
    \ (Layer Mask) 以引入误差。这个掩膜会以一定的错误率对每个比特注入误差。经过反复的训练，如果最终的精度损失可以接受，那么就认为网络可以承受当前的错误率。经试验发现，对于\
    \ AlexNet、VGG、GoogLeNet 和 ResNet 这四种网络，错误率提高到 10^-5 后网络精度仍没有损失，此时对应的“可容忍”的数据维持时间提高到了\
    \ 734μs，因此可以以更低的频率刷新甚至消除刷新操作。\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_124_0.png)\n\
    \n图 7.15 训练层次优化：数据生存时间感知的训练方法\n\n### 7.2.3 调度层次优化：神经网络分层的混合计算模式\n\n一个卷积运算可分成四个层次的循环。如图\
    \ 7.16 所示，分别包含循环 N、R、C、M。N 和 M 分别代表输入与输出特征图的通道数，R、C 分别代表权重的参数。图中展示的是三种典型的计算模式\
    \ Input Dominant (ID)、Output Dominant (OD)、Weight Dominant (WD)，分别用多层循环的形式表示，它们的差别主要体现在内外层循环的交换。我们发现，数据生存时间和片上存储需求与循环顺序，特别是最外层循环极为相关。\n\
    \n在输入、输出和权重这三类数据中，输出数据的生存时间与另两种数据类型完全不同。首先以 ID 为例，与输入、权重这种静态存储在缓存中的数据不同，输出数据会在累加的过程中不断刷新，这种刷新会对\
    \ eDRAM 存储单元重新充电进而恢复之前丢失的电荷。这一过程和周期性刷新操作本质上是一样的。因此，如图 7.16 所示，如果把输出数据作为最外层循环迭代变量，数据生存时间将会非常短。当然，此时必须在片上存下全部的输出数据以避免片外访存。\n\
    \n其次以 OD 为例，将 Loop N 循环放置在最外层，其余层的遍历循环与 ID 一样。这样一来，第 2 层的循环将计算完所有的输出，并且将它们存储在输出缓存中。此时缓存的容量需求如下：\n\
    \nBS_i = Tn × H × L,  BS_o = M × R × C,  BS_w = Tn × Tm × K^2 (7-18)\n\n输入/输出/权重数据的生存时间分别为\n\
    \nLT_i = LT_o = T_2 = (M × Tn × R × C × K^2) / (MAC × Frequency × ρ),  LT_w =\
    \ T_1 = (Tm × Tn × R × C × K^2) / (MAC × Frequency × ρ) (7-19)\n"
