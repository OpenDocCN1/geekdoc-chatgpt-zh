    络权值的修正，直到权重值调整到最佳，以使得整个网络的预测效果最好。后向计算过程就是网络的学习和训练过程，该过程主要基于 BP 算法进行。


    BP 算法是训练神经网络的一种重要方法。它首先通过前向计算将训练集数据输入神经网络的输入层，经过一个或者多个隐藏层，最后到达输出层并输出结果；随后基于链式求导法则，将输出结果与实际结果之间的误差从输出层向隐藏层反向传播，直至输入层。在反向传播的过程中，根据误差调整网络参数的值，通过不断迭代反向传播过程，直至神经网络的输出结果收敛。以图
    2.6 的多层神经网络为例，其中 \(a_1^{(2)}\) 表示第二层（隐藏层）第一个神经元的输出，\(a_2^{(2)}\) 表示第二层（隐藏层）第二个神经元的输出，\(a_3^{(2)}\)
    表示第二层（隐藏层）第三个神经元的输出。这三个神经元的输出分别表示为


    ```

    \(a_1^{(2)} = \varphi(w_{11}^{(1)}x_1 + w_{21}^{(1)}x_2 + w_{31}^{(1)}x_3 + b^{(1)})
    \quad (2-7)\)

    \(a_2^{(2)} = \varphi(w_{12}^{(1)}x_1 + w_{22}^{(1)}x_2 + w_{32}^{(1)}x_3 + b^{(1)})
    \quad (2-8)\)

    \(a_3^{(2)} = \varphi(w_{13}^{(1)}x_1 + w_{23}^{(1)}x_2 + w_{33}^{(1)}x_3 + b^{(1)})
    \quad (2-9)\)

    ```


    经过输出层，多层神经网络的输出 \(y_3\) 为


    ```

    \(y_3 = \varphi(w_{11}^{(2)}a_1^{(2)} + w_{21}^{(2)}a_2^{(2)} + w_{31}^{(2)}a_3^{(2)}
    + b^{(2)}) \quad (2-10)\)

    ```


    其中，\(w_{ij}^{(t)}\) 是相邻两层（t 与 t+1 层）神经元之间的权重值。神经网络的训练过程就是求解神经元之间的权重，使得误差函数最小的一个过程。误差函数是所有待求解权重的一个复合函数，一般采用梯度下降算法来求解误差函数的极值。梯度下降算法的基本步骤为：首先选取一个初始点，求解梯度向量；然后向梯度向量为负的方向，以合适的步长进行搜索，找到最佳的权重值；不断地迭代搜索过程，直到两次迭代之间的差值小于设定的阈值；最后输出迭代后的网络参数等结果。


    在神经网络中，假设我们要求的误差函数为：\(H(w_{11}, w_{12}, \cdots, w_{mn})\)，对误差函数求梯度，则可表示为


    ```

    \(\nabla H = \frac{\partial H}{\partial w_{11}}e_{11} + \frac{\partial H}{\partial
    w_{12}}e_{12} + \cdots + \frac{\partial H}{\partial w_{mn}}e_{mn} \quad (2-11)\)

    ```


    利用 BP 算法来求解这些复杂的偏导数，求出权重改变量然后更新权重，这样就达到了神经网络学习的目的。


    # 2.3 深度神经网络


    深度神经网络一词里的“深度”主要是指神经网络的层数，它并没有固定的定义——在语音识别中 4 层网络就能够被认为是“较深的”，而在图像识别中 20 层以上的网络屡见不鲜。单从结构上来说，全连接的深度神经网络和图
    2.6 的多层感知器是没有任何区别的，更多的层数主要是为了让网络更容易刻画现实世界'
