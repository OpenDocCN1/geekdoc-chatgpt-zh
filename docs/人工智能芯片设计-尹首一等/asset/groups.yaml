    如图 4.6 所示，ENVISION 主要包含一个专用于控制的 16bit RISC 核，一个专用于 ReLU 和池化操作的一维 SIMD 处理单元，以及一个专门处理卷积层和全连接层操作的二维
    SIMD MAC 阵列。针对这样的结构，ENVISION 提高能效的策略包括三个方面：一是优化核心部件——MAC 的设计，ENVISION 设计了电压-精度-频率可动态缩放
    (Dynamic-Voltage-Accuracy-Frequency Scaling, DVAFS) 的 MAC 阵列，支持通过逐层调制 MAC 阵列中的计算精度和电源电压来最小化能量消耗；二是通过挖掘
    CNN/DNN 内在的并行性和数据重用性来提高 MAC 阵列的数据效率；三是针对神经网络具有大量冗余信息且模型具有容错性的特点，采用稀疏化的网络压缩技术，移除不必要的乘加计算来减少计算量和访存量，并在硬件上提供稀疏化计算支持，提高了神经网络的硬件执行效率。ENVISION
    的最高峰值能效比都可达到 10TOP/W①。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_44_0.png)


    图 4.6 ENVISION 整体架构[7]


    谷歌公司于 2016 年推出的 ASIC 型云端神经网络加速器 TPU (Tensor Processing Unit) [8]也是空域计算架构的典型代表之一。同年击败李世石的围棋机器人
    AlphaGo 就在谷歌云上使用了 50 个 TPU 进行计算。图 4.7 给出了 TPU 的模块结构图，它以 256×256 个 MAC 组成二维矩阵乘法阵列为运算核心。为了支持推理运算过程，减少与主机
    CPU 的交互，提高性能和能效，内部还集成了归一化/池化单元和完成非线性激活操作的激活单元。二维矩阵乘法阵列的输入缓存总共 24MB，包括权重缓存和提供输入特征数据的统一缓存，其输出由图中标记为累加器的
    6MB 输出缓存接收。加上用于与主机处理器进行对接的缓存，片上缓存总共占芯片面积的 37%，如此大规模片上缓存的使用有效减少了 TPU 与片外内存交互，对于提升整体性能和能效都非常有利。在核心运算单元的设计方面，TPU
    的二维矩阵乘法阵列按照脉动阵列（Systolic Array）方式互连并完成计算，如图 4.8 所示，将阵列中的所有 ALU 串联起来，在每一串 ALU 中，只有第一个
    ALU 能够直接从统一缓存中读取数据，只有最后一个 ALU 直接将计算的部分和写入累加器，输入数据在前一个 ALU 使用完以后按周期自动流入同一行的下一个
    ALU，计算得到的部分和则按同样的方式流入同一列的下一个 ALU。由于这种数据流结构中的数据像血液在血管中脉动传输一样在阵列中按照一定的节奏传递计算，因此又称为脉动结构（Systolic
    Architecture）。基于这种脉动数据流计算方式，输入数据与部分和数据在 ALU 之间通过直接传递实现了复用，而权重数据固定在每个 ALU 的寄存器中也实现了复用，由此
    TPU 获得了智能计算中所有数据的最大化复用，不仅减少了与片外存储的交互，也最小化了与片上本地缓存的数据交互，有效提升了 TPU 的整体性能和能效。此外，TPU
    还针对低位宽运算带来的算法准确率损失很小的特点，采用了 8bit 低精度运算来提升性能和能效。最终，与 CPU 和 GPU 相比，TPU 在性能上获得 30
    倍的提升，能效方面则获得 30~80 倍的提升。谷歌在 TPU 设计上取得的巨大成功，使得人工智能芯片的研究开始受到工业界的重视，成为各大公司产品路线中的重要一环，微软、英特尔、NVIDIA、赛灵思等科技巨头都陆续推出相关产品，人工智能芯片产品从此逐渐走向实用化。


    图 4.7 TPU 的模块结构


    ![](img/16a61618bbeb2ecae4884725c4086cbe_46_0.png)


    图 4.8 TPU 矩阵乘法阵列的脉动数据流


    空域计算架构能够有效提高计算任务的执行性能，并控制能耗，但其缺少时间域上的可变性，使得其灵活性不足，应用范围受限。


    ## 4.2 现状分析


    作为目前产学研界关注的研究热点，除了前面介绍的几种典型设计之外，研究人员还提出了多种新型智能计算架构[9-15]，但普遍存在以下问题。


    第一，已有的设计没有利用神经网络对于低位宽量化[16]的天然容错能力来提高计算性能。这种天然容错能力是指，在算法精度损失的限定范围内，有些层可以量化为低位宽。如表
    4.1 所示，将 LRCN 的每一层的数据位宽分别量化为 9/8/8/8/9/8/8/8bit 时，与所有层量化为 16bit 相比，精度损失仅为 1.8%。


