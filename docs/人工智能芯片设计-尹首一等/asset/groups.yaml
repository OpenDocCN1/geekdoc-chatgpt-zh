    是 0.42pJ/bit。式 (5-8) 仅考虑访存能耗而没有考虑乘加计算能耗是因为对于一个给定的网络，乘加计算能耗可以认为是一个常数。根据当前层的参数和硬件存储的约束，通过式
    (5-8) 即可评估各种可能的数据复用模式的访存能耗，进而找出适合当前层最优的数据复用模式。


    # 5.4.1 工作流程和调度框架


    基于混合数据复用模式，提出如图 5.10 所示的智能计算架构工作流程，该流程主要包括两个阶段。阶段 1 是编译阶段，会给神经网络的每一层分配一个最优的数据复用模式及分块参数，记为
    < IR/OR/WR, Tr, Tc, Tm, Tn >，并编译成架构的配置信息；阶段 2 是执行阶段，架构会根据配置信息重构片上硬件资源，并以最高的能效执行神经网络。


    CNN 中每个网络层的大小和卷积参数都具有多样性，需要灵活且高效的计算模式来支持能效和性能的共同优化，因此，为编译阶段提出了如图 5.10 所示的逐层调度框架。对于
    CNN 的每一层，该框架根据给定的硬件资源约束，求解能效与性能的双目标优化问题，从而获得各网络层最优的计算模式。对于 CNN 的计算来说，计算能效等于给定
    CNN 的总操作数(即乘加操作数)与总能耗的比值，也就是说，能效是反比于能耗的。因此，调度框架中的能效优化可直接转化为能耗优化问题，能耗的计算参照式 (5-8)。而计算的性能指神经网络的计算吞吐，通常按式
    (5-9) 计算为每秒执行的操作数量：


    ```

    性能 = 2MAC × PE 利用率 × 频率

    ```'
