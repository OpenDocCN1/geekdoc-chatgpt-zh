    # 5. I/O 和解码器


    权重和配置通过可配置的 I/O 端口进行加载。为了利用稀疏性，权重通过两符号哈夫曼编码进行压缩，并由解码器单元进行解码。为了灵活支持不同长度的网络层参数，解码器首先读取指示网络层类型的最高两位，然后加载相应长度的字。输入和输出数据直接在片上缓存和外部存储器之间传输。为了适应缓存容量大小，输入数据将被分块。


    # 4.3.2 计算数据流


    在 PE 阵列中，输出点的计算固定在各自的 PE 上，重用权重以及在垂直和水平方向的输入特征点(也称为输出固定数据流)。


    如图 4.14(a) 所示，对于卷积操作，输入数据通过左侧 I/O 端口从片上缓存加载到最左边的 PE 列。在每个时钟周期内，这些数据通过正向路径移动到右侧相邻
    PE。一列中的 PE 并行计算相同输出特征图的不同点，并且不同列的 PE 被分配计算各自的输出特征图。当一个输出特征点完成计算后，结果通过反向路径从右向左移动，最后通过左侧
    I/O 端口发送到片上缓存。这样，阵列内部就不需要添加额外的 I/O 端口。在一个三维卷积核的计算过程中，数据移动造成的额外开销最多为 30 个时钟周期，即最右侧的
    PE 列有 15 个时钟周期的输入延迟和 15 个时钟周期的输出延迟。由于完成一个三维卷积核的计算通常需要数千个时钟周期，所以这个开销可以忽略不计。以 AlexNet
    为例，上述额外开销只占计算周期总数的 2.2%。


    如图 4.14(b) 所示，对于全连接操作，输入数据通过右侧 I/O 端口加载到阵列，并在每个时钟周期移动到左侧相邻 PE。输出特征点从左向右移动。同一行中的
    PE 重用输入数据来计算同一输出层中的多个点，而不同行的 PE 负责一个批次中的不同前向计算过程，并重用全连接层的权重。


    在加载到阵列之前，CONV 层的输入数据被分块以适应片上数据缓存的大小。假设 m×n 个 PE 被分配用于卷积的计算，卷积核尺寸为 k，输入通道数为 Ch，扫描步长为
    1。因此，需要 (m + k - 1)×k×Ch 个输入点来计算 m×n 个输出点，并且作为该层的分块尺寸。全连接层/循环层的输入相对较小，例如，典型 FC
    层有 4096 个点，对应需要 8KB，此时可以完全加载到片上缓存中，无须分块。Pooling 和 RNN 门控操作在阵列底边的超级 PE 上执行，通过底边
    I/O 端口从片上缓存读取输入数据，并将结果发送回去。'
