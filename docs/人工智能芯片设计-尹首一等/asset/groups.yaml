    \ \\quad \\alpha_o = 0, \\quad \\alpha_w = \\lceil R/Tr \\rceil \\lceil C/Tc \\\
    rceil \\quad (5-4)\\)\n\n由于计算核心的输出寄存器中存储着 Tm 个通道的输出特征图，输入特征图需要重复地读取 \\(\\lceil\
    \ \\frac{M}{Tm} \\rceil\\) 次。不同于 IR 模式，OR 模式中的权重会被各个输出分块重复使用，所以 \\(\\alpha_w =\
