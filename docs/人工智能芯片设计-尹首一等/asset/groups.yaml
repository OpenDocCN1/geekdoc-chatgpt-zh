    # 7.2.4 架构层次优化：刷新优化的 eDRAM 控制器


    针对不同的计算模式，权重数据/输入特征图数据/输出特征图数据对缓存的需求也会不同。因此 eDRAM 必须能够匹配不同数据模型下的数据需求。在传统的 eDRAM
    控制器中，所有的 eDRAM 分区都以最保守的刷新周期进行刷新。但是通过之前的分析看到，不同的计算模式下数据的生存时间不一样，所以为了提高能效，eDRAM
    需要匹配不同的数据类型进行不同的刷新操作。


    本节提出的方案对 eDRAM 控制器稍加改造，如图 7.18 所示，加入一个可编程的时钟分频器、各 eDRAM 分区独立的刷新触发器和刷新标志位。控制器的配置信息来自于前两个技术的编译结果，具体将决定每个分区分别存储什么数据类型、是否需要刷新以及刷新周期。


