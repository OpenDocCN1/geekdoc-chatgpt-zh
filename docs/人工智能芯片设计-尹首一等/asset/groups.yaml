    # 3.2 基本网络层的计算特点


    从数学模型分析，神经网络基本层主要具有以下特点。


    第一，网络进行的基本运算包含乘累加、非线性运算、池化运算等基本操作。对于任意 M×N 维的权重矩阵和 N×1 维的输入特征向量，在全连接层和递归层所需的乘累加操作的计算量与其他非线性操作的计算量的比值大约为
    N:1。因此，乘累加运算的高效执行对于神经网络的计算具有重要意义。


    第二，卷积层以三维卷积核作为基本滑动窗口，以步长 S 在输入特征图上滑动，分别与窗口内的三维输入特征子矩阵进行三维卷积运算，使得输入特征图上大量数据需要多次重复参与运算，而且参与运算的时间不一定连续，因此神经网络不仅计算量大，而且访存操作量也很大，控制则比较简单。以
    2012 年 ImageNet 大规模物体识别挑战赛 (ImageNet Large Scale Visual Recognition Challenge,
    ILSVRC) 冠军网络 AlexNet[2]为例，其计算量最大的卷积层达到 448MOP(百万次操作 (Million Operation, MOP))，计算量最小的卷积层也达到
    150MOP。而访存量最大的卷积层达到 2MB 以上，访存量最小的卷积层也接近 1MB。


    第三，神经网络数据结构与底层硬件存储结构之间存在巨大差异，前者到后者的映射所带来的能效损耗成为智能计算芯片架构设计面临的重要挑战。在深度神经网络中，卷积层的输入数据和权重数据都是一组三维张量，按卷积核大小的三维数据结构和卷积滑动步长顺序组织变量参与运算。然而硬件存储器一般采用一维线性排列的基本单元组成，因此，卷积层数据最终在存储器上都将转换成一维的线性存储模型进行存储，而且一维存储模型要求访存严格按照地址顺序，从头至尾进行查找访问。这种神经网络数据结构与硬件存储结构的差异造成内存访问
    50%以上的微操作都是空操作，能耗损失较大。而且，每次只能对一个存储单元进行操作，导致神经网络的并行性难以发挥，限制了运算性能的提升。


    第四，不同类型的神经网络基本层具有不同的计算特点，呈现多样化特征。以 2012 年 ILSVRC 竞赛冠军网络 AlexNet 为例，它由 5 个卷积层、3
