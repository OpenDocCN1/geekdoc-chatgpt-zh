    # 3.3 智能计算的挑战现状分析


    基于网络基本层的特点，从神经网络整体以及不同神经网络之间的差异着手，可以总结出智能计算所面临的挑战。


    # 3.3.1 访存能力


    目前的深度神经网络类智能计算高度依赖海量的数据，然而运算单元与内存之间的性能差距越来越大，内存子系统已经成为芯片整体处理能力提高的障碍，也就是通常所说的“内存墙”。而神经网络的数据密集型工作负载，需要大量的存储和各层次存储器间的数据搬移，导致“内存墙”问题更加突出。因此，如何缓解计算单元和存储器之间的差距，已经成为目前学术界和工业界无法回避的主要挑战。


    进一步地，为了在智能任务中获得足够高的精度，神经网络需要大量的网络层，而且每一层的数据访问量都很大。例如，卷积层需要大量多通道的卷积核，再加上卷积层内滑窗式的卷积运算使得相同位置的数据需要多次重复参与运算，且参与运算的时间不连续，导致访存量激增，而全连接层的权重矩阵尺寸与输入特征图尺寸相同，需要的数据访问量也很大。AlexNet拥有的参数量达到6000万个，约228MB；VGG16拥有1.3亿个参数，约527MOP；而Google
    NMT神经网络含有37亿个参数，约13GB。


    如此巨大的参数量不仅需要巨大的存储容量，而且必须进行高效访问。因此，对内存数量、访存带宽和内存管理方法都有很高要求，这些对于智能计算芯片来说都是巨大挑战。


    # 3.3.2 功耗控制


    在智能计算过程中，由于参数量过于庞大，拥有有限空间的片上静态随机存取存储器(Static Random Access Memory，SRAM)(以几百KB为例)无法全部存储，绝大部分数据被存入片外动态随机存取存储器(Dynamic
    Random Access Memory，DRAM)，造成了频繁的存储器访问(简称访存)。相关研究结果表明，神经网络中数据访存造成的功耗甚至超过了计算[4]。表3.2展示了商用65nm制程下，不同级别的数据访存操作相对于一个乘累加操作的相对功耗[4]。其中，最靠近计算单元的局部寄存器(Register
    File，RF)的功耗最低，与乘累加操作相当，而最远的片外DRAM的功耗则高达乘累加操作的200倍。因此，理论上，让数据尽可能多地在靠近计算单元的地方停留并被多次重用，才能减少数据访存的功耗。当然，各级存储空间会受到成本和面积的约束，这就需要进行权衡折中，精心设'
  - '[PAGE 31]


    计算智能计算芯片的硬件架构和数据流。因此，如何解决大规模数据访存带来的功耗问题是智能计算需要解决的重点和难点。


    表 3.2 在商用 65nm 制程下，各种级别的数据访存操作相对于一个乘累加操作的相对对耗[4]


    | 功耗类型 | DRAM | 全局缓存 (>100KB) | 阵列(处理单元 (Processing Element, PE) 间传数) (1 ~ 2mm)
    | RF (2.5KB) |

    |---|---|---|---|---|

    | 相对功耗 | 200 倍 | 6 倍 | 2 倍 | 1 倍 |


    # 3.3.3 架构通用性


    为了提高精度，神经网络正朝着层次更深、拓扑连接更复杂和网络混合更丰富的方向快速演进，神经网络层与层间及不同类型网络间的差异性不断加大。如图 3.5 所示，神经网络深度已经从十几层（如
    VGG16/19）发展到上百层，甚至上千层；以 GoogLeNet 和 ResNet 为代表的网络中出现了 Inception 和残差计算等复杂的多层连接拓扑结构；此外，还有卷积神经层、全连接层和循环层等不同类型网络组合构成类似的多模态网络（如
    LRCN），以实现更复杂的智能任务。因此，适用于高效处理不同神经网络的硬件互连结构、基础计算部件都存在较大差异，与之匹配的硬件架构需求也截然不同。例如，针对卷积神经网络的加速架构，在执行长短期记忆网络
    (Long Short-Term Memory, LSTM) 模型时并行利用率可能还不到 20%。即使是可重构的架构也难以摆脱硬件固有的固化性，其架构可重构的空间也是有限的，所以在架构设计时如何解决智能计算芯片的通用性问题也是智能计算的重要挑战之一。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_31_0.png)


    图 3.5 神经网络算法的演进


    明确定位计算芯片的应用范围，合理缩小设计的通用性目标是有效的解决方法之一，如定位为专门加速某种一神网络，或是适用于图像识别、语音识别等场景中的多种常用网络。在设计过程中，则需要调研应用范围内网络的共性和差异，'
  - '[PAGE 32]


    在设计的时候保证计算芯片既能满足对不同情况的兼容性，又能够利用共性来改善芯片的性能、面积和能效。针对同一神经网络内部，不同层的差异，则需要考虑如何设计合适的计算芯片结构和合理的映射机制，以有效地调度网络计算、分配硬件资源，减少计算单元和数据传输资源空置的时间，保证在执行神经网络的时候，始终能有效地利用硬件资源。此外，还需要考虑网络是否会存在不同分支或者资源利用倾向差异很大的不同成分，根据这些特点做好相应的优化工作，避免执行过程中网络计算量和数据传输量剧烈变化造成的资源浪费。


    # 3.3.4 稀疏性


    在神经网络中，很多因素都可以带来网络的稀疏性，例如，权重矩阵本身的稀疏性、ReLU 等函数带来的激活值的稀疏性等。统计表明，LeNet、AlexNet、VGG
    等经典网络的稀疏性可以达到 90%左右（也就是 90%左右的权重值为 0）。如果这些稀疏性能够得到有效的利用，神经网络的能效在理论上能够显著地提高。然而稀疏化会导致非规则性，为了匹配硬件运算把稀疏化网络进行规则化（如补
    0）又可能会抹杀稀疏化的收益，这就产生了矛盾，导致执行性能并没有获得相应提升。


    图 3.6 给出了传统的 CPU、GPU 以及典型的专用集成电路（Application-Specific Integrated Circuit，ASIC）加速器
    DianNao[5]分别执行 LeNet、AlexNet、VGG 这三种稀疏化网络所需的执行时间与执行原始网络的对比情况。由于 CPU、GPU 乃至 ASIC
    加速器都没有针对稀疏性有效地降低计算和存储代价，它们在执行性能上都没有获得相应的提升。其中，CPU 执行稀疏化网络的时间比起原始网络反而更长了，平均是 211.45%。GPU
    取得了平均 23.34%的性能提升，但还是远远不及稀疏化的程度。DianNao 的提升非常微弱，主要是因为 DianNao 在执行稀疏网络时，将原本已经被剪除的部分又补上了
    0，增加了无意义的计算，导致实际的计算量没有变化。因此，如何有效地利用稀疏化的优点，提高智能计算的性能和能效，也是设计智能计算芯片的重要挑战之一。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_32_0.png)


    图 3.6 CPU、GPU、DianNa[5]上稀疏化神经网络的加速比[6]'
