    ## 7.2.4 架构层次优化：刷新优化的 eDRAM 控制器


    针对不同的计算模式，权重数据/输入特征图数据/输出特征图数据对缓存的需求也会不同。因此 eDRAM 必须能够匹配不同数据模型下的数据需求。在传统的 eDRAM
    控制器中，所有的 eDRAM 分区都以最保守的刷新周期进行刷新。但是通过之前的分析看到，不同的计算模式下数据的生存时间不一样，所以为了提高能效，eDRAM
    需要匹配不同的数据类型进行不同的刷新操作。


    本节提出的方案对 eDRAM 控制器稍加改造，如图 7.18 所示，加入一个可编程的时钟分频器、各 eDRAM 分区独立的刷新触发器和刷新标志位。控制器的配置信息来自于前两个技术的编译结果，具体将决定每个分区分别存储什么数据类型、是否需要刷新以及刷新周期。


    ## 7.2.5 实验结果


    我们基于以上的框架在神经网络加速器上进行了评估，其中加速器采用了 TSMC 65nm GP 技术，选用的网络模型为 AlexNet、VGG、GoogleNet
    和 ResNet。我们选取了三种基准设计：S+ID 表示采用 SRAM 存储器并用 ID 计算模式，eD+ID


    ![](img/16a61618bbeb2ecae4884725c4086cbe_127_0.png)


    ## 图 7.18 架构层次优化：刷新优化的 eDRAM 控制器


    表示采用 eDRAM 存储器并用 ID 计算模式，eD+OD 表示采用 eDRAM 存储器并用 OD 计算模式。此外，RANA (0) 模式是使用了 eD+OD
    的模式，RANA (E-5) 使用了数据生存时间感知的训练方法，将错误率控制在大约 $10^{-5}$ 量级，而 RANA* (E-5) 则是加入了刷新优化机制的
    eDRAM 控制器。因此 eDRAM 的刷新时间大约为 $734\mu s$。


    图 7.19 展示了这 6 种设计在系统能耗方面的对比情况。为了更好地表现效果，所有的能耗数值都以 S+ID 为基准进行归一化。与 S+ID 相比，eD+ID
    具有更大的片上缓存容量(1.454MB eDRAM 和 384KB SRAM)，因此平均减少了 40.3%的片外访存，但因为额外的 eDRAM 刷新能耗，eD+ID
    的总能耗比 S+ID 提升了 13.3%。尤其是对于 AlexNet 网络而言，由于它的规模相对较小，没有额外的片外访存，刷新操作占据了较大的能耗比重，因此
    eD+ID 模式在 AlexNet 上达到 2.3 倍的能耗增加。而与 eD+ID 方式进行比较，eD+OD 的模式拥有较短的数据生存时间，也就消除了许多刷新操作，因此平均节省了
    43.7%的刷新能耗。其余几个优化模式也取得了不错的效果，如 RANA (0) 相比于 eD+OD 模式节省了 19.4%的总能耗，这是因为混合计算模式比单纯的
    OD 计算模式节省了更多的片外访存。


    从图 7.19 可以看到，从 RANA (0) 到 RANA (E-5) 具有明显的能耗降低，这主要是因为刷新次数的减少，RANA (E-5) 拥有更长的“可容忍”的数据维持时间以及刷新间隔。因此继续针对数据维持时间进行了探究性的工作，如图
    7.20 所示，随着数据维持时间的增加，刷新能耗会显著地降低。选取 eD+ID、eD+OD 和 RANA (0) 三种模型，并将数据维持时间的跨度设置为 $45
    \sim 1440\mu s$。可发现 eD+OD 组合始终比 eD+ID 的组合消耗更少的刷新能耗，并且随着数据维持时间的增加，效果会更显著。例如，当时间从
    $90\mu s$ 增加到 $180\mu s$ 时，刷新间隔也随之翻倍，eD+ID 的刷新能耗降低了 50%，而 eD+OD 的刷新能耗降低了 80.1%。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_128_0.png)


    ## 图 7.19 RANA 框架系统级能耗分析（见彩图）


    ![](img/16a61618bbeb2ecae4884725c4086cbe_128_1.png)


    ## 图 7.20 加速器在 ResNet 上的能耗比较（见彩图）


    在此之上，继续进行更细粒度的探究，即针对 VGG 网络中的每一层信息进行不同模式的比较。如图 7.21 所示，在第 2～8 层，RANA (0) 表现出显著能耗降低的效果，这是因为
    WD 取代了 OD 被选为这些层的计算模式。这 7 层的缓存容量需求均超过了 1.454MB 的 eDRAM 缓存大小。在 WD 计算模式的帮助下，缓存容量需求得以降低，节省了
    79.5%～91.6%的片外访存。尽管因为 WD 计算模式的缘故，刷新能耗稍有上升，整体系统能耗仍然降低了 47.8%～67.0%。在其他网络层上，RANA
    (0) 根据系统能耗模型选择能耗最优的 OD 计算模式，所以它的能耗与 OD 计算模式一样。对于整个 VGG 而言，由于混合计算模式的引入，RANA (0)
    总共降低了 19.4%的系统能耗。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_129_0.png)


    总体来说，基于 eDRAM 的神经网络加速框架从三个层面——训练层次、调度层次、架构层次进行优化，从而来缓解片上缓存需求以及计算能耗问题，与同面积下采用 SRAM
    的神经网络加速器（S+ID）相比，如图 7.19 所示，RANA*（E-5）在执行实验选取的 4 种典型神经网络运算时，平均节省了 65.2%片外访存以及
    61.7%的系统能耗，使人工智能芯片的能量效率获得大幅提高。


