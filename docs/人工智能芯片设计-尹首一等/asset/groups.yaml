    # 第 3 章 智能计算的挑战


    # 3.1 基本网络层的数学模型


    根据第 2 章的介绍，目前的深度神经网络主要包括卷积神经网络、全连接神经网络和循环神经网络，以及由这三种网络混合级联而成的混合神经网络。按照层内结构的差异，神经网络基本层主要包含卷积层、池化层、全连接层和递归层。全连接网络由多个全连接层组成，循环神经网络由递归层构成，而卷积神经网络则涵盖了卷积层、池化层和全连接层这三种基本层。本节主要介绍四种神经网络基本层的数学模型，并分析其计算特点。


    卷积层的计算通常占到卷积神经网络计算总量的 90%以上[1]，是设计智能计算芯片需要重点考虑的部分。其计算模型如图 3.1 所示，它采用 M 个尺寸为 K×K×N
    的三维卷积核，从尺寸为 H×L×N 的三维特征图中提取特征，得到尺寸为 R×C×M 的输出特征图。具体的计算过程为：每个三维卷积核在输入特征图上以 S 为步长，按照先从左至右再从上至下的顺序滑动，分别与滤波器窗口内数据构成的三维输入数据子向量进行卷积运算，得到一张尺寸为
    R×C 的输出二维特征图，M 个卷积核计算完成以后得到 M 张尺寸为 R×C 的输出二维特征图，构成尺寸为 R×C×M 的输出三维特征图。该计算过程如图 3.2
    中的伪代码所示。其中，矩阵 I、O、W 分别表示输入特征图、输出特征图和卷积核权重。卷积层计算的基本操作是乘加，如图 3.2 中循环最内层的计算公式所示。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_26_0.png)'
  md: '

    络权值的修正，直到权重值调整到最佳，以使得整个网络的预测效果最好。后向计算过程就是网络的学习和训练过程，该过程主要基于 BP 算法进行。


    BP 算法是训练神经网络的一种重要方法。它首先通过前向计算将训练集数据输入神经网络的输入层，经过一个或者多个隐藏层，最后到达输出层并输出结果；随后基于链式求导法则，将输出结果与实际结果之间的误差从输出层向隐藏层反向传播，直至输入层。在反向传播的过程中，根据误差调整网络参数的值，通过不断迭代反向传播过程，直至神经网络的输出结果收敛。以图
    2.6 的多层神经网络为例，其中 \(a_1^{(2)}\) 表示第二层（隐藏层）第一个神经元的输出，\(a_2^{(2)}\) 表示第二层（隐藏层）第二个神经元的输出，\(a_3^{(2)}\)
    表示第二层（隐藏层）第三个神经元的输出。这三个神经元的输出分别表示为


    ```

    \(a_1^{(2)} = \varphi(w_{11}^{(1)}x_1 + w_{21}^{(1)}x_2 + w_{31}^{(1)}x_3 + b^{(1)})
    \quad (2-7)\)

    \(a_2^{(2)} = \varphi(w_{12}^{(1)}x_1 + w_{22}^{(1)}x_2 + w_{32}^{(1)}x_3 + b^{(1)})
    \quad (2-8)\)

    \(a_3^{(2)} = \varphi(w_{13}^{(1)}x_1 + w_{23}^{(1)}x_2 + w_{33}^{(1)}x_3 + b^{(1)})
    \quad (2-9)\)

    ```


    经过输出层，多层神经网络的输出 \(y_3\) 为


    ```

    \(y_3 = \varphi(w_{11}^{(2)}a_1^{(2)} + w_{21}^{(2)}a_2^{(2)} + w_{31}^{(2)}a_3^{(2)}
    + b^{(2)}) \quad (2-10)\)

    ```


    其中，\(w_{ij}^{(t)}\) 是相邻两层（t 与 t+1 层）神经元之间的权重值。神经网络的训练过程就是求解神经元之间的权重，使得误差函数最小的一个过程。误差函数是所有待求解权重的一个复合函数，一般采用梯度下降算法来求解误差函数的极值。梯度下降算法的基本步骤为：首先选取一个初始点，求解梯度向量；然后向梯度向量为负的方向，以合适的步长进行搜索，找到最佳的权重值；不断地迭代搜索过程，直到两次迭代之间的差值小于设定的阈值；最后输出迭代后的网络参数等结果。


    在神经网络中，假设我们要求的误差函数为：\(H(w_{11}, w_{12}, \cdots, w_{mn})\)，对误差函数求梯度，则可表示为


    ```

    \(\nabla H = \frac{\partial H}{\partial w_{11}}e_{11} + \frac{\partial H}{\partial
    w_{12}}e_{12} + \cdots + \frac{\partial H}{\partial w_{mn}}e_{mn} \quad (2-11)\)

    ```


    利用 BP 算法来求解这些复杂的偏导数，求出权重改变量然后更新权重，这样就达到了神经网络学习的目的。


    ### 2.3 深度神经网络


    深度神经网络一词里的“深度”主要是指神经网络的层数，它并没有固定的定义——在语音识别中 4 层网络就能够被认为是“较深的”，而在图像识别中 20 层以上的网络屡见不鲜。单从结构上来说，全连接的深度神经网络和图
    2.6 的多层感知器是没有任何区别的，更多的层数主要是为了让网络更容易刻画现实世界中的复杂情形。2006 年，Hinton 利用预训练方法缓解了局部最优解问题，将多层感知机的隐藏层推动到了
    7 层，神经网络才在真正意义上有了“深度”。


    深度神经网络已经广泛应用于图像分类、目标识别、语音识别、动作识别、场景理解等诸多领域，在有的领域还取得了超过人脑的准确率。深度神经网络按结构可以分为卷积神经网络、全连接神经网络
    (Fully Connected Neural Network, FCN) 和循环神经网络 (Recurrent Neural Network, RNN)。卷积神经网络由卷积层、池化层和全连接层组成，擅长视觉特征提取。FCN
    由多个全连接层组成，通常用于分类。RNN 是一种特殊的神经网络结构，它是根据“人的认知是基于过往的经验和记忆”提出的，也由全连接层组成，但层与层之间具有反馈路径和门控操作，在时序数据处理中表现良好。


    上述三种基本的深度神经网络可以独立使用，例如，独立的卷积神经网络可以用作图像分割的完全卷积网络[2]。同时，这些神经网络也可以组合起来构建更复杂的神经网络。如图
    2.7 所示，AlexNet[3]由 5 层 CNN 和 3 层 FCN 组合而成，可用于图像分类。长期递归卷积网络 (Long-term Recurrent
    Convolution Network, LRCN)[4]由一个 5 层 CNN、3 层 FCN 和 2 层 RNN 级联而成，可用于图像理解。CLDNN[5]由
    2 层 CNN、6 层 FCN 和 2 层 RNN 组成，以实现语音识别。本书将 CNN、FCN 和 RNN 的这些组合定义为混合深度神经网络，简称混合神经网络
    (Hybrid Neural Network, Hybrid-NN)。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_20_0.png)


    图 2.7 混合神经网络的三个例子


    AlexNet 用于图像分类，LRCN 用于图像理解，CLDNN 用于语音识别


    随着神经网络的发展，混合神经网络在认知任务上表现出很大的优势，并且变得越来越重要[6,7]。目前比较常用的混合神经网络结构包括 LeNet[8]、AlexNet、VGGNet[9]、GoogLeNet[10]、ResNet[11]等，它们分别针对不同的问题具有非常重要的意义，并在深度神经网络的发展历程中起到了重要的推动作用。下面选取几种典型的结构加以介绍。


    LeNet 诞生于 1994 年，由 Yann LeCun 提出，是最早应用于数字识别的卷积神经网络，并在美国银行中得到成功推广，对神经网络的实用化起到了重要的促进作用。其网络结构非常简单，如图
    2.8 所示，由 2 个卷积层和 2 个全连接层组成。LeNet 的主要贡献是提出了局部感受野的概念，即卷积神经网络中每一层输出特征图上的像素点在原始图像上映射的区域大小。基于这一概念，卷积神经网络每一层参与某个卷积核运算的只是特征图的一部分，不需要像之前的网络那样，每一层都必须对整个特征图进行计算，显著减少了每一层神经网络的计算量，提高了计算效率。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_21_0.png)


    图 2.8 LeNet 结构示意图


    AlexNet 是 2012 年由 Krizhevsky 等提出的一种卷积神经网络[3]，其网络结构如图 2.9 所示，由 5 个卷积层、3 个全连接层以及
    3 个池化层组成。它用小卷积叠加来替换单个的大卷积，并首次成功地将 ReLU 作为激活函数应用于深度神经网络，证明了 ReLU 的效果在较深的网络中强于 Sigmoid
    函数，解决了应用 Sigmoid 作为激活函数所遇到的梯度弥散问题。此外，其深度也比 LeNet 更深，具有更强的刻画能力。AlexNet 在近年来机器视觉领域最受关注、最具权威的学术竞赛之一——ILSVRC
    (ImageNet Large Scale Visual Recognition Challenge) 获得冠军。经过测试，AlexNet 的识别精度达到了
    84.6%，这给学术界带来了深刻的影响，更加点燃了人们对神经网络的研究热情。


    随着人工神经网络的进一步发展，神经网络的结构也在不断演进。在 AlexNet 之后，为了提升神经网络的识别精度，主要有四个改进和突破方向(图 2.10)：增加网络深度、减小网络中卷积核大小和增强卷积核功能、前两者结合并引入残差网络进行收敛加速、增加新的功能单元。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_22_0.png)


    ![](img/16a61618bbeb2ecae4884725c4086cbe_22_1.png)


    第一个突破方向是增加网络的深度。这主要以 2014 年提出的视觉几何组（Visual Geometry Group，VGG）网络为代表。它与 AlexNet
    的网络结构非常相似，主要区别在于神经网络层数。通过增加网络层数等改进，VGG 识别精度能达到 90%以上。图 2.11 显示了 VGG 网络的结构示意图，按结构层次，VGG
    网络主要分为三种：VGG-11 (11 层)、VGG-16 (16 层) 和 VGG-19 (19 层)。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_22_2.png)


    第二个突破方向是减小网络中卷积核大小和增强卷积核功能，其主要代表包括 NIN[13]、SqueezeNet[14]、MobileNet[15]、ShuffleNet[16]、GoogLeNet
    等。其中，GoogLeNet 为典型代表，它引入了 Inception 结构，这是一种网中网的结构，使得整个网络结构的宽度和深度都得到了扩大，神经网络的性能也得到了提升，识别精度可达到
    93.3%。图 2.12 显示了 GoogLeNet 中的 Inception 网络结构示意图。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_23_0.png)


    图 2.12 GoogLeNet 中的 Inception 网络结构示意图


    第三个方向是前两者结合并引入残差网络进行收敛加速，主要的代表是ResNet。该网络的创新主要在于引入了残差网络，使其可以在加深网络层数的同时避免梯度消失、梯度爆炸和退化问题。ResNet
    能将神经网络的层数加深到 150 层以上，目前最深的已经超过了 1000 层，识别精度更是超越了人眼。图 2.13 显示了 ResNet 的结构示意图。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_23_1.png)


    图 2.13 ResNet 的结构示意图


    第四个方向是将卷积神经网络的任务发展为监测任务或者增加新的功能单元，如 R-CNN[17]、FCN[18]、LRCN[19]等。通过对卷积神经网络的功能进行扩展而扩大神经网络的应用领域。图
