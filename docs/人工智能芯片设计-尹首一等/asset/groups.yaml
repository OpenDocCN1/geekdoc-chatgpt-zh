    ### 2.2 神经网络


    从广义上来讲，神经网络主要分为人工神经网络 (Artificial Neural Network, ANN) 和脉冲神经网络 (Spiking Neuron
    Network, SNN)。其中，ANN 是指受大脑神经元结构及神经传导原理启发建立的数学计算模型，基于这类模型实现智能计算的方式称为脑启发计算。前面介绍的感知器模型和以
    BP 算法训练网络为基本特征，网络结构形式多样的神经网络计算模型，例如，BP 神经网络、卷积神经网络 (Convolutional Neural Network,
    CNN)、循环神经网络等都属于 ANN。脉冲神经网络的核心是使用更接近于生物神经工作机制的脉冲神经元模型，并且在计算过程中，信息都采用脉冲编码，其硬件实现的芯片在体系结构上也有别于擅长精确数值计算的
    CPU/GPU。基于这类计算模型实现智能计算的方式称为神经拟态计算。到目前为止，SNN 还属于学术研究范畴，充满前景，但还不是主流。ANN 是目前机器学习特别是深度学习使用的主要模型，它推动人工神经网络理论与算法取得突破，并在业界获得成功应用，是本书后面讨论的主要内容。


    #### 2.2.1 人工神经元


    生物神经网络由数以千万计的互连细胞——生物神经元组成，而对于人类，这个数字则达到了 860 亿。生物神经元的基本结构如图 2.2 所示，由一个细胞体、多条树突、一条轴突和突触四部分组成。细胞体是数据处理中心，处理完的数据以电脉冲的形式表示，树突用来接收来自其他神经元的电脉冲信号，轴突用来向其他神经元输出电脉冲信号。如图
    2.3 所示，两个细胞体之间的轴突-树突接触间隙称为突触，该间隙充满了导电流体，允许电信号流动，突触的电导率受大脑激素控制。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_14_0.png)


    图 2.2 生物神经元的基本结构


    ![](img/16a61618bbeb2ecae4884725c4086cbe_14_1.png)


    图 2.3 突触


    1943 年，心理学家 McCulloch 和数理逻辑学家 Pitts 受生物神经元模型启发，提出了神经元的第一个数学模型——MP 模型[1]，试图从结构、实现机理和功能上模拟生物神经网络的行为。MP
    模型具有开创意义，为后来的研究工作提供了依据。1958 年，心理学家 Frank Rosenblatt 在 MP 模型的基础之上增加学习功能，提出了现代人工神经元模型，也称为感知器模型，如图
    2.4 所示。该模型包含细胞体(图中的求和节点)、输入、输出、权重和激活函数五个部分，前四个部分分别对应生物神经元的四个组件。其输入是具有 \( m \)
    个分量的实值向量 \( (x_1,x_2,\cdots,x_m) \)，相当于 \( m \) 条树突；受大脑突触的启发，每个输入分量 \( x_i \)
    都对应一个权重 \( w_{ki} \)，这意味着发送到每个连接的输入值都要乘以它关联的权重因子，从而控制输入对本单元的影响。如果某个连接重要，那么它将具有比那些不重要的连接更大的权重值。神经元的处理过程为：细胞体首先基于式
    (2-1) 所示的线性模型处理输入得到输出 \( v_k \)，以实现权重对输入影响力的控制。然后，基于式 (2-2) 将 \( v_k \) 作为非线性函数——激活函数
    \( \varphi \) 的输入，计算神经元的输出 \( y_k \)。


    \( v_k = \sum_{i=1}^{m} x_i w_{ki} + b_k \) (2-1)


    \( y_k = \varphi(v_k) \) (2-2)


    ![](img/16a61618bbeb2ecae4884725c4086cbe_15_0.png)


    图 2.4 感知器模型


    虽然人类还不能完全理解大脑的工作原理，但是基于神经元的计算模型构建技术已经有很长的研究历史，并获得了大量的研究成果，大致分为两类：第一类是尽可能地用电路结构模拟还原大脑神经系统的结构和思考过程，实现智能计算，称为神经拟态计算，IBM
    等公司推出的“类脑”芯片就属于此类；第二类是受大脑神经元结构及神经传导原理启发建立数学计算模型，实现智能计算，这种方式称为脑启发计算。这两类建模方法都是目前非常重要的研究热点。本书后面介绍的智能计算芯片设计技术都属于脑启发计算芯片范畴，这类芯片的设计以模拟大脑的神经元结构为基本技术路线，而非模拟大脑的思考形式，是目前研究应用最广的方向。


    #### 2.2.2 激活函数


    激活函数是人工神经元细胞体中对所有输入信号进行加权和之后的非线性映射。在多层神经元构成的神经网络中，激活函数可以理解为上一层神经元的输出与下一层神经元的输入之间的函数关系。如果不用激活函数，神经元的输出就只是其输入的线性变换，那么无论经过多少层神经元，最终的输出都是输入的线性组合，与没有中间层的效果相当。最原始的感知机就是由没有激活函数的神经元连接而成的，只能处理线性问题。正是感知机的这一缺陷导致了第一次人工神经网络研究的衰退。因此，激活函数是神经元中非常重要的组成部分，它极大地增强了网络的学习能力和表达能力。


    - 激活函数一般需要满足以下几个条件：(1)连续并可导（允许在有限点上不可导）的非线性函数；(2)激活函数及其导数要尽可能地简单，以提高网络的计算效率；(3)激活函数及其导数的值域要在一个合适的区间内，范围不能太大，否则影响训练的效率和稳定性。


    图 2.5 给出了如下几种常用激活函数的曲线图。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_16_0.png)


    ![](img/16a61618bbeb2ecae4884725c4086cbe_16_1.png)


    ![](img/16a61618bbeb2ecae4884725c4086cbe_16_2.png)


    ![](img/16a61618bbeb2ecae4884725c4086cbe_16_3.png)


    图 2.5 常见的激活函数曲线图


    ##### 1) Sigmoid 函数


    Sigmoid 函数也称 Logistic 函数，其函数定义为


    f(x) = \frac{1}{1 + e^{-x}} (2-3)


    它近似为线性函数，值域为[0,1]，当输入值靠近两端时，对输入进行抑制，趋向饱和。Sigmoid 函数主要有三个缺点：一是其输出恒为正值，不是以零点对称的，导致权值只能朝一个方向更新，使得收敛缓慢；二是需要进行指数计算，比较耗费计算资源；三是其饱和特性导致梯度消失，会使得网络变得很难学习。


    ##### 2) tanh 函数


    tanh 函数是 Sigmoid 函数的改进版，和 Sigmoid 函数有异曲同工之妙，都是研究早期被广泛使用的 2 种激活函数。


    f(x) = tanh(x) (2-4)


    它由双曲正弦 sinh 和双曲余弦 cosh 相除得到，其值域为[-1,1]，克服了 Sigmoid 函数非 0 均值的缺点，不容易出现 loss 值晃动，收敛速度快。但是它和
    Sigmoid 函数一样，都是饱和型函数，会导致梯度消失的问题。而且，2 个函数的计算量都是指数级的，计算相对复杂。


    ##### 3) tanh 线性逼近函数


    tanh 线性逼近函数是 Sigmoid 函数的简化，主要目的是将 Sigmoid 的非线性区域线性化，常用于硬件电路的设计实现中，它的表达式为


    f(x) = \begin{cases} -1, & x < -1 \\ x, & -1 \le x \le 1 \\ 1, & x > 1 \end{cases}
    (2-5)


    ##### 4) ReLU 函数


    ReLU 是修正线性单元（Rectified Linear Unit）的缩写，是 Krizhevsky、Hinton 等在 2012 年的论文 ImageNet
    classification with deep convolutional neural networks 中提出的一种线性且不饱和的激活函数，其特点是更为接近生物神经的开关阈值状态，表达式为


    f(x) = max(0, x) (2-6)


    ReLU 函数只有线性关系，不需要指数计算，无论前向传播还是反向传播，计算速度都比 Sigmoid 函数和 tanh 函数快。而且它具有很好的稀疏性，显著减少了计算量。此外，当
    x > 0 时，其导数为 1，在一定程度上缓解了神经网络的梯度消失问题，有利于加速梯度下降的收敛速度。其缺点是：其导数在零点左侧为 0，训练时容易使得神经元死亡。


    激活函数的选择很多，上面只介绍了其中几种比较典型的函数。Sigmoid 函数虽然各点可导并且导数容易求解，但是存在梯度饱和的问题，后来的 ReLU 函数解决了梯度饱和的问题，但是出现了神经元坏死和非对称的问题，随后演化出的各种
    ReLU 函数的变形都是着眼于解决这个问题而提出的，虽然 ReLU 函数存在着一些问题，但是其导数非常简单而且只需要一个比较器就可以实现，因此已成为目前最常用的激活函数。


    #### 2.2.3 人工神经网络


    人工神经网络(简称神经网络)，是一种模仿动物神经网络行为特征，进行分布式并行信息处理的算法数学模型，它以人工神经元(感知器)为节点，按不同的连接方式构成神经网络。如图
    2.6 所示，多个感知器并列连接构成一个神经网络层，多个神经网络层按顺序排布组成最简单的神经网络——多层感知器(Multi-Layer Perceptron,
