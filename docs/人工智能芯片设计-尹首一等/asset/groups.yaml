    | 对卷积层加速后 | 48.7% | 0% | 0% | 51.2% |


    在一次正向推断过程中，全连接层的权重值只会被使用一次，因此其数据可重用性非常低。为了解决这个问题，Caffeine 引入了批量计算，即一次处理多个输入特征图，这样同一个权重数据可以与多个输入进行乘法运算，其数据可重用'
