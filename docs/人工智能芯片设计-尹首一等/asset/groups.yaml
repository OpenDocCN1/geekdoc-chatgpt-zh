    7.20 所示，随着数据维持时间的增加，刷新能耗会显著地降低。选取 eD+ID、eD+OD 和 RANA (0) 三种模型，并将数据维持时间的跨度设置为 $45
    \sim 1440\mu s$。可发现 eD+OD 组合始终比 eD+ID 的组合消耗更少的刷新能耗，并且随着数据维持时间的增加，效果会更显著。例如，当时间从
    $90\mu s$ 增加到 $180\mu s$ 时，刷新间隔也随之翻倍，eD+ID 的刷新能耗降低了 50%，而 eD+OD 的刷新能耗降低了 80.1%。'
