    目前，已经有一些专门为有效支持非结构化修剪后的 DNN 模型而设计的专用硬件架构，它们能够在不解压权重或激活的情况下执行计算。例如，专门处理全连接层稀疏矩阵向量乘法的架构——高效推理引擎（Efficient
    Inference Engine, EIE）[23]，它以 CSC 格式存储权重以及每个列的起始位置，并设计了专门的附加逻辑来跟踪需要更新的输出的位置。SCNN[24]则是一种专门处理卷积层稀疏矩阵向量乘法的专用架构。它采用基于输入数据复用模式的数据流完成运算，只需要将压缩后的权重和激活值传递给乘法器阵列，然后基于一个专门的处理逻辑来完成分散的部分和数据的加法。


    # 8.2.3 压缩网络架构


    大卷积核带来更大的感受野，但其参数量也更大。为了平衡深度神经网络模型加深的趋势所带来的越来越高的计算代价，通常用一组堆叠以后能够覆盖相同感受野范围的小卷积核来代替大卷积核，从而在保持感受野范围的同时减少参数量，降低计算量。例如，一个
    5×5 卷积可以替换为两个 3×3 卷积，一个 N×N 卷积可以分解为两个一维卷积，即一个 1×N 和一个 N×1 卷积[25]。这种方法可以在进行网络训练前直接应用于网络架构的设计，也可以在训练完成后通过分解网络训练时使用的卷积核来实现。后者避免了从零开始训练网络的麻烦，而前者则更加灵活。例如，对训练后的网络进行卷积核分解的现有方法都要求分解后的卷积核之间不存在非线性关系。


    训练前，用一组小卷积核模拟大卷积核的前提是，这个大的二维卷积核必须是可分离的[26]，这是图像处理中的一个常用约束。同样地，也可以像 Xception[27]
    和 MobileNets[28]那样，将三维卷积运算分解为仅针对输入特征图中一个输入通道展开的一组二维卷积运算和一个 1×1 的三维卷积运算。此外，还可以用
    1×1×N 卷积核来给定层的输出特征映射中的通道数量，以减少下一层中卷积核的计算代价[29,30]。例如，1×1×64 的 32 个卷积核可以将具有 64
    个通道的输入转换为 32 个通道的输出，并将下一层中的卷积核通道数量减少到 32 个。也就是说，这种方法有效的前提是，这种模型中卷积所采用的 1×1×N 卷积核的数量必须小于
    1×1×N 卷积核中的通道数量 N。SqueezeNet 的设计就采用了这种方法[31]。它首先使用 1×1×N 卷积核来“挤压”网络，然后用多个 1×1
    和 3×3 卷积核对“挤压”后的网络进行扩展。与 AlexNet 相比，SqueezeNet 通过这种方法减少了 98%的权重数量，同时还保持了相同的精度。然而正如
    8.2.2 节所分析的那样，权重的数量减少并不一定会减少能耗，SqueezeNet 的能耗就高于 AlexNet。


    对于训练好的网络，则可以采用张量分解的方法在不影响精度的前提下分解卷积核。张量分解将层中的权重视为 4D 张量，并将其分解为较小张量的组合。'
  - '[PAGE 141]


    然后应用低积近似来进一步提高压缩率，代价是精度会有所降低，但这种精度的损失可以通过精调权重来恢复。张量分解的求解方法很多，如贪婪算法[32]或非线性最小二乘法[33]。通过将
    CP 分解与低积近似相结合的方法[32]在 CPU 上可实现4.5 倍的加速[33]。然而当表示权重的张量维大于 2 时，CP 分解不能保持数值稳定性[33]，Tucker
    分解可用于缓解这个问题[34]。


    # 8.3 二值神经网络


    最新的研究结果表明，神经网络的数据位宽甚至可以降低到 1bit。与此相关的研究被称为二值神经网络。BinaryConnect[35]引入了二值权值的概念，即其中使用二值权值将
    MAC 中的乘法运算简化为加法和减法运算。这后来在使用二值权值和激活的二值神经网络[36]中得到了扩展，可用于将智能计算中的 MAC 运算简化为 XNOR
    运算。


    # 8.3.1 二值神经网络背景


    最早，Bengio 等提出二元连接的概念[36]，并使用±1 的权重，将乘法运算用加法运算代替；而其改进版本二值神经网络（Binarized Neural
    Network，BNN），则同时使用二值的权重和二值激活函数，将乘累加运算简化成同或运算[37]。当然，这种方法会带来一定的网络精度损失，故研究者想了很多办法来减少性能损失，包括二值权重网络（Binary
    Weight Net，BWN）、同或网络（XNOR-Net）[37]和低精度量化神经网络（Quantized Neural Network）[38]，并取得了一定的效果。近期又出现了三值权重网络（Ternary
    Weight Net，TWN）[39]，它给二值权重增加了一个“0”，即“-1，0，1”的表示方法。经过精细调参训练后，三值权重的 AlexNet 与 32bit
    浮点 AlexNet 相比，精度损失只有 0.6%[40]。


    # 8.3.2 面向二值/三值神经网络的计算架构优化


    YodaNN[41]是第一个二值权重 CNN 加速器，其主要关注电路级优化。得益于二值权重 CNN 加速器的无乘法器设计，YodaNN 实现了很高的能效。但即使将网络权重限制到二值或三值，大规模的
    CNN 计算仍需要上亿次操作。而相比于实数，两个随机选择的二值数很可能是相同的，这个特性可以被用来减少计算操作数。相关研究展示了二值卷积计算存在的大量冗余性，这给硬件架构设计带来了启发，通过软件优化方法可以去除冗余计算，提高硬件能效。


    Kim 基于 BWN 的冗余特性提出了卷积核分解方法[42]，如图 8.6 所示。'
