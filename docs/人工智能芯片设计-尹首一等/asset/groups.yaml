    方法，在以 AlexNet 为基准测试集的计算中获得了 45% 的 PE 功耗节省[12]。而在一组用于图像分类的 DNN 上的实验结果表明，CNV[13]仅通过跳过
    0 值操作数乘法这一项技术，就获得了最高 55%、最低 24%、平均 37%的性能加速，同时运算精度还没有任何损失。Shi 等[11]基于这种方法，在表 8.1
