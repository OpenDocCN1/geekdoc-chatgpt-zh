    \ 19.63%。平均而言，PE 和内存带宽利用率分别只有 75.68% 和 76.96%。\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_56_0.png)\n\
    \n图 4.15 LRCN 每层的 PE 和带宽利用率评估\n\n这意味着我们可以将不同网络层对计算和存储访问的互补需求相结合，最大限度地利用资源。因此，Thinker\
    \ 提出了一种适用于混合神经网络的多层并行计算数据流，其中大部分 PE 分配给计算密集型的卷积层，大部分带宽分配给存储密集的全连接层/循环层。Thinker\
    \ 的 Multi-Bank 片上缓存、分布式 I/O 端口以及不同操作的独立计算流使得 PE 阵列可以灵活地划分为四个子阵列，分别处理 CONV、FC、Pooling\
    \ 和 RNN 门控操作。图 4.16 (a) 显示了计算 LRCN 网络时的阵列划分和多层并行计算数据流。CONV 阵列分配了 15×13 的通用 PE；FC\
    \ 阵列分配了 15×3 的通用 PE。Pooling 和 RNN 门控分别分配了 9 个和 7 个超级 PE。每个片上缓存被划分为 33-Bank CONV\
    \ 缓存和 15-Bank FC 缓存，并且批次大小被设置为 15。RNN 中的全连接操作与全连接层共享相同的 FC 阵列，并且其余的 RNN 门控操作在超级\
    \ PE 上执行。在 CONV 阵列中，不同的输出通道被映射到不同的列上，可获得 13 次输入数据重用和 15 次权重重用。在 FC 阵列中，多个前向计算过程被并行执行，输入数据和权重的重用次数分别为\
    \ 3 和 15。如图 4.16 (b) 所示，在多层并行计算数据流中，一个批次中的 CONV 和 FC 层的执行被安排在两个连续的流水线阶段中。在 FC\
    \ 层开始之前，其输入数据已经在之前的流水线阶段准备好了。一个批次中的所有前向计算过程的卷积层在一个流水线阶段中按顺序调度，而一个批次中的所有前向计算过程的全连接层/循环层在\
    \ FC 阵列的不同行中并行执行，从而实现权重的重用。多层并行计算数据流，能够将 PE 整体利用率提高 10.3%，带宽利用率提高 21.02%。\n\n\
    ![](img/16a61618bbeb2ecae4884725c4086cbe_57_0.png)\n\n图 4.16 LRCN 的阵列划分和多层并行计算数据流，以及批级别流水线（见彩图）\n\
    \nCONV/FC 阵列的大小以及 CONV/FC 缓存中的 Bank 数量等最佳划分参数，会随着不同的混合神经网络拓扑结构而变化。在一些极端情况下，卷积层的计算和存储访问在整个混合神经网络中占绝对主体，并且该层计算数据流的结果甚至可能优于多层并行计算数据流。因此，4.3.4\
    \ 节将提出按需动态阵列划分算法。\n\n### 4.3.3 基于融合数据模式的存储划分\n\n在多层并行计算数据流中，PE 阵列被划分成若干独立的子阵列，包括\
    \ CONV 阵列 (CONV Array) 和 FC 阵列 (FC Array)，用于同时执行卷积层和全连接层/循环层。CONV 阵列和 FC 阵列的输入特征点需要从\
    \ Multi-Bank 片上缓存中并行加载。由于卷积层和全连接层/循环层具有完全不同的数据访问模式，为了确保并行数据\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_58_0.png)\n\
    ![](img/16a61618bbeb2ecae4884725c4086cbe_58_1.png)\n![](img/16a61618bbeb2ecae4884725c4086cbe_58_2.png)\n\
    ![](img/16a61618bbeb2ecae4884725c4086cbe_58_3.png)\n![](img/16a61618bbeb2ecae4884725c4086cbe_58_4.png)\n\
    ![](img/16a61618bbeb2ecae4884725c4086cbe_58_5.png)\n![](img/16a61618bbeb2ecae4884725c4086cbe_58_6.png)\n\
    \n图 4.17 基于融合数据模式的存储划分 (见彩图)\n\n$A_h^c$ 和 $A_h^f$ 分别表示子阵列中 PE 的行数。表 4.2 给出了其余符号的说明。在\
    \ FC 阵列中，有 $A_h^f$ 行 PE 在并发执行，每行计算不同前向计算过程的输出特征图。由于任意相邻 PE 行之间不存在数据重用，总共需要并行加载\
    \ $A_h^f$ 个输入点到子阵列。因此，$A_h^f$ 个 Bank 被分配给 FC 缓存，剩余的 $B_{total} - A_h^f$ 个 Bank\
    \ 将被用于 CONV 子阵列。\n\n表 4.2 符号说明\n\n| 输入：混合神经网络参数 | DL,WL | 激活和权重的位宽 |\n| :--- |\
    \ :--- | :--- |\n| | \\(\\theta \\in \\{1,2\\}\\) | 一个 PE 中同时执行的 MAC 数量 |\n| |\
    \ \\(FC_{in}, FC_{out}\\) | FCNet/RNN 中输入/输出点数量 |\n| | \\(Ch_{in}, Ch_{out}\\\
    ) | ConvNet 中输入/输出通道数量 |\n| | \\(R, C; H, W; K; S\\) | 输入特征图的高度和宽度；输出特征图的高度和宽度；卷积核尺寸；卷积核步长\
    \ |\n| 输入：芯片参数 | \\(f; BW_{(a,c,f)}\\) | 频率；数据带宽，ConvNet 和 FCNet 的有效平均带宽 |\n|\
    \ | \\(B_{(total,ur)}\\) | 总 Bank 数量；ConvNet 需要的最小 Bank 数量 |\n| 输出：性能结果 | \\(CC_{(conv,ConvNet)}\\\
    ) | 一个卷积层和整个 ConvNet 的计算周期数 |\n| | \\(CC_{(fc,FCNet/RNN)}\\) | 一个全连接层和整个 FCNet/RNN\
    \ 的计算周期数 |\n| | \\(CC_{(trans)}\\) | 一层的数据传输周期数 |\n| | \\(CC_{(AP,TM)}\\) | 逐层计算和多层并行计算的总计算周期数\
    \ |\n| 输出：划分参数 | \\(A_h, A_w, A_h^c, A_h^f, A_w^c, A_w^f\\) | 阵列的总行数和总列数；ConvNet\
    \ 和 FCNet 分配的行数；ConvNet 和 FCNet 分配的列数 |\n| | BS | 一个批中前向计算过程的数量 |\n\n在 CONV 子阵列中，每个\
    \ PE 负责一个输出特征点的计算。对于尺寸为 \\(K\\) 的卷积核，由于采用输出固定数据流，PE 阵列每行需要一组 \\(K \\times K\\\
    ) 输入特征点来计算一个输出特征点。当不同的 PE 行同时执行时，相邻行的输入点会发生交叠。考虑数据重用后，我们使用一个联合集来表示 \\(A_h^c\\\
    ) 行 PE 所需的所有输入特征点。该集合包含的特征点区域的高度和宽度分别是 \\(H_u = K + (A_h^c - 1) \\times S\\) 和\
    \ \\(W_u = K\\)。图 4.17 (b) ~ (d) 给出了一个具体例子，在这个例子中一个 \\(3 \\times 3\\) (\\(K=3\\\
    )) 的卷积在 16 行 CONV 阵列中以步长 \\(S\\) 为 1 执行。在图 4.17 (c) 中，\\(H_u = 3 + (16-1) \\times\
    \ 1 = 18, W_u = 3\\)，因此 16 行 PE 共需要 \\(18 \\times 3\\) 个输入特征点。随着卷积核在输入特征图上水平滑动，相应的联合集会发生重叠，如图\
    \ 4.17 (d) 所示。考虑数据重用后，\\(H_u \\times (K - S)\\) 个输入点将被重用并保留到下一轮计算。因此，每轮只需要加载 \\\
    (H_u \\times S\\) 个输入点，这也被称为融合数据模式 \\(\\vec{P}\\)。在图 4.17 (d) 中，一个融合数据模式包含了 \\\
    (18 \\times 1\\) 个输入数据点。在这个例子中，2/3 的冗余存储访问将被消除。为了避免 PE 阵列在运行时发生停顿，一个融合数据模式中的所有输入数据点必须在\
    \ PE 阵列消耗完 \\(H_u \\times (K - S)\\) 个被重用的数据点的时间内完成加载。在输出固定数据流的情况下，PE 阵列消耗输入特征图中的一列数据点需要\
    \ \\( K \\) 个时钟周期。因此，融合数据模式中的所有数据点都应在 \\( K \\times (K - S) \\) 个时钟周期内完成加载。给定融合数据模式中的数据量和加载数据所需的时钟周期数，每个时钟周期需要加载的最小数据量为\n\
    \n\\( B_m = \\frac{[K + (A_h^c - 1) \\times S] \\times S}{K \\times (K - S)} \\\
    quad \\text{(4-1)} \\)\n\n这也是 CONV 缓存所需的最小 Bank 数。如果存在多余的 Bank，剩余的 \\( B_{total}\
    \ - A_h^f \\) 个 Bank 将进一步合并为 \\( B_m \\) 个虚拟 Bank。\n\n在 CONV 层中，每个输入特征点可以表示为 \\\
    ( \\bar{p} = I[r][c][\\text{ch}_{\\text{in}}]\\)，其中 \\( 0 \\leqslant r \\leqslant\
    \ R-1\\)， \\( 0 \\leqslant c \\leqslant C-1\\) 且 \\( 0 \\leqslant \\text{ch}_{\\\
    text{in}} \\leqslant \\text{Ch}_{\\text{in}}\\)。为了实现融合数据模式 \\( \\bar{P} \\) 的并行访问，\\\
    ( \\bar{P} \\) 中的每个数据点需要映射到一个单独的 Bank。输入特征点 \\( \\bar{p} \\) 应映射的虚拟 Bank 号为 \\\
    ( B(\\bar{p}) = r \\mod B_m \\)。每个卷积层的输出特征图根据相同的规则被写回 Multi-Bank 片上缓存，并用作下一层的输入特征图。\n\
    \n为了支持数据重用，我们使用寄存器来存储 \\( H_h \\times K \\) 个输入点。缓存控制器将寄存器中的输入特征点分发给 CONV 阵列。\\\
    ( K \\times K \\) 卷积核中的每个输入特征点被顺序输入相应 PE 阵列的行中。如图 4.17(e) 所示，例子中最小 Bank 数为 \\\
    ( B_m = \\lceil 18 \\times 1 / (3 \\times 2) \\rceil = 3 \\)。我们需要在 6 个时钟周期内从 3-Bank\
    \ CONV 缓存中取出 18\\(\\times\\)1 个输入数据。然后将当前输入数据存储在寄存器中，与先前加载的 18\\(\\times\\)2 个输入数据组成完整的\
    \ 18\\(\\times\\)3 个输入数据。由于 16 行 PE 需要并行执行，考虑数据重用后，18\\(\\times\\)3 个数据点将作为 16\\\
    (\\times\\)3\\(\\times\\)3 输入特征点。每个 3\\(\\times\\)3 输入特征点将通过左侧 I/O 端口顺序地送入一行 PE\
    \ 中。\n\n### 4.3.4 按需动态阵列划分\n\n多层并行计算数据流的性能取决于 PE 阵列的划分结果。给定一个特定的神经网络，通过算法 4.1\
    \ 以找到 PE 阵列和 Bank 的一组最佳分割参数，从而获得最高的 PE 利用率和最佳性能。\n\n```\n算法 4.1\n// In_c, Out_c,\
    \ Weight_c, Weight_c 表示每层 DRAM 的访问\nInitiate: CC_AP = \\infty\n1: for BS=1; BS\
    \ \\leqslant A_h -1; BS++ do\n2:   for A_w^c=1; A_w^c \\leqslant A_w -1; A_w^c++\
    \ do\n3:     for A_h^c = 1; A_h^c \\leqslant A_h -1; A_h^c++ do\n       Initiate:\
    \ CC_conv, CC_fc, CC_trans, CC_ConvNet, CC_FCNet/RNN, CC_temp, B_m ;\n       for\
    \ j=1; j \\leqslant CONV_layer_num; j++ do\n4:    B_m[j] = [K_i + (A_h^c - 1)\
    \ \\times S_j \\times S_j] / [K_j \\times (K_j - S_j)]\n5:    B_m = max_j {B_m[j]}\n\
    6:    if B_m + BS > B_total then\n7:        continue\n        for j=1; j <= CONV_layer_num;\
    \ j++ do\n8:        CC_conv[j] = [[H_i \\times W_i] / A_h^c] \\times [[CH_out,j\
    \ / \\Theta \\times A_h^c] \\times K_j^2 \\times CH_in,j \\times BS\n9:      \
    \  CC_trans[j] = max [ (In_j + Out_j) / BW_h/f , Weight_j / BW_h/f ]\n10:   CC_ConvNet\
    \ = sum_j max(CC_trans, CC_conv)\n        for j=1; j <= FC_layer_num; j++ do\n\
    11:   CC_fc[j] = [[BS / A_h - 1] \\times [FC_out,j / \\Theta \\times (A_h - A_h^c)]\
    \ \\times FC_in,j\n12:   CC_trans[j] = Weight_j / BW_h/f\n13:   CC_FCNet/RNN =\
    \ sum_j max(CC_trans, CC_fc)\n14:   CC_temp = max(CC_ConvNet, CC_FCNet/RNN)\n\
    15:   if CC_AP > CC_temp then\n16:       update CC_AP\n```\n\n多层并行计算数据流的本质是构建一个前向计算过程的流水线。如图\
    \ 4.16(b) 所示，多层并行计算数据流通过重叠当前批的卷积层与前一批的全连接层/循环层，在两个连续的流水线阶段安排一个批次的神经网络。因此，分别计算卷积层和全连接层/循环层的计算周期数，并选择较慢的作为流水线的启动间隔（Initiation\
    \ Interval, II）。目标是尽量减少 II。\n\n在算法 4.1 中，首先检查当前迭代的变量 (BS, A_h^c) 是否能够满足存储划分技术的要求。如果不满足，我们将尝试下一组变量（第\
    \ 6~7 行）。然后，计算卷积层的总计算周期数（第 8~10 行）。在多层并行计算数据流中，(H \\times W / A_h^c) 表示每个输出特征图上的\
    \ H \\times W 个点被分块并分配在 A_h^c 行 PE 上。由于每个 PE 可以同时处理 Theta 个 MAC 操作，Theta \\times\
    \ A_h^c 个输出通道将被并行处理。K^2 \\times CH_in 是计算一个输出特征点所消耗的周期数。将数据传输量除以每个时钟周期传输的数据 BW/f，得到数据传输时间，这将成为存储密集型层的瓶颈。ConvNet\
    \ 执行周期的最终数量是每个卷积层中 CC_conv 和 CC_trans 中较大者的总和（第 10 行）。\n\n接下来，以类似的方式计算全连接层/循环层的执行周期数（第\
    \ 11~13 行）。一个批次中的每个前向计算过程在一个特定 PE 行上执行，并且输出特征点分布在 A_h - A_h^c 列上。FC_i 等于计算一个输出特征点的周期数。全连接层/循环层的\
    \ CC_trans\n"
