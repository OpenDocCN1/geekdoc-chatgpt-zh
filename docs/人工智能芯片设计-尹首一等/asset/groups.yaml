    \ - SDM划分模型\n  - ConvNet分块与调度模型\n  - FCNet/RNN分块与调度模型\n\n## 7.2 高密度片上存储技术\n\n\
    传统的人工智能芯片，通常使用 SRAM 作为片上存储器。然而有限的芯片面积，限制了它们的片上存储容量。例如，当前几款流行的人工智能芯片 DianNao、Eyeriss、Envision\
    \ [24]、Thinker [25]，如果都按照 65nm 工艺进行估算，芯片面积为 3～20mm²，片上存储容量都不超过 500KB。因此，这些人工智能芯片在运行常见的神经网络时，难以避免地会产生频繁的\
    \ DRAM 访问，这会造成较大的系统能耗开销。因此，片上存储问题是人工智能芯片设计中必须解决的一个重要问题。\n\n如图 7.10 所示，每个 eDRAM\
    \ 存储单元由一个晶体管（Access Transistor）和一个电容（Storage Capacitor）构成。数据的逻辑值以电荷的形式存储在电容中。eDRAM\
    \ 相比于传统 SRAM 具有更高的存储密度。如表 7.2 所示，在 65nm 工艺节点下，32KB 的 eDRAM 面积开销仅为同等容量 SRAM 的 26%\
    \ [26]。它可以替代传统 SRAM 作为片上存储以减少片外访问，并且已经被应用于一些人工智能芯片[27-30]中，例如，寒武纪的 DaDianNao[27]，片上集成的\
    \ eDRAM 总存储容量达到 36MB，远超出能够集成的 SRAM 存储容量。\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_119_0.png)\n\
    \n图 7.10 eDRAM 结构\n\n然而，eDRAM 存储单元中的晶体管漏电电流 I_off 会导致电容电荷随时间逐渐丢失，所以 eDRAM 需要周期性的刷新操作来维持数据正确性。通常，为了保证程序执行过程中所有存储单元的数据都不会出错，刷新间隔取\
    \ eDRAM 数据维持能力最弱的单元所对应的数据维持时间。例如，IBM 65nm 工艺节点的 eDRAM 的数据维持时间为 45μs[31]。\n\n表\
    \ 7.2 SRAM 和 eDRAM 的特性比较 (32KB, 65nm 工艺节点)\n\n| 参数 | SRAM | eDRAM |\n| :--- |\
    \ :--- | :--- |\n| 数据存储类型 | 锁存器 | 电容 |\n| 面积 | 0.181mm² | 0.047mm² |\n| 存取延迟 |\
    \ 1.730ns | 1.541ns |\n| 存取能耗 | 1.139pJ/bit | 0.662pJ/bit |\n| 刷新能耗 | — | 0.788\
    \ µ J/存储分区 (bank) |\n| 维持时间 | — | < 100µs |\n| 特点 | (+) 速度快 (-) 面积大 | (+) 面积小\
    \ (-) 需要刷新 |\n\n已有研究表明，刷新能耗是 eDRAM 总能耗的主要来源[32]，而且会占据整体系统能耗的较大比重[33]。因此，使用 eDRAM\
    \ 带来的额外刷新能耗开销不容忽视。在基于 eDRAM 片上存储的智能计算平台上测试 ResNet，同样发现刷新能耗占据系统总能耗的很大比重。尽管高密度的\
    \ eDRAM 片上存储可以显著减少片外存储访问，但是所节省的能耗却可能被刷新能耗抵消。\n\n如果数据在 eDRAM 中的生存时间小于 eDRAM 的数据维持时间，那么系统就不再需要对于此数据进行刷新操作。由此可以得到两个优化方向：减少数据生存时间和增大数据维持时间。由此，我们提出一种基于\
    \ eDRAM 高密度片上存储器的新型加速框架——数据生存时间感知的神经网络加速框架 (Retention-Aware Neural Acceleration，RANA)[34]，以优化整体系统能耗。图\
    \ 7.11 所示为 RANA 的工作流程。RANA 框架以人工智能芯片和目标神经网络的具体参数为输入，分别从训练、调度和架构三个层次着手共同降低 eDRAM\
    \ 刷新能耗，优化系统能耗。\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_120_0.png)\n\n图 7.11\
    \ RANA 的工作流程[34]\n\n(1) 训练层次：提出一种数据生存时间感知的训练方法，重新训练网络，提高网络对数据错误 (Retention Failure)\
    \ 的容错能力。该方法在网络训练的过程中，以一定的概率向输入和权重数据中注入数据错误。在给定的精度约束下，该训练方法将得到最大可容忍的错误率，然后根据 eDRAM\
    \ 的维持时间特性曲线，得到对应的最大可容忍的维持时间，这通常会比 eDRAM 标称的数据维持时间要长。\n\n(2) 调度层次：提出一种神经网络分层的混合计算模式，根据芯片参数及\
    \ DNN 网络参数，对网络每一层的计算分别调度，并分配最优的计算模式。计算模式的探索过程被抽象为一个目标为系统能耗最小化的优化问题。其中，系统能耗的建模考虑了计算能耗、片上访存能耗、刷新能耗和片外访问能耗。调度结果会被编译成分层的配置信息（包括可容忍的数据维持时间、每层的计算模式及刷新标志），作为执行阶段的硬件配置。\n\
    \n(3) 架构层次：设计一个刷新优化的 eDRAM 控制器。相比于传统的 eDRAM 控制器加入一个可编程的时钟分频器、各 eDRAM 分区独立的刷新触发器和刷新标志位，以实现对每个存储分区独立的刷新控制，进一步降低刷新能耗。\n\
    \n前两个层次的工作主要是在编译阶段生成人工智能芯片的配置信息；第三层次的工作主要是在执行阶段基于配置信息重构芯片的执行方式，决定每个分区分别存储什么数据类型、是否需要刷新以及刷新周期，最终实现优化能耗的目标。\n\
    \n### 7.2.1 实验分析平台和优化方向\n\n建立图 7.12 所示的实验分析平台来研究基于 eDRAM 的人工智能芯片。首先，依据目前主流人工智能芯片[19,\
