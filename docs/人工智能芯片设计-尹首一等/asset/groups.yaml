    5 章中介绍的方法精确建模得到[35]。刷新操作数量 \( \gamma \) 通过在实验平台上进行数据生存时间分析得到。


    具体调度方法如图 7.17 所示，调度结果会被编译成分层的配置信息（包括“可容忍”的数据维持时间、每层的计算模式及刷新标志），以用于执行过程的硬件配置。


