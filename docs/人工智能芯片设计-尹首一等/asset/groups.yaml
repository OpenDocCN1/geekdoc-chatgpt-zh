    - 龙世兵\n- 马凯学\n- 毛志刚\n- 时龙兴\n- 孙宏滨\n- 孙玲玲\n- 王志华\n- 尹首一\n- 虞小鹏\n- 曾晓洋\n- 张波\n-\
    \ 赵元富\n- 邹雪城\n\n## 序\n\n集成电路无疑是近 60 年来世界高新技术的最典型代表，它的产生、进步和发展无疑高度凝聚了人类的智慧结晶。集成电路产业是信息技术产业的核心，是支撑经济社会发展和保障国家安全的战略性、基础性和先导性产业，也是我国的战略性必争产业。当前和今后一段时期，我国的集成电路产业面临重要的发展机遇期，也是技术攻坚期。总体上讲，集成电路包括设计、制造、封装测试、材料等四大产业集群，其中集成电路设计是集成电路产业知识密集的体现，也是直接面向市场的核心和制高点。\n\
    \n“关键核心技术是要不来、买不来、讨不来的”，这是习近平总书记在 2018 年全国两院院士大会上的重要论述，这一论述对我国的集成电路技术和产业尤为重要。正是由于集成电路是电子信息产业的基石和现代工业的粮食，对国家安全和工业安全具有决定性的作用，我们必须、也只能立足于自主创新。\n\
    \n为落实国家集成电路产业发展推进纲要，加快推进我国集成电路设计技术和产业发展，多位院士和专家学者共同策划了这套《集成电路设计丛书》。这套丛书针对集成电路设计领域的关键和核心技术，在总结近年来我国集成电路设计领域主要成果的基础上，重点论述该领域的基础理论和关键技术，给出集成电路设计领域进一步的发展趋势。\n\
    \n值得指出的是，这套丛书是我国中青年学者近年来学术成就和技术攻关成果的总结，体现集成电路设计技术和应用研究的结合，感谢他们为大家介绍总结国内外集成电路设计领域的最新进展，每本书内容丰富，信息量很大。丛书内容包含了先进的微处理器、系统芯片与可重构计算、半导体存储器、混合信号集成电路、射频集成电路、集成电路设计自动化、功率集成电路、毫米波及太赫兹集成电路、硅基光电片上网络等方面的研究工作和研究进展。本丛书旨在使读者进一步了解该领域的研究成果和经验，吸引和引导更多的年轻学者和科研工作者积极投入到集成电路设计这项既具有挑战又有吸引力的事业中来，为我国集成电路设计产业发展做出贡献。\n\
    \n感谢撰写丛书的各领域专家学者。愿这套丛书能成为广大读者，尤其是科研工作者、青年学者和研究生十分有用的参考书，使大家能够进一步明确发展方向和目标，为开展集成电路的创新研究和工程应用奠定重要基础。同时，希望这套丛书能为我国集成电路设计领域的专家学者提供一个展示研究成果的交流平台，进一步促进和推动我国集成电路设计领域的教学、科研和产业的深入发展。\n\
    \n郑纬忠\n\n2018 年 6 月 8 日\n\n## 前言\n\n人工智能自 1956 年被正式提出以来，经历了半个世纪的积累，又一次迎来了革命性的大发展。在计算力和数据量大幅度提升的推动下，人工智能在机器学习，特别是神经网络主导的深度学习领域获得极大的突破，深度学习算法已成为人工智能算法的代名词。因此，目前所说的人工智能芯片通常是指深度学习算法芯片，它们以计算架构创新为手段，对深度学习算法进行优化处理，在尽量不牺牲精度和硬件代价的前提下，实现对人工智能应用在计算速度、功耗和成本等各方面的优化。设计出符合不同应用需求的人工智能芯片，已成为加快人工智能与新经济社会各领域渗透融合，推动人工智能可持续发展的重要因素。\n\
    \n面对从“云”到“端”不断增长的市场需求，人工智能芯片设计技术创新活跃，各种促进深度学习算法有效处理的芯片架构设计新方法和新技术不断涌现。本书对这些方法和技术进行了广泛的讨论，将其中最具先进性、代表性的工作和研究成果按照计算架构、数据复用、网络映射、存储优化以及软硬件协同设计等五个方面进行深入分析和总结，并探讨了有助于进一步优化人工智能芯片计算架构的新思路、新技术和新方法，同时给出实验结果，以评估其有效性。\n\
    \n全书分为 9 章。第 1 章是绪论，分析了当前的人工智能热潮下，从体系结构入手，实现人工智能芯片根本性创新的必要性；第 2 章首先回顾了人工智能的发展历程，由此引出了人工智能与神经网络的关系，并详细介绍了人工神经网络模型的相关组成元素和深度神经网络的常见网络结构，让读者能够快速了解人工智能芯片相关的基础领域知识，为后续章节内容的探讨做铺垫；第\
    \ 3 章基于常用深度神经网络的数学模型，分别从计算量、访存、并行性等多个维度深入地分析了神经网络日益复杂的结构给智能计算带来的各种挑战，进而引出了人工智能芯片在性能、功耗以及灵活性方面的设计需求；第\
    \ 4 章按照时域和空域计算架构，对学术界和业界知名的人工智能芯片架构进行了系统性的分类介绍，详细分析了每款芯片的架构特点和能效表现，并深入剖析了现有计算架构存在的问题，最后以一款多粒度可重构智能计算架构为例探讨了目前最新的国际研究热点；第\
    \ 5 章重点讨论智能计算架构常用的数据复用模式，不仅对每种模式的访存行为进行了建模分析和智能计算架构设计实例分析，还深入剖析了在智能计算中采用固定的数据复用模式和分块参数存在的问题，最后以混合数据复用模式为例详细介绍了能够进一步提升能效的智能计算架构数据复用模式设计的新方法；第\
    \ 6 章详细介绍和分析了面向人工智能芯片的经典网络映射方法和最新的前沿研究工作，并针对神经网络模型日益复杂的发展趋势，介绍了一种能够提高硬件资源利用率和性能的复杂网络映射方法；第\
    \ 7 章介绍了对人工智能芯片架构设计至关重要的存储技术，包括高密度片外存储技术和片上存储技术；第 8 章从软硬件协同设计的角度介绍了提升人工智能芯片架构能效的前沿创新工作；第\
    \ 9 章总结全书并展望了人工智能芯片设计的未来发展方向。\n\n我们希望能通过本书与国内同行一起分享和探讨人工智能芯片领域的创新研究成果，共享人工智能技术热潮带来的巨大发展机遇，共同推动我国人工智能芯片产业持续发展。\n\
    \n本书相关资料的收集整理和相关研究成果的取得凝聚了清华大学微电子所可重构计算研究团队近几年的集体智慧和汗水。特别感谢众多的博士和硕士研究生，包括欧阳鹏、唐士斌、谷江源、林鑫瀚、陆天翼、郭建幸、王智慧、严佳乐、吴薇薇、崔冬冬、邓金易等，他们在读期间为智能计算芯片技术的研究和发展以及本书的最终完成做了大量辛勤的工作。\n\
    \n我们在撰写本书的过程中力图精益求精，但难免存在疏漏之处，敬请读者指正和谅解。\n\n作者\n2020 年 3 月\n\n## 目录\n\n- 序\n-\
