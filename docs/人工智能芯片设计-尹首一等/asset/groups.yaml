    虽然专用处理器在性能、功耗和能效方面具有明显优势，但是其通用性受限，往往只支持固定的一种计算模式，很难根据神经网络结构的不同和执行目标的不同来改变其计算架构。然而重新设计一款基于
    ASIC 的专用处理器需要经历架构设计、寄存器传输级 (Register Transfer Level, RTL) 实现、仿真验证、流片生产、测试等一系列繁复而耗时的环节，其上市周期通常在一年左右，根本无法适应当下神经网络算法仅为
    6~8 个月的快速演进周期。


    基于可重构器件实现的神经网络加速处理器对通用处理器平台和基于 ASIC 的专用处理器进行了折中。这一类处理器包含 FPGA 和粗粒度可重构阵列 (Coarse
    Grained Reconfigurable Architecture, CGRA)，具有硬件可编程能力。FPGA 提供细粒度的可编程硬件逻辑计算和存储单元，可以方便研究者根据算法需求定制化地设计处理器计算通路结构，通过静态全局重构的方式实现在同一块处理器上不同算法的硬件实现，通常
    FPGA 芯片能够将工作功耗控制在 2~30W，能效比控制在 10~100GOP/W 范围。CGRA 则是将计算部分集成为可配置的 PE，通过配置信息来改变
    PE 及存储器彼此之间的连接，从而实现对硬件结构的动态配置。由于 CGRA 固化了 PE 内部的硬件电路，减少了其互连配置的额外成本，与 FPGA 相比，其能效更接近
    ASIC，功耗则可以控制在毫瓦级别。


    通常而言，基于 ASIC 和可重构器件设计的神经网络处理器都能满足研究者针对算法特性进行定制化硬件设计的需求，这一设计过程称为神经网络加速器的结构设计。神经网络加速器的片上资源相对于当前流行的神经网络模型十分有限，因此如何将神经网络模型有效地映射到硬件上执行，需要在软硬件两个方面的设计上都进行特殊的优化。软件算法层面，通过简化网络模型，可以大幅度降低模型所需的计算操作数和复杂度，减轻硬件执行的压力，主要的优化方法包括数据量化缩减位宽、模型修剪稀疏化、矩阵变换减少操作数等方式；硬件设计层面，通过循环变换、数据复用等数据流优化手段，可以有效地减少计算执行过程中的访存成本，提升计算通路的吞吐带宽和计算效率。


    如图 3.8 所示，相比较而言，上述智能计算平台中，通用处理器具有最高的灵活性和最低的能效，ASIC 与之相反，而可重构处理器在两者之间进行了一定的权衡和折中。总的来讲，现有的通用计算器件，包括
    CPU、GPU 和 FPGA，尽管已经较广泛地应用于智能计算，但是功耗和能效都不够理想。基于 CPU 构建的 Intel Xeon E5 运行 AlexNet
    需要 254.5ms，功耗为 80W，能效仅为 0.07GOP/W。基于 GPU 构建的 NVIDIA K40 运行 AlexNet 虽然仅需要 7.1ms，但是其功耗高达
    235W，能效仅为 0.87GOP/W。虽然 FPGA 有计算能力更强的 DSP 单元和更低的功耗，能够获得比 CPU 和 GPU 更高的能效，但由于它的可编程粒度太细，重构时间和能耗开销较大，且没有专门针对神经网络设计的逻辑单元，不能灵活地根据不同神经网络类型和结构进行动态资源重构，导致其应用于智能计算时，能效依然受限。以
    Virtex VX485t[11]为例，其运行 AlexNet 的卷积层需要 21.61ms，功耗为 18.61W，能效为 3.3GOP/W。


