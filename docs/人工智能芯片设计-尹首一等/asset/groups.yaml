    ## 第 4 章 人工智能芯片架构设计


    2010 年，法国科学家 Temam 在计算机体系结构顶级会议 ISCA''10 上发表主题演讲 The rebirth of neural networks[1]，阐述了神经网络在通用计算和专用计算的各个领域可能给硬件设计带来的重大影响。自此人工智能芯片的设计进入了高速发展期，成为计算机体系结构和集成电路设计领域的一个重要研究方向。


    2010 年至今，从互联网到物联网，智能产品呈井喷式发展，对人工智能芯片的要求也在不断提高。不仅要求芯片在满足各种终端设备对功耗的严苛要求的同时提供高精度、高算力，而且要求芯片具有灵活性，即通过配置或者编程，适应不同的深度神经网络结构，包括网络层、卷积核、通道数量的不同、每一层网络形状、层间互连以及卷积核尺寸的差异等，以应对应用需求的多样化和深度学习算法的飞速演进。对于边缘计算型人工智能芯片，必须考虑的关键指标还包括成本，即硬件代价。


    本章将围绕精确度、能耗、吞吐率、成本、灵活性等关键指标，对现有的人工智能芯片架构进行分析，并讨论有助于进一步优化人工智能芯片的新方法，同时给出实验评估结果。


    ### 4.1 研究现状


    根据第 3 章给出的神经网络层数学模型，可以看到智能计算主要是大量的线性代数运算，典型的如张量处理，而控制流程则相对简单，非常适合采用并行计算范式来提高性能。因此，人工智能芯片架构通常采用高度并行的计算架构，主要包括图
    4.1 所示的时域计算架构和空域计算架构[2]。


    #### 4.1.1 时域计算架构


    时域计算架构通常是指采用专门针对神经网络算法定制指令集的专用处理器（Application Specific Instruction-set Processor，ASIP）架构。如图
    4.1(a) 所示，它基于指令流对计算资源算术逻辑单元（Arithmetic Logic Unit，ALU）和存储资源进行集中控制，每个 ALU 都从集中式存储系统获取运算数据，并向其写回运算结果。时域计算架构在人工智能芯片领域的应用研究主要集中在神经网络处理器发展的早期，学者更多关注的是人工智能硬件在功能上能否支持目标应用场景。当时应用最广泛的通用处理器都是标量处理器，只提供简单计算的指令，如乘法或加法，且每条指令只能进行标量运算。即使主频高达千兆赫兹的
    CPU，仍然需要很长时间才能通过一系列标量运算来完成大型张量和矩阵的计算。因此，要使得通用处理器更有效地适用于人工智能应用，最直接的改进思路就是让一条指令同时针对多个数据元素执行相同的操作。时域并行计算架构正是符合这一改进思路的最佳架构。此外，GPU
    的流处理器本身就是一种高效的向量处理器，在单个时钟周期内，可以处理数百到数千次运算。因此，时域计算架构主要出现在应用于人工智能应用的 CPU 或 GPU 中。随着时间的推移，学者也开始关注时域计算架构本身的进一步优化，这个时期出现了两个典型的代表性设计。


    其一是 Cadence 公司的 Vision C5 DSP[3]，其整体架构如图 4.2 所示。其主要目标是，解决在神经网络处理过程中，传统神经网络处理器由于只能完成卷积加速，需要其他处理器辅助完成其他运算，从而在处理器之间来回搬移数据而导致的能效受限问题。C5
    基于 SIMD VLIW 体系结构设计，支持卷积、全连接、池化等全连接神经网络处理功能，能够在不到 1mm² 的芯片面积上实现 1TMAC/s² 的计算能力。基于业界知名的
    AlexNet CNN 基准测试集，Vision C5 DSP 的计算速度较 2017 年业界的 GPU 最快提高 6 倍；基于 Inception V3
    CNN 基准测试集，则可达到 9 倍的性能提升效果。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_41_0.png)


    图 4.2 Tensilica Vision C5 DSP 的整体架构


    另一典型代表是中国科学院计算技术研究所的 DianNao 系列神经网络加速器[4]。该系列的首款芯片——DianNao 于 2014 年设计完成，支持大规模
    CNN 等深度神经网络的加速处理，是世界上最早的面向人工智能领域专用计算的神经网络加速器。DianNao 系列的其他芯片均以 DianNao 的计算架构为基础，在功能多样性、配置灵活性及数据复用等方面持续升级，因此，这里着重介绍
    DianNao 的整体架构。如图 4.3 所示，它由三部分组成，即完成人工智能运算的核心——神经功能单元 (Neural Functional Unit,
    NFU)、用于存储输入输出数据与网络参数的缓存 (NBin、NBout、SB) 以及控制器。NFU 和存储器在指令流驱动下受控制器的统一组织调度。其运算核心
    NFU 按照卷积运算流程进行三级流水化设计，划分为乘法功能段 NFU1、加法功能段 NFU2 以及非线性激活函数功能段 NFU3。作为一款 ASIC 型的神经网络专用处理器，DianNao
    针对特定类型的 CNN 计算定制计算单元和数据通路设计，结构简明精炼，与需求紧密贴合，能够获得比通用处理器更高的能效：相比于 128bit 的 SIMD 处理器可达到
    117.87 倍的加速和 21.08 倍的能耗降低的效果。


    从上面介绍的两种典型设计可以看到，时域计算架构的计算单元配置虽然非常灵活，但是每一步操作都需要精确的指令来控制存储器访问和具体计算单元的操作类型，而且集中式存储设计导致架构与片外存储交互频繁，因此性能和能效受限。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_42_0.png)


    #### 4.1.2 空域计算架构


    空域计算架构如图 4.1 (b) 所示，其每个 ALU 都具有独立的控制逻辑，并可以带本地存储器，如本地缓存或者寄存器文件。带有本地存储器的 ALU 通常称为计算单元
    PE。整个架构采用数据流控制，即所有 ALU 形成处理链关系，数据直接在 ALU 之间传递。


    2016 年，MIT 设计的 Eyeriss[6] 是采用空域计算架构设计的典型代表之一。如图 4.4 所示，它基于 1 个 12×14 的 PE 阵列构建，每个
    PE 内部自带控制器和本地存储器，整个架构不仅设计了由 PE 本地寄存器、片上全局缓存、片外 DRAM 等访问代价不同的存储层次构成的多级存储系统，而且 PE
    之间也可以直接传递数据。在计算过程中，Eyeriss 采用一种新提出的行固定 (Row Stationary, RS)[6] 的数据流来大幅提升片内数据复用率。图
    4.5 给出了一种基于 RS 数据流在二维空域计算阵列中联合多个 PE 共同完成 1 个二维卷积计算的例子。这个例子中的 3×3 的卷积核分为 3 行分别映射到同一列的
    3 个 PE 中，与流过 PE 的输入特征数据行相乘，每个 PE 得到的乘积与下一行传来的部分和累加后再直接传给上一行的 PE 进行累加，最终得到这一行的输出累加和。在整个的计算过程中，权重数据及部分和数据都不需要与全局缓存交互，同时实现了权重数据和输出数据的重用。由此可以看到，与其他数据复用模式相比，行固定模式的优点在于它能够最大化卷积计算中所有数据（权重数据、输入数据及输出数据）的重用，而不是其中的某一种，因此与单一类型的数据复用模式相比，能够更好地利用低成本存储访问来提升能效。根据实验数据显示，Eyeriss
    将智能计算的整体能效较传统方法提升了 10 倍，使得在移动设备上执行自然语言处理和面部识别等复杂的智能计算任务成为可能，推动了人工智能边缘计算处理器研发的热潮。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_43_0.png)


    图 4.4 Eyeriss 整体架构[6]


    ![](img/16a61618bbeb2ecae4884725c4086cbe_43_1.png)


    图 4.5 空域计算阵列中行固定的二维卷积数据复用[6]


    另一个采用空域计算架构的典型代表作是比利时鲁汶大学于 2017 设计的 ENVISION[7]架构，这是一种用于低功耗卷积神经网络、精度可扩展的计算架构。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_40_0.png)


    图 4.1 时域和空域计算架构[2]

