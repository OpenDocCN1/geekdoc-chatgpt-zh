    ## 图 7.20 加速器在 ResNet 上的能耗比较（见彩图）


    在此之上，继续进行更细粒度的探究，即针对 VGG 网络中的每一层信息进行不同模式的比较。如图 7.21 所示，在第 2～8 层，RANA (0) 表现出显著能耗降低的效果，这是因为
    WD 取代了 OD 被选为这些层的计算模式。这 7 层的缓存容量需求均超过了 1.454MB 的 eDRAM 缓存大小。在 WD 计算模式的帮助下，缓存容量需求得以降低，节省了
    79.5%～91.6%的片外访存。尽管因为 WD 计算模式的缘故，刷新能耗稍有上升，整体系统能耗仍然降低了 47.8%～67.0%。在其他网络层上，RANA
    (0) 根据系统能耗模型选择能耗最优的 OD 计算模式，所以它的能耗与 OD 计算模式一样。对于整个 VGG 而言，由于混合计算模式的引入，RANA (0)
    总共降低了 19.4%的系统能耗。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_129_0.png)


    总体来说，基于 eDRAM 的神经网络加速框架从三个层面——训练层次、调度层次、架构层次进行优化，从而来缓解片上缓存需求以及计算能耗问题，与同面积下采用 SRAM
    的神经网络加速器（S+ID）相比，如图 7.19 所示，RANA*（E-5）在执行实验选取的 4 种典型神经网络运算时，平均节省了 65.2%片外访存以及
    61.7%的系统能耗，使人工智能芯片的能量效率获得大幅提高。


