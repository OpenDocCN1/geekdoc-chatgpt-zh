    本节首先回顾了人工智能的发展历程，由此引出了人工智能与神经网络的关系，并详细介绍了人工神经网络模型的相关组成元素和深度神经网络的常见网络结构，让读者了解智能计算芯片相关的领域知识；其次基于几种目前常用深度神经网络的数学模型，分别从计算量、访存、并行性等多维度深入分析了网络结构给智能计算带来的各种挑战，进而引出了智能计算芯片在性能、功耗以及灵活性方面的设计需求；然后分别从计算架构、数据复用、网络映射、存储优化以及软硬件协同设计等不同角度切入，分别介绍智能计算芯片领域的核心关键技术和我们的研究成果，并辅以实测实验数据与前人工作进行比较，说明相关研究成果的有效性；最后讨论了智能计算芯片设计技术的发展方向。


    ## 第 2 章 人工智能与神经网络


    ### 2.1 人工智能


    人工智能是一门融合了计算机科学、统计科学、脑神经学和社会科学的前沿综合性学科，诞生于 1956 年 Dartmouth(达特茅斯)学会。McCarthy(麦卡锡)在此次会议上正式提出人工智能的概念，并将其定义为“研制智能机器的一门科学与技术”。此后，很多专家学者又从不同的角度定义了人工智能。例如，美国斯坦福大学人工智能研究中心尼尔森(Nilson)教授将其定义为“关于怎样表示知识及怎样获得知识并使用知识的科学”；美国麻省理工学院的温斯顿教授将其定义为“人工智能就是研究如何使计算机去做过去只有人才能做的智能的工作”。无论何种定义，都能反映人工智能的基本思想和基本内容，即研究人类智能实质，并构造能以人类智能相似的方式做出反应的人工系统。目前，人工智能应用领域的研究包括机器人、语音识别、图像识别、自然语言处理和专家系统等。


    人工智能系统自己获取知识的能力称为机器学习。学习是人类思维的重要组成部分，也是人工智能的主要标志和获得智能的基本途径，因此，机器学习是人工智能研究中最突出和最重要的领域。它专门研究计算机怎样模拟或实现人类的学习行为，以获取新的知识或技能，重新组织已有的知识结构，不断改善自身的能力。与传统的用于解决特定任务、硬编码的软件程序不同，机器学习用大量的数据来“训练”模型，通过各种算法从数据中学习如何对现实世界中的事件做出决策和预测。传统的机器学习算法包括决策树、贝叶斯分类、支持向量机、聚类、最大期望(Expectation
    Maximization，EM)算法、自适应增强(Adaboost)算法等，它们在指纹识别、基于 Haar 的人脸检测、基于 HoG 特征的物体检测等特定场景领域的应用基本达到了商业化的水平，但离智能的标准还很远，直到深度学习的出现。


    深度学习起源于科学家发现人的视觉系统对信息的处理是分级的，高层的特征是低层特征的组合，从低层到高层的特征表达越来越抽象和概念化。由此激发科学家认识到大脑是一个深度结构，认知过程是按深度分级的。例如，首先由瞳孔摄入图像，之后大脑皮层某些细胞进行初步处理，发现图像的边缘和方向，抽象出物体的形状，然后进一步抽象，识别出图像类别，如人脸。深度学习的思想正是借鉴了大脑这种天然的深层结构和分级认知方式。然而历史的发展向来不是一帆风顺的。1957
    年，Frank Rosenblatt 在 New York Times 上发表文章 Electronic “brain” teaches itself，首次提出可以模拟人类感知能力的感知器，神经网络得以发展，深度学习开始萌芽，直到
    2006 年，Geoffrey Hinton 提出深度置信网络 (Deep Belief Network, DBN)，并提出非监督贪心逐层训练 (Layer-wise
    Pre-training) 算法，深度学习的应用效果才取得突破性进展，其与之后 Ruslan Salakhutdinov 提出的深度玻尔兹曼机 (Deep
    Boltzmann Machine, DBM) 掀起了深度学习的浪潮。目前，深度学习已经成为人工智能领域最先进、应用最广泛的核心技术，同时，深度学习也是人工智能领域最主流的研究方向。


