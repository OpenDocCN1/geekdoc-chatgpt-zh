    # 7.1.2 3D DRAM 的高温问题


    神经网络计算，尤其是全连接神经网络和循环神经网络计算，对带宽和存储需求量极大。为了满足这些带宽和存储需求，可以考虑结合 3D DRAM 等高密度片外存储技术。然而，按照
    JEDEC 标准规定，DRAM 温度一旦达到 85°C，存储器的自刷新速率就必须翻倍[17]，且每提高 10°C 就翻一倍，这会大幅降低 DRAM 的可靠性和性能。因此散热成为高密度片外存储必须解决的问题。谷歌的
    TPUV3 芯片就使用了 3D DRAM 来满足高带宽需求，而为了解决随之而来的高温问题，甚至使用了水冷系统[18]。


    现有的人工智能芯片直接与 3D DRAM 等高密度存储技术结合，导致高温问题的主要原因包括以下三点。


    第一，传统的人工智能芯片大部分都是采用时分映射（Time Division Mapping, TDM）机制，例如，第 6 章提到的层级时间映射。而在实际应用中，包含有多种不同类型网络层(如卷积层、链接层等)的神经网络被广泛使用。在时分映射机制下，神经网络中的各种网络层依次执行，而不同网络层对于资源利用的倾向不同。一般来说，在执行卷积层的时候对于计算资源的需求量较大，而在执行全连接层和循环层的时候对于带宽资源的需求量较大。这样就会导致温度波动较大，峰值温度可能会很高。'
  - '[PAGE 108]


    第二，已有的人工智能芯片设计并不能充分利用片上缓存资源。它们通常将片上缓存分为相互独立的三部分，分别用于存储神经网络的输入、输出和权重数据[19-22]。然而，神经网络中不同类层对于片上缓存的需求也很不相同。如果给输入输出和权重数据各自分配固定大小的片上缓存，在执行整个神经网络的过程中，三种片上缓存的容量往往不能和实际的需求量良好匹配，造成浪费。片上缓存不能得到充分利用，就会造成片外存储访问更加密集，从而加剧高温问题。


    第三，稀疏化并未节省片上缓存资源。在基于单指令多数据流计算单元的人工智能芯片对全连接层进行加速时，常常用到稀疏化技术。然而，目前基于 2D 计算单元阵列的人工智能芯片，通常片上缓存仍然保存密集（Dense）权重，也就是把稀疏化后的全连接层和循环层中被剪枝掉的部分再补上
    0 然后保存。这种密集表示使得片上缓存资源不能得到稀疏化的收益，没有有效利用片上缓存资源，因此也会导致片外存储访问密集而加剧高温问题。


    # ## 7.1.3 高温问题的解决思路


    除了物理降温手段以外，从根源上避免高温的产生才是解决问题的关键。这就需要减少片外访存总量和优化片外访存行为模式。


    3D DRAM 中的高温问题包含两个方面：一个是稳定高温；另一个是峰值温度过高。两者成因不同，又具有一定相关性，因此需要对两者进行联合优化才能解决问题。稳定高温主要受到片外访存总量的影响，因此可以采用免补零的稀疏化计算方式、全局缓存、面向缓存的分块和调度等优化手段来减少片外访存总量，降低稳定温度。峰值温度主要受到访存行为模式的影响，可以通过利用神经网络中不同类型的网络层之间访存需求的互补性，通过合理的资源分配和计算调度，平滑各个时刻的访存量来降低峰值温度。


    # ## 7.1.4 计算架构优化


    针对高密度访存带来的高温问题，图 7.5 给出一个优化架构 Parana，它是在第 4 章提出的人工智能芯片基本架构 Thinker 的基础上改进得到的。其基本思路是通过空间分割映射（Spatial
    Division Mapping，SDM）平滑访存行为来优化存储器的温度。为了减少访存总量，该架构采用基于高速暂存存储器（Scratch Pad Memory，SPM）的全局缓存、多寄存器缓存，以及面向缓存的分块和调度机制来最大化数据复用，并采用免补零的稀疏化计算方式。该架构主要由四个部分组成：可分区且可重构的计算单元阵列、全局
    SPM 缓存、寄存器高速缓存和数据流控制器。'
