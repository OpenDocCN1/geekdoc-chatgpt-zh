    23.7%、86.9%和 84.0%的能耗。为了更进一步分析能耗降低的内在原因，专门对 AlexNet 上的能耗降低在各网络层上进行了分解，如图 5.11
    (d) 所示。在 AlexNet 的 5 个卷积层 (CONV1~CONV5) 和 3 个全连接层 (FC1~FC3) 上，最优数据复用模式分别为 WR-IR-WR-IR-IR-WR-WR-WR，且各层分块参数各不相同(见图
    5.11 (d) 右侧表格)。在 CONV1 和 CONV2 上，混合模式的能耗降低更显著，这是因为传统方法在这 2 层上的缓存需求过高以致超过了片上缓存容量，进而造成了更多的片外
    DRAM 访问。全连接层的权重数量比卷积层更多，是一种访存密集型任务，WR 模式可以在批处理内实现权重复用，减少权重的重复访问，所以在全连接层上选择了 WR
    模式。


    以上分析结果表明，与单独使用某种固定的数据复用模式相比，混合数据复用模式充分考虑了网络各层的差异性以及芯片的硬件约束，能够实现逐层优化，获得计算能效的显著提升。


