    # 图 5.10 混合数据复用模式的工作流程


    其中，MAC 表示架构的 PE 阵列中包含的总乘加器数量，而 1 个乘加操作包含一乘一加 2 个操作。在给定工作频率下，智能计算的性能取决于它计算具体网络时的
    PE 利用率。为了提高 PE 利用率，这里选用一种并行的面向输出的映射方法 (Parallel Output Oriented Mapping, POOM)
    [9]来完成卷积映射。POOM 通过在 PE 阵列上并行放置 P 个特征图的计算来提高传统卷积映射方法[2,12]在处理卷积网络计算时出现的硬件资源利用率不足的问题。由于硬件计算资源有限，增加并行特征图的个数
    P，会减少每个在阵列上并行计算的特征图的大小，POOM 会对卷积'
  - '[PAGE 79]


    计算的内部循环做进一步的分块，再映射到 PE 阵列上。POOM 用 Trr 和 Tcc 分别表示对应 Tr 和 Tc 进一步分块的参数。因此，在本框架中，计算模式采用数据复用模式
    < IR/OR/WR, Tr, Tc, Tm, Tn > 和卷积映射方法 < P, Trr, Tcc > 共同描述。此外，调度框架中的 Ri, Ro 和 Bw
    分别表示计算架构中输入寄存器、输出寄存器和权重缓存的容量，A 表示架构中 PE 阵列的横向与纵向 PE 数。而各分块参数的选取必须考虑架构中硬件资源的约束，同时，对片外
    DRAM 的带宽需求 BWreq 不应该超过最大可用的 DRAM 带宽 BWmax。


    需要注意的是，双目标优化问题通常转化成单目标问题来求解。这个执行目标可以根据不同的应用需求而改变。例如，如果应用需要平衡能效和性能，那么执行目标可以设置成例如能耗延时积等能够兼顾能效与性能的综合性指标；如果应用需要最大的
    CNN 计算吞吐，则可以优先优化性能，再优化能效。在编译阶段的最后，调度结果会被编译成智能计算架构可用的配置信息。


    架构配置完成以后则进入执行阶段。执行阶段总共分 4 个步骤：


    +   (1) 从片外 DRAM 中加载之前编译出来的配置信息；

    +   (2) 从片外 DRAM 中加载输入数据和权重；

    +   (3) 执行当前层(卷积层或全连接层)；

    +   (4) 把当前层的输出写入片外 DRAM。


    上述 4 个步骤是完全流水的，直到一个批次的特征图都处理完。正如在步骤 (3) 中所描述的，架构会顺序计算各个卷积层，然后以批次为单位处理全连接层。


    # 5.4.2 实验结果


    依据上述方法，选择四个经典的神经网络 AlexNet、GoogLeNet、VGG19 和 ResNet50 作为测试基准。基于 Thinker 芯片架构的硬件参数，针对每个测试基准运行调度框架，以获得最高能效。调度框架采用式
    (5-8) 预测各种数据复用模式的访存能耗。


    图 5.11 展示了混合数据复用模式与 3 种基本数据复用模式在访存次数和能耗上的比较。传统的 3 种模式会采用最大的特征图 2 维尺寸 (Tr×Tc 及
    Th×Tl)，以最大化通道内的数据复用性。而混合模式会探索 3 种基本数据复用模式及各种分块参数，并通过式 (5-8) 的能耗评估来寻找能效最高的调度方案。可以认为，传统方法只是该方法的探索空间中的
    3 个点而已。平均来看，相比于 IR、OR 和 WR 模式，混合模式分别减少 23.7%、35.1%和 52.7%的片上缓存访问次数 (图 5.11 (a))，以及
    84.7%、90.3%和 86.6%的片外 DRAM 访问次数 (图 5.11 (b))。


    此外，如图 5.11 (c) 所示，相比于 IR、OR 和 WR 模式，混合模式分别降低了'
