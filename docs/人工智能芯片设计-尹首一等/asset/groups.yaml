    # 第 1 章 绪 论


    从古希腊神话中的人造人塔洛斯(Talos)、加拉蒂亚 (Galatea)、潘多拉 (Pandora)，到中世纪炼术中赋予意识的无生命物质 Takwin、何蒙库鲁兹，再到现代的达芬奇机器人、Google
    的 AlphaGo，创造能够自主思考的机器一直是人类的梦想。人工智能 (Artificial Intelligence, AI) 就是帮助人类实现这一梦想的科学，它让机器做人类需要智能才能完成的事，让计算机听懂人类语言，像人一样思考、辨别，并借助其在逻辑思维、信息存储容量、执行速度等方面超越人类智能的优势，帮助人类感知、认知、分析、预测乃至重塑世界。它与基因工程、纳米科学并列
    21 世纪三大尖端技术。目前，机器人、无人机、3D 打印、无人驾驶等学术界、科技界和产业界关注的几乎所有的热点和主题，发展突破的关键都在于人工智能。不得不说人工智能的发展关乎人类的未来。无论硅谷创业公司、大学及科研机构，还是谷歌、微软、百度、Facebook
    等国际 IT 巨头都在人工智能领域频频发力，自由资本更是竞相追逐。仅 2017 年一年，全球新成立人工智能创业公司约 1100 家，人工智能领域共获得投资
    152 亿美元，同比增长 141%。


    世界大国更是以“得人工智能者得天下”的决心大搞人工智能军备竞赛。2015 年以来，美国、英国、法国、日本、德国、加拿大、新加坡、阿联酋、芬兰、丹麦、欧盟、韩国和印度等国家和组织相继将发展人工智能作为提升国家竞争力、维护国家安全的重大战略，并发布国家层面促进人工智能应用与开发的发展规划，力图掌握主导权。2017
    年，国务院印发《新一代人工智能发展规划》，工业和信息化部制定《促进新一代人工智能产业发展三年行动计划 (2018—2020 年)》，向世人宣示了我国引领全球人工智能理论、技术和应用的雄心。2018
    年 10 月，习近平在中共中央政治局第九次集体学习时强调，人工智能是新一轮科技革命和产业变革的重要驱动力量，加快发展新一代人工智能是事关我国能否抓住新一轮科技革命和产业变革机遇的战略问题①。未来，国家层面的人工智能竞争将愈演愈烈。


    引发这一波人工智能热潮的，正是当前最先进、应用最广泛的深度学习 (也称为深度神经网络) 技术，由多伦多大学的 Geoffrey Hinton 等于 2006
    年首次提出，


    ① 习近平主持中共中央政治局第九次集体学习并讲话。新华社。http://www.gov.cn/xinwen/2018-10/31/content_5336251.htm.'
