    # 图 7.16 三种典型的计算模式及其生存时间/缓存需求分析


    这样一来，可以调整某些参数来控制数据的生存时间。例如，通过减小 Tn 来减少刷新时间，但同时也意味着较少的数据存储在计算核心中，这样反而导致了更多的片外访存次数。


    最后对 WD 进行分析。随着网络层数的递增，它们的特征通道数越来越多（从 3 增加到 512, 1024 甚至 2048），它的输入以及输出特征尺寸会减小，但同时权重数据量反而会增加。针对这类情况，将循环
    R 和 C 置为最外层，其余的顺序与 ID 模式保持一致。在这样的计算模式中，在计算过程中所需的权重数据都被保存在片上，此时缓存的需求如下：


    ```

    BS_i = N \times Th \times Tl, \quad BS_o = Tm \times Tr \times Tc, \quad BS_w
    = N \times M \times K^2 \quad (7-20)

    ```


    通过上面的分析发现，增加分割参数的值会降低访存次数，但同时带来了数据生存时间的增加以及缓存容量的增加。我们提出神经网络分层的混合计算模式，根据芯片参数及 DNN
    参数，对网络的每一层分配一个最优的计算模式。计算模式的探索过程被抽象为一个目标为系统能耗最小化的优化问题。


    首先，建立一个如下的系统能耗模型用于能耗评估：


    ```

    Energy = \alpha \times E_{mac} + \beta_b \times E_{buffer} + \gamma \times E_{refresh}
    + \beta_d \times E_{ddr} \quad (7-21)

    ```


    系统能耗由计算能耗、片上访存能耗、刷新能耗和片外访存能耗构成。\( E_{mac} \)、\( E_{buffer} \)、\( E_{refresh} \)
    和 \( E_{ddr} \) 分别表示乘加操作、片上访存、刷新操作和片外访存的单位能耗，与表 4.3 中所列出的数据值对应。单位能耗前的系数表示上述操作的总次数。其中，\(
