    CPU 的交互，提高性能和能效，内部还集成了归一化/池化单元和完成非线性激活操作的激活单元。二维矩阵乘法阵列的输入缓存总共 24MB，包括权重缓存和提供输入特征数据的统一缓存，其输出由图中标记为累加器的
    6MB 输出缓存接收。加上用于与主机处理器进行对接的缓存，片上缓存总共占芯片面积的 37%，如此大规模片上缓存的使用有效减少了 TPU 与片外内存交互，对于提升整体性能和能效都非常有利。在核心运算单元的设计方面，TPU
    的二维矩阵乘法阵列按照脉动阵列（Systolic Array）方式互连并完成计算，如图 4.8 所示，将阵列中的所有 ALU 串联起来，在每一串 ALU 中，只有第一个
    ALU 能够直接从统一缓存中读取数据，只有最后一个 ALU 直接将计算的部分和写入累加器，输入数据在前一个 ALU 使用完以后按周期自动流入同一行的下一个
    ALU，计算得到的部分和则按同样的方式流入同一列的下一个 ALU。由于这种数据流结构中的数据像血液在血管中脉动传输一样在阵列中按照一定的节奏传递计算，因此又称为脉动结构（Systolic
    Architecture）。基于这种脉动数据流计算方式，输入数据与部分和数据在 ALU 之间通过直接传递实现了复用，而权重数据固定在每个 ALU 的寄存器中也实现了复用，由此
    TPU 获得了智能计算中所有数据的最大化复用，不仅减少了与片外存储的交互，也最小化了与片上本地缓存的数据交互，有效提升了 TPU 的整体性能和能效。此外，TPU
    还针对低位宽运算带来的算法准确率损失很小的特点，采用了 8bit 低精度运算来提升性能和能效。最终，与 CPU 和 GPU 相比，TPU 在性能上获得 30
    倍的提升，能效方面则获得 30~80 倍的提升。谷歌在 TPU 设计上取得的巨大成功，使得人工智能芯片的研究开始受到工业界的重视，成为各大公司产品路线中的重要一环，微软、英特尔、NVIDIA、赛灵思等科技巨头都陆续推出相关产品，人工智能芯片产品从此逐渐走向实用化。


