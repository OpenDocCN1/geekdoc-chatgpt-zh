    \ 3 个步骤。\n\nOR 模式中，卷积层计算会从原来的 4 层循环，等价变换成图 5.1(d) 所示的 8 层循环。相比于图 5.1(b) 所示的循环，OR\
    \ 模式中循环 M 在循环 N 交换了位置，意味着输出特征图只在完成输入通道上的完全累加后才存入输出缓存中。在 OR 模式中，计算核心对片上缓存的总访问次数可以用式(5-1)描述，记为\
    \ \\(\\text{MA}_{\\text{buffer}}^{(\\text{OR})}\\)，其中数据复用参数 \\(\\alpha_i\\)、\\\
