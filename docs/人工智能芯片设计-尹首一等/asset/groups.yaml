    \n优化访存行为的空域资源划分方法：空间分割映射机制通过划分计算资源和片上缓存资源，使得多个子网络能够在计算芯片上并行地执行，从而使得总体访存行为在时间上更加平滑。由于全连接层和循环层主要成分都是全连接计算，我们将这两种网络层放到同一个分区来执行。\n\
