    \ & Exhibition, Baden-Württemberg, 2016:1393-1398.\n\n## 第 6 章 人工智能芯片的网络映射\n\n\
    尽管神经网络中的计算(如卷积等)具有很强的可并行性，但是由于受到计算资源和存储资源的限制，整个神经网络，甚至仅仅神经网络中的一层，往往都不能全部同时映射到单个人工智能芯片上。以经典网络\
    \ AlexNet 为例，整个网络的卷积层和全连接层的乘累加(MAC)操作总数超过 7 亿次，即使单层卷积中的乘累加个数也有 3.74×10^6~1.12×10^7\
    \ 之多。而典型的人工智能芯片的处理单元个数远远小于这个数，如麻省理工学院推出的 Eyeriss 芯片的处理单元个数为 168[1]，佐治亚理工学院推出的\
