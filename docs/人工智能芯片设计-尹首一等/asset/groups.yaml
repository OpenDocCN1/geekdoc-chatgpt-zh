    \(\alpha_i\)、 \(\alpha_o\)、 \(\alpha_w\) 的计算方式如下：


    \(\alpha_i=1, \quad \alpha_o=2\left(\left\lceil \frac{N}{\text{Tn}} \right\rceil
    -1\right), \quad \alpha_w=\left\lceil \frac{H}{\text{Th}} \right\rceil \left\lceil
    \frac{L}{\text{Tl}} \right\rceil\)


    因为每个输入只被计算核心读取一次，所以 \(\alpha_i=1\)。而计算核心中存储了 Tn 个通道的输入特征图，所以输出部分和需要从输出缓存中读写 \(\left\lceil
    \frac{N}{\text{Tn}} \right\rceil -1\) 次以完成三维卷积在通道方向上的累加，因此 \(\alpha_o=2\left(\left\lceil
    \frac{N}{\text{Tn}} \right\rceil -1\right)\)。此外，每个权重会被各个输入分块重复使用，所以 \(\alpha_w=\left\lceil
    \frac{H}{\text{Th}} \right\rceil \left\lceil \frac{L}{\text{Tl}} \right\rceil\)。


    如果数据缓存需求超过了片上缓存容量，那么就会产生额外的片外 DRAM 访问。IR 模式中，人工智能芯片对片外 DRAM 的总访问次数仍然可以用式 (5-1)
    描述，记为 \(\text{MA}_{\text{DRAM}}^{(\text{IR})}\)，其中数据复用参数 \(\alpha_i\)、 \(\alpha_o\)、
    \(\alpha_w\) 的计算方式如下：


    \(\alpha_i=1, \quad \alpha_o=\begin{cases} 0, & M \times \text{Tr} \times \text{Tc}
    \leqslant B_o \\ 2\left(\left\lceil \frac{N}{\text{Tn}} \right\rceil -1\right),
    & M \times \text{Tr} \times \text{Tc} > B_o \end{cases}, \quad \alpha_w=\begin{cases}
    1, & \text{TW} \leqslant B_w \\ \left\lceil \frac{H}{\text{Th}} \right\rceil \left\lceil
    \frac{L}{\text{Tl}} \right\rceil, & \text{TW} > B_w \end{cases}\)


    其中，\(B_o\) 和 \(B_w\) 分别表示输出缓存和权重缓存的容量。对于片外 DRAM，输入特征图仍然只需要读取一次，而输出和权重的访问次数取决于数据缓存需求与片上缓存容量之间的关系。在
    IR 模式中，需要缓存 \(M \times \text{Tr} \times \text{Tc}\) 个输入输出部分和。如果这些输出部分和的数量小于输出缓存尺寸
    (\(M \times \text{Tr} \times \text{Tc} \leqslant B_o\))，那么在计算过程中就不需要将这些输出部分和存入片外
    DRAM (\(\alpha_o=0\))。否则，这些输出部分和就需要存入片外 DRAM，并且计算过程中芯片需要反复地访问片外 DRAM (\(\alpha_o=2\left(\left\lceil
    \frac{N}{\text{Tn}} \right\rceil -1\right)\))。同理，如果权重缓存需求小于权重缓存容量 \(B_w\)，那么权重也只需要从片外读取一次
    (\(\alpha_w=1\))，否则将产生额外的 DRAM 访存。注意循环 \(R\) 和循环 \(C\) 在最外层 (图 5.1(b))，IR 模式中的权重缓存需求为全部的权重量
    TW。


