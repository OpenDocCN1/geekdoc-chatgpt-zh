    \ 7.13 所示的循环分块机制，其输入数据、权重数据以及输出数据对缓存的要求按照如下的公式计算：\n\nBS_i = N \\times H \\times\
    \ L, \\quad BS_o = Tm \\times Tr \\times Tc, \\quad BS_w = N \\times Tm \\times\
    \ K^2 \\quad (7-17)\n\n在 16bit 的精度下，BS_i + BS_o + BS_w = 785KB。这个数值已经超过了基于 SRAM\
