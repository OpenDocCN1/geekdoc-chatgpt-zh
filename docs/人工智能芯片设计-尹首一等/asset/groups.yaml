    # 6.1.3 单层网络映射的建模与求解


    本书研究屋顶线模型具体地应用到单层网络映射方法的建模与求解。式(6-1)中等号右侧两个量分别反映了硬件平台的计算资源和带宽资源所施加在计算性能上的约束。从计算资源的角度考虑，最直接的约束就是硬件平台所能实现出来的
    PE 个数。假设一个 PE 在一个 cycle 内能执行一次乘累加运算，那么计算能力屋顶就可以按照式(6-2)得出：


    ```

    Computational Roof = 2 × N<sub>PE,max</sub> × Frequency

    ```


    其中，N<sub>PE,max</sub> 指的是硬件平台最多能实现的 PE 个数。当使用分块的方式对神经网络进行映射时，分块参数 <Tm,Tn,Tr,Tc>
    理论上所能达到的计算性能为


    ```

    Performance = \frac{\text{Total number of operations}}{\text{Execution time}}

    = \frac{\text{Total number of operations}}{\text{Number of execution cycles}}
    \times \text{Frequency}

    = \frac{2 \times R \times C \times M \times N \times K \times K}{\lceil \frac{M}{\text{Tm}}
    \rceil \times \lceil \frac{N}{\text{Tn}} \rceil \times \lceil \frac{R}{\text{Tr}}
    \rceil \times \lceil \frac{C}{\text{Tc}} \rceil \times (\text{Tr} \times \text{Tc}
    \times K \times K + P)} \times \text{Frequency}

