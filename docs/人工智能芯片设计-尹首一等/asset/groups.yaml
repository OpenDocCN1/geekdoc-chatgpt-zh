    # 第 6 章 人工智能芯片的网络映射


    尽管神经网络中的计算(如卷积等)具有很强的可并行性，但是由于受到计算资源和存储资源的限制，整个神经网络，甚至仅仅神经网络中的一层，往往都不能全部同时映射到单个人工智能芯片上。以经典网络
    AlexNet 为例，整个网络的卷积层和全连接层的乘累加(MAC)操作总数超过 7 亿次，即使单层卷积中的乘累加个数也有 3.74×10^6~1.12×10^7
    之多。而典型的人工智能芯片的处理单元个数远远小于这个数，如麻省理工学院推出的 Eyeriss 芯片的处理单元个数为 168[1]，佐治亚理工学院推出的 GANAX
    芯片的处理单元个数为 256 [2]。因此，需要设计一些调度方法来将神经网络进行分块(Tiling)并映射到计算芯片的计算阵列上依次执行。由于神经网络中的计算之间有数据局部性，未经充分设计和优化的分块和映射方法不利于实现数据重用，往往会增加数据在计算单元和存储单元之间移动的次数，进而影响到整体的性能和功耗。


    # 6.1 单层网络映射方法


    国内外对于神经网络在人工智能芯片上的映射技术研究，最早是从单层网络映射开始的，目前已经有很多面向各种硬件平台的方法[3~14]。


    为了将网络执行所需要的硬件资源控制在实际可用的范围内，一般需要通过数学建模来获得最优的网络分块参数，然后根据这套参数来对计算芯片进行配置，使得性能和能效最佳。


