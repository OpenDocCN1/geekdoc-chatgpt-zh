    \ 中。\n\n### 4.3.4 按需动态阵列划分\n\n多层并行计算数据流的性能取决于 PE 阵列的划分结果。给定一个特定的神经网络，通过算法 4.1\
    \ 以找到 PE 阵列和 Bank 的一组最佳分割参数，从而获得最高的 PE 利用率和最佳性能。\n\n```\n算法 4.1\n// In_c, Out_c,\
    \ Weight_c, Weight_c 表示每层 DRAM 的访问\nInitiate: CC_AP = \\infty\n1: for BS=1; BS\
    \ \\leqslant A_h -1; BS++ do\n2:   for A_w^c=1; A_w^c \\leqslant A_w -1; A_w^c++\
