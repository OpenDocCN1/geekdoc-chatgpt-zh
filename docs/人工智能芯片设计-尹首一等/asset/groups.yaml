    frac{R}{Tr} \\rceil \\lceil \\frac{C}{Tc} \\rceil, & TW > B_w \\end{cases} \\\
    quad (5-5)\\)\n\n其中，\\(B_i\\) 表示输入缓存的容量。如果输入缓存中能够存下全部 \\(N\\) 通道的输入特征图分块 (\\(N\
    \ \\times Th \\times Tl \\leqslant B_i\\))，那么全部输入只需要从片外 DRAM 读取一次 (\\(\\alpha_i\
    \ = 1\\))，否则就要重复读取 \\(\\lceil \\frac{M}{Tm} \\rceil\\) 次。\n\n有工作[5]基于输出数据复用的计算模式在\
