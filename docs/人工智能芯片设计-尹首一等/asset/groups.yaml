    \ 2012 年 ImageNet 大规模物体识别挑战赛 (ImageNet Large Scale Visual Recognition Challenge,\
    \ ILSVRC) 冠军网络 AlexNet[2]为例，其计算量最大的卷积层达到 448MOP(百万次操作 (Million Operation, MOP))，计算量最小的卷积层也达到\
    \ 150MOP。而访存量最大的卷积层达到 2MB 以上，访存量最小的卷积层也接近 1MB。\n\n第三，神经网络数据结构与底层硬件存储结构之间存在巨大差异，前者到后者的映射所带来的能效损耗成为智能计算芯片架构设计面临的重要挑战。在深度神经网络中，卷积层的输入数据和权重数据都是一组三维张量，按卷积核大小的三维数据结构和卷积滑动步长顺序组织变量参与运算。然而硬件存储器一般采用一维线性排列的基本单元组成，因此，卷积层数据最终在存储器上都将转换成一维的线性存储模型进行存储，而且一维存储模型要求访存严格按照地址顺序，从头至尾进行查找访问。这种神经网络数据结构与硬件存储结构的差异造成内存访问\
    \ 50%以上的微操作都是空操作，能耗损失较大。而且，每次只能对一个存储单元进行操作，导致神经网络的并行性难以发挥，限制了运算性能的提升。\n\n第四，不同类型的神经网络基本层具有不同的计算特点，呈现多样化特征。以\
    \ 2012 年 ILSVRC 竞赛冠军网络 AlexNet 为例，它由 5 个卷积层、3 个全连接层和 3 个池化层堆叠而成。表 3.1 统计了其各层的计算参数(单位：像素)、数据量以及计算量(单位：MOP)，其中各卷积层的计算量均高达几百兆次操作；全连接层计算量相对较小，为几兆到几十兆次操作，但数据量却很大，其中以权重数据量为甚，高达几十兆字节。此外，各层计算参数如卷积核大小、步长、输入输出特征图尺寸的变化多样。\n\
