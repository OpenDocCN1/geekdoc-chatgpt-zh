    \n图 7.9 总结了编译流程和执行流程。在编译阶段，编译器输入神经网络参数（从 Caffe 网络描述转化而来）和计算芯片的配置信息（包含硬件资源信息和各指标优先级等），输出资源分配（包括计算单元和\
    \ SPM 缓存等的分配）和调度方案。其核心是三个模型：空间分割映射的资源划分模型、卷积部分的循环分块和调度模型以及全连接部分的循环分块和调度模型。空间分割映射的资源划分模型主要用于引导计算芯片上的计算资源和缓存资源的划分。在给定的资源下，循环分块和调度模型用于寻找最大化数据复用和片上缓存利用的方案。根据各指标的优先级，编译器利用这些模型来搜索出最合适的配置，以控制计算芯片对神经网络进行加速。\n\
    \n在执行阶段，首先，计算芯片载入编译器给出的配置信息。然后，计算芯片控制器根据资源配置信息对计算单元阵列进行分区，并配置每个计算单元的功能。同时，控制器也对\
    \ SPM 缓存进行分配。调度配置信息则被用于控制计算芯片内以及计算芯片与 3D 存储器之间的数据流。\n\n图 7.9 编译流程和执行流程\n\n## 执行流程\n\
    - 加载配置\n- 配置PE阵列\n- Parana上的混合NN加速\n  - ConvNet加速\n  - FCNet/RNN加速\n- Parana\n\
    \  - CONV\n  - FC\n  - PE阵列\n  - 控制器\n\n## 编译流程\n- 混合NN参数\n- 构建调度框架\n- 优化配置\n\
    \  - PE阵列划分\n  - SPM缓存划分\n  - ConvNet分块参数与调度\n  - FCNet/RNN分块参数与调度\n- 优化问题\n \
    \ - SDM划分模型\n  - ConvNet分块与调度模型\n  - FCNet/RNN分块与调度模型\n\n## 7.2 高密度片上存储技术\n\n\
    传统的人工智能芯片，通常使用 SRAM 作为片上存储器。然而有限的芯片面积，限制了它们的片上存储容量。例如，当前几款流行的人工智能芯片 DianNao、Eyeriss、Envision\
    \ [24]、Thinker [25]，如果都按照 65nm 工艺进行估算，芯片面积为 3～20mm²，片上存储容量都不超过 500KB。因此，这些人工智能芯片在运行常见的神经网络时，难以避免地会产生频繁的\
    \ DRAM 访问，这会造成较大的系统能耗开销。因此，片上存储问题是人工智能芯片设计中必须解决的一个重要问题。\n\n如图 7.10 所示，每个 eDRAM\
    \ 存储单元由一个晶体管（Access Transistor）和一个电容（Storage Capacitor）构成。数据的逻辑值以电荷的形式存储在电容中。eDRAM\
    \ 相比于传统 SRAM 具有更高的存储密度。如表 7.2 所示，在 65nm 工艺节点下，32KB 的 eDRAM 面积开销仅为同等容量 SRAM 的 26%\
    \ [26]。它可以替代传统 SRAM 作为片上存储以减少片外访问，并且已经被应用于一些人工智能芯片[27-30]中，例如，寒武纪的 DaDianNao[27]，片上集成的\
    \ eDRAM 总存储容量达到 36MB，远超出能够集成的 SRAM 存储容量。\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_119_0.png)\n\
    \n图 7.10 eDRAM 结构\n\n然而，eDRAM 存储单元中的晶体管漏电电流 I_off 会导致电容电荷随时间逐渐丢失，所以 eDRAM 需要周期性的刷新操作来维持数据正确性。通常，为了保证程序执行过程中所有存储单元的数据都不会出错，刷新间隔取\
    \ eDRAM 数据维持能力最弱的单元所对应的数据维持时间。例如，IBM 65nm 工艺节点的 eDRAM 的数据维持时间为 45μs[31]。\n\n表\
    \ 7.2 SRAM 和 eDRAM 的特性比较 (32KB, 65nm 工艺节点)\n\n| 参数 | SRAM | eDRAM |\n| :--- |\
    \ :--- | :--- |\n| 数据存储类型 | 锁存器 | 电容 |\n| 面积 | 0.181mm² | 0.047mm² |\n| 存取延迟 |\
    \ 1.730ns | 1.541ns |\n| 存取能耗 | 1.139pJ/bit | 0.662pJ/bit |\n| 刷新能耗 | — | 0.788\
    \ µ J/存储分区 (bank) |\n| 维持时间 | — | < 100µs |\n| 特点 | (+) 速度快 (-) 面积大 | (+) 面积小\
    \ (-) 需要刷新 |\n\n已有研究表明，刷新能耗是 eDRAM 总能耗的主要来源[32]，而且会占据整体系统能耗的较大比重[33]。因此，使用 eDRAM\
    \ 带来的额外刷新能耗开销不容忽视。在基于 eDRAM 片上存储的智能计算平台上测试 ResNet，同样发现刷新能耗占据系统总能耗的很大比重。尽管高密度的\
    \ eDRAM 片上存储可以显著减少片外存储访问，但是所节省的能耗却可能被刷新能耗抵消。\n\n如果数据在 eDRAM 中的生存时间小于 eDRAM 的数据维持时间，那么系统就不再需要对于此数据进行刷新操作。由此可以得到两个优化方向：减少数据生存时间和增大数据维持时间。由此，我们提出一种基于\
    \ eDRAM 高密度片上存储器的新型加速框架——数据生存时间感知的神经网络加速框架 (Retention-Aware Neural Acceleration，RANA)[34]，以优化整体系统能耗。图\
    \ 7.11 所示为 RANA 的工作流程。RANA 框架以人工智能芯片和目标神经网络的具体参数为输入，分别从训练、调度和架构三个层次着手共同降低 eDRAM\
    \ 刷新能耗，优化系统能耗。\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_120_0.png)\n\n图 7.11\
    \ RANA 的工作流程[34]\n\n(1) 训练层次：提出一种数据生存时间感知的训练方法，重新训练网络，提高网络对数据错误 (Retention Failure)\
    \ 的容错能力。该方法在网络训练的过程中，以一定的概率向输入和权重数据中注入数据错误。在给定的精度约束下，该训练方法将得到最大可容忍的错误率，然后根据 eDRAM\
    \ 的维持时间特性曲线，得到对应的最大可容忍的维持时间，这通常会比 eDRAM 标称的数据维持时间要长。\n\n(2) 调度层次：提出一种神经网络分层的混合计算模式，根据芯片参数及\
    \ DNN 网络参数，对网络每一层的计算分别调度，并分配最优的计算模式。计算模式的探索过程被抽象为一个目标为系统能耗最小化的优化问题。其中，系统能耗的建模考虑了计算能耗、片上访存能耗、刷新能耗和片外访问能耗。调度结果会被编译成分层的配置信息（包括可容忍的数据维持时间、每层的计算模式及刷新标志），作为执行阶段的硬件配置。\n\
    \n(3) 架构层次：设计一个刷新优化的 eDRAM 控制器。相比于传统的 eDRAM 控制器加入一个可编程的时钟分频器、各 eDRAM 分区独立的刷新触发器和刷新标志位，以实现对每个存储分区独立的刷新控制，进一步降低刷新能耗。\n\
    \n前两个层次的工作主要是在编译阶段生成人工智能芯片的配置信息；第三层次的工作主要是在执行阶段基于配置信息重构芯片的执行方式，决定每个分区分别存储什么数据类型、是否需要刷新以及刷新周期，最终实现优化能耗的目标。\n\
    \n### 7.2.1 实验分析平台和优化方向\n\n建立图 7.12 所示的实验分析平台来研究基于 eDRAM 的人工智能芯片。首先，依据目前主流人工智能芯片[19,\
    \ 23-25]的资源规模和资源开销，抽象出一个基于 SRAM 的基准人工智能芯片：256 个 PE 按照 16 行 16 列展开，工作频率为 200MHz，每个\
    \ PE 内包含一个乘累加单元，片上 SRAM 存储容量为 384KB，计算核心单元内的存储容量为 36KB，用来存储输入数据、输出数据以及权重数据的缓存资源被统一在联合缓存系统中。在\
    \ TSMC 65nm GP 工艺下的总面积为 5.682mm²。\n\n| 实验平台配置 | |\n| :--- | :--- |\n| CNN 加速器\
    \ | 256 个乘加器，384KB SRAM, 200MHz, 5.682mm², 65nm |\n| eDRAM | 1.454MB，数据保持时间=45us,65nm\
    \ |\n| Layer-A (res4a_branch1) | M=1024, N=256, R=C=14, K=1, S=2 |\n| Layer-B\
    \ (vgg_conv9) | M=512, N=256, R=C=28, K=3, S=1 |\n\n图 7.12 验证平台配置参数\n\n在确定优化方向前，先以残差网络中的\
    \ res4a_branch1 为例(卷积核为 1x1x256x1024，步长为 1，输出特征图尺寸为 14x14x1024)，从缓存容量和数据维持时间两方面展开分析。假设采用图\
    \ 7.13 所示的循环分块机制，其输入数据、权重数据以及输出数据对缓存的要求按照如下的公式计算：\n\nBS_i = N \\times H \\times\
    \ L, \\quad BS_o = Tm \\times Tr \\times Tc, \\quad BS_w = N \\times Tm \\times\
    \ K^2 \\quad (7-17)\n\n在 16bit 的精度下，BS_i + BS_o + BS_w = 785KB。这个数值已经超过了基于 SRAM\
    \ 的处理器缓存容量 (348KB，Tm,Tn,Tr,Tc=1)。尽管在同样的面积下，基于 eDRAM 的缓存 (1.454MB) 可以存储下如此量级的数据，但面对拥有更大数据量的神经网络层时，也不可避免产生了额外的片外访存问题。\n\
    \n![](img/16a61618bbeb2ecae4884725c4086cbe_122_0.png)\n\n图 7.13 卷积层循环分块伪代码\n\n\
    在数据维持时间方面，输入数据在缓存中的生存时间为 LT_i = \\frac{M \\times N \\times R \\times C \\times\
    \ K^2}{MAC \\times Frequency \\times \\rho}，其中，MAC、Frequency、\\rho 分别代表了阵列单元数目\
    \ (=256)、工作频率 (=200MHz) 以及 PE 的利用率。权重数据在缓存中的生存时间为 LT_w = \\frac{Tm \\times N \\\
    times R \\times C \\times K^2}{MAC \\times Frequency \\times \\rho}。\n\n由于输出数据会被保存在\
    \ PE 中进行通道维度的累加，即完成 LOOP M 的循环运算，此后将立刻被传输到片外，因此它们的数据生存时间可以认为是 LT_o = 0。以例子中的网络而言，LT_o\
    \ < LT_w < LT_i = 2294μs，这个生存时间已经远远超出 eDRAM 的数据维持时间 (45μs)，因此刷新的操作不可避免。\n\n因此，平台的优化可以从两个方向着手：一是，减少数据对片上缓存的需求，使之尽可能小于架构本身的容量，以减少额外的片外访问；二是，减少数据的生存时间，使之尽可能小于\
    \ eDRAM 的数据维持时间，以减少额外的刷新功耗。\n\n### 7.2.2 训练层次优化：数据生存时间感知的训练方法\n\n在 7.2.1 节给定例子的网络中，几乎所有网络层的数据生存时间都远远高于\
    \ eDRAM 的数据维持时间，刷新操作在所难免。图 7.14 是一个典型的 eDRAM 的数据维持时间分布曲线图，其横轴表示数据维持时间，纵轴表示低于给定数据维持时间时，eDRAM\
    \ 中存储单元的错误率。从图中可以看到，对于一个 32KB 的 eDRAM，数据维持时间最短的存储单元通常出现在 45μs 处，对应的错误率大约为 10^-6\
    \ 量级。然而，从曲线的走势来看，在一定范围内适当增加数据维持时间，并不会显著地增加错误率。\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_123_0.png)\n\
    \n因此，可以利用 DNN 的容错能力来重新训练网络使其能承受更高的错误率，以获得更长的“可容忍”的数据维持时间。如图 7.15 所示，RANA 在训练的正向过程中对输入和权重数据加入一个掩膜\
    \ (Layer Mask) 以引入误差。这个掩膜会以一定的错误率对每个比特注入误差。经过反复的训练，如果最终的精度损失可以接受，那么就认为网络可以承受当前的错误率。经试验发现，对于\
    \ AlexNet、VGG、GoogLeNet 和 ResNet 这四种网络，错误率提高到 10^-5 后网络精度仍没有损失，此时对应的“可容忍”的数据维持时间提高到了\
    \ 734μs，因此可以以更低的频率刷新甚至消除刷新操作。\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_124_0.png)\n\
    \n图 7.15 训练层次优化：数据生存时间感知的训练方法\n\n### 7.2.3 调度层次优化：神经网络分层的混合计算模式\n\n一个卷积运算可分成四个层次的循环。如图\
    \ 7.16 所示，分别包含循环 N、R、C、M。N 和 M 分别代表输入与输出特征图的通道数，R、C 分别代表权重的参数。图中展示的是三种典型的计算模式\
    \ Input Dominant (ID)、Output Dominant (OD)、Weight Dominant (WD)，分别用多层循环的形式表示，它们的差别主要体现在内外层循环的交换。我们发现，数据生存时间和片上存储需求与循环顺序，特别是最外层循环极为相关。\n\
    \n在输入、输出和权重这三类数据中，输出数据的生存时间与另两种数据类型完全不同。首先以 ID 为例，与输入、权重这种静态存储在缓存中的数据不同，输出数据会在累加的过程中不断刷新，这种刷新会对\
    \ eDRAM 存储单元重新充电进而恢复之前丢失的电荷。这一过程和周期性刷新操作本质上是一样的。因此，如图 7.16 所示，如果把输出数据作为最外层循环迭代变量，数据生存时间将会非常短。当然，此时必须在片上存下全部的输出数据以避免片外访存。\n\
    \n其次以 OD 为例，将 Loop N 循环放置在最外层，其余层的遍历循环与 ID 一样。这样一来，第 2 层的循环将计算完所有的输出，并且将它们存储在输出缓存中。此时缓存的容量需求如下：\n\
