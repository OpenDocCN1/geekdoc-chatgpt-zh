    每个阵列具有三组 I/O 端口，分别用于左侧、右侧和底部边缘的数据输入输出。输入特征数据加载到左/右边缘的 PE 上，并沿水平方向移动到阵列内部的 PE，而每个
    PE 的输出值沿着相反方向移动到阵列的另一侧边缘。每列的权重总线用于向 16 个 PE 广播权重。


    ### 3. 片上存储系统


    两个 144KB Multi-Bank SRAM 数据缓存（数据缓存 1 和数据缓存 2）用于存储网络层与层之间的中间数据，并支持数据重用。为了支持阵列划分（Array
    Partitioning, AP），每个数据缓存被分成用于 CONV 和 FC 子阵列的两个子缓存。在计算特定层期间，一个子缓存向阵列提供输入数据，另一个子缓存接收来自阵列的输出数据。对于下一层，两个子缓存交换功能。每个缓存中有
    48 个 Bank（内存块），因此最多可以为 PE 阵列并行提供 48 个 16bit 数据。每个 Bank 都以 “乒-乓” 方式工作。通过这种机制，PE
    阵列、片上缓存之间的数据交换将与片上缓存、片外 DRAM 之间的数据预取同时发生，从而实现片外访问延时的部分掩盖，提高计算的整体性能。缓存控制器用于管理片上缓存的数据访问和数据组织。


    一个 1KB 的片内共享权重缓存负责从片外存储器接收权重数据并按计算模式需求转发给两个 16KB 的阵列内局部缓存，计算过程中两个局部缓存用于权重的复用，并为
    2 个 PE 阵列的 16 列 PE 并行提供 16 个权重。


    ### 4. 有限状态控制器


    如图 4.13 所示，Thinker 中的有限状态控制器从三个层次分别配置 Thinker 处理器：PE 阵列、网络层和 PE 单元。其中，PE 阵列的配置参数，简称阵列参数，是一个
    66bit 的字，主要包含 PE 阵列划分参数、批次大小 (Batch Size, BS)、神经网络层数以及网络层参数的基地址；网络层参数用于控制一个特定神经网络层的处理，包含输入数据和权重的内存地址，卷积核尺寸以及输出特征通道数等；PE
    配置字直接控制每个 PE 中的开关功能，从而确定其实际的逻辑功能。


