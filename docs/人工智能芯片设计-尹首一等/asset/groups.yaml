    人工智能芯片计算架构的构建可以利用 ReLU 输出的稀疏性，通过数据压缩来降低芯片面积和减少片外通信带宽。例如，采用简单的游程编码来对一个前16bit 是非零值、后
    31bit 均为 0 的数据进行压缩以后，就可以将激活的通信带宽减少约 52%，并将整个网络计算的通信带宽减少 1/3。除了数据压缩，硬件还可以直接跳过 0
    值的 MAC 操作来降低功耗，提升性能。例如，Eyeriss 就基于这种'
