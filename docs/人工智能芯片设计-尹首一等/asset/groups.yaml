    中的复杂情形。2006 年，Hinton 利用预训练方法缓解了局部最优解问题，将多层感知机的隐藏层推动到了 7 层，神经网络才在真正意义上有了“深度”。


    深度神经网络已经广泛应用于图像分类、目标识别、语音识别、动作识别、场景理解等诸多领域，在有的领域还取得了超过人脑的准确率。深度神经网络按结构可以分为卷积神经网络、全连接神经网络
    (Fully Connected Neural Network, FCN) 和循环神经网络 (Recurrent Neural Network, RNN)。卷积神经网络由卷积层、池化层和全连接层组成，擅长视觉特征提取。FCN
    由多个全连接层组成，通常用于分类。RNN 是一种特殊的神经网络结构，它是根据“人的认知是基于过往的经验和记忆”提出的，也由全连接层组成，但层与层之间具有反馈路径和门控操作，在时序数据处理中表现良好。


    上述三种基本的深度神经网络可以独立使用，例如，独立的卷积神经网络可以用作图像分割的完全卷积网络[2]。同时，这些神经网络也可以组合起来构建更复杂的神经网络。如图
    2.7 所示，AlexNet[3]由 5 层 CNN 和 3 层 FCN 组合而成，可用于图像分类。长期递归卷积网络 (Long-term Recurrent
    Convolution Network, LRCN)[4]由一个 5 层 CNN、3 层 FCN 和 2 层 RNN 级联而成，可用于图像理解。CLDNN[5]由
    2 层 CNN、6 层 FCN 和 2 层 RNN 组成，以实现语音识别。本书将 CNN、FCN 和 RNN 的这些组合定义为混合深度神经网络，简称混合神经网络
    (Hybrid Neural Network, Hybrid-NN)。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_20_0.png)


    图 2.7 混合神经网络的三个例子


    AlexNet 用于图像分类，LRCN 用于图像理解，CLDNN 用于语音识别'
