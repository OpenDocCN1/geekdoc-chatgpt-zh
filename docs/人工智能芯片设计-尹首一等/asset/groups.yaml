    过滤核

    (a) 原始卷积核与卷积核拆解

    1 2 3

    4 5 6

    7 8 9


    原始卷积过程如图 8.6 (a) 所示，将原始核分解为基本核与过滤核。通过将原始核中的全部+1 权重替换为-1 而构成基本核，而将原始核中的全部-1 权重替换为
    0 构成过滤核。继而分别使用分解的两类卷积核进行卷积操作，得到基本输出与过滤输出后，基于下面的公式重塑原始卷积：


    Y = Y_b + A × Y_f (8-1)


    其中，Y 表示 n×m 的原始卷积输出特征向量；Y_b 和 Y_f 分别表示 n×m 的基本输出特征向量和过滤输出特征向量；A 表示对角矩阵 diag(λ₁,λ₂,⋯,λₙ)，其中
    λ₁,λ₂,⋯,λₙ 均为 2。


    通过分解卷积核，可以大量减少计算操作数，并引入稀疏性的过滤核。由于基本核的元素数量等于原始核的元素数量，因此完成一次基卷积所需的操作数等于原始卷积。而对于过滤卷积，由于
    0 权重的引入而减少了操作数。考虑到神经网络的统计特性，各种 BNN 中不同权重的比例分别约占 50%，因此过滤卷积中的操作数减少了约 50%。


    单输入多输出卷积方式：图 8.7 (a) 为一个输入特性图和 N 个输出特征图的二值权重 CNN 卷积示意图，N 个二值卷积核产生 N 个输出特征图，并且假定+1/-1
    权重比例各为 50%。若不采用分解卷积核，计算 N 个输出特征图需要 N 次卷积计算。在卷积核分解架构中，每个卷积核被分解为基本核与过滤核。由于所有基本核是相同的，因此基本卷积输出是相同的。通过复用第一次基卷积结果，剩余的
    N-1 次基卷积计算可被跳过。对于 N 个过滤卷积计算，由于 50%稀疏性的引入，50% 的计算可被减少。因此卷积的数量从 N 减少到 N/2+1，近似将计算减少为
    50%。可通过门控时钟技术跳过 0 值权重对应的计算从而进一步降低能耗。


    多输入多输出卷积方式：如图 8.7 (b) 所示，将卷积核分解架构扩展到更一般性的 M 输入特征图和 N 个输出特征图的情况。与单输入多输出卷积模式相似，考虑到基卷积结果的复用与过滤核
    50% 的稀疏性，可将最初的 N×M 次卷积计算减少到 N×M/2+M，随着 N 的增加可近似将计算减少为 1/2。


    尽管分解卷积核架构减少了 50% 的计算，但仍不能最大限度地消除二值权重 CNN 的冗余计算。并且由于分解卷积核将破坏三值卷积核中的 0 值权重，不能减少计算，因此该方法不能用于三值权重
    CNN 计算。Zheng 等提出了卷积核转换架构，通过将原始卷积核转换为更少的、更稀疏的“基卷积核”而最大限度地减少了计算量，该方法可以同时应用于二值和三值网络，提升了二值、三值权重卷积计算能效[43]。图
    8.8 为卷积核分解方法与卷积核转化方法对比示意图，通过将两个原始卷积核转化为两个基卷积核，计算基卷积结果，并分别通过加、减操作得到两个正确的卷积输出结果。最终在
    SVHN、AlexNet 和 VGG-16 上测试，该方法减少了 43.4%~79.9% 的计算操作。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_144_0.png)


    ![](img/16a61618bbeb2ecae4884725c4086cbe_144_1.png)


    图 8.7 单输入多输出卷积情况和多输入多输出卷积情况（见彩图）


    ![](img/16a61618bbeb2ecae4884725c4086cbe_144_2.png)


    图 8.8 卷积核分解与卷积核转化方法的对比（见彩图）


    卷积核转化架构执行流程为：预训练二值、三值 CNN 模型→基卷积核转化→计算输入与基卷积核的中间卷积结果→重塑输出特征图。其中，基于启发式的迭代搜索算法，提取了所有卷积核中最大重叠的公共因子项，将原始卷积核转换为更少的、更稀疏的卷积核，从而减少了计算量。


    为了探索数据复用性，避免 0 值权重操作，完成输出特征图的重塑，设计了卷积核转化硬件架构，如图 8.9 所示。该架构主要由多个并行的处理单元、片上缓存、卷积核转换控制器以及缓存控制器核外存接口组成。每个处理单元从对应的缓存中读取输入激励，稀疏压缩的权重和索引，以计算基卷积并重塑原输出。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_145_0.png)


    ![](img/16a61618bbeb2ecae4884725c4086cbe_145_1.png)


    图 8.9 卷积核转化硬件架构以及处理单元微架构设计


    对于二值、三值权重 CNN，输入激励相比于权重需要更多位宽，因此采用了输入静态数据流以减少输入访存。在卷积计算时，所需的激励从输入缓存广播到每个 PE 中的输入寄存器，并完成对当前输入通道的全部基卷积计算，基卷积核的计算结果暂存于临时缓存单元。为了更有效地利用基卷积核的稀疏性，采用了与
    SCNN 以及 ESE 类似的稀疏压缩的权重编码形式。同时，架构中的 PE 也被用来重塑原始部分和，对应输出通道的 32 个部分和被同时计算。查找表被用作对临时缓存单元和每个
    PE 中的输入寄存器寻址。查找表首先提供基卷积结果的索引给全局控制端，进而从临时缓存中读取基卷积结果并广播给 32 个 PE 的输入寄存器。同时这些索引也被用来从输出缓存中读取先前累加结果完成卷积重塑。


    最近 BNN 的简单逻辑计算也给设计片内计算新架构带来了新机会。Ando 等设计了基于存内计算的二值、三值神经网络计算芯片 BRein Memory[44]。所有的权重被存在片上
    SRAM 中，通过相连的逻辑电路在 SRAM 中完成并行计算。Liu 等使用 6T-SRAM 完成了 BNN 计算，并将存储单元扩展为 8T 实现了位级 XNOR
    操作[45]。Kim 等则通过卷积核分解方法将 XNOR 计算转化为 NAND 计算，并使用传统 6T-SRAM 完成了 XNOR-Net 的计算，减少了计算量并降低了存内计算的复杂度[42]。


