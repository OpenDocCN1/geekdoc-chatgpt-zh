    ## 第 5 章 人工智能芯片的数据复用


    数据复用，即在计算过程中对同一数据进行重复的利用，是一种常见的减少存储器重复访问的方法。卷积神经网络涵盖了四种基本神经网络层结构中的三种基本层，其未涉及的循环层实际上是带反馈的全连接层，而反馈结构本身的特点是使得相邻两个全连接层之间存在数据相关性，并不会影响数据复用策略。因此，对于数据复用技术的分析，卷积人工智能神经网络具有典型意义。


    进一步地，考虑到卷积层的计算占到卷积神经网络计算总量的 90%以上[1]，其他的神经网络基本层如池化层、全连接层的计算模式与卷积层是类似的，都可以用同样的一组参数描述出来，对卷积层计算的研究可以推广到其他层的计算。本章将以卷积神经网络（CNN）为研究对象，分析人工智能芯片的数据复用技术。


    人工智能芯片通常采用三种数据复用模式：输入数据复用（Input Reuse，IR）、输出数据复用（Output Reuse，OR）和权重数据复用（Weight
    Reuse，WR）。这三种模式在相关文献中也被称为输入固定（Input Stationary，IS）模式、输出固定（Output Stationary，OS）模式和权重固定（Weight
    Stationary，WS）模式。本章将基于神经网络的系统架构分析三类数据复用模式，并指出依据网络差异性而采用混合数据复用模式的必要性。


    ### 5.1 输入数据复用


    由于人工智能芯片内部的存储空间有限，一个卷积层通常需要拆分成更小的单位，才能在计算核心上执行，这一过程等价为对图 3.2 所示的 4 层循环进行“循环分块”。如图
    5.1 (a) 所示，卷积层的输入和输出特征图被分割成尺寸为 Tn×Th×Tl 和 Tm×Tr×Tc 的小块。其中，Th 和 Tl 可以分别由 Th = (Tr-1)S
    + K 和 Tl = (Tc-1)S + K 计算出来，K 和 S 是卷积核的尺寸和扫描步长。因此，对片上缓存和片外 DRAM 的访问次数，可以用下面的公式表示：


    ```

    MA = TI×αi + TO×αo + TW×αw + TPO   (5-1)

    ```


    其中，TI、TO、TW 分别表示当前层的输入、输出、权重总数；αi、αo、αw 是数据复用参数，对应输入、输出、权重在计算过程中的重复访问次数；TPO 是输出数据经过池化操作后的个数，它通常等于
    TO 的 1/S²。


    首先分析输入数据的复用性。图 5.1 (a) 所示为一种基本的 IR 模式，与 Eyeriss [2] 中的数据复用类似，分为 3 个步骤：①计算核心把输入特征图读入局部的输入寄存器；②计算核心充分复用这些输入数据，更新输出缓存中所有相关的输出部分和
    (Partial Sum)；③更新后的输出部分和会重新写回输出缓存。当新的输入数据被读入计算核心时会重复上述 3 个步骤。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_67_0.png)


    ```

    for (r=0;r<R;r+=Tc) // Loop R.

    for (c=0;c<C;c+=Tc) // Loop C.

    for (n=0;n<N;n+=Tn) // Loop N.

    for (m=0;m<M;m+=Tm) // Loop M.

    /*Computation in the core.*/

    for (tm=m;tm<min(m+Tm, M); tm++) // Loop Tm.

