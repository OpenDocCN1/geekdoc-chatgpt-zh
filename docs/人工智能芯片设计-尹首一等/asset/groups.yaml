    ## 6.3.5 复杂网络映射优化结果


    为了评估不同方法映射复杂神经网络的结果，我们从 GoogLeNet[20]和 ResNet-50 中选择了几个典型的 Inception/Residual
    模块。表 6.3 给出了这些测试基准网络的参数。我们把一个经典的层级时间映射方法[4]作为基准方法(图 6.9 中标注为 Base)，然后引入三种超越层级时间映射的方法进行比较。层融合方法[18](图
    6.9 中标注为 FL)在 6.2 节中提到过，它采用跨层分块的策略来减少层与层之间产生的中间数据在片上和片外之间的移动。多处理核心方法[9](图 6.9
    中标注为 MCLP)则将硬件资源划分为多个区域，然后不同区域并行地处理不同的层，以提高计算效率和吞吐率。层聚类并行映射方法[19](简称为 LCP)就是前面介绍的考虑到
    Inception/Residual 等复杂神经网络结构的优化方法。由于各工作实现的人工智能芯片的硬件资源有差异，为了单纯从映射方法的层面进行公平比较，我们统一选用
    Xilinx VC709 (Virtex 690T) FPGA，来作为各种映射方法的硬件平台进行评估。


    表 6.3 测试基准网络参数[20]


    | 基准测试网络 | R | C | N | M | K | S | OPDmax |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | Inc3a | 28 | 28 | 16~192 | 16~128 | 1~5 | 1 | 28.99~583.19 |

    | Inc3b | 28 | 28 | 32~256 | 32~192 | 1~5 | 1 | 54.90~712.28 |

    | Inc4a | 14 | 14 | 16~480 | 16~208 | 1~5 | 1 | 28.70~287.47 |

    | Res2a | 56 | 56 | 64 | 64~256 | 1~3 | 1 | 63.35~510.55 |

    | Res2b | 56 | 56 | 64~256 | 64~256 | 1~3 | 1 | 100.76~510.55 |

    | Res2c | 56 | 56 | 64~256 | 64~256 | 1~3 | 1 | 100.76~510.55 |

    | Res3a | 28 | 28 | 128~256 | 128~512 | 1~3 | 1~2 | 56.62~636.93 |

    | Res4a | 14 | 14 | 256~512 | 256~1024 | 1~3 | 1~2 | 92.66~327.71 |


    图 6.8 是性能比较的结果。为了综合地比较 4 种方法的性能，除了测试单个模块的映射，还测试了连续多个模块 (Inc3a3b、Res2a2b2c) 的合并映射。每个映射的模块都有
    32bit 和 16bit 两种位宽版本。目标硬件平台在执行 32bit 和 16bit 运算的时候可以提供的理论最大 OPD 分别是 128 和 320。我们从表
    6.3 可以看到大部分测试基准的 OPDmax 都超过了 128，因此 32bit 的测试基准倾向于计算受限，相对而言 16bit 的测试基准则有着更加平衡的资源利用。从图
    6.9 可以看到，总体上，四个方法在 16bit 的测试基准上取得的性能更好，后三种方法相对于基准方法都取得了一定的性能提升。MCLP 方法在更多的测试基准上取得了比
    FL 方法更好的效果，这表明了它分区执行思想的优越性。FL 方法在 32bit 测试基准下从没有超越 MCLP 方法，因为它主要针对数据重用进行优化，在计算受限场景效果不明显。LCP
    方法直接针对不同层资源利用倾向的差异性对层进行分类，并且针对 Inception/Residual 等复杂神经网络结构进行了专门优化，因此取得了较大的性能提升。和基准方法对比，最高性能提升达到
    4.03 倍，和其他方法中最好的相比也有 2.00 倍的最高提升。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_100_0.png)


    ![](img/16a61618bbeb2ecae4884725c4086cbe_100_1.png)


    图 6.9 性能比较结果[19]


    LCP 方法在 Res3a 16bit 上取得了 4 倍于基准方法的性能。为了更好地理解为何 LCP 方法取得很好的效果，我们选择 Res3a 16bit
    这个测试基准来进行剖析。图 6.10 显示了 LCP 方法和基准方法在执行 Res3a 16bit 时计算资源和带宽资源利用率随时间变化的曲线。从图中可以看到，基准方法的利用率曲线波动很大，而且在相当长的一段时间内都不足
    20%，说明大量硬件资源在执行过程中被浪费了。这是层级时间映射方法的固有缺点所导致的。首先，Res3a 16bit 中的四个卷积层的 OPDmax 分别等于
    157.3、56.6、636.9 和 181.1，而硬件平台能够为 16bit 运算提供 320 的理论最大 OPD。前两层的 OPDmax 比硬件平台的
    OPD 值低，所以它们更倾向于访存受限，需要更多的带宽，而浪费了计算资源。然后，正由于带宽受限，前两层无法应用较大的展开系数，而在层级时间映射方法下所有层的展开系数又必须是一致的，后两层也必须使用较小的展开系数，这就阻碍了它们充分地利用硬件资源。反之，LCP
    方法的利用率更高而且更稳定。在大部分时间内，计算资源和带宽资源的利用率分别保持在 81.8%和 96.1%，如图 6.10 所示。这需要归功于空间映射机制以及专门针对复杂神经网络的优化。第一，空间映射机制允许不同的层聚类并行地执行，所以它们的资源利用可以互补。第二，不同的层聚类在人工智能芯片上的不同区域执行，所以它们不必使用统一的展开系数，可以采用更合适的设计。这也帮助各个层聚类的执行时间很容易调整得相对平衡，使整体的执行时间最短。在这个例子中，层
    2-2 所在的聚类由于分块粒度问题，才多花了少量时间。因为所有的层聚类同时启动并且在相近的时间内完成，所以硬件资源很少有空置的时候。第三，首层合并机制扩大了层的潜在并行度和数据局部性，片上层间数据传输机制则降低了带宽需求。这些优化手段一起使得更大的展开系数变得可行，也就使得更多的计算资源可以被利用起来。在上述几种因素的共同作用下，LCP
    方法取得了更好的资源利用率和性能。


