    # 3.3.5 混合精度计算


    随着低功耗和性能需求不断提高，神经网络逐渐从过去只支持全精度（32bit浮点）运算向支持 16bit、8bit、4bit 甚至三值化[7]、二值化[8,9]等多种低精度运算扩展。由于神经网络本身具有一定的冗余性，再经过算法研究人员的精心设计，低精度化的神经网络能够在保证准确率不变或者准确率损失很小的前提下，极大地减少计算和存储负担，降低功耗。而且对一些应用来说，降低精度的设计不仅加速了推断（也可能是训练），甚至可能更符合神经形态计算的特征。近期研究成果已经证明，对于深度神经网络的某些层，使用尽可能低的精度（如二值数据-1
    和+1）就足以达到预期效果，同时可以节省大量内存和降低能量消耗。因此，低精度设计已经成为智能计算芯片的一个趋势，在只针对推理应用的芯片中更加明显。


    在低精度化的趋势之下，对于卷积神经网络、全连接神经网络和循环神经网络等网络，其网络各层适宜的精度也不同。如果仍然采用传统的固定位宽的基本计算单元设计，虽然可以极大地简化设计复杂性，但是这样的设计存在灵活性不足的天生缺陷，要么位数不足导致无法接受的错误，要么位数太多导致浪费存储、带宽及功耗。因此，如何灵活而高效地支持不同网络及同一网络内不同部分对于位宽精度的多样化需求，也是智能计算芯片设计的重要挑战之一。


    # 3.4 智能计算平台现状


    智能计算目前常用的平台分为通用处理器、专用处理器和可重构处理器三大类。通用处理器主要包括 CPU 和 GPU，它们都是基于冯·诺依曼体系结构的指令集处理器，受控制流驱动，具有很强的功能灵活性和使用便利性；采用运算与存储分离的结构，为计算机的通用性奠定了基础。因此，迄今为止，以冯·诺依曼体系结构为基础设计的通用处理器仍然主导现代计算芯片的发展。


    应用于智能计算的通用处理器通常采用单指令多数据流（Single Instruction Multiple Data，SIMD）技术集中控制计算单元来达到显著提升计算并行度的目的，非常契合智能计算中张量卷积这样的大规模并行计算应用需求。因此，CPU
    和 GPU 等通用处理平台被广泛用作神经网络硬件加速平台。


    2012 年，人工智能和机器学习领域最权威的学者之一 Andrew Ng（吴恩达）和分布式系统顶级专家 Jeff Dean 联手打造的 Google Brain
    项目，用包含 16000 个 CPU 核的并行计算平台训练超过 10 亿个神经元的深度神经网络，这是当时世界上最大的深度神经网络。与 CPU 相比，GPU
    在应对大规模并行运算时更有优势。通常情况下，GPU 采用与 CPU 协同工作的方式，从算法代码中提取计算密集部'
