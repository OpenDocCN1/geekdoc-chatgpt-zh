    图 6.1 卷积计算过程伪代码及典型分块方法示意\n\n# ## 6.1.2 屋顶线模型\n\n在系统吞吐率优化问题中，计算能力和数据传输是两个核心约束。一个有意义的设计实现或者是计算受限或者是访存受限，也就是说计算资源或者存储和带宽的利用率达到最大（在分配粒度和布局布线等限制下）。屋顶线（Roofline）模型[15]把系统性能和片外访存的关系联系起来，为开发者在合法的设计空间内选择最优设计提供便利。\n\
    \n```\nAttainable Performance = min\\left\\{\\begin{array}{c} \\text{Computational\
    \ Roof} \\\\ \\text{CTC Ratio \\times BW} \\end{array}\\right. (6-1)\n```\n\n\
    式 (6-1) 是在一个特定硬件平台上可以取得的性能（Attainable Performance，单位是 GOP）的表达式。其中计算能力屋顶（Computational\
    \ Roof）表示的是与硬件资源所能提供的最大的计算能力相应的性能。计算访存比（Computation to Communication Ratio，CTC\
    \ Ratio）指的是平均每次片外访存所能支持的计算量，反映了这个设计所利用的数据重用程度，它和带宽（Bandwidth，BW）的乘积则等于在硬件访存带宽约束下的最大计算能力。实际实现的人工智能芯片的性能不可能超过这两个指标中的较小值。\n\
    \n图 6.2 是 Roofline 模型的基本形式。其中，纵轴是可以达到的计算性能，横轴是计算访存比。在带宽屋顶和计算能力屋顶的右下方是合法的设计区域。越靠近上方计算性能越好，而同等性能下越靠近右方数据重用性越好，也就是越节省带宽。因此，图\
    \ 6.2 中两个例子相比，算法 2 比算法 1 的数据重用性更好，因为其更靠近横轴右方。"
