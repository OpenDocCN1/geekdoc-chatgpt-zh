    # 第 7 章 人工智能芯片的存储优化


    神经网络的发展高度依赖海量的数据，因此满足高效能深度学习的数据处理要求是人工智能芯片需要考虑的最重要因素。然而，处理器的存储能力和计算能力差距日益增大，引发了“存储器墙”问题，内存子系统成为芯片整体处理能力提高的瓶颈。即使是卷积神经网络这样的计算密集型（Computation-Intensive）网络，通常也需要大量的存储空间来保存其输入输出特征图和权重数据，如时下流行的
    ResNet-152[1]就需要超过 200MB 的存储空间[2]。因此，在智能计算巨大的访存需求下，仅仅通过并行化来提高计算能力将难以达到预期的整体性能提升，同步提高存储能力才是打破“存储器墙”的关键。


    弥补计算单元和存储器之间的差距，打破“存储器墙”的途径主要包括：①高带宽的数据通信技术，包括利用点对点的串行通信提升传输速度的高速 SerDes 技术，利用无感应、无干扰、速率高、密度大的光信号替代电信号实现互连的光互连技术，在处理器周围堆叠更多存储器件的
    2.5D/3D 堆叠技术，等等。②让数据更靠近运算，即增加片上存储器的容量并使其更靠近计算单元，使得数据计算单元和内存之间的数据移动成本（时间和功耗）显著减少。例如，在处理器和主存之间增加高速缓存，增加嵌入式动态随机存取内存（Embedded
    DRAM, eDRAM）等高密度片上内存，等等。③具备计算能力的新型存储器。直接在存储器内部（或更近）实现计算，这种方法也被称为存内计算（Computing-in-Memory,
    CIM）或近数据计算（Near Data Computing, NDC）。目前，学术界已经有大量关于存内计算技术的研究工作，但由于其本质上属于模拟计算，计算精度受到模拟计算低信噪比的影响，其应用范围局限在对能效比要求极高的场景。本章重点讨论前两种存储技术在人工智能芯片设计应用中的优化技术，暂不涉及存内计算等新型存储器件技术。


    在智能计算过程中，权重、输入、输出特征图以及中间累加结果都需要进行大量的访存操作，如果所有的数据都从片外获取将严重影响计算的吞吐率和能效。例如，AlexNet
    的 MAC 运算总量约为 724MOP，而为了支撑这些运算需要的片外访存量则达到 30 亿次。为此，智能计算架构通常选择图 7.1 所示的多层次存储结构来平衡智能计算访存的大容量需求与高速需求。即在计算单元
    PE 内部采用寄存器文件作为分布式局部存储器，满足计算的即时访存需求；在片内采用全局缓'
