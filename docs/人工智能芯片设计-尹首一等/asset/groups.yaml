    # 图 4.14 计算流示意图


    为了在 PE 阵列上映射混合神经网络，一种直接的方法是采用逐层计算架构，依次调度执行所有神经网络层。但是，以这种逐层方式，计算密集型的卷积层将无法充分利用
    DRAM 带宽，而全连接层和循环层的大量 DRAM 访问将导致 PE 的利用率不足。以 LRCN 网络逐层计算过程为例，来分析运行时的 DRAM 带宽'
  - '[PAGE 56]


    和 PE 利用率变化。如图 4.15 所示，在全连接层和循环层执行阶段，逐层计算方式实现的 PE 利用率仅为 18.75%，卷积层执行阶段的最低带宽利用率仅为
    19.63%。

    平均而言，PE 和内存带宽利用率分别只有 75.68%和 76.96%。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_56_0.png)


    图 4.15 LRCN 每层的 PE 和带宽利用率评估


    这意味着我们可以将不同网络层对计算和存储访问的互补需求相结合，最大

    限度地利用资源。因此，Thinker 提出了一种适用于混合神经网络的多层并行计算

    数据流，其中大部分 PE 分配给计算密集型的卷积层，大部分带宽分配给存储密

    集的全连接层/循环层。Thinker 的 Multi-Bank 片上缓存、分布式 I/O 端口以及不

    同操作的独立计算流使得 PE 阵列可以灵活地划分为四个子阵列，分别处理

    CONV、FC、Pooling 和 RNN 门控操作。图 4.16 (a) 显示了计算 LRCN 网络时的

    阵列划分和多层并行计算数据流。CONV 阵列分配了 15×13 的通用 PE；FC 阵列

    分配了 15×3 的通用 PE。Pooling 和 RNN 门控分别分配了 9 个和 7 个超级 PE。每

    个片上缓存被划分为 33-Bank CONV 缓存和 15-Bank FC 缓存，并且批次大小被设

    置为 15。RNN 中的全连接操作与全连接层共享相同的 FC 阵列，并且其余的 RNN

    门控操作在超级 PE 上执行。在 CONV 阵列中，不同的输出通道被映射到不同的

    列上，可获得 13 次输入数据重用和 15 次权重重用。在 FC 阵列中，多个前向计

    算过程被并行执行，输入数据和权重的重用次数分别为 3 和 15。如图 4.16 (b) 所

