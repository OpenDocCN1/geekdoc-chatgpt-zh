  - "[PAGE 60]\n\nPE 阵列消耗输入特征图中的一列数据点需要 \\( K \\) 个时钟周期。因此，融合数据模式中的所有数据点都应在 \\( K\
    \ \\times (K - S) \\) 个时钟周期内完成加载。给定融合数据模式中的数据量和加载数据所需的时钟周期数，每个时钟周期需要加载的最小数据量为\n\
    \n\\( B_m = \\frac{[K + (A_h^c - 1) \\times S] \\times S}{K \\times (K - S)} \\\
    quad \\text{(4-1)} \\)\n\n这也是 CONV 缓存所需的最小 Bank 数。如果存在多余的 Bank，剩余的 \\( B_{total}\
    \ - A_h^f \\) 个 Bank 将进一步合并为 \\( B_m \\) 个虚拟 Bank。\n\n在 CONV 层中，每个输入特征点可以表示为 \\\
    ( \\bar{p} = I[r][c][\\text{ch}_{\\text{in}}]\\)，其中 \\( 0 \\leqslant r \\leqslant\
    \ R-1\\)， \\( 0 \\leqslant c \\leqslant C-1\\) 且 \\( 0 \\leqslant \\text{ch}_{\\\
    text{in}} \\leqslant \\text{Ch}_{\\text{in}}\\)。为了实现融合数据模式 \\( \\bar{P} \\) 的并行访问，\\\
