    由权重的传输周期数决定。Pooling 和 RNN 门控的处理时间可以隐藏在卷积层或全连接层/循环层的计算周期中。分配给这两个功能的超级 PE 的数量与其操作的数量成比例。最后，同一批次的计算周期数由速度较慢的子阵列决定（第
    14 行）。


    类似地，通过给每层分配整个 PE 阵列，可以获得逐层计算数据流的性能。因此，给定一个特定的神经网络，可以找到最佳的计算数据流（逐层计算或多层并行计算）和相应的阵列划分参数。


