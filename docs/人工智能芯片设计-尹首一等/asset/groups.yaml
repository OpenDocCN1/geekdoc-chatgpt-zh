    \ \\right\\rceil \\times \\left\\lceil \\frac{C}{Tc} \\right\\rceil\\)\n(6-5)\n\
    \n通过复用输入、权重或者输出数据，可以有效地减少相应的访存次数，如下：\n\n\\(\\alpha_{in,reuse} = \\left\\lceil\
    \ \\frac{N}{Tn} \\right\\rceil \\times \\left\\lceil \\frac{R}{Tr} \\right\\rceil\
    \ \\times \\left\\lceil \\frac{C}{Tc} \\right\\rceil\\)\n\n\\(\\alpha_{wght,reuse}\
    \ = \\left\\lceil \\frac{M}{Tm} \\right\\rceil \\times \\left\\lceil \\frac{N}{Tn}\
    \ \\right\\rceil\\)\n\n\\(\\alpha_{out,reuse} = \\left\\lceil \\frac{M}{Tm} \\\
    right\\rceil \\times \\left\\lceil \\frac{R}{Tr} \\right\\rceil \\times \\left\\\
    lceil \\frac{C}{Tc} \\right\\rceil\\)\n(6-6)\n\n然而它们一般是互斥的，即一层神经网络的映射只能选择一种复用方式。\n\
    \n式 (6-4) 中， \\(\\beta_{in}\\)、\\(\\beta_{wght}\\)、\\(\\beta_{out}\\) 分别表示每次传输神经网络的输入、权重、输出数据的量。这些量可以用下面的等式得出：\n\
    \n\\(\\beta_{in} = Tn \\times (S \\times Tr + K - S) \\times (S \\times Tc + K\
    \ - S) \\approx Tn \\times Tr \\times Tc\\)\n\n\\(\\beta_{wght} = Tm \\times Tn\
    \ \\times K \\times K\\)\n\n\\(\\beta_{out} = Tm \\times Tr \\times Tc\\)\n(6-7)\n\
    \n同时， \\(\\beta_{in}\\)、\\(\\beta_{wght}\\)、\\(\\beta_{out}\\) 也表示所需要的各个片上缓存的大小，因此有如下约束：\n\
    \n\\(\\beta_{in} + \\beta_{wght} + \\beta_{out} \\le \\text{Maximum size of on-chip\
    \ buffer}\\)\n(6-8)\n\n根据这些公式，给定一个分块参数 <Tm,Tn,Tr,Tc>，就能得出该设计在屋顶线模型图中的位置，评估它的合法性和优劣。利用屋顶线模型求解最优设计的一个基本方法是：先根据硬件平台的计算资源和带宽资源搭建两条屋顶线，然后遍历所有可能的分块参数，在屋顶线模型图上打点，最后选择屋顶线以内最靠近右上的点(具有最好的性能和最有效的带宽利用)，尝试映射和实现。如果该设计实现失败，则取次优的点，重复这样的操作直到实现成功。对于\
    \ AlexNet 这样的典型神经网络，需要遍历的设计空间中的合法设计点数量相当有限，一般的笔记本电脑都可以在数分钟内完成[4]。\n\n### 6.1.4\
    \ 单层网络映射方法的延伸与扩展\n\n许多工作对上述基本映射模式进行了各种延伸和扩展。例如，将分块应用到更多维度[5]，将全连接层折叠成卷积然后进行类似的分块处理[6]，等等。\n\
    \n将分块应用到更多维度的方法主要是将分块的维度扩展到卷积核内部，也就是说引入了 Tk 参数来对 K 进行分割。类似的还有在引入 Tb 参数对批量大小(Batch\
    \ Size)进行分割的做法。更多的分块参数能增大设计空间，制造更多数据重用的可能，减少由分块参数不能整除网络大小产生“零头”造成的资源浪费，因此一定程度上提高了神经网络映射的性能。当然，这么做的代价是需要更多的时间来搜索最优解。\n\
    \n大部分神经网络映射方法都是针对卷积进行优化，因为在典型的卷积神经网络的正向推断过程中，卷积运算消耗了 90% 的时间[16]。然而，当卷积运算得到优化和加速之后，全连接层的计算时间开始成为瓶颈[6]。如表\
    \ 6.1 所示，在优化前，VGG 的卷积层运算需要占用 96.3% 的时间，而全连接层只占 3.7%。而当卷积被加速后，卷积层的运算时间已经减少到了一半以下，而全连接层则超过了一半。而且，全连接层需要大约\
    \ 4 倍于卷积层的数据存储需求。因此，全连接层的优化也不可忽视。基于这样的考量，研究者提出了一种称为 Caffeine[6]的方法，对全连接层进行优化。\n\
    \n| 参数    | CONV         | POOL   | ReLU   | FCN        |\n|---------|--------------|--------|--------|------------|\n\
    | 运算量/10^7 | 3×10^3(99.5%) | 0.6(0%) | 1.4(0%) | 12.3(0.4%) |\n| 存储量/MB   | 113(19.3%)\
    \   | 0(0%)  | 0(0%)  | 471.6(80.6%) |\n| 采用纯软件方式计算的时间消耗 | 96.3% | 0% | 0% | 3.7%\
    \ |\n| 对卷积层加速后 | 48.7% | 0% | 0% | 51.2% |\n\n在一次正向推断过程中，全连接层的权重值只会被使用一次，因此其数据可重用性非常低。为了解决这个问题，Caffeine\
    \ 引入了批量计算，即一次处理多个输入特征图，这样同一个权重数据可以与多个输入进行乘法运算，其数据可重用性成倍放大。Caffeine 还将全连接层的输入和权重进行折叠重组，形成与卷积一致的格式，这样一来，其后续映射流程就和卷积层一致，也能够使用前面提到的计算引擎，避免了为全连接层额外准备一套设计流程和执行部件带来的软件和硬件开销。而且，Caffeine\
    \ 设计团队还认为，当 Batch 较小的时候(如 Batch=32)，采用权重为中心(Weight-major)的映射方式收益更大[6]。如图 6.3 所示，Caffeine\
    \ 把全连接层的权重数据折叠重组后当成卷积层格式下的输入特征图，而把 Batch 组输入数据当成卷积层格式下的 Batch 组卷积核，然后经过卷积运算，得到通道(Channel)大小为\
    \ Batch 的输出特征图，每个通道都对应于原本的一组全连接层的输出数据。这样一来，全连接层的执行性能也得到了有效的提升，而且大部分映射框架都可以复用卷积层的框架。\n\
    \n![](img/16a61618bbeb2ecae4884725c4086cbe_88_0.png)\n\n图 6.3 Caffeine 对全连接层的映射思路[6]\n\
    \n除了卷积层和全连接层，循环神经网络中的循环层也是一个需要考虑的范畴。在语音识别等循环神经网络应用中，循环层往往会被重复执行多次，其执行时间是整个网络的瓶颈。为了能够兼容这类网络，有工作[14]对循环层也进行有效的优化，提出了一种针对混合神经网络（Hybrid-NN）的优化方法。长短时记忆（LSTM）模型是一种典型的循环神经网络[17]。LSTM\
    \ 模型能够根据很长的依赖界定信息应该被记忆还是遗忘，其主要运算表达式如下：\n\n```\n\\left\\{\\begin{aligned} I_t =\
    \ \\delta(W_{xi}X_t + W_{hi}H_{t-1} + b_{it}) \\\\ F_t = \\delta(W_{xf}X_t + W_{hf}H_{t-1}\
    \ + b_{ft}) \\\\ O_t = \\delta(W_{xo}X_t + W_{ho}H_{t-1} + b_{ot}) \\\\ G_t =\
    \ \\delta(W_{xg}X_t + W_{hg}H_{t-1} + b_{gt}) \\\\ C_t = F_t \\times C_{t-1} +\
    \ I_t \\times G_t \\\\ H_t = O_t \\times \\delta(C_t) \\end{aligned}\\right. \\\
    quad (6-9)\n```\n\n其中，在第 \\( t \\) 个迭代周期，\\( I_t \\)、\\( F_t \\) 和 \\( O_t \\\
    ) 分别表示输入门、遗忘门和输出门；\\( G_t \\)、\\( C_t \\) 和 \\( H_t \\) 分别表示中间状态、细胞状态和隐藏状态，这些状态用数据向量来表示；\\\
    ( X_t \\) 是相应的输入数据；\\( W_{xi} \\)、\\( W_{xf} \\)、\\( W_{xo} \\) 和 \\( W_{xg} \\\
    ) 则是相应的权重矩阵；\\( b_{it} \\)、\\( b_{ft} \\)、\\( b_{ot} \\) 和 \\( b_{gt} \\) 则是偏移量；\\\
    ( \\delta(\\cdot) \\) 表示非线性操作，如 Sigmoid 函数和 tanh 函数。可以看到，\\( I_t \\)、\\( F_t \\\
    )、\\( O_t \\) 和 \\( G_t \\) 主要是通过矩阵乘法得出，而 \\( C_t \\) 和 \\( H_t \\) 则是通过向量对应元素相乘得出，这些操作都可以转化成全连接操作。再通过引入批量计算，前面提到的用于卷积和全连接层的优化手段可以同样应用于循环层。\n\
    \n### 6.1.5 单层网络映射方法的缺点\n\n需要指出的是，对于多层网络，如果用单层映射的方法，那么层与层之间通常是串行执行的，而且计算引擎的组织结构在层切换的时候不会发生变化，也就是说\
    \ Tm 和 Tn 必须固定，这是因为传统的人工智能芯片如果要实现在运行中动态重构其计算引擎的组织结构，往往会产生巨大的设计代价和硬件开销[4]。我们称这种单层映射并串行执行多层的映射方法为层级时间映射（Layer-Level\
    \ Temporal Mapping）方法。这种方法的缺点在于，当层与层之间的网络形状差异较大的时候，所有层都不得不采用同样的 Tm 和 Tn，这将极大地限制设计空间，容易造成计算资源的浪费。同样，层与层之间的带宽需求差异较大时，串行执行也会造成带宽的浪费。有一些方法为了解决这种网络分块不能和计算资源足够吻合产生资源浪费的问题，对计算资源也进行分块，然后同时映射不同的网络分块并行地执行[9]。但是这些方法主要是针对\
    \ AlexNet 等层数和分支较少的简单卷积神经网络，而对于更加复杂的神经网络，不能做到足够的优化，这会在 6.3 节具体讨论。\n\n## 6.2 级联网络映射方法\n\
    \n神经网络的数据局部性不仅仅体现在每一层内部，还存在于层与层之间，即前一层的输出是后一层的输入。层级时间映射方法是逐层处理，把前一层的输出保存到片外，然后执行下一层的时候再从片外读取进来，这就造成了大量的数据传输。之所以不能把层与层之间的中间数据全部保存在片上，是因为典型的计算芯片往往缺少足够大的片上存储空间。例如，Eyeriss\
    \ 芯片的片上 SRAM 大小只有 181.5KB[1]，GANAX 芯片的缓存总大小也只有 135KB[2]，而 VGG19(16bit) 的第一层卷积的输出数据就达到了\
    \ 6.42MB。再加上权重数据也需要缓存、双缓存机制需要额外开销等因素，将该层全部输出数据保存在片上是无法实现的。另外，要执行下一层的单个或者一部分计算也并非需要上一层的全部结果，因此可以通过层融合分块的方法[18]，在片上缓存的能力范围内实现跨层执行，以减少片外数据传输量。\n\
    \n图 6.4 是一个融合了两个卷积层的例子。可以看到，卷积核都是 3×3×N，滑窗步长为 1，第一层的输入是 7×7×N 的大小，通过 M 组卷积核，得到\
    \ 5×5×M 的输出，也就是第二层的输入，再通过 P 组卷积核，得到 3×3×N 的输出。在分块方面，第一层的输入是分块成 5×5×N，输出则是 3×3×M，第二层的输出则是\
    \ 1×1×P。每一层的输入的相邻两个分块之间重叠的部分可以通过缓存不再重复读入或者计算。\n\n算法 6.1 是层融合神经网络的伪代码。假设融合的神经网络有\
    \ 5 层，那么这 5 层各自占用硬件计算阵列上的一个分区进行计算，各自拥有独立的分块参数（如 Tm、Tn 等）。\n\n需要指出的是，这种方法有许多限制，那就是除了最后一层以外，所有层的\
    \ Tn 都必须等于 N，否则前一层的输出只是不完整的和，不能参与下一层的计算。同时每一层的 Tm 都必须等于前一层的 Tn，这样才能保证数据的生产和消费同步起来。用公式可以表示为\n\
    \nTn_{i+1} = Tm_i,  Tn_i = N_i,  i = 1, 2, ..., k - 1  (6-10)\n\n其中，k 是融合的层数。这样的约束显然会极大地减小设计空间，Tn\
    \ = N 意味着需要将输入的通道方向在片上一次全部处理，往往会导致很大的片上缓存需求。如果要改善这一点，一个办法是改变数据重用方式[19]。具体地说，就是将倒数第二层的数据重用方式设为输出重用（每个输出一直在片上停留直到\
    \ N 个相应的乘积被累加完毕再输出），而最后一层的数据重用方式设为输入重用（每个输入保持在片上直到全部 M 组权重全部与之相乘过）。这样一来，倒数第二层就不需要满足\
    \ Tn_i = N_i 的约束。为了保持同步性，只需要满足 N_{k-1}/Tn_{k-1} × K_{k-1}^2 = M_k/Tm_k × K_k^2\
    \ 即可。\n\n新的约束可以调整的参数更多，当融合的层数比较少的时候（一般也只会融合 2 ~ 5 层），设计空间可以显著地增大。\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_91_0.png)\n\
    \n图 6.4 融合两个卷积层的例子[14]\n\n```\n算法 6.1\nFused<Tm1, ..., Tm5, Tn1, ..., Tn5, R,\
    \ C>() :\nfor (row=0; row<R; row++)\nfor (col=0; col<C; col++)\n    calcparams\
    \ (row, col)\n    load(in1, row_t, col_t, inH_t, inW_t)\n```\n"
