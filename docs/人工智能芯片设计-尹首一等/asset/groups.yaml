    # 内容简介


    本书介绍了人工智能芯片相关的基础领域知识，分析了人工智能处理面临的挑战，由此引出全书的重点：人工智能芯片的架构设计、数据复用、网络映射、存储优化以及软硬件协同设计技术等领域前沿技术。书中还讨论了最新研究成果，并辅以实验数据进行比较分析，最后展望了人工智能芯片技术的发展方向。


    本书适合人工智能芯片设计相关领域和对该领域感兴趣的读者阅读，也适合电子科学与技术专业的教师和学生参考。


