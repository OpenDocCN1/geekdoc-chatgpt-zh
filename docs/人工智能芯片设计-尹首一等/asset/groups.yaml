    PE 阵列提供数据。系统整体执行由有限状态控制器 (Finite-state Controller) 控制，通过可配置的 I/O 和解码器单元 (Configurable
    I/O & Decoder) 加载权重和配置信息。一个 1KB 共享权重缓存 (Weight Buffer) 和两个 16KB 本地缓存 (Local Buffer)
    用来为 PE 阵列准备权重数据。


