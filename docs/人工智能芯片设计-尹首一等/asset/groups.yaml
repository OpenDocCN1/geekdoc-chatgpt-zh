    如图 4.10 上半部所示，当权重数据的位宽小于 8bit 时，来自不同卷积核或神经元的两个权重被拼接为一个 16bit 权重。高 8bit 部分和低 8bit
    部分分别在两个乘法器上与相同的 16bit 输入数据相乘。每个乘法器的结果都表示为一个 25bit 字，其中包含一个保留位。然后将两个 25bit 结果拼接成一个
    50bit 字，此时，配置字 s11 为 0，选通拼接结果输出。在此模式下，由于两个操作在两个独立的乘法器上执行，输入数据中不需要保护间隔 (Guard Band)。与斐灵思的
    INT8 优化方法[19]中需要至少 9bit 保护间隔来分离两个 8bit 乘法结果的设计相比，Thinker 的 MAC 设计在执行 8bit 乘法时具有更高的效率。


    如图 4.10 下半部所示，当权重位宽大于 8bit 时，这两个乘法器组合为一个 16x16bit 乘法器。如图红线框中，来自两个乘法器的结果被送到移位和加法单元。将结果的高
    25bit 移位 8bit，然后与低 25bit 的部分相加。此时配置字 s11 为 1，选通移位相加结果输出。与 ENVISION 相比，Thinker
    中的乘法器全部用于 8bit 模式或 16bit 模式，具有更高的资源利用率。


