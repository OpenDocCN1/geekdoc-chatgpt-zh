    \ (由其所包含的层特征向量的方差推导出来)，则将它分解成两个类；如果两个类的距离过近，就将它们合并成一个类。其中涉及的各个阈值都是事先设定的。这样的迭代更新过程会持续到所有的类中心在一次迭代内保持不动，或者迭代次数达到预先规定的最大值为止。\n\
