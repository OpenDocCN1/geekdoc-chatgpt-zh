    人工智能芯片计算架构的构建可以利用 ReLU 输出的稀疏性，通过数据压缩来降低芯片面积和减少片外通信带宽。例如，采用简单的游程编码来对一个前16bit为非零值、后
    31bit 均为 0 的数据进行压缩以后，就可以将激活的通信带宽减少约 52%，并将整个网络计算的通信带宽减少 1/3。除了数据压缩，硬件还可以直接跳过 0
    值的 MAC 操作来降低功耗，提升性能。例如，Eyeriss 就基于这种方法，在以 AlexNet 为基准测试集的计算中获得了 45% 的 PE 功耗节省[12]。而在一组用于图像分类的
    DNN 上的实验结果表明，CNV[13]仅通过跳过 0 值操作数乘法这一项技术，就获得了最高 55%、最低 24%、平均 37%的性能加速，同时运算精度还没有任何损失。Shi
    等[11]基于这种方法，在表 8.1 列举的几种经典网络上获得了最高 8.11 倍、最低 1.39 倍、平均 3.49 倍的性能提升。


    此外，对绝对值较小的激活值进行修剪，还可以进一步提升激活输出的稀疏度。对这种稀疏性的利用同样可以使得人工智能芯片获得性能的提升和功耗的降低。例如，Minerva[14]就通过这种小激活值剪枝的方法，在
    MNIST、Forest、Reuters、WebKB 和 20NG 这五个数据集上获得了平均 50%的功耗节省。


    #### 8.2.2 网络剪枝


    深度学习模型因其稀疏性或过拟合倾向，其网络中的大量权重都是冗余的，完全可以被裁剪为结构更为精简的模型，这个精简网络模型的过程就称为网络剪枝。剪枝方法通常分为结构化剪枝[15,16]和非结构化剪枝两种。


    非结构化剪枝也称为细粒度剪枝，它是针对网络中的权重逐个进行判定，逐个进行剪枝。结构化剪枝则是一种粗粒度剪枝方法，它每次针对网络中的一组符合某种结构化特征的权重进行判定，按组进行剪枝。这些权重组可以是相邻的一组权重，也可以是卷积核的整行、整列、整个通道甚至整个卷积核。然而，使用的剪枝粒度越大往往导致精度损失也会越大[17]。结构化剪枝的好处在于：①剪枝以后的模型仍然可以很好地部署在
    SIMD 等通用并行架构平台上运行[18]，而不像非结构化剪枝那样，必须依赖特定算法库或者专门定制的硬件架构才能完成运算；②在运算过程中，它是按组访问权重，每组权重只需要提供一次位置信号，而处理非结构化剪枝模型则需要针对每个权重单独提供位置信号，因此，结构化剪枝后的模型访存代价更低。


    早期的网络剪枝方法通常都是减少权重数量。例如，1990 年，LeCun 等在 Optimal brain damage 一文[19]中提出根据每个权重对训练损失的影响，即权重显著性，来确定应该被去除的权重，然后对剩余权重进行精调，再重复该过程直到权重总量降低到期望的程度，并且网络精度符合预期为止。又如，2015
    年，Han 等[20]指出对于大规模的 DNN 来说，计算每个权重的显著性作为度量是非常困难的。因此，他们基于权重的大小进行剪枝，一轮剪枝后再对模型进行精调以恢复精度。根据他们的统计发现，不精调权重，大约只有
    50%的权重可以被修剪；而通过精调，超过 80%的权重都可以被修剪。将这种方法应用于 AlexNet，可以减少 89%左右的权重量和 67%左右的 MAC
    操作。


    上述方法存在的问题在于：既然网络剪枝的根本目的是降低计算的能耗，而 DNN 运算的能耗通常基于运算需要从内存层次结构中搬移数据的总量、MAC 操作的数量以及数据稀疏性这几个指标来评估，那么它与权重的数量并没有直接的关联。例如，在
    AlexNet 中，全连接层的权重数量比卷积层多很多，但是卷积层的计算能耗远高于全连接层。因此，用能耗指标直接驱动权重的修剪可以达到更好的效果[21]。


    对于采用矩阵-向量乘法形式的 DNN 运算，例如，只针对单个特征输入向量的全连接层运算，确定用于存储稀疏权重矩阵压缩格式对于能效非常重要。压缩可以按行或列顺序进行。通常，稀疏矩阵向量乘法都采用如图
    8.5(a) 所示的压缩稀疏行（Compressed Sparse Row，CSR）格式。然而，基于 CSR 格式，虽然权重矩阵中的行是稀疏的，在运算时只需要使用输入特征向量的一个子集，但是也需要每次都完整读取整个输入特征向量。这样多次反复读取输入特征向量将显著增加运算的访存开销。如果采用如图
    8.5(b) 所示的压缩稀疏列（Compressed Sparse Column，CSC）格式，则对于权重矩阵中的每一列，只需要读取输入向量的一个元素，但是输出向量则需要每次更新[22]。因此，如果输出向量的模小于输入向量的模，或者在
    CNN 的运算中，卷积核的数量没有明显大于卷积核中权重的数量时，采用 CSC 格式需要的访存量将低于 CSR 需要的访存量。而且，现实应用通常都符合上述这两种情况，因此
    CSC 也是一种有效的稀疏 DNN 处理格式。


