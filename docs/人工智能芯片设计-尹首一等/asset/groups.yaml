    虽然通用硬件平台通常都只提供 8bit、16bit 和/或 32bit 操作支持，但 DNN 的最小位宽可能会更低。例如，AlexNet 的不同层的权重和激活值位宽可以量化到
    4～9bit，而不会对网络精度产生显著影响[5,6]。针对这种情况，可以设计专门的硬件来提高吞吐量或降低能耗。Judd 等就采用操作的时钟周期数与位宽成正比的位串行设计，并对不同网络层采用不同量化位宽，相比于所有层都采用
    16bit 量化位宽，将整体运算性能提高了 2.24 倍[5]。此外，在较低的量化位宽下，通过优化，不仅可以使得电路的开关活动下降，而且关键路径也会变短，也可以促进能耗的节省。例如，鲁汶大学设计的低功耗
    CNN 处理器[8]在对 AlexNet 第 2 层进行的基准测试中，将输入数据和权重数据都量化到 7bit，与全精度 16bit 运算相比，获得了 48%的能耗节省。


    #### 8.1.2 非线性量化


    研究表明，权重值和激活值的分布通常是不均匀的[7,8]，因此与量化间隔均匀的线性量化方法相比，采用非线性量化可以使权重数据和激活数据在各量化级别上的分布更加均匀，每个级别的使用效率更高，量化误差更小，更有利于保证网络精度。


    非线性量化方法主要有两种，对数据域量化和权重共享，其中权重共享也称为学习量化。


    对数据域量化方法如图 8.4 所示，是指根据对数分布函数确定量化级别的方法。在对数据域量化方法中，以 2 为底的对数量化方法不仅可以将乘法运算简化为移位运算[3,8]，降低运算代价，而且还可以显著降低量化带来的精度损失。例如，Lognet[1]设计团队分别采用线性量化和
    2 为底的对数量化方法对 VGG-16 的所有网络层中的权重数据进行 4bit 量化，在不对量化网络进行重训的情况下，与原始的 32bit 浮点数据模型相比，线性量化方法带来的精度损失为
    89.3%(比 89.8%降低了 0.5 个百分点)，对数量化方法则将精度损失降低 4.6%(从 89.8%降低到 85.2%)。目前还出现了一些优化的对数域量化方法，例如，增量网络量化[10](Incremental
    Network Quantization, INQ)通过将大、小权重值划分为不同的组，然后对权重进行迭代量化和再训练，可以进一步降低网络精度损失。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_136_0.png)


    图 8.4 非线性量化[1-2]


    权重共享量化即通过某种映射方式使得多个权重共享一个值，以减少权重值的数量，这样就可以用更低位宽的索引值来量化权重。例如，使用哈希函数对权重进行分组，并用哈希值来表示每个组的权重数据[11]；或者通过
    K-means 算法对权重进行自动聚类[2]。对于这类方法，如果权重索引值小于权重本身的位宽，这种方法就可以降低权重的访存代价。


    ### 8.2 稀疏化神经网络及其架构设计


    除了在 8.1 节中提到的减少每个操作或操作数(权重/激活)的大小之外，还有大量关于减少操作数和模型大小方法的研究。这些技术大致分为利用激活稀疏性、网络剪枝和压缩网络架构三类。


    #### 8.2.1 利用激活稀疏性


    前面 2.2.2 节介绍过，激活函数是人工神经元细胞体中对所有输入信号进行加权和之后的非线性映射，它能够极大地增强网络的学习能力和表达能力，是神经元中非常重要的组成部分。在常用的激活函数中，ReLU
    通过将所有为负值的输入信号加权和设置为零，来模拟生物神经的开关阈值状态，因此其输出都非常稀疏。Shi 等[11]统计了三种常用 DNN 中 ReLU 的输出稀疏性，包括基于
    MNIST 数据集测试的 LeNet 结果、基于 Cifar10 数据集测试的 AlexNet 结果（即表 8.1 中的 AlexNetC）、基于 ImageNet
    数据集测试的 AlexNet 结果（即表 8.1 中的 AlexNetI）和基于 ImageNet 测试的 GoogLeNet 结果。其中，每个网络都训练了
    40 期（epoch），在每期结束时记录所有层的稀疏度，得到表 8.1 的统计结果。表中，参数 C 表示测试输入特征图数，Hin 和 Win 分别表示输入图形的高度和宽度，K
