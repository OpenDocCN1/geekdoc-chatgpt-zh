    \ |\n| Layer-A (res4a_branch1) | M=1024, N=256, R=C=14, K=1, S=2 |\n| Layer-B\
    \ (vgg_conv9) | M=512, N=256, R=C=28, K=3, S=1 |\n\n图 7.12 验证平台配置参数\n\n在确定优化方向前，先以残差网络中的\
