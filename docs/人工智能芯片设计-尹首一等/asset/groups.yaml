    随着神经网络的发展，混合神经网络在认知任务上表现出很大的优势，并且变得越来越重要[6,7]。目前比较常用的混合神经网络结构包括 LeNet[8]、AlexNet、VGGNet[9]、GoogLeNet[10]、ResNet[11]等，它们分别针对不同的问题具有非常重要的意义，并在深度神经网络的发展历程中起到了重要的推动作用。下面选取几种典型的结构加以介绍。


    LeNet 诞生于 1994 年，由 Yann LeCun 提出，是最早应用于数字识别的卷积神经网络，并在美国银行中得到成功推广，对神经网络的实用化起到了重要的促进作用。其网络结构非常简单，如图
    2.8 所示，由 2 个卷积层和 2 个全连接层组成。LeNet 的主要贡献是提出了局部感受野的概念，即卷积神经网络中每一层输出特征图上的像素点在原始图像上映射的区域大小。基于这一概念，卷积神经网络每一层参与某个卷积核运算的只是特征图的一部分，不需要像之前的网络那样，每一层都必须对整个特征图进行计算，显著减少了每一层神经网络的计算量，提高了计算效率。


    ![](img/16a61618bbeb2ecae4884725c4086cbe_21_0.png)


    图 2.8 LeNet 结构示意图


    AlexNet 是 2012 年由 Krizhevsky 等提出的一种卷积神经网络[3]，其网络结构如图 2.9 所示，由 5 个卷积层、3 个全连接层以及
    3 个池化层组成。它用小卷积叠加来替换单个的大卷积，并首次成功地将 ReLU 作为激活函数应用于深度神经网络，证明了 ReLU 的效果在较深的网络中强于 Sigmoid
    函数，解决了应用 Sigmoid 作为激活函数所遇到的梯度弥散问题。此外，其深度也比 LeNet 更深，具有更强的刻画能力。AlexNet 在近年来机器视觉领域最受关注、最具权威的学术竞赛之一——ILSVRC
    (ImageNet Large Scale Visual Recognition Challenge) 获得冠军。经过测试，AlexNet 的识别精度达到了
    84.6%，这给学术界带来了深刻的影响，更加点燃了人们对神经网络的研究热情。


    随着人工神经网络的进一步发展，神经网络的结构也在不断演进。在 AlexNet 之后，为了提升神经网络的识别精度，主要有四个改进和突破方向(图 2.10)：增加网络深度、减小网络中卷积核大小和增强卷积核功能、前两者结合并引入残差网络进行收敛加速、增加新的功能单元。'
