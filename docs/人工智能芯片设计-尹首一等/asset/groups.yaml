    \ < LT_w < LT_i = 2294μs，这个生存时间已经远远超出 eDRAM 的数据维持时间 (45μs)，因此刷新的操作不可避免。\n\n因此，平台的优化可以从两个方向着手：一是，减少数据对片上缓存的需求，使之尽可能小于架构本身的容量，以减少额外的片外访问；二是，减少数据的生存时间，使之尽可能小于\
    \ eDRAM 的数据维持时间，以减少额外的刷新功耗。\n\n### 7.2.2 训练层次优化：数据生存时间感知的训练方法\n\n在 7.2.1 节给定例子的网络中，几乎所有网络层的数据生存时间都远远高于\
    \ eDRAM 的数据维持时间，刷新操作在所难免。图 7.14 是一个典型的 eDRAM 的数据维持时间分布曲线图，其横轴表示数据维持时间，纵轴表示低于给定数据维持时间时，eDRAM\
    \ 中存储单元的错误率。从图中可以看到，对于一个 32KB 的 eDRAM，数据维持时间最短的存储单元通常出现在 45μs 处，对应的错误率大约为 10^-6\
