    \n```\ny = \\varphi(Wx + b) \\quad (3-1)\n```\n\n其中，\\( x \\) 表示输入特征向量；\\( W \\\
    ) 表示权重矩阵；\\( b \\) 表示偏置；\\( \\varphi \\) 表示激活函数；\\( y \\) 表示输出结果。\n\n池化层也称为下采样层，其池化类型包括最大池化（MAX\
    \ POOL）和平均池化（AVG POOL）两种，池化层通过在感受野进行相应的池化操作来对图像进行向下采样。其中，最大池化是将待处理的特征图中感受野内邻近的\
    \ \\( n \\times n \\) 个值取一个最大的作为输出值。经过这种运算后的特征图像可以有效地减轻旋转、平移或者缩放影响。平均池化将上述求最大值的运算改为求均值运算。图\
    \ 3.3 给出了最大池化和平均池化的计算模型，该例中的感受野均为 \\( 2 \\times 2 \\)。\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_27_0.png)\n\
    \n## 图 3.3 池化计算模型\n\n递归神经网络会对前面的信息进行记忆并应用于当前输出的计算中，即隐藏层的输入不仅包括输入层的输出还包括上一时刻隐藏层的输出。递归层的计算公式如下：\n\
    \n```\n\\( h_t = f(W_{hx}x_t + W_{hh}h_{t-1}) \\quad (3-2) \\)\n```\n\n```\n\\\
    ( y_t = g(W_{hy}h_t) \\quad (3-3) \\)\n```\n\n其中，t 表示时间节点；x 和 h 分别表示输入特征向量和隐藏状态向量；y\
    \ 表示输出向量；W_hx、W_hh、W_hy 分别表示输入层到隐藏层、隐藏层到隐藏层以及隐藏层到输出层的权重矩阵；f 表示隐藏层函数；g 表示输出函数；f\
    \ 和 g 可以是同一个函数。\n\n## 3.2 基本网络层的计算特点\n\n从数学模型分析，神经网络基本层主要具有以下特点。\n\n第一，网络进行的基本运算包含乘累加、非线性运算、池化运算等基本操作。对于任意\
    \ M×N 维的权重矩阵和 N×1 维的输入特征向量，在全连接层和递归层所需的乘累加操作的计算量与其他非线性操作的计算量的比值大约为 N:1。因此，乚累加运算的高效执行对于神经网络的计算具有重要意义。\n\
    \n第二，卷积层以三维卷积核作为基本滑动窗口，以步长 S 在输入特征图上滑动，分别与窗口内的三维输入特征子矩阵进行三维卷积运算，使得输入特征图上大量数据需要多次重复参与运算，而且参与运算的时间不一定连续，因此神经网络不仅计算量大，而且访存操作量也很大，控制则比较简单。以\
    \ 2012 年 ImageNet 大规模物体识别挑战赛 (ImageNet Large Scale Visual Recognition Challenge,\
    \ ILSVRC) 冠军网络 AlexNet[2]为例，其计算量最大的卷积层达到 448MOP(百万次操作 (Million Operation, MOP))，计算量最小的卷积层也达到\
    \ 150MOP。而访存量最大的卷积层达到 2MB 以上，访存量最小的卷积层也接近 1MB。\n\n第三，神经网络数据结构与底层硬件存储结构之间存在巨大差异，前者到后者的映射所带来的能效损耗成为智能计算芯片架构设计面临的重要挑战。在深度神经网络中，卷积层的输入数据和权重数据都是一组三维张量，按卷积核大小的三维数据结构和卷积滑动步长顺序组织变量参与运算。然而硬件存储器一般采用一维线性排列的基本单元组成，因此，卷积层数据最终在存储器上都将转换成一维的线性存储模型进行存储，而且一维存储模型要求访存严格按照地址顺序，从头至尾进行查找访问。这种神经网络数据结构与硬件存储结构的差异造成内存访问\
    \ 50%以上的微操作都是空操作，能耗损失较大。而且，每次只能对一个存储单元进行操作，导致神经网络的并行性难以发挥，限制了运算性能的提升。\n\n第四，不同类型的神经网络基本层具有不同的计算特点，呈现多样化特征。以\
    \ 2012 年 ILSVRC 竞赛冠军网络 AlexNet 为例，它由 5 个卷积层、3 个全连接层和 3 个池化层堆叠而成。表 3.1 统计了其各层的计算参数(单位：像素)、数据量以及计算量(单位：MOP)，其中各卷积层的计算量均高达几百兆次操作；全连接层计算量相对较小，为几兆到几十兆次操作，但数据量却很大，其中以权重数据量为甚，高达几十兆字节。此外，各层计算参数如卷积核大小、步长、输入输出特征图尺寸的变化多样。\n\
    \n| 层类型 | 核尺寸 | 步长 | 输入图尺寸 | 输出图尺寸 | 输入数据量 | 输出数据量 | 权重量 | 计算量 |\n|---|---|---|---|---|---|---|---|---|\n\
    | CONV1 | 11 | 4 | (227,3) | (55,96) | 309KB | 581KB | 0.07MB | 211MOP |\n| POOL1\
    \ | 3 | 2 | (55,96) | (27,96) | 581KB | 140KB | — | — |\n| CONV2 | 5 | 1 | (27,96)\
    \ | (27,256) | 140KB | 373KB | 0.6MB | 448MOP |\n| POOL2 | 3 | 2 | (27,256) |\
    \ (13,256) | 373KB | 87KB | — | — |\n| CONV3 | 3 | 1 | (13,256) | (13,384) | 87KB\
    \ | 130KB | 1.8MB | 299MOP |\n| CONV4 | 3 | 1 | (13,384) | (13,384) | 130KB |\
    \ 130KB | 1.3MB | 224MOP |\n| CONV5 | 3 | 1 | (13,384) | (13,256) | 130KB | 87KB\
    \ | 0.9MB | 150MOP |\n| POOL3 | 3 | 2 | (13,256) | (6,256) | 87KB | 18KB | — |\
    \ — |\n| FC1 | 1 | 1 | (1,9216) | (1,4096) | 18KB | 8KB | 75.5MB | 75MOP |\n|\
    \ FC2 | 1 | 1 | (1,4096) | (1,4096) | 8KB | 8KB | 33.6MB | 34MOP |\n| FC3 | 1\
    \ | 1 | (1,4096) | (1,1000) | 8KB | 2KB | 8.2MB | 8MOP |\n| TOTAL | — | — | —\
    \ | — | 1.9MB | 1.6MB | 121.9MB | 724MOP |\n\n图 3.4 也统计了卷积层、全连接层和递归层的计算量和参数量。从图中可以看到卷积层以计算为主，计算量可以达到\
    \ 100MOP 以上，参数访存操作量相对较小，一般在 50MOP 以内，而全连接层和递归层则以参数访存操作为主，能达到 100MOP。\n\n![](img/16a61618bbeb2ecae4884725c4086cbe_29_0.png)\n\
    \n## 3.3 智能计算的挑战现状分析\n\n基于网络基本层的特点，从神经网络整体以及不同神经网络之间的差异着手，可以总结出智能计算所面临的挑战。\n\n\
    ### 3.3.1 访存能力\n\n目前的深度神经网络类智能计算高度依赖海量的数据，然而运算单元与内存之间的性能差距越来越大，内存子系统已经成为芯片整体处理能力提高的障碍，也就是通常所说的“内存墙”。而神经网络的数据密集型工作负载，需要大量的存储和各层次存储器间的数据搬移，导致“内存墙”问题更加突出。因此，如何缓解计算单元和存储器之间的差距，已经成为目前学术界和工业界无法回避的主要挑战。\n\
    \n进一步地，为了在智能任务中获得足够高的精度，神经网络需要大量的网络层，而且每一层的数据访问量都很大。例如，卷积层需要大量多通道的卷积核，再加上卷积层内滑窗式的卷积运算使得相同位置的数据需要多次重复参与运算，且参与运算的时间不连续，导致访存量激增，而全连接层的权重矩阵尺寸与输入特征图尺寸相同，需要的数据访问量也很大。AlexNet拥有的参数量达到6000万个，约228MB；VGG16拥有1.3亿个参数，约527MOP；而Google\
    \ NMT神经网络含有37亿个参数，约13GB。\n\n如此巨大的参数量不仅需要巨大的存储容量，而且必须进行高效访问。因此，对内存数量、访存带宽和内存管理方法都有很高要求，这些对于智能计算芯片来说都是巨大挑战。\n\
    \n### 3.3.2 功耗控制\n\n在智能计算过程中，由于参数量过于庞大，拥有有限空间的片上静态随机存取存储器(Static Random Access\
    \ Memory，SRAM)(以几百KB为例)无法全部存储，绝大部分数据被存入片外动态随机存取存储器(Dynamic Random Access Memory，DRAM)，造成了频繁的存储器访问(简称访存)。相关研究结果表明，神经网络中数据访存造成的功耗甚至超过了计算[4]。表3.2展示了商用65nm制程下，不同级别的数据访存操作相对于一个乚累加操作的相对功耗[4]。其中，最靠近计算单元的局部寄存器(Register\
    \ File，RF)的功耗最低，与乚累加操作相当，而最远的片外DRAM的功耗则高达乚累加操作的200倍。因此，理论上，让数据尽可能多地在靠近计算单元的地方停留并被多次重用，才能减少数据访存的功耗。当然，各级存储空间会受到成本和面积的约束，这就需要进行权衡折中，精心设计智能计算芯片的硬件架构和数据流。因此，如何解决大规模数据访存带来的功耗问题是智能计算需要解决的重点和难点。\n\
    \n表 3.2 在商用 65nm 制程下，各种级别的数据访存操作相对于一个乚累加操作的相对功耗[4]\n\n| 功耗类型 | DRAM | 全局缓存 (>100KB)\
    \ | 阵列(处理单元 (Processing Element, PE) 间传数) (1 ~ 2mm) | RF (2.5KB) |\n|---|---|---|---|---|\n\
    | 相对功耗 | 200 倍 | 6 倍 | 2 倍 | 1 倍 |\n\n### 3.3.3 架构通用性\n\n为了提高精度，神经网络正朝着层次更深、拓扑连接更复杂和网络混合更丰富的方向快速演进，神经网络层与层间及不同类型网络间的差异性不断加大。如图\
    \ 3.5 所示，神经网络深度已经从十几层（如 VGG16/19）发展到上百层，甚至上千层；以 GoogLeNet 和 ResNet 为代表的网络中出现了\
    \ Inception 和残差计算等复杂的多层连接拓扑结构；此外，还有卷积神经层、全连接层和循环层等不同类型网络组合构成类似的多模态网络（如 LRCN），以实现更复杂的智能任务。因此，适用于高效处理不同神经网络的硬件互连结构、基础计算部件都存在较大差异，与之匹配的硬件架构需求也截然不同。例如，针对卷积神经网络的加速架构，在执行长短期记忆网络\
    \ (Long Short-Term Memory, LSTM) 模型时并行利用率可能还不到 20%。即使是可重构的架构也难以摆脱硬件固有的固化性，其架构可重构的空间也是有限的，所以在架构设计时如何解决智能计算芯片的通用性问题也是智能计算的重要挑战之一。\n\
    \n![](img/16a61618bbeb2ecae4884725c4086cbe_31_0.png)\n\n图 3.5 神经网络算法的演进\n\n明确定位计算芯片的应用范围，合理缩小设计的通用性目标是有效的解决方法之一，如定位为专门加速某种单一网络，或是适用于图像识别、语音识别等场景中的多种常用网络。在设计过程中，则需要调研应用范围内网络的共性和差异，在设计的时候保证计算芯片既能满足对不同情况的兼容性，又能够利用共性来改善芯片的性能、面积和能效。针对同一神经网络内部，不同层的差异，则需要考虑如何设计合适的计算芯片结构和合理的映射机制，以有效地调度网络计算、分配硬件资源，减少计算单元和数据传输资源空置的时间，保证在执行神经网络的时候，始终能有效地利用硬件资源。此外，还需要考虑网络是否会存在不同分支或者资源利用倾向差异很大的不同成分，根据这些特点做好相应的优化工作，避免执行过程中网络计算量和数据传输量剧烈变化造成的资源浪费。\n\
    \n### 3.3.4 稀疏性\n\n在神经网络中，很多因素都可以带来网络的稀疏性，例如，权重矩阵本身的稀疏性、ReLU 等函数带来的激活值的稀疏性等。统计表明，LeNet、AlexNet、VGG\
    \ 等经典网络的稀疏性可以达到 90%左右（也就是 90%左右的权重值为 0）。如果这些稀疏性能够得到有效的利用，神经网络的能效在理论上能够显著地提高。然而稀疏化会导致非规则性，为了匹配硬件运算把稀疏化网络进行规则化（如补\
    \ 0）又可能会抹杀稀疏化的收益，这就产生了矛盾，导致执行性能并没有获得相应提升。\n\n图 3.6 给出了传统的 CPU、GPU 以及典型的专用集成电路（Application-Specific\
    \ Integrated Circuit，ASIC）加速器 DianNao[5]分别执行 LeNet、AlexNet、VGG 这三种稀疏化网络所需的执行时间与执行原始网络的对比情况。由于\
    \ CPU、GPU 乃至 ASIC 加速器都没有针对稀疏性有效地降低计算和存储代价，它们在执行性能上都没有获得相应的提升。其中，CPU 执行稀疏化网络的时间比起原始网络反而更长了，平均是\
    \ 211.45%。GPU 取得了平均 23.34%的性能提升，但还是远远不及稀疏化的程度。DianNao 的提升非常微弱，主要是因为 DianNao 在执行稀疏网络时，将原本已经被剪除的部分又补上了\
    \ 0，增加了无意义的计算，导致实际的计算量没有变化。因此，如何有效地利用稀疏化的优点，提高智能计算的性能和能效，也是设计智能计算芯片的重要挑战之一。\n\n\
    ![](img/16a61618bbeb2ecae4884725c4086cbe_32_0.png)\n\n图 3.6 CPU、GPU、DianNao[5]上稀疏化神经网络的加速比[6]\n\
    \n### 3.3.5 混合精度计算\n\n随着低功耗和性能需求不断提高，神经网络逐渐从过去只支持全精度（32bit浮点）运算向支持 16bit、8bit、4bit\
    \ 甚至三值化[7]、二值化[8,9]等多种低精度运算扩展。由于神经网络本身具有一定的冗余性，再经过算法研究人员的精心设计，低精度化的神经网络能够在保证准确率不变或者准确率损失很小的前提下，极大地减少计算和存储负担，降低功耗。而且对一些应用来说，降低精度的设计不仅加速了推断（也可能是训练），甚至可能更符合神经形态计算的特征。近期研究成果已经证明，对于深度神经网络的某些层，使用尽可能低的精度（如二值数据-1\
    \ 和+1）就足以达到预期效果，同时可以节省大量内存和降低能量消耗。因此，低精度设计已经成为智能计算芯片的一个趋势，在只针对推理应用的芯片中更加明显。\n\n\
    在低精度化的趋势之下，对于卷积神经网络、全连接神经网络和循环神经网络等网络，其网络各层适宜的精度也不同。如果仍然采用传统的固定位宽的基本计算单元设计，虽然可以极大地简化设计复杂性，但是这样的设计存在灵活性不足的天生缺陷，要么位数不足导致无法接受的错误，要么位数太多导致浪费存储、带宽及功耗。因此，如何灵活而高效地支持不同网络及同一网络内不同部分对于位宽精度的多样化需求，也是智能计算芯片设计的重要挑战之一。\n\
    \n## 3.4 智能计算平台现状\n\n智能计算目前常用的平台分为通用处理器、专用处理器和可重构处理器三大类。通用处理器主要包括 CPU 和 GPU，它们都是基于冯·诺依曼体系结构的指令集处理器，受控制流驱动，具有很强的功能灵活性和使用便利性；采用运算与存储分离的结构，为计算机的通用性奠定了基础。因此，迄今为止，以冯·诺依曼体系结构为基础设计的通用处理器仍然主导现代计算芯片的发展。\n\
    \n应用于智能计算的通用处理器通常采用单指令多数据流（Single Instruction Multiple Data，SIMD）技术集中控制计算单元来达到显著提升计算并行度的目的，非常契合智能计算中张量卷积这样的大规模并行计算应用需求。因此，CPU\
    \ 和 GPU 等通用处理平台被广泛用作神经网络硬件加速平台。\n\n2012 年，人工智能和机器学习领域最权威的学者之一 Andrew Ng（吴恩达）和分布式系统顶级专家\
    \ Jeff Dean 联手打造的 Google Brain 项目，用包含 16000 个 CPU 核的并行计算平台训练超过 10 亿个神经元的深度神经网络，这是当时世界上最大的深度神经网络。与\
    \ CPU 相比，GPU 在应对大规模并行运算时更有优势。通常情况下，GPU 采用与 CPU 协同工作的方式，从算法代码中提取计算密集部分，加载到 GPU\
    \ 上进行加速处理。目前先进的 GPU 处理器架构都具有上千个 SIMD 处理计算单元，相较于 CPU 较少的核数与线程数，一般可提供 1～2 个数量级的加速效果。由于\
    \ GPU 适用于大规模并行运算的特点，再加上 GPU 巨头 NVIDIA 不断改进硬件架构和编程模型，工业界与学术界越来越多地将 GPU 应用于智能计算。2012\
    \ 年的 ImageNet 挑战赛上，只有四支参赛队使用了 GPU，而到了 2014 年，几乎所有参赛队都使用了 GPU。直到现在仍有大量企业和研究机构使用\
    \ GPU 进行智能计算。\n\n然而，基于冯·诺依曼体系结构的通用处理器在智能计算应用中遭遇了以下问题。\n\n- 第一，控制流驱动的时域计算架构，为完成核心的“执行”运算，需要大量的辅助性工作，如“取指”“译码”“寄存器访问”和“数据回写”等，极大地限制了处理的性能，浪费了能耗。\n\
    \n- 第二，存储与运算分离的计算架构下，冯·诺依曼架构的处理器执行命令必须先从外部存储单元中读取数据，执行完成后必须写回数据，对于智能计算这样访存量巨大的应用，存算分离架构中的频繁数据交换导致大量(据统计，约\
    \ 80%)功耗浪费在总线上，同时也严重地制约了神经网络处理的速度。此外，存储器的存取速度远低于处理器的运算速度，也严重限制了神经网络处理的并行性。\n\n\
    - 第三，冯·诺依曼架构的计算机采用固定位宽的运算单元设计，无法灵活高效地支持智能计算的多精度协同运算需求。\n\n- 第四，智能计算采用三维张量数据结构进行卷积运算，映射到冯·诺依曼机的一维线性存储器上，访存效率低，将导致极大的性能和能耗损失。\n\
    \n目前，基于冯·诺依曼体系结构的 CPU 和 GPU 已经不再是智能计算的唯一选择，专用处理器和现场可编程门阵列(Field-Programmable Gate\
    \ Array, FPGA)开始越来越多地在神经网络加速处理应用领域崭露头角。2016～2017 年，Facebook、微软、亚马逊 AWS、腾讯云、阿里云等，纷纷发布了基于\
    \ FPGA 的云计算服务。2017 年以来，智能计算专用处理器成为学术界和工业界的研发热点，例如，谷歌发布了专为智能计算打造的 ASIC——TPU(Tensor\
    \ Processing Unit)，用于加速其人工智能系统的运行，效率也显著超过 GPU。\n\n智能计算专用处理器主要是指专门针对智能计算、基于 ASIC\
    \ 方式设计的定制处理器。这类处理器专门针对特定类型的计算任务采用专用硬件电路实现，能够以很低的功耗(低至毫瓦级)实现高能效(100～1000GOP①/W)计算，因此对于网络模型算法和应用需求相对固定的场景，ASIC\
    \ 确实是理想的选择。即使是通用 GPU 巨头\n"
