    # 人工智能发展历程与社会影响


    2006年，在辛顿和他的学生的推动下，深度学习开始备受关注。随着各种机器学习算法的提出和应用，特别是深度学习技术的提高，人们希望机器能够通过大量数据分析，从而自动学习知识并实现智能化。这一时期随着计算机硬件水平的提升，大数据分析技术的发展，机器采集、存储、处理数据的水平有了大幅提高。从对实际应用的贡献来说，深度学习可能是机器学习领域最近十年来最成功的研究方向。2010年以后，深度学习技术对知识的理解比之前浅层学习有了很大的进步，推动语音识别、图像识别和自然语言处理等技术取得了惊人突破，推动人工智能和人机交互大踏步前进。许多专用方向的人工智能能力已经超越人类，比如围棋、德州扑克，证明数学定理，学习从海量数据中自动构建知识，识别语音、面孔、指纹，驾驶汽车，处理海量文件等。深度学习带来了机器学习的一个新浪潮，受到从学术界到工业界的广泛重视，也导致了“大数据+深度模型”时代的来临，进而迎来了人工智能新一轮的发展浪潮。


    自第一次工业革命以来，技术创新一直是经济发展的根本推动力。人们在关注技术对经济长期增长作用的同时，也意识到并非所有的技术都具有同等的重要性，只有革命性的技术进步才能推动人类经济社会转型。自18世纪60年代起，人类经历的三次工业革命，分别以机械技术、电气技术和信息技术为核心驱动力。2016年，世界经济论坛将人工智能定义为第四次工业革命的基石。[\[1\]](#txt002.xhtml#footnote_content_txt002_1)2017年，联合国在研究报告《新技术革命对劳动力市场和收入分配的影响》中指出，人工智能与蒸汽技术、电气技术一样，都是人类用于改造自然的通用目的技术（General
    Purpose Technology，GPT）。[\[2\]](#txt002.xhtml#footnote_content_txt002_2)每一次工业革命的高潮都以驱动它的核心技术进入工业大生产阶段，呈现出标准化、自动化、模块化的特征为标志。人工智能的发展史表明，前几轮人工智能发展浪潮都遭遇了技术瓶颈制约，导致商业化应用难以落地，最终重新陷入低潮。但是目前新一代人工智能已经具备很强的通用性，本轮人工智能浪潮的技术上限和商业化潜力都大大高于以往，这意味着其已经为进入工业大生产阶段做好了准备。


    ## 从宏观到微观：人工智能对社会发展的冲击


    2018年，咨询公司麦肯锡发布报告指出，到2030年时，人工智能会在全球范围内创造近130亿美元的额外经济产值，占世界GDP增长的1.2％。[\[3\]](#txt002.xhtml#footnote_content_txt002_3)作为新一轮产业变革的核心驱动力，人工智能正在对世界经济、社会进步和人类生活产生极其深刻的影响。随着物联网、大数据、云计算等技术与智能算法的深度融合，人工智能在各行业已经展现出广阔的应用前景。依靠物联网带来的海量传感信息，人工智能逐渐由计算智能向感知智能发展；依靠大数据提供的可供验证的基础，深度学习算法为计算机更好地模拟类人特性提供支撑；依靠云计算及超强芯片带来的超强计算能力，人工智能的发展拥有了较为坚实物理基础。


    人工智能发展前景广阔，可用于改善消费、医疗、环境、安全和教育等领域，提升民生福祉。当前人工智能已步入全方位商业化阶段，并对传统行业各参与方产生不同程度的影响，改变了各行业的生态，对社会发展造成全面、立体的冲击。国际会计师事务所德勤公司《全球人工智能发展白皮书（2019版）》中指出，这种变革主要体现在三个层次。[\[4\]](#txt002.xhtml#footnote_content_txt002_4)第一层是行业变革，人工智能带来的变革造成传统产业链上下游关系的根本性改变。人工智能的参与导致上游产品提供者类型增加，同时用户也可能会因为产品属性的变化而发生改变，由个人消费者转变为企业消费者，或者两者兼而有之。第二层是企业变革，人工智能参与企业管理流程与生产流程，企业数字化趋势日益明显，部分企业已实现了较为成熟的智慧化应用。这类企业已能够通过各类技术手段对多维度的用户信息进行收集与利用，并向消费者提供具有针对性的产品与服务，同时通过对数据进行优化洞察发展趋势，满足消费者潜在需求。第三层是人力变革，人工智能等新技术的应用将提升信息利用效率，减少企业员工数量。此外，机器人的广泛应用将取代从事流程化工作的劳动力，导致技术与管理人员占比上升，企业人力结构发生变化。


    当前人工智能正在嵌入社会和经济的关键领域，新一代人工智能的主要应用场景聚焦于具有一定需求规模和商业模式较为清晰可行的行业集合，以金融、医疗、教育等行业为例，在社会应用层面，人工智能的显著影响并非体现为取代现有劳动力和资本，而是为其赋能，使其得到更有效的利用。


    在金融领域，围绕消费者行为和需求的不断变化，人工智能在一些服务领域逐渐取代人工客服。人工智能可以通过技术增强客户粘性，提供诸如基于大数据的精准营销和推送、定制化的产品和服务、更大范围的生态圈等服务。传统的金融服务行业正面临着各领域、各环节的重构。


    在医疗领域，在人口老龄化、慢性病患者群体增加、优质医疗资源紧缺、公共医疗费用攀升的社会环境下，医疗人工智能的应用将极大简化当前繁琐的看病流程，并在优化资源、改善技术等多个方面为人类提供更好的解决方案。医疗人工智能已应用到医疗、医药、医保、医院这四大医疗产业链环节。


    在教育领域，不同于传统的教育方式，智能化教育以学生在“教、学、练、评、测”五大环节所产生的数据为基础，利用图像识别、语音识别、人机对话、多模态行为分析、知识生成和表达、模拟智能体等技术，生成适合每个学生的个性化的解决方案和有效反馈意见。通过持续的数据采集、跟踪与重构，人工智能将大幅度提高学习效率，改变教育模式。


    人工智能作为一种赋能的技术，将与传统行业不断融合，进而更好地提升后者的信息化、数字化、智能化水平，促进行业转型升级。但与此同时，在成为世界各国竞相战略布局的新高地的过程中，人工智能的广泛应用也给人类社会带来法律法规、道德伦理、社会治理等方面一系列的新挑战，需要引起高度重视。欧洲认知系统协会主席文森特·穆勒（Vincent
    C.Muller）认为，对待人工智能的风险问题，应该保持一种谨慎心态，“如果人工系统的智能超过人类，那么人类将会面临风险”；反思人工智能风险之目的就是要“确保人工智能系统对人类有益”。他指出：“以前关注的是与认知科学相关的人工智能哲学和理论方面的问题。而现在越来越多的关注点集中在风险和伦理问题上。”[\[5\]](#txt002.xhtml#footnote_content_txt002_5)


    人工智能正在经历从量变到质变的关键转折点，下一步将会越来越多地显示出智慧的特征，最终渗透和影响每一个人的生活。未来，人工智能很可能变成一把万能钥匙，能够释放人类技术和工具的潜能，但也必将给人类带来前所未有的挑战。


    人工智能会在哪些方面对社会发展带来什么样的冲击？2017年，在加利福尼亚州阿西洛马举行的Beneficial AI会议上，特斯拉CEO埃隆·马斯克（Elon
    Musk）、DeepMind创始人戴米斯·哈萨比斯（Demis Hassabis）以及近千名人工智能和机器人领域的专家，联合签署了“阿西洛马人工智能23条原则”（Asilomar
    AI Principles），旨在呼吁全世界在发展人工智能的同时严格遵守这些原则，共同保障人类未来的伦理、利益和安全。阿西洛马人工智能原则是近年来最具影响力的人工智能原则之一，较为全面地概括了人工智能可能引发的社会问题（见图2-1）。三大类主要问题是：科研问题、伦理价值和长期问题，每一类问题又细分出若干小问题。[\[6\]](#txt002.xhtml#footnote_content_txt002_6)


    ![img](images/txt002_1.jpg)


    图2-1　阿西洛马人工智能原则所提出的问题


    可以看出，赶超人类智力的自动系统介入社会各个领域的发展，体现了人工智能与人类文明的密切联系。一方面，人工智能的发展促进了社会生产方式和治理方式的改变，另一方面，社会发展面临的新问题又反向要求人工智能本身的技术限制或者升级。人工智能在个人、社会和国家层面都可能引发许多值得深思的伦理、人权和法律问题。


    例如，当传感器和人工智能无处不在时，企业得以在人们使用数字设备和往返于公共与私人空间时不间断地收集个人信息。在某些特定场合，如医院、酒店，采集私人信息原本极为敏感，但图像识别、语音识别等技术却降低了泄露隐私的门槛。一系列问题随之而来：谁拥有个人数据？数据应以何种方式共享？面对日趋严峻的网络安全攻击又该如何保护数据？


    又如，人工智能可能在决策过程中产生无意识的歧视。由于现实世界存在着各种形式的种族歧视、性别歧视和偏见，输入算法中的数据也可能附带这些特征。而当机器学习算法学习了这些带有偏见的训练数据，也就“继承”了偏见。联合国在收集了大量强有力的证据后得出结论，人工智能在一定程度上加剧了全球不平等现象，并使小部分人从中获益。[\[7\]](#txt002.xhtml#footnote_content_txt002_7)


    最后，基于人工智能的自动化将造成劳动力市场分化，技术不发达的发展中国家在这一波发展浪潮中也将落于下风，国家间的“数字鸿沟”进一步扩大。一些国家原本期待快速增长的人口能够推动劳动力密集型经济的发展，但如果大量人力工作被机器取代，甚至可能出现新的社会动荡。


    ## 从局部到整体：人工智能与价值观体系的重塑


    以色列历史学家赫拉利（Yuval N.Harari）描述了人工智能发展的三个不同阶段：弱人工智能、强人工智能和超人工智能。[\[8\]](#txt002.xhtml#footnote_content_txt002_8)他预测，超人工智能阶段将在21世纪40—60年代出现，整个社会裂变为两大阶层，大部分人属于“无用阶层”，极少一部分人是社会精英阶层。建立在生物科学、信息技术、大数据技术快速发展基础上的人工智能有可能导致智能社会的出现，在智能社会中，机器智能递归式自我改善能力的获得可能导致最终的“智能爆炸”。在未来，人类整体将具有价值，但个体将没有价值，系统将在一些个体身上发现价值，但他们也许会成为一个超人的新物种。


    未来社会是否将在多重维度上重塑价值观体系？首先，随着人工智能的广泛应用，人类社会短期内将无法避免两大灾难性的冲击：持续性失业与不断加剧的贫富差距。如前文所列举的金融、医疗、教育等行业发生颠覆性变革的实例，人工智能的大规模使用正在使传统产业的面貌发生根本性的改变。对当代人来说，与人类智能对等的同类的存在不再是科学幻想，而是现代的科学理论和技术努力的一个方向，并且这种努力将造成人的劳动被大规模、普遍性地取代，这种设想越来越趋近现实。在这样的背景下，此前一切有关人性和理性的理论都要予以重新的审视，从头理解和认识其他可能的理智能力。更进一步地，人工智能的普及对马克思主义劳动价值论带来挑战。劳动价值论是马克思经济学的基石之一，马克思站在劳动者的立场上，提出“商品价值体现的是人类本身”等观点。当人工智能大规模应用时，劳动的主体明显更替；尽管人工智能及其设备也是人的劳动创造，但是，当“无人工厂”“无人超市”“无人餐厅”等“无人产业”大量出现时，我们显然需要从根本上对劳动价值论重新进行深入研究与阐释。


    其次，人工智能的政策制定、研发规划、应用实施等阶段都不可避免地反映了相关主体的价值观。一方面，数据的采集与智能算法的应用并非完全客观和无偏见，在人工智能与智能自动系统的数据选取、算法操作和认知决策中，相关主体的利益与价值因素不可避免地渗透于对特定问题的定义及对相应解决方案的选择和接受之中，它们既可能体现技术设计者与执行者的利益考量和价值取向，也会影响到更多利害相关者的利益分配及价值实现。[\[9\]](#txt002.xhtml#footnote_content_txt002_9)当机器具有多个可学习的部分时，学习算法就存在责任局部化的问题。更复杂的学习机器不仅能修改自己的行为方式，还能自行修改评价体系，此时机器也要处理价值观问题。多台这样的机器以非集权的分布方式进行合作时，就需要处理群体中个体间的评价，即广义的伦理问题。


    例如，美国将理解并解决人工智能的伦理、法律和社会影响作为《国家人工智能研发战略规划》八大战略之一，要求将如何表示和“编码”人类价值和信仰体系作为重要课题研究，建立符合伦理的人工智能，制定可接受的道德参考框架，实现符合道德、法律和社会目标的人工智能系统的整体设计。2020年1月，新美国安全中心（Center
    for A New American Security）的报告《美国人工智能世纪：行动蓝图》中明确提到：尽管人工智能可以在社会中为人们带来不可思议的好处，但它也使未来的恶意用途成为可能，例如对民主国家发动复杂的影响力攻击。美国必须确保其在人工智能方面处于领先地位，并以符合民主价值观和尊重人权的方式塑造全球使用规范。本报告建议采取具体行动，以确保美国继续保持人工智能的领先地位，促进符合美国利益和价值观的标准的发展，并预测和应对安全挑战。


    英国下议院2016年发布《机器人技术和人工智能》报告，指出英国应规范机器人技术与人工智能系统的发展。2018年1月发布的《数据宪章》指出，应确保数据以安全和符合伦理的方式使用。2018年4月《英国发展人工智能的计划、意愿和能力》报告提出了关于人工智能准则的五条总体原则，阐明了政府需要考虑的策略性问题。


    欧盟委员会在《欧盟人工智能》中提出，研究和制定人工智能新的伦理准则，以解决公平、安全和透明等问题，捍卫欧洲价值观。欧洲科学与新技术伦理小组在《关于人工智能、机器人及“自主”系统的声明》中，提出了一套人工智能发展的基本伦理原则。2018年，欧盟成立了人工智能高级别专家组，2019年4月，专家组发布《人工智能伦理准则》，提出建设以人为本的人工智能，列出了可信赖的人工智能系统应满足的7个关键要求。2020年2月，欧盟委员会发布《人工智能白皮书：通往卓越与信任的欧洲之路》，认为面对人工智能带来的机遇和挑战，欧洲需要建立卓越且可信任的人工智能生态系统。为实现“卓越”目标，应向世界输出欧洲人工智能价值观与规则，推动公共部门应用人工智能。向世界推广欧盟的人工智能价值观有利于欧洲实现全球人工智能领导地位，因此欧盟的国际合作必须建立在自身价值观和人工智能规则的基础上。


    另一方面，合成智能和人造劳动等人工智能应用一般是通过人机协同来实现的，相关主体的价值选择必然渗透其中。通过机器学习和智能算法对数据进行洞察之类的应用人工智能不仅是各种计算与智能技术的集成，还必须将人的判断和智能融入其中。要把握数据所反映的事实及其意义，必须借助人的观察和理解进行标注。随着人工智能的发展和突破，计算机能否处理“价值观问题”将不再是区别人与机器的决定性标准，一旦机器智能从整体上超越人类，我们必然面临人本位的价值观与机器本位价值观的重大冲突。


    例如，在就业方面，美国政府非常重视人工智能对就业带来的影响，2017年美国众议院发布《人工智能创新团队法案》，2018年发布《人工智能就业法案》，提出美国应营造终身学习和技能培训环境，以应对人工智能对就业带来的挑战。在行业发展方面，如美国众议院于2017年通过了《自动驾驶法案》、美国交通部于2018年发布《准备迎接未来交通：自动驾驶汽车3.0》、美国卫生与公众服务部发布《数据共享宣言》等，规范和管理自动驾驶汽车设计、生产、测试等环节，确保用户隐私与安全。


    最后，人工智能的发展会不会与人的存在价值发生深层次的难以调和的本质性冲突？人们的不同价值观通常是个体在社会化过程中通过教育、强化以及观察学习等方式将社会价值逐步内化而形成的。人类对于未来社会的担忧，首先源于未来强人工智能可能具备远远超出人类的计算能力，人类设计的计算机反而成为算计自己的工具，这将成为一个关系人类命运的重要问题；其次源于广义人工智能会获得感知能力。广义人工智能与狭义人工智能的本质区别之一就是在于人造智能体是否能够为自己设定宏大的目标。“感知机器”的出现可能会让人类变得毫无用处，或者杀死我们。贝宝公司（PayPal）的联合创始人彼得·蒂尔（Peter
    Thiel）的观点也许能够反映出人类对于人工智能担忧的根本原因。他认为：“我们难以描述广义人工智能以何种形式出现，在某种意义上，人工智能问题涵盖了人们对计算机时代的所有希望与恐惧，当被逼到这些极限时，人的直觉就会崩塌，因为我们在这个星球上从没有遇到过比人更聪明的东西。”著名的人工智能研究者埃利泽·尤德考斯基（Eliezer
    Yudkowsky）预测分析：“人工智能不必控制整个网络，它不需要无人机，它之所以危险，不是因为它有枪，而是因为它比我们聪明。假设它可以从DNA信息中预测蛋白质结构，那它只需要向合成自定义蛋白质的实验室发几封电子邮件，很快它就会拥有自己的分子机器，然后制造出更精密的分子机器。我无法准确预测我们会如何输给人工智能，因为人工智能比我聪明。”


    计算机技术的加速发展推动了机器人、机器感知以及机器学习领域的进步，这些成果让新一代系统可以匹敌甚至超越人类的能力。这样的发展趋势有可能会开辟出一个前所未有的繁荣而安逸的新时代，但是其转换过程是不可预知的。一旦人工智能掌握了人类无法理解和掌控的海量数据后，它们就可以在转瞬间造成人类无法想象的灾难，例如关闭电网、使交通系统瘫痪等。正如诺伯特·维纳（Norbert
    Wiener）所提醒的那样：“新工业革命是一把双刃剑，它可以用来为人类造福，但是，仅当人类生存的时间足够长时，我们才有可能进入这个为人类造福的时期。新工业革命也可以毁灭人类，如果我们不去理智地利用它，它就有可能很快地发展到这个地步。”[\[10\]](#txt002.xhtml#footnote_content_txt002_10)


    ## 本章小结


    纵观人工智能发展的历程，社会应用的繁荣时期也是人工智能发展迅猛的阶段，而当社会应用的数据积累远远落后于算法的发展时，又是人工智能停滞的阶段。目前，人工智能在各行业已经展现出广阔的应用前景，不仅能带来生产效率的提升，还会催生新的产品与模式，推动整个产业链的重构。因此，人工智能为人类价值观体系的重塑提供了新的技术支撑，必然对社会发展带来不可抗拒的冲击和风险。工业革命经历了从欧洲、逐渐扩展到北美、东亚等地区的缓慢过程，但是在新全球化、新工业革命交织下的人工智能风险既具有地域特色，又具有全球特征，具有跨界性，超越了自然地理和社会文化边界，在技术上塑造着人类命运共同体。[\[11\]](#txt002.xhtml#footnote_content_txt002_11)

