    # Exploring the European Legal and Ethical Framework for Artificial Intelligence


    ## The Legal Status of Robots


    ### EU Legislative Motions


    Regarding the legal status of robots, as early as May 2016, the European Parliament''s
    Committee on Legal Affairs (JURI) launched a motion calling on the European Commission
    to grant the rapidly developing automated robots the legal status of "electronic
    persons" [[59]](#txt004.xhtml#footnote_content_txt004_59), endowing these robots
    with "specific rights and obligations" such as copyright and labor rights according
    to law. The motion also recommended establishing a register for intelligent automated
    robots to facilitate the opening of capital accounts for these robots covering
    legal liabilities (including paying taxes according to law, enjoying cash transaction
    rights, receiving pensions, etc.) [[60]](#txt004.xhtml#footnote_content_txt004_60).
    In January 2017, the European Parliament''s Committee on Legal Affairs adopted
    a resolution requesting the European Commission to submit legislative proposals
    on robots and artificial intelligence. In February of the same year, the European
    Parliament passed this resolution [[61]](#txt004.xhtml#footnote_content_txt004_61).


    ### Theoretical Explorations by French Scholars


    In addition, French scholars have begun to explore solutions for the legal status
    of robots. In "From Artificial Intelligence to Virtual Persons: The Emergence
    of a Legal Person?", Danielle Bourcier points out: "When robots manufactured by
    humans can continuously learn in both the virtual world and the real world, they
    acquire autonomy; then how will humans control the virtual world through law?
    If artificial robots are right beside us, what legal rights should be granted
    to them?" Based on this, he proposes the hypothesis of the "virtual person" from
    a jurisprudential perspective, viewing it as a legal artifact, and further suggests
    that different laws must be formulated according to the characteristics of virtual
    persons to handle disputes and conflicts between intelligent robots and ordinary
    humans [[62]](#txt004.xhtml#footnote_content_txt004_62). It can be seen that regardless
    of whether humans can play the role of "creator" for these robots, humans have
    already begun to think and act.


    ### Challenges Facing Legislation


    However, the legislative process for robots is by no means smooth sailing. In
    terms of subject status, should robots be defined as natural persons, legal persons,
    animals, or objects? Is it necessary to create a new type of subject (electronic
    person) so that advanced robots can enjoy rights, assume obligations, and bear
    liability for damages they cause? These are key issues the EU needs to focus on
    when legislating for robots in the future [[63]](#txt004.xhtml#footnote_content_txt004_63).


    ## The Standard of "Independent Intellectual Creation" in Intellectual Property


    ### Analogy between Animal and AI Creations


    Second is to clarify the standard of "independent intellectual creation" for artificial
    intelligence in the field of intellectual property. To answer whether AI-generated
    works should be protected by law, many people inevitably think of animals, which
    we humans believe lack independent consciousness. In 2011, a group of monkeys
    in Indonesia took some photos using British photographer David Slater''s camera,
    including a selfie. This photo was included in Wikimedia Commons. The photographer
    argued that the monkey created the shooting scene during the process and put the
    camera on a tripod, which could be considered a selective shooting process, and
    thus the copyright of this photo should belong to the monkey. However, judging
    from the current laws of various countries, no country recognizes animals as copyright
    owners, mainly because animals currently do not possess independent intellectual
    creative capacity. The same applies to artificial intelligence.


    ### EU Explorations


    In 2016, the European Parliament''s Committee on Legal Affairs advised the European
    Commission to propose a more balanced approach regarding "intellectual property
    related to hardware and software standards and code," strengthening the possibility
    of computer or robot works being included within the scope of copyright protection
    while protecting innovation. The Committee thereby proposed the definition standard
    of "independent intellectual creation" for artificial intelligence to clarify
    copyright ownership [[64]](#txt004.xhtml#footnote_content_txt004_64).


    In June 2019, the main achievement of the EU copyright reform, the *Directive
    on Copyright in the Digital Single Market*, came into force. The EU began to focus
    on the copyright protection of AI-generated content to incentivize and protect
    the creation of literary and artistic works related to artificial intelligence.


    ### UK''s "Deemed Author" System


    The UK has also made beneficial explorations in this regard. For works generated
    by a computer without human author involvement, it adopts the "deemed author"
    approach, regarding the party who made the necessary arrangements for the creation
    of the work as the author. The rationale is that "it has become a reality that
    some computer programs can generate content with little human involvement. The
    rapid development of technology challenges whether copyright law can remain applicable
    in the long term; copyright law should possess a certain degree of flexibility"
    [[65]](#txt004.xhtml#footnote_content_txt004_65).


    ### Germany''s Attempt at Neighboring Rights Protection


    Germany has also attempted to protect neighboring rights for AI creations. Neighboring
    rights refer to the totality of exclusive rights enjoyed by disseminators of works
    and creators of labor results outside the works over their labor results. The
    reason for the generation of neighboring rights is that some "valuable intangible
    labor results cannot receive copyright protection due to insufficient originality,
    but these activities of creating labor results, on the other hand, promote the
    dissemination of works, and simultaneously face the risk of being easily copied
    and disseminated without permission, requiring legal protection." Therefore, Germany
    actively "implements the ''EU Database Directive,'' granting neighboring rights
    to right holders of non-original databases, protecting the rights and interests
    of database makers and investors" [[66]](#txt004.xhtml#footnote_content_txt004_66).


    ## Safety and Liability Assessment


    ### Extension of Product Safety Regulations


    Third is the assessment of safety and liability. Given the complexity of AI systems
    and the characteristics of autonomous decision-making, people need to re-examine
    existing safety rules and liability rules. In this regard, the *Report on the
    Safety and Liability Implications of AI, the Internet of Things and Robotics*
    attached to the European Commission''s *White Paper on Artificial Intelligence*
    provides an answer: current product safety regulations already support an extended
    concept of safety, i.e., protecting users from various risks of products according
    to the product''s intended use. At the same time, introducing clauses on emerging
    digital technology risks provides more legal certainty [[67]](#txt004.xhtml#footnote_content_txt004_67).


    The autonomous behavior of certain AI systems during their lifecycle may have
    some impact on safety, which may require new risk assessments. EU product safety
    legislation stipulates specific requirements for avoiding erroneous data risks
    at the design stage and establishes a mechanism for maintaining data security
    throughout the entire process of using AI products and systems. In addition, Europe
    has made efforts in connected vehicle safety standards. The European Telecommunications
    Standards Institute (ETSI) organizes relevant connected vehicle safety standards
    research, focusing on security privacy and secure communication [[68]](#txt004.xhtml#footnote_content_txt004_68).


    ### Challenges of Emerging Technologies to Liability Frameworks


    Emerging technologies such as artificial intelligence, the Internet of Things,
    and robotics may challenge certain aspects of the legal liability framework and
    reduce its effectiveness. Because certain characteristics of emerging digital
    technologies may make it difficult for victims to trace damage back to the person
    at fault. This greatly increases the cost for victims and also means that liability
    claims against persons other than the producer may be difficult to prove. The
    European Commission is attempting to simplify liability rules, reduce the complexity
    of proving legal liability, and adapt to claims for damages caused by AI applications
    [[69]](#txt004.xhtml#footnote_content_txt004_69).


    ### Conformity Assessment Mechanism for High-Risk AI Applications


    Given that certain AI applications may pose high risks to citizens and society,
    to ensure AI is trustworthy and safe, and complies with European values and rules,
    the EU believes that applicable legal rules must be formulated in practice, and
    a conformity assessment mechanism for high-risk AI applications must be initiated.
    This mechanism has been applied to a large number of products within the EU, and
    some key elements have been summarized, such as: special consideration should
    be given to the possibility of certain AI systems evolving and learning from experience;
    repeated assessments must be conducted throughout the entire lifecycle of the
    AI system; the data used for training, as well as the relevant programming and
    training methods, processes, and technologies used to build, test, and validate
    the AI system, must be verified.


    All relevant operators complying with the regulations, regardless of company location,
    must undergo conformity assessment. To reduce the burden on SMEs in the conformity
    assessment of high-risk AI, they can obtain support from Digital Innovation Hubs,
    and can also use standards and dedicated online tools to assist compliance practice
    [[70]](#txt004.xhtml#footnote_content_txt004_70). In addition, parties negatively
    affected by high-risk AI applications can obtain effective judicial remedies.
    As for non-high-risk AI applications, the EU adjusts the legislative scope of
    application on the one hand, and establishes a voluntary labeling mechanism on
    the other. Operators not bound by mandatory regulations can voluntarily decide
    whether to become subject to mandatory constraints. AI applications voluntarily
    accepting regulatory constraints will be granted a quality label. This series
    of measures helps enhance user trust in AI systems and promote the comprehensive
    popularization of AI [[71]](#txt004.xhtml#footnote_content_txt004_71).


    ## Chapter Summary


    ### Strategic Positioning of European AI Development


    With the strong rise of the United States and China in the field of artificial
    intelligence, Europe has fallen behind both countries in terms of global scale,
    deep learning, patent applications, and financial investment. In a situation where
    it does not hold the initiative, Europe has no other way to break out of the encirclement
    than to take a different path. Therefore, Europe, with its traditional human rights
    heritage, focuses on exploring the values of artificial intelligence, using them
    as "technical specifications" for AI development, striving to ensure that Europe
    has global discourse power and international competitiveness in the field of AI.


    Europe sets the goal of AI development to make people feel empowered by AI, rather
    than threatened by it.


    ### Three Dimensions of Values


    How to understand European values? We can approach from three aspects:


    **First is the philosophical origin.** As a philosophical concept, values have
    their own logical origin. The development of European AI must adhere to European
    values and protect the fundamental rights of European citizens, such as dignity
    and privacy. This is its philosophical origin.


    **Second is the development path.** For values to lead the development of European
    AI, the key is to seek cooperation. The EU differs from entity states like the
    US and China; it is a political union, and a relatively loose one at that. To
    gather sand into a tower, the good medicine of cooperation is indispensable. Whether
    it is cooperation among member states, cooperation with the private sector, or
    international cooperation, all clearly illustrate this point.


    **Third is the ultimate proposition.** A technology, especially a good, advanced
    technology, once born, its ultimate destiny is to persist rather than be abolished;
    AI is no exception. When higher-level Artificial General Intelligence (AGI) and
    Superintelligence appear, the relationship between humans and machines will face
    more new, unknown, and temporarily unsolvable challenges. But these are merely
    "stepping stones" that prompt AI to become more perfect and more human-like. Mutual
    assistance and coexistence between humans and machines, and machines enjoying
    humanitarian treatment, will all be unstoppable future trends.


    ### Historical Origins of the Human Rights Tradition


    Why does Europe propose "human-centric" values? Because Europe has always had
    a human rights tradition. In 1215, British nobles and the King signed the *Magna
    Carta*, and royal power was gradually restricted. In 1640, the British Bourgeois
    Revolution broke out. In 1689, Britain enacted the *Bill of Rights*, explicitly
    restricting royal power in legal form and establishing a constitutional monarchy.
    A hundred years later, in 1789, the French Bourgeois Revolution—the largest in
    scale and scope in modern world history—ended over 1,000 years of feudal rule
    in France, shook the feudal order of the entire European continent, and further
    struck the rule of European feudal lords. During this period, the programmatic
    document *Declaration of the Rights of Man and of the Citizen* was promulgated,
    proclaiming that liberty, property, security, and resistance to oppression are
    natural, inalienable human rights, allowing ideas such as liberty, equality, and
    fraternity to truly take root and spread throughout Europe. After hundreds of
    years of traditional accumulation, natural human rights have permeated the blood
    and bones of every European.


    ### "Three-Wheel Drive" Practical Path


    How does Europe practice its own AI values? Europe focuses on the "three-wheel
    drive" of technology, talent, law, and ethics—like the unique stability of a triangle,
    conquering technology, cultivating talent, and balancing legal principles are
    three indispensable elements. On the one hand, it continues and continues to consolidate
    and expand its advantages in industry and law; on the other hand, it promotes
    the application of AI in SMEs and the public sector; and on another front, it
    emphasizes personal skills training and regulation, among others.


