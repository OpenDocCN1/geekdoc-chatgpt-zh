- raw: "[\\[6\\]](#txt005.xhtml#footnote_quote_txt005_6)孔凡静.“日本模式”的核心与政府干预［J］.日本学刊，2009（02）：99-110.\n\
    \n[\\[7\\]](#txt005.xhtml#footnote_quote_txt005_7)崔继华，陈磊.日本人隐私观探析［J］.常州大学学报（社会科学版），2011，12（04）：32-35.\n\
    \n\uFEFF\n\n# 第6章　人工智能与中国价值观\n\n中国人工智能的发展与欧美发达国家相比起步较晚，但是发展速度较快且已经开始影响中国社会的方方面面，这离不开中国对科学技术的高度重视。人工智能发展与价值观关系密切，价值观既影响人们对人工智能成果的态度，又对人工智能发展产生重大影响。反过来，人工智能作为实践活动也会影响中国价值观新的演化道路。1949年后，中国科技发展有了稳定的环境，产出了一批重要的科学成果；改革开放后，中国的科学技术得到了较快发展，近年来，随着人工智能发展的日益成熟，中国政府与企业对人工智能发展及其对未来的影响高度关注。2017年7月，中国政府提出了《新一代人工智能发展规划》；2019年2月，中国政府专门成立了国家新一代人工智能治理委员会，同年6月，该委员会发布了《新一代人工智能治理原则——发展负责任的人工智能》。\n\
    \n## 价值演进：从人机道德到数据治理\n\n中国有着五千年的历史文化，钱穆指出中华文化“悠久”“无间断”和“详密”是其有别于其他文明古国的三大特点[\\\
    [1\\]](#txt006.xhtml#footnote_content_txt006_1)。依靠语言文字的记载，中国的价值观念和思维方式传承发展，它们既诞生于创造文化的实践，又作为指导和制约实践的核心力量影响文化的发展和走向。近代以来，关于中国文化的研究，在很大程度上是中西文化的比较研究，文化的时代性特征突出。梁漱溟认为，“中国文化以意欲自为、调和、持中为其根本精神”。[\\\
    [2\\]](#txt006.xhtml#footnote_content_txt006_2)中华文化崇尚“中、和”的价值观念深深融入民族的文化心理结构中，成为人们思维和行为方式的集中体现。张岱年认为，“中国文化的基本思想不是单纯的，而是一个包括多要素的统一体系。这个体系的要素主要包括：刚健有为、和与中、崇德利用和天人协调”[\\\
    [3\\]](#txt006.xhtml#footnote_content_txt006_3)，并指出中西文化基本差异的表现之一就是在人与自然的关系问题上，即中国文化强调“天人合一”，而西方文化则强调“征服自然”。中国传统哲学的中心问题，更加着重阐述人与宇宙、人与社会、人与人和谐关系的思考，这一系列问题的核心皆区别于西方哲学的论述范围。中国“天人合一”的基本思想包括：第一，人是自然界的一部分，是自然系统不可缺少的要素之一；第二，自然界有普遍规律，人也服从这普遍规律；第三，人性即天道，道德原则和自然规律是一致的；第四，人生的理想是天人的调谐[\\\
    [4\\]](#txt006.xhtml#footnote_content_txt006_4)。总而言之，中国注重人与自然之间的和谐，以和谐为重要价值原则。\n\
    \n随着人工智能的广泛应用，打破了人们原有的生活韵律，人们的生存发展模式甚至人类未来将受到冲击，内外部环境的极大变化将人与自然关系的思考推向一个新的维度，无论是物与物之间、还是人与人之间，都无法避开机器的意识、机器的道德来单独谈论人类的生存，人机之辩被推向新时代的焦点位。同时，人类的实践活动离不开生产要素，人工智能以数据为养料，数据的价值成为社会经济发展的重要推动力，中国共产党的十九届四中全会审议通过的《中共中央关于坚持和完善中国特色社会主义制度　推进国家治理体系和治理能力现代化若干重大问题的决定》中提出，健全劳动、资本、土地、知识、技术、管理、数据等生产要素由市场评价贡献、按贡献决定报酬的机制。这是中国首次将“数据”列为生产要素，数据的重要性得以显现，对数据合法合规、安全可信地使用，对数据资源合理地把握与支配，对数据价值的释放及对治理规则的制定，成为持续健康地发展人工智能的重要命题之一。\n\
    \n### 由人及物、道德关注点的转移\n\n通常而言，先秦诸子时代被认为是中国价值观念的奠基时期，并以“儒墨道法”四派为主，其中以“儒家”和“道家”的价值体系影响最为深远。儒家主张仁义，以道德意识为价值标准，墨家主张功利说，以人民大利为基本价值，法家崇尚竞争，道家则将宇宙本根的“道”视为真正的价值。四派的价值体系包含许多互相对立、互相冲突的价值观念，而以儒家文化及价值观念居于主导地位。但值得注意的是，“道家强调‘不争’，墨家提倡‘非攻’‘尚同’，与儒家之强调‘和谐’有相通之处。只有法家强调的‘竞争’与另外三派存在最终分歧。”[\\\
    [5\\]](#txt006.xhtml#footnote_content_txt006_5)自汉武帝以后，墨家学说和法家学说皆遭到冷落，退居社会次等地位，大约东汉初期，佛教传入中国、儒道学说应时代之需不断演变，由此开启了儒释道[\\\
    [6\\]](#txt006.xhtml#footnote_content_txt006_6)三家此消彼长、交替兴盛的局面，但儒家学说仍是主流思想，以“持中贵和”为基本原则和最高价值，认为宇宙是一个和谐的整体，以重和谐的思维方式思考自身与外在世界的关系。《中庸》开篇说“天命之谓性，率性之谓道，修道之谓教”，其中蕴含着由天人、内外、性修构成的一个完整的哲学体系，这个体系的最高根源在天，以“天命”的路径贯通天人，人与天的关系最主要内容最终集中在人的道德修养上，强调“学以成人”，重人世、重社会、重现实，以人为尊——重视人的生命意识、尊重人的尊严和价值；以民为贵——重视人的社会人格，倡导个人的社会地位要靠自己的努力去争取，人与人之间的平等存在于社会关系层面，从人的社会性理解人。与此同时，以“和”为核心文化特性也包含这一思想另一层面含义，“君子和而不同”（《论语·子路》）和“万物并育而不相害，道并行而不相悖”（《礼记·中庸》）强调万事万物的包容、和合相处之道，认为各种不同的事物可以同时存在而不互相矛盾。这种观念在帮助中国塑造民族气质和特点方面影响深远，在对待技术的态度上也是相信文化和科技能够和谐相处、相得益彰，推而广之，在对待世界文明多样性的时候，也秉承着这种“和而不同、求同存异”的思想，在交流交融和互学互鉴中力求共赢。中国国家主席习近平曾指出：“中华民族历来是爱好和平的民族。中华文化崇尚和谐，中国‘和’文化源远流长，蕴涵着天人合一的宇宙观、协和万邦的国际观、和而不同的社会观、人心和善的道德观。[\\\
    [7\\]](#txt006.xhtml#footnote_content_txt006_7)”\n\n今天，随着人工智能嵌入到人类社会的方方面面，中国五千多年积攒的道德价值受到了前所未有的挑战。首先，持中贵和的传统受到了冲击，天人合一的道德关注点发生了转移。面对机器智能一项一项地超越人类且人类难以赶超的事实，机器智能的社会地位和价值难以忽视，中国社会越来越重视人与机器的关系，并纳入哲学理论化系统思考中：如何建构机器智能的道德体系，如何展开未来社会发展模式。由于机器智能的内涵尚且模糊、难以界定，“和合”相处的价值观缺失了稳定的比照对象，不管是不敢相信机器还是不愿相信机器，和谐共处都成为了问题。不仅如此，社会运行与治理的重点也发生转变。在传统文化价值中，教化是社会整合的重要手段，人在接受知识、学习反思的过程中理解人的存在、生命的意义与人生价值。如今，得益于人工智能的发展，人们可以在算力、算法和大数据的帮助下轻而易举地获得人类迄今为止的所有知识，甚至智能调度的知识储备机器人在问答比赛中已能战胜人类，社会通过教化建构起共同的基本价值观的实践方式是否全然奏效成为一个未知数。人的觉醒和人的意识的形成脱离了对“天”的敬畏和对照，天人合一的运行基础将难以维续，和谐整体的宇宙观及重和谐的思维方式面临着挑战。\n\
    \n自动驾驶是感知、人机物互联、大数据、高速无线网及人工智能等技术的集大成者，核心是人工智能，也是当前人工智能应用落地最受争议和最具前景的领域之一。百度是国内较早涉足人工智能的互联网巨头公司之一，自动驾驶作为公司深耕的主要领域，致力于帮助汽车行业及自动驾驶领域的合作伙伴结合车辆和硬件系统，快速搭建一套自动驾驶系统。2017年，百度创始人、董事长兼首席执行官李彦宏向公众展示了自己乘坐百度研发的自动驾驶汽车的视频，视频中李彦宏坐在副驾驶位置上，驾驶位置上驾驶员未掌控方向盘，让车辆处于自动驾驶状态。视频一出，社会争议不断，还惊动了北京市公安交管部门，并在官方微博回应：正在积极开展调查核实。虽然称支持无人驾驶技术创新，但应当合法、安全、科学进行。这一问题之所以引发社会热议，最主要的因素在于一旦自动驾驶的汽车出现了交通事故，责任应当由谁来承担。在传统的中国的价值观念中，道德价值作用于人并对人的行为进行指导和约束。当人驾驶汽车时，人就要对驾驶过程中的判断和行为承担责任。而自动驾驶的汽车缺失了这一责任的主体，对机器的问责尚且无从谈起。\n\
    \n尽管自动驾驶的道德责任尚未得到有效解决，但是技术创新的脚步未曾停下。这既是科技发展的客观需要，也是人工智能带来的经济动能对社会价值观的冲击。2019年12月，百度在长沙举办首届Apollo生态大会，发布全球首个点到点城市自动驾驶开放能力，宣布Apollo形成了自动驾驶、车路协同以及智能车联三大平台联动发展。Apollo拥有自动驾驶路测牌照数150张、智能驾驶专利数1237件、测试里程超300万公里、23个城市展开路测、汇聚超过了36000名全球开发者、177家生态合作伙伴，以及开源了56万行代码。在多项技术取得领先优势的前提下，这也让百度的Apollo在全域技术层面拥有规模型的优势。同年，广州市正式发布了首批自动驾驶路测牌照，其中6家企业获得首批智能网联汽车道路测试通知书。随着5G牌照的发放，5G通信技术给车辆的应用场景带来更大的想象空间，无人驾驶正在逐步落地城市，文远知行于2019年11月在广州落地全开放运营Robotaxi服务，百度也全面开放Apollo\
    \ Robotaxi服务，长沙用户通过百度地图、百度App可以免费试乘。[\\[8\\]](#txt006.xhtml#footnote_content_txt006_8)自动驾驶服务的落地，并不意味着人们对“电车难题”思考的结束。电车难题的情境困难在于：如果出现交通事故，汽车应该保护车内乘客撞向行人，还是优先保护路上的行人而不得不使车内乘客陷入危险。由这个基本问题演变而来的对机器责任的关注和追问多种多样。例如，在人的数量上，如果车内只有1人而路上有5人，是牺牲1人救5人，还是牺牲5人救1人；在人群划分上，如果车内有1个人，路上1人是孕妇、老人或者小孩，机器应该做出何种道德判断和价值选择。这个问题回到人类手动驾驶，即使没有标准答案，但是人们不会在事故发生之前感到忧虑，因为人们相信人的道德意识，相信人们基于共同文化背景和价值习得形成的思考与判断。然而人们不敢相信机器，当它们的行为有可能涉及本应该只有人才拥有的道德价值时，机器便无法逃脱这类看似对它们而言不公平的问题，并且这些问题也成为了人工智能伦理的重要组成部分。机器是否能具有价值判断的自我意识，而这种意识又能多大程度被人类普遍接受成为新的道德关注点，也成为中国价值观探讨的新内容。\n\
    \n一般认为，人通过自我反思的能力建立起“意义”和“价值”的世界，使人与物之间得到区分，那么人工智能是否具有自我反思的意识呢？人们普遍担心：一旦人工智能拥有了这种反思的意识，人类可能将难以对其进行约束和控制，这或将才是人工智能对人类最大的威胁。从中国传统的价值观念考虑，李泽厚认为“实用理性[\\\
    [9\\]](#txt006.xhtml#footnote_content_txt006_9)是中国传统思想在自身性格上所具有的特色，它以儒家思想为基础构成了一种性格—思想模式，使中国民族获得和承续着一种清醒冷静而又温情脉脉的中庸心理：不狂暴、不玄想、贵领悟……以服务于现实生活，保持现有的有机系统的和谐稳定为目标……”[\\\
    [10\\]](#txt006.xhtml#footnote_content_txt006_10)，人工智能不仅不能仿照这种思想模式的形成完成自身的“教化”过程，甚至可能会产生背道而驰的自我意识。从客观事实来看，尽管目前人工智能扩展了人自身的能力，不断改变和充实着人的认知尺度，但是人工智能产生自我意识可能还需要很长的时间。现阶段人工智能主要还是工具层面的技术进步，只不过以往技术的进步带来的大多是体力方面的超越，而在人工智能大量嵌入时，则很大程度上带来的是对人脑力能力的替代，这刺激和引发了人类的危机意识。特别是对于中国这样重历史、重经验和重传统的社会文化结构。因此，中国社会更加重视机器道德发展现状和未来趋势。有观点认为，人类可以向人工智能植入价值观，但是什么样的价值观是切实可行且合适呢？假设人工智能必须受到外部的制约，在人类的规定下完成特定的任务、遵守特定的法则，就目前的技术发展需求来看，此种做法的可行性似乎很高，但从长远来考虑，这一做法无疑埋下了隐患，当机器的自主学习能力增强后，人类的道德约束万一失去作用，机器是否会对人类曾经的控制产生厌恶和报复心理呢？当机器有能力完全自主其行为后，它将不再是被动为人类所用的工具，那么这时候机器能否为自己的行为承担相应的责任呢？“人工智能一旦试图追求自身存在的最大效率，非常有可能会主动删除人的道德程序——从人工智能的这角度看，人类为其设置的道德程序等于是一种‘病毒’。可见，为人工智能设置道德程序之类的想象是毫无意义的。”[\\\
    [11\\]](#txt006.xhtml#footnote_content_txt006_11)从机器智能对人类产生威胁的角度考虑，有些学者认为不应该去追求强人工智能，在弱人工智能[\\\
    [12\\]](#txt006.xhtml#footnote_content_txt006_12)范围内，人机关系还是可控的，只是停留在源于机器人的社会问题，还能在政治、经济和法律等传统的学科框架内协商解决。但是，若强人工智能嵌入，对中国价值观而言，缺失了“天人合一”道德基础，机器道德的可信度值得怀疑，机器可能也无法秉以持中贵和的世界观和人生观，人类的尊严可能会丧失殆尽，人类甚至有被整体替换的危险。\n\
    \n### 责任优先、从机器问题到数据价值\n\n从历史的经验来看，在享受科学技术进步带来社会经济发展的同时必须高度警惕技术可能带来的威胁。中国社会价值观重视责任，强调责任优先，因此人工智能想要长久地发展，也要能承担起责任。但是在人工智能能否担当责任的背后，其实是中国社会到底是否信任人工智能的问题。有两种普遍的讨论：一是能完全相信人工智能吗？特别是在涉及生命安全的时候；二是能预防人工智能不会产生真正的威胁吗？\n\
    \n对第一个问题来说，人工智能带来了很多的不确定因素，不确定是否安全，人们对人工智能的信任有待考量。当涉及与生命安全有关的决定时，人们是不放心交给人工智能做出决策的，就算人工智能已经做出了决策，人们也不愿意相信它，从而按照人工智能给出的方法执行。这是因为机器无论模仿多像人类，它都是陌生的，是一个物化的存在。人与人之间是可以展开同等性质的对话与沟通，并在此基础上，通过情感的理解与共通建立信任关系，但是人们却难以对人工智能产生某种具体的情感，由此信任感的建立缺乏基本的土壤。在人们的观念中，人工智能的决定只是基于没有情感的数据分析，数据本身尚且有大堆信任问题需要解决，何况基于数据做出的推理决策呢？另一方面，中国社会价值观认为人处于社会关系中，面临的大部分问题不是某一领域的具体问题，而往往是综合各种因素的复杂问题，这种复杂度无法靠理性分析得出答案，而必须依靠人的情感，机器的“思维”活动不仅难以解释且难以与人类产生情感上的共鸣，而人与人之间则能够同时理解语言本身和言外之意，不仅解决问题还能感知到他人的感受而做出调整。所以，对中国社会而言，人工智能是无法习得人类的道德责任感和使命感，在遭遇危险的时候，尽管人工智能十分先进，中国人还是不会将自己的性命托付给人工智能，任凭其做出决定。在2019年上映的科幻电影《流浪地球》中，吴京饰演的领航员刘培强在拯救人类生命的问题上与人工智能moss产生冲突，刘培强不愿服从moss基于计算的决策结果，而认为拯救人的生命更重要，并最终没有听命于moss。中国人以仁义为主的责任感始终排在价值抉择的前列。\n\
    \n对第二个问题的思考，关乎到人们如何认知和定义人工智能的超级功用。人们希望人工智能具有超人的能力，帮助人类做一些对人类来说困难的事情，这种只在能力上超越人类的人工智能并不是对人类最大的威胁。如前所说，人工智能对人的威胁来源于其反思的能力，也就是人工智能的自我意识。那么这种威胁是否能预防呢？目前来看，不可得知。中国的反省精神是达到修身、齐家、治国、平天下的基本要求，吾日三省吾身是儒家传统，更是中国文化不可或缺的部分，它强调人内在的道德要求，也是中国人责任感的体现。如果机器也能进行诸如此类的思想活动，那么它“修身、齐家、治国、平天下”的意义指向何处？如果以预防此类情况的发生做为发展人工智能的前提，那么人工智能的发展将走向何方呢？中国相信这些问题无法靠一国之力解决，人类命运休戚与共、息息相关，作为以责任意识优先的世界大国，中国希望能与其他国家协商推进，共同寻找应对之法，以避免由于国与国或者社会团体之间未达成一致而带来的冲突。"
