    # Chapter 6: Artificial Intelligence and Chinese Values


    China''s AI development started later compared to developed countries in Europe
    and America, but it has developed rapidly and begun to influence all aspects of
    Chinese society. This is inseparable from China''s high emphasis on science and
    technology. AI development is closely related to values; values not only influence
    people''s attitudes toward AI achievements but also have a significant impact
    on AI development. Conversely, AI as a practical activity also influences the
    new evolutionary path of Chinese values. After 1949, China''s scientific and technological
    development had a stable environment, producing a batch of important scientific
    achievements; after Reform and Opening-up, China''s science and technology developed
    rapidly. In recent years, with the increasing maturity of AI development, the
    Chinese government and enterprises have paid high attention to AI development
    and its impact on the future. In July 2017, the Chinese government issued the
    *New Generation Artificial Intelligence Development Plan*; in February 2019, the
    Chinese government specially established the National New Generation Artificial
    Intelligence Governance Committee, which in June of the same year released the
    *New Generation Artificial Intelligence Governance Principles—Developing Responsible
    Artificial Intelligence*.


    ## Value Evolution: From Human-Machine Ethics to Data Governance


    China has a 5,000-year history and culture. Qian Mu pointed out that "longevity,"
    "continuity," and "comprehensiveness" are the three major characteristics distinguishing
    Chinese culture from other ancient civilizations[\[1\]](#txt006.xhtml#footnote_content_txt006_1).
    Relying on written records, China''s values and modes of to the needs of the times,
    thereby initiating a situation where Confucianism, Buddhism, and Daoism[\[6\]](#txt006.xhtml#footnote_content_txt006_6)
    waxed and waned, alternating in prosperity. However, Confucian doctrine remained
    the mainstream thought, taking "maintaining the mean and valuing harmony" as the
    basic principle and highest value, believing the universe is a harmonious whole,
    and contemplating the relationship between self and the external world with a
    harmony-valued mode of thinking. The *Doctrine of the Mean* opens with "What Heaven
    has conferred is called The Nature; an accordance with this nature is called The
    Path of duty; the regulation of this path is called Instruction." It contains
    a complete philosophical system constituted by heaven-man, internal-external,
    and nature-cultivation; the highest root of this system lies in Heaven, connecting
    heaven and man through the path of "Mandate of Heaven"; the main content of the
    relationship between man and Heaven ultimately focuses on human moral cultivation,
    emphasizing "learning to become a true person," valuing the human world, society,
    and reality, respecting man—valuing human life consciousness, respecting human
    dignity and value; valuing the people—valuing human social personality, advocating
    that individual social status must be won through one''s own efforts, equality
    between people exists at the level of social relations, understanding man from
    human social nature. At the same time, the core cultural characteristic of "Harmony"
    also contains another layer of meaning: "The gentleman aims at harmony, and not
    at uniformity" (*Analects, Zilu*) and "All things are nourished together without
    their injuring one another; the courses of the seasons, and of the sun and moon,
    are pursued without any collision among them" (*Book of Rites, Doctrine of the
    Mean*) emphasize the way of tolerance and harmonious coexistence of all things,
    believing that various different things can exist simultaneously without mutual
    contradiction. This concept has had a profound influence on shaping China''s national
    temperament and characteristics; in its attitude toward technology, it also believes
    that culture and technology can coexist harmoniously and complement each other;
    extending this further, in dealing with the diversity of world civilizations,
    it also adheres to the idea of "harmony without uniformity, seeking common ground
    while reserving differences," striving for win-win outcomes in exchange, integration,
    mutual learning, and mutual appreciation. Chinese President Xi Jinping once pointed
    out: "The Chinese nation has always been a peace-loving nation. Chinese culture
    reveres harmony; China''s ''Harmony'' culture has a long history, containing a
    cosmology of unity of heaven and man, an international outlook of harmonizing
    all nations, a social outlook of harmony without uniformity, and a moral outlook
    of benevolent human hearts."[\[7\]](#txt006.xhtml#footnote_content_txt006_7)


    Today, as AI embeds into all aspects of human society, the moral values accumulated
    over China''s 5,000-plus years face unprecedented challenges. First, the tradition
    of maintaining the mean and valuing harmony has been impacted, and the moral focus
    of "unity of heaven and man" has shifted. Faced with the fact that machine intelligence
    surpasses humans item by item and humans struggle to catch up, the social status
    and value of machine intelligence cannot be ignored; Chinese society increasingly
    values the relationship between humans and machines, incorporating it into philosophical
    theoretical systematic thinking: how to construct a moral system for machine intelligence,
    how to unfold future social development models. Because the connotation of machine
    intelligence is still vague and difficult to define, the value concept of "harmonious
    coexistence" lacks a stable reference object; whether it is daring not to trust
    machines or unwilling to trust machines, harmonious coexistence has become a problem.
    Not only that, the focus of social operation and governance has also shifted.
    In traditional cultural values, education/moral transformation is an important
    means of social integration; people understand human existence, the meaning of
    life, and life value in the process of acquiring knowledge and learning reflection.
    Today, thanks to AI development, people can easily acquire all human knowledge
    to date with the help of computing power, algorithms, and big data; even intelligent
    scheduling knowledge-reserve robots can defeat humans in quiz competitions; whether
    the practice of society constructing shared basic values through moral transformation
    fully works has become an unknown. Human awakening and the formation of human
    consciousness have detached from reverence for and reference to "Heaven"; the
    operational basis of unity of heaven and man will be difficult to maintain; the
    cosmology of harmonious wholeness and the harmony-valued mode of thinking face
    challenges.


    Autonomous driving is the culmination of technologies such as perception, human-machine-thing
    interconnection, big data, high-speed wireless networks, and AI; its core is AI,
    and it is also one of the most controversial and promising fields for AI application
    implementation currently. Baidu is one of the domestic internet giants that ventured
    into AI earlier; with autonomous driving as a main field of deep cultivation,
    the company is committed to helping partners in the automotive industry and autonomous
    driving field combine vehicles and hardware systems to quickly build an autonomous
    driving system. In 2017, Baidu founder, Chairman and CEO Robin Li showed the public
    a video of himself riding in a Baidu-developed autonomous vehicle; in the video,
    Li sat in the front passenger seat, the driver in the driver''s seat did not control
    the steering wheel, letting the vehicle be in autonomous driving mode. Once the
    video was released, social controversy continued; it even alerted the Beijing
    Municipal Public Security Traffic Management Bureau, which responded on its official
    Weibo: actively conducting investigation and verification. Although expressing
    support for driverless technology innovation, it stated it should be legal, safe,
    and scientific. The main reason this issue sparked heated public debate is: once
    an autonomous vehicle has a traffic accident, who should bear the responsibility.
    In traditional Chinese values, moral value acts on people and guides and constrains
    their behavior. When a person drives a car, the person must bear responsibility
    for judgments and behaviors during driving. However, autonomous vehicles lack
    this subject of responsibility; accountability for machines cannot even be discussed.


    Although the moral responsibility of autonomous driving has not been effectively
    resolved, the pace of technological innovation has not stopped. This is both an
    objective need of technological development and an impact of the economic momentum
    brought by AI on social values. In December 2019, Baidu held the first Apollo
    Ecosystem Conference in Changsha, releasing the world''s first point-to-point
    urban autonomous driving open capability, announcing that Apollo had formed linked
    development of three major platforms: autonomous driving, vehicle-road collaboration,
    and intelligent vehicle networking. Apollo possesses 150 autonomous driving road
    test licenses, 1,237 intelligent driving patents, over 3 million km of test mileage,
    road tests in 23 cities, gathering over 36,000 global developers, 177 ecosystem
    partners, and open-sourced 560,000 lines of code. On the premise of leading advantages
    in multiple technologies, this also gives Baidu''s Apollo scale advantages at
    the full-domain technical level. In the same year, Guangzhou officially issued
    the first batch of autonomous driving road test licenses, with 6 companies receiving
    the first batch of intelligent connected vehicle road test notices. With the issuance
    of 5G licenses, 5G communication technology brings greater imagination space for
    vehicle application scenarios; driverless driving is gradually landing in cities;
    WeRide launched fully open operational Robotaxi services in Guangzhou in November
    2019; Baidu also fully opened Apollo Robotaxi services; Changsha users can ride
    for free via Baidu Maps and Baidu App[\[8\]](#txt006.xhtml#footnote_content_txt006_8).
    The landing of autonomous driving services does not mean the end of people''s
    thinking on the "Trolley Problem." The difficulty of the Trolley Problem scenario
    lies in: if a traffic accident occurs, should the car protect the passengers inside
    by crashing into pedestrians, or prioritize protecting pedestrians on the road,
    inevitably putting passengers in danger. The concerns and questions about machine
    responsibility evolved from this basic problem are diverse. For example, in terms
    of numbers: if there is only 1 person in the car but 5 on the road, sacrifice
    1 to save 5, or sacrifice 5 to save 1? In terms of population categories: if there
    is 1 person in the car, and the 1 person on the road is a pregnant woman, elderly
    person, or child, what moral judgment and value choice should the machine make?
    Returning this problem to human manual driving, even without a standard answer,
    people do not feel anxiety before an accident occurs, because people trust human
    moral consciousness, trusting the thinking and judgment formed based on common
    cultural background and value acquisition. However, people dare not trust machines;
    when their behavior may involve moral values that should only belong to humans,
    machines cannot escape these seemingly unfair questions for them, and these questions
    have become an important part of AI ethics. Whether machines can possess self-awareness
    of value judgment, and to what extent this awareness can be universally accepted
    by humans, has become a new moral focus and new content in the discussion of Chinese
    values.


    It is generally believed that humans establish a world of "meaning" and "value"
    through the capacity for self-reflection, distinguishing between humans and things;
    then, does AI possess self-reflective consciousness? People generally worry: once
    AI possesses this reflective consciousness, humans may find it difficult to constrain
    and control it; this may be the greatest threat of AI to humanity. From the perspective
    of traditional Chinese values, Li Zehou believes that "practical rationality"[\[9\]](#txt006.xhtml#footnote_content_txt006_9)
    is a characteristic of traditional Chinese thought in its own nature; it constitutes
    a character-thought pattern based on Confucian thought, enabling the Chinese nation
    to acquire and continue a calm yet warm "Golden Mean" psychology: not violent,
    not mystical, valuing insight... aiming to serve real life and maintain the harmonious
    stability of the existing organic system..."[\[10\]](#txt006.xhtml#footnote_content_txt006_10)
    AI cannot not only imitate this thought pattern to complete its own "cultivation/education"
    process, but may even generate a self-awareness that runs counter to it. From
    an objective fact perspective, although AI currently extends human capabilities,
    continuously changing and enriching the scale of human cognition, AI generating
    self-awareness may still take a long time. At present, AI is mainly technological
    progress at the tool level; however, past technological progress mostly brought
    surpassing of physical strength, while with the massive embedding of AI, it largely
    brings replacement of human mental capabilities, which stimulates and triggers
    a sense of crisis in humanity. Especially for a social-cultural structure like
    China that values history, experience, and tradition. Therefore, Chinese society
    pays more attention to the current status and future trends of machine ethics.
    Some views hold that humans can implant values into AI, but what values are feasible
    and appropriate? Assuming AI must be subject to external constraints, completing
    specific tasks and obeying specific rules under human stipulations, from the perspective
    of current technological development needs, this approach seems highly feasible;
    but from a long-term perspective, this approach undoubtedly buries hidden dangers;
    when machine autonomous learning capabilities enhance, if human moral constraints
    lose effect, will machines develop aversion and retaliatory psychology toward
    past human control? When machines have the capacity to fully autonomize their
    behavior, they will no longer be tools passively used by humans; then, can machines
    bear corresponding responsibility for their own behavior? "Once AI attempts to
    pursue the maximum efficiency of its own existence, it is very likely to actively
    delete human moral programs—from the AI''s perspective, the moral programs set
    by humans for it are equivalent to a ''virus.'' It can be seen that imaginings
    like setting moral programs for AI are meaningless."[\[11\]](#txt006.xhtml#footnote_content_txt006_11)
    From the perspective of machine intelligence posing a threat to humans, some scholars
    believe we should not pursue strong AI; within the scope of weak AI[\[12\]](#txt006.xhtml#footnote_content_txt006_12),
    human-machine relations are still controllable, merely staying at social problems
    originating from machines, still negotiable and solvable within traditional disciplinary
    frameworks of politics, economics, and law. However, if strong AI embeds, for
    Chinese values, lacking the "unity of heaven and man" moral foundation, the credibility
    of machine ethics is doubtful; machines may also be unable to uphold the worldview
    and outlook on life of maintaining the mean and valuing harmony; human dignity
    may be entirely lost, and humans may even face the danger of being replaced as
    a whole.


    ### Responsibility First: From Machine Issues to Data Value


    From historical experience, while enjoying socio-economic development brought
    by scientific and technological progress, we must be highly vigilant against threats
    technology may bring. Chinese social values value responsibility, emphasizing
    responsibility first; therefore, for AI to develop in the long term, it must also
    be able to bear responsibility. But behind whether AI can bear responsibility
    lies the question of whether Chinese society actually trusts AI. There are two
    common discussions: one, can we fully trust AI? Especially when life safety is
    involved; two, can we prevent AI from generating real threats?


    Regarding the first question, AI brings many uncertain factors; safety is uncertain;
    people''s trust in AI remains to be assessed. When decisions involving life safety
    are at stake, people are uneasy entrusting AI to make decisions; even if AI has
    made a decision, people are unwilling to believe it and thus execute according
    to the method given by AI. This is because no matter how much a machine imitates
    humans, it remains strange, a reified existence. Between humans, dialogue and
    communication of the same nature can unfold, and on this basis, trust relationships
    are established through emotional understanding and commonality; however, people
    find it difficult to generate specific emotions toward AI; thus, the establishment
    of trust lacks basic soil. In people''s concepts, AI decisions are merely based
    on emotionless data analysis; data itself still has a pile of trust issues to
    solve, let alone inference decisions based on data? On the other hand, Chinese
    social values believe humans are in social relations; most problems faced are
    not specific problems of a certain field, but often complex problems integrating
    various factors; this complexity cannot yield answers through rational analysis
    alone but must rely on human emotion; machine "thinking" activities are not only
    difficult to explain but also difficult to resonate emotionally with humans; whereas
    between humans, they can simultaneously understand language itself and subtext,
    not only solving problems but also perceiving others'' feelings and making adjustments.
    Therefore, for Chinese society, AI cannot acquire human moral responsibility and
    sense of mission; when encountering danger, no matter how advanced AI is, Chinese
    people will not entrust their lives to AI, letting it make decisions. In the 2019
    sci-fi film *The Wandering Earth*, the navigator Liu Peiqiang played by Wu Jing
    conflicts with the AI MOSS on the issue of saving human lives; Liu Peiqiang refuses
    to obey MOSS''s calculation-based decision result, believing saving human lives
    is more important, and ultimately does not obey MOSS. The Chinese sense of responsibility
    centered on benevolence and righteousness always ranks at the forefront of value
    choices.


    Thinking on the second question relates to how people cognize and define the super-functions
    of AI. People hope AI has superhuman capabilities to help humans do things difficult
    for humans; such AI that only surpasses humans in capability is not the greatest
    threat to humans. As said before, the threat of AI to humans stems from its reflective
    capability, i.e., AI''s self-awareness. Can this threat be prevented? Currently,
    it is unknowable. The Chinese spirit of self-reflection is the basic requirement
    for achieving self-cultivation, family regulation, state governance, and world
    peace; "I examine myself three times a day" is a Confucian tradition, and an indispensable
    part of Chinese culture; it emphasizes internal moral requirements of humans,
    and is also a manifestation of Chinese people''s sense of responsibility. If machines
    can also engage in such mental activities, then where does the meaning of its
    "self-cultivation, family regulation, state governance, and world peace" point?
    If preventing such situations is taken as a premise for AI development, where
    will AI development head? China believes these problems cannot be solved by one
    country alone; human destiny is shared and closely related; as a major world country
    prioritizing responsibility consciousness, China hopes to consult and advance
    with other countries, jointly seeking coping methods, to avoid conflicts arising
    from lack of consensus between countries or social groups.

    '
