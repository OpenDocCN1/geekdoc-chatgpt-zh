- raw: '监测人工智能发展和应用情况。欧盟委员会注重监测人工智能在整个经济活动中的应用和渗透，从中寻找人工智能可能给产业价值链带来的潜在变化以及对社会及法律发展和劳动力市场的影响。欧盟还将对人工智能产品和系统的技术能力进行基准测试，了解技术的实际发展情况，定期对人工智能战略所设定目标的实施进展情况进行评估。


    第三，加大人工智能建设投资。


    加大政府投资。欧洲生产的机器人目前占据全球市场32％的份额[\[34\]](#txt004.xhtml#footnote_content_txt004_34)，为了保持和扩大欧洲领导地位并确保经济和社会发展，到2020年底，欧盟将投入大约15亿欧元。[\[35\]](#txt004.xhtml#footnote_content_txt004_35)


    各成员国也纷纷加大人工智能战略投资，巩固人工智能发展成果并促进进一步创新，鼓励企业或机构进行相关测试和试验，加强高精尖研究中心的建设，保障所有利益相关方的利益，切实关注中小企业的人工智能发展和应用（见表4-1）。如德国在2018—2025年，“投入约30亿欧元资金用于AI研发，达到3.5％的研发目标，其中2019年预算为5亿欧元”。[\[36\]](#txt004.xhtml#footnote_content_txt004_36)


    表4-1　欧盟及主要成员国人工智能战略投资


