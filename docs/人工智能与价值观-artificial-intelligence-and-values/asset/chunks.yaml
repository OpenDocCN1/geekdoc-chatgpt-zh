  trans: '

    In December 2018, the "Three-Year Action Plan for Promoting the Development of
    a New Generation of Artificial Intelligence Industry (2018–2020)" released by
    China''s Ministry of Industry and Information Technology (MIIT) pointed out that
    "AI has a significant spillover effect, which will further drive the progress
    of other technologies, promote overall breakthroughs in strategic emerging industries,
    and is becoming a new driving force for advancing supply-side structural reform,
    a new opportunity for revitalizing the real economy, and a new engine for building
    a manufacturing powerhouse and a cyber powerhouse." In terms of AI empowering
    the real economy, enterprises embed AI applications into production and operation
    processes or combine them with actual industry needs, innovate new algorithm-
    and data-driven business models, and promote the transformation and upgrading
    of the real economy. iResearch Consulting predicts that in 2019, the industry
    scale of AI empowering the real economy approached 57 billion yuan, with the security
    and financial sectors accounting for the largest market shares and best business
    penetration, while marketing, customer service, education, and other industries
    are expected to develop rapidly. Correspondingly, people''s acceptance of AI products
    is also increasing. With the mature implementation and application of speech recognition
    and interaction technologies, smart homes and intelligent customer service have
    widely entered daily life; with the development of facial recognition technology,
    identity verification and monitoring management in public places have become more
    convenient, etc. The market prospects for AI products are broad. Realizing the
    manufacturing of AI products in various fields will be one of the main trends
    in AI industry development. AI appeared in the Government Work Report again in
    both 2018 and 2019, demonstrating the Chinese government''s high attention to
    AI development. The 2019 Government Work Report proposed the concept of "Intelligence+",
    building industrial internet platforms to empower the transformation and upgrading
    of the manufacturing industry, further strengthening the trend of AI integration
    with industries.


    ## Creating a Safe, Efficient, and Convenient Environment


    Chinese society has a beautiful vision for the convenience of life brought by
    AI, taking the construction of a safe and convenient intelligent society as a
    key task. Focusing on four aspects—developing convenient and efficient intelligent
    services, advancing the intelligentization of social governance, utilizing AI
    to enhance public safety guarantees, and promoting mutual trust in social interactions—it
    aims to improve the level of intelligence across society, enabling people to enjoy
    high-quality services and convenient lives to the greatest extent, and making
    social operations safer and more efficient.


    With the development of mobile internet, people''s travel scenarios have been
    enriched and expanded. Ride-hailing was introduced to China in 2010; after several
    rounds of mergers and development, as well as the introduction of government regulatory
    policies, it has embarked on a path of orderly development and has become an important
    choice for people''s travel. As of 2018, the monthly active users of ride-hailing
    services exceeded 190 million. Data from 2019 shows that 247 cities nationwide
    have issued relevant regulatory regulations, over 110 platform companies have
    obtained operating licenses, and 450,000 ride-hailing vehicles have obtained transport
    permits. Behind the rapid industry growth, social problems brought by ride-hailing
    also appear from time to time. Ensuring the safe and healthy operation of ride-hailing
    is crucial for safeguarding people''s livelihoods and promoting harmonious social
    development. Currently, with the help of AI, not only do matching and dispatching,
    supply-demand forecasting, and capacity scheduling provide people with a more
    high-quality and comfortable travel experience, but regulation and real-time tracking
    feedback also strengthen travel safety, guaranteeing consumer confidence. "More
    efficient, more intelligent, safer, more comfortable" has become the goal for
    ride-hailing platforms to upgrade their services.


    With the development of intelligent technology, maintaining social order and stability,
    guaranteeing public life safety and national security have become new tasks entrusted
    by the era. China has proposed building an intelligent detection, early warning,
    and monitoring system for public safety, strengthening the intelligent transformation
    and upgrading of security equipment in key public areas, and supporting qualified
    communities or cities to carry out regional demonstrations of AI-based public
    security. Currently, "AI + Security" is one of the fields with the fastest commercial
    implementation and largest market capacity in AI. In 2018, the market scale of
    AI + Security software and hardware reached 13.5 billion yuan, with video surveillance
    accounting for the vast majority, nearly 90%[\[42\]](#txt006.xhtml#footnote_content_txt006_42).
    According to Jingzhun Data, as of March 11, 2020, there were 349 AI security companies,
    with a total of 267 past transaction events and 132 companies with financing history[\[43\]](#txt006.xhtml#footnote_content_txt006_43).
    Driven by policy and technology, the AI security industry is developing rapidly.
    Chinese security vendors attach great importance to the application of AI; the
    self-developed technology usage rate of AI products by leading enterprises can
    reach over 80%, while R&D investment reaches billions annually, averaging about
    8% of revenue. In January 2018, the National Development and Reform Commission
    (NDRC) proposed the construction task of a "Facial Recognition System Industrial
    Application Platform," which relevant AI enterprises actively undertook, establishing
    a cloud-edge-end architecture industry application system and proposing the concept
    of "AI-defined devices and scenarios," i.e., making devices and solutions adapt
    to actual needs through software and algorithms. As of the end of 2018, they had
    assisted police in various places in capturing nearly 10,000 suspects, winning
    high recognition from the Ministry of Public Security. On this basis of cooperation,
    the "Intelligent Video Analysis Research Center" was jointly established. In addition,
    a facial recognition technology coverage system covering 80% of hub airports has
    been established, spanning multiple scenarios from the outside in, including overall
    monitoring, security checkpoints, VIP lounges, boarding gates, and aprons.


    Furthermore, the production and manufacturing reforms triggered by AI may well
    widen the gap between rich and poor. Those who master technology control the sources
    of wealth and class thresholds, depriving the majority of society of the paths
    to improve their lives and obtain happiness, affecting social stability and long-term
    peace. China has proactively formulated employment response measures to safeguard
    people''s livelihoods. The "New Generation Artificial Intelligence Development
    Plan" not only covers core technical issues such as basic research but also involves
    strategies in talent development, education, and vocational training. China realizes
    the importance of accelerating the adjustment of the existing education model.
    AI education has begun to be popularized in primary and secondary schools, and
    AI vocational education has been strengthened to cultivate specialized AI talents
    to adapt to the changes of the times. In April 2018, the Ministry of Education
    issued the "Action Plan for Innovation in Artificial Intelligence in Higher Education
    Institutions," proposing the construction of a multi-level AI education system,
    building a university education system integrating AI professional education,
    vocational education, and general university education, and encouraging and supporting
    the opening of resources to provide an AI popular science public service platform
    for the general public. Through comprehensive resource allocation, multi-dimensional
    guidance and cultivation, and publicity and promotion, they jointly address possible
    social problems. In maintaining social harmony, the functions of perception and
    prediction are fully utilized to timely grasp changes in public cognition and
    psychology, improving the ability and level of social governance; through the
    extensive application of AI in medical care, cities, justice, education, environmental
    protection, resource monitoring, and other fields, precise and fair services are
    provided, comprehensively improving people''s quality of life and enhancing life
    quality.


    China''s long-standing social values firmly believe that the development of all
    technology and society must take human development as the premise and purpose.
    In the face of AI, the survival safety, dignity, and rights of humans must be
    absolutely upheld, always adhering to the people-centered development principle.
    When technology penetrates human life, while enjoying all the benefits brought
    by technology, people actively think about the deep connections between person
    and person, and person and society. Take data as an example: data once became
    a resource comparable to oil. As the drawbacks of data gradually emerged, in recent
    years, all sectors of Chinese society have reduced their blind worship of data,
    turning to think about how to scientifically utilize rich data resources to do
    more valuable things, striving to avoid unfairness and inequality caused by data.
    How to leverage the advantages of data to drive the development of AI R&D and
    application is one of the important propositions China''s AI development faces
    when making value judgments.


    China has had a tradition of contemplating the relationship between humans and
    things since ancient times. Although the singularity has not yet arrived at this
    stage, once the event of AI surpassing humans occurs, the result will be destructive
    and irreversible. How humans should treat AI is a problem that humanity must face
    on the road of AI development. This problem cannot get a definite answer in a
    short time; it will change with the development of human cognition, machine cognition,
    and human understanding of machine cognition. A scholar made a basic judgment
    on machine intelligence: "They can never reach the comprehensive capabilities
    of humans, especially the capabilities that make humans human—the ability to create
    wisdom and a world of meaning; but they may possess capabilities exceeding humans
    in other aspects—such as memory and calculation; they also cannot reach the rich
    and complex emotions based on the sentience of carbon-based life, but they possess
    the power to destroy humans"[\[44\]](#txt006.xhtml#footnote_content_txt006_44).
    Facing the potential threats of AI, China advocates joint consultation and strengthened
    cooperation, remembering the community with a shared future for mankind to seek
    cooperation and jointly maintain world order.


    China attaches great importance to the healthy development of AI, vigorously strengthens
    guidance on the healthy development of AI, and attaches extreme importance to
    AI ethics and governance issues. At the policy level, it requires seizing the
    major strategic opportunities of AI development, building a first-mover advantage
    in AI development, and accelerating the construction of an innovative country
    and a world science and technology power. In June 2019, the National New Generation
    Artificial Intelligence Governance Specialist Committee released the "Governance
    Principles for the New Generation of Artificial Intelligence: Developing Responsible
    Artificial Intelligence," ensuring AI is safe, reliable, and controllable, promoting
    sustainable economic, social, and ecological development, building a community
    with a shared future for mankind, and proposing eight principles: harmony and
    friendliness, fairness and justice, inclusiveness and sharing, respect for privacy,
    safety and controllability, shared responsibility, open collaboration, and agile
    governance. In addition, in May 2019, the Artificial Intelligence Industry Alliance
    (AIIA) released the "Artificial Intelligence Industry Self-Discipline Convention
    (Draft for Comment)," undertaking the responsibility of industry organizations
    in promoting AI ethical self-discipline. In December 2020, the CPC Central Committee
    issued the "Implementation Outline for Building a Law-based Society (2020–2025),"
    which proposed improving laws and regulations on network services, revising the
    Administrative Measures for Internet Information Services, studying and formulating
    improved management measures for credit information of untrustworthy entities
    on the network, and formulating improved standardized management measures for
    the application of new technologies such as algorithmic recommendation and deepfakes
    in new media formats such as webcasting, self-media, and knowledge community Q&A.


    From 2018 to 2020, China actively hosted world-class conferences related to AI
    themes, building a global platform for equal dialogue and exchange for the healthy
    development of AI. The first World Artificial Intelligence Conference was held
    in Shanghai in 2018. General Secretary Xi Jinping sent a congratulatory letter
    stating that China is committed to achieving high-quality development, and the
    development and application of AI will effectively improve the level of intelligence
    in economic and social development, and effectively enhance the capabilities of
    public services and urban governance. China is willing to carry out exchanges
    and cooperation with other countries in technology exchange, data sharing, application
    markets, and other aspects, and share the development opportunities of the digital
    economy. In 2019, the second World Artificial Intelligence Conference specially
    added an "AI Governance" sub-forum.


    ## Chapter Summary


    China''s social value system has always valued the "unity of heaven and humanity"
    and "holding the center and valuing harmony." In dealing with the complex relationships
    of all things, it believes in the way of "harmony and integration"—harmony without
    uniformity, seeking common ground while reserving differences—harmony between
    nature and society, harmony between individuals and groups, etc. The widespread
    application of AI and the potential presented by machine intelligence challenge
    and reshape this harmonious relationship. Moral values, originally a reflection
    of the relationship between heaven and humans, gradually shift to pay more attention
    to the relationship between humans and machines, examining machine consciousness
    and value systems, and judging machine responsibility, to cope with AI embedding
    into all aspects of the socio-economy. At the same time, as a new production factor,
    data plays a pivotal role in the process of AI development. The prominence of
    data value and the importance of data governance are evident. China possesses
    rich data resources; relatively speaking, the early environment for data collection
    and use was loose, providing great help for technological progress and the convenience
    of people''s lives. With the intensification of data issues and the gradual entry
    of AI development into a period of calm reflection, China has begun to pay more
    attention to the standardized use of data, standardization construction, global
    ethical governance cooperation, and other issues, reflecting the responsibility
    of a major country and the concept of a community with a shared future for mankind.


    Over the past forty years of reform and opening up, China''s scientific and technological
    development has achieved world-renowned results. AI has a strong "leading goose"
    effect with spillover and driving capabilities. China has generally reached a
    consensus to keep pace with the times, and by accelerating the new generation
    of AI, promote technological development, industrial optimization and upgrading,
    and further improvement of productivity, comprehensively empowering socio-economic
    development. In traditional Chinese society, human value was highlighted in relationships
    with others. Whether in daily communication or business dealings, great importance
    was attached to the construction of social relationships. Technological progress
    has brought innovations in communication and consumption methods, lifestyles have
    changed, and the accompanying values have been greatly affected. The sudden outbreak
    of the COVID-19 pandemic in 2020 reflected the value of technology reshaping values.
    People stand at a turning point in the era, actively responding to a series of
    uncertainties and challenges. In addition, China is an ancient civilization whose
    civilization has never been interrupted. For a long time, it was an agricultural
    society; agriculture maintained the smooth operation of society. Whether in terms
    of physical or mental labor, people have developed a consciousness of obtaining
    life dignity and value through labor. The application of machine automation and
    intelligence has replaced many positions and occupations. This change is difficult
    for China to accept in the short term, and people''s psychology bears varying
    degrees of pressure. However, on the other hand, China also sees that new technologies
    are creating new job opportunities and reconstructing social productivity. With
    a positive and embracing posture, China seizes new development opportunities.


    China has always valued the harmonious development of society and the happy and
    healthy lives of its people. The impact of AI has both positive aspects and components
    that lead to negative responses and resistance. When AI is widely applied, China''s
    primary consideration is how to use technology to better serve and improve people''s
    lives, promote economic development and industrial transformation and upgrading,
    bring as few new social problems caused by new technologies as possible to the
    greatest extent, and help solve more social problems. The social significance
    of technology converges here, striving to reach a state of integration and comprehensiveness,
    ensuring that the fruits of scientific and technological achievements are shared
    by the people.


