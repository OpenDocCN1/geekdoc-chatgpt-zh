- raw: '2015年9月10日，腾讯财经发布了一篇题为《8月CPI同比上涨2.0％创12个月新高》的文章，便是由自动化新闻写作机器人Dreamwriter根据算法自动生成，它能瞬时输出分析和研判，在一分钟内将重要资讯和解读送达用户。同年11月，新华社宣布“快笔小新”机器人投入使用，可以快速完成体育财经类的新闻自动写作。2016年在里约奥运会上，由北京大学和今日头条媒体实验室联合研发的Xiaomingbot（张小明）的机器人亮相[\[27\]](#txt006.xhtml#footnote_content_txt006_27)，结合自然语言处理、机器学习和视觉图像处理，通过语法合成与排序学习生成新闻，在奥运会开始后的13天内，Xiaomingbot撰写了457篇关于羽毛球、乒乓球、网球的消息简讯和赛事报道，每天撰稿30篇以上。这样的消息无疑给原本忧心忡忡的人们再次增加一层心理负担，社会就业问题的严重性不容小觑，制定行之有效的应对方法迫在眉睫。尽管如此，大部分人还是愿意相信人工智能带来的是历史性的新就业机会，“新技术不是让人失业，而是让人去做更有价值的事情。每次新技术革命都会引发人们的担心，过去200年大家一致担心新技术会抢走就业机会，事实上，新技术创造了更多新岗位。”[\[28\]](#txt006.xhtml#footnote_content_txt006_28)2018年12月，普华永道发布《人工智能和相关技术对中国就业的净影响》[\[29\]](#txt006.xhtml#footnote_content_txt006_29)报告指出：一方面，人工智能及相关技术在未来20年将取代中国现有约26％的工作岗位，另一方面，人工智能对中国就业的净影响可能将创造约12％的净增岗位，相当于未来20年内增加约9
    000万个就业岗位。2019年4月，人社部、国家市场监管总局、国家统计局发布了13个新职业信息，其中有12个职业是因新技术而产生的，分别是：人工智能工程技术人员、物联网工程技术人员、大数据工程技术人员、云计算工程技术人员、数字化管理师、建筑信息模型技术员、电子竞技运营师、电子竞技员、无人机驾驶员、物联网安装调试员、工业机器人系统操作员、工业机器人系统运维员。


    以一个明显的场景举例，当我们使用一个新软件的时候，系统会让我们勾选一些标签从而为我们推送更符合喜好的内容。内容生产者在平台发布内容的时候，平台也会弹出勾选标签的对话框或者选项，以便更好地推荐内容。这种打标签的做法为人们接收内容推荐提供了便利，但同时正是因为大量标签的存在，数据才有了充分的分析空间和商业价值。数据标签可以清晰地勾勒出用户的基本画像，知道用户最想要什么，以便进行精准的广告投放和营销活动，为商业开辟出了新的发展空间。


    数据标签背后孕育的是新产业的兴起，数据标注公司成为创造新工作机会的重要场地。数据是人工智能的养料，但是大部分从互联网来的数据都会不同程度地存在标签不清楚的问题，在进行算法训练之前，要对这些数据进行严格的清洗和标注。中国是世界上人口大国，劳动力资源丰富但劳动力成本相较于欧美发达国家则严重偏低，可以说中国在数据标注方面的优势远胜于其他国家，同时数据标注也为中国社会带来了新的就业机会，有利于解决庞大的人口压力带来的社会问题。目前，大部分数据标注公司仍主要集中在北京、上海等大城市，但一些技术含量较低的标注业务也在向小城镇转移，数据标注行业已经开始为中国一些偏远城市和农村的劳动力提供新的就业机会。据艾瑞咨询2018年人工智能数据资源定制服务市场细分结构数据显示，语音类数据标注服务和视图类数据标注服务占据绝大规模。[\[30\]](#txt006.xhtml#footnote_content_txt006_30)据智研咨询整理的数据来看，2018年数据标注与审核行业市场规模已达到52.55亿元，行业增长空间充足。[\[31\]](#txt006.xhtml#footnote_content_txt006_31)数据标注行业的增长正是人工智能带来的新就业机会，对于百度、阿里巴巴等科技公司来说，需要标注的数据工作量巨大，倾向于将大部分标注工作外包给第三方公司，既推动了AI的发展，又创造了大量的就业机会。


    从生产层面考虑，自动化机器大规模取代人的工作，对应产生失业的问题，但是这一问题可能会被创造的新的工作机会解决。尽管如此，人们还是需要警惕新工作机会的诞生可能会对当前的劳动力市场造成的巨大干扰，数百万人的择业和人生发展会随着新技术的出现而发生改变。未来社会，新岗位需要的往往是懂技术的人才，人们为了生存，需要不断更新自身的知识与技能，而且这一要求比以往任何时候都要严格和苛刻。人类发明和使用机器是为了提高工作效率，让机器的自动化生产解放人类劳动力，但是目前阶段大部分的人要担心即将被机器抢走的工作，而变得更加主动地接受智能化，接受各种就业再培训计划，这其实是增加了人类的生存矛盾和负担。如果劳动者不学习掌握相关的智能技术，将直接丧失通过劳动获得幸福的权力。在大部分发展中国家，常规劳动所占国民收入份额大幅下降，越来越多的收入流向资本而非劳动力。另一个相关趋势是劳动市场的两极化或空心化，高技能与低技能岗位的就业比例提高，而中等技能岗位的就业率在大多数发展中国家都有所下降。[\[32\]](#txt006.xhtml#footnote_content_txt006_32)


    智能机器取代人类工作的另一因素是基于大数据的分析往往能比人类做出更精准、更快捷的推测。如果将决策权力交给机器，那么作为万物灵长的人如何相信自身的尊严和主体性？人的尊严是中国社会价值观中最为重要的一个组成部分。作为农耕文明大国，劳动从来不仅仅是谋生手段、赚得生存资料，更重要的是人从劳动中获得认可、满足和生活的意义，它代表了个人对社会的价值，“人类毕竟是身体性的存在，生活意义在很大程度上系于感性经验，主要包括劳动经验、待人接物经验以及娱乐经验。当人工智能取代了劳动经验和待人接物的经验时，人类就只剩下娱乐经验，生活经验将变得十分贫乏和雷同。也许在未来人们普遍能够达到衣食无忧，所有人都脱离贫困，但是，在欲望满足之后失去意义，或者说，在幸福中失去幸福，这非常可能是一个后劳动时代的悖论。”[\[33\]](#txt006.xhtml#footnote_content_txt006_33)所以当人的工作机会被机器剥夺，甚至要服从机器的指挥时，失去劳动的人类也会失去劳动的快乐、失去价值，甚至可能会导致人的退化。人与人之间的联系交流也随着机器的大批量引入而减少，人与人之间的关系很有可能异化。当人工智能可以提供一切生活服务时，“一切需求皆由技术来满足，那么一切事情的意义就由技术系统来定义，每个人只需要技术系统而不再需要他人，人对于人将成为冗余物，人再也无须与他人打交道。结果是人不再是人的生活意义分享者，人对于人失去重要性，于是人对他人也就失去兴趣。这是人的深度异化，人不仅会对生命意义产生迷茫，而且变成了非人化的存在。”另一方面，由算法提供的精准推测近来也受到了质疑。中国外卖市场庞大，两大平台饿了么和美团商户数分别为350万和620万，骑手数分别300万和399万[\[34\]](#txt006.xhtml#footnote_content_txt006_34)，消费者使用平台订购外卖的习惯基本成熟，且用户规模持续扩大。在适应市场竞争的过程中，送餐时间成为平台制胜的法宝之一，“快”成为吸引和维护客户的优势条件，然而在“快”的背后却隐藏着危机。2020年，一篇《外卖骑手，困在系统里》引起社会的震撼，基于算法的路线推荐和管理系统忽视了种种客观因素，拼命挤压骑手，造成了巨大的生命和安全事故隐患，算法也许不仅没有使劳动更容易，甚至有可能使劳动更加高危。对于机器的预测和推荐，需要更加审慎地思考。


    人工智能带来的挑战不仅是体力劳动，还波及文化艺术创造活动。2017年，微软的人工智能机器人“小冰”出版了首部由AI创作的诗集《阳光失了玻璃窗》。近年来，人工智能创作的绘画被拍卖，人工智能创作的音乐被传唱等消息不绝于耳，甚至经过媒体的报道已经到达神乎其神的地步，引发了人对自身在文学艺术创作领域主体性地位的怀疑、担忧与思考。长期以来，人类以能够独具一格地从事文学艺术创造活动来显现人生的价值与意义。如今，人工智能是否已经发展到了能够替代人类进行文学艺术创作的程度呢？机器人是否正在抢夺人的劳动创作权？人是自然界中能够借助工具和智能与其他物种抗衡的生物体。从远古时代到农业文明时期，再到工业革命时代，人不仅认识世界、改造世界，还发展形成涉及审美、艺术、人生意义等诸多精神领域的思考，“艺术创造和欣赏过程中人的主体性和艺术作品中的情感性”[\[35\]](#txt006.xhtml#footnote_content_txt006_35)是人们就艺术的本质达成的共识，也是人最闪光的地方。“人在自然状态中萌生主体意识的表达，当从只有主体意识的人成为能创造出艺术品的艺术家时，还需要纯粹的内在生产机制才能创造出艺术品、如想象力和创造力、一定的艺术技巧、个人性情及生活经历。”如果人类的艺术创作需要以上的因素，那么人工智能的创造又应该如何定义呢？


    好在人工智能对人类劳动创作权的争夺从目前看几乎是微乎其微的。人工智能作为一种新技术具有开创性和创造性，但是它却不具备艺术创作的精神性和情感性，所谓的人工智能创造，只是基于大量数据学习的算法模型的产物。微软“小冰”创作的诗歌，并不具有真正的意境或者说只是机器学习后产生的意象拼贴，读起来语言晦涩且结构不完整，“小冰绝无人类生命体验的温度波动，天然缺失需要倾诉的情感相符”[\[36\]](#txt006.xhtml#footnote_content_txt006_36)，同样，AlphaGo也并不具有同人类般的“围棋智慧”，它只是储存了人类历史上所有的围棋对弈数据，通过神经网络、深度学习等技术，对这些数据进行快速地分析与处理，得到相应的统计规律，按照这个规律与人类下棋，所以它使用的全部知识归根到底还是来源于人类。智能机器可以掌握创作的技法、获得相应的知识储备，但是无法体验作品背后的情感，这是人类对劳动创作权的掌控和幸福价值获取的重要途径之一。


    ## 融会贯通：至真至善、科技为民


    中国错失了前三次工业革命带来的发展机遇，在科技方面长期处于跟跑地位。以人工智能为核心的第四次工业革命为中国带来新的发展机遇，中国奋起直追，在一些领域迈向了并跑，甚至是领跑阶段。作为人口大国，中国强调人工智能对经济的引领带动作用，推动经济社会各领域从网络化、数字化向智能化加速发展。按照2017年出台的《新一代人工智能发展规划》的指导思想，要加快人工智能与经济、社会等领域深度融合为主线，以提升新一代人工智能科技创新能力为主攻方向，发展智能经济，建设智能社会，维护国家安全。


    ### 打造开放共享的创新体系


    科技在中国现代化建设进程中扮演着史无前例的重要角色，中国的《“十三五”国家科技创新规划》中指出，坚持把科技为民作为根本宗旨。紧紧围绕人民切身利益和紧迫需求，把科技创新与改善民生福祉相结合，发挥科技创新在提高人民生活水平、增强全民科学文化素质和健康素质、促进高质量就业创业、扶贫脱贫、建设资源节约型、环境友好型社会中的重要作用，让更多创新成果由人民共享，提升民众获得感。


    中国高度重视人工智能作为新一轮产业变革的核心驱动力释放出的巨大能量，将人工智能上升为国家战略，出台专门的《新一代人工智能发展规划》，对未来社会抢抓发展的重大战略机遇，构筑人工智能的先发优势，加快建设创新型国家和世界科技强国做出整体部署，并持续对智能产业、智能产品和智能生活的重点领域进行细化，指引人工智能更好地赋能传统产业转型升级、迈向智能化，加快与实体经济的深度融合。以市场需求为导向，以产业应用为目标，激发企业创新活力和内生动力，探索人工智能成果转化落地的方法和路径，积极构建数据驱动、共创分享的智能经济形态。


    未来，人工智能无处不在。在不同的领域或出于不同的研究目的，所下定义不同，但是“从本质上看，人工智能是指由人工创造的智能，与其对应的是生物进化所形成的‘自然智能’，特别是具有最高智慧的‘人类智能’。人工智能与自然智能在智能的形成过程中，最大的不同之处在记忆、分析推理、决策三个环节”[\[37\]](#txt006.xhtml#footnote_content_txt006_37)。正是这三大不同之处，人们认识到现阶段所谓的智能活动还主要是对人类行为的模仿，人工智能的本质是计算。智能活动已经在算法推荐、算法决策、数据评估、数据分析等方面运用广泛且成熟。积极的一面是，人工智能确实能帮助我们更好地认识外在世界，提高工作效率。作为一项技术，人工智能可以弥补人类在某些“能力”上的不足，比如信息的收集与处理，无论是信息的收集量级还是处理速度都使人类望尘莫及。不过，从消极的一面来看，由智能引发的问题也会威胁到人类自身的生存。中国社会强调技术的最终目的是服务人民，紧紧围绕人民的生活需求，大力发展智能产品、智能产业。人们普遍接受人工智能的发展现今还处于弱人工智能的初期阶段，尚不用担忧奇点临近或者是强人工智能发展而引发的人机不可调和矛盾。与之相比，如何解决深度学习的不可解释性问题则迫在眉睫。这一问题直接关系到人们在某些场景中是否使用人工智能以及如何使用人工智能。中国科学家和算法研究者持积极的态度，正努力寻找解释机制，并取得了阶段性的成绩。


    人工智能相关产业是面向未来、在全球竞争中占据优势的重要产业，人工智能研究和伦理问题的应对离不开各类高层次人才提供的智力支持，人工智能人才队伍建设极为重要。据亿欧报告分析[\[38\]](#txt006.xhtml#footnote_content_txt006_38)，中国着重强调建设AI专业教育、职业教育和大学基础教育于一体的高校教育体系，在研究生阶段强调“人工智能+X”相关交叉学科的设置，分层次培养人工智能应用型人才。尽管中国高校课程设置起步较晚，但目前已经在迎头追赶。中国人工智能应用型人才培养受到政府和教育部门的大力推动，服务人工智能产业发展，加快培养符合人工智能领域发展需要的创新型应用型人才。


    经过多年的持续积累，中国在人工智能领域取得重要进展，“2020年中国在世界范围内的人工智能期刊论文引用次数首次超过了美国”[\[39\]](#txt006.xhtml#footnote_content_txt006_39)，人工智能创新创业日益活跃，一批龙头骨干企业加速成长，在国际上获得广泛关注和认可。百度、阿里、腾讯、华为四家企业（BATH）发挥各自在互联网和信息化领域积累的优势与经验，纷纷开展面向人工智能落地的专业化事业群布局，进行大规模的内部组织架构及技术体系的调整，一方面为中小型人工智能企业提供数据和服务支持，另一方面在各自优势领域打造人工智能科技创新体系，在具体技术层、场景应用层全面铺开业务，引领中国人工智能产业发展。2017年，中国宣布了首批国家新一代人工智能开放创新平台名单，分别为：依托百度公司建设自动驾驶国家新一代人工智能开放创新平台、依托阿里云公司建设城市大脑国家新一代人工智能开放创新平台、依托腾讯公司建设医疗影像国家新一代人工智能开放创新平台、依托科大讯飞公司建设智能语音国家新一代人工智能开放创新平台。四大平台在人工智能各领域发挥作用，百度自动驾驶帮助汽车行业及自动驾驶领域的合作伙伴结合车辆和硬件系统，快速搭建一套自动驾驶系统；腾讯AI医学影像产品——腾讯觅影是首款AI食管癌筛查系统，准确率超过90％；在肺结节方面，觅影可以检测出3
    mm及以上的微小结节，检测准确率超过95％。[\[40\]](#txt006.xhtml#footnote_content_txt006_40)


    人工智能的应用范围极广且行业前景可观。在经济生活方面，人工智能参与到企业管理流程与生产流程，并向消费者提供具有针对性的产品与服务，同时通过对数据的洞察分析，满足消费者潜在需求，人工智能在制造业、物流仓储与配送、市场销售与供应链周转等方面满足了经济生产的新需要，并产生了积极的反馈；在智能农业领域，人工智能被用来支持数据的采集与处理，帮助监测农情以及病虫害防治等，并可以涵盖从生产计划到终端销售的整个流程。腾讯AI
    Lab专家曾建立了一套模拟气候环境和作物生长的仿真器，在遥感技术的支持下，在50 mm2的温室里种出了3000 kg以上的黄瓜，种植水平相当于10年种植经验的人类种植者[\[41\]](#txt006.xhtml#footnote_content_txt006_41)；在政治生活方面，智能化助力政府服务人民的水平升级，利用人工智能赋能基层工作人员可以极大地提高工作人员的办事效率，有效缓解与改善政务服务部门的人力资源局限问题；对政务服务过程各环节进行精准梳理和分析，有效辨别多余环节，大幅提高办事效率、减少行政延迟；以数倍于人力的效率实现证照、文件、公文等的流转以及办事过程数据的传递；通过人工智能应用，对审批数据信息的价值挖掘和知识管理；快速了解服务对象需求，定制服务；识别重点企业人员，提升决策的针对性等；准确把握公众的办事需求和可能存在的疑难问题；有效收集、存储以及分析公众对于政务服务流程、工作内容、工作态度等方面的建议和意见，有针对性的改进工作中的不足；汇聚个性化办事数据，通过大数据挖掘分析公众行为习惯，智能推送公众关注度高、与公众紧密相关的信息，为公众提供个性化、推送式服务等，为智能政务的开展和城市治理提供便利。


    早在2016年，由中国国家发展改革委、科技部、工业和信息化部、中央网信办印发实施了《“互联网+”人工智能三年行动实施方案》，贯彻落实创新、协调、绿色、开放、共享发展理念，从科技研发、应用推广和产业发展等方面提出了一系列措施。2017年7月，国务院发布《新一代人工智能发展规划》，明确了人工智能发展三步走的战略目标，到2030年使中国人工智能理论、技术与应用总体达到世界领先水平，成为世界主要人工智能创新中心。规划指出要围绕增加人工智能创新的源头供给，从前沿基础理论、关键共性技术、基础平台、人才队伍等方面强化部署，促进开源共享，系统提升持续创新能力，确保中国人工智能科技水平跻身世界前列，为世界人工智能发展作出更多贡献。同年，人工智能被首次写入政府工作报告，报告指出：加快培育壮大新兴产业。全面实施战略性新兴产业发展规划，加快新材料、新能源、人工智能、集成电路、生物制药、第五代移动通信等技术研发和转化，做大做强产业集群。'
