    # Chapter 2 Reshaping of Values Brought by Artificial Intelligence Development


    ## From Technology to Industry: The Revolutionary Transformation of Artificial
    Intelligence


    Artificial intelligence is a technology that simulates human cognitive capabilities
    through machines. This technology covers many professional fields, such as machine
    learning, deep learning, knowledge reasoning, human-computer interaction, big
    data analysis, pattern recognition, natural language processing, large-scale computing
    systems, and distributed systems, etc. From concept formation to technological
    implementation, artificial intelligence has undergone more than 60 years of exploration.
    However, ideas related to artificial intelligence have existed since ancient times,
    traceable to philosophy, fiction, and imagination. The ideological origins of
    replicas and robots can be found in ancient legends. For example, the bronze automaton
    Talos in the ancient Greek myth *Argonautica*; the robot warriors dispatched by
    King Ajatasatru in Indian legend to guard the relics of the Buddha; medieval legends
    of using witchcraft or alchemy to endow inanimate matter with consciousness, etc.


    The basic assumption of artificial intelligence is that the human thinking process
    can be mechanized. Research on mechanized reasoning has a long history. Famous
    examples include Aristotle (who formally analyzed syllogistic logic), Euclid (whose
    *Elements* is a paradigm of formal reasoning), and Al-Khwarizmi (the pioneer of
    algebra; the word "algorithm" evolved from his name). As early as the 13th century,
    the pioneer of computation theory, philosopher Ramon Llull, developed some "logic
    machines," attempting to acquire knowledge through logical methods. In the 17th
    century, German mathematician Leibniz, the founder of the British rationalist
    tradition Thomas Hobbes, and French mathematician René Descartes attempted to
    systematize rational thinking into a system like algebra or geometry. These philosophers
    had already explicitly proposed the hypothesis of formal symbol systems, which
    became one of the guiding ideas of artificial intelligence research in later generations.


    In the 20th century, breakthroughs in mathematical logic research laid a solid
    foundation for artificial intelligence. Foundational works in this area include
    British mathematician George Boole''s *The Laws of Thought* and German logician
    Gottlob Frege''s *Begriffsschrift* (Concept Script). Based on Frege''s system,
    Russell and Whitehead (Alfred North Whitehead) gave a formalized description of
    the foundations of mathematics in *Principia Mathematica*. This achievement inspired
    Hilbert (David Hilbert) to pose a fundamental problem to mathematicians in the
    1920s and 1930s: "Can all mathematical reasoning be formalized?" The final answer
    to this question was given by Gödel''s incompleteness theorems, the `Turing machine`,
    and Alonzo Church''s `λ-calculus`. They first proved the limitations of mathematical
    logic; second, their work implied the possibility that any form of mathematical
    reasoning could be mechanized within these limits, which is extremely important
    for artificial intelligence.


    The 1940s was the germination period of artificial intelligence. In 1943, American
    neurophysiologist W. McCulloch and mathematical logician W. Pitts published a
    mathematical model of neural networks (`M-P neural network model`) in the *Bulletin
    of Mathematical Biophysics*. By summarizing some basic physiological characteristics
    of neurons, they proposed a formalized mathematical description of neurons and
    structural methods for networks, thus opening the era of neural computation. In
    1945, Hungarian-American mathematician John von Neumann proposed the stored-program
    concept. In 1946, the first electronic computer `ENIAC` was successfully developed.
    They both laid the material foundation for the birth of artificial intelligence.
    In 1948, American mathematician Claude E. Shannon published the epoch-making paper
    *A Mathematical Theory of Communication*, marking the birth of a new discipline—information
    theory. He believed that human mental activities could be studied in the form
    of information and proposed a mathematical model describing mental activities.
    In 1948, American applied mathematician Norbert Wiener founded cybernetics, a
    discipline that studies and simulates biological and artificial systems of automatic
    control, marking that the foundation for computer simulation research and analysis
    based on animal psychology and behavioral science had been formed.


    1956—1969 was the formative period of artificial intelligence. In the summer of
    1956, John McCarthy, Marvin L. Minsky, and others initiated a two-month academic
    seminar at Dartmouth College around the question of "how to use machines to simulate
    human intelligence," proposing the term "artificial intelligence," marking the
    formal birth of this discipline. During this stage, key areas such as theorem
    proving by machines, problem solving, `LISP language`, and pattern recognition
    all achieved major breakthroughs. In 1956, American computer scientists Allen
    Newell and Herbert Simon established the "`Logic Theorist`" program, which could
    simulate the thinking patterns of humans using mathematical logic to prove theorems,
    and proved 38 theorems in Chapter 2 of *Principia Mathematica*. After improvements,
    it proved all 52 theorems in that chapter in 1963. This work was highly praised
    and considered a major achievement in computer simulation of human advanced thinking
    activities, the true beginning of artificial intelligence.


    In 1956, Arthur Samuel, the father of machine learning, developed a checkers program
    with learning capabilities. The program could learn from game records and summarize
    experience in practice. It defeated Samuel himself in 1959 and the checkers champion
    of a U.S. state in 1962. This was a successful exploration in simulating the human
    learning process and a major breakthrough in artificial intelligence. In 1958,
    the list processing language program `LISP` developed by John McCarthy could not
    only process data but also conveniently process symbols, becoming an important
    milestone in artificial intelligence programming languages. To this day, `LISP`
    language remains an important programming language and development tool for artificial
    intelligence systems. In 1960, Newell, Simon, and John Clifford Shaw et al. developed
    the `General Problem Solver (GPS)`, a summary of human thinking activities during
    problem solving. They discovered that human thinking activities in problem solving
    include three steps: ① First, conceive a rough plan; ② Implement the problem-solving
    process according to axioms, theorems, and solution plans in memory, following
    the plan; ③ During the implementation process, continuously analyze methods and
    goals, and revise the plan. They proposed the concept of heuristic search for
    the first time.


    In 1968, American computer scientist Edward A. Feigenbaum et al. successfully
    developed the chemical analysis expert system `DENDRAL`. Its function was to analyze
    mass spectrometer spectra to help chemists determine molecular structures. This
    was considered the germination of expert systems and a successful attempt of artificial
    intelligence research moving from general thinking discussion to specialized knowledge
    application. The emergence of expert systems meant that artificial intelligence
    began to move from mainly theoretical research to practical application, but at
    the same time, its research moved from general thinking to specialized knowledge
    application—that is, scientists'' efforts became more "down-to-earth" and more
    "weak AI." At this time, because machine learning models were still "artificial,"
    as the application of expert systems deepened, their inherent shortcomings—difficulty
    in knowledge acquisition, weak reasoning ability, and high upfront labor costs—were
    exposed, and artificial intelligence research began to ebb. 1974—1980, the immaturity
    of artificial intelligence and people''s disappointment that previous huge investments
    failed to produce expected returns led it into the first trough.


    In 1981, Japan announced to the world that it would begin developing the fifth-generation
    computer, prompting the United States, Europe, the Soviet Union, and other countries
    and regions to successively re-approve and support artificial intelligence research
    in the mid-1980s. In 1986, Canadian computer scientist Geoffrey Hinton et al.
    proposed the `backpropagation algorithm`, the foundational concept of deep learning.
    With improvements in machine learning methods such as knowledge engineering, and
    machine learning beginning to adopt decision tree models and multi-layer artificial
    neural networks, artificial intelligence entered a second period of prosperity.
    1987—1993, computer performance had made great strides, attempting to solve problems
    by establishing computer-based expert systems, but due to limited data and over-reliance
    on empirical knowledge and rules, it was difficult to build effective systems,
    and capital and government support withdrew again, ushering in a second trough
    for artificial intelligence. However, during this period, AI R&D continued, and
    the development of network technology, especially internet technology, pushed
    artificial intelligence further toward practical application. By the end of the
    20th century, the field of artificial intelligence blossomed again; its landmark
    event was the 1997 victory of International Business Machines Corporation (IBM)
    `Deep Blue supercomputer` over world chess champion Garry K. Kasparov.


