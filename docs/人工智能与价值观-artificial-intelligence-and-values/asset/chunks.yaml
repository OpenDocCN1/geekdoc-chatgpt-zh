    \n联系电话：021-33854186\n\n\uFEFF\n\n# 内容提要\n\n人工智能正在以润物细无声的态势，进入各个产业领域和社会方面，预示着科技与经济、社会、生活融合的未来景象。深入了解人工智能的应用情况，准确评估其对社会道德价值体系产生的影响，将是我国应对下一个快速发展时期的重要手段，以便明确前进方向，实现精细治理，维护社会价值体系在科技大潮中的稳定和可持续发展。\n\
    \n\uFEFF\n\n# 编　委　会\n\n主　　任　李仁涵　黄庆桥\n\n成　　员　杨小康　何黎明　沈辛成　叶　璐\n\n　　　　　翟云杰　周　正　李芳薇　黄蕾宇\n\
    \n\uFEFF\n\n# 章节分工\n\n第一、二章：李芳薇（北京大学）\n\n第三章：沈辛成（上海交通大学）\n\n第四章：叶璐、翟云杰（上海交通大学）\n\
    \n第五章：周正（上海交通大学）\n\n第六章：黄庆桥、黄蕾宇（上海交通大学）\n\n后　记：李仁涵、沈辛成（上海交通大学）\n\n\uFEFF\n\n#\
    \ 序\n\n2015—2020年，人工智能呈现爆发性增长，已开始“嵌入”到人们生产和生活之中，美国、欧盟、英国、日本、韩国、东盟、中国等国家和地区，纷纷加强顶层设计，成立专门机构统筹推进人工智能重大科技研发项目。目前看，人工智能已从自由探索的科研模式转型升级为国家战略推动创新发展的模式。各国政府、大学、科研机构、产业、金融界等竞相争夺该领域的前沿阵地，不同层面的布局都指向同一个预判：在未来数十年间，人工智能有着改变全球社会的巨大潜力。\n\
    \n2018年1月，上海交通大学人工智能研究院成立并揭牌，同年2月，获批建设人工智能教育部重点实验室。2019年，上海交通大学成为全国首批人工智能专业建设高校；在研究生教育层面，上海交通大学设立了吴文俊人工智能荣誉博士班，着重培养人工智能领域领军人才。与此同时，上海交通大学坚持“扎根上海、辐射长三角、服务全国”的宗旨，为中国人工智能产业的发展提供坚实的智力支持。上海交通大学牵头共建的上海人工智能研究院有限公司，正实现平台实体化运行，并与上海交通大学苏州人工智能研究院和上海交通大学宁波人工智能研究院共同完成“上海—宁波—苏州长三角人工智能协同创新平台”布局，联合探索人工智能校地之间“政产学研用金”的合作。\n\
    \n三年来，上海交通大学不仅在人工智能理论、技术、应用及人才培养等方面谋求发展与进步，同时也高度重视人工智能带来的社会层面问题的研究，《人工智能与价值观》一书就是其中的一项研究成果。该书在编写过程中，以历史眼光和全球视角审视人工智能的发展，资料翔实、文风简朴，秉持理性、客观、严谨的学术研究态度，通过对技术革命中的价值观演变、人工智能发展带来价值观的重塑、人工智能与美国价值观、人工智能与欧洲价值观、人工智能与日本价值观、人工智能与中国价值观等方面的研究，提出了重视人工智能发展的国家需要团结协作，求同存异，寻求最大的价值公约数，是关乎到人类集体共有的未来；提出了全球在人工智能发展的同时，高度共同关注以人为本、和而不同、人类命运共同体等问题。\n\
    \n当前，由于人工智能发展处于初级阶段，该书在编撰中尚存在不足、疏漏和错误之处，希望编委们在今后能够持续跟踪、不断完善与修正，为人工智能持续健康发展做出应有的贡献。\n\
