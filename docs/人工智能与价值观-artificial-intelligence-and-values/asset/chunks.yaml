- raw: "哲学思想中的价值观理念，有着丰富的实践内涵与实际意义。正如法国哲学家吉尔·利波维茨基（Gilles Lipovetsky）指出：“一个社会不应局限于物质生产和经济交流。它不能脱离思想观念而存在。这些思想观念不是一种‘奢侈’，对它可有可无，而是集体生活自身的条件……没有价值体系，就没有可以再生的社会集体。”[\\\
    [31\\]](#txt001.xhtml#footnote_content_txt001_31)多样且不断变化的价值观是不同民族、阶级、社会集团在特定历史时期对社会问题不同看法和措施的体现。\n\
    \n价值观念的变革与科学技术的发展密切相关。历史上，牛顿力学的创立造就机械论的思维方式，英国哲学家、自由主义之父约翰·洛克（John Locke）由此得到启发，提出“人本位”观念代替“君本位”，彻底改变了当时人们对自身和社会价值的认知，其影响一直延续到英国宪政实施、启蒙运动和法国大革命。[\\\
    [32\\]](#txt001.xhtml#footnote_content_txt001_32)科学技术对精神文明的特殊社会功能、对政治格局强有力的影响、乃至对尖锐的政治如战争起到的决定性作用，印证了技术不仅能够赋能与赋权，而且其本身就构成一种权力的行使和对传统权力模式的替代。\n\
    \n价值观的引导作用将体现在不同国家及个人如何看待人工智能问题，而所有具体的政策制定又反映了一个社会在智能时代建构着怎样的价值观。尽管人工智能领域的技术更迭十分迅速，但其对任务进行系统化和自动化的核心思想并未改变。因此，研究者应当先从理论层面去研究问题，准确地剖析概念，明确价值诉求，最后尽可能地将它们转化为实际行动。研究者有义务思考如何将抽象的理论落实到实践当中，努力寻求使人工智能的发展更符合公众利益和人类公平所应该具有的价值目标。\n\
