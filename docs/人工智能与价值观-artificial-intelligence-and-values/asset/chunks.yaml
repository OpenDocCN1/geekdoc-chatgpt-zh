    ## Algorithm Transparency and Fairness: The Case of Facebook


    ### Facebook''s Algorithmic Black Box


    In reality, however, even well-intentioned companies that deliberately wish to
    disclose their algorithms face obstacles due to technical considerations and trade
    secrets. Take Facebook as an example. In the past, when encountering individuals
    exhibiting suicidal tendencies in real life, we naturally lend a helping hand,
    inferring from low moods or abnormal behavior. Yet some people behave normally
    in daily life but have long accumulated expressions of depression online. When
    social media platforms become tree holes for people to dump their privacy, social
    media can judge suicidal tendencies faster and more accurately than humans through
    artificial intelligence. Facebook''s researchers not only analyzed the language,
    vocabulary, and emojis accompanying suicidal tendencies but even conducted retrospective
    analyses of the lifetime data of Facebook users who had already committed suicide
    to predict similar situations. In November 2017, Facebook announced the deployment
    of this new AI: when a user exhibits suicidal tendencies, the AI alerts staff
    members, who then conduct "wellness checks" on the user and intervene in their
    self-harm behaviors. But when asked about algorithmic details, the product''s
    deputy manager, Guy Rosen, remained tight-lipped, saying only that inferences
    could be made from common times of low mood, concerned comments from friends and
    family, and text content in user posts, but refusing to discuss the algorithm
    itself. Simultaneously, Facebook repeatedly emphasized its close cooperation with
    traditional suicide and self-harm prevention organizations, attempting to speak
    through offline results.9


    In actual operation, Facebook''s system may have various problems. For instance,
    the AI may falsely flag users, who then have no way of knowing or reporting the
    error to the system; when flagged users receive messages like "You might need
    extra help right now, please reach out to us," they themselves may not know they
    have been placed under surveillance, monitored not by machines and platforms,
    but by living, breathing Facebook employees. Furthermore, this algorithm can be
    weaponized by malicious actors to harass and discriminate against netizens in
    poor mental states. Notably, even Facebook''s official partner, the "Crisis Text
    Line" (CTL), did not know Facebook had developed such a system in the backend.
    Although CTL stated they also used algorithms to predict suicidal tendencies in
    messages users sent them (e.g., the word "ibuprofen" signaling a spike in suicide
    risk), Facebook remained opaque even with partners while testing AI on such a
    massive user population, inevitably raising doubts.10


    Facebook''s practice of using AI as a shield is not an isolated case. In the spring
    of 2018, Facebook was deeply mired in the scandal of foreign powers infiltrating
    its platform to interfere in US elections. CEO Mark Zuckerberg mentioned AI dozens
    times during congressional hearings, dumping many inexplicable technical and ethical
    issues onto AI. The 2016 presidential election rapidly intensified long-standing
    social contradictions in the US, and the rapid growth of social media like Facebook
    provided a fast lane for external forces. The election''s aftermath did not end
    with the new president''s inauguration; Facebook''s mismanagement became an enduring
    hot topic—fake accounts, hate speech, terrorist propaganda, click farms, alleged
    Russian interference, privacy security... Faced with these issues, Zuckerberg
    uniformly evaded with AI. Admittedly, AI does possess the ability to search keywords
    and analyze content, alleviating the chaos of the online information space to
    some extent, but natural language processing remains insufficient, especially
    regarding the judgment of "fake news," which involves the value system of the
    judging subject. Facebook is unwilling to elaborate on its judgment methods. Tech
    media *The Verge* commented on Zuckerberg''s congressional performance: frequently
    using the term "AI" before a group of older laymen was essentially evading the
    problem. When asked by Michigan Senator Gary Peters about AI algorithm transparency,
    Zuckerberg only said "This is a very important issue," Facebook takes it very
    seriously and has a dedicated team, but revealed absolutely no willingness to
    make its algorithms public.11


    Regarding Facebook, critics argue: although Facebook often discusses government
    and corporate transparency, what it truly wants to advance is individual transparency,
    the so-called "radical transparency" or "ultimate transparency."12 Facebook uses
    inductive, paternalistic methods to guide you toward content and people you might
    like, helping you find political like-minded allies, forming self-satisfying online
    echo chambers, continuously providing positive feedback to users, and enhancing
    the excitement of political participation. However, the flaws of this practice
    were fully exposed in the Cambridge Analytica case—when this data was sold through
    layers of outsourcing, once it fell into the hands of malicious actors midway,
    it could not only be used to interfere in US domestic affairs but also pose a
    universal threat to civil rights. In the Cambridge Analytica case, Facebook platform
    data was sold, violated, and abused in the process of changing hands, while Facebook
    remained oblivious and helpless. This shows that when the principle of "openness"
    is applied to social media of Facebook''s scale, besides algorithmic transparency,
    there needs to be continuous disclosure of data flows and long-term oversight.
    For a company that profits from data, this is tantamount to negotiating with a
    tiger for its skin.


    ### Multi-stakeholder Participation as a Path to Openness and Fairness


    Closer to livelihood than reading political news are bank loans and welfare distribution.
    Today, AI has begun to be widely used by banks and governments to assess personal
    credit and economic status, yet why some applications are rejected and others
    accepted often cannot be given a fully convincing answer even by the users of
    AI, let alone the developers. This is because many AI designs, especially neural
    networks, operate in an untraceable manner. Professor Anupam Datta of Carnegie
    Mellon University''s Computer Science and Electrical Engineering departments developed
    a Quantitative Input Influence (QII) system in 2016, attempting to reveal the
    respective weight of each factor in the final lending decision, thereby observing
    whether race or gender played a discriminatory role. Datta pointed out that some
    companies have released algorithmic transparency reports, but these reports disclose
    limited computational foundations; QII''s goal is to form truly transparent reports.
    The QII method does not merely examine which single variable has the greatest
    influence but quantifies the combined force of a set of inputs.13 For example,
    when a bank decides on lending, if high-income women and high-income men have
    extremely similar approval probabilities, it is hard to conclude the bank is suspected
    of gender discrimination; but if low-income men obtain loans more easily than
    low-income women, the revealed issue is more complex than simple gender discrimination—it
    involves gender division of labor among low-income groups, differences in career
    development potential that may not be as significant in high-income groups.


    Pressure to disclose algorithms and open source comes not only from within US
    society but also from external competition, such as Chinese peers. In the second
    half of 2018, several major US tech companies launched tools to optimize AI fairness,
    including Facebook''s Fairness Flow, Microsoft Research''s data preprocessing
    and output prediction, Google''s "People + AI Research" (PAIR) initiative, IBM''s
    AI OpenScale tools and AI Fairness 360 toolkit. One background for this series
    of actions is competition from Chinese peers. In January 2018, the China Electronics
    Standardization Institute released the *Artificial Intelligence Standardization
    White Paper*, with many industry-related enterprises participating in the writing,
    showing China''s AI moving from savage growth into orderly development.14 Compared
    to administrative constraints, US leading enterprises view open-source sharing
    and bottom-up industry self-regulation as the best governance means. If enough
    programmers and developers can jointly witness and supervise the making of algorithms,
    it can ensure that the models and algorithms developed by major tech companies
    are relatively transparent.15


    High-quality, high-transparency fairness and justice can only be effectively maintained
    by inviting more subjects to participate, a participation unrestricted by nationality
    or industry. As AI deepens in the lives of ordinary people, the trust relationship
    between AI users and the public will be indispensable. Of course, this must be
    based on a benevolent premise: that when enterprises or states use AI, they will
    publicly announce it. In this sense, AI algorithms'' action on values is a double-edged
    sword: on one hand, it may expose more and more historical value maladies, providing
    an opportunity to face and solve them; on the other hand, it may prompt more and
    more enterprises in more and more scenarios to choose not to disclose the presence
    of AI tools. If the social effects of AI are shielded as a whole, this brings
    variables to a value orientation toward good.


    ## Safety and Accountability: Ethical Challenges in Human-Machine Integration


    Gun proliferation is one of the most troubling social issues in the US today,
    but also the most unique embodiment of its values. When the Second Amendment to
    the US Constitution was established, its primary consideration was safety: universal
    gun ownership could both resist foreign invasion and deter the domestic government''s
    intrusion into private space; it was an assertion and praise of private rights,
    and the Fourth Amendment''s prevention of power searching private space follows
    the same logic. After nearly three centuries of development, the balance between
    these two considerations (external and internal) has gradually tilted—guns remain
    a cultural symbol of freedom and safety for ordinary Americans, but privacy has
    become increasingly less important. The same applies at the state level: US military
    values externally increasingly emphasize strict control, while the public does
    not mind their own government''s overreach, even enjoying the exchange of data
    privacy for personal safety.


    ### Contemporary Continuation of the "Closed World" Cold War Military View


    In fact, this imbalance can be traced back to the late 19th century. At that time,
    the wealth and social status of engineers and the managerial class were rising,
    and vertical integration prevailed among enterprises. This measure placed the
    main production processes under a single organizational structure, reducing costs
    and increasing efficiency through control and scale, seizing shares in emerging
    urban markets through high-volume, low-margin tactics. This value pursuit of safety
    and stability incentivized enterprises to further merge upstream and downstream
    companies to ensure data remained long-term visible, accessible, and controllable.
    By 1911, when *The Principles of Scientific Management*, advocating quantitative
    management of labor, was published, author Taylor could explicitly state: "The
    emerging management doctrine applies not only to enterprises but also to families,
    farms, churches, charitable organizations, universities, and even government departments."16


    The tense international situation of the Cold War created conditions for the application
    of this value in the military field. Whether it was the 1950s SAGE Semi-Automatic
    Ground Environment air defense system against Soviet aerial nuclear strikes, or
    the 1980s Strategic Defense Initiative (SDI, dubbed "Star Wars"), both aimed to
    achieve seamless human-machine interaction. Technology historian Paul Edwards
    pointed out that post-war America''s prevention-oriented diplomatic view and control-oriented
    technological view converged, forming the unique "Closed World" concept of the
    Cold War, pursuing the datafication and computability of all information within
    the scope of control, integrating computer data processing capabilities into equipment
    actions and decision-making processes, completely eliminating the uncertainty
    and irrationality brought by humans in human-machine integration, constructing
    an absolute, automatic, rational system.17 It can be said that after the value
    concept of safety matured and was successfully applied in the industrial and military
    fields, its connotation was no longer human resistance to power intrusion; the
    American public''s pursuit of safety increasingly shows individualized, passive,
    consumerist trends. Correspondingly, the US state''s pursuit of safety increasingly
    approaches the "Closed World" dystopian vision. AI''s action on the value of safety
    unfolds simultaneously on these two levels, and what joins these two seemingly
    opposite demands is the technical proposition of human-machine integration.


    In the civilian sphere, autonomous vehicles are the contemporary continuation
    of the "Closed World" value, because their purpose is to eliminate the negative
    impact of human decision-making errors and behavioral fluctuations on output.
    At this moment, "safety" is no longer a synonym for "no accidents"; its connotation
    has metamorphosed into: eliminating unstable performance in a statistical sense,
    which must rely more on machines and less on humans. In 2018, a mistake in ride-hailing
    company Uber''s autonomous vehicle test once made AI safety a focus of media and
    legal circles. On the night of March 18, 2018, at 10 PM, Elaine Herzberg was walking
    her bicycle on a highway in Tempe, Arizona, when she was struck and killed by
    a test Uber autonomous vehicle. Although there was a safety driver in the car,
    because driving control was completely handed over to the AI, the driver, who
    was watching a variety show on a mobile device, failed to prevent the tragedy
    in time. However, this accident did not shake market confidence in autonomous
    vehicle development, because statistically, autonomous driving technology is undoubtedly
    safer. Predictions suggest that by 2050, the autonomous vehicle market will grow
    to $7 trillion, saving 250 million work hours annually, avoiding $234 billion
    in economic losses caused by human error, preventing 90% of traffic casualties,
    and saving 1 million lives.18


    In the military, drones are a hot field for AI application. This is because drones
    with built-in visual systems need to process massive amounts of data; if they
    can be given the ability to learn, judge, and adjust actions on top of existing
    vision, their combat power can be greatly enhanced and failure rates reduced.
    According to new media DroneII.com, which tracks drone industry dynamics, machine
    learning, deep learning, and motion planning are the three AI technologies most
    closely related to drones. Newly emerged image processors (GPUs) have greatly
    enhanced drone computing power; although becoming fully autonomous drones still
    requires long training and feeding massive images and information, deep learning
    seems to provide a relatively fast shortcut, creating technical conditions for
    further improvement of drone AI levels. Currently, such technology has been applied
    to drones detecting rail and metal corrosion, with side measurement accuracy reaching
    70%-80%.19


    The primary goal of the US Air Force in developing and applying drones is to achieve
    combat capability endurance under unmanned conditions. The Obama administration''s
    promotion of the drone industry was evident; just three days after taking office,
    he authorized two drone strikes on Pakistan, killing over 20 innocent civilians,
    simply because they "looked like terrorists." Obama expressed dissatisfaction
    with intelligence briefings but did not stop drone operations, showing that the
    US military''s requirements for visual recognition were merely so-so; decisions
    and final actions still needed to be completed by humans. By 2013, the US Navy
    could already use demonstrator drones to perform unmanned takeoffs and landings
    on aircraft carriers, an action that even experienced pilots require long training
    to accomplish, demonstrating the bright prospects of AI in this field. The US
    military has also clearly shown its positioning of drone capabilities: fearless
    against enemy information and electronic warfare interference, achieving combat
    decision-making using onboard computers in completely communication-denied environments.20


    In this sense, the application of AI in the drone field contains a dual safety
    value: first, drones are light and fast, with low strike costs, avoiding friendly
    casualties; second, as AI application in drones continuously upgrades, fully autonomous
    drones requiring no human operation will appear in the future, capable of independently
    judging and deciding next actions on the battlefield, maintaining combat power,
    and even achieving safe return. In these two meanings, the latter is closer to
    the true connotation of "safety" in the future era.


    Such technological direction and pace have aroused prudent thinking on related
    ethical challenges by some: if an AI-carrying drone kills/miskills a person, who
    is responsible? A non-governmental organization named the "Campaign to Stop Killer
    Robots" proposes that the act of robots killing must be stopped under the joint
    efforts of the international community. Since its establishment in 2012, the organization
    has gained support from an increasing number of world leaders and local US legislators.21
    In the 1950s, sci-fi writer Asimov proposed the influential Three Laws of Robotics:
    do not kill, obey orders (unless it harms/kills), seek self-preservation (unless
    it harms/kills), which seem to share common ground with contemporary AI safety
    considerations.


    To address such calls, the US Department of Defense released the "AI Principles
    Declaration." Reportedly taking 15 months to form and widely consulting experts
    inside and outside the industry, it finally proposed five principles: Responsible,
    Equitable, Traceable, Reliable, Governable. The DoD stated they would ensure operators
    understand new technologies, ensure data used by AI is transparent, whether data
    or process design is auditable; AI use in a specific domain is explicit, clear,
    safe, and effective, requiring repeated testing for confirmation; when AI produces
    unexpected consequences, humans have the capability to immediately intervene and
    stop its use.22 Apart from "Equitable," all principles essentially point to one
    question: who is responsible when things go wrong? The implication is that the
    act of killing itself has no moral flaw; the ethical controversy focus shifts
    to: exactly what algorithm made that judgment for what reason? This ambiguous
    stance actually shifts moral criticism away from the behind-the-scenes executors
    and decision-makers, making the machine and algorithm the new focal point of contradiction.


    Additionally, new AI applications in various new fields have created objective
    conditions for the further development of the "Closed World" safety view, such
    as AI image recognition technology. Over the past few years, changes in the planet''s
    surface captured by commercial satellites have gradually accumulated to a commercially
    viable level, even enabling updates of the entire Earth''s imagery every 24 hours.
    Silicon Valley companies processing geospatial big data emerged, such as DigitalGlobe,
    Spaceknow, and Orbital Insight; they use machine learning tools to search and
    extract valuable information from massive images. For example, image recognition
    can make extremely precise calculations of tree counts in millions of hectares
    of forest; compared to previous sampling estimation methods, AI can pinpoint tree
    counts to the individual tree. Another example: Facebook purchased large amounts
    of satellite images from DigitalGlobe and, through its facial recognition technology,
    located where potential users without internet access were. 23 Google has also
    developed a deep learning tool called PlaNet, aiming to give Google Search the
    ability to locate any input satellite image. 24 If such technology is applied
    in the military field, its intelligence value cannot be underestimated. Assuming
    a satellite imagery data company can conduct all-weather tracking observation
    of the operation of a country''s industrial facilities, these data results could
    help the US bypass official economic data released by that country''s government
    and independently estimate its economic condition.


    In the US, the content contained in the value of safety has been successfully
    rewritten. Rejecting error-prone human-machine collaboration and comprehensive
    surveillance, whether in the civilian or military/political spheres, have replaced
    the protection of private rights as the true pursuit of the safety value. AI,
    as a tool, increases the possibility of achieving this goal, while the new safety
    value in turn paves the way for technological development. Since AI has become
    related to human life and death, discussions on whether AI possesses moral agency
    are inevitable. The public often likes to use the dilemma of the "Trolley Problem"
    as a standard to measure whether AI possesses higher morality, as if AI, as a
    more powerful "intelligence," should make more reasonable choices. Scholars point
    out that using such extreme cases as a moral guide for AI development is not conducive
    to regulating and guiding it in real life.25 Considering AI''s silent transformation
    of American social life, the exploration of AI''s moral agency should also focus
    on seemingly ordinary yet profoundly meaningful topics and instances in daily
    life.


    ### The Issue of AI Accountability in Two Moral Law Models


