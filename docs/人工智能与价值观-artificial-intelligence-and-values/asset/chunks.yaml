- raw: '不过，在现实生活中，即便初衷是善意的公司有意要公布算法，也会因为技术考量和商业秘密等原因受阻。以脸书（Facebook）为例，过去在现实生活中，当遇到呈现出自杀倾向的个体时，我们自然愿意出手相助，推断的依据无非是低迷的情绪或者异常的言行。然而，也有人在生活中举止寻常，但是在线上却已经积累了长期的抑郁表达。当社交媒体平台成为人们倾倒私隐的树洞，那么社交媒体就能通过人工智能比人更快、更准确地判断自杀倾向。脸书的研究者不但分析了与自杀倾向相伴出现的语言、词汇和表情包，甚至还对此前已经自杀的脸书用户的生前信息进行了回顾性分析，以便对相似的情况做出预测。2017年11月，脸书宣布开始应用这项新的人工智能，当有用户呈现出自杀倾向时，人工智能将向工作人员发出警报，这些人类员工将会对用户进行“健康状况检查”（wellness
    checks），并对其自我伤害的行为加以干预。但当被问起算法的细节时，该项产品副经理罗森（Guy Rosen）却对此讳莫如深，只说可以从情绪低潮的常见时间、亲友的关切评论和脸书用户留言中的文字内容进行推测分析，但拒绝讨论算法本身。同时，脸书又不断强调他们正与传统的自杀自残预防组织之间密切合作，试图靠线下的成果说话。


    实际操作中，脸书的系统可能存在各种问题。例如，人工智能可能错误标记用户，但用户却无从知晓，也无从向系统反映报错；当被标记的用户受到“你现在可能格外需要帮助，请向我们求助”这样的讯息时，他本身也未必知道他已经被列入监控范畴，监控他的不是机器和平台，而是活生生的脸书工作人员。此外，这一算法也可以被别有用心之徒用作伤害他人的武器，针对精神状态不佳的网民进行骚扰和歧视。值得注意的是，即便是脸书的官方合作伙伴“危机短信热线”（Crisis
    Text Line，CTL），他们也不知道脸书已经在后台研发了这样一套系统。尽管CTL方面表示，他们也已经在用算法预测用户向他们发送的消息中可能包含的自杀倾向（例如“易布洛芬”一词就预示着陡增的自杀风险），但是脸书面对合作伙伴也保持神秘，又同时在如此海量的用户人口中尝试人工智能，总是让人留有疑虑的。[\[9\]](#txt003.xhtml#footnote_content_txt003_9)


    脸书以人工智能做挡箭牌的做法远不止一例。2018年春，脸书深陷境外势力渗透其平台，干涉美国选举的丑闻，CEO扎克伯格（Mark Zuckerberg）在国会听证中提到人工智能数十次，将许多说不清道不明的技术问题和伦理问题，一股脑儿都甩给了人工智能。2016年总统大选将美国社会中长期存在的社会矛盾快速激化，而脸书等社交媒体的迅速成长为外部势力进入提供了快车道。选举的余波并未随着新总统的诞生而终结，脸书的管理失当成为了经久不衰的热点话题——虚假账号、种族歧视言论、恐怖主义宣传内容、水军、所谓来自俄罗斯的干涉、隐私安全……面对这些问题，扎克伯格一律以人工智能搪塞。诚然，人工智能确实具备了搜索关键词并分析内容的能力，能够一定程度上缓解网络信息空间的混乱，但是自然语言处理的发展仍很不足，尤其是对“假新闻”的判断，这更牵涉到判断主体的价值观念。对于自己的判断方式，脸书并不愿多说。科技媒体The
    Verge在评价扎克伯格在国会的表现时说：对着一群年长的外行人频繁使用人工智能一词，其实就是在逃避问题。当被密歇根参议员皮特斯（Gary Peters）问到人工智能算法的透明度时，扎克伯格只说“这是一个非常重要的问题”，脸书对此非常重视，并有专门团队负责，但却丝毫未透露将其算法公诸于世的意愿。[\[10\]](#txt003.xhtml#footnote_content_txt003_10)


    针对脸书，有人批评道：尽管脸书时常论及政府和企业的透明度，但它真正想要推进的是个人的透明度，就是所谓的“彻底透明”或“终极透明”。[\[11\]](#txt003.xhtml#footnote_content_txt003_11)脸书采用诱导式、家长式方法将你引向你可能感兴趣的内容与人，让你找到你政治上的同好与同盟，形成自得其乐的线上回音室，不断向用户提供正向反馈，增强政治参与的兴奋感。然而，这一做法的缺陷已经在剑桥分析公司（Cambridge
    Analytica）一案中彻底暴露——当这些数据以层层外包的方式贩售出去，一旦中途落入别有用心之人手里，它不但可以被用于干涉美国内政，更可能构成对公民权益的普遍威胁。在剑桥分析公司一案中，脸书平台的数据在倒手中被售卖、侵犯和滥用，脸书却无知无觉，也无可奈何。足以见得，当“公开”原则应用于脸书这样规模的社交媒体时，除了要包含算法的透明之外，还需要对数据的去向进行持续的公开，长期接受监督。这对于一家靠数据来盈利的公司来说，无异于是与虎谋皮。


    ### 多元参与是公开公正的路径之一


    比阅读政治新闻更贴近生计的，是银行贷款和福利分配。如今人工智能已经开始广泛应用于银行和政府对于个人信用和经济状况的评价，而究竟为什么有些人的申请被拒绝，有些人的被接受，往往连人工智能的使用者，甚至开发者，也不能给出完全令人信服的答案。这是因为许多人工智能设计，尤其是神经网络，其运作方式是不可追溯的。卡内基梅隆大学计算机科学和电子工程系的达塔教授（Anupam
    Datta）于2016年研制了一款量化输入影响系统（Quantitative Input Influence，QII），试图揭示各个因素在放贷与否的最终决定形成中，各自所占比重有多大，从而观察种族或者性别是否在其中起到了歧视性的作用。达塔指出，有一些公司已经发布了算法透明报告，不过这些报告对计算基础方式的披露有限，QII的目标就是形成真正的透明报告。QII方法不是单单考察哪一种变量具有最大的影响力，而是量化衡量一组输入所具有的合力。[\[12\]](#txt003.xhtml#footnote_content_txt003_12)例如，银行在决定放贷与否时，高收入女性和高收入男性获批的概率若是极为相近，那么就很难下定论说银行涉嫌性别歧视；可是如果当低收入男性比低收入女性更容易获得贷款时，那么这个揭露出的问题就比单纯的性别歧视要复杂，它还牵扯到低收入人群中的性别分工，这种分工和职业发展潜力的差别在高收入人群中就可能不那么显著。


    公布算法和开源的压力不仅来自美国社会内部，也来自外部的竞争，例如中国的同行。2018年下半年，美国数个大型科技企业纷纷推出优化人工智能公平性质的工具，包括脸书的Fairness
    Flow、微软研究院的数据预处理和输出预估、谷歌的“人+人工智能研究”（PAIR）计划、IBM的AI OpenScale 工具和AI Fairness 360工具包等。这一系列行动的背景之一，便是来自中国的同行竞争。2018年1月，中国电子技术标准化研究院发布了《人工智能标准化白皮书》，有不少业内相关企业参与编写，显示出中国人工智能正在从野蛮生长迈入有序发展阶段。[\[13\]](#txt003.xhtml#footnote_content_txt003_13)比起行政约束，美国龙头企业们则视开源共享和自下而上的行规约束为最好的管控手段。如果有足够多的程序员和开发者能够共同目击、监督算法的制造，那么就能够确保各大科技企业所开发的模型和算法是相对透明的。[\[14\]](#txt003.xhtml#footnote_content_txt003_14)


    高质量、高透明度的公平公正，唯有邀请更多的主体参与才能够有效维持，这种参与既不限于国别，也不限于某个行业。随着人工智能在普通民众的生活中日益深化，人工智能使用者和公众之间的信任关系将是必不可少的。当然，要做到这一点也要基于一条善意的前提，那就是当企业或国家在使用人工智能时，他们会将这一情况广而告之。从这个意义上说，人工智能算法对价值观的作用是一把双刃剑，一方面它可能会把越来越多历史上的价值观积弊暴露出来，为正视并解决它们提供转机；另一方面它也可能促使越来越多的企业在越来越多的情境中选择不公布人工智能工具的在场。如若人工智能的社会效应被整体遮蔽起来，这就给一种向善的价值观转向又带来了变数。


    ## 安全与归责：人机结合中的道德挑战


    枪支泛滥是今天美国最令人头疼的社会问题之一，但同时也是其价值观最独树一帜的体现。美国宪法第二修正案确立之时，其最主要的考量是安全，全民持枪既能抵御他国的侵略，又能阻吓本国政府对私人空间的入侵，它是一种对私权的声张和歌颂，第四修正案对权力进入私人空间搜查的预防也是此理。这种观念经历了近三个世纪的发展之后，对外、对内两种考量的天平逐渐失衡——枪仍然是普通美国民众表达自由和安全的文化符号，但隐私就越来越不那么重要了。在国家层面亦是如此，美国对外的军事价值理念愈发讲求严密控制，民众对于自家政府的越权却并不介意，甚至享受数据隐私与人身安全的交换。


    ### “闭合世界”冷战军事观的当代延续


    事实上，这种失衡可以追溯到19世纪晚期。当时，工程师、管理人阶层的财富水平和社会地位都处于上升期，垂直整合在企业间流行，这种措施将主要生产流程全部置于单一组织架构之下，依靠控制和规模降本增效，通过薄利多销的手法在新兴城市市场中抢占份额。这种追求安全和稳定的价值观念激励企业进一步吞并上下游企业，以保障数据长期可见、可得、可控。发展到宣扬量化管理劳动的《科学管理原理》问世的1911年，作者泰勒已经可以明言：“新兴的管理学说不仅适用于企业，也可用于家庭、农场、教会、慈善组织、大学，甚至政府部门。”[\[15\]](#txt003.xhtml#footnote_content_txt003_15)


    冷战时期紧张的国际局势为这一价值观在军事领域的应用创造了条件。无论是五十年代针对预防苏联空中核打击的SAGE半自动雷达防空系统，还是80年代的战略防御计划SDI（俗称“星球大战计划”），都意在实现人机交互无缝对接。科技史学家爱德华兹（Paul
    Edwards）指出，战后美国强调防控的外交观和强调控制的科技观走到了一起，形成了冷战期间特有的“闭合世界”观念，追求对控制范围内一切信息的数据化和可计算化，将计算机的数据处理能力融入装备行动和决策过程，彻底剔除人机整合中人所带有的不确定性和非理性，构造绝对的、自动的、理性的系统。[\[16\]](#txt003.xhtml#footnote_content_txt003_16)可以说，安全这一价值观念经历了在工业和军事领域成熟且成功的应用之后，其内涵已经不再是人对权力入侵的抵抗，美国民间对安全的追求越来越呈现出个体化、受动式、消费主义化的趋势。与之相应的，美国国家对安全的追求则越来越接近“闭合世界”的反乌托邦构想。人工智能对安全这一价值观的作用正是在这两个层面同时展开的，将此两种看似相反的诉求联合起来的，是人机结合这一技术命题。


    在民间，无人车就是“闭合世界”价值观的当代延续，因为其目的在于杜绝人为决策失误和人为行动波动对输出的消极影响。此刻，“安全”不再是“不出事”的代名词，其内涵已蜕变为：从统计意义上消灭不稳定表现，这就必须要更多地依赖机器，更少地依赖人。2018年，交通网络公司优步（UBER）在无人车实验中的一次失误，一度使人工智能的安全性成为媒体和法律界的焦点。2018年3月18日晚上10点，赫兹伯格（Elaine
    Herzberg）正推着她的自行车在亚利桑那州坦佩市的高速公路上行走，结果被调试中的优步无人车撞死。当时虽然车上有驾驶员，但是由于将行驶权完全交给了人工智能，正在车上用移动设备观看综艺节目的驾驶员未能及时阻止惨剧发生。然而，这起事故没有动摇市场对无人车发展的信心，因为在统计意义上，无人驾驶技术无疑是更为安全的。据预测，到2050年，无人驾驶车的市场将增至7万亿美元，每年节约2.5亿小时工作时间，规避价值2
    340亿美元的人为失误造成的经济损失，90％的交通伤亡事故将免于发生，100万人的生命将得以保留。[\[17\]](#txt003.xhtml#footnote_content_txt003_17)


    在军方，无人机是人工智能应用的热门领域。这是因为自带视觉系统的无人机需要处理大量数据，如果能在现有的视觉基础上，赋予其学习、判断、调整行动的能力，就能极大的增强其战斗力，减少其故障率。根据观察无人机行业动态的新媒体DroneII.com所述，机器学习、深度学习和运动计划是和无人机最密切相关的三项人工智能技术。新出现的图像处理器GPU极大地提升了无人机的运算能力，虽然要成为能够自主行动的无人机仍然离不开长时间的训练和海量图像和信息的喂养，但深度学习似乎提供了一种相对快速的捷径，这些都为无人机人工智能水平的进一步提升创造了科技条件。目前这一类技术已经应用于检测铁轨和金属腐蚀的无人机上，侦测准确率可以达到70％～80％。[\[18\]](#txt003.xhtml#footnote_content_txt003_18)


    美国空军对无人机的开发应用的主要目标，是实现无人操控条件下的作战能力续航。奥巴马政府助推无人机产业有目共睹，仅在其履新三天后，他就授权了两次针对巴基斯坦的无人机攻击，造成无辜平民20余人死亡，不过是因为这些人“看着像恐怖分子”。奥巴马对情报部门的汇报表示不满，却也没有阻止无人机继续行动，可见美国军方对视觉识别的要求不过如此，决策和最终行动仍需由人来完成。到2013年，美国海军已经能够使用示范用无人机，在航空母舰上进行无人为操作的起降动作，这一动作即便是有经验的飞行员也需要经过长时间的训练方能完成，这展现了人工智能在这一领域的光明前景。美国军方也已经明确地展现出其对无人机能力的定位：无畏敌方信息战、电子战的干扰，实现在完全没有通讯的情况下，使用机上自带计算机进行战斗决策。[\[19\]](#txt003.xhtml#footnote_content_txt003_19)


    就这一意义而言，人工智能在无人机领域的应用，其所包含的安全价值观是双重的：一来，无人机轻便迅捷，出击成本低廉，避免己方人员伤亡；二来，随着无人机中人工智能运用的不断升级，未来将会出现完全不需要人为操作的无人机，可在战场上自行判断决定下一步行动，保持战斗力，甚至实现安全返航。而在这两种含义里，后者才更接近未来时代“安全”的真正内涵。


    这样的科技方向与步伐，已经引起了一些人士对相关伦理挑战的审慎思考：如果携带人工智能的无人机杀/误杀了人，这个责任究竟算谁的？一个名为“阻止杀人机器人运动”（Campaign
    to Stop Killer Robots）的非政府组织就提出，机器人杀人的行为必须在国际社会的共同努力下加以制止。该组织自2012年成立以来，已经获得了越来越多世界政要和美国本地议员的支持。[\[20\]](#txt003.xhtml#footnote_content_txt003_20)20世纪50年代，科幻作家阿西莫夫就提出了影响深远的机器人三法则：不杀人、服从命令（除非会伤人杀人）、寻求自保（除非会伤人杀人），与当代人工智能的安全考量似有共通之处。


    为了应对这种呼声，美国国防部发布了“人工智能原则宣言”。据称该文件费时15个月形成，广泛咨询了业内外专家，最终提出五条原则：负责、平等、可追溯、可靠、可治理。美国国防部称，他们将确保操作人员理解新科技，确保人工智能所使用的数据是透明的，无论是数据还是流程设计都是有据可查的；人工智能在某一领域的使用是明确的、清晰的、安全有效的，并需要经过反复测试来确认；当人工智能出现意料之外的后果时，人是有能力立刻介入并停止其使用的。[\[21\]](#txt003.xhtml#footnote_content_txt003_21)其中除了平等之外，其实都指向同一个问题：出了问题谁负责？言下之意，杀人的行为本身并不存在道德瑕疵，伦理的争议重点变成了：究竟是什么算法出于什么样的理由做出了那样的判断？这种暧昧表态实际上转移了对于幕后执行者和决策者的道德批判，而是将机器和算法作为新的矛盾焦点。


    另外，人工智能在各种新领域的新用途，也为“闭合世界”安全观的进一步发展创造了客观条件，例如人工智能图像识别技术。过去几年间，商用卫星所捕捉到的星球表面的面貌变化，已经逐渐累积到了具有商业潜力的程度，甚至可以每24小时更新一次对整个地球的图像捕捉。处理地理空间类大数据的硅谷公司应运而生，例如DigitalGlobe，Spaceknow和Orbital
    Insight，它们采用机器学习工具，从海量图片中寻找、提炼有价值的信息。例如，图像识别可以对数百万公顷林地中的树木数量做出极为精准的计算，相比起以往采样估算的做法，人工智能可以把树木数量精确到棵。又如，脸书从DigitalGlobe购买大量卫星图片，并通过其人脸识别技术，锁定没有互联网的潜在用户身在何处。[\[22\]](#txt003.xhtml#footnote_content_txt003_22)谷歌也已经开发出了名为PlaNet的深度学习工具，意在令谷歌搜索引擎具备根据输入的任何卫星图像都能够定位其位置的能力。[\[23\]](#txt003.xhtml#footnote_content_txt003_23)此类技术如若运用在军事领域，其情报价值不可小视。假设一家卫星图像数据公司能够对某一国家的工业设施的运行情况进行全天候的追踪观察，那么这些数据结果就能帮助美国绕过他国政府公布的官方经济数据，自行得出对该国经济状况的估计。


    在美国，安全这一价值观念所包含的内容已被成功改写。拒绝差错的人机合作和全面布控，无论是在民间还是在军政界，都已经取代对私权的维护，成为安全价值观的真正追求。人工智能作为一种工具增加了这一目标实现的可能性，而新的安全价值观又反过来为技术发展铺平舆论道路。既然人工智能已经与人类的性命与夺相关，关于人工智能是否具有道德能动性的讨论就在所难免。公众往往喜欢用让人进退两难的“电车悖论”作为衡量人工智能是否具有更高德性的标准，仿佛人工智能作为算力更强的“智能”，理应做出更合理的选择。有学者指出，以这种极端案例作为人工智能发展道德指南，并不利于在现实生活中对其进行规范和引导。[\[24\]](#txt003.xhtml#footnote_content_txt003_24)考虑到人工智能对于美国社会生活润物细无声式的改造，针对人工智能所具有的道德能动性问题的探讨，也该着眼日常生活中看似平凡却意味深远的话题与实例。


    ### 两种道德法则模型中人工智能的归责问题'
  fmt: '

    ## 算法透明度与公平性：以脸书为例


    ### 脸书的算法黑箱


    不过，在现实生活中，即便初衷是善意的公司有意要公布算法，也会因为技术考量和商业秘密等原因受阻。以脸书（Facebook）为例，过去在现实生活中，当遇到呈现出自杀倾向的个体时，我们自然愿意出手相助，推断的依据无非是低迷的情绪或者异常的言行。然而，也有人在生活中举止寻常，但是在线上却已经积累了长期的抑郁表达。当社交媒体平台成为人们倾倒私隐的树洞，那么社交媒体就能通过人工智能比人更快、更准确地判断自杀倾向。脸书的研究者不但分析了与自杀倾向相伴出现的语言、词汇和表情包，甚至还对此前已经自杀的脸书用户的生前信息进行了回顾性分析，以便对相似的情况做出预测。2017年11月，脸书宣布开始应用这项新的人工智能，当有用户呈现出自杀倾向时，人工智能将向工作人员发出警报，这些人类员工将会对用户进行“健康状况检查”（wellness
    checks），并对其自我伤害的行为加以干预。但当被问起算法的细节时，该项产品副经理罗森（Guy Rosen）却对此讳莫如深，只说可以从情绪低潮的常见时间、亲友的关切评论和脸书用户留言中的文字内容进行推测分析，但拒绝讨论算法本身。同时，脸书又不断强调他们正与传统的自杀自残预防组织之间密切合作，试图靠线下的成果说话。[9](#txt003.xhtml#footnote_content_txt003_9)


    实际操作中，脸书的系统可能存在各种问题。例如，人工智能可能错误标记用户，但用户却无从知晓，也无从向系统反映报错；当被标记的用户受到“你现在可能格外需要帮助，请向我们求助”这样的讯息时，他本身也未必知道他已经被列入监控范畴，监控他的不是机器和平台，而是活生生的脸书工作人员。此外，这一算法也可以被别有用心之徒用作伤害他人的武器，针对精神状态不佳的网民进行骚扰和歧视。值得注意的是，即便是脸书的官方合作伙伴“危机短信热线”（Crisis
    Text Line，CTL），他们也不知道脸书已经在后台研发了这样一套系统。尽管CTL方面表示，他们也已经在用算法预测用户向他们发送的消息中可能包含的自杀倾向（例如“易布洛芬”一词就预示着陡增的自杀风险），但是脸书面对合作伙伴也保持神秘，又同时在如此海量的用户人口中尝试人工智能，总是让人留有疑虑。[10](#txt003.xhtml#footnote_content_txt003_10)


    脸书以人工智能做挡箭牌的做法远不止一例。2018年春，脸书深陷境外势力渗透其平台、干涉美国选举的丑闻，CEO扎克伯格（Mark Zuckerberg）在国会听证中提到人工智能数十次，将许多说不清道不明的技术问题和伦理问题，一股脑儿都甩给了人工智能。2016年总统大选将美国社会中长期存在的社会矛盾快速激化，而脸书等社交媒体的迅速成长为外部势力进入提供了快车道。选举的余波并未随着新总统的诞生而终结，脸书的管理失当成为了经久不衰的热点话题——虚假账号、种族歧视言论、恐怖主义宣传内容、水军、所谓来自俄罗斯的干涉、隐私安全……面对这些问题，扎克伯格一律以人工智能搪塞。诚然，人工智能确实具备了搜索关键词并分析内容的能力，能够一定程度上缓解网络信息空间的混乱，但是自然语言处理的发展仍很不足，尤其是对“假新闻”的判断，这更牵涉到判断主体的价值观念。对于自己的判断方式，脸书并不愿多说。科技媒体The
    Verge在评价扎克伯格在国会的表现时说：对着一群年长的外行人频繁使用人工智能一词，其实就是在逃避问题。当被密歇根参议员皮特斯（Gary Peters）问到人工智能算法的透明度时，扎克伯格只说“这是一个非常重要的问题”，脸书对此非常重视，并有专门团队负责，但却丝毫未透露将其算法公诸于世的意愿。[11](#txt003.xhtml#footnote_content_txt003_11)


    针对脸书，有人批评道：尽管脸书时常论及政府和企业的透明度，但它真正想要推进的是个人的透明度，就是所谓的“彻底透明”或“终极透明”。[12](#txt003.xhtml#footnote_content_txt003_12)脸书采用诱导式、家长式方法将你引向你可能感兴趣的内容与人，让你找到你政治上的同好与同盟，形成自得其乐的线上回音室，不断向用户提供正向反馈，增强政治参与的兴奋感。然而，这一做法的缺陷已经在剑桥分析公司（Cambridge
    Analytica）一案中彻底暴露——当这些数据以层层外包的方式贩售出去，一旦中途落入别有用心之人手里，它不但可以被用于干涉美国内政，更可能构成对公民权益的普遍威胁。在剑桥分析公司一案中，脸书平台的数据在倒手中被售卖、侵犯和滥用，脸书却无知无觉，也无可奈何。足以见得，当“公开”原则应用于脸书这样规模的社交媒体时，除了要包含算法的透明之外，还需要对数据的去向进行持续的公开，长期接受监督。这对于一家靠数据来盈利的公司来说，无异于是与虎谋皮。


    ### 多元参与是公开公正的路径之一


    比阅读政治新闻更贴近生计的，是银行贷款和福利分配。如今人工智能已经开始广泛应用于银行和政府对于个人信用和经济状况的评价，而究竟为什么有些人的申请被拒绝，有些人的被接受，往往连人工智能的使用者，甚至开发者，也不能给出完全令人信服的答案。这是因为许多人工智能设计，尤其是神经网络，其运作方式是不可追溯的。卡内基梅隆大学计算机科学和电子工程系的达塔教授（Anupam
    Datta）于2016年研制了一款量化输入影响系统（Quantitative Input Influence，QII），试图揭示各个因素在放贷与否的最终决定形成中，各自所占比重有多大，从而观察种族或者性别是否在其中起到了歧视性的作用。达塔指出，有一些公司已经发布了算法透明报告，不过这些报告对计算基础方式的披露有限，QII的目标就是形成真正的透明报告。QII方法不是单单考察哪一种变量具有最大的影响力，而是量化衡量一组输入所具有的合力。[13](#txt003.xhtml#footnote_content_txt003_13)例如，银行在决定放贷与否时，高收入女性和高收入男性获批的概率若是极为相近，那么就很难下定论说银行涉嫌性别歧视；可是如果当低收入男性比低收入女性更容易获得贷款时，那么这个揭露出的问题就比单纯的性别歧视要复杂，它还牵扯到低收入人群中的性别分工，这种分工和职业发展潜力的差别在高收入人群中就可能不那么显著。


    公布算法和开源的压力不仅来自美国社会内部，也来自外部的竞争，例如中国的同行。2018年下半年，美国数个大型科技企业纷纷推出优化人工智能公平性质的工具，包括脸书的Fairness
    Flow、微软研究院的数据预处理和输出预估、谷歌的“人+人工智能研究”（PAIR）计划、IBM的AI OpenScale工具和AI Fairness 360工具包等。这一系列行动的背景之一，便是来自中国的同行竞争。2018年1月，中国电子技术标准化研究院发布了《人工智能标准化白皮书》，有不少业内相关企业参与编写，显示出中国人工智能正在从野蛮生长迈入有序发展阶段。[14](#txt003.xhtml#footnote_content_txt003_14)比起行政约束，美国龙头企业们则视开源共享和自下而上的行规约束为最好的管控手段。如果有足够多的程序员和开发者能够共同目击、监督算法的制造，那么就能够确保各大科技企业所开发的模型和算法是相对透明的。[15](#txt003.xhtml#footnote_content_txt003_15)


    高质量、高透明度的公平公正，唯有邀请更多的主体参与才能够有效维持，这种参与既不限于国别，也不限于某个行业。随着人工智能在普通民众的生活中日益深化，人工智能使用者和公众之间的信任关系将是必不可少的。当然，要做到这一点也要基于一条善意的前提，那就是当企业或国家在使用人工智能时，他们会将这一情况广而告之。从这个意义上说，人工智能算法对价值观的作用是一把双刃剑，一方面它可能会把越来越多历史上的价值观积弊暴露出来，为正视并解决它们提供转机；另一方面它也可能促使越来越多的企业在越来越多的情境中选择不公布人工智能工具的在场。如若人工智能的社会效应被整体遮蔽起来，这就给一种向善的价值观转向又带来了变数。


    ## 安全与归责：人机结合中的道德挑战


    枪支泛滥是今天美国最令人头疼的社会问题之一，但同时也是其价值观最独树一帜的体现。美国宪法第二修正案确立之时，其最主要的考量是安全，全民持枪既能抵御他国的侵略，又能阻吓本国政府对私人空间的入侵，它是一种对私权的声张和歌颂，第四修正案对权力进入私人空间搜查的预防也是此理。这种观念经历了近三个世纪的发展之后，对外、对内两种考量的天平逐渐失衡——枪仍然是普通美国民众表达自由和安全的文化符号，但隐私就越来越不那么重要了。在国家层面亦是如此，美国对外的军事价值理念愈发讲求严密控制，民众对于自家政府的越权却并不介意，甚至享受数据隐私与人身安全的交换。


    ### “闭合世界”冷战军事观的当代延续


    事实上，这种失衡可以追溯到19世纪晚期。当时，工程师、管理人阶层的财富水平和社会地位都处于上升期，垂直整合在企业间流行，这种措施将主要生产流程全部置于单一组织架构之下，依靠控制和规模降本增效，通过薄利多销的手法在新兴城市市场中抢占份额。这种追求安全和稳定的价值观念激励企业进一步吞并上下游企业，以保障数据长期可见、可得、可控。发展到宣扬量化管理劳动的《科学管理原理》问世的1911年，作者泰勒已经可以明言：“新兴的管理学说不仅适用于企业，也可用于家庭、农场、教会、慈善组织、大学，甚至政府部门。”[16](#txt003.xhtml#footnote_content_txt003_16)


    冷战时期紧张的国际局势为这一价值观在军事领域的应用创造了条件。无论是五十年代针对预防苏联空中核打击的SAGE半自动雷达防空系统，还是80年代的战略防御计划SDI（俗称“星球大战计划”），都意在实现人机交互无缝对接。科技史学家爱德华兹（Paul
    Edwards）指出，战后美国强调防控的外交观和强调控制的科技观走到了一起，形成了冷战期间特有的“闭合世界”观念，追求对控制范围内一切信息的数据化和可计算化，将计算机的数据处理能力融入装备行动和决策过程，彻底剔除人机整合中人所带有的不确定性和非理性，构造绝对的、自动的、理性的系统。[17](#txt003.xhtml#footnote_content_txt003_17)可以说，安全这一价值观念经历了在工业和军事领域成熟且成功的应用之后，其内涵已经不再是人对权力入侵的抵抗，美国民间对安全的追求越来越呈现出个体化、受动式、消费主义化的趋势。与之相应的，美国国家对安全的追求则越来越接近“闭合世界”的反乌托邦构想。人工智能对安全这一价值观的作用正是在这两个层面同时展开的，将此两种看似相反的诉求联合起来的，是人机结合这一技术命题。


    在民间，无人车就是“闭合世界”价值观的当代延续，因为其目的在于杜绝人为决策失误和人为行动波动对输出的消极影响。此刻，“安全”不再是“不出事”的代名词，其内涵已蜕变为：从统计意义上消灭不稳定表现，这就必须要更多地依赖机器，更少地依赖人。2018年，交通网络公司优步（UBER）在无人车实验中的一次失误，一度使人工智能的安全性成为媒体和法律界的焦点。2018年3月18日晚上10点，赫兹伯格（Elaine
    Herzberg）正推着她的自行车在亚利桑那州坦佩市的高速公路上行走，结果被调试中的优步无人车撞死。当时虽然车上有驾驶员，但是由于将行驶权完全交给了人工智能，正在车上用移动设备观看综艺节目的驾驶员未能及时阻止惨剧发生。然而，这起事故没有动摇市场对无人车发展的信心，因为在统计意义上，无人驾驶技术无疑是更为安全的。据预测，到2050年，无人驾驶车的市场将增至7万亿美元，每年节约2.5亿小时工作时间，规避价值2340亿美元的人为失误造成的经济损失，90％的交通伤亡事故将免于发生，100万人的生命将得以保留。[18](#txt003.xhtml#footnote_content_txt003_18)


    在军方，无人机是人工智能应用的热门领域。这是因为自带视觉系统的无人机需要处理大量数据，如果能在现有的视觉基础上，赋予其学习、判断、调整行动的能力，就能极大地增强其战斗力，减少其故障率。根据观察无人机行业动态的新媒体DroneII.com所述，机器学习、深度学习和运动计划是和无人机最密切相关的三项人工智能技术。新出现的图像处理器GPU极大地提升了无人机的运算能力，虽然要成为能够自主行动的无人机仍然离不开长时间的训练和海量图像和信息的喂养，但深度学习似乎提供了一种相对快速的捷径，这些都为无人机人工智能水平的进一步提升创造了科技条件。目前这一类技术已经应用于检测铁轨和金属腐蚀的无人机上，侧测准确率可以达到70％～80％。[19](#txt003.xhtml#footnote_content_txt003_19)


    美国空军对无人机的开发应用的主要目标，是实现无人操控条件下的作战能力续航。奥巴马政府助推无人机产业有目共睹，仅在其履新三天后，他就授权了两次针对巴基斯坦的无人机攻击，造成无辜平民20余人死亡，不过是因为这些人“看着像恐怖分子”。奥巴马对情报部门的汇报表示不满，却也没有阻止无人机继续行动，可见美国军方对视觉识别的要求不过如此，决策和最终行动仍需由人来完成。到2013年，美国海军已经能够使用示范用无人机，在航空母舰上进行无人为操作的起降动作，这一动作即便是有经验的飞行员也需要经过长时间的训练方能完成，这展现了人工智能在这一领域的光明前景。美国军方也已经明确地展现出其对无人机能力的定位：无畏敌方信息战、电子战的干扰，实现在完全没有通讯的情况下，使用机上自带计算机进行战斗决策。[20](#txt003.xhtml#footnote_content_txt003_20)


    就这一意义而言，人工智能在无人机领域的应用，其所包含的安全价值观是双重的：一来，无人机轻便迅捷，出击成本低廉，避免己方人员伤亡；二来，随着无人机中人工智能运用的不断升级，未来将会出现完全不需要人为操作的无人机，可在战场上自行判断决定下一步行动，保持战斗力，甚至实现安全返航。而在这两种含义里，后者才更接近未来时代“安全”的真正内涵。


    这样的科技方向与步伐，已经引起了一些人士对相关伦理挑战的审慎思考：如果携带人工智能的无人机杀/误杀了人，这个责任究竟算谁的？一个名为“阻止杀人机器人运动”（Campaign
    to Stop Killer Robots）的非政府组织就提出，机器人杀人的行为必须在国际社会的共同努力下加以制止。该组织自2012年成立以来，已经获得了越来越多世界政要和美国本地议员的支持。[21](#txt003.xhtml#footnote_content_txt003_21)20世纪50年代，科幻作家阿西莫夫就提出了影响深远的机器人三法则：不杀人、服从命令（除非会伤人杀人）、寻求自保（除非会伤人杀人），与当代人工智能的安全考量似有共通之处。


    为了应对这种呼声，美国国防部发布了“人工智能原则宣言”。据称该文件费时15个月形成，广泛咨询了业内外专家，最终提出五条原则：负责、平等、可追溯、可靠、可治理。美国国防部称，他们将确保操作人员理解新科技，确保人工智能所使用的数据是透明的，无论是数据还是流程设计都是有据可查的；人工智能在某一领域的使用是明确的、清晰的、安全有效的，并需要经过反复测试来确认；当人工智能出现意料之外的后果时，人是有能力立刻介入并停止其使用的。[22](#txt003.xhtml#footnote_content_txt003_22)其中除了平等之外，其实都指向同一个问题：出了问题谁负责？言下之意，杀人的行为本身并不存在道德瑕疵，伦理的争议重点变成了：究竟是什么算法出于什么样的理由做出了那样的判断？这种暧昧表态实际上转移了对于幕后执行者和决策者的道德批判，而是将机器和算法作为新的矛盾焦点。


    另外，人工智能在各种新领域的新用途，也为“闭合世界”安全观的进一步发展创造了客观条件，例如人工智能图像识别技术。过去几年间，商用卫星所捕捉到的星球表面的面貌变化，已经逐渐累积到了具有商业潜力的程度，甚至可以每24小时更新一次对整个地球的图像捕捉。处理地理空间类大数据的硅谷公司应运而生，例如DigitalGlobe、Spaceknow和Orbital
    Insight，它们采用机器学习工具，从海量图片中寻找、提炼有价值的信息。例如，图像识别可以对数百万公顷林地中的树木数量做出极为精准的计算，相比起以往采样估算的做法，人工智能可以把树木数量精确到棵。又如，脸书从DigitalGlobe购买大量卫星图片，并通过其人脸识别技术，锁定没有互联网的潜在用户身在何处。[23](#txt003.xhtml#footnote_content_txt003_23)谷歌也已经开发出了名为PlaNet的深度学习工具，意在令谷歌搜索引擎具备根据输入的任何卫星图像都能够定位其位置的能力。[24](#txt003.xhtml#footnote_content_txt003_24)此类技术如若运用在军事领域，其情报价值不可小视。假设一家卫星图像数据公司能够对某一国家的工业设施的运行情况进行全天候的追踪观察，那么这些数据结果就能帮助美国绕过他国政府公布的官方经济数据，自行得出对该国经济状况的估计。


    在美国，安全这一价值观念所包含的内容已被成功改写。拒绝差错的人机合作和全面布控，无论是在民间还是在军政界，都已经取代对私权的维护，成为安全价值观的真正追求。人工智能作为一种工具增加了这一目标实现的可能性，而新的安全价值观又反过来为技术发展铺平舆论道路。既然人工智能已经与人类的性命与夺相关，关于人工智能是否具有道德能动性的讨论就在所难免。公众往往喜欢用让人进退两难的“电车悖论”作为衡量人工智能是否具有更高德性的标准，仿佛人工智能作为算力更强的“智能”，理应做出更合理的选择。有学者指出，以这种极端案例作为人工智能发展道德指南，并不利于在现实生活中对其进行规范和引导。[25](#txt003.xhtml#footnote_content_txt003_25)考虑到人工智能对于美国社会生活润物细无声式的改造，针对人工智能所具有的道德能动性问题的探讨，也该着眼日常生活中看似平凡却意味深远的话题与实例。


    ### 两种道德法则模型中人工智能的归责问题

