  trans: '

    ## Monitoring AI Development and Application


    Monitor the development and application of AI. The European Commission focuses
    on monitoring the application and penetration of AI across all economic activities,
    seeking potential changes AI might bring to industrial value chains, as well as
    impacts on social and legal development and the labor market. The EU will also
    benchmark the technical capabilities of AI products and systems to understand
    actual technological developments, and regularly assess the implementation progress
    of the goals set by the AI strategy.


    ## Third, Increase Investment in AI Development


    ### Increase Government Investment


    Robots produced in Europe currently account for 32% of the global market share[[34]](#txt004.xhtml#footnote_content_txt004_34).
    To maintain and expand Europe''s leading position and ensure economic and social
    development, the EU will invest approximately 1.5 billion euros by the end of
    2020.[[35]](#txt004.xhtml#footnote_content_txt004_35)


    Member states have also increased strategic investment in AI to consolidate AI
    development achievements and promote further innovation, encouraging enterprises
    or institutions to conduct relevant tests and trials, strengthening the construction
    of high-precision and cutting-edge research centers, safeguarding the interests
    of all stakeholders, and paying close attention to the AI development and application
    of SMEs (see Table 4-1). For example, Germany plans to "invest approximately 3
    billion euros in AI R&D from 2018 to 2025, achieving the 3.5% R&D target, with
    a budget of 500 million euros for 2019."[[36]](#txt004.xhtml#footnote_content_txt004_36)


    **Table 4-1 EU and Major Member States'' AI Strategic Investment**


    ![img](img/txt004_1.jpg)


    (Continued)


    ![img](img/txt004_2.jpg)


    Source: Institute of International Technology and Economics, Development Research
    Center of the State Council, China Electronics Association, Zhihuiya. *Global
    AI Landscape: Future Trends and China''s Position* [M]. Beijing: Renmin University
    of China Press, 2019: 332. Note: The UK had not yet left the EU at this time.


    In the next phase (2021-2027), the EU will continue to expand investment, supporting
    relevant institutions and sectors in deploying and using AI systems through the
    joint efforts of member states.[[37]](#txt004.xhtml#footnote_content_txt004_37)


    ### Attract Private Investment


    Adequate private investment is also crucial for AI R&D and application. To this
    end, the EU continues to attract private investment to support AI R&D and industrial
    applications. The EU has already collaborated with the European Investment Bank
    Group to invest 500 million euros in 2018-2020.[[38]](#txt004.xhtml#footnote_content_txt004_38)
    According to the deployment of the `Horizon Europe` program, the European Commission
    has partnered with the European Robotics Association to promote the civil robotics
    R&D program `SPARC`, with the European Commission contributing 700 million euros
    and the European Robotics Association investing 2.1 billion euros[[39]](#txt004.xhtml#footnote_content_txt004_39),
    making the `SPARC` program the world''s largest privately funded robotics innovation
    program.


    In addition, the European Commission and the European Investment Fund launched
    a pan-European venture capital fund program of 2.1 billion euros to increase investment
    in innovative European startups.[[40]](#txt004.xhtml#footnote_content_txt004_40)
    By 2020, total public and private investment in the AI field in the EU had reached
    at least 20 billion euros.[[41]](#txt004.xhtml#footnote_content_txt004_41)


    ## Emphasize Talent Cultivation, Promote Upgrading of Education and Training Systems


    Over 200 years ago, fearing that machines would take away jobs and destroy humanity,
    British workers launched the massive Luddite movement, smashing machines that
    replaced workers'' jobs; in 2000, Goldman Sachs employed 600 traders at its U.S.
    cash equities trading desk in its New York headquarters, but by 2017 only two
    remained; since 2016, AlphaGo has successively defeated Lee Sedol and Ke Jie in
    Go human-machine battles. With such significant impacts on industries like finance
    and Go, one cannot help but ask: Will AI steal human livelihoods?


    Nobel laureate in Economics Wassily Leontief once stated that in the next 30 to
    40 years, a large number of workers would be replaced by AI, creating huge employment
    and retraining problems, just as horses were largely replaced by machinery in
    the 20th century, except these consequences would fall on humans, unless governments
    can redistribute the dividends brought by new technologies. The EU is keenly aware
    of this global social transformation and has long begun preparations to address
    numerous unforeseen challenges.


    ### First, Eliminate the "Digital Divide", Provide Necessary Digital Skills for
    Everyone


    Digitalization is affecting the labor market structure: medium-skill jobs are
    being automated, and low-skill jobs will be significantly impacted by AI. Predicting
    AI''s potential employment impact and investing in workers is precisely what the
    human-centric AI value system demands. Therefore, to avoid the continued widening
    of inequality between regions, industries, or groups, the EU provides opportunities
    for workers affected by AI and automation to learn new knowledge and skills, helping
    workers in the transition period find new jobs quickly. During 2014-2020, the
    EU invested 27 billion euros to support skills development, of which 2.3 billion
    euros were specifically dedicated to cultivating digital skills, focusing on collaborating
    with the private sector to carry out digital skills training programs.[[42]](#txt004.xhtml#footnote_content_txt004_42)


    Meanwhile, Europe has invested significant effort and funds in research on e-commerce
    and human-machine collaboration.[[43]](#txt004.xhtml#footnote_content_txt004_43)
    The European Commission attempts to promote human-AI interaction and cooperation
    in `B to C` transactions. To establish a fair and transparent application environment,
    clarify legal requirements for consumer protection, and facilitate the use of
    AI, the EU advocates that individuals should be informed of the purposes, performance,
    and characteristics of AI products, have control over data generated during the
    use of AI products, and have the right to know whether they are communicating
    with a human or a robot. Especially when individuals interact with robots, they
    should know how to seek help from humans, how to correct operational errors, and
    how to review system decisions. Through such attempts, the EU is fully empowering
    individuals.


    EU member states are also taking active action. In September 2018, Germany adopted
    the `High-Tech Strategy 2025` as a guideline for future high-tech development.
    The German government pooled the efforts of numerous public departments and research
    institutions to establish a strategic framework promoting research and innovation,
    themed `Research and Innovation for People`, closely linking the development of
    future technologies in fields such as microelectronics, materials research, biotechnology,
    and AI with vocational training and continuing education. In November 2018, Germany
    officially released the `Artificial Intelligence Strategy of the German Federal
    Government`, proposing the slogan `AI Made in Germany`, elevating AI to a national
    strategic level. This AI strategy comprehensively considers the impact of AI on
    all sectors of society and emphasizes the importance of AI application in SMEs.[[44]](#txt004.xhtml#footnote_content_txt004_44)


    Besides Germany, the UK has also taken action. In October 2016, the UK released
    the `Robotics and Artificial Intelligence` report, emphasizing that the public
    should be encouraged to actively participate in eliminating the digital divide.
    Enhancing public participation allows the public to better interact with AI technology,
    better understand and address social issues brought by AI, such as reducing sharply
    rising labor costs through assistive intelligent robot technology. By encouraging
    public participation, people are more confident about the future of AI, which
    is more conducive to promoting technology development based on AI.


    British experts also believe that proactive and responsible AI regulations and
    their supervision should not be limited to a few experts and stakeholders, but
    should also listen more to the opinions of the general public. In the AI policy-making
    process, there should be more disclosure measures, which helps the public understand
    the social, ethical, and legal issues brought by AI development, also helps the
    UK build public trust in the government, and promotes the wider application of
    advanced technologies.[[45]](#txt004.xhtml#footnote_content_txt004_45)


    ### Second, Bridge the "Skills Gap", Cultivate Diverse, Interdisciplinary Talents


    As AI garners attention from countries and tech enterprises worldwide, Europe''s
    demand for AI talent has also grown rapidly in recent years, with major enterprises
    having a strong demand for experienced, technically skilled, and especially highly
    educated AI talent.


    Since 2011, the demand for ICT specialists has grown by 5% annually, rapidly increasing
    the total employment share from 3% to 3.7% in just five years. However, in Europe,
    there are still at least 350,000 vacancies for AI-related professionals.[[46]](#txt004.xhtml#footnote_content_txt004_46)
    This indicates that a "skills gap" still exists, with a severe shortage of high-end
    talent. To this end, the EU vigorously promotes the diversified and interdisciplinary
    cultivation of AI talent (e.g., encouraging dual degrees in the AI field) (see
    Table 4-2).


    **Table 4-2 Distribution of AI Talents in Major EU Member States Unit: Persons**


    ![img](img/txt004_3.jpg)


    Source: Center for Science and Technology Policy, Tsinghua University. *China
    AI Development Report 2018*, 2018. Note: The UK had not yet left the EU in 2018,
    so it is included in the statistics.


    According to expert data from global AI conferences collected and compiled by
    LinkedIn, the UK and Germany have different situations in AI talent cultivation
    and development. The UK has long attached importance to industrial development,
    leading many UK AI professors and talents to move from academia to industry. In
    the UK, only 14% of AI talents have attended academic conferences.


    Germany is the opposite of the UK. Germany has a large number of AI experts and
    professors in academia, and nearly 44% of AI talents have attended academic conferences.[[47]](#txt004.xhtml#footnote_content_txt004_47)
    To this end, Germany has been seeking to provide a common growth space for industry
    and academia, accelerate the commercialization of AI, and establish new technology
    centers. It can be seen that Germany''s AI talent cultivation is driven more by
    academia, while the UK''s is driven more by industry.


    Besides the UK and Germany, other countries also vigorously promote the cultivation
    of interdisciplinary talents. In February 2018, the Paris-Saclay University Community
    established the `DATAIA Institute`, an interdisciplinary data institute that cultivates
    AI talents through an interdisciplinary approach combining data science with humanities
    and social sciences. In March of the same year, the French National Center for
    Scientific Research (CNRS), the National Institute for Research in Digital Science
    and Technology (Inria), the PSL Research University, and relevant enterprises
    jointly established the `PRAIRIE Institute` in Paris, pooling the forces of French
    AI research academia and industry to jointly cultivate professional AI talents.[[48]](#txt004.xhtml#footnote_content_txt004_48)


    In addition, close cooperation between universities and between universities and
    research institutions is also an important way to promote the rapid growth of
    AI talents. As an emerging industry, AI has developed rapidly in recent years.
    To gain a foothold in the fiercely competitive AI industry, complementary advantages
    and collective efforts among institutions are a good approach. Relying on universities
    such as Oxford, Cambridge, Imperial College London, and University College London,
    the UK has formed the `London-Oxford-Cambridge` alliance, engaging in mutual exchange
    and cooperation, giving the UK denser educational research resources and profound
    research foundations, accelerating the cultivation of a large number of outstanding
    AI talents.[[49]](#txt004.xhtml#footnote_content_txt004_49)


    ### Finally, Bridge the "Learning Gap", Launch Employment/Career and School Education
    Programs


    EU countries all emphasize the importance of S&T talent for AI progress, striving
    to strengthen talent cultivation at the school education stage.


    In 2018, the EU launched the following initiatives in student employment/career
    and school education policies: 1. Implement specialized training and retraining
    programs to provide new technology training for professionals threatened by automation;
    2. Monitor labor market changes and skills gaps within the EU and make recommendations;
    3. Provide advanced digital skills training programs for students and graduates;
    4. Encourage school-enterprise cooperation to attract more AI talents; 5. Invite
    social partners to focus on AI and its impact on employment and the economy in
    their joint work programs, as well as the importance of diversity and gender balance
    in AI jobs; 6. Integrate AI into school curricula.[[50]](#txt004.xhtml#footnote_content_txt004_50)


    In terms of talent cultivation, the UK has introduced relevant incentive policies.
    The government established a full scholarship program at the higher education
    level to meet the demand for S&T talent in robotics, automation systems, and related
    fields. Germany has "established AI majors in universities, launched cultivation
    and teaching programs for young scientific scholars, adding at least 100 professors;
    included AI basic knowledge in vocational education and training curricula; formulated
    an AI skilled worker strategy," etc.[[51]](#txt004.xhtml#footnote_content_txt004_51)
    In September 2018, the École Polytechnique in Paris jointly established the `Artificial
    Intelligence and Advanced Visual Computing` chair with Google, stating that "the
    establishment of this chair can fully leverage France''s teaching and research
    advantages in mathematics and information science, allowing the younger French
    generation to better adapt to the changes brought by future digitalization." The
    French energy company Enedis provided 3 scholarship places for master''s students
    for the 2018-2020 academic years, with each student receiving 30,000 euros in
    funding.[[52]](#txt004.xhtml#footnote_content_txt004_52)


    ## Improve Ethical and Legal Frameworks, Rationalize Human-Machine Relations


    Science and technology have always been neutral; they can benefit humanity or
    harm it. In human history, technological progress has brought ethical and legal
    dilemmas more than once. Only by establishing sound AI ethical and legal norms,
    and properly handling the new relationship between machines and humans, can we
    better reap the dividends of AI and let technology benefit humanity.


    ### First Aspect: Machines Cannot Be Amoral (Must Have Ethics)


    The mainstream view in the scientific community currently is that machines cannot
    be without ethics; otherwise, the world would be unimaginable. Professor Rosalind
    Picard, Director of the Affective Computing Research Group at MIT, once said:
    "The more freedom a machine has, the more it needs ethical guidelines."[[53]](#txt004.xhtml#footnote_content_txt004_53)
    Margaret Boden also mentioned the concept of a "moral community" in her writings,
    expressing the inclination that humans should accept strong AI as members of the
    moral community.[[54]](#txt004.xhtml#footnote_content_txt004_54)


    AI is a double-edged sword; it can be used to serve individual and social interests,
    but it can also be abused. Therefore, the EU is actively establishing an appropriate
    ethical framework to create a sound moral environment for the development and
    application of AI, achieving a balance between technological innovation and human
    rights protection.


    #### 1. Establish AI Ethics Regulatory Bodies


    In January 2015, considering the new issues that AI development might bring, the
    European Parliament''s Committee on Legal Affairs (JURI) specifically established
    a working body responsible for robots and AI to study ethical and regulatory issues
    related to robots and AI. In May 2016, JURI released the `Draft Report with Recommendations
    to the Commission on Civil Law Rules on Robotics`. In October of the same year,
    the `Civil Law Rules on Robotics` was released, proposing professional provisions
    on technology, ethics, regulation, and other matters, to better seize new opportunities
    and address new challenges in AI development.


    The British public expressed concerns about how AI machines access, store, and
    use confidential patient data, believing that effective measures are needed to
    ensure that data used by AI systems is reasonably restricted, managed, and controlled
    to protect privacy rights. To address these issues, the UK released the report
    `Artificial Intelligence: Opportunities and Implications for the Future of Decision
    Making` in June 2016, comprehensively analyzing the impacts of robotics and automated
    systems. The UK is collaborating with the Alan Turing Institute to establish a
    `Data Ethics Committee` aimed at studying data science, to strengthen the review
    of data usage.[[55]](#txt004.xhtml#footnote_content_txt004_55)


    #### 2. Formulate Ethical Codes


    The EU and member states actively formulate ethical codes for AI R&D and review
    personnel, ensuring human values are considered throughout the entire R&D and
    review process, so that developed robots align with human interests.


    The UK took a step ahead. In April 2016, the British Standards Institution (BSI)
    released the `Guide to the Ethical Design and Application of Robots and Robotic
    Systems`, taking the first step in "embedding ethical values into the field of
    robotics and AI." This provides ethical guidance for identifying potential ethical
    hazards, robot design, and application, and improves safety requirements for different
    types of robots. The `Guide` also points out that for robot behavior, the responsible
    person behind it should be found; humans should be responsible for matters, not
    robots. The `Guide` also mentions the emergence of social issues like robot discrimination,
    reminding R&D enterprises to enhance robots'' respect for cultural diversity and
    pluralism.[[56]](#txt004.xhtml#footnote_content_txt004_56)


    In April 2018, the European Commission established the High-Level Expert Group
    on Artificial Intelligence (AI HLEG), composed of 52 representatives from academia,
    business, and civil society, inviting all stakeholders to jointly discuss the
    drafting and formulation of AI ethical principles. In December of the same year,
    the expert group released the `Draft Ethics Guidelines for Trustworthy AI`.


    In April 2019, the European Commission released the `Ethics Guidelines for Trustworthy
    AI`, addressing numerous issues related to AI impact, fairness, safety, social
    inclusion, algorithmic transparency, etc., proposing fundamental ethical principles
    of respect for human autonomy, prevention of harm, fairness, and explicability
    (responsibility), and further focusing on AI''s impact on fundamental rights (such
    as privacy, dignity, consumer protection, non-discrimination, etc.). The EU emphasizes
    that it will base itself on these fundamental rights to seek ways consistent with
    European fundamental values to rationally utilize AI and promote the development
    of responsible, trustworthy AI. At the same time, the European Commission unveiled
    the `AI Vision`, firmly supporting the "ethical-compliant" growth of AI in EU
    countries. The EU hopes to prepare for potential risks before AI further develops
    and fully integrates into society, making Europe a leader in advanced, ethical
    AI.


    #### 3. Attach Importance to Privacy and Data Protection


    As data becomes a "circulating commodity," various services can trade it, making
    more frequent data flows possible. This brings more new issues regarding data
    ownership that need clarification, including privacy and data protection. Personal
    privacy and data protection have thus become a long-standing focus of the international
    community. In this regard, Europe took the first step again. In 1973, Sweden enacted
    the world''s first personal data protection law, the `Swedish Data Act`. Since
    its enactment, a wave of personal information protection legislation has swept
    the globe.


    In 1995, the EU adopted the `Directive on the Protection of Individuals with Regard
    to the Processing of Personal Data and on the Free Movement of Such Data (95/46/EC)`
    (referred to as the 1995 Data Protection Directive), a foundational legislation
    for personal information protection within the EU. Member states enacted their
    own personal information protection laws based on this directive. However, rapidly
    evolving information technology made the directive''s main principles and system
    applicability very uncertain, leading to significant divergences in understanding
    and implementation among member states.


    In January 2012, the European Commission released the `Legislative Proposal on
    the 1995 Data Protection Directive` (referred to as the `General Data Protection
    Regulation` - GDPR), comprehensively revising the 1995 Directive. In December
    2015, the three legislative bodies—the European Parliament, the Council, and the
    Commission—reached agreement on the EU data protection reform in the final stage
    of the legislative process. In April 2016, the three major EU legislative bodies
    adopted the final version of the `General Data Protection Regulation`.


    In the newly adopted regulation, the EU strengthened personal privacy and data
    protection, where provisions on automated decision-making such as user profiling
    have had a significant impact on the practices of the big data-based internet
    industry. Additionally, in the communications and internet fields, the European
    Commission began formulating stricter electronic communications privacy regulation,
    the `ePrivacy Regulation`, in January 2017, refining conceptual standards such
    as privacy protection, privacy by default, informed consent, and encryption, further
    strengthening the protection of electronic communications data.[[57]](#txt004.xhtml#footnote_content_txt004_57)


    ### Second Aspect: Robots Should Have Legal Status


    #### 1. Focus on the Legal Status of Autonomous Robots


    The question of whether humans should grant rights to robots essentially concerns
    whether to recognize the subject status of robots. As early as the 1950s and 60s,
    when AI was just starting, philosophers proposed that whether to view robots as
    machines or artificial life depends mainly on human decisions, not scientific
    discoveries.


    In 1976, Asimov''s sci-fi novel `The Bicentennial Man` told the story of an intelligent
    robot named Andrew, whose self-awareness awakens and who wants to become human.
    To this end, he starts a robot company, develops new technologies to make his
    vital signs the same as an ordinary human, and even undergoes surgery to limit
    his remaining life to one year (since machines are immortal in the foreseeable
    future), ultimately gaining human life.


    Notably, these movie plots have entered real society. In October 2017, the robot
    Sophia was granted citizenship by the Kingdom of Saudi Arabia, becoming the first
    robot in history to receive citizenship.[[58]](#txt004.xhtml#footnote_content_txt004_58)
    This compels us to rationally consider the "human rights" issue of AI: if considering
    granting robots legal personality, it requires them to be able to independently
    express corresponding intent, possess independent rights and capacity for action,
    and bear corresponding legal responsibility for their own actions.

