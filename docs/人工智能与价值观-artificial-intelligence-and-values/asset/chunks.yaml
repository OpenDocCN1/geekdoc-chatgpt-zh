    # 第 4 章 人工智能与欧洲价值观


    早在 2013 年，欧洲主要国家就开始对人工智能进行系统性布局，如法国政府发布了《法国机器人发展计划》。但此时，欧洲其他各国对人工智能普遍重视不足，与人工智能相关的政策主要集中于机器人、脑科学等领域。


    2016 年，谷歌人工智能程序 Alpha Go 战胜韩国围棋名手李世石，此时诸多国家纷纷认识到人工智能真正的潜力，各国政府开始讨论人工智能可能给社会、经济带来的颠覆性影响，“人工智能”一词频频出现于各类政府报告中。其中最典型的，就是奥巴马政府发布的《为人工智能的未来做准备》《国家人工智能研究与发展战略计划》和《人工智能、自动化与经济》等报告。一石激起千层浪，报告一经发布，人工智能就得到包括欧洲在内的各国政府、金融界、产业界和学术界高度重视。在此背景下，欧洲开启了自己的人工智能发展之路。


    ## 差异竞争：确立以人为本的价值观战略


    2018 年 3 月，有欧盟智库之称的欧洲政治战略中心发布题为《人工智能时代：确立以人为本的欧洲战略》的报告。[\[1\]](#txt004.xhtml#footnote_content_txt004_1)
    报告指出，欧洲在人工智能领域投资少且缺乏全球规模的数字公司。在深度学习领域、专利申请和投资方面，也落后于美国和中国。在这种情况下，欧洲政治战略中心建议欧盟鼓励发展人工智能并努力建立起人与机器的共生关系。它提出欧盟应确立以“人为本”的战略，把政策目标定为使人们感到被人工智能赋能，而非被其威胁。


    2018 年 4 月，欧盟委员会发布政策文件《欧盟人工智能》（Artificial Intelligence for Europe），提出了欧盟的人工智能发展道路。向来有着人权传统的欧盟决定另辟蹊径，着重探讨人工智能的价值观。在技术占劣势的情况下，欧盟希望向国际社会输出富有自身特色价值观的人工智能，引领人工智能的发展方向，塑造人工智能在社会中的积极角色。这份文件表达出欧盟要竭力确保在人工智能领域占有国际竞争力的决心，并努力让欧盟国家都能跟上这场数字变革并以欧盟价值观作为新技术的基础。[\[2\]](#txt004.xhtml#footnote_content_txt004_2)
    仅在 7 个月之后，德国发布《德国联邦政府人工智能战略报告》，积极响应欧盟提出的“以人为本”价值观，着力促进“实现以人为本、以社会福祉为导向的应用”。[\[3\]](#txt004.xhtml#footnote_content_txt004_3)


    ### 尊重公民价值观及权利


    技术从来都不中立。人工智能需要价值观，需要伦理约束。欧盟提出了人工智能价值观，并自信地认为这将是欧盟对国际社会的独特贡献。


    2020 年 2 月，欧盟委员会《人工智能白皮书》再次强调，“考虑到人工智能可能对我们的社会产生的重大影响以及建立信任的需要，欧洲的人工智能必须以欧洲价值观和人类尊严及隐私保护等基本权利为基础，这一点至关重要”[\[4\]](#txt004.xhtml#footnote_content_txt004_4)。该白皮书在充分尊重欧盟公民的价值观和权利的情况下，为人工智能在欧洲得到信任和安全发展提供了政策方向。它强调，“未来欧洲人工智能监管框架的关键要素，是将创建一个独特的‘信任生态系统’。要做到这一点，必须确保遵守欧盟的规则，包括保护民众基本权利的规则，特别是针对在欧盟运行的、风险较高的人工智能系统。建立一个信任的生态系统本身就是一个政策目标，它应该让公民有信心接受人工智能应用，为企业和公共组织利用人工智能创新发展提供法律确定性”。


    ### 加强协调与合作


    为建立一个卓越的“生态系统”，进一步建立和完善价值观，以支持整个欧盟经济和公共行政部门发展人工智能，欧洲正在积极从多个层面加强行动。


    #### 与成员国合作


    欧盟委员会于 2018 年 4 月通过了关于人工智能的战略，并于 2018 年 12 月提出了一项协同计划——与各成员国一起制定——促进欧洲人工智能的发展和使用。该计划提出了约
    70 项联合行动，以便成员国与欧盟委员会在研究、投资、市场吸收、技能和人才、数据以及国际合作等关键领域开展更密切、更有效的合作。该计划预计运行到 2027
    年，并定期进行监测和审查。协同计划的目的是最大程度地扩大研究、创新和部署方面的投资，评估各国人工智能战略，并在此基础上继续深化扩大与成员国的人工智能协调发展。欧盟在人工智能领域的资助，将集中在超出单个成员国能力范围的领域。在未来
    10 年内，欧盟每年在人工智能领域投资超过 200 亿欧元。为了刺激私人和公共投资，欧盟将从“数字欧洲”计划、“地平线欧洲”计划以及“欧洲结构投资基金”中调配资源，以满足发达地区和农村地区的需求。


    这项协同计划也可以作为人工智能的一个重要原则来处理社会和环境福利。欧洲承诺人工智能及其生态系统会以一种环境友好的方式帮助解决最紧要的问题，包括气候变化和环境恶化。人工智能还能够检查资源使用和能源消耗情况，并做出对环境有利的选择。


    欧盟鼓励各个成员国制定人工智能战略，设定投资计划。此外，彼此之间分享实践经验，加强协同合作并确保行动始终一致，这都能够提高欧盟在人工智能领域的国际竞争力。在互控操作性、数据池等方面展开合作，协同制定法律规则，有利于避免欧盟内部的碎片化监管，也利于人工智能创业公司涌现。


    目前，一些成员国已经或正在制定人工智能发展的战略计划。2018 年 3 月，法国出台了国家人工智能战略。德国以“工业 4.0”为基础，建立了一个学习系统平台，促进学术界、工业界和政府之间的战略对话，并进一步提出关于自动驾驶和互联驾驶伦理的报告。2018
    年 4 月，24 个成员国与挪威签署合作宣言，承诺在人工智能领域形成合力，并与欧盟委员会展开战略对话。[\[5\]](#txt004.xhtml#footnote_content_txt004_5)


    #### 聚焦研究和创新社群的努力


    欧洲无力维持目前分散的研究中心格局，也没有一个与全球领先机构竞争的体量规模。因此，欧盟认为有必要在人工智能研究中心之间建立更多的协同效应和网络，协调他们的工作以提高水平，保留和吸引最好的研究人员并开发最好的技术。


    这些中心和网络应集中在欧洲有潜力成为全球冠军的部门之中，例如工业、卫生、运输、金融、农业、能源、环境、林业、地球观测和太空。而在这些领域中，全球领导地位的争夺战一直在进行。欧洲为此提供了巨大的资本、知识和专业技术，创建了多个测试和实验站点，支持新型人工智能应用开发和后续部署。


    在整合欧洲、国家和私人投资的基础上，欧盟委员会已协助建立创新中心和测试中心。同时，欧盟委员会拨付巨额款项，专门用于支持“数字欧洲”计划下世界级检测中心的建设，并在适当情况下通过“地平线欧洲”计划的“研究和创新行动”进一步予以支持。


    #### 与私营企业合作


    确保私营企业充分参与并提供必要投资也很重要。发展人工智能，需要融入利益相关方，需要调动企业、消费者组织以及其他团体代表在内的多元参与者。欧洲相关人士认为，这需要建立广泛的公私合作伙伴关系，并征得公司最高管理层的一致同意。


    为此，欧盟建立了广泛的多利益相关方平台和欧洲人工智能联盟，在人工智能相关问题上展开合作和交流。在“地平线欧洲”项目背景下，欧盟委员会在人工智能、数据和机器人技术方面，与该项目的其他公私伙伴进行协作，并与测试中心和创新中心共同努力，确保人工智能研究与创新协调发展。2017
    年 9 月，富士集团与巴黎综合理工大学合作开设了“人工智能卓越中心”，预计 5 年内投资 5 000 万欧元开展人工智能研发。富士集团法国区总裁本杰明·莱克莱弗斯基表示，将加强巴黎人工智能卓越中心的研发工作，挖掘与欧洲其他国家的联合研发潜力，特别是加强与富士德国区工业
    4.0 研发中心的紧密合作。[\[6\]](#txt004.xhtml#footnote_content_txt004_6)


    #### 加强国际合作


    在围绕共同价值观和促进人工智能的应用伦理方面，欧洲努力保持全球领先地位。欧盟在人工智能方面的工作已经影响了国际讨论。在制定伦理准则时，欧盟吸收了一些非欧盟组织和若干政府观察员。欧盟还积极参与制定亚太经合组织的人工智能道德原则。随后在
    2019 年 6 月，二十国集团在关于贸易和数字经济的部长声明中也认可了这些原则。


    与此同时，欧盟认识到在其他多边组织，如联合国教科文组织、经济合作与发展组织[\[7\]](#txt004.xhtml#footnote_content_txt004_7)、世界贸易组织和国际电信联盟中开展人工智能合作的重要性。在联合国，欧盟参与了数字合作高级别小组报告的后续工作，包括提供人工智能的发展建议。基于伦理规则和价值观（如支持自下而上的监管趋同、获取包括数据在内的关键资源、创造公平的竞争环境），欧盟在人工智能方面继续与志同道合的国家合作，也与其他全球参与者合作。欧盟委员会密切监测第三国限制数据流动的政策，并通过世界贸易组织范围内的行动，处理双边贸易谈判中的不当限制。欧盟委员会坚信，关于人工智能的国际合作，必须基于一种尊重基本权利的方法，包括人的尊严、多元化、包容、非歧视以及对隐私和个人数据的保护。该委员会将努力在全世界传播其价值观。同样，负责任地开发和使用人工智能可以成为实现可持续发展目标和推进
    2030 年议程的驱动力。[\[8\]](#txt004.xhtml#footnote_content_txt004_8)


    ### 人机共存是未来趋向


    机器智能的发展不仅将模糊人与机器之间的界限，更会加剧冲击现有网络信任关系和安全。随着人工智能的发展，当更高级别的通用型人工智能和超级人工智能出现之时，人类与机器的关系将会面临新的挑战，包括人机之间如何协助和如何相处，机器是否可以享有人类与人类之间的人道主义待遇。而所有这些，都将成为未来社会无法回避的问题。


    早在 2013 年，欧盟研究机构就预感到人工智能的迅速发展和普及，可能会对未来就业市场产生颠覆且不可逆转的影响，它们通过市场风险分析，发表了一系列预测报告。另外，牛津大学学者卡尔·贝内迪克特·弗雷和迈克尔·奥斯本检验了
    702 种职业被计算机化的可能性，按照被取代的风险大小进行了排序，最终认为美国将会有 47％的工作面临被计算机取代的风险。其中电话促销员、会计、体育裁判、法务秘书以及收银员等
    5 个工种被认定为最有可能被计算机取代的工作。后续的研究指出英国有 35％的职业可能被取代。[\[9\]](#txt004.xhtml#footnote_content_txt004_9)
    对此，英国“一些著名的科技精英表达出对人工智能的警惕以及悲观态度，如霍金在《卫报》上发表《这是我们星球最危险的时刻》一文，认为工厂自动化已经影响了传统制造业的工作，人工智能的兴起将继续破坏中产阶级的工作”。[\[10\]](#txt004.xhtml#footnote_content_txt004_10)
    英国玛格丽特·博登在《人工智能的本质与未来》一书中也提到了类似的担心。[\[11\]](#txt004.xhtml#footnote_content_txt004_11)
    有的研究认为人工智能也会影响德国的制造业，“机器人和计算机技术的普及将减少约 61 万个组装和生产类岗位”。[\[12\]](#txt004.xhtml#footnote_content_txt004_12)


    尽管如此，欧洲各国对人机关系的未来也有不同看法。欧盟发布了《机器人战略研究议程（2014—2020）》，分析了未来机器人发展的技术群，包括系统设计、机械电子、人机交互及智能技术。其中，人机交互技术群主要包括人机界面、人机合作和安全技术。[\[13\]](#txt004.xhtml#footnote_content_txt004_13)
    由此可见，人机合作已成未来人机关系的大趋势。


    此外，埃森哲咨询公司首席技术官保罗·多尔蒂曾撰文指出，人工智能到 2035 年就可以帮助许多发达国家实现经济增长率翻倍、完成就业转型，并培养出人类与机器间的新型关系。


