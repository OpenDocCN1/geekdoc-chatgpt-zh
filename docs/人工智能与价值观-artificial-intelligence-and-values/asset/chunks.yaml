    资料来源：国务院发展研究中心国际技术经济研究所、中国电子学会、智慧芽.人工智能全球格局：未来趋势与中国位势［M］.北京：中国人民大学出版社，2019：332.说明：此时英国尚未脱欧。


    到下一阶段（2021—2027年），欧盟将继续扩大投资，通过成员国共同努力，支持有关机构和部门部署和使用人工智能系统。[\[37\]](#txt004.xhtml#footnote_content_txt004_37)


    吸引私人投资。充分的私人投资对人工智能研发与应用也极为重要。为此，欧盟持续吸引私人投资以支持人工智能研发和行业应用。欧盟已经与欧洲投资银行集团展开合作，在2018—2020年投资5亿欧元。[\[38\]](#txt004.xhtml#footnote_content_txt004_38)根据“地平线欧洲”计划的部署，欧盟委员会已与欧洲机器人协会合作推动民用机器人研发计划——“SPARC”，欧盟委员会出资7亿欧元，欧洲机器人协会投入21亿欧元[\[39\]](#txt004.xhtml#footnote_content_txt004_39)，使得“SPARC”计划成为世界上最大的民间资助机器人创新计划。


    此外，欧盟委员会和欧洲投资基金会推出21亿欧元的泛欧风险投资基金计划，加大对欧洲创新型创业公司的投资。[\[40\]](#txt004.xhtml#footnote_content_txt004_40)2020年，欧盟在人工智能领域的公共和私人总投资至少已达到200亿欧元。[\[41\]](#txt004.xhtml#footnote_content_txt004_41)


    ### 重视人才培育，促进教育和培训体系升级


    200多年前，由于担心机器会夺走人们的工作进而毁灭人类，英国工人开展了轰轰烈烈的卢德运动，捣毁了取代工人工作的机器；2000年，高盛在纽约总部的美国现金股票交易柜台雇用了600名交易员，到2017年只剩两名；2016年以来，AlphaGo在围棋人机大战中先后击败李世石和柯洁。金融、围棋等行业受到如此重大的冲击，人们不禁会问：人工智能是否会抢了人类的饭碗？


    诺贝尔经济学奖得主列昂季耶夫曾表示，未来三四十年将有大量工人被人工智能取代，从而形成巨大的就业与转业问题，就像20世纪大量马匹被机械取代一样，只不过这些后果将发生在人的身上，除非政府能够对新技术带来的红利进行再分配。欧盟清醒地认识到这种全球性社会变革，并早已着手准备，应对诸多不可预见的挑战。


    首先，消除“数字鸿沟”，为每个人提供所需的数字技能。


    数字化正在影响劳动力市场结构：中等技能工作正在被自动化，低技能工作将会受到人工智能更为显著的影响。预测人工智能的潜在就业影响并投资于劳动者，正是以人为本的人工智能价值观所要求的。因此，为了避免区域、产业或人群之间不平等的继续扩大，欧盟为受人工智能和自动化影响的劳动者提供学习新知识和新技能的机会，帮助过渡转型期工人尽快找到新岗位。在2014—2020年期间，欧盟投入270亿欧元支持技能培养，其中23亿欧元专门用于培养数字技能，重点与私营部门合作开展数字技能培训项目。[\[42\]](#txt004.xhtml#footnote_content_txt004_42)


    同时，欧洲投入了大量精力与资金开展电子商务与人机协作的相关研究。[\[43\]](#txt004.xhtml#footnote_content_txt004_43)欧盟委员会尝试在“B
    to C”交易中，促进人类——人工智能的互动和合作。为了建立公平、透明的应用环境，明确保护消费者的法律要求，并便于人们使用人工智能，欧盟主张个人应当知悉人工智能产品的用途、性能和特征，对使用人工智能产品过程中产生的数据享有控制权，并有权知道自己是在与人类还是在与机器人交流。尤其是当个人与机器人交流时，应当知晓如何向人类求援、如何纠正操作失误、如何查看系统决定。通过这类尝试，欧盟正在充分赋能个人。


    欧盟成员国也在积极行动。2018年9月，德国通过《高科技战略2025》，作为未来高科技发展的指导方针，德国政府集众多公共部门和科研机构之力，建立促进研究和创新的战略框架，以“为人研究和创新”为主题，把支持微电子、材料研究与生物技术、人工智能等领域的未来技术发展和培训与继续教育紧密衔接。2018年11月，德国正式发布《德国联邦政府人工智能战略》，提出了“AI
    Made in Germany”（AI德国造）的口号，将人工智能提升到国家战略高度。这份人工智能战略全面思考了人工智能对社会各领域的影响，并强调重视人工智能在中小企业的应用。[\[44\]](#txt004.xhtml#footnote_content_txt004_44)


    除德国之外，英国也有所行动。2016年10月，英国发布《机器人技术和人工智能》报告，强调在消除数字鸿沟方面应鼓励公众积极参与。加强公众参与，可以让公众更好地与人工智能科技互动，更好地理解和处理人工智能带来的社会问题，如通过辅助智能机器人技术减少人力成本急剧升高的问题。通过鼓励公众参与，人们对于人工智能未来更加充满信心，更有利于促进以人工智能为基础的科技发展。


    英国专家们也都认为积极、负责的人工智能法规及其监管，不应局限于少数专家和利益相关者，也应多听取社会公众的意见。在人工智能政策制定过程中，应有更多的披露措施，这有利于公众了解人工智能发展带来的社会、道德和法律问题，也有利于英国建立公众对于政府的信任，同时促进先进技术更为广泛的应用。[\[45\]](#txt004.xhtml#footnote_content_txt004_45)


    其次，跨越“技能鸿沟”，培养多元、跨学科人才。


    随着人工智能受到世界各国和各科技企业的关注，欧洲对人工智能人才的需求在过去几年里也迅速增长，各大企业对经验丰富、技术娴熟特别是高学历的人工智能人才有着强烈的需求。


    2011年以来，信息和通信技术专家需求每年增长5％，并在短短五年内迅速将总就业份额从3％增加到3.7％。但是在欧洲，人工智能相关专业人员还至少有35万个职位空缺。[\[46\]](#txt004.xhtml#footnote_content_txt004_46)这表明还是存在“技能鸿沟”，高端人才严重供应不足。为此，欧盟大力促进人工智能人才多元化、跨学科培养（如鼓励人工智能领域双学位）（见表4-2）。


    表4-2　欧盟主要成员国人工智能人才分布　单位：人


    ![img](images/txt004_3.jpg)


    资料来源：清华大学中国科技政策研究中心.中国人工智能发展报告2018，2018.说明：2018年英国尚未脱欧，所以统计在列。


    根据Linked In搜集整理的全球人工智能各大会议的专家数据显示，英、德两国在人工智能人才培养和建设上有着不尽相同的境况。英国一直较为重视工业发展，这导致英国人工智能教授、人才等纷纷从学术界进入工业界。在英国，只有14％的人工智能人才出席过学术会议。


    德国则与英国相反。德国在学术界拥有大量的人工智能专家和教授，并且有近44％的人工智能人才曾出席过学术会议。[\[47\]](#txt004.xhtml#footnote_content_txt004_47)为此，德国一直寻求给工业界和学术界一个共同的成长空间，加快推进人工智能商业化，并建立新型技术中心。由此可见，德国人工智能人才培育更多来源于学术界推动，而英国更多来自行业驱动。


    除了英国和德国之外，其他国家也大力促进跨学科人才的培养。2018年2月，巴黎—萨克雷大学共同体成立“DATAIA研究所”，该研究所是一所跨学科数据研究所，通过将数据科学与人文社会科学相结合的跨学科方式，培养人工智能领域人才。同年3月，由法国国家科学研究中心、国家信息化与自动化研究所、巴黎文理研究大学共同体以及相关企业在巴黎联合成立了“PRAIRIE研究所”，集中法国人工智能研究学术界和企业界的力量，共同培养人工智能专业人才。[\[48\]](#txt004.xhtml#footnote_content_txt004_48)


    除此以外，高校之间、高校与科研机构之间的紧密合作，也是促进人工智能人才快速成长的重要途径。人工智能作为新兴产业，近几年发展迅猛。要想在竞争激烈的人工智能产业中占有一席之地，各个机构之间优势互补、群体作战不失为一种很好的方式。英国依托牛津大学、剑桥大学、帝国理工大学和伦敦大学学院等高校形成“伦敦—牛津—剑桥”联盟，相互之间交流合作，使得英国拥有更为密集的教育研究资源和深厚科研底蕴，加快培养大批优秀的人工智能人才。[\[49\]](#txt004.xhtml#footnote_content_txt004_49)


    最后，弥补“学习鸿沟（learning gap）”，推出就业择业和学校教育计划。


    欧盟各国都着重强调科技人才对于人工智能进步的重要性，力图通过在学校教育阶段加大人才培养。


    2018年，欧盟在学生就业择业和学校教育政策方面推出以下举措：一是推行专门的培训和再培训计划，为受自动化威胁的专业人员提供新技术培训项目；二是监测劳动力市场变化及欧盟范围内的技能缺口并提出建议；三是为学生和毕业生提供高级数字技能培训项目；四是鼓励校企合作，吸引更多人工智能人才；五是邀请社会合作伙伴在其联合工作计划中关注人工智能及其对就业和经济的影响，以及人工智能工作岗位多元化和性别平衡的重要性；六是把人工智能融入到学校课程。[\[50\]](#txt004.xhtml#footnote_content_txt004_50)


    英国在培育人才方面，出台相关奖励政策。政府在高等教育层面设立全额奖学金计划，满足机器人技术与自动化系统及相关领域对于科技人才的需求。德国“在高校设立AI专业，推出科学青年学者培养及教学计划，至少新增100名教授；将AI基础知识作为职业教育和培训教学内容；制定AI技术工人战略等”。[\[51\]](#txt004.xhtml#footnote_content_txt004_51)2018年9月，法国巴黎综合理工大学与谷歌联合开设“人工智能与高级视觉计算”教席，“设立该教席能充分发挥法国在数学和信息科学专业的教学科研优势，让法国青年一代能更好地适应未来数字化带来的变革”。法国Enedis电力公司为2018—2020学年硕士生提供3个奖学金名额，每位学生可获得3万欧元资助。[\[52\]](#txt004.xhtml#footnote_content_txt004_52)


    ### 健全伦理和法律框架，理顺人机关系


    科学技术从来都是中性的，可以造福人类，也可以危害人类。在人类发展史上，科技进步不止一次带来了伦理和法律难题。只有建立完善的人工智能伦理和法律规范，处理好机器和人类的新关系，才能更好地获得人工智能红利，让技术造福人类。


    第一个方面：机器不能不讲道德。


    当下科学界主流观点是机器不能不讲道德，否则，这个世界将无法想象。麻省理工学院情感计算研究组主任罗萨琳德·皮卡德教授曾说过：“机器越自由，就越需要道德准则。”[\[53\]](#txt004.xhtml#footnote_content_txt004_53)玛格丽特·博登也在著作中提到了“道德社区”的概念，并且表达出人类应该接受强人工智能成为道德社区成员的倾向。[\[54\]](#txt004.xhtml#footnote_content_txt004_54)


    人工智能是一把双刃剑，既可被用来服务于个人和社会利益，也可能被滥用。因此，欧盟正在积极建立适当的伦理框架，为发展和应用人工智能创造一个良好的道德环境，实现技术创新和人权保护的平衡。


    一是建立人工智能伦理监管机构。2015年1月，考虑到人工智能发展可能带来的新问题，欧洲议会法律事务委员会（JURI）专门成立负责机器人和人工智能的工作机构，研究与机器人和人工智能相关的伦理及监管问题。2016年5月，JURI发布《就机器人民事法律规则向欧盟委员会提出立法建议的报告草案》。同年10月发布《欧盟机器人民事法律规则》，就技术、伦理、监管等事宜提出专业条文知识，以便更好地抓住人工智能发展的新机遇，应对新挑战。


    英国民众表达了对于人工智能机器以何种方式进入、存储和使用保密的病人数据的关切，认为需要有效措施来保证人工智能系统使用的数据被合理地限制、管理和控制，以此来保护隐私权。为了应对这些问题，英国于2016年6月发布了《人工智能：未来决策制定的机遇与影响》的报告，全面分析了机器人技术和自动化系统带来的影响。英国正和阿兰·图灵研究所合作建立旨在研究数据科学的“数据伦理委员会”，以此来加强数据使用的审查。[\[55\]](#txt004.xhtml#footnote_content_txt004_55)


    二是制定伦理守则。欧盟及成员国积极为人工智能研发和审查人员制定伦理守则，确保在整个研发和审查环节考虑人类价值，使研发的机器人符合人类利益。


    英国先人一步。2016年4月，英国标准组织（BSI）发布《机器人和机器系统的伦理设计和应用指南》，迈出了“把伦理价值观嵌入机器人和人工智能领域”的第一步。这为识别潜在伦理危害、机器人设计和应用提供伦理导向，并完善了不同类型机器人的安全要求。《指南》还指出，对于机器人行为，应该找到背后负责人，应该由人类对事情负责，而不是机器人。《指南》还提到机器人歧视等社会问题的出现，提醒研发企业要增进机器人对文化多样性和多元化的尊重。[\[56\]](#txt004.xhtml#footnote_content_txt004_56)


    2018年4月，欧盟委员会成立了由52位来自学界、商界与民间团体代表组成的人工智能高级专家组（High-Level Expert Group on Artificial
    Intelligence，AI HLEG），邀请所有利益相关方，共同探讨人工智能伦理原则的起草和制定。同年12月，高级专家组发布《可信赖人工智能伦理指南草案》。


    2019年4月，欧盟委员会发布《人工智能伦理指南》，回应了人工智能相关影响、公平、安全、社会包容、算法透明等诸多问题，提出尊重人类自治、防止伤害、公平和责任的基本伦理原则，并进一步关注人工智能对基本权利（比如隐私、尊严、消费者保护、禁止歧视等）的影响。欧盟强调，将以这些基本权利为基础，寻求与欧洲基本价值观相一致的方式，合理利用人工智能，推进负责任、可信赖人工智能的发展。同时，欧盟委员会公布了“人工智能愿景”，坚定支持欧盟各国人工智能“符合伦理”式的成长。欧盟希望在人工智能进一步发展和全面融入社会以前，对其可能存在的风险未雨绸缪，使欧洲成为先进、符合伦理的人工智能的领导者。


    三是重视隐私和数据保护。数据成为“流通物”，各种服务就可以对其进行交易，更频繁的数据流动也就成为可能，这给数据所有权带来更多需要明确的新问题，其中就包括隐私和数据保护的问题。个人隐私与数据保护也因此成为国际社会长期以来重点关注的内容。在这方面，欧洲又迈出第一步。1973年，瑞典颁布第一部个人数据保护法《瑞典数据法》。颁布以来，全球范围内掀起了个人信息保护立法的浪潮。


    1995年，欧盟通过《关于个人数据处理保护与自由流动指令（95/46/EC）》（简称1995年个人数据保护指令），这是一部欧盟区域内个人信息保护的基础性立法。欧盟各成员国依据该指令，分别出台了本国的个人信息保护法。然而日新月异的信息技术使得该指令的主要原则及制度适用变得非常不确定，导致各成员国对个人数据保护指令的理解与执行出现了较大的分歧。


    2012年1月，欧盟委员会发布了《有关“1995年个人数据保护指令”的立法建议》（简称《通用数据保护条例》），对1995年个人数据保护指令进行全面修订。2015年12月，欧洲议会、理事会、委员会三方机构在立法进程的最后阶段就欧盟数据保护改革达成一致。2016年4月，欧盟三大立法机构通过《通用数据保护条例》的最终版本。


    在新通过的条例中，欧盟加强了个人隐私和数据保护，其中关于用户画像等自动化决策的规定，已经对基于大数据的互联网行业实践产生了重大影响。另外在通信和互联网领域，欧盟委员会于2017年1月起，开始制定更严格的电子通信隐私监管法案《隐私与电子通信条例》，完善了保护隐私、默认保护隐私、知情同意、加密等概念标准，进一步加强对电子通信数据的保护。[\[57\]](#txt004.xhtml#footnote_content_txt004_57)


    第二个方面：机器人应有法律地位。


    一是关注自主机器人的法律地位。是否应当由人类赋予机器人权利的问题，其实质在于是否承认机器人的主体地位。早在20世纪五六十年代，人工智能刚刚起步之时，就有哲学家提出：把机器人看作机器还是人造生命，主要取决于人们的决定而不是科学发现。


    1976年，阿西莫夫科幻小说《机器管家》就讲述了一个自我意识觉醒的智能机器人安德鲁想要成为人类的故事。为此，他开设机器人公司，研发新的技术，使自己在生命体征上和普通人一样，甚至最后通过手术让自己的生命只剩下一年（因为机器在可预期的将来是永生的），最终获得人类的生命。


    值得注意的是，这些电影情节已经进入到现实社会。2017年10月，机器人索菲亚被沙特阿拉伯王国授予了公民身份，成为有史以来首个获得公民身份的机器人。[\[58\]](#txt004.xhtml#footnote_content_txt004_58)这促使我们也不得不理性思考人工智能的“人权”问题：如果考虑赋予机器人以法律拟制人格，就要求其能够独立自主表达相应的意思，具备独立的权利和行为能力，可以对自己的行为承担相应的法律责任。'
  fmt: '

    ## 监测人工智能发展和应用情况


    监测人工智能发展和应用情况。欧盟委员会注重监测人工智能在整个经济活动中的应用和渗透，从中寻找人工智能可能给产业价值链带来的潜在变化以及对社会及法律发展和劳动力市场的影响。欧盟还将对人工智能产品和系统的技术能力进行基准测试，了解技术的实际发展情况，定期对人工智能战略所设定目标的实施进展情况进行评估。


    ## 第三，加大人工智能建设投资


    ### 加大政府投资


    欧洲生产的机器人目前占据全球市场32％的份额[\[34\]](#txt004.xhtml#footnote_content_txt004_34)，为了保持和扩大欧洲领导地位并确保经济和社会发展，到2020年底，欧盟将投入大约15亿欧元。[\[35\]](#txt004.xhtml#footnote_content_txt004_35)


    各成员国也纷纷加大人工智能战略投资，巩固人工智能发展成果并促进进一步创新，鼓励企业或机构进行相关测试和试验，加强高精尖研究中心的建设，保障所有利益相关方的利益，切实关注中小企业的人工智能发展和应用（见表4-1）。如德国在2018—2025年，“投入约30亿欧元资金用于AI研发，达到3.5％的研发目标，其中2019年预算为5亿欧元”。[\[36\]](#txt004.xhtml#footnote_content_txt004_36)


    **表4-1　欧盟及主要成员国人工智能战略投资**


    ![img](images/txt004_1.jpg)


    （续表）


    ![img](images/txt004_2.jpg)


    资料来源：国务院发展研究中心国际技术经济研究所、中国电子学会、智慧芽.人工智能全球格局：未来趋势与中国位势［M］.北京：中国人民大学出版社，2019：332.说明：此时英国尚未脱欧。


    到下一阶段（2021—2027年），欧盟将继续扩大投资，通过成员国共同努力，支持有关机构和部门部署和使用人工智能系统。[\[37\]](#txt004.xhtml#footnote_content_txt004_37)


    ### 吸引私人投资


    充分的私人投资对人工智能研发与应用也极为重要。为此，欧盟持续吸引私人投资以支持人工智能研发和行业应用。欧盟已经与欧洲投资银行集团展开合作，在2018—2020年投资5亿欧元。[\[38\]](#txt004.xhtml#footnote_content_txt004_38)根据“地平线欧洲”计划的部署，欧盟委员会已与欧洲机器人协会合作推动民用机器人研发计划——“SPARC”，欧盟委员会出资7亿欧元，欧洲机器人协会投入21亿欧元[\[39\]](#txt004.xhtml#footnote_content_txt004_39)，使得“SPARC”计划成为世界上最大的民间资助机器人创新计划。


    此外，欧盟委员会和欧洲投资基金会推出21亿欧元的泛欧风险投资基金计划，加大对欧洲创新型创业公司的投资。[\[40\]](#txt004.xhtml#footnote_content_txt004_40)2020年，欧盟在人工智能领域的公共和私人总投资至少已达到200亿欧元。[\[41\]](#txt004.xhtml#footnote_content_txt004_41)


    ## 重视人才培育，促进教育和培训体系升级


    200多年前，由于担心机器会夺走人们的工作进而毁灭人类，英国工人开展了轰轰烈烈的卢德运动，捣毁了取代工人工作的机器；2000年，高盛在纽约总部的美国现金股票交易柜台雇用了600名交易员，到2017年只剩两名；2016年以来，AlphaGo在围棋人机大战中先后击败李世石和柯洁。金融、围棋等行业受到如此重大的冲击，人们不禁会问：人工智能是否会抢了人类的饭碗？


    诺贝尔经济学奖得主列昂季耶夫曾表示，未来三四十年将有大量工人被人工智能取代，从而形成巨大的就业与转业问题，就像20世纪大量马匹被机械取代一样，只不过这些后果将发生在人的身上，除非政府能够对新技术带来的红利进行再分配。欧盟清醒地认识到这种全球性社会变革，并早已着手准备，应对诸多不可预见的挑战。


    ### 首先，消除“数字鸿沟”，为每个人提供所需的数字技能


    数字化正在影响劳动力市场结构：中等技能工作正在被自动化，低技能工作将会受到人工智能更为显著的影响。预测人工智能的潜在就业影响并投资于劳动者，正是以人为本的人工智能价值观所要求的。因此，为了避免区域、产业或人群之间不平等的继续扩大，欧盟为受人工智能和自动化影响的劳动者提供学习新知识和新技能的机会，帮助过渡转型期工人尽快找到新岗位。在2014—2020年期间，欧盟投入270亿欧元支持技能培养，其中23亿欧元专门用于培养数字技能，重点与私营部门合作开展数字技能培训项目。[\[42\]](#txt004.xhtml#footnote_content_txt004_42)


    同时，欧洲投入了大量精力与资金开展电子商务与人机协作的相关研究。[\[43\]](#txt004.xhtml#footnote_content_txt004_43)欧盟委员会尝试在“B
    to C”交易中，促进人类——人工智能的互动和合作。为了建立公平、透明的应用环境，明确保护消费者的法律要求，并便于人们使用人工智能，欧盟主张个人应当知悉人工智能产品的用途、性能和特征，对使用人工智能产品过程中产生的数据享有控制权，并有权知道自己是在与人类还是在与机器人交流。尤其是当个人与机器人交流时，应当知晓如何向人类求援、如何纠正操作失误、如何查看系统决定。通过这类尝试，欧盟正在充分赋能个人。


    欧盟成员国也在积极行动。2018年9月，德国通过《高科技战略2025》，作为未来高科技发展的指导方针，德国政府集众多公共部门和科研机构之力，建立促进研究和创新的战略框架，以“为人研究和创新”为主题，把支持微电子、材料研究与生物技术、人工智能等领域的未来技术发展和培训与继续教育紧密衔接。2018年11月，德国正式发布《德国联邦政府人工智能战略》，提出了“AI
    Made in Germany”（AI德国造）的口号，将人工智能提升到国家战略高度。这份人工智能战略全面思考了人工智能对社会各领域的影响，并强调重视人工智能在中小企业的应用。[\[44\]](#txt004.xhtml#footnote_content_txt004_44)


    除德国之外，英国也有所行动。2016年10月，英国发布《机器人技术和人工智能》报告，强调在消除数字鸿沟方面应鼓励公众积极参与。加强公众参与，可以让公众更好地与人工智能科技互动，更好地理解和处理人工智能带来的社会问题，如通过辅助智能机器人技术减少人力成本急剧升高的问题。通过鼓励公众参与，人们对于人工智能未来更加充满信心，更有利于促进以人工智能为基础的科技发展。


    英国专家们也都认为积极、负责的人工智能法规及其监管，不应局限于少数专家和利益相关者，也应多听取社会公众的意见。在人工智能政策制定过程中，应有更多的披露措施，这有利于公众了解人工智能发展带来的社会、道德和法律问题，也有利于英国建立公众对于政府的信任，同时促进先进技术更为广泛的应用。[\[45\]](#txt004.xhtml#footnote_content_txt004_45)


    ### 其次，跨越“技能鸿沟”，培养多元、跨学科人才


    随着人工智能受到世界各国和各科技企业的关注，欧洲对人工智能人才的需求在过去几年里也迅速增长，各大企业对经验丰富、技术娴熟特别是高学历的人工智能人才有着强烈的需求。


    2011年以来，信息和通信技术专家需求每年增长5％，并在短短五年内迅速将总就业份额从3％增加到3.7％。但是在欧洲，人工智能相关专业人员还至少有35万个职位空缺。[\[46\]](#txt004.xhtml#footnote_content_txt004_46)这表明还是存在“技能鸿沟”，高端人才严重供应不足。为此，欧盟大力促进人工智能人才多元化、跨学科培养（如鼓励人工智能领域双学位）（见表4-2）。


    **表4-2　欧盟主要成员国人工智能人才分布　单位：人**


    ![img](images/txt004_3.jpg)


    资料来源：清华大学中国科技政策研究中心.中国人工智能发展报告2018，2018.说明：2018年英国尚未脱欧，所以统计在列。


    根据Linked In搜集整理的全球人工智能各大会议的专家数据显示，英、德两国在人工智能人才培养和建设上有着不尽相同的境况。英国一直较为重视工业发展，这导致英国人工智能教授、人才等纷纷从学术界进入工业界。在英国，只有14％的人工智能人才出席过学术会议。


    德国则与英国相反。德国在学术界拥有大量的人工智能专家和教授，并且有近44％的人工智能人才曾出席过学术会议。[\[47\]](#txt004.xhtml#footnote_content_txt004_47)为此，德国一直寻求给工业界和学术界一个共同的成长空间，加快推进人工智能商业化，并建立新型技术中心。由此可见，德国人工智能人才培育更多来源于学术界推动，而英国更多来自行业驱动。


    除了英国和德国之外，其他国家也大力促进跨学科人才的培养。2018年2月，巴黎—萨克雷大学共同体成立“DATAIA研究所”，该研究所是一所跨学科数据研究所，通过将数据科学与人文社会科学相结合的跨学科方式，培养人工智能领域人才。同年3月，由法国国家科学研究中心、国家信息化与自动化研究所、巴黎文理研究大学共同体以及相关企业在巴黎联合成立了“PRAIRIE研究所”，集中法国人工智能研究学术界和企业界的力量，共同培养人工智能专业人才。[\[48\]](#txt004.xhtml#footnote_content_txt004_48)


    除此以外，高校之间、高校与科研机构之间的紧密合作，也是促进人工智能人才快速成长的重要途径。人工智能作为新兴产业，近几年发展迅猛。要想在竞争激烈的人工智能产业中占有一席之地，各个机构之间优势互补、群体作战不失为一种很好的方式。英国依托牛津大学、剑桥大学、帝国理工大学和伦敦大学学院等高校形成“伦敦—牛津—剑桥”联盟，相互之间交流合作，使得英国拥有更为密集的教育研究资源和深厚科研底蕴，加快培养大批优秀的人工智能人才。[\[49\]](#txt004.xhtml#footnote_content_txt004_49)


    ### 最后，弥补“学习鸿沟（learning gap）”，推出就业择业和学校教育计划


    欧盟各国都着重强调科技人才对于人工智能进步的重要性，力图通过在学校教育阶段加大人才培养。


    2018年，欧盟在学生就业择业和学校教育政策方面推出以下举措：一是推行专门的培训和再培训计划，为受自动化威胁的专业人员提供新技术培训项目；二是监测劳动力市场变化及欧盟范围内的技能缺口并提出建议；三是为学生和毕业生提供高级数字技能培训项目；四是鼓励校企合作，吸引更多人工智能人才；五是邀请社会合作伙伴在其联合工作计划中关注人工智能及其对就业和经济的影响，以及人工智能工作岗位多元化和性别平衡的重要性；六是把人工智能融入到学校课程。[\[50\]](#txt004.xhtml#footnote_content_txt004_50)


    英国在培育人才方面，出台相关奖励政策。政府在高等教育层面设立全额奖学金计划，满足机器人技术与自动化系统及相关领域对于科技人才的需求。德国“在高校设立AI专业，推出科学青年学者培养及教学计划，至少新增100名教授；将AI基础知识作为职业教育和培训教学内容；制定AI技术工人战略等”。[\[51\]](#txt004.xhtml#footnote_content_txt004_51)2018年9月，法国巴黎综合理工大学与谷歌联合开设“人工智能与高级视觉计算”教席，“设立该教席能充分发挥法国在数学和信息科学专业的教学科研优势，让法国青年一代能更好地适应未来数字化带来的变革”。法国Enedis电力公司为2018—2020学年硕士生提供3个奖学金名额，每位学生可获得3万欧元资助。[\[52\]](#txt004.xhtml#footnote_content_txt004_52)


    ## 健全伦理和法律框架，理顺人机关系


    科学技术从来都是中性的，可以造福人类，也可以危害人类。在人类发展史上，科技进步不止一次带来了伦理和法律难题。只有建立完善的人工智能伦理和法律规范，处理好机器和人类的新关系，才能更好地获得人工智能红利，让技术造福人类。


    ### 第一个方面：机器不能不讲道德


    当下科学界主流观点是机器不能不讲道德，否则，这个世界将无法想象。麻省理工学院情感计算研究组主任罗萨琳德·皮卡德教授曾说过：“机器越自由，就越需要道德准则。”[\[53\]](#txt004.xhtml#footnote_content_txt004_53)玛格丽特·博登也在著作中提到了“道德社区”的概念，并且表达出人类应该接受强人工智能成为道德社区成员的倾向。[\[54\]](#txt004.xhtml#footnote_content_txt004_54)


    人工智能是一把双刃剑，既可被用来服务于个人和社会利益，也可能被滥用。因此，欧盟正在积极建立适当的伦理框架，为发展和应用人工智能创造一个良好的道德环境，实现技术创新和人权保护的平衡。


    #### 一是建立人工智能伦理监管机构


    2015年1月，考虑到人工智能发展可能带来的新问题，欧洲议会法律事务委员会（JURI）专门成立负责机器人和人工智能的工作机构，研究与机器人和人工智能相关的伦理及监管问题。2016年5月，JURI发布《就机器人民事法律规则向欧盟委员会提出立法建议的报告草案》。同年10月发布《欧盟机器人民事法律规则》，就技术、伦理、监管等事宜提出专业条文知识，以便更好地抓住人工智能发展的新机遇，应对新挑战。


    英国民众表达了对于人工智能机器以何种方式进入、存储和使用保密的病人数据的关切，认为需要有效措施来保证人工智能系统使用的数据被合理地限制、管理和控制，以此来保护隐私权。为了应对这些问题，英国于2016年6月发布了《人工智能：未来决策制定的机遇与影响》的报告，全面分析了机器人技术和自动化系统带来的影响。英国正和阿兰·图灵研究所合作建立旨在研究数据科学的“数据伦理委员会”，以此来加强数据使用的审查。[\[55\]](#txt004.xhtml#footnote_content_txt004_55)


    #### 二是制定伦理守则


    欧盟及成员国积极为人工智能研发和审查人员制定伦理守则，确保在整个研发和审查环节考虑人类价值，使研发的机器人符合人类利益。


    英国先人一步。2016年4月，英国标准组织（BSI）发布《机器人和机器系统的伦理设计和应用指南》，迈出了“把伦理价值观嵌入机器人和人工智能领域”的第一步。这为识别潜在伦理危害、机器人设计和应用提供伦理导向，并完善了不同类型机器人的安全要求。《指南》还指出，对于机器人行为，应该找到背后负责人，应该由人类对事情负责，而不是机器人。《指南》还提到机器人歧视等社会问题的出现，提醒研发企业要增进机器人对文化多样性和多元化的尊重。[\[56\]](#txt004.xhtml#footnote_content_txt004_56)


    2018年4月，欧盟委员会成立了由52位来自学界、商界与民间团体代表组成的人工智能高级专家组（High-Level Expert Group on Artificial
    Intelligence，AI HLEG），邀请所有利益相关方，共同探讨人工智能伦理原则的起草和制定。同年12月，高级专家组发布《可信赖人工智能伦理指南草案》。


    2019年4月，欧盟委员会发布《人工智能伦理指南》，回应了人工智能相关影响、公平、安全、社会包容、算法透明等诸多问题，提出尊重人类自治、防止伤害、公平和责任的基本伦理原则，并进一步关注人工智能对基本权利（比如隐私、尊严、消费者保护、禁止歧视等）的影响。欧盟强调，将以这些基本权利为基础，寻求与欧洲基本价值观相一致的方式，合理利用人工智能，推进负责任、可信赖人工智能的发展。同时，欧盟委员会公布了“人工智能愿景”，坚定支持欧盟各国人工智能“符合伦理”式的成长。欧盟希望在人工智能进一步发展和全面融入社会以前，对其可能存在的风险未雨绸缪，使欧洲成为先进、符合伦理的人工智能的领导者。


    #### 三是重视隐私和数据保护


    数据成为“流通物”，各种服务就可以对其进行交易，更频繁的数据流动也就成为可能，这给数据所有权带来更多需要明确的新问题，其中就包括隐私和数据保护的问题。个人隐私与数据保护也因此成为国际社会长期以来重点关注的内容。在这方面，欧洲又迈出第一步。1973年，瑞典颁布第一部个人数据保护法《瑞典数据法》。颁布以来，全球范围内掀起了个人信息保护立法的浪潮。


    1995年，欧盟通过《关于个人数据处理保护与自由流动指令（95/46/EC）》（简称1995年个人数据保护指令），这是一部欧盟区域内个人信息保护的基础性立法。欧盟各成员国依据该指令，分别出台了本国的个人信息保护法。然而日新月异的信息技术使得该指令的主要原则及制度适用变得非常不确定，导致各成员国对个人数据保护指令的理解与执行出现了较大的分歧。


    2012年1月，欧盟委员会发布了《有关“1995年个人数据保护指令”的立法建议》（简称《通用数据保护条例》），对1995年个人数据保护指令进行全面修订。2015年12月，欧洲议会、理事会、委员会三方机构在立法进程的最后阶段就欧盟数据保护改革达成一致。2016年4月，欧盟三大立法机构通过《通用数据保护条例》的最终版本。


    在新通过的条例中，欧盟加强了个人隐私和数据保护，其中关于用户画像等自动化决策的规定，已经对基于大数据的互联网行业实践产生了重大影响。另外在通信和互联网领域，欧盟委员会于2017年1月起，开始制定更严格的电子通信隐私监管法案《隐私与电子通信条例》，完善了保护隐私、默认保护隐私、知情同意、加密等概念标准，进一步加强对电子通信数据的保护。[\[57\]](#txt004.xhtml#footnote_content_txt004_57)


    ### 第二个方面：机器人应有法律地位


    #### 一是关注自主机器人的法律地位


    是否应当由人类赋予机器人权利的问题，其实质在于是否承认机器人的主体地位。早在20世纪五六十年代，人工智能刚刚起步之时，就有哲学家提出：把机器人看作机器还是人造生命，主要取决于人们的决定而不是科学发现。


    1976年，阿西莫夫科幻小说《机器管家》就讲述了一个自我意识觉醒的智能机器人安德鲁想要成为人类的故事。为此，他开设机器人公司，研发新的技术，使自己在生命体征上和普通人一样，甚至最后通过手术让自己的生命只剩下一年（因为机器在可预期的将来是永生的），最终获得人类的生命。


    值得注意的是，这些电影情节已经进入到现实社会。2017年10月，机器人索菲亚被沙特阿拉伯王国授予了公民身份，成为有史以来首个获得公民身份的机器人。[\[58\]](#txt004.xhtml#footnote_content_txt004_58)这促使我们也不得不理性思考人工智能的“人权”问题：如果考虑赋予机器人以法律拟制人格，就要求其能够独立自主表达相应的意思，具备独立的权利和行为能力，可以对自己的行为承担相应的法律责任。

