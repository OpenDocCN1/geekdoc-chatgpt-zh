    # 影视艺术对人机关系的探索


    好莱坞科幻电影对人与人工智能的关系进行了有益的艺术探索，并形成了四种不同的观点和态度[\[14\]](#txt004.xhtml#footnote_content_txt004_14)。欧洲人士对于第四种设想“未来人机如何相处”，给出了答案。2015年，由英国亚力克斯·嘉兰编剧并导演的电影《机械姬》对人机之间的恋情进行了追问。天才程序员Caleb被请来对Nathan开发的机器人Ava进行图灵测试，但双方却心生爱慕，Caleb最终帮助Ava逃到外面世界，自己却被囚禁在实验室。同样，类似情感也出现在法国电影《她》中。男主公在与女朋友分手后一直未能走出感情阴影，情路一直不顺。但有一天，一个只听得见却触摸不到的人工智能女友叩开了他封闭已久的心扉。她拥有迷人的声线，温柔体贴而又幽默风趣。他们很快发现彼此是如此投缘，尽管不能感受彼此的温度、呼吸，但心灵的相通却带给他们久违的温暖。虽然电影结尾没能上演男、女主人公长相厮守的奇迹，但能够与人类交心的人工智能的创意还是引发了无数人的遐想和憧憬。


    之所以出现人与机器人相互爱慕、真假难辨的影视情节，是因为开始有人不再视机器人为一种工具或某种功能，人和机器人间的关系达到一种平等的状态；又由于人类与机器人间的沟通、理解甚至冲突，使人与机器人实现了共处共生，这也是人类追求的“善”的生活。以“善”为目标，人们在对待具有人类情感和心理活动的人工智能时会考虑机器的感受，将它们视为准人类，赋予他们尊严和价值，因为人类也希望别人（包括人工智能）能够这样对待自己。对待机器人的态度折射出的正是人类对待自己的态度。如果说人与自然关系的科幻电影带来的是对人类目前行为的伦理反思，那么人机关系的科幻影片传递的就是对未来人机平等共存的真切思考。


    而这种影视情节已经出现在现实生活，情感机器人的出现给人类带来了有温度且人性化的服务。目前，业界对其前景一片看好。英国科学界甚至预测，到2050年人类有可能和根据需求定制的情感机器人“结婚”。不过，玛格丽特·博登也提及了一些评论家肤浅的概念：“个人的爱慕接近情欲、性迷恋和单纯令人舒适的熟悉感。”


    # 增进福祉：保障社会及公民权利


    虽然人工智能是一项改变世界的尖端科技，但其开发者和部署者须受制于欧洲法律对于基本权利（如数据保护、隐私、非歧视）、消费者保护、产品安全和责任规则等方面的规定。无论一个产品或系统是否依赖人工智能，消费者都期待同水平的安全性和对他们权利的尊重。


    人工智能发展最主要关注的风险之一便是个人数据、隐私的泄露以及歧视。人工智能的使用可能会影响欧盟的基础价值观，并导致基本权利受到侵害[\[15\]](#txt004.xhtml#footnote_content_txt004_15)，包括言论自由、集会自由、人的尊严、围绕性别、种族或族裔的非歧视、宗教信仰自由，或围绕残疾、年龄、性取向的非歧视，以及消费者保护权等。


    正因如此，欧洲将技术和产业优势与高质量的数字基础设施和其基本价值观相结合，成为数据经济及其应用创新的全球领导者，力图为整个欧洲社会和民众带来好处，让公民获得新的利益，如改善医疗、减少家用机械故障、提供更安全更清洁的交通系统以及更好的公共服务。欧盟通过改进产品的可持续性和在政府部门中配备工具来确保公民安全，提供适当的保护措施，尊重他们的权利和自由。


    ## 巩固工业和法律优势，保护公民权利


    欧洲作为老牌工业强国的大本营，有着传统的工业优势，在人工智能发展中占据有利地位，不管是作为用户，还是作为这项技术的创造者和生产者，都能更好地从人工智能的潜力中受益。它拥有优秀的研究中心、新型的初创企业、机器人领域的全球领先地位，以及从汽车到医疗、保健、能源、金融服务和农业等世界顶级的制造业和服务业等。


    欧洲拥有强大的计算基础设施（如高性能计算机），这对人工智能运行至关重要。欧洲还拥有大量的公共和工业数据，这些数据潜力目前还未得到充分利用。在安全可靠、低功耗的数字系统方面，欧洲也拥有业界公认的优势，这对人工智能进一步发展同样至关重要。欧盟正在积极拓宽智能技术、基础设施以及数字运算能力方面的投资渠道，增强在数据经济关键技术和基础设施方面的技术主权。


    欧洲还发挥自身优势，从硬件制造业到软件，再到服务业，全面巩固并扩大自己在生态系统和价值链上的地位。欧洲生产超过四分之一的工业和服务机器人（如现代农业、安全、卫生、物流），它们在为公司或组织应用软件程序、支持电子政务中扮演着重要的角色[\[16\]](#txt004.xhtml#footnote_content_txt004_16)。此外，欧洲在制造业领域的人工智能布局也领先于世界，超过一半的顶级制造商在业务中至少创造了一个人工智能实例[\[17\]](#txt004.xhtml#footnote_content_txt004_17)。


    关于基本权利和消费者权利的保护，欧盟加紧立法脚步，出台了《种族平等指令》《就业和职业平等待遇指令》《关于就业和获得商品和服务方面男女平等待遇的指令》《通用数据保护条例》《数据保护执法指令》等多部法规，共同支撑起人工智能领域的法律框架。欧盟强调金融服务、移民或网络中介责任等领域的立法过程，必须尊重基本权利[\[18\]](#txt004.xhtml#footnote_content_txt004_18)。鉴于人工智能在欧盟关于平等就业要求上的重要性，欧盟还将进一步考虑可能影响劳动者权利的其他特定法律应用。


    除完善立法框架外，欧盟还特别注意远程生物识别功能[\[19\]](#txt004.xhtml#footnote_content_txt004_19)的使用和监督。应用远程生物识别技术，对人类有关信息和生物数据进行收集和使用（如在公共场合部署面部识别应用），会对欧洲民众基本权利带来特定风险。


    使用人工智能系统的远程生物识别功能对基本人权的影响可能因使用目的、环境和范围的不同而有很大差异。根据欧盟现行的有关数据保护规则和《欧盟基本权利宪章》，只有在正当的、符合比例的并受到充分保护的情况下，才可将人工智能系统用于远程生物识别。因此，除特殊情况外，欧盟《数据保护执法指令》原则上禁止为了识别特定自然人而进行的生物数据识别处理。具体来说，这种处理只能基于维护重大公共利益等特定情形而开展。由于任何以识别特定自然人为目的的生物特征数据处理，都将涉及欧盟法律所规定的禁令，所以该项技术将受到《欧盟基本权利宪章》的约束[\[20\]](#txt004.xhtml#footnote_content_txt004_20)。


    另外，为了解决公众对在公共场所使用人工智能这一社会问题的担忧，并避免内部市场分裂，欧盟委员会将展开一场全欧洲范围内的论辩，讨论可以依法使用人工智能的具体情况和相应的保障措施。


    ## 推动人工智能在中小企业和公共部门的应用，促进社会发展


    只有所有人都能获取技术并从中获益，欧盟才能真正实现人工智能的社会潜力。为此，欧盟极力避免人工智能扩大数字鸿沟，进一步推动建设数字创新中心和人工智能需求平台，增进与中小企业之间的合作，促使中小企业和潜在用户从人工智能中受益。欧盟委员会已经决定，将采取措施确保所有的潜在用户，特别是中小企业以及没有技术实力的公司和公共机构能够获取最新的技术并开展人工智能试验。为此，欧盟支持建设“人工智能按需平台”，使所有用户可以单点获取最新的人工智能资源。


    欧盟委员会还与成员国合作，确保每个成员国都会有高度专业化的人工智能数字创新中心。“数字欧洲”计划将为数字创新中心提供经费支持。欧盟委员会希望数字创新中心都能为本国中小企业提供支持，帮助它们理解和采用人工智能。


    中小企业和初创企业需要获得资金以更新其工作流程，或使用人工智能进行创新。欧盟委员会和欧洲投资基金已在2020年第一季度启动1亿欧元的试点计划，为中小企业人工智能的创新发展提供股权融资。在与MFF[\[21\]](#txt004.xhtml#footnote_content_txt004_21)达成最终协议的情形下，欧盟委员会预计从2021年起大幅扩大投资规模。


    除在中小企业加大投资和应用力度外，欧盟及有关成员国还计划在公共管理部门、医院、公用事业和运输服务部门、金融监管机构以及其他公共利益领域部署人工智能的产品和服务。现阶段重点是医疗卫生和运输领域，目前技术已经较为成熟。法国国营铁路公司通过使用智能交通系统，预防了大量事故的发生，并降低了大约30％的维修成本[\[22\]](#txt004.xhtml#footnote_content_txt004_22)。欧盟委员会优先发起了与医疗卫生、农村行政管理和公共服务运营商等部门公开透明的协作对话，旨在通过一项促进人工智能试验、应用和发展的行动计划。


    金融领域也加快了人工智能应用。2015年12月，欧洲三大金融监管机构——欧洲银行业管理局、欧洲证券及市场管理局、欧洲保险与职业年金管理局共同发布报告，针对银行、保险、证券业中涌现的智能投顾服务进行了分析[\[23\]](#txt004.xhtml#footnote_content_txt004_23)。在金融市场中发展较为成熟的智能投顾是一种在投资顾问业务中应用的自动化工具，由投资者提供个人信息，自动化工具结合客户信息并通过算法为客户提供金融产品和服务的交易建议。


    ## 重视技能培训和应用监督，提升个人能力


    欧洲高度重视人工智能技能培育，着力弥补能力短缺。欧盟委员会已经提出强化技能的议程方案，确保每个人都能从绿色和数字化转型的欧盟经济发展中受益。欧盟委员会还向有关部门机构提出倡议，希望他们提高人工智能领域的技能，以便有效地执行有关规则。欧盟已经出台并更新了《数字教育行动计划》，这将有助于更好地利用数据和基于人工智能的学习和预测分析技术，逐步改善教育和培训系统，使之逐步适应数字时代。该计划还致力于在各级教育中提高人们对人工智能的认识，以便公民做好准备来适应人工智能带来的影响[\[24\]](#txt004.xhtml#footnote_content_txt004_24)。


    欧盟还与各成员国一起制定了人工智能协同计划，并确定了优先实践事项：发展与人工智能相关的必要技能，并提高劳动力适应由人工智能主导的转型升级。欧盟正打算将道德准则的评估清单转变为人工智能开发者的指示性“履历”，进而成为培训机构的辅导资源。


    此外，欧洲的人工智能研究与创新中心正吸引世界各地的人才，并对外持续传播欧洲不断发展的卓越技能。欧盟计划为“数字欧洲”计划中的一流高校和教育机构提供先进的核心技术，以此来吸引最优秀的教授和科学家，并提供人工智能领域世界领先的硕士学位课程。


    欧盟在注重个人技能提升的同时，也注重运用人为监督方式来深化合规和伦理意识的养成。一个值得信赖、符合道德伦理、以人为中心的人工智能，其客观性只能通过确保相关人员对于高风险人工智能应用的适当参与来实现。人为监督可以确保人工智能系统不会削弱人类自主权或造成其他有害的影响。


    即使在特定法律制度框架下，适当的人工监督类型和程度仍然可能因情况而异。这种变化主要基于系统特定的用途和对相关民众及法律实体的使用而产生的效果与影响。在人工智能系统处理个人数据时，企业、部门、个人都应当尊重《通用数据保护条例》规定的各项合法权利[\[25\]](#txt004.xhtml#footnote_content_txt004_25)。


    # 价值维系：技术、人才、法律与伦理“三轮驱动”模式


    正如蒸汽机和电力一样，人工智能正在重塑我们的世界，特别是社会和工业领域。算力的提高、数据的积累以及算法的进步使人工智能成为了本世纪最具战略性的技术之一。人工智能的发展也必将彻底改变这个世界。为此，欧盟极力构建一个坚实的人工智能战略框架，确保其在人工智能领域具有全球竞争力，确保发展和应用人工智能可以增进社会福祉，赋能所有人。


    欧盟委员会提出的人工智能战略框架包括三大支柱：一是提升人工智能在经济领域的技术和产业能力，并推动人工智能向全社会推广普及；二是迎接社会变革，教育和培训体系跟上时代发展，关注劳动力市场的新变化，培育新型人才；三是研究人工智能带来的新挑战和新问题，促进利益相关方交流合作，制定与人工智能发展和应用相适应的伦理和法律框架[\[26\]](#txt004.xhtml#footnote_content_txt004_26)。


    ## 拥抱技术革新，提升产业能力


    人工智能具有足够大的技术辐射效应，能够为全球经济和社会发展提供新的强劲引擎。其一方面广泛应用于互联网、金融、教育、医疗等方面，使我们的生活更加便捷和高效；另一方面有效诊疗重大疾病、减少交通事故伤亡、减少饥饿和贫困、应对网络安全攻击等方面，有助于解决人类社会面临的重大挑战。


    为确保在人工智能领域具有全球竞争力，确保所有民众都能跟上这场数字化变革，欧盟提出必须提高技术和产业能力，使得人工智能能够广泛渗透到各行各业。为此，欧盟从以下几个方面加紧部署：


    ### 第一，把握未来数据浪潮的机遇


    相对美、中两国，欧洲目前在消费者应用程序及在线平台方面处于弱势，进而导致数据获取方面处于劣势。但从世界范围来看，每天产生的数据量正在迅速增长。据国际数据公司预测，全球数据量将从2018年33ZB增加到2025年175ZB[\[27\]](#txt004.xhtml#footnote_content_txt004_27)。因此，每一波新的数据浪潮，也为欧洲在全球经济中重新定位并成为世界领先者带来机遇。


    加强数据记录和保存。考虑到人工智能系统复杂性、不透明性以及难以有效核实遵守和执行适用规则的困难情况，欧盟正在制定数据记录和保存的相关要求：保存与算法设计有关的记录，保存训练高风险人工智能系统的数据，在某些情况下“保存数据本身”，建立、测试和验证人工智能系统的程序和技术文档等。这些要求使得人工智能系统那些潜在的问题或决策可以被追溯和验证。这不仅有助于人工智能程序的执行和监督，也会促使经营者在遵守这些规则的同时考虑到规则的用意。


    这些记录、文档和相关的数据需要在有限的时间内留存，从而确保相关立法的有效执行。欧盟有关部门已经采取措施，确保被测试者在测试或检查时能够根据要求提供相应材料，并在必要时保护好机密信息。


    强化数据访问与管理。没有数据，就不可能开发人工智能和其他数字应用。因此，数据访问和管理是重中之重。尚未生成的海量新数据，使欧洲获得了位居数据和人工智能转型前沿的机会。负责任的数据管理和数据运用，有助于建立信任和确保数据的可再利用性。在《欧洲数据战略》支持下，欧盟委员会已提议在“数字欧洲”计划下拨付超40亿欧元资金支持高性能和量子计算，包括边缘计算和人工智能、大数据和云基础设施。这些在关键计算技术和基础设施的投资，是欧洲强化数据访问和管理的有效措施，也是加强和捍卫欧盟价值观和规则的重要途径。


    在数据访问和管理阶段，欧洲始终强调价值观的输入。因此，欧盟已经萌发训练人工智能系统数据的构想，保证人工智能系统支持的产品或服务符合各项安全要求。同时，保证用于训练人工智能系统的数据能够符合欧盟价值观和保护基本权利的现行立法规则[\[28\]](#txt004.xhtml#footnote_content_txt004_28)。


    加强数据开放共享。数据是机器学习的关键。为此，需要促进数据的开放和共享。2005—2020年，欧盟已经推出多项举措促进公共部门数据和公共资金资助的研究成果对外开放和再利用。如今为了最大程度地促进数据流转和分享，欧盟委员会已经推出以下举措：修订公共部门信息开放指令，出台私营部门数据分享指南，修订科研信息的获取和保存建议，出台医疗健康数字化转型政策（包括分享基因数据及其他医疗数据）。


    深化数据处理技术。由于几百年卓越的自然科学积淀，欧洲在人工智能算法领域一直处于领先地位。量子计算的最新进展将使得计算机的数据处理能力呈指数增长趋势。数据处理技术在量子计算方面拥有突出的学术优势，加之工业在量子模拟器和量子计算编程环境中的强大作用，欧洲已经站在这项技术的前沿，并已计划将量子测试和实验设施的方案应用于一些工业和学术部门。


    接下来，欧洲将在目前独立的学科（如机器学习、深度学习、符号学习等）之间建立桥梁，运用大量数据及相关性学习来训练模型，实现符号推理与深度神经网络相结合，提高人工智能结果的可解释性。


    ### 第二，加大人工智能研发力度


    打造世界级欧洲人工智能研究中心。当前，欧盟及各成员国正在大力建设人工智能研究中心，并激励相关研究机构沟通合作、共同发展、共享成果，把欧洲打造成全球人工智能研究和创新的前沿阵地。2018年1月，法国政府与三星集团加大合作力度，宣布未来将扩大三星在巴黎人工智能领域的研发团队规模，将巴黎研发中心打造成为三星继韩国、美国之后的第三大人工智能研发中心[\[29\]](#txt004.xhtml#footnote_content_txt004_29)。


    支持人工智能产品测试和实验。对人工智能产品进行测试和实验，是其进入市场前的必备环节，这意味着必须要使产品符合安全标准和规则。经过测试和实验，政府决策者可以对新技术形成更好的认知，便于制定更为合适的法律框架。为此，欧盟委员会已经在医疗健康、交通运输等领域建成第一批测试和实验基础设施，并向所有企业开放[\[30\]](#txt004.xhtml#footnote_content_txt004_30)。


    加速技术成果市场转化。在低功耗电子产品的处理器技术方面，欧洲一直处于全球领先地位。虽然这一市场目前由非欧盟参与者主导，但在欧洲处理器项目等计划的帮助下，这种情况正在改变。为推动成果的市场转化，欧盟大力支持技术突破、创新和转化，已经为2018—2020年期间的试点项目划拨了27亿欧元预算，支持1
    000个具有潜在突破性意义的项目以及3000个关乎项目可行性的科研奖项[\[31\]](#txt004.xhtml#footnote_content_txt004_31)。


    相关成员国也在自动驾驶领域做出努力。德国政府在2015年就已允许在连接慕尼黑和柏林的A9高速公路上实施自动驾驶汽车测试项目，2016年4月批准了交通部起草的法案，将“驾驶员”的定义扩大到能够完全控制车辆的自动系统。2017年5月，德国联邦参议院投票通过首部自动驾驶法律，允许自动驾驶汽车在特定条件下代替人类驾驶。同年9月，德国西门子宣布收购荷兰自动驾驶软件公司新网国际，以加强其无人驾驶汽车业务发展和成果转化。在服务机器人领域，德国的成果转化也处于前列[\[32\]](#txt004.xhtml#footnote_content_txt004_32)。2017年，英国发布《在英国发展人工智能》，将无人驾驶汽车放在了人工智能领域发展的突出位置，希望充分利用英国国内大学及企业的相关人员在人工智能和机器学习领域的优势，进一步提升无人驾驶技术[\[33\]](#txt004.xhtml#footnote_content_txt004_33)。

