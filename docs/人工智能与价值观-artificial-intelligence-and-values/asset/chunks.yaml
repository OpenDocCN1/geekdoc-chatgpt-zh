- raw: '第四次工业革命所需的智能化环境需要更多可以共享的社会资源。或者说人工智能在未来需要依赖共享模式的存在。因为高度智能化的社会想要降低社会成本就需要提高现有社会资源的使用效率，共享与智能化生活相辅而生。智能化也包括了很多共享的元素。一方面是产品共享，包括了共享汽车这类生活用品，另外一方面是则是大数据分析中的社会数据共享。


    其中一个典型的案例是日本共享经济产业的发展。在前一段时间，整个共享经济风靡全球，之后却又戛然而止，日本的共享经济却凭借其优质的服务和高素质的用户群延续了下来，“租赁”是共享的核心，从日本房屋租赁到服装物品租赁再到技能租赁，已经形成了较为完整的共享模式，这也使得日本在共享经济的某些方面有了一些独特的成就。从客观上讲，因为日本岛国特殊的地理环境，共享资源能够有效地提升资源的使用效率，日本的共享经济可能会有非常大的社会需求，但现实中却并非如此。这就是因为日本社会隐私文化对日本的影响，带着一种文化上的抵触。


    首先是共享经济必须面对的老龄化社会所带来的问题。智能化是一种新兴事物，需要社会对创新有着极大的接受度，但这却一直是处于文化内旋的日本社会所欠缺的。以智能化手机为例，在全球智能终端如此普及的情况下，日本依然有很大一批人在使用着功能机。导致这个现象的原因是多方面的，但不可否认造成这种现象的很大一个原因就是日本已经严重老龄化的人口结构，老龄化的社会对接收新生事物有着一定的学习成本，这就阻碍了一些新技术在日本的发展和普及。之前也有很多媒体的调查，日本智能手机在中老年年龄层中的应用并不广泛，非智能手机在日本还有非常大的市场。其中很大一部分原因就是因为智能手机学习成本高，而且不符合日本人不给别人添麻烦的习惯。同时老人对生活要求并不像年轻人一样追求新奇，传统保守的生活状态也使得他们更倾向于拒绝变化。


    另外一方面就是日本对隐私信息的高度重视。共享产业的发展离不开大数据的支撑，这就需要企业获取消费者的部分信息，这对于高度重视个人隐私生活的日本人来说是一道难关。曾经有报道称日本人很大一方面拒绝智能手机，就是因为智能手机会暴露很多个人隐私，所以遭受到相当一部分人的抵制。隐私信息的保护，不仅仅局限于共享经济，同时也适用于新技术革命中的一系列技术，人工智能、物联网都涉及个人信息，这种应用对于日本人来说可能是一个非常巨大的问题。数据保护和标准化管理是日本人工智能政策制定的重要方面，很大一部分也是源于这方面的考虑。


    机器人作为人工智能研究的一个重要方面，在日本发展得特别好。首先日本因起步较早，积累了一定的机器人产业人才，而且因为机器人非常符合日本人的生活习惯和文化模式，所以机器人产业占国家经济增长的比重远远超过其他国家，日本目前拥有着世界上数量最大的机器人用户、机器人设备及服务生产商。从日本发布的国家层面的人工智能战略、产业化路线图中也可以看出，日本也试图结合机械制造及机器人技术方面的强大优势，推动超智能社会5.0建设，立足自身优势，确立人工智能、物联网、大数据三大领域联动，机器人、汽车、医疗等三大智能化产品引导，突出硬件带软件，以逐步改善人口老龄化所带来的劳动力短缺、养老等社会问题。


    结合上面几个特点来看，日本价值观念受到最大的冲击依然是日本社会对信息隐私保护方面的顾虑。这种顾虑一方面是由于老龄化社会对于新生事物的不确定感，也是新技术带来的风险。换个角度来看，老龄化的问题和隐私保护的问题同样是需要用新技术来解决和维护的，保持原来的状态是无益于问题的解决。技术发展可以很大程度上缓解日本现存的社会问题，但这种价值评价标准的变化受到的阻力会比智能手机所产生的影响更大。日本社会高度重视隐私保护，乃至很多日本民众依然拒绝互联网产品，导致很多依赖于大数据分析的行业在日本缺少了最基础的数据和硬件支持。传统观念与新技术发展的冲突在日本显得尤其突出，也成为未来日本文化价值观念的突破点之一。


    ## 文化锚点：传统与创新之间的羁绊


    日本二战之后，经过十年的恢复，从1955年开始经济由战后复兴期进入高速成长期。日本在50年代至60年代末约20年的高速成长期中，保持了年均10％以上的经济快速发展。从1978年到2009年之间GDP总量一直保持着世界第二大经济体的地位。日本作为一个东亚文化圈重要部分，因为其不同的地理环境和历史发展，也形成了自己独特的价值文化追求。这种文化模式非常注重集团观念，其中就包括了集团主义、人本主义、平等主义、竞争原则及和谐原则等几个重要部分。在面对第四次工业革命冲击之时，早已深入人心的文化对未来新技术的发展也会有一些特殊的影响。


    ### 公平：集团主义下的平等文化


    日本一般被认为是集团主义社会，是因为一般的日本人，对自己所属的集团与组织，具有强烈的忠诚心，团体的成员互相扶持，与集团形成一体感，视集团的利害为自身的利害，并且伴随集团主义的是团体等级制。集体观念是日本文化内聚性的一个体现。内聚性使得集体主义盛行，同时集体内部的秩序感需要，使得集体内容形成了一种特殊的平等主义文化。


    平等文化是日本社会特有的一种现象，并且平等主义追求的是结果平等而不是机会均等，完全区别于西方社会的观念。这种文化也就催生出了日本企业特有的终身雇佣制。平等文化的好处是使得日本有着非常良好的守秩序的习惯，人们在何时何地都会非常注重这种秩序感。最显著的行为就是日本的排队现象，在任何地方任何时间，日本社会都会非常有秩序地排队解决问题。这种文化甚至深入到了企业内部，团体会认可每一位集体内部成员，企业薪资的评定不以员工的能力为衡量标准，而是以年限和资历来衡量员工的价值，在这种薪资制度之下，所有人的未来收益都是平等的。


    长期以来日本人的生活和工作都处于这种文化氛围之中，并且在过去几十年内也实现了经济的快速发展和生活水平的高质量提升。相对来说非常保守和稳定的工作状态，对于日本企业在工艺和技术革新方面就是极大的助力，这也使日本能够产生出一种“工匠文化”。工匠文化突显出的是对于自己岗位的职业操守和负责态度。企业员工不需要担心自己在企业中的发展，专注于岗位本身的工艺提升。日本采取的终身雇佣制也与专注于技术的职业价值观念相辅相成。所以说，平等主义是贯穿于日本整个社会和企业的一种特别文化。这种文化对于第四次工业革命的影响也将是极其深远的。


    首先从积极方面看，人工智能的发展能够最大程度地减少人类的重复性体力劳动和资源使用的不平衡。从国家发展和社会需要的角度上看，人工智能在日本有着广阔的应用前景。


    一方面是减少对人工劳动力的需要。因为日本已经是一个老龄化国家，劳动人口已经无法有效满足日本社会的需要。这个其实从日本机器人行业的发展已经可以看出，日本机器人的先进性也在于有效减少对人工劳动力的需要。这种自动化的机器或者智能机器人的出现，已经有效地减少了工作岗位之间的不平等，人们不用再纠结于工作环境的恶劣和工作内容的简单重复，人可以更加匹配到需要主观能动性的岗位上。另外一方面就是资源的管理上。日本是一个岛国，资源和能源相对比较匮乏，智能化能够有效提升资源使用效率，有效地提升城市的智能化管理程度。对于一个资源匮乏的城市，资源的使用效率可以得到更加有效的提升，日本本身的智慧城市建设也是属于世界领先地位的，在日本，丰田、松下、日立、东芝、三井不动产等民营企业都对智慧城市概念很感兴趣，同时也都着手智慧城市的创建和探索。例如松下电器在藤泽市打造可持续智慧城市、丰田汽车在丰田市创建智能低碳示范小区，以及三井不动产打造的柏之叶智慧城市等等。这也可以看出，日本社会已经充分认识到第四次工业革命对日本的积极作用。


    从消极的一方面来看，平等主义对人工智能的发展有消极的影响。这种影响主要在于人工智能对于传统社会结构的冲击，这种冲击会破坏现有的一些企业结构。首先平等主义会阻碍因人工智能的应用产生人员淘汰。日本企业的终身雇佣制在世界上是独一无二的。人工智能的应用必然有大量的传统岗位被淘汰，人员离岗离职是无可避免，但这在终身雇佣制的企业却是不可接受的。替换产生出的社会成本必须由企业和个人来承担，而文化中对平等主义的破坏却很难修复，或者说很难接受的。另外就是企业内部的职级评定也会遇到极大的问题，主要表现在人与人之间的能力衡量无法再依靠传统资历来衡量。资历的因素被极大地弱化，对于新技术的掌握成为衡量岗位能力的重要标准。由于人工智能的应用，对于智能设备及机器编程方式的技术大大超过以前，而在具体工艺操作上的技术要求和经验要求在部分岗位上会大大降低。由此传统集团内部的价值标准被动摇，动摇的范围和强度会一直持续到人工智能的全面应用之后，可能会持续一至两代人的时间。


    另一方面，在于平等主义对于人工智能带来的不平等的抗拒。一些新的机会和危机都会动摇原来的社会结构。在历史过程中，往往伴随着各类贸易冲突、甚至是战争的风险。而对于特别注重秩序感和平等主义的日本社会来说，这种冲击也是很难得到社会的认同。所以说对于普通民众来讲，就极大地增加了他们接受的难度，但这种变化无疑是大趋势，而且这种抗拒也只是不被历史所描述的一个过渡期，抗拒心也很容易导致日本错失第四次工业革命的发展良机，这时借用李兆忠在《暧昧的日本人》中所提到的：“日本人好比一群小鱼，它们有秩序地沿着一个方向游着。一块石头投入水中，打乱了队形，使他们突然掉头，朝相反的方向游去，然而队伍依然是井然有序的。”秩序性的破坏终将恢复，这是日本的文化模式所决定的，但这种平衡的破坏必然影响日本传统价值观念。


    目前，日本已经开始重新培养新型人才，开始尝试摆脱过去传统劳动年限评价的旧机制，可以说日本社会目前也在尝试做各类积极的探索，试图摆脱过去文化中的一些制约因素。比如说，如何重新用公平来定义平等主义成为日本在人工智能发展中的重要命题。


    ### 忠诚：社会主体的角色定位


    二战后的日本，百废待兴。在当时的历史条件下，日本最亟待积极发展以先进技术为基础的重化工业，从而实现“追赶型现代化”。这就需要投入庞大的经济资源，也需要承担巨大的经济风险，就企业的个体体量而言是不能胜任的，如果按照市场经济的自发调节规律，这些政策是不可能的实现的。日本政府在这种形势下，采取各种各样的扶持手段，最终形成了极具日本特色的强政府干预下产业政策。凭借在资本主义市场经济条件下实施“极其彻底”的政府干预，实现了高速追赶欧美的历史目标。特别是20世纪50年代到70年代初，日本的实际国民生产总值以年均10％左右的速度递增，劳动力的再生产远远赶不上物质再生产迅速扩大的需要。劳动力不足、人才紧缺成为当时日本企业面临的最大问题。在这种背景下，企业为了稳定熟练工人队伍，防止工人“跳槽”，普遍实行了“年功序列工资制”。在这个背景下，日本松下公司松下幸之助提出了企业的终身雇佣制，并迅速在日本社会得以推广。这也成为战后日本经济的复兴和高速发展的一大助力。终身雇佣制、年功序列工资制和企业工会，构成了日本现代企业经营管理不可缺少的三个有力支柱。然而如果透过这种制度的外表，埋在其深层的却是集团主义的经营思想。这种集体主义的管理方式在日常化的企业管理中，极大增加企业人员的稳定性，同时也能促使企业员工更加注重工艺和技术经验的积累。


    日本的终身雇佣制可以说是日本忠诚文化的一个体现。因为国家制度的推动，社会也形成了特有的保险制度和道德制度来与终身雇佣制相匹配。忠诚文化也是在日本多种文化因素与特殊企业制度的相结合后一种必然职业价值。随着人工智能的广泛应用，日本现在有企业制度和忠诚文化也会受到一定的影响。这种影响主要表现在以下几个方面：


    首先是传统行业的转型与衰落。首先在市场经济条件之下，经济发展是有周期性的，这种周期性表现在行业收益和发展的波动，对于有长期稳定需求的企业来说，这种波动的影响是企业完全可以接受的。但是由于新科技革命的干预，一些传统行业面临的不再是波动，而是转化成为了没有发展前途的夕阳产业，终身雇佣制在这方面就将遇到极大的社会成本。显而易见，每一次工业革命都会带来巨大的产业变化，比如第三次工业革命中崛起的各类互联网科技公司，在第四次工业革命中，机器人和人工智能的结合，很多技术蓝领也将大面临技术更新。在经济利益与传统终身雇佣制之间，必然会对企业、职工对忠诚文化产生更多更深刻的思考。


    其次是新技术对新型人才的需要。在新的产业革命之中，新型人才是决定产业革命发展的一个重要决定因素。在终身雇佣制中，大学生从学校毕业就走向了从事一生的职业，这种情境之下，新型人才的招募对公司，和对优秀人才的发展都是非常不利的。并且日本在第三次产业革命之中，并没有像其他国家那样，利用自己的经济优势发展出一大批优秀的互联网科技公司，导致整个日本社会缺少了创新人才流动的制度基础。


    最后就是日本企业对于自身业务的专注与忠诚。日本的创新主体是企业，日本企业几乎都是民营企业，民营企业的特点是业绩与发展状况与政府没有直接关系，并且日本民营企业担负起了国家发展的历史使命。企业的发展战略需要企业自己来确定自己的方向，根据自身生存和发展的需要来决定技术创新的攻关方向。政府主要是政策扶持与引导，在过去的几十年里日本通过特定的产业政策，促进了制造业发展。这种情景下，日本企业如何应对人工智能发展带来的变化，其很大程度上取决于企业管理者的决策和思路。所以目前在日本人工智能产业发展中，尽管有不少的日本企业积极参与，但这些企业更多是以独立主体参与，并且以商业化应用为优先。在整体产业协调方面则是相对较弱，企业在坚守传统优势过程上实现转型发展也是日本发展的一种重要破局点。


    日本的终身雇佣制在当时快速发展的时期，充分保障了企业的平稳发展。但在面临新技术冲击时，这种传统模式形成的阻力也最为恐怖。这种阻力最明显的就是体现在人才引进和培养上。从日本现在体制来看，终身雇佣制对于特殊时期的人才引进是有阻力的。正如日本媒体所报道的，他们认为在全球人工智能竞争日趋激烈的情况下，日本在人工智能研究方面远远落后于中美两国。《日本经济新闻》称全球掀起人工智能人才争夺战，日本落后中美，争夺21世纪技术主导权的中美两国正在激烈争夺人工智能人才，日本劣势明显。能够提供充足预算和充满吸引力的研究内容的日本企业为数不多。日本有必要举全国之力培养人工智能人才。道孚县《日本经济新闻》称，调查显示全球存在70万人工智能人才缺口，中美两国正在对人工智能人才展开激烈争夺。美国谷歌于2018年春在北京成立了“谷歌人工智能中国中心”，在中国本地招募人工智能人才，中国企业也积极面向美国招徕人才。而且日本的人才培养政策才开始逐步推动，这也是日本未来人工智能遇到的最大不确定因素。


    所以从忠诚这个价值角度来看，日本是充分利用了现有的工业经济基础，但是现有机制对于新技术革命的创新来说确实是利弊共存的。相对于美国这种传统的科技创新强国和中国这种快速发展的国家来说，日本传统社会经济发展模式对新变革必然形成无法回避的阻力。这种阻力一方面来自传统优势行业发展的行为惯性，另外一方面也来自整个日本社会快速发展过程中形成的价值观念。而对创新人才培养是否可以打破原有的人才评价机制将是新的突破点。在中国和美国现有的人才管理体制下，一方面是通过国家的宏观教育政策培养相关领域的优秀人才，第二方面是在人才激励机制上，可以完全自由突破，大力引进全球范围内的优秀人才，在这一点上，完全突破了日本这种集体的企业管理模式的人才管理自由度。而且这一问题在日本一系列的人工智能政策规划和推动工作中也可以发现。日本传统的创新模式在新技术革命中遇到了问题，这也是日本政府积极干预人工智能研发的重要原因。


    日本非常强调集体主义观念，集体内部有着高度的内聚性。企业为了减少集体内部的损耗，采取了以结果平等的薪酬评价体制，这种方式解决企业人才流动造成的损失，也产生了我们熟知的“工匠文化”。但在新技术不断更新的时期，日本这种公平的管理理念将会受到挑战，重新调整管理的价值观来适应新技术的创新需要，是日本人才政策的一种重要挑战。因为日本终身雇佣制的制度，员工的忠诚文化与之相伴而生，相互依存。传统的终身雇佣制如果被打破，企业员工的忠诚文化也将遭到破坏，这对于劳动力资源已经短缺的日本来说是雪上加霜。解决价值观念的冲突已经是日本在第四次工业革命中所要面临的一个重大挑战。


    ## 本章小结


    日本有着自己独特的文化模式。这决定了日本是一个既注重自身传统，又注重实效的国家，这深深影响了第四次工业革命中日本的发展。首先日本文化的封闭性决定了第四次工业革命只是作为一种手段来帮助日本实现经济发展。其中就隐含了外来文化与本土文化必然产生冲突，而这种冲突因为日本民族隐忍的性格而愈加复杂。其次是日本的创新路径依赖也会导致创新价值观念上的冲突。日本过去的成功经验和产业优势使得日本企业有着自己的创新思路，企业创新方式能否适应第四次工业革命的快速发展是成功的关键。但是日本社会有一些相对特殊价值标准，比如日本对于隐私的保护会影响日本企业发展，使得日本企业在新技术推广的社会环境区别于其他国家。日本传统的价值观念与新技术革命有很多冲突点。首先是集团主义对秩序的强调决定了新技术的创新在日本企业需要自上而下进行推动，这需要日本企业对现有的激励方式进行调整。其次，日本形成了与现有企业制度相匹配的忠诚文化，使得日本改变现在管理方式的阻力重重。从这两点来看，日本的企业制度与社会保障已经完全融合，任何一种改变的成本都极高，并且会面临传统价值观念（比如忠诚文化）的冲突。日本社会已经严重老龄化，很多价值观念问题无法通过发展来解决，这也是日本遇到的最大难题。但日本同样有很多自己的优势，日本作为世界上最先开始智能机器人研究与应用的国家，目前属于领先于世界其他国家，同时日本国内面临大量的劳动力缺失，也增加了整个社会对以人工智能为代表的新技术的需求，这也是日本社会引入人工智能的最好契机。


    随着人工智能的广泛应用，新的价值观念将与日本文化和价值观念的不断碰撞。从整个世界大势来看，无论接受与否，以人工智能为代表的新技术革命终将会融入每一个国家的生产生活中。日本整个社会的价值观念将再一次面临变革，衍生出新时代的新文化和新价值观念。


