    # Japanese Culture and the Fourth Industrial Revolution: Challenges, Opportunities,
    and Value Conflicts


    ## Introduction: The Realistic Dilemma of Intelligent Environments and the Sharing
    Economy


    The intelligent environment required by the Fourth Industrial Revolution needs
    more shareable social resources. Or rather, artificial intelligence in the future
    will need to rely on the existence of sharing models. Because a highly intelligent
    society needs to improve the utilization efficiency of existing social resources
    to reduce social costs; sharing and intelligent life are interdependent. Intelligence
    also includes many elements of sharing. On the one hand, there is product sharing,
    including daily necessities like shared cars; on the other hand, there is social
    data sharing in big data analysis.


    A typical case is the development of Japan''s sharing economy industry. Previously,
    the sharing economy swept the globe, but then came to an abrupt halt. However,
    Japan''s sharing economy persisted thanks to its high-quality services and high-quality
    user base. "Renting" is the core of sharing. From house rentals to clothing and
    item rentals, to skill rentals, a relatively complete sharing model has been formed,
    giving Japan unique achievements in certain aspects of the sharing economy. Objectively
    speaking, due to Japan''s unique geographical environment as an island nation,
    sharing resources can effectively improve resource utilization efficiency, and
    there might be huge social demand for the sharing economy in Japan. Yet, reality
    is not so. This is due to the influence of Japan''s privacy culture, which brings
    a cultural resistance.


    The first issue is the problem of an aging society that the sharing economy must
    face. Intelligence is an emerging phenomenon requiring society to have a high
    acceptance of innovation, but this has always been lacking in Japanese society,
    which is culturally introverted. Take smartphones as an example: despite the global
    popularity of smart terminals, a large portion of the Japanese population still
    uses feature phones (flip phones). The reasons are multifaceted, but an undeniable
    major cause is Japan''s severely aging population structure. An aging society
    faces certain learning costs in accepting new things, which hinders the development
    and popularization of some new technologies in Japan. Previous media surveys have
    shown that smartphone adoption among the middle-aged and elderly in Japan is not
    widespread, and feature phones still hold a very large market. A large part of
    the reason is the high learning cost of smartphones and the fact that they do
    not align with the Japanese habit of not wanting to cause trouble (meiwaku) for
    others. Simultaneously, the elderly do not pursue novelty like the young; their
    traditional and conservative lifestyle makes them more inclined to reject change.


    Another aspect is the high importance Japan places on privacy information. The
    development of the sharing industry is inseparable from the support of big data,
    which requires companies to obtain some consumer information. This is a hurdle
    for Japanese people who highly value their private lives. There have been reports
    that a major reason Japanese people reject smartphones is because smartphones
    expose a lot of personal privacy, leading to resistance from a considerable portion
    of the population. Privacy protection is not limited to the sharing economy; it
    also applies to a series of technologies in the new technological revolution.
    Artificial intelligence and the Internet of Things all involve personal information,
    and such applications may be a huge issue for Japanese people. Data protection
    and standardized management are important aspects of Japan''s AI policy formulation,
    largely stemming from this consideration.


    Robotics, as an important aspect of AI research, has developed particularly well
    in Japan. Firstly, Japan started early and accumulated a certain pool of robotics
    industry talent. Moreover, because robots align very well with Japanese lifestyles
    and cultural patterns, the robotics industry accounts for a proportion of national
    economic growth far exceeding other countries. Japan currently possesses the world''s
    largest number of robot users, robot equipment, and service producers. From Japan''s
    national-level AI strategy and industrialization roadmap, it can be seen that
    Japan is attempting to combine its powerful advantages in mechanical manufacturing
    and robotics technology to promote the construction of "Society 5.0." Standing
    on its own strengths, it has established the linkage of three major fields—AI,
    IoT, and Big Data—and the guidance of three major intelligent products—robots,
    automobiles, and healthcare—highlighting "hardware driving software" to gradually
    improve social problems such as labor shortages and elderly care brought about
    by population aging.


    Combining the above characteristics, the biggest shock to Japanese values remains
    the Japanese society''s concerns about information privacy protection. This concern
    stems partly from the aging society''s sense of uncertainty toward new things
    and the risks brought by new technologies. From another angle, both the aging
    problem and the privacy protection problem need to be solved and maintained by
    new technologies; maintaining the status quo is not conducive to solving problems.
    Technological development can largely alleviate Japan''s existing social problems,
    but the resistance to changing this value evaluation standard will be greater
    than the impact produced by smartphones. Japanese society attaches great importance
    to privacy protection, to the extent that many Japanese citizens still reject
    internet products, causing many industries reliant on big data analysis to lack
    the most basic data and hardware support in Japan. The conflict between traditional
    concepts and new technological development is particularly prominent in Japan
    and has become one of the breakthrough points for future Japanese cultural values.


    ## Cultural Anchors: The Tether Between Tradition and Innovation


    After World War II, Japan underwent a decade of recovery, and from 1955, its economy
    entered a period of high-speed growth from the post-war reconstruction period.
    During the approximately 20 years of high-speed growth from the 1950s to the late
    1960s, Japan maintained rapid economic development with an annual average growth
    rate of over 10%. From 1978 to 2009, its total GDP maintained the position of
    the world''s second-largest economy. As an important part of the East Asian cultural
    sphere, Japan formed its own unique cultural values due to its different geographical
    environment and historical development. This cultural model places great emphasis
    on group concepts, including key aspects such as collectivism, humanism, egalitarianism,
    the principle of competition, and the principle of harmony. When facing the impact
    of the Fourth Industrial Revolution, these deep-rooted cultures will have some
    special influences on the development of future new technologies.


    ### Fairness: Egalitarian Culture Under Collectivism


    Japan is generally considered a collectivist society because ordinary Japanese
    people have a strong sense of loyalty to the groups and organizations they belong
    to. Group members support each other, form a sense of unity with the group, regard
    the group''s interests as their own, and this is accompanied by a group hierarchy.
    The collective concept is a manifestation of the cohesion of Japanese culture.
    Cohesion makes collectivism prevail, and the need for a sense of order within
    the collective has formed a special egalitarian culture within the group.


    Egalitarian culture is a phenomenon unique to Japanese society, and the egalitarianism
    pursued is equality of *results* rather than equality of *opportunity*, completely
    differing from Western concepts. This culture gave birth to the unique lifetime
    employment system in Japanese companies. The benefit of egalitarian culture is
    that it gives the Japanese very good habits of observing order; people pay great
    attention to this sense of order anytime, anywhere. The most significant behavior
    is the phenomenon of queuing in Japan; at any place and any time, Japanese society
    queues very orderly to solve problems. This culture has even penetrated into the
    interior of enterprises. The group recognizes every internal member; corporate
    salary determination is not based on employee ability but on seniority and qualifications
    to measure employee value. Under this salary system, everyone''s future earnings
    are equal.


    For a long time, Japanese life and work have been in this cultural atmosphere,
    and in the past few decades, they have achieved rapid economic development and
    a high-quality improvement in living standards. The relatively conservative and
    stable working state has been a great help to Japanese enterprises in craftsmanship
    and technological innovation, which has also enabled Japan to produce a "craftsman
    culture" (shokunin bunka). Craftsman culture highlights professional ethics and
    a responsible attitude toward one''s post. Enterprise employees do not need to
    worry about their development within the company and focus on improving the craftsmanship
    of the post itself. Japan''s lifetime employment system complements the professional
    values focused on technology. Therefore, egalitarianism is a special culture running
    through the whole of Japanese society and enterprises. The impact of this culture
    on the Fourth Industrial Revolution will also be profound.


    First, from the positive side, the development of AI can minimize repetitive manual
    labor and the imbalance in resource use. From the perspective of national development
    and social needs, AI has broad application prospects in Japan.


    One aspect is reducing the need for manual labor. Because Japan is already an
    aging country, the working population can no longer effectively meet the needs
    of Japanese society. This can actually be seen from the development of Japan''s
    robotics industry; the advancement of Japanese robots lies in effectively reducing
    the need for manual labor. The emergence of such automated machines or intelligent
    robots has effectively reduced inequality between jobs. People no longer need
    to struggle with harsh working environments and simple, repetitive work content;
    humans can be better matched to positions requiring subjective initiative. Another
    aspect is resource management. Japan is an island nation with relatively scarce
    resources and energy. Intelligence can effectively improve resource utilization
    efficiency and effectively enhance the level of intelligent urban management.
    For a resource-scarce city, resource utilization efficiency can be more effectively
    improved. Japan''s smart city construction itself is at a world-leading level.
    In Japan, private companies such as Toyota, Panasonic, Hitachi, Toshiba, and Mitsui
    Fudosan are all very interested in the smart city concept and have embarked on
    the creation and exploration of smart cities. For example, Panasonic''s Sustainable
    Smart Town in Fujisawa, Toyota''s intelligent low-carbon demonstration district
    in Toyota City, and Mitsui Fudosan''s Kashiwanoha Smart City. This shows that
    Japanese society has fully recognized the positive role of the Fourth Industrial
    Revolution for Japan.


    From the negative side, egalitarianism has a negative impact on AI development.
    This impact mainly lies in the impact of AI on traditional social structures,
    which will destroy some existing corporate structures. First, egalitarianism will
    hinder personnel elimination resulting from AI application. Japan''s lifetime
    employment system is unique in the world. The application of AI will inevitably
    lead to the elimination of a large number of traditional positions; personnel
    leaving posts is inevitable, but this is unacceptable in enterprises with a lifetime
    employment system. The social costs generated by replacement must be borne by
    the enterprise and the individual, but the damage to egalitarianism in the culture
    is difficult to repair, or rather, difficult to accept. Secondly, internal corporate
    job grading will encounter huge problems, mainly manifested in the inability to
    measure capabilities between people based on traditional seniority. The factor
    of seniority is greatly weakened, and the mastery of new technologies becomes
    an important standard for measuring post capabilities. Due to the application
    of AI, the technical requirements for intelligent equipment and machine programming
    methods far exceed the past, while in specific process operations, technical and
    experience requirements will be greatly reduced in some positions. Thus, the traditional
    value standards within the group are shaken, and the scope and intensity of this
    shaking will continue until after the full application of AI, possibly lasting
    for one to two generations.


    On the other hand, there is egalitarianism''s resistance to the inequality brought
    by AI. Some new opportunities and crises will shake the original social structure.
    In the historical process, this is often accompanied by various trade conflicts,
    even risks of war. For Japanese society, which particularly values a sense of
    order and egalitarianism, this shock is also difficult to gain social recognition.
    Therefore, for ordinary people, it greatly increases the difficulty of acceptance,
    but this change is undoubtedly the general trend, and this resistance is just
    a transition period not described by history. Resistance can easily lead to Japan
    missing the good opportunity for the development of the Fourth Industrial Revolution.
    At this time, borrowing from Li Zhaozhong''s *The Ambiguous Japanese*: "The Japanese
    are like a school of small fish, swimming orderly in one direction. A stone is
    thrown into the water, disrupting the formation, making them suddenly turn around
    and swim in the opposite direction, yet the formation remains orderly." The destruction
    of orderliness will eventually recover; this is determined by Japan''s cultural
    model, but the destruction of this balance will inevitably affect traditional
    Japanese values.


    Currently, Japan has begun to retrain new types of talent, attempting to break
    away from the old mechanism of traditional labor-year evaluation. It can be said
    that Japanese society is currently attempting various active explorations, trying
    to escape some constraints from past culture. For example, how to redefine egalitarianism
    with fairness has become an important proposition in Japan''s AI development.


    ### Loyalty: The Role Positioning of Social Subjects


    Post-WWII Japan was in ruins. Under the historical conditions at the time, Japan
    most urgently needed to actively develop heavy chemical industries based on advanced
    technology to achieve "catch-up modernization." This required the input of huge
    economic resources and the undertaking of huge economic risks. In terms of individual
    corporate scale, this was impossible. If following the spontaneous regulation
    laws of the market economy, these policies would be impossible to realize. Under
    this situation, the Japanese government adopted various support measures, eventually
    forming a uniquely Japanese industrial policy under strong government intervention.
    Relying on "extremely thorough" government intervention under capitalist market
    economy conditions, it achieved the historical goal of catching up with Europe
    and America at high speed. Particularly from the 1950s to the early 1970s, Japan''s
    real GNP increased at an annual average rate of around 10%, and the reproduction
    of labor force far failed to keep up with the needs of the rapidly expanding material
    reproduction. Labor shortages and talent scarcity became the biggest problems
    faced by Japanese enterprises at the time. Against this background, to stabilize
    the skilled workforce and prevent job-hopping, companies generally implemented
    the "seniority wage system." In this context, Konosuke Matsushita of Matsushita
    Electric (now Panasonic) proposed the lifetime employment system, which quickly
    spread throughout Japanese society. This became a major boost for the revival
    and high-speed growth of the post-war Japanese economy. Lifetime employment, seniority
    wages, and enterprise unions constituted three powerful pillars indispensable
    to modern Japanese enterprise management. However, looking through the surface
    of this system, buried deep within is the management philosophy of collectivism.
    This collectivist management method, in daily enterprise management, greatly increases
    the stability of enterprise personnel and simultaneously promotes employees to
    pay more attention to the accumulation of craftsmanship and technical experience.


    Japan''s lifetime employment system can be said to be a manifestation of Japanese
    loyalty culture. Driven by national systems, society has also formed unique insurance
    and moral systems to match the lifetime employment system. Loyalty culture is
    also an inevitable professional value formed by the combination of Japan''s multiple
    cultural factors and special enterprise systems. With the widespread application
    of AI, Japan''s current enterprise systems and loyalty culture will also be affected
    to a certain extent. This impact is mainly manifested in the following aspects:


    First is the transformation and decline of traditional industries. First, under
    market economy conditions, economic development is cyclical. This cyclicality
    is reflected in the fluctuations of industry revenue and development. For enterprises
    with long-term stable demand, the impact of such fluctuations is completely acceptable.
    However, due to the intervention of the new technological revolution, some traditional
    industries face not fluctuations, but a transformation into sunset industries
    with no development prospects. The lifetime employment system will encounter huge
    social costs in this regard. Obviously, every industrial revolution brings huge
    industrial changes. For example, various internet technology companies that rose
    during the Third Industrial Revolution; in the Fourth Industrial Revolution, the
    combination of robots and AI means many technical blue-collar workers will face
    large-scale technological updates. Between economic interests and the traditional
    lifetime employment system, there will inevitably be more and deeper thinking
    by enterprises and workers on loyalty culture.


    Second is the need for new types of talent by new technologies. In the new industrial
    revolution, new types of talent are an important determining factor for the development
    of the industrial revolution. In the lifetime employment system, university graduates
    enter a lifelong career upon graduation. In this situation, the recruitment of
    new types of talent is very unfavorable for both the company and the development
    of outstanding talent. Furthermore, during the Third Industrial Revolution, Japan
    did not utilize its economic advantages to develop a large batch of excellent
    internet technology companies like other countries, leading to a lack of institutional
    foundation for innovative talent flow in the entire Japanese society.


    Finally, there is the focus and loyalty of Japanese enterprises to their own business.
    The main body of innovation in Japan is the enterprise, and Japanese enterprises
    are almost all private. The characteristic of private enterprises is that their
    performance and development status have no direct relationship with the government,
    and Japanese private enterprises have shouldered the historical mission of national
    development. The enterprise''s development strategy needs the enterprise to determine
    its own direction and decide the direction of technological innovation based on
    its own survival and development needs. The government mainly provides policy
    support and guidance. In the past few decades, Japan promoted the development
    of the manufacturing industry through specific industrial policies. In this scenario,
    how Japanese enterprises respond to changes brought by AI development largely
    depends on the decisions and thinking of enterprise managers. Therefore, currently
    in the development of Japan''s AI industry, although many Japanese enterprises
    actively participate, these enterprises participate more as independent entities
    and prioritize commercial applications. In terms of overall industrial coordination,
    it is relatively weak. Enterprises achieving transformational development while
    adhering to traditional advantages is also an important breakthrough for Japan''s
    development.


    Japan''s lifetime employment system fully guaranteed the stable development of
    enterprises during the period of rapid development at that time. But when facing
    the impact of new technologies, the resistance formed by this traditional model
    is the most terrifying. This resistance is most obvious in talent introduction
    and training. From Japan''s current system, the lifetime employment system has
    resistance to the introduction of special-period talent. As reported by Japanese
    media, they believe that in the increasingly fierce global AI competition, Japan
    lags far behind China and the US in AI research. *The Nikkei* reported that a
    global scramble for AI talent is underway; Japan lags behind China and the US.
    The two countries competing for technological dominance in the 21st century are
    fiercely competing for AI talent; Japan''s disadvantage is obvious. There are
    few Japanese enterprises that can provide sufficient budgets and attractive research
    content. *The Nikkei* stated that Japan must mobilize national resources to cultivate
    AI talent. A survey cited by *The Nikkei* showed a global shortage of 700,000
    AI talents, with China and the US engaged in a fierce scramble. Google established
    the "Google AI China Center" in Beijing in spring 2018 to recruit AI talent locally
    in China, and Chinese companies are also actively recruiting talent in the US.
    Meanwhile, Japan''s talent cultivation policies have only just begun to be gradually
    promoted, which is the biggest uncertainty factor for Japan''s future AI development.


    So from the perspective of the value of loyalty, Japan has fully utilized its
    existing industrial economic foundation, but the existing mechanism is indeed
    a double-edged sword for the innovation of the new technological revolution. Relative
    to the US, a traditional tech innovation powerhouse, and China, a rapidly developing
    country, Japan''s traditional socio-economic development model will inevitably
    form unavoidable resistance to new changes. This resistance comes partly from
    the behavioral inertia of traditional advantageous industries, and partly from
    the values formed during the rapid development of the entire Japanese society.
    Whether innovation talent cultivation can break the original talent evaluation
    mechanism will be a new breakthrough point. Under the existing talent management
    systems in China and the US, on the one hand, relevant outstanding talents are
    cultivated through national macro-education policies; on the other hand, in talent
    incentive mechanisms, they can freely break through and vigorously introduce outstanding
    talents globally. In this regard, they have completely broken through the talent
    management freedom of Japan''s collective enterprise management model. Moreover,
    this issue can be found in a series of Japan''s AI policy planning and promotion
    work. Japan''s traditional innovation model has encountered problems in the new
    technological revolution, which is also an important reason for the Japanese government''s
    active intervention in AI R&D.


    Japan strongly emphasizes collectivist concepts, with high internal cohesion within
    the collective. To reduce internal losses, enterprises adopted a result-oriented
    egalitarian salary evaluation system. This method solves the loss caused by talent
    mobility and produced the well-known "craftsman culture." But in a period of continuous
    new technology updates, Japan''s fair management concept will be challenged. Readjusting
    management values to adapt to the innovation needs of new technologies is an important
    challenge for Japan''s talent policy. Because of the lifetime employment system,
    employee loyalty culture coexists with it, interdependent. If the traditional
    lifetime employment system is broken, the loyalty culture of enterprise employees
    will also be damaged, which is adding insult to injury for Japan, which already
    has a shortage of labor resources. Resolving the conflict of values is already
    a major challenge Japan faces in the Fourth Industrial Revolution.


    ## Chapter Summary


    Japan has its own unique cultural model. This determines that Japan is a country
    that values both its own traditions and practical effects, which deeply influences
    Japan''s development in the Fourth Industrial Revolution. First, the closed nature
    of Japanese culture determines that the Fourth Industrial Revolution is only a
    means to help Japan achieve economic development. Implicit in this is the inevitable
    conflict between foreign culture and local culture, and this conflict becomes
    more complex due to the forbearing character of the Japanese nation. Second, Japan''s
    innovation path dependence will also lead to conflicts in innovation values. Japan''s
    past successful experiences and industrial advantages give Japanese enterprises
    their own innovation ideas; whether the corporate innovation model can adapt to
    the rapid development of the Fourth Industrial Revolution is the key to success.
    However, Japanese society has some relatively special value standards. For example,
    Japan''s protection of privacy will affect the development of Japanese enterprises,
    making the social environment for Japanese enterprises to promote new technologies
    different from other countries. Japan''s traditional values have many conflict
    points with the new technological revolution. First, the emphasis on order by
    collectivism determines that new technological innovation in Japanese enterprises
    needs to be promoted top-down, which requires Japanese enterprises to adjust their
    existing incentive methods. Second, Japan has formed a loyalty culture matching
    the existing enterprise system, making the resistance to changing the current
    management model heavy. From these two points, Japan''s enterprise system and
    social security have been completely integrated; the cost of any change is extremely
    high, and it will face conflicts with traditional values (such as loyalty culture).
    Japanese society is severely aging, and many value concept problems cannot be
    solved through development; this is the biggest difficulty Japan encounters. But
    Japan also has many of its own advantages. As the first country in the world to
    start research and application of intelligent robots, Japan is currently leading
    other countries. At the same time, Japan faces a large domestic labor shortage,
    which increases the demand of the entire society for new technologies represented
    by AI. This is the best opportunity for Japanese society to introduce AI.


    With the widespread application of AI, new values will continue to collide with
    Japanese culture and values. From the perspective of the general world trend,
    whether accepted or not, the new technological revolution represented by AI will
    eventually integrate into the production and life of every country. The values
    of the entire Japanese society will once again face transformation, deriving new
    cultures and new values for the new era.


    ---


    ## References


    [¹]: Ruth Benedict. *The Chrysanthemum and the Sword* [M]. Translated by He Daokuan.
    Beijing: Peking University Press. 2013.

    [²]: [Netherlands] Karel van Wolferen. *The Enigma of Japanese Power* [M]. Translated
    by Ren Songhua. Beijing: CITIC Press. 2020.

    [³]: Jiao Peizhu. Characteristics of Japanese Culture and Its Formation [J]. *Qilu
    Journal*, 1992(06): 72-78.

    [⁴]: Huang Hua. On the Dual Characteristics of Japanese Culture and Their Causes
    [J]. *Journal of Chongqing Technology and Business University (Social Sciences
    Edition)*, 2007(04): 128-131.

    [⁵]: Guo Qiang. On the Complexity of Japanese Culture [J]. *Journal of Yunnan
    Normal University (Philosophy and Social Sciences Edition)*, 1996(02): 68-73.


