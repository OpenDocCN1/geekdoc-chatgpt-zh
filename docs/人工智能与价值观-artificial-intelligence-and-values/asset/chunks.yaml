    # 泛用性人工智能对劳动、价值观与教育的深远影响


    泛用性人工智能在未来某一天的展开，将会彻底改变劳动、薪金、收入的关系，而这种改变的前奏已经到来。根据美国白宫经济顾问委员会2016年的报告，美国目前8 100万个时薪低于20美元的岗位中，83％都面临2036年被机器、自动化和人工智能取代的风险。收入越低，危险越是迫近。更糟糕的是，这种就业的不稳定性还伴随着越来越恶化的贫富差距。从1979年到2013年，美国收入顶层1％的人群，其收入增长了192％，而底层20％的人则只有46％的增长。[^42]资本的增长始终比经济的增长更快，这意味着，过去一个多世纪里的社会上升通道已经很大程度上被改写：勤奋并非致富的快车道，在低收入岗位靠长期雇佣关系积累储蓄实现富裕的人生已经成为活在父辈日记里的旧事，在未来这将更为罕见。


    相应的，美国价值观也在发生深刻变化。原本对勤劳的追捧包含通过劳动换取薪酬，并通过节约开支来增加储蓄，从而支撑房产、汽车等大宗消费。这一价值观背后其实是美国特定的经济形势支撑起来的，也客观上离不开如房利美、房地美等联邦机构的支持。2008年金融危机的教训表明，勤奋致富的“美国梦”只适用于特定收入水平的人，不然所有权就如云烟难以攥牢。随着人工智能对各种工作岗位的侵蚀，中低收入人群的上升通道日益狭窄，客观上对勤劳致富的价值理念造成了冲击。如果劳动也无法积累可观的财富，那劳动的意义又是什么呢？生活的内容如果仅限于为生存而劳动，那么人的意义又是什么呢？如果人不劳动，他是否还具有作为合格社会成员的资格呢，他是否应当享受同等的权利和权益呢？或者再进一步追问，人是否具有经济劳动之外的存在价值呢？


    劳动的意义问题其实从未远离人们思辨的中心。早在19世纪晚期，工程师、管理人阶层就以量规和机床等为工具，对生产过程提出日益精确统一的要求。规范成品尺码，目的在于提升零件可相互替换程度，降低成本，扩大生产规模。这本质上是对熟练劳工经验的提炼和物化，劳动变得片断琐碎，可替代性增强，技艺中所包含的体感经验逐渐式微，谈判薪资时劳方力不从心。哲学家波兰尼（Michael
    Polanyi）曾于1966年提出一个悖论：我们知道的永远比我们说得出的要多……司机的技能不能靠上汽车理论课来代替，所以人工智能取代不了人类。其实这并不符合事实，从量规和机床的推广就能看出，劳动一直面临着被抽象化，进而被工具替代的风险，这种隐患并非始于人工智能时代。这一矛盾之所以长期以来没有爆发，一是因为人工智能之前的技术不足以对如此广泛的工作岗位形成冲击，二是美国的企业主和管理人在面对不断扩张的市场时仍较为乐观，有调节与劳工关系的意愿，劳工阶层逐渐富裕一定程度上疏解他们对于劳动意义的根本质疑。


    第四次产业革命是此前劳动性质改变的延续，但又不同于前，鉴于人工智能的潜力，其对价值观极有可能是颠覆性的。农业社会时期，佃农付出劳动，由占有土地的有产者支付酬劳；工业社会时期，劳工付出劳动，由占有工厂的有产者支付酬劳。由弱渐强的人工智能如果实现，那么就将改写过去数千年的人类劳动形式和经济形态。当个体劳动无论是量还是质，甚至在个性风格方面，都不可能超越自动化系统的产出时，劳动作为人成为有效社会成员的门槛就被砸碎了。面对过剩的生产力，人作为消费者的存在似乎更有必要。于是，一个历史悠久的概念“全民基本收入”（Universal
    Basic Income，或者UBI）找到了脱胎重生的历史契机。


    今天在美国常常被扣上“社会主义”帽子的全民基本收入，其实一直以来都是美国价值体系中的元素之一。早在18世纪末，美国国父佩恩（Thomas Paine）就在《农业公正》一书中提出，地主因为占据了土地，因此最受惠于耕地技术的进步，而这种进步又是依靠社会全体劳动者实现的，从这个意义上说，地主“欠”这个社会的，应当以每年定额的资金返还到没有土地继承权的个人手里。1962年，诺贝尔经济学奖得主弗里德曼（Milton
    Friedman）提出“负所得税”概念，亦即当收入水平不达线时，不但不用缴税，还会得到补贴，这实质上也是全民基本收入的一种变体。[^43]60年代的美国，因为弗里德曼的倡导和其他经济学大家的支持，全民基本收入开始逐渐进入政策领域。1969年，总统尼克松提出“家庭救助计划”，为每户家庭提供每年1
    600美金（今天约11 000美金）的资助。这证明，关注社会公平的美国思想者们其实一直没有放弃这个大胆的设想，1972年的民主党总统候选人甚至提出了更为慷慨的政策。但是这些政策都在国会层面被驳回，因为冷战时期美国在意识形态方面强调个人主义、按劳分配和自由市场等价值观，它们与全民基本收入的概念确实多有矛盾之处。


    然而，从宏观经济状况来看，勤能致富成为美国价值观其实是一个历史的偶然，其所基于的原理是19世纪晚期和20世纪初的经济大局。彼时美国经济增长迅速，劳动力缺口大，中学文凭的劳工就可以通过体力劳动挣得一份相对体面的收入。二战之后，“美国梦”的概念逐渐形成，其中所包含的一项重要元素就是房产所有权，美国政府推出了大量优惠政策，促进贷款市场流通，鼓励居民买房，并带动其他产业。总体来说，20世纪中期，美国家庭的收入与房产持有率稳步上升，给予了勤能致富这样价值观以支撑。加之冷战时期意识形态的对立，任何强调社会福利制度的呼吁与政策，都会被无情地被归入敌营。到2016年时，奥巴马白宫仍然无法接受全民基本收入这样一个概念，或者以此概念为基础展开政策设计。要一位总统承认在他治下，工人无法受雇这种悲观现实已经成为施政的前提，这确实有点令人为难。


    新的经济格局已经形成，房产价格走高，收入增长停滞，贫富差距日益悬殊，这让年轻人感受到了强烈的危机感。父辈们勤致富的老路走不通了，美国的价值观亦开始动摇。在2017年与Quartz的采访中，比尔·盖茨提到：当一个工人今天在工厂里产生价值5万美元的劳动时，政府会从中收取所得税，收取社会保险金等等；那么如果一个机器人做了同样的工作，它难道不应该被征税吗？盖茨主张，虽然全民基本收入这个主意有点激进，但是政府应该向使用机器人的企业征税，来救助越来越处于不利地位的人类劳工。[^44]2016年总统大选中的民主党候选人希拉里·克林顿也对全民基本收入展现出浓厚的兴趣，她对阿拉斯加州依靠原油收入补贴本地住民的做法赞赏有加，并认为需要进一步跟进，了解这类政策可行性的技术细节。[^45]


    美国全民基本收入在过去几年间借2020年总统大选的东风，已经成为了曝光度颇高的时尚热词。这当中既反映出美国民众因始终难以缩小的贫富差距而产生的焦虑，也说明人工智能在各行各业的使用已经对低收入劳动者群体构成了颇为实际的威胁。从组装汽车的机器臂、无人驾驶的州际卡车，到银行的在线客服、快餐店的点餐人员、线上的外文教师……自然语言处理等人工智能工具使得机器人对人力的取代不再仅限于蓝领工作。2020年民主党候选人杨安泽（Andrew
    Yang）在推广他每人每月一千美元的UBI计划时一再提到，全民基本收入并不是社会主义和共产主义特有的，从历史上看这其实是一个“非常美国”的主意。不但建国伊始就有这样的构想，就连民权运动领袖马丁路德金也视其为解决黑人人口积贫积弱的有效办法。杨安泽在民主党初选中虽有一定声势，但最终惨败，这也从一个方面证明了UBI在当下的美国推行条件尚不充分。进一步说，人工智能所带来的对人的权益的威胁与思考虽然已经日渐实质化，但仍没有突破现有美国自由主义价值观中对种族和经济平等的解释框架。


    事实上，人工智能给现有劳动制度和福利制度带来的颠覆将是根本性的。哈佛大学肯尼迪国务学院的里斯教授（Mathias Risse）指出，如果我们以为人工智能的来临也会以历史上相似的局面善终，那么未免太天真了，因为如果要让未来的人类能与人工智能竞争，那意味着现行的教育系统要全部喊停，要进行非常极端的调整才行。当然也有可能，新工作岗位的增加，必要工作时间的减少，更高的薪酬，或许能让人们过上更好的生活，但是里斯指出，在美国这样连全民医保都缺乏社会共识的国家，科技与教育之间的赛跑很可能最终以富裕阶级进一步扩大财产占有而告终，更多的人将滑入难以维持基本人权的社会状态。[^46]


    这并不是危言耸听。劳动力市场日益萎缩，意味着所得税的降低，政府却要支撑起越来越沉重的福利安全网。从趋势上看，这是不可持续的。由此可见，这一问题的解决，也必须包含两个抓手：一个是扩大征税的对象，一个是改变福利发放的方式。于是，征收“聪明机器人”税，或者如杨安泽所说，向受益于人工智能应用的企业征收增值税，用于发放无条件的全民基本收入，听上去就没有那么荒谬了。但也有人指出，这种做法在财政层面是不负责任的，会造成政府高额赤字，发达国家也无力承担，而且失去针对性的福利发放只会让底层群众的获得变少。同时，如此施政还存在鼓励宅家不出门工作，降低社会凝聚力，降低社会参与的风险，同时UBI也是企业敷衍塞责、不认真探讨就业市场结构性问题的“遮羞布”与“万灵安慰剂”。[^47]


    ### 勤奋的定义在教育领域已被改写


    如果说劳动抽象化和财富分配极化属于历史问题，那么人工智能带来的对勤劳这一价值审美的全新定义，已经在教育领域日益显示出来。在职业教育领域，美国的政客喜欢淡化人工智能的威胁，热衷于宣扬再训练项目，认为它们能够帮助失业人口找到新的工作。因为人工智能发展速度快，涉及的领域日渐广泛，因此这种再训练似乎必须是终生的，必须要紧随人工智能的发展节拍。至于这种培训能在基础教育洗炼中已经惨遭淘汰的低收入人群中产生多大的积极结果，没有人真的敢打包票。


    在基础教育领域，勤奋和效能的定义也在不断被改写。学习中的勤奋不再是纯粹的知识和技能积累，而变成了一种对自知与自觉的积极寻求——为了不被人工智能轻易替代，为了成为对人工智能的存在与力量有察觉、有驾驭的新一代劳动者。近年来，美国学者开始意识到人工智能教育必须“从娃娃抓起”，让孩子们在大学教育之前就进入人工智能的知识语境，人工智能及其相关知识内容已经广泛走进基础教育，出现于美国中小学课堂。其中的代表之一就是AI4K12计划，该计划是由人工智能促进协会（The
    Association for the Advancement of Artificial Intelligence）和计算机科学教师联盟（Computer
    Science Teachers Association）共同推进，由美国国家自然基金提供资助。该计划将人工智能相关的问题分为五种：


    1.  **认知**，包括人的感知对比计算机感知，从感知到认知，计算机认知的局限性；

    2.  **表征与推理**，包括世间万象如何通过数据表达，计算机如何利用这些数据进行推理，它的局限性是什么；

    3.  **学习**，包括学习的本质，机器学习的方法，神经网络基础，机器学习的局限性；

    4.  **自然互动**，包括自然语言处理，知觉与哲学思维，人机互动等；

    5.  **社会影响**，包括人工智能对商业、医保、司法等领域的改变，人工智能的经济驱动作用，人工智能带来的伦理争论，人工智能对就业岗位的威胁等。


    进而将这些知识内容分为四个年级段（2，3-5，6-8，9-12）传授，各阶段内容各不相同，复杂度逐步递增。[^48]


    与之相匹配，越来越多的科技公司和大学也开始研发和提供帮助青少年理解和学习的互动平台。`Scratch`就是其中代表，它与`IBM`共同开发了“认知伙伴”（`Cognimates`）和“给孩子们的机器学习”（`Machine
    Learning for Kids`）。`Google`的创造性实验室（`Creative Lab`）开发了“可教的机器”（`Teachable Machine`）来帮助青少年学习视觉识别和分类的原理。“应用软件发明家”（`App
    Inventor`）则是由`MIT`开发，利用`Amazon`智能音箱的自然语言处理能力，来帮助青少年从事手机程序的开发。[^49]


    其实，有设计的人工智能系统未必让人越来越懒，越来越受动，它同样可以用来实现自由意志的提升，将自由这一价值观的定义从消费主义中解放出来。卡内基梅隆大学的卡塞尔教授（Justine
    Cassell）指出，今天对人工智能的畏惧并不新鲜，在历史上早已有之。当电报和电话日渐普及的时候，19世纪、20世纪的美国家庭十分担忧这些新的通信设施会让他们的女儿受到诱惑，进入脱离家庭道德制约的无法之地。这种畏惧并非针对科技本身，而是关乎人们对自身、后代、家庭和群体价值观的担忧。人工智能的目标未必是完全的机器自立自治，1956年夏天的达特茅斯会议对机器可以模拟学习智能的定义并不是这一概念的本义。卡塞尔认为，1946年到1953年间召开的梅西基金会讨论大会（The
    Macy Conferences）上对控制论的讨论更具代表性：人工智能的目标是建立一套“关于人类心智活动的普遍科学”，并用机器来作为认识人类认知的模型。卡塞尔指出，如果从一开始，我们就接受人并非自立自治而是互相依靠的，那么我们对机器的追寻也就不会陷入对自立自治无尽追求的怪圈。


    卡塞尔长期从事人工智能虚拟学伴的研发和实验观察，她对于教育学和社会学理论的吸纳极其充分，意在建立具有社交属性的人工智能。她与她的学生塔塔罗（Andrea Tartaro）开发了一款专门针对阿斯伯格症孩童的学伴，在学校和一些非正式场合，观察这些9—14岁的孩子们如何与虚拟学伴展开互动。虚拟学伴被设置成一个故事的发起者，然后会在特定的时候陷入沉默，进而发问“然后发生了什么呢”，来诱导孩子们加入对话。实验结果十分令人惊喜，这些平日里与普通孩子交流极其困难的阿斯伯格症患儿，在与虚拟学伴的互动中展现出了前所未见的沟通技能，他们会积极补全虚拟学伴说到一半的故事。例如在奶奶做饼干的故事里，当虚拟学伴陷入“犹豫”之时，他们主动说奶奶去拿面粉，奶奶去拿糖等等。可见沟通的技能在这一人群中并非缺失，而是普通人习以为常的社交环境对他们来说过于压迫，与人工智能之间的沟通则不存在这样的问题。这意味着人工智能系统能够帮助我们理解特定人群的意识活动，进而引导他们学会一般的社会互动。[^50]


    可见，从对人工智能的不同定义出发，不局限于生活中常见的应用，将能更完整地认清这一科技所蕴含的潜力。它可以应用于消费主义式的自由，让人们不断沉浸在让自己舒适的圈层当中，不断点击可预判的、带来更多快感与刺激的内容；它也可以回归到对人的心智的真正的科学研究中，从对机器的研究中探索人类意识的复杂活动，释放人的潜能，实现真正意义上的赋能与自由。


    ## 本章小结


    美国价值体系中，平等、安全、自由一直占据着中心位置，很容易被误读为同一组价值观跨越时空，贯穿始终。事实上，处在不同经济社会背景中的平等、安全与自由，其内涵也一直在改变。一些价值判断得益于人工智能赋能，正在回归其应有之义，当然它们的负面效应自然也存在被放大的风险。


    人工智能在司法领域、职场、教育中的应用，将数据基础中的积弊暴露了出来。机器并没有错，而是“喂养”它的数据里已经包含了不公正的人类实践。因为机器的介入，以算法作为表达的平等价值观日渐客体化，促使业界对相关算法加以讨论和修正。这是人工智能对美国价值观积极作用的一面。但是另一方面，随着人工智能技术的提升，安全的价值内涵也在变迁。20世纪未能实现的军事理想正在成为社会现实，去中心化的私权维护正日益被高度中心化的信息集成与人机结合所取代，人的能动性越来越被力求百分百杜绝人对决策和执行过程的非理性干预的价值取向所取代。


    如前所述，美国的价值观由自由主义和控制文化两方面构成。人工智能为控制文化在社会、经济、政治、军事、生活等方面找到了新的应用平台与机会，使控制文化得以二次发育，对效率、精确、标准化和中枢化的要求渗透到日常生活方方面面。控制文化与自由主义之间，力量并非对等，因为前者直接受益于科技的进展，有更多的硬件条件和发生频度支撑；后者则相对软性，倚赖道德自律和慷慨善良。


    科技史学者休斯（Thomas Hughes）曾指出，19世纪以来的科技发展是大型科技项目的发展，个体的英雄式的研发固然重要，但是系统的构建则不只包含机械和物件，还涉及社会的组织方式。二战后美国的科技发展超越了早前的大发明家模式，更仰赖权力机构的管理能力对各类科研机构和经济组织的协调与整合。[^51]人工智能目前仍不能脱离既有科技应用和社会组织独立运作，因此相比起科技本身，其基础技术的沿革与特性，其在经济社会中实际的应用场景，以及学界和一般社会成员如何对其做出评价，这些方面更值得我们关注。尤其是关于机器的道德观念，究竟是采取边沁式的、更为服务于人工智能使用者的义利观，还是采用康德式的、更顾及普遍性真理和道德的义利观，将成为人工智能开发者们将要一直面对的难题。


    至于在一些已经不可逆转的领域，价值观不得不呼应人工智能的发展而发生改变，例如人工智能对就业市场的普遍威胁，以及相应而来的对“勤能致富”这一系列20世纪价值理念的重新解读。人在某些领域的算力全方位败给计算机只是时间问题，这一发展是不可逆转的。虽然美国价值传统中具有相当多抗拒“全民基本收入”这类政策的文化元素，但是年轻一代美国人对于“勤奋”的理解已经悄然改变。勤奋不再是不懒惰，勤奋是越来越讲究战略的、跨学科的、终生式的生存法则，需要在人工智能难以“触类旁通”的领域有技巧地发挥人之为劳动者的价值。至于这种多少带着受迫色彩的勤奋，它的边界在哪里，还没有人知道确切的答案。


    ---


