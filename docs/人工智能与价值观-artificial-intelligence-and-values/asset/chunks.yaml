- raw: '《纽约时报》曾报道，科技公司Nest（后被谷歌兼并）曾于2015年推出过一款住宅温控人工智能系统，这套系统会先用一个星期的时间观察住宅内的人，注意他们的行为作息和温度偏好；它同时具有动作侦测感应器，可以知道家里是否有人。当家里没人时，它会进入节能模式；当家里有人时，它会调节温度来适应屋主的偏好。那么，假设屋主喜欢在夏天将温度设置在22度左右，而非通常建议的26度，假设屋主喜欢24小时维持温控，无论家里有没有人，那么当人工智能系统被告知要如此行事时，它应当尊重使用者的偏好，还是尊重更高级的、有利于节能环保的德性呢？[\[25\]](#txt003.xhtml#footnote_content_txt003_25)其中的核心问题是人工智能究竟应该遵循哪一种性质的价值观。当我们向人工智能发布指令的时候，人工智能应当遵照什么标准来运行呢？按照我的指令行事，按照所表达的意图行事，按照所显露的偏好行事，按照基于理性和信息的偏好行事，按照我的客观利益最大化为目标行事，还是按照个体或社会的价值观行事？


    这当中就显示出边沁式功利主义和康德式普遍道德法则这两种价值观原则的冲突之处。有学者指出，无论是这两种中的哪一种，人工智能本身都不具备作为道德主体的条件。例如，康德式道义论既要求有道德规范限定行为的轨迹，还需要有施展道德行动的动力。例如本能，本能在无意识的情况下驱动行为，它由情感驱使，需要经过社会化的训练形成，这些机器无法做到。如果用社群理论来解释道德动机，那么机器更不可能过关，因为一个作为道德主体的人必须在被社会其他成员认可为道德主体时，才能以这样的身份展开行动。如果人工智能只是依靠模仿来实践道德行为，那么它是不具备主体性的，不是靠“情感模组”对情绪采用量化的表达就能解决的。[\[26\]](#txt003.xhtml#footnote_content_txt003_26)


    也有人认为，需要对人工智能是否具有道德性有一个明确的界定。对此，历史上并非没有构想，这一尚存于概念中的测试被称为“道德图灵测试”（moral Turing
    Test）。道德图灵测试本质上接近图灵测试的原理，需要自动化系统学会模仿人类的道德标准来进行决策。[\[27\]](#txt003.xhtml#footnote_content_txt003_27)这一概念之所以迟迟未能付诸实践，是因为专家们对于应该运用哪些伦理来对人工智能进行道德判断无法达成共识。有学者指出，要规避这个选择难题，不妨将图灵测试中的人机对话限于道德话题。如果人无法分辨对方是人还是机器，那么机器便可视为一个“人工道德主体”（artificial
    moral agent）；或者不采用语言，而是用行动来判断，看看机器的行动和人的行动能否被区分。如果无法区分，那么机器便算通过道德图灵测试。[\[28\]](#txt003.xhtml#footnote_content_txt003_28)


    塔夫茨大学计算机科学与人际互动实验室的阿诺德和舒茨（Thomas Arnold & Matthias Scheutz）指出，如果只是用这样的测试来决定人工智能是否道德，无非是诱导它给出具有欺骗性的答案来蒙混过关，这样反倒是有害的。因为首先，你无法判断模仿在这当中起到了多大作用。例如，当被问及复杂的乘除法运算时，机器可能完全具备瞬间应答的能力，但是它可以模仿人的行为，用多一些的时间思考，或者告诉测试者它算不出来，这样就增加了其被视为人而非机器的概率，关于道德问题亦是如此。其次，有时候人工智能给出了道德的回答，但我们却无从知晓其道德推断的过程，况且即便能够做出德性的推论，也未必会带来德性的行为。人工智能如何认知环境，人工智能又具备哪些可以选择的行动，这些都应该是透明公开的。最后，如今越来越多的生产生活领域会有人工智能的身影，即便是弱人工智能也会带来道德冲击，如果所谓的道德图灵测试这一概念站不住脚，那么用它来作为全行业衡量人工智能道德与否的标准，就会很成问题。阿诺德和舒茨故而主张，应该采用系统查证的方法，确保自动化系统的设计是受控的、可追溯的，在系统设计之初和过程中，就将道德观念注入其中，而不是让它们应试一般地在已经知道肯定会得到允准和点头的答案中选择，实则无法查证它们决策的流程。系统查证是要查明机器为什么没有采取特定的反应，这种选择是建立在什么样的逻辑链上的，它又是如何对决策的情境进行评估的，这样就远比得到一个具有道德推论感的答案要可靠得多，也对设计提出了要求。[\[29\]](#txt003.xhtml#footnote_content_txt003_29)


    系统查证并不解决自动系统的道德主体性问题，也不能提供令所有人满意的高尚解决方案。比如一辆无人驾驶汽车应当选择撞死路边的一个孩童，还是让坐在车里的车主牺牲生命，这抉择显然是进退维谷，但是它至少能够帮助我们更好地、更充分地探索伦理和道德准则，带领人工智能向更稳健的方向前进。目前美国学界有人主张，人工智能若要与价值观结合，结合的方式可以有至少两种：其一，是符合普世人权价值观的人工智能。世界各地虽然文化不同，价值取向多元，但是还是有一些关乎人生存之根本的理念是共享的，例如对温饱和安全的追求，对肉体免于痛苦和劳役的追求，人工智能应当基于这些普遍原则来构造；其二，是依据社会选择理论（social
    choice theory），将单个的价值观点以特定方式集合起来，形成一种特定的、自下而上的共识。人的偏好未必反映人的真实所愿，对个人利益最大化的追逐又会与公平分配的道德原则相抵触，所以将道德计算融入人工智能的设计当中，或可缓解这些矛盾。抑或设计投票环节，交由人工智能来平衡并统合多样化的利益诉求，形成一种基于算法的道德新共识。[\[30\]](#txt003.xhtml#footnote_content_txt003_30)


    在现实生活中，公众其实已经逐渐形成了对于人工智能道德能动性的常识式判断。如果人工智能在现实生活场景中犯了错，人们究竟是会怪人工智能的算法，还是怪使用算法的人呢？密苏里科技大学心理科学系的单克和德桑提（Daniel
    B.Shank & Alyssa DeSanti）就此问题展开了一项调研，他们在线向321名被试者发放了问卷，调查他们如何评价7件真实发生的人工智能的道德失误，亦即归咎于谁，人还是机器。这7个事件分别是：①算法根据种族偏见误判罪犯的再犯概率；②用搜索引擎搜索“大猩猩”后显示出黑人女性图片；③护照照片识别算法将亚裔照片误认为是闭着眼的；④在线选美程序选出的都是浅肤色的女性；⑤在儿童的应用软件中推送色情暴力广告；⑥推特聊天机器人使用种族蔑称和支持法西斯的言论；⑦年轻女孩尚未告知家人怀孕就被商家寄来的优惠券泄露。被试者如果认为此事件有违道德原则，那么他们会进而被问及各个行为主体（组织者、使用者、人工智能算法或其开发者等）该承担多少责任（从1到5），再继而被问“人工智能是否有自己的意识”，“多大程度上具有动机”等（从1到5）。调查发现，如果被试者认为人工智能算法牵涉其中，那么认为该事件有违道德原则的比例会有所增加，会从30％增加到37％；而如果人工智能卷涉其中的话，那么其使用者也会被更多归咎，这证明当被调查者自己能够理解人工智能的运作规律时，他/她会认为事件中的使用者也是可以理解人工智能的，知错犯错故而罪加一等。同时调查表明，无论事件是否有违道德原则，绝大多数被试者不认为人工智能有自己的想法。[\[31\]](#txt003.xhtml#footnote_content_txt003_31)基于上述同一组真实事件，该研究团队展开了另一项调研。他们将事件中的决策结构分为4种：①完全由人工智能；②完全由人；③由人监管的人工智能；④人工智能向人提供建议。通过对453名被试者的调查，该团队发现4种决策结构的不同并不能显著改变上文中提到的归责选择。[\[32\]](#txt003.xhtml#footnote_content_txt003_32)


    ### 把伦理融入人工智能设计之初


    一些初步的研究已经发现，当人们意识到人工智能在事件中发挥了某种作用时，该事件中的道德困境会遭到更多人的检视。之所以会如此，并不是因为人们认为人工智能具有自己的想法了所以十分危险，而更像是人工智能将道德法则对象化，使之更容易被探讨。一来它并不直接牵涉具体的人，减少了道德讨论中的一重伦理阻碍；二来它以算法的方式呈现道德，使之变得可追溯、可查证、可修正，增加了人们改善其道德实践的动力，毕竟改善机器的行为要比改善人性要可操作得多。正如杜严勇所说，哲学语言的模糊性与计算机程序的准确性之间存在天然的矛盾。[\[33\]](#txt003.xhtml#footnote_content_txt003_33)上述例子所展现出的，是人们意图用计算机语言的精度来倒逼价值判断精度的典型范例。


    美国的大学和研究机构，已经开始注意到价值观融合在人工智能设计阶段的重要作用，在课程设计上也反映出了对这种迫切需求的回应。在人工智能研究重镇波士顿，哈佛大学教授格罗斯（Barbara
    Grosz）制定了一项“内嵌计算机道德”（Embedded EthiCS）计划，旨在让计算机科学专业的学生有更多机会在课程中接触到伦理问题，实现在每一个人机协动的系统中都能够置入伦理模组。在这样的课堂里，学生们会探讨：如果一个被通缉的人进入到无人车中，那么无人车是否有义务将门窗反锁直接驶往警局？如果司机要求无人车以80迈的时速超速行驶，无人车是否应该听从？万一出了事故，究竟是该由下达命令的人承担责任，还是由无人车制造商承担责任？现实生活中超速现象比比皆是，为什么到了无人车这里，超速就显得非常具有争议性呢？……在这些跨学科的追问中，并不存在唯一的标准答案，课程的目的旨在向未来的人工智能开发者们灌输伦理设计的必要性。[\[34\]](#txt003.xhtml#footnote_content_txt003_34)


    伦理多样性的教育或许更有必要。2014年一项研究指出，在对哲学没有预先知识的情况下，美国学生大多数是功利主义哲学的信徒，因为功利主义对愉悦和产出最大化的追求和美国的价值观天然一致。[\[35\]](#txt003.xhtml#footnote_content_txt003_35)但这种价值观模糊了道德的定义，不讲情境，只讲更高效的控制，这些都会引发人工智能设计中的问题。美国国家科学基金资助的一项跨院校、跨学科的研究项目就指出，合理的人工智能伦理课程设计，应当向学生传授三种伦理观——康德的道义论、米尔的功利主义和亚里士多德的德性伦理学。以广告推送系统为例，功利主义追求最有效、最精准、最高转化，道义论追求双方义务权利的对等，亦即强调用户对平台使用自己数据的许可权，德性伦理学则强调用户不轻易上当点击，但又会适度点击广告以维持平台的生存权。此三者并不互斥，也没有高下之分，而是为学生提供完整伦理学视野的角度。教育者应当有义务让从事人工智能相关行业的学生接触到多元的伦理学观点，在课堂上积极引用科幻电影和小说作为讨论的场景，将其打造成受学生欢迎的课程，从而令系统设计之初，德性便是在场的。[\[36\]](#txt003.xhtml#footnote_content_txt003_36)


    ## 自由及其代价：从表面选择到真实赋能


    无论是总统直选，还是新闻多元，美国价值观中的自由，其核心都在于选择。在不同的领域里，选择的逻辑基础又不尽相同，例如社会力量和信息的多元与市场生产能力的丰沛，两者就不能完全画上等号。美国传统价值观中的自由主义取向与消费主义很容易成为天然的盟友，因为人们在选购商品的时候，往往沉醉于挑选品牌时所体现的能动性，却不太考虑这些纷繁多样的品牌背后，是否出于同一个或者少数几个商家，错把生产营销能力的强大当作利益主体的多元。新的科技产品尤其容易落入这样的陷阱，人工智能也不例外。今日美国舆论对人工智能的追捧很大程度上出于对自由的不懈追求，事实上，科技本身并不具备这种属性，它仍然受制于特定的经济、社会、历史条件，需要人们理性面对。


    ### “自由”之内涵的跨世纪变迁


    以个人电脑和互联网为例。冷战的终结，经济的繁荣，为90年代的美国注入了自由主义强心剂。信息科技为人们畅想未来和自由表达提供了新平台，但这种解放性的力量并不全然来自于数字科学和信息技术本身，更多的是由多种历史合力促成并维持的，其中最重要的有三点：一是以西海岸无线电兴趣团体为代表的信息乌托邦意识形态，受当时“反文化运动”影响，推广新社群主义（New
    Communalism），主张用新科技实现自给自足，创造和谐平等的无国界线上空间。[\[37\]](#txt003.xhtml#footnote_content_txt003_37)二是东亚成为世界工厂，企业与企业横向的长期关系逐渐取代僵化的垂直整合，中枢化管理传统受到冲击，新自由主义思潮在美国勃兴。三是信息技术在走入民间后，为了迎合新兴市场需要，其营销方法也烘托了个人主义和自由主义氛围。80年代中期，IBM和苹果等企业日趋标准化的生产流程和视窗系统提供的直观的操作界面，为个人电脑降本增销，企业进而推广产品细分，例如著名iMac
    Flavours系列的多色外壳，为顾客提供了个性化的外观选择。


    今天，美国对人工智能的认知仍存有90年代信息科技潮时的浪漫化倾向，或者在科幻电影所限定的极端情境中对其加以探讨，容易忽视其技术和行业土壤的深刻变化。首先是信息的商品化。以搜索引擎和社交媒体为代表的新型科技公司，它们不生产信息，却是信息实际的管理人，靠广告支持运营。为了提升推送转化率，公司需要收集分析用户的搜索历史、日常信息和人际网络，形成更符合用户偏好的内容推荐。如今，推荐系统这一人工智能工具已广泛存在于线上线下。美国第二大零售巨头塔吉特（Target）就通过发放免费会员卡追踪客户消费习惯，用25件商品（营养品、无香味的香皂和乳液、婴儿浴巾等）作为推算一名女性是否怀孕的依据，以便定点定向投放优惠券。[\[38\]](#txt003.xhtml#footnote_content_txt003_38)其次，个人电子设备市场趋于饱和，严控成本再度成为争夺市场的有效工具。有迹象表明，不少新型科技公司正在走上垂直整合的老路，重新调整产业链布局，削弱了对横向长期关系的依赖。如流媒体企业网飞（Netflix），这家以租售影碟起家的科技公司于2007年开始提供线上观看，2013年开始垂直整合上游产业，吞并整条影视产业链，制作符合用户品味的原创内容，推荐系统与市场增长之间形成良性循环。而苹果公司为了使iPhone实现30～50美元的降价，一面与芯片制造商高通诉讼不断，一面致力于内部研发生产芯片，意在避免此前因与高通的官司引发区域性禁售风险，企业间的横向长期关系正在经受逆全球化的严峻考验。


    人工智能的普及便发生在这样的历史拐点，其概念虽然形成于20世纪中期，但人工智能之所以能成为商业潜力大、涉及人口众多的科技，正是得益于上述两大变化，即信息的商品化为人工智能提供了学习数据和反馈成果的新平台，个人电子设备的普遍化则为中枢化的处理、识别和学习提供源源不断的“原料”。无论是专家系统还是联结主义，人工智能在现阶段都离不开海量的数据的给养，不然纯粹一个函数拟合工具是没有商业价值的，也不会产生社会效应。从这个意义上说，人工智能虽然具有赋能机器解放人类的美好愿景，但却未必总是与人对自由的追求相一致，尤其是在消费之外的领域。


    数据隐私的自由便是其一。9·11事件之后，《爱国者法案》为国家安全局监听监控大开绿灯，其对象分布于美国境内外，数以百万计。国家安全局称他们只采集手机的“元数据”（metadata），具体通话内容并未窥听，但有数据安全专家指出，数据和元数据的差别不过是内容和语境而已。当绝大多数人口都被置于监听之下，仅凭元数据，即通话地点、对象、时长、频度等，就能完整地勾画出个人的社交地图。[\[39\]](#txt003.xhtml#footnote_content_txt003_39)大型科技公司用人工智能协助情报机构分析海量信息。以2013年3月8日起的一个月时间为例，美国国家安全局下属的Global
    Access Operation单元就从美国电信系统上的30亿次电话通话和电子邮件中采集信息。斯诺登曝光的“棱镜计划”（PRISM）显示，大型企业如谷歌、苹果、微软等皆被要求提供用户数据信息。[\[40\]](#txt003.xhtml#footnote_content_txt003_40)由此可见，无国界线上空间的两大支柱，即跨国生产链和信息乌托邦，都已出现动摇，无法再支撑20世纪末盲目乐观的科技自由主义情绪。


    自由意志的发展受阻也是一例。人工智能代劳决策的普遍应用能增加效率，但也会削弱人的反思精神，导致被动性、情感疏离、能动性降低、责任感降低、无知无助等。最简单的例子就是美国网民对流媒体网站视频推荐和社交媒体新闻推荐的依赖，大量网民已经将自己的观影品位完全交给自动化系统来塑造，推荐什么看什么，而不再自己手动探索，或者根据曾经的精英守门人的推荐沿着影片类型或导演成长的线索搜索，而是把欲望的放大和快感的提升作为信息摄取的唯一目标，为此甚至不惜牺牲影视作品的艺术性和新闻的真实性与科学性。2020年新冠肺炎疫情中美国民众抗拒口罩疫苗的举动频现，背后就有大量不实、反科学的新闻与社评支撑。又例如，人们越来越习惯于在电商平台上选择礼物，只需要敲下“母亲节礼物”，就会出现一系列的商品，这些商品确实可能比个体自己所想的礼物更符合母亲的实际需要，毕竟这是基于大数据的人工智能决策。但是当人们把苦思冥想的工作交给人工智能时，当人们以为获得了时间和自由可以去从事更具投入产出比的活动时，他们其实也失却了一年一度与亲近之人沟通的机会，失去了真的仔细考察他人的生活，想他人之所想的机会。


    凡事都由机器代劳更为致命的代价，就是工作岗位的消失，还有人对自身价值的再审视与再定义。每一次产业革命，新科技所带来的工作岗位总比其摧毁的岗位要多，这使得美国社会对于进步的期待不会因为鲁德分子捣乱而熄灭。皮尤研究中心2014年的一份调研显示，近一半的受访者认为，人工智能即将带来的产业革命和过去不会有太大的差别，劳动力市场的发展仍然是线性的。[\[41\]](#txt003.xhtml#footnote_content_txt003_41)但是，如果我们仔细观察劳动性质的构成就会发现，人工智能带来的威胁不同于从前，不但重复性高的体力劳动面临被替代的可能，就连认知、互动、分析类的脑力劳动也面临不同程度的威胁，这不是过去几次产业革命中用机械和电气改变人类劳动和交流方式所能相提并论的。


    ### 全民基本收入或成为“软着陆”方案'
  fmt: '

    《纽约时报》曾报道，科技公司Nest（后被谷歌兼并）曾于2015年推出过一款住宅温控人工智能系统，这套系统会先用一个星期的时间观察住宅内的人，注意他们的行为作息和温度偏好；它同时具有动作侦测感应器，可以知道家里是否有人。当家里没人时，它会进入节能模式；当家里有人时，它会调节温度来适应屋主的偏好。那么，假设屋主喜欢在夏天将温度设置在22度左右，而非通常建议的26度，假设屋主喜欢24小时维持温控，无论家里有没有人，那么当人工智能系统被告知要如此行事时，它应当尊重使用者的偏好，还是尊重更高级的、有利于节能环保的德性呢？[\[25\]](#txt003.xhtml#footnote_content_txt003_25)其中的核心问题是人工智能究竟应该遵循哪一种性质的价值观。当我们向人工智能发布指令的时候，人工智能应当遵照什么标准来运行呢？按照我的指令行事，按照所表达的意图行事，按照所显露的偏好行事，按照基于理性和信息的偏好行事，按照我的客观利益最大化为目标行事，还是按照个体或社会的价值观行事？


    这当中就显示出边沁式功利主义和康德式普遍道德法则这两种价值观原则的冲突之处。有学者指出，无论是这两种中的哪一种，人工智能本身都不具备作为道德主体的条件。例如，康德式道义论既要求有道德规范限定行为的轨迹，还需要有施展道德行动的动力。例如本能，本能在无意识的情况下驱动行为，它由情感驱使，需要经过社会化的训练形成，这些机器无法做到。如果用社群理论来解释道德动机，那么机器更不可能过关，因为一个作为道德主体的人必须在被社会其他成员认可为道德主体时，才能以这样的身份展开行动。如果人工智能只是依靠模仿来实践道德行为，那么它是不具备主体性的，不是靠“情感模组”对情绪采用量化的表达就能解决的。[\[26\]](#txt003.xhtml#footnote_content_txt003_26)


    也有人认为，需要对人工智能是否具有道德性有一个明确的界定。对此，历史上并非没有构想，这一尚存于概念中的测试被称为“道德图灵测试”（moral Turing
    Test）。道德图灵测试本质上接近图灵测试的原理，需要自动化系统学会模仿人类的道德标准来进行决策。[\[27\]](#txt003.xhtml#footnote_content_txt003_27)这一概念之所以迟迟未能付诸实践，是因为专家们对于应该运用哪些伦理来对人工智能进行道德判断无法达成共识。有学者指出，要规避这个选择难题，不妨将图灵测试中的人机对话限于道德话题。如果人无法分辨对方是人还是机器，那么机器便可视为一个“人工道德主体”（artificial
    moral agent）；或者不采用语言，而是用行动来判断，看看机器的行动和人的行动能否被区分。如果无法区分，那么机器便算通过道德图灵测试。[\[28\]](#txt003.xhtml#footnote_content_txt003_28)


    塔夫茨大学计算机科学与人际互动实验室的阿诺德和舒茨（Thomas Arnold & Matthias Scheutz）指出，如果只是用这样的测试来决定人工智能是否道德，无非是诱导它给出具有欺骗性的答案来蒙混过关，这样反倒是有害的。因为首先，你无法判断模仿在这当中起到了多大作用。例如，当被问及复杂的乘除法运算时，机器可能完全具备瞬间应答的能力，但是它可以模仿人的行为，用多一些的时间思考，或者告诉测试者它算不出来，这样就增加了其被视为人而非机器的概率，关于道德问题亦是如此。其次，有时候人工智能给出了道德的回答，但我们却无从知晓其道德推断的过程，况且即便能够做出德性的推论，也未必会带来德性的行为。人工智能如何认知环境，人工智能又具备哪些可以选择的行动，这些都应该是透明公开的。最后，如今越来越多的生产生活领域会有人工智能的身影，即便是弱人工智能也会带来道德冲击，如果所谓的道德图灵测试这一概念站不住脚，那么用它来作为全行业衡量人工智能道德与否的标准，就会很成问题。阿诺德和舒茨故而主张，应该采用系统查证的方法，确保自动化系统的设计是受控的、可追溯的，在系统设计之初和过程中，就将道德观念注入其中，而不是让它们应试一般地在已经知道肯定会得到允准和点头的答案中选择，实则无法查证它们决策的流程。系统查证是要查明机器为什么没有采取特定的反应，这种选择是建立在什么样的逻辑链上的，它又是如何对决策的情境进行评估的，这样就远比得到一个具有道德推论感的答案要可靠得多，也对设计提出了要求。[\[29\]](#txt003.xhtml#footnote_content_txt003_29)


    系统查证并不解决自动系统的道德主体性问题，也不能提供令所有人满意的高尚解决方案。比如一辆无人驾驶汽车应当选择撞死路边的一个孩童，还是让坐在车里的车主牺牲生命，这抉择显然是进退维谷，但是它至少能够帮助我们更好地、更充分地探索伦理和道德准则，带领人工智能向更稳健的方向前进。目前美国学界有人主张，人工智能若要与价值观结合，结合的方式可以有至少两种：其一，是符合普世人权价值观的人工智能。世界各地虽然文化不同，价值取向多元，但是还是有一些关乎人生存之根本的理念是共享的，例如对温饱和安全的追求，对肉体免于痛苦和劳役的追求，人工智能应当基于这些普遍原则来构造；其二，是依据社会选择理论（social
    choice theory），将单个的价值观点以特定方式集合起来，形成一种特定的、自下而上的共识。人的偏好未必反映人的真实所愿，对个人利益最大化的追逐又会与公平分配的道德原则相抵触，所以将道德计算融入人工智能的设计当中，或可缓解这些矛盾。抑或设计投票环节，交由人工智能来平衡并统合多样化的利益诉求，形成一种基于算法的道德新共识。[\[30\]](#txt003.xhtml#footnote_content_txt003_30)


    在现实生活中，公众其实已经逐渐形成了对于人工智能道德能动性的常识式判断。如果人工智能在现实生活场景中犯了错，人们究竟是会怪人工智能的算法，还是怪使用算法的人呢？密苏里科技大学心理科学系的单克和德桑提（Daniel
    B.Shank & Alyssa DeSanti）就此问题展开了一项调研，他们在线向321名被试者发放了问卷，调查他们如何评价7件真实发生的人工智能的道德失误，亦即归咎于谁，人还是机器。这7个事件分别是：①算法根据种族偏见误判罪犯的再犯概率；②用搜索引擎搜索“大猩猩”后显示出黑人女性图片；③护照照片识别算法将亚裔照片误认为是闭着眼的；④在线选美程序选出的都是浅肤色的女性；⑤在儿童的应用软件中推送色情暴力广告；⑥推特聊天机器人使用种族蔑称和支持法西斯的言论；⑦年轻女孩尚未告知家人怀孕就被商家寄来的优惠券泄露。被试者如果认为此事件有违道德原则，那么他们会进而被问及各个行为主体（组织者、使用者、人工智能算法或其开发者等）该承担多少责任（从1到5），再继而被问“人工智能是否有自己的意识”，“多大程度上具有动机”等（从1到5）。调查发现，如果被试者认为人工智能算法牵涉其中，那么认为该事件有违道德原则的比例会有所增加，会从30％增加到37％；而如果人工智能卷涉其中的话，那么其使用者也会被更多归咎，这证明当被调查者自己能够理解人工智能的运作规律时，他/她会认为事件中的使用者也是可以理解人工智能的，知错犯错故而罪加一等。同时调查表明，无论事件是否有违道德原则，绝大多数被试者不认为人工智能有自己的想法。[\[31\]](#txt003.xhtml#footnote_content_txt003_31)基于上述同一组真实事件，该研究团队展开了另一项调研。他们将事件中的决策结构分为4种：①完全由人工智能；②完全由人；③由人监管的人工智能；④人工智能向人提供建议。通过对453名被试者的调查，该团队发现4种决策结构的不同并不能显著改变上文中提到的归责选择。[\[32\]](#txt003.xhtml#footnote_content_txt003_32)


    ## 把伦理融入人工智能设计之初


    一些初步的研究已经发现，当人们意识到人工智能在事件中发挥了某种作用时，该事件中的道德困境会遭到更多人的检视。之所以会如此，并不是因为人们认为人工智能具有自己的想法了所以十分危险，而更像是人工智能将道德法则对象化，使之更容易被探讨。一来它并不直接牵涉具体的人，减少了道德讨论中的一重伦理阻碍；二来它以算法的方式呈现道德，使之变得可追溯、可查证、可修正，增加了人们改善其道德实践的动力，毕竟改善机器的行为要比改善人性要可操作得多。正如杜严勇所说，哲学语言的模糊性与计算机程序的准确性之间存在天然的矛盾。[\[33\]](#txt003.xhtml#footnote_content_txt003_33)上述例子所展现出的，是人们意图用计算机语言的精度来倒逼价值判断精度的典型范例。


    美国的大学和研究机构，已经开始注意到价值观融合在人工智能设计阶段的重要作用，在课程设计上也反映出了对这种迫切需求的回应。在人工智能研究重镇波士顿，哈佛大学教授格罗斯（Barbara
    Grosz）制定了一项“内嵌计算机道德”（Embedded EthiCS）计划，旨在让计算机科学专业的学生有更多机会在课程中接触到伦理问题，实现在每一个人机协动的系统中都能够置入伦理模组。在这样的课堂里，学生们会探讨：如果一个被通缉的人进入到无人车中，那么无人车是否有义务将门窗反锁直接驶往警局？如果司机要求无人车以80迈的时速超速行驶，无人车是否应该听从？万一出了事故，究竟是该由下达命令的人承担责任，还是由无人车制造商承担责任？现实生活中超速现象比比皆是，为什么到了无人车这里，超速就显得非常具有争议性呢？……在这些跨学科的追问中，并不存在唯一的标准答案，课程的目的旨在向未来的人工智能开发者们灌输伦理设计的必要性。[\[34\]](#txt003.xhtml#footnote_content_txt003_34)


    伦理多样性的教育或许更有必要。2014年一项研究指出，在对哲学没有预先知识的情况下，美国学生大多数是功利主义哲学的信徒，因为功利主义对愉悦和产出最大化的追求和美国的价值观天然一致。[\[35\]](#txt003.xhtml#footnote_content_txt003_35)但这种价值观模糊了道德的定义，不讲情境，只讲更高效的控制，这些都会引发人工智能设计中的问题。美国国家科学基金资助的一项跨院校、跨学科的研究项目就指出，合理的人工智能伦理课程设计，应当向学生传授三种伦理观——康德的道义论、米尔的功利主义和亚里士多德的德性伦理学。以广告推送系统为例，功利主义追求最有效、最精准、最高转化，道义论追求双方义务权利的对等，亦即强调用户对平台使用自己数据的许可权，德性伦理学则强调用户不轻易上当点击，但又会适度点击广告以维持平台的生存权。此三者并不互斥，也没有高下之分，而是为学生提供完整伦理学视野的角度。教育者应当有义务让从事人工智能相关行业的学生接触到多元的伦理学观点，在课堂上积极引用科幻电影和小说作为讨论的场景，将其打造成受学生欢迎的课程，从而令系统设计之初，德性便是在场的。[\[36\]](#txt003.xhtml#footnote_content_txt003_36)


    ## 自由及其代价：从表面选择到真实赋能


    无论是总统直选，还是新闻多元，美国价值观中的自由，其核心都在于选择。在不同的领域里，选择的逻辑基础又不尽相同，例如社会力量和信息的多元与市场生产能力的丰沛，两者就不能完全画上等号。美国传统价值观中的自由主义取向与消费主义很容易成为天然的盟友，因为人们在选购商品的时候，往往沉醉于挑选品牌时所体现的能动性，却不太考虑这些纷繁多样的品牌背后，是否出于同一个或者少数几个商家，错把生产营销能力的强大当作利益主体的多元。新的科技产品尤其容易落入这样的陷阱，人工智能也不例外。今日美国舆论对人工智能的追捧很大程度上出于对自由的不懈追求，事实上，科技本身并不具备这种属性，它仍然受制于特定的经济、社会、历史条件，需要人们理性面对。


    ### “自由”之内涵的跨世纪变迁


    以个人电脑和互联网为例。冷战的终结，经济的繁荣，为90年代的美国注入了自由主义强心剂。信息科技为人们畅想未来和自由表达提供了新平台，但这种解放性的力量并不全然来自于数字科学和信息技术本身，更多的是由多种历史合力促成并维持的，其中最重要的有三点：一是以西海岸无线电兴趣团体为代表的信息乌托邦意识形态，受当时“反文化运动”影响，推广新社群主义（New
    Communalism），主张用新科技实现自给自足，创造和谐平等的无国界线上空间。[\[37\]](#txt003.xhtml#footnote_content_txt003_37)二是东亚成为世界工厂，企业与企业横向的长期关系逐渐取代僵化的垂直整合，中枢化管理传统受到冲击，新自由主义思潮在美国勃兴。三是信息技术在走入民间后，为了迎合新兴市场需要，其营销方法也烘托了个人主义和自由主义氛围。80年代中期，IBM和苹果等企业日趋标准化的生产流程和视窗系统提供的直观的操作界面，为个人电脑降本增销，企业进而推广产品细分，例如著名iMac
    Flavours系列的多色外壳，为顾客提供了个性化的外观选择。


    今天，美国对人工智能的认知仍存有90年代信息科技潮时的浪漫化倾向，或者在科幻电影所限定的极端情境中对其加以探讨，容易忽视其技术和行业土壤的深刻变化。首先是信息的商品化。以搜索引擎和社交媒体为代表的新型科技公司，它们不生产信息，却是信息实际的管理人，靠广告支持运营。为了提升推送转化率，公司需要收集分析用户的搜索历史、日常信息和人际网络，形成更符合用户偏好的内容推荐。如今，推荐系统这一人工智能工具已广泛存在于线上线下。美国第二大零售巨头塔吉特（Target）就通过发放免费会员卡追踪客户消费习惯，用25件商品（营养品、无香味的香皂和乳液、婴儿浴巾等）作为推算一名女性是否怀孕的依据，以便定点定向投放优惠券。[\[38\]](#txt003.xhtml#footnote_content_txt003_38)其次，个人电子设备市场趋于饱和，严控成本再度成为争夺市场的有效工具。有迹象表明，不少新型科技公司正在走上垂直整合的老路，重新调整产业链布局，削弱了对横向长期关系的依赖。如流媒体企业网飞（Netflix），这家以租售影碟起家的科技公司于2007年开始提供线上观看，2013年开始垂直整合上游产业，吞并整条影视产业链，制作符合用户品味的原创内容，推荐系统与市场增长之间形成良性循环。而苹果公司为了使iPhone实现30～50美元的降价，一面与芯片制造商高通诉讼不断，一面致力于内部研发生产芯片，意在避免此前因与高通的官司引发区域性禁售风险，企业间的横向长期关系正在经受逆全球化的严峻考验。


    人工智能的普及便发生在这样的历史拐点，其概念虽然形成于20世纪中期，但人工智能之所以能成为商业潜力大、涉及人口众多的科技，正是得益于上述两大变化，即信息的商品化为人工智能提供了学习数据和反馈成果的新平台，个人电子设备的普遍化则为中枢化的处理、识别和学习提供源源不断的“原料”。无论是专家系统还是联结主义，人工智能在现阶段都离不开海量的数据的给养，不然纯粹一个函数拟合工具是没有商业价值的，也不会产生社会效应。从这个意义上说，人工智能虽然具有赋能机器解放人类的美好愿景，但却未必总是与人对自由的追求相一致，尤其是在消费之外的领域。


    数据隐私的自由便是其一。9·11事件之后，《爱国者法案》为国家安全局监听监控大开绿灯，其对象分布于美国境内外，数以百万计。国家安全局称他们只采集手机的“元数据（metadata）”，具体通话内容并未窥听，但有数据安全专家指出，数据和元数据的差别不过是内容和语境而已。当绝大多数人口都被置于监听之下，仅凭元数据，即通话地点、对象、时长、频度等，就能完整地勾画出个人的社交地图。[\[39\]](#txt003.xhtml#footnote_content_txt003_39)大型科技公司用人工智能协助情报机构分析海量信息。以2013年3月8日起的一个月时间为例，美国国家安全局下属的Global
    Access Operation单元就从美国电信系统上的30亿次电话通话和电子邮件中采集信息。斯诺登曝光的“棱镜计划（PRISM）”显示，大型企业如谷歌、苹果、微软等皆被要求提供用户数据信息。[\[40\]](#txt003.xhtml#footnote_content_txt003_40)由此可见，无国界线上空间的两大支柱，即跨国生产链和信息乌托邦，都已出现动摇，无法再支撑20世纪末盲目乐观的科技自由主义情绪。


    自由意志的发展受阻也是一例。人工智能代劳决策的普遍应用能增加效率，但也会削弱人的反思精神，导致被动性、情感疏离、能动性降低、责任感降低、无知无助等。最简单的例子就是美国网民对流媒体网站视频推荐和社交媒体新闻推荐的依赖，大量网民已经将自己的观影品位完全交给自动化系统来塑造，推荐什么看什么，而不再自己手动探索，或者根据曾经的精英守门人的推荐沿着影片类型或导演成长的线索搜索，而是把欲望的放大和快感的提升作为信息摄取的唯一目标，为此甚至不惜牺牲影视作品的艺术性和新闻的真实性与科学性。2020年新冠肺炎疫情中美国民众抗拒口罩疫苗的举动频现，背后就有大量不实、反科学的新闻与社评支撑。又例如，人们越来越习惯于在电商平台上选择礼物，只需要敲下“母亲节礼物”，就会出现一系列的商品，这些商品确实可能比个体自己所想的礼物更符合母亲的实际需要，毕竟这是基于大数据的人工智能决策。但是当人们把苦思冥想的工作交给人工智能时，当人们以为获得了时间和自由可以去从事更具投入产出比的活动时，他们其实也失却了一年一度与亲近之人沟通的机会，失去了真的仔细考察他人的生活，想他人之所想的机会。


    凡事都由机器代劳更为致命的代价，就是工作岗位的消失，还有人对自身价值的再审视与再定义。每一次产业革命，新科技所带来的工作岗位总比其摧毁的岗位要多，这使得美国社会对于进步的期待不会因为鲁德分子捣乱而熄灭。皮尤研究中心2014年的一份调研显示，近一半的受访者认为，人工智能即将带来的产业革命和过去不会有太大的差别，劳动力市场的发展仍然是线性的。[\[41\]](#txt003.xhtml#footnote_content_txt003_41)但是，如果我们仔细观察劳动性质的构成就会发现，人工智能带来的威胁不同于从前，不但重复性高的体力劳动面临被替代的可能，就连认知、互动、分析类的脑力劳动也面临不同程度的威胁，这不是过去几次产业革命中用机械和电气改变人类劳动和交流方式所能相提并论的。


    ### 全民基本收入或成为“软着陆”方案

    '
  trans: '

    The New York Times once reported that the tech company Nest (later acquired by
    Google) launched a residential temperature-control AI system in 2015. This system
    would spend a week observing the people inside the home, noting their behavioral
    routines and temperature preferences; it also possessed motion detection sensors
    to know if anyone was home. When the house was empty, it would enter energy-saving
    mode; when occupied, it would adjust the temperature to suit the owner''s preferences.
    Now, suppose the owner prefers to set the temperature around 22°C (71.6°F) in
    summer, rather than the commonly recommended 26°C (78.8°F), and prefers to maintain
    temperature control 24/7, regardless of whether anyone is home. When the AI system
    is instructed to operate this way, should it respect the user''s preference, or
    a higher-order virtue conducive to energy conservation and environmental protection?
    [\[25\]](#txt003.xhtml#footnote_content_txt003_25) The core issue here is what
    nature of values AI should ultimately follow. When we issue commands to AI, by
    what standard should it operate? According to my explicit instructions? According
    to my expressed intent? According to my revealed preferences? According to preferences
    based on reason and information? According to the goal of maximizing my objective
    interests? Or according to individual or societal values?


    This reveals the conflict between two value principles: Benthamite utilitarianism
    and Kantian universal moral law. Scholars have pointed out that under neither
    of these does AI itself possess the conditions to be a moral agent. For instance,
    Kantian deontology requires both moral norms to delimit the trajectory of action
    and the motivation to exercise moral action. Take instinct, for example: instinct
    drives behavior unconsciously, driven by emotion, requiring socialized training
    to form—machines cannot achieve this. If we use communitarian theory to explain
    moral motivation, machines stand even less chance of passing, because a person
    as a moral agent must be recognized as such by other members of society before
    they can act in that capacity. If AI merely practices moral behavior through imitation,
    it lacks subjectivity; this cannot be solved simply by using an "emotion module"
    to quantify emotional expression. [\[26\]](#txt003.xhtml#footnote_content_txt003_26)


    Some argue that a clear definition is needed regarding whether AI possesses morality.
    Historically, this is not without conception; this test, still residing in the
    conceptual realm, is called the "Moral Turing Test." The Moral Turing Test essentially
    approximates the principle of the Turing Test, requiring an automated system to
    learn to imitate human moral standards for decision-making. [\[27\]](#txt003.xhtml#footnote_content_txt003_27)
    The reason this concept has long failed to be put into practice is that experts
    cannot reach a consensus on which ethics should be used to morally judge AI. Scholars
    have pointed out that to circumvent this dilemma of choice, one might limit the
    human-machine dialogue in the Turing Test to moral topics. If a human cannot distinguish
    whether the interlocutor is human or machine, the machine can be regarded as an
    "Artificial Moral Agent"; or, instead of language, use action to judge—see if
    the machine''s actions can be distinguished from a human''s. If they cannot be
    distinguished, the machine passes the Moral Turing Test. [\[28\]](#txt003.xhtml#footnote_content_txt003_28)


    Thomas Arnold and Matthias Scheutz of the Tufts University Human-Robot Interaction
    Laboratory pointed out that using such a test to decide if AI is moral merely
    induces it to give deceptive answers to pass, which is actually harmful. First,
    you cannot judge how much of a role imitation plays. For example, when asked complex
    multiplication or division, a machine may possess the ability to answer instantly,
    but it can imitate human behavior by taking more time to "think," or telling the
    tester it cannot calculate, thereby increasing the probability of being perceived
    as human rather than machine; the same applies to moral questions. Second, sometimes
    AI gives a moral answer, but we have no way of knowing its moral reasoning process;
    moreover, even if it can make virtuous inferences, it does not necessarily lead
    to virtuous actions. How AI perceives the environment and what actions it has
    available to choose from should be transparent and open. Finally, today AI appears
    in more and more production and life domains; even weak AI brings moral shocks.
    If the concept of the Moral Turing Test does not hold water, using it as a standard
    for the whole industry to measure AI morality is problematic. Arnold and Scheutz
    therefore advocate for the method of system verification, ensuring that the design
    of automated systems is controlled and traceable, injecting moral concepts at
    the very beginning and throughout the design process, rather than letting them
    choose answers like in an exam where they already know which answers will get
    approval and nods, while their decision-making processes remain unverifiable in
    reality. System verification aims to ascertain why the machine did not take a
    specific reaction, on what logical chain this choice was based, and how it assessed
    the decision context; this is far more reliable than obtaining an answer that
    merely feels like moral reasoning, and it places demands on the design. [\[29\]](#txt003.xhtml#footnote_content_txt003_29)


    System verification does not solve the problem of the moral agency of automated
    systems, nor does it provide a noble solution satisfying everyone. For instance,
    whether a self-driving car should choose to hit a child on the roadside or sacrifice
    the owner sitting inside is an obvious dilemma, but it at least helps us explore
    ethical and moral norms better and more fully, guiding AI toward a more robust
    direction. Currently, some in US academia advocate that if AI is to align with
    values, there are at least two ways to combine them: First, AI that conforms to
    universal human rights values. Although cultures differ globally and value orientations
    are diverse, there are still some fundamental ideas concerning human survival
    that are shared, such as the pursuit of food, clothing, and safety, the pursuit
    of freedom from physical pain and forced labor; AI should be constructed based
    on these universal principles. Second, based on social choice theory, aggregate
    individual value viewpoints in a specific way to form a specific, bottom-up consensus.
    Human preferences do not necessarily reflect true desires, and the pursuit of
    maximizing individual interest conflicts with the moral principle of fair distribution;
    therefore, integrating moral calculation into AI design may alleviate these contradictions.
    Or perhaps design a voting mechanism, entrusting AI to balance and integrate diverse
    interest demands, forming a new algorithm-based moral consensus. [\[30\]](#txt003.xhtml#footnote_content_txt003_30)


    In real life, the public has actually gradually formed a commonsense judgment
    on the moral agency of AI. If AI makes a mistake in a real-life scenario, do people
    blame the AI''s algorithm, or the person using the algorithm? Daniel B. Shank
    and Alyssa DeSanti of the Department of Psychological Science at Missouri University
    of Science and Technology conducted a survey on this issue. They distributed questionnaires
    online to 321 participants, investigating how they evaluated 7 real-life AI moral
    lapses—specifically, who to blame, human or machine. The 7 incidents were: ① Algorithm
    misjudges criminal recidivism probability based on racial bias; ② Searching "gorilla"
    on a search engine displays images of Black women; ③ Passport photo recognition
    algorithm misidentifies Asian photos as having closed eyes; ④ Online beauty pageant
    program selects only light-skinned women; ⑤ Pornographic and violent ads pushed
    in children''s apps; ⑥ Twitter chatbot uses racial slurs and pro-fascist rhetoric;
    ⑦ Young girl''s pregnancy leaked to family by merchant''s coupons before she told
    them. If participants believed an event violated moral principles, they were further
    asked how much responsibility each actor (organizers, users, AI algorithms or
    their developers, etc.) should bear (1 to 5), and then asked "Does AI have its
    own consciousness?" "To what extent does it have motives?" (1 to 5). The survey
    found that if participants believed the AI algorithm was involved, the proportion
    judging the event as morally violating increased, from 30% to 37%; and if AI was
    involved, its users were also blamed more. This proves that when respondents themselves
    understand the operating rules of AI, they believe the users in the event could
    also understand the AI, and thus knowing the wrong and doing it anyway constitutes
    aggravated culpability. Simultaneously, the survey indicated that regardless of
    whether the event violated moral principles, the vast majority of participants
    did not believe AI has its own thoughts. [\[31\]](#txt003.xhtml#footnote_content_txt003_31)
    Based on the same set of real events, the research team conducted another survey.
    They categorized the decision structures in the events into 4 types: ① Fully by
    AI; ② Fully by human; ③ Human-supervised AI; ④ AI advising human. Through a survey
    of 453 participants, the team found that the differences in these 4 decision structures
    did not significantly change the attribution choices mentioned above. [\[32\]](#txt003.xhtml#footnote_content_txt003_32)


    ## Integrating Ethics into the Initial Design of AI


    Some preliminary studies have found that when people realize AI played a role
    in an event, the moral dilemma in that event undergoes scrutiny by more people.
    The reason is not that people think AI has its own thoughts and is therefore very
    dangerous, but rather that AI objectifies moral laws, making them easier to discuss.
    On the one hand, it does not directly involve specific individuals, reducing an
    ethical barrier in moral discussion; on the other hand, it presents morality in
    an algorithmic way, making it traceable, verifiable, and correctable, increasing
    people''s motivation to improve its moral practice—after all, improving a machine''s
    behavior is far more operable than improving human nature. As Du Yanyong said,
    there is a natural contradiction between the vagueness of philosophical language
    and the precision of computer programs. [\[33\]](#txt003.xhtml#footnote_content_txt003_33)
    The examples above demonstrate a typical case of people intending to use the precision
    of computer language to force the precision of value judgments.


    US universities and research institutions have begun to notice the important role
    of value integration in the AI design phase, reflected in curriculum design responding
    to this urgent need. In Boston, an AI research hub, Harvard Professor Barbara
    Grosz formulated an "Embedded EthiCS" program, aiming to give computer science
    students more opportunities to encounter ethical issues in courses, realizing
    the embedding of ethics modules in every human-AI collaborative system. In such
    classrooms, students discuss: If a wanted person enters a driverless car, does
    the car have an obligation to lock the doors and drive straight to the police
    station? If a driver demands the car speed at 80 mph, should the car obey? If
    an accident occurs, who is responsible—the person giving the order, or the car
    manufacturer? Speeding is ubiquitous in real life; why does it become highly controversial
    when it comes to driverless cars? ... In these interdisciplinary inquiries, there
    is no single standard answer; the course aims to instill the necessity of ethical
    design in future AI developers. [\[34\]](#txt003.xhtml#footnote_content_txt003_34)


    Education on ethical diversity may be even more necessary. A 2014 study pointed
    out that without prior knowledge of philosophy, most American students are believers
    in utilitarian philosophy, because utilitarianism''s pursuit of maximizing pleasure
    and output aligns naturally with American values. [\[35\]](#txt003.xhtml#footnote_content_txt003_35)
    But this value orientation blurs the definition of morality, ignores context,
    and focuses only on more efficient control—all of which trigger problems in AI
    design. A cross-institutional, interdisciplinary research project funded by the
    US National Science Foundation pointed out that a reasonable AI ethics curriculum
    should teach students three ethical views—Kant''s deontology, Mill''s utilitarianism,
    and Aristotle''s virtue ethics. Take an ad push system as an example: utilitarianism
    pursues the most effective, precise, and highest conversion; deontology pursues
    the equivalence of obligations and rights of both parties, i.e., emphasizing the
    user''s right to permit the platform''s use of their data; virtue ethics emphasizes
    that users should not be easily tricked into clicking, but should click ads moderately
    to maintain the platform''s right to survive. These three are not mutually exclusive,
    nor is there a hierarchy; they provide angles for a complete ethical perspective.
    Educators have an obligation to expose students in AI-related fields to diverse
    ethical viewpoints, actively cite sci-fi movies and novels as discussion scenarios
    in class, build them into popular courses, so that virtue is present from the
    very beginning of system design. [\[36\]](#txt003.xhtml#footnote_content_txt003_36)


    ## Freedom and Its Price: From Superficial Choice to True Empowerment


    Whether it is direct presidential elections or media pluralism, the core of freedom
    in American values lies in choice. In different fields, the logical basis of choice
    differs; for example, the diversity of social forces and information cannot be
    fully equated with the abundance of market production capacity. The liberal tendency
    in traditional American values easily becomes a natural ally of consumerism, because
    when people shop, they are often intoxicated by the agency reflected in choosing
    brands, yet rarely consider whether the dazzling array of brands behind them originates
    from the same or a few merchants, mistaking powerful production and marketing
    capabilities for the diversity of interest subjects. New tech products are especially
    prone to falling into this trap, and AI is no exception. Today, the US public
    opinion''s pursuit of AI largely stems from the relentless pursuit of freedom;
    in fact, technology itself does not possess this attribute—it is still constrained
    by specific economic, social, and historical conditions, requiring people to face
    it rationally.


    ### The Cross-Century Evolution of the Connotation of "Freedom"


    Take personal computers and the Internet as examples. The end of the Cold War
    and economic prosperity injected a strong dose of liberalism into 1990s America.
    Information technology provided a new platform for people to envision the future
    and express themselves freely, but this liberating force did not stem entirely
    from digital science and information technology itself; it was promoted and sustained
    by a confluence of historical forces, the three most important being: First, the
    information utopian ideology represented by West Coast radio hobbyist groups,
    influenced by the "counterculture movement" at the time, promoted New Communalism,
    advocating the use of new technology to achieve self-sufficiency and create a
    harmonious, equal, borderless online space. [\[37\]](#txt003.xhtml#footnote_content_txt003_37)
    Second, East Asia became the world''s factory; long-term horizontal relationships
    between enterprises gradually replaced rigid vertical integration, centralized
    management traditions were challenged, and neoliberal thought flourished in the
    US. Third, after information technology entered the civilian sphere, to cater
    to emerging market needs, its marketing methods also fostered an atmosphere of
    individualism and liberalism. In the mid-1980s, increasingly standardized production
    processes of companies like IBM and Apple, and the intuitive operating interfaces
    provided by window systems, reduced costs and boosted sales of personal computers;
    companies further promoted product segmentation, such as the famous iMac Flavours
    series with colorful shells, offering customers personalized appearance choices.


    Today, the US perception of AI still retains the romanticized tendency of the
    1990s IT boom, or discusses it within the extreme scenarios defined by sci-fi
    movies, easily ignoring the profound changes in its technological and industrial
    soil. The first is the commodification of information. Represented by search engines
    and social media, new tech companies do not produce information but are its actual
    managers, operating on ad support. To improve push conversion rates, companies
    need to collect and analyze users'' search history, daily information, and social
    networks to form content recommendations more aligned with user preferences. Today,
    recommendation systems—this AI tool—are widely present online and offline. The
    second-largest US retailer, Target, tracks customer consumption habits by issuing
    free membership cards, using 25 items (nutritional supplements, unscented soap
    and lotion, baby towels, etc.) as a basis to calculate whether a woman is pregnant,
    in order to send targeted coupons. [\[38\]](#txt003.xhtml#footnote_content_txt003_38)
    Second, the personal electronic device market is tending toward saturation, and
    strict cost control has again become an effective tool to compete for the market.
    Signs indicate that many new tech companies are returning to the old path of vertical
    integration, readjusting industrial chain layouts, weakening reliance on long-term
    horizontal relationships. Take streaming giant Netflix: this tech company, starting
    from DVD rental/sales, began offering online viewing in 2007, and in 2013 began
    vertically integrating upstream industries, swallowing the entire film and TV
    industry chain, producing original content tailored to user tastes, forming a
    virtuous cycle between recommendation systems and market growth. Apple, to achieve
    a $30–50 price cut for the iPhone, litigates incessantly with chipmaker Qualcomm
    on one hand, while striving to internally R&D and produce chips on the other,
    aiming to avoid regional sales ban risks caused by previous lawsuits with Qualcomm;
    horizontal long-term relationships between enterprises are undergoing severe tests
    from de-globalization.


    The popularization of AI occurs at such a historical inflection point. Although
    its concept formed in the mid-20th century, AI has become a technology with huge
    commercial potential and involving a vast population precisely due to the two
    major changes above: the commodification of information provided AI with a new
    platform for learning data and feedback results, and the ubiquity of personal
    electronic devices provided a steady stream of "raw materials" for centralized
    processing, recognition, and learning. Whether expert systems or connectionism,
    AI at this stage is inseparable from the sustenance of massive data; otherwise,
    a pure function-fitting tool has no commercial value and would not produce social
    effects. In this sense, although AI possesses the beautiful vision of empowering
    machines to liberate humans, it does not necessarily always align with the human
    pursuit of freedom, especially in areas beyond consumption.


    Data privacy freedom is one such example. After 9/11, the *Patriot Act* gave the
    NSA a green light for wiretapping and surveillance, targeting millions inside
    and outside the US. The NSA claimed they only collected phone "metadata," not
    the specific call content, but data security experts pointed out that the difference
    between data and metadata is merely content and context. When the vast majority
    of the population is placed under surveillance, metadata alone—call location,
    contact, duration, frequency—can completely map an individual''s social graph.
    [\[39\]](#txt003.xhtml#footnote_content_txt003_39) Large tech companies use AI
    to assist intelligence agencies in analyzing massive information. For the one-month
    period starting March 8, 2013, the NSA''s Global Access Operations unit alone
    collected information from 3 billion phone calls and emails on the US telecommunications
    system. The "PRISM" program exposed by Snowden showed that large enterprises like
    Google, Apple, and Microsoft were all required to provide user data. [\[40\]](#txt003.xhtml#footnote_content_txt003_40)
    Thus, the two pillars of the borderless online space—transnational production
    chains and information utopianism—have both shaken, no longer able to support
    the blindly optimistic techno-liberal sentiment of the late 20th century.


    The hindered development of free will is another example. The widespread application
    of AI decision-making proxies can increase efficiency, but also weakens the human
    spirit of reflection, leading to passivity, emotional alienation, reduced agency,
    reduced responsibility, ignorance, and helplessness. The simplest example is the
    dependence of US netizens on video recommendations from streaming sites and news
    recommendations from social media; a large number of netizens have completely
    handed over their viewing tastes to automated systems to shape—watch whatever
    is recommended, no longer exploring manually, or searching along clues of film
    genres or director growth based on past elite gatekeepers'' recommendations—but
    taking the amplification of desire and the enhancement of pleasure as the sole
    goal of information intake, even at the expense of the artistry of film/TV works
    and the truthfulness and scientificity of news. The frequent resistance of the
    US public to masks and vaccines during the 2020 COVID-19 pandemic was supported
    by a large amount of fake, anti-scientific news and commentaries. Another example:
    people are increasingly used to choosing gifts on e-commerce platforms; just type
    "Mother''s Day gift," and a series of products appears. These products may indeed
    fit the mother''s actual needs better than what the individual thought of, as
    this is AI decision-making based on big data. But when people hand over the painstaking
    work of thinking to AI, when they think they have gained time and freedom to engage
    in higher ROI activities, they actually lose the annual opportunity to communicate
    with loved ones, the opportunity to truly examine the other''s life, to think
    what the other thinks.


    The deadlier price of having machines do everything is the disappearance of jobs,
    and the re-examination and redefinition of one''s own value. Every industrial
    revolution has brought more new jobs than those destroyed by new technology, keeping
    American society''s expectation of progress from being extinguished by Luddites.
    A 2014 Pew Research Center survey showed nearly half of respondents believed the
    coming AI-driven industrial revolution would not differ much from the past, and
    the labor market would develop linearly. [\[41\]](#txt003.xhtml#footnote_content_txt003_41)
    However, if we closely observe the composition of labor nature, we find the threat
    brought by AI is different from before: not only highly repetitive physical labor
    faces replacement, but cognitive, interactive, and analytical mental labor also
    faces varying degrees of threat—this is incomparable to the past few industrial
    revolutions that changed human labor and communication methods through mechanics
    and electricity.


    ### Universal Basic Income May Become a "Soft Landing" Solution

