    # Epilogue　Common Concern


    Human history is a history of invention; the refinement and development of skills
    mark every step of progress. Yet no technology possesses the potential to replace
    human labor quite like the artificial intelligence we see today. The so-called
    "**weak artificial intelligence**" already in application is not weak at all.
    Robots need not exist in the forms depicted in 20th-century science fiction films;
    they appear in every aspect of our social lives in various volumes and forms,
    functioning **openly or covertly**, and have already brought revolutionary changes
    to our lives.


    The distance between machines and humans is no longer one between science fiction
    and reality. After analyzing the impact of artificial intelligence on values in
    the United States, Europe, Japan, and China, we can see that despite differing
    socio-cultural traditions across countries and regions, they contain many **common
    elements**. How "**humanity**" should be positioned within the framework of new
    economic forms, social organizations, and cultural judgments has become a **shared
    concern** worldwide, a problem of profound practical significance. From the historical
    evolution, it is evident that human values also progress with social advancement.
    Currently, how to achieve reconciliation between humans and machines within respective
    value frameworks relies on the unique cultural paths of each country and region.
    In facing the value challenges brought by machines, how nations that value AI
    development unite and collaborate, seek common ground while reserving differences,
    and find the **greatest common divisor of values** concerns the **shared future
    of humanity as a collective**. Therefore, we need to pay **high common attention**
    to the following issues:


    ## 1. People-Centered Approach


    The core of artificial intelligence is **human-machine integration**. Across the
    world, governments, enterprises, and the public have recognized that human-machine
    integration is not limited to physical forms such as brain-computer interfaces
    and intelligent prosthetics; it is more **contextualized, guerrilla-style integration**.
    As application scenarios requiring reliance on machines and large-scale data computing
    increase, human life will coexist with machines for long periods, gradually becoming
    one. This human-machine integration is **social**; its influence is not confined
    to segments of the industrial chain but exists widely at the consumption end and
    in daily life. The universality of algorithms in application further amplifies
    the social impact of artificial intelligence.


    The ethical challenge brought by AI is the **balance between human rights and
    the rights of machines and their owners**. Historically, developed countries leading
    in industrialization underestimated the social effects of the industrial revolution,
    failed to clarify the relationship between labor and value from a value perspective,
    and lacked supporting policies and systems. Wealth rapidly concentrated in the
    hands of those holding technology and capital. Sharp wealth contradictions in
    some developed countries and the rise of anti-intellectualism are precisely the
    consequences of the machine side benefiting excessively in the early human-machine
    relationship.


    Unlike the confines of a factory, the value impact brought by today''s AI occurs
    **in full view of the public**; a new value system will also gradually take shape
    through public participation and co-governance. The reshaping of social values
    by AI **must fundamentally aim to enhance the digital well-being of the public**.
    If AI serves as a banner for financing, it should accept the **moral review of
    the public in the public sphere**. This is the economic foundation of values co-built
    by all people through AI, and it plays a decisive role. Only by integrating with
    social governance at a higher level to improve people''s lives can AI be widely
    accepted and used.


    Countries worldwide have shown a **common trend toward a people-centered approach**
    in AI governance. In the US, the profit model of consumers trading personal information
    for convenience has shown fatigue, and countermeasures are gradually emerging;
    in Europe, value norms centered on **human rights** have become a cultural strategy
    to constrain and catch up with other AI powers; in Japan, an aging population
    has defined the future application of AI; in China, AI is integrating into traditional
    **harmonious values**, seeking **dynamic balance between humans and machines**
    in motion. All these contain a re-examination by the social public of the legitimacy
    and rationality of the new generation of AI.


    Although cultural traditions and economic paths differ, all countries attempt
    to reinterpret and reposition the **socio-economic coordinates of "humanity"**
    from different angles. The happiness, security, equality, freedom, transparency,
    trust, and other values pursued by humans in traditional social life must also
    be reflected and guaranteed under the background of the digital economy—this is
    the true meaning of **digital well-being**. Current AI development must emphasize
    a **people-centered approach**, emphasize the **comprehensive enhancement of digital
    well-being**, enrich its connotation in practice, and gradually change traditional
    concepts. Only then can AI development be unified with the solution of long-standing
    social problems, benefiting humanity.


    ## 2. Harmony in Diversity


    Computer languages know no borders; the essence of human-machine dialogue is **non-cultural**.
    There was once a view that the popularization of AI would achieve a "**world of
    great harmony**" in cyberspace. Currently, AI does provide a technical handle
    for cross-border discussions on value ethics; cultural prejudices and preconceptions
    are no longer purely cultural issues. However, the relationship between AI and
    human society differs from traditional **technology-society relationships**; its
    application mode determines that **AI itself is social in nature**. Therefore,
    cultural differences across regions **cannot be ignored**.


    This book''s research indicates that values may exhibit some similar trends of
    change across regions due to AI''s extensive intervention in social life, but
    this **does not imply cultural assimilation**. At present, AI remains at the level
    of a **data tool**, lacks autonomous consciousness, and cannot participate in
    cultural creation as a **moral subject**. In other words, the development mode
    of AI in each specific country still largely follows the existing value system.
    Therefore, at the value level, we still need to uphold the principle of **harmony
    in diversity** and avoid extremes.


    Furthermore, the current industrial form of AI determines that its development
    must adhere to the principle of **value pluralism**. Commercial AI cannot do without
    constantly seeking new application scenarios and new user groups. Regional application
    scenarios based on specific cultural customs will ultimately not stop at a specific
    region; instead, they will provide references for scenarios in other parts of
    the world and provide experience for the entire AI industry, creating new growth
    points and providing the **intellectual liberation** for AI to better benefit
    the world. Seeking more usage modes against the background of different values
    is also beneficial for AI development itself.


    In the early stage of an industry, one more choice means one more potential development
    point and possibility. AI currently requires concerted global collaboration. In
    a world of diverse cultures and values, machine learning needs to follow the principle
    of **pluralistic interests** for AI development to achieve **pluralistic benefits**.
    For example, in April 2016, the British Standards Institution (BSI) released the
    *Ethical Design and Application Guidelines for Robots and Systems*, mentioning
    that R&D enterprises should enhance robots'' respect for **cultural diversity
    and pluralism**. To this end, countries and regions should, on the basis of respecting
    different cultural customs and value orientations, use AI as a handle to seek
    broader common concerns, using new technical means as keys to unlock century-old
    problems in human social life.


    ## 3. Community with a Shared Future for Mankind


    Humanity''s unchanging pursuit of a better life lies in **a hundred flowers blooming**.
    From the perspective of values, AI concerns the survival form of humanity on the
    next technological plateau and the daily life of peoples worldwide. AI **must
    ensure** that in the new technological ecology, their basic rights are protected,
    society trends toward fairness rather than the opposite, life becomes more convenient,
    but **not at the cost of sacrificing all social interaction**.


    Technological competition between nations is not a **single competitive relationship**.
    In this technological space full of opportunities and challenges, the destiny
    of humanity has long been **linked as one**. As a product of culture and a technological
    tool that shapes culture, AI should grow in a **pluralistic civilizational environment**,
    using **civilizational exchange to transcend civilizational barriers, civilizational
    mutual learning to transcend civilizational conflicts, and civilizational coexistence
    to transcend civilizational superiority**, allowing various values to become nutrients
    for AI and machine learning, promoting **harmonious, inclusive, and dialogic exchange**.


    Ethical challenges arising from AI in commercial and civilian use have provided
    a **united front** for all countries. Only by seeking more cooperation and communication
    at the technical level, ensuring that AI development in various countries proceeds
    in a relatively transparent and open political context, can we advance this technology
    for an **open, inclusive, universally beneficial, balanced, and win-win economy**.


    Today''s AI remains a **very loose concept**; its definition is broad, and its
    impact on values and the ensuing ethical effects require us to continuously observe,
    summarize, enrich, and update in practice. Admittedly, AI is still in its early
    stages; it is a long way off before it can "lighten our moral burden." Humanity
    will long remain in the **primary stage of growing together with AI**. Amidst
    the surging tide, instead of merely adapting, we should **write our judgments
    about the future into our values in advance**. On the future stage jointly built
    by humans and machines, **humanity must always remain the master of its own destiny**.


