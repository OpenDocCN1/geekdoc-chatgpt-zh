    # History of AI Development and Social Impact


    In 2006, driven by Hinton and his students, deep learning began to attract significant
    attention. With the proposal and application of various machine learning algorithms,
    particularly the advancement of deep learning technology, people hoped that machines
    could automatically acquire knowledge and achieve intelligence through the analysis
    of massive amounts of data. During this period, with the improvement of computer
    hardware capabilities and the development of big data analytics technology, the
    ability of machines to acquire, store, and process data improved substantially.
    In terms of contribution to practical applications, deep learning is perhaps the
    most successful research direction in the field of machine learning over the past
    decade. After 2010, deep learning technology made significant progress in knowledge
    understanding compared to previous shallow learning, driving astonishing breakthroughs
    in technologies such as speech recognition, image recognition, and natural language
    processing, and propelling artificial intelligence and human-computer interaction
    forward by leaps and bounds. AI capabilities in many specialized directions have
    surpassed humans, such as Go, Texas Hold''em, proving mathematical theorems, learning
    to automatically construct knowledge from massive data, recognizing speech, faces,
    and fingerprints, driving cars, and processing massive documents. Deep learning
    has brought a new wave of machine learning, attracting widespread attention from
    academia to industry, and leading to the arrival of the "Big Data + Deep Models"
    era, which in turn ushered in a new wave of AI development.


    Since the First Industrial Revolution, technological innovation has been the fundamental
    driving force of economic development. While focusing on the role of technology
    in long-term economic growth, people have also realized that not all technologies
    are of equal importance; only revolutionary technological advances can drive the
    transformation of human economy and society. Since the 1760s, the three industrial
    revolutions experienced by humanity were driven by mechanical technology, electrical
    technology, and information technology, respectively. In 2016, the World Economic
    Forum defined artificial intelligence as the cornerstone of the Fourth Industrial
    Revolution. [[1]](#txt002.xhtml#footnote_content_txt002_1) In 2017, a UN research
    report, *The Impact of the Technological Revolution on Labour Markets and Income
    Distribution*, pointed out that artificial intelligence, like steam technology
    and electrical technology, is a General Purpose Technology (GPT) used by humans
    to transform nature. [[2]](#txt002.xhtml#footnote_content_txt002_2) The climax
    of every industrial revolution is marked by the core technology driving it entering
    the stage of industrial mass production, characterized by standardization, automation,
    and modularization. The history of AI development shows that previous waves of
    AI development all encountered technical bottlenecks, making commercial applications
    difficult to implement, eventually falling back into a trough. However, the current
    new generation of AI already possesses strong generality; the technical ceiling
    and commercialization potential of this wave of AI are far higher than before,
    meaning it is ready to enter the stage of industrial mass production.


    ## From Macro to Micro: The Impact of AI on Social Development


    In 2018, consulting firm McKinsey released a report stating that by 2030, AI would
    create nearly $13 trillion in additional economic output globally, accounting
    for 1.2% of world GDP growth. [[3]](#txt002.xhtml#footnote_content_txt002_3) As
    the core driving force of a new round of industrial transformation, AI is having
    a profound impact on the world economy, social progress, and human life. With
    the deep integration of technologies such as the Internet of Things (IoT), big
    data, and cloud computing with intelligent algorithms, AI has shown broad application
    prospects in various industries. Relying on the massive sensory information brought
    by the IoT, AI is gradually evolving from computational intelligence to perceptual
    intelligence; relying on the verifiable foundation provided by big data, deep
    learning algorithms support computers in better simulating human-like characteristics;
    relying on the supercomputing power brought by cloud computing and super-powerful
    chips, AI development has a relatively solid physical foundation.


    AI has broad development prospects and can be used to improve fields such as consumption,
    healthcare, environment, security, and education, enhancing people''s well-being.
    Currently, AI has entered a comprehensive commercialization stage and is affecting
    all participants in traditional industries to varying degrees, changing the ecology
    of various industries and causing a comprehensive, three-dimensional impact on
    social development. The *Global AI Development White Paper (2019 Edition)* by
    the international accounting firm Deloitte points out that this transformation
    is mainly reflected in three levels. [[4]](#txt002.xhtml#footnote_content_txt002_4)
    The first level is industry transformation; the changes brought by AI cause fundamental
    changes in the upstream and downstream relationships of traditional industrial
    chains. The participation of AI leads to an increase in the types of upstream
    product providers, while users may also change due to changes in product attributes,
    transforming from individual consumers to enterprise consumers, or both. The second
    level is enterprise transformation; AI participates in enterprise management and
    production processes, and the trend of enterprise digitalization is increasingly
    obvious, with some enterprises having achieved relatively mature intelligent applications.
    These enterprises are able to collect and utilize multi-dimensional user information
    through various technical means, provide targeted products and services to consumers,
    and simultaneously optimize insights into development trends through data to meet
    consumers'' latent needs. The third level is labor transformation; the application
    of new technologies such as AI will improve information utilization efficiency
    and reduce the number of enterprise employees. In addition, the widespread application
    of robots will replace labor engaged in procedural work, leading to an increase
    in the proportion of technical and management personnel, and a change in the enterprise
    labor structure.


    Currently, AI is being embedded in key areas of society and the economy. The main
    application scenarios of the new generation of AI focus on a collection of industries
    with a certain scale of demand and relatively clear and feasible business models.
    Taking finance, healthcare, and education as examples, at the level of social
    application, the significant impact of AI is not manifested as replacing existing
    labor and capital, but as empowering them, enabling them to be utilized more effectively.


    In the financial field, centered on the continuous changes in consumer behavior
    and needs, AI has gradually replaced human customer service in some service areas.
    AI can enhance customer stickiness through technology, providing services such
    as precision marketing and push based on big data, customized products and services,
    and a broader ecosystem. The traditional financial service industry is facing
    reconstruction in all fields and links.


    In the medical field, against the social backdrop of an aging population, increasing
    chronic disease patients, scarce high-quality medical resources, and rising public
    medical costs, the application of medical AI will greatly simplify the current
    cumbersome medical treatment process and provide better solutions for humanity
    in many aspects such as resource optimization and technology improvement. Medical
    AI has been applied to the four major links of the medical industry chain: medical
    care, pharmaceuticals, medical insurance, and hospitals.


    In the field of education, unlike traditional education methods, intelligent education
    is based on the data generated by students in the five major links of "teaching,
    learning, practicing, evaluating, and testing," utilizing technologies such as
    image recognition, speech recognition, human-computer dialogue, multimodal behavior
    analysis, knowledge generation and expression, and simulated intelligent agents
    to generate personalized solutions and effective feedback suitable for each student.
    Through continuous data collection, tracking, and reconstruction, AI will significantly
    improve learning efficiency and change the education model.


    As an empowering technology, AI will continue to integrate with traditional industries,
    thereby better enhancing the latter''s level of informatization, digitalization,
    and intelligence, and promoting industrial transformation and upgrading. However,
    at the same time, in the process of becoming a new strategic high ground for countries
    around the world, the widespread application of AI has also brought a series of
    new challenges to human society in terms of laws and regulations, moral ethics,
    social governance, etc., which require high attention. Vincent C. Müller, President
    of the European Society for Cognitive Systems, believes that a cautious mindset
    should be maintained regarding the risk issues of AI: "If the intelligence of
    artificial systems surpasses that of humans, then humans will face risks"; the
    purpose of reflecting on AI risks is to "ensure that AI systems are beneficial
    to humans." He pointed out: "Previously, the focus was on philosophical and theoretical
    issues of AI related to cognitive science. Now, more and more attention is focused
    on risk and ethical issues." [[5]](#txt002.xhtml#footnote_content_txt002_5)


    AI is undergoing a critical turning point from quantitative change to qualitative
    change; the next step will increasingly display characteristics of wisdom, eventually
    permeating and affecting the life of every individual. In the future, AI may well
    become a master key, capable of unleashing the potential of human technology and
    tools, but it will inevitably bring unprecedented challenges to humanity.


    In what aspects will AI impact social development? In 2017, at the Beneficial
    AI conference held in Asilomar, California, Tesla CEO Elon Musk, DeepMind founder
    Demis Hassabis, and nearly a thousand experts in the fields of AI and robotics
    jointly signed the "Asilomar AI Principles" (23 principles), aiming to call on
    the world to strictly abide by these principles while developing AI, jointly safeguarding
    the future ethics, interests, and safety of humanity. The Asilomar AI Principles
    are among the most influential AI principles in recent years, comprehensively
    summarizing the social issues that AI may trigger (see Figure 2-1). The three
    major categories of issues are: Research Issues, Ethics and Values, and Long-term
    Issues, each of which is further subdivided into several specific issues. [[6]](#txt002.xhtml#footnote_content_txt002_6)


    ![img](img/txt002_1.jpg)


    Figure 2-1 Issues Raised by the Asilomar AI Principles


    It can be seen that the intervention of automated systems surpassing human intelligence
    in the development of various fields of society reflects the close connection
    between AI and human civilization. On the one hand, the development of AI promotes
    changes in social production and governance methods; on the other hand, new problems
    faced by social development reversely demand technical restrictions or upgrades
    of AI itself. AI may trigger many ethical, human rights, and legal issues worthy
    of deep thought at the individual, social, and national levels.


    For example, when sensors and AI are ubiquitous, enterprises are able to collect
    personal information uninterruptedly as people use digital devices and move between
    public and private spaces. In certain specific settings, such as hospitals and
    hotels, the collection of private information was originally extremely sensitive,
    but technologies such as image recognition and speech recognition have lowered
    the threshold for privacy leakage. A series of questions follow: Who owns personal
    data? In what way should data be shared? How to protect data in the face of increasingly
    severe cybersecurity attacks?


    Another example: AI may produce unconscious discrimination in the decision-making
    process. Because the real world contains various forms of racial discrimination,
    gender discrimination, and prejudice, the data input into algorithms may also
    carry these characteristics. And when machine learning algorithms learn these
    biased training data, they "inherit" the biases. The UN concluded, after collecting
    a large amount of strong evidence, that AI has exacerbated global inequality to
    a certain extent and enabled a small number of people to benefit from it. [[7]](#txt002.xhtml#footnote_content_txt002_7)


    Finally, AI-based automation will cause labor market polarization, and technologically
    underdeveloped developing countries will also be at a disadvantage in this wave
    of development, further widening the "digital divide" between countries. Some
    countries originally expected rapid population growth to drive the development
    of labor-intensive economies, but if a large amount of human labor is replaced
    by machines, new social unrest may even arise.


    ## From Local to Whole: AI and the Reshaping of Value Systems


    Israeli historian Yuval Noah Harari describes three distinct stages of AI development:
    Weak AI, Strong AI, and Super AI. [[8]](#txt002.xhtml#footnote_content_txt002_8)
    He predicts that the Super AI stage will appear in the 2040s–2060s, and the entire
    society will split into two major classes: the vast majority belonging to the
    "useless class," and a very small minority being the social elite. AI, built on
    the rapid development of biological science, information technology, and big data
    technology, may lead to the emergence of an intelligent society. In an intelligent
    society, the acquisition of recursive self-improvement capabilities by machine
    intelligence may lead to the ultimate "intelligence explosion." In the future,
    humanity as a whole will have value, but individuals will have no value; the system
    will find value in some individuals, but they may become a new species of superhumans.


    Will future society reshape the value system in multiple dimensions? First, with
    the widespread application of AI, human society will be unable to avoid two catastrophic
    shocks in the short term: persistent unemployment and an ever-widening wealth
    gap. As exemplified by the disruptive transformation cases in finance, healthcare,
    education, and other industries mentioned above, the large-scale use of AI is
    fundamentally changing the face of traditional industries. For contemporary people,
    the existence of counterparts equivalent to human intelligence is no longer science
    fiction, but a direction of modern scientific theory and technological endeavor,
    and this endeavor will cause human labor to be replaced on a large scale and universally;
    this vision is increasingly approaching reality. Against this background, all
    previous theories concerning human nature and rationality must be re-examined,
    to understand and recognize other possible intellectual capabilities from scratch.
    Furthermore, the popularization of AI poses a challenge to the Marxist Labor Theory
    of Value. The Labor Theory of Value is one of the cornerstones of Marxist economics;
    standing from the standpoint of the laborer, Marx proposed views such as "commodity
    value embodies humanity itself." When AI is applied on a large scale, the subject
    of labor is obviously replaced; although AI and its equipment are also created
    by human labor, when "unmanned factories," "unmanned supermarkets," "unmanned
    restaurants," and other "unmanned industries" appear in large numbers, we obviously
    need to fundamentally conduct in-depth research and reinterpretation of the Labor
    Theory of Value.


    Second, the policy formulation, R&D planning, application implementation, and
    other stages of AI inevitably reflect the values of the relevant subjects. On
    the one hand, data collection and the application of intelligent algorithms are
    not completely objective and unbiased. In the data selection, algorithm operation,
    and cognitive decision-making of AI and intelligent automated systems, the interests
    and value factors of relevant subjects inevitably permeate the definition of specific
    problems and the selection and acceptance of corresponding solutions. They may
    both reflect the interest considerations and value orientations of technology
    designers and executors, and affect the interest distribution and value realization
    of more stakeholders. [[9]](#txt002.xhtml#footnote_content_txt002_9) When a machine
    has multiple learnable parts, the learning algorithm faces the problem of responsibility
    localization. More complex learning machines can not only modify their own behavior
    patterns but also modify their own evaluation systems; at this time, the machine
    must also handle value issues. When multiple such machines cooperate in a non-centralized
    distributed manner, they need to handle evaluations between individuals in the
    group, i.e., ethics in a broad sense.


    For example, the United States lists understanding and addressing the ethical,
    legal, and social implications of AI as one of the eight major strategies in the
    *National Artificial Intelligence Research and Development Strategic Plan*, requiring
    research on how to represent and "encode" human values and belief systems as an
    important topic, establishing ethical AI, formulating acceptable moral reference
    frameworks, and achieving the overall design of AI systems that conform to ethical,
    legal, and social goals. In January 2020, the Center for a New American Security
    (CNAS) report *The American AI Century: A Blueprint for Action* explicitly mentions:
    although AI can bring incredible benefits to people in society, it also makes
    future malicious uses possible, such as launching sophisticated influence operations
    against democracies. The United States must ensure its leading position in AI
    and shape global norms of use in a manner consistent with democratic values and
    respect for human rights. The report recommends specific actions to ensure the
    US maintains its AI lead, promotes the development of standards consistent with
    US interests and values, and anticipates and responds to security challenges.


    The UK House of Commons released the *Robotics and Artificial Intelligence* report
    in 2016, stating that the UK should regulate the development of robotics and AI
    systems. The *Data Ethics Framework* released in January 2018 stated that data
    should be ensured to be used in a safe and ethical manner. The *UK AI Readiness,
    Willingness and Capability* report released in April 2018 proposed five overarching
    principles for AI guidelines, clarifying strategic issues the government needs
    to consider.


    The European Commission proposed in *Artificial Intelligence for Europe* to research
    and formulate new ethical guidelines for AI to address issues of fairness, safety,
    and transparency, and to defend European values. The European Group on Ethics
    in Science and New Technologies (EGE) proposed a set of basic ethical principles
    for AI development in its *Statement on Artificial Intelligence, Robotics and
    ''Autonomous'' Systems*. In 2018, the EU established the High-Level Expert Group
    on AI; in April 2019, the group released the *Ethics Guidelines for Trustworthy
    AI*, proposing the construction of human-centric AI and listing 7 key requirements
    that trustworthy AI systems should meet. In February 2020, the European Commission
    released the *White Paper on AI: A European Approach to Excellence and Trust*,
    believing that in the face of opportunities and challenges brought by AI, Europe
    needs to build an ecosystem of excellence and trust in AI. To achieve the goal
    of "excellence," European AI values and rules should be exported to the world,
    and the public sector should be promoted to apply AI. Promoting EU AI values to
    the world helps Europe achieve global AI leadership; therefore, EU international
    cooperation must be based on its own values and AI rules.


    On the other hand, AI applications such as synthetic intelligence and artificial
    labor are generally achieved through human-machine collaboration, and the value
    choices of relevant subjects inevitably permeate them. Applications of AI such
    as insight into data through machine learning and intelligent algorithms are not
    only an integration of various computing and intelligent technologies but must
    also incorporate human judgment and intelligence. To grasp the facts reflected
    by data and their significance, human observation and understanding must be relied
    upon for annotation. With the development and breakthrough of AI, whether computers
    can handle "value issues" will no longer be the decisive standard distinguishing
    humans from machines; once machine intelligence surpasses humans as a whole, we
    will inevitably face a major conflict between human-centric values and machine-centric
    values.


    For example, in terms of employment, the US government attaches great importance
    to the impact of AI on employment. In 2017, the US House of Representatives released
    the *AI Innovation Corps Act*, and in 2018, the *AI Jobs Act*, proposing that
    the US should foster an environment of lifelong learning and skills training to
    address the challenges AI brings to employment. In terms of industry development,
    for example, the US House of Representatives passed the *SELF DRIVE Act* in 2017,
    the US Department of Transportation released *Preparing for the Future of Transportation:
    Automated Vehicles 3.0* in 2018, and the US Department of Health and Human Services
    released the *Data Sharing Declaration*, regulating and managing the design, production,
    testing, and other links of autonomous vehicles to ensure user privacy and security.


    Finally, will the development of AI have a deep, irreconcilable, essential conflict
    with the value of human existence? People''s different values are usually formed
    by individuals gradually internalizing social values through education, reinforcement,
    and observational learning during the socialization process. Human concerns about
    future society firstly stem from the fact that future Strong AI may possess computing
    capabilities far exceeding those of humans, and the computers designed by humans
    become tools that calculate against themselves; this will become an important
    issue related to the destiny of humanity. Secondly, it stems from the fact that
    General AI may acquire perceptual capabilities. One of the essential differences
    between General AI and Narrow AI lies in whether the artificial intelligent agent
    can set grand goals for itself. The emergence of "perceptive machines" may render
    humans useless or kill us. The view of Peter Thiel, co-founder of PayPal, may
    reflect the fundamental reason for human anxiety about AI. He believes: "We find
    it difficult to describe in what form General AI will appear; in a sense, the
    AI issue encompasses all hopes and fears of the computer age. When pushed to these
    limits, human intuition collapses, because we have never encountered anything
    smarter than humans on this planet." Renowned AI researcher Eliezer Yudkowsky
    predicted and analyzed: "AI does not need to control the entire network; it does
    not need drones. The reason it is dangerous is not because it has a gun, but because
    it is smarter than us. Suppose it can predict protein structures from DNA information;
    it only needs to send a few emails to labs that synthesize custom proteins, and
    soon it will have its own molecular machines, then manufacture more precise molecular
    machines. I cannot accurately predict how we will lose to AI, because AI is smarter
    than me."


    The accelerated development of computer technology has driven progress in the
    fields of robotics, machine perception, and machine learning. These achievements
    enable the new generation of systems to match or even surpass human capabilities.
    Such development trends may open up an unprecedented era of prosperity and comfort,
    but the transition process is unpredictable. Once AI masters massive data that
    humans cannot understand and control, they can cause unimaginable disasters in
    an instant, such as shutting down power grids, paralyzing transportation systems,
    etc. As Norbert Wiener warned: "The new industrial revolution is a double-edged
    sword; it can be used for the benefit of humanity, but only if humanity survives
    long enough will we have the possibility of entering this period of benefit for
    humanity. The new industrial revolution can also destroy humanity; if we do not
    use it rationally, it may quickly develop to that point." [[10]](#txt002.xhtml#footnote_content_txt002_10)


    ## Chapter Summary


    Reviewing the history of AI development, periods of prosperity in social applications
    are also stages of rapid AI development, while stages where the accumulation of
    social application data lags far behind algorithm development are stages of AI
    stagnation. Currently, AI has shown broad application prospects in various industries;
    it can not only bring improvements in production efficiency but also catalyze
    new products and models, driving the reconstruction of the entire industrial chain.
    Therefore, AI provides new technical support for the reshaping of the human value
    system and will inevitably bring irresistible impacts and risks to social development.
    The Industrial Revolution went through a slow process from Europe, gradually expanding
    to North America, East Asia, and other regions. However, under the intertwining
    of new globalization and the new industrial revolution, AI risks possess both
    regional characteristics and global features, are cross-border in nature, transcending
    natural geographical and socio-cultural boundaries, shaping a community with a
    shared future for mankind in terms of technology. [[11]](#txt002.xhtml#footnote_content_txt002_11)

