    2018年12月，中国工信部发布的《促进新一代人工智能产业发展三年行动计划（2018—2020）》指出“人工智能具有显著的溢出效应，将进一步带动其他技术的进步，推动战略性新兴产业总体突破，正在成为推进供给侧结构性改革的新动能、振兴实体经济的新机遇、建设制造强国和网络强国的新引擎”。在人工智能赋能实体经济方面，企业将人工智能应用嵌入到生产和经营的过程或结合行业的实际需求，创新算法和数据驱动的新的商业模式，推动实体经济转型升级。艾瑞咨询预测，2019年人工智能赋能实体经济产业规模接近570亿元，安防和金融领域所占的市场份额最大，业务渗透力最好，营销、客服、教育等行业有望得到快速发展。相应地，人们对人工智能产品的接受度也越来越高，基于语音识别与交互技术的成熟落地与应用，智能家居和智能客服普遍进入日常生活；基于人脸识别技术的发展，公共场所身份的认定和监测管理更为便捷等等，人工智能产品市场前景广阔。在各领域中实现人工智能产品制造将是人工智能产业发展的主要趋势之一。2018年和2019年人工智能都再次出现在政府工作报告中，可见中国政府高度重视人工智能的发展。在2019年的政府工作报告中，提出了“智能+”的概念，打造工业互联网平台，为制造业转型升级赋能，人工智能与产业融合的态势进一步得到增强。


    ## 创造安全、高效、便捷的环境


    中国社会对人工智能带来的生活便利有着美好的憧憬，将建设安全便捷的智能社会作为重点任务，围绕发展便捷高效的智能服务、推进社会治理智能化、利用人工智能提升公共安全保障能力、促进社会交往共享互信四方面内容，提升全社会的智能化水平，使人们能够最大限度享受高质量服务和便捷生活，使社会运行更加安全高效。


    随着移动互联网的发展，人们的出行场景得到丰富和拓展。网约车自2010年引入中国，经过几轮合并发展，以及政府政策的出台监管，走上了有序发展的道路，已经成为人们出行方式的重要选择。截至2018年，网约车月度活跃用户已超过1.9亿人。2019年的数据显示，全国247个城市发布了相关监管规定，有110多家平台公司获得了经营许可，45万辆网约车获得了运输许可证。产业增速的背后，也时常出现网约车带来的社会问题，确保网约车安全健康运营对于保障民生、促进社会和谐发展至关重要。目前借助人工智能，不仅在匹配派单、供需预测、运力调度等方面为人们提供更加优质舒适的出行体验，而且在监管和实时跟踪反馈等环节加强了网约车的出行安全，保障了人们消费的信心，更高效、更智能、更安全、更舒适，也成为了网约车平台提升服务的目标。


    随着智能技术的发展，维护社会秩序稳定、保障公共生活安全和国家安全已经成为了时代赋予的新任务。中国提出要构建公共安全智能化检测预警与监控体系，加强对重点公共区域安防设备的智能化改造升级，支持有条件的社区或城市开展基于人工智能的公共安防区域示范。目前人工智能+安防是人工智能商业落地发展最快、市场容量最大的领域之一，2018年人工智能+安防软硬件市场规模达到135亿元，其中视频监控占据绝大部分，份额近90％[\[42\]](#txt006.xhtml#footnote_content_txt006_42)，根据鲸准数据，截至2020年3月11日，人工智能安防企业共计349家，过去交易事件总数267件，有融资历史的企业132家[\[43\]](#txt006.xhtml#footnote_content_txt006_43)，在政策和技术的驱动下，人工智能安防行业发展势头迅猛。中国安防厂商十分看重人工智能的应用，头部企业人工智能产品自研技术使用率可达80％以上，而研究投入每年可达数十亿，平均约占营收的8％左右。2018年1月，国家发改委提出了“人脸识别系统产业化应用平台”建设任务，相关人工智能企业积极承担，建立了云—边—端架构的行业应用体系，提出人工智能定义设备和场景的理念，即通过软件和算法使设备和解决方案适应实际需求。截至2018年底，已协助各地警方抓获近万名嫌疑人，获得公安部的高度认可。在此合作基础上联合成立“智能视频分析研究中心”。此外，还建立起人脸识别技术覆盖80％枢纽机场的从外至内多个场景，包括整体监控、安检口、会员贵宾厅、登机口、停机坪等。


    此外，人工智能引发的生产制造改革很有可能使社会贫富差距加大，掌握技术的人掌控住财富源头和阶级门槛，剥夺了社会大多数人民改善生活、获得幸福的路径，影响社会的稳定和长治久安。中国主动制定就业应对措施，保障民生，《新一代人工智能发展规划》不仅包含了基础研发等核心技术问题，还涉及人才发展、教育和职业培训等各个方面的战略。中国意识到加快调整现有教育模式的重要性，中小学阶段开始普及人工智能教育，并加强了人工智能职业教育，培养人工智能专门化人才以适应时代的变化。2018年4月，教育部出台了《高等学校人工智能创新行动计划》，指出要构建人工智能多层次教育体系，构建人工智能专业教育、职业教育和大学教育于一体的高校教育体系，并鼓励支持资源的开放，面向社会公众提供人工智能科普公共服务平台。通过全方位的资源配置、多维度的引导培育和宣传推广，共同应对可能出现的社会问题。在维护社会和谐上，充分发挥感知、预测的功能，及时把握民众认知及心理的变化，提高社会治理的能力和水平；利用人工智能在医疗、城市、司法、教育、环境保护、资源监测等领域的广泛应用，提供精准化公平服务，全面改善人民的生活质量，提升生活品质。


    中国长期的社会价值观坚信，一切科技的发展与社会的发展都要以人的发展为前提和目的。在人工智能面前，要绝对维护人的生存安全、尊严与权力，始终坚持以人为本的发展原则。当技术渗透到人类生活时，人们在享受技术带来的一切利好时，主动思考人与人、人与社会之间的深层次联系。以数据为例，数据一度成为可以与石油比肩的资源，随着数据弊端的逐渐显露，近年来中国社会各界减少了对数据的盲目崇拜，转而思考如何科学利用富集的数据资源去做更多有价值的事情，竭力避免因数据造成的不公平和不平等问题。如何发挥出数据的优势驱动人工智能研发和应用的发展是中国人工智能发展在面临价值判断时的重要命题之一。


    中国自古便有思考人与物关系的传统，尽管现阶段奇点还未来临，可是一旦人工智能超越人类的事情发生，结果将是毁灭性且不可逆转的。人类应该如何对待人工智能，将是人类在人工智能发展道路上必须要面对的问题，这一问题在短时间内，无法得到明确的答案，它会随着人类认知、机器认知，以及人类对机器认知的发展而变动。有学者对机器智能做了一个基本的判断：“它们永远不可能达到人类的全面能力，尤其是人之为人的那部分能力、创造智慧和意义世界的能力，但它却可能在另一些方面——如记忆和计算——具有超过人的能力；它也达不到具有基于碳基生物的感受性之上的丰富和复杂的情感，但它却具有毁灭人的力量”[\[44\]](#txt006.xhtml#footnote_content_txt006_44)。面对人工智能可能存在的威胁，中国主张共同协商、加强合作，牢记人类命运共同体寻求合作，共同维护世界秩序。


    中国高度重视人工智能的健康发展，大力加强对人工智能健康发展的引导，极其重视人工智能伦理和治理问题。从政策层面上，要求抢抓人工智能发展的重大战略机遇，构筑人工智能发展的先发优势，加快建设创新型国家和世界科技强国。2019年6月，国家新一代人工智能治理专业委员会发布《新一代人工智能治理原则——发展负责任的人工智能》，确保人工智能安全可靠可控，推动经济、社会及生态可持续发展，共建人类命运共同体，提出了八条原则——和谐友好、公平公正、包容共享、尊重隐私、安全可控、共担责任、开放协作、敏捷治理。此外，2019年5月，中国人工智能产业发展联盟发布了《人工智能行业自律公约（征求意见稿）》，承担起行业组织在推动人工智能伦理自律方面的责任。2020年12月，中共中央印发《法治社会建设实施纲要（2020—2025）》，其中提出完善网络服务方面的法律法规，修订互联网信息服务管理办法，研究制定完善对网络失信主体信用信息管理办法，制订完善对网络直播、自媒体、知识社区问答等新媒体业态算法推荐、深度伪造等新技术应用的规范管理办法等。


    2018—2020年，中国积极承办人工智能主题相关的世界级大会，为人工智能的健康发展搭建全球平等对话交流平台。2018年首届世界人工智能大会在上海举行，习近平总书记致贺信表示，中国正致力于实现高质量发展，人工智能发展应用将有力提高经济社会发展智能化水平，有效增强公共服务和城市管理能力。中国愿意在技术交流、数据共享、应用市场等方面同各国开展交流合作，共享数字经济发展机遇。2019年，第二届世界人工智能大会专门增设了“人工智能治理”分会场。


    ## 本章小结


    中国社会价值体系中历来重视天人合一、持中贵和，在处理万事万物的复杂关系中，相信“和合”之道，和而不同、求同存异，自然与社会的和谐、个体与群体的和谐等等。人工智能的广泛应用、机器智能可能呈现的潜力，使这种和谐的关系受到挑战与重塑，道德价值由天与人关系的映照，逐步转变为更加重视人与机器之间的关系，审视机器意识与价值体系，评判机器责任，以应对人工智能嵌入到社会经济的方方面面。同时，数据作为一种新的生产要素，在人工智能发展过程中起到举足轻重的作用，数据的价值凸显、数据治理的重要性跃然纸上。中国拥有丰富的数据资源，相对而言，在前期数据采集与使用环境比较宽松，为技术的进步和人们生活的便利提供了很大的帮助。随着数据问题的加剧及人工智能发展逐渐进入冷静思考期，中国更多地开始关注数据的规范使用、标准化建设、全球伦理治理合作等问题，体现出大国的担当责任和人类命运共同体的理念。


    改革开放四十年来，中国科技发展取得了令世界瞩目的成绩。人工智能具有溢出带动性很强的“头雁”效应，中国普遍达成共识，与时俱进，通过加快新一代人工智能，推动科技发展、产业优化升级、生产力进一步提升，全面赋能社会经济发展。传统中国社会，人的价值在与他人交往的关系中得以彰显，无论是日常交往沟通还是商贸往来，都十分看重社会关系的构筑。技术进步带来通信方式和消费方式的革新，人们的生活方式发生变化，随之而来的价值观也受到了极大的影响，2020年新冠肺炎疫情突如其来，折射出技术重塑价值观的价值，人们站在时代的拐点上，正在积极应对系列不确定性和挑战。另外，中国是一个文明未曾间断的文明古国，长期以来处于农业社会，农耕维系着社会的顺畅运转，无论从体力劳动还是精神劳动上来说，人们都养成了以劳动获取生命尊严和价值的意识。机器自动化、智能化的应用替代了许多岗位和职业，这种变化对于中国来说，在短期内是难以接受的，人们的心理承受着不同程度的压力。但是另一方面，中国也看到了新技术正在创造着新的工作机会与重构社会生产力，以积极拥抱的姿态，抢占发展新机遇。


    中国自古以来重视社会的和谐发展、人民生活的幸福安康。人工智能带来的影响既有积极的方面，也有令人陷入消极应对和抵触的成分，当人工智广泛应用时，中国首要考虑的是如何利用技术更好地服务改善人民的生活，促进经济发展和产业升级转型，最大限度地带来尽可能少的由于新技术造成的新的社会问题，帮助解决更多的社会问题。技术的社会意义交汇在此，力图达到融会贯通的境界，做到科学技术成果由人民共享。


