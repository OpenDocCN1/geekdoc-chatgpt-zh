    ## 机器人市场潜力与人机道德挑战


    回到技术发展本身，目前中国机器人市场需求潜力巨大，工业与服务领域都颇具成长空间，据国际机器人联盟（IFR）统计，预计中国机器人密度将在2021年突破130台/万人，达到发达国家平均水平。2019年，中国工业机器人市场规模预计达到57.3亿美元，到2021年，国内市场规模进一步扩大，预计将突破70亿美元。随着人口老龄化趋势加快，以及医疗、教育的持续需求，中国服务机器人存在巨大市场潜力和发展空间。2019年中国服务机器人市场规模有望达到22亿美元，同比增长约33.1％，高于全球服务机器人市场增速。其中，中国家用服务机器人、医疗服务机器人和公共服务机器人市场规模分别为10.5亿美元、6.2亿美元和5.3亿美元，家用服务机器人和公共服务机器人市场增速相对领先。到2021年，随着停车机器人、超市机器人等新兴应用场景机器人的快速发展，中国服务机器人市场规模有望接近40亿美元。[\[13\]](#txt006.xhtml#footnote_content_txt006_13)如此庞大的机器人市场规模使中国面临的人机道德问题更加棘手，既要高瞻远瞩应对未来潜在的危机，又要立足于现实，解决实际问题。例如，如果理财机器人出现错误，损失应该由谁承担。理财机器人又叫智能投资顾问，是基于人工智能算法对客户的资产和消费数据、背景和风险偏好、投资习惯等进行分析后打造的一套投资组合。目前中国各大银行、证券公司和保险公司都不同程度地入局了相关产品，万一机器人出现问题或者被黑客攻击，投资者出现损失的责任算是谁的？又如在医疗机器人领域，虽然医疗机器人尚未普及，但是在一些医院，部分特定的机器人已经开始辅助医生工作，如果机器人出现故障，谁应该为医疗事故担责？针对此类问题，中国以负责的态度积极回应，2018年11月中国全国人大常委会委员长会议组织人员进行专题学习，围绕规范人工智能发展进行学习讨论，认为全国人大相关专门委员会、工作机构和有关方面要及早动手，尽快行动，对人工智能涉及的法律问题进行深入调查研究，为相关立法工作打好基础、做好准备。


    除以上有关机器道德责任的讨论，对人工智能发展影响重要的一个要素便是数据。大数据的涌现助推了本轮人工智能快速发展。人类社会自诞生之初，便开始与数据打交道，但数据的规模和种类都未曾像现在这般庞大和丰富。数据的获取和使用既是思考人机关系的一个重要维度，也是人工智能健康发展、获得社会信任的关键。在过去，人们在数据采集、存储和计算等方面受到限制，如今随着电子计算机的发展和高性能计算的支持，数据正推动一场前所未有的伟大革命，人工智能在众多领域的落地与应用，得益于基于大数据而实现的数据智能。目前全球数据量仍在飞速增长，中国在数据上占据了相对优势，数据量大且数据种类多样丰富，数据的获取和使用也更加方便。这主要得益于中国人口基数大，伴随着信息化和数据化程度的提升，产生了大量的数据。2019年中国互联网络信息中心（CNNIC）发布《中国互联网络发展状况统计报告》，报告显示截至2018年12月，我国网民规模达8.29亿人，互联网普及率达59.6％，其中手机网民规模达8.17亿人。人们不仅上网娱乐休闲，还培养出二维码支付、手机缴费、手机出行等习惯，积攒了大量的数据。人工智能的出现，特别是高性能计算能力和智能算法的助力，为分析处理数据带来便利。中国社会价值观对数据挖掘和分析的态度更加开放，对个人隐私保护的意识没有十分苛刻，愿意在社交、消费等场景下提供相关的信息来获取个性化的服务。比如，企业得以获知用户画像、行为偏好、信用状况等数据信息，推动企业业务模式、业务流程以及产品应用与服务等方面的变化，加速向着智能化的道路转型，创造新的价值。


    另一方面，技术的跃升有力地帮助数据收集规模和范围的扩大。一般来说，数据采集的来源主要包括：业务层面的数据，社交媒体、自媒体数据，电商数据，自有App行为数据，以及各种互联网平台的互动数据和线下门店数据的录入等等。应用人工智能，尤其是计算机视觉的发展，这些数据能够规模化地收集、分析与处理，形成海量的数据库。计算机视觉涉及的技术包括人脸识别、图像识别、图像分割、图像生成，目标检测等，这些技术与日常生活中数据产生的场景密切相关，并帮助完成了大量的数据收集工作。人脸识别是计算机视觉中应用最为普遍的领域，中国在技术上的创新能力和研发实力已经领先于世界其他国家，不仅在价值观和政策上提供了更优质的发展土壤，而且投入了相当大的学术研究支持，并且“随着计算机视觉研究的不断推进，研究人员开始挑战更加困难的计算机视觉问题，例如：图像描述、事件推理、场景理解等”[\[14\]](#txt006.xhtml#footnote_content_txt006_14)，对现实世界中诞生数据的更加复杂的场景进行理解。总而言之，计算机视觉技术利用摄像机和电脑代替了人眼来观察、读取这个世界的现象，并以数据的形式存储，进行快速地处理与分析，完成诸如分割、分类、识别、跟踪和判断决策等任务。目前，在中国计算机视觉市场构成方面，安防领域占比最高[\[15\]](#txt006.xhtml#footnote_content_txt006_15)，超过整个市场占比的一半，这也从侧面说明了中国数据资源何以如此丰富。中国的社会价值观倾向于安全先于隐私，群体高于个人，安防摄像头和交通摄像头应用广泛，全面对无人值守的场所或者公共场合进行安全维护，发现异常自动报警，出现交通违章自动分析，识别车辆车牌，规范交通。人工智能的发展促进了中国安防和交通领域服务能力的提升，但是归根结底，离不开中国社会价值观的有力支持。从政府和公共利益出发，基于数据的分析，为人们创造更加安全的居住环境和更加便捷的出行服务。


    如此大规模的数据量和数据应用需求，也带来一系列问题，如数据流通、数据使用规范、数据开放和数据安全等，这不仅是人工智能算法面临的困难与问题，更是国家社会经济发展面临的重大挑战与机遇。中国不仅要建立健全法律法规等手段规范数据的使用，前瞻性地做好应对措施，保障人工智能产业全面、可持续健康发展。同时，也要加快解决中国人工智能企业面临的数据开放程度低、数据流通困难、数据质量有待提高等问题，这些问题既有自身发展的内在局限，也有来自国际社会的规则障碍。在数据经济的大环境背景下，没有一个国家或组织能够独善其身，数据治理尤其重要。2020年11月21日，中国国家主席习近平在二十国集团领导人第十五次峰会上指出，“面对各国对数据安全、数字鸿沟、个人隐私、道德伦理等方面的关切，我们要秉持以人为中心、基于事实的政策导向，鼓励创新，建立互信，支持联合国就此发挥领导作用，携手打造开放、公平、公正、非歧视的数字发展环境”，并表示，“中方提出了《全球数据安全倡议》，愿以此为基础，同各方探讨并制定全球数字治理规则，支持围绕人工智能加强对话，倡议适时召开专题会议，推动落实二十国集团人工智能原则，引领全球人工智能健康大展。”[\[16\]](#txt006.xhtml#footnote_content_txt006_16)2020年以贵州大数据综合试验区的实践为数据治理研究样本的系列丛书的第一册《数据治理之论》出版，书中指出，“价值释放是数据治理的根本目标。数据利用情况的好坏、价值释放的大小已成为一个国家、地区、组织综合竞争力的关键指标。通过理论与实践相结合、制度与技术双驱动，提升数据质量、促进共享开放与开发利用，为‘用数据说话、用数据决策、用数据管理、同数据创新’奠定良好基础，进而为推动国家治理体系和治理能力现代化奠定基础。”[\[17\]](#txt006.xhtml#footnote_content_txt006_17)


    ## 追求发展：技术赋能与生产力重构


    人工智能全面赋能生产生活，大批科技成果落地，带来经济的跃升式发展。人们的交往方式、消费方式等行为方式发生了转变，脱离了人与人之间的实际距离转而以线上的形式进行，对智能设备和智能交互方式的深度依赖逐步渗透以人为主导的社会关系，公开透明、便捷高速的交往技术方式和落地产品正带来新的社会模式创新体验。同时，大规模的智能产品投入使用取代了传统的就业岗位，中国人重视的劳动的地位和意义，正陷入前所未有的困境中，然而在追求发展的过程中，顺应时代的需求，社会生产力也在相应地发生重构。


    ### 行为方式的日新月异


    随着互联网技术的发展，信息的传递和传播的方式、传播速度都发生了极大的改变。网络社会的兴起，人成为网络关系网中的一个个小的节点，不需要直接见面，便能通过通信设备对话、发布观点。2016年以来，随着人工智能产业应用的发展，智能终端设备不断升级、移动网络普遍性接入，人工智能带来崭新的社会交往方式，大量内容分发平台和生产者激增，数字产业规模获得突破性发展，数字内容的生产与传播成为了一种新社交形式，人们之间的沟通交流进一步脱离现实。


    这既促进了社会经济的发展，也带来了潜在的社会危机。一方面，信息的爆炸式增长、算法推荐的不良广告、制造的虚假新闻层出不穷，不仅占用了用户大量的时间，还给用户之间的关系带来了更多的复杂性和不确定性。另一方面，人工智能虽然推动了线上社交工具与平台的蓬勃发展，但是与之相应的社会规则和治理方法仍停留在“旧”阶段，在新情况面前缺乏有效的解决方式和应对措施。这一现象也暴露出社会问题与风险的交织泛化，受智能技术的影响，人们所要处理的问题超出了传统社会关系承载的边界，迈向人与机器关系的层面。同时，人工智能发展也面临着巨大的社会压力，对技术优化提升的需求更为迫切。传统的人工审核速度和人员规模无法应对冗杂的图文信息，现存算法审核机制的不完善导致了内容审核能力与实际情况严重脱节，对传播造成极大的压力和挑战。甚至人工智能算法棘手的“偏见”和“黑箱”问题在某种程度上带来了更严重的人际交往问题，如用户接收到不公正、片面化甚至是带有文化或地域歧视色彩的信息。中国秉承责任先于自由、集体高于个人的精神，始终以最广大人民群众的根本利益为出发点，多次对主流社交平台进行内容整顿，规范文明网络行为，净化网络环境，力图为新时代模式下的交往提供舒适健康的氛围。


    2020年疫情之下，中国的社交媒体在人工智能的助力下发挥着重要作用，社会价值凸显。社交媒体作为新闻信息的分发平台，成为民众了解疫情的重要渠道，各大社交媒体以信息的公开、透明、真实、快速传播为根本，在消除和减少社会恐慌的过程中发挥了重要作用。以中国三大社交平台为例，微信公众号凭借熟人社交关系链实现了信息的快速分发，多篇疫情主题文章阅读量破百万；微博作为唯一的广场式社交媒体，更是在此次疫情中发挥信息中枢作用，集政令传达、疫情求助、社会监督、人文关怀、科普辟谣、社会维稳等多功能于一体，以疫情地图为载体，汇集疫情最新动态和国内外疫情发展，减少信息传递过程中的不对称风险；知乎发挥其问答社区的优势，上线新型肺炎防控系列专题，涵盖科学辟谣、防护指南、心理援助等抗击新冠肺炎专区，并联合阿里健康、好大夫等在线医疗健康平台开通义诊通道，疫情期间“新型肺炎”相关回答获17.3亿次阅读。[\[18\]](#txt006.xhtml#footnote_content_txt006_18)由此可见，充分利用技术优势，发挥技术长处，人工智能在社会媒体领域大显身手，使中国社交媒体风评和口碑得到好转，这也传递出当今中国“人情”关系的新模式，在人和人关系方面，要不断创新互动模式，调动用户积极性；在人和内容生产方面，基于技术手段建立更加垂直的生态圈，聚集用户形成高效、可信的圈层传播。


    中国是人口大国，也是消费强国。在消费领域，商品交换是人与人交往的重要组成部分之一。目前，消费正在向数字化模式靠拢，借助互联网、移动互联网和智能终端设备，消费方式更加灵活、便捷与高效，塑造出全新的消费形态。社交平台的兴起为消费提供了更刺激的方式，社交平台分享交流的天然属性使得年轻一代成为消费主力军，贡献出大量的消费体验和服务评价。据2017年埃森哲研究发现，中国95后消费者喜欢通过社交平台直接购物，70％的受访者表示有兴趣直接通过社交媒体购物交易。[\[19\]](#txt006.xhtml#footnote_content_txt006_19)技术的发展使消费渠道和方式向线上转移，零售业消亡的消息一度占据新闻头条，尽管这种消息往往噱头大于实际，但是在人工智能的赋能下，传统零售业的模式正在发生翻天覆地的变化。目前，消费者数据呈指数级增长、人工智能算法准确度和算力提升以及智能硬件、AIoT[\[20\]](#txt006.xhtml#footnote_content_txt006_20)、虚拟现实、5G等技术不断发展，人工智能已经渗透到零售行业落地价值链的多个环节，其中，机器学习和计算机视觉是支撑“人工智能+零售”的两大技术。机器学习主要应用于数据分析与建模，以实现数据智能和产业链优化；计算机视觉技术则应用于对消费者及商品的识别与分析，相关应用已实现落地。[\[21\]](#txt006.xhtml#footnote_content_txt006_21)


    “人工智能+零售”利用以人工智能为核心的技术为线上线下的零售场景提供支持，将零售体系的门店、仓储、物流等环节纳入数字化管理和运营，包括：利用计算机视觉技术对线上图片、视频等各类商品的展示信息进行管理；利用语音识别、语义理解等自然语言处理技术保障智能客服服务；利用机器学习算法分析用户的互联网使用习惯与留存数据信息，进行精准化和个性化推荐；利用大数据分析技术，收集整理归纳行业资讯，为企业生产经营决策提供智力支撑。这些与传统的零售方式大大不同，传统门店的导购往往通过与客户沟通交流的方式完成产品的推荐，产品是否符合客户预期，是否受到客户的喜欢，是否激起客户消费欲望等，有着极大的不确定性。人工智能进入零售领域的理想情况是打通线上线下零售业，消费者可以在线购买或在线预订，再选择商店提货，线下门店也可以根据消费者数据，了解相应的消费偏好进行沟通推荐，创造更高效的购买模式。


    从数据的角度来看，基于大数据的人工智能销售预测，对未来两周内销售预测的准确率能够达到75％～85％。相比而言，运用传统策略加上人工经验的方法，销售预测的准确率一般最高只有70％，所以说人工智能可以帮助零售商更好地预测商品的销量。同时，基于大数据的人工智能销售预测也可以显著地降低库存周转天数，直接实现相应的效益提升。例如，生鲜类品牌通过这种销售预测可以优化库存管理、减少生鲜损耗、降低经营风险。[\[22\]](#txt006.xhtml#footnote_content_txt006_22)


    尽管“人工智能+零售”的概念和应用不断普及和扩大，但仍然面临困难，最突出是线下数据的获取与线上数据的长期割裂。一种有效的解决方案是使用摄像头、智能广告机等智能设备识别用户的基本信息、行为轨迹和浏览偏好，并根据线上或过往的购买记录，进行推荐或者个性化服务。另一方面，也要考虑到运用人工智能虽然减少了人工带来的与用户需求不符、库存积压、信息反馈缺失等问题风险，但也削弱了人的精神世界活动。并且从个人的角度出发，零售业对个人消费数据的使用，对于一部分人来说这是好事，可以帮助快速找到自己喜爱的东西，节约时间。但是对于另一部分人来说，过度的推荐消磨了人的个性，限制了人去探索各种各样事物的可能性。


    当前，中国社会的交往和消费方式日新月异，与之相生的人情价值观也变得更加复杂、更加矛盾。智能技术将人们的生活从传统的人情社会中剥离，转而进入更加理性化、智能化的数据社会，这中间出现的问题既需要通过时间适应、规则变更来应对，又不能抱着消极态度滞步徘徊，忽略技术能极大地刺激新经济、新模式、新业态的出现。2016年中国政府国务院办公厅《关于推动实体零售创新转型的意见》指出，加强互联网、大数据等新一代信息技术应用，大力发展新业态、新模式，支持企业运用大数据技术分析顾客消费行为支持企业开展服务设施人性化、智能化改造。2019年，“人工智能+零售”相关投融资事件共计17起，占2019全年人工智能领域投资的3.3％；占比较去年的1.8％，增幅达到83.3％。[\[23\]](#txt006.xhtml#footnote_content_txt006_23)


    2020年受新冠肺炎疫情的影响，全球经济受到剧烈冲击。中国以巨大的付出在较短的时间内使疫情得到有效控制，疫情使消费形式再次发生转变与升级，线上消费成为新消费的核心内容。电商网购与在线服务等新业态在抗疫中发挥了重要作用。线上线下联动，一方面线上拉动整体销量并帮助实体经济在产业链数字化、智能化转型等方面开创增长空间。另一方面传统实体经济主动拓展线上市场空间，在数字化转型方面做出了新的探索和尝试。大批房地产开发商、家电企业等线下企业门店与京东天猫等平台达成合作。“618”期间[\[24\]](#txt006.xhtml#footnote_content_txt006_24)，覆盖全国2.5万乡镇和60多万个行政村的1.2万个京东家电专卖店整体成交额同比增长240％。[\[25\]](#txt006.xhtml#footnote_content_txt006_25)


    ### 社会就业与劳动正当性


    机器智能的发展将可能大规模取代以往的人力劳动，影响社会就业结构的变化，未来社会有可能面临着大量失业问题，这几乎是历次技术变革带来的共性问题。从长远来看，技术对就业整体影响可能会是积极的，然而由于过程的漫长与不确定因素的存在，人们对技术引发的失业担忧可能会一直存在。


    20世纪机械的大规模应用使得新的交通工具出现并取代了马匹，原先由马车运输业发展来的众多岗位消失殆尽，大部分人陷入失业危机。21世纪，当中国人面对人工智能在金融、交通、医疗、消费等领域的优异表现，不得不担心技术在方便人们生活的同时，许多工作岗位将再次被智能化替代。从传统的制造业到服务业，甚至到新闻撰写、医学诊断、法律行业等具体的工作场景，人工智能的身影已经无处不在。麦肯锡曾预测，到2030年，全世界将有3.9亿人因机器人和人工智能的大规模普及而改行，有8亿人会失业。物理学家霍金2016年在英国《卫报》上发表文章称：“工厂的自动化已经让众多传统制造业工人失业，人工智能的兴起很有可能会让失业潮波及中产阶级，最后只给人类留下护理、创造和监管等工作。”[\[26\]](#txt006.xhtml#footnote_content_txt006_26)牛津大学2016年报告“Technology
    at Work V.2.0：The Future Is Not What It Used to Be”预测，发展中国家的工作自动化风险提高，中国、印度等主要新兴经济体的自动化风险，分别是77％和69％。

