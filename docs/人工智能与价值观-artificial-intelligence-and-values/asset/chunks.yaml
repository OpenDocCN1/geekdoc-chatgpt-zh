    # Japanese Culture and the Fourth Industrial Revolution


    ## Characteristics of Japanese Culture and the Endogenous Rotation Model


    Judging from the aforementioned characteristics, Japanese culture differs significantly
    from traditional Chinese culture, which also belongs to the East Asian cultural
    sphere. For a long time, Japanese culture has been a typical hybrid culture; while
    the dominant culture currently possesses strong learning ability and receptivity,
    it also features a collectivism with an extremely strong sense of self-discipline.
    Simultaneously, Japanese culture is a "weak gene culture" (lacking a dominant
    self-generated culture), lacking the cultural genes to reform, innovate, and challenge
    authority; therefore, it rarely takes the lead in innovation in the trend of world
    cultural progress. Other scholars have analyzed this, arguing that this mode of
    cultural reception in Japan reflects a mentality of instrumentalizing foreign
    culture. On the one hand, this causes Japanese culture to exhibit tendencies toward
    vulgarization and superficiality; on the other hand, it affects its cultural future.
    Because in the learning process, Japanese culture neglected the most important
    "Benevolence (Ren)" in Chinese culture and the most important "speculative reason"
    in Western culture, learning only the exterior without grasping the most essential
    and fundamental elements of both Eastern and Western cultures.[[5]](#txt005.xhtml#footnote_content_txt005_5)


    In discussions on the characteristics of Japanese culture, some scholars believe
    that Japanese culture can achieve a balance between various foreign cultures and
    local culture, primarily stemming from Japan''s unique cultural "endogenous rotation"
    (Naizen) model. Because Japan is an island nation located at the periphery of
    East Asian cultural development, in this endogenous rotation model, the life of
    the Japanese people originally developed independently. However, during this independent
    development, they continuously suffered impacts from surrounding foreign cultures.
    Thus, the Japanese people, situated at the periphery, absorbed and fused foreign
    cultures throughout historical development, enriching and developing their own
    culture, and ultimately forming this endogenous rotation-style cultural absorption
    model. This endogenous model corresponds to its status at the cultural periphery.
    After foreign culture enters, the local culture absorbs its excellent parts and
    reforms its own parts; this method, beneficial in Japanese historical development,
    gradually formed and solidified. This was most evident when ancient Japan absorbed
    ancient Chinese Central Plains culture and when it absorbed Western culture after
    the Meiji Restoration. This endogenous cultural absorption model is completely
    different from traditional Chinese culture and Western civilization. When facing
    new cultures, Central Plains culture tended to absorb parts beneficial to national
    and social development and integrate them, similar to the development of Chinese
    Buddhism (Han Buddhism) after Buddhism entered the Central Plains. Western culture
    emphasizes its own dominance more, often confronting foreign cultures in a conflicting
    manner; this conflict continues to this day and remains a major cause of turmoil
    in many places. Japanese culture is relatively special in this regard. In *The
    Enigma of Japanese Power*, Karel van Wolferen describes it thus: "The Japanese
    always show great tolerance towards religion; although this view is widely accepted,
    it applies only when the new religion or belief system does not threaten the existing
    political arrangements." This also shows that the tolerance and closedness of
    Japanese culture distinguish it from both China and the West.


    It must be emphasized that the endogenous rotation model has shaped Japan''s current
    cultural mentality and patterns. When facing a higher-level civilization, Japanese
    culture manifests as an endogenous rotation absorption state; when Japan itself
    is at a high level of development, it manifests as a state of cultural display.
    This characteristic, on the one hand, allowed Japanese culture to make great leaps
    in its development; on the other hand, it preserved its inherent cultural traditions.
    This is also one of the reasons why Japan can handle the combination of traditional
    and foreign cultures well. In Japanese historical development, the faster the
    development, the more prominent the traditional culture becomes. For example,
    when Japan developed into one of the world''s five great powers around World War
    I, culturally, Japan began a large-scale return from Western European culture
    to "Eastern" (Toyo) culture, representing the beginning of Japan displaying its
    own cultural characteristics. After World War II, Japan underwent a major transformation
    by Western culture, but while absorbing advanced Western culture to achieve rapid
    development, it also gradually began to revive its own national cultural traditions.
    Relative to the Westernization trends during the Meiji Restoration and the post-WWII
    social reconstruction, these two waves of Japanese local culture display Japan''s
    attitude toward foreign culture: when facing a strong culture, it can accept it
    comprehensively; after its own development, it re-evaluates and makes cultural
    corrections. The obvious drawback of this cultural model is that the acceptance
    of strong foreign cultures lacks thorough localization, bringing potential conflicts
    between the two. The rise of the Third Industrial Revolution coincided with Japan''s
    most rapid development. At that time, Japan established cultural confidence due
    to economic success, and to a certain extent, this endogenous absorption model
    did not play a significant role when facing the impact of the new information
    revolution. Japan''s cultural closedness caused the entire society to miss an
    opportunity for rapid development.


    This mode of handling foreign culture has a huge impact on the development of
    Japanese traditional culture. On the one hand, when no foreign culture enters,
    Japanese culture exhibits closedness, superiority, and exclusivity; on the other
    hand, when Japanese culture is impacted by leading foreign technologies, it determines
    its way of dealing with them—cultural absorption or maintaining its own sense
    of superiority—based on its own development level. Therefore, the posture with
    which Japanese society faces the Fourth Industrial Revolution will determine Japan''s
    level of development in this wave.


    ## Endurance (Nin): Education of Responsibility Not to Trouble Others


    Anyone slightly familiar with Japan will distinctly feel that it is a society
    with a very strong sense of order. This sense of order mainly stems from the social
    educational rule in Japanese society of "not causing trouble (meiwaku) for others."
    This rule was also formed under the influence of various factors such as Japanese
    cultural norms.


    The education of responsibility not to trouble others is a manifestation of Japanese
    cultural exclusivity on the individual level. Japanese filmmaker Akira Kurosawa
    mentioned in his work *Something Like an Autobiography* (literal translation of
    *Gama no Abura*: "Toad''s Oil"): "We Japanese received an education that regards
    valuing the self as an evil deed and abandoning the self as conscience, and we
    are accustomed to accepting this education, even without doubt." This unique education
    of responsibility presents Japanese society in a state of extreme self-restraint
    and civilization, and this state of extreme self-restraint has created Japan''s
    unique culture of endurance (Nin). The most familiar manifestation of this culture
    to us is the Japanese Bushido spirit. Ruth Benedict also discussed this Bushido
    spirit as a significant Japanese character trait in *The Chrysanthemum and the
    Sword*. Similarly, in *The Real Japan* by Dr. Aming (A Ming), a medical doctor
    who studied in Japan, the author interprets the Japanese Bushido spirit as a national
    character. He mentions that unlike the Chinese who view Bushido with deep hatred
    as insidious, cunning, and cruel, in the eyes of Westerners, the greatest characteristic
    of the Bushido spirit is endurance in the face of injury, whether physical or
    mental. Even on occasions that call for tears, one is required to face them with
    a smile, making emotions internalized and invisible. This cultural phenomenon
    of extreme self-restraint penetrates all aspects of Japanese society. Similarly,
    when facing the Fourth Industrial Revolution, the culture of endurance has a huge
    impact on the value of new technologies.


    First, from the positive side, the culture of endurance reduces the pressure in
    promoting the Fourth Industrial Revolution. If the cultural shock brought by the
    Fourth Industrial Revolution has not shaken the normal lifestyle of Japanese society,
    then the culture of endurance can greatly reduce the forces of technological resistance
    in society. Especially when the state gives the Fourth Industrial Revolution a
    promoted status, because the public believes in the important role of technology
    for national development, Japanese society will endure the negative effects brought
    by technological change due to the culture of endurance. This is the most positive
    and powerful aspect of Japanese culture in welcoming the Fourth Industrial Revolution.
    However, the culture of endurance is not unlimited. Generally speaking, this sacrifice
    must be short-term and drastic, and this sacrifice must be endorsed by social
    recognition. From this point of view, if the Fourth Industrial Revolution unfolds
    vigorously in Japan, and Japanese society can recognize individual sacrifice,
    then from the perspective of the Japanese character of endurance, many individuals
    or groups can make sacrifices to cooperate with technological innovation.


    Another positive aspect is Japan''s "Otaku" (homebody/recluse) culture. Influenced
    by Japan''s culture of endurance, a recluse culture has emerged in Japanese society
    today. This culture signifies avoiding social interaction, avoiding troubling
    others, and being capable of self-sufficient survival. With the arrival of the
    Fourth Industrial Revolution, artificial intelligence can help people achieve
    an intelligent life in the future, effectively reducing daily routine social interactions.
    Assisted by such intelligent technology, the recluse culture will become more
    convenient and interesting, also generating demand for new technologies.


    From the negative side, because the Japanese fear the trouble brought by new revolutions,
    they may lose enthusiasm for technological innovation. Looking back at the late
    20th century, when Japan faced the Third Industrial Revolution, its arrogance
    towards innovation culture led to Japan''s lack of outstanding performance in
    the Third Industrial Revolution. Japan''s endogenous cultural absorption model
    made Japan, with its good economic development, more willing to inherit traditional
    culture, lacking the driving force for change. Combined with Japan''s reverence
    for order and its hierarchical life and work status, when technology in the outside
    world undergoes earth-shattering changes, Japan''s culture of endurance only brings
    a visible sense of lag to Japanese technological innovation. The hierarchy determines
    that in most cases, such change can only be top-down, and grassroots innovation
    in society is suppressed by the culture of endurance.


    One can imagine that under the impact of a new technological revolution, this
    Japanese social state of "not troubling others" may present two divergences. The
    first divergence is choosing refusal because of endurance; they are unwilling
    for technological innovation to bring trouble to themselves or others. This is
    also why Japanese people, when facing new things, often refuse change to avoid
    breaking the existing stable and peaceful state. The uncertainty of whether new
    things will bring inconvenience is unassessable, while the cost of not changing
    is the lowest. So, the inertia of being unwilling to trouble others and willing
    to maintain one''s traditional life will undoubtedly be the choice of this group.
    The second divergence is due to the state''s vigorous promotion of new technology;
    the Japanese people also realize the huge driving force of this technological
    innovation for national development, and are willing to sacrifice themselves and
    endure the troubles brought by the entire technological innovation. Moreover,
    with the increasing severity of Japan''s aging population, the lack of labor is
    the biggest problem Japan faces. Since the new technological revolution can reduce
    the need for labor, it will inevitably gain tremendous support from a portion
    of the people.


    Comprehensively speaking, the culture of endurance, as a universal national characteristic
    of Japan, has a tremendous impact on the development of the Fourth Industrial
    Revolution in Japan. This impact depends on whether the culture of endurance is
    accepting technological innovation or resisting technological change. Moreover,
    this impact can change the overall acceptance level of the Fourth Industrial Revolution
    by Japanese culture, which will determine how the Japanese government positions
    the Fourth Industrial Revolution strategically, and ultimately determine Japan''s
    performance in the future technological revolution.


    ## Value Choices: New Technology Development and Social Dilemmas


    Over the past few decades, Japan has achieved rapid economic growth and long held
    the position of the world''s second-largest economy. The country''s entire industrial
    system has been formed and occupies a leading position globally. At the same time,
    Japan''s artificial intelligence research started very early; as early as the
    1970s, Professor Ichiro Kato of Waseda University, known as the "father of Japanese
    robots," began developing lower-limb robots driven by artificial muscles. Currently,
    Japan''s robot manufacturing development is very advanced; the robot industry
    accounts for a proportion of national economic growth far exceeding other countries,
    possessing the world''s largest number of robot users, robot equipment, and service
    robot manufacturers. With the international community''s emphasis on AI technology
    research, the Japanese government has also attached great importance to AI development
    in recent years, not only regarding AI, IoT, and robots as the core of the Fourth
    Industrial Revolution but also establishing a relatively complete R&D promotion
    mechanism at the national level. In the new era, facing the impact of the Fourth
    Industrial Revolution represented by AI, it is an opportunity that Japan, already
    mired in sluggish economic growth, cannot afford to miss.


    ### Innovation: Technology Introduction and Turning to "Science and Technology
    Nation"


    After WWII, whether in national politics, economic development, or science and
    technology, Japan lagged far behind European and American countries. This forced
    Japan to form its own innovation model and achieve a breakthrough in the international
    market.


    The "Japanese model" of economic development was formed through the path of "imitation
    and then innovation," which is a shortcut used by many countries to achieve economic
    development by utilizing latecomer advantages in technology. Usually, the "latecomer
    effect" in economics refers to a shortcut where late-developing countries learn
    from and utilize the advanced technologies and experiences obtained by advanced
    industrial countries through repeated exploration, setbacks, failures, and huge
    costs, to quickly catch up with advanced countries. Japan''s endogenous cultural
    absorption model was fully embodied in this economic development process. After
    the post-WWII major transformation by Western society, Japan developed a sense
    of looking up to Western culture. Therefore, under the situation where Japan''s
    own development was blocked, Japan quickly changed its strategy, introduced foreign
    technology, and took a different path.


    In the early post-war period, Japan once attached importance to independent technology
    development and achieved good results in the black-and-white TV industry, parametron
    technology, semiconductor technology, etc. But in the final contest between independent
    development and technology introduction, it almost always ended in the failure
    of independent development and the success of external introduction. Japan gradually
    realized that introducing advanced technology from abroad has many advantages,
    such as avoiding the risk of failure, reducing the economic burden of R&D, and
    shortening the time to master new technology.[[6]](#txt005.xhtml#footnote_content_txt005_6)
    After repeated exploration, Japan finally formed a path of technological innovation
    led by the introduction of foreign advanced technology. Starting from 1956, the
    focus of Japan''s technological innovation obviously tended towards introducing
    technology and advanced management concepts from the outside, combining them with
    the country''s traditional management concepts to form a model suitable for Japan''s
    national conditions and meeting the needs of economic development. Management
    innovation and technological innovation together became the "two wheels" of the
    express train of high-speed economic growth, both becoming important components
    of the "Japanese model" and the exertion of the "latecomer effect." By 1965, except
    for some cutting-edge technologies, Japan had realized the introduction of major
    advanced production technologies, and its industrial structure and export structure
    also showed a tendency towards heavy chemical industrialization; in 1971, Japan''s
    machine tool industry''s foreign trade turned from a long-term deficit to a surplus,
    marking a new stage in the localization of advanced equipment in Japan, basically
    achieving modernization. At the same time, Japan also realized that continuing
    to rely on introducing technology from the outside was becoming increasingly difficult;
    to maintain a leading position, it must continue to introduce cutting-edge technologies
    while absorbing, digesting, and continuously improving the introduced technologies.
    Japan gradually realized independent product innovation and surpassed and excelled
    over European and American countries in several fields.


    Afterward, when facing the Third Industrial Revolution, Japan encountered innovation
    failure. Entering the 1980s, in order to continue consolidating its position as
    a world economic power, the Japanese government began to readjust its science
    and technology development strategy based on changes in the international and
    domestic economic situation, proposing the strategic slogan of "Science and Technology
    Nation" (Gijutsu Rikkoku). Its landmark was the publication of the *Outlook for
    Trade and Industrial Policies in the 1980s* by the Ministry of International Trade
    and Industry (MITI) in 1980. Its entire content unfolded in close association
    with technology policy, with Chapter 6 titled "Towards a Technology-Based Nation,"
    becoming the first government document to formally propose the "Science and Technology
    Nation" strategic guideline. In October of the same year, the *White Paper on
    Science and Technology* released by the Japan Science and Technology Agency again
    clearly proposed the "Science and Technology Nation" strategy. The proposal of
    Japan''s "Science and Technology Nation" strategy marked the end of the era of
    the "absorptive" science and technology strategy of introduction, digestion, and
    imitation that Japan had long promoted since the war, and the beginning of an
    era of economic growth driven by high technology.


    After entering the 1980s, Japan''s economy had already occupied a leading position
    in the world, simultaneously replacing the US as the world''s largest creditor
    nation, with Japanese-made products flooding the globe. At that time, the Japanese
    economy was overheating; the appreciation of the yen could help Japan expand overseas
    markets, and it was under such circumstances that Japan and other countries signed
    the "Plaza Accord," which marked the turning point of the "Japanese Model." Since
    then, the Japanese economy fell into a slump due to the real estate bubble. Under
    such circumstances, the main force supporting Japan''s economic development was
    still the traditional industries that had achieved technological advantages in
    the past. This gave Japan a special sentiment towards its domestic traditional
    industries; the special preference of Japanese people for domestic products in
    daily life is also an indirect reflection. This is particularly credited to the
    Japanese government''s proposal and effective implementation of the "Science and
    Technology Nation" strategy, making Japan the world''s second-largest science
    and technology power after the US. Achieving such great scientific and technological
    achievements in just over a decade was entirely due to the science and technology
    policies adopted by Japan in the process of promoting the "Science and Technology
    Nation" strategy, which effectively consolidated the industrial achievements from
    previous development.


    Returning to Japan''s innovation policy, in science and technology development,
    private enterprises occupy a dominant position. In the national R&D expenditure
    of Japan, the portion spent by private enterprises has always maintained a high
    proportion. For example, from FY1960 to FY1990, national research expenditure
    increased 65.6 times, of which corporate research expenditure increased 74.5 times,
    university research expenditure increased 45.9 times, and government research
    expenditure increased 6.2 times. The above figures not only indicate the rapid
    growth of Japan''s national research expenditure but also show that the growth
    rate of corporate research expenditure far exceeds that of universities and government
    research institutions. Another example: in 1993, corporate R&D expenditure accounted
    for 78.4%, while government expenditure accounted for 21.6%. The proportion of
    R&D expenditure by Japanese private enterprises in national R&D expenditure is
    about 1.2 to 1.4 times that of European and American countries. This is a most
    convincing example of the dominant position of Japanese private enterprises in
    science and technology research. However, with the Japanese economic slump, after
    the 1990s, Japanese enterprises paid more attention to concentrating limited research
    funds and manpower in the fields of applied and development research.


    Looking at Japan''s innovation from the above historical process, two characteristics
    of Japan''s past innovation can be seen. The first characteristic is that Japan
    is good at utilizing the latecomer advantage in technology to form industrial
    development advantages. This is mainly manifested in the fact that when facing
    the Third Industrial Revolution, Japan was very good at actively absorbing excellent
    foreign technologies and quickly integrating them into its own industrial advantages;
    additionally, it could actively utilize technological achievements to enhance
    corporate product competitiveness, achieve technological leading advantages, and
    help the national economy achieve rapid development. The second characteristic
    is the lack of breakthroughs in disruptive innovation. In the last 20 years of
    the 20th century, the internet economy rose rapidly, and the US, China, and other
    countries produced many new internet giant enterprises, but Japan rarely saw internet
    enterprises emerge, and traditional enterprises also lost many advantages and
    opportunities in this internet wave.


    Overall, Japan''s technological innovation model has a certain connection with
    the Japanese cultural endogenous reception model. Enterprises can quickly integrate
    favorable external information into national advantages and rapidly complete integration
    utilizing their own characteristics; this is their advantage. But at the same
    time, once advantageous industries are formed, they have a certain repellency
    to emerging industries, and the loss of some industry advantages has become a
    disadvantage of this innovation model. Because of its past technology development
    model, Japan has formed a serious path dependence in technology development, causing
    enterprises to focus more on applied research to facilitate the improvement of
    economic benefits in technology development, while lacking momentum in emerging
    fields and technological innovation. Currently, all countries and enterprises
    have begun to scramble for talents and patents; the latecomer advantage of traditional
    technology is nearly extinct under the rapid development of the industry, and
    the Matthew effect produced by emerging advantageous enterprises lacking relevant
    industry norms is constantly being amplified. When facing the wave of the Fourth
    Industrial Revolution, Japan''s reliance on its past traditional innovation model
    will once again restrain Japan''s new technology development.


    In response to the impact of the Fourth Industrial Revolution, the Japanese government
    clearly proposed specific measures to realize the Fourth Industrial Revolution
    in the *Japan Revitalization Strategy 2016*, promoting AI R&D and application
    from the strategic height of industry-academia-government collaboration through
    the establishment of the "Artificial Intelligence Strategy Council." In the *5th
    Science and Technology Basic Plan* promulgated in January 2016, the Japanese government
    proposed the "Society 5.0" (Super Smart Society) strategy, believing that the
    Super Smart Society is a new social form following hunting society, agrarian society,
    industrial society, and information society, and is also a social form where cyberspace
    and physical space are highly integrated, positioning AI as the core for realizing
    Society 5.0.


    The Japanese government and business community began to attach great importance
    to AI development. On the one hand, they positioned IoT, AI, and robots as the
    core of the Fourth Industrial Revolution, established a relatively complete R&D
    promotion mechanism at the national level, and designated 2017 as the "First Year
    of AI." They hope to maintain and expand technological advantages in fields such
    as automobiles and robots through the vigorous development of AI, gradually solve
    social problems such as population aging, labor shortages, medical care, and nursing
    care, and solidly promote the construction of Society 5.0.


    Meanwhile, in the outline of Japan''s FY2019 budget, the science and technology
    field grew by 13.3% compared to FY2018, reaching 4.351 trillion yen. AI development
    and talent cultivation will be an important part of the budget, with the budget
    for cultivating AI talent at approximately 13.3 billion yen. According to Japanese
    domestic data statistics, the total AI-related budget in the Japanese government''s
    FY2018 annual budget proposal was about 77 billion yen, but the investment is
    still less than 20% of that of the US and China, leaving huge room for development
    in investment by the Japanese government and enterprises.


    Japan''s current layout for the Fourth Industrial Revolution can be summarized
    in the following two aspects. First, Japan attaches great importance to top-level
    design and strategic guidance. Japan has already positioned AI as the core of
    the construction of Society 5.0. On this basis, the Japanese government strengthens
    system and mechanism construction, government guidance, and market-oriented operation.
    It adopts a tripartite collaboration model among the Ministry of Internal Affairs
    and Communications (MIC), the Ministry of Education, Culture, Sports, Science
    and Technology (MEXT), and the Ministry of Economy, Trade and Industry (METI),
    as well as an industry-academia-government collaboration model, promoting jointly
    through division of labor and cooperation. Second, Japan fully utilizes existing
    industrial advantages for technological upgrading. Whether it is Society 5.0,
    the Robot Strategy, or the AI layout, they are all based on Japan''s own industrial
    advantages. Japanese enterprises'' industrial strengths lie in automobiles, robots,
    medical care, and other fields, and their AI R&D also focuses on these fields.
    And combining the market demand for intelligent robots in health and nursing care
    in an aging society, as well as the construction of Society 5.0 as the main driving
    force, highlighting the characteristics of "hardware driving software" and "innovative
    social demand driving industry," with very strong pertinence, fully highlighting
    the main theme of enterprise commercial application.


    From this perspective, regarding the changes of the Fourth Industrial Revolution,
    both the Japanese government and corporate executives are fully aware of the important
    role of AI in achieving economic take-off this time, and Japan has considerable
    historical accumulation in this regard. From the perspective of objective conditions,
    Japan''s response to the Fourth Industrial Revolution is obviously much more composed
    than when facing the Third Industrial Revolution, but the problems faced still
    exist. When the country faces a completely new industrial wave, it does not have
    complete successful experience. Therefore, breaking the innovation path dependence
    should become a key problem that Japan must focus on solving during the Fourth
    Industrial Revolution. Japan needs to consider how to find a new technological
    innovation path to face the Fourth Industrial Revolution from past successful
    or failed experiences.


    ### Sharing: Privacy Protection and the Boundaries of Technology


    Japan''s protection of privacy far exceeds that of other countries. Just as they
    dislike troubling others, they reject interdependent relationships between people
    and loathe the psychology of dependency. Such a way of getting along that keeps
    others at a respectful distance forms the greatest privacy protection in Japanese
    society. Not only in terms of personal privacy, but Japan also has a kind of group
    privacy protection, which has an even more significant impact on the socio-economy.[[7]](#txt005.xhtml#footnote_content_txt005_7)
    Japan''s group privacy is very special. Within the family, it emphasizes that
    "family disgrace should not be made public" (family scandals should not be spread
    outside); within the company group, it values "harmony is precious" (wa), and
    employees'' daily social activities are entirely concentrated inside the company
    (kaisha), minimizing communication with external personnel. This special privacy
    culture also has a huge impact on the Fourth Industrial Revolution.


