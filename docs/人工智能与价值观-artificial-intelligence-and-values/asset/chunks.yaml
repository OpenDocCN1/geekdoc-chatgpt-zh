  trans: '

    # Integration and Mastery: Ultimate Truth and Goodness, Technology for the People


    China missed the development opportunities brought by the first three industrial
    revolutions and long remained in a follower position in technology. The fourth
    industrial revolution, with artificial intelligence at its core, has brought new
    development opportunities to China. China has striven to catch up, moving towards
    running alongside leaders, and even leading in some fields. As a populous nation,
    China emphasizes AI''s leading and driving role in the economy, accelerating the
    development of various economic and social fields from networking and digitalization
    toward intelligentization. Guided by the *New Generation Artificial Intelligence
    Development Plan* issued in 2017, the main thread is to accelerate the deep integration
    of AI with the economy, society, and other fields; the main direction of attack
    is to enhance the scientific and technological innovation capacity of the new
    generation of AI; the goals are to develop an intelligent economy, build an intelligent
    society, and safeguard national security.


    ## Building an Open and Shared Innovation System


    Technology plays an unprecedentedly important role in China''s modernization process.
    China''s *13th Five-Year Plan for National Scientific and Technological Innovation*
    states that we must adhere to "technology for the people" as the fundamental purpose.
    Closely focusing on the immediate interests and urgent needs of the people, we
    must combine scientific and technological innovation with improving people''s
    livelihood and well-being, leveraging the important role of innovation in raising
    living standards, enhancing the scientific, cultural, and health qualities of
    the whole nation, promoting high-quality employment and entrepreneurship, poverty
    alleviation, and building a resource-conserving, environment-friendly society.
    We must let more innovation achievements be shared by the people and enhance the
    public''s sense of gain.


    China attaches great importance to the tremendous energy released by AI as the
    core driving force of a new round of industrial transformation, elevating AI to
    a national strategy and issuing the dedicated *New Generation Artificial Intelligence
    Development Plan*. The plan makes overall arrangements for seizing major strategic
    opportunities for future social development, building first-mover advantages in
    AI, accelerating the construction of an innovative country and a world science
    and technology power. It continuously refines key areas of the intelligent industry,
    intelligent products, and intelligent life, guiding AI to better empower the transformation
    and upgrading of traditional industries toward intelligentization, and accelerate
    deep integration with the real economy. Guided by market demand and targeting
    industrial application, it stimulates the vitality and endogenous momentum of
    enterprise innovation, explores methods and paths for the transformation and landing
    of AI achievements, and actively constructs an intelligent economic form driven
    by data and characterized by co-creation and sharing.


    In the future, AI will be ubiquitous. Definitions vary across different fields
    or research purposes, but "essentially, AI refers to intelligence created artificially,
    corresponding to ''natural intelligence'' formed by biological evolution, particularly
    ''human intelligence'' with the highest wisdom. The biggest difference between
    AI and natural intelligence in the process of intelligence formation lies in three
    links: memory, analysis and reasoning, and decision-making" [[37]](#txt006.xhtml#footnote_content_txt006_37).
    It is precisely these three differences that make people realize that current
    so-called intelligent activities are mainly imitations of human behavior, and
    the essence of AI is computation. Intelligent activities have been widely and
    maturely applied in algorithmic recommendation, algorithmic decision-making, data
    evaluation, data analysis, and other aspects. On the positive side, AI can indeed
    help us better understand the external world and improve work efficiency. As a
    technology, AI can compensate for human shortcomings in certain "capabilities,"
    such as information collection and processing; whether in the magnitude of collection
    or processing speed, humans are left far behind. However, on the negative side,
    problems triggered by intelligence may also threaten human survival itself. Chinese
    society emphasizes that the ultimate purpose of technology is to serve the people,
    closely focusing on people''s living needs, and vigorously developing intelligent
    products and industries. It is generally accepted that AI development is currently
    still in the early stage of weak AI, and there is no need to worry about the approaching
    singularity or irreconcilable man-machine contradictions triggered by strong AI
    development. In comparison, solving the interpretability problem of deep learning
    is imminent. This issue directly relates to whether and how people use AI in certain
    scenarios. Chinese scientists and algorithm researchers maintain a positive attitude,
    striving to find explanation mechanisms and achieving phased results.


    AI-related industries are crucial future-oriented industries for gaining advantages
    in global competition. AI research and the response to ethical issues are inseparable
    from the intellectual support provided by various high-level talents; the construction
    of AI talent teams is extremely important. According to an iResearch (Analysys)
    report analysis [[38]](#txt006.xhtml#footnote_content_txt006_38), China emphasizes
    building a university education system integrating AI professional education,
    vocational education, and basic university education, emphasizing the establishment
    of "AI+X" related interdisciplinary disciplines at the graduate level, and cultivating
    AI applied talents at different levels. Although Chinese universities started
    curriculum settings relatively late, they are currently catching up. The cultivation
    of AI applied talents in China is strongly promoted by the government and education
    departments, serving the development of the AI industry and accelerating the cultivation
    of innovative applied talents meeting the needs of AI field development.


    After years of continuous accumulation, China has made significant progress in
    the AI field. "In 2020, the citation count of China''s AI journal papers worldwide
    surpassed that of the United States for the first time" [[39]](#txt006.xhtml#footnote_content_txt006_39).
    AI innovation and entrepreneurship are increasingly active, a batch of leading
    backbone enterprises are growing rapidly, gaining extensive attention and recognition
    internationally. Four companies—Baidu, Alibaba, Tencent, and Huawei (BATH)—leveraging
    their respective accumulated advantages and experience in the internet and informatization
    fields, have launched specialized business group layouts oriented toward AI implementation,
    carrying out large-scale internal organizational structure and technical system
    adjustments. On the one hand, they provide data and service support for small
    and medium-sized AI enterprises; on the other hand, they build AI scientific and
    technological innovation systems in their respective advantageous fields, fully
    deploying business at the specific technical level and scenario application level,
    leading the development of China''s AI industry. In 2017, China announced the
    first batch of National New Generation AI Open Innovation Platforms: the Autonomous
    Driving platform relying on Baidu, the City Brain platform relying on Alibaba
    Cloud, the Medical Imaging platform relying on Tencent, and the Intelligent Speech
    platform relying on iFlytek. These four platforms play roles in various AI fields:
    Baidu''s autonomous driving helps partners in the automotive and autonomous driving
    fields combine vehicle and hardware systems to quickly build a set of autonomous
    driving systems; Tencent''s AI medical imaging product—Tencent AIMIS—is the first
    AI esophageal cancer screening system with an accuracy rate exceeding 90%; regarding
    pulmonary nodules, AIMIS can detect tiny nodules of 3mm and above, with a detection
    accuracy exceeding 95% [[40]](#txt006.xhtml#footnote_content_txt006_40).


    The application scope of AI is extremely broad and the industry prospects are
    promising. In economic life, AI participates in enterprise management and production
    processes, providing targeted products and services to consumers, while meeting
    consumers'' latent needs through data insight and analysis. AI has met new needs
    of economic production and generated positive feedback in manufacturing, logistics
    warehousing and distribution, market sales and supply chain turnover, etc. In
    smart agriculture, AI is used to support data collection and processing, help
    monitor agricultural conditions, pest control, etc., and can cover the entire
    process from production planning to terminal sales. Tencent AI Lab experts once
    built a simulator simulating climate environment and crop growth; supported by
    remote sensing technology, they grew over 3,000 kg of cucumbers in a 50 m² greenhouse,
    reaching a planting level equivalent to a human grower with 10 years of experience
    [[41]](#txt006.xhtml#footnote_content_txt006_41). In political life, intelligentization
    helps upgrade the level of government services to the people. Using AI to empower
    grassroots workers can greatly improve their work efficiency and effectively alleviate
    and improve the human resource limitations of government service departments.
    It enables precise sorting and analysis of all links in the government service
    process, effectively identifying redundant links, significantly improving handling
    efficiency, and reducing administrative delays. It realizes the circulation of
    licenses, documents, official papers, etc., and the transmission of process data
    at efficiencies multiple times that of human labor. Through AI applications, it
    mines the value of approval data information and manages knowledge. It quickly
    understands service recipients'' needs and customizes services; identifies key
    enterprise personnel to enhance decision-making pertinence; accurately grasps
    the public''s service needs and potential difficulties; effectively collects,
    stores, and analyzes public suggestions and opinions on government service processes,
    work content, work attitudes, etc., making targeted improvements to shortcomings;
    aggregates personalized service data, analyzes public behavior habits through
    big data mining, intelligently pushes information of high public concern and closely
    related to the public, providing personalized, push-based services, etc., facilitating
    the development of smart government affairs and urban governance.


    As early as 2016, the National Development and Reform Commission, the Ministry
    of Science and Technology, the Ministry of Industry and Information Technology,
    and the Cyberspace Administration of China jointly issued and implemented the
    *Three-Year Action Implementation Plan for "Internet Plus" Artificial Intelligence*,
    implementing the development concepts of innovation, coordination, green, openness,
    and sharing, and proposing a series of measures from scientific research, application
    promotion, and industrial development. In July 2017, the State Council issued
    the *New Generation Artificial Intelligence Development Plan*, clarifying the
    three-step strategic goals for AI development: by 2030, China''s AI theory, technology,
    and application will generally reach world-leading levels, becoming a major global
    AI innovation center. The plan points out the need to focus on increasing the
    source supply of AI innovation, strengthening deployment in frontier basic theory,
    key common technologies, basic platforms, and talent teams, promoting open source
    and sharing, systematically enhancing sustainable innovation capacity, ensuring
    China''s AI scientific and technological level ranks among the world''s best,
    and making greater contributions to world AI development. In the same year, AI
    was written into the Government Work Report for the first time. The report stated:
    accelerate the cultivation and expansion of emerging industries. Fully implement
    the development plan for strategic emerging industries, accelerate technology
    R&D and transformation in new materials, new energy, AI, integrated circuits,
    biopharmaceuticals, fifth-generation mobile communications, etc., and expand and
    strengthen industrial clusters.

