- raw: "伴随技术的成熟与应用场景的铺开，人工智能正加速渗透到人们生产生活的方方面面。这样的现实与人的存在价值的冲突日益凸显：人的存在的价值是不是应该完全用其能否适应智能机器来衡量？人工智能对普通劳动乃至专业技术劳动的冲击，会不会在范围、规模、深度和力度上引发前所未有的全局性危机？对此，德国技术哲学家京特·安德斯（Gunther\
    \ Anders）指出，虽然人们一再强调“创造是人的天性”，但当人们面对其创造物时，却越来越有一种自愧不如与自惭形秽的羞愧，这种羞愧是技术发展和人的本质之间产生的落差所引起的，堪称“普罗米修斯的羞愧”。在普罗米修斯的羞愧中，人也同样把他所制造出来的东西高高地置于自己的价值之上，他赋予产品一种远远高于自身的存在价值。在人工智能面前，这种“创造与被创造关系的倒置”使人成了过时的人。[\\\
    [12\\]](#txt002.xhtml#footnote_content_txt002_12)\n\n人工智能带来的价值体系的重塑并不会在短期内实现，而是需要长时间的认知过程和技术发展过程。随着人类对智能机器的依赖程度不断加深，直面数据挖掘、机器学习与智能推荐的技术进步，追寻算法中人本价值观与技术创新观的适度张力，强调工具理性与价值理性的平衡，是探讨人工智能发展对价值观的影响时所应秉承的理念。\n\
