- raw: '价值观的多样性必然引发价值观的冲突。现代社会价值观的冲突具有广泛性和复杂性，它表现为个人与个人之间，个人与群体、社会之间，以及群体与群体之间的价值观冲突。[\[9\]](#txt001.xhtml#footnote_content_txt001_9)在效率与公平、自由与平等、利益与道义、环境价值与经济价值等一系列重要问题上，不同主体常常得出不同的乃至截然相反的看法；同一个主体在不同领域、不同方面的价值取向也往往呈现出多变性与矛盾性。这些矛盾和冲突实质上源于不同形态的价值观，如传统价值观与现代价值观、本土价值观与外来价值观、主导价值观与非主导价值观、宗教价值观和世俗价值观、精英价值观与大众价值观等之间的一系列的矛盾和冲突。不存在一个抽象的、永恒不变的、适应于任何时代、任何民族、任何阶级的价值观。不同的价值观，体现着不同的民族、阶级、社会集团对价值关系应然状态的期盼与展示。


    ## 价值观的变与不变


    作为社会意识系统的有机组成部分，价值观在形成后将渗入人们的一切价值活动之中，是人们进行价值评价、选择、创造的导向和依据。只要人们始终站在现实历史的基础上，不是从观念出发来解释实践，而是从物质实践出发来解释观念的形成，[\[10\]](#txt001.xhtml#footnote_content_txt001_10)那么价值观就必然是建构在一定的社会经济基础之上的，是一定时代人们的社会存在、社会实践、生活经历的产物和表现，是一定时代文化传统、生活方式、风俗习惯、社会心理等因素潜移默化地濡染和熏陶的结果。


    作为文化系统的深层结构，价值观具有相对的持久性或延续性，在相当长的时期内会自觉或不自觉地发挥作用，影响和支配人们的思想和行为。在特定的时间、地点、条件下，人们的价值观总是相对稳定的。例如，对某种事物的好坏总有一个看法和评价，在条件不变的情况下，这种看法不会骤然改变。


    但是，人们的观念、观点和概念，随着人们的生活条件、人们的社会关系、人们的社会存在的改变而改变。[\[11\]](#txt001.xhtml#footnote_content_txt001_11)价值观的不变是相对的，它必然会随着时代发展而发展、变革而变革，并随时接受人们的社会生活实践的检验、修正和完善。在社会发展平稳时期，价值观寓于日常生活之中，人们只是自觉或不自觉地听从它的导引。而在社会变革时期，新旧价值观常常产生碰撞、发生冲突，对价值观的比较、反思、批判、变革就会随之提上日程。社会变革的初期，价值观出现多元、紊乱和失序的情况，许多人感到茫然失措和无所适从。接下来，维护旧秩序的价值观和反映历史进步要求的价值观发生激烈的冲突，旧价值观的缺陷逐渐显现，而某些新的价值观则开始展示强大的生命力，得到大众的认同和拥护。最后，经过理性的论证，特别是实践的检验，人们选择和接受新的价值观，从而完成价值观的新旧交替。这种情况不只出现在历史上社会形态发生重大变革之时，即使在同一社会形态中，当社会生活发生巨大变革的时候，也可能会出现。


    全球范围内，已有多项跨代际的长期调查试图研究价值观的变迁问题。1953年至1988年间，日本统计数理研究所国民性调查委员会每隔五年就进行一次关于日本国民性的调查。日本社会学者在“日本的国民性研究”这一题目下，以5年为一个周期进行了30余年的价值观调查工作，其意图主要是了解日本国民舆论、态度、价值观的变革，并根据调查的结果编辑出版了五本《日本人的国民性》。[\[12\]](#txt001.xhtml#footnote_content_txt001_12)在1972—1993年的20余年间，津留宏、坂捌一、秋叶英则等日本社会学研究者又对“现代日本青年价值观的发展和变迁”进行了较为系统的研究。[\[13\]](#txt001.xhtml#footnote_content_txt001_13)1970年代末，由欧洲价值观体系研究集团（the
    European Value System Study Group，EVSSG）发起了针对西欧10个国家的大型跨国调查项目欧洲价值观调查（European
    Value Survey，EVS），调查结果显示受访国家居民在政治、家庭、宗教、性别等价值观念上存在较大差异。[\[14\]](#txt001.xhtml#footnote_content_txt001_14)1980年，荷兰心理学家吉尔特·霍夫斯塔德（Geert
    Hofstede）基于对40个国家、超过116000人不同职业价值观的研究，将不同文化间的差异归纳为六个基本的文化价值观维度，开创了文化差异研究的先河。[\[15\]](#txt001.xhtml#footnote_content_txt001_15)这些研究方法颠覆了研究社会问题时传统单一的东西方地理划分，将包括种族血统、历史、自然环境等社会研究中的变量通过基础价值观反映出来，以更为宽广的视角理解社会变迁。


    20世纪70年代的西方发达工业社会中，民众的价值类型出现明显的代际变化，形成物质主义价值观与后物质主义价值观的分野。英格尔哈特提出的价值观变迁理论是当今政治文化研究领域中的重要理论之一，这一论断在随后数十年的价值观调查研究中反复得以佐证。[\[16\]](#txt001.xhtml#footnote_content_txt001_16)英格尔哈特指出，急剧的社会变革之中，一方面是等级制权力、爱国主义和宗教等的合法性的降低所导致的对制度的信任度降低；另一方面是新价值的政治表达受制于精英与群众政治技能平衡的变化。[\[17\]](#txt001.xhtml#footnote_content_txt001_17)他所考察的价值观变迁进程（见图1-2）如下：


    ![img](images/txt001_2.jpg)


    图1-2　英格尔哈特考察的价值观变迁进程


    在英格尔哈特看来，某些基本的价值和技能看起来正以一种渐进的但根深蒂固的方式发生着变化，价值观变迁的两种进程互相强化，深刻影响着社会政治结构的变革。价值、技能与结构三个变量共同决定着政治变迁的路径，价值观变迁理论的核心理念也是围绕着这三个变量而展开的。


    就价值观变迁对现实政治生活的当代意义而言，价值观变迁关系到整个社会的政治分裂程度、政治参与的议题和有效性，以及社会思潮的传播与蔓延。民众的价值观是政治文化的核心，它指导着人们在政治生活中的各项选择，如选择什么样的政体、什么样的规则来促进权力的运用，赋予政治组织什么样的目的，并以什么样的态度对待政治组织：信仰抑或怀疑，参与还是疏离，支持还是挑战等。


    从社会发展动力的角度看来，价值观在引导人类产生社会行为并进一步推动社会进步的过程中起着至关重要的作用。工业革命以来许多国家的社会发展以经济增长为主，与此相匹配的是“现代性”价值观，它被广泛认为是一种经济主导型观念，一直视“经济增长”为解决贫富差异、环境破坏和其他社会问题的最终力量。但是，近现代许多经济学家和社会学家已经不再肯定这种经济主导型价值观，如美国后现代思想家约翰·科布（John
    B.Cobb，Jr.）从宏观经济学和公共政策的角度对“经济增长解决社会问题”的观念进行了斥责。他认为，单纯的经济发展不能解决第三世界国家人口过度增长问题，不足以帮助人们产生正确的环境观，它会阻碍卫生、教育、文化以及政治上人权及民主的发展。[\[18\]](#txt001.xhtml#footnote_content_txt001_18)今天普通民众关注公共事业的重心已经发生转移，现代社会经济发展观念急需转变的思想得到支持。例如，现在许多国家的人们都在关注着贫富差距、环境保护、教育投入、食品与医药安全等话题，而不再只是国内生产总值（GDP）。


    这种价值观转变极有可能会像工业革命后技术进步推动世界经济发展那样，成为未来社会变迁的重要动力。另一个广泛的共识是，决定社会发展方向的很大一部分力量是来自整个社会群体的意志，这些意志或价值观通过各种机制转化为行为乃至动力来指导以后的社会发展。这样看来，如果我们研究社会群体的基础价值观及其转变，并通过它们得到不同国家和地区在经济发展以外的政治文化上的解释，那么就能够进一步探寻这些社会的发展变迁问题，而不至于被经济数据所蒙蔽。


    此外，一些学者指出，改革开放以来中国社会处于加速转型之中。加速转型的重要结果之一就是“时空压缩”，即在同一个时空范围内呈现出了传统社会的前现代性、现代工业社会的现代性和后工业社会的后现代性的共存。[\[19\]](#txt001.xhtml#footnote_content_txt001_19)共存的前现代性、现代性和后现代性分别具有相应的价值观内涵，这也就意味着价值观的交锋和交替也将在中国长期共存。


    ## 技术驱动下价值观的历史嬗变


    20世纪以来，科学技术的快速发展开启了人类文明新时代的大门。科学技术取得的重大成果迅速转化成科技产品，深入到人们的社会生活、生产的方方面面，全面地影响并改变了人类的思维方式和行为模式，成为社会及人们的日常生活的控制因素。


    多数哲学家承认价值观与科学技术之间的相互影响是显而易见的，进行科学研究的首要原因是理解和认识世界具有重要的价值。其中，真理性、客观性和经验充分性等价值观对科学事业来说至关重要，它们也被普遍认可为优秀理论应有的特征，有助于我们认识这个世界。也有哲学家认为某些价值观与科学无涉，英国哲学家伯特兰·罗素（Bertrand
    Russell）即认为：鉴于科学只关心事实，公正与否等价值观因素根本就不在其考虑范围内。[\[20\]](#txt001.xhtml#footnote_content_txt001_20)


    关于技术本身价值的研究一直是一个存在着颇多争议的领域，技术中性论与技术价值论之间的争议由来已久。持“技术中性论”观点者否认技术有其社会作用和社会影响、技术应用可服务于不同的社会目的，认为技术本身是中性的。例如德国生态哲学家汉斯·萨克塞（Hans
    Sachsse）认为：“由于技术只是方法，只是工具，技术行为目的总是存在于技术之外。”[\[21\]](#txt001.xhtml#footnote_content_txt001_21)另外一些学者则认为技术与技术的运用和后果并非绝对分立，技术本身是负荷价值的，技术是加工、处理、控制物质、能量、信息，进而实现一定价值目的的过程。加拿大哲学家、物理学家马里奥·邦格（Mario
    Bunge）就认为：“技术在伦理上绝不是中性的，它涉及伦理学，并且游移在善和恶之间。”[\[22\]](#txt001.xhtml#footnote_content_txt001_22)


    恩格斯指出，“马克思把科学技术首先看成是历史的有力杠杆，看成是最高意义上的革命力量。”[\[23\]](#txt001.xhtml#footnote_content_txt001_23)随着科学技术的迅猛扩张，人的主体性地位逐渐消失，科学技术转而成为资本主义社会的主导因素。科学技术既增强了人类征服和改造自然的能力，成为人们从必然王国走向自由王国的保证，同时也为新社会创造了必要的物质基础。关于技术与价值领域的问题，西方学者一直给予了充分的关注。法兰克福学派就从价值观的角度对科学技术进行了深刻的理论反思和批判，以期重塑以人为价值主体的科学技术价值观。学派早期代表、创始人霍克海默（Max
    Horkheimer）结合资本主义新的发展形势，以工具理性为主要批判对象，否定了资本主义统摄下科学技术的价值取向。他认为：“科学技术不再以人为价值主体，其取消了自身对意义的追求，成为资产阶级对人的操纵手段，异化为资产阶级的统治工具。”[\[24\]](#txt001.xhtml#footnote_content_txt001_24)


    技术的自然属性和社会属性在技术社会化进程中不断被放大，从而导致了技术驱动的力量在自然、社会和人本层面的强化。同时，技术内在价值的两重性和技术应用的两重性有着必然的内在联系。因此，要探究技术发展对价值观的影响，就不能回避对技术本质、技术价值两重性、技术应用两重性、技术应用的过程意义和终极价值等方面进行多层面的剖析。因此，美国技术哲学家约瑟夫·皮特（Joseph
    C.Pitt）提出：“如果技术反映了我们的价值体系，或者即使它们仅仅影响了我们社会的经济结构，我们就应该知道这意味着什么以及它是如何发生的。”[\[25\]](#txt001.xhtml#footnote_content_txt001_25)另一位美国技术哲学家卡尔·米切姆（Carl
    Mitcham）也认为：“未来的技术哲学研究，将更注重对技术应用过程意义与价值的考察”，同时“这种技术应用的意义与价值的定位，显然必须在一个动态的伦理层面上去考察”。[\[26\]](#txt001.xhtml#footnote_content_txt001_26)


    除了哲学家以外，科学家也在追问科学技术的价值。美国著名物理学家理查德·费曼（Richard P.Feynman）在参与原子弹的制造工作之后，开始反思自己年轻时对科学价值的思考，他提出了这样的问题：“当我们看到科学也可以带来灾难时，那么我如此热爱，并且毕生孜孜为之的科学事业的价值究竟何在？”


    费曼自己对这个问题的回答是：“科学的价值的第一点是众所周知的。科学知识使人们能制造许多产品、做许多事业。当然，当人们运用科学做了善事的时候，功劳不仅归于科学本身，而且也归于指导着我们的道德选择。科学知识给予人们能力去行善，也可以作恶，它本身可并没有附带着使用说明。这种能力显然是有价值的，尽管好坏决定于如何使用它。”


    科学的另一个价值是提供智慧与思辨的享受。一些人可以从阅读、学习、思考中得到这种享受，而另一些人则要从真正的深入研究中得到满足。这种智慧思辨享受的重要性往往被人们忽视，特别是那些喋喋不休地教导科学家要承担社会责任的先生们。


    另外一个不容低估的科学的价值是它改变了人们对世界的概念。由于科学的发展，我们今天可以想象无穷奇妙的东西，比诗人和梦想者的想象丰富离奇千万倍。自然的想象和多姿比人类要高明得多。例如，诗人想象巨大的海龟驮着大象到海里旅行；而科学给了我们一幅图画——天宇中一个巨大的球在旋转，在它的表面，人们被神奇的引力吸住，并附着它在旋转。[\[27\]](#txt001.xhtml#footnote_content_txt001_27)


    伴随着技术价值的产生、技术价值的增值以及技术的应用，人类社会历史上价值观的嬗变是否可以说体现在自然、社会和人本三个层面上的技术价值的实现之中？同时，我们是否也应承认，技术的正负价值是相对而言的，不存在绝对的正价值和绝对的负价值，技术价值的正负属性在一定的条件下是可以相互转化的。


    费曼思考了技术驱动下价值观变迁的两种可能走向：一方面，人们创造技术是为了利用它，人们使用技术是因为它有可利用的正价值，但技术（价值）只要被应用，就总会产生积极的和消极的影响——正价值和负价值总是同时或先后实现；如农药作为一种技术产品，它的应用可以使农作物高产——实现正价值，但同时也污染了环境和食物，给人类健康造成危害——实现负价值。另一方面，技术可能带来的毁灭性后果不一定是绝对的坏事、绝对的负面影响，例如，原子弹的应用因其巨大的杀伤力成为世界和平最大的潜在威胁之一，但它也能为爱好和平的人们抗衡核威胁提供保障。


    正如核技术的诞生极大地影响了20世纪人类文明的发展进程一样，人工智能在21世纪将对人类社会带来前所未有的巨大挑战。生物科学、计算科学的发展，未来仿生生命极有可能威胁人类世界，科幻电影、科幻文学都表述过这种担忧，即在未来某个时间点，人工智能可能会颠覆人类世界的统治，会导致毁灭性灾难的来临。而当下，我们正生活在一个任何人都无法摆脱数据的大数据时代，人工智能不断地塑造并改变人类的日常生活与社会行为，例如在城市管理中，智能手机的位置定位功能有助于掌握人口密度与人员流动信息；共享单车的使用轨迹有助于优化城市道路建设，这些在过去都是无法想象的。


    如上所述，人工智能世界是数字化行为构成的世界，大数据使数据的用途发生了质变，智能机器与数据世界的互动使人类进入了利用大数据进行预测或决策的新时代。算法是实现人工智能对现实世界产生影响的基础。一些乐观主义者倡导用算法判断取代人的判断，这种观点延续了“技术决定论”的传播研究路径，忽视了算法设计的社会建构功能，也遮蔽了人工智能的技术风险和社会影响。在某种意义上讲，算法只是一种工具，它不能完全区隔价值观、抽离价值观。文化是先于算法设计而存在的，植根于现存的社会制度、实践、态度及其价值取向之中，通过设计者的设计理念和预期嵌入到程序设计之中。技术决定论或技术乐观派是否会导致整体上对技术的历史和哲学的无知？技术的发展是否将加强对生活世界的殖民统治，并通过扩大技术对人的控制破坏生活世界的意义，进一步约束人类的自主性？悲观主义者认为，最终科学技术畅通无阻地占据人的生活领域，导致德国哲学家埃里希·弗罗姆（Erich
    Fromm）所预言的“一个致力于最大规模的物质生产和消费的，由计算机所控制的完全机械化的新社会”[\[28\]](#txt001.xhtml#footnote_content_txt001_28)。


    人工智能可能从根本上改变了迄今为止由传统和人类价值加以调控的行为，它实际上创造了一种新的社会，这个社会不仅仅只是旧社会的现代版本。这个崭新的社会将由何种价值观主导？2018年，著名华人科学家、人工智能研究者李飞飞在《如何让AI更加人性化》一文中表达了对人工智能发展的兴奋与担忧，并提出“以人为中心的AI”发展道路，期望引导人工智能成为人类社会生活进步的一股力量。[\[29\]](#txt001.xhtml#footnote_content_txt001_29)同时她反驳了机器无价值观的观点，她认为机器的价值观就是人类的价值观，这是首次有人工智能专家将人工智能价值观与人类价值观等而论之。在李飞飞看来，“以人为中心的AI”包含三大主旨：一是让人工智能更好地反映人类的深层智能；二是人工智能应帮助人类变得更强，而不是替代人类；三是确保人工智能在发展过程中对人类的影响得到正确的引导。


    作为实证主义土壤中诞生的技术科学集大成者，人工智能是近代技术理性登峰造极的产物，但是人工智能具有一个与其他技术与众不同的特点：对技术发明者的反身性，如同人们认为认知科学可能会消解认识论一样，人工智能则有可能消解人类的创造性本质。[\[30\]](#txt001.xhtml#footnote_content_txt001_30)多数面向人工智能领域的价值观研究方案思考的，大都是人类怎样将自己现有的价值观植入到智能机器。如果局限于自然人类的立足点，人类和智能机器的关系就会出现很多悖论情景，这就是李飞飞所强调的人工智能价值观的重要性所在，在人工智能发展日新月异的当下，人类需要超越自己具有特定历史局限的视角，才能进一步探索其内涵。


    ## 本章小结'
  fmt: '

    ## 价值观的多样性与冲突


    价值观的多样性必然引发价值观的冲突。现代社会价值观的冲突具有广泛性和复杂性，它表现为个人与个人之间，个人与群体、社会之间，以及群体与群体之间的价值观冲突。[\[9\]](#txt001.xhtml#footnote_content_txt001_9)在效率与公平、自由与平等、利益与道义、环境价值与经济价值等一系列重要问题上，不同主体常常得出不同的乃至截然相反的看法；同一个主体在不同领域、不同方面的价值取向也往往呈现出多变性与矛盾性。这些矛盾和冲突实质上源于不同形态的价值观，如传统价值观与现代价值观、本土价值观与外来价值观、主导价值观与非主导价值观、宗教价值观和世俗价值观、精英价值观与大众价值观等之间的一系列的矛盾和冲突。不存在一个抽象的、永恒不变的、适应于任何时代、任何民族、任何阶级的价值观。不同的价值观，体现着不同的民族、阶级、社会集团对价值关系应然状态的期盼与展示。


    ## 价值观的变与不变


    作为社会意识系统的有机组成部分，价值观在形成后将渗入人们的一切价值活动之中，是人们进行价值评价、选择、创造的导向和依据。只要人们始终站在现实历史的基础上，不是从观念出发来解释实践，而是从物质实践出发来解释观念的形成，[\[10\]](#txt001.xhtml#footnote_content_txt001_10)那么价值观就必然是建构在一定的社会经济基础之上的，是一定时代人们的社会存在、社会实践、生活经历的产物和表现，是一定时代文化传统、生活方式、风俗习惯、社会心理等因素潜移默化地濡染和熏陶的结果。


    作为文化系统的深层结构，价值观具有相对的持久性或延续性，在相当长的时期内会自觉或不自觉地发挥作用，影响和支配人们的思想和行为。在特定的时间、地点、条件下，人们的价值观总是相对稳定的。例如，对某种事物的好坏总有一个看法和评价，在条件不变的情况下，这种看法不会骤然改变。


    但是，人们的观念、观点和概念，随着人们的生活条件、人们的社会关系、人们的社会存在的改变而改变。[\[11\]](#txt001.xhtml#footnote_content_txt001_11)价值观的不变是相对的，它必然会随着时代发展而发展、变革而变革，并随时接受人们的社会生活实践的检验、修正和完善。在社会发展平稳时期，价值观寓于日常生活之中，人们只是自觉或不自觉地听从它的导引。而在社会变革时期，新旧价值观常常产生碰撞、发生冲突，对价值观的比较、反思、批判、变革就会随之提上日程。社会变革的初期，价值观出现多元、紊乱和失序的情况，许多人感到茫然失措和无所适从。接下来，维护旧秩序的价值观和反映历史进步要求的价值观发生激烈的冲突，旧价值观的缺陷逐渐显现，而某些新的价值观则开始展示强大的生命力，得到大众的认同和拥护。最后，经过理性的论证，特别是实践的检验，人们选择和接受新的价值观，从而完成价值观的新旧交替。这种情况不只出现在历史上社会形态发生重大变革之时，即使在同一社会形态中，当社会生活发生巨大变革的时候，也可能会出现。


    全球范围内，已有多项跨代际的长期调查试图研究价值观的变迁问题。1953年至1988年间，日本统计数理研究所国民性调查委员会每隔五年就进行一次关于日本国民性的调查。日本社会学者在“日本的国民性研究”这一题目下，以5年为一个周期进行了30余年的价值观调查工作，其意图主要是了解日本国民舆论、态度、价值观的变革，并根据调查的结果编辑出版了五本《日本人的国民性》。[\[12\]](#txt001.xhtml#footnote_content_txt001_12)在1972—1993年的20余年间，津留宏、坂捌一、秋叶英则等日本社会学研究者又对“现代日本青年价值观的发展和变迁”进行了较为系统的研究。[\[13\]](#txt001.xhtml#footnote_content_txt001_13)1970年代末，由欧洲价值观体系研究集团（the
    European Value System Study Group，EVSSG）发起了针对西欧10个国家的大型跨国调查项目欧洲价值观调查（European
    Value Survey，EVS），调查结果显示受访国家居民在政治、家庭、宗教、性别等价值观念上存在较大差异。[\[14\]](#txt001.xhtml#footnote_content_txt001_14)1980年，荷兰心理学家吉尔特·霍夫斯塔德（Geert
    Hofstede）基于对40个国家、超过116000人不同职业价值观的研究，将不同文化间的差异归纳为六个基本的文化价值观维度，开创了文化差异研究的先河。[\[15\]](#txt001.xhtml#footnote_content_txt001_15)这些研究方法颠覆了研究社会问题时传统单一的东西方地理划分，将包括种族血统、历史、自然环境等社会研究中的变量通过基础价值观反映出来，以更为宽广的视角理解社会变迁。


    20世纪70年代的西方发达工业社会中，民众的价值类型出现明显的代际变化，形成物质主义价值观与后物质主义价值观的分野。英格尔哈特提出的价值观变迁理论是当今政治文化研究领域中的重要理论之一，这一论断在随后数十年的价值观调查研究中反复得以佐证。[\[16\]](#txt001.xhtml#footnote_content_txt001_16)英格尔哈特指出，急剧的社会变革之中，一方面是等级制权力、爱国主义和宗教等的合法性的降低所导致的对制度的信任度降低；另一方面是新价值的政治表达受制于精英与群众政治技能平衡的变化。[\[17\]](#txt001.xhtml#footnote_content_txt001_17)他所考察的价值观变迁进程（见图1-2）如下：


    ![img](images/txt001_2.jpg)


    图1-2　英格尔哈特考察的价值观变迁进程


    在英格尔哈特看来，某些基本的价值和技能看起来正以一种渐进的但根深蒂固的方式发生着变化，价值观变迁的两种进程互相强化，深刻影响着社会政治结构的变革。价值、技能与结构三个变量共同决定着政治变迁的路径，价值观变迁理论的核心理念也是围绕着这三个变量而展开的。


    就价值观变迁对现实政治生活的当代意义而言，价值观变迁关系到整个社会的政治分裂程度、政治参与的议题和有效性，以及社会思潮的传播与蔓延。民众的价值观是政治文化的核心，它指导着人们在政治生活中的各项选择，如选择什么样的政体、什么样的规则来促进权力的运用，赋予政治组织什么样的目的，并以什么样的态度对待政治组织：信仰抑或怀疑，参与还是疏离，支持还是挑战等。


    从社会发展动力的角度看来，价值观在引导人类产生社会行为并进一步推动社会进步的过程中起着至关重要的作用。工业革命以来许多国家的社会发展以经济增长为主，与此相匹配的是“现代性”价值观，它被广泛认为是一种经济主导型观念，一直视“经济增长”为解决贫富差异、环境破坏和其他社会问题的最终力量。但是，近现代许多经济学家和社会学家已经不再肯定这种经济主导型价值观，如美国后现代思想家约翰·科布（John
    B.Cobb，Jr.）从宏观经济学和公共政策的角度对“经济增长解决社会问题”的观念进行了斥责。他认为，单纯的经济发展不能解决第三世界国家人口过度增长问题，不足以帮助人们产生正确的环境观，它会阻碍卫生、教育、文化以及政治上人权及民主的发展。[\[18\]](#txt001.xhtml#footnote_content_txt001_18)今天普通民众关注公共事业的重心已经发生转移，现代社会经济发展观念急需转变的思想得到支持。例如，现在许多国家的人们都在关注着贫富差距、环境保护、教育投入、食品与医药安全等话题，而不再只是国内生产总值（GDP）。


    这种价值观转变极有可能会像工业革命后技术进步推动世界经济发展那样，成为未来社会变迁的重要动力。另一个广泛的共识是，决定社会发展方向的很大一部分力量是来自整个社会群体的意志，这些意志或价值观通过各种机制转化为行为乃至动力来指导以后的社会发展。这样看来，如果我们研究社会群体的基础价值观及其转变，并通过它们得到不同国家和地区在经济发展以外的政治文化上的解释，那么就能够进一步探寻这些社会的发展变迁问题，而不至于被经济数据所蒙蔽。


    此外，一些学者指出，改革开放以来中国社会处于加速转型之中。加速转型的重要结果之一就是“时空压缩”，即在同一个时空范围内呈现出了传统社会的前现代性、现代工业社会的现代性和后工业社会的后现代性的共存。[\[19\]](#txt001.xhtml#footnote_content_txt001_19)共存的前现代性、现代性和后现代性分别具有相应的价值观内涵，这也就意味着价值观的交锋和交替也将在中国长期共存。


    ## 技术驱动下价值观的历史嬗变


    20世纪以来，科学技术的快速发展开启了人类文明新时代的大门。科学技术取得的重大成果迅速转化成科技产品，深入到人们的社会生活、生产的方方面面，全面地影响并改变了人类的思维方式和行为模式，成为社会及人们的日常生活的控制因素。


    多数哲学家承认价值观与科学技术之间的相互影响是显而易见的，进行科学研究的首要原因是理解和认识世界具有重要的价值。其中，真理性、客观性和经验充分性等价值观对科学事业来说至关重要，它们也被普遍认可为优秀理论应有的特征，有助于我们认识这个世界。也有哲学家认为某些价值观与科学无涉，英国哲学家伯特兰·罗素（Bertrand
    Russell）即认为：鉴于科学只关心事实，公正与否等价值观因素根本就不在其考虑范围内。[\[20\]](#txt001.xhtml#footnote_content_txt001_20)


    关于技术本身价值的研究一直是一个存在着颇多争议的领域，技术中性论与技术价值论之间的争议由来已久。持“技术中性论”观点者否认技术有其社会作用和社会影响、技术应用可服务于不同的社会目的，认为技术本身是中性的。例如德国生态哲学家汉斯·萨克塞（Hans
    Sachsse）认为：“由于技术只是方法，只是工具，技术行为目的总是存在于技术之外。”[\[21\]](#txt001.xhtml#footnote_content_txt001_21)另外一些学者则认为技术与技术的运用和后果并非绝对分立，技术本身是负荷价值的，技术是加工、处理、控制物质、能量、信息，进而实现一定价值目的的过程。加拿大哲学家、物理学家马里奥·邦格（Mario
    Bunge）就认为：“技术在伦理上绝不是中性的，它涉及伦理学，并且游移在善和恶之间。”[\[22\]](#txt001.xhtml#footnote_content_txt001_22)


    恩格斯指出，“马克思把科学技术首先看成是历史的有力杠杆，看成是最高意义上的革命力量。”[\[23\]](#txt001.xhtml#footnote_content_txt001_23)随着科学技术的迅猛扩张，人的主体性地位逐渐消失，科学技术转而成为资本主义社会的主导因素。科学技术既增强了人类征服和改造自然的能力，成为人们从必然王国走向自由王国的保证，同时也为新社会创造了必要的物质基础。关于技术与价值领域的问题，西方学者一直给予了充分的关注。法兰克福学派就从价值观的角度对科学技术进行了深刻的理论反思和批判，以期重塑以人为价值主体的科学技术价值观。学派早期代表、创始人霍克海默（Max
    Horkheimer）结合资本主义新的发展形势，以工具理性为主要批判对象，否定了资本主义统摄下科学技术的价值取向。他认为：“科学技术不再以人为价值主体，其取消了自身对意义的追求，成为资产阶级对人的操纵手段，异化为资产阶级的统治工具。”[\[24\]](#txt001.xhtml#footnote_content_txt001_24)


    技术的自然属性和社会属性在技术社会化进程中不断被放大，从而导致了技术驱动的力量在自然、社会和人本层面的强化。同时，技术内在价值的两重性和技术应用的两重性有着必然的内在联系。因此，要探究技术发展对价值观的影响，就不能回避对技术本质、技术价值两重性、技术应用两重性、技术应用的过程意义和终极价值等方面进行多层面的剖析。因此，美国技术哲学家约瑟夫·皮特（Joseph
    C.Pitt）提出：“如果技术反映了我们的价值体系，或者即使它们仅仅影响了我们社会的经济结构，我们就应该知道这意味着什么以及它是如何发生的。”[\[25\]](#txt001.xhtml#footnote_content_txt001_25)另一位美国技术哲学家卡尔·米切姆（Carl
    Mitcham）也认为：“未来的技术哲学研究，将更注重对技术应用过程意义与价值的考察”，同时“这种技术应用的意义与价值的定位，显然必须在一个动态的伦理层面上去考察”。[\[26\]](#txt001.xhtml#footnote_content_txt001_26)


    除了哲学家以外，科学家也在追问科学技术的价值。美国著名物理学家理查德·费曼（Richard P.Feynman）在参与原子弹的制造工作之后，开始反思自己年轻时对科学价值的思考，他提出了这样的问题：“当我们看到科学也可以带来灾难时，那么我如此热爱，并且毕生孜孜为之的科学事业的价值究竟何在？”


    费曼自己对这个问题的回答是：“科学的价值的第一点是众所周知的。科学知识使人们能制造许多产品、做许多事业。当然，当人们运用科学做了善事的时候，功劳不仅归于科学本身，而且也归于指导着我们的道德选择。科学知识给予人们能力去行善，也可以作恶，它本身可并没有附带着使用说明。这种能力显然是有价值的，尽管好坏决定于如何使用它。”


    科学的另一个价值是提供智慧与思辨的享受。一些人可以从阅读、学习、思考中得到这种享受，而另一些人则要从真正的深入研究中得到满足。这种智慧思辨享受的重要性往往被人们忽视，特别是那些喋喋不休地教导科学家要承担社会责任的先生们。


    另外一个不容低估的科学的价值是它改变了人们对世界的概念。由于科学的发展，我们今天可以想象无穷奇妙的东西，比诗人和梦想者的想象丰富离奇千万倍。自然的想象和多姿比人类要高明得多。例如，诗人想象巨大的海龟驮着大象到海里旅行；而科学给了我们一幅图画——天宇中一个巨大的球在旋转，在它的表面，人们被神奇的引力吸住，并附着它在旋转。[\[27\]](#txt001.xhtml#footnote_content_txt001_27)


    伴随着技术价值的产生、技术价值的增值以及技术的应用，人类社会历史上价值观的嬗变是否可以说体现在自然、社会和人本三个层面上的技术价值的实现之中？同时，我们是否也应承认，技术的正负价值是相对而言的，不存在绝对的正价值和绝对的负价值，技术价值的正负属性在一定的条件下是可以相互转化的。


    费曼思考了技术驱动下价值观变迁的两种可能走向：一方面，人们创造技术是为了利用它，人们使用技术是因为它有可利用的正价值，但技术（价值）只要被应用，就总会产生积极的和消极的影响——正价值和负价值总是同时或先后实现；如农药作为一种技术产品，它的应用可以使农作物高产——实现正价值，但同时也污染了环境和食物，给人类健康造成危害——实现负价值。另一方面，技术可能带来的毁灭性后果不一定是绝对的坏事、绝对的负面影响，例如，原子弹的应用因其巨大的杀伤力成为世界和平最大的潜在威胁之一，但它也能为爱好和平的人们抗衡核威胁提供保障。


    正如核技术的诞生极大地影响了20世纪人类文明的发展进程一样，人工智能在21世纪将对人类社会带来前所未有的巨大挑战。生物科学、计算科学的发展，未来仿生生命极有可能威胁人类世界，科幻电影、科幻文学都表述过这种担忧，即在未来某个时间点，人工智能可能会颠覆人类世界的统治，会导致毁灭性灾难的来临。而当下，我们正生活在一个任何人都无法摆脱数据的大数据时代，人工智能不断地塑造并改变人类的日常生活与社会行为，例如在城市管理中，智能手机的位置定位功能有助于掌握人口密度与人员流动信息；共享单车的使用轨迹有助于优化城市道路建设，这些在过去都是无法想象的。


    如上所述，人工智能世界是数字化行为构成的世界，大数据使数据的用途发生了质变，智能机器与数据世界的互动使人类进入了利用大数据进行预测或决策的新时代。算法是实现人工智能对现实世界产生影响的基础。一些乐观主义者倡导用算法判断取代人的判断，这种观点延续了“技术决定论”的传播研究路径，忽视了算法设计的社会建构功能，也遮蔽了人工智能的技术风险和社会影响。在某种意义上讲，算法只是一种工具，它不能完全区隔价值观、抽离价值观。文化是先于算法设计而存在的，植根于现存的社会制度、实践、态度及其价值取向之中，通过设计者的设计理念和预期嵌入到程序设计之中。技术决定论或技术乐观派是否会导致整体上对技术的历史和哲学的无知？技术的发展是否将加强对生活世界的殖民统治，并通过扩大技术对人的控制破坏生活世界的意义，进一步约束人类的自主性？悲观主义者认为，最终科学技术畅通无阻地占据人的生活领域，导致德国哲学家埃里希·弗罗姆（Erich
    Fromm）所预言的“一个致力于最大规模的物质生产和消费的，由计算机所控制的完全机械化的新社会”[\[28\]](#txt001.xhtml#footnote_content_txt001_28)。


    人工智能可能从根本上改变了迄今为止由传统和人类价值加以调控的行为，它实际上创造了一种新的社会，这个社会不仅仅只是旧社会的现代版本。这个崭新的社会将由何种价值观主导？2018年，著名华人科学家、人工智能研究者李飞飞在《如何让AI更加人性化》一文中表达了对人工智能发展的兴奋与担忧，并提出“以人为中心的AI”发展道路，期望引导人工智能成为人类社会生活进步的一股力量。[\[29\]](#txt001.xhtml#footnote_content_txt001_29)同时她反驳了机器无价值观的观点，她认为机器的价值观就是人类的价值观，这是首次有人工智能专家将人工智能价值观与人类价值观等而论之。在李飞飞看来，“以人为中心的AI”包含三大主旨：一是让人工智能更好地反映人类的深层智能；二是人工智能应帮助人类变得更强，而不是替代人类；三是确保人工智能在发展过程中对人类的影响得到正确的引导。


    作为实证主义土壤中诞生的技术科学集大成者，人工智能是近代技术理性登峰造极的产物，但是人工智能具有一个与其他技术与众不同的特点：对技术发明者的反身性，如同人们认为认知科学可能会消解认识论一样，人工智能则有可能消解人类的创造性本质。[\[30\]](#txt001.xhtml#footnote_content_txt001_30)多数面向人工智能领域的价值观研究方案思考的，大都是人类怎样将自己现有的价值观植入到智能机器。如果局限于自然人类的立足点，人类和智能机器的关系就会出现很多悖论情景，这就是李飞飞所强调的人工智能价值观的重要性所在，在人工智能发展日新月异的当下，人类需要超越自己具有特定历史局限的视角，才能进一步探索其内涵。


    ## 本章小结

    '
  trans: '


    ## Diversity and Conflict of Values


    The diversity of values inevitably leads to conflicts of values. Conflicts of
    values in modern society are extensive and complex, manifesting as conflicts between
    individuals, between individuals and groups or society, and between groups. [\[9\]](#txt001.xhtml#footnote_content_txt001_9)
    On a series of important issues such as efficiency versus equity, liberty versus
    equality, interest versus morality, and environmental value versus economic value,
    different subjects often arrive at different or even diametrically opposed views;
    the same subject''s value orientations in different fields and aspects often exhibit
    variability and contradiction. These contradictions and conflicts essentially
    stem from a series of contradictions and conflicts between different forms of
    values, such as traditional values versus modern values, indigenous values versus
    foreign values, dominant values versus non-dominant values, religious values versus
    secular values, and elite values versus mass values. There exists no abstract,
    eternal, unchanging value system adapted to any era, any nation, or any class.
    Different values embody the expectations and demonstrations of different nations,
    classes, and social groups regarding the desirable state of value relations.


    ## Change and Constancy of Values


    As an organic component of the social consciousness system, once formed, values
    permeate all value activities of people, serving as the orientation and basis
    for people''s value evaluation, selection, and creation. As long as people always
    stand on the basis of real history, not explaining practice from concepts, but
    explaining the formation of concepts from material practice, [\[10\]](#txt001.xhtml#footnote_content_txt001_10)
    then values are necessarily constructed upon a certain socio-economic foundation;
    they are the product and manifestation of people''s social existence, social practice,
    and life experience in a given era, and the result of the subtle infection and
    edification of factors such as cultural traditions, lifestyles, customs, and social
    psychology of that era.


    As the deep structure of the cultural system, values possess relative durability
    or continuity, functioning consciously or unconsciously over a considerable period,
    influencing and dominating people''s thoughts and behaviors. Under specific times,
    places, and conditions, people''s values are always relatively stable. For example,
    regarding the good or bad of a certain thing, there is always an opinion and evaluation;
    under unchanged conditions, this opinion will not change abruptly.


    However, people''s ideas, views, and concepts change with the change of their
    living conditions, their social relations, and their social existence. [\[11\]](#txt001.xhtml#footnote_content_txt001_11)
    The constancy of values is relative; it inevitably develops with the development
    of the times and changes with the transformation of the times, constantly accepting
    the test, correction, and improvement of people''s social life practice. In periods
    of stable social development, values reside in daily life, and people only consciously
    or unconsciously follow their guidance. In periods of social transformation, old
    and new values often collide and conflict, and the comparison, reflection, criticism,
    and transformation of values are consequently put on the agenda. In the initial
    stage of social transformation, values exhibit diversity, disorder, and chaos,
    leaving many people feeling bewildered and at a loss. Subsequently, values upholding
    the old order clash fiercely with values reflecting the requirements of historical
    progress; the defects of old values gradually surface, while certain new values
    begin to demonstrate powerful vitality, gaining recognition and support from the
    public. Finally, through rational argumentation, and especially the test of practice,
    people select and accept new values, thereby completing the alternation of old
    and new values. This situation occurs not only during major transformations of
    social formations in history but may also appear even within the same social formation
    when social life undergoes tremendous changes.


    Globally, several long-term cross-generational surveys have attempted to study
    the issue of value change. Between 1953 and 1988, the Japanese National Character
    Survey Committee of the Institute of Statistical Mathematics conducted a survey
    on Japanese national character every five years. Under the topic "Study of Japanese
    National Character," Japanese sociologists conducted value surveys for over 30
    years in 5-year cycles, primarily intending to understand changes in Japanese
    public opinion, attitudes, and values, and edited and published five volumes of
    *The Japanese National Character* based on the survey results. [\[12\]](#txt001.xhtml#footnote_content_txt001_12)
    Over the 20-plus years from 1972 to 1993, Japanese sociologists such as Tsuru
    Hiroshi, Sakaichi, and Akiba Hidenori conducted a relatively systematic study
    on the "Development and Change of Modern Japanese Youth Values." [\[13\]](#txt001.xhtml#footnote_content_txt001_13)
    In the late 1970s, the European Value System Study Group (EVSSG) launched a large-scale
    cross-national survey project, the European Value Survey (EVS), targeting 10 Western
    European countries. The survey results showed significant differences among residents
    of the surveyed countries in political, family, religious, gender, and other values.
    [\[14\]](#txt001.xhtml#footnote_content_txt001_14) In 1980, Dutch psychologist
    Geert Hofstede, based on research into the work values of over 116,000 people
    in 40 countries across different occupations, categorized differences between
    cultures into six basic cultural value dimensions, pioneering the study of cultural
    differences. [\[15\]](#txt001.xhtml#footnote_content_txt001_15) These research
    methods subverted the traditional single East-West geographical division in studying
    social problems, reflecting variables in social research such as race, history,
    and natural environment through basic values, thereby understanding social change
    from a broader perspective.


    In the Western developed industrial societies of the 1970s, a clear generational
    change appeared in the value types of the populace, forming a divide between materialist
    values and post-materialist values. The theory of value change proposed by Inglehart
    is one of the important theories in the field of political culture research today,
    and this conclusion has been repeatedly corroborated in subsequent decades of
    value survey research. [\[16\]](#txt001.xhtml#footnote_content_txt001_16) Inglehart
    pointed out that in rapid social transformation, on the one hand, there is a decline
    in trust in institutions caused by the declining legitimacy of hierarchical authority,
    patriotism, and religion; on the other hand, the political expression of new values
    is constrained by changes in the balance of political skills between elites and
    the masses. [\[17\]](#txt001.xhtml#footnote_content_txt001_17) The process of
    value change he examined (see Figure 1-2) is as follows:


    ![Figure 1-2](img/txt001_2.jpg)


    Figure 1-2　Process of Value Change Examined by Inglehart


    In Inglehart''s view, certain basic values and skills appear to be changing in
    a gradual but deep-seated manner; the two processes of value change reinforce
    each other, profoundly influencing the transformation of socio-political structures.
    The three variables of values, skills, and structure jointly determine the path
    of political change, and the core concept of the theory of value change unfolds
    around these three variables.


    In terms of the contemporary significance of value change for real political life,
    value change relates to the degree of political division in the whole society,
    the issues and effectiveness of political participation, and the spread and proliferation
    of social trends of thought. The values of the populace are the core of political
    culture; they guide people''s various choices in political life, such as choosing
    what kind of political system, what kind of rules to promote the exercise of power,
    what kind of goals to endow political organizations with, and with what kind of
    attitude to treat political organizations: belief or suspicion, participation
    or alienation, support or challenge, etc.


    From the perspective of the driving force of social development, values play a
    crucial role in guiding human beings to generate social behaviors and further
    promoting social progress. Since the Industrial Revolution, the social development
    of many countries has been dominated by economic growth, matched by "modernity"
    values, which are widely regarded as an economy-dominated concept, always viewing
    "economic growth" as the ultimate force to solve the gap between rich and poor,
    environmental destruction, and other social problems. However, many modern and
    contemporary economists and sociologists no longer affirm this economy-dominated
    value concept. For example, American postmodern thinker John B. Cobb Jr. denounced
    the concept of "economic growth solving social problems" from the perspectives
    of macroeconomics and public policy. He believed that pure economic development
    cannot solve the problem of excessive population growth in Third World countries,
    is insufficient to help people form a correct environmental view, and hinders
    the development of health, education, culture, and political human rights and
    democracy. [\[18\]](#txt001.xhtml#footnote_content_txt001_18) Today, the focus
    of ordinary people''s attention to public affairs has shifted, and the idea that
    modern social and economic development concepts urgently need to change has gained
    support. For example, people in many countries are now concerned about the gap
    between rich and poor, environmental protection, education investment, food and
    drug safety, and other topics, rather than just Gross Domestic Product (GDP).


    This value shift is highly likely to become an important driving force for future
    social change, just as technological progress after the Industrial Revolution
    drove world economic development. Another broad consensus is that a large part
    of the force determining the direction of social development comes from the will
    of the entire social group; these wills or values are transformed into behaviors
    and even driving forces through various mechanisms to guide future social development.
    From this perspective, if we study the basic values of social groups and their
    transformations, and through them obtain explanations of different countries and
    regions in political culture beyond economic development, we can further explore
    the development and changes of these societies, avoiding being blinded by economic
    data.


    In addition, some scholars point out that since the Reform and Opening Up, Chinese
    society has been in a state of accelerated transition. One important result of
    this accelerated transition is "time-space compression," meaning that within the
    same time-space scope, the pre-modernity of traditional society, the modernity
    of modern industrial society, and the post-modernity of post-industrial society
    coexist. [\[19\]](#txt001.xhtml#footnote_content_txt001_19) The coexisting pre-modernity,
    modernity, and post-modernity each possess corresponding value connotations, which
    also means that the contest and alternation of values will coexist in China for
    a long time.


    ## Historical Transformation of Values Driven by Technology


    Since the 20th century, the rapid development of science and technology has opened
    the door to a new era of human civilization. Major achievements in science and
    technology have been rapidly transformed into technological products, penetrating
    all aspects of people''s social life and production, comprehensively influencing
    and changing human thinking patterns and behavioral models, and becoming a controlling
    factor of society and people''s daily lives.


    Most philosophers acknowledge that the mutual influence between values and science
    and technology is obvious; the primary reason for conducting scientific research
    is that understanding and knowing the world possesses significant value. Among
    them, values such as truthfulness, objectivity, and empirical adequacy are crucial
    to the scientific enterprise; they are also universally recognized as characteristics
    that excellent theories should possess, helping us understand the world. Some
    philosophers also believe that certain values are irrelevant to science. British
    philosopher Bertrand Russell believed: "Since science is only concerned with facts,
    value factors such as justice are not within its consideration at all." [\[20\]](#txt001.xhtml#footnote_content_txt001_20)


    Research on the value of technology itself has always been a field with considerable
    controversy, and the dispute between technological neutrality and technological
    value theory has a long history. Proponents of the "technological neutrality"
    view deny that technology has its own social role and social impact, believing
    that technological applications can serve different social purposes and that technology
    itself is neutral. For example, German ecological philosopher Hans Sachsse believed:
    "Since technology is only a method, only a tool, the purpose of technological
    action always exists outside of technology." [\[21\]](#txt001.xhtml#footnote_content_txt001_21)
    Other scholars believe that technology and the application and consequences of
    technology are not absolutely separate; technology itself is value-laden, and
    technology is the process of processing, handling, and controlling matter, energy,
    and information to realize certain value purposes. Canadian philosopher and physicist
    Mario Bunge believed: "Technology is by no means ethically neutral; it involves
    ethics and hovers between good and evil." [\[22\]](#txt001.xhtml#footnote_content_txt001_22)


    Engels pointed out, "Marx regarded science and technology first of all as a powerful
    lever of history, as a revolutionary force in the highest sense." [\[23\]](#txt001.xhtml#footnote_content_txt001_23)
    With the rapid expansion of science and technology, the subjectivity of human
    beings gradually disappeared, and science and technology turned into the dominant
    factor in capitalist society. Science and technology both enhanced humanity''s
    ability to conquer and transform nature, becoming a guarantee for people to move
    from the kingdom of necessity to the kingdom of freedom, and simultaneously created
    the necessary material foundation for a new society. Regarding issues in the field
    of technology and values, Western scholars have always given full attention. The
    Frankfurt School conducted profound theoretical reflection and criticism on science
    and technology from the perspective of values, aiming to reshape a scientific
    and technological value system with humans as the value subject. Early representative
    and founder Max Horkheimer, combining the new development situation of capitalism,
    took instrumental rationality as the main object of criticism, negating the value
    orientation of science and technology under capitalist domination. He believed:
    "Science and technology no longer take humans as the value subject; they have
    abandoned their own pursuit of meaning, becoming a means for the bourgeoisie to
    manipulate people, alienated into a tool of bourgeois rule." [\[24\]](#txt001.xhtml#footnote_content_txt001_24)


    The natural and social attributes of technology are continuously amplified in
    the process of technology''s socialization, leading to the strengthening of technology-driven
    forces at the natural, social, and human levels. At the same time, the duality
    of technology''s intrinsic value and the duality of technology''s application
    have an inevitable intrinsic connection. Therefore, to explore the impact of technological
    development on values, one cannot avoid a multi-level analysis of the nature of
    technology, the duality of technological value, the duality of technological application,
    the process significance and ultimate value of technological application, etc.
    Therefore, American philosopher of technology Joseph C. Pitt proposed: "If technology
    reflects our value system, or even if it merely affects the economic structure
    of our society, we should know what this means and how it happens." [\[25\]](#txt001.xhtml#footnote_content_txt001_25)
    Another American philosopher of technology, Carl Mitcham, also believed: "Future
    philosophy of technology research will pay more attention to the examination of
    the significance and value of the technological application process," and "this
    positioning of the significance and value of technological application obviously
    must be examined on a dynamic ethical level." [\[26\]](#txt001.xhtml#footnote_content_txt001_26)


    Besides philosophers, scientists are also questioning the value of science and
    technology. Renowned American physicist Richard P. Feynman, after participating
    in the Manhattan Project, began to reflect on his youthful thoughts on the value
    of science. He posed the question: "When we see that science can also bring disaster,
    what exactly is the value of the scientific career that I love so much and have
    devoted my life to?"


    Feynman''s own answer to this question was: "The first point of the value of science
    is well known. Scientific knowledge enables people to make many products and do
    many things. Of course, when people use science to do good things, the credit
    belongs not only to science itself but also to the moral choices that guide us.
    Scientific knowledge gives people the ability to do good, but also to do evil;
    it itself carries no instructions for use. This ability is obviously valuable,
    although whether it is good or bad depends on how it is used."


    Another value of science is to provide the enjoyment of wisdom and speculation.
    Some people can obtain this enjoyment from reading, learning, and thinking, while
    others must obtain satisfaction from real in-depth research. The importance of
    this intellectual speculative enjoyment is often ignored, especially by those
    gentlemen who incessantly preach that scientists should bear social responsibility.


    Another not-to-be-underestimated value of science is that it has changed people''s
    concepts of the world. Due to the development of science, we can today imagine
    infinitely wonderful things, millions of times more rich and bizarre than the
    imagination of poets and dreamers. Nature''s imagination and versatility are far
    superior to humanity''s. For example, poets imagine giant turtles carrying elephants
    traveling in the sea; science gives us a picture—a giant ball rotating in the
    heavens, on whose surface people are held by the magical force of gravity and
    rotate with it. [\[27\]](#txt001.xhtml#footnote_content_txt001_27)


    With the generation, appreciation, and application of technological value, can
    it be said that the historical transformation of values in human society is reflected
    in the realization of technological value at the three levels of nature, society,
    and humanity? At the same time, should we also acknowledge that the positive and
    negative values of technology are relative, that there are no absolute positive
    values and no absolute negative values, and that the positive and negative attributes
    of technological value can be transformed into each other under certain conditions?


    Feynman contemplated two possible directions of value change driven by technology:
    On the one hand, people create technology to utilize it, and use technology because
    it has utilizable positive value, but technology (value), once applied, always
    produces both positive and negative effects—positive and negative values are always
    realized simultaneously or sequentially; for example, pesticides as a technological
    product, their application can increase crop yields—realizing positive value,
    but simultaneously pollute the environment and food, causing harm to human health—realizing
    negative value. On the other hand, the destructive consequences technology may
    bring are not necessarily absolutely bad things or absolutely negative impacts;
    for example, the application of the atomic bomb, due to its enormous destructive
    power, has become one of the greatest potential threats to world peace, but it
    can also provide a guarantee for peace-loving people to counter nuclear threats.


    Just as the birth of nuclear technology greatly influenced the development process
    of human civilization in the 20th century, artificial intelligence in the 21st
    century will bring unprecedented huge challenges to human society. The development
    of biological science and computer science may lead to future bionic life threatening
    the human world; science fiction movies and literature have expressed this concern—that
    at some future time point, artificial intelligence may subvert human rule over
    the world, leading to the arrival of catastrophic disaster. And at present, we
    are living in a big data era from which no one can escape data; artificial intelligence
    continuously shapes and changes human daily life and social behavior. For example,
    in urban management, the location function of smartphones helps grasp population
    density and personnel flow information; the usage trajectories of shared bikes
    help optimize urban road construction—these were unimaginable in the past.


    As described above, the world of artificial intelligence is a world constituted
    by digitized behaviors; big data has qualitatively changed the use of data; the
    interaction between intelligent machines and the data world has ushered humanity
    into a new era of using big data for prediction or decision-making. Algorithms
    are the foundation for realizing the impact of artificial intelligence on the
    real world. Some optimists advocate replacing human judgment with algorithmic
    judgment; this view continues the "technological determinism" communication research
    path, ignoring the social construction function of algorithm design, and obscuring
    the technological risks and social impacts of artificial intelligence. In a sense,
    an algorithm is just a tool; it cannot completely separate or abstract values.
    Culture exists prior to algorithm design, rooted in existing social systems, practices,
    attitudes, and their value orientations, embedded into program design through
    the designer''s design concepts and expectations. Will technological determinism
    or technological optimism lead to an overall ignorance of the history and philosophy
    of technology? Will technological development strengthen colonial rule over the
    lifeworld, destroy the meaning of the lifeworld by expanding technological control
    over humans, and further constrain human autonomy? Pessimists believe that ultimately
    science and technology will unimpededly occupy the human living domain, leading
    to the "completely mechanized new society, dedicated to the largest scale of material
    production and consumption, controlled by computers" predicted by German philosopher
    Erich Fromm. [\[28\]](#txt001.xhtml#footnote_content_txt001_28)


    Artificial intelligence may fundamentally change behaviors regulated by tradition
    and human values hitherto; it actually creates a new society, which is not merely
    a modern version of the old society. What values will dominate this brand-new
    society? In 2018, renowned Chinese-American scientist and AI researcher Fei-Fei
    Li expressed both excitement and concern about AI development in her article "How
    to Make AI More Human," proposing a "Human-Centered AI" development path, hoping
    to guide AI to become a force for the progress of human social life. [\[29\]](#txt001.xhtml#footnote_content_txt001_29)
    At the same time, she refuted the view that machines have no values; she believes
    that machine values are human values. This is the first time an AI expert has
    equated AI values with human values. In Fei-Fei Li''s view, "Human-Centered AI"
    contains three main tenets: first, to make AI better reflect the deep intelligence
    of humans; second, AI should help humans become stronger, not replace humans;
    third, to ensure that the impact of AI on humans is correctly guided during its
    development.


    As the culmination of technological science born in the soil of positivism, artificial
    intelligence is the product of modern technological rationality reaching its peak,
    but AI has a characteristic distinct from other technologies: reflexivity towards
    the technology inventor. Just as people believe cognitive science may dissolve
    epistemology, AI may dissolve the creative essence of humanity. [\[30\]](#txt001.xhtml#footnote_content_txt001_30)
    Most value research programs oriented towards the AI field consider how humans
    can implant their existing values into intelligent machines. If limited to the
    standpoint of natural humans, many paradoxical scenarios will appear in the relationship
    between humans and intelligent machines; this is the importance of AI values emphasized
    by Fei-Fei Li. In the current era of rapid AI development, humans need to transcend
    their own perspective with specific historical limitations in order to further
    explore its connotations.


