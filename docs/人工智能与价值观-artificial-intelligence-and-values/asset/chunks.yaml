    \ Common Concerns\n\n# Chapter 1 Evolution of Values in Technological Revolutions\n\
    \n## Diversity of Values in Comparative Perspective\n\nValues are a common concern\
    \ of various humanities and social science disciplines. Philosophy, economics,\
    \ ethics, education, anthropology, sociology, social psychology, and other disciplines\
    \ have conducted explorations from different angles in this field.[\\[1\\]](#txt001.xhtml#footnote_content_txt001_1)\
    \ Among them, philosophy focuses on the relationship between subject and object\
    \ reflected by values; ethics focuses on the normativity of values on human behavior;\
    \ anthropology focuses on the cultural characteristics expressed by values; education\
    \ focuses on the individual socialization process affecting the formation and\
    \ change of values and its educational intervention; economics focuses on the\
    \ deep psychological reasons and types of human economic behavior; sociology focuses\
    \ on the influence of social structure and social change on values; social psychology\
    \ focuses on the psychological structure, process, function, and measurement of\
    \ values.[\\[2\\]](#txt001.xhtml#footnote_content_txt001_2)\n\nAs early as the\
    \ 1930s, American psychologists Allport (G.W. Allport) and Vernon (P.E. Vernon)\
    \ adopted the six-fold classification of human types (economic, theoretical, social,\
    \ aesthetic, religious, power) by German psychologist Spranger (E. Spranger) to\
    \ formulate a \"Study of Values,\" conducting a pioneering study of values.[\\\
    [3\\]](#txt001.xhtml#footnote_content_txt001_3) In the 1950s, the definition of\
    \ values proposed by American anthropologist Clyde Kluckhohn established a dominant\
    \ position, integrating various definitions of values from an operational level.\
    \ He believed that: a value is a conception, explicit or implicit, distinctive\
    \ of an individual or characteristic of a group, of the desirable which influences\
    \ the selection from available modes, means, and ends of action.[\\[4\\]](#txt001.xhtml#footnote_content_txt001_4)\
    \ In the 1970s, American social psychologist Milton Rokeach understood values\
    \ as a belief. He divided values into two aspects: terminal values and instrumental\
    \ values, initiating the analysis and measurement of values not only from content\
    \ but also from dimensions, deepening the study of values further.[\\[5\\]](#txt001.xhtml#footnote_content_txt001_5)\
    \ The *Rokeach Value Survey* compiled by him is still a widely used values questionnaire\
    \ internationally. Since the 1980s, researchers represented by American social\
    \ psychologist Shalom H. Schwartz have begun to explain the deep connotation of\
    \ values from needs and motives, attempting to construct a psychological structure\
    \ of values with universal cultural adaptability on this basis. Schwartz believes\
    \ that values are desirable, trans-situational goals that vary in importance and\
    \ serve as guiding principles in the life of a person or other social entity.[\\\
    [6\\]](#txt001.xhtml#footnote_content_txt001_6)\n\nDue to different perspectives\
    \ and methods, researchers' definitions of the concept of values are difficult\
    \ to unify, but we can easily discern some consensus from them. From the perspective\
    \ of the subject of values, it can be either an individual phenomenon, a social\
    \ phenomenon, or a cultural phenomenon; from the perspective of the form of expression\
    \ of values, it can be either explicit or implicit; from the perspective of the\
    \ function of values, most researchers believe that values have a guiding role\
    \ on behavior.\n\nLike worldview and outlook on life, values possess diversity,\
    \ covering all fields of social life. Any society has a variety of values, reflecting\
    \ the diverse cultural traditions, diverse survival conditions, activity modes,\
    \ and interests of people. In traditional society, due to insufficient differentiation\
    \ of social life and narrow social relations, values generally possess a certain\
    \ monotony and closure. The complexity, diversity, and conflicts of modern society\
    \ have broken the monotonous, closed, and rigid state of traditional society.\
    \ In particular, economic globalization, driven by the development of social productivity\
    \ from low to high and the restructuring of the global spatial landscape by technological\
    \ progress, has greatly expanded human living space and promoted the innovation\
    \ of the global governance system. At the same time, economic globalization has\
    \ also intensified the clashing and collision between different development paths,\
    \ cultures, and religious beliefs. The diversity of values has become a prominent\
    \ fact.\n\nValues research at the social level is relatively common in Western\
    \ developed countries. For a long time, many scholars have been committed to exploring\
    \ the values and behaviors of residents in different countries and regions around\
    \ the world in the context of continuous changes in society, culture, and politics,\
    \ and exploring the connection between micro-level value changes of individuals\
    \ and social change through census methods. Among them, the World Values Survey\
    \ (WVS) hosted by American political scientist Ronald Inglehart is a typical representative\
    \ with a wide scope and large impact. This project is hosted by the Swedish non-profit\
    \ organization \"World Values Survey Association\" (WVSA), and is a survey research\
    \ describing issues such as world socio-cultural and political changes. The survey\
    \ subjects of WVS are ordinary people in representative countries or regions worldwide.\
    \ It has currently developed to 97 societies across six continents, covering 88%\
    \ of the world's population. Specifically, since the 1980s, WVSA has conducted\
    \ values censuses in cycles of 4 to 5 years, dispatching organization members\
    \ to supervise the survey and entrusting local research institutions to complete\
    \ data collection work through random sampling interviews.\n\nBased on WVS data,\
    \ Inglehart and German political scientist Christian Welzel designed a four-dimensional\
    \ world values map (see Figure 1-1) to display cross-cultural variation on a global\
    \ scale. In the four-dimensional map, human values are defined as \"Self-expression,\"\
    \ \"Secular-rational,\" \"Traditional values,\" and \"Survival values.\" Among\
    \ them, \"Secular-rational\" and \"Traditional values\" reflect two opposite processes\
    \ among social groups. The side closer to \"Traditional values\" places more emphasis\
    \ on family education, traditional etiquette, and obedience to authority, as well\
    \ as opposing suicide, abortion, and upholding traditional family concepts such\
    \ as ethics. The opposite side, i.e., \"Secular-rational,\" tends more towards\
    \ individuals' own practical needs.[\\[7\\]](#txt001.xhtml#footnote_content_txt001_7)\n\
    \n![img](img/txt001_1.jpg)\n\nFigure 1-1 Inglehart-Welzel Cultural Map of the\
    \ World\n\nIn Figure 1-1, upward movement on the vertical axis reflects the shift\
    \ from \"Traditional\" to \"Secular-rational.\" Traditional values emphasize the\
    \ importance of religion, parent-child relationships, respect for authority, and\
    \ traditional family. People who hold these values reject divorce, abortion, euthanasia,\
    \ and suicide, and generally have a high sense of national pride and nationalist\
    \ views. Secular-rational values have opposite preferences to traditional values.\
    \ In societies where secular-rational values prevail, religion, traditional family,\
    \ and authority do not receive special emphasis. Divorce, abortion, euthanasia,\
    \ and suicide are considered relatively acceptable. Rightward movement on the\
    \ horizontal axis reflects the shift from \"Survival\" to \"Self-expression.\"\
    \ Survival values emphasize economic and physical security. This is associated\
    \ with relatively ethnocentric views and low levels of trust and tolerance. Self-expression\
    \ values highly value environmental protection and show greater equality towards\
    \ foreigners, homosexuals, and different genders. Figure 1-1 also shows that economic\
    \ globalization has not obscured the diversity of values. On a global scale, basic\
    \ value differences between societies remain much larger than those within societies.\n\
    \nThe diversity of values originates from human needs, which are the subjective\
    \ basis for the formation of value relations.[\\[8\\]](#txt001.xhtml#footnote_content_txt001_8)\
    \ It is precisely on the basis of realizing needs that people judge, reflect on,\
    \ and integrate various value relations, thereby forming values. Different people\
    \ have different needs and self-consciousness, thus forming different values.\
    \ The multi-level nature of human needs determines the multi-level nature of values;\
    \ the social nature of human needs determines the social nature of values; the\
    \ historical nature of human needs determines the historical nature of values.\n\
    \n"
