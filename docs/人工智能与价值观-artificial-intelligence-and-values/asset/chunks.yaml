    # The Profound Impact of General-Purpose Artificial Intelligence on Labor, Values,
    and Education


    The advent of general-purpose artificial intelligence at some future point will
    fundamentally alter the relationship between labor, wages, and income, and the
    prelude to this change has already arrived. According to a 2016 report by the
    U.S. Council of Economic Advisers, 83% of the 81 million jobs in the U.S. paying
    less than $20 per hour face the risk of being replaced by machines, automation,
    and AI by 2036. The lower the income, the more imminent the danger. Worse still,
    this employment instability is accompanied by an ever-worsening wealth gap. From
    1979 to 2013, the income of the top 1% of earners in the U.S. grew by 192%, while
    the bottom 20% saw only 46% growth.[⁴²] Since the growth of capital consistently
    outpaces economic growth, this means the channels for social mobility over the
    past century have been largely rewritten: diligence is not the fast track to wealth;
    a prosperous life built on savings from long-term employment in low-income positions
    has become a relic from our fathers'' diaries, and will become even rarer in the
    future.


    Correspondingly, American values are undergoing profound changes. The original
    veneration of hard work involved earning wages through labor, increasing savings
    through frugality, thereby supporting major purchases like real estate and automobiles.
    This value system was actually underpinned by specific U.S. economic conditions
    and objectively relied on the support of federal agencies like Fannie Mae and
    Freddie Mac. The lessons of the 2008 financial crisis showed that the "American
    Dream" of getting rich through hard work only applies to people at specific income
    levels; otherwise, ownership is as elusive as smoke. As AI erodes various job
    positions, the upward mobility channels for low- and middle-income groups are
    narrowing, objectively impacting the value concept of "hard work leads to wealth."
    If labor cannot accumulate substantial wealth, what is the meaning of labor? If
    life''s content is limited to laboring for survival, what is the meaning of a
    person? If a person does not labor, do they still possess the qualifications of
    a competent member of society? Should they enjoy equal rights and benefits? Or
    to pursue the question further, does a person have existential value beyond economic
    labor?


    The question of the meaning of labor has never truly strayed from the center of
    human speculation. As early as the late 19th century, engineers and the managerial
    class used tools like gauges and machine tools to impose increasingly precise
    and uniform requirements on production processes. Standardizing finished product
    dimensions aimed to enhance the interchangeability of parts, reduce costs, and
    expand production scale. This was essentially the extraction and reification of
    skilled workers'' experience; labor became fragmented and trivial, replaceability
    increased, the embodied experience embedded in craft gradually faded, and labor
    found itself powerless in wage negotiations. The philosopher Michael Polanyi proposed
    a paradox in 1966: "We know more than we can tell"... driving skills cannot be
    replaced by automotive theory classes, so AI cannot replace humans. In fact, this
    does not align with reality; the proliferation of gauges and machine tools shows
    that labor has always faced the risk of being abstracted and then replaced by
    tools; this hidden danger did not originate in the AI era. The reason this contradiction
    did not erupt for a long time is twofold: first, pre-AI technology was insufficient
    to impact such a wide range of jobs; second, U.S. business owners and managers
    remained relatively optimistic in the face of ever-expanding markets, willing
    to mediate labor relations, and the gradual enrichment of the working class mitigated
    their fundamental questioning of the meaning of labor to some extent.


    The Fourth Industrial Revolution is a continuation of the previous changes in
    the nature of labor, yet differs from them; given AI''s potential, its impact
    on values is likely to be disruptive. In agricultural society, tenants provided
    labor, paid by land-owning proprietors; in industrial society, workers provided
    labor, paid by factory-owning proprietors. If AI progresses from weak to strong,
    it will rewrite the human labor forms and economic structures of the past millennia.
    When individual labor—whether in quantity or quality, even in personal style—cannot
    possibly surpass the output of automated systems, the threshold of labor as a
    prerequisite for becoming an effective member of society is shattered. Facing
    surplus productivity, human existence as consumers seems more necessary. Thus,
    a long-standing concept, "Universal Basic Income" (UBI), has found a historical
    opportunity for rebirth.


    Today, UBI is often labeled "socialist" in the U.S., but it has actually always
    been an element within the American value system. As early as the late 18th century,
    American founding father Thomas Paine proposed in *Agrarian Justice* that landlords,
    by occupying land, benefited most from advances in cultivation technology, progress
    achieved by the labor of society as a whole; in this sense, landlords "owe" society,
    and should repay a fixed annual sum to individuals without land inheritance rights.
    In 1962, Nobel laureate Milton Friedman proposed the "negative income tax" concept—whereby
    those below an income threshold not only pay no tax but receive a subsidy—essentially
    a variant of UBI.[⁴³] In the 1960s U.S., driven by Friedman''s advocacy and support
    from other economic luminaries, UBI began to enter the policy arena. In 1969,
    President Nixon proposed the "Family Assistance Plan," providing $1,600 per year
    per family (approx. $11,000 today). This proves that American thinkers concerned
    with social equity never abandoned this bold idea; the 1972 Democratic presidential
    candidate even proposed a more generous policy. However, these were all rejected
    at the congressional level, because during the Cold War the U.S. ideologically
    emphasized individualism, distribution according to work, and free markets—values
    that indeed conflict in many ways with the concept of UBI.


    However, from a macroeconomic perspective, "hard work leads to wealth" becoming
    an American value is actually a historical contingency, based on the economic
    landscape of the late 19th and early 20th centuries. At that time, the U.S. economy
    grew rapidly, labor shortages were large, and workers with high school diplomas
    could earn a relatively decent income through manual labor. After WWII, the concept
    of the "American Dream" gradually formed, a key element of which was home ownership.
    The U.S. government introduced numerous preferential policies to promote loan
    market liquidity, encourage residents to buy homes, and drive other industries.
    Overall, in the mid-20th century, U.S. household incomes and home ownership rates
    rose steadily, providing support for the "hard work leads to wealth" value. Coupled
    with Cold War ideological opposition, any advocacy or policy emphasizing social
    welfare systems was ruthlessly categorized into the enemy camp. Even by 2016,
    the Obama White House could not accept the concept of UBI, or design policy based
    on it. Asking a president to admit that the pessimistic reality of workers being
    unable to find employment has become a premise of governance under his watch is
    indeed a difficult position.


    A new economic landscape has formed: housing prices are rising, income growth
    is stagnating, and the wealth gap is widening, giving young people a strong sense
    of crisis. The old path of "hard work leads to wealth" trodden by their fathers
    no longer works, and American values have begun to waver. In a 2017 interview
    with *Quartz*, Bill Gates mentioned: when a worker today generates $50,000 worth
    of labor in a factory, the government collects income tax, social security, etc.;
    then if a robot does the same work, shouldn''t it be taxed? Gates argues that
    while the UBI idea is somewhat radical, the government should tax companies using
    robots to aid increasingly disadvantaged human workers.[⁴⁴] Hillary Clinton, the
    Democratic candidate in the 2016 presidential election, also showed keen interest
    in UBI; she praised Alaska''s practice of subsidizing residents with oil revenues
    and believed further follow-up was needed to understand the technical details
    of such policies'' feasibility.[⁴⁵]


    In recent years, riding the coattails of the 2020 presidential election, UBI has
    become a highly visible buzzword in the U.S. This reflects both the anxiety of
    the American public over the persistently unbridgeable wealth gap and the fact
    that AI adoption across industries poses a very real threat to low-income workers.
    From robotic arms assembling cars and autonomous interstate trucks, to bank online
    customer service, fast-food ordering staff, and online foreign language teachers...
    AI tools like natural language processing mean robotic replacement of human labor
    is no longer limited to blue-collar jobs. 2020 Democratic candidate Andrew Yang,
    in promoting his $1,000-per-month-per-person UBI plan, repeatedly noted that UBI
    is not unique to socialism or communism; historically, it is actually a "very
    American" idea. Not only did the concept exist at the founding, but civil rights
    leader Martin Luther King Jr. also viewed it as an effective solution to the entrenched
    poverty of the Black population. Although Yang gained some momentum in the Democratic
    primaries, he ultimately lost badly, proving from one angle that conditions for
    implementing UBI in the current U.S. are still insufficient. Further, while the
    threats to human rights and the reflections prompted by AI have become increasingly
    substantive, they have yet to break through the existing interpretive framework
    of American liberal values regarding racial and economic equality.


    In fact, the disruption AI brings to existing labor and welfare systems will be
    fundamental. Professor Mathias Risse of the Harvard Kennedy School points out
    that if we think AI''s arrival will end well similarly to historical precedents,
    that is naive; because if future humans are to compete with AI, it means the current
    education system must be completely halted and undergo extremely radical adjustment.
    Of course, it is also possible that increased new jobs, reduced necessary working
    hours, and higher wages might allow people to live better lives, but Risse points
    out that in a country like the U.S., which lacks even a social consensus on universal
    healthcare, the race between technology and education will likely end with the
    wealthy class further expanding their property holdings, while more people slide
    into social states where basic human rights are difficult to maintain.[⁴⁶]


    This is not alarmism. A shrinking labor market means reduced income tax revenue,
    yet the government must support an increasingly heavy welfare safety net. Trend-wise,
    this is unsustainable. Thus, the solution must involve two levers: expanding the
    tax base and changing the mode of welfare distribution. Hence, taxing "smart robots,"
    or as Yang suggested, levying a value-added tax on companies benefiting from AI
    applications to fund unconditional UBI, no longer sounds so absurd. However, some
    point out that this approach is fiscally irresponsible, would cause massive government
    deficits that even developed countries cannot bear, and that non-targeted welfare
    distribution would only reduce what the underclass receives. Simultaneously, such
    governance risks encouraging people to stay home and not work, lowering social
    cohesion and participation; UBI is also criticized as a "fig leaf" and "panacea"
    for corporations to shirk responsibility and avoid seriously discussing structural
    employment market issues.[⁴⁷]


    ### The Definition of Diligence Has Been Rewritten in the Field of Education


    If labor abstraction and wealth polarization are historical issues, then the entirely
    new definition of the value aesthetic of "diligence" brought by AI is increasingly
    manifesting in the field of education. In vocational education, U.S. politicians
    like to downplay the threat of AI, enthusiastically promoting retraining programs,
    believing they can help the unemployed find new jobs. Because AI develops rapidly
    and covers increasingly wide fields, such retraining seemingly must be lifelong,
    keeping pace with AI''s development. As for how much positive result such training
    can yield among low-income groups already eliminated in the crucible of basic
    education, no one dares to guarantee.


    In basic education, the definitions of diligence and efficacy are also being constantly
    rewritten. Diligence in learning is no longer purely the accumulation of knowledge
    and skills, but has become an active pursuit of self-knowledge and self-awareness—to
    avoid being easily replaced by AI, to become a new generation of workers who are
    aware of and can harness the existence and power of AI. In recent years, U.S.
    scholars have begun to realize that AI education must "start from childhood,"
    letting children enter the knowledge context of AI before university education.
    AI and its related knowledge content have widely entered basic education, appearing
    in U.S. K-12 classrooms. A prime example is the AI4K12 Initiative, jointly advanced
    by the Association for the Advancement of Artificial Intelligence (AAAI) and the
    Computer Science Teachers Association (CSTA), funded by the U.S. National Science
    Foundation. The initiative categorizes AI-related issues into five areas:


    1.  **Perception**, including human perception vs. computer perception, from perception
    to cognition, limitations of computer cognition;

    2.  **Representation & Reasoning**, including how world phenomena are represented
    via data, how computers reason with this data, and its limitations;

    3.  **Learning**, including the nature of learning, machine learning methods,
    neural network basics, limitations of machine learning;

    4.  **Natural Interaction**, including natural language processing, perception
    & philosophical to AI development, such as the universal threat of AI to the job
    market, and the consequent reinterpretation of the 20th-century value ideal of
    "hard work leads to wealth." It is only a matter of time before human computational
    power is comprehensively defeated by computers in certain fields; this development
    is irreversible. Although American value traditions contain many cultural elements
    resisting policies like UBI, the younger generation''s understanding of "diligence"
    has quietly changed. Diligence is no longer about not being lazy; diligence is
    an increasingly strategic, interdisciplinary, lifelong survival rule, requiring
    skillful deployment of human value as laborers in areas where AI struggles to
    "generalize." As for this diligence tinged with a forced nature, where its boundaries
    lie, no one knows the exact answer.


    ---


