    # 第 5 章　人工智能与日本价值观


    日本作为东亚文化圈的一个典型代表国家，在世界近代发展史中扮演了重要角色。第二次世界大战结束后，日本成为了世界第二大经济体，之后在以信息技术为特征的第三次工业革命中，尽管日本持续发力，但由于种种原因，并没有在信息产业领域取得优秀成绩。现如今，以人工智能、大数据、人机物互联、5G
    等为代表的第四次工业革命的到来，日本将再次迎接新兴技术的挑战。结合之前日本在第三次工业革命中的表现，日本民族的价值观念与技术发展之间的互动依然会深刻影响未来经济和社会的发展。


    ## 封闭与独立：独特外部文化接受模式


    对于日本文化和民族特点的研究，从 1946 年美国文化人类学家鲁思·本尼迪克特创作《菊与刀`[1]`](#txt005.xhtml#footnote_content_txt005_1)开始，一直不断在持续进行。本尼迪克特在书中运用文化人类学的研究方法分析了日本文化的“负恩”逻辑，并进一步一针见血地指出，日本文化是一种耻感文化，和美国的罪感文化差异极大，这为当时美国制定日本战后政策提供了非常有益的帮助。这次研究也成为文化人类学的一个重要案例，对于我们去了解日本社会的价值特点提供了有益的帮助。其后荷兰的卡瑞尔·范·沃尔夫伦在《日本的权力结构之迷`[2]`](#txt005.xhtml#footnote_content_txt005_2)一书中，以其
    30 多年在日本的生活经历，全面剖析了日本极其独特的权利运行机制，把很多日本的社会问题直接陈列在大众面前。以日本独特的社会文化为主体展开分析，成为了解日本社会运行的一个重要切入点。


    ### 内旋：不断被冲击中的日本文化


    根据整理学者们现有的研究成果`[3]`[`[4]`](#txt005.xhtml#footnote_content_txt005_3)[](#txt005.xhtml#footnote_content_txt005_4)，日本传统文化的特点主要有以下三个方面：


    第一个方面是在文化模式上：日本文化呈现出外在开放性与内在封闭性两种相悖的风格。这一特点在本尼迪克特的书中也有涉及，一方面，文化的对外开放性使得日本在面对外部文化时能够表现出不拘一格的进取精神；而另外一方面，内在的封闭性又使日本文化在与外界交流的情况下仍能固守自己的传统，不会轻易改变自己。这两者似乎是一种矛盾，但日本在这种矛盾与冲突中形成了一条特殊的衡量标准，以自己对优秀文化的评判，使得日本在近代历史中实现了多次快速发展。


    第二个方面是在文化心态上：日本文化自卑感与优越感并存。这一特点也是日本耻感文化的重要表现方面，自卑感和优越感并存的状况，主要是源于日本特殊的海岛地理和历史发展，并深刻地影响着日本社会的各个方面。一方面，文化自卑感使得日本能够放下姿态，积极吸收外来优秀文化，比如日本语言中的中国元素和西方词汇；另外一方面，文化优越感又形成了日本特殊的职业素养和企业文化，比如日本社会的工匠精神，他们出于对职业的敬畏与热爱，对生产产品有着完美与极致的追求，同时特别注重传统上的传承，以保持自己职业高标准发展。


    第三个方面是在文化规范上：内聚性和排他性兼有。日本文化优越感和自卑感并存的特点，使其文化规范保持了内聚和排他两种特性。内聚性表现为日本的集体观念非常强烈，这种集体观念使得日本人非常注重团体内部的秩序感，进而衍生出在个人生活交往中不给别人添麻烦的责任习惯。从最终结果来看，内聚性在日本社会表现出强烈集体观念与个人独立两种态度。而排他性则表现为其对非本土文化和事物的排斥，这种排斥与前文提到的开放性和封闭性是相呼应的，他们代表国家或集团展现出了开放性，但其个人内在却表现为一种排斥或者抵触，以保持自己的独立。在日本整个社会中表现得更加明显，正如前文所提到，日本形成了一条特殊的衡量标准，这个标准取决于产生外来文化的主体地位是否优越，主体是否优越决定了日本对其采取开放或者封闭的态度。这也是日本耻感文化的一个外面展现，对于优越的主体，日本选择尊重对方并采取开放的态度学习其文化，反之则保持优越感以封闭态度来对待，日本在尊严与实力中取得了平衡。回到社会生活中，一方面内聚性使得日本集团主义的根深蒂固，而另外一方面的封闭性则导致日本对内在等级制度的尊崇，人们安于做好自己的本职工作，缺乏去挑战强势主体的主动性。


    '
  toc: []
- raw: '从上述几个特点来看，日本文化与同为东亚文化的中国传统文化有着非常明显的区别。长期以来，日本文化是典型的混合文化，在优势文化目前具有很强学习能力和接受性，有着自我约束感极强集体主义。同时，日本文化是弱基因文化（没有自生的文化为主导），缺少去改革创新和挑战权威的文化基因，因此很少在世界文化进步的潮流中带头创新。另外也有学者对此做出了分析，认为日本这种文化接收模式，体现的是一种外来文化工具化心态，一方面使得日本文化表现出庸俗化、表面化倾向，另一方面也影响了它的文化前途，因为日本文化在学习过程中，冷淡了中国文化中最重要的“仁”和西方文化中最重要的“思辩理性”，学习到了外表，却没有学到中西文化中最精华、最根本的东西。[\[5\]](#txt005.xhtml#footnote_content_txt005_5)


    在对日本文化特点讨论中，有学者们认为日本文化能够实现各类外来文化与本土文化平衡，主要来源于日本特殊的文化内旋模式。因为日本是一个岛国，处于东亚文化发展的边缘，在这个文化内旋模型中，原本日本人的生活是独立发展的，但在其独立发展中不断地受到周边外来文化的冲击，于是处在边缘地带的日本人在历史发展中，通过不断地吸收融合外来文化，丰富和发展了自己的文化，并最终形成了这种内旋式的文化吸收模式。这种内旋模式与其处于文化边缘的状态相对应。在外来文化进入之后，本土文化吸收其中的优秀部分，对自己的部分进行改良，这种方式帮助在日本历史发展受益而逐步形成并巩固。这在古代日本吸引古代中国传统中原文化和明治维新之后吸引西方文化时最为明显。内旋式的文化吸收模式完全不同于中国的传统文化和西方文明。中原文化在面对新文化时，更多地是吸引有利于国家和社会发展的部分并将其融合，这个类似于佛教文化传入中原之后发展出来的汉传佛教；西方文化更加强调自己的主导性，对于外来文化更多地以对抗形式，这种冲突一直延续到现在，依然成为很多地方动荡的主要原因。而日本这种文化相对比较特殊，沃尔夫伦在《日本的权力结构之迷》之中是这样描述的，“日本对宗教总是表现出很大宽容，这种观点虽然广为人所接受，不过也只有在新的宗教或信仰体系不会对现有的政治安排造成威胁的时候才适用”，这也能够看出日本文化宽容性与封闭性是区别于中国和西方的。


    需要强调的是文化内旋模式使得日本形成了现在的文化心态和文化模式。日本文化在面对更高层次文明时，它表现为文化内旋的吸收状态，而日本本身处于高层次发展时，则表现出一种文化展现的状态。这个特点一方面使日本文化在其发展中获得了大幅度的跃进，另一方面又使其保留了固有的文化传统。这也是日本能处理好传统文化与外来文化结合的原因之一。在日本历史发展中，越是快速发展的时候，传统文化就越是突出，例如日本在第一次世界大战前后发展为世界五强，此时在文化传统上，日本却开始大幅度地从西欧文化回归东洋文化，这也代表了日本开始展现出自己的文化特点。二战后，日本受到西方文化的大改造，但日本在吸收西方先进文化实现自身快速发展同时，又逐步开始复活本民族的文化传统。相对于日本明治维新与二战战败后的社会改造中的西化潮流，这两次日本本土文化潮流展现出的日本对外来文化的态度，面对强势文化能够全面接受，而自身发展之后再重新评估，进行文化修正。正是这种文化模式的特点，表现出明显的弊病，就是对于强势外来文化的接受缺少完整的本土化，带来两者的潜在冲突。在第三次工业革命兴起之时，也正是日本发展最迅猛之时，此时的日本因为经济的成功而树立了文化自信心，在一定程度上，使得日本在面对新的信息革命冲击时，这种内旋吸收的模式并没有发挥出明显作用，日本的文化的封闭性使得整个社会错失了一次快速发展的机遇。


    这种对外来文化的处理模式对日本传统文化的发展影响是巨大的。一方面日本文化在没有外来文化进入时，表现出封闭性、优越性、排他性；而另外一个方面，当日本文化受到外来领先技术的冲击时，日本文化又会根据自身的发展水平来确定其对待的方式，是文化吸收还是保持自身的优越感。所以在面对第四次工业革命之时，日本社会以何种姿态来面对，将决定日本在这次浪潮中的发展水平。


    ### 隐忍：不给别人添加麻烦的责任感教育


    稍微熟悉日本的人都会明显地感觉到日本是一个非常有秩序感的社会。这种秩序感主要是源于日本社会不给别人添麻烦的社会性的教育规则。而这个规则也是在日本的文化规范等多种原因的影响之下形成的。


    不愿意添麻烦的责任感教育，是日本文化排外性在个人身上的体现。日本作家黑泽明在他的作品《蛤蟆的油：黑泽明自传》中提到：“我们日本人，接受了把看重自我视为恶行，以抛弃自我作为良知的教育，而且习惯于接受这种教育，甚至毫不怀疑”。这种特有的责任感教育让日本社会呈现出了一种极度自制文明状态，而这种极度自制的状态，就造就了日本特有的隐忍文化。这种文化最为我们所熟知的就是日本的武士道精神。本尼迪克特创作《菊与刀》中也将这种武士道精神作为日本的一种显著性格进行了论述。同样在留日医学博士阿溟所著的《真实的日本》一书中，作者解读日本的武士道精神堪称民族性，他提到，与中国人带着血海深仇看武士道是阴险、狡猾和残忍不一样，在西方人眼中，武士道精神最大特点是对负伤的隐忍，无论肉体或是精神的。即使是遇到该流泪的场合，要求人微笑着去面对，使人的情感内敛而不见于形色。这种以极度克制自我的文化现象深入到了日本社会的方方面面。同样在面对第四次工业革命时，隐忍文化对新技术的价值影响也是巨大的。


    首先从积极方面来看，隐忍文化减少第四次工业革命在推行中的压力。如果第四次工业革命带来的文化冲击并没有能够动摇日本社会的正常生活模式，那么隐忍文化能够极大减少社会中的技术抗拒力量。特别是国家在给予第四次工业革命以一种推崇的地位时，因为公众相信技术对于国家发展的重要作用，日本社会会因为隐忍文化而承受技术变革所带来的负面效果，这是日本文化在迎接第四次工业革命变革中最为积极有力的方面。但隐忍的文化并非无限度，通常来讲，这种牺牲必须是短期的剧烈变化，且这种牺牲是有社会承认进行背书的。从这一点上来说，如果第四次工业革命在日本能够轰轰烈烈展开，并且日本社会能够认同个人的牺牲，从日本隐忍的性格来说，很多个人或群体能够做出牺牲来配合技术的革新。


    还有一个积极的方面就是日本的宅文化。因为日本隐忍的文化的影响，现在日本社会诞生出一种宅文化，这种宅文化标志着躲避社交，避免给别人添麻烦，能够自给的生存。随着第四次工业革命的到来，人工智能能够帮助人们在未来实现一种智能化的生活，能够有效减少人们日常事务性的社会交往活动。宅文化在这种智能化技术的帮助下，将更加便捷和有趣，也产生出了对新技术的需求。


    从消极的方面来看，因为日本对于新的革命所带来的麻烦而恐惧，可能会丧失在技术创新上的积极性。回顾20世纪末，日本面对第三次工业革命时所表现出对创新文化的傲慢，一定程度上导致日本在第三次工业革命时就没有突出的表现，日本的内旋文化吸收模式使得经济发展形势不错的日本更愿意接受传统文化的传承，而缺少了变革的动力。再结合日本对秩序感的尊崇和等级制的生活工作状态，外面世界的技术在发生天翻地覆的变化时，日本的隐忍文化只会给日本技术革新带来一种可见的滞后感，等级制更是决定这种变革在更多情况下，只能是自上而下的，社会的底层创新被隐忍文化所压制。


    可以想象，日本社会这种不给别人添麻烦的状态，在面临新技术革命冲击的状态下可能会呈现出两种分化。第一种分化是因为隐忍而选择拒绝，他们不愿意技术创新给自己或别人带来麻烦，这也是日本人在面对新事物的时候，常常以拒绝改变来避免打破现有稳定平和的状态，新事物的不确定性是否会带来不便是无法评估的，而不改变所付出的代价是最少的。所以不愿意给别人添麻烦，而愿意保持自己传统生活的一个惯性无疑将是这部分人的选择。第二种分化是因为国家对新技术的极力推动，日本国民也意识到这种技术革新对于国家发展的巨大推动作用，而愿意牺牲自我，承受整个技术革新之中所带来的麻烦。而且随着日本老龄化的日益严重，劳动力的缺失是日本面临的最大问题，新技术革命因为能够减少劳动力需要，必然会得到一部分人的极大支持。


    综合来看，隐忍文化作为日本普遍的一种民族特性，对于第四次工业革命在日本发展有着极大的影响，这种影响取决于隐忍文化是在接受技术革新还是在抵制技术变革。而且这种影响能够改变日本文化对于第四次工业革命的整体接受程度，这将决定日本政府如何确定第四次工业革命的战略定位，这也将最终决定日本未来技术革命中的表现。


    ## 价值选择：新技术的发展与社会困境


    日本在过去几十年里，经济有了快速的增长，并且在一段时间内长期处于世界第二大经济体的地位，整个国家的工业体系已经形成，并且在世界上占据了领先地位。同时日本的人工智能研究开始得很早，早在1970年代，有日本机器人之父之称的早稻田大学教授加藤一郎就开始研发人工肌肉驱动之下的下肢机器人。目前日本机器人制造发展非常领先，机器人产业占国家经济增长的比重远超过其他国家，拥有着世界上数量最大的机器人用户、机器人设备及服务生产商。随着国际社会对人工智能技术研究的重视，日本政府近些年来也非常重视人工智能的发展，不仅将人工智能、物联网和机器人视为第四次工业革命的核心，还在国家层面建立了相对完整的研发促进机制。新时期，日本在面临以人工智能为代表的第四次工业革命的冲击时，对于已经陷入经济增长低迷的日本来说是不得不抓住的一次机会。


    ### 创新：技术引进与转向“科技立国”


    二战后，日本无论是国家政治还是经济发展、科学技术，都远远落后于欧美国家。这也迫使日本必须形成自己的创新模式，实现在国际市场上的突破。


    “日本模式”的经济发展是通过“模仿再创新”的路径形成的，这也是很多国家利用技术上的后发优势实现经济发展。通常经济学上后发效应是指后进国家借鉴和利用先进工业国家经过反复探索、经历挫折失败、付出巨大代价而获得的先进技术和经验，迅速追赶先进国家的一种捷径。日本内旋式的文化吸收模式在这一次经济发展过程中得到完整体现。经过二战后西方社会的大改造，日本对于西方文化产生一种仰视感，所以在日本自身求发展遇阻的情况之下，日本迅速改变战略，引进国外技术，另辟蹊径。


    战后初期，日本曾经重视自主开发技术，在黑白电视机工业、参变管（parametron）技术、半导体技术等方面也取得了不错的成绩，但最后在自主开发技术和引进技术的较量中，几乎都是以自主开发的失败、外部引进的成功而告终。日本逐步意识到，从国外引进先进技术，具有避免失败的风险、减轻研发的经济负担、缩短掌握新技术的时间等诸多优势。[\[6\]](#txt005.xhtml#footnote_content_txt005_6)经过反复摸索，日本最终形成了一条以引进外国先进技术为主导的技术革新之路。从1956年开始，日本技术革新的重点明显倾向于从外部引进技术和先进的经营理念，并与本国传统的经营理念相结合，形成符合日本国情、满足经济发展需求的模式。经营革新与技术革新一道成为经济高速增长快车的“两个车轮”，两者共同成为了“日本模式”与发挥“后发效应”的重要组成部分。到1965年，除部分尖端技术外，日本对主要先进生产技术均已实现引进，其产业结构和出口结构也呈现重化工业化的倾向；1971年，日本机床工业的对外贸易也从长期逆差转为顺差，这标志着日本先进设备的国产化进入新阶段，基本实现了现代化。与此同时，日本也意识到继续依靠从外部引进技术越来越难，要维持领先地位，必须在继续引进尖端技术的同时，吸收、消化并不断改良引进的技术，日本逐步实现了产品的自主创新，在若干个领域也超过并优于欧美国家。


    之后日本在面临第三次工业革命时，却遭遇了创新的失败。进入20世纪80年代，日本政府为了继续巩固其世界经济大国的地位，依据国际国内经济形势的变化，开始重新调整其科技发展战略，提出了“科技立国”的战略口号。其标志是1980年日本通产省发表了《80年代通商产业政策展望》，其整个内容是与技术政策紧密关联而展开的，其中第六章以“走向技术立国”为标题，从而成为第一次正式提出“科技立国”战略方针的政府文件。同年10月日本科学技术厅公布的《科技白皮书》中再次明确提出了“科技立国”战略。日本“科技立国”战略的提出，标志着日本战后长期以来所推行的引进、消化、模仿这一“吸收型”科技战略时代的结束，开始步入以高科技带动经济增长的时代。


    日本在进入20世纪80年代之后，经济已经居于世界领先地位，同时取代美国成为世界上最大的债权国，日本制造的产品充斥全球。当时日本经济发展过热，日元升值可以帮助日本拓展海外市场，也正是在这种情况之下，日本等国与美国签订了标志“日本模式”的转折点的“广场协议”。从此日本经济由于房地产泡沫陷入了低迷。在这种情况之下，支持日本经济保持发展的主要力量依然是在过去实现了技术优势的传统产业，这使得日本对于本国传统产业有了一种特殊的情感，生活中日本人对本国产品的特殊青睐也是一种间接的体现。这特别归功于日本政府提出并有效地实施了“科技立国”战略，使日本成为仅次于美国的世界第二科技大国。在短短的十几年中取得如此大的科技成就，完全得力于日本在推行“科技立国”战略过程中所采取的科技政策，有效地巩固了之前发展中的产业成果。


    回归到日本的创新政策，在科技发展中，民营企业占主体地位。在日本全国的科研经费中，民营企业支出的部分一直保持着较高的比例。例如，从1960年度到1990年度，全国的研究经费增长了65.6倍，其中企业研究经费增长74.5倍，大学研究经费增长45.9倍，政府研究经费增长6.2倍。上述数字不仅表明日本全国科研经费增长之快，而且表明民营企业的研究经费增长速度大大超过大学与政府研究机构。又如1993年民营企业科研经费支出部分占78.4％，政府支出部分占21.6％。日本民营企业支出的科研经费在全国科研经费中所占的比例约为欧美国家的1.2～1.4倍。这是日本民营企业在科技研究中占主体地位的一个最有说服力的例子。但随着日本经济低迷，90年代以后，日本企业更注意将有限的研究经费与人力集中到应用和开发研究领域中。


    从上述历史过程来看日本的创新，可以看出日本的过去创新表现出两个特点。第一个特点是日本善于利用技术后发优势形成产业发展优势。这个主要表现在面对第三次工业革命时，日本非常善于积极吸收外来优秀技术，迅速整合成自身的产业优势；另外能够积极利用技术成果，提升企业的产品竞争力，实现技术的领先优势，帮助本国经济实现快速发展。第二个特点则是日本在突破性创新上缺少爆发点。在20世纪后20年之中，互联网经济快速兴起，美国和中国等国家产生出了很多新的互联网巨头企业，但日本却鲜有互联网企业出现，而传统企业也在这次互联网浪潮中丧失了很多优势和机遇。


    总体看来，日本技术创新模式与日本文化内旋接收模式也有一定关联，企业能够将外部有利的信息迅速整合成本国优势，同时利用自身的特点迅速完成整合，这是其优势。但同时优势产业一旦形成，就会对新兴产业有一定排斥性，丧失了部分行业优势，这却成为了这种创新模式的一个劣势。日本因为过去技术发展模式，在技术发展上形成了严重路径依赖，使得企业在技术发展上更加偏重应用研究以便于经济效益的提升，而在新兴领域和技术创新上缺少动力。当下，所有国家和企业都已经开始了人才及专利的抢夺，传统技术的后发优势在行业的快速发展之下几近消亡，缺少相关行业规范的新兴优势企业，产生的马太效应却不断在被放大。在面对第四次工业革命浪潮时，日本对于过去传统创新模式的依赖将再次掣肘日本新技术发展。


    针对第四次工业革命的冲击，日本政府在《日本再兴战略2016》中，明确提出实现第四次工业革命的具体措施，通过设立“人工智能战略会议”，从产学官相结合的战略高度来推进人工智能的研发和应用。日本政府在2016年1月颁布的《第5期科学技术基本计划》中，提出了超智能社会5.0战略，认为超智能社会是继狩猎社会、农耕社会、工业社会、信息社会之后，又一新的社会形态，也是虚拟空间与现实空间高度融合的社会形态，同时将人工智能作为实现超智能社会5.0的核心。


    日本政府和企业界开始高度重视人工智能的发展，一方面将物联网、人工智能和机器人作为第四次工业革命的核心，还在国家层面建立了相对完整的研发促进机制，并将2017年确定为人工智能元年。希望通过大力发展人工智能，保持并扩大其在汽车、机器人等领域的技术优势，逐步解决人口老化、劳动力短缺、医疗及养老等社会问题，扎实推进超智能社会5.0建设。


    同时在日本2019年度预算概要中，科学技术领域较2018年度增长13.3％，达到4.351万亿日元。人工智能开发和人才培养等将是预算中的一个重要部分，其中在培养人工智能人才方面的预算约为133亿日元。根据日本国内数据统计，2018年日本政府年度预算案中人工智能相关预算总额约为770亿日元，但投入还不到美国和中国的两成，日本政府与企业的投入仍然有极大的发展空间。


    日本目前的第四次工业革命布局可以概括为以下两个方面。首先，日本非常注重顶层设计与战略引导。日本已经将人工智能作为日本超智能社会5.0建设的核心，在此基础上，日本政府强化体制机制建设、政府引导、市场化运作。采取总务省、文部科学省、经济产业省三方协作，以及产学官协作模式，分工合作联合推进。其次，日本充分利用现有的产业优势进行技术升级。无论是社会5.0，还是机器人战略，以及人工智能的布局，都是立足日本自身产业优势，日本企业的产业强项在汽车、机器人、医疗等领域，其人工智能研发也重点聚焦于这些领域。并且结合社会对老龄化社会健康及护理等对智能机器人的市场需求，以及超智能社会5.0建设等为主要拉动力，突出以硬件带软件、以创新社会需求带产业等特点，针对性非常强，充分突显企业商业化应用的主色调。


    从这个角度上来看，对于第四次工业革命的变化，日本政府和企业高层都充分意识到了这一次人工智能对于经济实现腾飞的重要作用，而且日本在这方面也有相当的历史积累。从客观条件上看，日本对于第四次工业革命的应对明显要比在面对第三次工业革命时要更加从容得多，但是面临的问题依然存在，国家面对完全崭新的产业浪潮时，并没有完整的成功经验。所以，打破创新路径依赖应该成为日本在第四次工业革命时必须重点解决的问题，日本需要去考量如何从过去成功或者失败的经验之中找出面对第四次工业革命时所应该采取的新的技术创新路径。


    ### 共享：隐私保护与技术的边界


    日本对隐私的保护是远超过其他国家的，就像他们不喜欢麻烦别人一样，他们排斥人与人之间的依存关系，厌恶依赖心理。如此敬而远之的相处之道，就形成了日本社会最大的隐私保护。不仅仅是个人隐私方面，同样日本还有一种群体隐私保护，这对于社会经济的影响更为显著[\[7\]](#txt005.xhtml#footnote_content_txt005_7)。日本的群体隐私是非常特殊的，在家庭里面强调家丑不可外扬，在公司集团内部讲究以和为贵，员工的日常社交活动全部集中于会社的内部，尽量减少与外部人员的交流沟通。这种特殊的隐私文化对于第四次工业革命来说影响也是非常巨大的。'
  fmt: '

    # 日本文化与第四次工业革命


    ## 日本文化特点与内旋模式


    从上述几个特点来看，日本文化与同为东亚文化的中国传统文化有着非常明显的区别。长期以来，日本文化是典型的混合文化，在优势文化目前具有很强学习能力和接受性，有着自我约束感极强集体主义。同时，日本文化是弱基因文化（没有自生的文化为主导），缺少去改革创新和挑战权威的文化基因，因此很少在世界文化进步的潮流中带头创新。另外也有学者对此做出了分析，认为日本这种文化接收模式，体现的是一种外来文化工具化心态，一方面使得日本文化表现出庸俗化、表面化倾向，另一方面也影响了它的文化前途，因为日本文化在学习过程中，冷淡了中国文化中最重要的“仁”和西方文化中最重要的“思辨理性”，学习到了外表，却没有学到中西文化中最精华、最根本的东西。[\[5\]](#txt005.xhtml#footnote_content_txt005_5)


    在对日本文化特点讨论中，有学者们认为日本文化能够实现各类外来文化与本土文化平衡，主要来源于日本特殊的文化内旋模式。因为日本是一个岛国，处于东亚文化发展的边缘，在这个文化内旋模型中，原本日本人的生活是独立发展的，但在其独立发展中不断地受到周边外来文化的冲击，于是处在边缘地带的日本人在历史发展中，通过不断地吸收融合外来文化，丰富和发展了自己的文化，并最终形成了这种内旋式的文化吸收模式。这种内旋模式与其处于文化边缘的状态相对应。在外来文化进入之后，本土文化吸收其中的优秀部分，对自己的部分进行改良，这种方式帮助在日本历史发展受益而逐步形成并巩固。这在古代日本吸引古代中国传统中原文化和明治维新之后吸引西方文化时最为明显。内旋式的文化吸收模式完全不同于中国的传统文化和西方文明。中原文化在面对新文化时，更多地是吸引有利于国家和社会发展的部分并将其融合，这个类似于佛教文化传入中原之后发展出来的汉传佛教；西方文化更加强调自己的主导性，对于外来文化更多地以对抗形式，这种冲突一直延续到现在，依然成为很多地方动荡的主要原因。而日本这种文化相对比较特殊，沃尔夫伦在《日本的权力结构之迷》之中是这样描述的，“日本对宗教总是表现出很大宽容，这种观点虽然广为人所接受，不过也只有在新的宗教或信仰体系不会对现有的政治安排造成威胁的时候才适用”，这也能够看出日本文化宽容性与封闭性是区别于中国和西方的。


    需要强调的是文化内旋模式使得日本形成了现在的文化心态和文化模式。日本文化在面对更高层次文明时，它表现为文化内旋的吸收状态，而日本本身处于高层次发展时，则表现出一种文化展现的状态。这个特点一方面使日本文化在其发展中获得了大幅度的跃进，另一方面又使其保留了固有的文化传统。这也是日本能处理好传统文化与外来文化结合的原因之一。在日本历史发展中，越是快速发展的时候，传统文化就越是突出，例如日本在第一次世界大战前后发展为世界五强，此时在文化传统上，日本却开始大幅度地从西欧文化回归东洋文化，这也代表了日本开始展现出自己的文化特点。二战后，日本受到西方文化的大改造，但日本在吸收西方先进文化实现自身快速发展同时，又逐步开始复活本民族的文化传统。相对于日本明治维新与二战战败后的社会改造中的西化潮流，这两次日本本土文化潮流展现出的日本对外来文化的态度，面对强势文化能够全面接受，而自身发展之后再重新评估，进行文化修正。正是这种文化模式的特点，表现出明显的弊病，就是对于强势外来文化的接受缺少完整的本土化，带来两者的潜在冲突。在第三次工业革命兴起之时，也正是日本发展最迅猛之时，此时的日本因为经济的成功而树立了文化自信心，在一定程度上，使得日本在面对新的信息革命冲击时，这种内旋吸收的模式并没有发挥出明显作用，日本的文化的封闭性使得整个社会错失了一次快速发展的机遇。


    这种对外来文化的处理模式对日本传统文化的发展影响是巨大的。一方面日本文化在没有外来文化进入时，表现出封闭性、优越性、排他性；而另外一个方面，当日本文化受到外来领先技术的冲击时，日本文化又会根据自身的发展水平来确定其对待的方式，是文化吸收还是保持自身的优越感。所以在面对第四次工业革命之时，日本社会以何种姿态来面对，将决定日本在这次浪潮中的发展水平。


    ## 隐忍：不给别人添加麻烦的责任感教育


    稍微熟悉日本的人都会明显地感觉到日本是一个非常有秩序感的社会。这种秩序感主要是源于日本社会不给别人添麻烦的社会性的教育规则。而这个规则也是在日本的文化规范等多种原因的影响之下形成的。


    不愿意添麻烦的责任感教育，是日本文化排外性在个人身上的体现。日本作家黑泽明在他的作品《蛤蟆的油：黑泽明自传》中提到：“我们日本人，接受了把看重自我视为恶行，以抛弃自我作为良知的教育，而且习惯于接受这种教育，甚至毫不怀疑”。这种特有的责任感教育让日本社会呈现出了一种极度自制文明状态，而这种极度自制的状态，就造就了日本特有的隐忍文化。这种文化最为我们所熟知的就是日本的武士道精神。本尼迪克特创作《菊与刀》中也将这种武士道精神作为日本的一种显著性格进行了论述。同样在留日医学博士阿溟所著的《真实的日本》一书中，作者解读日本的武士道精神堪称民族性，他提到，与中国人带着血海深仇看武士道是阴险、狡猾和残忍不一样，在西方人眼中，武士道精神最大特点是对负伤的隐忍，无论肉体或是精神的。即使是遇到该流泪的场合，要求人微笑着去面对，使人的情感内敛而不见于形色。这种以极度克制自我的文化现象深入到了日本社会的方方面面。同样在面对第四次工业革命时，隐忍文化对新技术的价值影响也是巨大的。


    首先从积极方面来看，隐忍文化减少第四次工业革命在推行中的压力。如果第四次工业革命带来的文化冲击并没有能够动摇日本社会的正常生活模式，那么隐忍文化能够极大减少社会中的技术抗拒力量。特别是国家在给予第四次工业革命以一种推崇的地位时，因为公众相信技术对于国家发展的重要作用，日本社会会因为隐忍文化而承受技术变革所带来的负面效果，这是日本文化在迎接第四次工业革命变革中最为积极有力的方面。但隐忍的文化并非无限度，通常来讲，这种牺牲必须是短期的剧烈变化，且这种牺牲是有社会承认进行背书的。从这一点上来说，如果第四次工业革命在日本能够轰轰烈烈展开，并且日本社会能够认同个人的牺牲，从日本隐忍的性格来说，很多个人或群体能够做出牺牲来配合技术的革新。


    还有一个积极的方面就是日本的宅文化。因为日本隐忍的文化的影响，现在日本社会诞生出一种宅文化，这种宅文化标志着躲避社交，避免给别人添麻烦，能够自给的生存。随着第四次工业革命的到来，人工智能能够帮助人们在未来实现一种智能化的生活，能够有效减少人们日常事务性的社会交往活动。宅文化在这种智能化技术的帮助下，将更加便捷和有趣，也产生出了对新技术的需求。


    从消极的方面来看，因为日本对于新的革命所带来的麻烦而恐惧，可能会丧失在技术创新上的积极性。回顾20世纪末，日本面对第三次工业革命时所表现出对创新文化的傲慢，一定程度上导致日本在第三次工业革命时就没有突出的表现，日本的内旋文化吸收模式使得经济发展形势不错的日本更愿意接受传统文化的传承，而缺少了变革的动力。再结合日本对秩序感的尊崇和等级制的生活工作状态，外面世界的技术在发生天翻地覆的变化时，日本的隐忍文化只会给日本技术革新带来一种可见的滞后感，等级制更是决定这种变革在更多情况下，只能是自上而下的，社会的底层创新被隐忍文化所压制。


    可以想象，日本社会这种不给别人添麻烦的状态，在面临新技术革命冲击的状态下可能会呈现出两种分化。第一种分化是因为隐忍而选择拒绝，他们不愿意技术创新给自己或别人带来麻烦，这也是日本人在面对新事物的时候，常常以拒绝改变来避免打破现有稳定平和的状态，新事物的不确定性是否会带来不便是无法评估的，而不改变所付出的代价是最少的。所以不愿意给别人添麻烦，而愿意保持自己传统生活的一个惯性无疑将是这部分人的选择。第二种分化是因为国家对新技术的极力推动，日本国民也意识到这种技术革新对于国家发展的巨大推动作用，而愿意牺牲自我，承受整个技术革新之中所带来的麻烦。而且随着日本老龄化的日益严重，劳动力的缺失是日本面临的最大问题，新技术革命因为能够减少劳动力需要，必然会得到一部分人的极大支持。


    综合来看，隐忍文化作为日本普遍的一种民族特性，对于第四次工业革命在日本发展有着极大的影响，这种影响取决于隐忍文化是在接受技术革新还是在抵制技术变革。而且这种影响能够改变日本文化对于第四次工业革命的整体接受程度，这将决定日本政府如何确定第四次工业革命的战略定位，这也将最终决定日本未来技术革命中的表现。


    ## 价值选择：新技术的发展与社会困境


    日本在过去几十年里，经济有了快速的增长，并且在一段时间内长期处于世界第二大经济体的地位，整个国家的工业体系已经形成，并且在世界上占据了领先地位。同时日本的人工智能研究开始得很早，早在1970年代，有日本机器人之父之称的早稻田大学教授加藤一郎就开始研发人工肌肉驱动之下的下肢机器人。目前日本机器人制造发展非常领先，机器人产业占国家经济增长的比重远超过其他国家，拥有着世界上数量最大的机器人用户、机器人设备及服务生产商。随着国际社会对人工智能技术研究的重视，日本政府近些年来也非常重视人工智能的发展，不仅将人工智能、物联网和机器人视为第四次工业革命的核心，还在国家层面建立了相对完整的研发促进机制。新时期，日本在面临以人工智能为代表的第四次工业革命的冲击时，对于已经陷入经济增长低迷的日本来说是不得不抓住的一次机会。


    ### 创新：技术引进与转向“科技立国”


    二战后，日本无论是国家政治还是经济发展、科学技术，都远远落后于欧美国家。这也迫使日本必须形成自己的创新模式，实现在国际市场上的突破。


    “日本模式”的经济发展是通过“模仿再创新”的路径形成的，这也是很多国家利用技术上的后发优势实现经济发展。通常经济学上后发效应是指后进国家借鉴和利用先进工业国家经过反复探索、经历挫折失败、付出巨大代价而获得的先进技术和经验，迅速追赶先进国家的一种捷径。日本内旋式的文化吸收模式在这一次经济发展过程中得到完整体现。经过二战后西方社会的大改造，日本对于西方文化产生一种仰视感，所以在日本自身求发展遇阻的情况之下，日本迅速改变战略，引进国外技术，另辟蹊径。


    战后初期，日本曾经重视自主开发技术，在黑白电视机工业、参变管（parametron）技术、半导体技术等方面也取得了不错的成绩，但最后在自主开发技术和引进技术的较量中，几乎都是以自主开发的失败、外部引进的成功而告终。日本逐步意识到，从国外引进先进技术，具有避免失败的风险、减轻研发的经济负担、缩短掌握新技术的时间等诸多优势。[\[6\]](#txt005.xhtml#footnote_content_txt005_6)经过反复摸索，日本最终形成了一条以引进外国先进技术为主导的技术革新之路。从1956年开始，日本技术革新的重点明显倾向于从外部引进技术和先进的经营理念，并与本国传统的经营理念相结合，形成符合日本国情、满足经济发展需求的模式。经营革新与技术革新一道成为经济高速增长快车的“两个车轮”，两者共同成为了“日本模式”与发挥“后发效应”的重要组成部分。到1965年，除部分尖端技术外，日本对主要先进生产技术均已实现引进，其产业结构和出口结构也呈现重化工业化的倾向；1971年，日本机床工业的对外贸易也从长期逆差转为顺差，这标志着日本先进设备的国产化进入新阶段，基本实现了现代化。与此同时，日本也意识到继续依靠从外部引进技术越来越难，要维持领先地位，必须在继续引进尖端技术的同时，吸收、消化并不断改良引进的技术，日本逐步实现了产品的自主创新，在若干个领域也超过并优于欧美国家。


    之后日本在面临第三次工业革命时，却遭遇了创新的失败。进入20世纪80年代，日本政府为了继续巩固其世界经济大国的地位，依据国际国内经济形势的变化，开始重新调整其科技发展战略，提出了“科技立国”的战略口号。其标志是1980年日本通产省发表了《80年代通商产业政策展望》，其整个内容是与技术政策紧密关联而展开的，其中第六章以“走向技术立国”为标题，从而成为第一次正式提出“科技立国”战略方针的政府文件。同年10月日本科学技术厅公布的《科技白皮书》中再次明确提出了“科技立国”战略。日本“科技立国”战略的提出，标志着日本战后长期以来所推行的引进、消化、模仿这一“吸收型”科技战略时代的结束，开始步入以高科技带动经济增长的时代。


    日本在进入20世纪80年代之后，经济已经居于世界领先地位，同时取代美国成为世界上最大的债权国，日本制造的产品充斥全球。当时日本经济发展过热，日元升值可以帮助日本拓展海外市场，也正是在这种情况之下，日本等国与美国签订了标志“日本模式”的转折点的“广场协议”。从此日本经济由于房地产泡沫陷入了低迷。在这种情况之下，支持日本经济保持发展的主要力量依然是在过去实现了技术优势的传统产业，这使得日本对于本国传统产业有了一种特殊的情感，生活中日本人对本国产品的特殊青睐也是一种间接的体现。这特别归功于日本政府提出并有效地实施了“科技立国”战略，使日本成为仅次于美国的世界第二科技大国。在短短的十几年中取得如此大的科技成就，完全得力于日本在推行“科技立国”战略过程中所采取的科技政策，有效地巩固了之前发展中的产业成果。


    回归到日本的创新政策，在科技发展中，民营企业占主体地位。在日本全国的科研经费中，民营企业支出的部分一直保持着较高的比例。例如，从1960年度到1990年度，全国的研究经费增长了65.6倍，其中企业研究经费增长74.5倍，大学研究经费增长45.9倍，政府研究经费增长6.2倍。上述数字不仅表明日本全国科研经费增长之快，而且表明民营企业的研究经费增长速度大大超过大学与政府研究机构。又如1993年民营企业科研经费支出部分占78.4％，政府支出部分占21.6％。日本民营企业支出的科研经费在全国科研经费中所占的比例约为欧美国家的1.2～1.4倍。这是日本民营企业在科技研究中占主体地位的一个最有说服力的例子。但随着日本经济低迷，90年代以后，日本企业更注意将有限的研究经费与人力集中到应用和开发研究领域中。


    从上述历史过程来看日本的创新，可以看出日本的过去创新表现出两个特点。第一个特点是日本善于利用技术后发优势形成产业发展优势。这个主要表现在面对第三次工业革命时，日本非常善于积极吸收外来优秀技术，迅速整合成自身的产业优势；另外能够积极利用技术成果，提升企业的产品竞争力，实现技术的领先优势，帮助本国经济实现快速发展。第二个特点则是日本在突破性创新上缺少爆发点。在20世纪后20年之中，互联网经济快速兴起，美国和中国等国家产生出了很多新的互联网巨头企业，但日本却鲜有互联网企业出现，而传统企业也在这次互联网浪潮中丧失了很多优势和机遇。


    总体看来，日本技术创新模式与日本文化内旋接收模式也有一定关联，企业能够将外部有利的信息迅速整合成本国优势，同时利用自身的特点迅速完成整合，这是其优势。但同时优势产业一旦形成，就会对新兴产业有一定排斥性，丧失了部分行业优势，这却成为了这种创新模式的一个劣势。日本因为过去技术发展模式，在技术发展上形成了严重路径依赖，使得企业在技术发展上更加偏重应用研究以便于经济效益的提升，而在新兴领域和技术创新上缺少动力。当下，所有国家和企业都已经开始了人才及专利的抢夺，传统技术的后发优势在行业的快速发展之下几近消亡，缺少相关行业规范的新兴优势企业，产生的马太效应却不断在被放大。在面对第四次工业革命浪潮时，日本对于过去传统创新模式的依赖将再次掣肘日本新技术发展。


    针对第四次工业革命的冲击，日本政府在《日本再兴战略2016》中，明确提出实现第四次工业革命的具体措施，通过设立“人工智能战略会议”，从产学官相结合的战略高度来推进人工智能的研发和应用。日本政府在2016年1月颁布的《第5期科学技术基本计划》中，提出了超智能社会5.0战略，认为超智能社会是继狩猎社会、农耕社会、工业社会、信息社会之后，又一新的社会形态，也是虚拟空间与现实空间高度融合的社会形态，同时将人工智能作为实现超智能社会5.0的核心。


    日本政府和企业界开始高度重视人工智能的发展，一方面将物联网、人工智能和机器人作为第四次工业革命的核心，还在国家层面建立了相对完整的研发促进机制，并将2017年确定为人工智能元年。希望通过大力发展人工智能，保持并扩大其在汽车、机器人等领域的技术优势，逐步解决人口老化、劳动力短缺、医疗及养老等社会问题，扎实推进超智能社会5.0建设。


    同时在日本2019年度预算概要中，科学技术领域较2018年度增长13.3％，达到4.351万亿日元。人工智能开发和人才培养等将是预算中的一个重要部分，其中在培养人工智能人才方面的预算约为133亿日元。根据日本国内数据统计，2018年日本政府年度预算案中人工智能相关预算总额约为770亿日元，但投入还不到美国和中国的两成，日本政府与企业的投入仍然有极大的发展空间。


    日本目前的第四次工业革命布局可以概括为以下两个方面。首先，日本非常注重顶层设计与战略引导。日本已经将人工智能作为日本超智能社会5.0建设的核心，在此基础上，日本政府强化体制机制建设、政府引导、市场化运作。采取总务省、文部科学省、经济产业省三方协作，以及产学官协作模式，分工合作联合推进。其次，日本充分利用现有的产业优势进行技术升级。无论是社会5.0，还是机器人战略，以及人工智能的布局，都是立足日本自身产业优势，日本企业的产业强项在汽车、机器人、医疗等领域，其人工智能研发也重点聚焦于这些领域。并且结合社会对老龄化社会健康及护理等对智能机器人的市场需求，以及超智能社会5.0建设等为主要拉动力，突出以硬件带软件、以创新社会需求带产业等特点，针对性非常强，充分突显企业商业化应用的主色调。


    从这个角度上来看，对于第四次工业革命的变化，日本政府和企业高层都充分意识到了这一次人工智能对于经济实现腾飞的重要作用，而且日本在这方面也有相当的历史积累。从客观条件上看，日本对于第四次工业革命的应对明显要比在面对第三次工业革命时要更加从容得多，但是面临的问题依然存在，国家面对完全崭新的产业浪潮时，并没有完整的成功经验。所以，打破创新路径依赖应该成为日本在第四次工业革命时必须重点解决的问题，日本需要去考量如何从过去成功或者失败的经验之中找出面对第四次工业革命时所应该采取的新的技术创新路径。


    ### 共享：隐私保护与技术的边界


    日本对隐私的保护是远超过其他国家的，就像他们不喜欢麻烦别人一样，他们排斥人与人之间的依存关系，厌恶依赖心理。如此敬而远之的相处之道，就形成了日本社会最大的隐私保护。不仅仅是个人隐私方面，同样日本还有一种群体隐私保护，这对于社会经济的影响更为显著[\[7\]](#txt005.xhtml#footnote_content_txt005_7)。日本的群体隐私是非常特殊的，在家庭里面强调家丑不可外扬，在公司集团内部讲究以和为贵，员工的日常社交活动全部集中于会社的内部，尽量减少与外部人员的交流沟通。这种特殊的隐私文化对于第四次工业革命来说影响也是非常巨大的。

