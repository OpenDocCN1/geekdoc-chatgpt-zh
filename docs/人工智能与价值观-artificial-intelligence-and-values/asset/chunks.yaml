- raw: '针对机器人的法律地位问题，早在2016年5月，欧洲议会法律事务委员会就曾掀起一项动议，要求欧盟委员会把飞速发展的自动化机器人赋予“电子人”法律地位[\[59\]](#txt004.xhtml#footnote_content_txt004_59)，并给予这些机器人依法享有著作权、劳动权等“特定的权利与义务”。该动议还建议，为智能自动化机器人设立一个登记册，以便为这些机器人开设涵盖法律责任（包括依法缴税、享有现金交易权、领取养老金等）的资金账户。[\[60\]](#txt004.xhtml#footnote_content_txt004_60)2017年1月，欧洲议会法律事务委员会通过决议，要求欧盟委员会就机器人和人工智能提出立法提案。同年2月，欧洲议会通过了这项决议。[\[61\]](#txt004.xhtml#footnote_content_txt004_61)


    此外，法国学者也开始思考应对机器人法律地位的解决方案。达尼埃尔·布西埃在《从人工智能到虚拟人：一个法人的突现？》一文中指出，“当人类制造的机器人能够在虚拟世界和现实世界不断学习时，它们便获得了自主性，那么人类将如何通过法律对虚拟世界加以控制？如果人造机器人就在我们身边，那么应该赋予它们何种合法权利？”正基于此，他从法理的角度提出了虚拟人的假设，将之看作是一个法律上的人造物，进而建议须根据虚拟人的特征来制定不同的法律，以便处理智能机器人和一般人类之间的纠纷与冲突。[\[62\]](#txt004.xhtml#footnote_content_txt004_62)由此可见，不管人类能否充当这个机器人“造物主”的角色，人类已经开始思考和行动。


    然而，机器人立法过程绝非一帆风顺。在主体地位方面，机器人应当被界定为自然人、法人、动物还是物体？是否需要创造新的主体类型（电子人），以便高级机器人可以享有权利、承担义务，并对其造成的损害承担责任？这些都是欧盟未来在对机器人立法时需要重点考虑的问题。[\[63\]](#txt004.xhtml#footnote_content_txt004_63)


    二是明确人工智能在知识产权方面的“独立智力创造”标准。要回答人工智能创作成果是否应该受法律保护这个问题，很多人不禁想到了我们人类认为的没有独立意识的动物。2011年，印度尼西亚的一群猴子拿着英国摄影师David
    Slate的相机拍了一些照片，包括一张自拍照，这张照片被收录到了维基资源共享图库。摄影师认为猴子在拍摄的过程中自己制造拍摄场景，并把相机放到了脚架上，可以认为是有选择的拍摄过程，这张照片的版权应该归属于猴子。但是从目前各国的法律规定来看，还没有一个国家认为动物可以成为版权所有者，主要原因在于动物目前还不具备独立的智力创造能力。人工智能也是如此。


    2016年，欧盟法律事务委员会建议欧盟委员会就“与软硬件标准、代码有关的知识产权”提出一个更平衡的路径，在保护创新的同时，强化计算机或者机器人作品被纳入版权法保护范畴的可能性。该委员会由此提出人工智能“独立的智力创造”的界定标准，以便明确版权归属。[\[64\]](#txt004.xhtml#footnote_content_txt004_64)


    2019年6月，欧盟版权法改革的主要成果《单一数字市场版权指令》生效。欧盟开始关注人工智能生成内容的版权保护，以激励和保护与人工智能相关的文学艺术作品创作。


    英国在这方面也做了有益探索。对于计算机在没有人类作者参与情况下生成的作品，采取拟制作者的方式，将为创作作品付出必要投入的一方视为作者。其理由是“一些计算机程序能够在人类参与较少的情形下进行内容生成已成为现实。技术的迅猛发展对版权法能否长期适用构成挑战，版权法应具备一定的灵活性”。[\[65\]](#txt004.xhtml#footnote_content_txt004_65)


    德国在人工智能创作邻接权保护方面也做了尝试。邻接权是作品传播者和作品之外劳动成果创造者对其劳动成果享有的专有权利的总称。邻接权产生原因是一些“有价值的非物质劳动成果因独创性不足而无法收到著作法的保护，但这些创造劳动成果的活动另一方面又促进了作品的传播，同时面临容易被未经许可而复制和传播的风险，需要法律进行保护”。因此，德国积极“实施‘欧盟数据库指令’，赋予无独创性的数据库权利人以邻接权，保护数据库编制者和投资者的权益”。[\[66\]](#txt004.xhtml#footnote_content_txt004_66)


    三是评估安全和法律责任。鉴于人工智能系统复杂性以及自主决策的特点，人们需要重新审视既有的安全规则和责任规则。在这方面，欧盟委员会《人工智能白皮书》所附《关于人工智能、物联网和机器人技术安全和责任影响的报告》给出了答案：现行的产品安全法规已经支持了一个扩展的安全概念，即根据产品的用途来保护用户免受产品各种风险的影响。同时，引入新兴数字技术风险条款，提供更多的法律确定性。[\[67\]](#txt004.xhtml#footnote_content_txt004_67)


    某些人工智能系统在其生命周期内的自主行为可能对安全造成一些影响，这可能需要新的风险评估。欧盟产品安全立法规定了在设计阶段规避错误数据风险的具体要求，建立了在使用人工智能产品和系统的整个过程中保持数据安全的机制。此外，欧洲在车联网安全标准方面也做出了努力。欧洲电信标准化协会组织开展相关车联网安全标准研究工作，关注重点聚焦于安全隐私和安全通信。[\[68\]](#txt004.xhtml#footnote_content_txt004_68)


    人工智能、物联网和机器人等新兴技术可能会挑战法律责任框架的某些方面，并降低其有效性。因为新兴数字技术的一些特点可能使受害者难以将损害追溯到过失人身上。这大大增加了受害者成本，也意味着生产者以外的其他人的责任索赔可能难以得到证明。欧盟委员会正在尝试简化责任规则、降低证明法律责任的复杂程度，适应人工智能应用造成损害方面的索赔。[\[69\]](#txt004.xhtml#footnote_content_txt004_69)


    鉴于某些人工智能应用可能对公民和社会带来高风险，为确保人工智能值得信任和安全，符合欧洲价值观和规则，欧盟认为在实践中须制定可适用的法律规则，并启动高风险人工智能应用的合规性评估机制。该机制已适用于欧盟内部的大量产品，并总结出一些注意要素，如应特别考虑某些人工智能系统演变和从经验中学习的可能性，要在有关人工智能系统的整个生命周期中反复进行评估；要验证用于训练的数据，以及用于构建、测试和验证人工智能系统的相关编程和培训的方法、流程和技术等。


    符合规定的所有相关经营者，无论公司地点如何，都须进行符合性评估。为减轻中小企业在高风险人工智能合规性评估的负担，它们可获得数字创新中心的支持，也可使用标准和专用的在线工具帮助合规实践。[\[70\]](#txt004.xhtml#footnote_content_txt004_70)此外，对受到高风险人工智能应用负面影响的当事人，可得到有效的司法补救。而对于不符合高风险的人工智能应用，欧盟一方面调整立法适用范围，一方面设立自愿标签机制。那些不受强制性规定约束的经营者，可自愿决定是否要成为强制规定的约束对象。自愿接受规定约束的人工智能应用将获颁质量标签。这一系列措施都有助于增强用户对人工智能系统的信任，并促进人工智能的全面推广。[\[71\]](#txt004.xhtml#footnote_content_txt004_71)


    ## 本章小结


    随着美国、中国在人工智能领域的强势崛起，欧洲已经在全球规模、深度学习、专利申请、金融投资等方面落后于美、中两国。在不占先机的形势下，欧洲若想突出重围，非另辟蹊径而别无他法。因此，向来有着人权传统的欧洲着重探讨人工智能的价值观，以其作为人工智能发展的“技术规范”，努力确保欧洲在人工智能领域拥有世界话语权和国际竞争力。


    欧洲把人工智能发展目标设为使人们感到被人工智能赋能，而非被其威胁。如何认识欧洲价值观？可以从三个方面入手：一是哲学原点。价值观作为哲学概念，有其自身的逻辑原点。欧洲人工智能的发展，必须遵循欧洲价值观并保护欧洲公民尊严及隐私等基本权利。这就是其哲学原点。二是发展路径。价值观要想引领欧洲人工智能的发展，关键是要谋求合作。欧盟不同于美、中等实体国家，它是一个政治联盟，而且较为松散。要想聚沙成塔，非合作这剂良药不可。无论是成员国间合作，还是与私营部门合作，抑或是国际合作，都很明确地说明了这一点。三是终极命题。一项技术，特别是好的、先进的技术一经诞生，其最终命运是要存续而不是废止，人工智能亦是如此。当更高级别的通用型人工智能和超级人工智能出现之时，人类与机器的关系会面临更多新的、未知的、一时难以解决的挑战。但这些只是促使人工智能越发完善、越发类人化的“铺路石”。人机之间可以协助、相处，机器可以享有人道主义待遇，这些都将会是不可阻挡的未来趋势。


    欧洲为什么提出“以人为本”的价值观？因为欧洲向来有着人权传统。1215年，英国贵族与国王签定《大宪章》，王权逐步受到限制。1640年，英国资产阶级革命爆发。1689年，英国颁布《权利法案》，以法律形式对王权进行明确制约，确立了君主立宪政体。百年之后的1789年，世界近代史上一次规模最大、范围最广的法国资产阶级革命，结束了法国1
    000多年的封建统治，震撼了整个欧洲大陆的封建秩序，进一步打击了欧洲封建主的统治。期间颁布纲领性文件《人权宣言》，宣布自由、财产、安全和反抗压迫是天赋不可剥夺的人权，使自由、平等、博爱等思想真正在整个欧洲生根并传播开来。历经几百年的传统积淀，天赋人权浸入到每个欧洲人的血液和骨髓之中。


    欧洲如何实践自身的人工智能价值观？欧洲注重技术、人才、法律和伦理的“三轮驱动”，一如三角形特有的稳定性，攻克技术、培育人才、兼顾法理，三个要素缺一不可。一方面，延续工业和法律上的优势并继续巩固扩大；另一方面，推动人工智能在中小企业和公共部门的应用；再一方面，重视个人技能的培训和监管等。


