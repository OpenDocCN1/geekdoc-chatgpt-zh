    - [后　记　共同关注](#att001.xhtml#att001_1111)\n\n# 第1章　技术革命中的价值观演变\n\n## 比较视野中价值观的多样性\n\
    \n价值观是多种人文、社会学科共同关注的问题，哲学、经济学、伦理学、教育学、人类学、社会学、社会心理学等学科都在这一领域进行过不同角度的探索。[\\[1\\\
    ]](#txt001.xhtml#footnote_content_txt001_1)其中，哲学关注价值观所反映的主体和客体之间的关系；伦理学关注价值观对人的行为的规范性；人类学关注价值观表达的文化特征；教育学关注影响价值观形成和改变的个体社会化过程及其教育干预；经济学关注人类经济行为的深层心理原因和类型；社会学关注社会结构及社会变迁对价值观的影响；社会心理学则关注价值观的心理结构、过程、功能及其测量。[\\\
    [2\\]](#txt001.xhtml#footnote_content_txt001_2)\n\n早在20世纪30年代，美国心理学家奥尔波特（G.W.Allport）和弗农（P.E.Vernon）采用德国心理学家斯普兰格（E.Spranger）对人的六种分类（经济的、理论的、社会的、审美的、宗教的、权力的）制订了一份“价值观研究量表”，进行了具有开创意义的价值观研究。[\\\
    [3\\]](#txt001.xhtml#footnote_content_txt001_3)20世纪50年代，由美国人类学家克莱德·克拉克洪（Clyde\
    \ Kluckhohn）提出的价值观定义确立了支配地位，从操作层面对价值观的各种定义进行了整合。他认为：价值观是一种外显的或内隐的，有关什么是“值得的”看法，它是个人或群体的特征，它影响人们可能会选择什么行为方式、手段和结果来生活。[\\\
    [4\\]](#txt001.xhtml#footnote_content_txt001_4)20世纪70年代，美国社会心理学家米尔顿·罗克奇（Milton\
    \ Rokeach）把价值观理解为一种信念，他把价值观分为终极价值观和工具性价值观两个方面，开始了从维度而不仅仅是从内容上对价值观的分析和测量，使价值观的研究进一步走向深入，[\\\
    [5\\]](#txt001.xhtml#footnote_content_txt001_5)由他编制的《罗克奇价值观调查表》至今仍是国际上广泛使用的价值观问卷。20世纪80年代以来，以美国社会心理学家谢洛姆·施瓦茨（Shalom\
    \ H.Schwartz）为代表的研究者开始从需要和动机出发来解释价值观的深层内涵，试图在此基础上构建一个具有普遍文化适应性的价值观的心理结构。施瓦茨认为，价值观是合乎需要的超越情境的目标，它们在重要性上不同，在一个人的生活中或其他社会存在中起着指导原则的作用。[\\\
    [6\\]](#txt001.xhtml#footnote_content_txt001_6)\n\n由于视角、方法的不同，研究者对价值观概念的界定难以统一，但我们不难从中看出一些共识。从价值观的主体角度考虑，它既可能是一种个体现象，也可能是一种社会现象，还可能是一种文化现象；从价值观的表现形式看，它既可能是外显的也可能是内隐的；从价值观的功能看，多数研究者认为价值观对行为具有导向作用。\n\
    \n与世界观、人生观一样，价值观具有多样性，涉及社会生活的各个领域，任何一个社会都存在着多种多样的价值观，它们反映了社会多种多样的文化传统，人们多种多样的生存条件、活动方式和利益等。在传统社会，由于社会生活分化的不充分以及社会关系的狭隘，价值观总体上具有一定的单调性和封闭性。现代社会的复杂多样及其冲突，打破了传统社会单调、封闭、僵化的状态。特别是由社会生产力从低到高的发展以及科技进步对全球空间版图的重构而推动的经济全球化，极大拓展了人类的生存空间，促进了全球治理体系的革新。与此同时，经济全球化也加剧了不同发展道路、文化、宗教信仰之间的激荡碰撞，价值观的多样性成为一个显著的事实。\n\
    \n社会层面的价值观研究在西方发达国家是较为普遍的。长期以来，许多学者致力于在社会、文化以及政治不断变迁的情境下，探讨全球不同国家和地区居民的价值与行为，并通过普查的方式探寻个人的微观价值观变化与社会变迁之间的联系。其中，由美国政治学家罗纳德·英格尔哈特（Ronald\
    \ Inglehart）主持的世界价值观调查项目（World Values Survey，WVS）是涉及范围较广、产生影响较大的典型代表。该项目由瑞典的非营利组织“世界价值观研究协会”（World\
    \ Values Survey Association，WVSA）主持进行，是一项描述世界社会文化和政治变迁等问题的调查研究。WVS的调查对象是全球范围内具有代表性国家或地区的普通民众，目前已发展到六大洲97个社会群体中，覆盖了88％的世界人口。具体说来，WVSA从20世纪80年代起以4至5年为一个周期开展价值观普查，通过委派组织成员进行调查督导，委托当地研究机构进行以随机抽样访谈的方式来完成数据采集的工作。\n\
    \n基于WVS的数据，英格尔哈特和德国政治学家克里斯蒂·韦尔泽（Christian Welzel）设计出了一套四维世界价值观地图（见图1-1）来展现全球范围内的跨文化差异（Cross-Cultural\
    \ Variation）。在四维地图中，人类价值观被定义为“自我表达”“世俗理性”“传统价值观”“生存价值观”。其中，“世俗理性”与“传统价值观”反映了社会群体之间两个相反的过程，靠近“传统价值观”一侧更加强调家庭教育、传统礼仪和对权威的遵从，以及反对自杀、堕胎和讲究伦理等传统家庭观念。相反的一侧，即“世俗理性”则更加倾向于个人自身的实际需要。[\\\
    [7\\]](#txt001.xhtml#footnote_content_txt001_7)\n\n![img](images/txt001_1.jpg)\n\
    \n图1-1　英格尔哈特—韦尔泽世界文化地图（Inglehart-Welzel cultural map of the world）\n\n在图1-1上，纵坐标向上移动反映了从“传统”到“世俗理性”的转变，传统价值观强调宗教、亲子关系、尊重权威和传统家庭的重要性，信奉这些价值观的人拒绝离婚、堕胎、安乐死和自杀，同时一般都有高度的民族自豪感和民族主义观。世俗理性价值观与传统价值观有相反的偏好。在世俗理性价值观占优的社会宗教、传统家庭和权威不会得到特别的重视，离婚、堕胎、安乐死和自杀被认为是相对可以接受的。横坐标向右移动则反映了从“生存”到“自我表达”的转变。生存价值观强调经济和人身安全，这与相对种族中心主义的观点以及低水平的信任和宽容有关。自我表达价值观高度重视环境保护，对外国人、男女同性恋者和不同性别更为平等。从图1-1中还可以看出，经济的全球化并未掩盖价值观的多样性，在全球范围内，社会之间的基本价值观差异仍然比社会内部大得多。\n\
    \n价值观多样性源于人的需要是价值关系形成的主体依据。[\\[8\\]](#txt001.xhtml#footnote_content_txt001_8)人们正是在意识到需要的基础上对各种价值关系进行判断、反思和整合，才形成了价值观。不同的人有不同的需要和自我意识，从而形成不同的价值观。人的需要的多层次性，决定了价值观的多层次性；人的需要的社会性，决定了价值观的社会性；人的需要的历史性，决定了价值观的历史性。\n"
  trans: "\n\n![img](img/cov001_1.jpg)\n\n![img](img/bok001_1.jpg)\n\n# Book Cataloging-in-Publication\
    \ (CIP) Data\n\nArtificial Intelligence and Values / Compiled by Li Renhan et\
    \ al. — Shanghai: Shanghai Jiao Tong University Press, 2021\n\nISBN 978-7-313-24957-9\n\
    \nⅠ.①Artificial Intelligence…　Ⅱ.①Li…　Ⅲ.①Artificial Intelligence　Ⅳ.①TP18\n\nChina\
    \ National Library CIP Data Verification No. (2021) 092254\n\n# Artificial Intelligence\
    \ and Values\n\nARTIFICIAL INTELLIGENCE AND VALUES\n\n**Compiled by**: Li Renhan,\
    \ Huang Qingqiao, et al.\n\n**Published by**: Shanghai Jiao Tong University Press　　　　　　　　　　　**Address**:\
    \ No. 951 Panyu Road, Shanghai\n\n**Postal Code**: 200030　　　　　　　　　　　　　　　　　**Tel**:\
    \ 021-64071208\n\n**Printed by**: Shanghai Xinyi Printing Co., Ltd.　　　　　　　　　　**Distributed\
    \ by**: Xinhua Bookstores Nationwide\n\n**Format**: 880mm×1230mm 1/32　　　　　　　　　　\
    \ **Print Sheets**: 7.125\n\n**Word Count**: 139 thousand words\n\n**Edition**:\
    \ 1st Edition, June 2021　　　　　　　　　　　　　**Printing**: 1st Printing, June 2021\n\n\
    **ISBN**: 978-7-313-24957-9\n\n**Price**: ¥68.00\n\nAll rights reserved. Infringement\
    \ will be prosecuted.\n\nNote to Readers: If you find any printing or binding\
    \ quality issues with this book, please contact the Quality Department of the\
    \ printing factory.\n\nContact Tel: 021-33854186\n\n# Abstract\n\nArtificial intelligence\
    \ is entering various industrial fields and social aspects in a subtle and gradual\
    \ manner, heralding a future landscape of integration between technology, economy,\
    \ society, and life. Gaining a deep understanding of the application of artificial\
    \ intelligence and accurately assessing its impact on the social moral value system\
    \ will be an important means for China to cope with the next period of rapid development,\
    \ so as to clarify the direction of progress, achieve refined governance, and\
    \ maintain the stability and sustainable development of the social value system\
    \ in the tide of technology.\n\n# Editorial Board\n\n**Chair**: Li Renhan, Huang\
    \ Qingqiao\n\n**Members**: Yang Xiaokang, He Liming, Shen Xincheng, Ye Lu, Zhai\
    \ Yunjie, Zhou Zheng, Li Fangwei, Huang Leiyu\n\n# Chapter Assignments\n\n- Chapters\
    \ 1 & 2: Li Fangwei (Peking University)\n- Chapter 3: Shen Xincheng (Shanghai\
    \ Jiao Tong University)\n- Chapter 4: Ye Lu, Zhai Yunjie (Shanghai Jiao Tong University)\n\
    - Chapter 5: Zhou Zheng (Shanghai Jiao Tong University)\n- Chapter 6: Huang Qingqiao,\
    \ Huang Leiyu (Shanghai Jiao Tong University)\n- Postscript: Li Renhan, Shen Xincheng\
    \ (Shanghai Jiao Tong University)\n\n# Preface\n\n2015–2020 witnessed explosive\
    \ growth in artificial intelligence, which has begun to \"embed\" itself into\
    \ people's production and life. Countries and regions such as the United States,\
    \ the European Union, the United Kingdom, Japan, South Korea, ASEAN, and China\
    \ have successively strengthened top-level design and established specialized\
    \ institutions to coordinate and promote major scientific and technological R&D\
    \ projects in artificial intelligence. At present, artificial intelligence has\
    \ transformed and upgraded from a free-exploration scientific research model to\
    \ a national-strategy-driven innovation development model. Governments, universities,\
    \ research institutions, industries, and financial circles worldwide are vying\
    \ for the frontier positions in this field. Layouts at different levels all point\
    \ to the same projection: in the coming decades, artificial intelligence possesses\
    \ enormous potential to change global society.\n\nIn January 2018, the Artificial\
    \ Intelligence Research Institute of Shanghai Jiao Tong University was established\
    \ and unveiled. In February of the same year, it was approved to build the Key\
    \ Laboratory of Artificial Intelligence of the Ministry of Education. In 2019,\
    \ Shanghai Jiao Tong University became one of the first batch of universities\
    \ in China to establish an undergraduate major in Artificial Intelligence. At\
    \ the graduate education level, Shanghai Jiao Tong University established the\
    \ Wu Wenjun Honorary Doctoral Class in Artificial Intelligence, focusing on cultivating\
    \ leading talents in the field of artificial intelligence. At the same time, adhering\
    \ to the tenet of \"Rooted in Shanghai, Radiating the Yangtze River Delta, Serving\
    \ the Nation,\" Shanghai Jiao Tong University provides solid intellectual support\
    \ for the development of China's artificial intelligence industry. Shanghai Artificial\
    \ Intelligence Research Institute Co., Ltd., jointly built under the leadership\
    \ of Shanghai Jiao Tong University, is realizing entity-based platform operation.\
    \ Together with the Shanghai Jiao Tong University Suzhou Artificial Intelligence\
    \ Research Institute and the Shanghai Jiao Tong University Ningbo Artificial Intelligence\
    \ Research Institute, they have jointly completed the layout of the \"Shanghai-Ningbo-Suzhou\
    \ Yangtze River Delta AI Collaborative Innovation Platform,\" jointly exploring\
    \ \"Government-Industry-Academia-Research-Application-Finance\" cooperation between\
    \ universities and local governments in the field of artificial intelligence.\n\
    \nOver the past three years, Shanghai Jiao Tong University has not only sought\
    \ development and progress in artificial intelligence theory, technology, application,\
    \ and talent cultivation, but also attached great importance to the study of social\
    \ issues brought about by artificial intelligence. The book *Artificial Intelligence\
    \ and Values* is one of the research outcomes. During the compilation process,\
    \ this book examines the development of artificial intelligence with a historical\
    \ perspective and a global vision. It is rich in materials, plain in style, and\
    \ upholds a rational, objective, and rigorous academic research attitude. Through\
    \ research on the evolution of values in technological revolutions, the reshaping\
    \ of values brought by AI development, AI and American values, AI and European\
    \ values, AI and Japanese values, and AI and Chinese values, it proposes that\
    \ countries valuing AI development need to unite and cooperate, seek common ground\
    \ while reserving differences, and seek the greatest common divisor of values,\
    \ which concerns the future shared by all humanity. It also proposes that the\
    \ world, while developing AI, pays high common attention to issues such as being\
    \ people-centered, harmony in diversity, and a community with a shared future\
    \ for mankind.\n\nCurrently, as AI development is in its initial stage, there\
    \ are still shortcomings, omissions, and errors in the compilation of this book.\
    \ It is hoped that the editorial board members will continue to track, continuously\
    \ improve, and correct them in the future, making due contributions to the sustained\
    \ and healthy development of artificial intelligence.\n\n![img](img/fow004_1.jpg)\n\
