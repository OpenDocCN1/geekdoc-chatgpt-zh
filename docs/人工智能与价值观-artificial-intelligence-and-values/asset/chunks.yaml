  trans: '


    ## Robot Market Potential and Human-Machine Ethical Challenges


    Returning to technological development itself, China''s robot market currently
    possesses enormous demand potential, with significant growth space in both industrial
    and service sectors. According to statistics from the International Federation
    of Robotics (IFR), China''s robot density is expected to exceed 130 units per
    10,000 employees in 2021, reaching the average level of developed countries. In
    2019, the scale of China''s industrial robot market was projected to reach $5.73
    billion; by 2021, the domestic market scale was expected to expand further, surpassing
    $7 billion. With the accelerating trend of population aging and sustained demand
    in healthcare and education, China''s service robot sector holds huge market potential
    and development space. In 2019, China''s service robot market scale was expected
    to reach $2.2 billion, a year-on-year increase of approximately 33.1%, higher
    than the global service robot market growth rate. Among them, the market scales
    for China''s domestic service robots, medical service robots, and public service
    robots were $1.05 billion, $620 million, and $530 million respectively, with domestic
    and public service robots showing relatively leading growth rates. By 2021, with
    the rapid development of robots in emerging application scenarios such as parking
    robots and supermarket robots, China''s service robot market scale was expected
    to approach $4 billion.[[13]](#txt006.xhtml#footnote_content_txt006_13) Such a
    massive robot market scale makes the human-machine ethical issues facing China
    even more thorny, requiring both a forward-looking approach to potential future
    crises and a pragmatic stance to solve practical problems. For example, if a wealth
    management robot makes an error, who should bear the loss? Wealth management robots,
    also known as robo-advisors, are investment portfolios crafted based on AI algorithms
    analyzing clients'' asset and consumption data, background and risk preferences,
    investment habits, etc. Currently, major Chinese banks, securities firms, and
    insurance companies have entered related products to varying degrees. If a robot
    malfunctions or is hacked, resulting in investor losses, whose responsibility
    is it? Similarly, in the field of medical robots, although medical robots are
    not yet widespread, in some hospitals, specific robots have begun assisting doctors.
    If a robot malfunctions, who should be liable for the medical accident? In response
    to such issues, China has actively responded with a responsible attitude. In November
    2018, the Council of Chairpersons of the Standing Committee of the National People''s
    Congress (NPC) organized a special study session, conducting learning and discussions
    around regulating AI development. It was believed that the relevant special committees,
    working bodies of the NPC, and relevant departments should start early and act
    quickly, conduct in-depth investigation and research on legal issues involved
    in AI, and lay a solid foundation and make good preparations for relevant legislative
    work.


    In addition to the above discussions on machine moral responsibility, an important
    factor influencing AI development is data. The emergence of big data has propelled
    the rapid development of this round of AI. Since the birth of human society, humans
    have dealt with data, but never before have the scale and variety of data been
    so enormous and rich. The acquisition and use of data is not only an important
    dimension for thinking about human-machine relations but also the key to the healthy
    development of AI and gaining social trust. In the past, people were limited in
    data collection, storage, and computing. Today, with the development of electronic
    computers and the support of high-performance computing, data is driving an unprecedented
    great revolution. The landing and application of AI in numerous fields benefit
    from data intelligence realized based on big data. Currently, global data volume
    is still growing rapidly. China enjoys a relative advantage in data, with large
    volume, diverse and rich types, and more convenient acquisition and use. This
    is mainly due to China''s large population base, which, accompanied by increasing
    levels of informatization and datafication, has generated massive amounts of data.
    In 2019, the China Internet Network Information Center (CNNIC) released the "Statistical
    Report on Internet Development in China," showing that as of December 2018, China''s
    netizen scale reached 829 million, with an Internet penetration rate of 59.6%,
    among which mobile netizens reached 817 million. People not only go online for
    entertainment and leisure but have also cultivated habits such as QR code payment,
    mobile phone bill payment, and mobile travel, accumulating massive data. The advent
    of AI, particularly the boost from high-performance computing capabilities and
    intelligent algorithms, has brought convenience to data analysis and processing.
    Chinese social values hold a more open attitude towards data mining and analysis,
    and awareness of personal privacy protection is not extremely strict; people are
    willing to provide relevant information in social and consumption scenarios to
    obtain personalized services. For instance, enterprises can obtain user portraits,
    behavioral preferences, credit status, and other data information, promoting changes
    in enterprise business models, business processes, and product applications and
    services, accelerating transformation towards intelligence, and creating new value.


    On the other hand, the leap in technology has powerfully helped expand the scale
    and scope of data collection. Generally, data collection sources mainly include:
    business-level data, social media and self-media data, e-commerce data, proprietary
    App behavioral data, and various Internet platform interaction data and offline
    store data entry, etc. By applying AI, especially the development of computer
    vision, these data can be collected, analyzed, and processed at scale, forming
    massive databases. Technologies involved in computer vision include facial recognition,
    image recognition, image segmentation, image generation, object detection, etc.
    These technologies are closely related to data-generating scenarios in daily life
    and help complete a large amount of data collection work. Facial recognition is
    the most widely applied field in computer vision. China''s innovation capability
    and R&D strength in technology have led the world, providing not only better development
    soil in terms of values and policies but also investing considerable academic
    research support. Furthermore, "with the continuous advancement of computer vision
    research, researchers have begun to challenge more difficult computer vision problems,
    such as image captioning, event reasoning, scene understanding, etc."[[14]](#txt006.xhtml#footnote_content_txt006_14),
    understanding more complex scenarios where data is born in the real world. In
    summary, computer vision technology uses cameras and computers to replace human
    eyes to observe and read phenomena in this world, store them in data form, conduct
    rapid processing and analysis, and complete tasks such as segmentation, classification,
    recognition, tracking, and judgment decision-making. Currently, in the composition
    of China''s computer vision market, the security sector accounts for the highest
    proportion[[15]](#txt006.xhtml#footnote_content_txt006_15), exceeding half of
    the entire market share, which also explains from the side why China''s data resources
    are so rich. Chinese social values tend to prioritize security over privacy and
    the collective over the individual. Security cameras and traffic cameras are widely
    applied, comprehensively maintaining safety in unmanned or public places, automatically
    alarming upon detecting anomalies, automatically analyzing traffic violations,
    recognizing vehicle license plates, and regulating traffic. The development of
    AI has promoted the improvement of service capabilities in China''s security and
    traffic fields, but ultimately, it is inseparable from the strong support of Chinese
    social values. From the perspective of government and public interest, based on
    data analysis, a safer living environment and more convenient travel services
    are created for people.


    Such a large scale of data volume and data application demand also brings a series
    of problems, such as data circulation, data usage norms, data openness, and data
    security. These are not only difficulties and problems faced by AI algorithms
    but also major challenges and opportunities facing national socio-economic development.
    China not only needs to establish and improve laws and regulations to regulate
    data use, take proactive countermeasures prospectively, and guarantee the comprehensive,
    sustainable, and healthy development of the AI industry. At the same time, it
    must accelerate the resolution of problems faced by Chinese AI enterprises, such
    as low data openness, difficult data circulation, and data quality needing improvement.
    These problems stem from both inherent limitations of self-development and rule
    obstacles from the international community. In the context of the data economy,
    no country or organization can remain unscathed; data governance is particularly
    important. On November 21, 2020, Chinese President Xi Jinping pointed out at the
    15th G20 Leaders'' Summit, "Facing concerns of various countries regarding data
    security, digital divide, personal privacy, ethics, etc., we must adhere to a
    people-centered, fact-based policy orientation, encourage innovation, build mutual
    trust, support the UN in playing a leading role, and jointly create an open, fair,
    just, and non-discriminatory digital development environment." He also stated,
    "China has proposed the ''Global Initiative on Data Security,'' and is willing
    to use this as a basis to discuss and formulate global digital governance rules
    with all parties, support strengthening dialogue around AI, propose convening
    a special meeting at an appropriate time, promote the implementation of the G20
    AI Principles, and lead the healthy development of global AI."[[16]](#txt006.xhtml#footnote_content_txt006_16)
    In 2020, the first volume of a series of books based on the practice of the Guizhou
    Big Data Comprehensive Pilot Zone as a research sample for data governance, "On
    Data Governance," was published. The book points out, "Value release is the fundamental
    goal of data governance. The quality of data utilization and the magnitude of
    value release have become key indicators of the comprehensive competitiveness
    of a country, region, or organization. Through the combination of theory and practice,
    and the dual drive of systems and technology, we can improve data quality, promote
    sharing, openness, development, and utilization, laying a good foundation for
    ''speaking with data, deciding with data, managing with data, and innovating with
    data,'' thereby laying the foundation for promoting the modernization of the national
    governance system and governance capacity."[[17]](#txt006.xhtml#footnote_content_txt006_17)


    ## Pursuing Development: Technology Empowerment and Productivity Reconstruction


    AI comprehensively empowers production and life, with a large number of scientific
    and technological achievements landing, bringing leapfrog economic development.
    People''s modes of interaction, consumption, and other behavioral patterns have
    transformed, shifting from actual physical distance between people to online forms,
    with deep reliance on smart devices and intelligent interaction methods gradually
    permeating human-led social relations. Open, transparent, convenient, and high-speed
    interaction technologies and landing products are bringing new social model innovation
    experiences. Simultaneously, the large-scale deployment of intelligent products
    replacing traditional jobs has plunged the status and significance of labor valued
    by Chinese people into an unprecedented predicament. However, in the process of
    pursuing development, adapting to the needs of the times, social productivity
    is also undergoing corresponding reconstruction.


    ### Rapidly Changing Behavioral Patterns


    With the development of Internet technology, the methods and speed of information
    transmission and dissemination have undergone tremendous changes. The rise of
    network society turns individuals into small nodes in a network of relationships,
    enabling dialogue and expression of views through communication devices without
    meeting face-to-face. Since 2016, with the development of AI industry applications,
    continuous upgrades of smart terminal devices, and universal access to mobile
    networks, AI has brought brand-new social interaction methods. A large number
    of content distribution platforms and creators have surged, the scale of the digital
    industry has achieved breakthrough development, and the production and dissemination
    of digital content have become a new form of social interaction, further detaching
    communication between people from reality.


    This has both promoted socio-economic development and brought potential social
    crises. On the one hand, the explosive growth of information, undesirable advertisements
    from algorithmic recommendations, and fabricated fake news emerge endlessly, not
    only occupying a large amount of users'' time but also bringing more complexity
    and uncertainty to relationships between users. On the other hand, while AI has
    promoted the vigorous development of online social tools and platforms, corresponding
    social rules and governance methods remain in the "old" stage, lacking effective
    solutions and coping measures in the face of new situations. This phenomenon also
    exposes the intertwined generalization of social problems and risks. Under the
    influence of intelligent technology, the problems people need to handle exceed
    the boundaries carried by traditional social relations, moving to the level of
    human-machine relations. At the same time, AI development faces huge social pressure,
    and the demand for technical optimization and upgrading is more urgent. Traditional
    manual review speed and personnel scale cannot cope with massive graphic and text
    information; the imperfection of existing algorithmic review mechanisms has led
    to a serious disconnect between content review capabilities and actual situations,
    causing tremendous pressure and challenges to dissemination. Even the thorny "bias"
    and "black box" problems of AI algorithms have, to some extent, brought more serious
    interpersonal communication problems, such as users receiving unjust, one-sided
    information, or even information tinged with cultural or regional discrimination.
    China upholds the spirit of responsibility preceding freedom and the collective
    above the individual, always starting from the fundamental interests of the broadest
    masses of the people, and has repeatedly rectified content on mainstream social
    platforms, standardized civilized online behavior, and purified the online environment,
    striving to provide a comfortable and healthy atmosphere for interaction in the
    new era mode.


    During the 2020 epidemic, China''s social media played an important role with
    the help of AI, highlighting social value. As a distribution platform for news
    and information, social media became an important channel for the public to understand
    the epidemic. Major social media platforms, based on the open, transparent, true,
    and rapid dissemination of information, played an important role in eliminating
    and reducing social panic. Taking China''s three major social platforms as an
    example: WeChat Official Accounts achieved rapid information distribution leveraging
    acquaintance social relationship chains, with multiple epidemic-themed articles
    exceeding 1 million reads; Weibo, as the only square-style social media, played
    the role of an information hub during this epidemic, integrating multiple functions
    such as policy conveyance, epidemic assistance, social supervision, humanistic
    care, scientific rumor refutation, and social stability maintenance. With the
    epidemic map as a carrier, it aggregated the latest epidemic dynamics and domestic
    and international epidemic developments, reducing asymmetric risks in the information
    transmission process; Zhihu leveraged its Q&A community advantages, launching
    a special series on novel coronavirus prevention and control, covering scientific
    rumor refutation, protection guidelines, psychological assistance, and other special
    zones for fighting COVID-19, and jointly opened free consultation channels with
    online medical health platforms such as Ali Health and Haodf.com. During the epidemic,
    answers related to "novel coronavirus" garnered 1.73 billion reads.[[18]](#txt006.xhtml#footnote_content_txt006_18)
    It can be seen that fully utilizing technical advantages and playing to technical
    strengths, AI has shown its prowess in the field of social media, improving the
    reputation and word-of-mouth of Chinese social media. This also conveys a new
    model of "human relations" in China today: in terms of human-to-human relations,
    we must continuously innovate interaction models and mobilize user enthusiasm;
    in terms of human-to-content production, establish a more vertical ecological
    circle based on technical means, gather users to form efficient and credible circle-layer
    dissemination.


    China is a populous country and a consumption powerhouse. In the consumption field,
    commodity exchange is an important component of human interaction. Currently,
    consumption is moving towards a digital model. With the help of the Internet,
    mobile Internet, and smart terminal devices, consumption methods are more flexible,
    convenient, and efficient, shaping a completely new consumption form. The rise
    of social platforms provides more stimulating ways for consumption. The natural
    attribute of sharing and communication on social platforms makes the younger generation
    the main force of consumption, contributing a large amount of consumption experience
    and service evaluation. According to Accenture research in 2017, Chinese post-95s
    consumers like to shop directly through social platforms, with 70% of respondents
    expressing interest in direct shopping transactions via social media.[[19]](#txt006.xhtml#footnote_content_txt006_19)
    Technological development has shifted consumption channels and methods online.
    News of the demise of the retail industry once occupied headlines. Although such
    news often has more hype than reality, under the empowerment of AI, the model
    of traditional retail is undergoing earth-shaking changes. Currently, consumer
    data is growing exponentially, AI algorithm accuracy and computing power are improving,
    and technologies such as smart hardware, AIoT[[20]](#txt006.xhtml#footnote_content_txt006_20),
    virtual reality, and 5G continue to develop. AI has penetrated multiple links
    of the retail industry''s landing value chain, among which machine learning and
    computer vision are the two major technologies supporting "AI + Retail." Machine
    learning is mainly applied to data analysis and modeling to achieve data intelligence
    and industrial chain optimization; computer vision technology is applied to the
    recognition and analysis of consumers and goods, and related applications have
    achieved landing.[[21]](#txt006.xhtml#footnote_content_txt006_21)


    "AI + Retail" uses AI-core technologies to support online and offline retail scenarios,
    incorporating retail system links such as stores, warehousing, and logistics into
    digital management and operations, including: using computer vision technology
    to manage various product display information such as online images and videos;
    using speech recognition, semantic understanding, and other NLP technologies to
    guarantee intelligent customer service; using machine learning algorithms to analyze
    users'' Internet usage habits and retention data for precise and personalized
    recommendations; using big data analysis technology to collect, organize, and
    summarize industry information to provide intellectual support for enterprise
    production and operation decisions. These differ greatly from traditional retail
    methods. Traditional store shopping guides often complete product recommendations
    through communication with customers. Whether products meet customer expectations,
    are liked by customers, or stimulate consumption desire carries great uncertainty.
    The ideal scenario for AI entering the retail field is to connect online and offline
    retail. Consumers can purchase or reserve online and then choose store pickup.
    Offline stores can also understand corresponding consumption preferences based
    on consumer data for communication and recommendation, creating a more efficient
    purchasing model.


    From a data perspective, AI sales forecasting based on big data can achieve 75%–85%
    accuracy for sales forecasts within the next two weeks. In contrast, using traditional
    strategies plus manual experience, the accuracy of sales forecasting is generally
    only up to 70%. Therefore, AI can help retailers better predict product sales.
    Simultaneously, AI sales forecasting based on big data can also significantly
    reduce inventory turnover days, directly achieving corresponding efficiency improvements.
    For example, fresh food brands can optimize inventory management, reduce fresh
    food loss, and reduce operating risks through such sales forecasting.[[22]](#txt006.xhtml#footnote_content_txt006_22)


    Despite the continuous popularization and expansion of the "AI + Retail" concept
    and applications, difficulties remain, the most prominent being the long-term
    disconnect between offline data acquisition and online data. An effective solution
    is to use cameras, smart advertising machines, and other smart devices to identify
    users'' basic information, behavioral trajectories, and browsing preferences,
    and make recommendations or personalized services based on online or past purchase
    records. On the other hand, one must also consider that while using AI reduces
    risks such as mismatch with user needs, inventory backlog, and information feedback
    loss caused by humans, it also weakens human spiritual world activities. From
    a personal perspective, the retail industry''s use of personal consumption data
    is a good thing for some, helping them quickly find what they like and save time.
    But for others, excessive recommendations wear down personality and limit the
    possibility of exploring various things.


    Currently, China''s social interaction and consumption methods are changing rapidly,
    and the associated human sentiment values have become more complex and contradictory.
    Intelligent technology has stripped people''s lives from the traditional human-sentiment
    society into a more rational, intelligent data society. The problems arising in
    between need to be addressed through time adaptation and rule changes, but we
    cannot adopt a negative attitude of stagnation, ignoring the fact that technology
    can greatly stimulate the emergence of new economies, new models, and new business
    forms. In 2016, the General Office of the State Council of China issued "Opinions
    on Promoting the Innovation and Transformation of Physical Retail," pointing out
    the need to strengthen the application of new-generation information technologies
    such as the Internet and big data, vigorously develop new business forms and models,
    and support enterprises in using big data technology to analyze consumer behavior
    and support enterprises in carrying out humanized and intelligent transformation
    of service facilities. In 2019, there were 17 "AI + Retail" related financing
    events, accounting for 3.3% of the total AI field investment for the year; compared
    to 1.8% the previous year, the increase reached 83.3%.[[23]](#txt006.xhtml#footnote_content_txt006_23)


    In 2020, affected by the COVID-19 epidemic, the global economy suffered a severe
    shock. China achieved effective control of the epidemic in a relatively short
    time at great cost. The epidemic caused consumption forms to transform and upgrade
    again, with online consumption becoming the core content of new consumption. New
    business forms such as e-commerce shopping and online services played an important
    role in the fight against the epidemic. Online and offline linkage: on the one
    hand, online channels drove overall sales and helped the real economy create growth
    space in areas such as digital and intelligent transformation of the industrial
    chain. On the other hand, the traditional real economy actively expanded online
    market space, making new explorations and attempts in digital transformation.
    A large number of offline enterprises such as real estate developers and home
    appliance companies cooperated with platforms like JD.com and Tmall. During the
    "618" period[[24]](#txt006.xhtml#footnote_content_txt006_24), 12,000 JD home appliance
    specialty stores covering 25,000 towns and 600,000 administrative villages nationwide
    achieved a 240% year-on-year increase in overall transaction volume.[[25]](#txt006.xhtml#footnote_content_txt006_25)


    ### Social Employment and Labor Legitimacy


    The development of machine intelligence may replace human labor on a large scale,
    affecting changes in the social employment structure. Future society may face
    massive unemployment problems, which is almost a common issue brought by every
    technological revolution. In the long run, technology''s overall impact on employment
    may be positive. However, due to the lengthy process and the existence of uncertain
    factors, people''s concerns about technology-induced unemployment may persist.


    The large-scale application of machinery in the 20th century led to the emergence
    of new means of transport replacing horses. The numerous positions derived from
    the horse-drawn transport industry disappeared, and most people fell into an unemployment
    crisis. In the 21st century, as Chinese people face AI''s excellent performance
    in finance, transportation, medical care, consumption, and other fields, they
    cannot help but worry that while technology facilitates life, many jobs will once
    again be replaced by intelligence. From traditional manufacturing to services,
    and even to specific work scenarios such as news writing, medical diagnosis, and
    the legal industry, AI''s presence is already everywhere. McKinsey once predicted
    that by 2030, 390 million people worldwide would change occupations due to the
    large-scale popularization of robots and AI, and 800 million would be unemployed.
    Physicist Hawking wrote in the British *Guardian* in 2016: "Factory automation
    has already caused many traditional manufacturing workers to lose their jobs.
    The rise of AI is likely to extend the unemployment wave to the middle class,
    ultimately leaving only caring, creative, and supervisory jobs for humans."[[26]](#txt006.xhtml#footnote_content_txt006_26)
    The 2016 Oxford University report "Technology at Work V.2.0: The Future Is Not
    What It Used to Be" predicted that the risk of job automation in developing countries
    is increasing, with automation risks for major emerging economies China and India
    at 77% and 69% respectively.


