- raw: '其次，机器人需要一个能量源来驱动传动装置。大多数机器人会使用电力供电。此外，液压机器人需要一个泵来为液体加压，而气动机器人则需要气体压缩机或压缩气罐。所有传动装置都通过导线与一块电路相连，该电路直接为电动机和螺线圈供电，并控制电子阀门来启动液压系统，阀门可以控制承压流体在机器内流动的路径。如果机器人要移动一条由液压驱动的腿，则它的控制器会打开一只阀门，这只阀门由液压泵通向腿上的活塞筒，承压流体将推动活塞，使腿部向前旋转。通常，机器人使用可提供双向推力的活塞，以使部件能向两个方向活动。


    机器人的计算机可以控制与电路相连的所有部件，为了使机器人动起来，计算机会打开所有需要的电动机和阀门。大多数机器人是可重新编程的，如果要改变机器人的行为，则只需将一个新的程序写入它的计算机即可。


    并非所有的机器人都有传感系统，很少有机器人具有视觉、听觉、嗅觉或味觉（智能机器人除外）。机器人拥有的最常见的一种感觉是运动感，也就是它监控自身运动的能力。在标准设计中，机器人的关节处装有刻有凹槽的轮子，在轮子的一侧有一个发光二极管，它发出一道光束，穿过凹槽，照在位于轮子另一侧的光传感器上。当机器人移动某个特定的关节时，有凹槽的轮子会转动，在此过程中，凹槽将挡住光束，即实现了它对自身运动的监控。


    以上这些是机器人的基本组成部分。机器人专家有无数种方法可以将这些元素组合起来，从而制造出无限复杂的机器人。


    2.机器人的逻辑结构


    机器人的逻辑结构主要由机械部分、传感部分和控制部分组成。这三大部分又可分为驱动系统、机械结构系统、感知系统、机器人-环境交互系统、人机交互系统和控制系统，如图9-1所示。


    ![](Images/cutq_182_10441_m.jpg)


    图9-1　机器人的逻辑结构


    （1）驱动系统


    要使机器人运作起来，就需为各个关节即每个运动自由度安装传动装置，这就是驱动系统。驱动系统可以是液压传动、气压传动、电动传动或者是把它们结合起来的综合系统，也可以直接驱动或者通过同步带、链条、轮系、谐波齿轮等机械传动机构进行间接驱动。


    （2）机械结构系统


    机器人的机械结构系统由基座、手臂、末端操作器三大部分组成，每一个大件都有若干个自由度的机械系统。若基座具备行走机构，则构成行走机器人；若基座不具备行走及弯腰机构，则构成单机器人臂中，手臂一般由上臂、下臂和手腕组成；末端操作器是直接装在手腕上的一个重要部件，它可以是二手指或多手指的手爪设备，也可以是喷漆枪、焊具等作业工具。


    （3）感知系统


    感知系统由内部传感器模块和外部传感器模块组成，用以获得内部和外部环境状态中有意义的信息。智能传感器的使用提高了机器人的机动性、适应性和智能化的水准。人类的感受系统对感知外部世界信息是极其灵巧的，然而，对于一些特殊的信息，传感器比人类的感受系统更有效。


    （4）机器人-环境交互系统


    机器人-环境交互系统是现代工业机器人与外部环境中的设备互相联系和协调的系统。工业机器人与外部设备集成为一个功能单元，如加工单元、焊接单元、装配单元等。当然，其也可以是多台机器人、多台机床或设备、多个零件存储装置等集成为一个执行复杂任务的功能单元。


    （5）人机交互系统


    人机交互系统是操作人员控制机器人并与机器人联系的装置，例如，计算机的标准终端、指令控制台、信息显示板、危险信号报警器等。该系统归纳起来可分为两大类：指令给定装置和信息显示装置。


    （6）控制系统


    控制系统的任务是根据机器人的作业指令程序以及传感器反馈的信号，控制机器人的执行机构完成规定的运动和功能。若机器人不具备信息反馈特征，则为开环控制系统；若具备信息反馈特征，则为闭环控制系统。根据控制原理，控制系统可分为程序控制系统、适应性控制系统和人工智能控制系统。根据控制运行的形式，控制系统可分为点位控制和轨迹控制。


    3.机器人的工作原理


    机器人大多用来从事繁重的重复性制造工作，它们主要负责那些对人类来说非常困难、危险或枯燥的任务。


    机器人的工作主要由机器臂来完成。一部典型的机器臂由7个金属部件构成，它们是用6个关节连接起来的，计算机将控制与每个关节分别相连的步进式电动机旋转，以便控制机器人（某些大型机器臂使用液压或气动系统）。与普通电动机不同，步进式电动机会以增量方式精确移动。这使得计算机可以精确地移动机器臂，使机器臂不断重复完全相同的动作，机器人利用运动传感器来确保自己完全按正确的量移动。这种带有6个关节的工业机器人与人类的手臂极为相似，它具有相当于肩膀、肘部和腕部的部位，它的“肩膀”通常安装在一个固定的基座结构上。这种类型的机器人有6个自由度，也就是说，它能向6个不同的方向转动，与之相比，人的手臂有7个自由度。图9-2所示为机器臂的组成。


    人类手臂的作用是将手移动到不同的位置，类似的，机器臂的作用是移动末端执行器。有一种常见的末端执行器能抓握并移动不同的物品，它是人手的简化版本。机械手往往有内置的压力传感器，用来将机器人抓握某一特定物体时的力度反馈给计算机，以使机器人手中的物体不致掉落或被挤坏。


    ![](Images/cutq_184_23716_m.jpg)


    图9-2　机器臂的组成


    4.机器人的应用


    早期智能机器人主要用于工业和军事领域，大多数是机械手和机器臂。工业机器人是广泛用于工业领域的多关节机械手或多自由度的机器装置，具有一定的自动性，可依靠自身的动力能源和控制能力实现各种工业加工制造功能。图9-3所示为工业机器人。


    ![](Images/image_184_2_m.jpg)


    图9-3　工业机器人


    工业机器人专门用来在受控环境下反复执行完全相同的工作。例如，某台机器人可能会负责给装配线上传送的花生酱罐子拧上盖子。为了教会机器人如何做这项工作，程序员会用一只手持控制器来引导机器臂完成整套动作，机器人会将动作序列准确地存储在内存中，此后，每当装配线上有新的罐子传送过来时，它就会反复地执行这套动作。


    工业机器人有如下几个显著特点。


    （1）可编程


    生产自动化的进一步发展是柔性自动化。工业机器人可随其工作环境变化的需要而再编程，因此能在小批量、多品种、具有均衡高效率的柔性制造过程中发挥很好的功用，是柔性制造系统（Flexible
    Manufacturing System，FMS）中的一个重要组成部分。


    （2）拟人化


    工业机器人在机械结构上有类似人的行走、腰转、大臂、小臂、手腕、手爪等部分，在控制上有计算机作为“大脑”。此外，智能化工业机器人有许多与人类类似的“生物传感器”，如皮肤型接触传感器、力传感器、负载传感器、视觉传感器、声音传感器等，传感器提高了工业机器人对周围环境的自适应能力。


    （3）通用性


    除了专门设计的专用的工业机器人外，一般工业机器人在执行不同的作业任务时具有较好的通用性。例如，更换工业机器人手部末端操作器（手爪、工具等）便可执行不同的作业任务。


    （4）机电一体化


    工业机器人技术涉及的学科相当广泛，但是归纳起来是机械学和微电子学的结合——机电一体化技术。第三代智能机器人不仅具有获取外部环境信息的各种传感器，还具有记忆能力、语言理解能力、图像识别能力、推理判断能力等人工智能，这些都和微电子技术的应用，特别是计算机技术的应用密切相关。因此，机器人技术的发展必将带动其他技术的发展，机器人技术的发展和应用水平也可以验证科学技术和工业技术的发展及应用水平。


    ### [9.1.2　认识智能机器人](../Text/contents.xhtml#z226)


    机器人是一种可编程和多功能的，用来搬运材料、零件、工具的操作机，或是为了执行不同的任务而具有可改变和可编程动作的专门系统。智能机器人是第三代机器人，这种机器人带有多种传感器，能够对多种传感器得到的信息进行融合，能够有效适应变化的环境，具有很强的自适应能力、学习能力和自治功能。


    因此，智能机器人是一个在感知、思维、效应方面全面模拟人类的机器系统。它是人工智能技术的综合试验场，可以全面地考察人工智能各个领域的技术，研究它们相互之间的关系，还可以在有害环境中代替人类从事危险工作。


    目前，一般认为智能机器人应该具备3个方面的能力：感知环境的能力、执行某种任务而对环境施加影响的能力和联系感知与行动的能力。


    随着智能机器人应用领域的扩大，人们期望智能机器人在更多领域为人类服务，代替人类完成更复杂的工作。然而，智能机器人所处的环境往往是未知的、很难预测，智能机器人所要完成的工作任务也越来越复杂，对智能机器人行为进行人工分析、设计也变得越来越困难。


    ### [9.1.3　智能机器人的发展现状](../Text/contents.xhtml#z227)


    目前研制中的智能机器人智能水平并不高，只能说是智能机器人的初级阶段。智能机器人研究中的当前核心问题分为两方面：一方面是提高智能机器人的自主性，这是就智能机器人与人的关系而言的，即希望智能机器人进一步独立于人，具有更为友善的人机界面，从长远来说，希望只要操作人员给出要完成的任务，机器人就能自动形成完成该任务的步骤，并自动完成它；另一方面是提高智能机器人的适应性，提高智能机器人适应环境变化的能力，这是就智能机器人与环境的关系而言的，希望加强它们之间的交互关系。


    在各国的智能机器人发展中，美国的智能机器人技术在国际上一直处于领先地位，其技术全面、先进，适应性也很强，性能可靠、功能全面、精确度高，其视觉、触觉等人工智能技术已在航天、汽车工业中广泛应用。日本得益于一系列扶持政策，各类机器人包括智能机器人的研究发展迅速。欧洲各国在智能机器人的研究和应用方面在世界上处于公认的领先地位。我国的智能机器人研究起步较晚，但在人工智能、云计算、大数据等技术的兴起下，我国已经成为全球最大的工业机器人消费市场以及世界上最大的潜在服务机器人市场，智能机器人产业发展拥有得天独厚的环境优势。然而，由于起步较晚、技术滞后等多重因素，我国智能机器人产业发展与国际领先水平仍然存在较大差距，需奋力追赶。


    ### [9.1.4　智能机器人的前景](../Text/contents.xhtml#z228)


    机器人在不断地向着更高级发展，对于未来智能机器人可能的几大发展趋势，这里概括性分析如下。


    1.语言交流功能越来越完美


    出于人机交互的目的，机器人语言功能的完善是一个非常重要的环节。目前，机器人的语言能力主要依赖于其存储器内预先存储的大量语音语句和文字词汇，其语言的能力取决于数据库内存储语句量的大小及其存储的语言范围。


    2.各种动作的完美化


    机器人的动作是相对于模仿人类动作来说的，我们知道人类能做的动作是多样化的，招手、握手、走、跑、跳等都是人类的惯用动作。现代智能机器人虽然能模仿人的部分动作，但是相对有一些僵化的感觉，或者动作是比较缓慢的。今后智能机器人将装配更灵活的类似人类的关节和仿真人造肌肉，以模仿更多的动作，使其更像人类。


    3.外形越来越酷似人类


    科学家研制越来越高级的智能机器人时主要是以人类自身形体为参照对象的，在这一方面日本应该是相对领先的，当然，目前国内的技术也是非常优秀的。随着仿真程度的不断提升，今后可能无法仅通过外形来辨别智能机器人与人类。


    4.复原功能越来越强大


    只要是人类都会有生老病死，而对于机器人来说，虽然不存在生物的常规死亡现象，但是会存在一系列的故障，如内部元件故障、线路故障、机械故障、干扰性故障等，这些故障就相当于人类的病理现象。未来智能机器人将具备越来越强大的自行复原功能，对于自身内部零件等运行情况，机器人会随时自行检索，并及时排除问题。它的检索功能就像人类感觉身体哪里不舒服一样，是智能意识的表现。


    5.体内能量存储越来越大


    智能机器人的一切活动都需要体内持续的能量供应，机器人的动力源多数使用电能，供应电能就需要大容量的蓄电池，只有大容量的电池才能满足机器人的日常电能消耗。


    6.逻辑分析能力越来越强


    人类的大部分行为能力需要借助于逻辑分析，例如，思考问题需要非常明确的逻辑推理分析能力，而相对平常化的走路其实是一种简单逻辑。因为走路需要的是平衡性，大脑在根据路况不断地分析、判断该怎么走才不会摔倒，而机器人走路要通过复杂的计算来进行，因此提升智能机器人的逻辑分析能力在一定程度上可以提高机器人的运行能力。


    ## [9.2　智能机器人的核心技术](../Text/contents.xhtml#z229)


    随着人工智能技术的进步，我国服务机器人产业迎来了蓬勃发展，2019年，我国服务机器人市场规模约为22亿美元。基于不同的应用场景，各领域衍生出了各类形态不一的服务机器人，如餐厅送餐机器人、商场导购机器人、银行柜台机器人等，虽然功能不同，但是这些机器人想要拥有高效的感知、识别等能力，离不开定位导航和人机交互这两大核心技术。


    ### [9.2.1　定位导航](../Text/contents.xhtml#z230)


    定位导航技术是实现机器人智能行走的第一步，本质上就是帮助机器人实现自主定位、建图、路径规划及避障等能力。定位导航技术需要机器人的感知能力，需要借助视觉传感器（如激光雷达）来帮助机器人完成周围环境的扫描，并配合相应的算法，构建有效的地图数据，以完成运算，最终实现机器人的自主定位导航。


    同步定位与地图构建（Simultaneous Localization And Mapping，SLAM）主要用于解决移动机器人在未知环境中运行时即时定位与地图构建的问题。SLAM问题可以描述如下：机器人在未知环境中从一个未知位置开始移动，在移动过程中根据位置估计和传感器数据进行自身定位，同时构建增量式地图。目前，SLAM算法已被应用于无人机、无人潜艇、行星探测车、家政机器人等。


    利用SLAM技术，可以让机器人在未知的环境中实时地知道自己的位置，并同步绘制环境地图。在机器人的定位、跟踪和路径规划技术中，SLAM都扮演了核心角色。没有SLAM的机器人就好比在移动互联网时代不能上网的智能手机，发挥不了重要作用。因此，SLAM更像是一个概念而不是一个算法，它本身包含许多步骤，其中的每一个步骤均可以使用不同的算法实现。


    1.同步定位


    在机器人定位导航技术中，目前主要涉及激光SLAM及视觉SLAM。激光SLAM主要采用2D或3D激光雷达进行数据采集。在室内机器人（如扫地机器人）上，一般使用2D激光雷达；在无人驾驶领域，一般使用3D激光雷达。


    激光SLAM的定位过程如下：通过激光雷达实时采集周围物体的环境信息，最初采集到的物体信息呈现的是一系列分散的、具有准确角度和距离的点云数据（数据以点的形式记录，每一个点是包含三维坐标，甚至颜色信息的数据），图9-4所示为点云数据。激光SLAM系统可以对不同时刻的两片点云数据进行匹配与比对，并通过计算激光雷达相对运动的距离和姿态的改变，来完成对机器人本身的定位。


    ![](Images/image_188_0_m.jpg)


    图9-4　点云数据


    视觉SLAM方案目前主要有两种实现路径：一种是基于RGBD的深度摄像机，如KINECT；另一种基于单目、双目或鱼眼摄像头。基于深度摄像机的视觉SLAM与激光SLAM类似，也是通过收集到的点云数据来计算障碍物的距离；基于单目、双目或鱼眼摄像头的视觉SLAM，主要利用多帧图像来估计自身的位姿变化，并通过累计位姿变化来计算距离物体的距离，并进行定位与地图构建。


    2.地图构建


    和人类绘制地图一样，机器人描述环境、认识环境的过程主要依靠地图。这里说的地图，是用来在环境中定位，以及描述当前环境以便于规划航线的一个概念，它通过记录以某种形式的感知获取的信息，用以和当前的感知结果相比较，以支撑对现实定位的评估。


    地图构建是研究如何把从一系列传感器收集到的信息，集成到一个一致性的模型上的问题，它的核心部分是环境的表达方式以及传感器数据的解释。地图构建利用环境地图来描述其当前环境信息，并根据使用的算法与传感器的差异采用不同的地图描述形式。因此，在机器人技术中，SLAM的地图构建通常指的是建立与环境几何一致的地图。


    目前，机器人学中地图的表示方法主要有4种：栅格地图、特征点地图、直接表征法以及拓扑地图。


    （1）栅格地图


    机器人对于环境地图的最常见的描述方式为栅格地图。栅格地图就是把环境划分成一系列栅格，其中每一个栅格给定一个可能值，表示该栅格被占据的概率。这种地图看起来和人们所认知的地图没有什么区别，其本质是一张位图图片，但其中每个“像素”表示了实际环境中存在障碍物的概率分布。一般来说，当采用激光雷达、深度摄像头、超声波传感器等可以直接测量距离数据的传感器进行SLAM时，可以使用栅格地图。这种地图也可以通过距离测量传感器、超声波（早期）、激光雷达（现在）绘制出来。栅格地图既能表示空间环境中的很多特征，机器人可以用它来进行路径规划；又不直接记录传感器的原始数据，相对实现了空间和时间消耗的最优解。因此，栅格地图是目前机器人所广泛应用的地图存储方式。图9-5所示为栅格地图。


    ![](Images/image_189_0_m.jpg)


    图9-5　栅格地图


    （2）特征点地图


    特征点地图使用有关的几何特征（如点、直线、面）表示环境，常见于视觉SLAM中。与栅格地图相比，这种地图看起来不那么直观。它一般通过诸如GPS、UWB以及摄像头配合稀疏方式的视觉SLAM算法产生，优点是数据存储量和运算量相对比较小，多见于最早的SLAM算法中。


    （3）直接表征法


    在直接表征法中，省去了特征或栅格表示这一中间环节，直接用传感器读取的数据来构造机器人的位姿空间。这种方法就像卫星地图一样，直接将传感器原始数据通过简单处理拼接形成地图，相对来说更加直观。但是直接表征法的信息冗余度较大，对于数据存储是很大的挑战，从中提取出有用的数据相对麻烦，因此在实际应用中很少使用。


    （4）拓扑地图


    拓扑地图是一种相对更加抽象的地图形式，它把室内环境表示为带节点和相关连接线的拓扑结构图，其中，节点表示环境中的重要位置点（拐角、门、电梯、楼梯等），边表示节点间的连接关系，如走廊等。当扫地机器人要进行房间清扫的时候，就会建立一张拓扑地图。


    图9-6所示为SLAM模块在智能机器人中的应用，其中CAN通信是一种现场总线技术，常用于串行通信网络中。


    3.路径规划


    导航技术是移动机器人技术的核心，而路径规划是导航研究的一个重要环节。例如，导航仪的核心就是路径规划，在谷歌的无人驾驶汽车研究中，主要的工作量都在导航算法上。路径规划就是依据某个或某些优化准则，在机器人工作空间中找到一条从起始状态到目标状态、可以避开障碍物的最优路径。


    ![](Images/cutq_190_49617_l.jpg)


    图9-6　SLAM模块在智能机器人中的应用


    目前，移动智能机器人路径规划的主要方法有如下3种。


    （1）基于事例的学习规划方法'
  fmt: '

    其次，机器人需要一个能量源来驱动传动装置。大多数机器人会使用电力供电。此外，液压机器人需要一个泵来为液体加压，而气动机器人则需要气体压缩机或压缩气罐。所有传动装置都通过导线与一块电路相连，该电路直接为电动机和螺线圈供电，并控制电子阀门来启动液压系统，阀门可以控制承压流体在机器内流动的路径。如果机器人要移动一条由液压驱动的腿，则它的控制器会打开一只阀门，这只阀门由液压泵通向腿上的活塞筒，承压流体将推动活塞，使腿部向前旋转。通常，机器人使用可提供双向推力的活塞，以使部件能向两个方向活动。


    机器人的计算机可以控制与电路相连的所有部件，为了使机器人动起来，计算机会打开所有需要的电动机和阀门。大多数机器人是可重新编程的，如果要改变机器人的行为，则只需将一个新的程序写入它的计算机即可。


    并非所有的机器人都有传感系统，很少有机器人具有视觉、听觉、嗅觉或味觉（智能机器人除外）。机器人拥有的最常见的一种感觉是运动感，也就是它监控自身运动的能力。在标准设计中，机器人的关节处装有刻有凹槽的轮子，在轮子的一侧有一个发光二极管，它发出一道光束，穿过凹槽，照在位于轮子另一侧的光传感器上。当机器人移动某个特定的关节时，有凹槽的轮子会转动，在此过程中，凹槽将挡住光束，即实现了它对自身运动的监控。


    以上这些是机器人的基本组成部分。机器人专家有无数种方法可以将这些元素组合起来，从而制造出无限复杂的机器人。


    ## 2.机器人的逻辑结构


    机器人的逻辑结构主要由机械部分、传感部分和控制部分组成。这三大部分又可分为驱动系统、机械结构系统、感知系统、机器人-环境交互系统、人机交互系统和控制系统，如图9-1所示。


    ![](Images/cutq_182_10441_m.jpg)


    图9-1　机器人的逻辑结构


    ### （1）驱动系统


    要使机器人运作起来，就需为各个关节即每个运动自由度安装传动装置，这就是驱动系统。驱动系统可以是液压传动、气压传动、电动传动或者是把它们结合起来的综合系统，也可以直接驱动或者通过同步带、链条、轮系、谐波齿轮等机械传动机构进行间接驱动。


    ### （2）机械结构系统


    机器人的机械结构系统由基座、手臂、末端操作器三大部分组成，每一个大件都有若干个自由度的机械系统。若基座具备行走机构，则构成行走机器人；若基座不具备行走及弯腰机构，则构成单机器人臂中，手臂一般由上臂、下臂和手腕组成；末端操作器是直接装在手腕上的一个重要部件，它可以是二手指或多手指的手爪设备，也可以是喷漆枪、焊具等作业工具。


    ### （3）感知系统


    感知系统由内部传感器模块和外部传感器模块组成，用以获得内部和外部环境状态中有意义的信息。智能传感器的使用提高了机器人的机动性、适应性和智能化的水准。人类的感受系统对感知外部世界信息是极其灵巧的，然而，对于一些特殊的信息，传感器比人类的感受系统更有效。


    ### （4）机器人-环境交互系统


    机器人-环境交互系统是现代工业机器人与外部环境中的设备互相联系和协调的系统。工业机器人与外部设备集成为一个功能单元，如加工单元、焊接单元、装配单元等。当然，其也可以是多台机器人、多台机床或设备、多个零件存储装置等集成为一个执行复杂任务的功能单元。


    ### （5）人机交互系统


    人机交互系统是操作人员控制机器人并与机器人联系的装置，例如，计算机的标准终端、指令控制台、信息显示板、危险信号报警器等。该系统归纳起来可分为两大类：指令给定装置和信息显示装置。


    ### （6）控制系统


    控制系统的任务是根据机器人的作业指令程序以及传感器反馈的信号，控制机器人的执行机构完成规定的运动和功能。若机器人不具备信息反馈特征，则为开环控制系统；若具备信息反馈特征，则为闭环控制系统。根据控制原理，控制系统可分为程序控制系统、适应性控制系统和人工智能控制系统。根据控制运行的形式，控制系统可分为点位控制和轨迹控制。


    ## 3.机器人的工作原理


    机器人大多用来从事繁重的重复性制造工作，它们主要负责那些对人类来说非常困难、危险或枯燥的任务。


    机器人的工作主要由机器臂来完成。一部典型的机器臂由7个金属部件构成，它们是用6个关节连接起来的，计算机将控制与每个关节分别相连的步进式电动机旋转，以便控制机器人（某些大型机器臂使用液压或气动系统）。与普通电动机不同，步进式电动机会以增量方式精确移动。这使得计算机可以精确地移动机器臂，使机器臂不断重复完全相同的动作，机器人利用运动传感器来确保自己完全按正确的量移动。这种带有6个关节的工业机器人与人类的手臂极为相似，它具有相当于肩膀、肘部和腕部的部位，它的“肩膀”通常安装在一个固定的基座结构上。这种类型的机器人有6个自由度，也就是说，它能向6个不同的方向转动，与之相比，人的手臂有7个自由度。图9-2所示为机器臂的组成。


    ![](Images/cutq_184_23716_m.jpg)


    图9-2　机器臂的组成


    人类手臂的作用是将手移动到不同的位置，类似的，机器臂的作用是移动末端执行器。有一种常见的末端执行器能抓握并移动不同的物品，它是人手的简化版本。机械手往往有内置的压力传感器，用来将机器人抓握某一特定物体时的力度反馈给计算机，以使机器人手中的物体不致掉落或被挤坏。


    ## 4.机器人的应用


    早期智能机器人主要用于工业和军事领域，大多数是机械手和机器臂。工业机器人是广泛用于工业领域的多关节机械手或多自由度的机器装置，具有一定的自动性，可依靠自身的动力能源和控制能力实现各种工业加工制造功能。图9-3所示为工业机器人。


    ![](Images/image_184_2_m.jpg)


    图9-3　工业机器人


    工业机器人专门用来在受控环境下反复执行完全相同的工作。例如，某台机器人可能会负责给装配线上传送的花生酱罐子拧上盖子。为了教会机器人如何做这项工作，程序员会用一只手持控制器来引导机器臂完成整套动作，机器人会将动作序列准确地存储在内存中，此后，每当装配线上有新的罐子传送过来时，它就会反复地执行这套动作。


    工业机器人有如下几个显著特点。


    ### （1）可编程


    生产自动化的进一步发展是柔性自动化。工业机器人可随其工作环境变化的需要而再编程，因此能在小批量、多品种、具有均衡高效率的柔性制造过程中发挥很好的功用，是柔性制造系统（Flexible
    Manufacturing System，`FMS`）中的一个重要组成部分。


    ### （2）拟人化


    工业机器人在机械结构上有类似人的行走、腰转、大臂、小臂、手腕、手爪等部分，在控制上有计算机作为“大脑”。此外，智能化工业机器人有许多与人类类似的“生物传感器”，如皮肤型接触传感器、力传感器、负载传感器、视觉传感器、声音传感器等，传感器提高了工业机器人对周围环境的自适应能力。


    ### （3）通用性


    除了专门设计的专用的工业机器人外，一般工业机器人在执行不同的作业任务时具有较好的通用性。例如，更换工业机器人手部末端操作器（手爪、工具等）便可执行不同的作业任务。


    ### （4）机电一体化


    工业机器人技术涉及的学科相当广泛，但是归纳起来是机械学和微电子学的结合——机电一体化技术。第三代智能机器人不仅具有获取外部环境信息的各种传感器，还具有记忆能力、语言理解能力、图像识别能力、推理判断能力等人工智能，这些都和微电子技术的应用，特别是计算机技术的应用密切相关。因此，机器人技术的发展必将带动其他技术的发展，机器人技术的发展和应用水平也可以验证科学技术和工业技术的发展及应用水平。


    ## [9.1.2　认识智能机器人](../Text/contents.xhtml#z226)


    机器人是一种可编程和多功能的，用来搬运材料、零件、工具的操作机，或是为了执行不同的任务而具有可改变和可编程动作的专门系统。智能机器人是第三代机器人，这种机器人带有多种传感器，能够对多种传感器得到的信息进行融合，能够有效适应变化的环境，具有很强的自适应能力、学习能力和自治功能。


    因此，智能机器人是一个在感知、思维、效应方面全面模拟人类的机器系统。它是人工智能技术的综合试验场，可以全面地考察人工智能各个领域的技术，研究它们相互之间的关系，还可以在有害环境中代替人类从事危险工作。


    目前，一般认为智能机器人应该具备3个方面的能力：感知环境的能力、执行某种任务而对环境施加影响的能力和联系感知与行动的能力。


    随着智能机器人应用领域的扩大，人们期望智能机器人在更多领域为人类服务，代替人类完成更复杂的工作。然而，智能机器人所处的环境往往是未知的、很难预测，智能机器人所要完成的工作任务也越来越复杂，对智能机器人行为进行人工分析、设计也变得越来越困难。


    ## [9.1.3　智能机器人的发展现状](../Text/contents.xhtml#z227)


    目前研制中的智能机器人智能水平并不高，只能说是智能机器人的初级阶段。智能机器人研究中的当前核心问题分为两方面：一方面是提高智能机器人的自主性，这是就智能机器人与人的关系而言的，即希望智能机器人进一步独立于人，具有更为友善的人机界面，从长远来说，希望只要操作人员给出要完成的任务，机器人就能自动形成完成该任务的步骤，并自动完成它；另一方面是提高智能机器人的适应性，提高智能机器人适应环境变化的能力，这是就智能机器人与环境的关系而言的，希望加强它们之间的交互关系。


    在各国的智能机器人发展中，美国的智能机器人技术在国际上一直处于领先地位，其技术全面、先进，适应性也很强，性能可靠、功能全面、精确度高，其视觉、触觉等人工智能技术已在航天、汽车工业中广泛应用。日本得益于一系列扶持政策，各类机器人包括智能机器人的研究发展迅速。欧洲各国在智能机器人的研究和应用方面在世界上处于公认的领先地位。我国的智能机器人研究起步较晚，但在人工智能、云计算、大数据等技术的兴起下，我国已经成为全球最大的工业机器人消费市场以及世界上最大的潜在服务机器人市场，智能机器人产业发展拥有得天独厚的环境优势。然而，由于起步较晚、技术滞后等多重因素，我国智能机器人产业发展与国际领先水平仍然存在较大差距，需奋力追赶。


    ## [9.1.4　智能机器人的前景](../Text/contents.xhtml#z228)


    机器人在不断地向着更高级发展，对于未来智能机器人可能的几大发展趋势，这里概括性分析如下。


    1.语言交流功能越来越完美


    出于人机交互的目的，机器人语言功能的完善是一个非常重要的环节。目前，机器人的语言能力主要依赖于其存储器内预先存储的大量语音语句和文字词汇，其语言的能力取决于数据库内存储语句量的大小及其存储的语言范围。


    2.各种动作的完美化


    机器人的动作是相对于模仿人类动作来说的，我们知道人类能做的动作是多样化的，招手、握手、走、跑、跳等都是人类的惯用动作。现代智能机器人虽然能模仿人的部分动作，但是相对有一些僵化的感觉，或者动作是比较缓慢的。今后智能机器人将装配更灵活的类似人类的关节和仿真人造肌肉，以模仿更多的动作，使其更像人类。


    3.外形越来越酷似人类


    科学家研制越来越高级的智能机器人时主要是以人类自身形体为参照对象的，在这一方面日本应该是相对领先的，当然，目前国内的技术也是非常优秀的。随着仿真程度的不断提升，今后可能无法仅通过外形来辨别智能机器人与人类。


    4.复原功能越来越强大


    只要是人类都会有生老病死，而对于机器人来说，虽然不存在生物的常规死亡现象，但是会存在一系列的故障，如内部元件故障、线路故障、机械故障、干扰性故障等，这些故障就相当于人类的病理现象。未来智能机器人将具备越来越强大的自行复原功能，对于自身内部零件等运行情况，机器人会随时自行检索，并及时排除问题。它的检索功能就像人类感觉身体哪里不舒服一样，是智能意识的表现。


    5.体内能量存储越来越大


    智能机器人的一切活动都需要体内持续的能量供应，机器人的动力源多数使用电能，供应电能就需要大容量的蓄电池，只有大容量的电池才能满足机器人的日常电能消耗。


    6.逻辑分析能力越来越强


    人类的大部分行为能力需要借助于逻辑分析，例如，思考问题需要非常明确的逻辑推理分析能力，而相对平常化的走路其实是一种简单逻辑。因为走路需要的是平衡性，大脑在根据路况不断地分析、判断该怎么走才不会摔倒，而机器人走路要通过复杂的计算来进行，因此提升智能机器人的逻辑分析能力在一定程度上可以提高机器人的运行能力。


    ## [9.2　智能机器人的核心技术](../Text/contents.xhtml#z229)


    随着人工智能技术的进步，我国服务机器人产业迎来了蓬勃发展，2019年，我国服务机器人市场规模约为22亿美元。基于不同的应用场景，各领域衍生出了各类形态不一的服务机器人，如餐厅送餐机器人、商场导购机器人、银行柜台机器人等，虽然功能不同，但是这些机器人想要拥有高效的感知、识别等能力，离不开定位导航和人机交互这两大核心技术。


    ### [9.2.1　定位导航](../Text/contents.xhtml#z230)


    定位导航技术是实现机器人智能行走的第一步，本质上就是帮助机器人实现自主定位、建图、路径规划及避障等能力。定位导航技术需要机器人的感知能力，需要借助视觉传感器（如激光雷达）来帮助机器人完成周围环境的扫描，并配合相应的算法，构建有效的地图数据，以完成运算，最终实现机器人的自主定位导航。


    同步定位与地图构建（Simultaneous Localization And Mapping，`SLAM`）主要用于解决移动机器人在未知环境中运行时即时定位与地图构建的问题。`SLAM`问题可以描述如下：机器人在未知环境中从一个未知位置开始移动，在移动过程中根据位置估计和传感器数据进行自身定位，同时构建增量式地图。目前，`SLAM`算法已被应用于无人机、无人潜艇、行星探测车、家政机器人等。


    利用`SLAM`技术，可以让机器人在未知的环境中实时地知道自己的位置，并同步绘制环境地图。在机器人的定位、跟踪和路径规划技术中，`SLAM`都扮演了核心角色。没有`SLAM`的机器人就好比在移动互联网时代不能上网的智能手机，发挥不了重要作用。因此，`SLAM`更像是一个概念而不是一个算法，它本身包含许多步骤，其中的每一个步骤均可以使用不同的算法实现。


    #### 1.同步定位


    在机器人定位导航技术中，目前主要涉及激光`SLAM`及视觉`SLAM`。激光`SLAM`主要采用`2D`或`3D`激光雷达进行数据采集。在室内机器人（如扫地机器人）上，一般使用`2D`激光雷达；在无人驾驶领域，一般使用`3D`激光雷达。


    激光`SLAM`的定位过程如下：通过激光雷达实时采集周围物体的环境信息，最初采集到的物体信息呈现的是一系列分散的、具有准确角度和距离的点云数据（数据以点的形式记录，每一个点是包含三维坐标，甚至颜色信息的数据），图9-4所示为点云数据。


    ![](Images/image_188_0_m.jpg)


    图9-4　点云数据


    `SLAM`系统可以对不同时刻的两片点云数据进行匹配与比对，并通过计算激光雷达相对运动的距离和姿态的改变，来完成对机器人本身的定位。


    视觉`SLAM`方案目前主要有两种实现路径：一种是基于`RGBD`的深度摄像机，如`KINECT`；另一种基于单目、双目或鱼眼摄像头。基于深度摄像机的视觉`SLAM`与激光`SLAM`类似，也是通过收集到的点云数据来计算障碍物的距离；基于单目、双目或鱼眼摄像头的视觉`SLAM`，主要利用多帧图像来估计自身的位姿变化，并通过累计位姿变化来计算距离物体的距离，并进行定位与地图构建。


    #### 2.地图构建


    和人类绘制地图一样，机器人描述环境、认识环境的过程主要依靠地图。这里说的地图，是用来在环境中定位，以及描述当前环境以便于规划航线的一个概念，它通过记录以某种形式的感知获取的信息，用以和当前的感知结果相比较，以支撑对现实定位的评估。


    地图构建是研究如何把从一系列传感器收集到的信息，集成到一个一致性的模型上的问题，它的核心部分是环境的表达方式以及传感器数据的解释。地图构建利用环境地图来描述其当前环境信息，并根据使用的算法与传感器的差异采用不同的地图描述形式。因此，在机器人技术中，`SLAM`的地图构建通常指的是建立与环境几何一致的地图。


    目前，机器人学中地图的表示方法主要有4种：栅格地图、特征点地图、直接表征法以及拓扑地图。


    ##### （1）栅格地图


    机器人对于环境地图的最常见的描述方式为栅格地图。栅格地图就是把环境划分成一系列栅格，其中每一个栅格给定一个可能值，表示该栅格被占据的概率。这种地图看起来和人们所认知的地图没有什么区别，其本质是一张位图图片，但其中每个“像素”表示了实际环境中存在障碍物的概率分布。一般来说，当采用激光雷达、深度摄像头、超声波传感器等可以直接测量距离数据的传感器进行`SLAM`时，可以使用栅格地图。这种地图也可以通过距离测量传感器、超声波（早期）、激光雷达（现在）绘制出来。栅格地图既能表示空间环境中的很多特征，机器人可以用它来进行路径规划；又不直接记录传感器的原始数据，相对实现了空间和时间消耗的最优解。因此，栅格地图是目前机器人所广泛应用的地图存储方式。图9-5所示为栅格地图。


    ![](Images/image_189_0_m.jpg)


    图9-5　栅格地图


    ##### （2）特征点地图


    特征点地图使用有关的几何特征（如点、直线、面）表示环境，常见于视觉`SLAM`中。与栅格地图相比，这种地图看起来不那么直观。它一般通过诸如`GPS`、`UWB`以及摄像头配合稀疏方式的视觉`SLAM`算法产生，优点是数据存储量和运算量相对比较小，多见于最早的`SLAM`算法中。


    ##### （3）直接表征法


    在直接表征法中，省去了特征或栅格表示这一中间环节，直接用传感器读取的数据来构造机器人的位姿空间。这种方法就像卫星地图一样，直接将传感器原始数据通过简单处理拼接形成地图，相对来说更加直观。但是直接表征法的信息冗余度较大，对于数据存储是很大的挑战，从中提取出有用的数据相对麻烦，因此在实际应用中很少使用。


    ##### （4）拓扑地图


    拓扑地图是一种相对更加抽象的地图形式，它把室内环境表示为带节点和相关连接线的拓扑结构图，其中，节点表示环境中的重要位置点（拐角、门、电梯、楼梯等），边表示节点间的连接关系，如走廊等。当扫地机器人要进行房间清扫的时候，就会建立一张拓扑地图。


    图9-6所示为`SLAM`模块在智能机器人中的应用，其中`CAN`通信是一种现场总线技术，常用于串行通信网络中。


    ![](Images/cutq_190_49617_l.jpg)


    图9-6　`SLAM`模块在智能机器人中的应用


    #### 3.路径规划


    导航技术是移动机器人技术的核心，而路径规划是导航研究的一个重要环节。例如，导航仪的核心就是路径规划，在谷歌的无人驾驶汽车研究中，主要的工作量都在导航算法上。路径规划就是依据某个或某些优化准则，在机器人工作空间中找到一条从起始状态到目标状态、可以避开障碍物的最优路径。


    目前，移动智能机器人路径规划的主要方法有如下3种。


    ##### （1）基于事例的学习规划方法

    '
  trans: '


    其次，机器人需要一个能量源来驱动传动装置。大多数机器人会使用电力供电。此外，液压机器人需要一个泵来为液体加压，而气动机器人则需要气体压缩机或压缩气罐。所有传动装置都通过导线与一块电路相连，该电路直接为电动机和螺线圈供电，并控制电子阀门来启动液压系统，阀门可以控制承压流体在机器内流动的路径。如果机器人要移动一条由液压驱动的腿，则它的控制器会打开一只阀门，这只阀门由液压泵通向腿上的活塞筒，承压流体将推动活塞，使腿部向前旋转。通常，机器人使用可提供双向推力的活塞，以使部件能向两个方向活动。


    机器人的计算机可以控制与电路相连的所有部件，为了使机器人动起来，计算机会打开所有需要的电动机和阀门。大多数机器人是可重新编程的，如果要改变机器人的行为，则只需将一个新的程序写入它的计算机即可。


    并非所有的机器人都有传感系统，很少有机器人具有视觉、听觉、嗅觉或味觉（智能机器人除外）。机器人拥有的最常见的一种感觉是运动感，也就是它监控自身运动的能力。在标准设计中，机器人的关节处装有刻有凹槽的轮子，在轮子的一侧有一个发光二极管，它发出一道光束，穿过凹槽，照在位于轮子另一侧的光传感器上。当机器人移动某个特定的关节时，有凹槽的轮子会转动，在此过程中，凹槽将挡住光束，即实现了它对自身运动的监控。


    以上这些是机器人的基本组成部分。机器人专家有无数种方法可以将这些元素组合起来，从而制造出无限复杂的机器人。


    ## 2.机器人的逻辑结构


    机器人的逻辑结构主要由机械部分、传感部分和控制部分组成。这三大部分又可分为驱动系统、机械结构系统、感知系统、机器人-环境交互系统、人机交互系统和控制系统，如图
    9-1 所示。


    ![](img/cutq_182_10441_m.jpg)


    图 9-1　机器人的逻辑结构


    ### （1）驱动系统


    要使机器人运作起来，就需为各个关节即每个运动自由度安装传动装置，这就是驱动系统。驱动系统可以是液压传动、气压传动、电动传动或者是把它们结合起来的综合系统，也可以直接驱动或者通过同步带、链条、轮系、谐波齿轮等机械传动机构进行间接驱动。


    ### （2）机械结构系统


    机器人的机械结构系统由基座、手臂、末端操作器三大部分组成，每一个大件都有若干个自由度的机械系统。若基座具备行走机构，则构成行走机器人；若基座不具备行走及弯腰机构，则构成单机器人臂中，手臂一般由上臂、下臂和手腕组成；末端操作器是直接装在手腕上的一个重要部件，它可以是二手指或多手指的手爪设备，也可以是喷漆枪、焊具等作业工具。


    ### （3）感知系统


    感知系统由内部传感器模块和外部传感器模块组成，用以获得内部和外部环境状态中有意义的信息。智能传感器的使用提高了机器人的机动性、适应性和智能化的水准。人类的感受系统对感知外部世界信息是极其灵巧的，然而，对于一些特殊的信息，传感器比人类的感受系统更有效。


    ### （4）机器人-环境交互系统


    机器人-环境交互系统是现代工业机器人与外部环境中的设备互相联系和协调的系统。工业机器人与外部设备集成为一个功能单元，如加工单元、焊接单元、装配单元等。当然，其也可以是多台机器人、多台机床或设备、多个零件存储装置等集成为一个执行复杂任务的功能单元。


    ### （5）人机交互系统


    人机交互系统是操作人员控制机器人并与机器人联系的装置，例如，计算机的标准终端、指令控制台、信息显示板、危险信号报警器等。该系统归纳起来可分为两大类：指令给定装置和信息显示装置。


    ### （6）控制系统


    控制系统的任务是根据机器人的作业指令程序以及传感器反馈的信号，控制机器人的执行机构完成规定的运动和功能。若机器人不具备信息反馈特征，则为开环控制系统；若具备信息反馈特征，则为闭环控制系统。根据控制原理，控制系统可分为程序控制系统、适应性控制系统和人工智能控制系统。根据控制运行的形式，控制系统可分为点位控制和轨迹控制。


    ## 3.机器人的工作原理


    机器人大多用来从事繁重的重复性制造工作，它们主要负责那些对人类来说非常困难、危险或枯燥的任务。


    机器人的工作主要由机器臂来完成。一部典型的机器臂由 7 个金属部件构成，它们是用 6 个关节连接起来的，计算机将控制与每个关节分别相连的步进式电动机旋转，以便控制机器人（某些大型机器臂使用液压或气动系统）。与普通电动机不同，步进式电动机会以增量方式精确移动。这使得计算机可以精确地移动机器臂，使机器臂不断重复完全相同的动作，机器人利用运动传感器来确保自己完全按正确的量移动。这种带有
    6 个关节的工业机器人与人类的手臂极为相似，它具有相当于肩膀、肘部和腕部的部位，它的“肩膀”通常安装在一个固定的基座结构上。这种类型的机器人有 6 个自由度，也就是说，它能向
    6 个不同的方向转动，与之相比，人的手臂有 7 个自由度。图 9-2 所示为机器臂的组成。


    ![](img/cutq_184_23716_m.jpg)


    图 9-2　机器臂的组成


    人类手臂的作用是将手移动到不同的位置，类似的，机器臂的作用是移动末端执行器。有一种常见的末端执行器能抓握并移动不同的物品，它是人手的简化版本。机械手往往有内置的压力传感器，用来将机器人抓握某一特定物体时的力度反馈给计算机，以使机器人手中的物体不致掉落或被挤坏。


    ## 4.机器人的应用


    早期智能机器人主要用于工业和军事领域，大多数是机械手和机器臂。工业机器人是广泛用于工业领域的多关节机械手或多自由度的机器装置，具有一定的自动性，可依靠自身的动力能源和控制能力实现各种工业加工制造功能。图
    9-3 所示为工业机器人。


    ![](img/image_184_2_m.jpg)


    图 9-3　工业机器人


    工业机器人专门用来在受控环境下反复执行完全相同的工作。例如，某台机器人可能会负责给装配线上传送的花生酱罐子拧上盖子。为了教会机器人如何做这项工作，程序员会用一只手持控制器来引导机器臂完成整套动作，机器人会将动作序列准确地存储在内存中，此后，每当装配线上有新的罐子传送过来时，它就会反复地执行这套动作。


    工业机器人有如下几个显著特点。


    ### （1）可编程


    生产自动化的进一步发展是柔性自动化。工业机器人可随其工作环境变化的需要而再编程，因此能在小批量、多品种、具有均衡高效率的柔性制造过程中发挥很好的功用，是柔性制造系统（Flexible
    Manufacturing System，`FMS`）中的一个重要组成部分。


    ### （2）拟人化


    工业机器人在机械结构上有类似人的行走、腰转、大臂、小臂、手腕、手爪等部分，在控制上有计算机作为“大脑”。此外，智能化工业机器人有许多与人类类似的“生物传感器”，如皮肤型接触传感器、力传感器、负载传感器、视觉传感器、声音传感器等，传感器提高了工业机器人对周围环境的自适应能力。


    ### （3）通用性


    除了专门设计的专用的工业机器人外，一般工业机器人在执行不同的作业任务时具有较好的通用性。例如，更换工业机器人手部末端操作器（手爪、工具等）便可执行不同的作业任务。


    ### （4）机电一体化


    工业机器人技术涉及的学科相当广泛，但是归纳起来是机械学和微电子学的结合——机电一体化技术。第三代智能机器人不仅具有获取外部环境信息的各种传感器，还具有记忆能力、语言理解能力、图像识别能力、推理判断能力等人工智能，这些都和微电子技术的应用，特别是计算机技术的应用密切相关。因此，机器人技术的发展必将带动其他技术的发展，机器人技术的发展和应用水平也可以验证科学技术和工业技术的发展及应用水平。


    ## 9.1.2　认识智能机器人


    机器人是一种可编程和多功能的，用来搬运材料、零件、工具的操作机，或是为了执行不同的任务而具有可改变和可编程动作的专门系统。智能机器人是第三代机器人，这种机器人带有多种传感器，能够对多种传感器得到的信息进行融合，能够有效适应变化的环境，具有很强的自适应能力、学习能力和自治功能。


    因此，智能机器人是一个在感知、思维、效应方面全面模拟人类的机器系统。它是人工智能技术的综合试验场，可以全面地考察人工智能各个领域的技术，研究它们相互之间的关系，还可以在有害环境中代替人类从事危险工作。


    目前，一般认为智能机器人应该具备 3 个方面的能力：感知环境的能力、执行某种任务而对环境施加影响的能力和联系感知与行动的能力。


    随着智能机器人应用领域的扩大，人们期望智能机器人在更多领域为人类服务，代替人类完成更复杂的工作。然而，智能机器人所处的环境往往是未知的、很难预测，智能机器人所要完成的工作任务也越来越复杂，对智能机器人行为进行人工分析、设计也变得越来越困难。


    ## 9.1.3　智能机器人的发展现状


    目前研制中的智能机器人智能水平并不高，只能说是智能机器人的初级阶段。智能机器人研究中的当前核心问题分为两方面：一方面是提高智能机器人的自主性，这是就智能机器人与人的关系而言的，即希望智能机器人进一步独立于人，具有更为友善的人机界面，从长远来说，希望只要操作人员给出要完成的任务，机器人就能自动形成完成该任务的步骤，并自动完成它；另一方面是提高智能机器人的适应性，提高智能机器人适应环境变化的能力，这是就智能机器人与环境的关系而言的，希望加强它们之间的交互关系。


    在各国的智能机器人发展中，美国的智能机器人技术在国际上一直处于领先地位，其技术全面、先进，适应性也很强，性能可靠、功能全面、精确度高，其视觉、触觉等人工智能技术已在航天、汽车工业中广泛应用。日本得益于一系列扶持政策，各类机器人包括智能机器人的研究发展迅速。欧洲各国在智能机器人的研究和应用方面在世界上处于公认的领先地位。我国的智能机器人研究起步较晚，但在人工智能、云计算、大数据等技术的兴起下，我国已经成为全球最大的工业机器人消费市场以及世界上最大的潜在服务机器人市场，智能机器人产业发展拥有得天独厚的环境优势。然而，由于起步较晚、技术滞后等多重因素，我国智能机器人产业发展与国际领先水平仍然存在较大差距，需奋力追赶。


    ## 9.1.4　智能机器人的前景


    机器人在不断地向着更高级发展，对于未来智能机器人可能的几大发展趋势，这里概括性分析如下。


    1.语言交流功能越来越完美


    出于人机交互的目的，机器人语言功能的完善是一个非常重要的环节。目前，机器人的语言能力主要依赖于其存储器内预先存储的大量语音语句和文字词汇，其语言的能力取决于数据库内存储语句量的大小及其存储的语言范围。


    2.各种动作的完美化


    机器人的动作是相对于模仿人类动作来说的，我们知道人类能做的动作是多样化的，招手、握手、走、跑、跳等都是人类的惯用动作。现代智能机器人虽然能模仿人的部分动作，但是相对有一些僵化的感觉，或者动作是比较缓慢的。今后智能机器人将装配更灵活的类似人类的关节和仿真人造肌肉，以模仿更多的动作，使其更像人类。


    3.外形越来越酷似人类


    科学家研制越来越高级的智能机器人时主要是以人类自身形体为参照对象的，在这一方面日本应该是相对领先的，当然，目前国内的技术也是非常优秀的。随着仿真程度的不断提升，今后可能无法仅通过外形来辨别智能机器人与人类。


    4.复原功能越来越强大


    只要是人类都会有生老病死，而对于机器人来说，虽然不存在生物的常规死亡现象，但是会存在一系列的故障，如内部元件故障、线路故障、机械故障、干扰性故障等，这些故障就相当于人类的病理现象。未来智能机器人将具备越来越强大的自行复原功能，对于自身内部零件等运行情况，机器人会随时自行检索，并及时排除问题。它的检索功能就像人类感觉身体哪里不舒服一样，是智能意识的表现。


    5.体内能量存储越来越大


    智能机器人的一切活动都需要体内持续的能量供应，机器人的动力源多数使用电能，供应电能就需要大容量的蓄电池，只有大容量的电池才能满足机器人的日常电能消耗。


    6.逻辑分析能力越来越强


    人类的大部分行为能力需要借助于逻辑分析，例如，思考问题需要非常明确的逻辑推理分析能力，而相对平常化的走路其实是一种简单逻辑。因为走路需要的是平衡性，大脑在根据路况不断地分析、判断该怎么走才不会摔倒，而机器人走路要通过复杂的计算来进行，因此提升智能机器人的逻辑分析能力在一定程度上可以提高机器人的运行能力。


    ## 9.2　智能机器人的核心技术


    随着人工智能技术的进步，我国服务机器人产业迎来了蓬勃发展，2019 年，我国服务机器人市场规模约为 22 亿美元。基于不同的应用场景，各领域衍生出了各类形态不一的服务机器人，如餐厅送餐机器人、商场导购机器人、银行柜台机器人等，虽然功能不同，但是这些机器人想要拥有高效的感知、识别等能力，离不开定位导航和人机交互这两大核心技术。


    ### 9.2.1　定位导航


    定位导航技术是实现机器人智能行走的第一步，本质上就是帮助机器人实现自主定位、建图、路径规划及避障等能力。定位导航技术需要机器人的感知能力，需要借助视觉传感器（如激光雷达）来帮助机器人完成周围环境的扫描，并配合相应的算法，构建有效的地图数据，以完成运算，最终实现机器人的自主定位导航。


    同步定位与地图构建（Simultaneous Localization And Mapping，`SLAM`）主要用于解决移动机器人在未知环境中运行时即时定位与地图构建的问题。`SLAM`问题可以描述如下：机器人在未知环境中从一个未知位置开始移动，在移动过程中根据位置估计和传感器数据进行自身定位，同时构建增量式地图。目前，`SLAM`算法已被应用于无人机、无人潜艇、行星探测车、家政机器人等。


    利用`SLAM`技术，可以让机器人在未知的环境中实时地知道自己的位置，并同步绘制环境地图。在机器人的定位、跟踪和路径规划技术中，`SLAM`都扮演了核心角色。没有`SLAM`的机器人就好比在移动互联网时代不能上网的智能手机，发挥不了重要作用。因此，`SLAM`更像是一个概念而不是一个算法，它本身包含许多步骤，其中的每一个步骤均可以使用不同的算法实现。


    #### 1.同步定位


    在机器人定位导航技术中，目前主要涉及激光`SLAM`及视觉`SLAM`。激光`SLAM`主要采用`2D`或`3D`激光雷达进行数据采集。在室内机器人（如扫地机器人）上，一般使用`2D`激光雷达；在无人驾驶领域，一般使用`3D`激光雷达。


    激光`SLAM`的定位过程如下：通过激光雷达实时采集周围物体的环境信息，最初采集到的物体信息呈现的是一系列分散的、具有准确角度和距离的点云数据（数据以点的形式记录，每一个点是包含三维坐标，甚至颜色信息的数据），图
    9-4 所示为点云数据。


    ![](img/image_188_0_m.jpg)


    图 9-4　点云数据


    `SLAM`系统可以对不同时刻的两片点云数据进行匹配与比对，并通过计算激光雷达相对运动的距离和姿态的改变，来完成对机器人本身的定位。


    视觉`SLAM`方案目前主要有两种实现路径：一种是基于`RGBD`的深度摄像机，如`KINECT`；另一种基于单目、双目或鱼眼摄像头。基于深度摄像机的视觉`SLAM`与激光`SLAM`类似，也是通过收集到的点云数据来计算障碍物的距离；基于单目、双目或鱼眼摄像头的视觉`SLAM`，主要利用多帧图像来估计自身的位姿变化，并通过累计位姿变化来计算距离物体的距离，并进行定位与地图构建。


    #### 2.地图构建


    和人类绘制地图一样，机器人描述环境、认识环境的过程主要依靠地图。这里说的地图，是用来在环境中定位，以及描述当前环境以便于规划航线的一个概念，它通过记录以某种形式的感知获取的信息，用以和当前的感知结果相比较，以支撑对现实定位的评估。


    地图构建是研究如何把从一系列传感器收集到的信息，集成到一个一致性的模型上的问题，它的核心部分是环境的表达方式以及传感器数据的解释。地图构建利用环境地图来描述其当前环境信息，并根据使用的算法与传感器的差异采用不同的地图描述形式。因此，在机器人技术中，`SLAM`的地图构建通常指的是建立与环境几何一致的地图。


    目前，机器人学中地图的表示方法主要有 4 种：栅格地图、特征点地图、直接表征法以及拓扑地图。


    ##### （1）栅格地图


    机器人对于环境地图的最常见的描述方式为栅格地图。栅格地图就是把环境划分成一系列栅格，其中每一个栅格给定一个可能值，表示该栅格被占据的概率。这种地图看起来和人们所认知的地图没有什么区别，其本质是一张位图图片，但其中每个“像素”表示了实际环境中存在障碍物的概率分布。一般来说，当采用激光雷达、深度摄像头、超声波传感器等可以直接测量距离数据的传感器进行`SLAM`时，可以使用栅格地图。这种地图也可以通过距离测量传感器、超声波（早期）、激光雷达（现在）绘制出来。栅格地图既能表示空间环境中的很多特征，机器人可以用它来进行路径规划；又不直接记录传感器的原始数据，相对实现了空间和时间消耗的最优解。因此，栅格地图是目前机器人所广泛应用的地图存储方式。图
    9-5 所示为栅格地图。


    ![](img/image_189_0_m.jpg)


    图 9-5　栅格地图


    ##### （2）特征点地图


    特征点地图使用有关的几何特征（如点、直线、面）表示环境，常见于视觉`SLAM`中。与栅格地图相比，这种地图看起来不那么直观。它一般通过诸如`GPS`、`UWB`以及摄像头配合稀疏方式的视觉`SLAM`算法产生，优点是数据存储量和运算量相对比较小，多见于最早的`SLAM`算法中。


    ##### （3）直接表征法


    在直接表征法中，省去了特征或栅格表示这一中间环节，直接用传感器读取的数据来构造机器人的位姿空间。这种方法就像卫星地图一样，直接将传感器原始数据通过简单处理拼接形成地图，相对来说更加直观。但是直接表征法的信息冗余度较大，对于数据存储是很大的挑战，从中提取出有用的数据相对麻烦，因此在实际应用中很少使用。


    ##### （4）拓扑地图


    拓扑地图是一种相对更加抽象的地图形式，它把室内环境表示为带节点和相关连接线的拓扑结构图，其中，节点表示环境中的重要位置点（拐角、门、电梯、楼梯等），边表示节点间的连接关系，如走廊等。当扫地机器人要进行房间清扫的时候，就会建立一张拓扑地图。


    图 9-6 所示为`SLAM`模块在智能机器人中的应用，其中`CAN`通信是一种现场总线技术，常用于串行通信网络中。


    ![](img/cutq_190_49617_l.jpg)


    图 9-6　`SLAM`模块在智能机器人中的应用


    #### 3.路径规划


    导航技术是移动机器人技术的核心，而路径规划是导航研究的一个重要环节。例如，导航仪的核心就是路径规划，在谷歌的无人驾驶汽车研究中，主要的工作量都在导航算法上。路径规划就是依据某个或某些优化准则，在机器人工作空间中找到一条从起始状态到目标状态、可以避开障碍物的最优路径。


    目前，移动智能机器人路径规划的主要方法有如下 3 种。


    ##### （1）基于事例的学习规划方法


    '
  toc: []
- raw: '基于事例的学习规划方法依靠过去的经验进行学习及问题求解，一个新的事例可以通过修改事例库中与当前情况相似的旧事例来获得。将其应用于移动机器人的路径规划中可以描述如下：首先，利用路径规划所用到的或已产生的信息建立一个事例库，库中的任一事例包含每一次规划时的环境信息和路径信息，这些事例可以通过特定的索引取得；其次，把由当前规划任务和环境信息产生的事例与事例库中的事例进行匹配，以找出一个最优匹配事例；最后，对该事例进行修正，并以此作为最终结果。移动机器人导航需要良好的自适应性和稳定性，而基于事例的方法能满足这个要求。


    （2）基于环境模型的规划方法


    基于环境模型的规划方法首先需要建立一个机器人运动环境的环境模型。在很多情况下，由于移动机器人的工作环境具有不确定性（包括非结构性、动态性等），使得移动机器人无法建立全局环境模型，而只能根据传感器信息实时地建立局部环境模型，因此局部模型的实时性、可靠性成为影响移动机器人安全、连续和平稳运动的关键因素。环境建模的方法基本上可以分为两类，即网络/图建模方法和基于网格的建模方法，前者主要包括自由空间法、顶点图像法、广义锥法等，它们可得到比较精确的解，但所耗费的计算量相当大，不适合实际的应用，而后者在实现上要简单许多，所以应用比较广泛，其典型代表是四叉树建模法及其扩展算法等。


    （3）基于行为的路径规划方法


    基于行为的路径规划方法是由生物系统启发而产生的自主机器人设计方法。它采用了类似动物进化的自底向上的原理体系，尝试从简单的智能体来建立一个复杂的系统。将其用于解决移动机器人路径规划问题是一种新的发展趋势，它把导航问题分解为许多相对独立的行为单元，如跟踪、避碰、目标制导等。这些行为单元是一些由传感器和执行器组成的完整的运动控制单元，具有相应的导航功能，各行为单元所采用的行为方式各不相同，它们通过相互协调工作来完成导航任务。


    基于行为的路径规划方法大体可以分为反射式行为、反应式行为和慎思行为3种类型的路径规划方法。反射式行为类似于膝跳反射，是一种应激性反应，它可以对突发性情况做出迅速响应，如移动机器人在运动中的紧急停止等，但该方法不具备智能性，一般需要与其他方法结合使用；反应式行为是指机器人的系统类型是纯反应式的，不能形成记忆，也不能利用过去的经验来做出当前的决定，因此它们无法以交互方式参与实际应用，相反，每当这些机器遇到同样的情况时，它们的行为都会完全相同；慎思行为是指利用已知的全局环境模型为智能体系统到达某个特定目标提供最优动作序列，适用于复杂静态环境下的规划，移动机器人在运动中的实时重规划就是一种慎思行为，机器人可能出现倒退的动作以走出危险区域，但由于慎思规划需要一定的时间去执行，所以它对于环境中不可预知的改变反应较慢。


    反应式行为和慎思行为可以通过传感器数据、全局知识、反应速度、推理论证能力和计算的复杂性来加以区分。近年来，在慎思行为的发展中出现了一种类似于人类记忆的陈述性认知行为，应用这种规划不仅仅依靠传感器和已有的先验信息，还取决于所要到达的目标。例如，对于距离较远且暂时不可见的目标，有可能存在一个行为分叉点，即有几种行为可供采用，机器人要择优选择，这种决策性行为就是陈述性认知行为。将它用于路径规划中能使移动机器人具有更高的智能，但由于决策的复杂性，该方法难以用于实际之中，还有待进一步研究。


    图9-7所示为智能机器人的路径规划实现。当机器人要从点P运动到点Q时，如果在途中遇到了障碍物（图9-7中的3个大圆形），机器人会根据一系列的算法自动避开障碍物，从而顺利走到目的地并完成任务。


    ![](Images/image_191_0_l.jpg)


    图9-7　智能机器人的路径规划实现


    ### [9.2.2　人机交互](../Text/contents.xhtml#z231)


    在拥有基础的自主定位导航技术后，机器人要想进一步发挥自身作用，还需要拥有人机交互能力。人机交互技术可让机器人进一步了解人类，了解用户诉求，从而为用户提供更个性化的服务。过去的机器人以机器为中心，人类手把手教机器人怎么干活；未来的机器人应该以人类为中心，让机器人来适应人类，人类说一句话，机器人就能理解这句话从而做出行动，这是一个根本性的改变。


    从第一代以键盘鼠标为交互方式的PC互联网时代，到第二代以触屏为主的移动互联网时代，再到今天以多模态人机交互方式为主的第三代互联网，人机交互的形式发生了巨大的变化。


    目前，人机交互技术主要包括语音识别、语义理解、人脸识别、图像识别、体感/手势交互等技术。通过语音识别、合成、理解等技术，可以实现更精准的营销和专属服务；通过人脸识别，可帮助商家精准地识别用户，提升用户体验等。这些交互方式的改变将会深刻地影响人们日常生活的应用场景。


    1.语音交互


    基于语音的人机交互是当前人机交互技术中最为主要的表现形式，语音人机交互过程中包含信息输入和输出的交互、语音处理、语义分析、智能逻辑处理以及知识与内容的整合。结合语音人机交互过程，人机交互中的关键技术中包含了自然语音处理、语义分析和理解、知识构建和学习体系、语音技术、整合通信技术以及云计算处理技术。经过科研人员的不断努力，目前语音交互技术已成功投入商用，如今智能手机、智能音箱、智能电视等设备中大多采用了语音人机交互技术，随着语音人机交互技术应用价值的逐渐显现，众多企业纷纷布局语音人机交互领域，随着布局企业的不断增多，语音人机交互的产业规模也在不断扩大，并带动了机器人、家电、汽车等相关产业的发展。


    2.视觉交互


    除了语音人机交互之外，基于视觉的人机交互技术也是目前研究的一大热点。未来机器人需要理解人的感情，此时会涉及人脸识别技术，包括特征提取及分类。目前，在这种技术中，对于人类基本的7种表情的识别率可达到80%左右。但在自然交流过程中，人的表情比较平淡，机器人难以对其进行准确分辨，需要进行一些更加复杂的特征提取过程。


    3.手势交互


    手势识别也是人机交互的重要手段之一，通过手部的动作直接控制计算机，相比传统的键盘、鼠标等控制方式，具有自然直观和便于学习等优点。目前，常用的手势识别方法主要包括基于神经网络的识别方法、基于隐马尔可夫模型的识别方法和基于几何特征的识别方法。基于神经网络的识别方法具有抗干扰、自组织、自学习和抗噪声等优点，但训练时需要采集的样本量大，且对时间序列的处理能力不强；基于隐马尔可夫模型的识别方法能够细致地描述手势信号，但拓扑结构一般，计算量相对较大；基于几何特征的识别方法是根据手的区域及边缘几何特征关系进行手势识别，该方法无须对手势进行时间上的分割，计算量小。


    ## [9.3　智能机器人的应用](../Text/contents.xhtml#z232)


    早期智能机器人主要用于工业和军事领域，大多数是机械手和机器臂。如今，智能机器人的应用已经深入各行各业，在军事、制造业、医疗、服务等方面有着广泛的应用。


    按照工作场所的不同，智能机器人可以分为管道、水下、空中、地面机器人等。管道机器人可以用来检测管道使用过程中的破裂、腐蚀和焊缝质量情况，在恶劣环境下承担着管道的清扫、喷涂、焊接、内部抛光等维护工作，以及对地下管道进行修复；水下机器人可以用于进行海洋科学研究、海上石油开发、海底矿藏勘探、海底打捞救生等；空中机器人可以用于通信、气象、灾害监测、农业、地质、交通、广播电视等；服务机器人以半自主或全自主方式工作，为人类提供服务，其中医用机器人具有良好的应用前景；仿人机器人的形状与人类似，具有移动功能、操作功能、感知功能、记忆和自治功能，能够实现人机交互；微型机器人以纳米技术为基础在生物工程、医学工程、微型机电系统、光学、超精密加工及测量（如扫描隧道显微镜）等方面具有广阔的应用前景。图9-8所示为医用机器人，图9-9所示为水下机器人，图9-10所示为微型机器人，图9-11所示为火星探测机器人。


