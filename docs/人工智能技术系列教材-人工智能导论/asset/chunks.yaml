    ### (5) 容错性强

    HDFS 认为所有计算机都可能出错，为了避免由于某台主机失效而读取不到该主机的块文件，HDFS 将同一个文件块的副本分配到其他几台主机上，如果其中一台主机失效，则可以迅速找到另一块副本并读取文件。


    分布式键值系统用于存储关系简单的半结构化数据。典型的分布式键值系统有 Amazon Dynamo，以及获得广泛关注和应用的对象存储（Object Storage）技术。


    ## 2. NoSQL 数据库

    传统的关系型数据库采用关系模型作为数据的组织方式，但是随着大数据对数据存储要求的不断提高，在大数据存储中，之前常用的关系型数据库已经无法满足 Web 2.0
    的需求。在这种情况下，NoSQL 应运而生。NoSQL 又叫作非关系型数据库，它是英文“Not Only SQL”的缩写，即“不仅仅是 SQL”。NoSQL
    一词最早出现于 1998 年，是卡洛·斯特罗齐（Carlo Strozzi）开发的一个轻量、开源、不提供 SQL 功能的非关系型数据库。与数据库管理系统相比，NoSQL
    不使用 SQL 作为查询语言，其存储也不需要固定的表模式，因此用户操作 NoSQL 时通常会避免使用关系型数据库中的“连接”操作。NoSQL 一般具备水平可扩展的特性，可以支持超大规模数据存储，灵活的数据模型也可以很好地支持
    Web 2.0 应用。典型的 NoSQL 包括以下几种：键值数据库、列族数据库、文档数据库和图形数据库。值得注意的是，NoSQL 也存在一些缺点，如缺乏较为扎实的数学理论基础，在查询复杂数据时性能不强；很难实现事务强一致性和数据完整性；技术尚不成熟，缺乏专业团队的技术支持，维护较为困难等。图
    2-4 所示为图形数据库的连接关系。


    ![](img/cutq_34_4673_m.jpg)


    图 2-4　图形数据库的连接关系


    ## 3. NewSQL 数据库

    NewSQL 数据库是指各种新的可扩展/高性能数据库，它是一种相对较新的形式，旨在使用现有的编程语言和以前不可用的技术来结合 SQL 和 NoSQL。这类数据库不仅具有
    NoSQL 对海量数据的存储管理能力，还保持了传统数据库支持 ACID 和 SQL 等的特性。因此，NewSQL 也被定义为下一代数据库的发展方向。在技术上，相较于传统关系型数据库，NewSQL
    更强调数据一致性，以更好地适应分布式数据库的应用；它取消了耗费资源的缓冲池，直接在内存中运行整个数据库，缩短了访问数据库的时间；此外，它摒弃了单线程服务的锁机制，通过使用冗余机器来实现复制和故障恢复，以取代原有的成本高昂的恢复操作。


    ## 4. 云数据库

    云数据库是指被优化或部署到一个虚拟计算环境中的数据库，是在云计算的大背景下发展起来的一种新兴的共享基础架构的方法，它极大地增强了数据库的存储能力，消除了人员、硬件、软件的重复配置，让软、硬件升级变得更加容易。因此，云数据库具有高可扩展性、高可用性、采用多租形式和支持资源有效分发等特点，可以实现按需付费和按需扩展。图
    2-5 所示为阿里云的云数据库服务。


