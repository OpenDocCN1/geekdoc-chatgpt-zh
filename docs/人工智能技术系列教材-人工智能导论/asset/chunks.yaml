    相较于`Sigmoid`函数和`tanh`函数，`ReLU`函数对于随机梯度下降法的收敛有着巨大的加速作用，同时`ReLU`函数的计算仅需要一个阈值判断，不像`Sigmoid`激活函数与`tanh`激活函数一样需要指数运算，相比于这两个激活函数，使用`ReLU`激活函数为整个神经网络学习训练过程节省了很多计算量。`ReLU`函数会使一部分神经元的输出为0，为神经网络提供了稀疏表达能力，并减少了参数的相互依存关系，缓解了过拟合问题的发生。`ReLU`函数还有一个巨大优势，它能够有效地缓解梯度消失，即解决梯度容易为0的问题。


    `ReLU`激活函数示意图如图4-5所示。


    ![](Images/cutq_79_32801_m.jpg)


    图4-5　`ReLU`激活函数示意图


    当然，`ReLU`函数也是存在一些问题的，在实际应用中，当学习率设置得太高的时候，可能会造成神经元不被激活，也就是参数可能不再更新的情况发生。为了防止这样的情况发生，很多`ReLU`的改进版本诞生了，`Leaky-ReLU`就是其中一个典型的改进版本。`Leaky-ReLU`公式定义如式4-9所示。


    ![](Images/cutq_80_42980_l.jpg)


    式中，`a`为一个固定常数，一般取值为0.01。当`a`是一个在给定的范围内随机抽取的值时，就变成`ReLU`的另外一种改进版本——`RReLU`（Random
    ReLU）；当`a`是可根据数据变化的值时就是`PReLU`（Parametric ReLU）。这3种改进的`ReLU`函数能够在一定程度上解决`ReLU`函数的问题，但是目前使用最多的还是`ReLU`激活函数。


    ### 4.1.7　损失函数


    损失函数是模型对数据拟合程度的反映，拟合得越差，损失函数的值就越大。与此同时，当损失函数比较大时，其对应的梯度也会随之增大，这样就可以加快变量的更新速度。


