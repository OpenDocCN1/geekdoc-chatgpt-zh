    ## [1.7　小结](../Text/contents.xhtml#z37)


    （1）人工智能是研究、开发用于模拟、延伸和扩展人的智能的理论、方法、技术及应用系统的一门新的技术科学。


    （2）人工智能学科有着十分广泛和极其丰富的研究内容，不同的人工智能研究者从不同的角度对人工智能的研究内容进行了分类。


    （3）对人工智能研究影响较大的主要有符号主义、连接主义和行为主义三大学派。


    （4）人工智能的应用领域十分广泛，从专家系统、自然语言处理、模式识别到机器人学都有人工智能的身影。


    ## [1.8　习题](../Text/contents.xhtml#z38)


    （1）简述人工智能的历史及其发展过程。


    （2）简述人工智能的分类。


    （3）简述人工智能的主要学派。


    （4）简述人工智能的应用。


    # [第2章　人工智能基础知识](../Text/contents.xhtml#a2)


    【本章导读】


    人工智能技术的发展与数学以及大数据技术密不可分。本章主要介绍人工智能的数学基础以及人工智能所需要的大数据知识。


    【本章要点】


    1 人工智能的数学基础


    2 人工智能的常用工具


    3 数据采集技术


    4 数据存储技术


    5 数据清洗技术


    6 数据分析技术


    ## [2.1　人工智能的数学基础](../Text/contents.xhtml#z39)


    人工智能实际上是一个将数学、算法理论和工程实践紧密结合的领域。人工智能背后就是各种算法，也就是数学、概率论、统计学、各种数学理论的体现。因此，学习人工智能必须要掌握基本的数学知识。


    ### [2.1.1　微积分](../Text/contents.xhtml#z40)


    微积分又称为“初等数学分析”，它是一门纯粹的数学理论，也是现代数学的基础，在商学、科学和工程学领域有广泛的应用，主要用来解决那些仅依靠代数学和几何学不能有效解决的问题。


    从发展历史上看，微积分理论由许多科学家和数学家共同努力才得以完善，而艾萨克·牛顿（Isaac Newton）和戈特弗里德·莱布尼茨（Gottfried Leibniz）被认为共同创立了微积分学。他们分别从不同角度和问题进行描述，前者的出发点是力学，而后者的出发点是几何；前者偏向于不定积分，而后者偏向于定积分。戈特弗里德·莱布尼茨创造的微积分符号更为优秀，被沿用至今。


    从内容上看，微积分包括微分和积分，其中微分学是关于函数局部变化率的学问，主要就是利用极限思维求斜率（求导数），是关于变化速率的理论；而积分学则为定义和计算面积等数据提供了一套通用的思路和方法，是数学分析的重要概念之一。


    在人工智能中，几乎所有的机器学习算法在训练或者预测时都是求解最优化问题，因此都需要依赖于微积分来求解函数的极值，而模型中某些函数的选取也有数学性质上的考量。因此，对于机器学习而言，微积分的主要作用如下。


    （1）求解函数的极值。


    （2）分析函数的性质。


    ### [2.1.2　线性代数](../Text/contents.xhtml#z41)


    线性代数研究的是向量空间以及将一个向量空间映射到另一个向量空间的函数。在人工智能中，线性代数是计算的根本，因为所有的数据都是以矩阵的形式存在的，任何一步操作都是在进行矩阵相乘、相加等。事实上，线性代数不仅是人工智能的基础，更是现代数学和以现代数学作为主要分析方法的众多学科的基础，从量子力学到图像处理都离不开向量和矩阵。而在向量和矩阵背后，线性代数的核心意义在于提供了一个看待世界的抽象视角：万事万物都可以被抽象成某种特征的组合，并在由预制规则定义的框架之下以静态和动态的方式加以观察。


    线性代数的本质在于将具体的事物抽象为数学对象，并描述其静态和动态的特性；而向量的实质是n维线性空间中的静止点；线性变换则描述了向量或者作为参考系的坐标系的变化，可以用矩阵表示；矩阵的特征值和特征向量描述了变化的速度与方向。


    线性代数在人工智能领域的主要应用如下。


    （1）搜索引擎的排名。


    （2）线性规划。


    （3）纠错码。


    （4）信号分析。


    （5）面部识别。


    （6）量子计算。


    ### [2.1.3　概率论与数理统计](../Text/contents.xhtml#z42)


    概率论与数理统计是研究人工智能、机器学习领域的理论基础。概率论是研究随机现象数量规律的数学分支，是一门研究事情发生的可能性的学问。而数理统计以概率论为基础，研究大量随机现象的统计规律性。


    虽然数理统计以概率论为理论基础，但是两者之间存在方法上的本质区别。概率论研究的前提是随机变量的分布已知，根据已知的分布来分析随机变量的特质与规律；而数理统计的研究对象则是未知分布的随机变量，研究方法是对随机变量进行独立重复的观察，根据得到的观察结果对原始分布做出推断。


    由于概率与统计源于生活与生产，又能有效地应用于生活与生产，且应用面十分广泛，因此除了可以应用于解决人们生活中的各类问题外，在前沿的人工智能领域同样有着重要的作用。例如，机器学习除了处理不确定量之外，也需处理随机量，而不确定性和随机性可能来自多个方面，从而可以使用概率论来量化不确定性；又如，在人工智能算法中无论是对于数据的处理还是分析，数据的拟合还是决策等，概率与统计都可以为其提供重要的支持。


    ### [2.1.4　最优化理论](../Text/contents.xhtml#z43)


    最优化理论是关于系统的最优设计、最优控制、最优管理问题的理论与方法。最优化就是在一定的约束条件下，使系统具有所期待的最优功能的组织过程，是从众多可能的选择中做出最优选择，使系统的目标函数在约束条件下达到最大或最小。现代优化理论及方法是在20世纪40年代发展起来的，随着研究的进行，其理论和方法愈来愈多，如线性规划、非线性规划、动态规划、排队论、对策论、决策论、博弈论等。


    从本质上讲，人工智能的目标就是最优化——在复杂环境与多体交互中做出最优决策。几乎所有的人工智能问题最后都会归结为一个优化问题的求解，因而最优化理论同样是研究人工智能必备的基础知识。最优化理论研究的问题是判定给定目标函数的最大值（最小值）是否存在，并找到令目标函数取得最大值（最小值）时的数值。如果把给定的目标函数看作一座山脉，那么最优化的过程就是判断顶峰的位置并找到到达顶峰路径的过程。


    ### [2.1.5　形式逻辑](../Text/contents.xhtml#z44)


    形式逻辑是研究人的认识知性阶段思维规律的学说，狭义指演绎逻辑，广义上还包括归纳逻辑。形式逻辑的思维规律也是思维形式和思维内容的统一，形式逻辑靠概念、判断、推理（主要包括归纳推理与演绎推理）来反映事物的实质。


    而早在人工智能的襁褓期，约翰·麦卡锡、赫伯特·西蒙、马文·闵斯基等图灵奖得主的共同愿望就是让“具备抽象思考能力的程序解释合成的物质如何能够拥有人类的心智”。通俗地说，理想的人工智能应该具有抽象意义上的学习、推理与归纳能力，其通用性将远远强于解决国际象棋或者围棋等具体问题的算法。


    因此，如果将认知过程定义为对符号的逻辑运算，人工智能的基础就是形式逻辑。而谓词逻辑是知识表示的主要方法，因此谓词逻辑系统可以实现具有自动推理能力的人工智能。


    ## [2.2　人工智能的常用工具](../Text/contents.xhtml#z45)


    人工智能的学习与应用离不开各种工具。本节主要介绍人工智能学习中常用的几种开源工具（框架）。


    ### [2.2.1　TensorFlow](../Text/contents.xhtml#z46)


    TensorFlow是谷歌出品的开源人工智能工具，它提供了一个使用数据流图进行数值计算的库。在结构上，TensorFlow拥有多层级结构，可部署于各类服务器、PC终端和网页，且支持图形处理器（Graphics
    Processing Unit，GPU）和张量处理器（Tensor Processing Unit，TPU）高性能数值计算，因而被广泛应用于谷歌内部的产品开发和各领域的科学研究。此外，TensorFlow具有强大的灵活性、真正的可移植性、自动微分功能，并支持Python和C++。


    ### [2.2.2　Mahout](../Text/contents.xhtml#z47)


    Mahout是Apache软件基金会旗下的一个开源项目，提供了一些可扩展的机器学习领域经典算法的实现，旨在帮助开发人员更方便快捷地创建智能应用程序。Mahout包含许多实现方式，如聚类、分类、推荐过滤、频繁子项挖掘等，通过使用Apache
    Hadoop库，Mahout可以有效地扩展到云中。Mahout有3个主要特性：一个构建可扩展算法的编程环境，像Spark和H2O一样的预制算法工具和一个名为Samsara的矢量数学实验环境。目前使用Mahout的公司包括Adobe、埃森哲咨询公司、Foursquare、英特尔、领英、Twitter、雅虎等。


    ### [2.2.3　Torch](../Text/contents.xhtml#z48)


    Torch是一个用于科学和数值的开源机器学习库，主要采用C作为编程语言，它基于Lua的库，通过提供大量的算法而深入学习研究，提高了效率和速度。Torch有一个强大的n维数组，可以方便地进行切片和索引等操作。除此之外，它提供了线性代数程序和神经网络模型。


    ### [2.2.4　Spark MLlib](../Text/contents.xhtml#z49)


    Spark MLlib是Spark的机器学习库，旨在简化机器学习的工程实践工作，并方便扩展到更大规模。其由一些通用的学习算法和工具组成，包括分类、回归、聚类、协同过滤、降维等，同时包括底层的优化原语和高层的管道API。其可采用Java、Scala、Python、R作为编程语言，可以轻松插入Hadoop工作流程，并且能够以极快的速度处理海量数据。


    ### [2.2.5　Keras](../Text/contents.xhtml#z50)


    Keras是一个由Python编写的开源人工神经网络库，可以作为人工智能工具的高阶应用程序接口，进行深度学习模型的设计、调试、评估、应用和可视化。Keras支持现代人工智能领域的主流算法，包括前馈结构和递归结构的神经网络，也可以通过封装参与构建统计学习模型。在硬件和开发环境方面，Keras支持多操作系统下的多GPU并行计算，可以根据后台设置转化为TensorFlow、Microsoft-CNTK等系统下的组件。


    ### [2.2.6　CNTK](../Text/contents.xhtml#z51)


    CNTK是微软出品的开源深度学习工具包，支持在CPU和GPU上运行。CNTK的所有API均基于C++设计，保证了速度和可用性。此外，CNTK提供了很多先进算法的实现，因此预测精度高。CNTK还提供了基于C++、C#和Python的接口，方便应用。


    ## [2.3　数据采集](../Text/contents.xhtml#z52)


    数据采集是人工智能与大数据应用的基础，研究人工智能离不开大数据的支撑，而数据采集是大数据分析的前提。本节主要介绍数据采集的基本知识。


    ### [2.3.1　数据采集的概念](../Text/contents.xhtml#z53)


    大数据开启了一个大规模生产、分享和应用数据的时代，它给技术和商业带来了巨大的变化。大数据技术，就是从各种类型的数据中快速获得有价值的信息的技术。


    数据采集作为大数据生命周期的第一个环节，是指通过传感器、摄像头、射频识别（Radio Frequency Identification，RFID）数据以及互联网等方式获取各种结构化、半结构化与非结构化的数据。其中，结构化数据常指存储关系在数据库中的数据，非结构化数据常指不规则或不完整的数据，而半结构化数据常指有一定的结构与一致性约束，但在本质上不存在关系的数据。目前，电商企业中80%的数据都是非结构化数据，并且这些数据的量每年都在不断增长。


    ### [2.3.2　数据采集的常见方法](../Text/contents.xhtml#z54)


    区别于小数据采集，大数据采集不再仅仅使用问卷调查、信息系统的数据库取得结构化数据。大数据的数据来源有很多，主要包括使用网络爬虫获取的网页文本数据、使用日志收集器收集的日志数据、从关系型数据库中获得的数据和由传感器收集到的时空数据等。而对于获取到的图像和语音数据，则需要通过技术处理才能使其变成大数据分析所需要的数据。


    1.日志数据采集


    许多公司的平台每天会产生大量的日志（一般为流式数据），处理这些日志需要特定的日志系统。因此，日志采集系统的主要工作就是收集业务日志数据，供离线和在线的分析系统使用。这种大数据采集方式可以高效地收集、聚合和移动大量的日志数据，并且能提供可靠的容错性能。高可用性、高可靠性和可扩展性是日志采集系统的基本特征。目前常用的开源日志采集平台有Apache
    Flume、Fluentd、Logstash、Chukwa、Scribe及Splunk Forwarder等，这些采集平台大部分采用的是分布式架构，能满足每秒数百兆位的日志数据采集和传输需求。图2-1所示为Fluentd采集平台。


    2.网络数据采集


    网络数据采集是指利用互联网搜索引擎技术实现有针对性、行业性、精准性的数据抓取，并按照一定规则和筛选标准进行数据归类，形成数据库文件的一个过程。目前网络数据采集采用的技术基本上是利用垂直搜索引擎技术的网络爬虫（或数据采集机器人）、分词系统、任务与索引系统等技术进行综合运用而成的，并且随着互联网技术的发展和网络海量信息的增长，对信息进行获取与分拣的需求会越来越大。目前常用的网络爬虫系统有Apache
    Nutch、Crawler4j、Scrapy等。采用多个系统并行抓取数据能充分利用计算机的计算资源和存储能力，大大提高系统抓取数据的能力，同时大大降低了开发人员的开发速率，使得开发人员可以很快地完成一个数据系统的开发。


    ![](Images/image_32_0_l.jpg)


    图2-1　Fluentd采集平台


    此外，网络数据采集支持图片、音频、视频等文件或附件的采集，其中附件与正文可以自动关联。除了网络中包含的内容之外，对于网络流量的采集可以使用DPI或DFI等带宽管理技术进行处理。


    图2-2所示为网络爬虫的作用，图2-3所示为网络爬虫的数据采集过程。


    ![](Images/cutq_32_5197_m.jpg)


    图2-2　网络爬虫的作用


    ![](Images/cutq_32_2264_l.jpg)


    图2-3　网络爬虫的数据采集过程


    3.数据库采集


    数据库采集是将实时产生的数据以记录的形式直接写入企业的数据库，并使用特定的数据处理系统进行进一步分析。目前比较常见的数据库采集主要有MySQL、Oracle、Redis、Bennyunn以及MongoDB等。这种方法通常在采集端部署大量数据库，并对如何在这些数据库之间进行负载均衡和分片进行深入的思考和设计。


    4.其他数据采集方法


    对于企业生产经营数据或学科研究数据等保密性要求较高的数据，可以通过与企业或研究机构合作，使用特定系统接口等相关方式采集数据，如API采集。API即应用程序接口，是网站的管理者为了使用方便而编写的一类程序接口，该类接口可以屏蔽网站底层的复杂算法，而仅通过简单调用即可实现对数据的请求功能。目前主流的社交媒体平台（如新浪微博、百度贴吧以及Facebook等）均提供API服务，可以在其官网开放平台上获取相关示例文件。


    ## [2.4　数据存储](../Text/contents.xhtml#z55)


    在人工智能时代，数据通常以GB，甚至TB乃至PB作为存储的量级，因而与传统的数据存储方式差异较大。本节主要介绍数据存储的基本知识。


    ### [2.4.1　数据存储的概念](../Text/contents.xhtml#z56)


    数据存储指将数量巨大，难于收集、处理、分析的数据集持久化到计算机中。由于大数据环境一定是海量的数据环境，并且增量有可能是海量的，因此大数据的存储和一般数据的存储有极大的差别，需要非常高性能、高吞吐率、大容量的基础设备。


    此外，大数据不仅存储的数据量大，更重要的是人们可以从存储的数据间找到联系，从而能够对数据进行比对和分析，最终产生商业价值。


    ### [2.4.2　数据存储的方式](../Text/contents.xhtml#z57)


    大数据的存储方式主要包括分布式存储、NoSQL数据库、NewSQL数据库以及云数据库4种。


    1.分布式存储


    分布式存储包含多个自主的处理单元，通过计算机网络互连来协作完成分配的任务，其分而治之的策略能够更好地处理大规模数据分析问题。目前，分布式存储主要包括分布式文件系统（Hadoop
    Distributed File System，HDFS）和分布式键值系统。


    分布式文件系统是一个有高容错性的系统，适用于批量处理，能够提供高吞吐量的数据访问，非常适合应用在大规模数据集上。HDFS的设计特点如下。


    （1）适合存储大数据文件，HDFS非常适合TB量级的大文件及大量文件的存储。当数据文件只有几吉字节或几十吉字节时，依然用传统的方式进行存储。


    （2）读取速度快，HDFS会将一个完整的大文件平均分块并存储到不同计算器上，读取文件时可以同时从多个主机中读取不同区块的文件，效率比单主机读取要高得多。


    （3）流式数据访问，一次写入多次读写，这种模式和传统方式不同，它不支持动态改变文件内容，而要求文件一次写入后再改变，或在文件末添加内容。


    （4）成本低，HDFS可以应用在普通计算机上，这种机制能够让一些公司用几十台廉价的计算机构建一个大数据集群。'
