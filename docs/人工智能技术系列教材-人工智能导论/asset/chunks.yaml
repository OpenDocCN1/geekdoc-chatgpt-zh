    ### 6.6.5 情感分析面临的困难与挑战 `../Text/contents.xhtml#z163`

    随着技术的进步，情感分析的研究已经有了非常大的进展，但依然存在着一些难题是目前尚未解决的，在实操过程中需特别注意以下几种类型的数据。


    #### 1. 颜文字和表情包

    互联网上大量的情感表达是通过颜文字和表情包来实现的，如经典的表示笑脸的颜文字“:D”，这类文本表达无法与上下文形成联系，很难判断其评价的实体对象是什么。可以将特定的颜文字作为一种特殊的词组构建成情感字典，并人工进行情感分的赋值；对于
    emoji，可以将标准的 emoji 编码编入情感字典。


    #### 2. 讽刺句

    讽刺句从字面上来看可能是褒义，但实际却是贬义，或者字面是贬义但实际却是褒义。例如，“太棒了！这家外卖治好了我多年的便秘！”这种讽刺句在情感分析中是非常难以处理的，需要结合常识或者相关的背景知识才能了解。在舆论或社会新闻的评价中，讽刺句比较常见。


    #### 3. 比较句

    比较句是特殊的情感表达句，例如，“我觉得这件衣服很适合我，但我更喜欢那一件。”这类比较句中通常存在着两个以上的实体或属性，很难分辨观点持有者到底是在对哪一个实体或属性表达情感，但是这类语句在商品的评论中非常常见，需要特别注意。


    #### 4. 情绪分类

    目前，对于情感的分析仅仅做了褒义、贬义、中性 3 种划分，但现实生活中的情绪远远不止这 3 种类型。在心理学领域中，著名的心理学家罗伯特·普拉切克（Robert
    Plutchik）提出的情绪轮包含了 8 种基本情绪，并且每种情绪又分为不同的情绪强度等级，8 种情绪还可以相互结合形成更多的情绪。但是在人工智能领域，对情绪进行多分类比情感分析的
    3 分类任务要难得多，目前大多数分类方法的结果准确性不到 50%。


    ## 6.7 语音识别 `../Text/contents.xhtml#z164`

    语言是人与人之间最重要的交流方式，能与机器进行自然的人机交流是人类一直期待的事情。随着人工智能的快速发展，语音识别技术作为人机交流接口的关键技术发展迅速。


    ### 6.7.1 语音识别的定义 `../Text/contents.xhtml#z165`

    语音识别，通常被称为自动语音识别（Automatic Speech Recognition，ASR），主要是将人类语音中的词汇内容转换为计算机可读的输入，一般为可以理解的文本内容或者字符序列。语音识别就好比机器的听觉系统，它使机器通过识别和理解将语音信号转换为相应的文本或命令。


    语音识别是一项融合多学科知识的前沿技术，覆盖了数学与统计学、声学、语言学、模式识别理论以及神经生物学等学科。自 2009 年深度学习技术兴起之后，语言识别技术的发展已经取得了长足进步。语音识别的精度和速度取决于实际应用环境，在安静环境、标准口音、常见词汇场景下的语音识别准确率已经超过
    97%，具备了与人类相仿的语言识别能力。


    ### 6.7.2 语音识别的发展历程 `../Text/contents.xhtml#z166`

    20 世纪 50 年代，语音识别的研究工作开始。1952 年，贝尔实验室研发出了世界上第一个能识别 10 个英文数字发音的实验系统。此时，语音识别的重点是探索和研究声音和语音学的基本概念及原理。


    20 世纪 60 年代开始，卡耐基梅隆大学的雷伊·雷蒂（Raj Reddy）等开展了连续语音识别的研究，但是进展很缓慢。1969 年，贝尔实验室的约翰·皮尔斯（John
    Pierce）甚至在一封公开信中将语音识别比作近几年不可能实现的事情。


    20 世纪 80 年代开始，以隐马尔可夫模型方法为代表的基于统计模型的方法逐渐在语音识别研究中占据了主导地位。它能够很好地描述语音信号的短时平稳特性，并能将声学、语言学、句法等知识集成到统一框架中。此后，它的研究和应用逐渐成为主流，第一个“非特定人连续语音识别系统”是当时还在卡耐基梅隆大学读书的李开复研发的
    SPHINX 系统。到 20 世纪 80 年代后期，人工神经网络也成为语音识别研究的一个方向。但这种浅层神经网络在语音识别任务上的效果一般，表现并不如隐马尔可夫模型。


    20 世纪 90 年代开始，语音识别掀起了第一次研究和产业应用的小高潮。这个时期，剑桥大学发布的隐马尔可夫开源工具包大幅度降低了语音识别研究的门槛。在此后将近
    10 年的时间中，语音识别的研究进展一直比较有限，基于隐马尔可夫模型的语音识别系统的整体效果还远远达不到实用化水平，语音识别的研究和应用陷入了瓶颈。


    2006 年，杰弗里·辛顿提出了深度置信网络，它解决了深度神经网络训练过程中容易陷入局部最优解的问题，自此深度学习的大潮正式拉开。2009 年，杰弗里·辛顿和他的学生将深度置信网络应用在语音识别声学建模中，并且在小词汇量连续语音识别数据库中获得了成功。2011
    年，深度神经网络在大词汇量连续语音识别上获得成功，取得了近 10 年来最大的突破。从此，基于深度神经网络的建模方式正式取代隐马尔可夫模型，成为主流的语音识别模型。


    ### 6.7.3 语音识别的基本原理 `../Text/contents.xhtml#z167`

    对于不同的语音识别过程，人们采用的识别方法和技术都不尽相同，但其基本原理大致相同，即将经过预处理后的语音信号送入特征提取模块进行特征处理，并利用声学模型和语言模型对语音信号进行解码后，输出识别结果。语音识别的基本原理如图
    6-9 所示。


    ![](img/cutq_133_8466_l.jpg)


    图 6-9　语音识别的基本原理


    ### 6.7.4 语音识别的应用 `../Text/contents.xhtml#z168`

    语音识别技术作为近年来最热门的一种先进的技术，涉及信号处理、语言、心理和计算机等多门学科。大量的语音识别产品已经进入市场和服务领域，被广泛地应用于智能终端、移动互联网应用、金融、电信、汽车、家居、教育等行业，推动了车载语音、智能客服、智能家居、语音课件等产品的迅猛发展。近年来，国内外智能语音厂商纷纷进行市场布局，提供了语音识别、语音合成、集成化产品、智能语音云平台等多样化能力服务，如手机端的语音助手
    Siri、微软小娜、电话机器人硅语、地图导航高德、智能音箱天猫精灵等，如图 6-10 所示，引发了汽车、家电、银行、家居、电信等多领域传统行业的应用创新。各行各业也纷纷以此为契机，大力创新发展与人工智能技术结合的产品及服务，下面介绍一些语音识别的典型应用。


    ![](img/cutq_134_16842_l.jpg)


    图 6-10　语言识别的使用场景


    #### 语音识别在移动设备中的应用

    在移动设备方面，智能语音语义在智能手机和可穿戴设备中的应用不尽相同。可穿戴设备虽然没有屏幕或屏幕较小，更适合语音交互，但是大多数可穿戴设备（如智能手表）是非生活必需品，本身销量就很有限，并没有太多交互需求，因此实际应用量较少。从效率上看，语音识别在智能手机和各类软件上的应用主要以输入、搜索和调取服务为主，输入信息量并不大。目前，除了重度文字使用者如作家、记者、编辑等，对语音输入和转化有着刚性需求之外，其他人使用语音识别的场景更多的还是在不方便打字时，如走路、开车等场景下。但是随着语音识别和交互体验的不断提升，会有越来越多的人在移动端使用语音识别。


    #### 语音识别在智能家居中的应用

    在智能家居方面，智能语音的应用主要围绕智能电视、音箱、家用机器人展开，通过支持语音识别的智能设备，如智能音箱、家庭媒体网关、机顶盒等，人们可以绕过复杂的按键操作，以语音控制的方式实现很多事情。


    （1）早上醒来，人们不再拿手机看时间，而是可以直接询问“现在几点了？”“今天天气怎样？”“外面是否在下雨？”等，家中的智能语音设备将会直接给出答案。

    （2）获取新闻，安排日程。通过智能语音设备，可以收看或收听新闻，也可以询问智能音箱“我今天的日程安排是什么？”，可以轻松开启一天的工作和生活。

    （3）当人们想看电视时，可以通过内置了智能语音功能的家庭媒体设备，以语音的方式选择想看、想听的内容；而如果不知道具体的名称，也可以通过“播放励志的电影”“听点音乐”等模糊地输入线索，找出相关的内容。

    （4）在智能语音设备出现之前，在电视上购物是非常麻烦的，有了智能语音设备，只要说出想要的产品，就能快速便捷地找到心仪的产品。

    （5）通过语音识别，可以轻松地控制智能电视，实现开机、关机、调高音量、调低音量等操作，还可以实现对家庭智能设备如灯泡、热水器、电饭煲、空调、电动窗帘等的控制。


    据统计，2019 年全球智能音箱出货量达到 1.4 亿台，预计到 2024 年，全球智能音箱的保有量将达到 6.4 亿台。


    #### 语音识别在企业客服和教育领域中的应用

    在企业客服方面，智能机器人客服的出现可以在很大程度上解决简单、重复性工作，帮助企业节省了人工和座席成本，提升了运营效率。由于客服问题主要聚焦在特定产品或单一垂直领域，因此需要企业拥有完整的结构化知识库，帮助机器人更好地查询和匹配问答内容。目前，按照行业平均水平，机器人客服可以解决
    70%左右的问题，其余由人工处理。由于业务量大、付费能力强、知识库完整，金融、电信、航空等大型公司成为智能机器人客服的主要应用群体。


    在教育领域，智能语音的应用包括中英文口语评测，以及部分教育机器人的交互功能。它在教育领域的价值表现在两个方面，一方面在于提高教师工作效率，另一方面在于帮助学生提升学习效果。通过大量语音数据的积累，以及和后端大数据分析、机器学习相结合，智能语音有望在机器辅助学习和自适应学习方面发挥重大作用，为教育行业带来颠覆性变革。科大讯飞作为智能语音和教育市场的龙头企业，为一些全国性考试提供技术支持，已经成为智能语音在中英文口语测评方面的领先者。2016
    年年底，科大讯飞与新东方联合成立东方讯飞，以新东方的数据和科大讯飞的技术推动教育、培训、学习的智能化进程，智能语音测评技术有望在其中发挥重要作用。


    #### 语音识别在医疗行业中的应用


