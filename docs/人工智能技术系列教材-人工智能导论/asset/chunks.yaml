    ReLU）。这3种改进的ReLU函数能够在一定程度上解决ReLU函数的问题，但是目前使用最多的还是ReLU激活函数。


    ### [4.1.7　损失函数](../Text/contents.xhtml#z99)


    损失函数是模型对数据拟合程度的反映，拟合得越差，损失函数的值就越大。与此同时，当损失函数比较大时，其对应的梯度也会随之增大，这样就可以加快变量的更新速度。


