    # [第7章　知识图谱](../Text/contents.xhtml#a7)


    【本章导读】


    知识图谱是一种揭示实体之间关系的语义网络，它以结构化的形式描述客观世界中概念、实体及其关系，是人工智能发展的核心驱动力之一。本章主要介绍知识图谱的相关概念及应用。


    【本章要点】


    1 知识图谱的定义、发展历史、类型和重要性


    2 知识表示


    3 知识建模


    4 知识抽取


    5 知识存储


    6 知识融合


    7 知识推理


    8 语义搜索


    9 问答系统


    ## [7.1　知识图谱简介](../Text/contents.xhtml#z174)


    知识图谱（Knowledge Graph）是一种揭示实体之间关系的语义网络。2012年5月17日，谷歌正式提出了知识图谱的概念，其初衷是优化搜索引擎返回的结果，增强用户搜索质量及体验。


    ### [7.1.1　知识图谱的定义](../Text/contents.xhtml#z175)


    知识图谱以结构化的形式描述客观世界中的概念、实体及其关系，将互联网的信息表达成更接近人类认知世界的形式，提供了一种更好地组织、管理和理解互联网海量信息的能力。知识图谱给互联网语义搜索带来了活力，同时在问答系统中显示出了强大作用，已经成为互联网知识驱动的智能应用的基础设施。知识图谱与大数据和深度学习一起，成为推动互联网和人工智能发展的核心驱动力之一。


    知识图谱不是一种新的知识表示方法，而是知识表示在工业界的大规模知识应用，它对互联网中可以识别的客观对象进行关联，以形成客观世界实体和实体关系的知识库，其本质上是一种语义网络，其中的节点代表实体或者概念，边代表实体/概念之间的各种语义关系。知识图谱的架构包括知识图谱自身的逻辑结构，以及构建知识图谱所采用的技术（体系）架构。知识图谱的逻辑结构可分为模式层与数据层，模式层在数据层之上，是知识图谱的核心，模式层存储的是经过提炼的知识，通常采用本体库来管理知识图谱的模式层，借助本体库对公理、规则和约束条件的支持能力，规范实体、关系以及实体的类型和属性等对象之间的联系。数据层主要由一系列的事实组成，而知识将以事实为单位进行存储。在知识图谱的数据层，知识以事实为单位存储在数据库中。如果以（实体，关系，实体）或者（实体，属性，性值）三元组作为事实的基本表达方式，则存储在数据库中的所有数据将构成庞大的实体关系网络，形成知识图谱。图7-1所示为知识图谱的表示。


    ![](Images/image_141_0_l.jpg)


    图7-1　知识图谱的表示


    ### [7.1.2　知识图谱的发展历史](../Text/contents.xhtml#z176)


    知识图谱的发展始于20世纪50年代，至今大致分为如下所述的3个发展阶段。


    1.第一阶段（1955年～1977年）


    第一阶段是知识图谱的起源阶段，在这一阶段中，研究者们提出了引文网络和语义网络的概念。1955年，尤金·加菲尔德（Eugene Garfield）提出了将引文索引应用于检索文献的思想。1965年，德瑞克·普赖斯（Derek
    Price）在Networks of Scientific Papers一文中指出引文网络与科学文献之间的引证关系，类似于当代科学发展的“地形图”，从此分析引文网络开始成为一种研究当代科学发展脉络的常用方法，进而形成了知识图谱的概念。1968年，奎林（Quillian）提出了语义网络，最初是作为人类联想记忆的一个明显公理模型，随后在人工智能中用于自然语言理解，表示命题信息。语义网络是一种以网络格式表达人类知识构造的形式，是人工智能程序运用的表示方式之一。


    2.第二阶段（1977年～2012年）


    第二阶段是知识图谱的发展阶段，语义网络得到快速发展，“知识本体”的研究开始成为计算机科学的一个重要领域，知识图谱吸收了语义网、本体在知识组织和表达方面的理念，使得知识更易于在计算机之间和计算机与人之间交换、流通和加工。1977年，在第五届国际人工智能会议上，美国计算机科学家阿曼德·菲根堡姆（Armand
    Feigenbaum）首次提出了知识工程的概念，知识工程是通过存储现存的知识来实现对用户的提问进行求解的系统，其中最典型和成功的知识工程的应用是基于规则的专家系统，此后以专家系统为代表的知识库系统开始被广泛研究和应用。1991年，美国计算机专家尼彻斯（Niches）等人在完成美国国防部高级研究计划局（Defense
    Advanced Research Projects Agency，DARPA）关于知识共享的科研项目中提出了一种构建智能系统的新思想，该智能系统由两部分组成，一部分是知识本体（Ontologies），另一部分是问题求解方法（Problem
    Solving Methods，PSMs）。知识本体是知识库的核心，涉及特定领域共有的知识结构，是静态的知识；PSMs涉及在相应领域的推理知识，是动态的知识，PSMs使用知识本体中的静态知识进行动态推理。自1998年万维网之父蒂姆·李（Tim
    Lee）提出语义网的概念，以及链接开放数据（Linked Open Data）的规模激增，互联网上散落了越来越多的知识元数据。2002年，机构知识库的概念被提出，知识表示和知识组织开始被深入研究，并广泛应用到各机构单位的资料整理工作中。


    3.第三阶段（2012年至今）


    第三阶段是知识图谱的繁荣阶段，2012年谷歌提出Google Knowledge Graph，知识图谱正式得名，谷歌通过知识图谱技术改善了搜索引擎性能。在人工智能的蓬勃发展下，知识图谱涉及的知识抽取、表示、融合、推理、问答等关键问题得到一定程度的解决和突破，知识图谱成为知识服务领域的一个新热点，受到国内外学者和工业界的广泛关注。随着互联网的蓬勃发展，信息量呈爆炸式增长，人们开始渴望更加快速、准确地获取所需的信息。知识图谱强调语义检索能力，关键技术包括从互联网的网页中抽取实体、属性及关系，旨在解决自动问答、个性化推荐和智能信息检索等方面的问题。目前，知识图谱技术正逐渐改变现有的信息检索方式，如谷歌、百度等主流搜索引擎都在采用知识图谱技术提供信息检索，一方面，通过推理实现概念检索（相对于现有的字符串模糊匹配方式而言）；另一方面，以图形化方式向用户展示经过分类整理的结构化知识，从而使人们从人工过滤网页寻找答案的模式中解脱出来。


    ### [7.1.3　知识图谱的类型](../Text/contents.xhtml#z177)


    目前，常用的知识图谱主要有以下4种类型。


    1.事实知识


    事实知识是知识图谱中最常见的知识类型。大部分事实是在描述实体的特定属性或者关系，例如，三元组（柏拉图，出生地，雅典）中的“出生地”就是其中一个属性。需要说明的是，有些实体的相关事实未必存在典型的属性或者关系与之对应，只能通过复杂的文本来描述。例如，“亚里士多德是西方古典哲学的集大成者”这一事实很难找到明确的属性加以陈述。例如，在“柏拉图继承和发展了苏格拉底的哲学思想”这一事实中，显然柏拉图与苏格拉底之间是有关系的，但这类关系无法简单概括。很多以实体为中心组织的知识图谱均富含事实知识，如DBpedia、Freebase及CN-DBpedia等。


    2.概念知识


    概念知识分为两类：一类是实体与概念之间的类属关系，另一类是子概念与父概念之间的子类关系。一个概念可能有子概念也可能有父概念，这使得全体概念构成层级体系。概念之间的层级关系是本体定义中最重要的部分，是构建知识图谱的第一步模式设计的重要内容。典型的概念知识图谱包括YAGO、Probase、WikiTaxonomy等。


    3.词汇知识'
  fmt: '

    在医疗行业，智能语音的主要应用是电子病历的录入。医生在临床诊断时使用专业麦克风可将诊断信息实时转换成文字，录入医院信息系统，方便后续查询和问答，提高医生的工作效率。由于专业性强、识别难度高，语音录入电子病历的应用最早主要是通过后台人工转写，而随着语音识别技术有了突破性进展，智能语音在医疗领域的应用才真正开始起步。科大讯飞正在和中国科学技术大学附属第一医院、上海交通大学附属第六人民医院南院以及北京大学口腔医院等医院合作，让医生使用定制麦克风，通过定向和降噪，先将语音转换成文字，再通过自然语言处理技术对文字进行结构化处理，医生只需做简单修改即可形成电子病历。目前，语音在医疗领域的应用还处于语音转文字的初级阶段，在实际使用中的部分识别错误还需要医生手动修改。不过，以语音为入口所积累的大量医疗数据会在未来产生巨大价值。此外，随着医疗技术和语音分析技术的进步，通过声音诊断病情也将成为可能。


    ## 5.语音识别在金融行业中的应用

    由于金融行业带有明显的客户服务属性，加上完整而庞大的业务及数据积累，因此金融行业成为智能语音的重要应用阵地。一些商业银行已经通过使用语音识别技术实现了语音导航、语音交易、业务办理等基础服务。除了在线客服和呼叫中心之外，智能语音技术还被应用于语音/语义分析、大数据挖掘、身份认证等领域。例如，先通过将语音数据转换为文本，而后建立语义索引、自动提取特征关键词，再对文本数据进行自动分类，生成结构化的客服大数据，为银行等金融机构提供客服质检、大数据挖掘与分析服务。此外，随着声纹识别技术的进步，智能语音也将被应用于金融领域的身份认证，通过语音认证实现业务办理、支付等功能，未来有望和指纹、虹膜、人脸等其他生物特征识别方式一起使用。


    ## 6.语音识别在军事领域中的应用

    在军事领域，语音识别技术也有着极为重要的应用价值和极其广阔的应用空间。一些语音识别技术就是着眼于军事活动而研发，并在军事领域首先应用、首获成效的。军事应用对语音识别系统的识别精度、响应时间、恶劣环境下的顽健性都提出了更高的要求。目前，语音识别技术已在军事指挥和自动化控制方面得以应用。例如，将语音识别技术应用于航空飞行控制，可快速提高作战效率，减轻飞行员的工作负担，利用语音输入来代替传统的手动操作控制各种开关和设备，可使飞行员把精力集中于对攻击目标的判断和完成其他操作上，以便更快地获得信息来发挥战术优势。


    ## 6.8　自然语言处理面临的问题和展望

    自然语言处理已经取得了丰硕成果，新的模型和方法不断被提出，并在多个行业得到成功应用；很多应用系统已经被广泛使用，并直接服务于社会生活的各个方面。然而，自然语言处理仍然面临着若干挑战，远没有达到像人一样理解语言的程度。


    ### 6.8.1　自然语言处理面临的问题

    自然语言处理当前面临的主要问题可以概括为如下5点。


    1.缺乏有效的知识表示和利用手段

    这里所说的知识，包括常识、领域知识、专家的经验知识和语言学知识等。对于大多数语言学知识和部分领域知识，可以在一定程度上从大规模训练数据中学习到，但是很多常识和专家经验往往是超出训练数据范围的。例如，“transformers”一词在政治领域中指改革者，在电力系统中指变压器，在儿童玩具中指变形金刚，而在自然语言处理领域中指转换器。其具体含义需要根据上下文背景和领域确定。又如，在鸡兔同笼问题求解中，关键常识是鸡有两条腿、兔子有四条腿。如果没有这种常识，这个问题就无法求解。对于人类而言，这些知识都是常备的；而对于机器而言，却难以从训练数据中归纳学习出来。


    2.缺乏未知语言现象的处理能力

    对于任何一个自然语言处理系统来说，总是会遇到未知的词汇、未知的语言结构和未知的语义表达，所谓“未知”即在训练样本和词典中未曾出现过。世界上的任何一种语言都在随着社会的发展而动态变化和演化，新的词汇、新的词义和新的句子结构都在不断出现，这些现象在微博、聊天和日常会话等非规范表述中尤为突出。例如，“李菊福”的意思是“有理有据使人信服”，“内牛满面”的意思是“泪流满面”，等等。因此，一个实用的自然语言处理系统必须具有较好的未知语言现象和噪声的处理能力。


    3.模型缺乏解释性和举一反三的能力

    尽管很多方法已经在自然语言处理的各种应用任务和关键技术研发中发挥了重要作用，但是这些方法毕竟采用的是以概率计算为基本手段的“赌博”思维，其性能表现严重依赖训练数据的质量和规模，当测试数据与训练数据差异较大时，模型的性能就会急剧下降，举一反三的能力更无从谈起。从纯粹的自然语言理解的角度而言，目前模型的性能还非常有限，尤其缺乏合理的解释性。对于给定的输入，模型在“黑箱”变换过程中产生错误和丢失数据的原因是什么？每一层变换意味着什么？最终结果的可靠性有多大？这些问题目前还没有合理的解释。


    4.缺乏交互学习和自主进化的能力

    自然语言处理系统在实际使用过程中会持续得到用户的反馈，包括对系统结果的修正、为系统增加新的词汇解释和补充新的标注数据等。传统的算法是将用户的反馈信息添加到训练数据中，重复进行“训练—测试”循环，以达到不断优化模型的目的。但是这种方法通常需要较长的迭代周期，难以有效利用实时的反馈信息。类比人的交互学习能力，一个智能系统应该具备在线交互学习的能力，即从用户与系统的交互过程中不断学习、补充和修正已有的知识，以达到模型自主进化的效果，而这个学习和进化的过程是终生的。


    5.单一模态信息处理的局限性

    目前的自然语言处理研究通常指以文本为处理对象的研究领域，一般不涉及其他模型信息的处理，如语音、图像和视频等信息，最多在某些场景下利用语音识别或文字识别作为前端预处理，各模块之间是独立的，与语音、图像和视频等信息处理过程是相脱节的，这严重违背了“类人智能”的基本前提。对于人类而言，通常是“眼观六路，耳听八方”，说出来的话，写出来的字，与看到的实际情况是一致的，而来自各个器官的信息是可以相互补充和验证的。试想，同样一句话借助不同的语调、重音和手势表达，意思很可能完全不同。因此，多模态信息的综合利用、协调处理是人工智能必然的发展方向。


    ### 6.8.2　自然语言处理的展望

    作为人工智能领域重要的研究方向和分支，自然语言处理不仅涉及词法、句法、篇章和语义等语言学本身的特点和规律，需要解决基础性关键问题，还需要面向实际应用构建机器翻译、自动文摘、情感分析、对话系统等特定任务的模型和方法。自然语言处理最终要能够解决人类语言理解的问题，使相关应用系统的性能达到更高的水平，满足个性化用户的需求，甚至真正做到像人一样理解语言。以下3方面将成为自然语言处理未来发展的重要方向。


    （1）与神经科学密切结合，探索人脑理解语言的神经基础，构建更加精准、可解释、可计算的语义表征和计算方法。

    人脑是如何表征和处理文本语义的？这是一道难解之题。相比于视觉、听觉等神经系统，目前人类对于人脑语言系统的了解还非常初步。近年来，数据驱动的自然语言处理方法在很多方面有效地弥补了传统方法的不足，但是数据驱动的方法存在很多固有的弊端，包括性能对训练数据的依赖性、模型的可解释性和常识的表示、获取和利用等问题。而人脑在小样本数据上的归纳、抽象和举一反三的能力恰恰是目前深度学习方法所不具备的，那么如何发现和模拟人脑语言理解的机理，构建类脑语言理解模型，是当前面临的一个挑战性问题。


    （2）构建高质量的基础资源和技术平台。

    无论是以符号逻辑和规则运算为基础的理性主义方法，还是数据驱动的经验主义方法，高质量的基础资源都是不可或缺的。这里所说的基础资源包括高质量、大规模的知识库，双语对照的平行句对和词典，面向特定任务的标注样本等。对于很多语言，尤其是小语种而言，可利用的数据资源十分稀少，甚至很多语言连与汉语对应的双语词典都没有，如波斯语与汉语、乌尔都语与汉语、达利语与汉语等，更别说大规模双语平行语料。高质量的关键技术工具无论对于哪种后续的应用任务都是不可或缺的，如命名实体识别工具、某些语言的形态分析工具等。


    （3）打通不同模态信息处理的壁垒，构建多模态信息融合的处理方法和模型。

    已有的语音、语言、图像和视频处理研究基本上是“井水不犯河水”，研究成果无法互相打通，而在真实情况下的应用任务中往往需要多模态信息的综合利用，从模拟人脑理解语言过程的角度而言，各类感知信息的综合利用也是情理之中的事情。


    综上所述，目前的自然语言处理技术已经得到了广泛应用，但其性能水平基本上还是停留在“处理”层面，远没有达到“理解”的水平，未来的任务艰巨而充满挑战。同时，中文以其独特的规律和特点给词性标注等问题带来了一定的困难，研究和开发以中文为核心的自然语言处理技术都应该作为重点。


    ## 6.9　小结

    （1）自然语言处理是指利用计算机对自然语言的形、音、义等信息进行处理，即对字、词、句、篇章的输入、输出、识别、分析、理解、生成等的操作和加工。

    （2）计算机处理自然语言的整个过程一般可以概括为语料预处理、特征工程、模型训练和指标评价4部分。

    （3）自然语言理解是指让计算机能够理解自然语言文本的意义，它可以分为语音分析、词法分析、句法分析、语义分析和语用分析5个层次。

    （4）自然语言生成是指让计算机按照一定的语法和语义规则生成自然语言文本，通俗来讲，它指对语义信息以人类可读的自然语言形式进行表达。

    （5）词法分析的主要目的是从句子中切分出单词，找出词汇的各个词素，从中获得单词的语言学信息并确定单词的词义。

    （6）句法分析的作用是确定构成句子的各个词、短语之间的关系以及各自在句子中的作用等，并将这些关系用层次结构加以表达，并规范句法结构。

    （7）语义分析的任务是把分析得到的句法成分与应用领域中的目标表示相关联，从而确定语言所表达的真正含义或概念。语义分析的方法主要有语义文法和格文法。

    （8）信息检索是信息按一定的方式进行加工、整理、组织并存储起来，并根据用户特定的需要将相关信息准确地查找出来的过程。

    （9）机器翻译是让计算机自动将源语言表示的语句转换为目标语言表示语句的过程，它有直译式翻译、中间语言式翻译和转换式翻译3种基本模式。统计机器翻译是目前主流的机器翻译方法，分为基于词的统计机器翻译和基于短语的统计机器翻译两种。

    （10）情感分析是从评论的文本中提取出评论的实体，以及评论者对该实体所表达的情感倾向和观点。根据处理文本颗粒度的不同，情感分析大致可以分为篇章级、句子级和属性级3个级别的任务。

    （11）语音识别是将人类语音中的词汇内容转换为计算机可读的输入，一般为可以理解的文本内容或者字符序列。语音识别的基本原理如下：先将经过预处理后的语音信号送入特征提取模块，再利用声学模型和语言模型对语音信号进行特征识别，最后输出识别结果。


