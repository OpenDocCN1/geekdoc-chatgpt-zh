- raw: "选择好特征后，就要训练使用的模型，并开始进行模型训练，其中包括参数的微调等。在模型训练的过程中要注意，有可能出现模型在训练集中表现很好，但在测试集中表现很差的问题。\n\
    \n4.指标评价\n\n常用的模型评价指标有错误率、精准度、准确率、召回率等，利用这些指标来评价模型的优劣程度，以选择最佳的模型，进而输出最终的自然语言处理的结果。\n\
    \n## [6.2　自然语言处理的组成](../Text/contents.xhtml#z141)\n\n从自然语言的角度出发，自然语言处理大致可以分为以下两个部分。\n\
    \n1.自然语言理解\n\n自然语言理解是指让计算机能够理解自然语言文本的意义。语言被表示成一连串的文字符号或者一串声流，其内部是一个层次化的结构。一个由文字表达的句子的构成层次是词素→词或词形→词组→句子，由声音表达的句子的构成层次则是音素→音节→音词→音句，其中的每个层次都受到语法规则的约束，因此语言的处理过程也应当是一个层次化的过程。\n\
    \n语言学是以人类语言为研究对象的学科，它的研究范围包括语言的结构、语言的运用、语言的社会功能和历史发展，以及其他与语言有关的问题。自然语言理解不仅需要语言学方面的知识，还需要与所要理解的话题相关的背景知识。它是一个综合的系统工程，又包含了很多细分的学科，有代表声音的音系学，代表构词法的词态学，代表语句结构的句法学，代表理解的语义学和语用学。\n\
    \n2.自然语言生成\n\n自然语言生成与自然语言理解恰恰相反，它是按照一定的语法和语义规则生成自然语言文本。即对语义信息以人类可读的自然语言形式进行表达，该过程主要包含3个阶段：文本规划，即完成结构化数据中的基础内容规划；语句规划，即从结构化数据中组合语句来表达信息流；实现，即产生语法通顺的语句来表达文本。\n\
    \n## [6.3　自然语言理解](../Text/contents.xhtml#z142)\n\n自然语言理解是使用自然语言同计算机进行通信的技术，又称计算语言学。它是语言信息处理的一个分支，也是人工智能的核心课题之一。\n\
    \n### [6.3.1　自然语言理解的层次](../Text/contents.xhtml#z143)\n\n从微观上讲，自然语言理解是指从自然语言到机器内部的映射；从宏观上看，自然语言是指机器能够执行人类所期望的某些语言功能。自然语言理解中至少有3个主要问题；第一，计算机需要具备大程序量的人类知识，语言动作描述的是复杂世界中的关系，这些关系的知识必须是理解系统的一部分；第二，语言是基于模式的，音素构成单词，单词组成短语和句子，音素、单词和句子的顺序不是随机的，没有对这些元素的规范使用，就不可能达成交流；第三，语言动作是主体的产物，主体或者是人，或者是计算机，主体处在个体层面和社会层面的复杂环境中，语言动作都是有其目的的。\n\
    \n自然语言的理解和分析是一个层次化的过程，许多语言学家把这一过程分为如下5个层次。\n\n1.语音分析\n\n语音分析是指根据人类的发音规则，以及人们的日常习惯发音，从语音传输数据中区分出一个个独立的音节或者音调，再根据对应的发音规则找出不同音节所对应的词素或词，进而由词到句，识别出人所说的一句话的完整信息，将其转化为对应的文字，这也正是语音识别的核心。\n\
    \n2.词法分析\n\n词法指词位的构成和变化的规则，主要研究词自身的结构与性质。词法分析的主要目的是从句子中切分出单词，找出词汇的各个词素，从中获得单词的语言学信息并确定单词的词义。\n\
    \n3.句法分析\n\n句法是指组词成句的规则，描述句子的结构，以及词之间的依赖关系。\n\n4.语义分析\n\n句法分析后一般还不能理解所要分析的句子，至少需要进行语义分析。语义分析是把分析得到的句法成分与应用领域中的目标相关联，从而确定语音所表达的真正含义或概念。\n\
    \n5.语用分析\n\n语用就是研究语言所存在的外界环境对语言使用所产生的影响。它描述了语言的环境知识，以及语言与语言使用者在某个给定语言环境中的关系。关注语用信息的自然语言处理系统更侧重于讲话者/听话者模型的设定，而不是处理嵌入到给定话语中的结构信息。学者们提出了多种语言环境的计算模型，描述讲话者及其通信目的、听话者及其对说话者信息的重组方式。构建这些模型的难点在于，如何把自然语言处理的不同方面以及各种不确定的生理、心理、社会及文化等背景因素集中到一个完整连贯的模型中。\n\
    \n虽然这些分析层次看上去是自然而然的且符合心理学的规律，但是它们在某种程度上是强加在语言上的人工划分。它们之间广泛交叉，即使很底层的语调和节奏变化也会对说话的意思产生影响，如讽刺的使用。这种交叉在语法和语义的关系中体现得非常明显，虽然沿着这些分界线进行某些划分似乎很有必要，但是确切的分界线很难定义。例如，类似“They\
    \ are eating apples”这样的句子有多种解析，只有联系上下文的意思才能确定其具体含义。\n\n### [6.3.2　词法分析](../Text/contents.xhtml#z144)\n\
    \n词法分析是理解单词的基础，其主要目的是从句子中切分出单词，找出词汇的各个词素，从中获得单词的语言学信息并确定单词的词义，如unchangeable是由un-change-able构成的，其词义由这3个部分构成。不同的语言对词法分析有不同的要求，例如，英语和汉语就有较大的差距。在英语等语言中，因为单词之间是以空格自然分开的，切分一个单词很容易，所以找出句子的一个个词汇就很方便。但是由于英语单词有词性、数、时态、派生及变形等变化，要找出各个词素就复杂得多，需要对词尾或词头进行分析。例如，对于importable，它可以是im-port-able或import-able，这是因为im、port、able这3个都是词素。\n\
    \n词法分析可以从词素中获得许多有用的语言学信息，如英语中构成词尾的词素“s”通常表示名词复数或动词第三人称单数，“ly”通常是副词的后缀，而“ed”通常是动词的过去分词等，这些信息对于句法分析也是非常有用的。一个词可有许多种派生、变形，如work，可变化出works、worked、working、worker、workable等。对于这些派生的、变形的词，如果将其全放入词典，则将是非常庞大的，而它们的词根只有一个。自然语言理解系统中的电子词典一般只存放词根，并支持词素分析，这样可以大大压缩电子词典的存储空间。\n\
    \n下面是一个英语词法分析的算法，它可以对那些按英语语法规则变化的英语单词进行分析。\n\n```\nrepeat  \nlook for study in\
    \ dictionary  \n  if not found  \n  then modify the study  \nUntil study is found\
    \ no further modificatiob possidle\n```\n\n其中，study是一个变量，初始值就是当前的单词。例如，对于单词catches、ladies可以做如下分析。\n\
    \n```\ncatches  studies      //词典中查不到 \ncatche   studie       //修改1：去掉s \ncatch\
    \    studi        //修改2：去掉e \nstudy                 //修改3：把i变成y\n```\n\n在修改2的时候就可以找到catch，在修改3的时候就可以找到study。\n\
    \n英语词法分析的难度在于词义判断，因为单词往往有多种解释，仅仅依靠查词典常常无法判断。例如，单词“diamond”有3种可能的解释：菱形，边长均相等的四边形；棒球场；钻石。要想判定单词的词义，只能依靠对句子中其他相关单词和词组的分析。例如，句子“John\
    \ saw Slisan's diamond shining from across the room.”中“diamond”的词义必定是钻石，因为只有钻石才能闪光，而菱形和棒球场是不闪光的。\n\
    \n作为对照，汉语中的每个字就是一个词素，所以汉语词法分析的特点是要找出各个词素相当容易，但要切分出各个词非常困难。不仅需要构词的知识，还需要解决可能遇到的切分歧义。例如，“下雨天留客天留我不留”，可以是“下雨天留客，天留我不留”，也可以是“下雨天，留客天，留我不？留”。\n\
    \n### [6.3.3　句法分析](../Text/contents.xhtml#z145)\n\n句法是语言在长期发展过程中形成的、全体成员必须共同遵守的规则。\n\
    \n句法分析也称语法解析，是对句子和短语的结构进行分析，找出词、短语等的相互关系及各自在句子中的作用等，并以一种层次结构加以表达。层次结构可以反映从属关系、直接成分关系，也可以反映语法功能关系。例如，“他来晚了”，这里“他”是主语，“来”是谓语，“晚了”是补语。\n\
    \n句法分析是自然语言处理的核心，是对语言进行深层次理解的基础。在自然语言处理中，机器翻译是其中一个重要的课题，也是自然语言处理主要的应用领域，而句法分析是机器翻译的核心。\n\
    \n1.句法分析的作用\n\n一般来说，句法分析主要有以下两个作用。\n\n（1）对句子或短语结构进行分析，以确定构成句子的各个词、短语之间的关系以及各自在句子中的作用等，并将这些关系用层次结构加以表达。\n\
    \n（2）对句法结构进行规范化。在对一个句子进行分析的过程中，如果把分析句子各成分间的关系的推导过程用树形图表示出来，则这种图称为句法分析树。句法分析是由专门设计的分析器进行的，分析过程就是构造句法树的过程，即将每个输入的合法语句转换为一棵句法分析树。\n\
    \n2.句法分析的难点\n\n一般来说，句法分析主要有以下两个难点。\n\n（1）歧义：自然语言区别于人工语言的一个显著特点就是它存在大量的歧义现象。人类自身可以依靠大量的先验知识有效地消除各种歧义，而机器由于在知识表示和获取方面存在严重不足，很难像人类那样进行句法消歧。\n\
    \n（2）搜索空间：句法分析是一个极为复杂的任务，候选解个数随句子增多呈指数级增长，搜索空间巨大。因此必须设计出合适的解码器，以确保能够在合适的时间内搜索到最优解。\n\
    \n3.句法分析的方法\n\n句法分析是从单词串中得到句法结构的过程，而实现该过程的工具或程序被称为句法分析器。句法分析的种类很多，这里根据其侧重目标将其分为完全句法分析和局部句法分析两种。两者的区别在于，完全句法分析以获取整个句子的句法结构为目的；而局部句法分析只关注局部的一些成分，如常用的依存句法分析就是一种局部分析方法。\n\
    \n句法分析中所用的方法主要分为两类：基于规则的方法和基于统计的方法。基于规则的方法在处理大规模真实文本时，会存在语法规则覆盖有限、系统可迁移差等缺陷。随着大规模标注树库的建立，基于统计学习模型的句法分析方法开始兴起，句法分析器的性能不断提高，最典型的就是风靡于20世纪70年代的概率上下文无关文法，它在句法分析领域得到了极大的应用，也是现在句法分析中常用的方法。基于统计的方法本质上是一种面向候选树的评价方法，它会给正确的句法树赋予一个较高的分值，而给不合理的句法树赋予一个较低的分值，这样就可以用候选句法树的分值来消除歧义。\n\
    \n目前使用最多的树库是来自美国宾夕法尼亚大学的英文宾州树库（PTB）。中文树库建设较晚，比较著名的有中文宾州树库（CTB）、清华树库（TCT）、Sinica树库。其中，CTB是美国宾夕标注的汉语句法树库，也是目前绝大多数的中文句法分析研究的基准语料库。TCT是清华大学计算机系智能技术与系统国家重点实验室人员从汉语平衡语料库中提取出100万规模的汉字语料文本，经过自动句法分析和人工校对，形成的高质量的标注有完整句法结构的中文句法树语料库。Sinica树库是从中文句平衡语料库中抽取句子，经过计算机自动分析成句法树，并加以人工修改、检验后所得的成果。不同的树库有着不同的标记体系，使用时切记使用一种树库的句法分析器，并使用其他树库的标记体系来解释。\n\
    \n4.句法分析的评测方法\n\n句法分析评测的主要任务是评测句法分析器生成的树结构与手工标注的树结构之间的相似程度。其主要考虑两方面的性能：满意度和效率。其中，满意度是指测试句法分析器是否适合或胜任某个特定的自然语言处理任务；而效率主要用于对比句法分析器的运行时间。\n\
    \n目前主流的句法分析评测方法是帕斯瓦尔评测体系，它是一种粒度比较适中、较为理想的评价方法，主要指标有准确率、召回率、交叉括号数。其中，准确率表示分析正确的短语个数在句法分析结果中所占的比例，即分析结果中与标准句法树中相匹配的短语个数占分析结果中所有短语个数的比例；召回率表示分析得到的正确短语个数占标准分析树全部短语个数的比例；交叉括号表示分析得到的某一个短语的覆盖范围与标准句法分析结果的某个短语的覆盖范围存在重叠又不存在包含关系，交叉括号数即此类短语的数量。\n\
    \n### [6.3.4　语义分析](../Text/contents.xhtml#z146)\n\n句法分析完成后，不等于计算机已经理解了该语句，还需要对语义进行解释。语义分析的任务是把分析得到的句法成分与应用领域中的目标表示相关联，从而确定语言所表达的真正含义或概念，即弄清楚“干了什么”“谁干的”“这个行为的原因和结果是什么”以及“这个行为发生的时间、地点及其所用的工具或方法”等。与句法分析相比，语义分析侧重语义而非语法，它存在以下3个功能。\n\
    \n（1）词义消歧，即确定一个词在语境中的含义，而不是简单的词性。\n\n（2）语义角色标注，即标注句子中的谓语与其他成分的关系。\n\n（3）语义依存分析，即分析句子中词语之间的语义关系。\n\
    \n简单的做法就是依次使用独立的句法分析程序和语义解释程序。这样做可能的后果是，在很多情况下句法分析和语义分析相分离，不结合语义就无法确定句法结构。为了有效地实现语义分析，并能与句法分析紧密结合，目前已经研究出了多种语义分析的方法，常见的有语义文法和格文法。\n\
    \n1.语义文法\n\n语义文法将文法知识和语义知识组合起来，以统一的方式定义为文法规则集。语义文法是上下文无关的，形态上与面向自然语言的常见文法相同，只是不采用NP、VP、PP等表示句法成分的非终结符，而是使用能表示语义类型的符号，从而可以定义包含语义信息的文法规则。\n\
    \n语义文法是在上下文无关文法的基础上，将“名词短语”“动词短语”“名词”等不含有语义信息的纯语法类别用所讨论领域的专门信息，如“山”“水”“动物”等具有很强语义约束的语义类别来代替。利用语义文法进行语义分析，就可以排除诸如“论文收到教授”这类无意义的句子。例如，下面给出一个关于海军舰只的语义文法。\n\
    \n```\nS→what is SHIP-PROPERTY of SHIP? \nSHIP-PROPERTY→the SHIP-PROP/SHIP-PROP\
    \ \nSHIP-PROP→Speed | length | draft | beam | type\n```\n\n其在右部指定\"What is\"必须与SHIP-PROPERTY联合构成疑问句，这种单词间的约束关系显然表示了语义信息。用语义文法分析语句的方法与普通的句法分析文法类同。\n\
    \n2.格文法\n\n格文法是以句子的中心动词为主导，并用格来表示其他成分与此中心动词之间的语义关系的一种描述方法。它主要是为了找出动词和与它所处的结构关系中的名词的语义关系，同时涉及动词或动词短语与其他各种名词短语之间的关系。格文法的特点是允许以动词为中心构造分析结果，尽管文法规则只描述句法，但是分析结果产生的结构对应于语义关系，而非严格的句法关系。\n\
    \n“格”这个词来源于传统语法，但它与传统语法中的格有着本质不同。在传统语法中，格仅表示一个词或短语在句子中的功能，如主格、宾格等，反映的也只是词尾的变化规则，故称为表层格。在格文法中，一个语句包含的名词词组和介词词组均以它们与句子中动词的关系来表示，称为格。格表示的是语义方面的关系，反映的是句子中包含的思想、观念等，称为深层格。和短语结构文法相比，格文法对于句子的深层语义有着更好的描述。无论句子的表层形式如何变化，如主动语态变为被动语态、陈述句变为疑问句、肯定句变为否定句等，对于其底层的语义关系，各名词成分所代表的格关系不会发生相应的变化。\n\
    \n“格”是一个一般的概念，相对于中心动词的不同语义关系，格可以分为许多种。例如，在句子“John gave the book to Sally.”中，相对于中心动词gave，John是这个行为的发出者，称为动作格；the\
    \ book是行为作用的对象，称为受动格；Sally是行为作用对象所到达的目标，称为目标格。\n\n## [6.4　信息检索](../Text/contents.xhtml#z147)\n\
    \n信息检索是自然语言处理领域的一个重要方向，它是指信息按一定的方式组织起来，并根据信息用户的需要查找有关信息的过程和技术。\n\n### [6.4.1　信息检索简介](../Text/contents.xhtml#z148)\n\
    \n信息检索可从广义与狭义两个方面进行理解，狭义的信息检索仅指信息查询，也就是用户根据自身的需要，通过一定的方法，借助检索工具，从信息集合中找出所需信息的过程；广义的信息检索是信息按一定的方式进行加工、整理、组织并存储起来，再根据用户特定的需要将相关信息准确地查找出来的过程。一般情况下，信息检索指的就是广义的信息检索。\n\
    \n信息检索是指在信息检索网络或终端上，使用特定的检索指令、检索词和检索策略，从信息检索系统的数据库中检索出所需要的信息，再由终端设备显示、下载和打印的过程。此处，信息检索的本质没有改变，改变的只是信息的媒体形式、存储方式和匹配方法。\n\
    \n### [6.4.2　信息检索的发展历程](../Text/contents.xhtml#z149)\n\n信息检索是在计算机技术和通信技术发展的基础上建立起来的。它诞生于20世纪50年代，发展于20世纪80年代中期，20世纪90年代后随着互联网技术的发展而进入一个崭新的时期。回顾计算机文献信息检索的发展历程，大致可以概括为以下3个阶段。\n\
    \n1.批量处理阶段\n\n1954年，美国海军武器实验站图书馆在一台电子管计算机上建立了世界上第一个信息检索系统。20世纪50年代末，IBM公司利用一台IBM\
    \ 650计算机成功地编制出关键词索引，并建立了世界上第一个“定题情报检索”系统，为用户定期检索和提供特定主题的新到文献（脱机检索、批量处理），并很快得到了推广应用。\n\
    \n2.联机检索阶段\n\n20世纪60年代，信息检索进入了实用和全面发展阶段。20世纪60年代末，数据通信网络出现，大容量计算机分时系统和强功能检索软件研制成功，使脱机检索发展到联机检索并迅速得到了推广。20世纪70～80年代，联机检索得到迅速发展，一些联机检索系统开始向公众提供商业性服务，许多世界著名的联机检索系统相继投入商业性运营。\n\
    \n3.网络系统阶段\n\n20世纪90年代，联机检索的发展进入了一个重要的转折时期。随着互联网的迅速发展及超文本技术的出现，基于客户机/服务器的检索软件的开发，实现了将原来的主机系统转移到服务器上，使客户机/服务器联机检索模式开始取代以往的终端/主机结构，成为联机检索的发展趋势，使联机检索进入了又一个崭新的时期。"
  fmt: "\n选择好特征后，就要训练使用的模型，并开始进行模型训练，其中包括参数的微调等。在模型训练的过程中要注意，有可能出现模型在训练集中表现很好，但在测试集中表现很差的问题。\n\
    \n### 4. 指标评价\n\n常用的模型评价指标有错误率、精准度、准确率、召回率等，利用这些指标来评价模型的优劣程度，以选择最佳的模型，进而输出最终的自然语言处理的结果。\n\
    \n## 6.2 自然语言处理的组成\n\n从自然语言的角度出发，自然语言处理大致可以分为以下两个部分。\n\n1.自然语言理解\n\n自然语言理解是指让计算机能够理解自然语言文本的意义。语言被表示成一连串的文字符号或者一串声流，其内部是一个层次化的结构。一个由文字表达的句子的构成层次是词素→词或词形→词组→句子，由声音表达的句子的构成层次则是音素→音节→音词→音句，其中的每个层次都受到语法规则的约束，因此语言的处理过程也应当是一个层次化的过程。\n\
    \n语言学是以人类语言为研究对象的学科，它的研究范围包括语言的结构、语言的运用、语言的社会功能和历史发展，以及其他与语言有关的问题。自然语言理解不仅需要语言学方面的知识，还需要与所要理解的话题相关的背景知识。它是一个综合的系统工程，又包含了很多细分的学科，有代表声音的音系学，代表构词法的词态学，代表语句结构的句法学，代表理解的语义学和语用学。\n\
    \n2.自然语言生成\n\n自然语言生成与自然语言理解恰恰相反，它是按照一定的语法和语义规则生成自然语言文本。即对语义信息以人类可读的自然语言形式进行表达，该过程主要包含3个阶段：文本规划，即完成结构化数据中的基础内容规划；语句规划，即从结构化数据中组合语句来表达信息流；实现，即产生语法通顺的语句来表达文本。\n\
    \n## 6.3 自然语言理解\n\n自然语言理解是使用自然语言同计算机进行通信的技术，又称计算语言学。它是语言信息处理的一个分支，也是人工智能的核心课题之一。\n\
    \n### 6.3.1 自然语言理解的层次\n\n从微观上讲，自然语言理解是指从自然语言到机器内部的映射；从宏观上看，自然语言是指机器能够执行人类所期望的某些语言功能。自然语言理解中至少有3个主要问题；第一，计算机需要具备大程序量的人类知识，语言动作描述的是复杂世界中的关系，这些关系的知识必须是理解系统的一部分；第二，语言是基于模式的，音素构成单词，单词组成短语和句子，音素、单词和句子的顺序不是随机的，没有对这些元素的规范使用，就不可能达成交流；第三，语言动作是主体的产物，主体或者是人，或者是计算机，主体处在个体层面和社会层面的复杂环境中，语言动作都是有其目的的。\n\
    \n自然语言的理解和分析是一个层次化的过程，许多语言学家把这一过程分为如下5个层次。\n\n1.语音分析\n\n语音分析是指根据人类的发音规则，以及人们的日常习惯发音，从语音传输数据中区分出一个个独立的音节或者音调，再根据对应的发音规则找出不同音节所对应的词素或词，进而由词到句，识别出人所说的一句话的完整信息，将其转化为对应的文字，这也正是语音识别的核心。\n\
    \n2.词法分析\n\n词法指词位的构成和变化的规则，主要研究词自身的结构与性质。词法分析的主要目的是从句子中切分出单词，找出词汇的各个词素，从中获得单词的语言学信息并确定单词的词义。\n\
    \n3.句法分析\n\n句法是指组词成句的规则，描述句子的结构，以及词之间的依赖关系。\n\n4.语义分析\n\n句法分析后一般还不能理解所要分析的句子，至少需要进行语义分析。语义分析是把分析得到的句法成分与应用领域中的目标相关联，从而确定语音所表达的真正含义或概念。\n\
    \n5.语用分析\n\n语用就是研究语言所存在的外界环境对语言使用所产生的影响。它描述了语言的环境知识，以及语言与语言使用者在某个给定语言环境中的关系。关注语用信息的自然语言处理系统更侧重于讲话者/听话者模型的设定，而不是处理嵌入到给定话语中的结构信息。学者们提出了多种语言环境的计算模型，描述讲话者及其通信目的、听话者及其对说话者信息的重组方式。构建这些模型的难点在于，如何把自然语言处理的不同方面以及各种不确定的生理、心理、社会及文化等背景因素集中到一个完整连贯的模型中。\n\
    \n虽然这些分析层次看上去是自然而然的且符合心理学的规律，但是它们在某种程度上是强加在语言上的人工划分。它们之间广泛交叉，即使很底层的语调和节奏变化也会对说话的意思产生影响，如讽刺的使用。这种交叉在语法和语义的关系中体现得非常明显，虽然沿着这些分界线进行某些划分似乎很有必要，但是确切的分界线很难定义。例如，类似“`They\
    \ are eating apples`”这样的句子有多种解析，只有联系上下文的意思才能确定其具体含义。\n\n### 6.3.2 词法分析\n\n词法分析是理解单词的基础，其主要目的是从句子中切分出单词，找出词汇的各个词素，从中获得单词的语言学信息并确定单词的词义，如`unchangeable`是由`un-change-able`构成的，其词义由这3个部分构成。不同的语言对词法分析有不同的要求，例如，英语和汉语就有较大的差距。在英语等语言中，因为单词之间是以空格自然分开的，切分一个单词很容易，所以找出句子的一个个词汇就很方便。但是由于英语单词有词性、数、时态、派生及变形等变化，要找出各个词素就复杂得多，需要对词尾或词头进行分析。例如，对于`importable`，它可以是`im-port-able`或`import-able`，这是因为`im`、`port`、`able`这3个都是词素。\n\
    \n词法分析可以从词素中获得许多有用的语言学信息，如英语中构成词尾的词素“`s`”通常表示名词复数或动词第三人称单数，“`ly`”通常是副词的后缀，而“`ed`”通常是动词的过去分词等，这些信息对于句法分析也是非常有用的。一个词可有许多种派生、变形，如`work`，可变化出`works`、`worked`、`working`、`worker`、`workable`等。对于这些派生的、变形的词，如果将其全放入词典，则将是非常庞大的，而它们的词根只有一个。自然语言理解系统中的电子词典一般只存放词根，并支持词素分析，这样可以大大压缩电子词典的存储空间。\n\
    \n下面是一个英语词法分析的算法，它可以对那些按英语语法规则变化的英语单词进行分析。\n\n```\nrepeat  \nlook for study in\
    \ dictionary  \n  if not found  \n  then modify the study  \nUntil study is found\
    \ no further modificatiob possidle\n```\n\n其中，`study`是一个变量，初始值就是当前的单词。例如，对于单词`catches`、`ladies`可以做如下分析。\n\
    \n```\ncatches  studies      //词典中查不到 \ncatche   studie       //修改1：去掉s \ncatch\
    \    studi        //修改2：去掉e \nstudy                 //修改3：把i变成y\n```\n\n在修改2的时候就可以找到`catch`，在修改3的时候就可以找到`study`。\n\
    \n英语词法分析的难度在于词义判断，因为单词往往有多种解释，仅仅依靠查词典常常无法判断。例如，单词“`diamond`”有3种可能的解释：菱形，边长均相等的四边形；棒球场；钻石。要想判定单词的词义，只能依靠对句子中其他相关单词和词组的分析。例如，句子“`John\
    \ saw Slisan's diamond shining from across the room.`”中“`diamond`”的词义必定是钻石，因为只有钻石才能闪光，而菱形和棒球场是不闪光的。\n\
    \n作为对照，汉语中的每个字就是一个词素，所以汉语词法分析的特点是要找出各个词素相当容易，但要切分出各个词非常困难。不仅需要构词的知识，还需要解决可能遇到的切分歧义。例如，“下雨天留客天留我不留”，可以是“下雨天留客，天留我不留”，也可以是“下雨天，留客天，留我不？留”。\n\
    \n### 6.3.3 句法分析\n\n句法是语言在长期发展过程中形成的、全体成员必须共同遵守的规则。\n\n句法分析也称语法解析，是对句子和短语的结构进行分析，找出词、短语等的相互关系及各自在句子中的作用等，并以一种层次结构加以表达。层次结构可以反映从属关系、直接成分关系，也可以反映语法功能关系。例如，“他来晚了”，这里“他”是主语，“来”是谓语，“晚了”是补语。\n\
    \n句法分析是自然语言处理的核心，是对语言进行深层次理解的基础。在自然语言处理中，机器翻译是其中一个重要的课题，也是自然语言处理主要的应用领域，而句法分析是机器翻译的核心。\n\
    \n1.句法分析的作用\n\n一般来说，句法分析主要有以下两个作用。\n\n（1）对句子或短语结构进行分析，以确定构成句子的各个词、短语之间的关系以及各自在句子中的作用等，并将这些关系用层次结构加以表达。\n\
    \n（2）对句法结构进行规范化。在对一个句子进行分析的过程中，如果把分析句子各成分间的关系的推导过程用树形图表示出来，则这种图称为句法分析树。句法分析是由专门设计的分析器进行的，分析过程就是构造句法树的过程，即将每个输入的合法语句转换为一棵句法分析树。\n\
    \n2.句法分析的难点\n\n一般来说，句法分析主要有以下两个难点。\n\n（1）歧义：自然语言区别于人工语言的一个显著特点就是它存在大量的歧义现象。人类自身可以依靠大量的先验知识有效地消除各种歧义，而机器由于在知识表示和获取方面存在严重不足，很难像人类那样进行句法消歧。\n\
    \n（2）搜索空间：句法分析是一个极为复杂的任务，候选解个数随句子增多呈指数级增长，搜索空间巨大。因此必须设计出合适的解码器，以确保能够在合适的时间内搜索到最优解。\n\
    \n3.句法分析的方法\n\n句法分析是从单词串中得到句法结构的过程，而实现该过程的工具或程序被称为句法分析器。句法分析的种类很多，这里根据其侧重目标将其分为完全句法分析和局部句法分析两种。两者的区别在于，完全句法分析以获取整个句子的句法结构为目的；而局部句法分析只关注局部的一些成分，如常用的依存句法分析就是一种局部分析方法。\n\
    \n句法分析中所用的方法主要分为两类：基于规则的方法和基于统计的方法。基于规则的方法在处理大规模真实文本时，会存在语法规则覆盖有限、系统可迁移差等缺陷。随着大规模标注树库的建立，基于统计学习模型的句法分析方法开始兴起，句法分析器的性能不断提高，最典型的就是风靡于20世纪70年代的概率上下文无关文法，它在句法分析领域得到了极大的应用，也是现在句法分析中常用的方法。基于统计的方法本质上是一种面向候选树的评价方法，它会给正确的句法树赋予一个较高的分值，而给不合理的句法树赋予一个较低的分值，这样就可以用候选句法树的分值来消除歧义。\n\
    \n目前使用最多的树库是来自美国宾夕法尼亚大学的英文宾州树库（`PTB`）。中文树库建设较晚，比较著名的有中文宾州树库（`CTB`）、清华树库（`TCT`）、`Sinica`树库。其中，`CTB`是美国宾夕标注的汉语句法树库，也是目前绝大多数的中文句法分析研究的基准语料库。`TCT`是清华大学计算机系智能技术与系统国家重点实验室人员从汉语平衡语料库中提取出100万规模的汉字语料文本，经过自动句法分析和人工校对，形成的高质量的标注有完整句法结构的中文句法树语料库。`Sinica`树库是从中文句平衡语料库中抽取句子，经过计算机自动分析成句法树，并加以人工修改、检验后所得的成果。不同的树库有着不同的标记体系，使用时切记使用一种树库的句法分析器，并使用其他树库的标记体系来解释。\n\
    \n4.句法分析的评测方法\n\n句法分析评测的主要任务是评测句法分析器生成的树结构与手工标注的树结构之间的相似程度。其主要考虑两方面的性能：满意度和效率。其中，满意度是指测试句法分析器是否适合或胜任某个特定的自然语言处理任务；而效率主要用于对比句法分析器的运行时间。\n\
    \n目前主流的句法分析评测方法是帕斯瓦尔评测体系，它是一种粒度比较适中、较为理想的评价方法，主要指标有准确率、召回率、交叉括号数。其中，准确率表示分析正确的短语个数在句法分析结果中所占的比例，即分析结果中与标准句法树中相匹配的短语个数占分析结果中所有短语个数的比例；召回率表示分析得到的正确短语个数占标准分析树全部短语个数的比例；交叉括号表示分析得到的某一个短语的覆盖范围与标准句法分析结果的某个短语的覆盖范围存在重叠又不存在包含关系，交叉括号数即此类短语的数量。\n\
    \n### 6.3.4 语义分析\n\n句法分析完成后，不等于计算机已经理解了该语句，还需要对语义进行解释。语义分析的任务是把分析得到的句法成分与应用领域中的目标表示相关联，从而确定语言所表达的真正含义或概念，即弄清楚“干了什么”“谁干的”“这个行为的原因和结果是什么”以及“这个行为发生的时间、地点及其所用的工具或方法”等。与句法分析相比，语义分析侧重语义而非语法，它存在以下3个功能。\n\
    \n（1）词义消歧，即确定一个词在语境中的含义，而不是简单的词性。\n\n（2）语义角色标注，即标注句子中的谓语与其他成分的关系。\n\n（3）语义依存分析，即分析句子中词语之间的语义关系。\n\
    \n简单的做法就是依次使用独立的句法分析程序和语义解释程序。这样做可能的后果是，在很多情况下句法分析和语义分析相分离，不结合语义就无法确定句法结构。为了有效地实现语义分析，并能与句法分析紧密结合，目前已经研究出了多种语义分析的方法，常见的有语义文法和格文法。\n\
    \n1.语义文法\n\n语义文法将文法知识和语义知识组合起来，以统一的方式定义为文法规则集。语义文法是上下文无关的，形态上与面向自然语言的常见文法相同，只是不采用`NP`、`VP`、`PP`等表示句法成分的非终结符，而是使用能表示语义类型的符号，从而可以定义包含语义信息的文法规则。\n\
    \n语义文法是在上下文无关文法的基础上，将“名词短语”“动词短语”“名词”等不含有语义信息的纯语法类别用所讨论领域的专门信息，如“山”“水”“动物”等具有很强语义约束的语义类别来代替。利用语义文法进行语义分析，就可以排除诸如“论文收到教授”这类无意义的句子。例如，下面给出一个关于海军舰只的语义文法。\n\
    \n```\nS→what is SHIP-PROPERTY of SHIP? \nSHIP-PROPERTY→the SHIP-PROP/SHIP-PROP\
    \ \nSHIP-PROP→Speed | length | draft | beam | type\n```\n\n其在右部指定\"What is\"必须与`SHIP-PROPERTY`联合构成疑问句，这种单词间的约束关系显然表示了语义信息。用语义文法分析语句的方法与普通的句法分析文法类同。\n\
    \n2.格文法\n\n格文法是以句子的中心动词为主导，并用格来表示其他成分与此中心动词之间的语义关系的一种描述方法。它主要是为了找出动词和与它所处的结构关系中的名词的语义关系，同时涉及动词或动词短语与其他各种名词短语之间的关系。格文法的特点是允许以动词为中心构造分析结果，尽管文法规则只描述句法，但是分析结果产生的结构对应于语义关系，而非严格的句法关系。\n\
    \n“格”这个词来源于传统语法，但它与传统语法中的格有着本质不同。在传统语法中，格仅表示一个词或短语在句子中的功能，如主格、宾格等，反映的也只是词尾的变化规则，故称为表层格。在格文法中，一个语句包含的名词词组和介词词组均以它们与句子中动词的关系来表示，称为格。格表示的是语义方面的关系，反映的是句子中包含的思想、观念等，称为深层格。和短语结构文法相比，格文法对于句子的深层语义有着更好的描述。无论句子的表层形式如何变化，如主动语态变为被动语态、陈述句变为疑问句、肯定句变为否定句等，对于其底层的语义关系，各名词成分所代表的格关系不会发生相应的变化。\n\
    \n“格”是一个一般的概念，相对于中心动词的不同语义关系，格可以分为许多种。例如，在句子“`John gave the book to Sally.`”中，相对于中心动词`gave`，`John`是这个行为的发出者，称为动作格；`the\
    \ book`是行为作用的对象，称为受动格；`Sally`是行为作用对象所到达的目标，称为目标格。\n\n## 6.4 信息检索\n\n信息检索是自然语言处理领域的一个重要方向，它是指信息按一定的方式组织起来，并根据信息用户的需要查找有关信息的过程和技术。\n\
    \n### 6.4.1 信息检索简介\n\n信息检索可从广义与狭义两个方面进行理解，狭义的信息检索仅指信息查询，也就是用户根据自身的需要，通过一定的方法，借助检索工具，从信息集合中找出所需信息的过程；广义的信息检索是信息按一定的方式进行加工、整理、组织并存储起来，再根据用户特定的需要将相关信息准确地查找出来的过程。一般情况下，信息检索指的就是广义的信息检索。\n\
    \n信息检索是指在信息检索网络或终端上，使用特定的检索指令、检索词和检索策略，从信息检索系统的数据库中检索出所需要的信息，再由终端设备显示、下载和打印的过程。此处，信息检索的本质没有改变，改变的只是信息的媒体形式、存储方式和匹配方法。\n\
    \n### 6.4.2 信息检索的发展历程\n\n信息检索是在计算机技术和通信技术发展的基础上建立起来的。它诞生于20世纪50年代，发展于20世纪80年代中期，20世纪90年代后随着互联网技术的发展而进入一个崭新的时期。回顾计算机文献信息检索的发展历程，大致可以概括为以下3个阶段。\n\
    \n1.批量处理阶段\n\n1954年，美国海军武器实验站图书馆在一台电子管计算机上建立了世界上第一个信息检索系统。20世纪50年代末，`IBM`公司利用一台`IBM\
    \ 650`计算机成功地编制出关键词索引，并建立了世界上第一个“定题情报检索”系统，为用户定期检索和提供特定主题的新到文献（脱机检索、批量处理），并很快得到了推广应用。\n\
    \n2.联机检索阶段\n\n20世纪60年代，信息检索进入了实用和全面发展阶段。20世纪60年代末，数据通信网络出现，大容量计算机分时系统和强功能检索软件研制成功，使脱机检索发展到联机检索并迅速得到了推广。20世纪70～80年代，联机检索得到迅速发展，一些联机检索系统开始向公众提供商业性服务，许多世界著名的联机检索系统相继投入商业性运营。\n\
    \n3.网络系统阶段\n\n20世纪90年代，联机检索的发展进入了一个重要的转折时期。随着互联网的迅速发展及超文本技术的出现，基于客户机/服务器的检索软件的开发，实现了将原来的主机系统转移到服务器上，使客户机/服务器联机检索模式开始取代以往的终端/主机结构，成为联机检索的发展趋势，使联机检索进入了又一个崭新的时期。\n"
  trans: "\n\n选择好特征后，就要训练使用的模型，并开始进行模型训练，其中包括参数的微调等。在模型训练的过程中要注意，有可能出现模型在训练集中表现很好，但在测试集中表现很差的问题。\n\
    \n### 4. 指标评价\n\n常用的模型评价指标有错误率、精准度、准确率、召回率等，利用这些指标来评价模型的优劣程度，以选择最佳的模型，进而输出最终的自然语言处理的结果。\n\
    \n## 6.2 自然语言处理的组成\n\n从自然语言的角度出发，自然语言处理大致可以分为以下两个部分。\n\n1.自然语言理解\n\n自然语言理解是指让计算机能够理解自然语言文本的意义。语言被表示成一连串的文字符号或者一串声流，其内部是一个层次化的结构。一个由文字表达的句子的构成层次是词素→词或词形→词组→句子，由声音表达的句子的构成层次则是音素→音节→音词→音句，其中的每个层次都受到语法规则的约束，因此语言的处理过程也应当是一个层次化的过程。\n\
    \n语言学是以人类语言为研究对象的学科，它的研究范围包括语言的结构、语言的运用、语言的社会功能和历史发展，以及其他与语言有关的问题。自然语言理解不仅需要语言学方面的知识，还需要与所要理解的话题相关的背景知识。它是一个综合的系统工程，又包含了很多细分的学科，有代表声音的音系学，代表构词法的词态学，代表语句结构的句法学，代表理解的语义学和语用学。\n\
    \n2.自然语言生成\n\n自然语言生成与自然语言理解恰恰相反，它是按照一定的语法和语义规则生成自然语言文本。即对语义信息以人类可读的自然语言形式进行表达，该过程主要包含\
    \ 3 个阶段：文本规划，即完成结构化数据中的基础内容规划；语句规划，即从结构化数据中组合语句来表达信息流；实现，即产生语法通顺的语句来表达文本。\n\n\
    ## 6.3 自然语言理解\n\n自然语言理解是使用自然语言同计算机进行通信的技术，又称计算语言学。它是语言信息处理的一个分支，也是人工智能的核心课题之一。\n\
    \n### 6.3.1 自然语言理解的层次\n\n从微观上讲，自然语言理解是指从自然语言到机器内部的映射；从宏观上看，自然语言是指机器能够执行人类所期望的某些语言功能。自然语言理解中至少有\
    \ 3 个主要问题；第一，计算机需要具备大程序量的人类知识，语言动作描述的是复杂世界中的关系，这些关系的知识必须是理解系统的一部分；第二，语言是基于模式的，音素构成单词，单词组成短语和句子，音素、单词和句子的顺序不是随机的，没有对这些元素的规范使用，就不可能达成交流；第三，语言动作是主体的产物，主体或者是人，或者是计算机，主体处在个体层面和社会层面的复杂环境中，语言动作都是有其目的的。\n\
    \n自然语言的理解和分析是一个层次化的过程，许多语言学家把这一过程分为如下 5 个层次。\n\n1.语音分析\n\n语音分析是指根据人类的发音规则，以及人们的日常习惯发音，从语音传输数据中区分出一个个独立的音节或者音调，再根据对应的发音规则找出不同音节所对应的词素或词，进而由词到句，识别出人所说的一句话的完整信息，将其转化为对应的文字，这也正是语音识别的核心。\n\
    \n2.词法分析\n\n词法指词位的构成和变化的规则，主要研究词自身的结构与性质。词法分析的主要目的是从句子中切分出单词，找出词汇的各个词素，从中获得单词的语言学信息并确定单词的词义。\n\
    \n3.句法分析\n\n句法是指组词成句的规则，描述句子的结构，以及词之间的依赖关系。\n\n4.语义分析\n\n句法分析后一般还不能理解所要分析的句子，至少需要进行语义分析。语义分析是把分析得到的句法成分与应用领域中的目标相关联，从而确定语音所表达的真正含义或概念。\n\
    \n5.语用分析\n\n语用就是研究语言所存在的外界环境对语言使用所产生的影响。它描述了语言的环境知识，以及语言与语言使用者在某个给定语言环境中的关系。关注语用信息的自然语言处理系统更侧重于讲话者/听话者模型的设定，而不是处理嵌入到给定话语中的结构信息。学者们提出了多种语言环境的计算模型，描述讲话者及其通信目的、听话者及其对说话者信息的重组方式。构建这些模型的难点在于，如何把自然语言处理的不同方面以及各种不确定的生理、心理、社会及文化等背景因素集中到一个完整连贯的模型中。\n\
    \n虽然这些分析层次看上去是自然而然的且符合心理学的规律，但是它们在某种程度上是强加在语言上的人工划分。它们之间广泛交叉，即使很底层的语调和节奏变化也会对说话的意思产生影响，如讽刺的使用。这种交叉在语法和语义的关系中体现得非常明显，虽然沿着这些分界线进行某些划分似乎很有必要，但是确切的分界线很难定义。例如，类似“`They\
    \ are eating apples`”这样的句子有多种解析，只有联系上下文的意思才能确定其具体含义。\n\n### 6.3.2 词法分析\n\n词法分析是理解单词的基础，其主要目的是从句子中切分出单词，找出词汇的各个词素，从中获得单词的语言学信息并确定单词的词义，如`unchangeable`是由`un-change-able`构成的，其词义由这\
    \ 3 个部分构成。不同的语言对词法分析有不同的要求，例如，英语和汉语就有较大的差距。在英语等语言中，因为单词之间是以空格自然分开的，切分一个单词很容易，所以找出句子的一个个词汇就很方便。但是由于英语单词有词性、数、时态、派生及变形等变化，要找出各个词素就复杂得多，需要对词尾或词头进行分析。例如，对于`importable`，它可以是`im-port-able`或`import-able`，这是因为`im`、`port`、`able`这\
    \ 3 个都是词素。\n\n词法分析可以从词素中获得许多有用的语言学信息，如英语中构成词尾的词素“`s`”通常表示名词复数或动词第三人称单数，“`ly`”通常是副词的后缀，而“`ed`”通常是动词的过去分词等，这些信息对于句法分析也是非常有用的。一个词可有许多种派生、变形，如`work`，可变化出`works`、`worked`、`working`、`worker`、`workable`等。对于这些派生的、变形的词，如果将其全放入词典，则将是非常庞大的，而它们的词根只有一个。自然语言理解系统中的电子词典一般只存放词根，并支持词素分析，这样可以大大压缩电子词典的存储空间。\n\
    \n下面是一个英语词法分析的算法，它可以对那些按英语语法规则变化的英语单词进行分析。\n\n```\nrepeat  \nlook for study in\
    \ dictionary  \n  if not found  \n  then modify the study  \nUntil study is found\
    \ no further modificatiob possidle\n```\n\n其中，`study`是一个变量，初始值就是当前的单词。例如，对于单词`catches`、`ladies`可以做如下分析。\n\
    \n```\ncatches  studies      //词典中查不到 \ncatche   studie       //修改 1：去掉 s \ncatch\
    \    studi        //修改 2：去掉 e \nstudy                 //修改 3：把 i 变成 y\n```\n\n\
    在修改 2 的时候就可以找到`catch`，在修改 3 的时候就可以找到`study`。\n\n英语词法分析的难度在于词义判断，因为单词往往有多种解释，仅仅依靠查词典常常无法判断。例如，单词“`diamond`”有\
    \ 3 种可能的解释：菱形，边长均相等的四边形；棒球场；钻石。要想判定单词的词义，只能依靠对句子中其他相关单词和词组的分析。例如，句子“`John saw\
    \ Slisan's diamond shining from across the room.`”中“`diamond`”的词义必定是钻石，因为只有钻石才能闪光，而菱形和棒球场是不闪光的。\n\
    \n作为对照，汉语中的每个字就是一个词素，所以汉语词法分析的特点是要找出各个词素相当容易，但要切分出各个词非常困难。不仅需要构词的知识，还需要解决可能遇到的切分歧义。例如，“下雨天留客天留我不留”，可以是“下雨天留客，天留我不留”，也可以是“下雨天，留客天，留我不？留”。\n\
    \n### 6.3.3 句法分析\n\n句法是语言在长期发展过程中形成的、全体成员必须共同遵守的规则。\n\n句法分析也称语法解析，是对句子和短语的结构进行分析，找出词、短语等的相互关系及各自在句子中的作用等，并以一种层次结构加以表达。层次结构可以反映从属关系、直接成分关系，也可以反映语法功能关系。例如，“他来晚了”，这里“他”是主语，“来”是谓语，“晚了”是补语。\n\
    \n句法分析是自然语言处理的核心，是对语言进行深层次理解的基础。在自然语言处理中，机器翻译是其中一个重要的课题，也是自然语言处理主要的应用领域，而句法分析是机器翻译的核心。\n\
    \n1.句法分析的作用\n\n一般来说，句法分析主要有以下两个作用。\n\n（1）对句子或短语结构进行分析，以确定构成句子的各个词、短语之间的关系以及各自在句子中的作用等，并将这些关系用层次结构加以表达。\n\
    \n（2）对句法结构进行规范化。在对一个句子进行分析的过程中，如果把分析句子各成分间的关系的推导过程用树形图表示出来，则这种图称为句法分析树。句法分析是由专门设计的分析器进行的，分析过程就是构造句法树的过程，即将每个输入的合法语句转换为一棵句法分析树。\n\
    \n2.句法分析的难点\n\n一般来说，句法分析主要有以下两个难点。\n\n（1）歧义：自然语言区别于人工语言的一个显著特点就是它存在大量的歧义现象。人类自身可以依靠大量的先验知识有效地消除各种歧义，而机器由于在知识表示和获取方面存在严重不足，很难像人类那样进行句法消歧。\n\
    \n（2）搜索空间：句法分析是一个极为复杂的任务，候选解个数随句子增多呈指数级增长，搜索空间巨大。因此必须设计出合适的解码器，以确保能够在合适的时间内搜索到最优解。\n\
    \n3.句法分析的方法\n\n句法分析是从单词串中得到句法结构的过程，而实现该过程的工具或程序被称为句法分析器。句法分析的种类很多，这里根据其侧重目标将其分为完全句法分析和局部句法分析两种。两者的区别在于，完全句法分析以获取整个句子的句法结构为目的；而局部句法分析只关注局部的一些成分，如常用的依存句法分析就是一种局部分析方法。\n\
    \n句法分析中所用的方法主要分为两类：基于规则的方法和基于统计的方法。基于规则的方法在处理大规模真实文本时，会存在语法规则覆盖有限、系统可迁移差等缺陷。随着大规模标注树库的建立，基于统计学习模型的句法分析方法开始兴起，句法分析器的性能不断提高，最典型的就是风靡于\
    \ 20 世纪 70 年代的概率上下文无关文法，它在句法分析领域得到了极大的应用，也是现在句法分析中常用的方法。基于统计的方法本质上是一种面向候选树的评价方法，它会给正确的句法树赋予一个较高的分值，而给不合理的句法树赋予一个较低的分值，这样就可以用候选句法树的分值来消除歧义。\n\
    \n目前使用最多的树库是来自美国宾夕法尼亚大学的英文宾州树库（`PTB`）。中文树库建设较晚，比较著名的有中文宾州树库（`CTB`）、清华树库（`TCT`）、`Sinica`树库。其中，`CTB`是美国宾夕标注的汉语句法树库，也是目前绝大多数的中文句法分析研究的基准语料库。`TCT`是清华大学计算机系智能技术与系统国家重点实验室人员从汉语平衡语料库中提取出\
    \ 100 万规模的汉字语料文本，经过自动句法分析和人工校对，形成的高质量的标注有完整句法结构的中文句法树语料库。`Sinica`树库是从中文句平衡语料库中抽取句子，经过计算机自动分析成句法树，并加以人工修改、检验后所得的成果。不同的树库有着不同的标记体系，使用时切记使用一种树库的句法分析器，并使用其他树库的标记体系来解释。\n\
    \n4.句法分析的评测方法\n\n句法分析评测的主要任务是评测句法分析器生成的树结构与手工标注的树结构之间的相似程度。其主要考虑两方面的性能：满意度和效率。其中，满意度是指测试句法分析器是否适合或胜任某个特定的自然语言处理任务；而效率主要用于对比句法分析器的运行时间。\n\
    \n目前主流的句法分析评测方法是帕斯瓦尔评测体系，它是一种粒度比较适中、较为理想的评价方法，主要指标有准确率、召回率、交叉括号数。其中，准确率表示分析正确的短语个数在句法分析结果中所占的比例，即分析结果中与标准句法树中相匹配的短语个数占分析结果中所有短语个数的比例；召回率表示分析得到的正确短语个数占标准分析树全部短语个数的比例；交叉括号表示分析得到的某一个短语的覆盖范围与标准句法分析结果的某个短语的覆盖范围存在重叠又不存在包含关系，交叉括号数即此类短语的数量。\n\
    \n### 6.3.4 语义分析\n\n句法分析完成后，不等于计算机已经理解了该语句，还需要对语义进行解释。语义分析的任务是把分析得到的句法成分与应用领域中的目标表示相关联，从而确定语言所表达的真正含义或概念，即弄清楚“干了什么”“谁干的”“这个行为的原因和结果是什么”以及“这个行为发生的时间、地点及其所用的工具或方法”等。与句法分析相比，语义分析侧重语义而非语法，它存在以下\
    \ 3 个功能。\n\n（1）词义消歧，即确定一个词在语境中的含义，而不是简单的词性。\n\n（2）语义角色标注，即标注句子中的谓语与其他成分的关系。\n\n\
    （3）语义依存分析，即分析句子中词语之间的语义关系。\n\n简单的做法就是依次使用独立的句法分析程序和语义解释程序。这样做可能的后果是，在很多情况下句法分析和语义分析相分离，不结合语义就无法确定句法结构。为了有效地实现语义分析，并能与句法分析紧密结合，目前已经研究出了多种语义分析的方法，常见的有语义文法和格文法。\n\
    \n1.语义文法\n\n语义文法将文法知识和语义知识组合起来，以统一的方式定义为文法规则集。语义文法是上下文无关的，形态上与面向自然语言的常见文法相同，只是不采用`NP`、`VP`、`PP`等表示句法成分的非终结符，而是使用能表示语义类型的符号，从而可以定义包含语义信息的文法规则。\n\
    \n语义文法是在上下文无关文法的基础上，将“名词短语”“动词短语”“名词”等不含有语义信息的纯语法类别用所讨论领域的专门信息，如“山”“水”“动物”等具有很强语义约束的语义类别来代替。利用语义文法进行语义分析，就可以排除诸如“论文收到教授”这类无意义的句子。例如，下面给出一个关于海军舰只的语义文法。\n\
    \n```\nS→what is SHIP-PROPERTY of SHIP? \nSHIP-PROPERTY→the SHIP-PROP/SHIP-PROP\
    \ \nSHIP-PROP→Speed | length | draft | beam | type\n```\n\n其在右部指定\"What is\"必须与`SHIP-PROPERTY`联合构成疑问句，这种单词间的约束关系显然表示了语义信息。用语义文法分析语句的方法与普通的句法分析文法类同。\n\
    \n2.格文法\n\n格文法是以句子的中心动词为主导，并用格来表示其他成分与此中心动词之间的语义关系的一种描述方法。它主要是为了找出动词和与它所处的结构关系中的名词的语义关系，同时涉及动词或动词短语与其他各种名词短语之间的关系。格文法的特点是允许以动词为中心构造分析结果，尽管文法规则只描述句法，但是分析结果产生的结构对应于语义关系，而非严格的句法关系。\n\
    \n“格”这个词来源于传统语法，但它与传统语法中的格有着本质不同。在传统语法中，格仅表示一个词或短语在句子中的功能，如主格、宾格等，反映的也只是词尾的变化规则，故称为表层格。在格文法中，一个语句包含的名词词组和介词词组均以它们与句子中动词的关系来表示，称为格。格表示的是语义方面的关系，反映的是句子中包含的思想、观念等，称为深层格。和短语结构文法相比，格文法对于句子的深层语义有着更好的描述。无论句子的表层形式如何变化，如主动语态变为被动语态、陈述句变为疑问句、肯定句变为否定句等，对于其底层的语义关系，各名词成分所代表的格关系不会发生相应的变化。\n\
    \n“格”是一个一般的概念，相对于中心动词的不同语义关系，格可以分为许多种。例如，在句子“`John gave the book to Sally.`”中，相对于中心动词`gave`，`John`是这个行为的发出者，称为动作格；`the\
    \ book`是行为作用的对象，称为受动格；`Sally`是行为作用对象所到达的目标，称为目标格。\n\n## 6.4 信息检索\n\n信息检索是自然语言处理领域的一个重要方向，它是指信息按一定的方式组织起来，并根据信息用户的需要查找有关信息的过程和技术。\n\
    \n### 6.4.1 信息检索简介\n\n信息检索可从广义与狭义两个方面进行理解，狭义的信息检索仅指信息查询，也就是用户根据自身的需要，通过一定的方法，借助检索工具，从信息集合中找出所需信息的过程；广义的信息检索是信息按一定的方式进行加工、整理、组织并存储起来，再根据用户特定的需要将相关信息准确地查找出来的过程。一般情况下，信息检索指的就是广义的信息检索。\n\
    \n信息检索是指在信息检索网络或终端上，使用特定的检索指令、检索词和检索策略，从信息检索系统的数据库中检索出所需要的信息，再由终端设备显示、下载和打印的过程。此处，信息检索的本质没有改变，改变的只是信息的媒体形式、存储方式和匹配方法。\n\
    \n### 6.4.2 信息检索的发展历程\n\n信息检索是在计算机技术和通信技术发展的基础上建立起来的。它诞生于 20 世纪 50 年代，发展于 20 世纪\
    \ 80 年代中期，20 世纪 90 年代后随着互联网技术的发展而进入一个崭新的时期。回顾计算机文献信息检索的发展历程，大致可以概括为以下 3 个阶段。\n\
    \n1.批量处理阶段\n\n1954 年，美国海军武器实验站图书馆在一台电子管计算机上建立了世界上第一个信息检索系统。20 世纪 50 年代末，`IBM`公司利用一台`IBM\
    \ 650`计算机成功地编制出关键词索引，并建立了世界上第一个“定题情报检索”系统，为用户定期检索和提供特定主题的新到文献（脱机检索、批量处理），并很快得到了推广应用。\n\
    \n2.联机检索阶段\n\n20 世纪 60 年代，信息检索进入了实用和全面发展阶段。20 世纪 60 年代末，数据通信网络出现，大容量计算机分时系统和强功能检索软件研制成功，使脱机检索发展到联机检索并迅速得到了推广。20\
    \ 世纪 70～80 年代，联机检索得到迅速发展，一些联机检索系统开始向公众提供商业性服务，许多世界著名的联机检索系统相继投入商业性运营。\n\n3.网络系统阶段\n\
    \n20 世纪 90 年代，联机检索的发展进入了一个重要的转折时期。随着互联网的迅速发展及超文本技术的出现，基于客户机/服务器的检索软件的开发，实现了将原来的主机系统转移到服务器上，使客户机/服务器联机检索模式开始取代以往的终端/主机结构，成为联机检索的发展趋势，使联机检索进入了又一个崭新的时期。\n\
    \n"
