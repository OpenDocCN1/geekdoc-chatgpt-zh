    目前，在医学上采用的图像处理技术大致包括压缩、存储、传输和自动/辅助分类判读，也可用于医生的辅助训练。与计算机视觉相关的工作包括分类、判读和快速三维结构的重建等。


    此外，计算机视觉技术与深度学习的结合在医学图像等领域产生了大量的研究成果。例如，图像配准技术是在医学图像分析领域进行量化多参数分析与视觉评估领域的关键技术；`DeepGestalt`算法能够提高识别罕见遗传综合征的准确率，在实验的502张不同的图像中，其正确识别综合征的准确率达到了91%；而基于卷积神经网络的人工智能能够识别心室功能障碍患者，研究团队在52
