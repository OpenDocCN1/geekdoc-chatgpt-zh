    # 第6章　自然语言处理

    【本章导读】

    语言是人类智慧的结晶，自然语言处理是指利用计算机对自然语言的形、音、义等信息进行处理，它是计算机科学领域和人工智能领域的一个重要的研究方向。本章主要介绍自然语言处理的基本方式和应用领域。


    【本章要点】

    1 自然语言处理的定义和原理

    2 自然语言处理的组成

    3 自然语言理解

    4 自然语言生成

    5 词法分析

    6 句法分析

    7 语义分析

    8 信息检索

    9 机器翻译

    10 情感分析

    11 语音识别


    ## 6.1　自然语言处理简介

    语言是人类智慧的结晶，它经历了漫长而缓慢的发展过程，是人类交际、思维和传递信息的重要工具。在人类进入信息化社会的今天，计算机自动处理的语言文字信息水平已成为衡量一个国家是否步入信息社会的重要标准之一。从20世纪80年代开始至今，中文语言处理技术在字处理、词处理等领域均取得了重大进展，不仅使中文这一世界最古老的语言之一顺利地搭上了信息时代的火车，还使中文在文字识别、语音识别、机器翻译等语言处理技术方面与其他语言相比毫不逊色，在排版印刷等应用方面也达到了世界领先水平。本节将对自然语言处理（Natural
    Language Processing，NLP）进行简要介绍。


    ### 6.1.1　自然语言处理的定义

    自然语言是指人们日常使用的语言，它是随着人类社会不断发展演变而来的，是人类沟通、交流的重要工具，也是人类区别于其他动物的根本标志，没有语言，人类的思维无从谈起。在整个人类历史中，以语言文字形式记载和流传的知识占到知识总量的80%以上。据统计，就计算机应用于信息处理而言，用于数学计算的信息处理仅占10%，用于过程控制的信息处理不到5%，其余85%都用于语言文字的信息处理。


    自然语言处理是指利用计算机对自然语言的形、音、义等信息进行处理，即对字、词、句、篇章的输入、输出、识别、分析、理解、生成等的操作和加工。它是计算机科学领域和人工智能领域的一个重要的研究方向，研究用计算机来处理、理解以及运用人类语言，可以实现人与计算机的有效交流。


    实现人机间的信息交流，是人工智能界、计算机科学界和语言学界所共同关注的重要问题。在一般情况下，用户可能不熟悉机器语言，所以自然语言处理技术可以帮助用户根据自身需要使用自然语言和机器进行交流。从建模的角度看，为方便计算机处理，自然语言可以被定义为一组规则或符号的集合，通过组合集合中的符号就可以传递各种信息。自然语言处理是研究语言能力和语言应用的模型，通过建立计算机的算法框架来实现某个语言模型，并完善、评测，最终用于设计各种实用的自然语言应用系统。


    自然语言处理的具体表现形式包括机器翻译、文本摘要、文本分类、文本校对、信息抽取、语音合成、语音识别等。可以说，自然语言处理的目的是让计算机理解自然语言。发展至今，自然语言处理研究已经取得了长足的进步，逐渐发展成为一门独立的学科。


    ### 6.1.2　自然语言处理的发展历程

    自然语言处理的发展大致经历了4个阶段。


    1.1956年以前的萌芽期

    计算机的诞生为机器翻译和随后的自然语言处理提供了基础。由于来自社会的机器翻译的需求，这一时期进行了许多自然语言处理的基础研究。1948年，克劳德·香农（Claude
    Shannon）把离散马尔可夫过程的概率模型应用于描述语言的自动机，并把热力学中“熵”的概念引用到语言处理的概率算法中。1956年，艾弗拉姆·乔姆斯基（Avram
    Chomsky）提出了上下文无关语法，并把它运用到自然语言处理中。他们的工作直接开创了基于规则和基于概率这两种不同的自然语言处理技术。1952年，贝尔实验室开始了语音识别系统的研究。1956年，人工智能的诞生为自然语言处理翻开了新的篇章。


    2.1957～1970年的快速发展期

    由于基于规则和基于概率这两种不同方法的存在，自然语言处理的研究在这一时期分为了两大阵营。一个是基于规则方法的符号派，另一个是采用概率方法的随机派。从20世纪50年代中期开始到20世纪60年代中期，以艾弗拉姆·乔姆斯基为代表的符号派学者开始了形式语言理论和生成句法的研究，20世纪60年代末又进行了形式逻辑系统的研究。而随机派学者采用基于贝叶斯方法的统计学研究方法。在这一时期，基于规则方法的研究势头明显强于基于概率方法的研究势头。这一时期的重要研究成果包括1959年宾夕法尼亚大学研制成功的转换与话语分析系统，布朗美国英语语料库的建立等。1967年，美国心理学家马尔里克·尼瑟（Ulrich
    Neisser）提出认知心理学的概念，直接将自然语言处理与人类的认知联系起来。


    3.1971～1993年的低谷发展期

    随着研究的深入，很多基于自然语言处理的应用并不能在短时间内得到实现，而新问题又不断地涌现，社会对自然语言处理的研究丧失了信心。从20世纪70年代开始，自然语言处理的研究进入了低谷时期。而同样在20世纪70年代，基于隐马尔可夫模型的统计方法在语音识别领域获得成功；到20世纪80年代初，话语分析也取得了重大进展。


    4.1994年至今的复苏融合期

    20世纪90年代中期以后，计算机的运算速度和存储量大幅提升，使得语音和语言处理的商品化开发成为可能；1994年，互联网商业化和网络技术的发展使得基于自然语言的信息检索和信息抽取的需求变得更加突出。这两件事从根本上促进了自然语言处理研究的复苏与发展，自然语言处理的应用面渐渐不再局限于机器翻译、语音控制等早期研究领域。


    从20世纪90年代末到21世纪初，人们逐渐认识到仅用基于规则的方法或仅用基于统计的方法，都是无法成功进行自然语言处理的。基于统计、基于实例和基于规则的语料库技术在这一时期开始蓬勃发展，各种处理技术开始融合，自然语言处理的研究又开始兴旺起来。


    ### 6.1.3　自然语言处理的研究方向

    自然语言处理可以应用于很多领域，下面讲解几种常见的应用。


    （1）文字识别

    文字识别借助计算机系统自动识别印刷体或者手写体文字，将其转换为可供计算机处理的电子文本。对于普通的文字识别系统，主要研究字符的图像识别；而对于高性能的文字识别系统，往往需要同时研究语言理解技术。


    （2）语音识别

    语音识别又称自动语音识别，目标是将人类语音中的词汇内容转换为计算机可读的输入。语音识别技术的应用包括语音拨号、语音导航、室内设备控制、语音文档检索、简单的听写数据录入等。


    （3）机器翻译

    机器翻译研究借助计算机程序把文字或演讲从一种自然语言自动翻译成另一种自然语言，即把一种自然语言的输入转换为另一种自然语言的输出，使用语料库技术可实现更加复杂的自动翻译。


    （4）自动文摘

    自动文摘是应用计算机对指定的文章做摘要的过程，即把原文档的主要内容和含义自动归纳、提炼并形成摘要或缩写。常用的自动文摘是机械文摘，根据文章的外在特征提取能够表达其中心思想的部分原文句子，并把它们组成连贯的摘要。


    （5）句法分析

    句法分析又称自然语言文法分析，它是运用自然语言的句法和其他相关知识来确定输入句各成分的功能，以建立一种数据结构并用于获取输入语句意义的技术。


    （6）文本分类

    文本分类又称文档分类，是在给定的分类系统和分类标准下，根据文本内容利用计算机自动判别文本类别，并实现文本自动归类的过程，它包括学习和分类两个过程。


    （7）信息检索

    信息检索又称情报检索，是利用计算机从海量文档中查找用户需要的相关文档的查询方法和查询过程。


    （8）信息获取

    信息获取主要是指利用计算机从大量的结构化或半结构化的文本中自动抽取特定的一类信息，并使其形成结构化数据，填入数据库供用户查询使用的过程，目标是允许计算非结构化的资料。


    （9）信息过滤

    信息过滤是指应用计算机自动识别和过滤满足特定条件的文档信息。其一般指根据某些特定要求，自动识别、过滤和删除互联网中某些特定信息的过程，主要用于信息安全和防护等。


    （10）自然语言生成

    自然语言生成是指将句法或语义信息的内部表示转换为自然语言字符组成的字符串的过程，是一种从深层结构到表层结构的转换技术，是自然语言理解的逆过程。


    （11）中文自动分词

    中文自动分词是指使用计算机自动对中文文本进行词语的切分，中文自动分词是中文自然语言处理中一个最基本的环节。


    （12）语音合成

    语音合成又称文语转换，是将书面文本自动转换成对应的语音表征的过程。


    （13）问答系统

    问答系统是指借助计算机系统对人提出问题的理解，通过自动推理等方法，在相关知识库中自动求解答案，并对问题做出相应的回答。回答技术与语音技术、多模态输入输出技术、人机交互技术相结合，构成问答系统。


    此外，自然语言处理的研究方向还有语言教学、词性标注、自动校对，以及讲话者识别、验证等。


    ### 6.1.4　自然语言处理的一般工作原理

    计算机处理自然语言的整个过程一般可以概括为4部分：语料预处理、特征工程、模型训练和指标评价。


    1.语料预处理

    语料预处理即对输入的数据进行预处理，主要包括以下4个步骤。


    （1）语料清洗，即保留有用的数据，删除噪声数据，常见的清洗方式有人工去重、对齐、删除、标注等。


    （2）分词，即将文本分成词语，如通过基于规则的、基于统计的分词方法进行分词。


    （3）词性标注，即给词语标上词类标签，如名词、动词、形容词等。常用的词性标注方法有基于规则的、基于统计的算法，如最大熵词性标注、HMM词性标注等。


    （4）去停用词，即去掉对文本特征没有任何贡献作用的字词，如标点符号、语气词、助词等。


    2.特征工程

    这一步的主要工作是将分词表示成计算机可识别的计算类型，一般为向量，常用的表示模型有词袋模型、词向量等。


    3.模型训练

