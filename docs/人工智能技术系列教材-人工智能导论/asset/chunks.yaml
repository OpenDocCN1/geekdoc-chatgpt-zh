    ### 2.5.3 数据清洗的应用领域

    目前，数据清洗主要应用于3个领域：数据仓库、数据挖掘和数据质量管理。


    1.数据清洗在数据仓库中的应用

    在数据仓库领域，一般在几个数据库合并时或多个数据源进行集成时进行数据清洗。例如，几个数据库中都存在指代同一个实体的记录，则合并后的数据库中就会出现重复的记录。数据清洗过程就是把这些重复的记录识别出来并消除它们，也就是所说的合并清洗（Merge/Purge）问题。这个问题的实例可称作记录连接、语义集成、实例识别或对象标识问题。值得注意的是，数据清洗在数据仓库中的应用并不是简单地清洗合并记录，它还涉及数据的分解与重组。图2-7所示为数据清洗在数据仓库中的应用。


    ![](Images/image_37_0_m.jpg)


    图2-7　数据清洗在数据仓库中的应用


    2.数据清洗在数据挖掘中的应用

    在数据挖掘领域，经常会遇到挖掘出来的特征数据存在各种异常的情况，如数据缺失、数据值异常等。对于这些情况，如果不加以处理，则会直接影响到最终挖掘模型建立后的使用效果，甚至是使得最终的模型失效，导致任务失败。因此，在数据挖掘过程中，数据清洗是第一个步骤，即对数据进行预处理。值得注意的是，各种不同的数据挖掘和数据仓库系统都是针对特定的应用领域进行数据清洗的，因此采用的方法和手段各不相同。


    3.数据清洗在数据质量管理中的应用

    数据质量管理贯穿数据生命周期的全过程，在数据生命周期中，数据的获取和使用周期包括一系列活动，如评估、分析、调整、丢弃数据等。因此，数据质量管理覆盖了质量评估、数据去噪、数据监控、数据探查、数据清洗、数据诊断等方面。在此过程中，数据清洗为提高数据质量提供了重要的保障。


    ### 2.5.4 数据清洗的评估

    数据清洗的评估实质上是对清洗后的数据质量进行评估，而数据质量的评估过程是一种通过测量和改善数据综合特征来优化数据价值的过程。数据质量的评估和方法研究的难点在于数据质量的含义、内容、分类、分级、评价指标等。


    在进行数据质量评估时，要根据具体的评估需求对数据质量评价指标进行相应的取舍。但是，数据质量评估至少应该包含以下两方面的基本评价指标：数据可信性和数据可用性。


    1.数据可信性

    数据可信性主要包括精确性、完整性、一致性、有效性、唯一性等指标。


    （1）精确性：描述数据是否与其对应的客观实体的特征相一致。

    （2）完整性：描述数据是否存在缺失记录或缺失字段。

    （3）一致性：描述同一实体的同一属性的值在不同的系统中是否一致。

    （4）有效性：描述数据是否满足用户定义的条件或在一定的阈值范围内。

    （5）唯一性：描述数据是否存在重复记录。


    2.数据可用性

    数据可用性主要包括时间性、稳定性等指标。


    （1）时间性：描述数据是当前数据还是历史数据。

    （2）稳定性：描述数据是否稳定，是否在其有效期内。


    ## 2.6 数据分析

    数据分析是指用适当的统计分析方法对收集来的大量数据进行分析，将它们加以汇总和理解并消化，以求最大化地开发数据的功能，发挥数据的作用。本节主要介绍人工智能背景下的大数据分析。


    ### 2.6.1 大数据分析概述

    大数据分析是大数据价值链中的一个重要环节，其目标是提取海量数据中的有价值的内容，找出内在的规律，从而帮助人们做出最正确的决策。广义的数据分析可分为统计分析和数据挖掘，它们处理数据的量级不同。统计分析一般针对样本数据，而数据挖掘则针对全体数据。


    具体来讲，大数据分析的任务主要分为预测任务和描述任务两类。预测任务的目标是根据某些属性的值，预测另外一些特定属性的值。被预测的属性一般称为目标变量或因变量，被用来做预测的属性称为解释变量和自变量。描述任务的目标是导出概括数据中潜在联系的模式，包括相关、趋势、聚类、轨迹和异常等。描述性任务通常是探查性的，常常需要后处理技术来验证和解释结果，具体包括分类、回归、关联分析、聚类分析、推荐系统、异常检测、链接分析等。


    ### 2.6.2 大数据分析的主要类型

    大数据分析主要包括描述性统计分析、探索性数据分析以及验证性数据分析等。


    1.描述性统计分析

    描述性统计分析是指运用制表、分类、图形以及计算概括性数据来描述数据特征的各项活动。描述性统计分析要对调查总体所有变量的有关数据进行统计性描述，主要包括数据的频数分析、集中趋势分析、离散程度分析、分布以及一些基本的统计图形。


    2.探索性数据分析

    探索性数据分析是一种分析数据集以概括其主要特征的方法，是对传统统计学假设检验手段的补充。它是对已有的数据（特别是调查或观察得来的原始数据）在尽量少的先验假定下进行探索，通过作图、制表、方程拟合、计算特征量等手段探索数据的结构和规律的一种数据分析方法。特别是在大数据时代，人们面对各种脏数据往往不知所措，不知道从哪里开始了解目前持有的数据时，探索性数据分析就非常有效。


    3.验证性数据分析

    验证性数据分析注重对数据模型和研究假设的验证，侧重于已有假设的证实或证伪。假设检验是根据数据样本所提供的证据，肯定或否定有关总体的声明。


    ### 2.6.3 数据挖掘

    在大数据与人工智能领域，数据挖掘是极其重要的一种数据分析技术。


    1.数据挖掘的概念

    数据挖掘是指在大量的数据中挖掘出有用信息，通过分析来揭示数据之间有意义的联系、趋势和模式。数据挖掘是一门交叉学科，将人们对数据的应用从低层次的简单查询，提升到从数据中挖掘知识，提供决策支持。在需求推动下，不同领域的研究者对数据库技术、人工智能技术、数理统计、可视化技术、并行计算等方面的知识进行融合后，形成新的研究热点。


    数据挖掘首先是搜集数据，数据越丰富越好，数据量越大越好，只有获得足够大量的高质量的数据，才能获得确定的判断，才能产生认知模型，这是从量变到质变的过程。由此产生经验，经验的积累就能产生有价值的判断。认知模型是渐进发展的模型，当认识深入以后，将产生更加抽象的模型与许多猜想，通过猜想再扩展模型，从而达到深度学习和深度挖掘。


    数据挖掘可以分为两类：直接数据挖掘和间接数据挖掘。


    （1）直接数据挖掘

    直接数据挖掘的目标是利用可用的数据建立一个模型，利用这个模型对剩余的数据或对一个特定的变量进行描述。


    （2）间接数据挖掘

    间接数据挖掘的目标中没有选出某一具体的变量，也不是用模型进行描述，而是在所有的变量中建立起某种关系。


    此外，在数据挖掘中，还应注意以下几点。


    （1）数据源必须是真实的、大量的、含有噪声的、用户感兴趣的数据。

    （2）挖掘知识的方法可以是数学的方法，也可以是非数学的方法；可以是演绎的方法，也可以是归纳的方法。

    （3）挖掘的知识具有应用的价值，可以用于信息管理、查询优化、决策支持和过程控制等，还可以用于数据自身的维护。


    2.数据挖掘技术

    数据挖掘技术就是指为了完成数据挖掘任务所需要的全部技术，是数据挖掘方法的集合。金融、零售等行业已广泛采用数据挖掘技术，以分析用户的可信度和购物偏好等。


    数据挖掘方法众多。根据挖掘任务可将数据挖掘技术分为预测模型发现、聚类分析、分类与回归、关联分析、序列模式发现、依赖关系或依赖模型发现、异常和趋势发现、离群点检测等类型。根据挖掘对象可将数据挖掘技术分为关系型数据库、面向对象数据库、空间数据库、时态数据库、文本数据库、多媒体数据库、异质数据库以及遗产数据库等类型。根据挖掘方法可将数据挖掘技术分为机器学习方法、统计方法、神经网络方法和数据库方法等类型。在机器学习方法中，可细分为归纳学习方法（决策树、规则归纳等）、基于范例学习、遗传算法等；在统计方法中，可细分为回归分析（多元回归、自回归等）、判别分析（贝叶斯判别、Fisher判别和非参数判别等）、聚类分析（系统聚类、动态聚类等）、探索性分析（主元分析法、相关分析法等）等；在神经网络方法中，可细分为前向神经网络（反向传播算法等）、自组织神经网络（自组织特征映射、竞争学习等）等；在数据库方法中，主要是多维数据分析或OLAP方法。此外，还有面向属性的归纳方法。


    在当今大数据时代下，数据挖掘被应用到各种各样的领域中，成为高科技发展的热点技术。在软件开发、医疗卫生、金融、教育等方面都可以随处看到数据挖掘的应用，可以使用数据挖掘技术发现大数据内在的巨大价值。


    （1）电子邮件系统中垃圾邮件的判断

    在电子邮件系统中判断一封邮件是否属于垃圾邮件，这属于文本挖掘的范畴，通常会采用朴素贝叶斯的方法进行判别。其根据电子邮件中的词汇是否经常出现在垃圾邮件中进行判断。例如，当一份电子邮件的正文中包含“推广”“广告”“促销”等词汇时，该邮件被判定为垃圾邮件的概率将会比较大。


    （2）金融领域中金融产品的推广营销

    针对商业银行中的零售客户进行细分。首先，基于零售客户的特征变量（人口特征、资产特征、负债特征、结算特征），计算客户之间的距离。其次，按照距离的远近，把相似的客户聚集为一类，从而有效地细分客户。将全体客户划分为诸如理财偏好者、基金偏好者、活期偏好者、国债偏好者等。其目的在于识别不同的客户群体，并针对不同的客户群体精准地进行产品设计和推送，从而节约营销成本，提高营销效率。


    （3）商品销售

    啤酒尿布是一个经典的故事。美国大型连锁超市中存在一个非常有趣的现象，把尿布与啤酒这两种不相关的商品摆在一起，能够大幅度增加两者的销量。其原因在于，美国的女性通常全职在家照顾孩子，她们常常会嘱咐丈夫在下班回家的路上为孩子买尿布，而丈夫在买尿布的同时会顺便购买自己爱喝的啤酒。通过数据挖掘可以在数据中发现这种关联性，因此，将这两种商品并置可以大大提高关联销售量。


    （4）疾病诊断

    乳腺肿瘤是女性恶性肿瘤中最常见的肿瘤之一，影响了女性的身体和精神健康，甚至会威胁生命。20世纪以来，全世界范围内乳腺癌的患病率均有所增加，特别是欧洲和北美地区，分别占女性恶性肿瘤发病率的第一位和第二位。在大数据时代下，医疗方面的数据呈现出数量大、类型多、处理方法复杂等特点，数据挖掘技术对这些问题的处理起到了至关重要的作用。例如，通过对乳腺肿瘤分析发现，乳腺肿瘤的特征可以由多个参数来表示。医院可通过对传统的反向传播（Back
    Propagation，BP）神经网络进行改进和发展而建立乳腺肿瘤的模型，并提高对早期乳腺肿瘤的诊断率。


    ### 2.6.4 数据可视化

    数据可视化将各种数据用图形化的方式展示给人们，是人们理解数据、诠释数据的重要手段和途径。


    1.数据可视化的概念

    数据可视化是关于数据视觉表现形式的科学技术研究，它为大数据分析提供了一种更加直观的挖掘、分析与展示的当代手段，从而让大数据更有意义，更贴近大多数人。因此，从本质上讲，数据可视化指通过帮助用户认知数据，进而发现这些数据所反映的实质。


    与传统的立体建模之类的特殊技术方法相比，数据可视化所涵盖的技术方法要广泛得多，它是利用计算机图形学及图像处理技术，将数据转换为图形或图像形式显示到屏幕上，并进行交互处理的理论、方法和技术。它涉及计算机视觉、图像处理、计算机辅助设计、计算机图形学等多个领域，并逐渐成为一项研究数据表示、数据综合处理、决策分析等问题的综合技术。


    2.数据可视化的类型

    随着对大数据可视化认识的不断加深，人们一般将数据可视化分为3种不同的类型：科学可视化、信息可视化和可视化分析。


    （1）科学可视化

    科学可视化是数据可视化中的一个应用领域，主要关注空间数据与三维现象的可视化，涉及气象学、生物学、物理学、农学等，重点在于对客观事物的体、面及光源等的逼真渲染。科学可视化是计算机图形学的一个子集，是计算机科学的一个分支。因此，科学可视化的目的主要是以图形方式说明数据，使科学家能够从数据中了解和分析规律。


    （2）信息可视化

    信息可视化是一个跨学科领域，旨在研究大规模非数值型信息资源的视觉呈现（如系统中的众多文件或者一行行的程序代码）。其通过图形图像方面的技术与方法，帮助人们理解和分析数据。信息可视化与科学可视化有所不同，科学可视化处理的数据具有天然几何结构（如磁感线、流体分布等），而信息可视化则侧重于抽象数据结构，如非结构化文本或者高维空间当中的点（这些点并不具有固有的二维或三维几何结构）。


    （3）可视化分析

    可视化分析是科学可视化与信息可视化领域发展的产物，侧重于借助交互式的用户界面，对数据进行分析与推理。可视化分析是一个多学科领域，它将新的计算和基于理论的工具及创新的交互技术与视觉表示相结合，以实现对信息的分析。


    3.数据可视化的标准

    数据可视化的标准通常包括实用性、完整性、真实性、艺术性以及交互性。


