    # [第5章　计算机视觉](../Text/contents.xhtml#a5)

    【本章导读】

    计算机视觉是研究如何让机器“看”的科学，是人工智能主要应用领域之一。本章主要介绍计算机视觉的知识及应用。


    【本章要点】

    1 计算机视觉

    2 图像分类

    3 目标检测

    4 图像分割


    ## [5.1　计算机视觉概述](../Text/contents.xhtml#z120)

    人类认识、了解世界的信息中有80%以上来自视觉，同样，计算机视觉（Computer Vision，`CV`）是机器认知世界的基础，最终的目的是使得计算机能够像人类一样“看懂世界”。计算机视觉是从图像或视频中提出符号或数值信息，分析计算该信息以进行目标的识别、检测和跟踪等。更形象地说，计算机视觉就是让计算机像人类一样能看到并理解图像。


    ### [5.1.1　计算机视觉简介](../Text/contents.xhtml#z121)

    计算机视觉是一门涉及图像处理、图像分析、模式识别和人工智能等多种技术的新兴交叉学科，具有快速、实时、经济、一致、客观、无损等特点。


    #### 1.计算机视觉的概念

    计算机视觉是研究如何让机器“看”的科学，其可以模拟、扩展和延伸人类智能，从而帮助人类解决大规模的复杂问题。因此，计算机视觉是人工智能主要应用领域之一，它通过使用光学系统和图像处理工具等来模拟人的视觉捕捉能力及处理场景的三维信息，理解并通过指挥特定的装置执行决策。目前，计算机视觉技术应用相当广泛，如人脸识别、车辆或行人检测、目标跟踪、图像生成等，其在科学、工业、农业、医疗、交通、军事等领域都有着广泛的应用前景。


    计算机视觉技术的基本原理是利用图像传感器获得目标对象的图像信号，并传输给专用的图像处理系统，将像素分布、颜色、亮度等图像信息转换成数字信号，并对这些信号进行多种运算与处理，提取出目标的特征信息进行分析和理解，最终实现对目标的识别、检测和控制等。


    计算机视觉技术先由电荷耦合器件（Charge Coupled Devices，`CCD`）摄像头采集高质量图像，实现高精度测量，再通过图像数字化模块、数字图像处理模块、智能判断决策模块等软件模块的精确统计、运算和分析，包括参数经过线性回归、主成分分析方法（Principal
    Component Analysis，`PCA`）、学习型矢量法、贝叶斯决策、支持向量机、遗传算法、`BP`神经网络、人工神经网络等，构建判别模型，为对图像目标做出某一方面的判断提供依据。


    #### 2.计算机视觉的特点

    计算机视觉与其他人工智能技术有所不同。首先，计算机视觉是一个全新的应用方向，而非像预测分析那样只是对原有解决方案的一种改进。其次，计算机视觉能够以无障碍的方式改善人类的感知能力。当算法从图像当中推断出信息时，它并不像其他人工智能方案那样在对本质上充满不确定性的未来做出预测；相反，它们只是判断关于图像或图像集中当前内容的分类。这意味着计算机视觉将随着时间推移而变得愈发准确，直到其达到甚至超越人类的图像识别能力。最后，计算机视觉能够以远超其他人工智能工具的速度收集训练数据。大数据集的主要成本体现在训练数据的收集层面，但计算机视觉只需要由人类对图片及视频内容进行准确标记——这项工作的难度明显很低，正因如此，近年来计算机视觉技术的采用率才得到迅猛提升。


    ### [5.1.2　计算机视觉的发展历史](../Text/contents.xhtml#z122)

    1966年，人工智能学家马文·明斯基在给学生布置的作业中，要求学生通过编写一个程序让计算机描述它通过摄像头看到了什么，这被认为是计算机视觉最早的任务描述。


    20世纪70～80年代，随着现代电子计算机的出现，计算机视觉技术初步萌芽。MIT的人工智能实验室首次开设计算机视觉课程，由著名的伯特霍尔德·霍恩（Berthold
    Horn）教授主讲，同实验室的大卫·马尔（David Marr）教授首次提出表示形式（Representation）是视觉研究最重要的问题。人们开始尝试让计算机“看到”东西，于是首先想到的是从人类的视觉机制中获得借鉴。


    借鉴之一是当时人们普遍认为人类能看到并理解事物，是因为人类通过两只眼睛可以立体地观察事物。因此，要想让计算机理解它所看到的图像，必须先将事物的三维结构从二维的图像中恢复出来，这就是所谓的“三维重构”的方法。


    借鉴之二是人们认为人类之所以能识别出一个苹果，是因为已经拥有了苹果的先验知识，如苹果是圆的、表面光滑的，如果给机器建立一个这样的知识库，让机器将看到的图像与知识库中的储备知识进行匹配，就有可能使机器识别乃至理解它所看到的东西，这是所谓的“先验知识库”的方法。


    这一阶段的应用场景主要是光学字符识别、工件识别、显微/航空图片的识别等。


    20世纪90年代，计算机视觉技术取得了更大的进步，开始广泛应用于工业领域。一方面的原因是CPU、数字信号处理等硬件技术有了飞速进步；另一方面是得益于不同算法的引入，包括统计方法和局部特征描述符等。


    进入21世纪，得益于互联网的兴起和数码相机的出现带来的海量数据，以及机器学习方法被广泛应用，计算机视觉发展迅速。以往许多基于规则的处理方式都被机器学习所替代，计算机能够自动从海量数据中总结、归纳物体的特征，并进行识别和判断。这一阶段涌现出了非常多的应用场景，包括典型的相机人脸检测、安防人脸识别、车牌识别等。


    2010年以后，借助于深度学习的力量，计算机视觉技术得到了爆发增长和产业化发展。通过深度神经网络，各类视觉相关任务的识别精度都得到了大幅提升。计算机视觉技术的应用场景也快速扩展，拥有了更广阔的应用前景，除了在比较成熟的安防领域的应用外，也有应用在金融领域的人脸识别身份验证、电商领域的商品拍照搜索、医疗领域的智能影像诊断等。


    ### [5.1.3　计算机视觉研究的意义](../Text/contents.xhtml#z123)

    视觉是人类最重要的一种感觉，在人类认识世界和改造世界的过程中，它给人类提供了认识世界总信息量的80%以上，人类可以通过视觉认识客观环境中各种物体的形状、大小、颜色、空间位置以及它们之间的相对位置，从而使人类通过大脑的活动，下达指令去完成生存所需的任务和行动，最终实现人类认识世界、改造世界的目的。因此，视觉对人类无疑是十分重要的。


    但是，人类的视觉由于生理条件的限制，只能在一定的条件下才能发挥作用。例如，人类对客观物体的观察只能在一定的距离、大小、亮度、波长以及时间范围内才能获得所需的信息。此外，人类视觉的灵敏度也有一定的限制，特别是在恶劣和有干扰的环境中，人类视觉会受到影响，造成观察结果的偏差。视觉还与人类在观察过程中的主观因素和精神状态有关。所以人类的视觉系统虽然极其重要，但是存在生理条件的限制，有一定的局限性。人们渴望着利用科学技术手段研制出能克服人类视觉的局限性，拓宽人类视觉边界的系统，为人类社会服务。


    在采集图像、分析图像、处理图像的过程中，计算机视觉的灵敏度、精确度、快速性都是人类视觉所无法比拟的，它克服了人类视觉的局限性。计算机视觉系统的独特性质使得其在各个领域的应用中显示出了强大生命力。目前，计算机视觉系统的应用已遍及航天、工业、农业、科研、军事、气象、医学等领域。因此，研究及利用计算机视觉系统对当今世界来说十分重要，它将推动科学和社会更快地向前发展，为人类做出日益重要的贡献。


    ### [5.1.4　计算机视觉的应用及面临的挑战](../Text/contents.xhtml#z124)

    人工智能是现今的一大研究热点，而机器要想变得更加智能，必然少不了对外界环境的感知。有研究表明，人类对外界的环境的感知80%以上来自视觉系统，机器也是如此，大多数的信息包含在图像中，人工智能的发展少不了计算机视觉。目前，计算机视觉在如下领域得到了广泛应用，但也面临着一些挑战。


    #### 1.智慧医疗领域的应用

    '
  trans: '


    ### 1.条件生成对抗网络

    条件生成对抗网络（Conditional GAN，`CGAN`）在原始`GAN`的基础上增加了约束条件，控制了`GAN`过于自由的问题，使网络朝着既定的方向生成样本。原始`GAN`对于生成网络几乎没有任何约束，使得生成过程过于自由，导致在图片较大的情形中，模型变得难以控制。`CGAN`的生成网络和判别网络的输入多了一个约束项`y`，约束项`y`可以是一个图像的类别标签，也可以是图像的部分属性数据。`CGAN`的缺点在于其模型训练不稳定，从损失函数可以看到，`CGAN`只是为了生成指定的图像而增加了额外约束，并没有解决训练不稳定的问题。


    ### 2.深度卷积生成对抗网络

    深度卷积生成对抗网络（Deep Convolutional GAN，`DCGAN`）的提出对`GAN`的发展有着极大的推动作用，它将`CNN`和`GAN`结合起来，使得生成的图片质量和多样性得到了保证。`DCGAN`使用了一系列的训练技巧，如使用批量归一化（Batch
    Normalization，`BN`）稳定训练，使用`ReLU`激活函数降低梯度消失风险，同时取消了池化层，使用步幅卷积和微步幅卷积有效地保留了特征信息。`DCGAN`虽然能生成多样性丰富的样本，但是生成的图像质量并不高，且没有解决训练不稳定的问题，在训练的时候仍需要小心地平衡`G`和`D`的训练进程。


    ### 3.循环一致性生成对抗网络

    循环一致性生成对抗网络（Cycle-consistent Generative Adversarial Networks，`CycleGAN`），`CycleGAN`可以让两个域的图像互相转换且不需要成对的图像作为训练数据。传统的两个不同域中的图像要实现相互转换，一般需要两个域中具有相同内容的成对图像作为训练数据，如`pix2pix`，但是这种成对的训练数据往往很难获得。`CycleGAN`是一个互相生成的网络，其网络是一个环形结构，其原理是`x`表示`X`域的图像，`y`表示`Y`域的图像，`G`和`F`是两个转换器，`D[X]`和`D[Y]`是两个判别器，`X`域的图像`x`经转换器`G`转换成`Y`域的图片`G(x)`，并由判别器`D[Y]`判别它是否为真实图片；同理，`Y`域的图像`y`经转换器`F`转换成`X`域的图片`F(x)`，再由判别器`D[X]`判别它是否为真实图片。为了避免转换器将域内的所有图像都转换成另一个域内的同一图像，`CycleGAN`使用循环一致性损失做约束。`CycleGAN`的缺点是其循环机制能保证成像不会偏离太远，但是循环转换中会造成一定的信息丢失，使得生成图像质量不高。


    ## 4.6　深度学习的应用

    深度学习技术目前在人工智能领域占有绝对的统治地位，因为相比于传统的机器学习算法而言，深度学习在某些领域展现出了最接近人类所期望的智能效果，同时在悄悄地走进人们的生活，如刷脸支付、语音识别、智能翻译、自动驾驶、棋类人机大战等。


    ### 4.6.1　AlphaGo Zero

    2018 年 12 月，不仅会下围棋，还自学成才横扫国际象棋和日本将棋的`AlphaGo Zero`，登上了世界顶级学术期刊《科学》杂志的封面。


    #### 1.AlphaGo Zero 简介

    `AlphaGo Zero`是谷歌旗下`DeepMind`公司的新版程序。2016 年 3 月，`AlphaGo Master`击败了最强的人类围棋选手之一——李世石，且`AlphaGo
    Master`在训练过程中使用了大量人类棋手的棋谱。2017 年 10 月 19 日，`DeepMind`公司在《自然》杂志发布了一篇新的论文，`AlphaGo
    Zero`——它完全不依赖人类棋手的经验，经过 3 天的训练，`AlphaGo Zero`就击败了`AlphaGo Master`。`AlphaGo Zero`最重要的突破在于，它不仅可以解决围棋问题，还可以在不需要知识预设的情况下，解决一切棋类问题。经过几个小时的训练，它又击败了最强国际象棋冠军程序`Stockfish`。图
    4-13 所示为`AlphaGo Zero`击败`AlphaGo Master`的棋谱。


    ![](img/cutq_91_24473_l.jpg)


    图 4-13　`AlphaGo Zero`击败`AlphaGo Master`的棋谱


    `DeepMind`利用了深度学习技术，结合了更多经典的强化学习方法来实现最新的突破。`AlphaGo Zero`是`DeepMind`的自动操作系统的最新化身。`AlphaGo
    Zero`做了以下几点突破。


    （1）击败之前版本的`AlphaGo`（最终比分为 100:0）。

    （2）学习从头开始执行这项任务，而不需要学习以前的人类知识（如记录的人类棋谱）。

    （3）只需 3 天的训练时间，就能达到世界冠军水平。

    （4）使用了较少的神经网络。

    （5）使用了较少的训练数据。


    #### 2.AlphaGo Zero 的学习过程

    `AlphaGo Zero`与`DeepMind`的前几代版本的最大不同是，它能从空白状态学起，在无任何人类输入的条件下，它能够迅速自学围棋。也就是说，`AlphaGo
    Zero`是真的自己学会了围棋规则，系统学会了渐渐从输、赢以及平局中调整参数，让自己更懂得选择那些有利于赢得比赛的走法，而不再去分析对手的特征。其中关键的一点在于`AlphaGo
    Zero`在设计过程中做了一个全新的定位：重在学习，而不是急于求胜。


    首先，`DeepMind`采用了 5 000 个`TPU`（可以简单地理解为计算机的`CPU`），结合深度神经网络、通用强化学习算法和通用树搜索算法，打造了一个全能棋手。


    其次，`AlphaGo Zero`的学习能力是一个动态成长的过程，每次学习一种新的棋类或者游戏都会根据难易程度来展开一段自我博弈，产生的超参数通过贝叶斯优化进行调整。


    与此同时，`AlphaGo Zero`的“自学”过程还有一项特别重要的任务——对自身进行神经网络训练。利用训练好的神经网络，可以精准地指引一个搜索算法，即蒙特卡洛树搜索（Monte
    Carlo Tree Search，`MCTS`），为每一步棋选出最有利的落子位置。因此，每下一步之前，`AlphaGo Zero`的搜索对象不是所有可能性，而只是最适合当下“战况”的一小部分可能性，这就大大提升了搜索的精确性和效率性。从实质上看，`AlphaGo
    Zero`算法本质上是一个最优化搜索算法，对于所有开放信息的、离散的最优化问题，只要人们可以写出完美的模拟器，就可以应用`AlphaGo Zero`算法。所谓开放信息，就像围棋、象棋；所谓离散问题，则意味着变量是可以有限枚举的，如围棋的
    361 个点是可以枚举的，而股票、无人驾驶等不属于这类问题。


    ### 4.6.2　自动驾驶

    在过去的十年中，自动驾驶汽车技术取得了越来越快的进步，主要得益于深度学习和人工智能领域的进步。


    #### 1.自动驾驶概述

    深度学习技术在自动驾驶领域取得了巨大成功，其优点是精准性高、鲁棒性强、成本低。无人驾驶车辆商业化成为焦点和趋势。汽车企业、互联网企业都争相进入无人驾驶领域，如百度、`Uber`等。例如，百度也在
    2020 年开始了无人驾驶汽车的上路测试。其他公司如特斯拉、沃尔沃、宝马等也对无人驾驶技术进行了深入研究，其近期定位是实现高速公路上的高级辅助驾驶。


    #### 2.自动驾驶技术框架

    自动驾驶是一个完整的软硬件交互系统，自动驾驶核心技术包括硬件（汽车制造技术、自动驾驶芯片）、自动驾驶软件、高精度地图、传感器通信网络等。自动驾驶可以处理来自不同车载来源的观测流，如照相机、雷达、激光雷达、超声波传感器、`GPS`装置和惯性传感器，这些观察结果被汽车的计算机用来做驾驶决定。自动驾驶软件部分的模块主要包括以下几部分。


    （1）环境感知模块

    环境感知模块主要通过传感器来感知环境信息，如通过摄像头、激光雷达、毫米波雷达、超声波传感器等来获取环境信息；通过`GPS`获取车身状态信息。具体来说，其主要包括传感器数据融合、物体检测与物体分类（道路、交通标志、车辆、行人、障碍物等）、物体跟踪（行人移动）、定位（自身精确定位、相对位置确定、相对速度估计）等。


    （2）行为决策模块

    行为决策模块需要根据实时路网信息、交通环境信息和自身驾驶状态信息，产生遵守交通规则（包括突发异常状况）的安全、快速的自动驾驶决策（运动控制）。通俗地说，就是实时规划出一条精密而合理的行驶轨迹，可分为全局路径规划和局部路径规划，局部路径规划主要是指当出现道路损毁、存在障碍物等情况时找出可行驶区域行驶，在路径规划的同时需要考虑最终理想的乘坐体验。


    （3）运行控制模块

    运行控制模块可根据规划的行驶轨迹，以及当前行驶的位置、姿态和速度，对加速踏板、制动踏板、转向盘和变速杆等下达控制命令。


    #### 3.自动驾驶的实现过程

    自动驾驶汽车的首要任务是了解周围环境并使其本地化。在此基础上，规划一条连续的路径，并通过行为仲裁系统确定汽车的未来行为。最后，运动控制模块反应性地校正在执行所计划的运动时产生的误差。


    在行驶过程中，自动驾驶汽车在两个点（即起始位置和所需位置）之间找到路线的能力即为路径规划。根据路径规划，自动驾驶汽车应考虑周围环境中存在的所有可能障碍物，并计算无碰撞路线的轨迹。一般认为自动驾驶是一种多智能体设置，在这种设置中，当车辆在超车、让路、合流、左转和右转，以及在非结构化城市道路上行驶时，宿主车辆必须与其他道路使用者应用复杂的谈判技巧。目前，在卷积神经网络的基础上进行视觉的感知是自动驾驶系统中最常用的方法。


    那么，深度学习具体如何用于自动驾驶呢？自动驾驶需要汽车像人的大脑一样来辨识一些行驶路径上出现的事物并做出决策。深度学习网络相当于人的大脑，对安装在车前的摄像头的图像进行采集，并通过卷积神经网络来提取图像的特征，通过模型计算来得出几个输出量，如加速、减速、转向盘的角度等信息。图
    4-14 所示为深度学习在进行自动驾驶的仿真。


    ![](img/image_93_0_m.jpg)


    图 4-14　深度学习在进行自动驾驶的仿真


    ## 4.7　小结

    （1）神经网络亦称为人工神经网络，是由大量神经元广泛互连而成的网络，是对人脑的抽象、简化和模拟，神经网络应用了一些人脑的基本特性。

    （2）感知机被认为是具有实用价值的重要分类算法之一。

    （3）卷积神经网络在神经网络的基础上加入了卷积运算，通过卷积核局部感知图像信息提取其特征，多层卷积之后能够提取出图像的深层抽象特征，凭借这些特征来达到更准确的分类或预测的目标。

    （4）循环神经网络是一种以序列数据为输入，在序列的演进方向进行递归，且所有节点（循环单元）按链式连接形成闭合回路的递归神经网络。

    （5）生成对抗网络的网络结构由生成网络和判别网络共同构成。生成网络和判别网络可以看作博弈中的两个玩家，在模型训练的过程中，生成网络和判别网络会各自更新自身的参数以使损失最小，通过不断迭代优化，最终达到纳什均衡状态。


