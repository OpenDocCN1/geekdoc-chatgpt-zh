    随着近几年来计算机视觉技术的进步，智慧医疗领域受到了学术界和产业界的持续关注，其应用越来越广泛和深入。面向智慧医疗，计算机视觉技术将从两个层面产生深刻的影响：第一，对于临床医生，计算机视觉技术能帮助其更快速、更准确地进行诊断分析工作；第二，对于卫生系统，计算机视觉技术通过人工智能的方式能改善工作流程、减少医疗差错。


    目前，在医学上采用的图像处理技术大致包括压缩、存储、传输和自动/辅助分类判读，也可用于医生的辅助训练。与计算机视觉相关的工作包括分类、判读和快速三维结构的重建等。


    此外，计算机视觉技术与深度学习的结合在医学图像等领域产生了大量的研究成果。例如，图像配准技术是在医学图像分析领域进行量化多参数分析与视觉评估领域的关键技术；`DeepGestalt`算法能够提高识别罕见遗传综合征的准确率，在实验的
