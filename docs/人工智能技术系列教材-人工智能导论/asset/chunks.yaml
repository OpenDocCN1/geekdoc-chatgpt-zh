- raw: "# [内容提要](../Text/contents.xhtml#a0)\n\n本书主要讲述人工智能的基础知识与基础理论，并通过大量的人工智能应用帮助读者快速了解人工智能相关技术。本书共10章，分别为人工智能概述、人工智能基础知识、机器学习、深度学习、计算机视觉、自然语言处理、知识图谱、人工智能技术应用场景、智能机器人和人工智能的挑战与未来。本书内容丰富，讲解细致，注重技术发展变化。\n\
    \n本书既可作为高校大数据专业、云计算专业、人工智能技术专业、信息管理专业、计算机网络专业的教材，又可作为人工智能与大数据爱好者的参考书。\n\n# [前言](../Text/contents.xhtml#b0)\n\
    \n当今世界，全球数据量爆发式增长，大数据技术发展日新月异，对经济社会发展产生了非常深远的影响。以人工智能、大数据为代表的现代信息技术与人类生产生活高度融合。发展智能制造，抢占全球未来产业制高点，已成为各国共识。\n\
    \n本书以“理论-实际应用”结合的方式深入地讲解了人工智能的基础知识和实现的基本技术，在内容设计上既有上课时教师的讲述部分，又有大量的典型案例，能够极大地激发学生在课堂上的学习积极性与主动创造性，让学生在课堂上跟上教师的思维，从而学到更多有用的知识和技能。\n\
    \n本书特色如下。\n\n（1）全面而又深入浅出地介绍了人工智能的基础知识和实现的基本技术。\n\n（2）教学案例丰富，包含了配套的教学课件、习题答案等多种教学资源。\n\
    \n（3）紧跟时代潮流，注重技术变化。\n\n（4）编写本书的教师都具有多年的教学经验，全书知识点讲解重难点突出，能够激发学生的学习热情。\n\n本书建议学时为48学时，具体分布如下表所示。\n\
    \n![](Images/table_image_3_0.jpg)\n\n本书由重庆邮电大学的李铮以及重庆航天职业技术学院的黄源、蒋文豪担任主编，重庆医药高等专科学校的涂旭东及重庆航天职业技术学院的刘源、吴文灵担任副主编。其中，蒋文豪编写了第3章、第4章、第5章和第7章；黄源编写了第1章、第2章、第8章和第9章；涂旭东编写了第6章；李铮、吴文灵和刘源共同编写了第10章。重庆航天职业技术学院的徐受蓉教授对书中内容进行了一定的审阅。全书由黄源负责统稿工作。\n\
    \n本书是校企合作共同编写的成果，在编写本书的过程中，编者得到了中国电信金融行业信息化应用（重庆）基地总经理助理杨琛的大力支持，在此表示感谢。\n\n在编写本书的过程中，编者参阅了大量的相关资料，在此一并表示感谢！\n\
    \n由于编者水平有限，书中难免出现疏漏之处，衷心希望广大读者批评指正，读者有意见或建议可发送电子邮件到2103069667@qq.com。\n\n编者  \n\
    \n2020年9月  \n\n重庆\n\n# [第1章　人工智能概述](../Text/contents.xhtml#a1)\n\n【本章导读】\n\n人工智能自诞生以来，在短短几十年的时间里取得了巨大的进展。本章主要介绍人工智能的基础知识，以帮助读者初步了解人工智能。\n\
    \n【本章要点】\n\n1 人工智能的定义\n\n2 人工智能的分类\n\n3 人工智能的起源和发展\n\n4 人工智能的研究内容\n\n5 人工智能领域的著名专家和代表性人物\n\
    \n6 人工智能研究的主要学派\n\n7 人工智能的应用\n\n## [1.1　人工智能简介](../Text/contents.xhtml#z1)\n\n\
    自1956年诞生以来，人工智能研究已经取得了许多令人兴奋的成果，并在多个领域得到了广泛的应用，极大地改变了人们的社会生活。本节将对人工智能的概念作简单的介绍。\n\
    \n### [1.1.1　人工智能的定义](../Text/contents.xhtml#z2)\n\n人工智能（Artificial Intelligence，AI）是研究、开发用于模拟、延伸和扩展人的智能的理论、方法、技术及应用系统的一门新的技术科学。\n\
    \n关于人工智能的定义较多，目前采用较多的是斯图亚特·罗素（Stuart Russell）与彼得·诺维格（Peter Norvig）在《人工智能：一种现代的方法》一书中的定义。他们认为人工智能是关于“智能主体（Intelligent\
    \ Agent）的研究与设计”的学问，而“智能主体是指一个可以观察周遭环境并做出行动以达致目标的系统”。这一定义既强调人工智能可以通过感知环境做出主动反应，又强调人工智能所做出的反应必须满足目标，同时，不再强调人工智能对人类思维方式或人类总结的思维法则的模仿。\n\
    \n从根本上讲，人工智能是研究使计算机模拟人类的某些思维过程和智能行为（如学习、推理、思考、规划等）的学科，主要包括计算机实现智能的原理、制造类似于人脑智能的计算机，使计算机能实现更高层次的应用。此外，人工智能还涉及心理学、哲学和语言学等学科，可以说几乎涉及了自然科学和社会科学的所有学科，其范围已远远超出了计算机科学的范畴。\n\
    \n### [1.1.2　人工智能的特点](../Text/contents.xhtml#z3)\n\n人工智能经历了60多年的发展，现在已进入AI 2.0阶段，主要具备这样几个特征：一是从人工知识表达到大数据驱动的知识学习技术；二是从分类型处理的多媒体数据转向跨媒体的认知、学习、推理；三是从追求智能机器到高水平的人机、脑机相互协同融合；四是从聚焦个体智能到基于互联网和大数据的群体智能；五是从拟人化的机器人转向更加广阔的智能自主系统，如工业4.0时代的智能工厂、智能无人机等产品。\n\
    \n### [1.1.3　人工智能的分类](../Text/contents.xhtml#z4)\n\n人工智能可分为3类：弱人工智能（Weak AI）、强人工智能（Strong\
    \ AI）与超人工智能（Artificial Super Intelligence，ASI）。\n\n弱人工智能就是利用现有的智能化技术，来改善经济社会发展所需的一些技术条件，也指完成单一任务的智能。例如，曾经战胜世界围棋冠军的人工智能阿尔法围棋（AlphaGo）就是一个典型的弱人工智能，尽管它很厉害，但它只会下围棋；又如，苹果公司的语音助手Siri，它只能执行有限的预设功能，并且不具备智力或自我意识，它只是一个相对复杂的弱人工智能。\n\
    \n强人工智能则是综合的，在各方面都能和人类比肩的人工智能，人类能干的脑力活它都能干，非常接近于人类的智能，但还需要脑科学的突破才能实现强人工智能。\n\n\
    哲学家、牛津大学人类未来研究所创始人尼克·波斯特洛姆（Nick Bostrom）把超人工智能定义为“在几乎所有领域都大大超过人类认知表现的任何智力”。首先，超人工智能能实现与人类智能等同的功能，即可以像人类智能实现生物上的进化一样，对自身进行重编程和改进，也就是“递归自我改进功能”；其次，尼克·波斯特洛姆还提到，“生物神经元的工作峰值速度约为200\
    \ Hz，比现代微处理器（约2 GHz）慢了整整7个数量级”，同时，“神经元在轴突上120 m/s的传输速度也远远低于计算机的通信速度”。这使得超人工智能的思考速度和自我改进速度将远远超过人类，人类作为生物的生理限制将统统不适用于超人工智能。\n\
    \n图1-1所示为弱人工智能机器人。\n\n![](Images/image_14_0_m.jpg)\n\n图1-1　弱人工智能机器人\n\n## [1.2　人工智能的起源与发展](../Text/contents.xhtml#z5)\n\
    \n人工智能作为一门学科，经历了兴起、形成和发展等多个阶段，本节将简单地介绍人工智能的起源和发展过程。\n\n### [1.2.1　人工智能的历史](../Text/contents.xhtml#z6)\n\
    \n人工智能的发展经历了4个阶段。\n\n1.人工智能的兴起\n\n1950年，一位名叫马文·明斯基（Marvin Minsky，后被称为“人工智能之父”）的学生与他的同学邓恩·埃德蒙（Dean\
    \ Edmunds）一起，建造了世界上第一台神经网络计算机，被看作人工智能的一个起点。同样是在1950年，被称为“计算机之父”的艾伦·图灵（Alan Turing）提出了一个举世瞩目的思想实验——图灵测试，按照图灵的设想，如果一台机器能够与人类开展对话而不能被辨别出机器身份，那么这台机器就具有智能。同样是这一年，艾伦·图灵还大胆预言了真正具备智能的机器的可行性。\n\
    \n1956年，在由达特茅斯学院举办的一次会议上，计算机专家约翰·麦卡锡（John McCarthy）提出了“人工智能”一词。后来，这被人们看作人工智能正式诞生的标志。就在这次会议后不久，约翰·麦卡锡从达特茅斯学院搬到了麻省理工学院。同年，马文·明斯基也搬到了这里，之后两人共同创建了世界上第一座人工智能实验室——MIT\
    \ AI实验室。值得注意的是，达特茅斯会议正式确立了人工智能这一术语，并且开始从学术角度对人工智能展开了严肃而专业的研究。在此之后不久，最早的一批人工智能学者和技术开始涌现。\n\
    \n1964年，首台聊天机器人诞生。MIT AI实验室的约瑟夫·魏岑鲍姆（Joseph Weizenbaum）教授开发了ELIZA聊天机器人，实现了计算机与人通过文本的交流。这是人工智能研究的一个重要方向。\n\
    \n1968年，首台人工智能机器人诞生。国际斯坦福研究所（SRI）研发的机器人Shakey能够自主感知、分析环境、规划行动并执行任务，这种机器人拥有类似人的感觉，如触觉、听觉等。\n\
    \n2.人工智能的低谷\n\n20世纪70年代，人工智能进入了一段痛苦而艰难的岁月。由于科研人员在人工智能的研究中对项目难度预估不足，不仅导致与美国国防高级研究计划署的合作计划失败，还让人工智能的前景蒙上了一层阴影。与此同时，社会舆论的压力也开始慢慢压向人工智能研究，导致很多研究经费被转移到了其他项目上。\n\
    \n当时，人工智能面临的技术瓶颈主要在3个方面：第一，计算机性能不足，导致早期很多程序无法在人工智能领域得到应用；第二，问题的复杂性，早期人工智能程序主要用于解决特定的问题，因为特定的问题对象少、复杂性低，可一旦问题复杂度上升，程序就立刻不堪重负；第三，数据量严重不足，当时不可能找到足够大的数据库来支撑程序进行深度学习，这很容易导致机器无法读取足够量的数据进行智能化。\n\
    \n因此，人工智能项目停滞不前，而1973年，英国数学家詹姆斯·赖特希尔（James Lighthill）编写了针对英国人工智能研究状况的报告，批评了人工智能在实现“宏伟目标”上的失败。由此，人工智能遭遇了长达多年的科研深渊。\n\
    \n3.人工智能的崛起与第二次低谷\n\n1980年，卡内基梅隆大学为数字设备公司设计了一套名为XCON的“专家系统”。专家系统是一种采用人工智能程序的系统，可以简单地理解为“知识库+推理机”的组合。同时，XCON是一套具有完整专业知识和经验的计算机智能系统，这套系统在1986年之前每年为公司节省了超过4\
    \ 000美元的经费。这种商业模式诞生后，衍生出了Symbolics、Lisp Machines和IntelliCorp、Aion等一系列硬件、软件公司。\n\
    \n不过，在仅仅7年之后，这个曾经轰动一时的人工智能系统就宣告退出历史舞台。到1987年时，苹果和IBM公司生产的台式机性能都超过了Symbolics等厂商生产的通用计算机。从此，专家系统风光不再。\n\
    \n4.人工智能的再次崛起\n\n从20世纪90年代中期开始，由于网络技术特别是互联网的发展，人工智能开始由单个智能主体研究转向基于网络环境下的分布式人工智能研究。其不但研究基于同一目标的分布式问题求解，而且研究多个智能主体的多目标问题求解，从而使得人工智能面向实用。此外，随着人工智能技术尤其是神经网络技术的逐步发展，以及人们对人工智能开始抱有客观、理性的认知，人工智能技术开始进入平稳发展时期。\n\
    \n1995年，发明家理查德·华莱士（Richard Wallace）开发了聊天机器人——人工语言互联网计算机实体（Artificial Linguistic\
    \ Internet Computer Entity，ALICE），在其中加入了自然语言，并抽取了数千个数据点，最终创造出类似人工智能的系统。\n\n1997年5月11日，IBM开发的计算机系统“深蓝”战胜了国际象棋世界冠军，在公众领域引发了现象级的AI话题讨论。这是人工智能发展的一个重要里程碑。\n\
    \n2000年，本田公司制造了“阿西莫”机器人，它可以表现出与人类相似的某些特性，并拥有基本的智能水平。它是最早的具备双足行走能力的类人型机器人。\n\n\
    2006年，杰弗里·辛顿（Geoffrey Hinton）在《科学》杂志发表论文，标志着神经网络的深度学习领域取得突破，人类又一次看到机器赶超人类的希望，这也是标志性的技术进步。\n\
    \n2011年，由IBM开发的人工智能程序“沃森”（Watson）参加了一档智力问答节目并战胜了两位人类冠军。沃森存储了2亿页数据，能够将与问题相关的关键词从看似相关的答案中抽取出来。这一人工智能程序已被IBM广泛应用于医疗诊断领域。\n\
    \n2016年和2017年，AlphaGo多次战胜围棋冠军。AlphaGo是由Google DeepMind开发的人工智能围棋程序，具有自我学习能力。它能够搜集大量围棋对弈数据和名人棋谱，学习并模仿人类下棋。图1-2所示为AlphaGo标识。\n\
    \n![](Images/image_17_0_m.jpg)\n\n图1-2　AlphaGo标识\n\n2017年，深度学习成为热门研究方向。AlphaGo\
    \ Zero（第四代AlphaGo）在无任何数据输入的情况下，自学围棋3天后便以100:0横扫了第二代AlphaGo Lee，学习40天后又战胜了在人类高手看来不可企及的第三代AlphaGo\
    \ Master。\n\n尽管人工智能研究与应用取得了不少成果，但是离全面推广应用还有很大的距离，还有许多问题有待解决，且需要与多学科的研究专家共同合作。未来人工智能的研究方向主要有人工智能理论、机器学习模型和理论、不精确知识表示及其推理、常识知识及其推理、人工思维模型、智能人机接口、多智能主体系统、知识发现与知识获取、人工智能应用基础等。\n\
    \n### [1.2.2　我国的人工智能发展现状](../Text/contents.xhtml#z7)\n\n我国人工智能技术攻关和产业应用虽然起步较晚，但是在国家多项政策和科研基金的支持与鼓励下，近年来发展势头迅猛。在我国政府的高度重视下，人工智能已上升为国家战略。《新一代人工智能发展规划》提出“到2030年，使中国成为世界主要人工智能创新中心”。目前，我国在基础研究方面已经拥有人工智能研发队伍和国家重点实验室等设施齐全的研发机构，并先后设立了各种与人工智能相关的研究课题，研发产出的数量和质量也有了很大提升，已取得许多突出成果。\n\
    \n伴随着人工智能研究热潮，我国人工智能产业化应用也蓬勃发展。智能产品和应用大量涌现，人工智能产品在医疗、商业、通信、城市管理等方面得到了快速应用。\n\n\
    2017年7月5日，百度首次发布人工智能开放平台的整体战略、技术和解决方案。这也是百度AI技术首次整体亮相。其中，对话式人工智能系统可让用户以自然语言对话的交互方式实现诸多功能；Apollo自动驾驶技术平台可帮助汽车行业及自动驾驶领域的合作伙伴快速搭建一套属于自己的完整的自动驾驶系统，是全球领先的自动驾驶生态。\n\
    \n2017年8月3日，腾讯公司正式发布了人工智能医学影像产品——腾讯觅影。同时，其宣布成立人工智能医学影像联合实验室。\n\n2017年10月11日，阿里巴巴首席技术官张建锋宣布成立全球研究院——达摩院。达摩院的成立，代表着阿里巴巴正式迈入全球人工智能等前沿科技的研发行列。\n\
    \n此外，科大讯飞在智能语音技术上处于国际领先水平；依图科技搭建了全球首个十亿级人像对比系统，在2017年美国国家标准与技术研究院组织的人脸识别技术测试中，成为第一个获得冠军的中国团队。\n\
    \n尽管我国多项技术处于世界领先地位，创新创业也日益活跃，但是整体水平与发达国家仍有较大差距。从细分的研究领域来看，最受国际人工智能人才青睐的领域为机器学习、数据挖掘和模式识别，中国人工智能人才则倾向投入遗传算法、神经网络和故障诊断方面，从技术领域来看，中国人工智能企业的应用技术更集中于视觉和语音，基础硬件占比偏小，而在核心算法及关键设备、高精尖零部件、技术工业、工业设计、大型智能系统、大规模应用系统以及基础平台等方面，我国与发达国家的差距还较为明显。\n\
    \n值得关注的是，目前我国已经具备人工智能产业发展的基础条件，未来十年内都将是人工智能技术加速普及的爆发期。人工智能专用芯片有望成为下一个爆发点，智能语音产业链已经逐渐成形，产业规模大幅提升。此外，人工智能具有显著的溢出效应，将带动其他相关技术的持续进步，助推传统产业转型升级和战略性新兴产业整体性突破。\n\
    \n## [1.3　人工智能的研究内容](../Text/contents.xhtml#z8)\n\n人工智能学科有着十分广泛和极其丰富的研究内容。不同的人工智能研究者从不同的角度对人工智能的研究内容进行了分类。例如，基于脑功能模拟、基于不同认知观、基于应用领域和应用系统、基于系统结构和支撑环境等。下面综合介绍一些得到诸多学者认同并具有普遍意义的人工智能研究的基本内容。\n\
    \n### [1.3.1　认知建模](../Text/contents.xhtml#z9)\n\n人类的认知过程是非常复杂的，作为研究人类感知和思维信息处理过程的一门学科，认知科学（或称思维科学）要研究人类在认知过程中是如何进行信息加工的。认知科学是人工智能的重要理论基础，涉及非常广泛的研究课题，除了美国心理学家浩斯顿（Houston）提出的知觉、记忆、思考、学习、语言、想象、创造、注意和问题求解等关联活动外，还会受到环境、社会和文化背景等方面的影响。人工智能不仅要研究逻辑思维，还要深入研究形象思维和灵感思维，使人工智能具有更坚实的理论基础，为智能系统的开发提供新思想和新途径。\n\
    \n### [1.3.2　知识表示](../Text/contents.xhtml#z10)\n\n知识表示、推理和知识应用是传统人工智能的三大核心研究内容。其中，知识表示是基础，推理实现问题求解，而知识应用是目的。知识表示是人工智能的一个重要研究课题，应用人工智能技术解决实际问题，就涉及各类知识的表示方法，它需要把人类知识概念化、形式化或模型化，常见的就是运用符号知识、算法和状态图等来描述待解决的问题。从逻辑上看，知识表示是一组描述事物的约定，可以看作将人类知识表示成机器能处理的数据结构。在人工智能应用中，知识表示是数据结构和控制结构及解释过程的结合，涉及计算机程序中存储信息的数据结构设计，并对这些数据结构进行智能推理演变的过程。目前，在人工智能中常见的6种知识表示有状态空间表示、问题归约表示、谓词逻辑表示、语义网络表示、框架表示以及过程表示。\n\
    \n### [1.3.3　知识应用](../Text/contents.xhtml#z11)\n\n人工智能能否获得广泛应用是衡量和检验其生命力的重要标志。20世纪70年代，正是专家系统的广泛应用使人工智能走出低谷，获得快速发展。后来的机器学习和近年来的自然语言理解应用研究取得重大进展，又促进了人工智能的进一步发展。当然，应用领域的发展离不开知识表示和推理等基础理论以及基本技术的进步。\n\
    \n### [1.3.4　推理](../Text/contents.xhtml#z12)"
  fmt: '

    # 内容提要


    本书主要讲述人工智能的基础知识与基础理论，并通过大量的人工智能应用帮助读者快速了解人工智能相关技术。本书共10章，分别为人工智能概述、人工智能基础知识、机器学习、深度学习、计算机视觉、自然语言处理、知识图谱、人工智能技术应用场景、智能机器人和人工智能的挑战与未来。本书内容丰富，讲解细致，注重技术发展变化。


    本书既可作为高校大数据专业、云计算专业、人工智能技术专业、信息管理专业、计算机网络专业的教材，又可作为人工智能与大数据爱好者的参考书。


    # 前言


    当今世界，全球数据量爆发式增长，大数据技术发展日新月异，对经济社会发展产生了非常深远的影响。以人工智能、大数据为代表的现代信息技术与人类生产生活高度融合。发展智能制造，抢占全球未来产业制高点，已成为各国共识。


    本书以“理论-实际应用”结合的方式深入地讲解了人工智能的基础知识和实现的基本技术，在内容设计上既有上课时教师的讲述部分，又有大量的典型案例，能够极大地激发学生在课堂上的学习积极性与主动创造性，让学生在课堂上跟上教师的思维，从而学到更多有用的知识和技能。


    本书特色如下。


    （1）全面而又深入浅出地介绍了人工智能的基础知识和实现的基本技术。


    （2）教学案例丰富，包含了配套的教学课件、习题答案等多种教学资源。


    （3）紧跟时代潮流，注重技术变化。


    （4）编写本书的教师都具有多年的教学经验，全书知识点讲解重难点突出，能够激发学生的学习热情。


