- raw: '人脸识别，特指利用分析比较人脸视觉特征信息进行身份鉴别的计算机技术。人脸识别是一项热门的计算机技术研究领域，其研究项目包括人脸追踪侦测、自动调整影像放大、夜间红外侦测、自动调整曝光强度。


    人脸识别技术会基于人的脸部特征，对输入的人脸图像或者视频流进行判断。首先，判断其是否存在人脸，如果存在人脸，则进一步识别每张脸的位置、大小和各个主要面部器官的位置信息；其次，依据这些信息，进一步提取每张人脸中所蕴含的身份特征，并将其与已知的人脸进行对比，从而识别每张人脸的身份。


    人脸识别系统，尤其是人脸大数据系统，无论是在日常生活中，还是在商业运作上都是最重要的系统之一，它能够对个人大数据实现更大化地整合，甚至重建信用体系规则。


    5.虹膜识别


    人类的眼睛结构由巩膜、虹膜、瞳孔3部分构成。虹膜是位于黑色瞳孔和白色巩膜之间的圆环状部分，其中包含很多相互交错的斑点、细丝、冠状、条纹、隐窝等的细节特征。这些特征决定了虹膜特征的唯一性，能够用于身份识别。虹膜的形成由基因决定，人体基因表达决定了虹膜的形态、生理、颜色和总的外观。人类发育到8个月左右，虹膜就基本上发育成熟了，进入了相对稳定的时期，除了极少见的反常状况、身体或精神上大的创伤可能造成虹膜外观上的改变外，虹膜特征可以保持数十年没有变化。此外，虹膜是外部可见的，但同时属于内部组织，位于角膜后面，要改变虹膜外观，需要非常精细的外科手术，而且要冒着视力损伤的危险。虹膜的高度独特性、稳定性及不可更改的特点，是虹膜可用作身份鉴别的基础。


    在包括指纹在内的所有生物识别技术中，虹膜识别是当前应用最为方便和精确的一种。虹膜识别技术被广泛认为是21世纪最具有发展前途的生物识别技术，未来的安防、国防、电子商务等多个领域的应用，也必然会以虹膜识别技术为发展重点。这种趋势已经在全球各地的各种应用中逐渐开始显现出来，市场应用前景非常广阔。


    6.智能信息检索技术


    数据库系统是存储某个学科大量事实的计算机系统，随着应用的进一步发展，存储的信息量越来越大，因此解决智能检索的问题便具有实际意义。智能信息检索系统应具有如下功能。


    （1）能理解自然语言，允许用自然语言提出各种询问。


    （2）具有推理能力，能根据存储的事实，演绎出所需的答案。


    （3）具有一定的常识性知识，以补充学科范围的专业知识。系统会根据这些常识演绎出更易理解的答案。


    实现这些功能要应用人工智能的方法。据此前公布的信息显示，百度已经建成全球规模最大的深度神经网络，这一称为百度大脑的智能系统，目前可以理解分析200亿个参数，达到了两三岁儿童的智力水平。随着硬件成本的降低和技术的进步，在不远的未来，使用计算机模拟一个10～20岁人类的智力是一定可以实现的事情。


    7.智能控制


    智能控制是在无人干预的情况下能自主地驱动智能机器，实现控制目标的自动控制技术。控制理论发展至今已有100多年的历史，经历了经典控制理论和现代控制理论的发展阶段，已进入大系统理论和智能控制理论阶段。智能控制理论的研究和应用是现代控制理论在深度和广度上的拓展。20世纪80年代以来，信息技术、计算技术的快速发展及其他相关学科的发展，也推动了控制科学与工程研究的不断深入，控制系统向智能控制系统的发展已成为一种趋势。


    对于许多复杂的系统而言，难以建立有效的数学模型，可用常规的控制理论去进行定量计算和分析，而必须采用定量方法与定性方法相结合的控制方式。定量方法与定性方法相结合的目的是，要由机器用类似于人类的智慧和经验来引导求解过程。因此，在研究和设计智能系统时，研究重点不是放在数学公式的表达、计算和处理方面，而是放在对任务和现实模型的描述、符号和环境的识别以及知识库和推理机的开发上，即智能控制的关键问题不是设计常规控制器，而是研制智能机器的模型。


    此外，智能控制的核心在于高层控制，即组织控制。高层控制指对实际环境或过程进行组织、决策和规划，以实现问题求解。为了完成这些任务，需要采用符号信息处理、启发式程序设计、知识表示、自动推理和决策等有关技术。这些问题求解过程与人脑的思维过程有一定的相似性，即具有一定程度的智能。


    随着人工智能和计算机技术的发展，已经有可能把自动控制和人工智能以及系统科学中一些有关学科分支（如系统工程、系统学、运筹学、信息论）结合起来，建立一种适用于复杂系统的控制理论和技术。智能控制正是在这种条件下产生的，它是自动控制技术的最新发展阶段，也是用计算机模拟人类智能进行控制的研究领域。


    ### [10.3.3　人工智能未来的应用趋势](../Text/contents.xhtml#z247)


    人工智能未来的几大应用趋势是基础设施的升级、人机协同的技术演进以及应用场景的延伸。


    1.基础设施升级，拓展人工智能应用场景


    2019年，我国正式进入5G商用元年。作为具备高带宽、低时延、广连接等特性的新一代通信技术，5G正在成为产业变革、万物互联的新基础设施。


    首先，5G可以支撑大量设备实时在线和海量数据的传输，使得企业可获得的数据量、数据实时性大幅度提升，为更多人工智能应用提供了可能。其次，随着5G部署范围的拓展，基于5G的超高清视频等应用将迎来增长，人工智能在其中大有用武之地。


    例如，大量的工业生产现场不具备建设高带宽有线网络的条件，传统的Wi-Fi等无线网络也无法满足带宽要求，无法通过高清视频监控实现对产线故障、人员违规、安全风险等异常状况的实时监控和识别预警。而5G网络提供了新的解决方案，基于5G网络还可以结合虚拟现实/增强现实技术，对设备故障进行远程专家诊断和运维。


    此外，边缘计算也是5G时代的重要特征。边缘端大量智能终端设备的爆发，使得传统的以云端为核心的集中式数据处理方式无法满足需求，导致边缘计算兴起。随着数据更多地在终端进行处理和应用，人工智能将广泛落地在边缘侧，将会带来边缘智能（Edge
    Intelligence）的崛起。


    2.人机协同的技术演进，带来全新业务模式


    按照人工智能解决问题的能力划分，从识别—理解—分析—决策—行动的链条来看，人工智能的发展可以分为3个阶段：感知智能—认知智能—行动智能。


    人工智能技术的目标是，让机器在整个从识别到行动的链条上模拟甚至超越人的能力，但在很多复杂场景下，让机器完全替代人去解决问题并不现实。考虑到能力范围、工作效率、成本优化等因素，把人和机器作为整体部署的人机协同模式将成为未来的主流。


    人机协同是通过人机交互实现人类智能与机器智能的结合。具体而言，人机协同的模式会以知识图谱为支撑进行推理、推荐，并进行人和机器资源的合理配置，解决复杂问题。根据场景需求的不同，具体的人机交互方式包括冗余、互补和混合3种方式。


    人机协同已在多个行业中开始渗透和落地。例如，在智慧餐厅场景中，可以运用人和机器的交互来提高客户满意度。机器人可以和服务员共同配合，共同完成迎宾、领位、点餐、送餐、收餐等服务环节。又如，在智慧公安场景中，知识图谱中有16亿实体，数据量巨大，要想从中挖掘隐性关系和潜在线索，如果仅依靠机器进行全景搜索将耗费大量时间，此时，可以采用人机协同的模式，结合刑侦专家的经验和洞察力，判断出重点可疑方向，并由机器进行深入搜索，这可以大幅度提升效率。


    现阶段，人机协同的进展还是以人为主，由人来判断场景需求，与机器的能力进行匹配。其未来的方向是实现机器自主判断场景、调度资源，并与人类相互协同。


    3.应用场景的延伸，引领产业智能互连


    随着企业数字化转型和产业互联网的不断推进，产业智能互连的数据基础设施不断完善。产业互连实现了产业链各环节的数据打通，在此基础上，人工智能的应用将从企业内部智能化延伸到产业智能化，实现采购、制造、流通等环节的智能协同，进一步发挥产业互联网的价值，提升产业整体效率。


    例如，以滴滴出行为代表的网约车平台就是一个简化版的产业智能互连样本。每个网约车司机都是一个小经营者，通过滴滴出行的智能调度平台建立与终端用户的连接，平台的人工智能预测、推荐、调度等算法实现了用车需求与运力的高效匹配，这是单个司机所无法做到的。


    又如，在零售行业，“双十一”是典型的产业智能互连的应用，千万商家和数亿消费者参与其中，在制造、电商、物流、金融等产业互连基础设施的支撑下，结合人工智能等技术，高效完成了海量的线上交易和履约。例如，商家可以参考电商平台的销量趋势预测数据提前进行备货，并结合库存调度系统和物流服务网络，将订单智能分配到配送路径最短的仓库和线下门店进行发货。


    随着基础设施的成熟和技术渗透，未来将有更多的行业走向产业智能互连。


    ## [10.4　小结](../Text/contents.xhtml#z248)


    （1）人工智能未来的技术发展方向主要包括机器视觉、指纹识别、掌纹识别、人脸识别、虹膜识别、智能信息检索技术以及智能控制等。


    （2）人工智能在数据、算法模型可解释性、业务场景理解、服务方式、投入产出比等方面都面临着一系列的挑战。


    （3）人工智能的兴起与快速演进，对教育与就业、隐私与安全、社会公平等各个方面产生了深远的影响，在为人们带来极大便利的同时蕴藏着巨大的风险，将挑战既有的社会价值观，甚至挑战人类本身存在的价值。


    （4）人工智能未来的几大应用趋势是基础设施的升级、人机协同的技术演进以及应用场景的延伸。


    ## [10.5　习题](../Text/contents.xhtml#z249)


    （1）简述人工智能未来的技术发展方向。


    （2）简述人工智能面临的挑战。


    （3）简述人工智能未来的几大应用趋势。


