  trans: '


    医学影像诊断是研究借助某种介质（如 X 射线、电磁场、超声波等）与人体相互作用，把人体内部组织器官结构、密度以影像方式表现出来，供诊断医师根据影像提供的信息进行判断，从而对人体健康状况进行评价的一门科学。在传统医疗场景中，要培养出优秀的医学影像专业医生，耗费时间长、投入成本大。另外，人工读片时主观性太大，信息利用不足，在判断过程中容易出现误判。人工智能技术在医疗影像的应用主要指通过计算机视觉技术对医疗影像进行快速读片和智能诊断。人工智能技术能够通过快速准确地标记特定异常结构来提高图像分析的效率，以供放射科医师参考。使用人工智能技术能够提高图像分析效率，可让放射学家将精力聚焦在需要更多解读或判断的内容审阅上，从而缓解放射科医生供给缺口问题。2018
    年，在全球首场神经影像人工智能人机大赛上，头部疾病 MRI、CT 影像人工智能辅助诊断机器人“BioMind 天医智”以更高的读片准确率和更快的速度，击败了由
    25 名全球神经影像领域顶尖专家、学者、优秀临床医生组成的战队。将人工智能技术应用于医疗领域，让人们不禁期待它在提升医疗服务质量和效率、减轻患者就医压力方面的作用。


    ### 2.基于语音识别技术的人工智能虚拟助理

    电子病历是记录医生与病人的交互过程以及病情发展情况的电子化病情档案，包含病案首页、检验结果、住院记录、手术记录、医嘱等信息。基于语音识别技术的人工智能虚拟助理可以为医生的诊断和治疗提供极大的方便。例如，语音识别技术可以帮助医生书写病历，为普通用户在医院导诊提供了极大的便利。通过语音识别、自然语言处理等技术，将患者的病症描述与标准的医学指南作对比，从而为用户提供医疗咨询、自诊、导诊等服务。又如，智能语音录入可以解放医生的双手，帮助医生通过语音输入完成查阅资料、文献精准推送等工作，并将医生口述的医嘱按照患者基本信息、检查史、病史、检查指标、检查结果等形式形成结构化的电子病历，可以大幅提升医生的工作效率。


    ### 3.智能医用机器人

    医用机器人种类很多，按照其不同用途，可分为临床医疗用机器人、护理机器人、医用教学机器人和为残疾人服务机器人等。随着我国对医疗领域机器人应用的逐渐认可和各诊疗阶段应用的普及，医用机器人尤其是手术机器人，已经成为机器人领域的“高需求产品”。在传统手术中，医生需要长时间手持手术工具并保持高度紧张状态，而手术机器人的广泛使用使医疗技术有了极大的提升。手术机器人视野更加开阔，手术操作更加精准，有利于患者伤口愈合，能够减小创伤面和失血量，减轻疼痛等。


    ### 4.基于人工智能的药物研发

    人工智能助力药物研发可大大缩短药物研发时间、提高研发效率并控制研发成本。目前，我国制药企业纷纷布局人工智能领域，主要应用在新药发现和临床试验阶段。对于药物研发工作者来说，他们没有大量的时间和精力关注所有新发表的研究成果和大量新药的信息，而人工智能技术恰恰可以从这些散乱无章的海量信息中提取出能够推动药物研发的知识，以及新的可以被验证的假说，从而加速药物研发的过程。


    ### 5.基于大数据处理的智能健康管理

    通过人工智能的应用，健康管理服务也取得了突破性的发展。例如，通过智能设备进行身体检测，血压、心电、脂肪率等多项健康指标便能被快速检测出来，将采集到的健康数据上传到云数据库形成个人健康档案，即可通过数据分析制定个性化健康管理方案。此外，智能健康管理系统可以通过大数据平台收集用户个人生活习惯的数据，再经过人工智能技术进行数据处理，最终对用户整体状态给予评估，根据个性化健康管理方案来辅助健康管理人员帮助用户规划日常健康安排，进行健康干预等。人工智能技术还能够依托可穿戴设备和智能健康终端，持续监测用户生命体征，提前预测险情并进行处理。


    ### 8.3.5　智能医学的发展

    由于人工智能在医疗领域的应用有特殊性，包括病例的复杂程度和多样性，导致目前机器学习还未能达到人们需要的精准度。想要把人工智能与医疗大规模结合并应用到临床，恐怕还难以在短时间内实现。

    但是随着技术的发展和数据的积累，可以预见，智能医学的发展与应用是大势所趋，随着人工智能技术的不断发展，终究会有一天，机器会逐渐取代医生这一传统的知识密集型职业。


    ## 8.4　智能制造

    智能化是制造自动化的发展方向，是先进制造业发展的重要形态，目前，制造过程中的各个环节几乎都在广泛应用人工智能技术。


    ### 8.4.1　智能制造的概念

    智能制造（Intelligent Manufacturing，IM）是一种由智能机器和人类专家共同组成的人机一体化智能系统，它能在制造过程中进行智能活动，如分析、推理、判断、构思和决策等。通过人与智能机器的合作，可以扩大、延伸和取代部分人类专家在制造过程中的脑力劳动。

    从技术上看，智能制造是基于物联网、云计算、大数据等新一代信息技术，贯穿于设计、生产、管理、服务等制造活动的各个环节，具有信息深度自感知、智慧优化自决策、精准控制自执行等功能的先进制造过程、系统和模式的总称。因此，智能制造把制造自动化的概念更新并扩展到柔性化、智能化和高度集成化。但受限于人工智能技术的发展水平与制造业应用尚未成熟，目前的智能制造还远未达到“自适应、自决策、自执行”的完全智能化阶段，智能化制造仍是制造业未来的主要发展目标。


    ### 8.4.2　智能制造的特征

    智能制造以智能工厂为载体，以全流程的智能化为切入点，以端对端的数据流为基础，以网络互连为支撑。智能制造不仅采用了新型制造技术和装备，还能将迅速发展的信息通信技术渗透到工厂，在制造业领域构建信息物理系统，从而彻底改变制造业的生产组织方式和人际关系，并带来制造方式和商业模式的创新转变，甚至可以说这是一种生产方式的变革和革命。智能制造具有以下
    5 个特征。

    1.生产设备网络化

    生产设备网络化主要依靠物联网技术来实现。物联网是指通过各种信息传感设备，实时采集任何需要监控、连接、互动的物体或过程等各种需要的信息，其目的是实现物与物、物与人、所有物品与网络的连接，方便识别、管理和控制。例如，在制造企业车间中，数控编程人员可以在自己的计算机上进行编程，将加工程序上传至服务器，设备操作人员可以在生产现场通过设备控制器下载所需要的程序，待加工任务完成后，再通过网络将数控程序回传至服务器，由程序管理员或工艺人员进行比较或归档，从而在整个生产过程中实现网络化、可追溯化管理。

    2.生产文档无纸化

    生产文档进行无纸化管理后，工作人员在生产现场即可快速查询、浏览、下载所需要的生产信息，生产过程中产生的资料能够即时进行归档保存，从而杜绝了文件、数据丢失，进一步提高了生产准备效率和生产作业效率，实现了绿色、无纸化生产。

    3.生产数据可视化

    生产数据可视化主要依靠大数据技术来实现。在生产现场，每隔几秒就收集一次数据，包括设备开机率、主轴运转率、主轴负载率、运行率、故障率、生产率、设备综合利用率、零部件合格率、质量百分比等。利用这些数据可以实现很多形式的分析，在生产工艺改进方面，在生产过程中使用这些大数据能分析整个生产流程，了解每个环节是如何执行的。例如，一旦有某个流程偏离了标准工艺，就会产生一个报警信号，能更快速地发现错误或者瓶颈所在，也就能更容易地解决问题。利用大数据技术，还可以对产品的生产过程建立虚拟模型，仿真并优化生产流程，当所有流程和绩效数据都能在系统中重建时，这种透明度将有助于制造企业改进其生产流程。又如，在能耗分析方面，在设备生产过程中利用传感器集中监控所有的生产流程，能够发现能耗的异常或峰值，由此便可在生产过程中优化能源的消耗，对所有流程进行分析以降低能耗。

    4.生产过程透明化

    在机械、汽车、航空、船舶、轻工、家用电器和电子信息等离散制造行业，企业发展智能制造的核心目的是拓展产品价值空间，侧重从单台设备自动化和产品智能化入手，基于生产效率和产品效能的提升来实现价值增长。因此，智能工厂建设模式为推进生产设备（生产线）智能化，通过引进各类符合生产所需的智能装备，建立了基于制造执行系统的车间级智能生产单元，提高了精准制造、敏捷制造、透明制造的能力。

    5.生成现场无人化

    在离散制造企业生产现场，数控加工中心智能机器人和三坐标测量仪及其他所有柔性化制造单元进行自动化排产调度，工件、物料、刀具进行自动化装卸调度，可以达到无人值守的全自动化生产模式。在不间断单元自动化生产的情况下，可以设置生产任务的优先和暂缓，远程查看管理单元内的生产状态情况。如果在生产中遇到问题，则可以立刻解决并及时恢复自动化生产。整个生产过程无须人工参与，真正实现了“无人”智能生产。


    ### 8.4.3　智能制造中的人工智能应用

    智能制造中的关键技术主要有智能决策、智能管理、智能物流与供应链、智能研发、智能产线、智能车间、智慧工厂、智能产品、智能装备以及智能服务等。

    1.智能决策

    企业在运营过程中会产生大量的数据，如合同、回款、费用、库存、现金、产品、客户、投资、设备、产量、交货期等，这些数据一般是结构化的数据，可以进行多维度的分析和预测。同时，应用这些数据可以提炼出企业的关键绩效指标（Key
    Performance Indicator，KPI），并与预设的目标进行对比。

    2.智能管理

    制造企业核心的运营管理系统包括人力资产管理系统、客户关系管理系统、企业资产管理系统、能源管理系统、供应商关系管理系统、企业门户、业务流程管理系统等。要想实现智能管理和智能决策，最重要的条件是基础数据准确和主要信息系统无缝集成。

    3.智能物流与供应链

    制造企业内部的采购、生产、销售流程都伴随着物料的流动，因此，越来越多的制造企业在重视生产自动化的同时，也越来越重视物流自动化，如自动化立体仓库、AGV、智能吊挂系统等得到了广泛应用；而在制造企业和物流企业的物流中心，智能分拣系统、堆垛机器人、自动轨道系统的应用日趋普及。仓储管理系统（Warehouse
    Management System，WMS）和运输管理系统（Transport Management System，TMS）也受到了制造企业和物流企业的普遍关注。

    4.智能研发

    研发对制造企业来讲至关重要。企业要开发智能产品，需要多学科的协同配合；要缩短产品研发周期，需要深入应用仿真技术，建立虚拟数字化样机，实现多学科仿真，通过仿真减少实物试验；需要贯彻标准化、系列化、模块化的思想，以支持大批量客户定制或产品个性化定制；需要将仿真技术与试验管理结合起来，以提高仿真结果的置信度。

    5.智能产线

    自动化生产线就是智能产线的一种形式。很多行业的企业高度依赖自动化生产线，如钢铁、化工、制药、食品饮料、烟草、芯片制造、电子组装、汽车整车和零部件制造等。自动化生产线可以分为刚性自动化生产线和柔性自动化生产线。为了提高生产效率，工业机器人、吊挂系统在自动化生产线上的应用越来越广泛。

    6.智能车间

    一个车间通常有多条生产线，要实现车间的智能化，需要对生产状况、设备状态、能源消耗、生产质量、物料消耗等信息进行实时采集和分析，进行高效排产和合理排班，来提高设备利用率。因此，无论是哪个制造行业，制造执行系统（Manufacturing
    Execution System，MES）都是企业的必然选择。MES 是一套面向制造企业车间执行层的生产信息化管理系统，它能通过信息传递对从订单下达到产品完成的整个生产过程进行优化管理。因此，MES
    可以为企业提供包括制造数据管理、计划排程管理、生产调度管理、库存管理、质量管理、人力资源管理、工作中心/设备管理、工具工装管理、采购管理、成本管理、项目看板管理、生产过程控制、底层数据集成分析、上层数据集成分解等模块，并为企业打造一个扎实、可靠、全面、可行的制造协同管理平台。

    7.智慧工厂

    智慧工厂也称智能工厂，它重点研究智能化生产系统和过程，以及网络化分布式生产设施的实现，是现代工厂信息化发展的新阶段，与智能制造密不可分。所谓智慧工厂，简单来说就是指将工厂内所有的机器、设备，通过物联网等形式，对设备所产生的数据进行收集、分析，最终实现生产系统的数字化、高效化、智能化，并在此基础之上产生新的附加价值。在智慧工厂中，一个工厂通常由多个车间组成，大型企业可有多个工厂。作为智慧工厂，不仅生产过程应实现自动化、透明化、可视化、精益化，产品检测、质量检验和分析、生产物流也应当与生产过程实现闭环集成。目前，随着工业互联网、工业
    4.0、物联网、5G、人工智能等概念的流行以及相应技术的发展和推动，许多制造业大国，包括我国在内，都开始了智慧工厂建设的实践，以解决传统制造业生产管理效率低、设备和人力成本高的顽疾。

    8.智能产品

    任何制造企业都应该思考如何在产品上加入智能化的单元，以提升产品的附加值。典型的智能产品包括智能手机、可穿戴设备、无人机、智能汽车、智能家电、智能售货机等。

    9.智能装备

    智能装备指具有感知、分析、推理、决策、控制功能的制造装备，它是先进制造技术、信息技术和智能技术的集成和深度融合。智能装备也是一种智能产品，可以补偿加工误差，提高加工精度。

    10.智能服务

    智能服务是一种大数据技术，它基于传感器和物联网感知产品的状态，从而进行预防性维修维护，及时帮助客户更换备品、备件，甚至可以通过了解产品运行的状态为客户带来商业机会。智能服务还可以采集产品运营的大数据，辅助企业进行市场营销的决策。


    ### 8.4.4　智能制造的发展

    智能制造代表着先进制造技术与信息化的融合，它的起源可以追溯至 20 世纪中叶，从 20 世纪中叶到 20 世纪 90 年代中期的数字化制造以计算、通信和控制应用为主要特征。从
    20 世纪 90 年代中期发展至今的网络化制造，伴随着互联网的大规模普及应用，制造业进入了以万物互联为主要特征的网络化阶段。当前，在大数据、云计算、机器视觉等技术突飞猛进的基础上，人工智能逐渐融入制造领域，制造业开始步入以新一代人工智能技术为核心的智能化制造阶段。

    当前，智能制造日益成为未来制造业发展的重大趋势和核心内容，是加快发展方式转变，促进工业向中高端迈进，建设制造强国的重要举措，也是新常态下打造新的国际竞争优势的必然选择。

    从全球范围来看，除了美国、德国和日本走在全球智能制造前端之外，其余国家也在积极布局智能制造发展。例如，欧盟将发展制造业作为重要的战略，在 2010 年制定了第七框架（FP7）的制造云项目，并在
    2014 年实施欧盟“2020 地平线计划”，将智能型先进制造系统作为创新研发的优先项目。同时，大数据、云计算等一批前端科技的发展引发了制造业加速向智能化的转型升级。2017
    年，具有连接和感知能力的机器人继续引领智能制造发展，随着人工智能技术的进步，工业机器人也变得更加智能，并能够感知、学习和决策。结合当前全球智能制造的发展现状和发展趋势，保守估计未来几年全球智能制造行业将保持
    15%左右的年均复合增速，预计到 2023 年，全球智能制造的产值将达到 23 108 亿美元左右。


    ## 8.5　小结

    （1）智慧交通指在智能交通的基础上，融入物联网、云计算、大数据、移动互连等技术，汇集交通信息，提供实时交通数据下的交通信息服务，是未来交通系统的发展方向。

    （2）智慧电子商务简称智慧电商，它可以利用网络技术、信息安全等先进手段，打造电商云环境，并将电商实体、消费市场、交易事务、信息流、资金流、物流等基本要素整合起来，从而实现金融、保险、物流等商业应用的实时感知、动态信息发布以及智能商务管理等功能，最终提升电商管理水平。

    （3）智能医学即通过人工智能的方法，辅助或替代人类进行医疗行为的科学。

    （4）智能化是制造自动化的发展方向，是先进制造业发展的重要形态。智能制造是一种由智能机器和人类专家共同组成的人机一体化智能系统，它能在制造过程中进行智能活动，诸如分析、推理、判断、构思和决策等。通过人与智能机器的合作，可以扩大、延伸和取代部分人类专家在制造过程中的脑力劳动。


    ## 8.6　习题

    （1）简述智慧交通的概念。

    （2）简述智慧电商的概念。

    （3）简述智能医学的概念。

    （4）简述智能制造的概念。


    # 第 9 章　智能机器人

    【本章导读】

    当前，人工智能与机器人的研究与应用越来越受人们欢迎，人类生活的方方面面都有人工智能机器人的身影。本章主要介绍机器人的实现原理以及智能机器人的应用。

    【本章要点】

    1 机器人的实现原理

    2 机器人的应用

    3 智能机器人的前景

    4 智能机器人的核心技术

    5 智能机器人的应用


    ## 9.1　智能机器人概述

    信息技术的发展为智能机器人技术的发展奠定了坚实基础，全球机器人产业正在迈入智能化的新时代。当前，以图像识别、语音识别、自然语言理解等为代表的人工智能技术在实用化上的突破，带动了机器人感知、交互、决策能力的显著提升。目前的人脸识别准确率已经高达
    99.55%，超过准确率为 97.35%的人眼识别率，语音输入辨识成功率也达到 97%以上，机器人已经具备了“看得见、听得懂”的技术条件，同时，随着深度学习、无监督学习的逐步应用，机器人具备了更为关键的“思考”能力，机器人开始真正迈入智能化的新时代。


    ### 9.1.1　机器人简介

    机器人的组成与人类极为类似，一个典型的机器人有一套可移动的身体结构、一部类似于电动机的装置、一套传感系统、一个电源和一个用来控制这些要素的计算机“大脑”。从本质上讲，机器人是由人类制造的“动物”，它是模仿人类和动物行为的机器。

    1.机器人的物理结构

    机器人的定义范围很广，大到为工厂服务的工业机器人，小到居家打扫的机器人。机器人是一种自动化的机器，它具备一些与人或其他生物相似的能力，如感知能力、规划能力、动作能力和协同能力，是一种具有高度灵活性的自动化机器。

    从物理结构上看，首先，几乎所有机器人都有一个可以移动的身体。有些拥有的只是机动化的轮子，而有些则拥有大量可移动的部件，这些部件一般是由金属或塑料制成的。与人体用关节连接骨骼类似，机器人的轮与轴是用某种传动装置连接起来的。有些机器人使用电动机和螺线管作为传动装置，有一些则使用液压系统，还有一些使用气动系统。


    '
