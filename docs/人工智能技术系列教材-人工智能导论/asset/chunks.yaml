    ### 3.3.3　降维算法

    降维就是一种针对高维度特征进行的数据预处理方法，是应用非常广泛的数据预处理方法。


    #### 1. 降维算法概述

    降维算法指对高维度的数据保留下最重要的一些特征，去除噪声和不重要的特征，从而实现提升数据处理速度的目的。在实际的生产和应用中，在一定的信息损失范围内，降维可以节省大量的时间和成本。


    机器学习领域中所谓的降维就是指采用某种映射方法，将原高维空间中的数据点映射到低维度的空间中。降维的本质是学习一个映射函数`f:x→y`，其中`x`是原始数据点的表达，目前多使用向量表达形式；`y`是数据点映射后的低维向量表达，通常`y`的维度低于`x`的维度（当然，提高维度也是可以的）；`f`可能是显式的/隐式的、线性的/非线性的。


    #### 2. 降维算法的分类

    降维常用的算法有主成分分析（`Principal Component Analysis`，`PCA`）法和因子分析（`Factor Analysis`，`FA`）法。


    ##### （1）主成分分析法

    主成分分析法是一种使用最广泛的数据降维算法，它试图在保证数据信息丢失最少的原则下，对多个变量进行最佳综合简化，即对高维变量空间进行降维处理。其主要思想是将
    n 维特征映射到 k 维上，k 维特征是全新的正交特征，也被称为主成分，是在原有 n 维特征的基础上重新构造出来的。`PCA`法的工作就是从原始的空间中顺序地找一组相互正交的坐标轴，新的坐标轴的选择与数据本身是密切相关的。转换坐标系时，以方差最大的方向作为坐标轴方向，因为数据的最大方差给出了数据的最重要的信息。


    ##### （2）因子分析法

    因子分析法是从假设出发。它假设所有的自变量 x 出现的原因是其背后存在一个潜变量 f（即因子），在这个因子的作用下，x 可以被观察到。因子分析法是通过研究变量间的相关系数矩阵，把这些变量间错综复杂的关系归结成少数几个综合因子，并据此对变量进行分类的一种统计分析方法。因子分析法会将原始变量转换为新的因子，这些因子之间的相关性较低，而因子内部的变量相关程度较高。例如，若一个学生的数学、化学、物理都考了满分，则认为这个学生理性思维较强，理性思维就是一个因子，在这个因子的作用下，理科的成绩才会那么高。


    因子分析法有几个主要目的：一是进行结构的探索，在变量之间存在高度相关性的时候希望用较少的因子来概括其信息；二是把原始变量转换为因子得分后，使用因子得分进行其他分析，从而简化数据，如聚类分析、回归分析等；三是通过每个因子得分计算出综合得分，对分析对象进行综合评价。


    #### 3. 降维算法的应用场景

    降维算法通常应用于数据压缩与数据可视化中。因为数据压缩或者数据降维首先能够减少内存或者硬盘的使用，如果内存不足或者计算的时候出现内存溢出等问题，则需要使用降维算法获取低维度的样本特征，同时数据降维能够加快机器学习的速度。在数据可视化的情况下，可能需要查看样本特征，但是高维度的特征根本无法观察，此时，可以将样本的特征降维到二维或者三维，这样就可以采用可视化的方法观察数据。


    ### 3.3.4　决策树算法

    决策树算法是应用最广的归纳推理算法之一。它是一种逼近离散值函数的方法，对噪声数据有很好的鲁棒性且能够学习析取表达式，决策树学习方法会搜索一个完整表示的假设空间，从而避免受限于假设空间的不足，决策树学习的归纳偏置是优先选择较小的树。


    #### 1. 决策树算法概述

    通过决策树学习到的函数被表示为一棵决策树，学习得到的决策树也能再被表示为多个决策树选择的规则，以提高可读性。决策树算法是最流行的归纳推理算法之一，已经被成功地应用到从学习医疗诊断到学习评估贷款申请的信用风险等的广阔应用领域中。


    典型的决策树示例如图 3-8 所示。


    ![](img/cutq_62_37483_m.jpg)


    图 3-8　典型的决策树示例


    图 3-8 所示为一棵结构简单的决策树，用于预测贷款用户是否具有偿还贷款的能力。贷款用户主要具备是否拥有房产、是否结婚和平均月收入这 3 个属性。每一个内部节点都表示一个属性条件判断，叶子节点表示贷款用户是否具有偿还能力。例如，用户甲没有房产，没有结婚，月收入
    5 000 元。通过决策树的根节点判断，用户甲符合右边分支（未拥有房产）；再判断是否结婚，用户甲符合左边分支（未婚）；最后判断平均月收入是否大于 4 000
    元，用户甲符合左边分支（月收入大于 4 000 元），该用户落在“可以偿还”的叶子节点上。所以预测用户甲具备偿还贷款的能力。


    尽管已经开发的各种决策树算法有各自的能力和要求，但是通常决策树算法最适合应用在具有以下 5 种特征的问题上。


    （1）实例由属性-值对表示。实例是用一系列固定的属性和它们的值来描述的，在最简单的决策树学习中，每一个属性取少数的离散的值。同时，扩展的算法允许处理值域为实数的属性。

    （2）目标函数具有离散的输出值。图 3-8 所示的典型的决策树示例给每个实例赋予一个布尔型的分类。决策树算法很容易扩展到学习有两个以上输出值的函数。一种更强有力的扩展算法允许学习具有实数值输出的函数，尽管决策树在这种情况下的应用不是特别常见。

    （3）可能需要析取的描述。图 3-8 所示的决策树很自然地代表了析取表达式。

    （4）训练数据包含错误。决策树算法对错误有很好的鲁棒性，无论是训练样例所属的分类错误还是描述这些样例的属性值错误。

    （5）训练数据包含缺少属性值的实例。决策树算法甚至可以在有未知属性值的训练样例中使用。


    很多实际的问题具有如上所述的特征，所以决策树算法已经被应用到很多实际问题中。


    随机森林指的是利用多棵树对样本进行训练并预测的一种分类器。随机森林就是由多棵`CART`树构成的。随机森林在两方面具有随机性：一是样本的随机性，对于每棵树，它们使用的训练集是从总的训练集中有放回采样出来的，即总的训练集中的有些样本可能多次出现在一棵树的训练集中，也可能从未出现在一棵树的训练集中；二是特征的随机性，在训练每棵树的节点时，使用的特征是从所有特征中按照一定比例随机地无放回抽取出来的。


    #### 2. 决策树算法的流程

    决策树通过从根节点排列（Sort）到某个叶子节点来分类实例，叶子节点即为实例所属的分类。树上的每一个节点说明对实例的某个属性（Attribute）的测试，并且该节点的每一个后继分支对应于该属性的一个可能值。分类实例的方法是从这棵树的根节点开始，测试这个节点指定的属性，按照给定实例的该属性值对应的树枝向下移动，并在以新节点为根的子树上重复这个过程。


    决策树是附加概率结果的一个树状的决策图，是直观地运用统计概率分析的图形分析法。机器学习中的决策树是一个预测模型，它表示对象属性和对象值之间的一种映射，树中的每一个节点表示对象属性的判断条件，其分支表示符合节点条件的对象。树的叶子节点表示对象所属的预测结果。


    #### 3. 决策树算法的应用

    决策树算法可以应用在很多领域中，例如，根据疾病分类患者、根据起因分类设备故障、根据拖欠支付的可能性分类贷款申请。对于这些问题，决策树算法的核心任务是把样例分类到各可能的离散值对应的类别中，因此这些问题经常被称为分类问题。


    ### 3.3.5　贝叶斯算法

    贝叶斯算法是对部分未知的状态进行主观概率估计，并使用贝叶斯公式对发生概率进行修正，最后利用期望值和修正概率做出最优决策。


    #### 1. 贝叶斯算法概述

    贝叶斯算法是统计模型决策中的一个基本方法，其基本思想是已知条件概率密度参数表达式和先验概率，利用贝叶斯公式转换成后验概率，再根据后验概率的大小进行决策分类。贝叶斯是一种使用先验概率进行处理的模型，其最后的预测结果就是具有最大概率的那个类。在概率的计算中，贝叶斯算法是一个很重要的算法。


    在贝叶斯分类过程中，属性的选择对分类结果而言很重要，用不同的属性计算的结果会有差别。朴素贝叶斯的一个特点是条件独立性，也就是说，在使用朴素贝叶斯进行分类时，不考虑属性之间的任何联系，朴素贝叶斯可以将问题简单化。


    #### 2. 贝叶斯算法的原理

    为了更好地理解和应用贝叶斯算法，本节先介绍一些概率的相关知识，这些知识都将应用于贝叶斯算法中。


    ##### （1）条件概率

    条件概率是一种生活中经常用到的概率计算表达式。例如，在今天下雨的情况下，明天下雨的概率是多少？这就是一个条件概率的问题。用比较规范的语言描述，在事件 A 发生的情况下，B
    发生的概率是多少？也就是求事件 B 的条件概率。


    设 A，B 是两个事件，并且`P(A)>0`，那么在事件 A 发生的情况下，事件 B 发生的概率见式 3-1。


    ![](img/cutq_64_50370_m.jpg)


    有时候需要考虑两个事件同时发生的概率，即事件 A 和事件 B 的联合概率，记为`P(AB)`，见式 3-2。


    ![](img/cutq_64_56610_m.jpg)


    当 A 发生时，B 也发生的概率即为事件 A 和事件 B 同时发生的概率。假设影响事件 A 的事件有`B[1],B[2],B[3],…,B[n]`，并且满足条件`B[i]∩B[j]=∅`，`P(∪B[i])=1`，`P(B[i])＞0`，`i=1,2,3,…,n`，则
    A 发生的概率见式 3-3。


    ![](img/cutq_64_0527_m.jpg)


    ##### （2）贝叶斯定理

    有些事件的概率事先是不知道的，但可以根据手上的资料和相应的经验来估计其发生的概率，这样的概率称为先验概率。如果先验概率是根据手上的资料得到的，则称为客观先验概率；如果是通过经验确定的概率，则称为主观先验概率。与先验概率相对应的就是后验概率，后验概率是指通过贝叶斯公式和调查，对原先的先验概率进行修正，得到的更加准确的概率。


    ##### （3）朴素贝叶斯算法

    朴素贝叶斯算法是最常用的一种贝叶斯算法，它是基于贝叶斯公式建立的，公式为式 3-4。


    ![](img/cutq_64_5355_l.jpg)


    式中，`P(A|B)`表示 B 已经发生时 A 发生的概率，如`P（感冒|打喷嚏、发热）`表示出现打喷嚏和发热症状时感冒的概率；`P(A)`就是指没有前提条件时
    A 发生的概率。


    朴素贝叶斯公式的“朴素”二字基于一种假定，即“所有的特征都是独立的”，只有满足了这个假定才能使用朴素贝叶斯，见式 3-5。


    `P（打喷嚏、流鼻涕、发热|感冒）=P（打喷嚏|感冒）P（流鼻涕|感冒）P（发热|感冒）`（3-5）


    这表示感冒时同时出现打喷嚏、流鼻涕、发热 3 种症状的概率。


    #### 3. 贝叶斯算法的应用场景

    贝叶斯算法主要用于计算概率以完成分类及预测等问题，如对新闻、文本以及病人等各种情况的分类及预测等。


    例　假设有两个各装了 100 个球的箱子，甲箱子中有 70 个红球、30 个绿球，乙箱子中有 30 个红球、70 个绿球。假设随机选择其中一个箱子，从中取出一个球，记下球色并放回原箱子，如此重复
    12 次，记录得到 8 次红球、4 次绿球。求解下一次选择的箱子是甲箱子的概率。


    解　刚开始选择甲/乙箱子的先验概率都是 50%，即


    `P（甲）=0.5`，`P（乙）=1-P（甲）`


    在取出一个球是红球的情况下，应该根据这个信息来更新选择的是甲箱子的先验概率。


    `P（甲|红球 1）=P（红球|甲）×P（甲）/（P（红球|甲）×P（甲）+（P（红球|乙）×P（乙）））`


    其中，`P（红球|甲）`表示甲箱子中取到红球的概率，`P（红球|乙）`表示乙箱子中取到红球的概率。


    因此，在出现一个红球的情况下，选择的是甲箱子的先验概率可被修正为


    `P（甲|红球 1）=0.7×0.5 /（0.7×0.5 + 0.3×0.5）=0.7`


    即在出现一个红球之后，甲/乙箱子被选中的先验概率被修正为


    `P（甲）=0.7`，`P（乙）=1-P（甲）=0.3`


    如此重复，直到经历 8 次红球修正（概率增加）、4 次绿球修正（概率减少）之后，下一次选择的是甲箱子的概率为 96.7%。


    ### 3.3.6　支持向量机算法

    支持向量机算法是一种支持线性分类和非线性分类的二元分类算法。经过演进，其现在也支持多元分类，被广泛地应用在回归以及分类当中。支持向量机算法在 1963 年由弗拉基米尔·瓦普尼克等人提出。它的提出解决了传统方法中遇到的问题，可以很好地解决非线性、小样本和高维的问题。根据实践检验，它在这些方面都表现出了良好的性能。在实际应用中，支持向量机算法不仅能用于二元分类，还可用于多元分类。支持向量机算法在垃圾邮件处理、图像特征提取及分类、空气质量预测等多个领域都有应用，已成为机器学习领域中不可缺少的一部分。


    #### 1. 支持向量机算法概述

    支持向量机主要分为线性可分支持向量机、线性不可分支持向量机和非线性支持向量机三大类。线性可分支持向量机指在二维平面内可以用一条线清晰分开两个数据集；线性不可分支持向量机指在二维平面内用一条线分开两个数据集时会出现误判点；非线性支持向量机指用一条线分开两个数据集时会出现大量误判点，此时需要采取非线性映射将二维平面扩展为三维立体空间，并寻找一个平面清晰地切开数据集。


    #### 2. 支持向量机算法的原理

    支持向量机算法可以简单地描述为对样本数据进行分类，真正对决策函数进行求解。先找到分类问题中的最大分类间隔，再确定最优分类超平面，并将分类问题转化为二次规划问题进行求解。图
