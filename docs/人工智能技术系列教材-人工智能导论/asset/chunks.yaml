    ### 6.6.5 情感分析面临的困难与挑战 `../Text/contents.xhtml#z163`

    随着技术的进步，情感分析的研究已经有了非常大的进展，但依然存在着一些难题是目前尚未解决的，在实操过程中需特别注意以下几种类型的数据。


    #### 1. 颜文字和表情包

    互联网上大量的情感表达是通过颜文字和表情包来实现的，如经典的表示笑脸的颜文字“:D”，这类文本表达无法与上下文形成联系，很难判断其评价的实体对象是什么。可以将特定的颜文字作为一种特殊的词组构建成情感字典，并人工进行情感分的赋值；对于emoji，可以将标准的emoji编码编入情感字典。


    #### 2. 讽刺句

    讽刺句从字面上来看可能是褒义，但实际却是贬义，或者字面是贬义但实际却是褒义。例如，“太棒了！这家外卖治好了我多年的便秘！”这种讽刺句在情感分析中是非常难以处理的，需要结合常识或者相关的背景知识才能了解。在舆论或社会新闻的评价中，讽刺句比较常见。


    #### 3. 比较句

    比较句是特殊的情感表达句，例如，“我觉得这件衣服很适合我，但我更喜欢那一件。”这类比较句中通常存在着两个以上的实体或属性，很难分辨观点持有者到底是在对哪一个实体或属性表达情感，但是这类语句在商品的评论中非常常见，需要特别注意。


    #### 4. 情绪分类

    目前，对于情感的分析仅仅做了褒义、贬义、中性3种划分，但现实生活中的情绪远远不止这3种类型。在心理学领域中，著名的心理学家罗伯特·普拉切克（Robert Plutchik）提出的情绪轮包含了8种基本情绪，并且每种情绪又分为不同的情绪强度等级，8种情绪还可以相互结合形成更多的情绪。但是在人工智能领域，对情绪进行多分类比情感分析的3分类任务要难得多，目前大多数分类方法的结果准确性不到50%。


    ## 6.7 语音识别 `../Text/contents.xhtml#z164`

    语言是人与人之间最重要的交流方式，能与机器进行自然的人机交流是人类一直期待的事情。随着人工智能的快速发展，语音识别技术作为人机交流接口的关键技术发展迅速。


    ### 6.7.1 语音识别的定义 `../Text/contents.xhtml#z165`

    语音识别，通常被称为自动语音识别（Automatic Speech Recognition，ASR），主要是将人类语音中的词汇内容转换为计算机可读的输入，一般为可以理解的文本内容或者字符序列。语音识别就好比机器的听觉系统，它使机器通过识别和理解将语音信号转换为相应的文本或命令。


    语音识别是一项融合多学科知识的前沿技术，覆盖了数学与统计学、声学、语言学、模式识别理论以及神经生物学等学科。自2009年深度学习技术兴起之后，语言识别技术的发展已经取得了长足进步。语音识别的精度和速度取决于实际应用环境，在安静环境、标准口音、常见词汇场景下的语音识别准确率已经超过97%，具备了与人类相仿的语言识别能力。


    ### 6.7.2 语音识别的发展历程 `../Text/contents.xhtml#z166`

    20世纪50年代，语音识别的研究工作开始。1952年，贝尔实验室研发出了世界上第一个能识别10个英文数字发音的实验系统。此时，语音识别的重点是探索和研究声音和语音学的基本概念及原理。


    20世纪60年代开始，卡耐基梅隆大学的雷伊·雷蒂（Raj Reddy）等开展了连续语音识别的研究，但是进展很缓慢。1969年，贝尔实验室的约翰·皮尔斯（John
    Pierce）甚至在一封公开信中将语音识别比作近几年不可能实现的事情。


    20世纪80年代开始，以隐马尔可夫模型方法为代表的基于统计模型的方法逐渐在语音识别研究中占据了主导地位。它能够很好地描述语音信号的短时平稳特性，并能将声学、语言学、句法等知识集成到统一框架中。此后，它的研究和应用逐渐成为主流，第一个“非特定人连续语音识别系统”是当时还在卡耐基梅隆大学读书的李开复研发的SPHINX系统。到20世纪80年代后期，人工神经网络也成为语音识别研究的一个方向。但这种浅层神经网络在语音识别任务上的效果一般，表现并不如隐马尔可夫模型。


    20世纪90年代开始，语音识别掀起了第一次研究和产业应用的小高潮。这个时期，剑桥大学发布的隐马尔可夫开源工具包大幅度降低了语音识别研究的门槛。在此后将近10年的时间中，语音识别的研究进展一直比较有限，基于隐马尔可夫模型的语音识别系统的整体效果还远远达不到实用化水平，语音识别的研究和应用陷入了瓶颈。


    2006年，杰弗里·辛顿提出了深度置信网络，它解决了深度神经网络训练过程中容易陷入局部最优解的问题，自此深度学习的大潮正式拉开。2009年，杰弗里·辛顿和他的学生将深度置信网络应用在语音识别声学建模中，并且在小词汇量连续语音识别数据库中获得了成功。2011年，深度神经网络在大词汇量连续语音识别上获得成功，取得了近10年来最大的突破。从此，基于深度神经网络的建模方式正式取代隐马尔可夫模型，成为主流的语音识别模型。


    ### 6.7.3 语音识别的基本原理 `../Text/contents.xhtml#z167`

    对于不同的语音识别过程，人们采用的识别方法和技术都不尽相同，但其基本原理大致相同，即将经过预处理后的语音信号送入特征提取模块进行特征处理，并利用声学模型和语言模型对语音信号进行解码后，输出识别结果。语音识别的基本原理如图6-9所示。


