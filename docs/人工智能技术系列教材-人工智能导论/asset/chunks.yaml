- raw: '正因如此，“可解释AI”日益受到行业关注。“可解释AI”的目的是向技术使用者和监管机构解释人工智能模型所做出的每一个决策背后的逻辑。“可解释AI”与不可解释的黑盒算法相比，增加了深度神经网络的透明性，因此有助于通过向用户提供判断依据等额外信息，以增强其对人工智能的信任感、控制感和安全感，还可以为事后监管、问责和审计提供有力依据。


    而在目前的实际落地中，也可以采用深度学习算法与经典统计类规则结合的方式来进行建模，以解决模型可解释性的问题。


    ### [10.1.3　业务场景理解](../Text/contents.xhtml#z238)


    随着人工智能深入落地各垂直行业，要解决的业务问题从通用场景、单点问题，向特定场景、业务全流程演进，需要从感知智能进化到认识智能，从而具备分析决策能力。同时，业务场景的复杂度和门槛变得更高，对业务场景理解能力的要求也不断提升，给技术驱动的人工智能厂商带来了更大的挑战。


    在这样的背景下，单纯依靠算法技术和经验积累，人工智能厂商难以满足对业务场景理解能力的需求。因此，人工智能算法需要与专家经验、业务规则融合，共同解决问题，知识图谱技术成为关键。借助知识图谱技术，可以将行业经验沉淀为行业知识图谱，在此基础上让算法更好地理解业务。


    在实际落地过程中，先通过建立统一的知识图谱来实现知识融合，再进一步推进人工智能的快速落地应用，是解决业务场景理解问题的比较可行的方式。


    ### [10.1.4　服务方式](../Text/contents.xhtml#z239)


    在人工智能落地过程中，还需要考虑服务方式的问题。


    一方面，传统企业往往不具备很强的技术能力，无法直接应用技术。因此，标准化的人工智能技术输出或者API的调取服务方式，都无法满足企业业务人员的最终需求。人工智能厂商需要根据具体业务场景，基于服务对象的技术能力提供定制化的解决方案，并封装成可直接应用到业务系统的产品，即需要提供“AI+产品”的打包服务。


    另一方面，企业用户的需求是达成最终的业务目标，需要保证业务系统的持续运营，才能让人工智能产品真正发挥价值，但企业自身的运营能力有限。因此，往往需要人工智能厂商提供持续的业务运营服务，以保证最终业务效果的达成，即需要提供“AI+服务”的打包服务。


    而人工智能厂商面临的挑战是自身业务模式的问题，需要考虑如何避免过于定制化和重复服务。例如，可以通过中台化的方式赋能前端业务人员，共同为客户解决业务问题。中台层把各项通用能力中台化，基于中台支撑赋能前端人员去服务客户的业务运营，共同推动解决方案的落地和业务目标的达成。


    ### [10.1.5　投入产出比](../Text/contents.xhtml#z240)


    目前，企业用户采用人工智能技术应用仍然会面临拥有成本过高的问题，导致投入产出比不高，进而影响企业对人工智能技术的采纳。


    为了在业务中落地人工智能技术应用，企业的拥有成本至少包括以下项目：涉及芯片、算法平台等硬件在内的智能化产品；人工智能应用对专业人员的依赖非常大，需要引进算法工程师等人工智能专业人才。这些人工智能产品和人工智能人才的成本都比较高，这导致对于某些行业而言，投入产出比成为限制人工智能应用规模化落地的最大阻碍。


    在成本方面，可以看到数据科学平台、机器学习平台等产品的涌现，正在提升人工智能建模的自动化程度。数据科学平台可以在数据准备、模型建立、决策部署、模型管理等方面实现自动化，降低整个业务流程对算法工程师的依赖，从而降低人工智能应用的总拥有成本。而机器学习平台可以使机器学习的工程落地，从而快速创造价值。


    未来，随着算法的进步导致的对硬件要求的降低，以及人工智能芯片等硬件成本的下降，人工智能的投入产出比还会进一步提升。


    ## [10.2　人工智能对社会的影响](../Text/contents.xhtml#z241)


    随着人工智能的充分发展，以及劳动生产率和生产力水平的提升，人们的生活体验将更加丰富多彩。人工智能可以更多地将人们从体力劳动，乃至常规性的脑力劳动中解放出来，更多地投入到创造性活动当中，使人类自身与社会得到更充分的发展。当前，人工智能技术的突飞猛进正不断改变着零售、农业、物流、教育、医疗、金融、商务等领域的发展模式，重构生产、分配、交换、消费等活动的各环节。根据IDC
    2017年的数据显示，在未来5年内，人工智能技术应用到多个行业将极大地提高其运转效率，具体提升的效率为教育行业82%、零售业71%、制造业64%、金融业58%。


    从技术专家到科幻作者，从商业精英到社会大众，均将人工智能视为人类迄今为止最具开放性、变革性的创新，它是可以深刻改变世界但同时难以准确预估后果的颠覆性技术。包括控制论提出者诺伯特·维纳、已故著名科学家斯蒂芬·霍金、《人类简史》作者尤瓦尔·赫拉利（Yuval
    Harari）以及特斯拉现任CEO埃隆·马斯克（Elon Musk）在内的一大批有识之士均指出：人工智能的兴起与快速演进，在为人们带来极大便利的同时也蕴藏着巨大的风险，会挑战既有的社会价值观，甚至挑战人类本身存在的价值，使得人们不得不重新思考人与机器之间的关系，乃至未来社会的前途。


    ### [10.2.1　人工智能对教育与就业的影响](../Text/contents.xhtml#z242)


    发展人工智能的最终目的不是替代人类，而是使人类变得更加智慧，而教育将在这个过程中起到关键性作用。人工智能技术提升了经济活动中的产能，使得人们逐渐从机械的、重复性的或危险的劳动中抽离出来，从而增加了思考、欣赏等闲暇时间，更专注于创新能力、思考能力、审美与想象力的潜能开发与提升。从获取知识的角度来讲，当人们的必要劳动时间缩短，自由时间增加时，就会更多地去获取软性知识，这类知识与人类情感属性密切相关，并且不易转换为能被人工智能技术所识别的数据，因而更加难以被机器学习与掌握。


    但从教育的内在本质来看，个性化是基本方向。不同时代对人才的需求有着非常巨大的差异，在人工智能时代，个性化自主学习与多维度交流协作将成为学习的主要方式，学生可获得量身定制的学习内容支持。目前，人工智能在教育领域的应用主要集中在个性化学习、虚拟导师、教育机器人、基于编程和机器人的科技教育、基于虚拟现实/增强现实的场景式教育等各个方面。用适合自己的方式去学习，不仅效率会提高，还会保持更长时间的学习兴趣。在教育领域深度发展人工智能的意义并不是取代教师，而是协助教师使其教学变得更加高效和有趣。另外，在人工智能技术所影响的教育体系中，对人才的信息输入与输出能力、自主学习能力等的要求骤然提高，创新能力的培养也成为重要方向。


    随着技术的发展，人工智能逐步替代人类从事大部分烦琐的工作或体力劳动，在给人们带来福利的同时，也带来了前所未有的挑战。当今已经有越来越多的人担忧自己的工作是否会被人工智能技术所取代，或者能否在人工智能所留下的夹缝中生存。有专家对我国的就业岗位被人工智能取代的概率进行了估算，结果显示未来20年中，约占总就业人口的76%的劳动力会受到人工智能技术的冲击，若只考虑非农业人口，这一比例为65%。但同时人工智能技术对就业的创造效应已有所显现，调查显示我国科技公司目前人工智能团队规模扩张幅度为20%，且这种需求还会增长。另外，国家工业和信息化部教育考试中心专家称，在未来几年内，我国对人工智能领域的人才需求可能增至500万。


    可以判断，在人工智能重塑产业格局和消费需求的情境下，一部分工作岗位终将被历史淘汰，但是也会伴随着一系列新岗位的出现。此外，新型的人机关系正在构建，非程序化的认知类工作会变得愈发难以替代，其对人的创新、思考与想象力提出了更新的要求。


    机械化和智能化塑造着新的就业格局，但也要警惕新格局有可能带来的衍生问题，如由于失业率上升而引起的贫富差距和社会稳定问题。人工智能所带来的冲击是持续性的，对教育和就业的多重影响也是持续性的，因此需要不断积极探索与技术革命相匹配、相适应的教育与就业机制。


    ### [10.2.2　人工智能对隐私与安全的影响](../Text/contents.xhtml#z243)


    当今世界，以人工智能、大数据为代表的现代信息技术与人类生产生活高度融合。全球数据量爆发增长，海量聚集，大数据发展日新月异，对经济社会发展产生了非常深远的影响。与此同时，以人工智能、大数据为代表的新型数据安全风险日益凸显，尤其是侵害消费者隐私、利益等事件，以及网络诈骗、网络黑产、网络灰产的存在，给公民的信息和财产安全造成了严重威胁。


    今天，在许多生活消费场景中，人们对个性化体验的需求不断增加，个性化、场景化服务也逐渐成为人工智能驱动创新的主要方向。服务供应方在信息获取社交化、时间碎片化的情境下，着力建立更灵活、便捷的消费场景，给人们带来更加友好的用户体验。与此同时，随着语音识别、人脸识别、机器学习算法的发展和日趋成熟，企业可以通过分析客户画像真正理解客户，精准、差异化的服务使得客户满足感进一步增强。但是这种方式在蕴藏着巨大商业价值的同时，也对现有法律秩序与公共安全构成了一定的挑战。


    网络空间的虚拟性使得数据更易于收集与分享，极大地便利了身份信息、健康状态、信用记录、位置活动踪迹等信息的存储、分析和交易，与此同时，人们很难追踪个人数据隐私的泄露途径与程度。例如，以人工智能技术为基础的智慧医疗，病人的电子病例、私人数据归属权如何界定，医院获得及使用私人数据的权限如何规范。又如，人工智能技术生成作品的著作权问题等。开放的产业生态使得监管机构难以确定监管对象，也令法律的边界变得越来越模糊。


    人工智能的普遍使用使得人机关系发生了趋势性的改变，人机频繁互动，可以说已形成互为嵌入式的新型关系。时间与空间的界限被打破，虚拟与真实的界限也不再确定，这种趋势下的不可预测性与不可逆性很有可能会触发一系列潜在风险。与人们容易忽略的信息泄露不同，人工智能技术还可能被少数别有用心的人有目的地的用于欺诈等犯罪行为。例如，基于不当手段获取的个人信息形成数据图像，并通过社交软件等冒充熟人进行诈骗。又如，使用人工智能技术进行学习与模拟，生成包括图像、视频、音频、生物特征在内的信息，突破了安防屏障。而从潜在风险来看，无人机、无人车、智能机器人等产品存在遭到非法侵入与控制，或造成财产损失或被用于犯罪的可能。


    ## [10.3　人工智能的未来](../Text/contents.xhtml#z244)


    人工智能最近几年发展得如火如荼，学术界、工业界、投资界各方一起发力，硬件、算法与数据共同发展，大型互联网公司、大量创业公司以及传统行业的公司都开始涉足人工智能领域。从长远来看，人工智能在各行各业获得越来越广泛的应用一定是社会发展的趋势之一。


    从人工智能基础设施来说，人工智能专用芯片的研发方兴未艾，英伟达、谷歌、阿里、百度、华为等巨头公司，以及大量创业公司，都在人工智能芯片方面加快布局。随着人工智能应用进一步渗透到物联网等方向，相信市场对专用芯片的需求会越来越强烈。而作为各种人工智能应用开发工具的各种开发框架，也在之前的百花齐放式发展中逐步收敛，目前形成了PyTorch主导学术界、TensorFlow主导工业界的双雄局面。


    从人工智能技术发展的角度来看，有几个明显的技术趋势已日益凸显。首先，随着以智能手机为代表的移动终端计算、存储能力的快速加强，端人工智能与边缘计算技术正在快速发展与普及，在应用效果尽可能好的前提下，让模型更小、更精、更快是这个发展方向的关键点。其次，传统机器学习严重依赖训练数据的规模与质量，制约了领域技术的快速发展，由最常见的监督学习转向半监督、自监督甚至无监督机器学习，用尽量少的有标签训练数据使机器自主学会更多的知识，是大有前景的发展方向。再次，自动机器学习正在快速地渗透到各个人工智能应用领域，从最早的图像领域，目前已经拓展到NLP、推荐搜索、GAN等多个领域，随着自动机器学习技术的逐渐成熟，搜索网络结构成本越来越低，更多领域的模型会由目前算法专家主导开发向机器自主设计模型发展。另外，随着5G等传输技术的快速发展，视频、图片类应用快速成为最主流的App消费场景，让机器学习技术更好地融合文本、图片、视频、用户行为等各种不同模态的信息以达到更好的应用效果，也是一个重要的发展趋势。最后，在生成领域，即让机器生成高质量的图片、视频、文本等，最近两年也出现了大量有效新技术，如图像领域的GAN以及文本领域的GPT2等模型，随着相关技术日益成熟，生成领域也将成为重要的发展方向。


    从人工智能应用领域发展趋势来看，最主要的几个人工智能方向，如自然语言处理、图像视频处理及智能搜索推荐，近年来在应用领域的发展态势良好，且各自呈现出不同的发展格局。


    人工智能作为新一轮产业变革的核心驱动力，正在释放历次科技革命和产业变革积蓄的巨大能量，持续探索新一代人工智能应用场景，将重构生产、分配、交换、消费等经济活动的各个环节，催生新技术、新产品、新产业的诞生。


    ### [10.3.1　人工智能未来的发展趋势](../Text/contents.xhtml#z245)


    经过60多年的发展，人工智能在算法、算力（计算能力）和算料（数据）“三算”方面取得了重要突破，正处于从“不能用”到“可以用”的技术拐点，但是距离“很好用”还有很长的路要走。在可以预见的未来，人工智能的发展会呈现如下趋势与特征。


    1.从专用智能向通用智能发展


    如何实现从专用人工智能向通用人工智能的跨越式发展，既是下一代人工智能发展的必然趋势，又是研究与应用领域的重大挑战。2016年10月，美国国家科学技术委员会发布《国家人工智能研究与发展战略计划》，提出在美国的人工智能中长期发展策略中要着重研究通用人工智能。AlphaGo开发团队创始人戴密斯·哈萨比斯（Demis
    Hassabis）提出朝着“创造解决世界上一切问题的通用人工智能”这一目标前进。微软在2017年成立了通用人工智能实验室，众多感知、学习、推理、自然语言理解等方面的科学家参与其中。


    2.从人工智能向人机混合智能发展


    借鉴脑科学和认知科学的研究成果是人工智能的一个重要研究方向。人机混合智能旨在将人的作用或认知模型引入到人工智能系统中，提升人工智能系统的性能，使人工智能成为人类智能的自然延伸和拓展，通过人机协同更加高效地解决复杂问题。在我国新一代人工智能规划和美国“脑计划”中，人机混合智能都是重要的研发方向。


    3.从“人工+智能”向自主智能系统发展


    当前人工智能领域的大量研究集中在深度学习，但是深度学习的局限是需要大量人工干预，例如，人工设计深度神经网络模型、人工设定应用场景、人工采集和标注大量训练数据、用户需要人工适配智能系统等，非常费时费力。因此，科研人员开始关注减少人工干预的自主智能方法，提高机器智能对环境的自主学习能力。例如，AlphaGo的后续版本Alpha
    Zero从零开始，通过自我对弈强化学习实现围棋、国际象棋、日本将棋的“通用棋类人工智能”。在人工智能系统的自动化设计方面，2017年谷歌提出的自动化学习系统（AutoML）试图通过自动创建机器学习系统降低人员成本。


    4.加速与其他学科领域的交叉渗透


    人工智能本身是一门综合性的前沿学科和高度交叉的复合型学科，研究范畴广泛而又异常复杂，其发展需要与计算机科学、数学、认知科学、神经科学和社会科学等学科深度融合。随着超分辨率光学成像、光遗传学调控、透明脑、体细胞克隆等技术的突破，脑科学与认知科学的发展开启了新时代，能够大规模、更精细地解析智力的神经环路基础和机制。人工智能将进入生物启发的智能阶段，依赖于生物学、脑科学、生命科学和心理学等学科的发现，将机理变为可计算的模型，同时，人工智能会促进脑科学、认知科学、生命科学甚至化学、物理学、天文学等传统科学的发展。


    5.推动人类进入普惠型智能社会


    “人工智能+X”的创新模式将随着技术和产业的发展日趋成熟，对生产力和产业结构产生革命性影响，并推动人类进入普惠型智能社会。2017年，国际数据公司在《信息流引领人工智能新时代》白皮书中指出，未来5年，人工智能将提升各行业的运转效率。我国经济社会的转型升级对人工智能有巨大需求，在消费场景和行业应用的需求牵引下，需要打破人工智能的感知瓶颈、交互瓶颈和决策瓶颈，促进人工智能技术与社会各行各业的融合，建设若干标杆性的应用场景创新，实现低成本、高效益、广范围的普惠型智能社会。


    ### [10.3.2　人工智能未来的技术发展方向](../Text/contents.xhtml#z246)


    1.机器视觉


    机器视觉就是用机器代替人眼来做测量和判断。机器视觉系统会通过机器视觉产品（即图像摄取装置，分为CMOS和CCD两种）将被摄取目标转换成图像信号，并传送给专用的图像处理系统，根据像素分布、亮度、颜色等信息转换成数字信号，图像处理系统再对这些信号进行各种运算来抽取目标的特征，进而根据判别的结果来控制现场的设备动作。人工智能能使机器担任一些需要人工处理的工作，而这些工作需要做一定的决策，这就要求机器能够自行根据当时的环境做出相对较好的决策。因此，其需要计算机不仅能够计算，还要拥有一定的智能；而为了对周边的环境进行分析，就要求机器能够看到周围的环境，并能够对环境做出判断，就像人类做的那样。所以机器视觉是人工智能中非常重要的一个发展方向。


    机器视觉在许多人类视觉无法胜任的场合发挥着重要作用，如危险场景感知、不可见物体感知等，此时更能突出机器视觉的优越性。现在机器视觉已在一些更加实用的领域开始应用，如零件识别与定位、产品检验、移动机器人导航、监视与跟踪、国防系统等，机器视觉与这些领域的发展起着相互促进的作用。


    2.指纹识别


    指纹识别技术把一个人同其指纹对应起来，通过将个人的指纹和预先保存的指纹进行比较，就可以验证一个人的真实身份。每个人的皮肤纹路在图案、断点和交叉点上各不相同，也就是说，指纹是唯一的，并且终生不变。依靠这种唯一性和稳定性，人们才能创造指纹识别技术。


    指纹识别主要根据人体指纹的纹路、细节特征等信息进行身份鉴定，得益于现代电子集成制造技术和快速而可靠的算法研究，指纹识别技术已经走入人们的日常生活，成为目前生物检测学中研究最深入、应用最广泛、发展最成熟的技术。


    指纹识别系统应用了人工智能技术中的模式识别技术。模式识别是指对表征事物或现象的各种形式的（数值的、文字的和逻辑关系的）信息进行处理和分析，以对事物或现象进行描述、辨认、分类和解释的过程。很显然，指纹识别属于模式识别范畴。


    3.掌纹识别


    掌纹识别是近几年提出的一种较新的生物特征识别技术。掌纹是指手指末端到手腕的手掌图像。其中很多特征可以用来进行身份识别，如主线、皱纹、细小的纹理、脊末梢、分叉点等。掌纹中所包含的信息远比一枚指纹包含的信息丰富，利用掌纹的纹线特征、点特征、纹理特征、几何特征可以完全确定一个人的身份。因此，从理论上讲，掌纹具有比指纹更好的分辨能力和更高的鉴别能力。


    掌纹中最重要的特征是纹线特征，且其中最清晰的几条纹线基本上是伴随人的一生而不发生变化的，在低分辨率和低质量的图像中仍能够被清晰辨认。掌纹识别是一种非侵犯性的识别方法，比较容易被用户接受，且对采集设备要求不高。


    4.人脸识别'
