    # 第 1 章　人工智能概述


    【本章导读】


    人工智能自诞生以来，在短短几十年的时间里取得了巨大的进展。本章主要介绍人工智能的基础知识，以帮助读者初步了解人工智能。


    【本章要点】


    1 人工智能的定义

    2 人工智能的分类

    3 人工智能的起源和发展

    4 人工智能的研究内容

    5 人工智能领域的著名专家和代表性人物

    6 人工智能研究的主要学派

    7 人工智能的应用


    ## 1.1　人工智能简介


    自 1956 年诞生以来，人工智能研究已经取得了许多令人兴奋的成果，并在多个领域得到了广泛的应用，极大地改变了人们的社会生活。本节将对人工智能的概念作简单的介绍。


    ### 1.1.1　人工智能的定义


    人工智能（Artificial Intelligence，AI）是研究、开发用于模拟、延伸和扩展人的智能的理论、方法、技术及应用系统的一门新的技术科学。


    关于人工智能的定义较多，目前采用较多的是斯图亚特·罗素（Stuart Russell）与彼得·诺维格（Peter Norvig）在《人工智能：一种现代的方法》一书中的定义。他们认为人工智能是关于“智能主体（Intelligent
    Agent）的研究与设计”的学问，而“智能主体是指一个可以观察周遭环境并做出行动以达致目标的系统”。这一定义既强调人工智能可以通过感知环境做出主动反应，又强调人工智能所做出的反应必须满足目标，同时，不再强调人工智能对人类思维方式或人类总结的思维法则的模仿。


    从根本上讲，人工智能是研究使计算机模拟人类的某些思维过程和智能行为（如学习、推理、思考、规划等）的学科，主要包括计算机实现智能的原理、制造类似于人脑智能的计算机，使计算机能实现更高层次的应用。此外，人工智能还涉及心理学、哲学和语言学等学科，可以说几乎涉及了自然科学和社会科学的所有学科，其范围已远远超出了计算机科学的范畴。


    ### 1.1.2　人工智能的特点


    人工智能经历了 60 多年的发展，现在已进入 AI 2.0 阶段，主要具备这样几个特征：一是从人工知识表达到大数据驱动的知识学习技术；二是从分类型处理的多媒体数据转向跨媒体的认知、学习、推理；三是从追求智能机器到高水平的人机、脑机相互协同融合；四是从聚焦个体智能到基于互联网和大数据的群体智能；五是从拟人化的机器人转向更加广阔的智能自主系统，如工业
    4.0 时代的智能工厂、智能无人机等产品。


    ### 1.1.3　人工智能的分类


    人工智能可分为 3 类：弱人工智能（Weak AI）、强人工智能（Strong AI）与超人工智能（Artificial Super Intelligence，ASI）。


    弱人工智能就是利用现有的智能化技术，来改善经济社会发展所需的一些技术条件，也指完成单一任务的智能。例如，曾经战胜世界围棋冠军的人工智能阿尔法围棋（AlphaGo）就是一个典型的弱人工智能，尽管它很厉害，但它只会下围棋；又如，苹果公司的语音助手
    Siri，它只能执行有限的预设功能，并且不具备智力或自我意识，它只是一个相对复杂的弱人工智能。


    强人工智能则是综合的，在各方面都能和人类比肩的人工智能，人类能干的脑力活它都能干，非常接近于人类的智能，但还需要脑科学的突破才能实现强人工智能。


    哲学家、牛津大学人类未来研究所创始人尼克·波斯特洛姆（Nick Bostrom）把超人工智能定义为“在几乎所有领域都大大超过人类认知表现的任何智力”。首先，超人工智能能实现与人类智能等同的功能，即可以像人类智能实现生物上的进化一样，对自身进行重编程和改进，也就是“递归自我改进功能”；其次，尼克·波斯特洛姆还提到，“生物神经元的工作峰值速度约为
    200 Hz，比现代微处理器（约 2 GHz）慢了整整 7 个数量级”，同时，“神经元在轴突上 120 m/s 的传输速度也远远低于计算机的通信速度”。这使得超人工智能的思考速度和自我改进速度将远远超过人类，人类作为生物的生理限制将统统不适用于超人工智能。


    图 1-1 所示为弱人工智能机器人。


