    （2）简述自然语言处理的一般工作原理。

    （3）简述自然语言理解的定义和层次。

    （4）简述词法分析的目的和作用。

    （5）简述句法分析的作用。

    （6）简述语义分析的作用和常用方法。

    （7）简述信息检索的基本原理。

    （8）简述机器翻译的基本模式。

    （9）简述情感分析的常见任务。

    （10）简述语音识别的基本原理和过程。


    # 第 7 章　知识图谱

    【本章导读】

    知识图谱是一种揭示实体之间关系的语义网络，它以结构化的形式描述客观世界中概念、实体及其关系，是人工智能发展的核心驱动力之一。本章主要介绍知识图谱的相关概念及应用。


    【本章要点】

    1 知识图谱的定义、发展历史、类型和重要性

    2 知识表示

    3 知识建模

    4 知识抽取

    5 知识存储

    6 知识融合

    7 知识推理

    8 语义搜索

    9 问答系统


    ## 7.1　知识图谱简介

    知识图谱（Knowledge Graph）是一种揭示实体之间关系的语义网络。2012 年 5 月 17 日，谷歌正式提出了知识图谱的概念，其初衷是优化搜索引擎返回的结果，增强用户搜索质量及体验。


    ### 7.1.1　知识图谱的定义

    知识图谱以结构化的形式描述客观世界中的概念、实体及其关系，将互联网的信息表达成更接近人类认知世界的形式，提供了一种更好地组织、管理和理解互联网海量信息的能力。知识图谱给互联网语义搜索带来了活力，同时在问答系统中显示出了强大作用，已经成为互联网知识驱动的智能应用的基础设施。知识图谱与大数据和深度学习一起，成为推动互联网和人工智能发展的核心驱动力之一。


    知识图谱不是一种新的知识表示方法，而是知识表示在工业界的大规模知识应用，它对互联网中可以识别的客观对象进行关联，以形成客观世界实体和实体关系的知识库，其本质上是一种语义网络，其中的节点代表实体或者概念，边代表实体/概念之间的各种语义关系。知识图谱的架构包括知识图谱自身的逻辑结构，以及构建知识图谱所采用的技术（体系）架构。知识图谱的逻辑结构可分为模式层与数据层，模式层在数据层之上，是知识图谱的核心，模式层存储的是经过提炼的知识，通常采用本体库来管理知识图谱的模式层，借助本体库对公理、规则和约束条件的支持能力，规范实体、关系以及实体的类型和属性等对象之间的联系。数据层主要由一系列的事实组成，而知识将以事实为单位进行存储。在知识图谱的数据层，知识以事实为单位存储在数据库中。如果以（实体，关系，实体）或者（实体，属性，性值）三元组作为事实的基本表达方式，则存储在数据库中的所有数据将构成庞大的实体关系网络，形成知识图谱。图
    7-1 所示为知识图谱的表示。


    ![](img/image_141_0_l.jpg)

    图 7-1　知识图谱的表示


    ### 7.1.2　知识图谱的发展历史

    知识图谱的发展始于 20 世纪 50 年代，至今大致分为如下所述的 3 个发展阶段。


    1.第一阶段（1955 年～1977 年）

    第一阶段是知识图谱的起源阶段，在这一阶段中，研究者们提出了引文网络和语义网络的概念。1955 年，尤金·加菲尔德（Eugene Garfield）提出了将引文索引应用于检索文献的思想。1965
    年，德瑞克·普赖斯（Derek Price）在 Networks of Scientific Papers 一文中指出引文网络与科学文献之间的引证关系，类似于当代科学发展的“地形图”，从此分析引文网络开始成为一种研究当代科学发展脉络的常用方法，进而形成了知识图谱的概念。1968
    年，奎林（Quillian）提出了语义网络，最初是作为人类联想记忆的一个明显公理模型，随后在人工智能中用于自然语言理解，表示命题信息。语义网络是一种以网络格式表达人类知识构造的形式，是人工智能程序运用的表示方式之一。


    2.第二阶段（1977 年～2012 年）

    第二阶段是知识图谱的发展阶段，语义网络得到快速发展，“知识本体”的研究开始成为计算机科学的一个重要领域，知识图谱吸收了语义网、本体在知识组织和表达方面的理念，使得知识更易于在计算机之间和计算机与人之间交换、流通和加工。1977
    年，在第五届国际人工智能会议上，美国计算机科学家阿曼德·菲根堡姆（Armand Feigenbaum）首次提出了知识工程的概念，知识工程是通过存储现存的知识来实现对用户的提问进行求解的系统，其中最典型和成功的知识工程的应用是基于规则的专家系统，此后以专家系统为代表的知识库系统开始被广泛研究和应用。1991
    年，美国计算机专家尼彻斯（Niches）等人在完成美国国防部高级研究计划局（Defense Advanced Research Projects Agency，DARPA）关于知识共享的科研项目中提出了一种构建智能系统的新思想，该智能系统由两部分组成，一部分是知识本体（Ontologies），另一部分是问题求解方法（Problem
    Solving Methods，PSMs）。知识本体是知识库的核心，涉及特定领域共有的知识结构，是静态的知识；PSMs 涉及在相应领域的推理知识，是动态的知识，PSMs
    使用知识本体中的静态知识进行动态推理。自 1998 年万维网之父蒂姆·李（Tim Lee）提出语义网的概念，以及链接开放数据（Linked Open Data）的规模激增，互联网上散落了越来越多的知识元数据。2002
    年，机构知识库的概念被提出，知识表示和知识组织开始被深入研究，并广泛应用到各机构单位的资料整理工作中。


    3.第三阶段（2012 年至今）

    第三阶段是知识图谱的繁荣阶段，2012 年谷歌提出 Google Knowledge Graph，知识图谱正式得名，谷歌通过知识图谱技术改善了搜索引擎性能。在人工智能的蓬勃发展下，知识图谱涉及的知识抽取、表示、融合、推理、问答等关键问题得到一定程度的解决和突破，知识图谱成为知识服务领域的一个新热点，受到国内外学者和工业界的广泛关注。随着互联网的蓬勃发展，信息量呈爆炸式增长，人们开始渴望更加快速、准确地获取所需的信息。知识图谱强调语义检索能力，关键技术包括从互联网的网页中抽取实体、属性及关系，旨在解决自动问答、个性化推荐和智能信息检索等方面的问题。目前，知识图谱技术正逐渐改变现有的信息检索方式，如谷歌、百度等主流搜索引擎都在采用知识图谱技术提供信息检索，一方面，通过推理实现概念检索（相对于现有的字符串模糊匹配方式而言）；另一方面，以图形化方式向用户展示经过分类整理的结构化知识，从而使人们从人工过滤网页寻找答案的模式中解脱出来。


    ### 7.1.3　知识图谱的类型

    目前，常用的知识图谱主要有以下 4 种类型。


    1.事实知识

    事实知识是知识图谱中最常见的知识类型。大部分事实是在描述实体的特定属性或者关系，例如，三元组（柏拉图，出生地，雅典）中的“出生地”就是其中一个属性。需要说明的是，有些实体的相关事实未必存在典型的属性或者关系与之对应，只能通过复杂的文本来描述。例如，“亚里士多德是西方古典哲学的集大成者”这一事实很难找到明确的属性加以陈述。例如，在“柏拉图继承和发展了苏格拉底的哲学思想”这一事实中，显然柏拉图与苏格拉底之间是有关系的，但这类关系无法简单概括。很多以实体为中心组织的知识图谱均富含事实知识，如
    DBpedia、Freebase 及 CN-DBpedia 等。


    2.概念知识

    概念知识分为两类：一类是实体与概念之间的类属关系，另一类是子概念与父概念之间的子类关系。一个概念可能有子概念也可能有父概念，这使得全体概念构成层级体系。概念之间的层级关系是本体定义中最重要的部分，是构建知识图谱的第一步模式设计的重要内容。典型的概念知识图谱包括
    YAGO、Probase、WikiTaxonomy 等。


    3.词汇知识

