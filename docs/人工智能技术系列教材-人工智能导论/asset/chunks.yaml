    ### [6.7.4　语音识别的应用](../Text/contents.xhtml#z168)


    语音识别技术作为近年来最热门的一种先进的技术，涉及信号处理、语言、心理和计算机等多门学科。大量的语音识别产品已经进入市场和服务领域，被广泛地应用于智能终端、移动互联网应用、金融、电信、汽车、家居、教育等行业，推动了车载语音、智能客服、智能家居、语音课件等产品的迅猛发展。近年来，国内外智能语音厂商纷纷进行市场布局，提供了语音识别、语音合成、集成化产品、智能语音云平台等多样化能力服务，如手机端的语音助手Siri、微软小娜、电话机器人硅语、地图导航高德、智能音箱天猫精灵等，如图6-10所示，引发了汽车、家电、银行、家居、电信等多领域传统行业的应用创新。各行各业也纷纷以此为契机，大力创新发展与人工智能技术结合的产品及服务，下面介绍一些语音识别的典型应用。


    ![](Images/cutq_134_16842_l.jpg)


    图6-10　语言识别的使用场景


    1.语音识别在移动设备中的应用


    在移动设备方面，智能语音语义在智能手机和可穿戴设备中的应用不尽相同。可穿戴设备虽然没有屏幕或屏幕较小，更适合语音交互，但是大多数可穿戴设备（如智能手表）是非生活必需品，本身销量就很有限，并没有太多交互需求，因此实际应用量较少。从效率上看，语音识别在智能手机和各类软件上的应用主要以输入、搜索和调取服务为主，输入信息量并不大。目前，除了重度文字使用者如作家、记者、编辑等，对语音输入和转化有着刚性需求之外，其他人使用语音识别的场景更多的还是在不方便打字时，如走路、开车等场景下。但是随着语音识别和交互体验的不断提升，会有越来越多的人在移动端使用语音识别。


    2.语音识别在智能家居中的应用


    在智能家居方面，智能语音的应用主要围绕智能电视、音箱、家用机器人展开，通过支持语音识别的智能设备，如智能音箱、家庭媒体网关、机顶盒等，人们可以绕过复杂的按键操作，以语音控制的方式实现很多事情。


    （1）早上醒来，人们不再拿手机看时间，而是可以直接询问“现在几点了？”“今天天气怎样？”“外面是否在下雨？”等，家中的智能语音设备将会直接给出答案。


    （2）获取新闻，安排日程。通过智能语音设备，可以收看或收听新闻，也可以询问智能音箱“我今天的日程安排是什么？”，可以轻松开启一天的工作和生活。


    （3）当人们想看电视时，可以通过内置了智能语音功能的家庭媒体设备，以语音的方式选择想看、想听的内容；而如果不知道具体的名称，也可以通过“播放励志的电影”“听点音乐”等模糊地输入线索，找出相关的内容。


    （4）在智能语音设备出现之前，在电视上购物是非常麻烦的，有了智能语音设备，只要说出想要的产品，就能快速便捷地找到心仪的产品。


    （5）通过语音识别，可以轻松地控制智能电视，实现开机、关机、调高音量、调低音量等操作，还可以实现对家庭智能设备如灯泡、热水器、电饭煲、空调、电动窗帘等的控制。


    据统计，2019年全球智能音箱出货量达到1.4亿台，预计到2024年，全球智能音箱的保有量将达到6.4亿台。


    3.语音识别在企业客服和教育领域中的应用


    在企业客服方面，智能机器人客服的出现可以在很大程度上解决简单、重复性工作，帮助企业节省了人工和座席成本，提升了运营效率。由于客服问题主要聚焦在特定产品或单一垂直领域，因此需要企业拥有完整的结构化知识库，帮助机器人更好地查询和匹配问答内容。目前，按照行业平均水平，机器人客服可以解决70%左右的问题，其余由人工处理。由于业务量大、付费能力强、知识库完整，金融、电信、航空等大型公司成为智能机器人客服的主要应用群体。


    在教育领域，智能语音的应用包括中英文口语评测，以及部分教育机器人的交互功能。它在教育领域的价值表现在两个方面，一方面在于提高教师工作效率，另一方面在于帮助学生提升学习效果。通过大量语音数据的积累，以及和后端大数据分析、机器学习相结合，智能语音有望在机器辅助学习和自适应学习方面发挥重大作用，为教育行业带来颠覆性变革。科大讯飞作为智能语音和教育市场的龙头企业，为一些全国性考试提供技术支持，已经成为智能语音在中英文口语测评方面的领先者。2016年年底，科大讯飞与新东方联合成立东方讯飞，以新东方的数据和科大讯飞的技术推动教育、培训、学习的智能化进程，智能语音测评技术有望在其中发挥重要作用。


