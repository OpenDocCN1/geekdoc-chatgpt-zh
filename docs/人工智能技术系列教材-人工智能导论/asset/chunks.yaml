    ## 9.4 小结

    （1）机器人的组成部分与人类极为类似，一个典型的机器人有一套可移动的身体结构、一部类似于电动机的装置、一套传感系统、一个电源和一个用来控制这些要素的计算机“大脑”。从本质上讲，机器人是由人类制造的“动物”，它是模仿人类和动物行为的机器。


    （2）智能机器人是第三代机器人，这种机器人带有多种传感器，能够对多种传感器得到的信息进行融合，能够有效地适应变化的环境，具有很强的自适应能力、学习能力和自治功能。


    （3）随着人工智能技术的进步，我国服务机器人产业迎来了蓬勃发展，2019 年，我国服务机器人市场规模约为 22 亿美元。基于不同的应用场景，各领域衍生出了各类形态不一的服务机器人，如餐厅送餐机器人、商场导购机器人、银行柜台机器人等。


    （4）智能机器人要想拥有高效的感知、识别等能力，离不开定位导航和人机交互这两大关键技术。


    （5）早期智能机器人主要用于工业和军事领域，大多数是机械手和机器臂。如今，智能机器人的应用已经深入各行各业，在军事、制造业、医疗、服务等方面有着广泛应用。


