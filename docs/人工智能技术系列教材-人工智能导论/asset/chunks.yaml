    图 3-5　线性回归示意图


    ![](img/cutq_56_18872_m.jpg)


    图 3-6　逻辑回归示意图


    #### (3) 多项式回归

    线性回归中使用的假设函数是一次方程，假设数据集呈简单线性关系，但实际情况中很多数据集是非线性的关系，直线方程无法很好地拟合数据的情况，此时可以尝试使用多项式回归。多项式回归中加入了特征的更高次方，就相当于增加了模型的自由度，用来捕获数据中非线性的变化。当然，添加高阶项的时候，也增加了模型的复杂度。随着模型复杂度的升高，模型的容量以及拟合数据的能力增加，可以进一步降低训练误差，但导致过拟合的风险随之增加。


    #### (4) 逐步回归

    逐步回归就是一步一步进行回归。我们知道多元回归中的元是指自变量，多元就是多个自变量，即多个 x。而多个 x 中不一定每个 x 都对 y 有作用。这就需要对不起作用的
    x 进行筛选，不将其加入到回归模型中。这个筛选的过程叫作变量选择。而自变量是否有用的判断依据就是对自变量进行显著性检验。具体方法是将一个自变量加入到模型中时，观察残差平方和是否显著减少。如果显著减少，则说明这个变量是有用的，可以将其加入到模型中；否则说明它是无用的，可以将其从模型中删除。


    #### (5) 岭回归

    线性回归的最主要问题是对异常值敏感。在真实世界的数据收集过程中，经常会遇到错误的度量结果。而线性回归使用的是普通最小二乘法，其目标是使平方误差最小化。由于异常值误差的绝对值很大，因此会破坏整个模型。此时就需要引入正则化项的系数作为阈值来消除异常的影响，这个方法称为岭回归。


    #### (6) 套索回归

    线性回归的另一种正则化叫作最小绝对收缩和选择算子回归（Least Absolute Shrinkage and Selection Operator Regression），简称`LASSO`回归或套索回归。与岭回归一样，它也是向成本函数增加一个正则项，但是它增加的是权重向量的`L1`范数，而不是`L2`范数的平方的一半。


    #### (7) 弹性回归

    岭回归的结果表明，它虽然在一定程度上可以拟合模型，但是容易导致回归结果失真；而套索回归虽然能刻画模型代表的现实情况，但是模型过于简单，不符合实际。弹性回归则一方面达到了岭回归对重要特征选择的目的，另一方面又像套索回归那样删除了对因变量影响较小的特征，取得了很好的效果。当多个特征和另一个特征相关的时候，弹性网络非常有用。套索回归倾向随机选择其中一个，而弹性回归倾向选择其中两个。


    ### 3. 回归算法的应用场景

    回归算法是机器学习中常用的数据统计方法之一，在科研、商业方面都有广泛的应用。通过回归算法可以确定许多领域中各个因素（数据）之间的关系，从而可以进行预测、分析数据。下面是
    3 个典型的回归算法的应用场景。


    #### (1) 机场客流量分布预测

    为了有效利用机场资源，机场正利用大数据技术提升生产运营的效率。机场内需要不断提升运行效率的资源包括航站楼内的各类灯光设备、电梯、值机柜台、商铺、广告位、安检通道、登机口，以及航站楼外的停机位、廊桥、车辆（摆渡车、清洁车、物流车、能源车）。要想提升这些资源的利用率，首先需要知道未来一段时间将会有多少旅客或航班会使用这些资源，其次需要精准的调度系统来调配这些资源并安排服务人员，帮助机场提升资源利用效率，保障机场安全，提升服务质量。根据海量机场
    Wi-Fi 数据及安检、登机、值机数据，可以通过回归算法实现机场航站楼客流分析与预测。


    #### (2) 新浪微博互动量预测

    新浪微博作为中国最大的社交媒体平台之一，旨在为用户发布的公开内容提供快速传播的通道，提升内容和用户的影响力。对于一条原创博文而言，转发、评论、点赞等互动行为能够体现出用户对于博文内容的兴趣程度，也是对博文进行分发控制的重要参考指标。根据抽样用户的原创博文在发表一天后的转发、评论、点赞总数，可以通过回归算法建立博文的互动模型，并预测用户后续博文在发表一天后的互动情况。


    #### (3) 青藏高原湖泊面积预测

    全球气候变化对青藏高原的湖泊水储量有很大影响，因此精确地估计青藏高原湖泊面积变化对于研究气候变化来说非常重要。海量多源异构数据和大数据处理与挖掘技术给湖泊面积变化研究带来了新的解决思路：可以通过多源数据对青藏高原的湖泊面积进行预测，将大数据技术应用到全球气候变化研究中。通过回归算法研究青藏高原湖泊面积变化的多种影响因素，可构建青藏高原湖泊面积预测模型。


    ## 3.3.2 聚类算法

    聚类就是将相似的事物聚集在一起，将不相似的事物划分到不同类别的过程，是数据挖掘中一种重要的方法。聚类算法的目标是将数据集合分成若干簇，使得同一簇内的数据点相似度尽可能大，而不同簇间的数据点相似度尽可能小。聚类能在未知模式识别问题中，从一堆没有标签的数据中找到其中的关联关系。


    ### 1. 聚类算法概述

    聚类技术是一种无监督学习，是研究样本或指标分类问题的一种统计分析方法。聚类与分类的区别是其要划分的类是未知的。常用的聚类分析方法有系统聚类法、有序样品聚类法、动态聚类法、模糊聚类法、图论聚类法和聚类预报法等。

    在进行聚类分析时，应注意以下几点。


    #### (1) 可伸缩性

    常规的聚类算法对于小数据集（如对象数小于 200）的聚类效果较好，但对于包含几百万对象的大数据集聚类效果较差。例如，基于随机选择的聚类算法改进了大型应用中的聚类方法的聚类质量，拓展了数据处理量的伸缩范围，具有较好的聚类效果，但是它的计算效率较低，且对数据输入顺序敏感，只能聚类凸状或球形边界。


    #### (2) 处理不同类型属性的能力

    '
  toc: []
- raw: '许多算法是用于聚类数值类型的数据的，但是应用可能需要聚类其他类型的数据，如二元（Binary）类型、分类/标称（Categorical/Nominal）类型、序数（Ordinal）类型数据或者这些数据类型的混合。


    （3）发现任意形状的聚类


    许多聚类算法基于欧几里得或者曼哈顿距离度量来决定聚类，基于这样的距离度量的算法倾向发现具有相近尺度和密度的球状簇。但是一个簇可能是任意形状的，提出能发现任意形状簇的算法是很重要的。


    （4）输入参数的选择


    聚类结果对于输入参数十分敏感，参数通常很难确定，特别是对于包含高维对象的数据集来说。许多聚类算法在聚类分析中要求用户输入一定的参数，如希望产生的簇的数目。这样不仅加重了用户的负担，还使得聚类的质量难以控制。


    （5）处理“噪声”数据的能力


    绝大多数现实中的数据库包含了孤立点、缺失或者错误的数据，若一些聚类算法对于这样的数据敏感，则可能导致得到低质量的聚类结果。


    （6）对于输入记录的顺序不敏感


    一些聚类算法对于输入数据的顺序是敏感的。例如，对于同一个数据集合，当以不同的顺序被交给同一个算法时，可能生成差别很大的聚类结果。开发对数据输入顺序不敏感的算法具有重要的意义。


    （7）高维度


    一个数据库可能包含若干维或者属性。许多聚类算法擅长处理低维的数据，可能只涉及二维、三维。人类的眼睛最多在三维的情况下能够很好地判断聚类的质量。在高维空间中，聚类数据对象是非常有挑战性的，特别是考虑到这样的数据可能分布非常稀疏，而且高度偏斜。


    （8）基于约束的聚类


    在实际应用中，可能需要在各种约束条件下进行聚类。假设某项工作是在一个城市中为给定数目的自动提款机选择安放位置，为了做出决定，决策者可以对住宅区进行聚类，同时要考虑诸如城市的河流和公路网、每个地区的客户要求等情况，要找到既满足特定的约束又具有良好聚类特性的数据分组是一项具有挑战性的任务。


    （9）可解释性和可用性


    用户希望聚类结果是可解释的、可理解的和可用的。也就是说，聚类可能需要和特定的语义解释和应用相联系。应用目标如何影响聚类方法的选择也是一个重要的研究方向。


    2.聚类算法的分类


    很难对聚类算法提出一个简洁的分类，因为这些类别可能重叠，从而使得一种算法具有几种分类的特征。尽管如此，对不同的聚类算法提出一个相对有组织的描述仍然是有用的。聚类算法主要有以下5种分类方式。


    （1）基于划分的聚类算法


    给定一个有N个元组或者记录的数据集，分裂法将构造K个分组，每一个分组就代表一个聚类，其中K<N，且这K个分组满足两个条件，一是每一个分组至少包含一个数据记录，二是每一个数据记录属于且仅属于一个分组（该条件在某些模糊聚类算法中可以放宽）。对于给定的K，算法先给出一个初始的分组方法，再通过反复迭代的方法改变分组，使得每一次改进之后的分组方案都较前一次好，而所谓好的标准就是同一分组中的记录越近越好，而不同分组中的记录越远越好。其代表算法有K-Means算法、K-Medoids算法和CLARANS算法等。


    （2）基于层次的聚类算法


    基于层次的聚类算法对给定的数据集进行层次分解，直到满足某种条件为止。层次方法具体又可分为“自底向上”和“自顶向下”两种。在自底向上方案中，初始时每一个数据记录都组成一个单独的组，在接下来的迭代中，其把那些相互邻近的组合并成一个组，直到所有的记录组成一个分组或者满足某个条件为止。其代表算法有BIRCH算法、CURE算法和Chameleon算法等。


    （3）基于密度的聚类算法


    基于密度的聚类算法与其他算法的一个根本区别是其聚类原理不是基于各种距离的，而是基于密度的，这样就能克服基于距离的算法只能发现“类圆形”的聚类的缺点。只要一个区域中的点的密度大于某个阈值，密度方法就会把它加入到与之相近的聚类中。其代表算法有DBSCAN算法、OPTICS算法和DENCLUE算法等。


    （4）基于网格的聚类算法


    基于网格的聚类算法会先将数据空间划分成为有限个单元的网格结构，所有的处理都以单个的单元为对象。这样处理的一个突出优点是处理速度很快，通常与目标数据库中记录的个数无关，而只与把数据空间分为多少个单元有关。其代表算法有STING算法、CLIQUE算法和Wave-Cluster算法等。


    （5）基于模型的聚类算法


    基于模型的聚类算法给每一个聚类假定一个模型，并去寻找能够很好地满足这个模型的数据集。这样一个模型可能是数据点在空间中的密度分布函数或者其他函数，它的一个潜在的假设是目标数据集是由一系列的概率分布所决定的。通常，基于模型的方法有统计的方法和神经网络的方法两种。


    当然，除上述常用的5种聚类算法以外，还有传递闭包法、布尔矩阵法、直接聚类法、相关性分析聚类法等。


    3.聚类算法的应用场景


    K-Means算法也叫作K均值聚类算法，它是最著名的基于划分的聚类算法，其简洁和效率高的特点使得它成为所有聚类算法中最为广泛使用的算法。其步骤是随机选取K个对象作为初始的聚类中心，并计算每个对象与各个种子聚类中心之间的距离，把每个对象分配给距离它最近的聚类中心。聚类中心以及分配给它们的对象就代表一个聚类。每分配一个样本，聚类中心会根据聚类中现有的对象被重新计算。这个过程将不断重复，直到满足以下任何一个终止条件。


    （1）没有（或最小数目）对象被重新分配给不同的聚类。


    （2）没有（或最小数目）聚类中心再发生变化。


    （3）误差平方和局部最小。


