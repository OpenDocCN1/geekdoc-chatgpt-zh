- raw: '词汇知识主要包括实体与词汇之间的关系（实体的命名、称谓、英文名等）以及词汇之间的关系（同义关系、反义关系、缩略词关系、上下位词关系等）。例如，（“Plato”，中文名，柏拉图）、（赵匡胤，庙号，宋太祖）、（妻子，同义，老婆）。一些跨语言知识库专注于建立实体和概念在不同语言中的描述形式。词汇知识是知识图谱目前在实际应用中已经取得较好效果的一类知识。因为领域语料往往是丰富的，所以从这些语料中自动挖掘领域词汇，建立词汇之间的语义关联以及词汇与实体之间的关联，已经成为构建知识图谱最重要的一步。领域词汇知识是相对简单的知识，人类学习某个领域的知识时往往也是从该领域的词汇开始学习的。典型的词汇知识图谱有WordNet。


    4.常识知识


    常识是人类通过身体与世界交互而积累的经验与知识，是人们在交流时无须言明就能理解的知识。例如，我们都知道鸟有翅膀、鸟能飞等；又如，如果X是一个人，则X要么是男人要么是女人。常识知识的获取是构建知识图谱时的一大难点。常识的表征与定义、常识的获取与理解等问题一直都是人工智能发展的瓶颈问题。常识知识的基本特点是每个人都知道，所以很少出现在文本中。面向文本的信息抽取方法对于常识获取显得无能为力。典型的常识知识图谱包括Cyc、ConceptNet等。


    除了上述4类知识图谱之外，还有一些知识图谱侧重知识表示的不同维度。首先，很多事实的成立是有时空条件的，有些知识的存在是有时间限制的，必须为这些知识加上时间维度。例如，（奥巴马，职业，美国总统，2009-01-20，2017-01-20）这个五元组表示“奥巴马是美国总统”这一事实从2009年1月20日开始生效，至2017年1月20日失效；又如，在表达某一天的温度时，（2019-01-01，平均温度，16℃，上海）和（2019-01-01，平均温度，-5℃，北京）这两个四元组分别表示了2019年1月1日这一天上海与北京两地不同的温度。其次，一些知识含有主观性因素。例如，对于薯条是否为健康食品这一问题，不同人的认识是不同的。最后，有些知识关注实体的多模态表示。例如，（柏拉图，图片，plato.jpg）表示了柏拉图的适用图片。


    ### [7.1.4　知识图谱的重要性](../Text/contents.xhtml#z178)


    哲学家柏拉图把知识定义为“Justified True Belief”，即知识需要满足合理性（Justified）、真实性（True）、被相信（Believed）这3个核心要素。简单而言，知识是人类通过观察、学习和思考有关客观世界的各种现象而获得和总结出的所有事实、概念、规则和原则（Rules
    and Principles）的集合。人类发明了各种手段来描述、表示和传承知识，如自然语言、绘画、音乐、数学语言、物理模型、化学公式等，可见对客观世界规律的知识化描述对于人类社会发展的重要性。具有获取、表示和处理知识的能力是人类心智区别于其他物种心智的重要特征，知识图谱已成为推动机器基于人类知识获取认知能力的重要途径，并将逐渐成为未来智能社会的重要生产资料。


    1.知识图谱是人工智能的重要基石


    知识图谱对于人工智能的重要价值在于，知识是人工智能的基石。机器可以模仿人类的视觉、听觉等感知能力，但这些感知能力并非人类的专属，动物也具备感知能力，甚至某些感知能力比人类更强，如狗的嗅觉。而“认知语言是人区别于其他动物的能力，同时，知识使人不断地进步，不断地凝练、传承知识，是推动人不断进步的重要基础”，知识对于人工智能的价值就在于让机器具备认知能力。


    有了知识的人工智能会变得更强大，可以做更多的事情。反过来，更强大的人工智能可以帮助人们更好地从客观世界中去挖掘、获取和沉淀知识，这些知识和人工智能系统形成正循环，两者共同进步。机器通过人工智能技术与用户的互动，从中获取数据、优化算法，更重要的是构建和完善知识图谱，认知和理解世界，进而服务于这个世界，让人类的生活更加美好。


    2.知识图谱推动智能应用


    知识图谱将知识智能地连接起来，能够对各类应用进行智能化升级，为用户带来更智能的应用体验。知识图谱是一个宏大的数据模型，可以构建庞大的知识网络，包含客观世界存在的大量实体、属性以及关系，为人们提供了一种快速便捷进行知识检索与推理的方式。近年来，蓬勃发展的人工智能本质上是一次知识革命，其核心在于通过数据观察与感知世界，实现分类预测、自动化等智能化服务。知识图谱作为人类知识描述的重要载体，推动着信息检索、问答系统等众多智能应用。


    3.知识图谱是强人工智能发展的核心驱动力之一


    尽管人工智能依靠机器学习和深度学习取得了快速进展，但是由于严重依赖人类的监督以及大量的标注数据，仍属于弱人工智能范畴，离强人工智能具有较大差距。强人工智能的实现需要机器掌握大量的常识性知识，将信息中的知识或者数据加以关联，同时以人类的思维模式和知识结构来进行语言理解、视觉场景解析和决策分析。知识图谱技术是由弱人工智能发展到强人工智能的必要条件，对于实现强人工智能有着重要的意义。


    ## [7.2　知识表示和知识建模](../Text/contents.xhtml#z179)


    知识表示与知识建模是知识图谱中的重要内容，在构建知识图谱的时候，首先要建立知识表达的数据模型，也就是知识图谱的整个数据组织体系。


    ### [7.2.1　知识表示](../Text/contents.xhtml#z180)


    知识表示学习主要是面向知识图谱中的实体和关系进行表示学习，使用建模方法将实体和向量表示在低维稠密向量空间中，并进行计算和推理。


    1.知识表示概述


    知识是人类在认识和改造客观世界的过程中总结出的客观事实、概念、定理和公理的集合。知识具有不同的分类方式，例如，按照知识的作用范围可分为常识性知识与领域性知识。知识表示是将现实世界中存在的知识转换成计算机可识别和处理的内容，是一种描述知识的数据结构，用于对知识进行描述或约定。知识表示在人工智能的构建中具有关键作用，通过适当的方式表示知识，形成尽可能全面的知识表达，可使机器通过学习这些知识，表现出类似于人类的行为。知识表示是知识工程中一个重要的研究课题，也是知识图谱研究中知识抽取、存储、融合、推理的基础。


    2.知识表示方法


    知识表示方法主要分为基于符号的知识表示方法与基于表示学习的知识表示方法。


    （1）基于符号的知识表示方法


    基于符号的知识表示方法分为一阶谓词逻辑表示法、产生式规则表示法、框架表示法与语义网络表示法。


    一阶谓词逻辑表示法是基于谓词逻辑的知识表示方法，通过命题、逻辑连接词、个体、谓词与量词等要素组成的谓词公式，描述事物的对象、性质、状况和关系。一阶谓词逻辑表示法以数理逻辑为基础，表示结果较为精确，表达较为自然，形式上接近人类自然语言。但是其也存在表示能力较差，只能表达确定性知识，对于过程性和非确定性知识表达能力有限的问题。


    产生式规则表示法是20世纪40年代由逻辑学家埃米尔·波斯特（Emil Post）提出的。根据知识之间具有因果关联关系的逻辑，形成了“IF-THEN”的知识表示方法，是早期专家系统常用的知识表示方法之一。这种表示方法与人类的因果判断方式大致相同，直观、自然、便于推理。除此之外，产生式规则表示法的知识表达范畴较广、包括确定性知识、设置置信度的不确定性知识、启发式知识与过程性知识。但是产生式规则表示法由于具有统一的表示格式，当知识规模较大时，知识推理效率较低，容易出现组合爆炸问题。


    框架表示法是20世纪70年代初由人工智能专家马文·明斯基提出的一种用于表示知识的框架理论，来源于人们对客观世界中各种事物的认识都是以一种类似框架的架构存储在记忆中的思想。框架是一种通用数据结构，用于存储人们过去积累的信息和经验。在框架结构中，能够借助过去经验中的概念分析和解释新的信息情况。在表达知识时，框架能够表示事物的类别、个体、属性和关系等内容。框架结构一般由“框架名-槽名-侧面-值”4部分组成，即一个框架由若干个槽组成，其中，槽用于描述事物某一方面的属性；一个槽由若干个侧面组成，侧面用于描述相应属性的一个方面；每个侧面拥有若干值。框架具有继承性、结构化、自然性等优点，但复杂的框架构建成本较高，对知识库的质量要求较高，同时表达不够灵活，很难与其他的数据集相互关联使用。例如，通过框架表示法来表示“计算机主机”，它总共有6个属性，也就是6个槽，包括“主机品牌”“生产厂商”等，框架表示法示意图如图7-2所示。


    语义网络表示法是以1960年由认知科学家艾伦·柯林斯（Allan Collins）提出的语义网络为基础的知识表示方法。语义网络是一种通过实体以及实体间语义关系表达知识的有向图，在图中，节点表示事物、属性、概念、状态、事件、情况、动作等含义，节点之间的弧表示它所连接的两个节点之间的语义关系。根据表示的知识情况需要定义弧上的标识，一般该标识是谓词逻辑中的谓词，常用的标识包括实例关系、分类关系、成员关系、属性关系、包含关系、时间关系、位置关系等。语义网络由语义基元构成，语义基元可通过三元组（节点1，弧，节点2）来描述，语义网络由若干个语义基元及其之间的语义关联关系组成。语义网络表示法具有广泛的表示范围和强大的表示能力，表示形式简单直接、容易理解、符合自然规律。然而，语义网络存在节点与边的值没有标准、完全由用户自己定义、不便于知识共享及无法区分知识描述与知识实例等问题。例如，通过语义网络，可以把“重庆坐落于中国西南部”表示为三元组形式（重庆，坐落于，中国西南部），三元组表示示意图如图7-3所示。


    ![](Images/cutq_146_1537_l.jpg)


    图7-2　框架表示法示意图


    ![](Images/cutq_146_3444_m.jpg)


    图7-3　三元组表示示意图


    （2）基于表示学习的知识表示方法


    早期知识表示方法与语义网知识表示法通过符号显式地表示概念及其关系。事实上，许多知识具有不易符号化、隐含性等特点，因此仅通过显式表示的知识无法获得全面的知识特征。此外，语义计算是知识表示的重要目标，基于符号的知识表示方法无法有效计算实体间的语义关系。基于表示学习的知识表示经典模型TransE如图7-4所示。


    ![](Images/cutq_146_43327_m.jpg)


    图7-4　基于表示学习的知识表示经典模型TransE


    TransE模型将每个三元组实例（head，relation，tail）中的关系relation看作从实体head到实体tail的翻译，通过不断调整h、r和t（分别为head、relation和tail的向量），使（h+r）尽可能与t相等，即h+r\=t。


    3.技术发展趋势


    知识表示作为知识抽取、存储、融合、推理的基础，侧重于表达实体、概念之间的语义关联，针对知识图谱的语义增强在未来依旧是知识表示的重要任务。知识表示的研究趋势和技术发展趋势包括以下4个方面。


    （1）符号与表示学习的融合统一


    基于符号的知识表示方法由于考虑了人类的自然语言理解方式，具有严密性、自然性、通用性、知识易表达等优点，但是也存在计算效率低、无法捕捉隐含语义知识等不足。而基于表示学习的知识表示方法计算效率高，却存在可靠性低、推理效果不佳等问题。因此，研究基于符号逻辑与表示学习融合统一的知识表示方法有助于知识表达性能的进一步提升，也是未来的发展方向。


    （2）面向事理逻辑的知识表示


    事理逻辑是指事件之间的演化规律和模式。已有的知识图谱以实体、实体属性、实体与实体或属性之间的关系为核心，缺乏针对事件之间的演化规律与模式的知识挖掘。事实上，事理逻辑是一种非常有价值的常识，挖掘这种知识对认识和分析人类行为与社会发展变化规律意义重大。面向事件实体、事理逻辑关系（顺承、因果、条件、上下位、组成等）的事件知识表示方法是表达和丰富事理图谱的重要基础。


    （3）融合时空间维度的知识表示


    现实世界中，许多知识具有时间和空间属性，例如，“王菲的丈夫是李亚鹏”这条知识具有潜在的时间信息；“早餐是豆浆和油条”这条知识潜在的空间信息是中国的北方地区，从时空维度拓展知识表示对许多特定领域具有较强的现实意义。德国马普研究所研制的YAGO知识库为许多知识条目增加了时间和空间维度的属性描述，丰富了知识库内容。人们关心当前事实的同时，也会关注过去和未来的知识情况以及不同空间的知识表达含义，形成融合时间或空间维度的知识表示是增强知识表达的有效方式。


    （4）融合跨媒体元素的知识表示


    当前的知识图谱主要以文本为主，事实上，跨媒体元素包括图像、视频、音频等数据对于丰富和增强知识图谱的知识语义具有重要作用。不同的跨媒体元素能够表达相同的语义信息，能比单一模态反映更加全面、正确的知识内容。建立基于跨媒体元素的统一知识表示方法对于分析挖掘跨媒体要素的语义信息，以及构建跨媒体知识图谱具有重要意义。


    ### [7.2.2　知识建模](../Text/contents.xhtml#z181)


    知识建模是通过各种知识获取方法获得突发事件领域的主要概念和概念之间的关系，用精确的语言加以描述的过程。


    1.知识建模概述


    知识建模是指建立知识图谱的数据模型，即采用什么样的方式来表达知识，构建一个本体模型对知识进行描述。在本体模型中需要构建本体的概念、属性以及概念之间的关系。知识建模的过程是知识图谱构建的基础，高质量的数据模型能避免许多不必要、重复性的知识获取工作，有效提高知识图谱构建的效率，降低领域数据融合的成本。不同领域的知识具有不同的数据特点，可分别构建不同的本体模型。


    知识建模一般有自顶向下和自底向上两种构建方法。自顶向下的方法是指在构建知识图谱时先定义数据模式（即本体），一般通过领域专家人工编制，再从最顶层的概念开始定义，逐步细化，形成结构良好的分类层次结构。自顶向下的知识建模构建方法如图7-5所示。


    ![](Images/cutq_148_52527_l.jpg)


    图7-5　自顶向下的知识建模构建方法


    自底向上的方法则相反，先对现有实体进行归纳组织，形成底层的概念，再逐步往上抽象形成上层的概念。自底向上的方法多用于开放域知识图谱的本体构建，因为开放的世界太过复杂，用自顶向下的方法无法考虑周全，且随着世界变化，对应的概念还在增长，自底向上的方法可满足概念不断增长的需要。自底向上的知识建模构建方法如图7-6所示。


    ![](Images/cutq_148_1866_m.jpg)


    图7-6　自底向上的知识建模构建方法


    2.知识建模方法


    目前，知识建模的实际操作过程可分为手工建模方式和半自动建模方式。手工建模方式适用于容量小、质量要求高的知识图谱，但是无法满足大规模的知识构建，是一个耗时、昂贵、需要专业知识的任务；半自动建模方式将自然语言处理与手工方式结合，适用于规模大且语义复杂的知识图谱。


    （1）手工建模方式


    手工建模方式的过程主要可以分为6个步骤：明确领域本体及任务、模型复用、列出本体涉及领域中的元素、明确分类体系、定义属性及关系和定义约束条件。在手工建模的过程中，以上的6个步骤并不是按顺序一一执行的，可以根据知识建模的具体需求，组合其中的步骤达到知识建模的目的。手工建模方式流程图如图7-7所示。


    ![](Images/cutq_149_9686_l.jpg)


    图7-7　手工建模方式流程图


    （2）半自动建模方式


    半自动建模方式先通过自动方式获取知识图谱，再进行大量的人工干预。运用自然语言处理技术半自动建模的方法可以分为三大类：基于结构化数据的知识建模方法、基于半结构化数据的知识建模方法和基于非结构化数据的知识建模方法。近年来，对于非结构化数据的知识建模方法研究较多，涌现出一批优秀的基于非结构化数据的知识建模方法的高水平研究成果。半自动建模方式流程图如图7-8所示。


    ![](Images/cutq_149_18351_l.jpg)


    图7-8　半自动建模方式流程图


    （3）知识建模质量评价


    对知识建模的质量评价也是知识建模的重要组成部分，通常与实体对齐任务一起进行。质量评价的作用在于可以对知识模型的可信度进行量化，通过舍弃置信度较低的知识来保障知识库的质量。一个合理的本体模型应满足以下标准。


    ①明确性和客观性：用自然语言对所定义的术语给出明确的、客观的语义定义。


    ②完全性：定义是完整的，完全能表达所描述领域内术语的含义。


    ③一致性：正确、一致地展示数据、对象和信息，由术语得出的推论与术语本身的含义不会产生矛盾。


    ④最大单调可扩展性：添加通用或专用的术语时，不需要修改已有的内容，便于知识图谱扩展。


    ⑤最小承诺性：尽可能少的约束，指本体约定应该最小，对建模对象的约束要尽可能少。


    ⑥易用性：有效地支撑业务的分析和决策需求。


    ## [7.3　知识抽取](../Text/contents.xhtml#z182)


    知识抽取指从不同来源、不同结构的数据中进行知识提取，形成知识的过程。为了提供令用户满意的知识服务，知识图谱不仅要包含其涉及领域已知的知识，还要能及时发现并添加新的知识。知识的完整性及准确性决定了知识图谱所能提供的知识服务的广度、深度和精度。因此，知识抽取在知识图谱的构建过程中显得尤为重要。


    知识抽取往往采用一些自动化的抽取方法从结构化、半结构化和非结构化的信息源中提取出实体、关系、属性等信息，形成三元组或多元组关系。知识抽取的关键技术包括实体抽取、关系抽取和属性抽取。其中，知识抽取示意图如图7-9所示。


    ![](Images/cutq_150_2622_l.jpg)


    图7-9　知识抽取示意图


    ### [7.3.1　实体抽取](../Text/contents.xhtml#z183)


    实体抽取也被称为命名实体识别（Named Entity Recognition，NER），指从原始数据中自动识别出命名实体。由于实体是知识图谱中最基础的知识要素，关系和属性都与实体息息相关，因此实体的抽取质量直接影响了图谱中知识的质量。


    实体抽取的方法主要有基于规则与词典的方法、基于机器学习的方法以及面向开放域的方法。基于规则与词典的方法主要利用用户手工制定的实体规则和词典，通过匹配的方式在信息源中标记出实体；基于机器学习的方法主要利用统计机器学习的方式对原始数据进行训练，利用训练完成的模型进行实体的识别；面向开放域的方法则主要对海量的Web数据中的实体进行分类与聚类。


    ### [7.3.2　关系抽取](../Text/contents.xhtml#z184)


    关系抽取的目标是抽取语料中命名实体的语义关系。实体抽取技术会在原始的语料上标记一些命名实体。为了形成知识结构，还需要从中抽取命名实体间的关联信息，从而利用这些信息将离散的命名实体连接起来，这就是关系抽取技术。'
  fmt: '

    ### 词汇知识

    词汇知识主要包括实体与词汇之间的关系（实体的命名、称谓、英文名等）以及词汇之间的关系（同义关系、反义关系、缩略词关系、上下位词关系等）。例如，（“Plato”，中文名，柏拉图）、（赵匡胤，庙号，宋太祖）、（妻子，同义，老婆）。一些跨语言知识库专注于建立实体和概念在不同语言中的描述形式。词汇知识是知识图谱目前在实际应用中已经取得较好效果的一类知识。因为领域语料往往是丰富的，所以从这些语料中自动挖掘领域词汇，建立词汇之间的语义关联以及词汇与实体之间的关联，已经成为构建知识图谱最重要的一步。领域词汇知识是相对简单的知识，人类学习某个领域的知识时往往也是从该领域的词汇开始学习的。典型的词汇知识图谱有`WordNet`。


    ### 4. 常识知识

    常识是人类通过身体与世界交互而积累的经验与知识，是人们在交流时无须言明就能理解的知识。例如，我们都知道鸟有翅膀、鸟能飞等；又如，如果`X`是一个人，则`X`要么是男人要么是女人。常识知识的获取是构建知识图谱时的一大难点。常识的表征与定义、常识的获取与理解等问题一直都是人工智能发展的瓶颈问题。常识知识的基本特点是每个人都知道，所以很少出现在文本中。面向文本的信息抽取方法对于常识获取显得无能为力。典型的常识知识图谱包括`Cyc`、`ConceptNet`等。


    除了上述4类知识图谱之外，还有一些知识图谱侧重知识表示的不同维度。首先，很多事实的成立是有时空条件的，有些知识的存在是有时间限制的，必须为这些知识加上时间维度。例如，`（奥巴马，职业，美国总统，2009-01-20，2017-01-20）`这个五元组表示“奥巴马是美国总统”这一事实从2009年1月20日开始生效，至2017年1月20日失效；又如，在表达某一天的温度时，`（2019-01-01，平均温度，16℃，上海）`和`（2019-01-01，平均温度，-5℃，北京）`这两个四元组分别表示了2019年1月1日这一天上海与北京两地不同的温度。其次，一些知识含有主观性因素。例如，对于薯条是否为健康食品这一问题，不同人的认识是不同的。最后，有些知识关注实体的多模态表示。例如，`（柏拉图，图片，plato.jpg）`表示了柏拉图的适用图片。


    ### [7.1.4　知识图谱的重要性](../Text/contents.xhtml#z178)

    哲学家柏拉图把知识定义为“`Justified True Belief`”，即知识需要满足合理性（`Justified`）、真实性（`True`）、被相信（`Believed`）这3个核心要素。简单而言，知识是人类通过观察、学习和思考有关客观世界的各种现象而获得和总结出的所有事实、概念、规则和原则（`Rules
    and Principles`）的集合。人类发明了各种手段来描述、表示和传承知识，如自然语言、绘画、音乐、数学语言、物理模型、化学公式等，可见对客观世界规律的知识化描述对于人类社会发展的重要性。具有获取、表示和处理知识的能力是人类心智区别于其他物种心智的重要特征，知识图谱已成为推动机器基于人类知识获取认知能力的重要途径，并将逐渐成为未来智能社会的重要生产资料。


    #### 1. 知识图谱是人工智能的重要基石

    知识图谱对于人工智能的重要价值在于，知识是人工智能的基石。机器可以模仿人类的视觉、听觉等感知能力，但这些感知能力并非人类的专属，动物也具备感知能力，甚至某些感知能力比人类更强，如狗的嗅觉。而“认知语言是人区别于其他动物的能力，同时，知识使人不断地进步，不断地凝练、传承知识，是推动人不断进步的重要基础”，知识对于人工智能的价值就在于让机器具备认知能力。


    有了知识的人工智能会变得更强大，可以做更多的事情。反过来，更强大的人工智能可以帮助人们更好地从客观世界中去挖掘、获取和沉淀知识，这些知识和人工智能系统形成正循环，两者共同进步。机器通过人工智能技术与用户的互动，从中获取数据、优化算法，更重要的是构建和完善知识图谱，认知和理解世界，进而服务于这个世界，让人类的生活更加美好。


    #### 2. 知识图谱推动智能应用

    知识图谱将知识智能地连接起来，能够对各类应用进行智能化升级，为用户带来更智能的应用体验。知识图谱是一个宏大的数据模型，可以构建庞大的知识网络，包含客观世界存在的大量实体、属性以及关系，为人们提供了一种快速便捷进行知识检索与推理的方式。近年来，蓬勃发展的人工智能本质上是一次知识革命，其核心在于通过数据观察与感知世界，实现分类预测、自动化等智能化服务。知识图谱作为人类知识描述的重要载体，推动着信息检索、问答系统等众多智能应用。


    #### 3. 知识图谱是强人工智能发展的核心驱动力之一

    尽管人工智能依靠机器学习和深度学习取得了快速进展，但是由于严重依赖人类的监督以及大量的标注数据，仍属于弱人工智能范畴，离强人工智能具有较大差距。强人工智能的实现需要机器掌握大量的常识性知识，将信息中的知识或者数据加以关联，同时以人类的思维模式和知识结构来进行语言理解、视觉场景解析和决策分析。知识图谱技术是由弱人工智能发展到强人工智能的必要条件，对于实现强人工智能有着重要的意义。


    ## [7.2　知识表示和知识建模](../Text/contents.xhtml#z179)

    知识表示与知识建模是知识图谱中的重要内容，在构建知识图谱的时候，首先要建立知识表达的数据模型，也就是知识图谱的整个数据组织体系。


    ### [7.2.1　知识表示](../Text/contents.xhtml#z180)

    知识表示学习主要是面向知识图谱中的实体和关系进行表示学习，使用建模方法将实体和向量表示在低维稠密向量空间中，并进行计算和推理。


    #### 1. 知识表示概述

    知识是人类在认识和改造客观世界的过程中总结出的客观事实、概念、定理和公理的集合。知识具有不同的分类方式，例如，按照知识的作用范围可分为常识性知识与领域性知识。知识表示是将现实世界中存在的知识转换成计算机可识别和处理的内容，是一种描述知识的数据结构，用于对知识进行描述或约定。知识表示在人工智能的构建中具有关键作用，通过适当的方式表示知识，形成尽可能全面的知识表达，可使机器通过学习这些知识，表现出类似于人类的行为。知识表示是知识工程中一个重要的研究课题，也是知识图谱研究中知识抽取、存储、融合、推理的基础。


    #### 2. 知识表示方法

    知识表示方法主要分为基于符号的知识表示方法与基于表示学习的知识表示方法。


    ##### （1）基于符号的知识表示方法

    基于符号的知识表示方法分为一阶谓词逻辑表示法、产生式规则表示法、框架表示法与语义网络表示法。


    一阶谓词逻辑表示法是基于谓词逻辑的知识表示方法，通过命题、逻辑连接词、个体、谓词与量词等要素组成的谓词公式，描述事物的对象、性质、状况和关系。一阶谓词逻辑表示法以数理逻辑为基础，表示结果较为精确，表达较为自然，形式上接近人类自然语言。但是其也存在表示能力较差，只能表达确定性知识，对于过程性和非确定性知识表达能力有限的问题。


    产生式规则表示法是20世纪40年代由逻辑学家埃米尔·波斯特（Emil Post）提出的。根据知识之间具有因果关联关系的逻辑，形成了“`IF-THEN`”的知识表示方法，是早期专家系统常用的知识表示方法之一。这种表示方法与人类的因果判断方式大致相同，直观、自然、便于推理。除此之外，产生式规则表示法的知识表达范畴较广、包括确定性知识、设置置信度的不确定性知识、启发式知识与过程性知识。但是产生式规则表示法由于具有统一的表示格式，当知识规模较大时，知识推理效率较低，容易出现组合爆炸问题。


    框架表示法是20世纪70年代初由人工智能专家马文·明斯基提出的一种用于表示知识的框架理论，来源于人们对客观世界中各种事物的认识都是以一种类似框架的架构存储在记忆中的思想。框架是一种通用数据结构，用于存储人们过去积累的信息和经验。在框架结构中，能够借助过去经验中的概念分析和解释新的信息情况。在表达知识时，框架能够表示事物的类别、个体、属性和关系等内容。框架结构一般由“框架名-槽名-侧面-值”4部分组成，即一个框架由若干个槽组成，其中，槽用于描述事物某一方面的属性；一个槽由若干个侧面组成，侧面用于描述相应属性的一个方面；每个侧面拥有若干值。框架具有继承性、结构化、自然性等优点，但复杂的框架构建成本较高，对知识库的质量要求较高，同时表达不够灵活，很难与其他的数据集相互关联使用。例如，通过框架表示法来表示“计算机主机”，它总共有6个属性，也就是6个槽，包括“主机品牌”“生产厂商”等，框架表示法示意图如图7-2所示。


    语义网络表示法是以1960年由认知科学家艾伦·柯林斯（Allan Collins）提出的语义网络为基础的知识表示方法。语义网络是一种通过实体以及实体间语义关系表达知识的有向图，在图中，节点表示事物、属性、概念、状态、事件、情况、动作等含义，节点之间的弧表示它所连接的两个节点之间的语义关系。根据表示的知识情况需要定义弧上的标识，一般该标识是谓词逻辑中的谓词，常用的标识包括实例关系、分类关系、成员关系、属性关系、包含关系、时间关系、位置关系等。语义网络由语义基元构成，语义基元可通过三元组`（节点1，弧，节点2）`来描述，语义网络由若干个语义基元及其之间的语义关联关系组成。语义网络表示法具有广泛的表示范围和强大的表示能力，表示形式简单直接、容易理解、符合自然规律。然而，语义网络存在节点与边的值没有标准、完全由用户自己定义、不便于知识共享及无法区分知识描述与知识实例等问题。例如，通过语义网络，可以把“重庆坐落于中国西南部”表示为三元组形式`（重庆，坐落于，中国西南部）`，三元组表示示意图如图7-3所示。


    ![](Images/cutq_146_1537_l.jpg)

    图7-2　框架表示法示意图


    ![](Images/cutq_146_3444_m.jpg)

    图7-3　三元组表示示意图


    ##### （2）基于表示学习的知识表示方法

    早期知识表示方法与语义网知识表示法通过符号显式地表示概念及其关系。事实上，许多知识具有不易符号化、隐含性等特点，因此仅通过显式表示的知识无法获得全面的知识特征。此外，语义计算是知识表示的重要目标，基于符号的知识表示方法无法有效计算实体间的语义关系。基于表示学习的知识表示经典模型`TransE`如图7-4所示。


    ![](Images/cutq_146_43327_m.jpg)

    图7-4　基于表示学习的知识表示经典模型TransE


    `TransE`模型将每个三元组实例（`head`，`relation`，`tail`）中的关系`relation`看作从实体`head`到实体`tail`的翻译，通过不断调整`h`、`r`和`t`（分别为`head`、`relation`和`tail`的向量），使（`h+r`）尽可能与`t`相等，即`h+r=t`。


    #### 3. 技术发展趋势

    知识表示作为知识抽取、存储、融合、推理的基础，侧重于表达实体、概念之间的语义关联，针对知识图谱的语义增强在未来依旧是知识表示的重要任务。知识表示的研究趋势和技术发展趋势包括以下4个方面。


    ##### （1）符号与表示学习的融合统一

    基于符号的知识表示方法由于考虑了人类的自然语言理解方式，具有严密性、自然性、通用性、知识易表达等优点，但是也存在计算效率低、无法捕捉隐含语义知识等不足。而基于表示学习的知识表示方法计算效率高，却存在可靠性低、推理效果不佳等问题。因此，研究基于符号逻辑与表示学习融合统一的知识表示方法有助于知识表达性能的进一步提升，也是未来的发展方向。


    ##### （2）面向事理逻辑的知识表示

    事理逻辑是指事件之间的演化规律和模式。已有的知识图谱以实体、实体属性、实体与实体或属性之间的关系为核心，缺乏针对事件之间的演化规律与模式的知识挖掘。事实上，事理逻辑是一种非常有价值的常识，挖掘这种知识对认识和分析人类行为与社会发展变化规律意义重大。面向事件实体、事理逻辑关系（顺承、因果、条件、上下位、组成等）的事件知识表示方法是表达和丰富事理图谱的重要基础。


    ##### （3）融合时空间维度的知识表示

    现实世界中，许多知识具有时间和空间属性，例如，“王菲的丈夫是李亚鹏”这条知识具有潜在的时间信息；“早餐是豆浆和油条”这条知识潜在的空间信息是中国的北方地区，从时空维度拓展知识表示对许多特定领域具有较强的现实意义。德国马普研究所研制的`YAGO`知识库为许多知识条目增加了时间和空间维度的属性描述，丰富了知识库内容。人们关心当前事实的同时，也会关注过去和未来的知识情况以及不同空间的知识表达含义，形成融合时间或空间维度的知识表示是增强知识表达的有效方式。


    ##### （4）融合跨媒体元素的知识表示

    当前的知识图谱主要以文本为主，事实上，跨媒体元素包括图像、视频、音频等数据对于丰富和增强知识图谱的知识语义具有重要作用。不同的跨媒体元素能够表达相同的语义信息，能比单一模态反映更加全面、正确的知识内容。建立基于跨媒体元素的统一知识表示方法对于分析挖掘跨媒体要素的语义信息，以及构建跨媒体知识图谱具有重要意义。


    ### [7.2.2　知识建模](../Text/contents.xhtml#z181)

    知识建模是通过各种知识获取方法获得突发事件领域的主要概念和概念之间的关系，用精确的语言加以描述的过程。


    #### 1. 知识建模概述

    知识建模是指建立知识图谱的数据模型，即采用什么样的方式来表达知识，构建一个本体模型对知识进行描述。在本体模型中需要构建本体的概念、属性以及概念之间的关系。知识建模的过程是知识图谱构建的基础，高质量的数据模型能避免许多不必要、重复性的知识获取工作，有效提高知识图谱构建的效率，降低领域数据融合的成本。不同领域的知识具有不同的数据特点，可分别构建不同的本体模型。


    知识建模一般有自顶向下和自底向上两种构建方法。自顶向下的方法是指在构建知识图谱时先定义数据模式（即本体），一般通过领域专家人工编制，再从最顶层的概念开始定义，逐步细化，形成结构良好的分类层次结构。自顶向下的知识建模构建方法如图7-5所示。


    ![](Images/cutq_148_52527_l.jpg)

    图7-5　自顶向下的知识建模构建方法


    自底向上的方法则相反，先对现有实体进行归纳组织，形成底层的概念，再逐步往上抽象形成上层的概念。自底向上的方法多用于开放域知识图谱的本体构建，因为开放的世界太过复杂，用自顶向下的方法无法考虑周全，且随着世界变化，对应的概念还在增长，自底向上的方法可满足概念不断增长的需要。自底向上的知识建模构建方法如图7-6所示。


    ![](Images/cutq_148_1866_m.jpg)

    图7-6　自底向上的知识建模构建方法


    #### 2. 知识建模方法

    目前，知识建模的实际操作过程可分为手工建模方式和半自动建模方式。手工建模方式适用于容量小、质量要求高的知识图谱，但是无法满足大规模的知识构建，是一个耗时、昂贵、需要专业知识的任务；半自动建模方式将自然语言处理与手工方式结合，适用于规模大且语义复杂的知识图谱。


    ##### （1）手工建模方式

    手工建模方式的过程主要可以分为6个步骤：明确领域本体及任务、模型复用、列出本体涉及领域中的元素、明确分类体系、定义属性及关系和定义约束条件。在手工建模的过程中，以上的6个步骤并不是按顺序一一执行的，可以根据知识建模的具体需求，组合其中的步骤达到知识建模的目的。手工建模方式流程图如图7-7所示。


    ![](Images/cutq_149_9686_l.jpg)

    图7-7　手工建模方式流程图


    ##### （2）半自动建模方式

    半自动建模方式先通过自动方式获取知识图谱，再进行大量的人工干预。运用自然语言处理技术半自动建模的方法可以分为三大类：基于结构化数据的知识建模方法、基于半结构化数据的知识建模方法和基于非结构化数据的知识建模方法。近年来，对于非结构化数据的知识建模方法研究较多，涌现出一批优秀的基于非结构化数据的知识建模方法的高水平研究成果。半自动建模方式流程图如图7-8所示。


    ![](Images/cutq_149_18351_l.jpg)

    图7-8　半自动建模方式流程图


    ##### （3）知识建模质量评价

    对知识建模的质量评价也是知识建模的重要组成部分，通常与实体对齐任务一起进行。质量评价的作用在于可以对知识模型的可信度进行量化，通过舍弃置信度较低的知识来保障知识库的质量。一个合理的本体模型应满足以下标准。


    ①明确性和客观性：用自然语言对所定义的术语给出明确的、客观的语义定义。

    ②完全性：定义是完整的，完全能表达所描述领域内术语的含义。

    ③一致性：正确、一致地展示数据、对象和信息，由术语得出的推论与术语本身的含义不会产生矛盾。

    ④最大单调可扩展性：添加通用或专用的术语时，不需要修改已有的内容，便于知识图谱扩展。

    ⑤最小承诺性：尽可能少的约束，指本体约定应该最小，对建模对象的约束要尽可能少。

    ⑥易用性：有效地支撑业务的分析和决策需求。


    ## [7.3　知识抽取](../Text/contents.xhtml#z182)

    知识抽取指从不同来源、不同结构的数据中进行知识提取，形成知识的过程。为了提供令用户满意的知识服务，知识图谱不仅要包含其涉及领域已知的知识，还要能及时发现并添加新的知识。知识的完整性及准确性决定了知识图谱所能提供的知识服务的广度、深度和精度。因此，知识抽取在知识图谱的构建过程中显得尤为重要。


    知识抽取往往采用一些自动化的抽取方法从结构化、半结构化和非结构化的信息源中提取出实体、关系、属性等信息，形成三元组或多元组关系。知识抽取的关键技术包括实体抽取、关系抽取和属性抽取。其中，知识抽取示意图如图7-9所示。


    ![](Images/cutq_150_2622_l.jpg)

    图7-9　知识抽取示意图


    ### [7.3.1　实体抽取](../Text/contents.xhtml#z183)

    实体抽取也被称为命名实体识别（`Named Entity Recognition`，`NER`），指从原始数据中自动识别出命名实体。由于实体是知识图谱中最基础的知识要素，关系和属性都与实体息息相关，因此实体的抽取质量直接影响了图谱中知识的质量。


    实体抽取的方法主要有基于规则与词典的方法、基于机器学习的方法以及面向开放域的方法。基于规则与词典的方法主要利用用户手工制定的实体规则和词典，通过匹配的方式在信息源中标记出实体；基于机器学习的方法主要利用统计机器学习的方式对原始数据进行训练，利用训练完成的模型进行实体的识别；面向开放域的方法则主要对海量的Web数据中的实体进行分类与聚类。


    ### [7.3.2　关系抽取](../Text/contents.xhtml#z184)

    关系抽取的目标是抽取语料中命名实体的语义关系。实体抽取技术会在原始的语料上标记一些命名实体。为了形成知识结构，还需要从中抽取命名实体间的关联信息，从而利用这些信息将离散的命名实体连接起来，这就是关系抽取技术。

    '
  trans: '


    ### 词汇知识

    词汇知识主要包括实体与词汇之间的关系（实体的命名、称谓、英文名等）以及词汇之间的关系（同义关系、反义关系、缩略词关系、上下位词关系等）。例如，（“Plato”，中文名，柏拉图）、（赵匡胤，庙号，宋太祖）、（妻子，同义，老婆）。一些跨语言知识库专注于建立实体和概念在不同语言中的描述形式。词汇知识是知识图谱目前在实际应用中已经取得较好效果的一类知识。因为领域语料往往是丰富的，所以从这些语料中自动挖掘领域词汇，建立词汇之间的语义关联以及词汇与实体之间的关联，已经成为构建知识图谱最重要的一步。领域词汇知识是相对简单的知识，人类学习某个领域的知识时往往也是从该领域的词汇开始学习的。典型的词汇知识图谱有`WordNet`。


    ### 4. 常识知识

    常识是人类通过身体与世界交互而积累的经验与知识，是人们在交流时无须言明就能理解的知识。例如，我们都知道鸟有翅膀、鸟能飞等；又如，如果`X`是一个人，则`X`要么是男人要么是女人。常识知识的获取是构建知识图谱时的一大难点。常识的表征与定义、常识的获取与理解等问题一直都是人工智能发展的瓶颈问题。常识知识的基本特点是每个人都知道，所以很少出现在文本中。面向文本的信息抽取方法对于常识获取显得无能为力。典型的常识知识图谱包括`Cyc`、`ConceptNet`等。


    除了上述 4 类知识图谱之外，还有一些知识图谱侧重知识表示的不同维度。首先，很多事实的成立是有时空条件的，有些知识的存在是有时间限制的，必须为这些知识加上时间维度。例如，`（奥巴马，职业，美国总统，2009-01-20，2017-01-20）`这个五元组表示“奥巴马是美国总统”这一事实从
    2009 年 1 月 20 日开始生效，至 2017 年 1 月 20 日失效；又如，在表达某一天的温度时，`（2019-01-01，平均温度，16℃，上海）`和`（2019-01-01，平均温度，-5℃，北京）`这两个四元组分别表示了
    2019 年 1 月 1 日这一天上海与北京两地不同的温度。其次，一些知识含有主观性因素。例如，对于薯条是否为健康食品这一问题，不同人的认识是不同的。最后，有些知识关注实体的多模态表示。例如，`（柏拉图，图片，plato.jpg）`表示了柏拉图的适用图片。


    ### 7.1.4　知识图谱的重要性

    哲学家柏拉图把知识定义为“`Justified True Belief`”，即知识需要满足合理性（`Justified`）、真实性（`True`）、被相信（`Believed`）这
    3 个核心要素。简单而言，知识是人类通过观察、学习和思考有关客观世界的各种现象而获得和总结出的所有事实、概念、规则和原则（`Rules and Principles`）的集合。人类发明了各种手段来描述、表示和传承知识，如自然语言、绘画、音乐、数学语言、物理模型、化学公式等，可见对客观世界规律的知识化描述对于人类社会发展的重要性。具有获取、表示和处理知识的能力是人类心智区别于其他物种心智的重要特征，知识图谱已成为推动机器基于人类知识获取认知能力的重要途径，并将逐渐成为未来智能社会的重要生产资料。


    #### 1. 知识图谱是人工智能的重要基石

    知识图谱对于人工智能的重要价值在于，知识是人工智能的基石。机器可以模仿人类的视觉、听觉等感知能力，但这些感知能力并非人类的专属，动物也具备感知能力，甚至某些感知能力比人类更强，如狗的嗅觉。而“认知语言是人区别于其他动物的能力，同时，知识使人不断地进步，不断地凝练、传承知识，是推动人不断进步的重要基础”，知识对于人工智能的价值就在于让机器具备认知能力。


    有了知识的人工智能会变得更强大，可以做更多的事情。反过来，更强大的人工智能可以帮助人们更好地从客观世界中去挖掘、获取和沉淀知识，这些知识和人工智能系统形成正循环，两者共同进步。机器通过人工智能技术与用户的互动，从中获取数据、优化算法，更重要的是构建和完善知识图谱，认知和理解世界，进而服务于这个世界，让人类的生活更加美好。


    #### 2. 知识图谱推动智能应用

    知识图谱将知识智能地连接起来，能够对各类应用进行智能化升级，为用户带来更智能的应用体验。知识图谱是一个宏大的数据模型，可以构建庞大的知识网络，包含客观世界存在的大量实体、属性以及关系，为人们提供了一种快速便捷进行知识检索与推理的方式。近年来，蓬勃发展的人工智能本质上是一次知识革命，其核心在于通过数据观察与感知世界，实现分类预测、自动化等智能化服务。知识图谱作为人类知识描述的重要载体，推动着信息检索、问答系统等众多智能应用。


    #### 3. 知识图谱是强人工智能发展的核心驱动力之一

    尽管人工智能依靠机器学习和深度学习取得了快速进展，但是由于严重依赖人类的监督以及大量的标注数据，仍属于弱人工智能范畴，离强人工智能具有较大差距。强人工智能的实现需要机器掌握大量的常识性知识，将信息中的知识或者数据加以关联，同时以人类的思维模式和知识结构来进行语言理解、视觉场景解析和决策分析。知识图谱技术是由弱人工智能发展到强人工智能的必要条件，对于实现强人工智能有着重要的意义。


    ## 7.2　知识表示和知识建模

    知识表示与知识建模是知识图谱中的重要内容，在构建知识图谱的时候，首先要建立知识表达的数据模型，也就是知识图谱的整个数据组织体系。


    ### 7.2.1　知识表示

    知识表示学习主要是面向知识图谱中的实体和关系进行表示学习，使用建模方法将实体和向量表示在低维稠密向量空间中，并进行计算和推理。


    #### 1. 知识表示概述

    知识是人类在认识和改造客观世界的过程中总结出的客观事实、概念、定理和公理的集合。知识具有不同的分类方式，例如，按照知识的作用范围可分为常识性知识与领域性知识。知识表示是将现实世界中存在的知识转换成计算机可识别和处理的内容，是一种描述知识的数据结构，用于对知识进行描述或约定。知识表示在人工智能的构建中具有关键作用，通过适当的方式表示知识，形成尽可能全面的知识表达，可使机器通过学习这些知识，表现出类似于人类的行为。知识表示是知识工程中一个重要的研究课题，也是知识图谱研究中知识抽取、存储、融合、推理的基础。


    #### 2. 知识表示方法

    知识表示方法主要分为基于符号的知识表示方法与基于表示学习的知识表示方法。


    ##### （1）基于符号的知识表示方法

    基于符号的知识表示方法分为一阶谓词逻辑表示法、产生式规则表示法、框架表示法与语义网络表示法。


    一阶谓词逻辑表示法是基于谓词逻辑的知识表示方法，通过命题、逻辑连接词、个体、谓词与量词等要素组成的谓词公式，描述事物的对象、性质、状况和关系。一阶谓词逻辑表示法以数理逻辑为基础，表示结果较为精确，表达较为自然，形式上接近人类自然语言。但是其也存在表示能力较差，只能表达确定性知识，对于过程性和非确定性知识表达能力有限的问题。


    产生式规则表示法是 20 世纪 40 年代由逻辑学家埃米尔·波斯特（Emil Post）提出的。根据知识之间具有因果关联关系的逻辑，形成了“`IF-THEN`”的知识表示方法，是早期专家系统常用的知识表示方法之一。这种表示方法与人类的因果判断方式大致相同，直观、自然、便于推理。除此之外，产生式规则表示法的知识表达范畴较广、包括确定性知识、设置置信度的不确定性知识、启发式知识与过程性知识。但是产生式规则表示法由于具有统一的表示格式，当知识规模较大时，知识推理效率较低，容易出现组合爆炸问题。


    框架表示法是 20 世纪 70 年代初由人工智能专家马文·明斯基提出的一种用于表示知识的框架理论，来源于人们对客观世界中各种事物的认识都是以一种类似框架的架构存储在记忆中的思想。框架是一种通用数据结构，用于存储人们过去积累的信息和经验。在框架结构中，能够借助过去经验中的概念分析和解释新的信息情况。在表达知识时，框架能够表示事物的类别、个体、属性和关系等内容。框架结构一般由“框架名-槽名-侧面-值”4
    部分组成，即一个框架由若干个槽组成，其中，槽用于描述事物某一方面的属性；一个槽由若干个侧面组成，侧面用于描述相应属性的一个方面；每个侧面拥有若干值。框架具有继承性、结构化、自然性等优点，但复杂的框架构建成本较高，对知识库的质量要求较高，同时表达不够灵活，很难与其他的数据集相互关联使用。例如，通过框架表示法来表示“计算机主机”，它总共有
    6 个属性，也就是 6 个槽，包括“主机品牌”“生产厂商”等，框架表示法示意图如图 7-2 所示。


    语义网络表示法是以 1960 年由认知科学家艾伦·柯林斯（Allan Collins）提出的语义网络为基础的知识表示方法。语义网络是一种通过实体以及实体间语义关系表达知识的有向图，在图中，节点表示事物、属性、概念、状态、事件、情况、动作等含义，节点之间的弧表示它所连接的两个节点之间的语义关系。根据表示的知识情况需要定义弧上的标识，一般该标识是谓词逻辑中的谓词，常用的标识包括实例关系、分类关系、成员关系、属性关系、包含关系、时间关系、位置关系等。语义网络由语义基元构成，语义基元可通过三元组`（节点
    1，弧，节点 2）`来描述，语义网络由若干个语义基元及其之间的语义关联关系组成。语义网络表示法具有广泛的表示范围和强大的表示能力，表示形式简单直接、容易理解、符合自然规律。然而，语义网络存在节点与边的值没有标准、完全由用户自己定义、不便于知识共享及无法区分知识描述与知识实例等问题。例如，通过语义网络，可以把“重庆坐落于中国西南部”表示为三元组形式`（重庆，坐落于，中国西南部）`，三元组表示示意图如图
    7-3 所示。


