    # 第4章　深度学习


    **本章导读**


    深度学习是当前人工智能领域最热门的机器学习方法，目前，深度学习技术在人工智能领域占有绝对的统治地位。本章主要介绍深度学习的相关知识以及应用。


    **本章要点**


    1. 神经网络

    2. 感知机

    3. 卷积神经网络

    4. 循环神经网络

    5. 生成对抗网络


    许多研究表明，为了能够学习表示高阶抽象概念的复杂函数，解决目标识别、语音感知和语言理解等人工智能相关的任务，需要引入深度学习（Deep Learning）。深度学习的架构由多层非线性运算单元组成，每个较低层的输出作为更高层的输入，可以从大量输入数据中学习有效的特征表示，学习到的高阶表示中包含输入数据的许多结构信息，能够用于分类、回归、信息检索等数据分析和挖掘的特定问题。


    ## 4.1　神经网络


    神经网络（`Neural Network`，`NN`）亦称为人工神经网络（`Artificial Neural Network`，`ANN`），是由大量神经元（`Neurons`）广泛互连而成的网络，是对人脑的抽象、简化和模拟，应用了一些人脑的基本特性。神经网络与人脑的相似之处可概括为两方面，一是通过学习过程利用神经网络从外部环境中获取知识，二是内部神经元用来存储获取的知识信息。


    ### 4.1.1　神经网络简介


    神经网络是一种由大量的节点（或称神经元）相互连接构成的运算模型。通俗地讲，人工神经网络是模拟、研究生物神经网络的结果。详细地讲，人工神经网络是为获得某个特定问题的解，根据生物神经网络机理，按照控制工程的思路及数学描述方法，建立相应的数学模型并采用适当的算法，而有针对性地确定数学模型参数的技术。


    神经网络的信息处理是由神经元之间的相互作用实现的，知识与信息的存储主要表现为网络元件互相连接的分布式物理联系。人工神经网络具有很强的自学习能力，它可以不依赖于“专家”的头脑，自动从已有的实验数据中总结规律。由此，人工神经网络擅长处理复杂的多维的非线性问题，不仅可以解决定性问题，还可以解决定量问题，同时具有大规模并行处理和分布信息存储能力，具有良好的自适应性、自组织性、容错性和可靠性。


    ### 4.1.2　神经网络发展历史


    神经网络的研究从20世纪40年代初开始，至今已有近80年的历史，它的发展过程并不是一帆风顺的，大致经历了以下3个时期。


    1. 起步时期


    1943年，沃伦·麦卡洛克（Warren McCulloch）和沃尔特·皮茨（Walter Pitts）提出了逻辑神经元数学模型——`MP`模型，从而给出了神经元最基本的模型及相应的工作方式。1949年，神经生物学家唐纳德·赫布（Donald
    Hebb）发现，脑细胞之间的连通在参与某种活动时会被加强，提出了生理学与心理学间的联系，被称为赫布学习规则，该规则至今还被许多神经网络的学习算法所使用。1957年，弗兰克·罗森布拉特（Frank
    Rosenblatt）提出了感知机模型，这是一个由线性阈值神经元组成的前馈神经网络模型，可用于分类。1960年，伯纳德·威德罗（Bernard Widrow）和泰德·霍夫（Ted
    Hoff）提出了自适应线性单元，这是一种连续取值的神经网络，可用于自适应系统。


    2. 低潮时期


    1969年，人工智能的创始人马文·明斯基和西蒙·派珀特（Seymour Papert）的著作`Perceptrons`（《感知机》）出版，书中指出，单层感知只能作线性划分，多层感知还没有可用的算法，因此感知无实用价值。由于马文·明斯基和西蒙·派珀特在人工智能领域的地位，该书在神经网络研究人员间产生了极大的反响，神经网络的研究自此陷入低潮。


    但是，即使在神经网络研究的低潮时期，也有一些学者仍在不断努力研究，并取得了一些重要成果。其中，最著名的是1982年由加州理工学院教授约翰·霍普菲尔德（John
    Hopfield）提出的霍普菲尔德神经网络。在这个由运算放大器搭成的反馈神经网络中，约翰·霍普菲尔德利用李雅普诺夫函数的原理，给出了网络的稳定性判据，并为著名的组合优化问题——旅行商问题提供了一个新的解决方案。霍普菲尔德网络可用于联想存储、优化计算等领域。


    3. 复兴时期


    1985年，杰弗里·辛顿（Geoffrey Hinton）联合大卫·鲁姆哈特（David Rumelhart）等人提出了多层感知机的权值训练的算法——反向传播（`Back
    Propagation`，`BP`）算法，从而解决了多层感知机学习的问题，引导了神经网络的复兴，神经网络研究也进入了一个崭新的发展阶段。


