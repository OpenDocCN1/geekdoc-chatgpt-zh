- raw: 'Mask R-CNN在Faster R-CNN中增加了并行的Mask分支，该分支是一个小全连接卷积网络，对每个候选区域生成一个像素级别的二进制掩码，该掩码的作用是对目标区域空间布局进行二进制编码。Mask
    R-CNN扩展了Faster R-CNN，适用于像素级分割，而不仅限于边界框，可实现对物体的细粒度分割。在Fast R-CNN中，使用ROI池化产生特定大小的特征图。经过ROI池化层后，产生的特征图映射回原图的大小会产生错位，像素不能精准对齐。虽然在目标检测中给出的候选区域与原图有一些误差也不会对分类检测的结果产生很大影响，但是由于Mask是像素级别的分割任务，这种错位会对分割结果产生很大的影响。因此需采用ROI
    Align，即使用双线性插值来解决不能准确对齐像素点的问题。Mask R-CNN有很大的灵活性，可以进行目标检测、目标分割等任务，并且可以应用到人体姿态评估上，但其实时性还不够理想。


    6.YOLO


    YOLO不同于以R-CNN为代表的两步检测算法，YOLO的网络结构更为简单，且其速度是Faster R-CNN的10倍左右，可以满足目标检测对于实时性的要求。YOLO将待检测图像缩放到统一尺寸，并将图像分成相同大小的网格，如果一个目标的中心落在某网格单元中，那么这个网格就负责检测该目标的类别。YOLO存在的问题是，它把图像划分成7×7的网格进行分析，对小目标的检测率不高，而且每个网格最多只能检测一个类别的物体，当多个类别出现在一个网格中时，其检测效果不佳。


    7.YOLO v2


    YOLO v2对YOLO的网络结构进行了改进，其先加入了批量归一化，且在训练过程中采用了高分辨率图像，训练448像素×448像素的高分辨率分类网络，再利用该网络训练检测网络。因为YOLO利用单个网格完成边框的检测和位置回归，检测效果不佳，所以研究者借鉴了Faster
    R-CNN中的锚盒（尺寸由人工选择），但锚盒尺寸和个数通过聚类分析后才被确定。然而，研究者发现该模型在早期迭代时的收敛很不稳定，因此仍然采用YOLO检测相对于网格坐标位置偏移量的方法。因为检测数据集样本的数量少，所以研究者提出用WordTree把上下文中的公共对象（Common
    Objects in Context，COCO）和ImageNet数据集进行联合训练得到YOLO9000网络的方法，以完成超过9 000种物体类别的检测。YOLO9000使用ImageNet分类数据集学习从大量的类别中进行物体分类，在COCO检测数据集上学习检测图像中的物体位置。


    8.SSD


    YOLO对小目标检测的准确率不高，SSD是对YOLO进行改进的成果，它可以既保持检测准确率，又保证检测的速度。SSD仍然采用YOLO中划分网格的方法，与YOLO不同的是，SSD对不同卷积层的特征图像进行了滑动窗口扫描，每层特征图中锚盒的大小和个数都不同。前面的卷积层中锚盒尺寸相对较小，适合检测小目标；后面的卷积层中锚盒尺寸相对较大，适合检测大目标。因此，SSD在一定程度上提升了小目标物体的检测精度。


    ## [5.4　图像分割](../Text/contents.xhtml#z131)


    图像分割是图像分析的第一步，是计算机视觉的基础，是图像理解的重要组成部分，也是图像处理中最困难的问题之一。


    ### [5.4.1　图像分割简介](../Text/contents.xhtml#z132)


    图像分割指利用图像的灰度、颜色、纹理、形状等特征，把图像分成若干个互不重叠的区域，并使这些特征在同一区域内呈现相似性，在不同的区域之间存在明显的差异性。此后，可以将分割的图像中具有独特性质的区域提取出来用于不同的研究。简单地说，图像分割就是在一幅图像中，把目标从背景中分离出来。对于灰度图像来说，区域内部的像素一般具有灰度相似性，而在区域的边界上一般具有灰度不连续性。


    图像分割其实可以看作把图像分成若干个无重叠的子区域的过程，即假设R是整个要分割的图像区域，将此区域分成n个区域R[1]，R[2]，R[3]，…，R[n]的过程就是图像分割。其中，R[1]，R[2]，R[3]，…，R[n]这些子区域需满足图像中任意一部分都要分割到某个子区域中、任意两个子区域不会重叠、子区域中的任意两个像素点能连通、所有子区域中的像素点都符合一种特点、任意相邻子区域中没有相同之处这5个要求。图像分割示意图如图5-6所示。


    从20世纪70年代起，图像分割问题就吸引很多研究人员为之付出了巨大的努力。虽然到目前为止，还不存在一种通用的完美的图像分割的方法，但是对于图像分割的一般性规律基本上已经达成了共识，已经产生了相当多的研究成果和方法。


    ![](Images/cutq_106_53160_l.jpg)


    图5-6　图像分割示意图


    ### [5.4.2　图像分割算法](../Text/contents.xhtml#z133)


    目前，图像分割算法的数量已经达到上千种。随着对图像分割的更深层次研究和其他科学领域的发展，使用新理论的图像分割算法陆续出现，各种图像分割算法都有其不同理论基础，下面介绍4种常见的图像分割算法。


    1.基于阈值的图像分割算法


    这种算法具有易于操作、功能稳定、计算简单高效等优点。其基本原理是根据图像的整体或部分信息选择阈值，依据灰度级别划分图像。如何选取合适的阈值是其中最重要的问题。由于该算法直接利用灰度值，因此计算方面十分简单高效。当图像中的目标与背景灰度差异大时，应使用全局阈值分割法；当图像灰度差异不大或多个目标的灰度相近时，应使用局部或动态阈值分割法。这种算法虽然简单高效，但是有其局限性：一方面，当图像中的灰度值差异不明显或灰度范围重叠时，可能出现过分割或欠分割的情况；另一方面，其不关心图像的空间特征和纹理特征，只考虑图像的灰度信息，抗噪性能差，导致在边界处的效果不符合预期，得到的分割效果比较差。


    2.基于边缘检测的图像分割算法


    这种算法的基本原理是通过检测边界来把图像分割成不同的部分。在一张图像中，不同区域的边缘通常是灰度值剧烈变化的地方，这种算法就是根据灰度突变来进行图像分割的。其按照执行顺序的差异可分为两种，即串行边缘分割法和并行边缘分割法。其重点是如何权衡检测时的抗噪性能和精度。若提高检测精度，则噪声引起的伪边缘会导致过分割；然而，若提高抗噪性能，则会使得轮廓处的结果精度不高。因此，在实际应用的时候，需要综合考虑检测精度与抗噪性能的相互作用并进行取舍，这是基于边缘检测的图像分割算法的关键部分。其优点是运算快，边缘定位准确；其缺点是抗噪性能差，因而在划分复杂图像时非常容易导致边缘不连续、边缘丢失或边缘模糊等问题，边缘的封闭性和连续性难以保证。


    3.基于区域的图像分割算法


    这种算法的基本原理是连通含有相似特点的像素点，最终组合成分割结果。其主要利用图像局部空间信息，能够很好地避免其他算法图像分割空间小的缺陷。其包括区域生长法以及区域分离与合并法。区域生长法会依据某种相似性标准，不停地把符合此标准的相邻像素点加入同一区域，最终得到目标区域。在分割过程中，种子点位置的选择非常重要，会直接影响分割结果的优劣。而区域分离与合并法会先将图像分割成很多一致性较强（如区域内像素灰度值相同）的小区域，再按一定的规则将小区域融合成大区域，达到分割图像的目的。


    4.基于神经网络的图像分割算法


    这种算法的基本原理是以样本图像数据来训练多层感知机，得到决策函数，进而用获得的决策函数对图像像素进行分类，得到分割的结果。根据具体方法所处理的数据类别的不同，可以分为基于图像像素数据的神经网络分割法和基于图像特征数据的神经网络分割法。因为前者使用高维度的原始图像作为训练数据，而后者利用图像特征信息，所以前者拥有更多能够使用的图像信息。前者需要对每个像素进行单独处理，由于数据量大且数据维度高，使得计算速度难以提高，用于处理实时数据时效果并不理想。总而言之，神经网络是由许多模拟生物神经的处理单元相互连接而成的结构，因为它有巨大的互连结构和分布式的处理单元，所以系统拥有很好的并行性和鲁棒性，且系统较为复杂，运算速度较慢。


    ## [5.5　小结](../Text/contents.xhtml#z134)


    （1）计算机视觉是从图像或视频中提出符号或数值信息，分析计算该信息以进行目标的识别、检测和跟踪等。


    （2）图像分类是根据不同类别的目标在图像信息中所反映的不同特征，将它们区分开来的图像处理方法。


    （3）目标检测的任务是在图像中找出所有感兴趣的目标（物体），并确定它们的位置和大小。


    （4）图像分割是利用图像的灰度、颜色、纹理、形状等特征，把图像分成若干个互不重叠的区域，并使这些特征在同一区域内呈现相似性，在不同的区域之间存在明显的差异性。


    ## [5.6　习题](../Text/contents.xhtml#z135)


    （1）简述计算机视觉面临的挑战。


    （2）简述图像分类的常用算法。


    （3）简述目标检测的常用框架模型。


    （4）简述图像分割的常用算法。


    # [第6章　自然语言处理](../Text/contents.xhtml#a6)


    【本章导读】


    语言是人类智慧的结晶，自然语言处理是指利用计算机对自然语言的形、音、义等信息进行处理，它是计算机科学领域和人工智能领域的一个重要的研究方向。本章主要介绍自然语言处理的基本方式和应用领域。


    【本章要点】


    1 自然语言处理的定义和原理


    2 自然语言处理的组成


    3 自然语言理解


    4 自然语言生成


    5 词法分析


    6 句法分析


    7 语义分析


    8 信息检索


    9 机器翻译


    10 情感分析


    11 语音识别


    ## [6.1　自然语言处理简介](../Text/contents.xhtml#z136)


    语言是人类智慧的结晶，它经历了漫长而缓慢的发展过程，是人类交际、思维和传递信息的重要工具。在人类进入信息化社会的今天，计算机自动处理的语言文字信息水平已成为衡量一个国家是否步入信息社会的重要标准之一。从20世纪80年代开始至今，中文语言处理技术在字处理、词处理等领域均取得了重大进展，不仅使中文这一世界最古老的语言之一顺利地搭上了信息时代的火车，还使中文在文字识别、语音识别、机器翻译等语言处理技术方面与其他语言相比毫不逊色，在排版印刷等应用方面也达到了世界领先水平。本节将对自然语言处理（Natural
    Language Processing，NLP）进行简要介绍。


    ### [6.1.1　自然语言处理的定义](../Text/contents.xhtml#z137)


    自然语言是指人们日常使用的语言，它是随着人类社会不断发展演变而来的，是人类沟通、交流的重要工具，也是人类区别于其他动物的根本标志，没有语言，人类的思维无从谈起。在整个人类历史中，以语言文字形式记载和流传的知识占到知识总量的80%以上。据统计，就计算机应用于信息处理而言，用于数学计算的信息处理仅占10%，用于过程控制的信息处理不到5%，其余85%都用于语言文字的信息处理。


    自然语言处理是指利用计算机对自然语言的形、音、义等信息进行处理，即对字、词、句、篇章的输入、输出、识别、分析、理解、生成等的操作和加工。它是计算机科学领域和人工智能领域的一个重要的研究方向，研究用计算机来处理、理解以及运用人类语言，可以实现人与计算机的有效交流。


    实现人机间的信息交流，是人工智能界、计算机科学界和语言学界所共同关注的重要问题。在一般情况下，用户可能不熟悉机器语言，所以自然语言处理技术可以帮助用户根据自身需要使用自然语言和机器进行交流。从建模的角度看，为方便计算机处理，自然语言可以被定义为一组规则或符号的集合，通过组合集合中的符号就可以传递各种信息。自然语言处理是研究语言能力和语言应用的模型，通过建立计算机的算法框架来实现某个语言模型，并完善、评测，最终用于设计各种实用的自然语言应用系统。


    自然语言处理的具体表现形式包括机器翻译、文本摘要、文本分类、文本校对、信息抽取、语音合成、语音识别等。可以说，自然语言处理的目的是让计算机理解自然语言。发展至今，自然语言处理研究已经取得了长足的进步，逐渐发展成为一门独立的学科。


    ### [6.1.2　自然语言处理的发展历程](../Text/contents.xhtml#z138)


    自然语言处理的发展大致经历了4个阶段。


    1.1956年以前的萌芽期


    计算机的诞生为机器翻译和随后的自然语言处理提供了基础。由于来自社会的机器翻译的需求，这一时期进行了许多自然语言处理的基础研究。1948年，克劳德·香农（Claude
    Shannon）把离散马尔可夫过程的概率模型应用于描述语言的自动机，并把热力学中“熵”的概念引用到语言处理的概率算法中。1956年，艾弗拉姆·乔姆斯基（Avram
    Chomsky）提出了上下文无关语法，并把它运用到自然语言处理中。他们的工作直接开创了基于规则和基于概率这两种不同的自然语言处理技术。1952年，贝尔实验室开始了语音识别系统的研究。1956年，人工智能的诞生为自然语言处理翻开了新的篇章。


    2.1957～1970年的快速发展期


    由于基于规则和基于概率这两种不同方法的存在，自然语言处理的研究在这一时期分为了两大阵营。一个是基于规则方法的符号派，另一个是采用概率方法的随机派。从20世纪50年代中期开始到20世纪60年代中期，以艾弗拉姆·乔姆斯基为代表的符号派学者开始了形式语言理论和生成句法的研究，20世纪60年代末又进行了形式逻辑系统的研究。而随机派学者采用基于贝叶斯方法的统计学研究方法。在这一时期，基于规则方法的研究势头明显强于基于概率方法的研究势头。这一时期的重要研究成果包括1959年宾夕法尼亚大学研制成功的转换与话语分析系统，布朗美国英语语料库的建立等。1967年，美国心理学家马尔里克·尼瑟（Ulrich
    Neisser）提出认知心理学的概念，直接将自然语言处理与人类的认知联系起来。


    3.1971～1993年的低谷发展期


    随着研究的深入，很多基于自然语言处理的应用并不能在短时间内得到实现，而新问题又不断地涌现，社会对自然语言处理的研究丧失了信心。从20世纪70年代开始，自然语言处理的研究进入了低谷时期。而同样在20世纪70年代，基于隐马尔可夫模型的统计方法在语音识别领域获得成功；到20世纪80年代初，话语分析也取得了重大进展。


    4.1994年至今的复苏融合期


    20世纪90年代中期以后，计算机的运算速度和存储量大幅提升，使得语音和语言处理的商品化开发成为可能；1994年，互联网商业化和网络技术的发展使得基于自然语言的信息检索和信息抽取的需求变得更加突出。这两件事从根本上促进了自然语言处理研究的复苏与发展，自然语言处理的应用面渐渐不再局限于机器翻译、语音控制等早期研究领域。


    从20世纪90年代末到21世纪初，人们逐渐认识到仅用基于规则的方法或仅用基于统计的方法，都是无法成功进行自然语言处理的。基于统计、基于实例和基于规则的语料库技术在这一时期开始蓬勃发展，各种处理技术开始融合，自然语言处理的研究又开始兴旺起来。


    ### [6.1.3　自然语言处理的研究方向](../Text/contents.xhtml#z139)


    自然语言处理可以应用于很多领域，下面讲解几种常见的应用。


    （1）文字识别


    文字识别借助计算机系统自动识别印刷体或者手写体文字，将其转换为可供计算机处理的电子文本。对于普通的文字识别系统，主要研究字符的图像识别；而对于高性能的文字识别系统，往往需要同时研究语言理解技术。


    （2）语音识别


    语音识别又称自动语音识别，目标是将人类语音中的词汇内容转换为计算机可读的输入。语音识别技术的应用包括语音拨号、语音导航、室内设备控制、语音文档检索、简单的听写数据录入等。


    （3）机器翻译


    机器翻译研究借助计算机程序把文字或演讲从一种自然语言自动翻译成另一种自然语言，即把一种自然语言的输入转换为另一种自然语言的输出，使用语料库技术可实现更加复杂的自动翻译。


    （4）自动文摘


    自动文摘是应用计算机对指定的文章做摘要的过程，即把原文档的主要内容和含义自动归纳、提炼并形成摘要或缩写。常用的自动文摘是机械文摘，根据文章的外在特征提取能够表达其中心思想的部分原文句子，并把它们组成连贯的摘要。


    （5）句法分析


    句法分析又称自然语言文法分析，它是运用自然语言的句法和其他相关知识来确定输入句各成分的功能，以建立一种数据结构并用于获取输入语句意义的技术。


    （6）文本分类


    文本分类又称文档分类，是在给定的分类系统和分类标准下，根据文本内容利用计算机自动判别文本类别，并实现文本自动归类的过程，它包括学习和分类两个过程。


    （7）信息检索


    信息检索又称情报检索，是利用计算机从海量文档中查找用户需要的相关文档的查询方法和查询过程。


    （8）信息获取


    信息获取主要是指利用计算机从大量的结构化或半结构化的文本中自动抽取特定的一类信息，并使其形成结构化数据，填入数据库供用户查询使用的过程，目标是允许计算非结构化的资料。


    （9）信息过滤


    信息过滤是指应用计算机自动识别和过滤满足特定条件的文档信息。其一般指根据某些特定要求，自动识别、过滤和删除互联网中某些特定信息的过程，主要用于信息安全和防护等。


    （10）自然语言生成


    自然语言生成是指将句法或语义信息的内部表示转换为自然语言字符组成的字符串的过程，是一种从深层结构到表层结构的转换技术，是自然语言理解的逆过程。


    （11）中文自动分词


    中文自动分词是指使用计算机自动对中文文本进行词语的切分，中文自动分词是中文自然语言处理中一个最基本的环节。


    （12）语音合成


    语音合成又称文语转换，是将书面文本自动转换成对应的语音表征的过程。


    （13）问答系统


    问答系统是指借助计算机系统对人提出问题的理解，通过自动推理等方法，在相关知识库中自动求解答案，并对问题做出相应的回答。回答技术与语音技术、多模态输入输出技术、人机交互技术相结合，构成问答系统。


    此外，自然语言处理的研究方向还有语言教学、词性标注、自动校对，以及讲话者识别、验证等。


    ### [6.1.4　自然语言处理的一般工作原理](../Text/contents.xhtml#z140)


    计算机处理自然语言的整个过程一般可以概括为4部分：语料预处理、特征工程、模型训练和指标评价。


    1.语料预处理


    语料预处理即对输入的数据进行预处理，主要包括以下4个步骤。


    （1）语料清洗，即保留有用的数据，删除噪声数据，常见的清洗方式有人工去重、对齐、删除、标注等。


    （2）分词，即将文本分成词语，如通过基于规则的、基于统计的分词方法进行分词。


    （3）词性标注，即给词语标上词类标签，如名词、动词、形容词等。常用的词性标注方法有基于规则的、基于统计的算法，如最大熵词性标注、HMM词性标注等。


    （4）去停用词，即去掉对文本特征没有任何贡献作用的字词，如标点符号、语气词、助词等。


    2.特征工程


    这一步的主要工作是将分词表示成计算机可识别的计算类型，一般为向量，常用的表示模型有词袋模型、词向量等。


    3.模型训练'
