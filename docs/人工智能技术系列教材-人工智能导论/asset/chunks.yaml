    相较于Sigmoid函数和tanh函数，ReLU函数对于随机梯度下降法的收敛有着巨大的加速作用，同时ReLU函数的计算仅需要一个阈值判断，不像Sigmoid激活函数与tanh激活函数一样需要指数运算，相比于这两个激活函数，使用ReLU激活函数为整个神经网络学习训练过程节省了很多计算量。ReLU函数会使一部分神经元的输出为0，为神经网络提供了稀疏表达能力，并减少了参数的相互依存关系，缓解了过拟合问题的发生。ReLU函数还有一个巨大优势，它能够有效地缓解梯度消失，即解决梯度容易为0的问题。


