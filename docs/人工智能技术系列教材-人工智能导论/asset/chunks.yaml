    （2）简述智慧电商的概念。

    （3）简述智能医学的概念。

    （4）简述智能制造的概念。


    # [第9章　智能机器人](../Text/contents.xhtml#a9)

    【本章导读】

    当前，人工智能与机器人的研究与应用越来越受人们欢迎，人类生活的方方面面都有人工智能机器人的身影。本章主要介绍机器人的实现原理以及智能机器人的应用。

    【本章要点】

    1 机器人的实现原理

    2 机器人的应用

    3 智能机器人的前景

    4 智能机器人的核心技术

    5 智能机器人的应用


    ## [9.1　智能机器人概述](../Text/contents.xhtml#z224)

    信息技术的发展为智能机器人技术的发展奠定了坚实基础，全球机器人产业正在迈入智能化的新时代。当前，以图像识别、语音识别、自然语言理解等为代表的人工智能技术在实用化上的突破，带动了机器人感知、交互、决策能力的显著提升。目前的人脸识别准确率已经高达99.55%，超过准确率为97.35%的人眼识别率，语音输入辨识成功率也达到97%以上，机器人已经具备了“看得见、听得懂”的技术条件，同时，随着深度学习、无监督学习的逐步应用，机器人具备了更为关键的“思考”能力，机器人开始真正迈入智能化的新时代。


    ### [9.1.1　机器人简介](../Text/contents.xhtml#z225)

    机器人的组成与人类极为类似，一个典型的机器人有一套可移动的身体结构、一部类似于电动机的装置、一套传感系统、一个电源和一个用来控制这些要素的计算机“大脑”。从本质上讲，机器人是由人类制造的“动物”，它是模仿人类和动物行为的机器。

    1.机器人的物理结构

    机器人的定义范围很广，大到为工厂服务的工业机器人，小到居家打扫的机器人。机器人是一种自动化的机器，它具备一些与人或其他生物相似的能力，如感知能力、规划能力、动作能力和协同能力，是一种具有高度灵活性的自动化机器。

    从物理结构上看，首先，几乎所有机器人都有一个可以移动的身体。有些拥有的只是机动化的轮子，而有些则拥有大量可移动的部件，这些部件一般是由金属或塑料制成的。与人体用关节连接骨骼类似，机器人的轮与轴是用某种传动装置连接起来的。有些机器人使用电动机和螺线管作为传动装置，有一些则使用液压系统，还有一些使用气动系统。

