    图 1-1　弱人工智能机器人


    ## 1.2　人工智能的起源与发展


    人工智能作为一门学科，经历了兴起、形成和发展等多个阶段，本节将简单地介绍人工智能的起源和发展过程。


    ### 1.2.1　人工智能的历史


    人工智能的发展经历了 4 个阶段。


    1.人工智能的兴起


    1950 年，一位名叫马文·明斯基（Marvin Minsky，后被称为“人工智能之父”）的学生与他的同学邓恩·埃德蒙（Dean Edmunds）一起，建造了世界上第一台神经网络计算机，被看作人工智能的一个起点。同样是在
    1950 年，被称为“计算机之父”的艾伦·图灵（Alan Turing）提出了一个举世瞩目的思想实验——图灵测试，按照图灵的设想，如果一台机器能够与人类开展对话而不能被辨别出机器身份，那么这台机器就具有智能。同样是这一年，艾伦·图灵还大胆预言了真正具备智能的机器的可行性。


    1956 年，在由达特茅斯学院举办的一次会议上，计算机专家约翰·麦卡锡（John McCarthy）提出了“人工智能”一词。后来，这被人们看作人工智能正式诞生的标志。就在这次会议后不久，约翰·麦卡锡从达特茅斯学院搬到了麻省理工学院。同年，马文·明斯基也搬到了这里，之后两人共同创建了世界上第一座人工智能实验室——MIT
    AI 实验室。值得注意的是，达特茅斯会议正式确立了人工智能这一术语，并且开始从学术角度对人工智能展开了严肃而专业的研究。在此之后不久，最早的一批人工智能学者和技术开始涌现。


    1964 年，首台聊天机器人诞生。MIT AI 实验室的约瑟夫·魏岑鲍姆（Joseph Weizenbaum）教授开发了 ELIZA 聊天机器人，实现了计算机与人通过文本的交流。这是人工智能研究的一个重要方向。


    1968 年，首台人工智能机器人诞生。国际斯坦福研究所（SRI）研发的机器人 Shakey 能够自主感知、分析环境、规划行动并执行任务，这种机器人拥有类似人的感觉，如触觉、听觉等。


    2.人工智能的低谷


    20 世纪 70 年代，人工智能进入了一段痛苦而艰难的岁月。由于科研人员在人工智能的研究中对项目难度预估不足，不仅导致与美国国防高级研究计划署的合作计划失败，还让人工智能的前景蒙上了一层阴影。与此同时，社会舆论的压力也开始慢慢压向人工智能研究，导致很多研究经费被转移到了其他项目上。


    当时，人工智能面临的技术瓶颈主要在 3 个方面：第一，计算机性能不足，导致早期很多程序无法在人工智能领域得到应用；第二，问题的复杂性，早期人工智能程序主要用于解决特定的问题，因为特定的问题对象少、复杂性低，可一旦问题复杂度上升，程序就立刻不堪重负；第三，数据量严重不足，当时不可能找到足够大的数据库来支撑程序进行深度学习，这很容易导致机器无法读取足够量的数据进行智能化。


    因此，人工智能项目停滞不前，而 1973 年，英国数学家詹姆斯·赖特希尔（James Lighthill）编写了针对英国人工智能研究状况的报告，批评了人工智能在实现“宏伟目标”上的失败。由此，人工智能遭遇了长达多年的科研深渊。


    3.人工智能的崛起与第二次低谷


    1980 年，卡内基梅隆大学为数字设备公司设计了一套名为 XCON 的“专家系统”。专家系统是一种采用人工智能程序的系统，可以简单地理解为“知识库+推理机”的组合。同时，XCON
    是一套具有完整专业知识和经验的计算机智能系统，这套系统在 1986 年之前每年为公司节省了超过 4 000 美元的经费。这种商业模式诞生后，衍生出了 Symbolics、Lisp
    Machines 和 IntelliCorp、Aion 等一系列硬件、软件公司。


    不过，在仅仅 7 年之后，这个曾经轰动一时的人工智能系统就宣告退出历史舞台。到 1987 年时，苹果和 IBM 公司生产的台式机性能都超过了 Symbolics
    等厂商生产的通用计算机。从此，专家系统风光不再。


    4.人工智能的再次崛起


    从 20 世纪 90 年代中期开始，由于网络技术特别是互联网的发展，人工智能开始由单个智能主体研究转向基于网络环境下的分布式人工智能研究。其不但研究基于同一目标的分布式问题求解，而且研究多个智能主体的多目标问题求解，从而使得人工智能面向实用。此外，随着人工智能技术尤其是神经网络技术的逐步发展，以及人们对人工智能开始抱有客观、理性的认知，人工智能技术开始进入平稳发展时期。


    1995 年，发明家理查德·华莱士（Richard Wallace）开发了聊天机器人——人工语言互联网计算机实体（Artificial Linguistic
    Internet Computer Entity，ALICE），在其中加入了自然语言，并抽取了数千个数据点，最终创造出类似人工智能的系统。


    1997 年 5 月 11 日，IBM 开发的计算机系统“深蓝”战胜了国际象棋世界冠军，在公众领域引发了现象级的 AI 话题讨论。这是人工智能发展的一个重要里程碑。


    2000 年，本田公司制造了“阿西莫”机器人，它可以表现出与人类相似的某些特性，并拥有基本的智能水平。它是最早的具备双足行走能力的类人型机器人。


    2006 年，杰弗里·辛顿（Geoffrey Hinton）在《科学》杂志发表论文，标志着神经网络的深度学习领域取得突破，人类又一次看到机器赶超人类的希望，这也是标志性的技术进步。


    2011 年，由 IBM 开发的人工智能程序“沃森”（Watson）参加了一档智力问答节目并战胜了两位人类冠军。沃森存储了 2 亿页数据，能够将与问题相关的关键词从看似相关的答案中抽取出来。这一人工智能程序已被
    IBM 广泛应用于医疗诊断领域。


    2016 年和 2017 年，AlphaGo 多次战胜围棋冠军。AlphaGo 是由 Google DeepMind 开发的人工智能围棋程序，具有自我学习能力。它能够搜集大量围棋对弈数据和名人棋谱，学习并模仿人类下棋。图
    1-2 所示为 AlphaGo 标识。


    ![](img/image_17_0_m.jpg)


    图 1-2　AlphaGo 标识


    2017 年，深度学习成为热门研究方向。AlphaGo Zero（第四代 AlphaGo）在无任何数据输入的情况下，自学围棋 3 天后便以 100:0 横扫了第二代
    AlphaGo Lee，学习 40 天后又战胜了在人类高手看来不可企及的第三代 AlphaGo Master。


    尽管人工智能研究与应用取得了不少成果，但是离全面推广应用还有很大的距离，还有许多问题有待解决，且需要与多学科的研究专家共同合作。未来人工智能的研究方向主要有人工智能理论、机器学习模型和理论、不精确知识表示及其推理、常识知识及其推理、人工思维模型、智能人机接口、多智能主体系统、知识发现与知识获取、人工智能应用基础等。


    ### 1.2.2　我国的人工智能发展现状


    我国人工智能技术攻关和产业应用虽然起步较晚，但是在国家多项政策和科研基金的支持与鼓励下，近年来发展势头迅猛。在我国政府的高度重视下，人工智能已上升为国家战略。《新一代人工智能发展规划》提出“到
    2030 年，使中国成为世界主要人工智能创新中心”。目前，我国在基础研究方面已经拥有人工智能研发队伍和国家重点实验室等设施齐全的研发机构，并先后设立了各种与人工智能相关的研究课题，研发产出的数量和质量也有了很大提升，已取得许多突出成果。


    伴随着人工智能研究热潮，我国人工智能产业化应用也蓬勃发展。智能产品和应用大量涌现，人工智能产品在医疗、商业、通信、城市管理等方面得到了快速应用。


    2017 年 7 月 5 日，百度首次发布人工智能开放平台的整体战略、技术和解决方案。这也是百度 AI 技术首次整体亮相。其中，对话式人工智能系统可让用户以自然语言对话的交互方式实现诸多功能；Apollo
    自动驾驶技术平台可帮助汽车行业及自动驾驶领域的合作伙伴快速搭建一套属于自己的完整的自动驾驶系统，是全球领先的自动驾驶生态。


    2017 年 8 月 3 日，腾讯公司正式发布了人工智能医学影像产品——腾讯觅影。同时，其宣布成立人工智能医学影像联合实验室。


    2017 年 10 月 11 日，阿里巴巴首席技术官张建锋宣布成立全球研究院——达摩院。达摩院的成立，代表着阿里巴巴正式迈入全球人工智能等前沿科技的研发行列。


    此外，科大讯飞在智能语音技术上处于国际领先水平；依图科技搭建了全球首个十亿级人像对比系统，在 2017 年美国国家标准与技术研究院组织的人脸识别技术测试中，成为第一个获得冠军的中国团队。


    尽管我国多项技术处于世界领先地位，创新创业也日益活跃，但是整体水平与发达国家仍有较大差距。从细分的研究领域来看，最受国际人工智能人才青睐的领域为机器学习、数据挖掘和模式识别，中国人工智能人才则倾向投入遗传算法、神经网络和故障诊断方面，从技术领域来看，中国人工智能企业的应用技术更集中于视觉和语音，基础硬件占比偏小，而在核心算法及关键设备、高精尖零部件、技术工业、工业设计、大型智能系统、大规模应用系统以及基础平台等方面，我国与发达国家的差距还较为明显。


    值得关注的是，目前我国已经具备人工智能产业发展的基础条件，未来十年内都将是人工智能技术加速普及的爆发期。人工智能专用芯片有望成为下一个爆发点，智能语音产业链已经逐渐成形，产业规模大幅提升。此外，人工智能具有显著的溢出效应，将带动其他相关技术的持续进步，助推传统产业转型升级和战略性新兴产业整体性突破。


    ## 1.3　人工智能的研究内容


    人工智能学科有着十分广泛和极其丰富的研究内容。不同的人工智能研究者从不同的角度对人工智能的研究内容进行了分类。例如，基于脑功能模拟、基于不同认知观、基于应用领域和应用系统、基于系统结构和支撑环境等。下面综合介绍一些得到诸多学者认同并具有普遍意义的人工智能研究的基本内容。


    ### 1.3.1　认知建模


    人类的认知过程是非常复杂的，作为研究人类感知和思维信息处理过程的一门学科，认知科学（或称思维科学）要研究人类在认知过程中是如何进行信息加工的。认知科学是人工智能的重要理论基础，涉及非常广泛的研究课题，除了美国心理学家浩斯顿（Houston）提出的知觉、记忆、思考、学习、语言、想象、创造、注意和问题求解等关联活动外，还会受到环境、社会和文化背景等方面的影响。人工智能不仅要研究逻辑思维，还要深入研究形象思维和灵感思维，使人工智能具有更坚实的理论基础，为智能系统的开发提供新思想和新途径。


    ### 1.3.2　知识表示


    知识表示、推理和知识应用是传统人工智能的三大核心研究内容。其中，知识表示是基础，推理实现问题求解，而知识应用是目的。知识表示是人工智能的一个重要研究课题，应用人工智能技术解决实际问题，就涉及各类知识的表示方法，它需要把人类知识概念化、形式化或模型化，常见的就是运用符号知识、算法和状态图等来描述待解决的问题。从逻辑上看，知识表示是一组描述事物的约定，可以看作将人类知识表示成机器能处理的数据结构。在人工智能应用中，知识表示是数据结构和控制结构及解释过程的结合，涉及计算机程序中存储信息的数据结构设计，并对这些数据结构进行智能推理演变的过程。目前，在人工智能中常见的
    6 种知识表示有状态空间表示、问题归约表示、谓词逻辑表示、语义网络表示、框架表示以及过程表示。


    ### 1.3.3　知识应用


    人工智能能否获得广泛应用是衡量和检验其生命力的重要标志。20 世纪 70 年代，正是专家系统的广泛应用使人工智能走出低谷，获得快速发展。后来的机器学习和近年来的自然语言理解应用研究取得重大进展，又促进了人工智能的进一步发展。当然，应用领域的发展离不开知识表示和推理等基础理论以及基本技术的进步。


    ### 1.3.4　推理


