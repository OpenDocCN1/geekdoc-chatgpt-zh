- raw: '条件生成对抗网络（Conditional GAN，CGAN）在原始GAN的基础上增加了约束条件，控制了GAN过于自由的问题，使网络朝着既定的方向生成样本。原始GAN对于生成网络几乎没有任何约束，使得生成过程过于自由，导致在图片较大的情形中，模型变得难以控制。CGAN的生成网络和判别网络的输入多了一个约束项y，约束项y可以是一个图像的类别标签，也可以是图像的部分属性数据。CGAN的缺点在于其模型训练不稳定，从损失函数可以看到，CGAN只是为了生成指定的图像而增加了额外约束，并没有解决训练不稳定的问题。


    2.深度卷积生成对抗网络


    深度卷积生成对抗网络（Deep Convolutional GAN，DCGAN）的提出对GAN的发展有着极大的推动作用，它将CNN和GAN结合起来，使得生成的图片质量和多样性得到了保证。DCGAN使用了一系列的训练技巧，如使用批量归一化（Batch
    Normalization，BN）稳定训练，使用ReLU激活函数降低梯度消失风险，同时取消了池化层，使用步幅卷积和微步幅卷积有效地保留了特征信息。DCGAN虽然能生成多样性丰富的样本，但是生成的图像质量并不高，且没有解决训练不稳定的问题，在训练的时候仍需要小心地平衡G和D的训练进程。


    3.循环一致性生成对抗网络


    循环一致性生成对抗网络（Cycle-consistent Generative Adversarial Networks，CycleGAN），CycleGAN可以让两个域的图像互相转换且不需要成对的图像作为训练数据。传统的两个不同域中的图像要实现相互转换，一般需要两个域中具有相同内容的成对图像作为训练数据，如pix2pix，但是这种成对的训练数据往往很难获得。CycleGAN是一个互相生成的网络，其网络是一个环形结构，其原理是x表示X域的图像，y表示Y域的图像，G和F是两个转换器，D[X]和D[Y]是两个判别器，X域的图像x经转换器G转换成Y域的图片G(x)，并由判别器D[Y]判别它是否为真实图片；同理，Y域的图像y经转换器F转换成X域的图片F(x)，再由判别器D[X]判别它是否为真实图片。为了避免转换器将域内的所有图像都转换成另一个域内的同一图像，CycleGAN使用循环一致性损失做约束。CycleGAN的缺点是其循环机制能保证成像不会偏离太远，但是循环转换中会造成一定的信息丢失，使得生成图像质量不高。


    ## [4.6　深度学习的应用](../Text/contents.xhtml#z115)


    深度学习技术目前在人工智能领域占有绝对的统治地位，因为相比于传统的机器学习算法而言，深度学习在某些领域展现出了最接近人类所期望的智能效果，同时在悄悄地走进人们的生活，如刷脸支付、语音识别、智能翻译、自动驾驶、棋类人机大战等。


    ### [4.6.1　AlphaGo Zero](../Text/contents.xhtml#z116)


    2018年12月，不仅会下围棋，还自学成才横扫国际象棋和日本将棋的AlphaGo Zero，登上了世界顶级学术期刊《科学》杂志的封面。


    1.AlphaGo Zero简介


    AlphaGo Zero是谷歌旗下DeepMind公司的新版程序。2016年3月，AlphaGo Master击败了最强的人类围棋选手之一——李世石，且AlphaGo
    Master在训练过程中使用了大量人类棋手的棋谱。2017年10月19日，DeepMind公司在《自然》杂志发布了一篇新的论文，AlphaGo Zero——它完全不依赖人类棋手的经验，经过3天的训练，AlphaGo
    Zero就击败了AlphaGo Master。AlphaGo Zero最重要的突破在于，它不仅可以解决围棋问题，还可以在不需要知识预设的情况下，解决一切棋类问题。经过几个小时的训练，它又击败了最强国际象棋冠军程序Stockfish。图4-13所示为AlphaGo
    Zero击败AlphaGo Master的棋谱。


    ![](Images/cutq_91_24473_l.jpg)


    图4-13　AlphaGo Zero击败AlphaGo Master的棋谱


    DeepMind利用了深度学习技术，结合了更多经典的强化学习方法来实现最新的突破。AlphaGo Zero是DeepMind的自动操作系统的最新化身。AlphaGo
    Zero做了以下几点突破。


    （1）击败之前版本的AlphaGo（最终比分为100:0）。


    （2）学习从头开始执行这项任务，而不需要学习以前的人类知识（如记录的人类棋谱）。


    （3）只需3天的训练时间，就能达到世界冠军水平。


    （4）使用了较少的神经网络。


    （5）使用了较少的训练数据。


    2.AlphaGo Zero的学习过程


    AlphaGo Zero与DeepMind的前几代版本的最大不同是，它能从空白状态学起，在无任何人类输入的条件下，它能够迅速自学围棋。也就是说，AlphaGo
    Zero是真的自己学会了围棋规则，系统学会了渐渐从输、赢以及平局中调整参数，让自己更懂得选择那些有利于赢得比赛的走法，而不再去分析对手的特征。其中关键的一点在于AlphaGo
    Zero在设计过程中做了一个全新的定位：重在学习，而不是急于求胜。


    首先，DeepMind采用了5 000个TPU（可以简单地理解为计算机的CPU），结合深度神经网络、通用强化学习算法和通用树搜索算法，打造了一个全能棋手。


    其次，AlphaGo Zero的学习能力是一个动态成长的过程，每次学习一种新的棋类或者游戏都会根据难易程度来展开一段自我博弈，产生的超参数通过贝叶斯优化进行调整。


    与此同时，AlphaGo Zero的“自学”过程还有一项特别重要的任务——对自身进行神经网络训练。利用训练好的神经网络，可以精准地指引一个搜索算法，即蒙特卡洛树搜索（Monte
    Carlo Tree Search，MCTS），为每一步棋选出最有利的落子位置。因此，每下一步之前，AlphaGo Zero的搜索对象不是所有可能性，而只是最适合当下“战况”的一小部分可能性，这就大大提升了搜索的精确性和效率性。从实质上看，AlphaGo
    Zero算法本质上是一个最优化搜索算法，对于所有开放信息的、离散的最优化问题，只要人们可以写出完美的模拟器，就可以应用AlphaGo Zero算法。所谓开放信息，就像围棋、象棋；所谓离散问题，则意味着变量是可以有限枚举的，如围棋的361个点是可以枚举的，而股票、无人驾驶等不属于这类问题。


    ### [4.6.2　自动驾驶](../Text/contents.xhtml#z117)


    在过去的十年中，自动驾驶汽车技术取得了越来越快的进步，主要得益于深度学习和人工智能领域的进步。


    1.自动驾驶概述


    深度学习技术在自动驾驶领域取得了巨大成功，其优点是精准性高、鲁棒性强、成本低。无人驾驶车辆商业化成为焦点和趋势。汽车企业、互联网企业都争相进入无人驾驶领域，如百度、Uber等。例如，百度也在2020年开始了无人驾驶汽车的上路测试。其他公司如特斯拉、沃尔沃、宝马等也对无人驾驶技术进行了深入研究，其近期定位是实现高速公路上的高级辅助驾驶。


    2.自动驾驶技术框架


    自动驾驶是一个完整的软硬件交互系统，自动驾驶核心技术包括硬件（汽车制造技术、自动驾驶芯片）、自动驾驶软件、高精度地图、传感器通信网络等。自动驾驶可以处理来自不同车载来源的观测流，如照相机、雷达、激光雷达、超声波传感器、GPS装置和惯性传感器，这些观察结果被汽车的计算机用来做驾驶决定。自动驾驶软件部分的模块主要包括以下几部分。


    （1）环境感知模块


    环境感知模块主要通过传感器来感知环境信息，如通过摄像头、激光雷达、毫米波雷达、超声波传感器等来获取环境信息；通过GPS获取车身状态信息。具体来说，其主要包括传感器数据融合、物体检测与物体分类（道路、交通标志、车辆、行人、障碍物等）、物体跟踪（行人移动）、定位（自身精确定位、相对位置确定、相对速度估计）等。


    （2）行为决策模块


    行为决策模块需要根据实时路网信息、交通环境信息和自身驾驶状态信息，产生遵守交通规则（包括突发异常状况）的安全、快速的自动驾驶决策（运动控制）。通俗地说，就是实时规划出一条精密而合理的行驶轨迹，可分为全局路径规划和局部路径规划，局部路径规划主要是指当出现道路损毁、存在障碍物等情况时找出可行驶区域行驶，在路径规划的同时需要考虑最终理想的乘坐体验。


    （3）运行控制模块


    运行控制模块可根据规划的行驶轨迹，以及当前行驶的位置、姿态和速度，对加速踏板、制动踏板、转向盘和变速杆等下达控制命令。


    3.自动驾驶的实现过程


    自动驾驶汽车的首要任务是了解周围环境并使其本地化。在此基础上，规划一条连续的路径，并通过行为仲裁系统确定汽车的未来行为。最后，运动控制模块反应性地校正在执行所计划的运动时产生的误差。


    在行驶过程中，自动驾驶汽车在两个点（即起始位置和所需位置）之间找到路线的能力即为路径规划。根据路径规划，自动驾驶汽车应考虑周围环境中存在的所有可能障碍物，并计算无碰撞路线的轨迹。一般认为自动驾驶是一种多智能体设置，在这种设置中，当车辆在超车、让路、合流、左转和右转，以及在非结构化城市道路上行驶时，宿主车辆必须与其他道路使用者应用复杂的谈判技巧。目前，在卷积神经网络的基础上进行视觉的感知是自动驾驶系统中最常用的方法。


    那么，深度学习具体如何用于自动驾驶呢？自动驾驶需要汽车像人的大脑一样来辨识一些行驶路径上出现的事物并做出决策。深度学习网络相当于人的大脑，对安装在车前的摄像头的图像进行采集，并通过卷积神经网络来提取图像的特征，通过模型计算来得出几个输出量，如加速、减速、转向盘的角度等信息。图4-14所示为深度学习在进行自动驾驶的仿真。


