    ReLU）；当`a`是可根据数据变化的值时就是`PReLU`（Parametric ReLU）。这 3 种改进的`ReLU`函数能够在一定程度上解决`ReLU`函数的问题，但是目前使用最多的还是`ReLU`激活函数。


    ### 4.1.7　损失函数


    损失函数是模型对数据拟合程度的反映，拟合得越差，损失函数的值就越大。与此同时，当损失函数比较大时，其对应的梯度也会随之增大，这样就可以加快变量的更新速度。


