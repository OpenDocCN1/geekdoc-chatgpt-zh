    ## [4.2　感知机](../Text/contents.xhtml#z100)


    感知机被称为深度学习领域最为基础的模型。虽然感知机是最为基础的模型，但是它在深度学习的领域中有着举足轻重的地位，它是神经网络和支持向量机学习的基础，可以说它是最古老的分类方法之一。


    ### [4.2.1　感知机简介](../Text/contents.xhtml#z101)


    感知机由弗兰克·罗森布拉特于1957年提出，是神经网络与支持向量机的基础，也是最早被设计并被实现的人工神经网络。感知机是一种非常特殊的神经网络，尽管它的能力非常有限，但是它在人工神经网络的发展史上有着非常重要的地位。感知机还包括多层感知机，简单的线性感知机可用于线性分类器，多层感知机（Multi-Layer
    Perception，MLP）可用于非线性分类器。


    感知机学习的目标就是求得一个能够将训练数据集中正、负实例完全分开的分类超平面，为了找到分类超平面，即确定感知机模型中的参数w和b，需要定义一个基于误分类的损失函数，并通过将损失函数最小化来求解w和b。


    在数据集线性可分性方面，感知机在二维平面中，可以用一条直线将“+1”类和“-1”类完美分开，那么这个样本空间就是线性可分的。因此，感知机都基于一个前提，即问题空间线性可分。


    在定义损失函数方面，感知机找到参数w和b时，将使得损失函数最小。


    ### [4.2.2　多层感知机](../Text/contents.xhtml#z102)


    多层感知机也叫作前馈神经网络，是深度学习中最基本的网络结构。MLP的网络结构如图4-6所示。


    ![](Images/cutq_81_3264_m.jpg)


    图4-6　MLP的网络结构


    MLP会将一组输入向量通过隐藏层映射到一组输出向量中，它通常由3部分组成，包括输入层、隐藏层和输出层。输入层从外部世界获取输入信息提供给MLP网络，在输入节点中不进行任何计算，仅向隐藏节点传递信息。隐藏层中的节点对输入信息进行处理，并将信息传递到输出层中。输出层负责计算输出值，并将输出值传递到外部世界。图4-6所示为一个3层的MLP的网络结构，该结构有3个输入值，包括x[1]、x[2]、x[3]，隐藏层有4个隐藏节点，分别用a[1]、a[2]、a[3]、a[4]表示，最后输出一个值y。在MLP前向传导计算过程中，先求出隐藏节点的输出值，再计算输出值，计算过程如式4-12所示。


    ![](Images/cutq_81_11548_l.jpg)


    式中，a[i]表示MLP的隐藏层中第i个隐藏节点的激活值，w^((l))[ij]表示第l层中第i个节点与第l+1层中第j个节点之间的连接权重，f(·)表示激活函数。


    MLP通过反向传播算法对参数进行学习。前向传播是对激活值从左向右进行传播，反向传播是对梯度值从右向左进行传播。反向传播算法是一个迭代算法，它的基本思想如下：首先，按照前向传播逐层计算每一层网络的状态和激活值，直到最后一层；其次，计算每一层的误差；最后，对损失函数进行求导，并从右往左逐层对参数进行更新。迭代这3个步骤，直到满足停止条件。


    MLP具有诸多优点，如可以并行处理、能学习数据中的非线性关系等；但是其也具有一些缺点，如网络中隐藏节点的数量难以确定、需要确定很多超参数、学习速度较慢、容易陷入局部极值等。


