    ## 3. NewSQL数据库

    NewSQL数据库是指各种新的可扩展/高性能数据库，它是一种相对较新的形式，旨在使用现有的编程语言和以前不可用的技术来结合SQL和NoSQL。这类数据库不仅具有NoSQL对海量数据的存储管理能力，还保持了传统数据库支持ACID和SQL等的特性。因此，NewSQL也被定义为下一代数据库的发展方向。在技术上，相较于传统关系型数据库，NewSQL更强调数据一致性，以更好地适应分布式数据库的应用；它取消了耗费资源的缓冲池，直接在内存中运行整个数据库，缩短了访问数据库的时间；此外，它摒弃了单线程服务的锁机制，通过使用冗余机器来实现复制和故障恢复，以取代原有的成本高昂的恢复操作。


    ## 4. 云数据库

    云数据库是指被优化或部署到一个虚拟计算环境中的数据库，是在云计算的大背景下发展起来的一种新兴的共享基础架构的方法，它极大地增强了数据库的存储能力，消除了人员、硬件、软件的重复配置，让软、硬件升级变得更加容易。因此，云数据库具有高可扩展性、高可用性、采用多租形式和支持资源有效分发等特点，可以实现按需付费和按需扩展。图2-5所示为阿里云的云数据库服务。


