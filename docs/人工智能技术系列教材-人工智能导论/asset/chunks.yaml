- raw: '卷积神经网络（Convolutional Neural Network，CNN），顾名思义，指在神经网络的基础上加入了卷积运算，通过卷积核局部感知图像信息提取其特征，多层卷积之后能够提取出图像的深层抽象特征，凭借这些特征来达到更准确的分类或预测的目标。卷积神经网络与一些传统的机器学习方法相比，能够更加真实地体现数据内在的相关特征，因此，目前卷积神经网络是图像、行为识别等领域的研究热点。


    ### [4.3.1　卷积神经网络简介](../Text/contents.xhtml#z104)


    卷积神经网络作为一个深度学习架构被提出时，它的最初诉求是降低对图像数据预处理的要求，以避免烦琐的特征工程。CNN由输入层、输出层以及多个隐藏层组成，隐藏层可分为卷积层（Convolutional
    Layer）、池化层（Pooling Layer）、ReLU层和全连接层（Fully-connect ed Layer），其中卷积层与池化层相配合可组成多个卷积组，逐层提取特征。


    CNN的输入一般是二维向量，也可以有高度，如RGB图像。而卷积层是CNN的核心，该层的参数由一组可学习的滤波器或内核组成。简单来讲，卷积层用来对输入层进行卷积，达到提取更高层次的特征的目的；池化层又称下采样层，它能减小数据处理量，同时保留有用的信息；ReLU层全名为修正线性单元，是神经元的激活函数。在经过多轮的卷积层和池化层的处理后，可以认为图像中的信息已经被抽象成了信息含量更高的特征，但此时仍然需要使用1到2个全连接层来给出最后的分类结果。综上所述，CNN能够得出原始图像的有效表征，这使得CNN能够直接从原始像素中，经过极少的预处理达到识别视觉上的规律的效果。


    CNN和传统的神经网络相比，主要具有局部感知、权值共享和多卷积核这三大特点。局部感知实际上就是卷积核和图像卷积的时候，每次卷积核只覆盖一小部分像素（即局部特征），由于传统的神经网络是整体的过程，因此该过程称为局部感知；权值共享是CNN最大的特点，这种结构可以大大减少神经网络的参数量，防止过拟合的同时降低了神经网络模型的复杂度；多卷积核可以充分提取图像的特征，因为每个卷积都是一种特征提取方式。


    ### [4.3.2　卷积神经网络的结构](../Text/contents.xhtml#z105)


    卷积神经网络是多层感知机的变体，根据生物视觉神经系统中神经元的局部响应特性设计，采用局部连接和权值共享的方式降低模型的复杂度，极大地减少了训练参数，提高了训练速度，也在一定程度上提高了模型的泛化能力。CNN是目前多种神经网络模型中研究最为活跃的一种，一个典型的CNN主要由卷积层、池化层、全连接层构成。卷积神经网络的结构如图4-7所示。


    ![](Images/cutq_83_19948_l.jpg)


    图4-7　卷积神经网络的结构


    1.卷积层


    卷积是一种线性计算过程，整个卷积层的卷积过程如下：首先，选择某一规格大小的卷积核，其中卷积核的数量由输出图像的通道数量决定；其次，将卷积核按照从左往右、从上到下的顺序在二维数字图像上进行扫描，分别将卷积核上的数值与二维图像上对应位置的像素值进行相乘求和；最后，将计算得到的结果作为卷积后相应位置的像素值，这样就得到了卷积后的输出图像。第一次扫描卷积的计算过程示意图如图4-8所示。


    ![](Images/cutq_83_27762_l.jpg)


    图4-8　第一次扫描卷积的计算过程示意图


    2.池化层


    池化层又称为下采样层，主要是通过对卷积形成的图像特征进行特征统计，这种统计方式不仅可以降低特征的维度，还可以降低网络模型过拟合的风险。此外，卷积图像经过池化操作后可以有效减小输出图像的尺寸，在保留图像主要特征的同时可以减少网络结构中的计算参数，防止过拟合，提高模型的泛化能力。


    CNN中常用的池化方法有最大池化法和平均池化法两种。最大池化法是选择图像区域的最大值作为该区域池化后的值，最大池化法示意图如图4-9所示。


    ![](Images/cutq_84_34250_m.jpg)


    图4-9　最大池化法示意图


    平均池化法是将图像区域中的平均值作为该区域池化后的值，平均池化法示意图如图4-10所示。


    ![](Images/cutq_84_39536_m.jpg)


    图4-10　平均池化法示意图


    3.全连接层


    图像经过卷积操作后，其关键特征被提取出来，全连接层的作用就是对图像的特征进行组合拼接，最后通过计算得到图像被预测为某一类的概率。在实际使用过程中，全连接层一般处于整个卷积神经网络的后端，其计算过程可以被转化为卷积核为1×1的卷积过程。


    ### [4.3.3　常用的卷积神经网络](../Text/contents.xhtml#z106)


    常用的卷积神经网络包括但不限于以下所述的3种。


    1.VGG


    VGG有两种结构，分别是VGG16和VGG19，两者并没有本质上的区别，只是网络深度不一样。VGG网络由卷积层模块后接全连接层模块构成。VGG块的组成规律是连续使用数个相同的填充为1、窗口形状为3×3的卷积层后，接上一个步幅为2、窗口形状为2×2的最大池化层。卷积层保持输入的高和宽不变，而池化层则对其减半。


    简单来说，在VGG中使用3个3×3卷积核来代替7×7卷积核，使用2个3×3卷积核来代替5×5卷积核，这样做的主要目的是在保证具有相同感知野的条件下，提升网络的深度，在一定程度上提升了神经网络的效果。例如，3个步长为1的3×3卷积核的一层层叠加作用可看作一个大小为7的感知野（也就是3个3×3连续卷积相当于一个7×7卷积），如果直接使用7×7卷积核，则其参数总量为49×C的平方，这里C指的是输入和输出的通道数。因此，VGG不仅减少了参数，还利用3×3卷积核更好地保持了图像性质。


    VGG的优点如下：结构非常简洁，整个网络都使用了同样大小的卷积核尺寸（3×3）和最大池化尺寸（2×2）；几个小滤波器（3×3）卷积层的组合比一个大滤波器（5×5或7×7）卷积层好；验证了通过不断加深网络结构可以提升性能。


    VGG的缺点如下：耗费了更多的计算资源，使用了更多的参数，导致了更多的内存占用。


    2.GoogLeNet


    GoogLeNet和VGG一样，在主体卷积部分中使用了5个模块，每个模块之间使用步幅为2的3×3最大池化层来减小输出高和宽。


    第一模块使用了一个64通道的7×7卷积层。


    第二模块使用了2个卷积层，先是64通道的1×1卷积层，再是将通道增大3倍的3×3卷积层。它对应Inception块中的第二条线路。


    第三模块串联了2个完整的Inception块。第一个Inception块的输出通道数为64+128+32+32=256，其中4条线路的输出通道数比例为64:128:32:32=2:4:1:1。其中，第二条、第三条线路先分别将输入通道数减少至96/192=1/2和16/192=1/12后，再接上第二层卷积层。第二个Inception块输出通道数增至128+192+96+64=480，每条线路的输出通道数之比为128:192:96:64=4:6:3:2。其中，第二条、第三条线路先分别将输入通道数减小至128/256=1/2和32/256=1/8。


    第四模块更加复杂。它串联了5个Inception块，其输出通道数分别是192+208+48+64=512、160+224+64+64=512、128+256+64+64=512、112+288+64+64=528和256+320+128+128=832。这些线路的通道数分配和第三模块中的类似，首先含3×3卷积层的第二条线路输出最多通道，其次是仅含1×1卷积层的第一条线路，之后是含5×5卷积层的第三条线路和含3×3最大池化层的第四条线路。其中，第二条、第三条线路都会按比例减小通道数，这些比例在各个Inception块中都略有不同。


    第五模块有输出通道数为256+320+128+128=832和384+384+128+128=1024的两个Inception块。其中，每条线路的通道数的分配思路和第三、第四模块中的一致，只是在具体数值上有所不同。最后将输出变成二维数组后，接上一个输出个数为标签类别数的全连接层。GoogLeNet模型的计算复杂，不如VGG那样便于修改通道数。


    3.ResNet


    ResNet的前两层和GoogLeNet中的一样，在输出通道数为64、步幅为2的7×7卷积层后接步幅为2的3×3的最大池化层。不同之处在于ResNet每个卷积层后增加的批量归一化层，GoogLeNet在后面接了4个由Inception块组成的模块，ResNet则使用4个由残差块组成的模块，每个模块使用若干个同样输出通道数的残差块。第一个模块的通道数同输入通道数一致，由于之前已经使用了步幅为2的最大池化层，所以无须减小高和宽。之后的每个模块在第一个残差块中将上一个模块的通道数翻倍，并将高和宽减半。


    ## [4.4　循环神经网络](../Text/contents.xhtml#z107)


    循环神经网络（Recurrent Neural Network，RNN）是深度学习领域中一类特殊的内部存在自连接的神经网络，可以学习复杂的矢量到矢量的映射。迈克尔·乔丹（Michael
    Jordan）和杰夫·埃尔曼（Jeff Elman）分别于1986年和1990年提出循环神经网络框架，称为简单循环网络（Simple Recurrent Network，SRN），被认为是目前广泛流行的循环神经网络的基础版本，之后不断出现的更加复杂的结构均可认为是其变体或者扩展。循环神经网络已经被广泛用于各种与时间序列相关的工作任务中。


    ### [4.4.1　循环神经网络简介](../Text/contents.xhtml#z108)


    循环神经网络是一种以序列（Sequence）数据为输入，在序列的演进方向进行递归（Recursion），且所有节点（循环单元）按链式连接形成闭合回路的递归神经网络（Recursive
    Neural Network）。


    循环神经网络是为了刻画一个序列当前的输出与之前信息的关系。从网络结构上看，循环神经网络会记忆之前的信息，并利用之前的信息影响后面节点的输出。简单来说，循环神经网络的隐藏层之间的节点是有连接的，隐藏层的输入不仅包括输入层的输出，还包括上一时刻隐藏层的输出。对于每一个时刻的输入，循环神经网络会结合当前模型的状态给出一个输出，其可以看作同一神经网络被无限复制的结果。


    闭合回路连接是循环神经网络的核心部分。循环神经网络对于序列中每个元素都执行相同的任务，输出依赖于之前的计算（即循环神经网络具有记忆功能），记忆可以捕获迄今为止已经计算过的信息。循环神经网络在语音识别、语言建模、自然语言处理（Natural
    Language Processing，NLP）等领域有着重要的应用。


    ### [4.4.2　循环神经网络的结构](../Text/contents.xhtml#z109)


    RNN应用于输入数据具有依赖性且是序列模式时的场景，即前一个输入和后一个输入是有关联的。RNN的隐藏层是循环的，这表明隐藏层的值不仅取决于当前的输入值，还取决于前一时刻隐藏层的值。具体的表现形式是RNN“记住”前面的信息并将其应用于计算当前输出，这使得隐藏层之间的节点是有连接的。RNN结构示意图如图4-11所示。


    图4-11中的每个圆圈可以看作一个单元，而且每个单元的功能都是一样的，因此可以折叠成左半图的形式。简单概括之，RNN就是一个单元结构重复使用的神经网络。


    从RNN的结构可知，RNN的下一时刻的输出值是由前面多个时刻的输入值来共同影响决定的，假设有一个输入是“我是中国”，那么应该对应通过“是”和“中国”这两个前序输入来预测下一个词最有可能是什么。通过分析预测是“人”的概率比较大。


    ![](Images/cutq_87_5116_l.jpg)


    图4-11　RNN结构示意图


    ### [4.4.3　常用的循环神经网络](../Text/contents.xhtml#z110)


    常用的循环神经网络包括但不限于以下所述的2种。


    1.长短期记忆网络


    长短期记忆（Long Short-Term Memory，LSTM）网络是一种拥有3个“门”结构的特殊网络结构。LSTM网络靠一些“门”的结构让信息有选择性地影响神经网络中每个时刻的状态。“门”结构是一个使用Sigmoid函数的神经网络和一个按位做乘法结合在一起的操作，叫作“门”是因为使用Sigmoid作为激活函数的全连接神经网络层会输出一个0到1中的数值，以描述当前输入有多少信息量可以通过这个结构。这个结构的功能类似一扇门，当门打开时（全连接神经网络层输出为1），全部信息都可以通过；当门关上时（全连接神经网络层输出为0），任何信息都无法通过。


    循环神经网络在处理序列化输入方面有着广泛的应用，它是深度学习框架中的一个典型模型。CNN和RNN在理论上可以处理无限长的数据序列，但在实际的应用中，当数据距离较长时会出现结果难以收敛的问题。而LSTM可以解决其他神经网络难以处理的长距离依赖问题，且由于LSTM网络在结构中利用隐藏层增加单元状态来代替原始RNN结构中隐藏层只有一个状态的情况，因此有效解决了梯度消失和梯度爆炸的问题。LSTM网络具有的诸多特性，使其在图像处理、语音识别以及自然语言处理等诸多领域都有广泛的应用。


    2.门控循环单元神经网络


    门控循环单元（Gated Recurrent Unit，GRU）神经网络是由LSTM网络改进的模型。LSTM网络是RNN的一种变形模型，最为引人注目的成就就是很好地克服了循环神经网络中长依赖的问题。但是LSTM网络模型的形式较为复杂，同时存在着训练时间较长、预测的时间较长等问题。GRU神经网络对LSTM网络的改进也正是为了解决这些问题。


    GRU神经网络在LSTM网络的基础上主要做了两点重要的改变。一是GRU神经网络只有两个门，GRU神经网络将LSTM网络中的输入门和遗忘门合二为一，称为更新门（Update
    Gate），控制记忆信息能够继续保留到当前时刻的数据量；另一个门称为重置门（Reset Gate），控制要遗忘多少记忆信息。二是取消进行线性自更新的记忆单元（Memory
    Cell），而直接在隐藏单元中利用门控直接进行线性自更新。


    ## [4.5　生成对抗网络](../Text/contents.xhtml#z111)


    受博弈论中二人零和博弈的启发，2014年，伊恩·古德菲勒（Ian Goodfellow）等发表了生成对抗网络的开创性文章，该文章的主要观点是生成对抗网络（Generative
    Adversarial Networks，GAN）的基本思想是学习训练样本的概率分布。


    ### [4.5.1　生成对抗网络简介](../Text/contents.xhtml#z112)


    生成对抗网络独特的对抗性思想使得它在众多生成网络模型中脱颖而出，被广泛应用于计算机视觉、机器学习和语音处理等领域。


    GAN让两个网络（生成网络G和判别网络D）相互竞争，G不断捕捉训练集中真实样本x[real]的概率分布，并通过加入随机噪声将其转变成赝品x[fake]。D观察真实样本x[real]和赝品x[fake]，判断这个x[fake]到底是不是x[real]。整个对抗过程是先让D观察（机器学习）一些真实样本x[real]，当D对x[real]有了一定的认知之后，G尝试用x[fake]来欺骗D，让D相信x[fake]是x[real]。有时候G能够成功骗过D，但是随着D对x[real]了解的加深（即学习的样本数据越来越多），G发现越来越难以欺骗D，因此G在不断提升自己仿制赝品x[fake]的能力。如此往复多次，不仅D能精通x[real]的鉴别，G对x[real]的伪造技术也会大为提升。这便是GAN的生成对抗过程。


    GAN具备很多优点，如下所述是对GAN优点的简单总结。


    （1）能学习真实样本的分布，探索样本的真实结构。


    （2）具有更强大的预测能力。


    （3）样本的脆弱性在很多机器学习模型中普遍存在，而GAN对生成样本的鲁棒性强。


    （4）通过GAN生成以假乱真的样本，缓解了小样本机器学习的困难。


    （5）为指导人工智能系统完成复杂任务提供了一种全新的思路。


    （6）与强化学习相比，对抗式学习更接近人类的学习机理。


    （7）GAN与传统神经网络的一个重要区别是，传统神经网络需要人工精心设计和建构一个损失函数，而GAN可以学习损失函数。


    （8）GAN解决了先验概率难以确定的难题。


    ### [4.5.2　生成对抗网络的结构](../Text/contents.xhtml#z113)


    GAN的网络结构由生成网络和判别网络共同构成。生成网络G接收随机变量z，生成假样本数据G(z)，目的是尽量使得生成的样本和真实样本一样。判别网络D的输入由两部分组成，分别是真实数据x和生成器生成的数据G(x)，其输出通常是一个概率值，表示D认定输入是真实分布的概率，若输入来自真实数据，则输出1，否则输出0。同时，判别网络的输出会反馈给G，用于指导G的训练。理想情况下，D无法判别输入数据是来自真实数据x还是生成数据G(z)，即D每次的输出概率值都为0.5（相当于随机猜测），此时模型达到最优。在实际应用中，生成网络和判别网络通常用深层神经网络来实现。GAN模型结构示意图如图4-12所示。


    ![](Images/cutq_89_4250_m.jpg)


    图4-12　GAN模型结构示意图


    GAN中的生成网络和判别网络可以看作博弈中的两个玩家。在模型训练的过程中生成网络和判别网络会各自更新自身的参数使得损失最小，通过不断迭代优化，最终达到一个纳什均衡状态，此时模型达到最优。GAN的目标函数如式4-13所示。


    ![](Images/cutq_89_14929_l.jpg)


    1.生成网络


    生成网络本质上是一个可微分函数，生成网络接收随机变量z的输入，经生成器G生成假样本G(z)。在GAN中，生成器对输入变量z基本没有限制，z通常是一个100维的随机编码向量，z可以是随机噪声或者符合某种分布的变量。生成网络理论上可以逐渐学习任何概率分布，经训练后的生成网络可以生成逼真图像，但又不会和真实图像完全一样，即生成网络实际上是学习了训练数据的一个近似分布，这在数据增强应用方面尤为重要。


    2.判别网络


    判别网络同生成网络一样，其本质上也是可微分函数，在GAN中，判别网络的主要目的是判断输入是否为真实样本，并提供反馈以指导生成网络训练。判别网络和生成网络组成零和博弈的两个玩家，为取得游戏的胜利，判别网络和生成网络通过训练不断提高自己的判别能力和生成能力，游戏最终会达到一个纳什均衡状态。此时，生成网络学习到了与真实样本近似的概率分布，判别网络已经不能正确判断输入的数据是来自真实样本还是来自生成器生成的假样本G(x)，即判别网络每次输出的概率值都是0.5。


    ### [4.5.3　常用的生成对抗网络](../Text/contents.xhtml#z114)


