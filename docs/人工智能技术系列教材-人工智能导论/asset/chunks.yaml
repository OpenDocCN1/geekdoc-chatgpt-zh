  trans: '


    Hakia 是由 Xerox 公司推出的搜索引擎，它通过理解用户查询并利用本体进行查询扩展，将各种基于主题的相关信息汇总起来。其利用的技术包括词形变换、同义词扩展、概念具体化、自然语言理解等，可为用户提供语义搜索范围内的解决方案，能够满足用户对低成本、高效率的搜索需求。其搜索范围包括新闻、网页、博客、Wikipedia、PubMed
    等，返回结果的呈现方式有深度语义（Galleries、PubMed、可信站点）、表面语义（新闻、博客、网页）、常规搜索加结果页面链接。


    Factbites 可依据事实进行回答，与结果链接相比，其更专注于内容分析，并可使搜索结果更有意义，到目前为止，其只有简单搜索方式。其搜索结果呈现方式是从网页中所抽取出的有意义的、完整的语句清单加
    URL。


    DeepDyve 是深网或隐形网络搜索引擎，可提供深度网络学术资源租赁服务与全文预览服务。其搜索范围包括来自 Nature、IEEE、Elsevier、Wiley-Blackwel、Springer
    等一流出版机构的有关健康科学、生命科学、社会科学、物理科学与工程学等领域的权威评审期刊及专利等深度网络学术资源，其也可搜索 Wikipedia，其搜索范围正慢慢扩展至更多的领域。其搜索结果主要为
    PDF 文档，而搜索结果的呈现方式是结果过滤项，如主题、类型（可租用、仅供预览、免费）、时间、作者、期刊加结果页面链接。


    Kngine 可对任何主题进行搜索，支持移动端搜索，其搜索方式包括语音搜索和简单搜索，其语种包括英语、德语、西班牙语、阿拉伯语。其以选项卡形式展现搜索结果，在选项卡下方可选择显示与每项相关的术语和网页。


    ## 7.7.2　问答系统


    问答系统也是知识图谱应用较为广泛的领域，问答系统需要理解查询的语义信息，将输入的自然语言转换为知识库中的实体和关系的映射。例如，输入“阿里巴巴的创始人”，系统会到知识库中寻找“马云”这个实体，并搜索该实体下“创始人”这个属性的值，将其展现在系统页面中。


    目前，此类问答系统有 Google、百度、Wolfram｜Alpha、Watson 等。


    ### 1.定义、目标和研究意义


    问答系统是指让计算机自动回答用户所提出的问题，是信息服务的一种高级形式。不同于现有的搜索引擎，问答系统返回用户的不再是基于关键词匹配的相关文档排序，而是精准的自然语言形式的答案。


    2011 年，华盛顿大学奥伦·埃齐奥尼（Oren Etzioni）教授在 Nature 上发表文章 Search Needsa Shake-Up，明确指出：“以直接而准确的方式回答用户自然语言提问的自动问答系统将构成下一代搜索引擎的基本形态”。问答系统被认为是未来信息服务的颠覆性技术之一，是机器具备语言理解能力的主要验证手段之一。因此，对其开展研究具有非常重要的学术和实际意义。特别是近些年，随着人工智能热潮的到来，无论是学术界还是产业界，都对其给予了极大的关注和投入。


    纵观问答系统的技术演进，其一直伴随人工智能技术的发展而发展。近些年，问答系统更是取得了一系列备受关注的成果。2011 年，IBM Watson 自动问答机器人在美国家喻户晓的智力竞赛节目
    Jeopardy！中战胜人类选手，在业内引起了巨大的轰动。随着人工智能技术的突飞猛进，各大公司相继推出了以问答系统为核心技术的产品和服务，如移动生活助手（Siri、小爱同学、小娜等）、智能音箱（HomePod、Alexa、小爱音箱等）等，这似乎让人们看到了黎明的曙光，甚至认为现有的问答系统已经十分成熟。


    尽管 IBM Watson 系统在 Jeopardy！中战胜了人类选手，但是其核心技术并没有突破传统的基于“检索+抽取”的问答模式，缺乏对于文本语义深层次的分析和处理，难以实现知识的深层逻辑推理，无法达到人工智能的高级目标。Watson
    的成功也已经被证明仅仅局限于限定领域、特定类型的问题，离达到语义的深度理解以及智能问答还有很大的距离，其他问答系统如 Siri 等，也存在同样的问题。因此，面对已有问答模式的不足，为了提升信息服务的准确性与智能性，研究者近些年逐步把目光投向知识图谱。其意图是通过信息抽取、关联、融合等手段，将互联网文本转换为结构化的知识，利用实体以及实体间的语义关系对整个互联网文本内容进行描述和表示，从数据源头对信息进行深度的挖掘和理解。同时，互联网中已经有一些可以获取的大规模知识图谱，如
    DBpedia、Freebase、YAGO 等。这些知识图谱多是以实体、关系为基本单元所组成的图结构。


    基于结构化的知识分析用户自然语言问题的语义，进而在已构建的结构化知识图谱中通过检索、匹配或推理等手段获取正确答案，这一任务称为知识库问答（Question
    Answering over Knowledge Base，KBQA）。这一问答范式由于已经在数据层面通过知识图谱的构建对文本内容进行了深度挖掘与理解，因此能够有效地提升问答的准确性。


    ### 2.研究内容和关键问题


    知识库问答系统在回答用户问题时，需要正确理解用户所提出的自然语言问题，抽取其中的关键语义信息，在已有单个或多个知识库中通过检索、推理等手段获取答案并返回给用户。其中所涉及的关键技术包括词法分析、句法分析、语义分析、信息检索、逻辑推理、语言生成等。传统知识库问答系统多集中在限定领域，针对有限类型的问题进行回答。然而，伴随大数据的飞速发展，已有知识图谱的规模在不断扩大，所涉及的领域不断增多。现有研究趋向于面向大规模、开放域、多源异构知识库构建问答系统。总体来讲，主要面临如下
    3 个关键问题。


    #### （1）问句语义解析


    问答系统要回答用户的问题，首先就要正确理解用户所提问题的语义内容。面对结构化知识库，需要将用户问题转换为结构化的查询语句，进而在知识图谱中进行查询、推理等操作，获取正确答案。因此，对于用户问题的语义解析是知识库问答系统研究所面临的首要问题。具体过程是需要分析用户问题中的语义单元，与知识图谱中的实体、概念进行链接，并分析问句中的语义单元之间的语义关系，将用户问题解析为知识图谱中所定义的实体、概念、关系所组成的结构化语义表示形式。其中涉及词法分析、句法分析、语义分析等多项关键技术，需要自底向上从文本的多个维度理解其中包含的语义内容。在词法层面，需要在开放域环境下，研究实体和术语（Terminology）的识别、答案类型词（Lexical
    Answer Type）识别、实体消歧（Entity Disambiguation）等关键技术；在句法层面，需要解析句子中词与词之间、短语与短语之间的句法关系，分析出句子的句法结构；在语义层面，需要根据词语层面、句法层面的分析结果，将自然语言问句解析成可计算的、结构化的逻辑表达形式（如一阶谓词逻辑表达式）。传统知识库问答方法面对单一领域有限规模知识图谱，涉及的实体、概念、关系规模通常较小，一般采用模板或者小规模机器学习算法进行语义解析。但是当其面对大规模、多领域知识库时，随着实体、概念、关系规模的增大，语义解析算法的复杂度呈指数级增加，如何获取实体、如何进行开放域关系抽取等问题仍然是学术界需要面对的难点。目前，已有一些研究利用深度神经网络将用户问题解析为隐式表达的分布式数值向量的形式，其中蕴含了用户问句的关键语义，但是如何在分布式表示过程中与知识图谱相关联，反映其中所蕴含的实体、关系等关键语义是另一个关键问题。


    #### （2）大规模知识推理


    在问答过程中，并不是所有的问题都能通过在知识图谱中进行检索或查询就可以获取答案。主要原因是已有知识库本身的覆盖度有限，需要在已有的知识体系中，通过知识推理的手段获取这些隐含的答案。例如，知识库中包括了一个人的出生地信息，但是没包括这个人的国籍信息，虽然知识库中人物对应了“国籍”属性，但是没有直接给出该属性的值，因此还是不能回答诸如“某某是哪国人？”这样的问题。但是实际上我们知道，一般情况下，一个人的出生地所属的国家就是他（她）的国籍。这些知识存在于人的常识体系中，但并未被编码在已有知识库中。面对知识库问答，就需要通过推理的方式得到答案。传统推理方法基于符号的知识表示形式，通过人工构建的推理规则推理出答案。但是面对大规模、开放域的问答场景，如何自动进行规则学习，如何解决规则冲突仍然是亟待解决的问题。目前，伴随深度学习的飞速发展，基于分布式表示的知识表示学习方法能够将实体、概念以及它们之间的语义关系表示为低维空间中的对象（向量、矩阵等），通过在低维空间中的数值计算完成知识推理任务。就目前来说，虽然这类推理的效果离投入使用还有一段距离，但是值得研究。特别是将已有的基于符号表示的逻辑推理与基于分布式表示的数值推理相结合，研究融合符号逻辑和表示学习的知识推理技术，是知识推理任务中的关键问题。


    #### （3）异构知识关联


    由于用户问题的复杂性和多样性，问题的答案往往不能在单一知识库中找到，需要综合多个知识库（多种语言、多个领域、多种模态）中的知识才能给出答案。例如，对于“谁出演了《变形金刚》并且和
    Monkey Business 的演唱者结婚了？”这个问题，“出演了《变形金刚》”的信息需要在电影知识库中搜寻答案；而有关“结婚”的信息通常位于人物知识库中；“Monkey
    Business 的演唱者”信息则位于音乐知识库中。因此，对于这个问题，需要综合电影、人物以及音乐 3 个不同知识库的信息，才能推出最终的答案：“乔什·杜哈明”。由于多源知识库之间存在结构差异、内容差异、语言差异、模态差异，要完成这一任务并不简单。在面向多源异构知识库问答的过程中，相对于面向单一知识库的问答，问句文本歧义更加严重，同一短语在不同知识库中会被映射为更多的概念（实体、关系）候选，使得问题的语义解析更加困难。问题中不同的子问题需要在不同的知识库中进行求解，这需要问答系统对子问题进行精准划分，同时确定子问题求解范围。不同源异构知识库之间存在冗余关联，不同知识库中的不同实体、关系间具有同指关系。多知识库问答需要利用这种同指关系对多个知识库中的知识进行综合，从而回答用户问题，然而，多源异构知识库间的同指关系通常并没有显式给出，而是一种隐式关系。因此，系统需要挖掘知识库间的同指关系，完成异构知识库的关联与对齐，这对于构建多源异构知识库的问答系统有着重要的作用。


    ## 7.8　小结


    （1）知识图谱以结构化的形式描述客观世界中的概念、实体及其关系。

    （2）知识表示方法主要分为基于符号的知识表示方法、基于表示学习的知识表示方法。

    （3）知识抽取指从不同来源、不同结构的数据中进行知识提取，形成知识的过程。

    （4）知识存储是针对知识图谱的知识表示形式设计底层存储方式，完成各类知识的存储，以支持对大规模数据的有效管理和计算。

    （5）知识融合的目标是产生新的知识，对松耦合来源中的知识进行集成，构成一个合成的资源，以补充不完全的知识和获取新知识。

    （6）知识图谱的推理首先需要考虑的是知识如何表达的问题，即知识图谱的知识表示，它包括基于图结构的表示和相应的逻辑基础，以及基于张量的表示。

    （7）语义搜索是指搜索引擎的工作不再拘泥于用户所输入请求语句的字面本身，而是透过现象看本质，准确地捕捉到用户的真实意图，并依此来进行搜索，从而更准确地向用户返回最符合其需求的搜索结果。

    （8）知识库问答系统在回答用户问题时，需要正确理解用户所提出的自然语言问题，抽取其中的关键语义信息，在已有单个或多个知识库中通过检索、推理等手段获取答案并返回给用户。


