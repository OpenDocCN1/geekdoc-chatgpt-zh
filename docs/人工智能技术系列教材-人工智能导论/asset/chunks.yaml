- raw: '人类智力的优越性表现在人能思考、判断和决策。思维是人类在感性认识的基础上形成的理性认识，是通过分析和综合过程来实现的，而人类思维中的分析综合过程则产生了质变，在一般的分析和综合基础上，产生了抽象和概括、比较和分类、系统化和具体化等一系列新的、高级的、复杂的思维能力，在头脑中运用概念做出判断和推理。要使机器具有智能，就必须使其具有推理的功能。推理是由一个或几个已知的判断推出另一个新判断的一种思维形式，即从已有事实推出新的事实的过程。在形式逻辑中，推理由前提（已知判断）、结论（被推出的判断）和推理形式（前提和结论之间的联系方式）组成。以符号逻辑为基础的人工智能，是以逻辑思维和推理为主要内容的。传统的形式化推理技术，是以经典的谓词逻辑（即演绎推理）为基础的，广泛应用于早期的问题求解和定理证明中，但随着人工智能研究的不断深入，人们在研究中碰到的许多复杂问题不能用严格的演绎推理来解决，因而对非单调逻辑推理等方式的研究正迅速发展起来，已成为人工智能的重要研究内容之一。


    ### [1.3.5　机器感知](../Text/contents.xhtml#z13)


    机器感知就是使机器具有类似于人的感觉，包括视觉、听觉、触觉、嗅觉、痛觉、接近感和速度感等。其中，最重要的和应用最广的是机器视觉（计算机视觉）和机器听觉。机器视觉要能够识别与理解文字、图像、场景以至人的身份等；机器听觉要能够识别与理解声音和语言等。机器感知是机器获取外部信息的基本途径，要使机器具有感知能力，就要为它安装上各种传感器。机器视觉和机器听觉已催生了人工智能的两个研究领域——模式识别和自然语言理解或自然语言处理。实际上，随着这两个研究领域的进展，它们已逐步发展成为相对独立的学科。


    ### [1.3.6　机器思维](../Text/contents.xhtml#z14)


    机器思维，顾名思义，即在机器的“脑子”中进行的动态活动，也就是计算机软件中动态地处理信息的算法。利用机器感知的信息、认知模型、知识表示和推理可以有目标地处理感知信息和智能系统内部的信息，从而针对特定场景给出合适的判断，制定适宜的策略。人们平时接触到的路径规划、预测、控制等都属于机器思维的范畴。


    ### [1.3.7　机器学习](../Text/contents.xhtml#z15)


    学习是人类具有的一种重要智能行为。机器学习就是使机器（计算机）具有学习新知识和新技术，并在实践中不断改进和完善的能力；其目的是让机器能够像人类一样具备学习能力，能够感知世界、认知世界和改造世界。机器学习能够使机器自动获取知识，通过书本等文献资料、与人交谈或观察环境进行学习。因此，机器学习研究的就是如何让机器在与人类、环境交互的过程中自发地学习新的知识，或者利用人类已有的文献、数据、资料进行知识学习。目前，人工智能研究和应用最广泛的内容就是机器学习，具体内容包括深度学习、强化学习等。


    ### [1.3.8　机器行为](../Text/contents.xhtml#z16)


    机器行为是人工智能中最有趣、最新兴的领域之一。机器行为系指智能系统（计算机、机器人）具有的表达能力和行动能力，如对话、描写，以及移动、行走、操作和抓取物体等能力，它是一个利用行为科学来理解人工智能代理行为的领域。行为科学可以补充传统的解释方法，开发新的方法来帮助人们理解和解释人工智能的行为。研究机器的拟人行为是人工智能的高难度任务，随着人类和人工智能之间的互动变得越来越复杂，机器行为可能会在实现下一个层次的混合智能方面发挥关键作用。


    ## [1.4　人工智能领域的著名专家与代表性人物](../Text/contents.xhtml#z17)


    在人工智能的发展历程中，涌现出了诸多该领域的杰出科学家。本节主要介绍人工智能领域的著名专家和代表性人物。


    ### [1.4.1　艾伦·图灵](../Text/contents.xhtml#z18)


    艾伦·图灵，英国数学家、逻辑学家，被称为计算机科学之父、人工智能之父。1950年，他提出了著名的“图灵测试”，为人工智能的发展奠定了哲学基准。1966年，美国计算机协会以他的名字命名了“图灵奖”，专门表彰、奖励那些对计算机事业做出重要贡献的人。图灵曾经预言，在20世纪末，一定会有计算机通过“图灵测试”。而在2015年11月，《科学》杂志封面刊登了一篇重磅研究——人工智能终于能像人类一样学习，并通过了图灵测试。


    ### [1.4.2　斯图尔特·罗素](../Text/contents.xhtml#z19)


    斯图尔特·罗素（Stuart Russell），世界经济论坛（World Economic Forum，WEF）人工智能委员会副主席、加州大学伯克利分校人工智能中心创始人。他是最早和斯蒂芬·霍金（Stephen
    Hawking）等人发表了署名文章号召大家警惕人工智能可能带来的威胁的人，也是剑桥大学生存风险研究中心（Centre for the Study of Existential
    Risk）的创立成员，他编写的《人工智能：一种现代的方法》是100多个国家的约1 200所大学的教材。


    ### [1.4.3　斯蒂芬·霍金](../Text/contents.xhtml#z20)


    斯蒂芬·霍金，著名物理学家，被誉为继阿尔伯特·爱因斯坦（Albert Einstein）之后最杰出的理论物理学家。他曾经指出：强大的人工智能的崛起，要么是人类历史上最好的事，要么是最糟的。对于其好坏仍无法确定，但是人类应竭尽所能，确保其未来发展对人类及环境有利。关于人工智能和人类的文明发展，斯蒂芬·霍金认为，在不久的将来，人类或许会被人工智能所取代，也就是说，人工智能或许会使人类灭绝。


    ### [1.4.4　贾斯汀·卡塞尔](../Text/contents.xhtml#z21)


    贾斯汀·卡塞尔（Justine Cassell），卡耐基梅隆大学计算机学院副院长、WEF计算机全球未来理事会前主席，连续6年在达沃斯世界经济论坛担任演讲人，Yahoo-CMU未来私人助手研究项目负责人之一。她在人工智能领域地位很高，被赞誉为“人工智能女王”。贾斯汀·卡塞尔是人形对话代理的发明人，其研究在业界影响深远，最著名的研究成果就是在WEF上展出的社会感知机器人助理SARA。


    ### [1.4.5　约翰·麦卡锡](../Text/contents.xhtml#z22)


    约翰·麦卡锡（John McCarthy），于1956年达特茅斯会议上提出了“人工智能”的概念，没有他，就没有后来的人工智能研究。约翰·麦卡锡教授曾在麻省理工学院、达特茅斯学院、普林斯顿大学和斯坦福大学工作过，是斯坦福大学的荣誉教授。为了表彰他在人工智能领域做出的贡献，其于1971年获得了图灵奖。他所获得的其他奖项包括数学、统计和计算科学领域的国家科学奖，计算机和认知科学领域的本杰明·富兰克林奖。


    ### [1.4.6　吴恩达](../Text/contents.xhtml#z23)


    吴恩达，华裔美国人，斯坦福大学计算机科学系和电子工程系副教授，人工智能实验室主任，也是在线教育平台Coursera的创始人。他创建了谷歌的Brain AI研究部门，专注于深度学习技术。在斯坦福大学，他牵头的项目包括斯坦福人工智能机器人（STAIR）的开发，以及利用单一二维照片生成三维数字模型的算法。2013年，吴恩达入选《时代》杂志年度百大全球最具影响力人物榜单，成为16位科技界代表之一。


    ### [1.4.7　德米什·哈萨比斯](../Text/contents.xhtml#z24)


    德米什·哈萨比斯（Demis Hassabis）是DeepMind的联合创始人，这家英国人工智能创业公司于2014年被谷歌收购。DeepMind最著名的项目是轰动一时的围棋人工智能AlphaGo，它是首个击败人类围棋大师的计算机程序。在取得这一突破之前，最强大的围棋人工智能只能达到人类业余选手的水平。DeepMind团队最新的一项研究成果是可微分神经计算机（Differentiable
    Neural Computer，DNC），这或许意味着人们离自我觉醒的机器人又近了一步。


    ## [1.5　人工智能研究的主要学派](../Text/contents.xhtml#z25)


    从1956年正式提出人工智能的概念算起，人工智能研究的发展已有60多年的历史。这期间，不同学科背景的学者对人工智能做出了各自的理解，提出了不同的观点，由此产生了不同的学术流派。其中，对人工智能研究影响较大的主要有符号主义（Symbolism）、连接主义（Connectionism）和行为主义（Actionism）三大学派。


    ### [1.5.1　符号主义](../Text/contents.xhtml#z26)


    符号主义是一种基于逻辑推理的智能模拟方法，又称为逻辑主义（Logicism）、心理学派（Psychologism）或计算机学派（Computerism），其原理主要为物理符号系统假设和有限合理性原理，长期以来，一直在人工智能研究中处于主导地位。


    符号主义学派认为人工智能源于数学逻辑。数学逻辑从19世纪末起就获得迅速发展，到20世纪30年代开始用于描述智能行为。计算机出现后，人们又在计算机上实现了逻辑演绎系统。该学派认为人类认知和思维的基本单元是符号，而认知过程就是在符号表示上的一种运算。符号主义致力于用计算机的符号操作来模拟人的认知过程，其实质就是模拟人类的抽象逻辑思维，通过研究人类认知系统的功能机理，用某种符号来描述人类的认知过程，并把这种符号输入到能处理符号的计算机中，从而模拟人类的认知过程，实现人工智能。


    ### [1.5.2　连接主义](../Text/contents.xhtml#z27)


    连接主义又称为仿生学派（Bionicsism）或生理学派（Physiologism），是一种基于神经网络及网络间的连接机制与学习算法的智能模拟方法。这一学派认为人工智能源于仿生学，特别是人脑模型的研究。


    连接主义学派从神经生理学和认知科学的研究成果出发，把人的智能归结为人脑的高层活动的结果，强调智能活动是由大量简单的单元通过复杂的相互连接后并行运行的结果。其典型代表技术为人工神经网络。


    ### [1.5.3　行为主义](../Text/contents.xhtml#z28)


    行为主义又称进化主义（Evolutionism）或控制论学派（Cyberneticsism），是一种基于“感知-行动”的行为智能模拟方法。


    行为主义最早来源于20世纪初的一个心理学流派，认为行为是有机体用以适应环境变化的各种身体反应的组合，它的理论目标在于预见和控制行为。诺伯特·维纳（Norbert
    Wiener）和沃伦·麦洛克（Warren McCulloch）等人提出的控制论和自组织系统以及钱学森等人提出的工程控制论和生物控制论，影响了许多领域。控制论把神经系统的工作原理与信息理论、控制理论、逻辑以及计算机联系起来，早期的研究工作重点是模拟人在控制过程中的智能行为和作用，对自寻优、自适应、自校正、自镇定、自组织和自学习等控制论系统进行研究，并展开“控制动物”的研究。


    到20世纪60～70年代，上述这些控制论系统的研究取得了一定进展，20世纪80年代人们成功研发了智能控制和智能机器人系统。


    人工智能研究进程中的这三大学派推动了人工智能的发展。符号主义认为认知过程在本质上就是一种符号处理过程，人类思维过程总可以用某种符号来进行描述，其研究是以静态、顺序、串行的数字计算模型来处理智能，寻求知识的符号表征和计算，它的特点是自上而下；而连接主义则是模拟发生在人类神经系统中的认知过程，提供一种完全不同于符号处理模型的认知神经研究范式，主张认知是相互连接的神经元的相互作用；行为主义与前两者均不相同，认为智能是系统与环境的交互行为，是对外界复杂环境的一种适应。这些理论与范式在实践之中都形成了自己特有的问题解决方法体系，并在不同时期都有成功的实践范例。就解决问题而言，符号主义有从定理机器证明、归结方法到非单调推理理论等一系列成果，而连接主义有归纳学习，行为主义有反馈控制模式及广义遗传算法等成果。它们在人工智能的发展中始终保持着一种经验积累及实践选择的证伪状态。


    ## [1.6　人工智能的应用](../Text/contents.xhtml#z29)


    当前，几乎所有的科学与技术的分支都在使用人工智能领域所提供的理论和技术，下面简单列举一些其中最重要和最具代表性的应用。


    ### [1.6.1　专家系统](../Text/contents.xhtml#z30)


    与传统的计算机程序相比，专家系统是以知识为中心，注重知识本身而不是确定的算法。专家系统所要解决的是复杂而专门的问题。对于这些问题，人们还没有精确的描述和严格的分析，因而其一般没有解法，而且经常要在不确定或不精确的信息基础上做出判断，需要专家的理论知识和实际经验。标准的计算机程序能精确地区分出每一个任务应该如何完成；而专家系统则是告诉计算机要做什么，而不是区分要如何完成，这是两者最大的区别。另外，专家系统突出了知识的价值，大大减少了知识传授和应用的代价，使专家的知识迅速变成社会的财富。再者，专家系统采用的是人工智能的原理和技术，如符号表示、符号推理、启发式搜索等，与一般的数据处理系统不同。专家系统是目前人工智能中最活跃、最有成效的一个研究领域，它是一种具有特定领域的大量知识与经验的程序系统。人类专家由于具有丰富的知识，所以才能有优异的解决问题的能力，那么计算机程序如果能体现和应用这些知识，也应该能解决人类专家所能解决的问题，而且能帮助人类专家发现推理过程中出现的差错。在矿物勘测、化学分析、规划和医学诊断方面，这一设想已成为现实，专家系统已经达到了人类专家的水平。成功的案例如下：PROSPECTOR系统发现了一个钼矿沉积，价值超过1亿美元；DENDRL系统的性能已超过一般专家的水平，可供数百人在化学结构分析方面的使用；MY
    CIN系统可以对血液传染病的诊断治疗方案提供咨询意见，经正式诊断确认，它对患有细菌血液病、脑膜炎方面的诊断和提供治疗方案的能力已超过了这方面的专家。


    图1-3所示为专家系统结构。


