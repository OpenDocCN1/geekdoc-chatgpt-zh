  trans: '


    早期的关系抽取技术主要通过人工构造语义和语法规则的方式识别实体关系。但是这种方法需要规则构造者对领域的知识具有专业和深入的理解，并且需要对语言学有较好的认知；人工制定实体关系规则的工作量巨大，难以适应丰富的语言表达形式，并且很难扩展至其他领域。后来，利用统计机器学习抽取实体关系的技术不断发展，逐步替代了人工构造规则的方法。但是利用统计机器学习仍然需要提前定义实体关系的类型，如整体与部分的关系、位置关系等。面向开放域的关系抽取方法利用原始语料中的关系词来构建实体间的关系模型，解决了需要预先定义关系类型的难题。目前，由于面向开放域的关系抽取方法仍然存在一些性能上的不足，因此在实际应用中常采用多种抽取技术相结合的方式进行关系抽取。


    ### 7.3.3　属性抽取

    实体的属性可以使实体对象更加丰满。属性抽取的目的是从多种来源的数据中抽取目标实体的属性内容。实体的属性可以看作连接实体与属性值的关系，因此，在实际应用中，一些学者将属性抽取问题转换为关系抽取问题。例如，将人物的属性抽取问题转换为实体关系的抽取问题，利用支持向量机实现人物属性抽取和关系预测。


    目前，实体的属性抽取的数据主要来源于百科类网站包含的半结构化数据。例如，本体知识库 YOGA 便是从 Wikipedia 和 WordNet 的网页中自动抽取属性名和属性值等信息，并扩展得到的。但是半结构化数据中包含的知识是社会知识总量的一小部分，大部分实体属性信息仍然隐藏在非结构化的文本数据中。从文本中提取实体属性的方法主要有两种：一种是利用数据挖掘技术，从原始语料中发现属性和属性值之间的关系模式，并据此定位文本中的属性名和属性值；另一种是从百科类网站的半结构化数据中自动抽取出结构化的训练数据，并将其应用于非结构化数据的属性名和属性值的定位。


    ## 7.4　知识存储

    知识存储是针对知识图谱的知识表示形式设计底层存储方式，完成各类知识的存储，以支持对大规模数据的有效管理和计算。


    ### 7.4.1　知识存储概述

    知识存储的对象包括基本属性知识、关联知识、事件知识、时序知识和资源类知识等。知识存储方式的质量直接影响了知识图谱中知识查询、知识计算及知识更新的效率。


    ### 7.4.2　知识存储方式

    从存储结构上看，知识存储分为基于表结构的存储和基于图结构的存储，如图 7-10 所示。


    ![](img/cutq_152_35903_l.jpg)


    图 7-10　知识存储方式的类型


    1.基于表结构的存储


    基于表结构的存储是指运用二维的数据表对知识图谱中的数据进行存储。根据不同的设计原则，可以具有不同的表结构，如三元组表、类型表和关系数据库。三元组表的优点是简单直接、易于理解；缺点是整个知识图谱都存储在一张表中，导致单表的规模太大，相应的插入、删除、查询、修改的操作开销也大，因此实用性大打折扣。复杂查询在这种存储结构上的开销巨大，复杂查询将会拆分成若干个简单查询的操作，降低了查询的效率。


    2.基于图结构的存储


    基于图结构的存储即使用图模型描述和存储图谱数据。这种方式能直接反映图谱的内部结构，有利于知识的查询，结合图计算算法，进行知识的深度挖掘与推理。目前业界公认的图模型有
    3 种，分别是属性图（Property Graph）、资源描述框架（RDF）和超图（Hyper Graph），其中，属性图和资源描述框架已广泛运用到多个图数据库产品中。


    （1）属性图


    ![](img/cutq_153_45828_m.jpg)


    图 7-11　常见的属性图结构


    属性图或带标签的属性图（Labeled-Property Graph）由顶点（圆圈）、边（箭头）、属性（键值对）和标签组成，顶点和边可以有标签。属性图的表达很贴近现实生活中的场景，也可以很好地描述业务中所包含的逻辑。常见的属性图结构中，顶点的标签是
    USER，边的标签是 FOLLOWS，如图 7-11 所示。


    （2）资源描述框架


    鉴于传统关系数据库拥有较高的通用性、可靠性、稳定性及成熟的技术，基于 RDF 的知识形式也广泛使用关系数据库作为其存储方式。目前，主要有基于三元组的三列表存储方式、水平存储方式、基于类型的属性表存储方式和基于谓词的存储方式等。对于基于
    RDF 知识的三列表存储方式，其将关系数据库表的三列分别存储为 RDF 知识三元组的主语、谓语和宾语，即对应（实体，关系，实体）或者（实体，属性，属性值）。该三列表存储方式与传统的结构化数据存储方式相兼容，通用性好。但面向大规模的知识图谱时，由于其本身包含大量的三元组，因此会造成关系数据库的查询性能低。


    （3）超图


    超图概念的提出是为了解决简单图中的共指消解和分割等问题。对于熟悉的图而言，简单图的一个边（Edge）只能和两个顶点连接；而对于超图来讲，人们定义它的超边（Hyper
    Edge）可以和任意个数的顶点连接。超图可以完美解决标签网络中一条边只能和两个顶点连接的问题。


    ### 7.4.3　知识存储工具

    知识图谱的存储并不依赖特定的底层结构，一般的做法是按数据和应用的需求采用不同的底层存储，甚至可以基于现有的关系数据库进行构建。关系数据库是典型的基于表结构的存储，图数据库是典型的基于图结构的存储。


    1.关系数据库


    关系数据库是通过属性对现实世界中的事物进行描述，采用关系模型来组织数据的数据库，其以行和列的形式存储数据。一行表示一个记录，一列表示一个属性。用户通过查询来检索数据库中的数据，而查询是用于限定数据库中某些区域的执行代码。


    2.图数据库


    图数据库起源于欧拉和图论（Graph Theory），也可称为面向/基于图的数据库，图数据库的基本含义是以“图”这种数据结构存储和查询数据。它的数据模型主要是以节点和边来体现的，也可处理键值对，优点是能够快速解决复杂的关系问题。图数据库是一种非关系型数据库，支持对图结构进行查询、增加、删除、更新等操作。相对于传统的关系数据库而言，图数据库查询速度快、操作简单、能提供更为丰富的关系展现方式。


    ## 7.5　知识融合

    知识融合即合并两个知识图谱（本体），基本的问题是研究将来自多个来源的关于同一个实体或概念的描述信息融合起来的方法。


    ### 7.5.1　知识融合概述

    知识融合的概念最早出现在克莱德·霍尔萨普尔（Clyde Holsapple）和安德鲁·温士顿（Andrew Whinston）在 1983 年发表的文章 A
    Software Tools For Knowledge Fusion 中，并在 20 世纪 90 年代得到研究者的广泛关注。而另一种知识融合的定义是指对来自多源的不同概念、上下文和不同表达等信息进行融合的过程。斯米尔诺夫、利亚索夫和希洛夫在
    Context-Based Knowledge Fusion Patterns in Decision Support System for Emergency
    Response 一文中认为，知识融合的目标是产生新的知识，对松耦合来源中的知识进行集成，构成一个合成的资源，以补充不完全的知识和获取新知识。唐晓波和魏巍发表的文章《知识融合：大数据时代知识服务的增长点》在知识融合概念的基础上认为，知识融合是知识组织与信息融合的交叉学科，它面向需求和创新，通过对众多分散、异构资源上知识的获取、匹配、集成、挖掘等处理，获取隐含的或有价值的新知识，同时优化知识的结构和内涵，提供知识服务。


    ### 7.5.2　知识融合过程

    知识融合是一个不断发展变化的概念，尽管以往研究人员的具体表述不同、所站角度不同、强调的侧重点不同，但这些研究成果中还是存在很多共性，这些共性反映了知识融合的固有特征，可以将知识融合与其他类似或相近的概念区分开来。知识融合是面向知识服务和决策问题，以多源异构数据为基础，在本体库和规则库的支持下，通过知识抽取和转换获得隐藏在数据资源中的知识因子及其关联关系，进而在语义层次上组合、推理、创造出新知识的过程，并且这个过程需要根据数据源的变化和用户反馈进行实时动态调整。知识融合的过程如图
    7-12 所示。


    ![](img/cutq_154_56297_l.jpg)


    图 7-12　知识融合的过程


    ## 7.6　知识推理

    知识图谱的推理首先需要考虑的是知识如何表达的问题，即知识图谱的知识表示，本节介绍基于图结构的表示和相应的逻辑基础，以及基于张量的表示；其次需要考虑的是逻辑推理算法以及优化方法，以实现高效的逻辑推理；再次需要考虑基于统计的知识图谱推理算法，重点介绍基于表示学习的方法和基于图特征的方法；最后介绍从知识图谱中通过统计方法来学习本体的方法。


    ### 7.6.1　知识图谱的表示

    知识图谱的表示指的是用什么数据结构来表示一个知识图谱。顾名思义，知识图谱是以图的方式来展示知识，但是这并不代表知识图谱必须采用图的表示。从图的角度看，知识图谱是一个语义网络，即一种用互连的节点和边来表示知识的结构。语义网络中的节点可以代表概念、属性、事件或者实体，而边则用来表示节点之间的关系，边的标签指明了关系的类型。语义网络中的语义主要体现在图中边的含义上，为了赋予这些边语义，研究人员先是提出了术语语言（Terminological
    Language），并最终提出了描述逻辑（Description Logic），描述逻辑是一阶谓词逻辑的一个子集，推理复杂度是可判定的（Decidable）。W3C
    采用了以描述逻辑为逻辑基础的本体网络语言（Ontology Web Language，OWL）作为定义 Web 术语的标准语言，还推出了另外一种用于表示 Web
    本体的语言 RDF Schema（简称 RDFS）。虽然描述逻辑以及 RDFS 的理论已经成熟，但是这些理论还没有很好地应用于知识图谱，目前缺乏针对知识图谱的一个逻辑表示语言。最近，基于向量的知识表示开始流行，这类表示将知识图谱三元组中的主谓宾表示成数值向量，通过向量的知识表示，可以采用统计或者神经网络的方法来进行推理，对知识图谱中的实体间的关系进行预测。知识图谱的向量表示主要考虑事实性（Factual）知识图谱的表示，而如何对模式（Schematic）知识图谱进行数值表示是一个难点。


    ### 7.6.2　并行知识推理

    基于符号的知识图谱推理一般是应用推理规则到知识图谱上，通过触发规则的前件来推导出新的实体关系，这里的推理规则可能是知识表示语言所有的，也可能是人工设定或者通过机器学习技术获取的。基于符号的推理虽然有能够提高推理效率的各种优化方法，但是还是跟不上数据增长的速度，特别是在数据规模大到目前基于内存的服务器无法处理的情况下。为了应对这一挑战，研究人员开始对描述逻辑和
    RDFS 的推理进行并行推进以提升推理的效率和可扩展性，并且取得了很多成果。


    并行推理工作所借助的并行技术分为单机环境下的多核、多处理器技术（多线程、GPU 技术等）和多机环境下基于网络通信的分布式技术（MapReduce 计算框架、Peer-To-Peer
    网络框架等）两大类技术。现有的并行推理方法主要集中在前向链推理，即应用推理规则到知识图谱中以生成新的三元组，所以对于动态知识图谱的推理处理效果不佳。另外，前向链推理会导致知识图谱存储大量冗余知识，也不利于高效的知识检索和查询。


    ### 7.6.3　实体关系知识推理

    实体关系知识推理的目的是通过统计方法或者神经网络方法，学习知识图谱中实体之间的关系。这方面的研究非常多，也是最近几年知识图谱的一个热门研究方向。实体关系知识推理可以分为基于表示学习的方法和基于图特征的方法两大类。


    基于表示学习的方法将知识图谱中的实体与关系统一映射至低维连续向量空间，以此来刻画它们的潜在语义特征。通过比较、匹配实体与关系的分布式表示，可以得到知识图谱中潜在成立的实体间的关系。此类方法灵活自由，通常具有较高的计算效率，但可解释性较差，对于困难的推理问题往往精度不足。如何提升这类方法的推理精度仍然是研究的热点与难点。


    基于图特征的方法利用从知识图谱中观察到的图特征来预测一条可能存在的边，代表性工作包括归纳逻辑程序设计、关联规则挖掘、路径排序算法等。此类方法在推理的同时能从知识图谱中自动挖掘推理规则，具备明确的推理机理。然而，图特征的提取效率较低，对于超大规模的知识图谱更是如此。提高效率是基于图特征的方法亟待突破的壁垒。


    ### 7.6.4　模式归纳知识推理

    模式归纳知识推理是从知识图谱中学习本体的模式层信息或丰富已有本体，包括对概念层次、属性层次、不相交公理、属性的值域与定义域和属性或概念的约束等公理的学习。知识图谱的迅猛增长为人们提供了日益丰富的相互关联的可用数据。但是，这些数据大都处于实例层，描述了个体及个体之间的关系，缺少用于约束个体的模式层信息，如概念层次、属性层次、不相交公理等。模式层信息的缺失，为知识图谱的整合、查询和维护等关键任务带来了重重困难。


    针对这些问题，研究人员提出了不少模式归纳的方法，基于知识图谱进行各种各样模式层公理的学习。这方面的主要研究大致分为基于归纳逻辑编程进行模式归纳的研究、基于关联规则挖掘进行模式归纳的研究，以及基于机器学习进行模式归纳的研究三大类。


    基于归纳逻辑编程进行模式归纳的研究方法结合了机器学习和逻辑编程技术，从实例和背景知识中获得逻辑结论，构建本体；基于关联规则挖掘进行模式归纳的研究方法先从知识图谱中收集所需信息，将其用事务表表示出来，再利用传统的关联规则挖掘方法找出规则，而这些规则往往可直接转换成本体中的公理；基于机器学习进行模式归纳的研究方法使用一些机器学习的方法，如贝叶斯网络和聚类，将本体学习转换成一个机器学习的问题，将知识图谱以采纳的学习模型进行表示、建模和推理，获得新的公理。


    知识图谱采用的是开放世界假设，而传统的关联规则挖掘或者机器学习采用的是封闭世界假设，如何应对不同世界假设的问题是研究者们不断努力的方向。另外，由于知识图谱的规模巨大，开发高效的、扩展性强的模式归纳算法也是一大难点。


    ## 7.7　知识图谱的应用

    知识图谱的应用场景很多，在不同行业、不同领域中都有广泛应用，知识图谱在商业领域的应用主要体现在语义搜索和问答系统两方面。


    ### 7.7.1　语义搜索

    与传统搜索技术不同，语义搜索是指搜索引擎的工作不再拘泥于用户所输入请求语句的字面本身，而是透过现象看本质，准确地捕捉到用户的真实意图，并依此来进行搜索，从而更准确地向用户返回最符合其需求的搜索结果。


    语义搜索的研究涉及多个领域，包括搜索引擎、语义网、数据挖掘和知识推理等。运用的主要方法有图论、匹配算法和逻辑（特别是描述逻辑、模糊逻辑等方法）。


    （1）图论：在语义网的技术框架中，RDF 是一个非常基础又非常重要的数据模型。通过 RDF 数据模型可将语义网中的本体组织为图结构，图中的弧和由节点及弧组成的路径中都包含着信息，因此在语义搜索中应用到了不同形式的图遍历方法，如实例扩展及查询的形式化方法等。


    （2）匹配算法：在语义搜索中需进行概念与关键字或者实例与关键字的匹配，关键字提供了一种快速定位信息的入口，而关键字和概念的匹配方法是语义搜索中重要的一环。


    （3）逻辑：描述逻辑、模糊逻辑等方法已经被整合到语义网框架中。描述逻辑是知识的一种形式化表示方法，作为本体语言的基础为人们所熟知。语义搜索的目的是准确地理解用户的输入，因此必须要使计算机具有逻辑推理能力，即如果用户输入为“小米
    Note 3 是 Note 2 的升级版吗？价格是多少？”，则计算机要确切理解“小米”“Note 2”“Note 3”代表的含义，并且理解“Note 2”和“Note
    3”之间的关系。


    Google Knowledge Graph、百度的百度知心等都是知识图谱在互联网语义搜索中的典型应用。例如，在百度百科中搜索“阿里巴巴”，搜索结果会显示“阿里巴巴是一个多义词”，并列出“中国电子商务公司”“小说《一千零一夜》中的人物”等多个义项。通过采用知识图谱，搜索引擎可以釆用基于实体的搜索来代替基于字符串的搜索，从而消除搜索中存在的歧义。


    Swoogle 和 TUCUXI 是两个典型的基于本体的语义搜索引擎。其中，Swoogle 从搜索返回结果的 Web 文档中提取出本体，并依据本体间的语义关联性确定出文档间的语义关系；TUCUXI
    则通过所获得的本体在 Web 上以特定规则爬行，并通过语义处理找出最符合要求的网页。目前已开发出许多建立于本体的语义搜索引擎，如 Congnition、Hakia、Factbites、DeepDyve、Kngine
    等。


    Swoogle 是由马里兰大学计算机科学和电气工程系在美国国家科学基金会和美国国防部下属高级研究计划署的资助下所建立的。与传统意义上的语义网搜索引擎不同，Swoogle
    在资源获取方面拥有一系列突出的解决方案，可自动发现语义网中 RDF 格式的文档，通过链接跟踪（Link-Following）技术和元搜索（Meta-Search）的方式识别出语义网文档，通过语义分析不断发现新的语义网文档，并可对其中的元数据建立相关索引提供高效率的查询服务，利用理性随机冲浪（Rational
    Random Surfing）模型提供高质量的排序结果。


    Swoogle 的核心功能有提取语义网中的实例数据；支持对语义网的浏览，提供语义网中文档的元数据；搜索语义网中的术语，如通过属性与类定义的 URIs 等；搜索提取语义网中的本体，并使用独有的算法提供高质量的排序结果；可存储各种类型的语义网文档。与通常的本体存储器或本体标注系统相比，Swoogle
    的最大不同在于能够鉴别出异源本体，且其具有语义网文档自动发现机制。


    TUCUXI（Intelligent Hunter Agent for Concept Understanding and LeXical ChaIning），是一个智能
    Web 搜索工具，它能对网络知识进行语义分析，并通过用户提供的输入信息来进行结构匹配。


    Congnition 目前可提供 3 个产品，分别是 Congnition Q&A、Medline Semantic Search 及 Wikipedia
    Semantic Search，涉及法律、医学与消费者信息等深度内容，是首个真正实现人机对话界面的语义搜索引擎。

    '
