    ### [4.1.4　神经网络的结构](../Text/contents.xhtml#z96)


    神经网络会将多个单一神经元连接在一起，将一个神经元的输出作为下一个神经元的输入，一个简单的神经网络模型如图4-2所示。


    ![](Images/cutq_76_35179_m.jpg)


    图4-2　一个简单的神经网络模型


    该神经网络中使用圆形来表示神经网络的单个神经节点，其中的“+1”节点是神经网络的偏置节点，也称作截距项。神经网络最左边的一层称为输入层，最右边的一层称为输出层，中间一层称为神经网络的隐藏层。隐藏层是由处于中间位置的所有神经节点组成的，因为不能在神经网络训练过程中直接观测到它们的值而得名，图4-2所示的神经网络包含3个输入节点（不包括偏置节点）、3个隐藏节点和1个输出节点。


    神经网络的结构大致可以分为以下5类。


    （1）前馈式网络：该网络结构是分层排列的，每一层的神经元输出只与下一层的神经元连接。


    （2）输出反馈的前馈式网络：该网络结构与前馈式网络的不同之处在于，其中存在着一个从输出层到输入层的反馈回路。


    （3）前馈式内层互连网络：在该网络结构中，同一层的神经元之间相互关联，它们有相互制约的关系。但从层与层之间的关系来看，它仍然是前馈式的网络结构，许多自组织神经网络大多具有这种结构。


    （4）反馈型全互连网络：在该网络结构中，每个神经元的输出都和其他神经元相连，从而形成了动态的反馈关系，该网络结构具有关于能量函数的自寻优能力。


    （5）反馈型局部互连网络：在该网络结构中，每个神经元只和其周围若干层的神经元发生互连关系，形成局部反馈，从整体上看是一种网状结构。


    ### [4.1.5　神经网络的学习](../Text/contents.xhtml#z97)


    神经网络的学习也称为训练，指的是通过神经网络所在环境的刺激作用调整神经网络的自由参数，使神经网络以一种新的方式对外部环境做出反应的一个过程。神经网络最大的特点是能够从环境中学习，以及在学习中提高自身性能。经过反复学习，神经网络对其环境会越来越了解。


    学习算法是指针对学习问题的明确规则集合。学习类型是由参数变化发生的形式决定的，不同的学习算法对神经元的权值调整的表达式有所不同。没有一种独特的学习算法可以用于设计所有的神经网络，选择或设计学习算法时，还需要考虑神经网络的结构及神经网络与外界环境相连的形式。


    对于神经网络的整个学习过程，首先是使用结构指定了网络中的变量和它们的拓扑关系。例如，神经网络中的变量可以是神经元连接的权重（Weights）和神经元的激励值（Activities
    of the Neurons）；其次是使用激励函数，大部分神经网络模型具有一个短时间尺度的动力学规则，用来定义神经元如何根据其他神经元的活动来改变自己的激励值，一般激励函数依赖于网络中的权重（即该网络的参数）；最后是训练学习规则（Learning
    Rule），学习规则指定了网络中的权重如何随着时间推进而调整，它被看作一种长时间尺度的动力学规则。一般情况下，学习规则依赖于神经元的激励值，它也可能依赖于监督者提供的目标值和当前权重的值。通过对神经网络结构的理解，使用激励函数进行训练，再加上最后的训练即可完成神经网络的整个学习。


    ### [4.1.6　激活函数](../Text/contents.xhtml#z98)


    激活函数（Activation Functions）对于人工神经网络模型以及卷积神经网络模型学习理解非常复杂和非线性的函数来说具有十分重要的作用。神经网络的输出是上一层输入的加权和，所以网络线性关系过于显著，属于线性模型，对于复杂问题的解决存在难度；但是当每个神经元都经过一个非线性函数时，输出就不再是线性的了，整个网络模型也就是非线性模型，如此一来，网络就能够解决比较复杂的问题，激活函数就是这个非线性函数。


    如果激活函数为线性的函数，那么线性方程组也仅有线性的表达能力，无论网络内部有多少层，最终只是相当于一个隐藏层，这样无法解决复杂问题，也就是无法用非线性来逼近任意函数。所以激活函数的非线性增加了神经网络模型的非线性，使得神经网络具有了更实际的意义。最初的激活函数会将输入值归化至某一区间内，因为当激活函数的输出值有限时，基于梯度下降的优化算法会更加稳定，但是随着优化算法的发展，激活函数也不断发展，目前激活函数已不仅仅是将输出值归化至某一区间内。


    常见的激活函数有Sigmoid、tanh和线性整流函数（Rectified Linear Unit，ReLU），下面对这3种激活函数进行简单介绍。


    1.Sigmoid函数


    Sigmoid激活函数公式定义如式4-3所示。


    ![](Images/cutq_78_20335_m.jpg)


    Sigmoid激活函数导数公式如式4-4所示。


    ![](Images/cutq_78_26836_m.jpg)


    Sigmoid激活函数的取值范围为(0,1)，求导非常容易，为反向传播中梯度下降法的计算提供了便利，因此Sigmoid函数在早期人工神经网络中十分受欢迎。但是现在Sigmoid函数很少被使用，主要是因为当Sigmoid函数的值为0或1的时候，其梯度几乎为0，因此，在反向传播时，这个局部梯度会与整个损失函数关于该单元输出的梯度相乘，结果也会接近于0，这样就无法对模型的参数进行更新。


