    ### Mask R-CNN

    Mask R-CNN 在 Faster R-CNN 中增加了并行的 Mask 分支，该分支是一个小全连接卷积网络，对每个候选区域生成一个像素级别的二进制掩码，该掩码的作用是对目标区域空间布局进行二进制编码。Mask
    R-CNN 扩展了 Faster R-CNN，适用于像素级分割，而不仅限于边界框，可实现对物体的细粒度分割。在 Fast R-CNN 中，使用 ROI 池化产生特定大小的特征图。经过
    ROI 池化层后，产生的特征图映射回原图的大小会产生错位，像素不能精准对齐。虽然在目标检测中给出的候选区域与原图有一些误差也不会对分类检测的结果产生很大影响，但是由于
    Mask 是像素级别的分割任务，这种错位会对分割结果产生很大的影响。因此需采用 ROI Align，即使用双线性插值来解决不能准确对齐像素点的问题。Mask
    R-CNN 有很大的灵活性，可以进行目标检测、目标分割等任务，并且可以应用到人体姿态评估上，但其实时性还不够理想。


    ### 6. YOLO

    YOLO 不同于以 R-CNN 为代表的两步检测算法，YOLO 的网络结构更为简单，且其速度是 Faster R-CNN 的 10 倍左右，可以满足目标检测对于实时性的要求。YOLO
    将待检测图像缩放到统一尺寸，并将图像分成相同大小的网格，如果一个目标的中心落在某网格单元中，那么这个网格就负责检测该目标的类别。YOLO 存在的问题是，它把图像划分成
    7×7 的网格进行分析，对小目标的检测率不高，而且每个网格最多只能检测一个类别的物体，当多个类别出现在一个网格中时，其检测效果不佳。


    ### 7. YOLO v2

    YOLO v2 对 YOLO 的网络结构进行了改进，其先加入了批量归一化，且在训练过程中采用了高分辨率图像，训练 448 像素×448 像素的高分辨率分类网络，再利用该网络训练检测网络。因为
    YOLO 利用单个网格完成边框的检测和位置回归，检测效果不佳，所以研究者借鉴了 Faster R-CNN 中的锚盒，尺寸由人工选择，但锚盒尺寸和个数通过聚类分析后才被确定。然而，研究者发现该模型在早期迭代时的收敛很不稳定，因此仍然采用
    YOLO 检测相对于网格坐标位置偏移量的方法。因为检测数据集样本的数量少，所以研究者提出用 WordTree 把上下文中的公共对象 Common Objects
    in Context，COCO 和 ImageNet 数据集进行联合训练得到 YOLO9000 网络的方法，以完成超过 9 000 种物体类别的检测。YOLO9000
    使用 ImageNet 分类数据集学习从大量的类别中进行物体分类，在 COCO 检测数据集上学习检测图像中的物体位置。


    ### 8. SSD

    YOLO 对小目标检测的准确率不高，SSD 是对 YOLO 进行改进的成果，它可以既保持检测准确率，又保证检测的速度。SSD 仍然采用 YOLO 中划分网格的方法，与
    YOLO 不同的是，SSD 对不同卷积层的特征图像进行了滑动窗口扫描，每层特征图中锚盒的大小和个数都不同。前面的卷积层中锚盒尺寸相对较小，适合检测小目标；后面的卷积层中锚盒尺寸相对较大，适合检测大目标。因此，SSD
    在一定程度上提升了小目标物体的检测精度。


    ## 5.4　图像分割

    图像分割是图像分析的第一步，是计算机视觉的基础，是图像理解的重要组成部分，也是图像处理中最困难的问题之一。


    ### 5.4.1　图像分割简介

    图像分割指利用图像的灰度、颜色、纹理、形状等特征，把图像分成若干个互不重叠的区域，并使这些特征在同一区域内呈现相似性，在不同的区域之间存在明显的差异性。此后，可以将分割的图像中具有独特性质的区域提取出来用于不同的研究。简单地说，图像分割就是在一幅图像中，把目标从背景中分离出来。对于灰度图像来说，区域内部的像素一般具有灰度相似性，而在区域的边界上一般具有灰度不连续性。


    图像分割其实可以看作把图像分成若干个无重叠的子区域的过程，即假设`R`是整个要分割的图像区域，将此区域分成`n`个区域`R[1]`，`R[2]`，`R[3]`，…，`R[n]`的过程就是图像分割。其中，`R[1]`，`R[2]`，`R[3]`，…，`R[n]`这些子区域需满足图像中任意一部分都要分割到某个子区域中、任意两个子区域不会重叠、子区域中的任意两个像素点能连通、所有子区域中的像素点都符合一种特点、任意相邻子区域中没有相同之处这
    5 个要求。图像分割示意图如图 5-6 所示。


    从 20 世纪 70 年代起，图像分割问题就吸引很多研究人员为之付出了巨大的努力。虽然到目前为止，还不存在一种通用的完美的图像分割的方法，但是对于图像分割的一般性规律基本上已经达成了共识，已经产生了相当多的研究成果和方法。


    ![](img/cutq_106_53160_l.jpg)


    图 5-6　图像分割示意图


    ### 5.4.2　图像分割算法

    目前，图像分割算法的数量已经达到上千种。随着对图像分割的更深层次研究和其他科学领域的发展，使用新理论的图像分割算法陆续出现，各种图像分割算法都有其不同理论基础，下面介绍
    4 种常见的图像分割算法。


    1.基于阈值的图像分割算法

    这种算法具有易于操作、功能稳定、计算简单高效等优点。其基本原理是根据图像的整体或部分信息选择阈值，依据灰度级别划分图像。如何选取合适的阈值是其中最重要的问题。由于该算法直接利用灰度值，因此计算方面十分简单高效。当图像中的目标与背景灰度差异大时，应使用全局阈值分割法；当图像灰度差异不大或多个目标的灰度相近时，应使用局部或动态阈值分割法。这种算法虽然简单高效，但是有其局限性：一方面，当图像中的灰度值差异不明显或灰度范围重叠时，可能出现过分割或欠分割的情况；另一方面，其不关心图像的空间特征和纹理特征，只考虑图像的灰度信息，抗噪性能差，导致在边界处的效果不符合预期，得到的分割效果比较差。


    2.基于边缘检测的图像分割算法

    这种算法的基本原理是通过检测边界来把图像分割成不同的部分。在一张图像中，不同区域的边缘通常是灰度值剧烈变化的地方，这种算法就是根据灰度突变来进行图像分割的。其按照执行顺序的差异可分为两种，即串行边缘分割法和并行边缘分割法。其重点是如何权衡检测时的抗噪性能和精度。若提高检测精度，则噪声引起的伪边缘会导致过分割；然而，若提高抗噪性能，则会使得轮廓处的结果精度不高。因此，在实际应用的时候，需要综合考虑检测精度与抗噪性能的相互作用并进行取舍，这是基于边缘检测的图像分割算法的关键部分。其优点是运算快，边缘定位准确；其缺点是抗噪性能差，因而在划分复杂图像时非常容易导致边缘不连续、边缘丢失或边缘模糊等问题，边缘的封闭性和连续性难以保证。


    3.基于区域的图像分割算法

    这种算法的基本原理是连通含有相似特点的像素点，最终组合成分割结果。其主要利用图像局部空间信息，能够很好地避免其他算法图像分割空间小的缺陷。其包括区域生长法以及区域分离与合并法。区域生长法会依据某种相似性标准，不停地把符合此标准的相邻像素点加入同一区域，最终得到目标区域。在分割过程中，种子点位置的选择非常重要，会直接影响分割结果的优劣。而区域分离与合并法会先将图像分割成很多一致性较强（如区域内像素灰度值相同）的小区域，再按一定的规则将小区域融合成大区域，达到分割图像的目的。


    4.基于神经网络的图像分割算法

    这种算法的基本原理是以样本图像数据来训练多层感知机，得到决策函数，进而用获得的决策函数对图像像素进行分类，得到分割的结果。根据具体方法所处理的数据类别的不同，可以分为基于图像像素数据的神经网络分割法和基于图像特征数据的神经网络分割法。因为前者使用高维度的原始图像作为训练数据，而后者利用图像特征信息，所以前者拥有更多能够使用的图像信息。前者需要对每个像素进行单独处理，由于数据量大且数据维度高，使得计算速度难以提高，用于处理实时数据时效果并不理想。总而言之，神经网络是由许多模拟生物神经的处理单元相互连接而成的结构，因为它有巨大的互连结构和分布式的处理单元，所以系统拥有很好的并行性和鲁棒性，且系统较为复杂，运算速度较慢。


    ## 5.5　小结

    （1）计算机视觉是从图像或视频中提出符号或数值信息，分析计算该信息以进行目标的识别、检测和跟踪等。

    （2）图像分类是根据不同类别的目标在图像信息中所反映的不同特征，将它们区分开来的图像处理方法。

    （3）目标检测的任务是在图像中找出所有感兴趣的目标（物体），并确定它们的位置和大小。

    （4）图像分割是利用图像的灰度、颜色、纹理、形状等特征，把图像分成若干个互不重叠的区域，并使这些特征在同一区域内呈现相似性，在不同的区域之间存在明显的差异性。


