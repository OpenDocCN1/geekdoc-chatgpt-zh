    ## [3.1 机器学习概述](../Text/contents.xhtml#z70)

    机器学习作为一门多领域交叉学科，主要的研究对象是人工智能，专门研究计算机怎样模拟或实现人类的学习行为，以获取新的知识或技能，重新组织已有的知识结构，使之不断改善自身的性能。机器学习是人工智能的核心，是使计算机具有智能的根本途径。


    ### [3.1.1 机器学习简介](../Text/contents.xhtml#z71)

    什么是机器学习？长期以来，其定义众多。1996年，帕特·兰利（Pat Langley）定义机器学习如下：“机器学习是一门人工智能科学，该领域的主要研究对象是人工智能，特别是如何在经验学习中改善具体算法的性能。”1997年，汤姆·米切尔（Tom
    Mitchell）在Machine Learning中写道：“机器学习是计算机算法的研究，并通过经验提高其自动进行改善。”2004年，埃塞姆·阿培丁（Ethem
    Alpaydin）提出自己对机器学习的定义：“机器学习是用数据或以往的经验，来优化计算机程序的性能标准。”机器学习的研究方法通常是根据生理学、认知科学等对人类学习机理的研究，建立模仿人类学习过程的计算模型或认识模型，发展各种学习理论和学习方法，研究通用的学习算法并进行理论上的分析，建立面向任务的具有特定应用的学习系统。


    机器学习是人工智能研究领域中最重要的分支之一。它是一门涉及多领域的交叉学科，包括高等数学、统计学、概率论、凸分析和逼近论等多门学科。机器学习的应用遍及人工智能的各个领域。机器学习主要使用归纳、综合而不是演绎的方法。


    机器学习，通俗地讲就是让机器拥有学习的能力，从而改善系统自身的性能。对于机器而言，这里的“学习”指的是从数据中学习，从数据中产生模型的算法，即学习算法。有了学习算法，只要把经验数据提供给它，它就能够基于这些数据产生模型，在面对新的情况时，模型能够提供相应的判断，进行预测。机器学习实质上是基于数据集的，它通过对数据集进行研究，找出数据集中数据之间的联系和数据的真实含义。机器学习原理如图3-1所示。


    ![](Images/cutq_47_37579_m.jpg)


    图3-1　机器学习原理


    ### [3.1.2 机器学习的发展](../Text/contents.xhtml#z72)

    机器学习的发展过程大体上可分为以下几个阶段。


    第一个阶段是从20世纪50年代中叶到20世纪60年代中叶，这一时期机器学习处于萌芽时期。人们试图通过软件编程来操控计算机完成一系列的逻辑推理功能，进而使计算机具有一定程度上的类似于人类的思考能力。然而，这一时期计算机所推理的结果远远没有达到人们对机器学习的期望。通过进一步研究发现，只具有逻辑推理能力并不能使机器拥有智能。研究者们认为，使机器拥有智能的前提，必须是拥有大量的先验知识。


    第二个阶段是从20世纪60年代中叶到20世纪80年代中叶，被称为机器学习冷静期。人们试图利用自身思维提取出来的规则教会计算机执行决策行为，主流之一便是各式各样的专家系统。然而，这些系统总会面临“知识稀疏”的问题，即面对无穷无尽的知识与信息，人们无法总结万无一失的规律，因此让机器学习的设想自然地浮出水面。基于20世纪50年代对于神经网络的研究，人们开始研究如何让机器自主学习。


    第三个阶段从20世纪80年代中叶开始，称为机器学习复兴期。由于这一时期互联网大数据及硬件GPU的出现，使得机器学习突破了瓶颈期。机器学习开始呈现爆发式的发展，成为一门独立的热门学科，并且被应用到各个领域中。各种机器学习算法不断涌现，而利用深层次神经网络的深度学习也得到了进一步发展。同时，机器学习的蓬勃发展促进了其他分支的诞生，如模式识别、数据挖掘、生物信息学和自动驾驶等。


    机器学习综合应用了心理学、生物学和神经生理学以及数学、自动化和计算机科学，并形成了机器学习理论基础，同时结合各种学习方法取长补短，形成了集成学习系统。此外，机器学习与人工智能各种基础问题的统一观点正在形成，各种学习方法的应用范围不断扩大，并出现了商业化的机器学习产品，还积极开展了大量与机器学习有关的学术活动。


    2010年以来，谷歌、微软等国际互联网巨头加快了对机器学习的研究，并尝到了机器学习商业化带来的甜头，我国很多知名的公司纷纷效仿。阿里巴巴、淘宝为应对大数据时代带来的挑战，已经在其公司的产品中大量应用机器学习算法。百度、搜狗等已拥有能与谷歌竞争的搜索引擎，其产品早已融合了机器学习知识。可以说，最近这些年正是机器学习的黄金时代。


    ### [3.1.3 机器学习的应用前景](../Text/contents.xhtml#z73)

    机器学习应用广泛，无论是在军事领域还是在民用领域，都有机器学习算法施展的机会。近年来，机器学习的研究与应用越来越受重视。机器学习已经广泛应用于语音识别、图像识别、数据挖掘等领域。大数据时代的到来，使机器学习有了新的应用领域，从设备维护、借贷申请、金融交易、医疗记录、广告点击、用户消费、客户网络行为等数据中发现有价值的信息已经成为其研究与应用的热点。


    #### 数据分析与挖掘

    “数据挖掘”和“数据分析”经常被同时提起，并在许多场合中被认为是可以相互替代的术语。关于数据挖掘和数据分析，现在已有多种文字不同但含义接近的定义，例如，数据挖掘是“识别出巨量数据中有效的、新颖的、潜在有用的、最终可理解的模式的过程”；数据分析则通常被定义为“指用适当的统计方法对收集来的大量第一手资料和第二手资料进行分析，以求最大化地开发数据资料的功能，发挥数据的作用，是为了提取有用信息和形成结论而对数据加以详细研究和概括总结的过程”。无论是数据分析还是数据挖掘，都是帮助人们收集数据、分析数据，使之成为信息，并做出判断，因此可以将这两项合称为“数据分析与挖掘”。


    数据分析与挖掘技术是机器学习算法和数据存取技术的结合，利用机器学习提供的统计分析、知识发现等手段分析海量数据，同时利用数据存取机制实现数据的高效读写。机器学习在数据分析与挖掘领域中拥有无可取代的地位，2012年的`Hadoop`进军机器学习领域就是一个很好的案例。


    #### 模式识别

    模式识别起源于工程领域，而机器学习起源于计算机科学，这两个不同学科的结合带来了模式识别领域的调整和发展。模式识别研究主要集中在两个方面：一是研究生物体（包括人）是如何感知对象的，属于认识科学的范畴；二是在给定的任务下，如何用计算机实现模式识别的理论和方法，这些是机器学习的长项，也是机器学习研究的内容之一。


    模式识别的应用领域广泛，包括计算机视觉、医学图像分析、光学文字识别、自然语言处理、语音识别、手写识别、生物特征识别、文件分类、搜索引擎等，而这些领域也正是机器学习大展身手的舞台，因此模式识别与机器学习的关系越来越密切，以至于很多书籍将模式识别与机器学习综合在一本书中讲述。


    #### 更广阔的领域

    研究和应用机器学习的最终目标是全面模仿人类大脑，创造出拥有人类智慧的机器大脑。2012年，谷歌在人工智能领域发布了一个划时代的产品——人脑模拟软件，这个软件具有自我学习功能，可以通过观看视频学习识别动物、人以及其他事物。它模拟了脑细胞的相互交流，当有数据被送达这个神经网络的时候，不同神经元之间的关系就会发生改变，这也使得神经网络能够得到对某些特定数据的反应机制。据悉，这个网络现在已经学到了一些东西，谷歌将有望在多个领域使用这一新技术，最先获益的可能是语音识别。


    与此同时，谷歌研制的自动驾驶汽车取得了突破性进展，于2012年5月获得了美国首个自动驾驶车辆许可证。自动驾驶汽车依靠人工智能、视觉计算、雷达、监控装置和全球定位系统协同合作，让计算机可以在没有任何人类主动操作的情况下，通过计算机自动安全地操作机动车辆。谷歌认为这将是一种“比人类更聪明的”汽车，不仅能预防交通事故，还能节省行驶时间、降低碳排放量。


    2013年，微软首席执行官高级顾问克雷格·蒙迪（Craig Mundie）在北京航空航天大学发表了“科技改变未来”的主题演讲，其在演讲中谈到了当今互联网科技的三大挑战：大数据、人工智能和人机互动。克雷格·蒙迪认为随着大数据时代的到来，人们的各种互动、设备、社交网络和传感器正在生成海量的数据，而机器学习可以更好地处理这些数据，挖掘其中的潜在价值。同时，其展示了微软研究院在机器学习方面的新产品——英语转汉语实时拟原声翻译，展现了微软在自然语言理解与处理方面的研究进展。


    ### [3.1.4 机器学习的未来](../Text/contents.xhtml#z74)

    目前，智能机器已经深入到人类的工作和生活中。在民用领域中，将会出现能从医疗记录中学习的智能机器，它们能分析和获取治疗新疾病最有效的方法；随着智能家居的发展，未来在分析住户的用电模式、居住习惯后，可以打造动态家居，从而降低能源消耗、提高居住舒适度；个人智能助理可以跟踪分析用户的职业和生活细节，协助用户高效完成工作，享受健康生活。未来，这些都将有智能机器的功劳。


    不久的将来，人类也许该思考：在未来的世界中，机器人将充当什么样的角色，会不会代替人类？人类与智能机器之间应该如何相处？


    ## [3.2 机器学习的分类](../Text/contents.xhtml#z75)

    机器学习的思想并不复杂，它仅仅是对人类生活、学习过程的一个模拟，而在这个过程中，最关键的就是数据。任何通过数据训练的学习算法的相关研究都属于机器学习，如线性回归（`Linear
    Regression`）、决策树（`Decision Trees`）、随机森林（`Random Forest`）等，由此可见机器学习的算法非常多，本节将介绍最常用的机器学习的分类。


    ### [3.2.1 监督学习](../Text/contents.xhtml#z76)

    监督学习是指利用一组已知类别的样本调整分类器的参数，使其达到所要求性能的过程，也称为监督训练或有教师学习。


    #### 监督学习概述

    监督学习是机器学习中的一种方法，可以由训练数据中学到或建立一个学习模型（Learning Model），并依此模型推测新的实例。训练数据是由输入物件（通常是向量）和预期输出所组成的。函数的输出可以是一个连续的值，该连续的值被称为回归分析，或者是预测的一个分类标签，该分类标签被称作分类。


    监督学习表示机器学习的数据是带标记的，这些标记可以包括数据类别、数据属性及特征点位置等。具体实现过程是通过大量带有标记的数据来训练机器，机器将预测结果与期望结果进行比对；之后根据比对结果来修改模型中的参数，再一次输出预测结果；再将预测结果与期望结果进行比对，重复多次直至收敛，最终生成具有一定鲁棒性的模型来达到智能决策的能力。常见的监督学习有分类（`Classification`）和回归（`Regression`），分类是将一些实例数据分到合适的类别中，其预测结果是离散的；回归是将数据归到一条“线”上，即为离散数据生产拟合曲线，因此其预测结果是连续的。


    图3-2所示为监督学习的数据集。例如，当要训练机器识别“狗”的图片时，需要先用大量狗的图片进行训练，再将预测结果与期望结果进行比对，从而判断该模型的好坏。


    ![](Images/image_50_0_m.jpg)


    图3-2　监督学习的数据集


    #### 监督学习的应用

    监督学习的应用非常广泛。例如，判断邮件是否为垃圾邮件时，首先用一些邮件及其标签（垃圾邮件或非垃圾邮件）建立训练模型，学习模型不断捕捉这些邮件与标签间的联系进行自我调整和完善，再发送给模型一些不带标签的新邮件，使该模型判断新邮件是否为垃圾邮件。


    ### [3.2.2 无监督学习](../Text/contents.xhtml#z77)

    现实生活中常常会遇到这样的问题：缺乏足够的先验知识，因此难以人工标注类别或进行人工类别标注的成本太高。很自然的，人们希望计算机能代替人工完成这些工作，或至少提供一些帮助。根据类别未知（没有被标记）的训练样本解决模式识别中的各种问题，称为无监督学习。


    #### 无监督学习概述

    无监督学习的训练样本的标记信息是未知的，目标是通过对无标记训练样本的学习来揭示数据的内在性质及规律。无监督学习表示机器从无标记的数据中探索并推断出潜在的联系。常见的无监督学习有聚类（`Clustering`）和降维（`Dimensionality
    Reduction`）两种。

