    # 内容提要


    本书主要讲述人工智能的基础知识与基础理论，并通过大量的人工智能应用帮助读者快速了解人工智能相关技术。本书共 10 章，分别为人工智能概述、人工智能基础知识、机器学习、深度学习、计算机视觉、自然语言处理、知识图谱、人工智能技术应用场景、智能机器人和人工智能的挑战与未来。本书内容丰富，讲解细致，注重技术发展变化。


    本书既可作为高校大数据专业、云计算专业、人工智能技术专业、信息管理专业、计算机网络专业的教材，又可作为人工智能与大数据爱好者的参考书。


    # 前言


    当今世界，全球数据量爆发式增长，大数据技术发展日新月异，对经济社会发展产生了非常深远的影响。以人工智能、大数据为代表的现代信息技术与人类生产生活高度融合。发展智能制造，抢占全球未来产业制高点，已成为各国共识。


    本书以“理论-实际应用”结合的方式深入地讲解了人工智能的基础知识和实现的基本技术，在内容设计上既有上课时教师的讲述部分，又有大量的典型案例，能够极大地激发学生在课堂上的学习积极性与主动创造性，让学生在课堂上跟上教师的思维，从而学到更多有用的知识和技能。


