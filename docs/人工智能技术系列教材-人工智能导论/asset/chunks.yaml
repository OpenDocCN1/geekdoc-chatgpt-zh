    ### 3.3.6 支持向量机


    `D[1]`和`D[2]`是`n`维欧氏空间中的两个点集。如果存在`n`维向量`w`和实数`b`，使得所有属于`D[1]`的点`x[1]`都有`wx[1]+b＞0`，所有属于`D[2]`的点`x[2]`都有`wx[2]+b＞0`，则称`D[1]`和`D[2]`线性可分。


    （2）从二维扩展到多维空间中时，将`D[1]`和`D[2]`完全正确地划分开的`wx+b＞0`即为一个超平面。


    （3）为了使这个超平面更具鲁棒性，需要寻找最佳超平面，即以最大间隔把两类样本分开的超平面，也称为最大间隔超平面。其特点是两类样本分别分割在该超平面的两侧，两侧距离超平面最近的样本点到超平面的距离被最大化了。


