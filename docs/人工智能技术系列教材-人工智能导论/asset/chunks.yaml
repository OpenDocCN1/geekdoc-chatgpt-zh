  trans: '


    计算机技术的不断进步和信息量的成倍增加，使人们对信息检索技术的要求越来越高，尤其是网络技术和多媒体技术的出现，促使信息检索技术不断发展。目前，信息检索技术正向两个方向发展：一是传统信息检索向全文文本、多媒体、多载体、多原理等新型信息检索发展；二是信息资源的网络化和分布化，向基于概念、超文本信息和多媒体信息检索技术发展。网络的发展给信息的获取提供了广阔的空间，而检索技术的发展为人们利用信息提供了更方便快捷的手段。


    ### 6.4.3　信息检索的特点

    信息检索主要有以下几个特点。

    （1）信息量大，信息形式多样，表现为分散性和无序性。

    （2）语言种类繁多。

    （3）具有更为广泛的应用领域。在网络环境下，信息检索系统所处理的文档范围覆盖了许多不同的学科、不同的应用领域、不同背景的用户，如何准确地标引和检索相关文档，以及提高用户的查询精度成为信息检索的主要任务之一。

    （4）信息发布具有较强的实时性，信息的更新速度较快。因此，信息检索系统不仅需要能够快速标引，还需要能够将相关信息实时提供给用户。

    （5）检索操作简便，界面友好，交互功能强，允许用户更多地参与信息检索，费用低。

    （6）检索速度快，原文可获得性高。


    ### 6.4.4　信息检索的基本原理

    信息检索的基本原理是指通过一定的方法和手段，有效地获得和利用信息。一般来说，在信息检索前需进行信息存储。

    信息的存储过程主要是按照检索语言（主题表或分类表）及其使用原则对原始信息进行处理，形成信息的特征标识，为信息检索提供经过整理有序的信息集合的过程。具体来说，信息的存储包括对信息的著录、标引及编排正文和辅助索引等。信息的著录是指按一定的规则对信息的外表和内容特征加以简单明确的表述；信息的标引是指对其内容按一定的分类表或主题词表给出分类号或主题词。信息的检索过程则是根据用户信息需求按照同样的主题词表或分类表及其所组配的原则分析，形成检索提问标识，根据检索系统提供的检索途径，从信息的集合中查找文献线索，最后对其进行逐篇筛选，确定所需信息的过程。这两个过程是密切联系，不可分割的。信息的存储是信息的检索的前提和基础，信息的检索是信息的存储的目的。


    ### 6.4.5　信息检索的类型

    信息检索按不同的标准可以划分为不同的类型，可以按检索的结果、文献数据的载体进行不同的分类。

    1.按照检索的结果分类

    （1）线索检索：这种检索的结果是有关文献的题录信息。其通常包括文献题名、著者、出处、文献内容提要等。检索者可按照题录信息提供的线索索取文献的原文。

    （2）全文检索：这种检索的结果是有关文献的全文信息。全文检索是将文献全文存储到数据库中，并建立与线索检索基本相同的检索途径，其在检索操作上与线索检索并无本质差异，但得到的检索结果是文献原文而不仅仅是其线索。这种数据库检索系统有中国知识基础设施（CNKI，即中国知网，见图
    6-1）、万方数据知识服务平台（见图 6-2）、重庆维普数据库、超星数字图书馆、读秀等。

    ![](img/image_121_0_m.jpg)

    图 6-1　CNKI

    ![](img/image_121_1_m.jpg)

    图 6-2　万方数据知识服务平台

    （3）多媒体检索：这种检索的结果是有关文献的全方位立体信息，如声音、图像、图形、文字等。与一般文本信息相比，多媒体信息具有直观、形象和内容丰富的特点。

    （4）超文本检索：这是一种新型的信息检索方式，是网络技术发展、普及的结果。与上述检索方式不同，它通过检索已经链接好的存储有文本等信息的节点来获取文献信息，是网络信息检索与浏览的主要手段。超文本检索一般采用搜索引擎来实现，如谷歌、百度、搜狗搜索等。

    2.按照文献数据的载体分类

    （1）光盘检索：这是一种利用光盘数据库检索文献的方式。其特点是光盘存储容量大，占据物理空间小，读取速度快，但只能在局域网中应用，用户数有限。另外，其对硬件有一定的要求，特别是随着光盘数据库更新量的加大，需增加光盘库或光盘塔，或增加服务器容量，硬件费用较高。

    （2）网络检索：这是一种利用网络数据库检索文献的方式。其特点是检索简单、灵活、速度快、链接方便，不受时间、地域范围的限制，在开放的信息环境中可实现跨地区、跨国界的检索。现在各种线索性或全文性的数据库均有网络版，检索者可通过网络进行有偿或无偿检索。网络检索已经发展成为现代文献检索的主要方式。


    ### 6.4.6　信息检索的应用

    近年来，信息检索技术飞速发展。一方面，网络中不同格式、不同形式、不同领域信息的日益增多使得信息检索的需求日益强烈；另一方面，新信息类型的出现使得针对这些信息的检索呈现出新的各不相同的要求。以下列举信息检索的代表性的应用。

    1.多媒体检索

    传统的信息检索研究主要针对文本对象。随着多媒体文档的日益增多，对多媒体检索的需求也越来越强烈。根据媒体对象的不同，多媒体检索又可以分成图像检索、视频检索、语音检索、音乐检索等不同类型，常见的有百度图片检索、百度视频检索、QQ
    音乐检索等。

    2.针对不同领域或不同场景的信息检索

    通常将不同于通用检索的系统称为“垂直检索”系统。所谓“垂直”可以理解为针对不同领域不同场景进行信息检索。“垂直检索”往往要求更高的数据质量，因此，其关键技术是从文档中分离出所需的信息。例如，针对人物的检索要求从文档中分析出人物的各种属性信息（如性别、年龄、工作等）；针对产品的检索要求得到产品的各种属性（如型号、价格、产地等）；针对不同领域的检索，如针对医学文献、生物文献、专利文献、法律文献等的检索。另外，新的网络事物的出现也会引发信息检索的需求，最典型的例子是近几年出现的微博检索。微博由于其和移动互联网的紧密结合而在最近几年蓬勃发展起来。微博检索是基于各大微博推出的一种实时检索，是对微博上的一些信息进行即时、快速检索，实现即搜即得的效果，页面会自动进行刷新，从而面对微博每天的海量信息，找到自己所需内容的一种工具。

    3.移动检索

    基于以手机为代表的移动设备普及率高，移动网络的覆盖率高、发展前景广，且手机和用户的紧密绑定等因素，无疑使移动检索具有重要的商业价值。和普通检索一样，移动检索同样要对信息进行获取、组织和提供访问。不同的是，目前移动检索研究的基本出发点是突破手机屏幕显示和输入的限制。由于手机屏幕尺寸的限制，一方面，要求返回的检索结果更精确，尽量过滤垃圾信息；另一方面，要求有限的屏幕空间下的结果布局更合理，显示更简洁，显示重点更突出，以便于用户进行进一步浏览操作。这需要综合排序算法、信息过滤、文本分析、摘要、人机交互等各种技术。另外，移动检索中除了文本检索之外，多媒体检索也是一个重要组成部分。

    4.基于检索的广告技术

    用户输入关键词进行检索，在检索结果中常常会出现可能与用户查询信息相关联的广告。在线广告是检索引擎公司巨大收益的主要来源，同时能给广告源商家带来利益，由此衍生了一个叫作计算广告学的新领域。检索引擎会根据用户的输入计算出用户意图，将合适的广告推送给用户。计算广告非常像信息检索，可以看作根据用户的输入在广告库这个集合中进行匹配，将最匹配的广告推送给用户。很显然，信息检索技术能在计算广告中发挥巨大作用，这也是计算广告在信息检索领域被广泛关注的主要原因。在排序时，计算广告要综合各种利益，例如，要同时考虑用户的体验、商家的利益以及商业上的限制等。

    5.个人信息管理及桌面检索

    个人信息管理已经成为一个非常重要而且迫切的需求，受到人们的广泛重视。个人信息管理主要研究个人信息的获取、组织、管理、维护和检索，其中用户比较熟悉的是桌面检索。近年来，桌面检索技术，即对用户硬盘中的数据进行检索，已成为检索引擎公司关注的焦点，很多公司开发了自己的桌面检索引擎，如
    Google 桌面检索、百度硬盘检索、360 桌面助手等。

    6.社会网络检索

    近年来，互联网越来越呈现出明显的社会化趋势，以新浪微博为代表的社交网络得到人们的广泛参与。这些新生的事物既促进了一些新的检索应用的出现，如微博检索等，又由于蕴含了大量社会网络信息，如用户信息、用户关系信息、用户行为信息、信息关联信息等，为其他应用提供了十分宝贵的数据。这些数据可以揭示背后隐藏的规律和深刻内涵，以进一步提高信息检索的效果。


    ## 6.5　机器翻译

    机器翻译旨在让计算机自动将源语言表示的语句转换为目标语言表示的语句，主要用于书面语翻译和口语翻译。尽管早期的机器翻译研究并不成功，但是随着自然语言理解的研究取得成功，20
    世纪 80 年代后，机器翻译的研究重新兴起，并逐步走向实用，现在已开始为普通用户提供实时、便捷的翻译服务，如百度翻译、微信聊天翻译等。


    ### 6.5.1　机器翻译的基本模式

    简单来说，机器翻译是由一个符号序列转换为另一个符号序列的过程，这种转换有 3 种基本模式，构成了机器翻译的金字塔，如图 6-3 所示。

    ![](img/cutq_123_22717_m.jpg)

    图 6-3　机器翻译的金字塔

    （1）直译式翻译（一步式）。直接将特定的源语言翻译成目标语言，翻译过程主要表现为源语言单元（主要是词）向目标语言单元的替换，对语言的分析很少。

    （2）中间语言式翻译（二步式）。先分析源语言，并将其转换为某种中间语言形式，再从中间语言出发，生成目标语言。

    （3）转换式翻译（三步式）。先分析源语言，形成某种形式的内部表示（如句法结构形式），再将源语言的内部表示转换为目标语言对应的内部表示，最后从目标语言的内部表示生成目标语言。

    这 3 种模式构成了机器翻译的金字塔。塔底对应于直译式，塔顶对应于中间语言式，为翻译的两个极端，中间不同层次统称为转换式。金字塔最下层的直译式主要基于词的翻译，在塔中，从直译式翻译到语义转换，每上升一层，其分析更深一层，向“理解”更逼近一步，翻译的质量也更进一层；越往上逼近，处理的难度和复杂度越大，出错以及错误传播的机会也随之增加，这可能影响翻译质量。

    根据知识获取方式的不同，可以将机器翻译分成基于人工规则的方法、基于实例的方法和基于统计模型的方法。

    （1）基于人工规则的方法。最典型的知识表示形式是规则，因此，基于规则的机器翻译也成为这类方法的代表。翻译规则包括源语言的分析规则，源语言的内部表示向目标语言内部表示的转换规则，以及目标语言的内部表示生成目标语言的规则。

    （2）基于实例的方法。先从实例库中寻找与待翻译的源语言单元最相似的例子，再对相应的目标语言单元进行调整。

    （3）基于统计模型的方法。统计翻译模型是利用实例训练模型参数，以参数服务于机器翻译。由于统计机器翻译本质上是带参数的机器学习，与语言本身没有关系，因此该模型适用于任意语言对，也可以方便地迁移到不同应用领域。翻译知识都是通过相同的训练方式对模型进行参数化，翻译以相同的解码算法去推理实现。


    ### 6.5.2　统计机器翻译

    统计机器翻译是目前主流的机器翻译方法，接下来介绍基于词的统计机器翻译和基于短语的统计机器翻译。

    1.基于词的统计机器翻译

    IBM 最早提出的 5 个翻译模型就是基于词的统计机器模型，其有 3 条基本思想：一是对于给定的大规模句子对齐的语料库，通过词语共现关系确定双语的词语对齐；二是一旦得到了大规模语料库中的词语对齐关系，就可以得到一张带概率的翻译词典；三是通过词语翻译概率和一些简单的词语调序概率，计算两个句子互为翻译的概率。

    IBM 模型通过利用给定的大规模语料库中的词语共现关系，自动计算出句子之间词语对齐的关系，而不需要利用任何外部知识（如词典、规则等），同时可以达到较高的准确率，这比单纯使用词典方法的正确率要高得多。这种方法的原理就是利用词语之间的共现关系。

    例如，“我睡了一整天”和“I slept all day”是互为翻译的。根据直觉，容易猜想“我”翻译成“I”，“睡了”翻译成“slept”，“一整天”翻译成“all
    day”。但是当有成千上万的句子对，每个句子都有几十个词的时候，依靠人的直觉就不够了。IBM 模型将人的这种直觉用数学公式定义出来，并给出了一种训练算法来实现。通过
    IBM 模型的训练，利用一个大规模双语语料库就可以得到一部带概率的翻译词典。

    基于词的统计翻译模型，其翻译的过程通常可以理解为一个搜索的过程，或者一个不断猜测的过程。这个过程大致如下：第一步，猜测译文的第一个词是源文的哪一个词翻译过来的；第二步，猜测译文的第二个词应该是什么；第三步，猜测译文的第二个词是源文的哪一个词翻译过来的；以此类推，直到所有源文词语都翻译完。在翻译的过程中，要反复使用翻译模型和语言模型来计算各种可能的候选译文的概率，以避免搜索的范围过大。

    IBM 模型可以较好地刻画词语之间的翻译概率，但由于没有采用任何句法结构和上下文信息，它对词语调序的能力非常弱。由于其在词语翻译的时候没有考虑上下文词语的搭配，因此经常会导致词语翻译的错误。

    尽管作为一种基于词的翻译模型，IBM 模型的性能已经被新的翻译模型所超越，但是作为一种大规模词语对齐的工具，IBM 模型仍然在统计机器翻译研究中广泛使用，而且几乎是不可或缺的。

    2.基于短语的统计机器翻译

    目前，基于短语的统计机器翻译模型已经趋于成熟，其性能已经远远超过了基于词的统计机器翻译模型。这种模型建立在词语对齐的语料库的基础上，其中词语对齐的工作仍然要依靠
    IBM 模型来实现。基于短语的统计机器翻译模型对于词语对齐的鲁棒性非常好，即使词语对齐的效果不太好，依然可以取得很好的翻译结果。

    基于短语的统计机器翻译模型的原理是在词语对齐的语料库中搜索并记录所有的互为翻译的双语短语，并在整个语料库中统计这种双语短语的概率。如图 6-4 所示，假设已经得到以下两个词语对齐的片段，翻译的时候，只要对被翻译的句子与短语库中的源语言短语进行匹配，找出概率最大的短语组合，并适当调整目标短语的语序即可。

    ![](img/cutq_125_31584_m.jpg)

    图 6-4　汉英片段对齐

    这种方法几乎就是一种机械的死记硬背的方法。基于短语的统计机器翻译模型的性能远远超过了已有的基于实例的机器翻译系统。


    ### 6.5.3　机器翻译的应用

    机器翻译较早就被广泛应用到了计算机辅助翻译软件上，以更好地辅助专业翻译人员提升翻译效率。随着机器翻译技术的快速发展，其逐渐走向了实用化，和更多其他的人工智能技术有效地结合起来，让人们看到了真正实现“巴别塔之梦”的希望。

    （1）翻译机

    从出国旅行，到国际文化交流，再到对外贸易，语言障碍是一个天然的痛点，于是许多商家如百度、讯飞等公司，结合文字识别技术和语音识别技术，推出了具有丰富实用功能的翻译机产品，如图
    6-5 所示。该类产品可以实时地通过摄像头的取景框来翻译外文景点指示牌、菜单、说明书和实物等；而结合语音技术的会话翻译，可以帮助实现不同语种的无障碍交流。

    ![](img/image_126_0_s.jpg)

    图 6-5　翻译机产品

    （2）语音同传技术

    同声传译广泛应用于国际会议等多语言交流的场景。搜狗等公司推出的语音同传技术开始在会议场景下出现，可以将演讲者的语音实时转换成文本，并能进行同步翻译，低延迟显示翻译结果，有望能够取代门槛较高的人工同传，实现不同语言间低成本的有效交流。

    （3）跨语言检索

    中文信息只占世界信息总量的 10%，面对逐年增加的跨语言检索需求，搜狗推出了海外搜索，它将机器翻译和信息检索技术进行了结合，不论用户输入中文还是英文，系统都会从海量优质的英文网页中选出用户想要的搜索结果，并应用国际领先的机器翻译技术自动对其进行翻译，为用户提供英文原文、中文译文、中英双语
    3 个页面的搜索结果。

    （4）助力翻译行业升级

    机器翻译加后期编辑是机器翻译和传统人工翻译相结合的产物。顾名思义，后期编辑是在机器翻译完之后，翻译人员对文本进行编辑，以提高翻译的准确性、清晰度和流畅性，由人工编辑将翻译的精细度提升至机器所不能达到的高度。机器翻译和传统翻译行业相结合，可以利用机器翻译提高传统翻译行业的效率，提升商业价值。


    ## 6.6　情感分析

    在信息时代，越来越多的人习惯在网络中抒发对一些人物和事物的情绪，表达不同的观点。特别是随着网络技术的不断发展，博客、微博、论坛公众号等新媒体平台的出现为网络用户提供了更宽阔的平台来交流信息、表达意见。这些线上的文本信息中不仅蕴含着用户的情感态度，还反映了社会集体的情感状态，这些情感在人们决策时发挥着重要作用。


    ### 6.6.1　情感分析概述

    在自然语言处理中，情感分析一般是指判断一段文本所表达的情感状态。与其他的人工智能技术相比，情感分析带有强烈的主观因素，而其他的领域一般是根据客观的数据来进行分析和预测。情感分析这项技术最早来源于
    2003 年日本两位学者关于商品评论研究的论文。随着微博等社交媒体以及电商平台的发展而产生了大量带有观点的内容，这些内容不仅给情感分析提供了广泛的数据基础，还成为商家识别用户对产品需求、喜好的重要信息来源，商家可据此来提高市场竞争力，同时，这些内容为其他用户提供了有效了解产品的渠道和反应产品质量的“晴雨表”。


    ### 6.6.2　情感分析的定义

    从自然语言处理的角度来看，情感分析的任务是从评论的文本中提取出评论的实体，以及评论者对该实体所表达的情感倾向和观点。自然语言处理的所有核心技术问题，如词法分析、信息提取、语义分析等都会在情感分析中用到。因此，情感分析被认为是一个自然语言处理的子任务，可以将人们对于某个实体目标的情感统一用一个五元组的格式来表示：（目标实体，实体的某一属性，评价的内容，发表评论的人，评论的时间）。

    如图 6-6 所示，目标实体为某餐厅，实体的某一属性为该餐厅的性价比，评价的内容是褒义的，发表评论的人为发表评论者本人，评论的时间为 2020 年 5 月
    8 日。这条评论的情感分析可以表示为五元组（某餐厅，性价比，正向褒义，评论者，2020 年 5 月 8 日）。

    ![](img/image_127_0_l.jpg)

    图 6-6　消费者用餐后的评论


    ### 6.6.3　情感分析的任务

    情感分析根据处理文本颗粒度的不同，大致可以分为 3 个级别的任务，分别是篇章级、句子级和属性级。

    1.篇章级情感分析

    篇章级情感分析的目标是判断整篇文本表达的是褒义还是贬义的情感，例如，对于一篇书评，或者对某时事新闻发表的评论，只要待分析的文本超过了一句话，即可视为篇章级的情感分析。


