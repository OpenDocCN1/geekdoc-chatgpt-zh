    #### (3) 多项式回归

    线性回归中使用的假设函数是一次方程，假设数据集呈简单线性关系，但实际情况中很多数据集是非线性的关系，直线方程无法很好地拟合数据的情况，此时可以尝试使用多项式回归。多项式回归中加入了特征的更高次方，就相当于增加了模型的自由度，用来捕获数据中非线性的变化。当然，添加高阶项的时候，也增加了模型的复杂度。随着模型复杂度的升高，模型的容量以及拟合数据的能力增加，可以进一步降低训练误差，但导致过拟合的风险随之增加。


    #### (4) 逐步回归

    逐步回归就是一步一步进行回归。我们知道多元回归中的元是指自变量，多元就是多个自变量，即多个x。而多个x中不一定每个x都对y有作用。这就需要对不起作用的x进行筛选，不将其加入到回归模型中。这个筛选的过程叫作变量选择。而自变量是否有用的判断依据就是对自变量进行显著性检验。具体方法是将一个自变量加入到模型中时，观察残差平方和是否显著减少。如果显著减少，则说明这个变量是有用的，可以将其加入到模型中；否则说明它是无用的，可以将其从模型中删除。


    #### (5) 岭回归

    线性回归的最主要问题是对异常值敏感。在真实世界的数据收集过程中，经常会遇到错误的度量结果。而线性回归使用的是普通最小二乘法，其目标是使平方误差最小化。由于异常值误差的绝对值很大，因此会破坏整个模型。此时就需要引入正则化项的系数作为阈值来消除异常的影响，这个方法称为岭回归。


    #### (6) 套索回归

    线性回归的另一种正则化叫作最小绝对收缩和选择算子回归（Least Absolute Shrinkage and Selection Operator Regression），简称`LASSO`回归或套索回归。与岭回归一样，它也是向成本函数增加一个正则项，但是它增加的是权重向量的`L1`范数，而不是`L2`范数的平方的一半。


    #### (7) 弹性回归

    岭回归的结果表明，它虽然在一定程度上可以拟合模型，但是容易导致回归结果失真；而套索回归虽然能刻画模型代表的现实情况，但是模型过于简单，不符合实际。弹性回归则一方面达到了岭回归对重要特征选择的目的，另一方面又像套索回归那样删除了对因变量影响较小的特征，取得了很好的效果。当多个特征和另一个特征相关的时候，弹性网络非常有用。套索回归倾向随机选择其中一个，而弹性回归倾向选择其中两个。


    ### 3. 回归算法的应用场景

    回归算法是机器学习中常用的数据统计方法之一，在科研、商业方面都有广泛的应用。通过回归算法可以确定许多领域中各个因素（数据）之间的关系，从而可以进行预测、分析数据。下面是3个典型的回归算法的应用场景。


    #### (1) 机场客流量分布预测

    为了有效利用机场资源，机场正利用大数据技术提升生产运营的效率。机场内需要不断提升运行效率的资源包括航站楼内的各类灯光设备、电梯、值机柜台、商铺、广告位、安检通道、登机口，以及航站楼外的停机位、廊桥、车辆（摆渡车、清洁车、物流车、能源车）。要想提升这些资源的利用率，首先需要知道未来一段时间将会有多少旅客或航班会使用这些资源，其次需要精准的调度系统来调配这些资源并安排服务人员，帮助机场提升资源利用效率，保障机场安全，提升服务质量。根据海量机场Wi-Fi数据及安检、登机、值机数据，可以通过回归算法实现机场航站楼客流分析与预测。


    #### (2) 新浪微博互动量预测

    新浪微博作为中国最大的社交媒体平台之一，旨在为用户发布的公开内容提供快速传播的通道，提升内容和用户的影响力。对于一条原创博文而言，转发、评论、点赞等互动行为能够体现出用户对于博文内容的兴趣程度，也是对博文进行分发控制的重要参考指标。根据抽样用户的原创博文在发表一天后的转发、评论、点赞总数，可以通过回归算法建立博文的互动模型，并预测用户后续博文在发表一天后的互动情况。


    #### (3) 青藏高原湖泊面积预测

    全球气候变化对青藏高原的湖泊水储量有很大影响，因此精确地估计青藏高原湖泊面积变化对于研究气候变化来说非常重要。海量多源异构数据和大数据处理与挖掘技术给湖泊面积变化研究带来了新的解决思路：可以通过多源数据对青藏高原的湖泊面积进行预测，将大数据技术应用到全球气候变化研究中。通过回归算法研究青藏高原湖泊面积变化的多种影响因素，可构建青藏高原湖泊面积预测模型。


    ## 3.3.2 聚类算法

    聚类就是将相似的事物聚集在一起，将不相似的事物划分到不同类别的过程，是数据挖掘中一种重要的方法。聚类算法的目标是将数据集合分成若干簇，使得同一簇内的数据点相似度尽可能大，而不同簇间的数据点相似度尽可能小。聚类能在未知模式识别问题中，从一堆没有标签的数据中找到其中的关联关系。


    ### 1. 聚类算法概述

    聚类技术是一种无监督学习，是研究样本或指标分类问题的一种统计分析方法。聚类与分类的区别是其要划分的类是未知的。常用的聚类分析方法有系统聚类法、有序样品聚类法、动态聚类法、模糊聚类法、图论聚类法和聚类预报法等。

    在进行聚类分析时，应注意以下几点。


    #### (1) 可伸缩性

    常规的聚类算法对于小数据集（如对象数小于200）的聚类效果较好，但对于包含几百万对象的大数据集聚类效果较差。例如，基于随机选择的聚类算法改进了大型应用中的聚类方法的聚类质量，拓展了数据处理量的伸缩范围，具有较好的聚类效果，但是它的计算效率较低，且对数据输入顺序敏感，只能聚类凸状或球形边界。


    #### (2) 处理不同类型属性的能力

    '
  trans: '


    在聚类工作中，由于事先不知道数据类别，因此只能通过分析数据样本在特征空间中的分布，如基于密度或基于统计学概率模型，从而将不同数据分开，把相似数据聚为一类。降维是将数据的维度降低，例如，描述一个榴莲，若只考虑榴莲的色泽、裂痕、大小、外形、气味以及刺头
    6 个属性，则这 6 个属性代表了榴莲对应数据的维度为 6。进一步考虑降维的工作，由于数据本身具有庞大的数量和各种属性特征，若对全部数据信息进行分析，则会增加数据训练的负担和存储空间。因此可以通过主成分分析等其他方法，考虑主要因素，舍弃次要因素，从而平衡数据分析的准确度与数据分析的效率。在实际应用中，可以通过一系列的转换将数据的维度降低，数据的降维过程如图
    3-3 所示。


    ![](img/cutq_51_51286_l.jpg)


    图 3-3　数据的降维过程


    ### 2. 无监督学习的应用

    无监督学习常常被用于数据挖掘，用于在大量无标签数据中寻找信息。它的训练数据是无标签的，训练目标是能对观察值进行分类或者区分等。例如，无监督学习应该能在不给出任何额外提示的情况下，仅依据所有“猫”的图片的特征，将“猫”的图片从海量的图片中区分出来。


    ### 3. 监督学习与无监督学习的区别

    （1）监督学习是一种目的明确的训练方式；而无监督学习是没有明确目的的训练方式。

    （2）监督学习需要给数据打标签；而无监督学习不需要给数据打标签。

    （3）监督学习由于目的明确，因此可以衡量效果；而无监督学习几乎无法衡量效果如何。


    ## 3.2.3 半监督学习

    机器学习的核心是从数据中学习，从数据出发得到未知规律，利用规律对未来样本进行预测和分析。基于数据的机器学习包括监督学习、无监督学习以及半监督学习。监督学习需要大量已标记类别的训练样本来保证其良好的性能；无监督学习不使用先验信息，利用无标签样本的特征分布规律，使得相似样本聚到一起，但模型准确性难以保证。

    随着大数据的发展，数据库中的数据呈现指数增长，获取大量无标记样本相当容易，而获取大量有标记样本则困难得多，且人工标注需要耗费大量的人力和物力。如果只使用少量的有标记样本进行训练，往往导致学习的泛化性能低下，且浪费大量的无标记样本数据资源。因此，使用少量标记样本作为指导，利用大量无标记样本改善学习性能的半监督学习成为研究的热点。

    “半监督学习”于 1992 年被正式提出，其思想可追溯到自训练算法。半监督学习突破了传统方法只考虑一种样本类型的局限性，综合利用有标签与无标签样本，是在监督学习和无监督学习的基础上进行的研究。半监督学习包括半监督聚类、半监督分类、半监督降维和半监督回归
    4 种学习场景。常见的半监督分类代表算法包括生成式方法、半监督支持向量机（Semi-supervised Support Vector Machines，`S3VMs`）、基于图的半监督图方法和基于分歧的半监督方法共
    4 种算法。

    生成式方法的关键在于对来自各个种类的样本分布进行假设，以及对所假设模型的参数进行估计。常见的假设模型有混合高斯模型、混合专家模型、朴素贝叶斯模型，采用极大似然方法作为参数估计的优化目标，选择最大期望（Expectation-Maximization，`EM`）算法进行参数的优化求解。

    半监督支持向量机的思想最早可以追溯至弗拉基米尔·瓦普尼克（Vladimir Vapnik）提出的猜想，无标记数据可以有效地减少函数空间的支持向量维度。常见的`S3VMs`方法有直推式支持向量机（Transductive
    Support Vector Machine，`TSVM`）、拉普拉斯支持向量机（Laplacian Support Vector Machine，`Laplacian
    SVM`）、均值标签半监督支持向量机（Mean Semi-supervised Support Vector Machine，`MeanS3VM`）、安全半监督支持向量机（Safe
    Semi-supervised SVM，`S4VM`）、基于代价敏感的半监督支持向量机（Cost-sensitive Semi-supervised SVM，`CS4VM`）。

    基于图的半监督方法是利用有标签和无标签样本之间的联系得到图结构，利用图结构进行标签传播。典型的基于图的半监督方法有标签传播算法、最小割算法以及流形正则化算法。

    基于分歧的半监督学习起源于协同训练算法，其思想是利用多个学习模型之间的差异性提高泛化能力。根据视图个数的不同，其分为多视图和单视图下基于分歧的半监督学习。


    ## 3.2.4 迁移学习

    迁移学习是运用已存有的知识对不同但相关领域的问题进行求解的一种新的机器学习方法。迁移学习放宽了传统机器学习中的两个基本假设，目的是迁移已有的知识来解决目标领域中仅有少量甚至没有标签样本数据的学习问题。迁移学习广泛存在于人类的活动中，两个不同的领域共享的因素越多，迁移学习就越容易，否则就越困难，甚至出现“负迁移”的情况。例如，一个人要是学会了骑自行车，则很容易学会开摩托车，这就是迁移学习；而已经学会骑自行车的人再学习三轮车反而会不适应，因为这两种车型的重心位置不同，这就是“负迁移”。

    按照迁移学习方法采用的技术划分，可以把迁移学习方法分为 3 类：基于特征选择的迁移学习、基于特征映射的迁移学习和基于权重的迁移学习。

    根据源领域和目标领域中是否有标签样本，可将迁移学习方法划分为 3 类：目标领域中有少量标注样本的归纳迁移学习（Inductive Transfer Learning）、只有源领域中有标签样本的直推式迁移学习（Transductive
    Transfer Learning）、源领域和目标领域都没有标签样本的无监督迁移学习。另外，还可以根据源领域中是否有标签样本，把归纳迁移学习方法分为 2 类：多任务迁移学习和自学习。

    迁移学习是和传统学习相对应的一大类学习方式，传统学习是处理源领域和目标领域相同，且源领域和目标领域的任务也相同的学习，而迁移学习处理除此情形之外的学习，包括源领域和目标领域的任务相关但不同的归纳迁移学习。


    ## 3.2.5 强化学习

    强化学习（Reinforcement Learning，`RL`）又称再励学习、评价学习或增强学习，是机器学习的范式和方法论之一，用于描述和解决智能体在与环境的交互过程中，通过学习策略以达成回报最大化或实现特定目标的问题。


    ### 1. 强化学习概述

    强化学习主要包括智能体、环境状态、奖励和动作 4 个元素以及一个状态。例如，作为一个决策者有学习和打游戏这两个动作，当决策者去打游戏时就会导致学习成绩下降，学习成绩就是决策者的状态，决策者的父母看到决策者的学习成绩会对决策者进行相应的奖励和惩罚。所以经过一定次数的迭代，决策者就会知道在什么样的成绩下选择什么样的动作能够得到最高的奖励，这就是强化学习的主要思想。图
    3-4 所示为强化学习的模型。


    ![](img/cutq_53_4657_m.jpg)


    图 3-4　强化学习的模型

    强化学习是带有激励机制的，即如果机器行动正确，则施予一定的“正激励”；如果机器行动错误，则会给出一定的惩罚，也可称为“负激励”。在这种情况下，机器将会考虑在一个环境中如何行动才能达到激励的最大化，具有一定的动态规划思想。例如，在贪吃蛇游戏中，贪吃蛇需要通过不断吃到“食物”来加分。为了不断提高分数，贪吃蛇需要考虑在自身位置上如何转向才能吃到“食物”，这种学习过程便可理解为一种强化学习。


    ### 2. 强化学习的应用

    强化学习通常被用在机器人技术（如机械狗）上，它接收机器人的当前状态，算法的目标是训练机器做出各种特定行为。其工作流程一般如下：机器被放置在一个特定环境中，在这个环境中，机器可以持续性地进行自我训练，而环境会给出或正或负的反馈。机器会从以往的行动经验中得到提升，并最终找到最适合的知识来帮助它做出最有效的行为决策。

    强化学习最为火热和被大众熟知的应用是谷歌 AlphaGo 的升级产品——AlphaGo Zero。相较于 AlphaGo，AlphaGo Zero 舍弃了先验知识，不再需要人为设计特征，直接将棋盘上黑、白棋子的摆放情况作为原始数据输入到模型中，使用强化学习来自我博弈，不断提升自己从而最终出色完成下棋任务。AlphaGo
    Zero 的成功，证明了在没有人类经验的指导下，强化学习依然能够出色地完成指定任务。

    传统深度学习已经能很好地解决机器的感知和识别问题，但人类对机器智能的要求显然不止于此，能够应对复杂现实中决策型问题的强化学习，以及二者的融合，自然成为人工智能应用未来的重点发展方向。


    # 3.3 机器学习常用算法

    机器学习算法的研究起步于 20 世纪 50 年代，经过不断发展，其种类已颇为繁多，然而，经得起实践和时间考验的经典机器学习算法数量很有限。机器学习算法的理论基础知识繁多，如概率统计、集合论、空间几何、图论、矩阵论等，本节将去除机器学习常用算法由于结构细化和公式展开所带来的复杂感，揭开机器学习算法的神秘面纱，使算法的整体轮廓和原理得以更清晰地呈现。本节将介绍常用的回归算法、聚类算法、降维算法、决策树算法、贝叶斯算法、支持向量机（Support
    Vector Machine，`SVM`）算法、关联规则算法、遗传算法（Genetic Algorithm，`GA`）等机器学习算法。


    ## 3.3.1 回归算法

    回归算法是一种应用极为广泛的数量分析方法。该算法用于分析事物之间的统计关系，侧重考察变量之间的数量变化规律，并通过回归方程的形式描述和反映这种关系，以帮助人们准确把握变量受其他一个或多个变量影响的程度，进而为预测提供科学依据。


    ### 1. 回归算法概述

    回归算法是处理多变量间相关关系的一种数学方法。相关关系不同于函数关系，后者反映了变量间的严格依存性，而前者则表现出一定程度的波动性或随机性，对自变量的每一个取值，因变量可以有多个数值与之相对应。在统计上，研究相关关系可以运用回归分析和相关分析。在大数据分析中，回归分析是一种预测性的建模技术，其研究内容是因变量（目标）和自变量（预测器）之间的关系，这种技术通常用于预测分析、时间序列模型以及发现变量之间的因果关系。

    当自变量为非随机变量而因变量为随机变量时，它们的关系分析称为回归分析；当两者都是随机变量时，它们的关系分析称为相关分析。根据回归分析建立的变量间的数学表达式称为回归方程。回归方程反映在自变量固定的条件下，因变量的平均状态变化情况。相关分析是以某一指标来度量回归方程所描述的各个变量间关系的密切程度。相关分析常用回归分析来补充，两者相辅相成，若通过相关分析显示出变量间关系非常密切，则通过所建立的回归方程可获得相当准确的取值。

    通过回归分析，可以建立变量间的数学表达式。利用概率统计基础知识进行分析，可以判断所建立的经验公式的有效性。进行因素分析时，可以确定影响某一变量的若干变量（因素）中何者为主要，何者为次要，以及它们之间的关系。具有相关关系的变量之间虽然具有某种不确定性，但是通过对现象的不断观察，可以发现它们之间的统计规律等各种可用回归分析方式解决的问题。回归分析会先确定要进行预测的因变量，再集中说明变量，进行多元回归分析。多元回归分析将给出因变量与说明变量之间的关系，这一关系最后以公式（模型）形式给出，通过它可以预测因变量的未来值。


    ### 2. 回归算法的分类

    回归算法可以分为线性回归（`Linear Regression`）、逻辑回归（`Logistic Regression`）、多项式回归（`Polynomial
    Regression`）、逐步回归（`Step-wise Regression`）、岭回归（`Ridge Regression`）、套索回归（`Lasso
    Regression`）和弹性回归（`Elastic Net Regression`）等。


    #### (1) 线性回归

    线性回归就是将输入项分别乘以一些常量，再将结果相加得到输出。线性回归包括一元线性回归和多元线性回归。线性回归分析中如果仅有一个自变量与一个因变量，且其关系大致上可用一条直线表示，则称之为简单线性回归分析。多元线性回归分析是简单线性回归分析的推广，指的是多个因变量对多个自变量的回归分析，其中最常用的是只限于一个因变量但有多个自变量的情况，也称多重回归分析。对于线性回归问题，样本点落在空间中的一条直线上或该直线的附近，因此可以使用一个线性函数表示自变量和因变量间的对应关系。

    定义线性方程组`Xw=y`，在线性回归问题中，`X`是样本数据矩阵，`y`是期望值向量。也就是说，对于线性回归问题，`X`和`y`是已知的，要解决的问题是，求取一个最合适的向量`w`，使得线性方程组能够尽可能地满足样本点的线性分布。之后即可利用求得的`w`对新的数据点进行预测。

    线性回归示意图如图 3-5 所示。


    #### (2) 逻辑回归

    逻辑回归用于处理因变量为分类变量的回归问题，常见的是二分类或二项分布问题，也可以处理多分类问题。它实际上是一种分类方法，如判断一封邮件是否为垃圾邮件。逻辑回归一般是提供样本和已知模型，求回归参数。逻辑回归先将任意输入映射到了`[0,1]`区间，在线性回归中可以得到一个预测值，再将该值映射到`Sigmoid`函数中，这样就由求值问题转换成了求概率问题。

    逻辑回归示意图如图 3-6 所示。


