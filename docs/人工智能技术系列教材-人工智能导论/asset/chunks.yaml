    # 第 8 章　人工智能技术应用场景


    【本章导读】


    近年来，人工智能的发展极为迅猛，正在多维度地影响人们的生活。本章主要介绍人工智能技术在智慧交通、智慧电商、智能医学、智能制造场景的应用。


    【本章要点】


    1 智慧交通

    2 智慧电商

    3 智能医学

    4 智能制造


    ## 8.1　智慧交通


    时代的进步以及科技的不断发展，使人们的日常生活发生了巨大的变化。大数据技术和人工智能技术的广泛应用让生活变得更加方便快捷，而以此为基础创建的智慧交通管理模式，能够使我国目前的交通拥堵问题得到有效的解决，使我国的交通领域实现规范发展，提高交通方面的管理效率。


    ### 8.1.1　智慧交通的概念


    近年来，人工智能的发展极为迅猛，正在多维度地影响人们的生活。与人们生活息息相关的交通行业，同样需要用新的思维、理念进行探索创新。这就为人工智能在交通领域的运用奠定了基础。


    智慧交通指在智能交通的基础上，融入物联网、云计算、大数据、移动互连等技术，汇集交通信息，提供实时交通数据下的交通信息服务。智慧交通是未来交通系统的发展方向，它是将先进的信息技术、数据通信传输技术、电子传感技术、控制技术及计算机技术等有效地集成运用于整个地面交通管理系统，建立的一种大范围、全方位发挥作用的，且实时、准确、高效的综合交通运输管理系统。在人工智能的发展与应用下，未来的交通是车路协同的交通，由智能的路和智能的车构成；未来的交通信号系统将成为以信号为核心的类脑城市交通计算中心，各交通参与单元都将具备自主思维。


    交通是由人、车及环境等综合因素构成的，人工智能的加入可以让交通变得更加智慧。目前，人工智能对智慧交通的影响主要有以下几点。


    （1）采用人工智能技术，如异常检测、图像识别、视频分析等技术，可以提高交通管理机构的监控能力和准确度，从而避免一些交通安全事故的发生，同时能够规范交通驾驶行为，促进交通文明。

    （2）利用人工智能技术可以实时对全城、区域、商圈等的交通路况（拥堵、事故等行为）进行分析，通过对历史数据的深度挖掘和理解，按年、月、日等形式形成多维度的综合交通管理应急指挥预案，进而提高交通效率。

    （3）人工智能算法可以根据城市民众的出行偏好、生活、消费习惯等方式，分析出城市人流、车流的迁移与城市建设及公众资源的数据。基于这些大数据的分析结果，可以帮助政府决策部门进行城市规划，特别是为公共交通设施的基础建设提供指导和借鉴。


    此外，人工智能可以将各个方面的资源联系在一起，通过大数据平台的辅助，智能地调度资源，减少资源错配，减少各类交通空载率，减少汽车数量，从而达到环境保护和节约能源的目的。


    ### 8.1.2　智慧交通中的人工智能应用


    目前，人工智能技术在智慧交通中的应用较多，如自动驾驶汽车、智慧交通管理以及无人驾驶飞机等，下面对它们分别进行介绍。


    #### 1.自动驾驶汽车


    自动驾驶汽车又称无人驾驶汽车、计算机驾驶汽车或轮式移动机器人，是一种通过计算机系统实现无人驾驶的智能汽车。它依靠人工智能、视觉计算、雷达、监控装置和全球定位系统协同合作，让计算机可以在没有任何人类主动操作的情况下，自动安全地操作机动车辆。人工智能技术突破性的应用之一就是自动驾驶汽车。自动驾驶汽车曾经只是科学幻想中的一个概念，现在已经成为现实。虽然人们在发展阶段对这项技术持怀疑态度，但是目前无人驾驶车辆已经在交通运输领域得到了应用。谷歌自动驾驶汽车已于
    2012 年 5 月获得了美国首个自动驾驶车辆许可证，图 8-1 所示为谷歌的自动驾驶汽车。


    ![](img/image_164_0_l.jpg)


    图 8-1　谷歌的自动驾驶汽车


    #### 2.智慧交通管理


    人们每天都要面对的一个交通问题是交通拥挤，很多公司希望采用人工智能技术解决这个问题。目前，公路上无处不在的传感器和摄像头收集了大量的交通细节，这些数据会被发送到云端，使用大数据和人工智能驱动的系统进行分析和流量模式启示，人们可以从数据处理中收集有关流量预测等有价值的见解，并为通勤者提供交通预测、事故或道路堵塞等重要细节。此外，根据这些收集而来的大量数据可以帮助人们分析到达目的地的最短路线，从而帮助他们避开交通拥堵的情况。这样，人工智能不仅可以帮助人们减少不必要的交通流量，还可以帮助人们提高道路安全性，减少大量等待时间。


    #### 3.无人驾驶飞机


    目前，非常令人兴奋的人工智能应用之一就是无人驾驶飞机。无人驾驶飞机的应用可以极大程度地消除碳排放，消除交通拥堵，并减少对昂贵基础设施建设计划的需求。此外，无人驾驶飞机将帮助人们更快地到达目的地，最大限度地缩短他们的通勤时间。此外，不断增长的人口使城市规划者承受着巨大的压力，需要在不影响资源的情况下确保城市规划的智能化和基础设施的建设，而无人驾驶飞机的大量应用可以为智能出行提供参考思路。图
    8-2 所示为无人驾驶飞机。


    ![](img/image_165_0_m.jpg)


    图 8-2　无人驾驶飞机


    ### 8.1.3　智慧交通中的核心技术


    智慧交通中的核心技术主要包括人工智能识别技术、无线传感网络技术、云计算技术、大数据处理技术以及智能控制系统等。


    #### 1.人工智能识别技术和无线传感网络技术


    人工智能识别技术和无线传感网络技术是物体感知和标识的主要方式，同时是建设智慧交通的核心技术。


    物品中带有独有的二维码或者条形码等能够代表其身份的识别标签，其中记载着独有的位置信息和特征，通过人工智能设备能够对这些信息进行准确识别，随后将读取出来的信息上传到控制系统中心，进行分析与决策，这就是人工智能识别技术。


    无线传感网络技术主要是在监控目标区域中设置大量微型传感器，并由其组成全面的监控网络，各个节点之间主要通过无线网络进行信息交流，其突出优势为部署方便、成本运行低、布置灵活等。智慧交通中的传感器主要包括汇聚节点和采集节点，每一个单独的采集节点实际上都是一种小型的信息处理系统，能够自动收集并负责区域内的数据信息，随后将收集上来的各种信息统一传送到其他的节点，或是传送到节点汇聚中心，汇聚节点再将综合信息发送到处理中心进行统一处理。


    #### 2.云计算技术


    '
  toc: []
- raw: '智慧交通系统中的各个模块目前还处于一种单独作战、信息分离的状态，无法促进各种数据信息之间的有效连接，导致数据浪费现象较为严重。智慧交通云就是以交通服务领域为主要目标的一种融合云计算的管理技术，它具有云计算中的资源统一分析、信息安全与海量信息存储等优势，从而为城市交通的数据管理和共享提供了有效的渠道。云计算实际上就是指在网络中集中大量高速计算机，形成一种大型的虚拟资源管理场所，能够为远程网络终端用户提供存储与分析计算的服务，用户可以租用服务商提供的云计算服务，而不用另外购买各种独立硬件。和云计算十分相似，智能交通中的云服务同样可以分为软件服务、平台服务和基础设施服务等3部分。此外，云处理平台是智慧交通主要的研究方向，它能够对海量数据进行分析、计算和存储预处理等操作，从而降低数据实时存储的压力，提高开发潜力。


    3.大数据处理技术


    智慧交通中的数据信息具有异构性、多样性和海量性等特征，增加了数据信息的处理难度。从简单的对来往车辆、各种交通设施的数据收集，到复杂的在交通事件中进行检测、判断等，都离不开数据的处理。智慧交通中较为常见的数据处理技术包括数据可视化、数据活化、数据挖掘、数据融合等。此外，还应该对数据进行选择性上传，从而维护好个人隐私。数据融合也涉及决策、通信以及人工智能等多个领域的数据处理技术，可以从决策层、特征层和数据层3种角度出发，全面探测多源信息。数据融合这一过程会涉及大量的传感器和信息获取工作，因此在正式进行融合工作之前，还应该对相关数据空间和数据时间进行预处理，通过校准时空能够有效避免数据管理混乱的状况，以提高数据可靠性和一致性。


    4.智能控制系统


    现代城市发展过程中的一大问题就是交通拥堵，要彻底解决城市发展中的这一顽疾，就需要以人工智能技术为支撑，建造城市中的智慧交通系统，从源头入手，彻底解决城市拥挤的问题。智能控制系统中包括即时反馈、集中指挥、云端处理和信息采集等几个重要的组成部分。城市中的出租车司机、城市交警以及视频监控系统等是主要的信息采集源，将所收集到的信息数据及时传送到城市指挥中心中，随后由相关计算机系统对大数据进行集中分析，并制定出城市交通的优化方案，将其反馈到相关管理人员和交通设施当中，从而对城市交通进行智能控制。例如，对于城市交通中的重要组成因素红绿灯系统，传统的运行模式是根据固定的时间进行变化，容易导致某一方向出现严重压车等问题。但是在智慧交通系统的管理下，智能控制系统能够结合收集到的车辆速度、数量以及分布密度等因素，对相同方向的路段进行智能分析，随后结合相应的分析结果，科学调控红绿灯的转换，能够有效降低车辆的等待时间。此外，智能控制系统中包括智能警示系统，通过智能警示系统，能够进一步提高公众的文明出行观念，对于城市交通中翻越护栏、车辆逆行、闯红灯以及违反导向行驶等违法行为进行有效的警戒。在人脸识别和车牌号识别等人工智能识别技术的基础上，利用公安机构中的相关信息系统能够对违法人员进行准确定位，从而将具体的警示信息传送到违法人员的手机当中，或是利用城市中的公共显示屏幕来曝光具体的违法人员，追究其法律责任。


    综上所述，智慧交通是一种比较复杂的管理系统，涉及各方面的内容，需要多种系统和行业部门之间的有效配合。想要建设成智慧交通系统，就应该以先进的科技为基础，在政府部门的带领下，打造智慧交通，形成一种高效的管理机制，发挥出城市管理者的重要作用，促进交通领域的健康发展。


    ## [8.2　智慧电商](../Text/contents.xhtml#z207)


    近十年来，电子商务发展迅速，为消费者的生活带来了种种便利。消费者在享受着这种便利的同时，也对其服务质量提出了更高的要求。为了顺应消费者的需求，各大电商平台不断寻求创新，以优化运营效率，提升服务品质。人工智能技术的进步，为电子商务的发展打开了新的思路和格局，它在电商行业的价值体现将是全方位的。


    ### [8.2.1　智慧电商的概念](../Text/contents.xhtml#z208)


    电子商务是一种现代商务活动，最早由IBM公司提出，指利用网络开展的电子交易活动。随着智能硬件和人工智能技术的发展，全球电子商务行业迅猛发展，产业规模迅速扩大，智慧电子商务也随之产生。


    智慧电子商务简称智慧电商，它可以利用网络技术、信息安全等先进手段，打造电商云环境，并将电商实体、消费市场、交易事务、信息流、资金流、物流等基本要素整合起来，从而实现金融、保险、物流等商业应用的实时感知、动态信息发布以及智能商务管理等功能，最终提升电商管理水平。


    ### [8.2.2　智慧电商中的人工智能应用](../Text/contents.xhtml#z209)


    随着人工智能技术的引入，电子商务正在以前所未有的速度蓬勃发展。电子商务行业以一种新的形式，给消费者带来了新的体验水平，应用人工智能可以改善各种流程、客户体验，并最终提高收益。


    1.智能客服机器人


    智能客服机器人是指在售前咨询、产品服务、售后维护、投诉管理等客服工作中使用了人工智能技术的智能客服系统。企业使用智能客服机器人能够实现访客分流、自动回复、智能辅助人工、智能监控和智能质检等，使客服工作的各个环节实现自动化和智能化，从而降低人工客服成本、提升客户服务质量。


    例如，使用智能客服机器人可以提高客服接待效率，在功能上主要表现为引导客户自助服务、人工接待辅助两个方面：一方面，智能机器人能够单独进行客户接待，一个训练成熟的客服机器人的问题解决率能够达到80%～90%，从而使大部分的客户问题得到快速解决；另一方面，除了机器人自动接待之外，在人工客服接待过程中，机器人可以通过答案推荐或客服搜索知识库的方式提供接待辅助，提高人工客服的接待效率。图8-3所示为智能客服机器人。


    ![](Images/image_168_0_m.jpg)


    图8-3　智能客服机器人


    2.电子商务物流


    在很多情况下，仓储物流主要靠人工，大量的工人要投入很多时间和精力进行包裹的管理和分拣工作，难免会产生误差。而人工智能的应用可以大大降低仓储物流中的人力成本。


    目前，人工智能在物流行业的应用具体表现在仓库环节、配送环节和装卸环节。


    （1）仓库环节


    ①无人仓：自动化立体仓库，可利用立体仓库设备实现仓库高层合理化、存取自动化、操作简便化。自动化立体仓库的主体由货架、巷道式堆垛起重机、入库/出库工作台和自动运进/出及操作控制系统组成。货架是钢结构或钢筋混凝土结构的建筑物或结构体，货架内是标准尺寸的货位空间，巷道堆垛起重机穿行于货架之间的巷道中，完成存/取货的工作，在管理上采用计算机及条形码技术。无人仓如图8-4所示。


    ![](Images/image_168_1_m.jpg)


    图8-4　无人仓


    ②穿梭车：穿梭车在仓储物流设备中主要有两种形式，即穿梭车式出入库系统和穿梭车式仓储系统，以往复或者回环方式，在固定轨道上运行台车，将货物运送到指定地点或接驳设备。其配备有智能感应系统和自动减速系统，能自动记忆原点位置。穿梭车是一种智能机器人，可以对其进行编程，完成取货、运送、放置等任务。它还可以与上位机或WMS系统进行通信，结合RFID、条码等识别技术，实现自动化识别、存取等功能。穿梭车如图8-5所示。


    ![](Images/image_169_0_m.jpg)


    图8-5　穿梭车


    （2）装卸环节


    ①无人搬运车：无人搬运车（Automated Guided Vehicle，AGV）指装备有电磁或光学等自动导引装置，能够沿规定的导引路径行驶，具有安全保护以及各种移载功能的运输车。它是在工业中应用的无须驾驶员的搬运车，以可充电蓄电池为动力来源。一般可通过计算机来控制其行进路线以及行为，或利用电磁轨道来设定其行进路线，电磁轨道粘贴在地板上，AGV依循电磁轨道所带来的信息进行移动与动作。AGV如图8-6所示。


    ![](Images/image_169_1_m.jpg)


    图8-6　AGV


    ②装卸机械手：装卸机械手能模仿人手和臂的某些动作功能，是一个以固定程序抓取、搬运物件或进行其他操作的自动操作装置。装卸机械手的常见任务是将某传送带上的物件搬运到另一条传送带上。装卸机械手处理的产品量大、自动化程度高、机构运动速度快。装卸机械手如图8-7所示。


    ![](Images/image_170_0_m.jpg)


    图8-7　装卸机械手


    （3）配送环节


    ①配送机器人：配送机器人会根据目的地自动生成合理的配送路线，在行进途中避让车辆、过减速带、绕开障碍物，到达停靠点后，配送机器人就会向用户发送短信通知用户收货，用户可直接通过验证或人脸识别开箱取货。京东配送机器人如图8-8所示。


    ![](Images/image_170_1_m.jpg)


    图8-8　京东配送机器人


    ②无人机快递：无人机快递即通过无线电遥控设备和自备的程序控制装置，操纵无人机运载包裹自动送达目的地。其优点主要在于能够解决偏远地区的配送问题，提高配送效率，同时减少人力成本；缺点主要在于恶劣天气下无法使用，在飞行过程中无法避免人为破坏等。目前，顺丰速运已将无人机快递投入使用，但未大范围推广。无人机快递如图8-9所示。


    ![](Images/image_170_2_m.jpg)


    图8-9　无人机快递


    3.大数据分析与精准营销


    人工智能对电子商务还有一个重要价值，那就是它能够对大量的来自消费者的数据进行精确的分析。由于人工智能具备一定的学习能力和思考能力，其分析出的结果往往更接近消费者的真实想法。因此，通过人工智能得出的用户画像对于服务的优化以及提升用户体验更有参考价值，公司也可以使用这些方法来捕捉客户的行为模式。


    同时，高精准的用户分析势必会带来高精准的营销，高精准的营销势必会带来高效的转化率，人工智能的运用能帮助各大电商将广告精准地投放给所需的人群。图8-10所示为人工智能技术在电商中精准营销的应用场景。


    此外，通过数据分析还能进行预测性销售。预测性销售有助于组织和管理仓库的库存，确保公司库存充足，特别是对于需求较高的产品而言。


    ![](Images/image_171_0_l.jpg)


    图8-10　人工智能技术在电商中精准营销的应用场景


    ### [8.2.3　智慧电商案例分析](../Text/contents.xhtml#z210)


    目前，智慧电商的成功案例较多，如阿里巴巴、亚马逊、淘宝、京东、eBay等都有较为领先的产品和出色的表现。


    1.阿里巴巴


    阿里巴巴推出了天猫精灵和阿里助手，其客户服务聊天机器人的功能十分强大，能够处理多达95%的咨询业务，如语音及文字咨询等。阿里巴巴表示，人工智能能够推动内部及客户服务运营。此外，阿里巴巴使用人工智能绘制了最有效的物流路线，智能物流的推广使车辆使用量减少了10%，行驶距离减少了30%。


    在2018年杭州云栖大会上，阿里巴巴发布了太空蛋和太空梭两款最新产品，用于未来酒店和医院等设施。


    2.亚马逊


    Alexa是亚马逊旗下著名的人工智能产品，通过提升算法的性能可以帮助亚马逊制定针对性的营销策略。与此同时，亚马逊的推荐系统已能根据用户搜索记录预测其喜好，并进行产品推荐。


    3.eBay


    eBay利用人工智能维护消费者兴趣，提升公司竞争优势。例如，eBay通过自然语言处理技术找出客户感兴趣的产品，而客户能够通过文字、语音以及手机拍摄的照片与机器人进行交流。


    ## [8.3　智能医学](../Text/contents.xhtml#z211)


    随着大数据时代的到来，人工智能迎来了蓬勃发展的阶段，各个行业随之出现颠覆性的变革，医学领域也不例外。2017年7月，国务院发布《新一代人工智能发展规划》，特别提出要“围绕教育、医疗、养老等迫切民生需求，加快人工智能创新应用，为公众提供个性化、多元化、高品质服务”，并且要“推广应用人工智能治疗新模式新手段，建立快速精准的智能医疗体系。探索智慧医院建设，开发人机协同的手术机器人、智能诊疗助手，研发柔性可穿戴、生物兼容的生理监测系统，研发人机协同临床智能诊疗方案，实现智能影像识别、病理分型和智能多学科会诊。基于人工智能开展大规模基因组识别、蛋白组学、代谢组学等研究和新药研发，推进医药监管智能化。加强流行病智能监测和防控”。2018年3月，《政府工作报告》中提到，要“加强新一代人工智能研发应用，在医疗、养老、教育文化、体育等多领域推进‘互联网＋’”。目前，人工智能专家与医学专家联合开展了人工智能应用性研究，取得了初步成果，医疗领域内的重复性操作以及不适合人类的现场工作正逐步被人工智能机器所取代，这将成为提升我国医疗服务水平的重要因素。


    ### [8.3.1　智能医学的概念](../Text/contents.xhtml#z212)


    人工智能在医学领域的应用将会把医学带入新的时代——智能医学时代。智能医学，顾名思义，即通过人工智能的方法，辅助或替代人类进行医疗行为的科学。在智能医学中，智能是手段，医学是目的。


    ### [8.3.2　智能医学的发展历程](../Text/contents.xhtml#z213)


    人工智能在医疗领域的最早探索出现于1972年，利兹大学研发的AAPHelp是有据可考的最早出现的医疗人工智能系统，主要用于急腹症的辅助诊断。1975年，斯坦福大学开发了可以用于血液感染源诊断的智能诊断系统MYCIN。在一次测试中，MYCIN给出的诊断准确率达到了69%，高于依据当时的标准进行诊断的临床医生。但是，由于当时计算机的运算性能有限以及伦理争议等诸多问题，MYCIN始终没有投入实际应用。1986年，哈佛大学医学院开发了第一个商业化人工智能诊断系统DXPlain。DXPlain是第一种临床决策支持系统（Clinical
    Decision Support System，CDSS）。在1991年的一次测试中，DXPlain对46例不同类型的患者进行了诊断，其诊断准确率和由5名医生组成的评委会相比没有显著差异。


    目前，人工智能在医学中最成熟的应用是IBM的Watson for Oncology系统。Watson for Oncology的训练数据集包含了500份医学期刊和教科书、数千万份病历和1
    200万页的医学文献。在遇到肿瘤患者时，Watson for Oncology可以根据患者的症状和检查数据，给出初步诊断和有排序的治疗方案供医生选择。


    ### [8.3.3　智能医学涵盖的内容](../Text/contents.xhtml#z214)


    智能医学涵盖的内容较为广泛，在智能诊断、智能治疗、疾病预防以及伦理与安全等方面都有涉及。


    1.智能诊断


    可以用CDSS的运作方法来描述智能诊断的原理。其会收集既往的患者病历、文献和教科书等资料，作为训练数据集来训练智能诊断系统。在经过反复训练后，智能诊断系统在遇到患者时会根据患者的症状和主诉判断可能的疾病范围，开展相应的有针对性的检查，并根据检查结果给出初步诊断和治疗方案。而在疾病诊疗结束之后，该患者的数据又会被上传至数据平台，对系统进行进一步的优化。


    目前，智能诊断所需要的技术基础已经基本成熟，面临的更多的是实施过程中的问题。一方面，尽管现在已经有数个智能诊断系统投入应用，但是这些诊断系统都只能对某一类疾病进行诊断，诊断疾病谱较窄。如果智能诊断系统需要医生进行预诊断之后才能运作，则其实用意义将会大大降低。只有当智能诊断系统可以覆盖绝大多数的常见疾病时，这一系统才具有广泛的实用价值。另一方面，智能诊断系统需要海量的训练数据作为支撑，而现在医院和医院之间的数据壁垒严重，临床大数据库的建立难度较大。这两方面的问题都在不断解决的过程中，解决上述问题之后，智能诊断就会走进人们的生活。


    2.智能治疗


    相较于智能诊断，智能治疗目前离应用尚有一定的距离。总体来讲，目前人工智能的研究可以分为3个层面：运算智能、感知智能和认知智能。运算智能即快速计算和记忆储存的能力。智能诊断的核心是基于运算智能的，但是如果想让人工智能辅助甚至是替代医生进行疾病的治疗，就涉及感知智能和认知智能层面的内容了。感知智能是通过各种智能感知能力与自然界进行交互，如人脸识别、声音识别等，都属于感知智能的范畴。而认知智能是一个目前尚具有争议的内容，前两个层面的人工智能都是要做到使机器像人一样思考，而认知智能则要求机器用人类的方式进行学习，思考并实施行为。


    治疗涉及的是患者和机器的直接交互，所以在智能治疗的过程中，感知智能和认知智能必不可少。治疗的内容包括方方面面，从对人体的作用来说，可以分为非侵入性治疗（药物治疗、放疗等）和侵入性治疗（手术、穿刺等）。非侵入性治疗在实现上比较容易，而侵入性治疗（如手术），需要的是机器对人体各方面状态的实时识别，并根据相应的情况进行处理，实现难度较大。在智能治疗的实现过程中，可以以非侵入性治疗作为突破口，再逐渐拓展到侵入性治疗的领域。


    3.疾病预防


    在疾病的预防—诊断—治疗体系中，最重要的是预防，预防在各方面的成本都要远远小于治疗。但预防却是整个医疗行为中最容易被忽略的一环，其中的一个原因是疾病预防的过程较为复杂。但是当前，智能设备的逐渐普及使得个体细致到每一个生命体征、每一次医疗行为都能留下可回溯的痕迹，这大大降低了进行疾病预防的难度，同时为针对性、个体化的疾病预防提供了必要的条件。


    在应用中，可以通过智能设备收集的健康数据进行聚类分析，找到各种疾病的高危人群，进而有针对性地分析个体的发病风险，从而达到疾病预防的目的。与此同时，医疗的边界将远远超出看病治病这一范围，而延伸至健康管理的方方面面，甚至包括生活、饮食习惯等，其目的在于“防患于未然”。随之而来的是，医生和患者的交互模式将从医院之内扩展至医院之外，甚至医患间关系也会发生变化，从现在的患者找医生变成以后的医生找患者。


    4.伦理与安全


    随着技术的进步，人工智能在医疗行为中的方方面面超越人类只是时间问题。到那时是否应该在医疗过程中给予机器人自主权？能否保证机器人进行医疗行为的安全性？智能诊疗过程中如果出现了意外情况，责任应该如何判定？这些都是智能医学的实现过程中一定会遇到的问题，应当在政策和法律上对相关问题提前做出约束和规范。


    另外，人文方面的问题也是需要人们考虑的。例如，患者需要治疗，但除了治疗以外，患者还需要沟通、交流、被理解、被安慰，而这恰好又是机器人（现行技术条件下的弱人工智能机器人）的弱点。因此，人工智能在医疗行为中可以在多大程度、哪些岗位上替代人类，不单单是技术层面的问题。试想两种极端情况：一种是与患者面对面交流，但是并不将患者放在心上的医护人员；另一种是将对患者的关心模拟得淋漓尽致的、可以表达情感的人工智能机器人，哪一种对患者更加有利呢？这些问题同样值得人们去深入思考。


    ### [8.3.4　医学中的人工智能应用](../Text/contents.xhtml#z215)


    人工智能在医学中的应用主要包括医学影像智能诊断、基于语音识别技术的人工智能虚拟助理、智能医用机器人、基于人工智能的药物研发以及基于大数据处理的智能健康管理等。


    1.医学影像智能诊断'
