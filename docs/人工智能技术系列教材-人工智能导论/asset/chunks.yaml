    # [第10章　人工智能的挑战与未来](../Text/contents.xhtml#a10)


    【本章导读】


    人工智能的兴起与快速演进，对教育与就业、隐私与安全、社会公平等各个方面产生了深远的影响，在为人们带来极大便利的同时也蕴藏着巨大的风险。本章主要介绍人工智能发展的现状、挑战与未来。


    【本章要点】


    1 人工智能的挑战


    2 人工智能对社会的影响


    3 人工智能的未来


    ## [10.1　人工智能的挑战](../Text/contents.xhtml#z235)


    人工智能技术与企业需求之间仍然存在鸿沟。企业用户的核心目标是利用人工智能技术实现业务增长，而人工智能技术本身无法直接完成业务增长，需要根据具体业务场景和目标，形成可规模化落地的产品和服务。在此过程中，人工智能在数据、算法模型可解释性、业务场景理解、服务方式、投入产出比等方面都面临着一系列的挑战。


    ### [10.1.1　数据](../Text/contents.xhtml#z236)


    数据是人工智能应用的基础要素。在应用人工智能技术解决特定业务场景问题的过程中，与数据相关的流程主要包括数据获取、数据治理和数据标注。


    在数据获取方面，数据质量是首先需要面对的问题。在图像识别、文本识别、语音识别等单点场景中，可以基于外部公开数据进行模型训练。但在解决具体业务问题时，不管是前期模型训练还是模型上线后的使用，都需要用到来自实际业务场景的数据，外部数据价值有限。而受限于业务信息化、在线化的水平不足，可能存在缺乏历史数据积累或者数据质量较差的问题，需要经历冷启动和数据治理的过程。此外，实际业务中很多数据来自人工填报，也会造成数据准确性较差，需要先进行数据核验，判断和剔除异常数据。例如，品牌商做销量预测时需要收集各个渠道的促销计划，而这些数据一般由渠道一线销售代表报送，很容易出现报送数据与实际执行状况不匹配的问题。


    面对数据积累不足和质量不佳的挑战，需要从业务流程和算法上寻找解决方案。例如，对于有效样本数据不足的问题，可以尝试采用少样本学习的算法。对于数据采集质量差的风险，需要在采集和治理过程中结合业务经验，制定更加精细化的规则。


    此外，数据使用合规的挑战日益突出。一方面，涉及个人隐私方面的数据保护政策趋严；另一方面，涉及数据的归属权问题时，出于数据安全的考虑，归属于不同主体的数据往往很难实现流动和融合。这些因素都会限制数据的可获得性。


    面对数据使用合规的挑战，目前的应对策略之一是采用联邦学习等新技术，在底层数据不进行交换的前提下进行加密训练，可以在实现联合建模的同时保护数据隐私。


    在数据治理方面，数据复杂度在提升。在落地产业深入实际业务场景的过程中，需要采集和分析的数据类型会变得更加复杂，往往涉及多源异构数据、时序数据、非结构化数据等，数据存储和治理的难度大幅提升。例如，工业场景中就涉及工业现场图像数据、工艺流程文本数据和设备运行的时序数据等各种类型的数据，给数据清洗和后续应用带来了很高的复杂度和很大的挑战。


    面对数据治理的挑战，需要新的数据治理手段。目前，比较成熟的数据治理手段是使用数据湖的模式，能够同时兼顾结构化数据和非结构化数据的处理，并可以实现更低成本的存储，更好地支撑人工智能算法的数据调用。


    在数据标注方面，随着建模不断深入垂直行业的细分业务场景，数据标注的复杂度在不断提升。首先，需要标注人员掌握更复杂的行业知识，进一步提升了数据标注的门槛和成本。例如，医疗领域对医疗影像和文本的标注需要具备医学专业知识的人员进行。从数据类型来看，文本类、3D图像类数据不断增加，标注复杂度远高于早期的平面图像类数据。其次，对于垂直细分场景，需要根据建模需求，采集特定环境下、特定对象的精准“小数据”，这就需要更专业的数据采集手段。例如，对于微表情、假表情识别的场景，需要“群众演员”按要求配合表演，对于汽车碰撞场景，数据需要在实验室场景内采集。进一步讲，这些特定业务场景数据是数据拥有方的宝贵资产，需要保证数据标注过程中的安全性。


    面对数据标注的挑战，在算法层面，半监督学习、无监督学习等迁移算法可以弱化对数据标注的需求。此外，在数据标注方面，可以看到一些第三方的数据标注平台正在兴起。对于第三方数据标注平台，一方面，其通过提供经过培训的专业团队和定制化的服务，来解决数据采集、数据标注的质量和成本问题；另一方面，其通过研发一些自动化的辅助工具，通过技术手段来提升数据标注流程的效率。


    ### [10.1.2　算法模型可解释性](../Text/contents.xhtml#z237)


    在算法模型层面，人工智能在与业务系统结合的过程中面临的挑战是模型的可解释性问题。


    从回归算法、决策树等传统模型，到深度学习等新兴算法，人工智能的复杂性在不断增加，这使得算法决策机制越来越难以被人类所理解和描述。在原理上，大部分基于深度学习的算法是个“黑盒子”，模型不具备可解释性。然而，在落地金融、工业、医疗等行业时，出于对安全风险控制、监管合规等因素的考虑，直接应用到业务系统的模型需要具备符合业务逻辑的可解释性，让业务人员、决策者以及行业监管层能够理解，否则将难以落地。


    例如，对于零售品牌商，通过人工智能销量预测模型预测出的未来一个月的产品销售量，将直接影响生产、库存、物流以及营销等一系列计划，涉及巨额资金的调配。因此，该预测结果需要在业务上具备可解释性，否则业务人员无法采用。


    而在强监管的金融行业，监管机构在对技术的理解和掌握上难以和人工智能科技企业保持同步。因此，处于审慎的原则，为避免潜在风险以及监管漏洞，金融监管机构往往会对人工智能技术在金融业务场景的应用采取保守的监管措施，以确保风险可控。'
  fmt: '

    ### （1）基于事例的学习规划方法

    基于事例的学习规划方法依靠过去的经验进行学习及问题求解，一个新的事例可以通过修改事例库中与当前情况相似的旧事例来获得。将其应用于移动机器人的路径规划中可以描述如下：首先，利用路径规划所用到的或已产生的信息建立一个事例库，库中的任一事例包含每一次规划时的环境信息和路径信息，这些事例可以通过特定的索引取得；其次，把由当前规划任务和环境信息产生的事例与事例库中的事例进行匹配，以找出一个最优匹配事例；最后，对该事例进行修正，并以此作为最终结果。移动机器人导航需要良好的自适应性和稳定性，而基于事例的方法能满足这个要求。


    ### （2）基于环境模型的规划方法

    基于环境模型的规划方法首先需要建立一个机器人运动环境的环境模型。在很多情况下，由于移动机器人的工作环境具有不确定性（包括非结构性、动态性等），使得移动机器人无法建立全局环境模型，而只能根据传感器信息实时地建立局部环境模型，因此局部模型的实时性、可靠性成为影响移动机器人安全、连续和平稳运动的关键因素。环境建模的方法基本上可以分为两类，即网络/图建模方法和基于网格的建模方法，前者主要包括自由空间法、顶点图像法、广义锥法等，它们可得到比较精确的解，但所耗费的计算量相当大，不适合实际的应用，而后者在实现上要简单许多，所以应用比较广泛，其典型代表是四叉树建模法及其扩展算法等。


    ### （3）基于行为的路径规划方法

    基于行为的路径规划方法是由生物系统启发而产生的自主机器人设计方法。它采用了类似动物进化的自底向上的原理体系，尝试从简单的智能体来建立一个复杂的系统。将其用于解决移动机器人路径规划问题是一种新的发展趋势，它把导航问题分解为许多相对独立的行为单元，如跟踪、避碰、目标制导等。这些行为单元是一些由传感器和执行器组成的完整的运动控制单元，具有相应的导航功能，各行为单元所采用的行为方式各不相同，它们通过相互协调工作来完成导航任务。


    基于行为的路径规划方法大体可以分为反射式行为、反应式行为和慎思行为3种类型的路径规划方法。反射式行为类似于膝跳反射，是一种应激性反应，它可以对突发性情况做出迅速响应，如移动机器人在运动中的紧急停止等，但该方法不具备智能性，一般需要与其他方法结合使用；反应式行为是指机器人的系统类型是纯反应式的，不能形成记忆，也不能利用过去的经验来做出当前的决定，因此它们无法以交互方式参与实际应用，相反，每当这些机器遇到同样的情况时，它们的行为都会完全相同；慎思行为是指利用已知的全局环境模型为智能体系统到达某个特定目标提供最优动作序列，适用于复杂静态环境下的规划，移动机器人在运动中的实时重规划就是一种慎思行为，机器人可能出现倒退的动作以走出危险区域，但由于慎思规划需要一定的时间去执行，所以它对于环境中不可预知的改变反应较慢。


    反应式行为和慎思行为可以通过传感器数据、全局知识、反应速度、推理论证能力和计算的复杂性来加以区分。近年来，在慎思行为的发展中出现了一种类似于人类记忆的陈述性认知行为，应用这种规划不仅仅依靠传感器和已有的先验信息，还取决于所要到达的目标。例如，对于距离较远且暂时不可见的目标，有可能存在一个行为分叉点，即有几种行为可供采用，机器人要择优选择，这种决策性行为就是陈述性认知行为。将它用于路径规划中能使移动机器人具有更高的智能，但由于决策的复杂性，该方法难以用于实际之中，还有待进一步研究。


    图9-7所示为智能机器人的路径规划实现。当机器人要从点P运动到点Q时，如果在途中遇到了障碍物（图9-7中的3个大圆形），机器人会根据一系列的算法自动避开障碍物，从而顺利走到目的地并完成任务。


    ![](Images/image_191_0_l.jpg)


    图9-7　智能机器人的路径规划实现


    ### [9.2.2 人机交互](../Text/contents.xhtml#z231)

    在拥有基础的自主定位导航技术后，机器人要想进一步发挥自身作用，还需要拥有人机交互能力。人机交互技术可让机器人进一步了解人类，了解用户诉求，从而为用户提供更个性化的服务。过去的机器人以机器为中心，人类手把手教机器人怎么干活；未来的机器人应该以人类为中心，让机器人来适应人类，人类说一句话，机器人就能理解这句话从而做出行动，这是一个根本性的改变。


    从第一代以键盘鼠标为交互方式的PC互联网时代，到第二代以触屏为主的移动互联网时代，再到今天以多模态人机交互方式为主的第三代互联网，人机交互的形式发生了巨大的变化。


    目前，人机交互技术主要包括语音识别、语义理解、人脸识别、图像识别、体感/手势交互等技术。通过语音识别、合成、理解等技术，可以实现更精准的营销和专属服务；通过人脸识别，可帮助商家精准地识别用户，提升用户体验等。这些交互方式的改变将会深刻地影响人们日常生活的应用场景。


    #### 1.语音交互

    基于语音的人机交互是当前人机交互技术中最为主要的表现形式，语音人机交互过程中包含信息输入和输出的交互、语音处理、语义分析、智能逻辑处理以及知识与内容的整合。结合语音人机交互过程，人机交互中的关键技术中包含了自然语音处理、语义分析和理解、知识构建和学习体系、语音技术、整合通信技术以及云计算处理技术。经过科研人员的不断努力，目前语音交互技术已成功投入商用，如今智能手机、智能音箱、智能电视等设备中大多采用了语音人机交互技术，随着语音人机交互技术应用价值的逐渐显现，众多企业纷纷布局语音人机交互领域，随着布局企业的不断增多，语音人机交互的产业规模也在不断扩大，并带动了机器人、家电、汽车等相关产业的发展。


    #### 2.视觉交互

    除了语音人机交互之外，基于视觉的人机交互技术也是目前研究的一大热点。未来机器人需要理解人的感情，此时会涉及人脸识别技术，包括特征提取及分类。目前，在这种技术中，对于人类基本的7种表情的识别率可达到80%左右。但在自然交流过程中，人的表情比较平淡，机器人难以对其进行准确分辨，需要进行一些更加复杂的特征提取过程。


    #### 3.手势交互

    手势识别也是人机交互的重要手段之一，通过手部的动作直接控制计算机，相比传统的键盘、鼠标等控制方式，具有自然直观和便于学习等优点。目前，常用的手势识别方法主要包括基于神经网络的识别方法、基于隐马尔可夫模型的识别方法和基于几何特征的识别方法。基于神经网络的识别方法具有抗干扰、自组织、自学习和抗噪声等优点，但训练时需要采集的样本量大，且对时间序列的处理能力不强；基于隐马尔可夫模型的识别方法能够细致地描述手势信号，但拓扑结构一般，计算量相对较大；基于几何特征的识别方法是根据手的区域及边缘几何特征关系进行手势识别，该方法无须对手势进行时间上的分割，计算量小。


    ## [9.3 智能机器人的应用](../Text/contents.xhtml#z232)

    早期智能机器人主要用于工业和军事领域，大多数是机械手和机器臂。如今，智能机器人的应用已经深入各行各业，在军事、制造业、医疗、服务等方面有着广泛的应用。


    按照工作场所的不同，智能机器人可以分为管道、水下、空中、地面机器人等。管道机器人可以用来检测管道使用过程中的破裂、腐蚀和焊缝质量情况，在恶劣环境下承担着管道的清扫、喷涂、焊接、内部抛光等维护工作，以及对地下管道进行修复；水下机器人可以用于进行海洋科学研究、海上石油开发、海底矿藏勘探、海底打捞救生等；空中机器人可以用于通信、气象、灾害监测、农业、地质、交通、广播电视等；服务机器人以半自主或全自主方式工作，为人类提供服务，其中医用机器人具有良好的应用前景；仿人机器人的形状与人类似，具有移动功能、操作功能、感知功能、记忆和自治功能，能够实现人机交互；微型机器人以纳米技术为基础在生物工程、医学工程、微型机电系统、光学、超精密加工及测量（如扫描隧道显微镜）等方面具有广阔的应用前景。图9-8所示为医用机器人，图9-9所示为水下机器人，图9-10所示为微型机器人，图9-11所示为火星探测机器人。


    ![](Images/image_193_0_m.jpg)


    图9-8　医用机器人


    ![](Images/image_193_1_m.jpg)


    图9-9　水下机器人


    ![](Images/image_194_0_m.jpg)


    图9-10　微型机器人


    ![](Images/image_194_1_m.jpg)


    图9-11　火星探测机器人


    在国防领域中，军用智能机器人得到了前所未有的重视和发展，近年来，美、英等国研制出了第二代军用智能机器人，其特点是采用自主控制方式，能完成侦察、作战和后勤支援等任务，能够自动跟踪地形和选择道路，具有自动搜索、识别和消灭敌方目标的功能，如美国的Navplab自主导航车、SSV自主地面战车等。在未来的军用智能机器人中，还会出现智能战斗机器人、智能侦察机器人、智能警戒机器人、智能工兵机器人、智能运输机器人等，成为了国防装备中新的亮点。图9-12所示为军用智能机器人。


    ![](Images/image_194_2_m.jpg)


    图9-12　军用智能机器人


    在服务领域，世界各国都在致力于研究开发和广泛应用服务智能机器人，以清洁机器人为例，随着科学技术的进步和社会的发展，人们希望更多地从烦琐的日常事务中解脱出来，这就使得各场景下的清洁机器人被研发出来。家庭用的地面清扫机器人可沿墙壁从任何一个位置自动启动，利用不断旋转的刷子将废弃物扫入其自带容器中；车站地面擦洗机器人工作时一边将清洗液喷洒到地面上，一边用旋转刷不停地擦洗地面，并将脏水吸入所带的容器中；工厂的自动清扫机器人可用于各种工厂的清扫工作。美国的一款清洁机器人Roomba具有高度自主能力，可以游走于房间各家具缝隙间，灵巧地完成清扫工作；瑞典的一款机器人三叶虫表面光滑，呈圆形，内置搜索雷达，可以迅速地探测并避开桌腿、玻璃器皿、宠物或其他障碍物，它的微处理器可以识别出障碍物，并对整个房间做出重新判断与计算，重新选择路线，以保证房间的各个角落都被清扫到。图9-13所示为清洁机器人。


    ![](Images/image_195_0_m.jpg)


    图9-13　清洁机器人


    此外，在体育比赛方面，智能机器人也得到了很大的发展。近年来，国际上迅速开展了机器人足球高技术对抗活动，国际上已成立相关的联盟——国际机器人足球联盟（Federation
    of International Robot-soccer Association，FIRA），许多地区也成立了地区协会，达到了比较正规的程度且有相当的规模和水平。机器人足球赛的目的是将足球撞入对方球门取胜。球场上空（2m）悬挂的摄像机将比赛情况传入计算机内，由预装的软件做出恰当的决策与对策，通过无线通信方式将指挥命令传给机器人。机器人协同作战、双方对抗，完成一场激烈的足球比赛。在比赛过程中，机器人可以随时更新位置，当它穿过地面线截面时，双方的教练员与系统开发人员不得进行干预。机器人足球融计算机视觉、模式识别、决策对策、无线数字通信、自动控制与最优控制、智能体设计与电力传动等技术于一体，是一个典型的智能机器人系统。图9-14所示为机器人足球比赛。


    ![](Images/image_195_1_m.jpg)


    图9-14　机器人足球比赛


    现代智能机器人不仅在上述方面有广泛应用，还将渗透到生活的各个方面。例如，在矿业方面，考虑到社会上对煤炭需求量日益增长的趋势和煤炭开采的恶劣环境，将智能机器人应用于矿业势在必行；在建筑方面，有高层建筑抹灰机器人、预制件安装机器人、室内装修机器人、擦玻璃机器人、地面抛光机器人等；在核工业方面，主要研究机构灵巧、动作准确可靠、反应快、重量轻的机器人等。智能机器人的应用领域在日益扩大，人们期望智能机器人能在更多的领域为人类服务，代替人类完成更多、更复杂的工作。图9-15所示为开矿机器人，图9-16所示为擦玻璃机器人。


