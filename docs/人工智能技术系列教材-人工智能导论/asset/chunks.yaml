    ## 篇章级情感分析

    篇章级的情感分析有一个前提假设，即整个文本所表达的观点仅针对一个单独的实体，且只包含一个观点持有者的观点。这种做法将整个文档视为一个整体，不对篇章中包含的具体实体和实体属性进行研究，使得篇章级的情感分析在实际应用中比较局限，无法对一段文本中的多个实体进行单独分析，对于文本中多个观点持有者的观点也无法辨别。


    例如，如果评价的文本是“我觉得这款手机很棒。”，则评价者表达的是对手机整体的褒义评价；但如果是“我觉得这款手机的拍照功能很不错，但信号不是很好。”等类似文本，在同一个评论中既出现了褒义词又出现了贬义词，则篇章级的情感分析是无法分辨出来的，只能将其作为一个整体进行分析。如果需要对评论进行更精确、更细致的分析，则需要拆分文本中的每一句话，这就是句子级的情感分析研究的问题。


    ## 2. 句子级情感分析

    与篇章级的情感分析类似，句子级的情感分析任务是判断一个句子表达的是褒义还是贬义的情感，虽然颗粒度达到了句子级，但是句子级情感分析与篇章级情感分析存在同样的前提假设，即一个句子只表达了一个观点和一种情感，并且只有一个观点持有人。


    如果一个句子中包含了两种以上的评价或多个观点持有者的观点，则句子级情感分析是无法分辨的。在现实生活中，绝大多数的句子只表达了一种情感。


    在日常用语当中，根据语句中是否带有说话人的主观情感可以将句子分为主观句和客观句，例如，“我喜欢这款新手机。”就是一个主观句，表达了说话人内心的情感或观点；而“这款
    App 昨天更新了。”是一个客观句，陈述的是一个客观的事实性信息，并不包含说话人内心的主观情感。


    句子级情感分析的意义在于通过分辨一个句子是否为主观句，可以过滤掉一部分不含情感的句子，让数据处理更有效率。


    但是在实操过程中，会发现这样的分类方法并不是特别准确，因为一个主观句可能没有表达任何情感信息，只是表达了期望或者猜测。例如，“我觉得此刻他已经在回家的路上了。”这句话是一个主观句，表达了说话人的猜测，但是并没有表达出任何情感。而客观句也有可能包含情感信息，表明说话者并不希望这个事实发生，例如，“昨天刚买的新车被人剐蹭了。”这句话是一个客观句，但其中包含了说话人的负面情感。


    因此，仅仅对句子进行主客观的分类还不足以完成对数据进行过滤的需求，人们需要的是对句子中是否含有情感信息进行分类。如果一个句子直接表达或隐含了情感信息，则认为其含有情感观点，对于不含情感观点的句子则可以进行过滤。目前，这种分类技术大多需要大量的已人工标注的特征，如“味道不错”“难吃”等，来对句子进行分类。


    句子级的情感分析相较于篇章级的情感分析而言，颗粒度更加细分，但同样只能判断整体的情感，忽略了被评价实体的属性，同时它无法判断比较型的情感观点。例如，“A 产品的用户体验比
    B 产品好多了。”对于这样一句话中表达了多个情感的句子，不能将其简单地归类为褒义或贬义的情感，而是需要进一步地细化颗粒度，对评价实体的属性进行抽取，并对属性与相关实体进行关联，这就是属性级情感分析。


    ## 3. 属性级情感分析

    为了在句子级情感分析的基础上更加细化，需要从文本中发现或抽取被评价对象的主体信息，并根据上下文判断评价者针对每一个属性所表达的是褒义还是贬义的情感，这种分析就称为属性级情感分析。


    属性级情感分析关注的是被评价实体及其属性，包括评价者以及评价时间，目标是挖掘与发现评论在实体及其属性上的观点信息，生成有关目标实体及其属性的完整五元组观点摘要。具体到技术层面来看，属性级情感分析可以分为以下
    6 个步骤。


    （1）实体抽取和消解：抽取文档中所有涉及实体的语句，并使用聚类方法将关于同一个实体的语句聚为一类，每一类都对应唯一的一个实体。

    （2）属性抽取和消解：抽取文档中所有实体的属性，并对这些属性进行聚类，每个属性类别对应对象实体唯一的一个属性。

    （3）观点持有者抽取和消解：抽取文档中的所有观点持有者，并对持有者进行聚类，每个观点持有者类别对应唯一的一个观点持有者。

    （4）时间抽取和标准化：抽取每个观点的发布时间，并对不同时间的格式进行标准化操作。

    （5）属性的情感分类和回归：对具体的属性进行情感分析，判断它是褒义、贬义还是中性情感，或者通过回归算法给属性赋予一个数值化的情感得分，如 1～5 分。

    （6）生成观点五元组：使用步骤（1）～步骤（5）的结果构造文档中所有观点的五元组。


    ### 6.6.4 情感分析的应用 `../Text/contents.xhtml#z162`

    随着微博等社交媒体以及电商平台的发展而产生大量带有观点的内容，给情感分析提供了大量所需的数据基础。目前，情感分析已经在多个领域被广泛应用。


    （1）在社会舆论领域，通过分析大众对于社会热点事件的点评，可以有效地掌握舆论的走向。

    （2）在企业舆论方面，利用情感分析可以快速了解社会对企业的评价，为企业的战略规划提供决策依据，提升企业在市场中的竞争力。

    （3）在金融交易领域，分析交易者对于股票及其他金融衍生品的态度，为行情交易提供了辅助依据。

    （4）在商品零售领域，用户的评价对于零售商和生产商都是非常重要的反馈信息，通过对海量用户的评价进行情感分析，可以量化用户对产品及其竞争产品的褒贬程度，从而了解用户对于产品的诉求以及产品与竞争产品优劣程度的对比。


    下面选取两个案例来详细讲解情感分析的具体应用。


    #### 基于民宿客户在线评价的情感分析

    选取蚂蚁短租平台中客户对某地方民宿的评论作为文本来源，借助爬虫软件实现对蚂蚁短租某地民宿评论的获取，对所获评论进行数据清洗、分词、停用词过滤及词性标注等预处理操作。用领域词典对评论集中的所有评论进行情感值计算并进行情感分类，分为正面和负面情感评论集。


    通过表 6-1 可以看出某地民宿的优势（即正面主题），包括周边环境、房间设备和房东服务。其中，周边环境包含“交通”“公园”“环境”“景点”等核心关键词；房间设备包含“房间”“空调”“设施”等核心关键词；房东服务包含“老板”“热情”“周到”“接待”等核心关键词。正面主题词的挖掘有利于民宿管理者更准确地把握已有优势，发展自身特色，从而打造出极具魅力的民宿服务。


    与正面主题相比，消费者更应留意某地民宿的劣势（即负面主题），包括诚信问题、停车问题和室内问题。其中，诚信问题包含“骗人”“退房”“退款”“协商”等核心关键词；停车问题包含“收费”“停车场”“押金”等核心关键词；室内问题包含“霉味”“蚂蚁”“脏乱”“隐私权”等核心关键词。这些页面主题应该引起民宿管理者的注意，并有针对性地对自身服务进行改善。


