- pgno: 50
  md: '# 4.人工智能应用趋势展望


    展望未来，基础设施的升级、从决策到行动的技术演进，以及应用场景从企业智能延伸到产业智能，是人工智能应用值得关注的几大趋势。


    # 4.1 基础设施升级，拓展人工智能应用场景


    2019 年，中国正式进入 5G 商用元年。作为具备高带宽、低时延、广连接特性的新一代通信技术，5G 正在成为产业变革、万物互联的新基础设备。


    首先，5G 可以支撑大量设备实时在线和海量数据的传输，使得企业可获得的数据量、数据实时性大幅图提升，为更多人工智能应用提供可能。其次，随着 5G 部署范围的拓展，基于
    5G 之上的超高清视频等应用将迎来增长，人工智能在其中大有用武之地。


    例如，在大量的工业生产现场，不具备建设高带宽有线网络的条件，传统的 Wi-Fi 等无线网络也无法满足带宽要求，无法通过高清视频监控实现对生产线故障、人员违规操作、安全风险等异常状况的实时监控和识别预警，而
    5G 网络提供了新的解决方案。基于 5G 网络，还可以结合 AR/VR 技术，对设备故障进行远程专家诊断和运维。


    此外，边缘计算也是 5G 时代的重要特征。边缘端大量智能终端设备的爆发，使得传统的以云端为核心的集中式数据处理方式无法满足需求，边缘计算兴起。随着数据更多地在终端进行处理和应用，人工智能将广泛落地在边缘侧，边缘智能（Edge
    Intelligence）崛起。


    # 4.2 人机协同带来全新业务模式


    按照解决问题的能力划分，从识别——理解——分析——决策——行动的链条来看，人工智能的发展可以分为三个阶段——感知智能、认知智能和行动智能。


    图 28：从感知智能到行动智能


    ![](img/9e0ac1dd4c51fd59308ba5d68f9c6618_50_0.png)


    爱分析绘制


    人工智能技术的目标是让机器在整个从感知到行动的链条上模拟甚至超越人的能力，但在很多复杂场景下，单纯依靠机器完全替代人去解决问题并不现实。考虑到能力范围、时间效率、成本优化等因素，把人和机器作为整体部署的人机协同模式将成为未来的主流。'
  merge: -1
  img_proc: true
- pgno: 51
  md: '人机协同，是通过人机交互实现人类智能与机器智能的结合。具体而言，人机协同的模式是以知识图谱为支撑进行推理推荐，并进行人和机器资源的合理配置，解决复杂问题。根据场景需求不同，具体的人机交互方式包括冗余、互补和混合三种方式。


    人机协同已在多个行业中开始渗透和落地。


    例如，在智慧餐厅场景，可以运用人机和机器的交互来提高客户满意度。机器人可以和服务员共同配合，共同完成迎宾、领位、点餐、送餐、收餐等服务环节。


    在公安场景，知识图谱有 16 亿实体，要从中控挖掘隐性关系和潜在线索，由于数据量巨大，如果单纯依赖机器进行全景搜索将耗费大量时间。如果采用人机协同的模式，结合刑侦专家的经验和洞察，判断出重点可疑方向由机器进行深入搜索，可以大幅度提升效率。


    现阶段，人机协同的进展还是以人为主要，由人来判断场景需求和机器的能力进行匹配。未来的方向，则是实现机器自主判断场景、调度资源，并与人类相互协同。


    # 4.3 产业智能互联


    随着企业数字化转型和产业互联网的不断推进，产业智能互联的数据基础设施不断完善。产业互联网实现了产业链各环节的数据打通，在此基础上，人工智能的应用将从企业内部智能化延伸到产业智能化，实现采购、制造、流通等环节的智能协同，进一步发挥产业互联网的价值，提升产业整体效率。


    例如，以滴滴为代表的网约车平台就是一个简化版的产业智能互联样本。每个网约车司机都是一个小经营者，通过滴滴的智能调度平台建立与终端用户的连接，平台的人工智能预测、推荐、调度等算法，实现了用车需求与运力的高效匹配，这是单个司机所无法做到的。


    在零售行业，“双十一”是典型的产业智能互联实践，千万商家和数亿消费者参与其中，在制造、电商、物流、支付金融等产业互联基础设施支撑下，结合人工智能等技术的赋能，高效完成海量的线上交易和履约。例如，商家可以参考电商平台的销量趋势预测数据提前进行备货，并结合库存调度系统和物流服务网络，将订单智能分配到配送路径最短的仓库和线下门店发货。


    随着基础设施的成熟和技术渗透，未来将有更多的行业走向产业智能互联。'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# 结语


    2020 年代，如何落地产业将成为人工智能的主要命题。


    在通用基础技术基本成熟的条件下，与行业应用紧密结合推动产业的数字化转型和生产力提升，人工智能技术才能真正实现价值。同时，在行业应用中将人工智能技术转变为可规模化落地的产品和服务，也是人工智能厂商进一步深化技术能力、打造竞争壁垒的关键。


    对于处在数字化转型浪潮中的企业而言，采用人工智能技术推动业务的智能化升级已经刻不容缓，关键是寻找到投入产出比最佳的落地场景。


    爱分析也将持续和深入追踪人工智能在各个行业的落地进展和最佳实践。'
