  md: '# 关于爱分析


    爱分析是中国领先的产业数字化研究与咨询机构，通过判断技术应用及行业发展趋势，以公司价值研究为内核，服务于企业决策者和机构投资者。爱分析重点关注技术和数据创新，以及由此带来的商业模式、行业与市场以及产业链变革机会，覆盖领域包括金融、企业服务、教育、汽车、零售、房产、医疗及工业等。


    截至当前，爱分析已调研以上领域优质企业超过 3,000 家，涵盖一、二级市场，并撰写超过百份榜单及行业报告，系统积累了各行业及公司研究方法及评价体系，建立起了广泛、专业的影响力。同时，爱分析已服务众多客户，包括各行业标杆公司、上市公司及主流一二级机构投资者。'
