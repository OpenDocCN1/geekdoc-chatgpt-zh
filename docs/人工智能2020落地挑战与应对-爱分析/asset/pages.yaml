- pgno: 12
  md: '# 2.人工智能助力企业数字化转型


    发展至今，人工智能经历了明显的泡沫降温，进入了技术成熟度曲线的低谷期。行业开始回归理性，更多地关注人工智能如何落地产业，推动企业的数字化转型。


    本章，我们将分析人工智能在企业数字化转型中创造的价值，以及人工智能在各个行业的落地进展和实践案例。


    # 2.1 人工智能价值创造的三个层次


    人工智能落地产业带来的价值创造，可以分为自动化、智能化、创新化三个层次，每个层次创造的价值逐步提升。


    图 3：人工智能价值创造的三个层次


    |  | 自动化 | 智能化 | 创新化 |

    |---|---|---|---|

    | 含义 | 机器执行，提升业务的自动化程度；感知智能技术的单点应用 | 机器分析与决策，能力跃迁；认知智能技术，深入业务流程 | 智能化应用改变传统业务流程，重塑产业链；技术与产业深度融合
    |

    | 案例 | 工业机器人

    AI医学影像

    程序化广告投放 | 犯罪团伙挖掘

    销量预测 | AI智能货柜

    自动驾驶 |


    爱分析绘制


    自动化，是依赖人工智能技术提升业务的自动化程度。自动化并不改变原有业务流程，而是由机器替代人来自动执行业务流程，从而提升效率，降低成本。


    典型的场景，例如工业机器人取代人工进行分拣、组装等重复性劳动；医学影像领域，人工智能系统辅助阅片，提升医生诊断效率；广告营销领域的程序化广告投放等。多数场景下，自动化涉及的是业务链条中的单个环节。


    智能化，是基于知识图谱等认知智能技术，让机器具备分析和决策能力，可以完成人力无法实现的工作，对业务流程进行改造，创造增量价值。'
  merge: -1
  img_proc: true
- pgno: 13
  md: '例如，在安防领域，基于行业知识图谱技术在几亿个实体中寻找隐性关系，发现团伙作案的行为，人力无法处理如此大数据量的分析。零售领域，基于门店历史销售数据，通过机器学习构建销量预测模型，实现销量预测，实现远高于依赖经验预测的准确度，降低库存和损耗。


    智能化主要涉及分析、推理和决策性的工作，应用场景中往往涉及到数据挖掘，以及 NLP、深度学习、增强学习等认知智能技术和算法，并深入到相对完整的业务流程当中。


    创新化，是人工智能与行业深度融合后重塑业务流程和产业链，形成新的商业模式甚至新的细分行业。例如，基于计算机视觉的智能货柜，相比传统机械式无人售货机成本下降
    50%以上，容纳更多商品种类。无人驾驶是未来最具创新潜力的人工智能落地方向，一旦无人驾驶技术成熟，传统汽车行业从主机厂到用车场景的产业链关系将被颠覆。


    # 2.2 人工智能助力企业业务智能化


    数字化，是指利用数字技术来重塑业务流程，从而带来新的收入和价值创造机会。数字化转型，已经成为企业实现业务增长的必然选择。


    数字化的典型路径分为“信息化——在线化——智能化”三个阶段。信息化即 IT 基础设施的完善，是企业服务客户和经营管理在线化的基础。在线化包括用户交互场景以及企业经营场景的在线化。智能化是基于在线化沉淀的数据，让企业的经营决策从经验和流程驱动转向数据驱动、自动化决策，实现降本增效。


    图 4：企业数字化转型的三个阶段


    |  | 信息化 | 在线化 | 智能化 |

    |---|---|---|---|

    | 含义 | 进行IT基础设施建设，经营流程标准化

    信息化是企业经营在线化的基础 | 用户交互场景在线化，扩大服务范围

    企业经营场景在线化，匹配服务资源，提升经营效率 | 通过数据服务企业经营，机器直接接成决策

    经营场景智能化，最优化服务与效率 |


    爱分析绘制


    企业的数字化转型正在走向深入。随着业务信息化和在线化的推进，企业积累的数据量不断增长，同时业务场景的复杂度也在提升，传统的业务模式很难满足精细化运营和服务的需求，必然要走向智能化阶段。


    例如，当零售企业通过 APP 等在线化渠道实现了线上化的交易、会员运营、客户服务之后，将有机机会基于客户数据进行个性化的商品推荐和促销方案，提升服务体验和销售额。但是，这种'
  merge: -1
  img_proc: true
- pgno: 14
  md: '业务诉求无法通过传统的人工匹配或单纯依靠业务经验规则来做到，必须要借助机器学习建模来实现。


    因此，人工智能技术是助力企业数字化转型从信息化、在线化走向智能化的关键技术。基于人工智能技术应用的业务智能化，会成为企业新的核心竞争力。


    此外，部分行业头部企业已经走在前列，通过自有业务场景的应用实践，逐步积累人工智能技术的自研能力，并开始对外输出。


    # 2.3 人工智能的落地进展


    随着产业数字化带来的数据基础的日益成熟，人工智能在营销、金融、数字政府、零售、医疗等行业的落地持续推进，并开始带来显著的效益，但落地进展有先后之分。在部分行业，传统企业已经充分认可人工智能的应用价值，开始在实际业务场景规模化地引入相关技术。


    首先，在人工智能实际落地过程中，产业的数字化基础设施是影响落地进展的关键要素。产业数字化程度越高，人工智能的应用具备越完善的数据基础。


    其次，在数据基础设施差异的基础上，人工智能技术与各行业具体业务场景结合产生的主流应用场景和价值呈现也有不同，会处于不同的应用价值阶段。


    最后，基于不同行业的市场规模总量，人工智能技术应用创造的市场规模大小不同。下图中，气泡的大小代表了现阶段各个行业人工智能应用的市场规模，包括软件、硬件和服务。


    图 5：人工智能在各行业的落地进展


    ![](img/9e0ac1dd4c51fd59308ba5d68f9c6618_14_0.png)


    爱分析绘制


    接下来，我们将以人工智能在营销、金融、数字政府、安全、教育、工业等部分行业的应用实践为例，分析人工智能的实际落地进展。'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# 2.3.1 营销


    营销领域，线上营销场景已经是完全在线化、数据化的，线下营销场景也随着摄像头、屏幕等终端设备的智能化以及智能手机的普及而迈向数字化阶段。同时，品牌企业自身也在推进客户触点的数字化，并通过构建客户数据中台等基础设施，完善客户数据资产的积累。


    基于这些条件，人工智能在营销业务全流程已经得到广泛应用：从早期的用户画像建立、程序化投放、流量防欺诈等自动化应用，到基于数据做市场预测、销量预测、智能客服等智能化应用，再到目前基于图像识别在视频等媒介的创新广告形式。


    图6：人工智能在营销行业的应用场景


    ![](img/9e0ac1dd4c51fd59308ba5d68f9c6618_15_0.png)


    爱分析绘制'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 加和科技 用 AI 助力通用汽车优化广告投放效率


    加和科技是专注于为企业提供数字化业务网络的技术导向性企业，公司从企业流量管理切入，进一步结合营销数据深入到企业内部运营以及管理环节服务。与此同时，公司还引入了大数据以及人工智能等技术，致力于为企业运营以及管理提供智能化的升级服务。


    加和科技作为核心主体，通过不经手客户预算的品牌公域流量运营业务为核心，实现对媒体、品牌营销业务与营销大数据三者的整合和实现品牌主数字营销的智能化服务。


    图 7：加和科技业务布局


    ![](img/9e0ac1dd4c51fd59308ba5d68f9c6618_16_0.png)


    数据来源：加和科技，爱分析绘制


    针对 KA 客户，加和科技主要有两大业务板块：


