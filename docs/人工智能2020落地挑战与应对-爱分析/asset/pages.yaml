- pgno: 39
  md: '# 3.人工智能落地挑战与应对


    在深入产业落地的过程中，人工智能技术与企业需求之间仍然存在鸿沟。


    企业用户的核心目标，是利用人工智能技术实现业务增长，而人工智能技术本身无法直接解决业务需求，需要根据具体的业务场景和目标，形成可规模化落地的产品和服务。在此过程中，人工智能在数据、算法、业务场景理解、服务方式、投入产出比等方面都面临一系列挑战。


    # 3.1 数据


    数据是人工智能应用的基础要素。在应用人工智能技术解决特定业务场景问题过程中，与数据相关的流程主要包括数据获取、数据治理和数据标注。


    图 23: 数据层面的挑战


    ![](img/9e0ac1dd4c51fd59308ba5d68f9c6618_39_0.png)


    爱分析绘制


    在数据获取方面，数据质量是首先要面对的问题。在图像识别、文本识别、语音识别等单点场景，可以基于外部公开数据进行模型训练。但在解决具体业务问题时，不管是前期模型训练还是模型上线后的使用，都需要用到来自实际业务场景的数据，外部数据价值度有限。


    但受限于业务信息化、在线化的水平不足，可能存在历史数据缺乏积累或者数据质量较差的问题，需要经历冷启动和数据治理的过程。此外，实际业务中，很多数据来自人工填报，也会造成数据准确性较差，需要先进行数据核验机制，判断和剔除异常数据。例如，品牌商做销量预测需要收集各个渠道的促销计划，而这些数据一般由渠道一线销售代表报送，很容易出现报送数据与实际执行状况不匹配的问题。


    面对数据积累和质量不足的挑战，需要从业务流程和算法上寻找解决方案。例如，对于有效样本数据不足的问题，可以尝试采用少样本学习的算法。对于数据采集质量差的风险，需要在数据采集和治理过程中结合业务经验，制定更加精细化的规则。'
  merge: -1
  img_proc: true
- pgno: 40
  md: '此外，数据使用合规的挑战也日益突出。一方面，涉及到个人隐私方面的数据保护政策趋严。另一方面，涉及到数据的归属权问题，出于数据安全的考虑，归属于不同主体的数据往往很难实现流动和融合打通。这些因素，会限制数据的可获得性。


    对于数据归属权限制的问题，目前的应对策略之一是采用联邦学习等新技术，在底层数据不进行交换的前提下进行加密训练，可以实现联合建模，并保护数据隐私。


    # 图 24：联合建模


    ![](img/9e0ac1dd4c51fd59308ba5d68f9c6618_40_0.png)


    爱分析绘制


    # 在数据治理方面，数据复杂度在提升。


    在落地产业深入实际业务场景的过程中，需要采集和分析的数据类型会变得更加复杂，往往涉及到多源异构数据、时序数据、非结构化数据等，数据存储和治理的难度大幅提升。例如，在工业场景，就涉及到工业现场图像数据、工艺流程文本数据和设备运行的时序数据等，给数据清洗和后续应用带来很高的复杂度。


    面对数据治理的挑战，需要新的数据治理手段。目前，比较成熟的手段是用大数据湖的模式，同时兼顾结构化数据和非结构化数据的处理，并可以实现更低成本的存储，更好地支撑人工智能算法的数据调用。


    # 在数据标注方面，随着建模不断深入垂直行业的细分业务场景，数据标注的复杂度提升。


    首先，要求标注人员掌握更复杂的行业知识，进一步提升了数据标注的门槛和成本。例如，医疗领域对医疗影像和文本的标注，需要具备医学专业知识的人员进行。从数据类型来看，文本类、3D
    图像类数据不断增加，标注复杂度高于早期的平面图像类数据。'
  merge: -1
  img_proc: true
- pgno: 41
  md: '其次，对于垂直细分场景，需要根据建模需求，采集特定环境下、特定对象的精准“小数据”，需要更专业的数据采集手段。例如，对于微表情、假表情识别的场景需要“群众演员”按要求配合表演，汽车碰撞场景数据需要在实验室场景内采集。进一步地，这些特定业务场景数据是数据拥有方的宝贵资产，需要保证数据标注过程中的安全性。


    面对数据标注的挑战，在算法层面，半监督学习、无监督学习等迁移学习算法可以弱化对数据标注的需求。


    此外，在数据标注方面，还可以看到一些第三方的 数据标注平台正在兴起。第三方数据标注平台一方面通过受培训的专业团队和定制化的服务，来解决数据采集、数据标注的质量和成本问题；另一方面，也通过研发一些自动化的辅助工具，通过技术手段来提升数据标注流程的效率。'
  merge: -1
  img_proc: true
