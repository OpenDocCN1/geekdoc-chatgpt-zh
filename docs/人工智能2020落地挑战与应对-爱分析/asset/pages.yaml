  md: '# 2.3.4 安全


    在政策和需求的双重推动下，网络安全领域正在迎来新一轮黄金机遇。云计算、大数据、物联网等技术的渗透，给网络安全带来了全新的挑战，并使得网络安全日益延伸到业务层的安全防护。


    网络安全包括了大量的数据处理和分析流程，且业务场景本身就是数字化的，因此，人工智能技术在其中有良好的应用基础和丰富的应用场景。信通院发布的《中国网络安全产业白皮书》指出，人工智能技术在数据分析、知识提取、自主学习、智能决策等方面的优势，为应对动态多变、复杂交织网络安全问题提供了新的思路，推动网络安全治理向智能化趋势发展。'
