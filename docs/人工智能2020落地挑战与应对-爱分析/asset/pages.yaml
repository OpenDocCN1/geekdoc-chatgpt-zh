  md: '# 2.3.6 教育


    教育行业已经历了广泛的在线化历程，在 K12、语培、STEM 教育等领域的一大批在线教育公司崛起，改变了供给侧的格局。伴随着在线化的进程，教育行业初步积累起大量的数据。同时，教育行业的数据大多为文本、语音、视频等非结构化数据，人工智能在数据分析和应用方面将发挥重要价值。


    目前，教育行业的数据积累还在初期，且与核心教学环节相关的数据积累还相对较少，对于非结构化数据的处理分析技术还不成熟，整体落地成熟度还有较大提升空间。


    在具体应用场景上，人工智能技术已经开始渗透到师资教研、招生获客和教学服务等业务流程当中，其中教学服务环节的应用场景最为丰富，也是未来最有价值的环节。在师资教研环节，已经有头部的在线教育机构通过语音识别技术分析老师的上课过程，挑出优秀老师的最佳实践进行分析，沉淀到内容当中，从而提升教学质量和教学的标准化。


