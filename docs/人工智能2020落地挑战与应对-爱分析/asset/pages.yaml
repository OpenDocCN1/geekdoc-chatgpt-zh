    首先是学情诊断，对学生知识掌握水平进行动态评测。松鼠 AI 系统实时捕捉前端用户数据，随着数据积累和更新，构建愈发精准的个性化学情；


    然后是对症下药，哪里不会学哪里，针对每个知识点漏洞，为学生推荐纳米级的知识点学习内容，包括 3-5 分钟的讲解视频、动画或课程内容，结合学情画像推送对应内容；学习之后，通过练习和题目来检测学生对知识的吸收和应用效果，如此循环往复。


