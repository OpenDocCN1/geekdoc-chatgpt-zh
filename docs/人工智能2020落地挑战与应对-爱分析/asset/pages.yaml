- pgno: 47
  md: '# 3.3 业务场景理解


    随着人工智能深入落地各垂直行业，要解决的业务问题从通用场景、单点问题，向特定场景、业务全流程演进，需要从感知智能进化到认知智能，从而具备分析决策能力。同时，业务场景的复杂度和进入壁垒变得更高，对业务场景理解能力的要求也不断提升，给技术驱动的人工智能厂商带来更大的挑战。


    在这样的背景下，人工智能厂商单纯依靠算法技术和经验积累，难以满足对业务场景理解能力的需求。因此，人工智能算法需要与专家经验、业务规则融合，共同解决问题，知识图谱技术成为关键。


    借助知识图谱技术，可以将行业经验沉淀为行业知识图谱，在此基础上让算法更好地理解业务。实际落地过程中，先通过建立统一的知识图谱来实现知识融合，再进一步推进人工智能的快速落地应用，是解决业务场景理解问题的比较可行的方式。


    # 3.4 服务方式


    人工智能落地过程中，还需要考虑服务方式的问题。


    一方面，传统企业往往不具备很强的技术能力，无法直接应用技术。因此，标准化的 人工智能技术输出或者 API 调取的服务方式，无法满足企业业务人员的最终需求。人工智能厂商需要根据具体业务场景，基于技术能力提供定制化的解决方案，并封装成可直接应用到业务系统的产品，需要
    “AI+产品”。


    另一方面，企业用户的需求是达成最终的业务目标，需要保证业务系统的持续运营，让 AI 产品真正发挥价值，但自身的运营能力也有 限。因此，往往需要人工智能厂商提供持续的业务运营服务，以保证最终业务效果的达成，需要
    “AI+服务”。


    这给人工智能厂商面临的挑战，则是自身业务模式的问题，需要考虑如何避免过于定制化和重服务。例如，可以通过中台化的方式赋能前端业务人员，共同为客户解决业务问题。中台层把各项通用能力都中台化，基于中台支撑赋能前端人员去服务客户的业务运营，共同推动解决方案的落地和业务目标的达成。


    # 3.5 投入产出比


    目前，企业用户投入人工智能技术应用仍然会面临总拥有成本过高的问题，导致投入产出比不高，进而影响对人工智能技术的采纳。


    为了在业务中落地人工智能技术应用，企业 的总拥有成本至少包括以下项目：一方面，涉及到芯片、算法平台等硬件在内的智能化产品。另一方面，人工智能应用对专业人员的依赖非常大，需要引进算法工程师等人工智能人才。这些人工智能产品和人工智能人才的成本都比较高，这导致对于某些行业而言，投入产出比成为限制人工智能应用规模化落地的最大阻碍。'
  merge: -1
  img_proc: true
- pgno: 48
  md: '在成本方面，可以看到数据科学平台、机器学习平台等产品的涌现，正在提升人工智能建模的自动化程度。数据科学平台可以在数据准备、模型建立、决策部署、模型管理等方面实现自动化，降低整个业务流程对算法工程师的依赖，从而降低人工智能应用的总拥有成本。


    此外，未来人工智能的投入产出比提升的机会还在于算法的进步带来对硬件要求的降低，以及人工智能芯片等硬件成本的下降。'
