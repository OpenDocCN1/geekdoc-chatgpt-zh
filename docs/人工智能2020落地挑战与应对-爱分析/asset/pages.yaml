  md: '# 阿博茨科技助力港交所提升数据处理能力


    阿博茨科技专注于推动人工智能在金融领域应用落地，主要向银行、交易所、资管机构等提供人工智能解决方案。


    通过与数十家金融机构合作，阿博茨科技打磨了一套成熟的金融解决方案体系。阿博茨科技的 AI+RPA 产品 “Everdro id”，实现数据从识别到解析入库的全流程自动化。基于计算机视觉、NLP、知识图谱等技术，阿博茨科技的智能机器人可以理解上市公司运营数据报表及相关的法律文档内容，自动提取并解析目标数据，将所有不同类型的数据无缝解析到结算平台。


    图 10: 阿博茨科技的业务模式


    ![](img/9e0ac1dd4c51fd59308ba5d68f9c6618_19_0.png)


    数据来源：阿博茨科技，爱分析绘制


    金融领域的数据处理，是当前金融行业面临的最大挑战之一。市场信息和数据以碎片化方式存在于各式上市公司公告和电子邮件中，信息的收集消耗了企业大量人力资源。其次，数据文件类型大多以
    PDF 为主，金融机构只能依靠人工进行机械重复的逐条记录并处理。同时在数据处理和分析过程中，企业员工必须在大量的数据中去选择和甄别，这导致信息的正确性和准确性都存在不确定因素。


    阿博茨科技让 AI 阅读大量的上市公司公告，使之具备了感知能力，能够将非结构化数据，包括公告、邮件、新闻和图片中的数据提取出来。例如，计算机视觉技术将图片中的内容转换为文字，即像素转化为文字。


    在认知层面，通过自然语言理解的方式在金融领域进行模型训练，帮助 AI 理解数据内容和意义，再帮助客户把信息导入系统或者 Excel 中。最后，阿博茨科技再通过可视化搜索引擎向客户展示分析结果。'
