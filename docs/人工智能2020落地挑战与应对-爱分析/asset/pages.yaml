- pgno: 46
  md: '# 图 27：九章云极的产品结构


    ![](img/9e0ac1dd4c51fd59308ba5d68f9c6618_46_0.png)


    数据来源：九章云极，爱分析绘制


    九章的数据科学平台包含了特征仓库、算子仓库、业务场景算法模版仓库和 AutoML Recipe 仓库。


    特征仓库包含诸多银行业通用的行业 know-how，解决行业经验和业务知识融合问题：信贷员的知识和经验可以作为延伸特征，通过机器学习算法提取出特征后完善模型，提升训练集的准确率。算子算法仓库提供机器学习算子算法，其中包含可解释性更强的贝叶斯编程模型，满足银行客户的“白盒需求”。


    场景模版仓库解决跨行业的场景化、知识迁移问题：将其他行业的营销场景知识提炼为模版，应用于银行业相似的营销场景中，比如 KYC 和客户分群功能用于推荐金融产品。AR
    仓库融合了 Auto ML 框架，构建模型时可复用同类模型的相似特征，降低对数据科学平台的依赖。


    项目完成后，浦发银行业务人员通过图形化拖拽方式即可建模，进一步降低了平台的使用门槛。分布式集群的数据处理能力超过 10 亿条/天，50 万条/秒的峰值，满足了银行风险管控资金流向监控及精准营销等业务的实时性要求，且性能远超客户预期。在此基础上，可支撑的业务场景也从最初的
    6 个增加到现在的 62 个，大大提高了业务的处理效率。'
  merge: -1
