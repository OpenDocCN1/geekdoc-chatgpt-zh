- pgno: 8
  md: '# 1.人工智能走向产业应用


    人工智能是计算机科学的分支，是研究、开发用于模拟、延伸和扩展人的智能的理论、方法、技术及应用系统的一门技术科学。


    人工智能的基础理论由来已久，由深度学习引爆的第三次人工智能浪潮，以及算力的进步和数据的爆发，使得人工智能技术快速走向成熟，并逐步落地产业应用。


    # 1.1 人工智能行业图谱


    从底层基础技术到上层行业应用，可以把人工智能行业划分为基础层、通用层和应用层三部分。


    基础层为图像、语音等人工智能基础技术提供芯片、计算框架等计算能力支持，通用层提供感知、认知计算等通用技术，而应用层则是人工智能通用技术与各行业深度融合产生应用价值的产品和服务。


    # 图 1：人工智能行业图谱


    ![](img/9e0ac1dd4c51fd59308ba5d68f9c6618_8_0.png)


    爱分析绘制'
  merge: -1
  img_proc: true
- pgno: 9
  md: '基础层：为计算视觉、语音识别等人工智能基础技术提供计算能力支持，是人工智能的基础设施，包括 AI 芯片、AI 平台以及 AI 计算框架等，主要以谷歌、微软、亚马逊、英特尔、IBM、百度、腾讯、华为、京东等大型互联网公司和行业巨头公司为主。


    通用层：基于基础设施开发出的通用性人工智能技术和产品，如计算机视觉算法、机器人系统等，主要分为两大部分：以感知计算和认知计算技术为代表的软件通用技术，和无人机、机器人等软硬一体化通用产品。


    通用层的技术和产品主要是模拟人的各项能力。与人类的感知、认知和执行能力相对应，通用层可以分为感知层计算机视觉、语音识别和自然语言处理，认知层的知识图谱和自然语言处理的深入应用，以及执行层的机器人等。


    应用层：人工智能通用技术与各行业应用深度融合的领域，以垂直行业的人工智能应用公司为主。应用层人工智能企业将通用技术封装成能够落地的产品，包括软硬件一体化产品以及针对具体应用场景的端到端解决方案。随着通用技术走向成熟，行业应用价值凸显，大量通用层的公司也在基于基础技能向各行业应用层延伸。


    # 1.2 人工智能的商业模式


    人工智能走向产业应用的过程中，从向企业和个人用户提供人工智能产品服务的角度，人工智能公司的商业模式主要分为四种类型：API 调取、产品订阅/License、“产品+服务”解决方案及效果付费。


    图2：人工智能的商业模式


    ![](img/9e0ac1dd4c51fd59308ba5d68f9c6618_9_0.png)


    爱分析绘制


    API 调取：常见于基础层厂商和通用层厂商，通过 API 形式输出自身的技能能力，如计算机视觉领域的商汤科技、自动驾驶领域的百度 Apollo 平台、语音识别领域的科大讯飞等，都是通过将人工智能技术输出给应用厂商，由应用厂商完成最后一步产品及方案的封装。这种模式的优势在于模式较轻，规模化复制能力强。


    产品订阅/License：主要是以机器人、APP 等方式面向个人用户的产品，以标准 SaaS 模式面向互联网客户和传统行业中小型客户的产。例如，大疆、松鼠
    AI 等公司主要采取这种方式服务个人用户。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '**“产品+服务” 解决方案：** 主要面向传统行业中大型客户，这类客户的应用场景相对复杂，单一产品很难解决其需求，因此需要一定程度的定制化服务。例如旷视科技、明略科技等公司服务公安领域客户，需要提供端到端的解决方案。


    **按效果付费：** 人工智能与业务场景结合后，按照其产生的可衡量的实际业务价值进行收费。人工智能公司与客户更多是类似合作模式，按照业务量收取一定费用，目前在应用较为成熟的金融、智能客服领域有一些早期落地。例如，智能客服厂商根据帮助企业客户节省多少人力成本来衡量效果，可以按照工作量和坐席数量进行收费。'
  merge: -1
  img_proc: true
