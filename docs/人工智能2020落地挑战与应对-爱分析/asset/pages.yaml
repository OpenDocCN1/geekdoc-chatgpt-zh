  md: '# 松鼠 AI 1 对 1：用人工智能提升教学效率


    人工智能技术正从理论研究逐渐走向实际应用，赋能产业实现加速发展。首先落地的行业中，一大特点是人力密集且重复劳动较多导致效率低下，教育行业正是其中典型。


    松鼠 AI 洞察人工智能对教育行业的革命性价值，成功开发国内第一个拥有完整自主知识产权的人工智能自适应学习引擎，并成为中国第一家将此技术应用于 K12 中小学教培领域的科技独角兽公司。


    智适应教学系统的基础是，将学科知识点进行纳米级颗粒度拆分，建立每个知识节点的相互关联，构建完善的知识图谱，形成一套动态复杂的知识网络。


    即知识点原本是根据教学大纲设定为传统的树状结构，松鼠 AI 的创新型知识图谱技术将其重新构建为网状结构，并利用源源不断的学生数据持续自动更新和成长，不断完善算法引擎。


    同时，智适应系统利用松鼠 AI 独创的 MCM（Mode of Thinking, Capacity and Methodology）体系，检测学生的思维模式、学习能力和学习方法，全面分析学生当前学情，解析出个性化的知识盲区和薄弱点，精确刻画出学生的个人画像。


    确定学生的问题所在后，系统将结合知识图谱追根溯源，规划出个性化的学习路径，监测后续学习过程中的各类行为数据，以此实时计算最优学习方案并推送，保证学习过程可控有效。


    图 20：松鼠 AI 个性化学习内容推荐和路径规划


    ![](img/9e0ac1dd4c51fd59308ba5d68f9c6618_33_0.png)


    数据来源：松鼠 AI 1 对 1'
