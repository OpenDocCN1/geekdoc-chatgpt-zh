  md: '# 九章云极：融合行业知识，为企业构建一体化 “AI 大脑”


    九章云极是清华留美博士团队于 2013 年在北京成立，致力于打造中国领先的数据科学平台和实时决策中心，已服务了超过 120 家国内外大型企业。


    九章云极核心产品 DataCanvas 数据科学平台，面向金融、政府、交通和 IoT 行业提供分布式实时数据分析、实时业务、数据中台及 AI 建设能力，具有低门槛、异构多引擎、三位一体（编码建模、可视化建模、自动化建模）的建模方法、可解释（白盒算法）、特征仓库、模型仓库、一键发布、实时
    AI 热更新等特点，助力企业客户轻松构建智能化数据应用，完成数据智能化转型。


    浦发银行是九章云极在金融行业的代表性客户。为了满足人工智能应用需求，浦发银行此前采购了某国外厂商的商用建模平台，无法支持分布式和大规模数据实时建模，并且所有模型都采用黑盒模式，无法沉淀和进一步优化为企业资产。而银行业务种类繁多，需求复杂，包括对实时性要求高，数据需要大规模处理，并且需要自主可控的技术和知识产权，原有建模平台难以很好地匹配这些需求。


    图 26：浦发银行与九章云极的合作历程


    ![](img/9e0ac1dd4c51fd59308ba5d68f9c6618_45_0.png)


    数据来源：九章云极，爱分析绘制


    浦发银行从 2017 年开始和九章云极初次合作，并不断扩大合作构建浦发银行 AI 大脑，2020 年达成战略合作。九章云极采用高吞吐、低延迟的数据流引擎 DataCanvas
    搭建数据科学全生命周期建模平台，为营销和风控系统提供实时的流式数据和批量数据处理服务，满足电子银行客户足迹分析、客服大数据分析、风险实时类预警、资金变动营销等业务场景需求。


    金融行业属于强监管行业，对业务合规性要求高，其中包括对人工智能等前沿科技的应用安全性；此外，业务人员需要很好地理解建模平台原理，增强信任，识别和防止偏差并改进模型。因此，基于数据科学平台的建模可解释性（白盒算法库）成为行业刚需。'
