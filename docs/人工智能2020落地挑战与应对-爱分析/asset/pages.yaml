  md: '# 芯盾时代 AI 反欺诈模型，全面提升银行业务安全水平


    芯盾时代是领先的业务安全产品和服务提供商，由信息安全、人工智能、大数据等多维技术驱动，依托坚实的企业服务能力，为客户提供场景化全生命周期业务安全防护方案，助力客户打造安全、智能、可信的业务体系。


    芯盾时代某客户是一家混合所有制商业银行。近年来，该银行一直致力于发展面向中小微企业的普惠金融。随着互联网金融的浪潮，该银行的线上业务增长迅速，但随之而来的是欺诈风险上升，欺诈行为已从单一个体行为，发展成为包含各类不法分子、羊毛党的组织严密、分工明确的黑色产业链条，对客户资金安全带来严峻挑战，也给银行发展网络金融业务带来了严峻的挑战。


    图 14：业务流程与欺诈风险类型


    ![](img/9e0ac1dd4c51fd59308ba5d68f9c6618_27_0.png)


    数据来源：芯盾时代，爱分析绘制


    在这样的背景下，该银行决定在传统经验规则的基础上，引入芯盾时代的以“业务安全咨询+智能风控平台+建模服务”为核心，覆盖银行实时交易的事前、事中、事后环节的全渠道多场景反欺诈解决方案，方案包含四部分：


    通过交易反欺诈模型（TOFD）、营销反欺诈模型（MOFD）、信贷反欺诈模型（COFD）等机器学习模型，根据对不同业务场景进行风险后所提取的风险特征，对用户行为和终端信息进行风险综合评估，并根据风评结果等级给出差异化处置策略建议，有效识别营销活动欺诈、薅羊毛、洗钱、信用卡套现等高危欺诈事件，保护了银行资产安全和客户的资金安全。


    通过业内领先的无感知认证、设备指纹识别、终端威胁态势感知和欺诈关联图谱等自主知识产权核心技术，全面覆盖银行各个部门的业务安全防控需求。'
  merge: -1
  img_proc: true
- pgno: 28
  md: '通过可视化机器学习建模平台(VAI)，对洗钱、信用卡套现、营销活动作弊等风险高发业务场景进行持续优化和深度防控，有效降低反欺诈模型的衰减周期，提升系统自动化风控能力，在加强业务安全的同时，降低行方人员投入，节省了大量人力成本。


    针对样本不均衡和标注数据极少的问题，采用“无监督算法冷启动-半监督算法过渡-有监督算法”为模型训练的解决办法，迅速消除不利影响，完成了对多个业务渠道中交易流水数据，登录数据，注册开户数据的清洗和打标。


