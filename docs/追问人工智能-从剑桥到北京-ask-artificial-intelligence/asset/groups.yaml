    # （4）工业设计中的既视现象的运用


    日本著名设计师深泽直人将既视感熟练地运用到新产品的设计中，唤起人们对新产品的熟悉感。他往往会抽取现存的人和物之间本就存在的关系，寻找一种关于物体共同拥有的记忆导入新设计中，简单来说，就是无意识设计（without
    thought）。


    直观体现了“without thought”这个概念的示范性作品，正是深泽直人设计的CD播放器。第一次看到它，人们的大部分注意力就集中到这个拉线式开关上，在再简单不过的设计元素中，不需要提醒，直觉就会让你去拉动那条悬挂在空中的线，启动开关，音乐流泻而出，在下意识的动作中进而得到一个惊喜，谁能不为这个绝妙的设计所打动？这个早已熟悉的拉线动作，几乎是在无意识的状态下进行的，且时常出现在生活中，设计师只是将它放进设计中，赋予CD播放器一个“似曾相识”的新样式。


    我们又可以这么理解：人往往会在无意识状态下对同一事物产生相同的反应，他们在观看同一物件时，总会自然地找出对它感到有共鸣的地方。如果设计师能从生活和环境的观察中，抓住这些能让人产生共鸣、让人不假思索就能自然理解的元素，并运用到设计中，这个产品自然会是一个好的设计。


    而在即时游戏中，信息的输入、输出频繁且快速，玩家的意识活动更加强烈。适当在设计上巧妙运用既视感想必也能收到奇效。但在即时游戏中，既视感与哪些因素关系紧密？在设计时，又要如何把握这些因素让设计者能更好地在设计中把握既视感呢？这也引发了笔者的一系列思考。


    # （5）对即时游戏中既视感的猜想


    基于对CD播放器的思考，我们认为既视感引导的是“without thought”无意识的行为，但引发既视感，需要意识参与吗？


    在设计中加入一根拉线，我们会不自觉去拉，但如果摆在我们面前的是一个快门，一个开关……我们会怎样？此时，我们的注意力被分散了，我们的第一选择还是那根拉线吗？'
  - '[PAGE 113]


    所以在此，笔者大胆地做出了如下假设：注意作为意识活动中最不可缺的功能，是最早在心理学中提出的概念之一，虽然既视感引导的往往是无意识行为，但要产生既视感，首先要有注意这一意识行为，又由于即时游戏中的信息融合现象显著，使用户往往面临着诸多繁杂信息输入，并且要对各类信息进行融合，根据融合信息做出决策，所以用户在游戏过程中，势必会面临着注意力分配的问题。


    所以，在正式实验中笔者将研究的内容之一就是，注意力强弱对既视感的影响。具体来说，就是研究如果在即时游戏中，用户是在注意集中情况下更容易产生既视现象，那么分别在注意力集中和分散的情况下进行实验，实验结果一定会出现显著差异。但如果既视现象属于不需要分配过多注意力的
    一种潜在记忆，只是稍稍一留神便可轻易触发，那么在注意力被分散的情况下，实验结果应该与注意力集中时相近。


    同时，即时游戏中既视现象和记忆程度是否相关，将是笔者研究的第二个问题，关于这个问题，首先，在预实验对其论证，再在正式实验时进一步深化。对场景的记忆程度，是否会影响既视感的产生，这既是对近年来科学界普遍认为既视现象的产生与长时记忆有关的一个论证，也是对第一个研究内容的一个补充。在即时游戏中，是不是对场景的记忆程度越深，越容易产生既视现象？或者有可能对场景的记忆程度在注意力集中时对既视现象的产生影响不是很大，但当注意力不集中时，记忆程度将会对既视现象产生显著影响？


    # 6. 游戏人工智能的复杂性


    继图形和交互技术之后，人工智能成为游戏科技发展的瓶颈，人们不再单纯追求更真实、更美丽的画面，而是更人性、更智能的游戏伙伴（对手）。


    计算机思考问题的过程其实就是数值计算的过程，游戏人工智能的实现需要坚实的数学理论。最好的浅层机器学习算法 SVM，其求解目标在于确定一个二分类的超平面，以最大化样本在特征空间上的间隔，其中涉及线性空间到高维空间的映射、KKT
    最优化算法等。风头正劲的深度神经网络，无非就是在海量数据的基础上拟合出一个'
  - '[PAGE 114]


    非常复杂的函数来实现特征学习、分类拟合，其中涉及卷积计算、蒙特卡罗方法、最优化求解等。在自主决策独树一帜的强化学习其实就是一个马尔科夫决策过程，通过不断迭代来不断更新内部的策略函数，最终实现自主决策，其中涉及随机过程、最优化求解等。简单而广泛使用的决策树，其分支依据有信息增益率、Gini
    准则等，其中涉及信息论等。在高级的人工智能中，数学无处不在，也从根本上制约着人工智能的发展，它的每一次突破都能引发人工智能的新一轮热潮。


    计算机思考问题的过程其实就是移位、与或非等计算的过程，所以任何人工智能算法的成功都依赖于大量的计算。震惊世界的 AlphaGo 最后一个版本共使用了 40
    个搜索线程，48 个中央处理器（CPU）和 8 个图形处理器（GPU）；多台机器实现的分布式 AlphaGo 版本共使用了 40 个搜索线程，1202 个
    CPU 和 176 个 GPU。谷歌大脑运用深度学习的研究成果，使用 1000 台电脑创造出包含 10 亿个连接的“神经网络”，使机器系统自动学会识别猫。海量数据的处理也使得并行计算框架
    Hadoop、Spark 等在人工智能中变得炙手可热。


    # 7. 游戏人工智能的社会影响


    随着计算机硬件水平和软件技术的提升，我国的游戏产业迅猛发展，人工智能在游戏中的应用也更加广泛与完善，游戏的可玩性大幅增强，而游戏人工智能的发展也深受社会发展的影响，主要体现在以下四个方面。


    # （1）强游戏的人性化


    随着社会老龄化程度的加深，空巢老人越来越多，这已经成为一个不容忽视的社会问题；城市中独生子女数量较多，父母工作繁忙致使他们平时缺少玩伴，而人性化的游戏智能可以起到陪伴、娱乐的作用，如果使用得当的话，还能寓教于乐。普通人在与计算机游戏对战时，并不希望自己面对的是一个冷冰冰的机器，而是有喜有忧、有血有肉的玩家，计算机的游戏水平也应该与玩家水平相近，既不能让玩家因无法胜利而沮丧，也不能让玩家容易取胜而感到无聊。所以在设计这种游戏智能时，除了高超的游戏水平之外，还要让游戏智能人性化，并调节自己的水平以适应玩家。'
  - '[PAGE 115]


    # （2）挑战智能极限


    近十年来，电子竞技在我国从一个被所有人误解的边缘化产业，逐步变成了一个成熟、庞大的新兴产业链条，电子竞技正在逐渐成长为一个不可忽视的庞大产业。其实自香农提出为计算机象棋博弈编写程序以来，追求更强、更智能游戏智能体的脚步就从未停止，战胜世界冠军李世石的“阿尔法狗”更是被认为突破了人类最后的堡垒。在设计这种游戏智能时，更关注的是提高游戏智能体的游戏水平，而不关注是否类人化，所以更像是“书呆子”。


    # （3）不完全信息决策


    棋类等大多数游戏通常是有限状态、有规则的完全信息条件下的博弈，而像军事等现实世界具有高维、动态、不确定性的特点，是无规则的不完全信息下的决策。所以，人们也十分关心如何将游戏智能迁移运用到现实世界中，其中
    DeepMind 团队在战胜李世石后转战星际争霸，试图探索在状态更多、规则性更弱、信息不完全条件下的博弈；更有甚者，试图将 AlphaGo 技术应用到兵棋推演、军事空战决策中。


    # （4）自主学习


    与“深蓝”“沃森”不同，DeepMind 团队的研究成果除了高超的游戏技能外，还在于其自主学习的能力和可迁移的能力，这也是它能够大放异彩的原因。人们一直希望建立一种游戏智能框架：它无须任何人为参与就能在不同的游戏中通过自主学习成为游戏高手，其中
    DeepMind 的 DRN 技术在无须人为参与、无须调整算法框架的情况下，只通过自主学习就能精通 7 种 Atari 2600 游戏，甚至在某些游戏中超过人类玩家。


    # 8. 小结


    与模糊人类和机器的边界不同，游戏人工智能更关注挑战智力极限，表征是游戏战胜人类最强者；与教导人类成为领域专家不同，游戏人工智能更关注培育自学习能力的智能体，表征是无经验自主学习。所以，当前最先进的两个游戏引擎均使用了深度学习和强化学习两方面的知识，旨在培育具有自学习能力的高智能个体。'
  - '[PAGE 116]


    当前大家最关注的莫过于 2016 年 3 月 “阿尔法狗” 与李世石的围棋之战。现在的 1：4 人机比分是否表示机器已经突破人类最后的堡垒？是否表示达到智能极限？游戏人工智能下一步的研究关注点又应该是什么？笔者认为，机器即使战胜李世石也没有达到人类智能的极限，与记忆和速算一样，搜索与前瞻的能力也不能代表人类智能，人类还有情感、有思想、能快速学习等，所以
    “阿尔法狗” 战胜了李世石也只是在某个领域比人类更强而已。游戏人工智能不能使用图灵测试、中文屋子来衡量人工智能的程度，因为人类在游戏（特别是棋类游戏）上的智能并不突出，人脑的复杂度有限，并不能计算游戏的最优值，只是在能力范围内做出较优的决策。笔者认为
    “游戏人工智能的关注点应该是：同一游戏引擎作为双方对战，总是同一方（先手或后手）取胜，而且能够战胜人类最强者”。所以，即使 “阿尔法狗” 战胜李世石，但棋类智能仍有探索的空间：游戏决策的最优值。


    本章探讨了人机交互和人工智能的起源和瓶颈问题，人工智能和智能科学的发展，包括三个基本阶段，第一个阶段是传统的人工智能，这个传统的人工智能已经有了游戏规则，其基本特质就是数学形式化的东西，加上在某一领域的展开。这其中还涉及一个自动化的问題，其实很多问题是自动化的问題，而不是人工智能的问題。自动化涉及的是结构化的数据处理，人工智能是非结构化的数据处理。第二个大的阶段是人-机-环境系统的交互领域，这个领域正在形成规则。这个规则主要体现在两个方面，即自动化的处理与弱人工智能。当前在这个领域，还要加上各个行业和各个研究的指向。第三个阶段就是未来的智慧化的强人工智能的信息系统领域，在这个领域，目前还没有游戏的规则，它主要体现在人的智慧加上未来的强人工智能，或一些通用的
    人工智能，还需要进行一些积极的探讨与多学科交叉研究。'
  - '[PAGE 117]


