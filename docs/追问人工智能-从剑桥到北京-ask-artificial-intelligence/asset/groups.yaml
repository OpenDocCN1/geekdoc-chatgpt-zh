    # 第九章

    机器人之惧


    机器人被誉为“制造业皇冠顶端的明珠”，集机械、电子、传感、人工智能等多学科先进技术于一体。人工智能是机器人的智能来源，而机器人则是人工智能在军事、工业、民用等多领域应用的重要载体。人工智能技术与机器人技术的融合发展，共同推动了人类社会生活方式的变革。'
  - '[PAGE 165]


    <!-- no content -->'
  - '[PAGE 166]


    进入21世纪，工业机器人的发展逐渐趋向成熟，与此同时，仿人机器人、仿生机器人、家用机器人等也都取得了重要进展，而服务机器人由于持续快速发展，受到越来越多的关注。与军事、传播等领域不同，智能机器人本身建立在人工智能构想的基础上，向着更加贴近人类的方向发展。随着人工智能的发展，机器人发展自然得到更快的崛起。


    我国《国家中长期科学和技术发展规划纲要（2006—2020年）》中对智能服务机器人给了明确的定义：智能服务机器人是在非结构环境下为人类提供必要服务的多种高技术集成的智能装备。该文件也将服务机器人确定为未来有新发展的战略高技术。与工业机器人不同，服务机器人是不具有工业自动化应用，且为人类或设备执行有用的任务的机器人。它的用途十分广泛，一般包括专业服务机器人和个人/家庭服务机器人。


    根据国际机器人联盟（International Federation of Robotics，IFR）的数据统计，个人服务机器人的市场增长迅速。仅在2017年，个人服务机器人的总数量增加了25%，达到约850万，市场价值增加了27%，达到约85亿元人民币，可见服务机器人的市场十分广阔。无论是在专业服务领域还是在家庭服务领域，都有非常多的应用，如专业服务领域的医疗辅助机器人、疾患护理机器人、危险任务辅助机器人、监视安保机器人等，以及家庭服务领域的清洁机器人、助手管家机器人、生活辅助机器人等。产业化、模块化、家庭化将成为未来服务机器人的发展趋势，未来服务机器人会走入更多的普通人家庭，逐渐成为人们生活中不可或缺的部分。


    在仿人机器人方面，日本本田公司于2000年发布了首款仿人机器人阿西莫（ASIMO），经过不断改进和升级，2011年版ASIMO已经可以同时与多人进行对话，遭遇其他正在行动中的人时，ASIMO会预测对方的行进方向及速度，自行预先计算替代路线以免与对方相撞。ASIMO可以步行、奔跑、倒退走，还可以单脚跳跃、双脚跳跃，'
  - '[PAGE 167]


    也可以在稍微不平的地面行走，甚至能边跳跃边变换方向，奔跑速度可以达到 9 千米 / 时。它的手可转开水瓶盖、握住纸杯、倒水，甚至可以边说话边以手语表现说话内容。


    其他的人形机器人还有很多，例如波士顿动力公司 2013 年发布的双足人形机器人 Atlas，它有 4 个由液压驱动的四肢。Atlas 由航空级铝和钛材料建造，身高约
    6 英尺，重达 330 磅 ①，蓝光 LED 照明。它配备了两个视觉系统：一个激光测距仪和一个立体照相机，由一个机载电脑控制。它的手具有精细动作技能的能力，它的四肢共拥有
    28° 的自由度。虽然 2013 年的原型版本被系链到外部电源来保持稳定，但 Atlas 机器人可以在崎岖的地形行走和攀登且独立使用其胳膊和腿。Atlas
    还参加了由美国国防高级研究计划局举办的机器人挑战赛，一同参加比赛的还有很多其他研究团队研发的人形机器人，它们都具有很高的研究水平。


    在仿生机器人方面，与 Atlas 同出自波士顿动力公司的四足仿生机器人 BigDog 同样取得了巨大的成就。它没有车轮或者履带，而是采用四条机械腿来运动。机械腿上面有各种传感器，包括关节位置和接触地面的部位。它还有一个激光回转仪，以及一套立体视觉系统。BigDog
    长 1 米，高 0.7 米，重 75 千克，几乎相当于一头小骡子的体积。目前能够以每小时 5.3 千米的速度穿越粗糙地形，并且负载 154 千克的重量。它能够爬行
    35° 的斜坡。其运动是由装载在机身上的计算机控制的，这台计算机能够接收机器上各种传感器传达的信号，导航和平衡也由这个控制系统控制。


    在医疗机器人方面，2000 年左右研制成功并使用的达·芬奇外科手术系统（ Leonardo Da Vinci surgical robot ）是一种高级机器人平台，它可以通过使用微创的方法，实施复杂的外科手术，由三部分组成：外科医生控制台、床旁机械臂系统和成像系统。达·芬奇手术机器人的使用，使手术精确度大大增加，患者术后恢复加快，并减少了医护人员的工作量。


    ① 1 磅≈ 0.45 千克。'
  - '[PAGE 168]


    在家用服务机器人方面，自 20 世纪末研制出第一台扫地机器人以来，已经取得了巨大的发展，是服务机器人领域产业化程度最高和应用最多的机器人，其技术也从之前的随机清扫方式进化到路径规划式清扫，为人们的生活带来了巨大的便利。


    # 一、人工智能与机器人


    机器人特别是未来的智能机器人，不应仅是信息、控制、生物、材料、机械等科学技术的融合与结晶，而应该是集科技、人文、艺术和哲学为一体的“有机化合物”，是各种“有限理性”与“有限感性”叠加和激荡的结果。未来智能机器人的发展与人工智能密不可分，同时，人工智能也是制约当前机器人科技发展的一大瓶颈。


    与机器人一样，人工智能也“有一个漫长的过去，但只有短暂的历史”，其历史可以追溯到文艺复兴时期，17 世纪，莱布尼兹、托马斯·霍布斯和笛卡儿等人开始尝试将理性的思考系统化为代数学或几何学那样的体系，这些哲学家已经开始明确提出形式符号系统的假设，而这也成为后来人工智能研究的指导思想。19
    世纪，剑桥大学的查尔斯·巴贝奇建造差分机，开始尝试用机器来自动进行数学运算。第一次世界大战、第二次世界大战大大加快了人工智能发展的进程，图灵机的提出激发了科学家们探讨让机器思考的可能。1956
    年达特茅斯会议断言，“学习的每一方面或智能的任何其他特性都能被精确地加以描述，使得机器可以对其进行模拟”，这把人工智能领域的研究范围扩展到了人类学习、生活、工作方方面面。目前人工智能不但包括生理、心理、物理、数理等自然科学技术领域的知识，而且涉及哲学、伦理、艺术、教理等人文艺术宗教领域的知识。


    1997 年 5 月 11 日，国际商业机器公司“深蓝”击败了国际象棋世界冠军卡斯帕罗夫，证明了在有限的时空里“计算”可以战胜“算计”，进而论证了现代人工智能的基石条件（假设）：物理符号系统具有产生智能行为的充分必要条件是成立的。2016
    年 3 月，Google AlphaGo 在首尔以 4：1 的比分战胜了围棋世界冠军李世石，更是引发了人工智能将如何改变人类社会生活形态的话题。当前人工智能的'
  - '[PAGE 169]


    概念似乎有些过热，虽然过去几十年中人工智能已经取得了令人瞩目的成就，但实际上我们发现现在人工智能都还仅能应用在诸如语音识别、图像识别、自然语言处理等单一领域，当前人工智能水平的提升还只是量变，远远没有达到质变的标准。


    人工智能是人类发展到一定阶段自然产生的一门学科，包括人、机与环境三部分，所以也可以说，人工智能是人-机-环境系统交互方面的一种学问。在饱含变数的人-机-环境交互系统内，存在的逻辑不是主客观的必然性和确定性，而是与各种可能性保持互动的同步性，是一种可能更适合人类各种复杂的艺术过程的随机应变能力，而这种能力恰恰是当前人工智能所欠缺的地方。


    当前人工智能研究的难点不仅在具体的技术实现方面，更多的是在深层次对认知的解释与构建方面，而研究认知的关键则在于自主和情感等意识现象的破解。然而，由于意识的主观随意性和难以捉摸等特点，与讲究逻辑实证和感觉经验验证判断的科学技术有较大偏差，使其长期以来难以获得科技界的关注。但现在情况正在逐渐发生转变：研究飘忽不定的意识固然不符合科技的范畴，但把意识限制在一定情境之下呢？人在大时空环境中的意识是很难确定的，但在小尺度时空情境下的意识可能是有一定规律的。


    实际上，目前以符号表征和计算的计算机虚拟建构体系是很难逼真反映真实世界的（数学本身并不完备），而认知科学的及时出现不自觉地把真实世界和机器建构之间的对立统一了起来，围绕是、应、要、能、变等节点展开融合，进而形成一套新人-机-环境系统交互体系。


    # 二、莫拉维克悖论


    制约当前机器人发展的另一瓶颈是莫拉维克悖论。


    在机器人的发展中发现了一个与人们常识相左的现象：让计算机在智力测试或者下棋中展现出一个成年人的水平是相对容易的，但是要让计算机有如一岁小孩般的感知和行动能力却是相当困难甚至是不可能的。这便是机器人领域著名的莫拉维克悖论（Moravec’s'
  - '[PAGE 170]


    paradox )。


    莫拉维克悖论由汉斯·莫拉维克（Hans Moravec）、罗德尼·布鲁克斯（Rodney Brooks）、马文·明斯基等人于20世纪80年代提出。莫拉维克悖论指出，与传统假设不同，对计算机而言，实现逻辑推理等人
    类高级智慧只需要相对很少的计算能力，而实现感知、运动等低等级智慧却需要巨大的计算资源。


    语言学家和认知科学家史蒂芬·平克认为这是人工智能研究者的最重要发现，在《语言本能：人类语言进化的奥秘》（The Language Instinct: How
    Mind Creates Language）这本书中，他写道：经过35年人工智能的研究，人们学到的主要内容是“困难的问题是简单的，简单的问题是困难的”。4岁小孩具有的本能，如辨识人脸、举起铅笔、在房间内走动、回答问题等，事实上是工程领域内截至目前最难解的问题。随着新一代智能设备的出现，股票分析师、石化工程师和假释委员会都要小心他们的位置被取代，但是园丁、接待员和厨师至少十年内都不用有这种担心。


    与之相似，马文·明斯基强调，对技术人员来说，最难以复刻的人类技能是那些无意识的技能。总体上，应该认识到，一些看起来简单的动作比那些看起来复杂的动作要更加难以实现。


    在早期人工智能的研究中，当时的研究学者预测在数十年内他们就可以造出思考机器。他们的乐观部分来自于一个事实，他们已经成功地使用逻辑来创造写作程序，并且解决了代数和几何的问题，以及可以像人类棋士般下国际象棋。正因为逻辑和代数对于人们来说通常是比较困难的，所以被视为一种智慧象征。他们认为，当几乎解决了“困难”的问题时，“容易”的问题也会很快被解决，如环境识别和常识推理。但事实证明他们错了，一个原因是这些问题其实是难解的，而且是令人难以置信的困难。事实上，他们已经解决的逻辑问题是无关紧要的，因为这些问题是非常容易用机器来解决的。


    根据当时的研究，智慧最重要的特征是那些困难到连高学历的人都会觉得有挑战性的任务，如象棋、抽象符号的统合、数学定理证明和解决复杂的代数问题。至于四五岁的小孩就可以解决的事情，如用'
  - '[PAGE 171]


    眼睛区分咖啡杯和一张椅子，或者用腿自由行走，又或是发现一条可以从卧室通往客厅的路径，这些都被认为是不需要智慧的。


    在发现莫拉维克悖论后，一部分人开始在人工智能和机器人的研究上追求新的方向，研究思路不再仅仅局限于模仿人类的认知学习和逻辑推理能力，而是转向从模仿人类感觉与反应等与物理世界接触的思路设计研发机器人。莫拉维克悖论的发现者之一罗德尼·布鲁克斯便在其中，他决定建造一种没有辨识能力而只有感知和行动能力的机器，并称之为
    Nouvelle AI。虽然他的研究早在 1990 年就开始，但是直到 2011 年其 Baxter 机器人还是不能像装配工人那样自如地拿起细小的物件。


    莫拉维克悖论对应的是机器人的运动控制和感知系统，而人工智能对应于机器人的控制和信息处理中枢。如果把人工智能对应于机器人的大脑，那么，莫拉维克悖论对应的运动控制和感知系统则对应于机器人的小脑。只有大脑与小脑系统发展，机器人才能更好地为人类服务。


    # 三、机器人的社会问题


    # 1. 安全性问题


    机器人作为一个设备为人类工作服务有一个前提，那就是安全。在工业机器人领域已经有了相对完善、成熟的安全标准体系，而在服务机器人领域各国都缺乏相应的安全标准，国际标准化组织于
    2014 年 2 月正式发布了 ISO 13482 安全标准，这是服务机器人领域的第一个国际安全标准，是一个良好的开端，ISO 13482 安全标准包含移动仆从机器人、载人机器人、身体辅助机器人三大类服务机器人的基本安全要求。


    服务机器人的安全不仅包括传统的硬件安全（如电气安全等），还包括软件安全，机器人的软件安全与人们熟悉的计算机软件安全不同，虽然计算机软件失控或遭受攻击后也会导致严重的损失，但它仅存在于虚拟空间，不会直接对物理世界产生作用。但机器人系统的软件安全则不同，机器人的软件系统可以控制其硬件系统做出各种动'
