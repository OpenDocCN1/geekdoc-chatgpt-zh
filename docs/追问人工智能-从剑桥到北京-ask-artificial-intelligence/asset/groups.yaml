    一致性不同量纲种类的刺激输入，其表征方式是极其灵活多变的，对一朵花、一棵树甚至可以有无限多种表征，正所谓“一花一世界、一树一菩提”，而且表征出的信息符号是由“能指”“所指”构成的，“能指”指具体的物理刺激形象，“所指”指信息所反映的事物的概念及拓扑关系。比如，对于一杯水，机器可能表征它为高度、宽度、密度、颜色等客观数值参数，而人除此之外，还可以把它表征为热情、友谊、问候、送客等方面的多维内涵外延拓展，这种千差万别的混合指向变化，机器无论如何是表征不出，也处理不了的……所以，从智能的源头就可以找到人工智能与人类智能的根本区别之所在。数据的变化与动态映射是感知的瓶颈，人会期望性地补偿或回望性地修正，而机器就是把“过去性”（数据）当成“当下性”来处理，若数据处理过程中不敏感则罢，若是临界性数据，就常常会差之毫厘谬以千里了。数据、信息、知识、逻辑本质上就是事物之间不同程度的关系表征，这种表征可以体现在人的记忆和直觉之间，也可以显示于机器的存储与计算之中。只不过机器数据的单一表征从一开始就异于人的多种刺激融合，这也是机器不能产生类人意向性的主要原因：缺乏灵活的一多分有（内涵外延伸张弥聚有度自如）的表征机制。


    有人认为符号化和对象化可能是两个不同的步骤。一个对象可以没有符号名字，也可以有多个符号名字，一个符号可以表示多个不同对象。智能的理解要做到符号到对象的指向性，没有做到指向性，只是符号间关系的处理，不能算理解。实际上对人而言，感与知往往是同步的，在形成习惯风俗后，对象与符号应该是融合的。


    有了数据和信息之后，智能的信息处理架构就格外重要了。截至目前，有不少大家提出了一些经典的理论或模型，例如在视觉领域，大卫·马尔（David Marr）的三层次理论结构至今仍为许多智能科技工作者所追捧。作为视觉计算理论的创始人，马尔认为，神经系统所做的信息处理与机器相似。视觉是一种复杂的信息处理任务，目的是要把握对我们有用的外部世界的各种情况，并把它们表达出来。这种任务必须在三个不同的水平上来理解，这就是计算理论、算法、机制。


