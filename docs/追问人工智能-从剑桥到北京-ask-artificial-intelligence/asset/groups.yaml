  mdcn: '

    笔者认为，人工智能不断进步，这是个不争的事实。机器的感觉、运动、计算等能力都将会远远超过人类，这是机器的强项，但是它不会从根本上冲击人类的岗位与职业。这源于以下几方面。


    首先，机器有自己的优势，人类也有自己的优势，且这个优势是机器在短期无法比拟与模仿的。人类拥有思维能力，能够从小数据中迅速提炼归纳出规律，并且可以在资源有限的情况下进行非理性决策。人类拥有直觉能够将无关的事物相关化。人类还具有与机器不尽相同的内部处理方式，一些在人类看来轻而易举的事情，对机器而言可能就要耗费巨大的资源。2012
    年，谷歌训练机器从 1000 万张图片中自发地识别出猫的图片。2016 年，谷歌大脑团队训练机器根据物体的不同材质自动调整抓握的力量。这对于一个小孩子来说是很简单的任务，但在人工智能领域，却正好相反。也许正如莫拉维克悖论所述，高级推理所需要的计算量不大，反倒是低级的感觉运动技能需要庞大的计算资源。


    其次，目前人类和机器还没有达到同步对称的交互，仍然存在着交互的时间差。截至目前，仍然是人类占据主动，而且对于机器有不可逆的优势。皮埃罗·斯加鲁菲在《智能的本质：人工智能与机器人领域的
    64 个大问题》一书中曾经提出，人们在杂乱无章中的大自然中建立规则和秩序，因为人类更容易在这样的环境中生存和繁衍不息。而环境的结构化程度越高，制造在其中的机器就越容易；相反，环境的结构化程度越低，被机器取代人类的可能性就越小。由此可见，机器的产生与发展是建立在人们对其环境的了解与改造上的。反过来，机器的发展进一步促进了人们的改造与认知活动。这就如天平的两端，单纯地去掉任何一方都会导致天平的失衡。如果没有人类的指引与改造作用，机器只能停留在低端的机械重复工作层次。而机器在一个较低端层次工作的同时，也会使得人们不断追求更高层次的结构化，从而使得机器向更高层次迈进。这就像一个迭代上升的过程，人—机器—人—机器，依次循环，人类在这段过程中总是处于领先地位。所以，机器只可能取代人类的工作，而不是取代人类。


    最后，人工智能高速发展的同时也带来了机遇。诚然，技术的发展会带来一些负面影响，但是如果从全局来看，是利大于弊的。新技术的发展带来的机遇就是全方位的。乘法效应说的是这个道理：在高科技领域每增加一份工作，相应地在其他行业至少增加
    4 份工作。我们应该看到，如今伴随着人工智能业的飞速发展，相关企业如雨后春笋般诞生，整体拉动了相关产业（服务业、金融业）的发展，带来了更多的就业机会。


    总之，任何一项技术的发展都不是一蹴而就，而是循序渐进的过程。无论是最早期的类人猿的工具制造，还是后来的电力发展，再到现在的互联网时代，技术的发展与运用都是需要时间来保证的。现在社会上有些人担心人工智能的发展会立即冲击自己的工作，实则有些“杞人忧天”。历史上大的技术突破并没有对人类的工作产生毁灭性的打击。蒸汽机的诞生替代了传统的骡马，印刷机的诞生取代了传统的抄写员，农业自动化设施的产生替代了很多农民的工作，但这都没有致使大量的工人流离失所，相反，人们找到了原本属于人类的工作。新兴技术创造的工作机会要高于所替代的工作机会。所以，我们不必过分担心机器会取代人类工作的问题。


    ## 三、谁来为事故负责


    2016 年 7 月，特斯拉无人驾驶汽车发生重大事故，造成一名司机当场死亡，很快成为新闻媒体的焦点。人们不仅仅关注这件事情本身所带来的影响，更加担心机器作为行为执行主体在事故发生后的责任承担机制。究竟是应该惩罚那些做出实际行为的机器（并不知道自己在做什么），还是那些设计或下达命令的人，或者两者兼而有之？如果机器应当受罚，那究竟应该如何处置？是应当像《西部世界》中那样将所有记忆全部清空，还是直接销毁呢？目前还没有相关法律对其进行规范与制约。


    随着智能产品的逐渐普及，我们对它们的依赖性也越来越强。在人、机、环境交互中，我们对其的容忍度也逐渐增加。于是，当系统出现一些小错误时，我们往往将其归因于外界因素，而无视这些微小错误的积累，我们总是希望其能自动修复，并恢复到正常的工作状态。遗憾的是，机器黑箱状态并没有呈现出其自身的工作状态，从而造成了人机交互中人的认知空白期。当机器不能自行修复时，往往会将主动权转交给人类，人类就被迫参与到循环中，而这时人们并不知道发生了什么，也不知道该怎样处理。据相关调查与研究，人们在时间与任务的双重压力下，往往会产生认知负荷过大的情况，从而导致本可以避免的错误。如果恰巧这时关键部分出了差错，就会出现很大的危险。事后，人们往往会责怪有关人员的不作为，而忽视机器一方的责任，这样做是有失偏颇的。也许正如佩罗所说：60%～80%的错误可以归因于操作员的失误。但当我们回顾一次次错误之时，会发现操作员面临的往往是系统故障中未知甚至诡异的行为方式。我们过去的经验帮不上忙，往往只是事后诸葛亮。


    其实，笔者认为，人工智能存在三种交互模式，即人在环内、人在环外以及以上两者相结合。人在环内即控制，这个时候，人的主动权较大，从而人们对整个系统产生了操纵感；人在环外即自动，这个时候，人的主动权就完全归于机器；第三种交互模式就是人可以主动/被动进入系统中。目前大多数所谓的无人产品都会有主动模式/自动模式切换。其中被动模式并不可取，这就像之前讨论的那样，无论是时间还是空间上，被动模式对于系统都是不稳定的，很容易造成不必要的事故。


    还有一种特殊情况，那就是事故是由设计者/操纵者蓄意操纵的，最典型的是军事无人机，军方为了减少己方伤亡，试图以无人机代替有人机进行军事活动。无人机的产生将操作员与责任之间的距离越拉越远，而且随着无人机任务的复杂程序加深，幕后操纵者也越来越多，每个人只是完成“事故”的一小部分。所以，人们的责任被逐渐淡化，人们对这种“杀戮”变得心安理得。而且很多人也相信，无人机足够智能，与军人相比，能够尽可能减少对无辜平民的伤害。可具有讽刺意义的是，仅在2014年针对巴基斯坦及也门的攻击中，美国的无人机便造成了1147人死亡，这场行动是针对41名与恐怖组织有关的人员，也就是说，这些行动中死亡的大多数人只是平民。2012年，“人权观察”组织在一份报告中强调，完全自主性武器会增加对平民的伤害，不符合人道主义精神。不过，目前对于军事智能武器伦理的研究仍然停留在理论层面，要想在实际军事战争中实践，还需要付出更多的努力。


    综上可以看出，在一些复杂的人-机-环境系统中，事故的责任是很难界定的。每个人（机器）都是系统的一部分，完成了系统的一部分功能，但是整体产生了不可挽回的错误。至于人工智能中的人与机器究竟应该以何种方式共处，笔者将在下面给出自己的一些观点。


    ## 四、人工智能伦理，任重道远


    通过以上的讨论与分析，笔者认为，人工智能还远没有伦理的概念（至少是现在），有的只是相应的人对于伦理的概念，是人类将伦理的概念强加在机器身上。在潜意识中，人类总是将机器视为合作的人类，所以赋予机器很多原本不属于它的词汇，如机器智能、机器伦理、机器情感等。在笔者看来，这些词汇本身无可厚非，因为这反映出人们对机器很高的期望，期望其能够像人一样理解他人的想法，并能够与人类进行自然地交互。但是，当务之急是弄清楚人的伦理中可以进行结构化处理的部分，因为只有这样，下一步才可以让机器学习，并形成自己的伦理体系。正如前文所述，“伦理”由“伦”和“理”组成，每一部分都有自己的含义，而“伦”，即人伦，更是人类在长期进化发展中所逐渐形成的，具有很大的文化依赖性。更重要的是，伦理是具有情景性的，在一个情景下的伦理是可以接受的，而换到另一种情景，就变得难以理解，所以，如何解决伦理的跨情景问题，也是需要考虑的。


    值得一提的是，就人、机、环境交互而言，机不仅仅是机器，更不是单纯的计算机，还包括机制与机理。而环境不仅仅单指自然环境、社会环境，更涉及人的心理环境。单纯地关注某一个方面，难免会以偏概全。人工智能技术的发展，不仅仅是技术的发展与进步，更加关键的是机制与机理的与时俱进。因为两者的发展是相辅相成的，技术发展过快，而机制并不完善，就会制约技术的发展。现在的人工智能伦理研究就有点这个意味，人类智能的机理尚不清楚，更不要提机器的智能机理了。而且，目前机器大多关注人的外在环境，即自然环境与社会环境，机器用从传感器得到的环境数据来综合分析人所处的
    外在环境，但是很难有相应的算法来分析人的内部心理环境，人的心理活动具有意向性、动机性，这也是目前机器所不具备的，也是不能理解的。所以，对于人工智能的发展而言，机器的发展不仅仅是技术的发展，更是机制上的不断完善。研究出试图理解人的内隐行为的机器，则是进一步的目标。只有达到这个目标，人、机、环境交互才能达到更高的层次。


    人工智能伦理研究是人工智能技术发展到一定程度的产物，既包括人工智能的技术研究，也包括机器与人、机器与环境及人、机、环境之间关系的探索。与很多新兴学科一致，人工智能伦理的历史不长，但发展速度很快。尤其是近些年，随着深度学习的兴起，以及一些大事件（“阿尔法狗”战胜李世石）的产生，人们对人工智能本身，以及人工智能伦理研究的兴趣陡然上升，对其相关研究与著作也相对增多。但是，可以预期到的是，人工智能技术本身离我们设想的智能程度还相去甚远，且自发地将人的伦理迁移到机器中的想法本身实现难度就极大。而且如果回顾过去的话，人工智能总是在起伏中前进，怎样保证无论是在高峰还是低谷的周期中，政府的资助力度与人们的热情都保持在同一水平线，这也是一个很难回避的问题。这些都需要目前的人工智能伦理专家做进一步的研究。


    总之，人工智能伦理研究不仅仅要考虑机器技术的高速发展，更要考虑交互主体——人类的思维与认知方式，让机器与人类各司其职，互相促进，这才是人工智能伦理研究的前景与趋势。


    ## 五、人工智能造假，怎么办


    任何技术都是双刃剑，人工智能技术也不例外，人工智能技术在军事领域可以帮助隐真示假，造势用势，在民用领域可以增强产品/系统的可用性，然而，近年来报道的大量人工智能合成信息占据了人们的真实生活及虚拟生活——互联网空间，如“骚扰电话”，“好评灌水”，数据污染，合成声音，人工智能生成真人视频、图像、不存在的事务等。鉴于此，不少专家认为，人工智能的快速发展使得真实/虚拟生活空间从人与人的真实交流转化为智能化、自动化的平台间交互、对抗。那么，该如何认识人工智能造假这个现象，进而改变这个现象呢？这是当前需要深入思考的一个重要问题。


    机器本质上只是人造物，是不会造假的，它们更类似于函数，即将输入变为输出，只计多少，不问是非，更为关键的是数据/信息的变异是有参与的演化、演变、演绎而不仅是演算。所以，人工智能造假本质上是人的造假，是人通过编制好的程序和设备进行预设的有针对性的造假，就像许多魔术一样，只不过是用一些旧的公式定理结合新的情境态势而拟合出的新算法而已，如一个训练良好的生成对抗网络技术配上丰富的数据资源，模拟出逼真的照片、视频及文本材料已经不是难事。其目的是使人产生感觉上的错乱、知觉上的欺骗，进而实现淹没真实、虚假得逞。


    然而，世界是由事实（关系）构成的，而不是由事物（属性）构成的，从根本上而言，就算是找到了构成事物的最基本单元，机器也无法真正明白各单元之间的相互作用，而这些相互作用关系才是世界上最大的秘密，如现代物理学发现人的身体与水、石头等的基本物理微粒构造一样，但仍然无法解释人类为什么可以产生意识、情感。如果我们抓住了“事物之间的联系是世界之源”这个本质，那么大多数人工智能造假情况都就都可以被识破被痛击。


    人工智能造假技术可以通过深度态势感知或上下文感知技术进行相应的过滤、筛选排除，如一个正常人不会轻易做不正常的事，一个正常的机构也不会突然变得无法无天。但是非常时期、非常情境却有可能出现意外，所以一般性地识别并不难，难的是在特殊情形下的细微区分和细甄。除了常规性的防伪技术手段之外，我们还需要开发新的深度态势感知技术和工具，尽可能地在造假的前期进行识别干预，从态、势、感、知等几个阶段展开深入分析和应对，如开发隐藏在视频中的水印、生成隐藏信息的对抗神经网络、具有深度态势感知的声音、视频、图像、电话、网络分析器、反像素攻击等技术，还可以研究相应的管理应急机制方法和手段，加强相关的法律道德管理，及早制定相关的法律法规，做好相应的知识普及，让反人工智能造假技术相关应用能够真正落地到相关单位和千家万户之中，真正实现人、机、环境系统联动的反人工智能造假生态链。


    假的真不了，真的假不了，魔高一尺，道高一丈，毕竟，再好的人工智能都是人造的，而人工智能造的假不可能是完备的，人类本身就是应对不完备性最好的猎人，坏人在真实世界里得不到的东西在虚拟世界里也不会得到，毕竟以坏人为中心的情境是违反大多数人最根本利益的。


