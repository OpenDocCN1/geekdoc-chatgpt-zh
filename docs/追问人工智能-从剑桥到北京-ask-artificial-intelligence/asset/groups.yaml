    情况下，小数据学习方法将会有很大助益，因为小数据更加依赖分析的精度，而不是庞大的数据量。当然，小数据也有短板，即没有大数据的

    信息冗余作为补偿。


    ## 四、人的智慧对人工智能


    截至目前，机器的存储依然是通过形式化实现的，而人的智慧往往是通过形象化实现的，人工智能的计算是形式化进行的结果，而人的算计往往是客观逻辑加上主观直觉融合而成的结果。计算出的“预测”不影响结果，算计出的“期望”却时常改变未来，从某种意义上说，深度态势不是通过计算感知得到的，而是通过认知形成的，自主有利有弊，有悖有义，它是由内而外的尝试修正，是经历的验证-经验的类比迁移。如果说计算是脑机，那么算计就是心机，心有多大世界就有多大。


    有人认为，人工智能就是人类在了解自己、认识自己。实际上，人工智能只是人类在试图了解自己而已，因为“我是谁”这个坐标原点仍远远没有确定下来……“我是谁”的问题就是自主的初始问题，也是人所有智能坐标体系框架的坐标原点，记忆是这个坐标系中具有方向性的意识矢量（意向性），与冯·诺伊曼计算机体系的存储不同，这里面的程序规则及数据信息不是静止不变的，而是在人-机-环境系统交互中随机应变的（所以单独的类脑意义是不大的），这种变化的灵活程度常常反映出自主性的大小。例如，语言交流是自主的典范，是根据交互情景（不是场景）展开的，无论怎样测试，都是脚本与非脚本的反应，可以根据其准确性的大小判定人机孰是孰非……有人把语言分为“三指”，即指名、指心、指物，并指出研究这三者及其之间的关联一直是人工智能面临的难题和挑战。无独有偶，19世纪，英国学者就提出过能指、所指的概念，细细想来，这些恐怕都不外乎涉及事物的属性（能指、感觉）及其之间的关系（所指、知觉）问题吧！实际上，一个词、一句话、一段文都离不开自主的情境限定，我们知道的（所指）要远比我们能说出来的（能指）多得多吧？若不信，想想你见过的那些眼睛会说话的人吧！追根溯源，一般是缘于此中的情理转化机制：感性是理性的虫洞，穿越着理性的束缚与约束；理性是感性的黑洞，限制着感性的任性与恣意。正可谓，自主的意识驾驭着情理，同时又有情理奴役着……


    当前智能领域面临的最大困难是人的意向性与行为差异的程度，行为可以客观显性化，而意向性主观隐性化，意向性包括思与想，即反思和设想，反思是对经验的总结即前思，设想是面向未来的假定即后想，苦思冥想，目标都是为了解决当前的问题。


    形式化和意向性的区别是表和里的区别，也是现象和规律的区别，比如日落与腿疼。日落的表象是太阳落山，实际上是地球绕太阳转动这一客观规律的具体表象；腿疼的表象是腿疼，本质上是大脑特定部位的神经痛。


    意向性是主体对事物的感知，因此是内在的、个性化的。形式化是对客体的感知，如物理定理、数学公式脱离个体存在且为多数人所接受，因此是外在的、共性化的感知。


    “休谟问题”的具体含义是“从事实推不出价值”来，可是，这个世界却是一个事实与价值混合的世界，不知从价值（意义）能推出事实吗？汉字就是智能的集中体现，有形有意，如“日”“月”“人”，一目了然，心领神会；西方的文字常常无形无意，逻辑类推。智能的本质就是把意向性与形式化统一起来，所以汉字从象形到会意的过程，就是人类自然智能的发展简史。同时，人机智能融合中的深度态势感知就是意向性与形式化的综合。


    智能的本质在于自主与“相似”的判断，在于恰如其分地把握“相似度基准”分寸。人比机器优越的一点是：可以从较少的数据中更早地发现事物的模式。其原因之一就源于机器没有坐标原点，即“我”是谁的问题。对人而言，事物是非存在的有——其存在并不是客观的，而是我们带着主观目的观察的结果，并且这种主客观的混合物常常是情境的上下文产物，如围绕是、应、要、能、变等过程的建构与解构往往是同时进行的。另外，即使是同一种感觉，如视觉也具备具体指向与抽象意蕴，握手的同时除了生理接触外，还可以伴随心理暗示。人脑在进行自主活动时可以产生“从欧几里得空间到拓扑空间的映射”。也就是说，在做选择和控制时，人可以根据具体目的的不同，不断变化其依据进行的相似度基准（不是欧氏空间上的接近性，而是情理上的联系网络），并依此决定是否实施情境分类。


    与机相比，人的语言或信息组块能力强，拥有有限记忆和理性；机器对于语言或信息的组块能力弱，拥有无限记忆和理性，其语言（程序）运行和自我监督机制的同时实现应是保障机器可靠性的基本原则。人可以在使用母语时以不考虑语法的方式进行交流（非程式语言），并且在很多情境下可以感知语言、图画、音乐的多义性，如人的听觉、视觉、触觉等在具有辨别性的同时还具有情感性，常常能够知觉到只可意会不可言传的信息或概念（如对哲学这种很难通过学习得到学问的思考）。机器尽管可以下棋、回答问题，但对跨领域情境的随机应变能力很弱，对彼此矛盾或含糊不清的信息不能反应（缺少必要的竞争冒险选择机制），主次不分，综合辨析识别能力不足，不会使用归纳、推理、演绎等方法形成概念、提出新概念，更不用说能产生形而上学的理论形式。


    高手学习的方法是，先用感性能力帮助自己选择，再用理性能力帮助自己思考。感性是内在的意向性，是潜在因素的关联显化；理性是形式化的意向性，是显性的关联关系。


    除此之外，人的学习与机器学习的不同之处还在于：人的学习是碎片化＋完整性混合进行的，所以自适应能力比较强，一直在进行不足信息情境下的稳定预测和不稳定控制，失预、失控场景时有发生，所以如何二次、三次……多次及时地快慢多级反馈调整修正就显得越发必要。在这方面，人在非结构、非标准情境下的处理机制要优于机器，而在结构化、标准化场景下，机器相对而言要优于人类。并且，这种自适应性是累积的，慢慢会形成一种个性化的合理性期望，至此，自主（期望＋预测＋控制）机制开始产生且成长起来……智能不是百科全书，而是包含了不少的虚构和想象。虚构是智能的实质表征，从似曾相识、似是而非、似非而是等可强意会弱言传的现实存在可见一斑。


    > 想象力比知识更重要，因为知识是有限的，而想象力概括着世界上的切，推动着进步，并且是知识进化的源泉。


    主流机器学习的办法是，首先用一个“学习算法”从样本中生成一个“模型”，然后以此模型为算法解决实际问题。而实际上，问题常常不严格区分学习过程和解题过程，而是把整个系统运行分解成大量“基本步骤”，每一步由一个简单算法实现一个推理规则。这些步骤的衔接是实时确定的，一般没有严格可重复性（因为内外环境都不可重复）。因此，一个通用的智能系统应该没有固定的学习算法，也应该没有不变的解题算法，而且“学习”和“推理”应是同一个过程。


    另外，人的学习是因果关系、相关关系甚至于风俗习惯的融合，这些有的可以程序化，很多目前还很难描述清楚，如一些主观感受、默会知识等，而机器学习显性的知识内涵要远远大于隐性的概念外延。实际上，对人的认知过程而言，规则与概率之间的关系是弥聚性的，规则就是大概率的存在，概率在本质上则是没有形成规则的状态。习惯是规则的无意识行为，学习则是概率的累积过程，包含熟悉类比和生疏修正部分。一般而言，前者是无意识的，后者是有意识的，是一个复合过程。另外，人处理信息的过程是变速的，有时是自动化的下意识习惯释放，有时是半自动化的有意识与无意识平衡，有时则是纯人工的慢条斯理，但是这个过程不是单纯的信息表达传输，还包括如何在知识向量空间中建构组织起相应的语法状态，以及重构出各种语义、语用体系。


    自由调节的环境系统触发了自主体系的反向运动，由此形成了人、机与环境之间的多向运动或多重运动，进而导致了矛盾和冲突。这种不一致甚至相反问题的解决常常不是单纯数学知识力所能及的，一个问题有边界、有条件、有约束求解时是数学探讨，同一个问题无边界、无条件、无约束求解时往往变成了哲学研究，如虚构如何修正真实？真实如何反馈与虚构？这将是一个很有味道的问题。


    ## 五、深度态势感知的未来


    深度态势感知本质上就是变与不变、一与多、自主与被动等诸多悖论产生并解决的过程。所以，该系统不应是简单的人机交互，而应是贯穿整个人-机-环境系统的自主（包含期望、选择、控制，甚至涉及情感领域）认知过程。鉴于研究深度态势感知系统涉及面较广，极易产生非线性、随机性、不确定性等，所以其系统建模研究时常面临着较大的困难。在之前的研究中，多种有价值的理论模型被提出并用于描述态势感知系统行为，但这些模型在对实际工程应用系统的实质及影响因素方面考虑还不够全面，也缺乏对模型可用性的实验证证，所以本章重点就是针对深度态势感知概念的实质及影响因素这两个关键问题进行了较深入探讨，追根溯源，以期早日实现高效、安全、可靠的深度态势感知系统，并应用于相应的人机智慧产品或系统中。


    ## 第三章

    探索人机未来：人机融合智能


    “话说天下大势，分久必合，合久必分”，自然科学中的诸多学科之大势也莫不如次。在人类经历了数百年的学科精细分化之后，随着人工智能的快速发展，许多学科正在慢慢交叉融合起来。在经历了三次起伏后（即
    20 世纪 70 年代后期对数学定理证明非万能的清醒、90 年代后期对专家系统与五代机的失望、2006 年深度学习掀起了新一轮的浪潮），人们狂热的希望逐渐踏实了很多，目光也慢慢地从科幻转移到了一个崭新而又富有活力的领域：人机融合智能。


    深度态势感知作为认知领域的研究重点，其中就提到了人的智慧与机的智能统一问题。它立足于认知领域，参考人的态势感知方式，构建具有人机智慧的新的认知方式。这揭示了未来智能发展的方向，即人与机器的智慧融合——人机融合智能。从当前人工智能发展中的问题和局限我们可以推导出，人机融合智能才是当今智能时代的最佳解决方案。


    ## 一、人工智能的考验


    从历史上看，人工智能大概分三大门派，一是以模仿大脑皮质神经网络及神经网络间的连接机制与学习算法的联结主义（connectionism），主要表现为深度学习方法，即用多隐层的处理结构处理各种大数据；二是以模仿人或生物个体、群体控制行为功能及感知-动作型控制系统的行为主义（actionism），主要表现为具有奖惩控制机制的强化学习方法，即通过行为增强或减弱的反馈来实现输出规划的表征；三是以物理符号系统（即符号操作系统）具有产生智能行为的充分必要条件假设和有限理性原理为代表的符号主义（symbolicism），主要表现为知识图谱应用体系，即用模拟大脑的逻辑结构来加工处理各种信息和知识。正是由于这三种人工智能派别的取长补短，再结合蒙特卡罗算法（两种随机算法中的一种，如果问题要求在有限采样内，必须给出一个解，但不要求是最优解，那就用蒙特卡罗算法；反之，如果问题要求必须给出最优解，但对采样没有限制，那就用拉斯维加斯算法），使得特定领域的人工智能系统超过人类的智能成为可能，如国际商业机器公司的“沃森”问答系统和
    Google DeepMind 的“阿尔法狗”围棋系统等。尽管这些人工智能系统取得了骄人的绩效，但仍有不少不足之处，而且有可能会产生很大的隐患和危险。


    首先，分析一下让人工智能在当下炙手可热的联结主义。当前的人工智能热度不减，其主要原因是 2006 年辛顿提出的深度学习方法大大提高了图像识别、语音识别等方面的效率，并在无人驾驶、“智慧+”
    某些产业中切实体现出助力作用。然而，任何一种算法都有其不完备性，深度学习算法也不例外。该方法的局限性和不足之处在于：不可微分，弱监督学习（样本分布偏移大、新类别多、属性退化严重、目标多样），开放动态环境下该方法效果较差，计算收敛性不好。另外，相对于其他机器学习方法，使用深度学习生成的模型非常难以解释。这些模型可能有许多层和上千个节点，单独解释每一个节点是不可能的任务。数据科学家通过度量它们的预测结果来评估深度学习模型，但模型架构本身是个“黑盒”，它有可能会让你在不知不觉间失去“发现错误”的机会。再者，如今的深度学习技术还有另一个问题，它需要大量的数据作为训练基础，而训练所得的结果却难以应用到其他问题上。如何在各种现实情境任务中恰如其分地解决这些问题，就需要结合其他的方法取长补短、协调配合。


    其次，行为主义中的增强学习的优点是能够根据交互作用中的得失进行学习绩效的累积，与人类真实的学习机制相似。该方法最主要的缺点是把人的行为过程看得太过简单，实验中往往只是测量简单的奖惩反馈过程，有些结论不能迁移到现实生活中，所以往往外部效度不高。还有，行为主义貌似研究可以观察的行为，但是由于它的主张过于极端，不研究心理的内部结构和过程，否定意识的重要性，进而将意识与行为对立起来，进而限制了人工智能的纵深发展。


    最后，是符号主义及其知识图谱，符号主义属于现代人工智能范畴，基于逻辑推理的智能模拟方法模拟人的智能行为。该方法的实质就是模拟人的大脑抽象逻辑思维，通过研究人类认知系统的功能机理，用某种符号来描述人类的认知过程，并把这种符号输入能处理符号的计算机中，从而实现人工智能。符号主义的思想可以简单地归结为“认知即计算”。从符号主义的观点来看，知识是信息的一种形式，是构成智能的基础。知识表示、知识推理、知识运用是人工智能的核心，知识可用符号表示，认知就是符号的处理过程，推理就是采用启发式知识及启发式搜索对问题求解的过程，而推理过程又可以用某种形式化的语言来描述，因而有可能建立起基于知识的人类智能和机器智能的同一理论体系。目前知识图谱领域面临的主要挑战包括：知识的自动获取、多源知识的自动融合、面向知识的表示学习、知识的推理与应用。符号主义主张用逻辑方法建立人工智能的统一理论体系，但遇到了“常识”问题的障碍，以及不确知事物的知识表示和问题求解等难题，因此，受到其他学派的批评与否定。


    从上述人工智能三大流派的特点及缺点分析，我们不难看出，人的思维很难在人工智能现有的理论框架中得到解释。那该如何做才有可能寻找到一条通往智能科学研究的光明前程之路呢？下面我们将针对这个问题展开思考和讨论。


    ## 二、人工智能的道路是有限的


    “计算机之父”图灵的朋友和老师维特根斯坦在他的《逻辑哲学论》中写道：“世界是事实的总和而非事物的总和。”其中的事实是指事物之间的关涉联系——关系，而事物是指事物的各种属性，就目前人工智能技术的发展态势而言，绝大多数都是在做识别事物属性方面的工作，如语音、图像、位置、速度等，而涉及事物之间的各种关系层面工作还很少，但是已经开始做了，如大数据挖掘等。面对眼花缭乱的人工智能技术，人们常常思考着这样一个问题：什么是智能？智能的定义究竟是什么？


    关于智能的定义，有人说是非存在的有，有人说是得意忘形，有人说是随机应变，有人说是鲁棒适应，有人说可能有一百个专家就有一百种说法。实际上，现在要形成一个大家都能接受的定义是不太可能的，但是这并不影响大家对智能研究中的一些难点、热点达成一致看法或共识，如信息表征、逻辑推理和自主决策等。


    一般而言，任何智能都是从数据输入开始的，对人而言，数据就是各种刺激（眼、耳、鼻、舌、身）；对机器而言，数据就是各种传感器采集到的各种数据，数据是相对客观的，而从中提炼出有价值的数据——信息就是相对主观的，信息带有人
    的价值观、偏好倾向和风俗习惯特征。人机处理数据最大的差异在于形成信息的表征，机器中的数据常常是结构化归一量化后的“标准数据”，数据表征的符号就是0、1或其他进制的数字；人采集到的数据则是各种非结构化、非一致性不同量纲种类的刺激输入，其表征方式是极其灵活多变的，对一朵花、一棵树甚至可以有无限多种表征，正所谓“一花一世界、一树一菩提”，而且表征出的信息符号是由“能指”“所指”构成的，“能指”指具体的物理刺激形象，“所指”指信息所反映的事物的概念及拓扑关系。比如，对于一杯水，机器可能表征它为高度、宽度、密度、颜色等客观数值参数，而人除此之外，还可以把它表征为热情、友谊、问候、送客等方面的多维内涵外延拓展，这种千差万别的混合指向变化，机器无论如何是表征不出，也处理不了的……所以，从智能的源头就可以找到人工智能与人类智能的根本区别之所在。数据的变化与动态映射是感知的瓶颈，人会期望性地补偿或回望性地修正，而机器就是把“过去性”（数据）当成“当下性”来处理，若数据处理过程中不敏感则罢，若是临界性数据，就常常会差之毫厘谬以千里了。数据、信息、知识、逻辑本质上就是事物之间不同程度的关系表征，这种表征可以体现在人的记忆和直觉之间，也可以显示于机器的存储与计算之中。只不过机器数据的单一表征从一开始就异于人的多种刺激融合，这也是机器不能产生类人意向性的主要原因：缺乏灵活的一多分有（内涵外延伸张弥聚有度自如）的表征机制。


    有人认为符号化和对象化可能是两个不同的步骤。一个对象可以没有符号名字，也可以有多个符号名字，一个符号可以表示多个不同对象。智能的理解要做到符号到对象的指向性，没有做到指向性，只是符号间关系的处理，不能算理解。实际上对人而言，感与知往往是同步的，在形成习惯风俗后，对象与符号应该是融合的。


    有了数据和信息之后，智能的信息处理架构就格外重要了。截至目前，有不少大家提出了一些经典的理论或模型，例如在视觉领域，大卫·马尔（David Marr）的三层次理论结构至今仍为许多智能科技工作者所追捧。作为视觉计算理论的创始人，马尔认为，神经系统所做的信息处理与机器相似。视觉是一种复杂的信息处理任务，目的是要把握对我们有用的外部世界的各种情况，并把它们表达出来。这种任务必须在三个不同的水平上来理解，这就是计算理论、算法、机制。


    马尔早先提出的一些基本概念在计算理论这一级水平上已经成为一种几乎是尽善尽美的理论。这一理论的特征就是它力图使人的视觉信息处理研究变得越来越严密，从而使它成为一门真正的科学。


    当前，在解释人类认知过程工作机理的理论中，由卡耐基·梅隆大学教授约翰·罗伯特·安德森（John Robert Anderson）提出的 ACT-R（adaptive
    control of thought-rational）模型被认为是非常具有前途的一个理论。该理论模型认为，人类的认知过程需要四种不同的模块参与，即目标模块、视觉模块、动作模块和描述性知识模块。每一个模块各自独立工作，并且由一个中央产生系统协调。ACT-R
    的核心是描述性知识模块和中央产生系统。描述性知识模块存储了个体所积累的长期不变的认识，包括基本的事实（如“西雅图是美国的一座城市”）、专业知识（如“高速铁路交通信号控制方案的设计方法”）等。中央产生系统存储了个体的程序性知识，这些知识以条件-动作（产生式）规则的形式呈现，当满足一定条件时，相应的动作将被对应的模块执行，产生式规则的不断触发能够保证各个模块相互配合，模拟个体做出的连续认知过程。ACT-R
    是一种认知架构，用以仿真并理解人的认知的理论，该理论试图理解人类如何组织知识和产生智能行为，目标是使系统能够执行人类的各种认知任务，如捕获人的感知、思想和行为。


    无论是大卫·马尔的三层次结构计算视觉理论，还是约翰·罗伯特·安德森的 ACT-R 理论模型，以及许多解释和模拟人类认知过程的模型，都存在一个共同的缺点和不足，即不能把人的主观参数和机器/环境中的客观参数有机地统起来，模型的弹性不足，很难主动地产生鲁棒性的适应性，更不要说产生情感、意识等更高层次的表征和演化。当前的人工智能与人相比，除了在输入表征和融合处理方面的局限外，在更基本的哲学层面就存在这先天不足，即回答不了“休谟问题”。


    “休谟问题”是指英国哲学家大卫·休谟（David Hume）在《人性论》的第一卷和《人类理智研究》中提出来的。休谟首先提出了一个未能很好解决的哲学问题，主要是因果问题和归纳问题，即所谓从“是”（being）能否推出“应该”（should），也即“事实”命题能

    '
  merge: 1
- raw:
  - '[PAGE 63]


    否推导出“价值”命题。休谟指出，由因果推理获得的知识，构成了人类生活所依赖的绝大部分知识。这个由休谟对因果关系的普遍、必然性进行反思所提出的问题被康德称为“休谟问题”。“休谟问题”表面上是一个著名的哲学难题，实际上更是一个人工智能的瓶颈和难点，当把数据表征为信息时，“能指”就是相对客观表示“being”，而“所指”就是主观表达“should”。


    从认识论角度，“应该”就是从描述事物状态与特征的参量（或变量）的众多数值中取其最大值或极大值，“是”就是从描述事物状态与特征的参量（或变量）的众多数值中取其任意值。从价值论角度，“应该”就是从描述事物的价值状态与价值特征的众多参量（或变量）中取其最大值或极大值，“是”就是从描述事物价值是状态与价值特征的参量（或变量）的众多数值中取其任意值。


    受偏好、习惯、风俗等因素的影响，即使是人类的认识论和价值论也经常出现非因果归纳和演绎。比如严格意义上而言，从“天行健”这个事实（being）命题是不能推出“君子以自强不息”这个价值观（should）命题的，但是随着时间的延续，这个类比习惯逐渐变成了有些因果的意味。人工智能的优势不仅在于存储量大、计算速度快，更重要的是，它在精度上优势明显，但是要处理类似虽是由人类提出的但仍远远不能完美回答的“休谟问题”恐怕还是“强机所难”吧！人工智能如果有一定的智能，恐怕更多的应是数字逻辑语言智能，在特定场景既定规则和统计又既定输出的任务下可以极大地提升工作效率，但在有情感、有意向性的复杂情境下仍难以无中生有、随机应变。未来智能科学的发展趋势必将会是人机智能的不断融合促进。


    # 三、未来是人机智能的融合


    简单地说，人机融合智能就是充分利用人和机器的长处形成一种新的智能形式。


    英国前任首相丘吉尔曾经说过：“你能看到多远的过去，你就能看到多远的未来。”所以，我们有必要看看人机智能融合的过去。任何新事物都有其产生的源泉，人机融合智能也不例外，它主要起源'
  - '[PAGE 64]


    于人机交互和智能科学这两个领域，而这两个领域的起源都与英国剑桥大学有着密切的关系：1940 年夏，当德国轰炸机飞向伦敦之际，人机交互与智能科学的研究序幕就被徐徐拉开。英国为了抵御德军的进攻，开始了雷达、飞机、密码破译方面的科技应用工作，当时在剑桥大学圣约翰学院建立了第一个研究人机交互问题的飞机座舱（Cambridge
    Cockpit），以解决飞行员在执行飞行任务时出现的一些错误和失误。另外，伦敦国王学院的毕业生图灵领导了对德军“恩尼格玛”密电文的破译……事实上，早在 19
    世纪，剑桥大学的查尔斯·巴贝奇和阿达·奥古斯塔（剑桥大学毕业的诗人拜伦的女儿，世界上首位程序员）就开始合作机械计算机软硬件的研制，20 世纪之后，数学家罗素、逻辑学家维特根斯坦（图灵的老师和朋友）都对智能科学的起源和发展做出了重大的贡献。当前，人机智能融合领域“深度学习之父”辛顿曾是剑桥大学心理系的学生，“阿尔法狗之父”哈萨比斯是剑桥大学计算机系毕业的。


    在人机智能融合时，有一件事非常重要，就是这个人要能够理解机器如何看待世界，并在机器的限制内有效地进行决策。反之，机器也应对配合的人比较“熟悉”，就像一些体育活动中的双打队友一样，如果彼此间没有默契，想产生化学变化般的合适融合、精确协同就如同天方夜谭。有效的人机智能融合常常意味着将人的思想带给机器，这也就意味着，人将开始有意识地思考他通常无意识地执行的任务；机器将开始处理合作者个性化的习惯和偏好；两者还必须随时随地地随环境的变化而变化……高山流水，电脑与心灵相互感应，充分发挥两者的优点和长处，如人类可以打破逻辑运用直觉思维进行决策、机器能够检测人类感觉无法检测到的信号能力等。人类所理解的每一个命题，都必定是由我们所获知的各种成分所组成的。


    人机智能难于融合的一个重要原因还在于时空和认知的不一致性，人处理的信息与知识能够变异，其表征的一个事物、事实既是本身同时又是其他事物、事实，一直具有相对性，机器处理的数据标识缺乏这种相对变化性。更重要的是，人意向中的时间、空间与机形式中的时间、空间不在同一尺度上，一个偏重心理而一个更侧重于物'
  - '[PAGE 65]


    理；在认知方面，人的学习、推理和判断随机应变，时变法亦变，事变法亦变，机的学习、推理和判断机制是特定的设计者为特定的时空任务拟定或选取的，与当前时空任务中的使用者意图常常不完全一致，可变性较差。人的意向性与空间无关，只与时间延展性有关，而机的形式化系统常常与时空都有关。找到一种可产生意向性的形式化手段是通往人机智能有效融合的关键，目前的数学、物理手段还不能承担这个重任，因为这只是智能——这个复杂性问题的两个方面。


    意识是一种对隐显关系的梳理，有时表现为直觉。人的直觉是同化、顺应之间的自由转换，能够灵活自如地进行不完全归纳和弹性演绎，更重要的是，这一切都是由内而外的自主行为。直觉经验本质上是一种感性，一种自动意识性关联和得意忘形。直觉是把存在性、可能性、意向性、潜在性勾兑显化的一种方式，也是把零碎、散化的数据信息知识非常逻辑表征，其中的黏合剂就是情感（机器所不具备的能力）一种独特的智能——情智，直觉本质上就是通情达理，能够隐约看见许多通过理性逻辑看不到的关系、联系，从而把许多平时风马牛不相及的属性、成分（包括主观臆想客观存在）关联在一起，形成某种意向性的可能存在。而机器更适合于分类聚类，利用人类部分可以描述化、程序化的形式语言实现强监督学习、构建认知模型、辅助决策等。当前，人机之间的理解与学习都是单向性的，好消息是，智能领域已经逐渐开始出现了双向性的苗头，人机之间开始理解一些以前认为不含理解成分的对象和事物，慢慢把人的主动性与机的被动性有效地混合起来。人处理其擅长的包含“应该”（should）等价值取向的主观信息，机器则计算其拿手的涉及“是”（being）等规则概率统计的客观数据，进而把“休谟问题”变成了一个可执行、可操作的程序性问题，也是把客观数据与主观信息统一起来的新机制，即需要意向性价值的时候由人来处理，需要形式化（数字化）事实的时候由机器来分担，从而产生了一种“人＋机＞人、人＋机＞机”的效果。


    相比人工智能，我们更愿意谈人机融合智能，也许人工智能更偏应用和技术，谈人机融合智能则可以更基础一些。另外，需要注意的是，人机融合智能本身不仅仅是科学问题，还涉及其他学科，如人文'
  - '[PAGE 66]


    艺术、哲学，甚至还有宗教神学。另外，智能不是人类独有的能力，还关涉其他生命体，如动物、植物等，那么，究竟什么是智能呢？美国第一届心理学协会会长威廉·詹姆斯（William
    James）说的一句话或许可见一斑：“智慧是一种忽略的艺术。”


    在人工智能的发展问题上，单纯的计算很难有大的突破，“认知＋计算”可能是智能的未来。如果把认知比作美女，将计算视作野兽，那么未来的智能科学就是美女与野兽，而数据则是美女牵着野兽的缰绳。要把这样的机遇变成现实，就需要与目前人工智能研究方向不同的新的研究课题，比如需要探索认知科学对于人类与动物如何学习与推理的研究，将其与计算科学结合，整合成最终能以人类的方式工作的系统。“being”与“should”的狭义结合就是数据与知识、结构与功能、感知与推理、直觉与逻辑、联结与符号、属性与关系的结合，也是未来智能体系的发展趋势……其广义结合是意向性与形式化、“美女”与“野兽”的结合。人工智能的“美女派”主要抓关系产生的关系，“野兽派”主要抓属性产生的关系。临界，是一种介于有序和无序之间的状态，是工作效率最大化的一种表现形式。人机融合智能就是要寻找到这种平衡状态，让人的无序与机的有序、人的有序与机的无序相得益彰，达到安全、高效、敏捷的结果。人是集多智能于一体的一多智能体。好的人机融合应该具有彼此间的带入感，根据不同的态势，进行提前的相互感知诱导和意图引领。


    既然我们很多时候无从得知因果之间的关系，只能得知某些事物总是会联结在一起，那么，我们有什么理由从对个别事例的观察中引出普遍性的结论呢？想象力、创造力是感性与理性的界面，也许人机智能的融合可以实现一定程度上主客观、感性与理性的相互适应性融合吧！'
