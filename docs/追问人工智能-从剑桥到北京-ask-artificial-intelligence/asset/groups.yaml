    # 一、人机交互，灵活助教


    在人工智能时代，各个领域都涌现出了许多与人工智能结合的应用，教育领域也不例外。教育工作者与科研人员在智能教育领域进行了许多积极的探索。智能教育的应用领域包括智能分析、智能校园、智能导师系统、智能测评、教育机器人等，涵盖教育中所涉及的诸多环节。在这些环节中，知识表示、自然语言处理、智能代理、情感计算、机器学习和深度学习技术等均可有充分的应用。智能教育中的智能主要体现在：对被教育人的状态、教育人的资源，以及学习的效果进行不断监控，以自动地进行教学或调整教学的计划和资源分配。实际上，就是教育过程的自主适应和个性化调控的部分，其中很大一部分应用场景可被归纳为自适应学习。


    传统的学习系统对所有学生一视同仁，无视学生之间的个体差异；而更加自适应、个性化且智能的学习方式则能够实现因材施教，能够显著提升教学效果，成为智能教育不可或缺的一部分。因材施教从古至今一直是教育中的一项重要原则。从中国孔子和私塾的教育理念开始，到剑桥大学的传统导师制度，都是践行因材施教的个性化教育方式的典型例子。这种智能的学习方式不仅给予优秀学员更大的成长空间，而且能够充分照顾成绩较差的学生，而不像传统课堂教学无视个性差异的教育方式。随着互联网技术的发展、人工智能算法的进步、在线教育数据的积累，自适应学习系统的实现不再是天方夜谭，其中科大讯飞的高考机器人、Knewton
    的适应性学习平台更是让我们看到了智能教育的曙光。


    早在 20 世纪 50 年代的程序教学开始，教育就和计算机有了紧密的联系，在先后经历了计算机辅助教学、生成性计算机辅助教学、智能教学系统以后，才逐渐向自适应学习的方向发展，发展成为个性化的智能学习。自适应的智能学习方法的理论依据是
    1973 年哈特利等提出的智能教学系统基本架构。这个框架自提出起就得到各个国家的广泛重视，对其开展了众多的研究。例如，美国的彼得研究成果最丰'
  - '[PAGE 121]


    富，提出了第一个自适应学习系统通用模型，也称为 AEHS 模型。后续也涌现出了 AHAM、LAOS、XAHM 和 WebML 等多个参考模型，自适应的智能学习方面的理论研究在不断地进行革新和完善。同时，有许多智能教育系统不断进入市场，其中当前应用较好的有
    ALEKS、Knewton、CogBooks。国内也涌现出了一大批个性化学习网站。随着理论和技术应用的不断发展，在智能教育方面，教学资源由最初与教学策略绑定的文本丰富为独立的超文本，进而变为超媒体，增加了教学资源的灵活性和多样性；教学策略由最初固化到程序的学习路径变为根据学生反应动态选择，进而变为个性化推荐；教学方式由最初学生机械地自学变为教师科学地传授，进而变为学生主动地建构知识。学生的建模也由最初的一视同仁变为“刺激-反应”型动态地评价，进而变为涵盖基本信息、学习风格、知识状态等多方面的学生模型。


    自 1994 年哈莱茨（Halasz）和施瓦茨（Schwartz）提出德克斯特超文本参考模型以来，无论自适应学习系统的物理实现分为几层，通用参考模型一般包括学员模型、领域知识模型、知识推荐模型、测试模块模型。


    其中，学员模型是自适应学习系统的核心组件，它记录了学员的基本信息、知识水平、学习历史和学习风格。像年龄、性别等的基本信息在用户注册时就能搜集完成，并且在整个学习过程当中是不变的；知识水平是学员对于知识的掌握程度，由系统中的测试模块动态更新状态；作为数据挖掘的基础，学习历史的更新覆盖整个自适应学习的生命周期，是学员对于学习过程的完整记录；学习风格是学员在学习过程中表现出的不同学习偏好，因此成为个性化内容导航和内容呈现方式的重要依据，对于虚拟维修系统中学习的自适应性具有重要影响，而学习风格信息的搜集方式是多种多样的。


    领域知识模型标识了学员所要掌握知识的全集，也是自适应学习系统的另一核心组件，记录了相关领域的术语及其之间的关系。目前领域知识模型的表示方式多种多样，包括知识图谱、本体论、知识空间、概念图等，构建方式根据人为参与因素的多少分为专家制定、自'
  - '[PAGE 122]


    动化构建、半自动化构建。专家制定是指专家根据自己对于该领域的积淀人工制定领域模型，工作烦琐，而且严重依赖领域专家自身的水 平，系统的可移植性非常差。自动化构建是使用统计、自然语言处
    理、机器学习等技术自动化挖掘领域知识，从而完成领域知识模型的 构建，这种方式的准确度低，但是可移植性非常好。半自动化构建是 指综合使用人工专家、自动化构建技术来完成领域知识模型的构建。
    在自动化构建知识模型时，需要使用关键词提取技术发现领域术语， 使用关系提取技术发现领域术语之间的关系，进而完成虚拟维修系统 中机械领域知识模型的构建。


    知识推荐是教学资源到学习者本身的映射函数，同时是自适应学 习系统智能性水平的决定因素，包括内容导航和自适应内容呈现。其 中，内容导航是指根据学员模型个性化生成学习路径，完成知识到学
    员的映射，帮助学员通过学习建构自己的知识模型。自适应内容呈现 是指将适当类型的教学资源以适当的方式提供给学员，以适应学员的 学习风格。比如有人喜欢观看课件，有人喜欢观看桌面式系统演示，
    有人喜欢观看沉浸式系统的演示，有人喜欢学习抽象的概念，有人喜 欢操作。优秀的知识推荐模型能够针对学员的特点，让他们以最适合 自己的方式学到最需要的知识，提高学习效率。


    测试模块是衡量学员知识掌握水平的重要方式，先进的自适应测 试技术仅需要简短的测试就可以精准找到学员的盲点和薄弱点。高效 快速的自适应测试，能够节省学员时间，提高学习效率，从而克服传
    统虚拟维修系统中对所有学员一视同仁的弊端。


    更加智能的教育方式，能够让学习者发现学习过程中最为舒适、 自然的方式。除了能够提高学习效率外，还能够让学习者对学习产生 更大的兴趣，从而积极主动地学习。虽然取得了许多的研究成果，但
    更多的發展还需要在投入实践中应用后不断地对系统进行完善，因此 需要在真正的教学环境中，让教师和学生不断地进行尝试和反馈。在 未来的智能教育发展中，我们需要不断地对自适应学习技术进行完
    善，推出更具有针对性的学生学习系统，让教育变得更加智能化和个 性化，学生们能够更加舒适高效地接受学习。'
  - '[PAGE 123]


    # 二、人类知识探秘


    人不仅具有关于事实的陈述性知识（declarative knowledge）和关于如何完成各种认知活动的程序性知识（procedural knowledge），还有更多默会知识，而对这些知识的表征、处理和使用才是真正的智能之源，但这需要社会化和交互作用才能形成的，如反映价值的意向性知识（should
    knowledge）就是人工智能的极限。


    在生活中，目标帮助我们集中注意和精力，并表明我们想要完成的任务。同理，在人工智能研究领域，目标表明了我们想让机器学习的结果。机器学习的核心就是“期望机器通过训练过程后获得改变的方式的明确表达。一个系统如果能够根据它所知的信息（知识、时间、资源等）做出最好的决策，就是理性的思考。归纳能力是指通过大量实例，总结出具有一般性规律的知识的能力。”那么，如何让机器更好地像人一样掌握不同知识的学习？下面就让我们了解一下著名心理学家布鲁姆是如何对人类学习、教学和评估进行分类的。


    学习目标首先是由认知过程和知识维度定义的，用于指导学习、教学、评估更好地进行。目标的陈述包括一个动词和一个名词：动词一般描述预期的认知过程，名词一般描述期望学生掌握建构的知识。而认知过程维度则包括六个类目，即记忆、理解、运用、分析、评价和创造。决定认知过程维度的连续统一体被认为是认知的复杂性。也就是说，假定理解比记忆的认知程度更复杂，运用比理解的认知过程更复杂，以此类推。


    在研究教育问题中最普遍和最长久的课程问题之一是：什么是值得我们学习的？这是第一个组织问题。抽象地说，问题的答案界定了什么是受过教育的人。更具体地说，有时候答案界定了所教学科的意义。但是，单有标准并不必然会提供一个充分和可靠的答案。杂货清单式的标准可能比令人启发和有用的标准更让人模糊、沮丧。老师仍然需要回答“什么是值得学习的”这个问题。而他们主要靠课堂时间的分配和告诉学生实际的重点是什么来回答这个问题。而通过分类表（表6-1），教师能更清楚地看到可能的目标的排列和它们之间的关联。'
