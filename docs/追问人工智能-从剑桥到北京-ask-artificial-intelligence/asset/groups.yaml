    control of thought-rational）模型被认为是非常具有前途的一个理论。该理论模型认为，人类的认知过程需要四种不同的模块参与，即目标模块、视觉模块、动作模块和描述性知识模块。每一个模块各自独立工作，并且由一个中央产生系统协调。ACT-R
    的核心是描述性知识模块和中央产生系统。描述性知识模块存储了个体所积累的长期不变的认识，包括基本的事实（如“西雅图是美国的一座城市”）、专业知识（如“高速铁路交通信号控制方案的设计方法”）等。中央产生系统存储了个体的程序性知识，这些知识以条件-动作（产生式）规则的形式呈现，当满足一定条件时，相应的动作将被对应的模块执行，产生式规则的不断触发能够保证各个模块相互配合，模拟个体做出的连续认知过程。ACT-R
    是一种认知架构，用以仿真并理解人的认知的理论，该理论试图理解人类如何组织知识和产生智能行为，目标是使系统能够执行人类的各种认知任务，如捕获人的感知、思想和行为。


