    计算机的游戏机理如图 5-2 所示：首先通过某种方式（读取视频流、游戏记录等）获得环境的原始数据，然后经过去重、去噪、修正等技术对数据进行预处理，并提取低级语义信息；经过降维、特征表示（人工或计算机自动提取），形成高级语义信息；再通过传统机器学习方法进行模式识别，进一步理解数据的意义；最后结合先前的经验（数据挖掘，或人工提取，或自学习产生的领域知识库）决策生成行动方案，进而执行行动改变环境，并进行新一轮的迭代。在每次迭代的过程中，智能体还可以学习新的经验和教训，进而进化成更加智能的个体。


