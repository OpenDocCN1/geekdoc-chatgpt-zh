    了一个对比，并肯定了本文对即时游戏中的既视现象进行研究的可行性，以下也将详细阐述。


    在即时游戏领域，玩家，尤其是游戏经验丰富的玩家往往会发现这样的情况：当到过一个场景后，再去另外一个类似场景时，往往会觉得以前来过这个地方，甚至会顺着以往的记忆去某些区域。又或是当玩过某款游戏后，重新接触另外一款游戏，在面对某些突发状况（比如敌人来袭）时，会不自觉地按动某个键位，而这个键位也许正是之前那款游戏在对敌时需要按动的关键性键位。这一切的叙述，相信接触过即时游戏的玩家都会引起共鸣，而这正是即时游戏中的既视现象。


    即时游戏中的既视感与现实中的既视感有相似又有不同：相似的是，它们都是对未曾经历的事情和场景产生的一种莫名的主观的熟悉感；不同的是，现实中的既视感产生并不是那么频繁，而且往往被认为是一种错觉，是一种预知性的、不真切的熟悉感，因为现实中的记忆繁杂，往往让人难以回忆起产生既视感的记忆来自何时何地，是哪个瞬间，所以现实中的既视感难以在实验室中模拟，是可遇而不可求的，这也因此成为科学界许多人不敢去触碰的禁区，蒙上了一层神秘的外纱。


    而即时游戏中的即视感大多源于游戏经历，与现实的丰富多彩、变化万千不同，游戏产业的高速发展，带来了五花八门的各类即时游戏供玩家们选择，但对即时游戏做过深入探究的或是资深的游戏玩家，都不难感受到，不同的即时游戏之间其实也有诸多相似的因素，而很多即时游戏采用的是同样的游戏模式，可以说当接触过一款即时游戏后，你再接触一款即时游戏时，必然会发现有很多熟悉的地方。相似的体验必然会带来熟悉感，所以在即时游戏中，既视感的出现会比现实中频繁。而游戏记忆也并不会像现实记忆那么繁杂，玩家们在产生既视感时，甚至能回忆起是曾经的哪个或是哪些瞬间，让自己在此刻产生了这样的熟悉感，这样的既视感还能促使玩家通过回忆想出解决当前状况的办法，所以即时游戏中的既视感并没有那么神秘，而本文也将利用游戏中的相似之处，通过实验触发即时游戏中的既视感，并研究即时游戏中的既视现象。


    ### （4）工业设计中的既视现象的运用

    日本著名设计师深泽直人将既视感熟练地运用到新产品的设计中，唤起人们对新产品的熟悉感。他往往会抽取现存的人和物之间本就存在的关系，寻找一种关于物体共同拥有的记忆导入新设计中，简单来说，就是无意识设计（without
    thought）。


    直观体现了“without thought”这个概念的示范性作品，正是深泽直人设计的CD播放器。第一次看到它，人们的大部分注意力就集中到这个拉线式开关上，在再简单不过的设计元素中，不需要提醒，直觉就会让你去拉动那条悬挂在空中的线，启动开关，音乐流泻而出，在下意识的动作中进而得到一个惊喜，谁能不为这个绝妙的设计所打动？这个早已熟悉的拉线动作，几乎是在无意识的状态下进行的，且时常出现在生活中，设计师只是将它放进设计中，赋予CD播放器一个“似曾相识”的新样式。


    我们又可以这么理解：人往往会在无意识状态下对同一事物产生相同的反应，他们在观看同一物件时，总会自然地找出对它感到有共鸣的地方。如果设计师能从生活和环境的观察中，抓住这些能让人产生共鸣、让人不假思索就能自然理解的元素，并运用到设计中，这个产品自然会是一个好的设计。


    而在即时游戏中，信息的输入、输出频繁且快速，玩家的意识活动更加强烈。适当在设计上巧妙运用既视感想必也能收到奇效。但在即时游戏中，既视感与哪些因素关系紧密？在设计时，又要如何把握这些因素让设计者能更好地在设计中把握既视感呢？这也引发了笔者的一系列思考。


    ### （5）对即时游戏中既视感的猜想

    基于对CD播放器的思考，我们认为既视感引导的是“without thought”无意识的行为，但引发既视感，需要意识参与吗？


    在设计中加入一根拉线，我们会不自觉去拉，但如果摆在我们面前的是一个快门，一个开关……我们会怎样？此时，我们的注意力被分散了，我们的第一选择还是那根拉线吗？


    所以在此，笔者大胆地做出了如下假设：注意作为意识活动中最不可或缺的功能，是最早在心理学中提出的概念之一，虽然既视感引导的往往是无意识行为，但要产生既视感，首先要有注意这一意识行为，又由于即时游戏中的信息融合现象显著，使用户往往面临着诸多繁杂信息输入，并且要对各类信息进行融合，根据融合信息做出决策，所以用户在游戏过程中，势必会面临着注意力分配的问题。


    所以，在正式实验中笔者将研究的内容之一就是，注意力强弱对既视感的影响。具体来说，就是研究如果在即时游戏中，用户是在注意集中情况下更容易产生既视现象，那么分别在注意力集中和分散的情况下进行实验，实验结果一定会出现显著差异。但如果既视现象属于不需要分配过多注意力的
    一种潜在记忆，只是稍稍一留神便可轻易触发，那么在注意力被分散的情况下，实验结果应该与注意力集中时相近。


    同时，即时游戏中既视现象和记忆程度是否相关，将是笔者研究的第二个问题，关于这个问题，首先，在预实验对其论证，再在正式实验时进一步深化。对场景的记忆程度，是否会影响既视感的产生，这既是对近年来科学界普遍认为既视现象的产生与长时记忆有关的一个论证，也是对第一个研究内容的一个补充。在即时游戏中，是不是对场景的记忆程度越深，越容易产生既视现象？或者有可能对场景的记忆程度在注意力集中时对既视现象的产生影响不是很大，但当注意力不集中时，记忆程度将会对既视现象产生显著影响？


    ## 6. 游戏人工智能的复杂性

    继图形和交互技术之后，人工智能成为游戏科技发展的瓶颈，人们不再单纯追求更真实、更美丽的画面，而是更人性、更智能的游戏伙伴（对手）。


    计算机思考问题的过程其实就是数值计算的过程，游戏人工智能的实现需要坚实的数学理论。最好的浅层机器学习算法 SVM，其求解目标在于确定一个二分类的超平面，以最大化样本在特征空间上的间隔，其中涉及线性空间到高维空间的映射、KKT
    最优化算法等。风头正劲的深度神经网络，无非就是在海量数据的基础上拟合出一个非常复杂的函数来实现特征学习、分类拟合，其中涉及卷积计算、蒙特卡罗方法、最优化求解等。在自主决策独树一帜的强化学习其实就是一个马尔科夫决策过程，通过不断迭代来不断更新内部的策略函数，最终实现自主决策，其中涉及随机过程、最优化求解等。简单而广泛使用的决策树，其分支依据有信息增益率、Gini
    准则等，其中涉及信息论等。在高级的人工智能中，数学无处不在，也从根本上制约着人工智能的发展，它的每一次突破都能引发人工智能的新一轮热潮。


    计算机思考问题的过程其实就是移位、与或非等计算的过程，所以任何人工智能算法的成功都依赖于大量的计算。震惊世界的 AlphaGo 最后一个版本共使用了 40
    个搜索线程，48 个中央处理器（CPU）和 8 个图形处理器（GPU）；多台机器实现的分布式 AlphaGo 版本共使用了 40 个搜索线程，1202 个
    CPU 和 176 个 GPU。谷歌大脑运用深度学习的研究成果，使用 1000 台电脑创造出包含 10 亿个连接的“神经网络”，使机器系统自动学会识别猫。海量数据的处理也使得并行计算框架
    Hadoop、Spark 等在人工智能中变得炙手可热。


    ## 7. 游戏人工智能的社会影响

    随着计算机硬件水平和软件技术的提升，我国的游戏产业迅猛发展，人工智能在游戏中的应用也更加广泛与完善，游戏的可玩性大幅增强，而游戏人工智能的发展也深受社会发展的影响，主要体现在以下四个方面。


    ### （1）强游戏的人性化

    随着社会老龄化程度的加深，空巢老人越来越多，这已经成为一个不容忽视的社会问题；城市中独生子女数量较多，父母工作繁忙致使他们平时缺少玩伴，而人性化的游戏智能可以起到陪伴、娱乐的作用，如果使用得当的话，还能寓教于乐。普通人在与计算机游戏对战时，并不希望自己面对的是一个冷冰冰的机器，而是有喜有忧、有血有肉的玩家，计算机的游戏水平也应该与玩家水平相近，既不能让玩家因无法胜利而沮丧，也不能让玩家容易取胜而感到无聊。所以在设计这种游戏智能时，除了高超的游戏水平之外，还要让游戏智能人性化，并调节自己的水平以适应玩家。


    ### （2）挑战智能极限

    近十年来，电子竞技在我国从一个被所有人误解的边缘化产业，逐步变成了一个成熟、庞大的新兴产业链条，电子竞技正在逐渐成长为一个不可忽视的庞大产业。其实自香农提出为计算机象棋博弈编写程序以来，追求更强、更智能游戏智能体的脚步就从未停止，战胜世界冠军李世石的“阿尔法狗”更是被认为突破了人类最后的堡垒。在设计这种游戏智能时，更关注的是提高游戏智能体的游戏水平，而不关注是否类人化，所以更像是“书呆子”。


    ### （3）不完全信息决策

    棋类等大多数游戏通常是有限状态、有规则的完全信息条件下的博弈，而像军事等现实世界具有高维、动态、不确定性的特点，是无规则的不完全信息下的决策。所以，人们也十分关心如何将游戏智能迁移运用到现实世界中，其中
    DeepMind 团队在战胜李世石后转战星际争霸，试图探索在状态更多、规则性更弱、信息不完全条件下的博弈；更有甚者，试图将 AlphaGo 技术应用到兵棋推演、军事空战决策中。


    ### （4）自主学习

    与“深蓝”“沃森”不同，DeepMind 团队的研究成果除了高超的游戏技能外，还在于其自主学习的能力和可迁移的能力，这也是它能够大放异彩的原因。人们一直希望建立一种游戏智能框架：它无须任何人为参与就能在不同的游戏中通过自主学习成为游戏高手，其中
    DeepMind 的 DRN 技术在无须人为参与、无须调整算法框架的情况下，只通过自主学习就能精通 7 种 Atari 2600 游戏，甚至在某些游戏中超过人类玩家。


    ## 8. 小结

    与模糊人类和机器的边界不同，游戏人工智能更关注挑战智力极限，表征是游戏战胜人类最强者；与教导人类成为领域专家不同，游戏人工智能更关注培育自学习能力的智能体，表征是无经验自主学习。所以，当前最先进的两个游戏引擎均使用了深度学习和强化学习两方面的知识，旨在培育具有自学习能力的高智能个体。


    当前大家最关注的莫过于 2016 年 3 月 “阿尔法狗” 与李世石的围棋之战。现在的 1：4 人机比分是否表示机器已经突破人类最后的堡垒？是否表示达到智能极限？游戏人工智能下一步的研究关注点又应该是什么？笔者认为，机器即使战胜李世石也没有达到人类智能的极限，与记忆和速算一样，搜索与前瞻的能力也不能代表人类智能，人类还有情感、有思想、能快速学习等，所以
    “阿尔法狗” 战胜了李世石也只是在某个领域比人类更强而已。游戏人工智能不能使用图灵测试、中文屋子来衡量人工智能的程度，因为人类在游戏（特别是棋类游戏）上的智能并不突出，人脑的复杂度有限，并不能计算游戏的最优值，只是在能力范围内做出较优的决策。笔者认为
    “游戏人工智能的关注点应该是：同一游戏引擎作为双方对战，总是同一方（先手或后手）取胜，而且能够战胜人类最强者”。所以，即使 “阿尔法狗” 战胜李世石，但棋类智能仍有探索的空间：游戏决策的最优值。


    本章探讨了人机交互和人工智能的起源和瓶颈问题，人工智能和智能科学的发展，包括三个基本阶段，第一个阶段是传统的人工智能，这个传统的人工智能已经有了游戏规则，其基本特质就是数学形式化的东西，加上在某一领域的展开。这其中还涉及一个自动化的问題，其实很多问题是自动化的问題，而不是人工智能的问題。自动化涉及的是结构化的数据处理，人工智能是非结构化的数据处理。第二个大的阶段是人-机-环境系统的交互领域，这个领域正在形成规则。这个规则主要体现在两个方面，即自动化的处理与弱人工智能。当前在这个领域，还要加上各个行业和各个研究的指向。第三个阶段就是未来的智慧化的强人工智能的信息系统领域，在这个领域，目前还没有游戏的规则，它主要体现在人的智慧加上未来的强人工智能，或一些通用的
    人工智能，还需要进行一些积极的探讨与多学科交叉研究。


    ## 第六章 人工智能：寓教有方

    智能是人类知识产生的还是通过搜索和学习获得的？抑或是通过知识＋搜索＋学习获得的？智能主要表现在可能性的大小上而不仅是现实性上吗？


    ## 一、人机交互，灵活助教

    在人工智能时代，各个领域都涌现出了许多与人工智能结合的应用，教育领域也不例外。教育工作者与科研人员在智能教育领域进行了许多积极的探索。智能教育的应用领域包括智能分析、智能校园、智能导师系统、智能测评、教育机器人等，涵盖教育中所涉及的诸多环节。在这些环节中，知识表示、自然语言处理、智能代理、情感计算、机器学习和深度学习技术等均可有充分的应用。智能教育中的智能主要体现在：对被教育人的状态、教育人的资源，以及学习的效果进行不断监控，以自动地进行教学或调整教学的计划和资源分配。实际上，就是教育过程的自主适应和个性化调控的部分，其中很大一部分应用场景可被归纳为自适应学习。


    传统的学习系统对所有学生一视同仁，无视学生之间的个体差异；而更加自适应、个性化且智能的学习方式则能够实现因材施教，能够显著提升教学效果，成为智能教育不可或缺的一部分。因材施教从古至今一直是教育中的一项重要原则。从中国孔子和私塾的教育理念开始，到剑桥大学的传统导师制度，都是践行因材施教的个性化教育方式的典型例子。这种智能的学习方式不仅给予优秀学员更大的成长空间，而且能够充分照顾成绩较差的学生，而不像传统课堂教学无视个性差异的教育方式。随着互联网技术的发展、人工智能算法的进步、在线教育数据的积累，自适应学习系统的实现不再是天方夜谭，其中科大讯飞的高考机器人、Knewton
    的适应性学习平台更是让我们看到了智能教育的曙光。


    早在 20 世纪 50 年代的程序教学开始，教育就和计算机有了紧密的联系，在先后经历了计算机辅助教学、生成性计算机辅助教学、智能教学系统以后，才逐渐向自适应学习的方向发展，发展成为个性化的智能学习。自适应的智能学习方法的理论依据是
    1973 年哈特利等提出的智能教学系统基本架构。这个框架自提出起就得到各个国家的广泛重视，对其开展了众多的研究。例如，美国的彼得森研究成果最丰富，提出了第一个自适应学习系统通用模型，也称为
    AEHS 模型。后续也涌现出了 AHAM、LAOS、XAHM 和 WebML 等多个参考模型，自适应的智能学习方面的理论研究在不断地进行革新和完善。同时，有许多智能教育系统不断进入市场，其中当前应用较好的有
    ALEKS、Knewton、CogBooks。国内也涌现出了一大批个性化学习网站。随着理论和技术应用的不断发展，在智能教育方面，教学资源由最初与教学策略绑定的文本丰富为独立的超文本，进而变为超媒体，增加了教学资源的灵活性和多样性；教学策略由最初固化到程序的学习路径变为根据学生反应动态选择，进而变为个性化推荐；教学方式由最初学生机械地自学变为教师科学地传授，进而变为学生主动地建构知识。学生的建模也由最初的一视同仁变为“刺激-反应”型动态地评价，进而变为涵盖基本信息、学习风格、知识状态等多方面的学生模型。


    自 1994 年哈莱茨（Halasz）和施瓦茨（Schwartz）提出德克斯特超文本参考模型以来，无论自适应学习系统的物理实现分为几层，通用参考模型一般包括学员模型、领域知识模型、知识推荐模型、测试模块模型。


    其中，学员模型是自适应学习系统的核心组件，它记录了学员的基本信息、知识水平、学习历史和学习风格。像年龄、性别等的基本信息在用户注册时就能搜集完成，并且在整个学习过程当中是不变的；知识水平是学员对于知识的掌握程度，由系统中的测试模块动态更新状态；作为数据挖掘的基础，学习历史的更新覆盖整个自适应学习的生命周期，是学员对于学习过程的完整记录；学习风格是学员在学习过程中表现出的不同学习偏好，因此成为个性化内容导航和内容呈现方式的重要依据，对于虚拟维修系统中学习的自适应性具有重要影响，而学习风格信息的搜集方式是多种多样的。


    领域知识模型标识了学员所要掌握知识的全集，也是自适应学习系统的另一核心组件，记录了相关领域的术语及其之间的关系。目前领域知识模型的表示方式多种多样，包括知识图谱、本体论、知识空间、概念图等，构建方式根据人为参与因素的多少分为专家制定、自动化构建、半自动化构建。专家制定是指专家根据自己对于该领域的积淀人工制定领域模型，工作烦琐，而且严重依赖领域专家自身的水
    平，系统的可移植性非常差。自动化构建是使用统计、自然语言处 理、机器学习等技术自动化挖掘领域知识，从而完成领域知识模型的 构建，这种方式的准确度低，但是可移植性非常好。半自动化构建是
    指综合使用人工专家、自动化构建技术来完成领域知识模型的构建。 在自动化构建知识模型时，需要使用关键词提取技术发现领域术语， 使用关系提取技术发现领域术语之间的关系，进而完成虚拟维修系统
    中机械领域知识模型的构建。


    知识推荐是教学资源到学习者本身的映射函数，同时是自适应学 习系统智能性水平的决定因素，包括内容导航和自适应内容呈现。其 中，内容导航是指根据学员模型个性化生成学习路径，完成知识到学
    员的映射，帮助学员通过学习建构自己的知识模型。自适应内容呈现 是指将适当类型的教学资源以适当的方式提供给学员，以适应学员的 学习风格。比如有人喜欢观看课件，有人喜欢观看桌面式系统演示，
    有人喜欢观看沉浸式系统的演示，有人喜欢学习抽象的概念，有人喜 欢操作。优秀的知识推荐模型能够针对学员的特点，让他们以最适合 自己的方式学到最需要的知识，提高学习效率。


    测试模块是衡量学员知识掌握水平的重要方式，先进的自适应测 试技术仅需要简短的测试就可以精准找到学员的盲点和薄弱点。高效 快速的自适应测试，能够节省学员时间，提高学习效率，从而克服传
    统虚拟维修系统中对所有学员一视同仁的弊端。


    更加智能的教育方式，能够让学习者发现学习过程中最为舒适、 自然的方式。除了能够提高学习效率外，还能够让学习者对学习产生 更大的兴趣，从而积极主动地学习。虽然取得了许多的研究成果，但更多的發展还需要在投入实践中应用后不断地对系统进行完善，因此
    需要在真正的教学环境中，让教师和学生不断地进行尝试和反馈。在 未来的智能教育发展中，我们需要不断地对自适应学习技术进行完 善，推出更具有针对性的学生学习系统，让教育变得更加智能化和个
    性化，学生们能够更加舒适高效地接受学习。


    ## 二、人类知识探秘

    人不仅具有关于事实的陈述性知识（declarative knowledge）和关于如何完成各种认知活动的程序性知识（procedural knowledge），还有更多默会知识，而对这些知识的表征、处理和使用才是真正的智能之源，但这需要社会化和交互作用才能形成的，如反映价值的意向性知识（should
    knowledge）就是人工智能的极限。


    在生活中，目标帮助我们集中注意和精力，并表明我们想要完成的任务。同理，在人工智能研究领域，目标表明了我们想让机器学习的结果。机器学习的核心就是“期望机器通过训练过程后获得改变的方式的明确表达。一个系统如果能够根据它所知的信息（知识、时间、资源等）做出最好的决策，就是理性的思考。归纳能力是指通过大量实例，总结出具有一般性规律的知识的能力。”那么，如何让机器更好地像人一样掌握不同知识的学习？下面就让我们了解一下著名心理学家布鲁姆是如何对人类学习、教学和评估进行分类的。


    学习目标首先是由认知过程和知识维度定义的，用于指导学习、教学、评估更好地进行。目标的陈述包括一个动词和一个名词：动词一般描述预期的认知过程，名词一般描述期望学生掌握建构的知识。而认知过程维度则包括六个类目，即记忆、理解、运用、分析、评价和创造。决定认知过程维度的连续统一体被认为是认知的复杂性。也就是说，假定理解比记忆的认知程度更复杂，运用比理解的认知过程更复杂，以此类推。


    在研究教育问题中最普遍和最长久的课程问题之一是：什么是值得我们学习的？这是第一个组织问题。抽象地说，问题的答案界定了什么是受过教育的人。更具体地说，有时候答案界定了所教学科的意义。但是，单有标准并不必然会提供一个充分和可靠的答案。杂货清单式的标准可能比令人启发和有用的标准更让人模糊、沮丧。老师仍然需要回答“什么是值得学习的”这个问题。而他们主要靠课堂时间的分配和告诉学生实际的重点是什么来回答这个问题。而通过分类表（表6-1），教师能更清楚地看到可能的目标的排列和它们之间的关联。

