    ## 三、未来是人机智能的融合


    简单地说，人机融合智能就是充分利用人和机器的长处形成一种新的智能形式。


    英国前任首相丘吉尔曾经说过：“你能看到多远的过去，你就能看到多远的未来。”所以，我们有必要看看人机智能融合的过去。任何新事物都有其产生的源泉，人机融合智能也不例外，它主要起源于人机交互和智能科学这两个领域，而这两个领域的起源都与英国剑桥大学有着密切的关系：1940
    年夏，当德国轰炸机飞向伦敦之际，人机交互与智能科学的研究序幕就被徐徐拉开。英国为了抵御德军的进攻，开始了雷达、飞机、密码破译方面的科技应用工作，当时在剑桥大学圣约翰学院建立了第一个研究人机交互问题的飞机座舱（Cambridge
    Cockpit），以解决飞行员在执行飞行任务时出现的一些错误和失误。另外，伦敦国王学院的毕业生图灵领导了对德军“恩尼格玛”密电文的破译……事实上，早在 19
    世纪，剑桥大学的查尔斯·巴贝奇和阿达·奥古斯塔（剑桥大学毕业的诗人拜伦的女儿，世界上首位程序员）就开始合作机械计算机软硬件的研制，20 世纪之后，数学家罗素、逻辑学家维特根斯坦（图灵的老师和朋友）都对智能科学的起源和发展做出了重大的贡献。当前，人机智能融合领域“深度学习之父”辛顿曾是剑桥大学心理系的学生，“阿尔法狗之父”哈萨比斯是剑桥大学计算机系毕业的。


    在人机智能融合时，有一件事非常重要，就是这个人要能够理解机器如何看待世界，并在机器的限制内有效地进行决策。反之，机器也应对配合的人比较“熟悉”，就像一些体育活动中的双打队友一样，如果彼此间没有默契，想产生化学变化般的合适融合、精确协同就如同天方夜谭。有效的人机智能融合常常意味着将人的思想带给机器，这也就意味着，人将开始有意识地思考他通常无意识地执行的任务；机器将开始处理合作者个性化的习惯和偏好；两者还必须随时随地地随环境的变化而变化……高山流水，电脑与心灵相互感应，充分发挥两者的优点和长处，如人类可以打破逻辑运用直觉思维进行决策、机器能够检测人类感觉无法检测到的信号能力等。人类所理解的每一个命题，都必定是由我们所获知的各种成分所组成的。


    人机智能难于融合的一个重要原因还在于时空和认知的不一致性，人处理的信息与知识能够变异，其表征的一个事物、事实既是本身同时又是其他事物、事实，一直具有相对性，机器处理的数据标识缺乏这种相对变化性。更重要的是，人意向中的时间、空间与机器形式中的时间、空间不在同一尺度上，一个偏重心理而一个更侧重于物理；在认知方面，人的学习、推理和判断随机应变，时变法亦变，事变法亦变，机器的学习、推理和判断机制是特定的设计者为特定的时空任务拟定或选取的，与当前时空任务中的使用者意图常常不完全一致，可变性较差。人的意向性与空间无关，只与时间延展性有关，而机器的形式化系统常常与时空都有关。找到一种可产生意向性的形式化手段是通往人机智能有效融合的关键，目前的数学、物理手段还不能承担这个重任，因为这只是智能——这个复杂性问题的两个方面。


    意识是一种对隐显关系的梳理，有时表现为直觉。人的直觉是同化、顺应之间的自由转换，能够灵活自如地进行不完全归纳和弹性演绎，更重要的是，这一切都是由内而外的自主行为。直觉经验本质上是一种感性，一种自动意识性关联和得意忘形。直觉是把存在性、可能性、意向性、潜在性勾兑显化的一种方式，也是把零碎、散化的数据信息知识以非逻辑表征，其中的黏合剂就是情感（机器所不具备的能力）一种独特的智能——情智，直觉本质上就是通情达理，能够隐约看见许多通过理性逻辑看不到的关系、联系，从而把许多平时风马牛不相及的属性、成分（包括主观臆想客观存在）关联在一起，形成某种意向性的可能存在。而机器更适合于分类聚类，利用人类部分可以描述化、程序化的形式语言实现强监督学习、构建认知模型、辅助决策等。当前，人机之间的理解与学习都是单向性的，好消息是，智能领域已经逐渐开始出现了双向性的苗头，人机之间开始理解一些以前认为不含理解成分的对象和事物，慢慢把人的主动性与机的被动性有效地混合起来。人处理其擅长的包含“应该”（should）等价值取向的主观信息，机器则计算其拿手的涉及“是”（being）等规则概率统计的客观数据，进而把“休谟问题”变成了一个可执行、可操作的程序性问题，也是把客观数据与主观信息统一起来的新机制，即需要意向性价值的时候由人来处理，需要形式化（数字化）事实的时候由机器来分担，从而产生了一种“人＋机＞人、人＋机＞机”的效果。


    相比人工智能，我们更愿意谈人机融合智能，也许人工智能更偏应用和技术，谈人机融合智能则可以更基础一些。另外，需要注意的是，人机融合智能本身不仅仅是科学问题，还涉及其他学科，如人文艺术、哲学，甚至还有宗教神学。另外，智能不是人类独有的能力，还关涉其他生命体，如动物、植物等，那么，究竟什么是智能呢？美国第一届心理学协会会长威廉·詹姆斯（William
    James）说的一句话或许可见一斑：“智慧是一种忽略的艺术。”


    在人工智能的发展问题上，单纯的计算很难有大的突破，“认知＋计算”可能是智能的未来。如果把认知比作美女，将计算视作野兽，那么未来的智能科学就是美女与野兽，而数据则是美女牵着野兽的缰绳。要把这样的机遇变成现实，就需要与目前人工智能研究方向不同的新的研究课题，比如需要探索认知科学对于人类与动物如何学习与推理的研究，将其与计算科学结合，整合成最终能以人类的方式工作的系统。“being”与“should”的狭义结合就是数据与知识、结构与功能、感知与推理、直觉与逻辑、联结与符号、属性与关系的结合，也是未来智能体系的发展趋势……其广义结合是意向性与形式化、“美女”与“野兽”的结合。人工智能的“美女派”主要抓关系产生的关系，“野兽派”主要抓属性产生的关系。临界，是一种介于有序和无序之间的状态，是工作效率最大化的一种表现形式。人机融合智能就是要寻找到这种平衡状态，让人的无序与机的有序、人的有序与机的无序相得益彰，达到安全、高效、敏捷的结果。人是集多智能于一体的一多智能体。好的人机融合应该具有彼此间的带入感，根据不同的态势，进行提前的相互感知诱导和意图引领。


