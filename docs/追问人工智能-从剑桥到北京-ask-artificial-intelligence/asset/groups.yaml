    ## 三、传播中的智能


    智能（包括人工智能），本质上是“人”学，就是从模仿人的智能开始，具体表现为：智能的输入是模拟人的各种感觉的信息处理传感器，处理是仿真人的各种推理方法，输出是效仿人的决策行为过程，而在整个智能程序中，最终还是人起作用、为人服务、向人学习。


    智能的实质就是适应性交互（不一定是自适应，还包括他适应的混合），传播是指两个相互独立的系统之间，利用一定的媒介和途径所进行的有目的的信息传递活动。而传播的实质是一种信息分享过程，双方都能在传递、交流、反馈等一系列过程中分享信息，在双方沟通信息的基础上取得理解、达成共识。如果我们把两者结合起来看，智能传播的实质就是颠覆以往的交流交互方式，包括自我、人人、人物（机）、人物（机）环境等方面，历次革命，如蒸汽机、电动机、计算机（网络）、智能机、人＋机等都是如此。


    智能传播的重点是人的变化而不是僵化，即加快了人的自否性（进化迭代的过程）和反身性（就是人与传播的相互影响），自否定（自由）和反身性（反思）构成了人机智能传播的人文性，包括能动的创造性。而机器没有自否性和反身性，但是人的态、势、感、知中都包含隐性的自否性和反身性成分。人可以既是又不是，是“关系”而不是“属性”。罗素曾希望通过对“既是又不是”的两个“是”字的语义区分来排除悖论、矛盾，比如说“苏格拉底是人”“苏格拉底又不是人”（不等同于人），此中前一个“是”意味着具有某种“属性”，后一个“是”则意味着“等同”，两个命题讲的不是一回事，构不成逻辑矛盾。若“态”为“是”（being），那么“势”即“应”（should），从认识论角度看，“态”或“是”就是从描述事物状态与特征的参量（或变量）的众多数值中取其任意值，“势”或“应该”就是从描述事物状态与特征的参量（或变量）的众多数值中取其最大值或极大值。从价值论角度，“态”或“是”就是从描述事物价值状态与价值特征的参量（或变量）的众多数值中取其任意值，“势”或“应该”就是从描述事物的价值状态与价值特征的众多数值中取其最大值或极大值。


    价值是智能传播中人机态势感知的核心，其体现的不是原有的产生过程，而是人-机-环境系统的共同作用生成的显性和隐性部分，而隐性部分更值得深思。抽象符号间的联系不能产生知识和意义，形式符号系统的语义解释和知识建构何以内在于系统而不依赖于人的定义，应该是未来智能传播研究的核心理问题。势是（人、物、环境）各部分之间的一种价值秩序和结构，是一种主观方面的“内外相应”心理作用，所以有人说，“势不是事物本身的属性，它只存在于观察者的心里。每一个人心里见出一种不同的势”。不过，这并不否认势与对象的各部分之间的秩序和结构有关，只是肯定对象的形式因素要适应人心的特殊构造，才能产生势觉。势的本质为事物的杂多状态与它的内在本质的协调一致性表征。势产生的原则不在于客观的规则逻辑和状态的概率计算，而只在于个性方面中有意义和显出特征的东西。其最高原则是从显出特征的东西开始，达到意蕴——小信息、弱概率的大反映、强运筹，能够用感性表达理性，用虚拟诱导现实，用
    should 实现 being。总之，势是人们理念的感性价值显现。


    ## 四、法律约束下的智能传播


    动物的智能更多是生理性的，人类的智能除了是生理性的之外，还有心理性和社会性。德国有句谚语“秩序是生命的一半”。生命的另一半就是非秩序。现代电工学中有个名词叫作“击穿”，就是在高电压下绝缘体会变成导体，人类也有一种逻辑击穿能力，即在一定的情境下，把理性的逻辑思维变成感性的非逻辑直觉行为。


    在韦伯那里，道德被视作局限于一定时空情境中的德性，它不可能超越时空而凭借逻辑被证明为普适原则。在现代西方的法学和哲学中，普适主义对特殊主义，法律对德性，其实是一个最基本的分歧。


    道德中的道是道路，德是得到，道德就是通往得到的道路；仁是人，义是应该。仁义道德就是人应该走向获得的路。实际上，是感知觉的一种深度概念抽象加工，是一种直觉化了的认知框架结构，是一种无意识化了的深度态势感知，即符合内在道德要求的刺激-反应快模式，而不是理性的刺激-选择-反应慢模式。


    把数据变成信息的过程就是产生定向理解的过程，而把信息变成知识的过程就是更小范围的定向理解过程，这是一个聚合过程；反之，若把知识溶解为信息、把信息转化为数据的过程，就是一个泛化联系、弥散理解的过程。这一来一往就是一个弥散聚合过程（简称弥聚过程），人与外部世界交互的过程就是一个认知弥聚过程。


    去掉数据的物理性是一个瞬间的极其复杂过程，其意义不亚于石头变猴的过程：把一个死沉沉转为一个活生生，把一个无价物化为有价值，把一个有限变为无限，把一个无味道生成有意义，翻天覆地、万象更新、一元复始，不可谓不巨大。这也是人类主观形成的过程，即人可以发现未来的动向并利用过去影响它现在的进程。犹如去掉人身上的动物性一般，不是简单的刺激-反应，而是刺激-选择-反应，中间的那个选择就是主观产生的源头，智能也许就是人性-非动物性。


    感/知的不是该物的自然属性之和，而是展现着该物的时间性、历史性的“意义”。“界限”是为了让交互变得更有秩序，而规则、概率、知识、信息、数据、规范、法律、道德都是这种“界限”的秩序表达方式。例如，对于“张三把李四打了，他进了医院”与“张三把李四打了，他进了监狱”这两个事实，就存在着人机不同的理解“界限”，某域的“态势感知”在服从于局部的“界限”，遵守了某一种“秩序”，才能进入另一个时空中的“界限”。那种建立“统一”“跨域”的理想状态，其实就是打破局部领域的“界限”“秩序”，这便成为“深度态势感知”。


    随着科技发展以及人工智能技术的不断完善，不久的将来，人们将很容易“操纵信息”。在军事领域，信息操纵并不是什么新鲜事，但如今的不同点在于，随着科技发展，信息操纵的规模会更大。法国《欧洲时报》2018年9月6日报道称，法国国防部在当地时间9月4日发布的一份报告中指出，信息操纵的规模变大将造成极大的混乱。法国武装力量部长弗洛朗丝·帕利表示“整个社会和政治体制都有可能被撼动”。报告尤其提醒注意图片、音频和视频编辑软件带来的威胁，称这些软件“能让任何人讲出任何话，而且不容易辨识”。该报告指出，通过数码修改视频中的人物面部，按照修改人的意愿，让他们讲话或做事，这样的加强版假视频已经达到了极高的可信度。报告还指出，修改公众人物的言论将变得很容易，并能发送20多个修改后的版本跟真的混在一起，这将能产生混淆视听的效果。报告预计，因为制作成本低，而且被抓住的风险也低，操纵信息的行为会越来越多。显然，“界限”是让这个世界更有秩序，而“自我”有必要服从于这一个“界限”，即在遵守某一种“秩序”的情况下，才能进入另一个时空中的“界限”。


    在哈耶克的浩繁著述中，也许“自发秩序”四个字最为重要。重要在哪里呢？自发秩序是社会秩序的主要源泉，也就是说，社会秩序是自发产生的，而不是人为创造的。想象一下远古时期，没有国家，也没有今天这么复杂的社会秩序，质朴的人类只根据对自己是否有利来决定行为，他们在长期的互动和磨合中形成了习俗和惯例（如家庭之礼或乡规民约），这就是最初的社会秩序。习俗和惯例的特点是，它们是人民群众创立的。当然现代意义上的“自发秩序”已非彼时的“自发秩序”，人类经历了思想启蒙、文艺复兴、工业革命、智能萌动等过程，这些变化已使得哈耶克曾划分的“人之行动”和“人之设计”开始了混合、融接：几乎所有习俗或惯例既包括人们有目的创立的，还包含他们的“非目的行动”。当前，所谓“人为”不仅是指人的行动，还指人的设计。正如，人类感觉的秩序是“自然+人工”的一样，人的非目的的行动也是“自然+人工”的。立法机关不但要发现法律，还要积极创造更人性化的法律。海德格尔有句名言，叫“不是我说话，而是话让我说”。这里的“话”，不能从普通语言学意义上来理解，不是语言学的形式规则，也不是语言学的意义，而是有内容（什么）的“话”。在现在与未来的智能时代，说话与话说一定要紧密地与实际情况有机结合，智能传播的法律法规才能顺势而为、自然制定，进而更好地保障整个社会秩序和自由的秩序。


    ## 第九章 机器人之惧


    机器人被誉为“制造业皇冠顶端的明珠”，集机械、电子、传感、人工智能等多学科先进技术于一体。人工智能是机器人的智能来源，而机器人则是人工智能在军事、工业、民用等多领域应用的重要载体。人工智能技术与机器人技术的融合发展，共同推动了人类社会生活方式的变革。


    进入21世纪，工业机器人的发展逐渐趋向成熟，与此同时，仿人机器人、仿生机器人、家用机器人等也都取得了重要进展，而服务机器人由于持续快速发展，受到越来越多的关注。与军事、传播等领域不同，智能机器人本身建立在人工智能构想的基础上，向着更加贴近人类的方向发展。随着人工智能的发展，机器人发展自然得到更快的崛起。


    我国《国家中长期科学和技术发展规划纲要（2006—2020年）》中对智能服务机器人给了明确的定义：智能服务机器人是在非结构环境下为人类提供必要服务的多种高技术集成的智能装备。该文件也将服务机器人确定为未来有新发展的战略高技术。与工业机器人不同，服务机器人是不具有工业自动化应用，且为人类或设备执行有用的任务的机器人。它的用途十分广泛，一般包括专业服务机器人和个人/家庭服务机器人。


    根据国际机器人联盟（International Federation of Robotics，IFR）的数据统计，个人服务机器人的市场增长迅速。仅在2017年，个人服务机器人的总数量增加了25%，达到约850万，市场价值增加了27%，达到约85亿元人民币，可见服务机器人的市场十分广阔。无论是在专业服务领域还是在家庭服务领域，都有非常多的应用，如专业服务领域的医疗辅助机器人、疾患护理机器人、危险任务辅助机器人、监视安保机器人等，以及家庭服务领域的清洁机器人、助手管家机器人、生活辅助机器人等。产业化、模块化、家庭化将成为未来服务机器人的发展趋势，未来服务机器人会走入更多的普通人家庭，逐渐成为人们生活中不可或缺的部分。


    在仿人机器人方面，日本本田公司于2000年发布了首款仿人机器人阿西莫（ASIMO），经过不断改进和升级，2011年版ASIMO已经可以同时与多人进行对话，遭遇其他正在行动中的人时，ASIMO会预测对方的行进方向及速度，自行预先计算替代路线以免与对方相撞。ASIMO可以步行、奔跑、倒退走，还可以单脚跳跃、双脚跳跃，也可以稍微不平的地面行走，甚至能边跳跃边变换方向，奔跑速度可以达到9千米/时。它的手可转开水瓶盖、握住纸杯、倒水，甚至可以边说话边以手语表现说话内容。


    其他的人形机器人还有很多，例如波士顿动力公司2013年发布的双足人形机器人Atlas，它有4个由液压驱动的四肢。Atlas由航空级铝和钛材料建造，身高约6英尺，重达330磅①，蓝光LED照明。它配备了两个视觉系统：一个激光测距仪和一个立体照相机，由一个机载电脑控制。它的手具有精细动作技能的能力，它的四肢共拥有28个自由度。虽然2013年的原型版本被系链到外部电源来保持稳定，但Atlas机器人可以在崎岖的地形行走和攀登且独立使用其胳膊和腿。Atlas还参加了由美国国防高级研究计划局举办的机器人挑战赛，一同参加比赛的还有很多其他研究团队研发的人形机器人，它们都具有很高的研究水平。


    在仿生机器人方面，与Atlas同出自波士顿动力公司的四足仿生机器人BigDog同样取得了巨大的成就。它没有车轮或者履带，而是采用四条机械腿来运动。机械腿上面有各种传感器，包括关节位置和接触地面的部位。它还有一个激光回转仪，以及一套立体视觉系统。BigDog长1米，高0.7米，重75千克，几乎相当于一头小骡子的体积。目前能够以每小时5.3千米的速度穿越粗糙地形，并且负载154千克的重量。它能够爬行35°的斜坡。其运动是由装载在机身上的计算机控制的，这台计算机能够接收机器上各种传感器传达的信号，导航和平衡也由这个控制系统控制。


    在医疗机器人方面，2000年左右研制成功并使用的达·芬奇外科手术系统（Leonardo Da Vinci surgical robot）是一种高级机器人平台，它可以通过使用微创的方法，实施复杂的外科手术，由三部分组成：外科医生控制台、床旁机械臂系统和成像系统。达·芬奇手术机器人的使用，使手术精确度大大增加，患者术后恢复加快，并减少了医护人员的工作量。


    ① 1磅≈0.45千克。


    在家用服务机器人方面，自20世纪末研制出第一台扫地机器人以来，已经取得了巨大的发展，是服务机器人领域产业化程度最高和应用最多的机器人，其技术也从之前的随机清扫方式进化到路径规划式清扫，为人们的生活带来了巨大的便利。


    ### 一、人工智能与机器人


    机器人特别是未来的智能机器人，不应仅是信息、控制、生物、材料、机械等科学技术的融合与结晶，而应该是集科技、人文、艺术和哲学为一体的“有机化合物”，是各种“有限理性”与“有限感性”叠加和激荡的结果。未来智能机器人的发展与人工智能密不可分，同时，人工智能也是制约当前机器人科技发展的一大瓶颈。


    与机器人一样，人工智能也“有一个漫长的过去，但只有短暂的历史”，其历史可以追溯到文艺复兴时期，17世纪，莱布尼兹、托马斯·霍布斯和笛卡儿等人开始尝试将理性的思考系统化为代数学或几何学那样的体系，这些哲学家已经开始明确提出形式符号系统的假设，而这也成为后来人工智能研究的指导思想。19世纪，剑桥大学的查尔斯·巴贝奇建造差分机，开始尝试用机器来自动进行数学运算。第一次世界大战、第二次世界大战大大加快了人工智能发展的进程，图灵机的提出激发了科学家们探讨让机器思考的可能。1956年达特茅斯会议断言，“学习的每一方面或智能的任何其他特性都能被精确地加以描述，使得机器可以对其进行模拟”，这把人工智能领域的研究范围扩展到了人类学习、生活、工作方方面面。目前人工智能不但包括生理、心理、物理、数理等自然科学技术领域的知识，而且涉及哲学、伦理、艺术、教理等人文艺术宗教领域的知识。


    1997年5月11日，国际商业机器公司“深蓝”击败了国际象棋世界冠军卡斯帕罗夫，证明了在有限的时空里“计算”可以战胜“算计”，进而论证了现代人工智能的基石条件（假设）：物理符号系统具有产生智能行为的充分必要条件是成立的。2016年3月，Google
    AlphaGo在首尔以4：1的比分战胜了围棋世界冠军李世石，更是引发了人工智能将如何改变人类社会生活形态的话题。当前人工智能的概念似乎有些过热，虽然过去几十年中人工智能已经取得了令人瞩目的成就，但实际上我们发现现在人工智能都还仅能应用在诸如语音识别、图像识别、自然语言处理等单一领域，当前人工智能水平的提升还只是量变，远远没有达到质变的标准。


    人工智能是人类发展到一定阶段自然产生的一门学科，包括人、机与环境三部分，所以也可以说，人工智能是人-机-环境系统交互方面的一种学问。在饱含变数的人-机-环境交互系统内，存在的逻辑不是主客观的必然性和确定性，而是与各种可能性保持互动的同步性，是一种可能更适合人类各种复杂的艺术过程的随机应变能力，而这种能力恰恰是当前人工智能所欠缺的地方。


    当前人工智能研究的难点不仅在具体的技术实现方面，更多的是在深层次对认知的解释与构建方面，而研究认知的关键则在于自主和情感等意识现象的破解。然而，由于意识的主观随意性和难以捉摸等特点，与讲究逻辑实证和感觉经验验证判断的科学技术有较大偏差，使其长期以来难以获得科技界的关注。但现在情况正在逐渐发生转变：研究飘忽不定的意识固然不符合科技的范畴，但把意识限制在一定情境之下呢？人在大时空环境中的意识是很难确定的，但在小尺度时空情境下的意识可能是有一定规律的。


    实际上，目前以符号表征和计算的计算机虚拟建构体系是很难逼真反映真实世界的（数学本身并不完备），而认知科学的及时出现不自觉地把真实世界和机器建构之间的对立统一了起来，围绕是、应、要、能、变等节点展开融合，进而形成一套新人-机-环境系统交互体系。


    ### 二、莫拉维克悖论


    制约当前机器人发展的另一瓶颈是莫拉维克悖论。


    在机器人的发展中发现了一个与人们常识相左的现象：让计算机在智力测试或者下棋中展现出一个成年人的水平是相对容易的，但是要让计算机有如一岁小孩般的感知和行动能力却是相当困难甚至是不可能的。这便是机器人领域著名的莫拉维克悖论（Moravec’s
    paradox）。


    莫拉维克悖论由汉斯·莫拉维克（Hans Moravec）、罗德尼·布鲁克斯（Rodney Brooks）、马文·明斯基等人于20世纪80年代提出。莫拉维克悖论指出，与传统假设不同，对计算机而言，实现逻辑推理等人类高级智慧只需要相对很少的计算能力，而实现感知、运动等低等级智慧却需要巨大的计算资源。


    语言学家和认知科学家史蒂芬·平克认为这是人工智能研究者的最重要发现，在《语言本能：人类语言进化的奥秘》（The Language Instinct: How
    Mind Creates Language）这本书中，他写道：经过35年人工智能的研究，人们学到的主要内容是“困难的问题是简单的，简单的问题是困难的”。4岁小孩具有的本能，如辨识人脸、举起铅笔、在房间内走动、回答问题等，事实上是工程领域内截至目前最难解的问题。随着新一代智能设备的出现，股票分析师、石化工程师和假释委员会都要小心他们的位置被取代，但是园丁、接待员和厨师至少十年内都不用有这种担心。


    与之相似，马文·明斯基强调，对技术人员来说，最难以复刻的人类技能是那些无意识的技能。总体上，应该认识到，一些看起来简单的动作比那些看起来复杂的动作要更加难以实现。


    在早期人工智能的研究中，当时的研究学者预测在数十年内他们就可以造出思考机器。他们的乐观部分来自于一个事实，他们已经成功地使用逻辑来创造写作程序，并且解决了代数和几何的问题，以及可以像人类棋士般下国际象棋。正因为逻辑和代数对于人们来说通常是比较困难的，所以被视为一种智慧象征。他们认为，当几乎解决了“困难”的问题时，“容易”的问题也会很快被解决，如环境识别和常识推理。但事实证明他们错了，一个原因是这些问题其实是难解的，而且是令人难以置信的困难。事实上，他们已经解决的逻辑问题是无关紧要的，因为这些问题是非常容易用机器来解决的。


    根据当时的研究，智慧最重要的特征是那些困难到连高学历的人都会觉得有挑战性的任务，如象棋、抽象符号的统合、数学定理证明和解决复杂的代数问题。至于四五岁的小孩就可以解决的事情，如用眼睛区分咖啡杯和一张椅子，或者用腿自由行走，又或是发现一条可以从卧室通往客厅的路径，这些都被认为是不需要智慧的。


    在发现莫拉维克悖论后，一部分人开始在人工智能和机器人的研究上追求新的方向，研究思路不再仅仅局限于模仿人类的认知学习和逻辑推理能力，而是转向从模仿人类感觉与反应等与物理世界接触的思路设计研发机器人。莫拉维克悖论的发现者之一罗德尼·布鲁克斯便在其中，他决定建造一种没有辨识能力而只有感知和行动能力的机器，并称之为Nouvelle
    AI。虽然他的研究早在1990年就开始，但是直到2011年其Baxter机器人还是不能像装配工人那样自如地拿起细小的物件。


    莫拉维克悖论对应的是机器人的运动控制和感知系统，而人工智能对应于机器人的控制和信息处理中枢。如果把人工智能对应于机器人的大脑，那么，莫拉维克悖论对应的运动控制和感知系统则对应于机器人的小脑。只有大脑与小脑系统发展，机器人才能更好地为人类服务。


    ### 三、机器人的社会问题


    ### 1. 安全性问题


    机器人作为一个设备为人类工作服务有一个前提，那就是安全。在工业机器人领域已经有了相对完善、成熟的安全标准体系，而在服务机器人领域各国都缺乏相应的安全标准，国际标准化组织于2014年2月正式发布了ISO
    13482安全标准，这是服务机器人领域的第一个国际安全标准，是一个良好的开端，ISO 13482安全标准包含移动仆从机器人、载人机器人、身体辅助机器人三大类服务机器人的基本安全要求。


    服务机器人的安全不仅包括传统的硬件安全（如电气安全等），还包括软件安全，机器人的软件安全与人们熟悉的计算机软件安全不同，虽然计算机软件失控或遭受攻击后也会导致严重的损失，但它仅存在于虚拟空间，不会直接对物理世界产生作用。但机器人系统的软件安全则不同，机器人的软件系统可以控制其硬件系统做出各种动

