    作，会对真实物理空间产生直接影响，一旦自身失控或遭受攻击被人控制，可能就会对使用者造成直接的人身伤害。目前，针对机器人软件安全的研究还比较少，也没有机器人专用的安全防护软件或方案，这可能会导致极大的安全隐患，应引起人们的重视。


    ## 2. 恐怖谷理论

    1970 年，日本机器人专家森正弘（Masahiro Mori）提出机器人领域一个著名的理论——恐怖谷理论（the uncanny valley），“恐怖谷”一词最早由恩斯特·延奇（Ernst
    Jentsch）于 1906 年在其论文《恐怖谷心理学》中提出，后又于 1919 年被弗洛伊德在论文《恐怖谷》中阐述，成为心理学领域一个著名的理论。森正弘的恐怖谷理论是一个关于人类对机器人和非人类物体感觉的假设。


    森正弘的假设指出，随着机器人在外表、动作上与人类越来越像，人类会对机器人产生正面的情感；但若到了某一特定程度，人类对机器人的反应会变得极为负面。哪怕仅仅是很小的一点差别，都会使人觉得非常刺眼，甚至使整个机器人显得非常僵硬恐怖，使人有面对行尸走肉的感觉。但是，当机器人与人类的相似度继续上升时，直至达到普通人之间的相似度时，人类对机器人的情感反应会再度回到正面。


    “恐怖谷”一词用以形容人类对与他们相似到特定程度的机器人的排斥反应。而“谷”就是指在“好感度对相似度”的关系图中，在相似度临近 100% 时，好感度突然坠至反感水平，回升至好感前的那段范围。


    ## 3. 机器人威胁论

    “机器人威胁论”伴随着机器人发展的始终，其历史甚至比现代机器人还要长。早在 1921 年，卡雷尔·恰佩克（Karel Capek）提出“机器人”（robot）一词的那部剧本的结局就是机器人反抗并消灭了人类。后来，“机器人威胁论”更成为科幻小说或科幻电影永恒的题材之一。最近几年，科技领域的很多领军人物纷纷警告机器人或人工智能将会带来的威胁，著名企业家艾隆·马斯克认为人工智能的危险性甚至大于核武器。物理学家霍金则警告说，人工智能可能会招致人类末日。就连鼎鼎大名的比尔·盖茨也建议要小心管理数码形态的“超级智能”。


    但现实是，目前的机器人技术距离真正的“智慧”还差得很远，已有的所谓“智能机器人”几乎都是表面性的，主要还是以科研或娱乐为主。目前大规模产业化的基本只有工厂里的机械臂和家里爬行的吸尘器。如果把机器人智能水平分成四个等级：功能、智能、智力、智慧，那么，目前的机器人大部分都处在功能阶段，有少部分实验室产品可能达到智能层次。终结者们还只不过是好莱坞电影里面的角色而已。


    现在，无论是小说还是电影中，科幻世界还是我们所在的物理世界，机器人都越来越聪明了，越来越有“人性”了，在一些方面逐渐接近人类，在另一些方面则逐渐超越人类。于是，人们越来越担心科幻电影中的世界有一天会变成事实，但抛去所有的幻想与浮躁，真实的情况到底是怎样的？纵观历史，每次新技术的出现都会引起人们的恐慌与反对，但我们不是每次都安然度过并开始享受这些技术带来的便利了吗？从远古的刀、箭到现在的汽车、飞机、核能，这些都是工具，其本身并没有善恶属性，真正能决定其用途或善恶的，是背后的使用者。一项新的技术，如果对人们的帮助远大于危害，那我们就应该正面、积极地对待它，防范可能的不当使用，然后继续向前进。


    ## 四、人与机器人的未来

    有人说，机器人是个哲学问题，在某种程度上是有道理的，因为“我们能否在机器身上再现人类的智能”和“我们能否与真正的智能机器人和平相处”，某些意义上这不仅是技术问题，还是哲学问题。当今乃至可见的未来，人与机器人之间的关系不应该是取代而是共存，未来的世界可能是人与机器人共在的时代：相互按力分配、相互取长补短，共同进步，相互激发唤醒，有科有幻，有情有义，相得益彰……


    ## 第十章 智能：数与理，矛与盾

    智能是不是就是数理逻辑？不完全是。笔者认为，智能不应该只有形式化的数理逻辑，应当还包含着意向性，以及很多数学之外的东西，如辩证逻辑、价值、矛盾等。


    ### 一、智能与逻辑

    人是默会（黑）的，机是显性（白）的，人机融合智能就是太极图，不断运动且相互转化，环境（包括伦理）就是促使其不断转化运动的动力，生生之谓易。人、机、环境（包括伦理、商业、社会、自然、科技环境）三者之间就是石头、剪子、布的关系，人造机，机改变环境，环境塑造人。


    正如国际象棋是批判（越下越少），围棋是建构（越下越多）一样，西方哲学常常是批判，欧洲在没有找到科学之前（包括出现科学之后），曾长时间对东方思想很感兴趣。东方思想往往是建构，从《易》中的“阴阳”到《道德经》中的“有无”再到《孙子兵法》中的“虚实”莫不如是。《易》除构造了定性推理分析的阴阳鱼辩证思维之外，还建立了定量计算的八卦形式化符号系统，并且深深影响了西方哲学，较易融于东方的传统思想体系。


    尽管不少人认为人工智能重在数学与算法，但实际上，也正是数学与算法的缺点阻碍了人工智能的发展，维特根斯坦曾对此指出：“总有一天出现包含有矛盾的数学演算研究，人们将会真正感到自豪，因为他们把自己从协调性的束缚中解放出来了。”尤其是当代数学的不完备性需要非数学来弥补，哲学体系中的逻辑理论在数学的底层可以进行弥补完备，如形式逻辑可以进行外延思维规定和外延关系弥补，而辩证逻辑可以进行内涵思维规定和内涵关系的完备。


    如果有人问：辩证逻辑是什么？是否可以比较简略地说说？那么不妨这样看，辩证思维逻辑就是可以灵活表征、非单调推理、直觉决策、随机应变，准确有效及时处理人-机-环境复杂系统问题的一种思维方法，它不是仅用具有约束边界条件的形式化方法（如专家系统、知识图谱等）计算世界，因为形式化方法失去了认知的弹性。辩证思维可以产生人的洞察机制，如塞翁失马。它是一种开放逻辑，把时序和极限有机地统一，实现事实、归纳、猜想与反驳序列、价值的一致化。


    还有人认为“传统的逻辑一致性是形式系统的基本要求。否则，a是定理，非a是定理，则a且非a（矛盾）是定理。若a且非a是定理，则一切都是定理。当然，现在有人研究
    paraconsistent logic（限制矛盾推出一切），自称它就是辩证逻辑。总之辩证逻辑研究进展不大，甚至是一笔糊涂账。”可是世界太奇妙了，除了是、非之外还有“是非”存在，既是又不是。“是不是”现象可能就是辩证思维的根吧！矛盾永远同时存在，既对立又统一，否定之否定，量变质变等辩证思维是久经考验的思想核心。


    在东西方世界的科技界、演艺圈和消费主义概念中，文化科技大部分都与盈利挂钩，而且不幸的是，在利润面前，传统与伦理道德往往消失得很快。


    相较于西方人的真假智能逻辑，东方人的智能与伦理思想更看重是非之心。


    ### 二、智能的拓扑不是数学的拓扑

    智能有逻辑关系和非逻辑关系，而采用数学的计算符号恰恰忽略了这些，如加减乘除都反映不出蕴含和情理（喜欢）的关系。但是绝大多数人就是在这样的数理规则下训练出来的思维，失去了自然的弹性和游刃。实际上，根据一个形式化系统来分析某个真实机体，一般都将导致对该机体部分信息的丧失，这也从另外一个角度反映了数学（或者说当前数学）的不完备性和局限性。


    每一个概念都有它所不能包含的部分，这也是人类智能的厉害之处（也是人类不厉害之处）。尽管它可以“学习”，但知识图谱很难实现知识之外的图谱。当前的智能只是在尽力实现语文的数学化，其实智能更重要的是数学的语文化。


    如果说人类造字是语言表征的封装积累，那么人类造智实际上是思想意识的拓扑延展，而不是数学拓扑。形式化系统只能近似反映它，但终究难以取代它。意向性是联结事实与价值、真善美的唯一桥梁，形式化可以某种程度地实现这种意向性。真善美都是以一种有限来反映无限，智能是一种有限感性和理性的适应性存在。


    数学的计算符号忽略了什么？应该是逻辑关系和非逻辑关系，试图单纯用数学手段（包括其拓扑）搞定智能问题的想法如同用大数据方法搞定智能问题一样，都将是沙基建塔、缘木求鱼、空中楼阁、海市蜃楼……


    自从人类诞生以来，数学的作用便有目共睹，在此就不再赘述了。然而，数学的局限和不足大家聊的却不是很多，下面针对这个问题简单阐述一下。


    虚拟训练容易导致知识僵化和应对突发情况能力的缺失。从中不难看出，人机融合不仅是脖子以上的问题，还有脖子以外的问题，虚拟可以的现实不一定可以，伪和真不是简单的一一映射关系，智和能相差的也不是一星半点……这些涉及的远非计算和现有的数学所能驾驭的，需要更新的工具出现。其实，数学对此也很尴尬，很多问题根本不是数和图能解决的，正如那些声称包治百病的药一样，若要一直声称能有怎样的效果，最好远离它……


    人们尝试用正确率和似然度去表征一些事物，但仍不尽如人意，未来的学科或许会有更好的指标出现，如用两者（正确率和似然度）的融合表示李小龙的截拳道，如何用最直接的方式解决格斗中的问题，其中的直接并不是真正意义上的直接，而是整体性的直接，得失奖惩绝不是类机器的强化学习机理，而是涉及意向性的弯曲，这种弯曲也是数理难以描述清晰的现象。维特根斯坦指出：“总有一天会出现包含有矛盾的数学演算研究，人们将会真正感到自豪，因为他们把自己从协调性的束缚中解放出来了。”


    有人说，意义就是走动着的概念，是行为实践中蕴含着的爸爸妈妈和不同年龄人说出的“床前明月光……”，数学对此也有局限，机明人暗，物是人应（非），人常（识）机规（则），打破常规就是要打破人机各自的局限，形成新式能力。人机融合不但是为了提高效率，而且包括减少不确定性，保障安全可靠性，以及增强舒适灵活性。


    人处理信息、知识的速度要慢于机器处理数据、图形的速度，但人的跨域推理、想象、直觉又往往比机器的逻辑计算、匹配、搜索快得多，人机融合这些不同速度的过程，本身就很不容易，何谈有机流畅的计算心理呢？


    在物理世界发现暗物质、暗能量之后，在生命世界可能革命性地开启了“暗信息”这一人类理性发现的“最新大陆”。单纯的感受不是智能，没有主动的觉和知，怎么会有觉知和智能呢？人的认知也不应是可以计算的，因为其中充满了非计算的事和情。


    信念和意图的区别是：一个是从后往前看，一个是从前向后看；不过一个偏积极，一个偏中性；一个是无根据的臆，一个是有目的的猜。不少人正在计算意图，但没有人在计算信念，为什么？因为这还不是数学的势力范围。


    多元的统一，正是中国古代哲学所谓“和”的体现。人机的“和”也不完全是数学，还有人学的因素在里面。


    凡事都有生有灭，数学也不例外，取代它的学科正在路上……伦理不是个人产生出来的，而是群体产生的，智能也是如此，所以智能本质上是群体意向性的产物，包括数学也是群体意向性的产物。


    个体智能与群体智能的区别是，个体智能的逻辑若是 a>b，b>c，则 c 不能大于 a；而群体智能的逻辑若是 a>b 且 b>c，那么 c 可以大于 a。


    人工智能源自形式逻辑框架，人类智能脉于辩证思维体系，人机融合智能的根本在于逻辑与非逻辑的思想结合：无论是非，只管正反，不止叠加，还有纠缠。


    ### 三、真实的智能是包含矛盾的

    人们经常认为人-机-环境系统中各个部分是通过互补构成一个整体的，事实上，应是各个部分在整体构成中被组织成互补的，更可能是互补与被互补的关系。


    帕斯卡说：“我认为不了解整体就不可能了解部分，不清楚各个部分也不可能了解整体。”这意味着整体的属性是变化的，各个部分的属性更可能是变化的。系统整体性组织会对部分进行抑制、改造和约束，新的部分会生成新的整体。


    一个智能系统想要形成和存在，其内部的构件在本性或运行规律上就必须拥有既相互吸引又相互排斥、既靠拢又闪避、既结合又分离、既统合又脱节的能力。在人机融合智能中，意向性是联结事实与价值、真善美的唯一桥梁，形式化可以某种程度地实现这种意向性。


    实际上，人机融合智能和社会科学密切相关。就人机而言，人是什么呢？人就是一个心理和生理的结合体，具有群体社会性；而机器就是一个数理和物理的结合，它更多的是非社会性。为什么说是非社会性？因为它是人造出来用在社会上，达到某种改造环境的目的，它本身是人造物（没有社会性）。


    人有一种习惯性错觉，即常常把暂时的东西看成永远的，比如标定、公理、统计、因果等，其实不然，有数理逻辑学者指出，集合论出现悖论，是因为在它的基本方法中有一个不可抵挡的“矛”，即任一集合
    s 都可以扩大到一个更大的集合 P（s）。同时，其中还有一个能抵抗一切的“盾”，即它包含有一切集合的那个集合。显然，如果我们单独使用那个“攻无不克”的矛，或者单独使用那个“坚不可摧”的盾，那是不会出现逻辑悖论的。但在人类思维过程中不得不同时使用两者，由于思维过程中某些环节会出现互为因果的循环圈。所以“矛”和“盾”有了接触，导致了“以子之矛、陷子之盾”的悖论。


    人、机、环境这三个事物之间是石头、剪子、布的关系：人造机器 + 机器改造环境 + 环境塑造人，其中环境不单是自然环境，还包括社会伦理环境、商业环境、科技环境等一系列的环境；机也不单单是指机器装备，还包括机制管理等；人也分很多种，如单人、多人等。就伦理而言，东方侧重是非之心，明辨是非可以为伦，甚至包括柔性的智；而西方的伦理讲究真假，还涉及刚性的科学和法律等，所以西方的伦理和东方的伦理在某种程度上还不太一样。西方更侧重于法，法制是很严格的、规范的、规则化的东西。所以，柔性的伦理和刚性的法律怎么结合的问题，也是东方和西方思想怎么融合的一个问题，也是人机的本质问题之一。例如，前段时间波音
    737MAX 事故不断，就是典型的人、机、环境系统问题，包括技术的能力、市场的伦理、人的伦理、整个社会的伦理。简单地说，就是波音公司与空中客车公司竞争，为使用更大功率更省油的
    LEAP 发动机，必须超越原始设计的安全极限，波音 737 MAX 没有重新实验设计，而是小改小造，为后来事故的发生埋下了伏笔。其中的 MCAS 软件逻辑设计不合理，简单来说，在单个攻角传感器测量有误时，MCAS
    就专断独行，不论驾驶员如何处置，仍然坚持低头向下扎，结果造成了巨大损失，是一起典型的人、机、环境（商业）融合失效案例。实际上，所有的算法都是有缺陷的，都是有边界约束条件的，都不是万能的，但是有一些商业机构，包括一些新闻媒体或是一些影视制作组织，让大家产生了科技无所不能的幻觉，这就造成了很不好的影响。客观而言，人机、智能都不是万能的，机器学习也不是真正意义上的学习，人类的学习能够造成一种范围不确定的隐性的知识和规则，就意味着他自己都不知道什么时候在什么地方用到曾学过的知识，机器的学习做不到。波音飞机的这个案例可以在哲学上引发更深刻的思考和讨论，因为美国的科学和技术是全球较先进的，都出现了这么大的问题，所以大家更应该对人-机-环境系统工程进行深入的思考和反思。


    我国的科技界更应该好好反思，原因很简单，西方之所以有今天的科技成就，与其源远流长的哲学思考和分析密不可分，没有笛卡儿、莱布尼兹、康德、罗素、维特根斯坦、马赫，就很难出现牛顿、爱因斯坦、图灵、冯·诺依曼，西方科技也很难发展到今天这个程度，而且在引领世界。所以，笔者觉得我国的科技界应该认真地反思一下，应该尊重哲学，与哲学家交朋友，然后虚心地向哲学家学习，讨论一些真正的问题，才能让我们国家有一个较大的发展。在此，笔者还想强调研究科技一定要看它们的过去，忘记过去就意味着落后，过去是现代发展的线索，例如英国的计算机科学家、人工智能哲学家玛格丽特·博登（Margaret
    Boden），她很早就提出了人工智能的核心和瓶颈在于意向性与形式化的有机结合，时至今日仍未有突破，实际上这也是人机融合智能的困难之处。另外，需要指出的是，做通用智能虽然是一个非常好的理想，但是所有的智能都是有范围的，只在这个范围内它才能有效。就和药一样，所有的药都不是包治百病的，只在某个范围内才能有效，所以一定要注意其研究适用范围。


    ## 第十一章 智能：从哲学到大脑

    我们可以上天入地，但要了解头颅内发生的事情却困难重重。几个世纪以来，人们从没有停止对意识问题的探索。无论是哲学、神经科学还是人工智能领域的专家教授，都对意识问题进行了深入思考：究竟意识是什么？它位于何处？如何理解意识与物质之间的因果关系？意识和智能之间又有什么关系呢？


    马克思·威尔曼斯（Max Velmans）曾经提出著名的意识五大问题：第一，意识是什么，它位于何处？第二，如何理解意识与物质之间的因果关系？第三，意识有什么功能？第四，与意识相关的物质形式是什么？第五，检测意识的最恰当方式是什么？可以这么说，这五大问题基本概括了所有意识研究的方向。但找到方向只是最初的一步，目前意识研究领域还属于“百花争鸣”阶段，如伯纳德·巴尔斯（Bernard
    Baars）等人提出的意识的全局工作空间理论，加来道雄（Michio Kaku）提出的意识时空模型，朱利奥·托诺尼（Giulio Tononi）提出的信息整合理论等，至今还没有大家公认的意识模型或理论。还有学者出于研究的难度或者其他种种原因，认为意识没有深入研究的必要，比如学者约翰·霍甘（John
    Horgan）曾悲观地预测人类永远不可能完全了解意识与心灵。


    本章将总结意识研究领域的理论和实验成果，并着重探讨意识与脑、意识与智能之间的关系。


    ### 一、意识的哲学属性

    哲学家似乎对意识问题情有独钟，在他们眼中，我们是谁，世界是什么，我和世界的关系等问题显得十分重要。在此，笔者试图从身心二元论、意识的涌现与还原论等方面来研究意识中的哲学问题。


    ### 1. 身心二元论

    一元论与二元论问题历来是哲学家争论不朽的战场。一元论者认为物质与意识本质上是一种物质；二元论者认为实在由两种截然不同的事物构成，即意识和物质两者是分离的。


    希腊早期哲学家赫拉克利特（Heraclitus）曾说：事物之间的平衡与对立使得宇宙成为一个统一的整体，世间万物都是由某种单独的基本过程或基本物质组成的，而这正是一元论的核心宗旨。


    希波克拉底（Hippocrates）认为，脑是我们所有思想、感受和观念的基础。


    柏拉图认为，人被分为两个部分，即肉身和灵魂，肉身掌管感官知觉，灵魂掌管理智。这为身心二元论的成立奠定了基础。值得一提的是，他的观点被《新约》吸纳，并在全世界广泛分享。


    柏拉图的学生亚里士多德提出了质疑，驳斥了老师的人类灵魂独立性的观点，认为思维是肉体的形态或功能。


    如果说柏拉图提出了二元论的雏形，那笛卡儿就是真正提出二元论的人。他提出：思维和身体永远是不同的实体。阿维森纳支持笛卡儿的学说，并说道：灵魂有别于肉体。


    笛卡儿二元论一经提出，立即遭受到全世界哲学家的刁难与批评。阿奎纳曾经说：本我所思考的与本我通过感官知觉感知到的是完全一致的。哲学家吉尔伯特·赖尔（Gilbert
    Ryle）曾经说：二元论是一种“范畴错误”，并且将二元论者口中的自我称为“机器中的幽灵”，表明人类无须借助这一“幽灵”，照样能理解和生存于这个世界之上。其他哲学家指出，笛卡儿没有说明身体和思维的来源，只能求助于神来帮助，这样主观二元论又滑落到客观一元论的范畴之中，这是不可原谅的错误。


    托马斯·霍布斯（Thomas Hobbs）也于1655年批判笛卡儿，认为其学说是毫无意义的。相反，他所著的《利维坦》认为人类是纯粹物理性的，心脏是一根弹簧，神经是一串串细绳，关节是轮子，上述部分共同工作令身体运作起来。他还认为，精神传递着身体所需的各种信息。


    巴鲁赫·斯宾诺莎（Baruch de Spinoza）认为，人类可以了解两种属性：延伸的属性和思想的属性，因此被人们称为“二元属性主义者”。


    乔治·贝克莱（George Berkeley）为纯粹一元论者。他认为物质实体不存在，即使外在肉体存在，我们也无法得知。世界都是由观念组成的。梅洛·庞蒂在《知觉现象学》中说明心理和身体不是独立分开的个体，否定了二元论的观点。


    威廉·詹姆斯（William James）认为，心智事件和物理事件并非

