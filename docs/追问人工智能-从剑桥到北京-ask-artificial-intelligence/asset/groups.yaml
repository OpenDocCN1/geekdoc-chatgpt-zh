    惩罚），如同刺激、反应之间还有选择等过渡过程。另外，人类的奖惩机制远比机器简化版的奖惩机制复杂得多，不但有奖奖、惩惩机制，甚至还有惩奖机制，给予某种惩罚来表达真实的奖励（如明降暗升），当然，明升暗降的更多。人类的那点小“心思”，除了二进制，机器目前继承的还不太多。


    在川流不息的车流中穿行而全身而退，就是人机态势协同的经典情境。仔细想想，态势与阴阳还有着相似关系：（状）态为阳——显性的存在，（趋）势为阴——隐性的意向；感（属性）为阳，知（关系）为阴，阴中有阳，阳中有阴。


    人的学习与机器学习最大的不同在于是否是常识性的学习，人在教育或被教育时，是复合式认知，而不仅仅是规则化概率性输入。人的常识很复杂，扎堆的物理、心理、生理、伦理、文理……既包括时间空间的拓扑，也包括逻辑非逻辑的拓扑。人既是动物，也是静物。机也如此，但其动、静与人还是有差异的。人机融合学习、人机融合理解、人机融合决策、人机融合推理、人机融合感知、人机融合意图、人机融合智能才是未来的发展趋势和方向。


    人有一种能把变量变成常量，把理性变成感性，把逻辑变成直觉，把非公理变成公理，把个性一变成共性多，把对抗变成妥协的能力。例如，人不但可以把“如何”（how）用程序化知识表征，还可以把“为何”（why）用描述性知识表示，至于“什么”（what）、“哪里”（where）、“何时”（when）这些问题让机器辅助检索即可。可惜无论是人的自然智能还是人工智能，最后都涉及价值取向问题，可惜机器在可见的未来远远不会有之。如果说价格是标量，价值是矢量，那么也可以说数据是标量，信息是矢量，机器是标量，人是矢量。若数据是标量，信息是矢量，知识就是矢量的矢量。究其原因，数据终究是物理性的，本身没有价值性，信息是心理性的，具有丰富的价值取向。


    目前主流人工智能理论丧失优势的原因在于，它所基于的理性选择假定暗示着决策个体或群体具有行为的同质性。这种假定由于忽略了真实世界中普遍存在事物之间的差异特征和不同条件下人对世界认识的差异性，导致主流理论的适用性大打折扣，这也是它不能将“异象”纳入解释范围的根本原因。为了解决该根本问题，历经多年发展，许多思想者已逐渐明晰了对主流智能科学进行解构和重组的基本方向，那就是把个体行为的异质性纳入智能科学的分析框架中，并在理性假定下将个体行为的同质性作为异质性行为的一种特例情形，从而在不失主流智能科学基本分析范式的前提下，增强其对新问题和新现象的解释和预测能力。即把行为的异质性浓缩为两个基本假定：一是个体是有限理性的；一是个体不完全是利己主义的，还具有一定的利他主义。心理学、经济学、神经科学、社会生态学、哲学等为智能科学实现其异质性行为分析提供了理论跳板和基础，简单可称之为人异机同现象，未来的智能应该在融合了诸多学科新一代数（信）息学的基础上成长起来，而不是仅仅在当前有着诸多不完备性的数学基础之上。


    新手对抽象枯燥的信息无感，而高手则对从中提炼出生动、鲜活、与众不同的信息异常敏感，即通理达情，看到别人看不到（从同质性提炼出异质性），觉察到别人觉察不了的信息，形成直觉（快）决策，这也就导致了不同寻常的非理性行为和信念不断地发生。“认知吝啬鬼”是指人类的大脑为了节省认知资源，在做决定时，喜好寻找显而易见的表面信息进行处理，以求快速得出结论，而结果很可能是错误的，所以以肤浅著称。与“认知吝啬鬼”不同，心理学中还有一个概念叫“完全析取推理”（fully
    disjunctive reasoning），指当面对多个选项需要做决策，或是要根据假设推理得出一个最佳解决方案时，会对所有的选项或者可能性的结果进行分析、评估，从而得出正确的答案。进行系统的分析，速度相对比较慢。


    知识的默会已造成很多不确定性，规则的内隐更使得交互的复杂性加倍，其根源在于交互对象具有“自己能在不确定和非静态的环境中不断自我修正”的特点。这就不但有知识更新的要求，而且有组织机制挖掘的强调。人机交互实质上是人的感性结构化与人的部分理性程序化之间的融合。“同情”很容易被理解为：我们在这种感受中以某种方式拥有他人的情感。实际上，同情共感是一种情感秩序一致性的共现期望。我们在意识领域中至少可以发现以下
    6 种互不相同的“共现”方式：映射的共现、同感的共现、流动的共现、图像化的共现、符号化的共现、观念化的共现。因此，“共现”虽然首先被胡塞尔用于他人经验，但它实际上是贯穿于所有意识体验结构中的基本要素。对于此，机器仍远远不能学习实现之。


    霍金和穆洛迪诺都曾把光说成是“行为既像粒子又像波动”，智能也是如此弥聚：弥散如波动，聚合如粒子（注意机制的加入）。对象是静态的，分配匹配是动态的，是不断被刷新的，可谓此一时彼一时。如何把握不同时期的人机功能分析变化？这是一个非常有意思的问题。现在的许多无人系统或体系不是说真无人，而是没有了直接人，同时对间接人的要求会更高。人机融合不同情境的自主机制不太一样，如个体的自主与系统、体系的自主不同。此外，人机融合的一个重要问题是如何平衡，如能力的、时机的、方式的、研判的平衡等，融合得不好，往往都是这些方面的失衡所造成的。例如，人机交互分为自我内交互和与他外交互，许多表达或表征对其他对象仅出现逻辑上的意义，而与真实发出者的心理意义往往是不一致的，这种情况体现在人机深层次沟通的不流畅和晦涩、难以为继上。比较而言，机器是擅长处理家族相似性事物的，人则是优于处理非家族相似性的，即人类可以从不相识/相似的事物中抽取相识/相似性，而人机融合是兼顾两者的。跨界交叉就是要找到非家族相似性进行有向关联。波粒二象性就是连续与离散的态势，态势与感知都有二象性，认知也有，离散时可以跨界交叉融合非家族相似性，连续时常常体现平行惯性保持家族相似性。人的非理性认知（离散）与机的理性认知（连续）结合是否符合正义（正确的应该）是衡量有效融合的主要指标之一。


    人机融合智能有两大难点：理解与反思。人是弱态强势，机是强态弱势，人是弱感强知，机是强感若知。人机之间目前还未达到相声界一逗一捧的程度，因为还没有单向理解机制出现，能够产生幽默感的机器依旧遥遥无期。乒乓球比赛中运动员的算到做到、心理不影响技术（想赢不怕输）、如何调节自己的心理（气力）生出最佳状态、关键时刻之心理的坚强、信念的坚定等，这都是机器难以产生出来的生命特征物。此外，人机之间配合必须有组合预期策略，尤其是合适的第二、第三预期策略。自信心是匹配训练出来的，人机之间信任链的产生过程常常为：陌生—不信任—弱信任—较信任—信任—较强信任—强信任，没有信任就不会产生期望，没有期望就会人机失调，而单纯的一次期望匹配很难达成融合，所以，第二、第三预期的符合程度很可能是人机融合一致性的关键问题。人机信任链产生的前提是人要自信（这种自信心也是匹配训练出来的），才能产生他信和信他机制，他信与信他中就涉及多阶预期问题。若存在是语法，意向就是语义，二者中和相加就是语用，人机融合是语法与语义、离散与连续、明晰与粗略、自组织与他组织、自学习与他学习、自适应与他适应、自主化与智能化相结合的无身认知
    + 具身认知共同体、算 + 法混合体、形式系统 + 非形式系统的化合物。反应时与准确率是人机融合智能好坏的重要指标。人机融合就是机机融合，器机理 + 脑机制；人机融合也是人人融合，人情意
    + 人理智。


    人工智能相对是硬智，人的智能相对是软智，人机智能的融合则是软硬智。通用的、强的、超级的智能都是软硬智，所以，人机融合智能是未来的发展方向。但是，融合机理机制还远远没有搞清楚，更令人忧郁的，一不留神，人进化了不少，机又变化得太快。个体与群体行为的异质性，不仅体现在经济学、心理学领域，而且是智能领域最重要的问题之一。现在主流的智能科学在犯一个以前经济学犯过的错误，即把人看成理性人，殊不知，人是活的人，智是活的智，人有欲望、有动机、有信念、有情感、有意识，而数学性的人工智能目前对此还无能为力。如何融合这些元素，使之从冰冻的、生硬的状态转化为温暖的、柔性的情形，应该是衡量智能是否智能的主要标准和尺度，同时是目前人工智能很难跳出人工的瓶颈和痛点，只有钢筋没有混凝土。经济学融入心理学后即可使理性经济人变为感性经济人，而当前的智能科学仅仅融入心理学是不够的，还需要渗入社会学、哲学、人文学、艺术学等领域才能做到通情达理，进而实现由当前理性智能人的状态演进成自然智能人的形势。智能中的意向性是由事实和价值共同产生的，内隐时为意识，外显时叫关系。从这个意义上说，数学的形式化也许会害死智能，维特根斯坦认为，形式是结构的可能性。对象是稳定的东西、持续存在的东西；而配置则是变动的东西、非持久的东西。维特根斯坦还认为，我们不能从当前的事情推导出将来的事情。而迷信恰恰是相信因果关系，也就是说，基本的事态或事实之间不存在因果关系。只有不具有任何结构的东西才可以永远稳定不灭、持续存在；而任何有结构的东西都必然是不稳定的、可以毁灭的。因为当组成它们的那些成分不再以原有的方式组合在一起的时候它们也就不再存在了。事实上，在每个传统的选择（匹配）背后都隐藏着两个假设：程序不变性和描述不变性。这两者恰恰也是造成期望效用描述不够深刻的原因之一。程序不变性表明对前景和行为的偏好并不依赖于推导出这些偏好的方式（如偏好反转），而描述不变性规定对被选事物的偏好并不依赖于对这些被选事物的描述。


    澳大利亚悉尼大学的克里斯·雷德通过研究认为：“它们正在重新定义智能的性质。”一种被称为“海绵宝宝”的黄色多头绒泡菌（Physarum polycephalum），它们也能记忆、决策、预测变化，能解决迷宫问题、模拟人造运输网络设计、挑选最好的食物。它们能做到所有这些事，但它们没有大脑或者说神经系统。这一现象不得不让科学家重新思考：智能的本质究竟是什么？通过研究发现，智能就是人、物、环境系统之间的交互现象，就是智，就是慧，就是情，就是意，就是义，就是易，就是心……心理的心就是人-机-环境系统的交互，很难像物理还原一样进行心理还原，生理/心理与物理最大的不同是：一个是生一个是物，一个是活的一个不是活的，一个不易还原一个较易还原。人文艺术之所以比科学技术容易产生颠覆原创思想，不外乎在于跨域性的反身性——移情同感，超越自我，风马牛也相及，而人一般都不愿意因循守旧一生，所以人文艺术给人提供了更广阔的想象空间，正可谓人们看见什么并不重要，重要的是人们如何诠释看见的事物。


    德里达有句名言“放弃一切深度，外表就是一切”，他隐藏的意思是：生活本身并不遵守逻辑，它是非逻辑的，无标准的，就像文学，以一种陌生的逻辑在舞蹈。


    ### 四、人机-语言-可解释性

    人的意识是由虚拟和真实参照系共同作用的结果。这也是机器不能产生意识的主要原因——没有虚拟参照系（抑或是机器的虚拟参照系统很弱）。


    客观而言，语义就是一种人们之间使用有意义的元素组成的约定，潜意识里的约定俗成比语法更为跨界、灵活，而且人们目前对它的规律还未形成有效的规则认知，于是它便成了复杂性事物。


    寻求人工智能的可解释性也许是个伪命题。A 与 B 之间的交互可解释性是由主体 A 主观认定的，对 A 而言，B 本身就是一个黑匣子，B 到底是怎样真实配合
    A 的，准确地说 A 是不能知道的，即使 B 对 A 进行解释说明，但这种解释也许是真的，也许是假的，也许是真假混杂的（有时甚至连 B 自己也很难说清楚其真实意图——只可意会不可言传），最后两人的—致性协作是由各自对对方的行为及语言自主认知而产生的，比如实现完美或不完美的乒乓球双打，最终两人是靠形成的信任或准信任机制实现交互、融合的。所以，人与人、人与机器之间的可解释性也是循序渐进的，从不可解释到可解释再到不可解释，主要依赖个性化的经验和认知机理，分别的自我理解和诠释是慢慢形成相互之间默契和信任的基础。另外，在可见的未来，机器对人的“理解”性解释也会在一定范围内展开，且一定会在一定范围内展开。无论人人还是人机，能够解不解释也许并不重要，重要的是双方或多方之间良好的互动组织行为及形成的信任机制，这才是交互融合的本质：个性化理解大于可解释计算。“知己知彼”中的“知”不仅仅包含可解释的计算，还应包括不可解释的算计。


    人机智能难于融合的主要原因在于时空和认知的不一致性，人处理的信息与知识能够变异，其表征的一个事物、事实既是本身同时又是其他事物、事实，一直处于情境中的相对状态，机器处理的数据/信息/知识标识则缺乏这种相对变化性。更重要的是人意向中的时间、空间与机形式中的时间、空间不在同一尺度上（一个偏心理一个侧物理），如人在顺利或困难时，一分钟的时间、一间房的空间便可以不同；在认知方面，人的学习、推理和判断随机应变，时变法亦变，事变法亦变，机的学习、推理和判断机制是特定的设计者为特定的时空任务拟定或选取的，与当前时空任务里的使用者意图常常不完全一致，这种不同时空／认知参照系的差异诱发了可变性的不同步。


    如何找到一种可产生意向性的形式化手段或产生形式化的意向性，将是通往人机有效融合智能的关键。目前的数学、物理手段还不能完全承担这个重任，因为它们只试图解决智能——这个复杂性问题的两个侧面，更多超出它们范围的侧面还无法被覆盖。


    智能不是人工智能，更不是机器学习算法。同样，人工智能、机器学习算法也不是智能，智能是人机环境的相互融合，是三者之间的知己（看到苗头）、趣时（抓住时机）、变通（随机应变）。


    ### 五、再思人机融合智能

    人机融合智能就是由人-机-环境系统相互作用而产生的新型智能系统。之所以说它与人的智慧、人工智能不同，具体表现在三个方面：首先，在智能输入端，它是把设备传感器客观采集的数据与人主观感知到的信息结合起来，形成一种新的输入方式；其次，在智能的数据／信息中间处理过程，机器数据计算与人的信息认知融合起来，构建起一种独特的理解途径；最后，在智能输出端，它把机器运算结果与人的价值决策相互匹配，形成概率化与规则化有机协调的优化判断。人机融合智能也是一种广义上的“群体”智能形式，这里的人不仅包括个人，还包括众人，机不但包括机器装备，还涉及机制机理。除此之外，还关联自然和社会环境、真实和虚拟环境等。着重解决上述人机融合过程中产生的智能问题，如诸多形式的数据／信息表征、各种逻辑／非逻辑推理和混合性的自主优化决策等方面。


    在人类的历史长河中，古埃及的象形文字、古巴比伦的楔形文字、古印度河流域的印章文字和中国的甲骨文共同形成了世界四大古文字体系。但唯有中国的甲骨文穿越时空，至今仍在使用且充满活力。根本原因在于西汉时期出现了隶书这一表意性文字，自此，中文文字完成了由表形（图画）到表意的惊险一跳。把两个或者两个以上的不同构件放到一起，从而组成一个字，产生一个意思，这叫会意。简单地说，态势感知就是象形＋会意，而态势感知又是智能科学的基础，所以不难看出，智能科学的核心和关键依旧是何时能够完成“得意忘形”这一惊险的一跳。目前科技进展的种种迹象也表明，人的意向性＋机的形式化是完成智能最高形式——“得意忘形”可能性最大的方式。


    人机融合智能是人工智能发展的必经之路，其中既包括理论方法，也包括人、机、环境之间关系的探索。近年来，人工智能的热度不断加大，越来越多的 人工智能产品走进人们的生活之中，越来越多的人将目光投放到人工智能领域。但是客观地看，当前的人工智能与我们的设想还有一定距离，如何将人的智能迁移到机器中，这是一个很难回避的问题。这些都需要目前的智能科学家做进一步的研究。人机融合智能研究不仅仅要考虑机器技术的高速发展，更要考虑交互主体——人类的思维与认知方式，让机器与人类各司其职，互相促进，这才是人机融合智能研究的前景与趋势。


    ## 第十三章 人工智能：伦理之间

    人工智能的迅速发展给人类的生活带来了一些困扰与不安，尤其是在奇点理论被提出后，很多人质疑机器的迅速发展会给人类带来极大的危险，随之而来的很多机器事故与机器武器的产生更加印证了人们的这种猜疑。于是，关于机器伦理、机器道德的研究层出不穷。究竟什么是人工智能伦理？人工智能会不会取代人类？谁为人工智能负责？人工智能伦理观应该如何建立？接下来我们就来聊聊人工智能的伦理问题。


    ### 一、人工智能是否有伦理

    ### 1. 伦理的概念

    “伦理”一词，英文为 ethics，源自希腊文的“ethos”，其意义与拉丁文“mores”差不多，表示风俗、习惯的意思。西方的伦理学发展流派纷呈，比较经典的有叔本华的唯意志主义伦理流派、詹姆斯的实用主义伦理学流派、斯宾塞的进化论伦理学流派、海德格尔的存在主义伦理学流派。其中，存在主义是西方影响最广泛的伦理学流派，它始终把自由作为其伦理学的核心，认为“自由是价值的唯一源泉”。


    在我国，伦理的概念要追溯到公元前 6 世纪，《周易》《尚书》中已出现单用的伦、理。“伦”指人们的关系，“三纲五常”“伦理纲常”中的伦即人伦；“理”指条理和道理，指人们应遵循的行为准则。与西方相似，不同学派的伦理观差别很大，儒家强调孝悌忠信与道德修养；墨家信奉“兼相爱，交相利”；而法家则重视法治高于教化，人性本恶，要靠法来相制约。


    总的来说，伦理是哲学的分支，是研究社会道德现象及其规律的科学。伦理研究是很必要的，因为伦理不但可以建立起一种人与人之间的关系，而且可以通过一种潜在的价值观对人的行为产生制约与影响。很难想象，没有伦理的概念，我们的社会会有什么人伦与秩序可言。


    ### 2. 人工智能伦理

    其实在“人工智能伦理”一词诞生以前，很多学者就对机器与人的关系进行过研究，并发表了自己的意见。早在 1950 年，维纳在《人有人的用途：控制论与社会》一书中就曾经担心自动化技术将会造成“人脑的贬值”。20
    世纪 70 年代，德雷福斯曾经连续发表文章《炼金术与人工智能》《计算机不能做什么：人工智能的极限》，从生物学、心理学的层面得出了人工智能必将失败的结论。而有关机器伦理（与人工智能伦理相似）的概念则源自《走向机器伦理》一文，该文中明确提出：机器伦理关注机器对人类使用者和其他机器带来的行为结果。该文的作者之一安德森表示，随着机器越来越智能化，其也应当承担一些社会责任，并具有伦理观念，这样可以帮助人类以及自身更好地进行智能决策。无独有偶，2008
    年英国计算机专家诺埃尔·夏基（Noel Sharkey）教授就曾经呼吁人类应该尽快制定机器（人）相关方面的道德伦理准则。目前，国外对于人工智能伦理的研究相对较多，如
    2005 年欧洲机器人研究网络（EURON）的《机器人伦理学路线图》、韩国工商能源部颁布的《机器人伦理宪章》、美国国家航空航天局对机器人伦理学所进行的资助等。国外相关的文献也相对丰富，主要集中在机器人法律、安全与社会伦理问题方面。


    国内方面相关研究因为起步较晚，并不如国外系统与全面。但是近些年来，相关学者也将重点放在人工智能的伦理方面。相关文献有：《机器人技术的伦理边界》《人权：机器人能够获得吗？——从《机械公敌》想到的问题》《我们要给机器人以“人权”吗？》《给机器人做规矩了，要赶紧了？》《人工智能与法律问题初探》等。值得一提的是，从以上文献可以看出，我国学者已经从单纯的技术伦理问题转向人机交互关系中的伦理研究，这无疑是很大的进步。


    不过，遗憾的是，无论是国内还是国外，现在仍然很少有成形的法律法规对人工智能技术与产品进行约束。随着人们将注意力转向这个方向，相信在不远的将来，有关政府部门会出台一套通用的人工智能伦理规范条例，以为整个行业作出表率。


    有关人工智能与人的关系，很多人进行过质疑与讨论。1967 年，《机器的神话》一书的作者就对机器工作提出了强烈的反对意见，他认为机器的诞生使得人类丧失个性，从而使社会变得机械化。而近些年来，奇点理论的提出与宣传，使得人们更加担忧机器是否会在未来全面替代人类。奇点理论的核心思想即认为机器的智能很快就将超过人类。

