    在即时游戏领域，玩家，尤其是游戏经验丰富的玩家往往会发现这样的情况：当到过一个场景后，再去另外一个类似场景时，往往会觉得以前来过这个地方，甚至会顺着以往的记忆去某些区域。又或是当玩过某款游戏后，重新接触另外一款游戏，在面对某些突发状况（比如敌人来袭）时，会不自觉地按动某个键位，而这个键位也许正是之前那款游戏在对敌时需要按动的关键性键位。这一切的叙述，相信接触过即时游戏的玩家都会引起共鸣，而这正是即时游戏中的既视现象。


    即时游戏中的既时感与现实中的既视感有相似又有不同：相似的是，它们都是对未曾经历的事情和场景产生的一种莫名的主观的熟悉感；不同的是，现实中的既视感产生并不是那么频繁，而且往往被认为是一种错觉，是一种预知性的、不真切的熟悉感，因为现实中的记忆繁杂，往往让人难以回忆起产生既视感的记忆来自何时何地，是哪个瞬间，所以现实中的既视感难以在实验室中模拟，是可遇而不可求的，这也因此成为科学界许多人不敢去触碰的禁区，蒙上了一层神秘的外纱。


    而即时游戏中的即视感大多源于游戏经历，与现实的丰富多彩、变化万千不同，游戏产业的高速发展，带来了五花八门的各类即时游戏供玩家们选择，但对即时游戏做过深入探究的或是资深的游戏玩家，都不难感受到，不同的即时游戏之间其实也有诸多相似的因素，而很多即时游戏采用的是同样的游戏模式，可以说当接触过一款即时游戏后，你再接触一款即时游戏时，必然会发现有很多熟悉的地方。相似的体验必然会带来熟悉感，所以在即时游戏中，既视感的出现会比现实中频繁。而游戏记忆也并不会像现实记忆那么繁杂，玩家们在产生既视感时，甚至能回忆起是曾经的哪个或是哪些瞬间，让自己在此刻产生了这样的熟悉感，这样的既视感还能促使玩家通过回忆想出解决当前状况的办法，所以即时游戏中的既视感并没有那么神秘，而本文也将利用游戏中的相似之处，通过实验触发即时游戏中的既视'
