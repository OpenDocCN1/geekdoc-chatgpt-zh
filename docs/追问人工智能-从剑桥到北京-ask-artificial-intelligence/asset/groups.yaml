    ## 4. 游戏人工智能实现技术


    ### （1）有限状态机


    当你设法创造一个具有人类智能的生命体时，可能会感觉无从下手；一旦深入下去你会发现，只需要对你所看到的做出响应就可以了。有限状态机就是这样把游戏对象复杂的行为分解成“块”或状态进行处理的，其处理机制如图
    5-4 所示：首先接收游戏环境的态势和玩家输入；然后提取低阶语义信息，根据每个状态的先决条件映射到响应状态；接着根据响应状态的产生式规则生成动作方案；最后执行响应动作序列并输入游戏，进入下一步循环。由图
    5-4 和图 5-2 比较可知：有限状态机方法是计算机游戏机理的一种简单实现：根据规则人为将原始数据映射到“状态”完成“特征工程和识别”，根据产生式系统将“状态”映射到响应的动作完成“决策制定”，而对游戏态势理解、评估和游戏动机透明。


    ![](img/48fbc65cfef46e8d162d2a377828f62f_103_0.png)


    图 5-4 有限状态机的游戏机理


    那么，理论层次上的“有限状态机”又是怎么描述的呢？有限状态机是表示有限个状态以及在这些状态之间转移和动作等行为的特殊有向图，可以通俗地解释为“一个有限状态机是一个设备，或是一个设备模型，具有有限数量的状态，它可以在任何给定的时间根据输入进行操作，使得从一个状态变换到另一个状态，或者是促使一个输出或者一种行为的发生。一个有限状态机在任何瞬间只能处在一种状态”。通过相应的不同游戏状态，并完成状态之间的相互转换，可以实现一个看似智能的游戏智能引擎，增加游戏的娱乐性和挑战性。


    有限状态机固然简单易懂、容易实现，但是游戏状态的划分、响应动作的制定都直接依赖于人类的先验知识，并决定了游戏的智能水平。因为游戏处理的时间和空间复杂度随着游戏状态的增多而呈指数型增加，所以有限状态机只适用于状态较少的游戏；有限状态机还有一个致命缺陷，就是难以处理状态碰撞的情况。


    ### （2）搜索


    “人无远虑，必有近忧”，如果能够知晓未来的所有情况并进行评估，那么只需要筛选出最好的选择路径就可以完成决策。搜索在棋类游戏的智能实现中备受青睐，其中表现最优秀的是搜索树和蒙特卡罗搜索树。与游戏的一般性机理相比，搜索的游戏人工智能更关注的是预测和评估，而决策的制定只是挑选出预测的最好方式即可（图
    5-5）。


    ![](img/48fbc65cfef46e8d162d2a377828f62f_104_0.png)


    搜索的实现方式直观易懂，如果穷尽搜索，一定可以找到游戏的全局最优值，而且它适用于一切游戏智能实现。但是搜索成功的前提是准确的态势评估和搜索深度，而态势评估一般是专家制定的，即使是使用机器学习学得的评估函数依然很难客观衡量当前态势，搜索的时空复杂度更是随着搜索的深度而呈指数型增长。


    ### （3）有监督学习


    分类、拟合是有监督学习方法，也是实现游戏人工智能的重要方法，旨在在有标签的数据中挖掘出类别的分类特性。无论什么游戏，人类都是在不断的学习中才成为游戏高手的，棋类游戏更是需要学习前人经验并经过专门的训练才能有所成就。经过几千年的探索，人类积累了包括开局库、残局库、战术等不同的战法指导玩家游戏。与游戏的一般性机理相比，有监督学习更关注的是预处理、态势理解和态势预测，首先需要对数据进行去重、去噪、填充缺失值等预处理，然后分析数据并提取数据特征，再使用机器学习算法从数据中挖掘潜在信息并形成知识，实现对当前态势的直观描述或者态势到决策的映射（图
    5-6）。Google DeepMind 的围棋程序“阿尔法狗”就使用了有监督学习训练策略网络，用以指导游戏决策；它的 SL 策略网络是从 KGS GO 服务器上的
    30 000 000 棋局记录中使用随机梯度上升法训练的一个 13 层的神经网络，在测试集上达到 57.0% 的准确率，为围棋的下子策略提供了帮助。


    ![](img/48fbc65cfef46e8d162d2a377828f62f_105_0.png)


    图 5-6 有监督学习机理


    在无人工参与的情况下，有监督学习能够从数据中自主学习成为游戏高手，而且通过不同的有标签数据训练，同一模型无须改动或者做极小改动就可以适用于不同的游戏。但是，数据的质量和数量直接决定了有监督学习模型的性能，而且有监督模型一般存在欠拟合和过拟合的现象，有的算法还极易陷入局部最优解。除此之外，模型参数的选取也直接决定了智能体的智能水平。


    ### （4）遗传算法


    遗传算法是进化算法的一种，它模拟达尔文进化论的物竞天择原理，不断从种群中筛选最优个体，淘汰不良个体，使得系统不断自我改进。游戏的不同智能体通过遗传算法不断迭代进化，可以逐渐从不擅长游戏自主进化成为游戏高手，而无须依赖人类知识的参与。


    在系统中，每个个体是一个游戏智能体（一种游戏智能的实现方式，能根据游戏输入产生决策输出），并通过某种映射转化为一串遗传信息，这串信息代表了我们所要优化游戏智能体的全部特征。如图
    5-7 所示，与游戏的一般性机理对比，遗传算法更关注决策指定，旨在通过一定数量的游戏智能体（可能是随机生成的，也可能是人为指定的，也可能是机器学习学得的）自我进化出一个具有高超游戏水平的游戏智能体，从而实现游戏态势到应对方案的正确映射。遗传算法维持一个由一定数量个体组成的种群，每一轮都需要计算每个个体的适应度，然后根据适应度选出一定数量的存活的个体，同时淘汰掉剩余落后的个体。随后，幸存的个体将进行“繁殖”，填补因为淘汰机制造成的空缺，从而维持种群的大小。繁殖，就是不同个体组合自己本体的一部分形成新的副本。然而为了实现进化，必须要有模拟基因突变的机制。因此，在复制副本的时候也应当使得遗传信息产生微小的改变。选择–繁殖–突变这样的过程反复进行，就能实现种群的进化。


    ![](img/48fbc65cfef46e8d162d2a377828f62f_106_0.png)


    图 5-7 遗传算法的游戏机理


    遗传算法是一种与问题领域无关的自学习算法，可以在无人为参与的情况下实现游戏智能，而且遗传算法的可扩展性强，可以组合其他游戏智能实现技术获得更加智能的游戏个体。但是，遗传算法一般只能获得满意解，而不能获得最智能的游戏智能体；而且参数、适应性函数的确定需要不断尝试，否则会严重影响游戏个体的智能性；另外，遗传算法求解速度很慢，要得到游戏较智能的个体需要较多的训练时间。


    ### （5）强化学习


    一个无所知的游戏智能体通过不断地与环境交互来改进自己，进而趋利避害，这就是强化学习。如图 5-8 所示，与游戏的一般性机理相比，强化学习更关注决策制定，它内部维护一个策略函数，通过对游戏态势做出决策从而获得反馈，并不断改进策略函数，使得针对环境态势、自身决策获得最大報酬值，让游戏结果向着有利于游戏智能体的方向发展，不断迭代这个过程就可以获得从态势到决策的最优映射。


    ![](img/48fbc65cfef46e8d162d2a377828f62f_107_0.png)


    图 5-8 强化学习的游戏机理


    强化学习有着坚实的数学基础，也有成熟的算法，在机器人寻址、游戏智能、分析预测等领域有着很多应用；而且强化学习是一种与问题领域无关的自学习算法，可以在无任何人为参与的情况下实现游戏智能。但是，强化学习对于连续、高维的马氏决策问题将面临维数灾难，而且学习效率不高、在理论上的收敛性也难以保证。


    ### （6）DRN


    DRN 是 Google DeepMind 在 Playing Atari with Deep Reinforcement Learning 中结合深度学习和强化学习形成的神经网络算法，旨在无需任何人类知识，采用同一算法就可以在多款游戏上从不擅长游戏者变成游戏高手。与游戏智能的一般性机理相比，DRN将整个处理流程集成于一个神经网络，自主实现逐层抽象，并生成决策方案。首先使用数据预处理方法，把128色的210×160的图像处理成灰度的110×84的图像，然后从中选出游戏画面重要的84×84的图像作为神经网络的输入；接着使用CNN自动进行特征提取和特征表示，作为BP神经网络的输入进行有监督学习，自动进行游戏策略的学习。


    DRN在Atari游戏上的应用证明了它的成功：击败了人类顶级玩家。但是，DRN底层使用了CNN做特征提取，使得它更适用于以二维数据为输入的游戏。


    ### （7）深度学习 + 强化学习 + 博弈树


    Google Deep Mind的AlphaGo使用值网络评价棋局形式，使用策略网络选择棋盘着法，使用蒙特卡罗树预测和前瞻棋局，试图冲破人类智能最后的堡垒。策略网络使用有监督学习训练+强化学习共同训练获得，而值网络仅使用强化学习训练获得，通过这两个网络结构总结人类经验，自主学习获得对棋局的认知；然后使用蒙特卡罗树将已经学得的知识应用于棋局进行预测和评估，从而制定着法的选择。


    ## 5. 即时游戏中的信息融合与既视现象


    ### （1）即时游戏中的信息融合


    信息融合（information fusion）起初被称为数据融合（data fusion），起源于1973年美国国防部资助开发的声呐信号处理系统，其概念在20世纪70年代就出现在一些文献中。20世纪90年代，随着信息技术的广泛发展，具有更广义化概念的“信息融合”被提出出来。在美国研发成功声呐信号处理系统之后，信息融合技术在军事应用中受到了越来越广泛的青睐。


    后来，广义上认为信息融合是将几种不同的信息合成一体。直观上讲，信息融合是以不同的信息为前提，采用合成的手段，最后形成一个新的信息。需要注意，信息融合的结果对于最终决策起着至关重要的作用，这当然是以正确的信息融合为前提。


    信息融合一直以来往往和传感器、军事技术结合在一起，而在即时游戏领域，信息融合并没有明确定义，本文的研究内容为即时游戏中的信息融合现象，对此，本文也对即时游戏中的信息融合下了一个定义：在即时游戏中，信息融合是指玩家在接收不同的游戏数据信息（比如血量、位置、时间、技能等）时，对信息进行融合，并对融合的信息做出决策。


    玩家在对经历过的场景、突发情形、技能图标等信息形成一定记忆或反应习惯后，当类似的繁杂信息输入时，玩家对接收的信息进行认知，并产生一种似曾相识的感觉，同时玩家由于记忆程度、注意力状况不同，在对输入信息进行融合时会有认知差异以及反应差异，进而形成不同的信息融合结果，并对最终的决策和任务的完成产生不同的影响。这种游戏中产生的似曾相识的感觉也被称为游戏中的既视感。


    ### （2）神秘的既视现象“似曾相识感”


    既视现象又称既视感，就是未曾经历过的事情或场景仿佛在某时某地经历过的有似曾相识之感，目前关于“似曾相识”现象有一种解释差不多成为标准：“对当前的、从未经历过的事物、场景产生的一种主观的熟悉感。”


    例如，与朋友到一个你从未到过的餐厅吃饭，进门的瞬间，你突然有种恍惚感和强烈的似曾相识感：碗筷摆放的位置、周围陌生人的觥筹交错，甚至是餐馆的结构布局和暖黄的灯光，突然变得如此熟悉。此情此景，你好像早已经在某个时刻都经历过了，甚至连朋友接下来要说的话和坐姿你都能猜个八九不离十。这种“似曾相识”感，来去不受我们自己控制，经历的时候你会觉得神奇与诡异不已，以为自己具有了某种先知先觉的超能力。它来袭时，伴随着一种强烈的真实感和熟悉感，同时也让人感到神秘、诡异和困惑，因此，人们会用“第六感”等词汇来描绘它，甚至用一些诸如梦境、先知等神秘主义来解释这种现象。调查显示，有
    2/3 的成人都曾遇到过“似曾相识”事件。有网友用“可遇不可求”来描述这种奇妙的感觉，“看到的时候完全分不清是现实还是梦境，整个人处在一种很‘恍惚’的状态。”有一位网友这样描述他的戏剧性深刻印象：“遇到某些场景时，总觉得似曾相识，好像在某个时候发生过，而且有的时候，当闻到一种气味，或者光线配合声音，变换到某个角度时，也会突然有这样的感觉，画面中说话人的声音、那熟悉的气味，仿佛自己早已经历过。”


    截至目前，还是几乎没有太多可靠的方式在实验中触发“似曾相识”感，由于不管哪种“似曾相识”现象都不能为科学家的观察实验当场提供行为，所以，主流心理学家的研究始终难以顺利进行。与此同时，其他学科对该现象的兴趣却非常浓厚。


    脑神经专家认为，大脑时刻在进行潜意识活动，虚构出各种情境，现实中遇到相似情景时，就会与虚构的记忆相呼应而产生幻象；医学工作者认为“似曾相识”是由记忆错误造成的，大脑中的记忆缓存区先暂存记忆，在存储时发生了错误，以为眼前事物就是历史记忆库中的，这样的错觉通常在大脑疲劳时产生。


    一些物理学的解释更为有趣。以物理学的“时光倒流”来分析，人的控制神经传给记忆神经的速度大于光速后，四维空间发生暂时混乱，大脑反应传到记忆神经时，人就会感觉曾经发生过。基于爱因斯坦的相对论，高能物理学和其他边缘物理学家提出，灵魂是一种携带巨大能量的高能粒子，能够突破时间和空间的障碍，使记忆进行时空穿梭而让人产生似曾相识之感。时空交叉观点则是从爱因斯坦关于时空的观点出发，认为这个世界有许多平行的时空，每个时空都有自己的规律，一般不会交叉。当出现例外情况，即时空错乱时，如碰巧遇到与未来时空的交叉，就会很短暂地进入未来时空，在没有察觉的情况下，又很快回来。当人在现在的时空经历到未来的那个时段时，感觉场景与记忆储存一致，就产生了似曾相识之感。物理学家的假说给“似曾相识”现象提供了更广阔的空间，却给这一现象增添了更多神秘感和灵异成分。美国南卫理公会大学心理学教授阿兰·布朗表示：“这个领域被许多科学无法解释的理论污染了，成为许多科学家不愿意触碰的棘手问题。”


    ### （3）即时游戏中的既视现象


    尽管在科学界，既视现象已经几乎成为一个禁区，研究现实中的既视感难度也确实十分大，但本文通过对北京邮电大学的部分即时游戏玩家进行访谈后，对即时游戏中的既视现象和现实中的既视现象做

    '
