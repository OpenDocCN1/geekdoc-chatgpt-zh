    的“深度学习之父”杰弗里·辛顿，他是剑桥大学心理学的本科生，后来到了加拿大，继续做关于人工神经网络的研究，并提出了深度学习的概念和方法，人工智能因此得到了复兴和现在的繁荣。第三个是“阿尔法狗（AlphaGo）之父”哈萨比斯，他毕业于剑桥大学，对推动人工智能的发展也起到了非常重要的作用。


    霍金曾说过，在过去的数十年里，人工智能一直专注于建设智能体所产生的问题，即在特定的情境下，可以感知并行动的各种系统。在这种情况下，智能是一个与统计学、经济学相关的理性概念。通俗地讲，这是一种做出好的决定计划和推论的能力。


    ![](img/48fbc65cfef46e8d162d2a377828f62f_17_0.png)


    图 1-1 在剑桥偶遇霍金


    人工智能来自于智能，而智能，究其最深之处是一个哲学问题。早期有一批哲学家一直在讨论什么是智能，什么是知识。迈克尔·波兰尼（Michael Polanyi）曾在
    20 世纪 60 年代写过一部《默会维度》（The Tacit Dimension），提出“我们知道的越多，那么我们知道的越少”。同时，他认为我们知道的远比我们说出来的要多很多（We
    can know more than we can tell）。波兰尼这句话中体现出了默会知识、隐性知识，在支配着我们不断地向显性的知识递进与演化。


    弗里德里希·哈耶克（Friedrich Hayek）在经济方面对世界的影响很大，曾拿过诺贝尔经济学奖。他一生当中，对政治、社会、经济、文化、艺术、哲学和心理学均有涉猎，在认知科学方面，他有一本著作《感觉的秩序》(The
    Sensory Order)。在这本书中，他明确地提出了一个观点“Action more than design”，即“行为远比设计更重要”，其大意即人的各种感觉是通过行为来表征的，而不是故意设计出来的，后来的演化造成了设计的出现。维基百科的创立人之一吉米·威尔士（Jimmy
    Wales）很推崇《感觉的秩序》一书，认为是这本书点醒他创立了维基百科。


    卡尔·波普尔（Karl Popper）是一位伟大的哲学家，提出了三个世界的观点，即物理的、精神的和人工的。他有一本非常经典的著作《科学发现的逻辑》(The
    Logic of Scientific Discovery)，他提出科学不是证实而是证伪，认为科学是提出问题进行猜想，然后进行反驳，不断试错，接着有新科学的出现，而不是常规意义上的观察归纳来证实的实证机制。在归纳里面有很多的漏洞，因为归纳是不完全的归纳，波普尔就有针对性地对归纳进行了梳理。


    通常认为人工智能的学科起源，是从1956年美国达特茅斯会议开始的。但实际上，它的科学起源最早可以追溯到19世纪曾任剑桥大学卢卡斯教授的查尔斯·巴贝奇（Charles
    Babbage），他是世界上做机械计算机的鼻祖，做出了 一台机械计算机，能够用来计算正弦和余弦数值的大小，从此人类拉开了计算的帷幕。另一个是剑桥大学的伯特兰·罗素（Bertrand
    Russell），罗素利用其哲学思想和他的数学基础，创立了一个很重要的哲学分支——分析哲学。将分析哲学推至制高点的是路德维希·维特根斯坦（Ludwig Wittgenstein），他在《逻辑哲学论》这部书里提出，语言是哲学的重要工具，也是哲学的切入点。在此之前，哲学的发展有两个里程碑，其中一个是关于世界本源的问题，即是物质的还是意识的，这个问题讨论了一千多年，后来笛卡儿开始研究用什么样的方法来认识世界是物质的还是意识的，继而提出二元论。在此之后，人们找了很多方法来研究哲学，但收效甚微，直到维特根斯坦改变了哲学的轨迹。他的前半生研究关于语言的人工性，所谓人工性的语言就是标准化的语言、格式化的语言、流程性的程序化的语言；他的后半生主要否定了自己前半生的工作，开始研究生活化的语言、自然化的语言，他认为真正的哲学是通过生活化的语言，来体现哲学的深奥和哲学的意义。


    针对智能的概念，权威辞书《韦氏大词典》中的解释是“理解和各种适应性行为的能力”；《牛津词典》中的说法是“观察、学习、理解和认知的能力”；《新华字典》中的解释是“智慧和能力”；美国著名人工智能研究专家阿尔布斯（James
    Albus）在答复另一位人工智能专家埃克斯穆尔（Henry Hexmoor）时说，“智能包括：知识如何获取、表达和存储；智能行为如何产生和学习；动机、情感和优先权如何发展和运用；传感器信号如何转换成各种符号；怎样利用各种符号执行逻辑运算，对过去进行推理及对未来进行规划；智能机制如何产生幻觉、信念、希望、畏惧、梦幻甚至善良和爱情等现象”。作为一门前沿科学和交叉学科，人工智能至今尚无统一的定义。不同科学背景的学者对人工智能做了不同的解释：符号主义学派认为人工智能基于数理逻辑，通过计算机的符号操作模拟人类的认知过程，从而建立起基于知识的人工智能系统；联结主义学派认为人工智能基于仿生学，特别是人脑模型的研究，通过神经网络及网络间的链接机制和学习算法，建立起基于人脑的人工智能系统；行为主义学派认为智能取决于感知和行动，通过智能体与外界环境的交互和适应，建立起基于“感知-行为”的人工智能系统。其实这三个学派分别从思维、脑、身体三个方面对人工智能进行了阐述，目标都是创造出一个可以像人类一样具有智慧、能够自适应环境的智能体。


    ## 二、人工智能，一道长河


    总体而言，人工智能的发展可以分为四个阶段，即酝酿阶段、起步发展阶段、反思发展阶段与蓬勃发展阶段。


    ### 1. 酝酿阶段


    任何事物的形成与发展都有一定基础，人工智能也不例外。首先，在哲学领域，学者对于意识问题情有独钟。自从笛卡儿于17世纪提出“我思故我在”的论述之后，有关意识的组成争论就从未停止过。托马斯·霍布斯、梅洛·庞蒂等曾经明确反对身心二元论，前者认为人是纯粹理性的，而后者认为身体和心理并不是独立分开的个体。可以说，这些哲学争论为早期的人工智能起到了很好的促进与推动作用。


    1943 年，麦克洛奇与匹茨提出了著名的 M-P 模型（McCulloch-Pitts neural model），他们将神经元视为二值开关，通过不同的组合方式可以实现不同的逻辑运算。该模型的意义在于开创了人工神经网络的研究。1949
    年，唐纳德·赫布（Donald Hebb）提出学习模型，大体观点为，如果在突触前后的两个神经元被同步激活，那么这个突触连接增强。M-P 模型与赫布学习规则的确立为后期的联结主义奠定了基础。


    在其他领域，“现代计算机之父”冯·诺依曼（von Neumann）于 1945 年提出了后来被称为冯·诺依曼结构的计算机体系结构，并被沿用至今。1948 年，诺伯特·维纳（Norbert
    Wiener）指出了神经系统与计算机工作的相似性，找到了它们之间的内在联系，将自动控制的研究提高到了一个新的高度，对后期人工智能学科的创立产生了巨大的影响。1936
    与 1950 年，阿兰·图灵先后提出图灵机与图灵测试的概念，旨在弄清楚计算机能做什么、如何定义智能等关键问题。维特根斯坦也对这个问题有所思考，他在《哲学研究》中明确指出：机器肯定不能思维。


    ### 2. 起步发展阶段


    人工智能早期发展的主要领域在于公理证明。艾伦·纽厄尔（Allen Newell）和赫伯特·西蒙（Herbert Simon）等人编写了一种名为逻辑理论家（LT）的智能程序，用来证明数学命题。与常见的数学推理过程不同，这种程序由结论出发，一步步从后向前分析，直到找出合适的证明问题为止。1963
    年，LT 程序证明了罗素与怀特海《数学原理》第一章中的全部定理。两年后，逻辑学家王浩和数理逻辑家亚伯拉罕·鲁滨逊（Abraham Robinson）使用消解方法，使用机器证明了《数学原理》中的全部命题演算定理。


    在其他研究领域，人工智能也有了初步的进展。1957 年，罗森勃拉特（Frank Rosenblatt）首次引入了感知机的概念，推广了联结主义的研究，同时感知机的出现使神经网络也露出了其庐山真面目。几年后，模仿自然生物进化机制的演化计算开始出现，代表人物为霍兰德（John
    Holland）与福格尔（David Fogel）。1965 年，麻省理工学院人工智能实验室的罗伯兹编写出多面体识别程序，开创了机器视觉的领域。


    ### 3. 反思发展阶段


    在起步发展阶段，各个领域都有了一定的进展，但是，这离当初设想的人工智能程度还相距甚远。1969 年，被称为“人工智能之父”的马文·明斯基（Marvin Minsky）与西蒙·派珀特（Seymour
    Papert）发表著作《认知器演算法》(Perceptrons)，指出单层感知器不能实现 XOR（异或问题）逻辑，这极大地打击了研究者的信心。20 世纪 70
    年代初，对人工智能提供资助的机构，如美国国防高级研究计划局（DARPA）、美国核管理委员会（NRC）对无方向的人工智能研究逐渐停止了资助。人工智能的第一次寒冬到来。


    在低谷阶段，人工智能界开始了反思。一派是以德雷福斯（Hubert Dreyfus）为代表，无情地对人工智能进行批判，他曾说人工智能研究终究会陷入困局；而另一派则对人工智能抱有希望，代表人物为费根鲍姆（Edward
    Feigenbaum），他认为要摆脱困境，需要大量使用知识。于是，知识工程与专家系统在各个领域崭露头角，比如早期的反向链接专家系统 MYCIN 可以诊断一些特定类型的传染病。这个阶段（1976～1980
    年）也被称为复兴期。


    进入 20 世纪 80 年代后，人工智能界重新肯定了早期人工智能研究中的神经联结方法与遗传算法。1982 年，霍普菲尔德（John Hopfield）提出了
    Hopfield 神经网络，引入了“计算能量”概念，给出了网络稳定性判断。1984 年，他又提出了连续时间 Hopfield 神经网络模型，为神经网络的研究做了开拓性的工作。1986
    年，杰弗里·辛顿、鲁姆哈特（David Rumelhart）和麦克勒兰德（James McClelland）重新提出了反向传播算法，即 BP 算法。值得一提的是，联结主义不同于符号主义，其研究方法巧妙地避开了知识表示所带来的困难。


    与此同时，布鲁克斯（Rodney Brooks）教授在 1991 年发表论文，批评联结主义与符号主义不切实际，将简单事情复杂化。他强调感知与行为直接联系，这也极大地促进了人工智能界另一学派——行为主义的发展。


    由此可见，在这一阶段，人工智能的研究空前繁荣，可是好景不长，1987 年现代计算机的出现，让人工智能的寒冬再次到来。人们普遍发现人工智能领域没有取得实质性的突破，而所谓的专家系统使用范围依然有限。于是，人工智能研究再一次陷入停滞。


    ### 4. 蓬勃发展阶段


    1997 年 “深蓝” 的胜利，重燃起人们对于人工智能的兴趣。2006 年，辛顿提出深度置信网络，使深层神经网络的训练成为可能，这也使得深度学习迎来了春天。2011
    年，国际商业机器公司（IBM）的 “沃森” 参加《危险边缘》（Jeopardy!）问答节目，并打败了两位人类冠军，轰动一时。2012 年，辛顿的学生艾利克斯·克里泽夫斯基（Alex
    Krizhevsky）使用 AlexNet 以大幅度的优势取得了当年 ImageNet 图像分类比赛的冠军，深度神经网络逐渐开始大放异彩。同年，运用了深度学习技术的谷歌大脑（Google
    Brain）通过观看数千段的视频后，自发地找出了视频中的猫。2016 年，Google DeepMind 的 “阿尔法狗”（AlphaGo）战胜了世界顶级围棋高手李世石，由此推动了人工智能的再一次发展，目前正处于人工智能发展的第三次高潮期。


    ## 三、人工智能，硕果累累


    “阿尔法狗” 战胜李世石使得人工智能迅速成为社会上的热门话题，这种对人工智能的大量关注，一方面推动了它的发展，另一方面也存在很多误解。有的人认为人工智能是拯救各种社会问题的万能良药；有的人认为人工智能的发展应用如同打开潘多拉魔盒，会带来问题与不幸。其实如同很多其他基础技术一样，人工智能也是一把双刃剑，需要我们综合地、辩证地看待其优势与不足。现在人工智能的发展基本处在点状突破向面状发展的过渡阶段。


    一方面，以计算机视觉、自然语言处理等为代表的领域中的某些应用取得了重要的突破。这些突破的应用基本属于面向有限开放场景下的特定任务的单一人工智能系统或多个专用系统集成而成的较为复杂的系统。这些应用都是面向特定任务的，比如人脸识别、棋类、自动驾驶、简单场景下的语音识别等。这些应用场景通常比较简单，任务较为单一，任务需求明确，并且可以较为方便地实现形式化，有较多的数据积累，在此类应用中有些人工智能系统已经可以超过人类的水平，如图像分类、棋类运动、无人驾驶等。


    另一方面，集合多种感知及认知能力、面向不同类型任务的通用人工智能（general artificial intelligence，GAI）系统虽然也经过了数十年的发展，但仍然未取得较大的进展，应用遥遥无期。通用人工智能相对专用人工智能更接近人类智能，人脑是一个通用智能系统，可以处理视觉、听觉、触觉等多种感觉，并将它们融合处理，可以进行小样本学习，可以举一反三，可以将不同领域的知识互相迁移融合，可以进行判断、思考、推理、规划等多种任务。相对而言，专用人工智能系统都是弱人工智能，只有通用人工智能才能实现强人工智能，但通用人工智能的发展仍然面临诸多难题，如多模态信息融合、小样本学习、逻辑推理、直觉决策与逻辑决策等多个方面。总体而言，目前的人工智能整体处于有计算而无算计、有智能而无智慧、有感知而无认知的阶段。


    总体上看，人工智能虽然已过“花甲之年”，但当前的发展速度却不亚于其“年轻”时，社会影响也更为广泛。当前以深度学习、强化学习等为代表的新人工智能技术不断取得突破，“人工智能+”的模式逐渐应用于安防、零售、工业自动化、无人驾驶等各行业、各领域，为技术进步、产业模式转型、社会及经济发展注入新的动力。同时，人工智能的应用也为社会治理、道德、法律带来了之前不曾预料过的新问题及挑战，需要社会各界共同努力，寻求解决方案。


    ## 四、人工智能，未来世界


    毫无疑问，目前人工智能正处于蓬勃发展阶段，但是也要冷静地看到，人工智能的发展仍然存在一些问题，同时研究精力也过多地集中在某些领域而在一定程度上忽视了其他领域。在一些领域，人工智能的水平已经接近甚至超过了人类，而在其他的很多方面，人工智能与人类智能相比依旧相距甚远。同时，人工智能的应用已经给从社会到家庭，从工作到生活，从军事到医疗等不同范畴、多个领域都带来了明显的乃至革命性的变化。一方面，人工智能的发展是一个技术性问题，当前仍然存在很多缺陷，需要从技术上加以解决；另一方面，如同其他革命性的技术一样，人工智能的发展绝不仅仅是一个技术问题，它是一把双刃剑，既可以带来机遇，也能带来挑战，它在给人类带来不同改变的同时，也影响着人们对它的看法，影响着其未来。


    纵观整个 人工智能发展史可以发现，总是在人工智能的发展趋向取得大的突破时，冬天突然来临，而且每次来临的原因大同小异，均 为现有的技术水平达不到人们的心理预期以及商业需要，所以不得不搁置，这也为正处于繁荣发展阶段的我们敲响了警钟，不能仅仅管中窥豹，从业者要有前瞻的目光，主动解决目前行业存在的瓶颈，这样才能使人工智能领域尽可能地平稳高效地发展。


    相信很多人都有着这样的疑问：究竟我们能不能达到所谓的强人工智能？因为单从目前的智能程度来说，在较为通用的智能方面，人工智能还远远谈不上人们想要达到的程度。“阿尔法狗”的诞生，曾
    经令很多人眼前一亮，但现在仔细看来，“阿尔法狗”只能在围棋领域有所建树，不能跨越到其他情景之中。搜狗公司首席执行官王小川也曾说过，现在的人工智能还存在很多弱点，即使在
    3 个月后，“阿尔法狗”也赢不下当初输掉的那场比赛。那么，具体的瓶颈究竟在什么地方呢？


    首先是动机性。在心理学上，动机一般被认为涉及行为的发端、方向、强度和持续性。动机也是有层次的，不同层级可以互相转换。马斯洛（Abraham Maslow）于
    1943 年在《人类激励理论》一文中将社会需求层次与生理需求、安全需求、尊重需求和自我实现需求并列为人类五大需求，人处于不同的需求层次就会有不同的动机层次。有了动机后，人们的行为就有了指向性，这对于人的日常行为是非常重要的。那机器究竟能否形成与人类似的动机呢？让机器产生动机的一大难点在于动机是很难被表征的。目前还没有研究清楚的展示动机的形成机制，表征的必要不充分条件是具有可以被清晰表达的框架，而且动机的转换边界并不清楚，因此，动机的权重值便无从下手，导致计算陷入僵局。另外，动机还有意识动机与无意识动机之分。目前，人工智能界对于意识层面的内容还知之甚少，更不要提进行表征了。


    其次是常识。常识被定义为在一定的文化背景下，人们拥有的相同的经验知识，比较常见的有空间、时间、文化、物理常识。常识对于我们的日常生活十分重要，尤其是在我们做出决定与判断的时候尤为如此。很多常识是潜移默化形成的，是文化与背景学习的产物。那机器如何形成常识呢？早在
    1959 年，约翰·麦卡锡（John McCarthy）就已经想过让机器拥有常识以变得更加聪明。目前的人工智能界有两种方法来解决这个问题。第一种方法为让机器形成学习与观察周围环境的机制，就像一个孩子一样去学习，不过这样时间成本比较大，用户能否承担起这些成本还是未知数。明斯基曾说：常识是长期实践中总结出来的庞大知识体系，包含大量生活中学到的规则和异常现象、特性及趋势、平衡与制约等。第二种方法就是建立大型的常识库，并将其存储到电脑中。其中最为著名的为
    CYC 项目，这个项目由道格拉斯·莱纳特（Douglas Lenat）于 1984 年提出。首先通过采访与观察人的数据，然后由知识工程师对这些数据进行处理，以
    CYCL 的形式整理成数据库。当然，这个常识库的成本过于高昂。目前常识库中比较可行的思路为让互联网上的每个用户共同建立这个常识库，并在特定的网页使用不同的语言来进行编写，这样就能节省很多时间与金钱，最为成熟的为
    OMCS（Open Mind Common Sense）。


    最后是决策。无论是人类的日常生活还是人工智能，最为关键的一步就是决策。如何让机器更加智能地进行决策，这是一个关乎未来人工智能走向的问题。人类的决策机制主要分为三大部分：理性决策、描述性决策与自然决策。理性决策即认为人在决策时遵循着理性价值最大化的原则，比较具有代表性的有冯·诺伊曼提出的最大期望效用理论，伦纳德·萨维奇（Leonard
    Savage）提出的主观期望效用理论等。而描述性决策认为人在进行决策时不完全遵循理性准则，其中丹尼尔·卡尼曼（Daniel Kahneman）与阿莫斯·特沃斯基（Amos
    Tversky）提出的前景理论是其中的代表。该理论认为，决策者依据价值函数、权重函数赋予选项不同的效用值，最终选取最大期望效用值做出决策。人也存在着启发式偏差，这会对决策产生影响。而自然决策专门研究人们如何在自然环境或仿真环境下实际进行决策，其中最著名的要属加里·克莱因（Gary
    Klein）提出的再认一启动模型（RPD），该模型认为人在决策时会依据以前的模式进行匹配。对于机器而言，进行智能决策可以借鉴人的决策习惯，可以将几种思维方式进行结合，并确认出一套判断机制，以便在特定情景下对决策行为进行抉择。例如，机器可以区分出时间与情景的压力，并建立起相对应的匹配机制，如当情景压力小时选择理性决策模式，而当时间压力大时选择自然决策模式等。


    由此可见，目前人工智能界对常识、动机与决策问题中的难点解决办法看起来还不是很多，但这确是目前机器智能与人智能之间差异最为显著的地方，也是目前整个行业的瓶颈所在。如何让下一代人工智能产品更有“温度”，需要先在这几个问题上有所突破。


    ## 五、人工智能，资本之下


    同样，人工智能的发展不仅面临着技术层面的问题，还面临着技术之外的问题。随着人工智能日益成为新一轮产业变革和经济社会发展的核心驱动力，重构生产、分配、交换、消费等经济活动环节，催生出更新的技术、产品、产业、模式，引发社会经济结构的重大变革，深刻改变着人类的生产生活方式和思维方式，实现社会生产力的整体跃升就成为未来社会变化的趋势。在这场以人工智能为引领的变革中，各大科技巨头是主力军，无论是国外的谷歌（Google）、微软还是国内的百度、阿里巴巴、腾讯，在人工智能的研发、应用方面都

