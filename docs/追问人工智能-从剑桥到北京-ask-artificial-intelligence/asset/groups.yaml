    能否推导出“价值”命题。休谟指出，由因果推理获得的知识，构成了人类生活所依赖的绝大部分知识。这个由休谟对因果关系的普遍、必然性进行反思所提出的问题被康德称为“休谟问题”。“休谟问题”表面上是一个著名的哲学难题，实际上更是一个人工智能的瓶颈和难点，当把数据表征为信息时，“能指”就是相对客观表示“being”，而“所指”就是主观表达“should”。


