    # 四、不再是沒有情感的機器


    情感是人类智能的重要组成部分，是穿越理性的一把利器，然而，情感计算这一方向能否可行？如同形式化常识一样能否实现？这些问题都值得深思和探索。


    大约半个世纪前，美国心理学家、“认知心理学之父”奈瑟尔（Neisser Ulrich）描述了人类思维的三个基本和相互联系的特征，这些特征在计算机程序中也明显存在着：第一，人类的思维总是随着成长和发展过程积累，并且能对该过程产生积极作用；第二，人的思想开始于情绪和情感的永远不会完全消失的密切关系中；第三，几乎所有的人类活动，包括思维，在同一时间的动机具有多样性而不是单一的。赫伯特·西蒙表达了相似的观点。尽管情绪和情感是人类日常生活中的基本组成部分，但缺乏情感交互的技术是令人沮丧的，它'
