    # 第十二章

    人机融合的哲学探秘


    人机融合智能是一种新的智能，它不同于人的智能，也不同于人工智能，是一种跨物种越属性结合的下一代智能科学体系。如果说真就是存在，善就是意向，美就是“存在＋意向”的融合；假设机是存在，人是意向，那么人机就是“存在＋意向”的融合，是形式化＋意向性，是东西方文明的共同结晶的体现。'
  - '[PAGE 205]


    <!-- no content -->'
  - '[PAGE 206]


    一般而言，东方文明对智能的追求永远是“反求诸己”，企图打破人自身思维的界限从而达到超越性的智慧；西方则追求借助外力的计算来实现超越，计算即要求有穷，或者说至少极限存在“存在”，函数收敛。而针对无穷发散式的问题，也就是意向的问题，人工智能很难跨出聚合这一步，而人机融合智能则能跨出这一步：人的意向性可以灵活自如地帮助人机协调各种智能问题中的矛盾和悖论。


    从表面看，人机融合智能问题是一个现代科学技术问题，但它同时也是一个古老的伦理问题。伦有四种解释：举、类；人与人之间的关系；条理，次序；姓。伦理，指的是就是人与人、人与自然的关系，以及处理这些关系的规则。人们往往把伦理看作对道德标准的寻求，道德是后天养成的合乎行为规范和准则的东西。它是社会生活环境中的意识形态之一，是做人做事和成人成事的底线。它要求我们且帮助我们，并在生活中自觉自我地约束着我们。假如没有道德或失去道德，人类社会就不再是美好的，甚至于成为一个动物世界，人也就变得无理性和智慧可言。伦理道德最现实的作用就是使人对事物产生价值观，而这种价值观恰恰是产生意向和存在的主要源泉，意向性是意识的基础、存在是规律的反映，人类智能的根本就在于此：“德化情，情生意，意恒动。”“意恒动，识中择念，动机出矣。”


    传统逻辑学规范的对象是一种可自控的推理活动。作为逻辑学莫基于伦理学之上的一个基本论证，皮尔士强调：“就其一般特征来看，推理现象类似于那些道德活动的现象。因为，推理本质上乃处于自控状态下的思想，正如道德活动乃处于自控状态下的活动一样。实际上，推理是受控活动的一种，因此必然带有受控活动的本质特征。虽然由于教士专门负责让你们记住，推理现象并非像道德现象那样为你们所熟知，但是，如果你们关注推理现象，可以很容易看到，一个得出理性结论的人不仅认为它是真的，而且认为每一类似情况下的推理同样正确。如果他没有这样认为，他的推断就不能称为推理。它不过是他心中出现的一个想法，他认为它是真的。而由于没有经受任何检'
  - '[PAGE 207]


    查或控制，它并不是被有意认可的，并不能称为推理。” 这里核心的论证结构是，任何可判定好坏的行为都必须是可自控的，逻辑学以区分推理好坏为主要任务，所以作为逻辑规范对象的推理必须是可自控的活动。对于人造的机器、机制而言，其本质必然是可自控的活动结果，而人的则未必完全是逻辑自控的，人机融合智能更不是逻辑的自控推理活动。


    # 一、人机融合智能的思考


    人类价值观的起源是伦理学，机器的起源是人类。现实中，人类的伦理道德困境就有不少，而人类给机器人“装”进去价值，恐怕会有更多的伦理范式之间的对冲突盾产生吧！无论如何，从中不难看出，人机融合的未来必将荆棘密布、困难重重。


    伦理可以规范出道理，道理可以演化出物理，物理可以抽象出数理，数理可以泛化于管理、生理、心理……正如生活中所常见的那样，一种自然数据一旦接触到另一种自然数据或社会数据，其性质就会发生较大变化，而那些在临界值／区的数据／数值变化，直接导致了价值的出现和信息的产生。（自然、社会、真实、虚拟）隐显混合信息／知识构成的概念“能指、所指”往往呈现出生态多样性，在理论中变得越发生动活泼跳跃。人机之间的理论、概念、知识、信息、数据之间是弥散膨胀关系，为了不失真，它们相互之间的转换效率需要用某种方法来衡量，这些表征就是我们要寻找的关键点和突破口。概念在很多时候可能没有内涵、外延之分，只有意向一致性的达成。人机融合后，整个系统的输入、处理、输出会发生不少变化。首先，通情达理（这里的“理”包括伦理和道理）就是意向到存在的信数。人的信息与机的数据可以通过信数这个新中介形式进行融合，这个中介信数是由一个矢量＋一个标量或一组矢量＋多组标量构成的矢标量（还是矢量）值，通过信数这个矢标量值进行人机融合关系程度优良坏的初步判定，即输入阶段的评价指标。即通过人的价值取向有选择地获取数据的过程，这个输入过程中不但有客观数据与主观信息的融合，还包括人的先验知识和条件。其次，在人机信息／数据融合'
  - '[PAGE 208]


    处理过程中，人的非结构化信息架构（如自然语言）会变得结构化一些，而机的结构化数据语法会变得非结构化一些，在这种半结构化的情境中，不但要使用基于公理的推理，还要兼顾结合非公理性推理，使得整个推理过程更加缜密、合理。最后，在决策输出阶段，人常常将脑中若干记忆碎片与“五感”接收到的信息综合在一起，跳过逻辑层次，直接将这些信息中和的结果反射到思维之中，形成所谓的“直觉”，其结果的准确程度在很大程度上取决于一个人的综合判断能力，而机器则是通过计算获得的结果——“间觉”进行间接评价，这种把直觉与“间觉”相结合的独特决策过程就是人机融合智能输出的一大特点。概而括之，人机融合的关键应包括：一多与灵活弥聚的表征、公理与非公理混合推理、直觉与“间觉”交融的决策。


    人机混合智能与人机融合智能有着本质的区别。混合是两种物质混在一起，没发生化学变化，仍是两种物质，如把沙放进水里；融合物是由两种或两种以上元素组成的物质，指的是
    一种物质，如一氧化碳（CO），是由碳（C）元素与氧（O）元素组成的。人机混合智能中人机界面分明，然而，随着自主系统的不断发展，人、机在物理域、信息域、认知域、计算域、算计域、感知域、推理域、决策域、行为域的界面越来越模糊，你中有我，我中有你，融合在一起的趋势越来越显著，所以，用人机融合智能能够更好地反映人机之间的本质关系。


    人的感觉常常是嵌套混合贯通联合的，视觉中包含着听觉、触觉、嗅觉和味觉，机器的信号采集/数据输入则是单纯唯一独立分离的，各种通道模态之间没有融合交叉。人与机的感觉秩序大相径庭，刺激与数据、信息与信号差异太大。对人而言，未感觉到的刺激往往被隐藏在感觉到的刺激里，进而形成无意识感觉或下意识感觉。不难相信，这种联觉或迁移觉在文字、词语中也有着相似的机理。机器的这种能力至今尚未被开发出来，这或许是人机融合智能方面的一个瓶颈吧！如何打破“人擅计、机长算”的基本架构，数据全息表征的输入至关重要，这其中不仅有显性的个别数值体现，还有默会的众多关系作用。人的“看”里包含了大量的其他感觉到的东西，如听觉、触'
  - '[PAGE 209]


    觉、嗅觉、味觉，这些联觉都潜在视觉里，机器的“看”没有联觉、统觉，机器听觉等也莫不如此……另外，情境中每个东西都有众多属性和关系，当前的打标就是九牛一毛，往往打标后挂一漏十白白损失了大量的信息，所以现有的“人工”智能中的数据标注工作值得商榷。深入下去，人对这类复合信息的加工也应该是复合并行地处理：既有逻辑清晰的推理过程，可谓之达理，更有感性丰富的动情发展，可谓之通情；既有基于公理的显性信息的分析，也有基于非公理的隐含信息的综合，慢慢形成显、隐理解的共存，进而演化为显、隐意向性，为下一步的规划决策做好准备。在完成情境任务目标的价值驱动下，显性的意向性可以变成理性决策，隐性的意向性可以演化成直觉决策。


    在传统的人工智能研究中，联结主义的代表形式是人工神经网络，主要处理数据；行为主义的代表形式是强化学习方法，主要处理信息（奖惩后有价值的数据）；符号主义的代表形式是知识图谱和专家系统，主要处理知识和推理（有限的知识及推理）。三者有递进的味道，但与人擅长的概念产生和理论建立相距甚远，尤其是在情感化表征、非公理性推理和直觉决策等方面，机器更是望尘莫及。另外，机器学习中的反馈、迭代的生硬艰涩滞后性与人相比也比较低级，这是因为人的态势感知能力不但来自科学技术，还源于社会学、史学、哲学、文学、艺术等多方面的素养与思维技能，进而产生价值取向（态势感知的基本预设是：人可以发现未来的动向并影响它的进程）。这恰恰是机器做不到的，所以机器暂时还只是单一领域的擅长者（如围棋、国际象棋等）。一般而言，机器在定义域（人为规则）中比人存储量大且准确、数据处理速度快，人非定义域（自然情境）中比机器灵活且深刻、信息融合能力强。人的优势是画圈（划分领域/定义域），机的优势是画圆（精确执行），人机融合的优势则是既能画好圈又能画好圆（可跨域实现目标），正可谓人心所想，机器所为。当今的人机融合产品还是共性的（谁都可以用，如手机、电脑），个性化服务的人机智能融合还未真正出现，但原始级别的系统已经悄悄崭露头角（如个人辅助决策系统等）。


    对人而言，学习最重要的是忽略那些非关键的数据、忘记那些不'
  - '[PAGE 210]


    重要的信息，从而在诸多事物及其之间发生的各种关系中游刃有余地进行特征相关、关联存在、统计概念、概率规则、把握因果。可惜的是，目前的机器学习不会忽略不懂忘记，人这种信息过滤的机理与价值取向判断有关，有点类似于决策机理，而机器则没有价值体系。从透视主义的角度来看，人的认知存在两类选择性透视，一是生理功能上的，如对可见光的感受；二是观念上的，如情境、理论和价值预设。生理功能上的意思就是说，我们选择认识什么不认识什么取决于生理感受与反映乃至内在机制；观念上的是指各种预设会使人在认识中放大、虚构和过滤目标。人的价值取向相应可分为生理性和社会性，两者都包含个性化与共性成分，并在不同的情境组合中转换、释放出来，形成风格各异的认知特点和规律。迄今，这些价值体系尚未赋予没有个性的机器。人类意向性的背后就是价值取向，即价值观伦理性（伦就是类和次序），让形式化（数据化）的机器产生价值取向就是让它产生意向性，即形式化的意向性，有道德、有伦理的机器或许可以由此实现。如果产生不了有价值取向的机器，这一切就难以起始。事实上，如何产生有价值取向的机器，就是如何使人的伦理道德像理性逻辑一样可描述化、程序化问题，即伦理如何变成道理再变成公理原理的进程。此外，人的深度学习也不同于机器的深度学习，人的深度学习是学校教育与社会教育的一致，在于理论与实践的统一，在于矛盾和悖论的协同……是一种内外共鸣的学与习；而机器的深度学习源于人工神经网络的研究，包含多隐层的多层感知器就是一种深度学习结构，深度学习通过组合低层特征形成更加抽象的高层表示属性类别或特征，以发现数据的分布式特征表示。两种学习机制的根本不同在于：一个经过思考和实践，一个就是仿真和模拟。


