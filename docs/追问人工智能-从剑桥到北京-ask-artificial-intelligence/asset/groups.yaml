    # 第一章


    # 人工智能：从“史前”到现在


    人工智能创立至今，已经度过了60余载。在这一个甲子多的时间里，有高潮也有低谷。对人类来说，年过花甲意味着已经开始逐渐步入迟暮，很多方面都开始走下坡路；而对人工智能来说，在经历过数次波折、几起几落之后的今天仍然蓬勃发展，并显得愈发年轻起来。'
