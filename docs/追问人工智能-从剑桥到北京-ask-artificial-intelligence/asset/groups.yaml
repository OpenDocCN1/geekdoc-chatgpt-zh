    是某个根本实体的不同方面，而仅仅是解析被觉知世界的不同的方式。


    约翰·埃克勒斯（John C.Ecclers）和波普尔在《自我及其大脑》中提出了三个世界的本体观，第一个世界是物理世界，第二個世界是意识世界，第三个世界是客观的文化与知识的世界。这也表明了他们的身心二元论的观点。


    由此可见，二元论和一元论的观点均有着很鲜明的时代特点，而且很难分出孰是孰非。虽然身心二元论的观点在科学界被排斥在主流观点之外，但仍然广泛存在于宗教与文学作品中。身心一元论虽然被学术界与哲学界所广泛接受，但并没有详细阐明其中物质和意识的区别，究竟意识何去何从，这就涉及我们下面要讨论的涌现与还原的观点。


    # 2. 意识的涌现与还原论


    涌现与还原是一对逆过程。涌现指很多个单一要素组成整体系统后，出现了单个要素所不具有的性质和功能，即整体大于部分之和，其中整体相较部分简单相加多出的部分就是涌现性的体现。而还原则指系统的所有功能可以还原为组成系统的各个元素的功能。


    20 世纪初，布罗德（C.J.Broad）曾经说道：物质主义有三种，即激进、还原和涌现。激进者宣称意识根本不涉及任何事物，还原论者相信意识只不过是脑状态，涌现者相信意识是脑的高阶状态。


    尤琳·普莱斯（Ullin Place）认为，一旦我们知道脑状态导致了意识体验，一个有意识的体验就可以被还原为给定的脑状态。


    哈德卡斯尔（Hardcastle）认为，意识可以被还原，那些认为不可还原的理由是站不住脚的。


    涌现的思想可以追溯到亚里士多德：整体不同于部分之和，与如今的涌现含义很是接近。约翰·霍兰德认为，涌现是复杂系统的属性之一。赖安（Ryan）则认为，涌现和认识论相关，不是从本体论的立场出发，这样会产生涌现不可知论。


    19～20 世纪，涌现这个问题集中在生命领域。生命的化学规律和物理规律令人疑惑，一个个小小的细胞究竟如何构成人体复杂的行为，又是如何让我们每个人都与众不同？随着弗朗西斯·克里克'
