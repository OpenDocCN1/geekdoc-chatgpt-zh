    ## 后记


    一直认为人工智能只是人类智能可描述化、可程序化的一部分，而人类的智能是人、机（物）、环境系统相互作用的产物。智能生成的机理，简而言之，就是人、物（机属人造物）、环境系统相互作用的叠加结果，由人、机器、各种环境的变化状态所叠加衍生出的形势、局势和趋势（简称势）共同构成。三者变化的状态有好有坏、有高有低、有顺有逆，体现智能的生成则是由人、机、环境系统态、势的和谐共振大小程度所决定的，三者之间具有建设性和破坏性干涉效应，或增强或消除，三位一体则智能强，三位多体则智能弱。如何调谐共频则是人机融合智能的关键。


    “智能”这个概念就暗含对整体、对无限的关系。针对智能时代的到来，有人提出，“需要从完全不同的角度来考虑和认识自古以来就存在的行为时空原则”，如传统的人、物、环境关系等。当人们进行一段智能活动时，一般都会根据外部环境的变化进行关键点或关键处修正或调整，通过局部与全局的短、中、长期优化预期，实时分配权重于各种数据信息知识处理，更多的是程序化
    + 非程序化混合流程。而机器智能则很难实现这种随机的混合应变能力，确定性的程序化印记比较突出，像“阿尔法狗”（AlphaGo）、元、star这样比较优秀的智能系统，主要赢在边界明确的计算速度和精度上，对于相对开放环境下的博弈或对抗则没有在封闭环境下表现得那么好，甚至会很不好。真正的智能不仅仅是适应性，更重要的是不适应性，进而创造出一种新的可能性。智能很可能不是简单的顺应、适应，更重要的是不顺应、不适应，进而创造出一系列新的可能性：自由、同化、丰富、改变、独立。图灵机的缺点是只有刺激-反应而没有选择，只有顺应而没有同化机制。


    信息化本质是计算事实，智能化则是认知价值。从数据到信息到知识（结构）是认知计算，从知识到信息到数据（解构）是计算认知。若把智能看成语言，那么人工智能像是语法，人类智能更像是语义、语用。语法基于规则、统计和概率，而语义语用则是基于一种人们之间使用有意义元素组成的约定，潜意识里的约定俗成比语法更为跨界、灵活，而且人们目前对它的规律还未形成有效的规则认知，于是它便成了复杂性事物。符号化是规范性语法的表征，情境化是自然性语义的依据。个境与群境有还原成分，也有新异元素，理解智能的难点之一就是内外一多共存的交织干扰和影响。把任何时间、地点、信息送给任何人转变为在恰当的时间、地点、方式信息送到恰当的人手里就是智能的表现形式之一。在全局，人是机的升维，机是人的降维；在局部，则反之。因为全局涉及的是异构事物、非家族相似性；而局部则相反。对人类智能系统而言，围棋的作用还仅仅是局部的局部。


    人工智能的最底层技术是二极管的 0、1 二元逻辑，人类智能的最底层技术是人的多元意向（非逻辑）。人类智能则是艺术，人工智能主要是技术。人工智能就是一个工具，很多人却把它当成了万能的钥匙，更有人把它想象成是无所不能，而忽略了人的智慧的作用。人类智能是一种涉及感性（尤其是勇敢）更多的智能，在紧急态势迅速变化时，一个人由情感而非思维支配，因而理智需要唤起勇气素质，继而在行动中支撑和维持必要的理智。在人类智能中，我们往往可以看到有序
    / 无序之间的创造性张力，如在很多情境下，你所看到的同一事物（如苹果或 1 小时）往往不同，主动看、被动看、半主动看都不一样。人工智能常常容易形成的偏见，从规则的知识图谱中提取出先验和常识，并将之作为约束条件引入生成模型，可能会让智能程序的运行大打折扣，所以，如何把人的模糊感知、识别与机器的精确感知、识别结合将是一个非常值得思考的问题。


