    ## 第四章 三分天下：人、机、环境


    人类进行包括人工智能在内的各项研究，发明各种工具的最终目的始终是服务于自身。人类处在环境之中受其影响，改变环境的需求又催生了工具。从使用工具开始，人类社会的发展史就成为一部人、机、环境三大要素相互关联、相互影响的发展史。作为一个重要的工具，人工智能起源并发展于人类在人-机-环境系统中的需求，同时也依赖于人-机-环境系统发挥作用。


    在人与机器交互的过程中，不仅涉及人与机之间的关系，也涉及它们与环境之间的关系。讨论完人机关系的未来之后，我们需要对人、机、环境之间的关系进行再次思考。


    人工智能是人类发展到一定阶段而必然产生的一门学科，既包括人，也包括机和环境两部分，所以也可以说成是人-机-环境系统交互方面的一种学问，同样“有一个漫长的过去，但只有短暂的历史”。其起源于文艺复兴时期，在第一、第二次工业革命浪潮中逐渐拉开序幕。法国人布莱士·帕斯卡尔（Blaise
    Pascal）研制了第一台现代意义上的数字计算机，第一、第二次世界大战大大加快了该学科发展的进程，剑桥大学巴贝奇的差分机和图灵机的测试进一步把人工智能领域的研究范围扩展到了人类学习、生活、工作方方面面。截至目前，研究人工智能的学科不但包括生理、心理、物理、数理、地理等自然科学技术领域的知识，而且应涉及哲理、伦理、法理、艺理、教理等人文艺术宗教领域的道理。


    “深蓝”证明了在有限的时空里“计算”可以战胜“算计”，进而论证了现代人工智能的基石条件（假设）：物理符号系统具有产生智能行为的充分必要条件是成立的。更有意思的是，2011年2月17日，一台以美国商业机器公司创始人托马斯·沃森名字命名的电脑在智力问答比赛中打败两位聪明的美国人而夺得冠军，2016年“阿尔法狗”又战胜围棋世界冠军李世石，从而引发了人工智能将如何改变人类社会生活形态的话题。


    ### 一、人工智能：人、机、环境的产物


    当前制约机器人科技发展的瓶颈是人工智能，人工智能研究的难点是对认知的解释与建构，而认知研究的关键问题则是自主和情感等意识现象的破解。生命认知中没有任何问题比弄清楚意识的本质更具挑战性，或者说更引人入胜。这个领域是科学、哲学、人文艺术、神学等领域的交集。意识的变化莫测与主观随意等特点有时严重偏离了科学技术的逻辑实证与感觉经验验证判断，既然与科学技术体系相距较远，自然就不会得到相应的认同与支持了，顺理成章，理应如此吧！然而，最近科技界一系列的前沿研究正悄悄地改变着这个局面：研究飘忽不定的意识固然不符合科技的尺度，那么在“意识”前面加上“情境”（或“情景”）二字呢？人在大时空环境下的意识是不确定的，但“格物致知”一下，在小尺度时空情境下的意识应该有迹可循吧！自古以来，人们就知道“天时地利人和”的小尺度时空情境对态势感知及意识的影响，只是直至1988年，才出现了明确用现代的科学手段实现情境（或情景）意识的研究，即米卡·安德斯雷提出的态势感知概念框架。但这只是个定性分析概念模型，其机理分析与定量计算还远远没有完善。


    在真实的人-机-环境系统交互领域中，人的情景意识、机器的物理情景意识、环境的地理情景意识等往往同构于统一时空中（人的五种感知也应是并行的），人注意的切换使之对于人而言发生着不同的主题与背景感受/体验。在人的行为环境与机的物理环境、地理环境相互作用过程中，人的情景意识被视为一个开放的系统，是一个整体，其行为特征并非由人的元素单独决定，而是取决于人-机-环境系统整体的内在特征，人的情景意识及其行为只不过是这个整体过程中的一部分罢了。另外，人机环境中许多个闭环系统常常是并行或嵌套的，并且在特定情境下这些闭环系统的不同反馈环节信息又往往交叉融合在一起，起着或兴奋或抑制的作用，不但有类似宗教情感类的柔性反馈，不妨称之为软调节反馈，人常常会延迟控制不同情感的释放；也存在着类似法律强制类的刚性反馈，不妨称之为硬调节反馈，常规意义上的自动控制反馈大都属于这类反馈。如何快速化繁为简、化虚为实是衡量一个人工系统稳定性、有效性、可靠性大小的主要标志，是用数学方法的快速搜索比对还是运筹学的优化修剪计算，这是一个值得人工智能领域深究的问题。


    人-机-环境交互系统往往由有意志、有目的和有学习能力的人的活动构成，涉及变量众多，关系复杂，贯穿着人的主观因素和自觉目的，所以其中的主客体界限常常模糊，具有个别性、人为性、异质性、不确定性、价值与事实的统一性、主客相关性等特点，其中充满了复杂的随机因素的作用，不具备重复性。另外，人-机-环境交互系统有关机（装备）、环境（自然）研究活动中的主客体则界限分明，具有较强的实证性、自在性、同质性、确定性、价值中立性、客观性等特点。在西方国家，无论是在古代、中世纪还是在现代，哲学宗教早已不单纯是意识形态，而是逐渐成为各个阶级中的强大政治力量，其影响不断渗透到社会生活的各个领域，更有甚者，把哲学、政治、法律等上层建筑都置于宗教控制之下。总之，以上诸多主客观元素的影响导致了人-机-环境交互系统的异常复杂和不确定性。所以，对人-机-环境交互系统的研究不应仅仅包含科学的范式，如实验、理论、模拟、大数据，还应涉及人文艺术的多种方法，如直观、揣测、思辨、风格、图像、情境等，在许多情况下还应与哲学宗教的多种进路相关联，如现象、具身、分析、理解与信仰等。


    在充满变量的人-机-环境交互系统中，存在的逻辑不是主客观的必然性和确定性，而是与各种可能性保持互动的同步性，是一种得“意”忘“形”的见招拆招和随机应变能力。这种思维和能力可能更适合人类的各种复杂艺术过程。对此种种，恰恰是人工智能所欠缺的地方。


    ### 二、人机之间的不同之处


    在自然语言中，句子意思根本不充分决定所说的内容，其根本原因在于真实参照系与虚拟参照系发生了错位，如见面问对方“您吃了 吗？”，其实包含着今天的早餐、午餐、晚餐背景，并且在中国这常常是一句问候语，不需要你回答吃的什么，是怎样吃的，吃的感觉如何，等等。人与人交流时，这一切都在意会（虚拟）参照系中，人和机交流时，常常失去了这些默会的参照系统，使得交互信息的流动、流量、流向产生了失速、紊乱、变向。面对歧义、悖论，人与人之间一般会调动默会虚拟参照系统统一，而人机之间则没有形成这种机制，进而就造成了矛盾的对立，还常常不可调和。人的意识是由虚拟和真实参照系共同作用的结果。这也是机器不能产生意识的主要原因——没有虚拟参照系，抑或是机器的虚拟参照系统很弱。客观而言，语义就是一种人们之间使用有意义元素组成的约定，潜意识里的约定俗成比语法更为跨界、灵活，而且人们目前对它的规律还未形成有效的规则认知，于是它便成了复杂性事物。需要强调的是，人机的真实、虚拟这两个参照系不单纯是平行的，还可以是交叉融合的，但以何方式、何时间、何内容等进行，还需要进一步的研究。


    人与机器在语言及信息的处理差异方面，主要体现为能否把表面上无关之事物相关在一起的能力。尽管大数据时代可能会有所变化，但对机器而言，抽象表征的提炼亦即基于规则条件及概率统计的决策方式，与基于情感感动及顿悟冥想的判断（人类特有的）机理之间的鸿沟依然存在。


    ### 三、人工智能与哲学


    人类文明实际上是一个认知的体现，无论是最早的美索不达米亚文明还是四大文明之后以西方为代表的现代科技力量，其原力起点都可以落实到认知这个领域上。历史学家认为，以古希腊文化为驱动力的现代西方文明来源于古巴比伦和古埃及，其本质反应的是人与物（客观对象）之间的关系；而古印度所表征的文明中常常蕴含着人与神之间的信念；古代中国文明的核心之道理反映的是人与人、人与环境之间的沟通交流。纵观这些人、机（物）、环境之间系统交互的过程，认知数据的产生、流通、处理、变异、卷曲、放大、衰减、消逝无时无刻不在进行着……


    有人说人工智能是哲学问题。这句话有一定的道理，因为“我们是否能在计算机上完整地实现人类智能”这个命题是一个哲学问题。康德认为哲学需要回答三个问题：我能知道什么？我应该做什么？我可以期待什么？分别对应着认识、道德、信仰。哲学不是要追究“什么是什
    么”，而是追求为什么“是”和如何“是”的问题。自从2013年10月回国后，笔者就一直在思考人机交互的本质问题，偶然间与朋友交谈时谈及“共在”（being together）一词，顿感很是恰当。试想，当今乃至可见的未来，人机之间的关系应该不是取代而是共存的时代：相互按需分配、取长补短、共同进步，相互激发唤醒，有科有幻，有情有义，相得益彰……非常巧合的是，自
    2014 年以来，机器学习、互联网、机器人、人工智能等领域的发展也相当迅速，“深度学习”“类脑计算”“情景感知”一时间成了关键词，成了时髦语，但细细品来，其核心实质都不过是解释与建构的问题。


    其实哲学与科学、宗教一样，都是一个人为了能够获得理解而必须相信（除非你相信你不应当理解）的过程，这不是盲从，而是一种先信仰后理解的先验。比如，在科学中，物理学研究世界是什么样的（解释世界），计算机（数学）研究如何造一个世界（建构世界），这两者之间若没有信任、信仰等先于理解而存在，恐怕是难以坚持进行下去的，毕竟在伸手不见五指的黑夜中，人是很难自行产生前行动力的（如一个没有利润的环境常常少见商人身影一般）。而信仰是一种赞同的思考，常常是一种非理性的冲动情感，通过非理性而达到理性（通情达理），这不能不说是一个有趣的悖论，或许，这同时也是无中生有的禅理（以情化理）吧！


    在艾萨克·牛顿之前担任剑桥大学卢卡逊教席（the Lucasian Chair）的神学家、古典学家和数学家艾萨克·巴罗（Isaac Barrow）宣称，“信仰的固有对象是……某个命题”，这可以扩展到“某个命题系统”，比如在“真宗教中所讲授的所有命题”这一特定情形中。至于对一个人的信任（fiducia），实际上可以归结为赞同（assensus）有关这个人的命题：“信任一个人或物只是一个简短的表达，（比喻性地）意指确信与那个人有关的某个命题为真。”用现代分析宗教哲学家的话来说，“信仰”（belief
    in）就等同于“相信……” （belief that）。


    神学家爱德华·斯蒂林弗利特（Edward Stillingfleet）宣称，信仰是“心灵的一种理性的和推理的行为……是对证据的赞同，或促使心灵赞同的理由”。洛克和他都认为，应把信仰理解为“对命题予以赞同”，就宗教信仰而言，应当理解为“基于最高理性的赞同”。


    有时候，世界是确定的，不确定的是我们自己，面对相同的文字、音乐、视频等情境事物，我们常常会随心情的不同而产生不同的觉察和理解，境随心转。有时候，世界是不确定的，确定的反而是我们自己，面对不同的文字、音乐、视频等情境事物，我们却能够处变不变而产生恒定表征，形成概念，心随境转。不管怎样，世界包括我们自己是由易、不易、简易、迂易、无易、有易、一易、多易等诸多演化过程构成的，在这些纷繁复杂的变化中，都需要一种或多种参考框架体系协调其中的各种矛盾、悖论，而若追溯这些框架体系的起源，应该就是人、机、环境之间的交互作用。或许，最好的智慧/智能真的就隐藏在这些交互中的自相矛盾之中，若果真如此，那又该如何破译呢？


    哲学意义上的“我”也许就是人类研究的坐标原点或出发点，“我是谁”“我从哪里来”“要到那里去”这些问题也许就是人工智能研究的关键词瓶颈。


    ### 四、通向强人工智能之路


    人工智能，尤其未来的强人工智能很可能是一种集科学技术、人文艺术、哲学宗教为一体的“有机化合物”，是各种“有限理性”与“有限感性”相互叠加和往返激荡的结果，而不仅仅是科学意义上的自然秩序之原理。它既包含了像科学技术那样只服从理性本身而不屈从于任何权威的确定性知识（答案）的东西，又包含着诸如人文艺术以及哲学、宗教等一些迄今仍为确定性的知识所不能肯定事物的思考。它不但关注着人-机-环境系统中的大数据挖掘，对涉及“蝴蝶效应”的临界小数据也极为敏感；它不但涉及计算、感知和认知等客观过程，而且对算计、动机与猜测等主观过程颇为青睐；它不但与系统论、控制论和信息论“老三论”相关，更与耗散结构论、协同论、突变论“新三论”相连。它是整体与局部之间开环、闭环、自上而下、自下而上交叉融合的过程，是通过无关-弱相关-相关-强相关及其逆过程的混关联变换。


    通过研究，我们是这样看待人工智能技术问题的：首先，人工智能过程不是被动地对环境的响应，而是一种主动行为，人工智能系统在环境信息的刺激下，通过采集、过滤，改变态势分析策略，从动态的信息流中抽取不变性，在人机环境交互作用下产生近乎知觉的操作

    '
