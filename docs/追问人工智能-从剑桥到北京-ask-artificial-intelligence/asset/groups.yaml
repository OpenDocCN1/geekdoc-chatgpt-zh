    也有外在的，语义的进化也许就是新关系的形成，知识的产生也是各种各样的新关系被发现的过程，关系有单向性（不是双向的）和依附性，如何建立起人机之间的双向关系至关重要，这是人机融合智能的一个突破口和切入点。其中，构造与功能的关系、特征属性与语义向量的关系是当下科研的热点和难点。


    为什么知识图谱和专家系统在实际应用中漏洞百出、问题层出不穷？最主要的原因是关系的梳理没有到位。其中，对于主观参数和客观参数的不匹配、不协同就是一个重要问题，正如维纳对智能控制的定义：“设有两个状态变量，其中一个是能由我们进行调节的，而另一个则不能控制。这时我们面临的问题是如何根据那个不可控制变量从过去到现在的信息来适当地确定可以调节的变量的最优值，以实现对于我们最为合适、最有利的状态。”如评判一个认知模型好坏的主要依据，也许就是看它如何处理突出值、价值观、频率性、可信度等主客观融合特性。早年费希纳在创立心理物理学时，提出过外部的心理物理学和内部的心理物理学等概念。外部物理世界各种物理刺激作用于人的感官，引起人的内部物理世界的活动，即脑的活动，从而产生内部心理世界的感觉体验。费希纳认为，人的感觉过程既涉及外部物理世界的物理刺激，又涉及内部物理世界的脑活动过程，还有内部心理世界感觉体验。他认为，外部的心理物理学研究外部物理刺激强度和内部心理世界感觉体验强度之间的关系，内部的心理物理学则研究内部物理世界，即脑活动强度和内部心理世界感觉体验强度之间的关系。高级意识是什么？有人认为高级意识就是大量的基础意识的集成，把大量不同种类的基础意识有机地集成到一起，这种集成应该具有穿越性，能够把“无关”事物/事实有指向性地关联起来，这种穿越性比集成更迅捷。目前看来，单纯人的智慧在单个领域落后于人工智能已成为现实，对跨领域超级智能的期待仍无依无据，但是人机融合智能却可以更快、更好、更灵活地同化外来信息和顺应外部变化，是有机与无机的跨界混搭，是记忆与存储、算计与计算、直觉与间觉、自主与它主、慧与智的弥聚，也许这种融合智能正是未来的发展方向。


    人机融合智能的一个核心问题是介入问题，这也是一个体验问题，即人与机之间何时何处以何种方式（或平滑或迅速）相互介入的问题，尤其是在歧义点或关键阈值期间介入的反应时、准确率。例如，交互中机器出现的变化“主观”对人机融合很重要，尤其是在特定定义域（如围棋）中，可以改变人的习惯和偏好，甚至是世界观。再如，在融合时彼此之间的接受、容忍、信任、匹配、调度、切换、说服、熟练程度，以及如何训练出个性化的伙伴关系等都是具体亟待解决的问题。未来的人机说服技术，就需要人机之间的通情达理，因势利导。由于人机融合在细节层面和人人之间的合作几乎同样复杂，或者说是有一些另类的复杂问题，因而可以认为，从技术角度讲，人机融合智能绝不仅是一个数学仿真建模问题，而应该是一个实验统计体验证拟合的问题。


    一般来讲，对一项技术的理解要从抽象的角度着手，抽象的角度越高，适应范围越广，用逐层抽象的方法去理解事物的本质，就能从思想上突破技术的局限性。比如一个简单的问题：计算机是什么？计算机的本质就是一个可编程的、用于计算的机器。任何问题只要能转换成计算问题，计算机就能解决，如果不是计算问题，那计算机就解决不了。人处理的外部客观事物属性/关系本身就包含多重意义，再加上人本身的主观认知也丰富多彩，因而处理过程的复杂性是不可避免的。相比之下，机器的数据分析倒是相对自然简单一些。信息的输入、处理、输出过程对人而言都是双向的，如“看想看的”“听想听的”就是眼耳与大脑的双向流动，而弹奏想弹的曲子则是手脑之间的双向作用；数据的处理过程则是机器的单向使然，人为的反馈前馈仍难以掩盖其无机性。罗素认为，我们所说的每个事物都只由我们拥有的直观知识和理解的事物的说法（也许是合成的）构成——知识实质上其实是感性知觉。例如，机器不会学不会问，所以没学问。你问一个人“吃了嗎？”，人会理解；你若问机器“充（电）了吗？”，机器会理解吗？那种试图以现有形式化方法获取类人智能的思想也许确实是行不通的，因为从本质上讲，所有的仿真和模型都是错误的，只不过有些模型可参考性较大一点罢了。


    人人与人之间有人道，机与机之间有机道，人与机之间有人机道。数据、信息、知识三者之间由于主体介入程度的不同，性质也随之变化。例如，当你面对一堆数据时，数据与主体产生关联，你就发现或得到信息；当信息作为对象被主体思维运算后形成认识时，信息就变成了知识；当知识从主体传播出来，面对其他接收主体时，又转换成了信息；当信息存储在外，无主体对应或介入时，就变成了数据。在语法层面，规则性的语法逐渐为概率性的语法所替代；而在语义/语用层面，则出现了可能（性）的价值是新型决策依据。


    人机融合智能科学要研究的是一个物理与生物混合的复杂系统。智能作为一种现象，表现在个体与自然、社会群体的相互作用和行为过程中。基于信息技术的认知延展可以为延展认知的哲学假说进行辩护，而心灵的边界将变得更为模糊，身体、大脑、环境、技术、社会正在形成一种新的相互融合的智能体。这不仅仅会改变人的基本认知结构，还会进一步改变我们对人性以及对自身存在状态的理解。人与不同机融合表现出来的智能是不同的，与手机交互时的智能远远大于与自行车交互时的智能。或许这些行为和现象就像物理学一样，由统一的力、相互作用、基本元素来描述。例如，在图像识别中，真实的识别不是在图像中的位置（图像是一个平面），而是要识别图像指向的在空间中的位置，要建立空间概念，以及物体在空间中相互关系的概念。单纯基于概率统计的方法（先天智能）解决不了看图说话的问题，要建立一种基于当前图像的个性反馈（后天智能）。人便有一种随时随地都可以“标注”的“打标”能力。


    不管怎样，标注都是终止于符号，而不是世界上的物体，应该做一个能和环境世界打交道的东西，标注就是物体本身，物体的图像、声音、触觉、气味都可以通过训练映射到物体。不是说符号没用，符号本身也是物体对象，只是需要通过训练来认识它们。符号到其代表的物体的映射（或指向）关系也是通过训练形成的。


    人处理信息的过程是变速的，有时是自动化的下意识习惯释放，有时是半自动化的有意识与无意识平衡，有时则是纯人工的慢条斯理，但这个过程不是单纯的信息表达传输，还包括如何在知识向量空间中建构组织起相应的语法状态，以及重构出各种语义、语用体系。


    ## 二、认知不是计算


    目前的人工智能仍然是以计算机为中心，并没有实现人们所希望的“以人为中心”的认知。如何把人类认知模型引入人工智能中，让它能够在推理、决策、记忆等方面达到类人智能水平，是目前科学界讨论的热点、难点和焦点。


    认知的核心是智能，是洞察事物，而智能和洞察的核心是心理，人工智能的核心是数理，心数不一致，何谈相似？单纯的机器，无论是学习还是智能，都是没有感情的，而人的理性表面上类似机器，其实这种理性是建立在情感意志等底层之上的，是一种知、情、意融合的心智体。例如，人的许多记忆一旦涉及“
    我 ”，就会变得又快又好，这种邻近性智能产生的机理就包含情感化。鉴于人机融合的是心理 + 数理的同理共情，因而能够实现认知与计算的可能结合。正如有人所言：除非有人以确凿的证据向我们证明如何按照非定域原理把精神意识引入某个人工系统，否则，不管该系统的可观察行为与人类行为多么相似，我们都不能认为该系统真的具有了精神意识，没有精神意识，再厉害的计算也产生不了认知和洞察。爱是人类一种独特的界面，可以无限地由内而外扩展自己与外部世界交互的界面，这也是机器目前还不能产生的界面。


    世界上的事物本身是不能定义、解释、说明自己的，只能用其他事物去定义、解释、说明，但是这些事物本身既有相似之处，又有不同的地方，所以，所有的比喻、类比都不是精确的，而是近似的。正是这些近似性，构成了各种可用的概念、观念、习俗、常识、表征、交流和通信，而当前计算的源泉——数学本身也是近似的，具体可参见那些公理、假设、条件、约束、边界、规定等。然而，现在的不少数学家或者人工智能学者竟然忽略了这些数学的近似，把不完美的有限当成了完美的无限，人为视为精确、客观、绝对，用一个个有着先天局限性的公式、方程、范式、推理、计算去完成不可能完成的技术工作，进而造成自动化、智能化程度越来越高，人们的认知
    / 心理负荷越来越重的悖论。


    人是在与人、物的交互中逐步形成自我的，包括亲人、声音、事物、纸笔……交互、融合是智能的源泉，也是帮助我们思考的工具，从语言到手机，也许都是认知本身的一部分。一方面，我们的认知总是在与这个世界发生着融合；另一方面，被误用的计算有可能会影响我们的认知。1968
    年图灵奖获得者理查德·哈明说过：“计算的目的不在于数据，而在于洞察事物。”人们认知中的觉知 / 意识被延展到了外部世界，并时常与很多设备计算交织在一起。冥冥中，也许真是各种生活体验塑造了我们对真实世界的期待和希望。


    表面上，人工智能在搜索、计算、存储和优化领域比人类更加高效，其实不然。例如，当一个或多个目标出现时，你会很难立刻形成正确或有效的态势感知，只有态势演化进入适当时空、程度时，人才能形成良好的态势认知状态。据此，我们不妨把态势感知这一认知机制分为预启动期、发展期、实现期、深度期、衰退期、结束期……其间，可将注意力集中程度作为调节态势感知不同时期的主要手段。态势感知这种认知行为一般由两部分构成，一是无机部分，即对符号的形式化处理；二是有机部分，涉及理解、解释、思维等心灵方面的意向性分析。无机的部分可以用计算的方式优化，而有机的部分用认知处理比较理想。如下面这些情境，用计算很难表征，而用认知则相对比较容易分析：态静势动、态动势静、感动知静、感静知动、态多势少、态少势多、感多知少、感少知多、态虚势实、态实势虚、感虚知实、感实知虚。态势的态势就是深度态势，感知的感知就是深度感知，态势感知的态势感知就是深度态势感知。所有的人机交互都是为了人人交流或自我认知而为，机就是一种媒介或一种工具，使得自己与他人互相作用得更有效、便利与舒适。人工智能模拟的是人的思维，而思维从根本上就是各种交互中人的心理活动和过程，思维活动相对稳定了，就形成了某种思想。所以，人工智能中的人之心理比计算方法、计算能力、计算数据更重要、更本质、更彻底，人工智能之源是人，而不是工。若说当前的人工智能界本末倒置，是一种工人智能、偷懒智能恐怕不为太过吧！


    计算是从概念到世界，而认知则是从世界到概念，一正一反，一形一意，一机一人。认知和计算之间的关系有时被抽象为事实与符号之间的描述刻画（描画）关系或映射关系，这实际上是赋予命题符号以意义的过程的一个方面，即意指。一个命题符号，在我理解它之前，于我而言，它还是没有生命的。理解与意指过程在某种意义上说是相反过程，意指是指从事实到思想，再到命题符号；理解则是从命题符号到思想，再到事实。计算机本质上是一种通过形式化手段来实现非形式化意向性的工具，即通过数理反映物理、心理规律。玻尔说过：“完备的物理解释应当绝对地高于数学形式体系。”


    从哲学高度来看，认知是一种感性的素质，计算则是一种理性的修养。一般而言，艺术是培养训练感性素质的重要手段，科学技术是发展延伸理性修养的主要途径。大多数现实世界的感性理性互动都涉及隐藏信息，而大多数的人工智能研发恰恰都忽视了这一点。蒙特利尔大学的约书亚·本吉奥（Yoshua
    Bengio）是深度学习的先驱者之一，他在一封电子邮件中这样写道：“学习使用的估计模型与现实之间依然存在着巨大差异，尤其是现实情况很复杂的时候。”因此，以数理计算为核心的人工智能的进步之途依然漫长……就像有句话说的：只有计算才分对错，而认知则没有标准答案。本能就是在没有预见的情况下能够产生某种结果，并且不需要提前训练就能完成的行动能力。美国第一届心理学协会会长威廉·詹姆斯似乎认为本能的结构方面是模块化的。各个本能都独立负责某种简单行为，但同时它们之间也协同工作。截至目前，机器的计算还远远没有本能，所以人与机在决策方面最大的差异在于有无压力及风险大小的认知。从长远来看，人工智能应该学会如何合作辅助人类，形成人机融合的新智能体。


    有人认为，目前人和机器之间的信息传递效率仍然非常低，远未能实现真正意义上的人机协同、互相促进。要实现人机协同的混合智能，需要解决的第一个难题就是人和机器之间的交互问题。仔细想来，这并不能算是人机融合的主要矛盾和核心问题。人机融合的瓶颈不是简单的交互问题，而是认知与计算的结合问题。1972
    年图灵奖获得者埃德斯加·狄克斯特拉说过：“程序测试只能用来证明有错，绝不能证明无错。”波兰尼也曾断言：“知识的取得，甚至于‘科学的知识’的取得，一步步都需要个人的意会的估计和评价。”在物理学领域，量子论的创立，使人们对主客体关系的认识发生了根本性的变化。在量子世界中，科学主体与客体之间已经不像在宏观世界那样有着绝对分明的界限，而是像玻尔所说的那样：“我们既是演员，又是观众。”与此相关，海森堡也明确指出：几率函数运动方程中包括了量子运动与测量仪器（归根到底是人）相互作用的影响，这种影响也成了不确定性的重要因素。玻尔所说的演员和观众的关系，其含义是科学认识主体和客体之间存在一个主体客体化、客体主体化的过程。主客体相互转化、相互包含的结果，也就具有了波兰尼所谓的“双向内居”的关系。在人机融合的智能时代到来前的黎明，计算也悄悄主动靠向了认知，正如1966年图灵奖获得者艾伦·佩利所言：“任何名词都可以变为动词。”对此，1971年图灵奖获得者约翰·麦卡锡也表现了积极的认同：“与所有专门化的理论一样，所有科学也都体现于常识中。当你试图证明这些理论时，你就回到了常识推理，因为常识指导着你的实验。”从中我们不难看出，认知里的常识恰恰是被计算所过滤掉的精华。常识就是非结构化的多模态信息/知识的复合体，它远远超过了机器的理解。


    人类在常规拓扑方面的直觉相对有限，在高维情形下很难建立起具体的想象力，唯一能够把握的只有严格的数学推导计算加上活泼的心理抽象认知。只有这样，逻辑和非逻辑空间才能相融共生，形成合力，去破解大自然提出的一个比一个难以回答的诸多问题，才能处理那些“令我们深陷困境的不是那些我们不懂的事情，而是那些我们自以为理解的事情”。


    简而言之，认知不是计算，计算却是一种认知。


    ## 三、既不是人工智能，也不是人类智能


    我们知道的远比我们说出来的要多得多，我们不知道的远比我们知道的要多得多，我们不知道我们不知道的远比我们不知道的要多得多……


    人类的感觉刺激、信息是动态分类，是聚类，它不是一次完成的，而是多次弥聚变化的（这种轮回机制目前尚未搞清楚）。大道无形的道是碎片的、流性的……所以，正是零碎的规则、概率、知识、数据、行为构成了人的智能，这是在千奇百怪的日常异构活动情境中生成演化出来的。人智，从一开始就不是形式化、逻辑化的，而且人的逻辑是为非逻辑服务定制的；机器则相反，从一开始就是条理化的、程序化的，也是为人的非逻辑服务的。


    本质上，数据的标记与信息的表征的不同之处在于有无意义的出现，意义即是否理解了可能性。机器涉及的表征体系虽然是人制定赋予的，但从其一诞生就已失去了本应的活性，即意向性参与下的各种属性、关系灵活连接和缝合，而人的诸多表征方式则常常让上帝都不知道所措：一花一世界，一树一菩提。知识图谱的欠缺就在于知识的分类上，它僵化了原本灵活的知识表征，使之失去了内涵与外延弥聚的弹性。用有限表现无限是美，把无限用有限诠释出来是智（真），连接两者的是善（应该、义）。机器决策，通常是用合适的维度降低分类信息熵。而人在实际生活中，对信息的处理是弥聚维度……有张有弛，弥聚有度，意形交替，一多分有，弹性十足。


    如果说机器的存储是实构化，那么人的记忆就是虚 + 实构化，并且随着时间的推移，虚越来越多，实越来越少，不仅能有中生无，甚至可以无中生有，就像各种历史书中的传奇或各样的流言蜚语一样。更有意思的是，人的记忆可以衍生出情感——这种对机器而言匪夷所思的东西。


    人的学习大多数不仅是为了获取一个明确的答案，更多的是寻找各种理解世界、发现世界的可能方式；而机器的“学习”（如果有的话）“目的”不是为了发现联系，而是为了寻求一个结果。


    智能的根本不是算，是法，是理解之法、之道。理解是关键。NLP 不先解决理解问题，只追求识别率，是不会有突破的。其实人对声音的识别率是很低的，经常要问别人说了什么。能问别人说了什么是最关键的能力，因为知道没有理解才能问出问题。很多系统的理解最终靠人，如果没有人参与，不管处理了多少文字，都没有任何理解出现。目前的人工智能缺乏的是对人感性层面的仿生不够完善，因此无法完全了解人做决策的生理与心理机制。言下之意，只有人工智能做到像人一样去感受外部的世界，并用处理器做人一样的理性思考，从内至外地模拟和学习人类，这样的人工智能才是完善的。


    博弈理论家鲁宾斯坦在《经济学与语言》中用一个博弈模型说明“辩论”对不参与博弈的旁听者有非常大的好处，因为辩论使得双方不得不将“私有”的信息披露给旁听的人。他的数学推导大致上没有超出笔者的哲学论证的范围，他在最近给笔者的回信中说他使用数学不过是为要获得更清晰的论证而已，并同意笔者在信中表示的看法“数学方法可能遮蔽了深刻洞察”，而人的直觉性统觉，其载体是有机体的感觉器官，已经包含着有机体对各种关系的理解。只是为了要把这种理解固定下来，形成“记忆”，人类才需要另一种能力的帮助，那就是“理性”能力。在理性能力的最初阶段，便是“概念”的形成。概念就是一种界限、约束、条件，在不同的情境下，这些界限、约束、条件会发生许多变化，甚至会走向它的对立面……这也是智能难以定义，有人参与的活动里会出现各种意外的原因吧！叔本华曾指出：“在计算开始的地方，理解便终结了。”因为，计算者关注的仅仅是固定为概念的符号之间的关系，而不再是现实世界中发生不断变化着的因果过程。与“概念”思维的苍白相对立，关于“直觉性理解”的洞察力，叔本华也有如下精彩的论述：“每个简单的人都有理性，只要告诉他推理的前提是什么就行了。但是理解不同，它提供的是原初性的东西，从而也是直觉性的知识，在这里出现了人与人之间天生的差别。事实上，每一个重大的发现，每一种具有历史意义的世界方案，都是这样的光辉时刻的产物，当思考者处于外界和内在的有利环境里时，各种复杂的和隐藏着的因果序列被审视了千百次，或者，前所未有的思路被阻断过千百次，突然，它们显现出来，显现给理解。”在这一意义上，目前的全部计算机智能，只要还不是基于“感官”的智能，在可看到的未来，就永远无法获得我们人类这样的创造力。这里，“感官”是指对“世界”做直接感知的器官，有能力直接呈现表征世界图景的器官，而不是像今天的计算机这样，需要我们人类的帮助才可以面对这个世界“再现”什么。钱学森说：人体作为一个系统。首先，它是一个开放的系统，也就是说，这个系统与外界是有交往的。比如，通过呼吸、饮食、排泄等，进行物质交往；通过视觉、听觉、味觉、嗅觉、触觉等进行信息交往。此外，人体是由亿万个分子组成的，所以它不是一个小系统，也不是一个大系统，而是比大系统还大的巨系统。这个巨系统的组成部分又是各不相同的，它们之间的相互作用也是异常复杂的。所以是复杂的巨系统。实际上，当前的人工智能只使用了人类理性中可程序化的一小部分，距离人类的理性差距还很大，更不要说初步接近人类更神奇的部分——感性了。


    伽利略说过：数学是描述宇宙的语言。事实上，准确地说应该是：数学是描述宇宙的语言之一。除此之外，还有许许多多的描述方式存在着。这也是智能科学面临的问题，该如何有效地融合这些不同语言的语法、语义、语用呢？对于多元认知体系来说，共性认知成分稀缺而重要，数学是这方面的一种尝试，用以描绘对象间的关系（但非仅有）。如果换了一种文明，它们的描绘方式不同，形式自然不同。数学不是究竟，只是对实相某个方面的陈述，类似盲人抚摸象腿的感觉。数学和诗歌都是想象的产物。对一位纯粹数学家来说，他感受到的材料好像是花边，好好像一棵树的叶子，好好像一片青草地或一个人脸上的明暗变化。也就是说，被柏拉图斥为“诗人的狂热”的“灵感”对数学家同样重要。举例来说，当歌德听到耶路撒冷自杀的消息时，仿佛突然间见到一道光在眼前闪过，立刻就想好了《少年维特之烦恼》一书的纲要，他回忆说：“这部小册子好像是在无意识中写成的。”而当“数学王子”高斯解决了一个困扰他多年的问题（高斯和符号）之后写信给友人说：“最后只是几天以前，成功了（我想说，不是由于我苦苦地探索，而是由于上帝的恩惠），就像是闪电袭击的一刹那，这个谜解开了；我以前的知识、我最后一次尝试的方法以及成功的原因，这三者究竟是如何联系起来的，我自己也未能理出头绪来。”再如，奖惩是机器增强学习的核心机制，而人的学习在奖惩之间还有其他一些机制（适应，是主动要奖励、惩罚还是被动给奖励、

    '
