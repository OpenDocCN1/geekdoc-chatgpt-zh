    顺应而没有同化机制。


    信息化本质是计算事实，智能化则是认知价值。从数据到信息到知识（结构）是认知计算，从知识到信息到数据（解构）是计算认知。若把智能看成语言，那么人工智能像是语法，人类智能更像是语义、语用。语法基于规则、统计和概率，而语义语用则是基于一种人们之间使用有意义元素组成的约定，潜意识里的约定俗成比语法更为跨界、灵活，而且人们目前对它的规律还未形成有效的规则认知，于是它便成了复杂性事物。符号化是规范性语法的表征，情境化是自然性语义的依据。个境与群境有还原成分，也有新异元素，理解智能的难点之一就是内外一多共存的交织干扰和影响。把任何时间、地点、信息送给任何人转变为在恰当的时间、地点、方式信息送到恰当的人手里就是智能的表现形式之一。在全局，人是机的升维，机是人的降维；在局部，则反之。因为全局涉及的是异构事物、非家族相似性；而局部则相反。对人类智能系统而言，围棋的作用还仅仅是局部的局部。


    人工智能的最底层技术是二极管的 0、1 二元逻辑，人类智能的最底层技术是人的多元意向（非逻辑）。人类智能则是艺术，人工智能主要是技术。人工智能就是一个工具，很多人却把它当成了万能的钥匙，更有人把它想象成是无所不能，而忽略了人的智慧的作用。人类智能是一种涉及感性（尤其是勇敢）更多的智能，在紧急态势迅速变化时，一个人由情感而非思维支配，因而理智需要唤起勇气素质，继而在行动中支撑和维持必要的理智。在人类智能中，我们往往可以看到有序
    / 无序之间的创造性张力，如在很多情境下，你所看到的同一事物（如苹果或 1 小时）往往不同，主动看、被动看、半主动看都不一样。人工智能常常容易形成的偏见，从规则的知识图谱中提取出先验和常识，并将之作为约束条件引入生成模型，可能会让智能程序的运行大打折扣，所以，如何把人的模糊感知、识别与机器的精确感知、识别结合将是一个非常值得思考的问题。


    “休谟问题”说的是从事实推不出价值来。可是，这个世界却是一个事实与价值混合的世界，不知从价值能推出事实吗？汉字就是智'
  - '[PAGE 246]


    能的集中体现，有形有意，如“日”“月”“人”，一目了然；西方的文字常常无形无意，逻辑类推。智能的本质就是把意向性与形式化统起来，所以汉字从象形到会意的过程就是人类自然智能的发展简史……汉字的偏旁部首就是一类的封装，把强相关的字聚在一起。如果说人类造字是语言表征的封装积累，那么，人类造智则是思想意识的拓扑延展。


    智能不是百科全书，而是包含不少的虚构和想象，不仅是分类，还要合类；不仅要合并同类项，而且要合并异类项，因而，智能产品系统的顶层设计非常重要。


    人工智能一般是逻辑（家族相似性）关系，人类智慧常常是非逻辑（非家族相似性）的。未来的智能是在特定环境下人的智能与机器智能的融合，即人机融合智能。人机融合智能不是人工智能，更不是机器学习算法。同样，人工智能、机器学习算法也不是人机融合智能，人机融合智能是人机环境的相互融合，是《易经》中的知几（看到苗头）、趣时（抓住时机）、变通（随机应）。人机融合智能是随动，不是既定，其中的“知己知彼”中的“知”不是简单的态势“感知”，更是态势“认知”。认知是从势到态的过程，感知是从态到势的过程。认知侧重认，信息输入处理输出流动过程；感知侧重感，数据信息的输入过滤过程，认知涉及先验和经验等过去的感知，所以态势认知包括了以前的态势感知。人工智能是一把双刃剑，计算越精细准确，危险越大，因为坏人可以隐真示假，进行欺骗，所以人机有机融合的智能更重要。客观而言，当前的人工智能基本上就是自动化＋统计概率，简单地说，归纳演绎的缺点就是用不完备性解释完备性。


    毕加索曾透露：“绘画不是一个美学过程，而是……一种魔法，一种获取权力的方式，它凌驾于我们的恐惧与欲望之上。”看懂了毕加索的作品，就能理解毕加索想要表达的“魔法”，并且把它用到生活中的其他领域，尤其是智能领域和人机融合智能领域。


    在就要写完本书时，恍惚间，我才依稀感到本书才刚刚开始。俄'
