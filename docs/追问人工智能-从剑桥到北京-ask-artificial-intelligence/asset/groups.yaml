    ## 四、演绎空中博弈


    1903 年，美国莱特兄弟制造的飞行者 1 号成功试飞，标志着人类进入了蓝天飞行时代。飞机诞生早期主要用于满足地面作战的侦察需求，因此，1914 年第一次世界大战爆发时，投入使用的军用飞机几乎都不携带任何武器。


    新技术的发展和应用是战争形态演变的重要推手和助力。在空战一百多年的发展历程中，机炮、空空导弹、机载雷达、预警机、各种电磁 / 光电干扰、战术 / 战法的技术提升和应用推进，引发了空战形态的发展和更迭。


    随着信息化时代、人工智能时代的到来，空中博弈下的战场环境变得越来越复杂，作战节奏显著加快，面对大量的信息和不确定、不完全的复杂因素，指挥决策人员必须在越来越短的时间内快速果断地做出指挥决定，其面临的指挥问题变得更加艰巨。信息获取的高速度和打击摧毁的快节奏已经使得传统单纯依赖人力的指挥方式处于完全被动挨打的地位。而通过人机融合和深度态势感知的
    发展，空中博弈变得越来越智能。


    当前空中博弈环境下人机智能难于融合的主要原因在于时空和认知的 不一致性，人处理的信息、知识能够变异，其表征的一个事物、事实既是事物、事实本身同时又是其他事物、事实，一直具有相对性，而各种机载设备及其他空战支撑装备处理的数据标识缺乏这种相对变化性。更重要的是，人意向中的时间、空间与机形式中的时间、空间不在同一尺度上，一个偏心理一个侧物理，一个偏主观一个偏客观；在认知方面，人的学习、推理和判断随机应变，而机的学习、推理和判断机制是特定的设计者为特定的时空任务拟定或选取的，与当前时空任务中的使用者意图常常不完全一致，可变性较差。


    意向性是对内在的感知的描述（心理过程、目的、期望），形式化是对外在的感知的描述（物理机理、反馈）。人机融合智能及深度态势感知就是意向性与形式化的综合。形式化更多的是倾向于让人们对事物有一个直观的空间上的认知，而把这种空间上的认知延伸到时间上描述，就是意向性，形式化是态，那么意向性就是势。人机融合就是要形成一个对内在与外在、主观与客观、认知与行为上的感知的整体描述，形成一个可以描述人的心理过程、目的、期望以及机器的物理机理、反馈的模型。


    事实上，把生命体特有的“目的性行为”概念用“反馈”这种概念代替，把按照反馈原理设计成的机器的工作行为看成目的性行为，并未突破生命体（人）与非生命体（机器）之间的概念隔阂。原因很简单，人的“目的性行为”分为简单显性和复杂隐性两种，简单显性的“目的性行为”可以与非生命体机器的“反馈”近似等价（刺激-反应），但复杂隐性的“目的性行为”——意向性却远远不能用“反馈”近似替代，因为这种意向性可以延时、增减、弥聚、变向……用“反思”定义则比较准确，但“反思”概念很难与非生命体的机器赋予（刺激-选择-反应）。“反思”的目的性可用主观的价值性表征，这将成为人机融合的又一关键之处。反思是一种非生产性的反馈，或者说是一种有组织性的反馈。自主是有组织的适应性，或被组织的适应性。据此，我们将恩德斯利态势感知三级模型和维纳的“反馈”思想结合，提出了一个基于“反馈”的空中博弈环境下的深度态势感知模型。


    可见，深度态势感知理论模型在不同情境下处理信息的方式会有所区别，并且以往关于态势感知的研究都充分说明了态势感知具有实时性，即态势感知会随着时间而不断地更新、迭代。所以，我们尝试着对态势感知进行细化，并提出了一个基于循环神经网络（RNN）的深度态势感知理论框架。


    我们将态势感知中的“态”定义为人-机-环境系统中的各类表征个体状态的主客观数据，即 state；将“势”定义为事件的发展趋势，即 trend；将“感”定义为对系统中“态”的觉察，即
    sense；将“知”定义为对“势”的理解。该理论框架就是为了辅助人们更好地“感势”“知势”。而为了获取数据，必然要引入客观数据，根据之前的研究，我们可以将“态”形式化为显著性，将“势”形式化为价值性，将“感”形式化为反应时，将“知”形式化为准确率。“感态”着重于时效性，而“知势”更倾向于有效性。


    “我思故我在”是笛卡儿二元认识论的起点，也是终点，即唯一确定的事，就是“我”的体验。根据认知科学的解释，由于在大多数情况下，人的认知能力是有限的，所以最优化是无法实现的。因而参与人必须了解他的目标方程，这就要求一个庞大的认知性先决条件，如同参与人发现他们所处的环境一样，而系统地描述这一目标方程是极其复杂的。知己知彼不可分，不知彼就不能知己，任何事物本身不能解释自己，只有从其他参照物处才能感知、理解、发现、说明、定义自己（我是谁，我从哪里来，我要去哪里）。进而可以认为：自我是不存在的，没有环境和参照物，自己解释不了自己，如同“我”的概念定义不能为“我就是我”一样。再进一步，自我意识也可能是不存在的，它也是交互的产物，只不过可以穿越时空逻辑关系罢了。根本上，所有的自主系统都是不由自主，只不过显隐程度不同而已。之后，笛卡儿将自己的哲学观点形式化为著名的二元直角坐标系。


    关于深度态势感知虚实参照系，我们可将其分为人机不同的态（事物）参照系、势（事实）参照系、感（显著）参照系、知（价值）参照系，当这些虚实参照系大部分一致起来时，抑或是没有本质的矛盾时，才有可能产生正确的觉察和决策行为。


    我们只有在把一物与他物区分开来时，才能对该物有所认知。只有把一个人的知识或信仰状态与他人的区分开来，才能对一个人有所了解。哲学上最难也是最重要的任务之一，是明确世界的两类特征，即那些独立于任何观察者而存在的内在特征和那些相对于观察者或使用者而存在的外在特征，如“一个物体有质量”（无论对谁而言）与“这个物体是浴缸”（也可能是水缸、饰缸、粮缸）。所以，对深度态势感知系统研究的下一步工作，就是将其具体应用到某一或某些情境中，检验其有效性和可靠性。


    ## 五、从军火战到算法战


    以智能算法为代表的人工智能技术的迅猛发展，使得新的军事智能理念得到发展。2017年4月26日，美国国防部正式提出“算法战”概念，将代替人工数据处理、为人提供数据相应建议的算法成为“战争算法”，并建立相应的组织推动“战争算法”关键技术的研究。


    算法战的目的是获得主动权，但主动不是随心所欲，而是恰如其分地随机应变，是一种因势利导、顺势而为。


    算法是优化，是用来有效处理问题的；优化也是算法，是用来有效选择算法的。《孙子兵法》就是各种算法集（三十六计），而恰当选择运用适当的算法，恰恰是算法的关键——算法的“算法”。从这个角度说，孙子兵法就是算法战，战争论也是。


    一般而言，所有个性化的认知都有一面性，不具有多面性，难以形成立体全面，所以有误差存在。如何通过片面（苗头、兆头）的感知，形成对事物整体甚至是本质的洞察，进而抓住时机采取行动措施，是衡量算法水平高低的重要尺度。即算法也涉及表征、推理、决策、实施过程。厉害的智能/算法是得意（价值空间）还不忘形（事实空间），而且可以影响自己与对手的潜意识中的感知、推理、预测、行为。


    算法战的核心是割裂对方的自知、知他，甚至是自感、他感，使之变得又盲又聋又哑又瘫。算法战最难的是隐性关系的提取捕捉和显性关系的排除过滤，通过算己算彼，达到知己知彼。


    算法战，有概算、计算、精算、细算，更有算计、盘算、暗算……算法战的关键是要跳出算和法去看待算法，才可能真正把握它、运用它。


    由于众多的蝴蝶效应，这个世界充满了不确定性。如何在茫茫大海中寻找到一些希望，这就是算法的作用——灯塔。


    新一代作战体系的核心是人机融合智能，从本质上讲，未来战争不仅取决于人工智能和远程精确弹药等高科技武器，更取决于思考、行动、创新和人的因素。


    计算的确可以让机器承担很多操作性的任务，但执行操作并不等同于替代执行操作的人。人作为自然实体所进行的操作，与机器通过计算而实现的操作相比，有一个至关重要的区别，就是约翰·塞尔所强调的“意向性”维度。机器的操作不是意向性的活动，因为它不能解释自己的操作；而人的行动是意向性的，是人所具备的概念能力的体现，在操作的同时也在进行着自我解释的活动。智慧总是关联到决定人们如何理解事实的那些价值目标上。不论是军事智能还是民用智能，都有一个反思内在价值追求的向度，这只能由人的意向性自我解释来实现，而不可能由非人来实现。战争是人与装备的结合，再好的装备也需要人来操作。例如，俄罗斯在制定人工智能武器方面的立场，突出体现在其关于致命自主武器系统的官方立场文件中，它要求“人在决策循环中”，但不赞同限制国家建立和测试新技术的主权的国际制度的概念。因此，俄罗斯国防部门采用以结果为导向，使用前瞻性的方法来开发人工智能。总的来看，军事智能将会从思想、技术和应用模式上对现代和未来军事作战产生全面影响。目前已在三个方面初见端倪：一是智力会超越体力、信息的有效协同，成为决定战争胜负的首要因素；二是无形的（不战）监控取代残酷的（激烈）摧毁，成为征服对手的首选途径；三是在体系作战中，人机融合产生的集智作用有可能超过集中火力和兵力的作用。


    一般而言，理性不能用于创造规则，也不能用于设计复杂系统，于是理性只能用于对已经存在的自发秩序进行抽象和提炼。例如，当我们看到凡·高的《一双鞋子》，不是单单观看一个静止的艺术品，而是通过鞋子感受到人的生活，感受到生活表象后人的思想、情感，从而感受到一个世界。画中的世界、艺术展现出的艺术世界、作者的世界和观者的世界，共同形成了艺术。归根到底，机器所能做的只是计算而已，而在计算与有意义的人类竞争之间，仍然有着根本的区别。正如拿破仑所认识到的，“世界上两种力量：刀剑和思想。从长远来看，刀剑总是被思想打败”。人是由其信念所构成的，他即他所信。智慧不同于科学知识，科学关心事实如何，但智慧不能只关心事实，还要更关心如何给事物以价值和意义。军事智能与民用智能最后面临的终极问题很可能不是科技问题，而是那个永恒的话题——道德伦理，而这也是超越了智能的“智能”。


    ## 第八章 人机都是主播


    随着智能终端和平台技术的快速发展，“人人都是报道者”“人人都是主播”的梦想，正在成为现实。传媒业的生产方式、传播方式、运行方式、消费方式正在发生着巨大改变，未来，“眼观六路，耳听八方”也将被赋予新的内涵和外延，人类的感和知都会衍生出不一样的味道。人机融合将成为智能传播系统的主要发展方向。


    除了应用在军事领域以外，人工智能也在切实地改变着我们的生活。随着互联网的发展，人类已经进入了信息高速且多样化传播的时代，越来越多的人成为主播，成为信息传播的节点。随着人工智能应用的不断深入，人机都将成为智能传播时代的重要节点。


    ### 一、技术发展造就智能传播


    未来，随着智能传播的发展，人类对同一事物的看、听、触、嗅、味、思都会呈现出与先前不一样的秩序，这种新的认知机制将会变得更快、更立体、更饱满、更富有多样性（包含负面性、欺骗性）。对此，要加快智能传播的发展，不仅要继续深化智能技术的研究和应用，还要提高新形势下传播理论和用户体验的分析与创新，这样才能更好地应对新闻传播行业颠覆性竞争格局的出现。


    纵观古今，展望未来，各种智能传播系统始终都是一个完整的人-机-环境系统，大数据、智能化、移动网络、云计算等各种智能传播技术都不可能是完全无人的，只不过是人由前置转为后置，由体力变为智慧，由具体执行变为筹划操作，其中还将涉及复杂的人机交互及混合问题。对于未来的智能传播变化趋势而言，单纯的人工智能或人类智能都不会使其发挥到最大效能，而两者的结合——人机智能的融合终将是其发展的主要方向。


    客观地说，智能传播是一种加快、加深人自我认知的新途径、新方式。它的出现使得人们主动、被动地突破各种“旧我”边界的速度提升了，实现了更多时空下“新我”的态、势、感、知之间的相互作用。它使得数据与信息（有价值的数据）、知识更加有机地结合在一起，甚至出现了“数+信+知”的新型混合输入形式，进而使得知识图谱（知识就是用理性区别事物的是非曲直，鉴于知识忽略了对感性的使用，所以知识图谱仅是局部的理性世界反应）中的对象、属性、关系从静止不变的标量变成了随机动态的矢量，并不断衍生出新的知识、活的知识来。未来智能传播的最优存在形态可能不是个别的传播平台，而是系统网络性的平台，更有可能是横跨不同人-机-环境系统的综合联动体系，并且该体系还会不断地自主优化升级。


    智能传播中人-机-环境系统融合的关键还将包括：一多分有灵活弥聚的表征达成、公理与非公理混合的推理方式、直觉与“间觉”交融的决策机制。首先，通过人的价值取向有选择地获取各种数据，在这个输入过程中融合客观数据与主观信息，并结合人们的先验知识和条件；其次，在人机信息/数据融合处理过程中，人加工的非结构化信息框架（如自然日常语言）会渐变为结构化，而机处理的结构化数据语法则会趋向非结构化，这个过程不但要使用基于公理的推理，还要兼顾非公理性的推理（如情感、意向性等），以使得整个智能传播过程更加缜密合理且富有人性化；最后，在决策输出阶段，由人脑中的若干记忆碎片与感觉接收到的信息综合在一起，跳过逻辑层次，并直接将这些信息中和的结果反射到思维之中，形成所谓的“直觉”。而其结果的准确程度，在很大程度上取决于一个人的综合判断能力。机器则是通过计算获得的结果——“逻辑”进行间接评价。这种把直觉与“间觉”相结合的独特决策过程，将是人机融合智能传播输出的一大突出特点。


    人际交流的语言是能指与所指混合的复合载体，而目前的人机交互只能指向单一通道，这就导致了当前的智能传播还没有出现弦外之音和言外之意。也许在不远的未来，人机智能传播会在能指和所指之间形成一种“能所+所指”的折中交互方式，以利于联系人与机的智能传播体系发展。


    另外，当前人机融合的智能传播面临的一个难题是：如何在多样性中寻求一致性表达？


    人既有确定性的一面，也有不确定性的一面，机（机器、机制）同样如此，如何把不确定性的一面转为相对稳定的确定性加以使用，这是智能传播中人机融合的一个重要问题。人的确定性+机的确定性比较好理解，人的不确定性+机的确定性、人的确定性+机的不确定性、人的不确定性+机的不确定性难度会依次递增，解决这些问题的过程就是智能传播中人机之间有机融合的过程。


    更重要的是，在智能传播过程中，人类的学习不但能建立起一种范围不确定的隐性知识，还能建立起一种范围不确定的隐性秩序/规则，人因此所起的作用是“创造意义”，而非“获得意义”。虽然机器学习也可以建立一定范围的隐性知识、秩序，但这种范围比人类学习建立的范围要小得多，而且可解释性更差，容易出现理解盲点。知识的默会性足已造成很多不确定性，规则的内隐则使得交互复杂加倍。而其根源主要在于智能传播过程中各个交互对象（人、机、环境）具有“自己能在不确定和非静态的环境中不断自我修正”的能力。


    2018 年 8 月 11 日，诺贝尔经济学奖获得者托马斯·萨金特（Thomas J. Sargent）在世界科技创新论坛上表示：“人工智能其实就是统计学，只不过用了一个很华丽的辞藻。”在智能传播过程中，这表现在构成人工智能+传播的两大基础：人类和机器的感知/推理根本上都是统计概率性的，即各种归纳、演绎、类比等逻辑推理过程中存有大量的漏洞和缺失，所以归纳、演绎、类比等推理机制都有升级的空间和余地。


    简而言之，要解决智能传播中人机融合问题首先要打破各种认知惯性，突破传统的时空关系，进而把人、机各自的感知图谱、知识图谱、态势图谱融合在一起思考。


    ### 二、人机主播融合


    恩格斯在《路德维希·费尔巴哈和德国古典哲学的终结》中曾不无深意地说道：“全部哲学，特别是近代哲学的重大的基本问题，是思维和存在的关系问题。”。其实这不仅是近代哲学的重要基本问题，对智能传播而言，这也是极其重要的基本问题。哈耶克在其
    1952 年出版的名著《感觉的秩序》( The Sensory Order ) 一书的序言中也曾写道：“完全解释我们心智形成的外部世界图景的不可能性，意味着永远不可能完全解释‘现象的’外部世界。”这段话说明了思维问题的重要性，进而深刻地揭示了人类思维的难解释性和存在的不稳定性。18
    世纪，英国哲学家大卫·休谟在《人性论》中提出一个著名问题，简称休谟问题，即所谓从“是”能否推出“应该”，也即“事实”命题能否推导出“价值”命题。这个问题在西方近代哲学史上占据重要的位置，许多著名哲学家纷纷介入，但终未有效破解。如果说休谟问题中的事实（being）是很难推出价值（should）来的，那么，人机的结合则可以打破这个困扰多年的哲学和智能命题：人的意向性认知所形成的价值观与机器形式化计算产生的事实性交互所进发出的火花，足以照亮主客观之间黑暗的通道。


    1968 年图灵奖获得者理查德·哈明就说过：“计算的目的不在于数据，而在于洞察事物。”计算机的本质就是通过数理反映心理和物理规律。玻尔也说过：“完备的物理解释应当绝对地高于数学形式体系。”认知的核心是智能，是洞察事物，所以计算属于认知，但认知不等同于计算。智能传播的目的也不在于数据，而在于洞察事物，其中人机融合就是要自然地生成这种洞察机制，进而实现人类通过符号和媒介交流信息以期发生相应变化的活动。


    从知识角度看，波兰尼曾把知识分为显性知识（explicit knowledge）和隐性知识（tacit knowledge）两大类。显性知识可以表述，属于格式化的符号系统；隐性知识可以体验领悟，属于非格式化的意念系统。借用麦克利兰的“冰山模型”一词，我们不难看到，在人类知识中，科学部分（尤其是技术）在水面上，必定是显性的，可考核衡量；人文部分在水面下，是在显性中包含的隐性，其价值由隐性知识决定，是不可衡量的，其最核心部分在无意识层次，当事人自己都难以觉察。隐性知识在技术层面为“秘诀”，在认知层面为心智。人机思维可以在发现和体验显性知识、隐性知识结合方面起到重要作用。对智能传播而言，无论是显性知识学习还是隐性知识理解，都不外乎是为了精确地感知、正确地推理和准确地预测，这就涉及一个大家司空见惯又望之兴叹的智能核心概念之一：态势感知。


    通过研究我们发现，态，形也；势，上也；态势，形而上，道也；感，觉也；知，察也；感知，觉而察，可道也；态势感知，道可道非恒道也（默会的道）；深，大也；深度态势感知，即大道无形也。弗雷格曾区分了观念（ideas）和含义（senses）两个概念的含义，他认为观念是心理的、主观的和私人的，本质上不能用于交际，因此不是通过语言交际所公用的共享意义的一部分。他还认为，一起构成思想的含义与人类心理没有关系，是远离主观的。含义和思想是非心理的、公用的、客观的，并且可用于交流的，它们都能成为语言表达的意义。这一区分是达米特所谓的“从心智中挤压出思想”，它实际上也是所有欧美语言哲学的根由。摆脱心智的思想是客观的，它们可以根据与世上事物的直接对应关系加以描述。态势感知中最困难的两部分，一是如何把主观私人心理的“势”（如生成、传播“围魏救赵”之势）转化为客观公用非心理的“态”（如围、魏、救、赵的各种状态参数）；二是如何把主观私人心理的“知”(我与赵、魏之间的关系)变换成客观公用非心理的“感”（围、救所需要的数据/信息）。


    《孙子兵法》中说“故善战人之势，如转圆石于千仞之山者，势也”。智能传播中的深度态势感知关键在于三处：一是深，二是知，三就是势，所以深度态势感知可以简称为深知势。这里的势不是指状态（参数）的样子，而是指带有意图指向的加速度变化过程，就像那块千仞之山上的圆石一般。这种态势感知包括人的态势感知和机的态势感知两部分，对人而言，一般是态势交融，态中有势，势中有（新）态，感中有知，知中有感。在众多的智能传播情境中，人不可能什么都知道了再进行，如何以偏概全，以局部解全局，见滴水之冰而知天下之寒，窥斑知豹，以小映大，这是深度态势感知研究的瓶颈之一。深度态势感知同时体现在如何把平台、系统、体系各级别态势感知融合在一起，可控的智能传播是从势到态的管理，不可靠的智能传播是单纯的从态到势的感知。中文里的态势与英文不同，situation
    = state + trendy，态里的客观性、逻辑性更多，如车马炮、上下左右、天时地利等；势里的主观性、非逻辑更多，如塞翁失马、围魏救赵、人和众拥等。当然，人对相同态和势的感、知都会不太一样，而且人的态可能就包括了机器的势，已经进行了相应的预处理。目前，在智能传播中的人机融合过程中，态面临的困难是形式化符号如何准确地表征，势对应的瓶颈为意向性如何完整地抽象提炼，感遇到的麻烦在如何反身性主动获取，知直面的阻碍在于局部-全面关系的如何转换，以及人的态、势、感、知如何与机器的态、势、感、知相融相合。

