    是五子棋、象棋等各种棋类游戏，都是童年的美好回忆，但人类玩游戏的整个过程是什么样的呢？


    具体过程如图 5-1 所示：首先，玩家的眼睛捕捉显示屏上的游戏画面，并在视网膜上形成影像；然后经过视觉神经传至 V1 区，并提取线条、拐点等初级视觉信息；初级视觉信息经过
