    的研究，还要提高对智能化战争条件下作战指挥控制理论的研究。


    纵观古今，展望未来，各种军事作战装备或系统始终都是一个 人-机-环境系统。无论是现在还是未来，无人机、无人车、无人艇 等各种无人装备都不可能是完全无人的，只不过是人由前置转为后
    置，由体力变为智慧，由具体执行变为指挥控制，其中涉及复杂的人 机交互及其相互关系的问题，单纯的人工智能与人类智能都不能使其 发挥最大效能，人机智能的融合是其重要的发展方向。


    准确地说，军事智能不仅包含自然科学和工程技术，还涉及社会 科学领域，如人文、哲学、宗教乃至艺术等，这从世界上最早的兵书 之一——《孙子兵法》的英文名字 The
    Art of War 即可见一斑。有时 候，好的军事指挥不仅是技术还是艺术。军事智能是人工智能之冠上 的明珠，相对传统的民用人工智能，其对抗性、博弈性更强，军事智
    能不仅仅是武器装备的智能，更是指挥控制系统的智能，是体系的智 能。如果人工智能主要是以技术为主，那么军事智能则是将技术与艺 术进行结合。未来军事智能的最优存在形态应该不是个体性的（如异
    常先进的单平台武器），而是系统性的（网络性的），更可能是横跨 各人-机-环境系统体系性的（如跨不同网络的陆海空天网体系），并 且该体系还会不断自主升级。


    人工智能的最底层技术是二极管的 0、1 二元逻辑，军事智能的 最底层技术是人的多元意向（非逻辑）。军智将会改变现代作战需求、 样式、技术、能力，由火力强度需求转为点穴式制约需求，由传统攻
    防样式变为多域协同样式，由自动信息技术升级为智能洞察技术，由 OODA（观察、调整、决策、行动）迭代能力进化为人机融合的深度 态势认知能力，进而保证机器技术与人类艺术的有机联结。


    如同人工智能当前在民用领域没有达成共识的定义一样，军事智 能除了在应用领域比较明确之外，现在也没有共同一致的概念，将来 可能也很难以产生一致认同的概念，因为人本身就是一个极其不容易归
    纳概括的名词，凡是涉及人的行为，尤其是智能行为，更是变化莫 测、出其不意。德国军事家克劳塞维茨把战争中多方的智能博弈看作 不透明的理论——The theory
    of war，军事智能的不确定性和模糊性'
  - '[PAGE 138]


    甚至超出了人类的认知。


    世界即使再复杂，情境再捉摸不定，也总有蛛丝马迹。第三次“抵消战略”自2014年9月由美军提出以来，目前已进入全面实施阶段。美国国防部副部长沃克提出，自主学习、机器辅助人员作战、有
    人一无人作战编组、网络化半自主武器将是第三次“抵消战略”重点发展的五大关键技术领域。美军在2016～2018财年的国防预算中，持续加大对自主系统、情报数据分析、大数据分析、机器人、自动化及先进传感技术的投资强度。是否能研究出支撑技术应用的算法，提升人工智能、自主技术的水平，将成为决定上述各主要方向技术发展的关键所在。从众多公开信息分析不难看出，美军对军事智能领域的重视程度也很高，其主要着力点是两部分：一是机器学习，二是自主系统。机器学习就是形式化的（程序规范性的）代表，描述一个规则的事态；自主系统就是意向性（非形式化、事实经验性的）的代表，描述一个可能的事态。形式化推理就是将命题、逻辑连接符号化，然后规定变形规则，进行公式间的转化变形，就可以用用来表达推理。非形式化的推理就是不借助符号，而是直接通过自然需要来进行语句间的变换。一开始这两个部分可能是各自为战，分头突进，但过不了多久，该研究的真实意图就会和未来科技的发展趋势越发一致起来：人机融合智能系统。这也说明了军事智能的可见未来既不是单纯的机器学习，也不是单一的自主系统，而很可能是结合人机各自优势的融合智能，若凝练成科学问题，本质上就是要回答认知和计算的关系问题。


    # 二、深度态势感知，精准军事洞察


    对军事智能而言，无论是机器学习还是自主系统，都不外乎是为了精确地感知、正确地推理和准确地预测，这就涉及一个大家司空见惯而又望之兴叹的军事智能核心概念之一：态势感知。


    无论是军用还是民用，人工智能的本质都不是简单的赋能，而是人类智慧的自我反馈，是他人在不同时空中的概念知识在“我”的时空情境中的运行，所以常会出现人机融合的不适，不过也很正常。如果非要说人工智能是赋能，那也是别人以前的可程序化、可预测性的'
  - '[PAGE 139]


    知识赋予现在的“我”的能力而已。其中的知识一般分为两个层次，顶层的知识由概念的、符号的、离散的或命题性的知识构成；底层的知识由感觉的、前概念的、亚符号的、连续的或非命题性的知识构成。底层的知识往往涉及感性，与态势中的“态”有关；而顶层的知识常常涉及理性，与态势中的“势”有关。


    态就是暂时如此的表象，势就是本来如此的真相；态势感知就是通过转换不同的角度进行思考以达到知己知彼的途径，一般是由表及里、由外到内、由左到右、由下到上、由态到势、由感到知，若能够把其逆过程融入进来，即同时还可以由里及表、由内到外、由右到左、由上到下、由势到态、由知道感，那么还可以加入“深度”以示强调，因此称之为深度态势感知。孙子所说的“知”应该就是这种双向甚至更多向的交互换位融合，就是深度态势感知，而他所说的“己”和“彼”也不仅仅是指敌我，还应涉及各种物和装备，以及对环境的考虑。“自己”这个东西是看不见的，撞上一些别的什么东西，反弹回来，才会了解“自己”。所以，与很强的东西、可怕的东西、水准很高的东西相碰撞，然后才知道“自己”是什么，这才是自我。优秀的指战员不仅可以及时感态、知态，还可以迅速地感势、知势。态倾向形式化，势倾向意向性，态势感知就是形式化衍生出的意向性描述，势态感知就是态势感知的逆向过程——资源管理。例如我国著名的三十六计（围魏救赵、金蝉脱壳等）强调的是势，不是态，算计出的是势，计算出的是态，人是算计，机是计算。人是从势到态（高手强势弱态，低手弱势强态），机可以是从态到势（好机弱态强势，坏机强态弱势）。


    深度态势感知是把平台、系统、体系各级别态势感知融合在一起形成的。可控的指控是势态管理，不可靠的是态势感知。人们视觉上一般是先见森林后见树木，先整体后个体，这与先势后态的深度感知是一致的。


    态是对事物的一种印象，势是对这种印象的一种观念。科学发现无非就是四类：根据有物之象，找无物之象；根据有物之象，找有物之象；根据无物之象，找有物之象；根据无物之象，找无物之象。军事'
  - '[PAGE 140]


    家发现态势无非是四类：根据有态之势，找无态之势；根据有态之势，找有态之势；根据无态之势，找有态之势；根据无态之势，找无态之势。


    感性缔造着理性，艺术牵引着创造。态势感知的理性不仅仅限于形式理性（理论理性）。要把理论理性和行为／实践连接打通，需要的界面是“实践理性”，亦即关乎指导感知的态势理性。纯粹的理论理性既是抽象化的，也是理想化的；实践理性则可以是没有理想化的抽象化，可以用来指导行为。在不同的时间，同一个态在同一个人的头脑中形成的“象势”也是不一样的。比如，幼年、青年和老年时期，“爱”字在头脑中形成的“象”就完全不同。在不同的地点，同一个态在同一个人的头脑中形成的“象势”也是不一样的。比如，分别在冰窖里和火灶旁，“冷”字会形成不同的“象”。其实早在明朝，王阳明就已经知道这个秘密了，他为了更加全面、准确地认识“死”字，甚至亲自躺进石棺中去体验。由于多义性，某些字同时对应着多个“象”，使得在不同的词或文中，该字的意思不同，如一态多势、多态一势、时态时势、空态空势。


    态中常常包含专业层级中合乎常规的类型组合，势中往往违背了专业层级中合乎常规的类型组合，这可美其名曰：常态异势。重要的是，态的表面对称通常会掩盖深层势的不对称，犹如人体显而易见的左右对称掩盖了内部器官的不对称。


    态的聚类可以限制态网络中的搜索。态网络中的所有搜索都源于一个核心态（即势）及通过扩散激活从这个势扩展开去。如果围绕一个态进行无限扩展，最终会得到无数毫无关联的势。未加约束的搜索很快会产生出矛盾且无关的信息。受态聚类约束的搜索（通过态聚类区分其结果的搜索）得到的结果是具有系统性且连贯的。聚类是一种关联，由核心态-势引导的聚类搜索只检索相关的信息。


    对“态”而言，其本质是表征的问题，尤其是静态的表达，侧重于感形（客观存在，being），即感己感彼；对“势”而言，本质是理解（构建联系）的问题，尤其是动态的会意，侧重于知义（值得、应该，should），即知己知彼；由态到态的交互过程，没有智能的出现，'
  - '[PAGE 141]


    即得形失意；由态到势的交互过程，亦即数据在流动中生成信息知识（形成价值性）的过程，也就是智能的产生过程，即得意忘形。理性很难进行创造，感性很难进行精确。很多态是形不成势的，态形成势的过程就是智能元素成分浮现的过程。


    态势结构理论在逻辑上把态势刻画为基于结构上的类比匹配的系统，这些结构的构成态来自于不同类型态的聚类或势场。类比匹配出现于态势之间或者描述之间。类比态势具有共同的事实结构，而类比描述具有相同的概念结构。两者区别很大，类比描述不需要为真，只需要共有某些态的规则排列即可。康德可能是第一个区分相似性和类比的人，即类比不表示“两个对象之间的不完全相似性，而是两个并不相似的对象之间关系的完全相似性”，如“人类行动是机械力”。


    在军事智能领域中，特别是态势感知处理过程中，态势与感知的形式化、意向性描述分析非常重要，其中形式化就是理性了的意向性，意向性就是感性了的形式化，逻辑就是连接感性与理性、形式化与意向性的桥梁。意向的可及性是其形式化的一个关键，可及性也是可能性向现实性转化的前提条件。就意向性而言，可及性就是态与势之间的限定交互，如同一个事物在不同时空情境（各种态＋各样势）中转换的配对和映射、漫射、影射。事实上，从数学的映射到物理的漫射再到心理的影射都涉及智能问题，这既是逻辑命题与经验命题之间的相互融合过程，也是人类理-解、感-知的过程，其中从理到解的一部分即人工智能。目前人工智能最难突破的是非家族相似性的漫射、影射问题，人机合作则有利于该问题的解决：人的意向性是形而上，机的形式化是形而下，人机融合就是两者虚实之间的道器结合。差异会产生变化的动力，人是容易感知到前提条件变化差异的，机器对此应对明显不足。如何使机器产生感知外部前提条件的变化，并依此而随机应变，是人机融合的一大障碍。例如，人类的词语、概念、语义不是固定的，是随着情境的变化而自然变化的，而机器的这种畸变就小得多或基本没有，变与不变形成对立，而如何统一就是关键点。需要强调的是，军事智能中的人机合一，不是简单的“人心＋机脑”，而是人（单人、多人、敌我）＋机（机器装备＋机制管理）＋'
  - '[PAGE 142]


    作战环境（真实＋虚拟）体系的交互统一。


    军事智能本质就是主客观的融合，既包括有机融合，也包括无机融合，即是主观以一定方式与客观融合，其目的是适应。军事智能研究的第一步是解决表征问题，没有表征，何谈联系？即先搞清楚（你我他）是“谁”之问题，也就是“知己知彼”。对人而言，之所以诸多表征的不确定性不会造成处理、决策的不确定性，其实是人的意向性和目的性在起作用，人本身就是目的而不仅仅是工具。如中西思维方式的差别：由于西方使用拼音文字，导致字符本身的概念消失，因此必须在强逻辑结构中寻求概念，在抽象中展开知识体系，导致西方人进入逻辑强迫症状态。“态”就是先天已存在的事物发展惯性，“势”就是后天未存在的事物发展惯性，感知就是要理解态、势。深度态势感知就是深度理解态、势。例如，“状态注定，势可改变”，但很多人理解成了“态势注定，不可改变”。正可谓态由天定，势由己生。另外，军事智能不是情境／场景／态势性的，而是跨情境／场景／态势性的，因而超越感知的觉。深度态势感知系统不是完美的，但是具有重要的参考辅助价值，是指一种基于复杂性博弈和反思的理解之道。这种理解之道能够帮助指战员直面未来战场的各种变故与不确定性，更好地与自己所具有的条件、环境打交道，理解它的复杂性，以及自己在其中扮演的角色，从而拥有一个更有利的过程和结果。也可以这样理解：深度态势感知并没有传递给你任何新的知识，而是通过将你原本熟知的事物变得陌生，给予你另一种看待事物的方法，而这个角度可以使你距离胜利更近。


    如果说态势感知是形式化的系统，那么深度态势感知就是加了意向性的形式化系统。我们不苛求为深度态势感知提出完美的字面解释，而是希望能给出其中意向性的逻辑释义。毫无疑问，逻辑释义会丢失意向性中某些最令人兴奋的方面，如弦外之音、美学意境、拓扑效果。但我们关心的是真值，我们对意向性的认知意义和形式化的效果感兴趣。语言、逻辑就是把意向性进行形式化的一种工具。艺术与科学的转换也是如此。文化、变化、转化、异化等中的“化”很有味道，其中不仅仅有融合的意思，也有改变的痕迹，可以笑称为“化”'
  - '[PAGE 143]


    学。同样，状态、动态、变态中的“态”与趋势、形势、局势中的“势”构成的态势图谱也远比知识图谱更可靠、高效、灵巧。究其原因，对人而言，事物的属性是变化的，事物之间的关系也是变化的；对机而言，事物的属性是不变的，还被人定义了关系变化的区间价值域，如知识图谱。


    态是事实空间，势是价值空间，感是事实获得，知是价值关系。


    关于深度态势感知虚实参照系，我们可分为人机不同的态（事物）参照系、势（事实）参照系、感（显著）参照系、知（价值）参照系，当这些虚实参照系大部分一致起来时，抑或是没有本质的矛盾时，才有可能产生正确的觉察和决策行为。


    态势图谱确定范围和方向，知识图谱确定精度和速度，两者结合可以真正实现态势感知的工程应用化和技术化。


    对于自主系统而言，其实往往就是主动的否定系统，如小孩子成长中最先会说的动词是“不”“没有”“别”，这意味着他／她要自主了。而同意常常意味着失去自我，如小孩子若用“好的”“同意”“太棒了”等表达自己的观点时，有时就意味着他／她开始失去自我了，当然否定自我也只是一种自主，只不过目前机器距此还甚远。如反思产生出的各种隐喻，这是只有人类才具有的特殊能力。隐喻是言外之意，非语法、逻辑是弦内之音。其实仔细想想，真实的世界不是既有黑也有白吗？所谓的法不就是非少了些吗？规则的形成莫不如此：从小概到大率，然后从合法到非法，隐喻也有法，不过和形式逻辑的法有所不同，隐喻里的法不是语法，是义法、用法，不过时间一长，达成共识，也会变成明喻，变成语法。法就是达成一致了的共识，无法就无天，天就是共识的边界。隐喻不是对态而是对势的指向，是逻辑的“逻辑”，同时也是大胆假设（想象）下的小心论证（逻辑）。


    # 三、人机融合：最大化打垮敌人


    对于人机融合智能而言，人可以把握实在的可能性，机可以运行逻辑的可能性，两者都会产生因果或相关关系，但这些关系具有不同的意义。即也许存在多重的因果或相关关系于人机融合之中，这些关'
  - '[PAGE 144]


    系有显有隐，交融在一起，进而构造生成了复杂性问题。在复杂系统中可能交织在一起形成多个因果或相关关系嵌套纠缠，而我们注意到的与实际的关系经常存在不一致性。赋予机器智能的假设前提基本上都是有限的，这种有限性限制了众多的变化可能性。这些问题的解决不是靠增添新经验而是靠集合整理我们早已知道的东西——常识。人自身的感和觉也有隐协议，这些默会的协议支配着人的态势感知，是先视后识，还是先识后视，抑或是两者在何种态势下混合使用？而且每个人的方式都不同——习惯阅历使然。


    人与人之间的交流也有不少协议，而且这些协议在相互交流中切换自如，游刃有余，不知不觉，变化多端，甚至可以在自相矛盾中自圆其说（如自然语言里的多义性）。这些协议中有些是隐性的常识规则，有些是个性化的性格习惯，总体上，两者间的边界模糊，弹性十足，约束宽松，条件灵活……而相比之下，人机之间的交互协议显得是那样的单调、机械，虽界面分明却有板有眼，虽一丝不苟却缺乏情趣。


    人，尤其是厉害的人，总是能抓住最本质的东西，找到最合适的角度，使得不同现象间的深刻联系浮出水面。机器也正在朝着这个方向被塑造……人会犯错，并且现在机器犯的错误也是人错，我们很多经验与对真理的识得却是从错误中得来的。当机器也会真犯错的时候，颠覆就真的开始了。


