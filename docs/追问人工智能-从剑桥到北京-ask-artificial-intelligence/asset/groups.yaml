    同学科的研究已经表明，在传达情感方面，身体的表达像面部表情一样强大。例如，情感计算通过提取人体手势的特征来识别用户的情绪。同时，随着虚拟现实技术的发展，人机交互中肢体的参与度也逐渐增大，身体姿势不仅控制我们和游戏之间的互动，还会影响我们自己的情绪。在“蓝眼睛”（Blue
    Eyes）技术中，“蓝”代表实现可靠的无线通信的蓝牙，“眼睛”即通过观察眼睛运动使我们获得更多有趣和重要的信息。“蓝眼睛”技术主要用于视觉注意监测、生理状态监测（脉搏率、血氧）、操作者的位置检测（站立、卧、坐）。在这项技术中，通过检测人的表情，捕获表情图像，并且提取显示具有眼睛的部分，实现识别检测的作用。


    # （2）内在复杂性的探讨


    文本句子中的每一个形容词、动词或者仅仅是一个字，都可以表达情感状态。笔记分析技术不仅可以通过书写者的情感输出分析笔记特征，如基线、倾斜、笔压、大小、边缘区，还可以揭示书写者的健康问题、道德问题、过去的经历、精神问题以及隐藏的才能。索菲亚尼等人发现，笔记分析在某种程度上可以帮助我们理解书写者本人的行为、动机、欲望、恐惧、情感投入等多方面。史伟等通过构建情感模糊本体、计算文本影响力等，对微博公众情感进行一系列分析，发现公众对于突发事件的情感表达与政府对于事件的处理方式和手段有密切关系。使用任何文字表达情感是受文化影响的，文化在情感文本表达中的作用这一问题需要自然语言研究者们创造更强大的检测算法。


    戴维森（Davidson）在2002年提出，情感体验并不是简单地发生在我们的头脑中，我们的整个身体都在感知着它们。例如，我们血液中激素的变化，传达到肌肉的神经信号紧张或放松，血液流到身体的不同部位，改变了身体的姿势、动作和面部表情。我们身体的反应也会反馈到我们的大脑中，创造了可以反过来调节我们思维的经验，这也会反馈到我们的身体上。随着科技的发展，许多数据可以从互联网和智能手机上获得。人们的上网活动一般包括搜索查询、浏览网页、广告选择和电子商务等。而用户在网络中创建的数据，如电子邮件、短信、博客等内容都可以进行分析。一个典型的智能手机包含多'
  - '[PAGE 95]


    个传感器，如加速度计、环境光、陀螺、手势、磁强计、温度计、湿度计和气压计等。乔格（Jorge）等研究人员通过捕获包括输入和输出呼叫频率、持续时间和联系人的详细信息等智能手机的活动，分析患者的行为变化。卡韦赫·巴赫蒂亚里（Kaveh
    Bakhtiyari）等人认为，在处理面部表情、人的声音或人的姿势时，有些权衡识别精度和实时性能的方法，像自然语言处理（NLP）和脑电图信号（EEG）这些方法在实际应用中缺乏效率和可用性，因此提出了使用方便和低成本的输入设备，包括键盘、鼠标（触摸板、单触摸）和触屏显示器。该系统通过人工神经网络（ANN）、支持向量机（SVM）技术开发和训练监督模式。结果表明，与现有方法相比，该方法通过
    SVM 增长 6% 的准确度（93.20%），对于情感识别、用户建模和情感智能都起到了突出作用。


    # 3. 情感计算的最新应用探究


    近几年，研究者们尝试了各种各样的方法和技术来识别用户的情感，一些主要的方法和技术包括：面部表情识别、姿态识别、自然语言处理、人体生理信号识别、多模情感识别、语音识别。人机情感交互则包括人脸表情交互、语音情感交互、肢体行为情感交互、文本信息情感交互、情感仿生代理、多模情感交互。情感仿生代理使计算机增强表现力和亲和力，情感智能系统可以根据人的情感进行反馈，并且使人和计算机的交互更加自然。


    全世界许多实验室都在积极地对情感计算相关技术进行研究，本部分总结了近三年来国内外情感计算的主要应用研究。2014 年，麻省理工学院实验室通过安置在机器，比如汽车上的硬件设备（如相机等），结合基于程序语言的语音识别应用、可穿戴设备（对当前情绪进行实时调节），尤其是面部识别算法，获取一系列情绪指标，弥补获取生理信号类的传感器的不足，探索情感感知与机器连接的潜力。情感分析公司使用计算机视觉和深度学习技术分析面部（微）表情或网络上视觉内容中非语言的线索，基于积累的庞大数据存储库，学习识别更复杂的系统，将情感人工智能引入新的科技领域，尤其是机器人、医疗、教育和娱乐，并展望将此系统用于通过检测癫痫病患者的'
  - '[PAGE 96]


    情感信号来做好发病前的预测以进行防护准备等。2015年，阅面科技（ReadSense）推出了情感认知引擎——ReadFace，由云（利用数学模型和大数据来理解情感）和端（SDK）共同组成，嵌入任何具有摄像头的设备来感知并识别表情，输出人类基本的表情运动单元、情感颗粒和人的认知状态，广泛应用于互动游戏智能机器人（或智能硬件）、视频广告效果分析、智能汽车、人工情感陪伴等。哈尔滨工业大学机器人技术与系统国家重点实验室研发了语音情感交互系统，提出了智能情感机器人进行情感交互的框架，设计实现了智能服务机器人的情感交互系统。北京航空航天大学基于特征参数的语音情感识别，能有效识别语音情感。中国科学技术大学基于特权信息的情感识别，提出了融合用户脑电信号和视频内容的情感视频标注方法，以及以某一模态特征为特权信息的情感识别和视频情感标注方法。清华信息科学与技术国家实验室、中国科学院心理研究所行为科学重点实验室基于生理大数据的情绪识别研究进展，针对使用DEAP数据库（用音乐视频诱发情绪并采集脑电及外周生理信号的公开数据库）进行情绪识别的16篇文章做了梳理，对特征提取、数据标准化、降维、情绪分类、交叉检验等方法做了详细的解释和比较。


    # 4. 情感计算的深度探究


    现在已实现的情感计算大部分原型情感的识别来源单一。数据库本身存在短板，如训练分类的样本数少，体态识别大多依赖于一组有限的肢体表达（跳舞、手势、步态等），只关注内部效度而缺少外部效度的认可。因此，在识别方面，未来研究应在情感分类方面继续努力，创建新的数据库，特别是婴幼儿及儿童数据库的建立。


    在神经科学方面，人类大脑情感过程的神经解剖学基础极其复杂且远未被理解，因此，该领域还不能为开发情感计算模型提供充足的理论基础。


    在人机交互或人与人交互过程中，人的情感变化是变速的。虽然皮卡德在《情感计算》一书中分别用两个比喻将情感复合分成两类：'
  - '[PAGE 97]


    微波炉加热食物时开关间断循环与冷热水混合。两者通过不同的方式使物体达到“温”的状态，前者类似于“爱恨交加”中的情感状态；后者类似于拉塞尔等人的环形情感模型中的愉快与低强度结合为轻松这种新状态。但基于不同情境的情感复合远不止这两类。以动态的数字平台将这种做成模型很难实现和验证，因为情感的输入、输出应该在不同的情境下产生和测试。


    目前，国外已经有一部分研究者开始关注深度情感计算方面的研究，如阿尤什·沙玛等人利用语言数据联盟（linguistic data consortium，LDC）中的情绪韵律的语音和文本，基于交叉验证和引导的韵律特征，提取与分类的深层情感识别。


    随着后续情感方面的深度研究，多模型认知和生理指标相结合、动态完备数据库的建立以及高科技智能产品的加入等，将成为情感计算相关研究的一个趋势，从而更好地实现对用户行为进行预测、反馈和调制，实现更自然的人机交互。


    # 五、游戏中的人工智能


    如何找到一种可产生意向性的形式化手段是通往人机有效融合的关键，目前的数学、物理手段还不具备完全承担这个重任的能力，因为这仅是智能——这个复杂性系统问题的两个方面而已。


    继 2013 年论文 Playing Atari with Deep Reinforcement Learning 发表以后，Google DeepMind
    的“阿尔法狗”在围棋上的人工智能突破又一次震惊了世界。其实，从 1950 年香农教授提出为计算机象棋博弈编写程序开始，游戏人工智能就是人工智能技术研究的前沿，被誉为人工智能界的“果蝇”，推动着人工智能技术的发展。接下来，就为大家介绍一下游戏人工智能。


    # 1. 概念


    如果我们知道了什么是人工智能，游戏人工智能的含义也就不言而喻了。人工智能作为一门交叉学科和科学前沿，至今尚无统一的定义，但不同学科背景的学者对人工智能做了不同的解释：符号主义学派认为人工智能源于数理逻辑，通过计算机的符号操作来模拟人类的'
  - '[PAGE 98]


    认知过程，从而建立起基于知识的人工智能系统，其主要代表成果是风靡一时的专家系统；联结主义学派认为人工智能源于仿生学，特别是人脑模型的研究，通过神经网络的联结机制和学习算法，建立起基于人脑的人工智能系统，其主要的代表成果是风头正劲的深度学习；行为主义学派认为智能取决于感知和行动，通过智能体与外界环境的交互和适应，建立基于“感知-行为”的人工智能系统，其主要代表成果是独树一帜的强化学习。其实这三个学派分别从思维过程、脑结构、身体三个方面对人工智能做了阐述，目标都是创造出一个可以像人类一样具有智慧、能够自适应环境的智能体。理解了人工智能的内涵以后，我们应该如何衡量和评价一个智能体是否达到人类智能水平呢？目前有两个公认的界定：图灵测试和中文屋子，一旦某个智能体能够达到这两个标准，那么，我们就认为它具备了人类智能。


    而游戏人工智能是人工智能在游戏中的应用和实践。通过分析游戏场景变化，玩家输入获得环境态势的理解，进而控制游戏中各种活动对象的行为逻辑，并做出合理的决策，使它们表现得像人类一样智能，旨在提高游戏娱乐性、挑战智能极限。游戏人工智能是结果导向的，最关注决策环节，可以看作从“状态（输入）”到“行为（输出）”的映射，只要游戏能够根据输入给一个看似智能的输出，那么，我们就认为此游戏是智能的，而不在乎其智能是怎么实现的（whatever
    works）。那么，怎么衡量游戏人工智能的水平呢？目前还没有公认的评价方法，而且游戏人工智能并不是特别关心智能体是否表现得像人类一样，而是更加关心游戏人工智能的智能极限——能否战胜人类的领域专家，如“沃森”在智能问答方面战胜了问答节目《危险边缘》（Jeopardy!）超级明星肯·詹宁斯（Ken
    Jennings）和布莱德·拉蒂（Brad Rutter）；“阿尔法狗”在围棋上战胜了欧洲围棋冠军樊麾、世界围棋冠军李世石。


