    ## 第一章


    ## 人工智能：从“史前”到现在


    人工智能创立至今，已经度过了60余载。在这一个甲子多的时间里，有高潮也有低谷。对人类来说，年过花甲意味着已经开始逐渐步入迟暮，很多方面都开始走下坡路；而对人工智能来说，在经历过数次波折、几起几落之后的今天仍然蓬勃发展，并显得愈发年轻起来。


    ### 一、人工智能，从头说起


    要想预测一个人的未来，需要了解其过去。同样，要想展望人工智能的未来，需要先了解它的起源与历史。


    在人类文明的历史中，有过四大文明古国，其中古巴比伦和古埃及这两个文明几乎同时出现，它们在距今 6000 多年前，就已经有了国家、工具和文字，这两个文明直接导致了欧洲文明的起源。这两个文明主要是研究人和物之间的关系，如水利、工具、一些制度与法律。这种人和物之间的关系，后来影响到了欧洲的一些地中海（希腊）文明，继而辐射到整个欧洲大陆，诞生了科学和技术，科学和技术的宗旨就是研究人和物之间的关系。


    除了这两个最早的文明以外，第三大文明就是古印度文明。古印度文明中很重要的一个特质，就是研究人和神之间的关系。人和神之间的关系，主要是人和抽象事物、不可掌控的一些事物之间的关系，在中东、印度一带，诞生了几乎世界上所有最主要的宗教，包括伊斯兰教、基督教、印度教、佛教等，都是关于人和神之间关系的。


    第四大文明是研究人和人之间关系、人和环境之间关系的一个重要文明，即中华文明。目前世界上保存的较完整、较好的文明，就是中华文明。中华文明体现的不是人和物、人和神之间的关系，而是人和人之间如何融洽，人和环境之间如何和谐，天、地、人之间如何共生的问题。


    在距今 2500 年以前，西方最主要的科学之祖，也是哲学之祖，是泰勒斯，他和中国的老子、孔子差不多出现在同一时代，其思想体现在他的一句箴言中，即 “Water
    is best”（水是最好的）。水是一种物质，地球生物是从海洋里诞生出来的，然后水又滋养和哺育了人类，所以西方的科学和哲学一开始就和物质密切相关，而老子的
    “上善若水”，孔子的 “逝者如斯夫”，也是对水的一种感叹，但他们大多都拘泥于感性和伦理方面，故东西方文明的差异从这几个代表性人物的言语中可见一斑。


    从上文可见，在历史发展的长河中，人类四大文明分别聚焦于人与物、人与神、人与人、人与环境相互之间的关系，而科学和技术的发展，与人和物之间密切相关，所以，现代科学技术起源于欧洲，是顺理成章的，也是可以理解的。但目前来看，随着社会和人类的不断进步，人与人、人与环境之间的关系被日益提到日程上来。因此，现在整个世界的焦点，逐渐从西方转移到了以人与人、人与环境为主的东方视角来。


    人与物之间的关系，是西方一个重要的研究方向，机器是人造物，所以人机交互，也是起源于西方。人机交互的本质是共在，即“being together”。人把自己的优点与机器的长处结合在一起，形成了一个交互的、实质性的问题。而未来人工智能的发展方向，很可能是人机融合智能或人机混合智能，即把人的智慧和机器的智能结合在一起，形成一个更有力的、更具支撑性的发展趋势。这样不但研究人机交互的脖子以下的，即生理的问题，而且研究脖子以上的，即心理的或者大脑的问题。其实，“人机交互”或“人机混合智能”，都是不准确的词，最准确的词是“人-机-环境交互系统”，因为人和机器及物质，其交互是不完整的，是通过环境这个大系统来进行沟通的，所以人-机-环境系统工程，可能是一个主要研究方向。


    那么，人工智能或智能的本质是什么？可以从人的成长经历或发展上看出一些端倪。一般来说，胎儿在母亲腹中就已经开始有了各种感觉，如听觉、嗅觉、味觉、触觉，已经开始和外部的环境及母亲腹中的内部环境进行交互，已经产生了一个很简单的“我”的概念。出生以后，由于视觉、听觉等感觉发育得不是很完善，更多的是通过触觉来接触世界，了解他周围的一些事物。随着自主能力的产生，会试图摆脱大人的束缚，更愿意自己爬，自己走，不希望别人去扶。可以看到，婴儿这时候已经开始学会否定，即否定别人的帮助。据国内外最新的研究结果，小孩形成语言的时候，无论是东方还是西方，除了被不断重复灌输的“爸爸”“妈妈”这种词以外，自己先说出的，都是从第一个单词——动词“不”开始的，然后会发展到说“没有”“别”这些词。“不”“没有”“别”这些词，就是孩子们成长的一个过程，在这个过程当中，就体现出人的智能，是从否定开始的，否定外部，否定自己，否定很多事物，进而来产生某种智慧性的东西。需要注意，在人工智能中，其否定机制还远远没有产生，所以人工智能和人的智能，还存在很大的差异。


    我们在研究过程中发现，人工智能的起点，第一个词是“being”（“是”），即存在，客观的物质，这是西方哲学中一个很重要的词，世界是物质的还是意识的，其中物质就是“being”。关于人的智能和智慧，还存在着“should”（“应该”）。《三国演义》中的“义”，就是“should”（“应该”）的意思，“仗义”的“义”也是“应该”的意思，“应该”这个词，在西方非常重要，在东方也很受重视，这是东西方交流的一个交汇点。“should”，翻译成哲学语言，就是意识，即“awareness”“consciousness”。另外，还有“want”，人有“want”，即想干什么；而机器不会“want”，机器只会按照程序、指令进行操作；而人还有一个“can”（“能”）的问题，即能做还是不能做。机器没有这个问题，只是操作。


    休谟在他的哲学体系中提出了很重要的“休谟问题”：“是”推不出“应该”，这句话的意思是从事实中推不出价值观。中国古代著名的一句话“天行健，君子以自强不息”是不成立的。“天行健”是一个事实，“君子以自强不息”是一种价值观，二者不能画等号。这里面涉及一个很重要的词“change”（“变”），人会不断地改变，而机器不能，只会按部就班、因循守旧、刻舟求剑。我们认为，这五个词是人工智能和人类智能很重要的差异。另外，人还有一个很重要的特质，即感知的恒常性，人
    在变化的外界环境当中通常能够保留对这个事物的本来面目的感知，如某种颜色。在不同的背景下，会改变这种颜色的影响，但是人能够在这种变化当中找到不变的那种感觉；而机器则不然，机器对外部变化的颜色，会有一个实时的反应，很难找到那种不变的东西。


    现代人工智能的发展，剑桥大学起到了非常重要的作用，其中有三个代表性的人物：第一个就是阿兰·图灵，他提出了图灵测试和图灵机的思想，影响了整个世界人工智能发展的轨迹。第二个就是著名

