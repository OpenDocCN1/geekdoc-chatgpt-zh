    虽然很容易将这个问题看作人们不适合处理的自然事件，但实际上它通常是在许多系统中处理、存储和呈现数据的模式。在工程术语中，问题不是体量，而是带宽——由人的感觉和信息处理机制提供的带宽。虽然我们不能随意地改变通道的大小，但我们可以显著影响数据可以流过通道的速率。


    混乱和混乱的数据流经管道的速度非常缓慢，以某些形式（如文本流）呈现的数据也通过管线移动得比图形化呈现的慢得多。通过设计以增强态势感知，可以消除或至少减少数据过载的显著问题。


    ## 5. 错位


    在真实世界中，许多信息片段会在人的注意上产生竞争。对于司机，这可能包括广告牌、其他司机、道路标志、行人、拨号盘和仪表、收音机、乘客、手机对话和其他车载技术。在许多复杂的系统中，类似地会出现许多系统显示、警报，以及争取注意的无线电或电话呼叫的情况。


    人们通常会试图寻找与他们的目标相关的信息。例如，汽车驾驶员可以在竞争的标志和物体中搜索特定的路牌。然而，驾驶员的注意力同时将被高度突出的信息所捕获。显著性、某些形式的信息的完整性，在很大程度上取决于其物理特性。感知系统对某些信号特性比其他信号特性更敏感。因此，如红色、移动的物体、闪烁的灯比其他特征更容易捕获人的注意。类似地，较大的噪声、较大的形状和物理上较近的物体更容易捕捉人的注意力。这些通常是可以被认为对进化生存有着重要作用，并且感知系统很好地适应的特征。有趣的是，一些信息内容，如听证人的姓名或词“火”也可以具有相似的突出特征。


    这些天然的突出特性可用于促进态势感知或阻碍它。当仔细使用时，诸如运动或颜色的属性可以用于引起对关键和非常重要的信息的注意，并且因此是用于设计以增强态势感知的重工具。不幸的是，这些工具经常被过度使用或不当地使用。例如，如果不太重要的信息在显示器上闪烁，则其将使人的注意力分散，干扰对更重要的信息的关注。一些空中交通管制显示器就是这样，闪烁系统认为发生冲突的飞机信号，会吸引管制员的注意力。如果飞机真的在冲突，这将是一件好事。但是，错误的警报是常见的：当控制器已经采取行动来分离飞机或飞机已经计划在某一点转弯或爬升使它们脱离冲突时，使用高度突出的提示（闪光灯）会产生不必要的干扰，这可能导致操控员尝试处理的其他信息的态势感知能力下降。


    在许多系统中，闪烁的灯光、移动的图标和明亮的颜色被过度使用，这产生了拉斯维加斯大道现象。有如此多的信息提请注意，很难将其中任何一个处理好。大脑试图阻止所有竞争信号，以便在该过程中使用显著的认知资源来处理期望的信息。


    虽然自然世界中物体的显著性难以控制，但在大多数工程系统中，它完全可以由设计者掌控。不幸的是，在许多系统中，灯光、蜂鸣器、警报和其他信号，经常主动地引起人们的注意，或是误导，或是把他们淹没在信号中。不太重要的信息可以不经意中看起来更重要。例如，在一个飞行器显示器中围绕飞行器符号的位置绘制大的不确定性环，其位置是从低可靠性传感器数据确定的，这导致了将飞行员的注意力引向这种较不确定的信息，并且使得它看起来比基于更确定的信息显示的其他飞行器更重要，并且因此当他们实际上需要相反效果时具有更小的圆圈的非预期结果。错位的突出是系统设计中需要避免的重要态势感知“恶魔”。


    ## 6. 复杂性蠕变


    与数据超载的“恶魔”相关的是复杂性蠕变的“恶魔”。复杂性在新系统开发中泛滥，许多系统设计者通过特性升级的实践不知不觉地释放复杂性。电视、录像机甚至电话具有这么多特征，人们很难形成并保持系统如何工作的清晰的心理模型。研究表明，只有
    20% 的人能正确操作他们的录像机。在消费产品使用中，这可能导致消费者的烦恼和沮丧。在关键系统中，它可能导致悲剧的发生。例如，飞行员报告称：在理解飞机上的自动飞行管理系统正在做什么以及下一步将做什么方面，存在着重大问题。这个问题持续存在，甚至那些使用这些系统多年的飞行员老手们也无法尽善尽美。


    这个问题根源是复杂性。系统的复杂性使操作者们很难充分理解这些系统的工作原理，更别提达到人机合一的高效配合状态了。


    复杂性是一个微妙的态势感知“恶魔”。虽然它可以减弱人们获取信息的能力，但它主要是破坏他们正确解释系统所提供的信息并对未来可能发生的事情进行预测的能力（第2级和第3级态势感知）。他们不会理解情境的所有特征，一些意料之外的决策和行为，或系统程序本身的微妙之处，将足以导致它以完全不同的方式工作。应该指出的是，包括系统全部特征的心智模型若无法充分建立，则系统的提示很有可能被完全误解。


    虽然训练通常被规定为这个问题的解决方案，但现实是随着复杂性的增加，在面对不经常发生的情况时，人们在理解系统行为上更容易显得经验不足，面对这种情况，人们需要更多的训练来学习系统，而这样做将更容易忘记系统的细微差别。


    ## 7. 错误的心理模型


    心理模型是在大多数系统中建立和维护态势感知的重要机制，它们形成了一个关键的解释机制，并用于获取信息。它们告诉一个人如何组合不同的信息，如何解释信息的重要性，以及如何对未来发生的事情做出合理的预测。然而，如果使用不完全的心理模型，则可能导致糟糕的理解和预测。甚至更隐蔽地，有时错误的心理模型可能用于解释信息。例如，习惯于驾驶某种飞行器的飞行员，由于使用对于先前飞行器正确的心理模型，可能会错误地解释新飞行器的信息显示。当重要线索被误解时就会发生事故。同样，当患者被误诊时，医生可能会误解患者的重要症状。新症状将被误解以适应早期诊断，显著延迟正确的诊断和治疗。模式错误是一个特殊的例子，就是人们认为系统是在一种模式下，其实它运行在另一种模式下，从而导致他们误解信息。


    模式错误是存在多种模式的许多自动化系统中的重要关注点。例如，已知导航员误解显示的下降率信息，因为他们认为自己处于一种下降速率为英尺①/分模式，而实际上他们处于另一种模式，其中以度为单位显示。


    ① 1 英尺 =0.3048 米。


    错误的心理模型 “恶魔” 可以非常阴险，它们也称为表示错误，人们很难意识到他们是在一个错误的心里模型的基础上工作，并突破它。对于空中交通管制员的一项研究发现，即使已经有非常明显的线索，已经激活的错误心理模型在
    66% 的时间内也不会被检测和解决。人们倾向于避开那些冲突的线索去解释，以适应他们选择的心理模式，即使这种解释是牵强的，因此很难发现这些错误。这不仅导致糟糕的态势感知，还导致人们在基于冲突的信息的基础上难以检测和校正他们自己的态势感知错误。


    因此，避免导致人们使用错误的心里模型的设计是非常重要的。自动化模式的标准化有限使用是可以帮助最小化这种错误发生的关键原则的示例。


    ## 8. 人不在环路异常


    自动化引发了最终的态势感知 “恶魔”。虽然在某些情况下，自动化可以通过消除过多的 工作负载来帮助态势感知，但是在某些情况下它也会降低态势感知。许多自动化系统带来的复杂性以及模式错误，即当人们错误地认为系统处于一种模式时而实则不然，都是与自动化相关的态势感知
    “恶魔”。此外，自动化可以通过使人离开环路来破坏态势感知。在这种状态下，它们对自动化如何执行控制元件的状态产生了糟糕的态势感知。


    1987 年，一架飞机在底特律机场起飞时坠毁，导致除一人外其他所有乘客死亡。对事故的调查表明，自动起飞配置和警告系统已经失效。飞行员没有意识到他们在起飞阶段错误地配置襟翼和缝翼，并不知道自动化系统没有像预期一样支持它们。以上是由于自动化方法让人离开控制系统功能的循环，导致一个态势感知错误的例子。


    当一个自动化系统良好运行时，处于环路之外可能不是问题，但是当自动化系统失效或更频繁地处于设备因无预置处理方案导致无法处理的情况时，不在环中的操作者们往往是不能检测到问题，无法正确解释所提供的信息，并及时干预系统决策的。


    来自人类信息处理的固有限制和许多人为系统特征的不足可能破坏态势感知，传统的态势感知理论对此少有涉及。设计支持新的态势感知体系需要考虑这些态势感知问题，并尽可能避免它们。良好的设计解决方案为人类的限制提供支持，可以避免已知人类处理信息过程中的一些问题。


    ## 三、深度态势感知解密


    ### 1. 基本观点


    深度态势感知的含义是“对态势感知的感知，是一种人机智慧，既包括了人的智慧，也融合了机器的智能”，是能指+所指，既涉及事物的属性（能指、感觉），又关联它们之间的关系（所指、知觉），既能够理解事物原本之意，也能够明白弦外之音。它是在以安德斯雷为主体的态势感知（包括信息输入、处理、输出环节）基础上，加上人、机（物）、环境（自然、社会）及其相互关系的整体系统趋势分析，具有“软/硬”两种调节反馈机制；既包括自组织、自适应，也包括他组织、互适应；既包括局部的定量计算预测，也包括全局的定性算计评估，是一种具有自主、自动弥聚效应的信息修正、补偿的期望-选择-预测-控制体系。如果说视觉是由物体反光的漫射形成的，那么深度态势感知就相当于在暗室里打开开关看到事物的本原。


    从某种意义上讲，深度态势感知是为完成主题任务在特定环境下组织系统充分运用各种人的认知活动的综合体现，如目的、感觉、注意、动因、预测、自动性、运动技能、计划、模式识别、决策、动机、经验及知识的提取、存储、执行、反馈等，它既能够在信息、资源不足的情境下运转，也能够在信息、资源超载的情境下作用。


    通过实验模拟和现场调查分析，我们认为深度态势感知系统中存在着“跳蛙”现象（自动反应），即从信息输入阶段直接进入输出控制阶段（跳过了信息处理整合阶段），这主要是由于任务主题的明确、组织/个体注意力的集中和长期针对性训练的条件习惯反射所引起的，如同某个人边嚼口香糖边聊天边打伞边走路一样可以无意识地协调各种自然活动的秩序，该系统进行的是近乎完美的自动控制，而不是有意识的规则条件反应。这与《意识探秘：意识的神经生物学研究》一书中说的“当学会一件事物时，有意识地参与反而会影响效率”的说法不谋而合。与普通态势感知系统相比，它们对信息采样的样本数据会更离散一些，尤其是在感知各种刺激后的信息过滤中，表现了较强的“去伪存真、去粗取精”的能力。信息“过滤器”的基本功能是让指定的信号能比较顺利地通过，而对其他的信号发挥衰减作用，利用它可以突出有用的信号，抑制／衰减干扰、噪声信号，达到提高信噪比或选择的目的。对于每个刺激客体而言，既包括有用的信息特征，又包括冗余的其他特征，而深度态势感知系统具备了准确把握刺激客体的关键信息特征的能力（可以理解为“由小见大、窥斑知豹”的能力），所以能够形成阶跃式人工智能的快速搜索比对提炼和运筹学的优化修剪规划预测的认知能力，可以做到自动迅速地执行主题任务。对于普通态势感知系统来说，由于没有形成深度态势感知系统所具备的认知反应能力，所以觉察到的刺激客体中信息特征多且复杂，不但包括有用的信息特征，而且包括冗余的其他特征，所以信息采样量大，信息融合慢，预测规划迟缓，执行力弱。


    在有时间、任务压力的情境下，“经验丰富”的深度态势感知系统常常是基于离散的经验性思维图式／脚本认知进行决策活动（而不是基于评估），这些图式／脚本的认知决策活动是形成自动性模式（即不需要每一步都进行分析）的基础。事实上，它们是基于以前的经验积累而进行的反应和行动，而不是通过常规统计概率的方法进行决策选择（基本认知决策中的情境评估是基于图式和脚本的。图式是一类概念或事件的描述，是形成长期记忆组织的基础。在“Top-Down”信息控制处理过程中，被感知事件的信息可按照最匹配的存在思维图式进行映射；而在“Bottom-Up”信息自动处理过程中，根据被感知事件激起的思维图式调整不一致的匹配，或通过积极的搜索匹配最新变化的思维图式结构）。


    深度态势感知系统有时也要被迫对一些变化了的任务情境做有意识的分析决策（自动性模式已不能保证准确操作的精度要求），但深度态势感知系统很少把注意转移到非主题或背景因素上，这将会导致“分心”。这种现象也许与复杂的训练规则有关，因为在规则中普通态势感知系统被要求依程序执行，而规则程序设定了触发其情境认知的阈值（即遇到规定的信息被激活），而实际上，动态的情境常常会使阈值发生变化；对此，深度态势感知系统通过大量的实践和训练经验，形成了一种内隐的动态触发情境认知阈值，即遇到对自己有用的关键信息特征就被激活，而不是只激活规定的信息特征。


    一个“Top-Down”处理过程提取信息依赖于（至少受其影响）对事物特性的以前认识；一个“Bottom-Up”处理过程提取信息只与当前的刺激有关。所以，任何涉及对一个事物识别的过程都是“Top-Down”处理过程，即对于该事物已知信息的组织过程。“Top-Down”处理过程已被证实对深度知觉及视错觉有影响。“Top-Down”与“Bottom-Up”过程是可以并行处理的。


    在大多数正常情境下，态势感知系统是按“Top-Down”处理过程达到目标；而在不正常或紧急情境下，态势感知系统则可能会按“Bottom-Up”处理过程达到新的目标。无论如何，深度态势感知系统应在情境中保持主动性（前摄的，如使用前馈控制策略保持在情境变化的前面）而不是反应性（如使用反馈控制策略跟上情境的变化），这一点是很重要的。这种主动性（前摄的）策略可以通过对不正常或紧急情境下的反应训练获得。


    在真实的复杂背景下，对深度态势感知系统及技术进行整体、全面的研究，根据人-机-环境系统过程中的信息传递机理，建造精确、可靠的数学模型已成为研究者所追求的目标。人类认知的经验表明，人具有从复杂环境中搜索特定目标，并对特定目标信息进行选择处理的能力。这种搜索与选择的过程被称为注意力集中（focus
    attention）。在多批量、多目标、多任务情况下，快速有效地获取所需要的信息是人所面临的一大难题。将人的认知系统所具有的环境聚焦（environment
    focus）和自聚焦（self focus）机制应用于多模块深度态势感知技术系统的学习，根据处理任务确定注意机制的输入，使整个深度态势感知系统在注意机制的控制之下能有效地完成信息处理任务，并形成高效、准确的信息输出，有可能为上述问题的解决提供新的途径。如何建立适度规模的多模块深度态势感知技术系统是首先需要解决的问题，另外，如何控制系统各功能模块间的整合与协调也是需要解决的一个重要问题。


    通过研究，我们是这样看待深度态势感知认知技术问题的：首先，深度态势感知过程不是被动地对环境的响应，而是一种主动行为，深度态势感知系统在环境信息的刺激下，通过采集、过滤，改变态势分析策略，从动态的信息流中抽取不变性，在人、机、环境交互作用下产生近乎知觉的操作或控制；其次，深度态势感知技术中的计算是动态的、非线性的（同认知技术计算相似），通常不需要一次将所有的问题都计算清楚，而是对所需要的信息加以计算；最后，深度态势感知技术中的计算应该是自适应的，指挥控制系统的特性应该随着与外界的交互而变化。因此，深度态势感知技术中的计算应该是外界环境、装备和人的认知感知器共同作用的结果，三者缺一不可。


    研究基于人类行为特征的深度态势感知系统技术，即研究在不确定性动态环境中组织的感知及反应能力，对于社会系统中重大事变（战争、自然灾害、金融危机等）的应急指挥和组织系统、复杂工业系统中的故障快速处理、系统重构与修复、复杂环境中仿人机器人的设计与管理等问题的解决都有着重要的参考价值。


    ### 2. 意义的建构


    在深度态势感知系统中，我们的主要目的不是构建态势，而是构建起态势的意义框架，进而在众多不确定的情境下实现深层次的预测和规划。


    一般而言，“感”对应的常是碎片化的属性，“知”则是同时进行的关联（关系）建立，人的感、知过程常常是同时进行的（机的不然），而且人可以同时进行属性（物理、心理、生理等）、关系的感与知，还可以混合交叉感觉、知觉，日久就会生成某种直觉或情感，从无关到弱关、从弱关到相关、从相关到强关，甚至形成“跳蛙”现象，在这个过程中类比发挥着非常重要的作用，是把隐性默会知识转化成显性规则/概率的桥梁。根据现象学，意识最关键的是知觉，就是能觉知道周边物体和自身构成的世界。而对物体的知觉是通过自身和物体的互动经验的整合而对物体产生的控制。比如，对附近桌子上的一个苹果的知觉是可以吃，走过去可以拿在手里，可以抛起来等。


    一般认为知觉是信号输入，但事实上，计算机接收视频信号输入但是没有视觉，因为计算机没有行动能力。知觉需要和自身行动结合起来，这赋予输入信号语义，输入信号不一定导致一定的行动，必须要结合动作才有知觉。知觉的产生先经过输入信号、自身运动和环境物体协调整合，整合形成经验记忆，再遇到相关的信号时就会产生对物体的知觉（对物体可作的行动）。当然，只有知觉可能还不够，智能系统还需要有推理、思考、规划的能力。但这些能力可以在知觉平台基础上构建。


    人与机器在语言及信息的处理差异方面，主要体现在能否把表面上无关之事物相关在一起。尽管大数据时代可能会有所变化，但对机器而言，基于规则条件及概率统计的决策方式（抽象表征的提炼）与基于情感感动及顿悟冥想的判断（人类特有的）机理之间的鸿沟依然存在。


    爱因斯坦曾这样描述逻辑与想象之间的差异：“逻辑会带你从 A 点到达 B 点，想像力将把你带到任何地方（Logic will get you from A to
    B，imagination will take you everywhere）。”其实，人最大的特点就是能根据特定情境把逻辑与想象、具象与抽象进行有目的的弥聚融合。这种灵活弹性的弥散聚合机制往往与任务情境紧密相关。正如涉及词语概念时，有些哲学家坚持认为，单词的含义是世界上所存在的物理对象所固有的；而维特根斯坦则认为，单词的含义是由人们使用单词时的语境所决定的。这种现象在人的意识里也有，如欲言又止、左右为难、瞻前顾后。思想斗争的根源与不确定性有关，与人、物、情境的不确定有关，解决这种问题的关键是如何平衡，找到满意解（“碗中捞针”），而不是找到最优解（“海中捞针”）。相比之下，战胜围棋世界冠军李世石的机器程序“阿尔法狗”参数调得就很好，这种参数的平衡恰恰就是竞争冒险机制的临界线，就像太极图中阴阳鱼的分界线一般。竞争冒险行为中定性与定量调整参数之间一直有个矛盾，定性是方向性问题，而定量是精确性问题。


    对人类而言，最神秘的意识是如何产生的？这个问题一直受到学者们的关注。其中有两个主要问题，一是意识产生的基本结构，二是交互积累的经验。前者可以是生理的也可以是抽象的，是人和机器的差异；后者是人或机器的必要条件。意识是人-机-环境系统交互的产物，目前的机器理论上没有人-机-环境系统的（主动）交互，所以没有“你我他”这些参照坐标系。有人说，“当前的人工智能中没有智能，时下的知识系统中没有知识，一切都是人类跟自己玩，努力玩得似乎符合逻辑、自然、方便且容易记忆和维护。”此话固然有些偏颇，但也反映出了一定的道理，即意识是人-机-环境系统交互的产物，目前的机器理论上没有人-机-环境系统的（主动）交互，从而很难反映出各种隐含着稳定和连续意义上的某种秩序。笔者曾经和一位著名摄影家交流，他曾不无深意地给摄影人说过十句话：第一，照片拍得不够好，是因为你离生活还不够近；第二，用眼睛捕捉的镜头只能称为照片，用心灵捕捉的镜头才能叫艺术；第三，我所表达的都是真实的自我，是真正出于我的内心；第四，有时候最简单的照片是最困难的；第五，只有好照片，没有好照片的准则；第六，摄影师必须是照片的一部分；第七，我觉得影子比物体本身更吸引我；第八，名著、音乐、绘画都给我很多灵感和启发；第九，我不喜欢把摄影当作镜子只反映事实，所以在表达上留有想象空间；第十，我一生都在等待光与景物的交织，然后让魔法在相机中产生。这十句话似乎对深度态势感知中的意义建构也同样有意义。


    有时，可把数据理解或定义为人对刺激的表示或应对，即使是看见一个字，听到一个声等。没有各种刺激，智能可能无法发育、生长（不是组装），爱因斯坦说过：“单词和语言在我的思考过程中似乎不起任何作用。我思索时的物理实体是符号和图像，它们按照我的意愿可以随时地重生和组合。”语言是符号的线性化，语言也限制思维，这些许像人机智能的差异：一种记忆型（类机），一种模糊型（类人），人的优点在于可以将更大范围、更大尺度（甚至超越语言）的无关相关化，机的局限性恰在于有限的相关。例如，描述一个能在三维空间跟踪定位物体的系统，通过将位置和方向纳入一个目标的属性，系统能够推断出这些三维物体之间的关系。大数据冗余可能造成精度干扰或认知过载（信息冗余是大数据时代的自保策略），这种情

