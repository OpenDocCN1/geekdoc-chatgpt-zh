    图 5-3 游戏的一般性机理（据 Endsley）


    射，游戏的环境状态、玩家的目标是自变量，玩家的操作是因变量，而映射关系正是游戏一般机理的核心部分。它可以通过如神经网络这种技术来对自变量进行特征提取和表征，也可以直接使用自变量，利用公式计算获得输出值，进而映射到相应的动作。


    # 3. 里程碑


    自香农发表计算机象棋博弈编写程序的方案以来，游戏人工智能已经走过了 70 多个春秋，无数的科学家贡献了自己的才华和岁月，所取得的成果更是数不胜数，本文罗列了游戏人工智能的重大里程碑，意在帮助读者把握游戏人工智能的研究现状，为今后的研究方向提供启示，具体如表
    5-1 所示。


