    / 信息公司、小团队开发出令人耳目一新的颠覆性技术的可能却比较大，大公司对这些新技术所体现出的主要作用则在于收购、融合、推广、工程、应用与市场化方面。


    人工智能的发展需要大量的资本投入和技术积累，这或将导致社会各产业间、人才群体间与阶层间的发展能力、资源占有程度与社会影响力方面的极大差异。这意味着这些大型跨国公司或将成为人工智能时代的巨头企业，形成操纵全球产业结构与人才、资本、技术流向的垄断能力。如果对其缺少有效的引导、制约和监督，可能会出现人工智能技术滥用而危害社会安全，或成为资本权力的附庸而激化社会矛盾的问题。美国学者纳尔逊曾提出：“研究美国国家创新系统，必须研究防务政策，这是对美国经济、科技影响最大的两个公共政策领域之一。”另外一个公共政策是反垄断法，这个法案的目的是防止垄断，确保市场竞争。对照着看，美国防务政策可以视为确保“垄断”的公共政策：以国家安全的名义保证政府调集社会资源的正当性并保护其基本及必需的产业和部门。从根本上而言，市场社会优质发展是国家利益的保障，但是资本的逐利性和技术的潜利性往往会形成矛盾，如许多资本为了实现中短期的利益/利润回报，会不顾技术的长期成熟性开发而进行竭泽而渔，如各种新技术的资本绑架行为；或者为了市场盈利而不顾及对社会的责任和义务等，如游戏开发。总之，从中不难看出，这些资本与技术的进一步结合形成具有“超级权力”的科技巨擘对国家经济社会的影响既有正面影响，如加速产业的升级换代、促进社会的快速发展，同时又有负面影响，如形成垄断利益集团、限制更新技术的使用和发展。如何实现两者有效地扬长避短和协调发展，将是未来一道需要不断思考如何解决的经济-社会和资本-技术发展难题。


    ## 第二章


    ## 认知的奥秘：深度态势感知


    尽管人的认知方式和思维结构极为复杂，具有超凡的优越性，但是随着技术的发展，我们依然可以对人脑进行模拟。通过深度态势感知，我们既能综合展现人的认知活动，也能够产生与之不同的人机智慧；既能够在信息、资源不足的情境下运转，也能在信息、资源超载的情境下作用。


    从某种意义上说，人类文明是一个人类对世界和自己不断进行认知的过程。追根溯源，我们应该从人类历史，以及人类的知识获取方式的起源及其发展历程谈起。纵观人类最早的美索不达米亚文明（距今
    6000 多年）、古埃及文明（距今 6000 年）及其衍生出的现代西方文明的起源——古希腊文化（距今 3000 年左右），其本质反映的是人与物或者可以说是客观对象之间的关系，这是科学技术在此快速发展的文化基础；而古印度所表征的文明中常常蕴含着人与神之间的信念；时间稍晚些的古代中国文明是四大古文明中唯一较为完整地绵延至今的文明，其核心是人与人、人与环境之间的沟通交流，这可能是中华文明持续的重要原因吧！


    纵观这些人、机（物）、环境之间系统交互的过程，认知数据的产生、流通、处理、变异、卷曲、放大、衰减、消逝是无时无刻不在进行着的……如何在这一充满变量的过程中保持各种可能的稳定与连续呢？为此，人们发明了众多理论和模型，使用了许多工具和方法，试图在自然与社会的秩序中找到有效的答案和万有的规律。直至近代，16
    世纪一位天主教教士哥白尼的“日心说”让宗教把权威逐渐转让给了科学，之后数百年来，实验和逻辑重新建构了一个完全不同的时空世界，一次又一次地减轻了人们的生理负荷、脑力负荷，甚至包括精神负荷……


    随着科学思想的不断演化，技术上也取得了长足的进步，“老三论”（系统论、控制论和信息论）尚未褪色，耗散结构论、协同论、突变论“新三论”便“粉墨登场”，电子管、晶体管、集成电路还未消逝，纳米、超算机、量子通信技术更是跃跃欲试，20
    世纪四五十年代诞生的人工智能思想和技术就是在这些基础上涌现出的一个重要前沿方向。但是，由于认知机理的模糊、数学建模的不足、计算硬件的局限等，人工智能一直停留在较弱的智能状态。从目前了解到的数学、硬件等研究进展上看，短期内取得突破性进展将很难，所以如何从认知机理上打开突破口就成了很多科学家的选择。本章旨在对深度态势感知进行初步介绍与述评，以期促进该理论在国内的研究与应用。


    ### 一、深度态势感知的理论缘起


    2013 年 6 月，美国空军司令部正式任命米卡·安德斯雷（Mica R. Endsley）这位以研究态势感知而著名的女科学家为新一任美国空军首席科学家，这位
    1990 年南加利福尼亚大学工业与系统工程专业毕业的女博士和上一任美国空军首席科学家马克·梅贝里（Mark T. Maybury）都是以人机交互中的认知工程为研究方向，而在此之前，这个职位的人主攻航空航天专业或机电工程专业。这种以认知科学为专业背景任命首席科学家的局面在美军其他兵种当中也相当流行，这也许意味着，在未来的军民科技发展趋势中以硬件机构为主导的制造加工领域正悄悄地让位于以软件智慧为主题的指挥控制体系。


    无独有偶，正当世界各地的人工智能、自动化等相关专业领域研究态势感知技术之时，全球的计算机界正致力于分析上下文感知（context awareness，CA）算法，语言学领域对于自然语言处理中的语法、语义、语用等方面也非常热衷，心理学科中的情景意识也是当下讨论的热闹之处，西方哲学的主流竟也是分析哲学。分析哲学是一个哲学流派，它的方法大致可以划分为两种类型：一种是人工语言的分析方法，另一种是日常语言的分析方法。当然，认知神经科学等认知科学的主要分支目前的研究重心也在大脑意识方面，试图从大脑的结构与工作方式入手，弄清楚人的意识产生过程。这里需要说明的一点是，无论是态势感知、上下文感知还是其他，各领域追逐的目标都是一致的，即揭开真正意义上的智能的“面纱”。


    我们现在生活在一个信息日益活跃的人-机-环境（自然、社会）系统中，指挥控制系统自然就是通过人、机、环境三者之间交互及其信息的输入、处理、输出、反馈来调节正在进行的主体活动，进而减少或消除结果不确定性的过程。


    指挥控制系统的核心环节是态势感知技术，对此，米卡·安德斯雷提出态势感知模型，模型具体结构如图 2-1 所示。


    ![](img/48fbc65cfef46e8d162d2a377828f62f_34_0.png)


    图 2-1 动态决策态势感知（SA）模型（Endsley，2000）


    在该模型中，态势感知被分成三级，每一阶段都是必要但不充分地先于下一阶段，该模型沿着一个信息处理链，逐步地从环境感知到环境理解最后到预测规划，实现了从低级到高级的态势感知过程，具体为：第一级是对环境中各成分的感知，即信息的输入；第二级是对目前的情境的综合理解，即信息的处理；第三级是对随后情境的预测和规划，即信息的输出。


    一般而言，人、机、环境（自然、社会）等构成特定情境的组成成分常常会发生快速的变化，在这种快节奏的态势演变中，由于没有充分的时间和足够的信息来形成对态势的全面感知与理解，所以对未来态势的精准且定量的预测可能会大打折扣，但不会影响对未来态势的定性分析。大数据时代，对于人工智能系统而言，如何在充分厘清各组成成分及其干扰成分之间的排斥、吸引、竞争、冒险等逻辑关系的基础上，建立起基于离散规则和连续概率，甚至包括基于情感和顿悟的、反映客观态势的定性定量综合决策模型显得尤为重要。简言之，不了解数据表征关系（尤其是异构变异数据）的大数据挖掘是不可靠的，建立在这种数据挖掘上的智能预测系统也不可能是可靠的。


    另外，在智能预测系统中也时常需要面对一些管理缺陷与技术故障难以区分的问题，如何把非概念问题概念化？如何把异构问题同构化？如何把不可靠的部件组成可靠的系统？如何通过组成智能预测系统之中的前／后（刚性、柔性）反馈系统把人的失误／错误减到最小，同时把机和环境的有效性提高到最大？对此，1975
    年计算机图灵奖及 1978 年诺贝尔经济学奖得主西蒙（H.A. Simon）提出了一个聪明的对策：有限的理性，即把无限范围中的非概念、非结构化成分可以延伸成有限时空中可以操作的柔性的概念、结构化成分处理，这样就可把非线性、不确定的系统线性化、满意化处理。不追求在大海里捞一根针，而只满意在一碗水中捞针，进而把表面上看起来无关的事物联系在了一起，使智能预测变得更加智慧，同时也更容易实现落地应用。


    但是在实际工程应用中，由于各种干扰因素（主客观）及处理方法的不完善，目前态势感知理论与技术仍存在不少缺陷。


    构建和维护态势感知技术对于许多不同工作和环境中的人来说可能是一个困难的过程。飞行员们报告说，他们的大部分时间一般都花在对发生事情的心理描述的实时性与准确性上。对于许多其他领域，那些系统十分复杂且必须处理大量的实时信息。同样地，对于那些信息快速变化或难以获得信息的领域，则更是如此。


    ### 二、态势感知的敌人


    良好的态势感知十分具有挑战性，其原因可以归结为人类信息处理系统的特征和复杂领域的特征两个方面，其相互作用形成了“态势感知恶魔”。“态势感知恶魔”是在许多系统和环境中破坏静态感知的因素。为了弄明白这些“恶魔”，我们将迈出第一步，为面向态势感知的设计奠定基础。我们将讨论
    8 个主要的“恶魔”：注意的隧道效应；无法避免的记忆瓶颈；工作负荷、焦虑、疲劳和其他压力；数据过载；错位；复杂性蠕变；错误的心智模型；人不在环路异常。下面分别进行介绍。


    ### 1. 注意的隧道效应


    复杂领域中的态势感知包含对环境中多方面情境的感知。飞行员必须时刻把握他们在空间中的位置、飞行器系统的状态、湍急的气流对乘客舒适性和安全性的影响，围绕它们的其他交通工具以及空中交通管制指示和许可等。空中交通管制员必须同时监控许多不同的飞机之间的间隔，在任何一个时刻有多达
    30 架或 40 架飞机在他们的控制下。管制员还需要处理管理飞机流和飞行员请求的必要信息，并跟进管理寻求进入或离开他们的空域的飞机。一个机车司机必须监视发动机的状态、燃料状态、轨道上的其他车，以及维修人员的信号。


    成功的态势感知高度依赖于对环境不同侧面的持续处理。有时，为了执行一个或多个任务，需要同时处理多个信息片，例如，在驾驶的同时监控路况和为了了解交通状况监控电台信息。这就是所谓的注意分享。人们在注意分享方面面临着诸多瓶颈，特别是在单一形式下，如视觉或声音，因此它只能发生在有限的范围内。


    由于不能同时访问所有所需的信息，人们还建立了系统的扫描或信息采样策略，以确保他们一直掌握着事件的最新信息。一次对所需信息的扫描可能发生在数秒或几分钟内，如飞行员和空中交通管制员的例子。也可能发生在几个小时内，如发电厂电力管制员在一天内需要记录数百个不同的系统的状态。


    在所有这些情况下，以及系统任何级别的复杂性下，良好的态势感知高度依赖于不同的信息源之间的注意切换。不幸的是，人们往往会陷入一种被称为注意力变窄或隧道效应的现象。当他们屈服于注意的隧道效应时，他们的注意就被锁定在他们所试图处理的环境的某种特定的方面或特征之中，将有意或无意放弃他们的扫描行为。在这种情况下，在他们集中注意力的环境部分，他们的态势感知可能非常好，但是在他们放弃注意的部分将很快变得过时。


    在许多情况下，人们相信有限的集中是好的，因为在他们的意识中，他们所关注的侧面是最重要的。在其他情况下，他们只专注于某些信息而忘记恢复其信息扫描的行为。这两种情况都可能导致态势感知的严重缺失。事实是，对广泛现状的高层次理解，是能够知道某些因素确实比其他人更重要的一个先决条件。否则，在态势感知方面关键的因素往往是被忽视的。


    注意的隧道效应最著名的例子是，美国东方航空公司的飞机坠毁在佛罗里达大沼泽地，机上人员全部遇难。所有三名机组人员专注于指示灯的问题，忽视了监控飞机的飞行路径，其结果是，没有正确设置自动驾驶。


    虽然后果并不总是那么严重，但这个问题实际上是相当普遍的。最常见的类型的态势感知故障是，所有所需的信息都得到了展现，却没有受到监控态势的人的重视。在研究飞机和空中交通管制事故的过程中，琼斯和恩兹利发现所有态势感知误差
    35% 属于这个范畴。虽然各种因素会导致这个问题，但最经常发生的情况是，人们只是简单地专注于其他任务相关的信息，而失去了对情境的重要方面的态势感知。


    注意的隧道效应不只是航空领域的问题，在许多其他的领域都必须提防它。从手机到电脑导航系统的使用，随着更多的技术应用在汽车上，一个重要的问题是注意隧道正在培育其丑陋的开端。一项研究表明，开车时使用手机的风险是不使用手机的四倍，它的出现和手机是否手持没有关系。问题不在于物理干扰的作用，而在于注意力分散。频繁地在这些设备和驾驶任务之间进行注意切换，是一个挑战。同样，更多的技术使用，如头盔式显示器，可能会导致士兵注意力变窄的问题，他们专注于显示器上，而忽视了他们周围的是什么。未来的设计，不论是在这种领域还是其他领域，需要明确地考虑这种注意的隧道效应的影响，并采取措施，以抵消它。


    ### 2. 无法避免的记忆瓶颈


    人类记忆仍然是态势感知的中心部分。在这里，我们不是指长期记忆，也就是从遥远的过去的记忆的信息或事件的能力，而是短期或工作记忆。这可以被认为是一个中央存储库，具有把当前情况汇集到一起和把所发生的事情加工成一幅有意义的图片的功能（由长期记忆中形成的知识和当前的信息输入共同构成）。这种记忆存储本质上是有限的。米勒正式探讨了这个问题，人们的工作记忆空间可以容纳大约七块加上或减去两块（相关报道）信息。这对态势感知有很重要的含义。虽然我们可以提升对应的能力来在记忆中存储相当多的态势信息，通过使用一种叫作“信息块化”的处理过程，本质上工作记忆是一个存储信息的有限的缓存。态势感知失败可能会导致在该缓冲区空间不足，随着时间的推移，缓冲区的自然地衰减。有了经验，人们就学会了凝聚或组合多个信息成为更紧凑和易于记住的块。例如，空中交通管制员不需要跟踪
    30 架不同的飞机，但也许是五或六个不同组的相关的飞机，这样认知更易于管理。随着时间的推移，丰富的环境心理模型的建立有助于提高人们形成有意义的信息块的能力，从而更高效地存储。


    即使如此，信息也不会无限期地停留在这个内存中。除非人们积极工作，以保持其存在（如重复或重复看见的信息），否则它会迅速从记忆中消失。抽象信息发生这种损失可能会很快，差不多
    20～30 秒（如电话号码或航空器呼号），如果连接到其他信息或精神长期记忆模型，信息可能仍然可以保留一段时间。


    对于态势感知，记忆起着至关重要的作用。情境的许多特征可能需要驻留在内存中。当人在环境中扫描不同的信息时，必须记住以前访问的信息，并与新的信息相结合。也必须记住听觉信息，因为它通常不能像视觉显示那样可以重新访问。在许多系统中，鉴于态势感知要求的信息的复杂性和容量，内存限制会造成一个显著的态势感知“瓶颈”这件事并不奇怪。


    在许多情况下，严重依赖于一个人的记忆表现的系统可能会发生严重的错误。一次重大的飞机事故发生在洛杉矶国际机场，一个工作负担很重的空中交通管制员忘记将一架飞机移动到一个跑道，并指定另一架飞机降落在同一跑道上。她看不到跑道，不得不依靠记忆来描述发生在那里的事情。


    在这样的情况下，一个人很容易会发生失误。一个更合理的处理方法是归咎于系统的设计，需要过分依赖于一个人的记忆。令人惊讶的是，许多系统都是这样做的。飞行员必须经常记住复杂的空中交通控制指令，司机试图记住口头指示，机器将记住的容忍限度和在系统发生的其他行为，军事指挥官必须吸收和记住不同的士兵在战场上的哪个位置。在这些情况下，态势感知是非常痛苦的，难怪记忆失误必然会发生。


    ### 3. 工作负荷、焦虑、疲劳和其他压力


    在许多环境中，态势感知需要接受情境的考验。这些压力可以采取几种形式。在许多情况下，人们可能受到相当大的压力或焦虑，这可以发生在战场上或办公室。可以理解的是，当自己的幸福受到威胁时，压力或焦虑可能是一个问题，但也包括自尊、职业发展或高度后果事件（如生命受到威胁）等因素。其他重要的心理压力因素包括时间压力、精神工作量和不确定性。


    压力源也可以是物理性质的。许多环境具有高水平的噪声或振动、过热或过冷或者光线不足。身体疲劳和对抗一个人的昼夜节律也可能是许多人面临的主要问题，如长途飞机的飞行员通常长时间和在夜间飞行。


    这些压力源中的每一个都可以显著消耗态势感知。首先，它们可以通过占用它的一部分来减少已经受限的工作记忆。更少的认知资源可以用来处理和保持记忆中的信息，这些信息是形成态势感知的要素。由于依赖工作记忆可能是一个问题，所以诸如这些的压力因素只会加剧问题。其次，人们在压力下有效地收集信息的能力较差。他们可能较少关注外围信息，在扫描信息时变得更加混乱，并且更可能屈服于注意的隧道效应。人们更有可能在不考虑所有可用信息（称为过早关闭）的情况下做出决定。压力源会使接收信息的整个过程不太系统化并且更容易出错，进而破坏态势感知。


    显然，这些类型的压力源可以以许多方式破坏态势感知，并且应该在可行的情况下避免或设计出操作情况。不幸的是，这并不总是可能的。例如，一定程度的个人风险将永远发生。在这些情况下，设计系统支持高效地获取所需信息以维持高水平态势感知更为重要。


    ### 4. 数据过载


    数据过载是许多领域中会面临的一个重要问题。数据变化的快速速率产生了对信息摄取的需要，其迅速超过人的感觉和认知系统提供需求的能力。由于人们每次只能接收和处理有限数量的信息，所以可能发生态势感知的显著缺失。


    数据过载对态势感知产生了重大挑战。如果存在比可处理的更多的听觉或视觉消息，那么个人的态势感知将快速过时或包含空白，这些空白可能是形成所发生的精神图像的重要障碍。

