    # 第五章

    探索人与机的“爱恨情仇”


    人类文明是一个人类对世界和自己不断认知 的过程。随着时代的发展，人和物之间的关系也在不断改 变，就像是人和机器之间的关系，随着人工智能的发 展逐渐进入一个新的时代。在智能时代，我们和人工
    智能的交互方式究竟会有怎样的未来，值得我们不断 地进行探索。'
  - '[PAGE 79]


    <!-- no content -->'
  - '[PAGE 80]


    人与机的关系在不断地融合，科学家们在努力构建人机融合智能这种能够利用两方面优势的智能体。在智能时代，不仅人、机、环境的关系在不断变化，人机交互的方式也在不断地发生变化。就像人与人之间的爱恨情仇一样，人们不断地完善之前的人机交互模式，又不断地推翻以前的交互方式，建立起更加符合认知和技术发展要求的新模式。如何将人工智能融入人机交互的方方面面，如何让人机交互方式更加适应智能的发展，如何在人机交互中让智能发展出自主和情感，我们需要不懈地探索。


    # 一、现代人与机


    人机交互的研究始于第二次世界大战时期，当时主要研究因为各种不合理的设计导致的飞机故障，开始主要应用于航空航天领域，后来逐渐扩展到社会经济的方方面面。人机交互中有一个比较热点的领域——态势感知，其概念由曾任美国空军首席科学家的女科学家米卡·安德斯雷提出。态势感知或情景意识的提出，对整个人机交互领域产生了巨大的影响。米卡·安德斯雷对态势感知的定义是，在一定的时间和空间内，对环境中的各组成成分，进行感知、理解，进而预测这些成分的随后变化状况。可以看出，在整个人类的发展过程中，智能科学是一个交叉学科，涉及心理学、计算机科学、神经科学、哲学、语言学等，这些学科构成一个完整的学科体系，可以总称为认知科学。


    当前人-机-环境系统工程发展迅猛，它是研究在人、装备和环境系统之间实现最优匹配的一个领域，涉及信息的输入、处理、输出、控制、反馈。人-机-环境系统的整体设计及其优化等方面的研究，是为了实现整个系统高效、安全、健康、和谐、敏捷地运转等。


    当前在这一领域的研究中出现了很多分支，如人机交互、普适计算、情感计算等，并产生了许多相应的关键技术，如多模感知、上下文感知、情感智能、环境智能、认知智能、多模界面、感性界面，这'
  - '[PAGE 81]


    些技术用来实现一个最基本的目标，即自然的人机交互。在自然的人机交互中非常重要的一点是数据。所有智能的产生与刺激都和数据密切相关：刺激就是人感知到的外部的映射；数据是机器接触到的外部的输入，通过两者产生相应的融合、理解，进而进行相应的反应和规划。


    数据空间对计算机起着非常重要的作用，研究数据的多指向性是当前人机领域的一个难点和瓶颈。同时数据的多指向性，是人机相互区别的一个最重要的方面，人可以理解一个数据的多指向、多含义；机器则不然，机器有规范和规则，只能从一个角度来看待这个数据。


    当前人工智能的发展有三大主要标志：“深蓝”“沃森”“阿尔法狗”，这三个系统都和数据有关，都是在处理过去的大量的数据、规则、规划。但是这三个顶级的系统都有一个很重要的問題，或者说是一个瓶颈问题，就是它只能“得形忘意”，而不能“得意忘形”。真正的人的智能需要临机决策，而不是像计算机及当前弱人工智能按照套路去运算。


    # 二、人与机的学说：人机工程


    # 1. 何为人机工程学


    人机工程学是研究人-机-环境系统中人、机、环境三大要素之间的关系，是为解决系统中人的效能、健康问题提供理论与方法的科学。


    人机工程学是研究在设计人机系统时如何加入人的特性和能力，以及人如何受机器、作业和环境条件的限制。除此之外，人机工程学还研究人的训练、人机系统的设计和开发，以及同人机系统有关的生物学或医学问题。对于这些研究，在美国有人称之为人类工程学（human
    engineering）、人因工程学（human factors engineering）；在欧洲有人称之为人类工程学（ergonomics）、生物工艺学、工程心理学、应用实验心理学、人体状态学等；日本称之为人间工学；我国目前除使用上述名称外，亦有工效学、宜人学、人体工程学、人机学、运行工程学、机构设备利用学、人机控制学等叫法。人体工程不同的命名已经充分体现了该学科是“人体科学”与“工程技术”的结合。'
  - '[PAGE 82]


    实际上，这一学科就是人体科学、环境科学不断向工程科学渗透和交叉的产物，是以人体科学中的人类学、生物学、心理学、卫生学、解剖学、生物力学、人体测量学等为“一肢”，以环境科学中的环境保护学、环境医学、环境卫生学、环境心理学、环境监测技术等学科为“另一肢”，而以技术科学中的工业设计、工业经济、系统工程、交通工程、企业管理等学科为“躯干”，形象地构成本学科的体系。从人机工程学的构成体系来看，其就是一门综合性的边缘学科，其研究的领域是多方面的，大致包括电话、电传、计算机控制台、数据处理系统、高速公路信号、汽车、航空、航海、现代化医院、环境保护、教育、互联网等，人机工程学甚至可用于大规模社会系统，因此可以说，人机工程学与国民经济的各个部门都有密切的关系。


    # 2. 人机工程学的国内外发展情况


    人机工程技术是 21 世纪信息领域需要解决的重大课题。美国面向 21 世纪的信息技术行动计划中的基础研究内容包括 4 项：软件、人机交互、网络、高性能计算机。其中，人机交互技术在信息技术中被列为是与软件技术和计算机技术等并列的六项国家关键技术之一，并被认为是“对于计算机工业有着突出的重要性，对其他工业也很重要”的一项技术。美国国防部的关键技术计划不仅把人机交互列为软件技术发展的重要内容之一，而且专门添加了与软件技术并列的人机界面。日本也提出了
    FPIEND 21 计划（Future Personalized Information Environment Development），其目标就是要开发
    21 世纪个性化的信息环境。我国从“十五”规划到“十三五”规划等各大科技计划均将人机交互列为重要内容。


    在中国，人机工程学的研究从 20 世纪 30 年代开始，就有少量和零星的工作开展，但系统和深入地开展则是在“文化大革命”以后。1980 年 4 月，全国人类工效学标准化技术委员会成立，统一规划、研究和审议全国有关人类工效学的基础标准的制定。1984
    年，国防科学技术工业委员会成立了国家军用人-机-环境系统工程标准化技术委员会。这两个技术委员会的建立，有力地推动了人机工程学研究的发展。此后在 1989 年又成立了中国人类工效学学会，继而在
    1995'
  - '[PAGE 83]


    年9月创刊了学会会刊《人类工效学》季刊。20世纪90年代初，北京航空航天大学首先建立了我国该专业的第一个博士学科点，随后南京航空航天大学、西北工业大学、北京理工大学、北京大学医学部等也建立了相应的专业点。进入21世纪以来，随着我国科技和经济的发展，人们对工作条件、生活品质的要求逐步提高，对产品的用户体验及人机工程特性也日益重视。也正是由这种新的需求取向，一些企业把“以人为本”“人体工学”的设计作为其产品的卖点。


    # 3. 当前人机工程技术研究的发展趋势


    # （1）人机界面技术研究


    在人机工程学中，人机界面是一个重要的研究分支，是指人机间相互施加影响的区域，凡是参与人机信息交流的一切领域都属于人机界面。可将设计界面定义为设计中所面对、分析的一切信息交互的总和，反映着人-物之间的关系。


    广义的人机界面是指在人机系统模型中，人与机之间存在一个相互作用的“面”，称为人-机界面，人与机之间的信息交流和控制活动都发生在人机界面上。机器的各种显示都“作用”于人，实现机-人信息传递；人通过视觉、听觉等感官接受来自机器的信息，经过脑的加工、决策，作出反应，实现人-机的信息传递。人机界面的设计直接关系人机关系的合理性。研究人机界面主要针对两个问题，即显示和控制。


    狭义的人机界面是指计算机系统中的人机界面（human-computer interface）。人机界面又称人机接口、用户界面（user interface）、人机交互（human-computer
    interaction），是计算机科学中最年轻的分支科学之一。它是计算机科学和认知心理学两大科学相结合的产物，同时吸收了语言学、人机工程学和社会学等科学的研究成果。通过30余年的发展，已经成为一门以研究用户及其与计算机的关系为特征的主要学科之一。尤其是20世纪80年代以来，随着软件工程学的迅速发展和新一代计算机技术研究的推动，人机界面设计和开发已成为国际计算机界最为活跃的研究方向。随着计算机技术、网络技术的发展，人机界面学的发展将会朝着以下几个方向发展。'
  - '[PAGE 84]


    第一，高科技化。信息技术的革命，带来了计算机业的巨大变革。计算机越来越趋向平面化、超薄型化；便捷式、袖珍型电脑的应用，大大改变了办公模式；输入方式已经由单一的键盘、鼠标输入，朝着多通道输入化发展，追踪球、触摸屏、光笔、语音输入等竞相登场；多媒体技术、虚拟现实及强有力的视觉工作站提供真实、动态的影像和刺激灵感的用户界面，在计算机系统中，各显其能，产品的造型设计更加丰富多彩，变化纷呈。


    第二，自然化。早期的人机界面很简单，人机对话都是机器语言。由于硬件技术的发展以及计算机图形学、软件工程、人工智能、窗口系统等软件技术的进步，图形用户界面（graphic
    user interface）、直观操作（direct manipulation）、“所见即所得”（what you see is what you get），以及虚拟现实、增强现实等交互原理和方法相继产生并得到了广泛应用，取代了旧有“键入命令”式的操作方式，推动人机界面自然化向前迈进了一大步。然而，人们不仅仅满足于通过屏幕显示或打印输出信息，而是进一步要求能够通过视觉、听觉、嗅觉、触觉以及形体、手势或口令，更自然地“进入”环境空间中去，形成人机直接对话，从而取得身临其境的体验。


    第三，人性化。现代设计的风格已经从功能主义逐步走向了多元化和人性化。今天的消费者纷纷要求表现自我意识、个人风格和审美情趣，反映在设计上亦使产品越来越丰富、细化，体现出一种人情味和个性。一方面，要求产品功能齐全、高效，适于人操作使用；另一方面，要求满足人们的审美和认知精神需要。现代电脑设计已经摆脱了旧有的四方壳纯机器味的“淡漠”，尖锐的棱角变得圆滑，单一的米色不再一统天下；机器更加紧凑、完美，被赋予了人的感情；软界面中颜色、图标的使用，屏幕布局的条理性，软件操作间的连贯性和共通性，都充分考虑了人的因素，使之操作更简单、友好。目前，人机交互正朝着从精确向模糊、从单通道向多通道以及从二维交互向三维交互的转变，发展用户与计算机之间快捷、低耗的多通道界面。


    第四，和谐的人机环境。今后计算机应能听、能看、能说，而且应能“善解人意”，即理解和适应人的情绪或心情。未来计算机的发'
  - '[PAGE 85]


    展是以人为中心，必须使计算机易用好用，使人通过语言、文字、图像、手势、表情等自然方式与计算机打交道。


    国外一些大公司（如国际商业机器公司、微软）等在中国国内建立的研究院大多以人机接口为主要研究任务之一，尤其是在汉语语音、汉字识别等方面，如汉语识别与自然语言理解、虚拟现实技术、文字识别、手势识别、表情识别等。我们应该在人机交互方式技术竞争中，特别是在人机界面的优化设计、视觉-目标拾取认知技术等方面取得主动权。


    # （2）视觉-目标拾取认知技术研究


    眼睛是心灵的窗户，通过这个窗口我们可以了解人的许多心理活动。人类的信息加工在很大程度上依赖于视觉，来自外界的信息有 80%～90% 是通过人的眼睛获得的。眼球运动即眼动的各种模式一直与人的心理变化相关，对于眼动的研究被认为是视觉信息加工研究中最有效的手段，吸引了神经科学、心理学、工效学、计算机科学、临床医学、运动学等领域专家的普遍兴趣，其研究成果在工业、军事、商业等领域得到广泛应用。


    在视觉-目标拾取认知技术科学研究中最重要的两个问题就是人对信息流的获取（输入）和信息流的控制（输出）。据研究，人对外部信息流的获取有 80% 是通过视觉获得的，由于视觉的重要性，有关视觉-眼动系统的研究始终是科学界关注的问题之一，其中有关人眼的搜索机制早就引起了神经病学家、眼科学家、生理学家、解剖学家以及工程师们的极大兴趣。特别是近年来，世界各国对视觉-眼动系统的研究越来越多，美国国家航空航天局（NASA）、哈佛大学、麻省理工学院、剑桥大学、牛津大学等著名科研机构或大学都设有专门的视觉-眼动系统研究部门。而人对外部信息流的控制主要是通过手、脚、口等效应器官进行的，其中研究人的目标拾取运动这一基本、重要的作业运动形式，可以为人机界面系统的设计、评估、操作提供量化的理论依据和理论指导。因此，该研究具有很好的工程应用价值，并一直是工效学、心理学、生理学等学科的研究热点。近年来，随着计算机及人机界面技术的发展，眼动仪在人机界面设计领域'
  - '[PAGE 86]


    受到高度重视。美国空军最早在新的人机交互设计中运用视觉追踪技术，最初的主要目的是要把视觉追踪用于战斗机座舱的设计。这一领域的深入研究表明，视觉追踪技术不但可以用于战斗机座舱的设计，还可以运用视觉追踪技术，把人眼作为计算机的一种输入工具，形成视觉输入人机界面。另外，有研究机构将眼动测量用于对虚拟现实的研究，有效地解决了大的视场和高精度的图像显示之间的矛盾。随着高性能摄像机的出现和图像处理技术的发展，眼动仪将朝着高精度、高实用性和低成本的方向发展。


    由于人是人-机-环境系统的主体，因此，只有深刻认识人在系统中的作业特性，才能研制出最大限度地发挥人及人机系统的整体能力的优质高效系统。人的目标拾取运动作为人的一种输出形式，具有速度-精确度的折中关系，即目标拾取运动的完成时间与命中目标的精确度成反比。这种特性广泛存在于人的各种输出和其他控制系统中。所以，如何建立人的目标拾取运动过程中实用、精确的速度-精确度折中关系理论模型就成了研究的主要任务。


    # 4. 人机工程与人因工程之异同


    人机工程学和人因工程学二者可能是两个独立的学科领域，连词“和”就能支持这样的解释。如果人机工程学和人因工程学是同义的，那为什么不使用一个名称？几年前，在美国，这个领域中的专业组织决定将其名称中加入“人机工程学”。他们还决定添加连词“和”而非用破折号或斜线将名称分离，因为破折号或斜线这种形式更经常地被使用来暗示同义。


    许多专业人士（虽然不是每个人）认为术语“人机工程学”和“人因工程学”是同义的。对于一些人来说，人机工程学涉及生理，而人因工程学涉及感知和认知。人机工程学由研究人与人之间和其周围工作环境（环境的定义很广泛，包括机器、工具、周围的环境、任务等）之间的相互作用演变而来。人因工程学的使用主要集中在北美，它被从事一些“脑力活动”心理过程工作（研究、教学、实验）的人所使用。世界的其余大多数人却更多地将人机工程学这个术语用于描述“脑力活动”和“体力活动”的总活动，在生物力学领域和物'
  - '[PAGE 87]


    理场所设计领域中更强调后者。在美国，术语“人机工程学”通常被用来暗示“颈部以下”的体力活动，随着术语“人机工程学”被越来越多地使用，它的名称已趋于一致。


    人机工程学（ergonomics）中的“ergo”是指工作，因此这个领域的范围可以被视为限于此前缀。如何定义“工作”是至关重要的，很多人可能会将“工作”限定为与就业相关的活动，这将不会包括休闲活动领域。但是，“工作”可以解释得很广泛，因为它涉及一般的为完成一个目标而物理能源损耗的过程。因此，其中人类大多数的活动（及他们的身体进程）可以被合理地认为是在工作，因此，ergo与工作相联系起来了。通过进行高频术语分析，发现人因工程学和人机工程学（HF/E）涉及了安全、高效的人机系统的研究和生产的工程设计中的应用。使用相同的分析方法，登普西（Dempsey）等人于2000年提出了以下的定义：人机工程学是“以提高人体机能为目的的人机系统的设计和工程”。


    2000年8月，国际人类工程学协会执行理事会通过了人因工程学的定义：“人因工程学是与人类和一个系统的其他元素相互理解有关的科学学科，是一个应用理论、原则、数据和方法来设计达到优化人类福祉和整体系统性能的学科。”虽然其定义是相当冗长的，但它传达了许多与人机工程学领域的不同想法。


    技术是一个塑造人类行为、功能强大的单一力量。很多时候，关于是谁使用它或受它影响，技术是“盲目”的。一个人数相对较小但处于增长的专业人士群在寻求一种扩大的技术系统与用户之间的协调。随着技术变得复杂，在专业人士群得到一种协同的关系需要更大的努力。未来几年内，这种努力对于获得真正的技术进步将是一种至关重要的途径。为了更有效地实现其目标，这个领域需要一个清晰、简洁、明确和实用的词来形容我们的努力。我们猜想，伴随着身体和认知能力的修饰，人机工程学能扮演好它的角色。


    在现代人机系统中，作业人员是在特定环境中操作和管理复杂系统与各种数字化设备，当人在这种环境中工作时，既要靠眼睛来观察环境，又要靠细致的注视来完成精确的控制动作。通过人机工程技术'
  - '[PAGE 88]


    分析，就可以看到人在操作时如何分配注意力、体力，同时了解仪表、屏幕以及外视景如何设计和合理分配才能获得最好的人机交互，才能既减轻操作人员的工作负荷又避免出错，还能切实提高人机工效。这对于计算机系统、自动化控制、交通运输、工业设计、军事领域以及社会系统中的重大事变（战争、自然灾害、金融危机等）的应急指挥和组织系统、复杂工业系统中的故障快速处理、系统重构与修复、复杂环境中仿人机器人的设计与制造等问题的解决都有着重要的参考价值。


    # 三、自主才能造就真正的人工智能


    未来的人机交互及人工智能系统有明确的发展方向，包含四个方面：主动的推荐、自主的学习、自然的进化、自身的免疫。在这四个方面，自主是非常重要的一个概念。


    美军的“深绿”智能指挥系统的目的是借鉴“深蓝”系统的思想，将其映射到军事指挥和控制领域。它通过指挥员助手、水晶球和闪电战三个模块，整合出当前的和过去的战场态势，以及实时有效的指挥员辅助决策。这个系统中最重要的是自主性和主动推荐。自主和主动是人工智能或智能科学中一个很重要的研究热点和难点。


    自主应该包括以下四个方面：第一，自主应具有记忆的功能，而不是存储，记忆是灵活的，能够通过相关无关的事物产生直觉，而存储则无法出现直觉，它只是符合逻辑的东西。第二，自主应具有选择性。选择性是单向性的，即
    A 选择 B。第三，自主应具有匹配性。匹配和选择最大的区别就是匹配是双向性的，A 可以选择 B，B 也可以选择 A。第四，自主应可以控制。没有控制和反馈，自主就很难建立起来。


    未来的人机交互及人工智能系统，至少是人-机-环境系统的自主耦合，形成了一个认知智能。认知的意义就是信息的流动过程，包括输入、处理、输出和反馈。


    人工智能的重要发展方向是人机混合智能。强人工智能、通用人工智能及类人人工智能，这些方向实现还相对较遥远，当前发展更好'
  md: '

    或控制；其次，人工智能技术中的计算是动态的、非线性的（同认知技术计算相似），通常不需要一次将所有的问题都计算清楚，而是对所需要的信息加以计算；最后，人工智能技术中的计算应该是自适应的，人机系统的特性应该随着与外界的交互而变化。因此，人工智能技术中的计算应该是外界环境、机器和人的认知感知器共同作用的结果，三者缺一不可。


    研究基于人类行为特征的人工智能系统技术，即研究在不确定性动态环境中组织的感知及反应能力，对于社会系统中重大事变（战争、自然灾害、金融危机等）的应急指挥和组织系统、复杂工业系统中的故障快速处理、系统重构与修复、复杂环境中仿人机器人的设计与制造等问题的解决都有着重要的参考价值。


    鉴于研究人工智能系统涉及面较广，极易产生非线性、随机性、不确定性等系统特征，导致系统建模研究时常面临着较大困难，在之前的研究中，多种有价值的理论模型被提出并用于描述表征、学习、理解、自主、预测等系统行为。但这些模型在对人工智能的实质及影响因素方面考虑得还不够全面，也缺乏对模型可用性的实验验证，所以本章重点就是针对人-机-环境系统的实质、人工智能的影响因素这两个关键问题进行探讨，追根溯源，以期早日实现高效、安全、宜人、可靠的强人工智能系统。


    ## 第五章 探索人与机的“爱恨情仇”


    人类文明是一个人类对世界和自己不断认知的过程。随着时代的发展，人和物之间的关系也在不断改变，就像是人和机器之间的关系，随着人工智能的发展逐渐进入一个新的时代。在智能时代，我们和人工智能的交互方式究竟会有怎样的未来，值得我们不断地进行探索。


    人与机的关系在不断地融合，科学家们在努力构建人机融合智能这种能够利用两方面优势的智能体。在智能时代，不仅人、机、环境的关系在不断变化，人机交互的方式也在不断地发生变化。就像人与人之间的爱恨情仇一样，人们不断地完善之前的人机交互模式，又不断地推翻以前的交互方式，建立起更加符合认知和技术发展要求的新模式。如何将人工智能融入人机交互的方方面面，如何让人机交互方式更加适应智能的发展，如何在人机交互中让智能发展出自主和情感，我们需要不懈地探索。


    ### 一、现代人与机


    人机交互的研究始于第二次世界大战时期，当时主要研究因为各种不合理的设计导致的飞机故障，开始主要应用于航空航天领域，后来逐渐扩展到社会经济的方方面面。人机交互中有一个比较热点的领域——态势感知，其概念由曾任美国空军首席科学家的女科学家米卡·安德斯雷提出。态势感知或情景意识的提出，对整个人机交互领域产生了巨大的影响。米卡·安德斯雷对态势感知的定义是，在一定的时间和空间内，对环境中的各组成成分，进行感知、理解，进而预测这些成分的随后变化状况。可以看出，在整个人类的发展过程中，智能科学是一个交叉学科，涉及心理学、计算机科学、神经科学、哲学、语言学等，这些学科构成一个完整的学科体系，可以总称为认知科学。


    当前人-机-环境系统工程发展迅猛，它是研究在人、装备和环境系统之间实现最优匹配的一个领域，涉及信息的输入、处理、输出、控制、反馈。人-机-环境系统的整体设计及其优化等方面的研究，是为了实现整个系统高效、安全、健康、和谐、敏捷地运转等。


    当前在这一领域的研究中出现了很多分支，如人机交互、普适计算、情感计算等，并产生了许多相应的关键技术，如多模感知、上下文感知、情感智能、环境智能、认知智能、多模界面、感性界面，这些技术用来实现一个最基本的目标，即自然的人机交互。在自然的人机交互中非常重要的一点是数据。所有智能的产生与刺激都和数据密切相关：刺激就是人感知到的外部的映射；数据是机器接触到的外部的输入，通过两者产生相应的融合、理解，进而进行相应的反应和规划。


    数据空间对计算机起着非常重要的作用，研究数据的多指向性是当前人机领域的一个难点和瓶颈。同时数据的多指向性，是人机相互区别的一个最重要的方面，人可以理解一个数据的多指向、多含义；机器则不然，机器有规范和规则，只能从一个角度来看待这个数据。


    当前人工智能的发展有三大主要标志：“深蓝”“沃森”“阿尔法狗”，这三个系统都和数据有关，都是在处理过去的大量的数据、规则、规划。但是这三个顶级的系统都有一个很重要的問題，或者说是一个瓶颈问题，就是它只能“得形忘意”，而不能“得意忘形”。真正的人的智能需要临机决策，而不是像计算机及当前弱人工智能按照套路去运算。


    ### 二、人与机的学说：人机工程


    ### 1. 何为人机工程学


    人机工程学是研究人-机-环境系统中人、机、环境三大要素之间的关系，是为解决系统中人的效能、健康问题提供理论与方法的科学。


    人机工程学是研究在设计人机系统时如何加入人的特性和能力，以及人如何受机器、作业和环境条件的限制。除此之外，人机工程学还研究人的训练、人机系统的设计和开发，以及同人机系统有关的生物学或医学问题。对于这些研究，在美国有人称之为人类工程学（human
    engineering）、人因工程学（human factors engineering）；在欧洲有人称之为人类工程学（ergonomics）、生物工艺学、工程心理学、应用实验心理学、人体状态学等；日本称之为人间工学；我国目前除使用上述名称外，亦有工效学、宜人学、人体工程学、人机学、运行工程学、机构设备利用学、人机控制学等叫法。人机工程不同的命名已经充分体现了该学科是“人体科学”与“工程技术”的结合。


    实际上，这一学科就是人体科学、环境科学不断向工程科学渗透和交叉的产物，是以人体科学中的人类学、生物学、心理学、卫生学、解剖学、生物力学、人体测量学等为“一肢”，以环境科学中的环境保护学、环境医学、环境卫生学、环境心理学、环境监测技术等学科为“另一肢”，而以技术科学中的工业设计、工业经济、系统工程、交通工程、企业管理等学科为“躯干”，形象地构成本学科的体系。从人机工程学的构成体系来看，其就是一门综合性的边缘学科，其研究的领域是多方面的，大致包括电话、电传、计算机控制台、数据处理系统、高速公路信号、汽车、航空、航海、现代化医院、环境保护、教育、互联网等，人机工程学甚至可用于大规模社会系统，因此可以说，人机工程学与国民经济的各个部门都有密切的关系。


    ### 2. 人机工程学的国内外发展情况


    人机工程技术是 21 世纪信息领域需要解决的重大课题。美国面向 21 世纪的信息技术行动计划中的基础研究内容包括 4 项：软件、人机交互、网络、高性能计算机。其中，人机交互技术在信息技术中被列为是与软件技术和计算机技术等并列的六项国家关键技术之一，并被认为是“对于计算机工业有着突出的重要性，对其他工业也很重要”的一项技术。美国国防部的关键技术计划不仅把人机交互列为软件技术发展的重要内容之一，而且专门添加了与软件技术并列的人机界面。日本也提出了
    FRIEND 21 计划（Future Personalized Information Environment Development），其目标就是要开发
    21 世纪个性化的信息环境。我国从“十五”规划到“十三五”规划等各大科技计划均将人机交互列为重要内容。


    在中国，人机工程学的研究从 20 世纪 30 年代开始，就有少量和零星的工作开展，但系统和深入地开展则是在“文化大革命”以后。1980 年 4 月，全国人类工效学标准化技术委员会成立，统一规划、研究和审议全国有关人类工效学的基础标准的制定。1984
    年，国防科学技术工业委员会成立了国家军用人-机-环境系统工程标准化技术委员会。这两个技术委员会的建立，有力地推动了人机工程学研究的发展。此后在 1989 年又成立了中国人类工效学学会，继而在
    1995 年9月创刊了学会会刊《人类工效学》季刊。20世纪90年代初，北京航空航天大学首先建立了我国该专业的第一个博士学科点，随后南京航空航天大学、西北工业大学、北京理工大学、北京大学医学部等也建立了相应的专业点。进入21世纪以来，随着我国科技和经济的发展，人们对工作条件、生活品质的要求逐步提高，对产品的用户体验及人机工程特性也日益重视。也正是由这种新的需求取向，一些企业把“以人为本”“人体工学”的设计作为其产品的卖点。


    ### 3. 当前人机工程技术研究的发展趋势


    ### （1）人机界面技术研究


    在人机工程学中，人机界面是一个重要的研究分支，是指人机间相互施加影响的区域，凡是参与人机信息交流的一切领域都属于人机界面。可将设计界面定义为设计中所面对、分析的一切信息交互的总和，反映着人-物之间的关系。


    广义的人机界面是指在人机系统模型中，人与机之间存在一个相互作用的“面”，称为人-机界面，人与机之间的信息交流和控制活动都发生在人机界面上。机器的各种显示都“作用”于人，实现机-人信息传递；人通过视觉、听觉等感官接受来自机器的信息，经过脑的加工、决策，作出反应，实现人-机的信息传递。人机界面的设计直接关系人机关系的合理性。研究人机界面主要针对两个问题，即显示和控制。


    狭义的人机界面是指计算机系统中的人机界面（human-computer interface）。人机界面又称人机接口、用户界面（user interface）、人机交互（human-computer
    interaction），是计算机科学中最年轻的分支科学之一。它是计算机科学和认知心理学两大科学相结合的产物，同时吸收了语言学、人机工程学和社会学等科学的研究成果。通过30余年的发展，已经成为一门以研究用户及其与计算机的关系为特征的主要学科之一。尤其是20世纪80年代以来，随着软件工程学的迅速发展和新一代计算机技术研究的推动，人机界面设计和开发已成为国际计算机界最为活跃的研究方向。随着计算机技术、网络技术的发展，人机界面学的发展将会朝着以下几个方向发展。


    第一，高科技化。信息技术的革命，带来了计算机业的巨大变革。计算机越来越趋向平面化、超薄型化；便捷式、袖珍型电脑的应用，大大改变了办公模式；输入方式已经由单一的键盘、鼠标输入，朝着多通道输入化发展，追踪球、触摸屏、光笔、语音输入等竞相登场；多媒体技术、虚拟现实及强有力的视觉工作站提供真实、动态的影像和刺激灵感的用户界面，在计算机系统中，各显其能，产品的造型设计更加丰富多彩，变化纷呈。


    第二，自然化。早期的人机界面很简单，人机对话都是机器语言。由于硬件技术的发展以及计算机图形学、软件工程、人工智能、窗口系统等软件技术的进步，图形用户界面（graphic
    user interface）、直观操作（direct manipulation）、“所见即所得”（what you see is what you get），以及虚拟现实、增强现实等交互原理和方法相继产生并得到了广泛应用，取代了旧有“键入命令”式的操作方式，推动人机界面自然化向前迈进了一大步。然而，人们不仅仅满足于通过屏幕显示或打印输出信息，而是进一步要求能够通过视觉、听觉、嗅觉、触觉以及形体、手势或口令，更自然地“进入”环境空间中去，形成人机直接对话，从而取得身临其境的体验。


    第三，人性化。现代设计的风格已经从功能主义逐步走向了多元化和人性化。今天的消费者纷纷要求表现自我意识、个人风格和审美情趣，反映在设计上亦使产品越来越丰富、细化，体现出一种人情味和个性。一方面，要求产品功能齐全、高效，适于人操作使用；另一方面，要求满足人们的审美和认知精神需要。现代电脑设计已经摆脱了旧有的四方壳纯机器味的“淡漠”，尖锐的棱角变得圆滑，单一的米色不再一统天下；机器更加紧凑、完美，被赋予了人的感情；软界面中颜色、图标的使用，屏幕布局的条理性，软件操作间的连贯性和共通性，都充分考虑了人的因素，使之操作更简单、友好。目前，人机交互正朝着从精确向模糊、从单通道向多通道以及从二维交互向三维交互的转变，发展用户与计算机之间快捷、低耗的多通道界面。


    第四，和谐的人机环境。今后计算机应能听、能看、能说，而且应能“善解人意”，即理解和适应人的情绪或心情。未来计算机的发展是以人为中心，必须使计算机易用好用，使人通过语言、文字、图像、手势、表情等自然方式与计算机打交道。


    国外一些大公司（如国际商业机器公司、微软）等在中国国内建立的研究院大多以人机接口为主要研究任务之一，尤其是在汉语语音、汉字识别等方面，如汉语识别与自然语言理解、虚拟现实技术、文字识别、手势识别、表情识别等。我们应该在人机交互方式技术竞争中，特别是在人机界面的优化设计、视觉-目标拾取认知技术等方面取得主动权。


    ### （2）视觉-目标拾取认知技术研究


    眼睛是心灵的窗户，通过这个窗口我们可以了解人的许多心理活动。人类的信息加工在很大程度上依赖于视觉，来自外界的信息有 80%～90% 是通过人的眼睛获得的。眼球运动即眼动的各种模式一直与人的心理变化相关，对于眼动的研究被认为是视觉信息加工研究中最有效的手段，吸引了神经科学、心理学、工效学、计算机科学、临床医学、运动学等领域专家的普遍兴趣，其研究成果在工业、军事、商业等领域得到广泛应用。


    在视觉-目标拾取认知技术科学研究中最重要的两个问题就是人对信息流的获取（输入）和信息流的控制（输出）。据研究，人对外部信息流的获取有 80% 是通过视觉获得的，由于视觉的重要性，有关视觉-眼动系统的研究始终是科学界关注的问题之一，其中有关人眼的搜索机制早就引起了神经病学家、眼科学家、生理学家、解剖学家以及工程师们的极大兴趣。特别是近年来，世界各国对视觉-眼动系统的研究越来越多，美国国家航空航天局（NASA）、哈佛大学、麻省理工学院、剑桥大学、牛津大学等著名科研机构或大学都设有专门的视觉-眼动系统研究部门。而人对外部信息流的控制主要是通过手、脚、口等效应器官进行的，其中研究人的目标拾取运动这一基本、重要的作业运动形式，可以为人机界面系统的设计、评估、操作提供量化的理论依据和理论指导。因此，该研究具有很好的工程应用价值，并一直是工效学、心理学、生理学等学科的研究热点。近年来，随着计算机及人机界面技术的发展，眼动仪在人机界面设计领域受到高度重视。美国空军最早在新的人机交互设计中运用视觉追踪技术，最初的主要目的是要把视觉追踪用于战斗机座舱的设计。这一领域的深入研究表明，视觉追踪技术不但可以用于战斗机座舱的设计，还可以运用视觉追踪技术，把人眼作为计算机的一种输入工具，形成视觉输入人机界面。另外，有研究机构将眼动测量用于对虚拟现实的研究，有效地解决了大的视场和高精度的图像显示之间的矛盾。随着高性能摄像机的出现和图像处理技术的发展，眼动仪将朝着高精度、高实用性和低成本的方向发展。


    由于人是人-机-环境系统的主体，因此，只有深刻认识人在系统中的作业特性，才能研制出最大限度地发挥人及人机系统的整体能力的优质高效系统。人的目标拾取运动作为人的一种输出形式，具有速度-精确度的折中关系，即目标拾取运动的完成时间与命中目标的精确度成反比。这种特性广泛存在于人的各种输出和其他控制系统中。所以，如何建立人的目标拾取运动过程中实用、精确的速度-精确度折中关系理论模型就成了研究的主要任务。


    ### 4. 人机工程与人因工程之异同


    人机工程学和人因工程学二者可能是两个独立的学科领域，连词“和”就能支持这样的解释。如果人机工程学和人因工程学是同义的，那为什么不使用一个名称？几年前，在美国，这个领域中的专业组织决定将其名称中加入“人机工程学”。他们还决定添加连词“和”而非用破折号或斜线将名称分离，因为破折号或斜线这种形式更经常地被使用来暗示同义。


    许多专业人士（虽然不是每个人）认为术语“人机工程学”和“人因工程学”是同义的。对于一些人来说，人机工程学涉及生理，而人因工程学涉及感知和认知。人机工程学由研究人与人之间和其周围工作环境（环境的定义很广泛，包括机器、工具、周围的环境、任务等）之间的相互作用演变而来。人因工程学的使用主要集中在北美，它被从事一些“脑力活动”心理过程工作（研究、教学、实验）的人所使用。世界的其余大多数人却更多地将人机工程学这个术语用于描述“脑力活动”和“体力活动”的总活动，在生物力学领域和物理场所设计领域中更强调后者。在美国，术语“人机工程学”通常被用来暗示“颈部以下”的体力活动，随着术语“人机工程学”被越来越多地使用，它的名称已趋于一致。


    人机工程学（ergonomics）中的“ergo”是指工作，因此这个领域的范围可以被视为限于此前缀。如何定义“工作”是至关重要的，很多人可能会将“工作”限定为与就业相关的活动，这将不会包括休闲活动领域。但是，“工作”可以解释得很广泛，因为它涉及一般的为完成一个目标而物理能源损耗的过程。因此，其中人类大多数的活动（及他们的身体进程）可以被合理地认为是在工作，因此，ergo与工作相联系起来了。通过进行高频术语分析，发现人因工程学和人机工程学（HF/E）涉及了安全、高效的人机系统的研究和生产的工程设计中的应用。使用相同的分析方法，登普西（Dempsey）等人于2000年提出了以下的定义：人机工程学是“以提高人体机能为目的的人机系统的设计和工程”。


    2000年8月，国际人类工程学协会执行理事会通过了人因工程学的定义：“人因工程学是与人类和一个系统的其他元素相互理解有关的科学学科，是一个应用理论、原则、数据和方法来设计达到优化人类福祉和整体系统性能的学科。”虽然其定义是相当冗长的，但它传达了许多与人机工程学领域的不同想法。


    技术是一个塑造人类行为、功能强大的单一力量。很多时候，关于是谁使用它或受它影响，技术是“盲目”的。一个人数相对较小但处于增长的专业人士群在寻求一种扩大的技术系统与用户之间的协调。随着技术变得复杂，在专业人士群得到一种协同的关系需要更大的努力。未来几年内，这种努力对于获得真正的技术进步将是一种至关重要的途径。为了更有效地实现其目标，这个领域需要一个清晰、简洁、明确和实用的词来形容我们的努力。我们猜想，伴随着身体和认知能力的修饰，人机工程学能扮演好它的角色。


    在现代人机系统中，作业人员是在特定环境中操作和管理复杂系统与各种数字化设备，当人在这种环境中工作时，既要靠眼睛来观察环境，又要靠细致的注视来完成精确的控制动作。通过人机工程技术分析，就可以看到人在操作时如何分配注意力、体力，同时了解仪表、屏幕以及外视景如何设计和合理分配才能获得最好的人机交互，才能既减轻操作人员的工作负荷又避免出错，还能切实提高人机工效。这对于计算机系统、自动化控制、交通运输、工业设计、军事领域以及社会系统中的重大事变（战争、自然灾害、金融危机等）的应急指挥和组织系统、复杂工业系统中的故障快速处理、系统重构与修复、复杂环境中仿人机器人的设计与制造等问题的解决都有着重要的参考价值。


    ### 三、自主才能造就真正的人工智能


    未来的人机交互及人工智能系统有明确的发展方向，包含四个方面：主动的推荐、自主的学习、自然的进化、自身的免疫。在这四个方面，自主是非常重要的一个概念。


    美军的“深绿”智能指挥系统的目的是借鉴“深蓝”系统的思想，将其映射到军事指挥和控制领域。它通过指挥员助手、水晶球和闪电战三个模块，整合出当前的和过去的战场态势，以及实时有效的指挥员辅助决策。这个系统中最重要的是自主性和主动推荐。自主和主动是人工智能或智能科学中一个很重要的研究热点和难点。


    自主应该包括以下四个方面：第一，自主应具有记忆的功能，而不是存储，记忆是灵活的，能够通过相关无关的事物产生直觉，而存储则无法出现直觉，它只是符合逻辑的东西。第二，自主应具有选择性。选择性是单向性的，即
    A 选择 B。第三，自主应具有匹配性。匹配和选择最大的区别就是匹配是双向性的，A 可以选择 B，B 也可以选择 A。第四，自主应可以控制。没有控制和反馈，自主就很难建立起来。


    未来的人机交互及人工智能系统，至少是人-机-环境系统的自主耦合，形成了一个认知智能。认知的意义就是信息的流动过程，包括输入、处理、输出和反馈。


    人工智能的重要发展方向是人机混合智能。强人工智能、通用人工智能及类人人工智能，这些方向实现还相对较遥远，当前发展更好

