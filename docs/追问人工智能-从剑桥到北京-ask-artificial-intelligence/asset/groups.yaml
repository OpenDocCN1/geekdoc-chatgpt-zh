    ## 前 言


    一个地方不在大小，关键看有无灵气，剑桥就是这样一个神奇的地方，不但有山有水，还有剑有桥。那里的山其实就是一个小土坡，一个罗马人的兵营城堡（camp castle）遗址，但站在那里可以俯瞰整个剑桥的景色，让人久久不愿离开。那里的水就是流淌了数千年的康河（River
    Cam），不深不宽，流过几座著名学院的石桥、木桥、铁桥（bridge），山水由桥相连，“cam+bridge”，自然就构成了剑桥（Cambridge）。有山有水有桥的地方多了，为什么就此处那么有名呢？原因是这里有剑，还不是罗马人的剑，而是英国人的剑，英国人用这把锋利的剑为人类开辟了一个新的世界，认识到了宇宙和人类的秘密，本书就是试图发现发现这些秘密的秘密，同时也试图延续这些发现，让那棵苹果树在肥沃的东方土地上不断地开花结果，生生不息，绵绵不断，进而铸剑建桥，使得东西方取长补短，相得益彰……


    本书是笔者 2012 年 10 月～ 2013 年 10 月在剑桥大学访学时的所看所感所思所悟，结合科学哲学、艺术宗教等方面的观察思考；回国后针对起源于剑桥的人机交互技术、智能科学历史渊源，进行深入细致的梳理和分析，并结合自己正在进行中的人机融合智能研究展开本质性探讨和思考，比如在自主系统、机器学习、深度态势感知、人一机一环境系统、智能哲学、人机交互、军事智能、机器人、智能传播等方面进行了总结与反思，初步勾勒出了人工智能未来发展的趋势和变化。这些思考有的与剑桥有关，有的表面上虽看不出有直接关系，但也有某种内在的联系，可谓弦外有音、言外存意吧！总之，写作本书的目的实在是单纯：师夷长技以治己！正应了那句歌词所写的：我和我的祖国，一刻也不能分割……


    刘 伟

    2019 年 5 月于北京


