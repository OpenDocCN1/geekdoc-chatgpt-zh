    （2）学生学会两个一位数的加法

    （3）学生能够列举美国内战的三个原因 |


    总之，对目标的分类虽然不能直接告诉老师什么是值得教的，但是可以帮助教师把标准转化为共同的语言，以便与他们个人希望达成的目标相比较，通过呈现多种可能性的考虑，为指导课程建议提供某种观点。


    从知识维度分类，知识可以分为事实性知识、概念性知识、程序性知识和反省认知知识。


    +   1. 事实性知识


    事实性知识包括专家在自己的学科交谈、理解和系统组织时所使用思维的基本元素，把它们从一种情景运用于另一种情景很少或完全不需要变化。事实性知识包括基本元素。如果学生需要知晓某个学科或解决其中的任何问题，他们必须知道这些基本元素。事实性知识通常是一些与具体事物相联系的符号或符号串，它们传递重要信息，而'
  - '[PAGE 125]


    且大多数事实性知识以相对抽象的形式出现，包括术语知识、具体细节和要素知识。


    术语知识包括特殊言语的和非言语的符号（如词、数字、标记、图画），是学科的基本语言——专家用于表达他所知的东西的速记，如字母表知识、科学术语知识（分子符号标志、原子内粒子名称）、用于表示词的正确发音的符号知识。


    具体细节和要素知识指事件、地点、人物、时间、信息源等知识，包括非常精确和具体的信息，如事件的具体日期或现象的准确数量。它也可能包括大概的信息，如事件出现的时期或大量现象出现的一般顺序。与只能在一定的背景中才可知的事实相比，可以将具体事实看作独立和分散的元素。


    # 2. 概念性知识


    概念性知识涉及分类、类目和它们两者或多者之间的关系——较为复杂的和有组织的知识形式，包括图式、心理模型或者在不同心理学模型中或明或暗的理论。


    分类和类目的知识这个亚类包括特殊类目、类别、部分和排列，它们用于不同题材中。每一题材（或教材）都有一套类目，不但可以用于发现新成分，而且可以用于处理已发现的新成分。类别和类目不同于术语和事实之处是：它们在两个和多个成分之间建立了联系，如句子成分（如名词、动词、形容词）、不同种类的心理问题的知识、各种类型文学的知识。


    另外一个是原理和概括的知识，原理和概括倾向于对学术性学科起支配作用，并用于该领域的现象和解决问题。原理和概括把大量具体事实和事件组合起来，既描述这些具体细节之间的过程和相互关系，也描述分类和类别之间的关系，如物理学基本定律的知识、支配基本算术运算原理（如交换率）的知识、关于特殊文化主要概括的知识。


    还有理论、模型和机构的知识，包括原理、概括及其组合成相互联系的知识，它们对复杂的现象、问题或题材呈现一种清晰、完整和系统的观点，如国会总体结构的知识、地球板块论的知识、基因模型'
  - '[PAGE 126]


    的知识、作为化学理论基础和化学原理之间相互关系的知识。


    # 3. 程序性知识


    程序性知识一般是指如何做什麼，研究技能、算法、技术、方法的标准。包括：具体学科的技能与算法的知识、具体学科的技术和方法的知识和决定何时运用适当程序的标准的知识。具体学科的技能与算法的知识可以表达为一系列步骤，在总体上是我们所知的程序，如用于水彩绘画的技能的知识、解方程各种算法的知识。具体学科的技术和方法的知识与通常导致最终固定结果的具体技能和算法不同，有些程序并不导致预先决定的单一解答或答案，如适合社会科学的研究方法的知识、科学家用于寻找问题解答和技术的知识、各种文学批评方法的知识。决定何时运用适当程序的标准的知识除了知道与专门课题有关的程序外，也希望学生知道何时运用它们，如决定用哪种方法去解代数方程式的标准的知识、决定要写儿童文章中的哪一类（如说明文、议论文）的标准的知识。


    # 4. 反省认知知识


    反省认知知识指一般认知知识和有关自己的认知的意识与知识，也指个人对自身的意识和知识，其中包括策略性知识、情境性和条件性的知识在内的关于认知任务的知识和自我知识。策略性知识是有关于学习思维和解决问题的一般策略的知识，如各种记忆术策略的知识、像释义和写概要这样各种精加工策略的知识。除了各种策略知识外，个人还积累了有关认知任务的知识。换言之，他们在何时发展和如何适当运用这些策略知识，如简单记忆任务（如记忆电话号码）可能只需要复述的知识，像写概要和释义这样的精加工策略能导致较深刻理解的知识。自我知识包括与学习和认知有关的个人优缺点，如知道自己在某些领域有知识的积累但在另一些领域缺乏知识、知道自己在某些情景中倾向于依赖某类认知“工具”（策略）、个人完成某一任务的目标的知识、个人对某一任务兴趣的知识。


    所有像分类学这样的框架都是对现实的抽象，这种简化是为了促进对潜在条理性的感知。这个框架也不例外。正如东西好吃的证据在于食用的过程，希望对知识的学习进行分类总结能够帮助研究机器学'
  - '[PAGE 127]


    习相关算法的专家进一步研究知识的构成与习得。


    # 三、机器知识解析


    理查德·萨顿反对传统人工构建知识的方法，比如知识表示或手动构建的启发式函数，他认为痛苦的教训是基于历史的观察：第一，人工智能研究人员常常试图将知识构建到他们的智能体中；第二，从短期来看，这总是有帮助的，而且对研究人员来说是个满意的，但是从长远来看，它会停滞不前，甚至会阻碍进一步的进展；第三，通过基于搜索和学习的缩放计算的相反方法，可能会最终取得突破性的进展。


    # 1. 元知识的概念


    目前学术界对元知识还没有一个严格的概念。通常来说，元知识就是“关于知识的知识”，可用来描述一类知识或知识集合所包含的内容、基本结构和一般特征。没有元知识，人们就无法描述知识、使用知识和认识知识。在自动控制与人工智能等系统领域中，一般把使用和控制该系统领域知识的知识称为元知识。元知识不是领域知识，不能解决具体知识领域问题，而是关于各领域知识的性质、结构、功能、特点、规律、组成与使用的知识，是管理、控制和使用领域知识的知识。


    元知识是思想和意识的核心，如果没有掌握元知识，就不能学习和认知基本的知识，元知识对于人们认知系统的建立起着重要作用。人工智能和深度学习领域研究各种各样的智能系统，自主学习机制均是以模拟人脑思维活动为目的，没有学习元知识的能力的智能系统起码不能算是一个智能系统。


    # 2. 知识的分类


    布鲁姆在学习目标分类学方面进行了开创性工作，他将学习目标分为认知、情感和动作技能三大领域。在认知领域，其认知教育目标分类学将教育目标分为知识、理解、应用、分析、综合、评价六个类别。'
  - '[PAGE 128]


    布鲁姆的认知目标分类诞生几十年来，对其的修订工作一直没有停过。以加涅的学习结果分类、安德森的产生式理论以及以安德森为首的团队进行的布鲁姆教育目标分类认知修订版最为著名。


    # 3. 加涅的学习结果分类


    加涅将可能的学习结果分为五类，即陈述性知识、智慧技能、认知策略、态度和动作技能（表 6-2），每一种分类又可以分为不同的亚类。


    # 表 6-2 加涅的学习结果类型


    | 类型 | 定义 |

    |---|---|

    | 陈述性知识 | 要求学习者逐字逐句地记忆、解释或者从事实、名单、姓名中总结或组织信息。陈述性知识有时被描述成是“知道什么” |

    | 智慧技能 | 智慧技能的结果是学习和培训情境中的主要学习目标。智慧技能最重要的是将规则应用于之前没有遇到的例子中，也称为程序性知识，描述为“怎么做” |

    | 认知策略 | 学生用认知策略来管理自身的学习，有时称为学习策略或者“学习如何学习”。认知策略支持其他领域的学习 |

    | 态度 | 态度是一种使学习者倾向于选择某种行为方式的心理状态。加涅将态度描述为认知、情感和行为相互作用的结果 |

    | 动作技能 | 以流畅和精确定时为特征的肌肉运动调节就是动作技能 |


    陈述性知识是指可以用言语表达的信息，陈述性知识是回答“是什么”的问题。智慧技能是人们按照一定的方式方法做事的能力，是“怎么做”的知识，如应用规则与原理解决确定性的问题。认知策略是指个体自主学习、记忆和思维活动的较高层次的智慧技能。


    # 4. 修订的布鲁姆教育目标认知分类


    以课程理论与教育研究专家安德森为首的一个专家小组经过 5 年的工作，于 2001 年公布了原分类学的修订版。本文基于此种分类方式对不同类型知识的认知过程分别进行分析，试图找出虚拟维修训练中元知识的认知规律依据。


    布鲁姆教育目标分类学修订版与以前版本最大的不同是将教育目标分成两个维度，一个是认知过程维度，另一个是知识维度。认知过程维度仍分为六大类，但第一类的知识改为记忆，保留了理解、应用、分析和评价，增加了创造。将旧版中的知识单独划出来作为一个'
  - '[PAGE 129]


    新的维度。知识维度将知识分为事实性知识、概念性知识、程序性知识和元认知知识。


    以认知过程维度为横轴，以知识维度为纵轴，就形成了认知目标二维分类模型。不同的知识维度对应不同的认知过程，由此形成了不同的学习和训练目标以及训练方法、训练策略。


    在总结以上专家对于知识的分类方式后，这里将目前最权威的修订的布鲁姆教育目标认知分类学作为元知识的分类方式。


    # （1）事实性知识


    事实性知识的研究基础。事实性知识是学习者在学习某一专业时必须掌握的基本元素，包括时间、地点、人物、事件，对应装备虚拟维修训练，如装备的技术性能、基本技术参数等。事实性知识可能以独立元素或点滴信息存在，被认为在本质上和其自身是有某种价值的。


    事实性知识的一般过程。对于事实性知识，在知识呈现情景阶段，通过对呈现的知识考察可发现事实性知识呈现的离散性特点。在学习过程情景阶段，通过对学习时交互方式的考察可以发现认知过程以被动接收为主的特点。事实性知识的认知过程以记忆为主。


    事实性知识有如下特点：①以陈述性的知识为主；②认知内容没有认知中的高级分析加工或加工量很小，信息不存在认知困难，认知任务主要在于信息的量；③认知过程是离散的；④认知过程以被动的视听接收为主。


    事实性知识的分类。事实性知识可分为术语知识、具体细节和元素知识。术语知识包括特殊言语和非言语的符号（如词、数字、标记、图画）。每一个专业都有其特有的标识和符号表示方式，它们是一个人掌握这一学科的基础。掌握专业的术语知识，同一个专业的人就可以快速交流，短时间内实现思想的碰撞，更有利于擦出新的火花。掌握术语知识可以方便人们快速记忆一些东西，为将来学习更加深刻的内容打下坚实基础。具体细节和元素知识指时间、地点、人物、事件等知识。它可能包括非常具体的信息，如在某一时刻打开哪一个开关或按钮；也可能是大概的信息，如事件出现的时期或大量现'
  - '[PAGE 130]


    象出现的一般顺序。与只能在一定的背景中才可知的事实相比，可以将具体事实看作独立的和分散的元素。


    # （2）概念性知识


    概念性知识是指一个整体结构中各个要素之间的关系，就是这个关系表达了某一专业的知识是如何形成的，各个要素之间是如何互相影响以如何组成一个完整的系统的。将概括的知识按照意义的方式加以概括总结，用以体现某些问题、现象的内在联系。概念性知识的一般过程是从记忆到理解的过程。其有如下特点：以陈述性的抽象知识为主；需要对认知内容加以理解；记忆与理解相互作用形成认知。概念性知识有三个亚类：类别与分类的知识，原理与概括的知识，理论、模式与结构的知识。


    类别与分类的知识包括特殊类目、类别、部分和排列。当题材（或教材）发展时，学习该材料的人发现，开发出一些类别和类目使之能将这些类别和类目用于结构化和系统化的现象，是很有好处的。同术语和具体事实相比，这类知识是比较一般的和抽象的。类别与分类的知识是发展某一个学术性学科的重要方面。信息适当分类和经验进入适当类目乃是学习和发展的经典指标。而且新近关于概念变化和理解的研究表明，信息的错误分类进入不适当类目可以限制学生的学习。


    原理与概括的知识是由分类和类目构成的。这个亚类抽象地概括出人们见到的各种现象，并且将这些现象抽象成知识。这些抽象知识对于描述某种现象、解释这种现象出现的原因、预测事件的发展趋势，并根据预测结果采取相应的行动具有重大的价值。原理与概括的知识，就是从大量的事实和事件中，抽象和概括出这些事实的核心，并且分析这些核心的内在联系和之间的相互作用，以及如何构成整个事实或事件的整体。


    理论、模式与结构的知识包括原理、概括及其组合成相互联系的知识，这个亚类侧重于将原理和概括以某种方式相联系，从而形成理论、模式或结构。


    学科具有不同研究范式和认识论，学生应该知道从概念上加工和'
  - '[PAGE 131]


    组织教材的不同方式和在该教材中的研究领域。


    # （3）程序性知识


    程序性知识是“如何做事的知识”，如何思考及如何解决问题，在遇到问题时，不仅要想到如何去解决问题，同时要知道在什么样的场景下，使用什么样的方式去解决什么样的问题。


    程序性知识不仅包括基本的由记忆到理解的一般认知过程，还包括理解之后的应用和分析。


    程序性知识有如下特点：①认知内容综合性强，需要经过高级分析加工进行理解；②对情景依赖性高，认知任务主要在于正确把握当前情景并做出合理判断；③认知过程是一个交互的过程，需要主动参与，是一个不断反复的过程；④认知过程是一个连续的整体，实时性要求高。


    程序性知识有三个亚类：具体学科技能和算法的知识、具体学科技巧和方法的知识、确定何时运用适当程序的知识。


    如上所述，程序性知识可以表达为一系列步骤，在总体上是我们所知的程序。有时这些步骤的顺序是不变的；有时需做出决策，决定先做什么，然后再做什么；相似地，有时其结果是固定的（只有单一预定的答案），有时答案不定。


    与通常最终导致固定结果的具体技能和算法不同，有些程序并不导致预先决定的单一解答或答案。例如，我们以某种先后有序的方式遵循一般科学方法去设计某一研究，但实验设计的结果依据情景的因素可能会有很大差异。程序性知识的这一亚类与其他亚类相比，结果是较为开放的和不固定的。


    具体学科技能和算法的知识主要是意见一致的结果或学科规范，而不是更为直接地来自观察、试验或发现的知识。决定何时运用适当程序的标准知识是指除了知道与专门课题有关的程序外，也希望人们知道何时运用它们，后者涉及过去运用它们的方式。这些知识几乎是历史的或百科全书式的。


    这一亚类更多地涉及人们对于当前情况的情景认知能力，首先要对当前所处的状态做一个判断，然后将判断所得到的信息与已知的相'
  - '[PAGE 132]


    关程序性知识做匹配，最后做出选择，决定在什么样的时间和空间，以及各种复杂条件下，适用什么样的程序，最后通过对人们用定律解决问题的能力进行评定。


    # （4）元认知知识


    元认知知识一般指关于认知的知识，也指个体对于自身情况是否有足够的了解，并且能够做出正确的判断，包括了解自己认知活动中的优势与不足，以及采用什么样的一般策略去发现必要的信息。


    元认知知识的认知过程是在事实性知识、概念性知识、程序性知识的基础上，逐渐递进的过程。由最初事实性知识的记忆，到概念性知识的理解，再到程序性知识的应用、分析，元认知知识在这个基础上，增加了评价和创造的过程。


    元认知知识有如下特点：①认知难度大，要求高；②认知的形成可以作用于设计阶段以改善学习训练效果。


    元认知知识有如下三个亚类：策略知识、关于认知任务的知识、自我知识。


    策略知识是有关于学习、思考和解决问题的一般策略的知识。这个亚类中的策略可以跨越不同的任务和教材运用，而不仅仅对某一学科领域中的某种任务最有用，如用于解二次方程式和欧姆定律。


    除了各种策略知识之外，个人还积累了有关认知任务的知识。在传统元认知知识区分中，弗拉维尔把下列知识纳入元认知知识：不同认知任务可能有难度较大的，也有比较简单的，根据难度的不同，可能需要不同策略。回忆任务需要个体积极搜寻和提取适当信息，而再认任务只需要个体在几种选择中做出决定和选择正确的或最适当的答案。


    弗拉维尔提出，除策略知识和关于认知任务的知识之外，自我知识也是一种重要的元认知知识。专家的一个标志是他们对自己不知道的东西很清晰，所以他们具有发现所需要的和适当的信息的一般策略。个人对自我知识深度和广度的意识是自我知识的一个非常重要的方面，他们对自己的实际知识和能力没有夸大和虚假的印象，他们知道自己知道什么和不知道什么。'
