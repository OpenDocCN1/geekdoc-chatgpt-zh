    # 第三章

    探索人机未来：人机融合智能


    “话说天下大势，分久必合，合久必分”，自然科学中的诸多学科之大势也莫不如次。在人类经历了数百年的学科精细分化之后，随着人工智能的快速发展，许多学科正在慢慢交叉融合起来。在经历了三次起伏后（即
    20 世纪 70 年代后期对数学定理证明非万能的清醒、90 年代后期对专家系统与五代机的失望、2006 年深度学习掀起了新一轮的浪潮），人们狂热的希望逐渐踏实了很多，目光也慢慢地从科幻转移到了一个崭新而又富有活力的领域：人机融合智能。'
  - '[PAGE 57]


    <!-- no content -->'
  - '[PAGE 58]


    深度态势感知作为认知领域的研究重点，其中就提到了人的智慧与机的智能统一问题。它立足于认知领域，参考人的态势感知方式，构建具有人机智慧的新的认知方式。这揭示了未来智能发展的方向，即人与机器的智慧融合——人机融合智能。从当前人工智能发展中的问题和局限我们可以推导出，人机融合智能才是当今智能时代的最佳解决方案。


    # 一、人工智能的考验


    从历史上看，人工智能大概分三大门派，一是以模仿大脑皮质神经网络及神经网络间的连接机制与学习算法的联结主义（connectionism），主要表现为深度学习方法，即用多隐层的处理结构处理各种大数据；二是以模仿人或生物个体、群体控制行为功能及感知-动作型控制系统的行为主义（actionism），主要表现为具有奖惩控制机制的强化学习方法，即通过行为增强或减弱的反馈来实现输出规划的表征；三是以物理符号系统（即符号操作系统）具有产生智能行为的充分必要条件假设和有限理性原理为代表的符号主义（symbolicism），主要表现为知识图谱应用体系，即用模拟大脑的逻辑结构来加工处理各种信息和知识。正是由于这三种人工智能派别的取长补短，再结合蒙特卡罗算法（两种随机算法中的一种，如果问题要求在有限采样内，必须给出一个解，但不要求是最优解，那就用蒙特卡罗算法；反之，如果问题要求必须给出最优解，但对采样没有限制，那就用拉斯维加斯算法），使得特定领域的人工智能系统超过人类的智能成为可能，如国际商业机器公司的“沃森”问答系统和
    Google DeepMind 的“阿尔法狗”围棋系统等。尽管这些人工智能系统取得了骄人的绩效，但仍有不少不足之处，而且有可能会产生很大的隐患和危险。


    首先，分析一下让人工智能在当下炙手可热的联结主义。当前的人工智能热度不减，其主要原因是 2006 年辛顿提出的深度学习方法大大提高了图像识别、语音识别等方面的效率，并在无人驾驶、“智'
  - '[PAGE 59]


    慧+” 某些产业中切实体现出助力作用。然而，任何一种算法都有其不完备性，深度学习算法也不例外。该方法的局限性和不足之处在于：不可微分，弱监督学习（样本分布偏移大、新类别多、属性退化严重、目标多样），开放动态环境下该方法效果较差，计算收敛性不好。另外，相对于其他机器学习方法，使用深度学习生成的模型非常难以解释。这些模型可能有许多层和上千个节点，单独解释每一个节点是不可能的任务。数据科学家通过度量它们的预测结果来评估深度学习模型，但模型架构本身是个“黑盒”，它有可能会让你在不知不觉间失去“发现错误”的机会。再者，如今的深度学习技术还有另一个问题，它需要大量的数据作为训练基础，而训练所得的结果却难以应用到其他问题上。如何在各种现实情境任务中恰如其分地解决这些问题，就需要结合其他的方法取长补短、协调配合。


    其次，行为主义中的增强学习的优点是能够根据交互作用中的得失进行学习绩效的累积，与人类真实的学习机制相似。该方法最主要的缺点是把人的行为过程看得太过简单，实验中往往只是测量简单的奖惩反馈过程，有些结论不能迁移到现实生活中，所以往往外部效度不高。还有，行为主义貌似研究可以观察的行为，但是由于它的主张过于极端，不研究心理的内部结构和过程，否定意识的重要性，进而将意识与行为对立起来，进而限制了人工智能的纵深发展。


