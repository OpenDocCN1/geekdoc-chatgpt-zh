    ### （3）游戏的一般性机理


    从人类和计算机的游戏机理，我们可以总结出游戏玩家的一般性机理，如图 5-3 所示：可以将游戏玩家看作一个态势感知过程，接收原始数据作为输入，输出动作序列。其中，在内部进行态势觉察产生低级语义、态势理解形成高级认知、态势预测估计将来的态势，并根据未来态势进行游戏的威胁评估，再根据已有的经验和规则，在目标和动机的驱动下产生行动方案，从而指导游戏向更有利于玩家的方向进行，最后进入下一个循环序列。


    游戏的一般性机理还可以看作从一个“状态”到“动作”的映射，游戏的环境状态、玩家的目标是自变量，玩家的操作是因变量，而映射关系正是游戏一般机理的核心部分。它可以通过如神经网络这种技术来对自变量进行特征提取和表征，也可以直接使用自变量，利用公式计算获得输出值，进而映射到相应的动作。


