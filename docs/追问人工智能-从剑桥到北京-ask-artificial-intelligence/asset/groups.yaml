  - '[PAGE 27]


    遥遥领先，继续成为执牛耳者。这些科技巨擘无一例外也都是资本巨头，资本与技术的进一步结合无疑会形成新的“超级权力”。这种“超级权力”对人工智能及未来的信息技术发展将有哪些影响？对经济社会又会产生什么影响呢？下面将对这两个问题进行初步分析。


    所有创新科技的出现和发展都是人-机-环境系统的产物，资本与技术在这个系统中所起的作用非常重要，以前大家一致认为资本是积累财富的重要力量，现在不少人认为是技术，尤其是那些能够转化为社会产品形态的科学技术也是财富集聚增加的一个不可忽视的源泉，资本与技术两者的有机结合所产生出的“超级权力”之大更是让大家惊叹不已，从蒸汽机到电动机，从计算机到互联网，无不显露出这种范式和趋势。然而，在人工智能时代，这种模式却在发生着一些变化，例如，当前表面上几乎所有重要的人工智能领域的突破性成果都是出自谷歌、微软、IBM、亚马逊、Facebook、苹果、华为、百度、阿里巴巴、腾讯等大型公司所支持的研究平台，实际上，这些“突破性成果”大都不是这些“超级权力”公司孵化出来的，而是像多伦多大学辛顿教授实验室、哈萨比斯领导的创业小公司
    DeepMind 等研究开发出来，后被这些大公司用资本收购而成的。另外，多年以来，人们一直认为算法、芯片和数据是人工智能的三大支柱，有人把算法比作“上帝之眼”，将数据比作“智能的血液”；有人认为，谁拥有更多的数据，谁拥有更好的算法，谁就将主导未来的市场产品。然而事实并非如此。从算法的工作原理看，其计算结果代表了一种统计概率，即事件发生的可能性，而非必然性。由于不具备推理能力，算法的适用范围较为受限，在某一领域是“专家”，运用到其他领域可能就成了“外行”；数据也是如此，再好的海量优质数据若不与开发者的意图、用户主观体验、市场应用环境相结合，恐怕也很难以实现其内在的价值。所以，这些大公司所形成的“超级权力”对人工智能及未来的信息技术的突破性发展将不会有太大的影响，而那些为了生存和发展的中小智能
    / 信息公司、小团队开发出令人耳目一新的颠覆性技术的可能却比较大，大公司对这些新技术所体现出的主要作用则在于收购、融合、推广、工程、应用与市场化方面。'
