    # 第十一章

    智能：从哲学到大脑


    我们可以上天入地，但要了解头颅内发生的事情却困难重重。几个世纪以来，人们从没有停止对意识问题的探索。无论是哲学、神经科学还是人工智能领域的专家教授，都对意识问题进行了深入思考：究竟意识是什么？它位于何处？如何理解意识与物质之间的因果关系？意识和智能之间又有什么关系呢？'
  - '[PAGE 185]


    <!-- no content -->'
  - '[PAGE 186]


    马克思·威尔曼斯（Max Velmans）曾经提出著名的意识五大问题：第一，意识是什么，它位于何处？第二，如何理解意识与物质之间的因果关系？第三，意识有什么功能？第四，与意识相关的物质形式是什么？第五，检测意识的最恰当方式是什么？可以这么说，这五大问题基本概括了所有意识研究的方向。但找到方向只是最初的一步，目前意识研究领域还属于“百花争鸣”阶段，如伯纳德·巴尔斯（Bernard
    Baars）等人提出的意识的全局工作空间理论，加来道雄（Michio Kaku）提出的意识时空模型，朱利奥·托诺尼（Giulio Tononi）提出的信息整合理论等，至今还没有大家公认的意识模型或理论。还有学者出于研究的难度或者其他种种原因，认为意识没有深入研究的必要，比如学者约翰·霍甘（John
    Horgan）曾悲观地预测人类永远不可能完全了解意识与心灵。


    本章将总结意识研究领域的理论和实验成果，并着重探讨意识与脑、意识与智能之间的关系。


    # 一、意识的哲学属性


    哲学家似乎对意识问题情有独钟，在他们眼中，我们是谁，世界是什么，我和世界的关系等问题显得十分重要。在此，笔者试图从身心二元论、意识的涌现与还原论等方面来研究意识中的哲学问题。


    # 1. 身心二元论


    一元论与二元论问题历来是哲学家争论不朽的战场。一元论者认为物质与意识本质上是一种物质；二元论者认为实在由两种截然不同的事物构成，即意识和物质两者是分离的。


    希腊早期哲学家赫拉克利特（Heraclitus）曾说：事物之间的平衡与对立使得宇宙成为一个统一的整体，世间万物都是由某种单独的基本过程或基本物质组成的，而这正是一元论的核心宗旨。


    希波克拉底（Hippocrates）认为，脑是我们所有思想、感受和观'
  - '[PAGE 187]


    念的基础。


    柏拉图认为，人被分为两个部分，即肉身和灵魂，肉身掌管感官知觉，灵魂掌管理智。这为身心二元论的成立奠定了基础。值得一提的是，他的观点被《新约》吸纳，并在全世界广泛分享。


    柏拉图的学生亚里士多德提出了质疑，驳斥了老师的人类灵魂独立性的观点，认为思维是肉体的形态或功能。


    如果说柏拉图提出了二元论的雏形，那笛卡儿就是真正提出二元论的人。他提出：思维和身体永远是不同的实体。阿维森纳支持笛卡儿的学说，并说道：灵魂有别于肉体。


