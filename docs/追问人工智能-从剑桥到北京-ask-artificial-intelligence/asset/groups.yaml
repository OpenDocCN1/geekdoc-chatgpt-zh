    的自动获取、多源知识的自动融合、面向知识的表示学习、知识的推理与应用。符号主义主张用逻辑方法建立人工智能的统一理论体系，但遇到了“常识”问题的障碍，以及不确知事物的知识表示和问题求解等难题，因此，受到其他学派的批评与否定。


