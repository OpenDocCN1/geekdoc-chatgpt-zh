    # 大学科普丛书


    # 描绘科学历程 传播古今智慧 激发科学热情 弘扬现代文明


    现代文明需要科学和人文共同推动，大学具有得天独厚的资源优势，今天的科普也不再仅仅是知识的普及，而是强调将科学技术与历史、哲学、艺术、经济等人文社会科学有机融合，传播科学思想，弘扬科学精神，大学科普由此成为推动现代文明持续发展的重要力量。


    +   - 与众多介绍剑桥情况的书不同，本书侧重于剑桥的学术、生活所引起的人的独立思考和感知，对源于剑桥大学的智能革命与人类深度科技化前景进行了深入的剖析和探讨。

    +     —— 北京航空航天大学教授 我国人机环境系统工程博士专业创立者之一 袁修干

    +   - 人工智能是让机器做人的事和人做不到的事，是一门极富挑战性的新技术学科，也是当今人类社会关注的重要热点之一。这本书从哲学和伦理的角度，用通俗的语言生动地描述了人工智能的历史和现状，富有创见，是一本引人入胜的人工智能优秀科普读物。

    +     —— 中国科学院院士 南京理工大学科协主席 茧筱亭

    +   - 这是一本视野广阔的科普书，作者带领我们从剑桥到北京，探究人工智能的缘起、现状与未来，从技术、认知、环境、情感、伦理等多个侧面深刻解读了人工智能的本质和影响。我们即将步入人工智能时代，这本书值得认真读一读。

    +     —— 北京大学科协副秘书长 《大学科普》杂志编委会副主任 郑英姿

    +   - 第四次工业革命的本质特征就是智能化，人工智能正在改变世界，它从何处来？未来会如何？其核心技术和知识体系有哪些？作者凭借扎实的研究功底做出了解答，有严谨的思考，有飞扬的灵感，也有生动的故事，是一本难得的人工智能学科领域的科普读物。

    +     —— 中国人工智能学会理事 重庆大学产业技术研究院执行院长 葛 垚'
