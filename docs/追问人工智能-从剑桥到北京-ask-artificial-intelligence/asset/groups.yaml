    的是人机混合智能。人机混合智能就是研究如何在人、机及环境系统之间实现最优的智能匹配，人的智能加上机器的智能，涉及人-机-环境系统的整体设计及其优化等方面的研究，研究的目的包括可靠性、高效性和舒适性等几个方面。它主要涉及两个基本问题，即人的意向性和机器的形式化问题。意向性就是意识的指向。机器难以处理涉及灵活、可改变的，甚至带有矛盾性的事物，但是机器的长处在于它不疲劳、擅计算，并且能够准确、及时地处理形式化、符号化的东西，而这是人所不擅长的。所以，如何把机器的长处和人的这种优点充分地结合在一起，是一个很重要的命题，也是人机混合智能的一个命脉。意向性、意识是整个智能科学的瓶颈，可以看出，意识就是一种感知，这是情境感知。还有一种是非情境的感知，能够穿越时空，这是人的意识，机器则不然。对于意识，著名心理学先驱、美国第一届心理学协会会长威廉·詹姆斯曾说过，智慧是一种忽略的艺术，人知道怎么忽略一些不重要的事物，而把精力聚焦到一些重要的关键之处，特征之上；而机器则不然，它只擅长处理大数据，而不擅长处理小数据。


    《孙子兵法》有云：“知己知彼，百战不殆。”知己知彼不可分，不知彼就不能知己，任何事物本身不能解释自己，只有从其他参照物处才能感知、理解、发现、说明、定义自己。己和彼是一个相对的概念，它们相互对立又相互依存，“己”是自身，是相对于外部的“彼”而存在的，若没有外部参照，就不可能不知彼而知己。“不知彼而知己，一胜一负”，没有辩证地看待“己”和“彼”之间的关系，进而可以认为：自我是不存在的——没有环境和参照物，自己解释不了自己，如同我的概念定义为“我就是我”一样，再进一步，自我意识也可能是不存在的，它也是交互的产物，只不过可以穿越时空逻辑关系罢了。从根本上说，所有的自主系统都是不由自主，只不过显隐程度不同而已。


    当前人造的机器或人工的智能有存在但没有自我。自我诞生于对自身存在的经常性的交互、组织和产生。产生不出主动性的交互和组织，就不是自主，就没有自我，没有自我，就不可能出现感己与感彼、知己与知彼，感性就联系不上理性，客观就不能形成主观，事实就不能衍生出价值。由上不难得出，不知彼而知己的结果就是随机了。


    “自我”的产生是意识最重要的一个基础，实际上，自我的概念就是建立了一个坐标系，“自我”即坐标系的原点，人类都是以自我为原点度量周围世界与事物的。意识的出现往往会造成“无中生有”“有中生无”。无中生有，往往是只有外界的刺激所产生的数据形成数值，数值不但包括客观的数量，而且形成了主观的赋值。比如说“1”，它既是一个单纯的客观的数值，也是对自我有特殊意义的一个数，如一杯茶，一条毛巾，其中有很多主观的情感化的赋予。接着，需要提取有价值的东西，即信息。信息就是有价值的数值或者数据，从信息中可以获取知识，从知识中可以提炼逻辑，也就是从
    0 到 1、从 1 到 n 的过程，正应了中国古代道教所说的：道生一、一生二、二生三、三生万物，它的整个过程就是无中生有的过程。有中生无，就是指逻辑产生意向，从意向性导出意识，就是觉察觉知，从意识里边，沉淀出潜意识，从潜意识升华为无意识的过程，也就是从
    n 到 1、从 1 到 0 的一个过程，万物归三、三归二、二归一、一归道之历程。


    ## 四、不再是没有情感的机器


    情感是人类智能的重要组成部分，是穿越理性的一把利器，然而，情感计算这一方向能否可行？如同形式化常识一样能否实现？这些问题都值得深思和探索。


    大约半个世纪前，美国心理学家、“认知心理学之父”奈瑟尔（Neisser Ulrich）描述了人类思维的三个基本和相互联系的特征，这些特征在计算机程序中也明显存在着：第一，人类的思维总是随着成长和发展过程积累，并且能对该过程产生积极作用；第二，人的思想开始于情绪和情感的永远不会完全消失的密切关系中；第三，几乎所有的人类活动，包括思维，在同一时间的动机具有多样性而不是单一的。赫伯特·西蒙表达了相似的观点。尽管情绪和情感是人类日常生活中的基本组成部分，但缺乏情感交互的技术是令人沮丧的，它在技术层面实现自然的人机交互仍是一个亟须解决的问题。目前，情感计算越来越受到研究者的重视。类似研究，有人工情感（artificial
    emotion，AE）、感性工学（kansei engineering，KE）、情感神经学（affective neuroscience）等。明斯基在他的著作和论文中强调了情感方面，涉及情感神经科学、情感心理学等方面。IEEE
    Transaction on Affective Computing（TAC）跨学科国际化期刊、Affective Computing and Intelligent
    Interaction（ACII）学术会议等学术支持鼓励研究者们对识别、诠释、模拟人类情绪和相关情感方面的研究的突破和创新。


    ### 1. 情感及情感计算


    “情感”（emotion）一词源于希腊文“pathos”，最早用来表达人们对悲剧的感伤之情。达尔文认为，情感源于自然，存活于身体中，它是热烈的、非理性的冲动和直觉，遵循生物学的法则。理智则源于文明，存活于心理。《心理学大辞典》中对“情感”一词的定义是，“情感是人对客观事物是否满足自己的需要而产生的态度体验”。马文·明斯基认为情感是思维的一部分。史蒂芬·平克也持有这样的观点，即“情感是被当作非适应的包袱而被过早地注销的另一部分心智”。达马西奥（Damasio）在他的神经生物学的研究结果的基础上将情感分为至少两类，即原发性情感和继发性情感。原发性情感被认为是与生俱来的，被理解为一岁儿童情感这种典型的情感类型；继发性情感被假设为从更高的认知过程中产生。而拉塞尔（Russell）则从两个方面构造情感：核心情感和心理建构，前者表示神经系统的状态，如昏昏欲睡；后者表示行动，如面部表情、音调，以及行动之间的关联。由于情感的复杂性，研究情感的相关学者对情感的定义至今也未达成一致，记载的相关理论就有150多种。


    而“emotion”一词由前缀“e”和动词“move”结合演变而来，直观含义是从一个地方移动到另一个地方，后来逐渐被引申为扰动、活动，直到近代心理学确立之后，才最终被威廉·詹姆斯用来表述个人精神状态所发生的一系列变动过程。皮卡德（Picard）曾在其书中对情感和情绪方面的术语专门进行了区分，她认为，相对于情感而言，情绪表示一个比较长的情感状态。情感影响我们的态度、情绪和其他感觉、认知功能、行为以及心理。同时，情感容易在多次情绪体验的基础上实现，当人们多次觉得完成一项任务很高兴时，就会爱上这个任务。相比情绪而言，情感更具有深刻性和稳定性。在自然语言处理中，米里安（Myriam）等人结合《韦氏大词典》以及他们的相关研究得出的结论是，在语言中情感是无意识的，并且很难对其下定义，从文本中可以检测到的是有意识的情感，是情绪表征。而情绪这一复杂心理学现象几乎不能从文本中全部检测出，能检测到的是情绪的构成因素。许多关于情感计算的研究并没有完全区分情绪和情感（包括本文引用的大部分论文），为与情感计算研究领域保持一致，本文除在此处对情感和情绪进行区别说明外，尽可能地统一使用“情感”一词。


    情感计算最早起源于美国麻省理工学院媒体实验室皮卡德了解到理查德·西托威克（Richard Cytowic）的一本关于联觉的书《尝出形状味道的人》（The Man
    Who Tasted Shapes）。西托威克在该书中提出感知一定程度上由大脑边缘系统处理，这个部分处理注意、记忆和情感。1995年，情感计算的概念由皮卡德提出，并于1997年正式出版《情感计算》（Affective
    Computing）。在该书中，她指出“情感计算就是针对人类的外在表现，能够进行测量和分析，并能对情感施加影响的计算”，开辟了计算机科学的新领域，其思想是使计算机拥有情感，能够像人一样识别和表达情感，从而使人机交互更自然。


    当然，与众多的科学研究领域一样，并不是所有的研究者都同意皮卡德的想法。支持者借鉴现象学并且把情感看作人与人、人与机互动中的成分。情感互动方法认为，应从一个对情感具有建设性的、人文决定性的视角展开，而非从认知和生物学这一更传统的角度出发，这种方法将重点放在使人们获得可以反映情感的体验并以某种方式来修改他们的反应。


    ### 2. 情感复杂性的探究


    ### （1）外在复杂性的探讨


    相比手势、步伐、声音等其他情感表征，面部表情是最容易控制的。面部表情是人脸上不同情绪的反应，实际上表达情绪时是脸部、眼睛或皮肤肌肉位置的变化。对情感最容易理解的是坦率的面部表情，然而不同国家的人面部表情各不相同。相对于其他国家，亚洲人的面部表情强度比较低。因为在亚洲文化中，脸上表现出一些特殊情绪是不礼貌的，展现出消极情绪会影响社会的和谐。这也印证了早期埃克曼证明了文化的最大不同在于如何在公共场合表达情绪。他偷偷拍摄了美国留学生和日本学生观看一次原始成年人礼的可怕画面的表情。如果穿白大褂的实验人员对他们进行集体访谈，日本学生会在看到令美国学生吓得往后退缩的场景时仍礼貌地面带微笑。当被试们单独待在房间里时，美国学生与日本留学生的面部表情都是同样恐惧的。对于外在复杂性，研究者采用的方法多为多模态结合、额外信息叠加，以及结合与时代同步的科技产品方法等来提高识别率。


    博德里（Beaudry）、奥利维亚（Olivia）等人设计实验澄清了六种基本情感识别中眼睛（眉毛）和嘴巴区域的作用，并得出结论：对于所有的情绪，面部表情识别过程不能被简化为简单的特征或整体处理。新加坡国立大学电气工程系的
    Gu W 等人利用人类视觉皮质（HVC）和径向编码来提高性能，并提出混合面部表情识别框架。此面部表情的识别框架也可以应用到体态识别，并且可以从图像中提取出一些额外的信息，如用户的年龄、性别。


    但是人与人之间的情感交互是复杂的，单一的感官得到的数据是模糊的、不确定的、不完备的。因此，研究人员应用多种方式识别情感状态，20 世纪 90 年代最初的方式是融合视觉（面部表情）和音频（音频信号）的数据，多种方式整合提高识别精度，使情感计算相关研究更可靠、更有效。陈等人尝试用身体姿势和面部表情识别混合模型，基于澳大利亚悉尼科技大学的人脸和身体姿势（FABO）双模数据库，实验中选择了
    284 个视频，这些视频包含基本的表达（嫌恶、害怕、高兴、惊讶、悲伤、生气）和非基本的表达（焦虑、无聊、困惑、不确定）。实验框架主要分为五部分：面部特征提取和表示、身体姿态特征提取和表示、表达时间分割、时间归一化、表达分类。


    身体姿势交流同面部表情都属于非语言交流的方式。越来越多不同学科的研究已经表明，在传达情感方面，身体的表达像面部表情一样强大。例如，情感计算通过提取人体手势的特征来识别用户的情绪。同时，随着虚拟现实技术的发展，人机交互中肢体的参与度也逐渐增大，身体姿势不仅控制我们和游戏之间的互动，还会影响我们自己的情绪。在“蓝眼睛”（Blue
    Eyes）技术中，“蓝”代表实现可靠的无线通信的蓝牙，“眼睛”即通过观察眼睛运动使我们获得更多有趣和重要的信息。“蓝眼睛”技术主要用于视觉注意监测、生理状态监测（脉搏率、血氧）、操作者的位置检测（站立、卧、坐）。在这项技术中，通过检测人的表情，捕获表情图像，并且提取显示具有眼睛的部分，实现识别检测的作用。


    ### （2）内在复杂性的探讨


    文本句子中的每一个形容词、动词或者仅仅是一个字，都可以表达情感状态。笔记分析技术不仅可以通过书写者的情感输出分析笔记特征，如基线、倾斜、笔压、大小、边缘区，还可以揭示书写者的健康问题、道德问题、过去的经历、精神问题以及隐藏的才能。索菲亚尼等人发现，笔记分析在某种程度上可以帮助我们理解书写者本人的行为、动机、欲望、恐惧、情感投入等多方面。史伟等通过构建情感模糊本体、计算文本影响力等，对微博公众情感进行一系列分析，发现公众对于突发事件的情感表达与政府对于事件的处理方式和手段有密切关系。使用任何文字表达情感是受文化影响的，文化在情感文本表达中的作用这一问题需要自然语言研究者们创造更强大的检测算法。


    戴维森（Davidson）在2002年提出，情感体验并不是简单地发生在我们的头脑中，我们的整个身体都在感知着它们。例如，我们血液中激素的变化，传达到肌肉的神经信号紧张或放松，血液流到身体的不同部位，改变了身体的姿势、动作和面部表情。我们身体的反应也会反馈到我们的大脑中，创造了可以反过来调节我们思维的经验，这也会反馈到我们的身体上。随着科技的发展，许多数据可以从互联网和智能手机上获得。人们的上网活动一般包括搜索查询、浏览网页、广告选择和电子商务等。而用户在网络中创建的数据，如电子邮件、短信、博客等内容都可以进行分析。一个典型的智能手机包含多个传感器，如加速度计、环境光、陀螺、手势、磁强计、温度计、湿度计和气压计等。乔格（Jorge）等研究人员通过捕获包括输入和输出呼叫频率、持续时间和联系人的详细信息等智能手机的活动，分析患者的行为变化。卡韦赫·巴赫蒂亚里（Kaveh
    Bakhtiyari）等人认为，在处理面部表情、人的声音或人的姿势时，有些权衡识别精度和实时性能的方法，像自然语言处理（NLP）和脑电图信号（EEG）这些方法在实际应用中缺乏效率和可用性，因此提出了使用方便和低成本的输入设备，包括键盘、鼠标（触摸板、单触摸）和触屏显示器。该系统通过人工神经网络（ANN）、支持向量机（SVM）技术开发和训练监督模式。结果表明，与现有方法相比，该方法通过
    SVM 增长 6% 的准确度（93.20%），对于情感识别、用户建模和情感智能都起到了突出作用。


    ### 3. 情感计算的最新应用探究


    近几年，研究者们尝试了各种各样的方法和技术来识别用户的情感，一些主要的方法和技术包括：面部表情识别、姿态识别、自然语言处理、人体生理信号识别、多模情感识别、语音识别。人机情感交互则包括人脸表情交互、语音情感交互、肢体行为情感交互、文本信息情感交互、情感仿生代理、多模情感交互。情感仿生代理使计算机增强表现力和亲和力，情感智能系统可以根据人的情感进行反馈，并且使人和计算机的交互更加自然。


    全世界许多实验室都在积极地对情感计算相关技术进行研究，本部分总结了近三年来国内外情感计算的主要应用研究。2014 年，麻省理工学院实验室通过安置在机器，比如汽车上的硬件设备（如相机等），结合基于程序语言的语音识别应用、可穿戴设备（对当前情绪进行实时调节），尤其是面部识别算法，获取一系列情绪指标，弥补获取生理信号类的传感器的不足，探索情感感知与机器连接的潜力。情感分析公司使用计算机视觉和深度学习技术分析面部（微）表情或网络上视觉内容中非语言的线索，基于积累的庞大数据存储库，学习识别更复杂的系统，将情感人工智能引入新的科技领域，尤其是机器人、医疗、教育和娱乐，并展望将此系统用于通过检测癫痫病患者的情感信号来做好发病前的预测以进行防护准备等。2015年，阅面科技（ReadSense）推出了情感认知引擎——ReadFace，由云（利用数学模型和大数据来理解情感）和端（SDK）共同组成，嵌入任何具有摄像头的设备来感知并识别表情，输出人类基本的表情运动单元、情感颗粒和人的认知状态，广泛应用于互动游戏智能机器人（或智能硬件）、视频广告效果分析、智能汽车、人工情感陪伴等。哈尔滨工业大学机器人技术与系统国家重点实验室研发了语音情感交互系统，提出了智能情感机器人进行情感交互的框架，设计实现了智能服务机器人的情感交互系统。北京航空航天大学基于特征参数的语音情感识别，能有效识别语音情感。中国科学技术大学基于特权信息的情感识别，提出了融合用户脑电信号和视频内容的情感视频标注方法，以及以某一模态特征为特权信息的情感识别和视频情感标注方法。清华信息科学与技术国家实验室、中国科学院心理研究所行为科学重点实验室基于生理大数据的情绪识别研究进展，针对使用DEAP数据库（用音乐视频诱发情绪并采集脑电及外周生理信号的公开数据库）进行情绪识别的16篇文章做了梳理，对特征提取、数据标准化、降维、情绪分类、交叉检验等方法做了详细的解释和比较。


    ### 4. 情感计算的深度探究


    现在已实现的情感计算大部分原型情感的识别来源单一。数据库本身存在短板，如训练分类的样本数少，体态识别大多依赖于一组有限的肢体表达（跳舞、手势、步态等），只关注内部效度而缺少外部效度的认可。因此，在识别方面，未来研究应在情感分类方面继续努力，创建新的数据库，特别是婴幼儿及儿童数据库的建立。


    在神经科学方面，人类大脑情感过程的神经解剖学基础极其复杂且远未被理解，因此，该领域还不能为开发情感计算模型提供充足的理论基础。


    在人机交互或人与人交互过程中，人的情感变化是变速的。虽然皮卡德在《情感计算》一书中分别用两个比喻将情感复合分成两类：微波炉加热食物时开关间断循环与冷热水混合。两者通过不同的方式使物体达到“温”的状态，前者类似于“爱恨交加”中的情感状态；后者类似于拉塞尔等人的环形情感模型中的愉快与低强度结合为轻松这种新状态。但基于不同情境的情感复合远不止这两类。以动态的数字平台将这种做成模型很难实现和验证，因为情感的输入、输出应该在不同的情境下产生和测试。


    目前，国外已经有一部分研究者开始关注深度情感计算方面的研究，如阿尤什·沙玛等人利用语言数据联盟（linguistic data consortium，LDC）中的情绪韵律的语音和文本，基于交叉验证和引导的韵律特征，提取与分类的深层情感识别。


    随着后续情感方面的深度研究，多模型认知和生理指标相结合、动态完备数据库的建立以及高科技智能产品的加入等，将成为情感计算相关研究的一个趋势，从而更好地实现对用户行为进行预测、反馈和调制，实现更自然的人机交互。


    ## 五、游戏中的人工智能


    如何找到一种可产生意向性的形式化手段是通往人机有效融合的关键，目前的数学、物理手段还不具备完全承担这个重任的能力，因为这仅是智能——这个复杂性系统问题的两个方面而已。


    继 2013 年论文 Playing Atari with Deep Reinforcement Learning 发表以后，Google DeepMind
    的“阿尔法狗”在围棋上的人工智能突破又一次震惊了世界。其实，从 1950 年香农教授提出为计算机象棋博弈编写程序开始，游戏人工智能就是人工智能技术研究的前沿，被誉为人工智能界的“果蝇”，推动着人工智能技术的发展。接下来，就为大家介绍一下游戏人工智能。


    ### 1. 概念


    如果我们知道了什么是人工智能，游戏人工智能的含义也就不言而喻了。人工智能作为一门交叉学科和科学前沿，至今尚无统一的定义，但不同学科背景的学者对人工智能做了不同的解释：符号主义学派认为人工智能源于数理逻辑，通过计算机的符号操作来模拟人类的认知过程，从而建立起基于知识的人工智能系统，其主要代表成果是风靡一时的专家系统；联结主义学派认为人工智能源于仿生学，特别是人脑模型的研究，通过神经网络的联结机制和学习算法，建立起基于人脑的人工智能系统，其主要的代表成果是风头正劲的深度学习；行为主义学派认为智能取决于感知和行动，通过智能体与外界环境的交互和适应，建立基于“感知-行为”的人工智能系统，其主要代表成果是独树一帜的强化学习。其实这三个学派分别从思维过程、脑结构、身体三个方面对人工智能做了阐述，目标都是创造出一个可以像人类一样具有智慧、能够自适应环境的智能体。理解了人工智能的内涵以后，我们应该如何衡量和评价一个智能体是否达到人类智能水平呢？目前有两个公认的界定：图灵测试和中文屋子，一旦某个智能体能够达到这两个标准，那么，我们就认为它具备了人类智能。


    而游戏人工智能是人工智能在游戏中的应用和实践。通过分析游戏场景变化，玩家输入获得环境态势的理解，进而控制游戏中各种活动对象的行为逻辑，并做出合理的决策，使它们表现得像人类一样智能，旨在提高游戏娱乐性、挑战智能极限。游戏人工智能是结果导向的，最关注决策环节，可以看作从“状态（输入）”到“行为（输出）”的映射，只要游戏能够根据输入给一个看似智能的输出，那么，我们就认为此游戏是智能的，而不在乎其智能是怎么实现的（whatever
    works）。那么，怎么衡量游戏人工智能的水平呢？目前还没有公认的评价方法，而且游戏人工智能并不是特别关心智能体是否表现得像人类一样，而是更加关心游戏人工智能的智能极限——能否战胜人类的领域专家，如“沃森”在智能问答方面战胜了问答节目《危险边缘》（Jeopardy!）超级明星肯·詹宁斯（Ken
    Jennings）和布莱德·拉蒂（Brad Rutter）；“阿尔法狗”在围棋上战胜了欧洲围棋冠军樊麾、世界围棋冠军李世石。


    ### 2. 游戏机理


    ### （1）人类的游戏机理


    游戏对我们来说并不陌生，无论是小时候的“小霸王”学习机还

