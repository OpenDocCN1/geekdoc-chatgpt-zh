    人工智能的发展需要大量的资本投入和技术积累，这或将导致社会各产业间、人才群体间与阶层间的发展能力、资源占有程度与社会影响力方面的极大差异。这意味着这些大型跨国公司或将成为人工智能时代的巨头企业，形成操纵全球产业结构与人才、资本、技术流向的垄断能力。如果对其缺少有效的引导、制约和监督，可能会出现人工智能技术滥用而危害社会安全，或成为资本权力的附庸而激化社会矛盾的问题。美国学者纳尔逊曾提出：“研究美国国家创新系统，必须研究防务政策，这是对美国经济、科技影响最大的两个公共政策领域之一。”另外一个公共政策是反垄断法，这个法案的目的是防止垄断，确保市场竞争。对照着看，美国防务政策可以视为确保“垄断”的公共政策：以国家安全的名义保证政府调集社会资源的正当性并保护其基本及必需的产业和部门。从根本上而言，市场社会优质发展是国家利益的保障，但是资本的逐利性和技术的潜利性往往会形成矛盾，如许多资本为了实现中短期的利益/利润回报，会不顾技术的长期成熟性开发而进行竭泽而渔，如各种新技术的资本绑架行为；或者为了市场盈利而不顾及对社会的责任和义务等，如游戏开发。总之，从中不难看出，这些资本与技术的进一步结合形成具有“超级权力”的科技巨擘对国家经济社会的影响既有正面影响，如加速产业的升级换代、促进社会的快速发展，同时又有负面影响，如形成垄断利益集团、限制更新技术的使用和发展。如何实现两者有效地扬长避短和协调发展，将是未来一道需要不断思考如何解决的经济-社会和资本-技术发展难题。'
