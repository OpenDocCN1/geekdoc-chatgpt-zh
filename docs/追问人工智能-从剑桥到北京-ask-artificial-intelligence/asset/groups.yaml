    （ Francis Crick ）等人破解了 DNA 的双螺旋结构，人们顿悟到一个小小的细胞竟然蕴含着这么复杂的结构。现在人们逐渐明白，生命是一种涌现现象，一切的生命现象皆来自身体内的分子与分子之间的相互联系。那么，意识是否也一样可以被还原呢？


    举例来说，如果一个人相信意识的涌现性，那他必定会认为意识可以还原为各个神经元的相互作用。如果深入研究下去，那是否是只要神经元存在交互作用，就可以产生意识，还是应该存在一个意识涌现的临界点，超出这个阈值，就可以有意识。


    本杰明·里贝特（ Benjamin Libet ）提出，意识是一个涌现场，有能力否决由脑前意识计划和准备的行动。


    约翰·赛尔（ John Searle ）说道：意识是脑神经活动导致的，并且不过是这种活动的高阶，涌现的结果而已。


    我国学者张世民也曾说：在任一具体情景内，从一切可能的刺激信号 S 到一切感觉事件 M 的集合，存在至少一个二元关系 R，可以定义心智结构 R 许可的行为集合
    B。R 在 B 内任一子集进行选择，将所取的元素呈现给更高的心智结构（意识），这就是所谓的涌现。


    除了涌现与还原外，还有一派学者相信，物质既不可还原，也不可涌现。代表人物为莱布尼茨，他曾说道：单子是简单的，没有组分。复合物是简单物的聚合。意识研究专家克里斯托弗·科赫（
    Christof Koch ）也赞同这样的观点，他认为，意识是生命物质的根本属性，不可能源于任何其他物质。


    在笔者看来，涌现这种说法显得有些随意，究竟如何取舍？何时取舍？舍弃的机制与原理是什么？这些最重要的问題并不能用一句涌现来表示。


    无论是涌现论还是单子论，意识的来源问题始终没有得到解决。或许正如托马斯·内格尔（ Thomas Nagel ）曾经感叹的那样：“正是由于意识，心身关系才使人倍感棘手……如果没有意识，心身关系问题将变得索然无味；而一旦有了意识，它又成为一个使人感到希望渺茫的问题。”'
  - '[PAGE 190]


    # 二、意识的脑属性


    其实，在生物与神经科学领域，意识之谜一直是大家探索的焦点，正如苏珊·格林菲尔德（Susan Greenfield）所说的那样，大脑是一个令人琢磨不透的器官，它是唯一能自我观察，而且能沉思它的内在工作的器官。那么，究竟脑是整体产生意识还是局部产生意识？意识和脑内神经元的数量有无关系？下面我们来探讨这个问题。


    # 1. 意识的整体与局部之争


    对大脑的研究早已开始，早在 1633 年，数学家、哲学家笛卡儿就在自己的著作中《第一哲学沉思录》中表 明了自己的身心二元论的观点。更为重要的是，他认为松果体是意识的栖息之所，原因如下：松果体是大脑内唯一不对称的部位（在他那个年代看来是这样的），所以必须是灵魂的位子，而且松果体小、轻、易于移动，虽然其他部位也具有类似的特点，但不是因为位于大脑外侧就是可以分为两瓣，所以是不合适的候选。在笛卡儿看来，意识仅仅存在于松果体。


    笛卡儿去世后，很多人出来抨击其理论为伪科学，经不起推敲，其中比较著名的有威利斯（Willis），他说，动物也有松果体，但并没有人这样的想象力与高级能力；思丁森（Steensen）说，笛卡儿的解剖学的基本假设是错误的，他几乎不懂大脑。可见，笛卡儿的松果体并没有作为主流学说流传下来。


    19 世纪初，法国生物学家佛罗昂（Jean Pierre Flourens）曾做过如下实验：摘除动物脑的不同部位，观察脑功能的改变。结果发现，拆除脑的不同部位后，所有功能均减弱，因此，他得出结论：不同的意识功能不可能位于脑的特定部分，脑结构是均匀的，并以整体方式工作。


    19 世纪下半叶，保罗·布罗卡（Paul Broca）和卡尔·韦尼克（Carl Wernicke）通过对患者的研究发现，大脑中特定部位的损伤与某种意识行为的障碍有关。如果整体论是正确的，那么，某一特定区域受损并不能影响到意识。布罗卡和韦尼克的实验也极大动摇了人们对整体论的相信程度。'
  - '[PAGE 191]


    大卫·米尔纳（David Milner）和 梅尔文·古德尔（Melvyn A. Goodale）通过一系列大脑实验，于 1992 年提出双视觉信息流通路，一条为背侧通路，把视网膜输入转化为动作；另一条为腹侧通路，专门司职有意识的视觉信息，这为后来的意识分析提供了很大的启发。


    美国神经生理学家罗杰·斯佩里（Roger Sperry）通过手术切除了癫痫患者的胼胝体，缓解了癫痫患者的症状，但是他发现了一些异常：有一个患者想用一只手拥抱他的妻子，却发现另一只手在做完全不同的事情，他递了一个钩子到她的脸上。斯佩里设计了著名的裂脑人实验，并经过反复观察与分析得出结论：左半球和右半球可能是同时有意识的，两种思维是不同的，思维的体验是平行运行的。


    科赫曾经说过，皮质及其附属结构的局部属性调节意识的特定内容；反之，全局属性对于维持意识是关键的。


    马尔斯伯格（von der Marlsburg）曾经说脑可以通过峰电位发放的时间同步化来标记相应的神经元集群。


    直到今日，很多 人还认为大脑是以整体的、格式塔式的方式工作，但不可否认的是，大脑在某些局部区域仍然对于意识有着极其重要的影响。


    # 2. 意识产生的部位


    1967 年，美国国家精神健康研究所医生保罗·麦克莱恩（Paul McLean）为了了解看似随机的大脑结构，把大脑分为 3 个部分，即爬虫脑、哺乳动物脑与大脑皮质。爬虫脑包括脑干、小脑和基底核；哺乳动物脑包括杏仁核、海马、丘脑在内的边缘系统，大脑皮质则包括我们大脑皮质的额叶、枕叶、顶叶与颞叶
    4 个部分。


    在爬虫脑中，脑干和小脑对于意识有什么作用呢？


    截至目前，神经科学已经积累了大量的数据与案例，这些数据是建立在对不同部位脑损伤的研究之上。研究发现，小脑对于意识的贡献几乎没有。小脑是负责无意识运动的重要一环，如果小脑负责意识的产生，那小脑的效率将会极大程度降低，这显然是不被允许的。这也从侧面证明大脑中神经元数量与意识并不成正比关系。小脑的神经元数量大约是大脑的
    4 倍，是脑中神经元数量最多的部位，如果两者'
  - '[PAGE 192]


    关系成正比，占大脑近 80% 的神经元应该产生最大程度的意识，但事实并非如此。


    那脑干与意识有何关系？脑干与小脑不同，它主要负责维持个体生命，包括心跳、呼吸、消化、体温、睡眠等重要生理功能。丹尼尔·博尔（Daniel Bor）曾经说道：意识最为重要的区域是脑干网状结构，它通过一系列复杂的分区控制着睡眠与觉醒周期。但他同时举了个例子，没有电源，电脑无法开机，但能说电源就是电脑最重要的一环吗？同理，脑干的网状结构对于意识形成不可或缺，但不能就此下结论说意识在这一环节产生。


    美国科学家穆罕默德·考贝西（Mohamed Combesi）及其同事在研究癫痫症时，偶然发现在以一定频率刺激大脑某个特定区域时，患者进入睡眠状态，可撤去刺激时，患者恢复意识，并且不记得刚才发生的事情。他们经过反复测试发现，这个部位是屏状核，是大脑中心下方一个较薄的神经组织。他们如此猜想：屏状核是大脑意识中非常重要的部位，负责整合意识，进而产生了情感、思想等。这项研究发表于
    2014 年的《新科学家》。


    相比于爬虫类生物，哺乳动物最大的进化之处在于边缘系统，而边缘系统主要包括丘脑、杏仁核、海马等部位，主要司职情绪与情感。


    如果丘脑大面积受损，患者就会成为植物人，与昏迷不同，这时的患者仍然可以睁眼醒来，这表明脑干结构保持完好。


    尼古拉斯·施弗（Nicholas Schiff）通过大量的实验做出如下假设：中央丘脑和通向中央丘脑的输入和输出通路对于意识是极其重要的。


    科赫认为意识的促成因素之一为丘脑的五个板内核的集合。左右丘脑板内核中不足一块方糖大小的损伤，就能导致意识的消失。


    众多文献表明，丘脑对意识的形成更为重要，位于脑干上方，其神经元可以从所有脑区发送信息，也可以接收信息。丘脑不仅仅是信息的中转站，对信息也能起到过滤和组织的作用。


    海马对于意识的影响呢？考虑一下海马受影响时患者的表现情况。1957 年斯科维尔（Scoville）和米尔纳（Milner）报告了神经心理学中一个很重要的、一位被称为
    H.M. 的患者的报告，患者的双侧'
  - '[PAGE 193]


    颞叶一部分被去除，其中包括双侧海马体，患者呈现出明显的记忆遗忘特性，不能记住新的事物，但能记住运动技巧。如果与他正常交流，并没有发现其意识上有很大的问题，据此，克里克推断说：海马体并不是意识的必需部位。


    再进一步，意识是不是产生于新大脑皮质呢？


    首先是枕叶区的初级视皮质，休伯尔（Hubel）和维塞尔（Wiesel）在1958年的猫视觉皮质实验中，首次观察到视觉初级皮质的神经元对移动的边缘刺激敏感，并定义了简单和复杂细胞，发现了视功能柱结构。从此以后，人们对初级视皮质进行了很多探索研究。20世纪90年代中期，尼克斯·罗格赛迪斯（Nikos
    Logotheis）对猴子进行双眼竞争实验，给猴子左眼呈现一幅人脸图像，给猴子右眼呈现房子的图像，测试结果表明，被试的猴子先看到房子，再看到人脸，依次循环。


    这个实验结果很有意思，作为初级视皮质，应该同时捕捉到二者的信号，却出现了不同时的效果。据此，罗格赛迪斯认为初级视皮质对意识作用不大，V1受损、视觉丧失，是因为它是主要的视觉中转站，与意识无关。


    科赫也支持这种观点，他提出，我们眨眼的频率为15次/分钟，那么基本上每分钟我们的视觉信号就会被阻断15次左右，意识是不是也就此被阻断呢？很显然，情况并非如此。我们的意识没有被阻断，我们很少意识到自己在眨眼，毫秒级别的时间空隙被V1更高级别的皮质所补充扩展，很显然，这是V1力所不能及的。


    再深入一点，其他的皮质与意识的关系如何呢？


    萨米尔·泽基（Semir ZeKi）曾经说过：大脑中存在主节点的概念，即如果一个颜色主节点损坏，这个人就会丧失对颜色的捕捉能力，但不影响其他的意识与知觉。按照他的说法，MT是随机点运动知觉的主节点，V4区是颜色知觉的主节点。


    达马西奥指出，在人的颞叶靠近头后部的损伤与前部的不同，后部与概念性东西有关，前部与特定时间有关。实验证明，与右侧颞叶发作不同，左侧颞叶或双侧颞叶病变造成的局部发作更可能影'
  - '[PAGE 194]


    响到意识。


    那顶叶和额叶对于意识的贡献如何呢？


    对人类大脑进行功能性磁共振成像测试表明，当我们看到图像切换时，不仅比 V1 区高的视觉皮质会被激活，外侧前额叶皮质与后顶叶皮质也会被激活。前额叶、后顶叶皮质经常同时被激活，博尔将其命名为前额叶-顶叶网络。


    斯坦尼斯拉斯·迪昂（Stanislas Dehaene）做过一个实验，快速给被试呈现一系列杂乱的方块，在方格的中间，会插有字的图片，有时候字距离很远，有时候距离很近。对比两种不同情形，可以发现，高级感觉区域与前额叶-顶叶网络被激活。


    李奥塔·卡耐（Ryota Kanai）及其同事利用向不同方向旋转的圆点，让被试根据圆点旋转方向产生两种交替不同体验（与心理旋转实验类似）。结果表明，顶叶越厚，感觉到的图像切换越多。


    马特·戴维斯（Matt Davis）对处于麻醉状态的被试进行功能性磁共振成像测试，发现不管麻醉的程度如何，负责简单的、经过处理的声音的颞叶区域的活动依然活跃，但在被试进入睡眠状态后，前额皮质的活动马上停止。


    克里斯托弗·科赫把神经相关物定义为意识的最小神经机制，而且大脑皮质及其附属部分的离散区域中的生物电活动对意识体验的内容是必要的。意识的任何神经相关物的一个关键成分是高阶感觉区与前额皮质的计划与决策之间较长的互惠连接。


    维克拉·托米（Victor Lamme）曾经提出过意识的循环过程模型。他认为，只有信息在不同脑区循环时才能产生意识，如果只是双向交流在专门区域之间进行，那只会产生某种程度上的意识。只有这种交流延伸至前额叶-顶叶网络，才会产生完全的、深层的意识。


    那顶叶和额叶受损会发生什么变化呢？


    菲尼亚斯·盖奇（Phineas P. Gage）的病例表明一个事实，额叶受损对一个人的计划、生活能力有着极大的影响，也极大地影响着他的意识水平。


    鲍勃·奈特（Bob Knight）遇见过两侧前额叶均受损的患者，该'
  - '[PAGE 195]


    患者像个傀儡，没有丝毫意识。


    后顶叶皮质受损（左右半侧）的患者会进入极为罕见的状态，被称为巴林特氏综合征，患者完全没有空间感，失去了对整个世界的意识与体验。


    大量的实验和理论分析表明，顶叶和额叶受损，意识水平会有极大程度的下降。而丘脑与脑干对于意识的产生也是必不可少的，就如帕特里夏·丘奇兰德（Patricia S.
    Churchland）所说的那样，脑干、丘脑、大脑皮质这三个部分是我们产生意识的支撑性结构。


    # 三、意识的智能属性


    近些年来，“智能”一词越来越受到学者的关注，“人工智能”一词更是目前非常时兴的领域。能够理解世间万物，却不能制造出有意识的机器人，这也是目前人工智能界十分尴尬的一点，也许，方法就在于我们如何理解智能与意识的关系。


    # 1. 人工智能与意识


    自从诞生以来，人工智能一直在摸索中前进，其中，值得一提的是其中的三大学派，即符号主义、行为主义和联结主义。下面，笔者就这三派与意识之间的关系进行阐述。


    # （1）符号主义与意识


    符号主义是人工智能的一大学派，提倡用逻辑推理的方法模拟人的智能，也被称为逻辑主义。其中，数学演算推理是符号主义者眼中人工智能的起源。代表人物为赫伯特·纽厄尔和艾伦·西蒙。1956年，纽厄尔、西蒙等人研发出程序逻辑理论家（LT），与常规程序不同，LT
    由假设的数学命题出发，一步步从后向前分析，直到找到最后的数学定理为止。LT 证明了罗素与怀特海的《数学原理》中的52 条原理。西蒙曾经高兴地声称：我们制造出了可以思考的机器，这种机器不但可以思考，还可以创新。稍后，他们又研制出了更厉害的通用问题求解器（GPS），这套程序可以在适当的算子帮助下解决不同类型的问题。纽厄尔等人研制的
    SOAR 软件直至今日还在广泛研究。'
  - '[PAGE 196]


    1976 年，尼尔森（ N.J. Nilsson ）和纽厄尔等人提出了著名的物理符号系统假设：凡是能用符号表示的事物和状态都能由计算机进行运算。在符号主义者眼中，人脑的表征、思维可以用符号来表征，所以人脑可以用计算机来模拟。费根鲍姆（
    Edward Feigenbaum ）等人研发出专家系统，里南（ Douglas Lenat ）开启大百科全书项目。


    可以看出，符号主义走的是数学推理—启发式算法—专家系统—知识工程的路线，他们认为知识是智能的基础，知识表示、知识推理、知识运用是智能的核心。在笔者看来，知识确实在意识与智能中占有很大比例，但如果遇到那些无法用符号表达的知识时，如自己的经验与常识，恐怕就束手无策了。中国有句话：只可意会，不可言传，说的正是这个道理。更重要的是，符号主义者没有提出“意识”这个词，按照他们的符号表示法，即使真的能产生意识，也只有不到
    1/2 的意识（左脑的一部分）吧。


    # （2）行为主义与意识


    “行为主义”一词源于心理学，约翰·华生（ John Broadus Watson ）在《行为主义》一书中明确表达了意识不属于心理学的研究范围，我们研究的是那些可以外在观察到的刺激。与心理学稍有不同的是，在人工智能领域中，行为主义者认为
    1948 年维纳提出的控制论是人工智能的起源，他用统一的观点讨论控制、通信和计算机，对比研究了动物和人类机体的控制机理以及思维等活动，将自动控制的研究提到了一个崭新的高度。钱学森提出的工程控制论、卡尔曼（
    Rudolph E.Kalman ）提出的卡尔曼滤波器，都极大程度地刺激了行为主义的发展。布鲁克斯教授在 1990 年、1991 年相继发表论文，批评联结主义与符号主义，其代表作是
    6 足机器人。


    行为主义者的想法很简单，可以用一个公式即 S-R 来表达，其中 S 是刺激，R 是反应。只要找到内在的对应关系，就能预测智能体的行为。这一点，笔者认为倒是与科赫论述的头脑中的僵尸体有些类似，但如果是多种行为需要进行抉择之时，恐怕
    S-R 理论就难以实现了。意识的功能就是处理所有需要出奇制胜灵活反应的情形。行为主义在一开始就将意识的中心排除在外，自然无法产生真正的'
  - '[PAGE 197]


    意识。


    # （3）联结主义与意识


    联结主义者认为，人工智能应该模仿脑的连接方式。1943 年，麦克卡伦（Warren McCulloch）和皮茨（Walter Pitts）提出了 MP 模型，标志着联结主义的开端。1949
    年，赫伯（D.O. Hebb）提出了重要观点，即当两个相连接的神经元同时兴奋时，它们之间的联结强度会增强，这就是著名的赫伯学习定律。1958 年，罗森布拉特（Frank
    Rosenblatt）提出了感知器模型，推广了 MP 模型。1959 年，塞尔弗里奇（Selfridge）提出鬼域模型，认为人的识别模式由四个阶段组成，每个阶段由一群不同功能的“映像鬼”“特征鬼”“认知鬼”“决策鬼”组成。1982
    年，霍普菲尔德（John Hopfield）提出了一种具有联想记忆能力的新型神经网络，后被称为“霍普菲尔德网络”。1986 年，辛顿、鲁姆哈特和麦克勒兰德重新提出了反向传播算法，即
    BP 算法。2006 年，辛顿提出了深度置信网络（DBNS），标志着深度学习的开端。


    可以这么说，联结主义与智能比较接近，实际上通过无监督学习，也可以产生类智能体。但就如笔者在前文中提到的那样，意识可以被还原为神经元动作吗？抑或是神经元的动作可以涌现出意识？产生意识与产生智能在本质上还是存在差别的，类智能体不代表类意识体。


    # 2. 意识的模型


    无论是哲学家、神经学家还是人工智能学家，都希望有一套模型来反映真正的意识过程。


    杰拉德·埃德尔曼（Gerald. M. Edelman）在《意识与复杂性》中提出意识的动态核心假说，即在任何一个给定时刻，人脑中只有神经元的一个子集直接对意识经验有所贡献。换言之，人再报告某一意识时，大脑中相当一部分神经活动和人所报告的意识没有对应关系。


    雷·杰肯道夫（Ray Jackendoff）在《意识与可计算心智》一书中提出了自己的意识中层理论，即将意识分为物理脑、计算的心智与可感知到的心智三个等级。'
