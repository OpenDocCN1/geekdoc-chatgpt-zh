    伯纳德·巴尔斯于 1998 年提出意识的全局工作空间理论。他认为，意识存在于一个被称为全局工作空间的模型之中，除此之外，还有无意识加工的处理器以及背景。这就好比一个剧院，剧院的舞台好比工作记忆，而注意的作用好比聚光灯，舞台上被聚光灯照亮的部分就是意识部分。


    在全局工作空间理论的基础上，斯坦尼斯拉斯·迪昂与让-皮埃尔·尚则（Jean-Pierre Changeux）提出意识的神经全局工作模型理论，即每个时刻只有一种信息能够进入意识的全局工作空间模型中。


    朱利奥·托诺尼提出信息整合理论。在这个理论中，他认为，只要满足两个条件，即可拥有意识。第一个条件为物理系统必须具有丰富的信息，第二个条件是在系统中信息必须高度整合。整合信息理论用字母
    phi（Φ）来表示整合信息的量。如果一个系统的 Φ 值过低，就不会存在意识；反过来，我们要制造具有意识的机器，就需要使这个机器或系统具有很高的 Φ 值。小脑神经元数量是大脑皮质的
    4 倍，但小脑神经元排列方式为简单的晶体结构式排列。因此，小脑的 Φ 值很低，没有意识。这个模型一经提出，立即被很多人引用，并得到了很多好评。


    达尼尔·丹尼特（Daniel Dennett）在《意识的解释》一书中提出了意识的多重草稿模型。在这个模型中，意识的加工方式是并行的，自我只是外在叙述的重点，而不具有内在体验者的角色。


