    的价值观、偏好倾向和风俗习惯特征。人机处理数据最大的差异在于形成信息的表征，机器中的数据常常是结构化归一量化后的“标准数据”，数据表征的符号就是0、1或其他进制的数字；人采集到的数据则是各种非结构化、非'
