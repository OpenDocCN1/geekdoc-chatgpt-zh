    罗斯文学大师陀思妥耶夫斯基有句名言，“我只担心一件事，我怕我配不上自己所受的苦难”，此时此刻，我只担心一件事，我怕我配不上自己所受到的帮助和厚爱。如果说，文字具有生命力，那她一定也有灵魂，如果想看看遥远未来的样子，可以打开各种各样的经典或杂志，里面都有，只是很多尚未被关联……若这本小书能够让您在闲暇之余产生瞬间的这种感觉，也算是对笔者的一丝安慰了。生命实在是太短暂，人应该对某样东西倾注深情。不经意之中，笔者选择了剑桥，也选择种下了一颗种子……


