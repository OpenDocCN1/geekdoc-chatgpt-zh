    智能不是百科全书，而是包含不少的虚构和想象，不仅是分类，还要合类；不仅要合并同类项，而且要合并异类项，因而，智能产品系统的顶层设计非常重要。


    人工智能一般是逻辑（家族相似性）关系，人类智慧常常是非逻辑（非家族相似性）的。未来的智能是在特定环境下人的智能与机器智能的融合，即人机融合智能。人机融合智能不是人工智能，更不是机器学习算法。同样，人工智能、机器学习算法也不是人机融合智能，人机融合智能是人机环境的相互融合，是《易经》中的知几（看到苗头）、趣时（抓住时机）、变通（随机应）。人机融合智能是随动，不是既定，其中的“知己知彼”中的“知”不是简单的态势“感知”，更是态势“认知”。认知是从势到态的过程，感知是从态到势的过程。认知侧重认，信息输入处理输出流动过程；感知侧重感，数据信息的输入过滤过程，认知涉及先验和经验等过去的感知，所以态势认知包括了以前的态势感知。人工智能是一把双刃剑，计算越精细准确，危险越大，因为坏人可以隐真示假，进行欺骗，所以人机有机融合的智能更重要。客观而言，当前的人工智能基本上就是自动化＋统计概率，简单地说，归纳演绎的缺点就是用不完备性解释完备性。


    毕加索曾透露：“绘画不是一个美学过程，而是……一种魔法，一种获取权力的方式，它凌驾于我们的恐惧与欲望之上。”看懂了毕加索的作品，就能理解毕加索想要表达的“魔法”，并且把它用到生活中的其他领域，尤其是智能领域和人机融合智能领域。


    在就要写完本书时，恍惚间，我才依稀感到本书才刚刚开始。俄罗斯文学大师陀思妥耶夫斯基有句名言，“我只担心一件事，我怕我配不上自己所受的苦难”，此时此刻，我只担心一件事，我怕我配不上自己所受到的帮助和厚爱。如果说，文字具有生命力，那她一定也有灵魂，如果想看看遥远未来的样子，可以打开各种各样的经典或杂志，里面都有，只是很多尚未被关联……若这本小书能够让您在闲暇之余产生瞬间的这种感觉，也算是对笔者的一丝安慰了。生命实在是太短暂，人应该对某样东西倾注深情。不经意之中，笔者选择了剑桥，也选择种下了一颗种子……


    感谢赵路、郭晴、王目宣、刘志强在本书编写之初给予的建议与支持，感谢张玉坤、倪桑、曹国熙在本书编写过程中给予的大力帮助，感谢陶雯轩、王赛涵、韩建雨、何树浩、伊同亮等同学在编写过程中提供的参考意见，同时也感谢国家社科基金重大项目“智能革命与人类深度科技化前景的哲学研究”（项目批准号：17ZDA028）的支持，以及各位专家和学者的激发、唤醒、探讨！


