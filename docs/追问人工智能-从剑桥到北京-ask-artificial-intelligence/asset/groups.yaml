    ## 3. 意向性与形式化


    我们不断强调，人工智能的核心和瓶颈在于意向性与形式化的有机结合。意向性具有不可还原性、不可重复性、动态可变性，形式化则反之。


    智能是解决问题的能力，意识是感知事物的能力。人类和其他哺乳动物都是通过感知事物来解决问题的，但计算机不是这样。我们在计算机的智能上取得了很大进展，但是在意识这一领域上进展几乎为零。


    2016 年，人工智能机器人 “阿尔法狗” 战胜了人类的围棋冠军，围棋是非常需要智慧的游戏，在比赛中，机器不会有任何的焦虑感，即使赢了比赛，机器也不会有任何高兴的感受，这其中不涉及任何的意识和感觉。所以，我们没有道理认为人工智能在意识这一领域真正有进展。


    人类有意识，所以人类才能知道，面对这样强大的能量，我们能做什么。让计算机产生意识并不是一定能办到的事，我们自己都不是很清楚人类的意识到底是怎么来的，所以要让计算机也学会意识，是极其困难的。


    自主包括记忆、期望、选择、匹配、控制、同化、顺应等模块，人的自主最厉害之处在于这些分析模块可以同时有序或失序地执行……其中，主动注意分配行为是知感，被动则是感知。正如黑格尔在柏林大学开讲词中所说：“精神的伟大和力量是不可低估和小视的。那隐蔽着的宇宙的本质自身并没有力量足以抗拒求知的勇气。对于勇毅的求知者，他只能揭开它的秘密，将它的奥妙和财富公开给他，让他享受。”


    我们常常是通过调节视觉的焦点来看清外部世界的，想看的会被聚焦而变得很清晰，其他的背景则会变得比较模糊。同样，我们觉察（意识）各种情境时，也往往是通过注意的方式进行聚精会神的，关注的会凸显清晰，忽略的会变得模糊不清。


    对我们来说的物理世界，其实是由光的反射所决定的，眼睛在光的作用下变得十分高效。我们觉察（意识）到的各种关系，是在交互过程中涌现出的，在人-机-环境系统交互的过程中变得格外自然灵性，犹如多道彩虹一般。


    “应该”就是意向系统的合理性。丹尼特指出，采取意向立场有一个重要的前提，或者说，意向立场有一个不可缺少的预设，这就是系统的合理性，即将被解释者看作一个理性的行为者，而将其与环境的关系，其信念、愿望和行为相互之间的关系看作一个在特定目标之下的合乎理性的关系。不仅如此，意向系统的规范性和合理性还表现在对逻辑法则的遵从，不仅相信系统的信念，而且相信他信念的所有逻辑结果，相信他不会有相互矛盾的信念。意向系统是一种被理想化的最优的理性系统。


    有趣的是，理性的东西有时会以感性的方式表达出来。而更有趣的是，感性的东西竟然也可以用理性的方式呈现，如爱的诗歌和歌唱。数据、信息、知识、逻辑本质上就是关系的不同程度的表征。


    改变光，可以欺骗眼睛。


    改变交互，可以欺骗意识。


    意向性与形式化是智能科学的两个“命门”，意向性容纳对立矛盾，形式化眼睛里不容沙子。


    ## 四、意识-思维-智能


    智能是意识之间的桥梁，即中介。智能具有外显性，意识具有内隐性。我们很难衡量别人的意识程度，但是可以通过一定手段辨别他人的智能程度。这也就是为什么人工意识比人工智能要难得多。笔者还认为无论是意识还是智能，都必须通过人、机、环境的交互才能产生。单纯的脑很难产生健全的意识，就好比一个世界顶尖的色彩研究专家，对世界上色彩的理论倒背如流，但如果他从出生即被关到黑屋子里，那他对于颜色的意识是否和正常人一样？


    笔者认为，建造有意识的智能体一定要将其置于具体环境中，首先了解情景，对情景进行辨别与选择，再发展智能与意识，这样才能离我们人类的意识越来越近。


    ## 五、非存在的有


    谈论人脑，首先不可回避的应是大脑中的意识，这也是人工智能突破中的关键奇点，无论是计算机还是机器人，都离不开硬件中的软件程序驱动，若这些程序软件是客观存在的，那么编制这些程序软件的人的逻辑情境意识也应该是客观的。而“客观”是一个抽象名词，意思是在意识之外，不依赖精神而存在的，不以人的意志为转移的，是实时存在的，与主观相对立。如此看来，要么对客观的定义有问题，要么上述有关“类似程序软件的人的逻辑情境意识也应该是客观的”的推理有问题，或者两者就是一个“悖论”——在逻辑学上指可以同时推导或证明出两个互相矛盾的命题的理论体系或命题。


    硬件是客观的，软件也是客观的；大脑是客观的，逻辑情境意识是主观的吗？


    意识出现后，人脑中产生并传输的可能不是所谓的符号、数据、信息，而仅是电脉冲、化学离子的传递/移动，之后形成各个兴奋/抑制区域。笛卡儿把几何与代数的优点结合起来形成的解析几何就是一种很值得借鉴的经验，如莫尔斯码就是把电脉冲与数字结合在一起形成了工程应用。看来试图使用单纯的某一学科解决人的认知或人工智能问题确实是有点异想天开了。


    生理的感知、心理的映像都能形成数理、图理、视频的内涵与外延吗？


    情感是一种意识，是一种可以干扰理性逻辑的“尤物”，目前的机器是不能自主产生这种意识的，哪怕是你生产的它，它还是它。有人在试图尝试计算情感，但在可预见的未来，“感”也许会有较大的进展，至于“情”为何物还应是遥遥无期的吧！而对人而言，恩情、恋情、友情、真情等却相对比较容易能感受到，这也许就是文艺会永远伴随人类存在的主要原因了。


    本章从哲学与意识、脑与意识和智能与意识的角度，论述了意识的哲学方面、生物方面和智能方面。在哲学方面，先从身心一元论与二元论之争介绍开始，再引入涌现与还原的问题；在生物方面，则从大脑内整体论与部分论谈起，再引入大脑意识的重点部位；在智能方面，则从人工智能的三大流派与意识的关系谈起，引入了意识的模型。这三个方面虽然学科领域不同，但实际上紧密相连，密不可分。哲学的理论离不开生物学的实验发现，也离不开智能程序的模型支撑。同理，智能之争本质上就是哲学之争，更依赖于生物学的支持。所以，从这三个角度来研究意识，是十分恰当的。


    稍显遗憾的是，目前仍然没有一套定量的意识测量方法，用来测量与建构非生物体的意识。这也是目前很多领域科学家与学者所致力于的方向。相信在不远的未来，这种方法一定会成形并得到应用。那时，我们便可以说我们真正能够理解意识了。


    ## 第十二章 人机融合的哲学探秘


    人机融合智能是一种新的智能，它不同于人的智能，也不同于人工智能，是一种跨物种越属性结合的下一代智能科学体系。如果说真就是存在，善就是意向，美就是“存在＋意向”的融合；假设机是存在，人是意向，那么人机就是“存在＋意向”的融合，是形式化＋意向性，是东西方文明的共同结晶的体现。


    一般而言，东方文明对智能的追求永远是“反求诸己”，企图打破人自身思维的界限从而达到超越性的智慧；西方则追求借助外力的计算来实现超越，计算即要求有穷，或者说至少极限存在“存在”，函数收敛。而针对无穷发散式的问题，也就是意向的问题，人工智能很难跨出聚合这一步，而人机融合智能则能跨出这一步：人的意向性可以灵活自如地帮助人机协调各种智能问题中的矛盾和悖论。


    从表面看，人机融合智能问题是一个现代科学技术问题，但它同时也是一个古老的伦理问题。伦有四种解释：举、类；人与人之间的关系；条理，次序；姓。伦理，指的是就是人与人、人与自然的关系，以及处理这些关系的规则。人们往往把伦理看作对道德标准的寻求，道德是后天养成的合乎行为规范和准则的东西。它是社会生活环境中的意识形态之一，是做人做事和成人成事的底线。它要求我们且帮助我们，并在生活中自觉自我地约束着我们。假如没有道德或失去道德，人类社会就不再是美好的，甚至于成为一个动物世界，人也就变得无理性和智慧可言。伦理道德最现实的作用就是使人对事物产生价值观，而这种价值观恰恰是产生意向和存在的主要源泉，意向性是意识的基础、存在是规律的反映，人类智能的根本就在于此：“德化情，情生意，意恒动。”“意恒动，识中择念，动机出矣。”


    传统逻辑学规范的对象是一种可自控的推理活动。作为逻辑学所基于伦理学之上的一个基本论证，皮尔士强调：“就其一般特征来看，推理现象类似于那些道德活动的现象。因为，推理本质上乃处于自控状态下的思想，正如道德活动乃处于自控状态下的活动一样。实际上，推理是受控活动的一种，因此必然带有受控活动的本质特征。虽然由于教士专门负责让你们记住，推理现象并非像道德现象那样为你们所熟知，但是，如果你们关注推理现象，可以很容易看到，一个得出理性结论的人不仅认为它是真的，而且认为每一类似情况下的推理同样正确。如果他没有这样认为，他的推断就不能称为推理。它不过是他心中出现的一个想法，他认为它是真的。而由于没有经受任何检查或控制，它并不是被有意认可的，并不能称为推理。”
    这里核心的论证结构是，任何可判定好坏的行为都必须是可自控的，逻辑学以区分推理好坏为主要任务，所以作为逻辑规范对象的推理必须是可自控的活动。对于人造的机器、机制而言，其本质必然是可自控的活动结果，而人的则未必完全是逻辑自控的，人机融合智能更不是逻辑的自控推理活动。


    ### 一、人机融合智能的思考


    人类价值观的起源是伦理学，机器的起源是人类。现实中，人类的伦理道德困境就有不少，而人类给机器人“装”进去价值，恐怕会有更多的伦理范式之间的对冲突产生吧！无论如何，从中不难看出，人机融合的未来必将荆棘密布、困难重重。


    伦理可以规范出道理，道理可以演化出物理，物理可以抽象出数理，数理可以泛化于管理、生理、心理……正如生活中所常见的那样，一种自然数据一旦接触到另一种自然数据或社会数据，其性质就会发生较大变化，而那些在临界值／区的数据／数值变化，直接导致了价值的出现和信息的产生。（自然、社会、真实、虚拟）隐显混合信息／知识构成的概念“能指、所指”往往呈现出生态多样性，在理论中变得越发生动活泼跳跃。人机之间的理论、概念、知识、信息、数据之间是弥散膨胀关系，为了不失真，它们相互之间的转换效率需要用某种方法来衡量，这些表征就是我们要寻找的关键点和突破口。概念在很多时候可能没有内涵、外延之分，只有意向一致性的达成。人机融合后，整个系统的输入、处理、输出会发生不少变化。首先，通情达理（这里的“理”包括伦理和道理）就是意向到存在的信数。人的信息与机的数据可以通过信数这个新中介形式进行融合，这个中介信数是由一个矢量＋一个标量或一组矢量＋多组标量构成的矢标量（还是矢量）值，通过信数这个矢标量值进行人机融合关系程度优劣的初步判定，即输入阶段的评价指标。即通过人的价值取向有选择地获取数据的过程，这个输入过程中不但有客观数据与主观信息的融合，还包括人的先验知识和条件。其次，在人机信息／数据融合处理过程中，人的非结构化信息架构（如自然语言）会变得结构化一些，而机的结构化数据语法会变得非结构化一些，在这种半结构化的情境中，不但要使用基于公理的推理，还要兼顾结合非公理性推理，使得整个推理过程更加缜密、合理。最后，在决策输出阶段，人常常将脑中若干记忆碎片与“五感”接收到的信息综合在一起，跳过逻辑层次，直接将这些信息中和的结果反射到思维之中，形成所谓的“直觉”，其结果的准确程度在很大程度上取决于一个人的综合判断能力，而机器则是通过计算获得的结果——“间觉”进行间接评价，这种把直觉与“间觉”相结合的独特决策过程就是人机融合智能输出的一大特点。概而言之，人机融合的关键应包括：多样与灵活弥聚的表征、公理与非公理混合推理、直觉与“间觉”交融的决策。


    人机混合智能与人机融合智能有着本质的区别。混合是两种物质混在一起，没发生化学变化，仍是两种物质，如把沙放进水里；融合物是由两种或两种以上元素组成的物质，指的是
    一种物质，如一氧化碳（CO），是由碳（C）元素与氧（O）元素组成的。人机混合智能中人机界面分明，然而，随着自主系统的不断发展，人、机在物理域、信息域、认知域、计算域、算计域、感知域、推理域、决策域、行为域的界面越来越模糊，你中有我，我中有你，融合在一起的趋势越来越显著，所以，用人机融合智能能够更好地反映人机之间的本质关系。


    人的感觉常常是嵌套混合贯通联合的，视觉中包含着听觉、触觉、嗅觉和味觉，机器的信号采集/数据输入则是单纯唯一独立分离的，各种通道模态之间没有融合交叉。人与机的感觉秩序大相径庭，刺激与数据、信息与信号差异太大。对人而言，未感觉到的刺激往往被隐藏在感觉到的刺激里，进而形成无意识感觉或下意识感觉。不难相信，这种联觉或迁移觉在文字、词语中也有着相似的机理。机器的这种能力至今尚未被开发出来，这或许是人机融合智能方面的一个瓶颈吧！如何打破“人擅计、机长算”的基本架构，数据全息表征的输入至关重要，这其中不仅有显性的个别数值体现，还有默会的众多关系作用。人的“看”里包含了大量的其他感觉到的东西，如听觉、触觉、嗅觉、味觉，这些联觉都潜在视觉里，机器的“看”没有联觉、统觉，机器听觉等也莫不如此……另外，情境中每个东西都有众多属性和关系，当前的打标就是九牛一毛，往往打标后挂一漏十白白损失了大量的信息，所以现有的“人工”智能中的数据标注工作值得商榷。深入下去，人对这类复合信息的加工也应该是复合并行地处理：既有逻辑清晰的推理过程，可谓之达理，更有感性丰富的动情发展，可谓之通情；既有基于公理的显性信息的分析，也有基于非公理的隐含信息的综合，慢慢形成显、隐理解的共存，进而演化为显、隐意向性，为下一步的规划决策做好准备。在完成情境任务目标的价值驱动下，显性的意向性可以变成理性决策，隐性的意向性可以演化成直觉决策。


    在传统的人工智能研究中，联结主义的代表形式是人工神经网络，主要处理数据；行为主义的代表形式是强化学习方法，主要处理信息（奖惩后有价值的数据）；符号主义的代表形式是知识图谱和专家系统，主要处理知识和推理（有限的知识及推理）。三者有递进的味道，但与人擅长的概念产生和理论建立相距甚远，尤其是在情感化表征、非公理性推理和直觉决策等方面，机器更是望尘莫及。另外，机器学习中的反馈、迭代的生硬艰涩滞后性与人相比也比较低级，这是因为人的态势感知能力不但来自科学技术，还源于社会学、史学、哲学、文学、艺术等多方面的素养与思维技能，进而产生价值取向（态势感知的基本预设是：人可以发现未来的动向并影响它的进程）。这恰恰是机器做不到的，所以机器暂时还只是单一领域的擅长者（如围棋、国际象棋等）。一般而言，机器在定义域（人为规则）中比人存储量大且准确、数据处理速度快，人非定义域（自然情境）中比机器灵活且深刻、信息融合能力强。人的优势是画圈（划分领域/定义域），机的优势是画圆（精确执行），人机融合的优势则是既能画好圈又能画好圆（可跨域实现目标），正可谓人心所想，机器所为。当今的人机融合产品还是共性的（谁都可以用，如手机、电脑），个性化服务的人机智能融合还未真正出现，但原始级别的系统已经悄悄崭露头角（如个人辅助决策系统等）。


    对人而言，学习最重要的是忽略那些非关键的数据、忘记那些不重要的信息，从而在诸多事物及其之间发生的各种关系中游刃有余地进行特征相关、关联存在、统计概念、概率规则、把握因果。可惜的是，目前的机器学习不会忽略不懂忘记，人这种信息过滤的机理与价值取向判断有关，有点类似于决策机理，而机器则没有价值体系。从透视主义的角度来看，人的认知存在两类选择性透视，一是生理功能上的，如对可见光的感受；二是观念上的，如情境、理论和价值预设。生理功能上的意思就是说，我们选择认识什么不认识什么取决于生理感受与反映乃至内在机制；观念上的是指各种预设会使人在认识中放大、虚构和过滤目标。人的价值取向相应可分为生理性和社会性，两者都包含个性化与共性成分，并在不同的情境组合中转换、释放出来，形成风格各异的认知特点和规律。迄今，这些价值体系尚未赋予没有个性的机器。人类意向性的背后就是价值取向，即价值观伦理性（伦就是类和次序），让形式化（数据化）的机器产生价值取向就是让它产生意向性，即形式化的意向性，有道德、有伦理的机器或许可以由此实现。如果产生不了有价值取向的机器，这一切就难以起始。事实上，如何产生有价值取向的机器，就是如何使人的伦理道德像理性逻辑一样可描述化、程序化问题，即伦理如何变成道理再变成公理原理的进程。此外，人的深度学习也不同于机器的深度学习，人的深度学习是学校教育与社会教育的一致，在于理论与实践的统一，在于矛盾和悖论的协同……是一种内外共鸣的学与习；而机器的深度学习源于人工神经网络的研究，包含多隐层的多层感知器就是一种深度学习结构，深度学习通过组合低层特征形成更加抽象的高层表示属性类别或特征，以发现数据的分布式特征表示。两种学习机制的根本不同在于：一个经过思考和实践，一个就是仿真和模拟。


    为什么人类倾向于用概念、关系和属性做解释？这是因为任何解释都是在认知基本框架（常识）下进行的。人类认识世界理解事物的过程，其实就是在用概念、属性和关系去认知世界的过程。概念、属性、关系是理解和认知的基石，机器不能把不同性质的东西联系起来，人却可以将表面上无关的事物关联起来。为什么“整体不同于其部件的总和”？因为构成整体的部件（属性）产生了关系，有内在的

    '
