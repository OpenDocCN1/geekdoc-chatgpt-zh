    ## 总 序


    人类历史是一部探索自然和社会发展规律的编年史。无论是混沌朦胧的原始社会，还是文明开化的现代社会，人类对自身的所处所在都充满了与生俱来的天然好奇心。在历史发展的长河中，通过不断地传承、质疑、探索、扬弃，人类在认知自我、认知自然、认知社会的过程中集聚了强大的思想动能，为凸显人类理性光辉、丰富人类精神生活、推动人类社会持续进步提供了有力的精神武器。科学，作为运用范畴、定理、定律等形式反映现实世界各种现象的本质、特性、关系和规律的知识体系，既可以解释已知的事实，也可以预言未知的新的事实，在人类文明发展中始终扮演着重要的角色，随着人类对未知世界深入探索，在当今以至未来社会，科学知识的普及和传播必将发挥越来越重要的作用！


    2016年5月30日，习近平总书记在全国科技创新大会、两院院士大会、中国科学技术协会第九次全国代表大会上发表重要讲话，提出了“到新中国成立100年时使我国成为世界科技强国”的奋斗目标。总书记还强调，“科技创新、科学普及是实现创新发展的两翼，要把科学普及放在与科技创新同等重要的位置。没有全民科学素质普遍提高，就难以建立起宏大的高素质创新大军，难以实现科技成果快速转化。希望广大科技工作者以提高全民科学素质为己任，把普及科学知识、弘扬科学精神、传播科学思想、倡导科学方法作为义不容辞的责任，在全社会推动形成讲科学、爱科学、学科学、用科学的良好氛围，使蕴藏在亿万人民中间的创新智慧充分释放、创新力量充分涌流。”从中可以看出：科学普及不仅是推动经济发展、提升公民科学素养的必要手段，而且也应该成为高等院校和科研机构服务社会的重要职责。


    在当前国内科普图书市场上，原创科普佳作依然难得一见，广受关注和好评的还多数是引进版，这与我国科研水平快速提升的现状极不相称。近年来，科学普及受到全球各国政府、社会组织以及公众的高度重视，形成了快速发展态势，科学普及工作也有了很多新的变化。在现代科学传播理念的指引下，科学普及既要关注科学的产生、形成、发展及其演变规律，包括人类认识自然和改造自然的历史；也要关注自然界的一般规律、科学技术活动的基本方法和科学技术与社会的相互作用等问题。科学普及不仅要传播自然科学和人文社会科学知识，更要积极引导公众在德、智、体、美等方面的全面发展。因此，需要不断创新，务求实效。


    由重庆市科学技术协会主管、重庆市大学科学传播研究会主办、面向全国的《大学科普》杂志，自2007年创刊以来，始终以“普及科学知识，创新科学方法，传播科学思想，弘扬科学精神，恪守科学道德”为己任，致力于推动大学与社会的结合，通过组织全国科学家解读科学发现和技术发明，创作高水平的科普文章和开展丰富多彩的科普活动，激发公众的科学热情，传播科学精神和创新精神，在全国科普界独树一帜，影响深远，为提升全民科学素养做出了积极的贡献。


    十年磨一剑，砺得梅花香。《大学科普》杂志围绕广受公众关注的科技话题，通过严谨而细致的长期打磨，积累了丰富的高校科普资源，全国一大批科技工作者由此走上科普创作之路，在此基础上，组织一套原创科普佳作可谓水到渠成。科学出版社对科普工作高度重视，双方经过一年多的合作策划，形成了明确的丛书组织思路，汇集了全国众多来自高等院校和科教机构的优秀科普专家，以科学技术史、科技哲学、科学学、教育学和传播学等学科为支撑，将自然科学、工程技术科学和人文社会科学等融合传播，力求带给读者全新的科学阅读体验，真正起到激发科学热情、传播科学思想、弘扬科学精神的作用。在此，我们也热忱期待有更多科学家和科普工作者加入这一行列，为全民科学素养的提升、为国家创新发展贡献出智慧和力量！


    中国工程院 院士

    中国材料研究学会 理事长

    吉林大学 校长

    2017年3月20日


