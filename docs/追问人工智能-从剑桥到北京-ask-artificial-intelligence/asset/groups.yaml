    V2 区传至 V4 区，并进一步提取颜色、形状、色对比等中级视觉信息；中级视觉信息经过大脑 PIT 区传至 AIT 区，进而提取描述、面、对象等高级视觉信息并传至
    PFC 区；在 PFC 区进行类别判断，并根据已有的知识制定决策，然后在 PMC 区的动机的促发下产生行为指令并传至响应器官（手）；响应器官执行操作；至此，玩家的游戏机制已经完成。计算机在接收到玩家的输入（键盘、鼠标等）以后，根据游戏的内部逻辑更新游戏状态，并发送至输出设备（显示屏、音箱等）展示给用户，自此，计算机游戏环境更新完成。然后，玩家展开下一次游戏机理，并循环直至游戏结束或玩家放弃游戏。


