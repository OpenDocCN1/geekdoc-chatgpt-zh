    ## 3.1.2 IBM 未来几年的医疗人工智能计划


    IBM 在人工智能与医疗领域有核心能力：人工智能+新型硬件。它们计划实现：芯片比全球最好的实验室更厉害，微型摄像机能从分子层面上检验药片的真假，系统仅从语言中就能检测出某人患有心理疾病。IBM
    研究室已经开始着手把这 3 项研究变成成熟的医疗工具，将公司现存的机器学习和人工智能系统与硅片、毫米波相控阵传感器等结合。


    ### 1．AI+超成像系统，“看”到疾病和危害


    “超成像系统”是一种广范围的电磁波谱成像技术，不仅可以获取人眼可见光形成的图像，还能模拟超出此范围的电磁波图像。


    使用高性能相机和其他传感器，临床医生就能发现用药是否适合患者。“用这种超成像技术，人们就像长了第三只眼，能发现我们日常所忽视的线索。” IBM 技术总监拉希克·帕尔马（Rashik
    Parmar）说道。


    尽管实现超成像的硬件已经出现，但要使其进入市场，还需做更多的工作。能够进行广泛光谱成像的仪器不是什么新鲜事物，但区别就是 IBM 要将其简化、小型化，并降低制造成本，还要用认知算法来进行破译和可视化，让这项技术真正发挥作用。帕尔马还补充道，IBM
    现在有很多“花里胡哨”的发明，但让它们变为可用性较高的产品是有可能的。而在医疗应用上，简单的例子就是用超成像设备迅速看牙，或者为标准医疗射线检查提供更丰富的信息。


    也许在 IBM 计划的 5 年之内（从 2017 年开始），这种机器就会变成人们身边的药理学、毒理学专家——最终，这种超成像技术会被整合到手机中，在吃饭或服药之前可以先扫描一下，看是否有有害物质或致敏源等。


    ### 2．AI+芯片实验室，精细疾病早诊


    同时，IBM 也有可能会在几年内推出一种新的人工智能分析技术——芯片实验室（图 3-8）。这种设备相当于荷包大小，用一滴血或任意体液就能分析出细菌、病毒或预示着某种疾病的蛋白质。


    ![](img/ef229aad1bdee99cedbadb9122a34840.jpg)


    图 3-8 芯片实验室


    帕尔马表示，IBM 从 2011 年左右就开始探索“纳米纤维”这种概念了，那时是要做一种可以模拟气味的工具。如果将纳米纤维与其他种类的传感器相结合，就能用纳米结构来检验体液，包括唾液、血液、液体活检的样品，从中分析出潜在的疾病。结合数字化制造和
    3D 打印等技术，IBM 就能把传感器放入定制化探针，进行有效分析。


    相比需要等待数周的血检，芯片实验室不用花时间把病毒培养至能够被监测到的量，而是直接通过传感器来追踪最为细微的生物标记。


    这项技术最厉害之处在于，它能让人们在出现症状之前就了解自己患病的风险。举个阿尔茨海默病的例子，在出现明显症状之前的很长一段时间内，患者的神经状态已经产生了显著改变。如果定期检查血样，可以在阿尔茨海默病的早期就寻找到生物标记，迅速开始根据个人的情况制定治疗方案。


    虽然这种能从一滴血分析疾病的技术对人工智能的水平是个巨大的挑战，但真正考验 IBM 公司把此种产品推向市场的，还是技术难度超高的芯片。“芯片的最小测量级别为
    20 纳米，它能让你从一个相当细化的角度来观察病毒等物质，但要看到这个精细程度，在材料的制作上可要花费大量的心血。”帕尔马说道。


    ### 3．AI+文字信息，形成精神疾病模型


    精神疾病是又一个需要人工智能技术来仔细咀嚼大量数据，化作有效医学见解的领域。从 2015 年开始，IBM 尝试制造出能从人的讲话中诊断精神疾病的机器学习系统原型。在
    2018 年年初，IBM 公布了研究成果，59 名受试者中有 19 人在两年内患上了精神疾病，其余 40 人则一切正常，算法预测的准确率高达 83%。这套算法还能够区分近期罹患精神疾病的人群与正常人群的语言模式，并且准确率达到了
    72%。


    在精神疾病诊断中，患者的谈话一直是医生用以判断病情的重要因素。语速、音量、用语特点都可以用于判断精神疾病。现在 IBM 把这个分析工作交给了人工智能，患者与医生的交流或人们自己在社交网站上写下的话语都可以作为分析材料。


    IBM 之所以能做到这一点，是因为他们已花费数年时间来研究精神、心理障碍与语言之间的关联，建立起了一套测量体系。“我们目前提上日程的研究，是要弄清这件事：对于特定的个体来说，某段话中的某些用语，能否帮助我们理解这个人的心理状态？”IBM
    技术总监帕尔马说道。


    IBM 早已有过建立医疗模型的尝试：沃森最早的商业化尝试——“蓝色巨人”认知计算机系统就是癌症护理医师的助手。今天，公司还与医疗行业产生了不少的合作，建立各式各样的医疗认知工具原型。例如，IBM
    透露佛罗里达的地方医疗中心木星医疗中心（Jupiter Medical Center）就会引进 IBM 沃森的肿瘤辅助诊疗技术。另外，它还与纪念斯隆—凯特琳癌症中心合作了癌症治疗培训项目。


    除了精神分裂症、双向情感障碍和抑郁症等，IBM 还会从可穿戴运动健身设备和医疗设备处获取数据，来辅助诊断帕金森症等神经疾病。虽然现在已经有医药健康专家把可穿戴设备中的数据用在诊断判断上，但
    IBM 希望用机器学习来加速这个进程，并能提供额外的见解。


    帕尔马说，其实美国和欧洲已经有人做了可穿戴数据的实验，也有教授分享了实验数据，但没有人把这些数据综合到一起，研究这些数据中间是否有可关联之处，或者用整合的数据得出更深层次的理解。“用机器来处理和整合，恰好就是这个问题的答案。”


    ### 4．利用机器学习算法预测精神分裂症


    （1）IBM 科学家发现 AI 和机器学习算法能够以 74%的准确率帮助预测精神分裂症病例。


    精神分裂症是一种慢性衰弱性神经障碍，每 1000 个人中就有 7～8 个人会受其影响。精神分裂症患者可能会出现幻觉、错觉或思维障碍，还可能会出现认知障碍，如无法集中注意力；或身体缺陷，如运动障碍。


