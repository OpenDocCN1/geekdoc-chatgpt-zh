    ## 5.2.2 人工智能医疗初创公司分析


    根据蛋壳研究院的统计，国内和国外的人工智能与医疗初创企业一共有192家。其中，国内有83家，国外有109家（未包含基因技术为主的企业数据）。


    ### 1．国内企业图谱和融资情况


    国内有83家企业将人工智能应用于医疗领域，主要布局在医学影像、病历/文献分析和虚拟助手3个应用场景。而其中涉足医学影像类的企业数量达40家，远高于其他应用场景的企业数量。


    如图5-8所示，国内人工智能医疗企业近年来发展迅速。2013年至2017年，融资金额基本维持增长趋势，年复合增长率达到127%，高于全球100%的平均水平。2018年，国内融资规模仍逆全球大环境强势增长，基本呈现逐月上升趋势，如图5-9所示。总融资事件共39起，总融资金额达49.07亿元。


    ![](images/f721a4f219d4656dff2e6ece1251a6ca.jpg)

    图5-8 2013年至2018年国内人工智能医疗行业融资趋势


    ![](images/50069493f64087c2c64f634e80b5bd39.jpg)

    图5-9 2018年1～8月国内人工智能医疗行业融资趋势


    2014年出现了云知声、微医两个大额融资，直接推升了2014年国内整体融资规模。若排除云知声、微医的影响，2014年前后人工智能医疗的融资出现平缓波动的态势。2016年为国内人工智能医疗爆发元年，碳云智能、推想科技、达闼科技、图玛深维等知名企业相继融资。


    国内单笔融资金额快速增长，2018年人工智能医疗行业融资均额为12 582万元。医学影像、虚拟助手的“吸金”能力增强，加上融资轮次后移，使得国内融资均额大幅上升，如图5-10所示。


    ![](images/c5d8f069a791a89437541b75bc872ce2.jpg)

    图5-10 2013年至2018年国内融资均额（单位：万元）


    国内融资均额低于全球水平，主要是国内人工智能医疗起步较晚，行业成熟度低于国外水平。


    国内外人工智能医疗领域，天使及种子轮与A轮融资合计占比基本一致，但国内天使及种子轮融资占比15.38%，高于国外占比12%。这意味着，相比于国外的融资环境，国内人工智能医疗行业新进入者，依靠创新和团队较容易获得融资。另外，B轮和C轮的融资占比也高于国外，说明国内创投更注重人工智能医疗企业的数据和营收，如图5-11所示。


    ![](images/871e7731b97d67bd841efbc4ea992f9f.jpg)

    图5-11 2018年1～8月国内外融资轮次对比


    2018年天使及种子轮融资占比为15.38%，仅为2015年的三分之一，如图5-12所示。总体来说，国内人工智能医疗行业成熟度逐渐提高，融资轮次向成熟方向移动。


