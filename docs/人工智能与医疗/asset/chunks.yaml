    ## 自测用药

    自测用药是以临床专家经验为框架，以用户健康大数据为支撑的人工智能专家系统。该系统汇集了各大医院众多临床专家的用药心得及经验，不依赖医生及核心医疗资源便可为大基数人群提供专业的用药和养生保健指导服务。

    自测用药的智能系统构筑主要分 3 步：首先，对大量临床专家在疾病和用药方面的经验进行系统的归纳总结，找出其中普适性的规律，形成初步的智能系统。其次，随着用户数据的积累，系统会逐步优化数据采集及用药建议，让系统越来越贴近用户的症状及习惯。最后，在用户提交了相关症状后，系统会对用户信息提供有针对性的建议和指导，这些是由专家系统自动提供的，人工无须再次进行干预。这就是自测用药的核心算法所在。该系统覆盖了数十种常见疾病和亚健康症状，用户只需根据自身具体情况选择疾病的相关症状，其便可智能分析用户的疾病情况，并给出个性化的精准用药建议及日常保健预防等实用的非药物疗法指导。

    自测用药因为平台数据与药品相关，所以在商业模式的实现上可以对接药品购买渠道，通过软件将用户的需求导流到周边药店和权威医药电商平台，为用户提供选药、买药、预防等全方位的健康解决方案。


    ## 2.1.2 智能分诊、导诊机器人

    随着智能机器人技术和医疗的结合，智能导诊机器人成为医院一道新的风景线。导诊机器人属于服务类机器人，服务其机器人主要通过语音输入进行服务指导，可以应用于火车站、机场、餐厅、景点等多种场景，只是各自后台的知识库不一样。

    服务类机器人市场刚开始起步，2016 年我国服务类机器人的市场销售额是 10.3 亿美元，如图 2-8 所示。医疗导诊类服务机器人主要是通过患者的语音录入进行语义分析，然后给出医院的分诊和导诊建议，节约人力，方便患者。更先进的导诊机器人还能通过传感器收集患者的生命体征信息，给出更准确的建议。

    ![](img/af3f8281be4f3aa974c87f87a067ca8a.jpg)

    图 2-8 2012—2020 年我国服务类机器人销售额及增长率

    服务类机器人主要用于取代重复和简单的人力工作，大部分市场还处于空白状态，而且通过搭载医学相关知识体系，还可以用于家庭等服务场景。相较而言，导诊类服务机器人和家庭类医疗服务机器人是研究的热点，创新度较高。

