    投融资机构方面，2017年至2018年，入场国内人工智能医疗行业的投资机构共计139家，其中红衫资本、真格基金、软银中国、IDG、丹华资本、道彤投资和奋毅资本最为活跃。这7家投资机构主要涉足医学影像、药物发现、智能化器械、病历/文献分析，在这四大领域内的投资分别为7起、3起、3起、2起。


