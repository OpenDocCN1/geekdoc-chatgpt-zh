    ## 5.2.2 人工智能医疗初创公司分析


    根据蛋壳研究院的统计，国内和国外的人工智能与医疗初创企业一共有 192 家。其中，国内有 83 家，国外有 109 家（未包含基因技术为主的企业数据）。


    ### 1．国内企业图谱和融资情况


    国内有 83 家企业将人工智能应用于医疗领域，主要布局在医学影像、病历/文献分析和虚拟助手 3 个应用场景。而其中涉足医学影像类的企业数量达 40 家，远高于其他应用场景的企业数量。


    如图 5-8 所示，国内人工智能医疗企业近年来发展迅速。2013 年至 2017 年，融资金额基本维持增长趋势，年复合增长率达到 127%，高于全球 100%的平均水平。2018
    年，国内融资规模仍逆全球大环境强势增长，基本呈现逐月上升趋势，如图 5-9 所示。总融资事件共 39 起，总融资金额达 49.07 亿元。


    ![](img/f721a4f219d4656dff2e6ece1251a6ca.jpg)

    图 5-8 2013 年至 2018 年国内人工智能医疗行业融资趋势


    ![](img/50069493f64087c2c64f634e80b5bd39.jpg)

