    浙江大学在图像识别领域的研究处于全国领先地位，人工智能研究所目前有教师49人。值得一提的是，浙江大学的人工智能专业更加偏向于医疗，医工结合的人才培养是强项。


    浙江大学和微医合作建立的微医浙大睿医人工智能研究中心，集合了浙江大学计算机学院、信息学院、医学院、药学院等相关院系的技术优势，搭建了高校、企业、医院资源共享开放式的医学服务平台。


    南京大学的人工智能因周志华教授而在国内AI领域占据一席之地，他已培养了11名博士生、20余名硕士生。目前，南京大学有两个人工智能实验室，其中机器学习与数据挖掘研究所有教师12人、博士21人、博士后1人、硕士66人，智能化信息处理研究所有教师11人、博士9人、硕士43人。


    西安交通大学在人工智能研究领域也有不俗的表现，其人工智能与机器人研究所每年有在读硕士、博士生约110余人，学术带头人、所长为郑南宁院士。


    ## 5.4.2 人工智能医疗公司的AI人才现状


    据某行业内人士透露，现阶段不仅人工智能人才短缺，人工智能医疗人才更加短缺。其所在实验室中，前后两届毕业生中只有该人士自己从事医疗行业。该现象在高校中比较普遍，AI人才从事医疗行业的人数大约只占十分之一。为此，动脉网梳理了医疗创业公司的CTO、CEO和首席科学家的毕业院校与专业，如表5-7所示和图5-23所示。


