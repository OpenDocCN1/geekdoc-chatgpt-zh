    ### 产品介绍

    糖护士利用“数据采集设备+智能决策”的模式，为患者及产业链提供个人服务、企业服务及专业服务。在掌握了大量的数据后，糖护士进行了决策支持系统的开发，通过智能决策支持系统（IDSS），为用户提供自动化的、实时的、个性化的健康和健康管理建议，以及正确的行为路径。


    糖护士根据《美国糖尿病指南》和《中国2型糖尿病指南》，形成专家库和知识库，导入1000多万条数据，聘请了700名医生进行数据和结论的解读，形成了1万多个糖尿病真实场景。现在，只要患者的监测数据出来，他就可以得到实时的、个性化的专业互动和反馈，从而提高患者的依从性。


    ### 应用情况

    糖护士截取了2015年11月到2016年1月约30万名用户的268万条血糖数据。这些数据显示，糖护士用户的血糖达标率是69%，显著高于中国2型糖尿病患者血糖达标率39.7%，表征并发症发生率大幅降低。使用糖护士1年以上的患者相比使用半个月的患者，血糖达标率高出12%。


    ## 4．精神健康管理

    据世界卫生组织估计，心理障碍疾病占全球疾病总量的13%，目前全球几乎每10人中便有1人患有心理疾病，其中17人中有1人忍受着严重的心理障碍，这导致自杀成为人类死亡的第二大原因，每年有超过80万人死于自杀。越来越多的创业公司关注到心理疾病管理这一块。


    ### 企业案例


    ### Ginger.io

    Ginger.io成立于2011年，它创造性地提供了一个分析平台，能判断用户是否处于非正常的心理状态，是否应该进行适当的心理治疗。虽然每10个人中就有1个人患有心理疾病，大多数人对自己患有心理疾病是毫无察觉的。通过在合适的时间给予合适的帮助，心理疾病是可以治愈的。Ginger.io就是这样一个神奇的应用，通过大数据分析帮助用户早发现、早治疗心理疾病。


    ### 产品介绍

    Ginger.io能够通过深入分析数据，了解用户的心理状况。通过Ginger.io，用户也能得到无微不至的医师帮助，因为每个人都会有自己固定的手机使用习惯，一旦日常的行为习惯突然改变，负责的临床医疗团队就会接收到异常预警，做好应急准备，避免意外发生。


    Ginger.io通过观察用户活动的时间，和多少人通话，通过向用户询问几个简单的问题，以明白用户身体传达的信息。当情况发生改变时，Ginger.io会报告给身边的至亲好友，如家人、朋友、医生等。


    Ginger.io是一个以迹象为基础，数据为驱动，需求为核心的应用软件，其优势在于以下几个方面。


    （1）更容易获取数据。智能手机的加入使得医师更容易收集患者的信息，得到患者对测试的反馈结果。


    （2）自动展开分析过程。通过面向医师的网页图表，Ginger.io的行为分析引擎能够帮助医师更好地理解患者生理、心理状态的变化。


    （3）更加迅速地对患者提供帮助。当患者的分析结果显示处于情绪低谷，行为模式发生改变或缺少及时回馈时，Ginger.io会立刻通知医师提供帮助。


    [1] 本愿景由美国卫生和人类服务部制定。


    ## 2.9 基因测试

    近年来，基因领域的发展已经进入快车道，基因检测技术得到不断发展和完善，落地应用多点开花，检测价格不断下降，基因检测趋向大众化，海量基因数据的获得已不再是制约。


    图2-45所示为基因技术发展简史时间轴。


    ![](images/60e2e9c44939346eec6860270e2f1f96.jpg)


    图2-45 基因技术发展简史时间轴


    20世纪80年代兴起的聚合酶链式反应（PCR）、荧光定量PCR、一代基因测序技术和基因芯片技术奠定了基因检测和研究的基础。第一台高通量基因测序技术（NGS）测序仪是在2005年出现的，454生命科学公司推出了第一个焦磷酸测序原理的高通量基因组测序系统（Genome
    Sequencer 20 System），正式开启了第二代基因检测技术高通量基因测序技术的历史进程。


    仅仅过了10年多的时间，技术已经日趋成熟，检测成本也大大降低（图2-46）。现在单个基因组的检测成本已经降到1000美元以下，并且正在逼近100美元的时代。从成本和实验流程来说，NGS技术已经成为很多实验室和医院触手可及的基因检测工具。


    ![](images/2ca022472bfe587a030c30e2ac3dddcf.jpg)


    图2-46 基因测序的成本变化趋势


    新一代测序技术检测产生了海量的数据，并且还在以指数级速度增长。如果把基因记录的信息看作一维的（如疾病表型和测序得到的基因序列），那么这些数据间的关系便是二维的、多维的，数据间可能存在关系的信息量又比一维的数据本身高许多个数量级。


    在聚合酶链式反应和一代测序技术时代，每次检测能产生的数据量有限，结果判读和分析较为简单。随着检测技术的发展，对基因检测数据的判读也有了新的变化，目前对NGS得到的基因序列间及基因和表型间关系的分析，主要采用的是基于特定目标的统计学分析和确证法的方式，能发掘出来的信息量相对于基因序列中存在的信息来说非常有限，究其本质，NGS生物信息分析中的序列比对和记录本质上还属于比较低层次的运算，在更多意义上是对基因序列进行解码和记录，解读层面还很有限。


    单个人类基因组由约30亿个碱基对组成，编码约23 000个功能性的基因。要掌握自己的健康状况，必须先对这些基因密码进行剖析，基因检测就在做着这种解码工作。基因检测与精准医疗临床应用最大的制约就在于基因检测的结果过于复杂，人脑难以处理如此多的数据。


    随着数据的不断积累，对数据的准确注释、解读及其如何对临床产生应用价值成为基因产业下一步发展的关键。分析能力和大数据库是遗传解读和咨询的关键，信息的解读与整合成为基因相关企业的核心竞争力。


    ### 1．切入方式

    如何解读基因的奥秘，是当代生命科学界的一大难题；如何通过解读基因大数据，获取与疾病相关的变异，找到致病基因，是基因应用于精准治疗、药物研发、个人健康管理并产生影响的核心环节。基因检测通常包含两个方面：基因测序和基因解读。在基因检测趋向大众化的过程中，其中的基因解读仍然是目前发展需要突破的瓶颈，人工智能便依靠其强大的数据处理能力和学习能力切入基因序列解读的进程中。


    目前，我国卫计委批准用于临床的基因检测项目有4类：遗传病诊断、产前筛查与诊断、植入前胚胎遗传学诊断和肿瘤诊断与治疗。这4类项目的共同特点是疾病仅与一个或者几个易感基因相关。实际上，除了单基因遗传病之外，其他疾病易感基因的多少，取决于对该疾病的研究程度。


    人类的生命信息承载于基因里，经转录传递到核糖核酸（RNA），再传递到有生物活性的蛋白质，最终由蛋白质实现所有生命活动。在这个过程中存在两个基因变异引发的疾病或基因剪切变异导致的疾病。


    人群中的DNA突变（单核苷酸位点变异，SNVs）总数数以亿计，其中突变频率大于1%的称为SNPs（单核苷酸多态性），SNPs大概有300万个。要研究疾病与SNPs之间的关系，需要巨大的患者样本量，统计出患者群体与正常人群体SNPs之间的差异。根据目前基因检测的思路，是很难对这些人的SNVs进行分析的。但是人工智能的到来给这一海量数据集的研究带来了新方式。


    接下来以Deep Genomics人工智能参与基因解读的技术手段为例，介绍人工智能在基因解读领域的技术切入点。


    Deep Genomics主要关注的是基因转录过程中的变异。他们首先建立一个初始基础数学模型；其次将健康人的全基因组序列和RNA序列导入，对模型进行训练，让模型学习到健康人的RNA剪切模式；再次通过其他分子生物学方法对训练后的模型进行确认和校正；最后使用目前已知的病例数据，检验模型判断的准确性。


    针对基因变异导致的疾病的研究方法类似。首先进行DNA提取、测序，测完序之后进行分析和过滤，过滤完之后使用一些通路分析结果进行筛选，获取关键变异。基于这些变异和基因的信息，把它们的频率和个数进行累加，获得特征数据，然后开始做机器学习。


    ### 2．发展情况

    目前，基因企业都意识到了基因解读的瓶颈，Illumina、华大基因、贝瑞和康等龙头企业已经走在了前列，纷纷将人工智能纳入自己的分析体系。


    其实早在2014年时，IBM就与纽约基因组中心展开了合作，基于IBM的沃森人工智能系统开发了一个专门分析肿瘤基因组的程序，称为“沃森基因组分析”。这个团队在患者身上试用了这个程序的β版本，它可以从超过2700万篇生物医学方面的论文中寻找针对特定基因变化的靶向治疗方案。


    IBM在最近发表在《神经病学遗传学》（Neurology Genetics）杂志上的一篇文章中披露了他们利用人工智能针对脑瘤基因组的研究成果，科研人员从患者身上获取了肿瘤的活检样本及一份血样，并对两份样品中的DNA和肿瘤中的RNA进行了测序。


    为了进行比较，这些测序数据被分别送给了IBM沃森基因组程序和一个由生物信息学家、肿瘤学家组成的专家团队进行分析。沃森系统仅仅用了10分钟就完成了一份可供参考的临床治疗方案报告，而专家组的人工分析花了160个小时才得到一份相似的报告。沃森系统甚至还找到了更多的可能进行靶向治疗的基因突变。


    人工智能在基因解读领域带来了人类不曾拥有的能力，让人类有机会用数字描述生命。相信在不远的将来，这样的场景将会出现：基因检测由专业检测机构完成，结果分析交给人工智能，临床医师只需要最终结论，用这个结论去指导治疗，进行精准的健康管理。


    基因领域的企业融资理由绝大部分是基因技术和生物技术，与人工智能的关联度不大。基因行业本身近年来融资额度大，频率高。所以，在后续章节的人工智能企业融资盘点中没有考虑纳入基因行业表表2-23所示的是人工智能+医疗基因行的投融资情况。


