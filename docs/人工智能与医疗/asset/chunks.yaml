  trans: '


    ## 1. 肺结节筛查

    肺结节类医疗人工智能产品无疑是目前最热门的方向，据不完全统计，截至 2018 年 7 月，仅在肺结节筛查领域，有具体产品的人工智能企业就有 20 余家，并且大部分企业都得到了投资，如表
    2-5 所示。


    表 2-5 肺结节筛查类产品落地情况举例


    ![](img/f47488f6baa1aba55b5d4a895fef50a4.jpg)


    续表


    ![](img/f096229008966af6464495fd32979b90.jpg)


    我国年新增肺癌患者数量和年肺癌因素死亡人数皆位居全球第一，早筛需求大，低剂量螺旋 CT 正被广泛推广；而从图像质量上来说，胸部 CT 图像分层薄、视野清晰、干扰因素少、病灶特征有规律可循，是智能影像判读的理想工具，加之我国影像医师的稀缺及国家政策的大力推动，这一领域的应用基础堪称完美。


    2017 年，主攻肺结节检出的各大 AI 企业都交出了辉煌的答卷，敏感性从 95%、96.5%、98.8%一路提升，人类肉眼难以察觉的像素差别，在 AI 强大的算力面前无所遁形。


    临床上为了确保影像判读的准确性，通常由一名执业医师与副主任医师共同阅读同一个患者的胸片。影像医师在读片完毕之后，还需要上级医生复查一遍，签字确认。AI 的目的正是替代这个步骤中的第一个环节，因为
    AI 医生不仅“视力”极好，几乎可以看出每一个微小结节，同时还不知疲倦，不会出现视觉疲劳，看成千上万张胸部 CT 也不过毫秒之间。


    目前，人工智能肺结节筛查产品已经全面进入落地医院环节，投入人工智能的企业日均检查量已经超过 10 万例。在合作方式上，因为目前没有明确的收费项目，肺结节筛查类产品主要以两种方式进入医院：一是以科研项目的方式同医院合作；二是同器械厂商合作，以整体服务包的形式进入。


    ## 2. 糖网病筛查

    糖网病是糖尿病性视网膜病变的简称，是常见的视网膜血管病变，也是糖尿病患者的主要致盲眼病，图 2-21 所示为糖网病的主要症状和检查点。我国是全球 2 型糖尿病患者最多的国家，随着糖尿病患者的增多，糖网病的患病率、致盲率也在逐年升高，其是目前排在第一位的致盲性疾病。


    ![](img/e47fe6453d0fb48c2bc18705b4595167.jpg)


    图 2-21 糖网病主要症状和检查点


    医学研究证明，高血糖、高血压、高血脂是糖网病发生的重要危险因素。


    因为糖网病早期往往没有任何临床症状，而一旦有症状，病情就已经较为严重，容易错过最佳治疗时机，所以糖网病的治疗效果取决于治疗是否及时。但是由于我国眼科医生匮乏、居民重视程度不高，目前我国糖网病筛查的比例不足
    10%。


    国家卫生计生委办公厅在 2017 年 3 月发布的数据中，用患病率、发病率和患者情况说明了我国糖网病的现状：我国各地区流行病学调查显示，糖尿病黄斑水肿与临床有意义的黄斑水肿在糖尿病罹患人群中的平均发病率分别为
    5.2%（3.1%～7.9%）和 3.5%（1.9%～6.0%）。


    图 2-22 所示为我国糖网病发病率统计。


    ![](img/39ab4ac3b61060e1fecff3d5feb4a5f4.jpg)


    图 2-22 我国糖网病发病率统计


    2017 年年度国际糖尿病联盟（IDF）发布的统计结果显示，2017 年全球有 4.25 亿名糖尿病患者，比 2015 年增加了 1000 万；此外，还有
    3.5 亿多糖尿病高危人群；预计到 2045 年，将会有近 7 亿名糖尿病患者。而在所有国家中，糖尿病人数最多的就是中国，达 1.14 亿。我国的 1 型糖尿病患者数量在全球排第四位^[2]。据了解，2017
    年，我国 87%的糖尿病患者就诊于县级及以下医疗机构，可是治疗糖网病的基本诊疗措施和适宜技术大多在三级医疗机构，基层医疗机构不具备这个实力。


    部分糖网病的流行病学结果显示：50%以上的糖尿病患者未被告知应定期进行眼底检查，近 70%的糖尿病患者未接受规范的眼科治疗，约 90%具有激光治疗指征的糖尿病视网膜病变未得到治疗。在应接受激光治疗的患者中仅有
    20%的患者接受了规范的激光治疗。


    患者数量巨大，但是我国眼科医生数量很少。据 2016 年卫计委统计^[3]，我国目前只有 3.2 万名眼科医生，其中，从事眼底医疗服务和研究的医生有 800～1000
    人，相对于 2700 多万名糖网病患者来说，眼科医生严重不足。


    而 2015 年的 IDF 报告显示，2015 年全球医疗消费中，11.6%花费在糖尿病治疗上，金额为 6730 亿～11 970 亿美元。我国糖尿病导致的直接医疗开支占全国医疗总开支的
    13%，达到 1734 亿元，主要是因为糖尿病患者医疗服务的次数是非糖尿病者的 3～4 倍，其住院和门诊次数较多。另外，中老年群体有一定的财富积累，支付能力较强。


    这样算下来，平均每个糖尿病患者每年在糖尿病治疗上的花费为 1 万元以内，所以花费几十块钱去做一次筛查并不是很大的开支。糖网病筛查没有得以普及，一方面是因为医生少、患者多，另一方面也存在以下一些客观因素。


    （1）糖网病患者基数大，增长快，眼底设备的普及速度远远无法满足需求。但是由于眼底设备昂贵，对于欠发达地区来说，大量采购并不现实。


    （2）随着人们对糖网病筛查的重视及国家的推进，眼底读片的需求在增加，现有医生已经无法承担这些工作量，导致医生过劳，误诊、漏诊的情况出现。另外，有经验的医生也并不愿意一直做读片的工作，他们希望有更多的时间做一些研究，发现新的成果。这就导致医生的数量更加稀少。


    （3）从事眼底读片的医生培训速度慢，存在差异性，导致不同的医生读片结果存在差异，致使诊断结果缺乏定量信息。


    （4）眼底读片的数据管理与分析操作难度大，现状是数据简单存档保存，但数据整理工作量大，因此读片数据再次利用的难度很大。


    （5）糖尿病患者往往因为高龄或罹患全身多系统并发症而出行不便，居住地又距地区内有足够眼病服务能力的医疗机构较远，在医疗机构等待或检查时间又较长。


    以上问题主要是由医患供需不平衡导致的，而图像识别是人工智能的专长，利用人工智能进行初步筛查，将大大改善目前糖网病筛查的现状。


    目前，利用 AI 进行糖网病筛查的有 9 家公司，如表 2-6 所示。


    表 2-6 人工智能糖网病筛查公司


    ![](img/2da810b19d3d355ff6b8324c6d85e03c.jpg)


    除了爱尔眼科外，其他 8 家都是创业公司，有 3 家公司的注册时间是 2015 年，4 家公司的注册时间是 2016 年，都还是很“年轻”的公司。9 家中有
    7 家可以在网上找到融资信息，1 家是天使轮，5 家是 A 轮，2 家是 B 轮。这些公司中，上工医信、肽积木、上海孚视、Big Vision、致远慧图、爱尔眼科
    6 家公司都专注于眼科领域。体素科技、泰立瑞和 Airdoc 的业务广泛一些，涉及其他的影像产品。


    在临床实验阶段，使用人工智能进行糖网病筛查的流程为：患者利用手机、手持式眼底照相机及专业眼底设备拍摄眼底照片，上传到系统或者云端，然后输入自己的病史（也可以由医生输入），系统就会自动给出辅助参考意见。


    需要后续深度检查治疗的患者交由医生复查，对无糖尿病视网膜病变、轻度无须后续深度检查治疗的患者，给出健康指导建议。


    据肽积木首席执行官柏文洁介绍，利用肽积木 AI 技术，13～15 秒就可以完成一张眼底图片的病灶标记，而医生需要 3～5 分钟——在保证准确率的前提下，速度提高了
    20 倍左右。


    上海长征医院魏锐利教授如此评价 Airdoc：“有了 AirdocDR 这个系统，可以把我们专业医生的手和我们的检查技术延伸到全国各地。也就是说，在任何一个角落，手机拍摄的和专业仪器拍摄的影像都可以传输到云中，进行辅助分析，获得准确建议，让患者在任何时候都可以得到早期的预防和辅助分析建议。”


    相较于管理血糖，借助糖网筛查更能帮助基层逐步建立慢病管理体系和提高慢病管理能力。卫计委的分级诊疗服务方案中已经说得很明确，眼睛的问题需要转诊，但是血糖、血压、血脂的严格控制，患者的定期随访和教育必须落实在基层。


    利用 AI 做糖网病筛查具有以下挑战和机遇。


    （1）眼科设备需要进步。目前的专业眼科设备价格昂贵，操作复杂，需要专业的人员进行操作，但是这种设备不利于大面积的筛查。对此，市场上出现了一些手持式的眼底照相机和利用手机改进的眼底照相机。


    如果进行大规模糖网筛查，手持式的眼底照相机是必不可少的设备，这一块的技术短缺将对 AI 眼底筛查技术的普及造成一定的影响，但是据动脉网了解，目前已经有很多家公司在合作改进这类设备。


    （2）需建立完善的标准数据库。企业或者医院收集一定数量的、由各种质量的眼底照片组成的影像数据，由政府牵头，聘请一批专家来做标注，做好等级分类；然后将这些图片输入各个创业公司的眼底
    AI 辅助诊断、筛查系统，对比系统与专家的标注结果，这样出来的准确性才有意义。


    这并非易事，数十万的数据标注需要的资金规模在数千万元，每个图像需要 5～7 个专家标注，这是一个很大的工作量，现实中如何落实，还需要政府、企业、医院多方讨论。


    （3）眼科全方位的服务。目前，医学人工智能主要应用在门诊和住院等环节，但是医疗服务环节众多，人工智能完全可以在其他环节发挥更大的作用，如术后跟踪和随访、药品作用反馈等领域。人工智能可以快速分析海量数据并生成相应模型，辅助医生对疾病发展和治疗进行更有效的追踪和随访管理。


    目前，不断有 AI 企业开始和当地卫计委合作展开眼底糖网病的筛查活动，活动项目由医保付费，企业落实。虽然现在还是实验阶段，但相信随着政策的完善和设备的更新，人工智能必将助力糖网病的筛查、糖尿病的管理和分级诊疗的落地。


    ## 3. 靶区勾画

    靶区勾画与治疗方案设计占用了肿瘤医生的大量时间。


    病人被确诊为肿瘤时大多是很恐慌的，身体上出现一点风吹草动都要去问医生，而一些著名三甲医院的肿瘤科通常人满为患，医生除了要看病，还有科研等其他的工作任务，面对患者没完没了的追问，他们也会感到烦躁。


    基层医疗机构肿瘤科医生缺乏经验，很多时候他们不敢轻易地为患者做治疗方案，只能转诊，这又加剧了三甲医院医患的矛盾。所以，利用新科技来提高医生的效率，提高基层医生的治疗水平与自信心是医院很关心的事情。


    放疗是肿瘤三大治疗方式中最主流的治疗方式（其他两种是手术和化疗）。相较于诊断，治疗更切入医疗的核心。每个肿瘤患者的 CT 图像在 200 张左右，医生在勾画的时候，需要给每个图片上的器官、肿瘤位置进行标注，图
    2-23 即智能靶区勾画的软件界面。这个过程按照传统的方法来做，要耗费医生 3～5 个小时，找到肿瘤的位置之后，医生还需要根据肿瘤的大小、形状等设计放射线的具体照射方案或者手术方案，这里面也包含了不同位置所需的不同放射剂量。


    ![](img/103de051d55e425a42944236c73e39e8.jpg)


    图 2-23 智能靶区勾画的软件界面


    如果一切顺利，患者按照医生最初的设计方案治疗、好转，最后康复。但有些时候事与愿违，第一个疗程的治疗或许由于靶区勾画不准确或者肿瘤的变化，导致治疗无效（肿瘤组织减少小于
    30%），这个时候就需要更改治疗方案，需要医生重新为患者做勾画，做方案。


    我国肿瘤患者的平均等待时间为 2～3 周，医生把时间放在一个患者身上，另一个患者就要继续等待，而这有可能会错过最佳治疗期。


    靶区勾画与治疗方案设计具有一定的技术含量并需要医生的经验，但是其中包含了大量的重复工作，这些劳动密集型的工作是人工智能的专长，利用 AI 做这些事情将节约肿瘤医生大量的时间。


    肿瘤科信息系统将肿瘤治疗过程中各独立分系统、各环节产生的数据信息对接，然后整合，进行肿瘤治疗流程的控制和管理，同时实现肿瘤科的质量控制。流程大概是：系统根据具体癌症类型自动生成
    CT 的检查项目，然后根据 CT 图，利用图像识别技术和 AI 技术自动勾画相应靶区。系统自动生成具体的放射性照射方案或者手术方案后，再交由医生做最终确认。为了做好质量控制，系统会全流程跟踪上述步骤及之后的治疗和检查结果。


    以往医院没有这个系统的时候，医生将等候 2～3 周把患者的资料下载下来，用 3～5 个小时进行靶区勾画，然后再花时间进行治疗方案设计。使用该系统以后，医生下载的资料包含了系统自动勾画的靶区和放疗方案或者手术方案，医生只需修改、矫正就好。


    目前，连心医疗在乳腺癌、鼻咽癌、肺癌、肝癌等癌种方面技术相对成熟，自动勾画的靶区与医生勾画的重合度在 87%以上。在这一领域布局的公司还有医诺科技、全域医疗和普润医疗等。


    ## 4. 脏器三维成像

    脏器三维成像是指人工智能以核磁共振、CT 等医学影像数据为基础，对目标脏器定位分割，在计算机上显示患者的内部情况。将患者的核磁共振、CT 等病情影像数据输入，在计算机上显示患者的内部情况。医生手中的探针指向哪里，系统即实时更新显示，让医生对患者的解剖位置一目了然，使外科手术更快速、更精确、更安全。图
    2-24 所示即为脏器三维成像 VR 演示。


    ![](img/c8e9263e87d9a6efa3efb0c812dda7de.jpg)


    图 2-24 脏器三维成像 VR 演示


    自动重构器官真实的 3D 模型，能够使医生通过专用设施在增强现实的虚拟空间里全方位、直接观看到患者真实人体结构的解剖细节，并通过手势和语音操作实时进行器官和病变的立体几何分析，精确测量目标结构的区位、体积、径线和距离等参数，同时还能使医生进行虚拟解剖作业、模拟手术切除、手术方案设计和手术风险评估。


    脏器三维成像产品最早出现在手术导航系统中，但早期准确率不高，随着人工智能的加入，成像结果趋于准确，逐渐为医生接受。脏器三维成像主要应用于外科手术中，能够将患者术前或术中影像数据和手术床上患者解剖结构准确对应，帮助医生了解病灶与器官管道系统的相互关系，计算器官和病变体积，从而确定手术切除线路，可以极大地提高外科医生的手术精确度，减小手术创面，最大限度地减轻手术患者肉体上的痛苦。


    目前，国内提供相关产品的公司包括医软科技、昕健医疗、海纳医信、锐达医疗、联影医疗和睿佳科技等。脏器三维成像依托于手术导航系统，产品落地速度相对较快；广东省人民医院、上海交通大学医学院附属仁济医院、陕西省人民医院等三甲医院均有使用。


    其病理分析如下。


    病理学家通过检查患者生物组织样本之后所做的检查报告，通常是许多疾病诊断的最终确定指标。尤其是癌症，病理医生的诊断对患者来说意义重大。但是病理切片的审查是一项非常复杂的任务，医生需要多年的培训才能获得专业知识和经验，所以病理医生数量远远不能满足需求。


    我国病理医生极度缺乏。《中国卫生和计划生育统计年鉴 2016》显示：我国病理科执业医师（含执业助理医师）只有不到 1.5 万人，与国家制定的每 100 张床配备
    1～2 名病理医生的标准差距悬殊，我国病理医生的缺口总数可达 10 万人。


    即使经过严格训练的病理医生，他们对同一个患者的诊断也存在差异性，这种差异性是造成误诊的重要原因。例如，医生对某些形式的乳腺癌和前列腺癌的诊断一致性的比例低至
    48%。


    医生所做诊断缺乏一致性并不奇怪，因为要想做出准确的诊断，医生必须在大量的检查信息上进行判断。通常情况下，病理医生负责审查病理切片上可见的所有生物组织，但是每个患者都有很多病理切片，经过
    40 倍放大后每个切片上都有 100 多亿个像素。想象一下要浏览 1000 多个百万像素的图片，还要为每个像素负责，这需要阅读大量的数据，但是医生的时间往往是不够的。


    为了解决有限的时间和诊断准确性的问题，将人工智能引入数字病理学研究成为最好的办法。人工智能可以缩短病理诊断的时间，提升诊断效率，最主要的是还能提供更加准确的诊断结果。人工智能的有效使用可以真正帮助病理医生提升判读水平，从精准诊断开始，真正实现精准医疗。


    人工智能的参与给数字病理研究带来了革命性的变化。谷歌公布了其利用深度学习算法辅助病理医生工作，确定病理图像是扩散到淋巴结的乳腺癌还是扩展到临近乳房的乳腺癌的情况。


    他们使用标准的深度学习方法，如`GoogLeNet`^[4]，尽管产生的肿瘤概率预测热图有点嘈杂，但已经达到了普通医生水平。在经过将训练神经网络放在不同放大倍数的图像上进行学习之后，算法的定位得分（FROC）达到
    89%，显著超过没有时间约束的病理学家的诊断得分 73%。


    目前，国内已有多家企业将人工智能引入病理学的研究（表 2-7）。


    表 2-7 国内使用人工智能进行病理分析的公司


    ![](img/c72e9fd1317285106b0b920949bccbf8.jpg)


    迪英加团队是国内最早的一批从事病理研究的研究人员。依托于其积累多年的数字病理影像图库，他们开发出了人工智能辅助诊断系统，可以在普通计算机上以 5～10 秒的速度处理和分析数据大小超过
    1GB 的全场扫描数字病理图像，对几种癌症的良性和恶性判别准确率高达 98%以上。


    泰立瑞采用的是移动端采集方案+云端解决方案，大大地降低了病理分析门槛；兰丁高科通过建立云平台的方式，将病理资源进行跨地域整合，云端收集数据并对算法进行实时优化，不断提高诊疗的精确度。


    ## 2.3.4 人工智能医学影像公司调研

    我们对目前人工智能医学影像公司的运行情况进行了实际调研，得到了如表 2-8 所示的调研数据。这张表充分反映了人工智能公司数据来源、数据量及落地情况。但由于各个公司处于不同的发展阶段，所采用的市场策略也不同，因此该数据只具有反映行业发展情况的价值，没有对比分析的价值。


    表 2-8 人工智能医学影像公司产品应用情况


    ![](img/5db531ea55dd6b1176620bf3ea7f015e.jpg)


    续表


    ![](img/5a9a25a27c4d2b9efb6e3a0ba62d985a.jpg)


    ☆真阳性：要评估的技术判定为有病（阳性）且金标准也判定为有病的病例数（用`a`来表示）。


    ☆真假阳性：要评估的技术判定为有病（阳性）而金标准判定为无病（阴性）的病例数（用`b`来表示）。


    ☆真假阴性：要评估的技术判定为无病（阴性）而金标准判定为有病（阳性）的病例数（用`c`来表示）。


    ☆真阴性：要评估的技术判定为无病（阴性）且金标准也判定为无病的病例数（用`d`来表示）。根据以上 4 个数值就可以得出这种方法的敏感性、特异性、阴性预测值和阳性预测值。


    敏感性=`a/(a+c)`。敏感性也称真阳性率，反映某种方法判定某病变的漏诊率。敏感性一般以百分数表示，敏感性越高，则漏诊率越低。用来筛查某种疾病的方法必须敏感性高，这样才能减少漏诊。


    特异性=`d/(b+d)`。特异性也称真阴性率，反映某种方法判定某病变的误诊率。特异性一般也以百分数表示，特异性越高，则误诊率越低。用来筛查某种疾病的方法并不一定要求特异性特别高，在一个合理的范围即可接受。


    从目前的发展情况来看，各个公司都很重视临床数据，在训练数据的时候都会用到临床数据，在创业初期是用公开数据集下载的数据来训练模型，后期随着公司的发展，逐步贴近临床。


    目前，无论是哪个公司，涉及哪科疾病，系统敏感性都超过了 90%，这个数据是医生最在乎的，因为如果敏感性差，没有查出疑似结节，医生就有可能要承担责任。浙江省人民医院放射科主任龚向阳表示，特异性和敏感性兼顾起来是很难的，所以很多公司在开发系统时会优先考虑敏感性的问题，在保证敏感性的前提下，提高特异性。


