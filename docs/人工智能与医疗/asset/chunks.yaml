    ## 7.3 《新一代人工智能发展规划》与大健康相关的四大部分


    笔者梳理了一下《新一代人工智能发展规划》文件中与大健康相关的四大部分。


    ### 7.3.1 2025年前初步建立AI法律、伦理和政策体系


    文件在计划的“三步走”战略规划中的第二步中指出，到2025年，国家要初步建立人工智能法律法规、伦理规范和政策体系，形成人工智能安全评估和管控能力；在第三步中指出，到2030年，建成更加完善的人工智能法律法规、伦理规范和政策体系。


    这个信息对于法律还是一片“空白”的医疗人工智能领域来说，意义深远。由于医疗人工智能是新型产业，不可能像传统医疗器械那样走审批流程，即使是拿去申报，鉴于医疗的严谨性，监管人员也会更加慎重。


    人工智能是快速发展的行业，有些产品是以3～7天为周期迭代更新的，有可能拿第一代产品去申报的期间，产品已经迭代几十次了，但认证还没有批下来。


    针对这种情况，美国FDA在2017年5月正式组建了一个专门致力于数字化医疗和AI技术审评的新部门，该部门包括13名软件工程师和开发人员、AI技术和云计算专家等。该部门的任务是为FDA准备好规范和标准，开始审评提交给FDA的AI产品和有机器学习功能的医健设备、器械或医用软件等。他们将重新规划智能医疗机器人、有机器学习特质的医疗设备应当采用哪种途径监管和审批。


    另外，作为医疗人工智能的基础——医疗大数据，目前还没有健全的法律来规范。数据的归属权、使用权、医疗数据的隐私标准、数据安全性、责任规范，以及法律能否包容创新所犯的错误问题等都没有明确的法律指示。


    缺乏法律规范虽然可以让医疗人工智能出现目前的繁荣景象，但是无规矩不成方圆，这样发展下去并不一定是好事。如果2025年以前可以形成初步的法律规范，那么虽然有可能出现行业洗牌的情况，但是会促进医疗人工智能更加健全地发展。


    ### 7.3.2 建立新一代人工智能基础理论体系和关键共性技术体系


    《新一代人工智能发展规划》中指出，国家会围绕增加人工智能创新的源头供给，从前沿基础理论、关键共性技术、基础平台、人才队伍等方面强化部署，并以算法为核心，以数据和硬件为基础，以提升感知识别、知识计算、认知推理、运动执行、人机交互能力为重点，形成开放兼容、稳定成熟的技术体系。


    同时，建设布局人工智能创新平台，强化对人工智能研发应用的基础支撑。人工智能开源软硬件基础平台重点建设支持知识推理、概率统计、深度学习等人工智能范式的统一计算框架平台，形成促进人工智能软件、硬件和智能云之间相互协同的生态链。


    如果人工智能的技术层和基础层能够得到快速发展，那么医疗人工智能产品会发展得更快。


    ### 7.3.3 加快培养聚集人工智能高端人才


    在人才建设方面，《新一代人工智能发展规划》中提到了以下3点内容。


    （1）培育高水平人工智能创新人才和团队。重视复合型人才培养，重点培养贯通人工智能理论、方法、技术、产品与应用等的纵向复合型人才，以及掌握“人工智能+”经济、社会、管理、标准、法律等的横向复合型人才。


    （2）加大高端人工智能人才引进力度。统筹利用“千人计划”等现有人才计划，加强人工智能领域优秀人才特别是优秀青年人才引进工作。完善企业人力资本成本核算相关政策，激励企业、科研机构引进人工智能人才。


    （3）建设人工智能学科。完善人工智能领域学科布局，设立人工智能专业，推动人工智能领域一级学科建设，尽快在试点院校建立人工智能学院，增加人工智能相关学科方向的博士、硕士招生名额。


    鼓励高校在原有基础上拓宽人工智能专业教育内容，形成“人工智能+X”复合专业培养新模式，重视人工智能与数学、计算机科学、物理学、生物学、心理学、社会学、法学等学科专业教育的交叉融合。


    动脉网曾经做过一次统计，在46位医疗人工智能创业公司的CTO或首席科学家中，有25位有海外留学经历，占比54%。这一政策的落地将有利于改善我国人工智能人才匮乏的现状。


    ### 7.3.4 发展便捷、高效的智能服务


    在人工智能应用方面，《新一代人工智能发展规划》中提到了以下两点内容。


    第一，智能医疗。推广应用人工智能治疗新模式新手段，建立快速、精准的智能医疗体系。探索智慧医院建设，开发人机协同的手术机器人、智能诊疗助手，研发柔性可穿戴、生物兼容的生理监测系统，研发人机协同临床智能诊疗方案，实现智能影像识别、病理分型和智能多学科会诊。


    基于人工智能开展大规模基因组识别、蛋白组学、代谢组学等研究和新药研发，推进医药监管智能化，加强流行病智能监测和防控。


    《新一代人工智能发展规划》中明确指出了开发手术机器人、人机协同临床智能诊疗方案、智能影像识别、病理分型和智能多学科会诊。这对于目前国内大多数人工智能医疗创业公司（如推想科技、依图科技、体素科技、Deepcare）来说是一个利好信号。但是基因组识别、蛋白组学、代谢组学、新药研发等领域国内参与企业较少，目前还是有很多机会的。


    第二，智能健康和养老。加强群体智能健康管理，突破健康大数据分析、物联网等关键技术，研发健康管理可穿戴设备和家庭智能健康检测监测设备，推动健康管理，实现从点状监测向连续监测、从短流程管理向长流程管理的转变。


    建设智能养老社区和机构，构建安全、便捷的智能化养老基础设施体系。加强老年人产品智能化和智能产品适老化，开发视听辅助设备、物理辅助设备等智能家居养老设备，拓展老年人活动空间。开发面向老年人的移动社交和服务平台、情感陪护助手，以提升老年人生活质量。


    从这条信息来看，人工智能涵盖的范围很广，物联网、健康大数据分析、智能硬件都属于这个范畴。


    按照这个思路延伸到其他行业，“三步走”战略规划中提到：到2020年，人工智能核心产业规模超过1500亿元，带动相关产业规模超过1万亿元；到2025年，人工智能核心产业规模超过4000亿元，带动相关产业规模超过5万亿元；到2030年，人工智能核心产业规模超过1万亿元，带动相关产业规模超过10万亿元。


    为了保障实施，《新一代人工智能发展规划》中还从组织领导、保障落实、试点示范、舆论引导4个方面提出了建议。希望国务院印发的《新一代人工智能发展规划》能够按计划落实，以促进人工智能行业健康、快速发展。


    ## 7.4 医疗AI企业的现实挑战


    虽然人工智能在医疗领域的应用能产生巨大的潜在价值，但是在现实中让人工智能达到预期效果仍要面临一些问题。尤其是在人才、技术发展、客观基础条件、数据壁垒、政府监管和市场培育等方面的挑战。


    ### 1．人才供需不平衡


    人才供需不均衡、人才成本过高严重影响了人工智能公司的发展。领英发布的《全球AI领域人才报告》显示，截至2017年第一季度，基于领英平台的全球AI领域技术人才数量超过190万人，其中美国相关人才总数超过85万人，高居榜首，而中国的相关人才总数也超过5万人，位居全球第7。


    然而，这些人才仍不能满足行业的需求。一些业内人士认为，国内的供求比例仅为1∶10，供需严重失衡。工信部教育考试中心副主任周明也曾在2016年向媒体透露，中国人工智能人才缺口超过500万人。


    ### 2．数据质量


    人工智能可以对人的意识、思维的信息处理过程进行模拟，可以像人一样思考，人工智能学习医生的经验就像我们上学时学习课本知识，因此数据的质量至关重要。医学数据中有很多无关的因素，如清晰度，图片亮度、图片是否干净等，这些技术之外的因素如果不处理好，很可能产生数据污染。


    ### 3．数据标注问题


    人工智能数据处理中80%的时间都是在做数据预处理工作，标注的准确性关乎结果的准确性。Airdoc训练的每张图片都经过数名顶尖专家标注，投票选择相同的标注内容作为标准。张大磊认为，接下来的2～5年之内，小样本学习在理论层面会获得足够的突破，近两年之内没有什么好的办法，还是需要大量医生去标注。


    ### 4．算法方向选择问题


    在医生的工作中，影像只是一部分，还有很多主诉和交流，但是目前人工智能尚处于弱人工智能阶段，并不能进行深入的沟通，因此，选择辅助分析算法时，需要选择更少沟通、更客观的方向。


    ### 5．数据监管问题


    医疗技术监督管理是卫生监督体系的主要组成部门，是规范医疗服务市场秩序的重要手段和方式，而人工智能刚刚应用到医疗领域，很多监管政策还没有制定，在接下来的发展过程中一定会遇到医疗监管的问题。


    ### 6．市场培养


    医疗被认为是人工智能最早落地的领域，但是医疗的特殊性对产品的要求会更高，从认识到被接受再到相应支付体系的完善，以及到医保的接入，都需要一个很长的过程。


    ### 7．政府监管


    目前，医疗人工智能行业还处于“跑马圈地”阶段，虽然国家出台了《新一代人工智能发展规划》，但在规划中指出，到2025年，国家才会初步建立人工智能法律法规、伦理规范和政策体系，形成人工智能安全评估和管控能力。也就是说，在这几年内人工智能几乎“无法可依”。


    [1] Airdoc：中国人工智能医疗行业领军企业，创建于2015年，创始人是张大磊。


    ## 附录


    ### 附录A 人工智能+医疗专业术语表[1]


    #### A


    聚合（Aggregation）：搜索、合并、显示数据的过程。


    算法（Algorithms）：一组用于人工智能、神经网络或其他机器的规则或指令，以帮助它自己学习；分类、聚类、推荐和回归是4种最常见的类型。


    人工智能（Artificial Intelligence）：机器模拟人类智力和行为做出决策、执行任务的能力。


    通用人工智能（Artificial General Intelligence，AGI）：尽管AI一词最初用于表达与人类智能相似的机器智能的含义，但在人工智能跌宕起伏的发展过程中，AI的内涵已经发生了变化，成为机器学习、统计分析的代名词，早已远离了一开始智能的初衷。在这种情况下，依旧坚守当年梦想的一小支学术研究者共同成立了通用人工智能协会。为了与传统人工智能或主流人工智能的AI用词相区分，故此增加“General”，并确定使用AGI词条作为领域正规称谓。


    人工神经网络（Artificial Neural Networks，ANNs）：也称为神经网络（NNs）或连接模型（Connection Model），它是一种模仿动物神经网络行为特征，进行分布式并行信息处理的算法数学模型。这种网络依靠系统的复杂程度，通过调整内部大量节点之间相互连接的关系，从而达到处理信息的目的。


    自主计算（Autonomic Computing）：系统自适应自我管理自身资源用于高级计算功能的能力，而无须用户输入。


    #### B


    大数据（Big Data）：指新技术带来的海量数据，如物联网和基因组学。这些数据集如此庞大，极其复杂，以至于我们不能用传统的应用程序对其进行分析。


    商业智能（Business Intelligence）：一系列理论、方法学和过程，使得数据更容易被理解。


    #### C


    聊天机器人（Chatbots）：聊天机器人通过文本对话、语音命令来模拟与人类用户进行对话，它们是有AI功能的计算机程序的常用界面。


    分类（Classification）：分类算法让机器根据训练数据给数据点进行分类。


    群集分析（Cluster Analysis）：一种无监督的学习方法，用于探索数据分析，以发现隐藏的模式或数据分组；集群的建模方法是类似于欧氏距离（Euclidean
    Distance）或概率距离的度量。


    聚类分析（Cluster Analysis）：一种用于探索性数据分析的无监督学习，查找数据中的隐藏模式或分组；群集的建立是通过欧氏距离或概率距离等定义的相似性度量。


    聚类（Clustering）：聚类算法让机器将数据点或项目分成具有相似特征的组。


    云计算（Cloud Computing）：构建在网络上的分布式计算系统，数据是存储于机房外的（云端）。在这里，这个概念并不是指购买应用后将其安装至你的计算机上，而是根据你的需求租赁应用并使用互联网访问它们。

