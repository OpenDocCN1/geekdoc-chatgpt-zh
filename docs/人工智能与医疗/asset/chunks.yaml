    ### 雅 森 科 技

    雅森科技成立于 2006 年，是国内最早专注于医学影像人工智能分析、核医学定量及 CAD 分析的高科技企业，专注于采用各类数学算法进行医疗图像处理、机器训练、大数据库比对、标准生物物理影像模型的开发与应用。

    雅森科技采用独创的专利数学模型，与国内多家重点医院联合开展脑、心、肺、甲状腺等脏器定量分析的科研合作项目；开发并验证特定疾病的生物数学分析方法，并不断组建正常人群组数据库；构建了多模态数据，引入影像、病理和病历等数据进行多数据源的综合分析。

    目前，雅森科技在脑部诊断方面已经有比较成熟的人工智能产品，正在北京协和医院做最后的数据验证。据了解，这是一款典型的多模态产品，可以通过核磁的数据、脑电图数据及量表数据，综合预测阿尔茨海默病发展趋势。

