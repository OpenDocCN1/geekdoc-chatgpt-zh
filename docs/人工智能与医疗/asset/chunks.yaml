    GPU 的每个架构，我们可以将训练一个模型所需的数百次迭代缩短至数天或数小时，从而提高工程师的工作效率。”


    ## 3.5.6 人工智能和医疗行业


    在人工智能领域，NVIDIA GPU 的大量应用使其一时风光无二。


    在医疗保健方面，医生将利用人工智能尽早检测疾病，了解人类基因组，治疗癌症，或者从大量医疗数据和研究中进行学习，提供最佳的治疗建议。负责 NVIDIA 医疗健康领域的金佰利·鲍威尔（Kimberly
    Powell）在公开场合表示：“NVIDIA 正和医疗领域研究人员探究人工智能在医疗方面的可能性，未来几年会扩大人工智能在医疗方面的应用。”


    金佰利·鲍威尔说道：“机器深度学习技术已经应用到医疗图像和大量的数据处理方面，人工智能将会在医疗领域发挥更多作用，如预测癌症，通过深度学习预测病人风险并提供解决方案。另外，
    NVIDIA 也将人工智能应用到了发现新药物方面。”


    除了强调在医疗领域的进一步应用，NVIDIA 在 2016 年 GTC 大会上就与麻省总医院临床数据科学中心达成合作：NVIDIA 凭借其技术，利用中心的
    100 亿份医学影像，进行深度学习训练开发，用于疾病的检测、诊断、治疗等场景。同年 11 月，NVIDIA 与美国国家癌症研究所、美国能源部合作启动“癌症探月”（Cancer
    Moonshot）项目，旨在开发出一套加速癌症研究的人工智能框架。这个新框架被称为“癌症分布式学习环境”，简称 CANDLE。


    黄仁勋表示：“GPU 深度学习给我们提供了一款应对重大挑战的全新工具，到目前为止，即使是最强大的超级计算机，在癌症研究方面也难以应对。通过与美国癌症研究所和能源部的合作，我们打造出了这款专门用于癌症研究的人工智能超级计算平台。”


    ## 3.5.7 使用 NVIDIA 产品的人工智能医疗项目


    在通用计算时代，NVIDIA 产品大多数是应用在生物医学的科研领域，用于基础研究，加速各种拥有大量数据的科研计算。同样，在人工智能时代，仍然有相当多的基础研究在高等院校或大型医院里面进行，如斯坦福大学、麻省理工学院、北德克萨斯大学、西奈山医院等机构就曝光过基于
    NVIDIA 平台的人工智能医疗项目，用于皮肤病、肿瘤等疾病的诊疗。


    ### 1．德国弗劳恩霍夫医学图像计算学院


    德国弗劳恩霍夫医学图像计算学院的研究人员正在利用 GPU 和深度学习提高癌症诊断的准确性。通过人工智能图像分析，医生可以减少误报，避免不必要的治疗，同时提高发现潜在新肿瘤的可能性。


    弗劳恩霍夫医学图像计算学院的研究科学家 Markus Harz 表示：“我们认为早期发现是治疗的关键。当算法检测出图像存在异常后，如何正确地处理诊断这些异常，就成为下一个挑战。”几年前，Harz
    及其同事还在依赖今天仍然普遍采用的传统式“特征工程”诊断法。研究人员对计算机进行编程，使其能够检测图像特征，然后通过线性回归或随机森林等算法对图像数据进行分类。然而，研究团队利用深度学习实施的第一项实验就表明，它可以解决极具挑战性的问题，包括探检位置及识别器官和异常的轮廓。


    ### 2．梅奥诊所


    梅奥诊所的神经系放射学家布拉德利·埃里克森（Bradley Erickson）博士则借助人工智能的力量，利用磁共振成像预测了脑肿瘤基因组。


    埃里克森博士的这种方法能够让医生更加轻松地访问宝贵的基因信息，以便预测肿瘤的增生速度，以及肿瘤是否会对特定药物及其他治疗方法产生反应。


    在一组实验中，研究人员识别出了干扰 DNA 修复的多形性成胶质细胞瘤——一种最常见且致命的脑肿瘤。埃里克森博士认为，相比于仅采取放疗一种手段，放化疗综合方案对于这种
    MGMT 基因发生突变（甲基化作用）的癌症疗效更好。如果肿瘤尚未发生变异，医生就可以选择副作用较小的治疗方法。


    埃里克森博士的团队利用基因已突变和未突变的肿瘤磁共振成像训练神经网络。为此，他们采用了 CUDA 并行计算平台及一系列搭载 cuDNN 的 NVIDIA GPU，同时还通过
    Tesla P40 GPU 加速器及其他 GPU 部署其算法。梅奥诊所因利用人工智能，通过核磁共振成像手段对某些脑瘤突变进行早期识别，从而被授予 NVIDIA
    2017 年全球影响力大奖。


    ### 3．马里兰大学


    马里兰大学高等计算机研究所的研究人员创造了 BEAGLE，为观察进化的演变提供了一种革命性方法，并且因此被授予 NVIDIA 2017 年全球影响力大奖。


    BEAGLE 是一个开源数据库和应用程序编程接口（Application Programming Interface，API），可以使用 NVIDIA 的
    GPU 快速切割数据，通过对特定模型的精准计算，来加速对 DNA 等生物序列数据的分析。BEAGLE 的全名是广义平台进化分析可能性求值程序，被研究艾滋病、流感和埃博拉致病病毒等生物进化史的科学家广泛采用，现在已成为软件工作流程的一个重要组成部分。


    ### 4．亚利桑那州菲尼克斯转译基因组学研究院


    研究院的金姆（Kim）和他团队的研究可以带来癌症的精准治疗，例如，针对患者肿瘤的某些细胞进行治疗。为此，他们创造了一个 GPU 加速的数据分析工具，让他们可以详细地测试出癌细胞的
    DNA 如何控制蛋白生成，同时测试这些蛋白相互之间及其与其他分子之间如何发生作用。通过使用这项工具，研究人员可以找到同一个肿瘤中不同细胞群之间的差异。这项研究意味着未来可以为癌症患者带来个性化的治疗，通过使用不同的药物治疗肿瘤的不同部分。


    ### 5．北德克萨斯大学


    北德克萨斯大学的安德烈斯·西斯内罗斯（Andres Cisneros）和他的团队收集了美国国立卫生研究院的大量数据，用来寻找与癌症有关的 DNA 修复蛋白变异。


    找到这些变异后，研究人员通过 GPU 加速的计算机模拟去找出这些变异如何改变 DNA 修复蛋白和其功能。西斯内罗斯说：“如果我们知道有变异影响这些蛋白，且与癌症有关，研究人员可以用这些信息修复这些蛋白，或是使用药物，或是其他疗法。”


    Cisneros 更大的目标是找到更多能表明特定类型的癌症高危迹象的生物标记。该团队已经找到与几种癌症有关的变异，包括非裔美国人的前列腺癌的生物标记。


    ## 3.5.8 基于 NVIDIA 平台的人工智能医疗行业初创公司


    除了基础研究之外，不少初创公司已经将其基于 NVIDIA 平台所研发的人工智能项目商业化，我们选取了部分人工智能医疗保健初创公司进行介绍。


    ### 1．北京推想科技有限公司


    北京推想科技有限公司（以下简称推想科技）是一家专业的智能大数据公司，长期从事人工智能、深度学习、图像识别、医疗影像等领域的前沿应用研发。推想科技将人工智能引入医学影像的诊断之中，使其能在复杂疾病的检查和判断领域提供准确的解决方案。目前，推想科技与武汉同济医院等顶尖三甲医院展开战略合作，开发新一代人工智能辅助筛查系统。


    推想科技的解决方案在图像类别和诊断部位的应用范围非常广泛，如超声、CT、MRI，或者胸腔、腹部、关节等。推想科技的深度学习解决方案不仅可以在 1 秒内扫描
    250 个 CT 层面，让医生实时得到结果，而且准确率也能接近主治医生的水平。总体来说，推想科技能够解决的病种数量、准确度、运算时间、效率等得到大幅提升。


    ### 2．Genetesis


    来自辛辛那提的 Genetesis 公司正在进行 CardioFlux 的临床试验，使用深度学习、传感器和物理学来正确诊断胸痛。CardioFlux 是一种非侵入性生物磁共振成像系统，能够测量胸部的弱磁场。它由
    GPU 提供人工智能加速支持，在 90 秒内就能生成心电情况的 3D 地图，帮助医生快速且准确地诊断动脉阻塞并确定其位置。


    CardioFlux 为医师提供 3D 绘图工具，以了解每个患者的潜在心电活动，可用于诊断和指导治疗各种心脏疾病，包括心肌缺血、心房颤动、室性心动过速和其他心脏病。


    ### 3．Bay Labs


    Bay Labs 通过训练 GPU 加速深度学习软件识别超声图像，能够更加轻松地对扫描结果进行解读分析。该公司表示，它的解决方案是常规方案速度的 20 倍，但它的成本却是现在的八分之一。它将成本从
    400 美元降低到每次扫描 50 美元，并且每年可以扫描的患者数量是之前的 5 倍以上。


    Bay Labs 最开始是一家软件公司，开发了一款使用深度学习诊断风湿性心脏病的软件，配合超声设备进行快速诊断，获得了有价值的医学结果。而现在 Bay Labs
    也参与到超声设备的研发中，通过打造价格合理的便携式超声波扫描仪及人工智能技术来辅助全科医生进行心脏病的快速诊断。


    ### 4．Athelas


    位于旧金山的 Athelas 公司打造了一款便携式血液检查设备，该设备能够让用户随时随地测量自身白细胞计数。它采用深度学习和机器视觉技术，使用 GPU 来快速分析血细胞并产生诊断报告。它只需通过几滴血，就能在几分钟之内识别白血病、感染、炎症等。这款设备的售价为
    250 美元，单个试条售价 10 美元。这一技术已符合 510（k）Ⅰ类的标准，目前已经可供诊所和家庭用户使用。


    ### 5．Lunit


    Lunit 总部设在首尔，正在使用 3D 成像和深度学习技术对乳腺进行检测。美国每年会花费 100 亿美元进行乳腺癌检测。Lunit CEO Anthony
    Paek 表示，在筛查测试中，大约有 20%的肺癌和乳腺癌被遗漏，而医生使用 Lunit 的技术，将正确诊断率从 80%提高到了 83%。此外，在一次测试中，Lunit
    已经击败来自 IBM 和 Microsoft 等其他公司的团队。


    Lunit 通过准备数据训练其神经网络，然后通过反馈改善检测。Paek 表示，其业务也可以扩大到其他医疗领域，用来检测其他类型的癌症。


    ### 6．Insilico Medicine


