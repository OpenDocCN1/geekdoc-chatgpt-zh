    ### 临床决策支持


    临床对于辅助诊断的要求甚高，医学数据或者说辅助诊断场景中，对于结论的可推测性——因果推测链条要求十分严格。在这个场景下，大数据里常用的基于相关性结论的应用和产品设计，并不适用于医学这个特殊领域。


    因此，必须要从统一标准的角度入手，利用深度学习构建辅助诊断的模型，最大限度地降低医生的工作量，同时又能尽可能地以客观公正的态度帮助医生提出第三方诊疗建议。这样就能避免基层全科医生由于经验缺乏，出现误诊、漏诊的情况。


    医疗大数据辅助决策系统的核心运行机制是基于海量的医疗大数据，同时将各学科专家的经验囊括到系统中，技术人员应用先进的 IT 技术、深度学习算法等针对特定领域进行专业的定制，从而向医生提供可视化、场景化、智能化的系统解决方案。医生在使用过程中的反馈又能够不断地优化系统，提升系统的准确性。


    目前，以 IBM 沃森 （Watson）为代表的认知技术可以读懂并分析那些无法被传统计算机识别的非结构化数据，而这些数据占整个数据信息的 80%。沃森的肿瘤专家吸收了美国
    100 多年的癌症临床治疗实践经验，接受科学训练超过 4 年。和纪念斯隆－凯特琳癌症中心的顶级专家组所给出的治疗方案相比，它已经达到了接近 100%的符合度（不同癌种符合度有所不同），至今已覆盖了肺癌、乳腺癌和结直肠癌等几大领域。


    沃森会先从患者的病历中提取关键词，再从海量数据中迅速筛选出重点数据；而后为患者量身定制出多款“个性化”治疗建议。同时，它会在提出的每种建议后面注明出处和依据，并按照可信度的大小顺序排列，供治疗医生参考；当医生选定了某种治疗方案之后，它还会给出采用此方案的病例数、生存率、不良反应发生率等相关信息，帮助医生总体评估该方案的疗效与风险。从医生输入到沃森输出，仅需数秒时间。


    ### 2．问题和挑战


    （1）最大的挑战是高质量的病历获取。目前，医院是病人数据的集中来源地，医院是否愿意合作，愿意提供多少数据成为关键。


    （2）患者资料的数据伦理问题。因为人工智能需要从过往数据中进行学习，才会使其拥有智能，并得到提高。我国目前对此领域在政策上尚未明确如何利用数据，哪些数据可以利用，哪些数据不能利用，这是所有病历/文献分析企业所要面临的问题。


    ### 案例介绍


    #### 森亿智能


    森亿智能是一家专注于利用人工智能进行医学文本自动分析和数据二次应用的公司，依据医疗 IT 企业、保险、药企、医院等 B 端客户的需求，将案例/病历进行结构化、可视化处理，将处理后的数据应用到医保控费、药物研发和临床决策支持等方面。


    森亿智能的人工智能系统像一个有经验的医生一样，可以精准、完整地读懂病历所表达的含义，并消解其中的歧义。系统利用自然语言处理技术，深度挖掘和分析医疗文本的信息，快速批量抓取病历中的信息，并生成一个结构化数据库。这个抓取环节可以为医生节省数月的时间，把这个过程的耗时压缩到几秒以内。


    目前，该系统全科室综合准确率为 90.2%，可以识别 13 大类临床变量，识别 19 类变量语言关联，可实现全自动生成结构化数据库。更重要的是，森亿的自然语言处理不依赖任何人工规则，在面对新的病种、新的病历时，完全通过机器学习来完成模型构建，从而使产品在面对不同场景时可实现灵活定制、高速迭代。


    森亿智能有两种盈利模式，主要是针对 B 端客户。一是开放中文病历语义 API，为机构提供无缝对接不同的平台和系统的可插拔式模块；二是为保险公司等第三方管理公司提供取代人工的智能病历分析服务，并辅以一线临床数据的细分市场报告、精准收费核算支持、深度风险评估，全面提升医保质量与效益。


