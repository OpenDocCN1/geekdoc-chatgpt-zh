    兰丁医学是一家聚焦细胞病理人工智能产学研及临床服务为一体的公司。公司主要产品是全自动数字（远程）病理细胞分析仪，这种仪器采取人工智能的方式让机器从提供的数百万份样本中学习癌细胞、癌前病变细胞及正常细胞样本的辨识，使其最终能够精准识别正常宫颈细胞与癌细胞，并具备持续学习的能力。


