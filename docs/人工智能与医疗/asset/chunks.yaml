    目前，Qventus开发的符合健康保险流通与责任法案（HIPAA）标准的SaaS系统已经广泛用于旧金山的医疗机构，它从美国政府医疗网站收集详细数据，美国所有接受医疗保险及医疗补助基金的医疗机构数据都汇聚于此。利用实时分析的SaaS平台对这些数据进行分析，可输出辅助性的推荐信息，帮助医院管理者和医护人员做出决策。


