    ## 6.4.6 带给中国创业者的思考


    动脉网蛋壳研究院拟站在创业者的立场，对于SigTuple一类的创业案例能否在中国进行复制和改良进行了如下梳理与思考，以供读者参考。


    ### 1．市场空间：国内此类需求及国内市场竞争程度


    血液检查是多种疾病诊断的第一步，目前国内暂无市场调研机构公布血检市场规模的具体数字。但血液检查有“高基数、低频次”的特点，“市场蛋糕”肯定不应该被轻易忽视。


    根据检验医学网《2015年国内血液分析仪市场占有率分析》的数据，日本希森美康公司的产品占据我国65%的市场，其次迈瑞占据10%的市场，其他公司市场占有率均在3%以下，市场呈现一家独大的局面。随着我国“十三五”规划的进行，政府重点助推医疗器械国产化，会对国内品牌形成有力的助推，竞争格局很有可能随之改变。希森美康的血液分析仪虽然价格较高，但胜在稳定。由此可见，精准度仍然是医院采购诊断设备的重要考虑指标。


    在医疗器械国产化的大背景下，一套能够在质量上达到同外资品牌相同水准的国产诊断设备，其前景将是非常广阔的。


    ### 2．数据来源：能否从医疗机构获取庞大的医疗数据


    一方面，高数量、高质量的数据是机器学习的基础，但在国内获取到此类医疗数据恐怕存在不小的困难。一是国内医疗机构尤其是三甲医院强势，它凭什么要动自己的既有“蛋糕”与此类公司合作？但不合作如何采集到大量数据训练人工智能？由此面临“先有鸡还是先有蛋”的困境。另一方面，是各医院的信息系统和电子病历都是“孤岛”，如何将不同来源的数据都整合到自己的系统中或许也将带来不小的技术挑战。


    ### 3．商业利益：盈利模式在国内是否可行


    从目前外国媒体的报道来看，印度传统的血液检查均价在7美元左右，SigTuple提供的血液检查服务成本低于传统血液检测，因此在价格上具有竞争力。


    国内的血常规检测价格在20元左右，已经广泛普及，且检查费用本身不高，因此，如果在检测时间和检测精准度上没有明显提升的情况下，厂商很难说服医疗机构放弃已有的传统检测设备，重新采购一套新的血检系统。此外，想要在国内对这种模式进行复制，降低设备造价和运营成本也是两个可探索的方向。


    \[1\] Flipkart：Flipkart是由亚马逊的两名前员工萨钦·班萨尔(Sachin Bansal)和比尼·班萨尔(Binny Bansal)于2007年创建的，是印度最大的电子商务零售商。


    ## 6.5 希氏异构：携手华西医院，AI独立超算中心“神农1


    ## 号”建成运行


    2017年7月26日，CCTV-1、新华社、中新社、人民网、《科技日报》等多家媒体报道了华西医院在医学人工智能技术上的重大研发进展和研发体系的构建。作为中国顶级的医疗机构之一，华西医院此次的信息披露，无疑是一个进军人工智能医疗市场的重大信号。


    华西医院与希氏异构公司在消化内镜影像领域的人工智能技术研发取得了突破性进展，对于消化内镜下的多种疾病判定准确度达到95%左右。华西医院与希氏异构公司联合成立华西—希氏医学人工智能研发中心，在消化内镜、病理、CT、MRI超声等多领域开展联合研究，布局未来智慧医疗。


    ## 6.5.1 希氏异构发展历程


    目前，中国的医疗AI创业公司有很多，医疗AI领域有两个关键要素，就是“医疗”和“AI”。若是只能用开放式的平台去做一点数据训练，那不是真正掌握AI技术，若不能获得一流医疗机构的深度合作，那不能称为有合法的、高质量的医疗资源，只有这两者相加，才有可能做好这件事。


    另外，还有一个更为重要的因素，那就是创业者一定要真正了解医疗行业的本质，要有从商业到技术应用，再到以多个视角看清楚医疗行业的头脑，否则做不成这件事。


    希氏异构创始人宋捷（图6-10）早年于医学院校毕业后，作为执业医师从事临床工作，后走上企业管理的道路。20世纪90年代在中科院攻读商业经济方向研究生，10多年前在中欧商学院（CEIBS）获得EMBA学位，曾担任过多家知名企业、上市公司的高管。


    ![](images/f0400592a7f97aa4a6d0318c83eb3d7c.jpg)


    图6-10 希氏异构创始人宋捷


    “20多年前，我主持过国内最早的HIS系统的开发；15年前我在一家知名的药企做副总；10年前我从研发开始进入医疗器械领域，所管理的公司获得了该细分领域第一个国家III类医疗器械证书；5年前，我参与了多家三级医院的成功并购项目。过去的经历，让我不会孤立地看待一个医疗技术的前景和发展路线。”宋捷或许是从技术研发、企业发展、医疗需求、经济回报等多重视角看待医疗AI的。


    2015年，公司刚成立时，宋捷把研究方向定位在了消化道内镜。他之所以这么做，一方面是因为中国消化系统肿瘤占整个恶性肿瘤发病率的43.5%，发病率高，医疗需求很大。另一方面是受到了其学长——一位消化界权威的医疗专家的影响，该专家一直在呼吁：“中国应该让基层医院具备消化内镜的检查能力，因为对于消化道早期肿瘤，内镜检查是早诊早治的唯一手段。这类疾病若能早期干预，预后效果非常好；但若是发展到有症状而去就诊，往往已经失去最佳治疗时间。让基层医院具备内镜诊断能力，是消化领域技术发展的重中之重。”


    但是医生经验的积累，绝非一蹴而就，最大的成本就是时间。用AI技术来弥补医生资源的不足，这是希氏异构选择从消化内镜领域进入医疗的初始原因。


    幸运的是，公司成立没多久，国际顶级人工智能科学家吴韧博士团队（异构科技）确定以股权合作的方式加盟，从而使得希氏获得了国际一流的人工智能训练技术，公司开始进入快速发展阶段。


    ## 6.5.2 让AI找到疾病更多未知的关联


    在产品研发的过程中，宋捷有自己的独特理解：“我从来不认为把医疗数据找一个开放的平台做一下训练就能获得真正有价值的模型（技术）。医学AI的发展方向一定不是仅仅依靠人类对疾病的关联、特征的认识去让计算机对疾病做出判断。要知道，人类对自然的认识或许只有自然界本质的百分之几，倘若我们用这百分之几的‘经验’去‘规范’AI对自然的认识标准，那么AI的未来一定不会有突破。我们更希望AI能帮我们找到尚未认识到的疾病的更多关联和最佳的治疗途径。”


    宋捷的这段话听起来似乎有些费解，为此他又解释道：“大多数同行做数据研究时都会请医疗专家标记疾病的具体特征，我们不会这样做，我们会把尽可能多的信息让计算机去学习，即使有些信息人类医学专家目前不认为与这种疾病有什么关联，但我们相信，用这样的研发思路，AI才能发现更多我们所不知道的‘东西’。AI本质是高效率的思维，而不是对人类的简单模仿。”


    ## 6.5.3 计算力带来的是倍数级的差异


    希氏异构的董事、专家委员会主席吴韧博士（图6-11）是世界级的技术“大牛”，他是最早利用GPU进行海量解析的专家之一，是国际著名计算机博弈专家，曾担任美国惠普实验室资深科学家及CUDA研究中心首席研究员。此后应邀加入AMD公司，领导AMD异构系统的研发团队，担任AMD异构系统首席软件架构师。


    ![](images/d952b35b1decb6b0d095d3ed9d535001.jpg)


    图6-11 希氏异构的董事、专家委员会主席吴韧博士


    2013年9月，吴韧博士离开AMD公司，受百度公司李彦宏先生邀请，作为百度“杰出科学家”加入百度深度学习研究院（Institute of Deep Learning，IDL）。


    吴韧博士团队的加入不仅为希氏异构带来了40多位海内外优秀的AI专家的强大技术支持，同时还为公司带来超强的计算能力。众所周知，医学图像的数据是很大的，如一个数字病理图片，其大小在几GB到几十GB，面对海量的大数据，对运算能力的要求是很高的。


    宋捷告诉动脉网，虽然现在有很多提供云计算服务的机构，如阿里、亚马逊等；也有专门研发超级计算机的厂商，如英伟达；他们的平台、产品计算能力很强，但他们是提供广域的服务而不是专门用来处理特定数据的。使用共享的计算资源完成特别大的计算量，很多时候是有困难的。


    希氏异构目前使用的超级计算机是吴韧博士设计的，宋捷表示：“相比于使用云端的开放式计算平台和市场上产品化的高性能计算机的同行，希氏异构所使用的超级计算机计算能力高于其他家数倍、十数倍。”


    吴韧博士表示：“从本质上说，目前的各种算法都没有太大的区别，能够带来AI技术的差异也就是百分级的差异；但是‘算力’带来的差距则是倍数级的差异。同样的时间，如果你只能完成一次AI数据训练，而我已经完成了很多次的迭代，技术的优劣一目了然！”


    ## 6.5.4 华西能够提供的不仅仅是数据


    正是由于希氏异构团队的技术与经验优势，华西医院决定与希氏异构展开合作。2017年，受四川省政府重点发展生物医疗产业的政策吸引，希氏医疗转移到四川。2017年3月，四川希氏异构医疗科技有限公司在成都医学城温江成立。


    与华西医院的合作，使得希氏异构获得了高质量的医疗数据和一流的临床专家资源的支持。也正是以华西医院的数据为基础，希氏异构才可以在不做局部标注的情况下进行模型训练，最后获得的效果得到了华西医院的专家认可。


    宋捷认为：“医疗专家在医疗AI研发方面的作用，绝不是提供一下数据，更不是做个图片的局部‘标注’，真正的价值是他们医疗研究的思路甚至是直觉，还有他们能告诉我们真正的临床‘痛点’，这是技术应用的方向。在医学AI领域，医生的重要性甚至超过AI技术专家。”


    四川大学华西医院消化内科唐承薇教授介绍：“通过华西—氏内窥影像及视频智能系统对静态图片和动态视频做出的提示与判定，不仅可以帮助各级医生快速完成诊断以提高工作效率，更重要的意义在于能大范围地帮助基层医生或年轻医生产出高质量的胃镜检查诊断结果，并引导治疗。”


    华西医院院长李为民表示：“华西—希氏医学人工智能研发中心，既是四川大学华西医院产、学、研、用协同创新的重大科技转化平台，也是华西医院以开放姿态释放医院资源的重要标志。”


    与华西医院的合作为AI技术的应用带来了很好的通道。可以想象，华西与希氏异构的“联姻”为其AI技术深深地打上了“华西”的烙印，华西医院本身的体量很大，其下属医联体就更多，技术成熟后的第一应用领域似乎不言而喻，更不用说华西医院在医疗行业的感召力。


    希氏异构与华西医院的合作不仅仅是目前的消化、病理、超声、CT、磁共振等独立的领域，更多的真正体现AI魅力的医学多学科协同研发的临床应用技术才是他们阶段性的目标。据悉，华西医院与希氏异构已经开始申报多个省级和国家级的重大项目。


    ## 6.5.5 两种商业化落地方案已经在实施


    在商业化方面，希氏异构已经有两个方面的准备，一是医疗设备，二是医疗服务。


    （1）对于医疗设备，公司有以下两种产品推出。


    第一种是以技术授权的方式与消化内镜生产商合作，厂商每卖出一台人工智能内镜设备，希氏异构就会从中获利。目前，公司已确定了第一家合作企业——上海成运医疗设备股份有限公司，他们在2018年联合搭载了AI技术的消化内镜。该内镜是基于早已取得国家许可的设备所做的技术更新产品，无需经过复杂的新产品报批流程，2019年可以获准上市。这种合作模式既适合传统消化内镜，又适合胶囊内镜。


    第二种是针对医疗机构已经存在的消化内镜，希氏异构研发出消化内镜判定仪器，这个设备可以与消化内镜相结合，帮助医生进行判断。目前正在CFDA 2类器械认证中。


    （2）对于医疗服务，希氏异构已着手与一流医疗机构的合作，联合推出轻资产的第三方医疗诊断中心的服务。


    “我们以AI技术加一流临床专家的方式服务于各级医疗机构，包括体检中心，你可以选择使用不同的服务，可以是收费非常低廉的AI服务，也可以是由知名专家给出诊断结果的服务。我们只为医疗机构提供高水平的医疗支持，让他们快速开展过去无法顺利展开的业务，但我们不会接触患者，这样可能会有更多的医院愿意跟我们合作。我们提供不限量的AI技术服务的收费标准，仅为基层医院医生工资的一半，相信以这样的收费价格，很多医院都会愿意合作的。”谈到医疗服务，宋捷这样说。


    从理念到医疗和技术团队，从计算能力到训练数据，从合作方到商业化落地方案，希氏异构拥有自己独特的优势，这也是希氏异构敢于与众不同的资本。


    关于与资本的对接，宋捷表示，希氏只在天使阶段做过一次融资，目前打算进行新一轮的融资，资金主要用在这几个方面：完善消化AI，包括设备和服务两大产品的推出；2018年年底在病理、影像方面做出突破；建设轻资产的AI+专家模式的第三方诊断中心。


