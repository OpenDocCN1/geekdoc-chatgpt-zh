    据蛋壳研究院调查，在起步阶段，一个创业公司需要1～3名专家，他们的工资也没有传说中的那么高，但是作为公司的创始人或合伙人，他们占有公司的部分股权在2%～78%。据行业人士介绍，这些创业公司的CTO或首席科学家如果进入BAT、华为、谷歌、微软这些大公司，年薪会在100万～1000万元，甚至更高。人工智能企业人力成本组成如图5-5所示。


    ![](images/0dbec4f42406af27567a10ae120f425a.jpg)

    图5-5 人工智能企业人力成本组成


    在蛋壳研究院从拉勾网获取的招聘信息中可以看到，与人工智能相关的岗位年薪在20万～60万元（图5-6）。这些刚毕业的硕士研究生的工资几乎和有3～5年工作经验的商务拓展经理接近。


    ![](images/917aabfdcdbf2d19201583f70d92e3b1.jpg)

    图5-6 与人工智能相关岗位的年薪范围


    人工智能医疗是一个多学科交叉的专业，公司除了需要招聘人工智能专家外，还需要硬件工程师、软件工程师、测试工程师、医学专家、质控专家、认证专员（认证CFDA）、商务拓展专员等。作为创业公司，在资金不充足时，为了吸引人才，往往以股权的方式留住团队的主要成员。


    另外，人工智能各个领域的人才价格也会有所差距，在计算机视觉、语音、自然语言处理和机器学习这4个人工智能技术中，视觉方向因为学科容量相对广阔，所以人才储备也最高。但是，语音和自然语言处理方面的人才十分缺乏，国内主要设置语音识别的专业高校只有中科院声学所和哈尔滨工业大学。这也是目前我国医学影像类公司有几十家，而医学语音录入的公司只有科大讯飞、云知声和中科汇能3家的原因。


