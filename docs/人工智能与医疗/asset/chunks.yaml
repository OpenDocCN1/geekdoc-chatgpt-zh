    ## 2.5 医院管理


    医院管理，顾名思义，是指以医院为对象的管理科学，它根据医院工作的客观规律，运用现代的管理理论和方法，对人、财、物、信息、时间等资源进行计划、组织、协调、控制，充分利用医院的现有资源实现医疗效用的最大化。


    ### 2.5.1 人工智能应用于医院管理的优势


    人工智能在医院管理应用上主要有两个方向，分别是优化医疗资源配置和弥补医院管理漏洞。


    #### 1．优化医疗资源配置


    人工智能根据医院的情况，制订实时的工作安排，其目的在于优化医院的服务流程，最大限度地利用好现有的医疗资源。


    传统的医院管理方式完全依靠人工，所带来的问题一方面是医护工作者不能将全部精力投入医疗工作中，造成医疗资源的浪费；另一方面是医护工作者的工作任务已经非常繁重，如果再给予他们更多的行政事务，就很容易造成工作上的低效。


    人工智能能够很好地弥补传统的人工进行医院管理带来的问题。人工智能应用机器学习等方式，根据医院已有的信息进行建模，训练出一套精准的算法，并在实际应用中不断实现自我更新，使模型更有针对性。


    表 2-15 所示为优化医疗配置的传统方式和人工智能方式比较。


    表 2-15 优化医疗配置的传统方式和人工智能方式比较


    ![](img/d3bca5046e70c77b5e1e5a3880592690.jpg)


    在人工智能的帮助下，医院的运营流程将得到优化，医院的运营效率将稳步提高。传统的人工式管理由于种种主观和客观的因素，导致医疗资源不能高效地匹配到最需要的患者身上。但人工智能可利用大数据，从宏观层面协调资源的分配。它能根据电子病历、既往病史等信息分析出哪些患者是最需要及时救治的，把医疗资源优先提供给他们，优化医疗服务的先后顺序。


    #### 2．弥补医院管理漏洞


    人工智能调查患者对医院的评价，总结医院存在的问题，并给出解决方案，其目的在于提升患者对医院的满意度，提高医院的营收。近年来，随着“以患者为中心”和“以价值为导向”的医疗理念逐渐被公众认同，患者体验在整个医疗行为中的地位越来越受到重视。德勤在
    2017 年 4 月发布的调研报告显示，良好的患者体验将在很大程度上提高医院的营收。基于种种需求，弥补医院管理漏洞的人工智能系统应运而生。


    这种系统能够从点评网站、社交平台和新闻媒体等渠道收集客户对医院的评价，通过自然语言处理技术将非结构化的数据处理成能被系统识别的结构化数据，根据已经搭建好的模型，系统能够整理、分析出各种评价背后的真实含义，最后将信息总结成可视化的图表，呈现给医院的管理者，告诉他们根据客户的评价医院在哪些方面做得不到位，可以通过哪些方式进行整改。


    在相对流程化的信息收集阶段，人工智能较人工收集的优势是非常明显的。对信息的收集和过滤往往需要耗费人工几周甚至几个月的时间，而人工智能系统全部进行数字化处理，将时间缩短至几个小时或几天，大大减少了工作量。


    医院传统的调查方式存在形式单一、反馈有限等问题，而人工智能能够从内部和外部多个渠道收集客户对医院的真实评价。以往的医院满意度调查是人工操作，而满意度调查有可能直接影响到各个部门的绩效考核等相关利益，因此调查项目可能流于形式。而人工智能完全由机器进行分析，不带有任何主观的情感和利益考量，因此能给出客观、公正的调查结果。


    两种方式的对比如表 2-16 所示。


    数据收集和分析的准确性直接影响到后续整改方案落实的有效性。如果在数据收集和分析上就存在问题，之后的整改方案就是完全徒劳的。人工智能系统在给出分析结果后，还能给医院管理者提供一系列建议，供他们采纳。


