    Fitness 用户数量已超过 160 万人，有报道称，微软还将推出移动版本。微软还专门推出了应用 Kinect 技术的创新加速器，鼓励初创企业利用该技术进行创新，加拿大的
    GestSure、Jintronix，美国的 Zebcare 等医疗行业的初创公司都采用了 Kinect 技术。


