    针对精神分裂症患者人群的临床试验，将依从性比例由 50%提升至 90%。


    ## 6. 患者数据收集

    在传统的新药研发流程中，患者的健康状况和身体数据情况只能在临床中进行评估，患者需要进行定期检查，特定时间和地点获得的数据并不能完整地代表患者的身体情况，容易出现数据偏差。在这个阶段可以应用可穿戴设备与机器学习分析来提升临床试验中的患者参与度、数据质量和操作效率。


    生命科学临床研究领域云解决方案供应商 Medidata 宣布与 Garmin 达成战略合作，通过 Garmin 的健康手环与 Medidata 的临床数据云（Medidata
    Clinical Cloud）相结合的方式提升临床试验中的患者参与度、数据质量和操作效率。此外，可穿戴式生命体征监测公司 Vital Connect 等还获得了食品药品监督管理局的批准，利用其生物传感器来监测患者的各项生物指标。这些涉及生命科学研究领域的公司正把我们推向一个新的时代，连接到之前根本无法获取的一系列新行为数据。前文所述案例均能让科研人员在临床试验中提升患者的互动率，最终让他们获得更多、更实用的数据，这些对于药物研发取得突破至关重要。


    ## 7. 药物晶型预测

    药物晶型对于制药企业十分重要，不但决定小分子药物的临床效果，同时具有巨大的专利价值。药物晶型专利是药品化合物专利之后最重要的专利，是原研药企业阻止或推迟仿制药企业在其化合物专利过期后将仿制药推入市场的重要筹码。药物晶型专利可以延长药物专利
    2～6 年，对于重磅药物而言，则意味着数十亿美元的市场价值。


    利用人工智能高效地动态配置药物晶型，可以预测一个小分子药物所有可能的全部晶型。相比传统药物晶型研发，制药企业无须担心由于实验搜索空间有限而漏掉重要晶型，可以更加自如地应对来自仿制药企的晶型专利挑战。此外，晶型预测技术也大大缩短了晶型开发的周期，使研究者更有效地挑选出合适的药物晶型。


    ### 企业案例


    #### 晶泰科技

    晶泰科技是一家为全球创新药企提供药物晶型设计服务的公司，总部位于深圳，成立于 2015 年 9 月，并在 2015 年 12 月获得腾讯和人人公司数千万元的
    A 轮融资。公司以量子物理学家和医药界资深专家为核心成员，是全球领先的以计算驱动创新的药物固相研发公司。通过计算物理、量子化学与云端强大的智能算法，实现高度精确的药物固相筛选与设计，大幅度缩短了药物设计、固相筛选与药物制剂开发的时间，对药企的专利申报与保护起到关键作用。公司主要提供药物晶型预测和晶型专利保护服务，帮助药企提高研发效率，降低药物的质量风险和专利风险。


    晶泰科技开发的“药物固相筛选与分析系统”是基于人工智能的深度学习和认知计算能力，能够在短时间内通过对医学文献、临床试验数据等非结构化数据进行处理、学习和计算，预测各种晶型在稳定性、熔点、溶解度、溶出速率等方面的差异，以及由此而导致的在临床过程中出现的不良反应与安全问题，在短时间内筛选出稳定性和溶解度最佳的晶型结构。


    2018 年 5 月 9 日，晶泰科技与辉瑞制药签订战略研发合作协议，辉瑞将借助晶泰科技的人工智能技术，建立小分子模拟算法平台，驱动小分子药物创新。目前，晶泰科技已完成
    B 轮融资，累计融资总额达到 2030 万美元。


    # 2.7.5 中国药物发现的难点

    中国的药物研发公司在进行人工智能药物研发方面，要面对人才、数据和商业模式的困难。


    （1）人才。AI 应用于药物研发需要若干个垂直领域的专家共同参与才能有所突破；既需要物理学家、化学专家、药物学家、药企研发高管，又需要人工智能科学家、云计算工程师等跨学科人才。在多个领域积累人才和经验，整个团队紧密合作，这样才更容易获得突破性的思路和好的成果。


    （2）高质量数据。AI 药物研发需要高质量的数据支持。国内创新药物研发起步较晚，与国外相比，对于优质数据的积累还有一定差距。


    （3）商业模式。生物科技在国内成功的标杆案例较少，同时，药物研发这一领域相比于医疗、金融等领域，其本身有相当的复杂性和不可预测性。这就是为什么人工智能这么热门，人工智能制药却仍“门庭冷落”的原因。


    # 2.7.6 AI+药物发现商业模式探索

    关于商业模式的探索，动脉网在这里分享 3 种模式，第一种模式是由晶泰科技联合创始人、北京大数据及人工智能研发中心负责人赖力鹏博士提供，后两种模式是动脉网从巢生资本的研究中整编获取的。


    ## 1. 开放和反馈的思路

    晶泰科技一开始就明确了初期主要客户群，在地域设置上形成国内研发、国际业务拓展的模式。在有效控制研发成本的同时，起步阶段就努力在国际范围内寻求合作者。目前，晶泰科技已获得国际顶级药企的信赖并达成长期合作。


    除了拓展国际业务之外，鉴于药物研发流程的复杂性，赖力鹏认为机器学习在药物研发中的大规模应用依赖于整个产业链的共同努力，所以商业上晶泰科技主要施行开放和反馈的思路，其长处是为传统研发人员提供最先进的计算软硬件工具，帮助他们更好、更快地完成科研任务。


    ## 2. 虚拟筛选团队外包验证

    虚拟筛选团队外包的主要方式有两种: 一种是与利益相关者合作，另一种是与非利益相关者合作。


    引入利益相关者，如一个更大的医药公司，公司将受益颇多，如激励一致，与已有临床生产线的整合，致力于特定疾病团队带来的专业知识等。虽然公司需要割舍部分控制力或所有权，
    但是有利于项目研发成功率的提升。


    与非利益相关者合作，如合同研究组织（CRO），公司保留完全的知识产权，执行速度快但是成本高，而且在实验设计上有可能面对控制权的损失，所以为了保证高质量的结果，必须给予特殊的关注。


    这个模式的好处是成本低、速度快，特别是工业界的合作伙伴在新化合物后期验证和临床研发中具有巨大机会。合作伙伴能够理解这些验证实验的动机和设计是至关重要的，因为他们在后续的临床研发中充当重要角色。


    ## 3. 独立的药物研发团队和虚拟筛选团队的良好合作

    在这个模式中，公司团队专注于计算机虚拟筛选，而其他团队给予实验药物研发的支持。和通常专注于特定的配体/受体、生物现象或者疾病领域的团队良好合作，能使项目研发团队有独特的专业性。


    虽然配合程度没有一个完全整合团队那么强，但这种模式的优势在于所提供的处理结构的可变性和合作者的可选择性。具有广泛应用平台的虚拟筛选团队可以考虑用这个结构，在使资本成本最小化的同时处理很多研发项目。


