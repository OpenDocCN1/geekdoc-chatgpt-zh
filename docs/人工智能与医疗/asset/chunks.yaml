    年和 2018 年处于 A 轮的融资占比分别为 38.84%和 53.13%，全球人工智能医疗行业 A 轮融资占比约为一半，说明该行业中过半公司的产品及商业模式已经成熟，并在行业内拥有一定的地位和口碑。因此，动脉网建议资本投资更应关注后期有清晰盈利模式的人工智能医疗企业。


