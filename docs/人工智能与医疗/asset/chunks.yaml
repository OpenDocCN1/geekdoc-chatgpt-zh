    ## 3.2.5 人口健康管理

    关于如何使用AI改善大部分人群的健康状况，谷歌也作了大量的尝试。谷歌正在研究一个叫做调试（Debug）的项目，该项目旨在设计并向人群释放无菌蚊子，以消除携带疾病的蚊子。该公司表示，它使用传感器和机器视觉对雄性和雌性埃及伊蚊进行分类并对其进行监控。

    另一项研究是城市环境对健康的影响。这项研究最终分配给以医疗补助/医疗保险为重点的Cityblock Health公司，由谷歌的Sidewalk实验室投资。

    Cityblock正在创建有医疗补助和低收入医疗保险患者地区的个人邻里医疗中心，以确保这些患者能够使用医疗基础设施，并在需要时获得护理。该公司还开发了一个名为Commons的健康应用程序，将护理团队与这些患者联系起来。

    在收集了大量有关公共医疗补助和医保制度接受者的数据之后，Cityblock就会采用AI作为基于风险和适时进行干预的手段，以半自动或自动的方式进行分类。

    在食品安全方面，谷歌尝试通过早期监测动物和检测由疾病引起的牲畜的行为或生理变化，来提高公共卫生安全。一家名为Cainthus的创业公司已经使用机器监控家畜。同时，谷歌可以用机器视觉技术更好地帮助消费者检测食物是否变质。

    此外，像Kewpie这样的公司已经在使用谷歌的TensorFlow来追踪食物中的成分。


    ## 3.2.6 谷歌的盈利模式

    谷歌可以为大型医疗设备和制药公司提供外包原型和研发引擎。这些巨头可以为新发明背后的知识产权和技术支付费用，然后将其商业化专业知识付诸实践，并将其真正推向市场。例如，Verily
    在2014年将其智能装置授权给了诺华。

    随着人工智能越来越多地应用于医疗设备中，谷歌已经开始销售自己的AI产品，包括Google Home和Google Pixel等。对于像糖尿病管理这样利用数据可以不断迭代、提供更高效诊断和管理的人工智能，可以将其出售给医院或保险公司。

    随着谷歌推出谷歌云服务，并与其他科技巨头竞争，医疗保健由于有大量数据产生，因此销售数据存储和计算能力在这个领域中很有吸引力。

    虽然谷歌正在致力于通过人工智能来解决医疗保健问题，但必须处理公众的看法和信任问题。考虑到健康数据的敏感性，消费者对谷歌保护个人数据隐私能力的信任至关重要。

    谷歌正在开展医疗保健的众多领域不同分支的人工智能研究，如果谷歌能找到有效的方案解决用户隐私、公信力等问题，就有可能创建一个新的数据和人工智能驱动的医疗范例。

