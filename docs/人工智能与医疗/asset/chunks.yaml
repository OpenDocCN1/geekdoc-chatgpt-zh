    ## 2.6.2 智能器械的商业模式

    对于传统的器械公司来说，组建一个新部门研发产品的流程是比较复杂的，但是与人工智能公司合作，自己就无须耗费时间、财力和精力去做这个事情，通过合作的方式将人工智能系统搭载在器械上面销售，增加器械的竞争力。


    对于医疗人工智能公司来说，产品研发出来以后，与器械厂商的合作有两个好处：一是可以通过科研合作的方式，验证自己产品的实际临床效果；二是可以通过器械厂商进行产品认证。现在大多数医疗人工智能公司都在寻找合适的盈利模式，但是由于医疗的严谨性，国家还没有出台专门针对人工智能产品的认证标准，通常公司是按照医疗器械的认证流程认证二类医疗器械或者三类医疗器械。


    在没有获得认证之前，很多公司通过与器械公司的合作，将系统搭载在器械上，器械公司只需去省级食品药品监督管理局进行报备，不需要进行重新认证就可以在市场上销售，所得的销售利润可以按照双方商量好的比例进行分成（图
    2-33）。


    另外，在这个过程中人工智能公司也可理解为器械公司的代理方，如果医院找到人工智能公司想要体验或者使用人工智能产品，那么通过人工智能公司销售出去的器械则按照另一种比例进行分成。


    ![](img/83c0edb1d1e586d1eb3d23692e46d425.jpg)


    图 2-33 传统器械+技术合作企业的盈利模式


    对于初创企业来说，其部分产品能够直接针对 C 端消费者，它们并不需要借用传统器械厂商的力量打通医院，而倾向于通过提供器械+软件的全套产品获取利润（图 2-34）。因此，初创企业的商业模式相对简单，它们直接通过线上或线下的渠道进行销售，而在
    B 端也无须和传统器械公司进行利益捆绑，有更大的自主权和灵活性。


    ![](img/cc3ac034eaa9dc7eb38c8731230a3fad.jpg)


