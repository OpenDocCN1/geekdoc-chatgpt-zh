    在美国毕业的学校多为麻省理工学院、卡耐基梅隆大学、加州大学洛杉矶分校等，但从统计数据来看，在哪个学校毕业与在医疗行业做研究并无关联，这其实主要看个人的发展与机遇。在这些技术专家中，博士毕业的占比为70%，硕士毕业的占比为18%，本科毕业的占比为12%（图5-25）。人工智能医疗还是一个技术门槛很高的行业。


