    ## 2.7.3 制药企业纷纷布局

    一直观望 AI 发展的制药公司现在纷纷涉足 AI 领域。


    Numerate 公司与武田药业（Takeda Pharmaceutical）正式签约，就使用 Numerate 公司的人工智能技术寻找肿瘤学、胃肠病学和中枢神经系统疾病的小分子药物展开合作。


    葛兰素史克公司^[1]（GSK）与 Exscientia 达成合作。这笔交易涉及金额约为 4300 万美元。双方合作之后，Exscientia 将利用其 AI
    药物研发平台为 GSK 进行 10 个创新小分子药物疾病的靶点开发。包括默克（Merck&Co）、强生（Johnson& Johnson）和赛诺菲（Sanofi）在内的其他制药巨头也在探索人工智能的潜力，以帮助简化药物研发过程。


    ## 2.7.4 AI+新药研发的 7 个应用场景

    人工智能在新药研发上的应用主要有两个阶段：一个是新药发现阶段，另一个是临床研究阶段。人工智能主要应用其强大的发现关系能力和计算能力助力新药研发，在发现关系方面，包括药物与疾病的链接关系、疾病与基因的链接关系等。人工智能不仅能够更快地发现显性关系，而且能够挖掘那些不易被药物专家发现的隐性关系，构建药物、疾病和基因之间的深层次关系。目前，人工智能在新药研发领域有
    7 种不同的应用方向。


