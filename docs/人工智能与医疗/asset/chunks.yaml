    ### 7．SigTuple


    SigTuple是一家创办于“亚洲硅谷”印度班加罗尔的科技型创业公司。该公司可以通过使用人工智能技术来分析视觉医学数据，并通过对血液、尿液和精液进行远程测试来扩大服务规模。


    SigTuple打造的人工智能平台称为Manthana，它能够通过对已有的医疗数据进行学习，而构建出一套算法，在该算法的基础上，对可视化的医学影像进行分析，从而快速得出结论，协助医生进行诊断。该公司创建了一种名为Shonit的设备，它可以获得血液测试结果并将其数字化。它的目标是利用人工智能中的机器学习技术，为医院提供精准、安全、及时、高效的血液筛查方案。


    \[1\] 510（k）：美国对要上市的医疗器械公司的一种管理规范，也叫上市前通知。高风险的医疗器械要销售到美国，需要向FDA提交510（k）申请（上市前通知），批准以后才能销售。FDA对医疗器械实行分类管理，根据风险等级和管理程度把医疗器械分成3类（Ⅰ、Ⅱ、Ⅲ）进行上市前管理，Ⅲ类风险等级最高。FDA只对少量的II类（普通+特殊管理）产品豁免上市前通告程序，其余大多数产品均要求进行上市前通告。生产企业必须在产品上市前90天内向FDA提出申请，通过510（k）审查后，产品才能够上市销售。


    ## 第4章


    ## 国内现状：人工智能与医疗的国内布局


    人工智能与医疗的商业前景一再被看好，国外互联网巨头纷纷布局。前些年中国的产业巨头大多停留在组建人工智能研究院的模式，给人工智能相关初创企业的风险投资机构带来了发展与机遇。随后，人工智能越来越多地应用于制药和医疗器械行业，推动了我国人工智能企业的产品线布局。


    ## 4.1 我国人工智能学术研究世界领先


    尽管美国在人工智能的基础研究领域一直处于前沿地位，但是近两年来，中国的人工智能科技人才正在实现弯道超车。


    美国发布的《国家人工智能研究与发展策略规划》报告显示，从2013年到2015年，在SCI收录的人工智能方向的论文中，涉及“深度学习”的论文数量增长了约6倍。中国学者的论文发表数量从2013年上半年开始超过美国，并大幅度领先于其他国家（图4-1）。


    ![](images/3b15fe3725043fa51560a91f7b8a631b.jpg)


    图4-1 人工智能领域论文发表情况（2007—2015）


    虽然中国学者人工智能论文SCI发表数量有所增加，但是影响力还没有得到相应的提升。麦肯锡的《中国人工智能的未来之路》报告显示，2015年中国学者发表的人工智能论文被引用量高达2124篇，远远超过美国的1116篇。然而，去掉论文中的自我引用^(\[1\])部分，美国学者的论文引用量将上升到第一。而在H指数^(\[2\])方面，美国学者的论文影响力排名第一，中国排名第三（图4-2）。


    ![](images/d462e6193e63487dcd54660cc7b3b096.jpg)


    图4-2 中国人工智能论文影响力


    \[1\] 自我引用指某刊物引用本刊物中文章内容的次数。


    \[2\] H指数是对学者发表文章的产出量和被引用次数进行科学测量的方式。H指数越高，发表文章的篇数和被引用的次数越多。


    ## 4.2 我国数据在逐步开放


    在数据方面，一方面，中国的基础数据量远远领先欧美，特别是根据众多人口数量获得的医疗和健康数据，但是这些数据缺乏一个具有统一标准的、跨平台分享的生态环境，大多数都是数据孤岛，利用率和利用价值不高；另一方面，全球已经意识到开放政府数据库有助于促进相关领域人工智能的创新，我国政府数据也在逐步加大开放的力度。


    麦肯锡报告显示，中国数据开放度排名为全球第93位，数据的评估标准主要基于能够影响公众获取数据的十大方面，包括数据是否公布、是否免费、是否及时更新、是否及时更新等。数据开放度评估项及中美两国的全球排名如表4-1所示。


    表4-1 中国和美国数据开放度全球排名


    ![](images/4ab0f9106843c3a7f2e7764c77ce26f1.jpg)


    续表


    ![](images/8576d195cdd53295f8c2588e3733e17a.jpg)


    从目前人工智能的发展情况来看，算法和算力已经基本不存在技术壁垒，而数据将成为决定项目成败的关键。缺乏数据的人工智能就是“无米之炊”，特别是在医疗方面。落实到医疗领域，中国的医疗数据并不匮乏，但是有效的医疗数据仍旧“捉襟见肘”，特别是对这些数据的标注和结构化处理是一个难题，这让机器学习困难重重。


    中国初创企业目前在医疗数据的获取上还有相当大的难度。第一，企业尽管能够通过医院或其他渠道获得海量数据，但是数据缺乏标准化，数据质量不高；第二，国家对跨境数据流通的限制也使得中国在全球合作中处于不利地位。


    在人工智能的创新程度方面，美国的人工智能初创企业无论是在数量上还是多样性上都远胜中国，行业投资和并购活跃度也更高。中国的人工智能企业大部分集中在网络安全、医疗和机器人领域，在金融、汽车、商贸领域的核心技术方面落后美国较多。这一点在后面的人工智能医疗初创企业分析中就可以观察出，仅是在医疗这一细分领域中，很多研究方向只有美国企业在做，中国企业的参与度还很低。


    总体判断，我国学者在人工智能方面的研究在全球是属于第一梯队的，但仍要清醒地认识到自己的短板和问题。比如，在研发上，基础理论、核心算法、关键设备、高端芯片、重大产品和系统方面的原始创新成果还比较少；在人才储备上，无论是从人才规模还是人才质量来讲，现有的人才储备远远满足不了经济社会发展对人工智能的强烈需求，特别是高端领军人才比较匮乏；在产业生态上，我国的科研机构和企业还没有形成具有国际影响力的生态圈和产业链；在创业公司方面，我国的创业公司数量和领域研究广度也落后于美国。


    ## 4.3 国内巨头的2017年


    2017年，我国医疗人工智能发展迅猛，全年有超过28家创业公司获得融资，总额超过17亿元。拥有强大人工智能人才和技术储备的传统互联网巨头也纷纷布局医疗人工智能（表4-2）。


    表4-2 大公司人工智能医疗产品布局


    ![](images/3f7c4c8680a11ad7481d72e0700f0c04.jpg)


    续表


    ![](images/e410c7eb7ca5d05655ec1c34bc5738a1.jpg)


    （1）腾讯发布觅影产品，入选人工智能“国家队”后，医疗事业发展迅猛。


    （2）阿里云发布了ET医疗大脑，依靠云计算和AI技术的优势，在数据处理、智能医学影像、语音识别等领域都有所突破。


    （3）百度喊出了“All In AI”的口号，但是百度早已裁撤了医疗事业部，全力研发自动驾驶。


    （4）科大讯飞赶上人工智能的风口，市值超过1000亿元。科大讯飞在医疗领域走得很扎实，与安徽省立医院合作共建了全国第一家智慧医院，与清华大学合作研发了通过医考笔试测试的机器人。除了智能语音技术之外，讯飞医疗还推出了影像辅助诊断系统、智医助理，在行业内极具竞争力。


    （5）京东看似与医疗AI毫无关联，但是它通过入股科大智能，扩大了其在科技医疗领域的布局。


    ## 4.3.1 腾讯觅影作为“互联网+智慧医疗”的一部分进入医院


    腾讯在人工智能方面的研究比阿里巴巴和百度稍晚，之前主要是通过投资初创企业的方式布局人工智能。2016年，腾讯低调成立腾讯人工智能实验室（AI Lab），专注于人工智能的基础研究及应用探索。


    ### 1．人工智能基础技术


    腾讯涉足的人工智能基础技术包括计算机视觉、语音识别、自然语言处理和机器学习4个方面，并根据腾讯业务提出游戏、内容、社交及工具平台型AI这4个应用方向。


    ### 2．人工智能与医疗


    腾讯投资的碳云智能iCarbonX定位于生命大数据、互联网和人工智能创建的数字生命生态系统的研究。其投资的另一家人工智能医疗企业Cloud MedX^(\[1\])是一家医疗健康数据收集和分析服务提供商，从众多医院实时收集不同病患的数据，经处理分析后向医疗机构提供符合《健康保险流通与责任法案》（HIPAA）的健康预测和分析。


    2017年8月，由腾讯“互联网+合作”事业部牵头，汇聚腾讯公司内部包括腾讯AI Lab、优图实验室、架构平台部等多个顶尖人工智能团队，腾讯成立了人工智能医学影像联合实验室，推出腾讯觅影，把图像识别、深度学习等领先的技术与医学影像结合起来。腾讯觅影包含早期食管癌智能筛查系统、早期肺癌筛查系统、糖网智能筛查系统、宫颈癌筛查智能辅助系统、乳腺癌淋巴病理筛查系统、乳腺癌智能筛查系统和智能辅助诊疗系统。


    腾讯觅影发布不到半年的时间，合作的医疗机构已经接近百家。除了医疗AI技术和产品本身的优势这个原因外，腾讯觅影入选首批国家新一代人工智能开放创新平台名单，以及拥有微信医保支付、商业保险、微信在线医师咨询等完整的医疗服务能力也是其快速扩张的原因。


    腾讯觅影就像微信医保支付等服务产品一样，作为腾讯“互联网+智慧医疗”生态系统的一部分，很多时候是伴随“互联网+智慧医疗”产品线一同进入医院的。另外，腾讯觅影的多位高管在不同的场合强调，腾讯觅影产品目前的业务是进行疾病的筛查工作，为医生提供更多的决策信息。


    按照新修订的《医疗器械分类目录》，如果仅做出决策信息而不给出诊断结果，仅需申报二类器械认证，这在很大程度上降低了人工智能医疗产品进入医院的门槛。


    ## 4.3.2 阿里巴巴重视基础技术、数据和人才，为行业提供开


    ## 放平台


    ### 1．人工智能基础技术


    阿里巴巴涉足的人工智能基础技术包括机器学习平台 PAI 2.0、人工智能芯片、云计算、物联网（IOT）、操作系统和生物识别。


    ### 2．人工智能与医疗


    阿里巴巴在人工智能与医疗领域的布局是一套被称为“Doctor You”的智能医疗系统，该系统提供医学影像云平台、肺结节智能检测、科研数据平台和医师能力培训平台4种解决方案。


    在医学影像云平台中，阿里巴巴为医疗机构、第三方医学影像中心等合作伙伴构建医学影像智能诊断平台，并提供混合云存储、远程智能诊断、影像三维重建、区域影像等云服务。


    在肺结节智能检测中，其智慧医疗团队背靠阿里巴巴集团强大的机器学习技术和人工智能资源，同合作密切的影像中心和医院结成联盟，研发具备独立知识产权的CT影像肺结节检测引擎。


    在科研数据平台上，阿里巴巴将双核矩阵赋能于临床科研数据中心，使用强大的搜索引擎技术为医生提供快速、准确，多种组合方式的智能病历搜索功能。通过数据仓库、数据挖掘等方法获取数据，用海量临床科研数据来评价治疗效果，发现诊疗规律，提出最佳治疗路径，提高医疗科研的能力和水平。


    在医师能力培训平台，阿里巴巴与浙江大学医学院附属第二医院合作开发了沉浸式医师培训系统，以求切实提升医师培训的质量与效率。新打造的医师培训系统将从过往脱敏病例中挖掘疾病的临床路径并自动构建虚拟病人，医师用户可在模拟场景中对虚拟病人进行诊疗，并从中获取医学知识，规范诊疗操作，提高临床思维能力。


    与腾讯觅影大面积落地医院的发展思路不同，阿里云医疗事业部总经理唐超曾表示：“阿里云在医疗健康行业人工智能热潮下的思考是，我们更需要重视基础设施和人才这两件事情。”因此，阿里云举办了天池大赛，已经涉及全球73个国家和地区超过10万名开发者，覆盖2763所科研院校，为阿里储备大数据和人工智能人才提供了良好的平台。在基础设施方面，阿里云构建了ET医疗大脑开放平台，与生态合作伙伴一起致力于人工智能在医疗领域的场景化落地。阿里云希望为开发者和企业提供整个模型从训练到发布的基础支撑，让所有的开发者和企业都能够快速、低成本地发布自己的模型，并且通过开放平台，为他们找到真正的业务落地场景。


    阿里云还有一个明显的优势——数据。作为国内领先的云计算公司，阿里云旗下的医疗信息化平台中沉淀了大量的过往数据，包括医疗服务临床、检验、体检等数据。阿里云希望能够帮助医院在一个统一的平台上实现数据统一的“存通用”，这些数据更是医疗AI产品的研发基石。


    唐超也曾表示，阿里云做的是连接。互联网的发展让人与人之间的联系变得成熟，但人和机器的连接、机器和机器的连接还处在初级阶段。在人机的连接中，阿里云希望能提供核心统一的连接功能，而整个行业生态合作伙伴的连接也在阿里云技术赋能平台上起着重要的作用。


    从阿里云提供的服务可以看出，为开发者和企业提供整个模型从训练到发布的基础支撑是其重要的服务内容。


    ## 4.3.3 讯飞医疗：三大产品+一个平台


    如果比较公司的整体实力，科大讯飞与腾讯、阿里巴巴还有较大差距。但是在医疗人工智能领域，讯飞拥有可与腾讯和阿里巴巴媲美的实力。


    讯飞医疗的AI类产品主要有3个：语音电子病历产品、影像辅助诊断系统、智医助理。


    （1）利用人工智能语音识别、自然语言理解技术，结合专业级的定向麦克风，语音电子病历产品的识别准确性、降噪水平、续航能力都能满足医生的要求。


    （2）讯飞医疗的负责人陶晓东原是飞利浦医疗放射解决方案的首席架构师，长期从事医学影像的研究，他的加入使讯飞在医疗影像领域取得了飞速发展，其影像产品已经在临床上进行了验证。


    （3）2017年，科大讯飞与清华大学联合研发的“智医助理”通过国家执业医师资格考试综合笔试评测，这奠定了讯飞在辅助诊断机器人方面的地位。如果“智医助理”像机器人索菲亚那样获得公民身份，参加并通过国家执业医师资格考试——实践技能考试，那是不是就成为一名真正的医生了？


    基于以上3款产品，科大讯飞打造人工智能辅助诊疗平台，为大医院、基层医院、体检机构和基层医疗机构提供人工智能辅助诊疗。


    另外，讯飞也在和医疗机构共建智慧医院。2017年8月20日，科大讯飞与安徽省立医院宣布建立全国第一家智慧医院。智慧医院包含了智慧就医、智慧诊疗、智慧管理3个部分，服务内容包括互联网挂号、预约、导诊、辅助诊疗、院内管理等。


    相比于腾讯和阿里巴巴，讯飞医疗的AI产品在医疗中打磨的时间相当长，涉及的病种除了肺部疾病外，还包括乳腺癌、阿尔茨海默病等。另外，讯飞医疗在基因领域也投入了很多精力。


    ## 4.3.4 百度在医疗领域逐渐销声匿迹


    百度在多个场合表示它已经不再是一家互联网公司，而是人工智能公司。之所以有这样的底气，是因为百度每年投入上百亿元的研发资金在人工智能方面，正在推进的“百度大脑”项目已经取得了不错的成绩。


    ### 1．人工智能基础技术


    百度发力的人工智能基础技术包括百度大脑、人工智能算法（超大规模的神经网络）、自然语言处理技术、图像识别技术和大数据结构化。


    ### 2．人工智能与医疗


    百度在人工智能医疗领域的技术研发主要为百度医疗大脑。百度医疗大脑通过海量医疗数据、专业文献的采集与分析进行智能化的产品设计，模拟医生问诊流程，与用户多轮交流，依据用户的症状提出可能出现的问题，并反复验证，给出最终建议。


    百度的人工智能医疗布局场景主要包括虚拟助手和医学影像。


    2017年，百度医疗事业部裁撤，并永久关闭“百度医生”，这标志着百度退出移动医疗。但是，基于人工智能技术的百度医疗大脑却依旧在发挥作用。2017年4月，百度医疗大脑宣布与国内医疗服务领导者社区580合作，将人工智能赋能医疗社区，并上线“美乐医”，为用户带来24小时医疗咨询服务。此次百度医疗大脑与社区580的签约合作，将为分级医疗注入人工智能的“技术大脑”。


    自此以后，百度完全是在提供技术服务了。后续是否会有百度开发的医疗人工智能产品发布，尚不明确。


    总的来说，由于百度没有医疗人工智能产品，我们就腾讯、阿里和科大讯飞的产品进行了对比，如表4-3所示。它们都在自然语言处理、计算机视觉、机器学习、语音识别等技术方面有很深的积累，应用到医学领域以后，各自的发展路径却不相同。


    虽然3家公司都研发出了具体的医疗人工智能产品，但是发展到现在，腾讯和讯飞医疗通过和医院共建“智慧医院”的形式落地自家产品，阿里云主要向创业公司提供技术平台。而其他的创业公司大多是以单个产品切入医院的具体科室。


