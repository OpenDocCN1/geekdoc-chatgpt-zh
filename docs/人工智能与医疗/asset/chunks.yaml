    在 CUDA 架构的 GPU 基础上，NVIDIA 开发出通用计算专用的 Tesla 计算卡。各个领域的研究人员通过 Tesla 计算卡享受到此前只有超级计算机才具备的计算能力。它被广泛使用在药物研发、医学成像、天气建模、科学研究等各种大规模计算中。


    在拥有强大的计算能力之后，GPU 当然也被超级计算机所采用。相比传统 CPU 搭建的超级计算机，采用 GPU 计算核心的超级计算机拥有性能高、功耗低的特点。2010
    年计算性能世界排名第一的中国天河一号 A 超级计算机，就使用了 NVIDIA Tesla 计算卡。


    在这一段时间里，除了 GPU 之外，NVIDIA 也开始进军移动处理器领域。Tegra 系列曾是 NVIDIA 进军智能手机芯片市场的一次尝试。当时，黄仁勋认为智能手机正处在改变计算和通信方式的风口浪尖。但是，由于低估了集成基带的重要性，NVIDIA
    在手机芯片市场上的表现并不出色，平板电脑市场也不尽如人意。现在智能手机几乎不再使用 Tegra，NVIDIA 的产品中 Shield 平板和 Shield
    TV 还在使用 Tegra 处理器。


    但是，Tegra 产品延伸到汽车领域后却大获成功，NUIDIA 利用其 GPU 计算能力主攻车载娱乐系统和无人驾驶系统。特斯拉 Model S 电动车的车载娱乐系统正是基于
    Tegra 3 设计的，现在已经升级到最新的 Tegra X1。而基于 Tegra 的无人驾驶系统 DRIVE PX，也被沃尔沃、奥迪、宝马、奔驰等大厂采用。


    ## 3.5.4 通用计算和医疗行业


    在通用计算时代，医疗领域是 NVIDIA GPU 发挥作用的重要阵地。医疗成像是较早利用 GPU 通用计算能力加快性能的商业应用之一，有多款医疗设备均配备了
    NVIDIA Tesla GPU。


    在一些医疗影像应用中，计算机需要处理大量的高精度 CT 或者 MRI 图像。患者需要快速、精确并且舒适的诊断，而医生则需要能够实现高效诊断的工具。将庞大的服务器阵列引入临床设备非常困难，但
    GPU 和 Tesla 的强大计算能力使得提供小型的并行计算模块成为可能。


    GPU 的通用计算性能能够让科研人员以比处理器快数十倍甚至上百倍的速度处理这些图像。因此，医生能够实现实时查看 CT 和 MRI 的 3D 合成图像，或者在不损失检查影像画质的情况下，能够使系统更快地运行。通过这些快速得到的结果，医生能够检查病患组织的状态并做出诊断，而无须活体检查和外科处理。此外，某些医生可以同时查看此类图像，彼此沟通。GPU
    还被利用在 GE Revolution CT 扫描仪上，不但可以生成高画质影像，还能使患者受到的辐射减少 82%。


    对于那些敢于迎接最难挑战的科研人员来说，GPU 的通用计算平台成为成功的关键。伊利诺伊大学的科学家利用一台基于 GPU 的超级计算机，首次对病毒衣壳进行了全原子模拟，在艾滋病病毒的研究方面取得了突破性进展。该论文发布在《自然》杂志上，首次确定了
    HIV“病毒衣壳”的准确化学结构，是其病毒性的关键所在。


    在药物开发、计算化学、生物信息及生命科学领域，GPU 都发挥了其显著的并行计算能力。斯坦福大学化学系副教授兼 Folding@home 项目总监 Vijay
    Pande 表示：“NVIDIA GPU 对蛋白质折叠模拟的影响是巨大而深远的。使用 GPU 来模拟蛋白质折叠的团队实现了其生产效率的极速飙升。在 Folding@home
    中应用如此强大的处理性能彻底改变了这一项目，极大地缩短了我们进行生物医学研究所需的时间。”


    ## 3.5.5 第三阶段：从通用计算向人工智能迈进


    GPU 的通用计算能力使得它的应用场景从单一的图形渲染扩展到需要计算的方方面面，能够让科学家和科研人员利用 GPU 强大的并行计算能力来解决复杂的计算难题，这其中也包含了深度学习计算。


    2010 年，世界各地的人工智能研究员已经开始利用 NVIDIA GPU 的并行计算能力来进行神经网络训练。2012 年是人工智能标志性的一年。多伦多大学
    Alex Krizhevsky 创建了能够从 100 万样本中自动学习识别图像的深度神经网络。仅在两块 NVIDIA GTX 580 计算机显卡上训练几天，“AlexNet”就赢得了当年的
    ImageNet 竞赛，击败了有着几十年算法经验的人类专家。


    2012 年，在认识到网络规模越大，其学习能力越强的规律之后，当时还在斯坦福大学的吴恩达（Andrew Ng，后来加入百度，并于 2017 年离开）与 NVIDIA
    研究室合作开发了一种使用大规模 GPU 计算系统训练网络的方法。这引起了全球关注，世界各地的人工智能研究人员转向 GPU 深度学习。百度、谷歌、Facebook、微软是首批将深度学习用于模式识别的公司。


    GPU 深度学习正改变着软件的开发与运行方式。过去，是软件工程师构思程序的算法并编写代码；现在，算法从真实世界的海量实例中自我学习，实现软件自我编写。深度神经网络被部署在数据中心和智能设备中以便推理和预测下一步行动。GPU
    深度学习为机器学习、认知、推理与解决问题奠定了基础。


    NVIDIA GPU 特别擅长处理并行工作负载，可让网络提速 10～20 倍，从而将各个数据训练迭代周期从几个星期缩短为几天。实际上，GPU 在仅仅 3 年内便将深度神经网络
    （DNN） 的训练速度提高了 50 倍（这一速度远远超过摩尔定律），预计未来几年还将再提高 10 倍。


    谷歌的 AlphaGo 大胜韩国围棋棋手李世石，其中就使用了 NVIDIA 的 GPU 产品。单机版的 AlphaGo 使用了 40 个线程、48 个 CPU
    和 8 个 GPU，分布式版的 AlphaGo 使用了 40 个线程、1202 个 CPU 和 176 个 GPU。


    为了进行深度学习的部署，NVIDIA 的策略有 3 步：第一步是建立深度学习生态圈，和科学家共同进行深度学习技术的研究；第二步是在不同的平台上进行深度学习部署，包括汽车、计算机、智能机器人、服务器等；第三步则是提供端对端的解决方案。这种方式的好处是，NVIDIA
    可以在不同平台上让这套算法进行学习并共享知识，而且未来这套深度学习算法的应用很有可能并不止于自动驾驶的汽车上，在物联网上也会提供解决方案。


    除了提供 GPU 硬件产品，NVIDIA 也一直致力于开发深度学习软件、库和工具。为训练图像、笔迹和声音识别等应用程序并加快训练速度，目前的深度学习解决方案几乎完全依赖
    NVIDIA GPU 加速计算。NVIDIA 提供了一个端到端的人工智能计算平台——从 GPU 到深度学习软件和算法。


    NVIDIA 提供了用于设计和部署 GPU 加速的深度学习软件 TDK——cuDNN，它加速了大多数深度学习软件框架（如 Caffe、Caffe2、TensorFlow、Theano、Torch、CNTK），让工程师专注于训练神经网络和开发软件应用程序，而不用花时间进行底层的
    GPU 性能调优。NVIDIA GPU 深度学习系统得到了迅速的扩展，突破性地在人工智能搜索、识别、推荐、翻译等方式中应用。阿里巴巴、亚马逊、IBM、微软等全球大型公司普遍使用
    NVIDIA 的 GPU 深度学习平台提供服务。


    NVIDIA 在 2016 年年底，推出了首款人工智能超级计算机 DGX-1（图 3-29），这是一款即插即用的计算设备。它的计算性能相当于一个含有 250
    个节点的高性能计算集群，可将网络训练用时从数周缩短至几天。这些设备已经成为阿里巴巴、亚马逊、谷歌、IBM、微软、SAP 等企业的人工智能的大脑。同时，NVIDIA
    还开发了 DRIVE PX2、Jetson TX1 等小型人工智能系统，使之成为无人驾驶汽车、智能机器人、智能物联网的大脑，使得机器人能够通过反复试验进行自我学习。


