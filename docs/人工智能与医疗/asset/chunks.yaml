    [1] 智能化器械：由现代通信与信息技术、计算机网络技术、行业技术、智能控制技术、人工智能技术汇集而成的针对医疗器械的应用。智能化器械不是指普通的拥有智能功能的医疗器械，它可以摆脱对医生操作的依赖，通过机器学习等底层技术实现自我的更新迭代。


    ## 2.7 药物发现

    在药物、生物技术和药理学领域，药物发现是发现新的候选药物的过程。早期，人们只能通过传统治疗方法或偶然发现鉴定活性成分来发现药物。之后，通过合成小分子、天然产物或提取物在完整的细胞或整个生物体中进行筛选，来鉴定是否有治疗作用的物质。


    新药的开发流程可分为药物发现、临床前开发和临床开发 3 个部分。而现代药物发现在技术上又可以分为 3 个阶段：靶点的发现和确证、先导物的发现、先导物的优化
    3 个阶段。


    ## 2.7.1 药物发现的现状

    药物发现是一种资本密集型的研究，需要药业公司及各国政府的大量投资。尽管生物技术不断进步，药物发现仍然昂贵、困难和低效。药物发现的“最终产品”是一个关于潜在药物的专利。之后药物还需要经过非常昂贵的Ⅰ期、Ⅱ期和Ⅲ期临床试验，其中大多数产品会在这个过程中被淘汰。


    关于创新药的研发，国际上有一种“双 10”的说法：10 年的时间，10 亿美元的投入。一般而言，制药公司需要花费 5 亿～10 亿美元，10～15 年时间，才能成功研发出一款新药。新药研发的风险大、周期长、成本高，是药企最大的痛点之一。


    ## 2.7.2 人工智能重构新药研发

    目前，新药产品的研发越来越难以取得突破：一方面，大多数可以使用的化合物已经被发现，新的化合物的开发难度逐渐加大；另一方面，科学成果的数量增长速度很快，人类个体不可能完全理解这些数据。而人工智能可以从海量论文中摄取所需的分子结构等信息，并且可以自主学习，建立其中的关联，提供新的思路和想法。如图
    2-36 所示，人工智能可以大幅度降低药物的研发成本，为药物研发带来机遇。


    ![](img/f2209b0a93b3417aa9a9e24e426069b4.jpg)


    图 2-36 人工智能可以大幅度降低药物研发成本


    2015 年，FDA 报告了 60 种获批药物，这意味着算上失败药物的研发成本，该年度每种获批药物的成本约为 6.98 亿美元，其中有将近 420 亿美元用在了失败药物上。蛋壳研究院认为，人工智能可以将新药研发过程中的风险减半：到
    2025 年，全球制药行业每年可节省约 260 亿美元。


    人工智能的加入，已经开始重构新药研发的流程，人工智能在新药研发上的应用也开始从靶点筛选向更多方面拓展。


    根据在流程上的分布，我们将 AI+新药研发的服务类型分成了 3 类：临床前药物发现服务、临床前药物自主研发和临床研究服务（图 2-37）。


