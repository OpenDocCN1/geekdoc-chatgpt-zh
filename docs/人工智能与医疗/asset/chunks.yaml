    # （2）人工智能与医疗


    Watson 在医疗领域主要关注肿瘤和癌症的诊断，其优势在于自然语言处理，通过挖掘非结构化数据寻找深层关系。Watson Health 的商业战略为：第一，深度聚焦肿瘤领域，并向其他领域扩展；第二，通过大规模收购获取数据资源；第三，通过合作等扩展使用场景，输出生态能力。


    汇聚了医疗保健数据、人力、能力、客户后，Watson Health 将成为潜力巨大的医疗保健大平台。


    IBM Watson 肿瘤治疗（IBM Watson for Oncology）已经能提供肺癌、乳腺癌、结肠癌和直肠癌解决方案。除此之外，IBM 还与制药巨头辉瑞合作，辉瑞将在沃森药物发现（Watson
    for Drug Discovery）的自然语言处理、认知推理系统的帮助下，进行新药物的识别。IBM 的布局场景主要包括医学影像、新药研发、病历/文献分析、决策辅助等。


    ## 3.1.1 IBM Watson 人工智能医疗应用详情剖析


    ### 1．“认知计算”带领电子计算走入新时代


    IBM 把电子计算时代划分为 3 个阶段（图 3-1）。


    ![](img/96427fd816d04507fae30bf8bb7a4f0f.jpg)


    图 3-1 IBM 把电子计算时代划分为 3 个阶段


    第一个阶段是制表系统年代，时间是 20 世纪初。1886 年，美国统计学家赫尔曼·霍勒瑞斯借鉴了雅各织布机的穿孔卡原理，用穿孔卡片存储数据，用机电技术取代了纯机械装置，制造了第一台可以自动进行加减乘除四则运算、累计存档、制作报表的制表机。这台制表机参与了美国
    1890 年的人口普查工作，使预计耗时 10 年的统计工作仅用 1 年零 7 个月就完成了，是人类历史上第一次利用计算机进行的大规模的数据处理。霍勒瑞斯于
    1896 年创建了商旅管理公司（TMC）。1911 年，TMC 与另外两家公司合并，成立了 CTR 公司。1924 年，CTR 公司改名为国际商业机器公司（International
    Business Machines Corporation），这就是 IBM 公司。


    第二个阶段是编译系统年代，时间是从 20 世纪 60 年代到 2010 年。计算机硬件已经从晶体管向大规模集成电路迈进。而计算机所读的语言从 0、1 组成的机器语言逐渐过渡到汇编语言和高级语言。计算机之间的数据交换变为可能，各种计算机程序开始铺天盖地。


    第三个阶段就是 2010 年以后的认知系统年代。此阶段的代表就是人工智能的出现，如拥有“认知计算”能力的 Watson。IBM 在 2006 年启动研发 Watson，于
    2014 年投资 10 亿美元成立 Watson 事业集团，次年便组建了 Watson Health 平台，专门针对医疗健康行业提供人工智能认知解决方案。


    ### 2．Watson 是如何回答问题的


    IBM Watson 的出名，源于 2011 年参与美国问答节目《危险》（Jeopardy!）。在这次节目中，Watson 战胜了这一节目的两位人类冠军选手，被认为是人工智能历史上的一个里程碑。从底层来讲，Watson
    由深度问答系统（Deep QA）驱动，是一个集自然语言处理、信息检索、知识表示、自动推理、机器学习等开放式问答技术于一体的应用，基于为假设认知和大规模的证据收集、分析、评价而开发，图
    3-2 所示为其问题处理逻辑。深度质量保证的目标绝不仅仅是回答一些特定的简单问题，而是利用运算能力，建立一套基于概率化证据的大规模并行架构，它综合利用数千种自然语言处理、信息检索、机器学习和推理算法，分析生成多种假设，然后从中收集、评估、权衡各类证据，最终给出最佳答案。


    ![](img/ecd977d4481195c67092c24b6db2f1a2.jpg)


    图 3-2 IBM Watson 问题处理逻辑


    Watson 的能力包括 3 个方面：理解、推理和学习。首先，能够“理解”人类的问题，是 Watson 能进行认知协作的第一步，主要运用的是计算系统处理结构化和非结构化数据的能力；其次是推理，Watson
    主要运用一种名为“假设生成”的算法，从数据中抽丝剥茧，寻找事物间的相关联系；最后是学习，Watson 从大数据中提取关键信息，以证据为基础进行学习。


    ### 3．Watson 在医疗上的商业化应用


    Watson 的第一步商业化运作就是在医疗行业，通过和纪念斯隆—凯特琳癌症中心进行合作，得到大量的癌症临床知识、分子和基因组数据、癌症病例历史信息。在该中心“学习”之后，Watson
    为临床医师提供以证据为基础的治疗方案。随后该系统被 Watson Health 部署到了许多顶尖的医疗机构，如克利夫兰诊所和 MD 安德森癌症中心，提供基于证据的医疗决策系统。


    医疗数据处于爆发式增长态势，仅凭人力不足以处理和学习，而 Watson Health 可以帮助人们提高医疗效率，图 3-3 所示为 Watson 数据处理的效率优势。IBM
    判断，在 2020 年，医疗数据每 73 天就会翻一番，而且其中 80%以上的数据是非结构化的，非结构化数据主要是指那些无法用固定结构的逻辑方式来表达、实现的数据，如视频、音频、图片，对计算机来说是不可见的。而
    Watson 可以看到这些数据，并进行深度学习。医生若想学习最新的医疗知识，每周需花 160 小时，而 Watson 在 15 秒内就可以读取 4000 万个文件，学习速度非常快。


    ![](img/fae933cb0aa9b9c0fb930793d851f3fb.jpg)


    图 3-3 IBM Watson 的数据处理效率优势


    IBM Watson 的发展，也经历了多宗并购，使其得到技术上的加强，图 3-4 所示即为其并购升级过程。2015 年年初，IBM 宣布收购 Alchemy
    API，这个平台有数万名开发者在利用机器学习算法，做自然语言处理和图片识别，可以改善 Watson 的生态系统。不久之后，又先后并购了 4 家医疗数据公司：探险家（Explorys）、菲特尔（Phytel）、合并医疗（Merge
    Healthcare）和特文卫生分析（Truven Health Analytics），其中特文卫生分析的收购价格高达 26 亿美元（探险家是一个基于云技术的数据分析公司；菲特尔开发以云计算为基础的工具来加强健康护理的协调工作和成果）。2015
    年 8 月，IBM 用数十亿美元收购了 MergeHealthcare，强化 Watson Health 的主业务。Watson 的每一种应用都需要一段时间的预先训练，这也给计算和数据提出了要求。如上所述，IBM
    的投资和收购都是围绕公司这一长期发展战略而进行的，如收购私有云服务商 Blue Box、数据库管理工具 Compose、API 接口工具 Strong Loop、海量数据存储
    Cleversafe 等，希望从数据量和算法两方面提高 Watson 在医疗和其他领域的实力。


    ![](img/8e1c42123605f36d3d16ac5a313969e1.jpg)


    注：用虚线框起来的表示与医疗有关。


    图 3-4 IBM Watson 的并购升级过程


    ### 4．Watson 是如何治疗癌症的


    人类对肿瘤的认知经历了漫长的过程。从早期的外科手术直接切除肿瘤，到后来的放疗、化疗，再到基因研究的深入，肿瘤学家认识到肿瘤不是一种疾病，而是一大类疾病，即使是相同部位的肿瘤，每个人的病理特性也都不尽相同。例如，对
    ER 受体阳性的乳腺癌，他莫昔芬有效；而对于 ER 受体阴性的乳腺癌则无效。由于这种特异性的存在，因此每种肿瘤治疗方案都需要个性化定制。


    2013 年，纪念斯隆—凯特琳癌症中心与 IBM Watson 达成了合作，共同训练 IBM Watson 肿瘤解决方案。癌症专家在 Watson 中输入了纪念斯隆—凯特琳癌症中心的大量病历研究信息以进行训练。在此期间，该系统的登入时间共计
    1.5 万个小时，一支由医生和研究人员组成的团队一起上传了数千份患者的病历，近 500 份医学期刊和教科书，1200 万页的医学文献，把 Watson 训练成了一位杰出的“肿瘤医学专家”。


    Watson 治疗癌症的过程是这样的。首先，IBM Watson 分析患者的病历。Watson 肿瘤解决方案拥有先进的能力，可分析临床记录和报告中的结构化和非结构化数据的含义和内容，吸收以普通英语编写的关键患者信息，这些信息可能对于选择治疗方法至关重要。


    其次，Watson 识别基于证据的潜在治疗方案。通过将患者文件中的属性数据与临床知识、外部研究结果和数据相结合，Watson 肿瘤解决方案识别潜在的患者治疗方案供医生参考。


    最后，IBM Watson 从大量文献中查找并提供支持证据。IBM Watson 将识别的治疗方案进行排序，并将每种方案支持的证据链接在一起，帮助肿瘤医生研究患者的治疗方案。图
    3-5 所示为 IBM 肿瘤解决方案的操作流程。


    ![](img/2558eed2add70166bb044ce45c3403e7.jpg)


    图 3-5 IBM 肿瘤解决方案的操作流程


    2015 年，来自美国和加拿大的 14 家肿瘤中心宣布将部署 Watson，根据患者的肿瘤基因选择适当的治疗方案。通过此次合作，IBM 希望 Watson
    系统能基于所处理的基因信息来选择治疗方案，从而取代当前 “肿瘤委员会”（Tumor Board）用药决定的模式。“肿瘤委员会”是肿瘤治疗实践中建立的一种类似会诊的治疗模式，拥有不同医疗专业技能的医生，如手术外科医师、药剂师等聚集在一起，成立针对某个病例的肿瘤委员会，讨论疑难、少见肿瘤病例的诊断和治疗，制定合理的诊断方法和治疗措施。


    Watson 已经广泛应用于多家癌症治疗机构。总部位于曼谷的布伦格勒国际医院（Bumrungrad International Hospital），是南亚最大的私人医院，也是全球最受欢迎的医疗机构之一。为改善其癌症护理质量，布伦格勒选择了
    Watson 肿瘤解决方案，帮助医生为癌症患者规划最高效的治疗方案——创新性认知计算解决方案。


    2016 年 8 月，IBM 与杭州认知网络科技有限公司共同宣布 Watson 进入中国。在国内，有 21 家医院计划使用经由纪念斯隆—凯特琳癌症中心训练的
    Watson 肿瘤解决方案，以期基于此认知计算平台助力中国医生获得个性化的循证癌症治疗方案。


