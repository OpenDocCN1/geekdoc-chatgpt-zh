    NEA 资本的 A 轮融资，2018 年 3 月，NEA 资本、百度风投对其进行了 B 轮投资。


    阿里在 2017 年 10 月领投了中国香港基因检测初创公司 Prenetics 的 4000 万美元 B 轮融资，该公司成立于 2009 年，总部位于香港。公司主要利用基因技术为用户提供健康支持，只需简单的唾液样本，就能让用户了解自己的基因信息，从而调节日常饮食和生活习惯。除基因检测外，Prenetics
    还包括遗传健康疾病预防、药物过敏预防等。该笔投资由阿里香港创业者基金完成，这是一家非营利机构，主要支持能给阿里巴巴生态系统作出贡献的公司。


