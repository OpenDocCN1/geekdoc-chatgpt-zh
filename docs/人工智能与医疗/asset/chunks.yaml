    从综合报告的数据来看，中国未来的AI人才主要分布在一些高校的实验室中，如清华大学、北京大学、哈尔滨工业大学等，他们中的一部分会出国深造后再回国，一部分会直接创业或就职于大型科技公司，无论是人工智能医疗公司还是其他行业公司的人力资源部，如果想招到优秀人才，那么这些学校会是不错的选择。


    最后，在调研过程中，动脉网还了解到，中国的高校目前非常重视培养AI人才，但是缺乏对医疗领域AI人才的培养。而正是这些缺失的交叉学科人才对行业理解更深入，更受企业欢迎。


