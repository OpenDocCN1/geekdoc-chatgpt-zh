    针对精神分裂症患者人群的临床试验，将依从性比例由50%提升至90%。


    ## 6. 患者数据收集

    在传统的新药研发流程中，患者的健康状况和身体数据情况只能在临床中进行评估，患者需要进行定期检查，特定时间和地点获得的数据并不能完整地代表患者的身体情况，容易出现数据偏差。在这个阶段可以应用可穿戴设备与机器学习分析来提升临床试验中的患者参与度、数据质量和操作效率。


    生命科学临床研究领域云解决方案供应商Medidata宣布与Garmin达成战略合作，通过Garmin的健康手环与Medidata的临床数据云（Medidata
    Clinical Cloud）相结合的方式提升临床试验中的患者参与度、数据质量和操作效率。此外，可穿戴式生命体征监测公司Vital Connect等还获得了食品药品监督管理局的批准，利用其生物传感器来监测患者的各项生物指标。这些涉及生命科学研究领域的公司正把我们推向一个新的时代，连接到之前根本无法获取的一系列新行为数据。前文所述案例均能让科研人员在临床试验中提升患者的互动率，最终让他们获得更多、更实用的数据，这些对于药物研发取得突破至关重要。


    ## 7. 药物晶型预测

    药物晶型对于制药企业十分重要，不但决定小分子药物的临床效果，同时具有巨大的专利价值。药物晶型专利是药品化合物专利之后最重要的专利，是原研药企业阻止或推迟仿制药企业在其化合物专利过期后将仿制药推入市场的重要筹码。药物晶型专利可以延长药物专利2～6年，对于重磅药物而言，则意味着数十亿美元的市场价值。


    利用人工智能高效地动态配置药物晶型，可以预测一个小分子药物所有可能的全部晶型。相比传统药物晶型研发，制药企业无须担心由于实验搜索空间有限而漏掉重要晶型，可以更加自如地应对来自仿制药企的晶型专利挑战。此外，晶型预测技术也大大缩短了晶型开发的周期，使研究者更有效地挑选出合适的药物晶型。


    ### 企业案例


    #### 晶泰科技

    晶泰科技是一家为全球创新药企提供药物晶型设计服务的公司，总部位于深圳，成立于2015年9月，并在2015年12月获得腾讯和人人公司数千万元的A轮融资。公司以量子物理学家和医药界资深专家为核心成员，是全球领先的以计算驱动创新的药物固相研发公司。通过计算物理、量子化学与云端强大的智能算法，实现高度精确的药物固相筛选与设计，大幅度缩短了药物设计、固相筛选与药物制剂开发的时间，对药企的专利申报与保护起到关键作用。公司主要提供药物晶型预测和晶型专利保护服务，帮助药企提高研发效率，降低药物的质量风险和专利风险。


    晶泰科技开发的“药物固相筛选与分析系统”是基于人工智能的深度学习和认知计算能力，能够在短时间内通过对医学文献、临床试验数据等非结构化数据进行处理、学习和计算，预测各种晶型在稳定性、熔点、溶解度、溶出速率等方面的差异，以及由此而导致的在临床过程中出现的不良反应与安全问题，在短时间内筛选出稳定性和溶解度最佳的晶型结构。


    2018年5月9日，晶泰科技与辉瑞制药签订战略研发合作协议，辉瑞将借助晶泰科技的人工智能技术，建立小分子模拟算法平台，驱动小分子药物创新。目前，晶泰科技已完成B轮融资，累计融资总额达到2030万美元。


    # 2.7.5 中国药物发现的难点

    中国的药物研发公司在进行人工智能药物研发方面，要面对人才、数据和商业模式的困难。


    （1）人才。AI应用于药物研发需要若干个垂直领域的专家共同参与才能有所突破；既需要物理学家、化学专家、药物学家、药企研发高管，又需要人工智能科学家、云计算工程师等跨学科人才。在多个领域积累人才和经验，整个团队紧密合作，这样才更容易获得突破性的思路和好的成果。


    （2）高质量数据。AI药物研发需要高质量的数据支持。国内创新药物研发起步较晚，与国外相比，对于优质数据的积累还有一定差距。


    （3）商业模式。生物科技在国内成功的标杆案例较少，同时，药物研发这一领域相比于医疗、金融等领域，其本身有相当的复杂性和不可预测性。这就是为什么人工智能这么热门，人工智能制药却仍“门庭冷落”的原因。


    # 2.7.6 AI+药物发现商业模式探索

    关于商业模式的探索，动脉网在这里分享3种模式，第一种模式是由晶泰科技联合创始人、北京大数据及人工智能研发中心负责人赖力鹏博士提供，后两种模式是动脉网从巢生资本的研究中整编获取的。


    ## 1. 开放和反馈的思路

    晶泰科技一开始就明确了初期主要客户群，在地域设置上形成国内研发、国际业务拓展的模式。在有效控制研发成本的同时，起步阶段就努力在国际范围内寻求合作者。目前，晶泰科技已获得国际顶级药企的信赖并达成长期合作。


    除了拓展国际业务之外，鉴于药物研发流程的复杂性，赖力鹏认为机器学习在药物研发中的大规模应用依赖于整个产业链的共同努力，所以商业上晶泰科技主要施行开放和反馈的思路，其长处是为传统研发人员提供最先进的计算软硬件工具，帮助他们更好、更快地完成科研任务。


    ## 2. 虚拟筛选团队外包验证

    虚拟筛选团队外包的主要方式有两种: 一种是与利益相关者合作，另一种是与非利益相关者合作。


    引入利益相关者，如一个更大的医药公司，公司将受益颇多，如激励一致，与已有临床生产线的整合，致力于特定疾病团队带来的专业知识等。虽然公司需要割舍部分控制力或所有权，
    但是有利于项目研发成功率的提升。


    与非利益相关者合作，如合同研究组织（CRO），公司保留完全的知识产权，执行速度快但是成本高，而且在实验设计上有可能面对控制权的损失，所以为了保证高质量的结果，必须给予特殊的关注。


    这个模式的好处是成本低、速度快，特别是工业界的合作伙伴在新化合物后期验证和临床研发中具有巨大机会。合作伙伴能够理解这些验证实验的动机和设计是至关重要的，因为他们在后续的临床研发中充当重要角色。


    ## 3. 独立的药物研发团队和虚拟筛选团队的良好合作

    在这个模式中，公司团队专注于计算机虚拟筛选，而其他团队给予实验药物研发的支持。和通常专注于特定的配体/受体、生物现象或者疾病领域的团队良好合作，能使项目研发团队有独特的专业性。


    虽然配合程度没有一个完全整合团队那么强，但这种模式的优势在于所提供的处理结构的可变性和合作者的可选择性。具有广泛应用平台的虚拟筛选团队可以考虑用这个结构，在使资本成本最小化的同时处理很多研发项目。


    \[1\] 葛兰素史克公司：以研发为基础的药品和保健品公司，年产药品40亿盒，产品遍及全球市场。葛兰素史克由葛兰素威康和史克必成合并而成，于2000年12月成立。


    \[2\] 高通量筛选：High throughput screening，缩写为HTS，是指以分子水平和细胞水平的实验方法为基础，以微板形式作为实验工具载体，以自动化操作系统执行实验过程，以灵敏快速的检测仪器采集实验结果数据，以计算机分析处理实验数据，在同一时间检测数以千万的样品，并以得到的相应数据库支持运转的技术体系，具有微量、快速、灵敏和准确等特点。简言之，就是可以通过一次实验获得大量的信息，并从中找到有价值的信息。


    \[3\] 拜耳：世界500强企业之一。总部位于德国的勒沃库森，高分子、医药保健、化工以及农业是公司的四大支柱产业。


    \[4\] Biogen：全称为Biogen Idec公司，成立于2003年11月，总部位于美国的马萨诸塞州。Biogen Idec公司为肿瘤学、神经学和免疫学树立了护理新标准。作为开发、生产和销售创新疗法的全球领导者，Biogen
    Idec公司能够将科学发现转变为人类健康保健方面的实质性进展。在欧洲国家及加拿大、澳大利亚和日本均有分支机构，主要研发癌症、精神病、皮肤病和风湿病相关药物。


    \[5\] Fitbit：第一款支持Windows Phone平台的智能手环的记录器。


    # 2.8 健康管理

    个人的健康数据十分复杂，按照数据的来源可以将个人健康数据分为基因数据、生理数据（如血压、脉搏）、环境数据（如每天呼吸的空气）和社交数据等。有了这些个人健康数据，加上人工智能，最终可以实现人们对健康的前瞻性管理。


    健康管理是变被动的疾病治疗为主动的自我健康监控。通过带有医疗监控功能的可穿戴设备实时监控人体各项生理指标，结合其他个人健康数据，对潜在健康风险做出提示，并给出相应的改善策略。


    一个人每天产生的有关健康和生命的数据，如果能够数据化，数据量将会非常大。怎么处理这些数据，把数据变成信息，把信息变成知识，把知识变成健康管理的信息，这便是人工智能在人类生命数据收集后的工作。


    ## 2.8.1 健康管理现状

    在健康管理的3个环节中，获取体征数据是最开始的一环。普通医疗器械不能做到实时、连续监测，有了带有监控功能的可穿戴式设备，在拥有强大远程无线数据传输能力的情况下，医生可对患者的身体状况有长期的把握，从而制定更为有效的治疗方案。


    对于一些病愈出院的患者来说，出院后的监控可以使他们获得更好的康复帮助，大大降低了一些疾病的复发或后续并发症、后遗症发生的可能性。


    根据体征数据，人工智能健康管理通过数据学习每个人的身体特点，针对每个人设计个性化健康管理方案；当身体出现异常时能够快速发现并做出响应；能够提供长时间、不间断监测的健康管理服务（图2-41）。


    ![](images/3e5f02c6afb02981770062a57126eada.jpg)


    图2-41 人工智能参与健康管理的方式


    从硬件上看，可穿戴设备提供长时间的监测功能，这就对智能穿戴设备的佩戴舒适性、续航能力、灵敏度提出了极高的要求。


    人工智能健康管理的最终目标是要实现人们对健康的前瞻性管理，需要对人体多方面的健康情况进行管理，这就意味着这样的健康管理系统是一套拥有多种人体数据库的系统。多维度、多种类数据的积累便成为人工智能健康管理企业长久的任务。


    ## 2.8.2 人工智能应用情况

    健康管理配合智能硬件理论上能实现人体的全面健康管理，但由于目前传感器、硬件的发展水平不高，以及相关疾病数据积累不足等原因，其主要的应用范围是糖尿病、慢性病管理、血压管理、乳腺健康管理、胎心监测等；涉及的健康环节主要有风险识别、健康评估、精神监测、健康干预等。


    （1）风险识别。通过获取信息并运用人工智能技术进行分析，识别疾病发生的风险及提供降低风险的措施。


    （2）健康评估。收集患者的饮食习惯、锻炼周期、服药习惯等个人生活习惯信息，运用人工智能技术进行数据分析并评估患者的整体状态，协助规划患者的日常生活。


    （3）精神监测。运用人工智能技术，根据语言、表情、声音等数据进行情感识别。


    （4）健康干预。运用AI对用户体征数据进行分析，制订健康管理计划。


    根据人工智能应用在不同领域的健康管理，我们将AI在健康管理上的应用分为人口健康管理、母婴健康管理、慢性病健康管理和精神健康管理4个细分领域。


    ![](images/a9e532f774d05e94e5016e1d982690e3.jpg)


    图2-42 人工智能+医疗健康管理企业分布


    ### 1. 人口健康管理

    人口健康学是“人类健康2020”（Healthy People 2020）^(\[1\])愿景中关于医疗卫生研究与医疗健康服务建设的主旨。它包括3个核心目标：①更好的个性化医疗与健康服务；②更好的社会群体医疗与健康发展；③可负担的医疗费用支出。实现这3个目标的最终目的就是让人们更加健康长寿，更好地预防疾病，同时，避免各种形式的残疾、伤害和早产死亡现象等。人口健康管理与其他类型的健康管理区别在于它能为多种类型的个人或群体提供健康管理服务，并且可以为医疗机构、政府、可穿戴设备公司等提供人口健康的信息化解决方案。


    #### 企业案例


    ##### Welltok

    Welltok是一家致力于帮助用户实现个人健康管理和生活习惯提升的数字医疗公司。该公司采用软件即服务（SaaS）的服务模式，打造了CaféWell健康优化平台（Café
    Well Health Optimization Platform），致力于为用户提供在线健康管理服务。该平台首开了利用物质奖励督促用户完成健康计划的先河，在用户遵循Welltok制定的健康方案生活时，会得到平台给予的积分、礼品卡或现金等奖励。据了解，美国科罗拉多州超过60%的职场人士都是CaféWell平台的活跃用户。


    ### 产品介绍

    在Welltok开发的CaféWell健康优化平台上，能看到所有影响个体健康的变量因素，平台根据这些因素设计个性化的解决方案。CaféWell大平台整合有众多健康管理项目、医疗保险计划、App、跟踪健康的可穿戴设备等。为了增加用户黏性，CaféWell承诺为会员用户带来最先进的可穿戴设备，引入奖励机制，即分发零售礼品卡甚至现金来表彰用户健康的行为选择。同时，CaféWell保证应用能在安全、保护隐私的情况下运行，跟踪用户行踪、指导用户健康管理，针对性提出达成目标的建议，并记载目标完成情况。


    ### 优势

