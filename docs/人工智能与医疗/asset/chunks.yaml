    年为国内人工智能医疗爆发元年，碳云智能、推想科技、达闼科技、图玛深维等知名企业相继融资。


    国内单笔融资金额快速增长，2018 年人工智能医疗行业融资均额为 12 582 万元。医学影像、虚拟助手的“吸金”能力增强，加上融资轮次后移，使得国内融资均额大幅上升，如图
    5-10 所示。


