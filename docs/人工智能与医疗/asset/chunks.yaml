    ### 1．通用医疗

    通用（GE）的人工智能布局可以分为两部分，一部分是医学影像，另一部分是医疗保健。


    在医学影像方面，GE 的低剂量 CT 肺癌筛查方案是业内首个通过美国食品药品监督管理局（FDA）认证的方案。GE 的肺癌早筛早诊解决方案在低剂量 CT 设备的基础上，可以获得精准成像，实现微小结节的早期发现；通过自动标记难识别的肺结节，辅助医生快速、精准地进行筛查。


    在医疗保健方面，GE 涉及的领域有很多。目前，GE 正在利用深度学习试验多种任务。其中包括：

    ①识别不同类型的癌组织细胞；

    ②为重症监护室的患者确定最有效的治疗方案；

    ③预测重症监护室患者是否有可能并发败血症或感染；

    ④利用超声波评估患者的心脏问题；

    ⑤预测疾病发作。


    ### 2．飞利浦

    飞利浦与美国新创生物诊断公司 Path AI 合作，通过使用人工智能来寻找更快和更准确的癌症诊断技术。这项合作的最初目标是自动识别和分析乳腺组织中的癌变。


    迅速并准确地诊断癌症的发生和发展程度，对于病理学家来说是一项具有挑战性的工作。这项工作对于正确地治疗癌症非常关键，但是对于病理学家来说，观察并分析病理图片非常耗时，他们在需要迅速做出判断时压力很大。传统的分析方法需要医生在显微镜下一张一张地人工观察病理切片。在癌症病例越来越多的今天，医生们难以应对日益增加的工作量。因此，一个自动的智能图像获取和分析软件将能极大减轻医生的负担，提高医生的诊断速度和准确率。


    飞利浦在自动诊断技术方面有着丰富的经验，旗下的智能网络病理解决方案（IntelliSite Pathology Solution）系统包括了自动图片扫描和图像管理系统。飞利浦还收购了专注于数码病理图片分析的爱尔兰公司
    PathXL。飞利浦公司还有一个平台（Illumeo），利用适应性智能技术可提高放射科医生的效率。该方法的准确率可以与经验丰富的医生人工诊断结果相媲美。如今，飞利浦和
    PathXL 的合作将致力于把这个非常具有潜力的算法投入实际应用中，以帮助病理学家进行快速、准确的诊断。


    ### 3．西门子

    西门子在人工智能领域的布局也是关于医学影像的。西门子医疗有一套基于人工智能技术的医学影像处理软件 syngo.via。syngo.via 基于海量医学文献与病例，构建大数据化的临床病种知识库，进而按照规范与指南，构建包括影像扫查、处理、报告全流程的结构化任务。


    然后 syngo.via 模拟医生的处理操作与知识调用，创建相应的影像处理流，从而实现“智能前处理”与“处理即报告”。也就是说，在医生点开病例前，syngo.via
    便可依循相关指南与共识，自动启动多软件并行处理。


    病例被点开后即可自动呈现规范准确的病证结果，并将多软件的处理结果合成在一个报告中，进而嵌入分期与分级的报告选项。这些技术能够在不增加乃至减少医生工作时间的前提下，生成病症完整、表达图表化甚至分期与分级的报告，符合指南要求，并助力“规范化培训”落地。


    ### 4．富士胶片和奥林巴斯

    日本富士胶片和奥林巴斯将与医师等组成的学会等合作，开发出在使用内窥镜的检查中，由人工智能自动判断胃癌等可疑病症的技术，最早将于 2020 年投入实际应用。


    富士胶片和奥林巴斯是全球性大型医疗器械企业。诊断胃和大肠的内窥镜的日本专业医师学会从 2017 年开始参与实证研究。其研究人员从日本的大学附属医院等全国 32
    家医院收集了大量影像数据作为 AI 判断的基础，并在逐步增加数据量，还将追加医生的诊断结果和患者的既往病史等。AI 的学习技术将由东京大学等研究机构负责。


    ### 5．万东医疗

    在 2017 年中国国际医疗器械博览会（CMEF）的展会上，万里云发布了人工智能精准医疗平台—— i 影像。目前，“i 影像”平台已经上线 DR 筛查和 CT
    检测功能。据官方介绍，i 影像在一些细小的肺结节上可避免 50%以上的遗漏，检测的准确率达到 95%以上。但万里云影像平台的颜子夜博士表示：“智能影像平台只是一个工具，我们提供的是全套解决方案。”除了进行影像云服务外，万里云平台更注重智能处理和质控体系建设。


    ### 6．安翰医疗

    安翰医疗是一家研制胶囊内镜机器人系统并成功实现商业化应用的中外合资高新技术企业，专业从事医疗器械研发、生产、销售及服务，是世界上第一家成功研制出“主动精确控制消化道胶囊内镜机器人系统”并实现商业化的公司。


    2017 年 4 月 20 日，安翰医疗与 IBM 中国研究院签署协议，双方将在胶囊内窥镜医疗影像领域展开探索性合作，旨在探索将 IBM 在认知影像领域的技术用于提升消化道疾病早期精准筛查的可行性。


    安翰医疗的前沿精控胶囊胃镜系统，使用胶囊内镜机器人采集医疗影像数据，可以更高效率、更低障碍地收集胃部检查信息。但每次检查产生的约 2 万幅影像，给医生带来了数据处理和实现精准化分析等新的挑战。


    在临床应用中，这些海量的影像数据很难通过人工阅读的方式对其快速诊断，IBM 的认知影像技术或可为破解此难题提供钥匙。IBM 中国研究院与安翰的早期研究合作项目，旨在展示通过智能病灶检测技术帮助安翰处理每年产生的数十亿幅影像，提高疾病筛查的精准性和可行性。


    ### 7．成运医疗

    上海成运医疗器械股份有限公司是一家中德技术合作企业，公司主要生产医用电子内窥镜，于 2003 年 3 月获得国家食品药品监督管理局《医疗器械注册证》，成为国内第一家成功获准注册上市的医用电子内窥镜生产厂家。


    成运医疗与希氏异构以后者进行技术授权的方式开展合作，现已推出了一款内镜结合 AI 的产品，成运医疗将在卖出的人工智能内镜设备中与希氏异构进行分成。


