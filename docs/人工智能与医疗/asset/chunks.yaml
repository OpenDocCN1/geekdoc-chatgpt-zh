    ### 1．靶点筛选

    靶点发现也就是发现能减慢或逆转人类疾病的生物途径和蛋白，这是目前新药发现的核心瓶颈。针对前沿论文分析和处理并提供预测数据，也可以看作在靶点筛选上的应用。老药新用是目前寻找药物的常用方式，它的实现方式是将市面上已售卖的药物及人身上的1万多个靶点进行交叉研究及匹配。以往这项工作由人工试验完成，现在人工智能的参与将给试验的速度带来指数级的提升。据推测，搭建算法模型及大规模的算力，利用“老药新用”这一手段，有望将药物研发成本降至3亿美元甚至更低，研发周期也缩短至6.5年。


    在科学研究飞速发展的今天，每30秒就会有一篇生命科学论文发表。除此之外，还有大量的专利、临床试验结果等海量信息散布在世界各地。这些信息中，只有一小部分的科学信息可以形成有用的新知识。对于药物研发工作者来说，他们没有时间和精力关注所有的新信息，但是这些信息又包含了全球大部分科研人员的研究成果和大量关于新药的信息，从这些信息中找寻新药的蛛丝马迹是药物发现的一种捷径。


    ### 企业案例


    ### Benevolent AI

    Benevolent AI由肯穆拉凡尼（Ken Mulvany）创立于2013年，起初名为分层医疗（Stratiﬁed Medical），2016年10月改名为Benevolent
    AI。该公司主要是利用人工智能技术，从散乱无章的海量信息中提取出能够推动药物研发的知识和新的可以被验证的假说，从而加速药物研发的过程。


    ### 产品介绍

    Benevolent AI的产品称为拥有判断加强认知系统（Judgment Augmented Cognition System，JACS）。该平台通过独特系统和设计的AI工具将科学论文、专利、临床试验信息的大量非结构化信息生成可用的知识。通过提取生物学知识，进行生物化学预测，推进分子治疗技术革新，从而使药物发现科学家更有效地开发新药。


    ### 应用情况

    2014年6月，Benevolent AI宣布与一家美国的制药公司达成合作，并将两个正在研发的阿尔茨海默病新药卖给这家美国公司，这两款药物处在中标候选化合物评估阶段。此次交易高达8亿美元，Benevolent
    AI获得4亿美元的预付款，如果这个新药后期研发顺利，公司将获得余下的4亿美元。此次交易的两款药物就是利用JACS系统开发的。


    除了销售发现的小分子化合物之外（未上临床的创新药），Benevolent AI也可以分析小分子化合物，进而参与新药研发的整个流程。2016年11月，Benevolent
    AI与强生达成合作，强生把一些尚处于试验中的小分子化合物转交给了Benevolent AI，进行新药开发。2017年5月25日，其发现的用来治疗肌肉萎缩性侧索硬化症的药物，经过英国谢菲尔德一家机构的研究，确实对治疗运动神经衰退有作用。


    另外，从Benevolent AI官网了解到，Benevolent AI将利用人工智能系统来指导临床试验的进行和数据的收集。除此之外，Benevolent
    AI专注药物研发的Benevolent Bio部门已有两种非癌症领域的新药进入后期研发，其中一种治疗帕金森症的药物已经进入二期临床试验，另一种药物是治疗肌肉萎缩性侧索硬化症的，也就是通常所知的渐冻人症。目前，市面上最好的对症药物只能为患者延长3个月生命，此药将取得显著突破，预计需要5年进入临床阶段。


    ### 2．药物筛选

    药物筛选，也可以称为先导物筛选。制药企业积累了大量调控蛋白功能的小分子化合物，大规模的跨国药企一般都会有50万～300万种的化合物储备。先导物发现首先通过少数模块组合成不同蛋白，然后会采用高通量筛选^[2]来发现合适的先导物。高通量筛选方式会在同一时间由机器人进行数以百万计的试验，因此成本非常高昂。迄今为止，学者们已经纷纷倡导利用人工智能/机器学习开发有效和准确的虚拟筛选方法，以取代昂贵且耗时的高通量筛选过程。


    现有虚拟筛选的方法名为“高通量筛选”，而它非常容易受到错误发现率（FDR）的影响。如果可以将第三阶段试验的风险减半，就可以为大型制药公司节约数十亿美元的成本。针对药物筛选阶段，人工智能有两种应用方案，一种是利用深度学习开发虚拟筛选技术以取代高通量筛选；另一种是利用人工智能图像识别技术优化高通量筛选过程。


    谷歌和斯坦福的研究人员正致力于利用深度学习开发虚拟筛选技术，以取代或增强传统的高通量筛选过程，并提高筛选的速度和成功率。通过应用深度学习，研究人员能够实现跨越多个靶点的众多实验的信息共享。正如斯坦福大学博士Bharath
    Ramsundar等在一篇有关机器学习的论文中所称：“我们的实验表明，深层神经网络优于所有其他方法，其大大超越了所有现有的商业解决方案。在许多靶点上，它都接近了完美的预测质量，让其适合被用作虚拟筛选装置。总的来说，深度学习提供了建立虚拟筛选并将其作为药物设计通道中标准步骤的机会。”


    ### 企业案例


    ### Recursion Pharmaceuticals（递归药物）

    Recursion公司成立于2013年，这家公司的核心技术在于运用计算机视觉技术来处理细胞图像，并且通过分析1000多种细胞特征来评估疾病细胞在给药后的效果。使用先进的成像技术和人工智能技术，这一平台可以进行高通量的细胞模型实验，在上百种疾病的细胞模型中进行上千种候选药物的检测。


    ### 产品介绍

    Recursion使用最新的生物工具来构建数百种独特的细胞疾病模型。每个成像的模型都有成千上万个单元格，并从每个单元格提取近1000个结构特征。使用这些功能，Recursion开发出了专有细胞“指纹”，被命名为酚醛树脂。通过酚醛树脂，可以了解到任何药物是否可以让细胞恢复健康。


