    中科院是中国输出高端AI人才最多的机构之一。中科院与人工智能相关的研究所有计算机所、软件所、声学所、自动化所，这4个研究所中可查到的在读AI硕博人才为709人。国内著名的AI语言识别专家田捷、计算机视觉专家吴恩华、机器学习专家常虹、刘成林等都在中科院从事行业研究。


    这里尤其要提一下中科院声学所。目前，声学所共有在读研究生465人（其中硕士生234人、博士生231人）、在站博士后25人。这里是中国智能语音人才的摇篮，大多数高端人才都出自这里。


    在人工智能医疗行业领域，Big Vision创始人陈建新、中科汇能CTO车浩、云知声CTO梁家恩都是从中科院毕业的，后两位均来自中科院声学所。


    哈尔滨工业大学计算机科学与技术学院有15个研究中心，其中有硕士生370人、博士生308人。虽然无法查到与人工智能相关专业的在读硕士、博士的具体人数，但这些研究中心大部分与人工智能有关。

