    ## 全球格局：人工智能与医疗全球发展

    美国时间2017年9月28日下午，谷歌、脸书、亚马逊、IBM及微软正式宣布成立一个新的AI组织——AI合作组织（Partnership on AI），目标是保障AI在未来能够安全、透明、合理地发展。该组织的全名为保障AI利于人类社会组织（Partnership
