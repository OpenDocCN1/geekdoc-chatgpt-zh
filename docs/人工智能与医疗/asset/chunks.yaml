    ## 6.1.2 发展现状：核心技术正在申请专利


    NarrativeDx的优势在于其自然语言处理技术在该领域非常成熟。


    常见的自然语言处理方式是搜索关键词，这种方式需要人工提前设定筛选哪些关键词。但“一刀切”的分类方式过于简单粗暴，因为同样的词语用在不同的语境下传递出的意思可能完全不同。


    NarrativeDx的自然语言处理技术可以结合具体的语境判断患者表达的是什么意思。目前，NarrativeDx已经对自己的自然语言处理技术申请了专利保护，美国专利局正在审批中。


    ## 6.1.3 融资情况部分披露


    NarrativeDx目前已经公开的融资金额达252万美元。此外，它在2017年5月，进行了A轮融资，但公司管理层和投资方都未披露具体的数字。


    新一轮的融资将主要用于NarrativeDx的市场拓展工作。目前，它的客户已包括克莉丝汀保健系统（Christina Care Health System）、纽约大学朗格尼医学中心（NYU
    Langone Medical Center）和帕利萨德医疗中心（Palisades Medical Center）等知名医疗机构。


    ## 6.1.4 同类项目初创公司比较


    资本是聪明的，它总流到代表未来的方向。随着患者地位的上升和医院竞争的加剧，近年来美国涌现出不少以“提高医院效率、提升患者体验”为目标的创业公司。


    动脉网蛋壳研究院经过对美国医疗创业公司的梳理，筛选出了两家具有代表性的、利用人工智能帮助医院提升运营效率和患者体验的初创公司——Qventus和高吉奥健康（Gozio
    Health），它们与NarrativeDx的对比如表6-2所示。


    表6-2 Qventus、Gozio Health和NarrativeDx的情况统计


