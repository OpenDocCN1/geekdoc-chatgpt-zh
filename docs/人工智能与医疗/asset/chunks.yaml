    年 12 月成立。


    \[2\] 高通量筛选：High throughput screening，缩写为 HTS，是指以分子水平和细胞水平的实验方法为基础，以微板形式作为实验工具载体，以自动化操作系统执行实验过程，以灵敏快速的检测仪器采集实验结果数据，以计算机分析处理实验数据，在同一时间检测数以千万的样品，并以得到的相应数据库支持运转的技术体系，具有微量、快速、灵敏和准确等特点。简言之，就是可以通过一次实验获得大量的信息，并从中找到有价值的信息。


    \[3\] 拜耳：世界 500 强企业之一。总部位于德国的勒沃库森，高分子、医药保健、化工以及农业是公司的四大支柱产业。


    \[4\] Biogen：全称为 Biogen Idec 公司，成立于 2003 年 11 月，总部位于美国的马萨诸塞州。Biogen Idec 公司为肿瘤学、神经学和免疫学树立了护理新标准。作为开发、生产和销售创新疗法的全球领导者，Biogen
    Idec 公司能够将科学发现转变为人类健康保健方面的实质性进展。在欧洲国家及加拿大、澳大利亚和日本均有分支机构，主要研发癌症、精神病、皮肤病和风湿病相关药物。


    \[5\] Fitbit：第一款支持 Windows Phone 平台的智能手环的记录器。


    # 2.8 健康管理

    个人的健康数据十分复杂，按照数据的来源可以将个人健康数据分为基因数据、生理数据（如血压、脉搏）、环境数据（如每天呼吸的空气）和社交数据等。有了这些个人健康数据，加上人工智能，最终可以实现人们对健康的前瞻性管理。


    健康管理是变被动的疾病治疗为主动的自我健康监控。通过带有医疗监控功能的可穿戴设备实时监控人体各项生理指标，结合其他个人健康数据，对潜在健康风险做出提示，并给出相应的改善策略。


    一个人每天产生的有关健康和生命的数据，如果能够数据化，数据量将会非常大。怎么处理这些数据，把数据变成信息，把信息变成知识，把知识变成健康管理的信息，这便是人工智能在人类生命数据收集后的工作。


    ## 2.8.1 健康管理现状

    在健康管理的 3 个环节中，获取体征数据是最开始的一环。普通医疗器械不能做到实时、连续监测，有了带有监控功能的可穿戴式设备，在拥有强大远程无线数据传输能力的情况下，医生可对患者的身体状况有长期的把握，从而制定更为有效的治疗方案。


    对于一些病愈出院的患者来说，出院后的监控可以使他们获得更好的康复帮助，大大降低了一些疾病的复发或后续并发症、后遗症发生的可能性。


    根据体征数据，人工智能健康管理通过数据学习每个人的身体特点，针对每个人设计个性化健康管理方案；当身体出现异常时能够快速发现并做出响应；能够提供长时间、不间断监测的健康管理服务（图
    2-41）。


    ![](img/3e5f02c6afb02981770062a57126eada.jpg)


    图 2-41 人工智能参与健康管理的方式


    从硬件上看，可穿戴设备提供长时间的监测功能，这就对智能穿戴设备的佩戴舒适性、续航能力、灵敏度提出了极高的要求。


    人工智能健康管理的最终目标是要实现人们对健康的前瞻性管理，需要对人体多方面的健康情况进行管理，这就意味着这样的健康管理系统是一套拥有多种人体数据库的系统。多维度、多种类数据的积累便成为人工智能健康管理企业长久的任务。


    ## 2.8.2 人工智能应用情况

    健康管理配合智能硬件理论上能实现人体的全面健康管理，但由于目前传感器、硬件的发展水平不高，以及相关疾病数据积累不足等原因，其主要的应用范围是糖尿病、慢性病管理、血压管理、乳腺健康管理、胎心监测等；涉及的健康环节主要有风险识别、健康评估、精神监测、健康干预等。


    （1）风险识别。通过获取信息并运用人工智能技术进行分析，识别疾病发生的风险及提供降低风险的措施。


    （2）健康评估。收集患者的饮食习惯、锻炼周期、服药习惯等个人生活习惯信息，运用人工智能技术进行数据分析并评估患者的整体状态，协助规划患者的日常生活。


    （3）精神监测。运用人工智能技术，根据语言、表情、声音等数据进行情感识别。


    （4）健康干预。运用 AI 对用户体征数据进行分析，制订健康管理计划。


    根据人工智能应用在不同领域的健康管理，我们将 AI 在健康管理上的应用分为人口健康管理、母婴健康管理、慢性病健康管理和精神健康管理 4 个细分领域。


    ![](img/a9e532f774d05e94e5016e1d982690e3.jpg)


    图 2-42 人工智能+医疗健康管理企业分布


    ### 1. 人口健康管理

    人口健康学是“人类健康 2020”（Healthy People 2020）^(\[1\])愿景中关于医疗卫生研究与医疗健康服务建设的主旨。它包括 3 个核心目标：①更好的个性化医疗与健康服务；②更好的社会群体医疗与健康发展；③可负担的医疗费用支出。实现这
    3 个目标的最终目的就是让人们更加健康长寿，更好地预防疾病，同时，避免各种形式的残疾、伤害和早产死亡现象等。人口健康管理与其他类型的健康管理区别在于它能为多种类型的个人或群体提供健康管理服务，并且可以为医疗机构、政府、可穿戴设备公司等提供人口健康的信息化解决方案。


    #### 企业案例


    ##### Welltok

    Welltok 是一家致力于帮助用户实现个人健康管理和生活习惯提升的数字医疗公司。该公司采用软件即服务（SaaS）的服务模式，打造了 CaféWell 健康优化平台（Café
    Well Health Optimization Platform），致力于为用户提供在线健康管理服务。该平台首开了利用物质奖励督促用户完成健康计划的先河，在用户遵循
    Welltok 制定的健康方案生活时，会得到平台给予的积分、礼品卡或现金等奖励。据了解，美国科罗拉多州超过 60%的职场人士都是 CaféWell 平台的活跃用户。


    ### 产品介绍

    在 Welltok 开发的 CaféWell 健康优化平台上，能看到所有影响个体健康的变量因素，平台根据这些因素设计个性化的解决方案。CaféWell 大平台整合有众多健康管理项目、医疗保险计划、App、跟踪健康的可穿戴设备等。为了增加用户黏性，CaféWell
    承诺为会员用户带来最先进的可穿戴设备，引入奖励机制，即分发零售礼品卡甚至现金来表彰用户健康的行为选择。同时，CaféWell 保证应用能在安全、保护隐私的情况下运行，跟踪用户行踪、指导用户健康管理，针对性提出达成目标的建议，并记载目标完成情况。


    ### 优势


