- raw: '最初他们考虑利用技术优势和金融行业的从业经验进入前景广阔的科技金融领域。但在了解后发现，科技金融领域已经是一片拥挤不堪的“红海市场”。他们继而把注意力转向了同样拥有无限前景，但却受碍于种种因素发展缓慢的科技医疗领域。2015年4月，3个人在班加罗尔成立了SigTuple公司，开始研发能够对医疗数据进行机器学习的人工智能平台。


    ## 6.4.2 人工智能与医疗数据=智能筛查解决方案


    SigTuple打造的人工智能平台叫Manthana，它能够通过对已有医疗数据的学习，构建出一套算法，在该算法的基础上，对可视化的医学影像进行分析，从而快速得出结论，协助医生进行诊断。传统的疾病筛查方式耗时长、费用较高，且很大程度上受医生经验水平和情绪等主观因素的影响，SigTuple有效地解决了这些痛点。


    以血液检查为例，如表6-4所示，与传统的血液检查相比，SigTuple血液检查有很大的优势。


    表6-4 SigTuple血液检查与传统血液检查方式的比较


    ![](images/624b34092492f0fcdd0c33286d2e218b.jpg)


    在SigTuple的规划中，Manthana将提供5种疾病的筛查，分别是外周血涂片检查、尿液显微镜检查、精液检查、眼科OCT检查和X光胸片检查。但目前只是小范围推出了外周血涂片检查的服务，其余4种仍然处于研发阶段。


    Manthana平台的作用是在后端分析医学影像以进行诊断，那么如何在前端获取这些影像呢？SigTuple针对不同的疾病筛查研发了5种图像采集系统，目前已经成熟的是配套外周血涂片检查的Shonit血液分析仪（图6-8），这套血液检查系统可以筛查疟疾、贫血症等寄生虫感染性疾病。


    ![](images/810f14c6fac600ba177b84a576d161a4.jpg)


    图6-8 Shonit血液分析仪


    Shonit血液分析仪对显微镜和智能手机进行了有趣的融合。将血液标本放置在载物台上，显微镜会将影像传递到智能手机上，智能手机再通过App连接至Manthana平台，8分钟后就能给出分析报告，而传统的血液检查会耗时约20分钟，且结果受医生主观影响。


    出于对设备质量的把控，Shonit血液分析仪全部由SigTuple自行生产。但随着产品线的丰富和市场的扩张，未来或许会将其外包给代工厂。


    ## 6.4.3 伙伴客户一体化，绑定利益共同体


    数据是训练机器学习搭建出一套算法的关键，SigTuple在医疗数据方面的合作伙伴——医院和病理实验室，也是它的客户。目前，它与17家医疗机构形成了试点合作关系，后者可以优先和优惠享受到SigTuple的新产品，条件是需向SigTuple提供经脱敏处理的医疗数据。


    SigTuple采用的是以硬件作为入口的盈利方式，将医疗设备出售或租赁给医疗机构，并从每份检验报告中收取40～80美分的服务费作为收入。如图6-9所示即为SigTuple提供的整体的疾病筛查解决方案。


    ![](images/583abdcc90e0cf1b690e7b697af3e415.jpg)


    图6-9 SigTuple提供的整体疾病筛查解决方案


    ## 6.4.4 立足印度，放眼全球市场


    SigTuple创立至今共完成两轮融资——74万美元的种子轮和580万美元的A轮（表6-5），并在A轮中创造了印度科技医疗领域迄今最大的单轮融资纪录。


    SigTuple最大的投资方Accel Partners过去12年在印度的战绩傲人，曾先后成功投资电商平台Flipkart^(\[1\])、时尚门户Myntra和数据分析公司Mu
    Sigma等细分行业独角兽，或许SigTuple将是它在医疗领域的第一枚荣耀徽章。


    其他投资方包括印度IDG创投（IDG Ventures India）、VH资本（VH Capitals）在内的机构投资者，以及不少知名的个人投资者。Flipkart的两位创始人萨钦·班萨尔（Sachin
    Bansal）和比尼·班萨尔（Binny Bansal）两轮均参与投资，优步（Uber）前高级副总裁阿密特·辛格哈尔（Amit Singhal）、Google硬件工程师德班扬·穆克吉（Debanjan
    Mukherjee）等科技行业内的技术“大牛”也出现在投资者的名单中。


