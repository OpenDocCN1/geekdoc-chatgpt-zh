    ## 2.4 病历/文献分析

    电子病历是在传统病历基础上，记录医生与患者交互过程及患者的疾病发展治疗状况的患者电子化档案，包含大量的健康信息和疾病信息。电子病历是医学科学研究中很有价值的资料，对医学的传承有着巨大的作用，也是药物、器械研发的基础数据。

    电子病历包括病案首页、病程记录、检查检验结果、医嘱、手术记录和护理记录等。其中，既有结构化信息，也有非结构化的自由文本，还有图形图像等信息，涉及信息的采集、存储、传输、质量控制、统计和利用等环节。

    电子病历是新时代的电子化个人健康记录，它几乎囊括了患者过去与现在的所有医疗信息。随着电子病历系统在医疗机构的逐渐普及，临床数据的不断积累，医疗大数据的概念也逐渐开始出现。

    利用海量的医疗大数据，医疗从业者能够通过数据分析发现医疗质量、医疗安全及药物效果相关的重要证据，从而提高公共医疗的质量和效率，加强医疗安全，并促进新治疗方法和药物的研发。

    由于电子病历目前在我国的应用尚未成熟，因此要想利用电子病历中的临床数据进行大数据分析或科研，需要解决一系列标准化问题，如书写、编码、功能、互联互通、管理和使用等（图2-26）。只有将非标准化的场景标准化、规范化，人们从电子病历中获取到的数据才是最真实、连续和完整的。只有这样，医疗机构之间的互联互通才有良好的基础，第三方信息化、大数据、人工智能企业才能更好地利用技术去挖掘健康医疗大数据中有价值的信息，帮助医疗机构改善人们的健康水平。

    ![](images/8c378bd41046b66a47ce07ed6918c785.jpg)

    图2-26 病历/文献的标准化过程

    人工智能的切入主要是利用机器学习和自然语言处理技术自动抓取病历中的临床变量，智能化融汇多源异构的医疗数据、结构化病历、文献生成的标准化数据库，将积压的病历自动批量转化为结构化数据库。


    ### 1．病历/文献分析的应用情况

    目前，病历/文献分析企业通过与医院合作及自购数据的模式，实现了大量数据的积累。同样读一篇50页的病历，企业抓取和理解其中所有临床信息的速度比医生平均快2700倍。病历/文献分析企业还能够为保险公司的产品设计、核保提供支持；为医学研究挖掘变量的相关性，激发、验证论文思路，为针对临床科研的专业统计分析提供支持。

    目前，人工智能病历/文献分析的应用场景主要有3类：病历结构化处理、多源异构数据挖掘和临床决策支持。

    图2-27所示为人工智能与医疗病历/文献分析企业分布。

    ![](images/58ab48fdf608262062a050c18319222c.jpg)

    图2-27 人工智能与医疗病历/文献分析企业分布

    （1）病历结构化处理。在20世纪90年代末期，美国就基本完成了主流医院的信息化建设。当前，医学信息学的关注点已经从第一阶段的系统建设转移到了第二阶段，也就是数据的二次利用，而且美国已经从医学角度考虑效率、安全、普适性问题。

    目前，我国还处在从第一阶段向第二阶段的过渡阶段。虽然主流医院的信息化已经接近完成，但还是存在系统不够完善、信息不够流通和体系化等问题。所以，虽然已有基础设施，却还是不能解决数据挖掘问题，数据的二次利用就更无从谈起。

    每家做数据结构化处理的医疗数据类公司都有自己的自然语言处理算法，而对机器学习在自然语言处理上的应用、语料库、知识库的积累则是一家医学AI公司的核心。

    人工智能病历/文献分析系统具有速度快、准确率高的特点，即使面对目前各大医院IT系统的标准不一这种情况，人工智能也可以迅速将慢性病管理、健康平台、保险公司、医院信息系统（HIS）乃至药企等客户所需的数据进行结构化处理，做出实际、有说服力的案例，以促进行业的发展。

    （2）多源异构数据挖掘。由于历史原因，我国医院同时运行着上百种医疗信息化系统，这些多源、异构的系统彼此割裂，致使各医疗数据处于“孤岛”状态，无法得到有效利用。而且，信息化厂商往往通过接口收取高额的费用。

    人工智能企业与医院合作，无须和原系统对接，利用大数据技术完成多源、结构和非结构数据的清洗、脱敏、结构化、标准化，使医院能够“一统”原先分裂的医疗数据，形成互联互通的医疗大数据平台，为实现大数据处理和分析奠定数据基础。

    以大数医达为例。对于一家医院，大数医达甚至可以挖掘到其近20年的数据。大数医达通过将肿瘤患者分散在医院信息系统（HIS）、电子病历（EMR）、实验室信息系统（LIS）、医学影像存储与传输系统（PACS）等院内系统中的病历记录进行融合处理，以时间轴集成视图方式展现每位患者的门诊、住院病历信息。

    过去一家做HIS的公司想做患者的信息统计，需要自己采集数据或者跟其他的系统进行协作，开放数据接口之后把数据读取出来。现在只需要与大数医达一家公司合作，二次开发的工作量降低了许多。

    另外，大数医达还能实现医疗数据的快速检索，提供基于医疗大数据平台的病历智能检索服务。将百度、谷歌等互联网信息搜索技术应用于病案检索，可以方便医生快速检索海量病历记录。例如，医生可在1秒内快速检索出所有病理报告，确诊“乳腺癌”或“癌胚抗原（CEA）大于5”的患者病历。

    除了互联互通之外，三甲医院还会有一些管理统计的需求。例如，医院统计科的主要工作职责是负责在日常工作中收集、整理医院医疗过程和管理过程中产生的各种信息，运用统计学理论和方法对医院的各项工作信息进行科学的加工和整理、监测和分析，完成各种数据报表的整理归纳统计分析。

    医院领导往往需要了解一些异常指标出现的原因，如科室与疾病的药占比高的异常原因，这就需要统计科基于HIS进行数据检索。有了大数据平台，统计科就能很轻松地完成这项任务。

    在大数据平台的基础上，大数医达还开发了一款AI医生助手，基于对海量病历信息的深度学习，提取出智能诊断模型，应用于辅助医生完成临床诊断及临床教学工作。

    例如，诊断模型可以根据医生提供的患者信息、主诉、病史、化验、检查等信息，智能推荐出可供鉴别的疾病列表和对应概率，并将类似病历中的统计信息提供给医生作为参考。

