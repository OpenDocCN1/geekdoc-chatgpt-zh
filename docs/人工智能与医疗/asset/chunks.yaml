    ## 7．SigTuple


    SigTuple是一家创办于“亚洲硅谷”印度班加罗尔的科技型创业公司。该公司可以通过使用人工智能技术来分析视觉医学数据，并通过对血液、尿液和精液进行远程测试来扩大服务规模。


