    # 第 6 章 典型企业：人工智能与医疗领域企业案例


    如今医学界越来越多的公司将他们的商业前景设定在人工智能的大背景下，希望能够在人工智能的帮助下颠覆医疗保健行业。这些公司通过人工智能实现医疗保健的民主化，并且它们以建立一个更透明和有效的医疗保健系统为使命，并为之努力奋斗。


    ## 6.1 美国 NarrativeDx：人工智能，解决传统患者体验调查中的痛点


    美国德克萨斯州奥斯汀市的科技创业公司 NarrativeDx 通过人工智能中的自然语言处理技术，为医院分析影响患者体验的因素，提供改善患者体验的解决方案。


    ### 6.1.1 公司特点


    #### 1．具有强大技术背景的核心领导层


    作为一家以技术为驱动力的创业公司，NarrativeDx 的 3 位核心管理者（图 6-1）都有强大的技术背景。创始人兼 CEO 凯尔·罗伯森（Kyle Robertson）本科毕业于爱荷华州立大学，他同时攻读了计算机工程、数学和经济学
    3 门学科，在此期间还到伦敦大学学院的数学系当了一年的交换生。毕业后，Kyle Robertson 相继在电子元器件公司迪进国际（Digi International）和电子设备公司美国国家仪器有限公司（National
    Instruments）担任软件工程师。


    2006 年，已经工作两年的 Kyle Robertson 似乎厌倦了工程师的生活，他决定重返校园，到波士顿学院法学院钻研法律。研究生毕业后，Kyle Robertson
    开始了在知名律师事务所威尔默·黑尔（Wilmer Hale）的律师生涯，主要负责知识产权类的诉讼。


    2012 年，Kyle Robertson 从律师事务所辞职，创办了公益捐赠平台 iCare。虽然仅在一年后 iCare 就停止运营，但这个项目让 Kyle
    Robertson 积累了宝贵的创业经验。


    与在学业和职业上经历过多次转型的 Kyle Robertson 相比，NarrativeDx 的另一位创始人塞内姆·冈尼（Senem Guney）显得“专注”不少。


    Senem Guney 本科毕业于土耳其海峡大学的翻译与同声传译系，紧接着她来到美国，在德克萨斯大学奥斯汀分校攻读语言学硕士和传播学博士。在创办 NarrativeDx
    前，她一直任教于奥尔巴尼大学，致力于研究语言与技术的融合。目前，Senem Guney 担任公司的首席体验官（Chief Experience Officer，CXO）。


    首席数据科学家（Chief Data Scientist，CDS）Tad Turpen 虽然不是创始团队成员，但是他在公司内部的分量举足轻重。CEO Kyle
    Robertson 曾耗时半年物色合适的数据分析师，最终 Tad Turpen 凭借圣地亚哥大学计算机系学士和布兰迪斯大学计算语言学硕士的背景吸引到了他的注意。另外，Tad
    Turpen 还曾在北京大学有过短暂的求学经历。


    ![](img/ad70e882425b9215f9e4e586898e2882.jpg)

    图 6-1 NarrativeDx 的 3 位核心管理者


    #### 2．利用自然语言处理技术洞察患者对医院的评价


    NarrativeDx 通过以下 4 个步骤即可提供患者对医院的评价情况，以及改善患者体验的解决方案。


    （1）收集信息。NarrativeDx 从医院满意度调查（Hospital Consumer Assessment of Healthcare Providers
    and Systems，HCAHPS）、点评网站和医院的反馈表等渠道收集患者对医院的评价。


    （2）处理数据。对于人工智能来说，数据分为结构化和非结构化两种。系统能够轻松识别结构化的数据，如医院反馈表中让患者勾选的封闭式问题，但识别非结构化的数据对于系统来说是个挑战，开放式的患者评价即为此类。NarrativeDx
    利用自然语言处理技术对非结构化的数据进行加工处理，让系统也能明白患者在表达什么。


    （3）归纳总结。在对所有的信息进行处理后，NarrativeDx 统计出各项影响患者体验的因素，并按影响程度进行排位。


    （4）提供建议。除了呈现患者体验的统计结果外，NarrativeDx 还能够作为助手，向医院的管理者提供改善患者体验的建议。


    #### 3．解决传统患者体验调查中的痛点


    患者体验涉及医疗过程的方方面面：医院的运营是否井然有序，患者的问题是否能得到医务工作者的及时解答，病房是否安全卫生等。在信息透明的互联网时代，任何负面评价都会对医院的品牌造成影响。


    虽然很多医院的管理者已经意识到了口碑的重要性，并积极寻求患者的反馈，但是传统的患者调查方式存在调查范围窄、耗费时间长等问题，而且由于受各利益相关方的影响，调查往往流于形式，管理者无法收到客观、公正的调查结果。传统的患者调查和
    NarrativeDx 的患者调查方式对比如表 6-1 所示。


    NarrativeDx 通过人工智能的方式解决了以上痛点。


    表 6-1 传统的患者调查和 NarrativeDx 的患者调查方式对比


    ![](img/a3238a0de6572903fee18af035441fd1.jpg)


    ### 6.1.2 发展现状：核心技术正在申请专利


    NarrativeDx 的优势在于其自然语言处理技术在该领域非常成熟。


    常见的自然语言处理方式是搜索关键词，这种方式需要人工提前设定筛选哪些关键词。但“一刀切”的分类方式过于简单粗暴，因为同样的词语用在不同的语境下传递出的意思可能完全不同。


    NarrativeDx 的自然语言处理技术可以结合具体的语境判断患者表达的是什么意思。目前，NarrativeDx 已经对自己的自然语言处理技术申请了专利保护，美国专利局正在审批中。


    ### 6.1.3 融资情况部分披露


    NarrativeDx 目前已经公开的融资金额达 252 万美元。此外，它在 2017 年 5 月，进行了 A 轮融资，但公司管理层和投资方都未披露具体的数字。


    新一轮的融资将主要用于 NarrativeDx 的市场拓展工作。目前，它的客户已包括克莉丝汀保健系统（Christina Care Health System）、纽约大学朗格尼医学中心（NYU
    Langone Medical Center）和帕利萨德医疗中心（Palisades Medical Center）等知名医疗机构。


    ### 6.1.4 同类项目初创公司比较


    资本是聪明的，它总流到代表未来的方向。随着患者地位的上升和医院竞争的加剧，近年来美国涌现出不少以“提高医院效率、提升患者体验”为目标的创业公司。


    动脉网蛋壳研究院经过对美国医疗创业公司的梳理，筛选出了两家具有代表性的、利用人工智能帮助医院提升运营效率和患者体验的初创公司——Qventus 和高吉奥健康（Gozio
    Health），它们与 NarrativeDx 的对比如表 6-2 所示。


    表 6-2 Qventus、Gozio Health 和 NarrativeDx 的情况统计


    ![](img/14bb83a5d0ac01d5dba988a45d94bfd4.jpg)

    注：融资金额来自公开渠道，未包含官方未披露的融资金额。


    Qventus 于 2012 年创办于加利福尼亚州山景城，曾用名 analyticsMD。它推出的是一套能够通过对天气状况、出入院情况、电子病历等信息的分析，向医院提供实时决策指南的
    SaaS 系统。


    例如，Qventus 在对天气状况、医院内患者人数、附近是否有突发事件等因素综合分析后，可以预测接下来数小时医院的新增患者人数，帮助医院做好应对措施。


    高吉奥健康是 2015 年创办于佐治亚州亚特兰大市的科技公司，它专注于向患者提供在医院内的导航服务。高吉奥健康根据对各个医院的具体情况和医院内部构造的分析，搭建出定制化的导航系统。患者通过手机定位，点击或输入想要前往的区域，系统就会给患者规划出最快到达的路线。


    ### 6.1.5 带给国内创业者的思考


    目前，国内的医院在调查患者体验的方式上仍以传统的问卷反馈和电话随访为主，动脉网蛋壳研究院认为在供需两端都存在制约将人工智能应用于提升患者体验的因素。


    （1）供给端。国内人工智能医疗领域创业集中于影像诊断，涉足患者体验的企业寥寥。


    动脉网 2017 年 5 月发布的《人工智能与医疗数据报告》显示，国内人工智能类医疗企业已达 60 余家，但都以辅助医学影像诊断为主；海外人工智能类医疗企业已达
    130 余家，服务方向包括医学影像诊断、医院管理、新药研发等多个领域。国内的人工智能类医疗企业无论是在总体的数量上，还是在涉足细分领域的多样性上，都要落后于海外同行。


    （2）需求端。市场竞争不充分，无法立竿见影地看到改善患者体验带来的利益。


    与民营医院在美国占据主体的情况完全不同，国内的医疗市场仍以公立医院为主，且三甲医院非常强势，市场竞争不充分。此外，人工智能影像诊断等设备在投入使用后就能看到立竿见影的收益，但改善患者体验需要一段较长的周期才能看到收益，因此医院对于改善患者体验的动力不足。


    虽然上述问题都无法在短期内解决，但是我们欣喜地发现，国内已经出现部分医疗机构开始尝试提升患者体验。2016 年 6 月，张强医生集团公开招募中国首位患者体验官。虽然有人质疑这是场公关秀，但是无论如何，这都反映了患者体验在国内的医疗环境下越来越受到重视的事实。相信在不久的将来，我国也将诞生一批致力于利用人工智能提升医院运营能力的企业。


    ## 6.2 美国 Atomwise：用 AI 研发新药，成本骤减数亿元


    Atomwise 公司总部位于美国旧金山，成立于 2012 年 6 月，是一家利用超级计算机进行药品研发的公司。项目旨在运用超级计算机、AI 和复杂的算法模拟制药过程，在预测新药品效果的同时降低研发成本。


    ### 6.2.1 现状：一款新药的成功研发约消耗 29 亿美元


    美国塔夫茨大学药物开发研究中心 2014 年的报告显示，从 1996 年至 2013 年美国药物研发成本（图 6-2）看，一款成功上市的新药，平均花费约 25.85
    亿美元，其中包括约 13.9 亿美元的直接资金投入和研发失败导致的约 11.63 亿美元的间接投入。据悉，此次报告的数据与 2003 年相比增长率约 145%。


    ![](img/db16fe879de185ba68a9e155d45b0ae8.jpg)

    图 6-2 1996 年至 2013 年美国药物研发成本图（含成功上市药品成本与研发失败药品成本）


    该报告还指出，一款新药成功上市后，还会有平均 3.12 亿美元的投入用于进一步的评估研究，包括验证新的适应症、剂型及剂量等。因此，在整个上市前后的研发周期当中，一种研发成功的新药可能一共要消耗
    29 亿美元。


    塔夫茨的分析数据来自 10 个药厂的 106 个研发项目，药厂规模大小不一但分配合理，其总和占全球前 50 家制药企业销售和研发投入的 35%。


    ### 6.2.2 新药研发早期进行评估可大幅度降低药物研发成本


    从一个实验室发现的新化合物发展成为一个治疗疾病的药物，需要经过几个开发阶段：临床前试验、新药临床研究申请、一期临床试验、二期临床试验、三期临床试验、新药申请、批准上市。


    若将此过程中研发失败项目的金额算入制药公司的总开销额中，则研发药物的实际花费金额会更高。例如，葛兰素史克公司在 1997 年至 2011 年获批新药数量为
    10 种，平均每种新药的花费达 82 亿美元，在同一时期，总研发花费约 817 亿美元。


    研究人员称，导致药物研发费用高昂的原因包括临床研究的复杂程度增加、研究规模增大、临床试验的失败率升高等。


    目前，提高研发效率、降低研发失败概率的主流做法是精简研发机构，通过外包与合作开发，再收购一些有潜力的生物技术公司，来间接减少药物研发的成本。


    但对于一个新药研发的成功机会，如果是出自内部研发的项目，其成功率要比来自外部技术转让的项目高 20%。其中，降低研发失败概率主要是降低后期临床的失败概率，这需要在新药研发早期及早发现药物潜在的危险和不良反应，理智地评估新药研发的风险，及时终止不必要的新药研发工作。


    ### 6.2.3 Atomwise 将深度学习技术运用于新药早期评估


    Atomwise 公司用超级计算机分析已有数据库，并用 AI 和复杂的算法来模拟药品研发的过程，在研发的早期评估新药研发风险，让药物研究的成本降至数千美元，并且该评估可以在几天内完成。Atomwise
    为制药公司、创业公司和研究机构提供候选药物预测服务，而且 Atomwise 的服务可以预测新药品哪些有效，哪些无效。


