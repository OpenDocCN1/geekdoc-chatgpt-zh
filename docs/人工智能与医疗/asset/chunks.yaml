    ##### Cloud Medx


    Cloud Medx 公司成立于 2014 年，总部位于加州帕罗奥多（Palo Alto）。公司的主营业务是基于大数据的整合和决策辅助，从众多医院实时收集不同患者的数据，经处理分析后向医疗机构提供符合
    HIPAA 的健康预测和分析。Cloud Medx 将原始病历数据进行分析后，可以反映一些病症的发展趋势、发生模式、偏差及预测可能性结果，从而为临床治疗和早期检测诊断提供非常有借鉴意义的参考。2015
    年 5 月，Cloud Medx 获得 660 万美元融资，腾讯是参投方之一，具体投资金额未知。


    通过大规模和深度的基于自然语言处理的机器算法，结合主流医疗机构的 1000 万份病例数据，Cloud Medx 可以为医院的管理机构提供辅助决策服务。例如，它能根据患者住院的情况进行再入院预测。它提供的数据显示，经其系统帮助的医院降低了
    30%的重新住院率。目前，Cloud Medx 兼容主流的 18 家电子人力资源管理系统，在实时的患者信息提醒、风险管控等方面给医疗机构提供智能化运营。


