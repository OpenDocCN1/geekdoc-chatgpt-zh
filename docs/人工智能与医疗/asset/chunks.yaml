- raw: '其中，睡眠是苹果越来越感兴趣的领域，苹果公司过去曾聘请过许多睡眠专家，且最近又收购了睡眠跟踪公司Beddit。收购Beddit，也预示着苹果将把其开发的睡眠追踪功能运用到旗下的所有产品上。


    ### 3．苹果HealthKit上的137个App详情分析


    2014年年底，MobiHealthNews发文探讨了苹果HealthKit平台上的一些App，一共包含137款健康应用，并分析了它们与苹果HealthKit平台的整合方式。在这137款健康应用中，有些应用仅仅是从HealthKit中获取数据，而有些应用则是为HealthKit提供数据，以供其他相关应用使用。大约20%的应用可以同时做这两项工作。


    当然，本次分析列举的应用并不是一份极其详尽的名单，因为不断有新的应用加入HealthKit中，而苹果也在逐渐地向这个平台中加入新的项目数据。我们也发现了2～3个虽然宣称自己与HealthKit相连，但是具体要从HealthKit中获取或者不甚明了分享何种数据信息的应用，这些应用因而没有被加入本文的分析中。虽然HealthKit平台能共享各种各样的身体和健康数据，但大部分HealthKit平台上的健康应用都只是使用了其中的一小部分同类数据。活动卡路里和体重数据是从HealthKit中获取或上传的最常用的两项数据，心跳数据则紧随其后，位于第三位（图3-21）。


    ![](images/3ffa2754a417ad0d2222a59edfd793bc.jpg)


    图3-21 向苹果HealthKit上传和获取数据的App个数统计


    绝大多数HealthKit的健康应用都定位于健身跟踪，但是在苹果发布HealthKit之初，这个平台却更加强调能在医疗领域有所作为。这一点从它的合作伙伴Epic游戏公司和梅奥诊所那里得到了充分说明。分析发现了15款与医疗服务提供者相关的应用，以及其他3款与医疗支付方和企业雇主相关的应用。


    （1）集成于HealthKit的患者激励类App。在所列举的健康应用中，远程医疗和患者激励的应用有7个。American Well此前在2018年9月底发布的一条新闻中宣布他们也加入了HealthKit平台，其开发了两款提供视频访问功能接口的健康应用。其中一款应用从HealthKit中获取心率、血压、血温、营养状况、呼吸率及血糖状况的数据，以便于使用者可以通过视频通话的方式选取这些数据，与他们的医生进行交流。另一款应用——First
    Opinion，采用让患者和医生通过文本信息进行交流的一种科技含量稍低的方式进行远程医疗。HealthKit可以使患者和他们的医生能够分享更多的健康信息。


    其他的一些此类健康应用则可以让患者和医生通过其他的方式进行交流。例如，Health Loop使用HealthKit来帮助医生关注术后患者的活动数据信息；而Filament
    Labs开发的应用Patient IO则是让医疗服务的提供者与出院后的患者继续保持联系，使用HealthKit来追踪患者的健康数据并发送给他们的医生；Yingo
    Yango是一款为患者连接一个医疗团队的应用，其使用HealthKit的数据，让每一个医疗人员在治疗同一个患者的时候实现进度的同步。


    最后，两款来自大公司的健康应用开始进入患者激励领域。Web MD和Share Care应用都提供了追踪功能，并且开始与HealthKit共享追踪数据。Share
    Care也会从HealthKit中获取一些基础数据。


    （2）电子健康记录和个人健康记录。有一些医疗相关应用来自EHR供应商或者独立的个人健康记录提供者，在苹果WWDC大会上随HealthKit一起发布的Epic的My
    Chart就是这样一款应用。与此同时，Cerner也有一款苹果HealthKit平台的应用Healthy Now，它从HealthKit中读取步行数据，并以此鼓励患者要更多地活动。除了2018年早些时候的谣言，
    Allscripts公司并没有参与HealthKit平台整合的迹象。


    一个更小的电子健康记录（EHR）开发者Drchrono，同样也进入了HealthKit平台——虽然这并不是它主要的产品平台，因为iPad上并没有HealthKit应用，但是Drchrono使用HealthKit来为它的患者个人健康记录（PHR）应用提供数据——这款应用可以从HealthKit中读取体重、血压、心率等数据。此外还有个人健康记录应用Hello
    Doctor。


    （3）服务付费方与提供方。目前有两家保险公司的应用加入HealthKit平台，分别是Humana公司的Humana Vitality和the Health
    Care Services Corporation（HCSC）的Centered，其都是为用户设计的基础健康追踪应用。此外还有来自Virgin Pulse（以前的Virgin
    Health miles，一个用户健康信息数据的提供者）的应用和Max Activity Tracker及HealthKit连接。


    直接来自医疗服务机构的应用只有梅奥诊所。由梅奥做后盾的Axial Exchange，是一家为许多医院和医疗系统开发应用的科技公司，也宣布他们开发的应用均支持HealthKit。Axial称为患者开发的应用会从HealthKit中获取以下类别的信息：身高、步行数据（活动追踪）、体重（体重追踪）、血压（包括舒张压和收缩压）、心跳数据（有氧运动追踪）、血糖指数（血糖追踪）及睡眠分析（睡眠跟踪），同时Axial也会增加对用户的体重、血压、心跳及血糖等数据的分享。


    ### 4．一些奇思怪想的HealthKit应用


    以上是大部分健康应用的一般情况：利用HealthKit平台，定位于健康和自我检测。但还有一些奇怪的应用，它们以一些有趣和新颖的方式利用HealthKit中的数据。以下是一些我们没有预见到的HealthKit应用介绍。虽然其创意可嘉，但能否有可持续的吸引力并最终具有变现价值，还有待观察。


    （1）Deadline。这款售价2.99美元的应用从HealthKit平台获取数据，并和人口统计学数据进行比较，以此得出使用者在统计学意义上可能的死亡时间（图3-22）。如果用户改变锻炼及饮食习惯，其健康数据会发生变化，而死亡时间也有可能会相应地延后。这款应用从它的支持者那里获得了大量关注，但也有很多人认为这种病态的引导锻炼的方式显然是哗众取宠。一位评论家说：“我非常喜欢这款应用。我们所有人都在谈论如何变得更健康，但看着你的生命在一点点地流逝才会真的引起你的注意并让你去做点什么。”


    ![](images/a13e92516bafc8d3e68988554ba2f052.jpg)


    图3-22 苹果收费App Deadline应用界面


    （2）Wokamon。还记得在20世纪90年代流行的虚拟宠物吗？它们是一些小型地虚拟生物，并需要模拟地照看和喂养，甚至需要在传感器的监测下带它们进行真实的散步。Wokamon把这种概念引入了智能机时代，开发了更为先进的动画头像，并通过HealthKit、Fitbit、
    Jawbone及Moves来获取活动数据（图3-23）。


    ![](images/cca5b8ca9d984b75f7ec4517d53dc2f1.jpg)


    图3-23 苹果收费App Wokamon应用界面


    （3）Carrot Fit。当众多激励人们开始健身的应用仍然不能让你积极地锻炼身体的时候，也许来自Carrot——一位严格的健身教练的口头警告会有用处。通过利用HealthKit平台及其他应用中的数据，Carrot可以完整地评估你的健身情况（图3-24）。


    ![](images/b32498264402378a50bec43828053030.jpg)


    图3-24 苹果收费App Carrot Fit应用界面


    （4）On Campus。美国北卡罗莱纳州立大学已经开始使用这款学生健康应用来应对大一新生体重暴增（Freshman 15）的问题（图3-25）。这款应用可以为学生建立食谱，并且在HealthKit上同步，它还可以显示大学各个餐厅每个区域的菜单，这样学生可以在吃饭的时候把每种菜加入他们的食谱之中。


    ![](images/d472daf5bcc5c3da93991b128d05ea24.jpg)


    图3-25 苹果App On Campus应用界面


    （5）Panera Bread。Panera Bread是与HealthKit连接的连锁餐厅（图3-26）。像北卡罗莱纳州立大学的学生食堂那样，在Panera
    Bread就餐时可以选择菜单中的任意一样菜，将它输入HealthKit中，了解其营养成分。如果其他的餐厅也这样做，并且常用的食物日志应用如Lose It及MyFitnessPal可以与HealthKit中的营养数据库进行同步，那么食物日志将会变得越发便捷有用。


    ![](images/7e45b512a7d56916b2cc3fa1d9d48d5d.jpg)


    图3-26 苹果App Panera Bread应用界面


    ## 3.4.5 苹果人工智能回顾与展望


    无论是过去我们已经熟悉的ResearchKit、健康监测、运动监测功能，还是最新启动的心脏研究布局，或是苹果在收购Beddit之后应用商店推广的一系列睡眠健康App，都在表明进军医疗健康领域是苹果未来的一大发展方向。


    而在医疗健康领域，不只是苹果，包括谷歌、IBM、亚马逊等国际巨头都已相继入局，且谷歌和IBM在医疗人工智能领域的成就已经遥遥领先于苹果。人工智能是否会成为苹果下一个发力的领域呢？其实除了“听你使唤”的Siri之外，我们在苹果的发布会上还看到了苹果人工智能技术在面部识别解锁中的应用。


    全新的iPhone X可能是苹果AI属性最强的一个产品，“Face ID”人工智能生物识别技术将是很重要的功能演进。Face ID功能通过深感摄像头来实现，会投射超过3万个肉眼不可见的光点，并对它们进行分析，为脸部绘制精确细致的深度图，涵盖了人脸验证、TrueDepth摄像头、验证简便、专门的神经网络、自然和安全、用户隐私、注意力察觉、自适应性、Apple
    Pay和其他应用绑定的特性。


    配合全新的A11 Bionic神经引擎，iPhone X可以实现面部识别的准确无误，每秒6000亿次计算，即使佩戴眼镜、改变发型、佩戴帽子、修剪胡须都不会影响识别。


    库克强调：“我认为苹果改变世界的第一种方式是通过我们的产品。”苹果在医疗保健领域的应用更偏重健康管理与数据收集，如此次开启的心脏研究更是得到美国官方和斯坦福大学医学院的支持。而随着人工智能技术的深入发展，海量用户健康数据的收集与分析，都是未来苹果在医疗健康领域可以利用的资源。


    上一个10年，苹果用智能手机改变了世界；下一个10年，苹果的人工智能“黑科技”可能将改写人类的医疗健康进程。


    ## 3.5 引领人工智能芯片+医疗——英伟达


    英伟达（NVIDIA）是一家人工智能计算公司，公司创立于1993年，总部位于美国加利福尼亚州圣克拉拉市，黄仁勋（Jensen Huang）是创始人兼首席执行官。IBM、谷歌、Facebook等公司虽然在人工智能方面成绩斐然，但是他们所做的研究都是基于人工智能中的应用层，是利用人工智能技术为大家服务。而NVIDIA则位于人工智能最底层的技术层，是一家人工智能芯片公司。虽然该公司的图形处理器（GPU）产品最初是为计算机游戏而生的，但是目前已经成为驱动深度学习和自动驾驶等突破性技术的主力。


    ## 3.5.1 NVIDIA发展经历的3个阶段


    过去的20年是IT技术飞速发展的时代，而人工智能一直是计算机科学家的梦想。现在，人工智能不再是科幻片中的情景，已经开始在各行各业崭露头角。


    究竟是什么使得人工智能引领了新的IT技术革命？答案就是基于GPU的深度学习这一全新的计算模式，它让计算机能够从海量数据中进行学习，然后编写出人类无法写出的复杂软件。


    在过去的20多年中，NVIDIA历经了3个阶段的发展，从PC游戏显卡芯片的领军者，到2006年GPU通用计算的实现者，然后转型到人工智能计算公司。GPU最初用于模拟人类的想象力，实现PC游戏和电影的虚拟世界。今天，它也模仿人类的智慧，去更深入地了解物理世界。


    GPU通过数千个计算核心实现了强劲的并行处理能力，这对于运行深度学习算法至关重要。拥有人工智能的算法，使得计算机能够从海量数据中进行学习，并充当可以感知和理解世界的智能计算机、机器人和无人驾驶汽车的大脑。


    成为全球最聪明的智能公司只是NVIDIA的光环之一，它还是几年来全球表现最好的半导体公司：2016年纳斯达克100指数里表现最好的股票，几乎超出第二名3倍，2016年第三季度，由于数据中心、比特币挖矿对GPU芯片强势的需求，NVIDIA的销售额增长了54%，利润更是翻番，达到有史以来的最好水平。


    图3-27比较了2012—2017年每年1月底的NVIDIA股票、标准普尔500指数、标准普尔半导体指数和纳斯达克100指数的累计回报。以2012年1月29日为起点，4个指数的股价都设置为100美元。可以看到，2016年全年，NVIDIA得益于人工智能领域的表现，得到了投资者的青睐，股价大幅度上涨。综合来看，5年时间，NVIDIA的股价翻了8倍。


    ![](images/6d6db4b30c6c0c86e9de5d9e17774aae.jpg)


    图3-27 NVIDIA股票回报跑赢市场


    ## 3.5.2 第一阶段：从诞生到成为计算机图形芯片领军企业


    NVIDIA除了被麻省理工学院评选为全球最聪明的公司之外，它同时还获得了全球最受赞赏公司（《财富杂志》）、全球最佳CEO（《哈佛商业评论》）、全美最环保公司（《新闻周刊》）、50大最佳工作场所（Glassdoor）等殊荣。


    NVIDIA究竟是一家什么样的公司？


    NVIDIA诞生于1993年，创始人是黄仁勋、克里斯·马拉科夫斯基（Chris Malachowsky）和卡蒂斯·普里姆（Curtis Priem）。在过去的20多年中，NVIDIA的CEO都是由黄仁勋所担任。黄仁勋是一位极具个人魅力的领导者。在他领导下的NVIDIA仍然像一个初创公司一样：快速决策，快速执行。这对于一家图形处理器厂商来说不是一件简单的事情。


    黄仁勋是一位出生在台湾的美籍华人。1984年，黄仁勋于俄勒冈州大学取得电子工程学位，其后在斯坦福大学取得硕士学位。在俄勒冈州大学电子工程专业毕业后，黄仁勋来到了硅谷，加盟著名的处理器公司AMD（1983—1985年）。黄仁勋在AMD主要担任芯片设计师，周围一堆的博士让他倍感压力，之后他利用业余时间到斯坦福大学深造。两年后，黄仁勋跳槽来到了LSI
    Logic工作（1985—1993年）。


    这两家芯片公司的工作经历使黄仁勋进入芯片设计领域。特别是在LSI Logic，黄仁勋参与了计算机芯片图形处理部分设计，并参与市场工作，为随后创立NVIDIA公司打下了基础。1992年年底，两位曾经在SUN工作过的技术人员Chris
    Malachowsky和Curtis Priem把黄仁勋拉进NVIDIA的创业团队。因为既有技术背景又懂销售和管理，黄仁勋被推举担任公司总裁兼CEO，直到今天。


    NVIDIA于1995年发布了首款产品NV1图形芯片。NV1因为采用了多边形贴图，在技术方向上的错误选择使其成为一款失败的产品。这款产品耗尽了公司最早的投资。为了生存，公司从100多人裁员到30多人，黄仁勋承诺在公司情况好转后让大家再回来。


    后来，日本的游戏机巨头世嘉看好NVIDIA的研发能力，支付了700万美元订金，希望NVIDIA为其研发一款游戏机图形芯片。虽然最后世嘉取消了NV2的订单，转而使用了3dfx的PowerVR技术，但是这笔资金拯救了英伟达的命运。


    NVIDIA前期产品失败的一个很重要的原因，是当时的3D图形接口技术不统一。黄仁勋决定在后续的开发中，选择使用微软刚发布的Direct3D技术，专注于PC专用的2D/3D显卡。同时，黄仁勋召回了当初因为NV1失利后被迫辞退的研发人员。后来，NVIDIA在1997年发布了RIVA
    128（NV3），并获得了成功。


    随后，NVIDIA在图形芯片领域一路顺风顺水，RIVA TNT和RIVA TNT 2相继成为市场上的明星，市场份额首次超越了当时的大佬3dfx。1999年，NVIDIA推出了第一款GPU——GeForce
    256，实现了硬件实时编程着色。同年，NVIDIA在纳斯达克上市。


    多款重磅产品的发布使得NVIDIA逐渐成为市场上最重要的计算机图形芯片厂商，长期占据市场头把交椅，并收购了3dfx。20世纪90年代初，市场上有几十家计算机图形芯片厂商，而现在，仍在独立运营的图形芯片厂商只有NVIDIA一家，其他厂商纷纷倒闭或者被收购，NVIDIA最重要的竞争对手ATI也于2006年被AMD收购。


    当时的NVIDIA，旗下的GeForce GPU产品主要用于计算机游戏。它既能渲染一望无际的大海，也能雕刻精细的人物毛发，还能模拟逼真的烟雾效果，这些都使得游戏效果更为逼真。而且，NVIDIA
    Quadro GPU还被全球90%的专业图形工作站所采用，大量的数字艺术家、工业设计师、电影制作人员及广播工作者使用NVIDIA GPU，绝大多数奥斯卡最佳特效奖也是基于NVIDIA
    GPU技术制作而成的。


    ## 3.5.3 第二阶段：通过CUDA架构获得通用计算能力


    虽然NVIDIA已经稳坐视觉计算行业的头把交椅多年，但是黄仁勋一直保持着技术上的前瞻性和敏感度，不断带领NVIDIA继续创新，引领视觉计算行业的发展。


    从显卡厂商成为人工智能厂商，在这两步的跨越中，NVIDIA有几款重要的产品不得不提。在2006年以前的GPU显卡芯片中，采用的是专用电路对3D画面进行渲染。顶点着色器负责完成3D画面的顶点描绘和建模，用三角形组成图像，然后用渲染管线进行贴图，让3D图像拥有颜色和纹理。


    而在2006年年底，NVIDIA发布了一款具有划时代意义的GeForce 8800系列（代号G80）GPU（图3-28）。这款GPU没有使用传统的像素渲染管线设计，而是使用了名为CUDA的通用计算架构（又名SIMD统一渲染）。这种设计可以让显卡不仅能够实现3D图像的渲染，也可以如CPU一样实现其他的通用计算任务，一种强大而又全新的计算方式就此诞生。


    ![](images/a4752b780f084eaefd5185a0f9b5f175.jpg)


    图3-28 开启GPU通用计算时代的GeForce 8800 GTX显卡


    CUDA通用计算架构的计算性能在部分应用中能够实现比处理器快数倍的性能，这是因为它拥有数据的并行计算能力。通俗一点来讲，传统的中央处理器（CPU）的核心数量少，主要为串行指令而优化，数据计算方式如同流水线，计算指令需要一步一步完成。CUDA架构的GPU有非常多的流处理器，在大规模的并行运算中优势明显。这样的设计，让显卡也有了通用计算能力，从而在大规模的数据计算应用中提供了一种比CPU更加强大的计算性能。'
  fmt: '

    其中，睡眠是苹果越来越感兴趣的领域，苹果公司过去曾聘请过许多睡眠专家，且最近又收购了睡眠跟踪公司Beddit。收购Beddit，也预示着苹果将把其开发的睡眠追踪功能运用到旗下的所有产品上。


    ## 3．苹果HealthKit上的137个App详情分析

    2014年年底，MobiHealthNews发文探讨了苹果HealthKit平台上的一些App，一共包含137款健康应用，并分析了它们与苹果HealthKit平台的整合方式。在这137款健康应用中，有些应用仅仅是从HealthKit中获取数据，而有些应用则是为HealthKit提供数据，以供其他相关应用使用。大约20%的应用可以同时做这两项工作。

    当然，本次分析列举的应用并不是一份极其详尽的名单，因为不断有新的应用加入HealthKit中，而苹果也在逐渐地向这个平台中加入新的项目数据。我们也发现了2～3个虽然宣称自己与HealthKit相连，但是具体要从HealthKit中获取或者不甚明了分享何种数据信息的应用，这些应用因而没有被加入本文的分析中。虽然HealthKit平台能共享各种各样的身体和健康数据，但大部分HealthKit平台上的健康应用都只是使用了其中的一小部分同类数据。活动卡路里和体重数据是从HealthKit中获取或上传的最常用的两项数据，心跳数据则紧随其后，位于第三位（图3-21）。

    ![](images/3ffa2754a417ad0d2222a59edfd793bc.jpg)

    图3-21 向苹果HealthKit上传和获取数据的App个数统计

    绝大多数HealthKit的健康应用都定位于健身跟踪，但是在苹果发布HealthKit之初，这个平台却更加强调能在医疗领域有所作为。这一点从它的合作伙伴Epic游戏公司和梅奥诊所那里得到了充分说明。分析发现了15款与医疗服务提供者相关的应用，以及其他3款与医疗支付方和企业雇主相关的应用。

    （1）集成于HealthKit的患者激励类App。在所列举的健康应用中，远程医疗和患者激励的应用有7个。American Well此前在2018年9月底发布的一条新闻中宣布他们也加入了HealthKit平台，其开发了两款提供视频访问功能接口的健康应用。其中一款应用从HealthKit中获取心率、血压、血温、营养状况、呼吸率及血糖状况的数据，以便于使用者可以通过视频通话的方式选取这些数据，与他们的医生进行交流。另一款应用——First
    Opinion，采用让患者和医生通过文本信息进行交流的一种科技含量稍低的方式进行远程医疗。HealthKit可以使患者和他们的医生能够分享更多的健康信息。

    其他的一些此类健康应用则可以让患者和医生通过其他的方式进行交流。例如，Health Loop使用HealthKit来帮助医生关注术后患者的活动数据信息；而Filament
    Labs开发的应用Patient IO则是让医疗服务的提供者与出院后的患者继续保持联系，使用HealthKit来追踪患者的健康数据并发送给他们的医生；Yingo
    Yango是一款为患者连接一个医疗团队的应用，其使用HealthKit的数据，让每一个医疗人员在治疗同一个患者的时候实现进度的同步。

    最后，两款来自大公司的健康应用开始进入患者激励领域。Web MD和Share Care应用都提供了追踪功能，并且开始与HealthKit共享追踪数据。Share
    Care也会从HealthKit中获取一些基础数据。

    （2）电子健康记录和个人健康记录。有一些医疗相关应用来自EHR供应商或者独立的个人健康记录提供者，在苹果WWDC大会上随HealthKit一起发布的Epic的My
    Chart就是这样一款应用。与此同时，Cerner也有一款苹果HealthKit平台的应用Healthy Now，它从HealthKit中读取步行数据，并以此鼓励患者要更多地活动。除了2018年早些时候的谣言，
    Allscripts公司并没有参与HealthKit平台整合的迹象。

    一个更小的电子健康记录（EHR）开发者Drchrono，同样也进入了HealthKit平台——虽然这并不是它主要的产品平台，因为iPad上并没有HealthKit应用，但是Drchrono使用HealthKit来为它的患者个人健康记录（PHR）应用提供数据——这款应用可以从HealthKit中读取体重、血压、心率等数据。此外还有个人健康记录应用Hello
    Doctor。

    （3）服务付费方与提供方。目前有两家保险公司的应用加入HealthKit平台，分别是Humana公司的Humana Vitality和the Health
    Care Services Corporation（HCSC）的Centered，其都是为用户设计的基础健康追踪应用。此外还有来自Virgin Pulse（以前的Virgin
    Health miles，一个用户健康信息数据的提供者）的应用和Max Activity Tracker及HealthKit连接。

    直接来自医疗服务机构的应用只有梅奥诊所。由梅奥做后盾的Axial Exchange，是一家为许多医院和医疗系统开发应用的科技公司，也宣布他们开发的应用均支持HealthKit。Axial称为患者开发的应用会从HealthKit中获取以下类别的信息：身高、步行数据（活动追踪）、体重（体重追踪）、血压（包括舒张压和收缩压）、心跳数据（有氧运动追踪）、血糖指数（血糖追踪）及睡眠分析（睡眠跟踪），同时Axial也会增加对用户的体重、血压、心跳及血糖等数据的分享。


    ## 4．一些奇思怪想的HealthKit应用

    以上是大部分健康应用的一般情况：利用HealthKit平台，定位于健康和自我检测。但还有一些奇怪的应用，它们以一些有趣和新颖的方式利用HealthKit中的数据。以下是一些我们没有预见到的HealthKit应用介绍。虽然其创意可嘉，但能否有可持续的吸引力并最终具有变现价值，还有待观察。

    （1）Deadline。这款售价2.99美元的应用从HealthKit平台获取数据，并和人口统计学数据进行比较，以此得出使用者在统计学意义上可能的死亡时间（图3-22）。如果用户改变锻炼及饮食习惯，其健康数据会发生变化，而死亡时间也有可能会相应地延后。这款应用从它的支持者那里获得了大量关注，但也有很多人认为这种病态的引导锻炼的方式显然是哗众取宠。一位评论家说：“我非常喜欢这款应用。我们所有人都在谈论如何变得更健康，但看着你的生命在一点点地流逝才会真的引起你的注意并让你去做点什么。”

