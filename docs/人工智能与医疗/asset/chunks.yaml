    ## 3.3.5 微软在HIMSS2018会议上发布的项目

    除了Healthcare NExT主要的4个板块外，微软还在HIMSS2018会议上分享了相关的辅助项目，以协助Healthcare NExT健康发展。这些辅助项目如下。


