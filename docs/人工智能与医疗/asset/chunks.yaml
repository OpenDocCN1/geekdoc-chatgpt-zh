  trans: '


    人工智能在各行业中应用的机会在哪里？人工智能的应用在各行各业中都有相似或者相近的优势，主要有两大辅助作用：一是对项目运营进行优化，二是高效率地辅助决策。


    ## 1. 运营优化

    人工智能通过图像、语音、物联网等各种传感器收集数据，再通过数据对项目运营中的问题进行分析，并提出优化建议。例如，医疗行业中，对医院人流量、手术量、医护人员进行监测，提供医院管理建议；金融行业中，对项目收益进行分析预测，提出改进建议；零售业中，对地区销售物品的类型进行监控，提出库存优化建议。


    ## 2. 辅助决策

    人工智能通过大数据收集，显著提高决策效率，并降低成本。全面的数据收集尽可能地不漏过蛛丝马迹，再用深度学习算法来洞察业务中的关键决策点，计算速度和准确性都要高于人类。例如，医疗行业中的影像识别能快速准确地判断患者是否患有肿瘤；农业中，通过土壤、天气、卫星图像的数据决定种植、灌溉和施肥的时间；金融行业中，通过各种历史数据和财务数据完成风控和交易。在医疗健康行业，人工智能的应用场景越发丰富，人工智能技术也逐渐成为影响医疗行业发展、提升医疗服务水平的重要因素。与互联网技术在医疗行业的应用不同，人工智能对医疗行业的改造包括生产力的提高、生产方式的改变、底层技术的驱动和上层应用的丰富。


    人工智能在医疗领域的应用，有以下几点好处。

    ①可以提高医疗诊断的准确率与效率；

    ②提高患者自诊比例，降低患者对医生的需求量；

    ③辅助医生进行病变检测，实现疾病早期筛查；

    ④大幅提高新药研发效率，降低制药时间与成本。


    ## 1.4 医疗技术：人工智能与医疗的新融合

    人工智能的发展可谓如火如荼，落实到具体行业中，医疗健康领域的人工智能创业公司表现尤为突出。而在医疗领域最突出的问题就是优质医疗资源不足，同时，医生对疾病的诊断准确度和效率还有非常大的提升空间。长期以来，大多数国家和地区，特别是进入老龄化社会之后，对医生的需求量有增无减。要想解决医生资源不足的问题，除了增加医生供给量，别无他法。但医生培养需要周期，而且供给量也不是无限增加的。


    于是，人们开始寄希望于机器。因为一旦能够实现机器看病，供给量将会无限增加。所以，人工智能与医疗健康的结合，是人工智能最重要的应用场景之一。


    ### 1.4.1 人工智能与医疗的发展史

    1972 年由利兹大学研发的 AAPHelp 是资料记载当中医疗领域最早出现的人工智能系统。这个系统基于贝叶斯决策理论^(\[1\])开发，主要用于腹部剧痛的辅助诊断及手术的相关需求。


    1972 年，MYCIN（图 1-3）诞生于斯坦福大学。这款人工智能系统基于专家系统，通过医生输入一些和患者有关的信息，从而给出可能导致患者病情的细菌种类，并且给出药物建议。算法的核心其实是医生给出的约
    600 条的诊断规则，医生结合患者的实际情况，回答系统显示的问题。系统会根据答案，给出可能致病的细菌，并且给出概率排序和置信度，同时给出每类诊断的依据。研究显示，MYCIN
    的诊断算法在所有的测试样例中均达到了 69%的准确率，要高于依据相同规则进行诊断的医生。


    ![](img/a4f589e4998ab8b0f937760b11ac9ccb.jpg)

    图 1-3 MYCIN 专家系统原理图


    然而，MYCIN 专家系统并没有真正在医院中获得推广。这是因为当时的准确率偏低，而最主要的原因是受到软、硬件条件的限制。那时没有成熟的办公软件，更不用说云计算等技术。医生为了使用智能机器进行诊断，需要花费
    30 分钟甚至更多的时间输入问题的答案。医生长时间消耗在问题录入上，对病情的诊断显然有影响。


    20 世纪 80 年代，出现了一些商业化应用系统，如快速医疗参考（Quick Medical Reference，QMR），还有哈佛医学院开发的决策支持系统（DXplain），它主要依据临床表现提供诊断方案。据了解，决策支持系统的知识库中已经收录了
    2000 多种疾病和 5000 多种症状。


    20 世纪八九十年代，随着个人计算机的快速发展，医疗领域也进入信息化时代。但此时的计算机应用大多局限于患者信息记录、病历管理、医院管理等信息化建设，并不能提供诊断意见。90
    年代末期，计算机辅助诊断（Computer Aided Diagnosis，CAD）系统出现，它可以帮助医生对疾病进行辅助诊断。乳腺 X 线摄影计算机辅助诊断是比较成熟的医学图像计算机辅助应用，欧美已经针对这种计算机进行了近
    20 年的研究。X 射线图像经 CAD 处理后，肿瘤、结节、空洞、炎症及纤维化病变的检出率都提高了。


    CAD 技术主要基于医学影像学，CAD 研究大多局限在乳腺和胸部肺结节病变方面。CAD 技术虽然也通过计算机在图像上自动标注病变位置，但是并没有人工智能技术加入，无法通过自动学习的方式提升准确度。


    2007 年，IBM 公司开发出了一款人工智能系统，并以 IBM 创始人托马斯·约翰·沃森（Thomas J.Watson）的姓沃森（Watson）来命名。Watson
    拥有了理解自然语言和精确回答问题的能力。Watson 应用的技术主要包括自然语言处理（包括语音和语义识别、自动翻译）、计算机视觉（图像识别）、知识表示、自动推理（包括规划和决策）、机器学习和训练。


    2011 年 8 月，Watson 开始应用于医疗领域，成立沃森健康（Watson Health）。例如，在肿瘤治疗方面，到 2015 年 Watson 已收录了肿瘤学研究领域的
    42 种医学期刊、临床试验的 60 多万条医疗证据和 200 万页文本资料。随后，IBM Watson Health 参与多项医疗应用人工智能研究，包含慢病管理、健康监测、新药研发、白内障手术、液体活检等领域，并迅速完成了商业化应用。


    2016 年 2 月，谷歌 DeepMind^(\[2\])成立 DeepMind Health 部门，与英国国家医疗服务体系（NHS）合作，辅助医生决策，提高效率，缩短时间。在与皇家自由医院的合作试点中，DeepMind
    Health 开发了名为 Streams 的软件。这一软件用于血液测试的 AKI 报警平台，可以帮助临床医生更快地查看医疗结果。


    2016 年 7 月，谷歌 DeepMind 与 NHS 再次合作，同 Moorfields 眼科医院一起开发辨识视觉疾病的机器学习系统。通过一张眼部扫描图，该系统能够辨识出视觉疾病的早期症状，达到提前预防视觉疾病的目的。


    ### 1.4.2 人工智能与医疗的未来

    人工智能辅助医疗健康领域，可以获得诸多颠覆性的改进。


    科技辅助医疗发展的 3 个阶段如图 1-4 所示。


    ![](img/0f9e9e6a16c2ec1f6a4cf2a9f2dcea22.jpg)

    图 1-4 科技辅助医疗发展的 3 个阶段


    第一，人工智能的应用可以帮助医生提高医疗诊断速度和准确率，提高医生的供应量。第二，可以提高患者自查、自诊、自我管理的比例，降低患者对医生的需求量，减少成本。第三，可以更早发现疾病，减少后续的医疗费用支出。第四，可以提高医疗机构和医生的工作效率，降低医疗成本。第五，可以优化医院的管理水平，减少不合理的医疗支出。第六，可以帮助研发人员发现有价值的新药物，帮助医生对患者进行个性化分析，优化治疗方案。


    所以，人工智能和医疗的结合可以大大提高医疗质量，降低医疗成本，激发人们对人工智能改变生老病死的想象。


    ### 1.4.3 人工智能医疗能力圈正不断拓展边界

    人工智能医疗能力圈识别如表 1-2 所示。


    表 1-2 人工智能医疗能力圈识别


    ![](img/aee6bb686897dda1c5354dc1acf87244.jpg)


    人工智能的这些能力应用于医疗领域，人工智能医疗系统将具有各种形式的对话能力，这将有助于信息在个人之间的流动，因为它们能够与人类进行对话，根据病史来了解病患，帮助医疗机构向用户提供有吸引力的个性化医护建议。


    用户可借助由提供商提供支持的人工智能系统进行互动，如医疗对话、收集医疗数据和健康效益等信息，人工智能系统还可以快速准确地回答用户所提出的复杂医疗问题。通过实现动态、个性化的健康体验，人工智能医疗系统可帮助用户做出以自己为中心的、明智的健康建议。


    人工智能系统有助于用户发掘即使最聪明的人类也可能无法发掘的洞察力，发掘和分析全球大量可用信息。举例来说，医疗研究领域存在大量信息，高级人工智能能力已显著缩短了科研所需的时间，从数月缩短到了数分钟。


    除此之外，人工智能系统可以加工大量医疗和患者信息，从而使医师将更多的时间放在患者身上。人工智能系统可提供基于综合信息的辅助建议，进而帮助决策并减少人为偏差。人工智能系统根据新的信息、结果和操作不断学习，有助于医疗专业人员做出更加明智、及时的决策。人工智能几无边界，这意味着现有的医疗人工智能能力圈也将不断扩展，而这一切正在发生。


    \[1\] 贝叶斯决策理论：是主观贝叶斯派归纳理论的重要组成部分。 贝叶斯决策就是在不完全情报下，对部分未知的状态用主观概率估计，然后用贝叶斯公式对发生概率进行修正，最后再利用期望值和修正概率做出最优决策。


    \[2\] DeepMind：位于英国伦敦，是由人工智能程序师兼神经科学家戴密斯·哈萨比斯(Demis Hassabis)等联合创立的，是前沿的人工智能企业，其将机器学习和系统神经科学的最先进技术结合起来，建立起强大的通用学习算法。目前，Google
    旗下的 DeepMind 已经成为 AI 领域的明星。


    # 第 2 章 实践布局：人工智能与医疗的九大细分领域

    人工智能和医疗的结合方式非常多，从就医流程来看，有针对诊前、诊中、诊后的各阶段应用；从应用对象来看，有针对患者、医生、医院、药企等多角色应用；从业务类型来看，有增效、减成本等多种模式。本章从具体业务模式细分方向进行详细介绍，分别是虚拟助手、疾病筛查和预测、医学影像、病历/文献分析、医院管理、智能化器械、药物发现、健康管理和基因测试
    9 个方面。


    ## 2.1 虚拟助手

    虚拟助手是一种可以和人类进行沟通和交流的辅助机器人，它通过人工智能技术理解人类的想法，了解人类的需求，并输出各类知识和信息，辅助人类的生活和工作。


    通用型的虚拟助手相对来说大家已经很熟悉了，如苹果手机上的 Siri、微软的 Cortana、亚马逊的 Alexa、谷歌的 Google Assistant、脸书（Facebook）的
    M 等。人工智能虚拟助手使用自然语言处理技术进行语音和语义识别，以及优化的决策算法来完成与人类的互动。借助虚拟助手，人们可以直接说出问题、愿望和需求，并从虚拟助手的反馈中得到答案。


    人们和虚拟助手的交互方法一般有语音和文字两种，机器通过语音和语义识别与人类进行沟通。所以，语音识别技术是虚拟助手产品中非常重要的一项技术。但医疗类型的虚拟助手还有另一种交互方式，就是选择题。因为普通人很难用准确的语言来表达自己的问题，所以医疗健康类的虚拟助手大部分会使用选择题的方式和人进行沟通（图
    2-1）。


    ![](img/18ac0b82df65c0a0a292fa8c8d139ec9.jpg)

    图 2-1 通用型虚拟助手和医疗型虚拟助手的交互方式区别


    调查公司 VoiceLabs 在其公布的《2017 年语音产业报告》中指出，语音产业将按照硬件产品、人工智能软件、语音应用 App、生态系统服务相结合的生态链出现（图
    2-2）。在硬件层面，主要由 Amazon Echo 和 Google Home 两家产品瓜分市场。


    ![](img/1d79915ad53a0e152299b47495982e64.jpg)

    图 2-2 语音虚拟助手生态


    2017 年全球性的市场调查咨询公司 Markets and Markets 的报告中显示，2016 年的智能语义识别和语音识别市场份额达到了 51.5 亿美元，预计到
    2023 年，这一市场份额将增长至 183 亿美元，年复合增长率为 19.8%。在移动设备上基于语音生物识别系统身份验证需求的增加，以及人工智能在语音识别和语义识别准确性上的发展，显著推动了市场份额的增长。


    ![](img/f81ee3462deab186485de4a3a47b2d12.jpg)

    图 2-3 语音识别市场容量


    在各垂直细分领域中，汽车、银行、金融服务和保险（BFSI）、零售、教育、医疗保健等方面都有较广泛的应用，而属于医疗领域的语音识别市场并不靠前。一份来自亚马逊
    Alexa 的数据显示，个人用户在使用语音识别设备时，医疗健康的语音需求排名第 9。医疗型虚拟助手和通用型虚拟助手类似，又有所不同。


    医疗方面虚拟助手的数据库范围局限在医疗领域。通用型虚拟助手和医疗型虚拟助手相同的地方是它们采用类似的信息输入和输出方式，实现的功能一样。不同的是，通用型虚拟助手的数据库范围更广，医疗型虚拟助手提供的是更加复杂和谨慎的专业医疗服务，需要受到严格监管；通用型虚拟助手上市时间早，资本支持度高，数据规模大，而医疗型虚拟助手的专业属性强、监管风险高（图
    2-4）。


    ![](img/4d789133221fb466190c2b0f491d82ed.jpg)

    图 2-4 通用类虚拟助手和医疗类虚拟助手的区别


    根据虚拟助手的服务对象进行分类，可以把虚拟助手分成 3 个类别，分别是使用者是患者的虚拟助手，包括个人问诊、用药咨询等应用；同时联结医患双方的虚拟助手，包含智能导诊、分诊机器人和慢病管理等应用；使用者是医生的虚拟助手，包含电子病历语音录入等应用（图
    2-5）。


    ![](img/504e161f8a12714a17c04932a233503f.jpg)

    图 2-5 虚拟助手图谱


    ### 2.1.1 个人问诊、用药咨询

    在工作模式方面，个人问诊和用药咨询的第一个步骤是自然语言处理，也就是听懂患者对症状的描述，知道患者哪里不舒服。用户可以通过语音或者文本两种模式来输入信息。通过自然语言处理之后，再根据疾病数据库、医疗信息数据库或者外部的医疗数据库进行对比和深度学习，对患者提供医疗和护理建议（图
    2-6）。


    ![](img/96fa846d94967f916eac8cc30803a094.jpg)

    图 2-6 人工智能参与虚拟助手的部分


    一对一的医患服务是需要较高的人力成本和时间成本的。普通大众有时候仅仅需要一些快速和低成本的医疗建议，虚拟助手可以很好地满足这个需求。个人健康咨询的轻问诊和用药咨询都可以很好地依靠人工智能来完成。


    用户在身体不适的时候，并不是每次都会去医院或者诊所就诊。在这种情况下，人工智能可以让患者对自己身体疾病的判断更便捷、更准确，基本定位身体的健康问题。不管是相较于到诊所挂号诊疗，还是到药房寻求药师指导，医疗虚拟助手提供的轻问诊服务在可及性、便利性上都占有较大优势。


    虚拟助手除了可以控费外，还拥有完整的医学基础数据库。医生无法医治所有的疾病，而人工智能理论上可以做到，因此完全可以成为医生的得力助手。全科医生有两大职能，分别是首诊和分诊。目前，我国全科医生还很紧缺，而虚拟助手可以在医生不擅长的领域提供更好的建议。


    在目前的分级诊疗中，社区医疗的发展瓶颈很大程度上在于全科医生的数量不足及诊疗经验的不足。过去我国全科医生的发展有一段停滞期，到 2011 年以后才开始逐步推进。人工智能语音助手也可以帮助全科医生快速做小病的筛查，以及重大疾病和传染病的预警，帮助他们做好转诊工作，这是其对于全科医生的价值所在。


    虚拟助手还可以降低互联网医疗企业的业务成本，通过远程和人工结合的方式形成流量导流。虚拟助手产品并不一定完全依赖机器来回答问题，一旦由人工智能无法解决，或者病情变化需要医师干预的时候，就可以由人工介入。这样一方面可以完善人工智能虚拟助手的服务，另一方面也可以提升自身产品的体验，增加卖点，提高用户黏度，提升转化率。


    #### 1. 问题和挑战

    首先，医疗型虚拟助手的发展应受到严格监管。医疗责任主体不明，法律未针对虚拟助手等人工智能诊疗手段进行细化明确，监管部门禁止虚拟助手提供轻微疾病的诊断和重症的任何建议。


    其次，因为患者并不完全了解自己身体所出现的状况，主诉表达的时候会漏掉一些关键信息，同时咨询的时候会使用大量的非专业词汇，甚至进行错误的描述，而且虚拟助手可能没有办法去挖掘真正有用的信息来做出更准确的判断。所以，目前大部分医疗型虚拟助手都是通过选择题，而非问答题来解决这个问题。


    但个人问诊、用药咨询类的虚拟助手依然存在机遇，无论是学习能力还是成本控制，人工智能相对来说有明显优势，具有高效辅助医师的能力。


    #### 2. 商业模式的建立

    前面介绍过，虚拟助手根据使用者的不同，分为个人用户、个人用户和医生、医生 3 种类别。面向个人用户的个人问诊和用药咨询类虚拟助手，如果仅仅是完成和用户的交流，而没有后续的动作，那么搭建商业闭环是比较困难的。


    用户使用虚拟助手的付费意愿并不强，企业投入大量的资金完成基础数据库和人工智能人才团队建设之后，如何完成后续的盈利是一个很重要的课题。目前来看，个人问诊类应用连接的后续服务是进行互联网就医导流，用药咨询类应用连接的后续服务是进行互联网或线下的药品购买导流（图
    2-7）。


    ![](img/0c2215e40eec831ff9791cf73f83b382.jpg)

    图 2-7 虚拟助手最后往往会形成用户导流


    例如，在支付宝医疗健康类目上线的智能预诊功能，就是由好人生公司推出的“绝世好医”智能问诊平台。该平台的智能预诊功能主要是通过患者的症状主诉进行智能分诊，给出建议就诊科室后，也可以提供专业医师的健康咨询服务。“百度医疗大脑”宣布与社区医疗服务企业“社区
    580”合作，将人工智能赋能医疗社区，上线“美乐医”，为用户带来 24 小时医疗咨询服务。该合作不仅可以让人工智能完成线上的智能分诊和预诊服务，也可以在实际使用中不断优化提升人工智能的准确度。


    #### 案例介绍

    ##### 半个医生

    “半个医生”于 2015 年 11 月正式上线，截至 2017 年 9 月，用户数在 30 万人左右。半个医生对可能涉及的 18 万种症状及关联的 9000
    种疾病进行理解和分析，能满足 100 万个用户同时查询，有 70 多人的医学团队在对机器学习进行训练。从标签组合到完成疾病结果的全部查询过程用时不到 1 秒，准确率在
    70%左右，并且通过机器学习还在不断提升。


    半个医生针对科研资料中的诊断记录，把疾病拆解成包括症状在内的各种各样的标签，之后找到标签之间的关联性，掌握疾病的规律，模拟医生的推理逻辑，为用户分析出可能的疾病结果（包括疾病常识、预防常识、对应科室、检查项、药物、患病年龄分布等），以及需要对接的医院和药店。


    ##### 绝世好医

    “绝世好医”是上海好人生集团和美国梅奥集团合作推出的智能预诊分诊系统。“绝世好医”基于梅奥积累的 150 年的西医大数据，算法囊括了 52 888 个判断节点，后面涉及的结论多达一万多个。


    “绝世好医”智能预诊分诊系统和支付宝进行合作，让人们看病就医更简便。在支付宝的医疗健康类目中，进入“智能预诊”，便可方便快捷地获取科学循证的预诊分诊结果。


    美国梅奥诊所调查报告显示，使用该分诊系统后，97%的用户清楚接下来应该怎么做；98%的用户认为系统“非常好”；56%原认为需要急诊的用户根据建议选择了非急诊；38%原要去专科医院的用户选择了分级诊疗的医院；20%的用户使用智能自诊了解自身状况后选择了自己在家按专业意见进行自理。


