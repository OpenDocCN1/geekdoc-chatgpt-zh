    需要说明的是，目前有些公司的敏感性和特异性数据是在特定数据集下的数据，而不是临床数据。这些数据只能证明其研究进展，而不能作对比。


    ## 企业案例


    ### 推 想 科 技

    推想科技是国内第一家形成临床应用的深度医学人工智能公司，成立于 2015 年年初。目前，推想科技的产品可以提供 3 个方面的服务：智能影像报告检验、智能辅助筛查和智能鉴别诊断。

    推想科技智能 CT 线辅助筛查产品可自动标记出 CT 各层面上病灶的位置，辅助医生快速准确地完成 CT 诊断。这样医生就不用花那么多时间在健康人群上，而把时间用在重大疾病的诊治上，不仅可以减少重复性劳动，还可以减低医生的疲劳度。

    在诊断速度方面，一个医生完成 20 个病例的诊断需要 3 个半小时，利用推想人工智能产品，就算是最低配置的计算机只需 6 分 15 秒。

    在诊断准确率方面，人工智能对于大小结节的综合灵敏度是 85%左右，针对不同大小的结节，敏感度情况不同。推想科技 2017 年 3 月 9 日的测试数据显示，对于
    0～3mm 的结节，推想科技模型敏感度为 84.03%；对于 3～6mm 的结节，模型敏感度为 88.31%；对于大于 6mm 的结节，模型的敏感度为 100%。

    随着算法模型的不断完善，迭代速度不断加快，推想科技的服务领域也逐渐向头部、腹部、股骨头、病理和超声等领域延伸，覆盖 100 多种疾病。

    2018 年 3 月 19 日，推想科技宣布完成 3 亿元 B+轮融资，投资方由启明创投领投，红杉资本、元生资本、襄禾资本、尚珹基金组成。这是迄今为止医学影像人工智能行业内最大规模的单笔融资。此轮融资将继续深耕
    AI 医疗影像细分领域，所融资金将全部投入 AI 医疗影像产品的研发、生产及国际化营销方面（表 2-9）。

