    ## 4.4.3 腾讯内地以外的医疗多样化布局


    以上简单介绍了百度系、阿里在内地以外的医疗投资，由于腾讯参投项目较多，因此单列出来讨论。


    腾讯一共参投了14个内地以外的医疗项目，最早从2015年开始布局。其中，2015年8个，2016年1个，2017年4个，2018年1个，主要项目地点在美国。


    下面介绍一些腾讯参投的有代表性的内地以外的医疗公司。


    ### 企业案例


    #### Grail


    Grail是腾讯参投的内地以外的医疗项目中唯一的“独角兽”。2018年3月1日，外媒报道Grail计划在中国香港IPO首次公开募股，并拟融资5亿美元。


    Grail成立于2016年，由全球基因测序龙头企业Illumina组建，致力于研发癌症筛查血液检测技术。2017年5月，Grail与由香港中文大学教授卢煜明创办的生物科技公司Cirina合并。


    Grail曾于2017年6月宣布最新研究成果，称依据临床试验数据，通过特定的血液检测能够挖掘到与肿瘤有关的少量DNA突变。之后，该公司表示其第一款产品于2018年发布，可以筛查一类位于上咽喉和鼻腔后的癌症。


    Grail自成立以来就受到了资本的追捧，现已完成3轮融资，总融资额高达13亿美元。现有投资者包括比尔·盖茨、亚马逊公司创始人贝佐斯的个人风险投资基金、腾讯控股、百时美施贵宝、Celgene、强生创新和默克等知名投资人、投资机构和药企。


    #### Practo


    Practo被称为“印度版春雨医生”，该公司成立于2008年，主要提供两方面的服务：一方面是以消费者为中心，为患者提供在线的医疗搜索服务，病人可以通过平台找到相应的医生，并在
    Practo平台完成预约，或者进行体检预约、订购药品、获取健康资讯等；另一方面是面向医疗机构和医生提供的SaaS产品——Practo Ray，可以帮助用户进行日程安排、医药库存、医疗账单等内容的在线管理，帮助医疗机构改善患者诊疗体验，提高医疗效率。Practo现已将业务拓展至印度尼西亚、菲律宾、巴西等地。


    腾讯在2015年注意到了这家公司，领投了其9000万美元的C轮融资。2017年1月，腾讯再次领投了Practo 5500万美元的D轮融资。Crunchbase数据显示，截至2018年4月，Practo一共进行了5轮融资，总融资额高达2.34亿美元。


    2018年1月，Practo和印度ICICI Lombard保险公司合作推出面向个人用户的“Trinity”服务，ICICI Lombard保险公司客户可由Practo平台选择医生和诊所，并进行无现金、无纸化就诊。


    #### Karius


    传染性疾病是全球致死的主要疾病，也是未满足需求的巨大领域，Karius即瞄准此市场。Karius成立于2014年，由米奇·凯特斯（Mickey Kertesz）、史蒂夫·雷克（Steve
    Quake）、蒂姆·布劳恩坎普（Tim Blauwkamp）等联合创建，他们创造了一种新的血液检测方式，可快速检测血液中的细菌、病毒和真核生物病原体。


    Karius现有两个系列的产品：数字文化测试（Digital Culture Test）和分枝杆菌嵌合体DNA测序试验（Mycobacterium Chimaera
    DNA Sequencing Test）。


    数字文化测试通过检测患者血液中的病原体来帮助医生确定有效的治疗方案，其适应征包括败血症、心内膜炎、脊髓炎及难以在实验室培养检测的病原体引起的病症。


    分枝杆菌嵌合体DNA测序试验可以从血液中检测到分枝杆菌嵌合体（M.chimaera）。分枝杆菌嵌合体广泛存在于生活环境中，医疗设备被其污染后，病原菌以气溶胶的方式进入人体，导致免疫力低下者（术后患者等）感染致病。多项研究均指出，污染的控温箱
    （HCU） 是导致心脏外科手术感染分枝杆菌嵌合体的源头。利用Karius提供的测试，可以在一天内就得到检测结果，以判断感染的风险。


    据外媒报道，Karius以2000美元的价格向医疗机构和实验室销售以上产品，虽然比传统的检测产品更昂贵，但Karius的检测效果更好，时间也更快，对于一些感染为阴性的患者，其测试的价值更加突出。


    Karius自成立以来已完成了种子轮及A轮融资，总融资额为5500万美元。腾讯在A轮时进入，并未领投。


    #### HomeHero


    HomeHero是一家非医疗家庭护理提供商，类似于国内的“医护到家”，可以帮助家庭寻找、获取上门护理服务。它最为重要的模式是自有数百名医护人员，可根据用户的需求来进行调配。据其官网数据，HomeHero现已成为美国加州地区最大的到家服务提供商，为数千个家庭提供了超过100万小时的护理服务。


    人口老龄化为HomeHero的发展提供了基础。自2000年以来，美国65岁以上人口就一直处于稳步增长的状态，人口老龄化为老年人家庭护理提供了发展契机。美国统计局的数据显示，每年约有50万人加入“65+大家庭”。根据美国统计局预测：到2030年，美国65岁以上老人将占总人口的20%。这也意味着为老人提供到家服务有着巨大的市场。


    HomeHero已完成3轮融资，总融资金额为2300万美元。腾讯参与的是其A轮融资，该轮融资额为2000万美元，由Graham Holdings领投，腾讯等跟投。


    #### Scanadu


    Scanadu成立于2011年，是一家随身医疗设备开发商。它在2013年推出主打产品Scanadu Scout，这个圆形的小块中有独立的操作系统，内藏陀螺仪、电极、发光二极管、加速仪等其他传感器。把这个小块贴在额头上10秒，对应的App就能显示出用户的各项身体指标，包括脉搏、心跳、心脏电讯号、体温、心跳变化、血氧饱和浓度等。


    Scanadu Scout灵感来源于《星际迷航》中的三录仪，特斯拉创始人伊隆·马斯克（Elon Musk）体验该产品之后，曾评价“这就是世界需要的产品”。


    另外，该公司正在研发家用尿液检测试剂盒“Scanadu Urine”，为人们通过测量尿液样本中的化学物质水平来检查多种健康状况。相应地，该测试结果也能在Scanadu应用上显示和存储。


    #### CliniCloud


    CliniCloud成立于2014年，是一家家用医疗智能硬件公司。目前，该公司推出了一款名为CliniCloud Medical Kit的智能硬件，该硬件包含智能听诊器和体温计两部分，售价为149美元。


    其中的红外体温计可在不接触身体的情况下测量体温，听诊器则是传统的有线模式，通过一根高保真数据线将听诊器与手机连接。体温和听诊器采集的数据都可在云端存储、分享，方便用户在家中自测健康数据，并分享给医生，以获取医疗建议。


    #### Clear Labs


    Clear Labs 创立于2014年，是一家食品检测公司，它使用一系列检测方式来判断食品成分、转基因、微生物等数据，并将此服务提供给农产品、食品生产商和实验室。


    2016年12月，Clear Labs宣布完成1300万美元B轮融资，Wing Venture Capital领投，腾讯等跟投。截至目前，Clear Labs总融资金额为2450万美元。


    ## 4.4.4 腾讯医疗布局：大健康产业链无缝“连接”


    相较于海外投资，腾讯在国内的“赛道”更加丰富，参投的医疗企业也更多，如表4-5所示。在这些项目中，有些项目还拿到了腾讯的多轮融资，如晶泰科技、医联Medlinker、微医等，腾讯大有持续孵化之势。


    另外，腾讯已“亲自下场”，微信智慧药店、腾爱医生、企鹅医生、微保、腾讯觅影等，都是腾讯在医疗业务上的纵深布局。


    表4-5 腾讯国内医疗投资数据


    ![](images/9222b44946ac2bfe2bcbca34c355be79.jpg)


    续表


    ![](images/56b90ab7b627a1c80dfd6587bc543962.jpg)


    从布局逻辑看，腾讯希望建立线上、线下一体的完整医疗生态链，涉及线上的有寻医问诊、健康管理、慢病康复，线下的有诊所、医药O2O、保险和运动健身等，其服务对象包括患者、医生、医疗机构、保险公司和药店等。最为核心的特点是，腾讯希望打破信息壁垒，实现大健康产业链各环节的无缝连接——“连接”是重要的关键词。


    这种平台式的打法与腾讯的“基因”不无关系，其核心的竞争力在社交，围绕社交平台的用户、关系链、平台优势，在大健康产业链上有丰富的应用场景。聚焦“人”这个核心因素，就能找到“连接”的商业价值，而医生社区、医疗AI、处方共享平台都是为连接服务的工具。


    将腾讯在境内外的医疗布局结合起来看，其实并不能判断腾讯有“西为中用”或复制海外创新模式到国内的意图。本质上，腾讯已经变成一个“投行”，其思维在于发现优质的商业模式和公司——无论是在国内还是国外。这一条对于百度和阿里巴巴来说依然成立，投资的驱动因素在于“价值”，至于能否与国内业务产生联动，则更多的是一种偶然。反过来看，即使投资折戟，以BAT的体量，数笔初创公司的投资也不能动其筋骨。


    应该明晰的是，医疗领域的创新好比“骆驼的长征”，很难在短期内做到颠覆，互联网与医疗尤其如此。BAT以平台化的方式切入，实际上是一个不断“试错”的过程，通过不断的“合纵连横”，才能找到优质的、被市场确切接受的创新模式，最终融入原有业务体系，带来持续成长的驱动力。


