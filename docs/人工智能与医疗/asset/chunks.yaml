    IBM Watson肿瘤治疗（IBM Watson for Oncology）已经能提供肺癌、乳腺癌、结肠癌和直肠癌解决方案。除此之外，IBM还与制药巨头辉瑞合作，辉瑞将在沃森药物发现（Watson
