    ## 2.9 基因测试

    近年来，基因领域的发展已经进入快车道，基因检测技术得到不断发展和完善，落地应用多点开花，检测价格不断下降，基因检测趋向大众化，海量基因数据的获得已不再是制约。


    图 2-45 所示为基因技术发展简史时间轴。


    ![](img/60e2e9c44939346eec6860270e2f1f96.jpg)


    图 2-45 基因技术发展简史时间轴


    20 世纪 80 年代兴起的聚合酶链式反应（PCR）、荧光定量 PCR、一代基因测序技术和基因芯片技术奠定了基因检测和研究的基础。第一台高通量基因测序技术（NGS）测序仪是在
    2005 年出现的，454 生命科学公司推出了第一个焦磷酸测序原理的高通量基因组测序系统（Genome Sequencer 20 System），正式开启了第二代基因检测技术高通量基因测序技术的历史进程。


    仅仅过了 10 年多的时间，技术已经日趋成熟，检测成本也大大降低（图 2-46）。现在单个基因组的检测成本已经降到 1000 美元以下，并且正在逼近 100
    美元的时代。从成本和实验流程来说，NGS 技术已经成为很多实验室和医院触手可及的基因检测工具。


    ![](img/2ca022472bfe587a030c30e2ac3dddcf.jpg)


    图 2-46 基因测序的成本变化趋势


    新一代测序技术检测产生了海量的数据，并且还在以指数级速度增长。如果把基因记录的信息看作一维的（如疾病表型和测序得到的基因序列），那么这些数据间的关系便是二维的、多维的，数据间可能存在关系的信息量又比一维的数据本身高许多个数量级。


    在聚合酶链式反应和一代测序技术时代，每次检测能产生的数据量有限，结果判读和分析较为简单。随着检测技术的发展，对基因检测数据的判读也有了新的变化，目前对 NGS
    得到的基因序列间及基因和表型间关系的分析，主要采用的是基于特定目标的统计学分析和确证法的方式，能发掘出来的信息量相对于基因序列中存在的信息来说非常有限，究其本质，NGS
    生物信息分析中的序列比对和记录本质上还属于比较低层次的运算，在更多意义上是对基因序列进行解码和记录，解读层面还很有限。


    单个人类基因组由约 30 亿个碱基对组成，编码约 23 000 个功能性的基因。要掌握自己的健康状况，必须先对这些基因密码进行剖析，基因检测就在做着这种解码工作。基因检测与精准医疗临床应用最大的制约就在于基因检测的结果过于复杂，人脑难以处理如此多的数据。


    随着数据的不断积累，对数据的准确注释、解读及其如何对临床产生应用价值成为基因产业下一步发展的关键。分析能力和大数据库是遗传解读和咨询的关键，信息的解读与整合成为基因相关企业的核心竞争力。


    ### 1．切入方式

    如何解读基因的奥秘，是当代生命科学界的一大难题；如何通过解读基因大数据，获取与疾病相关的变异，找到致病基因，是基因应用于精准治疗、药物研发、个人健康管理并产生影响的核心环节。基因检测通常包含两个方面：基因测序和基因解读。在基因检测趋向大众化的过程中，其中的基因解读仍然是目前发展需要突破的瓶颈，人工智能便依靠其强大的数据处理能力和学习能力切入基因序列解读的进程中。


    目前，我国卫计委批准用于临床的基因检测项目有 4 类：遗传病诊断、产前筛查与诊断、植入前胚胎遗传学诊断和肿瘤诊断与治疗。这 4 类项目的共同特点是疾病仅与一个或者几个易感基因相关。实际上，除了单基因遗传病之外，其他疾病易感基因的多少，取决于对该疾病的研究程度。


    人类的生命信息承载于基因里，经转录传递到核糖核酸（RNA），再传递到有生物活性的蛋白质，最终由蛋白质实现所有生命活动。在这个过程中存在两个基因变异引发的疾病或基因剪切变异导致的疾病。


    人群中的 DNA 突变（单核苷酸位点变异，SNVs）总数数以亿计，其中突变频率大于 1%的称为 SNPs（单核苷酸多态性），SNPs 大概有 300 万个。要研究疾病与
    SNPs 之间的关系，需要巨大的患者样本量，统计出患者群体与正常人群体 SNPs 之间的差异。根据目前基因检测的思路，是很难对这些人的 SNVs 进行分析的。但是人工智能的到来给这一海量数据集的研究带来了新方式。


    接下来以 Deep Genomics 人工智能参与基因解读的技术手段为例，介绍人工智能在基因解读领域的技术切入点。


    Deep Genomics 主要关注的是基因转录过程中的变异。他们首先建立一个初始基础数学模型；其次将健康人的全基因组序列和 RNA 序列导入，对模型进行训练，让模型学习到健康人的
    RNA 剪切模式；再次通过其他分子生物学方法对训练后的模型进行确认和校正；最后使用目前已知的病例数据，检验模型判断的准确性。


    针对基因变异导致的疾病的研究方法类似。首先进行 DNA 提取、测序，测完序之后进行分析和过滤，过滤完之后使用一些通路分析结果进行筛选，获取关键变异。基于这些变异和基因的信息，把它们的频率和个数进行累加，获得特征数据，然后开始做机器学习。


    ### 2．发展情况

    目前，基因企业都意识到了基因解读的瓶颈，Illumina、华大基因、贝瑞和康等龙头企业已经走在了前列，纷纷将人工智能纳入自己的分析体系。


    其实早在 2014 年时，IBM 就与纽约基因组中心展开了合作，基于 IBM 的沃森人工智能系统开发了一个专门分析肿瘤基因组的程序，称为“沃森基因组分析”。这个团队在患者身上试用了这个程序的β版本，它可以从超过
    2700 万篇生物医学方面的论文中寻找针对特定基因变化的靶向治疗方案。


    IBM 在最近发表在《神经病学遗传学》（Neurology Genetics）杂志上的一篇文章中披露了他们利用人工智能针对脑瘤基因组的研究成果，科研人员从患者身上获取了肿瘤的活检样本及一份血样，并对两份样品中的
    DNA 和肿瘤中的 RNA 进行了测序。


    为了进行比较，这些测序数据被分别送给了 IBM 沃森基因组程序和一个由生物信息学家、肿瘤学家组成的专家团队进行分析。沃森系统仅仅用了 10 分钟就完成了一份可供参考的临床治疗方案报告，而专家组的人工分析花了
    160 个小时才得到一份相似的报告。沃森系统甚至还找到了更多的可能进行靶向治疗的基因突变。


    人工智能在基因解读领域带来了人类不曾拥有的能力，让人类有机会用数字描述生命。相信在不远的将来，这样的场景将会出现：基因检测由专业检测机构完成，结果分析交给人工智能，临床医师只需要最终结论，用这个结论去指导治疗，进行精准的健康管理。


    基因领域的企业融资理由绝大部分是基因技术和生物技术，与人工智能的关联度不大。基因行业本身近年来融资额度大，频率高。所以，在后续章节的人工智能企业融资盘点中没有考虑纳入基因行业表表
    2-23 所示的是人工智能+医疗基因行的投融资情况。


    表 2-23 人工智能+医疗基因行业投融资


