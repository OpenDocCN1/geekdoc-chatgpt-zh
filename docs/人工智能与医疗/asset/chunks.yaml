    ## 2．母婴健康管理

    人工智能在母婴健康领域可以分为两方面，一方面是针对女性受孕前后的数据监测，通常会结合智能硬件或可穿戴设备，对个体的生理症状、情绪状态、睡眠等数据进行监测；另一方面是针对育儿知识的智慧问答，从健康孕育新的生命，到宝宝出生长大，以及个人形体变化、心理情感变化、育儿技能和各种复杂的家庭问题等。


    ### 企业案例


    ### Ovia Health

    Ovuline 成立于 2012 年 6 月，后改名为 Ovia Health。Ovia Health 开发的产品 Ovia Fertility 和 Ovia
    Pregnancy 通过健康跟踪设备，收集与女性受孕和怀孕相关的各种数据。


    ### 产品介绍

    Ovia Fertility 是一款基于数据分析的智能孕期预测产品，它允许手动输入与女性受孕相关的各种数据，如基础体温、子宫颈液分析、排卵测试结果、生理症状、情绪状况，以及睡眠、体重、营养摄入和日常活动等因素。基于计算机算法的数据分析，来精准预测女性的排卵期，从而提高女性受孕率。同时，它也支持像
    FitBit 这样的自助量化设备自动收集数据，如睡眠周期等。


    Ovia Pregnancy 是 Ovia Health 公司为成功受孕的用户开发的一款孕期追踪应用，它同样可以整合 FitBit 等自助量化设备来监测用户的健康指数，如血压、日常活动情况等，帮助孕妇健康地度过这段非常时期。


    Ovia Parenting 是 Ovia Health 公司为刚刚成为父母的用户开发的个性化服务产品，它能够帮助这些父母追踪和记录宝宝的健康成长情况，在呵护宝宝的同时，帮助用户记录那些难忘的美好瞬间。


    ### 应用情况

    Ovia Health 作为一家健康管理及拥有健康大数据的公司，正扩大其面向企业端（ToB）的业务范围。目前，其 B 端企业用户包括了医疗保险公司 Blue
    Cross Blue Shield of Massachusetts、通用电气、保健服务公司 Optum 等。


    ### 妈 妈 帮

    妈妈帮前身为丫丫网，已根植母婴产业 14 年，2011 年正式从 PC 端转阵移动端。妈妈帮是以知识和交流为核心，通过个性化服务、专业工具等建立核心优势的专业、可信赖的移动母婴生活服务平台，现已成为众多中国母婴人群获取知识、答疑解惑、社群交流，乃至健康问题求助、购物推荐、同龄伙伴聚会等需求的集中解决平台。


    产检报告解读是妈妈帮的一个在线对妈妈的报告数据进行获取和分析的功能，涉及图像识别技术。运用产检报告解读功能，用户拍一张照片并上传，3 分钟后系统即可做完图像数据化处理，妈妈可以看到所有的专业名词解释、数据指标解读。


    虚拟机器人通过数据的积累可以了解这个用户是谁，有什么差异化的需求，从而帮助妈妈群体发现更好的内容，给予非常精准的服务。


    ## 3．慢性病健康管理

    在我国，每年以心血管疾病和糖尿病为首的慢性病，占据了所有死亡人数的 85%，且慢性病在我国疾病负担中所占比例超过 70%，造成了极大的经济负担。对于慢性病患者来说，虽然药物治疗可以在一定程度上减轻疾病症状、延缓疾病发展，但更为重要的是，应该改变自身不健康的生活习惯，对饮食、运动、作息进行合理规划和控制。随着科学技术的发展，患者的慢性病管理从纯线下的医患交流逐步演化出线上、线下结合的新慢性病管理模式。


    ### 企业案例


    ### Virta Health

    Virta Health 是由从事营养化学 40 多年，加州大学戴维斯分校医学院的教授 Stephen Phinney 博士和俄亥俄州立大学的教授 Jeff
    Volek 共同创办的一个互联网慢性病管理平台。Virta Health 有两大优势：Virta 的技术平台运用了 AI 技术，在其医生和健康咨询师团队的辅助下，提供连续和实时的医疗支持；Virta
    针对患者提出精准的饮食方案，为患者设计出个性化的碳水化合物摄入和饮食方案。


    ### 产品介绍

    当患者注册成为 Virta Health 的会员后，它会寄给患者一套经过 FDA 认证的医疗设备，用于每日血糖、血压和体重等身体指标的监测。在监测完成后，医生根据当天的各项数据，通过人工智能的计算给患者制定出个性化的饮食方案。


    Virta Health 还设立了健康教练的职位，向患者提供一对一的咨询服务。如果是在非工作时间，语音机器人可以给患者回答一些答案标准度高的医学问题。此外，患者可以选择加入在线社区，与其他病友分享治疗心得，互相激励。图
    2-43 所示为 Virta Health 参与慢性病管理的方式。


    ![](img/2a2f38652fe1a9376e6296b3cc69bd94.jpg)


    图 2-43 Virta Health 参与慢性病管理的方式


    ### 应用情况

    在 Virta Health 与印第安纳大学医学院于 2016 年针对 262 位 2 型糖尿病患者展开的为期两年的试验中，前 10 周就已经取得了令人振奋的治疗效果。87%的患者减少了胰岛素的注射量，56%的患者糖化血红蛋白含量降至健康水平，75%的患者体重至少减少
    5%。这些成果已经刊登在知名的医疗杂志 Journal ofMedical Internet Research 上。


    ### 盈利模式

    企业用户在签约后需要按人数提前支付一笔年费。如果在一年的治疗期结束时，患有 2 型糖尿病的会员在各项指标上没有达到健康标准，Virta Health 会全额退款。


    对于个人来说，Virta Health 提供了两种付费方式：①第一年收费 4500 美元，从第二年开始每年收费 2250 美元；②第一年收取 500 美元的定金，每月收费
    370 美元，第二年开始每月收费 199 美元。


    图 2-44 所示为其盈利模式。


    ![](img/9163f3053006605e2142176b23c5c251.jpg)


    图 2-44 人工智能参与糖尿病慢性病管理的盈利模式


    ### 公司介绍


    ### 糖 护 士

    北京糖护科技有限公司，2013 年 7 月成立于北京。首创“App+设备+服务”模式，依托先进的智能医疗设备、应用软件、健康服务及基于大数据构建的人机智能决策支持系统，为糖尿病患者及高危人群提供全方位的糖尿病管理综合解决方案，帮助患者提高自我管理的意愿和能力，提高血糖达标率、降低并发症发生率及后续医疗成本。


    ### 产品介绍

    糖护士利用“数据采集设备+智能决策”的模式，为患者及产业链提供个人服务、企业服务及专业服务。在掌握了大量的数据后，糖护士进行了决策支持系统的开发，通过智能决策支持系统（IDSS），为用户提供自动化的、实时的、个性化的健康和健康管理建议，以及正确的行为路径。


    糖护士根据《美国糖尿病指南》和《中国 2 型糖尿病指南》，形成专家库和知识库，导入 1000 多万条数据，聘请了 700 名医生进行数据和结论的解读，形成了
    1 万多个糖尿病真实场景。现在，只要患者的监测数据出来，他就可以得到实时的、个性化的专业互动和反馈，从而提高患者的依从性。


    ### 应用情况

    糖护士截取了 2015 年 11 月到 2016 年 1 月约 30 万名用户的 268 万条血糖数据。这些数据显示，糖护士用户的血糖达标率是 69%，显著高于中国
    2 型糖尿病患者血糖达标率 39.7%，表征并发症发生率大幅降低。使用糖护士 1 年以上的患者相比使用半个月的患者，血糖达标率高出 12%。


    ## 4．精神健康管理

    据世界卫生组织估计，心理障碍疾病占全球疾病总量的 13%，目前全球几乎每 10 人中便有 1 人患有心理疾病，其中 17 人中有 1 人忍受着严重的心理障碍，这导致自杀成为人类死亡的第二大原因，每年有超过
    80 万人死于自杀。越来越多的创业公司关注到心理疾病管理这一块。


    ### 企业案例


    ### Ginger.io

    Ginger.io 成立于 2011 年，它创造性地提供了一个分析平台，能判断用户是否处于非正常的心理状态，是否应该进行适当的心理治疗。虽然每 10 个人中就有
    1 个人患有心理疾病，大多数人对自己患有心理疾病是毫无察觉的。通过在合适的时间给予合适的帮助，心理疾病是可以治愈的。Ginger.io 就是这样一个神奇的应用，通过大数据分析帮助用户早发现、早治疗心理疾病。


    ### 产品介绍

    Ginger.io 能够通过深入分析数据，了解用户的心理状况。通过 Ginger.io，用户也能得到无微不至的医师帮助，因为每个人都会有自己固定的手机使用习惯，一旦日常的行为习惯突然改变，负责的临床医疗团队就会接收到异常预警，做好应急准备，避免意外发生。


    Ginger.io 通过观察用户活动的时间，和多少人通话，通过向用户询问几个简单的问题，以明白用户身体传达的信息。当情况发生改变时，Ginger.io 会报告给身边的至亲好友，如家人、朋友、医生等。


    Ginger.io 是一个以迹象为基础，数据为驱动，需求为核心的应用软件，其优势在于以下几个方面。


    （1）更容易获取数据。智能手机的加入使得医师更容易收集患者的信息，得到患者对测试的反馈结果。


    （2）自动展开分析过程。通过面向医师的网页图表，Ginger.io 的行为分析引擎能够帮助医师更好地理解患者生理、心理状态的变化。


    （3）更加迅速地对患者提供帮助。当患者的分析结果显示处于情绪低谷，行为模式发生改变或缺少及时回馈时，Ginger.io 会立刻通知医师提供帮助。


