    ## 5.3 人工智能顶级专家引领深度学习的发展


    关于机器学习的研究最早可以追溯到 20 世纪 50 年代，也就是人工智能刚刚兴起的时候。当时流行的是“联结主义”（Connectionism），代表性工作是感知器（Perceptron）。这也是现在大热的深度学习
    （Deep Learning） 的前身。不过，麻省理工学院计算机科学研究的奠基人马文·明斯基出版的《感知器》一书给当时正热的神经网络研究当头一棒。他在书中指出，浅层网络无法解决异或这一非线性逻辑关系，深层网络的训练方法仍然是一个棘手的问题。这一论断使几乎全球的科研人员停止了对神经网络的研究。


    1983 年，加州理工大学的物理学家约翰·霍普菲尔德（John Hopfield）利用神经网络，在著名的 NP 完全问题——旅行商问题上取得当时最好的结果，使人们开始重新关注这一领域。之后，来自加州大学圣迭戈分校的大卫·鲁姆哈特（David
    Rumelhart）重新改进了 BP 算法^(\[1\])，使得深层网络的训练成为可能，掀起了神经网络研究的第二次高潮。不过，人们也意识到，尽管神经网络具有强大的泛化学习能力，但是其参数的设置缺乏理论指导，很多工作只能靠手工调参得到结论，于是人们开始期待能在理论上给予机器学习技术更多的支持，但人工智能算法的发展经历了一个漫长的时期，如图
    5-18 所示。


    ![](img/cec1d02ba9e20421d23fb258f644d313.jpg)

    图 5-18 人工智能算法的发展


    20 世纪 90 年代中期，统计学习 （Statistical Learning） 走上主流舞台，代表工作是支持向量机（Support Vector Machine，SVM）
    和核方法 （Kernel Trick）。


    这一学派主要以统计学理论作为支撑。除了 SVM 外，贝叶斯网络 （Bayesian Network）、最大期望算法 （Expectation-Maximization
    algorithm，EM）也是统计学习中非常著名的方法。它们的提出者是美国加州伯克利分校的迈克利·乔丹（MichaelI Jordan），他是改进 BP 算法的大卫·鲁姆哈特的博士生。迈克利的门下出了很多知名人士，如前百度人工智能实验室主任、大型在线学习平台
    Coursera^(\[2\])的联合创办人、斯坦福大学计算机科学系和电子工程系副教授吴恩达（Andrew Ng）及卡耐基梅隆大学的邢波教授。


    进入 21 世纪以来，随着现实世界可以记录的数据量迅速增长，硬件设备的计算能力显著增强，联结主义卷土重来，以深度学习的名义重新焕发光彩。这得益于大数据和强大的计算能力，深度学习网络在语音、图像、文本等领域取得了巨大的成功，表现出了比以往模型更加优越的性能。


    这一领域的代表人物有三位：多伦多大学的杰弗里·辛顿（Jeoffrey Hinton）、纽约大学的延恩·勒昆（Yann LeCun）和蒙特利尔大学的约书亚·本吉奥（Yoshua
    Bengio）。他们 3 个联手于 2015 年在《自然》科学杂志上发表长文，向人们科普了这一正给我们的生活带来深远影响的技术。


    他们是新一轮神经网络复兴的发起者，联手解决了深度网络训练中预训练和初始化参数的问题，还发明了自编码器、深度信念网络等多种网络结构，并且他们本身关系也很好（图
    5-19）。


    ![](img/5dbc042964d38956c57d750ebc06ee79.jpg)

    图 5-19 人工智能主要“大牛”人物关系


    其中，杰弗里·辛顿（Jeoffrey Hinton）是延恩·勒昆（Yann Lecun）的博士后导师，迈克利·乔丹（MichaelI Jordan）是约书亚·本吉奥（Yoshua
    Bengio）和吴恩达（Andrew Ng）的博士后导师。同时，约书亚·本吉奥（Yoshua Bengio）和延恩·勒昆（Yann Lecun）共同在 AT&T
    的贝尔实验室工作过。近年来，大热的神经网络模型“生成对抗网络 （Generative Adversarial Net）”的作者，来自谷歌的克里泽夫斯基（Alex
    Krizhevsky）是延恩·勒昆（Yann Lecun）的学生。


    \[1\] BP 算法：BP 即 Error Back Propagation 的缩写，BP 算法即误差反向传播算法。


    \[2\] Coursera：大型公开在线课程项目，由美国斯坦福大学两名计算机科学教授创办。旨在同世界顶尖大学合作，在线提供免费的网络公开课程。Coursera
    的首批合作院校包括斯坦福大学、密歇根大学、普林斯顿大学、宾夕法尼亚大学等美国名校。


    ## 5.4 国内人工智能医疗企业人才


    2017 年 7 月 6 日，领英发布《全球 AI 领域人才报告》，中国人工智能领域专业技术人才总数超过 5 万人，排名全球第 7 位，印度、英国、加拿大和澳大利亚分列
    2～5 位。而美国有超过 85 万名的 AI 人才。


    动脉网蛋壳研究院收集了我国 11 所高校和中科院 4 所研究所（计算机所、声学所、软件所、自动化所）共 15 家单位的 AI 专家和硕博人才，发现其中有数据统计的
    9 所高校和中科院在读的 AI 硕博人才总和为 2300 多人。


    在医学领域，动脉网发现 47 名医疗人工智能创业公司的 CTO 或首席科学家，其中有 30 名都曾在国外或我国的香港、台湾地区进修过，占比达 63.8%，而与医学专业相关的人才仅有
    7 人，占比达 14.9%^(\[1\])。


    在机器学习、计算机视觉、自然语言处理、语音识别和模式识别五大研究方向中，模式识别的专家最多，占比达 30%，语音识别的专家占比仅为 4%，且多数来自中科院声学所和哈尔滨工业大学。模式识别可以简单理解为机器学习，在深度学习、机器学习没出现之前，在大学从事人工智能研究的专业称为模式识别。


    ### 5.4.1 15 个单位人工智能研究领域专家盘点


    动脉网蛋壳研究院盘点了 15 个单位（含中科院计算机所、声学所、软件所、自动化所）73 名专家的研究领域和所在实验室的硕士、博士人数，希望可以得出中国未来
    3 年产出的 AI 人才的专业和大致数量，具体情况如表 5-6 所示。


    表 5-6 人工智能研究领域 15 个单位专家盘点（截至 2017 年 9 月）


    ![](img/ded4f7416d2934adb5c10d4bb04c6d98.jpg)

    续表


    ![](img/4c7ef113d5b76683c6280ee8bb2dd940.jpg)

    续表


    ![](img/cd69323f86916f5679ca174c9363e45b.jpg)

    续表


    ![](img/fe0dd7429d758c2ccf8d2c5913ca40f2.jpg)


    各个单位的实验室中，中科院、哈尔滨工业大学、清华大学在读的硕士、博士数量最多，这十几个学校在读的硕博人才加起来有 2300 多人。除了列举的这些高校以外，还有一些学校也拥有与人工智能研究领域相关的专家和硕士博士人才，如中国科技大学、电子科大、武汉大学、中山大学、同济大学、上海财经大学等，此次未加入统计范围内。


    中科院是中国输出高端 AI 人才最多的机构之一。中科院与人工智能相关的研究所有计算机所、软件所、声学所、自动化所，这 4 个研究所中可查到的在读 AI 硕博人才为
    709 人。国内著名的 AI 语言识别专家田捷、计算机视觉专家吴恩华、机器学习专家常虹、刘成林等都在中科院从事行业研究。


    这里尤其要提一下中科院声学所。目前，声学所共有在读研究生 465 人（其中硕士生 234 人、博士生 231 人）、在站博士后 25 人。这里是中国智能语音人才的摇篮，大多数高端人才都出自这里。


    在人工智能医疗行业领域，Big Vision 创始人陈建新、中科汇能 CTO 车浩、云知声 CTO 梁家恩都是从中科院毕业的，后两位均来自中科院声学所。


    哈尔滨工业大学计算机科学与技术学院有 15 个研究中心，其中有硕士生 370 人、博士生 308 人。虽然无法查到与人工智能相关专业的在读硕士、博士的具体人数，但这些研究中心大部分与人工智能有关。


