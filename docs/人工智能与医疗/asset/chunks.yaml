    从 BAT 2017 年的投资数据可看出 3 家企业发展战略的不同。其中，百度以技术起家，以技术立身，近年更是宣布“All in AI”，也希望以投资来获得该领域的前沿技术，为后续发展打基础；阿里巴巴以电商起家，业务重心在消费领域，近年来主打“大文娱”和“新零售”，在海外的投资也延续了这一思路；腾讯发展的核心词是“连接”，包括人与人的连接、人与信息的连接、企业主和消费者的连接。


    腾讯“开放”战略实施之后，多以投资合作或提供流量入口的方式来追逐“风口”。所以腾讯触角最广，布局的赛道也最多。


