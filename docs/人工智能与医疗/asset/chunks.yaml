    ### 3.3.2 投资并购

    微软早在1999年5月就曾对健康信息网站WebMD投资2.5亿美元，开始通过并购进入医疗健康领域。

    2006年，微软表示，根据与非服务医疗机构MedStar Health新的合作协议，微软将收购后者旗下华盛顿医疗中心（Washington Hospital
    Center）开发的医疗数据库软件Azyxxi，收购完成后，将把Azyxxi投放到全球医疗市场，这也是微软首次进入医疗信息技术领域。

    2007年，微软当时的CEO Steve Ballmer在新奥尔良举行的与医疗保健信息有关的会议上宣布，微软将收购健康信息搜索引擎Medstory公司。

    2009年，微软又宣布将收购专注于医疗保健行业的软件厂商Sentillion，并计划将Sentillion的产品与微软的Amalga UIS系统结合在一起，让医护行业的专业人士更容易获得各种IT应用程序和患者资料，从而为患者提供更好的医疗服务。


    ### 3.3.3 智能可穿戴设备

    对于智能可穿戴设备这片“沃土”，微软自然不会放过。动脉网此前也介绍过，微软曾研发了针对盲人用户的采用3D音景技术的骨传导耳机，以及为盲人和弱视群体打造的一款名为
    Alice Band 的腕带。而在可穿戴设备市场最火的手环和眼镜领域，微软也在2017年和2018年陆续发布了Microsoft Band智能手环和HoloLens全息眼镜这两款最具代表性的产品。


    #### 1．产品1：Microsoft Band

    随着智能手环和智能手表越炒越热，2017年10月底，微软发布了自己的智能手环产品Microsoft Band。这款手环配置了10个智能传感器，可以让用户24小时佩戴，实时监测用户的睡眠及锻炼时的心率、燃烧的卡路里等数据，并且与知名的健身房合作，可以为用户提供合理的健身计划，帮助用户达成自己的健身目标。此外，该手环还能通过日历通知及邮件预览功能让用户对自己的健康指数一目了然，并能通过Cortana语音助理进行笔记记录及日程提醒等。不过可穿戴产品销量惨淡，评价也不尽如人意。


    #### 2．产品2：Emma Watch

    Emma Watch是一种可穿戴式设备，最初是为了帮助图形设计师、帕金森患者艾玛·劳顿缓解震颤带来的不便。这款名为“Emma”的智能手表通过发出震动信号来抵消大脑神经发出的震颤信息，破坏脑部与手部的反馈环路，以缓解患者的静止性震颤。微软研究小组正在进一步测试该产品对其他帕金森患者是否有效，并探索其他非侵入性可穿戴设备的可行性。


    #### 3．产品3：FReAD

    其他研究阶段的可穿戴设备还包括FReAD，这是一款以视障人士为服务群体的产品，在用户日常物体的触觉操作过程中为其提供音频辅助。

    在互操作性和用户体验方面，可穿戴设备本身有一定的局限性，大部分用户不愿意佩戴诸多设备。要培养出这样的用户习惯，各大企业还有很长的路要走。


    #### 4．产品4：HoloLens

    谷歌暂停了自己的Google Glass项目，但微软却在2017年发布了自己的智能眼镜产品HoloLens。从各方面看，这款带有黑科技属性的产品都像是Google
    Glass的升级版。而事实上，HoloLens是一款带有现实增强功能的全息眼镜。与那些虚拟现实的智能眼镜完全为用户制造一个虚拟的世界不同，HoloLens则是增强了用户与现实的交互。

    与三星之前发布的虚拟现实眼镜需要结合手机使用不同，HoloLens是一台完全独立的计算机，内置了CPU、GPU和一个专门的全息处理器。这款头戴式的智能眼镜在黑色的镜片上配备了透明的显示屏，并且还拥有立体音效系统，让用户不仅可以看到，还可以听到周围全息景象中的声音。HoloLens还能跟踪人的眼部和手部的活动，并根据这些活动做出智能的反应。


    ### 3.3.4 微软的医疗布局


    #### 1．HealthVault：微软医疗生态地基

    自2007年开始，微软便启动了个人健康记录中心HealthVault。这一平台相当于全世界联网的医疗系统，起初的作用是用于医院和医生之间共享患者的医药信息，以提升看病效率。

    如今HealthVault是一个基于云的平台，旨在让人们控制其健康数据，帮助人们收集、储存和分享自身的医疗信息，且该平台可与各种第三方应用程序和设备连接，帮助人们管理健身、饮食和健康数据。

    但是这个平台的界面常被人诟病，因为它的用户体验不够好，但它比其他平台更注重用户的个人隐私信息。此外，这是一个极其开放的平台，任何人都可以构建相应程序连接至HealthVault，它拥有同Windows、Java、iOS、Android等众多平台交换数据的互操作性。


    #### 2． Microsoft Genomics：精准医疗的哨站

    比尔·盖茨曾具体地指出：“下一个能真正超过我的世界首富，一定来自基因领域。”这一预言很有可能成为现实。

    现在，测序人类基因组的成本从10年前的数百万美元急剧下降到大约1000美元，低廉的成本支持研究部门进行大规模测序计划，并将其用于临床研究。基因组测序的急剧扩展对数据存储和计算能力提出了极大的考验，储存每个基因组需要约60GB的储存空间，通常需要大约1000个CPU时间^(\[1\])来处理。

    Microsoft Azure可以满足这种需求，为基因存储提供可靠、安全的全球云储存服务。Microsoft Azure上的Microsoft Genomics服务提供了一种易于使用的Web服务，用于分析比较用户的基因组，这一服务比传统手段快数千倍。该服务遵循麻省理工学院和哈佛大学Broad研究所确定的一致性和准确性准则。Microsoft
    Genomics服务迅速、简单、准确的特性可以使其广泛应用于癌症、罕见疾病，以及大健康和精准医疗领域。


    #### 3．AI驱动的智能聊天机器人

    Health Bot旨在帮助医疗健康合作伙伴轻松提供智能且合规的医疗虚拟助理和聊天服务。例如，保险公司可以安置机器人，使客户能够轻松查询索赔状态并提出相应的问题；医院可以配备机器人，用症状检查器对患者病况进行分类，对患者的问题进行解答，并帮助患者查找距离最近的医生。


    #### 4．Project InnerEye

    Project InnerEye开发了特定的机器学习技术，用于自动描绘肿瘤及3D放射影像，其合作方包括泰锐影像和Intuitive Surgical，具体功能包括：为定量放射学提取靶向放射组学测量数据，高效地规划放射治疗计划，提供精准的手术计划及导航系统。

    InnerEye项目建立在多年的计算机视觉和机器学习研究之上，它采用Deep Decision Forests（已在Kinect和Hololens中使用）及卷积神经网络（如在CNTK中可用）的算法进行医学图像的自动分析。该技术旨在为医生提供帮助。机器学习的结果可以由临床医生轻易地完善和调整，直到临床医生认为该运算结果是有效的。整个过程中，医生始终保持对结果的完全控制。


    #### 5．Microsoft Health云服务平台

    在Microsoft Band发布的同时，还有微软自己的健康管理平台Microsoft Health。与苹果、Google类似，Microsoft Health云服务平台的做法也是向消费者提供行业存储、整合保健与健身数据等功能。消费者可通过Microsoft
    Health App来访问Microsoft Health，微软同时提供了 Android、iOS 及 Windows Phone 版本供用户下载。

    Microsoft Health可以把从不同的健康和健身设备中收集的数据进行整合，并安全地存储在云端。用户也可以把已经存储在微软健康平台云端的数据与自己在不同的设备中获取的数据进行对比分析，如步数、卡路里、心率等，并通过微软的“智慧引擎”（Intelligence
    Engine）得出有价值的结论，如怎么锻炼能够燃烧最多的卡路里，基于锻炼强度推荐合理的恢复时间，推荐有效的睡眠时间等。此外，用户还可以把锻炼信息和时间、位置等结合，根据用户上传的身体和健康数据，Microsoft
    Health平台中的“智慧引擎”就可以为用户制订出合理的锻炼计划，并给出日常的生活建议，如吃早餐是否可以让你跑得更快、白天参加会议的多少是否会影响睡眠质量等。

