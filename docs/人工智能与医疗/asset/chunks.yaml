    ## 5.2.3 人工智能与医疗投资机构盘点


    国内和国外都没有出现大量布局在人工智能医疗领域的投资机构，造成这种情况的原因有两个方面：一是人工智能与医疗是近几年才逐渐成为投资者关注的话题，行业内的优质投资标的并不多；二是人工智能医疗企业的融资金额普遍较高，但由于医疗行业固有的严谨性和人工智能技术的不确定性，致使商业化进程相对缓慢，因此投资风险较高。


    在所有涉足人工智能与医疗领域的投资机构中，国内和国外各有5家布局相对较多的投资机构，如表5-4和表5-5所示，但是它们投资的企业数量和细分领域都有限，市场上尚未出现在全行业进行整体布局的投资机构。


