    ## 6.6 脑医生：利用 AI 技术进行阿尔茨海默病的筛查和诊断


    阿尔茨海默病（俗称老年痴呆症）作为一种常见的、原因未明的神经系统退行性疾病，已经严重影响了现代社会中老年人的身心健康。它的临床表现为认知和记忆功能不断退化，日常生活能力进行性减退，并伴随各种精神症状和行为障碍。


    国际老年痴呆协会发布的数据显示：2013 年，全球老年痴呆人数为 4400 万元，其中 50%～75%为阿尔茨海默病患者。2015 年，全球新增 990 万名痴呆患者，平均每
    3 秒新增 1 人。在全球范围内，2015 年护理老年痴呆产生的总费用预计为 8180 亿美元，与 2010 年相比，增加了 2140 亿美元。


    目前，中国阿尔茨海默病患者人数已居世界第一。2014 年的调查数据显示，中国有 90%的阿尔茨海默病患者未经过诊断治疗。


    虽然目前没有方法可以在疾病晚期阶段阻止该疾病的恶化，但有证据表明，如果疾病发现得早，阿尔茨海默病是可以通过药物治疗和控制的，能够帮助患者改善认知功能、延缓临床病程
    10～15 年。


    发达国家中每位阿尔茨海默病患者平均每年耗用 33000 美元。早期的诊断和诊断介入，可使患者显著延后入住看护机构，平均每年可净节省 10000 美元的费用。


    目前，国内各大医院的神经内科、精神科、老年科的记忆障碍门诊均可对阿尔茨海默病进行诊断。其中，常规诊断程序包括病史回顾、体格检查、痴呆筛查测试（量表评估）、脑神经系统检查及实验室检查（如血生化及
    CT、MRI、PET/SPECT 等脑部扫描检查）等。这些方法对疾病的诊断有作用，但前提是需要有经验的医生，而且这些方法并不适用于大规模的早期筛查。


    面对这种现状，王思伦博士创办了铱硙医疗科技有限公司（主打产品脑医生智能诊断云平台系统），利用 AI 技术进行阿尔茨海默病的早期筛查和诊断。目前，已经在多家三甲医院进行临床试用，准确率达到
    85%。其回国几个月就完成了数百万美元的天使轮融资，由道彤清辉领投，艾瑞资本和上海圣习跟投。脑医生是如何做到的呢？


    ### 6.6.1 将医生的经验“数字化”


    在现在的医疗机构中，医生获取患者的 MRI 图像（图 6-13）后，往往是根据经验判断患者的大脑是否萎缩。因为通过经验判断差异化很大，所以漏诊的现象时常出现。


    ![](img/ee84ac295fc0a516a20fc59e556834d1.jpg)


    图 6-13 医生诊断用的 MRI 图像


    脑医生的云平台工作流程为：医生将受试者的数据上传，脑医生通过图像处理、大数据运算和统计学分析等方法，将医生的经验量化、标准化，最后得到精确的诊断报告。


    如图 6-14 所示，红色的区域是大脑皮层灰质，这个区域的萎缩是阿尔茨海默病患者重要的早期诊断指标。脑医生系统通过自动标注受试者大脑重要结构的体积，将其与正常指标做对比，就可以对受试者的情况做出判断。


    ![](img/36ff966b7f45aa6d018745712a3336ae.jpg)


    图 6-14 脑医生系统标注的图像


    王思伦博士表示，现阶段脑医生最后给出的诊断报告就像我们感冒时的血常规化验单：白细胞总数 12.2（正常 5～12），中性粒细胞总数 8.6（正常 2～7.8），淋巴细胞比例
    17.9（正常 20～40）。该诊断报告包含大脑重要结构的数据，包括脑灰质和脑白质体积、海马结构及全脑 45 个重要分区的指标。医生一眼就可以看明白，并给出结论。拿到国家食品药品监督管理总局认证以后，脑医生会推出带有结论的诊断报告，供医生参考。


    使用过的医生反馈，脑医生系统主要有以下 3 个优势。


    第一，人性化的系统设置，操作简单。这与王思伦博士多年的从医经验有关，他希望医生用产品时感到舒服，能够最大限度地减轻医生的工作量。


    第二，数据清晰、全面。脑医生系统得出的数据对中枢神经系统疾病，如阿尔茨海默病，帕金森综合征、癫痫、多发性硬化、脑损伤等都有重要的参考意义。多数据的呈现可以帮助医生做全面的诊断，使放射科和神经内科的诊断更具有针对性和科学性。


    第三，科研上的帮助。由于计算量和数据的限制，临床医生在开展脑科学研究时常常受限于计算机操作和数据的分析，脑医生提供一站式平台，非常适用于标准数据的采集和案例整理，为临床研究提供帮助。


    ### 6.6.2 医学 AI 需要多学科交叉合作


    脑医生项目诞生于 2016 年 9 月。王思伦博士从中山医科大学本科毕业以后，在北京大学附属医院放射科工作了 3 年，后来考取了香港大学放射学系的研究生和博士，之后在约翰·霍普金斯大学医学院（The
    Johns Hopkins University）做博士后研究，在爱默里大学（Emory University）做高级研究员。


    从硕士开始，王思伦博士就一直从事中枢神经系统影像学、分子影像学及肿瘤影像学的研究。2013 年，王思伦博士获得国际核磁共振协会的“青年院士”，2014 年获得北美放射学会分子影像学优秀研究奖，并荣获约翰·霍普金斯大学最佳研究奖。


    为了此次创业，王思伦博士准备了将近两年的时间。在这两年的时间里，人工智能的深度学习技术得到了快速的发展，这为医学影像的智能处理奠定了基础，并开辟了未来医学的新方向。另外，在美国工作的
    10 年时间里，他也看到了该病症对社会的影响，以及美国为预防和缓解阿尔茨海默病所做的巨大努力。


    在调查阶段，他意识到中国老龄化加剧带来的巨大市场，以及中美两国在阿尔茨海默病防治方面的差距。由于国内还没有这方面的创业公司，于是他下决心创办脑医生项目。


    目前，脑医生项目充分利用其国际化背景，大力整合国际和国内资源。其核心 AI 技术团队在海外有着丰富的数据处理、模型建立及算法开发的经验，其国内团队熟悉中国市场的运作和推广。王思伦博士表示：“只有充分整合国内和国际资源，大力推进研发和落地，才能真正实现商业方面的成功。”


    除了 AI 技术人才的搭建，王思伦博士还组建了一批由医生、IT、云计算、统计学、大数据等领域专家组成的团队。他们大多数毕业于国内外著名高校，如麻省理工学院、牛津大学、加州大学伯克利分校、斯坦福大学等。在他看来，医学
    AI 是一个多学科交叉的领域，需要多个行业的专家共同参与，才能把事情做好。


    ### 6.6.3 MRI 图像的最优选择


    在现实的临床中，CT、MRI、PET/SPECT 等各种影像都可以用来诊断老年痴呆症。通过比较，脑医生首先选择了 MRI 图像作为突破口。


    王思伦博士表示：“ MRI 图像有很多优势：第一，在获取 MRI 图像时对人体没有放射性损伤。第二，MRI 的结构性扫描在临床应用广泛，非常容易获得。第三，获取成本低、时间短。通常情况下，患者拍
    MRI 图像的成本在几百元左右，相比于 PET/CT，成本要低很多；另外，拍摄时间短，不会对临床工作带来很多干扰。”因此，美国放射科学会也推荐 MRI 图像作为诊断阿尔茨海默病的最佳影像学方式。


    脑医生的数据库准确来说有两个：一个是基于正常人群的人脑灰质体积、皮层厚度、白质体积和海马结构数据库；另一个是基于阿尔茨海默病患者的人脑灰质体积、皮层厚度、白质体积和海马结构数据库。王思伦博士团队就是利用这两个数据库来训练人工智能模型的。


    ### 6.6.4 清晰的用户模式


    在商业方面，王思伦博士表示，公司预计可以在 2019 年拿到国家食品药品监督管理总局的认证。在此之前，公司将和 5～8 家重要的地区性三甲医院进行合作，落实用户模式、收费模式和推广模式。


    此外脑医生也将与药企合作。目前，中国正在研发的神经退行性疾病药物有 100 多种，脑医生会和药企进行广泛合作，并成为标准化的检测手段。


    另外，脑医生项目具有广泛的临床应用性和重要的临床意义，非常适用于开展大规模阿尔茨海默病的人群筛查。


    在融资方面，脑医生已经获得了数百万美元的天使轮融资，2018 年 5 月，获得海尔资本的数千万元 Pre-A 融资。


    ### 6.6.5 国际上的其他研究团队


    除了中国，在国际上也有其他的研究团队在做这样的事情。


    2018 年 6 月，韩国高科技科学院（Korea Advanced Institute of Science and Technology）和天安（Cheonan，韩国地名）公共卫生中心的科学家们通过深度学习开发出一项技术，
    能以超过 84%的准确度识别未来 3 年可能发展成为阿尔茨海默病的潜在病人。


    他们的方法与脑医生有点类似。近年来，世界各地的阿尔茨海默病研究人员一直在建立一个健康人群与阿尔茨海默病患者脑图像的数据库。他们用的是大脑 PET 扫描图像，而不是
    MRI 图像。研究人员使用这个数据库来训练卷积神经网络，并且在此基础上识别它们之间的区别。该数据库由 182 位 70 多岁的健康人大脑图像和 139 位相似年龄的确诊为阿尔茨海默病患者的大脑图像组成。通过培训，该机器软件系统很快就学会了识别差异，精确度几乎达到了
    90%。


    另一个案例来自欧洲，西班牙马拉加大学（University of Malaga）和格拉纳达大学（University of Granada）的研究人员携手合作，于
    2018 年 3 月在著名期刊《国际神经系统杂志》上发表了名为《用于阿尔茨海默病早期诊断的深度学习架构组合》的短文。这项研究提出了利用深度学习技术融合功能性图像和结构性图像，来诊断阿尔茨海默病的方法。


    该人工智能技术旨在对高级数据抽象建模，通过自动获取所关注的影响区域，让计算机学会区分健康人和病人的大脑。根据研究人员的解释，“该研究利用深度学习技术计算大脑功能预测方法和磁共振成像，预防阿尔茨海默病。为了实现这一目标，我们使用了不同的神经网络，对大脑的每个区域进行建模，然后再把它们结合起来。”目前他们并没有公布准确率。


    ## 6.7 齐济医疗：如何用 SaaS+人工智能解放医院肾内科


    所谓齐济医疗，“齐”是集众人之力之意，“济”是济世救民之意。中国的医疗事业不能靠个人英雄主义，而是要靠众人的力量，齐济医疗也因此得名。


    齐济医疗的核心团队由数名具有欧洲多年工作经验的人才构成。经过两轮融资，目前团队已超过 20 人。齐济平台最核心的能力是利用专业的大数据技术，为医生提供高效的数据收集、整理和分析。


    ### 6.7.1 我国医院肾内科治疗状况


    肾病是一个高消费病种，在国家的医保开销中，肾病占据了较大的比例。无论是从治疗层面还是从患者层面，政府都有非常强的控费需求。对于国家卫生健康委员会来说，数据的监控是其最大的痛点。现阶段，我国医院肾内科普遍存在以下
    3 个问题。


    第一，医疗硬件如血压计、体重计、血透机等，由于数据长期以数据孤岛的方式存在，这些硬件设备产生的数据只能依靠医生或护士手工誊写到计算机中，因此操作的人工成本较高。


    第二，由于医院内部信息化系统的数量繁多，一家三级医院有近百种不同类别的软件系统。医生为了拿到患者的肾病相关数据，往往需要用多个账号，登录多个软件平台。


    第三，肾内科预警和追溯的需求。肾内科是一个高危科室，患者的病情随时可能出现恶化，但国内三甲医院的医患比例导致一个医生要服务数千名患者。并且当医院出现严重的传染突发事件时，需要有追溯机制去控制传染发生的范围。


    强大的自动化系统，能够帮助医生跟踪患者病情数据的变化，从而减轻人工审核患者临床的工作量。


    ### 6.7.2 长征医院的合作案例


    上海长征医院的血液透析室是全国唯一一家每日透析四班的透析室。在巨大的工作压力下，医护人员要保证不出差错极其困难。


    在与齐济医疗合作之前，长征医院的血液透析室管理基本采用纸质表格进行排班、书写患者数据报告。在引入齐济医疗平台之后，可以实现自动签到、自动排班、自动预警、自动药品管理等功能，从而大大减轻了护士的工作压力，提高了医院的服务水平。


    在数据收集方面，齐济医疗平台与医院内各种信息化系统对接，把肾内科相关数据统一收集到一个平台上。齐济医疗平台利用 4 款软件（DDS^(\[1\])、PDS^(\[2\])、AKI^(\[3\])、CKD^(\[4\])）与专业化检查设备进行连接，从而对不同时段医院科室、血液透析站、患者家中的患者诊断与治疗信息进行收集汇总。


    在腹膜透析方面，齐济医疗为长征医院做了远程医患关系的信息化服务。长征医院的腹透医生和护士可以通过微信号，为患者提供每日辅助效果的监控，从而降低了患者来医院问诊的频率，提高了医护人员随访的密度。


    此外，长征医院科室主任还有科研上的需求，如特殊并发症的分析和监控。科室主任根据初步分析大胆猜想，并通过数据系统验证，进而利用机器学习提升数学模型。


    针对这种情况，齐济医疗建立了人工智能数学模型，帮科室管理者和医生推导出更多的信息系数，并提供临床决策支持。


    目前，齐济医疗已经通过人工智能引擎，与长征医院合作开展腹膜炎的并发症危险因素分析。未来，这项合作还将会形成腹膜炎的预测平台。


    在定制化方面，齐济医疗平台的基础套餐已经能够满足大部分医院的电子化需求。


    对于医院之间肾内科行政管理上的差异，如医院的支付、患者的进出流程，以及纸质文档的打印格式和内容等，通过齐济医疗平台快速低成本的定制，可以最大限度地满足不同客户的个性化需求。


    ### 6.7.3 齐济医疗的服务对象


    齐济医疗的服务对象以公立医疗机构为主，私立医疗机构尚处于起步阶段，且两者服务的方向存在较大差异。


    私立医疗机构如第三方血透中心和民营医院，不像二甲、三甲医院那样以软件销售为主，而是以远程管理为主。从国家政策来看，未来综合性民营医院的血透中心和第三方血透中心将迎来快速发展。


    民营医疗机构面临的最大问题是优秀医生的匮乏，第三方血透中心要发展，必须要有优秀人才的支撑。在美国，一位医生可以直接负责十几个血透中心，中国的医生与之相比，相去甚远。


    通过齐济医疗平台，可以打通医疗机构空间和时间的界线，让大医院的主任医师有时间、有精力在公立医院直接为民营医院和第三方血透中心提供服务，从而实现优秀人才的资源共享。齐济医疗依托三甲医院的知名医生，来委托管理综合性民营医院的血透中心和第三方血透中心的病人。在远程管理的过程中，齐济医疗会从医疗机构那里收取一定的管理费用。


    与第三方血透中心的合作，更偏向于提高服务质量和导入患者的流量。而综合性民营医院血透中心，除了血透服务之外，合作内容还包括肾内科药物销售等。因此，齐济医疗与后者的合作维度要更广一些。


    ### 6.7.4 从 B2B 转型为 B2C


    目前，齐济医疗已经与上海长征医院、江苏省人民医院、杭州邵逸夫医院、郑州大学第一附属医院及广州南方医院等 30 多家知名三甲医院达成了合作。


    未来，齐济医疗的业务模式会逐渐从 B2B 转型为 B2C，提供远程医疗监控、就近透析治疗、最惠购药推荐、居家检测检验和特色肾病保险等一体化的聚焦肾内科的便捷服务，这是齐济医疗的下一步计划。


    \[1\] DDS：血液透析管理。


    \[2\] PDS：腹膜透析管理。


    \[3\] AKI：急性肾病管理。


    \[4\] CKD：慢性肾病管理。


    # 第 7 章


    ## 政府引导：人工智能与医疗政策监管


    人工智能技术在医疗领域的应用，既是机遇也是挑战，无论是监管层还是产业界，各国都还没有充分准备好以迎接这一新鲜事物，仍在探索中前行。因此，人工智能的利益相关者必须通过合作，确保监管体系的顺利发展，以适应人工智能带来的变化。


    ### 7.1 中国人工智能政策演变


    虽然在人工智能的基础技术上，我国和美国还有一定的差距，但是政府已经从系统布局，整体部署我国的人工智能发展规划，表 7-1 所示为我国在人工智能方面制定的一些政策。2017
    年 7 月 20 日，国务院发布了《新一代人工智能发展规划》，这是在国家层面首次对一项技术内容进行全盘布局。


    表 7-1 中国人工智能相关政策整理


    ![](img/24530749e23a1f7b293e9c7cc40229b9.jpg)


    续表


    ![](img/be4feee89471194014ab6b127d26e166.jpg)


    在 2016 年之前，人工智能只是在部分产业规划中被提及。例如，2015 年 5 月，《中国制造 2025》规划中提到智能制造被定位为中国制造的主攻方向。同年
    7 月，“人工智能”被写入《国务院关于积极推进“互联网+”行动的指导意见》，被列为“互联网+”战略的一部分。


    2016 年 5 月 18 日，发改委、科技部、工信部和网信办联合印发了《“互联网+”人工智能三年行动实施方案》，这是第一个以人工智能为主题的政策文件，它从科技研发、应用推广和产业发展等方面提出了一系列措施，这些措施将支持人工智能领域的芯片、传感器、操作系统、存储系统、高端服务器、关键网络设备、网络安全技术设备、中间件等基础软硬件技术开发，以及开源软硬件平台和生态建设。


    2017 年 7 月 28 日，国务院发布了《新一代人工智能发展规划》，这是我国在人工智能领域进行的第一个系统部署的文件，也是面向未来打造我国先发优势的一个指导性文件，重点是对
    2030 年我国新人工智能发展的总体思路、战略目标和主要任务、保障措施进行系统的规划和部署。


