    ## 3.4 iPhone 平台切入 AI 医疗——苹果

    2015 年 8 月，Backchannel 主编、著名科技评论人 Steven Levy 走访了苹果公司后，发现这家公司其实先于业界使用了基于神经网络的深度学习技术，并发表了一篇重磅长文
    The iBrain is Here，其中谈到了许多苹果公司在人工智能领域的大计划。


    ## 3.4.1 苹果手机上的 Siri

    其实，苹果已经将 Siri 的语音识别移植到了基于神经网络的系统上，这一服务首先面向美国用户，并在 2016 年 8 月 15 日推向全球。一些早期技术仍有用，包括隐马尔可夫模型，但现在系统使用的是机器学习技术，包括深度神经网络、卷积神经网络、长短期记忆单位，封闭复发性单位（Gated
    Recurrent Units）以及 n-grams 等。用户升级后，Siri 虽然看起来还是一样的，但经过了深度学习的加强。与其他底层改进一样，由于不愿向竞争者暴露自己的技术，苹果公司没有公布
    Siri 的进展。但是 Siri 准确度的改善令人震惊。


    正是因为苹果自己设计芯片，因此苹果工程师能直接与编写固件的芯片设计组工程师合作，最大化提升神经网络的性能。Siri 团队的需求甚至影响了 iPhone 设计的方方面面。当苹果的神经网络在一个产品上成功时，还能成为其他产品的核心技术。机器学习让
    Siri 理解了用户，也让输入方式由手动变成了听写。也正是因为 Siri 的技术，用户语音输入的信息变得更流畅和完整。至于对自然语言理解方面，Siri 在
    2014 年 11 月就开始用机器学习理解用户的意图，并在一年后推出了深度学习版。例如，在语音识别方面，机器学习提升了用户体验，特别是在理解指令上。在 2018
    年 9 月 13 日升级的 iOS 10 系统中，Siri 在图片搜索、语音识别等方面有了重大升级。


    机器学习并不仅仅应用于 Siri 上，识别陌生来电、在解锁后列出用户最常使用的应用，或者在提醒事项中标记了一个约会（但用户并没有将之放入日程表中），以及自动显示附近标记的酒店，这些在苹果全面拥抱机器学习及神经网络后，都能做得尽善尽美。


    “深度学习”现在在苹果的产品及服务中无处不在。苹果的应用商店 App Store 使用深度学习辨别骗保行为，公测版操作系统收到的反馈也会使用人工智能筛选一遍，找出有用的反馈报告，通过算法，还可以自动审核健康应用。还有苹果的
    News 应用，采用机器学习挑选出用户可能感兴趣的新闻源。


    但和谷歌、Facebook、微软等有公开的、专门的人工智能技术科研机构的公司不一样，苹果在人工智能领域的动作和收购似乎都是为了增强自身已有业务或即将实现的业务，而对长远规划的关注则相对较少。不过苹果也可能只是秘而不宣，就像苹果自己说的那样：“苹果会经常收购一些小型技术公司，而我们通常不会讨论我们的目的或规划。”


    ## 3.4.2 苹果与人工智能相关的收购

    下面简单梳理一下苹果近几年与人工智能相关的收购。


    2015 年 3 月，苹果收购网络应用数据库技术公司 FoundationDB。它由 David Rosenthal、Nick Lavezzo 和 Dave
    Scherer 联合创立于 2009 年，该公司的产品 FoundationDB 是一种 NoSQL 数据库，非常适合低成本的 Web 应用。


    2015 年 4 月，苹果收购以色列的摄像头技术公司 LinX，据《华尔街日报》报道交易金额大约为 2000 万美元。这家公司设计的摄像头模组具有背景焦点模糊、视差图像和
    3D 图像拍摄等功能。


    2015 年 5 月，苹果公司收购了全球定位系统（GPS）创业公司 CoherentNavigation，这家公司的高管也加入了苹果公司的地图团队。Coherent
    Navigation 的主要研究方向是基于卫星技术的商用高精度导航服务。


    2015 年 9 月，苹果悄然收购了旧金山地图数据分析和可视化创业公司 Mapsense。Mapsense 称该公司的基于云端的高速地图系统可为开发者提供重要数据分析和工具，客户可以向其服务上传
    TB 级的位置标记数据，然后该公司可通过强大的搜索和过滤工具创建定制可视化信息，以提供给开发者分析。


    同月，苹果还收购了来自瑞士的脸部动画生成技术公司 Faceshift。该公司是一家专注实时动作捕捉技术的公司，专利是无标记（Markerless）面部动作捕捉技术。该公司还经常和游戏、动画工作室合作，通过
    3D 传感器实现快速、准确的面部表情捕捉。


    2015 年 10 月，英国自然语言处理创业公司 Vocal IQ 被苹果收购，苹果收购 Vocal IQ 的目的可能是强化其语音助手 Siri。


    同月，苹果还收购了创业公司 Perceptio，该公司的技术可以帮助企业客户在智能手机上运行先进的人工智能系统，该公司的负责人 Nicholas Pinto
    和 Zak Stone 都是知名的人工智能研究者，研究领域主要是基于深度学习技术的图像识别系统。


    2016 年 1 月，人工智能创业公司 Emotient 被苹果收购，其可利用人工智能技术对人们的面部表情进行分析以解读情绪。


    同月，苹果公司还确认已收购教育技术初创公司 LearnSprout，这家位于旧金山的软件创业公司成立已有 3 年，其在线数据洞察力可以帮助 K12（学前教育到中学教育）教育工作者追踪学生的学习情况。


    2016 年 8 月，苹果收购了机器学习与人工智能创业公司 Turi。Turi 能让开发者打造出配有机器学习和人工智能能力及可以进行自动调整的应用。它的产品包括
    Turi 机器学习平台、GraphLab Create、Turi Distributed 和 Turi 预测服务，旨在帮助大大小小的组织更好地感知数据。使用案例包括推荐引擎、欺诈检测、预测客户流失、情绪分析及客户细分。


    此外，苹果还在 2016 年 8 月宣布已经收购了创业公司 Gliimpse，Gliimpse 于 2013 年由安尼尔·赛迪（Anil Sethi）和卡蒂克·哈里哈兰（Karthik
    Hariharan）创立于硅谷，提供了一个独特的服务平台，让用户可以将不同来源的医疗和健康数据整合到一起，并按照需要与第三方（包括医生）共享。该公司的业务是使用机器学习技术帮助人们安全地管理和共享个人医疗信息。据了解，这项交易在
    2016 年早些时候就已经完成，但苹果公司一直以来都没有公布这项交易。


    ## 3.4.3 进军医疗健康领域

    苹果于 2017 年 5 月收购了一家数据挖掘和机器学习公司 Lattice.co。该公司主要利用机器学习技术解析数据库或网络资料来回答用户的查询，是一种可以了解人、地和事物之间关系的技术，通过大数据分析进行智能学习，让机器可以有更强的思考能力，类似于谷歌知识图表。


    2018 年 11 月，苹果收购了一家名为 Silk Labs 的人工智能创业公司，该公司由 3 位 Mozilla 前员工于 2015 年创建，专注于开发轻量级的人工智能软件，以适应相机等消费硬件，同时保护用户隐私。苹果也一直大力支持以将保护用户隐私放在首位的方式去使用人工智能。


    在最新发布的 Apple Watch 上，苹果为其添加了一个内嵌 GPS 功能，它会非常准确地计算用户的距离、步频，运动完之后会有一条彩色地图显示用户的路线和速度，这些功能非常适合用户在跑步、登山等户外运动时使用。用户将获得加强的用户界面、大幅度提升的性能及包括活动共享在内的全新健身与健康管理功能，而且还和
    Nike 合作开发了一款定制版“Apple Watch Nike+”。


    医疗大健康的智能化也是科技巨头看上的一块“大蛋糕”，谷歌、IBM、微软和苹果等都已入场，尤其是谷歌和 IBM，已经和医疗机构开展了深度的合作。在 2014
    年苹果全球开发者大会（Apple Worldwide Developers Conference，WWDC）上，苹果推出了全新的健康平台 Healthkit，凭借苹果公司遍布全球的数亿
    iPhone 用户，苹果已获得来自手机/手表传感器和大量第三方配件的健康数据，这也决定了苹果在医疗健康领域内具有扎实的数据基础。


    2016 年 5 月，苹果还聘请了 Nest 前首席技术官松冈容子（Yoky Matsuoka）加入该公司的健康产品团队。Yoky Matsuoka 是 Google
    X 实验室的共同创办人，后来又于 2010 年加入智能家居公司 Nest 担任技术负责人。另外，苹果还招募了超声波公司 Zonare 的安妮·谢尔丘克（Anne
    Shelchuk）、人骨 3D 可视化领域专家克雷格·斯莱菲尔德（Craig Slyfield）、可穿戴领域专家杰伊·芒格（Jay Mung），Jay Muny
    曾研究了美敦力的连续血糖监测系统的传感器算法。


    2016 年 8 月 11 日，苹果向美国专利和商标局（USPTO）申请了一项有关医疗健康的新专利。这份专利显示苹果正在研发一款可穿戴式医疗设备，通过内置的一系列传感器，可以快速测量心电图。它可以通过监测身体运动，收集原始数据，并与已经存储的数据进行对比，指向更复杂和精准的数据处理分析功能。也许不久，人们就能看到苹果在医疗健康领域的新产品和大意图。


    ## 3.4.4 苹果开启心脏研究，iPhone X 引爆生物人工智能

    美国时间 2017 年 9 月 12 日上午 10 点（北京时间 9 月 13 日凌晨 1 点），苹果秋季发布会在 Apple Park 的乔布斯剧院举行。在这个被称为“科技界春晚”的发布会上，苹果相继发布了内置蜂窝网络的第三代
    Apple Watch、支持 Dolby Vision 和 HDR10 的 Apple TV 4K（中国区用不了） 及如约而至的新一代 iPhone 8 系列手机。而最令人兴奋的，也是最受人期待的
    iPhone X 正式发布。这部采用 5.8 英寸全面屏、取消 HOME 键，解锁方式改为全新的 Face ID 的苹果手机于 2017 年 11 月 3
    日开售。


    ### 1．新 Apple Watch 提供实时心率监测，开启苹果心脏数据研究

    作为首个发布的产品，库克强调 Apple Watch 的宗旨是为了让生活质量更高，且至今已达到 97%的用户满意率，苹果甚至制作了一段专门的短片以展示 Apple
    Watch 如何让生活更健康。


    苹果首席运营官杰夫·威廉姆斯向大家展示了未来 Apple Watch 的变化。心率监测技术是从第一代 Apple Watch 开始搭载的，而第三代 Apple
    Watch 拥有全新的界面设计。新的心率 App 将提供全面的心率统计和管理，甚至可以测量在运动过后心率逐渐恢复的速度，同时提供一天中的心率变化对比。


    “休息的时候心率是多少，锻炼的时候心率是多少，抬抬手腕就知道了。”杰夫·威廉姆斯这样介绍道。


    同时，第三代 Apple Watch 新增提醒功能，在心率不是特别正常的时候会发出提醒。据杰夫·威廉姆斯透露，苹果的心率检测器是世界上使用频率最高的。


    在发布会上，杰夫·威廉姆斯还郑重宣布，苹果心脏研究（Apple Heart Study）正式开启（图 3-20），苹果将利用 Apple Watch 收集海量用户的心率数据用于研究，致力于攻克心律不齐、房颤等在生活中容易被忽视的问题，协助医院进行心脏疾病研究。这项研究受到斯坦福大学医学院和美国官方的支持。


    ![](img/20eec7759c9297cab7523b6d50cd0b8a.jpg)


    图 3-20 杰夫·威廉姆斯宣布苹果心脏研究正式开启


    此外，运动监测功能依旧是重点，第三代 Apple Watch 配备了智能教练功能，增加了不少新的运动监测功能。


    2017 年的发布会恰逢 iPhone 发布 10 周年，库克在发布会上宣称，Apple Watch 可以是健康生活的终极设备。这并不是他第一次表现出苹果对健康领域的看好。其实早在此次发布会之前，库克就在接受《财富》杂志采访时表达了他对苹果医疗保健应用的兴趣，并表示对其在未来公司战略中将扮演的角色感到激动：“我很想看看苹果的健康工具包还能做些什么，这是一件令人兴奋的事！”


    同时，根据斯坦福大学在 2018 年早些时候的研究发现，Apple Watch 比其他可穿戴设备的监测数据更准确。由此可见，苹果正在将 Apple Watch
    打造成一款可穿戴式医疗设备。


    ### 2．利用手机进行健康管理：盘点苹果手机中的睡眠健康应用程序

    除了心率监测、运动监测这些大家已经耳熟能详的健康管理功能之外，苹果的健康生态体系还远不止如此。


    在 2015 年的春季发布会上，苹果推出了能让医学研究人员直接创建诊断应用的开源框架 ResearchKit，这不仅能为医学研究提供大量苹果用户的数据，还可以将
    iPhone 变成医疗诊断工具。


    目前，苹果 App Store 中已经有不少应用可以帮助用户来应对帕金森综合征、糖尿病、哮喘和乳腺癌等疾病，而有了“健康”应用和 ResearchKit 之后，苹果搭建起了一个围绕用户身体健康的生态系统。


    在苹果应用商店的医疗、健康和健身板块，经常在特定的健康领域创建一份简短的清单。虽然应用商店的推送方法并不透明，但它让我们了解了苹果正在推广的应用程序，以及消费者在寻找特定类型的健康应用程序时看到的应用程序。


