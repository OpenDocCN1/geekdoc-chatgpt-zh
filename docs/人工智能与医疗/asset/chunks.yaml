    ### 依 图 科 技


    2016年依图科技进入医疗领域，在短短几个月内，先后开发了智能影像诊断辅助系统和基于病历数据的智能诊断辅助系统。2016年9月，依图与广州妇女儿童医疗中心合作，开发了针对幼儿发烧诊断相关的虚拟医生“咪姆熊”。


    动脉网从公开资料了解到，“咪姆熊”是基于深度学习技术，通过对医院的病历数据的学习，建立的十几种儿童常见疾病的诊断模型。它在医生的不断评价反馈下自动优化算法模型，从而迅速提升诊断精准度，被广州妇女儿童医疗中心的医生称为“熊医生”。


    6个月后，基于依图科技技术平台的肺结节智能影像辅助平台在浙江省人民医院上线。依图通过深度学习技术建立了“数字肺”，帮助医生快速精准定位结节。依图团队还把影像和病理结合起来，逼近影像本身的诊断极限。这在全球人工智能和医疗领域都是首创。


    公开报道中称，依图科技人工智能技术在实际医疗临床应用半年多时间，实际临床敏感性已经达到95%以上，其中10mm以下的小结节和5mm以下的微小结节占到检出结节的40%以上。这意味着，人工智能技术对肺小结节的诊断能力几乎已经超越普通医生的诊断水平。


    在试运行依图影像智能辅助诊断平台的医院，医生已经开始把系统生成的报告采纳到自己的诊断结论中。以浙江省人民医院为例，系统生成的报告被医生采纳的比例达到了90%。除了成功构筑在影像医学方面的先发优势，依图科技还在临床决策方面进行纵深布局。依图人工智能临床决策支持平台已在广州妇女儿童医疗中心服务，利用深度学习技术对历史病历进行处理，建立疾病诊断模型、特征补充模型、相似病例模型，为患者和医生提供初步诊断。


