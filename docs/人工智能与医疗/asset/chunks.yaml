    ## 3.3 创业投资加速器支持——微软


    微软在人工智能方面的研究更偏向基础层和技术层，在医疗行业的布局主要是为医院提供 IT 解决方案。人工智能基础技术包括人工智能算法、算法框架、机器学习平台、大数据挖掘技术、图像识别、自然语言处理和人工智能芯片。


    人工智能+医疗主要包括6个部分的解决方案。第一是提高医务工作人员的协同性，第二是搭建医院的数据体系，第三是提高医疗数据的安全性，第四是改善医院的运营流程，第五是提高患者的参与度，第六是提供远程医疗。


    除了提供解决方案外，微软研究院还有多个和医疗健康相关的项目。Biomedical Natural Language Processing 旨在利用机器学习技术，从医学文献和患者的电子病历中发掘有效信息，并且结合患者的基因数据，生成一系列的推荐治疗手段，最后由专家做决定；Inner
    Eye 项目致力于利用人工智能技术协助医生分析患者的影像资料，从而做出疾病诊断。


    微软的布局场景主要包括病历 / 文献分析、医院运营。


    ## 3.3.1 微软创投加速器


    微软风投包括3个部分——创业社区、孵化器和客户支持。创业社区吸收了微软2008年启动的BizSpark项目，可以为创业团队提供免费或低价的微软软件和其他服务，同时也可以方便创业者进行交流，寻找合作伙伴，提供技术支持平台；而微软的孵化器则在美国、中国、以色列等世界多个国家都设有办事处，可以为创业者提供为期3～6个月的创业孵化；客户支持服务则利用微软在全球广阔的客户资源，为初创企业提供必要的客户渠道，帮助他们建立自己的客户群，扩展自己的品牌。


    从Microsoft Venture及Microsoft Accelerator的投资情况看，在2016年前（第七期前），微软没有全面的布局，投资方式无明显的规律可循，其团队曾投资Inthera
    Bioscience、Telesofia Medical等这样的天使轮项目，但在2016年之后，微软的意图开始变得明显，几家获得融资的企业均是D轮以后已经在医疗领域扎根的企业或项目，且投资方向集中在人工智能、慢性病治疗（癌症）、基因等高科技领域，这与微软自身的属性非常契合，且能与微软的云服务Microsoft
    Azure进行深度结合。


    微软仅在2016年之前投过多家从事医疗信息化的企业，之后再也没有向此类企业伸出橄榄枝。因为初创企业的数据、研发能力均有限，微软作为一家商界巨擘，本就拥有自己的信息化产品，若在此基础上进行开发，速度更快且更高效。


    微软领投DNAnexus展示了它的目标。DNAnexus是一家成立于2009年的公司，为用户提供DNA数据储存、共享、分析、管理等服务，具有“独角兽”的潜质，于2018年1月获得了5800万美元E轮融资。投资DNAnexus项目为Microsoft
    Genomics发展铺平了道路，微软有了自己控制的基因云平台，可以更精准地切入精准医疗（PM）领域，同时加快AI在PM方向的机器学习过程。


    微软整个布局以云储存为核心，AI为主要应用手段，通过可穿戴设备及其他外源数据库（如DNAnexus、Validic）获得数据，直击精准医疗领域。


    早在2016年微软就提出要开发人工智能治疗癌症，而现阶段微软的布局也凸显了它的决心，从平台到数据再到技术，微软已经做足了准备。


    2013年6月，微软宣布将整合旗下的风险投资支持计划，推出统一的“微软风投”（Microsoft Ventures）计划，为创业企业提供更加深入、更加全面的创业服务。动脉网此前也报道过微软加速器中的公司。图3-17所示为微软风投主页。


