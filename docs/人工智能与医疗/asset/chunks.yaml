  trans: '

    2018 年 10 月 31 日，习近平主席在中共中央政治局第九次集体学习时强调，人工智能是新一轮科技革命和产业变革的重要驱动力量，加快发展新一代人工智能是事关我国能否抓住新一轮科技革命和产业变革机遇的战略问题。要深刻认识加快发展新一代人工智能的重大意义，加强领导，做好规划，明确任务，夯实基础，促进其同经济社会发展深度融合，以推动我国新一代人工智能健康发展。


    除了从国家层面推动人工智能的产业发展外，人工智能在应用过程中所涉及的法律法规问题也需要尽早规划和监管。特别是在监管严格的医疗行业中，人工智能的商业化应用还有很多问题需要通过政策进行规范。


    第一，人工智能的应用规范。医疗问题涉及人的健康和生命，任何问题都和患者的生命安全息息相关，所以，我们需要尽快在国家层面明确监管措施，用法规来监管人工智能在医疗上的应用范围、监管范围、风险责任判定等。


    第二，数据的合理、合法应用。因为人工智能需要从过往数据中进行学习，才会使其拥有智能，并得到提高，所以，大量高质量的医疗数据是人工智能具有判断力的基础。美国要求医疗信息的商业化应用必须严格符合
    HIPAA 和 HITECH 两个法案的规定。我国目前在此领域尚没有明确的政策出台，我们应该尽快明确如何利用数据、哪些数据可以利用、哪些数据不能利用，以及应该用什么法律来进行监管。


    首先，要从法律上明确数据的归属，无论数据是属于产生数据的主体，还是属于记录数据的企业，商业交易的前提是清晰的产权归属。如果产权存在瑕疵，就意味着交易存在法律风险。


    其次，医疗数据的使用还需要遵守安全规范的严格管控，加强应用安全风险评估和防范。数据的交易和使用需要提升透明性，用户必须充分知情并明确表示同意，并提供退出机制。


    最后，产业政策扶持。目前，我国的高科技公司中，有超过半数的公司并没有将人工智能列入战略计划之中。即使开始涉及人工智能，也可能在数据、人才、技术上存在阻碍，在引导数字医疗产业完成人工智能的变革方面，政府可以通过一些传统经济工具，帮助企业克服人工智能发展初期所面临的问题。


    欣喜的是，我们看到了《新一代人工智能发展规划》的发布，从国家层面推动人工智能的发展。未来，我国要将人工智能在各个领域中的创新转化为可持续的生产力，只有在一整套战略规划和政策扶持下，才能打牢人工智能的根基。


    对医疗数据使用权的解释分布在《执业医师法》《母婴保护法》《未成年人保护法》《传染病防治法》《医疗病历管理规定》《医疗事故处理条例》《中华人民共和国刑法修正案（九）》《邮政法》等法律法规中。


    ## 7.2 《新一代人工智能发展规划》概述


    为抓住人工智能发展的重大战略机遇，构筑我国人工智能发展的先发优势，加快建设创新型国家和世界科技强国，实施新一代人工智能重大科技项目。2016 年 7 月，徐匡迪、潘云鹤等一批院士提出了“启动中国人工智能重大科技计划的建议”，2017
    年 7 月 8 日，国务院发布《新一代人工智能发展规划》。


    《新一代人工智能发展规划》描绘了未来几十年我国人工智能发展的宏伟蓝图，确立了“三步走”的战略目标。


    第一步，到 2020 年人工智能总体技术和应用与世界先进水平同步，人工智能产业成为新的重要经济增长点，人工智能技术应用成为改善民生的新途径，有力支撑进入创新型国家行列和实现全面建成小康社会的奋斗目标。


    第二步，到 2025 年人工智能基础理论实现重大突破，部分技术与应用达到世界领先水平，人工智能成为带动我国产业升级和经济转型的主要动力，智能社会建设取得积极进展。


    第三步，到 2030 年人工智能理论、技术与应用总体达到世界领先水平，成为世界主要人工智能创新中心，智能经济、智能社会取得明显成效，为跻身创新型国家前列和经济强国奠定重要基础。


    同时，《新一代人工智能发展规划》立足国家发展全局，提出了以下六个方面的重点任务。


    （一）构建开放协同的人工智能科技创新体系。


    围绕增加人工智能创新的源头供给，从前沿基础理论、关键共性技术、基础平台、人才队伍等方面强化部署，促进开源共享，系统提升持续创新能力，确保我国人工智能科技水平跻身世界前列，为世界人工智能发展作出更多贡献。


    （二）培育高端高效的智能经济。


    加快培育具有重大引领带动作用的人工智能产业，促进人工智能与各产业领域深度融合，形成数据驱动、人机协同、跨界融合、共创分享的智能经济形态。数据和知识成为经济增长的第一要素，人机协同成为主流生产和服务方式，跨界融合成为重要经济模式，共创分享成为经济生态基本特征，个性化需求与定制成为消费新潮流，生产率大幅提升，引领产业向价值链高端迈进，有力支撑实体经济发展，全面提升经济发展质量和效益。


    （三）建设安全便捷的智能社会。


    围绕提高人民生活水平和质量的目标，加快人工智能深度应用，形成无时不有、无处不在的智能化环境，全社会的智能化水平大幅提升。越来越多的简单性、重复性、危险性任务由人工智能完成，个体创造力得到极大发挥，形成更多高质量和高舒适度的就业岗位；精准化智能服务更加丰富多样，人们能够最大限度享受高质量服务和便捷生活；社会治理智能化水平大幅提升，社会运行更加安全高效。


    （四）加强人工智能领域军民融合。


    深入贯彻落实军民融合发展战略，推动形成全要素、多领域、高效益的人工智能军民融合格局。以军民共享共用为导向部署新一代人工智能基础理论和关键共性技术研发，建立科研院所、高校、企业和军工单位的常态化沟通协调机制。促进人工智能技术军民双向转化，强化新一代人工智能技术对指挥决策、军事推演、国防装备等的有力支撑，引导国防领域人工智能科技成果向民用领域转化应用。鼓励优势民口科研力量参与国防领域人工智能重大科技创新任务，推动各类人工智能技术快速嵌入国防创新领域。加强军民人工智能技术通用标准体系建设，推进科技创新平台基地的统筹布局和开放共享。


    （五）构建泛在安全高效的智能化基础设施体系。


    大力推动智能化信息基础设施建设，提升传统基础设施的智能化水平，形成适应智能经济、智能社会和国防建设需要的基础设施体系。加快推动以信息传输为核心的数字化、网络化信息基础设施，向集融合感知、传输、存储、计算、处理于一体的智能化信息基础设施转变。优化升级网络基础设施，研发布局第五代移动通信（5G）系统，完善物联网基础设施，加快天地一体化信息网络建设，提高低时延、高通量的传输能力。统筹利用大数据基础设施，强化数据安全与隐私保护，为人工智能研发和广泛应用提供海量数据支撑。建设高效能计算基础设施，提升超级计算中心对人工智能应用的服务支撑能力。建设分布式高效能源互联网，形成支撑多能源协调互补、及时有效接入的新型能源网络，推广智能储能设施、智能用电设施，实现能源供需信息的实时匹配和智能化响应。


    （六）前瞻布局新一代人工智能重大科技项目。


    针对我国人工智能发展的迫切需求和薄弱环节，设立新一代人工智能重大科技项目。加强整体统筹，明确任务边界和研发重点，形成以新一代人工智能重大科技项目为核心、现有研发布局为支撑的“1+N”人工智能项目群。


