    GPU一开始是实现人类想象的工具，打造出了3D游戏与好莱坞影片的虚拟世界。现在，NVIDIA的GPU通过运行深度学习算法，模拟人类智能，成为能够认知与理解世界的智能大脑。2016年，NVIDIA密集发布了全线人工智能GPU芯片、系统、软件和服务。自此，NVIDIA从“游戏芯片公司”转型为“人工智能计算公司”。


    在2017年5月的第八届GTC大会（GPU技术开发者大会）上，NVIDIA CEO黄仁勋发布了世界上最先进的人工智能计算架构Volta。黄仁勋在会上说道：“性能的长足进展吸引了各个行业的创新者，过去一年，GPU驱动的人工智能服务创业公司数量增加了4倍多，达到1300家。深度学习是各大科技公司的战略重点，它越来越多地渗透到基础构架、工具、产品制造等各个方面。我们与各个架构制造商倾力合作，力求性能尽善尽美。通过优化GPU的每个架构，我们可以将训练一个模型所需的数百次迭代缩短至数天或数小时，从而提高工程师的工作效率。”


    ## 3.5.6 人工智能和医疗行业


    在人工智能领域，NVIDIA GPU的大量应用使其一时风光无二。


    在医疗保健方面，医生将利用人工智能尽早检测疾病，了解人类基因组，治疗癌症，或者从大量医疗数据和研究中进行学习，提供最佳的治疗建议。负责NVIDIA医疗健康领域的金佰利·鲍威尔（Kimberly
    Powell）在公开场合表示：“NVIDIA正和医疗领域研究人员探究人工智能在医疗方面的可能性，未来几年会扩大人工智能在医疗方面的应用。”


    金佰利·鲍威尔说道：“机器深度学习技术已经应用到医疗图像和大量的数据处理方面，人工智能将会在医疗领域发挥更多作用，如预测癌症，通过深度学习预测病人风险并提供解决方案。另外，
    NVIDIA也将人工智能应用到了发现新药物方面。”


    除了强调在医疗领域的进一步应用，NVIDIA在2016年 GTC大会上就与麻省总医院临床数据科学中心达成合作：NVIDIA凭借其技术，利用中心的100亿份医学影像，进行深度学习训练开发，用于疾病的检测、诊断、治疗等场景。同年11月，NVIDIA与美国国家癌症研究所、美国能源部合作启动“癌症探月”（Cancer
    Moonshot）项目，旨在开发出一套加速癌症研究的人工智能框架。这个新框架被称为“癌症分布式学习环境”，简称CANDLE。


    黄仁勋表示：“GPU深度学习给我们提供了一款应对重大挑战的全新工具，到目前为止，即使是最强大的超级计算机，在癌症研究方面也难以应对。通过与美国癌症研究所和能源部的合作，我们打造出了这款专门用于癌症研究的人工智能超级计算平台。”


    ## 3.5.7 使用NVIDIA产品的人工智能医疗项目


    在通用计算时代，NVIDIA产品大多数是应用在生物医学的科研领域，用于基础研究，加速各种拥有大量数据的科研计算。同样，在人工智能时代，仍然有相当多的基础研究在高等院校或大型医院里面进行，如斯坦福大学、麻省理工学院、北德克萨斯大学、西奈山医院等机构就曝光过基于NVIDIA平台的人工智能医疗项目，用于皮肤病、肿瘤等疾病的诊疗。


    ### 1．德国弗劳恩霍夫医学图像计算学院


    德国弗劳恩霍夫医学图像计算学院的研究人员正在利用GPU和深度学习提高癌症诊断的准确性。通过人工智能图像分析，医生可以减少误报，避免不必要的治疗，同时提高发现潜在新肿瘤的可能性。


    弗劳恩霍夫医学图像计算学院的研究科学家Markus Harz表示：“我们认为早期发现是治疗的关键。当算法检测出图像存在异常后，如何正确地处理诊断这些异常，就成为下一个挑战。”几年前，Harz及其同事还在依赖今天仍然普遍采用的传统式“特征工程”诊断法。研究人员对计算机进行编程，使其能够检测图像特征，然后通过线性回归或随机森林等算法对图像数据进行分类。然而，研究团队利用深度学习实施的第一项实验就表明，它可以解决极具挑战性的问题，包括探检位置及识别器官和异常的轮廓。


    ### 2．梅奥诊所


    梅奥诊所的神经系放射学家布拉德利·埃里克森（Bradley Erickson）博士则借助人工智能的力量，利用磁共振成像预测了脑肿瘤基因组。


    埃里克森博士的这种方法能够让医生更加轻松地访问宝贵的基因信息，以便预测肿瘤的增生速度，以及肿瘤是否会对特定药物及其他治疗方法产生反应。


    在一组实验中，研究人员识别出了干扰DNA修复的多形性成胶质细胞瘤——一种最常见且致命的脑肿瘤。埃里克森博士认为，相比于仅采取放疗一种手段，放化疗综合方案对于这种MGMT基因发生突变（甲基化作用）的癌症疗效更好。如果肿瘤尚未发生变异，医生就可以选择副作用较小的治疗方法。


    埃里克森博士的团队利用基因已突变和未突变的肿瘤磁共振成像训练神经网络。为此，他们采用了CUDA并行计算平台及一系列搭载cuDNN的NVIDIA GPU，同时还通过Tesla
    P40 GPU加速器及其他GPU部署其算法。梅奥诊所因利用人工智能，通过核磁共振成像手段对某些脑瘤突变进行早期识别，从而被授予NVIDIA 2017年全球影响力大奖。


    ### 3．马里兰大学


    马里兰大学高等计算机研究所的研究人员创造了BEAGLE，为观察进化的演变提供了一种革命性方法，并且因此被授予NVIDIA 2017年全球影响力大奖。


    BEAGLE是一个开源数据库和应用程序编程接口（Application Programming Interface，API），可以使用NVIDIA的GPU快速切割数据，通过对特定模型的精准计算，来加速对DNA等生物序列数据的分析。BEAGLE的全名是广义平台进化分析可能性求值程序，被研究艾滋病、流感和埃博拉致病病毒等生物进化史的科学家广泛采用，现在已成为软件工作流程的一个重要组成部分。


    ### 4．亚利桑那州菲尼克斯转译基因组学研究院


    研究院的金姆（Kim）和他团队的研究可以带来癌症的精准治疗，例如，针对患者肿瘤的某些细胞进行治疗。为此，他们创造了一个GPU加速的数据分析工具，让他们可以详细地测试出癌细胞的DNA如何控制蛋白生成，同时测试这些蛋白相互之间及其与其他分子之间如何发生作用。通过使用这项工具，研究人员可以找到同一个肿瘤中不同细胞群之间的差异。这项研究意味着未来可以为癌症患者带来个性化的治疗，通过使用不同的药物治疗肿瘤的不同部分。


    ### 5．北德克萨斯大学


    北德克萨斯大学的安德烈斯·西斯内罗斯（Andres Cisneros）和他的团队收集了美国国立卫生研究院的大量数据，用来寻找与癌症有关的DNA修复蛋白变异。


    找到这些变异后，研究人员通过GPU加速的计算机模拟去找出这些变异如何改变DNA修复蛋白和其功能。西斯内罗斯说：“如果我们知道有变异影响这些蛋白，且与癌症有关，研究人员可以用这些信息修复这些蛋白，或是使用药物，或是其他疗法。”


    Cisneros更大的目标是找到更多能表明特定类型的癌症高危迹象的生物标记。该团队已经找到与几种癌症有关的变异，包括非裔美国人的前列腺癌的生物标记。


    ## 3.5.8 基于NVIDIA平台的人工智能医疗行业初创公司


    除了基础研究之外，不少初创公司已经将其基于NVIDIA平台所研发的人工智能项目商业化，我们选取了部分人工智能医疗保健初创公司进行介绍。


    ### 1．北京推想科技有限公司


    北京推想科技有限公司（以下简称推想科技）是一家专业的智能大数据公司，长期从事人工智能、深度学习、图像识别、医疗影像等领域的前沿应用研发。推想科技将人工智能引入医学影像的诊断之中，使其能在复杂疾病的检查和判断领域提供准确的解决方案。目前，推想科技与武汉同济医院等顶尖三甲医院展开战略合作，开发新一代人工智能辅助筛查系统。


    推想科技的解决方案在图像类别和诊断部位的应用范围非常广泛，如超声、CT、MRI，或者胸腔、腹部、关节等。推想科技的深度学习解决方案不仅可以在1秒内扫描250个CT层面，让医生实时得到结果，而且准确率也能接近主治医生的水平。总体来说，推想科技能够解决的病种数量、准确度、运算时间、效率等得到大幅提升。


    ### 2．Genetesis


    来自辛辛那提的Genetesis公司正在进行CardioFlux的临床试验，使用深度学习、传感器和物理学来正确诊断胸痛。CardioFlux是一种非侵入性生物磁共振成像系统，能够测量胸部的弱磁场。它由GPU提供人工智能加速支持，在90秒内就能生成心电情况的3D地图，帮助医生快速且准确地诊断动脉阻塞并确定其位置。


    CardioFlux为医师提供3D绘图工具，以了解每个患者的潜在心电活动，可用于诊断和指导治疗各种心脏疾病，包括心肌缺血、心房颤动、室性心动过速和其他心脏病。


    ### 3．Bay Labs


    Bay Labs通过训练GPU加速深度学习软件识别超声图像，能够更加轻松地对扫描结果进行解读分析。该公司表示，它的解决方案是常规方案速度的20倍，但它的成本却是现在的八分之一。它将成本从400美元降低到每次扫描50美元，并且每年可以扫描的患者数量是之前的5倍以上。


    Bay Labs最开始是一家软件公司，开发了一款使用深度学习诊断风湿性心脏病的软件，配合超声设备进行快速诊断，获得了有价值的医学结果。而现在Bay Labs也参与到超声设备的研发中，通过打造价格合理的便携式超声波扫描仪及人工智能技术来辅助全科医生进行心脏病的快速诊断。


    ### 4．Athelas


    位于旧金山的Athelas公司打造了一款便携式血液检查设备，该设备能够让用户随时随地测量自身白细胞计数。它采用深度学习和机器视觉技术，使用GPU来快速分析血细胞并产生诊断报告。它只需通过几滴血，就能在几分钟之内识别白血病、感染、炎症等。这款设备的售价为250美元，单个试条售价10美元。这一技术已符合510（k）^(\[1\])Ⅰ类的标准，目前已经可供诊所和家庭用户使用。


    ### 5．Lunit


    Lunit 总部设在首尔，正在使用3D成像和深度学习技术对乳腺进行检测。美国每年会花费100亿美元进行乳腺癌检测。Lunit CEO Anthony Paek表示，在筛查测试中，大约有20%的肺癌和乳腺癌被遗漏，而医生使用Lunit的技术，将正确诊断率从80%提高到了83%。此外，在一次测试中，Lunit已经击败来自IBM和Microsoft等其他公司的团队。


    Lunit通过准备数据训练其神经网络，然后通过反馈改善检测。Paek表示，其业务也可以扩大到其他医疗领域，用来检测其他类型的癌症。


    ### 6．Insilico Medicine'
  fmt: '

    在CUDA架构的GPU基础上，NVIDIA开发出通用计算专用的Tesla计算卡。各个领域的研究人员通过Tesla计算卡享受到此前只有超级计算机才具备的计算能力。它被广泛使用在药物研发、医学成像、天气建模、科学研究等各种大规模计算中。


    在拥有强大的计算能力之后，GPU当然也被超级计算机所采用。相比传统CPU搭建的超级计算机，采用GPU计算核心的超级计算机拥有性能高、功耗低的特点。2010年计算性能世界排名第一的中国天河一号A超级计算机，就使用了NVIDIA
    Tesla计算卡。


    在这一段时间里，除了GPU之外，NVIDIA也开始进军移动处理器领域。Tegra系列曾是NVIDIA进军智能手机芯片市场的一次尝试。当时，黄仁勋认为智能手机正处在改变计算和通信方式的风口浪尖。但是，由于低估了集成基带的重要性，NVIDIA在手机芯片市场上的表现并不出色，平板电脑市场也不尽如人意。现在智能手机几乎不再使用Tegra，NVIDIA的产品中Shield平板和Shield
    TV还在使用Tegra处理器。


    但是，Tegra产品延伸到汽车领域后却大获成功，NUIDIA利用其GPU计算能力主攻车载娱乐系统和无人驾驶系统。特斯拉Model S电动车的车载娱乐系统正是基于Tegra
    3设计的，现在已经升级到最新的Tegra X1。而基于Tegra的无人驾驶系统DRIVE PX，也被沃尔沃、奥迪、宝马、奔驰等大厂采用。


    ## 3.5.4 通用计算和医疗行业


    在通用计算时代，医疗领域是NVIDIA GPU发挥作用的重要阵地。医疗成像是较早利用GPU通用计算能力加快性能的商业应用之一，有多款医疗设备均配备了NVIDIA
    Tesla GPU。


    在一些医疗影像应用中，计算机需要处理大量的高精度CT或者MRI图像。患者需要快速、精确并且舒适的诊断，而医生则需要能够实现高效诊断的工具。将庞大的服务器阵列引入临床设备非常困难，但GPU和Tesla的强大计算能力使得提供小型的并行计算模块成为可能。


    GPU的通用计算性能能够让科研人员以比处理器快数十倍甚至上百倍的速度处理这些图像。因此，医生能够实现实时查看CT和MRI的3D合成图像，或者在不损失检查影像画质的情况下，能够使系统更快地运行。通过这些快速得到的结果，医生能够检查病患组织的状态并做出诊断，而无须活体检查和外科处理。此外，某些医生可以同时查看此类图像，彼此沟通。GPU还被利用在GE
    Revolution CT扫描仪上，不但可以生成高画质影像，还能使患者受到的辐射减少82%。


    对于那些敢于迎接最难挑战的科研人员来说，GPU的通用计算平台成为成功的关键。伊利诺伊大学的科学家利用一台基于GPU的超级计算机，首次对病毒衣壳进行了全原子模拟，在艾滋病病毒的研究方面取得了突破性进展。该论文发布在《自然》杂志上，首次确定了
    HIV“病毒衣壳”的准确化学结构，是其病毒性的关键所在。


    在药物开发、计算化学、生物信息及生命科学领域，GPU都发挥了其显著的并行计算能力。斯坦福大学化学系副教授兼 Folding@home 项目总监Vijay Pande表示：“NVIDIA
    GPU对蛋白质折叠模拟的影响是巨大而深远的。使用GPU来模拟蛋白质折叠的团队实现了其生产效率的极速飙升。在 Folding@home 中应用如此强大的处理性能彻底改变了这一项目，极大地缩短了我们进行生物医学研究所需的时间。”


    ## 3.5.5 第三阶段：从通用计算向人工智能迈进


    GPU的通用计算能力使得它的应用场景从单一的图形渲染扩展到需要计算的方方面面，能够让科学家和科研人员利用GPU强大的并行计算能力来解决复杂的计算难题，这其中也包含了深度学习计算。


    2010年，世界各地的人工智能研究员已经开始利用NVIDIA GPU的并行计算能力来进行神经网络训练。2012年是人工智能标志性的一年。多伦多大学Alex
    Krizhevsky创建了能够从100万样本中自动学习识别图像的深度神经网络。仅在两块NVIDIA GTX 580计算机显卡上训练几天，“AlexNet”就赢得了当年的ImageNet竞赛，击败了有着几十年算法经验的人类专家。


    2012年，在认识到网络规模越大，其学习能力越强的规律之后，当时还在斯坦福大学的吴恩达（Andrew Ng，后来加入百度，并于2017年离开）与NVIDIA研究室合作开发了一种使用大规模GPU计算系统训练网络的方法。这引起了全球关注，世界各地的人工智能研究人员转向GPU深度学习。百度、谷歌、Facebook、微软是首批将深度学习用于模式识别的公司。


    GPU深度学习正改变着软件的开发与运行方式。过去，是软件工程师构思程序的算法并编写代码；现在，算法从真实世界的海量实例中自我学习，实现软件自我编写。深度神经网络被部署在数据中心和智能设备中以便推理和预测下一步行动。GPU深度学习为机器学习、认知、推理与解决问题奠定了基础。


    NVIDIA GPU特别擅长处理并行工作负载，可让网络提速10～20倍，从而将各个数据训练迭代周期从几个星期缩短为几天。实际上，GPU在仅仅3年内便将深度神经网络
    （DNN） 的训练速度提高了50倍（这一速度远远超过摩尔定律），预计未来几年还将再提高10倍。


    谷歌的AlphaGo大胜韩国围棋棋手李世石，其中就使用了NVIDIA的GPU产品。单机版的AlphaGo使用了40个线程、48个CPU和8个GPU，分布式版的AlphaGo使用了40个线程、1202个CPU和176个GPU。


    为了进行深度学习的部署，NVIDIA的策略有3步：第一步是建立深度学习生态圈，和科学家共同进行深度学习技术的研究；第二步是在不同的平台上进行深度学习部署，包括汽车、计算机、智能机器人、服务器等；第三步则是提供端对端的解决方案。这种方式的好处是，NVIDIA可以在不同平台上让这套算法进行学习并共享知识，而且未来这套深度学习算法的应用很有可能并不止于自动驾驶的汽车上，在物联网上也会提供解决方案。


    除了提供GPU硬件产品，NVIDIA也一直致力于开发深度学习软件、库和工具。为训练图像、笔迹和声音识别等应用程序并加快训练速度，目前的深度学习解决方案几乎完全依赖NVIDIA
    GPU加速计算。NVIDIA提供了一个端到端的人工智能计算平台——从GPU到深度学习软件和算法。


    NVIDIA提供了用于设计和部署GPU加速的深度学习软件TDK——cuDNN，它加速了大多数深度学习软件框架（如 Caffe、Caffe2、TensorFlow、Theano、Torch、CNTK），让工程师专注于训练神经网络和开发软件应用程序，而不用花时间进行底层的GPU性能调优。NVIDIA
    GPU深度学习系统得到了迅速的扩展，突破性地在人工智能搜索、识别、推荐、翻译等方式中应用。阿里巴巴、亚马逊、IBM、微软等全球大型公司普遍使用NVIDIA的GPU深度学习平台提供服务。


    NVIDIA在2016年年底，推出了首款人工智能超级计算机DGX-1（图3-29），这是一款即插即用的计算设备。它的计算性能相当于一个含有250个节点的高性能计算集群，可将网络训练用时从数周缩短至几天。这些设备已经成为阿里巴巴、亚马逊、谷歌、IBM、微软、SAP等企业的人工智能的大脑。同时，NVIDIA还开发了DRIVE
    PX2、Jetson TX1等小型人工智能系统，使之成为无人驾驶汽车、智能机器人、智能物联网的大脑，使得机器人能够通过反复试验进行自我学习。


    ![](images/8b34fff02345c430ab750ce0086a6dae.jpg)


    图3-29 人工智能超级计算机DGX-1


    前面提到，NVIDIA发挥自己在芯片和图形领域的处理能力，设计出适合于手机、平板电脑等移动设备的Tegra芯片，并使用在汽车导航、多媒体娱乐系统中。2014年年初，世界上采用NVIDIA处理器的汽车已经超过450万辆，涉及20多个品牌、100多款车型，其中包括奥迪、宝马、大众等车企巨头，也包括特斯拉这种车界新贵。随后，NVIDIA开发出基于GPU设计的DRIVE
    PX汽车自动驾驶系统（图3-30），并和特斯拉、奥迪等汽车品牌进行合作。医疗和自动驾驶成为NVIDIA人工智能应用最广泛的领域。


    ![](images/b0092922d06fdb44a88d7e426f8ca1a8.jpg)


    图3-30 奥迪使用NVIDIA自动驾驶系统在极端天气下的测试


    图3-31所示的是NVIDIA的现有产品布局。


    ![](images/41b8e175b01391d7645ec21fb0ebd1f3.jpg)


    图3-31 NVIDIA现有产品布局


    GPU一开始是实现人类想象的工具，打造出了3D游戏与好莱坞影片的虚拟世界。现在，NVIDIA的GPU通过运行深度学习算法，模拟人类智能，成为能够认知与理解世界的智能大脑。2016年，NVIDIA密集发布了全线人工智能GPU芯片、系统、软件和服务。自此，NVIDIA从“游戏芯片公司”转型为“人工智能计算公司”。


    在2017年5月的第八届GTC大会（GPU技术开发者大会）上，NVIDIA CEO黄仁勋发布了世界上最先进的人工智能计算架构Volta。黄仁勋在会上说道：“性能的长足进展吸引了各个行业的创新者，过去一年，GPU驱动的人工智能服务创业公司数量增加了4倍多，达到1300家。深度学习是各大科技公司的战略重点，它越来越多地渗透到基础构架、工具、产品制造等各个方面。我们与各个架构制造商倾力合作，力求性能尽善尽美。通过优化GPU的每个架构，我们可以将训练一个模型所需的数百次迭代缩短至数天或数小时，从而提高工程师的工作效率。”


    ## 3.5.6 人工智能和医疗行业


    在人工智能领域，NVIDIA GPU的大量应用使其一时风光无二。


    在医疗保健方面，医生将利用人工智能尽早检测疾病，了解人类基因组，治疗癌症，或者从大量医疗数据和研究中进行学习，提供最佳的治疗建议。负责NVIDIA医疗健康领域的金佰利·鲍威尔（Kimberly
    Powell）在公开场合表示：“NVIDIA正和医疗领域研究人员探究人工智能在医疗方面的可能性，未来几年会扩大人工智能在医疗方面的应用。”


    金佰利·鲍威尔说道：“机器深度学习技术已经应用到医疗图像和大量的数据处理方面，人工智能将会在医疗领域发挥更多作用，如预测癌症，通过深度学习预测病人风险并提供解决方案。另外，
    NVIDIA也将人工智能应用到了发现新药物方面。”


    除了强调在医疗领域的进一步应用，NVIDIA在2016年 GTC大会上就与麻省总医院临床数据科学中心达成合作：NVIDIA凭借其技术，利用中心的100亿份医学影像，进行深度学习训练开发，用于疾病的检测、诊断、治疗等场景。同年11月，NVIDIA与美国国家癌症研究所、美国能源部合作启动“癌症探月”（Cancer
    Moonshot）项目，旨在开发出一套加速癌症研究的人工智能框架。这个新框架被称为“癌症分布式学习环境”，简称CANDLE。


    黄仁勋表示：“GPU深度学习给我们提供了一款应对重大挑战的全新工具，到目前为止，即使是最强大的超级计算机，在癌症研究方面也难以应对。通过与美国癌症研究所和能源部的合作，我们打造出了这款专门用于癌症研究的人工智能超级计算平台。”


    ## 3.5.7 使用NVIDIA产品的人工智能医疗项目


    在通用计算时代，NVIDIA产品大多数是应用在生物医学的科研领域，用于基础研究，加速各种拥有大量数据的科研计算。同样，在人工智能时代，仍然有相当多的基础研究在高等院校或大型医院里面进行，如斯坦福大学、麻省理工学院、北德克萨斯大学、西奈山医院等机构就曝光过基于NVIDIA平台的人工智能医疗项目，用于皮肤病、肿瘤等疾病的诊疗。


    ### 1．德国弗劳恩霍夫医学图像计算学院


    德国弗劳恩霍夫医学图像计算学院的研究人员正在利用GPU和深度学习提高癌症诊断的准确性。通过人工智能图像分析，医生可以减少误报，避免不必要的治疗，同时提高发现潜在新肿瘤的可能性。


    弗劳恩霍夫医学图像计算学院的研究科学家Markus Harz表示：“我们认为早期发现是治疗的关键。当算法检测出图像存在异常后，如何正确地处理诊断这些异常，就成为下一个挑战。”几年前，Harz及其同事还在依赖今天仍然普遍采用的传统式“特征工程”诊断法。研究人员对计算机进行编程，使其能够检测图像特征，然后通过线性回归或随机森林等算法对图像数据进行分类。然而，研究团队利用深度学习实施的第一项实验就表明，它可以解决极具挑战性的问题，包括探检位置及识别器官和异常的轮廓。


    ### 2．梅奥诊所


    梅奥诊所的神经系放射学家布拉德利·埃里克森（Bradley Erickson）博士则借助人工智能的力量，利用磁共振成像预测了脑肿瘤基因组。


    埃里克森博士的这种方法能够让医生更加轻松地访问宝贵的基因信息，以便预测肿瘤的增生速度，以及肿瘤是否会对特定药物及其他治疗方法产生反应。


    在一组实验中，研究人员识别出了干扰DNA修复的多形性成胶质细胞瘤——一种最常见且致命的脑肿瘤。埃里克森博士认为，相比于仅采取放疗一种手段，放化疗综合方案对于这种MGMT基因发生突变（甲基化作用）的癌症疗效更好。如果肿瘤尚未发生变异，医生就可以选择副作用较小的治疗方法。


    埃里克森博士的团队利用基因已突变和未突变的肿瘤磁共振成像训练神经网络。为此，他们采用了CUDA并行计算平台及一系列搭载cuDNN的NVIDIA GPU，同时还通过Tesla
    P40 GPU加速器及其他GPU部署其算法。梅奥诊所因利用人工智能，通过核磁共振成像手段对某些脑瘤突变进行早期识别，从而被授予NVIDIA 2017年全球影响力大奖。


    ### 3．马里兰大学


    马里兰大学高等计算机研究所的研究人员创造了BEAGLE，为观察进化的演变提供了一种革命性方法，并且因此被授予NVIDIA 2017年全球影响力大奖。


    BEAGLE是一个开源数据库和应用程序编程接口（Application Programming Interface，API），可以使用NVIDIA的GPU快速切割数据，通过对特定模型的精准计算，来加速对DNA等生物序列数据的分析。BEAGLE的全名是广义平台进化分析可能性求值程序，被研究艾滋病、流感和埃博拉致病病毒等生物进化史的科学家广泛采用，现在已成为软件工作流程的一个重要组成部分。


    ### 4．亚利桑那州菲尼克斯转译基因组学研究院


    研究院的金姆（Kim）和他团队的研究可以带来癌症的精准治疗，例如，针对患者肿瘤的某些细胞进行治疗。为此，他们创造了一个GPU加速的数据分析工具，让他们可以详细地测试出癌细胞的DNA如何控制蛋白生成，同时测试这些蛋白相互之间及其与其他分子之间如何发生作用。通过使用这项工具，研究人员可以找到同一个肿瘤中不同细胞群之间的差异。这项研究意味着未来可以为癌症患者带来个性化的治疗，通过使用不同的药物治疗肿瘤的不同部分。


    ### 5．北德克萨斯大学


    北德克萨斯大学的安德烈斯·西斯内罗斯（Andres Cisneros）和他的团队收集了美国国立卫生研究院的大量数据，用来寻找与癌症有关的DNA修复蛋白变异。


    找到这些变异后，研究人员通过GPU加速的计算机模拟去找出这些变异如何改变DNA修复蛋白和其功能。西斯内罗斯说：“如果我们知道有变异影响这些蛋白，且与癌症有关，研究人员可以用这些信息修复这些蛋白，或是使用药物，或是其他疗法。”


    Cisneros更大的目标是找到更多能表明特定类型的癌症高危迹象的生物标记。该团队已经找到与几种癌症有关的变异，包括非裔美国人的前列腺癌的生物标记。


    ## 3.5.8 基于NVIDIA平台的人工智能医疗行业初创公司


    除了基础研究之外，不少初创公司已经将其基于NVIDIA平台所研发的人工智能项目商业化，我们选取了部分人工智能医疗保健初创公司进行介绍。


    ### 1．北京推想科技有限公司


    北京推想科技有限公司（以下简称推想科技）是一家专业的智能大数据公司，长期从事人工智能、深度学习、图像识别、医疗影像等领域的前沿应用研发。推想科技将人工智能引入医学影像的诊断之中，使其能在复杂疾病的检查和判断领域提供准确的解决方案。目前，推想科技与武汉同济医院等顶尖三甲医院展开战略合作，开发新一代人工智能辅助筛查系统。


    推想科技的解决方案在图像类别和诊断部位的应用范围非常广泛，如超声、CT、MRI，或者胸腔、腹部、关节等。推想科技的深度学习解决方案不仅可以在1秒内扫描250个CT层面，让医生实时得到结果，而且准确率也能接近主治医生的水平。总体来说，推想科技能够解决的病种数量、准确度、运算时间、效率等得到大幅提升。


    ### 2．Genetesis


    来自辛辛那提的Genetesis公司正在进行CardioFlux的临床试验，使用深度学习、传感器和物理学来正确诊断胸痛。CardioFlux是一种非侵入性生物磁共振成像系统，能够测量胸部的弱磁场。它由GPU提供人工智能加速支持，在90秒内就能生成心电情况的3D地图，帮助医生快速且准确地诊断动脉阻塞并确定其位置。


    CardioFlux为医师提供3D绘图工具，以了解每个患者的潜在心电活动，可用于诊断和指导治疗各种心脏疾病，包括心肌缺血、心房颤动、室性心动过速和其他心脏病。


    ### 3．Bay Labs


    Bay Labs通过训练GPU加速深度学习软件识别超声图像，能够更加轻松地对扫描结果进行解读分析。该公司表示，它的解决方案是常规方案速度的20倍，但它的成本却是现在的八分之一。它将成本从400美元降低到每次扫描50美元，并且每年可以扫描的患者数量是之前的5倍以上。


    Bay Labs最开始是一家软件公司，开发了一款使用深度学习诊断风湿性心脏病的软件，配合超声设备进行快速诊断，获得了有价值的医学结果。而现在Bay Labs也参与到超声设备的研发中，通过打造价格合理的便携式超声波扫描仪及人工智能技术来辅助全科医生进行心脏病的快速诊断。


    ### 4．Athelas


    位于旧金山的Athelas公司打造了一款便携式血液检查设备，该设备能够让用户随时随地测量自身白细胞计数。它采用深度学习和机器视觉技术，使用GPU来快速分析血细胞并产生诊断报告。它只需通过几滴血，就能在几分钟之内识别白血病、感染、炎症等。这款设备的售价为250美元，单个试条售价10美元。这一技术已符合510（k）Ⅰ类的标准，目前已经可供诊所和家庭用户使用。


    ### 5．Lunit


    Lunit 总部设在首尔，正在使用3D成像和深度学习技术对乳腺进行检测。美国每年会花费100亿美元进行乳腺癌检测。Lunit CEO Anthony Paek表示，在筛查测试中，大约有20%的肺癌和乳腺癌被遗漏，而医生使用Lunit的技术，将正确诊断率从80%提高到了83%。此外，在一次测试中，Lunit已经击败来自IBM和Microsoft等其他公司的团队。


    Lunit通过准备数据训练其神经网络，然后通过反馈改善检测。Paek表示，其业务也可以扩大到其他医疗领域，用来检测其他类型的癌症。


    ### 6．Insilico Medicine

