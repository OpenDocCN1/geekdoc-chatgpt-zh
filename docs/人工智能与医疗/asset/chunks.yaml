    2018 年全球人工智能医疗行业单笔融资规模达到 12 344 万元，相比于 2016 年的 5510 万元，年增长率约为 50%，资本集中趋势明显，如图
    5-16 所示。人工智能医疗行业趋于成熟，投资轮次后移，出现大量的大额投资，融资均额上升。


