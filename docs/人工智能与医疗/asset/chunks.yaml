    ## 5.3 人工智能顶级专家引领深度学习的发展


    关于机器学习的研究最早可以追溯到20世纪50年代，也就是人工智能刚刚兴起的时候。当时流行的是“联结主义”（Connectionism），代表性工作是感知器（Perceptron）。这也是现在大热的深度学习
    （Deep Learning） 的前身。不过，麻省理工学院计算机科学研究的奠基人马文·明斯基出版的《感知器》一书给当时正热的神经网络研究当头一棒。他在书中指出，浅层网络无法解决异或这一非线性逻辑关系，深层网络的训练方法仍然是一个棘手的问题。这一论断使几乎全球的科研人员停止了对神经网络的研究。


    1983年，加州理工大学的物理学家约翰·霍普菲尔德（John Hopfield）利用神经网络，在著名的NP完全问题——旅行商问题上取得当时最好的结果，使人们开始重新关注这一领域。之后，来自加州大学圣迭戈分校的大卫·鲁姆哈特（David
    Rumelhart）重新改进了BP算法^(\[1\])，使得深层网络的训练成为可能，掀起了神经网络研究的第二次高潮。不过，人们也意识到，尽管神经网络具有强大的泛化学习能力，但是其参数的设置缺乏理论指导，很多工作只能靠手工调参得到结论，于是人们开始期待能在理论上给予机器学习技术更多的支持，但人工智能算法的发展经历了一个漫长的时期，如图5-18所示。


    ![](images/cec1d02ba9e20421d23fb258f644d313.jpg)


    图5-18 人工智能算法的发展


    20世纪90年代中期，统计学习 （Statistical Learning） 走上主流舞台，代表工作是支持向量机（Support Vector Machine，SVM）
    和核方法 （Kernel Trick）。


    这一学派主要以统计学理论作为支撑。除了SVM外，贝叶斯网络 （Bayesian Network）、最大期望算法 （Expectation-Maximization
    algorithm，EM）也是统计学习中非常著名的方法。它们的提出者是美国加州伯克利分校的迈克利·乔丹（MichaelI Jordan），他是改进BP算法的大卫·鲁姆哈特的博士生。迈克利的门下出了很多知名人士，如前百度人工智能实验室主任、大型在线学习平台Coursera^(\[2\])的联合创办人、斯坦福大学计算机科学系和电子工程系副教授吴恩达（Andrew
    Ng）及卡耐基梅隆大学的邢波教授。


    进入21世纪以来，随着现实世界可以记录的数据量迅速增长，硬件设备的计算能力显著增强，联结主义卷土重来，以深度学习的名义重新焕发光彩。这得益于大数据和强大的计算能力，深度学习网络在语音、图像、文本等领域取得了巨大的成功，表现出了比以往模型更加优越的性能。


    这一领域的代表人物有三位：多伦多大学的杰弗里·辛顿（Jeoffrey Hinton）、纽约大学的延恩·勒昆（Yann LeCun）和蒙特利尔大学的约书亚·本吉奥（Yoshua
    Bengio）。他们3个联手于2015年在《自然》科学杂志上发表长文，向人们科普了这一正给我们的生活带来深远影响的技术。


    他们是新一轮神经网络复兴的发起者，联手解决了深度网络训练中预训练和初始化参数的问题，还发明了自编码器、深度信念网络等多种网络结构，并且他们本身关系也很好（图5-19）。


    ![](images/5dbc042964d38956c57d750ebc06ee79.jpg)


    图5-19 人工智能主要“大牛”人物关系


    其中，杰弗里·辛顿（Jeoffrey Hinton）是延恩·勒昆（Yann Lecun）的博士后导师，迈克利·乔丹（MichaelI Jordan）是约书亚·本吉奥（Yoshua
    Bengio）和吴恩达（Andrew Ng）的博士后导师。同时，约书亚·本吉奥（Yoshua Bengio）和延恩·勒昆（Yann Lecun）共同在 AT&T
    的贝尔实验室工作过。近年来，大热的神经网络模型“生成对抗网络 （Generative Adversarial Net）”的作者，来自谷歌的克里泽夫斯基（Alex
    Krizhevsky）是延恩·勒昆（Yann Lecun）的学生。


    \[1\] BP算法：BP即Error Back Propagation的缩写，BP算法即误差反向传播算法。


    \[2\] Coursera：大型公开在线课程项目，由美国斯坦福大学两名计算机科学教授创办。旨在同世界顶尖大学合作，在线提供免费的网络公开课程。Coursera的首批合作院校包括斯坦福大学、密歇根大学、普林斯顿大学、宾夕法尼亚大学等美国名校。


    ## 5.4 国内人工智能医疗企业人才


    2017年7月6日，领英发布《全球AI领域人才报告》，中国人工智能领域专业技术人才总数超过5万人，排名全球第7位，印度、英国、加拿大和澳大利亚分列2～5位。而美国有超过85万名的AI人才。


    动脉网蛋壳研究院收集了我国11所高校和中科院4所研究所（计算机所、声学所、软件所、自动化所）共15家单位的AI专家和硕博人才，发现其中有数据统计的9所高校和中科院在读的AI硕博人才总和为2300多人。


    在医学领域，动脉网发现47名医疗人工智能创业公司的CTO或首席科学家，其中有30名都曾在国外或我国的香港、台湾地区进修过，占比达63.8%，而与医学专业相关的人才仅有7人，占比达14.9%^(\[1\])。


    在机器学习、计算机视觉、自然语言处理、语音识别和模式识别五大研究方向中，模式识别的专家最多，占比达30%，语音识别的专家占比仅为4%，且多数来自中科院声学所和哈尔滨工业大学。模式识别可以简单理解为机器学习，在深度学习、机器学习没出现之前，在大学从事人工智能研究的专业称为模式识别。


