    ## 2.3.5 医学影像领域的人工智能问题

    （1）优化目标的定义。临床上很多问题的定义是模棱两可的，我们只能凭经验、凭一些医生的日常行为来粗略地刻画问题，很难用可量化的指标对问题进行精确定义。一旦问题定义不精确，最后问题建模后的结果必然不对，所以优化目标的精确定义是非常重要的。

    （2）能否拿到足够多的可用数据。数据是深度学习算法的核心资源，算法需要大量数据进行训练。现阶段，我国的医疗影像仍处于从传统胶片向数字化过渡的阶段，大量影像资料尚未数字化。医院之间的数据共享和互通程度较低，获取大规模的医疗影像数据对于相关企业来说是一个考验。患者疾病数据归属权还没有界定，目前各企业对于非公开数据的使用还存在风险。

    在获取数据的基础上，深度学习结合先验知识对模型进行训练，训练数据集需要事先标注。大多数标注依赖人工识别，因此数据标注、标准化将耗费大量人力和时间。

    （3）模型的可解释性。这是与临床结合做研究的时候出现的一个独有的问题。临床是和人的生命息息相关的，所以做任何一件事情都要有理有据，都要有因果推论的关系。但是，做机器学习模型时，很容易陷入直接对相关性进行建模的陷阱里。相关性建模涉及的两个因素未必有直接的因果关系，得出的这个模型如何解释它最后结果的意义，是一件很难处理的事情。这一点就横亘在很多模型最后产品化、产业化的路上。如果不解决可解释性问题，就很难迈过这道门槛，把机器学习成果投入实际产业化。


    ## 2.3.6 “医学影像人工智能+”的跨领域协作

    在我们的统计数据中，医学影像已经成为人工智能在医疗领域最热门的方向。我国医疗影像领域已经涌现出大批的人工智能创业公司，腾讯、京东等大公司也开始布局，研究如何让机器识别病灶，并判断肿瘤的良恶性，但是大多数的公司现阶段仅仅是利用影像信息进行判断。

    动脉网此前采访过很多医生，他们表示利用机器识别病灶确实帮助医生减少了漏诊，提高了效率，但是判断肿瘤的良恶性及患者罹患哪种癌症，是需要结合临床信息、病理信息甚至基因测序来判断的，而仅凭借放射影像只能识别肿瘤的位置和大小。

    沃森影像临床评估采取的是结合临床数据辅助医生诊断。通过创建更加连续可靠的电子病历，以提高医学报告质量和计费过程的准确性。目前，这个产品从主动脉瓣狭窄切入，如果心脏病专家给出主动脉瓣狭窄的诊断，沃森影像临床评估就会确认该诊断是否上传到电子病例中，上传的内容是否包括患者的问题列表和诊断记录。

    IBM还成立了沃森健康医学影像合作组织，这个合作组织由15个领先的卫生机构、医学学术中心、流动放射学提供商和成像技术公司组成。到目前为止，该组织研究的病种已经涵盖乳腺癌、肺癌、糖尿病、眼病、脑病、中风和心脏病等疾病。

    推想科技采取的是开发放射组学影像产品。放射组学（Radio Mics）是以定量成像、特征计算、图像分析、模型构建为基础的新兴前沿学科方向。它利用了若干影像特征直观、定量地描述了临床中肿瘤的形态和病理，从而为临床决策提供了有力的影像学支持。目前的临床应用大概有以下4种：

    （1）放、化疗的疗效评估预测应用。

    （2）肿瘤分级应用。肿瘤分级在临床中具有重要意义，它关系到临床诊疗决策和影像治疗方案的制订。

    （3）肿瘤良恶性辨别应用。放射组学中的特征可以在很多临床应用中鉴别肿瘤的良恶性，从而对临床决策起到指导作用。

    （4）肿瘤遗传学应用。

    研究发现，在肿瘤病理学与肿瘤基因之间存在很强的关联，研究肿瘤遗传学可以给肿瘤诊断提供生物学方面的基础，影像组学恰好就是病理学与基因学之间很好的结合，可以作为肿瘤遗传学研究的重要手段。

    推想科技引进人工智能基因专家，也是因为发现疾病的诊断与治疗不是影像一个领域就可以解决的，它需要综合基因、影像、病理等多方面的信息。

    爱康国宾从应用方角度出发，实现了医学影像+液体活检的结合。以往的肿瘤筛查是通过CT图像或者病理图像来做的，CT图像只能“定位”，却不能判断结节的良恶性，而且漏诊、误诊率很高。虽然病理筛查是金标准，但是病理图片的获取过程太繁杂，所以通过医学影像与液体活检结合进行肿瘤的判断，是很好的方法。

    如果通过液体活检检查出血液中含有癌细胞碎片，就再通过CT影像判断肿瘤的位置。这个影像可以由专家判断，未来可能由获得批准、高水准的人工智能系统来判读。这么做既实现了肿瘤的“定性”，又实现了肿瘤的“定位”，医生根据这些信息可以直接制订治疗方案。

    大公司有能力独立研发新的领域，创业公司也有自己的思路：组建医学人工智能联盟。例如，从事眼底糖网筛查、病理图像识别、放射影像识别、辅助诊疗系统研究的公司，产品成型以后，可以组成一个联盟，大家在平等互惠的前提下，达成一起落地医院、资源数据共享的合作，这样可以抱团形成更强的竞争力和影响力。

    综合来说，医学人工智能合作研发的新形式有两种，一种是独立研发，另一种是组建联盟。其出发点不像阿里、百度那样组建一个全面的平台，而是根据实际的临床需求、医院需求和公司需求，自然形成一种商业或研发模式。

    “医学影像人工智能+”这种概念就像“互联网+”一样，虽然目前的合作领域是临床信息、基因检测、病理信息等，但是未来一段时间它可以和更多医疗人工智能领域合作，而且以后也不局限于以医学影像人工智能为中心的合作方式，也有可能是各医疗人工智能领域的交叉合作。这种形式可以帮助医学影像AI产品落地，让医学影像AI产品更加接近真实的临床场景，做好医生的助手。

