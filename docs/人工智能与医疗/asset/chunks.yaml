- raw: '（3）临床决策支持。临床对于辅助诊断的要求甚高，医学数据或者说辅助诊断场景中，对于结论的可推测性——因果推测链条要求十分严格。在这个场景下，大数据里常用的基于相关性结论的应用和产品设计，并不适用于医学这个特殊领域。


    因此，必须要从统一标准的角度入手，利用深度学习构建辅助诊断的模型，最大限度地降低医生的工作量，同时又能尽可能地以客观公正的态度帮助医生提出第三方诊疗建议。这样就能避免基层全科医生由于经验缺乏，出现误诊、漏诊的情况。


    医疗大数据辅助决策系统的核心运行机制是基于海量的医疗大数据，同时将各学科专家的经验囊括到系统中，技术人员应用先进的IT技术、深度学习算法等针对特定领域进行专业的定制，从而向医生提供可视化、场景化、智能化的系统解决方案。医生在使用过程中的反馈又能够不断地优化系统，提升系统的准确性。


    目前，以IBM沃森 （Watson）为代表的认知技术可以读懂并分析那些无法被传统计算机识别的非结构化数据，而这些数据占整个数据信息的80%。沃森的肿瘤专家吸收了美国100多年的癌症临床治疗实践经验，接受科学训练超过4年。和纪念斯隆－凯特琳癌症中心的顶级专家组所给出的治疗方案相比，它已经达到了接近100%的符合度（不同癌种符合度有所不同），至今已覆盖了肺癌、乳腺癌和结直肠癌等几大领域。


    沃森会先从患者的病历中提取关键词，再从海量数据中迅速筛选出重点数据；而后为患者量身定制出多款“个性化”治疗建议。同时，它会在提出的每种建议后面注明出处和依据，并按照可信度的大小顺序排列，供治疗医生参考；当医生选定了某种治疗方案之后，它还会给出采用此方案的病例数、生存率、不良反应发生率等相关信息，帮助医生总体评估该方案的疗效与风险。从医生输入到沃森输出，仅需数秒时间。


    ### 2．问题和挑战


    （1）最大的挑战是高质量的病历获取。目前，医院是病人数据的集中来源地，医院是否愿意合作，愿意提供多少数据成为关键。


    （2）患者资料的数据伦理问题。因为人工智能需要从过往数据中进行学习，才会使其拥有智能，并得到提高。我国目前对此领域在政策上尚未明确如何利用数据，哪些数据可以利用，哪些数据不能利用，这是所有病历/文献分析企业所要面临的问题。


    ### 案例介绍


    ### 森 亿 智 能


    森亿智能是一家专注于利用人工智能进行医学文本自动分析和数据二次应用的公司，依据医疗IT企业、保险、药企、医院等B端客户的需求，将案例/病历进行结构化、可视化处理，将处理后的数据应用到医保控费、药物研发和临床决策支持等方面。


    森亿智能的人工智能系统像一个有经验的医生一样，可以精准、完整地读懂病历所表达的含义，并消解其中的歧义。系统利用自然语言处理技术，深度挖掘和分析医疗文本的信息，快速批量抓取病历中的信息，并生成一个结构化数据库。这个抓取环节可以为医生节省数月的时间，把这个过程的耗时压缩到几秒以内。


    目前，该系统全科室综合准确率为90.2%，可以识别13大类临床变量，识别19类变量语言关联，可实现全自动生成结构化数据库。更重要的是，森亿的自然语言处理不依赖任何人工规则，在面对新的病种、新的病历时，完全通过机器学习来完成模型构建，从而使产品在面对不同场景时可实现灵活定制、高速迭代。


    森亿智能有两种盈利模式，主要是针对B端客户。一是开放中文病历语义API，为机构提供无缝对接不同的平台和系统的可插拔式模块；二是为保险公司等第三方管理公司提供取代人工的智能病历分析服务，并辅以一线临床数据的细分市场报告、精准收费核算支持、深度风险评估，全面提升医保质量与效益。


    表2-13所示为森亿智能融资轮次。


    表2-13 森亿智能融资轮次


    ![](images/82315afc6412d5b64d777de441627e6d.jpg)


    ### 索 闻 博 识


    索闻博识成立于2014年，公司开发的核心产品“博识医疗云”目前已经是国内规模领先的疾病专业化、数据结构化的云端数据库及电子病历平台，覆盖肿瘤、血液、骨科、神经外科、神经内科等重大疾病领域，在全国400余家三甲医院的超过2700个临床科室实现了落地应用。其中，肿瘤（含血液肿瘤）相关科室超过1200个。


    在此过程中，博识团队理解并攻克了各科室医生在诊疗过程中的复杂场景和需求，在产品的概念设计上融入了临床医生的观点。


    博识医疗云是一款能够满足不同科室复杂需求的全能型产品，并于2015年年底正式上线运营。博识医疗云之所以要做疾病专业化的电子病历，是基于疾病诊断治疗的底层信息化需求。它的意义在于，一旦系统普及到一定程度，就能形成下一代的疾病诊断标准和指南。


    表2-14所示为索闻博识融资轮次。


    表2-14 索闻博识融资轮次


    ![](images/fcd32f6c979fc7e8afdf656e911b45af.jpg)


    ## 2.5 医院管理


    医院管理，顾名思义，是指以医院为对象的管理科学，它根据医院工作的客观规律，运用现代的管理理论和方法，对人、财、物、信息、时间等资源进行计划、组织、协调、控制，充分利用医院的现有资源实现医疗效用的最大化。


    ## 2.5.1 人工智能应用于医院管理的优势


    人工智能在医院管理应用上主要有两个方向，分别是优化医疗资源配置和弥补医院管理漏洞。


    ### 1．优化医疗资源配置


    人工智能根据医院的情况，制订实时的工作安排，其目的在于优化医院的服务流程，最大限度地利用好现有的医疗资源。


    传统的医院管理方式完全依靠人工，所带来的问题一方面是医护工作者不能将全部精力投入医疗工作中，造成医疗资源的浪费；另一方面是医护工作者的工作任务已经非常繁重，如果再给予他们更多的行政事务，就很容易造成工作上的低效。


    人工智能能够很好地弥补传统的人工进行医院管理带来的问题。人工智能应用机器学习等方式，根据医院已有的信息进行建模，训练出一套精准的算法，并在实际应用中不断实现自我更新，使模型更有针对性。


    表2-15所示为优化医疗配置的传统方式和人工智能方式比较。


    表2-15 优化医疗配置的传统方式和人工智能方式比较


    ![](images/d3bca5046e70c77b5e1e5a3880592690.jpg)


    在人工智能的帮助下，医院的运营流程将得到优化，医院的运营效率将稳步提高。传统的人工式管理由于种种主观和客观的因素，导致医疗资源不能高效地匹配到最需要的患者身上。但人工智能可利用大数据，从宏观层面协调资源的分配。它能根据电子病历、既往病史等信息分析出哪些患者是最需要及时救治的，把医疗资源优先提供给他们，优化医疗服务的先后顺序。


    ### 2．弥补医院管理漏洞


    人工智能调查患者对医院的评价，总结医院存在的问题，并给出解决方案，其目的在于提升患者对医院的满意度，提高医院的营收。近年来，随着“以患者为中心”和“以价值为导向”的医疗理念逐渐被公众认同，患者体验在整个医疗行为中的地位越来越受到重视。德勤在2017年4月发布的调研报告显示，良好的患者体验将在很大程度上提高医院的营收。基于种种需求，弥补医院管理漏洞的人工智能系统应运而生。


    这种系统能够从点评网站、社交平台和新闻媒体等渠道收集客户对医院的评价，通过自然语言处理技术将非结构化的数据处理成能被系统识别的结构化数据，根据已经搭建好的模型，系统能够整理、分析出各种评价背后的真实含义，最后将信息总结成可视化的图表，呈现给医院的管理者，告诉他们根据客户的评价医院在哪些方面做得不到位，可以通过哪些方式进行整改。


    在相对流程化的信息收集阶段，人工智能较人工收集的优势是非常明显的。对信息的收集和过滤往往需要耗费人工几周甚至几个月的时间，而人工智能系统全部进行数字化处理，将时间缩短至几个小时或几天，大大减少了工作量。


    医院传统的调查方式存在形式单一、反馈有限等问题，而人工智能能够从内部和外部多个渠道收集客户对医院的真实评价。以往的医院满意度调查是人工操作，而满意度调查有可能直接影响到各个部门的绩效考核等相关利益，因此调查项目可能流于形式。而人工智能完全由机器进行分析，不带有任何主观的情感和利益考量，因此能给出客观、公正的调查结果。


    两种方式的对比如表2-16所示。


    数据收集和分析的准确性直接影响到后续整改方案落实的有效性。如果在数据收集和分析上就存在问题，之后的整改方案就是完全徒劳的。人工智能系统在给出分析结果后，还能给医院管理者提供一系列建议，供他们采纳。


    表2-16 弥补医院管理漏洞的传统方式和人工智能方式比较


    ![](images/45779de6dc9f6c10995d3fa4b1d62c1e.jpg)


    在人工智能的协助下，医院能够在多个衡量医院管理能力的维度上实现明显的提升。以医院管理的标杆型企业Qventus^(\[1\])为例，某医院在使用了它所提供的人工智能系统后，在图2-28和图2-29所示的8个维度的表现方面有所改善，同时患者对医院的满意度从第29位提高到第3位。


    ![](images/061c7d46e2d9247fb01b3e061a414c17.jpg)


    图2-28 患者在医院等待和停留的时间减少，医疗效率提升


    ![](images/f060768b0ec8d90598367da4ffbf947e.jpg)


    图2-29 医院的运营效率提升，患者满意度增加


    ## 2.5.2 布局在医院管理的人工智能企业


    前面对优化医疗资源配置和弥补医院管理漏洞的企业进行了梳理：在医院管理布局的人工智能企业多集中于国外（表2-17和表2-18），在国内的人工智能企业中，蛋壳研究院查询到杭州百世伽科技涉足医院管理。


    表2-17 弥补医院管理漏洞的人工智能企业


    ![](images/382dd501ca44412530f40ad91fdc3463.jpg)


    续表


    ![](images/9f7eca9ab4592efffe452a9082a8cffb.jpg)


    表2-18 优化医疗资源配置的人工智能企业


    ![](images/48a68d05c23cfd62905e0362f1efe313.jpg)


    续表


    ![](images/a8213366cd05a82b57b3224a6415587c.jpg)


    需要注意的是，虽然部分人工智能企业提供分级诊疗、远程医疗等与医院运营相关的服务（如专注于人工智能医学影像诊断的锐达医疗），但是最根本的人工智能技术仍应用在医学影像、智能语音等环节，在医院管理上并未使用到人工智能，因此我们未将这部分企业计入。


    ## 2.5.3 人工智能与医院管理企业的盈利模式


    在商业模式上，应用于医院管理的人工智能系统一般采用按时间收费的方式。企业根据医院的具体情况，核算出业务功能的计算复杂程度，核定后按照季度或年度的方式进行收费（图2-30）。在美国，人工智能+医院管理企业主要以大型的连锁医院作为主要客户，因为这部分客户有足够的预算进行采购，属于高价值客户，且美国民营医院占据主体地位，市场竞争激烈，这些连锁医院有强烈的动力采购这样的人工智能系统来改善自己的运营能力，在各类第三方医疗机构排行中占据领先的位置。


    ![](images/aa57d5d149a399a7dd5ba50353b4f3e1.jpg)


    图2-30 人工智能与医院管理企业的盈利模式


    以另一家人工智能与医院管理的标杆型企业NarrativeDx^(\[2\])为例，它目前的客户就包括了美国规模较大的3个医疗机构：克里斯蒂娜健康系统（Christina
    CareHealth System）、纽约大学朗格尼医学中心（NYU Langone Medical Center）和怕利塞德医疗中心（Palisades
    Medical Center）。


    从目前我国人工智能在医院管理的应用情况来看，其普及速度不会那么快，短期确实很难看到一个很好的商业盈利模式。与人工智能影像诊断等设备在投入使用后就能看到立竿见影的收益不同，人工智能在医院管理的应用需要较长的周期才能获得收益，因此医院对人工智能应用于医院管理的动力不足。


    但是，人工智能改变医疗和管理已经势不可挡。国家已经把发展AI事业写入国家发展战略与规划中，这对目前在做AI的创业公司而言，是一个非常大的利好消息。抓住历史机遇，突破重点领域，促进人工智能产业发展，未来的AI行业必定会呈现加速度的发展。只要坚定地做下去，价值就一定会体现出来。


    ### 案例介绍


    ### Qventus


    Qventus（曾用名AnalyticsMD）是一家提供医院智能决策分析系统技术的初创公司，面对传统医院管理方式效率低下、大量资源被浪费的现状，Qventus专注于解决急诊室、手术室等系统的运营挑战，使用实时数据追踪、分析、预测和优化医院业务。


    Qventus帮助医院建立SaaS系统有两个目的。一个目的是可以让医院的管理者实时掌握目前的工作状态和进度，做出更好的选择，不落后于其他同行；另一个目的就是提高患者和医护人员看病的质量和效率，如医护人员和病床之类的资源可以在空出来的第一时间被利用，防止出现病人在急诊室门口无人医治的情况。另外，只要使用了Qventus开发的系统，利用系统分析的数据，就可以得到如何让病人避免遭遇治疗瓶颈的建议等。


    Qventus分析出来的辅助性决策或者预警性信息会通过电话或者手机短信的形式发送到医生及护士的手机上，方便他们及时调整策略。


    图2-31所示为Qventus的人工智能系统服务流程。


