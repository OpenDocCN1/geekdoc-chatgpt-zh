    ## 企业案例


    ### 推 想 科 技

    推想科技是国内第一家形成临床应用的深度医学人工智能公司，成立于2015年年初。目前，推想科技的产品可以提供3个方面的服务：智能影像报告检验、智能辅助筛查和智能鉴别诊断。

    推想科技智能CT线辅助筛查产品可自动标记出CT各层面上病灶的位置，辅助医生快速准确地完成CT诊断。这样医生就不用花那么多时间在健康人群上，而把时间用在重大疾病的诊治上，不仅可以减少重复性劳动，还可以减低医生的疲劳度。

    在诊断速度方面，一个医生完成20个病例的诊断需要3个半小时，利用推想人工智能产品，就算是最低配置的计算机只需6分15秒。

    在诊断准确率方面，人工智能对于大小结节的综合灵敏度是85%左右，针对不同大小的结节，敏感度情况不同。推想科技2017年3月9日的测试数据显示，对于0～3mm的结节，推想科技模型敏感度为84.03%；对于3～6mm的结节，模型敏感度为88.31%；对于大于6mm的结节，模型的敏感度为100%。

    随着算法模型的不断完善，迭代速度不断加快，推想科技的服务领域也逐渐向头部、腹部、股骨头、病理和超声等领域延伸，覆盖100多种疾病。

    2018年3月19日，推想科技宣布完成3亿元B+轮融资，投资方由启明创投领投，红杉资本、元生资本、襄禾资本、尚珹基金组成。这是迄今为止医学影像人工智能行业内最大规模的单笔融资。此轮融资将继续深耕AI医疗影像细分领域，所融资金将全部投入AI医疗影像产品的研发、生产及国际化营销方面（表2-9）。

