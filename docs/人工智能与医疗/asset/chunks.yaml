    在美国毕业的学校多为麻省理工学院、卡耐基梅隆大学、加州大学洛杉矶分校等，但从统计数据来看，在哪个学校毕业与在医疗行业做研究并无关联，这其实主要看个人的发展与机遇。在这些技术专家中，博士毕业的占比为
    70%，硕士毕业的占比为 18%，本科毕业的占比为 12%（图 5-25）。人工智能医疗还是一个技术门槛很高的行业。


    ![](img/f5c9fb3e891c109090c03754e667ef56.jpg)

    图 5-25 毕业专家学历比例分布


    从综合报告的数据来看，中国未来的 AI 人才主要分布在一些高校的实验室中，如清华大学、北京大学、哈尔滨工业大学等，他们中的一部分会出国深造后再回国，一部分会直接创业或就职于大型科技公司，无论是人工智能医疗公司还是其他行业公司的人力资源部，如果想招到优秀人才，那么这些学校会是不错的选择。


    最后，在调研过程中，动脉网还了解到，中国的高校目前非常重视培养 AI 人才，但是缺乏对医疗领域 AI 人才的培养。而正是这些缺失的交叉学科人才对行业理解更深入，更受企业欢迎。


