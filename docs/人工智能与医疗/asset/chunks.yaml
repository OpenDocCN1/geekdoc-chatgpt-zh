    ### 5.4.2 人工智能医疗公司的 AI 人才现状


    据某行业内人士透露，现阶段不仅人工智能人才短缺，人工智能医疗人才更加短缺。其所在实验室中，前后两届毕业生中只有该人士自己从事医疗行业。该现象在高校中比较普遍，AI
    人才从事医疗行业的人数大约只占十分之一。为此，动脉网梳理了医疗创业公司的 CTO、CEO 和首席科学家的毕业院校与专业，如表 5-7 所示和图 5-23 所示。


