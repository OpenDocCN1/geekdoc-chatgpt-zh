- raw: '美国儿科医学会建议父母在孩子出生后的第9个月到第36个月带他们进行多项发育障碍的早期筛查，其中最重要的项目就是自闭症筛查。尽早筛查可以有效地避免错过黄金干预时间。一旦错过最佳干预时间，这些发育障碍造成的影响就很可能伴随患者的一生。然而，美国疾病控制和预防中心的报告显示，美国有约15%的儿童患有不同程度的自闭症等发育障碍，但其中只有不到一半的儿童接受过早期筛查。


    Cognoa^(\[2\])设计了一套应用于儿童自闭症早期筛查的人工智能App，用户通过软件可以智能地对自闭症儿童进行筛查（图2-15）。通常，自闭症儿童在3岁前无明显特征，而传统筛查方式需要提前预约、前往医疗机构、等候医生筛查等一系列程序。因此，很多父母在未发现孩子有明显异常的情况下，不会“杞人忧天”地带孩子去做自闭症筛查。


    ![](images/a2aa8f0085357c2147e1b0c2baf1310c.jpg)


    图2-15 Cognoa儿童自闭症早期筛查App


    人工智能筛查App的出现，让父母不再需要进行烦琐的准备工作，只要一部智能手机就可以随时随地对孩子进行自助式的自闭症筛查。填写完孩子的基本信息，然后根据孩子的具体情况回答15～20个和他们行为有关的问题，最后系统会自动生成筛查报告。


    整个筛查方案的关键在于在线问卷设计的可靠性和结果的准确性。这些问题的理论依据来源于Cognoa创始人丹尼斯·沃尔（Dennis Wall）博士超过5年的临床研究。在此期间，他的团队在哈佛医学院和斯坦福医学院对超过10万名自闭症儿童的患病情况进行了跟踪研究。


    临床研究中产生的信息汇总成庞大的数据库，再利用机器对海量的医疗数据进行学习，从而训练出一套独特的算法。当用户在App中输入儿童的行为信息时，系统会根据已经建立的算法得出对应的筛查结论。


    ### 3．阿尔茨海默病预测


    来自英国的Avalon AI公司通过分析脑部核磁共振图像（MRI），可以预测在未来患阿尔茨海默病的概率。该公司利用深度学习技术开发计算机医学影像诊断工具，目前对阿尔茨海默病的有效预测准确率已经达到了75%。


    目前，医学界诊断阿尔茨海默病病情程度的生物指标主要有两个：一是海马体（相当于大脑记忆芯片）的大小；二是脑室的大小，因为脑室体积会随着脑组织退化而增大。Avalon
    AI公司的研究员通过细致地研究大脑灰质和白质的变化、脑脊液的情况，观察大脑从轻微认知损害发展成阿尔茨海默病的过程中，这些物质相应会有怎样的改变（图2-16）。


    ![](images/00469c0b6db7c23b32b7eba1a535050a.jpg)


    图2-16 Avalon AI脑部核磁共振图像预测阿尔茨海默病


    要进行这些研究，首先需要制作一个大脑3D磁共振图像，把它与其他样本进行对比，然后用卷积神经网络（CNN）技术对这个图像中的大脑做特征分析。卷积神经网络的原理和人的皮肤类似——网络的每一层都提取这个大脑扫描图中的一些简单特征，然后层层叠加，重新组合成复杂的特征集合。这种神经网络的分析方法不仅需要横向分析同等失智程度大脑的相似特征，还需要纵向比较不同失智程度大脑的相异特征。通过层层分析对比，就能够判断大脑是否损伤，或者失智程度有多严重。


    ## 2.2.2 疾病的预测


    ### 1．脑疝预测


    大面积脑梗死是一种常见且非常严重的神经内科疾病，其发病人数约占所有脑梗患者的10%，而且死亡率极高，大约为80%。^(\[3\])大量研究表明，患者在症状发生恶化之前积极干预的效果比后期干预更好，因此早期对患者预后进行有效判断，从而选择有效的治疗方案，是脑梗患者治疗成功的关键。


    《中国卫生统计》2014年刊登了一篇名为《利用人工智能系统预测大面积脑梗死患者的转归》的论文。论文指出，利用人工神经网络多层感知机建立多因素预测模型，对大面积脑梗死患者的预后进行预测，在单因素模型中预测效果最好，AUROC（受试者工作特征曲线下的面积）为0.87^(\[4\])。最终得到结论：人工智能随机森林模型可用作医学辅助诊断系统，来预测脑疝在大面积脑梗死患者中的发生概率。


    ### 2．慢性肾病分级预测


    目前，世界上有超过5亿人患有不同种类的肾脏疾病，但是全社会对于慢性肾病的知晓率不足10%。因为慢性肾病早期没有明显症状，很容易被忽略，很多患者都是等到肾功能恶化时才去就医。因此，肾病分级预警迫在眉睫。华南农业大学食品学院的研究员基于人工智能对肾小球过滤进行过预测，通过BP神经网络构造了预测模型，最终构建出一个实用性良好的慢性肾病分型预警模型。


    ### 3．心脏病患者死亡预测


    英国科学家曾在《放射学》（Radiology）杂志上发表研究文章，研究结果认为人工智能可以预测心脏病患者何时死亡。英国医学研究委员会下的MRC伦敦医学科学研究所称，人工智能软件通过分析血液检测结果和心脏扫描结果，可以发现心脏即将衰竭的迹象。


    研究人员是通过对肺高压患者的研究得到上述结果的。这项技术能让医生发现需要更多干预治疗的患者，从而拯救更多的生命。


    肺内血压的增高会损害部分心脏，大约三分之一的患者会在确诊之后的5年内死亡。目前的治疗方法主要有直接将药物注射到血管及肺移植，但是医生需要知道患者还能存活多久，以便选择正确的治疗方案。


    研究人员在人工智能软件中录入了256名心脏病患者的心脏核磁共振扫描结果和血液测试结果。人工智能软件测量的每次心跳中，心脏结构上均标记了3万个点的运动状况，根据这个数据，再结合患者8年来的健康记录，软件就可以预测哪些异常状况会导致患者的死亡。人工智能软件能够预测未来5年的生存情况，预测患者存活期只有一年的准确率大约为80%，而医生对于这个项目的预测准确率为60%。^(\[5\])4．骨关节炎发展预测


    卡耐基梅隆大学生物工程博士Shinjini Kundu在一次会议上展示了人工智能在骨关节炎发展方面进行预测的研究。骨关节炎是关节软骨退化造成的骨损伤或关节边缘的反应性增生，以往患者只有在感觉到疼痛而去医生处就诊时才能通过MRI图像发现问题，而此时软骨已经出现了问题。


    在Kundu的研究中，通过收集大量人群10年间的软骨MRI影像数据，利用人工智能寻找健康人群和患病人群的影像差别。正常人的软骨上的水是均匀分布的，而患有骨关节炎的患者，其MRI图像上红色部位有水的聚集。人工智能通过大量图像数据的学习，能够发现正常人的软骨中的异常，从而预测出未来3年患骨关节炎的概率（图2-17）。据介绍，这套系统目前的准确度已经达到了86.2%，如果你提前知道未来可能会患上骨关节炎，那么从现在开始，就应该注意身体的各个方面，远离疾病的困扰。


    ![](images/71a9913c477e8a1ce68cc9e0568f3873.jpg)


    图2-17 骨关节炎的预测


    ### 5．流行病风险预测


    医疗人工智能通过对医疗大数据的收集分析，可在多个方面提高医疗系统的效率。人工智能在公共卫生领域中的应用，可以帮助疾控部门提升疾病预防和控制的水平。通过人工智能预测模型和医疗大数据的收集，能够完成城市或国家层面的流行病风险预测。通过这样的预测，居民健康管理水平将大大提高，有助于降低医疗成本支出。


    中国平安与重庆市疾控中心联合课题组研发的全球首个流感预测模型取得阶段性进展：利用平安的大医疗健康数据、人工智能技术及重庆市疾控中心的监测数据，能够提前一周预测流感的发病趋势，并在验证中取得准确的预测效果。该流感预测模型可以帮助重庆公共卫生部门及时监控疫情，并指导民众进行疾病预防。模型能够精准预测个人和群体的疾病发病风险，提升疾病事前预防的成功率，帮助政府医疗系统降低国家疾病与防控工作的成本。


    \[1\] 数据来源：动脉网蛋壳研究院《2017医疗大数据和人工智能产业报告》。


    \[2\] Cognoa：世界上最大的业务智能软件制造商，其能够帮助用户提取公司数据，然后分析并汇总，最终得出报告。


    \[3\] 数据来源：动脉网蛋壳研究院《2017医疗大数据和人工智能产业报告》。


    \[4\] AUROC为综合评判灵敏度和特异的指标，AUROC越大，其预测的准确性超高。


    \[5\] 数据来源：动脉网蛋壳研究院《2017医疗大数据和人工智能产业报告》。


    ## 2.3 医学影像


    现代医学是建立在实验基础上的循证医学，医生的诊疗结论必须建立在相应的诊断数据上。影像是重要的诊断依据，医疗行业80%～90%的数据都来源于医学影像，所以临床医生有极强的影像需求。他们需要对医学影像进行各种各样的定量分析、历史图像的比较，以便能够完成诊断。


    医学数字成像和通信（DICOM）与其他数字影像和通信一样，有一个储存和交换医学图像数据的标准解决方案。该标准自1985年第一版发布以来已经被修改多次，标准包含一个文件格式以及一个通信协议。


    表2-2所示为主要的DICOM数据库。


    表2-2 主要的DICOM数据库


    ![](images/865394c6798f3aa178678bb86e8d0a53.jpg)


    所有患者的医学图像都被保存在DICOM文件格式中。这个格式中保存着患者的受保护健康信息，如患者姓名、性别、年龄，还有一些医疗图像的数据。“医学成像设备”创建了DICOM文件。医生们使用DICOM阅读器和能够显示DICOM图像的计算机软件应用程序来查看医学图像，并且根据图像的信息做出诊断。


    但对于图像的识别，长久以来人工智能的研究者们大多采用图像匹配的方式进行，并没有找到较好的特征提取方式。直到2010年，人们终于找到了更好的建模、训练的方法——深层神经网络，它可以自动做特征抽取、表达抽取的工作。此后，“深度学习”的概念就被广泛应用了。


    深度学习属于表征学习，拥有较强的表征处理能力，可以很好地把很多现实问题转换为可以处理的形式。它擅长处理的是高维度、稀疏的信号，图像就是这些信号中一种有代表性的形式。在医学影像领域，使用的算法通常为卷积神经网络。


    Tips：卷积神经网络（CNN)


    我们假设世界（图像）是由很多很小的部分（特征）组合而成的，当卷积网络作用于图像时，随着深度的增加，它会提取出更高层次的抽象特征，而这些特征对图像的识别非常有用。原始的机器学习方式是需要人来手工设计特征的，再在设计后的特征上训练分类器，而深度学习高效地自动化了特征抽取及表示这部分的工作，因此现在已经成为图像处理的主导技术，被视为一种自动学习层级化特征表示的学习方法。


    “人工智能+医学影像”便是计算机在医学影像的基础上，通过深度学习完成对影像的分类、目标检测、图像分割和检索工作，协助医生完成诊断、治疗工作的一种辅助工具。


    ## 2.3.1 人工智能参与医学影像诊断的方式


    人工智能的本质是计算机通过对已有资料进行经验积累，自动提高对任务的处理性能。探索人工智能在医学影像方向有哪些参与方式，首先要知道人工智能拥有什么样的能力。我们按照自己对深度学习的理解，将人工智能在图像处理上的能力分为4类：影像分类、目标检测、图像分割和影像检索。这4项能力在医学影像上分别对应着图2-18中的4个功能。


    ![](images/a74f9bba5a1a7f45774e9ce1dbdf8045.jpg)


    图2-18 人工智能+医疗影像的主要工作模式


    下面以肝部疾病筛查为例，介绍人工智能参与医学影像的方式。


    人工智能参与医疗过程首先要做的是获得大量带标注的医学影像样本，然后尝试在其中找到一些关键点。例如，要找靠近肺和靠近肝的点，把关键点找到以后，结合肝的形状鲜艳模型，设定一个初始化模型，再通过机器学习的方式学到边界应该是什么样的，病变应该是什么样的，尽量地逼近它的边界信息，再通过它的形状特征进行进一步的完善，最后获得好的分割和筛查结果。这一过程便是人工智能对图像的定位、分类和切割。


    当把脏器分割、病变标记出来以后，就知道患者这个部位有病变，但是并不知道患了什么病，病情发展到了什么程度。这个时候便需要对病理图像进行分析，从而获得辅助判断依据。


    病理分析是抽取疑似病变活体，放在显微镜上进行细胞形态分析的一种检验方式，是目前癌症的主要确诊方式。数字病理图像往往非常大，如部分肿瘤病理图像的尺寸达到了20万×20万像素，有的甚至达40万×40万像素，有非常多的细胞需要分析。这是极大的分析量，医生需要花费大量时间进行比对。随着病理图像包含的信息不断增加，这一工作交给医生来做开始变得不现实。


    通过搭建神经网络和利用深度学习算法，人工智能系统对包含各种病变形态细胞的病理库进行大量训练，获得识别病变细胞特征的能力。利用之前提到的分割算法，将细胞分割出来，通过大量比对，识别出细胞的病变形式及发展程度，为医生做出最后诊断提供辅助依据。


    医院大数据中，85%左右的存储容量被影像数据所占据，现在的计算机可以识别结构化的文本数据和结构化的影像数据，且正在探索将功能性医疗图像和结构性图像相融合的方式，以获得更好的诊疗效果。将上述4项能力进行组合，便得到了人工智能在医学影像上的具体应用。


    ## 2.3.2 人工智能为医学影像带来的改变


    人工智能为医学影像解决了什么问题？给医院、医生带来了什么样的改变？我们总结出，其实际解决了3类问题。


    第一，把信息更好地呈现给医生。现在成像越来越容易，分辨率越来越高，医生要看越来越多的影像，但是医生需要的不是数据，医生需要的是信息，怎么把这些信息更好地呈现给医生？人工智能能够完成脏器的定位、分类及分割工作，并将可疑位置进行标注，相当于为医生去除了干扰项，将更为直接的信息呈现出来。


    第二，帮助医生定量分析。医生非常擅长定性分析。看到片子，有经验的医生3秒内就可以大致判断是什么问题，但是需要一些工具做更精准的判断，定量的分析靠眼睛很难做到。这里面的工作包括各种各样的多模态分析、历史图像的比较、病人人群的分析，这些不是简单地用眼睛就能完成的，而是需要图像分割、图像配置、功能图像分析。


    第三，能够解决成像和智能图像识别的问题。这两个步骤很多年前是被分开的，技师拍片子，医生做分析。实际上，只有两者结合起来才能更有效地优化系统，为医生提供更好的服务。


    表2-3所示为传统方式和人工智能读片的区别。


    表2-3 传统方式和人工智能读片的区别


    ![](images/7c88a4a98e89e3f95767c5f963f441c4.jpg)


    就成像来说，一方面，缺乏高水平的技师，尤其是基层医院，有重复的成像造成影像资源的浪费。另一方面，高级成像功能复杂，有时候技师调整一下序列和参数，就能对图像质量造成很大影响。这里需要建立一个标准化、个性化的流程标准。


    标准化是指得到的图像需要有一个标准化的质量；个性化是指根据不同人的情况做出相应调整，如BMI高低不同的人在做CT图像的时候，它的成像参数有调整。剂量有调整，通过个性化来实现图像质量的标准，通过智能的手段来帮助医生和技师选择成像的参数，最终让没有经验的基层医生得到和三甲医院一样的医学影像。


    另外，随着3D成像技术的出现，医生有时候可以不用再看上百张平面CT图像，直接看立体图像就可以。


    再说回图像分析，医生看的片子有绝大部分都是健康人的片子，这就浪费了医生的时间，现在系统可以帮助医生先把健康人的片子去掉，把剩下的图像呈现给医生。针对异常的图像，系统直接标注出病灶、结节等异常的地方，医生只需要审核一下就可以，提高了医生的效率。


    总的来说，成像和图像分析结合起来，将健康人的图像进筛除，呈现给医生异常的图像，并做初步的标注，这极大地提高了医生的效率和诊断的稳定性，并在定量分析上带来了前所未有的新方式。


    ## 2.3.3 人工智能+医学影像在各领域的应用情况


    人工智能在医学影像领域目前的应用方向主要有3类，即疾病筛查、病灶勾画和脏器三维成像。我们总结了目前人工智能在医学影像方面主要覆盖的方式及主要使用的医学影像类型（图2-19），接下来将详细介绍目前人工智能在肺部筛查、糖网病筛查、靶区勾画、脏器三维成像方面的应用情况。


    ![](images/7cc66a16cea5c9c0fd77f2864857bb90.jpg)


    图2-19 人工智能在医学影像方面主要覆盖的方式及主要使用的医学影像类型


    ### 1．肺部筛查


    人工智能进行肺部筛查的步骤为，使用图像分割算法对肺部扫描序列进行处理，生成肺部区域图，然后根据肺部区域图生成肺部图像。利用肺部分割生成的肺部区域图像，加上结节标注信息生成结节区域图像，训练基于卷积神经网络的肺结节分割器，然后对图像做肺结节分割，得到疑似肺结节区域。找到疑似肺结节后，使用3D卷积神经网络对肺结节进行分类，得到真正肺结节的位置和置信度（图2-20）。


    ![](images/3d6031e4bf14fa021c009d98d697cc92.jpg)


    图2-20 肺部疾病的影像筛查的步骤


    在动脉网蛋壳研究院收集的20家国内进行病灶标注的人工智能医学影像公司中，开展肺癌诊断业务的有12家，占比为60%，其他几家公司目前专注于乳腺癌影像、甲状腺癌影像、眼底影像等医疗影像的研究（表2-4）。另外，由于目前公司在对外宣传的时候很多表述是辅助诊断肿瘤，并未注明诊断哪些癌种，因此实际比例要高于60%。


    表2-4 医疗影像主要病种涉足企业统计


    ![](images/51acc33a5a318bead8d51168f05ca4a2.jpg)


    续表


    ![](images/8b40a637e7f43dd0446b82b9a7adfd19.jpg)


    国内人工智能技术虽然还处在初期阶段，但是人工智能利用CT图像等放射影像，在肺结节识别方面的技术相对来说比较成熟。很多公司如推想科技、依图医疗等的产品已经在临床上取得应用。据了解，浙江省人民医院、上海长征医院、北京协和医院、湘雅医院等都在用AI产品。


    目前，AI产品对于肺结节的识别检出准确率在90%左右（每个公司的情况不一样，但是只要是报道出来的，都声称AI产品的水平高于医生平均水平），但是医学人工智能对于肺结节良、恶性的判断还处于研发阶段，最终诊断结果需要医生结合临床来做决定。


    除了利用CT图像等放射影像进行肺癌的辅助诊断、筛查，也有公司利用病理图片和大数据模型进行辅助诊断和筛查。例如，Deep Care^(\[1\])就尝试利用病理图像帮助医生辅助诊断肺癌，但是这个技术还在研发中。该公司之前还将这一技术应用在了乳腺癌的检测中，目前准确率已经达到92.5%。


    点内生物则利用大数据模型进行肺癌的早期诊断，该公司整合目前国际上主流的肺癌风险预测模型，结合人工智能与机器学习技术，在国内2万例肺癌病例的验证下，优化并形成了适合中国人使用的肺癌智能筛查引擎“肺常好”。目前，点内生物已经和上海杨浦区政府合作，对全区居民进行肺癌筛查。


    目前，汇医慧影对胸部X光的气胸、肺结核、肿块的自动诊断准确率已经达到95%，脑核磁肿瘤的自动识别率超过85%，胸部CT中肺结节的识别率超过85%。


    腾讯觅影包含6个人工智能系统，涉及的疾病包含食管癌、肺癌、糖网病、宫颈癌和乳腺癌。其中，早期食管癌智能筛查系统最为成熟，实验室准确率为90%，现已进入临床前实验阶段。


    乳腺癌AI辅助诊断系统获得国家食品药品监督管理总局（CFDA）认证，部分病变检出率高达96%。'
