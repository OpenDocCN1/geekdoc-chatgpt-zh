  trans: '


    具体到医疗行业，有三大类无线医疗应用场景。第一类是基于医疗设备数据无线采集的医疗监测与护理类应用，如无线监护、无线输液、移动护理和患者实时位置采集与监测等。第二类是基于视频与图像交互的医疗诊断与指导类应用，如实时调阅患者影像诊断信息的移动查房、采用医疗服务机器人的远程查房、远程实时会诊、应急救援指导、无线手术示教和无线专科诊断等。第三类是基于视频与力反馈的远程操控类应用，如远程机器人超声检查、远程机器人内窥镜检查和远程机器人手术。


    这三类无线应用场景对网络的带宽、时延和可靠性要求各有不同。第一类应用对数据的带宽和延时要求最低，第三类应用对无线通信提出了很高的要求，而 5G 通信技术则可以满足这类医疗的无线应用。人的反应时间一般在十毫秒到几十毫秒，5G
    技术已经把医生远程手术的延时缩短到几乎是在眼前的感觉，这无疑对未来医疗的使用空间和使用场景带来了颠覆性的变化。


    无线医疗的新应用可以打破时空限制，提高医疗的效率。华为 Wireless X Labs 现在正在和德国慕尼黑工业大学附属医院合作远程无线内窥镜的项目，通过机械臂无线控制的方式，稳定实现内窥镜手术。同时，它与华大智造开展无线远程
    B 超机器人项目，医生在远端遥控操作机械手，就可以得到 B 超图像进行分析。这些都是无线通信技术对医疗场景的颠覆和改造。


    ## 3. 无线医联网对医院的价值


    无线医联网推进医疗业务信息化，促进医疗资源共享，提升医疗工作效率和诊断水平。在目前的医院管理中，有几件事一直难以解决。例如，护士找不到医生，医生找不到病人，病人找不到科室，医生找不到医疗器械。这种管理上的瑕疵完全可以用技术手段去解决，只是之前传感器、电池、通信等技术的发展还没有到位。


    无线医联网建设之后，院内医护人员可以随时随地获取各种医疗信息，实现移动查房、移动护理、远程查房和机器人医疗服务等，减少了医务人员的奔波，提高了医务人员工作的效率。院与院之间通过无线医疗也可以提升院间信息互通和业务协同水平，上级中心医院拥有医疗专家资源和完善的医疗设施，借助无线医联网可远程指导医疗联合体内下级医院开展医疗业务，提升下级医院的医疗诊断水平。


    无线医联网由运营商部署和维护，节省医院运营成本。以往医院不仅需要购买大量的通信设备和服务器，建立物理专网保障院内医疗业务的通信安全可靠，还需要投入专门的运营团队进行日常维护。引入无线医联网后，通信设备由运营商提供和部署，并负责运维，极大地节省了医院在此方面的投入成本。


    无线医联网助力医疗变革，开展智慧医疗新业务。无线医联网具备平滑演进能力，将与“云计算、大数据、数字影像、人工智能机器人”等技术相结合渗透到医疗业务的各个环节，助力医疗朝无线化和智能化发展。以往，医院设备都有各种不同的通信协议和通信方式；未来，华为欲在无线通信的底层搭建出一个平台，或者说和行业内的合作伙伴制定一种标准，就能连接各个数据孤岛和大量医疗设备，使医疗大数据的价值得以实现。


    ## 4. 无线医联网实施总体策略


    中国医院信息化状况调查显示，46.32%的医院规划未来两年建设使用无线网络。目前医院的无线技术应用只是落实在 WiFi 上，不但没有私密性，而且使用过程中的问题也很明显。对于有意愿开展无线医疗的医院，可以委托移动运营商进行网络建设和医疗设备无线能力升级，并根据自身情况分
    3 个阶段开展无线医疗业务。


    第一阶段，开展基于医疗设备数据无线采集的医疗监测与护理类应用，实现院内无线医疗网络全覆盖，提高医疗工作效率。


    第二阶段，扩展到基于视频与图像交互的医疗诊断与指导类应用，实现急救、院内和院间无线全连接医疗，提升急救响应速度和医疗协同工作能力。


    第三阶段，开展基于视频与力反馈的远程操控类应用，借助创新医疗技术响应国家医疗扶贫政策。医院外的网络运营商已经提供了广域覆盖的无线网络基础设施，如果医院开展远程医疗业务，可与运营商洽谈开通
    VPN^(\[6\])专线，以保障高质量的远程传输能力。医院内的无线网络由运营商进行专业的网络规划和部署，具体部署实施需要考虑医疗设备和医疗人员的通信需求。


    跨越联合创新在未来会成为常态，华为 Wireless X Labs 针对医疗领域专门成立了一个 Special Interest Group（SIG）特别兴趣工作组，这个工作组主要邀请医疗行业内与互联网医疗、远程医疗相关的部门和研究院所加入，包括河南省远程医学中心、复旦大学附属华山医院、华大智造、复星集团、麦迪克斯、苏州大学、依图科技等。


    华为无线应用场景实验室总裁谈道：“Wireless X Labs 旨在搭建一个无线应用创新的平台，在这个平台中，合作伙伴们能够共同研究行业的场景，创造新的应用，拓展新的市场，最终实现共同成功。无线医联网
    SIG 秉承开放合作共赢的态度，愿意吸纳更多医疗行业的合作伙伴参与，共同实现医疗行业的全连接。”


    \[1\] GPRS: 通用分组无线服务技术（General Packet Radio Service）的简称，是第一代移动通信技术的代表。

    \[2\] GSM：全球移动通信系统(Global System for Mobile Communication)的简称，是当前应用最广泛的移动电话标准。

    \[3\] UMTS：通用移动通信系统(Universal Mobile Telecommunication System)的简称，是国际标准化组织 3GPP
    制定的全球 3G 标准之一。

    \[4\] LTE：长期演进（Long Term Evolution）的简称，是由国际标准化组织 3GPP 制定的 UMTS 技术标准的长期演进。

    \[5\] MBB：Mobile Broadband，即移动宽带。华为推出创新的 MBB 可视化解决方案专利注册服务（PRS），该方案是华为 SingleOSS
    解决方案的一部分，具备 MBB 网络性能与资源可视化能力，可帮助运营商保障用户体验和最大化 MBB 网络价值。

    \[6\] VPN：虚拟专用网络（Virtual Private Network）的简称。


    # 第 5 章 资本涌入：人工智能与医疗的投资风口


    人工智能的发展可谓如火如荼，落实到具体行业中，医疗健康领域的人工智能创业公司表现尤为突出，关注度和融资量最高。在 2018 年仅第一季度就有 20 多家人工智能医疗企业获得融资。据中国数字医疗网预计，到
    2025 年，医疗人工智能应用市场总值将达到 250 亿美元，占整个 AI 市场规模的五分之一。


    ## 5.1 人工智能与医疗企业技术成熟度曲线


    早期的人工智能初创公司主要负责基础研究，搭建人工智能学习平台进行算法及算法框架等。在研究成果出来不久，随即被大公司收购，如 Deepmind 和 Wit.ai；发展期的人工智能企业负责技术层面的研究，在语音识别、图像识别等领域提升准确度；成熟期的人工智能企业则开始在各领域的应用层面推出产品。


    人工智能医疗企业的蓬勃发展，也正说明了人工智能的商业化应用正在逐渐接近成功。但是，人工智能医疗企业还有多种应用模式，不同细分领域的发展情况也有很大的差别。那么，这些细分领域之间的市场应用区别有多大？技术成熟度如何？动脉网蛋壳研究院尝试用发展规律周期（Hype
    Cycles）技术成熟度曲线来衡量 Gartner^(\[1\])公布的 2018 年技术成熟度曲线（图 5-1）。


    在图 5-1 中，技术成熟度曲线共分为萌芽期、狂热期、破灭期、复苏期和成熟期 5 个阶段，用公众对技术的期望值这两个坐标来定位新技术在曲线上的位置。


    ![](img/0a81f6b9b7b68dac8ab550fb5c0bfbcc.jpg)


    图 5-1 Gartner 公布的 2018 年技术成熟度曲线


    （1）技术萌芽推动期（Innovation Trigger）：当新技术诞生时，随着业界和媒体的关注，无论是大众还是业内人士对技术的期望值都越来越高。在这个阶段用户的需求和产品往往并不成熟，但会有大量的资金进入。

    （2）过高期望的峰值期（Peak of Inflated Expectations）：公众的期望值达到顶峰，有少量用户开始采用该项技术。

    （3）泡沫化的谷底期（Trough of Disillusionment）：过高的期望值和产品成熟度之间存在鸿沟，公众的期望值下降，出现负面评价。

    （4）稳步爬升的光明期（Slope of Enlightenment）：厂商和相关技术供应商不断完善自己的产品，加上用户需求的明确，产品在设计和使用场景上趋于成熟，最佳实践开始涌现。

    （5）产业化的平稳期（Plateau of Productivity）：新技术产生的利益和潜力被市场认可，开始出现产品间的价格竞争。


    在 2017 年 Gartner 公布的技术成熟度曲线图中，与人工智能相关的技术非常多。其中，自动驾驶、机器学习、深度学习、虚拟助理、智能机器人和增强数据挖掘等早期基础研究已经成熟，毫无疑问地处于狂热期最顶点的前后。通用人工智能、神经形态硬件、深度强化学习、量子计算、脑机接口等新兴人工智能技术正处于快速上升期。


    动脉网蛋壳研究院用自己的方法论来客观描述人工智能与医疗各细分领域的发展状况。技术成熟度判断的相关计算指标如下：


    ①该细分领域企业的平均融资额；

    ②该细分领域的企业数量；

    ③该细分领域的行业分散度；

    ④该细分领域商用的医院数量。


    最后通过分析，得出图 5-2 所示的人工智能与医疗企业技术成熟度分布图。


    ![](img/1f0a79df1480b103900c9b81cc377772.jpg)


    图 5-2 人工智能与医疗企业技术成熟度曲线


    目前企业数量最多的医疗影像和平均融资额最高的病历/文献分析类企业排在成熟度的第一位和第二位。那么成熟度第一的医疗影像和病历/文献分析类应该位于曲线上的哪个位置？蛋壳研究院进行了以下分析。


    第一，在前面统计过人工智能医疗企业的合作医院数量和目前的产品临床应用情况，从医疗影像类的企业入驻医院数量来看，目前国内科研能力较强、医疗水平靠前的大型医院几乎都已经和企业开始了相关的临床试验，而且首批种子用户活跃度已经达到了顶峰。


    第二，相关领域的大规模媒体报道出现在 2015—2017 年，目前处在一个平稳的高峰期。


    第三，同时涉足医疗影像和病历/文献分析的人工智能标杆企业 IBM Watson 和 MD 安德森医院“分手”的负面报道开始在 2017 年出现，质疑人工智能在医疗上发挥的作用。但是，其他的负面报道并不多见。


    所以，我们认为医疗影像在曲线上的位置应该在顶峰期往下一点。在人工智能与医疗影像行业目前初创企业扎堆的情况下，投资者和创业者应该谨慎，而且如何获得生存空间是值得思考的问题。这个领域算法和技术已经成熟，企业的瓶颈在于如何获取足够丰富的医疗影像数据、如何完成准确的标注及如何获取收益。


    而其他类型的人工智能医疗企业，大部分还处于技术萌芽之后的快速上升期。排名最后的疾病筛查和预测，因为难度最大、算法最复杂、需要数据最多，而且报告中的案例大部分还在研究阶段，所以位列最后也合情合理。


    但是，无论技术发展到哪个阶段，都有相关的佼佼者脱颖而出。融资仍然是一家公司成功的重要因素，下面分析了每个领域融资靠前的企业，总结出了以下经验。


    第一，我们关注的绝大部分是医疗垂直领域的企业，但是如果企业拥有更深入的基础层和技术层的研究，就会更容易获得成功。如在图像识别、语音、语义识别方面的技术功底够深厚，是人工智能技术提供方的企业更容易成功。


    第二，创新能力足够强的企业，属于行业的挑战者，或者创造了新的需求，属于“创新者”一类。


    第三，更关注价值链的上游，在技术和产品成熟后，替代现有的解决方案。


    第四，除了数据量之外，还收集和处理现有企业没有的新数据流，建立行业壁垒。


    \[1\] Gartner： 全球最具权威的 IT 研究与顾问咨询公司，成立于 1979 年，总部设在美国康涅狄克州斯坦福。其研究范围覆盖 IT 全部产业，就
    IT 的研究、发展、评估、应用、市场等领域，为客户提供客观、公正的论证报告及市场调研报告，协助客户进行市场分析、技术选择、项目论证、投资决策。为决策者在投资风险和管理、营销策略、发展方向等重大问题上提供重要咨询建议，帮助决策者作出正确的抉择。


    ## 5.2 人工智能医疗创业公司与投资机构的分析


    ### 5.2.1 人工智能医疗创业公司的成本组成


    人工智能医疗企业的成本主要有生产成本（数据成本、技术成本和人力成本等）和营销成本（运营成本和推广成本等），一般情况下生产成本占据全部成本的大部分（图 5-3）。本节的所有数据和内容均来自采访和研报。


    ![](img/c8da5d834fb67e6a00c9b6f4b8cef61b.jpg)


    图 5-3 人工智能医疗企业的成本组成


    #### 1. 数据成本


    人工智能医学创业公司涉及的领域有很多，各个领域用来训练模型的数据也不尽相同，这些数据包含放射影像数据、眼底图像数据、病理图像数据、语音数据、电子病例文本数据。因为目前国内尚未形成完整的数据归属权、使用权、隐私权等法规文件，所以各个公司获取数据的渠道和费用也不同。


    因此，在谈获取渠道之前，首先介绍一下目前我国医疗数据的归属、存储、使用的一些情况。


    归属权无须讨论，患者的医疗数据一旦产生就是由政府或医院来管理的，即使明确病例归患者个人所有，也不影响国家疾控、公卫和政府部门对病历数据的使用，所以实际上决定患者数据使用权的是政府和医疗机构。具体到大型医院，科室主任拥有数据的使用权，他们在进行科研时，如果有需要可以将这些数据脱敏以后使用。


    另外，医疗数据的传输、存储、加工是由医疗大数据和信息化公司共同完成的，出于保护隐私的考虑和法律限制，这些公司无权使用医疗数据。


    经蛋壳研究院调查，人工智能医疗企业获取数据的渠道大致可以分为以下 3 个类型（图 5-4）。


    ![](img/dba04edb699f3935aeb3157344540b80.jpg)


    图 5-4 人工智能医疗企业的数据获取方式和成本组成


    （1）与医院合作免费获取。医生有科研的需求，企业有开发产品的需求，如果患者的病例数据可以产生医学价值，造福更多的患者，那么医生是可以支配这些数据的，将数据脱敏后给企业共同研发。


    公司从医院获取的数据是基础数据，必须经过专家医生的标注才能用来训练人工智能模型。这个过程是否需要向医生支付费用，取决于公司与医院的合作关系。

    （2）公开数据集下载。在全球的公开数据平台下载数据是最节约成本的，这些平台的数据一般都是为参加比赛的团队提供的，已经被专家初步标注过，可以用作初步训练。代表性的平台有
    Kaggle、ADCIS、DRUVE、STARE、HRF、DRIONS 和 DIARE 等。


    不过这些数据也存在一些问题，因为大多是国外的平台，数据自然也是外国人的，是否适合国内患者还有争议。另外，这些数据的标注也可能存在问题，毕竟临床和比赛存在很大的差异。


    现在很多创业公司的发展是前期通过下载的方式获取数据，后期通过与医院合作的方式拿到数据，这些数据都会请专家来标注。如表 5-1 中的数据是大部分公司的情况，现实中会有变化，主要看创始人和医生、医院之间的关系。

    （3）付费购买。蛋壳研究院在这里强调，法律规定医院和医生是不能私自买卖临床数据的。但是，智能语音领域会有不同，这些数据可以在市场上买到。一般智能语音公司需要声学数据和语言数据，创业公司可自己采集语言数据，成本占总数据成本的
    30%～40%，其费用在几百万元这个量级。


    声学方面的数据，语音公司需要向数据公司购买，出售相关数据的公司包括海天瑞声、数据堂、北京慧听科技等。语音公司在声学数据方面的花费占整个公司数据费用的 60%～70%。


    总的来说，除了语音公司需要购买声学数据外，其他创业公司获取临床数据不需要成本，但是数据的标注需要花费大量资金，如果按照每个公司 10 万张被标注的数据计算，那么医疗创业公司在数据上的花费为
    100 万～1000 万元。零氪科技（北京）有限公司的创始人张天泽曾表示，以前获取一例病例数据的成本为 1000～10 000 美元，现在价格降了很多。


    表 5-1 专家标注数据收取的费用


    ![](img/141000edfb4fcd65a634a8fc79dd9455.jpg)


    #### 2. 算力成本


    算力成本也是人工智能创业者不可忽视的一笔费用，计算力又可以分为 3 个方面——芯片、超级计算机、云计算。创业者往往根据自己公司数据量的大小、周期、费用、准确性等来选择使用哪些计算方法。


    （1）芯片。人工智能领域作为一个数据密集的领域，传统的数据处理技术难以满足高强度并行数据的处理需求。为解决此问题，继中央处理器（CPU）之后，相继出现了图形处理器（GPU）、嵌入式神经网络处理器（NPU）、现场可编程门阵列（FPGA）、数字信号处理（DSP）等
    AI 芯片。1999 年，英伟达（NVIDIA）公司发布了全球首款图片处理芯片 GPU；2016 年，寒武纪科技发布了全球首款深度学习专用处理器芯片 NPU，芯片的更迭、进步可从根本上提高计算性能。


    据了解，出于成本考虑，购买芯片是大多数创业者的选择，他们购买价格为 5000～100000 元芯片，自己构建服务器，在本地运算，进行模型训练。一般创业者会选择购买英伟达的
    GPU，因为 GPU 适应性更好。

    （2）超级计算机。其基本组成组件与个人计算机的概念并无太大差异，但规格与性能则强大许多，是一种超大型电子计算机。打败韩国围棋棋手李世石的 AlphaGo 共包含
    1202 个 CPU 和 176 个 GPU；打败中国围棋棋手柯洁的升级版 AlphaGo 使用了 TPU（Tensor Processing Unit，张量处理器），但数量只有
    4 个。

    （3）云计算。与主要应用于密集型计算的超级计算机不同，云计算依靠其灵活的扩展能力，主要应用于社交网络、企业 IT 建设和信息化等数据密集型、I/O 密集型的领域。


    为了提高准确性、缩短运算周期，也有些公司会选择租赁云计算服务器。租赁服务器价格不等，在研发阶段和商业部署阶段都会用到，根据自己公司的数据量，租赁费用在几十万元到几百万元之间。目前，提供云计算服务的公司有亚马逊
    AWS、阿里、腾讯、微软和金山等。


    大部分创业者在起步阶段都会选择购买芯片进行初步的运算，后期需要提高精度或商业部署时会租赁云服务器，这样会降低成本。


    #### 3. 人力成本


    随着人工智能领域的人才价格暴涨，无论是哪个量级的公司面对上百万元甚至几百万元年薪的人工智能专家，都有人才招聘难的问题。


    据动脉网了解，全国高校中有人工智能实验室的有 20～30 家，平均每个实验室每年毕业的博士生大概为 2 位，硕士为 3～5 位，算上海外留学回来的专家，这些人才根本不足以满足各类公司的需求，在供需严重不平衡的情况下，人才成本自然增加。


    不过庆幸的是，人工智能创业公司在起步阶段需要的人工智能专家并不多（这里的专家指熟悉人工智能产品研发的整个流程，至少是博士及以上学历，研究方向与人工智能相关）。


    '
