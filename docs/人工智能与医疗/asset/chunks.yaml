    ## 3. 药物优化

    药物优化又可以称为先导物优化，这个步骤主要是对先导物的构效关系进行优化。这个阶段需要全面改进先导物的分子缺陷，当代药物发现有时可能有 20～30 个指标需要同时优化，而分子改造牵一发而动全身。借助人工智能，能够以直观的方式定性推测生理活性物质结构与活性的关系，进而推测靶酶活性位点的结构和设计新的活性物质结构；可以进一步提升药物的构效关系分析速度，快速挑选最具安全性的化合物。


    ## 4. 患者识别及招募

    招募合适的志愿者一直是制药公司面临的难题之一，在时间就是金钱的药物研发过程中，除了招募的直接成本外，由于延长时间造成的间接成本也不容忽视。在实际过程中，大多数临床试验不得不大幅延长其时间表，因为在原定时间内很难发现足够数量的患者。这类麻烦并不罕见，根据拜耳^(\[3\])的数据，90%的临床试验未能在指定时间内招募到足够数量的患者，通常而言，所耗费的时间是指定时间的两倍左右。利用人工智能对疾病数据进行深度研究，制药企业可以更精准挖掘目标患者，快速实现患者招募。


    2016 年，Biogen^(\[4\])进行了一项研究，使用 Fitbit^(\[5\])追踪多发性硬化症患者的活动。结果 24 小时内便成功招募了 248
    名患者，其中 77%的人完成了后续研究。这项试验显示，有一小部分可穿戴设备使用者非常愿意自我量化，并分享他们的生理数据。使用数字健康设备（包括医疗级的可穿戴设备）招聘大量的志愿者参加临床试验正在成为趋势。


    ### 企业案例


    #### Mendel.ai

    Mendel.ai 以现代遗传学之父孟德尔（Gregor Mendel）命名。该公司开发的临床试验招募人工智能系统可以帮助癌症患者精准匹配参加最合适的相关临床试验，享受到免费治疗机会。该系统每
    3 个月服务期限收费 99 美元，服务期内患者可以不限量地上传医疗病历记录。受试者可以自己将病历资料直接上传到公司平台，也可以委托医生，同意医生将病历共享到公司平台。


    创始人卡米·加利尔（Karim Galil）是一名医学博士，据他自己介绍，医生在实际工作中，需要对每种病进行大量的临床试验。举例来说，肺癌患者，临床时需要进行
    500 种潜在的治疗试验，每种试验结果都有其独特、详尽的合格标准，必须仔细核对、审查，而且每种试验每周都可能有不同的变化，单靠人力不可能追踪所有结果。这就导致了
    Galil 每天需要面对混乱的、堆积如山的医学记录。


    Mendel.ai 的工作原理是靠算法，从大量临床试验中提取的文件中理解杂乱、非结构化的自然语言，并将结果与患者的情况配对。根据创始人 Galil 介绍，搜索过程结束后，会得出一个完全个性化的匹配结论，并在几分钟内评估出患者到底适合哪一种治疗方法。系统会自动将上传病历与临床试验数据库登记的相关临床试验进行实时精准匹配，并会将匹配结果更新，实时通知受试者本人。为了提高精确匹配效率，Mendel.ai
    公司平台系统会建议患者进行 DNA 检测，这将会提高临床试验招募入组效率。


    ## 5. 药物依从性管理

    依从性是指患者执行医嘱的客观应答的程度。在新药临床试验中，依从性可定义为受试者按照规定的药物剂量和疗程服用试验药物的程度。传统方式服药依从性主要通过人工随访来管理，如果数据量大，则只能依靠患者的自觉性。在这个阶段利用移动技术和面部识别技术来判断患者是否按时服药，用自动算法来识别药物和药物摄取，可以提醒患者按时服药，对患者的服药依从性做出精准管理。


    人工智能监测（Ai Cure）官网数据显示，20%～30%的临床试验会因为患者不遵医嘱而失败。图 2-39 是单组样本量增加比例与不遵医嘱比例的数据可靠性曲线，如果不遵医嘱的比例达到
    20%，那么样本量必须增加 60%才可以保证数据的可靠性。


    ![](img/176d583545da0c56899a6ce7cc0dfdc5.jpg)


    图 2-39 单组样本量增加比例与不遵医嘱比例的数据可靠性曲线


    ### 企业案例


    #### Ai Cure

    Ai Cure 通过建立和部署临床验证的人工智能技术，优化了患者行为和药物依从性（图 2-40）。该公司成立于 2010 年，旨在提高患者的依从性，最终目的是减少住院费用并延长预期寿命。Ai
    Cure 通过技术手段改善了用药依从性问题。Ai Cure 可以监测不同药物的多种给药途径，如口服、舌下含服、吸入器和注射等，并支持多种语言模式。同时，它有机器学习的能力，随着数据的积累，可以不断优化监测与治疗方案。当监测到有异常的用药行为时，系统还能发送警报。


    鉴于临床试验中药物开发的成本，Ai Cure 的工具可以提高临床试验的依从性，并提高其结果的质量。Ai Cure 将其技术定位为临床试验提供有效的远程监控支持。


