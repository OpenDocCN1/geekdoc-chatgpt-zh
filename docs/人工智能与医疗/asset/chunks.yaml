    ## 2.2 疾病筛查和预测

    现代医学是从人们的各种生化、影像的检查结果中去诊断是否患病，但要实现疾病的未来发展预测，还有很长一段路要走。

    医学科技的进步，已经能够实现部分疾病的可能性预测了。例如，美国影星安吉丽娜·朱莉就接受了预防性的双侧乳腺切除手术，以降低患癌风险。之所以进行这项手术，是因为她有基因缺陷，罹患乳腺癌和卵巢癌的风险较高。这是从基因角度进行的疾病风险预测，而人工智能也能够根据人们的语言、神态、反应、影像等数据进行疾病的预测。

    人工智能若要参与疾病的筛查和预测，需要从人的行为、影像、生化等检查结果中进行判断（图 2-13）。其中，依靠得最多的检查数据是核磁共振成像（MRI）、计算机体层摄影（CT）、X
    光等影像数据。由于筛查方式不同，可致使其分属于不同的细分领域，因此本节的企业类型也可以归纳到其他类型中。人工智能+影像领域也是参与企业最多、产品最丰富、涉及疾病种类最多的疾病诊断领域。

    ![](img/2cb6323948ca1ba1912149045caf5072.jpg)

    图 2-13 人工智能进行疾病诊断和预测的数据来源

    人工智能在进行疾病的筛查和预测的过程中，除了可以通过生化、影像检查结果发现疾病的端倪外，人们的语言、文字也会成为精神健康和身体健康状况的可测指标。语言和文字形成的规律会被认知系统进行分析，这种分析得出的数据能够帮助医生更有效地预测并追踪早期的发展障碍、精神疾病和退化性神经疾病等。

    目前，人工智能参与的疾病筛查和预测绝大部分是人类尚无法攻克的严重疾病，一组数据说明了这一点，如图 2-14 所示。其中，人工智能相关的医学论文中，癌症以 892
    篇遥遥领先，阿尔茨海默病排名第二。^[1]图 2-14 带有机器学习关键词的论文数量

    现在的医学一般是在人类患病后进行诊断和治疗，但往往为时已晚。未来，在科技的帮助下，医学将从治疗疾病向预防疾病转变。


    ## 2.2.1 疾病的筛查

    ### 1．精神疾病诊断

    普通的心理诊疗，医生首先要对患者的精神状况进行初诊，通过数次类似心理采访的问询来判断症状，凭经验诊断出精神疾病种类，然后对症拟定治疗方案，包括使用何种药物、多大药量等。然而，受医生主观判断和经验的限制，诊断可能会出现错误，以致迟迟不能确诊，或者不能正确判断用药种类和剂量，耽误病情。

    精神分裂症患者讲话有非常显著的特征，常表现为非自主发声，讲话中短句居多，语义混乱，“这个”“那个”“一个”之类的模糊词使用频率高，表意不清。

    2015 年，一组研究人员根据精神分裂症患者的语言特征制作了一个人工智能模型，通过分析谈话记录，准确地预测出了哪一组人可能患精神错乱（精神分裂症主要症状）。

    对于抑郁症、创伤后应激障碍（PTSD）等精神健康受损的人群来说，精神崩溃可能表现为一种缓慢发作的形式，情绪危机不会只从一次心理治疗中完全显现。2015 年
    3 月，《远程医疗与电子健康》（Telemedicine and e-Health）刊登了一篇用机器学习预测产后抑郁的论文，目的是建立产后抑郁症发作的风险分层模型，以便提前干预，同时开发了一款
    App，目标用户是产后希望了解自己情绪的妈妈。人工智能在创伤后应激障碍方面的诊断和治疗及对精神疾病的监控上，能起到相当大的作用。


    ### 2．自闭症筛查


