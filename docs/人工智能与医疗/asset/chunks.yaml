    ### 8．NExT 计划：医疗创新领导者

    2018 年，微软陆续在 iOS、Android、Windows 商店中删除了 HealthVault Insights——由微软在 2017 年 2 月与
    Healthcare NExT 同时推出的一款为特定患者提供长期护理和康复计划的软件。这一措施并不意味着微软退出个人护理领域，相反，这表明 Microsoft
    Healthcare NExT 项目已经进入一个新阶段。“AI+医疗”布局已经成型，微软在其医疗布局的每一步都散发着“前沿科技”的味道。


    NExT 是一个神秘又低调的部门，全称为新经验和技术组织（New Experiences and Technologies Organization）。它不仅有微软亚洲研究院（MSRA）及其合作实验室作科研后盾，还有微软工程院诸多工程师负责把想法变成现实。看上去它更像一个孵化器+风险投资机构。


    由 AI 驱动的医疗研究计划 Healthcare NExT 利用微软在 AI 和云技术方面的优势来推动医疗创新，主要目的包括减轻医生的数据录入负担、分流患者及监督患者院外护理。其主要部分为
    4 个板块，分别是 HealthVault、Microsoft Genomics、AI 驱动的智能聊天机器人、Project InnerEye。4 项应用组成了现在微软在医疗领域的宏观布局。


    从作用上看，HealthVault 与 Microsoft Genomics 主要起到数据收集和整理的目的，而 Project InnerEye 则是一项实验性的细分研究项目，两个板块间可通过
    AI 驱动的智能聊天机器人来联动。


    ## 3.3.5 微软在 HIMSS2018 会议上发布的项目

    除了 Healthcare NExT 主要的 4 个板块外，微软还在 HIMSS2018 会议上分享了相关的辅助项目，以协助 Healthcare NExT
    健康发展。这些辅助项目如下。


    （1）AI Network for Healthcare：微软“AI+医疗”网络扩建项目，在心脏学领域建立以人工智能为核心的网络，此项目与印度最大的医疗系统之一阿波罗医院合作。


    （2）Project Empower MD：与匹兹堡大学医学中心（UPMC）的研究合作项目 Empower MD，它可以创建一个系统，以 AI 为动力，倾听和学习医生的说法和做法，从而减轻医生记笔记的负担。


    （3） Microsoft 365 Huddle Solution Templates：发布可扩展的全新开发者模板，以帮助团队从最先进的协作中受益。


    （4） Microsoft Azure Security and Compliance Blueprint：通过提供端到端的应用程序开发基础，帮助医疗机构以更简单、合规、安全和行业标准兼容的方式将数据迁移到云端。


    （5） Microsoft 365 Huddle Solution：办公软件新模板，帮助健康和医疗工作者更好地使用 Microsoft Teams 服务。


    以上项目就像微软医疗建筑群的地基，确保 Healthcare NExT 的各个项目有良好的网络支持、高效的数据传输、合理的互操作性、灵活的可扩展性。


