    ## 4.4.3 腾讯内地以外的医疗多样化布局


    以上简单介绍了百度系、阿里在内地以外的医疗投资，由于腾讯参投项目较多，因此单列出来讨论。


    腾讯一共参投了 14 个内地以外的医疗项目，最早从 2015 年开始布局。其中，2015 年 8 个，2016 年 1 个，2017 年 4 个，2018
    年 1 个，主要项目地点在美国。


    下面介绍一些腾讯参投的有代表性的内地以外的医疗公司。


    ### 企业案例


    #### Grail


    Grail 是腾讯参投的内地以外的医疗项目中唯一的“独角兽”。2018 年 3 月 1 日，外媒报道 Grail 计划在中国香港 IPO 首次公开募股，并拟融资
    5 亿美元。


    Grail 成立于 2016 年，由全球基因测序龙头企业 Illumina 组建，致力于研发癌症筛查血液检测技术。2017 年 5 月，Grail 与由香港中文大学教授卢煜明创办的生物科技公司
    Cirina 合并。


    Grail 曾于 2017 年 6 月宣布最新研究成果，称依据临床试验数据，通过特定的血液检测能够挖掘到与肿瘤有关的少量 DNA 突变。之后，该公司表示其第一款产品于
    2018 年发布，可以筛查一类位于上咽喉和鼻腔后的癌症。


    Grail 自成立以来就受到了资本的追捧，现已完成 3 轮融资，总融资额高达 13 亿美元。现有投资者包括比尔·盖茨、亚马逊公司创始人贝佐斯的个人风险投资基金、腾讯控股、百时美施贵宝、Celgene、强生创新和默克等知名投资人、投资机构和药企。


    #### Practo


    Practo 被称为“印度版春雨医生”，该公司成立于 2008 年，主要提供两方面的服务：一方面是以消费者为中心，为患者提供在线的医疗搜索服务，病人可以通过平台找到相应的医生，并在
    Practo 平台完成预约，或者进行体检预约、订购药品、获取健康资讯等；另一方面是面向医疗机构和医生提供的 SaaS 产品——Practo Ray，可以帮助用户进行日程安排、医药库存、医疗账单等内容的在线管理，帮助医疗机构改善患者诊疗体验，提高医疗效率。Practo
    现已将业务拓展至印度尼西亚、菲律宾、巴西等地。


    腾讯在 2015 年注意到了这家公司，领投了其 9000 万美元的 C 轮融资。2017 年 1 月，腾讯再次领投了 Practo 5500 万美元的 D
    轮融资。Crunchbase 数据显示，截至 2018 年 4 月，Practo 一共进行了 5 轮融资，总融资额高达 2.34 亿美元。


    2018 年 1 月，Practo 和印度 ICICI Lombard 保险公司合作推出面向个人用户的“Trinity”服务，ICICI Lombard 保险公司客户可由
    Practo 平台选择医生和诊所，并进行无现金、无纸化就诊。


    #### Karius


    传染性疾病是全球致死的主要疾病，也是未满足需求的巨大领域，Karius 即瞄准此市场。Karius 成立于 2014 年，由米奇·凯特斯（Mickey Kertesz）、史蒂夫·雷克（Steve
    Quake）、蒂姆·布劳恩坎普（Tim Blauwkamp）等联合创建，他们创造了一种新的血液检测方式，可快速检测血液中的细菌、病毒和真核生物病原体。


    Karius 现有两个系列的产品：数字文化测试（Digital Culture Test）和分枝杆菌嵌合体 DNA 测序试验（Mycobacterium Chimaera
    DNA Sequencing Test）。


    数字文化测试通过检测患者血液中的病原体来帮助医生确定有效的治疗方案，其适应征包括败血症、心内膜炎、脊髓炎及难以在实验室培养检测的病原体引起的病症。


    分枝杆菌嵌合体 DNA 测序试验可以从血液中检测到分枝杆菌嵌合体（M.chimaera）。分枝杆菌嵌合体广泛存在于生活环境中，医疗设备被其污染后，病原菌以气溶胶的方式进入人体，导致免疫力低下者（术后患者等）感染致病。多项研究均指出，污染的控温箱
    （HCU） 是导致心脏外科手术感染分枝杆菌嵌合体的源头。利用 Karius 提供的测试，可以在一天内就得到检测结果，以判断感染的风险。


    据外媒报道，Karius 以 2000 美元的价格向医疗机构和实验室销售以上产品，虽然比传统的检测产品更昂贵，但 Karius 的检测效果更好，时间也更快，对于一些感染为阴性的患者，其测试的价值更加突出。


    Karius 自成立以来已完成了种子轮及 A 轮融资，总融资额为 5500 万美元。腾讯在 A 轮时进入，并未领投。


    #### HomeHero


    HomeHero 是一家非医疗家庭护理提供商，类似于国内的“医护到家”，可以帮助家庭寻找、获取上门护理服务。它最为重要的模式是自有数百名医护人员，可根据用户的需求来进行调配。据其官网数据，HomeHero
    现已成为美国加州地区最大的到家服务提供商，为数千个家庭提供了超过 100 万小时的护理服务。


    人口老龄化为 HomeHero 的发展提供了基础。自 2000 年以来，美国 65 岁以上人口就一直处于稳步增长的状态，人口老龄化为老年人家庭护理提供了发展契机。美国统计局的数据显示，每年约有
    50 万人加入“65+大家庭”。根据美国统计局预测：到 2030 年，美国 65 岁以上老人将占总人口的 20%。这也意味着为老人提供到家服务有着巨大的市场。


    HomeHero 已完成 3 轮融资，总融资金额为 2300 万美元。腾讯参与的是其 A 轮融资，该轮融资额为 2000 万美元，由 Graham Holdings
    领投，腾讯等跟投。


    #### Scanadu


    Scanadu 成立于 2011 年，是一家随身医疗设备开发商。它在 2013 年推出主打产品 Scanadu Scout，这个圆形的小块中有独立的操作系统，内藏陀螺仪、电极、发光二极管、加速仪等其他传感器。把这个小块贴在额头上
    10 秒，对应的 App 就能显示出用户的各项身体指标，包括脉搏、心跳、心脏电讯号、体温、心跳变化、血氧饱和浓度等。


    Scanadu Scout 灵感来源于《星际迷航》中的三录仪，特斯拉创始人伊隆·马斯克（Elon Musk）体验该产品之后，曾评价“这就是世界需要的产品”。


    另外，该公司正在研发家用尿液检测试剂盒“Scanadu Urine”，为人们通过测量尿液样本中的化学物质水平来检查多种健康状况。相应地，该测试结果也能在 Scanadu
    应用上显示和存储。


    #### CliniCloud


    CliniCloud 成立于 2014 年，是一家家用医疗智能硬件公司。目前，该公司推出了一款名为 CliniCloud Medical Kit 的智能硬件，该硬件包含智能听诊器和体温计两部分，售价为
    149 美元。


    其中的红外体温计可在不接触身体的情况下测量体温，听诊器则是传统的有线模式，通过一根高保真数据线将听诊器与手机连接。体温和听诊器采集的数据都可在云端存储、分享，方便用户在家中自测健康数据，并分享给医生，以获取医疗建议。


    #### Clear Labs


    Clear Labs 创立于 2014 年，是一家食品检测公司，它使用一系列检测方式来判断食品成分、转基因、微生物等数据，并将此服务提供给农产品、食品生产商和实验室。


    2016 年 12 月，Clear Labs 宣布完成 1300 万美元 B 轮融资，Wing Venture Capital 领投，腾讯等跟投。截至目前，Clear
    Labs 总融资金额为 2450 万美元。


    ## 4.4.4 腾讯医疗布局：大健康产业链无缝“连接”


    相较于海外投资，腾讯在国内的“赛道”更加丰富，参投的医疗企业也更多，如表 4-5 所示。在这些项目中，有些项目还拿到了腾讯的多轮融资，如晶泰科技、医联 Medlinker、微医等，腾讯大有持续孵化之势。


    另外，腾讯已“亲自下场”，微信智慧药店、腾爱医生、企鹅医生、微保、腾讯觅影等，都是腾讯在医疗业务上的纵深布局。


    表 4-5 腾讯国内医疗投资数据


    ![](img/9222b44946ac2bfe2bcbca34c355be79.jpg)


    续表


    ![](img/56b90ab7b627a1c80dfd6587bc543962.jpg)


    从布局逻辑看，腾讯希望建立线上、线下一体的完整医疗生态链，涉及线上的有寻医问诊、健康管理、慢病康复，线下的有诊所、医药 O2O、保险和运动健身等，其服务对象包括患者、医生、医疗机构、保险公司和药店等。最为核心的特点是，腾讯希望打破信息壁垒，实现大健康产业链各环节的无缝连接——“连接”是重要的关键词。


    这种平台式的打法与腾讯的“基因”不无关系，其核心的竞争力在社交，围绕社交平台的用户、关系链、平台优势，在大健康产业链上有丰富的应用场景。聚焦“人”这个核心因素，就能找到“连接”的商业价值，而医生社区、医疗
    AI、处方共享平台都是为连接服务的工具。


    将腾讯在境内外的医疗布局结合起来看，其实并不能判断腾讯有“西为中用”或复制海外创新模式到国内的意图。本质上，腾讯已经变成一个“投行”，其思维在于发现优质的商业模式和公司——无论是在国内还是国外。这一条对于百度和阿里巴巴来说依然成立，投资的驱动因素在于“价值”，至于能否与国内业务产生联动，则更多的是一种偶然。反过来看，即使投资折戟，以
    BAT 的体量，数笔初创公司的投资也不能动其筋骨。


    应该明晰的是，医疗领域的创新好比“骆驼的长征”，很难在短期内做到颠覆，互联网与医疗尤其如此。BAT 以平台化的方式切入，实际上是一个不断“试错”的过程，通过不断的“合纵连横”，才能找到优质的、被市场确切接受的创新模式，最终融入原有业务体系，带来持续成长的驱动力。


    [1] BAT：百度（Baidu）、阿里巴巴（Ali）和腾讯（Tencent）三大互联网公司巨头的简称。


    [2] Y Combinator：成立于 2005 年，是美国著名的创业孵化器，Y Combinator 扶持初创企业并为其提供创业指南。


    [3] Crunchbase： 2007 年在美国旧金山创立，是覆盖初创公司及投资机构生态的企业服务数据库公司。


    # 4.5 华为智能无线技术实现医疗互联


    ## 4.5.1 华为携手乐心医疗


    乐心医疗成立于 2002 年，专注于智能健康领域，目前主攻“智能穿戴”与“移动医疗”两大方向，它旗下的产品包括可穿戴运动手环（手表）、电子健康秤、脂肪测量仪、电子血压计等硬件设备，同时针对运动瘦身、慢性病管理等领域提供软件和智能硬件一体化解决方案。2016
    年 11 月 16 日，广东乐心医疗电子股份有限公司正式在深圳证券交易所创业板挂牌上市，成为智能硬件领域第一股。


    华为、乐心医疗和广东联通从 2016 年 11 月开始启动合作，经过前期方案技术沟通和设备选型，三方确定启动`NB-IoT`智能血压计产品合作。经过近两个月的技术攻关，在三方的共同努力下，在广东联通现网`NB-IoT`网络环境下完成了智能血压计业务调试，这标志着基于`NB-IoT`技术的智能健康医疗设备的诞生，意味着`NB-IoT`业务应用进入智能医疗设备领域。该智能血压计在每次使用后，可通过`NB-IoT`无线网络自动上传相关测量数据至智能健康云平台，进行数据的分析与整理，并形成实时的健康图表及分析报告，送至用户手中的
    App 或微信公众号上，便于用户随时随地了解个人及其家庭成员的健康数据，掌控健康趋势。结合`NB-IoT`低功耗、深度覆盖等技术优势，可以增强产品的省电优势，解决其传统产品基于`GPRS`^(\[1\])无线回传在部分区域信号覆盖不好、数据难以上传的问题，进一步提升客户的使用体验。


    什么是`NB-IoT` 呢？


    `NB-IoT`（Narrow Band Internet of Things，窄带蜂窝物联网）是一种基于蜂窝的窄带物联网，是物联网领域的一个重要技术分支。`NB-IoT`构建于蜂窝网络，只消耗大约
    180kHz 的带宽，即可直接部署于`GSM`^(\[2\])网络、`UMTS`^(\[3\])网络或`LTE`^(\[4\])网络，以降低部署成本、实现平滑升级。


    物联网的无线通信技术很多，主要分为两类：一类是`ZigBee`、`WiFi`、蓝牙、`Z-wave`等常见的短距离通信技术，另一类是`LPWAN`（Low-Power
    Wide-Area Network，低功耗广域网）。`NB-IoT`则是低功耗广域网中的一种技术，支持待机时间长、对网络连接要求较高的设备的高效连接。据说，`NB-IoT`设备电池寿命可以达到
    10 年，同时还能提供非常全面的室内蜂窝数据连接覆盖。


    如图 4-4 所示，高速率无线业务主要使用`3G`、`4G`技术，中等速率业务主要使用`GPRS`技术，低速率业务目前还没有很好的蜂窝技术来支持，而它却有着丰富多样的应用场景，很多情况下需要数据上传时只能勉强使用`GPRS`技术。2013
    年年初，华为开始与相关业内厂商、运营商展开窄带蜂窝物联网发展，最后发展出了`NB-IoT`技术。`NB-IoT`具有其他技术不具备的广覆盖、低功耗、大链接、低成本、高安全、即插即用等优势，在智慧停车、智能穿戴、智能医疗、智能家电等领域具有广泛的应用前景。


    ![](img/02331da21fb76b7ce2693388f57ef6e1.jpg)


    图 4-4 `NB-IoT`技术市场应用


    ## 4.5.2 华为 Wireless X Labs


    华为 Wireless X Labs 成立于 2016 年东京宽带论坛，通过和产业伙伴进行合作，探索新的无线通信技术，开发创新应用，提前为`5G`构建生态，最后通过华为的无线通信技术，去实现各个垂直领域的深度融合，实现跨领域的创新。


    ### 1. 从人与人连接到万物连接


    全世界互联，这是一件相当复杂的事情。但`5G`时代的到来，使得这个愿景的实现拥有了技术基础。第一代通信技术实现了语音的互通；第二代通信技术解决了移动领域的数字化转型，实现了语音和短信的移动需求；第三代通信技术第一次引入了移动数据连接，满足了人们的多媒体移动信息需求；第四代通信技术在`3G`的基础上进行了增强，实现了高清语音、更大的带宽等。而`5G`时代将迎来巨大的突变，更多的产业会实现数字化转型（图
    4-5）。


    ![](img/78614da34b9477aecd642438dd037673.jpg)


    图 4-5 `5G`时代会催生更多行业的数字化转型


    王宇峰（华为`MBB`^(\[5\])解决方案营销支持部部长）认为，通信技术将从连接人与人走向连接万千行业。以人工智能为例，`AlphaGo`下围棋虽然非常厉害，但并不是人人都能用它来下围棋，因为它的体积和电力消耗限制了它的移动应用。然而，如果拥有了通信技术的支持，`AlphaGo`的能力就可以无线传输到移动设备上，能力就能得到扩展。在医疗行业也是如此，通过无线技术的支持，人工智能的决策能力就可以远程扩展到医生和医院。


    现代科技的快速发展出现了几个关键要素，如人工智能、云计算、传感器、机器人等，而无线通信技术也是其中之一。前面的几种技术，都需要通信联网才能发挥最大的作用，`5G`技术就是让各行各业能够稳定发挥的基础和平台，是全行业数字化转型的移动互联基础（图
    4-6）。华为 Wireless X Labs 筛选出了`5G`时代十大应用场景，包括云 VR/AR、车联网、智能制造、智慧能源、无线医疗联网、无线家庭娱乐、联网无人机、社交网络、个人
    AI 辅助和智慧城市。华为 Wireless X Labs 将针对这些领域进行技术开发，同时寻找行业伙伴组建生态圈，建立无线应用标准。而且，未来这种跨界合作和跨界创新也将成为常态。


    ![](img/1b4ff3603b661c52b0bbde565595cccc.jpg)


    图 4-6 全行业数字化转型的移动互联基础


    ### 2. 无线医疗的应用场景


