    ## 4.5 华为智能无线技术实现医疗互联


    ## 4.5.1 华为携手乐心医疗


    乐心医疗成立于2002年，专注于智能健康领域，目前主攻“智能穿戴”与“移动医疗”两大方向，它旗下的产品包括可穿戴运动手环（手表）、电子健康秤、脂肪测量仪、电子血压计等硬件设备，同时针对运动瘦身、慢性病管理等领域提供软件和智能硬件一体化解决方案。2016年11月16日，广东乐心医疗电子股份有限公司正式在深圳证券交易所创业板挂牌上市，成为智能硬件领域第一股。


    华为、乐心医疗和广东联通从2016年11月开始启动合作，经过前期方案技术沟通和设备选型，三方确定启动NB-IoT智能血压计产品合作。经过近两个月的技术攻关，在三方的共同努力下，在广东联通现网NB-IoT网络环境下完成了智能血压计业务调试，这标志着基于NB-IoT技术的智能健康医疗设备的诞生，意味着NB-IoT业务应用进入智能医疗设备领域。该智能血压计在每次使用后，可通过NB-IoT无线网络自动上传相关测量数据至智能健康云平台，进行数据的分析与整理，并形成实时的健康图表及分析报告，送至用户手中的App或微信公众号上，便于用户随时随地了解个人及其家庭成员的健康数据，掌控健康趋势。结合NB-IoT低功耗、深度覆盖等技术优势，可以增强产品的省电优势，解决其传统产品基于GPRS^(\[1\])无线回传在部分区域信号覆盖不好、数据难以上传的问题，进一步提升客户的使用体验。


    什么是NB-IoT 呢？


    NB-IoT（Narrow Band Internet of Things，窄带蜂窝物联网）是一种基于蜂窝的窄带物联网，是物联网领域的一个重要技术分支。NB-IoT构建于蜂窝网络，只消耗大约180kHz的带宽，即可直接部署于GSM^(\[2\])网络、UMTS^(\[3\])网络或LTE^(\[4\])网络，以降低部署成本、实现平滑升级。


    物联网的无线通信技术很多，主要分为两类：一类是ZigBee、WiFi、蓝牙、Z-wave等常见的短距离通信技术，另一类是LPWAN（Low-Power Wide-Area
    Network，低功耗广域网）。NB-IoT则是低功耗广域网中的一种技术，支持待机时间长、对网络连接要求较高的设备的高效连接。据说，NB-IoT设备电池寿命可以达到10年，同时还能提供非常全面的室内蜂窝数据连接覆盖。


    如图4-4所示，高速率无线业务主要使用3G、4G技术，中等速率业务主要使用GPRS技术，低速率业务目前还没有很好的蜂窝技术来支持，而它却有着丰富多样的应用场景，很多情况下需要数据上传时只能勉强使用GPRS技术。2013年年初，华为开始与相关业内厂商、运营商展开窄带蜂窝物联网发展，最后发展出了NB-IoT技术。NB-IoT具有其他技术不具备的广覆盖、低功耗、大链接、低成本、高安全、即插即用等优势，在智慧停车、智能穿戴、智能医疗、智能家电等领域具有广泛的应用前景。


    ![](images/02331da21fb76b7ce2693388f57ef6e1.jpg)


    图4-4 NB-IoT技术市场应用


    ## 4.5.2 华为Wireless X Labs


    华为Wireless X Labs成立于2016年东京宽带论坛，通过和产业伙伴进行合作，探索新的无线通信技术，开发创新应用，提前为5G构建生态，最后通过华为的无线通信技术，去实现各个垂直领域的深度融合，实现跨领域的创新。


    ### 1．从人与人连接到万物连接


    全世界互联，这是一件相当复杂的事情。但5G时代的到来，使得这个愿景的实现拥有了技术基础。第一代通信技术实现了语音的互通；第二代通信技术解决了移动领域的数字化转型，实现了语音和短信的移动需求；第三代通信技术第一次引入了移动数据连接，满足了人们的多媒体移动信息需求；第四代通信技术在3G的基础上进行了增强，实现了高清语音、更大的带宽等。而5G时代将迎来巨大的突变，更多的产业会实现数字化转型（图4-5）。


    ![](images/78614da34b9477aecd642438dd037673.jpg)


    图4-5 5G时代会催生更多行业的数字化转型


    王宇峰（华为MBB^(\[5\])解决方案营销支持部部长）认为，通信技术将从连接人与人走向连接万千行业。以人工智能为例，AlphaGo下围棋虽然非常厉害，但并不是人人都能用它来下围棋，因为它的体积和电力消耗限制了它的移动应用。然而，如果拥有了通信技术的支持，AlphaGo的能力就可以无线传输到移动设备上，能力就能得到扩展。在医疗行业也是如此，通过无线技术的支持，人工智能的决策能力就可以远程扩展到医生和医院。


    现代科技的快速发展出现了几个关键要素，如人工智能、云计算、传感器、机器人等，而无线通信技术也是其中之一。前面的几种技术，都需要通信联网才能发挥最大的作用，5G技术就是让各行各业能够稳定发挥的基础和平台，是全行业数字化转型的移动互联基础（图4-6）。华为Wireless
    X Labs筛选出了5G时代十大应用场景，包括云VR/AR、车联网、智能制造、智慧能源、无线医疗联网、无线家庭娱乐、联网无人机、社交网络、个人AI辅助和智慧城市。华为Wireless
    X Labs将针对这些领域进行技术开发，同时寻找行业伙伴组建生态圈，建立无线应用标准。而且，未来这种跨界合作和跨界创新也将成为常态。


    ![](images/1b4ff3603b661c52b0bbde565595cccc.jpg)


    图4-6 全行业数字化转型的移动互联基础


