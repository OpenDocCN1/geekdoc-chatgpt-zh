    Qventus于2012年创办于加利福尼亚州山景城，曾用名analyticsMD。它推出的是一套能够通过对天气状况、出入院情况、电子病历等信息的分析，向医院提供实时决策指南的SaaS系统。


    例如，Qventus在对天气状况、医院内患者人数、附近是否有突发事件等因素综合分析后，可以预测接下来数小时医院的新增患者人数，帮助医院做好应对措施。


    高吉奥健康是2015年创办于佐治亚州亚特兰大市的科技公司，它专注于向患者提供在医院内的导航服务。高吉奥健康根据对各个医院的具体情况和医院内部构造的分析，搭建出定制化的导航系统。患者通过手机定位，点击或输入想要前往的区域，系统就会给患者规划出最快到达的路线。


    ## 6.1.5 带给国内创业者的思考


    目前，国内的医院在调查患者体验的方式上仍以传统的问卷反馈和电话随访为主，动脉网蛋壳研究院认为在供需两端都存在制约将人工智能应用于提升患者体验的因素。


    （1）供给端。国内人工智能医疗领域创业集中于影像诊断，涉足患者体验的企业寥寥。


    动脉网2017年5月发布的《人工智能与医疗数据报告》显示，国内人工智能类医疗企业已达60余家，但都以辅助医学影像诊断为主；海外人工智能类医疗企业已达130余家，服务方向包括医学影像诊断、医院管理、新药研发等多个领域。国内的人工智能类医疗企业无论是在总体的数量上，还是在涉足细分领域的多样性上，都要落后于海外同行。


    （2）需求端。市场竞争不充分，无法立竿见影地看到改善患者体验带来的利益。


    与民营医院在美国占据主体的情况完全不同，国内的医疗市场仍以公立医院为主，且三甲医院非常强势，市场竞争不充分。此外，人工智能影像诊断等设备在投入使用后就能看到立竿见影的收益，但改善患者体验需要一段较长的周期才能看到收益，因此医院对于改善患者体验的动力不足。


    虽然上述问题都无法在短期内解决，但是我们欣喜地发现，国内已经出现部分医疗机构开始尝试提升患者体验。2016年6月，张强医生集团公开招募中国首位患者体验官。虽然有人质疑这是场公关秀，但是无论如何，这都反映了患者体验在国内的医疗环境下越来越受到重视的事实。相信在不久的将来，我国也将诞生一批致力于利用人工智能提升医院运营能力的企业。


    ## 6.2 美国Atomwise：用AI研发新药，成本骤减数亿美


    ## 元


    Atomwise公司总部位于美国旧金山，成立于2012年6月，是一家利用超级计算机进行药品研发的公司。项目旨在运用超级计算机、AI和复杂的算法模拟制药过程，在预测新药品效果的同时降低研发成本。


    ## 6.2.1 现状：一款新药的成功研发约消耗29亿美元


    美国塔夫茨大学药物开发研究中心2014年的报告显示，从1996年至2013年美国药物研发成本（图6-2）看，一款成功上市的新药，平均花费约25.85亿美元，其中包括约13.9亿美元的直接资金投入和研发失败导致的约11.63亿美元的间接投入。据悉，此次报告的数据与2003年相比增长率约145%。


    ![](images/db16fe879de185ba68a9e155d45b0ae8.jpg)


    图6-2 1996年至2013年美国药物研发成本图（含成功上市药品成本与研发失败药品成本）


    该报告还指出，一款新药成功上市后，还会有平均3.12亿美元的投入用于进一步的评估研究，包括验证新的适应症、剂型及剂量等。因此，在整个上市前后的研发周期当中，一种研发成功的新药可能一共要消耗29亿美元。


    塔夫茨的分析数据来自10个药厂的106个研发项目，药厂规模大小不一但分配合理，其总和占全球前50家制药企业销售和研发投入的35%。


    ## 6.2.2 新药研发早期进行评估可大幅度降低药物研发成本


    从一个实验室发现的新化合物发展成为一个治疗疾病的药物，需要经过几个开发阶段：临床前试验、新药临床研究申请、一期临床试验、二期临床试验、三期临床试验、新药申请、批准上市。


    若将此过程中研发失败项目的金额算入制药公司的总开销额中，则研发药物的实际花费金额会更高。例如，葛兰素史克公司在1997年至2011年获批新药数量为10种，平均每种新药的花费达82亿美元，在同一时期，总研发花费约817亿美元。


    研究人员称，导致药物研发费用高昂的原因包括临床研究的复杂程度增加、研究规模增大、临床试验的失败率升高等。


    目前，提高研发效率、降低研发失败概率的主流做法是精简研发机构，通过外包与合作开发，再收购一些有潜力的生物技术公司，来间接减少药物研发的成本。


    但对于一个新药研发的成功机会，如果是出自内部研发的项目，其成功率要比来自外部技术转让的项目高20%。其中，降低研发失败概率主要是降低后期临床的失败概率，这需要在新药研发早期及早发现药物潜在的危险和不良反应，理智地评估新药研发的风险，及时终止不必要的新药研发工作。


    ## 6.2.3 Atomwise将深度学习技术运用于新药早期评估


    Atomwise公司用超级计算机分析已有数据库，并用AI和复杂的算法来模拟药品研发的过程，在研发的早期评估新药研发风险，让药物研究的成本降至数千美元，并且该评估可以在几天内完成。Atomwise为制药公司、创业公司和研究机构提供候选药物预测服务，而且Atomwise的服务可以预测新药品哪些有效，哪些无效。'
