    ## 第 3 章


    ## 全球格局：人工智能与医疗全球发展

    美国时间 2017 年 9 月 28 日下午，谷歌、脸书、亚马逊、IBM 及微软正式宣布成立一个新的 AI 组织——AI 合作组织（Partnership
    on AI），目标是保障 AI 在未来能够安全、透明、合理地发展。该组织的全名为保障 AI 利于人类社会组织（Partnership on Artificial
    Intelligence to Benefit People and Society），简称为 AI 合作组织。该组织的成立旨在重点研究、解决 AI 给人类社会带来的各种挑战，并探索人类能如何最有效地利用高速发展的科技。


    ## 3.1 人工智能+新型硬件提供商——IBM

    作为人工智能的先驱企业，IBM 已经逐渐将自身的核心业务集中在“Watson 认知”上，通过自己强大的数据分析能力、人工智能技术和云计算平台，为全球各行各业提供解决方案。


    （1）人工智能基础技术。在认知商业时代中，IBM 发展了以认知计算、大数据分析、物联网、异构计算、神经元芯片 Synapse、人工智能基础平台 SystemML、量子计算平台、认知型机器系统等为代表的一批新兴前沿技术。IBM
    未来 10 年的战略核心是“智慧地球”计划，在智慧能源、智慧交通、智慧医疗、智慧零售和智慧水资源等人工智能应用层面发力。


