    \ 电话：010-62756370\n\n## 内容提要\n\n本书是医疗领域中关于人工智能与医疗的权威读本和实战手册。\n\n本书立足前沿，全面回顾了人工智能技术在医疗行业的前世今生，对人工智能医疗的能力、应用领域、应用场景、成本结构、人才情况等进行了全面讲述。随着人工智能医疗企业纷纷将产品移至临床，针对各细分病种、各种医疗应用场景的研究不断深入，人工智能产品已经融入医疗流程的方方面面，行业中的商业模式也逐渐清晰，应用边界被不断扩展，可谓梦想照进现实。在其具体应用方面，本书重点介绍了人工智能在医疗领域的市场布局，分析了国内外行业巨头的最新技术成果和真实、前沿的投资案例，使读者能够全面了解人工智能的产业转化方向和投资风口。同时，市场发展不可或缺的监管政策也随之完善，政府的监管思路逐渐明晰。\n\
    \n本书从行业视角为大家呈现目前我国人工智能与医疗的发展现状及下一步研发方向，非常适合医疗领域的政府机构、企业、事业单位的领导及员工阅读。\n\n## 前言\n\
    \n不知道你是否会介意一台人工智能机器人对你的身体进行检查，为你开药方甚至动手术。无论你的想法是什么，这样的情形在不久的将来可能会成为现实。\n\n从1950年艾萨克·阿西莫夫的科幻小说I，Robot中的机器人，到电影《超能陆战队》中的护理机器人大白，人类一直希望机器人拥有理解、推理和学习的能力，并能更好地帮助人类。如今，人工智能和机器人技术，已经进步到如同护理机器人大白或者电影《星际迷航》中的“三录仪”一样，对人体进行扫描以检测其身体是否健康，提前发现异常情况，并辅助医生进行治疗。在1956年的达特茅斯会议上，人工智能的概念第一次被真正提出来，其作为信息技术的一种，早在40多年前就已经实验性地参与到医疗行为中。1972年，利兹大学研发了医疗领域最早出现的人工智能系统，此系统主要用于腹部剧痛的辅助诊断及手术的相关需求。\n\
    \n随着基础技术的发展，到如今，人工智能已发展到实用阶段。\n\n人工智能作为一种技术，对生产工具进行了升级。人们可以通过人工智能快速地对行业数据和过往知识进行汇总和梳理，从而辅助人们做决策。从以上的行为来看，人工智能所起到的作用有两个方面：一是对过往知识的总结和判断，因为它的学习速度非常快，有极强的总结能力；二是基于过去的经验做决策，决策的正确性有明显提高。所以，人工智能在效率上和准确度上远远高于人的主观判断。\n\
    \n人工智能技术起源于60多年前计算机刚刚出现的时候，从那时起，科学家就已经在探讨它的可能性，但是受制于基础硬件、数据量、算法等基础技术的发展水平，其一直没有在实际应用中发挥作用。如今，人工智能基础设施领域的计算能力、算法、大数据等技术水平得到全面提高，技术验证阶段现已完成，人工智能技术开始在各行各业中应用。汽车、金融、教育、医疗、农业等行业和人工智能技术的结合，逐步产生了商业价值，人工智能从生产力层面对传统行业进行了变革。\n\
    \n人工智能在各领域的参与程度正不断加大。人工智能的应用在各行各业中都有相似或者相近的优势，目前主要有两大辅助作用：一是高效率地辅助决策，二是对项目运营进行优化。例如，在业务辅助方面，人工智能在医疗领域可以辅助医生进行诊断，在金融领域可以辅助用户进行自动交易；在管理优化方面，人工智能在医疗领域可以辅助医院进行管理，在零售领域可以对库存和交易流程进行优化。\n\
    \n从现在的行业应用来看，人工智能做得更多的是对业务进行决策和优化。随着技术的发展，我们认为人工智能更有价值的作用是对未来进行预测。例如，在医疗领域，未来人们可以通过人工智能判断出疾病的发生概率，可以从现在开始做好预防。在农业领域，人工智能能对天气和需求进行判断，能早一步防止风险的出现。现在，已经有很多实验性的产品出现，未来还需进一步的商业化验证。\n\
    \n人工智能和医疗的结合，在业务模式、效率、准确度上所带来的显著变化让人们对这项“新”技术关注倍增。相信未来拥有辅助诊断、治疗功能的人工智能产品和机器人会大量出现在人们身边，来补充和完善现有的医疗服务。\n\
    \n通过对行业大数据的收集，人工智能用深度学习、算法来洞察业务中的关键决策点，计算速度和准确性都要高于人类。目前，在医疗行业中，人工智能的影像识别能力和准确性已经相当于人类的高年资医生，而且整个过程只需要几秒钟的时间。现实生活中，影像医生的培养需要几年甚至数十年的时间，而且成熟的影像医生对一个病例的判断也需要几十分钟。如此一来，人工智能仅仅在这个行业就可以节省大量的医生培养费用，而且还能显著提高医生的工作效率，价值巨大。\n\
    \n但是，新技术在发展的过程中，质量、准入和成本问题依然存在。技术研发者、产品使用者、政策制定者和付费者都需要思考：人工智能医生的角色定位是什么？人类医生的作用是什么？人工智能企业的商业模式如何建立？而这些都是本书所关注的重点。\n\
    \n2017年9月，动脉网蛋壳研究院发布了《2017医疗大数据和人工智能产业报告》，回顾了医疗人工智能的前世今生，对医疗人工智能的能力、应用场景、成本结构、人才情况进行了深度剖析，为产业人士和监管机构提供了一份重要参考材料，引发了广泛讨论。\n\
    \n2018年，人工智能企业纷纷将产品移至临床，针对各种细分病种、各种医疗应用场景的研究不断深入，人工智能产品已经融入医疗流程的方方面面。从药品研发、疾病诊断、疾病治疗、医生科研、医院管理等多个应用场景全面渗透。经过这几年的发展，一部分人工智能产品已基本成熟，商业模式逐渐清晰，人工智能技术在医疗领域开始不断扩展应用边界，给医疗运行流程带来了很多有趣的尝试。\n\
    \n同时，监管部门也紧跟技术发展的脚步，积极参与到产业升级的浪潮中，监管思路逐渐明晰。中国食品药品检定研究院已经完成眼底糖网彩照、肺结节影像数据库的建设，相关送审的三类产品超过30款，相信很快人们就能看到这三类人工智能医疗产品上市。动脉网蛋壳研究院对主要人工智能医疗企业进行了调研，对参与人工智能产品研发和使用的医生进行了访谈，以行业视角，为大家呈现目前我国医疗人工智能的发展现状及下一步研发方向。\n\
    \n## 绪论\n\n### 人工智能发展历程\n\n在对人工智能怀有很大的期待以前，有必要先回到它的过去，看清这一波人工智能浪潮到底是昙花一现还是拐点真的已经到来。\n\
    \n#### 0.1 解放大脑：人工智能的技术革命\n\n近代人类社会的飞速进步主要依赖于三次工业革命。第一次工业革命以蒸汽机的改良为标志，第二次工业革命以电力的广泛应用为标志，第三次工业革命以计算机的发明和使用为标志。三次工业革命显著地改变了人们的生产生活方式、社会结构甚至世界格局。\n\
    \n而以人工智能为代表的智能互联网技术被誉为第四次工业革命的推动力。前三次工业革命主要解放了人类的体力，而这次工业革命解放的将是人类的脑力（图0-1）。\n\
    \n![](images/441a4df74d87bef8b41c5f4f5cd04ed2.jpg)\n\n图0-1 四次工业革命\n\n社会的生态构成是以底层技术为基础，并由在这个基础上形成的社会关系、协调社会运行的规则机制和法度组成的。而域，就是一个时期技术、方法、实践的总和。当域里的关键技术逐渐演进最终发生根本性改变的时候，旧域会跃迁到新域，经济运行模式会在此基础上达到新的稳定，这个过程被称为“重新域定”。\n\
    \n人工智能技术最初只是其母域计算机科学中的一个很小的分支，但是在几十年的发展过程中创造出了能够自己学习的关键技术——深度学习。由此一个新的技术领域慢慢浮现，并发生了“变异”。当晶体管取代了电子管，电子技术就“变异”了。而深度学习出现之后，人工智能技术也出现了“变异”。\n\
    \n“新域”出现后，如何对经济造成影响呢？\n\n首先，新技术出现并发展时，会明显降低传统技术生产方式的成本。成本降低之后，整个行业都会受到新技术的影响，从而引起经济体系中的价格和生产网络在各行各业的延伸、重塑，如计算器的出现降低了算术的成本，数码相机的兴起降低了拍照的成本。\n\
    \n人工智能技术可以降低人们对未来进行预判所需的成本。一位诊治中风患者的医生可能需要借助CT片来观察患者脑出血的情况，需要向患者或其家属提问来收集信息，最终在统筹之下做出诊断，确定下一步的治疗方案。而智能医疗通过数据分析能够在瞬间提供最佳的辅助治疗方案。\n\
    \n其次，新技术的大量采用也会引起经济模式的扩展性调整，如炼钢技术的升级降低了钢铁价格的同时，也推动了无数工业领域的快速发展。电气化技术渗透到各行各业，造成传统生产结构的崩溃，新生产结构的诞生。\n\
    \n人工智能技术显著地提高了各行各业的执行效率，降低了各项运营成本，缓解了人类重复性脑力劳动的输出。从各行各业中提取、选择所需的内容和技术，并重新组合，有可能还会创造次生产业，最后完成经济的重新域定。\n\
    \n人工智能正处于域生命周期的青春期阶段，逐步解决了其在发展中产生的问题。对人工智能技术在市场的应用，可以预见的是，我们的经济和技术域都将在人工智能的冲击下发生颠覆式的改变。旧域到重新域定的过程很少能一蹴而就，一般需要20年甚至更长的时间。人工智能也一样，虽然已经诞生60多年，但直到现在才崭露头角。\n\
    \n#### 0.2 60年历程：从概念到模拟人的智能\n\n人工智能技术诞生已经60多年了。从第一台计算机诞生开始，科学家们就试图弄清楚机器是否具有真正的智能，如何区别有意识的人类和无意识的机器。\n\
    \n人工智能的奠基人是被人们同时称为计算机科学之父和人工智能之父的英国数学家、逻辑学家阿兰·麦席森·图灵（1912—1954）。1950年，图灵发表了一篇题为《计算机器与智能》（Computing\
    \ Machine and Intelligence）的论文，试图去定义什么是机器的智能：如果计算机能在5分钟内回答出由人类测试者提出的一系列问题，且超过30%的回答让测试者误认为是人类所答，那么，计算机就被认为具有智能，这就是著名的图灵测试（图0-2）。\n\
    \n![](images/761a949f812a4a4a242fc1c76363cb58.jpg)\n\n图0-2 图灵测试\n\n人工智能的概念第一次真正被提出来，是在1956年的达特茅斯会议上。一批著名科学家——斯坦福大学的约翰·麦卡锡、麻省理工学院的马文·明斯基、卡耐基梅隆大学的赫伯特·西蒙和艾伦·纽厄尔这4名日后的图灵奖获得者，还有信息论创始人克劳德·香农和国际商业机器公司（IBM）的罗切斯特，首次确立了“人工智能”概念：让机器像人那样认知、思考和学习，即用计算机模拟人的智能。\n\
    \n从此，人工智能诞生。科学家们孜孜不倦地在这个领域进行研究，直到今天。一开始，人们想通过新兴的计算机技术打造具有人类智慧的复杂机器，这种程度的人工智能被称为“强人工智能”（Artificial\
    \ General Intelligence，AGI），也称为通用人工智能。但是因为技术的局限性，计算机技术长期没有实现大的突破，人工智能无法达到人们预期的效果，这种神奇的类人机器只存在于科幻电影中。\n\
    \n自20世纪70年代以来，人工智能出现了7类典型应用，但是这些人工智能技术仅仅是“弱人工智能”（Artificial Narrow Intelligence，ANI），远远达不到人类的智慧水平。以下是7类典型应用。\n\
    \n第一，机器定理证明。核心技术为计算机逻辑推理，后来扩大到非逻辑推理。\n\n第二，机器翻译。核心技术是自然语言理解。\n\n第三，专家系统。核心技术是求解和知识表达。\n\
    \n第四，博弈。核心技术是树搜索，后来逐渐扩大到语意渗透神经网络。\n\n第五，模式识别。包括图像识别、声音识别。\n\n第六，学习。深度学习已成为人工智能非常重要的一个领域。\n\
    \n第七，机器人和智能控制。强调感知和控制。\n"
