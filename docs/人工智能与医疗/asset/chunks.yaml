- raw: '在人工智能早期发展阶段（20世纪50年代到20世纪70年代），人工智能主要是解决一些小型的数学和逻辑问题。研究人员认为，机器只要具有逻辑推理能力，就有了智能。这一时期的代表人物是艾伦·纽厄尔和赫伯特·西蒙，其共同开发了世界上最早的启发式程序——智能机器“逻辑理论家”。这个程序在1963年证明了著名数学家罗素和怀特海的名著《数学原理》中的全部52条定理。


    1959年，美国的阿瑟·塞缪尔（图0-3）设计了一个下棋程序，这个程序具有学习能力，可以在不断的对弈中改善自己的棋艺。4年后，这个程序战胜了设计者本人。又过了3年，这个程序战胜了美国一位保持8年不败的常胜将军。这个程序向人们展示了机器学习的能力，也引出了许多令人深思的社会问题与哲学问题。


    ![](images/ee070267041d71d693c430997c72f05a.jpg)


    图0-3 机器学习之父阿瑟·塞缪尔


    然而，随着研究的进行，人们发现机器仅具有逻辑和推理能力是远远不够的。此时的人工智能根本无法在行业中进行应用，在这之后，研究陷入长久的沉寂。直到20世纪70年代末，当计算机拥有了相对较大的存储容量，以深度学习为代表的算法有了较大发展，从而机器有能力处理如此庞大的数据时，人工智能才开始被逐渐引入来解决行业问题。


    因此，从20世纪70年代开始，人工智能发展进入“知识工程”时期，也就是“专家系统”。专家系统将行业专家总结出的规律编入程序中，让机器去解决问题。1972年，一款用于传染性血液诊断和用药选择的专家系统MYCIN^(\[1\])研发成功，这个系统是后来专家系统研究的基础。专家系统的出现，让计算机可以从大量数据中找到解决问题的方法，因此和行业的结合逐渐紧密起来。从大量数据中找到解决问题的方法，因此和行业的结合逐渐紧密起来。


    然而，专家系统同样遇到了瓶颈，把人类知识全部植入机器不是一件简单的事情。知识的获取往往需要大量的行业专家和时间的投入。同时，当时的专家系统程序主要由LISP编写，它是一种解释性语言，在速度上要显著慢于编译语言C语言，所以在实际使用中并不方便。在个人计算机快速发展之后，专家系统的“风光”也随之退去。人们开始考虑，应该让机器学会自己去归纳知识，即“机器学习”。


    20世纪90年代末，IBM的超级计算机“深蓝”击败国际象棋冠军加里·卡斯帕罗夫（图0-4），让人工智能再次被公众所关注，但此时的人工智能水平也无法支撑大规模的商业化应用。在经历了数次高潮和低谷后，直到2006年深度学习技术的出现，人工智能才拥有了令人兴奋的技术突破。


    ![](images/92d56248221865e8b0fc77da241aabcd.jpg)


    图0-4 1997年IBM “深蓝”大战卡斯帕罗夫


    \[1\] MYCIN：一种帮助医生对住院的血液感染患者进行诊断和选用抗生素类药物进行治疗的人工智能早期模拟决策系统。


    ## 0.3 两次低谷：催生变革的发生


    人工智能发展历史如图0-5所示。


    第一次人工智能浪潮出现在1956—1974年。其间，算法和方法论有了新的进展，特别是算法方面出现了很多世界级发明，其中包括一种被称为增强学习的雏形（贝尔曼公式）。增强学习是谷歌阿尔法狗（AlphaGo）算法的核心思想内容。如今人们常听到的深度学习模型的雏形感知器也是在那几年发明的。


    ![](images/53e8e34ecfa237ed4f612b6ac42f655b.jpg)


    图0-5 人工智能发展历史


    第一次人工智能的冬天出现在1974—1980年。人们发现逻辑证明器、感知器和增强学习等技术只能做很简单、领域很窄的任务，稍微超出范围就无法应对。实际上，这里存在3个方面的局限：计算机性能的瓶颈、计算机复杂性的增长及可供学习的知识不足。人工智能所基于的数学模型和数学手段被发现有一定的缺陷，计算机找不到足够的数据库去支撑算法的训练，智能也无从谈起。很多项目的停滞也影响了资助资金的走向，人工智能进入长达数年之久的低谷期。


    第二次人工智能的寒冬是由1987—1993年个人计算机（PC）的出现“促成”的。20世纪80年代，人工智能数学模型方面出现了重大发明，其中包括著名的多层神经网络^(\[1\])和反向传播算法^(\[2\])，同时还出现了能与人类下象棋的高度智能机器（1989年）。当时，苹果、IBM开始推广第一代个人计算机，计算机由此走入家庭，特别是费用远远低于专家系统所使用的Symbolics和LISP^(\[3\])等机器。于是在美国，由于政府支持的经费数额开始下降，故又一次寒冬来临。虽然研究还在继续，但是人工智能已经很少被提及了。


    21世纪初，随着计算机周边的互联能力、大数据、计算性能、存储能力和传感器技术的大幅度进步，以及人工智能相关的图像识别、深度学习和神经网络算法等关键技术的突破，人工智能终于有了革命性发展。人工智能从过去的基于专家和人为设定规则中走出，开始从海量数据中自动寻找规则。


    2006年，加拿大多伦多大学的杰弗里·辛顿（Geoffrey Hinton）教授发表论文《基于深度置信网络的快速学习算法》（A Fast Learning
    Algorithm For Deep Belief Nets）。他在文中提出的深层神经网络逐层训练的高效算法，让当时计算条件下的神经网络模型训练成为可能，同时通过深度神经网络模型得到的优异的实验结果让人们开始重新关注人工智能。在此之后，深度学习技术也开始被引入自然语言理解和图像处理等人工智能分支，并且借助强大的计算资源，这些技术也被投入实际的生产生活中，并产生了显著的经济效益。


    2016年，谷歌阿尔法狗和李世石的对弈让人工智能重回大众的视野（图0-6）。它所采用的神经网络模型通过一种新的训练方法，结合人类专家比赛中的棋谱，以及在和自己下棋的模式中进行强化学习。但是，即使是发展到现在的人工智能，也只是“弱人工智能”。弱人工智能虽然只能实现人类智慧中的特定应用，但是已经能够比人类更好地执行这些任务。


    ![](images/9d95dbbfcaa6c416ced38997cf1fc075.jpg)


    图0-6 谷歌阿尔法狗和李世石的对弈让人工智能重回大众的视野


    在这样一个大背景下，人工智能的变革不仅仅发生在理论研究领域，而且还越来越多地与实际生活应用场景结合。人工智能在医疗健康领域的应用，涵盖了医学影像处理、医疗大数据分析、新药发现、健康管理等多个方面。基于机器视觉的医疗图像处理是人工智能目前在医疗领域中应用的热点，大型IT企业如谷歌、微软，国外知名高校斯坦福、哈佛都有专门的研究团队来解决如何更好地让机器理解医学影像，并且协助医生做出诊断。IBM的智能认知系统Watson在阅读了上百万字的专业文献书籍和电子病历后，已在全球多个医院中被投入使用。


    \[1\] 多层神经网络：Multi-Layer Perceptron，MLP，即多层感知器，是一种前向结构的人工神经网络，映射一组输入向量到一组输出向量。MLP可以被看作一个有向图，由多个节点层组成，每一层全连接到下一层。


    \[2\] 反向传播算法：Backpropagation algorithm，即BP算法，一种监督学习算法，常被用来训练多层感知机。BP算法是在有导师的指导下，适用于多层神经元网络的一种学习算法，它建立在梯度下降法的基础上。


    \[3\] Symbolics和LISP：计算机制造商Symbolics于1985年3月15日注册了Symbolics.域名。Symbolics是一家从麻省理工学院人工智能实验室分拆出的公司，主要设计并制造LISP计算机（1981年，计算机名为Symbolic
    3600）。LISP计算机是一种单用户计算机，并针对LISP编程语言进行优化。该产品随后成为第一款商用的“通用计算机”和“工作站”。


    ## 第1章


    ## AI医疗：人工智能技术赋能医疗


    人工智能是赋予计算机感知、学习、推理及协助决策的能力，从而通过与人类相似的方式来解决问题的一项技术。在过去，计算机只能按照预先编写的固定程序开展工作，而具备这些能力以后，计算机理解世界及与世界交互的方式将比以前大为灵敏和自然。


    ## 1.1 关键技术：深度学习、机器学习、人工智能


    谈到人工智能的时候，有两个概念常常被提及，那就是机器学习（Machine Learning）和深度学习（Deep Learning）。机器学习和深度学习是包含关系，深度学习是帮助人工智能在现阶段发展的关键技术。


    机器学习是实现人工智能最基本的方法，是从过往的数据或经验中学习的算法，不依赖于硬件代码和事先定义的规则。传统的计算机程序为解决特定任务而编码，而机器学习使用大量的数据进行训练，可以通过算法从数据中学习如何完成任务。


    机器学习主要应用于早期的人工智能领域。传统算法包括决策树学习、推导逻辑规划、聚类、强化学习和贝叶斯网络等。在机器学习发展的早期，受限于计算机计算能力、样本量等因素，算法的局限性大，智能化程度低，无法实际应用。


    深度学习是机器学习的一个子集，它的发展是现在人工智能发展的驱动力量之一。深度学习使用的人工神经网络学习算法也是机器学习算法中的一种，只是之前人们对它的关注度不高。深度学习的核心是特征学习，旨在通过分层网络获取分层次的特征信息，从而解决以往需要人工设计特征的重要难题。


    杰弗里·辛顿（Geoffrey Hinton）和他的学生鲁斯兰·萨拉赫·胡迪诺夫（Ruslan Salak hutdi nov）在顶尖学术刊物《科学》（Science）上发表了一篇文章，开启了深度学习的新篇章。这篇文章有两个主要观点：第一，多隐层的人工神经网络具有优异的特征学习能力，学习得到的特征对数据有更本质的刻画，从而有利于可视化或分类；第二，深度神经网络在训练上的难度可以通过“逐层初始化”（Layer-wise
    Pre-training）来有效克服，在这篇文章中，逐层初始化是通过无监督学习实现的。


    深度学习的概念源于人工神经网络的研究。神经网络和深度学习两者之间有相同的地方，它们采用了相似的分层结构，而不一样的地方在于深度学习采用了不同的训练机制，具备强大的表达能力。传统神经网络曾经是机器学习领域很火的研究方向，后来由于参数难以调整和训练速度慢等问题淡出了人们的视野。之后，深度神经网络模型成为人工智能领域的重要前沿阵地，深度学习算法模型也经历了一个快速迭代的周期，深度信念网络（Deep
    Belief Network，DBN）、稀疏编码（Sparse Coding）、结构递归神经网络（Recursive Neural Network，RNN）、卷积神经网络（Convolutional
    Neural Network，CNN）等各种新的算法模型被不断提出，而其中卷积神经网络更是成为图像识别最炙手可热的算法模型。


    近几年来，计算机的计算能力和存储能力都有了很大提高，数据发掘引领了大数据时代的到来。深度学习作为增强机器学习能力的方法被广泛应用，配合大量数据，使原来复杂度很高的算法都能够实现，得到的结果也更为精准。


    ## 1.2 技术构成：算法、算力、大数据


    算法、算力和大数据是人工智能快速发展的3个要素，如图1-1所示。


    首先，在算法上的突破让人工智能的商业化发展看到了希望；其次，计算能力的提升使得复杂的算法得以实现，快速获得训练成果，降低成本；最后，大数据时代为人工智能的训练学习提供了大量的资料。三者相互联系、不可分割，离开其中任何一样，人工智能都无法实现大规模商业化应用。


    ![](images/e34e3fa75c2a162cac2f626519a28022.jpg)


    图1-1 人工智能发展的3个要素


    ## 1.2.1 算法


    算法是人工智能发展的基础，现在主要应用的是深度学习算法。算法框架中如TensorFlow、Caffe、Torch^(\[1\])等已经实现了开源，成为大多数工程师的选择，对行业的加速发展和人才的培养起到了非常大的作用。


    全球开源平台的成熟，也使得中国企业能够快速地复制其他地区开发的先进算法。就应用层面而言，中国的算法发展程度与其他国家并无太大差距。事实上，中国在语音识别的人工智能算法上取得了突破性进展，居于世界领先水平。


    ## 1.2.2 算力


    计算能力是人工智能的基础设施之一，因此具有极高的战略意义。GPU（图形处理器）强大的并行计算能力显著提升了计算机的性能，而且降低了成本。英伟达最新的RTX
    2080游戏显卡拥有9 TFLOPS^(\[2\])的浮点性能，但是价格只有700美元，每GFLOPS^(\[3\])的算力成本只有8美分。


    根据高盛的数据，1961年的IBM1620要提供1GFLOPS的算力，所需费用大概是9万亿美元。在算力部分，英伟达、英特尔和美国超威半导体公司（AMD）这家全球最大的芯片供应商负责提供GPU和CPU（中央处理器）。硅谷也在有针对性地发展现场可编程门阵列（FPGA）和专用集成电路（ASIC），应用于人工智能计算。云计算和超级计算机也在为人工智能的发展提供服务。


    ## 1.2.3 大数据


    机器学习是人工智能的核心和基础，而数据和以往的经验是机器学习优化计算机程序的性能标准。随着大数据时代的到来，来自全球的海量数据为人工智能的发展提供了良好的基础。据IDC统计，2011年全球数据总量已经达到1.8
    ZB，并以每两年翻一番的速度增长，预计到2020年，全球将总共拥有35 ZB的数据量，数据量增长近20倍；在数据规模方面，预计到2020年，全球大数据产业规模将达到2047亿美元，我国产业规模将突破万亿元。


    人工智能系统必须通过大量的数据来“训练”自己，才能不断提升输出结果的质量。拥有的高质量数据越多，神经网络就会变得越有效率。现在国家各统计部门的人口数据库通过大数据技术可以实现互联互通，形成个人完整生命周期的医疗健康大数据，为人工智能技术在医疗健康行业的应用提供了有力的支撑。


    那么，如何获取学习的数据呢？


    人工智能想要发展，会面临一项非常大的来自真实世界的挑战，那就是训练数据量严重不足。目前的数据来源主要有3个方面。


    一是企业自有数据。通过大量的人力采集，再对数据进行结构化处理，形成人工智能的训练基础。大部分人工智能企业在进入这个领域之前，正是在各自领域采集到了相当多的行业数据，才考虑对数据资源进行利用，形成人工智能业务。


    二是各国政府的公共数据。美国联邦政府在Data.gov数据平台上开放了来自多个领域的13万个数据集的数据，包含医疗、商业、农业、教育等领域。我国和其他国家也陆续开放了部分领域的公共数据。


    三是产业合作数据。人工智能创业公司通过和行业公司及产业链上游的数据公司建立合作关系来获取数据，如医疗方面和医院建立合作关系。IBM Watson一开始就是通过和纪念斯隆—凯特琳癌症中心（MSKCC）^(\[4\])合作获取病历、文献等数据的。


    谷歌阿尔法狗在规则定义明确的简单环境下，通过自行对弈创造了大量训练棋谱。但是在复杂的真实环境中，模拟数据难以发挥作用。人工智能想要实现自动驾驶或者疾病的治疗，就需要大量真实的交通事故数据和病历数据。但这方面的数据供给非常有限，而且数据采集难度很大。


    如果遇到数据量不足的情况，同时又很难通过之前那些行之有效的方式增加数据供给，就无法发挥深度学习的优势，更重要的是，还会遇到数据类型不一样的问题。物理世界中使用的是不同传感器获取的实时数据流，而现在深度学习在信息世界中的应用，如图像识别，使用的数据都是基于图片的数据点，而非数据流，所以这也是将深度学习现有的成果延伸到真实物理世界应用的一个底层障碍。


    降低对数据量的需求、实现小样本学习甚至One-Shot Learning^(\[5\])，是目前深度学习研究中的关键问题。延恩·勒昆（Yann LeCun）和约书亚·本吉奥（Yoshua
    Bengio）等深度学习专家也多次在演讲中提到解决深度学习中One-Shot Learning问题的重要性。但是，在两三年之内，小样本学习技术还无法取得突破，仍然需要给计算机提供大量真实数据让其学习。


    \[1\] TensorFlow、Caffe、Torch：深度学习框架的类型。全世界最流行的深度学习框架有Tensorﬂow、Caffe、Theano、MXNet、Torch和PyTorch。


    \[2\] TFLOPS：每秒1万亿次的浮点运算次数。


    \[3\] GFLOPS：每秒10亿次的浮点运算次数。


    \[4\] 纪念斯隆—凯特琳癌症中心（MSKCC）：世界上历史最悠久、规模最大的私立癌症中心。


    \[5\] One-Shot Learning：属于迁移学习领域，主要研究的是网络小样本精准分类问题和单样本学习能力。


    ## 1.3 行业应用：产业链、应用、优势


    ## 1.3.1 人工智能产业链


    人工智能产业链一般来说划分为3个层次，分别是底层的基础层、中间的技术层和上层的应用层（图1-2）。但是，前面谈到数据是人工智能产业链中非常重要的一环，它原本属于基础层，因为其重要性，我们把它提出来，与基础层并列。


    ![](images/633de866cd6dd6895dc497d479aadffa.jpg)


    图1-2 人工智能产业链布局


    ### 1．基础层


    基础层包含算力、算法和算法框架，是人工智能发展的软、硬件基础。算力包含GPU、CPU、FPGA、神经网络处理器（NPU）等硬件计算芯片，以及云服务器等；算法包含各种深度学习算法；算法框架包括Tensor
    Flow、Caffe等。


    ### 2．数据层


    数据层主要包括各个应用场景的一手数据。现在也被称为“大数据”时代，各行业数据文件的存储量非常大，类型多样，并可以在批量模式下快速流转和交换。医疗方面主要就是病历数据、影像数据、健康数据等。


    ### 3．技术层


    技术层主要包括各种领域的算法，如语音识别、语义分析、图像识别等，还包括各种传感器技术。


    ### 4．应用层


    应用层则是人工智能的各种应用场景，如智能医疗、智能农业、智能金融、智能工业、智能城市、智能家居、智能汽车等。只有和生活应用场景结合，并广泛应用到各领域中，人工智能才更有意义，才能从生产力层面对传统行业进行变革。


    ## 1.3.2 人工智能的行业应用


    将人工智能应用层进行分解，就能回答开篇的第一个问题——人工智能能做什么。


    人工智能的图像识别、语音识别的准确度提高到一定程度之后，就可以逐步在行业中应用了（表1-1）。人工智能图像识别错误率已经低于人类，语音识别等自然语言处理技术也已经在日常生活中得到广泛应用。例如，苹果手机内置的语音助手Siri、亚马逊智能音箱Echo、阿里YunOS个人助理+、阿里小蜜、支付宝安娜等。通过传感器和驱动器的结合，人工智能还可以结合高精度地图和环境感知信息感知并行动。运用此类技术的机器人、无人机、自动驾驶等智能设备已经投入使用。


    表1-1 人工智能在各行业中的应用


    ![](images/fa9919e76f8d5aebce236fb020bebfb0.jpg)


    ## 1.3.3 人工智能行业应用优势'
  fmt: '

    在人工智能早期发展阶段（20世纪50年代到20世纪70年代），人工智能主要是解决一些小型的数学和逻辑问题。研究人员认为，机器只要具有逻辑推理能力，就有了智能。这一时期的代表人物是艾伦·纽厄尔和赫伯特·西蒙，其共同开发了世界上最早的启发式程序——智能机器“逻辑理论家”。这个程序在1963年证明了著名数学家罗素和怀特海的名著《数学原理》中的全部52条定理。


    1959年，美国的阿瑟·塞缪尔（图0-3）设计了一个下棋程序，这个程序具有学习能力，可以在不断的对弈中改善自己的棋艺。4年后，这个程序战胜了设计者本人。又过了3年，这个程序战胜了美国一位保持8年不败的常胜将军。这个程序向人们展示了机器学习的能力，也引出了许多令人深思的社会问题与哲学问题。


    ![](images/ee070267041d71d693c430997c72f05a.jpg)


    图0-3 机器学习之父阿瑟·塞缪尔


    然而，随着研究的进行，人们发现机器仅具有逻辑和推理能力是远远不够的。此时的人工智能根本无法在行业中进行应用，在这之后，研究陷入长久的沉寂。直到20世纪70年代末，当计算机拥有了相对较大的存储容量，以深度学习为代表的算法有了较大发展，从而机器有能力处理如此庞大的数据时，人工智能才开始被逐渐引入来解决行业问题。


    因此，从20世纪70年代开始，人工智能发展进入“知识工程”时期，也就是“专家系统”。专家系统将行业专家总结出的规律编入程序中，让机器去解决问题。1972年，一款用于传染性血液诊断和用药选择的专家系统MYCIN^(\[1\])研发成功，这个系统是后来专家系统研究的基础。专家系统的出现，让计算机可以从大量数据中找到解决问题的方法，因此和行业的结合逐渐紧密起来。从大量数据中找到解决问题的方法，因此和行业的结合逐渐紧密起来。


    然而，专家系统同样遇到了瓶颈，把人类知识全部植入机器不是一件简单的事情。知识的获取往往需要大量的行业专家和时间的投入。同时，当时的专家系统程序主要由LISP编写，它是一种解释性语言，在速度上要显著慢于编译语言C语言，所以在实际使用中并不方便。在个人计算机快速发展之后，专家系统的“风光”也随之退去。人们开始考虑，应该让机器学会自己去归纳知识，即“机器学习”。


    20世纪90年代末，IBM的超级计算机“深蓝”击败国际象棋冠军加里·卡斯帕罗夫（图0-4），让人工智能再次被公众所关注，但此时的人工智能水平也无法支撑大规模的商业化应用。在经历了数次高潮和低谷后，直到2006年深度学习技术的出现，人工智能才拥有了令人兴奋的技术突破。


    ![](images/92d56248221865e8b0fc77da241aabcd.jpg)


    图0-4 1997年IBM “深蓝”大战卡斯帕罗夫


    \[1\] MYCIN：一种帮助医生对住院的血液感染患者进行诊断和选用抗生素类药物进行治疗的人工智能早期模拟决策系统。


    ## 0.3 两次低谷：催生变革的发生


    人工智能发展历史如图0-5所示。


    第一次人工智能浪潮出现在1956—1974年。其间，算法和方法论有了新的进展，特别是算法方面出现了很多世界级发明，其中包括一种被称为增强学习的雏形（贝尔曼公式）。增强学习是谷歌阿尔法狗（AlphaGo）算法的核心思想内容。如今人们常听到的深度学习模型的雏形感知器也是在那几年发明的。


    ![](images/53e8e34ecfa237ed4f612b6ac42f655b.jpg)


    图0-5 人工智能发展历史


    第一次人工智能的冬天出现在1974—1980年。人们发现逻辑证明器、感知器和增强学习等技术只能做很简单、领域很窄的任务，稍微超出范围就无法应对。实际上，这里存在3个方面的局限：计算机性能的瓶颈、计算机复杂性的增长及可供学习的知识不足。人工智能所基于的数学模型和数学手段被发现有一定的缺陷，计算机找不到足够的数据库去支撑算法的训练，智能也无从谈起。很多项目的停滞也影响了资助资金的走向，人工智能进入长达数年之久的低谷期。


    第二次人工智能的寒冬是由1987—1993年个人计算机（PC）的出现“促成”的。20世纪80年代，人工智能数学模型方面出现了重大发明，其中包括著名的多层神经网络^(\[1\])和反向传播算法^(\[2\])，同时还出现了能与人类下象棋的高度智能机器（1989年）。当时，苹果、IBM开始推广第一代个人计算机，计算机由此走入家庭，特别是费用远远低于专家系统所使用的Symbolics和LISP^(\[3\])等机器。于是在美国，由于政府支持的经费数额开始下降，故又一次寒冬来临。虽然研究还在继续，但是人工智能已经很少被提及了。


    21世纪初，随着计算机周边的互联能力、大数据、计算性能、存储能力和传感器技术的大幅度进步，以及人工智能相关的图像识别、深度学习和神经网络算法等关键技术的突破，人工智能终于有了革命性发展。人工智能从过去的基于专家和人为设定规则中走出，开始从海量数据中自动寻找规则。


    2006年，加拿大多伦多大学的杰弗里·辛顿（Geoffrey Hinton）教授发表论文《基于深度置信网络的快速学习算法》（A Fast Learning
    Algorithm For Deep Belief Nets）。他在文中提出的深层神经网络逐层训练的高效算法，让当时计算条件下的神经网络模型训练成为可能，同时通过深度神经网络模型得到的优异的实验结果让人们开始重新关注人工智能。在此之后，深度学习技术也开始被引入自然语言理解和图像处理等人工智能分支，并且借助强大的计算资源，这些技术也被投入实际的生产生活中，并产生了显著的经济效益。


    2016年，谷歌阿尔法狗和李世石的对弈让人工智能重回大众的视野（图0-6）。它所采用的神经网络模型通过一种新的训练方法，结合人类专家比赛中的棋谱，以及在和自己下棋的模式中进行强化学习。但是，即使是发展到现在的人工智能，也只是“弱人工智能”。弱人工智能虽然只能实现人类智慧中的特定应用，但是已经能够比人类更好地执行这些任务。


    ![](images/9d95dbbfcaa6c416ced38997cf1fc075.jpg)


    图0-6 谷歌阿尔法狗和李世石的对弈让人工智能重回大众的视野


    在这样一个大背景下，人工智能的变革不仅仅发生在理论研究领域，而且还越来越多地与实际生活应用场景结合。人工智能在医疗健康领域的应用，涵盖了医学影像处理、医疗大数据分析、新药发现、健康管理等多个方面。基于机器视觉的医疗图像处理是人工智能目前在医疗领域中应用的热点，大型IT企业如谷歌、微软，国外知名高校斯坦福、哈佛都有专门的研究团队来解决如何更好地让机器理解医学影像，并且协助医生做出诊断。IBM的智能认知系统Watson在阅读了上百万字的专业文献书籍和电子病历后，已在全球多个医院中被投入使用。


    \[1\] 多层神经网络：Multi-Layer Perceptron，MLP，即多层感知器，是一种前向结构的人工神经网络，映射一组输入向量到一组输出向量。MLP可以被看作一个有向图，由多个节点层组成，每一层全连接到下一层。


    \[2\] 反向传播算法：Backpropagation algorithm，即BP算法，一种监督学习算法，常被用来训练多层感知机。BP算法是在有导师的指导下，适用于多层神经元网络的一种学习算法，它建立在梯度下降法的基础上。


    \[3\] Symbolics和LISP：计算机制造商Symbolics于1985年3月15日注册了Symbolics.域名。Symbolics是一家从麻省理工学院人工智能实验室分拆出的公司，主要设计并制造LISP计算机（1981年，计算机名为Symbolic
    3600）。LISP计算机是一种单用户计算机，并针对LISP编程语言进行优化。该产品随后成为第一款商用的“通用计算机”和“工作站”。


    # 第1章


    ## AI医疗：人工智能技术赋能医疗


    人工智能是赋予计算机感知、学习、推理及协助决策的能力，从而通过与人类相似的方式来解决问题的一项技术。在过去，计算机只能按照预先编写的固定程序开展工作，而具备这些能力以后，计算机理解世界及与世界交互的方式将比以前大为灵敏和自然。


    ### 1.1 关键技术：深度学习、机器学习、人工智能


    谈到人工智能的时候，有两个概念常常被提及，那就是机器学习（Machine Learning）和深度学习（Deep Learning）。机器学习和深度学习是包含关系，深度学习是帮助人工智能在现阶段发展的关键技术。


    机器学习是实现人工智能最基本的方法，是从过往的数据或经验中学习的算法，不依赖于硬件代码和事先定义的规则。传统的计算机程序为解决特定任务而编码，而机器学习使用大量的数据进行训练，可以通过算法从数据中学习如何完成任务。


    机器学习主要应用于早期的人工智能领域。传统算法包括决策树学习、推导逻辑规划、聚类、强化学习和贝叶斯网络等。在机器学习发展的早期，受限于计算机计算能力、样本量等因素，算法的局限性大，智能化程度低，无法实际应用。


    深度学习是机器学习的一个子集，它的发展是现在人工智能发展的驱动力量之一。深度学习使用的人工神经网络学习算法也是机器学习算法中的一种，只是之前人们对它的关注度不高。深度学习的核心是特征学习，旨在通过分层网络获取分层次的特征信息，从而解决以往需要人工设计特征的重要难题。


    杰弗里·辛顿（Geoffrey Hinton）和他的学生鲁斯兰·萨拉赫·胡迪诺夫（Ruslan Salak hutdi nov）在顶尖学术刊物《科学》（Science）上发表了一篇文章，开启了深度学习的新篇章。这篇文章有两个主要观点：第一，多隐层的人工神经网络具有优异的特征学习能力，学习得到的特征对数据有更本质的刻画，从而有利于可视化或分类；第二，深度神经网络在训练上的难度可以通过“逐层初始化”（Layer-wise
    Pre-training）来有效克服，在这篇文章中，逐层初始化是通过无监督学习实现的。


    深度学习的概念源于人工神经网络的研究。神经网络和深度学习两者之间有相同的地方，它们采用了相似的分层结构，而不一样的地方在于深度学习采用了不同的训练机制，具备强大的表达能力。传统神经网络曾经是机器学习领域很火的研究方向，后来由于参数难以调整和训练速度慢等问题淡出了人们的视野。之后，深度神经网络模型成为人工智能领域的重要前沿阵地，深度学习算法模型也经历了一个快速迭代的周期，深度信念网络（Deep
    Belief Network，DBN）、稀疏编码（Sparse Coding）、结构递归神经网络（Recursive Neural Network，RNN）、卷积神经网络（Convolutional
    Neural Network，CNN）等各种新的算法模型被不断提出，而其中卷积神经网络更是成为图像识别最炙手可热的算法模型。


    近几年来，计算机的计算能力和存储能力都有了很大提高，数据发掘引领了大数据时代的到来。深度学习作为增强机器学习能力的方法被广泛应用，配合大量数据，使原来复杂度很高的算法都能够实现，得到的结果也更为精准。


    ### 1.2 技术构成：算法、算力、大数据


    算法、算力和大数据是人工智能快速发展的3个要素，如图1-1所示。


    首先，在算法上的突破让人工智能的商业化发展看到了希望；其次，计算能力的提升使得复杂的算法得以实现，快速获得训练成果，降低成本；最后，大数据时代为人工智能的训练学习提供了大量的资料。三者相互联系、不可分割，离开其中任何一样，人工智能都无法实现大规模商业化应用。


    ![](images/e34e3fa75c2a162cac2f626519a28022.jpg)


    图1-1 人工智能发展的3个要素


    #### 1.2.1 算法


    算法是人工智能发展的基础，现在主要应用的是深度学习算法。算法框架中如TensorFlow、Caffe、Torch^(\[1\])等已经实现了开源，成为大多数工程师的选择，对行业的加速发展和人才的培养起到了非常大的作用。


    全球开源平台的成熟，也使得中国企业能够快速地复制其他地区开发的先进算法。就应用层面而言，中国的算法发展程度与其他国家并无太大差距。事实上，中国在语音识别的人工智能算法上取得了突破性进展，居于世界领先水平。


    #### 1.2.2 算力


    计算能力是人工智能的基础设施之一，因此具有极高的战略意义。GPU（图形处理器）强大的并行计算能力显著提升了计算机的性能，而且降低了成本。英伟达最新的RTX
    2080游戏显卡拥有9 TFLOPS^(\[2\])的浮点性能，但是价格只有700美元，每GFLOPS^(\[3\])的算力成本只有8美分。


    根据高盛的数据，1961年的IBM1620要提供1GFLOPS的算力，所需费用大概是9万亿美元。在算力部分，英伟达、英特尔和美国超威半导体公司（AMD）这家全球最大的芯片供应商负责提供GPU和CPU（中央处理器）。硅谷也在有针对性地发展现场可编程门阵列（FPGA）和专用集成电路（ASIC），应用于人工智能计算。云计算和超级计算机也在为人工智能的发展提供服务。


    #### 1.2.3 大数据


    机器学习是人工智能的核心和基础，而数据和以往的经验是机器学习优化计算机程序的性能标准。随着大数据时代的到来，来自全球的海量数据为人工智能的发展提供了良好的基础。据IDC统计，2011年全球数据总量已经达到1.8
    ZB，并以每两年翻一番的速度增长，预计到2020年，全球将总共拥有35 ZB的数据量，数据量增长近20倍；在数据规模方面，预计到2020年，全球大数据产业规模将达到2047亿美元，我国产业规模将突破万亿元。


    人工智能系统必须通过大量的数据来“训练”自己，才能不断提升输出结果的质量。拥有的高质量数据越多，神经网络就会变得越有效率。现在国家各统计部门的人口数据库通过大数据技术可以实现互联互通，形成个人完整生命周期的医疗健康大数据，为人工智能技术在医疗健康行业的应用提供了有力的支撑。


    那么，如何获取学习的数据呢？


    人工智能想要发展，会面临一项非常大的来自真实世界的挑战，那就是训练数据量严重不足。目前的数据来源主要有3个方面。


    一是企业自有数据。通过大量的人力采集，再对数据进行结构化处理，形成人工智能的训练基础。大部分人工智能企业在进入这个领域之前，正是在各自领域采集到了相当多的行业数据，才考虑对数据资源进行利用，形成人工智能业务。


    二是各国政府的公共数据。美国联邦政府在Data.gov数据平台上开放了来自多个领域的13万个数据集的数据，包含医疗、商业、农业、教育等领域。我国和其他国家也陆续开放了部分领域的公共数据。


    三是产业合作数据。人工智能创业公司通过和行业公司及产业链上游的数据公司建立合作关系来获取数据，如医疗方面和医院建立合作关系。IBM Watson一开始就是通过和纪念斯隆—凯特琳癌症中心（MSKCC）^(\[4\])合作获取病历、文献等数据的。


    谷歌阿尔法狗在规则定义明确的简单环境下，通过自行对弈创造了大量训练棋谱。但是在复杂的真实环境中，模拟数据难以发挥作用。人工智能想要实现自动驾驶或者疾病的治疗，就需要大量真实的交通事故数据和病历数据。但这方面的数据供给非常有限，而且数据采集难度很大。


    如果遇到数据量不足的情况，同时又很难通过之前那些行之有效的方式增加数据供给，就无法发挥深度学习的优势，更重要的是，还会遇到数据类型不一样的问题。物理世界中使用的是不同传感器获取的实时数据流，而现在深度学习在信息世界中的应用，如图像识别，使用的数据都是基于图片的数据点，而非数据流，所以这也是将深度学习现有的成果延伸到真实物理世界应用的一个底层障碍。


    降低对数据量的需求、实现小样本学习甚至One-Shot Learning^(\[5\])，是目前深度学习研究中的关键问题。延恩·勒昆（Yann LeCun）和约书亚·本吉奥（Yoshua
    Bengio）等深度学习专家也多次在演讲中提到解决深度学习中One-Shot Learning问题的重要性。但是，在两三年之内，小样本学习技术还无法取得突破，仍然需要给计算机提供大量真实数据让其学习。


    \[1\] TensorFlow、Caffe、Torch：深度学习框架的类型。全世界最流行的深度学习框架有Tensorﬂow、Caffe、Theano、MXNet、Torch和PyTorch。


    \[2\] TFLOPS：每秒1万亿次的浮点运算次数。


    \[3\] GFLOPS：每秒10亿次的浮点运算次数。


    \[4\] 纪念斯隆—凯特琳癌症中心（MSKCC）：世界上历史最悠久、规模最大的私立癌症中心。


    \[5\] One-Shot Learning：属于迁移学习领域，主要研究的是网络小样本精准分类问题和单样本学习能力。


    ### 1.3 行业应用：产业链、应用、优势


    #### 1.3.1 人工智能产业链


    人工智能产业链一般来说划分为3个层次，分别是底层的基础层、中间的技术层和上层的应用层（图1-2）。但是，前面谈到数据是人工智能产业链中非常重要的一环，它原本属于基础层，因为其重要性，我们把它提出来，与基础层并列。


    ![](images/633de866cd6dd6895dc497d479aadffa.jpg)


    图1-2 人工智能产业链布局


    ##### 1．基础层


    基础层包含算力、算法和算法框架，是人工智能发展的软、硬件基础。算力包含GPU、CPU、FPGA、神经网络处理器（NPU）等硬件计算芯片，以及云服务器等；算法包含各种深度学习算法；算法框架包括Tensor
    Flow、Caffe等。


    ##### 2．数据层


    数据层主要包括各个应用场景的一手数据。现在也被称为“大数据”时代，各行业数据文件的存储量非常大，类型多样，并可以在批量模式下快速流转和交换。医疗方面主要就是病历数据、影像数据、健康数据等。


    ##### 3．技术层


    技术层主要包括各种领域的算法，如语音识别、语义分析、图像识别等，还包括各种传感器技术。


    ##### 4．应用层


    应用层则是人工智能的各种应用场景，如智能医疗、智能农业、智能金融、智能工业、智能城市、智能家居、智能汽车等。只有和生活应用场景结合，并广泛应用到各领域中，人工智能才更有意义，才能从生产力层面对传统行业进行变革。


    #### 1.3.2 人工智能的行业应用


    将人工智能应用层进行分解，就能回答开篇的第一个问题——人工智能能做什么。


    人工智能的图像识别、语音识别的准确度提高到一定程度之后，就可以逐步在行业中应用了（表1-1）。人工智能图像识别错误率已经低于人类，语音识别等自然语言处理技术也已经在日常生活中得到广泛应用。例如，苹果手机内置的语音助手Siri、亚马逊智能音箱Echo、阿里YunOS个人助理+、阿里小蜜、支付宝安娜等。通过传感器和驱动器的结合，人工智能还可以结合高精度地图和环境感知信息感知并行动。运用此类技术的机器人、无人机、自动驾驶等智能设备已经投入使用。


    表1-1 人工智能在各行业中的应用


    ![](images/fa9919e76f8d5aebce236fb020bebfb0.jpg)


    #### 1.3.3 人工智能行业应用优势

    '
  trans: '


    在人工智能早期发展阶段（20 世纪 50 年代到 20 世纪 70 年代），人工智能主要是解决一些小型的数学和逻辑问题。研究人员认为，机器只要具有逻辑推理能力，就有了智能。这一时期的代表人物是艾伦·纽厄尔和赫伯特·西蒙，其共同开发了世界上最早的启发式程序——智能机器“逻辑理论家”。这个程序在
    1963 年证明了著名数学家罗素和怀特海的名著《数学原理》中的全部 52 条定理。


    1959 年，美国的阿瑟·塞缪尔（图 0-3）设计了一个下棋程序，这个程序具有学习能力，可以在不断的对弈中改善自己的棋艺。4 年后，这个程序战胜了设计者本人。又过了
    3 年，这个程序战胜了美国一位保持 8 年不败的常胜将军。这个程序向人们展示了机器学习的能力，也引出了许多令人深思的社会问题与哲学问题。


    ![](img/ee070267041d71d693c430997c72f05a.jpg)


    图 0-3 机器学习之父阿瑟·塞缪尔


    然而，随着研究的进行，人们发现机器仅具有逻辑和推理能力是远远不够的。此时的人工智能根本无法在行业中进行应用，在这之后，研究陷入长久的沉寂。直到 20 世纪
    70 年代末，当计算机拥有了相对较大的存储容量，以深度学习为代表的算法有了较大发展，从而机器有能力处理如此庞大的数据时，人工智能才开始被逐渐引入来解决行业问题。


    因此，从 20 世纪 70 年代开始，人工智能发展进入“知识工程”时期，也就是“专家系统”。专家系统将行业专家总结出的规律编入程序中，让机器去解决问题。1972
    年，一款用于传染性血液诊断和用药选择的专家系统 MYCIN^(\[1\])研发成功，这个系统是后来专家系统研究的基础。专家系统的出现，让计算机可以从大量数据中找到解决问题的方法，因此和行业的结合逐渐紧密起来。从大量数据中找到解决问题的方法，因此和行业的结合逐渐紧密起来。


    然而，专家系统同样遇到了瓶颈，把人类知识全部植入机器不是一件简单的事情。知识的获取往往需要大量的行业专家和时间的投入。同时，当时的专家系统程序主要由 LISP
    编写，它是一种解释性语言，在速度上要显著慢于编译语言 C 语言，所以在实际使用中并不方便。在个人计算机快速发展之后，专家系统的“风光”也随之退去。人们开始考虑，应该让机器学会自己去归纳知识，即“机器学习”。


    20 世纪 90 年代末，IBM 的超级计算机“深蓝”击败国际象棋冠军加里·卡斯帕罗夫（图 0-4），让人工智能再次被公众所关注，但此时的人工智能水平也无法支撑大规模的商业化应用。在经历了数次高潮和低谷后，直到
    2006 年深度学习技术的出现，人工智能才拥有了令人兴奋的技术突破。


    ![](img/92d56248221865e8b0fc77da241aabcd.jpg)


    图 0-4 1997 年 IBM “深蓝”大战卡斯帕罗夫


    \[1\] MYCIN：一种帮助医生对住院的血液感染患者进行诊断和选用抗生素类药物进行治疗的人工智能早期模拟决策系统。


    ## 0.3 两次低谷：催生变革的发生


    人工智能发展历史如图 0-5 所示。


    第一次人工智能浪潮出现在 1956—1974 年。其间，算法和方法论有了新的进展，特别是算法方面出现了很多世界级发明，其中包括一种被称为增强学习的雏形（贝尔曼公式）。增强学习是谷歌阿尔法狗（AlphaGo）算法的核心思想内容。如今人们常听到的深度学习模型的雏形感知器也是在那几年发明的。


    ![](img/53e8e34ecfa237ed4f612b6ac42f655b.jpg)


    图 0-5 人工智能发展历史


    第一次人工智能的冬天出现在 1974—1980 年。人们发现逻辑证明器、感知器和增强学习等技术只能做很简单、领域很窄的任务，稍微超出范围就无法应对。实际上，这里存在
    3 个方面的局限：计算机性能的瓶颈、计算机复杂性的增长及可供学习的知识不足。人工智能所基于的数学模型和数学手段被发现有一定的缺陷，计算机找不到足够的数据库去支撑算法的训练，智能也无从谈起。很多项目的停滞也影响了资助资金的走向，人工智能进入长达数年之久的低谷期。


    第二次人工智能的寒冬是由 1987—1993 年个人计算机（PC）的出现“促成”的。20 世纪 80 年代，人工智能数学模型方面出现了重大发明，其中包括著名的多层神经网络^(\[1\])和反向传播算法^(\[2\])，同时还出现了能与人类下象棋的高度智能机器（1989
    年）。当时，苹果、IBM 开始推广第一代个人计算机，计算机由此走入家庭，特别是费用远远低于专家系统所使用的 Symbolics 和 LISP^(\[3\])等机器。于是在美国，由于政府支持的经费数额开始下降，故又一次寒冬来临。虽然研究还在继续，但是人工智能已经很少被提及了。


    21 世纪初，随着计算机周边的互联能力、大数据、计算性能、存储能力和传感器技术的大幅度进步，以及人工智能相关的图像识别、深度学习和神经网络算法等关键技术的突破，人工智能终于有了革命性发展。人工智能从过去的基于专家和人为设定规则中走出，开始从海量数据中自动寻找规则。


    2006 年，加拿大多伦多大学的杰弗里·辛顿（Geoffrey Hinton）教授发表论文《基于深度置信网络的快速学习算法》（A Fast Learning
    Algorithm For Deep Belief Nets）。他在文中提出的深层神经网络逐层训练的高效算法，让当时计算条件下的神经网络模型训练成为可能，同时通过深度神经网络模型得到的优异的实验结果让人们开始重新关注人工智能。在此之后，深度学习技术也开始被引入自然语言理解和图像处理等人工智能分支，并且借助强大的计算资源，这些技术也被投入实际的生产生活中，并产生了显著的经济效益。


    2016 年，谷歌阿尔法狗和李世石的对弈让人工智能重回大众的视野（图 0-6）。它所采用的神经网络模型通过一种新的训练方法，结合人类专家比赛中的棋谱，以及在和自己下棋的模式中进行强化学习。但是，即使是发展到现在的人工智能，也只是“弱人工智能”。弱人工智能虽然只能实现人类智慧中的特定应用，但是已经能够比人类更好地执行这些任务。


    ![](img/9d95dbbfcaa6c416ced38997cf1fc075.jpg)


    图 0-6 谷歌阿尔法狗和李世石的对弈让人工智能重回大众的视野


    在这样一个大背景下，人工智能的变革不仅仅发生在理论研究领域，而且还越来越多地与实际生活应用场景结合。人工智能在医疗健康领域的应用，涵盖了医学影像处理、医疗大数据分析、新药发现、健康管理等多个方面。基于机器视觉的医疗图像处理是人工智能目前在医疗领域中应用的热点，大型
    IT 企业如谷歌、微软，国外知名高校斯坦福、哈佛都有专门的研究团队来解决如何更好地让机器理解医学影像，并且协助医生做出诊断。IBM 的智能认知系统 Watson
    在阅读了上百万字的专业文献书籍和电子病历后，已在全球多个医院中被投入使用。


    \[1\] 多层神经网络：Multi-Layer Perceptron，MLP，即多层感知器，是一种前向结构的人工神经网络，映射一组输入向量到一组输出向量。MLP
    可以被看作一个有向图，由多个节点层组成，每一层全连接到下一层。


    \[2\] 反向传播算法：Backpropagation algorithm，即 BP 算法，一种监督学习算法，常被用来训练多层感知机。BP 算法是在有导师的指导下，适用于多层神经元网络的一种学习算法，它建立在梯度下降法的基础上。


    \[3\] Symbolics 和 LISP：计算机制造商 Symbolics 于 1985 年 3 月 15 日注册了 Symbolics.域名。Symbolics
    是一家从麻省理工学院人工智能实验室分拆出的公司，主要设计并制造 LISP 计算机（1981 年，计算机名为 Symbolic 3600）。LISP 计算机是一种单用户计算机，并针对
    LISP 编程语言进行优化。该产品随后成为第一款商用的“通用计算机”和“工作站”。


    # 第 1 章


    ## AI 医疗：人工智能技术赋能医疗


    人工智能是赋予计算机感知、学习、推理及协助决策的能力，从而通过与人类相似的方式来解决问题的一项技术。在过去，计算机只能按照预先编写的固定程序开展工作，而具备这些能力以后，计算机理解世界及与世界交互的方式将比以前大为灵敏和自然。


    ### 1.1 关键技术：深度学习、机器学习、人工智能


    谈到人工智能的时候，有两个概念常常被提及，那就是机器学习（Machine Learning）和深度学习（Deep Learning）。机器学习和深度学习是包含关系，深度学习是帮助人工智能在现阶段发展的关键技术。


    机器学习是实现人工智能最基本的方法，是从过往的数据或经验中学习的算法，不依赖于硬件代码和事先定义的规则。传统的计算机程序为解决特定任务而编码，而机器学习使用大量的数据进行训练，可以通过算法从数据中学习如何完成任务。


    机器学习主要应用于早期的人工智能领域。传统算法包括决策树学习、推导逻辑规划、聚类、强化学习和贝叶斯网络等。在机器学习发展的早期，受限于计算机计算能力、样本量等因素，算法的局限性大，智能化程度低，无法实际应用。


    深度学习是机器学习的一个子集，它的发展是现在人工智能发展的驱动力量之一。深度学习使用的人工神经网络学习算法也是机器学习算法中的一种，只是之前人们对它的关注度不高。深度学习的核心是特征学习，旨在通过分层网络获取分层次的特征信息，从而解决以往需要人工设计特征的重要难题。


    杰弗里·辛顿（Geoffrey Hinton）和他的学生鲁斯兰·萨拉赫·胡迪诺夫（Ruslan Salak hutdi nov）在顶尖学术刊物《科学》（Science）上发表了一篇文章，开启了深度学习的新篇章。这篇文章有两个主要观点：第一，多隐层的人工神经网络具有优异的特征学习能力，学习得到的特征对数据有更本质的刻画，从而有利于可视化或分类；第二，深度神经网络在训练上的难度可以通过“逐层初始化”（Layer-wise
    Pre-training）来有效克服，在这篇文章中，逐层初始化是通过无监督学习实现的。


    深度学习的概念源于人工神经网络的研究。神经网络和深度学习两者之间有相同的地方，它们采用了相似的分层结构，而不一样的地方在于深度学习采用了不同的训练机制，具备强大的表达能力。传统神经网络曾经是机器学习领域很火的研究方向，后来由于参数难以调整和训练速度慢等问题淡出了人们的视野。之后，深度神经网络模型成为人工智能领域的重要前沿阵地，深度学习算法模型也经历了一个快速迭代的周期，深度信念网络（Deep
    Belief Network，DBN）、稀疏编码（Sparse Coding）、结构递归神经网络（Recursive Neural Network，RNN）、卷积神经网络（Convolutional
    Neural Network，CNN）等各种新的算法模型被不断提出，而其中卷积神经网络更是成为图像识别最炙手可热的算法模型。


    近几年来，计算机的计算能力和存储能力都有了很大提高，数据发掘引领了大数据时代的到来。深度学习作为增强机器学习能力的方法被广泛应用，配合大量数据，使原来复杂度很高的算法都能够实现，得到的结果也更为精准。


    ### 1.2 技术构成：算法、算力、大数据


    算法、算力和大数据是人工智能快速发展的 3 个要素，如图 1-1 所示。


    首先，在算法上的突破让人工智能的商业化发展看到了希望；其次，计算能力的提升使得复杂的算法得以实现，快速获得训练成果，降低成本；最后，大数据时代为人工智能的训练学习提供了大量的资料。三者相互联系、不可分割，离开其中任何一样，人工智能都无法实现大规模商业化应用。


    ![](img/e34e3fa75c2a162cac2f626519a28022.jpg)


    图 1-1 人工智能发展的 3 个要素


    #### 1.2.1 算法


    算法是人工智能发展的基础，现在主要应用的是深度学习算法。算法框架中如 TensorFlow、Caffe、Torch^(\[1\])等已经实现了开源，成为大多数工程师的选择，对行业的加速发展和人才的培养起到了非常大的作用。


    全球开源平台的成熟，也使得中国企业能够快速地复制其他地区开发的先进算法。就应用层面而言，中国的算法发展程度与其他国家并无太大差距。事实上，中国在语音识别的人工智能算法上取得了突破性进展，居于世界领先水平。


    #### 1.2.2 算力


    计算能力是人工智能的基础设施之一，因此具有极高的战略意义。GPU（图形处理器）强大的并行计算能力显著提升了计算机的性能，而且降低了成本。英伟达最新的 RTX
    2080 游戏显卡拥有 9 TFLOPS^(\[2\])的浮点性能，但是价格只有 700 美元，每 GFLOPS^(\[3\])的算力成本只有 8 美分。


    根据高盛的数据，1961 年的 IBM1620 要提供 1GFLOPS 的算力，所需费用大概是 9 万亿美元。在算力部分，英伟达、英特尔和美国超威半导体公司（AMD）这家全球最大的芯片供应商负责提供
    GPU 和 CPU（中央处理器）。硅谷也在有针对性地发展现场可编程门阵列（FPGA）和专用集成电路（ASIC），应用于人工智能计算。云计算和超级计算机也在为人工智能的发展提供服务。


    #### 1.2.3 大数据


    机器学习是人工智能的核心和基础，而数据和以往的经验是机器学习优化计算机程序的性能标准。随着大数据时代的到来，来自全球的海量数据为人工智能的发展提供了良好的基础。据
    IDC 统计，2011 年全球数据总量已经达到 1.8 ZB，并以每两年翻一番的速度增长，预计到 2020 年，全球将总共拥有 35 ZB 的数据量，数据量增长近
    20 倍；在数据规模方面，预计到 2020 年，全球大数据产业规模将达到 2047 亿美元，我国产业规模将突破万亿元。


    人工智能系统必须通过大量的数据来“训练”自己，才能不断提升输出结果的质量。拥有的高质量数据越多，神经网络就会变得越有效率。现在国家各统计部门的人口数据库通过大数据技术可以实现互联互通，形成个人完整生命周期的医疗健康大数据，为人工智能技术在医疗健康行业的应用提供了有力的支撑。


    那么，如何获取学习的数据呢？


    人工智能想要发展，会面临一项非常大的来自真实世界的挑战，那就是训练数据量严重不足。目前的数据来源主要有 3 个方面。


    一是企业自有数据。通过大量的人力采集，再对数据进行结构化处理，形成人工智能的训练基础。大部分人工智能企业在进入这个领域之前，正是在各自领域采集到了相当多的行业数据，才考虑对数据资源进行利用，形成人工智能业务。


    二是各国政府的公共数据。美国联邦政府在 Data.gov 数据平台上开放了来自多个领域的 13 万个数据集的数据，包含医疗、商业、农业、教育等领域。我国和其他国家也陆续开放了部分领域的公共数据。


    三是产业合作数据。人工智能创业公司通过和行业公司及产业链上游的数据公司建立合作关系来获取数据，如医疗方面和医院建立合作关系。IBM Watson 一开始就是通过和纪念斯隆—凯特琳癌症中心（MSKCC）^(\[4\])合作获取病历、文献等数据的。


    谷歌阿尔法狗在规则定义明确的简单环境下，通过自行对弈创造了大量训练棋谱。但是在复杂的真实环境中，模拟数据难以发挥作用。人工智能想要实现自动驾驶或者疾病的治疗，就需要大量真实的交通事故数据和病历数据。但这方面的数据供给非常有限，而且数据采集难度很大。


    如果遇到数据量不足的情况，同时又很难通过之前那些行之有效的方式增加数据供给，就无法发挥深度学习的优势，更重要的是，还会遇到数据类型不一样的问题。物理世界中使用的是不同传感器获取的实时数据流，而现在深度学习在信息世界中的应用，如图像识别，使用的数据都是基于图片的数据点，而非数据流，所以这也是将深度学习现有的成果延伸到真实物理世界应用的一个底层障碍。


    降低对数据量的需求、实现小样本学习甚至 One-Shot Learning^(\[5\])，是目前深度学习研究中的关键问题。延恩·勒昆（Yann LeCun）和约书亚·本吉奥（Yoshua
    Bengio）等深度学习专家也多次在演讲中提到解决深度学习中 One-Shot Learning 问题的重要性。但是，在两三年之内，小样本学习技术还无法取得突破，仍然需要给计算机提供大量真实数据让其学习。


    \[1\] TensorFlow、Caffe、Torch：深度学习框架的类型。全世界最流行的深度学习框架有 Tensorﬂow、Caffe、Theano、MXNet、Torch
    和 PyTorch。


    \[2\] TFLOPS：每秒 1 万亿次的浮点运算次数。


    \[3\] GFLOPS：每秒 10 亿次的浮点运算次数。


    \[4\] 纪念斯隆—凯特琳癌症中心（MSKCC）：世界上历史最悠久、规模最大的私立癌症中心。


    \[5\] One-Shot Learning：属于迁移学习领域，主要研究的是网络小样本精准分类问题和单样本学习能力。


    ### 1.3 行业应用：产业链、应用、优势


    #### 1.3.1 人工智能产业链


    人工智能产业链一般来说划分为 3 个层次，分别是底层的基础层、中间的技术层和上层的应用层（图 1-2）。但是，前面谈到数据是人工智能产业链中非常重要的一环，它原本属于基础层，因为其重要性，我们把它提出来，与基础层并列。


    ![](img/633de866cd6dd6895dc497d479aadffa.jpg)


    图 1-2 人工智能产业链布局


    ##### 1．基础层


    基础层包含算力、算法和算法框架，是人工智能发展的软、硬件基础。算力包含 GPU、CPU、FPGA、神经网络处理器（NPU）等硬件计算芯片，以及云服务器等；算法包含各种深度学习算法；算法框架包括
    Tensor Flow、Caffe 等。


    ##### 2．数据层


    数据层主要包括各个应用场景的一手数据。现在也被称为“大数据”时代，各行业数据文件的存储量非常大，类型多样，并可以在批量模式下快速流转和交换。医疗方面主要就是病历数据、影像数据、健康数据等。


    ##### 3．技术层


    技术层主要包括各种领域的算法，如语音识别、语义分析、图像识别等，还包括各种传感器技术。


    ##### 4．应用层


    应用层则是人工智能的各种应用场景，如智能医疗、智能农业、智能金融、智能工业、智能城市、智能家居、智能汽车等。只有和生活应用场景结合，并广泛应用到各领域中，人工智能才更有意义，才能从生产力层面对传统行业进行变革。


    #### 1.3.2 人工智能的行业应用


    将人工智能应用层进行分解，就能回答开篇的第一个问题——人工智能能做什么。


    人工智能的图像识别、语音识别的准确度提高到一定程度之后，就可以逐步在行业中应用了（表 1-1）。人工智能图像识别错误率已经低于人类，语音识别等自然语言处理技术也已经在日常生活中得到广泛应用。例如，苹果手机内置的语音助手
    Siri、亚马逊智能音箱 Echo、阿里 YunOS 个人助理+、阿里小蜜、支付宝安娜等。通过传感器和驱动器的结合，人工智能还可以结合高精度地图和环境感知信息感知并行动。运用此类技术的机器人、无人机、自动驾驶等智能设备已经投入使用。


    表 1-1 人工智能在各行业中的应用


    ![](img/fa9919e76f8d5aebce236fb020bebfb0.jpg)


    #### 1.3.3 人工智能行业应用优势


