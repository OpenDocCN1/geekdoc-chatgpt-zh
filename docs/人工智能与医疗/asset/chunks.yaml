    Cloud Medx公司成立于2014年，总部位于加州帕罗奥多（Palo Alto）。公司的主营业务是基于大数据的整合和决策辅助，从众多医院实时收集不同患者的数据，经处理分析后向医疗机构提供符合HIPAA的健康预测和分析。Cloud
