    ## 第6章


    ## 典型企业：人工智能与医疗领域企业案例


    如今医学界越来越多的公司将他们的商业前景设定在人工智能的大背景下，希望能够在人工智能的帮助下颠覆医疗保健行业。这些公司通过人工智能实现医疗保健的民主化，并且它们以建立一个更透明和有效的医疗保健系统为使命，并为之努力奋斗。


    ## 6.1 美国NarrativeDx：人工智能，解决传统患者体验调


    ## 查中的痛点


    美国德克萨斯州奥斯汀市的科技创业公司NarrativeDx通过人工智能中的自然语言处理技术，为医院分析影响患者体验的因素，提供改善患者体验的解决方案。


    ## 6.1.1 公司特点


    ### 1．具有强大技术背景的核心领导层


    作为一家以技术为驱动力的创业公司，NarrativeDx的3位核心管理者（图6-1）都有强大的技术背景。创始人兼CEO凯尔·罗伯森（Kyle Robertson）本科毕业于爱荷华州立大学，他同时攻读了计算机工程、数学和经济学3门学科，在此期间还到伦敦大学学院的数学系当了一年的交换生。毕业后，Kyle
    Robertson相继在电子元器件公司迪进国际（Digi International）和电子设备公司美国国家仪器有限公司（National Instruments）担任软件工程师。


    2006年，已经工作两年的Kyle Robertson似乎厌倦了工程师的生活，他决定重返校园，到波士顿学院法学院钻研法律。研究生毕业后，Kyle Robertson开始了在知名律师事务所威尔默·黑尔（Wilmer
    Hale）的律师生涯，主要负责知识产权类的诉讼。


    2012年，Kyle Robertson从律师事务所辞职，创办了公益捐赠平台iCare。虽然仅在一年后iCare就停止运营，但这个项目让Kyle Robertson积累了宝贵的创业经验。


    与在学业和职业上经历过多次转型的Kyle Robertson相比，NarrativeDx的另一位创始人塞内姆·冈尼（Senem Guney）显得“专注”不少。


    Senem Guney本科毕业于土耳其海峡大学的翻译与同声传译系，紧接着她来到美国，在德克萨斯大学奥斯汀分校攻读语言学硕士和传播学博士。在创办NarrativeDx前，她一直任教于奥尔巴尼大学，致力于研究语言与技术的融合。目前，Senem
    Guney担任公司的首席体验官（Chief Experience Officer，CXO）。


    首席数据科学家（Chief Data Scientist，CDS）Tad Turpen虽然不是创始团队成员，但是他在公司内部的分量举足轻重。CEO Kyle
    Robertson曾耗时半年物色合适的数据分析师，最终Tad Turpen凭借圣地亚哥大学计算机系学士和布兰迪斯大学计算语言学硕士的背景吸引到了他的注意。另外，Tad
    Turpen还曾在北京大学有过短暂的求学经历。


    ![](images/ad70e882425b9215f9e4e586898e2882.jpg)


    图6-1 NarrativeDx的3位核心管理者


    ### 2．利用自然语言处理技术洞察患者对医院的评价


    NarrativeDx通过以下4个步骤即可提供患者对医院的评价情况，以及改善患者体验的解决方案。


    （1）收集信息。NarrativeDx从医院满意度调查（Hospital Consumer Assessment of Healthcare Providers
    and Systems，HCAHPS）、点评网站和医院的反馈表等渠道收集患者对医院的评价。


    （2）处理数据。对于人工智能来说，数据分为结构化和非结构化两种。系统能够轻松识别结构化的数据，如医院反馈表中让患者勾选的封闭式问题，但识别非结构化的数据对于系统来说是个挑战，开放式的患者评价即为此类。NarrativeDx利用自然语言处理技术对非结构化的数据进行加工处理，让系统也能明白患者在表达什么。


    （3）归纳总结。在对所有的信息进行处理后，NarrativeDx统计出各项影响患者体验的因素，并按影响程度进行排位。


    （4）提供建议。除了呈现患者体验的统计结果外，NarrativeDx还能够作为助手，向医院的管理者提供改善患者体验的建议。


    ### 3．解决传统患者体验调查中的痛点


    患者体验涉及医疗过程的方方面面：医院的运营是否井然有序，患者的问题是否能得到医务工作者的及时解答，病房是否安全卫生等。在信息透明的互联网时代，任何负面评价都会对医院的品牌造成影响。


    虽然很多医院的管理者已经意识到了口碑的重要性，并积极寻求患者的反馈，但是传统的患者调查方式存在调查范围窄、耗费时间长等问题，而且由于受各利益相关方的影响，调查往往流于形式，管理者无法收到客观、公正的调查结果。传统的患者调查和NarrativeDx的患者调查方式对比如表6-1所示。


    NarrativeDx通过人工智能的方式解决了以上痛点。


