    ## 2．母婴健康管理

    人工智能在母婴健康领域可以分为两方面，一方面是针对女性受孕前后的数据监测，通常会结合智能硬件或可穿戴设备，对个体的生理症状、情绪状态、睡眠等数据进行监测；另一方面是针对育儿知识的智慧问答，从健康孕育新的生命，到宝宝出生长大，以及个人形体变化、心理情感变化、育儿技能和各种复杂的家庭问题等。


    ### 企业案例


    ### Ovia Health

    Ovuline成立于2012年6月，后改名为Ovia Health。Ovia Health开发的产品Ovia Fertility和Ovia Pregnancy通过健康跟踪设备，收集与女性受孕和怀孕相关的各种数据。


    ### 产品介绍

    Ovia Fertility是一款基于数据分析的智能孕期预测产品，它允许手动输入与女性受孕相关的各种数据，如基础体温、子宫颈液分析、排卵测试结果、生理症状、情绪状况，以及睡眠、体重、营养摄入和日常活动等因素。基于计算机算法的数据分析，来精准预测女性的排卵期，从而提高女性受孕率。同时，它也支持像FitBit这样的自助量化设备自动收集数据，如睡眠周期等。


    Ovia Pregnancy是Ovia Health公司为成功受孕的用户开发的一款孕期追踪应用，它同样可以整合FitBit等自助量化设备来监测用户的健康指数，如血压、日常活动情况等，帮助孕妇健康地度过这段非常时期。


    Ovia Parenting是Ovia Health公司为刚刚成为父母的用户开发的个性化服务产品，它能够帮助这些父母追踪和记录宝宝的健康成长情况，在呵护宝宝的同时，帮助用户记录那些难忘的美好瞬间。


    ### 应用情况

    Ovia Health作为一家健康管理及拥有健康大数据的公司，正扩大其面向企业端（ToB）的业务范围。目前，其B端企业用户包括了医疗保险公司Blue Cross
    Blue Shield of Massachusetts、通用电气、保健服务公司Optum等。


    ### 妈 妈 帮

    妈妈帮前身为丫丫网，已根植母婴产业14年，2011年正式从PC端转阵移动端。妈妈帮是以知识和交流为核心，通过个性化服务、专业工具等建立核心优势的专业、可信赖的移动母婴生活服务平台，现已成为众多中国母婴人群获取知识、答疑解惑、社群交流，乃至健康问题求助、购物推荐、同龄伙伴聚会等需求的集中解决平台。


    产检报告解读是妈妈帮的一个在线对妈妈的报告数据进行获取和分析的功能，涉及图像识别技术。运用产检报告解读功能，用户拍一张照片并上传，3分钟后系统即可做完图像数据化处理，妈妈可以看到所有的专业名词解释、数据指标解读。


    虚拟机器人通过数据的积累可以了解这个用户是谁，有什么差异化的需求，从而帮助妈妈群体发现更好的内容，给予非常精准的服务。


    ## 3．慢性病健康管理

    在我国，每年以心血管疾病和糖尿病为首的慢性病，占据了所有死亡人数的85%，且慢性病在我国疾病负担中所占比例超过70%，造成了极大的经济负担。对于慢性病患者来说，虽然药物治疗可以在一定程度上减轻疾病症状、延缓疾病发展，但更为重要的是，应该改变自身不健康的生活习惯，对饮食、运动、作息进行合理规划和控制。随着科学技术的发展，患者的慢性病管理从纯线下的医患交流逐步演化出线上、线下结合的新慢性病管理模式。


    ### 企业案例


    ### Virta Health

    Virta Health是由从事营养化学40多年，加州大学戴维斯分校医学院的教授Stephen Phinney博士和俄亥俄州立大学的教授Jeff Volek共同创办的一个互联网慢性病管理平台。Virta
    Health有两大优势：Virta的技术平台运用了AI技术，在其医生和健康咨询师团队的辅助下，提供连续和实时的医疗支持；Virta针对患者提出精准的饮食方案，为患者设计出个性化的碳水化合物摄入和饮食方案。


    ### 产品介绍

    当患者注册成为Virta Health的会员后，它会寄给患者一套经过FDA认证的医疗设备，用于每日血糖、血压和体重等身体指标的监测。在监测完成后，医生根据当天的各项数据，通过人工智能的计算给患者制定出个性化的饮食方案。


    Virta Health还设立了健康教练的职位，向患者提供一对一的咨询服务。如果是在非工作时间，语音机器人可以给患者回答一些答案标准度高的医学问题。此外，患者可以选择加入在线社区，与其他病友分享治疗心得，互相激励。图2-43所示为Virta
    Health参与慢性病管理的方式。


    ![](images/2a2f38652fe1a9376e6296b3cc69bd94.jpg)


    图2-43 Virta Health参与慢性病管理的方式


