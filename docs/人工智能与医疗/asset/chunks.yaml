    ## 6.2 Atomwise


    2013 年 1 月，Atomwise 获 Grant Challenges Canada 机构 22.5 万美元的拨款。2014 年 12 月，公司获 12
    万美元种子轮融资，投资方为 Y Combinatior。2015 年 3 月，Atomwise 再获 22.5 万美元种子轮融资。2015 年 6 月，Atomwise
    公司又获 600 万美元种子轮融资，投资方为 OS Fund、Khosla Ventures、DFJ 德丰杰、AME Cloud Ventures 和 Data
    Collective 等。


    Atomwise 公司项目的独特之处在于，它能把人从生到死过程中的大量数据抽取出来。因为涉及大量昂贵和耗时的药物，该功能解决了制药行业的“生死”问题。Atomwise
    公司称其在新药发现、结合亲和力预测和毒性检测上得到了目前世界上最好的结果。


    ### 6.2.4 Atomwise 的技术可用于寻找埃博拉病毒治疗方案


    目前，Atomwise 软件平台运行着 IBM 的蓝色基因/L 超级计算机，其强大的计算能力使其可以完成很多任务。例如，评估 820 万种化合物，并且在几天之内找到多发性硬化症可能的治疗方法。2015
    年，公司宣布在寻找埃博拉病毒治疗方案方面有一些进展，即在 Atomwise 预测的药物中，有两种药物或许能用来抗击埃博拉病毒，而且他们用时一个星期就找到了这种药物，成本不超过
    1000 美元。


    在研发抗击埃博拉病毒的新药过程中，Atomwise 平台准备了埃博拉病毒入侵生物细胞的“爪”的模型，然后利用类似人脑神经的网络进行药物成分分析，检测到目前已知的
    7000 种可对抗这种“爪”的药物，以此来进行筛选、组合。


    在合作伙伴方面，Atomwise 除了与 Merck 公司和 Autodesk 进行一些保密项目外，也持续与学术界和企业客户开展研究工作。


    ### 6.2.5 Atomwise 团队介绍


    亚伯拉罕·海菲茨（Abraham Heifets）任 Atomwise 公司 CEO，他毕业于康奈尔大学，获理学学士学位与工程硕士学位，并获多伦多大学博士学位。Heifets
    是一位大数据与高性能计算领域的专家，曾就职于 IBM T. J. Watson 研究中心，从事高性能计算领域的工作。在多伦多大学就读期间，他建立了一个名为
    “SCRIPDB”的大型公共化学结构专利数据库，并研发了一个名为“LigAlign”的蛋白质结构分析工具。据悉，LigAligh 已经在全球 70 多个国家实现应用。


    伊扎尔·沃奇（Izhar Wallch）任 Atomwise 公司 CTO，他于以色列理工大学获理学学士学位，并获多伦多大学博士学位，是一名医药算法领域的专业研究人员。在多伦多大学就读期间，沃奇创造了一种新途径来减少分子对接模型中的偏差。


    亚历山大·列维（Alexander Levy）任 Atomwise 公司首席运行管（Chief Operating Officer，COO），他在将实验室产品的优秀技术推向市场方面有丰富经验。在多伦多大学就读期间，Levy
    就进行过创业，他研发了一款帮助语言障碍者获取信息的软件，这款名为“My Voice”的软件已经应用于 Discovery Channel、Engadget、Fast
    Company、BNN、CBC 及 CTV 的平台，使用者遍布全球 30 多个国家。除了创业者外，Levy 还有一个身份是独立投资人，他曾于 2016 年
    3 月参与 Science Exchange 的 B 轮投资。Science Exchange 是一个帮助科学家将实验项目或器材外包的平台，据悉，美国著名创业孵化器
    Y Combinator 也参与了 Science Exchange 的 B 轮融资。Levy 被 Profi 杂志评为年度企业家与多伦多大学的年度投资人。


    ## 6.3 英国 Babylon Health：将 AI 医生装进用户手机


    “嗨！Babylon，我头好痛。”


    “啊，心疼你。什么时候开始痛的？”


    “今天早上起床的时候。”


    “好的，有多疼？1 到 10 打分的话，你打几分？”


    “5 分。”


    “有没有头晕、恶心、发烧？”


    “嗯，有的。”


    “依我看，问题不大。应该是昨晚气温骤降，让你感冒了。多喝水多休息，吃点感冒药。如果家里没有感冒药，你可以选择这家药店。”


    看到这里，你可能会认为这是一个医生在给病人看病，但其实这是一个 AI 机器人巴比伦（Babylon）在帮患者分析病症。这种事情如果发生在几年以前，人们可能完全不敢想象。机器人怎么能代替医生给患者看病呢？但现在，这件事真实地发生了，人工智能在给人们看病！


    随着机器学习和大数据的快速商业化，AI 在医疗保健和生命科学领域已经处于领先地位，并将改变医疗诊断和疾病治疗的方式。传统医生看病可能需要花 10 分钟来了解患者的病症，但现在一个
    AI 机器人，可能只需几分钟就能了解患者的过往病史、生活的环境和气候，并通过后台数十亿的数据来对病症进行分析。


    Babylon 人工智能医生是英国数字医疗公司巴比伦健康（Babylon Health）推出的一款远程诊疗 App，旨在通过 AI 技术为用户提供全天候医疗咨询服务。无论什么时候什么地点，用户通过
    App 就能看病。例如，通过与 AI 机器人聊天查询病症，或者通过视频或文本向在线的专业医生获取医疗建议。另外，App 还包含健康追踪及药品配送等服务。


    巴比伦健康是一家位于英国伦敦的数字医疗创业公司，于 2013 年成立。公司的主要目的是通过人工智能技术，使便利实惠的医疗服务惠及每个人，实现医疗保健的大众化。Babylon
    的诊疗 App 于 2014 年推出，目前已覆盖全球 80 多万名用户，服务范围横跨欧洲和非洲。2016 年，Babylon 在卢旺达推出，试用半年就完成了卢旺达
    25 万人的注册量，完成了 6 万次问诊。


    从建立之初，巴比伦健康就一直备受关注，各大科技媒体对其也是好评不断。2016 年，巴比伦健康被知名科技媒体 Wired 评为“2016 年欧洲最热门的创业公司之一”。公司也曾入围
    Meffy 奖，并获得英国电信（BT）公共部门创新奖。同时，巴比伦健康（Babylon Health）还被称为热门健康科技公司 100 强。


    ### 6.3.1 伊朗人在英国，改变英国传统医疗服务模式


    巴比伦健康的创始人兼 CEO 阿里·巴萨（Ali Parsa）是一名来自伊朗的英国医疗保健企业家、伦敦大学工程物理学博士（图 6-3）。他曾被英国《泰晤士报》称为“全球
    100 名成功人士之一”。


    Ali 最初一个人在伦敦求学，无依无靠。为了支付其实并不算高的学术研究费用，1990 年 Ali 开始创业，建立了他的第一家公司 V&G，并获得了年轻企业家皇家奖。5
    年后，他卖掉了 V&G，转身成为一名投资银行家，先后在瑞士信贷和美国高盛各工作了两年。


    ![](img/adbe8cb5f7c3533bb422e759ec986b88.jpg)


    图 6-3 Babylon Health CEO 兼创始人 Ali Parsa


    2004 年，Ali 的第一个孩子降生时，他第一次感受到了中年危机，于是决定再次创业。这次，他创立了欧洲最大的临床医生合作网络公司 Circle，主要提供医疗、康复和健康管理服务。这种建立医生合作伙伴关系的模式，Ali
    在之后创建 Babylon 时也有借用。即使在英国经济最不景气的时候，Circle 的年收入也超过 2 亿英镑，拥有员工 3000 人，并且公司已经上市。


    在经营 Circle 的这些年中，Ali 逐渐意识到绝大多数人的医疗保健需求与看病的时长无关，最大的需求往往是在就医前和就医后。他认为，英国、美国等发达国家医疗服务资源充足，患者看病相对比较容易，但在发展中国家，就医难其实是一个普遍现象。


    全球医生供不应求，如何让医生更高效地工作，如何合理分配医疗资源，都是企业家应该考虑的事。Ali 发现，世界上几乎有一半的人难以获得最基本的医疗保健服务，但他们每个人都可以拥有一部手机。这让
    Ali 萌生了一个想法：将医疗服务装入人们的手机中，将健康管理带入日常生活。于是，Babylon App 诞生了——一个装在口袋里的 AI 医生。


    ### 6.3.2 口袋里的人工智能医生


    Babylon App（图 6-4）为用户提供 7 天 24 小时的医疗咨询服务，内容包括以下 5 个方面。


    ![](img/1b7685a28e34f41dec102b2c7ea608c9.jpg)


    图 6-4 Babylon App 界面展示


    #### 1．AI 病症查询


    Babylon 应用程序加入了人工智能技术，通过与患者沟通，了解具体病症，然后做出诊断。据官方表示，Babylon 可以准确诊断出 80%的普通疾病。这种平常需要门诊医生诊断的普通疾病，现在通过
    AI 就能搞定，某种程度上也节约了医疗成本。


    #### 2．全科医生远程诊疗


    遇到严重且棘手的疾病，用户也可以选择 Babylon 的医生远程诊疗服务。Babylon 与 100 多名专业医生签约（包括全科医生、专家、心理医生），让患者能够远程看病。一般全科医生负责解决日常疾病，专家负责解决疑难杂症或棘手的病症（如皮肤病、妇科病和整容），心理医生则是帮助用户舒解压力、焦虑、丧亲和抑郁等负面情绪。


    #### 3．药品配送服务


    Babylon 与多家药店签署协议。患者完成一次问诊，如果需要用药，Babylon 会将医生开具的处方发送到距离患者位置最近的药店，或者安排药店直接把药送到患者家里。目前，Babylon
    已实现全伦敦当天或隔天配送，图 6-5 所示即为 Babylon App 中的药品配送服务。如果在国外，Babylon 也可以想办法把药品送到患者手中。


    ![](img/6742d4729e43f0fd4cac381cdc167779.jpg)


    图 6-5 Babylon App 药品配送服务界面展示


    #### 4．健康追踪和测试


    健康追踪软件似乎已成为一种潮流。Babylon 还能对用户的健康信息和运动水平进行实时监测，让用户实时了解自己的身体健康状况。这项功能包括计步、卡路里燃烧、称体重及睡眠监测等。


    #### 5．家庭账户


    另外，每位 Babylon 的注册用户，都可以创建一个家庭账户，这样家里的每个人都可以获取同样的健康咨询服务。


    ### 6.3.3 个体+团体健康管理的运营模式


    人们常说，每天吃一个苹果身体棒，Babylon 就像这个苹果一样，每天访问一下，身体更健康。那 Babylon 是如何盈利的呢？目前，Babylon App
    可以全球免费下载，同时支持 iOS 和 Andriod，累计下载量已超过 100 万次。Babylon App 提供的 AI 医生服务，用户下载即可免费获取，但如果想获取专业医生的医疗建议，则需要付费。


    #### 1．3 种付费套餐


    Babylon 目前提供 3 种付费模式：单次咨询费用 49 英镑；包月 9.99 英镑，次数不限，3 个月起订；包年费用 89.9 英镑，相当于额外赠送了
    2 个月，咨询次数不受限制。


    咨询付费应该是目前远程医疗平台主要的盈利模式。相比其他的在线问诊平台，Babylon 主打低价战略。同样是做视频或电话预约的其他几个远程医疗平台，收费就明显比
    Babylon 高得多。例如，旧金山的 Doctor on Demand 远程医疗平台，15 分钟收费 40 美元，HealthTap 月包费用 99 美元，American
    Well 的视频看病服务一次收费 49 美元，Teladoc 每次视频或电话预约收费 40 美元。


    如此看来，Babylon 的主要竞争优势便是价格。那 Babylon 为何如此大胆，走低价模式，公司不挣钱吗？平台上的医生又怎样挣钱？其实，这一切又得益于
    Babylon 另一个独特的商业模式。


    #### 2．与医院合作，完成线上“分诊”


    Babylon 平台上目前有 100 多名专业医生（包括全科医生、专家和心理医生），他们全部来自英国国家医疗服务体系（NHS）公立医院，拥有专业的资格认证及
    10 年以上的临床经验。NHS 公立医院的医生们在 Babylon 平台上提供在线诊疗服务，能获得与医院一样的薪资。同时，患者到 Babylon 平台上看病，也在一定程度上缓解了
    NHS 医院的接诊压力。


    2017 年 2 月，Babylon Health 与 NHS 签署合作协议，已补充 NHS111 医疗服务热线，达到“分诊”的效果。据《金融时报》透露，英国的非紧急医疗求助热线
    NHS111，因热线忙碌打不进去，进而遭到患者的抱怨，加上人员短缺，接听人员并非医护专业人士，不能给出有效的临床建议，NHS111 一直以来饱受争议。Babylon
    Health 与之合作之后，可分担 NHS111 热线的压力，合理利用医疗资源。


    另外，对患者而言，呼叫一次 NHS111 的费用为 12～16 英镑，若使用 Babylon App，可以享受免费的人工智能咨询服务，同时只需单次花费 49
    英镑或月付 9.99 英镑即可获得专业医生的建议。


    #### 3．医疗+旅游保险，推出服务套件产品


    随着数字医疗的发展，“医疗+旅游保险”成为一种新型的绑定服务产品。Babylon Health 与旅游保险提供商 Collinson Group 合作，组成服务套件。Collinson
    集团向其客户推出 Babylon 医疗服务，作为集团业务的附加产品。同时，Collinson 集团还向其 B2B 产品线下的其他旅游保险或国际私人医疗保险公司推荐
    Babylon App。如此，Babylon Health 便实现了与旅游行业及保险行业的合作，扩大了业务范围。


    对于旅游行业的公司而言，其客户外出旅行时，同样需要健康护理。在 Babylon 的帮助下，客户无论走到什么地方，都能通过自己的手机获得健康咨询服务。


    ### 6.3.4 为集团提供企业健康计划


    近年来，越来越多的企业意识到员工身体健康的重要性，开始建立自己的健康计划，作为一种员工福利。


    Babylon Health 与一些集团公司达成合作，为企业员工提供健康咨询服务，让他们在家、在办公室或出差时，都能随时随地获得专业的健康咨询。同时，企业还可以实时掌握员工的健康指数和幸福指数，方便管理。


    目前，Babylon Health 已与全球多家企业合作（图 6-6）。三星、花旗银行、英国电信、惠普、雅虎、推特等一百多家企业已经将 Babylon 纳入其企业健康计划。


    ![](img/d82d40fd6073d406dd469a2f7e83b200.jpg)


    图 6-6 Babylon Health 主要合作客户


    ### 6.3.5 每笔融资都是一次大的突破


    Babylon Health 成立不到 4 年，就完成了两次比较大的融资，融资总额已达到 8500 万美元。


    2016 年 1 月，Babylon Health 首次融资便轻松拿下 2500 万美元，由 AB Kinnevik^(\[1\])领投，Hoxton Centures、Richard
    Reed 和 Mustafa Suleyman 等跟投，用于支撑 Babylon AI 诊疗平台的搭建，为用户提供个性化的健康咨询服务。


    2017 年 4 月，Babylon Health 完成了 6000 万美元的 B 轮融资。这笔投资被认为是欧洲医疗保健领域最大的一笔融资，帮助 Babylon
    实现了以下目标。


    ① 超过 100 万次应用下载；


    ② 全球注册量增加近 600%，达到 80 万；


    ③ 每日咨询和分诊量增加了 9 倍；


    ④ 超过 4/5 的用户对 Babylon 都是 5 星好评。


    ### 6.3.6 两大主要竞争对手比较


    人工智能在 C 端用户的应用，Babylon 并非独家，仅在英国本土就有另外两家竞争对手 Ada 和 Your.MD。Babylon 与 Ada、Your.MD
    的比较如表 6-3 所示。


    表 6-3 Babylon、Ada 和 Your.MD 的对比


    ![](img/b93fc72071cf85e0ed01adcd00ac73f2.jpg)


    总体来说，Babylon 在用户评分和诊断准确性上都略占优势。虽然在寻求专业医生建议这个业务上 Babylon 需要付费才能实现，但是通过 Babylon，用户可以与医生进行实时的视频或文本沟通，而
    Ada 只能留言，Your.MD 要插入 Skype、Messenger 等聊天软件才能实现。


    另外，Babylon 可提供处方配送和健康追踪服务，这都是目前 Ada 和 Your.MD 尚未开通的功能。由此可见，即使在英国本土，Babylon 的竞争优势也是挺大的。


    一些大公司也纷纷将人工智能引入医疗诊疗方面，2016 年 10 月百度推出百度医疗大脑，2017 年 3 月阿里云推出 ET 医疗大脑，向 IBM Watson
    和 Google DeepMind 看齐。


    动脉网之前也对中国人工智能产业做了详细的盘点，但我们发现目前中国的人工智能医疗主要还是以 B 端客户为主，在医学影像、新药研发和健康管理等领域扮演一个医生助手的角色。目前，国内还没有出现类似
    Babylon 这种纯 C 端的 AI 诊疗 App。可以说，国内这块市场还是空白的。


    虽然人工智能医疗在 C 端的应用还不成熟，很多业内人士也对此深表怀疑。但是不得不承认，将人工智能诊疗大众化、平民化不失为一种新的创业思路。人工智能在医疗领域的应用是不是有更多的可能性？这是每个创业者都应该思考的。


    \[1\] AB Kinnevik:瑞典的一家投资公司，成立于 1936 年，主要投资数字消费品牌。


    ## 6.4 印度 SigTuple：用人工智能变革传统疾病筛查方式


    SigTuple 是一家创办于“亚洲硅谷”印度班加罗尔的科技型创业公司，它的目标是利用人工智能中的机器学习技术为医院提供精准、安全、及时、高效的血液筛查方案。2017
    年 2 月，国际知名投资机构 Accel Partners 领投 580 万美元的 A 轮融资，创造了印度人工智能医疗领域迄今最大的单轮融资纪录。


    那么，SigTuple 有何独到之处呢？


    ### 6.4.1 3 个数据工程师从金融到医疗的跨界创业


    不同于大多数医疗科技创业公司，SigTuple 的 3 位创始人（图 6-7）之前都没有任何医疗行业的从业经历。


    ![](img/6948cfa2f7ecd7edd80de78860d1555d.jpg)


    图 6-7 创始人 Tathagato（左）、Apurv（中）和 Rohit（右）


    CEO 罗希特·库马尔·潘迪（Rohit Kumar Pandey）是印度国家信息技术学院的优秀毕业生，此后一直就职于美国运通（American Express），他用了
    8 年时间从普通的程序员升至部门总监。


    CTO 阿普鲁夫·阿南德（Apurv Anand）毕业于印度最顶尖的理工科大学印度理工学院，在创办 SigTuple 前，他曾在奎斯特（Qwest）、雅虎、美国运通等多个跨国公司的技术部门工作。


    首席科学家（Chief Science Officer，CSO）Tathagato Rai Dastidar 与阿普鲁夫·阿南德的经历颇为相似。他也毕业于印度理工学院，而且曾就职于国家半导体（National
    Semiconductor）、雅虎、美国运通等知名公司。稍有不同的是，Tathagato 拥有计算机科学和工程学博士学位，是 3 位创始人中学历最高的。


    3 个人的交集产生于在金融巨头美国运通的工作经历。2012 年至 2014 年，他们在公司旗下的大数据实验室工作时接触人工智能，他们相信这项技术将改变世界，因此萌生了合伙创业的想法。


    '
