    ### 2.5.3 人工智能与医院管理企业的盈利模式


    在商业模式上，应用于医院管理的人工智能系统一般采用按时间收费的方式。企业根据医院的具体情况，核算出业务功能的计算复杂程度，核定后按照季度或年度的方式进行收费（图
    2-30）。在美国，人工智能+医院管理企业主要以大型的连锁医院作为主要客户，因为这部分客户有足够的预算进行采购，属于高价值客户，且美国民营医院占据主体地位，市场竞争激烈，这些连锁医院有强烈的动力采购这样的人工智能系统来改善自己的运营能力，在各类第三方医疗机构排行中占据领先的位置。


    ![](img/aa57d5d149a399a7dd5ba50353b4f3e1.jpg)


    图 2-30 人工智能与医院管理企业的盈利模式


    以另一家人工智能与医院管理的标杆型企业 NarrativeDx^(\[2\])为例，它目前的客户就包括了美国规模较大的 3 个医疗机构：克里斯蒂娜健康系统（Christina
    CareHealth System）、纽约大学朗格尼医学中心（NYU Langone Medical Center）和怕利塞德医疗中心（Palisades
    Medical Center）。


    从目前我国人工智能在医院管理的应用情况来看，其普及速度不会那么快，短期确实很难看到一个很好的商业盈利模式。与人工智能影像诊断等设备在投入使用后就能看到立竿见影的收益不同，人工智能在医院管理的应用需要较长的周期才能获得收益，因此医院对人工智能应用于医院管理的动力不足。


    但是，人工智能改变医疗和管理已经势不可挡。国家已经把发展 AI 事业写入国家发展战略与规划中，这对目前在做 AI 的创业公司而言，是一个非常大的利好消息。抓住历史机遇，突破重点领域，促进人工智能产业发展，未来的
    AI 行业必定会呈现加速度的发展。只要坚定地做下去，价值就一定会体现出来。


    #### 案例介绍


    ##### Qventus


    Qventus（曾用名 AnalyticsMD）是一家提供医院智能决策分析系统技术的初创公司，面对传统医院管理方式效率低下、大量资源被浪费的现状，Qventus
    专注于解决急诊室、手术室等系统的运营挑战，使用实时数据追踪、分析、预测和优化医院业务。


    Qventus 帮助医院建立 SaaS 系统有两个目的。一个目的是可以让医院的管理者实时掌握目前的工作状态和进度，做出更好的选择，不落后于其他同行；另一个目的就是提高患者和医护人员看病的质量和效率，如医护人员和病床之类的资源可以在空出来的第一时间被利用，防止出现病人在急诊室门口无人医治的情况。另外，只要使用了
    Qventus 开发的系统，利用系统分析的数据，就可以得到如何让病人避免遭遇治疗瓶颈的建议等。


    Qventus 分析出来的辅助性决策或者预警性信息会通过电话或者手机短信的形式发送到医生及护士的手机上，方便他们及时调整策略。


