    谷歌2015年与梅奥诊所合作推出面向患者的健康评估工具健康卡，提供患者的疾病信息、症状和常见疾病，与WebMD的用法类似。

    谷歌正在更深入地参与消费者层面的疾病筛查和诊断，如谷歌开发的Pixel手机，可用于对患者进行健康检查，对疾病进行诊断和筛选。

    此外，患者也可以利用谷歌的语音助理Google Home进行健康评估。患者利用这些工具回答与健康相关的问题，类似于搜索中的健康卡片，用来确保药物的依从性，这类工具也可以帮助患者管理与疾病相关的生活方式，询问后续问题以评估患者的风险水平。

    该公司还在研究其他可穿戴设备以用于提高医生的诊断能力，如谷歌眼镜（图3-16）。该工具可以将眼睛、语言和运动测试自动化，代替格拉斯哥昏迷评分表^(\[4\])，评估脑损伤的严重程度。


