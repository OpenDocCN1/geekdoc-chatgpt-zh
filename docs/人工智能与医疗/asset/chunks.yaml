- raw: '据蛋壳研究院调查，在起步阶段，一个创业公司需要1～3名专家，他们的工资也没有传说中的那么高，但是作为公司的创始人或合伙人，他们占有公司的部分股权在2%～78%。据行业人士介绍，这些创业公司的CTO或首席科学家如果进入BAT、华为、谷歌、微软这些大公司，年薪会在100万～1000万元，甚至更高。人工智能企业人力成本组成如图5-5所示。


    ![](images/0dbec4f42406af27567a10ae120f425a.jpg)


    图5-5 人工智能企业人力成本组成


    在蛋壳研究院从拉勾网获取的招聘信息中可以看到，与人工智能相关的岗位年薪在20万～60万元（图5-6）。这些刚毕业的硕士研究生的工资几乎和有3～5年工作经验的商务拓展经理接近。


    ![](images/917aabfdcdbf2d19201583f70d92e3b1.jpg)


    图5-6 与人工智能相关岗位的年薪范围


    人工智能医疗是一个多学科交叉的专业，公司除了需要招聘人工智能专家外，还需要硬件工程师、软件工程师、测试工程师、医学专家、质控专家、认证专员（认证CFDA）、商务拓展专员等。作为创业公司，在资金不充足时，为了吸引人才，往往以股权的方式留住团队的主要成员。


    另外，人工智能各个领域的人才价格也会有所差距，在计算机视觉、语音、自然语言处理和机器学习这4个人工智能技术中，视觉方向因为学科容量相对广阔，所以人才储备也最高。但是，语音和自然语言处理方面的人才十分缺乏，国内主要设置语音识别的专业高校只有中科院声学所和哈尔滨工业大学。这也是目前我国医学影像类公司有几十家，而医学语音录入的公司只有科大讯飞、云知声和中科汇能3家的原因。


    ### 4．人工智能医疗的盈利方式


    人工智能医疗企业目前的服务对象和收费模式如图5-7所示。


    ![](images/66349440569d3dbbf4da668827ae2739.jpg)


    图5-7 人工智能医疗企业目前的服务对象和收费模式


    ## 5.2.2 人工智能医疗初创公司分析


    根据蛋壳研究院的统计，国内和国外的人工智能与医疗初创企业一共有192家。其中，国内有83家，国外有109家（未包含基因技术为主的企业数据）。


    ### 1．国内企业图谱和融资情况


    国内有83家企业将人工智能应用于医疗领域，主要布局在医学影像、病历/文献分析和虚拟助手3个应用场景。而其中涉足医学影像类的企业数量达40家，远高于其他应用场景的企业数量。


    如图5-8所示，国内人工智能医疗企业近年来发展迅速。2013年至2017年，融资金额基本维持增长趋势，年复合增长率达到127%，高于全球100%的平均水平。2018年，国内融资规模仍逆全球大环境强势增长，基本呈现逐月上升趋势，如图5-9所示。总融资事件共39起，总融资金额达49.07亿元。


    ![](images/f721a4f219d4656dff2e6ece1251a6ca.jpg)


    图5-8 2013年至2018年国内人工智能医疗行业融资趋势


    ![](images/50069493f64087c2c64f634e80b5bd39.jpg)


    图5-9 2018年1～8月国内人工智能医疗行业融资趋势


    2014年出现了云知声、微医两个大额融资，直接推升了2014年国内整体融资规模。若排除云知声、微医的影响，2014年前后人工智能医疗的融资出现平缓波动的态势。2016年为国内人工智能医疗爆发元年，碳云智能、推想科技、达闼科技、图玛深维等知名企业相继融资。


    国内单笔融资金额快速增长，2018年人工智能医疗行业融资均额为12 582万元。医学影像、虚拟助手的“吸金”能力增强，加上融资轮次后移，使得国内融资均额大幅上升，如图5-10所示。


    ![](images/c5d8f069a791a89437541b75bc872ce2.jpg)


    图5-10 2013年至2018年国内融资均额（单位：万元）


    国内融资均额低于全球水平，主要是国内人工智能医疗起步较晚，行业成熟度低于国外水平。


    国内外人工智能医疗领域，天使及种子轮与A轮融资合计占比基本一致，但国内天使及种子轮融资占比15.38%，高于国外占比12%。这意味着，相比于国外的融资环境，国内人工智能医疗行业新进入者，依靠创新和团队较容易获得融资。另外，B轮和C轮的融资占比也高于国外，说明国内创投更注重人工智能医疗企业的数据和营收，如图5-11所示。


    ![](images/871e7731b97d67bd841efbc4ea992f9f.jpg)


    图5-11 2018年1～8月国内外融资轮次对比


    2018年天使及种子轮融资占比为15.38%，仅为2015年的三分之一，如图5-12所示。总体来说，国内人工智能医疗行业成熟度逐渐提高，融资轮次向成熟方向移动。


    ![](images/383d427235df343fdd6fc33293ce4105.jpg)


    图5-12 2013年至2018年融资轮次分布


    医疗人工智能行业是一个高度集中在一线城市的行业。从地区分布来看，2018年人工智能医疗行业融资基本聚集在北京、上海、广东、浙江4个地区。其中，北京发生投融资事件21起，为全国最高，占比超过半数，上海7起，广东7起，浙江3起，四者合计占比98%，几乎垄断全国的人工智能医疗行业投融资市场，如图5-13所示。


    ![](images/84100f9307ea204d235df056d70f66c8.jpg)


    图5-13 2018年1～8月融资地区分布图


    人工智能思维普及度高、浓郁的创业氛围及经济的高度发达，是这4个地区成为人工智能医疗行业发展最为迅猛的主要原因。


    投融资机构方面，2017年至2018年，入场国内人工智能医疗行业的投资机构共计139家，其中红衫资本、真格基金、软银中国、IDG、丹华资本、道彤投资和奋毅资本最为活跃。这7家投资机构主要涉足医学影像、药物发现、智能化器械、病历/文献分析，在这四大领域内的投资分别为7起、3起、3起、2起。


    表5-2所示为2018年人工智能TOP 10融资状况。


    表5-2 2018年人工智能TOP 10融资


    ![](images/2b2121bfc9a7497158a549cfc6251dce.jpg)


    国内人工智能医疗行业存在项目投资聚集化现象，即多个投资机构同时投资一个抢手项目，或者一个投资机构多次投资同一家公司。例如，软银中国、真格基金、经纬中国3家同时于2017年12月向图玛深维发起投资，以及昆仲资本在2017年和2018年向深睿医疗先后进行了3次投资。


    ### 2．国外企业图谱和融资情况


    动脉网蛋壳研究院数据库数据显示，2013年1月至2018年8月，全球218家企业的融资总额已经超过340亿元，融资事件超过400件。历年的融资情况走势如图5-14所示（其中2018年为2018年1～8月的融资数据）。


