    目前，微软已经就 Microsoft Health 与包括 Jawbone UP、MapMyFitness、MyFitnessPal 和 Run Keeper
    在内的设备和服务商达成了合作意向。未来计划提供相应的选项，让用户通过 Microsoft Health 与 HealthVault 的连接将数据共享给医疗提供商。


    ### 6．Amalga UIS 信息系统

    微软 Amalga UIS 是一套专门针对医疗人员开发的信息系统，它具有数据仓库和网络门户的特性，可作为医疗健康行业商业智能解决方案的补充，帮助实现对数据的深度挖掘和分析，解决以往非常困难或者代价过高的难题，它可以将所有数据以各种不同的方式呈现，弥补了以往许多商业智能解决方案的不足。


    ### 7．Xbox Fitness 健身服务

    2013 年 9 月，微软在发布自己的新一代游戏娱乐主机 Xbox One 的同时，上线了 Xbox Fitness 个人体感健身服务。


    Xbox Fitness 主打游戏健身。在 Kinect 体感识别技术的帮助下，Xbox Fitness 服务可以通过识别用户心率、肌肉力量等数据，追踪锻炼质量，也会根据用户过往的锻炼历史和效果来动态调整计划。为了保证健身的质量和专业性，Xbox
    Fitness 引入了许多著名健身品牌的教学视频，包括 P90X（Tony Horton）、INSANITY（Shaun T）、Jillian Michaels
