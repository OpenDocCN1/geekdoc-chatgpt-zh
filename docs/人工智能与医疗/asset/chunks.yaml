    ## 6.4.5 产业内同类公司——Athelas


    近年来，随着人工智能技术的成熟，它在医疗领域的应用正在经历高速的增长。但若细分到将机器学习应用到血液检测的创业公司，则寥寥无几。


    动脉网蛋壳研究院通过对行业内同类公司的筛选，认为美国山景城的血液筛查公司Athelas是SigTuple最合适的对标公司。那么Athelas是如何行动的呢？


    Athelas创办于2014年，创始人是当时年仅17岁就名扬硅谷的科技少年塔内·坦登（Tanay Tandon）。


    Athelas通过配套手机使用的显微镜，将血液图像传送到后端的机器学习平台，几分钟后就可以将检测结果发送给患者。目前，这套系统支持对白血病、痢疾和炎症等血液疾病的筛查。但不同于SigTuple的客户群体是医疗机构，Athelas是直接面向接受血液检查服务的患者，二者的比较如表6-6所示。


