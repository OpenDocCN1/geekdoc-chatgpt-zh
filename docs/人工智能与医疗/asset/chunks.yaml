    在动脉网收集的 48 位人工智能医疗企业的 CEO、CTO 名单中，除 14 位专家的专业不明确外，医学相关专业的专家比例仅为 21%，人工智能专业占比为
    52%。这说明从事医疗行业不是他们在求学期间就决定的，而是在后续发展过程中看到了机遇，由此才扎根于医疗领域。


    另外，虽然很多人工智能医疗公司的 CTO 不是医疗行业出身，但据动脉网了解，所有的人工智能医疗创业公司都会聘请临床医学专家作为公司的医学顾问，使公司的产品更加接近临床应用。很多
    AI 创业者在这个过程中逐渐变成一名“医学专家”。


    中国经济的快速发展促使海外人才回国发展的欲望强烈，领英的全球人才报告显示，在中国拥有海外工作经验的 AI 从业者占比为 9%，医疗行业的比例则远远超过这个数字。


    从现有数据来看，CEO、CTO 来自美国和中国内地的人数居多，欧洲、加拿大、中国香港、中国台湾等地也有零星分布（图 5-24）。很多人工智能医疗公司的 CTO
    都是在中国内地读本科或硕士，然后出国留学，学成之后再回国创业。


