    ## 3.1.1 IBM Watson人工智能医疗应用详情剖析


    ### 1．“认知计算”带领电子计算走入新时代


    IBM把电子计算时代划分为3个阶段（图3-1）。


    ![](images/96427fd816d04507fae30bf8bb7a4f0f.jpg)


    图3-1 IBM把电子计算时代划分为3个阶段


    第一个阶段是制表系统年代，时间是20世纪初。1886年，美国统计学家赫尔曼·霍勒瑞斯借鉴了雅各织布机的穿孔卡原理，用穿孔卡片存储数据，用机电技术取代了纯机械装置，制造了第一台可以自动进行加减乘除四则运算、累计存档、制作报表的制表机。这台制表机参与了美国1890年的人口普查工作，使预计耗时10年的统计工作仅用1年零7个月就完成了，是人类历史上第一次利用计算机进行的大规模的数据处理。霍勒瑞斯于1896年创建了商旅管理公司（TMC）。1911年，TMC与另外两家公司合并，成立了CTR公司。1924年，CTR公司改名为国际商业机器公司（International
    Business Machines Corporation），这就是IBM公司。


    第二个阶段是编译系统年代，时间是从20世纪60年代到2010年。计算机硬件已经从晶体管向大规模集成电路迈进。而计算机所读的语言从0、1组成的机器语言逐渐过渡到汇编语言和高级语言。计算机之间的数据交换变为可能，各种计算机程序开始铺天盖地。


    第三个阶段就是2010年以后的认知系统年代。此阶段的代表就是人工智能的出现，如拥有“认知计算”能力的Watson。IBM在2006年启动研发Watson，于2014年投资10亿美元成立Watson事业集团，次年便组建了Watson
    Health平台，专门针对医疗健康行业提供人工智能认知解决方案。


    ### 2．Watson是如何回答问题的


    IBM Watson的出名，源于2011年参与美国问答节目《危险》（Jeopardy!）。在这次节目中，Watson战胜了这一节目的两位人类冠军选手，被认为是人工智能历史上的一个里程碑。从底层来讲，Watson由深度问答系统（Deep
    QA）驱动，是一个集自然语言处理、信息检索、知识表示、自动推理、机器学习等开放式问答技术于一体的应用，基于为假设认知和大规模的证据收集、分析、评价而开发，图3-2所示为其问题处理逻辑。深度质量保证的目标绝不仅仅是回答一些特定的简单问题，而是利用运算能力，建立一套基于概率化证据的大规模并行架构，它综合利用数千种自然语言处理、信息检索、机器学习和推理算法，分析生成多种假设，然后从中收集、评估、权衡各类证据，最终给出最佳答案。


    ![](images/ecd977d4481195c67092c24b6db2f1a2.jpg)


    图3-2 IBM Watson问题处理逻辑


    Watson的能力包括3个方面：理解、推理和学习。首先，能够“理解”人类的问题，是Watson能进行认知协作的第一步，主要运用的是计算系统处理结构化和非结构化数据的能力；其次是推理，Watson主要运用一种名为“假设生成”的算法，从数据中抽丝剥茧，寻找事物间的相关联系；最后是学习，Watson从大数据中提取关键信息，以证据为基础进行学习。


    ### 3．Watson在医疗上的商业化应用


    Watson的第一步商业化运作就是在医疗行业，通过和纪念斯隆—凯特琳癌症中心进行合作，得到大量的癌症临床知识、分子和基因组数据、癌症病例历史信息。在该中心“学习”之后，Watson为临床医师提供以证据为基础的治疗方案。随后该系统被Watson
    Health部署到了许多顶尖的医疗机构，如克利夫兰诊所和MD安德森癌症中心，提供基于证据的医疗决策系统。


    医疗数据处于爆发式增长态势，仅凭人力不足以处理和学习，而Watson Health可以帮助人们提高医疗效率，图3-3所示为Watson数据处理的效率优势。IBM判断，在2020年，医疗数据每73天就会翻一番，而且其中80%以上的数据是非结构化的，非结构化数据主要是指那些无法用固定结构的逻辑方式来表达、实现的数据，如视频、音频、图片，对计算机来说是不可见的。而Watson可以看到这些数据，并进行深度学习。医生若想学习最新的医疗知识，每周需花160小时，而Watson在15秒内就可以读取4000万个文件，学习速度非常快。


    ![](images/fae933cb0aa9b9c0fb930793d851f3fb.jpg)


    图3-3 IBM Watson的数据处理效率优势


    IBM Watson的发展，也经历了多宗并购，使其得到技术上的加强，图3-4所示即为其并购升级过程。2015年年初，IBM宣布收购Alchemy API，这个平台有数万名开发者在利用机器学习算法，做自然语言处理和图片识别，可以改善Watson的生态系统。不久之后，又先后并购了4家医疗数据公司：探险家（Explorys）、菲特尔（Phytel）、合并医疗（Merge
    Healthcare）和特文卫生分析（Truven Health Analytics），其中特文卫生分析的收购价格高达26亿美元（探险家是一个基于云技术的数据分析公司；菲特尔开发以云计算为基础的工具来加强健康护理的协调工作和成果）。2015年8月，IBM用数十亿美元收购了MergeHealthcare，强化Watson
    Health的主业务。Watson的每一种应用都需要一段时间的预先训练，这也给计算和数据提出了要求。如上所述，IBM的投资和收购都是围绕公司这一长期发展战略而进行的，如收购私有云服务商Blue
    Box、数据库管理工具Compose、API接口工具Strong Loop、海量数据存储Cleversafe等，希望从数据量和算法两方面提高Watson在医疗和其他领域的实力。


    ![](images/8e1c42123605f36d3d16ac5a313969e1.jpg)


    注：用虚线框起来的表示与医疗有关。


    图3-4 IBM Watson的并购升级过程


    ### 4．Watson是如何治疗癌症的


    人类对肿瘤的认知经历了漫长的过程。从早期的外科手术直接切除肿瘤，到后来的放疗、化疗，再到基因研究的深入，肿瘤学家认识到肿瘤不是一种疾病，而是一大类疾病，即使是相同部位的肿瘤，每个人的病理特性也都不尽相同。例如，对ER受体阳性的乳腺癌，他莫昔芬有效；而对于ER受体阴性的乳腺癌则无效。由于这种特异性的存在，因此每种肿瘤治疗方案都需要个性化定制。


    2013年，纪念斯隆—凯特琳癌症中心与IBM Watson达成了合作，共同训练IBM Watson肿瘤解决方案。癌症专家在Watson中输入了纪念斯隆—凯特琳癌症中心的大量病历研究信息以进行训练。在此期间，该系统的登入时间共计1.5万个小时，一支由医生和研究人员组成的团队一起上传了数千份患者的病历，近500份医学期刊和教科书，1200万页的医学文献，把Watson训练成了一位杰出的“肿瘤医学专家”。


    Watson治疗癌症的过程是这样的。首先，IBM Watson分析患者的病历。Watson肿瘤解决方案拥有先进的能力，可分析临床记录和报告中的结构化和非结构化数据的含义和内容，吸收以普通英语编写的关键患者信息，这些信息可能对于选择治疗方法至关重要。


    其次，Watson识别基于证据的潜在治疗方案。通过将患者文件中的属性数据与临床知识、外部研究结果和数据相结合，Watson肿瘤解决方案识别潜在的患者治疗方案供医生参考。


    最后，IBM Watson从大量文献中查找并提供支持证据。IBM Watson将识别的治疗方案进行排序，并将每种方案支持的证据链接在一起，帮助肿瘤医生研究患者的治疗方案。图3-5所示为IBM肿瘤解决方案的操作流程。


    ![](images/2558eed2add70166bb044ce45c3403e7.jpg)


    图3-5 IBM肿瘤解决方案的操作流程


    2015年，来自美国和加拿大的14家肿瘤中心宣布将部署Watson，根据患者的肿瘤基因选择适当的治疗方案。通过此次合作，IBM希望Watson系统能基于所处理的基因信息来选择治疗方案，从而取代当前
    “肿瘤委员会”（Tumor Board）用药决定的模式。“肿瘤委员会”是肿瘤治疗实践中建立的一种类似会诊的治疗模式，拥有不同医疗专业技能的医生，如手术外科医师、药剂师等聚集在一起，成立针对某个病例的肿瘤委员会，讨论疑难、少见肿瘤病例的诊断和治疗，制定合理的诊断方法和治疗措施。


    Watson已经广泛应用于多家癌症治疗机构。总部位于曼谷的布伦格勒国际医院（Bumrungrad International Hospital），是南亚最大的私人医院，也是全球最受欢迎的医疗机构之一。为改善其癌症护理质量，布伦格勒选择了Watson肿瘤解决方案，帮助医生为癌症患者规划最高效的治疗方案——创新性认知计算解决方案。


    2016年8月，IBM与杭州认知网络科技有限公司共同宣布Watson进入中国。在国内，有21家医院计划使用经由纪念斯隆—凯特琳癌症中心训练的Watson肿瘤解决方案，以期基于此认知计算平台助力中国医生获得个性化的循证癌症治疗方案。


    ### 5．Watson在其他医疗领域的应用


    我们梳理了一张IBM Watson的医疗布局图谱（见图3-6），Watson的重点布局是在肿瘤和心血管疾病的诊断和治疗上，其他领域如糖尿病方面也有涉及。以下是Watson在医疗健康领域中，在不同的细分领域所做的一些事情。


    ![](images/31e2d9371717a8f9527a2058741029ff.jpg)


    图3-6 IBM Watson 医疗布局图谱


    （1）退伍军人健康管理局（Veterans Health Administration，VHA）：VHA具有1700多个医护站点，是美国最大的综合性医疗保健系统，每年为约870万名退伍军人提供医疗服务。当为创伤后精神紧张性障碍（PTSD）患者寻求一种更好的医护方式时，该机构采用认知计算来帮助改善这些退伍军人的医护质量。


    Watson可处理大量医学文献、临床资料和患者医疗记录，并对患者提出适当的治疗方案。它还可以对临床医生的系列问题提供基于证据的答案。Watson有助于节省医师的研究时间，医师得以将更多的时间用在聆听患者的意见及与患者进行互动上。


    （2）CaféWell：一个由Welltok保健公司创建的平台，该平台从各种渠道分析用户的健康状况并提供保健建议。为使该平台更加具有交互性和个性化，Welltok采用了IBM开发的一种认知方法。其开发的新产品CaféWell
    Concierge能够利用自然语言和认知能力，改善用户互动，并从潜在的纯文本来源中提取更多知识，如医疗对话、活动数据和健康效益信息等。


    （3）贝勒（Baylor）：用几周的时间，就能从2300万篇候选文档中筛选出一个名为p53的研发靶点。


    （4）美敦力（Medtronic）：通过与美敦力合作，运用美敦力的设备、护理管理产品、疗法和辅导，以及IBM Watson Health云平台，优化患者的治疗效果。在糖尿病患者发生低血糖前近3个小时做出预测，防止出现严重的低血糖。


    （5）苹果（Apple）：存储和分析ResearchKit数据。


    （6）强生公司（Johnson & Johnson）：分析科学论文，为药物开发找出全新关联。


    （7）安德玛（Under Armour）：推出“认知教练系统”，围绕睡眠、健康、活动和营养为运动员提供指导。


    ### 6．Watson为IBM带来了什么


    在2016年1月的国际消费类电子产品展览会（CES）上，IBM首席执行官罗睿兰表示，IBM已经不再是一家硬件或者软件公司，而是一家“认知解决方案云平台”公司。的确，最不赚钱的硬件平台早已经被IBM淘汰，然后是软件。IBM在之前已经连续15个季度同期相比利润下滑，而Watson智能云平台已经成为IBM盈利的新目标。从2016年Q2（第二季度）的财报来看，IBM的总收入为202.38亿美元，低于上年同期的208.13亿美元，已经连续17个季度同比下滑。但是，这其中以Watson为代表的认知解决业务于2016年Q2开始发力，呈稳步增长态势，认知解决业务收入占总收入两成以上，已成为IBM第二大收入来源图3-7所示为IBM各业务利润率分析。


    ![](images/60c6ccc08f6f84451ec1bde71b6658fb.jpg)


    图3-7 IBM各业务利润率分析


    ## 3.1.2 IBM未来几年的医疗人工智能计划


    IBM在人工智能与医疗领域有核心能力：人工智能+新型硬件。它们计划实现：芯片比全球最好的实验室更厉害，微型摄像机能从分子层面上检验药片的真假，系统仅从语言中就能检测出某人患有心理疾病。IBM研究室已经开始着手把这3项研究变成成熟的医疗工具，将公司现存的机器学习和人工智能系统与硅片、毫米波相控阵传感器等结合。


    ### 1．AI+超成像系统，“看”到疾病和危害


    “超成像系统”是一种广范围的电磁波谱成像技术，不仅可以获取人眼可见光形成的图像，还能模拟超出此范围的电磁波图像。


    使用高性能相机和其他传感器，临床医生就能发现用药是否适合患者。“用这种超成像技术，人们就像长了第三只眼，能发现我们日常所忽视的线索。” IBM技术总监拉希克·帕尔马（Rashik
    Parmar）说道。


    尽管实现超成像的硬件已经出现，但要使其进入市场，还需做更多的工作。能够进行广泛光谱成像的仪器不是什么新鲜事物，但区别就是IBM要将其简化、小型化，并降低制造成本，还要用认知算法来进行破译和可视化，让这项技术真正发挥作用。帕尔马还补充道，IBM现在有很多“花里胡哨”的发明，但让它们变为可用性较高的产品是有可能的。而在医疗应用上，简单的例子就是用超成像设备迅速看牙，或者为标准医疗射线检查提供更丰富的信息。


    也许在IBM计划的5年之内（从2017年开始），这种机器就会变成人们身边的药理学、毒理学专家——最终，这种超成像技术会被整合到手机中，在吃饭或服药之前可以先扫描一下，看是否有有害物质或致敏源等。


    ### 2．AI+芯片实验室，精细疾病早诊


    同时，IBM也有可能会在几年内推出一种新的人工智能分析技术——芯片实验室（图3-8）。这种设备相当于荷包大小，用一滴血或任意体液就能分析出细菌、病毒或预示着某种疾病的蛋白质。


    ![](images/ef229aad1bdee99cedbadb9122a34840.jpg)


    图3-8 芯片实验室


    帕尔马表示，IBM从2011年左右就开始探索“纳米纤维”这种概念了，那时是要做一种可以模拟气味的工具。如果将纳米纤维与其他种类的传感器相结合，就能用纳米结构来检验体液，包括唾液、血液、液体活检的样品，从中分析出潜在的疾病。结合数字化制造和3D打印等技术，IBM就能把传感器放入定制化探针，进行有效分析。


    相比需要等待数周的血检，芯片实验室不用花时间把病毒培养至能够被监测到的量，而是直接通过传感器来追踪最为细微的生物标记。


    这项技术最厉害之处在于，它能让人们在出现症状之前就了解自己患病的风险。举个阿尔茨海默病的例子，在出现明显症状之前的很长一段时间内，患者的神经状态已经产生了显著改变。如果定期检查血样，可以在阿尔茨海默病的早期就寻找到生物标记，迅速开始根据个人的情况制定治疗方案。


    虽然这种能从一滴血分析疾病的技术对人工智能的水平是个巨大的挑战，但真正考验IBM公司把此种产品推向市场的，还是技术难度超高的芯片。“芯片的最小测量级别为20纳米，它能让你从一个相当细化的角度来观察病毒等物质，但要看到这个精细程度，在材料的制作上可要花费大量的心血。”帕尔马说道。


    ### 3．AI+文字信息，形成精神疾病模型


    精神疾病是又一个需要人工智能技术来仔细咀嚼大量数据，化作有效医学见解的领域。从2015年开始，IBM尝试制造出能从人的讲话中诊断精神疾病的机器学习系统原型。在2018年年初，IBM公布了研究成果，59名受试者中有19
    人在两年内患上了精神疾病，其余40人则一切正常，算法预测的准确率高达83%。这套算法还能够区分近期罹患精神疾病的人群与正常人群的语言模式，并且准确率达到了72%。


    在精神疾病诊断中，患者的谈话一直是医生用以判断病情的重要因素。语速、音量、用语特点都可以用于判断精神疾病。现在IBM把这个分析工作交给了人工智能，患者与医生的交流或人们自己在社交网站上写下的话语都可以作为分析材料。


    IBM之所以能做到这一点，是因为他们已花费数年时间来研究精神、心理障碍与语言之间的关联，建立起了一套测量体系。“我们目前提上日程的研究，是要弄清这件事：对于特定的个体来说，某段话中的某些用语，能否帮助我们理解这个人的心理状态？”IBM技术总监帕尔马说道。


    IBM早已有过建立医疗模型的尝试：沃森最早的商业化尝试——“蓝色巨人”认知计算机系统就是癌症护理医师的助手。今天，公司还与医疗行业产生了不少的合作，建立各式各样的医疗认知工具原型。例如，IBM透露佛罗里达的地方医疗中心木星医疗中心（Jupiter
    Medical Center）就会引进IBM沃森的肿瘤辅助诊疗技术。另外，它还与纪念斯隆—凯特琳癌症中心合作了癌症治疗培训项目。


    除了精神分裂症、双向情感障碍和抑郁症等，IBM还会从可穿戴运动健身设备和医疗设备处获取数据，来辅助诊断帕金森症等神经疾病。虽然现在已经有医药健康专家把可穿戴设备中的数据用在诊断判断上，但IBM希望用机器学习来加速这个进程，并能提供额外的见解。


    帕尔马说，其实美国和欧洲已经有人做了可穿戴数据的实验，也有教授分享了实验数据，但没有人把这些数据综合到一起，研究这些数据中间是否有可关联之处，或者用整合的数据得出更深层次的理解。“用机器来处理和整合，恰好就是这个问题的答案。”


    ### 4．利用机器学习算法预测精神分裂症


    （1）IBM科学家发现AI和机器学习算法能够以74%的准确率帮助预测精神分裂症病例。


    精神分裂症是一种慢性衰弱性神经障碍，每1000个人中就有7～8个人会受其影响。精神分裂症患者可能会出现幻觉、错觉或思维障碍，还可能会出现认知障碍，如无法集中注意力；或身体缺陷，如运动障碍。'
