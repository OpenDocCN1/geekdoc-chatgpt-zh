    # AI 医疗应用研究


    ## 3.1 AI 与机器学习预测精神分裂症


    IBM 科学家和阿尔伯塔大学加拿大埃德蒙顿分校在《自然》杂志的合作期刊《精神分裂症》（Schizophrenia）上发布了新的数据，证明 AI 和机器学习算法能够以
    74%的准确率帮助预测精神分裂症病例。

    这项追溯性分析还表明，根据在大脑不同区域观察到的活动之间的关联，该技术能够从很高相关性的关联中预测精神分裂症患者特定症状的严重程度。这项开创性研究还可以帮助科学家识别更可靠、客观的神经影像生物指标（Neuroimaging
    Biomarkers），用于预测精神分裂症及其严重等级。

    阿尔伯塔大学的精神病学兼神经科学教授塞尔达·达尔孙（Serdar Dursun）博士表示：“这种独特、富有创新性的多学科方法加深了我们对精神分裂症的神经生物学原理的理解，可以帮助改善该疾病的治疗和管理。我们在大脑中发现了许多重要的异常连接，未来的研究可以探索这些连接，而且
    AI 创建的模型让我们离发现基于神经影像的客观模式更进了一步，这些模式可以作为精神分裂症的诊断和预后指标。”

    在论文中，研究人员分析了来自开放数据集生物医学信息学功能研究网络（fBIRN） 的去标识化的大脑功能核磁共振影像 （fMRI） 数据，数据中既包括精神分裂症患者和分裂情感性障碍患者，也包括健康的实验对照组。

    fMRI 通过大脑特定区域的血流变化来测量大脑活动。具体来讲，fBIRN 数据集反映了根据对调研参与者执行一个普通听觉测试时收集的数据，在不同清晰度水平上对大脑网络执行的研究。通过检查来自
    95 位参与者的扫描影像，研究人员使用机器学习技术开发了一种精神分裂症模型，用于识别大脑中与该疾病相关的最紧密的连接。

    从图 3-9 可以看出，在精神分裂症患者与没有该疾病的患者之间，一些大脑区域表现出具有统计意义的区别。例如，箭头 1 表示中央前回（Precentral Gyrus），箭头
    5 表示参与处理视觉信息的楔前叶（Precuneus）。


    ![](img/b5cb365603f8e7aad8ffa9c0e8df6520.jpg)


    图 3-9 人工智能识别大脑区域疾病

    （2）精神疾病的量化研究。IBM 和阿尔伯塔大学的研究结果表明，甚至在从多个站点（不同机器、跨越不同主体群等）收集的更具挑战的神经影像数据上，机器学习算法也能通过利用不同大脑区域间的活动关联，以
    74%的准确率区分精神分裂症患者与实验对照组。

    此外，研究表明，功能网络连接也可以帮助确定患者表现出的多种症状的严重等级，包括注意力迟钝、行为怪异、思维形式障碍、失语症（言语贫乏）和动力缺乏。

    通过预测症状严重等级，可以得到更加量化和基于测量结果的精神分裂症特征，可以在一个范围内确定该疾病，而不只是看到一个非此即彼的二元标签（诊断或非诊断）。这种客观的、数据驱动的严重等级分析方法，最终可以帮助临床医生为患者量身定制治疗方案。

    IBM 研究院医疗与生命科学副总裁阿贾伊·罗伊尤鲁（Ajay Royyuru）表示：“这项研究工作的最终目的是识别和开发客观的、数据驱动的测量指标来描绘患者的精神状态，并将它们应用于精神疾病和神经障碍的诊断。我们还希望提供新的洞察，揭示如何利用
    AI 和机器学习来分析精神疾病和神经障碍，帮助精神科医生评估和治疗患者。”

    美国国家心理卫生协会（NIMH）的研究领域标准（RDoC）强调了客观测量在精神病学中的重要性。这一领域常常被称为“计算精神病学”（ComputationalPsychiatry），旨在使用现代技术和数据驱动的方法改善精神病学中的循证医疗决策，这一领域常常依赖于主观的评估方法。

    作为这次持续合作的一部分，研究人员将继续调查大脑中与精神分裂症具有重要联系的区域和连接，继续努力改进这些算法，对更大的数据集执行机器学习分析，并探索将这些技术扩展到抑郁症或创伤后应激障碍等其他精神疾病的方式。


    ## 3.2 全产业链布局 AI 医疗——谷歌


    近年来，谷歌从搜索和广告等传统业务逐渐向医疗保健方向扩展，并认为其 AI 技术可以为疾病的检测、诊断和治疗创造一个强大的新范例。

    2018 年 4 月，CB 洞察（CB Insights）出具的一份报告列举了谷歌在人工智能方面所做的探索，以及未来可能扩展的领域。该报告指出，谷歌的布局场景主要包括医学影像、手术辅助系统、可穿戴设备和医疗大数据。


    ### 3.2.1 谷歌涉足医疗保健领域的子公司/部门


    2015 年，谷歌进行组织架构重组，成立控股母公司 Alphabet，谷歌成为其下属全资子公司，之后，AI 几乎成为每个部门战略的核心。在此次重组中，之前属于
    Google X 研发实验室（谷歌秘密项目实验室）的医疗保健项目成为 Alphabet 的新子公司。图 3-10 所示为谷歌改组后的整体结构。


    ![](img/9b3a4d9bbf3be9c6537732e46a0eb1be.jpg)


    图 3-10 改组为 Alphabet 后谷歌的整体结构

    在新的结构下，谷歌的健康业务相对分离了出来，以下将重点介绍几家与医疗保健有关的子公司/部门。


    #### 1. Verily


    Verily 是 Alphabet 旗下承载大部分医疗保健业务的公司，该子公司专注于在大量数据的基础上，通过分析工具、干预措施和数据研究等来改善医疗保健。

    Verily 由 Andrew Conrad 创办，同时他也是美国国家遗传学研究所的创立者。该子公司主要致力于与现有医疗机构合作，寻找应用 AI 的领域，并研发出第一款应用于医学的智能手表
    Study Watch——一种捕获生物特征数据的可穿戴设备，其已成为下文许多研究计划的核心。


    #### 2. DeepMind


    DeepMind 致力于人工智能研究，其主要任务之一是寻找人工智能在医疗保健领域的应用方式。2014 年 1 月，谷歌以超过 5 亿美元的价格收购 DeepMind。DeepMind
    位于伦敦，由戴密斯·哈萨比斯（Demis Hassabis）经营，一直以来，该公司都与国家卫生服务机构保持着密切的合作。


    #### 3. Calico


    Calico 专注于研究与抗衰老及与年龄有关的疾病。该子公司使用 AI 来理解大型数据集，同时实现实验室流程的自动化。Calico 由前美国基因泰克工程技术公司（Genentech）首席执行官亚瑟·莱文森（Arthur
    D. Levinson）经营。


    #### 4. 谷歌风险投资（Google Ventures，GV）


    谷歌通过其风险投资部门 GV 在医疗领域投入了大量资金。GV 在不同行业进行投资，但最近几年，在其整体投资速度放慢的情况下，GV 却一直在增加其在医疗保健公司的投资速度，足见谷歌对其医疗保健领域的重视。


    ### 3.2.2 底层架构为医疗保健数据提供动力


    医疗保健面临的最大挑战之一是数据孤岛现象，系统之间的互操作性很小。即使在同一家医院内，不同电子病历集成数据也很困难，更不用说移动应用、连接设备和其他健康跟踪产品的数据了。

    谷歌致力于通过以下 3 个方面的努力为新的数据基础架构层提供支持。


    #### 1. 打通数据与数据间的通路


    为了提高医院、医生和其他相关方之间的互操作性，谷歌正在支持研发一项名为加快医疗保健互操作性资源（FHIR）的新技术。FHIR 为不同的数据元素创建标准，以便开发人员可以构建可用于访问来自不同系统的数据集的应用程序编程接口（API）。

    谷歌于 2016 年以 6.25 亿美元收购了 API 管理公司 Apigee，Apigee 的部分业务致力于使用 FHIR 构建医疗保健 API。目前，Apigee
    已与多家知名医疗公司合作，其系统有助于在数据流之间搭建桥梁，用于链接多个现有数据集，或者构建移动应用程序，并寻找从其他来源（如可穿戴设备）获取数据的新方法。

    同时，谷歌的 DeepMind 利用 FHIR 建立了一个新的数据基础设施，以便从 EMR、医院设备和医生的笔记中分离出单独的数据，建立一种一致的、结构化的格式数据。

    例如，该公司推出了“Streams”应用程序，将相关患者信息和警报通过移动应用推送给医生、护士等来检测急性肾损伤。这大大降低了以往通过人力传输信息的成本，对于紧急事件来说大有裨益。

    目前，DeepMind 计划构建更多自己的应用程序，或允许第三方开发商在此新基础架构之上构建，或将其用作增加一系列其他谷歌服务（如 Google Cloud）的手段。


    #### 2. 推广谷歌云平台


    谷歌正在推动构建在谷歌云平台之上的医疗保健专用服务，如谷歌的在线生产力和协作平台 G Suite（Drive、Docs 等）。G Suite 提供符合标准的云服务，医疗保健企业可以用云平台来共享患者信息、改善患者体验（如使用谷歌的跨平台即时通信
    App Hanouts）等。

    另外，谷歌为开发人员提供了一套更通用的工具，如基于 DistBelief 进行研发的第二代人工智能学习系统 TensorFlow。

    最近，谷歌发布了用深度神经网络从 DNA 测序数据中快速精确识别碱基变异位点的开源工具 DeepVariant，用于基因组学的分析。

    随着越来越多的研究人员在谷歌云产品套件的基础上进行研究，谷歌云对谷歌来说更具价值，谷歌的基础架构层也成为医疗保健基础架构中最根本的一部分。


    #### 3. 为第三方建立数据集


    目前，谷歌正在构建自己的数据集，开放给研究人员使用，其他人最终可以将其集成到自己的研究中。Verily 正在研究的两个主要数据项目是与 NIH 和 Verily
    自己的独立项目基线研究相结合的 All of Us 研究计划。其所有的研究计划（以前称为精准医学倡议）旨在追踪来自不同背景的 100 万参与者的健康数据，包括基因组数据、生活方式数据、生物标志数据等，目标是让研究人员分析最全面的数据集，以发现关于健康的新见解。

    2016 年，Verily 与布罗德研究所和范德比尔特大学一起获得了美国国立卫生研究院 5 年的资助，来构建数据基础架构和分析工具，容纳来自 79 000
    名参与者的数据。一旦参与这项计划，参与者需使用 Study Watch 监控自己的日常活动，使用睡眠传感器监控睡眠模式，通过移动设备或电子邮件回答定期调查问题，并每年参加
    4 次站点进行的各种测试。Verily 的知情同意书表明，该公司正在构建一个第三方研究人员最终能够访问和构建的综合数据库。

    同样值得注意的是，所有人和项目基线的数据都存储在谷歌的云基础架构中，而研究人员建立的这些数据集将帮助谷歌云平台成为健康 IT 基础架构层的更深层部分。


    ### 3.2.3 谷歌 AI 技术在特定疾病上的应用


    谷歌涉及医疗保健的业务包括以下几个方面。

    数据生成：包括数字化和摄取由可穿戴设备、成像设备等产生的数据。

    疾病检测：使用 AI 来检测给定数据，数据异常则表示可能存在某种疾病。

    生活方式管理：利用谷歌研发的 AI 工具可帮助诊断患有疾病或有疾病风险的人，通过了解他们的日常生活，对其生活方式进行积极的调整。

    以下将对谷歌 AI 技术所涉足的医疗健康领域进行深入分析。


    #### 1. 不同类型的癌症


    谷歌的子公司 DeepMind 制订了癌症治疗计划。2017 年，DeepMind 发布了有关肿瘤鉴定的研究，在该研究中，对已经转移到邻近淋巴结的现有乳腺癌图像集进行了算法培训。该算法可以
    92%的准确度检测肿瘤。

    图 3-11 所示的是巨噬细胞与肿瘤细胞。


    ![](img/72ec818a47542fc29da5671e5a2d58bb.jpg)


    注：根据算法，绿附代表可能出现肿瘤的区域。

    图 3-11 乳腺癌转移淋巴结活检图像自 2017 年以来，DeepMind 已与英国国家医疗服务体系（NHS）和伦敦帝国理工学院的癌症研究中心合作，进一步开展这项研究并改进乳腺癌的早期检测。

    DeepMind 也在研究其他癌症，如头颈部癌症。DeepMind 在这方面的工作与治疗设计更相关，如应用 AI 来加速绘图过程。目前传统的映射过程大约需要
    4 个小时，而运用 AI 技术则可以将这一时间缩短到 1 个小时。

    值得注意的是，谷歌本身无法生成这些数据，而是与提供癌症数据的医院合作。同时，谷歌还与西门子医疗健康公司或菲利普斯公司等合作，以获得 MRI /CT 图像，然后使用这些数据构建算法，以改善检测和治疗计划。


    #### 2. 眼科疾病


    目前，Verily 正与尼康子公司 Optos 合作，检测糖网病的发病状况，Optos 为视网膜成像测试和眼病检测提供机器。Verily 不仅专注于检测眼部疾病，还修复某些潜在疾病。研究表明，谷歌的算法与受过训练的眼科医生在检测病情方面同样出色（图
    3-12）。


    ![](img/64c4cf2a12f7b579dc703d6a30001484.jpg)


    图 3-12 谷歌的算法与医生相匹配此外，DeepMind 还与英国的 Moorfields 眼科医院合作，改进此前的眼病研究，协助眼科医生评估患者眼部问题的风险，并根据病情的紧急程度指导他们进行医疗护理。


    #### 3. 糖尿病


    糖尿病检测和管理是谷歌在医疗保健领域的重点内容，谷歌已经研发了一些成功产品并已推出市场，如小型连续葡萄糖监测仪（CGM）。这款监测仪由 Verily 与医疗设备公司
    Dexcom 合作开发，已经进入商业化流程。而谷歌公司的长期目标是创造一个更小的一次性传感器，可以像绷带一样穿 14 天，而且不需要指血针次校准。

    糖尿病管理相对容易做到，但目前糖尿病检测市场仍然存在缺口。

    使用心率监测和预测疾病的初创公司心电图（Cardiogram）最近发布了一项研究：由于人体的胰腺与自主神经系统相连，心脏节律的微小变化可能有助于检测疾病的发展。该研究使用现有可穿戴设备，包括基于安卓系统的设备，通过
    AI 算法和监测心率的手段，使检测糖尿病的准确率可达 85%。

    2016 年 9 月，Verily 与赛诺菲集团共同投资了研发糖尿病管理可穿戴设备的公司 Onduo，两家公司共同向该解决方案投入了 5 亿美元，旨在通过传感器指导干预，帮助
    2 型糖尿病患者管理他们的身体状况。该项目将硬件（血糖监测器、智能体重秤等）、软件和慢性病管理结合起来，帮助糖尿病患者管理病情。在这之中，AI 可以检测到处于风险中的患者，并简化指导管理慢性病的过程。

    此外，Verily 最近获得了智能注射器专利，以帮助糖尿病患者监测他们的胰岛素注射，而智能注射器也很可能是 Onduo 糖尿病解决方案的一部分。


    #### 4. 心脏病


    目前，谷歌以两种方式达到数据生成和心脏状况监测的目的。一种是研究人员用 Verily 制作的可穿戴设备 Study Watch 监测研究参与者的不同生物指标，包括心电图和心率监测，用它来发现心脏的异常情况，并更好地了解可能导致心脏病发作的前兆，这有助于在病情发展早期确定更好的心脏疾病预测因子。

    另一种方式是利用一种专利——被动心脏监测器的专利（图 3-13），该监测器使用光学传感器和机器视觉，可提供持续的心脏健康监测，以促进更健康的行为，更适合在日常生活中使用。


    ![](img/4c31a0a4820bf39e451972d55d3475e0.jpg)


    图 3-13 被动心脏监测器专利此外，该专利包括一个疾病检测组件，可以检测脑部区域的血流问题，还可以检测卒中或检测心律失常等心血管问题。

    目前，Verily 参与了由布里格姆妇女医院（BWH）心血管医学主任卡鲁姆·麦克雷（Calum Macrae）博士发起的项目—— One Brave Idea，并与阿斯利康和美国心脏协会共同出资
    7500 万美元支持该项目。该项目旨在更好地了解造成不同类型心脏病的因素，以及预防和治疗心脏病的方法。


    #### 5. 帕金森综合征


    帕金森综合征又名震颤麻痹，是一种常见的中老年人神经系统变性疾病。对于这种疾病，业界目前没有很好的解决方案。目前，Verily 正试图通过捕获和分析数据进行早期疾病识别，以实现个性化治疗和改善管理方案，从而达到预防帕金森综合征的目的。

    Verily 与荷兰 Radboud 大学合作推出了个性化帕金森综合征项目，以结合临床数据研究和观察收集患者数据，包括心脏功能、皮电活动和惯性运动。

    通过这项研究，研究人员一方面在 24 小时的监测过程中，能够确定疾病发作的指标，如心律变化或睡眠模式；另一方面，通过对监测数据的收集，Verily 可以构建能够将帕金森患者分类的算法，对不同类型的患者进行个性化治疗。

    通过个性化帕金森（Personalized Parkinson）的研究，Verily 开发了一个加密的数据库，供研究人员使用，同时它还为美国国立卫生研究院（NIH）建立了一个名为“知识门户”的数据库，使研究人员可以实时共享与帕金森综合征研究有关的数据集。

    Verily 也在研究如何帮助帕金森患者管理他们的日常生活。例如，Verily 收购了智能勺 Lift ware 的创建方 Lift Labs，该智能勺能够帮助帕金森患者在吃东西时稳定食物（图
    3-14）。


    ![](img/4db6c26eb1917eef0dc24c6fc0f3ca9e.jpg)


    图 3-14 智能勺

    同时 Verily 也在探索其他方式以使 Lift ware 工具帮助患有神经系统疾病的人。例如，这项专利提出，勺子可以用来检测食物的质量和每餐咬食的次数，以确保患者获得足够的营养。这对于帮助管理神经系统疾病患者的护理人员和提供者来说非常有用。


    #### 6. 多发性硬化症（MS）


    多发性硬化症是以中枢神经系统白质炎性脱髓鞘病变为主要特点的自身免疫病，可导致肌肉控制退化、记忆丧失等。

    Verily 正在与生物技术公司 Biogen、布里格姆妇女医院合作开展一项研究，以了解多发性硬化症的发展状况。这项研究将佩戴 Study Watch 的参与者的数据与提供给
    Verily 机器学习算法的临床数据相结合，以改善检测并了解导致疾病发作和进展的原因。

    有研究表明，Verily 正在与 GlaxoSmithkline 公司开展一项称为 Galvani Bioelectronics 的项目。该项目使用微型电子设备来控制电信号在身体内的流动方式。电疗通过非常小的电子植入物来完成，这有助于调节电信号通过神经系统流动。

    上述事实显示，该项目有可能在生物电子领域用来帮助管理 MS。

    另外，谷歌在外骨骼机器人方面的探索也可以帮助人们治疗这种疾病，外骨骼机器人可以通过结合软件、传感器和电子技术，帮助运动功能受损的人恢复部分运动能力。Robotics
    等外骨骼公司的解决方案。


    #### 7. 其他医疗保健领域的研究


    谷歌接下来可能会探索的疾病领域，包括慢性阻塞性肺病（COPD）、心理和行为健康、衰老等。

    慢性阻塞性肺疾病（COPD），是由呼吸道炎症引起的慢性支气管炎和（或）肺气肿，可进一步发展为肺心病和呼吸衰竭的常见慢性疾病。全球 40 岁以上人群发病率已高达
    9%～10%，是美国第三大人口死亡原因。

    谷歌通过对环境数据的捕获及分析，声称可通过 Study Watch 对穿戴者进行预警。此外，谷歌于 2017 年收购的 Senosis Health 可用于开发
    COPD 的诊断工具和治疗方法。Senosis 能够使用现有的智能手机麦克风作为肺活量计来测量肺功能，还可以使用智能手机摄像头来测量血红蛋白水平，这对于检测贫血症非常有用。贫血症被认为与
    COPD 的潜在并发症有关，因此这两个数据集可以相互促进，从而更好地理解和治疗 COPD。


