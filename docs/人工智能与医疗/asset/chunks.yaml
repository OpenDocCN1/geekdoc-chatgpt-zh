  trans: '


    在心里和行为健康方面，谷歌可以通过其搜索功能来检测心理健康问题，进入行为健康领域。该公司已经与全国精神疾病联盟（NAMI）合作，为寻找抑郁症系统的用户开发问卷。

    2016 年 4 月，谷歌风险投资投资了 Quartet Health，该公司通过分析健康数据来确定患者是否需要心理咨询，并为他们匹配合适的心理咨询师。Quartet
    Health 可以利用其专业知识和数据帮助患者更早发现行为健康问题。

    在对抗衰老的问题上，谷歌的子公司 Calico 正在研究不同的生活方式对人们老化的机制产生的影响，如细胞过程、遗传学等如何影响衰老过程。Calico 试图通过
    AI 技术寻求更好的疾病检测方法和更科学的生活管理方式。该公司最近发布了关于裸鼹鼠衰老模式的研究，并宣布与 Abbvie 达成合作协议。同时，谷歌正针对阿尔茨海默病进行药品研发，将
    AI 技术应用于此类病症，将对人类的医学探索产生深远的影响。


    ## 3.2.4 AI 医疗工具

    在疾病之外，谷歌正在探索如何用 AI 作为医疗工具帮助医院的医生，从而减少医生的人力成本。

    Verily 与强生公司合作创立了 Verb Surgical 公司，该公司的网站涉及机器学习、机器人手术、仪器仪表、高级可视化和数据分析。

    Verb Surgical 的目标是普及手术技能，通过提供外科医生信息，来提高手术的技能和护理标准，从而为手术带来更好的结果。

    Verily 已经提交了与机器人手术相关的专利，其中一项专利详述了机器人外科医生（图 3-15）使用手术前产生的图像进行解剖的方法，另一项专利涉及在不同类型的生物组织上使用光来指导切割位置。


    ![](img/bb156c67227181f2b597cdc676ad9616.jpg)

    图 3-15 外科手术机器人

    还有一个专利是自动腹腔反射测试。该测试需要医生注意特定颈静脉在厘米级别产生的变化。谷歌通过压力袖带、相机和机器视觉结合在一起，可以更准确地进行测试，并且与医生的测试进行对比差距更小。

    谷歌 2015 年与梅奥诊所合作推出面向患者的健康评估工具健康卡，提供患者的疾病信息、症状和常见疾病，与 WebMD 的用法类似。

    谷歌正在更深入地参与消费者层面的疾病筛查和诊断，如谷歌开发的 Pixel 手机，可用于对患者进行健康检查，对疾病进行诊断和筛选。

    此外，患者也可以利用谷歌的语音助理 Google Home 进行健康评估。患者利用这些工具回答与健康相关的问题，类似于搜索中的健康卡片，用来确保药物的依从性，这类工具也可以帮助患者管理与疾病相关的生活方式，询问后续问题以评估患者的风险水平。

    该公司还在研究其他可穿戴设备以用于提高医生的诊断能力，如谷歌眼镜（图 3-16）。该工具可以将眼睛、语言和运动测试自动化，代替格拉斯哥昏迷评分表^(\[4\])，评估脑损伤的严重程度。


    ![](img/634712af181c16cd424b38a53c92147c.jpg)

    图 3-16 谷歌眼镜


    ## 3.2.5 人口健康管理

    关于如何使用 AI 改善大部分人群的健康状况，谷歌也作了大量的尝试。谷歌正在研究一个叫做调试（Debug）的项目，该项目旨在设计并向人群释放无菌蚊子，以消除携带疾病的蚊子。该公司表示，它使用传感器和机器视觉对雄性和雌性埃及伊蚊进行分类并对其进行监控。

    另一项研究是城市环境对健康的影响。这项研究最终分配给以医疗补助/医疗保险为重点的 Cityblock Health 公司，由谷歌的 Sidewalk 实验室投资。

    Cityblock 正在创建有医疗补助和低收入医疗保险患者地区的个人邻里医疗中心，以确保这些患者能够使用医疗基础设施，并在需要时获得护理。该公司还开发了一个名为
    Commons 的健康应用程序，将护理团队与这些患者联系起来。

    在收集了大量有关公共医疗补助和医保制度接受者的数据之后，Cityblock 就会采用 AI 作为基于风险和适时进行干预的手段，以半自动或自动的方式进行分类。

    在食品安全方面，谷歌尝试通过早期监测动物和检测由疾病引起的牲畜的行为或生理变化，来提高公共卫生安全。一家名为 Cainthus 的创业公司已经使用机器监控家畜。同时，谷歌可以用机器视觉技术更好地帮助消费者检测食物是否变质。

    此外，像 Kewpie 这样的公司已经在使用谷歌的 TensorFlow 来追踪食物中的成分。


    ## 3.2.6 谷歌的盈利模式

    谷歌可以为大型医疗设备和制药公司提供外包原型和研发引擎。这些巨头可以为新发明背后的知识产权和技术支付费用，然后将其商业化专业知识付诸实践，并将其真正推向市场。例如，Verily
    在 2014 年将其智能装置授权给了诺华。

    随着人工智能越来越多地应用于医疗设备中，谷歌已经开始销售自己的 AI 产品，包括 Google Home 和 Google Pixel 等。对于像糖尿病管理这样利用数据可以不断迭代、提供更高效诊断和管理的人工智能，可以将其出售给医院或保险公司。

    随着谷歌推出谷歌云服务，并与其他科技巨头竞争，医疗保健由于有大量数据产生，因此销售数据存储和计算能力在这个领域中很有吸引力。

    虽然谷歌正在致力于通过人工智能来解决医疗保健问题，但必须处理公众的看法和信任问题。考虑到健康数据的敏感性，消费者对谷歌保护个人数据隐私能力的信任至关重要。

    谷歌正在开展医疗保健的众多领域不同分支的人工智能研究，如果谷歌能找到有效的方案解决用户隐私、公信力等问题，就有可能创建一个新的数据和人工智能驱动的医疗范例。

