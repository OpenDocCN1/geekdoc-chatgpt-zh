    ### 产品介绍

    Ai Cure 的 App 可以通过面部识别技术来判断患者是否按时服药，再通过 App 获取患者数据，用自动算法来识别药物和药物摄取。患者数据会通过与健康保险流通与责任法案（HIPAA）兼容，通过网络实时反馈给临床医生，这样一来，医生就可以确认他的患者是否按照嘱咐按时服药。


