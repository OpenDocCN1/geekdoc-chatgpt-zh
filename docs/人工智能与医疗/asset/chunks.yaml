    ### 案例介绍

    ### 科大讯飞晓曼导诊机器人

    科大讯飞股份有限公司成立于 1999 年，是一家专业从事智能语音及语言技术、人工智能技术研究，软件及芯片产品开发，语音信息服务及电子政务系统集成的国家级骨干软件企业。科大讯飞作为中国智能语音与人工智能产业的领导者，在语音合成、语音识别、口语评测、自然语言处理等多项技术上拥有国际领先的成果。

    晓曼机器人是科大讯飞在机器人领域的集大成者。

    科大讯飞将语音合成、语音识别、语义理解和人脸识别等技术运用到智能服务机器人本体上，结合麦克风阵列、3D 摄像头、身份证读卡器、取号小票机等外设应用，以语音、触屏、动作等多模态的交互方式为用户提供优质的服务，在政府、金融、运营商、医疗等多个领域具有广阔的应用前景。


    ## 2.1.3 慢病管理

    通常，人们理解的慢病管理多为 App 性质的软件，与人工智能无关。App 的价值在于帮助患者更高效地做病情管理。前面在个人问诊类的人工智能虚拟助手产品中谈到，初诊环节中，人工智能聊天机器人和患者的沟通极有可能出现问题，需要严格监管。而慢病管理环节中应用人工智能聊天机器人，则可以保证在患者病情已知、可控的情况下进行判断和处理。

    慢病 App 作为医患沟通的桥梁，最终需要让医方觉得更轻松，而不是更麻烦。在人工智能的介入下，聊天机器人这一模式的核心价值在于进一步改善人机交互界面，通过更符合人性习惯的沟通方式，进行人机交互，而以往的所有模式都是人迁就机器。

    在患者获取相关医学知识时，只需通过问问题即可，而不用再去搜索查询，筛选相匹配的内容了。聊天机器人还可以通过分析语义，理解指令，替用户做一些操作，如记录当日检测的指标、饮食摄入情况等。用户可以不再需要填表，而只要用最符合人类表达方式的一两句话即可。这类功能对于年轻人来说也许并没有多大的效用，但对于不习惯与机器沟通的年长者来说，却很可能是极大的改善，尤其是智能语音方式。

    同时，当患者的数据发生变化的时候，人工智能可以及时发现问题，邀请医师或者药师人工介入。在人工智能的帮助下，慢病 App 链接线下所要匹配的医护人员数量将得以降低，同时不会对服务体验造成不良影响。

    站在医方的立场上，人工智能虚拟助手反过来可以成为医护人员的助手，承担部分行政性的常规工作。例如，预约、备案等行政性事务可以代为解决，常见病症问题也可以代为应答，替代医护人员为患者做例行监控等。


    ### 案例介绍

    ### Sense.ly

    Sense.ly 是一家提供医疗保健服务的初创企业，孵化于法国的电信巨头 Orange S.A.，2013 年成为独立公司。Sense.ly 为用户提供了一位虚拟聊天机器人助理，它的名字叫作
    Molly。

    Sense.ly 的平台集成了医疗传感、远程医疗、语音识别和增强现实等技术。患者在 Sense.ly 上注册后，无论是在家里还是在他们的看护机构中，都可以通过一个按钮呼叫这位虚拟护士。Sense.ly
    遵循个性化的护理方案，使临床医生可以无缝监测患者所遇到的危险因素，并根据需要调整医嘱。

    患者可以与 Molly 进行自然对话，从简单的需要到复杂的慢性病医疗援助都能实现，充当医疗服务提供商与患者的中介。

    在 Molly 的帮助下，患者可以将他们的生命体征数据告诉它，包括疼痛、睡眠、压力和饮食等，信息传递给 Molly 背后的医疗机构，或者是通过视频电话直接对接主治医生。如果患者在沟通中表现出较高的风险，就可以引起主治医生的注意，并获得相关建议。


    ### Catalia Health

    在慢性病患者中，持续服用药物是非常重要的，特别对于老年人来说。位于旧金山的 Catalia Health 开发了马布（Mabu）——一个个人医疗助理机器人来解决这些问题。Catalia
    Health 于 2014 年成立于美国，专注于患者行为研究与服务，通过研究患者的个体心理、行为、习惯来协助医院和护理机构更好地服务患者。马布不仅可以为慢性病患者提供帮助，也可以收集数据提供给医疗保健机构。马布是一款类人形的平板电脑，它运用人工智能技术，通过监测患者服用药物的时间和方式来提供药物依从性帮助。该系统包含不同算法输入，可以通过其在患者家中与患者的接触，学习患者特定的行为和偏好。

    ![](img/25f8fb0d2630f6cfa113ec23ea0cc4e8.jpg)

    图 2-9 Catalia Health 平台功能

    在功能方面，马布可以提醒患者服用药物，询问患者的感受。如果症状越来越严重，马布可以将这些信息转发给医疗服务提供者。（图 2-9）目前，该公司正在对马布进行测试并在制药公司、医疗保健系统和家庭健康组织中进行试点。


    ## 2.1.4 电子病历（Electronic Medical Record，EMR）语音录入

    根据丁香园的调查，50%以上的住院医生每天用于写病历的平均时间达 4 小时以上，其中一部分甚至超过 7 小时。《福布斯》此前曾经报道：医生花费 27%的时间在诊室问诊^[1]，还有
    49.2%的时间在做书面工作，其中包括使用电子健康记录系统。即便在诊室，医生也只花 52.9%的时间跟患者沟通，还有 37%的时间在处理书面工作。电子病历录入的简易性和高效性成为临床医生的迫切需求。

    相比于医生手工进行电子病历录入，人工智能参与的智能语音录入通常由语音识别、语义分析、智能纠错 3 部分构成（图 2-10）。

    ![](img/4856b2a1826f98fcee70ec1f2abde85e.jpg)

    图 2-10 电子病历的语音录入流程

    智能语音录入全过程由医疗领域语言数据模型进行支撑，该数据由定制语音模型而来，针对各个科室的业务进行了梳理，覆盖各个科室常用的病症、药品名称、操作步骤等关键信息。为解决医生的口音问题，智能语音录入系统需要反复进行自我学习，逐渐提升识别准确率。

    此外，语音智能录入能够大幅提高医生录入病历的速度，从而节省医生的宝贵时间，使其能专注于治疗。在某些科室，如影像科、超声科、口腔科等，智能语音录入能够实现检查、诊断和病历录入同时进行，避免了医生诊断总是被打断的情形的出现，让医生能够专注于诊疗行为。

    医技科室具有特殊性，需要在两个屏幕间来回切换，一会儿看片子，一会儿进行报告记录。在口腔科，医生通过语音录入方式不仅能提高工作效率，还能有效避免复制、粘贴操作，规范病历录入，增加病历录入的安全性。

    医疗智能语音录入还需要克服嘈杂的环境，识别复杂的医学专业术语，满足不同语速和口音使用者——成为可靠、好用的技术，还有许多技术难点需要克服。


    ### 案例介绍

    ### Nuance

    Nuance 公司在 2011 年推出语音识别技术，是语音解决方案行业的龙头企业。Nuance 第一次被众人熟知源于其与苹果之间的合作。当时被誉为“下一代交互系统”的
    Siri 采用了 Nuance 的语音技术后，这家名不见传、“闷声”钻研技术的公司瞬间被各大媒体曝光。其实，在与苹果合作之前，Nuance 已经跟多家知名厂商进行了合作，其技术被应用于手机、电视机、汽车等产品中。其中，三星的语音助手
    S-Voice 也采用了 Nuance 的技术。

    Nuance 为客户提供自动语音识别、自然语言理解、对话和信息管理、生物识别扬声器认证、文本转语音、光学字符识别（OCR）、领域知识等功能及专业服务。Nuance
    主要有医疗、企业、影像、移动 4 个业务板块，2014—2016 年，医疗板块的收入分别为 10.2 亿美元、10 亿美元和 9.7 亿美元，稳定在 10
    亿美元左右，占总收入的比例约为 50%。Dragon Medical^[2]平台的语音病历录入准确率已经高达 99%，能够帮助临床医生提升的文档事务处理效率高达
    45%。

    Nuance 的医疗服务主要有 5 个部分，分别是转录解决方案、Dragon Medical、临床文件改进（CDI）和编码解决方案、诊断解决方案和 Dragon
    解决方案。

    转录解决方案：使大中型医疗机构的医生能够使用按需的企业级医学转录平台简化临床文档；Dragon Medical：提供听写软件，使医生能够在各种设备上准确地捕获和记录患者的护理信息，而且不会中断现有的工作流程；临床文件改进（CDI）和编码解决方案：确保患者健康信息被准确地记录、编码和评估，以提供更完整和准确的临床文件；诊断解决方案：使放射科医生能够记录、合作和共享医学图像和报告，优化患者护理；Dragon
    解决方案：为企业用户和消费者提供 Dragon 专业的解决方案，能够使用语音。

    在美国就有超过 3000 家医院使用 Nuance 的医疗保健解决方案，超过 15 万名医生和护理人员使用 Nuance 的 Dragon Medical
    系统，平均每年记录 1 亿名病人的数据，使用量上升 30%，94%的医疗机构考虑使用或有强烈兴趣使用。


    ### 讯 飞 医 疗

    科大讯飞在 2015 年就涉足了智慧医疗领域，其医疗语音录入的主要产品为“基于语音的门诊病历采集系统”。借助自己的技术优势和强大的人工智能研发团队，讯飞医疗不仅将智能语音技术应用于医疗，业务还涉及医疗影像，以及类似于
    Watson 的、基于认知计算的辅助诊疗系统。

    2016 年，讯飞医疗业务的第一款产品——“云医声”手机应用在安徽省立等医院正式投入使用，这标志着讯飞医疗产品开始落地。“云医声”利用科大讯飞全球领先的智能语音和人工智能技术，不仅可以收集患者的所有资料，方便医生随时查阅，还能将医生说出来的医嘱直接记录、整理成电子文档，大大减轻了医生的工作量，同时可以给医生精准推送医疗文献等数据。

    首先，为应对医院嘈杂的环境，同时考虑到外科医生、放射科医生、牙科医生在手术或者工作中不能随时书写病情的情况，科大讯飞给医生特制了一款麦克风，在医生和护士、患者交流的过程中，由人工智能系统自动过滤掉无用信息，将所需的医疗数据自动转换成文字，使医生在工作的过程中也可以做好病历记录。其次，为了更好地提高医生的工作效率，搜集有效的医学数据，讯飞医疗依据自然语言处理技术，直接完成文字结构化处理，形成结构化电子病历。病例中包含患者的检查史、病史、各项检查结果、身体指标，医生只需对电子病历内容进行简单的修改确认，即可打印提供给患者，并完成电子档保存，识别准确率高达
    97%。


    ### 云 知 声

    云知声是一家专注物联网人工智能服务的公司，利用机器学习平台（深度学习、增强学习、贝叶斯学习），在语音技术、语言技术、知识计算、大数据分析等领域建立了领先的核心技术体系，这些技术共同构成了云知声完整的人工智能技术图谱。在应用层面，AI
    芯片、AIUI^[3]、人工智能服务（AI Service）三大解决方案支撑起云知声核心技术的落地和实现，智能医疗语音录入系统（图 2-11）就是云知声的应用之一。

    ![](img/c9ad246c36d0278ab2b02584b48cdc69.jpg)

    图 2-11 云知声智能医疗语音录入系统

    智能医疗语音录入系统以云知声专业的、面向医疗领域的高性能识别引擎为基础，以飞利浦手持式外设录入设备为辅，通过外设录入设备即可与医院内各系统完美对接，通过语音来高效地处理大量文本录入工作，通过语音和手持设备上的功能键与院内医院信息管理系统（HIS）、个人云存储系统（PCS）等交互。

    另外，云知声还研发出国内医学领域首个语音识别引擎，针对医学数据库（数百万的医学专有名词、数千小时的语料积累、极其复杂的中英文混合表述方式）做了大量模型优化。

    为了可以精准识别，云知声还为医院做了深度定制。深度定制的医疗语音识别模型根据不同科室、不同病种的整段病历资料，运算出关键词句语料，为 40 多个临床和医技科室提供分场景支持，尤其在神经科、免疫内科、血液科、普通内科等疑难杂症患者多的科室应用效果最好。目前这个语音识别系统准确率在
    95%以上，个别科室的语音识别率甚至超过 98%，同时辅以云端语义校正技术，整体识别率接近 100%。

    医生通过语音录入方式不仅提高了工作效率，还有效避免了复制、粘贴操作，规范了病历输入，增加了病历输入的安全性。目前，这个系统可以有效节省医生 38%以上的时间。

    ![](img/add74318e255afbad085188b4c899f00.jpg)

    图 2-12 人工智能+医疗企业主要分布领域

