    ### 6.1.2 发展现状：核心技术正在申请专利


    NarrativeDx的优势在于其自然语言处理技术在该领域非常成熟。


    常见的自然语言处理方式是搜索关键词，这种方式需要人工提前设定筛选哪些关键词。但“一刀切”的分类方式过于简单粗暴，因为同样的词语用在不同的语境下传递出的意思可能完全不同。


    NarrativeDx的自然语言处理技术可以结合具体的语境判断患者表达的是什么意思。目前，NarrativeDx已经对自己的自然语言处理技术申请了专利保护，美国专利局正在审批中。


