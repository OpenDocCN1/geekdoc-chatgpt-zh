    # 第4章 国内现状：人工智能与医疗的国内布局


    人工智能与医疗的商业前景一再被看好，国外互联网巨头纷纷布局。前些年中国的产业巨头大多停留在组建人工智能研究院的模式，给人工智能相关初创企业的风险投资机构带来了发展与机遇。随后，人工智能越来越多地应用于制药和医疗器械行业，推动了我国人工智能企业的产品线布局。


    ## 4.1 我国人工智能学术研究世界领先


    尽管美国在人工智能的基础研究领域一直处于前沿地位，但是近两年来，中国的人工智能科技人才正在实现弯道超车。


    美国发布的《国家人工智能研究与发展策略规划》报告显示，从2013年到2015年，在SCI收录的人工智能方向的论文中，涉及“深度学习”的论文数量增长了约6倍。中国学者的论文发表数量从2013年上半年开始超过美国，并大幅度领先于其他国家（图4-1）。


    ![](images/3b15fe3725043fa51560a91f7b8a631b.jpg)


    图4-1 人工智能领域论文发表情况（2007—2015）


    虽然中国学者人工智能论文SCI发表数量有所增加，但是影响力还没有得到相应的提升。麦肯锡的《中国人工智能的未来之路》报告显示，2015年中国学者发表的人工智能论文被引用量高达2124篇，远远超过美国的1116篇。然而，去掉论文中的自我引用^(\[1\])部分，美国学者的论文引用量将上升到第一。而在H指数^(\[2\])方面，美国学者的论文影响力排名第一，中国排名第三（图4-2）。


    ![](images/d462e6193e63487dcd54660cc7b3b096.jpg)


    图4-2 中国人工智能论文影响力


