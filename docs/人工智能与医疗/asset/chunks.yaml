    ## 2.6 智能化器械


    2018年4月初，美国食品药品监督管理局（FDA）批准通过了IDx公司研发的首个应用于一线医疗的自主式人工智能诊断设备IDx-DR的软件程序，该程序可以在无专业医生参与的情况下，通过查看视网膜照片，对糖网病进行诊断。这个产品的获批上市经历了长达21年的时间。仅IDx和FDA在如何评估系统并确保其准确性和安全性方面的沟通，就历时7年。


    美国近期批复的几款AI产品全都走Class II的认证流程，通过跟传统临床决策支持系统（CDSS）做等同对比，证明其安全有效性。中国的法规相对来说更严格，对临床评价的路径控制也非常严格。


    2018年8月1日，我国新版《医疗器械分类目录》（以下简称《目录》）正式生效，医用软件按二类、三类医疗器械设置审批通道。《目录》指出，若诊断软件通过其算法，提供诊断建议，仅具有辅助诊断功能，不直接给出诊断结论，可以按《目录》中的第二类医疗器械管理；若诊断软件通过其算法对病变部位进行自动识别，并提供明确的诊断提示，则其风险级别相对较高，则按照第三类医疗器械管理。所以，目前人们所看到的AI产品，大多应属于第三类医疗器械。


    为应对这一政策，我国大部分企业采取增删诊断功能的办法，将产品同时申报二类、三类器械。目前，多家企业已经率先获得了二类证书，雅森科技、汇医慧影、图玛深维、推想科技、深睿、Airdoc、依图科技等几个大公司都在积极进行三类医疗器械的申报。依图科技表示，其全产品矩阵都在做三类认证，Airdoc送检了中国第一台装载待检人工智能AI软件的服务器。目前尚未有一款产品获得三类证书。


    按照医疗器械注册流程，产品从申报到最终过审要经过产品定型、检测、临床试验、注册申报、技术审评、行政审批6步。目前，申报三类器械的医疗人工智能产品大多停留在注册申报起步阶段。


    目前，在工业界和医疗界正在使用的机器人只能程序化地完成一些固定的任务，这与人们想象中的“人工智能机器人”区别较大，因此不在我们的案例介绍范围中。手术机器人仍不具有自主意识，仍需要医生根据自身的经验进行判断和操作，而智能化器械^(\[1\])能够根据历史病历记录，计算出相应的解决方案，应对当前的状况。


    智能化器械按照企业类型可分为医疗器械巨头和初创企业（图2-32）。其中，医疗器械巨头以“传统器械+技术合作”的模式借助外部技术优势合作研发，初创企业以“独立研发整套设备”的方式向客户提供医疗设备和配套的软件系统。


    ![](images/64cb9678350cdc2c05c508db70dc8ca7.jpg)


    图2-32 智能化器械的两大企业类型


    相比于传统的医疗器械，智能化器械在两个方面能够大大提升医疗效率。


    （1）智能化器械能够帮助医生节省工作量。传统的医疗器械仅仅能够作为一种工具帮助医生对患者进行诊断、治疗和康复，而在人工智能等技术的帮助下，智能医疗器械可以成为医生的助手，它们能与传统器械进行融合，方便医生快速进行诊断。例如，智能化器械能筛出不需要医生进行分析的信息，让医生专注于疑难杂症的处理。


    （2）智能化器械能够提高器械使用的精准度。传统器械是独立操作，而智能化器械能够与其他设备产生广泛的联系，借用大数据的优势。例如，在利用智能化器械进行诊断时，它能够在大数据的帮助下，根据历史信息做出更加准确的判断。


