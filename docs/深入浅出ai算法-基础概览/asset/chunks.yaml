    ## 3.2.2 递归与分治


    ### 1. 递归


    简单地说，程序调用自身的编程技巧称为递归。递归（`Recursion`）的学术定义如下：一个函数、过程、概念或数学结构，如果在其定义或说明内部直接或间接地出现其本身的引用，则它们是递归的或递归定义的。


    具体而言，递归可以分为递推和回归两个阶段。问题逐层往前递进推动，这个过程叫作递推；逐一解决子问题，最后汇总为原问题，这个过程叫作回归。二者交替配合，就形成了递归。我们通过一个直观的例子感受递归的整体流程。


    某所中学的校团委为了筹集团员活动经费，计划向本校的每一位团员收取团费。该通知采取逐级传达的方式，校团委通知年级团委，然后年级团委通知班团委，最后班团委通知到班里的每一位团员。这种逐层递进传递任务的过程，就是递推过程。在任务发布后，只有在每一级的团费收集任务全部完成后，才能向上一级汇报。例如，在班里每一位团员的团费都收齐之后，班团委才能向年级团委汇报；在每个班的团费都收齐之后，年级团委才能向校团委汇报。这种在子任务全部完成之后，自下向上汇报的过程，就是回归过程。整个团费收集的过程，就是一个完整的递归过程。


    当然，有递归就有非递归。所谓非递归，就是不用层级关系来表达任务，而是将任务拉平成线性关系表达任务。因此，支持递归实现的基础算法会比非递归实现理解起来较为简单直观。举个例子，求长度为`n`的斐波那契数列各项之和。递归写法和非递归写法的代码实现分别如下。


    ![](img/074-1.jpg)


    对比发现，递归写法的程序具备结构清晰、可读性强等优点，并且递归写法比非递归写法的代码更容易实现。当然，一些问题如果使用递归算法求解，会因为重复计算的问题让算法变得低效，递归的代码抽象，容易出错且很难调试。例如，斐波那契数列求和就不适合使用递归算法求解。所以，只有当问题本身是递归定义的，或者问题涉及的数据结构是递归定义的时，递归算法才是最佳选择。经典的递归问题有八皇后问题、汉诺塔问题和全排列问题。


    ### 2. 分治


    分治（`Divide Conquer Algorithm`）就是“分而治之”的意思，实质是将原问题分成`N`个规模较小、结构与原问题相似的子问题，然后递归地求解这些子问题，最后得到原问题的解。与递归算法相比，分治算法强调的是同层级问题分别治理的过程，而递归算法强调的是不同层级问题之间的逐层递进与回归的过程。


    分治算法的思想在日常生活中随处可见。例如，某学院需要选拔一名乒乓球打得最好的学生，代表学院参加学校的乒乓球单打比赛。首先选拔出各班级的第一名，然后从各班级的第一名中选拔出各年级的第一名，最后从各年级的第一名中选拔出学院的第一名。将“选拔学院第一名”拆分成“选拔各年级的第一名”，再进一步拆分成“选拔各班级的第一名”，这个过程就是分治过程。


    因此，分治算法有两个适用条件。其一，大问题能分解成若干个独立的子问题；其二，每个子问题的求解过程都和大问题相似。这两个条件决定了分治的递归过程是受限的，需要提前知道递归过程的终止条件及每一层的逻辑，因此分治算法的应用场景不如递归算法的应用场景多。经典的分治问题包括快速排序、归并排序及地毯填补。


    ## 3.2.3 贪婪算法和动态规划


    所谓贪婪，就是只看眼前小利，不看长远收益的思想。贪婪算法是一种局部最优算法，动态规划则是一种全局最优算法。


    ### 1. 贪婪算法


    贪婪算法（`Greedy Algorithm`）是指每一步都采取当前最好或最优（最有利）的选择，从而使结果是最好或最优的算法。一个问题是否适合使用贪婪算法解决，可以根据无后效性判断。无后效性是指某个状态之后的收益，只与当前状态有关，不受之前状态的影响。通俗地讲，就是眼前的最大收益可以带来最终的最大收益。现实生活中有不少问题满足无后效性，下面以经典的贪婪问题──超级书架为例进行讲解。


    问题描述：有`N`个物品，第`i`个物品的高度为`Hi`，还有一个高度为`B`的书架，保证这些物品的高度之和大于或等于书架的高度`B`。最少从这`N`个物品中取出多少个物品，可以使取出来的物品堆起来的总高度不低于书架的高度`B`。


    每次只需选择当前剩余物品中最高的物品，直到所选物品的高度之和超过书架为止，所选物品的数量就是答案。


    ### 2. 动态规划


    动态规划（`Dynamic Programming`，`DP`）是解决多阶段最优化问题的一种算法。这个定义听起来有些令人费解，我们不妨对比贪婪算法来理解。贪婪算法认为选择当前步骤的最大收益可以带来最终的最大收益。试想，有没有这样一类问题，在当前步骤不选择最大收益，最终的收益却比贪婪算法的收益高？答案是肯定的。下面给大家介绍一个和超级书架问题类似的经典动态规划问题──背包问题。


    问题描述：一个容量为`M`的背包，现在有`N`个物品，第`i`个物品的体积为`Ni`，如何选择物品装包才能使背包的利用率最大？


    按照贪婪算法装包不一定得到最优解。例如，对于容量为 10 的背包，假设有 5 个体积依次为（6、5、3、3、2）的物品，使用贪婪算法会按从大到小的顺序装包，因此体积为
    6 和 3 的物品被选出，背包容量利用率为 90%。但是，最优的策略应该是将体积为 5、3 和 2 的物品装包，此时背包的利用率为 100%。


    那么，动态规划是如何得到上面这个解的呢？还是上面的背包问题。如果一开始只有 4 个容量分别为 2、3、5、6 的背包，那么最优的装包方式就是往 4 个背包中分别放入
    2、3、5 和 6。紧接着，加入 3 个容量分别为 7、8、9 的背包，最优的装包方式分别为，容量为 7 的背包在装入容量为 5 的背包的基础上再放入 2；容量为
    8 的背包在装入容量为 6 的背包的基础上再放入 2，或者在装入容量为 5 的背包的基础之上再放入 3；容量为 9 的背包在装入容量为 6 的背包的基础上再放入
    3。最后，一个容量为 10 的背包如何装包，显然最优方案是在装入容量为 7 的背包的基础上再装入 3，或者在装入容量为 8 的背包的基础上再装入 2，如此装包的容量利用率就达到了
    100%。这便是“多阶段最优决策”的一个完整展现。背包问题的动态规划过程如图 3-14 所示。


    ![](img/077-1.jpg)


    图 3-14　背包问题的动态规划过程


    依次循环遍历物品。第 1 轮，随着每个物品的放入，能在空背包状态下得到 4 种可放置容量，分别为 2、3、5、6。第 2 轮，在第 1 轮可放置容量的基础上，不重复放入，新增
    7、8、9 共 3 种可放置容量。第 3 轮，在第 2 轮可放置容量的基础上，不重复放入，即可装满容量为 10 的背包。


    根据上述对“多阶段最优决策”过程的图文解释可以发现，动态规划的求解过程是一个从局部计算逐步推到整体计算的过程。归纳如下：首先，得到“最小规模”的局部最优解；然后，基于“最小规模”的局部最优解，得到“次小规模”的局部最优解；以此类推，从局部到整体，即可得到全局最优解。这个过程可以用递推公式来描述。例如，背包问题的递推公式是`f(n)=f(n–c[i])`，`f(n)`表示容量为`n`的背包是否能装满，`c[i]`表示第`i`个物品的体积。这个递推公式又称为动态转移方程。背包问题的代码实现如下。


    ![](img/078-1.jpg)


    上述背包问题是最简单的一种背包问题，叫作 01 背包，即要么放要么不放，其经典变种问题有多重背包问题和完全背包问题，都可以用动态规划求解。此外，典型的动态规划问题还有导弹拦截、字符串距离和最长公共子序列等。


    ## 3.2.4 搜索


    搜索是更有组织纪律的枚举。枚举是指在一个有限范围内列举出所有可能的情况，以便找出所有解。因为枚举比较简单，所以不进行单独介绍。与枚举相比（如著名的暴力枚举法），搜索的针对性和目的性更强。搜索分为深度优先搜索和广度优先搜索，二者的侧重点不同。


    深度优先搜索（`Depth First Search`，`DFS`）又称为深度优先遍历。深度优先，顾名思义，就是每轮搜索都会从当前节点沿一条路找下去，直到每条路都走到尽头，即遍历完所有节点或满足某个条件，算法结束。图
    3-15 所示为深度优先搜索示例，起点为`A`，深度优先搜索的遍历序列为`ABDECFG`。


    ![](img/079-1.jpg)


    图 3-15　深度优先搜索示例


    宽度优先搜索（`Breadth First Search`，`BFS`）又称为“宽度优先遍历”或“广度优先遍历”。宽度优先搜索的每一轮会将距离当前节点最近的节点全部找出来，按这种方法依次找下去，直到遍历完所有节点或满足某一条件，算法结束。图
    3-16 所示为宽度优先搜索示例，`BFS`的遍历序列为`ABCDEFG`。


    ![](img/079-2.jpg)


