    ## 2.3 导数


    简单地说，导数主要用于描述函数图像中某一点切线的倾斜程度，这个倾斜程度又称为斜率。所谓连续函数，就是函数图像随着`x`值的连续变化，`y`值的变化也是连续的。连续函数不一定处处可导，可导函数的图像一定是处处连续的。


    三角函数处处连续，同时处处可导。以正弦函数`y=sin x`为例，函数图像上的每个点都是光滑的，可以计算函数图像在该点处的切线斜率，如图2-1所示。


    ![](OEBPS/Images/039-1.jpg)


    图2-1　正弦函数`y=sin x`的图像


    如图2-2所示，用线性绝对值函数`y=|x|`作为对比，可以看到该函数图像同样处处连续。但是，在坐标为(0, 0)的点的位置虽然连续，却无法计算出切线的斜率，因此该函数是不可导的。


    ![](OEBPS/Images/039-2.jpg)


    图2-2　线性绝对值函数`y=|x|`的图像


    在中学数学中，通常使用极限求解导数。在AI算法中不用那么复杂，只需掌握以下两点。第一，弄清楚导数的意义。导数是函数切线的斜率，因此可以用于表示函数值变化的快慢和趋势。例如，朝着变大的方向还是变小的方向，变大变小的速度如何，等等。第二，记住AI算法中常用的几个求导公式及导数的运算法则。下面介绍AI算法中常用的几个求导公式。


    常数求导公式如下。


    `(C)''=0`


