- raw: '要理解卷积神经网络，先理解什么是卷积。我们不妨将“卷积”一词拆开来理解，“卷”意为翻卷，可以理解为数学变换中的翻转和平移的意思；“积”可以理解为积累、相加、翻倍的意思，因此“卷积”表示一种简单的数学操作。卷积操作通常被看作加权滑动平均法![滑动平均法又称为移动平均法，可以在简单平均法的基础上，通过顺序逐期增减新旧数据求解移动平均值，从而消除偶然变动因素，找出事物发展趋势，并且据此进行预测。](OEBPS/Images/note.png)的一种推广。卷积神经网络就是运用了卷积操作的一种神经网络，运用卷积操作的神经网络层称为卷积层（Convolutional
    Layer）。卷积层由卷积核组成，卷积核的计算类似于人工神经元中y\=ωx+b的计算，只是输入不限定是一维的xi，可以是二维图像中的一个像素点xi,j，也可以是三维空间中一个物体在某一点的描述xi,j,k。每个卷积核通过学习不同的参数，可以感受局部视野，并且提取不同的局部特征。假设有一张3×3的图像，卷积核为2×2，卷积核内初始权重均为1，那么卷积操作的计算方法如图4-10所示。


    ![](OEBPS/Images/118-1.jpg)


    图4-10　卷积操作的计算方法示例


    在图4-10中，卷积操作的具体计算过程如下。


    左上：3×1+2×1+4×1+1×1=10。


    左下：4×1+1×1+7×1+9×1=21。


    右上：2×1+6×1+1×1+5×1=14。


    右下：1×1+5×1+9×1+3×1=18。


    卷积神经网络除了包含卷积层，还包含池化层（Pooling Layer）。池化分为最大池化和均值池化两种，最大池化是指每次取感受视野范围内的最大值作为输出，均值池化是指每次取感受视野范围内的平均值作为输出。池化层一般放在卷积层的后面计算，用于减少深度神经网络训练的参数数量，提高深度神经网络的训练速度和泛化能力。以最大池化为例，池化大小为2×2，图4-10中图像的池化操作计算方法如图4-11所示。


    ![](OEBPS/Images/119-1.jpg)


    图4-11　池化操作的计算方法示例


    在图4-11中，池化操作的具体计算过程如下。


    左上：max{3, 2, 4, 1}=4。


    左下：max{4, 1, 7, 9}=9。


    右上：max{2, 6, 1, 5}=6。


    右下：max{1, 5, 9, 3}=9。


    当然，卷积神经网络的网络结构除了包括卷积层和池化层，还包括神经网络都有的组成部分，即输入层、全连接层和输出层。卷积神经网络在计算机视觉和图像识别领域发挥着至关重要的作用，如著名的AlexNet网络结构（详见第7章图7-1）。AlexNet是2012年ImageNet竞赛冠军获得者Hinton和他的学生Alex
    Krizhevsky设计的。在那年之后，很多更深的卷积神经网络相继被提出，如VGGNet![由牛津大学计算机视觉组（Visual Geometry Group）与Google
    Deep Mind公司研究员一起研发。](OEBPS/Images/note.png)和GoogLeNet![2014年由在Google工作的Christian
    Szegedy提出，不叫“GoogleNet”，是为了致敬经典CNN——LeNet。](OEBPS/Images/note.png)。


    #### 4.3.4　递归神经网络


    无论是深度神经网络还是卷积神经网络，相邻的两层都是从空间维度上进行展开与衔接的。我们知道在爱因斯坦的广义相对论中，空间和时间是两个并列的维度，共同组成了所谓的“四维时空”。那么，既然存在空间维度上展开的神经网络，自然也存在时间维度上展开的神经网络，这便是本节要讲的内容。


    递归神经网络（Recursive Neural Network，RNN）又称为循环神经网络（Recurrent Neural Network），它会将一个网络结构单元的输出作为该网络结构单元在下一时刻的输入，所有神经网络层之间的衔接与串联都会在时间维度上展开。一个典型的递归神经网络结构如图4-12所示。


    ![](OEBPS/Images/120-1.jpg)


    图4-12　典型的递归神经网络结构


    在图4-12中的递归神经网络结构中，隐层除了向输出层输出信息，还会将信息传递给下一时刻的自己，即下一时刻的隐层，这样做的目的是让神经网络在时间维度上产生“记忆”。


    递归神经网络的典型应用领域为人机交互、自动翻译和文档补全等自然语言处理方面的场景。递归神经网络和深度神经网络一样，在模型训练过程中同样存在梯度消失问题，具体表现为容易“忘事”。由于递归神经网络是时间维度上展开的神经网络结构，因此递归神经网络需要升级自身模型结构，才能解决“忘事”这个难题。升级后的递归神经网络模型，叫作长短时记忆（Long-Short
    Term Memory，LSTM）模型。


    作为一种升级版的递归神经网络模型，长短时记忆模型会在时间维度上增加若干个特定的神经网络结构，用于提升记忆关键信息的能力。长短时记忆模型的网络结构如图4-13所示。


    ![](OEBPS/Images/121-1.jpg)


    图4-13　长短时记忆模型的网络结构


    在图4-13中，大长方形框住的整体称为记忆单元，实线箭头表示当前时刻的信息传递，虚线箭头表示上一时刻的信息传递。与典型的递归神经网络模型相比，长短时记忆模型一共增加了3个神经网络层，这3个神经网络层在学术上分别称为输入门（Input
    Gate）、遗忘门（Forget Gate）和输出门（Output Gate）。进入记忆单元的箭头表示输入，从记忆单元出去的箭头表示输出。


    总体而言，与普通的递归神经网络模型相比，长短时记忆模型的结构更复杂，可调整和变化的地方也更多。例如，增加peephole，将Cell![是一种网络结构。](OEBPS/Images/note.png)的状态连接到每个门。长短时记忆模型可以简化为门控循环单元（Gated
    Recurrent Unit，GRU）模型。在长短时记忆模型中加入注意力（Attention）机制，可以产生多种变种模型。长短时记忆模型在语音识别、图像识别、疾病预测等领域都发挥着惊人的作用，是当下最流行的神经网络模型之一。


    #### 4.3.5　图神经网络


    图神经网络（Graph Neural Network，GNN）是一种基于关系建模的神经网络。在讲解图神经网络之前，我们先回顾一下什么是图。根据第3章内容可知，图由顶点和边两部分组成。边可以分为有向边与无向边，包含有向边的图称为有向图，不含有向边的图称为无向图。图结构在现实生活中是广泛存在的，网站之间的超链接引用关系、社交网络中的朋友关系、学术界论文之间的引用关系都可以用图结构表示。基于图结构的研究课题有很多。例如，在社交网络的图结构中，将用户作为节点，将用户之间的朋友关系作为边，通过分析社交网络图结构中的信息，可以对图结构中的节点（用户）使用监督学习中的分类算法进行学习，进而对用户的兴趣、转发文章、评论等社交行为进行深入分析和预测。


    与深度神经网络和递归神经网络不同，图神经网络由多层明确的神经网络层构成。图神经网络是一种直接运行在图结构上的神经网络。针对节点分类问题的图神经网络，其神经网络层聚合的信息不仅包括节点本身的特征，还包括与该节点相邻的边和节点的特征。考虑到相邻节点的位置、距离，在进行特征聚合时可以分为一度邻居、二度邻居和多度邻居。一个常规的图神经网络结构如图4-14所示。


    ![](OEBPS/Images/123-1.jpg)


    图4-14　常规的图神经网络结构


    图神经网络一般不直接用于进行分类或回归，通常将其作为图的一种表征学习融入其他模型的特征输入中。图的表征学习是指将图中的各种信息映射成一个N维特征向量，这种映射关系在机器学习中称为特征嵌入（Feature
    Embedding）。图中各种信息的嵌入统称为图嵌入（Graph Embedding）。图嵌入最常见的用法有两种，分别为点嵌入（Node Embedding）和边嵌入（Edge
    Embedding）。如果输出信息是节点，则输出点嵌入的特征向量；如果输出信息是边，则输出边嵌入的特征向量。输出节点信息的应用比较常见。例如，从聊天网络和电商网络中识别出欺诈用户，从终端设备网络中识别出欺诈设备，等等。为了方便展示，图4-14中只用箭头标记了节点的输出信号，未标记边的输出信号。


    经过各种嵌入后的特征向量可以和其他特征拼接使用，也可以直接输入神经网络的全连接层，继续加入模型进行学习。除了点嵌入和边嵌入，还有整图嵌入（Whole-Graph
    Embedding），这种用法在化学分子结构、蛋白质结构的分析探索中有较广泛的应用。


    ### 4.4　决策树


    无论是回归模型，还是神经网络模型，都要通过纯数学变换和层层公式计算来获得期望的结果，解决问题的过程都不够人性化，让人难以直观理解。尤其是深度神经网络，即使最后的分类或回归效果可以做到极致，对于隐层在训练过程中发生了什么，模型到底是如何一步一步逼近最优效果的，到目前为止，业界也没有一个很好的答案，这就是模型可解释性问题。在深度神经网络发挥作用的场景中，深度神经网络模型的可解释性问题通常是用户最困惑、最担忧的问题之一。例如，随着时间的推移，模型的预测能力下降，从模型结构层面很难给出令人信服的理由。


    本节介绍机器学习算法中可解释性最强的模型之一——决策树（Decision Tree）。近几年已经有学者研究如何利用决策树的性质解决深度神经网络模型的可解释性问题。


    #### 4.4.1　概念与方法


    决策树是一种树形分类和回归模型，每个非叶子节点都相当于一个IF![IF即如果，是编程语言中的一种基本条件判断语句。](OEBPS/Images/note.png)条件判断语句，模型通过逐个判定特征所属类别，对样本逐步进行分类。决策树模型不仅可解释性强，解决问题的角度也趋近于人类看待问题和理解问题的视角，比较简单、直观。下面通过一个例子，初步讲解决策树的工作原理。有10条关于西瓜的样本数据，如表4-1所示，我们要根据这些数据学习如何判断一个西瓜是否为好瓜。


    表4-1　西瓜样本数据集


    ![](OEBPS/Images/125-1.jpg)


    在表4-1中，西瓜有3种特征，分别为色泽、敲声、纹理。决策树会以某种顺序依次考查西瓜的每个特征，逐层缩小范围，从而判定这个西瓜是否为好瓜。由于树结构具有层次关系，并且决策树采用自上而下的建树模式，因此特征考查的顺序直接决定了最终分类的效果。根据顺序（色泽→敲声→纹理）构建决策树模型A，如图4-15所示。


    ![](OEBPS/Images/125-2.jpg)


    图4-15　决策树模型A


    然后根据顺序（敲声→色泽→纹理）构建决策树模型B，如图4-16所示。


    ![](OEBPS/Images/126-1.jpg)


    图4-16　决策树模型B


    对比决策树模型A和决策树模型B可知，不同的特征考查顺序的确会影响决策树的最终分类效果。那么，如何设置特征考查顺序，才能得到分类效果较好的决策树呢？这涉及信息论中的一个概念——信息增益（Information
    Divergence）。说到信息增益，不得不先介绍熵（Entropy）。熵在信息论中衡量的是数据的混乱程度，本质是香农![克劳德·艾尔伍德·香农（Claude
    Elwood Shannon，1916—2001），美国数学家、信息论的创始人。提出了衡量信息量的公式，即香农公式。](OEBPS/Images/note.png)信息量（p·log(1/p)，0<p≤1）的期望。信息量是可以衡量的，不然我们也不会觉得有时候说的话虽然多，却没什么信息量，而有的话却能一语中的。信息增益作为设置决策树特征考查顺序的依据，可以直观理解为，在按照当前设置的特征考查顺序划分数据集后，如果可以最大程度减少数据的混乱程度，那么该特征考查顺序是好的特征考查顺序。


    不妨举个例子，一个全是好瓜的数据集信息量为


    \-log1= 0


    此时该数据集的混乱程度达到最低，因为不用判断就知道里面全是好瓜；而对于一个一半是好瓜一半不是好瓜的数据集，信息量为


    ![](OEBPS/Images/127-1.jpg)


    假设存在某个特征恰好能区分是否为好瓜，那么用这个特征划分这个数据集之后的信息增益计算方法为


    ![](OEBPS/Images/127-2.jpg)


    ID3 算法每次选择最大信息增益的特征作为父节点，向下扩展决策树，直到不能继续扩展为止。


    在计算信息增益时，我们发现，当属性取值较多时，其信息增益往往偏高。在极端情况下，如每个属性值只对应一个样本，信息增益必然等于最大值1。显然，这样的决策树泛化能力![泛化能力是指机器学习算法对新样本的判断能力。](OEBPS/Images/note.png)是最弱的。因此，C4.5
    算法应运而生，该算法使用信息增益率的概念（信息增益率等于信息增益除以数据集中该特征的总信息量），大致思路如下：先选出信息增益高于平均水平的特征，再从中选择信息增益率高的特征，用于当前分裂。此外，还有一种CART算法，使用基尼指数选择特征，也能增强决策树的泛化能力。


    #### 4.4.2　剪枝


    在决策树变复杂之后，由于判断分支过多，因此训练集中的某部分样本特征被当作所有样本的一般性质，就出现了过拟合![相反的问题称为欠拟合（Under fitting）问题。例如，模型只认识白天鹅，不认识黑天鹅，是过拟合；模型将鸭子误认成天鹅，就是欠拟合。](OEBPS/Images/note.png)（Over
    fitting）问题。决策树解决过拟合问题的主要方法是剪枝。剪枝分为预剪枝和后剪枝两种。


    1\. 预剪枝


    节点依据信息增益和增益率扩展子节点，在这个过程中，验证集的整体准确率会随着节点的分裂增加发生变化。如果某个节点的扩展导致验证集的分类准确率降低，则舍弃该节点，这便是预剪枝。预剪枝不仅能降低过拟合风险，还能大大降低决策树的建树时间复杂度。但是，预剪枝由于使用贪婪算法决定是否对当前节点进行分裂，因此不能权衡决策树的全局利弊，并且会给最终模型带来欠拟合风险。


    2\. 后剪枝


    后剪枝是一种全局优化方法。在决策树的建树过程全部完成后，后剪枝从下往上依次考查各个非叶子节点，考查方法和预剪枝一样，如果某个节点的扩展在验证集上并未提高准确率，则舍弃该节点。后剪枝既降低了过拟合风险，又降低了欠拟合风险。但是，由于后剪枝是在生成完整决策树之后进行的，因此模型训练的整体时间复杂度会比较高。


    #### 4.4.3　梯度提升决策树


    由于决策树简单有效，可解释性强，因此可以将其包装成一些更高效的机器学习算法，如梯度提升决策树和随机森林。梯度提升决策树和随机森林之间的关系类似于串行和并行之间的关系，本节我们先讲解梯度提升决策树。


    梯度提升决策树（Gradient Boosting Decision Tree，GBDT）是一个与梯度有关、对决策树进行提升的机器学习模型。梯度提升决策树可以是分类树，也可以是回归树。我们不妨从后往前依次分解DT、B、G这几个定语，逐步理解GBDT的精髓。


    DT（Decision Tree，决策树）。决策树分为分类树和回归树两种。回归树与分类树的原理机制相似，区别在于分类树只在叶子节点返回唯一分类，而回归树的每个节点都能返回一个回归值，通常为当前节点内所有样本的平均值。


    B（Boosting，提升）。提升是指在原来模型的基础上做进一步的效果提升，提升决策树（BDT）的基本思路是采用多棵决策树串行建模。具体过程为，对于第一棵树之后的每一棵决策树，都基于前一棵决策树的预测结果进行二次建模，在这样串行建模的过程中，逐步修正预测结果，从而得到最优解。


    G（Gradient，梯度）。梯度的大小反映了当前预测值与目标值之间的距离或差异。因此，在上述的串行建模过程中，除了第一棵决策树使用原始样本数据进行训练外，之后的每一棵决策树都使用前一棵决策树的预测值（平均值）与实际值之差（负梯度，可以理解为残差或增量）进行建树。这相当于对分错的样本有针对性地继续分类，使样本的总体残差趋近于0。由于除第一棵决策树外的其他决策树都会对目标的残差或增量进行建模预测，因此梯度提升决策树模型需要将串行建树过程中每一棵决策树的输出结果相加，才能得到最终的预测输出结果。下面通过一个经典例子“预测年龄”来讲解梯度提升决策树的具体工作过程。假设有4个样本，其特征描述分别如下。


    • 样本A，消费较高、经常被学弟问问题，27岁。


    • 样本B，消费较高、经常问学长问题，23岁。


    • 样本C，消费较低、经常被学弟问问题，17岁。


    • 样本D，消费较低、经常问学长问题，13岁。


    梯度提升决策树串行建模的过程如图4-17所示。


    ![](OEBPS/Images/130-1.jpg)


    图4-17　梯度提升决策树串行建模的过程


    在图4-17中，梯度提升决策树模型对各个样本的预测结果，即每棵树预测结果的和。A的年龄为27（25+2）岁，B的年龄为23（25-2）岁，C的年龄17（15+2）岁，D的年龄为13（15-2）岁。


    梯度提升决策树的核心思想概括如下：串行训练n（n > 2）棵决策树，其中第i（1<i≤n）棵决策树学习第i\-1棵决策树的负梯度（可理解为残差或增量），将n棵决策树的输出结果累加作为最终输出结果。


    #### 4.4.4　随机森林


    随机森林（Random Forests，RF）是指由多棵决策树组成的决策树森林。组成随机森林的决策树既可以是分类树，又可以是回归树。与梯度提升决策树模型相比，随机森林模型的原理更直观、简洁，性能也更强悍。随机森林算法的核心思路有两个：采样和完全分裂。采样分为行采样和列采样，这里的行与列对应的是样本与特征两个维度。完全分裂是指决策树在每一次分裂扩展节点时，如果能分裂，就必须分裂，分裂依据可以是信息增益或信息增益率。


    对于行采样，模型从M条数据中随机采样m条数据，分别作为每一棵决策树的训练集。在一般情况下，m为M的算术平方根。行采样保证了每棵决策树使用的训练集各不相同，这在一定程度上抑制了过拟合问题。


    对于列采样，每一棵决策树都从M个特征中随机挑选m个特征作为节点分裂特征来计算。在一般情况下，m为M的算术平方根。列采样分为两种方式，一种是全局列采样，即同一棵树的建树过程均采用同一批采样的特征；另一种是局部列采样，即每一次节点分裂均单独随机挑选m个特征进行分裂。与行采样相比，列采样进一步保证了随机森林不会出现过拟合的问题。


    随机森林采用并行建模方式，最终的模型预测结果由每一棵决策树的预测结果共同决定。如果是分类树，则通过投票产生最终分类；如果是回归树，则计算所有结果的平均值。


    随机森林和梯度提升决策树都属于集成学习（Ensemble Learning）的范畴。集成学习是指包含多个子模型共同建模的机器学习算法。“三个臭皮匠，顶个诸葛亮”，这便是集成学习算法的精髓。


    ### 4.5　聚类'
