    ### 6.4.4　模型训练


    有了可以直接“喂”给模型的特征数据和标签数据，下一步就是搭建模型和算法调参。使用开源算法库`sklearn`提供的逻辑回归模型搭建模型并完成模型训练，并且输出模型在测试集上的预测准确率和`AUC`指标，具体代码如下。


