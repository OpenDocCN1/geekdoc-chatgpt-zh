    ### 6.4.3　特征工程


    特征工程与数据分析是密不可分的，6.4.2 节中的分箱操作就属于特征工程范畴。5.2.3 节讲到的独热编码是特征工程中最常用的方法之一，下面以独热编码为例，将原始特征数据转换成可以直接用于模型训练的特征数据。


    关于独热编码的实现，`Pandas`库提供了一个强大的方法`get_dummies`，它能自动将数据集中的非连续型特征逐个转换成独热编码。直接调用这个方法并输出新的特征列名，然后抽样观察具体的特征值，具体代码如下。


