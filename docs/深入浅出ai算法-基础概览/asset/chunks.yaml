    7\. 高斯分布


    高斯分布即正态分布，是生活中出现频率很高的一种概率分布，如一所学校所有学生的身高和体重、某一科考试的分数都服从高斯分布。虽然称为高斯分布，但并不是数学家高斯提出的。其实早在高斯之前就有正态分布了，只是高斯率先将正态分布应用于天文学研究，他的研究对后世影响较大，因此称为高斯分布。高斯分布的概率密度函数如下。


