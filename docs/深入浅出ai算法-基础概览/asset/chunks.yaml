    ## 计数排序与桶排序


    计数排序的最大问题是随着待排序列值域的扩大，空间复杂度也随之增加。桶排序（`Bucket Sort`）是计数排序的进化版本，它不是一对一的下标映射，而是通过一个映射函数，一对多地将大小接近的数存储于一个桶中，然后对每个桶中的序列进行排序。如果每个桶中排序的时间复杂度为`O(NlogN)`，那么桶排序的时间复杂度为`∑O(NilogNi)`。


    ### 9. 基数排序


    计数排序和桶排序都较难解决混合数据的排序问题，如字符串之间的排序。基数排序（`Radix Sort`）是桶排序的升级版，其基本思路是从待排元素的低位到高位每轮都按位分桶，按位比较元素值的大小，摆脱了数据类型的限定。基数排序的时间复杂度为`O(dN)`，其中`d`是最大位数。


    在实际使用过程中，除了时间复杂度，有时还需要考虑排序算法的稳定性。排序算法的稳定性是指在排序过程中是否会改变任意两个相等元素的前后顺序。一个排序算法如果不改变任意两个相等元素的前后顺序，则是稳定的排序，否则是不稳定的排序。


