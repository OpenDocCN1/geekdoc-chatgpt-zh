    # 第3章 算法之招式


    在《倚天屠龙记》中，九阳神功是上乘的内功心法。但如果张无忌只学会九阳神功，不会后面的乾坤大挪移等武功，充其量只能做到神功护体，而不能与人争锋。算法世界同样如此，即使数学学得再好，在算法世界中没有合适的运用场景，亦是徒劳。本章要讲解的就是算法世界中以数学为内力驱动的招式。反之，如果AI相关从业者的数学基础较差，就很难将这些招式运用自如，在学习后续算法的武功秘籍时也会比较吃力。


    在解决实际问题的过程中，我们往往会遇到这样的问题：算法过程中的数据如何存储？用什么结构存储效率更高？数据有什么高效的查询和排序方法？某些特定问题是否有相应的算法可以将其巧妙地解决？如何衡量算法运行需要耗费的运算时间和存储空间？相信读者在学完本章的算法招式后，可以找到这些问题的答案。所谓算法招式，其实就是数据结构和基础算法（为了和机器学习算法区分开，本章讲解的算法统称为基础算法）。本章根据数据结构和基础算法之间相辅相成的关系，先讲解数据结构的相关知识，再讲解常用的基础算法。按照从易到难的顺序，尽量采用通俗易懂的语言，帮助读者修炼好算法世界的招式。


    ## 3.1 数据结构


    如果数据结构是土壤，基础算法就是从这片土壤中生长出来的一株株植物。


    ### 3.1.1 数组与链表


    数组与链表是最简单的两种数据结构。在不同的场景应用中，二者各有所长，在性能表现方面各有优缺点。


    1\. 数组


    数组（`Array`）是一种顺序存储结构，其中的数据元素是采用相邻连续分配的方式存储的。由于是连续存储，因此只要知道某个元素在数组中的编号（下标）及数组的起始位置，相加计算偏移就能访问这个元素的值。数组按空间维度划分，可以分为一维数组、二维数组、多维数组，一维数组的存储图例如图3-1所示。


    ![](OEBPS/Images/056-1.jpg)


    图3-1　一维数组的存储图例


    上述描述或许比较抽象，下面我们以电影院选座位为例进行说明。小王、小李和小张一起去电影院看电影，在买票选座位时希望选择同一排的连号座位，这种座位分配方式就是一维数组的存储方式。假设小王、小李和小张按从左至右的顺序依次入座，编号分别为0、1、2。由于3个人挨着坐，因此只需知道最左边小王的座位号，通过对编号进行相加，就能知道另外两个人的座位号了。其实，一个影厅的座位可以理解成由一维数组（每一排）组成的二维数组，所谓的“几排几号”其实就是二维数组的索引方式。如果影厅有多层，就可以理解为三维数组，座位索引就是“几层几排几号”。


    数组的这种分配方式存在一个很明显的问题，就是在插入新元素时，即使相邻存储空间足够，也需要从插入位置整体向后移动各元素；而在相邻存储空间不够时，需要在其他空余位置申请存储空间，由于不在同一个连续的存储区域，因此新元素的添加和查询会比较慢。对于这个问题，一种最直观的解决方法是从一开始就分配足够的数组空间。这种方法存在如下两个缺点：


    • 额外申请的存储空间可能永远用不上，在申请占用后无法给别的程序使用。

    • 无法保证分配足够的数组空间，因为总会有不够用的时候。


    针对这两个缺点，另一种数据结构形式——链表便出现了。


