    3\. 二项分布


    顾名思义，二项分布就是取值只有正、负两种结果的概率分布，因此其随机变量只能是离散型随机变量。用数学语言描述就是，关于`n`个独立的二值实验中有多少次为正的离散型概率分布。


    二项分布最典型的例子是抛硬币实验，抛`n`次硬币，`k`次正面朝上的概率对应的数学期望如下。


