    根据行向量与列向量相乘的例子可知，使运算成立的一个隐含条件是，行向量的列数必须与列向量的行数相等，如例子中的向量长度均为`n`，这有助于理解后面的矩阵运算（向量是一种特殊的矩阵）。列向量的列数与行向量的行数都等于1。一个列向量与一个行向量相乘，即可得到一个矩阵，具体计算方法如下。


    ![](OEBPS/Images/034-1.jpg)


    在机器学习中，向量通常用于表示特定维度空间中不同维度的特征值，因此又称为特征向量。例如，一个二维特征向量`[1, 2]`表示两个特征，第一个特征维度的值为1，第二个特征维度的值为2。既然是空间，那就存在距离的概念，即同一个特征空间中不同特征向量之间存在着某种关系，如相似的特征表现。假设有另一个二维特征向量`[2,
    4]`，其在两个特征维度上的值分别为2和4，可以发现，这个二维特征向量和前面的二维特征向量，在各个维度上的特征值大小恰好相差一倍，这说明二者的特征表现相似，只是程度不同。当然，在实际算法工程中，特征向量之间的关系会有更复杂的度量方式，如相似度、相关系数等。


    矩阵运算和向量运算的运算法则类似。标量与矩阵的加法、减法、乘法，只需将标量与向量的每一个值分别相加、相减、相乘，得到的结果仍是矩阵。以标量与矩阵的乘法为例，计算方法如下。


    ![](OEBPS/Images/034-2.jpg)


    矩阵与向量之间只有乘法。如果矩阵与行向量相乘，那么行向量的列数必须与矩阵的行数相等，并且行向量必须位于乘号的左边，计算方法如下。


    ![](OEBPS/Images/035-1.jpg)


    如果矩阵与列向量相乘，那么列向量的行数必须与矩阵的列数相等，并且列向量必须位于乘号的右边，计算方法如下。


    ![](OEBPS/Images/035-2.jpg)


    矩阵与矩阵相乘，乘号左边矩阵的列数必须与乘号右边矩阵的行数相等，计算方法如下。


    ![](OEBPS/Images/035-3.jpg)


    假设`A`、`B`、`C`表示矩阵。


    矩阵之间的加法满足交换律，计算公式如下。


    ![](OEBPS/Images/035-4.jpg)


    矩阵之间的乘法满足结合律，计算公式如下。


    ![](OEBPS/Images/036-1.jpg)


    在线性代数中，关于向量和矩阵的知识点还有很多，包括单位矩阵、对角矩阵、对称矩阵等，这些知识点在`PCA`降维、协同过滤和矩阵分解等算法中都有所运用，下文只对这些概念进行简单介绍，感兴趣的读者可以自行深入拓展学习。


    单位矩阵是一个方阵，这个方阵从左上角到右下角的对角线（称为主对角线）上的元素均为1，其他元素均为0，示例如下。


    ![](OEBPS/Images/036-2.jpg)


    对角矩阵也是一个方阵，这个方阵除主对角线上的元素外，其他元素均为0，主对角线上的元素可以不为1，示例如下。由此可知，单位矩阵属于对角矩阵。


    ![](OEBPS/Images/036-3.jpg)


    对称矩阵也是一个方阵，这个方阵只需满足以主对角线为对称轴，两边对称位置的元素相等，示例如下。由此可知，单位矩阵和对角矩阵都属于对称矩阵。


    ![](OEBPS/Images/036-4.jpg)


    ## 2.2 排列组合

    大部分读者应该对排列组合比较熟悉，因为它在高中的数学课上出现过。与解析几何相比，排列组合的公式简单，并且理解起来比较容易、直观。


    排列组合包含两个概念：排列和组合。举个例子，假设某小组一共有5个人，有以下两个问题。


    ① 从该小组中选出3个人站成一排，一共有多少种排法？

    ② 从该小组中选出3个人打扫卫生，一共有多少种选法？


    对比问题①和问题②可以发现，问题①需要考虑顺序，问题②不需要考虑顺序。这便是排列与组合的区别。问题①要计算排列种类数，排列用字母`P`（Permutation）或`A`（Arrangement）表示；问题②要计算组合种类数，组合用字母`C`（Combination）表示。在计算时，组合种类可以看作排列种类的子集。


    可以用形式化的语言描述排列问题，即`n`个人中计算`m`个人的排列。继续思考前面的例子，如果要从5个人中选3个人站成一排，那么应该如何选择并排列？首先，从5个人中选择1个人站在位置1上，有5种选法；然后从剩下的4个人中选择1个人站在位置2上，共有4种选法；最后从剩下的3个人中选出1个人站在位置3上，一共有3种选法；因此共有60（5×4×3）种排列方法。这种计算方法就是阶乘。使用字母`A`表示排列，具体计算公式如下。


    ![](OEBPS/Images/037-1.jpg)


    由于组合不用考虑选出来的人的排列顺序，因此，只需用计算出来的排列方法总数除以选出人数的排列方法总数。所有排列方法叫作全排列，`n`个人的全排列总数等于`n`的阶乘。对于前面的例子，组合方法总数就是10（60
    / 3!）种。使用字母`C`表示组合，具体计算公式如下。


    ![](OEBPS/Images/038-1.jpg)


    在AI算法中，排列组合主要用于计算特征组合（交叉）后的特征总数。


    ## 2.3 高等数学

    看到这节，你可能会问：搞AI算法还需要学习高等数学？大家知道，高等数学涵盖的知识点比较多，并且比较难以理解。别担心，本书只讲解高等数学中与AI算法最相关的两个知识点——导数和梯度。这两个知识点在AI算法的公式推导中至关重要，有助于帮助我们理解算法模型在实际应用中起作用的原因。


    ### 2.3.1 导数

    '
