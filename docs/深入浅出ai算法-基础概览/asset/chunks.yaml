    2`的升级版本，而且`Python`官方建议初学者直接学习`Python 3`，`Python 2`也只维护到了 2020 年，因此本书使用`Python
    3`作为编程语言。`Python 3`可以安装在大部分已知的操作系统平台上，包括当下主流的 3 种操作系统`Windows`、`macOS`和`Linux`。


