    ## 2.7 本章小结


    本章首先讲解了线性代数中的向量和矩阵，这两个概念对 AI 算法而言是最基本的数据承载体。然后讲解了与 AI 算法有关的排列组合及高等数学中的几个知识点。紧接着详细讲解了概率与统计。如果
    AI 算法从业者对数据具备良好的概率与统计素养，那么在解决实际问题时，会将模型运用得更深刻、全面。最后简单讲解了什么是最优化原理。


    本章内容都是与算法有关的数学基础知识，在语言描述上难免会有些晦涩。考虑到 AI 算法中数学知识的实际使用概率，以及本书希望面向的广大受众，本章只讲解了相关数学基础知识最核心的知识点，章节末尾的动脑时刻也尽量避免了生僻的数学公式。这样做的目的只有一个，就是让读者尽可能快地学习算法世界中的数学知识，以便在后面可以快速进入算法工程的实战中。


