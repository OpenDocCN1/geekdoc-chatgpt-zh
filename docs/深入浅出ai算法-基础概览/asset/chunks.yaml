    ## 7.2 Model-free 与 Model-based


    `Model-free`算法可以分为两类：策略最优化（`Policy Optimization`）类型的算法和基于 Q 学习（`Q-Learning`）的算法。按照流派划分，策略最优化类型的算法应该归为`Policy-based`流派，基于
    Q 学习的算法应该归为`Value-based`流派。其中策略最优化类型的算法有`PG`算法、`A3C`（`Asynchronous Advantage Actor-Critic`）算法、`PPO`（`Proximal
    Policy Optimization`）算法和`TRPO`（`Trust Region Policy Optimization`）算法等，基于 Q 学习的算法有`DQN`算法、`Double
    DQN`算法和`Dueling DQN`算法等。将策略最优化类型的算法和基于 Q 学习的算法相结合，比较有名的算法有`DDPG`（`Deep Deterministic
    Policy Gradient`）算法和`TD3`（`Twin Delayed Deep Deterministic Policy Gradient`）算法等。


    `Model-based`算法包括大家耳熟能详的围棋顶尖人工智能算法，如`AlphaGo`和`AlphaGo Zero`等。`AlphaGo`系列的围棋 AI
    对整个围棋棋盘进行了建模，下棋规则对模型而言也是透明的，因此模型在进行任何一步之前都能通过蒙特卡罗树搜索近似地估算出奖励信号，即最终的输赢概率。下一节我们将详细讲解`AlphaGo`这个`Model-based`算法模型。


    总之，区别一个强化学习算法模型是`Model-free`类型的还是`Model-based`类型的一个简单方法如下：如果一个算法模型能预测出下一步的环境状态及下一步的奖励信号，那么这个算法模型是`Model-based`类型的，否则是`Model-free`类型的。


    ### 7.2.3 经典案例：AlphaGo


    本节会以`AlphaGo`为例，讲解强化学习的作用。网上其实已经有很多介绍`AlphaGo`背后技术的文章，但大部分文章一上来就将`AlphaGo`分成策略网络（`Policy
    Network`）和价值网络（`Value Network`）两部分来讲解，未免过于抽象和笼统。本节会从技术角度为大家剖析初版`AlphaGo`的内部机制。


    不妨掀开`AlphaGo`的神秘外衣，它其实是一个机器学习算法项目，至少包含三个模块：特征提取、模型训练和模型预测。下面我们从这三个方面展开，讲解这个“神秘的”机器学习算法项目。


    #### 1. 特征提取


    对围棋数据来说，特征提取是指将每一步下棋状态数值化、结构化。`AlphaGo`所用的原始围棋数据取自`KGS`围棋服务器中 6～9 段的对局，共 16 万盘、近
    3000 万步走棋。根据不同子模型的需求，`AlphaGo`项目组从这些原始棋局中一共提取了两份特征数据。


    首先，我们不难想到最直观的棋盘特征，就是落子情况。围棋棋盘大小为`19×19`，如图 7-3 所示，每个位置的可能落子情况有三种：黑子、白子或留白。因此，一个样本的落子特征数据就是
    3 个`19×19`的矩阵，每个矩阵分别描述棋盘上的一种落子情况。


    ![](img/225-1.jpg)


    图 7-3　围棋棋盘


    除了落子情况，当前棋盘本身的状态也可以提取出许多特征，如当前执黑棋还是执白棋、每个落子所在位置经过的轮次、落子后预计吞子数目及落子是否合法等。以“每个落子所在位置经过的轮次”特征为例，一个
    8 位的二进制数足以表示任意一方在整盘棋中所下的轮数，因此该特征可以用`28`个`19×19`的矩阵表示。落子情况的特征矩阵形式如图 7-4 所示，其他特征以此类推。


    ![](img/226-1.jpg)


    图 7-4　落子情况的特征矩阵形式


    加上落子情况，`AlphaGo`一共提取了`48`种特征，构成一个`19×19×48`的特征空间。为了方便后文叙述，先将这份特征数据集命名为`SetA`。`SetA`相当于一份图片数据集，作为卷积神经网络的输入。除了图片数据集，`AlphaGo`还根据围棋的领域知识提取了另一份数据集，“喂”给`Softmax`回归网络的局部特征。我们将这份特征数据集命名为`SetB`。`SetB`主要用于实现快速走棋，为后面的蒙特卡罗树搜索（`MCTS`）做准备。对于这些局部特征，`AlphaGo`论文中只提供了数目统计，并未给出这些特征的具体提取方法，论文给出的特征数目统计如图
    7-5 所示。


    ![](img/226-2.jpg)


    图 7-5　特征数目统计


    #### 2. 模型训练


    `AlphaGo`的子模型一共有 4 个：卷积策略网络、增强策略网络、`Softmax`回归网络和卷积价值网络。下面逐一讲解这 4 个网络结构及其训练过程。


    ##### 1）卷积策略网络


    这里有必要先铺垫几句，自`Hinton`在 2006 年重新掀起深度学习的浪潮以来，伴随着计算机硬件技术的迅猛发展，作为深度学习代表之一的卷积神经网络，在算法界可谓无人不知、无人不晓。卷积神经网络擅长解决图像识别和图片分类的相关问题，因此`DeepMind`团队选择了卷积神经网络来训练`AlphaGo`的
    base 模型。`AlphaGo`的卷积策略网络模型的网络结构如图 7-6 所示。


    ![](img/227-1.jpg)


    图 7-6　`AlphaGo`的卷积策略网络模型的网络结构


    输入数据集为`setA`，卷积策略网络共有`13`个卷积层，`1`个`Softmax`全连接层。`Stride`为步长，`Pad`表示边界补 0 个数。其中第
    1 个卷积层使用 192 个`5×5`的卷积核，在`Pad`为 2 的情况下同尺寸`ReLU`输出；第 2～12 个卷积层均使用`3×3`的卷积核同尺寸`ReLU`输出；第
    13 个卷积层使用`1×1`的单元核进行了一次线性加权求和，最后对接到一个`Softmax`全连接层，预测输出下一步落子位置的可能性。这个卷积策略网络能达到的
    AI 围棋水平已经很高了，起码它已经学会了大部分人类高手的下棋方法。但这对`AlphaGo`来说还远远不够。


    ##### 2）增强策略网络


    如果说卷积策略网络是一个学习他人、超越他人的阶段，那么增强策略网络就是一个自我学习、超越自我的阶段，其背后就是强化学习。如前文所说，强化学习是一种通过不断地自我试错，从而找到最佳策略并加以激励的机器学习算法。以下围棋为例，两个完全不会下棋的人，一开始都随机落子，直到一方获胜。获胜的一方根据走法来优化自己的落子策略，然后两人继续不停地下棋、优化、下棋，重复这样的过程，直到满足某个条件。最终，不会下棋的人也能知道哪一步是好棋，哪一步是坏棋。这就是增强学习的一种通俗解释。


    增强策略网络使用强化学习进行训练，这里不是随机落子，而是使用卷积策略网络这个基础 AI 进行落子。具体方法是先复制一份卷积策略网络参数给增强策略网络进行初始化，最终输赢标签定为和棋为`0`、赢棋为`1`、输棋为`-1`，然后用增强策略网络反复和自己对弈，根据输赢结果反向传播更新网络参数。在经过若干次迭代后，更新一份参数至对手网络，在满足一定的条件后结束。单凭该网络的下棋水准就已经达到了`KGS`的
    3d 水平。不过，`AlphaGo`并没有在最后的系统中使用这个增强策略网络，理由是增强策略网络的走棋风格缺乏变化，对后面的蒙特卡罗树搜索不利。


    ##### 3）Softmax 回归网络


    大家或许会问，上面已经有了一个很强的走棋网络，为什么还需要一个`Softmax`回归网络来走棋呢？笔者认为有如下两个原因。


    • `Softmax`回归网络结构只有一个隐层，与卷积策略网络的`13`层结构相比，其落子的速度要快得多，根本不在一个数量级上，并且准确率很高，而后面要讲的蒙特卡罗树搜索算法对搜索时间的要求很高，卷积策略网络无法满足要求。


    • `Softmax`回归网络的数据集是`setB`，与`setA`处于完全不同的特征空间，因此能提高走棋策略的多样性，增加不同落子情况的可能性。事实证明，用`Softmax`回归网络单独落子，也可以达到`KGS`的
    3d 水平。


    ##### 4）卷积价值网络


    这是`AlphaGo`的又一个厉害之处。也就是说，`AlphaGo`不仅有高效的落子方案，还会使用卷积价值网络评估当前棋局的获胜概率，从而双重保证当前的落子方案是最优方案。卷积价值网络的算法思路如下：随机棋局中的轮次为`T`，棋局的第
    1～`T-1`轮落子方案由卷积策略网络生成；然后第`T`轮采用随机落子方案，第`T+1`轮到该局结束使用增强策略网络生成落子方案；最后计算输赢结果，赢棋为`1`，输棋为`0`，用反向传播误差调整网络参数。卷积价值网络的结构如图
    7-7 所示。


    ![](img/229-1.jpg)


    图 7-7　卷积价值网络的结构


    根据图 7-7 可知，输出层将`Softmax`全连接层替换成了`256`个全连接层和`1`个`Tanh`激活层，其他层的结构与卷积策略网络一模一样。需要注意的是，这里的输入数据集全部是由卷积策略网络和增强策略网络共同生成的。而且为了避免在相同对局下，输入不同但结局相同所带来的过拟合现象，每轮对局只会取一个样本进行训练，这也是单独采集近
    3000 万个对局样本作为训练集的原因。


    #### 3. 模型预测


    打造好了上述四件“兵器”──卷积策略网络、增强策略网络、`Softmax`回归网络和卷积价值网络，`AlphaGo`“披挂上阵”。它走进了人类顶级围棋道场，与顶级棋手进行较量，采用的战术策略就是前面提到的蒙特卡罗树搜索算法，其示意图如图
    7-8 所示。


    ![](img/230-1.jpg)


    图 7-8　蒙特卡罗树搜索算法示意图


    蒙特卡罗树搜索算法的基本思路如下：多次模拟未来棋局，然后选择模拟次数最多的落子方案作为当前走棋方案。


    具体步骤如下：首先，使用卷积策略网络生成未来`T`轮的落子方案；然后，使用卷积价值网络评估该落子方案的胜率，使用`Softmax`回归网络基于该落子方案继续快速走棋，直至棋局结束得到输赢结果，综合两个结果算出这`T`轮落子方案的胜率；接着，结合该胜率，使用卷积策略网络重新生成未来`T`轮的落子方案，如果出现相同走棋方法，则胜率取平均值；最后，循环上述过程若干次，选择模拟次数最多、胜率最高的落子方案作为当前走棋方案。


    如果单纯将`AlphaGo`分成策略网络和价值网络，那么策略网络指的是上面所说的卷积策略网络，而价值网络则是卷积价值网络与`Softmax`回归网络的结合。其中，策略网络负责计算当前的落子位置，价值网络则负责评估落子该位置的最终胜率，蒙特卡罗树搜索算法则利用这两个结果进行搜索，给出最终的落子方案。


    对战柯洁的`AlphaGo Master`版本要胜过战胜李世石的版本，与柯洁对战三局下来也没有出现像对战李世石第四局那样因“昏招”而落败的情况。推测原因，一是进行了优化，结合快速走棋搜索节点，而不是只利用卷积策略网络搜索节点，这样可以避免短期内落入局部思维而完全忽略人类的“神来之笔”；二是数据集已经完全弃用人类棋局，它由从`AlphaGo`自我对弈中挑选出的样本数据构成，因此策略网络更加强大。之所以只用卷积策略网络搜索节点存在弊端，是因为卷积核一般都很小，导致棋盘不同位置的局部视野需要在若干轮后才能互相影响，因此才出现了所谓的“昏招”。


    ## 7.3 迁移学习


    顾名思义，迁移学习（`Transfer Learning`）就是将学过的知识用于解决新问题，从而达到快速解决新问题的目的。迁移学习和强化学习一样，也是机器学习的一个研究分支。从
    20 世纪 90 年代开始，迁移学习吸引了越来越多研究者的目光，其初衷是节省人工标记样本的时间，让模型通过对已有的标记样本进行学习，将预测能力迁移到未标记的样本空间。随着机器学习在实际业务中的普及，新业务在早期通常缺乏足够的训练样本，而具有一定相似性的老业务拥有大量的可训练样本，只是样本特征分布可能与新业务的样本特征分布不同，迁移学习就是利用老业务场景中的样本数据快速训练出一个适应新业务场景的模型的过程。也就是说，迁移学习是从源领域（`Source
    Domain`）中学习知识和经验，然后应用到目标领域（`Target Domain`）中的一个过程。


    ### 7.3.1 简介


    ### 7.3.2 方法与研究方向


    迁移学习主要有以下 4 种迁移方法。


    1. 样本迁移


    如果直接将源领域中的所有样本数据用于目标领域中的模型训练，那么效果会比较差。利用样本相似度衡量，我们可以在源领域中找到很多可以用于目标领域中的相似样本数据。例如，源领域中有大量的动物图片，目标领域的任务是识别小狗，但只有少量的样本图片，我们可以从大量的动物图片中找出特征最相似的小狗图片，从而解决小狗图片样本短缺的问题。


    2. 特征迁移


    挑选源领域中具有代表性的特征，通过特征变换将源领域和目标领域中的特征映射到相同的空间中，使这个空间中源领域和目标领域中的样本数据具有相同的特征分布。


    3. 模型迁移


    模型迁移又称为参数迁移。假设源领域和目标领域之间共享一些参数，或者共享模型超参数的先验分布，那么在目标领域中使用迁移源领域的老模型也可以达到很高的精度。预训练（`Pre-training`）加微调（`Fine-tuning`）的迁移学习方法就是一种模型迁移，这种方法也是最常用的迁移学习方法之一。


    4. 关系迁移


    关系迁移类似的数据关系是可以拿来进行迁移的，如师生关系和上下级关系、生物病毒的传播与网络病毒的传播等。


    迁移学习领域比较有名的两个研究方向分别为多任务学习（`Multi-task Learning`）和领域自适应（`Domain Adaptation`）。


    大部分机器学习算法的训练目标只有一个，而多任务学习的训练目标有多个。从广义上来说，损失函数包含多个目标（不含正则惩罚项）的计算，是多任务学习。多任务学习虽然属于迁移学习的范畴，但与通常意义上的迁移学习存在一定的区别。首先，迁移学习的“迁移”，是有学习的先后顺序的，而多任务学习是多个任务一起学习，没有先后顺序；其次，多任务学习的目标是提升所有任务而非单一任务的学习效果。比较有名的多任务学习应用有
    Google 公司的`MMoE`（`Multi-gate Mixture-of-Experts`）模型、阿里巴巴公司的`ESMM`（`Entire Space
    Multi-Task Model`）模型等。


    机器学习算法能在各大场景中取得不错的效果，其前提是假设源领域和目标领域中的样本数据均服从独立同分布（`Independently Identically Distribution`，`IID`）。当源领域和目标领域中的样本数据不服从独立同分布时，机器学习算法会出现过拟合问题，导致分类器的性能很差。领域自适应就是解决这个问题的研究课题之一。领域自适应问题作为迁移学习的一个子问题，在相似的不同任务之间，以及同一个任务下不同类别的样本（如不同的人群和商品类别）之间，都经常出现。在同一个任务下的领域自适应问题，直观的表现就是将数据的相关性错误地当成了因果性，这一类问题有一个专门的研究方向，称为因果推断（`Causal
    Inference`）。比较流行的领域自适应算法有`DaNN`（`Domain Adaptive Neural Network`）算法、`DDC`（`Deep
    Domain Confusion`）算法和`DAN`（`Deep Adaptation Network`）算法等。


    ### 7.3.3 经典模型：TrAdaBoost


    在进行算法模型训练前，通常会假设划分的训练集和测试集的分布相同。但是在许多实际情况中，这种服从单一分布的假设并不成立。如果新数据集分布与训练所用的旧数据集分布不一样，那么算法的准确率就会大打折扣。但是完全使用新数据集重新进行训练，又会存在两个问题：其一，新数据集的样本数量可能不够；其二，旧数据集并非所有的样本数据都没有价值，完全不用又比较浪费。由戴文渊于
    2007 年提出的`TrAdaBoost`算法，是一种经典的解决上述问题的机器学习算法。`TrAdaBoost`算法可以从旧数据集中提取出有价值的样本数据，并且结合收集到的少量新样本数据，学习出比单纯使用新样本数据训练更精确的结果。假设有`n`个数据来自旧数据集`d`，有`m`个数据来自新数据集`s`，`TrAdaBoost`算法的整体步骤如下。


    （1）计算每个样本权重。

    （2）调用弱分类器，将旧数据集和新数据集合在一起作为训练数据，过程和`AdaBoost`训练弱分类器一样。

    （3）计算新数据集中所有样本数据的错误率。

    （4）分别计算新数据集和旧数据集中样本权重的调整速率。

    （5）更新样本权重。如果新数据集中的样本分类错误，则提高该样本的权重值；如果旧数据集中的样本分类错误，则降低该样本的权重值，这是因为分类错误意味着旧数据集中的这个样本与新数据集中的这个样本之间的差距太大。最后，将后面`50%`弱分类器的投票结果作为模型的最终结果输出。


