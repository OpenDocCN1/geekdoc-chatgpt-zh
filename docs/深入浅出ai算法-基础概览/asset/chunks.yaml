    年龄、体重、受教育次数、资本收益、资本损失和每周工作小时数这6个特征为连续型特征，表示数值含义。其余8个特征为离散型特征，表示文本含义。代表年收入的类别标签在每条样本的末尾，`>50k`表示年收入超过5万美元，`<=50k`表示年收入未超过5万美元。


