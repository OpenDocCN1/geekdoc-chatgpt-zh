- raw: '所有机器学习算法都是基于样本学习的。有标签的样本，相当于一个有经验的师父提前告诉你学习的目标是什么，以此监督你的学习过程，这个标签称为监督信号。带监督信号的机器学习称为监督学习（Supervised
    Learning），反之称为无监督学习（Unsupervised Learning）。当然，在监督学习和无监督学习之间，还存在半监督学习（Semi-Supervised
    Learning）。顾名思义，半监督学习就是所用样本中只有一部分带有监督信号的机器学习。


    1\. 监督学习


    具体来说，监督学习是利用有标签的样本进行机器学习，并且调整模型的参数，使其达到所需性能要求的过程，这个过程又称为监督训练或教师学习。监督学习之所以又称为教师学习，是因为这个过程类似于教师授课、学生学习的过程。下面来看一个简单的例子。


    问题描述：现有若干张画有不同种类动物（如猴子、老虎、狮子、大象、长颈鹿等）的卡片，每种动物卡片分别有各不相同的若干张，如何教会幼儿园的小朋友们认识这些卡片上的不同动物？


    常规的教学流程是，如果拿出的是猴子卡片，就告诉小朋友们这是猴子，如果拿出的是狮子卡片，就告诉小朋友们这是狮子；以此类推，拿出画有哪种动物的卡片，就告诉小朋友们这是哪种动物。在反复教学几轮后，小朋友们大概就能区分哪些卡片是猴子，哪些卡片是狮子了。这便是所谓的监督学习过程，而事先告知的卡片与动物的对应关系，便是样本的标签，即监督信号，小朋友们对这些动物卡片的记忆方法就是监督学习算法。


    常见的监督学习算法有线性回归（Linear Regression）、逻辑回归（Logistic Regression）、K-近邻（K-Nearest Neighbor，KNN算法）、决策树（Decision
    Tree）、朴素贝叶斯（Naive Bayes）、神经网络（Neural Network），还有用于降维的算法——线性判别分析（Linear Discriminant
    Analysis，LDA）。无论采用哪种监督学习算法，其共同点都是教什么就学什么。即通过学习，使模型输出结果与指定样本标签值尽可能地接近。


    2\. 无监督学习


    与监督学习相比，无监督学习没有监督信号，它利用未知标签的样本调整模型参数，学习某种特征、规律、趋势或既定模式，从而达到所需性能要求的过程。放眼回望，人类从原始社会一路走来，文明的进步何尝不是处处伴随着无监督学习？还以动物卡片为例，人类最开始并不知道猴子叫猴子、狮子叫狮子，只知道某类动物具有相同或类似的外貌特征。例如，某类动物经常用手挠头、活泼好动，喜欢在树上窜来窜去；某类动物体格健壮，颈部覆盖着厚厚的鬃毛，食肉。久而久之，同类型具有相同行为规律与外貌特征的动物，随着时间的推移逐渐被称为猴子和狮子。这便是无监督学习的过程，这种将动物归类的方法，其实就是无监督学习中的典型算法——聚类。图4-1所示为一个无监督学习示例。


    ![](OEBPS/Images/106-1.jpg)


    图4-1　无监督学习示例


    常见的无监督学习算法除了聚类（Clustering），还有降维算法──主成分分析（Principal Component Analysis，PCA）。聚类可以进一步分成4类，分别为划分聚类、层次聚类、密度聚类和模型聚类。


    3\. 半监督学习


    半监督学习是监督学习与无监督学习相结合的机器学习，它使用大量未知标签的样本，同时使用部分已知标签的样本，用于学习某种特征、规律、趋势或既定模式。我们发现，在一些真实场景中，经常出现缺乏有标签样本的情况，而给样本打标签是一项十分费力、耗时的工作。显而易见，半监督学习的主要目的之一就是提高这方面的效率。不过，并不是所有类型的样本都满足半监督学习的要求，半监督学习依赖以下3个前提假设。


    • 平滑假设，处于某个维度空间的两个距离很近的样本，标签类似。


    • 聚类假设，处于同一个聚类类别下的两个样本，标签类似。


    • 流形假设，当两个样本从高维空间映射到低维空间的同一个局部邻域![同一个数据点的附近，一种直观理解的数学表达。](OEBPS/Images/note.png)时，标签类似。


    如果以上3个前提假设不成立，那么无标签样本不仅不能对模型的学习性能起改善作用，反而会损坏学习性能，导致半监督学习失效。但是，还有一些实验表明，在一些特殊情况下，即使前提假设成立，无标签样本也有可能损坏模型的学习性能。因此，要开展半监督学习，前期做好充分的数据调研尤为重要。


    常见的半监督学习算法有半监督聚类（Semi-Supervised Clustering）、生成对抗网络（Generative Adversarial Nets，GAN）、半监督分类（Semi-supervised
    Classification）及一些基于图的算法等。


    #### 4.1.2　按学习目标划分


    机器学习算法的类别除了可以根据是否有监督信号进行划分，还可以根据学习目标进行划分。顾名思义，学习目标就是算法模型最终要达到的目的。例如，识别动物卡片的算法模型，目的是区分不同的类别，用于回答“是”或“不是”类问题；销量预测、股票预测的算法模型，目的是预估某类数值的大小，用于回答“多少”类问题。这样，按照学习目标划分，可以将机器学习算法模型分成四大类。回答“是”或“不是”类问题的算法模型统称为分类（Classification），回答“多少”类问题的算法模型统称为回归（Regression）。除了分类和回归，另外两类算法分别是聚类（Clustering）和降维（Dimensionality
    Reduction）。


    分类和回归的直观区分方法如下：模型的最终预测值如果是离散的二值（如0和1），就是分类；如果是一个连续的取值空间，就是回归。有读者或许已经发现，无论是分类还是回归，模型训练用的都是有标签的样本，因此它们都属于监督学习的范畴。


    事实上，分类和回归已经涵盖了机器学习中的大部分热门模型，如最近几年特别流行的神经网络及其一系列变种（卷积神经网络、循环神经网络等）。常规的聚类属于无监督学习，当然也存在半监督聚类算法。降维主要有无监督学习的主成分分析（PCA）算法、监督学习的线性判别分析（LDA）算法等。


    ### 4.2　线性回归模型与逻辑回归模型


    在监督学习模型中，线性回归模型和逻辑回归模型是最经典的两个模型，其中逻辑回归模型适用于大部分监督学习问题。不仅如此，学好线性回归模型和逻辑回归模型，对神经网络的学习也大有帮助。


    #### 4.2.1　线性回归模型


    线性回归模型是最简单、直观的机器学习算法模型之一。线性是指特征值与输出值之间是一次函数关系。例如，对于f(x)\=ωx+b，其中x是特征值，f(x)表示输出值。回归是指通过调整一次函数的参数，使其尽可能准确地拟合数据的过程。


    我们不妨从最简单的单特征线性回归模型讲起。所谓单特征，就是一个特征，假设预测目标只与一个因素相关。例如，要预测北京市房价，单特征是每套房子的建筑面积，我们的假设就是北京房价只与建筑面积有关。假设北京房价和建筑面积的关系如图4-2所示，坐标轴横坐标和纵坐标分别是建筑面积和每平方米价格。


    ![](OEBPS/Images/108-1.jpg)


    图4-2　建筑面积与房价关系图


    线性回归模型的目标是尽可能准确地拟合数据，即在图4-2中找到一条直线，使图中各点尽可能地接近这条直线。单特征线性回归模型公式为f(x)=ax+b，x为建筑面积，f(x)为每平方米的价格，a和b是权重参数，其中b称为偏置（Bias），单特征下的a是一个标量，多特征下的a是一个向量。那么，图4-2中有这么多不同建筑面积的房价，如何找到一条合适的直线来表示它们的关系变化？这就说到机器学习中的模型训练方法了，目前最常用的模型训练方法为梯度下降法（Gradient
    Descent）。下面讲解梯度下降法具体是如何训练，从而求得建筑面积与房价之间的线性关系的。为了便于理解，假设线性回归模型拟合的直线经过原点，并且只考虑一个样本数据点(1,
    4)，那么梯度下降法的训练过程如下。


    （1）初始化模型权重参数a，假设初始值为2，由于经过原点，b值固定为0，并且设置训练步长s\=0.1，设置训练终止阈值threshold=0.01。


    （2）将x\=1代入f(x)=ax，计算实际输出值与真实值之差Δ\=f(x)\-y，得到的差值Δ即loss的值。如果loss的绝对值小于或等于threshold的值，则结束训练。


    （3）计算训练步长s与loss的积，即梯度，用权重参数a的值减去梯度的值来更新a的值，跳转至步骤（2），继续运行，直到训练结束。


    按照上述流程，每轮迭代的权重参数a和梯度依次为(2,-0.2)，(2.2,-0.18)，(2.38,-0.162)，(2.542,-0.1458)，……直到loss的值小于threshold的值，训练结束。此时的权重参数a和梯度十分接近(4,
    0)，因此训练得到的回归函数为f(x)= 4x，训练迭代次数与loss之间的变化关系如图4-3所示。这个无限接近训练目标的过程，在机器学习中称为收敛（Convergence）。


    ![](OEBPS/Images/110-1.jpg)


    图4-3　训练迭代次数与loss值之间的变化关系


    当然，房价不可能只与建筑面积这一个因素有关系，机器学习算法模型的特征空间通常也不会只有一个维度。因此，一般使用向量x表示多特征值，使用向量ω表示多特征权重，使用标量b表示偏置，线性回归模型的公式就可以表示为f(x)=ωx+b。偏置的作用是无论在几维空间，回归函数都可以表示不经过原点的图像。通常将偏置也放到ωx中，具体做法是令特征向量x的每一维从下标1开始编号，将偏置作为权重ω0与构造的特征值x0\=1一起合入ωx的乘积之中。这样，线性回归模型公式就简化成了f(x)=ω0～n
    x0～n。


    #### 4.2.2　逻辑回归模型


    对于线性回归模型公式f(x)=ωx，其值域（取值范围）是未知的，f(x)相当于在计算ωx之后，直接用线性函数y=x将该结果“激活”输出。线性回归模型之名由此得来，y=x则被称为线性激活函数。既然有线性激活函数，自然就有非线性激活函数，非线性激活函数可以将未知值域映射到一个已知的值域范围内。其中最有名的非线性激活函数之一为Sigmoid函数。将Sigmoid函数作为激活函数的回归模型称为逻辑回归模型。Sigmoid函数的公式为


    ![](OEBPS/Images/111-1.jpg)


    Sigmoid函数的图像如图4-4所示。


    ![](OEBPS/Images/111-2.jpg)


    图4-4　Sigmoid函数的图像


    根据Sigmoid函数的公式和图像可知，Sigmoid函数的值域为(0, 1)。将输出值映射到(0, 1)区间，目的是方便设定阈值完成二分类。无论特征维度的值是多少，逻辑回归模型都会利用阈值设定，在这个特征维度空间中将样本集合分为两部分。例如，二维空间可以用一条直线切分成两部分，三维空间可以用一个平面切分成两部分，以此类推。


    除了Sigmoid函数，下面介绍另外3种常见的激活函数，它们分别为Sgn函数、Tanh函数和ReLU函数。其中ReLU函数在神经网络中应用广泛。


    阶跃函数Sgn为二值输出函数，如输出-1和1，其函数图像如图4-5所示。由于阶跃函数具有不连续、不光滑的性质，而且输出值固定，因此不适合作为神经网络中的激活函数进行网络信息传递。


    ![](OEBPS/Images/112-1.jpg)


    图4-5　Sgn函数的图像


    双曲正切函数Tanh可以解决Sigmoid函数的输出值恒大于0的问题。其值域为(-1, 1)，相当于将Sigmoid函数沿着纵轴拉伸了一倍，然后向下平移了一个单位。Tanh函数的公式为


    ![](OEBPS/Images/112-2.jpg)


    Tanh函数的图像如图4-6所示。


    ![](OEBPS/Images/112-3.jpg)


    图4-6　Tanh函数的图像


    不过，在深度神经网络中使用Tanh函数和Sigmoid函数有可能造成梯度消失问题，这个将在后面详细讲解。


    ReLU函数是一个非常简单实用的激活函数，其功能如下：如果输入小于0，则输出值均为0，否则输出值等于输入值。ReLU函数的值域为\[0, +∞)，其函数图像如图4-7所示。


    ![](OEBPS/Images/113-1.jpg)


    图4-7　ReLU函数的图像


    在神经网络中使用ReLU函数能有效缓解梯度消失问题，尤其在深度神经网络中非常实用。ReLU函数的变种有LReLU函数、PReLU函数和RReLU函数等。


    ### 4.3　人工神经网络


    在20世纪40年代，心理学家W.S.McCulloch和数理逻辑学家W.Pitts在分析、总结人类大脑神经元基本特性的基础上，提出了相应的数学模型。随着计算机硬件技术的飞速发展，神经网络从最初的单层感知结构发展成了如今流行的多层感知结构。那么，神经网络为何如此流行，具体又是如何工作的？


    #### 4.3.1　初识人工神经网络


    根据生物学研究结论，人脑神经细胞数量的数量级大约为1010，这些神经细胞之间通过突触（轴突和树突）相连。一种对于神经细胞运作的通俗理解为，神经细胞将所有树突传进来的信号相加，如果信号之和高于或低于某个阈值，那么细胞状态会相应地变为兴奋状态或抑制状态，由于大脑的神经细胞在不同时期的激活状态不同，因此在不同时期会表现出不同的大脑行为。


    机器学习中神经网络的灵感来源于人脑神经细胞的这种信号传递现象。由于是人工模拟，因此这类机器学习算法的准确称呼为人工神经网络（Artificial Neural
    Network，ANN）。与人脑神经网络类似，人工神经网络由多个人工神经元相连组成，人工神经元的数学描述如图4-8所示。


    ![](OEBPS/Images/114-1.jpg)


    图4-8　人工神经元的数学描述


    首先，人工神经元用一个求和函数SUM（类似神经细胞的树突）来接收信息。在图4-8中，x1～xn代表发送至该人工神经元的信号；w1～wn代表这些信号作用在这个神经元上的不同程度，即这些信号的权重；偏置b从生物角度来看，可以理解为这个神经元本身所具备的信号弹性。然后，人工神经元用一个激活函数输出信号y。人工神经网络通常使用Sigmoid函数作为激活函数。与Sigmoid函数相比，ReLU函数具有运算速度快、缓解梯度消失问题等优势，因此应用非常广泛，通常应用于深度神经网络的中间层（隐层）。


    对于人工神经元构成的单层模型，激活函数不同，相应的名称也不同。事实上，线性回归模型和逻辑回归模型都属于人工神经网络的范畴。其中，使用线性激活函数f(x)=x的单层神经网络模型，就是4.2节中的线性回归模型；使用非线性激活函数Sigmoid的单层神经网络模型，就是4.2节中的逻辑回归模型；使用阶跃函数作为激活函数的单层神经元模型，学术名称为感知机![“机”在机器学习领域中是算法的别称。](OEBPS/Images/note.png)（Perceptron）。下面通过一个简单的例子讲解什么是单层神经元模型。假设有一男一女两个人，身高、体重分别是1.8m、70kg和1.6m、50kg，我们用这两个样本训练出一个能判断性别的单层神经元模型。


    使用Sigmoid函数作为激活函数，单层神经元模型的表达式为


    ![](OEBPS/Images/115-1.jpg)


    在上述表达式中，x为特征输入（身高x2, 体重x1, 偏置1），w为要学习的特征权重。将两人的特征数据（1.8, 70, 1）和（1.7, 50, 1）重复输入模型中，用于学习参数向量w的值，学习方法采用前文讲到的梯度下降法，直到f(x\=(1.8,
    70, 1))和f(x\=(1.7, 50, 1))的值分别趋向0和1，训练结束。


    除此之外，人工神经网络衍生出了各式各样的结构变种，如深度神经网络、卷积神经网络、递归神经网络和图神经网络等，并且开辟了形形色色的研究方向。


    #### 4.3.2　深度神经网络


    顾名思义，深度神经网络（Deep Neural Network，DNN）的神经元层数比较多，模型的输入、输出会经过比较深的人工神经网络结构，中间经过的人工神经网络层被称为隐层。既然是深度神经网络，到底多少层才能算深？业界其实没有统一的标准，一般少则三五层，多则上千层，都可以称为深度神经网络。深度神经网络其实早在20世纪60年代就已经诞生，由于计算性能跟不上等原因沉寂了几十年。随着计算机硬件技术的飞速发展，以及深度学习的兴起，直到21世纪初，深度神经网络才逐渐热门起来。一个常规的深度神经网络结构如图4-9所示。


    ![](OEBPS/Images/116-1.jpg)


    图4-9　常规的深度神经网络结构


    所有机器学习算法的学习目标，都是寻找输出与输入之间最合适的映射关系。在图4-9中，如果深度神经网络中的每层人工神经元都使用线性函数y=x作为激活函数，那么无论模型有多少层，模型最后的输出都会是原始输入经过线性变换![通俗地讲，线性变换是指仅通过加减乘除运算得到的映射关系，遵循叠加原理。叠加原理举例：f(x)=ax，f(y)=ay，f(x+y)=a(x+y)=ax+ay=f(x)+f(y)。](OEBPS/Images/note.png)的结果，最终效果相当于单层人工神经元模型的效果。与线性变换相比，非线性变换![与线性变换相比，非线性变换的映射表达式存在高次项或三角函数项等非线性计算。](OEBPS/Images/note.png)能够表达的信息要丰富很多。深度神经网络拥有强大的表达能力的原因，除了有深度外，每层神经元在激活输出时的非线性变换也至关重要。当然，深度神经网络同样面临很多训练方面的问题，如梯度消失和梯度爆炸。


    深度神经网络由于实现比较简单、直观，模型的抽象表征能力较强，因此应用范围非常广，后文讲到的各种神经网络模型其实都可以加入深度神经网络结构，从而实现更加抽象、丰富的特征学习。


    #### 4.3.3　卷积神经网络


    人类从呱呱坠地睁开眼的那一刻起，认识这个世界的主要方式之一就是通过视觉。人类通过视觉不断地认识身边事物的形状、颜色，并且在大脑中逐步构建出一个信息丰富且带有标签的万物图像库，从而通过看到的不同外貌来识别不同的事物。神经网络在计算机视觉（Computer
    Vision，CV）领域的深度运用，以及图形处理器（Graphics Processing Unit，GPU）的出现，使计算机也能像人脑一样，感知并识别这个五彩缤纷的图像世界。例如，从1000万张图片中识别出猫的Google
    Brain![Google于2011年开发的一套具备自主学习能力的神经网络系统。](OEBPS/Images/note.png)，以及击败人类围棋世界冠军的人工智能机器人AlphaGo![Google旗下DeepMind公司开发的围棋人工智能机器人，曾先后击败李世石与柯洁。](OEBPS/Images/note.png)，背后都用到了一种图像识别技术，即卷积神经网络（Convolutional
    Neural Network，CNN）。'
  fmt: '

    所有机器学习算法都是基于样本学习的。有标签的样本，相当于一个有经验的师父提前告诉你学习的目标是什么，以此监督你的学习过程，这个标签称为监督信号。带监督信号的机器学习称为监督学习（`Supervised
    Learning`），反之称为无监督学习（`Unsupervised Learning`）。当然，在监督学习和无监督学习之间，还存在半监督学习（`Semi-Supervised
    Learning`）。顾名思义，半监督学习就是所用样本中只有一部分带有监督信号的机器学习。


    ## 1. 监督学习


    具体来说，监督学习是利用有标签的样本进行机器学习，并且调整模型的参数，使其达到所需性能要求的过程，这个过程又称为监督训练或教师学习。监督学习之所以又称为教师学习，是因为这个过程类似于教师授课、学生学习的过程。下面来看一个简单的例子。


    问题描述：现有若干张画有不同种类动物（如猴子、老虎、狮子、大象、长颈鹿等）的卡片，每种动物卡片分别有各不相同的若干张，如何教会幼儿园的小朋友们认识这些卡片上的不同动物？


    常规的教学流程是，如果拿出的是猴子卡片，就告诉小朋友们这是猴子，如果拿出的是狮子卡片，就告诉小朋友们这是狮子；以此类推，拿出画有哪种动物的卡片，就告诉小朋友们这是哪种动物。在反复教学几轮后，小朋友们大概就能区分哪些卡片是猴子，哪些卡片是狮子了。这便是所谓的监督学习过程，而事先告知的卡片与动物的对应关系，便是样本的标签，即监督信号，小朋友们对这些动物卡片的记忆方法就是监督学习算法。


    常见的监督学习算法有线性回归（`Linear Regression`）、逻辑回归（`Logistic Regression`）、K-近邻（`K-Nearest
    Neighbor`，`KNN`算法）、决策树（`Decision Tree`）、朴素贝叶斯（`Naive Bayes`）、神经网络（`Neural Network`），还有用于降维的算法——线性判别分析（`Linear
    Discriminant Analysis`，`LDA`）。无论采用哪种监督学习算法，其共同点都是教什么就学什么。即通过学习，使模型输出结果与指定样本标签值尽可能地接近。


    ## 2. 无监督学习


    与监督学习相比，无监督学习没有监督信号，它利用未知标签的样本调整模型参数，学习某种特征、规律、趋势或既定模式，从而达到所需性能要求的过程。放眼回望，人类从原始社会一路走来，文明的进步何尝不是处处伴随着无监督学习？还以动物卡片为例，人类最开始并不知道猴子叫猴子、狮子叫狮子，只知道某类动物具有相同或类似的外貌特征。例如，某类动物经常用手挠头、活泼好动，喜欢在树上窜来窜去；某类动物体格健壮，颈部覆盖着厚厚的鬃毛，食肉。久而久之，同类型具有相同行为规律与外貌特征的动物，随着时间的推移逐渐被称为猴子和狮子。这便是无监督学习的过程，这种将动物归类的方法，其实就是无监督学习中的典型算法——聚类。图4-1所示为一个无监督学习示例。


    ![](OEBPS/Images/106-1.jpg)


    图4-1　无监督学习示例


    常见的无监督学习算法除了聚类（`Clustering`），还有降维算法──主成分分析（`Principal Component Analysis`，`PCA`）。聚类可以进一步分成4类，分别为划分聚类、层次聚类、密度聚类和模型聚类。


    ## 3. 半监督学习


    半监督学习是监督学习与无监督学习相结合的机器学习，它使用大量未知标签的样本，同时使用部分已知标签的样本，用于学习某种特征、规律、趋势或既定模式。我们发现，在一些真实场景中，经常出现缺乏有标签样本的情况，而给样本打标签是一项十分费力、耗时的工作。显而易见，半监督学习的主要目的之一就是提高这方面的效率。不过，并不是所有类型的样本都满足半监督学习的要求，半监督学习依赖以下3个前提假设。


    • 平滑假设，处于某个维度空间的两个距离很近的样本，标签类似。


    • 聚类假设，处于同一个聚类类别下的两个样本，标签类似。


    • 流形假设，当两个样本从高维空间映射到低维空间的同一个局部邻域![同一个数据点的附近，一种直观理解的数学表达。](OEBPS/Images/note.png)时，标签类似。


    如果以上3个前提假设不成立，那么无标签样本不仅不能对模型的学习性能起改善作用，反而会损坏学习性能，导致半监督学习失效。但是，还有一些实验表明，在一些特殊情况下，即使前提假设成立，无标签样本也有可能损坏模型的学习性能。因此，要开展半监督学习，前期做好充分的数据调研尤为重要。


    常见的半监督学习算法有半监督聚类（`Semi-Supervised Clustering`）、生成对抗网络（`Generative Adversarial
    Nets`，`GAN`）、半监督分类（`Semi-supervised Classification`）及一些基于图的算法等。


    ### 4.1.2 按学习目标划分


    机器学习算法的类别除了可以根据是否有监督信号进行划分，还可以根据学习目标进行划分。顾名思义，学习目标就是算法模型最终要达到的目的。例如，识别动物卡片的算法模型，目的是区分不同的类别，用于回答“是”或“不是”类问题；销量预测、股票预测的算法模型，目的是预估某类数值的大小，用于回答“多少”类问题。这样，按照学习目标划分，可以将机器学习算法模型分成四大类。回答“是”或“不是”类问题的算法模型统称为分类（`Classification`），回答“多少”类问题的算法模型统称为回归（`Regression`）。除了分类和回归，另外两类算法分别是聚类（`Clustering`）和降维（`Dimensionality
    Reduction`）。


    分类和回归的直观区分方法如下：模型的最终预测值如果是离散的二值（如0和1），就是分类；如果是一个连续的取值空间，就是回归。有读者或许已经发现，无论是分类还是回归，模型训练用的都是有标签的样本，因此它们都属于监督学习的范畴。


    事实上，分类和回归已经涵盖了机器学习中的大部分热门模型，如最近几年特别流行的神经网络及其一系列变种（卷积神经网络、循环神经网络等）。常规的聚类属于无监督学习，当然也存在半监督聚类算法。降维主要有无监督学习的主成分分析（`PCA`）算法、监督学习的线性判别分析（`LDA`）算法等。


    ### 4.2 线性回归模型与逻辑回归模型


    在监督学习模型中，线性回归模型和逻辑回归模型是最经典的两个模型，其中逻辑回归模型适用于大部分监督学习问题。不仅如此，学好线性回归模型和逻辑回归模型，对神经网络的学习也大有帮助。


    #### 4.2.1 线性回归模型


    线性回归模型是最简单、直观的机器学习算法模型之一。线性是指特征值与输出值之间是一次函数关系。例如，对于`f(x)=ωx+b`，其中`x`是特征值，`f(x)`表示输出值。回归是指通过调整一次函数的参数，使其尽可能准确地拟合数据的过程。


    我们不妨从最简单的单特征线性回归模型讲起。所谓单特征，就是一个特征，假设预测目标只与一个因素相关。例如，要预测北京市房价，单特征是每套房子的建筑面积，我们的假设就是北京房价只与建筑面积有关。假设北京房价和建筑面积的关系如图4-2所示，坐标轴横坐标和纵坐标分别是建筑面积和每平方米价格。


    ![](OEBPS/Images/108-1.jpg)


    图4-2　建筑面积与房价关系图


    线性回归模型的目标是尽可能准确地拟合数据，即在图4-2中找到一条直线，使图中各点尽可能地接近这条直线。单特征线性回归模型公式为`f(x)=ax+b`，`x`为建筑面积，`f(x)`为每平方米的价格，`a`和`b`是权重参数，其中`b`称为偏置（`Bias`），单特征下的`a`是一个标量，多特征下的`a`是一个向量。那么，图4-2中有这么多不同建筑面积的房价，如何找到一条合适的直线来表示它们的关系变化？这就说到机器学习中的模型训练方法了，目前最常用的模型训练方法为梯度下降法（`Gradient
    Descent`）。下面讲解梯度下降法具体是如何训练，从而求得建筑面积与房价之间的线性关系的。为了便于理解，假设线性回归模型拟合的直线经过原点，并且只考虑一个样本数据点`(1,
    4)`，那么梯度下降法的训练过程如下。


    （1）初始化模型权重参数`a`，假设初始值为2，由于经过原点，`b`值固定为0，并且设置训练步长`s=0.1`，设置训练终止阈值`threshold=0.01`。


    （2）将`x=1`代入`f(x)=ax`，计算实际输出值与真实值之差`Δ=f(x)-y`，得到的差值`Δ`即`loss`的值。如果`loss`的绝对值小于或等于`threshold`的值，则结束训练。


    （3）计算训练步长`s`与`loss`的积，即梯度，用权重参数`a`的值减去梯度的值来更新`a`的值，跳转至步骤（2），继续运行，直到训练结束。


    按照上述流程，每轮迭代的权重参数`a`和梯度依次为`(2,-0.2)`，`(2.2,-0.18)`，`(2.38,-0.162)`，`(2.542,-0.1458)`，……直到`loss`的值小于`threshold`的值，训练结束。此时的权重参数`a`和梯度十分接近`(4,
    0)`，因此训练得到的回归函数为`f(x)=4x`，训练迭代次数与`loss`之间的变化关系如图4-3所示。这个无限接近训练目标的过程，在机器学习中称为收敛（`Convergence`）。


    ![](OEBPS/Images/110-1.jpg)


    图4-3　训练迭代次数与`loss`值之间的变化关系


    当然，房价不可能只与建筑面积这一个因素有关系，机器学习算法模型的特征空间通常也不会只有一个维度。因此，一般使用向量`x`表示多特征值，使用向量`ω`表示多特征权重，使用标量`b`表示偏置，线性回归模型的公式就可以表示为`f(x)=ωx+b`。偏置的作用是无论在几维空间，回归函数都可以表示不经过原点的图像。通常将偏置也放到`ωx`中，具体做法是令特征向量`x`的每一维从下标1开始编号，将偏置作为权重`ω0`与构造的特征值`x0=1`一起合入`ωx`的乘积之中。这样，线性回归模型公式就简化成了`f(x)=ω0～n
    x0～n`。


    #### 4.2.2 逻辑回归模型


    对于线性回归模型公式`f(x)=ωx`，其值域（取值范围）是未知的，`f(x)`相当于在计算`ωx`之后，直接用线性函数`y=x`将该结果“激活”输出。线性回归模型之名由此得来，`y=x`则被称为线性激活函数。既然有线性激活函数，自然就有非线性激活函数，非线性激活函数可以将未知值域映射到一个已知的值域范围内。其中最有名的非线性激活函数之一为`Sigmoid`函数。将`Sigmoid`函数作为激活函数的回归模型称为逻辑回归模型。`Sigmoid`函数的公式为


    ![](OEBPS/Images/111-1.jpg)


    `Sigmoid`函数的图像如图4-4所示。


    ![](OEBPS/Images/111-2.jpg)


    图4-4　`Sigmoid`函数的图像


    根据`Sigmoid`函数的公式和图像可知，`Sigmoid`函数的值域为`(0, 1)`。将输出值映射到`(0, 1)`区间，目的是方便设定阈值完成二分类。无论特征维度的值是多少，逻辑回归模型都会利用阈值设定，在这个特征维度空间中将样本集合分为两部分。例如，二维空间可以用一条直线切分成两部分，三维空间可以用一个平面切分成两部分，以此类推。


    除了`Sigmoid`函数，下面介绍另外3种常见的激活函数，它们分别为`Sgn`函数、`Tanh`函数和`ReLU`函数。其中`ReLU`函数在神经网络中应用广泛。


    阶跃函数`Sgn`为二值输出函数，如输出-1和1，其函数图像如图4-5所示。由于阶跃函数具有不连续、不光滑的性质，而且输出值固定，因此不适合作为神经网络中的激活函数进行网络信息传递。


    ![](OEBPS/Images/112-1.jpg)


    图4-5　`Sgn`函数的图像


    双曲正切函数`Tanh`可以解决`Sigmoid`函数的输出值恒大于0的问题。其值域为`(-1, 1)`，相当于将`Sigmoid`函数沿着纵轴拉伸了一倍，然后向下平移了一个单位。`Tanh`函数的公式为


    ![](OEBPS/Images/112-2.jpg)


    `Tanh`函数的图像如图4-6所示。


    ![](OEBPS/Images/112-3.jpg)


    图4-6　`Tanh`函数的图像


    不过，在深度神经网络中使用`Tanh`函数和`Sigmoid`函数有可能造成梯度消失问题，这个将在后面详细讲解。


    `ReLU`函数是一个非常简单实用的激活函数，其功能如下：如果输入小于0，则输出值均为0，否则输出值等于输入值。`ReLU`函数的值域为`[0, +∞)`，其函数图像如图4-7所示。


    ![](OEBPS/Images/113-1.jpg)


    图4-7　`ReLU`函数的图像


    在神经网络中使用`ReLU`函数能有效缓解梯度消失问题，尤其在深度神经网络中非常实用。`ReLU`函数的变种有`LReLU`函数、`PReLU`函数和`RReLU`函数等。


    ### 4.3 人工神经网络


    在20世纪40年代，心理学家W.S.McCulloch和数理逻辑学家W.Pitts在分析、总结人类大脑神经元基本特性的基础上，提出了相应的数学模型。随着计算机硬件技术的飞速发展，神经网络从最初的单层感知结构发展成了如今流行的多层感知结构。那么，神经网络为何如此流行，具体又是如何工作的？


    #### 4.3.1 初识人工神经网络


    根据生物学研究结论，人脑神经细胞数量的数量级大约为`10^10`，这些神经细胞之间通过突触（轴突和树突）相连。一种对于神经细胞运作的通俗理解为，神经细胞将所有树突传进来的信号相加，如果信号之和高于或低于某个阈值，那么细胞状态会相应地变为兴奋状态或抑制状态，由于大脑的神经细胞在不同时期的激活状态不同，因此在不同时期会表现出不同的大脑行为。


    机器学习中神经网络的灵感来源于人脑神经细胞的这种信号传递现象。由于是人工模拟，因此这类机器学习算法的准确称呼为人工神经网络（`Artificial Neural
    Network`，`ANN`）。与人脑神经网络类似，人工神经网络由多个人工神经元相连组成，人工神经元的数学描述如图4-8所示。


    ![](OEBPS/Images/114-1.jpg)


    图4-8　人工神经元的数学描述


    首先，人工神经元用一个求和函数`SUM`（类似神经细胞的树突）来接收信息。在图4-8中，`x1～xn`代表发送至该人工神经元的信号；`w1～wn`代表这些信号作用在这个神经元上的不同程度，即这些信号的权重；偏置`b`从生物角度来看，可以理解为这个神经元本身所具备的信号弹性。然后，人工神经元用一个激活函数输出信号`y`。人工神经网络通常使用`Sigmoid`函数作为激活函数。与`Sigmoid`函数相比，`ReLU`函数具有运算速度快、缓解梯度消失问题等优势，因此应用非常广泛，通常应用于深度神经网络的中间层（隐层）。


    对于人工神经元构成的单层模型，激活函数不同，相应的名称也不同。事实上，线性回归模型和逻辑回归模型都属于人工神经网络的范畴。其中，使用线性激活函数`f(x)=x`的单层神经网络模型，就是4.2节中的线性回归模型；使用非线性激活函数`Sigmoid`的单层神经网络模型，就是4.2节中的逻辑回归模型；使用阶跃函数作为激活函数的单层神经元模型，学术名称为感知机![“机”在机器学习领域中是算法的别称。](OEBPS/Images/note.png)（`Perceptron`）。下面通过一个简单的例子讲解什么是单层神经元模型。假设有一男一女两个人，身高、体重分别是1.8m、70kg和1.6m、50kg，我们用这两个样本训练出一个能判断性别的单层神经元模型。


    使用`Sigmoid`函数作为激活函数，单层神经元模型的表达式为


    ![](OEBPS/Images/115-1.jpg)


    在上述表达式中，`x`为特征输入（身高`x2`, 体重`x1`, 偏置1），`w`为要学习的特征权重。将两人的特征数据（1.8, 70, 1）和（1.7,
    50, 1）重复输入模型中，用于学习参数向量`w`的值，学习方法采用前文讲到的梯度下降法，直到`f(x=(1.8, 70, 1))`和`f(x=(1.7,
    50, 1))`的值分别趋向0和1，训练结束。


    除此之外，人工神经网络衍生出了各式各样的结构变种，如深度神经网络、卷积神经网络、递归神经网络和图神经网络等，并且开辟了形形色色的研究方向。


    #### 4.3.2 深度神经网络


    顾名思义，深度神经网络（`Deep Neural Network`，`DNN`）的神经元层数比较多，模型的输入、输出会经过比较深的人工神经网络结构，中间经过的人工神经网络层被称为隐层。既然是深度神经网络，到底多少层才能算深？业界其实没有统一的标准，一般少则三五层，多则上千层，都可以称为深度神经网络。深度神经网络其实早在20世纪60年代就已经诞生，由于计算性能跟不上等原因沉寂了几十年。随着计算机硬件技术的飞速发展，以及深度学习的兴起，直到21世纪初，深度神经网络才逐渐热门起来。一个常规的深度神经网络结构如图4-9所示。


    ![](OEBPS/Images/116-1.jpg)


    图4-9　常规的深度神经网络结构


    所有机器学习算法的学习目标，都是寻找输出与输入之间最合适的映射关系。在图4-9中，如果深度神经网络中的每层人工神经元都使用线性函数`y=x`作为激活函数，那么无论模型有多少层，模型最后的输出都会是原始输入经过线性变换![通俗地讲，线性变换是指仅通过加减乘除运算得到的映射关系，遵循叠加原理。叠加原理举例：`f(x)=ax`，`f(y)=ay`，`f(x+y)=a(x+y)=ax+ay=f(x)+f(y)`。](OEBPS/Images/note.png)的结果，最终效果相当于单层人工神经元模型的效果。与线性变换相比，非线性变换![与线性变换相比，非线性变换的映射表达式存在高次项或三角函数项等非线性计算。](OEBPS/Images/note.png)能够表达的信息要丰富很多。深度神经网络拥有强大的表达能力的原因，除了有深度外，每层神经元在激活输出时的非线性变换也至关重要。当然，深度神经网络同样面临很多训练方面的问题，如梯度消失和梯度爆炸。


    深度神经网络由于实现比较简单、直观，模型的抽象表征能力较强，因此应用范围非常广，后文讲到的各种神经网络模型其实都可以加入深度神经网络结构，从而实现更加抽象、丰富的特征学习。


    #### 4.3.3 卷积神经网络


    人类从呱呱坠地睁开眼的那一刻起，认识这个世界的主要方式之一就是通过视觉。人类通过视觉不断地认识身边事物的形状、颜色，并且在大脑中逐步构建出一个信息丰富且带有标签的万物图像库，从而通过看到的不同外貌来识别不同的事物。神经网络在计算机视觉（`Computer
    Vision`，`CV`）领域的深度运用，以及图形处理器（`Graphics Processing Unit`，`GPU`）的出现，使计算机也能像人脑一样，感知并识别这个五彩缤纷的图像世界。例如，从1000万张图片中识别出猫的`Google
    Brain`![Google于2011年开发的一套具备自主学习能力的神经网络系统。](OEBPS/Images/note.png)，以及击败人类围棋世界冠军的人工智能机器人`AlphaGo`![Google旗下DeepMind公司开发的围棋人工智能机器人，曾先后击败李世石与柯洁。](OEBPS/Images/note.png)，背后都用到了一种图像识别技术，即卷积神经网络（`Convolutional
    Neural Network`，`CNN`）。

    '
  trans: '


    所有机器学习算法都是基于样本学习的。有标签的样本，相当于一个有经验的师父提前告诉你学习的目标是什么，以此监督你的学习过程，这个标签称为监督信号。带监督信号的机器学习称为监督学习（`Supervised
    Learning`），反之称为无监督学习（`Unsupervised Learning`）。当然，在监督学习和无监督学习之间，还存在半监督学习（`Semi-Supervised
    Learning`）。顾名思义，半监督学习就是所用样本中只有一部分带有监督信号的机器学习。


    ## 1. 监督学习


    具体来说，监督学习是利用有标签的样本进行机器学习，并且调整模型的参数，使其达到所需性能要求的过程，这个过程又称为监督训练或教师学习。监督学习之所以又称为教师学习，是因为这个过程类似于教师授课、学生学习的过程。下面来看一个简单的例子。


    问题描述：现有若干张画有不同种类动物（如猴子、老虎、狮子、大象、长颈鹿等）的卡片，每种动物卡片分别有各不相同的若干张，如何教会幼儿园的小朋友们认识这些卡片上的不同动物？


    常规的教学流程是，如果拿出的是猴子卡片，就告诉小朋友们这是猴子，如果拿出的是狮子卡片，就告诉小朋友们这是狮子；以此类推，拿出画有哪种动物的卡片，就告诉小朋友们这是哪种动物。在反复教学几轮后，小朋友们大概就能区分哪些卡片是猴子，哪些卡片是狮子了。这便是所谓的监督学习过程，而事先告知的卡片与动物的对应关系，便是样本的标签，即监督信号，小朋友们对这些动物卡片的记忆方法就是监督学习算法。


    常见的监督学习算法有线性回归（`Linear Regression`）、逻辑回归（`Logistic Regression`）、K-近邻（`K-Nearest
    Neighbor`，`KNN`算法）、决策树（`Decision Tree`）、朴素贝叶斯（`Naive Bayes`）、神经网络（`Neural Network`），还有用于降维的算法——线性判别分析（`Linear
    Discriminant Analysis`，`LDA`）。无论采用哪种监督学习算法，其共同点都是教什么就学什么。即通过学习，使模型输出结果与指定样本标签值尽可能地接近。


    ## 2. 无监督学习


    与监督学习相比，无监督学习没有监督信号，它利用未知标签的样本调整模型参数，学习某种特征、规律、趋势或既定模式，从而达到所需性能要求的过程。放眼回望，人类从原始社会一路走来，文明的进步何尝不是处处伴随着无监督学习？还以动物卡片为例，人类最开始并不知道猴子叫猴子、狮子叫狮子，只知道某类动物具有相同或类似的外貌特征。例如，某类动物经常用手挠头、活泼好动，喜欢在树上窜来窜去；某类动物体格健壮，颈部覆盖着厚厚的鬃毛，食肉。久而久之，同类型具有相同行为规律与外貌特征的动物，随着时间的推移逐渐被称为猴子和狮子。这便是无监督学习的过程，这种将动物归类的方法，其实就是无监督学习中的典型算法——聚类。图
    4-1 所示为一个无监督学习示例。


    ![](img/106-1.jpg)


    图 4-1　无监督学习示例


    常见的无监督学习算法除了聚类（`Clustering`），还有降维算法──主成分分析（`Principal Component Analysis`，`PCA`）。聚类可以进一步分成
    4 类，分别为划分聚类、层次聚类、密度聚类和模型聚类。


    ## 3. 半监督学习


    半监督学习是监督学习与无监督学习相结合的机器学习，它使用大量未知标签的样本，同时使用部分已知标签的样本，用于学习某种特征、规律、趋势或既定模式。我们发现，在一些真实场景中，经常出现缺乏有标签样本的情况，而给样本打标签是一项十分费力、耗时的工作。显而易见，半监督学习的主要目的之一就是提高这方面的效率。不过，并不是所有类型的样本都满足半监督学习的要求，半监督学习依赖以下
    3 个前提假设。


    • 平滑假设，处于某个维度空间的两个距离很近的样本，标签类似。


    • 聚类假设，处于同一个聚类类别下的两个样本，标签类似。


    • 流形假设，当两个样本从高维空间映射到低维空间的同一个局部邻域![同一个数据点的附近，一种直观理解的数学表达。](img/note.png)时，标签类似。


    如果以上 3 个前提假设不成立，那么无标签样本不仅不能对模型的学习性能起改善作用，反而会损坏学习性能，导致半监督学习失效。但是，还有一些实验表明，在一些特殊情况下，即使前提假设成立，无标签样本也有可能损坏模型的学习性能。因此，要开展半监督学习，前期做好充分的数据调研尤为重要。


    常见的半监督学习算法有半监督聚类（`Semi-Supervised Clustering`）、生成对抗网络（`Generative Adversarial
    Nets`，`GAN`）、半监督分类（`Semi-supervised Classification`）及一些基于图的算法等。


    ### 4.1.2 按学习目标划分


    机器学习算法的类别除了可以根据是否有监督信号进行划分，还可以根据学习目标进行划分。顾名思义，学习目标就是算法模型最终要达到的目的。例如，识别动物卡片的算法模型，目的是区分不同的类别，用于回答“是”或“不是”类问题；销量预测、股票预测的算法模型，目的是预估某类数值的大小，用于回答“多少”类问题。这样，按照学习目标划分，可以将机器学习算法模型分成四大类。回答“是”或“不是”类问题的算法模型统称为分类（`Classification`），回答“多少”类问题的算法模型统称为回归（`Regression`）。除了分类和回归，另外两类算法分别是聚类（`Clustering`）和降维（`Dimensionality
    Reduction`）。


    分类和回归的直观区分方法如下：模型的最终预测值如果是离散的二值（如 0 和 1），就是分类；如果是一个连续的取值空间，就是回归。有读者或许已经发现，无论是分类还是回归，模型训练用的都是有标签的样本，因此它们都属于监督学习的范畴。


    事实上，分类和回归已经涵盖了机器学习中的大部分热门模型，如最近几年特别流行的神经网络及其一系列变种（卷积神经网络、循环神经网络等）。常规的聚类属于无监督学习，当然也存在半监督聚类算法。降维主要有无监督学习的主成分分析（`PCA`）算法、监督学习的线性判别分析（`LDA`）算法等。


    ### 4.2 线性回归模型与逻辑回归模型


    在监督学习模型中，线性回归模型和逻辑回归模型是最经典的两个模型，其中逻辑回归模型适用于大部分监督学习问题。不仅如此，学好线性回归模型和逻辑回归模型，对神经网络的学习也大有帮助。


    #### 4.2.1 线性回归模型


    线性回归模型是最简单、直观的机器学习算法模型之一。线性是指特征值与输出值之间是一次函数关系。例如，对于`f(x)=ωx+b`，其中`x`是特征值，`f(x)`表示输出值。回归是指通过调整一次函数的参数，使其尽可能准确地拟合数据的过程。


    我们不妨从最简单的单特征线性回归模型讲起。所谓单特征，就是一个特征，假设预测目标只与一个因素相关。例如，要预测北京市房价，单特征是每套房子的建筑面积，我们的假设就是北京房价只与建筑面积有关。假设北京房价和建筑面积的关系如图
    4-2 所示，坐标轴横坐标和纵坐标分别是建筑面积和每平方米价格。


    ![](img/108-1.jpg)


    图 4-2　建筑面积与房价关系图


    线性回归模型的目标是尽可能准确地拟合数据，即在图 4-2 中找到一条直线，使图中各点尽可能地接近这条直线。单特征线性回归模型公式为`f(x)=ax+b`，`x`为建筑面积，`f(x)`为每平方米的价格，`a`和`b`是权重参数，其中`b`称为偏置（`Bias`），单特征下的`a`是一个标量，多特征下的`a`是一个向量。那么，图
    4-2 中有这么多不同建筑面积的房价，如何找到一条合适的直线来表示它们的关系变化？这就说到机器学习中的模型训练方法了，目前最常用的模型训练方法为梯度下降法（`Gradient
    Descent`）。下面讲解梯度下降法具体是如何训练，从而求得建筑面积与房价之间的线性关系的。为了便于理解，假设线性回归模型拟合的直线经过原点，并且只考虑一个样本数据点`(1,
    4)`，那么梯度下降法的训练过程如下。


    （1）初始化模型权重参数`a`，假设初始值为 2，由于经过原点，`b`值固定为 0，并且设置训练步长`s=0.1`，设置训练终止阈值`threshold=0.01`。


    （2）将`x=1`代入`f(x)=ax`，计算实际输出值与真实值之差`Δ=f(x)-y`，得到的差值`Δ`即`loss`的值。如果`loss`的绝对值小于或等于`threshold`的值，则结束训练。


    （3）计算训练步长`s`与`loss`的积，即梯度，用权重参数`a`的值减去梯度的值来更新`a`的值，跳转至步骤（2），继续运行，直到训练结束。


    按照上述流程，每轮迭代的权重参数`a`和梯度依次为`(2,-0.2)`，`(2.2,-0.18)`，`(2.38,-0.162)`，`(2.542,-0.1458)`，……直到`loss`的值小于`threshold`的值，训练结束。此时的权重参数`a`和梯度十分接近`(4,
    0)`，因此训练得到的回归函数为`f(x)=4x`，训练迭代次数与`loss`之间的变化关系如图 4-3 所示。这个无限接近训练目标的过程，在机器学习中称为收敛（`Convergence`）。


    ![](img/110-1.jpg)


    图 4-3　训练迭代次数与`loss`值之间的变化关系


    当然，房价不可能只与建筑面积这一个因素有关系，机器学习算法模型的特征空间通常也不会只有一个维度。因此，一般使用向量`x`表示多特征值，使用向量`ω`表示多特征权重，使用标量`b`表示偏置，线性回归模型的公式就可以表示为`f(x)=ωx+b`。偏置的作用是无论在几维空间，回归函数都可以表示不经过原点的图像。通常将偏置也放到`ωx`中，具体做法是令特征向量`x`的每一维从下标
    1 开始编号，将偏置作为权重`ω0`与构造的特征值`x0=1`一起合入`ωx`的乘积之中。这样，线性回归模型公式就简化成了`f(x)=ω0～n x0～n`。


    #### 4.2.2 逻辑回归模型


    对于线性回归模型公式`f(x)=ωx`，其值域（取值范围）是未知的，`f(x)`相当于在计算`ωx`之后，直接用线性函数`y=x`将该结果“激活”输出。线性回归模型之名由此得来，`y=x`则被称为线性激活函数。既然有线性激活函数，自然就有非线性激活函数，非线性激活函数可以将未知值域映射到一个已知的值域范围内。其中最有名的非线性激活函数之一为`Sigmoid`函数。将`Sigmoid`函数作为激活函数的回归模型称为逻辑回归模型。`Sigmoid`函数的公式为


    ![](img/111-1.jpg)


    `Sigmoid`函数的图像如图 4-4 所示。


    ![](img/111-2.jpg)


    图 4-4　`Sigmoid`函数的图像


    根据`Sigmoid`函数的公式和图像可知，`Sigmoid`函数的值域为`(0, 1)`。将输出值映射到`(0, 1)`区间，目的是方便设定阈值完成二分类。无论特征维度的值是多少，逻辑回归模型都会利用阈值设定，在这个特征维度空间中将样本集合分为两部分。例如，二维空间可以用一条直线切分成两部分，三维空间可以用一个平面切分成两部分，以此类推。


    除了`Sigmoid`函数，下面介绍另外 3 种常见的激活函数，它们分别为`Sgn`函数、`Tanh`函数和`ReLU`函数。其中`ReLU`函数在神经网络中应用广泛。


    阶跃函数`Sgn`为二值输出函数，如输出-1 和 1，其函数图像如图 4-5 所示。由于阶跃函数具有不连续、不光滑的性质，而且输出值固定，因此不适合作为神经网络中的激活函数进行网络信息传递。


    ![](img/112-1.jpg)


    图 4-5　`Sgn`函数的图像


    双曲正切函数`Tanh`可以解决`Sigmoid`函数的输出值恒大于 0 的问题。其值域为`(-1, 1)`，相当于将`Sigmoid`函数沿着纵轴拉伸了一倍，然后向下平移了一个单位。`Tanh`函数的公式为


    ![](img/112-2.jpg)


    `Tanh`函数的图像如图 4-6 所示。


    ![](img/112-3.jpg)


    图 4-6　`Tanh`函数的图像


    不过，在深度神经网络中使用`Tanh`函数和`Sigmoid`函数有可能造成梯度消失问题，这个将在后面详细讲解。


    `ReLU`函数是一个非常简单实用的激活函数，其功能如下：如果输入小于 0，则输出值均为 0，否则输出值等于输入值。`ReLU`函数的值域为`0, +∞)`，其函数图像如图
    4-7 所示。


    ![图 4-7　`ReLU`函数的图像在神经网络中使用`ReLU`函数能有效缓解梯度消失问题，尤其在深度神经网络中非常实用。`ReLU`函数的变种有`LReLU`函数、`PReLU`函数和`RReLU`函数等。###
    4.3 人工神经网络在 20 世纪 40 年代，心理学家 W.S.McCulloch 和数理逻辑学家 W.Pitts 在分析、总结人类大脑神经元基本特性的基础上，提出了相应的数学模型。随着计算机硬件技术的飞速发展，神经网络从最初的单层感知结构发展成了如今流行的多层感知结构。那么，神经网络为何如此流行，具体又是如何工作的？####
    4.3.1 初识人工神经网络根据生物学研究结论，人脑神经细胞数量的数量级大约为`10¹⁰`，这些神经细胞之间通过突触（轴突和树突）相连。一种对于神经细胞运作的通俗理解为，神经细胞将所有树突传进来的信号相加，如果信号之和高于或低于某个阈值，那么细胞状态会相应地变为兴奋状态或抑制状态，由于大脑的神经细胞在不同时期的激活状态不同，因此在不同时期会表现出不同的大脑行为。机器学习中神经网络的灵感来源于人脑神经细胞的这种信号传递现象。由于是人工模拟，因此这类机器学习算法的准确称呼为人工神经网络（`Artificial
    Neural Network`，`ANN`）。与人脑神经网络类似，人工神经网络由多个人工神经元相连组成，人工神经元的数学描述如图 4-8 所示。![](img/114-1.jpg)


    图 4-8　人工神经元的数学描述


    首先，人工神经元用一个求和函数`SUM`（类似神经细胞的树突）来接收信息。在图 4-8 中，`x1～xn`代表发送至该人工神经元的信号；`w1～wn`代表这些信号作用在这个神经元上的不同程度，即这些信号的权重；偏置`b`从生物角度来看，可以理解为这个神经元本身所具备的信号弹性。然后，人工神经元用一个激活函数输出信号`y`。人工神经网络通常使用`Sigmoid`函数作为激活函数。与`Sigmoid`函数相比，`ReLU`函数具有运算速度快、缓解梯度消失问题等优势，因此应用非常广泛，通常应用于深度神经网络的中间层（隐层）。


    对于人工神经元构成的单层模型，激活函数不同，相应的名称也不同。事实上，线性回归模型和逻辑回归模型都属于人工神经网络的范畴。其中，使用线性激活函数`f(x)=x`的单层神经网络模型，就是
    4.2 节中的线性回归模型；使用非线性激活函数`Sigmoid`的单层神经网络模型，就是 4.2 节中的逻辑回归模型；使用阶跃函数作为激活函数的单层神经元模型，学术名称为感知机![“机”在机器学习领域中是算法的别称。](img/note.png)（`Perceptron`）。下面通过一个简单的例子讲解什么是单层神经元模型。假设有一男一女两个人，身高、体重分别是
    1.8m、70kg 和 1.6m、50kg，我们用这两个样本训练出一个能判断性别的单层神经元模型。


    使用`Sigmoid`函数作为激活函数，单层神经元模型的表达式为


    ![](img/115-1.jpg)


    在上述表达式中，`x`为特征输入（身高`x2`, 体重`x1`, 偏置 1），`w`为要学习的特征权重。将两人的特征数据（1.8, 70, 1）和（1.7,
    50, 1）重复输入模型中，用于学习参数向量`w`的值，学习方法采用前文讲到的梯度下降法，直到`f(x=(1.8, 70, 1))`和`f(x=(1.7,
    50, 1))`的值分别趋向 0 和 1，训练结束。


    除此之外，人工神经网络衍生出了各式各样的结构变种，如深度神经网络、卷积神经网络、递归神经网络和图神经网络等，并且开辟了形形色色的研究方向。


    #### 4.3.2 深度神经网络


    顾名思义，深度神经网络（`Deep Neural Network`，`DNN`）的神经元层数比较多，模型的输入、输出会经过比较深的人工神经网络结构，中间经过的人工神经网络层被称为隐层。既然是深度神经网络，到底多少层才能算深？业界其实没有统一的标准，一般少则三五层，多则上千层，都可以称为深度神经网络。深度神经网络其实早在
    20 世纪 60 年代就已经诞生，由于计算性能跟不上等原因沉寂了几十年。随着计算机硬件技术的飞速发展，以及深度学习的兴起，直到 21 世纪初，深度神经网络才逐渐热门起来。一个常规的深度神经网络结构如图
    4-9 所示。


    ![](img/116-1.jpg)


    图 4-9　常规的深度神经网络结构


    所有机器学习算法的学习目标，都是寻找输出与输入之间最合适的映射关系。在图 4-9 中，如果深度神经网络中的每层人工神经元都使用线性函数`y=x`作为激活函数，那么无论模型有多少层，模型最后的输出都会是原始输入经过线性变换![通俗地讲，线性变换是指仅通过加减乘除运算得到的映射关系，遵循叠加原理。叠加原理举例：`f(x)=ax`，`f(y)=ay`，`f(x+y)=a(x+y)=ax+ay=f(x)+f(y)`。](img/note.png)的结果，最终效果相当于单层人工神经元模型的效果。与线性变换相比，非线性变换![与线性变换相比，非线性变换的映射表达式存在高次项或三角函数项等非线性计算。](img/note.png)能够表达的信息要丰富很多。深度神经网络拥有强大的表达能力的原因，除了有深度外，每层神经元在激活输出时的非线性变换也至关重要。当然，深度神经网络同样面临很多训练方面的问题，如梯度消失和梯度爆炸。


    深度神经网络由于实现比较简单、直观，模型的抽象表征能力较强，因此应用范围非常广，后文讲到的各种神经网络模型其实都可以加入深度神经网络结构，从而实现更加抽象、丰富的特征学习。


    #### 4.3.3 卷积神经网络


    人类从呱呱坠地睁开眼的那一刻起，认识这个世界的主要方式之一就是通过视觉。人类通过视觉不断地认识身边事物的形状、颜色，并且在大脑中逐步构建出一个信息丰富且带有标签的万物图像库，从而通过看到的不同外貌来识别不同的事物。神经网络在计算机视觉（`Computer
    Vision`，`CV`）领域的深度运用，以及图形处理器（`Graphics Processing Unit`，`GPU`）的出现，使计算机也能像人脑一样，感知并识别这个五彩缤纷的图像世界。例如，从
    1000 万张图片中识别出猫的`Google Brain`![Google 于 2011 年开发的一套具备自主学习能力的神经网络系统。](img/note.png)，以及击败人类围棋世界冠军的人工智能机器人`AlphaGo`![Google
    旗下 DeepMind 公司开发的围棋人工智能机器人，曾先后击败李世石与柯洁。](img/note.png)，背后都用到了一种图像识别技术，即卷积神经网络（`Convolutional
    Neural Network`，`CNN`）。


