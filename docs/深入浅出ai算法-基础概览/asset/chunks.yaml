    # 第 8 章 思考与展望


    对想从事 AI 算法行业或对 AI 算法抱有兴趣的读者而言，在各种算法培训、学习资料应接不暇的大环境下，本书向读者较为简明、完整地描绘了一条算法入门之路。或许有不少读者对第
    3 章中的内容心存疑惑，入门学习 AI 算法是否有必要学习这些基础算法技能？笔者认为是有必要的，理由有二。其一，对于算法工程前期的数据统计验证工作，适当掌握一些基础算法技能，有助于我们写出更高效的数据分析程序；其二，掌握一些常见的基础算法思路，可以帮助我们培养更好的逻辑思维，这一点在模型实践过程中的作用不言自明。当然，本章的目的不是要阐述前面每章节的必要性，而是谈一谈笔者对
    AI 算法行业的思考与展望。


    ## 8.1 思考


    ### 8.1.1 人工智能感悟


    人工智能是研究、开发用于模拟、延伸和扩展人的智能的理论、方法、技术及应用系统的一门新的科学技术。算法、数据和算力被称为推动人工智能发展的三个重要基础，而决定智能程度高低的关键因素就是算法。如果将数据比作知识，将算力比作精力，那么算法相当于学习方法。如果一个人不花费精力使用合适的方法学习，那么这个人很难达到较高的智能程度。从这个角度来看，算法对人工智能的发展起着重要作用。


