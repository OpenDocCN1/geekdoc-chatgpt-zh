  toc: []
- raw: "可以使用暴力枚举法，即通过每次遍历这段区间内的序列来找出最大值，其时间复杂度为O(N)。但是在序列长度很长的情况下，这种算法的查询速度实在太慢。由于线段树具有二叉结构，因此可以将该问题的时间复杂度降至O(logN)。例如，有一个长度为6的序列\\\
    [3, 2, 6, 5, 1, 9\\]，将其构造成线段树，如图3-23所示。\n\n![](OEBPS/Images/088-1.jpg)\n\n图3-23　线段树结构示例\n\
    \n采用递归建树。灰色表示叶子节点，表示原序列，用数组存储；黑色表示非叶子节点，表示该区间内的最大值，用链表存储。在每次询问某段区间内的最大值时，从根节点开始匹配，线段如果分别处于左右节点，则分裂继续匹配，直到线段匹配成功为止，然后回溯比较最大值即可。这样每次查询最大值的时间复杂度就降为了O(logN)。\n\
    \n上面只说了线段树的基本特性，而延迟标记是线段树的精华所在。没有延迟标记，线段树的更新会变得很慢。例如，当原序列中某一段区间内的值同时增加d时，使用暴力枚举法对其进行更新的逻辑会十分复杂，时间复杂度为O(N)；而使用线段树对其进行更新的时间复杂度为O(logN)，方法是给每个节点均增加一个延迟标记，这个标记的初始值均为0。\n\
    \n例如，将\\[0, 2\\]区间内的数均增加4，从根节点开始匹配，发现根节点区间\\[0, 5\\]包含区间\\[0, 2\\]，向子节点继续查询，发现左节点区间为\\\
    [0, 2\\]，将其延迟标记值增加4，并且将左节点的值加4，变为10。由于左节点区间为\\[0, 2\\]，因此不再向下查询，开始回溯，将根节点的值更新为新子节点之间的最大值10，如图3-24所示。\n\
    \n![](OEBPS/Images/089-1.jpg)\n\n图3-24　线段树的更新\n\n在图3-24中，三角形内的数字代表每个节点的延迟标记值。之后的每次最大值查询，如果当前节点的延迟标记值大于0，那么在向下查询时会带走延迟标记，重复上述延迟操作，直到完全匹配。这种延迟查询的方式大大提高了序列更新与查询的效率。接前文，可知当前延迟标记在\\\
    [0, 2\\]区间内的节点上，在查询\\[0, 1\\]区间内的最大值时，带上延迟标记从\\[0, 2\\]区间内的节点向左子树走，更新的是\\[0, 1\\\
    ]区间内节点的值，即得到查询结果。更新后的线段树如图3-25所示。\n\n![](OEBPS/Images/089-2.jpg)\n\n图3-25　更新后的线段树\n\
    \n在更新后，\\[0, 1\\]区间内的最大值为7。这里需要注意一点，如果要带走延迟标记，那么为了保持左、右孩子节点的正确性，至少需要往每个孩子节点上带一次延迟标记，在图3-25中，\\\
    [0, 1\\]区间虽然在左子树上，但延迟标记同样需要往右子树带过去。\n\n#### 3.2.9　平衡二叉树\n\n平衡二叉树（Balanced Binary\
    \ Tree）是由G.M.Adelson-Velsky和E.M.Landis于1962年提出的，又称为AVL树。平衡二叉树属于二叉搜索树（Binary Search\
    \ Tree），所以在讲解平衡二叉树之前，不妨先讲讲什么是二叉搜索树。\n\n二叉搜索树是能够表达一定元素顺序的二叉树。由于从树根往下能进行二分查找，因此二叉搜索树通常能在O(logN)的时间复杂度下查找某些节点的元素值。但是，不加条件的二叉搜索树往往容易退化成链表，使时间复杂度变成O(N)。\n\
    \n平衡二叉树的全称为平衡二叉搜索树，主要用于解决左、右子树高度平衡问题。为了解决二叉搜索树退化成链的问题，平衡二叉树可以保证任意节点的左、右子树高度差不大于1。在表达同样序列大小关系的情况下，普通的二叉搜索树与平衡二叉树之间的区别如图3-26所示。\n\
    \n![](OEBPS/Images/090-1.jpg)\n\n图3-26　二叉搜索树与平衡二叉树之间的区别\n\n由此可见，平衡二叉树查找元素值的时间复杂度稳定在O(logN)。那么，平衡二叉树是如何保证任意节点的左、右子树高度差不大于1的呢？我们可以先想想左、右子树高度差大于1的情况一共有几种，只有将这些“大于1”的情况转变成“不大于1”的情况，二叉搜索树才能成为平衡二叉树。总体来说，左、右子树高度差大于1的情况有4种，如图3-27所示。\n\
    \n![](OEBPS/Images/091-1.jpg)\n\n图3-27　左、右子树高度差大于1的4种情况\n\n根据图3-27可知，通过镜面变换，图3-27（a）和图3-27（d）可以归为一类，图3-27（b）和图3-27（c）可以归为一类。为了将左、右子树高度差大于1的二叉搜索树调整成平衡二叉树，可以通过以下两种旋转操作实现。\n\
    \n• 单旋。对于图3-27（a），将B提到树根，A变成B的右孩子节点，E变成A的左孩子节点，即可将该二叉搜索树转换为平衡二叉树，具体变换操作如图3-28所示。同理可单旋图3-27（d）。图3-27（a）和图3-27（d）的处理区别只有左右之分，因此单旋又可以细分为左旋和右旋。\n\
    \n![](OEBPS/Images/092-1.jpg)\n\n图3-28　单旋\n\n• 双旋。双旋是指进行两次单旋。对于图3-27（b），第一次单旋是旋转A的左子树，使以B为根节点的左、右子树高度相等，并且将E提到A的左子树树根；第二次单旋，将E提到树根，A变成E的右孩子节点，即可将该二叉搜索树转换为平衡二叉树，具体变换操作如图3-29所示。同理可双旋图3-27（c）。\n\
    \n![](OEBPS/Images/092-2.jpg)\n\n图3-29　双旋\n\n任意一棵二叉搜索树，从叶子节点开始，通过单旋或双旋一直变换到根节点，可以保证任意节点的左、右子树高度差不大于1。平衡二叉树的建树变换时间复杂度为O(NlogN)。此外，平衡二叉树还有红黑树、SBT、Treap、伸展树等几个变种，感兴趣的读者可以深入学习。\n\
    \n#### 3.2.10　并查集\n\n并查集（Disjoint Set）并非常用的基础算法，却也是一种很有意思的算法。并查集能高效率地判断两个元素是否位于同一个图中。下面通过一个具体的例子讲解并查集可以解决什么问题。\n\
    \n问题描述：有N个人，约定存在血缘关系的为亲人，并且如果X和Y是亲人、Y和Z是亲人，则X和Z也是亲人。现给出M对人的血缘关系，保证这N个人都已涵盖在内。计算这N个人中一共有多少个家族，以及需要询问多少次任意两人是否属于同一个家族（询问次数用T表示）。\n\
    \n根据题目描述，不难想到暴力枚举法，即每次将有血缘关系的两个人所属的家族集合编号赋值为同一个值。可想而知，当N、M、T较大时，算法时间复杂度不可估量。此时，并查集横空出世。\n\
    \n并查集最常用的数据结构是森林，算法思路如下：首先初始化N个人作为N棵树，每棵树都作为一个家族；然后根据给出的M对血缘关系，将两个人所在的树合并为一棵新的树，组成一个新的家族。例如，有5组血缘关系，分别为(a，b)\
    \ (b，c) (d，e) (d，f) (d，b)，并查集的构建步骤如图3-30所示。\n\n在图3-30中，字母后面的数字代表家族编号。首先，(a，b)表示a和b有血缘关系，将b所在的树根指向a所在的树根，组成一棵新的家族树；然后依次按照此规则更新(b，c)\
    \ (d，e) (d，f) (d，b)这4组血缘关系。值得注意的是，在处理血缘关系(d，b)时，由于b不是当前家族树的根节点，因此需要先找到根节点a，再将a指向d。此外，为了防止树退化成链表，通常将深度较小的树的指针指向深度较大的树的根节点，因此需要将图3-30（f）中的并查集森林结构转换为并查集的平衡结构，如图3-31所示。\n\
    \n![](OEBPS/Images/094-1.jpg)\n\n图3-30　并查集的构建步骤\n\n![](OEBPS/Images/094-2.jpg)\n\
    \n图3-31　并查集的平衡结构\n\n根据图3-31可知，家族数量就是森林中最后形成的树的棵数。当查询任意两个人是否属于同一个家族时，只需分别比较这两个节点所在树的根节点编号是否相同。为了方便理解，在并查集的构建过程中，直接将子树所有节点的家族编号都设置为根节点编号。\n\
    \n不难发现，即使按照上面所讲的平衡结构构建并查集，也会面临两个问题：其一，要合并的两棵树，如果当前节点距离各自根节点的距离并非最长距离，则会直接导致平衡结构构建失败；其二，即使构建了平衡结构，本身过长的分支也仍然存在。平衡结构只是并查集的一种简单优化，并查集最有效的优化方法为路径压缩。路径压缩的优化思想如下：在每次找树根时，将经过的所有节点都指向根节点，将较长的路径变成多子树。使用路径压缩方法优化并查集的时间复杂度为O(MlogN)，而每次查询的时间复杂度为O(C)，是常数级别。使用路径压缩方法进行优化的并查集构建步骤如图3-32所示，其中路径压缩在第（c）步体现。\n\
    \n![](OEBPS/Images/095-1.jpg)\n\n图3-32　并查集的路径压缩构建步骤\n\n#### 3.2.11　匈牙利算法\n\n匈牙利算法主要用于求解二分图的最大匹配问题。二分图又称为二部图，是一种特殊的图。假设G=(V,\
    \ E)是一个无向图，如果顶点集V可以分割为两个互不相交的子集(A, B)，并且图中的每条边(i, j)所关联的两个顶点i和j分别属于这两个不同的顶点集(i\
    \ in A, j in B)，则称图G为一个二分图。二分图最大匹配是指使二分图中左右两边相连但不相交的边数最多。\n\n匈牙利算法的基本思路是查找增广路，增广路是指从一个未匹配节点出发，如果途经一个未匹配节点，则完成本轮增广路的查找，否则走交替路（出发点不算），直到交替路终止于对面未匹配节点，或者无边可走才结束。每次找出来的增广路都完成了一次两边节点的更新配对，有可能是新增配对，也有可能是修改之前的配对。\n\
    \n问题描述：现在有一个8人的小型化装舞会，一共有4男4女，将男生分别标记为A、B、C、D，将女生分别标记为a、b、c、d。现在化装舞会需要男女配对组成4队，在音乐声中一起完成华尔兹双人舞蹈。已知A与a、b、c相识，B与a、d相识，C与c、d相识，D只与b相识，熟人关系如图3-33所示。为了让大家都能与一个熟人作舞伴，要如何给这8个人配对？\n\
    \n![](OEBPS/Images/096-1.jpg)\n\n图3-33　二分图中的熟人关系\n\n针对上述例子，匈牙利算法的执行步骤如图3-34所示。\n\
    \n![](OEBPS/Images/097-1.jpg)\n\n图3-34　匈牙利算法的执行步骤\n\n按ABCD的顺序进行匹配，先匹配A和B。加粗虚线表示当前找到的增广路，加粗实线表示当前的配对。首先，图3-34（a）找到增广路A→a，图3-34（b）将增广路中的A和a配对；然后，图3-34（c）找到增广路B→a→A→b，图3-34（d）将增广路中的A和a解除配对，然后将B和a、A和b分别配对。这里可以看出，由于二分图的性质，增广路中每隔一条边匹配一条边，总能保证配对最大。接着配C和D。图3-34（e）找到增广路C→c，图3-34（f）将增广路中的C和c配对，图3-34（g）找到增广路D→b→A→a→B→d，图3-34（h）将增广路中的B和a、A和b解除配对，然后将D和b、A和a、B和d分别配对。至此，图中再无增广路，匈牙利算法结束。可知在每次查找增广路时，在最差情况下会遍历所有边。因此匈牙利算法的时间复杂度为O(NM)，其中N表示二分图半边的点数，M表示二分图的总边数。\n\
    \n### 3.3　在线评测系统\n\n在线评测系统（Online Judge，OJ）是一种在编程竞赛中评测参赛程序的在线系统，也可以用于平时练习。近年来也出现了一些针对求职面试的在线评测系统。许多OJ网站会自发组织一些竞赛。此外，OJ网站通常会设立用户排名（以用户提交的答案通过数或某个题目的执行时间为排名依据）。\n\
    \n在OJ上提交评测程序后，系统后台会执行提交的程序，根据题目的要求输入数据，得到并评测该程序的输出结果。只有返回“Accepted”状态，才表示提交的程序正确。不同OJ的评测状态分类略有出入，大致可以分为3类，如表3-2所示。\n\
    \n表3-2　OJ的评测状态分类\n\n![](OEBPS/Images/098-1.jpg)\n\n比较有名的国外OJ有LeetCode、Topcoder，国内OJ有北大的POJ、浙大ZOJ，以及胡伟栋的Tsinsen清橙网络自动评测系统。\n\
    \n#### 3.3.1　LeetCode\n\nLeetCode是一种在线评测系统，不仅形成了题库、社区、竞赛三剑合璧的生态系统，而且打通了通往全世界各大互联网公司的求职通道。此外，LeetCode特别推出了LeetCode中国版的官方网站。\n\
    \n根据题目类型，可以将题目分为6类，分别为System Design、OO Design、Operating System、Algorithms、Database和Shell；根据题目难易程度，可以分为3类，分别为Easy、Medium和Hard。每题都有一个总的提交通过率，并且提供解题思路留言讨论区。题库还会提供若干个专题标签，用于给刷题者提供有针对性的索引。例如，算法类别专题标签有数组相关、图相关、动态规划相关；公司面试划分专题标签有谷歌公司面试最热100题、Facebook公司面试最热100题等。\n\
    \n#### 3.3.2　POJ与ZOJ\n\nPOJ和ZOJ等以大学为代表的在线评测系统，主要用于竞赛培训，如IOI国际信息学奥林匹克竞赛、ACM国际大学生程序设计竞赛等。\n\
    \nPOJ（Peking University Online Judge，北京大学程序在线评测系统）是一个提供编程题目的网站，它包含3000多道程序设计题，题目大部分来自ACM国际大学生程序设计竞赛和各种自行举办的竞赛，很多题目可以反映工作和生活中的实际问题。\n\
    \nZOJ（Zhejiang University Online Judge，浙江大学程序在线评测系统）是一个提供信息学（算法竞赛）题库及进行在线程序评测的网站，它也包含3000多道程序设计题，题目大部分来自ACM国际大学生程序设计竞赛、全球各大赛区及著名大学的竞赛。\n\
    \n#### 3.3.3　Tsinsen\n\n很多人或许没有听说过Tsinsen清橙网络自动评测系统，但应该对其背后的开发者有所耳闻，那就是两届IOI金牌得主、清华大学计算机科学实验班毕业的胡伟栋。清橙网络自动评测系统和胡伟栋，对笔者而言并不陌生，因为笔者和胡伟栋曾就读于同一所高中，而且笔者也算是清橙的首批用户。\n\
    \n笔者记得在刚上高一时，参加了学校的信息学竞赛兴趣小组。那时我们不像现在有五花八门的OJ用于学习编程，尤其对于DIY题目，手动评测甚是麻烦。清橙网络自动评测系统就是那时由胡伟栋开发的一个自动评测系统，专门用于模拟竞赛评测。该系统后来升级，搬到了网上，也就是现在的清橙网络自动评测系统。比较遗憾的是，清橙网络自动评测系统于2019年9月1日不再对外提供服务。\n\
    \n### 3.4　动脑时刻\n\n1\\. 为什么斐波那契数列不适合使用递归算法求解？\n\n2\\. 如何使用递归算法解决汉诺塔![相传在古印度圣庙中，有一种被称为汉诺塔（Tower\
    \ of Hanoi）的游戏。在一块铜板装置上，有三根杆（编号A、B、C），在A杆上自下而上按从大到小的顺序放置着64个金盘。游戏的目标：将A杆上的金盘全部移到C杆上，并且使所有金盘保持原有顺序叠放。操作规则：每次只能移动一个金盘，并且在移动过程中三根杆上始终保持大盘在下、小盘在上，操作过程中金盘可以放置于A、B、C任意一根杆上。](OEBPS/Images/note.png)问题？\n\
    \n3\\. 背包问题有很多变种与升级版本，本书讲解的是01背包问题，也是最基础的背包问题。如果同一种物品可以无限装包，这样的背包问题称为完全背包问题。那么，动态规划如何解决完全背包问题？\n\
    \n4\\. 导弹拦截问题，每次的导弹拦截高度都不能高于前一次，现在连续有N枚导弹袭击，高度分别为Hi（i为1～N的整数），最多能拦截多少枚导弹？写出动态转移方程即可。\n\
    \n5\\. 为什么迪杰斯特拉算法无法计算带负边的图，而贝尔曼-福特算法可以？\n\n6\\. 从算法原理上解释为什么普里姆算法适合稠密图，而克鲁斯卡尔算法适合稀疏图。\n\
    \n7\\. 如何计算树状数组中任意子序列中的所有元素之和？\n\n8\\. 为什么说树状数组对计算任意子序列中的最大值和最小值束手无策？\n\n### 3.5　本章小结\n\
    \n本章首先讲解了数据结构，包括数组、链表、队列、栈、树、图和散列表这几种数据结构的性质与用法。然后讲解了几种常用的基础算法，帮助大家拓展思维边界，提高思考能力。最后简单介绍了几个比较流行的在线评测系统，大家可以在这些在线评测系统上进行基础算法的实战训练。\n\
    \n数据结构和基础算法作为算法的基本招式，对之后更加顺利地学习算法的各种武功秘籍大有裨益。\n\n### 关键词回顾\n\n数据结构\n\n数组\n\n多维数组\n\
    \n链表\n\n多维链表\n\n队列\n\n先进先出FIFO\n\n栈\n\n后进先出LIFO\n\n树\n\n二叉树\n\n森林\n\n图\n\n有向图\n\
    \n无向图\n\n邻接链表\n\n邻接矩阵\n\n散列表/哈希表\n\n排序\n\n选择排序\n\n插入排序\n\n冒泡排序\n\n快速排序\n\n堆排序\n\
    \n归并排序\n\n计数排序\n\n桶排序\n\n基数排序\n\n递归\n\n分治\n\n贪婪算法\n\n动态规划\n\n背包问题\n\n动态转移方程\n\n\
    搜索\n\n深度优先搜索\n\n宽度优先搜索\n\n最短路径\n\n弗洛伊德算法\n\n迪杰斯特拉算法\n\n贝尔曼-福特算法\n\n最小生成树\n\n普里姆算法\n\
    \n克鲁斯卡尔算法\n\n树状数组\n\n线段树\n\n二叉搜索树\n\n平衡二叉树\n\n单旋和双旋\n\n并查集\n\n路径压缩\n\n匈牙利算法\n\n\
    在线评测系统\n\nLeetCode\n\nPOJ与ZOJ\n\nTsinsen\n\n## 第4章  \n\n算法之武功秘籍\n\n归根结底，算法的目标是解决生活中的实际问题。在第2章和第3章中，我们讨论了算法内力（相关的数学基础知识）及算法招式（数据结构和常用的基础算法）。运用算法的内力和招式，可以解决生活中的大部分简单问题。但是当问题变得复杂时，如分类问题（如社交媒体的用户兴趣分类和热点关注话题分类）、推荐问题（如电商平台商品的推荐和排序问题）、预测问题（如预测股价走向、交通流量、商品销量）及与人工智能有关的问题（如怎样让计算机学会自动驾驶、下棋、对话）等，只用算法的内力和招式是远远不够的，此时需要更加精妙的算法武功秘籍。因为算法招式解决的只是某一类小问题，或者是大问题中的某一小块，就好比武当的梯云纵，解决的只是“腾空而上”这样的小问题。真正比武的时候，还要用太极拳、太极剑这类武功秘籍才可以克敌制胜。\n\
    \n本章会介绍机器学习算法的分类，并且详细介绍不同分类下的算法原理，帮助大家熟悉算法世界中的武功秘籍。\n\n### 4.1　类别划分\n\n机器学习涉及各式各样的算法，所解决的问题涵盖生活中的方方面面。本节分别从两大出发点归纳总结机器学习中的算法，帮助大家对机器学习算法有一个整体把握。其中，第一个出发点为是否有监督信号，第二个出发点为学习目标。\n\
    \n#### 4.1.1　按是否有监督信号划分"
  fmt: "\n可以使用暴力枚举法，即通过每次遍历这段区间内的序列来找出最大值，其时间复杂度为`O(N)`。但是在序列长度很长的情况下，这种算法的查询速度实在太慢。由于线段树具有二叉结构，因此可以将该问题的时间复杂度降至`O(logN)`。例如，有一个长度为6的序列\\\
    [3, 2, 6, 5, 1, 9\\]，将其构造成线段树，如图3-23所示。\n\n![](OEBPS/Images/088-1.jpg)\n\n图3-23　线段树结构示例\n\
    \n采用递归建树。灰色表示叶子节点，表示原序列，用数组存储；黑色表示非叶子节点，表示该区间内的最大值，用链表存储。在每次询问某段区间内的最大值时，从根节点开始匹配，线段如果分别处于左右节点，则分裂继续匹配，直到线段匹配成功为止，然后回溯比较最大值即可。这样每次查询最大值的时间复杂度就降为了`O(logN)`。\n\
    \n上面只说了线段树的基本特性，而延迟标记是线段树的精华所在。没有延迟标记，线段树的更新会变得很慢。例如，当原序列中某一段区间内的值同时增加`d`时，使用暴力枚举法对其进行更新的逻辑会十分复杂，时间复杂度为`O(N)`；而使用线段树对其进行更新的时间复杂度为`O(logN)`，方法是给每个节点均增加一个延迟标记，这个标记的初始值均为0。\n\
    \n例如，将\\[0, 2\\]区间内的数均增加4，从根节点开始匹配，发现根节点区间\\[0, 5\\]包含区间\\[0, 2\\]，向子节点继续查询，发现左节点区间为\\\
    [0, 2\\]，将其延迟标记值增加4，并且将左节点的值加4，变为10。由于左节点区间为\\[0, 2\\]，因此不再向下查询，开始回溯，将根节点的值更新为新子节点之间的最大值10，如图3-24所示。\n\
    \n![](OEBPS/Images/089-1.jpg)\n\n图3-24　线段树的更新\n\n在图3-24中，三角形内的数字代表每个节点的延迟标记值。之后的每次最大值查询，如果当前节点的延迟标记值大于0，那么在向下查询时会带走延迟标记，重复上述延迟操作，直到完全匹配。这种延迟查询的方式大大提高了序列更新与查询的效率。接前文，可知当前延迟标记在\\\
    [0, 2\\]区间内的节点上，在查询\\[0, 1\\]区间内的最大值时，带上延迟标记从\\[0, 2\\]区间内的节点向左子树走，更新的是\\[0, 1\\\
    ]区间内节点的值，即得到查询结果。更新后的线段树如图3-25所示。\n\n![](OEBPS/Images/089-2.jpg)\n\n图3-25　更新后的线段树\n\
    \n在更新后，\\[0, 1\\]区间内的最大值为7。这里需要注意一点，如果要带走延迟标记，那么为了保持左、右孩子节点的正确性，至少需要往每个孩子节点上带一次延迟标记，在图3-25中，\\\
    [0, 1\\]区间虽然在左子树上，但延迟标记同样需要往右子树带过去。\n\n#### 3.2.9　平衡二叉树\n\n平衡二叉树（Balanced Binary\
    \ Tree）是由G.M.Adelson-Velsky和E.M.Landis于1962年提出的，又称为AVL树。平衡二叉树属于二叉搜索树（Binary Search\
    \ Tree），所以在讲解平衡二叉树之前，不妨先讲讲什么是二叉搜索树。\n\n二叉搜索树是能够表达一定元素顺序的二叉树。由于从树根往下能进行二分查找，因此二叉搜索树通常能在`O(logN)`的时间复杂度下查找某些节点的元素值。但是，不加条件的二叉搜索树往往容易退化成链表，使时间复杂度变成`O(N)`。\n\
    \n平衡二叉树的全称为平衡二叉搜索树，主要用于解决左、右子树高度平衡问题。为了解决二叉搜索树退化成链的问题，平衡二叉树可以保证任意节点的左、右子树高度差不大于1。在表达同样序列大小关系的情况下，普通的二叉搜索树与平衡二叉树之间的区别如图3-26所示。\n\
    \n![](OEBPS/Images/090-1.jpg)\n\n图3-26　二叉搜索树与平衡二叉树之间的区别\n\n由此可见，平衡二叉树查找元素值的时间复杂度稳定在`O(logN)`。那么，平衡二叉树是如何保证任意节点的左、右子树高度差不大于1的呢？我们可以先想想左、右子树高度差大于1的情况一共有几种，只有将这些“大于1”的情况转变成“不大于1”的情况，二叉搜索树才能成为平衡二叉树。总体来说，左、右子树高度差大于1的情况有4种，如图3-27所示。\n\
    \n![](OEBPS/Images/091-1.jpg)\n\n图3-27　左、右子树高度差大于1的4种情况\n\n根据图3-27可知，通过镜面变换，图3-27（a）和图3-27（d）可以归为一类，图3-27（b）和图3-27（c）可以归为一类。为了将左、右子树高度差大于1的二叉搜索树调整成平衡二叉树，可以通过以下两种旋转操作实现。\n\
    \n• 单旋。对于图3-27（a），将`B`提到树根，`A`变成`B`的右孩子节点，`E`变成`A`的左孩子节点，即可将该二叉搜索树转换为平衡二叉树，具体变换操作如图3-28所示。同理可单旋图3-27（d）。图3-27（a）和图3-27（d）的处理区别只有左右之分，因此单旋又可以细分为左旋和右旋。\n\
    \n![](OEBPS/Images/092-1.jpg)\n\n图3-28　单旋\n\n• 双旋。双旋是指进行两次单旋。对于图3-27（b），第一次单旋是旋转`A`的左子树，使以`B`为根节点的左、右子树高度相等，并且将`E`提到`A`的左子树树根；第二次单旋，将`E`提到树根，`A`变成`E`的右孩子节点，即可将该二叉搜索树转换为平衡二叉树，具体变换操作如图3-29所示。同理可双旋图3-27（c）。\n\
    \n![](OEBPS/Images/092-2.jpg)\n\n图3-29　双旋\n\n任意一棵二叉搜索树，从叶子节点开始，通过单旋或双旋一直变换到根节点，可以保证任意节点的左、右子树高度差不大于1。平衡二叉树的建树变换时间复杂度为`O(NlogN)`。此外，平衡二叉树还有红黑树、SBT、Treap、伸展树等几个变种，感兴趣的读者可以深入学习。\n\
    \n#### 3.2.10　并查集\n\n并查集（Disjoint Set）并非常用的基础算法，却也是一种很有意思的算法。并查集能高效率地判断两个元素是否位于同一个图中。下面通过一个具体的例子讲解并查集可以解决什么问题。\n\
    \n问题描述：有`N`个人，约定存在血缘关系的为亲人，并且如果`X`和`Y`是亲人、`Y`和`Z`是亲人，则`X`和`Z`也是亲人。现给出`M`对人的血缘关系，保证这`N`个人都已涵盖在内。计算这`N`个人中一共有多少个家族，以及需要询问多少次任意两人是否属于同一个家族（询问次数用`T`表示）。\n\
    \n根据题目描述，不难想到暴力枚举法，即每次将有血缘关系的两个人所属的家族集合编号赋值为同一个值。可想而知，当`N`、`M`、`T`较大时，算法时间复杂度不可估量。此时，并查集横空出世。\n\
    \n并查集最常用的数据结构是森林，算法思路如下：首先初始化`N`个人作为`N`棵树，每棵树都作为一个家族；然后根据给出的`M`对血缘关系，将两个人所在的树合并为一棵新的树，组成一个新的家族。例如，有5组血缘关系，分别为(`a`，`b`)\
    \ (`b`，`c`) (`d`，`e`) (`d`，`f`) (`d`，`b`)，并查集的构建步骤如图3-30所示。\n\n在图3-30中，字母后面的数字代表家族编号。首先，(`a`，`b`)表示`a`和`b`有血缘关系，将`b`所在的树根指向`a`所在的树根，组成一棵新的家族树；然后依次按照此规则更新(`b`，`c`)\
    \ (`d`，`e`) (`d`，`f`) (`d`，`b`)这4组血缘关系。值得注意的是，在处理血缘关系(`d`，`b`)时，由于`b`不是当前家族树的根节点，因此需要先找到根节点`a`，再将`a`指向`d`。此外，为了防止树退化成链表，通常将深度较小的树的指针指向深度较大的树的根节点，因此需要将图3-30（f）中的并查集森林结构转换为并查集的平衡结构，如图3-31所示。\n\
    \n![](OEBPS/Images/094-1.jpg)\n\n图3-30　并查集的构建步骤\n\n![](OEBPS/Images/094-2.jpg)\n\
    \n图3-31　并查集的平衡结构\n\n根据图3-31可知，家族数量就是森林中最后形成的树的棵数。当查询任意两个人是否属于同一个家族时，只需分别比较这两个节点所在树的根节点编号是否相同。为了方便理解，在并查集的构建过程中，直接将子树所有节点的家族编号都设置为根节点编号。\n\
    \n不难发现，即使按照上面所讲的平衡结构构建并查集，也会面临两个问题：其一，要合并的两棵树，如果当前节点距离各自根节点的距离并非最长距离，则会直接导致平衡结构构建失败；其二，即使构建了平衡结构，本身过长的分支也仍然存在。平衡结构只是并查集的一种简单优化，并查集最有效的优化方法为路径压缩。路径压缩的优化思想如下：在每次找树根时，将经过的所有节点都指向根节点，将较长的路径变成多子树。使用路径压缩方法优化并查集的时间复杂度为`O(MlogN)`，而每次查询的时间复杂度为`O(C)`，是常数级别。使用路径压缩方法进行优化的并查集构建步骤如图3-32所示，其中路径压缩在第（c）步体现。\n\
    \n![](OEBPS/Images/095-1.jpg)\n\n图3-32　并查集的路径压缩构建步骤\n\n#### 3.2.11　匈牙利算法\n\n匈牙利算法主要用于求解二分图的最大匹配问题。二分图又称为二部图，是一种特殊的图。假设`G=(V,\
    \ E)`是一个无向图，如果顶点集`V`可以分割为两个互不相交的子集(`A`, `B`)，并且图中的每条边(`i`, `j`)所关联的两个顶点`i`和`j`分别属于这两个不同的顶点集(`i\
    \ in A, j in B`)，则称图`G`为一个二分图。二分图最大匹配是指使二分图中左右两边相连但不相交的边数最多。\n\n匈牙利算法的基本思路是查找增广路，增广路是指从一个未匹配节点出发，如果途经一个未匹配节点，则完成本轮增广路的查找，否则走交替路（出发点不算），直到交替路终止于对面未匹配节点，或者无边可走才结束。每次找出来的增广路都完成了一次两边节点的更新配对，有可能是新增配对，也有可能是修改之前的配对。\n\
    \n问题描述：现在有一个8人的小型化装舞会，一共有4男4女，将男生分别标记为`A`、`B`、`C`、`D`，将女生分别标记为`a`、`b`、`c`、`d`。现在化装舞会需要男女配对组成4队，在音乐声中一起完成华尔兹双人舞蹈。已知`A`与`a`、`b`、`c`相识，`B`与`a`、`d`相识，`C`与`c`、`d`相识，`D`只与`b`相识，熟人关系如图3-33所示。为了让大家都能与一个熟人作舞伴，要如何给这8个人配对？\n\
    \n![](OEBPS/Images/096-1.jpg)\n\n图3-33　二分图中的熟人关系\n\n针对上述例子，匈牙利算法的执行步骤如图3-34所示。\n\
    \n![](OEBPS/Images/097-1.jpg)\n\n图3-34　匈牙利算法的执行步骤\n\n按`ABCD`的顺序进行匹配，先匹配`A`和`B`。加粗虚线表示当前找到的增广路，加粗实线表示当前的配对。首先，图3-34（a）找到增广路`A→a`，图3-34（b）将增广路中的`A`和`a`配对；然后，图3-34（c）找到增广路`B→a→A→b`，图3-34（d）将增广路中的`A`和`a`解除配对，然后将`B`和`a`、`A`和`b`分别配对。这里可以看出，由于二分图的性质，增广路中每隔一条边匹配一条边，总能保证配对最大。接着配`C`和`D`。图3-34（e）找到增广路`C→c`，图3-34（f）将增广路中的`C`和`c`配对，图3-34（g）找到增广路`D→b→A→a→B→d`，图3-34（h）将增广路中的`B`和`a`、`A`和`b`解除配对，然后将`D`和`b`、`A`和`a`、`B`和`d`分别配对。至此，图中再无增广路，匈牙利算法结束。可知在每次查找增广路时，在最差情况下会遍历所有边。因此匈牙利算法的时间复杂度为`O(NM)`，其中`N`表示二分图半边的点数，`M`表示二分图的总边数。\n\
    \n### 3.3　在线评测系统\n\n在线评测系统（Online Judge，`OJ`）是一种在编程竞赛中评测参赛程序的在线系统，也可以用于平时练习。近年来也出现了一些针对求职面试的在线评测系统。许多`OJ`网站会自发组织一些竞赛。此外，`OJ`网站通常会设立用户排名（以用户提交的答案通过数或某个题目的执行时间为排名依据）。\n\
    \n在`OJ`上提交评测程序后，系统后台会执行提交的程序，根据题目的要求输入数据，得到并评测该程序的输出结果。只有返回“Accepted”状态，才表示提交的程序正确。不同`OJ`的评测状态分类略有出入，大致可以分为3类，如表3-2所示。\n\
    \n表3-2　`OJ`的评测状态分类\n\n![](OEBPS/Images/098-1.jpg)\n\n比较有名的国外`OJ`有LeetCode、Topcoder，国内`OJ`有北大的`POJ`、浙大`ZOJ`，以及胡伟栋的Tsinsen清橙网络自动评测系统。\n\
    \n#### 3.3.1　LeetCode\n\n`LeetCode`是一种在线评测系统，不仅形成了题库、社区、竞赛三剑合璧的生态系统，而且打通了通往全世界各大互联网公司的求职通道。此外，`LeetCode`特别推出了`LeetCode`中国版的官方网站。\n\
    \n根据题目类型，可以将题目分为6类，分别为System Design、OO Design、Operating System、Algorithms、Database和Shell；根据题目难易程度，可以分为3类，分别为Easy、Medium和Hard。每题都有一个总的提交通过率，并且提供解题思路留言讨论区。题库还会提供若干个专题标签，用于给刷题者提供有针对性的索引。例如，算法类别专题标签有数组相关、图相关、动态规划相关；公司面试划分专题标签有谷歌公司面试最热100题、Facebook公司面试最热100题等。\n\
    \n#### 3.3.2　POJ与ZOJ\n\n`POJ`和`ZOJ`等以大学为代表的在线评测系统，主要用于竞赛培训，如`IOI`国际信息学奥林匹克竞赛、`ACM`国际大学生程序设计竞赛等。\n\
    \n`POJ`（Peking University Online Judge，北京大学程序在线评测系统）是一个提供编程题目的网站，它包含3000多道程序设计题，题目大部分来自`ACM`国际大学生程序设计竞赛和各种自行举办的竞赛，很多题目可以反映工作和生活中的实际问题。\n\
    \n`ZOJ`（Zhejiang University Online Judge，浙江大学程序在线评测系统）是一个提供信息学（算法竞赛）题库及进行在线程序评测的网站，它也包含3000多道程序设计题，题目大部分来自`ACM`国际大学生程序设计竞赛、全球各大赛区及著名大学的竞赛。\n\
    \n#### 3.3.3　Tsinsen\n\n很多人或许没有听说过Tsinsen清橙网络自动评测系统，但应该对其背后的开发者有所耳闻，那就是两届`IOI`金牌得主、清华大学计算机科学实验班毕业的胡伟栋。清橙网络自动评测系统和胡伟栋，对笔者而言并不陌生，因为笔者和胡伟栋曾就读于同一所高中，而且笔者也算是清橙的首批用户。\n\
    \n笔者记得在刚上高一时，参加了学校的信息学竞赛兴趣小组。那时我们不像现在有五花八门的`OJ`用于学习编程，尤其对于`DIY`题目，手动评测甚是麻烦。清橙网络自动评测系统就是那时由胡伟栋开发的一个自动评测系统，专门用于模拟竞赛评测。该系统后来升级，搬到了网上，也就是现在的清橙网络自动评测系统。比较遗憾的是，清橙网络自动评测系统于2019年9月1日不再对外提供服务。\n\
    \n### 3.4　动脑时刻\n\n1\\. 为什么斐波那契数列不适合使用递归算法求解？\n\n2\\. 如何使用递归算法解决汉诺塔![相传在古印度圣庙中，有一种被称为汉诺塔（Tower\
    \ of Hanoi）的游戏。在一块铜板装置上，有三根杆（编号`A`、`B`、`C`），在`A`杆上自下而上按从大到小的顺序放置着64个金盘。游戏的目标：将`A`杆上的金盘全部移到`C`杆上，并且使所有金盘保持原有顺序叠放。操作规则：每次只能移动一个金盘，并且在移动过程中三根杆上始终保持大盘在下、小盘在上，操作过程中金盘可以放置于`A`、`B`、`C`任意一根杆上。](OEBPS/Images/note.png)问题？\n\
    \n3\\. 背包问题有很多变种与升级版本，本书讲解的是01背包问题，也是最基础的背包问题。如果同一种物品可以无限装包，这样的背包问题称为完全背包问题。那么，动态规划如何解决完全背包问题？\n\
    \n4\\. 导弹拦截问题，每次的导弹拦截高度都不能高于前一次，现在连续有`N`枚导弹袭击，高度分别为`Hi`（`i`为1～`N`的整数），最多能拦截多少枚导弹？写出动态转移方程即可。\n\
    \n5\\. 为什么迪杰斯特拉算法无法计算带负边的图，而贝尔曼-福特算法可以？\n\n6\\. 从算法原理上解释为什么普里姆算法适合稠密图，而克鲁斯卡尔算法适合稀疏图。\n\
    \n7\\. 如何计算树状数组中任意子序列中的所有元素之和？\n\n8\\. 为什么说树状数组对计算任意子序列中的最大值和最小值束手无策？\n\n### 3.5　本章小结\n\
    \n本章首先讲解了数据结构，包括数组、链表、队列、栈、树、图和散列表这几种数据结构的性质与用法。然后讲解了几种常用的基础算法，帮助大家拓展思维边界，提高思考能力。最后简单介绍了几个比较流行的在线评测系统，大家可以在这些在线评测系统上进行基础算法的实战训练。\n\
    \n数据结构和基础算法作为算法的基本招式，对之后更加顺利地学习算法的各种武功秘籍大有裨益。\n\n### 关键词回顾\n\n数据结构\n\n数组\n\n多维数组\n\
    \n链表\n\n多维链表\n\n队列\n\n先进先出`FIFO`\n\n栈\n\n后进先出`LIFO`\n\n树\n\n二叉树\n\n森林\n\n图\n\n\
    有向图\n\n无向图\n\n邻接链表\n\n邻接矩阵\n\n散列表/哈希表\n\n排序\n\n选择排序\n\n插入排序\n\n冒泡排序\n\n快速排序\n\n\
    堆排序\n\n归并排序\n\n计数排序\n\n桶排序\n\n基数排序\n\n递归\n\n分治\n\n贪婪算法\n\n动态规划\n\n背包问题\n\n动态转移方程\n\
    \n搜索\n\n深度优先搜索\n\n宽度优先搜索\n\n最短路径\n\n弗洛伊德算法\n\n迪杰斯特拉算法\n\n贝尔曼-福特算法\n\n最小生成树\n\n\
    普里姆算法\n\n克鲁斯卡尔算法\n\n树状数组\n\n线段树\n\n二叉搜索树\n\n平衡二叉树\n\n单旋和双旋\n\n并查集\n\n路径压缩\n\n\
    匈牙利算法\n\n在线评测系统\n\nLeetCode\n\nPOJ与ZOJ\n\nTsinsen\n\n## 第4章  \n算法之武功秘籍\n\n归根结底，算法的目标是解决生活中的实际问题。在第2章和第3章中，我们讨论了算法内力（相关的数学基础知识）及算法招式（数据结构和常用的基础算法）。运用算法的内力和招式，可以解决生活中的大部分简单问题。但是当问题变得复杂时，如分类问题（如社交媒体的用户兴趣分类和热点关注话题分类）、推荐问题（如电商平台商品的推荐和排序问题）、预测问题（如预测股价走向、交通流量、商品销量）及与人工智能有关的问题（如怎样让计算机学会自动驾驶、下棋、对话）等，只用算法的内力和招式是远远不够的，此时需要更加精妙的算法武功秘籍。因为算法招式解决的只是某一类小问题，或者是大问题中的某一小块，就好比武当的梯云纵，解决的只是“腾空而上”这样的小问题。真正比武的时候，还要用太极拳、太极剑这类武功秘籍才可以克敌制胜。\n\
    \n本章会介绍机器学习算法的分类，并且详细介绍不同分类下的算法原理，帮助大家熟悉算法世界中的武功秘籍。\n\n### 4.1　类别划分\n\n机器学习涉及各式各样的算法，所解决的问题涵盖生活中的方方面面。本节分别从两大出发点归纳总结机器学习中的算法，帮助大家对机器学习算法有一个整体把握。其中，第一个出发点为是否有监督信号，第二个出发点为学习目标。\n\
    \n#### 4.1.1　按是否有监督信号划分\n"
  trans: "\n\n可以使用暴力枚举法，即通过每次遍历这段区间内的序列来找出最大值，其时间复杂度为`O(N)`。但是在序列长度很长的情况下，这种算法的查询速度实在太慢。由于线段树具有二叉结构，因此可以将该问题的时间复杂度降至`O(logN)`。例如，有一个长度为\
    \ 6 的序列\\[3, 2, 6, 5, 1, 9\\]，将其构造成线段树，如图 3-23 所示。\n\n![](img/088-1.jpg)\n\n图\
    \ 3-23　线段树结构示例\n\n采用递归建树。灰色表示叶子节点，表示原序列，用数组存储；黑色表示非叶子节点，表示该区间内的最大值，用链表存储。在每次询问某段区间内的最大值时，从根节点开始匹配，线段如果分别处于左右节点，则分裂继续匹配，直到线段匹配成功为止，然后回溯比较最大值即可。这样每次查询最大值的时间复杂度就降为了`O(logN)`。\n\
    \n上面只说了线段树的基本特性，而延迟标记是线段树的精华所在。没有延迟标记，线段树的更新会变得很慢。例如，当原序列中某一段区间内的值同时增加`d`时，使用暴力枚举法对其进行更新的逻辑会十分复杂，时间复杂度为`O(N)`；而使用线段树对其进行更新的时间复杂度为`O(logN)`，方法是给每个节点均增加一个延迟标记，这个标记的初始值均为\
    \ 0。\n\n例如，将\\[0, 2\\]区间内的数均增加 4，从根节点开始匹配，发现根节点区间\\[0, 5\\]包含区间\\[0, 2\\]，向子节点继续查询，发现左节点区间为\\\
    [0, 2\\]，将其延迟标记值增加 4，并且将左节点的值加 4，变为 10。由于左节点区间为\\[0, 2\\]，因此不再向下查询，开始回溯，将根节点的值更新为新子节点之间的最大值\
    \ 10，如图 3-24 所示。\n\n![](img/089-1.jpg)\n\n图 3-24　线段树的更新\n\n在图 3-24 中，三角形内的数字代表每个节点的延迟标记值。之后的每次最大值查询，如果当前节点的延迟标记值大于\
    \ 0，那么在向下查询时会带走延迟标记，重复上述延迟操作，直到完全匹配。这种延迟查询的方式大大提高了序列更新与查询的效率。接前文，可知当前延迟标记在\\[0,\
    \ 2\\]区间内的节点上，在查询\\[0, 1\\]区间内的最大值时，带上延迟标记从\\[0, 2\\]区间内的节点向左子树走，更新的是\\[0, 1\\\
    ]区间内节点的值，即得到查询结果。更新后的线段树如图 3-25 所示。\n\n![](img/089-2.jpg)\n\n图 3-25　更新后的线段树\n\n\
    在更新后，\\[0, 1\\]区间内的最大值为 7。这里需要注意一点，如果要带走延迟标记，那么为了保持左、右孩子节点的正确性，至少需要往每个孩子节点上带一次延迟标记，在图\
    \ 3-25 中，\\[0, 1\\]区间虽然在左子树上，但延迟标记同样需要往右子树带过去。\n\n#### 3.2.9　平衡二叉树\n\n平衡二叉树（Balanced\
    \ Binary Tree）是由 G.M.Adelson-Velsky 和 E.M.Landis 于 1962 年提出的，又称为 AVL 树。平衡二叉树属于二叉搜索树（Binary\
    \ Search Tree），所以在讲解平衡二叉树之前，不妨先讲讲什么是二叉搜索树。\n\n二叉搜索树是能够表达一定元素顺序的二叉树。由于从树根往下能进行二分查找，因此二叉搜索树通常能在`O(logN)`的时间复杂度下查找某些节点的元素值。但是，不加条件的二叉搜索树往往容易退化成链表，使时间复杂度变成`O(N)`。\n\
    \n平衡二叉树的全称为平衡二叉搜索树，主要用于解决左、右子树高度平衡问题。为了解决二叉搜索树退化成链的问题，平衡二叉树可以保证任意节点的左、右子树高度差不大于\
    \ 1。在表达同样序列大小关系的情况下，普通的二叉搜索树与平衡二叉树之间的区别如图 3-26 所示。\n\n![](img/090-1.jpg)\n\n图\
    \ 3-26　二叉搜索树与平衡二叉树之间的区别\n\n由此可见，平衡二叉树查找元素值的时间复杂度稳定在`O(logN)`。那么，平衡二叉树是如何保证任意节点的左、右子树高度差不大于\
    \ 1 的呢？我们可以先想想左、右子树高度差大于 1 的情况一共有几种，只有将这些“大于 1”的情况转变成“不大于 1”的情况，二叉搜索树才能成为平衡二叉树。总体来说，左、右子树高度差大于\
    \ 1 的情况有 4 种，如图 3-27 所示。\n\n![](img/091-1.jpg)\n\n图 3-27　左、右子树高度差大于 1 的 4 种情况\n\
    \n根据图 3-27 可知，通过镜面变换，图 3-27（a）和图 3-27（d）可以归为一类，图 3-27（b）和图 3-27（c）可以归为一类。为了将左、右子树高度差大于\
    \ 1 的二叉搜索树调整成平衡二叉树，可以通过以下两种旋转操作实现。\n\n• 单旋。对于图 3-27（a），将`B`提到树根，`A`变成`B`的右孩子节点，`E`变成`A`的左孩子节点，即可将该二叉搜索树转换为平衡二叉树，具体变换操作如图\
    \ 3-28 所示。同理可单旋图 3-27（d）。图 3-27（a）和图 3-27（d）的处理区别只有左右之分，因此单旋又可以细分为左旋和右旋。\n\n![](img/092-1.jpg)\n\
    \n图 3-28　单旋\n\n• 双旋。双旋是指进行两次单旋。对于图 3-27（b），第一次单旋是旋转`A`的左子树，使以`B`为根节点的左、右子树高度相等，并且将`E`提到`A`的左子树树根；第二次单旋，将`E`提到树根，`A`变成`E`的右孩子节点，即可将该二叉搜索树转换为平衡二叉树，具体变换操作如图\
    \ 3-29 所示。同理可双旋图 3-27（c）。\n\n![](img/092-2.jpg)\n\n图 3-29　双旋\n\n任意一棵二叉搜索树，从叶子节点开始，通过单旋或双旋一直变换到根节点，可以保证任意节点的左、右子树高度差不大于\
    \ 1。平衡二叉树的建树变换时间复杂度为`O(NlogN)`。此外，平衡二叉树还有红黑树、SBT、Treap、伸展树等几个变种，感兴趣的读者可以深入学习。\n\
    \n#### 3.2.10　并查集\n\n并查集（Disjoint Set）并非常用的基础算法，却也是一种很有意思的算法。并查集能高效率地判断两个元素是否位于同一个图中。下面通过一个具体的例子讲解并查集可以解决什么问题。\n\
    \n问题描述：有`N`个人，约定存在血缘关系的为亲人，并且如果`X`和`Y`是亲人、`Y`和`Z`是亲人，则`X`和`Z`也是亲人。现给出`M`对人的血缘关系，保证这`N`个人都已涵盖在内。计算这`N`个人中一共有多少个家族，以及需要询问多少次任意两人是否属于同一个家族（询问次数用`T`表示）。\n\
    \n根据题目描述，不难想到暴力枚举法，即每次将有血缘关系的两个人所属的家族集合编号赋值为同一个值。可想而知，当`N`、`M`、`T`较大时，算法时间复杂度不可估量。此时，并查集横空出世。\n\
    \n并查集最常用的数据结构是森林，算法思路如下：首先初始化`N`个人作为`N`棵树，每棵树都作为一个家族；然后根据给出的`M`对血缘关系，将两个人所在的树合并为一棵新的树，组成一个新的家族。例如，有\
    \ 5 组血缘关系，分别为(`a`，`b`) (`b`，`c`) (`d`，`e`) (`d`，`f`) (`d`，`b`)，并查集的构建步骤如图 3-30\
    \ 所示。\n\n在图 3-30 中，字母后面的数字代表家族编号。首先，(`a`，`b`)表示`a`和`b`有血缘关系，将`b`所在的树根指向`a`所在的树根，组成一棵新的家族树；然后依次按照此规则更新(`b`，`c`)\
    \ (`d`，`e`) (`d`，`f`) (`d`，`b`)这 4 组血缘关系。值得注意的是，在处理血缘关系(`d`，`b`)时，由于`b`不是当前家族树的根节点，因此需要先找到根节点`a`，再将`a`指向`d`。此外，为了防止树退化成链表，通常将深度较小的树的指针指向深度较大的树的根节点，因此需要将图\
    \ 3-30（f）中的并查集森林结构转换为并查集的平衡结构，如图 3-31 所示。\n\n![](img/094-1.jpg)\n\n图 3-30　并查集的构建步骤\n\
    \n![](img/094-2.jpg)\n\n图 3-31　并查集的平衡结构\n\n根据图 3-31 可知，家族数量就是森林中最后形成的树的棵数。当查询任意两个人是否属于同一个家族时，只需分别比较这两个节点所在树的根节点编号是否相同。为了方便理解，在并查集的构建过程中，直接将子树所有节点的家族编号都设置为根节点编号。\n\
    \n不难发现，即使按照上面所讲的平衡结构构建并查集，也会面临两个问题：其一，要合并的两棵树，如果当前节点距离各自根节点的距离并非最长距离，则会直接导致平衡结构构建失败；其二，即使构建了平衡结构，本身过长的分支也仍然存在。平衡结构只是并查集的一种简单优化，并查集最有效的优化方法为路径压缩。路径压缩的优化思想如下：在每次找树根时，将经过的所有节点都指向根节点，将较长的路径变成多子树。使用路径压缩方法优化并查集的时间复杂度为`O(MlogN)`，而每次查询的时间复杂度为`O(C)`，是常数级别。使用路径压缩方法进行优化的并查集构建步骤如图\
    \ 3-32 所示，其中路径压缩在第（c）步体现。\n\n![](img/095-1.jpg)\n\n图 3-32　并查集的路径压缩构建步骤\n\n####\
    \ 3.2.11　匈牙利算法\n\n匈牙利算法主要用于求解二分图的最大匹配问题。二分图又称为二部图，是一种特殊的图。假设`G=(V, E)`是一个无向图，如果顶点集`V`可以分割为两个互不相交的子集(`A`,\
    \ `B`)，并且图中的每条边(`i`, `j`)所关联的两个顶点`i`和`j`分别属于这两个不同的顶点集(`i in A, j in B`)，则称图`G`为一个二分图。二分图最大匹配是指使二分图中左右两边相连但不相交的边数最多。\n\
    \n匈牙利算法的基本思路是查找增广路，增广路是指从一个未匹配节点出发，如果途经一个未匹配节点，则完成本轮增广路的查找，否则走交替路（出发点不算），直到交替路终止于对面未匹配节点，或者无边可走才结束。每次找出来的增广路都完成了一次两边节点的更新配对，有可能是新增配对，也有可能是修改之前的配对。\n\
    \n问题描述：现在有一个 8 人的小型化装舞会，一共有 4 男 4 女，将男生分别标记为`A`、`B`、`C`、`D`，将女生分别标记为`a`、`b`、`c`、`d`。现在化装舞会需要男女配对组成\
    \ 4 队，在音乐声中一起完成华尔兹双人舞蹈。已知`A`与`a`、`b`、`c`相识，`B`与`a`、`d`相识，`C`与`c`、`d`相识，`D`只与`b`相识，熟人关系如图\
    \ 3-33 所示。为了让大家都能与一个熟人作舞伴，要如何给这 8 个人配对？\n\n![](img/096-1.jpg)\n\n图 3-33　二分图中的熟人关系\n\
    \n针对上述例子，匈牙利算法的执行步骤如图 3-34 所示。\n\n![](img/097-1.jpg)\n\n图 3-34　匈牙利算法的执行步骤\n\n\
    按`ABCD`的顺序进行匹配，先匹配`A`和`B`。加粗虚线表示当前找到的增广路，加粗实线表示当前的配对。首先，图 3-34（a）找到增广路`A→a`，图\
    \ 3-34（b）将增广路中的`A`和`a`配对；然后，图 3-34（c）找到增广路`B→a→A→b`，图 3-34（d）将增广路中的`A`和`a`解除配对，然后将`B`和`a`、`A`和`b`分别配对。这里可以看出，由于二分图的性质，增广路中每隔一条边匹配一条边，总能保证配对最大。接着配`C`和`D`。图\
    \ 3-34（e）找到增广路`C→c`，图 3-34（f）将增广路中的`C`和`c`配对，图 3-34（g）找到增广路`D→b→A→a→B→d`，图 3-34（h）将增广路中的`B`和`a`、`A`和`b`解除配对，然后将`D`和`b`、`A`和`a`、`B`和`d`分别配对。至此，图中再无增广路，匈牙利算法结束。可知在每次查找增广路时，在最差情况下会遍历所有边。因此匈牙利算法的时间复杂度为`O(NM)`，其中`N`表示二分图半边的点数，`M`表示二分图的总边数。\n\
    \n### 3.3　在线评测系统\n\n在线评测系统（Online Judge，`OJ`）是一种在编程竞赛中评测参赛程序的在线系统，也可以用于平时练习。近年来也出现了一些针对求职面试的在线评测系统。许多`OJ`网站会自发组织一些竞赛。此外，`OJ`网站通常会设立用户排名（以用户提交的答案通过数或某个题目的执行时间为排名依据）。\n\
    \n在`OJ`上提交评测程序后，系统后台会执行提交的程序，根据题目的要求输入数据，得到并评测该程序的输出结果。只有返回“Accepted”状态，才表示提交的程序正确。不同`OJ`的评测状态分类略有出入，大致可以分为\
    \ 3 类，如表 3-2 所示。\n\n表 3-2　`OJ`的评测状态分类\n\n![](img/098-1.jpg)\n\n比较有名的国外`OJ`有 LeetCode、Topcoder，国内`OJ`有北大的`POJ`、浙大`ZOJ`，以及胡伟栋的\
    \ Tsinsen 清橙网络自动评测系统。\n\n#### 3.3.1　LeetCode\n\n`LeetCode`是一种在线评测系统，不仅形成了题库、社区、竞赛三剑合璧的生态系统，而且打通了通往全世界各大互联网公司的求职通道。此外，`LeetCode`特别推出了`LeetCode`中国版的官方网站。\n\
    \n根据题目类型，可以将题目分为 6 类，分别为 System Design、OO Design、Operating System、Algorithms、Database\
    \ 和 Shell；根据题目难易程度，可以分为 3 类，分别为 Easy、Medium 和 Hard。每题都有一个总的提交通过率，并且提供解题思路留言讨论区。题库还会提供若干个专题标签，用于给刷题者提供有针对性的索引。例如，算法类别专题标签有数组相关、图相关、动态规划相关；公司面试划分专题标签有谷歌公司面试最热\
    \ 100 题、Facebook 公司面试最热 100 题等。\n\n#### 3.3.2　POJ 与 ZOJ\n\n`POJ`和`ZOJ`等以大学为代表的在线评测系统，主要用于竞赛培训，如`IOI`国际信息学奥林匹克竞赛、`ACM`国际大学生程序设计竞赛等。\n\
    \n`POJ`（Peking University Online Judge，北京大学程序在线评测系统）是一个提供编程题目的网站，它包含 3000 多道程序设计题，题目大部分来自`ACM`国际大学生程序设计竞赛和各种自行举办的竞赛，很多题目可以反映工作和生活中的实际问题。\n\
    \n`ZOJ`（Zhejiang University Online Judge，浙江大学程序在线评测系统）是一个提供信息学（算法竞赛）题库及进行在线程序评测的网站，它也包含\
    \ 3000 多道程序设计题，题目大部分来自`ACM`国际大学生程序设计竞赛、全球各大赛区及著名大学的竞赛。\n\n#### 3.3.3　Tsinsen\n\
    \n很多人或许没有听说过 Tsinsen 清橙网络自动评测系统，但应该对其背后的开发者有所耳闻，那就是两届`IOI`金牌得主、清华大学计算机科学实验班毕业的胡伟栋。清橙网络自动评测系统和胡伟栋，对笔者而言并不陌生，因为笔者和胡伟栋曾就读于同一所高中，而且笔者也算是清橙的首批用户。\n\
    \n笔者记得在刚上高一时，参加了学校的信息学竞赛兴趣小组。那时我们不像现在有五花八门的`OJ`用于学习编程，尤其对于`DIY`题目，手动评测甚是麻烦。清橙网络自动评测系统就是那时由胡伟栋开发的一个自动评测系统，专门用于模拟竞赛评测。该系统后来升级，搬到了网上，也就是现在的清橙网络自动评测系统。比较遗憾的是，清橙网络自动评测系统于\
    \ 2019 年 9 月 1 日不再对外提供服务。\n\n### 3.4　动脑时刻\n\n1\\. 为什么斐波那契数列不适合使用递归算法求解？\n\n2\\\
    . 如何使用递归算法解决汉诺塔![相传在古印度圣庙中，有一种被称为汉诺塔（Tower of Hanoi）的游戏。在一块铜板装置上，有三根杆（编号`A`、`B`、`C`），在`A`杆上自下而上按从大到小的顺序放置着\
    \ 64 个金盘。游戏的目标：将`A`杆上的金盘全部移到`C`杆上，并且使所有金盘保持原有顺序叠放。操作规则：每次只能移动一个金盘，并且在移动过程中三根杆上始终保持大盘在下、小盘在上，操作过程中金盘可以放置于`A`、`B`、`C`任意一根杆上。](img/note.png)问题？\n\
    \n3\\. 背包问题有很多变种与升级版本，本书讲解的是 01 背包问题，也是最基础的背包问题。如果同一种物品可以无限装包，这样的背包问题称为完全背包问题。那么，动态规划如何解决完全背包问题？\n\
    \n4\\. 导弹拦截问题，每次的导弹拦截高度都不能高于前一次，现在连续有`N`枚导弹袭击，高度分别为`Hi`（`i`为 1～`N`的整数），最多能拦截多少枚导弹？写出动态转移方程即可。\n\
    \n5\\. 为什么迪杰斯特拉算法无法计算带负边的图，而贝尔曼-福特算法可以？\n\n6\\. 从算法原理上解释为什么普里姆算法适合稠密图，而克鲁斯卡尔算法适合稀疏图。\n\
    \n7\\. 如何计算树状数组中任意子序列中的所有元素之和？\n\n8\\. 为什么说树状数组对计算任意子序列中的最大值和最小值束手无策？\n\n### 3.5　本章小结\n\
    \n本章首先讲解了数据结构，包括数组、链表、队列、栈、树、图和散列表这几种数据结构的性质与用法。然后讲解了几种常用的基础算法，帮助大家拓展思维边界，提高思考能力。最后简单介绍了几个比较流行的在线评测系统，大家可以在这些在线评测系统上进行基础算法的实战训练。\n\
    \n数据结构和基础算法作为算法的基本招式，对之后更加顺利地学习算法的各种武功秘籍大有裨益。\n\n### 关键词回顾\n\n数据结构\n\n数组\n\n多维数组\n\
    \n链表\n\n多维链表\n\n队列\n\n先进先出`FIFO`\n\n栈\n\n后进先出`LIFO`\n\n树\n\n二叉树\n\n森林\n\n图\n\n\
    有向图\n\n无向图\n\n邻接链表\n\n邻接矩阵\n\n散列表/哈希表\n\n排序\n\n选择排序\n\n插入排序\n\n冒泡排序\n\n快速排序\n\n\
    堆排序\n\n归并排序\n\n计数排序\n\n桶排序\n\n基数排序\n\n递归\n\n分治\n\n贪婪算法\n\n动态规划\n\n背包问题\n\n动态转移方程\n\
    \n搜索\n\n深度优先搜索\n\n宽度优先搜索\n\n最短路径\n\n弗洛伊德算法\n\n迪杰斯特拉算法\n\n贝尔曼-福特算法\n\n最小生成树\n\n\
    普里姆算法\n\n克鲁斯卡尔算法\n\n树状数组\n\n线段树\n\n二叉搜索树\n\n平衡二叉树\n\n单旋和双旋\n\n并查集\n\n路径压缩\n\n\
    匈牙利算法\n\n在线评测系统\n\nLeetCode\n\nPOJ 与 ZOJ\n\nTsinsen\n\n## 第 4 章  \n算法之武功秘籍\n\n\
    归根结底，算法的目标是解决生活中的实际问题。在第 2 章和第 3 章中，我们讨论了算法内力（相关的数学基础知识）及算法招式（数据结构和常用的基础算法）。运用算法的内力和招式，可以解决生活中的大部分简单问题。但是当问题变得复杂时，如分类问题（如社交媒体的用户兴趣分类和热点关注话题分类）、推荐问题（如电商平台商品的推荐和排序问题）、预测问题（如预测股价走向、交通流量、商品销量）及与人工智能有关的问题（如怎样让计算机学会自动驾驶、下棋、对话）等，只用算法的内力和招式是远远不够的，此时需要更加精妙的算法武功秘籍。因为算法招式解决的只是某一类小问题，或者是大问题中的某一小块，就好比武当的梯云纵，解决的只是“腾空而上”这样的小问题。真正比武的时候，还要用太极拳、太极剑这类武功秘籍才可以克敌制胜。\n\
    \n本章会介绍机器学习算法的分类，并且详细介绍不同分类下的算法原理，帮助大家熟悉算法世界中的武功秘籍。\n\n### 4.1　类别划分\n\n机器学习涉及各式各样的算法，所解决的问题涵盖生活中的方方面面。本节分别从两大出发点归纳总结机器学习中的算法，帮助大家对机器学习算法有一个整体把握。其中，第一个出发点为是否有监督信号，第二个出发点为学习目标。\n\
    \n#### 4.1.1　按是否有监督信号划分\n\n"
