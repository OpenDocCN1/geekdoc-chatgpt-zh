    在计算二项分布的概率分布时，如果需要计算发生`k`次的概率，那么在二项分布中必须事先知道一个全局的`n`。然而，在实际问题中很难或无法预先知道对应的`n`是多少，如潜在乘坐公交车的乘客总数、潜在需要去银行办理业务的客户总数、潜在包子铺顾客总数等。


