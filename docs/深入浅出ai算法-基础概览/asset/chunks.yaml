    ## 3.2.6 最小生成树


    最小生成树（`Minimal Spanning Tree`，`MST`）首先是一棵树，“最小”的含义是这棵树的边长之和最小。那你可能会问，为什么不叫“最小树”？不妨这样来理解，“生成”是一个动词，强调的是这棵“最小树”的产生过程，所以叫最小生成树。下面以一个实际问题为例讲解最小生成树的作用。


    问题描述：假设有 4 座城市，分别为`A`、`B`、`C`、`D`，在这 4 座城市之间铺设光缆，城市之间的光缆铺设费用分别为`AB=8`、`AC=1`、`AD=6`、`BC=3`、`BD=2`、`CD=5`，要求任意两个城市之间可以通信，求铺设光缆的最小花费。


    我们可以将城市作为节点，城市之间以边相连，将光缆铺设费用作为边长，构成无向图。求最小铺设费用等价于求这个无向图的最小生成树。最小生成树最常用的算法有普里姆算法（`Prim''s
    Algorithm`）和克鲁斯卡尔算法（`Kruskal''s Algorithm`）。


    ### 1. 普里姆算法


    普里姆算法可以从任意节点开始建树。该算法的基本思路如下：从原点开始，每次添加与当前最小生成树相连且不成环的最短边，直到添加所有节点为止。对于上面的光缆铺设例子，以`A`为最小生成树的原点，首先添加与之相连且不成环的最短边`AC`，然后按算法法则依次添加`BC`边、`BD`边，直到所有节点均已添加，算法结束，最小花费为
    6（`1+3+2`）。普里姆算法的时间复杂度为`O(V2)`，其推进步骤示意图如图 3-19 所示。


    ![](img/084-1.jpg)


    图 3-19　普里姆算法的推进步骤示意图


    ### 2. 克鲁斯卡尔算法


    类似于迪杰斯特拉算法和贝尔曼-福特算法之间的关系，如果普里姆算法的基本思路是以点扩展边，那么克鲁斯卡尔算法的基本思路是以边扩展点，具体如下：每次从待选边集中选出与当前森林不成环且最短的边加入森林，直到所有节点形成一棵树为止。该思路决定了克鲁斯卡尔算法只能从最短边开始构建最小生成树。对于光缆铺设例子，首先将`AC`边加入森林，然后按算法法则依次加入`BD`边、`BC`边，此时所有节点已构成一棵树，算法结束，最小花费同样为
    6（`1+2+3`）。这里需要用到排序，如果使用快速排序算法，那么克鲁斯卡尔算法的时间复杂度为`O(ElogE)`，其推进步骤示意图如图 3-20 所示。


    ![](img/085-1.jpg)


    图 3-20　克鲁斯卡尔算法的推进步骤示意图


    值得一提的是，稠密图（边数较多的图）适合使用普里姆算法，而稀疏图适合使用克鲁斯卡尔算法。


    ## 3.2.7 树状数组


    从本节开始的 5 个基础算法，其难度有所提升，建议读者选择阅读。


    树状数组（`Binary Indexed Tree`）是一种具有树结构的数组，其利用二进制的计算特性，可以在时间复杂度为`O(logN)`的情况下动态维护一个序列，并且计算其任意子序列中的所有元素之和，算法思路十分简洁、巧妙。下面从二进制的特性开始，逐步讲解树状数组的实现思路。


    有 4 个二进制数，分别为 0011、0101、0110、0111，每次通过将原数的非零最低位加 1 来更新原数，可以得到 4 个变化过程，分别为 0011→0100→1000→10000、0101→0110→1000→10000、0110→1000→10000、0111→1000→10000。观察这
    4 个变化过程有没有发现什么规律？没错，这种运算总能将原数变为比它大的、最接近的 2 次幂。假设有 8 个位置，编号分别为 1～8，将其组成一个树状数组，如图
    3-21 所示，灰色代表原数组，黑色代表树状数组。


    ![](img/086-1.jpg)


    图 3-21　树状数组结构示例


    黑色单元从左至右的相连关系就是上面描述的“加 1 变换”（`B1→B2→B4→B8`，`B3→B4→B8`，`B5→B6→B8`，`B7→B8`）。有“加
    1 变换”自然就有“减 1 变换”。“减 1 变换”能以`O(logN)`的时间复杂度找到任意元素的核心子元素，这样维护和计算任意子序列中所有元素的和就很方便了。例如，对于图
    3-21 中的`B7`，通过“减 1 变换”得到序列（`B7→B6→B4`），正好可以计算`A1～A7`之和。


    举个直观例子。假设原数组为`[3,5,1,9,2,4,8,7]`，依次遍历原数组，并且通过“加 1 变换”将每一个元素值累加到树状数组的相应位置上，这一步的时间复杂度为`O(NlogN)`，相应的树状数组如图
    3-22 所示。


    ![](img/086-2.jpg)


    图 3-22　树状数组求和


    在树状数组构建完成后，尝试计算前 7 个数之和。我们通过“减 1 变换”在树状数组中依次遍历到 0111、0110、0100 这 3 个位置，对应下标的元素值为
    8、6、18。因此前 7 个数之和为 8+6+18=32。如果使用原数组，则需要进行 6 次加法运算；如果使用树状数组，则只需进行 2 次加法运算。随着数列长度的增加，树状数组的时间优势会更加明显。此外，当原数组中某个元素的值增加或减少`d`时，同样可以通过“加
    1 变换”来更新树状数组中相应的元素值。


    无论是“加 1 变换”，还是“减 1 变换”，核心问题都是找到二进制的最低位，如何得到二进制的最低位呢？这就不得不提计算机最擅长的位运算了，最低位计算公式为


    `lowbit(x)=x and (x xor (x-1))`


    利用补码特性，该计算公式可以简化成


    `lowbit(x)=x and -x`


    简化后的最低位计算公式是常数级的计算。树状数组查询和更新的时间复杂度为`O(logN)`。由于树状数组的构建要遍历整个原数组，因此时间复杂度为`O(NlogN)`。


    ## 3.2.8 线段树


    线段树（`Segment Tree`）的概念和它的名字一样，是以线段（通常是指数组的一个子数组，点可以看作线段的特殊形式）为节点构成的树。上一节讲的树状数组能高效率地计算任意子序列中的所有元素之和。但如果需要计算任意子序列中的最大值和最小值，树状数组显然是束手无策的，这时需要使用线段树。线段树可以解决包括树状数组解决的问题在内的所有子序列求解问题。相应地，线段树比树状数组复杂很多。下面通过一个具体例子讲解什么是线段树。


    问题描述：一个长度为`N`的序列，每次询问任意一段区间内的最大值。


