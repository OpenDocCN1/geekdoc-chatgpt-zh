    ## 特征工程


    独热编码的具体做法是将离散型特征所有可能的取值按照一定的顺序排列，同时生成一个维度相同且值全为 0 的向量；然后将对应样本离散型特征所处的位置设置为 1。例如，编码图
    5-2 中的动物类别离散型特征，编码结果如表 5-2 所示。


    表 5-2　独热编码示例


    ![](img/162-2.jpg)


    ### 特征缩放（Feature Scaling）


    顾名思义，特征缩放就是将原先取值范围较大的特征，按照某种规则转换成取值范围较小的特征。在机器学习算法应用中，有时原始特征的取值范围很大，如果不预先采取特征缩放操作，压缩特征的取值范围，那么模型算法会无法正常运行，甚至会由于特征空间过大而无法加载到内存空间中。一方面，如果特征之间的量纲差别很大，那么特征之间的距离计算会失去意义；另一方面，特征的取值范围较大可能导致一些优化算法（如梯度下降）的收敛变得迟缓甚至失效。


    特征缩放有三种常用方法，第一种叫作对数变换（Log Transformation）。对数变换将取值范围很大的特征转换到范围较小的区间内，对特征分布的形状有很大影响，可以降低特征值的震荡影响，弱化特征噪声，使特征分布更加匀称。如图
    5-6 所示，在销量预测中，由于销量值波动很大，因此取自然对数可以弱化剧烈波动带来的影响。当然，由于是取对数，因此对零值或负值需要特殊处理，如统一设置为 0。


    ![](img/163-1.jpg)


    图 5-6　对数变换的作用


    特征缩放的第二种方法叫作归一化（Normalization），具体计算方法如下：首先计算得到当前特征的最大值和最小值，然后将原始特征值先减去最小值，再除以最大值与最小值之差，最后将特征值统一映射到`[0,
    1]`区间。


    特征缩放的第三种方法叫作标准化（Standardization），具体计算方法如下：首先计算得到当前特征的平均值和标准差，然后将原始特征值先减去平均值，再除以方差，最后将特征值统一映射到标准正态分布![平均值为
    0、标准差为 1 的正态分布，记为`N(0, 1)`。](img/note.png)中。


    特征缩放主要有两个作用，第一个是使梯度下降的过程不容易发生震荡，能更快收敛，如图 5-7 所示；第二个是在一些设计距离度量的模型算法中，起到统一量纲的作用。


    ![](img/164-1.jpg)


    图 5-7　不同量纲下梯度下降的对比


    ### 特征嵌入


    特征嵌入（Feature Embedding）是使用神经网络模型将输入的原始特征转换成指定维度特征向量的一种方法。严格意义而言，特征嵌入也是特征变换的一种，但与基于特征数据层面的简单转换相比，特征嵌入需要通过一个神经网络模型的训练过程来实现。此外，特征嵌入更加变化多端，基于不同的神经网络模型可以得到不同的特征嵌入向量。对于在距离度量下原本相近的样本，特征嵌入能使它们在新的特征空间中保持原本相近的距离。例如，自然语言处理中的词嵌入（Word
    Embedding）就是将单字或单词映射成较高维度的特征向量，而原本具有语义相似性的单词（如“漂亮”和“美丽”、“英俊”和“帅气”、“中国人”和“炎黄子孙”等），在映射之后的嵌入向量之间仍然保持比较接近的距离。


    ### 特征交叉


    特征交叉（Feature Overlap）是一种融合多个特征的方法。可以使用独热编码对同时出现的离散型特征进行编码，也可以通过某个公式将多个连续型特征转换为新的抽象特征。例如，对于性别和兴趣这两个离散型特征，其中性别有男、女共两种，兴趣有篮球、游泳、摄影、旅游共四种，使用独热编码对二者同时出现的特征进行编码，结果如表
    5-3 所示。


    表 5-3　特征交叉编码示例


    ![](img/165-1.jpg)


    ### 特征选择


    特征选择（Feature Selection）是在数据预处理完成后，筛选真正有价值的特征的过程。过滤法是一种常见的特征选择方法。过滤法分为两种，一种是方差筛选法，通过设置方差阈值，过滤掉方差较小的特征；另一种是利用目标相关性判断，即计算特征与标签之间的相关性，主要有以下四种特征相关性的计算方法。


    • 皮尔逊相关系数法：输出范围为(-1, 1)，0 表示无相关性，负值表示负相关，正值表示正相关。局限是所计算的特征和标签都要求是数值型的，并且只能检测出线性关系。


    • 卡方检验法：本质是推测两组数据之间的差异，使用 0.01 或 0.05 作为显著性水平阈值，如果返回的 p 值小于显著性水平阈值，则相关；如果返回的 p
    值大于显著性水平阈值，则不相关。卡方检验法只能检验离散型特征。


    • F 检验法：是用于捕捉每个特征与标签之间线性关系的计算方法，既可以检验离散型特征，又可以检验连续型特征。返回的 p 值用法与卡方检验法中返回的 p 值用法一致。


    • 互信息法：是用于捕捉每个特征与标签之间任意关系（包括线性关系和非线性关系）的计算方法。互信息法可以返回每个特征与目标之间互信息量的估算值，这个估算值的取值范围为`[0,1]`，如果估算值为
    0，则表示两个变量独立；如果估算值为 1，则表示两个变量完全相关。互信息法比 F 检验法更强大，F 检验法只能检测出线性关系，而互信息法可以检测出任意关系。


    除了过滤法，还可以使用模型法得到各个特征的重要性权重，常用的算法模型有`GBDT`模型和`XGBoost`![由陈天奇等人提出，是一种基于决策树的集成机器学习算法，使用梯度上升框架，适用于分类和回归问题。](img/note.png)模型。


    ### 样本不均衡


    样本不均衡（Sample Unbalanced）是指在带类别标签的分类样本中，不同类别中的样本数量存在差别。例如，二分类问题中正、负例样本比例过大或过小，多分类问题中存在的长尾类别![长尾类别中的样本数量相对于其他类别中的样本数量少很多。](img/note.png)，等等。样本不均衡的问题十分常见，一方面可能在样本数据的收集过程中就出现了问题，如少采集了某些类别的样本；另一方面，由于业务的天然特点，本身就采集不到比较均衡的样本数据，如欺诈检测、癌症检测等场景。样本不均衡问题有可能将模型的优化方向带偏，直接表现为使模型倾向于关注样本数量更多的类别，使效果适得其反。


    并不是所有的样本不均衡问题都必须处理。


    第一种情况：类别本身的样本绝对数量足够大，只是相对于其他类别较少。由于较少类别的样本量也比较充足，模型对该类别也能完成足够充分的学习，因此不需要将其视为样本不均衡的问题来处理。例如，在电商场景中，虽然商品的点击量远小于其曝光量，订单转化量也远小于其点击量，但是商品的点击量和订单转化量的绝对值足够大，所以不需要处理样本不均衡问题。


    第二种情况：类别样本的比例差别不大，如二分类正、负例样本比例不小于 1∶4。在保证样本量充足的情况下，在进行模型评估时，可以使用适合类别不均衡的评价指标（如`AUC`、`F1`值等）来评估。


    具体来说，处理样本不均衡问题的常见方法有以下 4 种。


    • 收集更多的样本。这种方法比较直观，通过整体扩充样本，使较小数量的类别也能拥有足够的样本数量。


    • 数据增强。根据现有样本，通过数据变换扩充同类别的样本，这种方法在图像识别领域应用广泛，如将图片进行平移、裁剪、旋转、镜像等。


    • 策略采样方法。对数量较少的样本进行过采样（又称为重采样）操作，即将其随机复制多份；对较多数量的样本进行欠采样操作。


    • 基于模型的方法，如基于`K-近邻算法`的`SMOTE`（Synthetic Minority Oversampling Technique，合成少数类过采样）算法。


    ### 5.3　建模与调参


    在完成数据分析和特征工程后，下面对算法进行建模与调参。如果将算法工程比作下厨，那么数据分析和特征工程相当于准备原材料（柴、米、油、盐、菜等），建模相当于盛原材料的容器（锅、碗、瓢、盆等），调参相当于对厨艺的锻炼。


    #### 5.3.1　建模


    函数是数学中的一个基础概念，其核心是输入数据、输出计算值。建模是指构建一个以样本特征为输入，以针对该样本的特定预测结果为输出的函数。例如，分类模型输出待预测样本的预测类别，而回归模型输出待预测样本的预测值。


    本书第 4 章已经讲解了多种常用的算法，可以直接用于对函数进行建模。需要强调的是，建模不一定要套用现成的算法模型，现成的算法模型也不一定能取得比较好的效果。可以根据充分的数据分析结果，因地制宜地进行建模。


    此外，建模是一个不断迭代更新的过程。没有一成不变的数据，更没有一成不变的模型。一个合理的建模过程是由简到繁、增量迭代的。这种建模过程在实际业务中非常高效，一方面，可以快速取得前期的业务效果；另一方面，可以基于现有模型的效果，有针对性地调参或优化模型结构。


    #### 5.3.2　调参


    调参的技术含量并不高，但在算法工程中却不可或缺。通俗地讲，调参就是人工调整机器学习算法模型的各项超参数![超参数是指算法模型在开始训练之前预先设置的参数，而不是通过训练得到的参数。](img/note.png)，从而达到提升模型效果的目的。不同机器学习算法模型的超参数不同。例如，随机森林的超参数有学习率、子模型数、采样率、最大深度、分裂最大特征数、叶节点最小样本数等；神经网络的超参数有学习率、网络层数、神经元个数等。


    在超参数较少的情况下，可以采用网格搜索（`Grid Search`）方法寻找最优超参数。所谓网格搜索，就是针对算法模型可调节的各项超参数，枚举超参数所有可能的取值组合，逐一尝试，然后选择模型效果最好的一组作为最终模型的超参数。当然，我们还可以使用自动调参工具（如
    Amazon 开发的`SageMaker Autopilot`、Google 开发的`AutoML`![是一个能够制造子 AI 的 AI 系统。](img/note.png)、`AutoML`的开源替代产品`Auto-Keras`等）帮助模型自动选择最优的超参数组合。


    ### 5.4　效果评估


    前面的调参过程需要模型反复进行训练，从而得到不同的效果评估结果，用于指导模型超参数的优化方向。而效果评估符合预期的前提有两点，第一点是需要合理划分评估的数据集，第二点是选择合适的评估指标。


    #### 5.4.1　数据集划分


    数据集划分的通常做法如下：首先将数据集随机打乱（`shuffle`），目的是使数据在切分时保持各部分同质![每个特征在划分的不同集合中对应的特征分布均一致。](img/note.png)。然后将数据集按照一定的比例分别划分为训练集、验证集和测试集。其中，训练集占据大部分数据，主要用于训练模型；验证集主要用于验证训练过程中每一轮结束后的模型效果，在训练过程中会被反复使用，可以设置不同的验证频率；测试集最后使用，主要用于测试模型的最终泛化能力，只使用一次，如果特征涉及时间维度，则建议单独划分最新一段时间的样本作为测试集，从而更准确地测试模型的泛化能力。训练集、验证集和测试集之间没有标准的划分比例，一般将划分比例设置为
    4∶1∶1 即可。在一般情况下，验证集不宜过大，因为在每轮迭代结束后都会验证一次模型效果，如果验证集过大，则会延长训练所需的总体时间。同样地，验证集和训练集也不宜过小，尤其在正例样本占比较小时，样本量过小会导致验证和测试的结果波动过大而不可信。


    除了上述常规的数据集划分方法，还有一种比较流行的方法——K 折交叉验证。这种方法的基本思路如下：首先将随机打乱顺序后的数据集划分成大小两份，一份作为训练集，一份作为测试集；然后将训练集等分成
    K 份数据集，每次训练只使用其中的 K\-1 份数据集，将剩下的 1 份数据集作为验证集，用于进行效果评估。K 折交叉验证在`K-近邻算法`![`K-近邻算法`是一种分类算法，将样本附近
    K 个最近的点中数量最多的类别作为该样本的类别。](img/note.png)中效果显著。图 5-8 所示为 5 折交叉验证的数据集划分形式。


    ![](img/170-1.jpg)


    图 5-8　5 折交叉验证的数据集划分形式


    #### 5.4.2　评估指标


    评估指标可以直观反映模型分类或回归效果的优劣。常用的分类模型评估指标有精确率、准确率、召回率、`F1`值、`AUC`和`K-S`。常用的回归模型评估指标有`MSE`、`RMSE`、`MAE`和`MAPE`。


    在介绍分类模型评估指标前，先介绍四个至关重要的概念。


    • 真阳性（True Positive，`TP`）：判定为正例样本，并且是真正例样本。


    • 伪阳性（False Positive，`FP`）：判定为正例样本，但不是真正例样本。


    • 真阴性（True Negative，`TN`）：判定为负例样本，并且是真负例样本。


    • 伪阴性（False Negative，`FN`）：判定为负例样本，但不是真负例样本。


    四个概念的表格示例如表 5-4 所示。


    表 5-4　四个概念的表格示例


    ![](img/171-1.jpg)


    分类模型的评估指标就是围绕上述四个概念产生的。


    • 精确率（Precision）：主要用于预测正例样本中有多少是真正的正例样本，是针对预测结果而言的，因此精确率又称为查准率，计算公式如下。


    ![](img/171-2.jpg)


    • 准确率（Accurary）：主要用于预测样本中预测正确的比例，计算公式如下。


    ![](img/171-3.jpg)


    • 召回率（Recall）：主要用于预测样本中的正例样本有多少预测正确，计算公式如下。


    ![](img/171-4.jpg)


    • `F1`值（`F1 Score`）：在准确率和召回率都要求较高的情况下使用，计算公式如下。


    ![](img/172-1.jpg)


    在用上述四个指标评估模型之前，需要先根据模型的预测值将预测样本划分为正例样本和负例样本。由于二值化过程模糊了模型的原始打分能力，因此这些评估指标无法衡量模型输出的排序性能，即样本在打分后的顺序。一个比较好的二分类效果，应该是两种类别的样本打分值尽可能地向两边分开的。


    `AUC`（Area Under the Curve）计算的是`ROC`![`ROC`（Receiver Operating Characteristic
    Curve，受试者操作特征曲线）是由二战中的电子工程师和雷达工程师发明的，主要用于侦测战场上敌军载具（飞机、船舰）的指标，属于信号检测理论中的概念。](img/note.png)下方的面积，是判断二分类预测模型优劣的标准。`AUC`可以直接评估模型打分的排序效果，并且可以很好地量化描述分类模型整体性能的高低。因此，`AUC`在分类模型中应用广泛，但也是比较难理解的一种评估指标。


    `K-S`（Kolmogorov-Smirnov）可以通过衡量`TP`样本和`FP`样本累计分布之间的差值评估模型的风险区分能力。计算方法和`AUC`类似，但是`AUC`只评估模型的整体打分效果，并没有指出如何划分阈值，从而使类别预估的效果达到最好，而`K-S`可以指出分类的最佳划分阈值。


    与分类模型的评估指标相比，回归模型的评估指标比较直观。由于回归模型本身输出的就是数值型的预测值，因此要衡量这个值的准确度，其实就是看预测值与真实值之间的距离。


    • `MSE`（Mean Square Error，均方误差）：计算每个样本的预测值与真实值之差的平方，然后将其相加，最后取平均值，计算公式如下。


    ![](img/173-1.jpg)


    • `RMSE`（Root Mean Square Error，均方根误差）：在均方误差的基础上开方。对于预测值域较大的场景，`RMSE`的评估值比`MSE`的评估值更稳定，计算公式如下。


    ![](img/173-2.jpg)


    • `MAE`（Mean Absolute Error，平均绝对误差）：计算所有预测样本的预测值与真实值之差的绝对值，然后将其相加，最后取平均值，计算公式如下。


    ![](img/173-3.jpg)


    • `MAPE`（Mean Absolute Percentage Error，平均绝对误差百分比）：计算每个样本的预测值与真实值的偏移大小百分比，然后将其相加，最后取平均值，计算公式如下。


    ![](img/173-4.jpg)


    #### 5.4.3　直观理解 AUC


    `AUC`是衡量二分类模型优劣的一种评估指标，表示正例样本排在负例样本前面的综合概率。在分类模型中，预测结果一般以概率的形式呈现，如果要计算准确率，那么通常的做法是手动设置一个阈值，将对应的概率转换成类别，而这个阈值在很大程度上会影响模型准确率的计算。不妨举一个极端例子：在一个二分类问题中，一共有
    10 个样本，其中 9 个样本为正例样本，1 个样本为负例样本，在全部判正的情况下，准确率高达 90%，显然这并不是希望得到的结果。尤其在这个负例样本得分最高的情况下，模型的性能实际上是极差的。`AUC`可以很好地描述模型整体性能的高低，如果用`AUC`评估负例样本得分最高的情况，模型的`AUC`得分会等于
    0（当然，通过取反可以解决小于 50%情况的问题，不过这是另一回事了）。


    为了方便解释`ROC`及`ROC`下方的面积，基于上一节讲解的`TP`、`FP`、`TN`、`FN`，下面介绍如下四个比率。


    • 真阳性率（True Positive Rate，`TPR`）：在所有实际为正例样本的样本中，被正确地判定为正例样本的比率。


    • 伪阳性率（False Positive Rate，`FPR`）：在所有实际为负例样本的样本中，被错误地判定为正例样本的比率。


    • 真阴性率（True Negative Rate，`TNR`）：在所有实际为负例样本的样本中，被正确地判定为负例样本的比率。


    • 伪阳性率（False Negative Rate，`FNR`）：在所有实际为正例样本的样本中，被错误地判定为负例样本的比率。


    `ROC`是根据`TPR`和`FPR`绘制而成的，其中横轴是`FPR`，纵轴是`TPR`。我们知道，`ROC`越靠近右下角，曲线下方的面积越小，表示模型的预测能力越低；`ROC`越靠近左上角，曲线下方的面积越大，表示模型的预测能力越高。那么，如何直观理解这条`ROC`及`ROC`下方的面积（`AUC`的数学意义）呢？


    我们可以先想想这条曲线是怎么画出来的。我们知道，线是由点组成的，结合横轴的`FPR`和纵轴的`TPR`，`ROC`上的任意一点表示一个`FPR`和`TPR`的数据对。起始点一定是坐标系的原点(0,
    0)，即`FPR`和`TPR`都为 0；而终点一定是坐标为(1, 1)的点，即`FPR`和`TPR`都为 1。显然，(0, 0)表示所有测试数据都不判定，而(1,
    1)表示所有测试数据都判定成正例样本。自然而然，两点之间的数据，可以通过不同的阈值计算得到。


