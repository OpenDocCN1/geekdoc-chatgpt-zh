    下面以`age`（年龄）特征为例，讲解如何开展单特征分析。`age`（年龄）特征是连续型特征，在统计数量时需要先对其进行分箱处理。我们知道，分箱分为等宽分箱和等频分箱，为了查看不同年龄段之间的数据差异，我们采用等宽分箱方法`cut`（等频分箱方法为`qcut`），将年龄按取值范围等距分成
