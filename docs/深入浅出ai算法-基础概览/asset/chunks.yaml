    在读取完样本数据后，我们先清洗其中的异常数据值。在前面的数据读取配置中，使用`na_values`参数将自定义的异常数据值全部转化为了缺失值（`NaN`），因此可以使用`Pandas`提供的`dropna`方法删除包含缺失值的行。为了观察删除了多少行，在删除之前和之后分别输出一次数据集的形状。注意`dropna`方法中的`inplace`参数，如果将该值设置为`True`，则表示直接在原数据集中删除包含缺失值的行，`training_raw`变量存储的数据集会发生变化；如果将该值设置为`False`，则表示将删除包含缺失值的行后的数据存储为副本，并且`training_raw`变量存储的数据集不会发生变化。`inplace`参数在很多方法中都可以应用。


