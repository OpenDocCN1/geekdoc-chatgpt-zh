    \n![](OEBPS/Images/040-2.jpg)\n\n对数函数求导公式如下。\n\n![](OEBPS/Images/040-3.jpg)\n\n\
    自然对数函数求导公式如下。\n\n![](OEBPS/Images/040-4.jpg)\n\n现有函数u和函数v，函数四则运算的求导法则如下。\n\n函数加减法的求导法则如下。\n\
