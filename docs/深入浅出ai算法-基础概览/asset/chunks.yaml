  trans: '


    生活中有许多地方需要对事物进行分类，如超市货架、各大商场的品牌专柜、学校的社团等。将具有相同性质、相似功能的事物划分在一起的方法，在机器学习中称为聚类（`Cluster`）。


    ## 4.5.1 距离度量


    我们知道，样本由特征组成，特征分为连续（有序）型特征和离散（无序）型特征两种。样本之间的距离度量是指样本特征之间的距离度量。

    对于连续型特征的距离度量，最常用的是闵可夫斯基距离（`Minkowski Distance`），其计算公式如下。

    ![](img/132-1.jpg)

    上述公式首先计算两个样本之间每个特征值之差的`p`次方，然后求和，最后取`p`次方根。公式中的`i`表示特征序号，`p`的值不同表示的距离含义不同。当`p`为
    1 时，计算的是曼哈顿距离（`Manhattan Distance`）；当`p`为 2 时，计算的是欧氏距离（`Euclidean Distance`）；当`p`趋于无穷大时，计算的是切比雪夫距离（`Chebyshev
    Distance`）。

    闵可夫斯基距离有两个明显的缺点：一是特征之间的量纲（单位）被等同对待，这通常是不合理的。二是未考虑特征值本身的分布规律。例如，如果特征值的分布规律类似于长尾分布，那么这种距离度量的效果通常会大打折扣。第一点可以采用特征值加权或归一化![归一化是指将特征值映射到(0,
    1)区间内，详见第 5 章特征工程的相关内容。](img/note.png)统一量纲解决，第二点可以采用特征值标准化或离散化![详见第 5 章特征工程的相关内容。](img/note.png)解决。

    除了闵可夫斯基距离，常见的连续型特征距离度量方法还有马氏距离（`Mahalanobis Distance`）、余弦相似度（`Cosine Similarity`）、皮尔逊相关系数（`Pearson
    Correlation Coefficient`）。

    对于离散型特征的距离度量，最直接的度量方法是 0/1 匹配法，即对应位置的特征相同则为 1，不同则为 0，累加值的大小体现了样本之间的相似程度。基于 0/1
    匹配法，还可以使用杰卡德相似系数（`Jaccard Similarity Coefficient`）进一步计算样本特征之间的距离。指定两个集合`A`和`B`，将杰卡德相似系数定义为`A`与`B`交集中的元素数量与并集中的元素数量的比值，计算公式如下。杰卡德相似系数的值越大，说明相似度越高，当`A`和`B`都为空集时，杰卡德相似系数为
    1。

    ![](img/133-1.jpg)

    对于离散型特征的距离度量，还可以采用值差分度量法（`Value Difference Metric`，`VDM`）。值差分度量法的使用前提是样本必须是带有类别标签的。其算法原理如下：通过计算不同的离散型特征值在相同类别标签下所占比例的大小关系，得出离散型特征之间的相似度。


    ## 4.5.2 划分聚类


    划分聚类是指根据确定的距离度量规则，将样本数据逐一归类，最终达到“类内样本数据足够近，类间样本数据足够远”的效果。

    `k`均值（`k-Means`）算法是划分聚类的代表性算法，该算法的执行流程如下。

    （1）随机选择`k`个样本作为初始的`k`个类别中心。

    （2）将样本逐一划分到与这`k`个类别中心度量距离最小的类别。

    （3）将每个类别的中心点坐标（特征值）更新成当前类别下所有样本特征距离的平均值。

    （4）重复步骤（2）和（3），直到类别中心位置不再发生变化或已达到最大迭代次数。

    根据上述算法执行流程可知，`k`均值算法受噪声和离群点的影响较深。因为类别的中心点坐标是根据样本特征距离的平均值更新的，所以一旦出现离群较远的样本数据，中心位置就会受到很深的影响。基于这个问题，`k`中心点（`k-Medoids`）算法和`k`中值（`k-Medians`）算法应运而生。

    `k`中心点算法在每次更新类别中心点坐标时，都会通过枚举每个类别下的数据点，计算当前类别下其他数据点到该点的距离之和，将距离之和最小的点定为新的类别中心点。也就是说，`k`中心点算法的类别中心点坐标一定是一条具体的样本数据，而不是计算出来的特征距离平均值。与`k`中心点算法不同，`k`中值算法在每次更新类别中心点坐标时，都会将类别中心点更新成同类别下所有样本数据的中位数，直到每个类别的中位数不再发生改变。

    `k`中心点算法和`k`中值算法虽然都在一定程度上解决了噪声和离群点问题，但是由于在更新类别中心点坐标时不再是简单地取平均值，因此算法的时间复杂度会随之增加。此外，`k`中值算法如果遇到离散型特征数据，就需要使用离散型特征的距离度量法进行距离度量。这时会有个新的算法——`k-Modes`算法。`k-Modes`算法的距离度量法可以是交集中的元素数量、杰卡德相似系数等。


    ## 4.5.3 层次聚类


    在划分聚类中，我们需要事先指定类别数量，然而人工指定的类别数量往往不是最优类别数量。本节要讲的层次聚类，无须事先指定聚类数量。该类聚类算法更关心同类别下样本之间的相似性，优先从相似性出发，而不是预先指定聚类数量。

    所谓层次，就是类似于树结构的展开与回溯，逐层合并或拆分样本数据集。逐层合并是自底向上的聚类方法，称为凝聚层次法。如果使用凝聚层次法，那么开始的每个样本都是一个类，然后根据相似性度量法寻找同类样本，自下而上逐层地形成较大的类别。逐层拆解是自顶向下的聚类方法，称为分裂层次法。如果使用分裂层次法，那么开始的所有样本都属于同一个大类，然后根据相似性度量法逐层拆分样本，自上而下逐层形成较小的类别。

    由于大部分层次聚类法采用的是凝聚层次法，因此本节重点讲解凝聚层次法的执行流程。

    凝聚层次法的执行流程类似于哈夫曼树![哈夫曼树是带权路径长度最短的树，形成的哈夫曼编码主要应用于数据通信中。](img/note.png)的构建过程。哈夫曼树每次都会选择权值最小的节点组成一棵新树，直到所有节点合并成一棵权值路径最短的树。同理，凝聚层次法会根据样本之间的最小距离来合并成类，具体步骤如下。

    （1）每个样本独自为一类，计算两个类别之间的最小距离。

    （2）合并距离最小的两个类为一个新类。

    （3）重新计算产生的新类与剩余所有类之间的距离。

    （4）重复步骤（2）和（3），直到只剩下一个类或类间距离大于某个阈值。

    类间距离的计算方法可以采用最小距离法、平均法等。其中最小距离法计算的是类别之间最近样本的距离；平均法是最常用的方法，先计算两个类别之间所有样本的距离，然后取平均值作为这两个类别之间的距离。

    层次聚类不仅可以解决划分聚类需要事先指定类别数量的问题，在聚类过程中还可以发现类别之间的层次关系，并且能够聚出各种形状的类别。不过，在计算类间距离时，层次聚类的算法复杂度很高，而且有可能形成链状类别。


    ## 4.5.4 密度聚类


    层次聚类的最大问题是有可能形成链状类别，密度聚类则不存在这个问题。密度聚类是一种基于样本密度的聚类方法，类似于在一张地图上做人口密度分布图，密集区域通常被认为是城市所在地。因此，密度聚类是最直观的聚类方法。密度聚类的主要目标是寻找高密度区域，与距离聚类的不同之处在于，后者的结果通常表现为球状簇，而前者可以形成任意形状。只要参数设置合理，就不会形成链状类别，并且不会受噪声和离群数据点影响。

    密度聚类算法都会涉及邻域和数量。`DBSCAN`（`Density-Based Spatial Clustering of Application with
    Noise`）为比较有代表性的密度聚类算法，该算法用半径`R`表示邻域大小，用`N`表示邻域`R`范围内的样本数量。根据参数`R`和`N`，`DBSCAN`算法将样本分为以下
    3 类。

    • 核心点。在邻域`R`范围内数量不小于`N`的样本数据点。

    • 边界点。在邻域`R`范围内数量小于`N`的样本数据点，并且该样本数据点落在其他核心点的邻域内。

    • 噪声点。既不是核心点也不是边界点的样本数据点。

    如果只采用核心点计算聚类，那么可以将`DBSCAN`算法看作`k`均值算法的变种。因为加入了边界点和噪声点的计算，所以`DBSCAN`算法比一般的聚类算法更强大。`DBSCAN`算法的执行流程如下。

    （1）将所有样本数据点划分为核心点、边界点或噪声点。

    （2）删除所有噪声点。

    （3）将邻域`R`范围内的核心点连接成边，从而形成连通图`G`。

    （4）计算连通图`G`中的连通分量![连通分量所包含的节点两两之间直接或间接相连。连通图的连通分量是其本身。](img/note.png)`GCCi`，形成初步聚类。

    （5）将边界点划分到与之关联的核心点所在的类别。

    在使用`DBSCAN`算法完成聚类后，我们不妨试想一下每个类内部有什么特点。首先，类内不同的核心点之间一定能画出至少一条经过全部核心点的线路。其次，不同的边界点之间，一定能通过某些直接或间接相连的核心点间接相连。这里涉及
    3 个密度概念：密度直达、密度可达和密度相连。

    如图 4-18 所示，如果从核心点`p`出发，可以直接与点`q`相连，则称`p`密度直达`q`；如果核心点`p`在经过若干次密度直达后，可以间接与`q`相连，则称`p`密度可达`q`；如果核心点`p`可以分别密度可达边界点`q`和`s`，则称`q`和`s`密度相连。密度可达属于密度相连，密度直达属于密度可达。根据密度概念我们发现，每个类中的任意两点之间都是密度相连的。

    ![](img/137-1.jpg)

    图 4-18　密度概念区分

    虽然密度聚类算法优点很多，但是其时间复杂度也非常高，一般通过构建数据索引来降低其时间复杂度。


    ## 4.5.5 模型聚类


    模型聚类是指使用既定的算法模型计算不同样本之间的差别程度，进而将其归为不同的类别。模型聚类主要分为基于概率模型的聚类和基于神经网络模型的聚类，其中基于概率模型的聚类较为流行。在基于概率模型的聚类中，高斯混合模型聚类算法是最典型、最常用的模型聚类算法之一。

    顾名思义，高斯混合模型（`Gaussian Mixture Models`，`GMM`）由高斯模型组成。高斯模型就是我们常说的正态分布，因此高斯混合模型可以理解为几个正态分布的叠加。高斯混合模型聚类过程与`k`均值算法的执行流程类似，具体步骤如下。

    （1）随机生成`k`个高斯分布作为初始的`k`个类别。

    （2）对于每个样本数据点，计算其在各个高斯分布中的概率。

    （3）对于每个高斯分布，将样本数据点在该高斯分布中的概率作为权重，加权计算并更新其平均值和方差。

    （4）重复步骤（2）和（3），直到每个高斯分布的平均值和方差不再发生变化或已满足迭代次数。

    单特征的高斯混合模型聚类算法的执行流程图例如图 4-19 所示。

    ![](img/138-1.jpg)

    图 4-19　单特征的高斯混合模型聚类算法的执行流程图例

    如果样本数据集是多维情况，则需要计算协方差，将不同维度之间的关联性考虑进来。高斯混合模型聚类和`k`均值聚类一样，分类受类别个数的初始值影响较大。不过高斯混合模型聚类完的样本可以同时属于多个类别，这种聚类又称为软聚类。其他的模型聚类算法还有基于`PageRank`![网页排名算法，由
    Google 的创始人拉里·佩奇和谢尔盖·布林于 1998 年在斯坦福大学发明。](img/note.png)的软聚类算法、基于神经网络模型的自组织映射（`Self-Organizing
    Maps`，`SOM`）聚类算法等。


    ## 4.6 贝叶斯分类


    托马斯·贝叶斯（`Thomas Bayes`，1702—1761）是 18 世纪英国的神学家、数学家、数理统计学家和哲学家，他是概率论理论的创始人，创立了贝叶斯统计，是“归纳地”运用数学概率，“从特殊推论一般、从样本推论全体”的第一人。贝叶斯分类（`Bayesian
    Classification`）算法是基于统计学的一种分类算法，其特点是使用概率表示所有形式的不确定性，学习或推理都要用概率规则来实现。


    ### 4.6.1 概率基础


    概率（`Probability`）衡量的是事情发生的可能性大小。例如，投掷一个均匀的骰子，1～6 中任意一个点数朝上的可能性都为 1/6。在第 2 章，我们对概率相关的基本概念有了一个初步了解，本节进一步给大家讲解两种概率（先验概率、后验概率）和
    4 个公式（加法公式、乘法公式/条件概率公式、贝叶斯公式、全概率公式），这些公式不仅能帮助大家更好地理解贝叶斯分类算法，在生活中的应用也十分广泛。

    1. 先验概率

    先验概率是指在检验与验证之前，根据经验预先推测出来的概率。例如，投掷一个均匀的骰子，我们事先就能推测每个面朝上的概率是 1/6。

    2. 后验概率

    后验概率是指在得到实验结果之后重新校验的概率，可以理解为对先验概率的修正。

    3. 加法公式

    加法公式如下：

    `P(A∪B)=P(A)+P(B)-P(A∩B)`

    `A∪B`表示事件`A`发生或事件`B`发生，`A∩B`表示事件`A`和事件`B`同时发生。直观理解，加法公式的意思是事件`A`和事件`B`任意一个事件发生的概率，等于二者发生的概率之和减去二者同时发生的概率。加法公式对于任意两个事件`A`和`B`均成立，不要求`A`与`B`之间是条件独立![两个事件条件独立，是指一个事件是否发生，与另一个事件是否发生没有关系。](img/note.png)的。加法公式示意图如图
    4-20 所示。

    ![](img/140-1.jpg)

    图 4-20　加法公式示意图

    4. 乘法公式/条件概率公式

    乘法公式/条件概率公式如下：

    `P(A∩B)=P(A)P(B|A)=P(B)P(A|B)`

    `P(B|A)`表示在事件`A`发生的前提下，事件`B`发生的概率，即事件`B`的条件概率。直观理解，乘法公式的意思是事件`A`和`B`同时发生的概率，与事件`A`发生的概率和事件`B`的条件概率之积相等，并且与事件`B`发生的概率和事件`A`的条件概率之积相等。因此乘法公式又称为条件概率公式，其示意图如图
    4-21 所示。

    ![](img/141-1.jpg)

    图 4-21　乘法公式示意图

    5. 贝叶斯公式

    贝叶斯公式如下：

    ![](img/141-2.jpg)

    不难看出，贝叶斯公式是由乘法公式变换而来的。在机器学习中，贝叶斯公式通常写为

    ![](img/141-3.jpg)

    其中`D`是样本数据集，`P(h)`表示在没有进行样本训练之前预测目标`h`的初始概率，即前面提到的先验概率，先验概率反映了关于目标`h`的所有前提认知。而在机器学习中我们通常更关心后验概率`P(h|D)`，即样本训练集`D`中目标`h`成立的条件概率。

    6. 全概率公式

    全概率公式如下：

    ![](img/142-1.jpg)

    在全概率公式中，`Bi`表示两两不相同的时间段，`P(A|Bi)`表示在`Bi`时间段内事件`A`发生的概率，由于`Bi`两两不相容，因此事件`A`的全概率公式`P(A)`可以看作加法公式。


    ### 4.6.2 朴素贝叶斯分类


    在机器学习中，如何利用上面讲到的两个概率和 4 个公式进行分类呢？这便是朴素贝叶斯分类要做的事情。贝叶斯分类是指根据已分类样本的先验概率，估计待分类样本的后验概率。使用贝叶斯公式表示分类目标函数如下（其中`c`为类别，`x`为样本）：

    ![](img/142-2.jpg)

    但是，在样本具备多个特征的情况下，很难根据训练样本得到上式中条件概率`P(x|c)`的概率分布。针对这个问题，朴素贝叶斯分类应运而生。朴素贝叶斯分类避开了这个难题，对条件概率`P(x|c)`的概率分布做了条件独立的假设，即不同特征之间两两不相关。既然满足条件独立，就可以采用乘法公式计算`P(x|c)`的概率分布，公式如下（`d`为特征总数）：

    ![](img/143-1.jpg)

    有了条件概率的简化计算方式，即可得到朴素贝叶斯分类的目标函数，公式如下：

    ![](img/143-2.jpg)

    其中，`P(c)`可以直接统计训练样本中各个类别的比例。对于条件概率`P(xi|c)`，如果`x`是离散型特征，则可以通过计算在`c`类别中第`i`个属性取值为`xi`的比例。如果`x`是连续型特征，则需要先假设特征符合某种分布规律，如常见的二项分布、高斯分布、泊松分布、伯努利分布等，再计算相应的条件概率。在得到条件概率后，计算出概率最大的类别，就是朴素贝叶斯分类模型的预测结果。

    需要注意的是，在计算条件概率的过程中，有可能出现概率为 0 的情况，从而导致连乘之后的值为 0。这里需要引入拉普拉斯平滑系数，简单理解就是分子、分母同时加上一个常数，用于避免概率为
    0 的情况发生。可以证明，当训练集足够大时，加入拉普拉斯平滑系数的估计值会趋近真实的概率。


    ## 4.7 支持向量机


    支持向量机（`Support Vector Machine`，`SVM`）是一种非常有潜力的分类模型。与逻辑回归模型、神经网络模型相比，支持向量机有更强的数学理论背景。因此与其他分类模型相比，支持向量机的学习门槛相对较高。

    拆开来看，支持向量机分为支持向量和机两部分。前面提到，机在机器学习领域是算法的另一种称呼，如感知机、波兹曼机等。支持向量是指一些比较特别的样本，这些样本在真正意义上决定了支持向量机的模型参数取值。

    在 4.2 节中，我们举了房价和建筑面积之间关系的例子。在这个例子中，我们给每个样本增加一个“是否成交”标签。在构建样本数据点后，使用线性回归模型得到的分类结果如图
    4-22 所示，其中房价和建筑面积这两个特征分别为坐标系的横轴和纵轴，黑色样本点表示已成交，灰色样本点表示未成交。

    ![](img/144-1.jpg)

    图 4-22　线性回归模型的分类结果

    显而易见，线性回归能将“已成交”和“未成交”的样本数据划分开![在实际情况下，样本数据分布不会这么理想，这是为了方便算法讲解构造的完美样本数据。](img/note.png)。如果将图
    4-22 中划分的虚线稍微平移一点，或者旋转任意一个微小角度，其实也能达到同样的划分效果。那么，究竟哪一条虚线划分的效果是最好的呢？一种直观的判断方法为，虚线与两边样本之间平均距离越大越好。理论上如此划分的虚线，泛化能力是最好的，而支持向量机要做的就是找出与两边样本之间平均距离最大的虚线。

    在形式上，支持向量机的模型公式和线性回归模型公式一样，也是`f(x)=wx+b`。支持向量机给出的最优划分结果如图 4-23 所示。

    在图 4-23 中，两条灰色虚线与黑色虚线之间的垂直间隔距离相等。其中，处于两条灰色边界线上，支撑最优划分的样本数据点是支持向量，支持向量机的优化目标是最大化这个垂直间隔距离。

    ![](img/145-1.jpg)

    图 4-23　支持向量机的分类结果

    大家不妨先回忆一下点到直线的距离公式。直线方程为`Ax+By+C=0`，点的坐标为(`x0`, `y0`)，点到直线的距离公式如下：

    ![](img/145-2.jpg)

    我们将正、负例样本标签分别设置为 1、-1，将支持向量机的模型公式`y=wx+b`代入公式（4-1），可以得到支持向量机的距离公式：

    ![](img/145-3.jpg)


