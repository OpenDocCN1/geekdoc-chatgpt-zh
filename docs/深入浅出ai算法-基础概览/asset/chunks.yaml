    # 第5章 算法工程的组成部分

    在武侠小说中，无论是内力、招式，还是武功秘籍，如果不组成一套完整的实战打法与人比武切磋，则终究比不出孰优孰劣、孰高孰低。同样地，对于前面讲解的算法之内力、算法之招式和算法之武功秘籍，如果不进行有效的串联与整合，而是生搬硬套，那么不仅在实际运用过程中会困难重重，而且取得的最终效果也会大打折扣。在算法世界中，将这三者融合在一起并运用的完整流程就是本章要讲的核心内容──算法工程。

    本章会从原始数据的预处理开始，到算法模型验收为止，逐步讲解算法工程的完整流程。这个流程主要包括5部分，分别为数据分析、特征工程、建模与调参、效果评估和模型托管。


    ## 5.1 数据分析

    在《三国演义》中，诸葛亮在调兵遣将时经常说：关羽听令，给你三千精兵，从左路包抄曹军；张飞听令，给你五千精兵，从右路包抄曹军。由此可知，诸葛亮在用兵打仗之前，必然已经掌握了己方有多少将领、精兵、残兵、粮草、战场地势等情报。再如成语“量体裁衣”，是说按照身材尺寸裁剪出合适的衣服，用于比喻做事要从实际出发，因地制宜。算法工程也是同样的道理。在算法工程中，能做到知己知彼、“量体裁衣”的关键步骤，非数据分析莫属。

    无论是数据挖掘、机器学习相关的算法比赛，还是工业界的推荐、排序等场景中的算法应用，如果没有足够的数据分析结论作为支撑，那么能够取得的结果通常都不甚理想。为什么数据分析对机器学习算法结果的影响如此之深？有哪些实用的数据分析方法，这些方法在算法工程中又是如何起作用的呢？


    ### 5.1.1 宏观把握数据

    拿到数据，切勿着急生搬硬套模型，先统计各类指标或特征的数量，把握数据大局。这个数量包括但不限于样本数据集的总数量、不同类别样本的数量、各类特征或指标的数量、缺失值的数量及特征值的分布等。宏观把握数据是数据分析的基础，也是容易被忽视的一点，它能帮助我们避免一些基本问题。例如，在后续工作开展之前，先搞清楚所定算法目标是否合理，可以帮助我们少走弯路、不走死路，从而提高算法工程的实施效率。

    举个例子，在不考虑分布式训练的情况下，如果需要知道算法模型从训练任务启动到完成需要花费多长时间，则可以用训练样本的总数量除以`batch size`![每一批次同时输入算法模型中训练的样本量。](OEBPS/Images/note.png)，再乘每批次训练花费的时间，就能估算出一个`epoch`![模型训练的迭代单位，通常一个epoch表示遍历一遍数据集中的所有样本。](OEBPS/Images/note.png)花费的总时间，最后乘epoch的数量，即可得出算法模型的总体训练时间。如果在训练之前没有统计样本的总数量，那么模型训练何时结束，就只能对着屏幕默默等待了。

    一份拥有512条数据、特征维度为1000的数据集，假设`batch size`为128，一个`epoch`包含4个`batch`，`epoch`和`batch`之间的关系如图5-1所示。

    ![](OEBPS/Images/153-1.jpg)

    图5-1　epoch和batch之间的关系

    除此之外，如果发现验证集或测试集中正、负例样本的一方过少，如只有1个正例样本的极端情况，则可以提前终止无意义的训练过程，因为针对极端比例下的类别样本数据集，无论是模型训练，还是模型评估，都会完全失效。事先统计各类别样本的数量，能提前发现样本不均衡的问题，尤其在类别样本比例差别较大时，一方面能帮助划分训练集、验证集和测试集的大小，另一方面可以对样本进行重采样或降低采样比例。样本不均衡问题会在5.2.3节的特征工程技巧中进一步讲解。

    在一个动物分类数据集中，针对不同动物类别的数量统计结果如图5-2所示。

    ![](OEBPS/Images/154-1.jpg)

    图5-2　动物分类数据集中不同动物类别的数量统计结果

    对于数据字段的缺失问题（为空值或非法值），事先统计有助于掌握特征字段、标签字段等关键字段的缺失程度。如果缺失字段占比较低（通常1%以下可以忽略不计），那么可以直接丢弃；如果缺失字段占比较高，那么可能是源头数据出问题了，可以检查源头数据的收集过程是否存在问题，避免在训练过程中再出现问题，从而提高算法工程的整体效率。

    总之，在动手开始搭建算法模型前，对样本数据集先有一个宏观把控，可以帮助我们对算法目标有一个更清晰、具体的认识，从而做到少走弯路、有的放矢。


    ### 5.1.2 微观感受数据

    作为一门复杂学问，在机器学习算法工程中，无论采用什么模型，都不可能得到百分之百精确的结果。训练再好的回归模型，也不可能将预测值与真实值之间的预测误差降为0；即使分类效果再好的分类模型，也不可能保证每次的分类结果一定是正确的。在机器学习算法工程中，我们的工作是尽可能地逼近目标和真相。除了继续调参![在算法模型训练过程中，尝试选择不同的模型参数，从而达到最优预测结果，详见5.3.2节。](OEBPS/Images/note.png)优化模型，在数据层面，一方面，可以通过宏观把握数据提前发现问题；另一方面，可以微观感受数据，抽样观察单个样本数据的行为表现并思考其合理性，对算法工程的开展也大有帮助。例如，在包含用户行为序列的场景中，抽样观察具体的用户行为序列，设身处地地理解和感受用户行为特征，对用户行为序列的建模大有裨益。

    以电商场景为例，要真正理解用户数据，就必须对用户数据进行充分的观察。总体而言，抽样观察用户数据的方式主要有以下两种。

    第一，抽样观察用户个体维度的行为数据，换位思考，设身处地观察具体的用户行为序列，可以帮助我们更好地理解业务。行为数据是指用户在时间维度上的连续动作，如页面曝光、键盘输入、页面点击、鼠标滑动、触屏等行为。图5-3所示为一段完整的用户网上购物行为序列。笔者自从事电商行业相关算法工作以来，多次发现靠直觉得来的关于用户行为的观点，与用户的实际行为表现并不相符。例如，直觉上认为用户应该先单击商品A，然后单击商品B，由于运营规则、前端规则或用户偏见等原因，用户的实际行为表现可能会恰恰相反。

    ![](OEBPS/Images/156-1.jpg)

    图5-3　用户网上购物行为序列示例

    第二，抽样观察用户个体维度的统计指标，可以帮助我们更好地进行业务建模。并不是所有业务场景都适合使用复杂模型，有时基于规则的方法在某些业务场景中更容易出效果。笔者曾经跟进过一个保险返利![在体验指定保险产品后返还红包或实物奖品。](OEBPS/Images/note.png)项目，项目目标是挖掘参与保险购买活动的作弊用户，从而减少因不正当手段获取返利带来的损失，净化拉新![营销活动用词，是指拉动与发展新用户。](OEBPS/Images/note.png)指标。在项目前期，我们直接使用人工标记的作弊订单作为样本标签，基于逻辑回归训练了一个作弊分类器。但是，该作弊分类器在真实数据集上的分类效果很差。后来，我们根据对保险业务的重新理解，统计相关总体指标，提炼出几条满足非正常用户的规则，并且通过规则筛选出了一批作弊订单，然后在验证阶段通过电话逐一回访，发现大部分用户填写的手机号是无法拨通的空号，因此确认这些订单均为作弊订单。在这个反作弊场景中，基于规则的算法不仅简单易实现，作弊订单命中率非常高，而且具备极强的模型可解释性，只需根据当前作弊订单所命中的作弊规则，给出相应的规则描述。这便是微观感受数据带来的价值。


    ### 5.1.3 分析方法

    无论是从宏观角度分析数据，还是从微观角度分析数据，都可以统一归为两个步骤：计数和展示。

    1. 计数

    所谓计数，就是围绕特定维度，通过特定方法计算得到统计量。统计量可以是绝对值类型，如人数、金额；也可以是相对值类型，如占比、点击率、转化率。

    举例一，样本数量。维度可以是样本总体，也可以是不同的样本标签。基于这些维度可以统计得到样本总数量、不同样本标签下的总数量，如电商购物场景中每天的订单总量、销量排名前十的商品、不同种类下的订单总量、不同种类销量排名前十的商品等。

    举例二，特征分布。维度是特征。如果是离散型特征，那么直接统计不同特征值出现的次数；如果是连续型特征，那么先进行等频或等宽![特征工程中将连续型特征转换成离散型特征的方法，详见5.2节。](OEBPS/Images/note.png)的特征离散化处理，再统计每个特征区间出现的次数。例如，在电商购物场景中，将年龄特征作为统计维度，可以得到不同年龄段的顾客数量和订单数量；将历史消费额度特征作为统计维度，可以得到不同消费层次的顾客数量和订单数量。

    举例三，用户行为。维度是标识用户的唯一编号。根据用户的唯一编号，可以关联该用户在某个时间段内的所有行为数据，然后按照时间的发展顺序排列，从而完整复现该用户在平台上产生的一连串动作序列。例如，在电商购物场景中，使用用户的账户编号追溯一次完整的用户购物过程，包括页面展现、页面点击、商品购买/加购、付款等行为。

    举例四，商品访问量。维度是标识商品的唯一编号。根据商品的唯一编号，可以统计该商品在不同时间段内的访问量，对用户编号进行去重统计，还可以得到该商品在不同时间段内的访客数。

    2. 展示

    所谓展示，就是将统计结果直观地呈现出来。常见的展示方式有3种，分别为表格、图形和文本。

    1）表格。

    当需要展示多维度数据时，可以采用表格这种既常见又实用的统计结果展示方式。表格不仅可以呈现丰富的数据，还可以在数据之间进一步对比，对于关键值和重要指标，可以通过加粗或改变颜色的方式突出显示。

    2）图形。

    图形是最直观的统计结果展示方式。常用的图形有折线图、散点图、柱形图和饼图。其中折线图主要用于看趋势，散点图主要用于看分布，柱形图主要用于看高低，饼图主要用于看占比。

    3）文本。

    并不是所有的统计结果都适合使用表格或图形进行展示。例如，当统计结果只有一两个指标时，可以对其进行总结性的观点描述。虽然文本呈现的内容不如表格多，呈现效果不如图形直观，但它可以直接传达数据背后的意义。


    ## 5.2 特征工程

    数据和特征决定了机器学习的性能上限，而机器学习算法只是在逼近这个上限。在具体问题中，数据样本空间通常是固定不变的，因此特征的质量尤为关键。提高特征质量的关键，就是特征工程（Feature
    Engineering）。特征工程的本质是一种工程，所有关于特征数据的处理和加工，都属于特征工程的范畴。一方面，大部分机器学习算法对非结构化特征数据束手无策，因此必须通过数据预处理将某些原始数据格式转换成模型可接受的读取格式；另一方面，机器学习算法虽然具备一定的数据抽象学习能力，但是特征可能有千万种，如何从中选择特征、融合特征，甚至创造特征，从而提高算法模型的学习效率和质量，就显得尤为重要。特征工程主要解决的就是这两方面的问题，其作用是给模型算法铺路，将晦涩、粗糙的特征转换成对模型友好的特征。


    ### 5.2.1 数据预处理

    在提取特征之前，需要对所用数据进行预处理，确保数据的可用性。数据预处理通常会检查缺失值和错误值。在缺失比例和错误比例可接受范围内，可以通过取平均值、中位数或众数的方式填补缺失值，也可以直接将包含错误值的数据样本行或列删除。如果缺失比例或错误比例过高，就需要考虑数据源本身是否存在问题了。


    ### 5.2.2 特征分类

    总体而言，特征分为离散型（无序）特征和连续型（有序）特征两大类。离散型特征为文本类型的特征，如姓名、性别、邮编、城市、文档，离散型特征之间不存在顺序和大小关系。连续型特征通常为数值类型的特征，如年龄、时间戳、价格、销量，连续型特征之间存在顺序或大小关系。


    ### 5.2.3 工程技巧

    1. 缺失值处理

    是否丢弃包含缺失值的样本集的计算结果对比如表5-1所示。其中，左边为包含缺失值的样本集及丢弃包含缺失值的样本后的样本集的计算结果，右边为没有缺失值的样本集及相应的计算结果。

    表5-1　是否丢弃包含缺失值的样本集的计算结果对比

    ![](OEBPS/Images/160-1.jpg)

    根据表5-1可知，在丢弃包含缺失值的样本后，女生中喜欢打篮球的比例发生了很大变化（从75%变为50%），因此不要轻易丢弃包含缺失值的样本。对于离散型特征缺失值，最简单的处理方法为填入空字符串；对于连续性特征缺失值，最简单的处理方法为补0。

    关于缺失值的具体处理标准，对训练集而言，如果包含缺失值的训练样本太多，如超过一半，则说明收集的数据整体有问题，必须重新收集数据；如果包含缺失值的样本比例不高，则可以根据业务知识考虑是删除该样本，还是删除整个特征列。对测试集和验证集而言，如果是连续型特征，则可以使用训练集中该特征的平均值或中位数填补缺失值；如果是离散型特征，则可以使用训练集中该特征的众数（出现频率最高的特征值）填补缺失值。

    2. 特征变换

    常用的特征变换方法有三种：连续型特征离散化、特征编码和特征缩放。

    1）连续型特征离散化。

    最常用的方法为分箱（`Binning`）（又称为分桶），分箱是处理连续型特征的一种方法。连续型特征的取值个数是无限的，而值与值之间轻微的变化对预测目标的影响较低，分箱可以基于这种轻微变化的规律，将线性特征转换成非线性特征，从而提升特征的表达能力。分箱的方式有三种。第一种为等频分箱，在特征的取值范围内，按照特征值从小到大的顺序排列样本，同时将样本按照数量均分成N份，每份作为一箱，同一个箱子中的特征值相同（通常用0和1表示）。例如，将样本按照某特征从小到大的顺序排列，然后按照每桶样本数量相等的方式将其分成4箱，如图5-4所示。第二种为等宽分箱，在特征的取值范围内，将特征值按照从小到大的顺序排列，并且将其均匀划分成N份，落在同一份中的样本属于同一箱，同一箱特征向量的结果相同，示例如图5-5所示。第三种为聚类分箱，和前两种按照频数或取值等分的方式不同，这种方式通过聚类算法将相似样本特征值聚在一起作为分桶特征。与人为指定分桶方式的等频分箱和等宽分箱相比，聚类分箱更灵活、合理。

    ![](OEBPS/Images/161-1.jpg)

    图5-4　等频分箱示例

    ![](OEBPS/Images/162-1.jpg)

    图5-5　等宽分箱示例

    离散化之后的特征对于异常数据具有较强的健壮性，模型会更稳定。此外，离散化操作相当于引入了非线性特征，提升了特征的表达能力。不仅如此，离散化后的特征也比较方便和其他离散型特征进行后续的特征交叉等处理。

    2）特征编码（`Feature Encoding`）。

    当拿到的原始特征数据是文本类型的数据时，一般需要通过特征编码的方式将其转换成模型可识别的数值型数据。常用的特征编码方式有三种。第一种是手动建立映射字典，根据业务知识和目标任务，为离散型特征建立数字索引，用于进行映射。第二种是`label
    encoding`，这种方法仅适用于有序特征，对于一个有m个类别特征的样本数据集，在经过`label encoding`处理后，每个类别都会映射到0～m\-1的整数上。第三种是独热编码，即`One-hot`编码，这种方法很常见，一个类别特征的取值一共有m种，在经过独热编码处理后，该类别特征会变为长度为m的0-1向量，并且只有特征值对应的位置为1。值得一提的是，前面讲到的分箱其实也是独热编码的一种实现方式。

