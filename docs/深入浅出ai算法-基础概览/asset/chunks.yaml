- raw: "\n\n## \n\n随时、随地、随心阅读\n\n![](cover.jpeg)\n\n当当云阅读\n\n## 版权信息\n\nCOPYRIGHT\
    \ INFORMATION\n\n书名：深入浅出AI算法:基础概览\n\n作者：吕磊\n\n出版社：电子工业出版社\n\n出版时间：2021-07-01\n\
    \nISBN：9787121415517\n\n本书由电子工业出版社有限公司授权北京当当科文电子商务有限公司制作与发行。\n\n— · 版权所有 侵权必究\
    \ · —\n\n![](OEBPS/Images/qzy.jpg)\n\n## 内容简介\n\n本书从理论到实践，循序渐进地介绍了人工智能算法的基础知识，帮助读者敲开人工智能算法之门。本书内容共8章，包括算法的历史背景与基本概念、算法相关的数学基础知识、信息学算法与数据结构相关的概念与知识，以及业界常用的机器学习算法。同时，本书还介绍了算法工程的组成部分，以及一个典型的算法工程实践项目，手把手带领读者体验算法的魅力。本书还介绍了人工智能算法的三大研究方向，帮助读者迈向AI算法的进阶学习之路。\n\
    \n本书每一章的内容都采用了“总分总”形式，并且在章节末尾提炼出该章的核心关键词，方便读者进一步查询回顾。其中，第2章～第7章配有若干代表性的思考题，帮助读者巩固章节所学知识。\n\
    \n本书适合从事与人工智能相关的工程技术人员和高等院校相关专业的学生，以及在AI领域就业一两年以内的职场人士阅读。\n\n## 推荐序\n\n自进入21世纪以来，得益于大数据和计算机软硬件技术的迅猛发展，在全球范围内出现了机器学习研究与应用的热潮。机器学习大大提高了语音识别、图像识别、自动驾驶、虚拟现实和机器人等高新技术的发展进程。与前三次工业革命一样，机器学习也是一种能够产生巨大生产力的革命性技术。机器学习是专门研究如何让计算机模拟或实现人类行为的过程，通过调整特定的参数和配置，使对应的机器学习算法模型不断改善自身在某个方面的性能，如对话、翻译、游戏、驾驶等。它是当前人工智能（AI）发展的主要方面，是使计算机具有智能的重要途径。现阶段所讨论的AI算法，通常指的就是机器学习算法。\n\
    \n作为一门交叉学科，机器学习涉及概率论、统计学、组合数学、最优化理论等多门学科，因此学习门槛很高。如何降低机器学习算法的学习门槛，让更多的人可以理解、掌握这些算法并加以改进，从而应用于实际工作中，是一个亟须解决的问题。而本书是在这方面所做的有益尝试。\n\
    \n本书共8章，内容丰富，对常用的机器学习算法进行了深入浅出的介绍。围绕机器学习算法，本书囊括理论和实践，在保证完整性的前提下，重点探讨各个环节中的核心问题。从广度上看，本书讨论了算法的两种类别，即偏逻辑类型的信息学算法与偏数据类型的机器学习算法。从深度上看，本书讨论了相关的数学原理、算法原理及工程实战。\n\
    \n本书作者吕磊曾于山东大学师从于我，攻读硕士学位，毕业后先后就职于京东、阿里巴巴、亚马逊与微软的AI相关部门，在工业界有较为丰富的机器学习算法应用经历。\n\
    \n本书可以作为对人工智能与机器学习感兴趣的本科生、研究生，以及程序开发人员的算法入门参考书。\n\n禹晓辉  \n\n加拿大约克大学信息技术学院副教授 \
    \ \n\n山东大学计算机科学与技术学院兼职教授、博士生导师\n\n## 前言\n\n为什么会有这本书\n\n在笔者从事算法相关的工作后，身边有不少朋友问笔者“算法到底是什么”“如何理解人工智能（Artificial\
    \ Intelligence，AI）的概念”等问题。他们平时在各类电视节目、网络自媒体及新闻媒体中经常接触AI算法的相关信息，因此对AI算法表现出比较浓厚的兴趣。\n\
    \n经过进一步的沟通了解，笔者发现可以将这些朋友划分为两类人群。第一类人群，他们希望从事AI算法职业，或者希望转型做AI算法相关的工作；第二类人群，他们不想学习AI算法，但是想了解AI算法背后的原理，以及整个AI项目的运作机制、流程和规律等。无论是第一类人群的“入门”需求，还是第二类人群的“鸟瞰”需求，市面上已经有很多相关资料，如吴恩达![华裔美国人，斯坦福大学计算机科学系和电气工程系副教授，人工智能与机器学习领域的权威学者之一。](OEBPS/Images/note.png)在Coursera![一个公开的在线课程项目，旨在与世界顶尖大学合作，在线提供网络公开课程。](OEBPS/Images/note.png)上发布的机器学习课程、斯坦福大学的CS在线课程系列![斯坦福大学计算机科学系本科和研究生的在线课程。](OEBPS/Images/note.png)、周志华![南京大学计算机科学与技术系主任，人工智能学院院长。](OEBPS/Images/note.png)的《机器学习》![周志华所著，机器学习宝库，又称为“西瓜书”。](OEBPS/Images/note.png)及网络上的各种算法学习教程等。这些都是非常优质的AI算法学习资源。但可惜的是，对大部分人来说，一方面，Coursera和斯坦福大学的课程门槛太高，零基础入门不易；另一方面，虽然大部分学习资源在某个方向上基本都能做到比较高质量的讲解，但很少有学习资源是使用算法串联整体内容的，即很少有学习资源可以同时满足“入门”和“鸟瞰”需求。学习者往往需要通过整合多个信息源，才能对AI算法形成一个较为完整的总体印象。\n\
    \n此外，在和朋友讨论算法的过程中，笔者发现一件比较有意思的事情：大家通常会聊到两类算法，一类是信息学算法![又称为ACM算法，本书后续内容将统称为基础算法。](OEBPS/Images/note.png)，另一类是AI算法![又称为机器学习算法。](OEBPS/Images/note.png)。虽然都叫算法，但没有一个比较权威的划分方式将二者区别开。比较常见的区分方法是，信息学算法是有确定答案的、结果准确率为100%的精确算法；而AI算法的答案是不确定的，其结果的准确率通常也不可能达到100%。从这个角度来看，信息学算法的运算过程其实和简单的数学运算的运算过程没有本质区别，二者在每一步计算环节都有明确的结果，最后都会得到一个确定答案。AI算法在每次训练后的准确率都不固定，这体现出了“智能”的高低差异。虽然，当下“人工智能”要摆脱“人工”的日子看起来比较久远，但至少已经出现了一些让人为之惊叹的“人工”奇迹，如AI围棋程序、AI语音助手和AI自动驾驶等。\n\
    \n关于这两类算法的区别，笔者从《樊登读书》中获得了一种新的思考角度。书中提到，这个世界上有一种学问叫作简单科学，还有一种学问叫作复杂科学。简单科学可分为很多个步骤，每个步骤都有明确的输入和输出，各个步骤之间的因果关系清晰、明确、可追溯。例如，建造一栋大楼，或者建造一艘飞船，虽然工程复杂，但完全符合简单科学的范畴。复杂科学是混沌的，因果关系并不明确，如蝴蝶效应、群智涌现![指群体智慧的出现，如分工明确的蚁群，井井有条的沙丁鱼群。](OEBPS/Images/note.png)等。笔者借助从樊登老师那里得到的灵感发现，信息学算法的步骤和结果明确，AI算法的因果关系混沌，二者恰好可以分别归于简单科学和复杂科学的范畴。这种分法或许比前面的分法更有趣一些。\n\
    \n为了满足读者“入门”和“鸟瞰”的不同需求，一方面，本书在内容筛选上必须大刀阔斧，又不能破坏内容结构的完整性；另一方面，本书将上述两类算法囊括在一起呈现，使读者能清晰、明确地认识二者之间的区别与联系。\n\
    \n本书是笔者温故知新的结果。俗话说，好记性不如烂笔头。通过归纳、总结与再学习，笔者在AI算法方面也有不少新的认识和收获。\n\n本书的读者定位\n\nAI算法博大精深，所含各部分内容都足以各自形成一本书。本书作为一本算法概览书，其内容尚不足以形成完整而系统的算法学习体系。此外，考虑到笔者存在的信息采样误差，本书挑选的常用知识点不一定具备绝对的普适性。\n\
    \n本书的目标受众包括但不限于行业属性或工作职能与AI算法有关的人士、从事传统行业的工程师、面临毕业的学生、初入职场的人士等。当然，无论是哪一类人群，前提都需要对AI算法感兴趣。爱因斯坦说过，兴趣是最好的老师。笔者希望，读者在读完本书后，可以对AI算法有一个较为清晰的整体认识，并且针对自己感兴趣的环节进行更深入的学习。\n\
    \n本书的内容及风格\n\n本书从介绍算法是什么开始，包括发展简史和目前与算法有关的职位和领域，循序渐进地帮助读者敲开算法的大门。首先，本书甄选了与算法有关的数学基础知识，包括线性代数、排列组合、高等数学、概率与统计等，为读者正式接触算法奠定一定的数学基础。其次，本书从信息学算法与数据结构入手，讲解了二者最常用的概念与知识点，帮助读者培养一定的算法逻辑思维能力和数据结构思想。然后，切入AI算法正题，从总体视角将AI算法划分为两种类别，并且甄选业界常见的几类机器学习算法模型，帮助读者在总体把控的前提下，掌握不同机器学习算法模型中的具体算法，以及它们的实现原理。接着，本书会介绍算法工程的组成部分，并且手把手带领读者完成一个简易的算法工程项目，通过实践加深其对AI算法的理解，使其能够学以致用。最后，本书挑选出AI算法的三大研究方向，帮助读者铺垫AI算法学习的进阶之路，并且总结了笔者对算法行业的思考和展望。全书内容从基础到进阶，从理论到实践，层层递进。\n\
    \n学习算法对数学基础和逻辑思维的要求比较高。因此，本书尽量通过列举与生活息息相关的例子，对其中的一些概念进行直观讲述，如向量、矩阵、数组、链表。不过，并不是所有的知识点都可以通过直观举例来讲解，如高等数学中的导数和梯度、概率与统计中的各种名词等。所以，对于真正想入门AI算法的读者，该下的功夫、该花的时间是少不了的；而对于只想对AI算法有所了解的读者，在遇到较难理解的概念和公式时，只需了解它们在AI算法中的作用，可以跳过理论细节。\n\
    \n本书的章节标题运用了武侠小说中的“内力”“招式”“武功秘籍”，分别对应数学基础、信息学算法和机器学习算法。有人说，信息学算法和机器学习算法没什么关系，其实不然。看过武侠作品的读者应该知道，“内力”和“招式”作为“武功秘籍”修炼的前提，是一种基础能力。相应地，数学基础和信息学算法对学习机器学习算法而言，不仅是基础的铺垫，而且有助于思维模式的培养。\n\
    \n本书每章的内容都采用“总分总”形式，并且在章节末尾提炼出核心关键词，方便读者进一步查询回顾。其中在第2章～第7章末尾，针对章节内容留有若干思考题，帮助读者巩固和理解相关知识。关于动脑时刻的答案，请关注“对半独白”微信公众号并回复“动脑时刻”获取。\n\
    \n我与本书的局限性\n\n本书的局限性。与其他同类型的机器学习入门书籍相比，本书关于AI算法的内容要少很多。本书作为一本AI算法图书，主要目的在于帮助读者构建一个较为完整的AI算法基础知识体系。作为一本只有200多页的书，既然选择了整体性，就必须舍弃部分性，这便是本书最大的局限性。但反过来想，无论哪一门学问，其知识体系都在持续不断地迭代更新。从这个角度来看，真正做到内容大而全的书，其实是不存在的。所谓“万变不离其宗”，授人以名目齐全之鱼，不如授人以追本溯源之渔。因此，本书在内容层面的局限性，未尝不会成为目标读者群体的优先选择性。\n\
    \n笔者的局限性。有一个词可以充分表达笔者的局限性，这个词或许也可以描述所有作者的局限性，那就是“偏见”。数据有偏见，写作也有偏见。在AI算法模型中，我们需要做的非常重要的一件事就是减少数据偏见，以及降低数据偏见带来的不良结果。所谓写作偏见，就是笔者在写作之前的各种经历和所处环境，对本书写作所带来的影响，包括但不限于长期积累所形成的个人认知水平、表达水平、专业水平、职业惯性，乃至个人素养和品质。因此，书中如有表达不当或有失偏颇之处，望读者海涵。\n\
    \n吕磊\n\n## 致谢\n\n首先，我想感谢阅读本书的读者朋友。你们的青睐和支持，给了我坚持写作的原动力。如果本书能给大家带来收获，是我莫大的荣幸。\n\
    \n然后，我想感谢本书的责任编辑——电子工业出版社的宋亚东先生。您从“对半独白”公众号第一次联系到我直到现在，已近3年时光。从决定开始写书到最终完稿，这之间的过程真的十分不容易，感谢您一路对我的帮助。如果没有您的支持与鼓励，我不会顺利完成本书的写作，您是我人生旅程中的伯乐。\n\
    \n最后，我想感谢我的妻子——魏金璐。从校园恋爱开始，谢谢你一路走来对我的付出，不管遇到什么困难，你总是默默地在我身边倾听与陪伴，无论是工作还是生活，都给了我无穷的动力。\n\
    \n吕磊\n\n## 第1章  \n\n算法入门\n\n在学习一门技能之前，先了解这门技能的需求和功能，可以让学习目标更加明确，让学习更有动力。随着计算机硬件技术的飞速发展，我们可以收集到各种类型的互联网数据、交通数据、气象数据等并将其保存下来。根据收集到的不同场景中的数据，可以总结出相应的规律，从而制定、调整和优化针对不同场景的策略。总结这些规律的具体方法，就是我们要讲的算法。\n\
    \n在各大互联网公司中，算法相关的岗位招聘越来越多。除了比较典型的算法工程师（外企中相应的岗位为数据科学家），还有数据分析工程师、数据挖掘工程师和机器学习工程师。这几个岗位的工作内容既有相同之处，又有不同之处。那么，算法与数据分析、数据挖掘、机器学习的区别与联系是什么？算法与人工智能之间有什么关系？带着这些问题，本章为大家打开算法之门，揭开算法的神秘面纱。\n\
    \n### 1.1　打开算法之门\n\n#### 1.1.1　算法简史\n\n算法存在的前提是数据，有数据才能有算法。最早关于人类记录数据的例子是公元前18\
    \ 000年前出现的符木。生活在旧石器时代的部落人民学会了在树枝上刻下凹痕来记录日常的物品供应和一些简单的交易活动，并且能够通过比较树枝的凹痕进行基本的计算，进而对一些事情做出简单的预测，如食物可以储存多久不变质。\n\
    \n到了公元前4000年左右，在发源于亚洲西部亚美尼亚高原的幼发拉底河与底格里斯河河畔（两河流域），居住着一群人类最早的居民——苏美尔人，他们创造了璀璨的苏美尔文明，也就是美索不达米亚![美索不达米亚（Mesopotamia）是古希腊对两河流域的称呼，意为两河之间的土地。](OEBPS/Images/note.png)文明的开端。\n\
    \n在像美索不达米亚那样极其恶劣的气候下，知道播种和收获的准确时间是必不可少的，因此有必要找到某种确定时间的可靠途径。最简单的方法是利用月亮的盈亏循环。月亮由最初的蛾眉月到下一个最初的蛾眉月共需要29天半的时间，人们就考虑将这样一个循环视为一个基本的计时单位（我们将其称为一个月），然后在月亮累计运行12个这样的计时单位（6个29天，6个30天）后，一“年”就过去了，又到了开始播种的时候。不幸的是，他们不知道一年实际上是地球绕太阳公转一周的时间，月亮的12次循环或12个月比一个太阳年少11天。在900年后，苏美尔人才了解到，每隔几年他们就要在其年历上另加一个闰月，才能准确地预测季节的循环。\n\
    \n通过感受季节的周期性更替，结合对太阳和月亮的观察，苏美尔人花了900年的时间收集数据，完成了人类的第一个算法模型——太阴（月）历。随后，苏美尔人发明了度量，包括12单位度量和60单位度量，这便是人类最早的十二进制和六十进制。现在世界各国通行的时间度量方法，每天分为24小时，每小时包含60分钟，每分钟包含60秒，钟表刻度盘上走一圈为12小时，还有以12为基本计量单位的“打”，都是在十二进制和六十进制的基础上发展而来的。在公元前2500年左右，苏美尔人就已经掌握了加、减、乘、除四则运算的计算方法，形成了早期比较简单的几何与代数方法论。\n\
    \n时间线走到公元前300年左右，一种耳熟能详的算法——辗转相除法，由古希腊数学家欧几里得提出，因此这个算法又称为欧几里得算法。辗转相除法的意思是两个正整数a和b（a\
    \ > b）的最大公约数，等于a除以b的余数与b的最大公约数。该算法的具体步骤如下。\n\n（1）输入两个正整数a和b；\n\n（2）计算a除以b的余数r；\n\
    \n（3）如果r等于0，则最大公约数为当前的b值，算法结束；\n\n（4）如果r不等于0，则a=b，b=r，跳转至步骤（2）。\n\n在公元100年左右，比较全面的算法研究出现在由我国古代的张苍和耿寿昌撰写的《九章算术》中。作为我国古代的数学名著，《九章算术》的内容十分丰富，全书采用问题集的形式，总结了自春秋战国至秦汉以来的数学成就，对246个与生产、生活有联系的应用问题逐一提供了与之相应的解决之法。不过，《九章算术》存在着不可忽视的缺点，那就是全书没有任何数学概念的定义，在各个问题的解决方法中，也没有给出相关的理论推导与证明。直到三国时期，数学家刘徽给《九章算术》作注，才弥补了这个缺陷。\n\
    \n总之，早期的算法研究倾向于计算和解决与日常生活息息相关的数学问题。随着算法理论的发展和人类科技的进步，算法研究逐渐转向研究数据本身的规律和价值，尤其是在生产与生活中产生的大量数据所带来的预测价值和决策价值。\n\
    \n到了20世纪上半叶，数理统计学蓬勃发展。作为数学的一个重要分支学科，数理统计学主要研究随机数据的收集、汇总与分析之法，然后对相应的实际问题做出预测和推断。这期间先后诞生了影响至今的两大统计学派——频率学派和贝叶斯学派。从20世纪初开始，以Fisher和Pearson为主要代表人物的频率学派，推动数理统计学发展成为一门成熟的学科。频率学派从自然的角度出发，试图直接给事物本身建模，认为概率就是频率，描述数据分布的参数是固定的，可以使用估计方法得到数据分布的参数值。然而，频率学派这种类似上帝视角的问题切入法，并不能很好地解决所有的实际问题。在20世纪中叶以后，曾一度被频率学派扼杀的贝叶斯![18世纪英国神学家、数学家、数理统计学家和哲学家，概率论理论创始人，贝叶斯统计的创立者。](OEBPS/Images/note.png)统计迅速发展壮大起来，和频率学派分庭抗礼。贝叶斯学派否定了频率学派的概率就是频率的观点，并且不从描述事物本身入手，而是从观察者角度出发，构造出了一套在贝叶斯概率体系下，对事物不确定性做出推断的框架和方法。当然，无论是频率学派，还是贝叶斯学派，都贡献了一系列非常实用的算法并沿用至今。例如，频率学派的最大似然估计（Maximum\
    \ Likelihood Estimate，MLE）在神经网络模型中应用广泛；贝叶斯学派的蒙特卡罗方法（Monte Carlo Method）在强化学习的探索和发现中起到了非常关键的作用。总之，两大学派的理论都很重要，缺一不可，并无高下之分。\n\
    \n从20世纪下半叶开始，在两大统计学派的激烈博弈中，感知机学习、统计学习、归纳学习、浅层学习等陆续萌芽发展，这类研究数据本身规律和价值的算法，称为机器学习算法。到了20世纪80年代，机器学习算法逐渐成了一个独立的研究方向。在这段时间，诞生了大量关于机器学习的算法，其中一些比较典型的、具有代表性的算法将在后续的章节中介绍。\n\
    \n注意：为了避免概念混淆，本书有关特定数学问题的算法（前言中提到的信息学算法，详见第3章）统称为基础算法，有关研究数据规律和价值的算法（详见第4章）统称为机器学习算法（或AI算法）。\n\
    \n#### 1.1.2　算法与人工智能\n\n相信有不少读者是抱着对人工智能的兴趣阅读本书的。在比算法世界更大的世界中，人们谈论更多的也是人工智能，而非算法。那么，二者到底有什么关系？"
  fmt: '

