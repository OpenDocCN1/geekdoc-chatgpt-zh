    ### 6.2　开源算法库


    在算法工程的前期准备工作完成后，就可以开始实现第 4 章中的各种机器学习算法了。如果对自己的编码能力有信心，并且对机器学习算法的内部运作原理感兴趣，则可以尝试从零开始编码，自己上手实现神经网络、决策树和聚类等机器学习算法，对这些算法的理解会比直接调用开源算法要深刻得多。当然，从零开始编码，从而实现机器学习算法并非本章的初衷。


    关于机器学习算法的实现，本章会使用`scikit-learn`和`TensorFlow`两种比较流行的开源算法库，带大家进行算法工程实战。其中，`scikit-learn`适合初学者在单机环境下学习机器学习算法，如果需要分布式部署，则需要结合其他开源组件实现；`TensorFlow`是由谷歌人工智能团队谷歌大脑（`Google
    Brain`）开发和维护的开源算法库，比`scikit-learn`更庞大，并且支持分布式部署，在业界的工业级应用十分广泛。这两种开源算法库都有可读性非常强的`Python`接口可供使用者调用，下面分别介绍这两种开源算法库及安装方法。


    #### 6.2.1　scikit-learn


    `scikit-learn`（简称`sklearn`）是基于`Python`语言开发的一款简单、高效的数据挖掘和数据分析工具，提供了包括回归、聚类、决策树、神经网络等常见的机器学习算法模型包。针对
    3 种主流操作系统，`sklearn`官方网站分别提供了具体的安装方法。此外，`sklearn`有一个相当不错的中文网站，方便汉语母语初学者参考学习。


    安装`sklearn`最简单的方法是使用`pip`命令。如果没有进行过`alias`处理，`Python 3`对应的命令应为`pip3`。`sklearn`的安装方法如图
    6-8 所示，选择合适的操作系统，使用`pip`命令安装`sklearn`。


    ![](img/190-1.jpg)


    图 6-8　sklearn 的安装方法


    在安装成功后，在`PyCharm`界面底部单击“`Terminal`”按钮，执行以下命令。


