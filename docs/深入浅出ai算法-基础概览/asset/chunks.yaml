    # 第 2 章 算法之内力

    数学涵盖的知识面非常广，本章会根据重要程度筛选出数学与算法之间的相关知识点，包括线性代数、排列组合、高等数学、概率与统计、最优化原理；然后将每个知识点细分为名词解释和具体用法两部分，按照从易到难的顺序，尽量采用通俗易懂的语言进行讲解，帮助读者修炼算法世界的“内力”。


    算法是一个比较抽象的概念。往大了说，所有涉及运算的方法都可以称为算法；往小了说，在信息技术（`Information Technology`，`IT`）领域，算法可以是解决数学问题的方法与技巧，也可以是描述机器学习或数据挖掘的相关方法，本书会从这两个方面展开剖析。


    讲清楚什么是算法并不是一件容易的事情，完整且浅显易懂地讲明白更是难上加难。算法涵盖了很多相关学科的基础概念与知识点，涉及的名词解释与概念介绍较为生涩，难免会降低读者的学习兴趣。作为一本算法知识普及图书，本书涵盖的每部分内容虽然不必太深，但必须全面。因此，如何保证本书的阅读趣味性、内容的完整性与连贯性，在提笔写书之前的很长一段时间里，困扰了我很久。直到后来重看古装电视剧《天龙八部》才猛然发现，本书所要讲的算法，和金庸先生笔下的武功体系，其实有着异曲同工之妙。


    金庸武侠，闻名遐迩。说到金庸先生笔下的武功体系，无外乎两大方面：内力和招式。看过《天龙八部》的读者应该知道，聚贤庄一役，被逐出丐帮的萧峰义字当头，对战中并没有使用半招降龙十八掌，而是只用了一套普普通通的太祖长拳，就将围攻他的武林高手打得落花流水，节节败退。为什么？凭的就是他深厚雄浑的内力。由此可见，一旦具备了深厚的内力，普通招式也能发挥出强大的威力。而在算法的世界中，数学功底即“内力”，只有将数学这门“内力”修炼好，才能让算法在实际应用中发挥出强大的作用。


    ## 2.1 线性代数

    线性代数是数学的一门分支学科，研究的是线性空间中的函数问题。顾名思义，“线性”是指要研究的代数之间的关系是简单的一次关系，研究过程中没有复杂的数学运算（如平方和开方）；“代数”是指用符号代替数字，方便研究。


    对于数学关系`f(x+y)=f(x)+f(y)`，线性代数不关心其中`x`和`y`的具体含义是什么，其研究的是拥有这种线性映射关系的函数`f`所具备的性质。


    函数是指输入一个数，在经过某些计算后输出另一个数。随着研究的问题越来越复杂，有时需要输入多个数，然后经过运算输出多个数。从这个角度来说，线性代数解决的就是多输入或多输出的函数问题。


    ### 2.1.1 名词解释

    在线性代数中，单个数称为标量，用中括号括起来的多个输入的数或多个输出的数（多个标量）称为向量和矩阵。标量、向量和矩阵是算法工程中经常用到的线性代数核心概念。下面从数学角度给出标量、向量和矩阵的概念，以便加深读者对线性代数基本概念的理解。


    • 标量：表示一个简单的数，如 29、31 等。

    • 向量：表示一组有序的标量，能够写成一行或一列的形式。

    • 矩阵：表示一组有序的向量（一个或多个），可以用二维数组的形式表示。


    下面来看一个例子。假设某家包子铺周一能卖出 50 个肉包，这里的“50”就是一个标量；如果这家包子铺某周每天卖出的包子数量依次是`[50, 51, 52,
    53, 52, 48, 45]`，则“`[50, 51, 52, 53, 52, 48, 45]`”是一个向量；加上这周每天卖出的豆沙包、咸菜包的数量，组成如下数据形式，就是一个矩阵。


    ![](img/031-1.jpg)


    ### 2.1.2 向量和矩阵

    标量的概念比较简单，因此我们重点讲解向量和矩阵。向量和矩阵在算法工程中经常用到。例如，一条样本的所有特征值构成一个向量，一批样本的所有特征值构成一个矩阵。几乎所有的算法公式都可以写成向量或矩阵的形式，机器学习中的算法模型通常所说的批（`batch`）训练，其底层的计算逻辑就是利用向量和矩阵的运算。由此可见，掌握向量和矩阵的相关知识，对于算法“内力”的修炼至关重要。既然涉及运算，自然会有相应的运算法则，那么向量和矩阵的运算法则是怎么样的呢？


    向量可以分为行向量和列向量，二者在本质上并无区别，只在进行运算时有差别。下面通过生活中的具体例子，逐一介绍与向量有关的运算法则。


    某公司有`n`名员工，月工资用向量`[a1, a2, …, an-1, an]`表示，其中`ai`表示第`i`个员工的月工资数额。


    情形一：公司业绩不错，公司老板决定给每位员工涨薪 20%，可以用向量与标量之间的乘法来计算涨薪后的工资，如表 2-1 所示，其中`k`为原工资倍数，即 1.2。


    表 2-1　员工涨薪情况（一）


    ![](img/032-1.jpg)


    具体计算方法用数学符号表示如下，得到的结果仍然是向量。向量与标量之间的除法类似，可以理解为向量与标量的倒数相乘。


    ![](img/032-2.jpg)


    情形二：公司业绩不错，根据员工完成业绩的不同，老板决定对不同的员工给出相应的工资涨幅。以绝对值涨幅为例（也可以是不同的比例涨幅），给第`i`位员工每月增加`bi`元工资，可以用行（列）向量与行（列）向量之间的加法来计算涨薪后的工资，如表
    2-2 所示。


    表 2-2　员工涨薪情况（二）


    ![](img/033-1.jpg)


    具体计算方法用数学符号表示如下，计算结果仍然是向量。


    ![](img/033-2.jpg)


    向量与向量之间的减法与加法类似，计算结果仍然是向量。


    情形三：老板在按照不同的涨幅比例给员工涨薪之后，想知道工资开支的总预算是多少，可以用行向量与列向量之间的乘法来计算。具体计算方法如下。


    ![](img/033-3.jpg)


    由此可知，行向量与列向量相乘的结果是一个标量。


    根据行向量与列向量相乘的例子可知，使运算成立的一个隐含条件是，行向量的列数必须与列向量的行数相等，如例子中的向量长度均为`n`，这有助于理解后面的矩阵运算（向量是一种特殊的矩阵）。列向量的列数与行向量的行数都等于
    1。一个列向量与一个行向量相乘，即可得到一个矩阵，具体计算方法如下。


    ![](img/034-1.jpg)


    在机器学习中，向量通常用于表示特定维度空间中不同维度的特征值，因此又称为特征向量。例如，一个二维特征向量`[1, 2]`表示两个特征，第一个特征维度的值为
    1，第二个特征维度的值为 2。既然是空间，那就存在距离的概念，即同一个特征空间中不同特征向量之间存在着某种关系，如相似的特征表现。假设有另一个二维特征向量`[2,
    4]`，其在两个特征维度上的值分别为 2 和 4，可以发现，这个二维特征向量和前面的二维特征向量，在各个维度上的特征值大小恰好相差一倍，这说明二者的特征表现相似，只是程度不同。当然，在实际算法工程中，特征向量之间的关系会有更复杂的度量方式，如相似度、相关系数等。


    矩阵运算和向量运算的运算法则类似。标量与矩阵的加法、减法、乘法，只需将标量与向量的每一个值分别相加、相减、相乘，得到的结果仍是矩阵。以标量与矩阵的乘法为例，计算方法如下。


    ![](img/034-2.jpg)


    矩阵与向量之间只有乘法。如果矩阵与行向量相乘，那么行向量的列数必须与矩阵的行数相等，并且行向量必须位于乘号的左边，计算方法如下。


    ![](img/035-1.jpg)


    如果矩阵与列向量相乘，那么列向量的行数必须与矩阵的列数相等，并且列向量必须位于乘号的右边，计算方法如下。


    ![](img/035-2.jpg)


    矩阵与矩阵相乘，乘号左边矩阵的列数必须与乘号右边矩阵的行数相等，计算方法如下。


    ![](img/035-3.jpg)


    假设`A`、`B`、`C`表示矩阵。


    矩阵之间的加法满足交换律，计算公式如下。


    ![](img/035-4.jpg)


    矩阵之间的乘法满足结合律，计算公式如下。


    ![](img/036-1.jpg)


    在线性代数中，关于向量和矩阵的知识点还有很多，包括单位矩阵、对角矩阵、对称矩阵等，这些知识点在`PCA`降维、协同过滤和矩阵分解等算法中都有所运用，下文只对这些概念进行简单介绍，感兴趣的读者可以自行深入拓展学习。


    单位矩阵是一个方阵，这个方阵从左上角到右下角的对角线（称为主对角线）上的元素均为 1，其他元素均为 0，示例如下。


    ![](img/036-2.jpg)


    对角矩阵也是一个方阵，这个方阵除主对角线上的元素外，其他元素均为 0，主对角线上的元素可以不为 1，示例如下。由此可知，单位矩阵属于对角矩阵。


    ![](img/036-3.jpg)


    对称矩阵也是一个方阵，这个方阵只需满足以主对角线为对称轴，两边对称位置的元素相等，示例如下。由此可知，单位矩阵和对角矩阵都属于对称矩阵。


    ![](img/036-4.jpg)


    ## 2.2 排列组合

    大部分读者应该对排列组合比较熟悉，因为它在高中的数学课上出现过。与解析几何相比，排列组合的公式简单，并且理解起来比较容易、直观。


    排列组合包含两个概念：排列和组合。举个例子，假设某小组一共有 5 个人，有以下两个问题。


    ① 从该小组中选出 3 个人站成一排，一共有多少种排法？

    ② 从该小组中选出 3 个人打扫卫生，一共有多少种选法？


    对比问题①和问题②可以发现，问题①需要考虑顺序，问题②不需要考虑顺序。这便是排列与组合的区别。问题①要计算排列种类数，排列用字母`P`（Permutation）或`A`（Arrangement）表示；问题②要计算组合种类数，组合用字母`C`（Combination）表示。在计算时，组合种类可以看作排列种类的子集。


    可以用形式化的语言描述排列问题，即`n`个人中计算`m`个人的排列。继续思考前面的例子，如果要从 5 个人中选 3 个人站成一排，那么应该如何选择并排列？首先，从
    5 个人中选择 1 个人站在位置 1 上，有 5 种选法；然后从剩下的 4 个人中选择 1 个人站在位置 2 上，共有 4 种选法；最后从剩下的 3 个人中选出
    1 个人站在位置 3 上，一共有 3 种选法；因此共有 60（5×4×3）种排列方法。这种计算方法就是阶乘。使用字母`A`表示排列，具体计算公式如下。


    ![](img/037-1.jpg)


    由于组合不用考虑选出来的人的排列顺序，因此，只需用计算出来的排列方法总数除以选出人数的排列方法总数。所有排列方法叫作全排列，`n`个人的全排列总数等于`n`的阶乘。对于前面的例子，组合方法总数就是
    10（60 / 3!）种。使用字母`C`表示组合，具体计算公式如下。


    ![](img/038-1.jpg)


    在 AI 算法中，排列组合主要用于计算特征组合（交叉）后的特征总数。


    ## 2.3 高等数学

    看到这节，你可能会问：搞 AI 算法还需要学习高等数学？大家知道，高等数学涵盖的知识点比较多，并且比较难以理解。别担心，本书只讲解高等数学中与 AI 算法最相关的两个知识点——导数和梯度。这两个知识点在
    AI 算法的公式推导中至关重要，有助于帮助我们理解算法模型在实际应用中起作用的原因。


    ### 2.3.1 导数


