    #### 6.4.2　数据分析


    在5.1节，我们总结了数据分析主要包括的两个步骤──计数和展示。


    首先，我们对特征的缺失值进行计数，查看原始数据集中的特征值是否有缺失的情况。在6.4.1节，我们根据逗号切分存储后的特征数据，存储的数据类型均为字符串类型。因此要检验是否有缺失值，只需对空字符串计数。NumPy提供了非常方便的字段值检查方法argwhere，用于检查空字符串，具体实现代码如下。


    ![](OEBPS/Images/202-2.jpg)


    该方法可以将所有满足值条件的特征值所在行的下标组成数组并返回，取数组长度即可得到缺失特征值的总数量。如果存在缺失特征值的样本，则可以使用平均值对其进行填充或将该条样本删除。当然，如果缺失特征值的样本占比过大（如已经超过了1%），则可能是源数据存在问题。


    为了便于数据分析和作图展示，我们引入了另一个Python高效数据处理库Pandas。Pandas是基于NumPy的一种数据分析工具，与NumPy最大的区别是，Pandas可以提供数据索引，可以更加方便地进行数据的查询和筛选，从而执行一些类似于数据库表查询的操作。Pandas读取数据集的方式如下。


