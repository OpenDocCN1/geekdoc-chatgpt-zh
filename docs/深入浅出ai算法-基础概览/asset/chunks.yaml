    #### 6.2.2　TensorFlow


    `TensorFlow`（简称`TF`）是谷歌公司内部演变出来的、高鲁棒性的、开源的工业级机器学习框架，其前身是`DistBelief`。`DistBelief`是由`Geoffery
    Hinton`带领团队开发的一个实现了广义反向传播算法的框架，被广泛应用于谷歌公司内部的科研项目及商业产品中。后来，谷歌公司决定将`DistBelief`升级成更加稳健、快速、通用的机器学习框架，调动了很多工程师和科学家投入框架改造项目，其中就包括闻名遐迩的`Jeff
    Dean`。


    `TF`采用计算图的形式构建算法模型。如果将数据比作水，那么计算图就是一个首尾衔接的管道系统，模型运行过程就相当于管道系统通水的过程。计算图的设计方式对分布式训练天然友好，计算图可以复制成多份，然后将其分发到不同的机器节点上进行训练。`TF`还支持多平台运行。例如，在`PC`上完成训练，在`iOS`或`Android`系统上进行预测。


