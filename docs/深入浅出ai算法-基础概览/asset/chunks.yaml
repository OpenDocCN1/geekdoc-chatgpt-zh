    ## 4.9 本章小结

    本章首先从算法分类开始讲起，介绍了算法的分类方法。然后讲解了最常见的几种机器学习算法，包括线性回归、逻辑回归、人工神经网络、聚类、贝叶斯分类和决策树等，帮助大家对机器学习算法有一个初步认识。当然，机器学习算法作为算法的武功秘籍，每种秘籍都有更深入的细节内容与前沿发展动向，本着普及算法的主要目的，本书旨在抛砖引玉，点到为止，感兴趣的读者可以继续深挖学习。

    在掌握了各大主流机器学习算法的基础之后，笔者相信在遇到不同种类的机器学习问题场景时，读者应该能够大概判断出在不同场景中分别适合用哪一类算法模型求解了。


