    ## 6.4　工程实战


    在熟悉开源算法库的使用方法之后，可以开始本章的重头戏，即在真实数据集上完成一次算法工程实战。数据在生活中无处不在，并且每时每刻都在不断地增加，如社交平台的用户聊天数据、电商平台的用户浏览数据和交易数据。当然，这些数据只有在相关公司从事相关算法工作的员工才有可能接触到，而且不能用于私人用途。算法爱好者虽然无法接触这些公司的数据，但可以使用仅供研究学习的开源数据集。本章基于一份开源的美国人口普查数据集，手把手带大家完成一次第
    5 章介绍的算法工程。


    ### 6.4.1　数据准备


    这份开源的美国人口普查数据集的官方网址在其附录中可以找到，单击首页的“Data Folder”可以看到下载地址。该数据集有 14 个特征，共 48 842
    条样本数据。其中`adult.data`为训练集，共有 32 561 条样本数据；`adult.test`为测试集，共 16 281 条样本数据。该数据集提供了分类算法的目标，即预测一个人的年收入是否超过
    5 万美元。


    我们知道，特征类型主要分为离散型和连续型两种。在开始算法工程之前，我们先来了解这 14 个特征的名称、含义及类型，如表 6-1 所示，从而方便对后续特征数据的处理和转换。


    表 6-1　14 个特征的名称、含义及类型


