    ### 6.4.2　数据分析


    在 5.1 节，我们总结了数据分析主要包括的两个步骤──计数和展示。


    首先，我们对特征的缺失值进行计数，查看原始数据集中的特征值是否有缺失的情况。在 6.4.1 节，我们根据逗号切分存储后的特征数据，存储的数据类型均为字符串类型。因此要检验是否有缺失值，只需对空字符串计数。`NumPy`提供了非常方便的字段值检查方法`argwhere`，用于检查空字符串，具体实现代码如下。


    ![](img/202-2.jpg)


    该方法可以将所有满足值条件的特征值所在行的下标组成数组并返回，取数组长度即可得到缺失特征值的总数量。如果存在缺失特征值的样本，则可以使用平均值对其进行填充或将该条样本删除。当然，如果缺失特征值的样本占比过大（如已经超过了
    1%），则可能是源数据存在问题。


    为了便于数据分析和作图展示，我们引入了另一个`Python`高效数据处理库`Pandas`。`Pandas`是基于`NumPy`的一种数据分析工具，与`NumPy`最大的区别是，`Pandas`可以提供数据索引，可以更加方便地进行数据的查询和筛选，从而执行一些类似于数据库表查询的操作。`Pandas`读取数据集的方式如下。


    ![](img/202-3.jpg)![](img/203-1.jpg)


    其中，字符串数组`headers`主要用于存储特征列名，`read_csv`方法主要用于从文本文件中以逗号和空格（`''\s''`）的组合符为分隔符读取每行数据，字符串数组`na_values`主要用于将数据字段中的字符串`"null"`、问号和空格符转换为缺失值（`NaN`），方便后续进行数据清洗操作。可以根据原始数据的具体情况，在字符串数组`na_values`中定义需要转换的无效字符。


    使用`shape`方法可以查看读取数据集的形状，使用`iloc`方法可以按照序号查看具体的样本数据，如下面代码中的“0:3”表示查看第 0 条、第 1 条和第
    2 条样本数据（下标从 0 开始计算）。


