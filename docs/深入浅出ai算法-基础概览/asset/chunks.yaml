    此外，在使用神经网络的 AI 算法中，神经元的层数一般不止一层，相邻层的输出是下一层的输入，即一个函数的因变量是另一个函数的自变量，在求导过程中会用到一种称为链式法则的复合函数求导方法。复合函数`f(x)=g[h(x)]`的链式法则如下。


    `f''(x)=g''[h(x)]h''(x)`


    此外，AI 算法中的特征维数通常不止一维，即多维自变量。包含多维自变量的函数称为多维函数，多维函数的导数称为偏导数。偏导数的求法很简单，在对多维函数中的某一维变量求导时，将其他维变量视为常量即可。


    ### 2.3.2 梯度


    函数的导数值又称为梯度，梯度是带有方向的，多维自变量所在的每个维度均代表一个方向。在 AI 算法中，特征数据通常是多维的，每个维度都有一个梯度，不同维度上的自变量对应的偏导数大小不一样，梯度的大小也就不一样。在算法训练过程中常说的某个特征学得快一点，就是因为这个特征在维度方向上的梯度较大。梯度传递是算法训练过程中的一个重点，其中的梯度消失和梯度爆炸问题会严重影响模型的最终效果，这部分内容将在第
    4 章详细讲解。


    ## 2.4 概率与统计


    ### 2.4.1 名词解释


    在学习新概念之前，掌握常见的名词解释，好比在下厨炒菜时能熟练说出调料名和菜名一样，有助于我们加深对每个环节的了解，让学习过程变得更加顺畅。此外，准确理解并说出相应的名词概念，也是一种专业表现。


    1\. 概率统计


    研究自然界中随机现象统计规律的数学方法，称为概率统计，又称为数理统计。概率统计主要的研究对象为随机事件、随机变量及随机过程。


    2\. 随机事件


    概率统计统计的是随机事件发生的概率。随机事件是指在大量的重复实验中发生的概率具有某种规律的事件。例如，抛掷同一枚硬币，“正面朝上”就是一个典型的随机事件。随机事件通常简称为事件。事件之间的基本关系如表
    2-3 所示。


    表 2-3　事件之间的基本关系


    ![](img/042-1.jpg)


    和集合运算一样，事件之间的运算也具备以下 3 个性质。


    • 交换律：`A∪B=B∪A`，`A∩B=B∩A`。

    • 结合律：`A∪B∪C=A∪(B∪C)`，`A∩B∩C=A∩(B∩C)`。

    • 分配律：`A∩(B∪C)=(A∩B)∪(A∩C)`，`A∪(B∩C)=(A∪B)∩(A∩C)`。


    3\. 随机变量


    事件会发生就会有结果，可以使用随机变量描述随机事件可能发生的结果，如抛十次硬币正面朝上的次数、某个地铁站每天的上车人数、灯管的寿命、某个班级学生的身高和体重等。


    4\. 离散型随机变量和连续型随机变量


    抛硬币正面朝上的次数和地铁站的上车人数都是可数的，最小单位是 1，在数学中称为离散，这类随机变量称为离散型随机变量。灯管寿命、人的身高体重的取值是连续的，没有最小单位，在数学中称为连续，这类随机变量称为连续型随机变量。


    5\. 随机过程


    简单而言，随机过程就是随机变量随某个参数变化的过程，这个参数通常是时间，如周一至周五某个地铁站随时间变化的候车人数。


    6\. 数学期望


    抛掷一枚质地均匀的硬币，正反两面出现的概率各占一半，在进行足够数量的抛掷实验后，正反两面实际出现的次数会各自接近 50%，这个 50%就是数学期望。数学期望反映的是随机变量的平均值，其计算方法是用实验中事件的发生概率乘重复实验的总次数，一般用字母`μ`或`E`表示。


    7\. 方差


    顾名思义，方差是某种差值，主要用于衡量随机变量的实际取值与其数学期望之间的偏离程度，计算公式如下。


    `E{[X–E(X)]2}`


    8\. 标准差


    标准差是方差的算术平方根。


    9\. 协方差


    协方差是指方差的多变量扩展，主要用于衡量两个随机变量`X`和`Y`之间的总体误差，计算公式如下。


    `E{[X–E(X)][Y–E(Y)]}`


    10\. 概率分布


    概率分布主要用于描述随机变量在随机事件中表现出来的一种状态，是概率关于随机变量的函数。


    11\. 概率密度


    可以将概率密度直观地理解为事件发生的结果落在随机变量某段取值范围内的概率。从数学角度来说，就是概率分布函数在某段区间内的积分。有读者可能已经发现，只有连续型随机变量才有概率密度，离散型随机变量对应的概念为概率质量。


    12\. 条件概率


    顾名思义，条件概率是指事件满足一定条件所发生的概率。在通常情况下，两个事件`A`和`B`，`P(A | B)`表示在事件`B`发生的前提下，事件`A`发生的概率。


    ### 2.4.2 概率分布


    日常生活中到处都有概率分布的身影，本节按照从易到难的思路，给大家讲解最常见的几种概率分布。


    1\. 伯努利分布


    伯努利分布是最简单的概率分布，随机变量只能是离散型随机变量，只有两种取值（事件成功取 1，失败取 0）。生活中的伯努利分布有很多。例如，明天是否下雨，雷霆队下一场对勇士队的比赛是否能赢，等等。


    伯努利分布的数学期望如下。


    `μ=p`


