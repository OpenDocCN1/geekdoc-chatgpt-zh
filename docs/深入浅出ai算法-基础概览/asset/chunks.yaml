- raw: '计数排序的最大问题是随着待排序列值域的扩大，空间复杂度也随之增加。桶排序（Bucket Sort）是计数排序的进化版本，它不是一对一的下标映射，而是通过一个映射函数，一对多地将大小接近的数存储于一个桶中，然后对每个桶中的序列进行排序。如果每个桶中排序的时间复杂度为O(NlogN)，那么桶排序的时间复杂度为∑O(NilogNi)。


    9\. 基数排序


    计数排序和桶排序都较难解决混合数据的排序问题，如字符串之间的排序。基数排序（Radix Sort）是桶排序的升级版，其基本思路是从待排元素的低位到高位每轮都按位分桶，按位比较元素值的大小，摆脱了数据类型的限定。基数排序的时间复杂度为O(dN)，其中d是最大位数。


    在实际使用过程中，除了时间复杂度，有时还需要考虑排序算法的稳定性。排序算法的稳定性是指在排序过程中是否会改变任意两个相等元素的前后顺序。一个排序算法如果不改变任意两个相等元素的前后顺序，则是稳定的排序，否则是不稳定的排序。


    为了方便读者理解和记忆，下面对以上9种排序算法在时间复杂度和稳定性上进行优劣对比，如表3-1所示。


    表3-1　9种排序算法对比


    ![](OEBPS/Images/073-1.jpg)


    #### 3.2.2　递归与分治


    1\. 递归


    简单地说，程序调用自身的编程技巧称为递归。递归（Recursion）的学术定义如下：一个函数、过程、概念或数学结构，如果在其定义或说明内部直接或间接地出现其本身的引用，则它们是递归的或递归定义的。


    具体而言，递归可以分为递推和回归两个阶段。问题逐层往前递进推动，这个过程叫作递推；逐一解决子问题，最后汇总为原问题，这个过程叫作回归。二者交替配合，就形成了递归。我们通过一个直观的例子感受递归的整体流程。


    某所中学的校团委为了筹集团员活动经费，计划向本校的每一位团员收取团费。该通知采取逐级传达的方式，校团委通知年级团委，然后年级团委通知班团委，最后班团委通知到班里的每一位团员。这种逐层递进传递任务的过程，就是递推过程。在任务发布后，只有在每一级的团费收集任务全部完成后，才能向上一级汇报。例如，在班里每一位团员的团费都收齐之后，班团委才能向年级团委汇报；在每个班的团费都收齐之后，年级团委才能向校团委汇报。这种在子任务全部完成之后，自下向上汇报的过程，就是回归过程。整个团费收集的过程，就是一个完整的递归过程。


    当然，有递归就有非递归。所谓非递归，就是不用层级关系来表达任务，而是将任务拉平成线性关系表达任务。因此，支持递归实现的基础算法会比非递归实现理解起来较为简单直观。举个例子，求长度为n的斐波那契数列各项之和。递归写法和非递归写法的代码实现分别如下。


    ![](OEBPS/Images/074-1.jpg)


    对比发现，递归写法的程序具备结构清晰、可读性强等优点，并且递归写法比非递归写法的代码更容易实现。当然，一些问题如果使用递归算法求解，会因为重复计算的问题让算法变得低效，递归的代码抽象，容易出错且很难调试。例如，斐波那契数列求和就不适合使用递归算法求解。所以，只有当问题本身是递归定义的，或者问题涉及的数据结构是递归定义的时，递归算法才是最佳选择。经典的递归问题有八皇后问题、汉诺塔问题和全排列问题。


    2\. 分治


    分治（Divide Conquer Algorithm）就是“分而治之”的意思，实质是将原问题分成N个规模较小、结构与原问题相似的子问题，然后递归地求解这些子问题，最后得到原问题的解。与递归算法相比，分治算法强调的是同层级问题分别治理的过程，而递归算法强调的是不同层级问题之间的逐层递进与回归的过程。


    分治算法的思想在日常生活中随处可见。例如，某学院需要选拔一名乒乓球打得最好的学生，代表学院参加学校的乒乓球单打比赛。首先选拔出各班级的第一名，然后从各班级的第一名中选拔出各年级的第一名，最后从各年级的第一名中选拔出学院的第一名。将“选拔学院第一名”拆分成“选拔各年级的第一名”，再进一步拆分成“选拔各班级的第一名”，这个过程就是分治过程。


    因此，分治算法有两个适用条件。其一，大问题能分解成若干个独立的子问题；其二，每个子问题的求解过程都和大问题相似。这两个条件决定了分治的递归过程是受限的，需要提前知道递归过程的终止条件及每一层的逻辑，因此分治算法的应用场景不如递归算法的应用场景多。经典的分治问题包括快速排序、归并排序及地毯填补。


    #### 3.2.3　贪婪算法和动态规划


    所谓贪婪，就是只看眼前小利，不看长远收益的思想。贪婪算法是一种局部最优算法，动态规划则是一种全局最优算法。


    1\. 贪婪算法


    贪婪算法（Greedy Algorithm）是指每一步都采取当前最好或最优（最有利）的选择，从而使结果是最好或最优的算法。一个问题是否适合使用贪婪算法解决，可以根据无后效性判断。无后效性是指某个状态之后的收益，只与当前状态有关，不受之前状态的影响。通俗地讲，就是眼前的最大收益可以带来最终的最大收益。现实生活中有不少问题满足无后效性，下面以经典的贪婪问题──超级书架为例进行讲解。


    问题描述：有N个物品，第i个物品的高度为Hi，还有一个高度为B的书架，保证这些物品的高度之和大于或等于书架的高度B。最少从这N个物品中取出多少个物品，可以使取出来的物品堆起来的总高度不低于书架的高度B。


    每次只需选择当前剩余物品中最高的物品，直到所选物品的高度之和超过书架为止，所选物品的数量就是答案。


    2\. 动态规划


    动态规划（Dynamic Programming，DP）是解决多阶段最优化问题的一种算法。这个定义听起来有些令人费解，我们不妨对比贪婪算法来理解。贪婪算法认为选择当前步骤的最大收益可以带来最终的最大收益。试想，有没有这样一类问题，在当前步骤不选择最大收益，最终的收益却比贪婪算法的收益高？答案是肯定的。下面给大家介绍一个和超级书架问题类似的经典动态规划问题──背包问题。


    问题描述：一个容量为M的背包，现在有N个物品，第i个物品的体积为Ni，如何选择物品装包才能使背包的利用率最大？


    按照贪婪算法装包不一定得到最优解。例如，对于容量为10的背包，假设有5个体积依次为（6、5、3、3、2）的物品，使用贪婪算法会按从大到小的顺序装包，因此体积为6和3的物品被选出，背包容量利用率为90%。但是，最优的策略应该是将体积为5、3和2的物品装包，此时背包的利用率为100%。


    那么，动态规划是如何得到上面这个解的呢？还是上面的背包问题。如果一开始只有4个容量分别为2、3、5、6的背包，那么最优的装包方式就是往4个背包中分别放入2、3、5和6。紧接着，加入3个容量分别为7、8、9的背包，最优的装包方式分别为，容量为7的背包在装入容量为5的背包的基础上再放入2；容量为8的背包在装入容量为6的背包的基础上再放入2，或者在装入容量为5的背包的基础之上再放入3；容量为9的背包在装入容量为6的背包的基础上再放入3。最后，一个容量为10的背包如何装包，显然最优方案是在装入容量为7的背包的基础上再装入3，或者在装入容量为8的背包的基础上再装入2，如此装包的容量利用率就达到了100%。这便是“多阶段最优决策”的一个完整展现。背包问题的动态规划过程如图3-14所示。


    ![](OEBPS/Images/077-1.jpg)


    图3-14　背包问题的动态规划过程


    依次循环遍历物品。第1轮，随着每个物品的放入，能在空背包状态下得到4种可放置容量，分别为2、3、5、6。第2轮，在第1轮可放置容量的基础上，不重复放入，新增7、8、9共3种可放置容量。第3轮，在第2轮可放置容量的基础上，不重复放入，即可装满容量为10的背包。


    根据上述对“多阶段最优决策”过程的图文解释可以发现，动态规划的求解过程是一个从局部计算逐步推到整体计算的过程。归纳如下：首先，得到“最小规模”的局部最优解；然后，基于“最小规模”的局部最优解，得到“次小规模”的局部最优解；以此类推，从局部到整体，即可得到全局最优解。这个过程可以用递推公式来描述。例如，背包问题的递推公式是f(n)=f(n–c\[i\])，f(n)表示容量为n的背包是否能装满，c\[i\]表示第i个物品的体积。这个递推公式又称为动态转移方程。背包问题的代码实现如下。


    ![](OEBPS/Images/078-1.jpg)


    上述背包问题是最简单的一种背包问题，叫作01背包，即要么放要么不放，其经典变种问题有多重背包问题和完全背包问题，都可以用动态规划求解。此外，典型的动态规划问题还有导弹拦截、字符串距离和最长公共子序列等。


    #### 3.2.4　搜索


    搜索是更有组织纪律的枚举。枚举是指在一个有限范围内列举出所有可能的情况，以便找出所有解。因为枚举比较简单，所以不进行单独介绍。与枚举相比（如著名的暴力枚举法），搜索的针对性和目的性更强。搜索分为深度优先搜索和广度优先搜索，二者的侧重点不同。


    深度优先搜索（Depth First Search，DFS）又称为深度优先遍历。深度优先，顾名思义，就是每轮搜索都会从当前节点沿一条路找下去，直到每条路都走到尽头，即遍历完所有节点或满足某个条件，算法结束。图3-15所示为深度优先搜索示例，起点为A，深度优先搜索的遍历序列为ABDECFG。


    ![](OEBPS/Images/079-1.jpg)


    图3-15　深度优先搜索示例


    宽度优先搜索（Breadth First Search，BFS）又称为“宽度优先遍历”或“广度优先遍历”。宽度优先搜索的每一轮会将距离当前节点最近的节点全部找出来，按这种方法依次找下去，直到遍历完所有节点或满足某一条件，算法结束。图3-16所示为宽度优先搜索示例，BFS的遍历序列为ABCDEFG。


    ![](OEBPS/Images/079-2.jpg)


    图3-16　宽度优先搜索示例


    #### 3.2.5　最短路径


    最短路径（Shortest Path）的问题在生活中很常见，如交通运输规划、出行线路规划等。按照算法规模，最短路径算法可以分为全局最短路径算法和单源最短路径算法。全局最短路径算法有弗洛伊德算法（Floyd''s
    Algorithm），单源最短路径算法有迪杰斯特拉算法（Dijkstra''s Algorithm）、贝尔曼-福特算法（Bellman-Ford''s Algorithm）。


    1\. 弗洛伊德算法


    弗洛伊德算法是斯坦福大学计算机科学系教授罗伯特·弗洛伊德以当前公认的形式提出的。弗洛伊德算法运用了动态规划，可以求出一个图中任意两点之间的最短路径。基本思路是每轮选取两个节点，然后枚举其他节点，如果经过某个节点能让选取的两个节点之间的距离缩短，就更新这两个节点之间的距离。代码实现如下，其中f表示任意两点之间的距离，可知弗洛伊德算法的时间复杂度为O(V3)。


    ![](OEBPS/Images/080-1.jpg)


    2\. 迪杰斯特拉算法


    迪杰斯特拉算法是由荷兰计算机科学家迪杰斯特拉于1959年提出的，主要用于解决有向图中的单源最短路径问题。其基本思路是以起始节点为中心，每次选一个距离起始节点最近的节点，然后扩展该节点相邻的节点并更新与它们之间的距离，直到扩展完所有节点。需要注意的是，迪杰斯特拉算法无法计算带负边的图。迪杰斯特拉算法示例流程如图3-17所示，其时间复杂度为O(V2)。


    ![](OEBPS/Images/081-1.jpg)


    图3-17　迪杰斯特拉算法示例流程


    图3-17中的迪杰斯特拉算法示例流程的解读如下。


    （a）以a为起始节点，初始化起始节点的距离为0。


    （b）更新与最优解节点a相邻的节点b和c的距离。


    （c）更新与最优解节点c相邻的节点b、d、e的距离。


    （d）更新与最优节点e相邻的节点d的距离。


    （e）更新与最优节点b相邻的节点d的距离。


    （f）与最优节点d相连的节点无须更新，算法结束。


    3\. 贝尔曼-福特算法


    贝尔曼-福特算法是由美国数学家理查德·贝尔曼和莱斯特·福特提出的。如果迪杰斯特拉算法的思路是以点扩展边，那么贝尔曼-福特算法的思路是以边扩展点。贝尔曼-福特算法不仅能解决迪杰斯特拉算法无法计算的负值问题，而且能识别负值回路。贝尔曼-福特算法示例流程如图3-18所示，其时间复杂度为O(VE)。


    ![](OEBPS/Images/082-1.jpg)


    图3-18　贝尔曼-福特算法示例流程


    图3-18中的贝尔曼-福特算法示例流程的解读如下。


    （a）以a为起始节点，初始化起始节点的距离为0。


    （b）使用与节点a相连的边更新节点b和c的距离。


    （c）使用与节点b和c相连的边更新节点b、d、e的距离。


    （d）使用与节点b相连的边更新节点d的距离。


    （e）图中各边已无更新必要，算法结束。


    #### 3.2.6　最小生成树


    最小生成树（Minimal Spanning Tree，MST）首先是一棵树，“最小”的含义是这棵树的边长之和最小。那你可能会问，为什么不叫“最小树”？不妨这样来理解，“生成”是一个动词，强调的是这棵“最小树”的产生过程，所以叫最小生成树。下面以一个实际问题为例讲解最小生成树的作用。


    问题描述：假设有4座城市，分别为A、B、C、D，在这4座城市之间铺设光缆，城市之间的光缆铺设费用分别为AB\=8、AC\=1、AD\=6、BC\=3、BD\=2、CD\=5，要求任意两个城市之间可以通信，求铺设光缆的最小花费。


    我们可以将城市作为节点，城市之间以边相连，将光缆铺设费用作为边长，构成无向图。求最小铺设费用等价于求这个无向图的最小生成树。最小生成树最常用的算法有普里姆算法（Prim''s
    Algorithm）和克鲁斯卡尔算法（Kruskal''s Algorithm）。


    1\. 普里姆算法


    普里姆算法可以从任意节点开始建树。该算法的基本思路如下：从原点开始，每次添加与当前最小生成树相连且不成环的最短边，直到添加所有节点为止。对于上面的光缆铺设例子，以A为最小生成树的原点，首先添加与之相连且不成环的最短边AC，然后按算法法则依次添加BC边、BD边，直到所有节点均已添加，算法结束，最小花费为6（1+3+2）。普里姆算法的时间复杂度为O(V2)，其推进步骤示意图如图3-19所示。


    ![](OEBPS/Images/084-1.jpg)


    图3-19　普里姆算法的推进步骤示意图


    2\. 克鲁斯卡尔算法


    类似于迪杰斯特拉算法和贝尔曼-福特算法之间的关系，如果普里姆算法的基本思路是以点扩展边，那么克鲁斯卡尔算法的基本思路是以边扩展点，具体如下：每次从待选边集中选出与当前森林不成环且最短的边加入森林，直到所有节点形成一棵树为止。该思路决定了克鲁斯卡尔算法只能从最短边开始构建最小生成树。对于光缆铺设例子，首先将AC边加入森林，然后按算法法则依次加入BD边、BC边，此时所有节点已构成一棵树，算法结束，最小花费同样为6（1+2+3）。这里需要用到排序，如果使用快速排序算法，那么克鲁斯卡尔算法的时间复杂度为O(ElogE)，其推进步骤示意图如图3-20所示。


    ![](OEBPS/Images/085-1.jpg)


    图3-20　克鲁斯卡尔算法的推进步骤示意图


    值得一提的是，稠密图（边数较多的图）适合使用普里姆算法，而稀疏图适合使用克鲁斯卡尔算法。


    #### 3.2.7　树状数组


    从本节开始的5个基础算法，其难度有所提升，建议读者选择阅读。


    树状数组（Binary Indexed Tree）是一种具有树结构的数组，其利用二进制的计算特性，可以在时间复杂度为O(logN)的情况下动态维护一个序列，并且计算其任意子序列中的所有元素之和，算法思路十分简洁、巧妙。下面从二进制的特性开始，逐步讲解树状数组的实现思路。


    有4个二进制数，分别为0011、0101、0110、0111，每次通过将原数的非零最低位加1来更新原数，可以得到4个变化过程，分别为0011→0100→1000→10000、0101→0110→1000→10000、0110→1000→10000、0111→1000→10000。观察这4个变化过程有没有发现什么规律？没错，这种运算总能将原数变为比它大的、最接近的2次幂。假设有8个位置，编号分别为1～8，将其组成一个树状数组，如图3-21所示，灰色代表原数组，黑色代表树状数组。


    ![](OEBPS/Images/086-1.jpg)


    图3-21　树状数组结构示例


    黑色单元从左至右的相连关系就是上面描述的“加1变换”（B1→B2→B4→B8，B3→B4→B8，B5→B6→B8，B7→B8）。有“加1变换”自然就有“减1变换”。“减1变换”能以O(logN)的时间复杂度找到任意元素的核心子元素，这样维护和计算任意子序列中所有元素的和就很方便了。例如，对于图3-21中的B7，通过“减1变换”得到序列（B7→B6→B4），正好可以计算A1～A7之和。


    举个直观例子。假设原数组为\[3,5,1,9,2,4,8,7\]，依次遍历原数组，并且通过“加1变换”将每一个元素值累加到树状数组的相应位置上，这一步的时间复杂度为O(NlogN)，相应的树状数组如图3-22所示。


    ![](OEBPS/Images/086-2.jpg)


    图3-22　树状数组求和


    在树状数组构建完成后，尝试计算前7个数之和。我们通过“减1变换”在树状数组中依次遍历到0111、0110、0100这3个位置，对应下标的元素值为8、6、18。因此前7个数之和为8+6+18=32。如果使用原数组，则需要进行6次加法运算；如果使用树状数组，则只需进行2次加法运算。随着数列长度的增加，树状数组的时间优势会更加明显。此外，当原数组中某个元素的值增加或减少d时，同样可以通过“加1变换”来更新树状数组中相应的元素值。


    无论是“加1变换”，还是“减1变换”，核心问题都是找到二进制的最低位，如何得到二进制的最低位呢？这就不得不提计算机最擅长的位运算了，最低位计算公式为


    lowbit(x)=x and (x xor (x\-1))


    利用补码特性，该计算公式可以简化成


    lowbit(x)=x and-x


    简化后的最低位计算公式是常数级的计算。树状数组查询和更新的时间复杂度为O(logN)。由于树状数组的构建要遍历整个原数组，因此时间复杂度为O(NlogN)。


    #### 3.2.8　线段树


    线段树（Segment Tree）的概念和它的名字一样，是以线段（通常是指数组的一个子数组，点可以看作线段的特殊形式）为节点构成的树。上一节讲的树状数组能高效率地计算任意子序列中的所有元素之和。但如果需要计算任意子序列中的最大值和最小值，树状数组显然是束手无策的，这时需要使用线段树。线段树可以解决包括树状数组解决的问题在内的所有子序列求解问题。相应地，线段树比树状数组复杂很多。下面通过一个具体例子讲解什么是线段树。


