    ## 6.5　算法竞赛介绍


    ### 6.5.1　Kaggle


    `Kaggle`是由联合创始人、首席执行官安东尼·高德布卢姆（`Anthony Goldbloom`）于 2010 年在墨尔本创立的，用于为数据科学家提供举办机器学习竞赛、托管数据库、编写和分享代码的平台。`Kaggle`主要以`Data
    Mining`竞赛为主，与注重模型和算法的`Machine Learning`不同，`Data Mining`侧重于从数据和问题本身出发，希望针对问题的特性来设计最适合的方案，对数据的“嗅觉”要求更高。当然，`Kaggle`金牌的含金量是很高的。


    ### 6.5.2　KDD Cup


    除了`Kaggle`，另一个含金量较高的竞赛莫过于有“数据挖掘世界杯”之名的`KDD Cup`了。`KDD Cup`是美国计算机协会（`Association
    for Computing Machinery`，`ACM`）![一个世界性的计算机从业员专业组织。](img/note.png)的数据挖掘及知识发现专委会（`SIGKDD`）组织的数据挖掘与知识发现竞赛，每年举办一次，是数据挖掘人才的顶级盛会。


