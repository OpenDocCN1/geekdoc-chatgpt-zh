    # 第 7 章 进阶学习


    相信前 6 章的内容帮助大家打好了一定的 AI 算法基础。随着硬件算力的提升，算法模型的创新与优化，以及对新需求和新场景的挖掘，出现了越来越多的新兴研究领域。本章会介绍机器学习算法世界中的三大进阶概念，即深度学习、强化学习和迁移学习。之所以选择这
    3 个方向，是因为笔者认为，这 3 个方向恰好能完整刻画出人类智能的闭环。


    深度学习，主要用于描述人类大脑数以百亿计神经细胞的活动状态（兴奋或抑制），神经元之间的深度连接形成了人类大脑思维与创造的能力。


    强化学习，主要用于描述人类适应外界环境、学习外界环境的过程，趋利避害、最大回报、延迟享受、对外界环境的极强交互学习能力，使人类成了站在地球食物链顶端的生物。


    迁移学习，主要用于描述人类知识迁移模仿和举一反三的能力，其中最有名的为仿生学，如模仿鲸鱼设计的潜水艇外形、根据蝙蝠的回声定位能力制造的雷达、受野猪启发发明的防毒面具等。


    ## 7.1 深度学习


    ### 7.1.1 起源


    顾名思义，深度学习（`Deep Learning`）就是深层次的学习。那么如何完成深度学习？不妨联想一下我们在第 4 章讲到的神经网络中的隐层，所谓 Deep，其实就是神经网络结构中的
    Deep，即多隐层的神经网络。因此，深度学习也可以简单理解为深度神经网络。


    既然有深度学习，就有浅层学习（`Shallow Learning`）。如线性回归和逻辑回归等神经网络模型，都可以划为浅层学习范畴。浅层学习起源于 20 世纪
    80 年代末期，随着反向传播（`Back Propagation`，`BP`）算法的发明，线性回归和逻辑回归等浅层神经网络模型在那个年代被相继提出，并且掀起了一股机器学习热潮。那个年代的人们就已经发现，利用`BP`算法使神经网络模型从大量的训练样本中学习的统计规律，可以用于预测未知事件的发生概率。这种基于统计规律的神经网络模型，又称为感知机（`Perceptron`）模型。在当时，与基于人工规则确定的系统相比，感知机模型在很多方面都展现出了优势。


    图灵奖得主、加拿大多伦多大学教授、机器学习领域的泰山北斗 Geoffrey Hinton 和他的学生在 2006 年的国际顶级期刊`Science`上发表了一篇关于深度学习的文章，由此掀起了深度学习在学术界和工业界的研究浪潮。自
    2006 年以来，深度学习在学术界持续升温，在图像识别、语音识别、自动驾驶等领域都取得了惊人的成果。其中，图像识别常用的模型是卷积神经网络模型，语音识别常用的模型是递归神经网络模型。


    当然，深度学习离不开大数据的支撑。为了理解这一点，下面通过一个语音识别的例子进行说明。语音识别是大数据背景下的一个机器学习算法建模问题，所使用的训练样本数量通常高达百亿到千亿级别。Google
    在一次语音识别实验中发现，训练后的`DNN`在训练集和测试集上的误差基本相同，这是非常违反常识的，因为训练集上的测试误差通常小于测试集上的误差。其实只有一个解释，那就是大数据蕴含丰富的信息维度，即使是`DNN`这样的复杂模型，也只处于欠拟合状态，更不必说浅层神经网络了。


    深度学习的本质是通过构建多隐层的神经网络模型，在海量的训练数据中学习更有用的特征，从而提升分类预测的准确性。所以，`DNN`只是一种手段，挖掘深度特征才是真正的目的。与浅层学习相比，深度学习有以下两点不同。


    - 深度学习强调模型结构的深度，通常在 5 层以上，甚至可以包含多于 10 层的隐层节点。

    - 强调特征学习的重要性，通过逐层非线性变换，转换样本的特征空间，从而使分类预测更加容易。


    由此可知，深度学习既可以直接用于完成分类和回归问题，又可以作为特征向量加入其他模型的训练过程中，后者被称为特征嵌入![详见第 5 章特征工程的相关介绍。](img/note.png)。


    ### 7.1.2 难点与方法


    看过《快乐大本营》综艺节目的读者应该知道有个多人游戏叫作“快乐传真”，我们不妨先回忆一下“快乐传真”的游戏描述。


    人数要求：5～8 人为宜，前后成一字形排列。


    游戏规则：第一个人面向主持人或出题人，其他人向后转，背对第一个人。第一个人看主持人或出题人给的题目，通常是方便用肢体展示的成语或俗语。在看完后，主持人收起题目，第一个人拍第二个人肩膀示意其转身，然后通过肢体语言（不能说话和摆口形），将刚刚看到的词语的含义表现出来。第二个人在会意之后，根据自己的理解同样通过肢体语言传递给第三个人，以此类推。在传到最后一个人时，这个人说出自己理解的词语。


    这个游戏的有趣之处在于中间的肢体传递过程，这个肢体传递过程类似于深度学习中层与层之间的信息传递过程。在肢体语言的传递过程中，如果前一个人的肢体表演不足，传递出来的信息量过少，就不会传递给后面的人足够的信息；如果前一个人的肢体表演过于夸张，可能传递出过多的信息，就容易使后一个人理解到多余的信息。总之，无论是哪种情况，都会使最后一个人无法准确地说出所传递的词语。如果将游戏中的每一个传递人都看作一层神经网络，他们既能输入信息，又能输出信息，那么可以将第一个传递人到最后一个传递人作为一个整体，这个整体可以看作一个深度神经网络。这个游戏中的两种问题恰好对应深度学习中的梯度消失![又称为梯度弥散。](img/note.png)和梯度爆炸两大难题。


    深度神经网络通过反向传播的梯度更新每一层的模型参数，这个梯度类似于《快乐传真》游戏中传递的词语，通过层层传递，如果信息量过少，就会出现梯度消失问题；如果信息量过多，就会出现梯度爆炸问题。那么，深度神经网络是如何应对这两大难题的呢？


    1. 梯度裁剪


    梯度裁剪（`Gradient Clipping`）又称为梯度剪切，顾名思义，就是减掉多余的部分，主要是针对梯度爆炸提出的方法。具体而言，就是设置一个梯度裁剪的最大阈值，在使用链式法则![详见
    2.3.1 节。](img/note.png)求导计算各层参数梯度时，如果梯度超过最大阈值，就将最大阈值作为当前梯度。


    2. 参数权重正则化


    应对梯度爆炸的另一种比较常见的方法是参数权重正则化。参数权重正则化主要有两种方法，一种叫作`L1`正则，另一种叫作`L2`正则，具体做法都是在损失函数中增加一项，作为损失函数的惩罚项。以均方差损失函数为例，加入`L1`正则的`Loss`函数。`Loss`函数表达式如下。


    ![](img/217-1.jpg)


    在上述表达式中，![](img/217-2.jpg)是范数符号，![](img/217-3.jpg)。直观理解就是在损失函数中加入各个参数权重的绝对值之和，从而达到抑制参数权重值过大的目的。


    加入`L2`正则的`Loss`函数。`Loss`函数表达式如下。


    ![](img/217-4.jpg)


    在上述表达式中，![](img/217-5.jpg)。`L2`正则的直观理解就是在损失函数中加入各个参数权重的平方之和，也能达到抑制参数权重值过大的目的。


    进一步理解，`L1`正则能够使特征权重变稀疏，即训练后出现较多值为 0 的参数权重，主要用于对特征进行筛选。`L2`正则无法达到类似的效果。我们以两个参数为例，在二维平面坐标系中，`x`轴和`y`轴分别代表这两个参数权重。其中`L1`正则贡献的损失值等高图像表现为菱形，`L2`正则贡献的损失值等高图像表现为圆形或椭圆形。可想而知，原损失函数的等高线与菱形相切的稳定位置必定在坐标轴上，即必有参数权重为
    0；而与圆形相切的位置，有可能稳定在坐标系第一象限的任意位置。所以`L1`正则能够提取稀疏特征，`L2`只能抑制梯度爆炸，防止模型过拟合。


    3. 选择合适的激活函数


    除了对梯度本身做文章，我们还可以在计算梯度之前，在神经网络每一层的激活函数上做文章。这个思想非常简单直观，如果激活函数的导数是一个常数，如 1，就不存在梯度消失和梯度爆炸的问题了。同时，每层神经网络的参数都能得到相同的更新速度。满足这个条件的激活函数为`ReLU`函数及其一系列的变种函数，此类函数的具体描述参考
    4.2.2 节。


    4. 批规范化


    梯度裁剪过于粗暴，而且很难确定最优的裁剪阈值，参数权重正则化只是间接缓解梯度问题，合适的激活函数也只能保证导数不会过大或过小。对于深度神经网络中的梯度问题，批规范化（`Batch
    Normalization`，`BN`）才是真正对症下药的方法。自深度学习发展以来，批规范化是深度神经网络模型训练最重要的成果之一，它不仅解决了反向传播过程中的梯度问题，还可以提高深度神经网络参数的收敛速度，从而提升训练稳定性。


    批规范化的具体操作方法如下：对于每一个`batch`的训练数据，以特征（神经元）![在深度神经网络中，每个神经元的输出值都可以看作当前网络层输出的一个维度的特征值。](img/note.png)为维度，通过标准化![一组数据的标准化是指每个数据减去原数据的平均值，然后除以标准差。](img/note.png)计算，将每层网络激活前的输出值分布转换成均值为
    0、方差为 1 的标准正态分布，然后使用激活函数将其输出。这样，每一层、每一个维度的特征输出值都符合标准的正态分布输出值，从而保证深度神经网络模型在反向传播训练中的稳定性。


    5. 加入残差网络


    对深度卷积神经网络的发展而言，残差网络（`ResNet`）可谓神来之笔。残差网络由当时在微软亚洲研究院的何凯明及其小组成员在论文中正式提出，在 2015 年`ImageNet`大赛中首次亮相，便摘得大赛的桂冠。此后，几乎所有的深度神经网络都离不开残差网络的身影，残差网络堪称深度神经网络的必备良药。因为加入了残差网络，可以非常轻松地构建上百层，甚至上千层的深度，而不用担心梯度消失的问题。残差网络的原理比较直观，与深度神经网络的结构相比，加入残差网络包含很多跨层连接的捷径（`shortcut`）。这样做的灵感来源是，如果增加一层网络结构无法使结果变得更好，那么至少别让结果变差。当反向传播的梯度在当前层发生梯度消失时，当前层的输出应该原封不动地包含上一层传递来的梯度，这种恒等映射（`Identity
    Mapping`）的方式可以保证当前层反向传播的梯度不会消失。


    ### 7.1.3 经典模型：AlexNet


    本节介绍深度学习的经典模型——`AlexNet`。选择`AlexNet`，不仅因为它在 2012 年的`ImageNet`大赛中以低于第二名 10.8 个百分点的误差摘冠，还因为其首次使用的`ReLU`函数和`Dropout`技术现在仍然是深度学习必备的实用方法。`AlexNet`由
    Geoffrey Hinton 和他的学生 Alex 在发表于`NIPS 2012`的论文中提出，其网络结构如图 7-1 所示。


    ![](img/219-1.jpg)


    图 7-1　`AlexNet`网络结构![引自论文 ImageNet Classification with Deep Convolutional Neural
    Networks。](img/note.png)


    第一层由卷积层、`ReLU`函数、`LRN`（Local Response Normalized）、最大池化层组成。在图 7-1 中，卷积层一共包含 96
    个 11×11 的卷积核，分为两部分，每部分有 48 个卷积层，表示由两片`GPU`分别计算。接收的输入图像为 224×224 的`RGB`三通道图像。可以将通道理解为代表一个像素点的数据维度。例如，`RGB`图像由红、绿、蓝三原色组成，其通道数就是
    3。步长为 4，卷积后输出 55×55 的图像，具体计算方式为(224-1)/4=55.75，第 56 步卷积的卷积核中心位置超出原图像区域，因此长度和宽度均为
    55。在卷积之后使用`ReLU`函数激活，再通过`LRN`为局部神经元创建活动竞争机制，使较大的激活值变得更大，并且抑制周围激活值较小的神经元，从而增强模型的泛化能力。最大池化的尺寸为
    3×3，步长为 2，因此第一层最终输出的图像大小为 27×27×96。


    第二层由卷积层、`ReLU`函数、`LRN`、最大池化层组成。在图 7-1 中，卷积层一共包含 256 个 5×5 的卷积核，分为两部分，每部分有 128
    个卷积核，表示由两片`GPU`分别计算。接收的输入图像为上一层输出的 27×27 的 96 通道图像。步长为 1，因此卷积不改变图像的形状、大小。在卷积之后使用`ReLU`函数激活，再通过`LRN`为局部神经元创建活动竞争机制。最大池化的尺寸为
    3×3，步长为 2，因此第二层输出的图像大小为 13×13×256。


    第三层和第四层均由卷积层和`ReLU`函数组成，没有`LRN`和最大池化层。这两层的卷积层均包含 384 个 3×3 的卷积核，步长均为 1，输出的图像大小均为
    13× 13×384。


    第五层由卷积层和最大池化层组成。其中卷积层包含 256 个 3×3 的卷积核，并且直接通过步长为 2 的最大池化层，输出的图像大小为 6×6×256。


    第六层和第七层均由全连接层、`ReLU`函数和`Dropout`组成，全连接神经元个数均为 4096。


    最后一层为`Softmax`层，包含 1000 个神经元，输出 1000 个分类概率，对应`ImageNet`比赛的总分类个数 1000。


    ## 7.2 强化学习


    ### 7.2.1 起源


    强化学习（`Reinforcement Learning`）又称为增强学习。强化学习的概念首次由 Minsky 于 1954 年提出，描述为通过奖惩手段进行学习的基本思路。1957
    年，Bellman 提出了求解最优控制问题的马尔可夫决策过程（`Markov Decision Process`，`MDP`）的动态规划方法，使`MDP`成为定义强化学习问题的最普遍形式。1989
    年，Watkins 提出的`Q Learning`进一步推动了强化学习的应用，给`DQN`（`Deep Q Network`）的出现奠定了基础。之后的二十余年，监督学习大放异彩，强化学习就此沉寂。


    直到 2013 年，`DeepMind`公司发表了一篇利用强化学习玩 Atari 游戏的论文，由此开启了强化学习新纪元。2015 年 10 月，由`DeepMind`公司开发的`AlphaGo`击败了人类专业棋手樊麾，成为第一个无须让子即可在
    19 路棋盘上击败围棋职业棋手的围棋 AI 程序，描述`AlphaGo`的论文被发表在当年的国际顶级期刊`Science`上。时间来到 2016 年 3 月，通过自我对弈强化后的`AlphaGo`约战顶尖职业棋手李世石，最终以
    4∶1 的比分将李世石击败。


    同年 12 月，`AlphaGo`的 Master 版本开始出现于弈城围棋网和腾讯野狐围棋网，以 60 连胜的战绩轰动围棋界。在这之后，`DeepMind`
    如约在期刊`Nature`上公布了最新版`AlphaGo`论文。随后更新`AlphaGo`到最强、最新的版本`AlphaGo Zero`，该版本使用纯强化学习，只训练了
    3 天，就以 100∶0 的比分击败了上一版本的`AlphaGo`。这些都证明了深度强化学习的发展潜力。


    所谓深度强化学习，就是深度学习与强化学习的结合。这里我们需要记住一个人，就是 AlphoGo 项目的带头人，强化学习界的泰山北斗——David Sliver。感兴趣的读者可以观看
    David Sliver 关于强化学习的视频课程。


    ### 7.2.2 流派与分类


    强化学习分为`Value-based`和`Policy-based`两大流派。前面提到的`DeepMind`公司就是`Value-based`流派的代表，另一个在强化学习领域同样造诣颇深的人工智能非营利组织`OpenAI`则是`Policy-based`流派的代表。与`DeepMind`着眼于游戏仿真
    AI 的研究不同，`OpenAI`着眼于机器人仿真研究。两个流派之间的区别如下：`Value-based`的算法主要用于学习关于动作的价值函数，然后通过折算相应的概率，形成最终的行动策略，如经典算法`DQN`；`Policy-based`的算法主要用于学习动作的概率，无须先学习一个价值函数，如经典算法`PG`（`Policy
    Gradient`）。


    强化学习的算法分为`Model-free`和`Model-based`两大类。在讲解这两类算法的区别前，先讲解强化学习的基础。和监督学习、无监督学习一样，强化学习也是机器学习的一个研究分支。不过，和监督学习、无监督学习相比，强化学习不一定需要大量的训练数据，它可以通过不断地试错来学习最大化的长期收益，更像是一种从零开始通过“左右互搏”的方式提高模型能力的学习方法。强化学习主要有以下
    4 个特点。


    - 没有标签数据，只有奖励信号。

    - 奖励信号不一定实时反馈。

    - 时间序列是一个重要因素。

    - 当前行为影响后续行为。


    强化学习中的角色有两种，分别为个体（`Agent`）和环境（`Environment`）。个体通过观察环境得到观察结果（`Observations`），并且根据观察结果做出相应的行为动作（`Actions`），然后从环境得到奖励信号（`Rewards`），环境也因此发生了变化。个体与环境之间如此周而复始地持续交互，就形成了强化学习的过程。


    训练小狗的过程如图 7-2 所示。在这个过程中，小狗就是个体，小狗的主人就是环境，小狗观察主人的行为并做出相应的动作，然后根据动作结果从主人那里获得相应的奖励。这个过程可以看作一个强化学习的训练过程。


    ![](img/223-1.jpg)


    图 7-2　训练小狗的过程


    有了对强化学习的基本认识，下面介绍`Model-free`算法和`Model-based`算法的区别。首先，这两个名字中的“Model”指的是对环境建模，而不是对个体建模。顾名思义，`Model-free`的意思是不对环境建模，`Model-based`是对环境建模。对于`Model-based`，如果对环境信息一清二楚，并且事先掌握环境给的反馈，那么可以直接通过一些规划算法来找到最优策略，如动态规划和贪婪算法。但是在大部分情况下，环境的表现和规律是十分复杂、令人捉摸不透的，对其进行精准建模是一件非常困难的事情。对于`Model-free`，我们通过对个体建模，学习动作到奖励的映射模型，也有可能学到最优的策略。


