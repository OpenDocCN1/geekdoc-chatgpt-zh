    # 第 5 章 算法工程的组成部分

    在武侠小说中，无论是内力、招式，还是武功秘籍，如果不组成一套完整的实战打法与人比武切磋，则终究比不出孰优孰劣、孰高孰低。同样地，对于前面讲解的算法之内力、算法之招式和算法之武功秘籍，如果不进行有效的串联与整合，而是生搬硬套，那么不仅在实际运用过程中会困难重重，而且取得的最终效果也会大打折扣。在算法世界中，将这三者融合在一起并运用的完整流程就是本章要讲的核心内容──算法工程。

    本章会从原始数据的预处理开始，到算法模型验收为止，逐步讲解算法工程的完整流程。这个流程主要包括 5 部分，分别为数据分析、特征工程、建模与调参、效果评估和模型托管。


    ## 5.1 数据分析

    在《三国演义》中，诸葛亮在调兵遣将时经常说：关羽听令，给你三千精兵，从左路包抄曹军；张飞听令，给你五千精兵，从右路包抄曹军。由此可知，诸葛亮在用兵打仗之前，必然已经掌握了己方有多少将领、精兵、残兵、粮草、战场地势等情报。再如成语“量体裁衣”，是说按照身材尺寸裁剪出合适的衣服，用于比喻做事要从实际出发，因地制宜。算法工程也是同样的道理。在算法工程中，能做到知己知彼、“量体裁衣”的关键步骤，非数据分析莫属。

    无论是数据挖掘、机器学习相关的算法比赛，还是工业界的推荐、排序等场景中的算法应用，如果没有足够的数据分析结论作为支撑，那么能够取得的结果通常都不甚理想。为什么数据分析对机器学习算法结果的影响如此之深？有哪些实用的数据分析方法，这些方法在算法工程中又是如何起作用的呢？


    ### 5.1.1 宏观把握数据

    拿到数据，切勿着急生搬硬套模型，先统计各类指标或特征的数量，把握数据大局。这个数量包括但不限于样本数据集的总数量、不同类别样本的数量、各类特征或指标的数量、缺失值的数量及特征值的分布等。宏观把握数据是数据分析的基础，也是容易被忽视的一点，它能帮助我们避免一些基本问题。例如，在后续工作开展之前，先搞清楚所定算法目标是否合理，可以帮助我们少走弯路、不走死路，从而提高算法工程的实施效率。

    举个例子，在不考虑分布式训练的情况下，如果需要知道算法模型从训练任务启动到完成需要花费多长时间，则可以用训练样本的总数量除以`batch size`![每一批次同时输入算法模型中训练的样本量。](img/note.png)，再乘每批次训练花费的时间，就能估算出一个`epoch`![模型训练的迭代单位，通常一个
    epoch 表示遍历一遍数据集中的所有样本。](img/note.png)花费的总时间，最后乘 epoch 的数量，即可得出算法模型的总体训练时间。如果在训练之前没有统计样本的总数量，那么模型训练何时结束，就只能对着屏幕默默等待了。

    一份拥有 512 条数据、特征维度为 1000 的数据集，假设`batch size`为 128，一个`epoch`包含 4 个`batch`，`epoch`和`batch`之间的关系如图
    5-1 所示。

    ![](img/153-1.jpg)

    图 5-1　epoch 和 batch 之间的关系

    除此之外，如果发现验证集或测试集中正、负例样本的一方过少，如只有 1 个正例样本的极端情况，则可以提前终止无意义的训练过程，因为针对极端比例下的类别样本数据集，无论是模型训练，还是模型评估，都会完全失效。事先统计各类别样本的数量，能提前发现样本不均衡的问题，尤其在类别样本比例差别较大时，一方面能帮助划分训练集、验证集和测试集的大小，另一方面可以对样本进行重采样或降低采样比例。样本不均衡问题会在
    5.2.3 节的特征工程技巧中进一步讲解。

    在一个动物分类数据集中，针对不同动物类别的数量统计结果如图 5-2 所示。

    ![](img/154-1.jpg)

    图 5-2　动物分类数据集中不同动物类别的数量统计结果

    对于数据字段的缺失问题（为空值或非法值），事先统计有助于掌握特征字段、标签字段等关键字段的缺失程度。如果缺失字段占比较低（通常 1%以下可以忽略不计），那么可以直接丢弃；如果缺失字段占比较高，那么可能是源头数据出问题了，可以检查源头数据的收集过程是否存在问题，避免在训练过程中再出现问题，从而提高算法工程的整体效率。

    总之，在动手开始搭建算法模型前，对样本数据集先有一个宏观把控，可以帮助我们对算法目标有一个更清晰、具体的认识，从而做到少走弯路、有的放矢。


    ### 5.1.2 微观感受数据

    作为一门复杂学问，在机器学习算法工程中，无论采用什么模型，都不可能得到百分之百精确的结果。训练再好的回归模型，也不可能将预测值与真实值之间的预测误差降为 0；即使分类效果再好的分类模型，也不可能保证每次的分类结果一定是正确的。在机器学习算法工程中，我们的工作是尽可能地逼近目标和真相。除了继续调参![在算法模型训练过程中，尝试选择不同的模型参数，从而达到最优预测结果，详见
    5.3.2 节。](img/note.png)优化模型，在数据层面，一方面，可以通过宏观把握数据提前发现问题；另一方面，可以微观感受数据，抽样观察单个样本数据的行为表现并思考其合理性，对算法工程的开展也大有帮助。例如，在包含用户行为序列的场景中，抽样观察具体的用户行为序列，设身处地地理解和感受用户行为特征，对用户行为序列的建模大有裨益。

    以电商场景为例，要真正理解用户数据，就必须对用户数据进行充分的观察。总体而言，抽样观察用户数据的方式主要有以下两种。

    第一，抽样观察用户个体维度的行为数据，换位思考，设身处地观察具体的用户行为序列，可以帮助我们更好地理解业务。行为数据是指用户在时间维度上的连续动作，如页面曝光、键盘输入、页面点击、鼠标滑动、触屏等行为。图
    5-3 所示为一段完整的用户网上购物行为序列。笔者自从事电商行业相关算法工作以来，多次发现靠直觉得来的关于用户行为的观点，与用户的实际行为表现并不相符。例如，直觉上认为用户应该先单击商品
    A，然后单击商品 B，由于运营规则、前端规则或用户偏见等原因，用户的实际行为表现可能会恰恰相反。

    ![](img/156-1.jpg)

    图 5-3　用户网上购物行为序列示例

    第二，抽样观察用户个体维度的统计指标，可以帮助我们更好地进行业务建模。并不是所有业务场景都适合使用复杂模型，有时基于规则的方法在某些业务场景中更容易出效果。笔者曾经跟进过一个保险返利![在体验指定保险产品后返还红包或实物奖品。](img/note.png)项目，项目目标是挖掘参与保险购买活动的作弊用户，从而减少因不正当手段获取返利带来的损失，净化拉新![营销活动用词，是指拉动与发展新用户。](img/note.png)指标。在项目前期，我们直接使用人工标记的作弊订单作为样本标签，基于逻辑回归训练了一个作弊分类器。但是，该作弊分类器在真实数据集上的分类效果很差。后来，我们根据对保险业务的重新理解，统计相关总体指标，提炼出几条满足非正常用户的规则，并且通过规则筛选出了一批作弊订单，然后在验证阶段通过电话逐一回访，发现大部分用户填写的手机号是无法拨通的空号，因此确认这些订单均为作弊订单。在这个反作弊场景中，基于规则的算法不仅简单易实现，作弊订单命中率非常高，而且具备极强的模型可解释性，只需根据当前作弊订单所命中的作弊规则，给出相应的规则描述。这便是微观感受数据带来的价值。


    ### 5.1.3 分析方法

    无论是从宏观角度分析数据，还是从微观角度分析数据，都可以统一归为两个步骤：计数和展示。

    1. 计数

    所谓计数，就是围绕特定维度，通过特定方法计算得到统计量。统计量可以是绝对值类型，如人数、金额；也可以是相对值类型，如占比、点击率、转化率。

    举例一，样本数量。维度可以是样本总体，也可以是不同的样本标签。基于这些维度可以统计得到样本总数量、不同样本标签下的总数量，如电商购物场景中每天的订单总量、销量排名前十的商品、不同种类下的订单总量、不同种类销量排名前十的商品等。

    举例二，特征分布。维度是特征。如果是离散型特征，那么直接统计不同特征值出现的次数；如果是连续型特征，那么先进行等频或等宽![特征工程中将连续型特征转换成离散型特征的方法，详见
    5.2 节。](img/note.png)的特征离散化处理，再统计每个特征区间出现的次数。例如，在电商购物场景中，将年龄特征作为统计维度，可以得到不同年龄段的顾客数量和订单数量；将历史消费额度特征作为统计维度，可以得到不同消费层次的顾客数量和订单数量。

    举例三，用户行为。维度是标识用户的唯一编号。根据用户的唯一编号，可以关联该用户在某个时间段内的所有行为数据，然后按照时间的发展顺序排列，从而完整复现该用户在平台上产生的一连串动作序列。例如，在电商购物场景中，使用用户的账户编号追溯一次完整的用户购物过程，包括页面展现、页面点击、商品购买/加购、付款等行为。

    举例四，商品访问量。维度是标识商品的唯一编号。根据商品的唯一编号，可以统计该商品在不同时间段内的访问量，对用户编号进行去重统计，还可以得到该商品在不同时间段内的访客数。

    2. 展示

    所谓展示，就是将统计结果直观地呈现出来。常见的展示方式有 3 种，分别为表格、图形和文本。

    1）表格。

    当需要展示多维度数据时，可以采用表格这种既常见又实用的统计结果展示方式。表格不仅可以呈现丰富的数据，还可以在数据之间进一步对比，对于关键值和重要指标，可以通过加粗或改变颜色的方式突出显示。

    2）图形。

    图形是最直观的统计结果展示方式。常用的图形有折线图、散点图、柱形图和饼图。其中折线图主要用于看趋势，散点图主要用于看分布，柱形图主要用于看高低，饼图主要用于看占比。

    3）文本。

    并不是所有的统计结果都适合使用表格或图形进行展示。例如，当统计结果只有一两个指标时，可以对其进行总结性的观点描述。虽然文本呈现的内容不如表格多，呈现效果不如图形直观，但它可以直接传达数据背后的意义。


    ## 5.2 特征工程

    数据和特征决定了机器学习的性能上限，而机器学习算法只是在逼近这个上限。在具体问题中，数据样本空间通常是固定不变的，因此特征的质量尤为关键。提高特征质量的关键，就是特征工程（Feature
    Engineering）。特征工程的本质是一种工程，所有关于特征数据的处理和加工，都属于特征工程的范畴。一方面，大部分机器学习算法对非结构化特征数据束手无策，因此必须通过数据预处理将某些原始数据格式转换成模型可接受的读取格式；另一方面，机器学习算法虽然具备一定的数据抽象学习能力，但是特征可能有千万种，如何从中选择特征、融合特征，甚至创造特征，从而提高算法模型的学习效率和质量，就显得尤为重要。特征工程主要解决的就是这两方面的问题，其作用是给模型算法铺路，将晦涩、粗糙的特征转换成对模型友好的特征。


    ### 5.2.1 数据预处理

    在提取特征之前，需要对所用数据进行预处理，确保数据的可用性。数据预处理通常会检查缺失值和错误值。在缺失比例和错误比例可接受范围内，可以通过取平均值、中位数或众数的方式填补缺失值，也可以直接将包含错误值的数据样本行或列删除。如果缺失比例或错误比例过高，就需要考虑数据源本身是否存在问题了。


    ### 5.2.2 特征分类

    总体而言，特征分为离散型（无序）特征和连续型（有序）特征两大类。离散型特征为文本类型的特征，如姓名、性别、邮编、城市、文档，离散型特征之间不存在顺序和大小关系。连续型特征通常为数值类型的特征，如年龄、时间戳、价格、销量，连续型特征之间存在顺序或大小关系。


    ### 5.2.3 工程技巧

    1. 缺失值处理

    是否丢弃包含缺失值的样本集的计算结果对比如表 5-1 所示。其中，左边为包含缺失值的样本集及丢弃包含缺失值的样本后的样本集的计算结果，右边为没有缺失值的样本集及相应的计算结果。

    表 5-1　是否丢弃包含缺失值的样本集的计算结果对比

    ![](img/160-1.jpg)

    根据表 5-1 可知，在丢弃包含缺失值的样本后，女生中喜欢打篮球的比例发生了很大变化（从 75%变为 50%），因此不要轻易丢弃包含缺失值的样本。对于离散型特征缺失值，最简单的处理方法为填入空字符串；对于连续性特征缺失值，最简单的处理方法为补
    0。

    关于缺失值的具体处理标准，对训练集而言，如果包含缺失值的训练样本太多，如超过一半，则说明收集的数据整体有问题，必须重新收集数据；如果包含缺失值的样本比例不高，则可以根据业务知识考虑是删除该样本，还是删除整个特征列。对测试集和验证集而言，如果是连续型特征，则可以使用训练集中该特征的平均值或中位数填补缺失值；如果是离散型特征，则可以使用训练集中该特征的众数（出现频率最高的特征值）填补缺失值。

    2. 特征变换

    常用的特征变换方法有三种：连续型特征离散化、特征编码和特征缩放。

    1）连续型特征离散化。

    最常用的方法为分箱（`Binning`）（又称为分桶），分箱是处理连续型特征的一种方法。连续型特征的取值个数是无限的，而值与值之间轻微的变化对预测目标的影响较低，分箱可以基于这种轻微变化的规律，将线性特征转换成非线性特征，从而提升特征的表达能力。分箱的方式有三种。第一种为等频分箱，在特征的取值范围内，按照特征值从小到大的顺序排列样本，同时将样本按照数量均分成
    N 份，每份作为一箱，同一个箱子中的特征值相同（通常用 0 和 1 表示）。例如，将样本按照某特征从小到大的顺序排列，然后按照每桶样本数量相等的方式将其分成
    4 箱，如图 5-4 所示。第二种为等宽分箱，在特征的取值范围内，将特征值按照从小到大的顺序排列，并且将其均匀划分成 N 份，落在同一份中的样本属于同一箱，同一箱特征向量的结果相同，示例如图
    5-5 所示。第三种为聚类分箱，和前两种按照频数或取值等分的方式不同，这种方式通过聚类算法将相似样本特征值聚在一起作为分桶特征。与人为指定分桶方式的等频分箱和等宽分箱相比，聚类分箱更灵活、合理。

    ![](img/161-1.jpg)

    图 5-4　等频分箱示例

    ![](img/162-1.jpg)

    图 5-5　等宽分箱示例

    离散化之后的特征对于异常数据具有较强的健壮性，模型会更稳定。此外，离散化操作相当于引入了非线性特征，提升了特征的表达能力。不仅如此，离散化后的特征也比较方便和其他离散型特征进行后续的特征交叉等处理。

    2）特征编码（`Feature Encoding`）。

    当拿到的原始特征数据是文本类型的数据时，一般需要通过特征编码的方式将其转换成模型可识别的数值型数据。常用的特征编码方式有三种。第一种是手动建立映射字典，根据业务知识和目标任务，为离散型特征建立数字索引，用于进行映射。第二种是`label
    encoding`，这种方法仅适用于有序特征，对于一个有 m 个类别特征的样本数据集，在经过`label encoding`处理后，每个类别都会映射到 0～m\-1
    的整数上。第三种是独热编码，即`One-hot`编码，这种方法很常见，一个类别特征的取值一共有 m 种，在经过独热编码处理后，该类别特征会变为长度为 m 的
    0-1 向量，并且只有特征值对应的位置为 1。值得一提的是，前面讲到的分箱其实也是独热编码的一种实现方式。


    '
  toc: []
- raw: '独热编码的具体做法是将离散型特征所有可能的取值按照一定的顺序排列，同时生成一个维度相同且值全为0的向量；然后将对应样本离散型特征所处的位置设置为1。例如，编码图5-2中的动物类别离散型特征，编码结果如表5-2所示。


    表5-2　独热编码示例


    ![](OEBPS/Images/162-2.jpg)


    3）特征缩放（Feature Scaling）。


    顾名思义，特征缩放就是将原先取值范围较大的特征，按照某种规则转换成取值范围较小的特征。在机器学习算法应用中，有时原始特征的取值范围很大，如果不预先采取特征缩放操作，压缩特征的取值范围，那么模型算法会无法正常运行，甚至会由于特征空间过大而无法加载到内存空间中。一方面，如果特征之间的量纲差别很大，那么特征之间的距离计算会失去意义；另一方面，特征的取值范围较大可能导致一些优化算法（如梯度下降）的收敛变得迟缓甚至失效。


    特征缩放有三种常用方法，第一种叫作对数变换（Log Transformation）。对数变换将取值范围很大的特征转换到范围较小的区间内，对特征分布的形状有很大影响，可以降低特征值的震荡影响，弱化特征噪声，使特征分布更加匀称。如图5-6所示，在销量预测中，由于销量值波动很大，因此取自然对数可以弱化剧烈波动带来的影响。当然，由于是取对数，因此对零值或负值需要特殊处理，如统一设置为0。


    ![](OEBPS/Images/163-1.jpg)


    图5-6　对数变换的作用


    特征缩放的第二种方法叫作归一化（Normalization），具体计算方法如下：首先计算得到当前特征的最大值和最小值，然后将原始特征值先减去最小值，再除以最大值与最小值之差，最后将特征值统一映射到\[0,
    1\]区间。


    特征缩放的第三种方法叫作标准化（Standardization），具体计算方法如下：首先计算得到当前特征的平均值和标准差，然后将原始特征值先减去平均值，再除以方差，最后将特征值统一映射到标准正态分布![平均值为0、标准差为1的正态分布，记为N(0,
    1)。](OEBPS/Images/note.png)中。


    特征缩放主要有两个作用，第一个是使梯度下降的过程不容易发生震荡，能更快收敛，如图5-7所示；第二个是在一些设计距离度量的模型算法中，起到统一量纲的作用。


    ![](OEBPS/Images/164-1.jpg)


    图5-7　不同量纲下梯度下降的对比


    3\. 特征嵌入


    特征嵌入（Feature Embedding）是使用神经网络模型将输入的原始特征转换成指定维度特征向量的一种方法。严格意义而言，特征嵌入也是特征变换的一种，但与基于特征数据层面的简单转换相比，特征嵌入需要通过一个神经网络模型的训练过程来实现。此外，特征嵌入更加变化多端，基于不同的神经网络模型可以得到不同的特征嵌入向量。对于在距离度量下原本相近的样本，特征嵌入能使它们在新的特征空间中保持原本相近的距离。例如，自然语言处理中的词嵌入（Word
    Embedding）就是将单字或单词映射成较高维度的特征向量，而原本具有语义相似性的单词（如“漂亮”和“美丽”、“英俊”和“帅气”、“中国人”和“炎黄子孙”等），在映射之后的嵌入向量之间仍然保持比较接近的距离。


    4\. 特征交叉


    特征交叉（Feature Overlap）是一种融合多个特征的方法。可以使用独热编码对同时出现的离散型特征进行编码，也可以通过某个公式将多个连续型特征转换为新的抽象特征。例如，对于性别和兴趣这两个离散型特征，其中性别有男、女共两种，兴趣有篮球、游泳、摄影、旅游共四种，使用独热编码对二者同时出现的特征进行编码，结果如表5-3所示。


    表5-3　特征交叉编码示例


    ![](OEBPS/Images/165-1.jpg)


    5\. 特征选择


    特征选择（Feature Selection）是在数据预处理完成后，筛选真正有价值的特征的过程。过滤法是一种常见的特征选择方法。过滤法分为两种，一种是方差筛选法，通过设置方差阈值，过滤掉方差较小的特征；另一种是利用目标相关性判断，即计算特征与标签之间的相关性，主要有以下四种特征相关性的计算方法。


    • 皮尔逊相关系数法：输出范围为(-1, 1)，0表示无相关性，负值表示负相关，正值表示正相关。局限是所计算的特征和标签都要求是数值型的，并且只能检测出线性关系。


    • 卡方检验法：本质是推测两组数据之间的差异，使用0.01或0.05作为显著性水平阈值，如果返回的p值小于显著性水平阈值，则相关；如果返回的p值大于显著性水平阈值，则不相关。卡方检验法只能检验离散型特征。


    • F检验法：是用于捕捉每个特征与标签之间线性关系的计算方法，既可以检验离散型特征，又可以检验连续型特征。返回的p值用法与卡方检验法中返回的p值用法一致。


    • 互信息法：是用于捕捉每个特征与标签之间任意关系（包括线性关系和非线性关系）的计算方法。互信息法可以返回每个特征与目标之间互信息量的估算值，这个估算值的取值范围为\[0,1\]，如果估算值为0，则表示两个变量独立；如果估算值为1，则表示两个变量完全相关。互信息法比F检验法更强大，F检验法只能检测出线性关系，而互信息法可以检测出任意关系。


    除了过滤法，还可以使用模型法得到各个特征的重要性权重，常用的算法模型有GBDT模型和XGBoost![由陈天奇等人提出，是一种基于决策树的集成机器学习算法，使用梯度上升框架，适用于分类和回归问题。](OEBPS/Images/note.png)模型。


    6\. 样本不均衡


    样本不均衡（Sample Unbalanced）是指在带类别标签的分类样本中，不同类别中的样本数量存在差别。例如，二分类问题中正、负例样本比例过大或过小，多分类问题中存在的长尾类别![长尾类别中的样本数量相对于其他类别中的样本数量少很多。](OEBPS/Images/note.png)，等等。样本不均衡的问题十分常见，一方面可能在样本数据的收集过程中就出现了问题，如少采集了某些类别的样本；另一方面，由于业务的天然特点，本身就采集不到比较均衡的样本数据，如欺诈检测、癌症检测等场景。样本不均衡问题有可能将模型的优化方向带偏，直接表现为使模型倾向于关注样本数量更多的类别，使效果适得其反。


    并不是所有的样本不均衡问题都必须处理。


    第一种情况：类别本身的样本绝对数量足够大，只是相对于其他类别较少。由于较少类别的样本量也比较充足，模型对该类别也能完成足够充分的学习，因此不需要将其视为样本不均衡的问题来处理。例如，在电商场景中，虽然商品的点击量远小于其曝光量，订单转化量也远小于其点击量，但是商品的点击量和订单转化量的绝对值足够大，所以不需要处理样本不均衡问题。


    第二种情况：类别样本的比例差别不大，如二分类正、负例样本比例不小于1∶4。在保证样本量充足的情况下，在进行模型评估时，可以使用适合类别不均衡的评价指标（如AUC、F1值等）来评估。


    具体来说，处理样本不均衡问题的常见方法有以下4种。


    • 收集更多的样本。这种方法比较直观，通过整体扩充样本，使较小数量的类别也能拥有足够的样本数量。


    • 数据增强。根据现有样本，通过数据变换扩充同类别的样本，这种方法在图像识别领域应用广泛，如将图片进行平移、裁剪、旋转、镜像等。


    • 策略采样方法。对数量较少的样本进行过采样（又称为重采样）操作，即将其随机复制多份；对较多数量的样本进行欠采样操作。


    • 基于模型的方法，如基于K-近邻算法的SMOTE（Synthetic Minority Oversampling Technique，合成少数类过采样）算法。


    ### 5.3　建模与调参


    在完成数据分析和特征工程后，下面对算法进行建模与调参。如果将算法工程比作下厨，那么数据分析和特征工程相当于准备原材料（柴、米、油、盐、菜等），建模相当于盛原材料的容器（锅、碗、瓢、盆等），调参相当于对厨艺的锻炼。


    #### 5.3.1　建模


    函数是数学中的一个基础概念，其核心是输入数据、输出计算值。建模是指构建一个以样本特征为输入，以针对该样本的特定预测结果为输出的函数。例如，分类模型输出待预测样本的预测类别，而回归模型输出待预测样本的预测值。


    本书第4章已经讲解了多种常用的算法，可以直接用于对函数进行建模。需要强调的是，建模不一定要套用现成的算法模型，现成的算法模型也不一定能取得比较好的效果。可以根据充分的数据分析结果，因地制宜地进行建模。


    此外，建模是一个不断迭代更新的过程。没有一成不变的数据，更没有一成不变的模型。一个合理的建模过程是由简到繁、增量迭代的。这种建模过程在实际业务中非常高效，一方面，可以快速取得前期的业务效果；另一方面，可以基于现有模型的效果，有针对性地调参或优化模型结构。


    #### 5.3.2　调参


    调参的技术含量并不高，但在算法工程中却不可或缺。通俗地讲，调参就是人工调整机器学习算法模型的各项超参数![超参数是指算法模型在开始训练之前预先设置的参数，而不是通过训练得到的参数。](OEBPS/Images/note.png)，从而达到提升模型效果的目的。不同机器学习算法模型的超参数不同。例如，随机森林的超参数有学习率、子模型数、采样率、最大深度、分裂最大特征数、叶节点最小样本数等；神经网络的超参数有学习率、网络层数、神经元个数等。


    在超参数较少的情况下，可以采用网格搜索（Grid Search）方法寻找最优超参数。所谓网格搜索，就是针对算法模型可调节的各项超参数，枚举超参数所有可能的取值组合，逐一尝试，然后选择模型效果最好的一组作为最终模型的超参数。当然，我们还可以使用自动调参工具（如Amazon开发的SageMaker
    Autopilot、Google开发的AutoML![是一个能够制造子AI的AI系统。](OEBPS/Images/note.png)、AutoML的开源替代产品Auto-Keras等）帮助模型自动选择最优的超参数组合。


    ### 5.4　效果评估


    前面的调参过程需要模型反复进行训练，从而得到不同的效果评估结果，用于指导模型超参数的优化方向。而效果评估符合预期的前提有两点，第一点是需要合理划分评估的数据集，第二点是选择合适的评估指标。


    #### 5.4.1　数据集划分


    数据集划分的通常做法如下：首先将数据集随机打乱（shuffle），目的是使数据在切分时保持各部分同质![每个特征在划分的不同集合中对应的特征分布均一致。](OEBPS/Images/note.png)。然后将数据集按照一定的比例分别划分为训练集、验证集和测试集。其中，训练集占据大部分数据，主要用于训练模型；验证集主要用于验证训练过程中每一轮结束后的模型效果，在训练过程中会被反复使用，可以设置不同的验证频率；测试集最后使用，主要用于测试模型的最终泛化能力，只使用一次，如果特征涉及时间维度，则建议单独划分最新一段时间的样本作为测试集，从而更准确地测试模型的泛化能力。训练集、验证集和测试集之间没有标准的划分比例，一般将划分比例设置为4∶1∶1即可。在一般情况下，验证集不宜过大，因为在每轮迭代结束后都会验证一次模型效果，如果验证集过大，则会延长训练所需的总体时间。同样地，验证集和训练集也不宜过小，尤其在正例样本占比较小时，样本量过小会导致验证和测试的结果波动过大而不可信。


    除了上述常规的数据集划分方法，还有一种比较流行的方法——K折交叉验证。这种方法的基本思路如下：首先将随机打乱顺序后的数据集划分成大小两份，一份作为训练集，一份作为测试集；然后将训练集等分成K份数据集，每次训练只使用其中的K\-1份数据集，将剩下的1份数据集作为验证集，用于进行效果评估。K折交叉验证在K-近邻算法![K-近邻算法是一种分类算法，将样本附近K个最近的点中数量最多的类别作为该样本的类别。](OEBPS/Images/note.png)中效果显著。图5-8所示为5折交叉验证的数据集划分形式。


    ![](OEBPS/Images/170-1.jpg)


    图5-8　5折交叉验证的数据集划分形式


    #### 5.4.2　评估指标


    评估指标可以直观反映模型分类或回归效果的优劣。常用的分类模型评估指标有精确率、准确率、召回率、F1值、AUC和K-S。常用的回归模型评估指标有MSE、RMSE、MAE和MAPE。


    在介绍分类模型评估指标前，先介绍四个至关重要的概念。


    • 真阳性（True Positive，TP）：判定为正例样本，并且是真正例样本。


    • 伪阳性（False Positive，FP）：判定为正例样本，但不是真正例样本。


    • 真阴性（True Negative，TN）：判定为负例样本，并且是真负例样本。


    • 伪阴性（False Negative，FN）：判定为负例样本，但不是真负例样本。


    四个概念的表格示例如表5-4所示。


    表5-4　四个概念的表格示例


    ![](OEBPS/Images/171-1.jpg)


    分类模型的评估指标就是围绕上述四个概念产生的。


    • 精确率（Precision）：主要用于预测正例样本中有多少是真正的正例样本，是针对预测结果而言的，因此精确率又称为查准率，计算公式如下。


    ![](OEBPS/Images/171-2.jpg)


    • 准确率（Accurary）：主要用于预测样本中预测正确的比例，计算公式如下。


    ![](OEBPS/Images/171-3.jpg)


    • 召回率（Recall）：主要用于预测样本中的正例样本有多少预测正确，计算公式如下。


    ![](OEBPS/Images/171-4.jpg)


    • F1值（F1 Score）：在准确率和召回率都要求较高的情况下使用，计算公式如下。


    ![](OEBPS/Images/172-1.jpg)


    在用上述四个指标评估模型之前，需要先根据模型的预测值将预测样本划分为正例样本和负例样本。由于二值化过程模糊了模型的原始打分能力，因此这些评估指标无法衡量模型输出的排序性能，即样本在打分后的顺序。一个比较好的二分类效果，应该是两种类别的样本打分值尽可能地向两边分开的。


    AUC（Area Under the Curve）计算的是ROC![ROC（Receiver Operating Characteristic Curve，受试者操作特征曲线）是由二战中的电子工程师和雷达工程师发明的，主要用于侦测战场上敌军载具（飞机、船舰）的指标，属于信号检测理论中的概念。](OEBPS/Images/note.png)下方的面积，是判断二分类预测模型优劣的标准。AUC可以直接评估模型打分的排序效果，并且可以很好地量化描述分类模型整体性能的高低。因此，AUC在分类模型中应用广泛，但也是比较难理解的一种评估指标。


    K-S（Kolmogorov-Smirnov）可以通过衡量TP样本和FP样本累计分布之间的差值评估模型的风险区分能力。计算方法和AUC类似，但是AUC只评估模型的整体打分效果，并没有指出如何划分阈值，从而使类别预估的效果达到最好，而K-S可以指出分类的最佳划分阈值。


    与分类模型的评估指标相比，回归模型的评估指标比较直观。由于回归模型本身输出的就是数值型的预测值，因此要衡量这个值的准确度，其实就是看预测值与真实值之间的距离。


    • MSE（Mean Square Error，均方误差）：计算每个样本的预测值与真实值之差的平方，然后将其相加，最后取平均值，计算公式如下。


    ![](OEBPS/Images/173-1.jpg)


    • RMSE（Root Mean Square Error，均方根误差）：在均方误差的基础上开方。对于预测值域较大的场景，RMSE的评估值比MSE的评估值更稳定，计算公式如下。


    ![](OEBPS/Images/173-2.jpg)


    • MAE（Mean Absolute Error，平均绝对误差）：计算所有预测样本的预测值与真实值之差的绝对值，然后将其相加，最后取平均值，计算公式如下。


    ![](OEBPS/Images/173-3.jpg)


    • MAPE（Mean Absolute Percentage Error，平均绝对误差百分比）：计算每个样本的预测值与真实值的偏移大小百分比，然后将其相加，最后取平均值，计算公式如下。


    ![](OEBPS/Images/173-4.jpg)


    #### 5.4.3　直观理解AUC


    AUC是衡量二分类模型优劣的一种评估指标，表示正例样本排在负例样本前面的综合概率。在分类模型中，预测结果一般以概率的形式呈现，如果要计算准确率，那么通常的做法是手动设置一个阈值，将对应的概率转换成类别，而这个阈值在很大程度上会影响模型准确率的计算。不妨举一个极端例子：在一个二分类问题中，一共有10个样本，其中9个样本为正例样本，1个样本为负例样本，在全部判正的情况下，准确率高达90%，显然这并不是希望得到的结果。尤其在这个负例样本得分最高的情况下，模型的性能实际上是极差的。AUC可以很好地描述模型整体性能的高低，如果用AUC评估负例样本得分最高的情况，模型的AUC得分会等于0（当然，通过取反可以解决小于50%情况的问题，不过这是另一回事了）。


    为了方便解释ROC及ROC下方的面积，基于上一节讲解的TP、FP、TN、FN，下面介绍如下四个比率。


    • 真阳性率（True Positive Rate，TPR）：在所有实际为正例样本的样本中，被正确地判定为正例样本的比率。


    • 伪阳性率（False Positive Rate，FPR）：在所有实际为负例样本的样本中，被错误地判定为正例样本的比率。


    • 真阴性率（True Negative Rate，TNR）：在所有实际为负例样本的样本中，被正确地判定为负例样本的比率。


    • 伪阴性率（False Negative Rate，FNR）：在所有实际为正例样本的样本中，被错误地判定为负例样本的比率。


    ROC是根据TPR和FPR绘制而成的，其中横轴是FPR，纵轴是TPR。我们知道，ROC越靠近右下角，曲线下方的面积越小，表示模型的预测能力越低；ROC越靠近左上角，曲线下方的面积越大，表示模型的预测能力越高。那么，如何直观理解这条ROC及ROC下方的面积（AUC的数学意义）呢？


    我们可以先想想这条曲线是怎么画出来的。我们知道，线是由点组成的，结合横轴的FPR和纵轴的TPR，ROC上的任意一点表示一个FPR和TPR的数据对。起始点一定是坐标系的原点(0,
    0)，即FPR和TPR都为0；而终点一定是坐标为(1, 1)的点，即FPR和TPR都为1。显然，(0, 0)表示所有测试数据都不判定，而(1, 1)表示所有测试数据都判定成正例样本。自然而然，两点之间的数据，可以通过不同的阈值计算得到。'
