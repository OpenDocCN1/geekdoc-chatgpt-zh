    =0.5）\n\n5\\. 泊松分布\n\n在计算二项分布的概率分布时，如果需要计算发生k次的概率，那么在二项分布中必须事先知道一个全局的n。然而，在实际问题中很难或无法预先知道对应的n是多少，如潜在乘坐公交车的乘客总数、潜在需要去银行办理业务的客户总数、潜在包子铺顾客总数等![这里有一个前提假设，每一类人对相应事件的参与概率相同且互不影响。](OEBPS/Images/note.png)。\n\
    \n总数n未知，难道就没有办法求概率P了吗？聪明的你应该已经联想到了取n的极限来求解P。没错，取n的极限来求解P正是泊松分布的推导过程。\n\n根据二项分布的数学期望\n\
