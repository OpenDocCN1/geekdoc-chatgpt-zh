    ## 7.5 本章小结


    思维与创造能力、交互学习能力、知识迁移能力，三者共同构建了人类智能的闭环。本章分别介绍了 AI 算法中代表这三大能力的深度学习、强化学习和迁移学习，从起源讲到其各自具有代表性的算法模型，旨在起到抛砖引玉的作用，帮助感兴趣的读者对这三个研究方向有一个初步的认识，方便后续深入研究学习。


