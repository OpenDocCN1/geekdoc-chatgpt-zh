    先看“智能”一词，它的字面意思是智慧和能力。在自然界，智能可以分为个体智能和群体智能两种。除了人类，被广泛认为具备个体智能的生物还有大猩猩、海豚和章鱼等，具备群体智能的生物有蜂群、蚁群和沙丁鱼群等。在个体智能中，只能表现兴奋和抑制两种状态的人类大脑神经元，形成了复杂的思维与智慧。在群体智能中，通过分泌信息素完成交流的蚂蚁，构成了分工明确、井然有序的蚁群。从这个角度来看，无论是个体智能，还是群体智能，都是由大量简单行为连接转化而成的。在
