    ## 卷积神经网络


    要理解卷积神经网络，先理解什么是卷积。我们不妨将“卷积”一词拆开来理解，“卷”意为翻卷，可以理解为数学变换中的翻转和平移的意思；“积”可以理解为积累、相加、翻倍的意思，因此“卷积”表示一种简单的数学操作。卷积操作通常被看作加权滑动平均法![滑动平均法又称为移动平均法，可以在简单平均法的基础上，通过顺序逐期增减新旧数据求解移动平均值，从而消除偶然变动因素，找出事物发展趋势，并且据此进行预测。](img/note.png)的一种推广。卷积神经网络就是运用了卷积操作的一种神经网络，运用卷积操作的神经网络层称为卷积层（`Convolutional
    Layer`）。卷积层由卷积核组成，卷积核的计算类似于人工神经元中`y=ωx+b`的计算，只是输入不限定是一维的`xi`，可以是二维图像中的一个像素点`xi,j`，也可以是三维空间中一个物体在某一点的描述`xi,j,k`。每个卷积核通过学习不同的参数，可以感受局部视野，并且提取不同的局部特征。假设有一张
    3×3 的图像，卷积核为 2×2，卷积核内初始权重均为 1，那么卷积操作的计算方法如图 4-10 所示。


    ![](img/118-1.jpg)


    图 4-10　卷积操作的计算方法示例


    在图 4-10 中，卷积操作的具体计算过程如下。


    左上：`3×1+2×1+4×1+1×1=10`。

    左下：`4×1+1×1+7×1+9×1=21`。

    右上：`2×1+6×1+1×1+5×1=14`。

    右下：`1×1+5×1+9×1+3×1=18`。


    卷积神经网络除了包含卷积层，还包含池化层（`Pooling Layer`）。池化分为最大池化和均值池化两种，最大池化是指每次取感受视野范围内的最大值作为输出，均值池化是指每次取感受视野范围内的平均值作为输出。池化层一般放在卷积层的后面计算，用于减少深度神经网络训练的参数数量，提高深度神经网络的训练速度和泛化能力。以最大池化为例，池化大小为
    2×2，图 4-10 中图像的池化操作计算方法如图 4-11 所示。


    ![](img/119-1.jpg)


    图 4-11　池化操作的计算方法示例


    在图 4-11 中，池化操作的具体计算过程如下。


    左上：`max{3, 2, 4, 1}=4`。

    左下：`max{4, 1, 7, 9}=9`。

    右上：`max{2, 6, 1, 5}=6`。

    右下：`max{1, 5, 9, 3}=9`。


    当然，卷积神经网络的网络结构除了包括卷积层和池化层，还包括神经网络都有的组成部分，即输入层、全连接层和输出层。卷积神经网络在计算机视觉和图像识别领域发挥着至关重要的作用，如著名的`AlexNet`网络结构（详见第
    7 章图 7-1）。`AlexNet`是 2012 年`ImageNet`竞赛冠军获得者`Hinton`和他的学生`Alex Krizhevsky`设计的。在那年之后，很多更深的卷积神经网络相继被提出，如`VGGNet`![由牛津大学计算机视觉组（`Visual
    Geometry Group`）与 Google Deep Mind 公司研究员一起研发。](img/note.png)和`GoogLeNet`![2014
    年由在 Google 工作的`Christian Szegedy`提出，不叫“GoogleNet”，是为了致敬经典 CNN——`LeNet`。](img/note.png)。


    ### 4.3.4　递归神经网络


    无论是深度神经网络还是卷积神经网络，相邻的两层都是从空间维度上进行展开与衔接的。我们知道在爱因斯坦的广义相对论中，空间和时间是两个并列的维度，共同组成了所谓的“四维时空”。那么，既然存在空间维度上展开的神经网络，自然也存在时间维度上展开的神经网络，这便是本节要讲的内容。


    递归神经网络（`Recursive Neural Network`，`RNN`）又称为循环神经网络（`Recurrent Neural Network`），它会将一个网络结构单元的输出作为该网络结构单元在下一时刻的输入，所有神经网络层之间的衔接与串联都会在时间维度上展开。一个典型的递归神经网络结构如图
    4-12 所示。


    ![](img/120-1.jpg)


    图 4-12　典型的递归神经网络结构


    在图 4-12 中的递归神经网络结构中，隐层除了向输出层输出信息，还会将信息传递给下一时刻的自己，即下一时刻的隐层，这样做的目的是让神经网络在时间维度上产生“记忆”。


    递归神经网络的典型应用领域为人机交互、自动翻译和文档补全等自然语言处理方面的场景。递归神经网络和深度神经网络一样，在模型训练过程中同样存在梯度消失问题，具体表现为容易“忘事”。由于递归神经网络是时间维度上展开的神经网络结构，因此递归神经网络需要升级自身模型结构，才能解决“忘事”这个难题。升级后的递归神经网络模型，叫作长短时记忆（`Long-Short
    Term Memory`，`LSTM`）模型。


    作为一种升级版的递归神经网络模型，长短时记忆模型会在时间维度上增加若干个特定的神经网络结构，用于提升记忆关键信息的能力。长短时记忆模型的网络结构如图 4-13
    所示。


    ![](img/121-1.jpg)


    图 4-13　长短时记忆模型的网络结构


    在图 4-13 中，大长方形框住的整体称为记忆单元，实线箭头表示当前时刻的信息传递，虚线箭头表示上一时刻的信息传递。与典型的递归神经网络模型相比，长短时记忆模型一共增加了
    3 个神经网络层，这 3 个神经网络层在学术上分别称为输入门（`Input Gate`）、遗忘门（`Forget Gate`）和输出门（`Output Gate`）。进入记忆单元的箭头表示输入，从记忆单元出去的箭头表示输出。


    总体而言，与普通的递归神经网络模型相比，长短时记忆模型的结构更复杂，可调整和变化的地方也更多。例如，增加`peephole`，将`Cell`![是一种网络结构。](img/note.png)的状态连接到每个门。长短时记忆模型可以简化为门控循环单元（`Gated
    Recurrent Unit`，`GRU`）模型。在长短时记忆模型中加入注意力（`Attention`）机制，可以产生多种变种模型。长短时记忆模型在语音识别、图像识别、疾病预测等领域都发挥着惊人的作用，是当下最流行的神经网络模型之一。


    ### 4.3.5　图神经网络


    图神经网络（`Graph Neural Network`，`GNN`）是一种基于关系建模的神经网络。在讲解图神经网络之前，我们先回顾一下什么是图。根据第 3
    章内容可知，图由顶点和边两部分组成。边可以分为有向边与无向边，包含有向边的图称为有向图，不含有向边的图称为无向图。图结构在现实生活中是广泛存在的，网站之间的超链接引用关系、社交网络中的朋友关系、学术界论文之间的引用关系都可以用图结构表示。基于图结构的研究课题有很多。例如，在社交网络的图结构中，将用户作为节点，将用户之间的朋友关系作为边，通过分析社交网络图结构中的信息，可以对图结构中的节点（用户）使用监督学习中的分类算法进行学习，进而对用户的兴趣、转发文章、评论等社交行为进行深入分析和预测。


    与深度神经网络和递归神经网络不同，图神经网络由多层明确的神经网络层构成。图神经网络是一种直接运行在图结构上的神经网络。针对节点分类问题的图神经网络，其神经网络层聚合的信息不仅包括节点本身的特征，还包括与该节点相邻的边和节点的特征。考虑到相邻节点的位置、距离，在进行特征聚合时可以分为一度邻居、二度邻居和多度邻居。一个常规的图神经网络结构如图
    4-14 所示。


    ![](img/123-1.jpg)


    图 4-14　常规的图神经网络结构


    图神经网络一般不直接用于进行分类或回归，通常将其作为图的一种表征学习融入其他模型的特征输入中。图的表征学习是指将图中的各种信息映射成一个 N 维特征向量，这种映射关系在机器学习中称为特征嵌入（`Feature
    Embedding`）。图中各种信息的嵌入统称为图嵌入（`Graph Embedding`）。图嵌入最常见的用法有两种，分别为点嵌入（`Node Embedding`）和边嵌入（`Edge
    Embedding`）。如果输出信息是节点，则输出点嵌入的特征向量；如果输出信息是边，则输出边嵌入的特征向量。输出节点信息的应用比较常见。例如，从聊天网络和电商网络中识别出欺诈用户，从终端设备网络中识别出欺诈设备，等等。为了方便展示，图
    4-14 中只用箭头标记了节点的输出信号，未标记边的输出信号。


    经过各种嵌入后的特征向量可以和其他特征拼接使用，也可以直接输入神经网络的全连接层，继续加入模型进行学习。除了点嵌入和边嵌入，还有整图嵌入（`Whole-Graph
    Embedding`），这种用法在化学分子结构、蛋白质结构的分析探索中有较广泛的应用。


    ## 4.4　决策树


    无论是回归模型，还是神经网络模型，都要通过纯数学变换和层层公式计算来获得期望的结果，解决问题的过程都不够人性化，让人难以直观理解。尤其是深度神经网络，即使最后的分类或回归效果可以做到极致，对于隐层在训练过程中发生了什么，模型到底是如何一步一步逼近最优效果的，到目前为止，业界也没有一个很好的答案，这就是模型可解释性问题。在深度神经网络发挥作用的场景中，深度神经网络模型的可解释性问题通常是用户最困惑、最担忧的问题之一。例如，随着时间的推移，模型的预测能力下降，从模型结构层面很难给出令人信服的理由。


    本节介绍机器学习算法中可解释性最强的模型之一——决策树（`Decision Tree`）。近几年已经有学者研究如何利用决策树的性质解决深度神经网络模型的可解释性问题。


    ### 4.4.1　概念与方法


    决策树是一种树形分类和回归模型，每个非叶子节点都相当于一个`IF`![`IF`即如果，是编程语言中的一种基本条件判断语句。](img/note.png)条件判断语句，模型通过逐个判定特征所属类别，对样本逐步进行分类。决策树模型不仅可解释性强，解决问题的角度也趋近于人类看待问题和理解问题的视角，比较简单、直观。下面通过一个例子，初步讲解决策树的工作原理。有
    10 条关于西瓜的样本数据，如表 4-1 所示，我们要根据这些数据学习如何判断一个西瓜是否为好瓜。


    表 4-1　西瓜样本数据集


    ![](img/125-1.jpg)


    在表 4-1 中，西瓜有 3 种特征，分别为色泽、敲声、纹理。决策树会以某种顺序依次考查西瓜的每个特征，逐层缩小范围，从而判定这个西瓜是否为好瓜。由于树结构具有层次关系，并且决策树采用自上而下的建树模式，因此特征考查的顺序直接决定了最终分类的效果。根据顺序（色泽→敲声→纹理）构建决策树模型
    A，如图 4-15 所示。


    ![](img/125-2.jpg)


    图 4-15　决策树模型 A


    然后根据顺序（敲声→色泽→纹理）构建决策树模型 B，如图 4-16 所示。


    ![](img/126-1.jpg)


    图 4-16　决策树模型 B


    对比决策树模型 A 和决策树模型 B 可知，不同的特征考查顺序的确会影响决策树的最终分类效果。那么，如何设置特征考查顺序，才能得到分类效果较好的决策树呢？这涉及信息论中的一个概念——信息增益（`Information
    Divergence`）。说到信息增益，不得不先介绍熵（`Entropy`）。熵在信息论中衡量的是数据的混乱程度，本质是香农![克劳德·艾尔伍德·香农（`Claude
    Elwood Shannon`，1916—2001），美国数学家、信息论的创始人。提出了衡量信息量的公式，即香农公式。](img/note.png)信息量（`p·log(1/p)`，0<p≤1）的期望。信息量是可以衡量的，不然我们也不会觉得有时候说的话虽然多，却没什么信息量，而有的话却能一语中的。信息增益作为设置决策树特征考查顺序的依据，可以直观理解为，在按照当前设置的特征考查顺序划分数据集后，如果可以最大程度减少数据的混乱程度，那么该特征考查顺序是好的特征考查顺序。


    不妨举个例子，一个全是好瓜的数据集信息量为


    `-log1= 0`


    此时该数据集的混乱程度达到最低，因为不用判断就知道里面全是好瓜；而对于一个一半是好瓜一半不是好瓜的数据集，信息量为


    ![](img/127-1.jpg)


    假设存在某个特征恰好能区分是否为好瓜，那么用这个特征划分这个数据集之后的信息增益计算方法为


    ![](img/127-2.jpg)


    `ID3` 算法每次选择最大信息增益的特征作为父节点，向下扩展决策树，直到不能继续扩展为止。


    在计算信息增益时，我们发现，当属性取值较多时，其信息增益往往偏高。在极端情况下，如每个属性值只对应一个样本，信息增益必然等于最大值 1。显然，这样的决策树泛化能力![泛化能力是指机器学习算法对新样本的判断能力。](img/note.png)是最弱的。因此，`C4.5`
    算法应运而生，该算法使用信息增益率的概念（信息增益率等于信息增益除以数据集中该特征的总信息量），大致思路如下：先选出信息增益高于平均水平的特征，再从中选择信息增益率高的特征，用于当前分裂。此外，还有一种`CART`算法，使用基尼指数选择特征，也能增强决策树的泛化能力。


    ### 4.4.2　剪枝


    在决策树变复杂之后，由于判断分支过多，因此训练集中的某部分样本特征被当作所有样本的一般性质，就出现了过拟合![相反的问题称为欠拟合（`Under fitting`）问题。例如，模型只认识白天鹅，不认识黑天鹅，是过拟合；模型将鸭子误认成天鹅，就是欠拟合。](img/note.png)（`Over
    fitting`）问题。决策树解决过拟合问题的主要方法是剪枝。剪枝分为预剪枝和后剪枝两种。


    1. 预剪枝


    节点依据信息增益和增益率扩展子节点，在这个过程中，验证集的整体准确率会随着节点的分裂增加发生变化。如果某个节点的扩展导致验证集的分类准确率降低，则舍弃该节点，这便是预剪枝。预剪枝不仅能降低过拟合风险，还能大大降低决策树的建树时间复杂度。但是，预剪枝由于使用贪婪算法决定是否对当前节点进行分裂，因此不能权衡决策树的全局利弊，并且会给最终模型带来欠拟合风险。


    2. 后剪枝


    后剪枝是一种全局优化方法。在决策树的建树过程全部完成后，后剪枝从下往上依次考查各个非叶子节点，考查方法和预剪枝一样，如果某个节点的扩展在验证集上并未提高准确率，则舍弃该节点。后剪枝既降低了过拟合风险，又降低了欠拟合风险。但是，由于后剪枝是在生成完整决策树之后进行的，因此模型训练的整体时间复杂度会比较高。


    ### 4.4.3　梯度提升决策树


    由于决策树简单有效，可解释性强，因此可以将其包装成一些更高效的机器学习算法，如梯度提升决策树和随机森林。梯度提升决策树和随机森林之间的关系类似于串行和并行之间的关系，本节我们先讲解梯度提升决策树。


    梯度提升决策树（`Gradient Boosting Decision Tree`，`GBDT`）是一个与梯度有关、对决策树进行提升的机器学习模型。梯度提升决策树可以是分类树，也可以是回归树。我们不妨从后往前依次分解
    DT、B、G 这几个定语，逐步理解 GBDT 的精髓。


    `DT`（`Decision Tree`，决策树）。决策树分为分类树和回归树两种。回归树与分类树的原理机制相似，区别在于分类树只在叶子节点返回唯一分类，而回归树的每个节点都能返回一个回归值，通常为当前节点内所有样本的平均值。


    `B`（`Boosting`，提升）。提升是指在原来模型的基础上做进一步的效果提升，提升决策树（`BDT`）的基本思路是采用多棵决策树串行建模。具体过程为，对于第一棵树之后的每一棵决策树，都基于前一棵决策树的预测结果进行二次建模，在这样串行建模的过程中，逐步修正预测结果，从而得到最优解。


    `G`（`Gradient`，梯度）。梯度的大小反映了当前预测值与目标值之间的距离或差异。因此，在上述的串行建模过程中，除了第一棵决策树使用原始样本数据进行训练外，之后的每一棵决策树都使用前一棵决策树的预测值（平均值）与实际值之差（负梯度，可以理解为残差或增量）进行建树。这相当于对分错的样本有针对性地继续分类，使样本的总体残差趋近于
    0。由于除第一棵决策树外的其他决策树都会对目标的残差或增量进行建模预测，因此梯度提升决策树模型需要将串行建树过程中每一棵决策树的输出结果相加，才能得到最终的预测输出结果。下面通过一个经典例子“预测年龄”来讲解梯度提升决策树的具体工作过程。假设有
    4 个样本，其特征描述分别如下。


    • 样本 A，消费较高、经常被学弟问问题，27 岁。

    • 样本 B，消费较高、经常问学长问题，23 岁。

    • 样本 C，消费较低、经常被学弟问问题，17 岁。

    • 样本 D，消费较低、经常问学长问题，13 岁。


    梯度提升决策树串行建模的过程如图 4-17 所示。


    ![](img/130-1.jpg)


    图 4-17　梯度提升决策树串行建模的过程


    在图 4-17 中，梯度提升决策树模型对各个样本的预测结果，即每棵树预测结果的和。A 的年龄为 27（25+2）岁，B 的年龄为 23（25-2）岁，C 的年龄
    17（15+2）岁，D 的年龄为 13（15-2）岁。


    梯度提升决策树的核心思想概括如下：串行训练 n（n > 2）棵决策树，其中第 i（1<i≤n）棵决策树学习第 i-1 棵决策树的负梯度（可理解为残差或增量），将
    n 棵决策树的输出结果累加作为最终输出结果。


    ### 4.4.4　随机森林


    随机森林（`Random Forests`，`RF`）是指由多棵决策树组成的决策树森林。组成随机森林的决策树既可以是分类树，又可以是回归树。与梯度提升决策树模型相比，随机森林模型的原理更直观、简洁，性能也更强悍。随机森林算法的核心思路有两个：采样和完全分裂。采样分为行采样和列采样，这里的行与列对应的是样本与特征两个维度。完全分裂是指决策树在每一次分裂扩展节点时，如果能分裂，就必须分裂，分裂依据可以是信息增益或信息增益率。


    对于行采样，模型从 M 条数据中随机采样 m 条数据，分别作为每一棵决策树的训练集。在一般情况下，m 为 M 的算术平方根。行采样保证了每棵决策树使用的训练集各不相同，这在一定程度上抑制了过拟合问题。


    对于列采样，每一棵决策树都从 M 个特征中随机挑选 m 个特征作为节点分裂特征来计算。在一般情况下，m 为 M 的算术平方根。列采样分为两种方式，一种是全局列采样，即同一棵树的建树过程均采用同一批采样的特征；另一种是局部列采样，即每一次节点分裂均单独随机挑选
    m 个特征进行分裂。与行采样相比，列采样进一步保证了随机森林不会出现过拟合的问题。


    随机森林采用并行建模方式，最终的模型预测结果由每一棵决策树的预测结果共同决定。如果是分类树，则通过投票产生最终分类；如果是回归树，则计算所有结果的平均值。


    随机森林和梯度提升决策树都属于集成学习（`Ensemble Learning`）的范畴。集成学习是指包含多个子模型共同建模的机器学习算法。“三个臭皮匠，顶个诸葛亮”，这便是集成学习算法的精髓。


    ## 4.5　聚类


    '
  toc: []
- raw: '生活中有许多地方需要对事物进行分类，如超市货架、各大商场的品牌专柜、学校的社团等。将具有相同性质、相似功能的事物划分在一起的方法，在机器学习中称为聚类（Cluster）。


    #### 4.5.1　距离度量


    我们知道，样本由特征组成，特征分为连续（有序）型特征和离散（无序）型特征两种。样本之间的距离度量是指样本特征之间的距离度量。


    对于连续型特征的距离度量，最常用的是闵可夫斯基距离（Minkowski Distance），其计算公式如下。


    ![](OEBPS/Images/132-1.jpg)


    上述公式首先计算两个样本之间每个特征值之差的p次方，然后求和，最后取p次方根。公式中的i表示特征序号，p的值不同表示的距离含义不同。当p为1时，计算的是曼哈顿距离（Manhattan
    Distance）；当p为2时，计算的是欧氏距离（Euclidean Distance）；当p趋于无穷大时，计算的是切比雪夫距离（Chebyshev Distance）。


    闵可夫斯基距离有两个明显的缺点：一是特征之间的量纲（单位）被等同对待，这通常是不合理的。二是未考虑特征值本身的分布规律。例如，如果特征值的分布规律类似于长尾分布，那么这种距离度量的效果通常会大打折扣。第一点可以采用特征值加权或归一化![归一化是指将特征值映射到(0,
    1)区间内，详见第5章特征工程的相关内容。](OEBPS/Images/note.png)统一量纲解决，第二点可以采用特征值标准化或离散化![详见第5章特征工程的相关内容。](OEBPS/Images/note.png)解决。


    除了闵可夫斯基距离，常见的连续型特征距离度量方法还有马氏距离（Mahalanobis Distance）、余弦相似度（Cosine Similarity）、皮尔逊相关系数（Pearson
    Correlation Coefficient）。


    对于离散型特征的距离度量，最直接的度量方法是0/1匹配法，即对应位置的特征相同则为1，不同则为0，累加值的大小体现了样本之间的相似程度。基于0/1匹配法，还可以使用杰卡德相似系数（Jaccard
    Similarity Coefficient）进一步计算样本特征之间的距离。指定两个集合A和B，将杰卡德相似系数定义为A与B交集中的元素数量与并集中的元素数量的比值，计算公式如下。杰卡德相似系数的值越大，说明相似度越高，当A和B都为空集时，杰卡德相似系数为1。


    ![](OEBPS/Images/133-1.jpg)


    对于离散型特征的距离度量，还可以采用值差分度量法（Value Difference Metric，VDM）。值差分度量法的使用前提是样本必须是带有类别标签的。其算法原理如下：通过计算不同的离散型特征值在相同类别标签下所占比例的大小关系，得出离散型特征之间的相似度。


    #### 4.5.2　划分聚类


    划分聚类是指根据确定的距离度量规则，将样本数据逐一归类，最终达到“类内样本数据足够近，类间样本数据足够远”的效果。


    k均值（k\-Means）算法是划分聚类的代表性算法，该算法的执行流程如下。


    （1）随机选择k个样本作为初始的k个类别中心。


    （2）将样本逐一划分到与这k个类别中心度量距离最小的类别。


    （3）将每个类别的中心点坐标（特征值）更新成当前类别下所有样本特征距离的平均值。


    （4）重复步骤（2）和（3），直到类别中心位置不再发生变化或已达到最大迭代次数。


    根据上述算法执行流程可知，k均值算法受噪声和离群点的影响较深。因为类别的中心点坐标是根据样本特征距离的平均值更新的，所以一旦出现离群较远的样本数据，中心位置就会受到很深的影响。基于这个问题，k中心点（k\-Medoids）算法和k中值（k\-Medians）算法应运而生。


    k中心点算法在每次更新类别中心点坐标时，都会通过枚举每个类别下的数据点，计算当前类别下其他数据点到该点的距离之和，将距离之和最小的点定为新的类别中心点。也就是说，k中心点算法的类别中心点坐标一定是一条具体的样本数据，而不是计算出来的特征距离平均值。与k中心点算法不同，k中值算法在每次更新类别中心点坐标时，都会将类别中心点更新成同类别下所有样本数据的中位数，直到每个类别的中位数不再发生改变。


    k中心点算法和k中值算法虽然都在一定程度上解决了噪声和离群点问题，但是由于在更新类别中心点坐标时不再是简单地取平均值，因此算法的时间复杂度会随之增加。此外，k中值算法如果遇到离散型特征数据，就需要使用离散型特征的距离度量法进行距离度量。这时会有个新的算法——k\-Modes算法。k\-Modes算法的距离度量法可以是交集中的元素数量、杰卡德相似系数等。


    #### 4.5.3　层次聚类


    在划分聚类中，我们需要事先指定类别数量，然而人工指定的类别数量往往不是最优类别数量。本节要讲的层次聚类，无须事先指定聚类数量。该类聚类算法更关心同类别下样本之间的相似性，优先从相似性出发，而不是预先指定聚类数量。


    所谓层次，就是类似于树结构的展开与回溯，逐层合并或拆分样本数据集。逐层合并是自底向上的聚类方法，称为凝聚层次法。如果使用凝聚层次法，那么开始的每个样本都是一个类，然后根据相似性度量法寻找同类样本，自下而上逐层地形成较大的类别。逐层拆解是自顶向下的聚类方法，称为分裂层次法。如果使用分裂层次法，那么开始的所有样本都属于同一个大类，然后根据相似性度量法逐层拆分样本，自上而下逐层形成较小的类别。


    由于大部分层次聚类法采用的是凝聚层次法，因此本节重点讲解凝聚层次法的执行流程。


    凝聚层次法的执行流程类似于哈夫曼树![哈夫曼树是带权路径长度最短的树，形成的哈夫曼编码主要应用于数据通信中。](OEBPS/Images/note.png)的构建过程。哈夫曼树每次都会选择权值最小的节点组成一棵新树，直到所有节点合并成一棵权值路径最短的树。同理，凝聚层次法会根据样本之间的最小距离来合并成类，具体步骤如下。


    （1）每个样本独自为一类，计算两个类别之间的最小距离。


    （2）合并距离最小的两个类为一个新类。


    （3）重新计算产生的新类与剩余所有类之间的距离。


    （4）重复步骤（2）和（3），直到只剩下一个类或类间距离大于某个阈值。


    类间距离的计算方法可以采用最小距离法、平均法等。其中最小距离法计算的是类别之间最近样本的距离；平均法是最常用的方法，先计算两个类别之间所有样本的距离，然后取平均值作为这两个类别之间的距离。


    层次聚类不仅可以解决划分聚类需要事先指定类别数量的问题，在聚类过程中还可以发现类别之间的层次关系，并且能够聚出各种形状的类别。不过，在计算类间距离时，层次聚类的算法复杂度很高，而且有可能形成链状类别。


    #### 4.5.4　密度聚类


    层次聚类的最大问题是有可能形成链状类别，密度聚类则不存在这个问题。密度聚类是一种基于样本密度的聚类方法，类似于在一张地图上做人口密度分布图，密集区域通常被认为是城市所在地。因此，密度聚类是最直观的聚类方法。密度聚类的主要目标是寻找高密度区域，与距离聚类的不同之处在于，后者的结果通常表现为球状簇，而前者可以形成任意形状。只要参数设置合理，就不会形成链状类别，并且不会受噪声和离群数据点影响。


    密度聚类算法都会涉及邻域和数量。DBSCAN（Density-Based Spatial Clustering of Application with Noise）为比较有代表性的密度聚类算法，该算法用半径R表示邻域大小，用N表示邻域R范围内的样本数量。根据参数R和N，DBSCAN算法将样本分为以下3类。


    • 核心点。在邻域R范围内数量不小于N的样本数据点。


    • 边界点。在邻域R范围内数量小于N的样本数据点，并且该样本数据点落在其他核心点的邻域内。


    • 噪声点。既不是核心点也不是边界点的样本数据点。


    如果只采用核心点计算聚类，那么可以将DBSCAN算法看作k均值算法的变种。因为加入了边界点和噪声点的计算，所以DBSCAN算法比一般的聚类算法更强大。DBSCAN算法的执行流程如下。


    （1）将所有样本数据点划分为核心点、边界点或噪声点。


    （2）删除所有噪声点。


    （3）将邻域R范围内的核心点连接成边，从而形成连通图G。


    （4）计算连通图G中的连通分量![连通分量所包含的节点两两之间直接或间接相连。连通图的连通分量是其本身。](OEBPS/Images/note.png)GCCi，形成初步聚类。


    （5）将边界点划分到与之关联的核心点所在的类别。


    在使用DBSCAN算法完成聚类后，我们不妨试想一下每个类内部有什么特点。首先，类内不同的核心点之间一定能画出至少一条经过全部核心点的线路。其次，不同的边界点之间，一定能通过某些直接或间接相连的核心点间接相连。这里涉及3个密度概念：密度直达、密度可达和密度相连。


    如图4-18所示，如果从核心点p出发，可以直接与点q相连，则称p密度直达q；如果核心点p在经过若干次密度直达后，可以间接与q相连，则称p密度可达q；如果核心点p可以分别密度可达边界点q和s，则称q和s密度相连。密度可达属于密度相连，密度直达属于密度可达。根据密度概念我们发现，每个类中的任意两点之间都是密度相连的。


    ![](OEBPS/Images/137-1.jpg)


    图4-18　密度概念区分


    虽然密度聚类算法优点很多，但是其时间复杂度也非常高，一般通过构建数据索引来降低其时间复杂度。


    #### 4.5.5　模型聚类


    模型聚类是指使用既定的算法模型计算不同样本之间的差别程度，进而将其归为不同的类别。模型聚类主要分为基于概率模型的聚类和基于神经网络模型的聚类，其中基于概率模型的聚类较为流行。在基于概率模型的聚类中，高斯混合模型聚类算法是最典型、最常用的模型聚类算法之一。


    顾名思义，高斯混合模型（Gaussian Mixture Models，GMM）由高斯模型组成。高斯模型就是我们常说的正态分布，因此高斯混合模型可以理解为几个正态分布的叠加。高斯混合模型聚类过程与k均值算法的执行流程类似，具体步骤如下。


    （1）随机生成k个高斯分布作为初始的k个类别。


    （2）对于每个样本数据点，计算其在各个高斯分布中的概率。


    （3）对于每个高斯分布，将样本数据点在该高斯分布中的概率作为权重，加权计算并更新其平均值和方差。


    （4）重复步骤（2）和（3），直到每个高斯分布的平均值和方差不再发生变化或已满足迭代次数。


    单特征的高斯混合模型聚类算法的执行流程图例如图4-19所示。


    ![](OEBPS/Images/138-1.jpg)


    图4-19　单特征的高斯混合模型聚类算法的执行流程图例


    如果样本数据集是多维情况，则需要计算协方差，将不同维度之间的关联性考虑进来。高斯混合模型聚类和k均值聚类一样，分类受类别个数的初始值影响较大。不过高斯混合模型聚类完的样本可以同时属于多个类别，这种聚类又称为软聚类。其他的模型聚类算法还有基于PageRank![网页排名算法，由Google的创始人拉里·佩奇和谢尔盖·布林于1998年在斯坦福大学发明。](OEBPS/Images/note.png)的软聚类算法、基于神经网络模型的自组织映射（Self-Organizing
    Maps，SOM）聚类算法等。


    ### 4.6　贝叶斯分类


    托马斯·贝叶斯（Thomas Bayes，1702—1761）是18世纪英国的神学家、数学家、数理统计学家和哲学家，他是概率论理论的创始人，创立了贝叶斯统计，是“归纳地”运用数学概率，“从特殊推论一般、从样本推论全体”的第一人。贝叶斯分类（Bayesian
    Classification）算法是基于统计学的一种分类算法，其特点是使用概率表示所有形式的不确定性，学习或推理都要用概率规则来实现。


    #### 4.6.1　概率基础


    概率（Probability）衡量的是事情发生的可能性大小。例如，投掷一个均匀的骰子，1～6中任意一个点数朝上的可能性都为1/6。在第2章，我们对概率相关的基本概念有了一个初步了解，本节进一步给大家讲解两种概率（先验概率、后验概率）和4个公式（加法公式、乘法公式/条件概率公式、贝叶斯公式、全概率公式），这些公式不仅能帮助大家更好地理解贝叶斯分类算法，在生活中的应用也十分广泛。


    1\. 先验概率


    先验概率是指在检验与验证之前，根据经验预先推测出来的概率。例如，投掷一个均匀的骰子，我们事先就能推测每个面朝上的概率是1/6。


    2\. 后验概率


    后验概率是指在得到实验结果之后重新校验的概率，可以理解为对先验概率的修正。


    3\. 加法公式


    加法公式如下：


    P(A∪B)=P(A)+P(B)-P(A∩B)


    A∪B表示事件A发生或事件B发生，A∩B表示事件A和事件B同时发生。直观理解，加法公式的意思是事件A和事件B任意一个事件发生的概率，等于二者发生的概率之和减去二者同时发生的概率。加法公式对于任意两个事件A和B均成立，不要求A与B之间是条件独立![两个事件条件独立，是指一个事件是否发生，与另一个事件是否发生没有关系。](OEBPS/Images/note.png)的。加法公式示意图如图4-20所示。


    ![](OEBPS/Images/140-1.jpg)


    图4-20　加法公式示意图


    4\. 乘法公式/条件概率公式


    乘法公式/条件概率公式如下：


    P(A∩B)=P(A)P(B|A)=P(B)P(A|B)


    P(B|A)表示在事件A发生的前提下，事件B发生的概率，即事件B的条件概率。直观理解，乘法公式的意思是事件A和B同时发生的概率，与事件A发生的概率和事件B的条件概率之积相等，并且与事件B发生的概率和事件A的条件概率之积相等。因此乘法公式又称为条件概率公式，其示意图如图4-21所示。


    ![](OEBPS/Images/141-1.jpg)


    图4-21　乘法公式示意图


    5\. 贝叶斯公式


    贝叶斯公式如下：


    ![](OEBPS/Images/141-2.jpg)


    不难看出，贝叶斯公式是由乘法公式变换而来的。在机器学习中，贝叶斯公式通常写为


    ![](OEBPS/Images/141-3.jpg)


    其中D是样本数据集，P(h)表示在没有进行样本训练之前预测目标h的初始概率，即前面提到的先验概率，先验概率反映了关于目标h的所有前提认知。而在机器学习中我们通常更关心后验概率P(h|D)，即样本训练集D中目标h成立的条件概率。


    6\. 全概率公式


    全概率公式如下：


    ![](OEBPS/Images/142-1.jpg)


    在全概率公式中，Bi表示两两不相同的时间段，P(A|Bi)表示在Bi时间段内事件A发生的概率，由于Bi两两不相容，因此事件A的全概率公式P(A)可以看作加法公式。


    #### 4.6.2　朴素贝叶斯分类


    在机器学习中，如何利用上面讲到的两个概率和4个公式进行分类呢？这便是朴素贝叶斯分类要做的事情。贝叶斯分类是指根据已分类样本的先验概率，估计待分类样本的后验概率。使用贝叶斯公式表示分类目标函数如下（其中c为类别，x为样本）：


    ![](OEBPS/Images/142-2.jpg)


    但是，在样本具备多个特征的情况下，很难根据训练样本得到上式中条件概率P(x|c)的概率分布。针对这个问题，朴素贝叶斯分类应运而生。朴素贝叶斯分类避开了这个难题，对条件概率P(x|c)的概率分布做了条件独立的假设，即不同特征之间两两不相关。既然满足条件独立，就可以采用乘法公式计算P(x|c)的概率分布，公式如下（d为特征总数）：


    ![](OEBPS/Images/143-1.jpg)


    有了条件概率的简化计算方式，即可得到朴素贝叶斯分类的目标函数，公式如下：


    ![](OEBPS/Images/143-2.jpg)


    其中，P(c)可以直接统计训练样本中各个类别的比例。对于条件概率P(xi|c)，如果x是离散型特征，则可以通过计算在c类别中第i个属性取值为xi的比例。如果x是连续型特征，则需要先假设特征符合某种分布规律，如常见的二项分布、高斯分布、泊松分布、伯努利分布等，再计算相应的条件概率。在得到条件概率后，计算出概率最大的类别，就是朴素贝叶斯分类模型的预测结果。


    需要注意的是，在计算条件概率的过程中，有可能出现概率为0的情况，从而导致连乘之后的值为0。这里需要引入拉普拉斯平滑系数，简单理解就是分子、分母同时加上一个常数，用于避免概率为0的情况发生。可以证明，当训练集足够大时，加入拉普拉斯平滑系数的估计值会趋近真实的概率。


    ### 4.7　支持向量机


    支持向量机（Support Vector Machine，SVM）是一种非常有潜力的分类模型。与逻辑回归模型、神经网络模型相比，支持向量机有更强的数学理论背景。因此与其他分类模型相比，支持向量机的学习门槛相对较高。


    拆开来看，支持向量机分为支持向量和机两部分。前面提到，机在机器学习领域是算法的另一种称呼，如感知机、波兹曼机等。支持向量是指一些比较特别的样本，这些样本在真正意义上决定了支持向量机的模型参数取值。


    在4.2节中，我们举了房价和建筑面积之间关系的例子。在这个例子中，我们给每个样本增加一个“是否成交”标签。在构建样本数据点后，使用线性回归模型得到的分类结果如图4-22所示，其中房价和建筑面积这两个特征分别为坐标系的横轴和纵轴，黑色样本点表示已成交，灰色样本点表示未成交。


    ![](OEBPS/Images/144-1.jpg)


    图4-22　线性回归模型的分类结果


    显而易见，线性回归能将“已成交”和“未成交”的样本数据划分开![在实际情况下，样本数据分布不会这么理想，这是为了方便算法讲解构造的完美样本数据。](OEBPS/Images/note.png)。如果将图4-22中划分的虚线稍微平移一点，或者旋转任意一个微小角度，其实也能达到同样的划分效果。那么，究竟哪一条虚线划分的效果是最好的呢？一种直观的判断方法为，虚线与两边样本之间平均距离越大越好。理论上如此划分的虚线，泛化能力是最好的，而支持向量机要做的就是找出与两边样本之间平均距离最大的虚线。


    在形式上，支持向量机的模型公式和线性回归模型公式一样，也是f(x)=wx+b。支持向量机给出的最优划分结果如图4-23所示。


