- raw: '然而，现阶段的人工智能水平距离实现真正的智能还有相当长的一段距离。一句流行语是这么说的，“有多少人工，就有多少智能”。当然，这个讽刺的主要是那些虚假的同声传译和人机交互。即便强如AlphaGo，在人类围棋界一骑绝尘的情况下，也远没有做到真正的智能。AlphaGo的出现只是说明了人类的围棋水平还远远不够罢了。我在《AlphaGo技术剖析：揭开围棋大脑的神秘面纱》![微信公众号“对半独白”中的一篇原创文章。](OEBPS/Images/note.png)一文中写道：智能所体现的思维与认知，没有标准。真正的智能体至少应该具备两种能力──想象力和创造力。由此观之，AlphaGo做到的也只是对既定目标的学习训练，如果目标更换，则会束手无策，需要重新建模训练。


    怎样才能实现不那么人工的智能？不妨从人的角度分析这个问题，看看一个人到底是如何学习新鲜事物的。假如有两个运动天赋相同的人A和B，他们都想学习网球，其中A会羽毛球，B什么运动都不会，问谁学习网球的速度更快一些，谁最终的网球水平更好一些？对于第一个问题，大家自然想到是A，因为A会羽毛球，B不会，而羽毛球和网球有不少相似之处。对于第二个问题，由于运动天赋相同，因此得看两人的学习程度。这两个问题的答案放到人工智能的算法世界，对应的是迁移学习和强化学习。迁移学习能够举一反三，从而快速学习未知领域的知识；强化学习能够通过不断地试错练习，深度掌握某个领域的知识。


    从这个角度来看，迁移学习和强化学习或许是实现真正人工智能的重要手段。但是要让机器像人一样思考，拥有自主意识，具备想象力和创造力，除了需要结合算法、数据和算力三方面因素，对人脑神经元的深入研究也必不可少。总而言之，算法是实现人工智能的重要因素，但是要实现真正的智能，只提升算法能力仍然远远不够。


    #### 8.1.2　万物数据化


    在影片《黑客帝国》中，主角尼奥在影片最后阶段与史密斯的对决过程中，看到身边的世界全部都是绿色的数字信号，如图8-1所示。笔者对这个场景记忆犹新，虽然现实世界并非如电影中的母体一般，所有事物都由程序构建，但是作为人工智能发展的重要基础之一，万物数据化却是实实在在逐渐向前推进着的。


    ![](OEBPS/Images/239-1.jpg)


    图8-1　影片《黑客帝国》片段


    我们知道，只要有数据，就可以训练出一个机器学习算法模型。如果世间万物都被转换成数据形态存储，那么建立在这之上的认知、理解、推断等智慧生物才能拥有的行为和意识，是否也有可能发生在所谓的人工智能身上呢？首先，我们来讨论一下万物数据化背后的意义。我们不妨从人的角度，以万物数据化的方式模拟这件事情。


    早晨上班出门，你看了看窗外的天空，晴空万里，天气特征下雨那一项的值为0，这一项对于“出门是否带伞”这个目标是强相关的，因此大概率你不会带伞。当然，之所以不是100%不带伞出门，是因为有可能同时存在相反方向的强相关事件，如“归还同事的伞”或“担忧下班回家下雨”。不管是还伞还是担心下班回家下雨，不同的人都有一个实时变化的触发概率，毕竟什么事都有可能会忘记。


    出了单元门，你的下一个动作暂时是以100%的概率持续朝前走，朝前走这个过程会持续很长一段时间。在这期间至少包含两部分数据。一部分是你本身的数据，包括如何到达目的地的路径规划数据、各种情绪值及各种定时任务的数据。例如，在九点之前在家庭群里发送早安问候，在疫情期间十点之前完成健康打卡，等等。当然这些都是以概率的形式触发的，也就是说有可能延期，不同任务在延期之后都有对应的处理规则。另一部分是实时接收的数据，包括自身出门前未注意到的衣着形体数据、当前道路数据，以及周围的各种人、事、物的数据。根据这两部分数据，你会实时调整下一刻若干动作发生的概率。例如，在走向地铁站的这段路中，在通常情况下，“沿着路径规划往前行走”这个动作的概率是最高的。此时，你的眼睛捕捉到路边有人买卖小动物的信息，CNN图像识别告诉你是在卖小猫小狗。然后你迅速匹配到自己的动物兴趣库，发现小猫的得分比较高。这时，“沿着路径规划往前行走”暂时就不是你最高概率的下一个动作了，而“驻足撸猫”这一动作的概率迅速拔高。你依据目标的位置，停留在小猫的旁边抚摸、拍照。这时，你的兴趣指数从高点缓慢降低，上班迟到指数由低点缓慢上升，“沿着路径规划往前行走”的概率也随之慢慢增大，“驻足撸猫”的概率则慢慢减小。在超过一定阈值之后，你恢复了“沿着路径规划往前行走”的动作，由于“驻足撸猫”的动作加成，此时情绪值里的开心指数也有所提高。


    进入地铁进行安检，你会触发判断“是否有背包”事件，过了安检，来到刷卡闸机口，触发最高概率的刷卡动作，如采取“手机刷卡”的动作进入地铁站等候。高峰期地铁人多，你会以一定概率忍受人潮的拥挤钻进车厢，各项情绪值并没有为此产生较大波动，那是由于你早已装载了稳定版本的北京早高峰模型。在上车后，你以一定概率拿出耳机，打开手机中的某音频App开始打发地铁时光。此时，一个临时的倒数计数任务在后台生成，即下车站数或换乘所需乘坐站数。


    在到站后，临时任务触发下车动作。你走出地铁站朝公司大楼走去，一路上无突发事件，你以高概率“沿着路径规划往前行走”的动作来到公司，开启了新一天的工作。


    以上就是一段简易的万物数据化的模拟过程。对于不同的数据，会有一个或多个目标事件，结合不同人本身的特征数据，每个目标事件或动作都有一个可能发生的概率，不同概率触发的事件或动作又会实时改变本身的部分特征值，进而实时改变下一步不同动作发生的概率，从而形成一连串序列行为的表现。


    由此观之，人的行为是一个极其复杂的序列建模过程，这比任何一个已知的机器学习序列行为建模都要复杂得多。难点主要有两点：第一，非结构化的数据太多，而且一直在实时发生变化，这使结构化时间维度下的万物数据化成为几乎不可能完成的任务；第二，常规的样本收集方法完全行不通，目前还不存在能将所见、所得像日志一样完整地记录下来的人脑芯片。即便最终实现了万物数据化并训练出了这样的智能模型，这个模型做的也只是按照概率不断地完成一个又一个目标，仍然没有自主意识，仍然不能去想象、去创造。


    所以，笔者理解的万物数据化，最终也只能帮助我们更加便捷地与这个世界相处，无法做到真正的智能。好比科幻电影中的智能眼镜，在戴上后看到什么事物，就能将该事物对应的详细信息传到我们的大脑，方便我们利用这些数据进行思考、想象，然后做出反应。


    ### 8.2　展望


    #### 8.2.1　人工智能最终能做什么


    在未来，人工智能无论发展到何种程度，都一定是以服务人类为宗旨的存在。那么人工智能最终能做什么？既然是以服务人类为宗旨的，不妨换一个角度思考这个问题，想想人类需要什么。


    人类需要安全感。对于任何其他方面的需求，其前提条件都是安全。人工智能可以承担人类从事的不安全工作，如消防、矿采等高危工作。


    人类需要时间。生命的长度是有限的，很多浪费时间的家务都可以交给人工智能来做，如做饭、洗碗、洗衣、清扫房屋等。


    人类需要享受。在这方面，如今的人工智能已经做得比较好了，如可穿戴设备、虚拟现实、增强现实等相关娱乐设施、电子游戏等。所谓科技造福人类社会，人工智能的终极奥义莫过于此。


    #### 8.2.2　人类最终能做什么


    人类最终能做什么？同样地，我们也可以换一个角度思考这个问题，想想人工智能做不了什么。


    人工智能没有感情。这是人之所以区别于机器的最大原因，也是人工智能无法代替人的根本原因。人的同情心、共情能力、亲情、爱情、友情等将一代一代传递下去。


    人工智能无法代替人类运动。所谓“流水不腐，户枢不蠹”，生命在于运动，运动是生物的本能，而且运动能让身体保持健康的状态，也只有健康的身体状态，才能驾驭更先进的人工智能。


    ### 8.3　本章小结


    本章对AI算法的未来展开了思考和展望，阐述了人工智能发展的三个重要基础。一方面，笔者对人工智能充满了希望，相信人工智能会在更多领域普及和服务人类；另一方面，笔者也强调对待人工智能的理性态度，即使在未来，人工智能也并非无所不能，人类需要保持作为人类的坚定姿态。希望本章讨论的内容，能激发读者对算法与人工智能更深层次的理解。谢谢大家的阅读，再见！


