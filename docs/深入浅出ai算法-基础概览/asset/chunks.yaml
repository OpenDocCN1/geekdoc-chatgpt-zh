- raw: '还是以电影院选座位为例。小王、小李和小张一起去看电影，小王是小李的朋友，有小李的联系方式，小李是小张的朋友，有小张的联系方式。到了电影院发现最近一场电影的放映时间已经没有连号的三个座位了，于是三人买了分开的座位。这种入座方式就是链表（List）的存储方式，不要求数据存储的连续性，有位置即可。在电影放映过程中，小王接到老板发来的紧急消息，需要他立刻返回公司。于是，小王将先行离开的消息通知了小李，小李又将该消息通知了小张，这种消息传递的方式就是链表的数据访问方式，即链式访问，小王只能联系小李，不能联系小张，只能由小李联系小张。


    根据上述例子我们了解到，链表是一种链式存储结构，其中的数据元素在存储时不要求相邻、连续，当添加新的数据元素时，只需开辟任意一个新的存储空间，然后将链表末尾元素的指针指向这个新元素的位置。这样既可以避免出现元素频繁移动的问题，又可以非常快速地查询。链表和数组一样，支持多维结构（多维链表）。不仅如此，链表还支持双向查询（双向链表）。单链表的存储结构图例如图3-2所示。


    ![](OEBPS/Images/058-1.jpg)


    图3-2　单链表的存储结构图例


    任何事情都有得有失。链表虽然在元素插入方面占据优势，但不能随意读取任意位置的元素值。由于链表的前后节点相连，因此当需要读取某个编号的元素值时，必须从第一个元素开始访问，向后依次查询，直到找到该编号的元素值为止。而数组由于是连续的存储空间，通过下标即可快速获取当前编号的元素值。例如，进行随机取数，数组的效率比链表的效率要高很多。


    概括数组和链表的优缺点：数组的查询效率高、扩展效率低，链表的查询效率低、扩展效率高。


    #### 3.1.2　队列和栈


    队列和栈，与数组、链表一样都是顺序存储的数据结构。除数据存储的功能外，队列和栈分别提供了不同的数据检索能力，用于满足不同场景的需求。


    1\. 队列


    队列（Queue）的数据插入特点是先进先出（First In First Out，FIFO）。FIFO在计算机的很多方面都有应用，如计算机内存页的替换策略、网络路由器的流量分配策略等。直观地理解，队列的例子就是生活中的各种排队。例如，在火车站出站后打出租车需要排队，按先来后到的顺序依次上车；在食堂窗口前排队，讲究的也是先来后到。


    因此，我们可以将队列理解为提供FIFO功能的一维数据存储结构，既支持向尾部（队尾）加入数据元素，又支持移出头部（队首）的数据元素。


    2\. 栈


    理解了队列，栈（Stack）就比较好理解了。栈的数据插入特点是后进先出（Last In First Out，LIFO）。栈的特性在计算机中有着广泛的应用，可以说程序员无时无刻不在和LIFO打交道。一个最典型的例子就是程序中的函数调用。除此之外，在满足递归定义的问题中，栈的运用也比较多。


    因此，我们可以理解栈为提供LIFO功能的一维数据存储结构，既支持向头部（栈顶）加入数据元素，又支持移出头部（栈顶）的数据元素。


    #### 3.1.3　树


    掌握了链表，树（Tree）这种结构就很好理解了。在讨论数据结构与算法时，经常可以听到二叉树、三叉树、多叉树，下面我们通过一个例子直观地了解一下，数据结构中的树是什么样子的。


    一个深入敌后潜伏的情报组织，每级情报员都分配了若干名下级情报员，相邻两级情报员分别叫作彼此的上线和下线。为了防止下线在暴露之后对整个组织造成威胁，上线和下线之间是单向通信的，上线能联系下线，下线无法联系上线，并且信息通路不形成环路（如我下线的下线不会是我的上线）。如果每级情报员的下线固定最多有2名情报员，那么这种情报结构就是二叉树结构；如果固定最多有3名情报员，那么这种情报结构就是三叉树结构；以此类推。不仅结构相似，情报组织的信息传递方式也和树的数据访问顺序类似，只能从顶部（根部）往底部传递。


    不管几叉树，每个节点都以链表的形式指向若干个新节点，并且树中的节点不会形成环状连接。以最常见的二叉树为例，从根节点开始，每个节点都可以指向另外两个新节点，为了方便理解，这个节点称为父节点，指向的两个新节点称为左孩子节点和右孩子节点。二叉树的存储结构图例如图3-3所示。


    ![](OEBPS/Images/060-1.jpg)


    图3-3　二叉树的存储结构图例


    既然是树，就会有高度。从根节点开始向下累积的层数就是树的高度，如图3-3中的二叉树的高度为3。二叉树之所以被广泛应用，是因为它最简单，又最具有代表性。二叉树的种类有很多，如完全二叉树、满二叉树、平衡二叉树、霍夫曼树、B树等。不同种类的二叉树具有不同的性质、不同的应用场景，感兴趣的读者可以自行深入了解。二叉树不像链表的顺序遍历那么简单，因为每个节点最多有两个孩子节点，所以遍历方法有4种：前序遍历、中序遍历、后序遍历和层序遍历。前序遍历的口诀是“中左右”，即先遍历当前父节点，再遍历左孩子节点，最后遍历右孩子节点；相应地，中序遍历的口诀是“左中右”，后序遍历的口诀是“左右中”，遍历顺序以此类推。层序遍历稍微有所区别，它会逐层按从左至右的顺序遍历所有节点。下面来看一个例子，分别用4种遍历方法遍历图3-4所示的二叉树。


    ![](OEBPS/Images/061-1.jpg)


    图3-4　二叉树的遍历


    前序遍历：1→2→4→5→3→6→7。


    中序遍历：4→2→5→1→6→3→7。


    后序遍历：4→5→2→6→7→3→1。


    层序遍历：1→2→3→4→5→6→7。


    这里特别提一句，多棵树放在一起称为森林（Forest），森林的概念在后面的算法中也会用到。此外，前文特别提到树这种数据结构不能形成环状，如果形成环状，那么会是什么结构？没错，正是下一节要讲的图。


    #### 3.1.4　图


    图（Graph）是一种包含节点和表达节点之间关系的边的一种数据结构。前面讲到的链表和树，其实都是图的特殊情况，链表只能向一个方向进行链接，树的节点之间不允许形成环。图结构没有这些限制，图中节点之间的连接称为边。图可以分为两种，分别为有向图和无向图。顾名思义，有向图就是边带方向的图，如图3-5（a）所示；无向图就是边不带方向的图，如图3-5（b）所示。可以将无向图看作每条边都有两个方向的有向图。


    ![](OEBPS/Images/062-1.jpg)


    图3-5　有向图和无向图


    图的边除了可以表示连接关系和连接方向，还可以附带权重等信息，从而进一步表示节点之间的某种关系。例如，以城市为节点，可以将城市之间的距离作为连接这些节点的边的权重。


    图是一种非常实用的数据结构，在工作、生活的方方面面都能用到它。例如，如果将每个人作为节点，将人与人之间的关系作为边，可以构成一个大小为70多亿节点的社交网络图。著名的小世界现象，你和任何陌生人之间所间隔的人数不会超过6个，就是基于社交网络图得出的猜想。在计算机世界中，图经常用于描述任务的状态转换和调度关系。例如，节点代表待执行的任务，边代表任务相关性或依赖顺序。


    图的存储方式有两种，一种是以链表形式存储，每个节点及其相邻节点都用一个链表表示，这种存储方式称为邻接链表；另一种是以数组形式存储，用一维数组记录所有节点，用一个二维数组记录所有边，这种存储方式称为邻接矩阵。邻接链表和邻接矩阵的优劣对比与链表和数组之间的对比类似，邻接链表使用的是链表，邻接矩阵使用的是二维数组。以图3-5中的有向图为例，邻接链表和邻接矩阵的具体存储形式如图3-6所示。


    ![](OEBPS/Images/063-1.jpg)


    图3-6　邻接链表和邻接矩阵的具体存储形式


    #### 3.1.5　散列表


    散列表（Hash Table）又称为哈希表。在讲解散列表之前，我们先从一个实际问题出发：如何在全国范围内较快速地根据姓名查询对应的身份证号码？如果使用数组或链表存储身份证信息，则需要从头到尾查询一遍才能保证找到所查姓名的身份证号码，时间复杂度都是O(N)；如果使用二叉排序树存储身份证信息，时间复杂度也只能提高到O(log2N)，通常默认对数底为2，可简写为O(logN)。


    这里补充说明一下什么是时间复杂度。O(N)和O(logN)都是描述算法复杂度的符号，算法复杂度主要包含两个方面：空间复杂度和时间复杂度。其中，空间复杂度定性地描述了一个算法运行所需内存空间的数量级，时间复杂度定性地描述了一个算法运行所需时间的数量级。在通常情况下，我们优先考虑算法的时间复杂度。在时间复杂度中，O(N)表示当数据量为N时，计算机需要执行的基本运算次数的数量级为线性级别；O(logN)表示当数据量为N时，计算机需要执行的基本运算次数数量级为对数级别。除了O(N)和O(logN)，还有O(NlogN)、O(N2)、O(N3)等，含义以此类推。O(logN)的时间复杂度比O(N)的时间复杂度低，表示O(logN)的算法比O(N)的算法更合适。例如，当N为1024时，logN只有10。


    O(logN)的时间复杂度已经足够低了，但是散列表的时间复杂度能更低。散列表可以将查询身份证号码的时间复杂度降到O(1)，即常数级别。散列表用到的关键技术是函数值映射，利用散列函数，将key值（姓名字符串）映射到一个有限的数值空间内。例如，一个长度为10亿的数组，如果使用恰当的散列函数，那么映射后的值会均匀分布到这个数组中。在查询时，计算被查询姓名的散列值，即可直接取出数组中对应下标的身份证号码。这里你可能会问，姓名有重复怎么办？没关系，这个问题在散列表中经常出现，这种现象称为键值冲突。键值冲突问题的解决方法比较简单，在遇到重复key值时，只需在对应的散列值后面增加一个链表，用于存储重复key值。


    散列表的冲突存储方式与邻接链表的存储方式类似，重复的key值会被存储于同一个散列值生成的链表中。当然，散列函数直接影响到了键值冲突问题的大小，一个映射不均匀的散列函数有可能导致严重的链表倾斜，即大量数据被映射到同一个键值，导致对这些键值的访问退化成顺序遍历，降低检索效率。针对这个问题，一方面可以选取合适的散列函数；另一方面，在发生键值冲突后，可以采取二次散列法和设计公共溢出区等措施。


    ### 3.2　基础算法


    算法是针对一类数学问题制订的完整而准确的解决方案，代表用系统的方法描述解决问题的策略机制。也就是说，对于符合一定要求的输入，算法必须在有限时间内获得相应的输出。不同的算法能用不同的时间效率、空间效率来完成相同的任务，它们的性能可以用时间复杂度与空间复杂度![空间复杂度是对一个算法在运行过程中临时占用存储空间大小的度量。时间复杂度和空间复杂度统称为算法复杂度。](OEBPS/Images/note.png)衡量。算法作为数据结构的产物，它的实现离不开数据结构的支持。


    基于数组、链表、树和图的算法有很多，下面介绍几种常用且有趣的算法，帮助大家开启AI算法的思维之门。


    #### 3.2.1　排序


    基础算法中最常用的算法，非排序莫属。现实生活中存在不少排序的例子。例如，人群按照身高站队需要排序，考试分数需要排序，整理卷子编号需要排序，等等。那么常用的排序算法有哪些，它们分别如何实现？


    排序算法的种类很多，按照时间复杂度划分，从慢到快主要有以下9种排序算法。


    O(N2)：选择排序、插入排序、冒泡排序。


    O(NlogN)：快速排序、堆排序、归并排序。


    O(N)：计数排序、桶排序、基数排序。


    1\. 选择排序


    选择排序（Selection Sort）的基本思路是每次选出剩余序列中的最值按先后顺序排列。如果要求按从小到大的顺序排序（升序排序），则每次选择最小值来组成新的序列；如果要求按从大到小的顺序排序（降序排序），则每次选择最大值来组成新的序列。


    对于一个长度为N的待排序列，算法在执行第1轮排序时，会从N个元素中选出最值，需要执行N\-1次比较运算；算法在执行第2轮排序时，会从剩下的N\-1个元素中选出最值，需要执行N\-2次比较运算；以此类推，序列剩下的最后两个元素需要执行1次比较运算。这样总的比较次数是


    ![](OEBPS/Images/066-1.jpg)


    算法复杂度的衡量是看最高数量级，此处为二次方项，在不影响当前数量级的情况下，将常数项系数省略，所以选择排序的时间复杂度是O(N2)。


    以升序排序为例，选择排序的执行过程如图3-7所示。


    ![](OEBPS/Images/066-2.jpg)


    图3-7　选择排序的执行过程


    2\. 插入排序


    插入排序（Insertion Sort）的基本思路是依次取出序列中的每个元素并将其插入一个有序序列。


    对于一个长度为N的待排序列，初始有序序列为空，算法在执行第1轮排序时，会取一个元素插入空的有序序列，需要执行0次比较运算；算法在执行第2轮排序时，会取一个元素插入长度为1的有序序列，需要执行1次比较运算；以此类推，算法在执行第N轮排序时，会取一个元素插入长度为N\-1的有序序列，需要执行N\-1次比较运算。这样总的比较次数是


    ![](OEBPS/Images/067-1.jpg)


    因此插入排序的时间复杂度和选择排序的时间复杂度相同，也是O(N2)。


    以升序排序为例，插入排序的执行过程如图3-8所示。


    ![](OEBPS/Images/067-2.jpg)


    图3-8　插入排序的执行过程


    3\. 冒泡排序


    顾名思义，冒泡排序（Bubble Sort）的基本思路是循环比较相邻的元素值，将最值像水里的气泡冒上水面一样选出来。与选择排序和插入排序相比，冒泡排序不需要额外的序列存储空间，在算法执行完成后，原序列即可变成有序序列。


    对于一个长度为N的待排序列，以升序排序为例，每一轮排序都会从原序列的最后一个元素开始。算法在执行第1轮排序时，会从后向前依次比较相邻两个元素值，如果前面的元素值大于后面的元素值，就交换两个元素的位置，直到第一个元素，需要执行N\-1次比较运算；算法在执行第2轮排序时，会从后向前依次比较相邻两个元素值，直到第二个元素，需要执行N\-2次比较运算；以此类推，最后一轮比较为首的两个元素值，需要执行1次比较运算。这样，总的比较次数也是


    ![](OEBPS/Images/068-1.jpg)


    因此冒泡排序的时间复杂度也是O(N2)。


    以升序排序为例，冒泡排序的执行过程如图3-9所示。


    ![](OEBPS/Images/068-2.jpg)


    图3-9　冒泡排序的执行过程


    4\. 快速排序


    快速排序（Quick Sort）简称快排，是程序员面试时考官最常考查的排序算法之一，它的基本思路是每次确定待排序列中一个元素的最终排序位置。


    对于一个长度为N的待排序列，以升序排序为例，算法在执行第1轮排序时，当前序列为原序列，从原序列中选出第一个元素，两个指针分别从序列两端向中间遍历，比较所选元素与指针遍历元素的大小，通过交换位置，确保所选元素的最终位置，并且将当前序列一分为二，分为左序列和右序列（左序列中的元素值都不大于所选元素值，右序列中的元素值都不小于所选元素值）；算法在执行第2轮排序时，当前序列为原序列的左序列，具体操作同前一步；算法在执行第3轮排序时，当前序列为原序列的右序列，具体操作同前一步；以此递推，直到找到所有元素的最终位置，快速排序结束。快速排序由于采用折半操作，因此时间复杂度为O(NlogN)。


    以升序排序为例，快速排序第1轮排序的执行过程如图3-10所示。


    ![](OEBPS/Images/069-1.jpg)


    图3-10　快速排序第1轮排序的执行过程


    需要特别注意的是，如果原序列本身就是有序序列，那么折半操作会退化成线性操作，时间复杂度也会变为O(N2)。快速排序之所以快，是因为它让每轮所选元素的最终位置尽量靠近序列中央，这样就起到了折半的作用。所以，快速排序的关键在于如何随机选择元素，让所选元素在数学期望下靠近中间位置。因此，在每一轮排序开始时，只需加上一个随机函数，随机从当前序列中选择一个元素与待排元素事先交换，这样的快速排序又称为随机快速排序。


    5\. 堆排序


    堆排序（Heap Sort）的基本思路是先将序列构建成一个最大二叉堆或最小二叉堆。二叉堆是二叉树的一种。最大二叉堆是指每个节点的元素值都比其左、右孩子节点的元素值要大的二叉堆，最小二叉堆是指每个节点的元素值都比其左、右孩子节点的元素值要小的二叉堆。


    算法在执行时，每次从二叉堆中移出堆顶元素，并且将末尾元素移至堆顶，然后调整二叉堆结构，维持最大二叉堆或最小二叉堆的结构特点。如果构建的是最大二叉堆，那么得到的是降序序列；如果构建的是最小二叉堆，那么得到的是升序序列。由于二叉堆是二叉树的一种，维持最大二叉堆或最小二叉堆的结构特点是一个二分查找的过程，因此堆排序的时间复杂度和快速排序的时间复杂度一样，也是O(NlogN)。


    以升序排序为例，堆排序第1轮排序的执行过程如图3-11所示。二叉堆各节点的元素值可以使用数组存储，数组下标从1开始，假设父节点的下标为i，那么左、右孩子节点的下标分别为2i、2i+1。


    ![](OEBPS/Images/070-1.jpg)


    图3-11　堆排序第1轮排序的执行过程


    6\. 归并排序


    归并排序（Merge Sort）采用递归与分治的思想（在3.2.2节会详细详解），先保证局部有序，再保证整体有序，从局部到整体可以看作一个归纳合并的过程，这也是该排序算法名字的由来。


    对于一个长度为N的待排序列，以升序排序为例，算法在执行第1轮排序时，原序列中的每个元素都可以看作一个局部有序序列，将相邻的两个局部有序序列合并成一个长度为2的局部有序序列，局部最大比较次数为1；算法在执行第2轮排序时，合并相邻的两个长度为2的局部有序序列，得到长度为4的局部有序序列，局部最大比较次数为3；以此类推，直到原序列有序。由此可见，归并排序总的执行轮次是logN，因此其时间复杂度为O(NlogN)。


    以升序排序为例，归并排序的执行过程如图3-12所示。


    ![](OEBPS/Images/071-1.jpg)


    图3-12　归并排序的执行过程


    7\. 计数排序


    计数排序（Count Sort）是一种用更多存储空间交换更高时间效率的排序算法，这种排序算法无须做任何比较操作，只需创建一个count数组，这个数组的长度大于待排序列中元素值的极差（最大元素值与最小元素值的差）。


    对于一个长度为N的待排序列，值域为\[0, K\-1\]，初始化一个长度为K、各个位置上元素值均为0的数组，依次遍历待排序列，将count数组中以当前元素值为下标的位置加1，排序完成。如果要进行升序排序，那么按照下标从小到大的顺序遍历数组，遇到几就输出几个当前位置的下标值，直到遍历结束；如果要进行降序序列，那么按照下标从大到小的顺序遍历数组，遇到几就输出几个当前位置的下标值，直到遍历结束。计数排序只涉及线性操作，时间复杂度为O(N+K)。很明显，在存储空间有限的情况下，计数排序对取值范围较小的待排序列有比较明显的速度优势。


    以升序排序为例，计数排序的执行过程如图3-13所示。


    ![](OEBPS/Images/072-1.jpg)


    图3-13　计数排序的执行过程


