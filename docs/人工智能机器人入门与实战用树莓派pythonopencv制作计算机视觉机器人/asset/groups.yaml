    # 5.3 用 OpenCV 识别颜色


    使用 OpenCV 调取图像的信息只是我们分析图像的第一步，OpenCV 的强大之处在于它可以通过一些预置函数方便地处理这些信息。机器视觉技术识别物体首先需要确定物体的位置，勾勒出其轮廓，而区分物体与背景的关键在于颜色的分界。因此，学会识别特定颜色的物体是我们运用
    OpenCV 工具认识图像的第一步。


    # 5.3.1 HSV 颜色空间


    OpenCV 读取的图像信息在每一像素上都由 B、G、R 的颜色值排列而成，但事实上用这 3 个颜色值来区分颜色并不像想象中那么简单：同一物体的三原色值在环境光照变化的情况下将发生很大的变化，使用一定的颜色区间来锁定特定物体几乎是不可能完成的任务。


    为了解决这一问题，我们可以使用另一种描述颜色的方式：HSV 颜色空间。


    相比直接用三原色值来表述颜色，使用颜色的另外一些属性来描述它们更符合人眼对颜色的认知。这些属性包括颜色的色相（Hue）、饱和度（Saturation）、亮度（Value）。使用这
    3 种颜色属性描绘颜色的方法于 1978 年由计算机科学家 Alvy Ray Smith 提出，这些值可以用三原色值经过简单的数学转换得到。


    色相（H）是颜色的基本属性。我们可以将三原色红、绿、蓝置于一个圆盘的 0°、120° 和 240° 位置，然后将其他颜色插入排列。


    饱和度（S）代表颜色的纯度或“鲜艳程度”。颜色的饱和度越高，则色彩越“纯正”。


    亮度（V）代表颜色的明亮程度。亮度越大则颜色越亮，否则越暗。


    图 5.13 所示为 HSV 颜色空间的图示，这种描绘颜色的方式相对三原色更接近人的视觉感受，H、S、V 三种颜色值的变化可以被人类眼敏锐地感受到。通常，色相（H）的取值范围为
    0~360，而饱和度（S）与亮度（V）被划为 100 份，取值范围为 0~100。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_63_0.png)


    图 5.13 HSV 颜色空间的图示


