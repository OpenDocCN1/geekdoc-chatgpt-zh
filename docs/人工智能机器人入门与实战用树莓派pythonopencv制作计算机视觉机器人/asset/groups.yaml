    \ not，可以得到与条件真假相反的结果。等同于对条件加上了“不”字。\n\n上面程序的功能实质上是：按钮 1 被按下并且按钮 2 被按下时点亮小灯，否则熄灭小灯。所以可以利用逻辑运算符编写以下程序。\n\
    \n```\n```\nif gpio.input(b1) == gpio.HIGH and gpio.input(b2) == gpio.HIGH:\n\
    \    gpio.output(R, gpio.LOW)\nelse:\n    gpio.output(R, gpio.HIGH)\n```\n```\n\
    \n试一试\n用至少两种方法实现两个按钮按下一个则点亮小灯，都不按则熄灭小灯。\n\n# 4.5 做一个抢答器吧\n\n现在我们来尝试做一个抢答器：两人各执一个按钮，小灯在程序开始后一段时间内亮起，由程序判断小灯亮起后谁先按下按钮。\n\
    \n# 4.5.1 延迟点亮小灯\n\n在程序开始一段时间后再点亮小灯的功能可以用 sleep 函数来实现。例如我们让程序开始 3 秒后点亮小灯发出白光（3\
    \ 个灯珠全部点亮）：\n\n```\n```\nimport RPi.GPIO as gpio\nfrom time import sleep\nR, B,\
    \ G = 11, 13, 15\ngpio.setmode(gpio.BOARD)\ngpio.setup(R, gpio.OUT)\ngpio.setup(B,\
    \ gpio.OUT)\ngpio.setup(G, gpio.OUT)\n```\n```"
  md: "\n在设定返回值的情况下，调用函数将直接得到其返回值。例如使用 factorial(5) 将直接获得 5 的阶乘值，我们可以利用它对变量进行赋值，例如：\n\
    \n```\nresult = factorial(5)\n```\n\n这一语句可以将 5 的阶乘赋值给变量 result。\n\n试一试\n将斐波那契数列的运算封装为一个函数，通过调用这个函数获取数列中指定位置的值。\n\
    \n## 3.7.2 给 Python 程序加上注释\n\n为了使 Python 程序变得更加易读，我们可以为程序中的语句、定义的函数、变量等进行注释来帮助阅读者理解程序的作用。在\
    \ Python 程序中，以 #（井号）开头的语句将被 Python 认为注释，这些内容将不会被执行。例如：\n\n```\n# calculate the\
    \ factorial of a positive integer\ndef factorial(n):\n    a, f = 1, 1\n    while\
    \ a <= n:\n        f = f * a\n        a = a + 1\n    return f\n# get the factorial\
    \ of 5\nresult = factorial(5)\n```\n\n如果需要进行连续多行的注释，可以在需要注释的语句前后各使用 3 个单引号或 3\
    \ 个双引号（前后必须一致）。例如：\n\n```\n'''\nthis is a program to calculate the factorial of\
    \ a positive integer\nwe get factorial of 5\n'''\ndef factorial(n):\n    a , f\
    \ = 1, 1\n    while a <= n:\n        f = f * a\n        a = a + 1\n    return\
    \ f\nresult = factorial(5)\n```\n\n给程序加上清晰的注释是一个良好的编写习惯，使我们在程序内容复杂时只需阅读注释就可以大致掌握程序的结构和功能。\n\
    \n除了说明程序功能外，注释也可以用来跳过一些语句的执行，这是调试程序的一种常用技巧。\n\n## 本章要点回顾\n\nPython 编程基础\n\n什么是编程语言\n\
    \n说说为什么计算机是由 1 和 0 来控制的\n\n说说编程语言和人类的自然语言的异同\n\n认识 Python 语言\n\n说说 Python 编程语言有什么优势\n\
