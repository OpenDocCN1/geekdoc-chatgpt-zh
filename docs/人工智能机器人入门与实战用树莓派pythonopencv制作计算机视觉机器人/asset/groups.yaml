    # 7.1 人脸识别知多少


    我们人类似乎天生就具备一种技能：一张人脸只要看过几次，再次见到时就能轻松认出来。这种快速区分不同同类个体长相的能力可以说是一种生物本能。研究表明，出生1~3天的


    自20世纪60年代开始，研究者开始使用超级计算机研究如何用机器识别人脸。这项研究很快就获得了有效的成果。


    随着算法的进一步发展，到21世纪初，人工智能系统可以相对轻量、快速地识别人脸，进而推动了这项技术在社会上的实际应用。其早期的典型应用是在智能相机中，利用人脸检测实现人像模式辅助自动对焦，而近年来随着特定人脸识别精度与识别速度的提升，面部解锁成为了智能手机的一种新的解锁方式。


    在公共安全领域，人脸识别目前被大范围应用于学校、公司等半公共区域的门禁系统。


    我们人类要识别一张人脸，首先要从眼前的视觉图像中找到人脸，然后分析脸上的特征（如眼睛、鼻子、嘴巴的形状等），最后与大脑中已知的人脸特征进行比较，最终锁定面前的这个人是谁（见图7.1）。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_103_0.png)


    这个过程归根结底是一种生物本能，我们几乎很难意识到识别过程中的每一个步骤的存在。但要让人工智能模仿人类对人脸进行识别，必须借助机器视觉技术对每一步进行模拟。与人类相似，人工智能也需要在图像信息中找到人脸的位置，再分析出其中的特征，最终与数据库中存储的已知人脸特征进行比较，确定这个人是谁（见图7.2）。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_103_1.png)


    在前面的课程中我们曾学习过，人工智能可以依靠电子感光单元存储光线信息，以电子感光单元为核心的动态图像采集系统便是摄像头。在本例中，我们仍然使用树莓派摄像头承担图像采集的功能。


    在采集到图像后，人脸识别的下一步流程便是检测出图像中的人脸位置。其通常的分析过程是利用图像的某一种或多种数学特征区分出图像中的人脸区域，从而获得人脸在图像中的位置和大小。进行人脸检测的方法有很多，常见的方法有肤色检测、直方图（HOG）检测、'
  - "[PAGE 104]\n\n哈尔（HAAR）特征检测等。\n\n但是要区分特定的人脸，这些方法还不够。\n\n我们的大脑事实上用到了一些难以主观描述的方式完成了识别过程。大脑的识别能力是与生俱来的，并会随着人的成长逐渐变强。实际上，人工智能系统同样可以通过对既有事实的分析和学习掌握新的技能，这被称为机器学习。在人脸识别的例子中，机器学习是一种有效的方法。\n\
    \n# 7.2 使用肤色检测找到人脸\n\n在检测人脸的多种方法中，最直接、简单的方法是通过肤色识别确定人脸的位置，这种方法被称为肤色检测。在此之前的课程中，我们学习了使用\
    \ OpenCV 工具从摄像头图像中识别出特定颜色的物体。虽然人脸并不是颜色均匀的物体，但我们也可以通过识别皮肤颜色来大致识别人脸的位置。\n\n我们采用与识别色块相同的\
    \ HSV 颜色检测法进行肤色检测。其关键在于确定皮肤的 HSV 颜色区间。图 7.3 所示为常见颜色在 HSV 颜色空间中的分布区间。\n\n| 颜色范围\
    \ | 黑色 | 灰色 | 白色 | 红色 | 橙色 | 黄色 | 绿色 | 青色 | 蓝色 | 紫色 |\n|---|---|---|---|---|---|---|---|---|---|---|\n\
    | H最小值 | 0 | 0 | 0 | 0或156 | 11 | 26 | 35 | 78 | 100 | 125 |\n| H最大值 | 180 | 180\
    \ | 180 | 10或180 | 25 | 34 | 77 | 99 | 124 | 155 |\n| S最小值 | 0 | 0 | 0 | 43 |\
    \ 43 | 43 | 43 | 43 | 43 | 43 |\n| S最大值 | 255 | 43 | 30 | 255 | 255 | 255 | 255\
    \ | 255 | 255 | 255 |\n| V最小值 | 0 | 46 | 221 | 46 | 46 | 46 | 46 | 46 | 46 | 46\
    \ |\n| V最大值 | 46 | 220 | 255 | 255 | 255 | 255 | 255 | 255 | 255 | 255 |\n\n图\
    \ 7.3 常见颜色在 HSV 颜色空间中的区间\n\n不同人种的肤色值通常有一定区别，东亚人脸的颜色大致处于红色至橙色之间，其H(色调)值的参考范围为0~17，S(饱和度)值的参考范围为43~255，而V(明亮度)值的参考范围为46~255。\n\
    \n与颜色识别程序类似，我们可以设定需要识别的 HSV 颜色区间，并生成二值化黑白图像进行预览。\n\n```\nimport cv2\ncap = cv2.VideoCapture(0)\
    \ # 开始读取摄像头信号\nwhile cap.isOpened(): # 当读取到信号时\n    (ret, frame) = cap.read()\
    \ # 读取每一帧视频图像为 frame\n    hsv = cv2.cvtColor(frame, cv2.COLOR_BGR2HSV) # 将颜色空间转换\
    \ 为 HSV\n    skin_lower = (0, 43, 46) # 指定皮肤颜色的下限\n    skin_upper = (17, 255,\
    \ 255) # 指定皮肤颜色的上限\n```"
