    # 3.4 Python 中的变量


    在前面关于编程语言的学习中，我们知道，计算机是通过大量 1 和 0 的排列来存储信息的。电子计算机将要描述的一切事物都存储为 1 和 0 组合而成的 数据。因此，任何程序实质上都是以特定的方式对计算机中的数据进行操作，数据是程序的核心要素。


    为了方便对各种不同的数据进行分析和处理，我们可以在程序中建立变量来存储这些数据。变量通常具备一个独立的名称，其存储的数据就是变量的值。


    举例来说，A 班按星期一至星期五分为 5 个值日小组轮流值日，每个值日小组由几个学生组成。每次轮到某个小组时按照一定规则由其中一个学生负责这一次的值日。如果将每一次负责值日的同学视为数据，值日小组就是我们建立的变量。班主任在要求学生进行值日时，只需要说由哪个小组值日即可，具体由小组内的谁来负责即是变量的值。


    # 3.4.1 变量的赋值


