    \ # 当读取到信号时\n    (ret, frame) = cap.read() # 读取每一帧视频图像为 frame\n    frame = cv2.flip(frame,\
    \ 0) # 将图像上下翻转\n    cv2.imshow('test', frame) # 显示读取到的图像\n    cv2.waitKey(5) #\
    \ 每帧等待 5 毫秒\n```\n\n现在，只需要使用哈尔特征检测到人脸在图像中的位置，再指示舵机运动，进行追踪即可。由于一次只能追踪一张人脸，我们可以在\
    \ detectMultiScale 函数中使用 cv2.CASCADE_FIND_BIGGEST_OBJECT（寻找最大的人脸位置）作为 flags 参数的值。\n\
    \n### 试一试\n\n尝试移动人脸，观察程序输出的中心坐标的变化。\n\n```\nfaces = face_cascade.detectMultiScale(gray,\
    \ minSize=(100, 100),\nflags=cv2.CASCADE_FIND_BIGGEST_OBJECT)\nfor (left, top,\
    \ width, height) in faces:\n    x0 = left + width / 2\n    y0 = top + height /\
    \ 2\n    print(\"中心坐标：\", (x0, y0))\n```\n\n该程序段中，faces 虽然仍是一个元组，但由于只有一张人脸，其长度始终为\
    \ 1，因此 for 循环至多只会遍历一次。循环中，通过左上角坐标和宽、高，即可计算出人脸所在位置的中心坐标。当摄像头正对人脸时，人脸位置的中心坐标应该在整个图像的正中，即\
    \ (320, 240) 位置。\n\n要实现对人脸的实时追踪，只需要让图像中的人脸始终趋于图像正中心即可，即始终让人脸中心坐标（x0, y0）向（320,\
    \ 240）靠近。\n\n当图像中人脸中心x坐标大于320时，说明人脸在图像中的右侧，云台应向左转；反之云台应向右转（注意，我们的摄像头是倒置安装的，flip函数只将图像的上下翻转了过来，左右还是反的）。当图像中人脸中心y坐标大于240时，说明人在图像中的下方，云台应向下转；反之云台应向上转。控制舵机转向的方式和控制机械臂找物体位置的方式类似，需根据人脸的实时坐标对两个舵机的PWM值进行增减。\n\
    \n若用pwm1和pwm2分别表示两个舵机的PWM值，则可以这样编写程序：\n\n```\nif x0 > 320:\n    pwm1 += 10\nelif\
    \ x0 < 320:\n    pwm1 -= 10\nif y0 > 240:\n    pwm2 += 10\nelif y0 < 240:\n  \
    \  pwm2 -= 10\n```\n\n但每次都调整一个固定值，效果并不理想；若调整值取值太大，容易在中心附近发生剧烈的晃动；若调整值取值太小，当人脸远离中心时，调整速度又太慢。\n\
    \n为了解决这一问题，一个较简单的方法是让每次的调整值与实际坐标偏离中心的幅度成正比。\n\n```\nif x0 > 320:\n    pwm1 +=\
    \ (x0 - 320) / 6\nelif x0 < 320:\n    pwm1 -= (320 - x0) / 6\nif y0 > 240:\n \
    \   pwm2 += (y0 - 240) / 6\nelif y0 < 240:\n    pwm2 -= (240 - y0) / 6\n```\n\n\
    这里，我们让调整值与偏离幅度相关且比值为6。该值仅供参考，应该根据实际情况进行调整，最终使云台能够快速地追踪目标，并且尽量减少在中心附近的晃动。为了避免云台的小幅晃动现象，我们可以划定（320,\
    \ 240）附近的一个小范围均为“中心”，只要目标处于这一区间，云台就不响应。例如：\n\n```\nif x0 > 330:\n    pwm1 += (x0\
    \ - 320) / 6\nelif x0 < 310:\n    pwm1 -= (320 - x0) / 6\nif y0 > 250:\n    pwm2\
    \ += (y0 - 240) / 6\nelif y0 < 230:\n    pwm2 -= (240 - y0) / 6\n```\n\n至此，我们已经将哈尔特征检测人脸坐标与舵机运动的控制关联起来了，在完整的程序中，应在图像处理的循环中加入调整舵机位置的语句。\n"
