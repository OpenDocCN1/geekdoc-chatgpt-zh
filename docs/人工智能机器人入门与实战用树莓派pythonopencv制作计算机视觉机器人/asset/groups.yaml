    \n# 5.4.3 for 循环遍历结构\n\n按照这样的方式，我们可以得到一个存储着过往每一帧物体中心坐标的列表。接下来只需要在这个列表中的每一个坐标上都画上一个小圆点即可。\n\
    \n要实现这一操作，可以使用 for 循环遍历结构。与 while 循环类似，for 循环结构也是一个循环型结构，但它主要用于对列表、元组等元素进行遍历。for\
    \ 循环结构的写法如下：\n\n```\nfor 变量 in 列表或元组等：\n    循环内执行的语句\n```\n\n这里，我们需要设定一个变量，在每一次循环中依次用列表或元组中的元素对它赋值，再执行循环中的语句。内部的执行语句须进行循环。for\
    \ 循环遍历的执行逻辑如图 5.18 所示。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_69_0.png)\n\
    \n图 5.18 for 循环遍历结构的逻辑流程"
  - "[PAGE 70]\n\nfor 循环遍历的对象也可以不是列表或元组，而是一个字符串或是数值范围。\n\n```\nfor char in \"Hello\
    \ World\":\n    print(char)\n```\n\n该程序段可以从左至右按顺序打印出字符串中的每一个单个的字符。\n\n```\nfor\
    \ i in range(0, 100):\n    print(i)\n```\n\n此段程序可以从 0 开始以 1 递增，打印到 99 为止。注意这里的\
    \ range( 范围起点，范围终点 ) 设定了遍历的数值范围，实际遍历的区间包括起点，但不包括终点。\n\n回到绘制列表中小圆点的例子中，该程序也可以用\
