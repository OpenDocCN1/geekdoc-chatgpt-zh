    或者不是猫，给它一个模型让它自己去学习、分析，自主形成“猫”的概念。经过一定量的训练后，再给它一张图，它就可以判断图中到底是不是猫了。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_118_0.png)


    图 7.19 各种可能的猫的照片


    # 7.5.2 机器学习的分类


    在机器学习领域，有几种主要的学习方式：监督学习 (supervised learning)、无监督学习 (unsupervised learing)、半监督学习（semi-supervised
    learning）、强化学习 (reinforcement learning) 等。


    监督学习是指给定有对应关系输入、输出数据，让人工智能算法找出两组数据之间的对应关系。例如在猫狗分类问题中，我们给多张猫、狗的图片，并完全告诉人工智能系统这些图片中是猫还是狗，再令系统学习它们的分类模式，这是一种典型的监督学习。在哈尔特征检测中，我们曾提到，可以依靠计算机训练的方式找到人脸与非人脸图像的哈尔特征差异，从而实现对人脸的检测。这种训练便是机器学习中的监督学习，它需要我们提供大量事先标注好的人脸或非人脸的照片。


    无监督学习是指只提供输入数据而没有对应的输出数据，让人工智能系统自行寻找数据的关系。例如我们只给出猫、狗的图片却不告诉系统它们的分类，便是无监督学习。


    通常来说，无监督学习的难度远高于监督学习，但监督学习却需要付出更多的成本（需要人工标注大量的数据）。在实际的人工智能项目中，可以根据实际情况选择采用两种方法中的一个或是混合使用，而这种混合使用又称为“半监督学习”。例如我们既提供已知分类的猫、狗图片，又提供没有分类的图片，便是半监督学习。'
  - '[PAGE 119]


    但是在某些情况下，人们以人工智能为核心系统操控机器人解决实际的复杂问题时，往往只知道需要完成的目标，并不能直接提供输入/输出值。此时，我们可以令机器人随机地自行控制动作得到相对应的目标反馈结果。人工智能系统将判断其控制的动作与反馈结果间的关联，进而做出合理的调整，最终不断优化其动作，得到更好的结果。


    例如训练让机器人投篮入筐或是射门入网，先让它随机做动作，然后根据一定的反馈得知投篮是否进筐或射门是否入网，然后不断调整、优化动作，最终达到百发百中。


    这种机器人自主学习的方式被称为“强化学习”，它可以在自主行动的基础上，根据正负反馈的情况不断强化自身。


    # 7.6 认识人工神经网络


    借助机器学习的方法，我们可以经过训练得到人脸的哈尔特征。这些特征虽然足以区分人脸与非人脸，却难以区分不同人的脸——它们的相似性远高于人脸和其他图像的相似性。要识别特定的人脸，使用预先设定的数学方法配合机器学习已经难以完成。为解决这一问题，一个典型的方法是使用人工神经网络工具。


    人工智能机器人学习机制的本质是根据多组已知的输入值（例如不同人脸的照片）和输出值（例如它们对应的人的名字）来自行找出它们之间的对应关系，从而通过其他输入值预测出新的对应输出值。多数情况下，影响输出值的输入值都有多个，只要我们找到所有的输入值以及它们各自的权重系数，理论上我们就可以预测任意一次输入情况下对应的输出值。例如：


    输出值 = 权重1 × 输入值1 + 权重2 × 输入值2 + …… + 权重n × 输入值n


    这里，每一个输入值都按照一定的比值影响输出值，它们的影响程度表现为各自对应的权重。采用这种方式归纳的输入/输出关系被称为多元线性回归（见图7.20）。之所以称为线性，是因为在这里输入值都被直接乘以一个常数而没有采用平方、立方或是正弦、反对数等数学变换。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_119_0.png)


    图 7.20 多元线性回归示意图'
  - '[PAGE 120]


    多元线性回归的数学计算比较简单，但它往往不能用于描述绝大多数真实的问题。基于多元线性回归，计算机科学家们在 20 世纪中叶基于生物神经细胞提出了一种名为感知器的模型，它是人工神经网络的雏形。


    在介绍人工神经网络之前，我们先来简单了解一下人类的神经元（神经细胞）的结构。神经元可以简单分为细胞体、树突、轴突几部分。经过细胞体处理的神经信号经由轴突传递到突触结构，再通过大量的突触传递给其他神经细胞的树突（见图
    7.21）。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_120_0.png)


    图 7.21 神经元信号传递示意图


    神经信号在传递过程中被突触以不同强度处理后传递给树突，大量树突接收的信号结合起来就构成了细胞体接收到的神经信号。细胞体最终决定以怎样的强度输出该信号。


    而模拟生物神经细胞结构的感知器的结构如图 7.22 所示。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_120_1.png)


    图 7.22 感知器的结构


    输入值相当于神经信号，这些神经信号经过突触依照不同的权重处理后被这个神经元的树突接收。大量树突接收到的信号被细胞体获得后，它将根据一个“激活函数”来决定最终输出的强度。激活函数通常是一个非线性的函数，它将可以使得我们用多元线性回归得到的'
  - '[PAGE 121]


    取非线性化。因此，感知器模型可以处理一些简单的非线性问题，比普通的多元线性回归适用性更广。


    但单一的感知器仍不能处理许多复杂的问题，计算机科学家们于是将多个感知器（神经元）结合到一起，构成一个简单的人工神经网络，在计算机科学领域也可简称为神经网络。


    在最简单的人工神经网络系统中，每个神经元在接收信号后，根据不同的权重生成一系列“输出值”，这些值又作为输入值生成最终的输出值。这些处于原始输入值和最终输出值之间的值通常也被称为中间值。


    我们常用“层”的概念来描述人工神经网络中的数据，原始输入数据构成输入层，最终的输出数据构成输出层，而中间所有起到中介作用的数据构成隐藏层（见图 7.23），它们一般是由计算机通过机器学习机制自主训练得到的，我们可以将其视为一个隐藏起来的“黑箱”。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_121_0.png)


    图 7.23 人工神经网络的基本结构


    从输入层到隐藏层的每一个中间值节点或是从隐藏层到输出层的转换事实上都构成了一个感知器（神经元），这便是人工神经网络名称的由来。由于每一个感知器中均包含了一个非线性的激活函数，最终的输出值受到了多个激活函数的影响，这使得人工神经网络模型从理论上来说可以完成任何情形下的现实模拟。


    需要注意的是，基本的人工神经网络虽然在结构上非常类似于生物神经网络，但其中信号传递的过程事实上与生物神经网络差异巨大。因此，人工神经网络并不是生物神经网络在计算机中的再现，二者只存在结构上的相似性。


    如果一个系统中包含多个层次的中间值，每层中间值之间都由不同权重序列和激活函数串联，就构成了一个深度神经网络（见图 7.24）。'
  - '[PAGE 122]


    ![](img/8da48b6e384089b60930a6d8ea39fe92_122_0.png)


    图 7.24 深度神经网络的结构示意图（图中的中间值均包括激活函数）


    深度神经网络在解决部分复杂问题时被证明很有效果。包括人脸识别在内的大量图像识别技术、语音识别技术、机器翻译及大家熟知的 AlphaGo 都是应用深度神经网络进行训练的典范。运用深度神经网络进行机器学习也被称为深度学习。


    回到识别人脸的问题上，若将大量不同人脸的图像信息视为输入值，将区分不同人脸的结果作为输出值，只要可供学习的图像足够多，人工神经网络就可以准确地区分不同人脸。为了实际使用方便，我们可以从人工神经网络的训练过程中得到它用于区分不同人脸的特征信息以及它们的计算方法，再在实际检测中直接计算出图像的特征信息进行比较即可（见图
    7.25）。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_122_1.png)


    图 7.25 从神经网络中提取出足以区分不同人脸的特征信息的计算方法


    需要注意的是，人工智能得到的特征信息并不是我们用来区分人脸的眼睛大小、鼻子高低等特征，而往往是一些数学信息。利用人工神经网络工具识别人脸并不需要知道这些计算出来的特征信息所代表的现实意义。


    人工神经网络，尤其是深度神经网络存在着一个巨大的缺点：运算量极大，因此运算极慢。这也是这项提出超过大半个世纪的技术直到近年来随着计算机运算能力的不断提升才逐渐发展起来的根本原因。


    为了减少运算量、提升运行的效率，人们发展出了一些有效的辅助方法。诸如卷积神经网络、递归神经网络等方法被证明在图像识别领域、机器翻译领域等方面有着出色表现。


    此外，人工神经网络还有另一个缺点——效果极大程度上依赖于输入数据的数量和质量，也导致了没有巨量数据的个人很难得到有效的结果。但从另一个角度来说，恰恰因为这个原'
