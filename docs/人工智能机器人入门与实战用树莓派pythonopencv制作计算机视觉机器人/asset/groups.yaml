    ## 1.1 初识人工智能


    ## 1.1.1 人工智能是什么


    人工智能（Artificial Intelligence，AI），也被称作机器智能，指由人制造的机器所表现出来的智能。通常人工智能是指通过计算机程序实现的智能技术，因此常常被视作计算机科学的一个分支。


    人工智能的研究具有高度的技术性和专业性，各分支领域都是深入且各不相通的，因而涉及范围极广。人工智能的核心问题包括构建能够跟人类相似甚至超越人的推理、知识、规划、学习、交流、感知、移动和操作物体的能力等。


    虽然人工神经网络下的深度学习算法在20世纪80年代已有突破性进展，但由于计算机计算能力的限制，其在人工智能领域的应用还没有发挥出应有的威力。近年来，随着超级计算机算力的飞速提升，加之深度学习算法的进一步优化，人工智能在视频识别、语言分析、棋类游戏等单方面的能力已经达到了超越人类水平。另一方面，一个人工智能程序能够同时解决这几方面的不同问题，充分体现了人工智能的通用性。


    人工智能的一个比较流行的定义，也是该领域较早的定义，是由当时麻省理工学院的约翰·麦卡锡在1956年的达特茅斯会议上提出的：人工智能就是要让机器的行为看起来就像是人所表现出的智能行为一样。随着人工智能60余年的发展，这个定义方式也在受到冲击。总的来说，人工智能的本质就是对人的思维的信息过程的模拟。


    ## 1.1.2 人工智能的发展历程


    ## 人工智能的起源


    早在20世纪四五十年代，数学家与计算机工程师就已经开始探讨用机器模拟智能的可能。


    1950年，艾伦·图灵（见图1.1）提出了著名的图灵测试：人类测试员通过文字与密室里的一台机器和一个人自由对话，如果测试员无法分辨谁是人、谁是机器，则参与对话的机器就被认为通过测试。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_12_0.png)


    图1.1 艾伦·图灵 (Alan Turing) (1912—1954年)


    图灵测试在过去数十年中一直被广泛认为是测试机器智能的重要标准，对人工智能的发展产生了极为深远的影响。


    1956 年，约翰·麦卡锡等 10 人在美国达特茅斯学院开会研讨“如何用机器模拟人的智能”，会上提出“人工智能”这一概念，这标志着人工智能学科的诞生。


    ## 人工智能研究发展的起起落落


    人工智能概念的提出给世界带来了很大的震撼，人们乐观地预测，人类将在短时间内制造出完全智能的机器。麻省理工学院的约瑟夫·维森鲍姆（Joseph Weizenbaum）在
    1966 年发表了世界第一款自然语言对话程序 Eliza（见图 1.2）。这款程序可以模拟人与人聊天的过程。虽然 Eliza 只是基于人类的对话提取关键词并做出预设的反应，但在早年还是让许多用户误认为是与真实人类对话。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_13_0.png)


    图 1.2 Eliza 与人的对话


    然而，虽然如 Eliza 这样的早期人工智能产品层出不穷，但还是难以满足社会上对于人工智能的过高期待。从 20 世纪 70 年代起，对人工智能的批评声越来越多，公众的热情与投资者都出现了大幅度的消退。


    直到 20 世纪 80 年代，随着卡耐基·梅隆大学为 DEC 公司开发的专家系统 XCON 在商业上的巨大成功，人工智能才重新回到业界的视线中。专家系统是一种基于特定规则回答特定领域问题的系统，例如，XCON
    可以帮助 DEC 公司根据客户的需求自动选择计算机部件组合，准确率达到了专业技师的水平从而节省了大量的人力成本。但是到了这一时期，人们已经逐渐不再追求建立一个通用的模拟人类的人工智能，而是开始专注于通过人工智能来解决具体领域的实际问题。


    另一方面，在这一时期，人工神经网络（Artificial Neural Network，ANN）的研究也取得了重要进展。人工神经网络是一种模仿动物大脑的结构和功能的数学模型。人工神经网络通常由大量的神经元联结进行计算，并可以在外界信息的基础上改变内部结构，也就

