    \n理想状态下，这一程序应该可以成功区分摄像头图像中的人脸与非人脸区域（见图 7.4）。如果实际效果偏差较大，可以尝试调整皮肤颜色的 H 值区间。\n\n\
    ![](img/8da48b6e384089b60930a6d8ea39fe92_105_0.png)\n\n图 7.4 人脸图像的二值化处理\n\n在检测到肤色区域的基础上，我们需要对其所处区域进行定位。使用下面的程序方法可以绘制出肤色区域的最小外接圆轮廓。\n\
    \n```\n(mask, cnts, hierarchy) = cv2.findContours(mask, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\
    \ # 寻找其中的所有外轮廓\nif len(cnts) > 0: # 如果至少找到一个轮廓\n    c = max(cnts, key=cv2.contourArea)\
    \ # 找出其中面积最大的轮廓\n    ((x, y), radius) = cv2.minEnclosingCircle(c) # 分析轮廓的中心位置和大小\n\
