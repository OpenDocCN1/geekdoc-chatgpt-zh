    舵机可以根据控制方式的不同分为模拟舵机（Analog Servo）和数字舵机（Digital Servo）两种。我们在机械臂上使用的舵机是数字舵机，数字舵机可以提供更高的精度和更好的固定力量，此外还有防抖动、响应速度快的优点。'
