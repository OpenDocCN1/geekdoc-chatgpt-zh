    # 7.3 使用哈尔特征检测找到人脸


    事实上，除了皮肤的颜色外，人脸还具备其它的一些图像特征。通常来说，由于有黑色的眼珠与眉毛的存在，眼睛区域的总体颜色比脸颊颜色更暗，鼻梁两侧比中央颜色更暗，而嘴巴也比周围颜色更暗。我们可以根据亮暗程度来表明这些区域的特征，为方便起见，我们可以先将彩色图片转换为黑白（灰度）图片（见图
