    # 6.2.1 认识舵机


    出于角度控制的需要，机械臂旋转轴的旋转电机通常采用步进电机或伺服电机。在小型桌面机械臂上，我们把舵机（小型伺服电机，见图 6.6）作为旋转电机使用。


    过去在航模制作中，爱好者们常用这种小型伺服电机来控制船的舵等结构，以操控船的方向，因此它们得到了“舵机”这个名字。舵机的作用类似于人类的关节，可以精准地控制转动角度，因此舵机在机器人领域广泛应用，比如人形机器人的关节和工业机器人的轴都大量使用舵机。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_78_0.png)


