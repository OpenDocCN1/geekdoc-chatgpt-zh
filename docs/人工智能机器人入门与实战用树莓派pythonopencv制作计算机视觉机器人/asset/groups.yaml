    \n为了解决这一问题，我们可以在追踪阶段判断当前帧中有没有人脸，一旦失去人脸则开始计时，丢失达到一定时间后则重新进入识别阶段。\n\n判断是否有 人脸只需判断哈尔特征检测中得到的人脸位置信息列表的长度即可。detectMultiScale\
