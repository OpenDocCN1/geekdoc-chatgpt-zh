    ## 2.4 Linux 操作系统简介


    树莓派作为一个微型计算机，可以运行多种不同的操作系统，但其官方系统 Raspbian 是一种基于 Linux 的操作系统。


    Linux 是世界上最为知名的开源操作系统内核。Linux 内核最早于 1991 年发布，任何人都可以免费使用甚至修改它。使用 Linux 内核制作的各种预先集成了各种应用程序的定制化操作系统常被称为
    Linux 发行版。通常所说的 Linux 操作系统泛指各式各样的发行版。


    著名的 Linux 发行版包括 Ubuntu、CentOS、Debian 等。树莓派官方系统 Raspbian 就是基于 Debian 制作的。


    除了被开发为桌面计算机的操作系统，Linux 内核还可被开发为移动设备的操作系统。当前最流行的移动端操作系统 Android 也是基于 Linux 内核开发的。


    相比 Windows、macOS 等非开源的操作系统，Linux 系统具备以下几点优势：


    - （1）Linux 系统完全免费；

    - （2）Linux 系统具备更高的安全性和稳定性，占用系统资源相对较低。


    但 Linux 也具有一些明显的劣势：


    - （1）图形化界面较为简易，使用相对不方便；

    - （2）由于 Linux 是开源的，一些常用的商业软件缺少 Linux 版本或存在功能缺失。


    因此，Linux 操作系统比较适合需要长时间稳定运行的场景，例如网络服务器、智能控制系统等。


    我们使用的 Raspbian 操作系统的常用图标分布于上方的任务栏中（见图 2.7）。


    从左向右依次为：

