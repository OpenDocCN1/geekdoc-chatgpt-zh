    我们可以使用它制作一个简单的加法计算器：


    ```

    a = input()

    b = input()

    print(a + b)

    ```


    这里，期望中的程序效果是连续输入两组数字，由程序计算它们的和。但是，例如我们连续输入 1 和 2，最终打印出的结果是 12 而不是 3。出现这一问题的原 因是无论我们输入的是一组数字还是一个单词，input()
    得到的输入值始终为字符串类型，对字符串类型进行 “+” 运算实际上是对字符串的连接。为了能进行数字的运算，我们需要对字符串强制转换数据类型。


    ```

    a = int(input())

    b = int(input())

    print(a + b)

    ```


    对输入数据使用 int() 转换为整数型后再赋值给变量 a 和 b，这样便可以进行真正的加法运算了。


    如果需要的数据类型是浮点型、字符串型，也可以使用 float()、str() 进行相应的强制转换。


