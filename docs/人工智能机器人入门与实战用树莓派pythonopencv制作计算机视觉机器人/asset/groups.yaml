    机械臂智能分拣任务\n\n## 6.1 认识机械臂\n\n### 6.1.1 应用广泛的机械臂\n\n迄今为止，机器人的研究与制造已经过了数十年的历程，发展出了多种不同形态的机器人。而机器人在工业领域的应用最为广泛，其中对人类帮助最大的类型就是机械臂。\n\
    \n在制造业流水线等各种场景中，我们会常见到一群灵活高效的机械臂的身影，它们可以在汽车生产线上焊接、拧螺丝，或者在工地上快速搬砖、砌砖，当然也可以在仓库里帮忙搬运打包快递。机械臂可以说是人类手臂的延伸，帮助我们完成了许多机械性劳作（见图\
    \ 6.1）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_75_0.png)\n\n图 6.1 工业机械臂\n\
    \n机械臂是一套具备多个旋转轴的复杂耦合系统，它通常是由多个电机构成的机械结构，在末端安装机械爪、吸盘、机械手等装置，实现模拟手臂操作的效果。机械臂的复杂程度通常取决于其可旋转轴的数量。旋转轴的数量通常也被称为自由度，常见的机械臂一般具备\
    \ 3~6 个自由度。\n\n### 6.1.2 三轴机械臂结构分析\n\n机械臂在不同使用场景中的设计有所不同。本例中使用的是 一种桌面级的三轴机械臂（见图\
    \ 6.2），它将驱动用的舱都设置在底部，这种设计可以将整个机械臂的重心控制在底部，在机械臂抓取物体的时候有利于保持稳定，这也是桌面级机械臂的一种经典结构。\n\
    \n![](img/8da48b6e384089b60930a6d8ea39fe92_76_0.png)\n\n图 6.2 三轴机械臂舵机与转轴关系示意图\n\
    \n这种机械臂有 3 个驱动用的舵机，其中底端的舵机 1 用来控制机械臂整体在平面内的转动；舵机 2 控制后臂绕底部关节的上下运动，舵机转角等同于图 6.3\
    \ 中的 α 角，最大旋转角度为 180°，90° 对应后臂垂直于桌面；舵机 3 控制前臂绕中间关节的上下运动，舵机转角等同于图 6.3 中的 β 角，最大旋转角度为\
    \ 180°，90° 对应前臂平行于桌面。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_76_1.png)\n\n\
    图 6.3 机械臂两个转轴与水平线、垂直线的夹角等同于舵机的角度\n\n## 说明\n\n如图 6.4 所示，我们在表述机械臂方位的时候都以机械臂后方为主视角说明。从机械臂的上方俯视，舵机\
    \ 1 的工作范围约 270°。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_77_0.png)\n\n图 6.4\
    \ 机械臂俯视图\n\n## 试一试\n\n随意地活动机械臂，观察它的机械结构和运动规律。\n\n你会发现，不管怎么活动机械臂，它头部的吸盘永远垂直于桌面。想一下这是为什么？\n\
    \n## 扩展阅读\n\n我们使用的这种机械臂头部永远垂直于桌面，是由它的机械结构设计（见图 6.5）决定的。我们一起用几何知识来证明一下这一点吧！\n\n\
    ![](img/8da48b6e384089b60930a6d8ea39fe92_77_1.png)\n\n图 6.5 机械臂的机械结构\n\n我们从左侧来看图\
    \ 6.5 所示这个机械臂。A 和 B 是固定在底座上的点，其他点都是随机械臂运动而移动的点。\n\n通过观察可知，AC 长度等于 BD 长度，CD 长度等于\
    \ AB 长度，因此 ACDB 是一个平行四边形。HC 长度等于 IG 长度，IH 长度等于 GC 长度，因此 HCGI 也构成一个平行四边形。H、D、C\
    \ 三点两两通过连杆固定连接，构成一个稳定的三角形。\n\nA 和 B 是底部固定的点，直线 AB 与水平线的夹角固定。\n\n因为 ACDB 是一个平行四边形，所以\
    \ CD 平行于 AB，CD 与水平线的夹角固定。\n\n因为 CDH 是一个稳定的三角形，所以角 HCD 是一个固定角，HC 与水平线的夹角固定。\n\n\
    因为 HCGI 是一个平行四边形，所以 IG 平行于 HC，IG 与水平线夹角固定。\n\n这样，我们可以在机械臂末端设计一个三角形结构，使气泵所在的 JG\
    \ 永远平行于桌面。\n\n## 6.2 程序控制机械臂的运动\n\n### 6.2.1 认识舵机\n\n出于角度控制的需要，机械臂旋转轴的旋转电机通常采用步进电机或伺服电机。在小型桌面机械臂上，我们把舵机（小型伺服电机，见图\
    \ 6.6）作为旋转电机使用。\n\n过去在航模制作中，爱好者们常用这种小型伺服电机来控制船的舵等结构，以操控船的方向，因此它们得到了“舵机”这个名字。舵机的作用类似于人类的关节，可以精准地控制转动角度，因此舵机在机器人领域广泛应用，比如人形机器人的关节和工业机器人的轴都大量使用舵机。\n\
    \n![](img/8da48b6e384089b60930a6d8ea39fe92_78_0.png)\n\n图 6.6 各式各样的舵机\n\n舵机可以根据控制方式的不同分为模拟舵机（Analog\
    \ Servo）和数字舵机（Digital Servo）两种。我们在机械臂上使用的舵机是数字舵机，数字舵机可以提供更高的精度和更好的固定力量，此外还有防抖动、响应速度快的优点。\n\
    \n## 扩展阅读\n\n小小的舵机将多个组件都封装在了外壳中，如图 6.7 所示，其主要的组成部分包括控制电路、电机、电位器和齿轮组等。\n\n控制电路接收电信号，驱动电机运动；齿轮组将电机的转动减速，增大扭矩；电位器安装在齿轮组的末端，与轴一起转动，同时测定转角的值，并将转角回传给控制电路。最终，控制电路根据电位器的反馈，控制电机转动到指定的位置。\n\
    \n![](img/8da48b6e384089b60930a6d8ea39fe92_79_0.png)\n\n图 6.7 舵机的结构\n\n### 6.2.2\
    \ 舵机的线路连接\n\n我们使用很常见的一种 16 路舵机控制板来控制舵机。\n\n如图 6.8 所示，左侧的接线柱可以接入 5~7.2V 的直流电源，用来给控制板供电。\n\
    \n![](img/8da48b6e384089b60930a6d8ea39fe92_79_1.png)\n\n图 6.8 16 路舵机控制板\n\n接线柱旁边的\
    \ USB 接口位置接入 Micro-USB 线连接计算机。\n\n4 个可插入杜邦线公头的接口为串行通信接口（简称为串口），可以接收其他设备发来的串行通信信号。\n\
    \n所有的红、黄、黑色引脚可直接插入舵机的 3 色线，可以同时控制最多 24 路舵机。\n\n我们将机械臂的 1、2、3 号舵机分别依序连至舵机控制板的 M1、M2、M3\
    \ 列引脚，注意线的 3 种颜色与控制板引脚的 3 色一一对应。\n\n机械臂末端连接了一个用于抓取物品的吸盘，其电控装置也以类似舵机的方式进行控制。其控制装置引出了两条舵机线，暂时不要连接这两条线。\n\
    \n连接完成后并确保接线正确后，将机械臂电源红线接至接线柱的 5V 端，黑线接至 GND 端，注意保持电源线上开关为关闭状态。\n\n将 Micro-USB\
    \ 线通过控制板的 USB 接口连接控制板和计算机。全部连接完成后打开电源开关。\n\n### 6.2.3 舵机控制程序\n\n打开舵机控制板专用程序，其界面如图\
    \ 6.9 所示。\n\n舵机控制板通电并连接计算机后，电机在线显示的位置将变为绿色。\n\nM1 控制舵机 1 的转动。前面说过，这个舵机是一个 270°\
    \ 大角度舵机，控制程序的 90° 对应机械臂平指向正前方（如图 6.10 所示机械臂状态），0° 对应右侧最大角度，180° 对应左侧最大角度。\n\n\
    M2 控制舵机 2 的转动，控制面板上的角度值对应 α 角的值。这是一个 180° 舵机，控制程序的 90° 对应后臂垂直于桌面。\n\nM3 控制舵机 3\
    \ 的转动，控制面板上的角度值对应 β 角的值。这是一个 180° 舵机，控制程序的 90° 对应前臂平行于桌面。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_80_0.png)\n\
    \n图 6.9 舵机控制板专用程序界面\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_81_0.png)\n\n\
    ![](img/8da48b6e384089b60930a6d8ea39fe92_81_1.png)\n\n图 6.10 3个舵机与机械臂转动关系回顾\n\n\
    > 试一试\n> \n> 尝试小幅度滑动 M1~M3 三路舵机的角度值，观察机械臂 3 个轴的运动状态。\n> 使用舵机控制程序控制机械臂在桌面运动。\n\n\
    ### 6.2.4 机械臂头部的执行装置——电控吸盘\n\n机械臂末端安装了一个用于抓取物品的吸盘。其抓取装置由电机式气泵、电子阀门和吸盘共同组成，这些部件之间用软管连接。\n\
    \n在使用时，当吸盘与物体接触后，我们令气泵通电，它将通过上方的吸气口按图 6.11 中所示方向抽取吸盘和物体间的气体。抽气后，吸盘将夹紧物体，即使断电也可以在一定时间内保持夹紧。注意在路径中存在一个电子阀门。断电时电子阀门的\
    \ 1 号位置与 2 号位置连通，3 号位置不通，使得抽气可以顺利进行。电子阀门通电后，1 号与 3 号位置连通，2 号位置不通。此时 3 号外部的空气将通过\
    \ 1 号口充入吸盘与物体间的空间，使吸盘与物体分离，如图 6.12 所示。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_81_2.png)\n\
    \n图 6.11 气泵抽气时的气流方向示意图\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_82_0.png)\n\
    \n图 6.12 电子阀门通电时的气流方向示意图\n\n要用程序控制气泵和电子阀门，先要将它连接至舵机控制板。\n\n先将机械臂电源开关关闭，再将气泵的舵机线连接至舵机控制板的\
    \ M4 引脚，电子阀门则接至 M5 引脚。\n\n气泵与电子阀门均使用舵机式控制，即 0° 对应断电，180° 对应完全通电。\n\n程序开始时，M4、M5\
    \ 两路都应该设置为 0°（断电），如图 6.13 所示。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_82_1.png)\n\
    \n图 6.13 程序开始时 M4、M5 两路的设定\n\n将一个待抓取的物体放置在吸盘下方，然后将 M4 由 0° 调整到 180°，气泵会抽气，使吸盘吸紧物体。\n\
    \n保持吸紧状态后，先将 M4 设置到 0°，再将 M5 设置为 180°，物体将在电子阀门作用下与吸盘分离。注意分离后立刻将 M5 还原至 0°，以免损坏电子阀门。\n\
    \n## 抓取的工作流程总结\n\n- 首先调整 M1、M2、M3 的角度，将机械臂吸盘对准待抓取物体。\n- 然后打开气泵（将 M4 设为 180°）。\n\
    - 调整 M1、M2、M3 的角度，将机械臂吸盘移动到其他位置。\n- 需要放下物体时，务必先断开气泵（将 M4 设为 0°），然后打开电子阀门（将 M5\
    \ 设为 180°）。\n- 注意电子阀门不能长时间打开，务必在打开后短时间（例如 2 秒）内关闭。\n\n## 试一试\n\n- 让吸盘吸取不同的物体，看看什么物体比较适合吸取。\n\
    - 抓取后试着将 M4 调整回 0°，观察吸取的状态变化。\n- 尝试按照此流程抓取一个物体并把它放置到另一个位置。\n\n### 6.2.5 用示教方式完成物料分拣\n\
    \n在机器人发展历程的介绍中我们曾讲过，最开始的机器人由于只能按照事先设定的步骤来运动而被称为“示教型机器人”。\n\n在让机械臂执行智能化自动任务之前，我们先以示教型控制的方式让机械臂完成一个人为设定好的抓取物体的任务。\n\
    \n在示教型任务中，我们将用到舵机控制板系统右侧的动作组功能，如图 6.14 所示。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_83_0.png)\n\
    \n图 6.14 设定状态与动作组\n\n先保持 M4 与 M5 的位置为 0° ，将 M1~M3 3 个舵机调整到一定位置，单击右侧状态框下方的“添加状态”即可将当前位置状态记录下来。\n\
    \n尝试添加一个状态，然后随意改变 3 个舵机的状态，再双击右侧已添加的状态名，让机械臂回到设定的状态。\n\n添加了状态后再单击“添加动作组”，可将状态添加到下方的动作组对话框。\n\
    \n在动作组对话框中可以双击状态来修改动作的持续时间。\n\n单击“模拟运行”即可将已记录的动作依序复现。\n\n> 试一试\n> \n> 使用舵机控制程序设定动作组，令机械臂将桌面上指定物体抓取到指定区域。\n\
    \n## 小贴士\n\n将动作组编号设为 0 组，完成后再通过控制程序上方的“下载”按钮下载至控制板上，如图 6.15 所示。\n\n将控制板与计算机的连接断开后，按控制板右侧的功能开关键，可以让机械臂复现已下载的动作组，如图\
    \ 6.16 所示。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_84_0.png)\n\n图 6.15 下载舵机控制程序\n\
    \n![](img/8da48b6e384089b60930a6d8ea39fe92_84_1.png)\n\n图 6.16 控制板功能开关键的位置\n\n\
    ## 6.3 用树莓派控制机械臂\n\n### 6.3.1 硬件连接\n\n此前我们已经学习了如何使用计算机通过舵机控制板控制机械臂的运动。现在，为了使用树莓派调用摄像头执行智能任务，我们需要先了解树莓派控制机械臂的方法。\n\
    \n机械臂的舵机控制板可以接收串行通信信号，我们可以通过树莓派发送串行通信信号来控制它。\n\n所谓的串行通信通常指的是名为 UART (Universal\
    \ Asynchronous Receiver/Transmitter) 的通信协议，设备间按照这一协议可以传输字符信息。\n\n图 6.17 所示的串行通信接口可以接线接收串行通信信息。进行串行通信的设备上通常有\
    \ RX（receive）和 TX（transport）两种接口。RX 表示信号接收接口，TX 表示信号发送接口。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_85_0.png)\n\
    \n图 6.17 舵机控制板的串行通信接口\n\n树莓派 GPIO 引脚的 8 号（TXD）和 10 号（RXD）是预留用于串口通信的引脚。\n\n如图 6.18\
    \ 所示连接树莓派和舵机控制板。\n\n**注意事项**\n\n连接前，请断开树莓派和机械臂的电源开关；连接完成后，先将树莓派开机，需测试程序时再打开机械臂电源开关。\n\
    \n![](img/8da48b6e384089b60930a6d8ea39fe92_85_1.png)\n\n图 6.18 树莓派的串口通信接口\n"
