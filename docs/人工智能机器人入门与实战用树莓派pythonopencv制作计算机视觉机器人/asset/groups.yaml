    函数返回一个 0 和 1 排列而成的图像信息。这种将图像的所有像素用 0 和 1 表示的方法被称为图像的二值化。二值化是处理计算机图像时常用的一种数学方法。若将值为
    0 的像素用黑色标出，而将 1 用白色标出，inRange 函数可以完成图 5.16 所示的转换。


