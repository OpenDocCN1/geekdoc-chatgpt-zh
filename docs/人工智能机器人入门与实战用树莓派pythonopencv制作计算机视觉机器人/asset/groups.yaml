    \ 1500, 40))\nser.close()\n```\n\n### 试一试\n\n尝试编写程序控制双轴云台舵机的运动，找出两个舵机 PWM 值的变化与云台运动方向之间的关系。\n\
    如果舵机不转，请检查舵机控制板的供电与通信连接。\n\n由于摄像头的安装方式为上下倒转安装，我们在编写程序读取图像时需使用 flip 函数将图像上下翻转。\n\
