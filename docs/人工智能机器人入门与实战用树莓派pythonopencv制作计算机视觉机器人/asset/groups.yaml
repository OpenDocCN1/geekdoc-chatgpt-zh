    ## 推荐序


    创客教育方兴未艾，实践方可知行合一。


    教育的本质在于启蒙，而启蒙的关键在于好的切入点，人工智能时代结合双脑时代，一方面人类智慧开创了机器人时代，同时机器的学习和智能演化又进一步加深了人们对学习本身的理解。人类希望对智慧中的逻辑进行机器实现，创造出了编程和机器程序控制，这是最初的机器人形式；随后由于人类对自主智能和环境适应有需求，又创造出了自学习、自演化机器人系统。因此，以人工智能和机器人作为启蒙教育的入口，是非常有智慧的选择，也是人类智力提高的最佳实证途径。


    奇异思维团队敢于创新、敢于为天下先，将时代强音“人工智能”引入中小学教育，以教材为主线，结合实践操作，编写了浅显易懂、上手快、逻辑清、趣味强的一套切实可行的教材，为人工智能创客教育、实践教育注入新鲜血液，零距离贴近智能、实践编程，使科普及直观实践教育在祖国的
    中小学内得以开展，实为广大中小学教育工作者和学生的幸事。


    记得我有一次给德清初中学生做《好玩的机器人》报告，一个坐在第一排的孩子课间问了我一个非常深刻的问题，他问道：“老师，如何处理好学习和生活的关系？” 我先是一愣，马上随口回答道：“愉快地学习，有智慧地生活。”
    我庆幸自己反应快，没想到孩子接着问道：“如何愉快地学习？如何有智慧地生活？” 我深深地被孩子的执着和有智慧的提问打动，我当时刚好讲到一些我的发明专利，回头看了一下PPT，结合“好玩的机器人”，赞叹了孩子的问题，然后回答道：“在学习中发现乐趣，在生活中发现问题。”
    我非常感谢孩子的问题，是他的问题开启了我智慧的宝藏，使我能更好更深刻地思考我们的教育，思考如何才能使我们的下一代在健康快乐的学习中增长智慧，进而解决生活问题，在解决问题中增强逻辑、系统性、独立思维能力，成为未来的创新性人才。恰好此书起到了纽带和桥梁作用。


    奇异思维团队在选择编程入门的系统和编程语言上着实下了一番功夫，既结合时代和 AI 特征，又考虑到中小学学生的入门难易度，同时在内容题材的趣味性上也做了周密考虑，使我想起以前搞发明的一段座右铭：“解决人们的烦恼，不改变人们的习惯，让大家玩起来。”
    此书由浅入深，将中小学生学习人工智能和机器人编程的困难巧妙地克服了，利用孩子们对好玩事物的好奇，以搭建积木和循序渐进的内容组合，使孩子们在不知不觉中学到知识、启迪智慧。


    此书凝聚了奇异思维团队的心血和成长历程，不仅适合中小学创客教育工作者，也适合中小学生自学实践，同样适合其他对人工智能和机器人编程实践感兴趣的零起点人士，我期望此书能使大众更贴近和了解人工智能与机器人，从围观者成为实践者，进而成为创新者。


    浙江大学电气工程学院副教授、

