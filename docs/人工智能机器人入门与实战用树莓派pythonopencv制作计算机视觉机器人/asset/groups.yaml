    ## 内容提要


    树莓派是一款基于 ARM 架构、Linux 系统的极简计算机，既可以用于计算机编程教育，也可以作为机器人的控制核心。第一种运行于树莓派上的编程语言是 Python，这是当前人工智能领域最为流行的编程语言。机器视觉是人工智能中重要的细分研究领域，OpenCV
    则是当前机器视觉领域主流的开源处理库，可以方便地用于计算机图像处理，并应用于面部识别、目标识别等具体问题。本书介绍在树莓派硬件上使用 Python 语言，借助
    OpenCV 库编程，来实现具有计算机视觉功能（识别和抓取特定颜色物体、识别人脸、识别特定人脸、进行面部跟踪）的智能机器人。


    本书力求通过一系列不同层次的软硬件任务，由浅入深地讲解人工智能的概念，同时覆盖 Linux 系统操作、Python 编程、机器人系统搭建等多方面的综合知识。在本书案例中使用的主要硬件载体是可在桌面上固定运转的双轴云台和三轴机械臂等，它们可以代表一类智能机器人的形态。本书遵循开源、分享的创客精神，所有的硬件材料和软件内容均可以从公共平台获取，读者在充分理解的基础上，不必局限于本书所列硬件，可自行获取类似设备完成项目。


    本书可以作为中小学 STEAM 人工智能教育的一本基础读物，也可以作为中高职院校相关专业学生的参考书。


