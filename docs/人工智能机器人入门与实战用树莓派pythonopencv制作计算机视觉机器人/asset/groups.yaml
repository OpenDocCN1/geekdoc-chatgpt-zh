    \n# 7.8.1 让机器人认识你\n\n在前面的讲解中，我们已经学习了人工智能识别人脸的完整过程，并在人脸检测的阶段制作了一个可以追踪人脸的小机器人。现在，我们尝试加入人脸识别功能，让机器人能够只追踪你的脸。\n\
