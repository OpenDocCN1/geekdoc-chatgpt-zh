    # 4.3.1 导入 Python 扩展包


    要使用 Python 程序对 GPIO 连接的输入 / 输出设备进行控制，需要用到一个名为 RPi.GPIO 的扩展包。在 Python 程序中，许多功能被写在了一些额外的官方或第三方扩展包中，可以通过如下两种方式导入扩展包。


    ```

    import 扩展包名 as 自定义名称

    from 扩展包名 import 包中的指定函数、变量

    ```


    第一种方式为直接导入，后面的 “as 自定义名称” 可以不写。不写时，使用 “扩展包名 . 包内的函数或变量名” 的形式可以调用包内预先设定好的函数或变量。若设定了自定义名称，则使用
    “自定义名称 . 包内的函数或变量名” 的形式调用。


    第二种导入方式则可以选择性地包中设定的函数或变量，导入多个函数或变量时需使用逗号隔开。若使用 “import *” 则可导入包中的所有函数及变量。用这种方式导入扩展包时，我们可以直接用导入的函数或变量名来调用它们而不用再写包名。


    例如对 RPi.GPIO 扩展包，可以分别这样导入：


    ```

    import RPi.GPIO as gpio

    from RPi.GPIO import *

    ```


    若要调用包中名为 setmode 的函数，使用第一种方式导入时需要用 gpio.setmode 来调用，使用第二种方式导入则可以直接用 setmode 调用。


    我们可以选择任意一种导入方式，但通常来说，为了避免导入的函数或变量发生重名的情况，建议使用第一种方式。只有在导入的包中的函数或变量很少或我们只需要使用其中特定的几个函数或变量时才建议使用第二种方式。


    对 RPi.GPIO 包一般采用第一种导入方式。需要注意的是，Python 程序中的任何位置对大小写都是敏感的，即大写字母和对应的小写字母作为两个不同字符来对待，这里
    RPi.GPIO 包的名称中只有字母 i 是小写的。


    # 4.3.2 LED 显示彩色的原理


    生活中我们会接触到各种各样的 “灯”，比如白炽灯、荧光灯、LED 灯等。其中 LED 灯因其具有耗电量低、体积小、便于数字控制等优点，在生产、生活中的应用日益广泛。


    LED 的全称是 “发光二极管”。发光二极管的材料在导电状态下可以被激发，并向外释放出光子，也就是发射出特定频率的光。基于材料特性的不同，不同发光二极管发射出的光的频率也不尽相同。光的颜色是由其频率（波长）决定的，从红外线到各种可见光，再到紫外线都是这样。'
