    \n## 5.1 机器视觉与图像识别\n\n### 5.1.1 机器是怎样“看”的\n\n我们人类可以通过感觉器官感知世界，例如用眼睛“看”、用耳朵“听”、用鼻子“闻”、用舌头“尝”等。而用眼睛看，也就是视觉，是其中非常重要的一种感觉。\n\
    \n人工智能系统的一个重要发展方向是对人类机能的模拟，因而学会“看”对人工智能而言是非常关键的一步。\n\n在分析机器如何“看”之前，我们先简单了解一下人类的视觉机制。我们天生就能使用眼睛接收光线，从而可以看到五彩斑斓的世界，这是因为人眼的视觉细胞中存在分别对红色、绿色、蓝色敏感的\
    \ 3 种细胞，从而可以识别出这 3 种颜色，并可以通过它们的融合识别其他颜色。其流程如图 5.1 所示。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_56_0.png)\n\
    \n图 5.1 感光细胞成像的简易流程\n\n因此，红、绿、蓝 3 种颜色被称为视觉三原色，它们的任意组合可以构成可见光的所有颜色。三原色及其组合如图 5.2\
    \ 所示。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_56_1.png)\n\n图 5.2 红、绿、蓝三原色及其组合\n\
    \n人类在很长的历史时期之中只能用绘画的方式将眼中的视觉图像留下下来，直到 19 世纪，人们第一次研制出了能存储光线信息的仪器——照相机。传统的彩色照相机利用某些化学物质对三原色光线的敏感性在底片（胶卷）上显出对应的颜色（见图\
    \ 5.3）。其工作原理与人眼的成像原理有相似之处。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_57_0.png)\n\
    \n图 5.3 传统彩色照相机的影像原理\n\n现代的数码相机则稍有不同，它不依赖于特定的化学物质，而是通过电子感光单元将接收到的光线信息转化为电信号，并经由芯片处理后将这些电子信息存储起来或传递出去（见图\
    \ 5.4）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_57_1.png)\n\n图 5.4 数码相机获取图像的原理\n\
    \n电子感光单元通常由大量方块型的微型感光半导体元件构成，它们通常紧密排列为一个矩形结构（见图 5.5）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_57_2.png)\n\
    \n图 5.5 电子感光单元中以矩形排列着大量的感光半导体\n\n每一个感光半导体可以通过滤波感知到接收光线中三原色的光照强度。因此，电子感光单元可以知道接收到的光线每一个位置上红、绿、蓝光的强度。因此，图像的电子信息实质上就是每一个感光半导体所测得的三原色光强度信息。这样得到的图像信息并不是完全连续的，它的最小单元是一个感光半导体所占据的小方块，这些小方块被称为图像的像素。\n\
    \n传统照相机可以通过对底片的处理直接还原出实体的照片，数码相机得到的图像信息还需要通过电子显像呈现出来。\n\n我们可以使用大量微型的彩色LED“小灯”按照与感光半导体相同的方式排列成显示器，再令每个“小灯”接收各自像素对应的三原色光强信息，从而显示出完整图像。借由这一过程，数码相机可以模拟人眼获取视觉图像的过程（见图\
    \ 5.6）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_58_0.png)\n\n但人类不仅仅可以用眼睛“看到”图像，还可以用我们的大脑对图像进行分析，识别图像中有意义的信息，例如物体的颜色、形状，甚至种类等。\n\
    \n人工智能视觉的关键就在于如何从图像中分析出各种物体的颜色、形状等基本信息，进而分析它们所蕴含的意义。这个过程就被称为图像识别，或者机器视觉。图 5.7\
    \ 所示为机器视觉与人类视觉的对比。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_58_1.png)\n\n###\
    \ 5.1.2 机器视觉技术的常见应用\n\n机器视觉技术是当前人工智能的一个重要分支，现阶段已有大量重要的现实应用。\n\n## 相似图像搜索\n\n2009—2010\
    \ 年，谷歌、百度等搜索公司相继推出了以图搜图的图片搜索功能。这一功能可以分析图片上的特征信息，并从互联网上找到与该图片相似的图片。现在，各类手机购物 App\
    \ 也可以以类似的原理实现拍摄商品照片，找到相似商品的功能。\n\n## 文字识别\n\n很多电子设备都可以使用 OCR（光学字符识别）技术识别纸质资料上的文字，目前较为成熟的\
    \ OCR 技术可以以较高的成功率读取手写文字。\n\n## 面部识别\n\n当前的智能手机上大多搭载了利用手机摄像头结合人工智能算法实现的面部识别功能。结合这一功能，智能手机可以以较高的安全性进行解锁、支付等操作。除此之外，面部识别还被广泛应用于公共安全领域，不单可以在特定场所保护公共安全，还可以协助侦破刑事案件。\n\
    \n## 目标检测\n\n人工智能图像识别的一个关键是识别图像中的物体并对它们进行分类。现在，随着人工神经网络技术的发展，我们可以更轻松地使用一些开源的神经网络工具“训练”AI识别物体。图\
    \ 5.8 所示为目标检测工具识别指定种类的物体。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_59_0.png)\n\
    \n图 5.8 目标检测工具 YOLO 可以准确地从图像中识别指定种类的物体\n\n## 5.2 认识 OpenCV\n\n通过前面的学习，我们知道，计算机等电子设备中存储的图像信息实质上是以像素排列的颜色值信息，也就是大量的数据。要从图像信息中得到有意义的信息，就必须对这些数据进行分析与处理。\n\
    \n计算机科学家和相关领域的从业者在过往几十年时间内发展出了大量用于处理计算机图像信息的数学方法。开源的计算机视觉库 OpenCV 内置了大量这类数学方法，可以帮助我们分析图像信息。\n\
    \n### 5.2.1 OpenCV 简介\n\n英特尔公司于 1999 年发起了以计算机图像处理为主题的开源程序库项目\n\nOpenCV（开源计算机视觉库），它已成为目前影响力最大\
    \ 的一个开源计算机视觉库。OpenCV 在面部识别、手势识别、目标识别、增强现实（AR）等问题上都能够发挥重要的作用。\n\n2009 年，OpenCV\
    \ 发布了其第一个第二代正式版本。自 2012 年起，一个专门的非营利组织负责 OpenCV 项目的后续支持。OpenCV 2015 年发布其第三代，2018\
    \ 年发布到第四代。在我们后续的项目中，将使用目前应用最为广泛的 OpenCV 第三代版本。\n\nOpenCV 本体以 C++ 程序语言编写，但也提供了包括\
    \ Python 在内的其他编程语言的扩展接口。图 5.9 所示为 OpenCV 的 Logo。\n\n### 5.2.2 视频的帧与分辨率\n\nOpenCV\
    \ 不单可以用于处理静止的图像信息，其很重要的一个目标是对实时的动态图像进行处理。\n\n我们可以运用摄像头来捕获动态的视频图像。摄像头的基 本成像原理与数码相机完全相同，只不过它可以实时以较短的时间间隔连续获取图像信息。这些图像信息按时间顺序排列起来就组成了我们常说的视频。\n\
    \n我们看到的视频实际上是由若干张静态图片连续播放而成的（见图 5.10）。人类大脑的视觉系统会将连续播放的相似图片自动连接成连续的影像。\n\n视频中每一张静态图片被称为视频的一帧（frame）。视频每秒输出的帧数量是一个很重要的指标，这被称为帧率（单位为帧/秒）。现在主流的视频帧率是\
    \ 30 帧/秒或 60 帧/秒。帧率越高，视频越流畅。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_60_0.png)\n\
    \n图 5.9 OpenCV 的 Logo，包含视觉三原色要素\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_60_1.png)\n\
    \n图 5.10 视频事实上是由多帧图像连续播放而成的\n\n一个视频中每一帧图像的像素排列是完全一致的。视频中每帧图片的横轴、纵轴像素的数量被称为视频的分辨率。以树莓派官方摄像头为例，该摄像头发拍摄的图像横轴拥有\
    \ 640 个像素，而纵轴拥有 480 个像素，所以其分辨率为 640 像素 × 480 像素。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_61_0.png)\n\
    \n图 5.11 树莓派摄像头的分辨率及像素坐标的排列方式\n\n如图 5.11 中橙色点所示，我们可以将每个像素定位到其在 x 轴（横轴）和 y 轴（纵轴）方向的位置，并标注为\
    \ (x 坐标, y 坐标)。\n\n视频的分辨率常以纵轴的像素数量来表示，例如标清视频为 480p，指的是纵轴有 480 个像素。而高清视频为 720p，全高清视频为\
    \ 1080p，4K 视频则为 2160p。标准视频的横纵像素比通常为 16:9 或 4:3。显然，分辨率越高，视频越清晰。\n\n### 5.2.3 用树莓派摄像头调取图像\n\
    \n要在树莓派中调用 OpenCV 处理实时图像，需要在树莓派主板上安装摄像头。安装摄像头前请先将树莓派关机并断电，如果连接了 GPIO 扩展板，须将其隔离。使用\
