    \n使用 OpenCV 测试摄像头的完整程序如下。\n\n```\nimport cv2 # 导入 OpenCV 扩展包\ncap = cv2.VideoCapture(0)\
    \ # 读取摄像头发信号\nwhile cap.isOpened(): # 当摄像头发信号存在时，进行循环\n    (ret, frame) = cap.read()\
    \ # 将读取的信号中的一帧存为 frame 变量\n    cv2.imshow('test', frame) # 预览帧\n    cv2.waitKey(5)\
    \ # 每帧等待 5 毫秒\n```\n\n运行程序后将在弹出的窗口中看到其拍摄到的实时画面。如果未能看到画面，请检查摄像头的连接。\n\n现在我们来分析一下这段程序代码的运作过程。OpenCV\
    \ 可以使用 VideoCapture 读取视频。其后的括号中填写序号 “0” 将可以读取树莓派的默认摄像头发信号。如果连接了其他摄像头，可以用其他序号来获取。此外，在这里填写视频存储地址，也可以直接读取树莓派系统中存储的视频。\n\
    \n将读取视频的结果创建为 cap 后，使用 isOpened 函数可以返回其读取视频的结果。如果读取成功，则返回 True（真），否则返回 False（假）。因此，我们可以将它作为\
    \ while 循环的条件实现循环读取视频信号。\n\n对 cap 使用 read 函数将返回视频中一帧的信息，这个函数存在两个返回值：该帧是否存在以及这一帧的具体信息。我们可以用形如\
    \ (ret, frame) = cap.read() 的格式将第一个返回值存为 ret，第二个返回值存为 frame。\n\nret 在帧存在时为 True（真），否则为\
    \ False（假）。frame 则包含了这一帧中所有像素点的三原色值信息及其排列方式。OpenCV 读取的帧信息的每一个像素由三原色值按照 B（蓝）、G（绿）、R（红）的顺序排列，每一个值的范围为\
    \ 0（最暗）~255（最亮）。\n\n使用 imshow 函数可以将图像信息显示为一个窗口中的图像，其格式为：\n\n```\nimshow(窗口名称，图像信息)\n\
    ```\n\nOpenCV 中使用 imshow 显示图像后必须使用一个 waitKey 函数。函数的参数值为以毫秒为单位的时间，表示在显示一帧后等待这些时间再继续。\n\
    \n# 试一试\n\n连接树莓派摄像头，用 OpenCV 预览实时视频。"
