    \ World 程序\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_32_2.png)\n\n图 3.11 程序的运行效果\n\
    \n如果程序运行异常，可能是运行按钮的编译设置有误，可以单击生成→设置生成命令，按图 3.12 所示方式设置红框处。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_33_0.png)\n\
    \n图 3.12 Geany 中的编译设置\n\n## 3.4 Python 中的变量\n\n在前面关于编程语言的学习中，我们知道，计算机是通过大量 1 和\
    \ 0 的排列来存储信息的。电子计算机将要描述的一切事物都存储为 1 和 0 组合而成的 数据。因此，任何程序实质上都是以特定的方式对计算机中的数据进行操作，数据是程序的核心要素。\n\
    \n为了方便对各种不同的数据进行分析和处理，我们可以在程序中建立变量来存储这些数据。变量通常具备一个独立的名称，其存储的数据就是变量的值。\n\n举例来说，A\
    \ 班按星期一至星期五分为 5 个值日小组轮流值日，每个值日小组由几个学生组成。每次轮到某个小组时按照一定规则由其中一个学生负责这一次的值日。如果将每一次负责值日的同学视为数据，值日小组就是我们建立的变量。班主任在要求学生进行值日时，只需要说由哪个小组值日即可，具体由小组内的谁来负责即是变量的值。\n\
    \n### 3.4.1 变量的赋值\n\n将变量的名称与值对应起来的操作被称为变量的赋值。在 Python 语言中，赋值语句非常简单，例如：\n\n```\n\
    a=1\n```\n\n这里，我们建立了一个名称为 a 的变量，并将其值赋为 1。等号 (=) 号在 Python 中被称为赋值运算符。在后面的程序段落中，我们可以通过调用\
    \ a 来取得值 1。\n\n需要注意的是，在同一个 Python 程序中，每一个变量的名称都应该是不同的，对一个已经出现过的变量再次赋值将改变其值。例如：\n\
    \n```\na = 1\na = 2\n```\n\n这里，在第二次赋值后 a 的值就将变为 2。\n\n如果需要同时赋值多个变量，我们可以这样编写：\n\
    \n```\na = 1\nb = 2\n```\n\n或这样编写：\n\n```\na, b = 1, 2\n```\n\n这两种方式完全等价。我们可以先赋值两个变量，再将对它们进行算术运算的结果重新赋值给第一个变量，最后将它打印出来。\n\
    \n```\na, b = 1, 2\na = a + b\nprint(a)\n```\n\n想一想，这段程序打印出的 a 的值应该是多少？\n\n###\
    \ 3.4.2 Python 的数据类型\n\n在 Python 语言中，数据的形式可以是一个数字（例如 1、2.5），也可以是一些字符（例如 “a” “Hello”）。总的来说，我们可以将\
    \ Python 中的数据分为两类：数字（Number）和字符串（String）。\n\n数字类型的数据又有几个子类型，主要有存储整数的整数型（int）和存储小数的浮点型（float）等。数字类型的数据可以使用\
    \ +、-、*、/ 等算术运算符进行计算。\n\n字符串类型用于存储一个或多个字符，Python 中的字符串需要在两侧用英文单引号或双引号标出，例如 “Hello\
    \ World” 的形式。字符串之间可以使用 + 运算符进行连接，例如：\n\n```\na = \"Hello \"\nb = \"World\"\nprint(a\
    \ + b)\n```\n\n程序将打印出两个字符串连接而成的字符串 “Hello World”。\n\n虽然我们在对变量赋值时并不需要指定它存储的数据的类型，但\
    \ Python 在首次对一个变量赋值时会根据我们设定的初始值来自动为变量分配一个合适的数据类型。\n\n不过，某些程序功能要求特定的数据类型，如果输入的数据类型不符合要求，可能导致程序错误。举例来说，Python\
    \ 中使用 input() 可以获得手动输入的数据，我们可以用这个功能将一个输入的值赋值给一个变量：\n\n```\na = input()\nprint(a)\n\
    ```\n\n运行程序后，我们可以在编译器或命令行的程序运行区输入一组任意的字符，并用回车键完成输入。这些字符将被赋值给变量 a 并打印出来。\n\n我们可以使用它制作一个简单的加法计算器：\n\
    \n```\na = input()\nb = input()\nprint(a + b)\n```\n\n这里，期望中的程序效果是连续输入两组数字，由程序计算它们的和。但是，例如我们连续输入\
    \ 1 和 2，最终打印出的结果是 12 而不是 3。出现这一问题的原 因是无论我们输入的是一组数字还是一个单词，input() 得到的输入值始终为字符串类型，对字符串类型进行\
    \ “+” 运算实际上是对字符串的连接。为了能进行数字的运算，我们需要对字符串强制转换数据类型。\n\n```\na = int(input())\nb =\
    \ int(input())\nprint(a + b)\n```\n\n对输入数据使用 int() 转换为整数型后再赋值给变量 a 和 b，这样便可以进行真正的加法运算了。\n\
    \n如果需要的数据类型是浮点型、字符串型，也可以使用 float()、str() 进行相应的强制转换。\n\n试一试\n仿照示例的加法计算器，编写减法、乘法和除法的计算器。\n\
    \n## 3.5 if 条件结构\n\n到目前为止，我们的程序还只能按照我们指定的方式从上至下按顺序输出一些打印的内容或是进行一些算术运算。而编程语言的真正强大之处在于它可以根据不同情况改变其运行的流程。Python\
    \ 中存在多种基于逻辑判断的特定程序流程结构，其中最基础的一种便是 if 条件结构。\n\n### 3.5.1 条件的真与假\n\n在介绍 if 条件结构之前，我们先了解一下条件的真与假的概念。在逻辑上，我们用条件来描述事物的状态。例如：\n\
    \n如果今天下雨，我就去图书馆。\n\n这句话中 “今天下雨” 是一个条件。如果今天下雨了，我们称这个条件成立，它是一个真条件；如果今天没有下雨，这个条件不成立，它就是一个假条件。\n\
    \n在 Python 语言中，常用两个特殊的量——True 和 False 分别对应条件的真与假。当 Python 程序对条件判断为真时，其得到一个 True\
    \ 值，否则得到一个 False 值。\n\n### 3.5.2 比较运算符\n\n在程序中常常需要判定的条件为两个量之间的大小关系，这种条件的真假判断可以用比较运算符来实现。例如：\n\
    \n```\na, b = 1, 2\na == b\n```\n\n这里，我们使用比较运算符“相等”（==，两个等号）来比较两侧的量是否相等，若相等则得到\
    \ True，否则得到 False。上面的语句中，a == b 得到的结果为 False。\n\n注意，这里相等运算符使用两个等号，这是为了与赋值运算符（一个等号）区分开来。除了相等外，比较运算符还有大于（>）、小于（<）、大于等于（>=）、小于等于（<=）、不等于（!=）等。需要注意的是，数字类型的数据可以进行所有的大小比较，而字符类型的数据只能判断相等（==）或不相等（!=）。\n\
    \n### 3.5.3 if 条件结构的格式与缩进\n\n基于对条件真假的判断，我们可以完成 if 条件结构，其基本的逻辑流程如图 3.13 所示。\n\n\
    ![](img/8da48b6e384089b60930a6d8ea39fe92_36_0.png)\n\n图 3.13 if 条件结构的基本流程\n\n\
    它在程序中的格式如下：\n\n```\nif 条件:\n    语句 A\nelse:\n    语句 B\n```\n\n程序将判断条件为真或假。若为真，执行语句\
    \ A，否则执行语句 B。这里的语句 A 和 B 可以是一个或多个语句。例如：\n\n```\nif a > b:\n    print(a)\nelse:\n\
    \    print(b)\n```\n\n这一程序段将始终打印 a 与 b 中较大的变量的值。\n\n可以注意到，这里语句 A 和语句 B 与 if 和\
    \ else 并没有对齐，而是在前方多出了一定长度的空白。这一空白便是 Python 程序中用于区分语句间逻辑层次关系的缩进。\n\n在同一个 Python\
    \ 程序中，缩进需要使用相同长度的空白。虽然这个长度并没有统一规定，但按照流行的 Python 编写习惯，我们建议使用 4 个空格作为 Python 的缩进。\n\
    \nif 条件结构不单可以判断一个条件的成立与否，还可以判断多个条件的成立与否。例如：\n\n```\nif 条件 A:\n    语句 A\nelif 条件\
    \ B:\n    语句 B\nelse:\n    语句 C\n```\n\n这一语句的逻辑结构如图 3.14 所示。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_37_0.png)\n\
    \n图 3.14 进行两个条件判断的 if 结构逻辑\n\n举例来说：\n\n```\nif a > 0:\n    print(\"a is a positive\
    \ number\")\nelif a < 0:\n    print(\"a is a negative number\")\nelse:\n    print(\"\
    a equals to zero\")\n```\n\n这段语句将根据 a 与 0 的相对关系分 3 种情况输出对应的内容。多次使用 elif 可以进行更多的条件判断。\n\
    \n## 试一试\n\n将上节练习中的计算器改写为可以根据输入的运算符自主选择运算方式的四则运算计算器。\n\n提示：除了输入两个待计算的数外，还可以再使用一次\
    \ input() 得到手动输入的运算符。对这个运算符的值进行条件判断，根据值的不同执行不同的运算方式。\n\n## 3.6 while 循环结构\n\n\
    除了 if 条件结构外，常用的 Python 逻辑结构还有 while 循环结构。while 循环结构用于在条件判断为真时不断循环执行其中的语句。其执行逻辑如图\
    \ 3.15 所示。\n\n其程序格式为：\n\n```\nwhile 条件:\n    循环执行语句\n```\n\n在 while 后的条件成立时，循环执行语句循环执行，并在每次执行完成后判断条件是否仍成立。直到条件不成立时程序跳出循环，开始执行\
    \ while 结构后的语句。循环执行语句与 if 条件结构中的语句类似，也需要进行缩进。\n\n例如：\n\n```\na = 1\nwhile a <\
    \ 100:\n    a = a + 1\nprint(a)\n```\n\n该程序段将在 a 小于 100 时不断将 a 的赋值加 1，最终在 a 等于\
    \ 100 时跳出循环并打印。\n\n利用 while 循环结构，我们可以用 Python 程序完成一些更复杂的数学运算。例如正整数阶乘运算将得到小于等于该数的所有正整数的乘积，即\
    \ n! = 1×2×3×…×n。使用 while 循环，可以非常方便地进行这一运算。例如要计算 50 的阶乘值：\n\n```\na, f = 1, 1\n\
    while a <= 50:\n    f = f * a\n    a = a + 1\nprint(f)\n```\n\n在这一程序段中，a 用来存储待乘的数，从\
    \ 1 开始，在每次循环后增加 1，直到 50 为止；f 则用于存储过程中阶乘的运算结果。最终，程序将计算并打印出 50 的阶乘值。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_38_0.png)\n\
    \n> 试一试\n> \n> 斐波那契数列指的是形如 1,1,2,3,5,8,13……的数列，其第一位和第二位均为 1，其后每一位等于前两位之和。试用 while\
    \ 循环计算斐波那契数列中任一位置的数字。\n\n## 3.7 Python 中的函数\n\n在一个程序的执行过程中需要多次重复执行一些相同或类似的操作时，我们可以把这些程序内包含包装为函数。使用函数，可以使得程序的结构更为清晰，有助于我们阅读与调试程序。函数拥有一个与变量类似的独立名称，并可以有几个参数，以及返回值。\n\
    \n举例来说，假如有一个机器人可以帮助我们买东西，但它并不知道“买东西”这个行为是怎样进行的。我们可以告诉它，买东西需要拿上购物袋、钱，走到指定的地方，找到指定的物品，再将钱交给收银员，拿回找零的钱，最后回到家中。这个流程在买任何东西时都是适用的。在教给机器人一次后，机器人就记住了这个购物的流程，那么此后再让它购物时，我们只需要说“去买东西”，它就可以完成同样的流程。这个“去买东西”就是一个函数。当然，每次购物时要买的物品及其数量都是不同的，这些信息就是函数的参数，例如“去买一斤白菜”“去买两盒牙膏”。在函数上加上参数，它就可以在一定的流程中根据参数的不同发生一些变化。每次购物后我们还希望知道一共花了多少钱，机器人可以在过程中计算出来并告诉我们。这个花了多少钱的结果就是函数的返回值，它表示每次函数执行后给出的反馈结果。\n\
    \n### 3.7.1 自定义一个函数\n\nPython 中定义函数的格式如下：\n\n```\ndef 函数名称(函数参数 1, 函数参数 2, ……):\n\
    \    函数内执行语句\n    return 函数的返回值\n```\n\n函数的名称在同一程序中必须是独立的，我们可以通过调用这个名称来执行函数。函数名称后需要使用小括号，括号内用逗号区隔开多个参数，这些参数可以在后面的语句中进行调用。如果函数没有参数，括号内留空即可。函数内部的语句在函数被调用时执行，注意函数内的语句都都需要进行缩进。\n\
    \n举例来说，可以将前面列举的阶乘功能定义为一个函数：\n\n```\ndef factorial(n):\n    a, f = 1, 1\n    while\
    \ a <= n:\n        f = f * a\n        a = a + 1\n    print(f)\n```\n\n定义完这个函数后直接运行程序将不会得到任何结果，我们需要在程序的后继部分调用函数的名称来实际执行这个函数：\n\
    \n```\nfactorial(5)\n```\n\n在调用时，我们对函数传入了一个参数 5，这样在函数的执行过程中，函数中定义的参数 n 的实际值便为\
    \ 5。通过调用函数的方式得到的结果与前面直接进行阶乘运算完全相同，但我们将阶乘运算封装成一个函数将使得程序阅读起来更为清晰。\n\n函数运行后得到的某一个变量可以用\
    \ return 关键字来返回。函数内不使用 return 语句时，其没有返回值。仍以阶乘运算为例，我们可以不打印出结果而是将结果返回。例如：\n\n```\n\
    def factorial(n):\n    a, f = 1, 1\n    while a <= n:\n        f = f * a\n   \
    \     a = a + 1\n    return f\n```\n"
  mdcn: "\nPython语言由荷兰程序员吉多·范·罗苏姆(Guido van Rossum)于1989年开始开发，并于1991年发布了其第一个公开版本(Python\
    \ 0.9.0)。\n\n2000年，Python 2.0发布，影响力开始逐渐扩大。2008年，Python发布了3.0版本，其与2.0系列并不完全兼容。\n\
    \n相比传统的C、Java等编程语言，Python具备一些优势。\n\n- 较强的易读性。Python是一种高级编程语言，其在设计上更为接近人类使用的自然语言（英语）。具备英语基础和少许编程基础的人可以很轻松地阅读Python代码。\n\
    - 简洁的语法（规则）。Python语言的设计哲学是“优雅”“明确”和“简单”，力图用最简洁的方式完成程序内容。相比于传统编程语言，Python通常可以用更短的语句执行同样的功能。\n\
    \n例如，下面的C#语言程序段落可以在屏幕上打印出“Hello World!”字样。\n\n```\nusing System;\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            Console.WriteLine(\"\
    Hello World!\");\n        }\n    }\n```\n\n而使用 Python 语言实现同样的功能则只需要写入：\n\n```\n\
    print(\"Hello World!\")\n```\n\n- 强大的可扩展性。由于Python是一个完全开放的编程语言环境，其拥有大量强大的扩展包，例如数学计算包NumPy、游戏开发包pygame、机器学习包TensorFlow等。正是因为这一特点，Python目前是人工智能编程的首选语言。\n\
    - 便利的可移植性。Python几乎可以运行于任何操作系统，将Python代码移植到Windows、macOS、Linux等不同环境中非常便利。\n\n现在流行的Python版本可以大致分为第2代（代号为2.x形式）和第3代（代号为3.x形式）。据统计，2018年，有84%的程序开发者在使用第3代Python编写程序，而Python语言的开发团队也计划于2020年停止对第2代Python的维护。由于这两代Python的程序编写规则有少许区别，我们将在后续课程中全部统一使用第3代Python编写程序。\n\
    \n## 3.3 在树莓派中使用 Python 编程\n\nPython程序可以在各种环境下进行编写，其中自然也包括树莓派。树莓派的名字Raspberry\
    \ Pi中的“Pi”就来自于Python。Python是第一种树莓派上运行的编程语言，也是最常用...于树莓派项目开发的编程语言。\n\n### 3.3.1\
    \ 交互式编程\n\n交互式编程是一种非常便利的 Python 编程方式，常用于程序测试的场景。首先通过任务栏打开树莓派的“终端”，在其中输入“python3”并回车即可进入\
    \ Python 3 的交互式编程环境（见图 3.5）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_30_0.png)\n\
    \n图 3.5 Python 3 的交互式编程环境界面\n\n输入“print( \"Hello World!\" )”并回车将输出字符串“Hello world\
    \ !”（见图 3.6）。像这样完成特定功能的句子就是编程语言的语句，一个完整的程序是由大量语句构成的。在 Python 程序中，通常每一个语句占据一行。\n\
    \n![](img/8da48b6e384089b60930a6d8ea39fe92_30_1.png)\n\n图 3.6 Hello World!\n\n\
    ### 3.3.2 使用算术运算符进行运算\n\n计算机程序非常擅长进行算术运算。在 Python 语言中，加、减、乘、除算术运算可以用算术运算符 +、-、*、/\
    \ 来实现，如图 3.7 所示。输入算式，程序将给出运算的结果。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_31_0.png)\n\
    \n图 3.7 使用交互式编程环境进行算术运算\n\n### 3.3.3 用 Geany 编辑器编写 Python 程序\n\n虽然交互式编程环境可以很方便地输出语句的结果，但它并不能将大段的程序内容储存起来反复运行，因此只适用于程序调试的场景。绝大多数情况下，我们需要将完整的\
    \ Python 程序存储为 .py 格式的文件，再调用它进行运行。\n\n可以使用任意的文本编辑器编写 Python 程序。我们在后续的课程中统一使用树莓派系统预装的轻量级文本编辑器\
    \ Geany 来编写 Python 程序。Geany 可在树莓派任务栏的开始菜单中选择“编辑”找到。\n\n使用 Geany 编辑器的图标可以方便地进行文件的新建、打开、保存以及\
    \ Python 程序的运行操作（见图 3.8）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_31_1.png)\n\
    \n图 3.8 Geany 编辑器的界面\n\n打开 Geany 后，我们先新建一个空白文档，再单击文档→设置文件类型→脚本语言→Python 源文件，将其设为\
    \ Python 程序文件（见图 3.9）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_32_0.png)\n\
    \n图 3.9 在 Geany 中新建 Python 文件的设置\n\n设置完成后，可在程序编辑区中写入需执行的代码，再单击“运行”图标执行其中的语句。例如，我们仍可以输入\
    \ “print(\" Hello World \")”（见图 3.10）。运行后将生成一个名为 sh 的窗口，其中显示出我们打印的内容（见图 3.11）。\n\
    \n![](img/8da48b6e384089b60930a6d8ea39fe92_32_1.png)\n\n图 3.10 在 Geany 中编写 Hello\
    \ World 程序\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_32_2.png)\n\n图 3.11 程序的运行效果\n\
    \n如果程序运行异常，可能是运行按钮的编译设置有误，可以单击生成→设置生成命令，按图 3.12 所示方式设置红框处。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_33_0.png)\n\
    \n图 3.12 Geany 中的编译设置\n\n## 3.4 Python 中的变量\n\n在前面关于编程语言的学习中，我们知道，计算机是通过大量 1 和\
    \ 0 的排列来存储信息的。电子计算机将要描述的一切事物都存储为 1 和 0 组合而成的 数据。因此，任何程序实质上都是以特定的方式对计算机中的数据进行操作，数据是程序的核心要素。\n\
    \n为了方便对各种不同的数据进行分析和处理，我们可以在程序中建立变量来存储这些数据。变量通常具备一个独立的名称，其存储的数据就是变量的值。\n\n举例来说，A\
    \ 班按星期一至星期五分为 5 个值日小组轮流值日，每个值日小组由几个学生组成。每次轮到某个小组时按照一定规则由其中一个学生负责这一次的值日。如果将每一次负责值日的同学视为数据，值日小组就是我们建立的变量。班主任在要求学生进行值日时，只需要说由哪个小组值日即可，具体由小组内的谁来负责即是变量的值。\n\
    \n### 3.4.1 变量的赋值\n\n将变量的名称与值对应起来的操作被称为变量的赋值。在 Python 语言中，赋值语句非常简单，例如：\n\n```\n\
    a=1\n```\n\n这里，我们建立了一个名称为 a 的变量，并将其值赋为 1。等号 (=) 号在 Python 中被称为赋值运算符。在后面的程序段落中，我们可以通过调用\
    \ a 来取得值 1。\n\n需要注意的是，在同一个 Python 程序中，每一个变量的名称都应该是不同的，对一个已经出现过的变量再次赋值将改变其值。例如：\n\
    \n```\na = 1\na = 2\n```\n\n这里，在第二次赋值后 a 的值就将变为 2。\n\n如果需要同时赋值多个变量，我们可以这样编写：\n\
    \n```\na = 1\nb = 2\n```\n\n或这样编写：\n\n```\na, b = 1, 2\n```\n\n这两种方式完全等价。我们可以先赋值两个变量，再将对它们进行算术运算的结果重新赋值给第一个变量，最后将它打印出来。\n\
    \n```\na, b = 1, 2\na = a + b\nprint(a)\n```\n\n想一想，这段程序打印出的 a 的值应该是多少？\n\n###\
    \ 3.4.2 Python 的数据类型\n\n在 Python 语言中，数据的形式可以是一个数字（例如 1、2.5），也可以是一些字符（例如 “a” “Hello”）。总的来说，我们可以将\
    \ Python 中的数据分为两类：数字（Number）和字符串（String）。\n\n数字类型的数据又有几个子类型，主要有存储整数的整数型（int）和存储小数的浮点型（float）等。数字类型的数据可以使用\
    \ +、-、*、/ 等算术运算符进行计算。\n\n字符串类型用于存储一个或多个字符，Python 中的字符串需要在两侧用英文单引号或双引号标出，例如 “Hello\
    \ World” 的形式。字符串之间可以使用 + 运算符进行连接，例如：\n\n```\na = \"Hello \"\nb = \"World\"\nprint(a\
    \ + b)\n```\n\n程序将打印出两个字符串连接而成的字符串 “Hello World”。\n\n虽然我们在对变量赋值时并不需要指定它存储的数据的类型，但\
    \ Python 在首次对一个变量赋值时会根据我们设定的初始值来自动为变量分配一个合适的数据类型。\n\n不过，某些程序功能要求特定的数据类型，如果输入的数据类型不符合要求，可能导致程序错误。举例来说，Python\
    \ 中使用 input() 可以获得手动输入的数据，我们可以用这个功能将一个输入的值赋值给一个变量：\n\n```\na = input()\nprint(a)\n\
    ```\n\n运行程序后，我们可以在编译器或命令行的程序运行区输入一组任意的字符，并用回车键完成输入。这些字符将被赋值给变量 a 并打印出来。\n\n我们可以使用它制作一个简单的加法计算器：\n\
    \n```\na = input()\nb = input()\nprint(a + b)\n```\n\n这里，期望中的程序效果是连续输入两组数字，由程序计算它们的和。但是，例如我们连续输入\
    \ 1 和 2，最终打印出的结果是 12 而不是 3。出现这一问题的原 因是无论我们输入的是一组数字还是一个单词，input() 得到的输入值始终为字符串类型，对字符串类型进行\
    \ “+” 运算实际上是对字符串的连接。为了能进行数字的运算，我们需要对字符串强制转换数据类型。\n\n```\na = int(input())\nb =\
    \ int(input())\nprint(a + b)\n```\n\n对输入数据使用 int() 转换为整数型后再赋值给变量 a 和 b，这样便可以进行真正的加法运算了。\n\
    \n如果需要的数据类型是浮点型、字符串型，也可以使用 float()、str() 进行相应的强制转换。\n\n试一试\n仿照示例的加法计算器，编写减法、乘法和除法的计算器。\n\
    \n## 3.5 if 条件结构\n\n到目前为止，我们的程序还只能按照我们指定的方式从上至下按顺序输出一些打印的内容或是进行一些算术运算。而编程语言的真正强大之处在于它可以根据不同情况改变其运行的流程。Python\
    \ 中存在多种基于逻辑判断的特定程序流程结构，其中最基础的一种便是 if 条件结构。\n\n### 3.5.1 条件的真与假\n\n在介绍 if 条件结构之前，我们先了解一下条件的真与假的概念。在逻辑上，我们用条件来描述事物的状态。例如：\n\
    \n如果今天下雨，我就去图书馆。\n\n这句话中 “今天下雨” 是一个条件。如果今天下雨了，我们称这个条件成立，它是一个真条件；如果今天没有下雨，这个条件不成立，它就是一个假条件。\n\
    \n在 Python 语言中，常用两个特殊的量——True 和 False 分别对应条件的真与假。当 Python 程序对条件判断为真时，其得到一个 True\
    \ 值，否则得到一个 False 值。\n\n### 3.5.2 比较运算符\n\n在程序中常常需要判定的条件为两个量之间的大小关系，这种条件的真假判断可以用比较运算符来实现。例如：\n\
    \n```\na, b = 1, 2\na == b\n```\n\n这里，我们使用比较运算符“相等”（==，两个等号）来比较两侧的量是否相等，若相等则得到\
    \ True，否则得到 False。上面的语句中，a == b 得到的结果为 False。\n\n注意，这里相等运算符使用两个等号，这是为了与赋值运算符（一个等号）区分开来。除了相等外，比较运算符还有大于（>）、小于（<）、大于等于（>=）、小于等于（<=）、不等于（!=）等。需要注意的是，数字类型的数据可以进行所有的大小比较，而字符类型的数据只能判断相等（==）或不相等（!=）。\n\
    \n### 3.5.3 if 条件结构的格式与缩进\n\n基于对条件真假的判断，我们可以完成 if 条件结构，其基本的逻辑流程如图 3.13 所示。\n\n\
    ![](img/8da48b6e384089b60930a6d8ea39fe92_36_0.png)\n\n图 3.13 if 条件结构的基本流程\n\n\
    它在程序中的格式如下：\n\n```\nif 条件:\n    语句 A\nelse:\n    语句 B\n```\n\n程序将判断条件为真或假。若为真，执行语句\
    \ A，否则执行语句 B。这里的语句 A 和 B 可以是一个或多个语句。例如：\n\n```\nif a > b:\n    print(a)\nelse:\n\
    \    print(b)\n```\n\n这一程序段将始终打印 a 与 b 中较大的变量的值。\n\n可以注意到，这里语句 A 和语句 B 与 if 和\
    \ else 并没有对齐，而是在前方多出了一定长度的空白。这一空白便是 Python 程序中用于区分语句间逻辑层次关系的缩进。\n\n在同一个 Python\
    \ 程序中，缩进需要使用相同长度的空白。虽然这个长度并没有统一规定，但按照流行的 Python 编写习惯，我们建议使用 4 个空格作为 Python 的缩进。\n\
    \nif 条件结构不单可以判断一个条件的成立与否，还可以判断多个条件的成立与否。例如：\n\n```\nif 条件 A:\n    语句 A\nelif 条件\
    \ B:\n    语句 B\nelse:\n    语句 C\n```\n\n这一语句的逻辑结构如图 3.14 所示。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_37_0.png)\n\
    \n图 3.14 进行两个条件判断的 if 结构逻辑\n\n举例来说：\n\n```\nif a > 0:\n    print(\"a is a positive\
    \ number\")\nelif a < 0:\n    print(\"a is a negative number\")\nelse:\n    print(\"\
    a equals to zero\")\n```\n\n这段语句将根据 a 与 0 的相对关系分 3 种情况输出对应的内容。多次使用 elif 可以进行更多的条件判断。\n\
    \n## 试一试\n\n将上节练习中的计算器改写为可以根据输入的运算符自主选择运算方式的四则运算计算器。\n\n提示：除了输入两个待计算的数外，还可以再使用一次\
    \ input() 得到手动输入的运算符。对这个运算符的值进行条件判断，根据值的不同执行不同的运算方式。\n\n## 3.6 while 循环结构\n\n\
    除了 if 条件结构外，常用的 Python 逻辑结构还有 while 循环结构。while 循环结构用于在条件判断为真时不断循环执行其中的语句。其执行逻辑如图\
    \ 3.15 所示。\n\n其程序格式为：\n\n```\nwhile 条件:\n    循环执行语句\n```\n\n在 while 后的条件成立时，循环执行语句循环执行，并在每次执行完成后判断条件是否仍成立。直到条件不成立时程序跳出循环，开始执行\
    \ while 结构后的语句。循环执行语句与 if 条件结构中的语句类似，也需要进行缩进。\n\n例如：\n\n```\na = 1\nwhile a <\
    \ 100:\n    a = a + 1\nprint(a)\n```\n\n该程序段将在 a 小于 100 时不断将 a 的赋值加 1，最终在 a 等于\
    \ 100 时跳出循环并打印。\n\n利用 while 循环结构，我们可以用 Python 程序完成一些更复杂的数学运算。例如正整数阶乘运算将得到小于等于该数的所有正整数的乘积，即\
    \ n! = 1×2×3×…×n。使用 while 循环，可以非常方便地进行这一运算。例如要计算 50 的阶乘值：\n\n```\na, f = 1, 1\n\
    while a <= 50:\n    f = f * a\n    a = a + 1\nprint(f)\n```\n\n在这一程序段中，a 用来存储待乘的数，从\
    \ 1 开始，在每次循环后增加 1，直到 50 为止；f 则用于存储过程中阶乘的运算结果。最终，程序将计算并打印出 50 的阶乘值。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_38_0.png)\n\
    \n> 试一试\n> \n> 斐波那契数列指的是形如 1,1,2,3,5,8,13……的数列，其第一位和第二位均为 1，其后每一位等于前两位之和。试用 while\
    \ 循环计算斐波那契数列中任一位置的数字。\n\n## 3.7 Python 中的函数\n\n在一个程序的执行过程中需要多次重复执行一些相同或类似的操作时，我们可以把这些程序内包含包装为函数。使用函数，可以使得程序的结构更为清晰，有助于我们阅读与调试程序。函数拥有一个与变量类似的独立名称，并可以有几个参数，以及返回值。\n\
    \n举例来说，假如有一个机器人可以帮助我们买东西，但它并不知道“买东西”这个行为是怎样进行的。我们可以告诉它，买东西需要拿上购物袋、钱，走到指定的地方，找到指定的物品，再将钱交给收银员，拿回找零的钱，最后回到家中。这个流程在买任何东西时都是适用的。在教给机器人一次后，机器人就记住了这个购物的流程，那么此后再让它购物时，我们只需要说“去买东西”，它就可以完成同样的流程。这个“去买东西”就是一个函数。当然，每次购物时要买的物品及其数量都是不同的，这些信息就是函数的参数，例如“去买一斤白菜”“去买两盒牙膏”。在函数上加上参数，它就可以在一定的流程中根据参数的不同发生一些变化。每次购物后我们还希望知道一共花了多少钱，机器人可以在过程中计算出来并告诉我们。这个花了多少钱的结果就是函数的返回值，它表示每次函数执行后给出的反馈结果。\n\
    \n### 3.7.1 自定义一个函数\n\nPython 中定义函数的格式如下：\n\n```\ndef 函数名称(函数参数 1, 函数参数 2, ……):\n\
    \    函数内执行语句\n    return 函数的返回值\n```\n\n函数的名称在同一程序中必须是独立的，我们可以通过调用这个名称来执行函数。函数名称后需要使用小括号，括号内用逗号区隔开多个参数，这些参数可以在后面的语句中进行调用。如果函数没有参数，括号内留空即可。函数内部的语句在函数被调用时执行，注意函数内的语句都都需要进行缩进。\n\
    \n举例来说，可以将前面列举的阶乘功能定义为一个函数：\n\n```\ndef factorial(n):\n    a, f = 1, 1\n    while\
