    ```\n\n## 扩展阅读\n\n人脸追踪机器人是一个典型的控制系统，系统通过计算摄像头中人脸的测量位置（输入值）与中心点坐标（目标值）的误差值调整不同的\
    \ PWM 值（输出值），控制舵机运动，进而使得图像中的人脸向目标位置趋近并反复循环这一过程。这种输入值跟随输出值变化并可以重新调整输出的控制系统被称为闭环控制系统（见图\
    \ 7.17）。优秀的闭环控制系统是自动控制的关键。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_116_0.png)\n\
    \n图 7.17 闭环控制系统\n\n在前面的程序中，我们将 PWM 值的调整大小设定成与坐标值偏离中心值的幅度成正比。坐标值偏离中心值的幅度是控制系统中的误差值，输出的调整大小与误差值成正比的调整方式被称为比例调节。\n\
    \n将调整大小设定为 u，误差为 e，则有：\n\nu=K_p × e\n\nK_p 为比例调节的参数。但是，单纯的比例调节参数太大容易导致调整过度，而发生在中心附近的往复振动，太小又会使调整太慢。我们此前的解决方案是设定一个“中心区”来避免振动，但这仍不是最理想的方法。\n\
    \n为了能够减小振荡，我们可以存储上一帧的误差值 e_last 并计算当前帧误差与上一帧误差的差值，得到：\n\nu=K_p × e + K_d × (e\
    \ - e_last)\n\n这种调节方式被称为微分调节，K_d 就是微分调节的参数。当人脸正在接近中心时，此项将抵消比例调节的调整量从而起到减小振荡的效果。微分调节可以通过误差变化的趋势预测系统的未来偏差，非常适合树莓派摄像头这种延迟较大的系统。同学们可以尝试使用该方法改写前面的程序。\n\
    \n在某些系统中，由于摩擦等干扰因素，系统可以调整到目标值附近却无法达到目标值。这种情况下，还可以计算历史累积的误差（正负误差可抵消）e_all，使系统可以随着时间的累积对小误差进行响应：\n\
    \nu=K_p × e + K_d × (e - e_last) + K_i × e_all\n\n这种调节方式被称为积分调节，参数 K_i 为积分调节参数。比例调节、微分调节和积分调节共同组成了\
    \ PID 控制器，它可以作为平衡车、无人机等绝大多数自动控制系统的核心算法。\n\n## 7.5 什么是机器学习\n\n### 7.5.1 计算机如何识别一只猫\n\
    \n首先我们要知道，对人工智能系统而言，其核心的工作过程可以被简化为给定一个输入，经过人工智能的判断，得到一个输出。例如，常见的指纹解锁中，我们将输入的指纹信息交给人工智能系统，人工智能系统经过比较判断给出一个通过或不通过的输出结果。\n\
    \n那么人工智能是依据什么进行判断的呢？\n\n在简单的情形下，我们可以通过程序给定一套规则（算法），人工智能系统只需要依据这个规则进行判断就行了。例如在避障小车中，我们设定当探测到障碍物距离小于特定值时转向\
    \ 90°，否则保持直行。这就是一个极其简单的人工智能判断规则。\n\n由于计算机具有高速运算能力，人工智能可以快速完成很多对于人类来说很麻烦的事情。但是人类可以轻而易举完成的一些事情，对于计算机来说却有着巨大的障碍，例如从一张图片中识别一只猫（见图\
    \ 7.18）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_117_0.png)\n\n图 7.18 计算机识别猫与狗是一个复杂的任务\n\
    \n人可以轻易地分辨出一只猫的形象，但是对于计算机来说，这是个相当艰难而复杂的任务。原因在于计算机很难找到一套规则去明确猫是什么样的。\n\n猫应该有毛，但是有些猫就是没毛。\n\
    \n猫应该有耳朵，但是有些猫耳朵是耷着的，根本看不出来耳朵。\n\n猫总该有胡须、眼睛，但有的猫是背对着你的。\n\n猫总要有一些颜色，但晚上看一只黑猫就不行。\n\
    \n有的看起来像猫，但说不定是狗，是狐狸，或者是其他的什么动物。\n\n那么机器该怎么分辨一只图片中的猫呢？\n\n在现在的人工智能系统中，人们常常会通过一定的方式令机器来“学习”从而自行获得一套进行判断的规则。这种方法被称为“机器学习”，是人工智能的一个重要分支领域。\n\
    \n例如在识别猫的例子，人们会给计算机提供大量的图片（见图 7.19），告诉它这是猫\n\n或者不是猫，给它一个模型让它自己去学习、分析，自主形成“猫”的概念。经过一定量的训练后，再给它一张图，它就可以判断图中到底是不是猫了。\n\
    \n![](img/8da48b6e384089b60930a6d8ea39fe92_118_0.png)\n\n图 7.19 各种可能的猫的照片\n\n\
    ### 7.5.2 机器学习的分类\n\n在机器学习领域，有几种主要的学习方式：监督学习 (supervised learning)、无监督学习 (unsupervised\
    \ learning)、半监督学习（semi-supervised learning）、强化学习 (reinforcement learning) 等。\n\
    \n监督学习是指给定有对应关系输入、输出数据，让人工智能算法找出两组数据之间的对应关系。例如在猫狗分类问题中，我们给多张猫、狗的图片，并完全告诉人工智能系统这些图片中是猫还是狗，再令系统学习它们的分类模式，这是一种典型的监督学习。在哈尔特征检测中，我们曾提到，可以依靠计算机训练的方式找到人脸与非人脸图像的哈尔特征差异，从而实现对人脸的检测。这种训练便是机器学习中的监督学习，它需要我们提供大量事先标注好的人脸或非人脸的照片。\n\
    \n无监督学习是指只提供输入数据而没有对应的输出数据，让人工智能系统自行寻找数据的关系。例如我们只给出猫、狗的图片却不告诉系统它们的分类，便是无监督学习。\n\
    \n通常来说，无监督学习的难度远高于监督学习，但监督学习却需要付出更多的成本（需要人工标注大量的数据）。在实际的人工智能项目中，可以根据实际情况选择采用两种方法中的一个或是混合使用，而这种混合使用又称为“半监督学习”。例如我们既提供已知分类的猫、狗图片，又提供没有分类的图片，便是半监督学习。\n\
    \n但是在某些情况下，人们以人工智能为核心系统操控机器人解决实际的复杂问题时，往往只知道需要完成的目标，并不能直接提供输入/输出值。此时，我们可以令机器人随机地自行控制动作得到相对应的目标反馈结果。人工智能系统将判断其控制的动作与反馈结果间的关联，进而做出合理的调整，最终不断优化其动作，得到更好的结果。\n\
    \n例如训练让机器人投篮入筐或是射门入网，先让它随机做动作，然后根据一定的反馈得知投篮是否进筐或射门是否入网，然后不断调整、优化动作，最终达到百发百中。\n\
    \n这种机器人自主学习的方式被称为“强化学习”，它可以在自主行动的基础上，根据正负反馈的情况不断强化自身。\n\n## 7.6 认识人工神经网络\n\n借助机器学习的方法，我们可以经过训练得到人脸的哈尔特征。这些特征虽然足以区分人脸与非人脸，却难以区分不同人的脸——它们的相似性远高于人脸和其他图像的相似性。要识别特定的人脸，使用预先设定的数学方法配合机器学习已经难以完成。为解决这一问题，一个典型的方法是使用人工神经网络工具。\n\
    \n人工智能机器人学习机制的本质是根据多组已知的输入值（例如不同人脸的照片）和输出值（例如它们对应的人的名字）来自行找出它们之间的对应关系，从而通过其他输入值预测出新的对应输出值。多数情况下，影响输出值的输入值都有多个，只要我们找到所有的输入值以及它们各自的权重系数，理论上我们就可以预测任意一次输入情况下对应的输出值。例如：\n\
    \n输出值 = 权重1 × 输入值1 + 权重2 × 输入值2 + …… + 权重n × 输入值n\n\n这里，每一个输入值都按照一定的比值影响输出值，它们的影响程度表现为各自对应的权重。采用这种方式归纳的输入/输出关系被称为多元线性回归（见图7.20）。之所以称为线性，是因为在这里输入值都被直接乘以一个常数而没有采用平方、立方或是正弦、反对数等数学变换。\n\
    \n![](img/8da48b6e384089b60930a6d8ea39fe92_119_0.png)\n\n图 7.20 多元线性回归示意图\n\n\
    多元线性回归的数学计算比较简单，但它往往不能用于描述绝大多数真实的问题。基于多元线性回归，计算机科学家们在 20 世纪中叶基于生物神经细胞提出了一种名为感知器的模型，它是人工神经网络的雏形。\n\
    \n在介绍人工神经网络之前，我们先来简单了解一下人类的神经元（神经细胞）的结构。神经元可以简单分为细胞体、树突、轴突几部分。经过细胞体处理的神经信号经由轴突传递到突触结构，再通过大量的突触传递给其他神经细胞的树突（见图\
    \ 7.21）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_120_0.png)\n\n图 7.21 神经元信号传递示意图\n\
    \n神经信号在传递过程中被突触以不同强度处理后传递给树突，大量树突接收的信号结合起来就构成了细胞体接收到的神经信号。细胞体最终决定以怎样的强度输出该信号。\n\
    \n而模拟生物神经细胞结构的感知器的结构如图 7.22 所示。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_120_1.png)\n\
    \n图 7.22 感知器的结构\n\n输入值相当于神经信号，这些神经信号经过突触依照不同的权重处理后被这个神经元的树突接收。大量树突接收到的信号被细胞体获得后，它将根据一个“激活函数”来决定最终输出的强度。激活函数通常是一个非线性的函数，它将可以使得我们用多元线性回归得到的\n\
    \n取非线性化。因此，感知器模型可以处理一些简单的非线性问题，比普通的多元线性回归适用性更广。\n\n但单一的感知器仍不能处理许多复杂的问题，计算机科学家们于是将多个感知器（神经元）结合到一起，构成一个简单的人工神经网络，在计算机科学领域也可简称为神经网络。\n\
    \n在最简单的人工神经网络系统中，每个神经元在接收信号后，根据不同的权重生成一系列“输出值”，这些值又作为输入值生成最终的输出值。这些处于原始输入值和最终输出值之间的值通常也被称为中间值。\n\
    \n我们常用“层”的概念来描述人工神经网络中的数据，原始输入数据构成输入层，最终的输出数据构成输出层，而中间所有起到中介作用的数据构成隐藏层（见图 7.23），它们一般是由计算机通过机器学习机制自主训练得到的，我们可以将其视为一个隐藏起来的“黑箱”。\n\
    \n![](img/8da48b6e384089b60930a6d8ea39fe92_121_0.png)\n\n图 7.23 人工神经网络的基本结构\n\n\
    从输入层到隐藏层的每一个中间值节点或是从隐藏层到输出层的转换事实上都构成了一个感知器（神经元），这便是人工神经网络名称的由来。由于每一个感知器中均包含了一个非线性的激活函数，最终的输出值受到了多个激活函数的影响，这使得人工神经网络模型从理论上来说可以完成任何情形下的现实模拟。\n\
    \n需要注意的是，基本的人工神经网络虽然在结构上非常类似于生物神经网络，但其中信号传递的过程事实上与生物神经网络差异巨大。因此，人工神经网络并不是生物神经网络在计算机中的再现，二者只存在结构上的相似性。\n\
    \n如果一个系统中包含多个层次的中间值，每层中间值之间都由不同权重序列和激活函数串联，就构成了一个深度神经网络（见图 7.24）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_122_0.png)\n\
    \n图 7.24 深度神经网络的结构示意图（图中的中间值均包括激活函数）\n\n深度神经网络在解决部分复杂问题时被证明很有效果。包括人脸识别在内的大量图像识别技术、语音识别技术、机器翻译及大家熟知的\
    \ AlphaGo 都是应用深度神经网络进行训练的典范。运用深度神经网络进行机器学习也被称为深度学习。\n\n回到识别人脸的问题上，若将大量不同人脸的图像信息视为输入值，将区分不同人脸的结果作为输出值，只要可供学习的图像足够多，人工神经网络就可以准确地区分不同人脸。为了实际使用方便，我们可以从人工神经网络的训练过程中得到它用于区分不同人脸的特征信息以及它们的计算方法，再在实际检测中直接计算出图像的特征信息进行比较即可（见图\
    \ 7.25）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_122_1.png)\n\n图 7.25 从神经网络中提取出足以区分不同人脸的特征信息的计算方法\n\
    \n需要注意的是，人工智能得到的特征信息并不是我们用来区分人脸的眼睛大小、鼻子高低等特征，而往往是一些数学信息。利用人工神经网络工具识别人脸并不需要知道这些计算出来的特征信息所代表的现实意义。\n\
    \n人工神经网络，尤其是深度神经网络存在着一个巨大的缺点：运算量极大，因此运算极慢。这也是这项提出超过大半个世纪的技术直到近年来随着计算机运算能力的不断提升才逐渐发展起来的根本原因。\n\
    \n为了减少运算量、提升运行的效率，人们发展出了一些有效的辅助方法。诸如卷积神经网络、递归神经网络等方法被证明在图像识别领域、机器翻译领域等方面有着出色表现。\n\
    \n此外，人工神经网络还有另一个缺点——效果极大程度上依赖于输入数据的数量和质量，也导致了没有巨量数据的个人很难得到有效的结果。但从另一个角度来说，恰恰因为这个原\n\
    \n因，人工神经网络近年来的快速发展推动了大数据概念的火爆，数据量成为了科技巨头公司争夺的关键。\n\n尽管近年来深度神经网络在图像识别、机器翻译、语音识别、棋类游戏等专业领域取得了惊人的成果，人工智能概念也因此走到了时代前沿，但人们甚至对于神经网络工具为何有如此威力还没有充分的理解。当前人工智能的发展仍处于初级阶段，实现理想中的人工智能还有很长的路要走，有待所有未来有志于在人工智能领域探索的同学们继续开拓。\n\
    \n## 7.7 识别特定的人脸\n\n在识别人脸的问题上，我们并没有巨量的人脸数据库，或许也没有一台足够强大的计算机，甚至缺少足够的训练时间，因此很难有效地直接训练一个优秀的人工神经网络来区分人脸。但人脸识别的问题也是人工智能领域的热门问题，Python\
    \ 第三方包 Face Recognition 便利用了开源的训练成果，可以直接将人脸图像转换为 128 个特征信息并用于区分不同人脸。\n\n在编写程序之前，首先需要导入一张包含已知人物面部的图片以供检测对比，导入的图片最好只包含一张人脸。如果没有照片，可以先用\
    \ OpenCV 拍一张自己的正脸照片。\n\n```\n```python\nimport cv2\ncap = cv2.VideoCapture(0)\n\
    while cap.isOpened():\n    (ret, frame) = cap.read()\n    frame = cv2.flip(frame,\
    \ 0)\n    cv2.imshow(\"Shot\", frame)\n    k = cv2.waitKey(5)\n    if k == ord('s'):\n\
    \        cv2.imwrite(\"/home/pi/photos/1.jpg\", frame)\n```\n```\n\nimwrite 函数可以将图像保存到指定地址，参数分别为存储地址和图像信息。存储地址应包含文件的名称和格式，通常选择\
    \ jpg 或 png 格式即可。上面的程序可以实现按下键盘 s 键则将当前摄像头帧存储到指定地址。\n\n接下来，我们先提取这张图片的人脸特征。使用下面的语句可以非常轻松地对一张图像的信息进行面部检测与编码。\n\
    \n```\n```python\nimport cv2\nimport face_recognition\nmy_image = cv2.imread(\"\
    /home/pi/photos/1.jpg\")\nmy_image = cv2.cvtColor(my_image, cv2.COLOR_BGR2RGB)\n\
    my_face_encoding = face_recognition.face_encodings(my_image)\n```\n```\n\nOpenCV\
    \ 中内置的 imread 函数可以读取出一张图片中的图像信息，其参数为图片的存储位置。\n\nface_recognition 包中的 face_encodings\
    \ 函数可以对图像信息中的人脸进行检索并\n\n转化为前面提到的 128 个特征信息数据，这个转化过程可以被称为编码。\n\nface_encodings\
    \ 函数接受的图像信息需要按照 RGB 的顺序排列，这与 OpenCV 默认的 BGR 顺序不同，因此可以先用 cvtColor 函数进行转换（参数设定为\
    \ cv2.COLOR_BGR2RGB）。face_encodings 函数的返回值是一个列表，其包括从图像上找到的所有人脸对应的特征信息序列。\n\n在载入已知人脸图像的特征信息后，我们就可以将实时摄像头中捕获到的人脸信息与之对比。在实时检测中，如果对每一帧都使用\
    \ face_encodings 函数进行编码，这个过程将非常缓慢，完全失去实时性。为了提高检测速度，我们仍可以先用 HAAR 特征检测找到人脸的位置，再直接对这个区域进行编码。\n\
    \n```\n# 载入人脸分类器\nface_cascade = cv2.CascadeClassifier('/home/pi/cascade/haarcascade_frontalface_default.xml')\n\
    cap = cv2.VideoCapture(0) # 开始读取摄像头信号\nwhile cap.isOpened():\n    (ret, frame)\
    \ = cap.read() # 读取每一帧视频图像为 frame\n    frame = cv2.flip(frame, 0) # 将图像上下镜像翻转\n\
    \    gray = cv2.cvtColor(frame, cv2.COLOR_BGR2GRAY) # 将图像转换为灰度图\n    faces = face_cascade.detectMultiScale(gray,\
    \ minSize=(100, 100),\n    flags=cv2.CASCADE_FIND_BIGGEST_OBJECT) # 检测人脸位置\n```\n\
    \n这里，为方便起见，我们假定需要对比的人脸只有一个，因此 detectMultiScale 函数使用了 cv2.CASCADE_FIND_BIGGEST_OBJECT（寻找最大目标）参数，并返回其位置信息，依序由左上角\
    \ x 坐标、左上角 y 坐标、宽度、高度构成。\n\nface_encodings 函数可以接受第二个参数：人脸的位置。设定这个参数后，face_encodings\
    \ 函数将不再检测人脸位置而是直接计算出这个位置人脸的特征信息。需要注意的是，face_encodings 函数接受的位置信息需要按照左上角 y 坐标、右下角\
    \ x 坐标、右下角 y 坐标、左上角 x 坐标的顺序排列。这些信息可以是一组或多组（即可以指定多个人脸的位置信息）。因此我们需要先把 HAAR 特征人脸检测得到的人脸位置信息转换成\
    \ face_encodings 函数能接受的位置信息。\n\n```\nface_locations = []\nfor (left, top, width,\
    \ height) in faces:\n    right = left + width\n    bottom = top + height\n   \
    \ face_locations.append((int(top), int(right), int(bottom),int(left)))\nrgb_frame\
    \ = cv2.cvtColor(frame, cv2.COLOR_BGR2RGB) # 得到每一帧的 RGB 图像信息\nface_encodings =\
    \ face_recognition.face_encodings(rgb_frame, face_locations) # 计算特定位置的人脸特征信息\n\
    ```\n\n注意，这里传入 face_encodings 函数的位置序列处于一个长度为 1 的列表 face_locations 中，我们对它使用 append\
    \ 函数将需要的位置序列加入其中。此外，传入的位置\n"
