    \ 3.3V 正电压，GND 表示接地。所有标注 GPIO+ 序号的均为数字输入 / 输出接口。GPIO 是通用型输入 / 输出接口的简称。需要注意的是，树莓派所有输入\
    \ / 输出接口的标准电压均为 3.3V。\n\n## 4.2 LED 模块与按钮模块的连接\n\n由于树莓派自身的用电接口较少，为了后面任务能顺利开展，我们可以使用一块\
    \ GPIO 接口扩展板。类似的扩展板市面上有多种型号，选择合适的就可以。扩展板的插入方式如图 4.2 所示。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_44_0.png)\n\
    \n图 4.2 GPIO 扩展板连接示意图\n\n插入扩展板前注意先对树莓派关机、断电。\n\n本章最终要完成一个抢答器项目，要用到 1 个 LED 模块和\
    \ 2 个按钮模块。由于手持用电模块可能因人体导电而引起异常，我们可以先用一个简单的固定装置将后续会用到的元器件固定起来。本例中的固定装置是通过 CAD 画图、激光切割机切割木板制作的，你也可以用其他方式固定元器件。图\
    \ 4.3 为模块固定底板示意图，图 4.4 为按钮固定板示意图。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_44_1.png)\n\
    \n![](img/8da48b6e384089b60930a6d8ea39fe92_44_2.png)\n\n图 4.3 模块固定底板示意图\n\n图 4.4\
    \ 按钮固定板示意图\n\n将每个按钮模块使用按钮固定板、4 组 M3 螺丝、螺母固定到底板上。LED 模块则使用 2 组 M3 螺丝、螺母直接固定。\n\n\
    将 LED 模块的 V（正极）以及 2 个按钮的 VCC 接至树莓派的任意 3V3 引脚，将按钮的 GND 连接到树莓派的任意 GND 引脚，将 LED 模块的\
    \ R、B、G 和 2 个按钮的 OUT 接至树莓派的任意 GPIO 引脚。\n\n为使用统一的示例程序，可以将 LED 模块的 R、B、G 接至树莓派的\
    \ 11、13、15 号引脚，它们在扩展板上的位置为 P17、P27、P22；而 2 个按钮的 OUT 接到树莓派的 12 号和 16 号引脚，它们在扩展板上的位置为\
    \ P18 和 P23。\n\n全部连接完成并确定无误后，再将树莓派电源接通并开机。\n\n## 4.3 点亮一盏小灯\n\n## 4.3.1 导入 Python\
    \ 扩展包\n\n要使用 Python 程序对 GPIO 连接的输入 / 输出设备进行控制，需要用到一个名为 RPi.GPIO 的扩展包。在 Python\
    \ 程序中，许多功能被写在了一些额外的官方或第三方扩展包中，可以通过如下两种方式导入扩展包。\n\n```\nimport 扩展包名 as 自定义名称\n\
    from 扩展包名 import 包中的指定函数、变量\n```\n\n第一种方式为直接导入，后面的 “as 自定义名称” 可以不写。不写时，使用 “扩展包名\
    \ . 包内的函数或变量名” 的形式可以调用包内预先设定好的函数或变量。若设定了自定义名称，则使用 “自定义名称 . 包内的函数或变量名” 的形式调用。\n\
    \n第二种导入方式则可以选择性地包中设定的函数或变量，导入多个函数或变量时需使用逗号隔开。若使用 “import *” 则可导入包中的所有函数及变量。用这种方式导入扩展包时，我们可以直接用导入的函数或变量名来调用它们而不用再写包名。\n\
    \n例如对 RPi.GPIO 扩展包，可以分别这样导入：\n\n```\nimport RPi.GPIO as gpio\nfrom RPi.GPIO import\
    \ *\n```\n\n若要调用包中名为 setmode 的函数，使用第一种方式导入时需要用 gpio.setmode 来调用，使用第二种方式导入则可以直接用\
    \ setmode 调用。\n\n我们可以选择任意一种导入方式，但通常来说，为了避免导入的函数或变量发生重名的情况，建议使用第一种方式。只有在导入的包中的函数或变量很少或我们只需要使用其中特定的几个函数或变量时才建议使用第二种方式。\n\
    \n对 RPi.GPIO 包一般采用第一种导入方式。需要注意的是，Python 程序中的任何位置对大小写都是敏感的，即大写字母和对应的小写字母作为两个不同字符来对待，这里\
    \ RPi.GPIO 包的名称中只有字母 i 是小写的。\n\n## 4.3.2 LED 显示彩色的原理\n\n生活中我们会接触到各种各样的 “灯”，比如白炽灯、荧光灯、LED\
    \ 灯等。其中 LED 灯因其具有耗电量低、体积小、便于数字控制等优点，在生产、生活中的应用日益广泛。\n\nLED 的全称是 “发光二极管”。发光二极管的材料在导电状态下可以被激发，并向外释放出光子，也就是发射出特定频率的光。基于材料特性的不同，不同发光二极管发射出的光的频率也不尽相同。光的颜色是由其频率（波长）决定的，从红外线到各种可见光，再到紫外线都是这样。\n\
    \n本例中使用的⼩灯是一种全彩 LED（也叫 RGB LED），它由 3 种不同颜色（红 R，绿 G，蓝 B）的 LED 小灯珠组成。在可见光中，人眼对红色、蓝色、绿色最为敏感，这\
    \ 3 种颜色按照不同比例混合即可产生全部的可见光颜色。所以包含 3 色灯珠的 LED 可以发出各种颜色的光。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_46_0.png)\n\
    \n图 4.5 全彩 LED 模块\n\n图 4.5 所示的全彩 LED 模块的 V 接口代表正极，连接了树莓派的 3.3V 正电压输出，而 R、B、G 分别作为负极连接到了树莓派的不同\
    \ GPIO 接口。因此，我们可以通过程序控制这些接口输出不同的电压来控制 3 个小灯珠两极的电压差，从而控制它们的亮与灭，产生不同的亮度，继而混合出不同颜色。\n\
    \n## 4.3.3 对输入 / 输出设备的设定\n\n在编写程序控制 LED 之前，我们需要先对 LED 连接的 GPIO 接口进行设定。\n\n在图 4.1\
    \ 中除了 1~40 的编号外，每个 GPIO 引脚后面还有另一个编号。在 Python 程序中使用 GPIO 时，需要指定程序应该使用哪一种编号方式。其设定方法是：\n\
    \n```\ngpio.setmode(gpio.BOARD)\n或 gpio.setmode(gpio.BCM)\n```\n\nBOARD 按照 1~40\
    \ 的物理引脚编号，BCM 按照 GPIO 后的数字编号。为便于记忆，我们统一使用 BOARD 方式编号。\n\n树莓派作为一个控制板，可以接收按钮等设备传递来的电信号，并通过电信号来控制\
    \ LED 等设备。因此，按钮是树莓派的一个输入设备，而 LED 是树莓派的一个输出设备。对树莓派而言，其输入或输出的电信号只有两种情况：高电平（3.3V）或低电平（0V）。这种只有两个离散值的信号被称为数字信号。\n\
    \n树莓派的所有 GPIO 口既可以连接输入设备，也可以连接输出设备，因此需要事先设定其为输入模式还是输出模式：\n\n```\ngpio.setup(编号，模式)\n\
    ```\n\n模式有两种： gpio.IN 代表这是一个输入设备，gpio.OUT 代表这是一个输出设备。\n\n例如，对 LED 连接的 GPIO 接口进行设定的完整程序如下：\n\
    \n```\nimport RPi.GPIO as gpio\ngpio.setmode(gpio.BOARD)\ngpio.setup(11, gpio.OUT)\n\
    gpio.setup(13, gpio.OUT)\ngpio.setup(15, gpio.OUT)\n```\n\n## 4.3.4 让小灯闪烁起来\n\n\
    设定 GPIO 后，我们便可以使用程序来控制 LED 的亮与灭。3 个灯珠的正极都已连接 3.3V 正电压，而 3 个负极连接的树莓派 GPIO 接口只能输出高电平（3.3V）或低电平（0V）的信号。因此输出高电平信号将关闭灯珠（两侧电压差为\
    \ 0V），而输出低电平信号将点亮灯珠（两侧电压差为 3.3V）。设定 GPIO 接口输出高、低电平的语句为：\n\n```\ngpio.output(编号,\
    \ 电平状态)\n```\n\n电平状态只有两种： gpio.HIGH 代表高电平，gpio.LOW 代表低电平。\n\n若要点亮红色、蓝色、绿色全部 3\
    \ 个灯珠，程序如下。\n\n```\ngpio.output(11, gpio.LOW)\ngpio.output(13, gpio.LOW)\ngpio.output(15,\
    \ gpio.LOW)\n```\n\n现在让我们来编写一个简易的小灯闪烁功能。这个过程实际上就是让小灯亮一定时间再灭一定时间，如此不断循环。为了让程序能控制小灯亮灭一段时间，需要引入\
    \ Python 中 time 扩展包的 sleep 函数。\n\n```\nfrom time import sleep\nsleep(1)\n```\n\
    \nsleep 后的参数表示需等待的时间，单位为秒。\n\n为了简化程序，我们让小灯只控制一个灯珠（例如红色灯珠）交替亮灭。由于在程序执行过程中需要多次调用\
    \ LED 模块连接的 GPIO 引脚编号，可以将这些编号赋值给几个变量，方便我们阅读程序：\n\n```\nimport RPi.GPIO as gpio\n\
    R, B, G = 11, 13, 15\ngpio.setmode(gpio.BOARD)\ngpio.setup(R, gpio.OUT)\ngpio.setup(B,\
    \ gpio.OUT)\ngpio.setup(G, gpio.OUT)\ngpio.output(R, gpio.HIGH)\ngpio.output(B,\
    \ gpio.HIGH)\ngpio.output(G, gpio.HIGH)\n```\n\n这个程序段可以完成对 LED 模块的初始化，先行关闭全部 3\
    \ 个灯珠。\n\n接下来需要控制红色灯珠交替亮灭，假定每次亮与灭的持续时间均为 1 秒。\n\n```\ngpio.output(R, gpio.LOW)\n\
    sleep(1)\ngpio.output(R, gpio.HIGH)\nsleep(1)\n```\n\n这些语句可以让红色灯珠亮一秒再灭一秒，但我们要让小灯不断循环这个过程，这需要用到\
    \ while 循环结构。在这里，循环是不断连续进行的，因此只需将 while 的条件设定为一个永远为真的条件或直接填入 True 值。\n\n```\n\
    while True:\n    gpio.output(R, gpio.LOW)\n    sleep(1)\n    gpio.output(R, gpio.HIGH)\n\
    \    sleep(1)\n```\n\n这就实现了让小灯闪烁的功能。注意 sleep 函数须在程序头部进行导入。\n\n试一试\n\n利用 while\
    \ 循环结构，建立一个控制 sleep 时间的变量，试着让小灯越闪越快。\n\n## 4.4 用按钮控制灯的状态\n\n按钮模块（见图 4.6）是我们 在树莓派上使用的第一个输入设备。市面上有多种按钮模块的型号可选，我们所用的这种具有按下（输出高电平）和抬起（输出低电平）两种状态。树莓派通过\
    \ GPIO 接口读取模块输出的信号电平可以知晓模块的按压状态，从而实现简易的按钮控制功能。\n\n## 4.4.1 按钮状态的读取与判断\n\n与 LED\
    \ 模块类似，我们也要先设定按钮连接的 GPIO 接口的输入 / 输出状态。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_48_0.png)\n\
    \n图 4.6 按钮模块\n\n```\nb1, b2 = 12, 16\ngpio.setup(b1, gpio.IN)\ngpio.setup(b2,\
    \ gpio.IN)\n```\n\n这里，输入设备按钮连接的 GPIO 接口的状态设置为 gpio.IN。\n\n我们可以通过一个简单的函数来读取接口的电平状态：\n\
    \n```\ngpio.input( 编号 )\n```\n\n这个函数可能得到两个返回值：gpio.HIGH（高电平）或 gpio.LOW（低电平）。我们可以通过判断按钮的电平状态来执行不同的操作。例如，在按钮被按下时将小灯点亮，否则将小灯熄灭。\n\
    \n```\nif gpio.input(b1) == gpio.HIGH:\n    gpio.output(R, gpio.LOW)\nelse:\n\
    \    gpio.output(R, gpio.HIGH)\n```\n\n但是这个程序并不能真正实现预想的功能，因为这段程序仅仅在程序刚刚运行的一瞬间进行按钮按压状态的读取与判断。若要实现持续判断的功能，需要增加一个\
    \ while 循环结构。\n\n```\nwhile True:\n    if gpio.input(b1) == gpio.HIGH:\n     \
    \   gpio.output(R, gpio.LOW)\n    else:\n        gpio.output(R, gpio.HIGH)\n```\n\
    \n## 4.4.2 两个按钮的控制与逻辑运算符\n\n我们连接了两个按钮，因此也可以结合两个按钮实现共同对小灯进行控制。例如，两个按钮都被按下即点亮小灯，只要有一个按钮没被按下则熄灭小灯。这个过程可以按照图\
    \ 4.7 所示的逻辑来执行。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_49_0.png)\n\n图 4.7\
    \ 用两个按钮控制小灯的逻辑\n\n将这个逻辑转化为程序：\n\n```\nif gpio.input(b1) == gpio.HIGH:\n    if\
    \ gpio.input(b2) == gpio.HIGH:\n        gpio.output(R, gpio.LOW)\n    else:\n\
    \        gpio.output(R, gpio.HIGH)\nelse:\n    gpio.output(R, gpio.HIGH)\n```\n\
    \n但这样编写的程序看起来上却有一点复杂。在需要同时判断多个条件的真假时，我们可以通过逻辑运算符处理它们的关系。\n\n逻辑运算符有 and（与）、or（或）、not（非）三种。\n\
    \n与运算符 and: 用 and 连接两个条件，当两个条件都为真时，返回真；有一个为假时，返回假。等同于我们常说的“并且”。\n\n或运算符 or: 用\
    \ or 连接两个条件，当两个条件有一个为真时，返回真，都为假时，返回假。等同于我们常说的“或者”。\n\n非运算符 not: 在条件前加上 not，可以得到与条件真假相反的结果。等同于对条件加上了“不”字。\n\
    \n上面程序的功能实质上是：按钮 1 被按下并且按钮 2 被按下时点亮小灯，否则熄灭小灯。所以可以利用逻辑运算符编写以下程序。\n\n```\nif gpio.input(b1)\
    \ == gpio.HIGH and gpio.input(b2) == gpio.HIGH:\n    gpio.output(R, gpio.LOW)\n\
    else:\n    gpio.output(R, gpio.HIGH)\n```\n\n试一试\n用至少两种方法实现两个按钮按下一个则点亮小灯，都不按则熄灭小灯。\n\
    \n## 4.5 做一个抢答器吧\n\n现在我们来尝试做一个抢答器：两人各执一个按钮，小灯在程序开始后一段时间内亮起，由程序判断小灯亮起后谁先按下按钮。\n\
    \n## 4.5.1 延迟点亮小灯\n\n在程序开始一段时间后再点亮小灯的功能可以用 sleep 函数来实现。例如我们让程序开始 3 秒后点亮小灯发出白光（3\
    \ 个灯珠全部点亮）：\n\n```\nimport RPi.GPIO as gpio\nfrom time import sleep\nR, B, G =\
    \ 11, 13, 15\ngpio.setmode(gpio.BOARD)\ngpio.setup(R, gpio.OUT)\ngpio.setup(B,\
    \ gpio.OUT)\ngpio.setup(G, gpio.OUT)\n```\n"
  mdcn: "\n在设定返回值的情况下，调用函数将直接得到其返回值。例如使用 factorial(5) 将直接获得 5 的阶乘值，我们可以利用它对变量进行赋值，例如：\n\
    \n```\nresult = factorial(5)\n```\n\n这一语句可以将 5 的阶乘赋值给变量 result。\n\n试一试\n将斐波那契数列的运算封装为一个函数，通过调用这个函数获取数列中指定位置的值。\n\
    \n## 3.7.2 给 Python 程序加上注释\n\n为了使 Python 程序变得更加易读，我们可以为程序中的语句、定义的函数、变量等进行注释来帮助阅读者理解程序的作用。在\
    \ Python 程序中，以 #（井号）开头的语句将被 Python 认为注释，这些内容将不会被执行。例如：\n\n```\n# calculate the\
    \ factorial of a positive integer\ndef factorial(n):\n    a, f = 1, 1\n    while\
    \ a <= n:\n        f = f * a\n        a = a + 1\n    return f\n# get the factorial\
    \ of 5\nresult = factorial(5)\n```\n\n如果需要进行连续多行的注释，可以在需要注释的语句前后各使用 3 个单引号或 3\
    \ 个双引号（前后必须一致）。例如：\n\n```\n'''\nthis is a program to calculate the factorial of\
    \ a positive integer\nwe get factorial of 5\n'''\ndef factorial(n):\n    a , f\
    \ = 1, 1\n    while a <= n:\n        f = f * a\n        a = a + 1\n    return\
    \ f\nresult = factorial(5)\n```\n\n给程序加上清晰的注释是一个良好的编写习惯，使我们在程序内容复杂时只需阅读注释就可以大致掌握程序的结构和功能。\n\
    \n除了说明程序功能外，注释也可以用来跳过一些语句的执行，这是调试程序的一种常用技巧。\n\n## 本章要点回顾\n\nPython 编程基础\n\n什么是编程语言\n\
    \n说说为什么计算机是由 1 和 0 来控制的\n\n说说编程语言和人类的自然语言的异同\n\n认识 Python 语言\n\n说说 Python 编程语言有什么优势\n\
    \n在树莓派中使用 Python 编程\n\n知道 Python 编程的两种方式\n\nPython 中的变量\n\n理解 “变量” 的概念\n\n说出 Python\
    \ 中的几种数据类型\n\nif 条件结构\n\n理解逻辑上的 “真” “假” 概念\n\n说出比较运算符有哪些, 与赋值运算符有什么区别\n\n学会 if\
    \ 条件结构的逻辑和用法\n\nwhile 循环结构\n\n学会 while 循环结构的逻辑和用法\n\nPython 中的函数\n\n理解 Python\
    \ 中函数的用法\n\n学会利用注释辅助编程\n\n## 第 4 章\n\nPython 编程与\n树莓派硬件控制\n\n我们通过一些简单的例子了解了 Python\
    \ 编程的一些基本概念，但还只停留在软件编程的层面。树莓派相对于普通 PC，其优势在于可以方便地与实际硬件单元进行连接并直接控制它们。在本章中，我们先尝试用树莓派点亮一个小灯，然后加上按钮，通过好玩的抢答器项目来学习树莓派的硬件控制方法，同时不断提高\
    \ Python 编程的熟练度。\n\n## 4.1 树莓派的 GPIO 接口\n\n树莓派 3B+ 主控板可以通过上面的 40 个引脚连接电子设备输入或输出电信号。其排列如图\
    \ 4.1 所示。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_43_0.png)\n\n图 4.1 树莓派 3B+\
    \ 的引脚编号与功能\n\n将 SD 卡槽置于上方，引脚从上到下依次从 1 至 40 号排序。\n\n图中 5V 表示输出 5V 正电压，3V3 表示输出\
    \ 3.3V 正电压，GND 表示接地。所有标注 GPIO+ 序号的均为数字输入 / 输出接口。GPIO 是通用型输入 / 输出接口的简称。需要注意的是，树莓派所有输入\
    \ / 输出接口的标准电压均为 3.3V。\n\n## 4.2 LED 模块与按钮模块的连接\n\n由于树莓派自身的用电接口较少，为了后面任务能顺利开展，我们可以使用一块\
    \ GPIO 接口扩展板。类似的扩展板市面上有多种型号，选择合适的就可以。扩展板的插入方式如图 4.2 所示。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_44_0.png)\n\
    \n图 4.2 GPIO 扩展板连接示意图\n\n插入扩展板前注意先对树莓派关机、断电。\n\n本章最终要完成一个抢答器项目，要用到 1 个 LED 模块和\
    \ 2 个按钮模块。由于手持用电模块可能因人体导电而引起异常，我们可以先用一个简单的固定装置将后续会用到的元器件固定起来。本例中的固定装置是通过 CAD 画图、激光切割机切割木板制作的，你也可以用其他方式固定元器件。图\
    \ 4.3 为模块固定底板示意图，图 4.4 为按钮固定板示意图。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_44_1.png)\n\
    \n![](img/8da48b6e384089b60930a6d8ea39fe92_44_2.png)\n\n图 4.3 模块固定底板示意图\n\n图 4.4\
    \ 按钮固定板示意图\n\n将每个按钮模块使用按钮固定板、4 组 M3 螺丝、螺母固定到底板上。LED 模块则使用 2 组 M3 螺丝、螺母直接固定。\n\n\
    将 LED 模块的 V（正极）以及 2 个按钮的 VCC 接至树莓派的任意 3V3 引脚，将按钮的 GND 连接到树莓派的任意 GND 引脚，将 LED 模块的\
    \ R、B、G 和 2 个按钮的 OUT 接至树莓派的任意 GPIO 引脚。\n\n为使用统一的示例程序，可以将 LED 模块的 R、B、G 接至树莓派的\
    \ 11、13、15 号引脚，它们在扩展板上的位置为 P17、P27、P22；而 2 个按钮的 OUT 接到树莓派的 12 号和 16 号引脚，它们在扩展板上的位置为\
    \ P18 和 P23。\n\n全部连接完成并确定无误后，再将树莓派电源接通并开机。\n\n## 4.3 点亮一盏小灯\n\n## 4.3.1 导入 Python\
    \ 扩展包\n\n要使用 Python 程序对 GPIO 连接的输入 / 输出设备进行控制，需要用到一个名为 RPi.GPIO 的扩展包。在 Python\
    \ 程序中，许多功能被写在了一些额外的官方或第三方扩展包中，可以通过如下两种方式导入扩展包。\n\n```\nimport 扩展包名 as 自定义名称\n\
    from 扩展包名 import 包中的指定函数、变量\n```\n\n第一种方式为直接导入，后面的 “as 自定义名称” 可以不写。不写时，使用 “扩展包名\
    \ . 包内的函数或变量名” 的形式可以调用包内预先设定好的函数或变量。若设定了自定义名称，则使用 “自定义名称 . 包内的函数或变量名” 的形式调用。\n\
    \n第二种导入方式则可以选择性地包中设定的函数或变量，导入多个函数或变量时需使用逗号隔开。若使用 “import *” 则可导入包中的所有函数及变量。用这种方式导入扩展包时，我们可以直接用导入的函数或变量名来调用它们而不用再写包名。\n\
    \n例如对 RPi.GPIO 扩展包，可以分别这样导入：\n\n```\nimport RPi.GPIO as gpio\nfrom RPi.GPIO import\
    \ *\n```\n\n若要调用包中名为 setmode 的函数，使用第一种方式导入时需要用 gpio.setmode 来调用，使用第二种方式导入则可以直接用\
    \ setmode 调用。\n\n我们可以选择任意一种导入方式，但通常来说，为了避免导入的函数或变量发生重名的情况，建议使用第一种方式。只有在导入的包中的函数或变量很少或我们只需要使用其中特定的几个函数或变量时才建议使用第二种方式。\n\
    \n对 RPi.GPIO 包一般采用第一种导入方式。需要注意的是，Python 程序中的任何位置对大小写都是敏感的，即大写字母和对应的小写字母作为两个不同字符来对待，这里\
    \ RPi.GPIO 包的名称中只有字母 i 是小写的。\n\n## 4.3.2 LED 显示彩色的原理\n\n生活中我们会接触到各种各样的 “灯”，比如白炽灯、荧光灯、LED\
    \ 灯等。其中 LED 灯因其具有耗电量低、体积小、便于数字控制等优点，在生产、生活中的应用日益广泛。\n\nLED 的全称是 “发光二极管”。发光二极管的材料在导电状态下可以被激发，并向外释放出光子，也就是发射出特定频率的光。基于材料特性的不同，不同发光二极管发射出的光的频率也不尽相同。光的颜色是由其频率（波长）决定的，从红外线到各种可见光，再到紫外线都是这样。\n\
    \n本例中使用的⼩灯是一种全彩 LED（也叫 RGB LED），它由 3 种不同颜色（红 R，绿 G，蓝 B）的 LED 小灯珠组成。在可见光中，人眼对红色、蓝色、绿色最为敏感，这\
    \ 3 种颜色按照不同比例混合即可产生全部的可见光颜色。所以包含 3 色灯珠的 LED 可以发出各种颜色的光。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_46_0.png)\n\
    \n图 4.5 全彩 LED 模块\n\n图 4.5 所示的全彩 LED 模块的 V 接口代表正极，连接了树莓派的 3.3V 正电压输出，而 R、B、G 分别作为负极连接到了树莓派的不同\
    \ GPIO 接口。因此，我们可以通过程序控制这些接口输出不同的电压来控制 3 个小灯珠两极的电压差，从而控制它们的亮与灭，产生不同的亮度，继而混合出不同颜色。\n\
    \n## 4.3.3 对输入 / 输出设备的设定\n\n在编写程序控制 LED 之前，我们需要先对 LED 连接的 GPIO 接口进行设定。\n\n在图 4.1\
    \ 中除了 1~40 的编号外，每个 GPIO 引脚后面还有另一个编号。在 Python 程序中使用 GPIO 时，需要指定程序应该使用哪一种编号方式。其设定方法是：\n\
    \n```\ngpio.setmode(gpio.BOARD)\n或 gpio.setmode(gpio.BCM)\n```\n\nBOARD 按照 1~40\
    \ 的物理引脚编号，BCM 按照 GPIO 后的数字编号。为便于记忆，我们统一使用 BOARD 方式编号。\n\n树莓派作为一个控制板，可以接收按钮等设备传递来的电信号，并通过电信号来控制\
    \ LED 等设备。因此，按钮是树莓派的一个输入设备，而 LED 是树莓派的一个输出设备。对树莓派而言，其输入或输出的电信号只有两种情况：高电平（3.3V）或低电平（0V）。这种只有两个离散值的信号被称为数字信号。\n\
    \n树莓派的所有 GPIO 口既可以连接输入设备，也可以连接输出设备，因此需要事先设定其为输入模式还是输出模式：\n\n```\ngpio.setup(编号，模式)\n\
    ```\n\n模式有两种： gpio.IN 代表这是一个输入设备，gpio.OUT 代表这是一个输出设备。\n\n例如，对 LED 连接的 GPIO 接口进行设定的完整程序如下：\n\
    \n```\nimport RPi.GPIO as gpio\ngpio.setmode(gpio.BOARD)\ngpio.setup(11, gpio.OUT)\n\
    gpio.setup(13, gpio.OUT)\ngpio.setup(15, gpio.OUT)\n```\n\n## 4.3.4 让小灯闪烁起来\n\n\
    设定 GPIO 后，我们便可以使用程序来控制 LED 的亮与灭。3 个灯珠的正极都已连接 3.3V 正电压，而 3 个负极连接的树莓派 GPIO 接口只能输出高电平（3.3V）或低电平（0V）的信号。因此输出高电平信号将关闭灯珠（两侧电压差为\
    \ 0V），而输出低电平信号将点亮灯珠（两侧电压差为 3.3V）。设定 GPIO 接口输出高、低电平的语句为：\n\n```\ngpio.output(编号,\
    \ 电平状态)\n```\n\n电平状态只有两种： gpio.HIGH 代表高电平，gpio.LOW 代表低电平。\n\n若要点亮红色、蓝色、绿色全部 3\
    \ 个灯珠，程序如下。\n\n```\ngpio.output(11, gpio.LOW)\ngpio.output(13, gpio.LOW)\ngpio.output(15,\
    \ gpio.LOW)\n```\n\n现在让我们来编写一个简易的小灯闪烁功能。这个过程实际上就是让小灯亮一定时间再灭一定时间，如此不断循环。为了让程序能控制小灯亮灭一段时间，需要引入\
    \ Python 中 time 扩展包的 sleep 函数。\n\n```\nfrom time import sleep\nsleep(1)\n```\n\
    \nsleep 后的参数表示需等待的时间，单位为秒。\n\n为了简化程序，我们让小灯只控制一个灯珠（例如红色灯珠）交替亮灭。由于在程序执行过程中需要多次调用\
    \ LED 模块连接的 GPIO 引脚编号，可以将这些编号赋值给几个变量，方便我们阅读程序：\n\n```\nimport RPi.GPIO as gpio\n\
    R, B, G = 11, 13, 15\ngpio.setmode(gpio.BOARD)\ngpio.setup(R, gpio.OUT)\ngpio.setup(B,\
    \ gpio.OUT)\ngpio.setup(G, gpio.OUT)\ngpio.output(R, gpio.HIGH)\ngpio.output(B,\
    \ gpio.HIGH)\ngpio.output(G, gpio.HIGH)\n```\n\n这个程序段可以完成对 LED 模块的初始化，先行关闭全部 3\
    \ 个灯珠。\n\n接下来需要控制红色灯珠交替亮灭，假定每次亮与灭的持续时间均为 1 秒。\n\n```\ngpio.output(R, gpio.LOW)\n\
    sleep(1)\ngpio.output(R, gpio.HIGH)\nsleep(1)\n```\n\n这些语句可以让红色灯珠亮一秒再灭一秒，但我们要让小灯不断循环这个过程，这需要用到\
    \ while 循环结构。在这里，循环是不断连续进行的，因此只需将 while 的条件设定为一个永远为真的条件或直接填入 True 值。\n\n```\n\
    while True:\n    gpio.output(R, gpio.LOW)\n    sleep(1)\n    gpio.output(R, gpio.HIGH)\n\
    \    sleep(1)\n```\n\n这就实现了让小灯闪烁的功能。注意 sleep 函数须在程序头部进行导入。\n\n试一试\n\n利用 while\
    \ 循环结构，建立一个控制 sleep 时间的变量，试着让小灯越闪越快。\n\n## 4.4 用按钮控制灯的状态\n\n按钮模块（见图 4.6）是我们 在树莓派上使用的第一个输入设备。市面上有多种按钮模块的型号可选，我们所用的这种具有按下（输出高电平）和抬起（输出低电平）两种状态。树莓派通过\
    \ GPIO 接口读取模块输出的信号电平可以知晓模块的按压状态，从而实现简易的按钮控制功能。\n\n## 4.4.1 按钮状态的读取与判断\n\n与 LED\
    \ 模块类似，我们也要先设定按钮连接的 GPIO 接口的输入 / 输出状态。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_48_0.png)\n\
    \n图 4.6 按钮模块\n\n```\nb1, b2 = 12, 16\ngpio.setup(b1, gpio.IN)\ngpio.setup(b2,\
    \ gpio.IN)\n```\n\n这里，输入设备按钮连接的 GPIO 接口的状态设置为 gpio.IN。\n\n我们可以通过一个简单的函数来读取接口的电平状态：\n\
    \n```\ngpio.input( 编号 )\n```\n\n这个函数可能得到两个返回值：gpio.HIGH（高电平）或 gpio.LOW（低电平）。我们可以通过判断按钮的电平状态来执行不同的操作。例如，在按钮被按下时将小灯点亮，否则将小灯熄灭。\n\
    \n```\nif gpio.input(b1) == gpio.HIGH:\n    gpio.output(R, gpio.LOW)\nelse:\n\
    \    gpio.output(R, gpio.HIGH)\n```\n\n但是这个程序并不能真正实现预想的功能，因为这段程序仅仅在程序刚刚运行的一瞬间进行按钮按压状态的读取与判断。若要实现持续判断的功能，需要增加一个\
    \ while 循环结构。\n\n```\nwhile True:\n    if gpio.input(b1) == gpio.HIGH:\n     \
    \   gpio.output(R, gpio.LOW)\n    else:\n        gpio.output(R, gpio.HIGH)\n```\n\
    \n## 4.4.2 两个按钮的控制与逻辑运算符\n\n我们连接了两个按钮，因此也可以结合两个按钮实现共同对小灯进行控制。例如，两个按钮都被按下即点亮小灯，只要有一个按钮没被按下则熄灭小灯。这个过程可以按照图\
    \ 4.7 所示的逻辑来执行。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_49_0.png)\n\n图 4.7\
