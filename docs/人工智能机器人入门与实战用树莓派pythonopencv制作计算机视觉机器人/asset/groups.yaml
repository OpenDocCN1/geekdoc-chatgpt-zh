    ## 第 2 章 认识树莓派


    ## 2.1 树莓派是什么


    树莓派（Raspberry Pi）由英国的树莓派基金会开发，是一款专门用于计算机教育的极简计算机。第一代树莓派发布于 2012 年，2019 年 6 月，它的第
    4 代产品正式发布。树莓派轻便小巧、价格低廉，但又具备普通计算机所具备的一切主要功能，因此在教育领域迅速风靡开来，成为开展青少年编程教育的重要平台。


    树莓派发展至今历经 4 代，常分为 A 和 B 两种型号。其运算能力和板载功能也随着时间的推移不断提升。


    截至本书成稿的 2019 年 8 月，流行的树莓派主控板主要有主打极致小巧轻便的树莓派 Zero W/WH（见图 2.1）、功能较为简易的基础版第 3 代
    A+ 型（即树莓派 3A+，见图 2.2）以及功能最为丰富的第 3 代 B+ 型（即树莓派 3B+）。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_20_0.png)


    图 2.1 树莓派 Zero WH 主控板


    ![](img/8da48b6e384089b60930a6d8ea39fe92_20_1.png)


    图 2.2 树莓派 3A+ 主控板


    ## 2.2 树莓派 3B+ 主控板简介


    在本书的案例中，我们都将使用当前应用最广泛的树莓派 3B+ 型主控板作为控制核心。树莓派 3B+ 作为树莓派 3B 的升级版发布于 2018 年 3 月 14
    日，在 3B 的基础上提升了无线连接性能与 CPU 性能等。


    树莓派 3B+ 的 CPU（中央处理器）由 4 块主频为 1.4GHz 的 Cortex-A53 型处理器单元组成，并具备一个在 400MHz 主频工作的
    Broadcom VideoCore IV 型 GPU（图形处理器）。虽然并不强大，树莓派的处理性能仍能满足小型机器人控制系统开发的需求。


    此外，树莓派 3B+ 主控板自带了 HDMI 高清视频输出、3.5mm 音频输出、4 路 USB 连接等常见的接口，并具备 Wi-Fi 无线网络连接与蓝牙连接功能。可以说，虽然体积小巧，树莓派
    3B+ 主控板却具备了普通家用计算机的所有主要功能（见图 2.3）。


    但与普通计算机不同的是，树莓派 3B+ 还额外拥有类似单片机的 40 个硬件引脚，其中包括 21 个输入/输出接口。这使得树莓派 3B+ 不单可以作为一台微型计算机使用，还可以非常方便地作为核心直接连接并控制其他硬件设备。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_21_0.png)


    图 2.3 树莓派 3B+ 主控板组成示意图


    ## 2.3 树莓派的连接与开机


    在开始使用树莓派之前，需要先在树莓派的正反面安装两颗散热片。安装位置如图 2.4 和图 2.5 所示。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_22_0.png)


    图 2.4 树莓派正面散热片安装位置


    ![](img/8da48b6e384089b60930a6d8ea39fe92_22_1.png)


    图 2.5 树莓派背面散热片安装位置


    安装散热片的目的主要是防止树莓派的处理芯片过热。安装完成后，可以按如下步骤完成树莓派的开机。


    - （1）将装好树莓派操作系统的 MicroSD 卡插入树莓派对应插口中，本教程推荐系统的镜像文件的下载和安装指导可以参考链接： http://www.fractalmind.com.cn/book/rpibasic。

    - （2）将鼠标、键盘连接至树莓派的 USB 接口。

    - （3）将显示器通过 HDMI 连接线连接至树莓派的 HDMI 接口。

    - （4）将 MicroUSB 电源线连接至树莓派的电源接口。注意，树莓派的输入电压应为 5V，电流至少为 2A，建议为 2.5A。

    - （5）将显示器、电源打开，树莓派自动开机。开机完成后可看到如图 2.6 所示的桌面。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_23_0.png)


    图 2.6 树莓派开机后显示的桌面


    ## 2.4 Linux 操作系统简介


    树莓派作为一个微型计算机，可以运行多种不同的操作系统，但其官方系统 Raspbian 是一种基于 Linux 的操作系统。


    Linux 是世界上最为知名的开源操作系统内核。Linux 内核最早于 1991 年发布，任何人都可以免费使用甚至修改它。使用 Linux 内核制作的各种预先集成了各种应用程序的定制化操作系统常被称为
    Linux 发行版。通常所说的 Linux 操作系统泛指各式各样的发行版。


    著名的 Linux 发行版包括 Ubuntu、CentOS、Debian 等。树莓派官方系统 Raspbian 就是基于 Debian 制作的。


    除了被开发为桌面计算机的操作系统，Linux 内核还可被开发为移动设备的操作系统。当前最流行的移动端操作系统 Android 也是基于 Linux 内核开发的。


    相比 Windows、macOS 等非开源的操作系统，Linux 系统具备以下几点优势：


    - （1）Linux 系统完全免费；

    - （2）Linux 系统具备更高的安全性和稳定性，占用系统资源相对较低。


    但 Linux 也具有一些明显的劣势：


    - （1）图形化界面较为简易，使用相对不方便；

    - （2）由于 Linux 是开源的，一些常用的商业软件缺少 Linux 版本或存在功能缺失。


    因此，Linux 操作系统比较适合需要长时间稳定运行的场景，例如网络服务器、智能控制系统等。


    我们使用的 Raspbian 操作系统的常用图标分布于上方的任务栏中（见图 2.7）。


    从左向右依次为：

    开始菜单、

    网络浏览器、

    本地文件、

    终端（命令行）


    ![](img/8da48b6e384089b60930a6d8ea39fe92_24_0.png)


    从左向右依次为：

    蓝牙连接、

    Wi-Fi连接、

    声音调节


    图 2.7 树莓派系统任务栏常用图标分布


    左上方图标的主要功能如下。


    - 开始菜单：打开已安装的应用程序、进行系统设置、关机 / 重启等。

    - 本地文件：访问树莓派系统文件目录。

    - 终端：输入 Linux 系统指令进行操作。


