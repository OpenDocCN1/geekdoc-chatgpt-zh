    if k == ord(\"q\"):\n    break\n```\n\n这样我们在按下 q 键后，程序将跳出循环。为了用键盘指令告诉程序开始绘制，可以建立一个变量来表示绘制状态，例如令\
    \ start = 0，0 表示不绘制，1 表示进行绘制。首先在"
  md: "\n## 5.3 用 OpenCV 识别颜色\n\n使用 OpenCV 调取图像的信息只是我们分析图像的第一步，OpenCV 的强大之处在于它可以通过一些预置函数方便地处理这些信息。机器视觉技术识别物体首先需要确定物体的位置，勾勒出其轮廓，而区分物体与背景的关键在于颜色的分界。因此，学会识别特定颜色的物体是我们运用\
    \ OpenCV 工具认识图像的第一步。\n\n### 5.3.1 HSV 颜色空间\n\nOpenCV 读取的图像信息在每一像素上都由 B、G、R 的颜色值排列而成，但事实上用这\
    \ 3 个颜色值来区分颜色并不像想象中那么简单：同一物体的三原色值在环境光照变化的情况下将发生很大的变化，使用一定的颜色区间来锁定特定物体几乎是不可能完成的任务。\n\
    \n为了解决这一问题，我们可以使用另一种描述颜色的方式：HSV 颜色空间。\n\n相比直接用三原色值来表述颜色，使用颜色的另外一些属性来描述它们更符合人眼对颜色的认知。这些属性包括颜色的色相（Hue）、饱和度（Saturation）、亮度（Value）。使用这\
    \ 3 种颜色属性描绘颜色的方法于 1978 年由计算机科学家 Alvy Ray Smith 提出，这些值可以用三原色值经过简单的数学转换得到。\n\n色相（H）是颜色的基本属性。我们可以将三原色红、绿、蓝置于一个圆盘的\
    \ 0°、120° 和 240° 位置，然后将其他颜色插入排列。\n\n饱和度（S）代表颜色的纯度或“鲜艳程度”。颜色的饱和度越高，则色彩越“纯正”。\n\n\
    亮度（V）代表颜色的明亮程度。亮度越大则颜色越亮，否则越暗。\n\n图 5.13 所示为 HSV 颜色空间的图示，这种描绘颜色的方式相对三原色更接近人的视觉感受，H、S、V\
    \ 三种颜色值的变化可以被人眼敏锐地感受到。通常，色相（H）的取值范围为 0~360，而饱和度（S）与亮度（V）被划为 100 份，取值范围为 0~100。\n\
    \n![](img/8da48b6e384089b60930a6d8ea39fe92_63_0.png)\n\n图 5.13 HSV 颜色空间的图示\n\n\
    在 Geany 中，我们可以单击运行键右侧的按键打开颜色选择器，从这里可以获取不同颜色的 HSV 值与 RGB 值（见图 5.14）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_64_0.png)\n\
    \n图 5.14 Geany 中的颜色选择器\n\nOpenCV 中有一个内置函数 cvtColor 可以方便地将图像信息从一个颜色空间转换到另一个颜色空间，例如：\n\
    \nhsv = cv2.cvtColor(frame, cv2.COLOR_BGR2HSV)\n\n这一语句可以将原本 BGR 颜色空间上的 frame 信息转换为\
    \ HSV 颜色空间并存储到 hsv 中。需要注意的是，OpenCV 中 H 值的取值范围是 0~180，S 和 V 值则是 0~255。若将通常的 HSV\
    \ 值代入 OpenCV 中分析，必须对 H、S、V 分别做比例转换。\n\n我们常见的颜色都处于 HSV 颜色空间的某个范围内。图 5.15 所示为一些颜色的大致范围（按照\
    \ OpenCV 的取值范围）。\n\n| 颜色范围 | 黑色 | 灰色 | 白色 | 红色 | 橙色 | 黄色 | 绿色 | 青色 | 蓝色 | 紫色 |\n\
    |---|---|---|---|---|---|---|---|---|---|---|\n| H最小值 | 0 | 0 | 0 | 0或156 | 11\
    \ | 26 | 35 | 78 | 100 | 125 |\n| H最大值 | 180 | 180 | 180 | 10或180 | 25 | 34 |\
    \ 77 | 99 | 124 | 155 |\n| S最小值 | 0 | 0 | 0 | 43 | 43 | 43 | 43 | 43 | 43 | 43\
    \ |\n| S最大值 | 255 | 43 | 30 | 255 | 255 | 255 | 255 | 255 | 255 | 255 |\n| V最小值\
    \ | 0 | 46 | 221 | 46 | 46 | 46 | 46 | 46 | 46 | 46 |\n| V最大值 | 46 | 220 | 255\
    \ | 255 | 255 | 255 | 255 | 255 | 255 | 255 |\n\n图 5.15 常见颜色的 HSV 颜色区间\n\n由于标准红色在色调盘中被置于\
    \ 0° 位置，所以红色的 H 值存在两个范围：0~10 和 156~180。\n\n### 5.3.2 图像的二值化\n\n在 HSV 颜色空间中，我们可以设定出待检测物体颜色所在的区间。假定待检测物体是一个较均匀的黄色物体，其颜色值的范围为：H\
    \ 值 26~34，S 值 43~255，V 值 46~255。我们可以将这个范围设定一个下限和上限并分别定义：\n\n```python\nyellow_lower\
    \ = (26, 43, 46)\nyellow_upper = (34, 255, 255)\n```\n\n这种定义方式事实上是建立了元组类型的变量，关于该类型变量的知识请参见5.4.2节。接下来为了勾勒出这个物体的轮廓，需要先将图像中属于这个区间的像素与不属于这个区间的像素进行分割。为了方便，我们可以将属于这个区间的像素直接取值为\
    \ 1，而将不属于这个区间的像素取值为 0，这样就构成了一个只由 0 和 1 排列的图像信息。使用 OpenCV 中的 inRange 函数可以轻松地完成这一步骤：\n\
    \n```\ninRange( 图像信息, 分割的颜色下限, 分割的颜色上限 )\n```\n\n函数返回一个 0 和 1 排列而成的图像信息。这种将图像的所有像素用\
    \ 0 和 1 表示的方法被称为图像的二值化。二值化是处理计算机图像时常用的一种数学方法。若将值为 0 的像素用黑色标出，而将 1 用白色标出，inRange\
    \ 函数可以完成图 5.16 所示的转换。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_65_0.png)\n\n\
    图 5.16 inRange 函数可以按指定颜色区间完成图像的二值化\n\n### 5.3.3 找到轮廓的位置\n\n接下来我们可以通过二值化图像方便地找出黑、白区域分界线的位置，即待检测物体的轮廓。寻找二值化图像轮廓可以用\
    \ findContours 函数来实现：\n\n```\nfindContours( 图像信息, 输出模式, 输出方法 )\n```\n\n这里，我们传入的第一个参数\
    \ “图像信息” 是二值化的图像信息。\n\n第二个参数 “输出模式” 指定输出轮廓的类型，主要有以下 3 种类型。\n- cv2.RETR_EXTERNAL：只输出外轮廓。\n\
    - cv2.RETR_LIST：输出所有轮廓。\n- cv2.RETR_TREE：输出所有轮廓，并输出轮廓间的包含关系。\n\n第三个参数 “输出方法” 指的则是输出的轮廓信息所包含的内容，主要有以下两种输出方法。\n\
    - cv2.CHAIN_APPROX_SIMPLE：只输出拐角点的坐标。\n- cv2.CHAIN_APPROX_NONE：输出所有连续点的坐标。\n\n\
    在本例中，为简便起见，我们采用 cv2.RETR_EXTERNAL 与 cv2.CHAIN_APPROX_SIMPLE 两个参数。函数一共存在 3 个连续的返回值：传入的图像信息本身、轮廓坐标的信息、各个轮廓之间的包含关系。在指定只输出外轮廓的情况下，我们实际上只需要用到其第二个返回值。\n\
    \n将图像进行二值化并寻找外轮廓的完整代码如下所示。\n\n```\nmask = cv2.inRange(hsv, yellow_lower, yellow_upper)\n\
    (mask, cnts, hierarchy)= cv2.findContours(mask, cv2.RETR_EXTERNAL, cv2.\nCHAIN_APPROX_SIMPLE)\n\
    ```\n\n在这段代码中，我们首先将图像按照设定的颜色区间转换为二值化图像信息，并用 mask 变量存储。然后，我们寻找图像中的轮廓，并用 cnts 变量存储找到的全部轮廓信息。但是，这样找到的轮廓包含了图像中所有处于该颜色区间中的物体轮廓，例如图\
    \ 5.16 右侧的一些噪点也会被检测出来。为了只检出待检测物体的轮廓，我们需要找到所有轮廓中面积最大的一个。\n\nPython 中存在一个 max 函数，它可以输出一组数据中最大的一个。在本例中，我们需要输出的数据并非绝对数值最大，而是包围面积最大。这种情况下，在\
    \ max 函数中设定比较方式即可实现：\n\n```\n最大值 = max( 一组数据, key= 比较方式 )\n```\n\n找最大面积的比较方式在\
    \ OpenCV 中被设定为 contourArea，我们可以以下面的语句将 cnts 中面积最大的轮廓存储在变量 c 中：\n\n```\nc = max(cnts,\
    \ key=cv2.contourArea)\n```\n\n最后，我们需要从 c 中得到这个轮廓的具体位置。使用 minEnclosingCircle 函数可以得到一个轮廓的最小包围圆（指能包围这个轮廓的最小的圆）的圆心坐标和半径。\n\
    \nminEnclosingCircle 函数只有一个参数：轮廓信息。而函数将连续返回两组值：圆心的坐标（横坐标，纵坐标）、圆的半径。\n\n使用 ((x,\
    \ y), radius) = cv2.minEnclosingCircle(c) 将可以直接存储这些信息。我们用变量 x 存储横坐标，变量 y 存储纵坐标，变量\
    \ radius 则存储圆的半径。\n\n不过，如果摄像头像没有捕捉到任何指定颜色的物体，cnts 将是完全“空”的，这将导致 max 函数报错。我们可以加入下列判断。\n\
    \n这里 len 可以表示一组数据的“长度”。若 len 大于 0，表示其不为“空”。\n\nlen 函数的对象事实上是列表类型，关于该类型的知识请参见 5.4.2\
    \ 节。\n\n```\nif len(cnts) > 0:\n    c = max(cnts, key=cv2.contourArea)\n((x, y),\
    \ radius) = cv2.minEnclosingCircle(c)\n```\n\n> 试一试\n> \n> 找一个颜色均匀的物体，用 OpenCV\
    \ 输出这个物体在摄像头中的中心位置和大小。\n> 请根据目标物体的颜色调整 inrange 函数的参数值，注意尽量排除背景中颜色相近的其他物体。\n\n\
    ## 附：识别黄色物体的完整程序代码\n\n```\nimport cv2\ncap = cv2.VideoCapture(0) # 开始读取摄像头信号\n\
    while cap.isOpened(): # 当读取到信号时\n    (ret, frame) = cap.read() # 读取每一帧视频图像为 frame\n\
    \    hsv = cv2.cvtColor(frame, cv2.COLOR_BGR2HSV) # 将颜色空间转换为 HSV\n    yellow_lower\
    \ = (26, 43, 46) # 指定目标颜色的下限\n    yellow_upper = (34, 255, 255) # 指定目标颜色的上限\n\
    \    mask = cv2.inRange(hsv, yellow_lower, yellow_upper) # 使用目标范围分割图像并二值化\n  \
    \  (mask, cnts, hierarchy) = cv2.findContours(mask, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\
    \ # 寻找其中的所有外轮廓\n    if len(cnts) > 0: # 如果至少找到一个轮廓\n        c = max(cnts, key=cv2.contourArea)\
    \ # 找出其中面积最大的轮廓\n        ((x, y), radius) = cv2.minEnclosingCircle(c) # 分析轮廓的中心位置和大小\n\
    \        print(\"中心坐标\", (x, y))\n        print(\"半径\", radius)\n    cv2.imshow('test',\
    \ frame) # 将图像显示到屏幕上\n    cv2.waitKey(5) # 每一帧后等待 5 毫秒\n```\n\n## 5.4 做一个魔法棒吧\n\
    \n获得了物体的坐标后，可以用它来完成一些有趣的事情，例如把物体当作“笔”在图像上绘制出图样。我们可以选择一种颜色的黏土，将其固定在任意棒状物（例如铅笔）的一端并揉成球形，做一个\
    \ DIY 的“魔法棒”（见图 5.17）。如果没有黏土，也可以任意颜色均匀的小物体代替。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_67_0.png)\n\
    \n图 5.17 用“魔法棒”绘制图样\n\n### 5.4.1 用 OpenCV 绘制小圆点\n\n为了让魔法棒实现画图的效果，我们需要学习用 OpenCV\
    \ 进行图形的绘制。画小圆点可以利用 circle 函数来实现：\n\n```\ncircle( 图像信息, 圆心坐标, 圆的半径, 线的颜色, 线的宽度\
    \ )\n```\n\n圆心坐标和线的颜色必须用小括号括起；颜色按 BGR 的顺序指定，3 个参数依次为蓝色值、绿色值、红色值，范围为 0~255；线宽的参数为\
    \ -1 时表示圆被实心填充，绘制圆点时指定这个参数为 -1 即可。代码如下所示。\n\n```\ncv2.circle(frame, (x, y), 2,\
    \ (0, 255, 255), -1)\n```\n\n该语句可以在 frame 图像以上 (x, y) 点为圆心绘制一个半径为 2 的黄色实心圆。\n\n\
    但此前输出的目标物体中心坐标 x 和 y 都是小数（float 类型），而 circle 函数只能接受整数（int 类型）的圆心坐标值。\n\nPython\
    \ 中，使用 int 函数可以将其他类型的值转为整数。对小数而言，使用该函数转化后将直接舍弃小数点后的数据。\n\n因此，这句话可以这样改写：\n\n```\n\
    cv2.circle(frame, (int(x), int(y)), 2, (0, 255, 255), -1)\n```\n\n结合这一语句，我们可以在图像上检测到的物体中心坐标上打上一个小圆点。通常情况下，为了绘点时看起来更舒适，我们期望能让摄像头像照镜子一样显示镜面的图像，这可以用\
    \ flip 函数转换得到，例如：\n\n```\nframe = cv2.flip(frame, 翻转方式)\n```\n\n翻转方式值为 0 表示上下翻转，为任意正数表示左右翻转，为任意负数表示上下左右均翻转。flip\
    \ 函数将对传入的图像进行翻转并返回翻转后的图像。\n\n> 试一试\n> \n> 制作一个“魔法棒”，确定其对应的 HSV 颜色值区间并通过 OpenCV\
    \ 找到所在的位置，在屏幕上绘制出与其颜色类似的小圆点。\n\n### 5.4.2 Python 中的列表与元组\n\n现在我们只能让 OpenCV 在每一帧中绘制一个点。要绘制连续的点，需要将过去所有帧中物体的中心坐标记录下来，再将它们在一帧中全部绘制出来。\n\
    \n在需要存储一组数据时，我们可以使用 Python 中的列表（list）类型。列表是一种数据类型，它可以存储一系列按顺序排列的数据。这些数据可以是一个数字、一个字符串，或是另一个列表。我们可以用下面的语句给一个列表型变量\
    \ list 赋值：\n\n```\nlist = [1, 2, 3, 4, 5]\n```\n\n对列表赋值时须使用中括号 [] 括起，并以逗号分隔其中的数据。这个名为\
    \ list 的列表按顺序排列了 5 个数字，使用列表名[排列序号]的方式可以调出指定位置的值。排列序号从 0 开始，例如 list[0] 将取出第一个值\
    \ 1。列表中的每一个值被称为列表中的一个元素。\n\n在记录物体坐标的例子中，我们可以先建立一个空的列表：\n\n```\npointlist = []\n\
    ```\n\n每刷新一帧找到新的坐标值时，使用 append 函数可以方便地将一个值添加到列表 pointlist 的最后一位：\n\n```\npointlist.append([x,\
    \ y])\n```\n\n这里用中括号括起的 [x, y] 实际上是一个列表，它包含 x 和 y 两个值。\n\n在此之前的程序中，实际上我们曾多次提到过\
    \ “一组数据” 这个概念，它代表了与列表非常相似的元组类型。\n\n元组（tuple）是 Python 中另一种由一系列按顺序排列的数据构成的数据类型，它基本上是一个不可修改的列表。例如，元组不能用\
    \ append 函数追加一个值，也不能对其中的任何值进行更改。在赋值时，元组需要使用小括号括起，而不是用中括号括起：\n\n```\ntuple = (1,\
    \ 2, 3, 4, 5)\n```\n\n在不涉及修改操作时，列表和元组能使用的函数基本是一致的。例如 len 函数可以得到一个列表或元组中元素的数量，也就是它的长度。\n\
    \n### 5.4.3 for 循环遍历结构\n\n按照这样的方式，我们可以得到一个存储着过往每一帧物体中心坐标的列表。接下来只需要在这个列表中的每一个坐标上都画上一个小圆点即可。\n\
    \n要实现这一操作，可以使用 for 循环遍历结构。与 while 循环类似，for 循环结构也是一个循环型结构，但它主要用于对列表、元组等元素进行遍历。for\
    \ 循环结构的写法如下：\n\n```\nfor 变量 in 列表或元组等：\n    循环内执行的语句\n```\n\n这里，我们需要设定一个变量，在每一次循环中依次用列表或元组中的元素对它赋值，再执行循环中的语句。内部的执行语句须进行循环。for\
    \ 循环遍历的执行逻辑如图 5.18 所示。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_69_0.png)\n\
    \n图 5.18 for 循环遍历结构的逻辑流程\n\nfor 循环遍历的对象也可以不是列表或元组，而是一个字符串或是数值范围。\n\n```\nfor char\
    \ in \"Hello World\":\n    print(char)\n```\n\n该程序段可以从左至右按顺序打印出字符串中的每一个单个的字符。\n\
    \n```\nfor i in range(0, 100):\n    print(i)\n```\n\n此段程序可以从 0 开始以 1 递增，打印到 99\
    \ 为止。注意这里的 range( 范围起点，范围终点 ) 设定了遍历的数值范围，实际遍历的区间包括起点，但不包括终点。\n\n回到绘制列表中小圆点的例子中，该程序也可以用\
    \ for 循环结构编写。\n\n```\nfor point in pointlist:\n    x = point[0]\n    y = point[1]\n\
    \    cv2.circle(frame, (int(x), int(y)), 2, (0, 255, 255), -1)\n```\n\n在每次循环中，point\
    \ 变量存储着列表中的一个元素，即形式为 [x, y] 的坐标列表。用 point[0] 和 point[1] 可以分别得到对应的横坐标和纵坐标。\n\n\
    试一试\n\n利用列表与 for 循环遍历，让屏幕上的图像显示魔法棒经过的所有点，实现基本的程序功能。\n\n### 5.4.4 按键值与键盘控制\n\n\
    到此为止，程序已经完成“魔法棒”的基本功能了，但还有一点小不足：我们希望可以手动控制绘制图案的开始与停止，而不是在程序开始后立即绘制图案。\n\n利用 OpenCV\
    \ 的 waitKey 函数可以方便地实现手动开始、暂停或清除图案的功能。此前我们知道，waitKey 函数必须跟在 imshow 之后，表示在显示一帧后等待的时间（单位为毫秒）。事实上，设置\
    \ waitKey 函数的主要作用是在等待时间内获取键盘的按键指令：\n\n```\nk = cv2.waitKey(5)\n```\n\n这样得到的 k\
    \ 变量可以获得在这段时间内键盘按下的按键值。在计算机中，每一个键盘按键都可与一个数字值对应，对应的方式称为键盘编码。OpenCV 使用的编码方式是 ASCII（美国信息交换标准代码）。我们并不需要记住每一个按键对应的值，可以用\
    \ Python 中的 ord 函数将按键的字母、符号或数字转化为其 ASCII 值。其代码如下所示。\n\n```\nk = cv2.waitKey(5)\n\
    if k == ord(\"q\"):\n    break\n```\n\n这样我们在按下 q 键后，程序将跳出循环。为了用键盘指令告诉程序开始绘制，可以建立一个变量来表示绘制状态，例如令\
    \ start = 0，0 表示不绘制，1 表示进行绘制。首先在\n"
  mdcn: "\n## 5.3 用 OpenCV 识别颜色\n\n使用 OpenCV 调取图像的信息只是我们分析图像的第一步，OpenCV 的强大之处在于它可以通过一些预置函数方便地处理这些信息。机器视觉技术识别物体首先需要确定物体的位置，勾勒出其轮廓，而区分物体与背景的关键在于颜色的分界。因此，学会识别特定颜色的物体是我们运用\
    \ OpenCV 工具认识图像的第一步。\n\n### 5.3.1 HSV 颜色空间\n\nOpenCV 读取的图像信息在每一像素上都由 B、G、R 的颜色值排列而成，但事实上用这\
    \ 3 个颜色值来区分颜色并不像想象中那么简单：同一物体的三原色值在环境光照变化的情况下将发生很大的变化，使用一定的颜色区间来锁定特定物体几乎是不可能完成的任务。\n\
    \n为了解决这一问题，我们可以使用另一种描述颜色的方式：HSV 颜色空间。\n\n相比直接用三原色值来表述颜色，使用颜色的另外一些属性来描述它们更符合人眼对颜色的认知。这些属性包括颜色的色相（Hue）、饱和度（Saturation）、亮度（Value）。使用这\
    \ 3 种颜色属性描绘颜色的方法于 1978 年由计算机科学家 Alvy Ray Smith 提出，这些值可以用三原色值经过简单的数学转换得到。\n\n色相（H）是颜色的基本属性。我们可以将三原色红、绿、蓝置于一个圆盘的\
    \ 0°、120° 和 240° 位置，然后将其他颜色插入排列。\n\n饱和度（S）代表颜色的纯度或“鲜艳程度”。颜色的饱和度越高，则色彩越“纯正”。\n\n\
    亮度（V）代表颜色的明亮程度。亮度越大则颜色越亮，否则越暗。\n\n图 5.13 所示为 HSV 颜色空间的图示，这种描绘颜色的方式相对三原色更接近人的视觉感受，H、S、V\
    \ 三种颜色值的变化可以被人眼敏锐地感受到。通常，色相（H）的取值范围为 0~360，而饱和度（S）与亮度（V）被划为 100 份，取值范围为 0~100。\n\
    \n![](img/8da48b6e384089b60930a6d8ea39fe92_63_0.png)\n\n图 5.13 HSV 颜色空间的图示\n\n\
    在 Geany 中，我们可以单击运行键右侧的按键打开颜色选择器，从这里可以获取不同颜色的 HSV 值与 RGB 值（见图 5.14）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_64_0.png)\n\
    \n图 5.14 Geany 中的颜色选择器\n\nOpenCV 中有一个内置函数 cvtColor 可以方便地将图像信息从一个颜色空间转换到另一个颜色空间，例如：\n\
    \nhsv = cv2.cvtColor(frame, cv2.COLOR_BGR2HSV)\n\n这一语句可以将原本 BGR 颜色空间上的 frame 信息转换为\
    \ HSV 颜色空间并存储到 hsv 中。需要注意的是，OpenCV 中 H 值的取值范围是 0~180，S 和 V 值则是 0~255。若将通常的 HSV\
    \ 值代入 OpenCV 中分析，必须对 H、S、V 分别做比例转换。\n\n我们常见的颜色都处于 HSV 颜色空间的某个范围内。图 5.15 所示为一些颜色的大致范围（按照\
    \ OpenCV 的取值范围）。\n\n| 颜色范围 | 黑色 | 灰色 | 白色 | 红色 | 橙色 | 黄色 | 绿色 | 青色 | 蓝色 | 紫色 |\n\
    |---|---|---|---|---|---|---|---|---|---|---|\n| H最小值 | 0 | 0 | 0 | 0或156 | 11\
    \ | 26 | 35 | 78 | 100 | 125 |\n| H最大值 | 180 | 180 | 180 | 10或180 | 25 | 34 |\
    \ 77 | 99 | 124 | 155 |\n| S最小值 | 0 | 0 | 0 | 43 | 43 | 43 | 43 | 43 | 43 | 43\
    \ |\n| S最大值 | 255 | 43 | 30 | 255 | 255 | 255 | 255 | 255 | 255 | 255 |\n| V最小值\
    \ | 0 | 46 | 221 | 46 | 46 | 46 | 46 | 46 | 46 | 46 |\n| V最大值 | 46 | 220 | 255\
    \ | 255 | 255 | 255 | 255 | 255 | 255 | 255 |\n\n图 5.15 常见颜色的 HSV 颜色区间\n\n由于标准红色在色调盘中被置于\
    \ 0° 位置，所以红色的 H 值存在两个范围：0~10 和 156~180。\n\n### 5.3.2 图像的二值化\n\n在 HSV 颜色空间中，我们可以设定出待检测物体颜色所在的区间。假定待检测物体是一个较均匀的黄色物体，其颜色值的范围为：H\
    \ 值 26~34，S 值 43~255，V 值 46~255。我们可以将这个范围设定一个下限和上限并分别定义：\n\n```python\nyellow_lower\
    \ = (26, 43, 46)\nyellow_upper = (34, 255, 255)\n```\n\n这种定义方式事实上是建立了元组类型的变量，关于该类型变量的知识请参见5.4.2节。接下来为了勾勒出这个物体的轮廓，需要先将图像中属于这个区间的像素与不属于这个区间的像素进行分割。为了方便，我们可以将属于这个区间的像素直接取值为\
    \ 1，而将不属于这个区间的像素取值为 0，这样就构成了一个只由 0 和 1 排列的图像信息。使用 OpenCV 中的 inRange 函数可以轻松地完成这一步骤：\n\
    \n```\ninRange( 图像信息, 分割的颜色下限, 分割的颜色上限 )\n```\n\n函数返回一个 0 和 1 排列而成的图像信息。这种将图像的所有像素用\
    \ 0 和 1 表示的方法被称为图像的二值化。二值化是处理计算机图像时常用的一种数学方法。若将值为 0 的像素用黑色标出，而将 1 用白色标出，inRange\
    \ 函数可以完成图 5.16 所示的转换。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_65_0.png)\n\n\
    图 5.16 inRange 函数可以按指定颜色区间完成图像的二值化\n\n### 5.3.3 找到轮廓的位置\n\n接下来我们可以通过二值化图像方便地找出黑、白区域分界线的位置，即待检测物体的轮廓。寻找二值化图像轮廓可以用\
    \ findContours 函数来实现：\n\n```\nfindContours( 图像信息, 输出模式, 输出方法 )\n```\n\n这里，我们传入的第一个参数\
    \ “图像信息” 是二值化的图像信息。\n\n第二个参数 “输出模式” 指定输出轮廓的类型，主要有以下 3 种类型。\n- cv2.RETR_EXTERNAL：只输出外轮廓。\n\
    - cv2.RETR_LIST：输出所有轮廓。\n- cv2.RETR_TREE：输出所有轮廓，并输出轮廓间的包含关系。\n\n第三个参数 “输出方法” 指的则是输出的轮廓信息所包含的内容，主要有以下两种输出方法。\n\
    - cv2.CHAIN_APPROX_SIMPLE：只输出拐角点的坐标。\n- cv2.CHAIN_APPROX_NONE：输出所有连续点的坐标。\n\n\
    在本例中，为简便起见，我们采用 cv2.RETR_EXTERNAL 与 cv2.CHAIN_APPROX_SIMPLE 两个参数。函数一共存在 3 个连续的返回值：传入的图像信息本身、轮廓坐标的信息、各个轮廓之间的包含关系。在指定只输出外轮廓的情况下，我们实际上只需要用到其第二个返回值。\n\
    \n将图像进行二值化并寻找外轮廓的完整代码如下所示。\n\n```\nmask = cv2.inRange(hsv, yellow_lower, yellow_upper)\n\
    (mask, cnts, hierarchy)= cv2.findContours(mask, cv2.RETR_EXTERNAL, cv2.\nCHAIN_APPROX_SIMPLE)\n\
    ```\n\n在这段代码中，我们首先将图像按照设定的颜色区间转换为二值化图像信息，并用 mask 变量存储。然后，我们寻找图像中的轮廓，并用 cnts 变量存储找到的全部轮廓信息。但是，这样找到的轮廓包含了图像中所有处于该颜色区间中的物体轮廓，例如图\
    \ 5.16 右侧的一些噪点也会被检测出来。为了只检出待检测物体的轮廓，我们需要找到所有轮廓中面积最大的一个。\n\nPython 中存在一个 max 函数，它可以输出一组数据中最大的一个。在本例中，我们需要输出的数据并非绝对数值最大，而是包围面积最大。这种情况下，在\
    \ max 函数中设定比较方式即可实现：\n\n```\n最大值 = max( 一组数据, key= 比较方式 )\n```\n\n找最大面积的比较方式在\
    \ OpenCV 中被设定为 contourArea，我们可以以下面的语句将 cnts 中面积最大的轮廓存储在变量 c 中：\n\n```\nc = max(cnts,\
    \ key=cv2.contourArea)\n```\n\n最后，我们需要从 c 中得到这个轮廓的具体位置。使用 minEnclosingCircle 函数可以得到一个轮廓的最小包围圆（指能包围这个轮廓的最小的圆）的圆心坐标和半径。\n\
    \nminEnclosingCircle 函数只有一个参数：轮廓信息。而函数将连续返回两组值：圆心的坐标（横坐标，纵坐标）、圆的半径。\n\n使用 ((x,\
    \ y), radius) = cv2.minEnclosingCircle(c) 将可以直接存储这些信息。我们用变量 x 存储横坐标，变量 y 存储纵坐标，变量\
    \ radius 则存储圆的半径。\n\n不过，如果摄像头像没有捕捉到任何指定颜色的物体，cnts 将是完全“空”的，这将导致 max 函数报错。我们可以加入下列判断。\n\
    \n这里 len 可以表示一组数据的“长度”。若 len 大于 0，表示其不为“空”。\n\nlen 函数的对象事实上是列表类型，关于该类型的知识请参见 5.4.2\
    \ 节。\n\n```\nif len(cnts) > 0:\n    c = max(cnts, key=cv2.contourArea)\n((x, y),\
    \ radius) = cv2.minEnclosingCircle(c)\n```\n\n> 试一试\n> \n> 找一个颜色均匀的物体，用 OpenCV\
    \ 输出这个物体在摄像头中的中心位置和大小。\n> 请根据目标物体的颜色调整 inrange 函数的参数值，注意尽量排除背景中颜色相近的其他物体。\n\n\
    ## 附：识别黄色物体的完整程序代码\n\n```\nimport cv2\ncap = cv2.VideoCapture(0) # 开始读取摄像头信号\n\
    while cap.isOpened(): # 当读取到信号时\n    (ret, frame) = cap.read() # 读取每一帧视频图像为 frame\n\
    \    hsv = cv2.cvtColor(frame, cv2.COLOR_BGR2HSV) # 将颜色空间转换为 HSV\n    yellow_lower\
    \ = (26, 43, 46) # 指定目标颜色的下限\n    yellow_upper = (34, 255, 255) # 指定目标颜色的上限\n\
    \    mask = cv2.inRange(hsv, yellow_lower, yellow_upper) # 使用目标范围分割图像并二值化\n  \
    \  (mask, cnts, hierarchy) = cv2.findContours(mask, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\
    \ # 寻找其中的所有外轮廓\n    if len(cnts) > 0: # 如果至少找到一个轮廓\n        c = max(cnts, key=cv2.contourArea)\
    \ # 找出其中面积最大的轮廓\n        ((x, y), radius) = cv2.minEnclosingCircle(c) # 分析轮廓的中心位置和大小\n\
    \        print(\"中心坐标\", (x, y))\n        print(\"半径\", radius)\n    cv2.imshow('test',\
    \ frame) # 将图像显示到屏幕上\n    cv2.waitKey(5) # 每一帧后等待 5 毫秒\n```\n\n## 5.4 做一个魔法棒吧\n\
    \n获得了物体的坐标后，可以用它来完成一些有趣的事情，例如把物体当作“笔”在图像上绘制出图样。我们可以选择一种颜色的黏土，将其固定在任意棒状物（例如铅笔）的一端并揉成球形，做一个\
    \ DIY 的“魔法棒”（见图 5.17）。如果没有黏土，也可以任意颜色均匀的小物体代替。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_67_0.png)\n\
    \n图 5.17 用“魔法棒”绘制图样\n\n### 5.4.1 用 OpenCV 绘制小圆点\n\n为了让魔法棒实现画图的效果，我们需要学习用 OpenCV\
    \ 进行图形的绘制。画小圆点可以利用 circle 函数来实现：\n\n```\ncircle( 图像信息, 圆心坐标, 圆的半径, 线的颜色, 线的宽度\
    \ )\n```\n\n圆心坐标和线的颜色必须用小括号括起；颜色按 BGR 的顺序指定，3 个参数依次为蓝色值、绿色值、红色值，范围为 0~255；线宽的参数为\
    \ -1 时表示圆被实心填充，绘制圆点时指定这个参数为 -1 即可。代码如下所示。\n\n```\ncv2.circle(frame, (x, y), 2,\
    \ (0, 255, 255), -1)\n```\n\n该语句可以在 frame 图像以上 (x, y) 点为圆心绘制一个半径为 2 的黄色实心圆。\n\n\
    但此前输出的目标物体中心坐标 x 和 y 都是小数（float 类型），而 circle 函数只能接受整数（int 类型）的圆心坐标值。\n\nPython\
    \ 中，使用 int 函数可以将其他类型的值转为整数。对小数而言，使用该函数转化后将直接舍弃小数点后的数据。\n\n因此，这句话可以这样改写：\n\n```\n\
    cv2.circle(frame, (int(x), int(y)), 2, (0, 255, 255), -1)\n```\n\n结合这一语句，我们可以在图像上检测到的物体中心坐标上打上一个小圆点。通常情况下，为了绘点时看起来更舒适，我们期望能让摄像头像照镜子一样显示镜面的图像，这可以用\
    \ flip 函数转换得到，例如：\n\n```\nframe = cv2.flip(frame, 翻转方式)\n```\n\n翻转方式值为 0 表示上下翻转，为任意正数表示左右翻转，为任意负数表示上下左右均翻转。flip\
    \ 函数将对传入的图像进行翻转并返回翻转后的图像。\n\n> 试一试\n> \n> 制作一个“魔法棒”，确定其对应的 HSV 颜色值区间并通过 OpenCV\
    \ 找到所在的位置，在屏幕上绘制出与其颜色类似的小圆点。\n\n### 5.4.2 Python 中的列表与元组\n\n现在我们只能让 OpenCV 在每一帧中绘制一个点。要绘制连续的点，需要将过去所有帧中物体的中心坐标记录下来，再将它们在一帧中全部绘制出来。\n\
    \n在需要存储一组数据时，我们可以使用 Python 中的列表（list）类型。列表是一种数据类型，它可以存储一系列按顺序排列的数据。这些数据可以是一个数字、一个字符串，或是另一个列表。我们可以用下面的语句给一个列表型变量\
    \ list 赋值：\n\n```\nlist = [1, 2, 3, 4, 5]\n```\n\n对列表赋值时须使用中括号 [] 括起，并以逗号分隔其中的数据。这个名为\
    \ list 的列表按顺序排列了 5 个数字，使用列表名[排列序号]的方式可以调出指定位置的值。排列序号从 0 开始，例如 list[0] 将取出第一个值\
    \ 1。列表中的每一个值被称为列表中的一个元素。\n\n在记录物体坐标的例子中，我们可以先建立一个空的列表：\n\n```\npointlist = []\n\
