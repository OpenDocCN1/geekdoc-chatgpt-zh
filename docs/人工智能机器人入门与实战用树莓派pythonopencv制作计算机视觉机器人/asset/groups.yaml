    # 2.1 树莓派是什么


    树莓派（Raspberry Pi）由英国的树莓派基金会开发，是一款专门用于计算机教育的极简计算机。第一代树莓派发布于 2012 年，2019 年 6 月，它的第
    4 代产品正式发布。树莓派轻便小巧、价格低廉，但又具备普通计算机所具备的一切主要功能，因此在教育领域迅速风靡开来，成为开展青少年编程教育的重要平台。


    树莓派发展至今历经 4 代，常分为 A 和 B 两种型号。其运算能力和板载功能也随着时间的推移不断提升。


    截至本书成稿的 2019 年 8 月，流行的树莓派主控板主要有主打极致小巧轻便的树莓派 Zero W/WH（见图 2.1）、功能较为简易的基础版第 3 代
