    是具备学习功能。在 20 世纪 80 年代，反向传播算法有了关键进展，其被证明是用于人工神经网络训练的有效方法。


    但到了 20 世纪 80 年代末、90 年代初，业界逐渐发现以专家系统为代表的人工智能系统往往开发和维护成本高昂，而商业价值有限，人工智能的发展再次步入寒冬。


    ## 人工智能的新浪潮


    进入 21 世纪后，计算机芯片的运算能力得到了飞速的提升。在这一背景下，人工智能算法也取得了重大发展。基于强劲的运算力，人工神经网络在语音识别、图像分析、视频理解等诸多领域都创造了新的成功。


    2016 年，谷歌（ Google ）旗下 DeepMind 开发的人工智能围棋程序 AlphaGo 通过人工神经网络深度学习训练，在一场比赛中以 4:1
    战胜了围棋世界冠军李世石九段。这次成功点燃了社会对于新时代人工智能的巨大热情，人们开始意识到人工智能在很多领域的能量已经远超人类。


    DeepMind 团队在 2017 年末推出了增强版的人工智能下棋程序 AlphaZero。它与初版的 AlphaGo 相比有几点重大的改变：一是 AlphaZero
    只需要棋类的基本规则作为训练的基础，不需要任何人类棋谱作为参考；二是它采用了更为通用的算法，可以延伸到将棋与国际象棋中。在短时间（ 34 小时内 ）训练后，AlphaZero
    成功击败了围棋、将棋、国际象棋领域的当时最强的 AI 程序。这一成果让人们更清晰地认识到了机器自我学习的潜力，并对人工智能具备更强的通用性充满期待。


    ## 1.1.3 人工智能的应用现状


    人工智能的概念覆盖了机器视觉、语音识别与人机交互、自动驾驶等多个范畴，在当今社会中已有大量的运用。


    ### 机器视觉


    机器视觉是指在人工智能系统中配备有视觉仪器并通过视觉仪器捕捉到的信息进行分析处理。机器视觉目前被广泛应用于安防、车牌识别系统、医疗辅助诊断、工业化生产线中。


    在安防领域，机器视觉可以从大量监控视频数据中提取出有效的信息，从而辅助警方侦破案件；在医疗辅助诊断方面，机器视觉可以对医学影像进行分析，从而减少误诊或漏诊；在工业化生产中，机器视觉则可以对物品进行分类与分拣。


    ### 语音识别与人机交互


    正确识别并理解人类语言一直以来都是人工智能研究的重要课题。近年来，这一领域也得到了高速发展。现在的人工智能系统能够以相当高的准确率将人类说的话转化为文本，并基于对语义的理解判断用意，进而做出针对性的答复。这一流程包含语音文字转化、自然语言理解等多个环节。


    目前，主流网络视频流媒体服务提供商都提供了高效的人工智能自动实时字幕功能；Siri 等移动智能助手也正一步步地进入我们的生活；而基于人工智能打造的智能客服系统还能有效地替代部分传统人工客服的作用并同时针对客户需求进行数据分析与优化。


    ### 自动驾驶


    自动驾驶技术目前发展速度极为迅猛，大量的传统车企和科技公司纷纷投身于这一巨大的市场。Google 旗下的自动驾驶汽车已经在小范围投入商业使用，而特斯拉汽车已经通过
    OTA（Over the Air）升级具备了部分自动驾驶功能。按照目前的发展趋势，自动驾驶汽车大范围投入实际使用已近在咫尺。


    自动驾驶汽车显然是一个基于人工智能的复杂系统，它需要借助车载的大量传感器实时监测数据并进行分析，选择合适的行驶路线，保证高效、安全地运行。


    ## 1.2 机器人世界


    ### 1.2.1 机器人的发展历史


    机器人（Robot）是一种模拟人类或其他生物的行为或思想的机械，也泛指可以取代或协助人类工作的自动执行任务的人造机器。


    机器人一词最早出现于1920年捷克科幻作家卡雷尔·恰佩克（Karel Capek）的《罗索姆的万能机器人》一文中。而现实中的机器人约从20世纪50年代起开始发展，至今经历了约60年的历程。


    1959年，美国人乔治·德沃尔（George Devol）与约瑟夫·恩格尔伯格（Joseph F Engelberger）联手制造出了世界上第一台工业机器人。这一工业机器人可以以高精确度模拟人类完成生产线上的重复工作。


    这一阶段的机器人基本是基于设定好的程序完成指定的动作，因此也被称为程序控制型机器人或示教型机器人。这样的机器人只能被视为程序控制型机械，与人工智能还没有交集。


    此后，随着传感器技术的发展，新制造的机器人上开始搭载大量的用于感知环境的传感器，用以感知周围的温度、湿度、亮度等信息，从而辅助人类做出决策。这些机器人常被用于探索一些人类不便进入的区域，例如地震灾区等。


    而在人工智能的辅助下，机器人技术也向着新阶段发展。以人工智能作为机器人的控制核心，机器人可以结合外部环境信息自主做出决策，而不依赖人类的外部指令。这一阶段的机器人才能被称为智能机器人。


    人工智能技术的核心是对人类思维过程的模拟，关于它的研究，更多的是在计算机程序算法方面。而机器人则是一类模拟人类或生物的硬件（机械），它可以是只模拟行为的传统工业机器人，也可以是搭载人工智能技术的当代智能机器人。因此，机器人不一定搭载了人工智能技术，人工智能技术本身与硬件载体也并无直接关系。但是，人工智能技术要在实际生产、生活中得到应用，机器人一直以来都被认为是其最佳的硬件载体。


    ### 1.2.2 什么是智能机器人


    智能机器人通常是由 3 部分组成的：感知单元、逻辑单元和执行单元（见图 1.3）。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_16_0.png)


    图 1.3 人类与智能机器人的组成部分对比


    感知单元通常由多种传感器组成，用于感知周边环境，再将信息传递给机器人的逻辑单元（图 1.4 所示为超声波传感器）。感知单元相当于机器人的“感觉器官”。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_16_1.png)


    图 1.4 超声波传感器可以用于测距


    逻辑单元是机器人的控制核心，承担着连接感知单元和执行单元的关键作用，它处理并分析感知单元传递的信息，进而指挥执行单元执行动作（图 1.5 所示为 Arduino
    主控板）。逻辑单元相当于机器人的“大脑”，在人工智能技术的发展下，机器人逻辑单元的分析能力越来越强。


    执行单元则包括电机、显示设备、发声设备等，它们接收逻辑单元的控制指令并做出相应的反应。执行单元相当于机器人的“肢体”，最典型的执行单元是电机（见图 1.6）。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_17_0.png)


    图 1.5 可用作智能机器人控制核心的 Arduino 主控板


    ![](img/8da48b6e384089b60930a6d8ea39fe92_17_1.png)


    图 1.6 电机是机器人最典型的执行单元


    ### 1.2.3 常见的智能机器人控制核心


    智能机器人的核心是控制器，一般称为主控板，用于处理传感器传输的信息并指挥执行器工作。


    现在已经有了很多专门为软件开发者设计的主控平台，例如现在火爆的树莓派（Raspberry Pi）、英特尔推出的爱迪生（Edison），以及历史最长的 Arduino
    等。根据其性能和架构的区别，主控平台又可以分为单片机平台与微型计算机平台两个大类。


    ### 单片机平台


    单片机约起源于 20 世纪 70 年代，随着处理核心运算能力的逐年提升，其在自动化工业生产中发挥着越来越重要的作用。但早年单片机的程序编写十分复杂，无法方便地被软件开发者甚至普通大众使用。直到
    2006 年，第一个开源单片机平台 Arduino 出现后，才有越来越多的开发者能够轻松地用单片机来制作小型的智能机器人系统。


    ### 微型计算机平台


    微型计算机平台等同于一台小型计算机主机，具备普通计算机的主要功能，通常自带蓝牙、Wi-Fi 连接功能，支持 USB 扩展连接，可自由安装主流操作系统，如 Windows、Android
    及开源系统 Linux 等。这些专为智能设备设计的微型计算机，不仅体积小、能耗较低，还自带一些与传感器、执行器等机器人单元进行信号交互的接口，适合作为智能机器人的主控制器使用。目前最流行的微型计算机平台是树莓派。


    虽然近年来微型计算机平台性能发展迅速，但它们从架构上并不是专为电子控制系统设计的。虽然智能机器人的历史并不长，但由多个电子元器件组成的电子控制系统已经发展了很长时间。传统上，人们通常使用单片机作为电子控制系统的核心元件。单片机通常集成了处理核心（CPU）、存储器（RAM
    与 ROM）、大量信号输入/输出接口，是专为控制电子元器件而设计的。


