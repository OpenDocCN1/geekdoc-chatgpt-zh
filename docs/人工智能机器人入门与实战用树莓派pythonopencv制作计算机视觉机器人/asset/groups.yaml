    # 6.3.2 程序编写


    连接完成后，硬件上的控制准备就完成了。我们接下来要编写一段程序，让树莓派控制机械臂转动。


    打开 Geany 编辑器，输入下面的程序，并保存文件。


    然后打开机械臂电源，在树莓派上运行此程序即可控制机械臂运转。


    ```

    import serial

    import time

    from roboticarm import get_message

    ser = serial.Serial("/dev/ttyAMA0", 9600)

    ser.write(get_message(1, 1500, 4))

    time.sleep(2)

    ser.close()

    ```


    下面对程序中每行代码进行说明。


    ```

    import serial

    ```


    导入调用串口的 Python 第三方包 serial。


    ```

    import time

    ```


    导入 python 中与时间相关的扩展包。


    ```

    from roboticarm import get_message

    ```


    我们需要知道应该发送什么信息给舵机控制板才能按照预想的方式控制机械臂，但是舵机控制板可以识别的信息往往有特殊的形式。调用第三方包 roboticarm 中预置的
    get_message 函数可以帮助我们转换需要发送的信息。


    ```

    ser = serial.Serial("/dev/ttyAMA0", 9600)

    ```


    使用 serial.Serial（串口位置，串口通信波特率）可以初始化树莓派的串口通信。 在预先配置好的树莓派中，其硬件串口通信的串口位置是 "/dev/ttyAMA0"。
    舵机控制板默认的通信波特率是 9600 波特，填入 9600 即可。 初始化完成后，我们将它存为 ser。


    ```

    ser.write(get_message(1, 1500, 4))

    ```


    通过 ser.write（通信信息）的方式可以向外发送串口信息。


    在 get_message 函数中，我们需要填入 3 个信息: get_message（控制板编号， PWM 值，速度）。


    控制板编号是指舵机控制板上 M0~M23 的编号值，例如 M1 的编号是 1。


    PWM 值表示舵机的转角，500~2500 对应 0° ~180°，例如 500 对应 0°，1500 对应 90°，2500 对应 180°。


    速度是指舵机从当前角度运动到新角度的快慢。0~40 对应 0~360° /s，速度为 1 表示每秒转动 9°；最大值为 40，即每秒转动 360°。'
