  - "[PAGE 127]\n\n# 自主练习\n\n我们的示例程序中只采集了一张人脸作为已知数据，也只在实时图像中识别最大的一张人脸。试改写程序，收集更多照片组成更大的已知人脸数据库，并在实时图像中识别所有人脸并用不同颜色的框标识出来。\n\
