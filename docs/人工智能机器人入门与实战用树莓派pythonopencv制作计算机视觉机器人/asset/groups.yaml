    ## 第 3 章 Python 编程基础


    ## 3.1 什么是编程语言


    当前的人工智能技术大都依赖于电子计算机强大的算术与逻辑运算能力，但人们要让计算机听从自己的指示，需要准确地控制计算机的运作。


    计算机的运算核心（CPU）是由大量的微型电路组成的。从硬件的角度来说，计算机可以通过调整不同的电路状态来控制电子设备（例如显示器、音响等）执行不同的指令。


    计算机内部数字电路的运行状态包括两种：高电平（通电）与低电平（断电）。通过极多微型电路的高低电平排列，计算机可以生成大量的运行状态，进而进行电子控制。


    如果将高电平记为 1，低电平记为 0，我们便可以用 1 和 0 的排列来控制这些电路的状态（见图 3.1）。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_27_0.png)


    图 3.1 用 1 和 0 来控制计算机的代码


    因此，人们可以通过由 1 和 0 排列而成的文本来直接控制计算机电路的状态。用于控制计算机的文本指令被称为计算机程序。


    同人与人交流时需要使用自然语言类似，人与计算机交流也需要使用遵循特定规则的编程语言，使人类的意图被准确传递给计算机（见图 3.2）。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_27_1.png)


    图 3.2 自然语言与程序语言的对比 1


    用 1 和 0 排列的文本，我们就可以简单地将控制意图直接传递给计算机。这种可以被计算机直接“读懂”的编程语言被称为机器语言。


    但是，机器语言非常难以被人类使用——仅仅让计算机输出一个字母就需要输入几位至十几位 1 和 0。


    为了解决这个问题，我们可以使用更接近自然语言的方式编写程序，再经由一个预先设定好的解释器将其翻译成机器语言来控制计算机。对此来说，如果 B 只懂英语，不懂汉语，我们可以先将汉语说给翻译，再由翻译转述成英语告诉
    B。程序的解释器就充当了翻译（见图 3.3）。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_28_0.png)


    图 3.3 自然语言与程序语言的对比 2


    编程语言经过了大半个世纪的发展，从最初的汇编语言到现今流行的 Python 语言，其正向着越来越接近人类使用的自然语言的方向发展。


    尽管如此，为了使语言能被准确翻译、可被机器认知，编程语言还是需要符合一些预设的规则，比通常的自然语言更为死板。


