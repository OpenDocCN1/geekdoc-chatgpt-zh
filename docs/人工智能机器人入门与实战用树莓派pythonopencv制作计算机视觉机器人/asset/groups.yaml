    # 3.4.2 Python 的数据类型


    在 Python 语言中，数据的形式可以是一个数字（例如 1、2.5），也可以是一些字符（例如 “a” “Hello”）。总的来说，我们可以将 Python
    中的数据分为两类：数字（Number）和字符串（String）。


    数字类型的数据又有几个子类型，主要有存储整数的整数型（int）和存储小数的浮点型（float）等。数字类型的数据可以使用 +、-、*、/ 等算术运算符进行计算。


    字符串类型用于存储一个或多个字符，Python 中的字符串需要在两侧用英文单引号或双引号标出，例如 “Hello World” 的形式。字符串之间可以使用
    + 运算符进行连接，例如：


    ```

    a = "Hello "

    b = "World"

    print(a + b)

    ```


    程序将打印出两个字符串连接而成的字符串 “Hello World”。


    虽然我们在对变量赋值时并不需要指定它存储的数据的类型，但 Python 在首次对一个变量赋值时会根据我们设定的初始值来自动为变量分配一个合适的数据类型。


    不过，某些程序功能要求特定的数据类型，如果输入的数据类型不符合要求，可能导致程序错误。举例来说，Python 中使用 input() 可以获得手动输入的数据，我们可以用这个功能将一个输入的值赋值给一个变量：


    ```

    a = input()

    print(a)

    ```'
