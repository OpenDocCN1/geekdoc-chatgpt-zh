    通过观察可知，AC 长度等于 BD 长度，CD 长度等于 AB 长度，因此 ACDB 是一个平行四边形。HC 长度等于 IG 长度，IH 长度等于 GC 长度，因此
    HCGI 也构成一个平行四边形。H、D、C 三点两两通过连杆固定连接，构成一个稳定的三角形。


    A 和 B 是底部固定的点，直线 AB 与水平线的夹角固定。


    因为 ACDB 是一个平行四边形，所以 CD 平行于 AB，CD 与水平线的夹角固定。


    因为 CDH 是一个稳定的三角形，所以角 HCD 是一个固定角，HC 与水平线的夹角固定。


    因为 HCGI 是一个平行四边形，所以 IG 平行于 HC，IG 与水平线夹角固定。


    这样，我们可以在机械臂末端设计一个三角形结构，使气泵所在的 JG 永远平行于桌面。


