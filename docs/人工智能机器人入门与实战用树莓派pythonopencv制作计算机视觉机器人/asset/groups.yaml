    \n理想状态下，这一程序应该可以成功区分摄像头图像中的人脸与非人脸区域（见图 7.4）。如果实际效果偏差较大，可以尝试调整皮肤颜色的 H 值区间。\n\n\
    ![](img/8da48b6e384089b60930a6d8ea39fe92_105_0.png)\n\n图 7.4 人脸图像的二值化处理\n\n在检测到肤色区域的基础上，我们需要对其所处区域进行定位。使用下面的程序方法可以绘制出肤色区域的最小外接圆轮廓。\n\
