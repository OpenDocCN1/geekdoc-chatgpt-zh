    \ 变量存储着列表中的一个元素，即形式为 [x, y] 的坐标列表。用 point[0] 和 point[1] 可以分别得到对应的横坐标和纵坐标。\n\n\
    试一试\n\n利用列表与 for 循环遍历，让屏幕上的图像显示魔法棒经过的所有点，实现基本的程序功能。\n\n# 5.4.4 按键值与键盘控制\n\n到此为止，程序已经完成“魔法棒”的基本功能了，但还有一点小不足：我们希望可以手动控制绘制图案的开始与停止，而不是在程序开始后立即绘制图案。\n\
    \n利用 OpenCV 的 waitKey 函数可以方便地实现手动开始、暂停或清除图案的功能。此前我们知道，waitKey 函数必须跟在 imshow 之后，表示在显示一帧后等待的时间（单位为毫秒）。事实上，设置\
    \ waitKey 函数的主要作用是在等待时间内获取键盘的按键指令：\n\n```\nk = cv2.waitKey(5)\n```\n\n这样得到的 k\
