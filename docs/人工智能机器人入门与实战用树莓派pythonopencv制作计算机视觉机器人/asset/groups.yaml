    OpenCV（开源计算机视觉库），它已成为目前影响力最大 的一个开源计算机视觉库。OpenCV 在面部识别、手势识别、目标识别、增强现实（AR）等问题上都能够发挥重要的作用。


    2009 年，OpenCV 发布了其第一个第二代正式版本。自 2012 年起，一个专门的非营利组织负责 OpenCV 项目的后续支持。OpenCV 2015
    年发布其第三代，2018 年发布到第四代。在我们后续的项目中，将使用目前应用最为广泛的 OpenCV 第三代版本。


    OpenCV 本体以 C++ 程序语言编写，但也提供了包括 Python 在内的其他编程语言的扩展接口。图 5.9 所示为 OpenCV 的 Logo。


    # 5.2.2 视频的帧与分辨率


    OpenCV 不单可以用于处理静止的图像信息，其很重要的一个目标是对实时的动态图像进行处理。


    我们可以运用摄像头来捕获动态的视频图像。摄像头的基 本成像原理与数码相机完全相同，只不过它可以实时以较短的时间间隔连续获取图像信息。这些图像信息按时间顺序排列起来就组成了我们常说的视频。


    我们看到的视频实际上是由若干张静态图片连续播放而成的（见图 5.10）。人类大脑的视觉系统会将连续播放的相似图片自动连接成连续的影像。


    视频中每一张静态图片被称为视频的一帧（frame）。视频每秒输出的帧数量是一个很重要的指标，这被称为帧率（单位为帧/秒）。现在主流的视频帧率是 30 帧/秒或
    60 帧/秒。帧率越高，视频越流畅。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_60_0.png)


    图 5.9 OpenCV 的 Logo，包含视觉三原色要素


    ![](img/8da48b6e384089b60930a6d8ea39fe92_60_1.png)


    图 5.10 视频事实上是由多帧图像连续播放而成的'
