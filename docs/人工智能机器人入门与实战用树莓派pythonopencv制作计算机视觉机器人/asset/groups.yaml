    但是，机器语言非常难以被人类使用——仅仅让计算机输出一个字母就需要输入几位至十几位 1 和 0。


    为了解决这个问题，我们可以使用更接近自然语言的方式编写程序，再经由一个预先设定好的解释器将其翻译成机器语言来控制计算机。对此来说，如果 B 只懂英语，不懂汉语，我们可以先将汉语说给翻译，再由翻译转述成英语告诉
    B。程序的解释器就充当了翻译（见图 3.3）。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_28_0.png)


    图 3.3 自然语言与程序语言的对比 2


    编程语言经过了大半个世纪的发展，从最初的汇编语言到现今流行的 Python 语言，其正向着越来越接近人类使用的自然语言的方向发展。


    尽管如此，为了使语言能被准确翻译、可被机器认知，编程语言还是需要符合一些预设的规则，比通常的自然语言更为死板。


