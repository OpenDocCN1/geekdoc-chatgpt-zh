    \n## 扩展阅读\n\n我们使用的这种机械臂头部永远垂直于桌面，是由它的机械结构设计（见图 6.5）决定的。我们一起用几何知识来证明一下这一点吧！\n\n\
    ![](img/8da48b6e384089b60930a6d8ea39fe92_77_1.png)\n\n图 6.5 机械臂的机械结构\n\n我们从左侧来看图\
    \ 6.5 所示这个机械臂。A 和 B 是固定在底座上的点，其他点都是随机械臂运动而移动的点。\n\n通过观察可知，AC 长度等于 BD 长度，CD 长度等于\
    \ AB 长度，因此 ACDB 是一个平行四边形。HC 长度等于 IG 长度，IH 长度等于 GC 长度，因此 HCGI 也构成一个平行四边形。H、D、C\
    \ 三点两两通过连杆固定连接，构成一个稳定的三角形。\n\nA 和 B 是底部固定的点，直线 AB 与水平线的夹角固定。\n\n因为 ACDB 是一个平行四边形，所以\
    \ CD 平行于 AB，CD 与水平线的夹角固定。\n\n因为 CDH 是一个稳定的三角形，所以角 HCD 是一个固定角，HC 与水平线的夹角固定。\n\n\
