    # 前 言


    树莓派是一款基于 ARM 架构、Linux 系统的极简计算机，它自 2012 年发布以来，凭借巧小的体形和低廉的价格迅速风靡全球，既可以用于计算机编程教育，也可以作为机器人教育中嵌入式系统的控制核心。


    第一种运行于树莓派上的编程语言是 Python，这也是当前人工智能领域最为流行的编程语言。Python 是一种高级编程语言，适用于广泛的应用场景，它的代码简洁易读，语法规则简洁、明确，扩展功能开放、丰富，非常适合编程初学者入门学习。


    机器视觉是人工智能中重要的细分研究领域，OpenCV 则是当前机器视觉领域主流的开源处理库。OpenCV 提供包括 Python 语言在内的多种编程语言的调用接口，可以方便地用于计算图像处理，并可应用于面部识别、目标识别等具体问题。


    作为一本以人工智能与机器人为主题的入门书籍，本书主要聚焦于在树莓派平台上使用 Python 语言调用 OpenCV 库实现机器视觉的任务。全书内容共分为 7
    章，前 4 章为树莓派与 Python 编程基础知识部分，第 1 章介绍人工智能与机器人的基本概念，第 2 章则介绍树莓派主板与操作系统使用方法，第 3 章为简单的
    Python 编程入门学习内容，第 4 章介绍 Python 编程与树莓派的硬件控制的结合；后 3 章则为机器视觉部分，第 5 章介绍 OpenCV 的使用方法，第
    6 章结合机械臂硬件完成智能分拣项目，第 7 章则结合云台硬件完成人脸追踪机器人项目。


    我们力求通过一系列分层次设计的软硬件任务将人工智能的概念由浅入深地融入各个章节中，同时覆盖 Linux 系统操作、Python 编程、机器人系统搭建等多方面的综合知识，希望本书可以作为中小学
    STEAM 人工智能教育的一本基础读物，也可以作为中职、高职院校相关专业学生的参考书籍。


    本书使用的控制核心为树莓派 3B+，其软件环境为：操作系统 Raspbian “Jessie”，Python 版本 3.5.3，OpenCV 版本 3.4.4。系统映像安装方法及本书所有“试一试”环节的参考程序均可以访问
    box.ptpress.com.cn/y/RC2020000001 或扫描二维码获取。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_5_0.png)'
