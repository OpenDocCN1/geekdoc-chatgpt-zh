    # 6.4 用摄像头找到木块位置


    我们曾学习过使用树莓派摄像头识别不同颜色的物体。结合这一功能，我们希望制作一台自动分拣的机械臂：机器人自主寻找桌面上指定颜色的木块，并将它抓取起来放到特定的位置。


    我们可以把这个任务分解为这样几个步骤：


    +   - （1）摄像头获取图像；

    +   - （2）进行图像分析，得到待抓取木块的位置；

