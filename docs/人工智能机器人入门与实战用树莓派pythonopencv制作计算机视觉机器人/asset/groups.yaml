    \n可以使用一个变量来表示现在的程序阶段：识别或追踪。先进行人脸识别，当识别到人脸后进入追踪阶段，此时不再执行人脸识别程序（见图 7.27）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_127_0.png)\n\
