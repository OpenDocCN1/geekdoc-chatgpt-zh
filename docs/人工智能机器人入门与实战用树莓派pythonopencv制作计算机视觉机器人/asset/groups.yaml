    树莓派通过 Python 编程播放音频的方法有很多种，在本例中我们来学习使用第三方包 pygame 来实现。pygame 包中包含了一个名 mixer 子包，使用它载入音频文件即可进行音频播放。\n\
    \n```\nimport pygame.mixer as player\nplayer.init()\nSound = player.Sound(\"/home/pi/audios/1.wav\"\
    )\nSound.play()\n```\n\ninit 函数的作用是对音频播放进行初始化。Sound 则可以载入指定存储位置的音频文件，注意它只支持 wav\
    \ 和 ogg 格式的音频。载入后使用 play 函数即可开始音频的播放。\n\n我们在播放音频时往往希望将其播放完再去播放下一个。使用 get_busy\
    \ 函数可以获得当前的播放状态，若正在播放则返回 True，否则返回 False。因此，可以用下面的循环语句让程序在音频播放完毕后再继续运行。\n\n```\n\
    while True:\n    if not player.get_busy():\n        break\n```\n\n我们可以将这个程序段落写入一个自定义函数，并将音频文件的存储地址作为该函数的参数。\n\
    \n```\nimport pygame.mixer as player\nplayer.init()\ndef playaudio(address):\n\
    \    Sound = player.Sound(address)\n    Sound.play()\n    while True:\nif not\
    \ player.get_busy():\n    break\nplayaudio(\"/home/pi/audios/1.wav\")\n```\n\n\
    不过，若要在机器狗的程序中插入音频的播放，由于程序需要等待音频播放完毕，它将阻碍我们其他程序内容的运行。\n\n我们知道，以 Arduino 为例的单片机通常只能在同一时间运行一个程序，但\
    \ Python 程序并没有这个限制，它可以允许在同一时间运行多个程序。Python 中可以方便地在程序中创建“子线程”，让程序的一部分在后台同步执行。这种方法被称为“多线程”。\n\
    \nPython 中创建多线程存在多种方法，在 Python 3 中一种较为简单的方法是引入 threading 包中的 Thread 进行创建。\n\n\
    为了便于理解，我们先举一个简单的例子。假设小明正在吃草莓，他每 5 秒钟吃一个草莓，则可以写一个这样的程序：\n\n```\nimport time\nwhile\
    \ True:\n    print('吃草莓')\n    time.sleep(5)\n```\n\n但是该同学热爱学习，他在吃草莓时也在背单词，他每\
    \ 20 秒背一个单词。这样，我们可以将背单词作为吃草莓的子线程同步进行。\n\n子线程应执行的内容需要放置在一个自定义函数中。我们可以设定一个名为 word\
    \ 的自定义函数，放入背单词的过程：\n\n```\ndef word():\n    while True:\n        print('背单词')\n\
    \        time.sleep(20)\n```\n\n子线程可以通过 threading 包中的 Thread 进行创建，并以刚才设定的自定义函数为它的\
    \ target 参数。其写法如下：\n\n```\nfrom threading import Thread\nt = Thread(target = word)\n\
    t.start()\n```\n\n这里，我们创建了一个名为 t 的子线程，它的执行内容在自定义函数 word 中。当需要开启线程时，只需要对线程调用 start\
    \ 函数即可。完整的程序写法如下。\n\n```\nfrom threading import Thread\nimport time\ndef word():\n\
    \    while True:\n        print('背单词')\n        time.sleep(20)\nt = Thread(target\
    \ = word)\nt.start()\n```\n\n```\nwhile True:\n    print('吃草莓')\n    time.sleep(5)\n\
    ```\n\n这样，我们可以在打印结果中看到，小明每吃 4 个草莓即背了一个单词，它们各自独立进行。\n\n我们设定的自定义函数也可以有参数，若需要在创建线程时传入参数，只需要按照\
    \ “Thread(target = 函数名, args = [参数列表])” 的形式将传入的参数依序写入 args 参数的列表中即可。\n\n回到音频播放的例子中，我们可以创建子线程，并在程序的适当位置对其调用\
    \ start 函数，来在子线程中播放音频。\n\n```\nfrom threading import Thread\nt = Thread(target\
    \ = playaudio, args = [\"/home/pi/audios/1.wav\"])\nt.start()\n```\n\n## 自主练习\n\
