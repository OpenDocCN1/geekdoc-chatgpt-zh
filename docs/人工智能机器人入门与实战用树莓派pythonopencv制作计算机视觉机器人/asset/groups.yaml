    \n![](img/8da48b6e384089b60930a6d8ea39fe92_76_0.png)\n\n图 6.2 三轴机械臂舵机与转轴关系示意图\n\
    \n这种机械臂有 3 个驱动用的舵机，其中底端的舵机 1 用来控制机械臂整体在平面内的转动；舵机 2 控制后臂绕底部关节的上下运动，舵机转角等同于图 6.3\
