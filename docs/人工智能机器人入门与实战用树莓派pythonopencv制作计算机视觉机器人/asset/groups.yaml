    一个视频中每一帧图像的像素排列是完全一致的。视频中每帧图片的横轴、纵轴像素的数量被称为视频的分辨率。以树莓派官方摄像头为例，该摄像头发拍摄的图像横轴拥有 640
    个像素，而纵轴拥有 480 个像素，所以其分辨率为 640 像素 × 480 像素。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_61_0.png)


    图 5.11 树莓派摄像头的分辨率及像素坐标的排列方式


    如图 5.11 中橙色点所示，我们可以将每个像素定位到其在 x 轴（横轴）和 y 轴（纵轴）方向的位置，并标注为 (x 坐标, y 坐标)。


    视频的分辨率常以纵轴的像素数量来表示，例如标清视频为 480p，指的是纵轴有 480 个像素。而高清视频为 720p，全高清视频为 1080p，4K 视频则为
    2160p。标准视频的横纵像素比通常为 16:9 或 4:3。显然，分辨率越高，视频越清晰。


