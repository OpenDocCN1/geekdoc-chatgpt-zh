    # 5.1 机器视觉与图像识别


    # 5.1.1 机器是怎样“看”的


    我们人类可以通过感觉器官感知世界，例如用眼睛“看”、用耳朵“听”、用鼻子“闻”、用舌头“尝”等。而用眼睛看，也就是视觉，是其中非常重要的一种感觉。


    人工智能系统的一个重要发展方向是对人类机能的模拟，因而学会“看”对人工智能而言是非常关键的一步。


    在分析机器如何“看”之前，我们先简单了解一下人类的视觉机制。我们天生就能使用眼睛接收光线，从而可以看到五彩斑斓的世界，这是因为人眼的视觉细胞中存在分别对红色、绿色、蓝色敏感的
    3 种细胞，从而可以识别出这 3 种颜色，并可以通过它们的融合识别其他颜色。其流程如图 5.1 所示。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_56_0.png)


    图 5.1 感光细胞成像的简易流程


    因此，红、绿、蓝 3 种颜色被称为视觉三原色，它们的任意组合可以构成可见光的所有颜色。三原色及其组合如图 5.2 所示。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_56_1.png)


    图 5.2 红、绿、蓝三原色及其组合


    人类在很长的历史时期之中只能用绘画的方式将眼中的视觉图像留下下来，直到 19 世纪，人们第一次研制出了能存储光线信息的仪器——照相机。传统的彩色照相机利用某些化学物质对三原色光线的敏感性在底片（胶卷）上显出对应的颜色（见图
    5.3）。其工作原理与人眼的成像原理有相似之处。'
  - '[PAGE 57]


    ![](img/8da48b6e384089b60930a6d8ea39fe92_57_0.png)


    图 5.3 传统彩色照相机的影像原理


    现代的数码相机则稍有不同，它不依赖于特定的化学物质，而是通过电子感光单元将接收到的光线信息转化为电信号，并经由芯片处理后将这些电子信息存储起来或传递出去（见图
    5.4）。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_57_1.png)


    图 5.4 数码相机获取图像的原理


    电子感光单元通常由大量方块型的微型感光半导体元件构成，它们通常紧密排列为一个矩形结构（见图 5.5）。


    ![](img/8da48b6e384089b60930a6d8ea39fe92_57_2.png)


    图 5.5 电子感光单元中以矩形排列着大量的感光半导体


    每一个感光半导体可以通过滤波感知到接收光线中三原色的光照强度。因此，电子感光单元可以知道接收到的光线每一个位置上红、绿、蓝光的强度。因此，图像的电子信息实质上就是每一个感光半导体所测得的三原色光强度信息。这样得到的图像信息并不是完全连续的，它的最小单元是一个感光半导体所占据的小方块，这些小方块被称为图像的像素。


    传统照相机可以通过对底片的处理直接还原出实体的照片，数码相机得到的图像信息还需要通过电子显像呈现出来。'
