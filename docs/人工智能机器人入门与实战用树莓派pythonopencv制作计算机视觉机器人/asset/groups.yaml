    cv2.waitKey(5) # 每帧等待 5 毫秒\n```\n\n程序将自动找到图像中的人脸，并使用红色圆标注出来（见图 7.5）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_105_1.png)\n\
    \n图 7.5 使用肤色识别找到图像中的人脸位置\n\n### 试一试\n\n尝试编写程序，使用肤色检测找到实时图像中的人脸，并标注出来。\n如果识别不准确，请调整程序中的\
    \ H 值或改变摄像头前方图像背景和光照强度。\n\n尽管通过肤色检测可以在一定程度上找到图像中人脸的位置，但有一些明显的问题。\n\n- (1) 不同人的皮肤颜色有较为显著的区别，过于严格的颜色范围将漏掉一些人，而过于宽松的颜色范围很容易将环境中的其他东西误认为人脸。\n\
    - (2) 肤色检测并不区分面部与其他位置的皮肤，使用肤色检测不可以找到人脸，同样也可以找到手部等其他裸露的人体皮肤。\n\n因此，肤色检测通常只用于特定场景下的人脸检测或作为其他检测手段的辅助。为了更准确地检测出图像中的人脸，我们需要使用更复杂的数学方法。\n\
    \n## 7.3 使用哈尔特征检测找到人脸\n\n事实上，除了皮肤的颜色外，人脸还具备其它的一些图像特征。通常来说，由于有黑色的眼珠与眉毛的存在，眼睛区域的总体颜色比脸颊颜色更暗，鼻梁两侧比中央颜色更暗，而嘴巴也比周围颜色更暗。我们可以根据亮暗程度来表明这些区域的特征，为方便起见，我们可以先将彩色图片转换为黑白（灰度）图片（见图\
    \ 7.6）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_106_0.png)\n\n图 7.6 只保留图像的亮度信息，将图像转化为黑白图像\n\
    \n我们以眼睛区域与脸颊区域的对比为例，可以将这两种区域分别用矩形框框出，再计算出这些区域内的平均灰度值。灰度值表示图像的亮暗程度，灰度值越大越接近白色，即原始颜色越亮。\n\
    \n可以明显地看出，图 7.7 中右侧的脸颊位置整体比眼窝位置更白，即平均灰度值更大。 当然，这样一个简单的灰度对比特征还不足以锁定人脸。但我们可以找到大量类似这样人脸普遍具备的特征，当某个图像区域符合大部分特征时，基本就可以确定这是一张人脸。\n\
    \n2001 年，Paul Viola 和 Michael Jones 在论文中首次提出了基于这个原理的人脸检测方法，并提出了一种行之有效的训练方法。\n\n\
    ![](img/8da48b6e384089b60930a6d8ea39fe92_107_0.png)\n\n图 7.7 比较眼睛区域与脸颊区域的平均灰度\n\
    \n要将灰度图像目标区域划定成大量的矩形框并得到它们的关系信息，可以用名为哈尔小波变换的数学方法来计算，因此这种图像特征被称为哈尔特征（Haar-like\
    \ features），如图 7.8 所示。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_107_1.png)\n\
    \n图 7.8 人脸上的不同区域符合不同类型哈尔特征\n\n但一个 20 像素 × 20 像素的图片的哈尔特征就能达到 10 万种以上，其中哪些特征符合人脸的特点很难通过人为设定来找出。通过一种行之有效的训练方法，我们可以将大量面部图片与非面部图片交给计算机，让其自动找到足以区分人脸与非人脸的图像特征信息。\n\
    \n由于这种检测方法只需要对图像的灰度空间进行分析，运算量大大低于传统用于图像检测的 RGB 颜色空间或 HSV 颜色空间，因此运算速度得到了大幅提升，首次实现了有效的实时人脸检测。21\
    \ 世纪初大量相机厂商通过这一技术首次实现了人脸自动对焦。\n\n2002—2005 年，Rainer Lienhart 将这种检测方法写入了 OpenCV\
    \ 开源库的基础包中，并提交了训练得到的包括人脸在内的多种物体的特征信息。\n\n因此，使用 OpenCV 内置的检测算法，我们便可以轻松地检测出图像中的人脸。在使用算法检测人脸之前，需要先用\
    \ cvtColor 函数将图像变换为灰度图（使用 cv2.COLOR_BGR2GRAY 参数）。\n\n```\nimport cv2\ncap = cv2.VideoCapture(0)\
    \  # 开始读取摄像头信号\nwhile cap.isOpened():  # 当读取到信号时\n    (ret, frame) = cap.read()\
    \  # 读取每一帧视频图像为 frame\n    gray = cv2.cvtColor(frame, cv2.COLOR_BGR2GRAY)\n  \
    \  cv2.imshow('gray', gray)  # 显示灰度图像\n    cv2.waitKey(5)  # 每帧等待 5 毫秒\n```\n\n\
    在检测之前，我们还需要载入人脸的哈尔特征信息。由于这些信息是用于对图像中的物体进行分类的，它们通常被称为分类器。在OpenCV开源库中有许多针对不同对象的分类器，这些分类器被存储在格式为\
    \ XML 的文件中，用户可以根据需要下载这些文件。\n\n在我们的树莓派系统已经存储了用于正面人脸识别的分类器，可以通过下面的语句载入该分类器。\n\n\
    ```\nface_cascade = cv2.CascadeClassifier('/home/pi/cascade/haarcascade_frontalface_default.xml')\n\
    ```\n\n括号中为文件在系统中的存储位置。载入分类器后，我们可以用 detectMultiScale 函数进行目标物体检测：\n\ndetectMultiScale(\
    \ 灰度图像 , minSize= 最小目标尺寸 , flags= 检测方式 )\n\n这里我们可以设置两个参数的取值。\n\nminSize 参数表示目标的最小尺寸，也就是说此函数会忽略小于该尺寸的人脸。该参数为一个长度为\
    \ 2 的元组，分别表示 x 方向和 y 方向的最小尺寸。\n\nflags 设置检测方式，主要可选的取值有以下 3 种。\n\n- cv2.CASCADE_DO_CANNY_PRUNING:\
    \ 忽略图像中一些明显不是人脸的区域。\n- cv2.CASCADE_SCALE_IMAGE: 对图像进行缩放的检测方法，可以提高检测速度，但准确率有所下降。\n\
    - cv2.CASCADE_FIND_BIGGEST_OBJECTS: 只检测最大的目标物体。\n\ndetectMultiScale 函数的返回值是由每一个目标物体位置信息构成的元组。位置信息由左上角\
    \ x 坐标、左上角 y 坐标、宽度、高度构成（见图 7.9）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_108_0.png)\n\
    \n图 7.9 detectMultiScale 函数返回值示意图\n\n```\nfaces = face_cascade.detectMultiScale(gray,\
    \ minSize=(100, 100),\nflags=cv2.CASCADE_SCALE_IMAGE)\n```\n\n使用这一语句，将找到图像中所有尺寸不小于\
    \ (100, 100) 的人脸的位置并将它们存储到变量 faces 中。faces 事实上是一个元组，使用 for 循环可以遍历数组中每一个人脸的位置信息，从而将人脸的位置标注出来。由于得到的位置信息构成一个矩形，我们使用\
    \ rectangle 函数来绘制：\n\n```\ncv2.rectangle(图像信息, 左上角坐标, 右下角坐标, 框的颜色, 框的粗细)\n```\n\
    \n其右下角坐标可以通过左上角坐标与宽、高相加得到，框的颜色按照 BGR（蓝绿红）的方式排列。因此，我们可以写出完整的检测人脸的程序。\n\n```\nimport\
    \ cv2\nface_cascade = cv2.CascadeClassifier('/home/pi/cascade/haarcascade_frontalface_default.xml')\
    \ # 载入人脸分类器\ncap = cv2.VideoCapture(0) # 开始获取摄像头信号\nwhile cap.isOpened():\n  \
    \  (ret, frame) = cap.read() # 读取每一帧视频图像为 frame\n    gray = cv2.cvtColor(frame,\
    \ cv2.COLOR_BGR2GRAY) # 将图像转换为灰度图\n    faces = face_cascade.detectMultiScale(gray,\
    \ minSize=(100, 100), flags=cv2.CASCADE_SCALE_IMAGE) # 检测人脸的位置\n    for (left,\
    \ top, width, height) in faces: # 遍历找到的人脸的位置信息\n        frame = cv2.rectangle(frame,\
    \ (left, top), (left + width, top + height), (0, 0, 255), 2) # 绘制矩形框\n       \
    \ cv2.imshow('cascade', frame) # 预览图像\n        cv2.waitKey(5) # 每帧等待 5 毫秒\ncap.release()\n\
    cv2.destroyAllWindows()\n```\n\n### 试一试\n\n尝试编写程序使用哈尔特征检测找到实时图像中的人脸并标注出来。\n如果识别不准确，请调整现场的光亮度或改变\
    \ detectMultiScale 函数的参数。\n\n## 7.4 人脸追踪机器人初制\n\n现在，通过哈尔特征检测的方法，我们已经可以较为准确地从实时视频图像中找到人脸的位置。将这一程序方法与机械运动相结合，我们便可以制作一个简单的人脸自动追踪机器人。\n\
    \n人脸的位置在图像中可能在 x 方向或 y 方向上运动，为了追踪人脸的移动，我们的机器人也需要能够在两个方向上转动。这个功能可以使用一个双轴云台（见图 7.10）来完成。双轴云台的底部由两个旋转方向相互垂直的舵机组成，只需要将摄像头摆正固定在云台的头部，它的两个转动方向便可以分别对图像上两个轴方向上目标的移动进行追踪。\n\
    \n![](img/8da48b6e384089b60930a6d8ea39fe92_110_0.png)\n\n图 7.10 双轴云台\n\n制作机器人外观的方法有很多，在这里我们选择设计上、下两块板，并用铜柱连接起来，给树莓派搭建一个外壳，然后把双轴云台固定到树莓派上方。\n\
    \n首先，我们设计一块树莓派的顶部固定板，并用亚克力板或木板切割出来。将双轴云台与舵机控制板分别固定到该固定板上的对应位置。它们应分别使用 M2 与 M3\
    \ 尺寸的螺丝、螺母进行固定（见图 7.11）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_110_1.png)\n\
    \n图 7.11 顶部固定板示意图\n\n固定完成后，先将树莓派关机并断电，将摄像头连接线从树莓派上拔出，再将摄像头与其固定板一同卡入双轴云台顶部的固定位置（见图\
    \ 7.12）。如果发生松动，可以使用热熔胶枪等工具将它们粘在一起。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_111_0.png)\n\
    \n图 7.12 双轴云台头部固定示意图\n\n最后将摄像头连接线重新穿过顶板上预留的孔位（见图 7.13）插回树莓派即可完成摄像头的固定和连接。\n\n\
    ![](img/8da48b6e384089b60930a6d8ea39fe92_111_1.png)\n\n图 7.13 顶板上摄像头连接线的穿过位置\n\
    \n将顶板与树莓派底部固定板四角的孔位对齐，用 M3 铜柱和螺丝、螺母支撑并固定。注意其方向应保证顶板缺口与树莓派的 GPIO 引脚区域对齐。这样树莓派、双轴云台、舵机控制板就被固定为一个整体了（见图\
    \ 7.14）。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_111_2.png)\n\n图 7.14 固定完成示意图\n\
    \n舵机控制板的供电方式和通信方式与机械臂项目相同（见图 7.15）。供电需要用到 DC 电源线、DC 端子和红、黑电源线。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_112_0.png)\n\
    \n图 7.15 舵机控制板的供电连接\n\n如果连接后舵机控制板的蓝灯亮起，请按 DC 电源线上的开关按钮先关闭电源。要进行通信，则需要将舵机控制板上的通信接口与树莓派上的硬件串口引脚用杜邦线连接，连接方式如图\
    \ 7.16 所示。\n\n![](img/8da48b6e384089b60930a6d8ea39fe92_112_1.png)\n\n图 7.16 树莓派与舵机控制板的通信连接\n\
    \n双轴云台上的两个舵机可连接至舵机控制板上的引脚，注意线的颜色与板上引脚的颜色必须一一对应。为了后面描述的统一，我们可以将下方舵机连至 M1 列，而上方舵机连至\
    \ M2 列。\n\n检查以上所有线路连接无误后，重新打开树莓派电源，待树莓派开机后再打开舵机控制板的电源。\n\n用程序控制舵机运动的方法与机械臂项目完全相同。\n\
    \n```\nimport serial\nfrom roboticarm import get_message\nser = serial.Serial(\"\
