    通过不同统计分析方法，利用`BI`等技术对预处理过的原始数据进行统计运算，得到平均值、发展速度等，并进行可视化演示。对于采集并且结构化后的数据，分析从两个方面考虑：一个是甄别数据唯一性和准确性，一个是自启动机制发现与优化。


    ### 数据甄别


    利用文本语义分析、知识图谱等一些模型来分析某些数据合理性，进行多源数据甄别，以确定数据的合理性。通过语义分析，得到描述对象及相关数据是采集指标中需要的内容。通过知识图谱建立概念、实体等，实现对挖掘数据精确性要求和聚焦。


    ### 指标选择和指标形成


    从法律法规、政府机构三定方案、工作流程等文件中梳理出最小职能，并用指标来描述。如北京市政府职能经过梳理共有1730项，每一项职能的状态都可以用具体的指标相对应并对其作业状态进行描述。通过对公共管理、政府管理等从理论高度和政府实际工作中关注内容抽象出主要指标形成第二级指标。再通过政府对城市管理和服务职能中梳理出的指标，根据其与主要指标（二级）匹配程度进行选择形成支持指标（第三级指标）。针对不同主体和对象，指标需要从宏观、中观、微观三个维度去描述，对城市政府的作业评价来说，后两者尤为重要。


    指标的选择是从时间维度、状态维度、统计维度来构成多维度、多方位合理体系结构。（见表2）


    **表2 部分中国政府指数对应部门**

    ![](images/figure_0223_0001.jpg)


    ### 中国政府指数自启动机制


    指标权重赋值通过调研结合统计方法确定（如`偏最小二乘法`）。权重值在不同的社会情景下的取值是不同的。社会情景分为一般情景和特殊情景。一般情景是指社会运行正常情况下的情景，特殊情景是有突发事件时的情景。在不同的业务环境下，权重的取值是不同的。


    通过风险事件发生形成的事件触发和监督使用指标的阈值达标或触发，实现治理协同工作流程自动激活，并启动协同动作的智能分发机制。当社会出现突发风险和危机事件时，相应指标体系能就敏感事件作出反应，并自动预警及启动相关政府作业流程，协调政府部门应对风险，对政府部门的任务完成具有重要的意义。


    ### 自启动协同


    对发生事件按照问题进行分类，这个过程需要对过去事件进行聚类分析，然后对当前问题通过语义分析得到其特征，把事件分类到相应治理协同类别中。类别和职能的匹配是通过解读相关法条和规则进行的人工匹配，而这些职能在法条或三定方案中已经有了解释，分拆后建立起指数与部门的映射关系，这样就能实现自启动任务的精准分发，也为绩效考核和履职能力评价以及督察督办等业务场景应用提供支持。


    ## 9.5 中国政府指数的动态发布体系


    ### 中国政府指数网站板块设计


    #### 实时指数


    包括动态展示各级指数，指数信号预警，任务自启动，作业协同，部门督考评价。


    #### 报告发布


    报告下载列表。


    #### CGI介绍


    `CGI`体系介绍，指数说明，指数实现方法、数据来源。


    #### 合作参与


    政府机构、科研机构、企业参与方式介绍、数据合作，开放指数合作。


    #### CGI专家委员会


    `CGI`智库体系结构、常设机构。


    #### 发布动态


    `CGI`相关研究动态、有关会议动态、发布动态。


    ### 管理模式及网站发布路径


    日常的数据分析由数据分析体系根据业务模型，通过大数据体系生成中国城市指数的相关指标、排序等，并由相关机构和人员审核后发布。


    ### CGI任务协同技术体系


    中国政府指数网站架构共分为五个层次，分别为`资源层`、`指数计算层`、`用户服务层`、`应用调度层`、`信息交互与展示层`。


    `资源层`提供了服务系统的基础设施资源，包括`计算资源`、`结构化数据库`、`非结构化数据库`以及`政务指数数据源`。


    `指数计算层`调用`资源层`中的计算资源的多个计算节点，利用`分布式框架`处理`政务指数数据源`数据，经过计算后存储到`非结构化数据库`中，包括`指数更新模块`、`守护线程模块`。


    `用户服务层`调用`资源层` `结构化数据库`存储的用户数据，完成相应的用户服务内容，包括`用户管理模块`、`路径管理模块`和`数据缓存模块`。


    `应用调度层`接收`信息交互与展示层`发送的各类用户请求，调用`指数计算层`以及`用户服务层`，完成用户请求，同时将请求结果反馈给`信息交互与展示层`，包括`指数数据获取模块`、`用户数据获取模块`、`服务请求接收与分发模块`。


    `信息交互与展示层`提供用户基于地图的指数信息的实时展示，进行指数信息的管理，该`信息交互与展示层`包括`指数发布服务模块`和`二级、三级指数展示模块`。信息展示模块包括各类发布段的动态展示、实时展示、区块展示、路径展示等。


