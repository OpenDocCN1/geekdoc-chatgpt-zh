    \n## 推荐语\n\n### 程琳教授 推荐语\n\n中国人民公安大学原党委书记、校长  \n中国法学会常务理事  \n中国警察法学研究会长\n\n胸怀天下的宏大格局决定了一个学者的学术高度和理论视野。明刚院长的《人工智能时代的风险治理》这本极具社会意义和时代特征的风险治理研究专著再次让我们深深地感受到中国知识分子的悲天悯人情怀和大义担当，“为天地立心，为生民立命，为往圣继绝学，为万世开太平”。本书从历史到当代，从理论到实践，对风险问题及治理进行了系统的研究，具有较强的理论性和实践性，对于学习贯彻习近平总书记风险治理的重要论述具有一定的参考价值。我相信，这本书的出版对全社会具有极强的警示意义和较大的风险思维教育价值，对于如何科学准确地分析找出社会风险，及时预警，精准施策，有效治理具有一定的指导意义，并为中国现代社会风险治理基础理论研究和治理应用体系支撑提供借鉴。\n\
    \n![](images/figure_0006_0002.jpg)\n\n二〇二〇年二月二十五日\n\n### 温志强教授 推荐语\n\n![](images/figure_0007_0001.jpg)\n\
    \n天津师范大学政治与行政学院副院长\n\n家国情怀是从事社会风险研究者的初心。面对风险，我们必须时刻保持高度的警惕，察微知著，未雨绸缪。明刚院长这部风险研究的专著体系完整、资料翔实，对风险治理的现状和问题分析透彻入理。工欲善其事，必先利其器，本书对大数据风险发现、风险治理和风险情报态势感知体系及其应用做了详细的论述，是现代风险治理重要的方法论。这本风险治理的专著不仅是明刚多年来从事风险治理研究的总结，更为中国风险治理体系及治理能力提升的现实路径贡献了风险研究学者的系统思考。\n\
    \n![](images/figure_0007_0002.jpg)\n\n二〇二〇年二月二十五日\n\n### 郭其云教授 推荐语\n\n![](images/figure_0008_0001.jpg)\n\
    \n中国人民警察大学原科研所所长\n\n反思是进步的动力。现代社会风险频发，没有人能置身事外。建立感知风险的基础体系，提升风险的预警能力，提升风险治理的系统能力是全社会必须面对的重要课题之一。反思风险治理思维中的不足，补齐风险治理能力的短板，建立以数据决策为核心的风险治理及协同系统体系是本书的核心议题。明刚院长长期从事网络空间风险治理研究，学术素养深厚，勤于实践思考，见识独到深刻，屡有让我惊叹之作!本书紧扣当今风险治理最紧要之处，从系统论的角度对现代风险进行了全景式的描述，是当代风险战略研究的重要著作，填补了中国现代风险治理体系建设及应用的空白。\n\
    \n![](images/figure_0008_0002.jpg)\n\n二〇二〇年二月二十五日\n\n# 序言\n\n风险有改变或摧毁，甚至毁灭世界的力量。\n\
    \n风险治理的核心是风险感知能力，风险感知的核心能力是人的风险认知能力、风险治理能力和风险应对能力。\n\n面对风险，趋利避害是人的本能。\n\n风险治理涉及的不仅仅是大数据，也不仅仅是技术问题。\n\
    \n风险表现为各类事件，或是某种趋势。天灾和人祸就是典型的传统风险。\n\n谈到风险，我们每个人都有自己的认知，那些对社会个体或组织机构带来任何秩序的自然或人为改变都可能是潜在的风险。风险是治理当中的突变因素，如何治理这种因素甚至决定一个人或机构的生死存亡。对风险的认知能力决定了一个政治治理秩序、一个组织机构、一个群体或是一个社会个体的未来。\n\
    \n在保证安全可控的前提下适度地人为制造风险或利用风险或为他人制造风险或将自己的风险转嫁输出给他人，是另一种精致利己或损人利己的“智慧算计”，但是，这是极具危险的游戏，因为其后果往往不可控，更有可能伤及自身。\n\
    \n随着全球化进程的推进，世界已经成为一个多元的整体，任何局部的改变都可能引发全局的震荡或某种改变，从进步的意义上讲，这些带来改变的风险是社会进步的动力之一。人类社会的发展，一直是迎接并解决一个接一个风险而成长、进步的。从系统论角度来讲，“蝴蝶效应”是对风险改变世界的最好诠释。\n\
    \n有研究表明，人类基因中有8%的DNA片段来自自然界的病毒，正是这些病毒，改造着人类的基因，并促使人类与这个世界更加和谐相处。对风险的认知和接纳，是人类必须面对的一个客观现实。对于一个组织来讲，接纳并阻止或改变风险的走向和风险带来的后果，是必须面对的核心议题。风险对社会的颠覆和改变有时候是良性的，它能推动某些进步，但它带来的更多是破坏和毁灭。《风险社会》的作者德国社会学家乌尔里希·贝克说，后现代社会的风险已经全面来临，并挑战工业社会所形成的文明框架和风险现实。他说，“后”是茫然无措的代号，自陷于流俗时髦，它“指向一种难以名状的超越之物”，这是我们“借以面对四分五裂的现实的基本处方”。因此，人类想要获得成功，“只有同旧的理论和思维习惯进行一场艰苦搏斗”。\n\
    \n我们需要重新审视风险这只怪兽所带给我们的所有改变。只有积极地应对，有效地规避，合理地利用，努力让风险成为我们这个社会前进和发展的动力，才是我们风险治理的核心。这需要智慧。\n\
    \n风险有大有小，但风险应对思维和风险应对策略是一致的，那就是勇敢面对，有效规避，合理利用，在改变风险的同时也改变我们自己。“黑天鹅事件”“灰犀牛事件”，这是我们常挂在嘴边的术语，这两类事件的本质是相同的，它们都能带来巨大的破坏力，甚至是颠覆力，它们轻则破坏一个组织，影响某些个体的方方面面；重则颠覆一个社会，一个治理的现存秩序。\n\
    \n自然界充满了各类风险，人类社会也充满了各种风险，风险无处不在，无时不在，人类生活在一个被风险环绕的危机环境中，从来如此，并且，从未改变过，这就是过去的现实、今天的现实，还有未来的现实。没有风险的社会是不存在的，这不是危言耸听。\n\
    \n“生于忧患，死于安乐”，“未雨绸缪，防患于未然”。中国的古人早就给我们的风险治理开出了良药。\n\n风险一直在倒逼我们反思，反思自身，反思我们这个社会的发展短板，反思我们的治理短板，它让我们清醒，让我们时刻保持戒备，让我们时刻准备接受来自风险的挑战。\n\
    \n面对各类风险，我们真的准备好了吗？\n\n对风险的剖析和趋势分析、风险防范和风险应对是风险治理的核心要旨。古语云，良医治无治之病，故人常在生也；圣人治无患之患，故天下太平也。即居安思危、未雨绸缪是风险治理的首要目标。\n\
    \n“星星之火，可以燎原。”任何对风险的无视或轻视都会让我们付出代价，这种代价可能是致命的。一个现实是，当无数风险累积和风险叠加态势来临的时候，我们如何科学应对、有效防范并化解，这不仅考验我们的勇气和决心，也同时考验我们的风险防范体系建设的成效。\n\
    \n“压死骆驼的最后一根稻草”究竟在哪里？那一根稻草，可能是一次意外的事件，一个拍脑袋的决策，一个灵机一动的治理举措。\n\n忧患意识，风险思维，数据决策，这是我们每个人都必须重修的一堂课。我们在警惕显性风险的同时，更要警惕那些隐性的风险带给社会的巨大破坏力。\n\
    \n“COVID-19”（新型冠状病毒），一个在2019年底开始肆虐的病毒终成2020年第一只“黑天鹅”，令人猝不及防。尽管这位不速之客终会束手就擒，但它留给我们的教训将会是长久的、深刻的。新型冠状病毒这个“黑天鹅”事件不仅是对各级政府的风险决策水平、公共应急体系、社会动员能力的一次大考，同时也是对公众现代意识和社会治理参与能力的一次检视。这一次，我们终于发现，我们与风险和危机只有一层口罩的距离，而那些所谓的“岁月静好”只是一种病态的安逸感和被幻象主导的满足感。\n\
    \n社会重大风险防范和化解已经成为各级政府的核心任务和重要工作选项。居安思危，未雨绸缪。面对可能的风险，我们需要再多一些敬畏，再多一些准备，再多一些预见，同时要少一些侥幸，少一些盲目乐观，少一些拍脑袋决策。忧患意识，风险思维，数据决策应当成为各级政府风险战略管理的核心。“黑天鹅事件”经常是社会重大风险“灰犀牛事件”的催化剂和导火索。治理的短板即是风险之所在。治理体系和治理能力的现代化需要不断提升政府补齐短板的能力，通过增强风险防控手段，提升风险防控能力，让数据决策增进传统决策效能，构建现代风险研判标准和风险治理体系。归根结底，应对突发公共事件的能力和表现，是检验所有风险治理体系和风险防控能力建设的试金石。\n\
    \n“吃一堑,长一智”，这是我们在风险治理当中所应秉持的初心，唯有如此，我们才不会在下一次风险来临的时候因为犹豫不决、手足无措而狼狈应对，进而陷于巨大的被动。\n\
    \n这本书是我长期从事网络空间风险治理研究的个人思考，我希望本书能够成为我们重建风险思维，增强风险治理意识，推进风险治理体系建设，提升风险治理能力的一个参考。\n\
    \n如何认知风险、建立风险思维、科学认知风险是撰写本书的基础,“未雨绸缪，防患于未然”是本书讨论的核心问题，感知和预警风险、规避和利用风险、协同和高效地处置应对风险是本书要讨论的方法论以及工具维度层面的重要问题。\n\
    \n大数据、人工智能技术的快速发展和应用为现代风险治理提供了可能和技术实现的基础，亦会成为现代社会风险治理的利器。同时，我将对大数据和人工智能技术在现代风险治理中的应用场景进行一些思考和探索。\n\
    \n未来已来，将至已至。\n\n是为记。\n\n![](images/figure_0013_0001.jpg)\n\n二〇二〇年二月二十四日于北大燕园\n\
    \n# 第一章 风险思想起源和风险治理的发展\n\n## 1.1 风险管理思想的起源\n\n在中国语言文字中，关于“风险”一词的由来最为普遍的一种说法是，在远古时期，以打鱼捕捞为生的渔民们，每次出海前都要祈祷，祈求神灵保佑自己能够平安归来，其中祈祷的主要内容就是让神灵保佑自己在出海时能够风平浪静、满载而归。他们在长期的捕捞实践中，深深地体会到“风”给他们带来的无法预测、无法确定的危险，他们认识到，在出海捕捞打鱼的生活中，“风”即意味着“险”，因此有了“风险”一词。在中文的表达中，风险经常与危险等同。从词源来说，风险涵盖的范围则更为广泛，时间尺度更大。\n\
    \n《现代汉语词典》说，风险指可能发生的危险。在这里，风险和危险是一致的，均指某种未来的可能性，而且这种可能发生的事情都能带来对现有状态的破坏和对现有秩序的挑战。\n\
    \n另一种经过多位学者论证的“风险”一词的“源出说”称，风险（Risk）一词是舶来品，有人认为来自阿拉伯语，有人认为来源于西班牙语或拉丁语，但比较权威的说法是来源于古意大利语的“Risque”一词。在早期的运用中，也是被理解为客观的危险，体现为自然现象或者航海遇到礁石、风暴等事件。大约到了19世纪，在英文的使用中，风险一词常常用法文拼写，主要是用于与保险有关的事情上。\n\
    \n现代意义上的风险一词，已经大大超越了“遇到危险”的狭义含义，而是“遇到破坏或损失的机会或危险”。可以说，经过两百多年的演绎，风险一词越来越被概念化，并随着人类活动的复杂性和深刻性而逐步深化，并被赋予了从哲学、经济学、社会学、统计学甚至文化艺术领域的更广泛、更深层次的含义，且与人类的决策和行为后果联系越来越紧密，风险一词也成为人们生活中出现频率很高的词汇。无论如何定义风险一词的由来，其基本的核心含义是“未来结果的不确定性或损失”，也有人进一步定义为“个人和群体在未来遇到伤害的可能性以及对这种可能性的判断与认知”。如果采取适当的措施使破坏或损失的情况不会出现，或者说智慧认知、理性判断，继而采取及时而有效的防范措施，那么风险可能带来机会，由此进一步延伸的意义，不仅仅是规避了风险，可能还会带来比例不等的收益，有时风险越大，机会越大、回报越高。\n\
    \n中国古代的风险管理思想早在夏朝后期就已经出现。《夏箴》载：“天有四殃，水旱饥荒，其至无时，非务积聚，何以备之。”意思是说，自然灾害何时发生难以预料，需要随时储粮备荒。\n\
    \n《周礼》则说：“谷有余则藏之，以待凶年而颁之。”春秋时期，墨子则主张“必使饥者得食，寒者得衣，劳者得息”和“有力以老人”。荀子提出“节用裕民，而善臧其余”“岁虽凶败水旱，使百姓无冻馁之患”。这些论述，是要求大家把剩余产品（主要是粮食）积蓄起来，才能使百姓遇灾荒年代不受饥寒，社会鳏寡孤独和残疾人等都能得到国家的保护和社会的扶助。在此思想指导下，我国历代都有赈济制度。周朝有委积制，战国时期魏国有御廪制、韩国有敖仓制。在汉代，则有常平仓制，隋朝有义仓制，宋朝有社仓制等，这些赈济制度其本质上是建立后备、应付饥荒的一种风险对策。\n\
    \n在历史上，古巴比伦、古埃及、古希腊和古罗马等文明古国也很早就有互助互济、损失补偿的风险处理方法，并逐渐演变成为现代保险。例如，在公元前2800年，古埃及就盛行互助基金组织，参加这一组织的成员订立契约，共同遵守。当某个成员不幸死亡时，由生存的成员所缴纳的会费支付丧葬费或救济其遗属。\n\
    \n风险管理意识的形成和增强是风险管理产生的思想基础，高度的物质文明是风险管理产生的物质基础，社会矛盾的激化以及动荡的局势是风险管理产生的社会基础，概率论和数理统计为其提供了理论基础，近代的科学管理思想为现代风险管理产生做好了最后的准备。\n\
    \n概率论和数理统计的运用，使风险管理从经验走向科学。风险管理的研究逐步趋向系统化、专门化，风险管理终于成为管理科学中的一门独立学科。风险管理作为一门新兴的管理学科，在其形成和发展的过程中，由于对风险管理出发点、目标和运用范围等强调的侧重点不同，学者们对风险管理提出了各种不同的观点，并且随着时代的发展与应用领域的拓展而不断演变。但人们对风险管理的基本理论的认识逐步趋向一致，如风险管理是一项事前的准备工作，而非事后弥补工作。风险管理必须集中管理以发挥决策效益，分散执行、分工协作才能使风险管理工作获得最佳效果。\n\
    \n现代风险管理理论形成于2009年11月15日，国际标准化组织ISO正式发布用于风险管理的标准：`ISO31000:2009《风险管理原则与指南》`、`ISO指南73:2009《风险管理术语》`、`ISO/IEC\
    \ 31010:2009《风险管理与风险评估技术》`。我国也于2009年发布了国家标准`GB/T2453:2009《风险管理原则与实施指南》`。该标准定义了风险的概念，确定了风险管理过程，规范了风险评估程序，指出了风险管理的十一项重要原则，明确提出风险管理的首要原则是创造并保护价值，并明确指出风险是不确定性对目标的影响，其中的“影响”有可能是正面的，也可能是负面的，可能存在机会，也可能有威胁。风险管理就是管理不确定性、减少威胁、放大机会、创造条件以改变风险传导的过程，使其有助于目标的实现。\n\
    \nISO三个标准的发布，标志着人类对风险管理取得了重大进展，是人类在管理领域的又一个里程碑式的成果，它的发布将改变世人对风险纯负面的认识。这个标准将世界各国管理风险的先进理论及方法融为一体，人类管理风险、预见未来的能力进入了一个全新的纪元。\n\
    \n## 1.2 现代社会的风险与危机治理\n\n自19世纪开始，人类迈入了工业化时代、科技时代，以及数字时代。科学技术的迅猛发展以及普及，已经深深地影响了人类的生活，改变了社会运行的规则，也重塑并改造着这个世界。人们在享受科技带来的便利和高效的同时，那些潜在的威胁也如影随形，时有发生，给社会造成重大的财产和生命损失。此类风险的社会危害烈度经常超过传统社会的风险带给社会治理和公众心理的震动。科学技术是一把双刃剑，剑的一面是快捷便利、高效实用和具有舒适性，剑的另外一面则是抛弃传统、恶化环境以及人类对科技产生过度依赖。\n\
    \n德国社会学家乌尔里希·贝克在他的《风险社会》的开篇中说，风险社会的轮廓是“在文明的火山上”。贝克在本书的序言中说，现代性从经典工业社会的轮廓中获得了解放，并缔造了一种新的形态，也就是书中所称的（工业化的）“风险社会”。\n\
    \n比如，随着科技的高度发展，核武器、基因武器、生化武器、网络病毒、环境恶化、化工污染、农药残留、水质破坏、雾霾天气、转基因、有毒食品、信息安全事故、毁林开荒、穷猎竭渔、围湖造田、拓矿建都、植被破坏、填海造地、拦河造坝等引发了一次又一次的重大灾难。\n\
    \n风险是一种大概率会出现的东西，心存侥幸也躲不掉，唯有认真应对才是正确的办法。现代社会的风险往往带有全局性的特征，所谓牵一发而动全身。这种全局有两层含义：一是风险波及的面广，所造成的危害也经常是全社会甚至是全球性的；其次，是风险的全领域性质的破坏，一个领域的风险经常触发其他领域的风险同时出现，导致不同风险危害叠加，加重风险的破坏力。因此，现代社会风险治理应当遵循系统论和全局观念，形成整体的、系统的、科学的风险治理框架。防止风险在“木桶的最短板处”和社会治理的最薄弱处出现，并引发全局的危害。\n\
    \n危机是社会重大风险的集合，某一次危机就是某一个重大风险。从规模和破坏程度上来讲，危机的破坏性比普通风险要高许多，其影响面和持续的时间也更长。对危机或社会重大风险的警惕是任何时候都不能掉以轻心的。\n\
    \n风险会引发重大安全隐患，若对风险认知不足、预防不力、应对不及时、处置不得当、事后不补救，则会导致严重的社会危机和不良后果。因此，对风险的关注即是对危机的关注，对危机的关注就是对安全的关注。\n\
    \n# 第二章 风险研究与风险战略\n\n## 2.1 风险学与风险战略\n\n风险学，或称风险研究学，即研究风险发现、风险预防、风险治理以及风险应对的科学。风险学目的是风险的洞察发现、趋势分析、研判应对，以提升社会治理及公共服务能力，化解社会矛盾和各类危机。风险治理包括传统的社会风险治理和网络空间风险治理。\n"
