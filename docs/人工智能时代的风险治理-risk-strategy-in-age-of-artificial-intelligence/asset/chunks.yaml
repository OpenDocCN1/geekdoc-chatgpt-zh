- raw: '从目前国家监管部门及网民对各大网络平台的核心诉求来看，一方面是来自内容上的，另一方面则是关于数据安全方面的。特别是近两年，随着个人信息违法案件的增多，国家对此类事件的严管力度也在不断增强。如2019年8月底，由某科技公司开发的一款换脸软件“ZAO”在各大手机应用市场上昙花一现，其迅速蹿红又迅速下架的主要原因正是侵害了用户的个人信息安全，其用户协议中的个别条款不仅涉嫌侵犯用户隐私，并暗藏霸王条款等问题，该事件引发了网民的极度不满，工信部也对开发公司进行了约谈，最终导致产品“流产”。


    此前，国内某平台也曾出现过源代码泄露、视频信息遭盗用等情况，此类突发状况不仅对平台安全造成威胁，增加用户的不安全感，同样也会给公司在资本市场上的表现带来直接影响。


    2018年7月20日，央视新闻公布了一则“拒绝网络低俗动漫，营造正能量网络环境”的消息，直接点名B站。B站因低俗动漫内容被国家有关部门约谈，并予以处罚和整改。基于用户年龄特征，低俗内容传播对年轻群体的影响可谓是根深蒂固的，同时也导致家长群体对此类平台进行抵制。


    （一）互联网最新技术发展现状


    1．大数据应用逐渐成熟，产业处于快速推进期


    大数据技术的发展如火如荼，在国内各个领域都得到了广泛的应用，具有十分良好的发展前景，商业类行业对大数据应用较多，主要将大数据与传统企业相结合，有效提升运营效率和结构效率、推动传统产业升级转型。目前大数据分析解决方案已经逐渐成熟，并且越来越普及。伴随技术进步，以大数据为基础而开发的应用将越来越丰富。目前，从发展阶段来看，我国大数据产业处于快速推进期，中国和美国几乎同时关注大数据产业，但与美国存在一定差距，我国处于探索的初期阶段，想要进一步发展还需要几年的时间。


    2．人工智能发展突飞猛进，摩尔定律赶不上其流行速度


    2017年以来，人工智能跳出AlphaGo的棋盘，在获得舆论极大关注和资本热情拥抱的同时，在各行业得到广泛应用：在出行领域，由人工智能驱动的无人驾驶汽车驶入各种展会；在医疗领域，具有深度学习和图像识别能力的人工智能已经可以帮助医生识别肺部结节，甚至通过国家执业医师考试……在人脸识别、智能家居、智能教育、智能语音、物联网等领域，人工智能都取得了较快发展。一切都进展得太快，连摩尔定律似乎都赶不上人工智能流行的速度。据前瞻产业研究院数据，中国2017年人工智能产业规模大概为135亿元，2018年大概为203亿元，同比增长50%。


    3．区块链产业链基本成型，受到政府部门鼓励支持


    区块链应用在中国呈现出多元广泛、积极活跃的特点。2014年以来，中国区块链领域私募股权投资共计投向挖矿、钱包、虚拟货币、基础设施、底层技术、交易所、相关服务、区块链应用8个领域，中国区块链产业链可谓基本成型，中国成立区块链相关的行业协会联盟近20个，区块链和数字货币已经成为中国大众的主流关注点和日常用语，传统机构和国企机构间接入场。各地政府高度鼓励区块链技术，央行正在进行的国家数字货币试点，区块链也是其实现的技术之一。


    4．卫星互联网正加紧布局，竞争却早已白热化


    卫星互联网领域竞争正在加速展开，中美两国都开始发力该领域，目前处于部署阶段。近期，中国航天科技集团正在部署一个低轨道通信卫星星座。一期工程将建设54颗卫星，然后建设二期工程，实现系统能力平滑过渡，卫星数量最终超过300颗，将全面启动全球移动宽带卫星互联网系统建设。建成后，它将成为全球无缝覆盖的空间信息网络基础设施，为地面固定、手持移动、车载、船载、机载等各类终端提供互联网传输服务。卫星互联网系统可以在深海大洋、南北两极、“一带一路”等区域实现宽带窄带相结合的通信保障能力。通过该系统，处于地球上任何地点的任何人或物在任何时间实现信息互联。


    5.2020年启动5G商用，通信设备企业正加紧研发


    5G标准化研究提案在2016年世界电信标准化全会（WTSA16）第六次全会上已经获得批准，这说明我国5G技术研发已走在全球前列。《“十三五”规划纲要》提出要积极推进5G发展，布局未来网络架构，到2020年启动5G商用。华为、中兴、大唐等国内领军通信设备企业高度重视对5G技术的研发布局，在标准制定和产业应用等方面已获得业界认可。2017年12月21日，在国际电信标准组织3GPP
    RAN第78次全体会议上，5GNR首发版本正式冻结并发布。2018年2月23日，沃达丰和华为完成首次5G通话测试。2018年6月到2019年12月，中国电信进行规模试商用，2020年之后就会进入大规模商用。


    （二）互联网最新技术在传媒领域应用现状及前景


    1．大数据促进传媒转型升级，两者贴合会更紧密


    各大媒体开始接力大数据，在新闻报道、媒体融合、舆论监测等维度寻找更多突破口。中央级媒体及多家地方传媒集团借助大数据走上转型之路，并开展有益尝试，已取得初步成效。比如，可视化新闻，利用大数据收集民意等，在重大新闻报道的各个环节，几乎都可以看到大数据的影子。“中央厨房”大数据采编发布模式，成为诸多主流权威媒体的选择，不仅促进新旧媒体融合，还很好地让内容被更精细地制作发布，利用大数据排列组合适应不同读者群体的需求。而利用大数据进行舆论监测预判，也拓宽了传媒行业的认知视野和报道角度，也有助于传媒与读者的距离。


    随着传媒与大数据贴合更加紧密，更多有意思的新闻可以自动生成，新闻信息和维度会更丰富，读者面目也将更加清晰。


    2.“AI+News”模式正在广泛尝试，传媒更加智能化


    人工智能近两年来强势入驻传媒业。人工智能来自深度学习，这能够有效连接互联网与传统行业，使得“人工智能+传媒”颇具前景。人工智能在传媒领域的应用，最常被提及的应该就是“写作机器人”和“算法推荐”。机器人写作早已不再陌生，2017年8月8日九寨沟地震报道，就是由中国地震台网中心的机器人用时25秒写就的。封面传媒早在2016年12月20日，就应用机器人写出了第一条商业促销打折资讯。算法推荐更是在近年成为新闻客户端推荐新闻的标配，在个性化推荐方面，今日头条、天天快报和百家号都在不断尝试。随着用户数量的增加，通过相似点描绘可以将人不断地分群，进行群体分发，再加上之前累积的数据，通过算法运算完成智能化推荐。


    目前，国内“AI+News”的发展较为缓慢，暂无大规模较频繁应用，机器新闻仅发生在资讯整合上，算法推荐还需要不断完善，人工智能完全应用于传媒领域仍有距离。


    3．区块链技术稳妥消除传媒痼疾，为媒体融合开辟新路径


    Facebook创始人扎克伯格在2018年度目标中表明，将探索区块链技术在Facebook中的应用，通过“去中心化”的方式向人们赋权。区块链技术的应用早已引起国内媒体的高度重视。2017年3月19日，人民日报“中央厨房”与中国通信工业协会区块链专业委员会联合举办区块链技术融媒体应用合作交流会，倡导在版权保护、企业管理、信息安全技术等方面开展紧密合作。2017年6月9日，首届中国报业版权大会发起倡议成立中国数字内容区块链版权联盟，致力于构建一个去中心化的、可信的、可追溯的数字版权内容流通生态。媒体区块链作为一种“区块链+媒体”的应用创新，进一步提高新闻传播效率、减少信任成本、增强监管实时性。


    媒体区块链在知识产权、区块链生态圈、智慧社区、社会信用体系等方面的应用，将为媒体融合开辟全新路径。


    4．卫星互联网促使信息接收不受地域限制，传输更迅捷


    当前，卫星互联网尚处于硬件建设期，大规模应用仍需时间。2022年，我国将部署、运营整个星座，构建156颗卫星组成的天基宽带互联网，形成以低轨宽带通信为主，并具备导航增强、实时遥感支持能力的通信、导航、遥感综合信息系统。该系统完成后，上网不再受到地域空间限制，信息传输将会更加迅捷。当前，基于卫星网络的公共文化服务平台，已初步应用到国家各领域和不同地区，包括与国家新闻出版署合作的“卫星数字农家书屋”、与中国妇联合作的“卫星数字妇女之家”，以及健康传播卫星网、安宣传播卫星网等。每一个卫星网点都是一个公共文化服务信息分发网点，融合Wi-Fi等网络技术，覆盖方圆300米范围人群，用户使用手机等设备就能浏览观看。


    随着卫星互联网建设日益完善，更多资讯能够实时传递给边远农村，彻底打破信息传输的地域局限。


    5.5G加速信息传播，媒体界限将不断模糊消解


    当下，5G网络仍处于基础建设期，暂未开始大规模商用。5G愿景是让用户进入全新的自由世界，5G最大的特征是传输速度快，其理论传输速度最高可达每秒数十GB，这比4G网络的传输速度快了上百倍。通过5G网络可以在任何终端收看高保真节目和直播，也不用担心资费过高。随着终端设备性能和网络速度的提升，自媒体内容制作将更加简单，传播更为快捷，小范围的互动性更强，互动形式将更加多元化。媒体专业和业余的界限进一步模糊，内容视角而非技术渠道将成为媒体竞争的关键因素。


    在这种融合状态下，媒体名称将只具有机构意义，信息流通的渠道制约将不复存在，所有的信息都能以最佳的表现形式来呈现，用户可以自由选择信息表达方式。届时，媒体之间的界线不断模糊消解，同时，5G时代让媒体在开拓新闻报道业务形态上大有可为。


    （三）人工智能最新技术给舆论传播带来新机遇


    1．媒介融合将在新技术助推下加速展开


    在舆论传播领域，大数据和人工智能的应用推进了媒体融合的进程。总体样本取代随机样本、对不精确的容忍度增加以及相关关系取代因果关系等大数据思维的运用，进一步助推媒体融合，对媒体融合造成突出影响。大数据思维对媒体融合产生了前沿性、操作性、传播性的影响。大数据助推媒体融合，帮助其实现传播主体复合化、传播渠道多维化及传播受众立体化，找寻到最契合的传播方式。人工智能技术则利用算法推荐技术，更好地让内容和受众匹配，深度学习也能在内容生产方面提供更多可能性，技术和媒介平台融合加速进行。卫星互联网和5G则为更多应用的实现提供技术支撑，比如AR、VR技术，让媒介融合更加快速、深入。


    2．舆论传播时空限制被打破，个体与社会实现更广泛连接


    5G在互联网技术的基础上改变人们的交流模式，以更加急速、跳跃、分散的形式影响人们对时间和空间的感知，地域、场景的空间真正瓦解，空间被极度压缩并且不再成为人们交流的桎梏。据统计，未来全球移动通信网络连接的设备总量将达到千亿规模。无论是在偏远地区、高速移动等恶劣环境下，还是在人员密集、流量需求大的区域，人们仍然能运用移动设备来进行远程交流与沟通。5G技术不仅会缩短人与人之间的时空距离，同时还将加速信息传播形态的变革。未来的信息传播形式将更加具象、直接、多维和动态，移动视频通信将成为人们的首选通信方式。5G时代，人们获取信息的速度大大提高，信息采集、传播的速度和规模达到空前水平。新闻从业者几乎可以不受限制地传输大量数据文件，实现数百张新闻照片或者新闻视频的瞬间传送，信息传播的效率将大大提高。卫星互联网也会助推消除地域空间的隔阂，让信息传播抵达每个角落，由于其传播的广度和速度，卫星互联网和5G共同打破传播的时空限制，民众之间的交流将更加便利。


    3．全方位地读懂受众，便于更有针对性地开展传播活动


    无论是大数据还是人工智能，都能够实现对海量数据的计算和分析，通过大数据可以掌握受众的各类数据，然后运用人工智能对这些数据进行分析和学习，能够快速地给受众“画像”，明白受众的需求和偏好，进而开展针对性的传播活动。当然，对于各类信息和活动的传播效果，也可以依托大数据来进行分析，以结果为导向改善各项工作。区块链技术也能够较好地保留受众痕迹，便于知晓和分析最真实的网民心理。


    4．稳妥解决传媒行业存在的问题，改变传统业态


    当前，舆论传播领域存在诸多问题，比如信息失真、谣言泛滥、版权之争、付费问题等，如何减少网络谣言、净化新舆论传播环境，是中外媒体监管的老大难问题。然而，区块链技术具有无需中介参与、过程高效透明且成本很低、数据高度安全等优势，随着区块链被广泛运用到该领域，这些棘手的难题极有可能被稳妥解决。一是区块链技术可以提供一整套追踪新闻来源的解决方案，从而实现媒体信源认证。使用区块链技术发布的新闻在被加密的同时，共享到多台个人计算机上，第三方机构很难进行篡改，而谣言回溯，则直接通过区块链技术就很容易实现。二是区块链技术可以很好地保护版权，区块链技术能以数字签名和哈希算法对新闻作品版权进行精准跟踪，从确权、用权、维权三个环节完整记录新闻作品版权流转过程。2017年3月上线的“版全家”应用平台，使用人工智能和区块链加固技术，提供版权登记、转授权合同备案登记、版权检索、版权交易、版税结算、侵权举报和维权申诉等一系列服务。三是区块链可以提升内容交易双方效率，借助区块链技术，撰稿人和自媒体可以通过智能合约对内容自主定价，绕过媒体平台直接和“粉丝”互动，获取打赏和订阅费用，也不再需要花费大量的时间和金钱去监管和核对合同及进行复杂的利益分配。区块链还带来广告的精准投放和应用，区块链技术甚至可以解决传播数据不透明、有偏差的问题，以及网民评论遭恶意删除问题。


    5．实现人与物的智能传播，传播媒介无处不在


    5G技术的发展将加快人类进入Web3.0万物互联时代的步伐，新一轮智能化浪潮不仅能实现人与人之间的无缝连接，还将实现人与物、物与物的高速连接。在5G技术的支持下，人类感知、获取、参与和控制信息的能力将达到前所未有的高度。利用5G技术，人们及时跟家里的设备进行数据交换，还能实现汽车自动驾驶、智能家电等新技术。许多信息传播和事物运转不需要人亲自参与，而是通过网络技术实现，在5G、大数据、人工智能、卫星互联网等技术的助推下，信息的传播不再局限于传统媒介与新媒介，生活中各类电子设备都可能成为传播的介质。


    （四）互联网最新技术给舆论传播带来新挑战


    1．过度依赖技术致使内容分发受误导


    大数据和人工智能技术催生“算法推荐”这类内容分发手段，技术带来了红利，也对网络舆论生态产生负面冲击，给社会管理工作带来较大挑战。2017年9月，人民网曾连发3篇评论文章，批评以今日头条为代表、单纯依靠算法推荐的平台价值观缺失、制造信息茧房以及走向媚俗化，并过度追求“眼球新闻”。随着5G时代到来，信息将会更加过载，“算法推荐”的作用可能会渗透到各个方面，倘如监管不到位，其负面效应可能被放大。


    2．不良信息可能借助新技术快速传播


    区块链技术具有去中心化、可追溯、不可篡改等特点。那么，不良信息极有可能借助区块链技术进行扩散，内容上传可能不需要进行专门审核，或者只是企业设置简单的审核条件，难以规避潜在内容风险，不良信息可借此逃避监管。内容上传成功后，清除处理也会比较困难，这给不良信息传播留下时间和空间。5G时代，各类不良信息的传播效率显著增加，传播甚至会以视频为主，这既会加快信息传播速度，又会加大信息量和解读空间。


    3．政府部门监管难度将会急剧增加


    根据区块链的技术逻辑，不可以进行删除处理，即使内容存在明显问题也很难被处理。倘若借助区块链技术进行传播，要想消除就会比较麻烦。“去中心化”特点让内容监管审核遇到障碍，而“不可篡改”则让后期整治遭遇困难。即使能够对内容进行有效监管，由于传播速度过快，往往在开展处理整治之前，可能已经造成了难以估量的负面影响。同时，倘若视频审查监测技术难有重大突破，那么对视频的审核仍将主要依靠人工，审核成本将会剧增，工作量将呈几何级增长。


    4．各类信息严重过载让民众陷入焦虑


    互联网最新技术带来便利的同时，也可能产生一种新的异化和负面作用。信息呈现指数级增长，越来越多分散的、支离破碎的信息充斥着人们的视野，人们在混沌的信息空间和“数据过剩”面前，可能陷入焦虑状态，会有更多的压迫感和紧张感，后真相特征会更加凸显，网民容易被不良信息带偏。4G时代存在的各类舆论传播乱象，5G时代可能会更加严重。


    5．大数据技术或出现数据盲点、窃取隐私数据


    人工智能主要依托大数据技术，对数据进行深度挖掘、分析和学习，而在此过程中，个人的隐私数据就有可能被抓取，甚至存在泄露的风险，新技术更懂受众的前提，就是对受众的各项数据进行收集和分析，大数据技术却会危及个人隐私数据安全，各类泄露窃取事件，一直就没有停过。此外，大数据技术还可能出现数据盲点，也就是有些数据抓取不到或不全，或者制造假数据，打着大数据的幌子给出错误的结论，对网民认知判断造成严重干扰。


    （五）如何运用和管理互联网最新技术


    1．合理利用大数据收集并洞察民众心理期待


    网民对社会热点的认知、对政策法规的态度和对国际问题的看法，都可以通过大数据技术进行收集分析，合理利用社交媒体等网络平台上的数据进行分析和总结，有助于政府部门决策科学化、规范化，能够帮助相关部门了解近期社会思潮和网民对于热点问题的基本看法，这对于决策施政无疑都是有益的。


    2．利用区块链处理版权问题和谣言问题


    区块链的可追溯特性，让不少舆论传播难题迎刃而解。区块链技术将更准确地追踪每个内容产品的版权所属，由此将更好地保障内容所有者的合法收入，随着区块链的大规模应用，侵权和盗版将几乎不可能实现。媒体权威报道在区块链技术下很难实现更改，而普通谣言可以很快实现追溯进行打击。


    3．理应尽快提高网民媒介和信息素养


    5G时代即将到来，提高网民的媒介素养和信息素养变得更为重要。在信息爆炸和传播加速的场景中，没有较强的信息辨别能力，就极易被不良信息蒙骗，被不良情绪煽动，被别有用心者利用甚至坑害。政府部门可以利用媒体宣传、社区教育等方式，逐步来提高网民的信息辨别力，常态化地开展辟谣和宣教工作，对于不良信息和情绪要及时进行澄清和引导。


    4．加大技术研发力度提高视频审查效率


    5G时代传播必然以视频为主，大量视频内容将充斥网络，网民随手拍随手发布，对这些内容进行审核将会成为监管部门的重要工作之一，倘若仍用人工进行审核，不仅效率较低也耽误时间，影响网民的5G使用体验，这就要求必须尽快在视频审查监测技术领域取得突破。当前，文本监测审查技术已经成熟，视频内容审查技术也必须要跟上5G时代的发展要求。


    5．完善法律法规提前介入新技术规则制定


    区块链技术要求“去中心化”“不可篡改”，这样的技术逻辑在某些领域可以推行，但在内容传播领域却有着较高的风险，一是内容不经审核会出现问题，二是内容出现问题没法快速删除。这就需要监管部门能够尽快完善法律法规，提前介入区块链领域的规则制定，比如，使用区块链技术发布违规内容的处罚方式，监管部门以什么角色介入管控，或者能给监管部门留出审核权限等。


    对于人工智能技术在内容领域的应用，也要及时介入治理，要对“算法推荐”开展定期巡查，发现内容存在的问题，并力促企业调整相应的算法规则，让“算法推荐”更契合新时代网络内容建设要求。


    人工智能最重要的技术方向就是用数据、算法模拟并还原人类思维和人类决策的全过程。人类的特性即是人工智能的技术和发展特性。人类的特性表现在：自我复制、自我修复、自我学习、自我进化、自我意识。人类活动的场景就是人工智能的应用场景。人工智能技术发展与人类智慧发展特性高度趋同是一种必然趋势，但永远不会超越人类的智慧。然而在某些领域，人工智能设施设备的破坏力却可能远超人类，这才是应该规避的人工智能应用风险，这些领域包括政治议程设置、网络舆论操控、网络战、信息战、金融战、网络犯罪等。


