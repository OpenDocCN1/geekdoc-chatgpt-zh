    最后，《战略》明确地对外部世界表明态度，中国将利用经济、法律、外交及军事措施维护本国网络空间主权，“网络空间是国家主权的新疆域”，中国将“建设与我国国际地位相称、与网络强国相适应的网络空间防护力量”。


    ## 第四


    坚持网络主体共同参与治理，强化网络平台责任是推进网络治理体系和治理能力现代化的重要环节。


    近年，某电子商务企业安全部门与绍兴警方联手，会同全国二十余省公安机关数万警力，成功破获“8·14”盗号专案。这是警方近年来处置的最大的个人信息安全案件之一。这种网络空间治理模式，可称之为网络时代的新“枫桥经验”，这是典型的互联网条件下的群防群治，是社会治安综合治理进入网络时代的最新发展，也是对“枫桥经验”的进一步丰富。


    首先，网络新“枫桥经验”的意义是社会治理模式面对以互联网为代表的第三次技术革命挑战，而做出的适应性变革。


    其次，在互联网立法中应该推行民主立法，也就是立法机关主导、社会各方有序参与。这是因为，互联网的发展对现实社会的改造程度和影响都很深入，在确定相关立法的时候要调整的社会关系也非常多样，且涉及不同利益的相关主体，这就需要企业、消费者、政府共同参与整个立法进程，而不能只听其中一方的意见。只有在立法机关的主导下，促进各方积极参与，进而平衡各方的现实利益，才能使互联网发展得更好。


    再次，应进一步加大对诸多网络服务提供商的管控和制裁力度。“网络平台责任”在网络空间化时代不可回避。网络平台本身可视作网络空间中的“准政府”“准国家”，网络运营商的服务和服务的实际效果超越国界，它提供着网络社会的生存平台，事实上承担着“网络社会”的部分管理职能，必须承担起必要的社会责任，尤其网络空间治理责任。


    复次，当前，我国网络空间治理以政府部门的行政监管为主，各主体共同参与的治理机制尚未形成。一是政府部门的管理权限存在一定交叉，不仅造成了政出多门、决策分散，且容易出现“越位”“错位”等现象；二是企业和行业组织的作用发挥不足。例如，在网络安全威胁治理方面，相当多的企业在网络安全方面投入不足，因防护措施不力招致的网络攻击和用户隐私泄露不在少数；三是网络用户的意识和参与治理的积极性不高。


    又次，要把握网络社会的特征，进而实现治理创新，同时也是全面深化改革的重大课题。实现治理现代化目标的一个路径是社会共治。网络社会比实体社会更需要强调社会共治。网络社会的虚拟性、与实体社会的不可分割性、公众参与的广泛性三个特征指向的治理模式就应当是共治。


    最后，网络安全治理是一项系统工程。与传统安全相比，网络安全更具多元与跨界特点，这要求其治理模式须破除条块分割状态，构建“全政府、全社会”参与的全流程治理体系。与网络安全的复杂特性相适应，网络安全治理必须突出系统性建设，逐步建立起政府主导，公私合作，全社会参与的管理模式。此治理体系中，政府需要积极发挥组织、指导职能，调动各利益攸关方参与治理的积极性，提升全民网络安全防范意识，构筑健康网络安全文化。


    # 第九章 中国城市公共服务和城市治理指数体系


    ## 9.1 中帼城市政府治理和公共服务指数


    中国城市政府公共服务和城市治理指数，简称中国政府指数(`China Government Index`，简称`CCI`)。


    以中国政府指数为前导的新一代智慧政务服务体系旨在创新我国的政府信息化、政府治理、公共服务，引领我国电子政务的建设、应用进人以服务为核心的新阶段；同时，通过为数字政府、智慧政府提供服务和支持，实现在不触及我国法律法规、规章制度、政策规定的前提下，极大丰富政府资源，提升政府能力，为互联网+政务服务、互联网+监管等提供强大基础设施、技术资源和运行服务支持的目的。


    ![](images/figure_0215_0001.jpg)


    以态势感知为核心的新型电子政务应用体系


    这一体系由中国城市政府指数、自启动机制和工具包、电子政务服务平台以及政府大数据线上线下融合落地4个部分组成。


    中国政府指数是由北京大学电子政务研究院开发、发布用来监测、描述、评价中国城市政府政府治理和公共服务状态的动态量化指标体系。指数品种依据城市政府的职能、职责设立，涵盖政府治理和公共服务各个方面，包括用于监测政府治理和公共服务总体状态的一级指数和用于反映、标识政府各个职能、职责部门运行状态的二级指数。全部开发完成后，指数品种总数将达百种以上。


    指数按照各类指数性质、功能的不同，采用持续发布、分步定时发布和定制发布等形式公布。


    中国政府指数利用定量和定性相结合的方法，是连续、动态的城市整体运行状态评估体系。该体系将为现代政府治理、公共服务、民生服务均等化、城市经济发展、城市应急和社会重大风险防范与化解提供重要的决策参考。


    中国政府指数共分为三级指标，指数品种超过一千种。


    一级指数主要满足城市政府治理和公共服务状态的总体描述和监测需要，通过指数测量、排名，对城市政府的治理绩效和公共服务水平、能力进行测量、排名。一级指数采用年度定时发布方式公布。


    二级指数主要针对各级政府监测、控制各个职能部门运行状态的内部管理需要设立。同时，二级指数还具有数字化实时风险预判、监测、评价和政务公开功能，能够成为各级政府加强内部管理、运行控制和业务运行自启动的工具。二级指数采用模块化（即依据相关法律法规规定而形成的职能模块）分步定时发布和定制发布形式公布。


    中国城市政府指数品种众多，指数发布工作量大、涉及面广，这一特点决定了指数发布将采取一级指数年度总发布，二级指数季度、月度轮流发布，线上线下发布相结合方式，全年度持续进行。


    指标体系的建立需要重指标，还需要重评价，并建立相应的状态阈值等。对综合指数构建归一化后可以进行百分制打分，将结果离散化，分成4个等级，如按照运行健康程度分为100～85（红色）、84～76（橙色）、75～66（黄色）、65～0（蓝色），直观标注指标状态。


    ## 9.2 中国城市政府治理和公共服务指数价值


    中共十九届四中全会做出了“推进国家治理体系和治理能力现代化”的决策，明确提出“建立健全运用互联网、大数据、人工智能等技术手段进行行政管理的制度规则”，“推进数字政府建设”。十九届四中全会决议将“坚持和完善中国特色社会主义行政体制，构建职责明确、依法行政的政府治理体系”列为“坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化”的重要内容，要求各级政府“优化行政决策、行政执行、行政组织、行政监督体制”，“创新行政方式，提高行政效能，建设人民满意的服务型政府”。


    中国政府指数依托我国多年来政府信息化、智慧城市建设的技术基础和资源积累，以数字化、大数据为主要方法，通过构建城市政府治理和公共服务运行的实时、动态数字“镜像”和政府数字画像，在丰富政府治理和公共服务数据资源的基础上，为政府提供作业的信号系统及其相关机制和工具，最终实现完善治理体系、提高治理能力和改进公共服务的目标。


    中国政府指数开发和应用所使用的互联网、智慧城市、大数据、人工智能等技术和资源，对中国城市政府治理体系的完善、治理能力的提升和公共服务质量的改进具有重要的价值。


    ## 9.3 中国政府指数数据收集和技术实现


    中国政府指数依据城市政府治理和公共服务的职能、职责、事项设立指数。设计共划分为五大部分：政府治理、政务服务、城市影响力、新技术与新经济、社会组织发展与社会服务。每个部分下设相关版块，共涉及144个数据项。（以2019年中国政府指数收集情况为例）


    数据项需要采集278个地级市政府的政府工作报告、国民经济和社会发展统计公报、2018年全市和市级预算执行情况及2019年全市和市级预算草案的报告以及2018年国民经济和社会发展计划执行情况及2019年国民经济和社会发展计划草案的报告等。


    在熟悉前期的数据需求后，根据政府的公示报告以及与相应指数的研究人员论证与讨论，并应对每个版块指数进行爬虫、搜索引擎、相关网站、相关论坛和人工的辅助查找，最终提炼出相应的数据出处，制定出相应的版块以及版块下属指数的数据出处规则，绘制成指数规则表。


    根据各项版块的指数规则表，最终确定大部分数据出自各个地级市的政府网站、人大网站、中级人民法院网站、政府信息公开网这几个主要搜寻网站中的政务公开、工作报告、统计年鉴、预决算信息、政府会议等版块。


    而其他相关辅助数据来源包括但不限于各省、地市、部门政府公开统计数据、报告、新闻等，社会网络各类政府相关新闻源、数据等，政府对社会开放的有关大数据数据源，相关部门提供的各类政府公开数据，其他社会机构提供的数据源。


    中国政府指数通过统一的计算体系和指标体系，由各类数据综合分析形成，所有的数据来源于各城市相关政府机构、企业管理、公共服务等机构发布的公开数据，因此数据来源真实、有效、权威。数据分析方法通用且普适，指数评价体系和方法、数据分析方法和各因素加权体系均按照统一的模型进行考量，所有分析、诊断和排序在过程和结果产生前后均不进行人工干预，以此确保评价体系的客观公正。


    由于指数要求数据量大，导致需要搜寻的各地级市网站量庞大，又因为各个政府网站结构复杂多变，均不统一，各个网站信息数据出处差异大，这就对统一爬虫体系的构建带来了巨大的困难，因此采用合适的爬虫体系和适当的爬虫方法就显得尤为突出。


    中国政府指数的数据搜集采用爬虫加人工相结合的方法，对于网站结构相近、数据出处统一的数据，采用分布式爬虫和浏览器模拟两种技术进行数据采集。而对于网站结构复杂、数据出处不明朗的数据，则采用人工搜集和寻找相关论坛来辅助搜集数据。


    取到数据来源文本后，对于搜寻和找到的数据、文档，进行清洗，对网页或者数据中的广告、版权等与指数数据无关的垃圾信息进行剔除和筛选，去除多个数据来源中数值相同值，对一个检测指数中、个别数据存在异常的进行统计，追寻数据存在异常的原因，将存在遗漏信息属性值的进行记录。对清洗完成后的数据，基于`ES`分词、关键词、语料（知识库）、`NLP`（自然语言处理）、地区等分析方法对各个版块的数据进行解析、分类统计、设定标签，最后存入数据库。


    指数的制作过程中，对数据库中的数据，技术人员通过统计分析软件，对一些数据指标进行了缺失值填补、异常值处理以及重复值的剔除等操作，最后结合相关统计学原理，运用`Powerbi`建立度量值、`M函数`、分箱化处理等，对指标做了诸如环比、同比等一些相关计算，最终得到一批高质量的中国政府指数原始数据及指标。


    ## 9.4 中国政府指数的实现方法


    ### （一）中国政府指数数据


    包括政府公开的各类数据、行业分析数据、学术科研机构数据、电信运营商数据、互联网公开的各类数据（包括自媒体数据）以及政府提供的内部业务数据。利用定向爬虫机器人，对目标网站进行数据抓取，再对采集到的数据进行结构化处理，同时利用语义分析和自然语言处理技术、知识图谱、机器学习等方法对所有原始数据进行清洗和预处理，并生成指数分析所需要的基数据。


    ### （二）文本数据碎片化处理


    对于采集到的文本数据，先将非结构化文本数据通过中文分词、实体抽取等技术进行碎片化处理，并将处理后的数据整理为可统计分析的结构化数据。


    通过设置动态关键词作为分词词典，包含政府治理（如空气污染物、治安等）、公共服务（如交通、教育等）、影响人群（如学校）、主体名称（政府办事机构）等。通过中文分词技术对采集政府公告、新闻、公开出版物、研究文献进行分析。同时统计动态关键词进行分析。


    将采集的文本信息中机构名、专有名词等通过实体抽取技术进行提取，对实体对应关键数据形成数组进行存储，存入数据库中。


    ### （三）数据有序化


    数据清洗工作完成后进行数据转换和归约。


    现实中采集的原始数据很多可能都是杂乱的、不完整的、有噪声的，常常还有多种不同类型，而且往往是高维度的，也就意味着有极多的可测量特征。在数据分析步骤之前，必须对数据进行预处理，这样可以提高需要分析的数据质量，从而提高数据分析的效率和效果。


    数据预处理包括两个部分：数据准备和数据归约。


    把杂乱、有噪声的原始数据集变成具有标准形式、优化后的分析数据集，要经过清洗、转换（数据准备），如果是大型数据集还需要进行缩减（数据归约处理）。


    ![](images/figure_0221_0001.jpg)


    数据预处理过程


    数据清洗(`Data Cleaning`)过程将数据集中的噪声数据识别、删除，同时纠正不一致的数据。错误的数据容易干扰数据分析过程的正常进行，甚至导致结果的准确性降低。包括两个部分：缺失值补齐和异常点分析。


    数据转换(`Data Transformation`)操作，是指将数据源数据变换为适合数据分析的数据形式。有三种方法：标准化、数据平整、差值和比例。


    数据归约包括三种方法：特征归约、值归约和案例归约。常用方法包括`FA`（因子分析）、`ICA`（独立成分分析）和`MDS`（多维缩放）。从数据中删除大多数非相关特征和冗余特征，选择出相关特征的一个子集就是特征选择。需要对特征的重要性进行计算并排序，然后根据排序确定选择哪些靠前的特征。常用的有`Relief算法`、熵度量方法、主成分分析等方法。值规约就是减少已知特征的离散值数目。传统的离散化是根据以前特征知识手工完成，而在自动离散化用均值和众数将值进行分箱处理，另外还可以用`X2统计`进行自动离散的`ChiMerge技术`。


