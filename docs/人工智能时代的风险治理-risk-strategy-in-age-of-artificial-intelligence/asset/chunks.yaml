    ## Chapter 6 Network Risk Governance Application Scenarios


    ## 6.1 Public Event Knowledge Base and Network Risk Governance Decision-making


    With the popularization and development of internet technology, the communication
    field has also undergone fundamental changes. Due to the virtuality, concealment,
    divergence, permeability, and randomness of the network, the general public has
    gradually become accustomed to expressing opinions and attitudes through online
    channels. Online media has been recognized as the "fourth major media" following
    newspapers, radio, and television, and online platforms have become one of the
    main carriers for reflecting social conditions and public opinion. Based on this
    change and trend, comprehensive network governance has become an important link
    in social governance.


    Doing a good job in network public opinion work is the primary task facing comprehensive
    network governance. Whether party and government organs or various enterprises
    and institutions, they have invested a large amount of human, material, and financial
    resources in network public opinion work, but in actual operation, there are still
    situations where they suffer from public criticism due to inadequate methods.
    Therefore, strengthening the construction of the network risk emergency management
    work system and innovating the work system and mechanism have become urgent problems
    to be solved by various social entities.


    The report of the 19th National Congress of the Communist Party of China explicitly
    emphasized the need to "strengthen and innovate social governance" and improve
    the "modernization level of the national governance system and governance capacity."
    From the perspective of the technical links in network risk governance work, at
    this stage, most of the public opinion technology systems in China are engaged
    in network information monitoring and early warning, and searching is also based
    on keyword search. This technical means only focuses on the "present," and the
    state of information presented is also the "ongoing present," and the value of
    the information has not been fully released. Judging from a large amount of public
    opinion disposal experience, a full-process review of past public opinion cases
    can effectively guide the disposal of currently fermenting public opinion, and
    even predict public opinion risks that may exist in future work, thereby making
    public opinion work targeted and proactive. The Public Event Knowledge Base and
    the Expert Decision Support System based on Case Knowledge have thus emerged.
    On the basis of fully integrating big data and artificial intelligence technologies,
    realizing real-time comparison between historical public opinion cases and real-time
    sudden public opinion events, this technology plays a positive role and has practical
    effects in innovating public opinion work.


    From the perspective of mainstream technical applications, currently, the various
    public opinion systems and applications launched on the market are basically flat-structured
    collection and analysis systems. The data information they collect and analyze
    follows behind netizen emotions and stops at "this moment." Therefore, in practical
    applications, there are three major pain points: first, there is no correlation
    and comparison with historical similar events, and their reference value is limited
    to the grasp of a single event; second, there is a lack of deduction on the development
    and evolution of public opinion, and the ability to predict is limited; third,
    the flat data language differs from the human problem-solving approach and cannot
    form a dynamic perception of network emotion changes.


    Through research and analysis of actual public opinion work, it is found that
    successful experience in responding to public opinion crises is worth summarizing
    and learning from. Research finds that quantitative analysis of typical public
    opinion events in various time periods and dimensions can discover the inevitable
    development logic behind these network events. At the same time, through systematic
    review and analysis of the characteristics and tag systems of past public opinion
    cases, it is possible to conduct scientific trend assessments on various network
    public opinions that are currently occurring or may occur in the future, effectively
    improving the public opinion response level of network management departments
    and relevant business departments.


    From the national level, on December 8, 2017, during the second collective study
    of the Political Bureau of the CPC Central Committee on the implementation of
    the national big data strategy, General Secretary Xi Jinping emphasized: "We must
    use big data to enhance the level of modernization of national governance, strengthen
    the construction of internet content, establish a comprehensive network governance
    system, and create a clean and clear cyberspace."


    Based on the actual needs of public opinion work and the national deployment of
    big data-related work, realizing the upgrading of public opinion technology has
    become a top priority. Therefore, the scientific deployment of the Public Event
    Knowledge Base system meets the requirements of the times and is the general trend.


    The Public Event Knowledge Base Comparison System is no longer just a "flat, lab-report-style
    public opinion presentation" for network management departments, but a "three-dimensional,
    intelligent Public Event Knowledge Base." Its deployment will comprehensively
    replace traditional public opinion systems. Its development concept and technical
    logic subvert traditional public opinion systems. The system can more comprehensively
    present the relevant relationships of public opinion information, utilize the
    existing historical case library to conduct real-time comparison on public opinion
    events, help network management departments grasp the development patterns of
    similar events more quickly, use historical experience to predict future trends,
    and make public opinion disposal and network risk governance decisions more targeted.


    The Public Event Knowledge Base system, through basic modules such as network
    sentiment situation, situation statistical analysis, event retrospective analysis,
    case comparison, decision support, event search, and policy assessment, satisfies
    users'' public opinion monitoring and early warning needs on the one hand, and
    on the other hand, allows users to have relevant events and experiences for reference
    during assessment and decision-making. It breaks the original single-information
    output mode, conducts dynamic comparison with more intuitive and three-dimensional
    cases, thereby avoiding the reality of "falling in the same place twice" in actual
    public opinion disposal.


    In practical application, the Public Event Knowledge Base system takes technology
    as support and cooperates with a professional think tank team, integrating public
    opinion risk assessment, public opinion monitoring, public opinion situation perception,
    expert reports, and think tank suggestions into one, covering the whole process
    before, during, and after major decisions, and improving the effectiveness of
    network risk governance work.


    Traditional network public opinion management capabilities, and enhancing public
    opinion governance levels.


    #### 2. Comparison of Historical Data and Incipient Events, Enhancing the Early
    Warning Nature of Risk Identification and Assessment


