    Through various statistical analysis methods, utilizing `BI` and other technologies
    to perform statistical operations on preprocessed raw data, obtaining averages,
    growth rates, etc., and presenting them visually. For collected and structured
    data, analysis considers two aspects: one is verifying data uniqueness and accuracy,
    and the other is the discovery and optimization of self-activation mechanisms.


    ### Data Verification


    Using models such as text semantic analysis and knowledge graphs to analyze the
    rationality of certain data, conducting multi-source data verification to determine
    data rationality. Through semantic analysis, the described objects and related
    data are identified as the content required by collection indicators. By building
    concepts and entities through knowledge graphs, precise requirements and focus
    for data mining are achieved.


    ### Indicator Selection and Formation


    Minimum functions are combed from laws and regulations, government institutional
    mandate plans ("Three Determinations" plans), workflow documents, etc., and described
    using indicators. For example, after combing, Beijing Municipal Government functions
    total 1,730 items; the status of each function can be corresponded to by specific
    indicators to describe its operational status. Primary indicators (secondary level)
    are formed by abstracting key concerns from the theoretical height of public administration
    and government management and actual government work. Then, based on indicators
    combed from government urban management and service functions, supporting indicators
    (tertiary level) are selected and formed according to their matching degree with
    primary indicators (secondary level). For different subjects and objects, indicators
    need to be described from three dimensions: macro, meso, and micro; for urban
    government operational evaluation, the latter two are particularly important.


    The selection of indicators constitutes a multi-dimensional, multi-faceted rational
    system architecture from the time dimension, status dimension, and statistical
    dimension. (See Table 2)


    **Table 2: Departments Corresponding to Partial China Government Index**

    ![](img/figure_0223_0001.jpg)


    ### China Government Index Self-Activation Mechanism


    Indicator weight assignment is determined through research combined with statistical
    methods (e.g., `Partial Least Squares`). Weight values differ under different
    social scenarios. Social scenarios are divided into general scenarios and special
    scenarios. General scenarios refer to situations where social operations are normal;
    special scenarios refer to situations with emergencies. Weight values differ in
    different business environments.


    Through event triggers formed by risk events and threshold compliance or triggers
    of supervision indicators, the governance collaborative workflow is automatically
    activated, and an intelligent distribution mechanism for collaborative actions
    is initiated. When sudden risks and crisis events occur in society, the corresponding
    indicator system can react to sensitive events, automatically issue early warnings,
    and initiate relevant government operational processes, coordinating government
    departments to respond to risks, which is of great significance for the completion
    of government department tasks.


    ### Self-Activation Collaboration


    Occurring events are classified by problem. This process requires cluster analysis
    of past events, then semantic analysis of current problems to obtain their features,
    classifying events into corresponding governance collaboration categories. The
    matching of categories and functions is done through manual matching by interpreting
    relevant legal provisions and rules; these functions are already explained in
    legal provisions or "Three Determinations" plans. After disassembly, a mapping
    relationship between the index and departments is established, enabling precise
    distribution of self-activated tasks, and providing support for application scenarios
    such as performance appraisal, duty performance evaluation, and inspection and
    supervision.


    ## 9.5 Dynamic Release System of China Government Index


    ### China Government Index Website Section Design


    #### Real-time Index


    Includes dynamic display of indices at all levels, index signal early warning,
    task self-activation, operational collaboration, and departmental supervision
    and evaluation.


    #### Report Release


    Report download list.


    #### CGI Introduction


    `CGI` system introduction, index description, index implementation methods, data
    sources.


    #### Cooperation Participation


    Introduction to participation methods for government institutions, research institutions,
    and enterprises; data cooperation, open index cooperation.


    #### CGI Expert Committee


    `CGI` think tank architecture, standing institutions.


    #### Release Dynamics


    `CGI` related research dynamics, conference dynamics, release dynamics.


    ### Management Mode and Website Release Path


    Daily data analysis is conducted by the data analysis system based on business
    models, generating relevant indicators and rankings for the China City Index through
    the big data system, which are then reviewed by relevant institutions and personnel
    before release.


    ### CGI Task Collaboration Technical System


    The China Government Index website architecture is divided into five layers: `Resource
    Layer`, `Index Calculation Layer`, `User Service Layer`, `Application Scheduling
    Layer`, `Information Interaction and Display Layer`.


    The `Resource Layer` provides infrastructure resources for the service system,
    including `Computing Resources`, `Structured Databases`, `Unstructured Databases`,
    and `Government Index Data Sources`.


    The `Index Calculation Layer` calls multiple computing nodes of the `Computing
    Resources` in the `Resource Layer`, uses the `Distributed Framework` to process
    `Government Index Data Source` data, and stores the calculated results in the
    `Unstructured Database`, including the `Index Update Module` and `Daemon Thread
    Module`.


    The `User Service Layer` calls user data stored in the `Resource Layer` `Structured
    Database` to complete corresponding user service content, including the `User
    Management Module`, `Path Management Module`, and `Data Cache Module`.


    The `Application Scheduling Layer` receives various user requests sent from the
    `Information Interaction and Display Layer`, calls the `Index Calculation Layer`
    and `User Service Layer` to fulfill user requests, and feeds back request results
    to the `Information Interaction and Display Layer`, including the `Index Data
    Acquisition Module`, `User Data Acquisition Module`, and `Service Request Reception
    and Distribution Module`.


    The `Information Interaction and Display Layer` provides real-time display of
    index information based on maps, and manages index information. This `Information
    Interaction and Display Layer` includes the `Index Release Service Module` and
    `Secondary and Tertiary Index Display Modules`. The information display module
    includes dynamic display, real-time display, block display, path display, etc.,
    of various release sections.


    ## 9.6 The Future of China Government Index


    ### First, Build Urban Governance Self-Activation Mechanism and Toolkit


    The self-activation mechanism and toolkit are based on the government index, using
    the minimum administrative unit as a tool. They are mechanisms and tools for the
    government''s intelligent response and operation. They function to completely
    change the government''s operational status and operating mechanism, enrich government
    resources, improve government response capabilities, and optimize government organization
    and human resource allocation, all without touching existing government rules
    and regulations.


    ### Second, Develop and Improve the E-Government Service Business System


    The service-oriented transformation of e-government is a new generation of e-government
    construction and application model adapted to the current level of socio-economic,
    market, and technological development, following the product and project phases.
    The new generation of e-government centers on market-oriented "services" for government
    users, emphasizing the support and corresponding services provided by e-government
    service providers for the resources, tools, data, and wisdom of government operations
    and its staff. This forms a dual structure of marketization of e-government infrastructure,
    technology, and operation & maintenance (material and technical content) and the
    professionalization of government governance, public services, and government
    self-management, thereby forging a new path that is forward-looking and responsive
    to the development of China''s government capacity and performance.


    ### Third, Realize Online-Offline Integration and Landing of Government Big Data


    The government holds massive amounts of data. The new generation of e-government
    construction and application, centered on the China City Government Index, will
    accumulate massive data. Given the extreme enrichment of government data, how
    to operate government big data to release its social and market value; how to
    integrate relevant social and market entities to achieve the convergence and integration
    of government services, social services, and market services based on government
    data, creating more social welfare and market benefits for the public, has become
    an imminent topic in the field of government big data. The construction of the
    technology and market system for the online-offline integration and landing of
    government big data is precisely the solution to this problem. Its main implementation
    method is to fully utilize government big data, establish good relations with
    the government, gradually integrate relevant social and market entities, achieve
    innovative integration of government services, social services, and market services
    based on government big data, so that government investment in social welfare
    and livelihood services can exert greater value.


    # Postscript: No Spring Will Fail to Arrive


    This is a reflective work on social risk governance.


    If this book can give readers some reflection and enlightenment, it will be my
    greatest comfort.


    For a long time, I have been concerned with risks, risk strategies, and the shock
    and pain that every cyber risk event may bring to this society.


    Today is February 18, 2020. I am finishing this book in Yan Yuan (Peking University
    campus), after being busy for more than a year, as a summary of the tumultuous
    year 2019. Outside the window, the sun shines brightly, yet the early spring wind
    still carries a hint of chill. By the lunar calendar, today is the 25th day of
    the first month, the fifth day of the "Seventh Nine" (a nine-day period in winter).
    A folk proverb says, "In the Seventh Nine the river opens, in the Eighth Nine
    the geese return." Yes, the swallows are about to return. No winter is insurmountable;
    no spring will fail to arrive. Let us together await the warmth of spring and
    the blooming of flowers.


    Winter has passed; spring has arrived.


