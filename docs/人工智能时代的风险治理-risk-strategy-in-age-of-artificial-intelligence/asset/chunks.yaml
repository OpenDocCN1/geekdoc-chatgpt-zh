    首先，数据主权保护是网络治理的现实选择。我国已成为互联网应用第一大国，也将是数据创造第一大国，数据主权亟须保护。当前，我国应大力开展数字经济外交，在联合国框架下推动建立新的全球网络空间治理体系，通过信息安全立法，对内强化我国国家关键基础设施的信息安全，对外加强多边合作，推动形成数据保护利益共同体。


