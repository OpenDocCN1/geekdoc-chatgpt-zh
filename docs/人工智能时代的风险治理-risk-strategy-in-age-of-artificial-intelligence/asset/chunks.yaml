    # Chapter 3 Decision Risk Assessment Mechanism


    ## 3.1 Leading Cadres'' Risk Judgment Capability


    Decision risk assessment is inseparable from the decision-maker''s judgment. The
    political capability of leading cadres at all levels, this "critical few," is
    first reflected in their judgment of decisions. Judgment requires not only a certain
    quantity and quality of data, information, and knowledge, but also the courage
    to make prompt decisions and the ability to grasp major trends. Leading cadres''
    risk judgment should be established on the basis of four aspects: attention, value
    discernment, risk perception, and experience. What leading cadres pay attention
    to or ignore is the primary choice in decision risk assessment; only issues that
    attract the attention of leading cadres can possibly become policy agendas and
    enter the risk assessment process. The judgment of risk attributes and whether
    to take decision-making actions is a typical value discernment process. Value
    discernment takes public interest as the criterion; whether to make a decision
    and what kind of decision to make are all based on specific values. Value discernment
    is also a process of balancing value conflicts. Risks imply value conflicts and
    confrontations; risk assessment is the process of seeking value identity; therefore,
    how to balance value conflicts embodies the leading cadres'' risk judgment capability.
    Situational awareness of risks is the leading cadres'' judgment of risk consequences
    when making decisions. The attention and value discernment of leaders focus on
    whether there is a risk, that is, the possibility of risk occurrence; while risk
    perception is the judgment of the consequences formed by risks, and the range
    of risk consequences the decision-maker can bear. The decision-maker''s risk management
    experience can form intuitive judgments on the trend of risk evolution, thereby
    making up for the lack of knowledge at the analytical and negotiation levels.


    Analysis, negotiation, and judgment, and their interaction, are the main modes
    of operation of the decision risk assessment mechanism. The three are inextricably
    linked and indispensable. Analysis is the starting point of knowledge production,
    negotiation is the exchange of knowledge, preferences, and needs, and judgment
    is the final decision. Under their combined effect, the quality of decision risk
    assessment can be continuously improved, further perfecting the risk prevention
    and control mechanism.


    ## 3.2 "Black Swan Events" and "Gray Rhino Events"


    A "Black Swan Event" refers to an event that is very difficult to predict and
    unusual. Such events usually trigger chain reactions in society and possess extreme
    destructiveness. "Black Swan Events" may occur in any field, including politics,
    economy, diplomacy, military, public governance, public health, and others. "Black
    Swan Events" may be triggered by natural disasters or caused by human social activities.


    Nassim Nicholas Taleb proposed the definition of Black Swan Events in his book
    *The Black Swan*. Taleb defines events with the following three characteristics
    as "Black Swan Events": First, the event has unexpectedness, meaning it lies outside
    regular expectations, i.e., there was no evidence in the past to convincingly
    point to its possibility of occurrence; Second, the event produces extreme consequences;
    Third, although the event has unexpectedness, human nature compels us to fabricate
    reasons for its occurrence after the fact, and to a greater or lesser extent,
    consider it explainable and predictable. In short, these three points summarize
    as: rarity, extreme impact, and retrospective (not prospective) predictability.


    A "Gray Rhino Event" refers to high-probability risk events that are often prompted
    but not given sufficient attention or often ignored. The term "Gray Rhino Event"
    comes from Michele Wucker, a Guggenheim Fellow, in her book *The Gray Rhino: How
    to Recognize and Act on the Obvious Dangers*. "Gray Rhino Events" are metaphors
    for high-probability, high-impact potential crises, while "Black Swan Events"
    are metaphors for low-probability, high-impact events. The book proposes that
    "Gray Rhino Events" mainly refer to obvious, high-probability events that are
    repeatedly ignored by people and may eventually brew into major crises. People
    spend a lot of time and energy on things that shock the psyche and emotions but
    have extremely low probability of occurrence, thus failing to notice those things
    with extremely high probability that should be prevented early. If one is looking
    for a "Black Swan," it is impossible to see the "Gray Rhino."


    "Gray Rhino" and "Black Swan" are events relative to their scale, predictability,
    or perceptibility; both types of events have enormous destructive power to society.
    "Gray Rhino Events" are risks so common that people take them for granted; "Black
    Swan Events" are extremely rare, unexpected risks. Often, these two types of events
    may appear intertwined or simultaneously. And "Black Swan Events" often become
    the fuse and catalyst for "Gray Rhino Events."


    # Chapter 4 Big Data and Risk Intelligence Discovery


    Regarding `Big Data`, Gartner gives the following definition: information assets
    characterized by such a high volume, velocity, and variety that they require new
    processing models to enable stronger decision-making power, insight discovery,
    and process optimization capabilities; McKinsey Global Institute defines it as:
    a dataset whose scale is so large that it greatly exceeds the capabilities of
    traditional database software tools in terms of acquisition, storage, management,
    and analysis, possessing four major characteristics: massive data scale, fast
    data flow, diverse data types, and low value density.


    `Artificial Intelligence`, abbreviated as `AI`. It is a new technical science
    that researches and develops theories, methods, technologies, and application
    systems for simulating, extending, and expanding human intelligence. The core
    of artificial intelligence technology is the collection, processing, analysis,
    and utilization of big data.


    The strategic significance of big data and artificial intelligence technology
    lies not in mastering huge amounts of data information, but in the specialized
    processing of these meaningful data, in improving the "processing capability"
    of data, and realizing the "value-added" of data through "processing." Technically
    speaking, the relationship between big data and cloud computing is as inseparable
    as the two sides of a coin. Big data inevitably cannot be processed by a single
    computer and must adopt a distributed architecture. Its feature lies in distributed
    data mining of massive data. But it must rely on cloud computing''s distributed
    processing, distributed databases, cloud storage, and virtualization technology.
    With the advent of the cloud era, big data has attracted increasing attention.


    Big data is usually used to describe large amounts of unstructured and semi-structured
    data, which would incur higher costs when downloaded into relational databases
    for analysis. Big data analysis is often associated with cloud computing and artificial
    intelligence, because real-time analysis of large datasets requires frameworks
    like `MapReduce`[\[1\]](#Chapter_8_1.xhtml#B5) to distribute work to thousands
    of computers. Both big data and artificial intelligence require special technologies
    to effectively process large amounts of data and analyze these data with specific
    mathematical analysis models to help and support people in completing specific
    scenario data support and certain practical application needs.


    The enormous significance of big data and artificial intelligence in economic
    development does not mean they can replace all rational often concern survival.
    Ancient and modern, Chinese and foreign cases of national subversion, regime collapse,
    corporate bankruptcy, and severe damage to personal reputation caused by neglecting
    risk discovery and scientific prevention and control are numerous.


    Data shows that 70% of information security risks come from inside the system,
    perpetrated by insiders. This fully verifies a saying: the fortress is most easily
    breached from within.


    '
