    ## 4.8 大数据在网络空间风险发现中的应用


    习近平总书记在2017年12月8日中共中央政治局第二次集体学习时强调，运用大数据提升国家治理现代化水平，要加强互联网内容建设，建立网络综合治理体系，营造清朗的网络空间。


    大数据技术从分析海量网络风险事件数据出发，对数据通过算法处理，探索事件和事件之间、数据和数据之间的内在关联性，从而实现对网络风险的预测，对网评的导控，对舆情引导提供决策建议，在舆情引导中发挥作用。


    （一）基于文本语义分析的大数据舆情监测与发现


    利用定向的搜索程序，对已经出现的网络舆情主动跟踪监测，进而根据文本语义情绪判别其走势并加以干预，这是网络舆情引导的传统做法，也是以往网络舆情管理的起始。而利用大数据技术可以对网络舆情中具有关联的数据进行挖掘并加以分析归纳，总结出网络舆情产生、发展的规律，在此基础上对网络舆情进行模型化处理，使预测成为可能。


    1．基于社交媒体主流舆论态度收集的大数据辅助网评导控


    系统主体架构包含：基于大数据挖掘和精准搜索的舆情采集分析模块，基于云服务的分布式消息传递和存储模块，基于网络智能机器人的任务引导模块。


    2．大数据支持网络空间态势感知决策


    网络信息是网络背后的网民所传达出来的内容的集合，因而对网络数据进行研究，实质上就是对由人所组成的社会网络进行研究。要实现机器提供网络舆情处置决策建议，离不开对网络舆情内部关联性的研究。在大数据时代，每条网络数据都被看作是一个节点，能够在舆情链上与其他关联数据不受限制地产生乘法效应，这种关联会以指数级的方式对内容进行扩散。因此，对于网络舆情内在关联性的研究可以使舆情分析更为准确。


    现有的各类舆情监测系统是原始数据的媒体传播角度进行的数据统计呈现，没有历史数据相关联以资借鉴，也没有进行依托历史事件库各类维度的大数据比对分析以及智能推演指导处置功能。而利用大数据技术建立知识案例库比对系统将充分展现历史案例数据的智能比对，同时进行预测推演，以期达到简捷、直观、实用并有效指导相关部门对网络公共事件进行准确处置引导和应对的目的。该系统将有效提升原有舆情系统在数据收集以及分析研判能力不足等方面的问题，大大提升网络舆情分析、研判的处置水平，并有力增强网络空间综合治理能力。


    3．大数据知识案例库比对系统的实现


    元数据采集


    通过数据采集模块对数据进行采集，包括对境内新闻网页、视频、图片、中文报刊、贴吧、微博、微信公众号、新闻客户端及境外主流媒体、网站和社交平台等进行监测、数据采集，过滤无效数据。对于主流新闻客户端、微信公众号等，数据采集模块由爬虫服务器、爬虫任务调度服务器、爬虫监控服务器、爬虫日志服务器、数据去重服务器以及自然人行为服务器组成。数据采集是通过爬虫服务器集群协作完成的。数据采集面向互联网新闻、论坛、微博、微信等产生的海量数据进行采集，筛选出有用的数据信息。


    数据挖掘技术


    数据算法：对于大数据来说，如何进行大规模、有效的数据挖掘，一方面，需要大量的数据分析；另一方面就要能够快速、有效地数据处理。研发算法时，要充分考虑到数据处理的高效性以及计算成本。


    数学建模：如何将分析得到的数据直观地用可视化的方式展现出来，这是大数据的另一个难题。大数据的数据规模较为庞大，无法使用列表的形式将其展现出来，因此，需要用图形、图表的方式将这些数据展现出来。对于不同的数据所要展现的不同目的，都需要建立不同的数学可视化和展示模型。


    数据分析比对：常用数据分析算法有以下几种。


    聚类分析（Cluster Analysis）


    聚类分析指将物理或抽象对象的集合分组成为由类似的对象组成的多个类的分析过程。聚类是将数据分类到不同的类或者簇这样的一个过程，所以同一个簇中的对象有很大的相似性，而不同簇间的对象有很大的相异性。聚类分析是一种探索性的分析，在分类的过程中，人们不必事先给出一个分类的标准，聚类分析能够从样本数据出发，自动进行分类。聚类分析所使用的方法不同，常常会得到不同的结论。不同研究者对于同一组数据进行聚类分析，所得到的聚类数未必一致。


    因子分析（Factor Analysis）


    因子分析是指研究从变量群中提取共性因子的统计技术。因子分析就是从大量的数据中寻找内在的联系，减少决策的困难。


    因子分析的方法有10多种，如重心法、影像分析法、最大似然解、最小平方法、阿尔法抽因法、拉奥典型抽因法等。这些方法本质上大都属近似方法，是以相关系数矩阵为基础的，所不同的是相关系数矩阵对角线上的值，采用不同的共同性估值。在社会学研究中，因子分析常采用以主成分分析为基础的反覆法。


    相关分析（Correlation Analysis）


    相关分析是研究现象之间是否存在某种依存关系，并对具体有依存关系的现象探讨其相关方向以及相关程度。相关关系是一种非确定性的关系，例如，以x和y分别记一个人的身高和体重，或分别记每公顷施肥量与每公顷小麦产量，则x与y显然有关系，而又没有确切到可由其中的一个去精确地决定另一个的程度，这就是相关关系。


    对应分析（Correspondence Analysis）


    对应分析也称关联分析、R-Q型因子分析，通过分析由定性变量构成的交互汇总表来揭示变量间的联系。可以揭示同一变量的各个类别之间的差异，以及不同变量各个类别之间的对应关系。对应分析的基本思想是将一个联列表的行和列中各元素的比例结构以点的形式在较低维的空间中表示出来。


    回归分析（Regressive Analysis）'
