    \ will be prosecuted.\n\nFor any printing quality issues with Haitian books, please\
    \ contact the printing factory for replacement at any time.\n\n![](img/figure_0006_0001.jpg)\n\
    \n## Recommendations\n\n### Recommendation by Professor Cheng Lin\n\nFormer Party\
    \ Committee Secretary and President, Chinese People's Public Security University\
    \  \nStanding Director, China Law Society  \nPresident, China Police Law Research\
    \ Association\n\nA grand vision embracing the world determines a scholar's academic\
    \ height and theoretical horizon. Dean Yang's *Risk Governance in the Age of Artificial\
    \ Intelligence*, a monograph on risk governance with profound social significance\
    \ and distinct characteristics of the times, once again makes us deeply feel the\
    \ Chinese intellectuals' compassion for humanity and their great sense of responsibility—\"\
    to establish a heart for heaven and earth, to establish a destiny for the people,\
    \ to inherit the lost learning of the past sages, to create peace for all generations.\"\
    \ This book conducts systematic research on risk issues and governance from history\
    \ to the present, from theory to practice, possessing strong theoretical and practical\
    \ value. It has certain reference value for studying and implementing General\
    \ Secretary Xi Jinping's important discourses on risk governance. I believe the\
    \ publication of this book serves as a strong warning to the whole society and\
    \ holds significant educational value for risk capability.\n\nFaced with risk,\
    \ seeking advantage and avoiding harm is human instinct.\n\nRisk governance involves\
    \ not only big data, nor is it merely a technical issue.\n\nRisks manifest as\
    \ various events or certain trends. Natural disasters and man-made calamities\
    \ are typical traditional risks.\n\nWhen it comes to risk, each of us has our\
    \ own cognition. Any natural or man-made change that brings disorder to social\
    \ individuals or organizations may be a potential risk. Risk is a mutation factor\
    \ in governance; how to govern this factor can even determine the survival or\
    \ demise of a person or an institution. The ability to perceive risk determines\
    \ the future of a political governance order, an organization, a group, or a social\
    \ individual.\n\nArtificially creating risks, utilizing risks, creating risks\
    \ for others, or transferring one's own risks to others under the premise of ensuring\
    \ safety and controllability is another form of \"sophisticated selfishness\"\
    \ or \"harming others for self-benefit.\" However, this is an extremely dangerous\
    \ game, because its consequences are often uncontrollable and may well backfire.\n\
    \nWith the advancement of globalization, the world has become a pluralistic whole.\
    \ Any local change may trigger global shocks or changes. From the perspective\
    \ of progress, these risks bringing change are one of the driving forces of social\
    \ progress. The development of human society has always been a process of growing\
    \ and progressing by embracing and solving one risk after another. From a systems\
    \ theory perspective, the \"butterfly effect\" is the best interpretation of how\
    \ risk changes the world.\n\nResearch shows that 8% of DNA segments in human genes\
    \ come from viruses in nature. It is these viruses that have reshaped human genes\
    \ and prompted humans to coexist more harmoniously with this world. The cognition\
    \ and acceptance of risk is an objective reality that humanity must face. For\
    \ an organization, accepting and preventing or altering the trajectory of risk\
    \ and the consequences it brings is a core issue that must be faced. The subversion\
    \ and change risk brings to society are sometimes benign, capable of driving certain\
    \ progress, but more often they bring destruction and ruin. Ulrich Beck, the German\
    \ sociologist and author of *Risk Society*, said that the risks of postmodern\
    \ society have arrived comprehensively, challenging the civilizational framework\
    \ and risk reality formed by industrial society. He said, \"The 'post' is the\
    \ code for helplessness, trapped in vulgar fashion; it 'points to a transcendence\
    \ difficult to name,' which is the 'basic prescription with which we confront\
    \ a fragmented reality'.\" Therefore, for humanity to succeed, \"only a hard struggle\
    \ against old theories and habits of thought\" will suffice.\n\nWe need to re-examine\
    \ all the changes brought to us by this monster called risk. Only by actively\
    \ responding, effectively avoiding, and reasonably utilizing risks, striving to\
    \ make risk a driving force for the progress and development of our society, can\
    \ we achieve the core of risk governance. This requires wisdom.\n\nRisks vary\
    \ in magnitude, but risk response are the core tenets of risk governance. An ancient\
    \ saying goes: \"A good doctor treats a disease before it arises, so the person\
    \ stays alive; a sage governs a disorder before it exists, so the world is at\
    \ peace.\" That is, living in peace but is the correct method. Modern social risks\
    \ often have global characteristics—\"pull one hair and the whole body moves.\"\
    \ This \"global\" has two meanings: first, the scope of risk impact is wide, and\
    \ the harm caused is often society-wide or even global; second, the destructive\
    \ nature of risks across all fields—a risk in one field often triggers risks in\
    \ other fields to appear simultaneously, leading to a superposition of different\
    \ risk harms and increasing the destructive power of risk. Therefore, modern social\
    \ risk governance should follow systems theory and a global perspective, forming\
    \ an overall, systematic, and scientific risk governance framework. Prevent risks\
    \ from appearing at the \"shortest stave of the wooden bucket\" and the weakest\
    \ link of social governance, triggering global harm.\n\nCrisis is a collection\
    \ of major social risks; a specific crisis is a specific major risk. In terms\
    \ of scale and destructiveness, crisis is far more destructive than ordinary risks,\
    \ with a wider impact scope and longer duration. Vigilance against crises or major\
    \ social risks can never be taken lightly at any time.\n\nRisks can trigger major\
    \ safety hazards. If risk cognition is insufficient, prevention weak, response\
    \ untimely, handling improper, and post-event remediation lacking, it will lead\
    \ to serious social crises and bad consequences. Therefore, attention to risk\
    \ is attention to crisis; attention to crisis is attention to safety.\n\n# Chapter\
    \ 2 Risk Research and Risk Strategy\n\n## 2.1 Risk Science and Risk Strategy\n\
    \nRisk Science, or Risk Research, is the science studying risk discovery, risk\
    \ prevention, risk governance, and risk response. The purpose of risk science\
    \ is risk insight and discovery, trend analysis, assessment and response, to enhance\
    \ social governance and public service capabilities, and resolve social contradictions\
    \ and various crises. Risk governance includes traditional social risk governance\
    \ and cyberspace risk governance.\n\n"
