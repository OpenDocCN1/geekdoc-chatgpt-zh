    ## Analysis of Risk Evolution and Limitations of Traditional Public Opinion Monitoring


    The probability of risk evolving into a crisis is an extremely complex sociological
    and systems theory problem. Here, an abstract assumption is made: there is a functional
    relationship between "risk" and "crisis," and the probability of risk evolving
    into a crisis can be calculated using mathematical methods. The "Bayesian method"
    and "Heinrich''s Law" can be used to estimate this probability. The "Bayesian
    method," also known as the conditional probability method, describes the relationship
    between two conditional probabilities, i.e., deriving the probability of one event
    from the probability of another. The mathematical model is: `Posterior Probability
    = (Likelihood × Prior Probability) / Normalization Constant`.


    Traditional public opinion monitoring faces a shift from deconstructing events
    in the "past tense" to rehearsing and analyzing events in the "future tense,"
    and a transition from "issuing a lab report" to "writing a prescription."


    The singularity and limitations of traditional public opinion systems and network
    risk decisions based on communication data feature analysis are mainly reflected
    in the following aspects:


    1.  The complexity of social and network risks determines that dimensional analysis
    based on a single risk source or single event data cannot reflect the comprehensive
    and intersecting characteristics of risks. In fact, many risks are interrelated,
    mutually reinforcing, and interacting.

    2.  The formation of a social risk matrix is a fuzzy and chaotic fermentation
    process, where explicit and implicit risk factors interact complexly to cause
    or drive the emergence of a specific risk. In a sense, risk early warning is an
    interactive process of continuous learning and algorithm optimization to improve
    prediction conclusions.

    3.  The perturbance and uncertainty of external and internal factors in risk propagation
    ultimately lead to the unknowability of risk prediction.

    4.  It fails to meet the need for risk governance experts'' experience and data-driven
    features to participate in the machine''s single-event processing flow and provide
    crucial support for early warnings, nor can it effectively leverage or draw on
    experts'' successful risk handling experiences. In other words, expert experience
    cannot manifest in traditional public opinion management systems, nor can it organically
    integrate with existing public opinion system frameworks.

    5.  There is still a lack of algorithmic capability support and deep neural network
    algorithm support for the quantification and feature analysis of future risk trends.
    Although current public opinion management systems have employed machine learning
    in certain analytical scenarios, it is far from sufficient.

    6.  Complex network algorithms simulating human cognitive decision-making processes
    remain very immature and require significant improvement.

    7.  There is still a lack of systematic support for ex-ante risk assessment and
    judgment of major risk events or major decisions. Ex-ante risk early warning and
    judgment have become important concepts in social risk governance, and this process
    has been standardized by relevant laws and regulations.

    8.  The lack of cognitive mindsets, society only focuses on immediate predicaments,
    turning a blind eye to greater and more numerous risks or crises coming from the
    future.


    # 5.9 Necessity and Urgency of Governance of Sudden Network Risk Events


    With the advent of the new media era, every individual and organization has become
    an information publisher and disseminator. The rise of network social software
    and platforms such as QQ, WeChat, Weibo, and Zhihu has accelerated the speed of
    information dissemination, broadened dissemination channels, and expanded the
    dissemination scope, making the "butterfly effect" extremely likely to occur.
    Unrestrained reporting and dissemination in the network seriously affect netizens''
    cognition and judgment, triggering contradictions between the public and the government.
    Fake news, malicious rumors, and inflammatory remarks that damage the government''s
    image and undermine social stability can be tentatively termed **negative public
    opinion**. In widely watched sudden events in recent years, the "**post-truth**"
    phenomenon has intervened ever more deeply in social hotspots, repeatedly presenting
    a situation of **truth collapse and emotion dominance**. With the development
    of socialist democracy, citizens'' rights awareness continues to awaken, while
    contradictions continue to deepen against the backdrop of social transformation.
    Therefore, the occurrence of sudden events triggers extensive public discussion.
    In today''s complex network public opinion environment, fragmented information,
    rumors, and irrational remarks can easily trigger negative public emotions, damage
    government credibility, intensify contradictions between the public and the government,
    and even become the fuse of social crises. Therefore, how to govern negative network
    public opinion regarding sudden events in the new media era is an important issue
    the government must explore.


    In the new media environment, both information dissemination and the social public
    opinion ecology have undergone tremendous changes. High-speed information dissemination
    and a free, open public opinion space pose severe challenges to government governance.
    Advanced information technology may play a role in "fanning the flames" of sudden
    events, causing them to escalate. Faced with "rumors and gossip," once authoritative
    information sources lose their power and the public lacks sufficient information
    discernment ability, they easily accept emotions and prejudices spread by social
    platforms, forming judgments far removed from facts, treating baseless subjective
    speculations as facts. Ultimately, the "truth" dominated by emotions becomes the
    consensus of most netizens. Public opinion is likely to be led astray, even becoming
    opposed to the authoritative information released by the government, seriously
    affecting the government''s image and credibility. Therefore, it is necessary
    to correctly respond to negative network public opinion, strive to break the dilemma
    of public opinion governance, and foster a healthy, stable, harmonious, and safe
    network public opinion ecology.


    ## (I) Characteristics of Current Social Negative Public Opinion


    ### 1. Frequent Sudden Events, Increasing "Gray Rhino" Risks


    In recent years, various sudden risk events have occurred frequently in China.
    Whether natural disasters, safety accidents, or "**black swan events**" in livelihood
    issues, the outbreak of any sudden event causes enormous damage to the lives and
    property of the people. Each sudden event triggers a violent social psychological
    reaction. If government crisis decision-making and public opinion governance cannot
    be correctly interpreted by the public, negative public emotions will erupt. The
    long-term superposition and accumulation of negative emotions will deepen the
    public''s sense of insecurity and negative perception of the government; eventually,
    even a trivial matter could trigger a social crisis. In fact, many crisis events
    showed signs before erupting; the "**Gray Rhino**" has been charging at us but
    is often ignored. We are currently at a critical period of social transformation
    and development and a prominent period of social contradictions. Negative public
    opinion can easily evolve into a public opinion crisis, or even trigger a social
    crisis; therefore, "**Gray Rhino**" risks continue to increase.


    ### 2. Increasing Public Attention, Easily Manipulated and Incited by Interest
    Groups


    With the development of China''s socialist democracy, social economy, and internet
    technology, the people more fully exercise their rights to know, express, and
    supervise. Therefore, the occurrence of sudden events is inevitably accompanied
    by a surge in public opinion. Simultaneously, the arrival of the new media era
    has brought epochal developments in the speed, channels, and scope of information
    dissemination. Citizens pay closer attention to the dynamics and development of
    sudden events, and the demand for information continues to increase. However,
    driven by interests, some news media and other interest groups spread rumors,
    fake news, and fragmented information with strong incitement capabilities, inciting,
    utilizing, and manipulating the public. During the emergency response time and
    key nodes of an event, fabricating rumors and packaging facts triggers public
    negative emotions, making public opinion more susceptible to manipulation. Manipulated
    network public opinion is shrouded in negative emotions; although the basis for
    their judgment comes from fragmented information, the public still believes their
    judgment is correct and refuses to believe authoritative information released
    by the government, even opposing the government, with increasingly obvious negative
    effects.


    ### 3. Emotional Confrontation and Group Polarization Obscure the Truth, Endangering
    Public Safety


    With the arrival of the **post-truth era**, the public opinion situation of sudden
    events is always characterized by **fact collapse and emotion dominance**. The
    public''s attitude toward hot public opinion is not to rationally seek facts,
    but to seek opinion recognition and emotional comfort in fragmented information.
    Once government crisis decisions are misunderstood, emotional confrontation becomes
    more intense.


    A distinct characteristic of the current hot-event network public opinion arena
    is "**stance determines attitude, attitude determines facts**." Factors such as
    ethnicity, industry, concepts, and beliefs gradually split society into different
    interest appeal groups, each with distinct stances and views. Simultaneously,
    the divide between official and civilian public opinion arenas is accelerating.
    Authoritative information released by officials is often dismantled by civilian
    voices like self-media; the civilian public opinion arena often holds a skeptical
    attitude toward mainstream voices. Various voices converge online, public emotions
    become more extreme, the space for rational and handling methods for sudden events
    may bring greater safety hazards, endanger the lives and property of rescue personnel
    and the public, thus easily triggering a frenzy of network negative public opinion.
    Failure to timely adjust policies and channel emotions may likely trigger public
    opinion crisis events.


    ### 3. Relatively Weak Concept of Good Network Governance, Backward Governance
    Thinking


    With the continuous development of China''s socialist democracy, the public''s
    rights awareness has become clearer. However, some local governments still adopt
    mandatory management methods, emphasizing government authority, lacking legal
    to concerns, and legal concepts and service awareness are relatively weak.


    ### 4. Single Governance Subject, Lack of Public Participation


    In the new media era, the public can freely express views, but this may also lead
    to rampant negative rumors, hearsay, and false information. If not governed timely,
    it may trigger social crises. Current network public opinion governance involves
    not only rule of law but also rule of virtue; uniting forces from all sides and
    pooling hearts is an indispensable key factor in the negative public opinion governance
    process. Negative public opinion governance requires the participation and collaborative
    governance of the government, enterprises, society, and individuals. However,
    currently, under the influence of the traditional "**control mindset**," China''s
    network public opinion governance is still dominated by government management,
    with insufficient social participation.


    ### 5. Lack of Sound Governance Mechanisms and Legal Systems


    A typical pattern for local governments regarding network public opinion governance
    is "**multi-headed governance**," lacking independent, permanent institutions
    to respond to negative public opinion triggered by sudden events. Whether it is
    the technical application of early public opinion monitoring, the improvement
    of mid-term response and guidance capabilities, or the construction of post-event
    accountability mechanisms, there is significant room for development. Traditional
    mechanisms lead to information confusion, untimely handling, repeated exercise
    of power, public loss of trust in the government, and ultimately low governance
    efficiency. Meanwhile, cyberspace is not a "**lawless zone**"; the public should
    bear legal responsibility for their speech. However, China lacks a sound legal
    system to regulate online behavior, unable to prevent malicious rumors, hearsay,
    and fake news.


    ## (III) Path Expansion for Government to Overcome Dilemmas in Responding to Sudden
    Event Negative Public Opinion


    As a public opinion arena carrying massive information, the network involves a
    large governance workload and high difficulty. Traditional government network
    management methods can no longer cope with the impact of negative public opinion
    from sudden events. Therefore, the government should adapt to the development
    of the times, change traditionals, turning a blind eye, violent post deletion,
    and information blocking in traditional public opinion governance. Utilize various
    modern intelligent and informatized means to ensure the openness and transparency
    of public opinion information and the equality and harmony of the relationship
    between the government and the public in the public opinion environment, thereby
    improving the efficiency of negative public opinion governance. The Party and
    government must increase investment, enhance the discourse power of authoritative
    departments and mainstream media, guided by socialist core values, do a good job
    in value propaganda, ideological guidance, and public opinion guidance, improve
    the public''s network literacy, and strive to create a healthy, stable, and harmonious
    network public opinion ecology.


    ### 4. Enhance Social Participation, Multi-Subject Collaborative Governance


    With the arrival of the new media era, network public opinion has seen great improvements
    in dissemination speed, channels, and scope. Once negative public opinion appears,
    it is like a raging flood or fierce beast, difficult to control in a short time.
    Faced with various social hotspot events and issues, the government should "**open
    its doors**" to actively accept supervision from all sides and listen to opinions
    from all quarters, creating more channels to publicize and encourage positive,
    rational voices. Only by "**opening its doors**" can the government contact and
    understand society; only by "**opening its doors**" can society supervise the
    government. The government should actively participate in the process of public
    opinion formation, gain as much understanding and support as possible, and allow
    more citizens to participate in social governance. On the one hand, improve the
    openness and transparency of government information, reduce information asymmetry,
    and eliminate unnecessary public misunderstandings of the government. More importantly,
    through social participation, make up for various defects such as government supervision
    absence, resource lack, system loopholes, and technical insufficiency. By attracting
    various social forces to achieve resource integration and functional complementarity,
    improve the governance efficiency of network negative public opinion through collaborative
    governance.


    ### 5. Establish Sound Network Public Opinion Governance Mechanisms and Legal
    Systems


    Governance of network negative public opinion is inseparable from efficient governance
    mechanisms. Improve the governance level of network negative public opinion by
    establishing sound network public opinion monitoring and early warning mechanisms,
    news release mechanisms, and public opinion disposal accountability mechanisms.
    First, the main tasks of the monitoring and early warning mechanism are monitoring,
    analysis, judgment, assessment, and early warning. Establishing a complete monitoring
    mechanism can scientifically predict and analyze relevant public opinion situations,
    make full preparations for responding to negative public opinion, and avoid blowout-style
    development of negative public opinion. Second, the news release mechanism mainly
    improves the mechanism for the government to proactively respond and increase
    communication in the face of sudden events. Authoritative departments and mainstream
    media, with new concepts and methods, stand from the public''s perspective to
    comprehensively, objectively, truthfully, and fairly elaborate on the process
    and dynamics of event development, establish the government''s image, enhance
    government credibility, shorten the distance between the public and the government,
    harmonize relations, and increase communication effectiveness. Finally, establish
    a sound public opinion disposal accountability mechanism. On the one hand, through
    assessment and accountability of government departments and staff, avoid dereliction
    of duty in public opinion governance; through corresponding reward and punishment
    mechanisms, clarify responsibilities and stimulate potential. On the other hand,
    through accountability, identify problems and advantages in the problem-handling
    process, accumulating experience for future public opinion governance.


    The *Decision of the Central Committee of the Communist Party of China on Major
    Issues Concerning Comprehensively Advancing the Rule of Law* adopted at the Fourth
    Plenary Session of the 18th CPC Central Committee clearly states: "**Strengthen
    legislation in the internet field, improve laws and regulations on network information
    services, network security protection, and network social management, and regulate
    network behavior in accordance with the law.**" Therefore, first, establish legal
    awareness and concepts; the government must govern according to law, and the public
    must speak according to law. Second, establish and improve relevant laws and regulations.
    Clarify the rights and obligations of various subjects in the network public opinion
    space, so that network public opinion governance has laws to follow and rules
    to abide by. Some network negative public opinion, unrestricted by legal systems,
    has broken through moral and legal bottom lines but cannot be punished. Cyberspace
    is not a "**lawless zone**"; only by realizing the rule of law in cyberspace can
    "**fabricating rumors**" and "**incitement**" and other illegal acts be powerfully
    regulated, constrained, and punished by legal systems, encouraging netizens to
    express correct, positive, and rational views, reducing irresponsible negative
    public opinion, and fostering a healthy, sustainable, harmonious, and stable network
    public opinion ecology.


    # 5.10 Realistic Risk Environment Drives the Upgrade of Network Risk Governance
    System


    From the perspective of the realistic public opinion environment, on the one hand,
    currently and for a long foreseeable future, health work will encounter more and
    more new problems and challenges; on the other hand, whether in theory or technical
    means, the monitoring and analysis of network public opinion are constantly innovating.
    The public event knowledge base system is a new way and new means to innovate
    public opinion work. Responding to the rapidly changing public opinion situation
    with innovative thinking is both appropriate and necessary.


    ## First, the Macro Environment of Social Public Opinion Risk Forces the Upgrade


    The public opinion landscape has undergone major changes; self-media has risen,
    various social risks appear frequently. Actively promoting a leapfrog development
    in public opinion work, timely grasping the trend of network public opinion related
    to society, and avoiding the predicament of "**one step behind, step by step behind**"
    in social public opinion work have become the focus of attention from all sectors
    of society.


