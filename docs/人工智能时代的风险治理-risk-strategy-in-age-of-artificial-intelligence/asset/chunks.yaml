    ## 4.7 态势感知与社会群体性事件发现


    大数据时代，互联网的介入使群体性事件出现新趋势和新动向，不同类别的群体性事件呈现出不同于以往的新特点，同时也催生了一些新的群体性冲突事件。总体来看，越来越多的社会冲突在酝酿过程中和爆发之后都对互联网产生严重依赖，互联网渗透到社会冲突之中滋生了更多、更大规模的群体性事件隐患。为了更有效、更及时地预警群体性事件，使其在发生破坏性冲击之前得以有效控制，需要依托大数据，将技术与管理相结合，在数据、经验与知识的共享和制度、环境的共建中推进群体性事件预警的智能决策，在多元协同的社会综合治理中实现群体性事件的精准预警、科学防范。


    在群体性事件治理中，预警的重要性已经深受广大学者和政务工作人员认可，不少领域学者和工作人员在理论与实践层面持续探索其中的预警之道。群体性事件预警的总体目标是防范社会矛盾的认知偏见，杜绝单一极化的价值判断，减少社会情绪能量的无序释放和避免破坏性集体行动的发生。全面性的群体性事件预警框架强调在群体性事件的不同时期对不同的阶段重点进行预警：当群体性事件处于潜在期，要阻断群体性事件的爆发；当群体性事件已经爆发，要防止群体性事件的扩散和升级；当群体性事件升级和扩散后，要防范暴力行为。


    在群体性事件发展的历史沿革中，作为一种突发事件的应急应对来看，群体性事件多遵循“一案三制”的框架模式。即以应急预案为前提，以应急管理体制为基础，以应急管理机制为关键和以应急管理法制为保障的突发事件应对框架。互联网的出现改变了群体性事件的发生发展格局，群体性事件向互联网的转移也使其呈现出不同于以往的新特征、新动态。群体性事件预警面临着新的挑战。


    近些年，政府组织治理群体性事件的理念不仅仅局限于依托单一力量针对现实社会中集体行动，对依托互联网平台构建的虚拟空间也更加关注，兼顾现实空间和网络空间的互动，开展群体性事件预警与治理的多元协商共同行动。从行政压制走向制度建设，从被动应对走向主动回应，从单一决策到多元参与，从政府主导走向社会共治的新趋势和方向开创了群体性事件预警的新模式。理念是行动先导，理念的实现需要行动层面的多元互动。在大数据时代，群体性事件出现的新趋势、面临的新挑战需要在治理中不仅仅是树立智能预警理念，更重要的是以技术和管理相结合的行动策略推动智能预警理念的实现。


    从传统的群体性事件预警模式、群体性事件新特点和政府工作的理念调整出发，可以发现，传统模式难以应对新时期的群体性事件，互联网时代还沿用传统模式进行群体性事件预警是低效甚至无效的。在互联网时代进行群体性事件预警，需要依托互联网衍生的大数据，以此为支撑在数据、经验与知识的共享和制度、环境的共建方面有所建树，实现群体性事件智能预警才可能是高效、精准的。


    戴维·伊斯顿（David Easton）的政治系统理论将公民的诉求和支持视为政治系统的输入端，政策制定者对其进行接收和处理，输出政策产品。互联网的出现为群体权益的维护和个体诉求的表达提供了更多机会和平台，官网披露、热线公布、网络举报、公开回复等多形式的网络维权途径日见于网端。可以说，互联网的使用和非制度化政治参与之间存在着“抑制性双向因果”关系，借助“互联网+”，人们会更加频繁、更多自主地表达自我，追求所需。总体来看，依托互联网实现的诉求表达渠道有所增加，但很多渠道存在着形式主义的问题，并没真正改善政治系统的“输入性故障”。相反，甚至激化了过剩的表达诉求与低能的网络抗争之间的矛盾，造成了维权行动在网络空间与现实空间的往返回复，恶性循环。互联网是群体性事件中谣言滋生与传播的温床，谣言“存在的基础是使人希望对事物有进一步的了解或是对隐约感到的威胁的一种反应”。面对突发事件，当官方信息供给不能满足社会民众的信息需求时，强烈的信息饥渴强化了人们去寻求真相的动机。于是网络谣言出现，小道消息盛行，虚假信息流传，填充了群体性事件真实信息的缝隙，为权威信息的发布、真实情况的澄清和网络环境的净化设置了障碍，为群体性事件的发酵和升级创造了不利的舆论环境。互联网信息传递的匿名性、快速性特征为网络谣言的出现和传播提供了条件，不及时辟谣会导致群体性事件顷刻升级和急速扩散。


    海量数据是互联网的产物。寄居于网络空间，某一个体通过媒体平台表达诉求、疏解情绪，两个陌生人之间可以通过网络平台搭建关系。这些小规模、单体化的行为数据经常淹没在互联网的海量数据中，不易发现。同时，人们借用网络表达自我的非语言化倾向日益显著，使用表情包更为流行，“顶帖”“点赞”“打赏”等参与行为也较为普遍，故作沉默的压抑行为也时有发生。在群体性事件预警中，仅仅依靠语言文字来捕捉人们的情绪变化和行为动机是难以奏效的。倘若没有数据技术的支持，即使一些基于网络有规模、有组织的不同主体间的行为数据也不易得到监测和重视。在“互联网+专业领域”的背景下，互联网的隐秘性、分散性弱化了管理者对失常情绪和越轨行为的警觉。


    传统的集体行动往往形成于某一临时性的组织，通过组织者的领袖作用在某些规则之下开展具体的集体维权行动。互联网以其拉近距离和情感动员的功能将更多来自五湖四海的眼光锁定在具体的群体性事件上，但是互联网的组织化能力尚显不足，更多的眼光锁定并没有转变为具体的组织化行动。而“有组织的表达活动更容易强化行动风险、责任及其坐实的认知与评估机制，这有助于集体行动的自我约束”，互联网平台上的意见表达和维权行动多为分散化、碎片化的低组织化行为，缺乏有能力的组织者，没有群体纪律和责任分配的约束，这样就弱化了人们的行动风险认知和预期判断，使人们采取暴力行为的倾向更为强烈。


    按照传统研究，从群体性事件的事发缘由和集中领域出发，将群体性事件一般分为征地拆迁类、环境冲突类、医患纠纷类、劳资纠纷类、城市社区类、民族宗教类等。在大数据时代，互联网的介入让群体性事件出现新趋势和新动向，也使不同类别的群体性事件呈现出不同于以往的新特点，尤其对于便于使用互联网媒介进行维权的主体来说，互联网的工具属性引发环境冲突、医患纠纷、劳资纠纷等类型的冲突产生结构上的变化。同时，互联网对社会生活的渗透也催生了网络金融类、媒体媒介类、个人隐私类等一些新的群体性冲突类型（见表1）。“互联网+冲突”的新型社会形态为群体性事件预警提出了新要求、新挑战。[\[1\]](#Chapter_8_7.xhtml#B9)


    表1 大数据时代群体性事件的焦点类型及其特点


    ![](images/figure_0079_0001.jpg)


    总体来看，“互联网介入群体性事件后发生了催化般的或激进化的效果”，为了更有效、更及时地预警群体性事件，使其在发生破坏性冲击之前能够进行控制，需要依托大数据进行群体性事件预警。


    ### 1．数据共享：分领域监测社会形势，精准预警


    海量数据的规模性生产是大数据时代的基本特征，也是群体性事件预警的信息来源。依托大数据收集和处理技术，智能预警模式将会对全网数据展开捕捉，实现海量数据的量化分析，让数据来说话。全数据预警模式能有效避免传统模式中样本数据的时间滞后和样本误差，保证对群体性事件信息的及时把控，抓住有效的预警时机。采用全数据预警模式，将总体视为样本，需要对海量数据进行即时监测、及时筛选和实时共享。为此，要运用互联网技术对社会各个领域的实时信息进行监测，从宏观领域到微观层面，从整体态势到局部状态，从群体形势到事件个案，实现对互联网数据的全面把握。在海量数据群簇中，基于群体性事件预警的关键字、指标设计和统计算法对有价值的信息进行筛选，并及时在不同领域之间实现共享。不同领域的相关组织紧密追踪有可能促成群体性事件的热点信息，如主体人群、涉及地区、诉求意愿、目标指向、冲突性质、影响因素、情绪变化、围观人群、发展趋势、相互关联度等，绘制群体性事件的“风险地图”，尽快做出事态分析和走势研判。依托大数据支持，可以更为敏锐地发现事件苗头，及时采取事前控制措施，实现群体性事件的精准预警。


    ### 2．经验共享：建设类别化的案例库，支持决策


    依托互联网全数据对于群体性事件的信息筛选、精准预警和趋势研判意义重大。当这些数据指向具有群体性事件走势时，需要预警者及时采取有效措施以防控群体性事件发生。然而，什么是有效的预警措施，哪些措施是低成本且高效率的，这些可以汲取过往案例给予的经验。收集历史上群体性事件治理的案例，建立分领域、分类型、分级别的案例库，为知识向力量的转变、向实际效益的转变提供平台和渠道。将案例语义解读设置为数据化指标，再进行及时预警提供关键词检索，建立数据决策过程性模型和智能决策系统，以辅助事件个例的预警决策。一方面，利用案例数据的搜索指引，快速准确地找到相似案例及案例群，分析已发生群体性事件的预警措施和实施效果。另一方面，利用案例数据的经验分享，挖掘案例库资料搜集、数据分类与挖掘、案例管理和数据检索的功能。在设定关键条件和重要因子的基础上展开数据运算、模型演绎和仿真推理，以求得当前个案的最佳预警策略，有效避免人工决策中的主观经验论断，促进群体性事件预警的科学性。


    ### 3．知识共享：发挥技术性、专业性知识对预警群体性事件的优势


    一直以来，重视科技知识和信息技术来增强政府应急管理和应急决策是危机处理和应急管理的重要工具和手段。知识是基于客观调研和实践验证的系统化、科学化的理性认知。对于推进快速、高效的预警工作，这种理性认知拥有技术性、专业性的优势。又因其专业性和技术性，并不是每一个人都能拥有知识。在群体性事件预警活动中，让每一位参与其中的人员拥有基本的理论知识和行动技巧，知识共享倍显重要。而互联网的出现为这种知识共享提供了技术上的条件。第一，认知的客观化需要互联网信息的彼此验证。作为对社会事件客观事实的认知，互联网以其信息的多源流矫正着信息市场的偏颇，有助于人们形成客观的事实认知和判断，防止负向情绪催生群体性事件。第二，互联网为人们咨询与了解专业性知识提供了更多机会，这对于预防某些专业领域内因为认知的盲目性导致矛盾滋生、冲突激化、衍生破坏性的群体性事件大有裨益。第三，技术预警是大数据时代群体性事件预警的重要工具。基于互联网的信息收集技术、数据分析技术、趋势研判技术、情报追踪技术、案例搜索技术、决策辅助技术等是群体性事件预警的基本技术，技术学习与共享对于顺利预警群体性事件十分关键。


    ### 4．制度共建：围绕群体性事件相关信息建立数据预警制度


    依托大数据开展群体性事件预警需要良好的制度作保障。第一，建立完善的民众网络参与制度，促进网络表达的理性、规范。民众表达出的意愿和诉求是群体性事件技术预警的基础数据来源，表达出来的需求才能被发现、被关注，进而被实现。一方面，鼓励民众表达，减少沉默压抑，“不在沉默中爆发，就在沉默中死亡”，民众的表达不仅使其被了解，增加了实现的可能，也有助于其宣泄情绪；另一方面，减少民众无理性的失范表达，失范表达影响了数据的真实性，增加了数据分析与形势研判的科学性，因此民众网络参与需要建立完备的制度。第二，数据搜集、分析和使用制度。涵盖实时数据、案例经验、知识技术的大数据共享的有序展开是群体性事件数据预警的前提，为此需要建立健全大数据共享制度。打破不同主体间的信息壁垒，实现数据协同；推进案例库建设，建立案例应用、辅助决策技术，学习、交流、分享群体性事件预警经验；普及群体性事件预警的基础常识，学习专业化的数据预警技术，培养数据预警技能，培养数据预警队伍。第三，以网络化的制度保证群体性事件预警决策的执行落地。基于数据运算、案例推演和知识辅助，使群体性事件预警决策的科学性有例可循。决策执行的好坏直接影响着预警决策的整体社会效果，预警不力，反而导致群体性事件规模扩大、烈度增加，影响政府的社会公信力和预警信心。


    ### 5．环境共建：净化网络媒体生态，减少负面刺激、引导与示范


    互联网为信息的流通和传播提供了很大便捷，而网络信息流通和传播中存在的噪声会对网络秩序的维护带来巨大干扰。这些噪声分为两类：一类是有预谋的网络谣言，另一类是无意识的刺激信息。这两类噪声最容易在风险集中区域产生，并借助互联网迅速繁殖和传播。群体性事件作为社会风险寄居、社会矛盾聚集的重要表现形式，以此为中心极易产生有意识或者无意识的干扰性信息，并在人们的自我保护心理之下迅速传播。这些信息对人们的事实判断、情绪反映和行动选择产生影响，引发群体性事件发生。加强互联网信息规约，净化网络媒体生态，减少网络谣言对社会民众的刺激，规避负面信息的不良引导和示范，搭建一个理性表达、中立判断、客观评析、正面引导的信任型网络空间环境。


    总之，融合不同地域、不同领域、不同部门相对分割的数据资源，依托大数据支持，群体性事件预警需要在国家安全总体治理框架下，将技术与管理相结合，数据与社会相融合，融社会管理于数据技术之中，用数据技术提高管理效率，在数据、经验与知识的共享和制度、环境的共建中推进群体性事件预警的智能决策，在多元协同的社会综合治理中实现群体性事件的精准预警、科学防范。


