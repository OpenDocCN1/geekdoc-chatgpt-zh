    # 互联网最新技术对舆论传播的影响及应对策略


    从目前国家监管部门及网民对各大网络平台的核心诉求来看，一方面是来自内容上的，另一方面则是关于数据安全方面的。特别是近两年，随着个人信息违法案件的增多，国家对此类事件的严管力度也在不断增强。如`2019年8月底`，由某科技公司开发的一款换脸软件`ZAO`在各大手机应用市场上昙花一现，其迅速蹿红又迅速下架的主要原因正是侵害了用户的个人信息安全，其用户协议中的个别条款不仅涉嫌侵犯用户隐私，并暗藏霸王条款等问题，该事件引发了网民的极度不满，工信部也对开发公司进行了约谈，最终导致产品“流产”。


    此前，国内某平台也曾出现过源代码泄露、视频信息遭盗用等情况，此类突发状况不仅对平台安全造成威胁，增加用户的不安全感，同样也会给公司在资本市场上的表现带来直接影响。


