    ## 5.8 传统网络舆情监测体系的短板


    基于传播学数据分析的网络舆情分析工具已经进入到亟须提升其产品内核改善其运作基因的时段。在过去，传统网络舆情体系的建立多基于对数据的抓取和对数据的呈现技术实现而出现，在很大程度上，这种系统缺乏对风险治理以及应急治理思维的有机嵌入和与危机应对思想的融合。以传播学数据特征和软件工程师用技术思维开发的网络舆情监测体系已经远远不能应对来自各类风险的挑战。'
  fmt: "\n## 5 中国应急管理制度与态势感知体系\n\n### 5.2 相关法律法规体系\n\n在应对地震灾害方面，国家制定了《防震减灾法》，规定了地震监测预报、地震灾害预防、地震应急、震后救灾与重建、法律责任等制度。配套的《破坏性地震应急条例》进一步明确了应急机构、应急预案、临震应急、震后应急、奖励和处罚等制度。因严重破坏性地震应急的需要，可以在灾区实行特别管制措施。\n\
    \n在应对事故灾难方面，随着国家经济的高速发展，生产安全事故也呈多发态势，给人民生命和财产带来极大威胁，也严重影响了经济社会的健康发展。为此国务院制定了《生产安全事故报告和调查处理条例》，对于生产经营活动中发生的造成人身伤亡或者直接经济损失的生产安全事故的分级、报告、调查处理、法律责任等方面作了规定。同时还制定了《放射性同位素与射线装置安全和防护条例》，在环境污染事故、核设施事故、国防科研生产事故的报告和调查处理方面也分别作了规定。在火灾预防方面，国家制定了《消防法》，规范了消防组织、灭火救援、监督检查、法律责任等。此外还有《建筑法》，国务院《矿山安全法实施条例》《关于预防煤矿生产安全事故的特别规定》《煤矿安全监察条例》等。特别是在《国务院关于特大安全事故行政责任追究》中，规定地方人民政府主要领导人和政府有关部门正职负责人对特大安全事故的防范、发生有失职、渎职情形或者负有领导责任的，给予行政处分并依法追究刑事责任。此外还有国务院《建设工程质量管理条例》《工伤保险条例》《劳动保障监察条例》《建设工程安全生产管理条例》等。\n\
    \n在应对公共卫生事件方面，国家制定了《传染病防治法》，明确国家对传染病防治实行预防为主、防治结合、分类管理、依靠科学、依靠群众的方针，建立健全传染病防治的疾病预防控制、医疗救治和监督管理体系。国务院制定了《重大动物疫情应急条例》，规定重大动物疫情，按照属地管理的原则，实行政府统一领导、部门分工负责，逐级建立责任制，并具体确定了应急准备、监测、报告和公布、应急处理、法律责任等制度。此外，国务院还制定了《传染病防治法实施办法》和《突发公共卫生事件应急条例》等法规文件。\n\
    \n在食品安全方面，国家制定了《食品安全法》，规定了食品安全风险监测和评估、食品安全标准、食品生产经营、食品检验、食品进出口、食品安全事故处置、监督管理、法律责任等制度。此外，还有《动物防疫法》《国境卫生检疫法》《进出境动植物检疫法》，国务院的《植物检疫条例》《国境卫生检疫法实施细则》等法规文件。\n\
    \n在应对社会安全事件方面，国家制定了《集会游行示威法》，规范了在露天公共场所或者公共道路上以集会、游行、静坐等方式，表达要求、抗议或者支持、声援等共同意愿的活动。此外，还有《民族区域自治法》《人民警察法》《监狱法》《中国人民银行法》《商业银行法》《治安处罚法》《刑法》，国务院的《信访条例》《企业劳动争议处理条例》《行政区域边界争议处理条例》《营业性演出管理条例》等法规文件。\n\
    \n这些法律法规确定的应急管理基本制度与中央政府部门制定的应急管理规章，省、自治区、直辖市及较大的市制定的有关政府应急管理的法规规章共同构成国家应急管理制度体系。\n\
    \n### 5.3 中国应急管理制度的短板和不足\n\n#### 5.3.1 中国应急管理制度的特点\n\n在长期的应急管理实践中，我国逐步形成了由国务院统一领导，分部门按类别处置各类突发公共事件的应急管理制度。这些形成体系的制度有以下特点：\n\
    \n1. **统一领导、分工负责**  \n   我国应急管理的最高机构是国务院，由国务院领导，并授权国家应急管理部，负责落实各类突发事件的预防和处置工作。国务院办公厅设应急管理办公室，履行值守应急、信息汇总和综合协调职责，统一指挥和协调各部门、各地区的应急处置工作。\n\
    \n2. **分级管理、条块结合**  \n   按照突发事件的规模和范围实行分级管理。而对由地方为主处置的突发事件，国务院各部门应给予指导、协调和帮助，实行条块结合管理。\n\
    \n3. **部门应急形成体系**  \n   国务院承担直接处置突发事件职责的部门，均设有相应的应急指挥机构、信息通信系统、防灾设施装备、应急救援队伍，建立了监测预报体系、组织指挥体系和救援救助体系。\n\
    \n#### 5.3.2 中国应急管理工作中的不足\n\n在突发事件应对处置实践中，各级政府充分发挥了组织职能，应急管理水平迅速提高，但同时也存在一些不足。具体表现为：\n\
    \n1. **职能分工不够清晰**  \n   首先是条块应急管理职权划分不够清晰，职责分工不够明确，造成在实践操作中常常出现部门间协调困难、行动衔接配合不到位等问题；其次是地方属地化管理的责任和授权不足，在应急实施中难于运行。\n\
    \n2. **综合性风险评估机制薄弱**  \n   以部门为基础的监测体系和风险评估较为有力，但因综合性的风险评估和趋势预测有所不足，缺乏科学的风险评估指标，也未形成风险评估指标体系。\n\
    \n3. **政府及部门信息沟通机制运转不畅**  \n   目前我国还存在应急信息报告的标准、程序、时限和责任不明确、不规范等问题，信息系统之间相互分割，缺乏互连互通和信息资源的共享，综合性信息分析和综合性信息平台建设有待加强。\n\
    \n4. **社会参与制度化程度不高**  \n   我国对全社会的应急教育、培训、演练、救灾善款的募捐和社会志愿者参与应急救援等均无系统法律，缺乏设计具体措施和要求，不利于实际操作。\n\
    \n### 5.4 应急管理态势感知及协同平台体系建设\n\n随着社会的不断发展与进步，社会矛盾呈复杂化、多元化的趋势发展，当前我国公共安全形势严峻复杂，社会公共安全事件、群体性事件、工程安全事故、突发自然灾害以及社会保障问题频繁发生。快速发展的现代化进程使得各种风险并存，公共安全形势面临着前所未有的挑战。随着经济和互联网的快速发展，我国的应急管理也在不断发展中。全球生态环境的恶性发展使得社会大众对灾害更加敏感，随着社会经济的发展，人们不得不考虑如何才能减少由此带来的负面效应。在对灾害的防控过程中，各种技术也在不断发展，包括信息技术、通信技术、物流及生产技术都使灾害控制上升到了一个新的阶段。建立应急管理大数据信息化监测预警平台是大势所趋。\n\
    \n同时，国家应急管理部也提出要牵头规划建设全国应急管理大数据应用平台，且其已被纳入发展规划中。应急管理的发展不是一蹴而就的，在其发展过程中也面临着巨大的风险和挑战。加强应急基础信息管理，整合各方资源，推进信息共享共用，对强化灾害事故风险和隐患监管，提升安全生产和综合防灾减灾救灾水平，推动形成统一指挥、专常兼备、反应灵敏、上下联动、平战结合的中国特色应急管理体制，有效保障人民群众生命财产安全和社会稳定具有重要作用。\n\
    \n第一，有利于提升应急智能预测预警水平，最大程度预防和减少灾害事故造成的人员伤亡和财产损失。第二，强化应急指挥辅助决策，有力保障应急指挥决策的科学高效，支撑构建科学完备的监管体系，努力实现对灾害事故风险和隐患的全领域、全方位、全过程管控。第三，有利于及时掌握灾害事故线索和可能造成人员伤亡、重大财产损失的苗头性、趋势性、敏感性信息，确保及时发现灾害事故并迅速开展处置，第一时间报送灾害事故信息，切实提升应急信息协同及相关信息的收集能力。\n\
    \n针对我国应急管理大数据信息化监测预警平台的建设及相关方面进行研究，针对应急管理的不同突发事件及灾害事件的类型研究，除了要对我国整体的应急管理大数据信息化监测预警平台进行研究外，还要从各地区、各有关部门、各行业企业应急管理大数据信息化监测预警平台建设的相关方面进行研究。从应急管理涉及的不同的范围来讲，宏观上从构建一体化全覆盖的全国应急管理大数据应用平台建设入手，建设主要包括自然灾害风险综合感知与预警平台建设工程、生产安全实时监测预警监管平台建设工程、应急管理全媒体矩阵建设工程等。\n\
    \n1. **构建一体化全覆盖的全国应急管理大数据应用平台**  \n   这部分主要从宏观角度进行研究。依托国家数据共享交换平台体系，充分利用大数据、云计算、物联网等技术，实现重大风险和隐患在线监测、超前预警预报和灾害事故高效处置。各地区、各有关部门、各行业企业要在加强自身信息化建设、健全完善相关系统的基础上，将本地区、本部门掌握的安全生产、自然灾害防治领域的风险和隐患信息以及灾害事故信息逐步接入。\n\
    \n2. **风险态势感知与预警平台建设工程**  \n   主要针对各类风险灾害综合感知与预警体系建设。自然灾害具有不确定性、突发性、灾难性等特征，而对自然灾害进行风险综合感知，利用大数据对相关的数据及特征进行分析，就能够对该类事件提前预警，能够最大限度地减少自然灾害带来的破坏及二次灾害。同样，各类社会风险也具有极强的不确定性，此类风险的情报搜集和信息处理以及预警和决策支持能力建设同样至关重要。\n\
    \n3. **生产安全实时监测预警监管平台建设工程**  \n   该部分主要针对生产安全实时监测预警监管进行建设。近年来，各类安全生产事故频发，给人民带来巨大的人身及财产安全威胁，建立生产安全实时监测预警有利于提高生产安全类事件的安全性，有效降低风险的发生概率。\n\
    \n4. **应急管理全媒体矩阵建设工程**  \n   针对全媒体时代下的政府话语权引导、全媒体参与应急以及全媒体矩阵的形成等方面进行建设。对接入全国应急管理大数据应用平台的信息，按照预警级别、紧急程度、发展态势和可能造成的危害程度发布，及时利用全媒体矩阵发布传播应急基础信息，实现风险治理全媒体矩阵的能力最大化。\n\
    \n### 5.5 应急管理态势感知系统技术实现\n\n一个典型的应急态势感知包括以下几个部分：\n\n1. **基础设施层**  \n   整个系统的底层是信息系统的基础设施，这包括网络及通信设施、主机服务器及存储系统、视频会议系统、可视化大屏调度系统，以及大数据环境、操作系统环境、数据库管理系统及网络通信基础设施等，这些是系统最基本的运行基础。\n\
    \n2. **数据中心**  \n   数据是整个系统的基础，基础数据经过采集、处理、标准化、传输、存储，形成系统资源库，为系统提供了高效的业务分析、决策、交换、共享的数据环境。主要包括以下数据库：模型数据库、知识数据库、方法数据库、预案数据库、人口基础数据库、灾情数据库、地理信息空间数据库、基础字典数据库、资源数据库。初步实现应急指挥系统基础架构和数据整合，并在GIS平台上整合部门安全生产及应急业务信息接口。\n\
    \n3. **资源整合**  \n   应急指挥需要多部门、多系统联动配合，如果彼此孤立，不能实现信息共享，就会形成“信息孤岛”，造成缺乏可比数据、缺乏分析、缺乏管理。难以获得全面的业务信息，就会影响业务和决策的效率和准确性。通过提供应用整合服务、业务整合服务、数据整合服务连接相关职能部门的系统、业务、数据，最大限度地解决信息孤岛问题，最大限度地利用现有的数据资源。\n\
    \n4. **应用支撑层**  \n   应用支撑层的设计直接影响系统的稳定性、安全性及可靠性等重要因素，我们凭借多年的软件开发经验，采用低耦合、高内聚的设计思想，基于开放的标准在该层部署应用部件，为系统高效、可靠的运行提供保障。包括：决策支持系统、业务支持系统、GIS引擎、工作流引擎、全文检索、消息中间件、信息推送、内容管理、用户管理、权限管理、通用数据接口。\n\
    \n5. **应用层**  \n   系统根据突发事件应急的特点，综合各种数据信息及处理软件，提供辅助会商决策系统、数据收集与管理系统、信息处理与分析系统、资源管理系统、信息发布系统等应用系统，并可根据需要，快速地扩展业务系统。应急指挥平台资源和应用建设上可完成在GIS平台上完善与相关安全生产及应急业务信息接口，并预留与其他部门应急指挥系统信息应用整合的接口。\n\
    \n**系统特点及特性要求：**\n\n1. 充分利用云计算、大数据架构服务层的SaaS（Software as a Service）软件即服务、PaaS（Platform\
    \ as a Service）平台即服务、IaaS（Infrastructure as a Service）基础设施即服务，实现虚拟化技术，以实现对不断增长的数据和各部门应用支撑服务进行模拟，以降低共同的硬件的投入，以及软件的费用，来实现廉价的方案。\n\
    \n2. 通过将现有系统云化，建立基于云计算的应急指挥平台系统也是“资源共享”“统一指挥”的进一步提升。\n\n3. 通过云计算和虚拟化框架搭建平台。在这种模式下，应急平台可以自动地管理和动态地分配、部署、配置、重新配置以及回收资源，也可以自动安装软件和应用，从而实现快速高效、动态优化的应用、开发平台等计算资源分配，在某个项目结束后，应急平台可自动回收资源，充分发挥平台计算能力。\n\
    \n4. 利用大数据和云计算的特性，平台的数据中心可以集中分散的计算资源，为各种应用提供动态使用的计算平台，为未来的业务扩展提供保障，减少重复建设和无效建设，有效降低政府公共财政投入成本。\n\
    \n### 5.6 风险治理态势感知传统实现方法\n\n网络舆情，即网络空间所承载的社会情绪的集合，是来自网络的风险。“舆情”本是社会学的概念，现在广泛应用在网络及传播学的概念当中，指在一定的社会空间内，围绕中介性社会事件的发生、发展和变化，作为网络主体的社会民众对作为客体的社会管理者、企业、个人及其他各类组织及其政治、社会、道德等方面的取向产生和持有的社会态度，是较多人关于社会中各种现象、问题所表达的信念、态度、意见和情绪等表现的总和。从当下的舆情研究，特别是智库对舆情的研究看，很多人已不是在严格意义上讲舆情本身，不是对民意规律的发现，而是侧重在对民意之于执政者及其政治破坏性的研究。\n\
    \n风险决策算法是对风险因素准确、完整、实时的捕捉和分析，是一系列解决矛盾和问题的清晰指令集。在社会治理中，这些决策算法表现为系统揭示解决问题的原理、机理、策略和机制。在风险决策的态势感知进程中，其主要归结为找到并用好“算法技能”。不掌握这种风险决策算法模型，意味着丧失了“算法权和决策权”。在国家经济社会对于风险预警算法的依赖不断加深的背景下，算法不但是人工智能的基础性技术之一，也表征为一定的数字权力，在对风险研判、公众意见感知、社会治理需求回应、公共政策议程设定、政府部门及官员绩效评估等方面都有着明显的公共权力的属性。\n\
    \n应急管理科学化程度高低取决于算法的水平高低，同一突发事件可用不同算法处置，而某个算法的质量优劣将影响到算法乃至程序的效率。在借助人工智能进行应急管理时，其决策是否正确、迅速，救援能不能有序、高效，关键就在能不能选择合适的算法和随时改进算法。对于应急管理能力的评估，实质就是算法技能的评估。提升应急管理算法能力，需要还原安全的本义，强化算法的意识，创新智能的方式，而这些都有赖于深入研究突发事件的机理以及应急管理的机制，排除附加在应急管理中的过度要求，提供适度公平和合理可行的公共安全服务。\n\
    \n### 5.7 网络舆情风险治理的认知困境\n\n社会管理实践孕育了应急管理理论。2003年中国遭遇了突如其来的一次“非典”疫情，政府应急管理的研究提上议事日程。由于开辟了新的研究领域，因此以非常态管理为范式的应急管理得以确立，与传统的公共行政、公共管理、灾害管理及自然科学相关的学科剥离，独立出来，“自立门户”，成为广义公共管理学科中的一员。应急管理理论找到了新的研究对象，引入了新的研究方法，实现了研究视域和方法论的创新，拓宽了政府管理、社会管理、国家行政管理研究的内容。但是，随着社会发展、管理转型、信息革命，人们身处其中的主客观世界发生了极为深刻的变化，社会呈现出高速度、高精度、高复杂性等现象，导致国家行政决策的难度巨大—常态管理与非常态管理的边界在哪里？先前的常态与现今的危机之间只有一念之差，于是，便在决策领域开始“泛应急化”，有时候还冠以源头治理、预管理等名义，增加了应急管理的“领地”，出现了滥用应急、过度应急的现象。舆情应对中有时就会出现这类过度应用应急管理的现象。应当承认，现代舆情不是传统意义上“舆论的情况”的简称。在一些地方实际应对舆情的工作中，存在着将舆情概念贬义化的趋势，使得舆情成为风险、灾难、危机的代名词，把“舆情应对”当作应急管理的一个分支。这种对舆论场中任何风波，包括民众对国家政治的看法、意见和态度，对社会问题的看法、意见和态度，对任何与执政者发布的政策、决策不同的声音都定性为不满表达、否定性态度、负能量的认知态度，使得一些有价值的信息难以得到释放，群众中的“事前诸葛亮”被封杀，这也成为不少地方领导同志“谈舆色变”的原因。如果按照这样的理解，那么多数“舆情”都需要进入应急管理的研究领域。\n\
    \n“现实社会中的多数事态从普通的风险发展为危机的可能性是存在的，那是不是对所有的风险都要运用应急管理的手段呢？显然是不对的。这样做，在实践中对政府舆情管理的公信力是一个摧残，管理者的执行力也难以提高。”[^1]\n\
    \n在政府了解民情民意方面，舆情管理具有重要意义，这使管理者能够从管理中及时得到有用的信息资源，能够从群众中汲取智慧力量，服务于决策和执行。当前出现的网络舆情放大效应，从一个侧面表明我国改革开放以来不断扩大社会主义民主，并取得了积极的成果。加强舆情管理同样是为了推动当代政治建设、发扬民主的重要形式和渠道。如果把这方面的功能与应急管理加以混淆，这无异于堵塞了言路，切断了一条新的政策咨询渠道。同时，舆情对于决策的作用具有辅助性特点，要防止决策者被舆情“绑架”。\n\
    \n舆情管理是化解风险和处置危机的防范性工具。针对舆情的应急管理与通常的应急管理有着本质的区别，在体制结构、运行机理、处置方式等环节所借助的资源和手段都有特殊的规律。重大舆情应急管理主要通过技术监测与预警、内容分析与评估、政治传播与终止、法治保护与惩治等管理措施，赢得时空上的优势和话语权的掌握。由于人类进入风险社会，以及中国尚未完成经济社会大转型这一大背景，对舆情实施应急性的系统治理、主动治理、动态治理是必要的，但这样做不是将应急管理作为舆情管理的终点，而恰恰相反，是将其作为起点，依托突发事件中聚集民意的政治场景，将应急管理转化为社会风险治理和公共危机治理，使之融合为国家治理的有机组成部分，成为风险战略管理的重要工作之一。\n\
    \n通过分析国家治理与应急管理的关系，可以更为清晰地看到应急管理制度的优劣，进而运用法治的力量推动制度优势向管理效能转化。通过分析公共管理、行政管理与应急管理的关系，可以明确公共安全的定位，有效开发和储备应急管理工具，解决应急管理中的技术难题。\n\
    \n“分析社会舆情与应急管理的关系，有助于矫正某些过度反应的认识误区，从宏大的马克思主义真理、民族复兴愿景、以人民为中心的工作理念源头，形成舆情管理的破竹之势，这就是新时代应急管理应当重视的‘法、术、势’。”[^2]\n\
    \n---\n\n[^1]: 高小平：《中国应急管理制度创新的方向、路径及其保障》, 《广州大学学报（社会科学版）》, 2020年第2期，第16—24页。\n\
    [^2]: 高小平：《中国应急管理制度创新的方向、路径及其保障》, 《广州大学学报（社会科学版）》, 2020年第2期，第16—24页。\n\n### 5.8\
    \ 传统网络舆情监测体系的短板\n\n基于传播学数据分析的网络舆情分析工具已经进入到亟须提升其产品内核改善其运作基因的时段。在过去，传统网络舆情体系的建立多基于对数据的抓取和对数据的呈现技术实现而出现，在很大程度上，这种系统缺乏对风险治理以及应急治理思维的有机嵌入和与危机应对思想的融合。以传播学数据特征和软件工程师用技术思维开发的网络舆情监测体系已经远远不能应对来自各类风险的挑战。\n"
  trans: "\n\n## 5 China's Emergency Management System and Situational Awareness Framework\n\
    \n### 5.2 Relevant Legal and Regulatory Framework\n\nIn response to earthquake\
    \ disasters, the state has enacted the *Law on Earthquake Disaster Prevention\
    \ and Reduction*, which stipulates systems for earthquake monitoring and forecasting,\
    \ earthquake disaster prevention, earthquake emergency response, post-earthquake\
    \ relief and reconstruction, and legal liabilities. The supporting *Regulations\
    \ on Emergency Response to Destructive Earthquakes* further clarify systems regarding\
    \ emergency agencies, emergency plans, pre-earthquake emergency response, post-earthquake\
    \ emergency response, rewards, and penalties. Special control measures may be\
    \ implemented in disaster-stricken areas when necessary for the emergency response\
    \ to severe destructive earthquakes.\n\nIn response to accidents and disasters,\
    \ with the rapid development of the national economy, work safety accidents have\
    \ also shown a frequent occurrence trend, posing enormous threats to people's\
    \ lives and property, and seriously affecting the healthy development of the economy\
    \ and society. To this end, the State Council formulated the *Regulations on Reporting,\
    \ Investigation and Disposition of Work Safety Accidents*, making provisions on\
    \ the classification, reporting, investigation and disposition, and legal liabilities\
    \ of work safety accidents causing casualties or direct economic losses in production\
    \ and business activities. At the same time, the *Regulations on Safety and Protection\
    \ of Radioisotopes and Ray Devices* were formulated, which also made respective\
    \ provisions on the reporting, investigation, and disposition of environmental\
    \ pollution accidents, nuclear facility accidents, and national defense scientific\
    \ research and production accidents. In terms of fire prevention, the state enacted\
    \ the *Fire Protection Law*, standardizing fire protection organizations, firefighting\
    \ and rescue, supervision and inspection, and legal liabilities. Additionally,\
    \ there are the *Construction Law*, the State Council's *Implementation Regulations\
    \ of the Mine Safety Law*, *Special Provisions on Prevention of Work Safety Accidents\
    \ in Coal Mines*, *Regulations on Coal Mine Safety Supervision*, etc. Notably,\
    \ in the *State Council on Administrative Accountability for Extraordinarily Serious\
    \ Work Safety Accidents*, it is stipulated that principal leaders of local people's\
    \ governments and heads of relevant government departments who are negligent,\
    \ derelict in duty, or bear leadership responsibility for the prevention and occurrence\
    \ of extraordinarily serious work safety accidents shall be given administrative\
    \ sanctions and held criminally liable in accordance with the law. In addition,\
    \ there are the State Council's *Regulations on Quality Management of Construction\
    \ Projects*, *Regulations on Work-related Injury Insurance*, *Regulations on Labor\
    \ Security Supervision*, *Regulations on Safety Production Management of Construction\
    \ Projects*, and others.\n\nIn response to public health emergencies, the state\
    \ enacted the *Law on Prevention and Treatment of Infectious Diseases*, stipulating\
    \ that the state adheres to the principle of prevention first, integrating prevention\
    \ with treatment, categorized management, reliance on science, and reliance on\
    \ the masses for infectious disease prevention and control, and establishes and\
    \ improves the disease prevention and control, medical treatment, and supervision\
    \ and management systems for infectious disease prevention and control. The State\
    \ Council formulated the *Regulations on Emergency Response to Major Animal Epidemics*,\
    \ stipulating that major animal epidemics shall be managed under the principle\
    \ of local management, implementing unified government leadership, departmental\
    \ division of responsibilities, and a responsibility system at all levels, and\
    \ specifically determining systems for emergency preparedness, monitoring, reporting\
    \ and release, emergency handling, and legal liabilities. In addition, the State\
    \ Council also formulated the *Implementation Measures for the Law on Prevention\
    \ and Treatment of Infectious Diseases* and the *Regulations on Emergency Response\
    \ to Public Health Emergencies* and other regulatory documents.\n\nIn terms of\
    \ food safety, the state enacted the *Food Safety Law*, stipulating systems for\
    \ food safety risk monitoring and assessment, food safety standards, food production\
    \ and operation, food inspection, food import and export, food safety accident\
    \ handling, supervision and management, and legal liabilities. In addition, there\
    \ are the *Animal Epidemic Prevention Law*, *Frontier Health and Quarantine Law*,\
    \ *Law on Entry-Exit Animal and Plant Quarantine*, and the State Council's *Regulations\
    \ on Plant Quarantine*, *Detailed Rules for the Implementation of the Frontier\
    \ Health and Quarantine Law*, and other regulatory documents.\n\nIn response to\
    \ social security incidents, the state enacted the *Law on Assemblies, Processions\
    \ and Demonstrations*, regulating activities in open public places or on public\
    \ roads where citizens express common demands, protests, support, or solidarity\
    \ through assemblies, processions, sit-ins, and other means. In addition, there\
    \ are the *Law on Regional Ethnic Autonomy*, *People's Police Law*, *Prison Law*,\
    \ *Law of the People's Bank of China*, *Commercial Bank Law*, *Law on Penalties\
    \ for Administration of Public Security*, *Criminal Law*, and the State Council's\
    \ *Regulations on Letters and Visits*, *Regulations on Handling Enterprise Labor\
    \ Disputes*, *Regulations on Handling Administrative Boundary Disputes*, *Regulations\
    \ on Management of Commercial Performances*, and other regulatory documents.\n\
    \nThese basic emergency management systems established by laws and regulations,\
    \ together with the emergency management departmental rules formulated by central\
    \ government departments and the relevant local regulations and rules on government\
    \ emergency management formulated by provinces, autonomous regions, municipalities\
    \ directly under the Central Government, and larger cities, jointly constitute\
    \ the national emergency management legal system.\n\n### 5.3 Shortcomings and\
    \ Deficiencies in China's Emergency Management System\n\n#### 5.3.1 Characteristics\
    \ of China's Emergency Management System\n\nThrough long-term emergency management\
    \ practice, China has gradually formed an emergency management system featuring\
    \ unified leadership by the State Council and categorized handling of various\
    \ public emergencies by different departments. The systems forming this framework\
    \ have the following characteristics:\n\n1. **Unified Leadership, Division of\
    \ Responsibilities**  \n   The highest organ of emergency management in China\
    \ is the State Council. Led by the State Council and authorized by it, the Ministry\
    \ of Emergency Management (MEM) is responsible for implementing the prevention\
    \ and handling of various emergencies. The General Office of the State Council\
    \ has an Emergency Management Office, which performs duties of emergency duty,\
    \ information aggregation, and comprehensive coordination, and uniformly commands\
    \ and coordinates the emergency response work of various departments and regions.\n\
    \n2. **Graded Management, Combination of Vertical and Horizontal Systems**  \n\
    \   Graded management is implemented according to the scale and scope of emergencies.\
    \ For emergencies handled primarily by local governments, relevant State Council\
    \ departments shall provide guidance, coordination, and assistance, implementing\
    \ a management model combining vertical (central department) and horizontal (local\
    \ government) systems.\n\n3. **Departmental Emergency Response Forming a System**\
    \  \n   State Council departments undertaking direct emergency response responsibilities\
    \ have all established corresponding emergency command agencies, information and\
    \ communication systems, disaster prevention facilities and equipment, and emergency\
    \ rescue teams, and have established monitoring and forecasting systems, command\
    \ systems, and rescue and relief systems.\n\n#### 5.3.2 Deficiencies in China's\
    \ Emergency Management Work\n\nIn the practice of responding to and handling emergencies,\
    \ governments at all levels have fully played their organizational functions,\
    \ and the level of emergency management has rapidly improved. However, some deficiencies\
    \ also exist simultaneously. These are specifically manifested as:\n\n1. **Unclear\
    \ Functional Division**  \n   First, the division of powers and responsibilities\
    \ between vertical and horizontal emergency management is not clear enough, and\
    \ the division of duties is not explicit enough, leading to frequent difficulties\
    \ in inter-departmental coordination and poor connection and cooperation in practical\
    \ operations; second, the responsibility and authorization of local territorial\
    \ management are insufficient, making it difficult to operate during emergency\
    \ implementation.\n\n2. **Weak Comprehensive Risk Assessment Mechanism**  \n \
    \  Department-based monitoring systems and risk assessments are relatively strong,\
    \ but comprehensive risk assessment and trend prediction are insufficient. There\
    \ is a lack of scientific risk assessment indicators, and a risk assessment indicator\
    \ system has not yet been formed.\n\n3. **Poor Operation of Information Communication\
    \ Mechanisms between Government and Departments**  \n   Currently, China still\
    \ faces issues such as unclear and non-standard standards, procedures, time limits,\
    \ and responsibilities for emergency information reporting. Information systems\
    \ are isolated from each other, lacking interconnection and information resource\
    \ sharing. The construction of comprehensive information analysis and comprehensive\
    \ information platforms needs to be strengthened.\n\n4. **Low Degree of Institutionalization\
    \ of Social Participation**  \n   China lacks systematic laws for emergency education,\
    \ training, drills, and fundraising for disaster relief donations for the whole\
    \ society, as well as for the participation of social volunteers in emergency\
    \ rescue. There is a lack of specific measures and requirements, which is not\
    \ conducive to actual operations.\n\n### 5.4 Construction of Emergency Management\
    \ Situational Awareness and Collaborative Platform System\n\nWith the continuous\
    \ development and progress of society, social contradictions are developing in\
    \ a complex and diversified trend. Currently, China's public safety situation\
    \ is severe and complex, with frequent occurrences of public safety incidents,\
    \ mass incidents, engineering safety accidents, sudden natural disasters, and\
    \ social security issues. The rapidly developing modernization process has led\
    \ to the coexistence of various risks, and the public safety situation faces unprecedented\
    \ challenges. With the rapid development of the economy and the Internet, China's\
    \ emergency management is also continuously developing. The malignant development\
    \ of the global ecological environment has made the public more sensitive to disasters.\
    \ With the development of the social economy, people have to consider how to reduce\
    \ the negative effects brought about by this. In the process of disaster prevention\
    \ and control, various technologies are also continuously developing, including\
    \ information technology, communication technology, logistics and production technology,\
    \ which have elevated disaster control to a new stage. Establishing an emergency\
    \ management big data information-based monitoring and early warning platform\
    \ is the general trend.\n\nAt the same time, the Ministry of Emergency Management\
    \ has also proposed to take the lead in planning and building a national emergency\
    \ management big data application platform, which has been included in the development\
    \ plan. The development of emergency management cannot be achieved overnight;\
    \ it also faces huge risks and challenges in its development process. Strengthening\
    \ basic emergency information management, integrating resources from all parties,\
    \ and promoting information sharing and common use play an important role in strengthening\
    \ the supervision of disaster and accident risks and hidden dangers, improving\
    \ the level of work safety and comprehensive disaster prevention, reduction, and\
    \ relief, promoting the formation of a Chinese-characteristic emergency management\
    \ system featuring unified command, peacetime-war integration, rapid response,\
    \ vertical-horizontal linkage, and military-civilian integration, and effectively\
    \ safeguarding the safety of people's lives and property and social stability.\n\
    \nFirst, it helps improve the level of intelligent emergency forecasting and early\
    \ warning, preventing and reducing casualties and property losses caused by disasters\
    \ and accidents to the greatest extent. Second, it strengthens emergency command\
    \ auxiliary decision-making, effectively guaranteeing the scientificity and efficiency\
    \ of emergency command decisions, supporting the construction of a scientific\
    \ and complete supervision system, and striving to achieve full-domain, all-round,\
    \ and whole-process control of disaster and accident risks and hidden dangers.\
    \ Third, it helps timely grasp clues of disasters and accidents and incipient,\
    \ trending, and sensitive information that may cause casualties or major property\
    \ losses, ensuring timely detection of disasters and accidents and rapid response,\
    \ reporting disaster and accident information at the first time, and effectively\
    \ enhancing the capacity for emergency information collaboration and related information\
    \ collection.\n\nIn response to the construction of China's emergency management\
    \ big data information-based monitoring and early warning platform and related\
    \ aspects, research is conducted on the types of different emergencies and disaster\
    \ events in emergency management. In addition to researching the overall national\
    \ emergency management big data information-based monitoring and early warning\
    \ platform, research should also be conducted on relevant aspects of the construction\
    \ of emergency management big data information-based monitoring and early warning\
    \ platforms by various regions, relevant departments, and industry enterprises.\
    \ From the perspective of the different scopes involved in emergency management,\
    \ at the macro level, starting from the construction of an integrated, fully-covered\
    \ national emergency management big data application platform, the construction\
    \ mainly includes the Natural Disaster Risk Comprehensive Perception and Early\
    \ Warning Platform Construction Project, the Work Safety Real-time Monitoring,\
    \ Early Warning and Supervision Platform Construction Project, the Emergency Management\
    \ Omnimedia Matrix Construction Project, etc.\n\n1. **Construction of an Integrated,\
    \ Fully-Covered National Emergency Management Big Data Application Platform**\
    \  \n   This part is mainly studied from a macro perspective. Relying on the national\
    \ data sharing and exchange platform system, fully utilizing technologies such\
    \ as big data, cloud computing, and the Internet of Things, it aims to achieve\
    \ online monitoring of major risks and hidden dangers, advanced early warning\
    \ and forecasting, and efficient handling of disasters and accidents. Various\
    \ regions, relevant departments, and industry enterprises, on the basis of strengthening\
    \ their own informatization construction and improving relevant systems, shall\
    \ gradually connect the risk and hidden danger information and disaster and accident\
    \ information in the fields of work safety and natural disaster prevention and\
    \ control mastered by their respective regions and departments.\n\n2. **Risk Situational\
    \ Awareness and Early Warning Platform Construction Project**  \n   This mainly\
    \ targets the construction of a comprehensive perception and early warning system\
    \ for various risks and disasters. Natural disasters feature uncertainty, suddenness,\
    \ and destructiveness. Comprehensive risk perception of natural disasters, utilizing\
    \ big data to analyze relevant data and characteristics, enables early warning\
    \ for such events, minimizing the damage caused by natural disasters and secondary\
    \ disasters to the greatest extent. Similarly, various social risks also possess\
    \ strong uncertainty. The construction of intelligence gathering, information\
    \ processing, early warning, and decision support capabilities for such risks\
    \ is equally crucial.\n\n3. **Work Safety Real-time Monitoring, Early Warning\
    \ and Supervision Platform Construction Project**  \n   This part mainly targets\
    \ the construction of real-time monitoring, early warning, and supervision for\
    \ work safety. In recent years, various work safety accidents have occurred frequently,\
    \ posing huge threats to people's personal and property safety. Establishing real-time\
    \ monitoring, early warning, and supervision for work safety helps improve the\
    \ safety of work safety events and effectively reduce the probability of risk\
    \ occurrence.\n\n4. **Emergency Management Omnimedia Matrix Construction Project**\
    \  \n   This targets the guidance of government discourse power in the omnimedia\
    \ era, omnimedia participation in emergencies, and the formation of the omnimedia\
    \ matrix. For information accessed to the national emergency management big data\
    \ application platform, it shall be released according to warning level, urgency,\
    \ development trend, and possible degree of harm. Timely utilize the omnimedia\
    \ matrix to release and disseminate basic emergency information, maximizing the\
    \ capability of the risk governance omnimedia matrix.\n\n### 5.5 Technical Implementation\
    \ of Emergency Management Situational Awareness System\n\nA typical emergency\
    \ situational awareness system includes the following parts:\n\n1. **Infrastructure\
    \ Layer**  \n   The bottom layer of the entire system is the infrastructure of\
    \ the information system, which includes network and communication facilities,\
    \ host servers and storage systems, video conferencing systems, visualization\
    \ large-screen dispatching systems, as well as big data environments, operating\
    \ system environments, database management systems, and network communication\
    \ infrastructure. These are the most basic operational foundations of the system.\n\
    \n2. **Data Center**  \n   Data is the foundation of the entire system. Basic\
    \ data undergoes collection, processing, standardization, transmission, and storage\
    \ to form a system resource library, providing an efficient data environment for\
    \ business analysis, decision-making, exchange, and sharing. It mainly includes\
    \ the following databases: Model Database, Knowledge Database, Method Database,\
    \ Contingency Plan Database, Population Basic Database, Disaster Situation Database,\
    \ Geographic Information Spatial Database, Basic Dictionary Database, Resource\
    \ Database. It preliminarily realizes the integration of the basic architecture\
    \ and data of the emergency command system, and integrates departmental work safety\
    \ and emergency business information interfaces on the GIS platform.\n\n3. **Resource\
    \ Integration**  \n   Emergency command requires multi-department and multi-system\
    \ linkage and coordination. If they are isolated from each other and cannot achieve\
    \ information sharing, \"information silos\" will form, resulting in a lack of\
    \ comparable data, lack of analysis, and lack of management. The inability to\
    \ obtain comprehensive business information will affect the efficiency and accuracy\
    \ of business and decision-making. By providing application integration services,\
    \ business integration services, and data integration services to connect the\
    \ systems, business, and data of relevant functional departments, the \"information\
    \ silo\" problem is solved to the greatest extent, and existing data resources\
    \ are utilized to the greatest extent.\n\n4. **Application Support Layer**  \n\
    \   The design of the application support layer directly affects important factors\
    \ such as system stability, security, and reliability. Leveraging years of software\
    \ development experience, we adopt the design concept of low coupling and high\
    \ cohesion, deploy application components based on open standards at this layer,\
    \ and provide guarantees for the efficient and reliable operation of the system.\
    \ It includes: Decision Support System, Business Support System, GIS Engine, Workflow\
    \ Engine, Full-text Search, Message Middleware, Information Push, Content Management,\
    \ User Management, Permission Management, General Data Interface.\n\n5. **Application\
    \ Layer**  \n   Based on the characteristics of emergency response to emergencies,\
    \ the system comprehensively utilizes various data information and processing\
    \ software to provide application systems such as the Consultative Decision Support\
    \ System, Data Collection and Management System, Information Processing and Analysis\
    \ System, Resource Management System, Information Release System, etc., and can\
    \ quickly expand business systems as needed. In terms of emergency command platform\
    \ resource and application construction, it can complete the improvement of relevant\
    \ work safety and emergency business information interfaces on the GIS platform,\
    \ and reserve interfaces for information application integration with other departmental\
    \ emergency command systems.\n\n**System Features and Property Requirements:**\n\
    \n1.  Fully utilize the SaaS (Software as a Service), PaaS (Platform as a Service),\
    \ and IaaS (Infrastructure as a Service) of the cloud computing and big data architecture\
    \ service layer to realize virtualization technology, so as to simulate the ever-growing\
    \ data and various departmental application support services, reduce common hardware\
    \ investment and software costs, and achieve a cost-effective solution.\n\n2.\
    \  By migrating existing systems to the cloud, establishing an emergency command\
    \ platform system based on cloud computing is a further enhancement of \"resource\
    \ sharing\" and \"unified command.\"\n\n3.  Build the platform through cloud computing\
    \ and virtualization frameworks. In this mode, the emergency platform can automatically\
    \ manage and dynamically allocate, deploy, configure, reconfigure, and recycle\
    \ resources, and can automatically install software and applications, thereby\
    \ realizing rapid, efficient, and dynamically optimized computing resource allocation\
    \ for applications and development platforms. After a project ends, the emergency\
    \ platform can automatically recycle resources, fully leveraging the platform's\
    \ computing power.\n\n4.  Utilizing the characteristics of big data and cloud\
    \ computing, the platform's data center can centralize dispersed computing resources,\
    \ provide a dynamically usable computing platform for various applications, provide\
    \ guarantees for future business expansion, reduce duplicate and invalid construction,\
    \ and effectively reduce government public fiscal investment costs.\n\n### 5.6\
    \ Traditional Implementation Methods of Risk Governance Situational Awareness\n\
    \nOnline public opinion, the aggregate of social emotions carried in cyberspace,\
    \ is risk originating from the network. \"Public opinion\" (Yuqing) was originally\
    \ a sociological concept, now widely used in network and communication studies.\
    \ It refers to the social attitudes generated and held by the public as network\
    \ subjects towards social managers, enterprises, individuals, and other organizations\
    \ as objects, and their political, social, moral, and other orientations, surrounding\
    \ the occurrence, development, and change of mediated social events within a certain\
    \ social space. It is the sum of beliefs, attitudes, opinions, and emotions expressed\
    \ by many people about various phenomena and problems in society. Judging from\
    \ current public opinion research, especially think tank research on public opinion,\
    \ many are no longer strictly speaking about public opinion itself, nor discovering\
    \ the laws of public sentiment, but rather focusing on the research of public\
    \ sentiment's destructive power to the ruling party and its politics.\n\nRisk\
    \ decision-making algorithms are clear instruction sets for solving a series of\
    \ contradictions and problems through accurate, complete, and real-time capture\
    \ and analysis of risk factors. In social governance, these decision-making algorithms\
    \ manifest as the system revealing the principles, mechanisms, strategies, and\
    \ mechanisms for solving problems. In the process of risk decision-making situational\
    \ awareness, it mainly boils down to finding and making good use of \"algorithmic\
    \ skills.\" Not mastering such risk decision-making algorithm models means losing\
    \ \"algorithmic power and decision-making power.\" Against the background of the\
    \ deepening dependence of the national economy and society on risk early warning\
    \ algorithms, algorithms are not only one of the basic technologies of artificial\
    \ intelligence but also represent a certain digital power. They have obvious public\
    \ power attributes in risk assessment, public opinion perception, response to\
    \ social governance needs, public policy agenda setting, and performance evaluation\
    \ of government departments and officials.\n\nThe degree of scientization of emergency\
    \ management depends on the level of algorithms. The same emergency can be handled\
    \ with different algorithms, and the quality of a specific algorithm will affect\
    \ the efficiency of the algorithm and even the program. When using artificial\
    \ intelligence for emergency management, whether the decision is correct and rapid,\
    \ and whether the rescue can be orderly and efficient, the key lies in whether\
    \ the appropriate algorithm can be selected and improved at any time. The assessment\
    \ of emergency management capability is essentially the assessment of algorithmic\
    \ capability. Enhancing emergency management algorithmic capability requires restoring\
    \ the true meaning of safety, strengthening algorithmic awareness, and innovating\
    \ intelligent methods, all of which rely on in-depth research into the mechanisms\
    \ of emergencies and the mechanisms of emergency management, eliminating excessive\
    \ demands attached to emergency management, and providing moderately fair and\
    \ feasible public safety services.\n\n### 5.7 Cognitive Dilemmas in Network Public\
    \ Opinion Risk Governance\n\nSocial management practice has given birth to emergency\
    \ management theory. In 2003, China encountered the sudden \"SARS\" epidemic,\
    \ and research on government emergency management was put on the agenda. Due to\
    \ the opening of a new research field, emergency management, with abnormal management\
    \ as its paradigm, was established, separating from traditional disciplines related\
    \ to public administration, public management, disaster management, and natural\
    \ sciences, becoming \"independent\" and a member of the broad discipline of public\
    \ administration. Emergency management theory found new research objects, introduced\
    \ new research methods, achieved innovation in research vision and methodology,\
    \ and broadened the content of government management, social management, and state\
    \ administrative management research. However, with social development, management\
    \ transformation, and the information revolution, the subjective and objective\
    \ worlds in which people live have undergone extremely profound changes. Society\
    \ presents phenomena of high speed, high precision, and high complexity, leading\
    \ to enormous difficulty in national administrative decision-making—where is the\
    \ boundary between normal management and abnormal management? There is only a\
    \ hair's breadth between the previous normality and the current crisis. Thus,\
    \ \"pan-emergency\" began in the decision-making field, sometimes under the guise\
    \ of source governance and pre-management, expanding the \"territory\" of emergency\
    \ management, leading to phenomena of abuse and overuse of emergency management.\
    \ Such phenomena of over-application of emergency management sometimes appear\
    \ in public opinion response. It must be acknowledged that modern public opinion\
    \ is not the abbreviation for \"public opinion situation\" in the traditional\
    \ sense. In the actual work of some localities in responding to public opinion,\
    \ there is a trend of giving the concept of public opinion a derogatory connotation,\
    \ making public opinion a synonym for risk, disaster, and crisis, and treating\
    \ \"public opinion response\" as a branch of emergency management. This cognitive\
    \ attitude of defining any disturbance in the field of public opinion—including\
    \ the public's views, opinions, and attitudes on national politics, their views\
    \ on social issues, and any voices different from the policies and decisions issued\
    \ by the ruling party—as expressions of dissatisfaction, negative attitudes, and\
    \ \"negative energy\" makes it difficult for some valuable information to be released,\
    \ and the \"hindsight geniuses\" among the masses are silenced. This has also\
    \ become the reason why some local leading comrades \"change countenance at the\
    \ mention of public opinion.\" If understood in this way, then the majority of\
    \ \"public opinion\" would need to enter the research field of emergency management.\n\
    \n\"The possibility exists for most situations in real society to develop from\
    \ ordinary risks into crises. Does that mean we must use emergency management\
    \ means for all risks? Obviously not. Doing so is a destruction of the government's\
    \ credibility in public opinion management in practice, and the execution ability\
    \ of managers is also difficult to improve.\" [¹]\n\nIn terms of the government\
    \ understanding public sentiment and opinions, public opinion management is of\
    \ great significance. This enables managers to obtain useful information resources\
    \ in a timely manner from management, draw wisdom and strength from the masses,\
    \ and serve decision-making and execution. The current network public opinion\
    \ amplification effect, from one aspect, indicates that since reform and opening\
    \ up, China has continuously expanded socialist democracy and achieved positive\
    \ results. Strengthening public opinion management is also an important form and\
    \ channel to promote contemporary political construction and carry forward democracy.\
    \ If this function is confused with emergency management, it is tantamount to\
    \ blocking the channels of speech and cutting off a new policy consultation channel.\
    \ At the same time, public opinion has an auxiliary characteristic for decision-making;\
    \ it is necessary to prevent decision-makers from being \"kidnapped\" by public\
    \ opinion.\n\nPublic opinion management is a preventive tool for resolving risks\
    \ and handling crises. Emergency management for public opinion has essential differences\
    \ from ordinary emergency management. In links such as institutional structure,\
    \ operation mechanism, and handling methods, the resources and means relied upon\
    \ have special laws. Major public opinion emergency management mainly gains advantages\
    \ in time and space and control of discourse power through management measures\
    \ such as technical monitoring and early warning, content analysis and evaluation,\
    \ political communication and termination, legal protection and punishment. Against\
    \ the backdrop of humanity entering a risk society and China not yet completing\
    \ the great transformation of economy and society, it is necessary to implement\
    \ systematic, proactive, and dynamic emergency governance of public opinion. However,\
    \ doing so is not to take emergency management as the end point of public opinion\
    \ management, but on the contrary, to take it as the starting point. Relying on\
    \ the political scene where public opinion gathers in emergencies, emergency management\
    \ is transformed into social risk governance and public crisis governance, making\
    \ it an organic part of national governance and an important task of risk strategic\
    \ management.\n\nBy analyzing the relationship between national governance and\
    \ emergency management, the advantages and disadvantages of the emergency management\
    \ system can be seen more clearly, and then the power of the rule of law can be\
    \ used to promote the transformation of system advantages into management effectiveness.\
    \ By analyzing the relationship between public administration, administrative\
    \ management, and emergency management, the positioning of public safety can be\
    \ clarified, emergency management tools can be effectively developed and reserved,\
    \ and technical problems in emergency management can be solved.\n\n\"Analyzing\
    \ the relationship between social public opinion and emergency management helps\
    \ correct some cognitive misunderstandings of overreaction. From the sources of\
    \ the grand Marxist truth, the vision of national rejuvenation, and the working\
    \ philosophy of putting people first, a sweeping momentum for public opinion management\
    \ is formed. This is the 'Law, Technique, and Potential' that emergency management\
    \ in the new era should value.\" [²]\n\n---\n\n[¹]: Gao Xiaoping: \"Direction,\
    \ Path and Guarantee of Innovation in China's Emergency Management System\", *Journal\
    \ of Guangzhou University (Social Science Edition)*, Issue 2, 2020, pp. 16-24.\n\
    [²]: Gao Xiaoping: \"Direction, Path and Guarantee of Innovation in China's Emergency\
    \ Management System\", *Journal of Guangzhou University (Social Science Edition)*,\
    \ Issue 2, 2020, pp. 16-24.\n\n### 5.8 Shortcomings of Traditional Network Public\
    \ Opinion Monitoring Systems\n\nNetwork public opinion analysis tools based on\
    \ communication data analysis have entered a period where they urgently need to\
    \ enhance their product core and improve their operational genes. In the past,\
    \ the establishment of traditional network public opinion systems mostly emerged\
    \ based on the technical implementation of data capture and data presentation.\
    \ To a large extent, such systems lack the organic embedding of risk governance\
    \ and emergency governance thinking. The network public opinion monitoring systems\
    \ developed with the thinking of communication data characteristics and software\
    \ engineers' technical mindset can no longer cope with the challenges from various\
    \ risks.\n\n"
