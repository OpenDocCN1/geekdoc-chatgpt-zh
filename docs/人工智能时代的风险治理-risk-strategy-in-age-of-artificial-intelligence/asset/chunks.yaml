- raw: "舆论认为，网络水军能够顺利逃避监管打击和平台封锁，并在网民不信任感中开展业务，或与其越来越强的策划力和引导力有关，操纵民意可以没有痕迹。《解放日报》报道称，网络水军并非想象中“简单粗暴”，背后应有策划团队“在下一盘大棋”。还有更具“专业性”的水军团队，比如在某些问答平台上，常会有类似“××虚拟货币是否值得投资”的讨论，答题者往往声称具有海归高学历背景，说得头头是道，点赞数、评论数更是多得惊人。\n\
    \n4．从业人员认知模糊，只把经营水军当做生意\n\n水军行业在强监管下依然兴风作浪，除了追求利益，还与从业人员对行业认知模糊，只把参与水军业务当作生意。舆论认为，正是由于从业者认识不清，才会选择继续做这行。知乎作者@马成在回答问题“做网络水军是一种什么样的体验？”时称，大多数水军所从事的其实真的是一种很正常的广告活动，水军其实是一种线上的苦力活，跟发传单、装玩偶这类传统的零工没什么差别。\n\
    \n5．水军队伍相对分散，打击起来难度相对较大\n\n网络水军分散在整个网络空间，开展业务时只需要网上联络。舆论认为，网络水军正是依托网络空间的分散特点，逃避监管和打击，即使接连重拳治理，依然可能“死灰复燃”。中国之声《新闻纵横》报道，2017年7月，在公安部指挥下，全国21个省区市对“三打哈”网络水军案开展集群收网行动，共抓获犯罪嫌疑人77名，涉案金额近400万元，该案涉及地域广、人员数量多、关系网络复杂。\n\
    \n网络水军人员分散，也给技术治理带来难度。网络安全工程师李铁军认为，打击网络灰色产业存在很高的技术难度。\n\n## 7.3 开放语境社会的风险治理\n\n\
    全媒体用户的群防群策群治应当成为网络治理的理性范式和治理路径。风险社会的风险无处不在，单一控制模式必将耗费大量的人力和社会成本。如果将每个社会个体当作风险的感应前端和风险感知的末梢神经，并且通过有序和有效的渠道迅速反馈到风险治理决策链上，这是最佳的风险群防群治机制。\n\
    \n这里有一个很重要的前提，试图构建开放社会体系下的风险感知网络，这需要开放的网络语境和信息高度透明的网络治理策略。建立一个高效、协同、互补、信任、和谐的网络交流环境至关重要，这是现代风险治理体系的基础和最有力的风险治理规避机制，也是应对风险时最有力的保障。\n\
    \n毛泽东曾经说过：“广东大雨，要如实公开报道。全国灾情，照样公开报道，唤起人民全力抗争。一点也不要隐瞒。政府救济，人民生产自救，要大力报道提倡。工业方面重大事故灾害，也要报道，讲究对策。”[\\\
    [1\\]](#Chapter_11_3.xhtml#B15)\n\n* * *\n\n[\\[1\\].](#Chapter_11_3.xhtml#BT15)毛泽东：《毛泽东新闻工作文选》，北京：新华出版社，1983年，第214页。\n\
    \n## 7.4 网络空间风险应对现状\n\n（一）法律层面的应对现状\n\n1．国家层面法律法规日益完善\n\n2016年11月，《中华人民共和国网络安全法》发布，这是自2017年以来我国已出台的系列有关网络和信息安全的法律制度之一，为网络健康有序安全发展提供了有力保证。法律法规日益完善，有助于净化网络环境，也为部分舆情处置应对提供了法律保障。\n\
    \n2．机构设置相对系统化立体化\n\n目前我国互联网舆情监测管理部门可以具体划分为：工信部门与工商部门，公安部门与国家安全部门，中央和地方的新闻办公室和对外宣传办公室，文化部门的新闻出版部门和广电部门以及中国互联网络信息中心等。自中央宣传部成立了舆情信息局后，全国各省委宣传部设置舆情信息处，这种垂直管理模式更能使政府及时高效地了解和监测网络舆情，从而达到合理引导舆情走向的目的。\n\
    \n3．体制外舆情机构“多流合一”\n\n如今，很多政府部门都建立了垂直管理的舆情服务机构，为了防止舆情监测手段过于单一，很多政府部门联合主流媒体、高校研究所、舆情服务企业、其他科研机构等建立联合舆情服务机构。\n\
    \n4．信息发布公开程度不断强化\n\n政府部门依托互联网，构建了政务自媒体体系，拥有了较强的信息发布能力，在回应舆情关切时更加便捷高效，公关意识增强，各级政府开始深度“触网”，政务信息公开程度不断提高，可以有效缓解民众焦虑，消解舆情压力。\n\
    \n5．舆情应对体系得到初步完善\n\n政府部门多已配备相应的舆情监测软件，能够迅速地捕捉到舆情信息，为舆情处置预留宝贵时间，舆情应对提速，官员问责力度加大。此外，舆情工作日益受到重视，部分领导干部已有初步的舆情意识，理论体系初步完善，部分政府部门也制订了舆情的处置流程。\n\
    \n（二）网络空间风险应对经验\n\n1．舆情理论实操培训常态化系统化\n\n舆情相关理论和实践课程越来越受到重视，政府部门舆情应对和危机管理成为重要工作，党员干部的舆情素养不断提升。\n\
    \n2．网评员队伍建设初见成效\n\n部分政府部门为了合理引导网络舆情，开展了“红色大V”和网评员队伍建设，他们在重大舆情引导方面成效初显。\n\n3．自媒体联盟舆情引导力增强\n\
    \n政府部门与自媒体联盟建立良好关系，部分自媒体联盟在涉警涉医等舆情引导方面的能力不断增强，取得民众信任。\n\n4．网络舆情联防机制逐步完善\n\n各个政府职能部门之间、部门内部科室之间、政府民间互动层面，逐步形成全网联动联防机制，可以高效地发现问题，并迅速开展处置。\n\
    \n5．构建了合理的舆情应对流程\n\n部分政府部门在舆情处置层面，已经形成了事前评估、事中监测、事后总结的舆情防范应对处置体系，并且搭建了舆情信息收集平台，形成了立体化的舆情信息监控体系，舆情风险把关作用日益凸显，消除了潜在的舆情危机。\n\
    \n6．舆情处置追责力度不断升级\n\n为确保网络舆情做到平稳可控，政府部门多措并举积极加强和规范舆情处置工作，追责力度也在不断增强，倒逼处置人员审慎开展相关应对工作。\n\
    \n7．技术力量和人才储备双提升\n\n随着技术发展，舆情监测技术需求日益迫切，不少技术公司参与进来，舆情监测技术和数据量得到长足发展。此外，舆情处置和危机管理开始受到学界和业界重视，相应的舆情人才培养也逐步跟上。\n\
    \n（三）网络空间风险应对的困境\n\n1．意识层面\n\n舆情应对专业素养相对缺乏，主动开展舆情引导的意愿和能力相对不足，化危为机的意识和技巧明显不够，舆情回应文本过于公文化，缺乏人文情怀，不足以规避媒体负面报道，错失舆情处置的良机，舆情应对意识和能力出现严重的两极分化，层级越高的政府部门，舆情意识和动员应对能力较强，而基层政府部门无论是舆情意识还是应对能力都严重滞后。民本意识淡薄，官本意识革除不彻底，官僚意识导致舆情应对走偏。\n\
    \n2．制度层面\n\n虽然制订了相应的处置流程和响应机制，但空留纸面，许多好的应对方案和策略也仅停留在理论探讨层面，部分领导干部对待舆情仍然是“封堵删”思维，没有形成强有力的应对制度，并且追责机制也难正常运行，缺乏量化考核，也缺乏动真格的决心和勇气，消极处置往往不会被追责，因此滋生严重的“鸵鸟心态”。\n\
    \n3．技术层面\n\n政府部门配备了舆情监测技术，也有相应的人员从事舆情信息监测收集工作，但相应的技术水平仍然较低，能够监测获取的信息量比较有限，此外，部分地方政府部门和基层，资金支持相对有限，舆情监测技术力量薄弱，甚至主要靠人工完成，在互联网信息爆炸时代，技术投入不足，必然导致工作效率大打折扣。当前，部分政府部门几乎没有相应的技术人才，内容监测也难以实现数字化，舆情监测处置压力较大。\n\
    \n4．组织层面\n\n应对重大突发事件时组织架构较为松散，难以形成合力，缺乏专门处理网络舆情事件的常设机构或者小组，导致不同职能部门在紧急状态下无法实现畅通高效的沟通协调，在舆情处置时极易出现次生舆情灾害，各个相关利益部门难以做好协调，偶尔出现推诿扯皮的现象，严重损耗政府部门形象和公信力。另一方面，地方政府虽经常开展各类培训，但在舆情组织上，仍过度依赖主管领导个人决策，没有科学有效的组织原则和应对方式，如果领导不能及时参与处置，舆情应对基本处于瘫痪状态，倘若领导没有舆情意识，则舆情处置方案基本属于空谈。\n\
    \n5．技巧层面\n\n政府信息公开缺乏自信与自觉，新闻发言人制度空置现象严重。新媒体利用率不够，宣传方式、手段陈旧，新媒体运维能力有限，难以发挥信息公开的作用，舆情应对重删堵、轻疏通，对删帖方式重度依赖，因此导致民怨沸腾，舆情解释过多依靠官员和专家话语，说服力不强，需要邀请更多社会力量来参与舆情引导工作。舆情敏感度相对不足，要么反应过度难以决策，要么轻易放过导致问题持续放大。舆情处置手段相对单一，部分政府部门经验明显不足。\n\
    \n（四）网络空间风险应对措施建议\n\n1．舆情理论层面\n\n一是要求领导干部持续深入学习舆情理论，逐步培养和提升舆情意识和媒介素养，对国内外舆情态势和网络意识形态有正确的认知；二是注意从舆情应对实战中吸取经验，固化应对技巧，还要多开展交流，提升运用和应对媒体的技巧，学会和各类媒体及平台打交道，并且学习相应理论；三是注意借助外力来提升舆情应对处置能力，独立构建专家智库团队，成为领导身边的“智囊团”。\n\
    \n2．舆情实战层面\n\n一是注意在舆情应对前，先对舆情事件进行基本判断，需要提升舆情敏感度，能够自觉地把单个舆情事件置于整体社会心态、社会隐疾、国家重点工作等层面思考；二是注意把握舆情应对基本原则，做到稳妥高效、及时反馈、令行禁止；三是注意做好舆情回应工作，及时恰当回应舆论关切问题，快速处置舆情相关责任人，以平息网民负面情绪；四是在舆情应对过程中，注意修复政府形象和官民关系，畅通政府与民众的沟通渠道；五是信息发布和重大决策开展时，务必进行相应的比对和评估，尽可能减少舆情风险。\n\
    \n3．技术投入层面\n\n政府部门务必增加对舆情监测技术的投入力度，随着5G时代到来，信息传播的效率将会大幅提升，信息传播的渠道也会日益多元，这就需要监测技术也稳步增强，开发更为智能的舆情监测平台。在5G时代，依托人工进行监测已经不可能，面对海量的网络信息，唯有用更先进的舆情监测技术，才能在舆情处置应对中占得先机。\n\
    \n4．社会管理层面\n\n加大新兴媒体利用力度，与各类媒体形成良性互动；加强社会管理创新，鼓励网络议题多元发展，维护理性网络环境；用好政务自媒体，做好信息公开和释疑解惑工作，积极主动引导网络舆论，加大政务自媒体辟谣力度，及时发布真相，并且用好网络大V和自媒体联盟，扩散真实信息，形成网络舆情对冲机制；创新宣传方式、手段和内容；加强政府诚信建设，修复和提升政府公信力，打造阳光、透明政府；疏通正常民意反馈渠道，及时知晓社情民意。\n\
    \n5．制度建设层面\n\n建立网络舆情管理常态化机制，舆情应对机制不能只停留在纸上，而要落实在行动中；不仅要依靠主要领导决策，更要依靠科学的舆情应对策略技巧，并且形成相应的舆情处置常设机构，对各自为政的舆情应对进行统领和指导；畅通政府内部沟通机制，做到信息能够及时上传下达；多角度营造良好网络舆情环境，完善相应的法律法规，针对实际，地方政府也可以制定相应的网络管理法律法规，避免造谣传谣等违法行为造成的舆情误伤；形成联动处置机制，帮助涉事党政机关、企事业单位委托处置舆情，降低舆情对政府和地方形象的伤害；加大追责力度，处置不当就要问责到人。\n\
    \n## 7.5 “造谣一张嘴，辟谣跑断腿”\n\n在网络空间治理中，经常有一个现象，即所谓的“造谣一张嘴，辟谣跑断腿”。其意思是，造谣者只需要靠一张嘴，动动嘴巴，凭个人的判断和好恶就能编一个段子，甚至是谣言，网络谣言因传播的速度快和改头换面的频度高而超过任何“正能量”的信息。此时，为了平息谣言的社会危害，网络管理者则需要花更多的时间去辟谣、去纠错、去公布相关的内部信息，以阻止该谣言的传播。有学者指出，之所以出现这种情况，是因为官方机构干了自媒体应该干的活儿，而官方应在谣言出现之前及时发布公众所不了解的真实信息和权威信息，以提前阻止谣言的产生。一个是主动的行为，一个是被动的行为，后者总是处于疲于应对的窘迫境地。加之，海量的自媒体用户的存在，也给有限的管理提出了海量的问题，或是谣言。这种“造谣”与“辟谣”就成了永无休止的自媒体与传统媒体的博弈，最终会两败俱伤。\n\
    \n作为官方背景的媒体，其本位应当是充分地发挥其公信力的地位，及时、有效发布社会公众不了解或还未掌握的信息，及时澄清或解释说明某些公众迫切想了解的信息，及时对冲网络不实之信息，有效打消公众的疑虑。如此，方能破坏网络谣言生长的土壤和环境。\n\
    \n另一方面，在治理网络谣言的同时，我们需要维护或重塑自媒体环境本身的舆论自洁功能。网络是谣言的粉碎机，任何谣言在多源信息的交叉比对和真伪鉴别中都会最终露出狐狸的尾巴。\n\
    \n在不断提升自媒体用户辨识谣言的能力的同时，整体提升公众的理性表达能力和保护民众自觉参与社会事务的能力，大力提升民众的科学素养和是非辨别能力，营造良好向上的网络舆论环境，同时，切不能寄希望于普通的自媒体用户成为谣言的甄别主体。在某些谣言传播的场景下，大多数自媒体个体也是谣言的受害者。\n\
    \n## 7.6 亚文化现象引致的社会心理危机\n\n随着社会发展和自媒体的高度繁荣，公众的表达空间空前增大。政治主题、政治形式随之发生了巨大的变化。政治现代化的后果却是对传统国家政治这一公共权力中心及其权威地位的消解，一种被贝克称作“亚政治”（sub-politics）的新型权力场域逐渐取代议会政治，并开始在民主领域自动发挥功效，“政治现代化使政治和政治社会失势并获得解放”。\n\
    \n传统政治文化去中心化趋势不断被各类亚文化蚕食和鲸吞，并渐成社会气候和现代潮流。这为现代政治秩序带来了挑战，对某些高度板结和体系僵硬缺乏包容能力的政治治理体系来说，风险亦紧随其后，并显而易见。“草木皆兵”是对此类政治治理文化所面临的挑战和危机感最为形象和贴切的比喻。这种亚文化的盛行，能深刻引致社会大众心理的某些微妙且持久的改变。我们需要在开放乐观的心态中，包容并吸纳一切有益的改变，并提升现有政治治理文化的内涵，丰富政治文化的多元表达方式和多元政治参与的路径。\n\
    \n传统以法定政治体系为边界的政治受到挑战，政治体系被迫开放固有的传统边界，吸纳社会各种资源，从而解决变动世界中的各类政治和社会问题。政治文化可以分为政治心理倾向和政治价值取向两个层面，是一种心理—价值结构。政治文化的亚文化结构即一个社会的政治文化按社会结构的多样化的分解和组合：其一是基本的亚文化结构，如不同阶级的政治文化、在多民族国家中不同民族的政治文化；其二是具体的亚文化结构，如不同职业群体的政治文化、不同年龄群体的政治文化、不同区域群体的政治文化等。作为亚政治的“新社会运动”的勃兴也暗示着政治在变迁中继续转型和成长，政治变迁已不仅体现在政治体系内外政治资源与政治信息交往频繁而导致政治体系边界模糊，而且也体现为政治制度、政治结构的缓慢变革和位移。\n\
    \n社会运动与国家经济、社会政策存在周期性的循环互构，是社会运动社会的重要特征之一。当前欧美诸国总体上已进入社会运动阶段，在运动压力之下，其经济、社会政策普遍出现中左转向趋势，这给我国各类政治、经济生态带来了不可忽视的治理风险。需要在治理思想、治理实践以及国际环境层次上系统应对这些风险，并实现与欧美各国的互利合作和共同发展。\n\
    \n西方新社会运动是当代西方社会结构和阶级关系变动的产物。这一运动强烈地冲击了传统的政党政治，萌生了去阶级化的“中性政治”。这种“新政治”迫使以阶级政治为基础的西方主流政党顺应形势，采取中性化的改革措施，转变执政理念和执政方式。\n\
    \n网络加速了现代亚文化的盛行，并在潜移默化中深刻改变着传统的政治文化和社会文化格局。\n\n亚文化的兴起，是社会传统权力去中心运动的过程，一个权力平均和再分配的过程。这种由社会个体和各类利益联合体共同推动的过程必将导致后现代社会各类现有社会框架出现松动，并消解传统的桎梏，重构当下和未来新型的后现代社会形态。\n\
    \n\uFEFF\n\n# 第八章 现代新技术体系潜在社会风险\n\n## 8.1 大数据、5G以及人工智能技术带来的风险\n\n5G技术的全面应用，将改变人们的交流模式，以更加急速、跳跃、分散的形式影响人们对时间和空间的感知，地域、场景的空间真正瓦解，空间被极度压缩并且不再成为人们交流的桎梏。\n\
    \n据统计，未来全球移动通信网络连接的设备总量将达到千亿规模，预计到2021年，全球移动终端（不含物联网设备）数量将超过100亿台，其中中国将超过20亿台。无论是在偏远地区、高速移动等恶劣环境下，还是在人员密集、流量需求大的区域，人们仍然能运用移动设备来进行远程交流与沟通。5G技术不仅会缩短人与人之间的时空距离，同时还将加速信息传播形态的变革。未来的信息传播形式将更加具象、直接、多维和动态，移动视频通信将成为人们的首选通信方式。5G时代，人们获取信息的速度大大提高，信息采集、传播的速度和规模达到空前水平。卫星互联网也会助推消除地域空间的隔阂，让信息传播抵达每个角落，由于其传播的广度和速度，卫星互联网和5G共同打破传播的时空限制，民众之间的互动交流将更加便利。\n\
    \n随着国家互联网综合治理体系的不断完善，无论是基于互联网本身的法律法规，还是对相关人群、相关领域的立法方面，都将不断深入并细化，并对互联网企业及平台的相关产品产生直接影响。如2019年年初国家接连出台了《网络短视频平台管理规范》《网络短视频内容审核标准细则》，直指网络短视频运营平台，随后对国内各短视频网站进行了集中整治。而近期围绕未成年人保护法修订草案，多位全国人大常委会组成人员指出，网络短视频对未成年人的影响非常大，在危害程度上比网游更甚，建议修订草案对此加以监管。该提议引发了社会的热烈讨论，一旦通过，对短视频平台将产生直接影响。\n\
    \n从网络监管角度分析，不断出现的网络新名词给监管带来了难题。个别新词出现的背后，都是基于相应事件或代表着某种社会情绪，是群体诉求的集中反映。而网络短视频平台无疑是众多网络热门词汇的发源地之一。其核心之一的二次元人群也有着独特的交流方式及语言体系，特别是在其视频产品的“弹幕”中，可能会出现用户群体对突发事件、公众人物、社会现象等方面吐槽或质疑，并通过独有的表达方式及词语进行“群哄”，这一点，无论对平台运营方，还是网络监管部门，都将是一个挑战。随着国际文化交流的不断深入，境外文化向国内输入的情况愈发明显。但需要重点关注的是，带有明显国家指向、民族或种族符号的文化产品具有一定的政治敏感点。以发端于日本并在国内视频平台开设账号的虚拟主播“绊爱”为例，从近两年国内舆论场的特征来看，反日情绪仍是一个不可触碰的高危敏感点。毋庸置疑，“绊爱”无论从产品的开发，还是文化理念，甚至是人为赋予的行为习惯，都与日本文化息息相关。在网民评论中，对于“绊爱”产品的日本文化倾向的吐槽也较为明显，特别是在一些重要的节点。如此前“绊爱”官微在7月6日推送一条微博，内容为“你知道明天是什么日子吗？亚洲部分地域的大家都很熟悉吧”，网民在微博留言“卢沟桥事变”“七·七事变”，虽然微博内容初衷只是想与用户们讨论下“七夕节”，不过由于缺乏本土化的知识，没有注意到中国过的七夕是农历七月七日，但此事也反映出了该产品所潜藏的政治风险点，且容易与“爱国”“中日关系”“精日”等问题相关联。"
