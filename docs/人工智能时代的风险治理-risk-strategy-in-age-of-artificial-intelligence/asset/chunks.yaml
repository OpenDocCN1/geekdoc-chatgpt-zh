- raw: '在应对地震灾害方面，国家制定了《防震减灾法》，规定了地震监测预报、地震灾害预防、地震应急、震后救灾与重建、法律责任等制度。配套的《破坏性地震应急条例》进一步明确了应急机构、应急预案、临震应急、震后应急、奖励和处罚等制度。因严重破坏性地震应急的需要，可以在灾区实行特别管制措施。


    在应对事故灾难方面，随着国家经济的高速发展，生产安全事故也呈多发态势，给人民生命和财产带来极大威胁，也严重影响了经济社会的健康发展。为此国务院制定了《生产安全事故报告和调查处理条例》，对于生产经营活动中发生的造成人身伤亡或者直接经济损失的生产安全事故的分级、报告、调查处理、法律责任等方面作了规定。同时还制定了《放射性同位素与射线装置安全和防护条例》，在环境污染事故、核设施事故、国防科研生产事故的报告和调查处理方面也分别作了规定。在火灾预防方面，国家制定了《消防法》，规范了消防组织、灭火救援、监督检查、法律责任等。此外还有《建筑法》，国务院《矿山安全法实施条例》《关于预防煤矿生产安全事故的特别规定》《煤矿安全监察条例》等。特别是在《国务院关于特大安全事故行政责任追究》中，规定地方人民政府主要领导人和政府有关部门正职负责人对特大安全事故的防范、发生有失职、渎职情形或者负有领导责任的，给予行政处分并依法追究刑事责任。此外还有国务院《建设工程质量管理条例》《工伤保险条例》《劳动保障监察条例》《建设工程安全生产管理条例》等。


    在应对公共卫生事件方面，国家制定了《传染病防治法》，明确国家对传染病防治实行预防为主、防治结合、分类管理、依靠科学、依靠群众的方针，建立健全传染病防治的疾病预防控制、医疗救治和监督管理体系。国务院制定了《重大动物疫情应急条例》，规定重大动物疫情，按照属地管理的原则，实行政府统一领导、部门分工负责，逐级建立责任制，并具体确定了应急准备、监测、报告和公布、应急处理、法律责任等制度。此外，国务院还制定了《传染病防治法实施办法》和《突发公共卫生事件应急条例》等法规文件。


    在食品安全方面，国家制定了《食品安全法》，规定了食品安全风险监测和评估、食品安全标准、食品生产经营、食品检验、食品进出口、食品安全事故处置、监督管理、法律责任等制度。此外，还有《动物防疫法》《国境卫生检疫法》《进出境动植物检疫法》，国务院的《植物检疫条例》《国境卫生检疫法实施细则》等法规文件。


    在应对社会安全事件方面，国家制定了《集会游行示威法》，规范了在露天公共场所或者公共道路上以集会、游行、静坐等方式，表达要求、抗议或者支持、声援等共同意愿的活动。此外，还有《民族区域自治法》《人民警察法》《监狱法》《中国人民银行法》《商业银行法》《治安处罚法》《刑法》，国务院的《信访条例》《企业劳动争议处理条例》《行政区域边界争议处理条例》《营业性演出管理条例》等法规文件。


    这些法律法规确定的应急管理基本制度与中央政府部门制定的应急管理规章，省、自治区、直辖市及较大的市制定的有关政府应急管理的法规规章共同构成国家应急管理制度体系。


    ## 5.3 中国应急管理制度的短板和不足


    （一）中国应急管理制度的特点


    在长期的应急管理实践中，我国逐步形成了由国务院统一领导，分部门按类别处置各类突发公共事件的应急管理制度。这些形成体系的制度有以下特点：


    1．统一领导、分工负责


    我国应急管理的最高机构是国务院，由国务院领导，并授权国家应急管理部，负责落实各类突发事件的预防和处置工作。国务院办公厅设应急管理办公室，履行值守应急、信息汇总和综合协调职责，统一指挥和协调各部门、各地区的应急处置工作。


    2．分级管理、条块结合


    按照突发事件的规模和范围实行分级管理。而对由地方为主处置的突发事件，国务院各部门应给予指导、协调和帮助，实行条块结合管理。


    3．部门应急形成体系


    国务院承担直接处置突发事件职责的部门，均设有相应的应急指挥机构、信息通信系统、防灾设施装备、应急救援队伍，建立了监测预报体系、组织指挥体系和救援救助体系。


    （二）中国应急管理工作中的不足


    在突发事件应对处置实践中，各级政府充分发挥了组织职能，应急管理水平迅速提高，但同时也存在一些不足。具体表现为：


    1．职能分工不够清晰


    首先是条块应急管理职权划分不够清晰，职责分工不够明确，造成在实践操作中常常出现部门间协调困难、行动衔接配合不到位等问题；其次是地方属地化管理的责任和授权不足，在应急实施中难于运行。


    2．综合性风险评估机制薄弱


    以部门为基础的监测体系和风险评估较为有力，但因综合性的风险评估和趋势预测有所不足，缺乏科学的风险评估指标，也未形成风险评估指标体系。


    3．政府及部门信息沟通机制运转不畅


    目前我国还存在应急信息报告的标准、程序、时限和责任不明确、不规范等问题，信息系统之间相互分割，缺乏互连互通和信息资源的共享，综合性信息分析和综合性信息平台建设有待加强。


    4．社会参与制度化程度不高


    我国对全社会的应急教育、培训、演练、救灾善款的募捐和社会志愿者参与应急救援等均无系统法律，缺乏设计具体措施和要求，不利于实际操作。


    ## 5.4 应急管理态势感知及协同平台体系建设


    随着社会的不断发展与进步，社会矛盾呈复杂化、多元化的趋势发展，当前我国公共安全形势严峻复杂，社会公共安全事件、群体性事件、工程安全事故、突发自然灾害以及社会保障问题频繁发生。快速发展的现代化进程使得各种风险并存，公共安全形势面临着前所未有的挑战。随着经济和互联网的快速发展，我国的应急管理也在不断发展中。全球生态环境的恶性发展使得社会大众对灾害更加敏感，随着社会经济的发展，人们不得不考虑如何才能减少由此带来的负面效应。在对灾害的防控过程中，各种技术也在不断发展，包括信息技术、通信技术、物流及生产技术都使灾害控制上升到了一个新的阶段。建立应急管理大数据信息化监测预警平台是大势所趋。


    同时，国家应急管理部也提出要牵头规划建设全国应急管理大数据应用平台，且其已被纳入发展规划中。应急管理的发展不是一蹴而就的，在其发展过程中也面临着巨大的风险和挑战。加强应急基础信息管理，整合各方资源，推进信息共享共用，对强化灾害事故风险和隐患监管，提升安全生产和综合防灾减灾救灾水平，推动形成统一指挥、专常兼备、反应灵敏、上下联动、平战结合的中国特色应急管理体制，有效保障人民群众生命财产安全和社会稳定具有重要作用。


    第一，有利于提升应急智能预测预警水平，最大程度预防和减少灾害事故造成的人员伤亡和财产损失。第二，强化应急指挥辅助决策，有力保障应急指挥决策的科学高效，支撑构建科学完备的监管体系，努力实现对灾害事故风险和隐患的全领域、全方位、全过程管控。第三，有利于及时掌握灾害事故线索和可能造成人员伤亡、重大财产损失的苗头性、趋势性、敏感性信息，确保及时发现灾害事故并迅速开展处置，第一时间报送灾害事故信息，切实提升应急信息协同及相关信息的收集能力。


    针对我国应急管理大数据信息化监测预警平台的建设及相关方面进行研究，针对应急管理的不同突发事件及灾害事件的类型研究，除了要对我国整体的应急管理大数据信息化监测预警平台进行研究外，还要从各地区、各有关部门、各行业企业应急管理大数据信息化监测预警平台建设的相关方面进行研究。从应急管理涉及的不同的范围来讲，宏观上从构建一体化全覆盖的全国应急管理大数据应用平台建设入手，建设主要包括自然灾害风险综合感知与预警平台建设工程、生产安全实时监测预警监管平台建设工程、应急管理全媒体矩阵建设工程等。


    第一，构建一体化全覆盖的全国应急管理大数据应用平台，这部分主要从宏观角度进行研究。依托国家数据共享交换平台体系，充分利用大数据、云计算、物联网等技术，实现重大风险和隐患在线监测、超前预警预报和灾害事故高效处置。各地区、各有关部门、各行业企业要在加强自身信息化建设、健全完善相关系统的基础上，将本地区、本部门掌握的安全生产、自然灾害防治领域的风险和隐患信息以及灾害事故信息逐步接入。


    第二，风险态势感知与预警平台建设工程主要针对各类风险灾害综合感知与预警体系建设。自然灾害具有不确定性、突发性、灾难性等特征，而对自然灾害进行风险综合感知，利用大数据对相关的数据及特征进行分析，就能够对该类事件提前预警，能够最大限度地减少自然灾害带来的破坏及二次灾害。同样，各类社会风险也具有极强的不确定性，此类风险的情报搜集和信息处理以及预警和决策支持能力建设同样至关重要。


    第三，生产安全实时监测预警监管平台建设工程，该部分主要针对生产安全实时监测预警监管进行建设。近年来，各类安全生产事故频发，给人民带来巨大的人身及财产安全威胁，建立生产安全实时监测预警有利于提高生产安全类事件的安全性，有效降低风险的发生概率。


    第四，应急管理全媒体矩阵建设工程。针对全媒体时代下的政府话语权引导、全媒体参与应急以及全媒体矩阵的形成等方面进行建设。对接入全国应急管理大数据应用平台的信息，按照预警级别、紧急程度、发展态势和可能造成的危害程度发布，及时利用全媒体矩阵发布传播应急基础信息，实现风险治理全媒体矩阵的能力最大化。


    ## 5.5 应急管理态势感知系统技术实现


    一个典型的应急态势感知包括以下几个部分：


    第一，基础设施层。整个系统的底层是信息系统的基础设施，这包括网络及通信设施、主机服务器及存储系统、视频会议系统、可视化大屏调度系统，以及大数据环境、操作系统环境、数据库管理系统及网络通信基础设施等，这些是系统最基本的运行基础。


    第二，数据中心。数据是整个系统的基础，基础数据经过采集、处理、标准化、传输、存储，形成系统资源库，为系统提供了高效的业务分析、决策、交换、共享的数据环境。主要包括以下数据库：模型数据库、知识数据库、方法数据库、预案数据库、人口基础数据库、灾情数据库、地理信息空间数据库、基础字典数据库、资源数据库。初步实现应急指挥系统基础架构和数据整合，并在GIS平台上整合部门安全生产及应急业务信息接口。


    第三，资源整合。应急指挥需要多部门、多系统联动配合，如果彼此孤立，不能实现信息共享，就会形成“信息孤岛”，造成缺乏可比数据、缺乏分析、缺乏管理。难以获得全面的业务信息，就会影响业务和决策的效率和准确性。通过提供应用整合服务、业务整合服务、数据整合服务连接相关职能部门的系统、业务、数据，最大限度地解决信息孤岛问题，最大限度地利用现有的数据资源。


    第四，应用支撑层。应用支撑层的设计直接影响系统的稳定性、安全性及可靠性等重要因素，我们凭借多年的软件开发经验，采用低耦合、高内聚的设计思想，基于开放的标准在该层部署应用部件，为系统高效、可靠的运行提供保障。包括：决策支持系统、业务支持系统、GIS引擎、工作流引擎、全文检索、消息中间件、信息推送、内容管理、用户管理、权限管理、通用数据接口。


    第五，应用层。系统根据突发事件应急的特点，综合各种数据信息及处理软件，提供辅助会商决策系统、数据收集与管理系统、信息处理与分析系统、资源管理系统、信息发布系统等应用系统，并可根据需要，快速地扩展业务系统。应急指挥平台资源和应用建设上可完成在GIS平台上完善与相关安全生产及应急业务信息接口，并预留与其他部门应急指挥系统信息应用整合的接口。


    系统特点及特性要求：


    第一，充分利用云计算、大数据架构服务层的SaaS（Software as a Service）软件即服务、PaaS（Platform as a Service）平台即服务、IaaS
    （Infrastructure as a Service）基础设施即服务，实现虚拟化技术，以实现对不断增长的数据和各部门应用支撑服务进行模拟，以降低共同的硬件的投入，以及软件的费用，来实现廉价的方案。


    第二，通过将现有系统云化，建立基于云计算的应急指挥平台系统也是“资源共享”“统一指挥”的进一步提升。


    第三，通过云计算和虚拟化框架搭建平台。在这种模式下，应急平台可以自动地管理和动态地分配、部署、配置、重新配置以及回收资源，也可以自动安装软件和应用，从而实现快速高效、动态优化的应用、开发平台等计算资源分配，在某个项目结束后，应急平台可自动回收资源，充分发挥平台计算能力。


    第四，利用大数据和云计算的特性，平台的数据中心可以集中分散的计算资源，为各种应用提供动态使用的计算平台，为未来的业务扩展提供保障，减少重复建设和无效建设，有效降低政府公共财政投入成本。


    ## 5.6 风险治理态势感知传统实现方法


    网络舆情，即网络空间所承载的社会情绪的集合，是来自网络的风险。“舆情”本是社会学的概念，现在广泛应用在网络及传播学的概念当中，指在一定的社会空间内，围绕中介性社会事件的发生、发展和变化，作为网络主体的社会民众对作为客体的社会管理者、企业、个人及其他各类组织及其政治、社会、道德等方面的取向产生和持有的社会态度，是较多人关于社会中各种现象、问题所表达的信念、态度、意见和情绪等表现的总和。从当下的舆情研究，特别是智库对舆情的研究看，很多人已不是在严格意义上讲舆情本身，不是对民意规律的发现，而是侧重在对民意之于执政者及其政治破坏性的研究。


    风险决策算法是对风险因素准确、完整、实时的捕捉和分析，是一系列解决矛盾和问题的清晰指令集。在社会治理中，这些决策算法表现为系统揭示解决问题的原理、机理、策略和机制。在风险决策的态势感知进程中，其主要归结为找到并用好“算法技能”。不掌握这种风险决策算法模型，意味着丧失了“算法权和决策权”。在国家经济社会对于风险预警算法的依赖不断加深的背景下，算法不但是人工智能的基础性技术之一，也表征为一定的数字权力，在对风险研判、公众意见感知、社会治理需求回应、公共政策议程设定、政府部门及官员绩效评估等方面都有着明显的公共权力的属性。


    应急管理科学化程度高低取决于算法的水平高低，同一突发事件可用不同算法处置，而某个算法的质量优劣将影响到算法乃至程序的效率。在借助人工智能进行应急管理时，其决策是否正确、迅速，救援能不能有序、高效，关键就在能不能选择合适的算法和随时改进算法。对于应急管理能力的评估，实质就是算法技能的评估。提升应急管理算法能力，需要还原安全的本义，强化算法的意识，创新智能的方式，而这些都有赖于深入研究突发事件的机理以及应急管理的机制，排除附加在应急管理中的过度要求，提供适度公平和合理可行的公共安全服务。


    ## 5.7 网络舆情风险治理的认知困境


    社会管理实践孕育了应急管理理论。2003年中国遭遇了突如其来的一次“非典”疫情，政府应急管理的研究提上议事日程。由于开辟了新的研究领域，因此以非常态管理为范式的应急管理得以确立，与传统的公共行政、公共管理、灾害管理及自然科学相关的学科剥离，独立出来，“自立门户”，成为广义公共管理学科中的一员。应急管理理论找到了新的研究对象，引入了新的研究方法，实现了研究视域和方法论的创新，拓宽了政府管理、社会管理、国家行政管理研究的内容。但是，随着社会发展、管理转型、信息革命，人们身处其中的主客观世界发生了极为深刻的变化，社会呈现出高速度、高精度、高复杂性等现象，导致国家行政决策的难度巨大—常态管理与非常态管理的边界在哪里？先前的常态与现今的危机之间只有一念之差，于是，便在决策领域开始“泛应急化”，有时候还冠以源头治理、预管理等名义，增加了应急管理的“领地”，出现了滥用应急、过度应急的现象。舆情应对中有时就会出现这类过度应用应急管理的现象。应当承认，现代舆情不是传统意义上“舆论的情况”的简称。在一些地方实际应对舆情的工作中，存在着将舆情概念贬义化的趋势，使得舆情成为风险、灾难、危机的代名词，把“舆情应对”当作应急管理的一个分支。这种对舆论场中任何风波，包括民众对国家政治的看法、意见和态度，对社会问题的看法、意见和态度，对任何与执政者发布的政策、决策不同的声音都定性为不满表达、否定性态度、负能量的认知态度，使得一些有价值的信息难以得到释放，群众中的“事前诸葛亮”被封杀，这也成为不少地方领导同志“谈舆色变”的原因。如果按照这样的理解，那么多数“舆情”都需要进入应急管理的研究领域。


    “现实社会中的多数事态从普通的风险发展为危机的可能性是存在的，那是不是对所有的风险都要运用应急管理的手段呢？显然是不对的。这样做，在实践中对政府舆情管理的公信力是一个摧残，管理者的执行力也难以提高。”[\[1\]](#Chapter_9_7.xhtml#B13)


    在政府了解民情民意方面，舆情管理具有重要意义，这使管理者能够从管理中及时得到有用的信息资源，能够从群众中汲取智慧力量，服务于决策和执行。当前出现的网络舆情放大效应，从一个侧面表明我国改革开放以来不断扩大社会主义民主，并取得了积极的成果。加强舆情管理同样是为了推动当代政治建设、发扬民主的重要形式和渠道。如果把这方面的功能与应急管理加以混淆，这无异于堵塞了言路，切断了一条新的政策咨询渠道。同时，舆情对于决策的作用具有辅助性特点，要防止决策者被舆情“绑架”。


    舆情管理是化解风险和处置危机的防范性工具。针对舆情的应急管理与通常的应急管理有着本质的区别，在体制结构、运行机理、处置方式等环节所借助的资源和手段都有特殊的规律。重大舆情应急管理主要通过技术监测与预警、内容分析与评估、政治传播与终止、法治保护与惩治等管理措施，赢得时空上的优势和话语权的掌握。由于人类进入风险社会，以及中国尚未完成经济社会大转型这一大背景，对舆情实施应急性的系统治理、主动治理、动态治理是必要的，但这样做不是将应急管理作为舆情管理的终点，而恰恰相反，是将其作为起点，依托突发事件中聚集民意的政治场景，将应急管理转化为社会风险治理和公共危机治理，使之融合为国家治理的有机组成部分，成为风险战略管理的重要工作之一。


    通过分析国家治理与应急管理的关系，可以更为清晰地看到应急管理制度的优劣，进而运用法治的力量推动制度优势向管理效能转化。通过分析公共管理、行政管理与应急管理的关系，可以明确公共安全的定位，有效开发和储备应急管理工具，解决应急管理中的技术难题。


    “分析社会舆情与应急管理的关系，有助于矫正某些过度反应的认识误区，从宏大的马克思主义真理、民族复兴愿景、以人民为中心的工作理念源头，形成舆情管理的破竹之势，这就是新时代应急管理应当重视的‘法、术、势’。”[\[2\]](#Chapter_9_7.xhtml#B14)


