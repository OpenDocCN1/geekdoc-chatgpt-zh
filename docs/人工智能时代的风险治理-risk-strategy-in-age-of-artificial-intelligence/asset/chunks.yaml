- raw: '多个行业已经在区块链应用层面发力，有些应用甚至已经开始落地。比如，在金融服务、医疗健康、IP版权、教育管理、社会管理、文化娱乐等领域，基于区块链技术的解决方案正被提出和运用。去中心化、不可篡改、可追溯等特性，在新时期为我们构建了一种更为可靠、更加自主的协作范式，让我们依靠算法、机器和协议形成了良好的信任机制，必然成为降低信任成本、保证信息安全的最优选择。


    （二）区块链给网络舆论治理带来的影响


    1．正面积极作用


    （1）确保数据真实性，避免人为篡改。区块链技术可以提供一整套追踪信息来源的解决方案，从而实现媒体信源认证，最大可能地保证数据真实性。使用区块链技术发布的信息在被加密的同时，共享到多台个人计算机上，第三方机构很难进行篡改，而整个信息记录过程，可以很好地纠正报道者的刻板印象和媒体偏好。


    （2）确保信息安全性，抵御多方力量干预。区块链技术让信息不可篡改，保证信息数据的安全性，即使存在政治、商业和技术等力量的干预，也能保证信息的安全性，避免信息易逝性消解，这些不会让信息出现偏差疏漏，进而影响受众的认知判断。


    （3）保护版权，打击谣言。区块链技术可以很好地保护版权，能以数字签名和哈希算法对内容版权进行精准跟踪，从确权、用权、维权三个环节完整记录内容版权流转过程，相关应用已经展开，这有助于解决当前内容管理领域普遍存在的版权问题。而内容可追溯，则有助于打击网络谣言。


    （4）提升内容交易效率，解决媒体经济危机。严肃权威媒体机构不仅遭遇信任危机，更遭遇收入来源枯竭导致的经济危机，影响力逐步下降，这对于网络舆论塑造无疑是不利的，而利用虚拟货币可以帮助媒体获得新的众筹商业模式，通过智能合约提升内容交易效率，寻求新的发展机遇。


    （5）化解传播数据偏差，避免舆论恶意操控。在当前传播格局下，传播数据不透明，存在偏差现象比较普遍，很多数据难以被掌握，客观上导致网络舆论易被干扰和影响，真实的民意难以呈现，评论遭删除、网络水军等舆论恶意操控现象时有发生，区块链技术可以溯源、保真，能避免舆论操控。


    2．负面消极影响


    （1）敏感信息创作和网络上传难以控制。在传统互联网中，敏感言论等信息创作和上传，可能会受到网络的限制，对敏感词和话题均能进行有效监管，而在区块链技术下，敏感信息创作和上传拥有了避风港，区块链特性将让这些敏感信息传播处于失控状态。


    （2）信息审查难以开展，处置机制失效。去中心化特性，直接将中心化集中管理模式击溃，信息审查基本难以展开，而数据不可篡改、匿名性，则让审查处置处于失效状态，及时通过技术手段能够追溯到源头，甚至做到匿名用户与现实用户关联，也难以对信息数据进行删除或者篡改，处置难以进行。


    （3）保留全量数据链条，负面信息长期存在。当前传播常态是随着时间流逝，信息也在加快消解，但区块链技术将彻底扭转这种现象，信息将保真、安全地固存下来。这就意味着负面、有害、敏感的信息将长期存在，只要愿意查询，就能看到这些信息源和传播情况。


    （4）不实信息难以澄清，辟谣纠偏效果有限。去中心化、不可篡改等特性，让不实信息很难得到澄清，即使可以很快溯源，但由于难以删除，辟谣内容难以覆盖到目标群体（已阅读谣言者），这会导致谣言负面影响持续下去，即使辟谣成功，由于不实信息难以删除，后续影响仍然存在。


    （5）由小众走向大众化，管理机制恐将迟滞。在当前技术条件下，区块链信息是通过链接到社交媒体的方式来传播，在传播领域的影响较小，尚处于小众化阶段。但该技术运用非常简单易学，也有人在开发上传小程序。随着黑客、极客、宗教、政治、社会组织的介入，一旦技术成熟，借助重大事件就会全网科普、迅速传播，网民就能在区块链上完成信息生产、传播全过程，区块链会在传播领域，由小众向大众化挺进，而对技术的管理，往往难以做到及时有效，而可能到来的监管真空期，带来极大的不确定性。


    （6）匿名性造成失序失范，导致管控无法展开。区块链的匿名性显然比传统互联网的匿名性更为复杂，涉及非对称加密算法等技术，对于个人而言，这能保证较高的安全性，但对于管控而言，这无疑会造成失序和失范，由于技术难以对应到现实中的发言者和传播者，利用严管敏感或犯错（罪）群体，用约束这类群体的言行，来倒逼实现区块链管控的方式将无法展开。


    （7）自组织社区大量出现，跨区域跨境组织管理难。每一个区块链组织实质上就是一个自组织机构。大量私有链的产生就形成了大量自组织机构，这些机构把组织规则写入了区块链中，保持了组织规则的有效性和机密性。这些技术若被犯罪团伙、涉黑组织、宗教机构、政治组织利用，将对社会稳定产生隐患，甚至有颠覆政权的危险。


    （三）区块链发展策略


    1．开展技术监测及分析工具研发


    交易产生及区块链创建，对于外部人员虽然是不可修改、匿名，难以防范，但通过技术手段，可以实现及时抓取、及时解读，从而达到及时掌握。尤其对于已经形成规模，产生了全球性影响的比特币、以太坊、博雅数据等，可实现全数据抓取入库，在开发相关技术的基础上，基本可以实现主要数据的监测和预警，并且通过对交易、流转数据的监测，建立风险人群（技术、言论、商业等）数据库。


    在此基础上，结合互联网信息和通信技术，可以尝试对匿名用户与实际用户的关联（欧美国家已有成功案例），结合社交网络行为轨迹、社会关系，分析研究其现实活动行为，从而达到“暗网—明网—现实”的结合，以至现实管理。


    2．确立“以技术管技术”的工作宗旨


    在高度重视的基础上，要开展相关技术和应用的专项研发，开展“技术监管技术”的开发研究，不仅要做到“我知道”，还要力求“我专业”，并且“我可以”。紧密把握区块链整个技术发展过程，尽早规范区块链运行和使用。像对待其他互联网产品一样，对区块链产品的运行规则和技术标准、产品标准等，及早研究介入，适时推出国际标准，抢占先机，争取主动。


    着手相关法律法规的制定，有计划、有跟进地开展相应的监管体系建设。目前，区块链分为链圈、币圈。链圈主要集中在技术的开发与探索，而币圈已被别有用心者用在了黑恶交易、金融诈骗等行为。除国内已被破获的案例之外，更多的是跨国跨境犯罪行为，着手法律法规设计已迫在眉睫。


    3．政府“上链”，参与节点建设和社区维护


    “上链”不仅意味着“知情权”和“运营权”，也意味着管理权。随着技术的成熟与普及，个别行业、企业上链已正在进行中，由于管理界限不清，技术学习有一定难度，掌握的积极性不高，加之区块链所造成的现实麻烦尚未突显，许多部门还没有足够重视。


    以算力、存储、监控等角色参与区块链的构建，探索合适的参与角色和管理机制。在充分重视的基础上，政府尽早介入，除取得技术主动权外，还可以评估区块链的发展过程，把握“自组织社区”的发展规律，优先布局，取得先发优势，避免区块链借重大事件爆发时，主管部门和管理者找不到阵地，措手不及。


    ## 8.5 网络及信息领域安全风险


    网络安全从其本质上来讲就是网络上的信息安全。从广义来说，凡是涉及网络上信息的保密性、完整性、可用性、真实性和可控性的都属于网络安全领域，如个人信息泄露、病毒入侵导致系统瘫痪、非法有害信息肆意传播、程序漏洞等安全问题，互联网的开放性使这些问题不断地出现并影响网络安全环境，为网络安全的维护带来了许多困扰。习近平总书记在中央网络安全和信息化领导小组第一次会议上提出了网络强国战略思想，指出互联网等信息网络已经成为信息传播的新渠道、生产生活的新空间、经济发展的新引擎、文化繁荣的新载体、社会治理的新平台、交流合作的新纽带、国家主权的新疆域。当前，我国正处于全面建成小康社会决胜期，挑战与机遇并存，必须要加强防范网络安全风险，提前识别并及时化解风险，做到居安思危，确保网络环境安全、健康发展。


    （一）网络信息领域存在的安全风险问题


    1．网络信息安全立法滞后


    由于信息技术的快速发展，与社会多方面的快速融合，大量的信息在互联网上进行流通传播，这在为社会生活提供诸多便利的同时，不可避免地会侵犯到他人的合法权益，甚至在意想不到的情况下，威胁就已经出现了，一旦发生，常常措手不及，造成极大的损失。因此，互联网的发展带来了诸多新的国家安全问题与社会问题，现阶段诸多网络信息安全问题与犯罪，如国家机密泄露、个人隐私泄露、网络诈骗、电信诈骗及更多新兴网络安全问题、社会问题均与现行的网络信息安全立法制度不健全、不完善密切相关。


    互联网诞生时，由于缺乏对互联网开放性的限制，世界各国并没有构建明确的网络安全法律法规体系，至今尚无可借鉴的网络安全立法经验，加之我国立法滞后、立法过程冗长，现行的信息网络安全法律体系难以适应信息技术发展的需要，以及日益严峻的网络安全问题，以上均是形成此风险的重要原因。


    2．缺乏指导性政策，部分技术领域网络信息安全缺少明确的评价标准


    随着计算机技术的迅速发展，在计算机上处理的业务也由单机的数学运算、文件处理、办公自动化等发展到基于复杂的内部网、企业外部网、全球互联网的企业级计算机处理系统和世界范围内的信息共享和业务处理。但在信息连接、流通能力提高的同时，基于网络连接的安全问题也日益突出。虽然我国已经提出尽快在网络安全维护的核心技术上取得突破、统筹网络安全基础设施建设，并加强了对关键性基础设施、关键性进口技术产品的审查工作。但审查范围只涉及国家重大工程和核心关键部分的进口技术产品这些领域，由于信息技术、信息网络已经逐步渗透到各行各业、各个领域之中，而我们的技术审查工作并不能全部覆盖所有信息技术领域，这无形中加大了网络安全的风险隐患。虽然全国信息安全标准化技术委员会提出的《信息安全技术云计算服务安全能力评估方法》等8项国家标准相继出台实施，但其中缺少对网络信息核心技术安全审查指导性政策，尤其是相应技术评价标准的制定。目前，各行各业在审查过程中各自采用自己的标准，缺乏统一性，这必将带来重大的网络信息安全风险隐患，需要尽早化解。


    3．对大规模社会工程爆发的风险隐患缺乏必要的防护措施


    社会工程，是指以人为攻击对象，对信息系统进行掌控与利用。黑客借助进化给人们带来的个体固有思维模式和群体协作模式，辅之以情绪化的反应，达到不可告人的目的。以往社会工程的目标，大多局限在经济利益范畴。但是，近年来，我国计算机技术发展速度飞快，互联网技术的使用已经深入到生活的方方面面，如四大骨干计算机系统网络已经建成，电子商务系统已经开通，学校校园网已投入使用，手机支付的普及，电商规模的扩大等，都出现了前所未有的规模化创新，将整个社会结合成了一个由人与技术紧密联结的巨大生态网络环境。然而许多互联网技术应用系统却始终处于防不胜防的状态，或者即使采取一定的防护措施也不见得非常有效。在这样的背景下，基于多方面领域的利益驱动，大规模社会工程事件的集中高强度爆发这一安全隐患随时可能出现。


    4．数据长期安全保存战略缺失


    随着大数据时代到来，国家政府机构、科研机构、企业、学校等多种类型组织在其治理、监管、科研、运营的过程中，产生并存储了海量数据资源。信息网络资源已经成为影响和决定社会发展的一项重要战略资源，也是衡量一个国家综合实力的一项重要标志。


    这些海量数据在各类组织履行其职能过程中发挥着重要价值，各类组织均制定有规范的数据保存制度，但更多还是停留在短期（5～10年）的保存，而缺少基于战略角度的长期保存机制。


    这些作为人类文明发展阶段的重点、战略资源的数据如果得不到长期的有效保存，一方面，将会存在人类文明记忆缺失的重要隐患；另一方面，其潜在战略价值将会得不到利用，进而可能给我国长期国家治理、社会安全带来重大潜在隐患。


    5．缺少网络信息安全的高效协调联动机制


    我国网络信息管理体制实行的是条块状的系统管理体制，各个行政机构负责自己单位的网络信息安全管理，因而整个网络信息安全管理一直处于一个分散化的状态，缺少统一的、专门的具有高度权威的网络信息安全管理机构，这就导致了既不能大范围地对网络安全进行监管，防患于未然，又不能及时发现安全问题，立刻有效解决，如境外情报机构黑客的恶意攻击和网络病毒大规模的侵害，这类大型网络安全问题仅仅靠各机构去自行监管、自行处理，是远远不够的，一旦造成大规模网络系统瘫痪，甚至会危及国家安全，只有建立一个专门的网络信息安全管理机构，才能有效地协调各部门之间的网络信息安全工作，才能制定相关政策，实施重大决策，保证网络信息安全防范工作的有效开展。


    （二）网络信息风险防范


    面对以上网络信息安全潜在的诸多风险，国家应提前谋划，通过加速立法进度、加快指导性政策制定、加强行业监管、加大创新性机构设立，提前谋划、尽早化解，以化解决胜阶段所存在的重大信息安全风险，对全面建成小康社会具有重大意义。


    1．全面规划、加速立法进度，逐步形成全面、系统的网络信息安全法律体系


    法律具有权威性和严肃性，为保证网络信息安全，用户权益不受侵犯，应健全、完善网络信息安全法规，严格规范网络行为，对网络犯罪案件依法惩处，不让犯罪分子钻法律的空子；在既有《网络安全法》《保守国家秘密法》等相关领域立法基础上，制定更为全面的《信息法》《电子信息出入境法》《电子信息犯罪法》等，以加强信息网络安全法律体系的协调性、整体性，通过这些法律法规对计算机硬件、软件及网络数据进行法律保护，保证网络信息安全运行和合理使用。建议由全国人大宪法和法律委员会牵头，由工信部、商务部、公安部、科技部等部委共同商议，加快建立、健全快速适应信息化、数字化环境的网络信息安全法律制度体系。该法律制度体系应具有前瞻性、系统性、全面性，并通过立法来促进和引导网络信息安全行业发展。


    2．加快关键性网络信息技术核心领域产品的安全审查指导性政策制定，同时加快该方面的安全审查标准制定与实施


    建议全国信息安全标准化技术委员会在《信息安全技术云计算服务安全能力评估方法》等8项国家标准基础上，由工信部、安全部、公安部组织相关专家，尽快对正处于征求意见阶段的其他核心领域网络信息技术产品安全标准进行完善。同时，有些不宜公开的技术标准（尤其是涉及关键性核心技术），建议在小范围内征求意见，并尽快实施。


    与此同时，建议相关部门着手制定与以上诸标准相关配套的核心领域网络信息技术产品安全审查政策与制度，一方面是加强对网络知识产权的保护，另一方面通过统一评价标准，尽早化解重大的网络信息安全风险隐患。


    3．重视网络信息安全人才培养，实时监控安全状态，化解大规模社会工程爆发的风险


    提高网络信息安全管理水平，防止大规模社会工程爆发的风险，第一，要重视网络信息安全人才的培养，网络信息安全是运用高水平的技术手段进行网络管理的，我们想要提早发现隐患，迅速化解危机，就需要一定的高水平技术人员去处理危机，只有我们自己拥有高技术水平人才，才能真正确保我国的网络信息安全；第二，建议国家安全部门使用专业技术安全团队在暗网潜伏，目的在于了解目前被交易的用户隐私信息规模数量，实时监控，占据主动，防患于未然，一旦出现问题，及时以必要手段阻断可能对社会造成重大影响的交易；第三，加强国内或在国外投资建设的基础水电等大型民用设施的工业信息系统安全，重点加强电力网、水网、天然气网络以及大型水电站、火电站、核电站、铁路交通、海运、航运等工业信息系统的安全态势，防范突发的网络安全攻击对社会的危害，将中、大型城市的基础民用信息化设施列为重点保护目标。


    4．制定国家数据长期安全保存战略


    网络的核心是数据，数据一旦遭到破坏或丢失，后果不堪设想，要想长期保存数据，一方面，建议由科技部、文化和旅游部、商务部、安全部、公安部牵头，成立国家大数据专门保存机构，对各方面具有战略价值的数据进行有效长期保存。建立该机构作为国家直属的独立部门，具有较大的数据收集与获取权限，树立机构的权威性，同时，制定与之相配套的数据收集与保存法律制度，以提升其战略重要性；另一方面，应做好数据备份工作，建立数据备份方案，对服务器数据进行定期备份，及时更新备份方案，同时，定期对网络服务器进行安全检查，修补漏洞，确保数据安全。


    5．加强网络信息安全教育，提高网络安全意识


    提高公众网络信息安全意识是做好网络信息安全工作的基础，只有努力提升公众的网络信息安全意识，各项网络安全的措施才能真正发挥作用。要加强对公众进行网络信息安全教育，将网络信息安全意识、基本技能等纳入大学、社会教育体系之中，通过宣传网络安全常识、定期举行网络安全相关培训和宣讲会等方式，增强公众对网络信息安全的忧患意识，提升对网络安全的关注度。一旦网络安全受到威胁，我们的所有数据信息将会瞬间毁于一旦，造成不可估量的损失。当前，必须积极做好防范措施，保障网络信息安全，特别是将金融、军事等部门作为网络信息安全监管的重中之重，并逐步扩展到其他系统，形成一个强有力的网络安全防范体系。


    6．建立高效的网络信息安全协调联动管理体系


    为了保证国家对网络信息安全工作的集中统一领导，我国应建立一个网络信息安全应急管理机构，统筹网络安全管理事项，协调各部门单位之间的网络安全管理工作，同时，扩大国家计算机安全应急处理中心的管理权限，并在各级机关单位都建立专门的网络安全管理部门，保证网络信息安全管理工作全范围覆盖；还可以建立高水平、高质量、精通电子信息技术的刑侦队伍，能够大幅度提升我国对高技术网络犯罪的预防和侦破能力，为我国网络安全保驾护航，从而提升网络安全水平。


    ## 8.6 网络安全治理国家战略


    2016年12月27日，国家互联网信息办公室发布《国家网络空间安全战略》（以下简称《战略》），这是我国首次以国家战略文件的形式阐明中国关于网络空间发展和安全的重大立场和主张，明确战略方针和主要任务。《战略》的公布，受到国内外广泛关注和多方解读。该战略文件的发布，对指导我国网络安全工作，推进国家治理体系和治理能力现代化具有重要促进意义。'
