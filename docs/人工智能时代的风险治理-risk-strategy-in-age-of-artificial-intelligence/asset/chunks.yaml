    ## 4.7 Situational Awareness and Discovery of Social Group Events


    In the era of big data, the intervention of the Internet has brought new trends
    and dynamics to group events. Different categories of group events exhibit new
    characteristics distinct from the past, while also giving rise to some new types
    of group conflict events. Overall, an increasing number of social conflicts show
    a serious dependence on the Internet during both their brewing and outbreak phases.
    The Internet''s permeation into social conflicts has spawned more and larger-scale
    hidden dangers of group events. To warn of group events more effectively and timely,
    so as to control them effectively before they cause destructive impacts, it is
    necessary to rely on big data, combine technology with management, advance intelligent
    decision-making for group event early warning through the sharing of data, experience,
    and knowledge and the co-construction of systems and environments, and achieve
    precise early warning and scientific prevention of group events in multi-party
    collaborative comprehensive social governance.


    In the governance of group events, the importance of early warning has been deeply
    recognized by a wide range of scholars and administrative staff. Scholars and
    staff in many fields have continuously explored the path of early warning at both
    theoretical and practical levels. The overall goal of group event early warning
    is to prevent cognitive biases in social contradictions, eliminate single-polarized
    value judgments, reduce the disorderly release of social emotional energy, and
    avoid the occurrence of destructive collective actions. A comprehensive group
    event early warning framework emphasizes focusing on different stages at different
    periods of group events: when a group event is in the latent period, the outbreak
    must be blocked; when a group event has broken out, its spread and escalation
    must be prevented; when a group event has escalated and spread, violent behavior
    must be guarded against.


    In the historical evolution of group event development, viewed as a response to
    emergencies, group events have mostly followed a "One Plan, Three Systems" framework
    model. That is, an emergency response framework premised on emergency plans, based
    on the emergency management system, keyed on the emergency management mechanism,
    and guaranteed by the emergency management legal system. The advent of the Internet
    has changed the landscape of the occurrence and development of group events. The
    shift of group events to the Internet has also presented new characteristics and
    dynamics distinct from the past. Group event early warning faces new challenges.


    In recent years, the concept of government organization in governing group events
    has not been limited to relying on a single force to target collective actions
    in real society; more attention has been paid to the virtual space constructed
    on Internet platforms, balancing the interaction between physical space and cyberspace,
    and carrying out multi-party consultative joint actions for group event early
    warning and governance. Moving from administrative suppression to system building,
    from passive response to active response, from single decision-making to multi-party
    participation, and from government dominance to social co-governance—these new
    trends and directions have pioneered new models for group event early warning.
    Concepts are the precursors of action; the realization of concepts requires multi-dimensional
    interaction at the action level. In the big data era, the new trends and challenges
    facing group events require not only the establishment of intelligent early warning
    concepts in governance but, more importantly, the promotion of the realization
    of intelligent early warning concepts through action strategies that combine technology
    and management.


    Starting from the traditional group event early warning model, the new characteristics
    of group events, and the adjustment of government work concepts, it can be found
    that the traditional model struggles to cope with group events in the new era.
    Continuing to use the traditional model for group event early warning in the Internet
    era is inefficient or even ineffective. Conducting group event early warning in
    the Internet era requires relying on big data derived from the Internet, using
    it as support to make achievements in the sharing of data, experience, and knowledge
    and the co-construction of systems and environments; only then can intelligent
    early warning of group events be efficient and precise.


    David Easton''s political systems theory regards citizens'' demands and support
    as inputs to the political system, which are received and processed by policymakers
    to output policy products. The emergence of the Internet has provided more opportunities
    and platforms for the protection of group rights and the expression of individual
    demands. Various forms of online rights protection channels—such as official website
    disclosures, hotline announcements, online reporting, and public replies—are increasingly
    seen online. It can be said that there is an "inhibitory bidirectional causality"
    between Internet use and non-institutionalized political participation. With the
    help of the "Internet+", people express themselves more frequently and autonomously
    to pursue their needs. Overall, while channels for demand expression realized
    via the Internet have increased, many channels suffer from formalism and have
    not truly improved the political system''s "input malfunction." On the contrary,
    they have even intensified the contradiction between excessive demand expression
    and low-capacity online struggle, causing rights protection actions to shuttle
    back and forth between cyberspace and physical space, creating a vicious cycle.
    The Internet is a breeding ground for the generation and spread of rumors in group
    events. "The basis for the existence of rumors is a reaction to the hope for further
    understanding of things or to a vaguely felt threat." Facing emergencies, when
    official information supply cannot meet the public''s information needs, intense
    information hunger strengthens people''s motivation to seek the truth. Thus, online
    rumors appear, hearsay prevails, and false information circulates, filling the
    gaps in real information about group events, creating obstacles for the release
    of authoritative information, the clarification of the truth, and the purification
    of the online environment, and creating an unfavorable public opinion environment
    for the fermentation and escalation of group events. The anonymity and speed of
    Internet information transmission provide conditions for the emergence and spread
    of online rumors; failure to refute rumors in a timely manner can lead to the
    instantaneous escalation and rapid spread of group events.


    Massive data is a product of the Internet. Residing in cyberspace, an individual
    expresses demands and vents emotions through media platforms; two strangers can
    build relationships through online platforms. These small-scale, individualized
    behavioral data are often submerged in the massive data of the Internet and are
    difficult to detect. Simultaneously, the tendency for people to express themselves
    non-verbally via the Internet is becoming increasingly significant; the use of
    emojis is more popular, and participation behaviors such as "bumping posts," "liking,"
    and "tipping" are common, while feigned silence and repression also occur from
    time to time. In group event early warning, relying solely on language and text
    to capture people''s emotional changes and behavioral motives is ineffective.
    Without the support of data technology, even behavioral data among different organized,
    scaled subjects based on the Internet are difficult to monitor and take seriously.
    Against the background of "Internet + Professional Fields," the concealment and
    dispersion of the Internet have weakened managers'' vigilance toward abnormal
    emotions and deviant behaviors.


    Traditional collective actions are often formed in a temporary organization, carrying
    out specific collective rights protection actions under certain rules through
    the leadership role of organizers. The Internet, with its function of bridging
    distances and emotional mobilization, locks the eyes of more people from all over
    the country onto specific group events. However, the Internet''s organizational
    capacity remains insufficient; more eyes locked on have not transformed into concrete
    organized actions. And "organized expressive activities are more likely to strengthen
    the cognitive and assessment mechanisms of action risks, responsibilities, and
    their substantiation, which helps the self-restraint of collective actions." Opinion
    expression and rights protection actions on Internet platforms are mostly decentralized,
    fragmented, low-organization behaviors, lacking capable organizers, and lacking
    the constraints of group discipline and responsibility allocation. This weakens
    people''s cognition of action risks and expected judgments, making the tendency
    to adopt violent behavior stronger.


    According to traditional research, based on the causes and concentrated areas
    of group events, group events are generally divided into land acquisition and
    demolition, environmental conflicts, medical disputes, labor disputes, urban communities,
    ethnic and religious categories, etc. In the big data era, the intervention of
    the Internet has brought new trends and dynamics to group events, and also made
    different categories of group events present new characteristics distinct from
    the past. Especially for subjects who find it convenient to use Internet media
    for rights protection, the instrumental attribute of the Internet has triggered
    structural changes in the conflicts of environmental disputes, medical disputes,
    labor disputes, and other types. At the same time, the Internet''s permeation
    into social life has also spawned some new types of group conflicts, such as online
    finance, media, and personal privacy (see Table 1). The new social form of "Internet
    + Conflict" poses new requirements and challenges for group event early warning.
