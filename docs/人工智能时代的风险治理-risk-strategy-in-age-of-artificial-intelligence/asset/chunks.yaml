- raw: '（7）可视化技术。此类技术指的是运用人们较容易理解的图形、图表、曲线等形式展现比较复杂的结果，数据可视化极大地扩展了数据的表达能力，便于人们理解。


    数据挖掘知识发现类算法包括关联规则性知识挖掘、神经网络型知识挖掘、遗传算法型知识挖掘、粗糙集型知识挖掘四大类。


    神经网络型算法是一个学习与整合的机理，算法分类准确度高、并行分布处理能力强、分布存储集学习能力强、容错能力在数据挖掘算法中极为不错，同时还具备联想记忆的功能，是知识发现类别中重要的算法。但有一个很大的缺点，算法不能观察学习的过程，输出的结果可解释性极低；此外神经网络模型学习时间过长甚至有可能达不到学习的目的，需要大量参数。


    遗传算法有着快速随机的搜索能力，且搜索是从集群出发，具有并行性，可以实现多个个体的同时比较，搜索使用评价函数启发，过程简单，但同样有一个致命缺陷，遗传算法的编程实现比较复杂，首先需要对问题进行编码，找到最优解后还需要对问题解码。另外与神经网络算法具有同样的缺点，训练时间太长。


    粗糙集型知识挖掘是一种主要用于研究不完全和不完整信息描述的数据挖掘技术，它主要体现在模糊、不确定的数据分析处理能力上。


    关联规则算法是一种基于规则的机器学习算法，该算法可以在大数据中发现彼此之间的关系。它的目的是利用一些度量指标来分辨数据库中存在的强规则。也即是说关联规则挖掘是用于知识发现，是一种无监督的机器学习方法。Apriori算法是关联规则算法中的经典算法。Apriori算法主要用于挖掘其内含的、未知的却又实际存在的数据关系，其核心是基于两阶段频集思想的递推算法。Apriori算法使用先验性质，大大提高了频繁项集逐层产生的效率，且算法简单易于理解，数据集要求低。


    ## 4.4 风险情报关联规则算法


    Apriori算法是经典的挖掘频繁项集和关联规则的数据挖掘算法，最早在1944年由R.Agrawal和R.Srikant提出。Apriori算法使用一种称为逐层搜索的迭代方法，其中k项集用于探索（k+1）项集。实现的顺序是：第一，通过对数据库进行扫描，累计数据库中每个项目的计数，并收集满足最小支持度的项目，找出一组频繁1项集的集合，记为L1；第二，使用L1找出频繁2项集的集合L2，使用L2找出L3，依此类推地进行下去，直到不能再找到频繁k项集。每个1层都需要一个数据库扫描。为提高频繁项集逐层产生的效率，Apriori算法使用频繁项集的先验性质来压缩搜索空间，这也是Apriori算法最具价值的特性。


    传统的Apriori算法对新项目的敏感性问题。各类风险信息不断更新，以往原有的一些风险行为特征会逐渐消失，取而代之的是一些新的风险线索的不断出现。针对这种情况，风险信息数据库所涵盖的项目也在不断更新，减少或增加的项目之间发生的关联也在不断地变化，生成了新的关联规则。然而，传统的Apriori算法却基本没有考虑到这个问题，换言之，即便是增加了新的项目，在计算每个项目集的支持度时，算法都是根据整个数据库的风险信息记录总数进行计算，此情况不符合关联规则挖掘的目的。这种问题所产生的最大不足就是无法发现最新出现的频繁项目集，也就不能产生最新的关联规则。


    传统的Apriori算法最大的缺陷就是不能有效地解决新项目的敏感性问题，这使得传统的Apriori算法无法在新汇集的数据库中及时发现新的风险威胁，更做不到对风险的提前预警。因此，对传统Apriori算法进行优化的目的，主要是加强对新出现的风险情报的敏感性。面对风险的不断出现，为使风险情报分析工作更加高效，将新出现风险的敏感性运用到对Apriori算法的优化过程中，将对风险情报发现工作起到巨大的推动作用。


    目前，虽然Apriori算法本身已经得到了许多优化，但在实际应用中还仍然存在一些缺陷。比如，当数据库数量较大时，发现规则长度增加，运行时间就会大幅度增长，导致效率极度低下。因此，一些研究者相继提出了对于这一问题的优化方法。


    最主要的改进方法如下：


    （1）基于散列的优化方法。基于散列（Hash-Based）的优化方法可以用于压缩候选k项集的集合Ck（k＞1）。在数据库中扫描每个事务时，由C1中的候选1项集产生频繁1项集L1时，我们可以对每个事务产生所有的2项集，并把其散列分布到散列表的不同容器中，增加容器的计数，在散列表中对应的容器计数低于支持度阈值的2项集不可能是频繁的，那么就由候选集中对其删除。这种技术当k=2时特别有效，其关键是构造一个有效的散列函数。


    （2）减少交易次数的方法。通过减少不必要的事务的数量来减少所扫描的事务数据库的大小，以提高挖掘的效率。其基本原理是，当事务不包括任意k项集，它也必须不包括任何（k+1）项集，就可以将此类别的事务删除。


    （3）基于划分的优化方法。基于划分的优化方法采用了对原始事务数据库D进行两次扫描的技术。在第一遍扫描时，首先将事务数据库D从逻辑上分成几个互不相交的块，每个部分的最小支持度计数等于D的最小支持度与该部分的事务数之积。对于每个部分来讲，查找这一部分的频繁项集，就可以称为局部频繁项集。局部频繁项集可能不是整个事务数据库的频繁项集，整个事务数据库的任何频繁项集必须以本地频繁项集的形式出现在至少一个部分中。只有如此，把所有局部频繁项集的集合作为D的候选项集，称作全局候选项集。再次扫描D，根据全局候选项集和实际最小支持度确定全局频繁项集。每个部分的大小和分区的数量取决于该部分是否可以放入内存。


    （4）基于采样的优化方法。基于采样的优化方法是在一个特定的数据库A中对随机样本B进行挖掘，这种方法的不足之处就是精确度不高，但其优点也显而易见，它的有效性得到提升。样本B中的频繁项集不一定是数据库A中的频繁项集，而且数据库A中的频繁项集不一定出现在样本B的频繁项集中，因此，应该使用比最小支持度低的支持度值来搜索样本B中的频繁项集，之后通过数据库的其余部分再来计算每个项集的实际频繁度。


    （5）基于动态项集计数的优化方法。基于动态项集计数的优化方法主要是将数据库进行划分，分割为标记起点的块，该算法可以在任意起点添加新的候选集。这一技术动态地评估已计数的所有项集的支持度，若某个项集的所有子集都被识别为具有频繁属性，那么就将其添加为一组新的候选项集。这种算法在数据库中执行的扫描次数比Apriori算法要少很多。


    ## 4.5 态势感知的应用图景


    早在20世纪80年代，美国空军就提出了态势感知的概念，涵盖感知、理解和预测三个方面。此后，随着网络的兴起而发展为“网络态势感知（Cyberspace Situation
    Awareness，简称CSA）”。态势感知是在大规模网络环境中对能够引起网络态势发生变化的安全要素进行获取、理解、显示以及最近发展趋势的顺延性做出预测和风险预警，及时采取决策与防御行动。


    2009年，美国白宫在公布的网络空间安全战略文件中明确提出要构建态势感知能力，并梳理出具备态势感知能力和职责的国家级网络安全中心或机构，包含了国家网络安全中心（NCSC）、情报部门、司法与反间谍部门、US-CERT、网络作战部门的网络安全中心（Cybersecurity
    Center）等，覆盖了国家安全、情报、司法、社会组织、企业等各个领域。


    没有信息安全就没有国家安全。没有信息安全，就没有真正的政治、军事、经济和社会安全，就没有整体意义上的国家安全。2016年4月19日，习近平总书记在网络安全和信息化工作座谈会上明确指出，加快构建关键信息基础设施安全保障体系；全天候全方位感知网络安全态势，增强网络安全防御能力和威慑能力。全天候全方位感知网络安全态势。知己知彼，才能百战不殆。没有意识到风险是最大的风险。网络安全具有很强的隐蔽性，一个技术漏洞、安全风险可能隐藏几年都发现不了，结果是“谁进来了不知道、是敌是友不知道、干了什么不知道”，长期“潜伏”在里面，一旦有事就发作了。


    建设网络安全态势感知平台，应以“业务+数据定义安全”战略为核心驱动，基于更广、更深的数据来源分析，以用户实际需求为出发点，从综合安全、业务安全、数据安全、信息基础设施安全等多个维度为用户提供全面的安全态势感知，在认知、理解、预测的基础上，真正帮助用户实现看见业务、看懂威胁、看透风险、辅助决策。


    随着中国《网络安全法》和《国家网络安全战略》的相继出台，态势感知被提升到了国家战略高度，众多大行业、大型企业都开始倡导、建设和积极应用态势感知系统，以应对网络空间安全的严峻挑战。


    狭义上讲，态势感知是一种基于环境的、动态整体地洞悉安全风险的能力，是以安全大数据为基础，从全局视角提升对安全威胁的发现识别、理解分析、响应处置、风险防御、危机应对能力的一种方式，最终是为了决策与行动，是安全能力的落地。


    随着网络安全重要性的凸显，态势感知开始在网络安全领域崭露头角，现阶段面对传统安全防御体系失效的风险，态势感知能够全面感知网络安全威胁态势、洞悉网络及应用运行健康状态、通过全流量分析技术实现完整的网络攻击溯源取证，帮助网络安全人员采取针对性响应处置措施。


    广义上的态势感知理论在近年来也有了重大的发展。广义的态势感知指，在基于海量源数据的收集分析基础上，对潜在威胁社会组织或个体的全要素各类风险因子进行动态呈现并提供风险预警级别研判和风险应对处置建议及行动协同和效能评价的体系。


    态势感知概念和体系已经被广泛应用到网络空间信息安全、网络空间舆论风险、公共安全风险预警、反恐情报分析发现、金融、能源等宏观行业系统性风险预警、重大决策社会风险研判及预警、重大决策社会稳定风险研判及预警、现代城市风险治理领导决策支持等领域。


    《孙子兵法》说：“多算胜，少算不胜。”决定是否“多算”的重要因素在于掌握基础数据的多寡，以及对数据处理能力的高低。大数据技术逐步应用于各领域的态势感知，将通过各种渠道搜集到的各类海量信息数据进行自动分类、整理、分析，有效解决现有风险信息、监测、情报侦察系统不足以及决策支持能力不足等问题，获取在信息方面的优势，提高社会安全保障水平。


    在态势感知风险情报发现中，对多源数据的积累能力和适用的数据分析算法选择、调整和风险预警算法优化能力是至关重要的环节，也是难点所在。对风险情报的定性、定量分析以及针对当前的风险状态、发展态势或应对短板等环节，给出相应的应对决策及实施措施建议，这是态势感知的核心。


    ## 4.6 数值天气预报—态势感知应用典范


    气象部门是最早应用态势感知预警理念和预警分析技术的行业机构之一，基于大气运动规律的模拟算法是数值预报（Numerical Weather Prediction，简称NWP）的核心算法。数值天气预报已经成为现代气象服务的基础天气预报业务支持平台。


    所谓数值天气预报，就是从大气初始状态出发，对支配大气运动的动力和热力方程组进行时间积分，得到大气未来运行状态的预报。数值预报问题主要分为两个方面：一个是初值场的确定，一个是对大气方程组的时间积分。也就是说，数值天气预报是根据大气实际情况，在一定的初值和边值条件下，通过大型计算机作数值计算，求解描写天气演变过程的流体力学和热力学的方程组，预测未来一定时段的大气运动状态和天气现象的方法。


    随着计算机技术、通信技术、大气科学及相关学科领域的发展，人类已可以利用计算机重现或预测发生在自然界的天气-气候变化的主要过程，这就是天气-气候的数值模拟与数值预报。“数值天气预报”用通俗的语言可表述为“用大数据系统来预测天气未来可能的走势”。


    数值天气预报与经典的以天气学方法作天气预报不同，它是一种定量的、客观的预报，正因为如此，数值天气预报首先要求建立一个能较好地反映预报时段的（短期的、中期的）数值预报模式和误差较小、计算稳定并相对运算较快的计算方法。其次，由于数值天气预报要利用各种手段（常规观测、雷达观测、船舶观测、卫星观测等）获取气象资料，因此，必须恰当地作气象资料的调整、处理和客观分析。最后，由于数值天气预报的计算数据非常之多，很难用手工或小型计算机去完成，因此，必须要有大型的计算机。


    根据大气实际情况，在一定初值和边值条件下，通过数值计算，求解描写天气演变过程的流体力学和热力学方程组，预报未来天气的方法。和一般用天气学方法并结合经验制作出来的天气预报不同，这种预报是定量和客观的预报。预报所用或所根据的方程组和大气动力学中所用的方程组相同，即由连续方程、热力学方程、水汽方程、状态方程和3个运动方程（见大气动力方程）所构成的方程组。方程组中，含有7个预报量（速度沿x,
    y, z三个方向的分量u, v, w和温度T，气压p，空气密度ρ以及比湿q）和7个预报方程。方程组中的黏性力F，非绝热加热量Q和水汽量S，一般都当作时间、空间和这7个预报量的函数，这样，预报量的数目和方程的数目相同，因而方程组是闭合的。


    数值预报已经成为现代天气预报业务不可或缺的重要基础手段，数值天气预报理论和技术不断发展，水平不断提高，数值预报的内涵也在延伸。


    数值预报已经成为大气学科研究不可或缺的重要工具和手段：资料再分析—对过去资料的“定量”再利用，获取更长时间的过去大气演变信息，更好地深入研究大气运动发展的规律。


    大气数值模拟理论和技术的拓展应用，推进了地球科学领域的发展，使过去、现在、未来几百年的、多圈层相互作用的气候变化过程、全球变化过程的“重现”、预估模拟成为可能。


    数值预报业务和数值模拟研究的发展需求，推动了高性能计算、数据处理、计算数学、探测技术等领域的发展。


    早期的天气预报基本靠人工和经验。当时，分析天气图和读取数据等工作，都是人工进行的，这些工作所费的时间，比当时在电子计算机上的计算时间（试验）多10倍左右。为了提高工作效率并减少人为的误差，从1954年起，人们相继提出一些用电子计算机进行客观分析和自动处理资料的方法。不久，从收报到分析预报，都开始实现了自动化。20世纪50年代后期，人们发现，用准地转模式所作的预报有很大的局限性，预报的系统强度变化不大。以后，虽然用平衡模式，效果有所提高，但由于所用方程的阶数较高，若进一步考虑物理因素，可能给计算带来困难。1956年，A．埃利亚森提出用考虑重力波的原始方程模式制作预报的方案。1959年，K．欣克尔曼用原始方程模式作预报，获得了成功，其效果不低于准地转模式。但他和理查孙的做法不同，是在认识了快速重力波的性质，并采取新的措施（如缩短时间步长、滤去重力外波等）之后进行的。1960年，美国发射泰勒斯气象卫星成功，为提供沙漠和海洋等地区的气象资料找到了新的途径。随着动力气象和计算技术的发展，原始方程模式预报的效果逐渐超过准地转模式预报，到70年代初期，已比较普遍地用它作业务预报了。


    截至20世纪80年代，全世界已有30多个国家和地区把数值天气预报作为制作日常预报的主要方法。就预报项目来说，已包含有气压、温度、湿度、风、云和降水量；就范围来说，已从对流层有限区发展到包括平流层的半球和全球范围；就时效来说，除1～2天短期预报外，有的国家已开展了一个星期左右的中期预报。


    1．传统的天气预报流程


    大气的演变过程非常复杂，但大气运动遵循一定的物理规律，受流体力学和热力学方程组的支配，如下图。


    ![](images/figure_0072_0001.jpg)


    2．数值天气预报的分析模拟和运作模型


    数据分析模型


    （1）给定初始和边界条件；


    （2）通过数值方法求解描述大气动力和热力规律的方程组；


    （3）达到由初始时刻大气状态预报未来大气状态的目的。


    ![](images/figure_0073_0001.jpg)


    数值预报处理结构示意图


    目前，国际上最先进的数值天气预报模式可信预报时效已达8.5天以上。


    描述大气运动和演变的方程组非常复杂，高度非线性，很难得到大气运动方程组的精确解，数值预报的实现依赖于观测精度、数值计算方法、物理化学认知、计算条件等。


    数值天气预报的不确定性表现在以下几个方面：


    初始条件不确定。初始误差随时间增长，即观测有误差，故有不确定性，主要由有限的模式分辨率产生，是离散网格点代替连续时间和空间变化的计算方法带来的误差。


    数值天气预报的模式方程组是一组非线性方程组，通常不可能求得解析解，只能借助计算机采用数值方法求其近似解。而计算机无法处理连续性问题，必须要进行时间和空间的离散化。


    模式不确定。模式中表征物理过程或计算近似造成的不确定。求解的数值近似与次网格物理参数化造成的不确定。


    大气运行的因素的复杂性，也决定了数值模拟天气过程和预测天气过程是一个无限逼近真实的过程，在大数据预测中，是“模糊中的精确”，是一种可能。


    数值天气预报揭示了天气活动的一种应然或必然的趋势。


    因此，数值预报模式产品是在“多种完美假设”前提下的、进行“若干简化”后的“仿真”产品。


    这种数值天气预报的不确定性给定时、定点、定量精细化要素天气预报提出了挑战。因此，数值天气预报在对数学模型计算出来的产品又重新进行解释应用，以订正数学算法得到的结果，并使得对天气态势的感知更加逼近真实。


    通过数值预报产品的进一步解释应用，不仅可以在一定程度上消除天气动力数学模式的系统误差，而且也力求满足人们要求的定点、定时、定量的要素天气预报。


    3．数值天气预报释用数学分析模型


    （1）天气概念模式（天气经验、聚类法、相似法）。


    （2）统计方法：多元回归、卡尔曼滤波、逐级订正、人工神经元网络、判别分析、多维动态关联模型、SVM支持向量法等。


    （3）动力建模（模式）。


    从逻辑性思路上分为经典统计法、完全预报（PP）和动力输出（MOS）模式。


    对于数值天气来说，其分析方法及对数学模型分析结果及其各个产品环境有着严格且成熟的检验评估流程和检验标准，包括对原始数据的校验，这种业务处理流程对其他场景的预测预警类应用具有重要的参考价值。


    数值天气预报还有许多问题尚待解决。


    第一，次网格尺度的物理过程的引入。由于大气是一种具有连续运动尺度谱的连续介质，故不管模式的分辨率如何高，总有一些接近于或小于网格距尺度的运动（见数值天气预报常用计算方法），无法在模式中确切地反映出来，这种运动过程称为次网格过程。湍流、对流、凝结和辐射过程都包含有次网格过程。在数值预报中已采用参数化的方法来考虑这些过程，即用大尺度变量来描述次网格过程对大尺度运动的统计效应。尽管用这种方法已取得了相当好的效果，但仍有许多未解决的问题。如参数化不能考虑大尺度对小尺度的影响及其反馈作用，参数的数值缺乏客观的确定方法，模式对参数化的差异过于敏感等。


    第二，非线性方程的数值解。虽然在适当条件下，可以证明某些线性微分方程组的稳定格式的数值解，能够近似表示相应的微分方程组的真解，但对于非线性微分方程来说，两种解却可能不完全一致。已有证据表明，虽然有时候数值解是计算稳定的，但却与真解（这是特殊情况，真解是已知的）毫无相似之处。


    第三，初值形成问题。即各类海量原始气象数据本身存在的问题，这些数据包括土壤、低空、高空、海洋等对象的大气活动基础观测数据，这些资料包括实时气象观察数据、雷达数据、卫星遥感数据、海洋漂浮站数据等。它包括初值处理、卫星资料的应用和四维同化等问题，这些问题至今尚未很好解决。'
