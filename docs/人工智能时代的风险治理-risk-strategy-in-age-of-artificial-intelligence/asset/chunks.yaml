    # 第五章 中国风险治理和应急管理


    应急管理是应对于特重大风险事故灾害的危险问题提出的。应急管理是指政府及其他公共机构在突发事件的事前预防、事发应对、事中处置和善后恢复过程中，通过建立必要的应对机制，采取一系列必要措施，应用科学、技术、规划与管理等手段，保障公众生命、健康和财产安全；促进社会和谐健康发展的有关活动。危险包括人的危险、物的危险和责任危险三大类。首先，人的危险可分为生命危险和健康危险；物的危险指威胁财产安全的火灾、雷电、台风、洪水等事故灾难；责任危险是产生于法律上的损害赔偿责任，一般又称为第三者责任险。其中，危险是由意外事故、意外事故发生的可能性及蕴藏意外事故发生可能性的危险状态构成。


    事故应急管理的内涵包括预防、准备、响应和恢复四个阶段。尽管在实际情况中，这些阶段往往是重叠的，但它们中的每一部分都有自己单独的目标，并且成为下个阶段内容的一部分。


    风险治理和应急管理是跨行业的综合协同管理，不能把所有部门、行业或涉及危机应急的部门、行业都纳入应急管理部门。应将应急管理主管部门打造成专为各行业发生的全民性突发事件而准备的全功能专业应急预防、预测、预警、协调、储备的专业部门。


    “居安思危，预防为主”是应急管理的指导方针。国家突发公共事件总体应急预案提出了六项工作原则：以人为本，减少危害；居安思危，预防为主；统一领导，分级负责；依法规范，加强管理；快速反应，协同应对；依靠科技，提高素质。


    美国、日本、澳大利亚和加拿大等国，都已经建立起一套有针对性的应急管理体系和具体做法，形成了特色鲜明的应急体制与机制。其中，日本作为一个地震灾害频繁的国家，在地震应急方面比较成熟，其理论和具体做法值得我们借鉴。


    美国是而今世界上应急管理体系建设最完备的国家之一，不断完善的体制、机制和法制建设使其应对突发事件的能力越来越强。日本地处欧亚板块、菲律宾板块、太平洋板块交接处，处于太平洋环火山带，台风、地震、海啸、暴雨等各种灾害极为常见，是世界易遭自然灾害破坏的国家之一。在长期与灾难的对抗中，日本形成了一套较为完善的综合性防灾减灾对策机制。澳大利亚位于南半球的大洋洲，地广人稀，人口主要集中在悉尼这样的中心城市和沿海地区。在过去的几十年里，由于周围都是无边无际的大海，澳大利亚在战略上一直是一个处于低威胁的国家，其突发事件主要是自然灾害这一类，如洪水、暴雨、热带风暴、森林大火等，相应的应急管理也带有自己的鲜明特色。加拿大大部分地区属于寒带，冬季时间长，40%的陆地为冰封冻土地区，蒙特利尔冬季的温度可至零下30摄氏度，主要的自然灾害是冬季的暴风雪。所以，加拿大的应急管理是“以雪为令”。


    ## 5.1 中国应急管理制度现状


    中华人民共和国应急管理部是国务院组成部门，系于2018年3月根据第十三届全国人民代表大会第一次会议批准的国务院机构改革方案设立。应急管理部的主要职责是组织编制国家应急总体预案和规划，指导各地区各部门应对突发事件工作，推动应急预案体系建设和预案演练；建立灾情报告系统并统一发布灾情，统筹应急力量建设和物资储备并在救灾时统一调度，组织灾害救助体系建设，指导安全生产类、自然灾害类应急救援，承担国家应对特别重大灾害指挥部工作；指导火灾、水旱灾害、地质灾害等防治；负责安全生产综合监督管理和工矿商贸行业安全生产监督管理等。公安消防部队、武警森林部队转制后，与安全生产等应急救援队伍一并作为综合性常备应急骨干力量，由应急管理部管理，实行专门管理和政策保障，采取符合其自身特点的职务职级序列和管理办法，提高职业荣誉感，保持有生力量和战斗力。应急管理部要处理好防灾和救灾的关系，明确与相关部门和地方各自职责分工，建立协调配合机制。


    随着应急管理部的成立，中国建立了初步的防灾和救灾应急响应体系等一系列的应急管理规章制度。


    中国的应急管理制度是与社会主义初级阶段的基本国情相适应的。尽管我国在应急响应、社会动员和恢复重建等方面已经建立起了有效的制度，但也应清醒地认识到，我国社会发展所处的历史阶段，决定了应急管理制度建设的水平仍处于起步阶段。


    ## 5.2 中国应急管理法律制度的现状


    《中华人民共和国突发事件应对法》的颁布实施，标志着我国政府应急管理制度建设基本实现了规范化、法制化。在自然灾害、安全生产、公共卫生和社会安全等领域形成了较为完善的制度体系。


    在应对自然灾害方面，以《水法》《防洪法》《森林法》《草原法》《地矿法》为骨干形成了制度体系。在水土矿藏资源管理方面建立了规划、开发利用、工程的保护、资源配置和节约使用、纠纷处理与执法监督检查、法律责任等制度。


    在此基础上国务院还制定了配套的条例使这些制度更加具体，易于执行。例如《防汛条例》规定，实行各级人民政府行政首长负责制；实行统一指挥，分级分部门负责；各有关部门实行防汛岗位责任制，并对防汛组织、防汛准备、防汛与抢险、善后工作、防汛经费、奖励与处罚作了详尽规定。此外，还有《水库大坝安全管理条例》《蓄滞洪区运用补偿暂行办法》《防沙治沙法》《人工影响天气管理条例》《军队参加抢险救灾条例》。


    [^1]: `NATGRID`, National Intelligence Grid，美国国家情报网。

