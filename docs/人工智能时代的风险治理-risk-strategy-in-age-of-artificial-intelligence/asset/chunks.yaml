    其次，应围绕国家治理体系和治理能力现代化，聚焦网络空间发展和使用中的关键问题，力争用3～5年时间，构建良性运行的国家网络空间治理体系，形成国家对网络基础设施管辖和控制能力、网络舆情驾驭和网络文化传播能力、网络安全主动防御能力、网络空间国际影响能力，逐步实现从“外在管网”向“内在治网”的转变。


    最后，依法加强对网络空间内容的管理，是国家治理体系和治理能力现代化的客观要求，建设完善现代治理能力体系，在信息革命的背景下，必须也必然涵盖网络空间内容的有效管理。


