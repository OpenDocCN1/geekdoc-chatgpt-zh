    ## Part One


    The *Strategy* is a programmatic document guiding national cybersecurity work,
    aiming to safeguard national cyberspace security through "top-level design." The
    release of the *Strategy* marks that China, as the world''s largest cyber power
    by netizen population and the second-largest economic power by economic volume,
    has achieved strategic configuration of cyberspace security. It is a landmark
    event and milestone document in China''s journey from a major cyber power to a
    strong cyber power.


    First, the *Strategy* inherits General Secretary Xi Jinping''s series of thoughts
    on building a strong cyber nation, condenses the important achievements of long-term
    research by numerous experts and scholars, and for the first time explicitly defines
    the basic guidelines and main tasks of China''s cyberspace security strategy.
    It is a programmatic document guiding national cybersecurity work. At the same
    time, the *Strategy* elucidates China''s major positions and core propositions
    on cyberspace development and security. With the vision, morality, and strength
    of "embracing the cyber world, strengthening an open China, and establishing an
    orderly space," it aims to enhance the level of cyberspace security in China and
    even the world. Through the beautiful vision of a prosperous world via a cyber
    China, it seeks to build a community of shared future in cyberspace for human
    society.


    Second, guided by the holistic national security outlook, the *Strategy* clarifies
    China''s major positions and propositions on cyberspace development and security,
    defines the strategic guidelines and main tasks for building a strong cyber nation,
    and is an important achievement in implementing General Secretary Xi Jinping''s
    strategic thought on a strong cyber nation. It is a programmatic document guiding
    national cybersecurity work.


    Third, this released *Strategy* directly faces the realistic threats and challenges
    of cybersecurity, focuses on the goal of building a strong cyber nation, and constitutes
    a top-level design at the strategic level. Its purpose is to enhance risk awareness
    and crisis awareness, actively defend and effectively respond, promote the peaceful,
    secure, open, cooperative, and orderly development of cyberspace, safeguard national
    sovereignty, security, and development interests, and achieve the strategic goal
    of building a strong cyber nation.


    2016 was the inaugural year for China''s cybersecurity legislation and top-level
    strategic planning for cyberspace security. Just over a month after the 24th Session
    of the Standing Committee of the 12th National People''s Congress voted to pass
    China''s first Cybersecurity Law on November 7, 2016, the Cyberspace Administration
    of China (CAC) released China''s first *Strategy* on December 27. As a programmatic
    document for China''s cyberspace security, the *Strategy* overall constructs the
    "Four Principles" for maintaining peace and security in cyberspace: "respecting
    and safeguarding cyberspace sovereignty, peaceful utilization of cyberspace, governing
    cyberspace by law, and coordinating cybersecurity and development."


    Finally, the release of the *Strategy* is a major event in China''s political
    life and a major event with international influence, bound to attract widespread
    attention. The *Strategy* represents a new mobilization order from the Central
    Committee for building a strong cyber nation, and a declaration issued to the
    international community on China''s stance on cybersecurity. Making the current
    strategic deployment public embodies the spirit of transparency. The *Strategy*
    also declares to the world China''s firm determination to defend national security
    and cybersecurity, as well as its goodwill and desire to cooperate with the international
    community to jointly build a peaceful cyberspace. More broadly, this security
    strategy further strengthens the *Cybersecurity Law* passed last month, which
    has already drawn attention from human rights organizations and foreign companies.
    Meanwhile, the security strategy is part of a broader effort to streamline internet
    regulations, signaling the approach the CAC will take in strengthening control
    over domestic digital activities, while the state''s capacity for managing and
    anticipating the digital cyberspace has significantly improved.


    ## Part Two


    Governing the internet by law is an important link and inherent requirement for
    promoting the modernization of the national governance system and governance capacity.
    The Fifth Plenary Session of the 18th CPC Central Committee further proposed that
    during the "13th Five-Year Plan" period, "institutions in all aspects will be
    more mature and finalized, and major progress will be made in the modernization
    of the national governance system and governance capacity." Obviously, in the
    parallel intersection of physical time-space and cyber time-space, "modern governance
    capacity" points not only to physical life scenarios but also encompasses cyber
    society and cyber life. How to achieve effective governance of cyber society through
    legal means has become an important link in promoting the modernization of the
    national governance system and governance capacity, and may even become an important
    focus and breakthrough point for the modernization of the national governance
    system and governance capacity.


    Grasping the characteristics of cyber society and thereby achieving governance
    innovation is also a major topic for comprehensively deepening reform. One path
    to achieving the goal of governance modernization is social co-governance. Cyber
    society needs to emphasize social co-governance even more than physical society.
    The three characteristics of cyber society—virtuality, inseparability from physical
    society, and extensive public participation—point to a governance model that should
    be co-governance.


    First, the rule-of-law system for cyber governance is nurtured within the socialist
    rule-of-law system and runs through the entire process of building a socialist
    rule-of-law country and achieving the strategic goal of governing the country
    by law. The so-called "rule of law in cyber governance" refers to an organic complex
    and its governance process where, based on China''s national conditions and reality,
    adapting to the "Four Comprehensives" strategic layout and the needs of promoting
    the rule of law and modernization of national cyber governance, concentrating
    the will of the people and socialist attributes, the elements, structure, procedures,
    and functions of cyber governance are incorporated into the scope and operational
    track of the rule of law in a coordinated and unified manner.


    Second, focusing on the modernization of the national governance system and governance
    capacity, centering on key issues in the development and use of cyberspace, and
    striving to build a soundly operating national cyberspace governance system within
    3 to 5 years. This involves forming national capabilities for jurisdiction and
    control over cyber infrastructure, control over cyber public opinion and dissemination
    of cyber culture, active defense capabilities for cybersecurity, and international
    influence in cyberspace, gradually realizing the transformation from "external
    governance of the net" to "internal governance of the net."


    Third, strengthening the management of cyberspace content in accordance with the
    law is an objective requirement for the modernization of the national governance
    system and governance capacity. Building and improving the modern governance capacity
    system must, against the backdrop of the information revolution, inevitably encompass
    effective management of cyberspace content.


    ## Part Three


    The premise and foundation for achieving governance of the internet by law is
    to always uphold and defend cyber sovereignty and data sovereignty, and to implement
    cyber sovereignty through legal norms.


    First, data sovereignty protection is a realistic choice for cyber governance.
    China has become the world''s largest internet application country and will also
    become the largest data-creating country; data sovereignty urgently needs protection.
    Currently, China should vigorously carry out digital economic diplomacy, promote
    the establishment of a new global cyberspace governance system under the UN framework,
    strengthen the information security of national key infrastructure domestically
    through information security legislation, and strengthen multilateral cooperation
    externally to promote the formation of a community of shared interests in data
    protection.


    Second, cyber sovereignty is the natural extension of national sovereignty in
    cyberspace with the development of the internet era; it is the foundation for
    national development and interest maintenance in cyber society. In the future
    construction of cyber governance rules, cyber sovereignty must always be upheld:
    on the one hand, legislation must guarantee China''s independent management rights
    to prevent being controlled by others in the management of cyberspace; on the
    other hand, it must ensure the stability and healthy development of cyberspace
    order within China''s management scope, so that the overall operational order
    of the network conforms to China''s overall interests and mainstream values; at
    the same time, strengthen the maintenance of cyber data sovereignty. Manage data
    generated, circulated, and stored within China''s territory through legislation
    to prevent and control data risks.


    Third, national sovereignty is the supreme power of a country to independently
    handle internal and external affairs; it is an inherent attribute of the state.
    "Cyberspace sovereignty" is the inheritance and extension of national sovereignty
    in cyberspace and must be respected and safeguarded by all countries. From this,
    the *Strategy* clearly elaborates China''s major positions on cyberspace security
    and development externally, and can effectively guide national cybersecurity work
    internally, demonstrating China''s firm determination to safeguard cyberspace
    sovereignty, and indicating that the country will coordinate resources from all
    sides and increase efforts in safeguarding cyberspace sovereignty in the future.


    Finally, the *Strategy* clearly signals to the outside world that China will use
    economic, legal, diplomatic, and military measures to safeguard its cyberspace
    sovereignty. "Cyberspace is the new frontier of national sovereignty," and China
    will "build a cyberspace defense force commensurate with its international status
    and adapted to a strong cyber nation."


    ## Part Four


    Insisting on the joint participation of cyber subjects in governance and strengthening
    the responsibility of cyber platforms are important links in promoting the modernization
    of the cyber governance system and governance capacity.


    In recent years, the security department of a certain e-commerce enterprise joined
    forces with the Shaoxing police, together with tens of thousands of police forces
    from public security organs in over twenty provinces nationwide, to successfully
    crack the "8.14" account theft case. This is one of the largest personal information
    security cases handled by the police in recent years. This cyberspace governance
    model can be called the new "Fengqiao Experience" of the internet era. This is
    a typical "mass prevention and mass governance" under internet conditions, the
    latest development of comprehensive social security management entering the internet
    era, and a further enrichment of the "Fengqiao Experience."


    First, the significance of the new cyber "Fengqiao Experience" is an adaptive
    transformation made by the social governance model in response to the challenge
    of the third technological revolution represented by the internet.


    Second, democratic legislation should be promoted in internet legislation, that
    is, the legislative body leads, and all sectors of society participate in an orderly
    manner. This is because the development of the internet profoundly transforms
    and influences real society, and the social relations that need to be adjusted
    in determining relevant legislation are very diverse, involving relevant subjects
    with different interests. This requires enterprises, consumers, and the government
    to jointly participate in the entire legislative process, rather than listening
    to only one side. Only under the leadership of the legislative body, promoting
    active participation from all sides, and thereby balancing the realistic interests
    of all parties, can the internet develop better.


    Third, the supervision and punishment of numerous cyber service providers should
    be further strengthened. "Cyber platform responsibility" is unavoidable in the
    era of cyberspace. Cyber platforms themselves can be regarded as "quasi-governments"
    or "quasi-states" in cyberspace. The services of cyber operators and their actual
    effects transcend national borders; they provide the survival platform for cyber
    society and in fact undertake part of the management functions of "cyber society,"
    and must assume necessary social responsibilities, especially cyber governance
    responsibilities.


    Fourth, currently, China''s cyberspace governance is mainly based on administrative
    supervision by government departments, and a governance mechanism of joint participation
    by all subjects has not yet formed. First, there is a certain overlap in the management
    powers of government departments, which not only causes multiple authorities issuing
    orders and decentralized decision-making but also easily leads to phenomena such
    as "overstepping" and "misalignment"; second, the role of enterprises and industry
    organizations is insufficiently exerted. For example, in the governance of cybersecurity
    threats, quite a few enterprises invest insufficiently in cybersecurity, and cyber
    attacks and user privacy leaks caused by inadequate protection measures are not
    uncommon; third, netizens'' awareness and enthusiasm for participating in governance
    are not high.


    Fifth, it is necessary to grasp the characteristics of cyber society and thereby
    achieve governance innovation, which is also a major topic for comprehensively
    deepening reform. One path to achieving the goal of governance modernization is
    social co-governance. Cyber society needs to emphasize social co-governance even
    more than physical society. The three characteristics of cyber society—virtuality,
    inseparability from physical society, and extensive public participation—point
    to a governance model that should be co-governance.


    Finally, cybersecurity governance is a systems engineering project. Compared with
    traditional security, cybersecurity features more diversity and cross-border characteristics,
    which requires its governance model to break the state of departmental and regional
    segmentation and construct a full-process governance system featuring "whole-government,
    whole-society" participation. Adapted to the complex nature of cybersecurity,
    cybersecurity governance must highlight systematic construction and gradually
    establish a management model led by the government, featuring public-private cooperation,
    and participation by the whole society. In this governance system, the government
    needs to actively play its organizational and guiding functions, mobilize the
    enthusiasm of all stakeholders to participate in governance, enhance the cybersecurity
    awareness of the whole people, and build a healthy cybersecurity culture.


    # Chapter 9 China Urban Public Service and Urban Governance Index System


    ## 9.1 China Urban Government Governance and Public Service Index


    China Urban Government Public Service and Urban Governance Index, referred to
    as China Government Index (`China Government Index`, abbreviated as `CCI`).


    The new generation of smart government service system led by the China Government
    Index aims to innovate China''s government informatization, government governance,
    and public services, leading the construction and application of China''s e-government
    into a new stage centered on services. At the same time, by providing services
    and support for digital government and smart government, it aims to greatly enrich
    government resources and enhance government capabilities without violating China''s
    laws, regulations, rules, and policy provisions, providing powerful infrastructure,
    technical resources, and operational service support for "Internet + Government
    Services," "Internet + Supervision," etc.


    ![](img/figure_0215_0001.jpg)


    New E-Government Application System with Situational Awareness at its Core


    This system consists of four parts: China Urban Government Index, self-starting
    mechanism and toolkit, e-government service platform, and online-offline integration
    and implementation of government big data.


    The China Government Index is a dynamic quantitative indicator system developed
    and released by the Institute of E-Government, Peking University, to monitor,
    describe, and evaluate the status of urban government governance and public services
    in China. Index categories are established based on the functions and duties of
    urban governments, covering all aspects of government governance and public services.
    This includes first-level indices for monitoring the overall status of government
    governance and public services, and second-level indices for reflecting and identifying
    the operational status of various functional departments of the government. Upon
    full development, the total number of index categories will exceed one hundred.


    Indices are published in forms such as continuous release, phased timed release,
    and customized release, according to the different nature and functions of various
    indices.


    The China Government Index utilizes a combination of quantitative and qualitative
    methods and is a continuous, dynamic evaluation system for the overall operational
    status of cities. This system will provide important decision-making references
    for modern government governance, public services, equalization of livelihood
    services, urban economic development, urban emergencies, and prevention and resolution
    of major social risks.


    The China Government Index is divided into three levels of indicators, with the
    number of index categories exceeding one thousand.


    First-level indices mainly meet the needs for overall description and monitoring
    of the status of urban government governance and public services. Through index
    measurement and ranking, they measure and rank the governance performance, public
    service level, and capacity of urban governments. First-level indices are published
    annually on a timed basis.


    Second-level indices are mainly established for the internal management needs
    of governments at all levels to monitor and control the operational status of
    various functional departments. At the same time, second-level indices also have
    functions of digital real-time risk prediction, monitoring, evaluation, and government
    affairs disclosure, and can become tools for governments at all levels to strengthen
    internal management, operational control, and business operation self-starting.
    Second-level indices are published in modular form (i.e., functional modules formed
    according to relevant laws and regulations) via phased timed release and customized
    release.


    There are many categories of China Urban Government Indices, and the release workload
    is large with wide coverage. This feature determines that the index release will
    adopt a combination of annual general release for first-level indices, quarterly
    and monthly rotational release for second-level indices, and online and offline
    release, continuing throughout the whole year.


    The establishment of the indicator system needs to emphasize indicators, but also
    evaluation, and establish corresponding status thresholds. After normalization,
    the comprehensive index can be scored on a percentage basis, the results discretized,
    and divided into 4 grades. For example, according to the degree of operational
    health, they are divided into 100–85 (Red), 84–76 (Orange), 75–66 (Yellow), 65–0
    (Blue), intuitively marking the indicator status.


    ## 9.2 Value of China Urban Government Governance and Public Service Index


    The Fourth Plenary Session of the 19th CPC Central Committee made the decision
    to "promote the modernization of the national governance system and governance
    capacity," explicitly proposing to "establish and improve institutional rules
    for administrative management using technical means such as the Internet, big
    data, and artificial intelligence" and "promote the construction of digital government."
    The Decision of the Fourth Plenary Session of the 19th CPC Central Committee listed
    "upholding and improving the socialist administrative system with Chinese characteristics,
    and building a government governance system with clear responsibilities and law-based
    administration" as an important part of "upholding and improving the socialist
    system with Chinese characteristics and promoting the modernization of the national
    governance system and governance capacity," requiring governments at all levels
    to "optimize the systems of administrative decision-making, administrative execution,
    administrative organization, and administrative supervision," "innovate administrative
    methods, improve administrative efficiency, and build a service-oriented government
    that satisfies the people."


    Relying on the technical foundation and resource accumulation of China''s government
    informatization and smart city construction over the years, the China Government
    Index, with digitalization and big data as the main methods, constructs real-time,
    dynamic digital "mirrors" and digital portraits of the operation of urban government
    governance and public services. On the basis of enriching government governance
    and public service data resources, it provides the government with a signaling
    system for operations and its related mechanisms and tools, ultimately achieving
    the goals of improving the governance system, enhancing governance capacity, and
    improving public services.


    The Internet, smart cities, big data, artificial intelligence, and other technologies
    and resources used in the development and application of the China Government
    Index have important value for the improvement of China''s urban government governance
    system, the enhancement of governance capacity, and the improvement of public
    service quality.


    ## 9.3 Data Collection and Technical Implementation of China Government Index


    The China Government Index establishes indices based on the functions, duties,
    and matters of urban government governance and public services. The design is
    divided into five major parts: Government Governance, Government Services, Urban
    Influence, New Technologies and New Economy, and Social Organization Development
    and Social Services. Each part has relevant sections, involving a total of 144
    data items. (Taking the 2019 China Government Index collection as an example)


    Data items require collecting government work reports, statistical communiqués
    on national economic and social development, reports on the 2018 city-level and
    municipal budget execution and the 2019 city-level and municipal draft budget,
    and reports on the 2018 national economic and social development plan execution
    and the 2019 national economic and social development draft plan from 278 prefecture-level
    city governments.


    After familiarizing with the preliminary data requirements, based on government
    public reports and in consultation and discussion with researchers of corresponding
    indices, and using crawlers, search engines, relevant websites, relevant forums,
    and manual assisted search for each section index, the corresponding data sources
    were finally extracted, data source rules for corresponding sections and subordinate
    indices were formulated, and an index rule table was drawn up.


    According to the index rule tables of each section, it was finally determined
    that most data come from the government affairs disclosure, work reports, statistical
    yearbooks, budget and final accounts information, government meetings, and other
    sections of several major search websites: prefecture-level city government websites,
    people''s congress websites, intermediate people''s court websites, and government
    information disclosure websites.


    Other relevant auxiliary data sources include but are not limited to various open
    statistical data, reports, news from provincial, municipal, and departmental governments;
    various government-related news sources and data on social networks; government
    open big data sources related to society; various government open data provided
    by relevant departments; and data sources provided by other social institutions.


    The China Government Index is formed by comprehensive analysis of various data
    through a unified calculation system and indicator system. All data originate
    from open data released by relevant government agencies, enterprise management,
    public service, and other institutions in various cities. Therefore, the data
    sources are true, valid, and authoritative. The data analysis methods are universal
    and general. The index evaluation system and methods, data analysis methods, and
    factor weighting systems are all assessed according to a unified model. All analysis,
    diagnosis, and ranking are free from manual intervention before, during, and after
    the process and result generation, ensuring the objectivity and fairness of the
    evaluation system.


    Due to the large data volume required by the indices, the number of prefecture-level
    city websites to be searched is huge. Moreover, the structures of various government
    websites are complex, variable, and non-uniform, and the information data sources
    of each website differ greatly. This brings enormous difficulties to the construction
    of a unified crawler system. Therefore, adopting a suitable crawler system and
    appropriate crawler methods is particularly prominent.


    The China Government Index adopts a method combining crawlers and manual work
    for data collection. For data with similar website structures and unified data
    sources, distributed crawlers and browser simulation technologies are used for
    data collection. For data with complex website structures and unclear data sources,
    manual collection and searching relevant forums are used to assist data collection.


    After obtaining the source text of the data, for the searched and found data and
    documents, cleaning is performed to remove and filter out junk information unrelated
    to index data, such as advertisements and copyrights in web pages or data. Duplicate
    values from multiple data sources are removed. For individual data anomalies existing
    in a detection index, statistics are performed, the reasons for data anomalies
    are traced, and missing information attribute values are recorded. For the cleaned
    data, based on `ES` tokenization, keywords, corpus (knowledge base), `NLP` (Natural
    Language Processing), region, and other analysis methods, data of each section
    are parsed, classified, counted, tagged, and finally stored in the database.


    During the index production process, for data in the database, technicians use
    statistical analysis software to perform missing value imputation, outlier processing,
    and duplicate value removal on some data indicators. Finally, combining relevant
    statistical principles, using `Powerbi` to establish measures, `M functions`,
    binning processing, etc., relevant calculations such as month-on-month and year-on-year
    are performed on indicators, ultimately obtaining a batch of high-quality China
    Government Index raw data and indicators.


    ## 9.4 Implementation Methods of China Government Index


    ### (I) China Government Index Data


    Includes various open government data, industry analysis data, academic and scientific
    research institution data, telecom operator data, various open Internet data (including
    self-media data), and internal business data provided by the government. Using
    targeted crawler robots to crawl target websites, the collected data is structurally
    processed. At the same time, semantic analysis, natural language processing technology,
    knowledge graphs, machine learning, and other methods are used to clean and preprocess
    all raw data, generating the basic data required for index analysis.


    ### (II) Text Data Fragmentation Processing


    For the collected text data, unstructured text data is first fragmented through
    Chinese word segmentation, entity extraction, and other technologies, and the
    processed data is organized into structured data that can be statistically analyzed.


    By setting dynamic keywords as a segmentation dictionary, covering government
    governance (e.g., air pollutants, public security), public services (e.g., transportation,
    education), affected groups (e.g., schools), subject names (government offices),
    etc. Chinese word segmentation technology is used to analyze collected government
    announcements, news, open publications, and research documents. Simultaneously,
    dynamic keywords are counted and analyzed.


    Institutional names, proper nouns, etc., in the collected text information are
    extracted through entity extraction technology, and arrays formed by key data
    corresponding to entities are stored in the database.


    ### (III) Data Ordering


    After data cleaning is completed, data transformation and reduction are performed.


    In reality, many collected raw data may be messy, incomplete, noisy, often of
    many different types, and often high-dimensional, meaning there are a vast number
    of measurable features. Before the data analysis step, data must be preprocessed
    to improve the quality of the data to be analyzed, thereby improving the efficiency
    and effectiveness of data analysis.


    Data preprocessing includes two parts: data preparation and data reduction.


    Turning a messy, noisy raw dataset into a standardized, optimized analysis dataset
    requires cleaning and transformation (data preparation). If it is a large dataset,
    reduction (data reduction processing) is also needed.


    ![](img/figure_0221_0001.jpg)


    Data Preprocessing Process


    Data Cleaning process identifies and deletes noisy data in the dataset, while
    correcting inconsistent data. Erroneous data can easily interfere with the normal
    progress of the data analysis process, even leading to reduced accuracy of results.
    It includes two parts: missing value imputation and outlier analysis.


    Data Transformation operations refer to transforming source data into a form suitable
    for data analysis. There are three methods: normalization, data smoothing, differencing,
    and ratio.


    Data reduction includes three methods: feature reduction, value reduction, and
    case reduction. Common methods include `FA` (Factor Analysis), `ICA` (Independent
    Component Analysis), and `MDS` (Multidimensional Scaling). Deleting most irrelevant
    and redundant features from the data and selecting a subset of relevant features
    is feature selection. The importance of features needs to be calculated and ranked,
    and then the top-ranked features are selected based on the ranking. Common methods
    include `Relief Algorithm`, entropy measurement methods, Principal Component Analysis,
    etc. Value reduction is to reduce the number of discrete values of known features.
    Traditional discretization is done manually based on previous feature knowledge,
    while in automatic discretization, values are binned using mean and mode. In addition,
    `ChiMerge technique` using `X2 statistics` (Chi-square) for automatic discretization
    can be used.


