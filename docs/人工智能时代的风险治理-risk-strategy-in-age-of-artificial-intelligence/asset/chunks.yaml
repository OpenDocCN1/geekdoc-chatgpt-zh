    ## 4.8 Application of Big Data in Network Space Risk Discovery


    On December 8, 2017, at the second collective study session of the Political Bureau
    of the CPC Central Committee, General Secretary Xi Jinping emphasized that to
    improve the level of modernization of national governance using big data, it is
    necessary to strengthen Internet content construction, establish a comprehensive
    network governance system, and create a clean and clear cyberspace.


    Big data technology starts from the analysis of massive network risk event data,
    processes the data through algorithms, explores the intrinsic correlations between
    events and between data, thereby realizing the prediction of network risks, the
    guidance and control of online comments, and providing decision-making suggestions
    for public opinion guidance, playing a role in public opinion guidance.


    ### (I) Big Data Public Opinion Monitoring and Discovery Based on Text Semantic
    Analysis


    Using targeted search programs to actively track and monitor emerging online public
    opinion, then judging its trend based on text semantic emotion and intervening—this
    is the traditional practice of online public opinion guidance and the starting
    point of past online public opinion management. However, using big data technology
    allows for the mining and analysis of correlated data in online public opinion,
    summarizing the laws of the generation and development of online public opinion,
    and on this basis, modeling online public opinion to make prediction possible.


    #### 1. Big Data Assisted Online Comment Guidance and Control Based on Mainstream
    Public Opinion Attitude Collection on Social Media


    The system main architecture includes: a public opinion collection and analysis
    module based on big data mining and precise search, a distributed message passing
    and storage module based on cloud services, and a task guidance module based on
    network intelligent robots.


    #### 2. Big Data Supports Network Space Situational Awareness Decision-Making


    Network information is the collection of content conveyed by netizens behind the
    network; therefore, researching network data is essentially researching the social
    network composed of people. To realize machine-provided decision-making suggestions
    for public opinion handling, it is inseparable from the research on the internal
    correlations of online public opinion. In the big data era, every piece of network
    data is regarded as a node, capable of generating a multiplicative effect with
    other correlated data on the public opinion chain without restriction. This correlation
    expands content exponentially. Therefore, research on the intrinsic correlations
    of online public opinion can make public opinion analysis more accurate.


    Existing various public opinion monitoring systems are data statistical presentations
    from the perspective of media dissemination of raw data, without historical data
    correlation for reference, nor big data comparative analysis and intelligent deduction
    guidance based on historical event libraries from various dimensions. However,
    using big data technology to establish a knowledge case library comparison system
    will fully demonstrate the intelligent comparison of historical case data, while
    conducting predictive deduction, aiming to achieve the purpose of being simple,
    intuitive, practical, and effectively guiding relevant departments to accurately
    handle, guide, and respond to network public events. This system will effectively
    improve the problems of insufficient data collection, analysis, and judgment capabilities
    of the original public opinion system, greatly enhance the level of handling of
    network public opinion analysis and judgment, and powerfully enhance the comprehensive
    governance capability of network space.


    #### 3. Implementation of Big Data Knowledge Case Library Comparison System


    ##### Metadata Collection


    Through the data collection module, data is collected, including monitoring and
    data collection of domestic news webpages, videos, pictures, Chinese newspapers,
    Tieba, Weibo, WeChat official accounts, news clients, and overseas mainstream
    media, websites, and social platforms, filtering invalid data. For mainstream
    news clients, WeChat official accounts, etc., the data collection module consists
    of crawler servers, crawler task scheduling servers, crawler monitoring servers,
    crawler log servers, data deduplication servers, and natural person behavior servers.
    Data collection is completed through the collaboration of crawler server clusters.
    Data collection faces massive data generated by Internet news, forums, Weibo,
    WeChat, etc., for collection, screening out useful data information.


    ##### Data Mining Technology


    ###### Data Algorithms


    For big data, how to conduct large-scale, effective data mining: on the one hand,
    requires a large amount of data analysis; on the other hand, requires the ability
    to process data quickly and effectively. When developing algorithms, the high
    efficiency of data processing and computing costs must be fully considered.


    ###### Mathematical Modeling


    How to intuitively present the analyzed data in a visual way is another difficulty
    of big data. The scale of big data is relatively huge and cannot be displayed
    in a list format; therefore, graphics and charts are needed to display these data.
    For different purposes of different data to be displayed, different mathematical
    visualization and display models need to be established.


    ###### Data Analysis and Comparison


    Common data analysis algorithms include the following.


    **Cluster Analysis (`Cluster Analysis`)**


    Cluster analysis refers to the analysis process of grouping a collection of physical
    or abstract objects into multiple classes composed of similar objects. Clustering
    is the process of classifying data into different classes or clusters, so objects
    within the same cluster have high similarity, while objects in different clusters
    have high dissimilarity. Cluster analysis is an exploratory analysis; during the
    classification process, people do not need to give a classification standard in
    advance; cluster analysis can automatically classify starting from sample data.
    Different methods used in cluster analysis often yield different conclusions.
    Different researchers performing cluster analysis on the same set of data may
    not necessarily get a consistent number of clusters.


    **Factor Analysis (`Factor Analysis`)**


    Factor analysis refers to the statistical technique of studying the extraction
    of common factors from a variable group. Factor analysis is to find intrinsic
    connections from a large amount of data to reduce decision-making difficulties.


    There are more than 10 methods of factor analysis, such as the centroid method,
    image analysis method, maximum likelihood solution, least squares method, alpha
    factor extraction method, Rao''s canonical factor extraction method, etc. These
    methods are essentially mostly approximate methods, based on the correlation coefficient
    matrix; the difference lies in the values on the diagonal of the correlation coefficient
    matrix, using different communality estimates. In sociological research, factor
    analysis often uses the iterative method based on principal component analysis.


    **Correlation Analysis (`Correlation Analysis`)**


    Correlation analysis studies whether there is some kind of interdependent relationship
    between phenomena, and for specific phenomena with interdependent relationships,
    explores their correlation direction and degree. Correlation relationship is a
    non-deterministic relationship. For example, using x and y to record a person''s
    height and weight respectively, or the amount of fertilizer per hectare and wheat
    yield per hectare respectively, then x and y obviously have a relationship, but
    not to the exact extent that one can precisely determine the other; this is a
    correlation relationship.


    **Correspondence Analysis (`Correspondence Analysis`)**


    Correspondence analysis, also known as association analysis or R-Q type factor
    analysis, reveals the connections between variables by analyzing a cross-tabulation
    composed of qualitative variables. It can reveal the differences between categories
    of the same variable, as well as the correspondence relationships between categories
    of different variables. The basic idea of correspondence analysis is to represent
    the proportional structure of each element in the rows and columns of a contingency
    table as points in a lower-dimensional space.


