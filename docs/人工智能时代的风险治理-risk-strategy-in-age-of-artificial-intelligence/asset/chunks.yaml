    ## 4.1 Overview of Risk Intelligence


    The discovery of risk indicators possesses immense social value; identifying risks
    is the key to risk governance and the primary task of risk governance. This information
    has already acquired the significance of intelligence. So-called risk intelligence
    refers to discovered or transmitted risk clues, risk knowledge, or risk facts;
    it is specific information or knowledge discovered, received, and transmitted
    using certain methods and means. Risk intelligence, threat intelligence, and security
    intelligence are all crisis clues, security clues, and risk clue information within
    a specific domain.


    According to Gartner''s definition of threat intelligence, threat intelligence
    is evidence-based knowledge, including context, mechanisms, indicators, implications,
    and actionable advice. This knowledge relates to existing or emerging threats
    or hazards faced by assets and can be used to provide informational support for
    asset-related subjects'' response or handling decisions regarding threats or hazards.
    Most so-called threat intelligence in the industry can be considered narrow-sense
    threat intelligence; its main content consists of indicators of compromise (IoCs)
    used to identify and detect threats, such as file `HASH`, `IP` addresses, domain
    names, program execution paths, registry keys, etc., as well as related attribution
    tags. Threat intelligence aims to provide asset subjects facing threats (usually
    the enterprises or institutions owning the assets) with comprehensive, accurate,
    relevant, actionable, and decision-supportive knowledge and information.


    ### Classification of Threat Intelligence


    Threat intelligence is usually divided into the following four categories:


    **Strategic Threat Intelligence (`Strategic Threat Intelligence`)**. Strategic
    threat intelligence provides a global perspective on the threat environment and
    business issues. Its purpose is to inform the decisions of the board of directors
    and senior executives. Strategic threat intelligence usually does not involve
    technical intelligence; it mainly covers aspects such as the financial impact
    of cyberattack activities, attack trends, and areas that may affect senior business
    decisions.


    **Operational Threat Intelligence (`Operational Threat Intelligence`)**. Operational
    threat intelligence relates to specific, imminent, or anticipated attacks. It
    helps senior security personnel predict when and where attacks will occur and
    conduct targeted defense.


    **Tactical Threat Intelligence (`Tactical Threat Intelligence`)**. Tactical threat
    intelligence focuses on the attacker''s `TTP` (Tactics, Techniques, and Procedures).
    It relates to specific attack vectors used by attackers targeting specific industries
    or geographical regions. It ensures that personnel such as incident responders
    have corresponding response and action strategies prepared for such threat attacks.


    **Technical Threat Intelligence (`Technical Threat Intelligence`)**. Technical
    threat intelligence mainly consists of indicators of compromise (IoCs) that can
    automatically identify and block malicious attack behaviors. Currently, the threat
    intelligence more widely applied in the industry is still primarily at the technical
    threat intelligence level.


    ### Sources of Threat Intelligence


    Sources of threat intelligence mainly include log data generated by enterprise
    internal networks, endpoints, and deployed security devices; threat data generated
    by security vendors and industry organizations; news websites, blogs, forums,
    social networks; and some relatively closed sources, such as the dark web, underground
    forums, etc.


    ### Threat Intelligence Analysis Methods and Models


    Commonly used threat intelligence analysis methods and models include `Lockheed
    Martin`''s `Cyber Kill Chain`, the Diamond Model, and `MITRE ATT&CK`.


    ### Overview of Security Intelligence


    Security intelligence refers to all security information affecting system security
    behavior. Broadly speaking, security issues are an important practical concern
    widely attended to by current nations, governments, enterprises, society, the
    public, and academia. Security intelligence is crucial for safeguarding social
    security. Therefore, security intelligence research holds significant theoretical
    and practical significance, covering all aspects of society.


    Security intelligence is the prerequisite and foundation for carrying out system
    security management work; it is the "eyes, ears, vanguard, and think tank" of
    system security management.


    ### Value of Security Intelligence


    The fundamental cause of system security management failure is the lack of security
    intelligence. Regarding system security management, the value of security intelligence
    lies in solving the problem of missing security information in system security
    management. Accordingly, based on the classification of system security management
    activities (i.e., security prediction activities, security decision-making activities,
    and security execution activities), the value of security intelligence mainly
    lies in the following aspects:


    1.  **"Discoverable, Accurate, Early"**: Security intelligence can serve as the
    system''s security prediction (early warning) support system. It is a prerequisite
    for grasping the initiative in system security management. "Discoverable, accurate,
    early" refers to successful security prediction (early warning), i.e., on the
    basis of fully collecting, understanding, and mastering various security information,
    and obtaining effective security intelligence through analysis of this information,
    thereby making forward-looking, correct, scientific, and precise security predictions
    based on security intelligence. In other words, security intelligence helps discover
    system security threats and security promotion opportunities, and by increasing
    early warning time, it increases the reaction time for system security managers,
    thereby gaining an advantage in system security risk control and achieving prevention
    before problems arise.

    2.  **"Decide Well, Decide Fast, Decide Economically"**: Security intelligence
    can serve as the system''s security decision-making support system. It is the
    basic requirement for formulating system security management plans. "Decide well,
    decide fast, decide economically" refers to successful security decision-making,
    i.e., on the basis of comprehensive assessment of various security prediction
    intelligence, making scientific, reliable, effective, and economical security
    decisions quickly based on the best security intelligence.

    3.  **"Control Early, Control Solidly, Control Effectively"**: Security intelligence
    can serve as the system''s security execution support system. This is the ultimate
    goal of system security management response. "Control early, control solidly,
    control effectively" refers to successful security execution, i.e., according
    to security decision intelligence, by timely, effective, and thorough implementation
    of security decision plans (mainly various security measures, including emergency
    management measures), striving to prevent and control various unsafe events, or
    reducing the adverse consequences of unsafe events and minimizing their impact
    through effective emergency management measures.


    "Security intelligence can also serve as an important security learning system,
    not only helping system security managers continuously access new security concepts
    and advanced security management methods, but also allowing them to learn lessons
    from accidents. In short, security intelligence work can not only provide specific
    clues and ideas for security management work but also provide basis and reference.
    Security intelligence work is an important way to obtain security intelligence;
    only when security intelligence work is done solidly and effectively can ''proactive
    prevention,'' ''sharp eyes and ears,'' and ''precise policy implementation'' be
    achieved in security management. Furthermore, the realization of security intelligence
    value must rely on actively advocating and practicing the concept of ''intelligence-led
    security management''."[[4]](#Chapter_8_1.xhtml#B8)


    ### Main Characteristics of Intelligence Information


    Knowledgeability, transmissibility, value, confidentiality, and timeliness are
    the main characteristics of intelligence information. The discovery and analysis
    methods of risk intelligence share many similarities and commonalities with those
    of security intelligence.


    ## 4.2 Risk Intelligence Analysis and Discovery


    The US *Dictionary of Military and Associated Terms* defines intelligence analysis
    as the process of converting processed information into intelligence to meet known
    or anticipated user requirements through the synthesis, evaluation, analysis,
    and interpretation of all-source data.


    The purpose of risk intelligence analysis is to provide social governance decision-makers
    or organizational decision-makers with a complete set of comprehensive decision
    support and response handling processes regarding risk information.


    A risk intelligence analysis platform generally includes multi-source data collection
    and gathering, application retrieval, decision knowledge base, data analysis (including
    visual presentation), risk early warning, decision support, task response, action
    coordination, effectiveness monitoring, and other components.


    An analysis states: "A large part of the intelligence obtained in war is contradictory,
    even more is false, and the vast majority is quite unreliable. This requires officers
    to have a certain power of discrimination, which can only be obtained through
    knowledge and judgment of things and people." Faced with increasing amounts of
    information in modern warfare, if high-quality information cannot be effectively
    extracted and the large amount of "information dross" mixed within removed, one
    may fall into an "information trap," thereby being placed at an information disadvantage
    and unable to seize the initiative in war.


    Big data technology is the science of discovering correlations in complex information,
    revealing hidden facts, and enhancing credibility. It can effectively compensate
    for the shortcomings of traditional analysis methods in information processing;
    therefore, strategic situational awareness increasingly requires the participation
    and support of big data technology.


    The scientific nature of risk intelligence data analysis algorithms is crucial
    for big data processing, directly affecting the accuracy of the conclusions drawn.
    For strategic situational awareness, it is necessary to apply different algorithms
    in a targeted manner to collect, question, hypothesize, supplement data, verify,
    and evaluate various signs or indications of specific events. This process often
    needs to be repeated cyclically and continuously corrected to improve the accuracy
    of conclusions. However, the logical basis of relevant algorithms is mostly based
    on human judgment; although human judgment may be corrected subsequently, if the
    initial direction is wrong, the conclusions may drift further and further from
    the truth.


    For situational awareness, big data processing algorithms need to be determined
    based on time, situation, and event. One-sided or rigid algorithms will produce
    serious errors, while full human intervention will introduce certain subjectivity.
    The contradiction between the two needs to be well coordinated and resolved to
    truly enhance the effectiveness of perception. At the same time, different data
    scenarios, requirements, and application scenarios also determine the differences
    or pros and cons of the algorithms used. Only in the process of continuously adjusting,
    correcting, and testing and comparing relevant algorithms can the most efficient
    algorithms close to the laws of reality evolution and development be found.


    Discovering the laws of risk evolution and early warning intelligence through
    big data analysis methods provides necessary decision support for effectively
    combating and preventing risks. The continuous advancement of informatization
    in the field of national security has brought about the continuous improvement
    and enhancement of information and data awareness among various departments, which
    has also led to the generation of massive amounts of data in actual work. Within
    such vast-scale data lies valuable content yet to be discovered. To effectively
    utilize massive data, specialized and efficient analysis tools are essential.
    The practical application of data mining-related technologies will be an important
    way to effectively solve this demand.


    The development of computer application technology can be roughly divided into
    three aspects: numerical computation, data processing, and knowledge processing.
    Among them, numerical computation mainly focuses on algorithm research; the main
    object of data processing is massive data, and database language is its most representative
    language. With the development of technology, information management systems emerged
    based on databases, mainly functioning to facilitate querying, modification, and
    aggregation of databases, and to provide required calculation results in a timely
    manner to improve database management efficiency. However, actual work has found
    that for complex systems, relying solely on manual methods to propose calculation
    indicators makes it difficult to effectively manage databases. At this point,
    the most effective solution is to have computers replace manual labor in optimizing
    models and then proposing specific solutions.


    The longer a database is used, the more data it accumulates. With the massive
    collection and accumulation of data, it becomes exceptionally important to mine
    useful information from it using effective methods. Solutions are always born
    alongside problems. Bill Inmon, the father of data warehousing in the US, proposed
    the concept of a data warehouse in *Building the Data Warehouse*: a data warehouse
    is a subject-oriented, integrated, relatively stable, time-variant collection
    of data that supports management decision-making. Its main function is to reorganize
    and process data scattered across different platforms to form a dataset primarily
    oriented toward decision-making. The most fundamental characteristic of a data
    warehouse is that its data is not newly generated or proprietary data, but a re-integration
    of data from other databases. The establishment of a data warehouse does not replace
    the original databases but establishes a more comprehensive and complete information
    application platform to support high-level decision analysis.


    A data warehouse is a new application developed on database technology. Its most
    prominent feature is the use of a database management system to manage data, reflected
    in four characteristics: subject-oriented, highly integrated, system stability,
    and large data volume. During operation, a data warehouse also requires front-end
    access tools such as visualization tools and Online Analytical Processing (OLAP).
    Visualization tools display data graphically to understand the characteristics
    of data structures. OLAP enables online analysis functions. Mining and analyzing
    useful information from such long-term accumulated data to achieve the main task
    of knowledge discovery. `Data Mining` is the processing procedure of `Knowledge
    Discovery in Database` (KDD) and is also the most critical step in knowledge discovery.
    Its specific meaning is the process of extracting potentially useful information
    from a database according to specific requirements.


    Artificial intelligence, statistics, etc., are also the most commonly used tools
    for knowledge discovery and data mining. The concept of artificial intelligence
    was first proposed at a seminar held at Dartmouth College. By the early 1970s,
    artificial intelligence entered a new peak of development, producing a large number
    of successful expert system applications. In the late 1980s, artificial neural
    network research pushed artificial intelligence to a new height again. Branches
    related to artificial intelligence, such as expert systems and machine learning,
    are also developing rapidly. Typical expert systems in real cases have two parts:
    one is knowledge base + inference engine + human-computer interface, which is
    somewhat similar to the aforementioned decision support systems; the other is
    artificial neural network systems, mainly implementing functions such as statistics,
    regression, and clustering. Knowledge discovery and data mining comprehensively
    apply these technologies to discover patterns from large amounts of data, extract
    models, and form new knowledge. Although there is specialized software now, the
    technology cannot be said to be very mature. People have realized that using data
    mining technology to find information relevant to industry work is a necessity
    for every industry to adapt to the development of the information age. Therefore,
    the effective application of data mining technology in various industries is gradually
    receiving research and attention.


    The *Cihai* dictionary explains "intelligence" as: "Situations concerning the
    enemy''s military, political, economic, and other aspects obtained by reconnaissance
    or other methods, as well as the results of analysis and research on these situations";
    "Generally refers to all latest situation reports, such as scientific and technical
    intelligence."


    Social security risk intelligence work utilizes various technical means to collect,
    analyze, assess, and synthesize content, ultimately forming various forms of risk
    intelligence products. With the development of modern information technology,
    users can obtain more resources with the help of databases and search engines,
    and conduct preliminary analysis and assessment through data analysis systems.
    Among general information acquisition and analysis means, data mining is one of
    the most important technologies. Users can use data mining technology to build
    a comprehensive and efficient intelligence analysis and early warning system.
    Under the new international environment and historical context, relying solely
    on intelligence personnel to conduct data analysis through induction and reasoning
    cannot meet the needs. Supported by existing technical conditions, developing
    data mining and analysis systems suitable for departmental business characteristics
    will be the only way to enhance risk intelligence discovery capabilities, win
    the initiative in governance, and thereby build a modern social risk governance
    system.


    ## 4.3 Risk Data Mining


    Data mining refers to the process of searching for hidden useful information and
    knowledge from large amounts of incomplete, noisy, fuzzy, and random data through
    algorithms. Its essence is the application technology for discovering new knowledge.
    With the rapid development of information technology, the volume of data accumulated
    by people continues to grow at high speed. The most obvious sign is that data
    scales measured in `TB` have become the norm for data mining. How to extract the
    useful information we need from massive data is the core purpose of data mining.


    The essence of data mining is to extract or mine useful knowledge from large amounts
    of data. `Knowledge Discovery in Database` (KDD) is a broad term for data mining,
    specifically referring to obtaining knowledge from information expressed in various
    media according to different needs. The purpose of knowledge discovery is to filter
    out the tedious details of raw data for the user, refine meaningful and concise
    knowledge from raw data, and report it directly to the user. Data mining is a
    specific step in knowledge discovery. The difference between them can be understood
    as: knowledge discovery is more general than data mining, while data mining is
    a more specific and in-depth concept. The knowledge discovery process consists
    of the following iterative sequence: data mining, pattern evaluation, and knowledge
    representation. Data cleaning, data integration, data selection, and data transformation
    are different forms of data preprocessing for mining preparation. Data mining
    steps can interact with the user or knowledge base. Interesting patterns are presented
    to the user as new knowledge or stored in the knowledge base. In a narrow sense,
    data mining is just one step in this process, albeit a very important one. In
    a broad sense, data mining is the process of discovering interesting knowledge
    from large amounts of data stored in databases, data warehouses, or other information
    repositories.


    ### Classification of Data Mining Tasks


    Data mining tasks can generally be divided into two categories: one is predictive
    tasks, whose goal is to predict the value of a specific attribute based on other
    attribute values. The predicted attribute is generally called the target variable,
    while the attributes used for prediction are called explanatory variables. The
    other is descriptive tasks, whose goal is to derive patterns summarizing the underlying
    relationships in the data. Descriptive data mining tasks are usually exploratory
    and often require post-processing techniques to validate and explain results.


    Specific tasks include the following six categories:


    1.  **Summarization**. The purpose of data summarization is to concentrate data
    and describe it concisely. Traditional methods calculate the sum, average, variance,
    etc., of each field in the database, or use graphical methods for representation.
    Data mining mainly focuses on discussing data summarization from the perspective
    of data generalization. The specific concept of data generalization is an analysis
    process that abstracts and summarizes a large amount of task-relevant data in
    the database from relatively low-level concepts to higher-level concepts. Since
    data or objects in a database always contain the most original and basic information,
    this is to avoid any omission of useful data information. For the convenience
    of data use, users often hope to process or browse data from a higher-level view;
    therefore, generalizing data to different degrees is for the convenience of querying.

    2.  **Classification**. Classification finds the common characteristics of a group
    of data objects in the database and divides them into different classes according
    to a classification model. Its purpose is to map data items in the database to
    a given class through the classification model. Generally, classification and
    regression can be used for prediction. The purpose of prediction is to automatically
    derive extended descriptions of given data from historical data records, thereby
    predicting future encountered data. The biggest difference between classification
    and regression is that classification outputs discrete class values, while regression
    outputs continuous numerical values.

    3.  **Clustering**. Clustering, also known as cluster analysis or segmentation,
    groups cases based on a set of attributes. Cases in the same cluster have more
    or less similar attribute values. Cluster analysis divides a set of data into
    multiple categories based on similarity and difference. Its purpose is to maximize
    the similarity between data within the same category and minimize the similarity
    between data in different categories. Clustering methods include statistical methods,
    machine learning methods, neural network methods, etc.

    4.  **Association**. Data association is a class of important discoverable knowledge
    existing in databases. Specifically, if the values of two or more variables exhibit
    some regularity, it is called association. Association can be divided into simple
    association, temporal association, and causal association. The purpose of association
    analysis is to find the hidden association network in the database. However, in
    many cases, we do not know the association function of the data in the database,
    or even if we know it, we are not certain; therefore, the rules generated by association
    analysis carry a confidence level.

    5.  **Sequential Patterns**. Sequential patterns refer to patterns with a high
    probability of recurring discovered through time series. Like regression, it uses
    known data to predict future values, but the difference lies in the different
    times at which the variables are situated.

    6.  **Deviation Analysis**. Deviation analysis, also known as comparative analysis,
    refers to the description of differences and extreme special cases, used to reveal
    abnormal phenomena where things deviate from the norm. There are many abnormal
    situations in database data. They are inconsistent with the general behavior or
    model of the data; such data objects are also called outliers. Most data mining
    methods treat outliers as noise or exceptions and discard them. However, in some
    applications, rare events may be more valuable and significant than regular events.
    Databases of anomalous data are very important. The basic method of deviation
    detection is to find the difference between observed results and reference values.


    ### Data Mining Methods


    Data mining methods are generally divided into the following categories:


    1.  **Genetic Algorithms**. A genetic algorithm is an adaptive global optimization
    probabilistic search algorithm used to simulate the genetic and evolutionary processes
    of organisms in a natural environment. It was first proposed by Professor `John
    Holland` of the Computer Science and Psychology departments at the University
    of Michigan. This algorithm features simple computation and good optimization
    effects. It also has certain advantages in handling combinatorial optimization
    problems and can be used for cluster analysis.

    2.  **Rough Set Method**. Rough set theory, as a theory for data analysis and
    processing, was founded by Polish scientist `Z. Pawlak` in 1982. The theory was
    initially proposed due to language issues. The first international academic conference
    on rough set theory was held in Poland in 1992. In 1995, `ACM` listed rough set
    theory as a research topic in emerging computer science. The rough set method
    is widely used in classification and knowledge acquisition for imprecise, uncertain,
    and incomplete information.

    3.  **Decision Tree Method**. Colloquially, the probabilities of natural states
    or conditions of a decision problem, action plans, gain/loss values, prediction
    results, etc., are represented in a tree diagram, which reflects the entire process
    of human thinking, prediction, and decision-making. The decision tree method uses
    a training set to generate test functions, establishes tree branches based on
    different values, and repeatedly establishes the next layer of nodes and branches
    in each branch set. Thus, a decision tree is generated, then pruned, and finally
    converted into rules, mainly used for classification and mining.

    4.  **Neural Network Method**. An artificial neural network simulates the human
    way of thinking; it is a nonlinear dynamical system. Its characteristics lie in
    the distributed storage of information and parallel collaborative processing.
    Although the structural function of a single neuron is limited, the network system
    composed of a large number of neurons can achieve extremely rich and diverse behaviors.

    5.  **Fuzzy Logic**. It mainly mimics the human brain''s uncertain concept judgment
    and reasoning thinking mode. For systems with unknown models or indescribable
    systems, as well as control objects with strong nonlinearity and large hysteresis,
    it uses fuzzy sets and fuzzy rules for reasoning, expresses transitional boundaries
    or qualitative knowledge experience, simulates the human brain mode, performs
    fuzzy comprehensive judgment, and reasons to solve rule-based fuzzy information
    problems that conventional methods struggle with. In the field of data mining,
    fuzzy logic can be used for fuzzy comprehensive discrimination and fuzzy cluster
    analysis.

    6.  **Cluster Analysis**. Cluster analysis groups or classifies things according
    to their characteristics. It discovers patterns and typical models from them.
    After clustering, the dataset is transformed into clusters; the same class has
    similar data variable values, while different types of variable data values do
    not possess similar properties. This technique is the most important technique
    in data mining.


    ## References


    [[1].](#Chapter_8_1.xhtml#BT5) `MapReduce` is a programming model used for parallel
    computing on large-scale datasets.


    [[2].](#Chapter_8_1.xhtml#BT6) The State Council: *Outline of Action for Promoting
    the Development of Big Data*, Ministry of Commerce of the People''s Republic of
    China website, http://www.mofcom.gov.cn/html/nysczl/2018/9/1536891477862.html.


    [[3].](#Chapter_8_1.xhtml#BT7) Christoph koutschan: *The Most Core Key Technology
    of Big Data—32 Algorithms*, `CIO` Era Academy website, http://www.ciotimes.com/bigdata/169572.html.


    [[4].](#Chapter_8_1.xhtml#BT8) Wang Bing, Wu Chao: *The Origin, Evolution Trend,
    and Connotation of the Concept of Security Intelligence—Speculative Thinking from
    the Perspective of Safety Science*, *Library and Information Work*, Issue 3, 2019,
    pp. 45–53.


