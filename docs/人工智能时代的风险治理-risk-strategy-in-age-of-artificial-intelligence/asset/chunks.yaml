- raw: '第二，基于数据的风险预警研判决策已成趋势。身处大数据时代，积极运用数据实现决策的科学性已成必然。对于数据的获取和收集，在技术上早已不是问题。那么，如何更好地利用这些数据则是技术研究及发展的方向。通过实际舆情工作及技术模型分析，公共事件知识库比对，是行之有效的数据分析研判工作方法。通过公共事件知识库，可以从众多相似舆情案例中抽取出共同特征和相似趋势，找出决定舆情发酵的关键因素，为舆情应急响应和处置提供有力支撑。基于数据的公共事件知识库系统本身也蕴含了科学精准的操作流程和分析研判，减少了因相关人员经验、能力的不同而导致的工作上的偏差。


    第三，创新应急管理工作理念新要求。当前，国家大力倡导大数据技术的现实应用。政府部门需要在工作方法、技术运用上与时俱进，跟上网络时代的新步伐、新节奏。与此同时，在舆情工作上也要创新思维。基于各机构系统舆情事件多发、分布范围广泛、舆情根源趋同等特征，能够充分发挥公共事件知识库系统舆情研判的优势。不仅如此，采用公共事件知识库系统，还能全面把握涉及社会系统舆情的整体发展趋势，随时掌握涉事主体和关注重点的转移和走向，紧密跟上网络舆论场的新特点、新趋势，为创新社会系统其他工作内容提供借鉴与思路。


    第四，对风险过程进行全流程记录分析。公共事件知识库系统的一个重要环节就是对于历史事件的还原与记录。当前，数据存储技术已经十分成熟，将过往舆情案例进行妥善记录保存，对于社会系统今后舆情工作的开展具有十分重要的意义。公共事件知识库，不仅仅是一定时期内的、具有阶段特征的各个案例的比较分析和概括归纳，更涉及跨时段的、从长周期来考察的各个案例的比对，即横向比对和纵向比对。所谓“横看成岭侧成峰”，多种比对方式有助于对舆情的理解和分析。公共事件知识库系统具有对舆情事件的全流程保存记录的能力，不会出现因时过境迁或信息删除而导致的信息残缺的困扰。


    第五，化繁为简提高风险治理效率。对于新技术的应用，实际上正是化繁为简、提高实际工作效率的必然手段。大数据时代，不仅纯人工分析研判舆情早已不可行，使用非专业的、非针对性的舆情收集研判系统，一样会导致出现各种偏差与失误，从而增加相关工作的负担。使用针对社会系统舆情事件特点而量身定做的公共事件知识库系统，能更好地有效抓取和收集相关舆情，不让无关信息淹没真正重要的内容，还能根据使用人员的使用习惯和关注重心，进行有针对性的调整。在进行舆情处置时，科学的公共事件知识库与风险评估，能够让相关处置方案有的放矢、有据可依，提高舆情工作效率。


    第六，公共事件知识库提升风险应对水平。公共事件知识库系统是一种技术，提供的系统平台是基于科学的数据模型而运行的，但这并不意味着舆情处置就会是冷冰冰的、没有人情温度。恰恰相反，利用数量巨大的成功的舆情处置范例，系统既可以找出那些应对过程中制度化的、流程化的“硬”手段，也能发现起到了安抚涉事者情绪、触动网民大众心理的“软”手段、“软”细节，从而为新的舆情事件应对提供人性化处置的重要参考意见。同时，系统接入专家智库的会商研判，更能增加处置的灵活性与机动性。舆情处置的人性化，既是应对舆情态势新变化的必要手段，本身也是舆情处置的意义之所在。系统平台的引入，将进一步增强对网民情绪变化的分析与研判，从而抓住能够“直指人心”的核心诉求，快速平息舆情演化过程中的负面情绪。


    第七，辅助决策和预警成为网络风险治理方向。公共事件知识库系统及其工作方法，还处于初步形成阶段，但已经展现出了相当大的潜力和极为长远的应用前景。未来，相关工作及技术应用仍将向纵深化发展，主要表现为以下几个方面。


    1．基于公共事件知识库的舆论风险态势感知


    人工智能并不像一些人预测的那样能很快出现，但基于现实应用的浅层次人工智能确实已经逐渐成为当前技术应用的一个趋势。可以预见，公共事件知识库系统的迭代升级，可以充分利用人工智能的特点和优势。在舆情监测、分析和应对举措的制定中，辅助性的人工智能完全可以基于各种公共事件知识库中感知到的异同点，推出千变万化的有着针对性差异的监测、分析和应对方案，为人脑决策提供涵盖全面的信息和路径最优方法。同时，基于人工智能的自主学习能力，在长期的舆情监测工作中，系统将不断熟悉和学习社会舆情的特点和一般规律，为系统的升级更新提供参考意见，并能根据实时大数据的拓扑结构变化，推测舆情态势，为人脑预测提供预警性质的参考信息。人工智能有不断的自主学习能力，具有滚雪球式的发展效果，最终将使得整个系统能够高度贴合社会舆情工作的实际。


    2．打破地域局限的网络空间治理协同工作指导


    在网络空间治理工作环节，许多部门缺乏统一的、垂直整合的指导平台。在网络综合治理不断提档升级的背景下，统一平台、统一管理、统一指导、统一考核的工作方法必然成为一种趋势。网络公共事件知识库系统能够满足统一的、全国联网的、同步更新的技术平台的要求，可以不再受制于地域区隔，能有效解决“上级监管太远”的窘境。不仅如此，打破地域局限，客观上也符合网络舆情的特征，有利于从全国一盘棋的角度总体指导各地的舆情工作，避免“按下葫芦浮起瓢”式的被动应对。


    利用公共事件知识库系统，也有利于各地案例处置的数据统一收集、上传和保存，使得案例数据做到全国共享，相关经验全国各地都能汲取和借鉴。统一的系统平台，也有助于各地舆情工作人员树立舆情工作的大局意识，进而实现网络空间治理工作的统一步调。


    3．实现事件处理与舆情处置的同步展开


    实际网络空间治理工作中，单线条的舆情处置正在弱化，基于事件处置和舆情处置同步展开的双线条模式已经成为共识，在很多成功的舆情应对案例中，都能看到线上线下紧密联动处置所产生的“一加一大于二”的效果。但这样的紧密联动的成功案例，有时是无心插柳，有时是天时地利人和诸多因素合力而成的结果。公共事件知识库系统的发展，能够实现网络空间治理应急平台和应急指挥平台的同步推送，通过系统内更新推送实现网络公共事件态势实时展现，从而为现场处置提供线上态势的参考。此外，系统还具备打通多部门协同处置的功能，为跨部门的协同处置提供必要支持。事件处置和风险处置的同步展开，有利于线上和线下应对的灵活性与机动性，以此适应瞬息万变的网络空间风险发展态势。


    4．公共事件知识库的形式实现多样化


    现实中的突发网络公共风险状况，往往是千变万化，特点也各不相同。公共事件知识库系统的建设和发展，着眼于充分挖掘数据背后的价值与规律，形成具有针对性的比对形式与呈现方式，如视频音频比对、指数比对、非格式化的信息比对等。总而言之，公共事件知识库的形式，还有很大的探索空间，甚至可以和视觉虚拟增强技术相结合，使用者可在虚拟现实效果中，对信息进行推演与比对，从而得到不同的处置结果。凡此种种，都将是未来公共事件知识库系统的发展方向，同时也为网络空间风险治理工作的科学化提供了可能。


    # 第六章 网络风险治理应用场景


    ## 6.1 公共事件知识库和网络风险治理决策


    随着互联网技术的普及与发展，传播领域也发生了根本性的变革。由于网络的虚拟性、隐蔽性、发散性、渗透性和随意性等特点，促使广大民众慢慢习惯于通过网络渠道来表达观点和态度。网络媒体已经被公认为是继报纸、广播、电视之后的“第四大媒体”，网络平台也成为反映社情民意的主要载体之一。基于此种变化与趋势，网络综合治理已经成为社会治理的重要环节。


    做好网络舆情工作是摆在网络综合治理工作面前的首要任务，无论是党政机关还是各企事业单位，纷纷在网络舆情工作中投入大量的人力物力财力，但在实际操作过程中，仍存在因方式方法欠佳而饱受舆论诟病的情况。因此，加强网络风险应急管理工作体系建设，创新工作体制机制已经成为各社会主体亟待解决的问题。


    党的十九大报告中明确强调，要“加强和创新社会治理”，提高“国家治理体系和治理能力现代化水平”。从网络风险治理工作中的技术环节来看，现阶段我国大多数的舆情技术系统都是在做网络信息的监测和预警，在搜索方面也是基于关键词的搜索，该技术手段仅着眼于“当前”，信息所呈现的状态也是“正在进行时”，信息的价值并没有完全释放出来。通过大量的舆情处置经验来看，对过往舆情案例的全流程复盘，能够有效指导正在发酵中的舆情的处置工作，甚至可以预测未来工作中所存在的舆情风险，从而使舆情工作有的放矢、未雨绸缪。公共事件知识库和基于案例知识的专家决策系统就应运而生。在充分融合大数据及人工智能技术的基础上，实现历史舆情案例与现实突发舆情事件的实时比对，该技术对创新舆情工作有着积极的作用与实际效果。


    从主流的技术应用来看，目前，市场上所推出的各类舆情系统和应用，基本上都是平面结构的收集分析体系，其收集分析的数据信息是跟在网民情绪后面，是到“此时此刻”为止的，因此，在实际应用中存有三大痛点：一是没有与历史同类事件相关联比对，其参考价值也仅限于对单一事件的把握；二是缺乏对舆情发展演化进行推导，预判的能力有限；三是平面的数据语言有异于人的解决问题思路，对网络情绪变化不能形成动态感知。


    通过对实际舆情工作的研究分析发现，成功的舆论危机应对经验值得总结和借鉴。研究发现，对典型公共舆情事件的各个时间段和维度上的量化分析，能够发现这些网络事件背后的必然发展逻辑，同时，通过对以往舆情个案的特征和标签体系进行系统梳理复盘，能够对当前正在发生或未来可能会发生的各类网络舆情进行科学的趋势研判，有效提升网络管理部门和相关业务部门的舆情应对水平。


    从国家层面来看，2017年12月8日，中共中央政治局就实施国家大数据战略进行的第二次学习中，习近平总书记强调：“要运用大数据提升国家治理现代化水平，要加强互联网内容建设，建立网络综合治理体系，营造清朗的网络空间。”


    基于舆情工作的实际需求与国家对大数据相关工作的部署，实现舆情技术的提档升级已经成为当务之急。因此，科学部署公共事件知识库系统符合时代要求，是大势所趋。


    公共事件知识库比对系统不再只是网络管理部门“平面的、化验单式的舆情呈现”，而是进行“立体智能化的公共事件知识库”。它的投入使用，将全面替代传统舆情系统，其开发理念和技术逻辑，是对传统舆情系统的颠覆，该系统能更全面地呈现舆情信息的相关关系，利用系统既有的历史案例库，对舆情事件进行实时比对，帮助网络管理部门更快地掌握类似事件的发展形态，以历史经验来预测未来走势，让舆情处置和网络风险治理决策更有针对性。


    公共事件知识库系统通过网情态势、态势统计分析、事件回溯分析、案例对比、决策支持、事件搜索、政策研判等基础模块，在满足用户舆情监测预警的基础上，让用户研判及决策时，能够有相关的事件及经验进行参考，打破原有的单条信息输出模式，以更加直观的、立体的案例来进行动态比对，从而避免现实舆情处置“在同一个地方摔倒两次”。


    在实际应用中，公共事件知识库系统以技术为支撑，以专业的智库团队为配合，将舆情风险测评、舆情监控、舆论态势感知、专家报告、智库建议等融为一体，覆盖到了重大决策的事前、事中、事后全流程，提高网络风险治理工作的成效。


    传统的网络舆情管理思维面临重大升级，否则，将严重滞后于社会风险治理所需，用网络风险治理体系迭代网络舆情管理体系已经是大势所趋，也是社会发展的必然之选。


    ## 6.2 基于知识库的重大决策风险研判


    随着互联网、大数据、新媒体时代的不断发展，网络本身的虚拟性、隐蔽性、发散性等特点促使更多人愿意通过网络渠道来表达利益诉求，放大自己的声音。突破时间、地域限制的利益发声渠道，激发了公民参与社会问题的讨论，满足了诉求表达的愿望，也正是因为网络时代的发展和利益诉求的交织作用、群体的共情效应激发网络舆情的发生。网络舆情传播速度快、影响广泛而深刻、具有社会动员的潜力，特别是受到不当操控的负面舆情可能导致对个人权益的侵犯、对公权力合法性的冲击、政府公信力的降低以及对公共利益的损害。


    近年来，社交媒体对于突发事件、社会民生、环境保护等热点事件进行讨论，舆情瞬间扩散能力强，许多热点事件传播以“亿”为单位。如：空姐深夜滴滴打车遇害事件（2018年）、警察打人事件、拼多多卖假货事件等。网络舆情参与主体多元，舆情传递性强等特点在一定程度上导致了公共舆论的极端化与不真实性，肆意编造的谣言，骇人听闻的传言严重破坏了社会公共秩序，损害了政府形象。因此，需要从源头上预防和减少重大网络舆情风险，充分利用大数据、人工智能等新技术，深入研究引发影响社会稳定的网络舆情产生演变的规律，基于网络事件知识案例库比对系统的运用，提高网络舆情风险预测预防能力，实现重大网络舆情风险的识别研判与早期智能预警。


    （一）新媒体时代网络舆情的特征


    互联网与新媒体时代改变着社会传播的生态，对舆情的影响力也不断增强，逐渐成为网络舆情发起与传播的重要力量，呈现出网络舆情环境中公众参与更活跃、舆情议题更集中、舆情参与讨论渠道更多样等特征。


    1．舆情主体结构多元，隐匿性强


    随着互联网与新媒体的不断发展，越来越多人通过网络渠道参与社会热点话题的讨论，网络的隐匿性更激发了社会公众参与问政的热情。舆情参与主体大多包括普通网民、意见领袖、网络媒体等，因参与主体的年龄结构、职业结构、学历结构等差异呈现了舆情主体结构多元的特点。虚拟的网络环境与匿名的参与方式促使网络舆情发生的隐匿性更加强烈，部分网民通过网络名称的掩盖、IP地址的隐藏隐匿在网络上发表意见，网络本身的这种隐匿性特征在很大程度上决定着网络舆情隐匿性的特点。


    2．舆情议题领域广泛，开放性强


    互联网畅通了民主表达的渠道，社会公众依托互联网技术和移动终端可以打破时间、空间的限制，随时随地发表观点，提升了社会公众参与社会议题的便捷性。互联网在实现信息资源深度共享的同时，还打破了传统媒体对议题设置的垄断，普通民众通过论坛、微博等媒介参与议题的讨论与交流，并以转发、评论等形式进行双向互动，增强了舆情议题参与的互动性与开放性。互联网和新媒体传播的即时性也使人们关注的话题更时效，参与讨论的话题愈发广泛，特别是关系社会公众切身利益的话题更为集中，舆情议题包含了经济、文化、教育、医疗、就业等多方面。


    3．舆情信息传播迅捷，互动性强


    网络技术的快速发展，微博、微信等新媒体的快速崛起，为信息的传递、网民的互动交流提供了便利。网络参与渠道的拓展与参与平台的不断完善使得人人都能表达自己的声音，人人都是信息的接收者，人人都可是信息的发布者。信息传递的快捷性使得一旦有舆情发生，便可以在最短的时间内实现跟帖、转发、扩散，最终覆盖整个网络。自媒体加快了由“自上而下”向“自下而上”的信息传播方式的转变，推动了话语权向大众化、平民化的转变，增强了互动性，激发了公众的参与性与活跃度。


    4．舆情获取渠道多样，复杂性强


    网络和新媒体的快速发展突破了传统信息获取的方式，微信、微博等自身具有的平民化和草根性，呈现出交互性强、门槛低、传播快等特征，已逐渐成为公众表达舆情、传递声音的重要窗口，网络舆情获取渠道的多样性为网络舆情促生、发酵、井喷提供重要的载体。网络舆情获取渠道多样性也使网络舆情管理难度增大，复杂性增强。


    （二）重大网络舆情的潜在风险


    随着传播渠道的不断完善，网络舆情事件愈发呈现多发趋势，“蝴蝶效应”凸显，使整个社会舆论产生狂风骤雨般的变化。近年来，社会各领域重大网络舆情事件频发，给社会和谐秩序与公权力造成负面影响，网络舆情潜在风险凸显。


    1．虚假信息和网络谣言，增大社会公众认知风险


    网络信息包罗万象，内容复杂，在海量的信息中虚假信息让我们难辨真伪，网络传播速度快使得网络谣言在网络环境中快速相传，加大了社会公众的认知风险。网络谣言的肆意传播与扩散，使得社会公众面对信息难辨真伪，众说纷纭，事实真相被淡化，无疑增加社会认知阻碍。潜在的认知风险在很大程度上影响着社会公众对事物的认知、分析、辨别的能力，加强风险识别与智能预警是消除潜在风险的内在动力。


    2．群体极化和网络暴力，加剧公共权力道德风险


    复杂的网络世界中，多元主体互动交流为网络谣言的传播制作“嫁衣”，谣言一旦被人相信并广泛传播，就会引发“滚雪球效应”。在社会热点讨论中，当强势的声音成为主流意见时，“沉默螺旋效应”发生，对抗的力量被淹没，从众心理和群体极化现象凸显。当谣言逐渐占据主流舆论的位置，社会秩序受到冲击，一旦政府沉默不发声，应对不及时，公民对政府的信任下降，政府形象受损，公信力下降，加剧公权力道德风险。


    3．意识渗透和跨境传播，促使文化渗透风险凸显


    互联网语境下，新的话语建构和传播体系一定程度上消解着主流意识形态传播的经典范式，由于互联网传播的即时性、开放性和全球化特点，在国际和跨境政治传播过程中存在着更大的意识形态安全隐患。信息全球化发展背景下，西方极端意识形态文化，如历史虚无主义、普世价值观通过网络进行宣传，港澳台极端社会思潮对内地意识形态安全容易形成渗透风险，国家意识形态安全受到挑战。


    4．官方舆情管制和应对不当，激发危机的处置风险


    网络舆情传播迅速，舆情爆发后引起社会的广泛关注，如果官方把控社会关注点、转折点和峰值点的准确度出现偏差，不能围绕舆论关注的焦点、热点和关键问题，进行实事求是、言之有据、有的放矢的回答，舆情处理不当，将会陷入“塔西佗陷阱”。特别是突发事件中，如杭州狗狗友好型城市的建设事件中，政府面对舆情处理不当，激发危机处置风险，使政府形象遭遇网络舆情“达摩克利斯之剑”。


    5．媒体报道缺位和失焦，导致舆情传播风险加大


    媒体对舆情的介入能够在一定程度上还原事实真相，但是部分媒体为了吸引眼球，博取受众的注意力，进行选择性报道，导致公众认知出现偏颇，引发负面效应。同时，在一些重大突发事件中，由于外力干预及自身缺少新闻敏感，常常出现媒体失语的情况，如在天津港爆炸事件中，现场情况早已在微博、微信等自媒体上铺天盖地传播，然而天津本地主流媒体却长时间严重失语。媒体报道的失焦与缺位严重加剧了舆情传播的风险，加强舆情风险预警，降低舆情传播风险至关重要。


    （三）知识案例库比对系统网络舆情风险识别与预警的现代价值


    知识案例库比对系统网络舆情风险识别与预警是提升我国危机治理水平的内在动力，是舆情风险治理的重要工具，是推进我国治理能力和治理体系现代化的重要抓手。“知识案例库比对系统”是对传统舆情系统的继承和颠覆，通过智能比对，系统能更全面地呈现舆情信息的相关关系，利用系统既有的历史案例库，对舆情事件进行实时比对更快地掌握类似事件的发展形态，以历史经验来预测未来走势，及早地进行舆情风险识别与智能预警，让舆情处置和决策更有针对性。


    1．历史数据与现实决策的对比，提升决策的系统性与科学性


    知识案例库比对系统能够实现历史数据与现实决策的对比，充分利用大数据技术与语义案例库实现历史数据的收集、整理、分析，将现实决策与历史数据中的典型公共事件从各个时间段和维度上进行量化分析，探寻网络事件背后的必然发展逻辑，分析各种因子对事件演变、发展、转化的规律。通过历史与现实的对比分析，对现实事件中正在发生或未来可能会发生的各类网络事件进行趋势研判和态势的感知，提升现实决策的系统性、即时性、科学性，提高舆情应对能力，提升舆情治理水平。


