    ## 7.2 Dilemmas in Governing Online "Water Armies" (Paid Posters)


    Public opinion holds that online water armies can smoothly evade regulatory crackdowns
    and platform blockades, and conduct business amid netizens'' distrust, which may
    be related to their increasingly strong planning and guidance capabilities; they
    can manipulate public opinion without leaving a trace. *Liberation Daily* reported
    that online water armies are not as "simple and crude" as imagined; there should
    be planning teams "playing a grand game of chess" behind them. There are even
    more "professional" water army teams; for instance, on certain Q&A platforms,
    discussions like "Is XX virtual currency worth investing in?" are common. Respondents
    often claim to have overseas returnee backgrounds with high degrees, speak convincingly,
    and their like counts and comment counts are astonishingly high.


    ### 4. Practitioners'' Vague Cognition: Treating Water Army Operations Merely
    as Business


    The water army industry continues to rage under strict regulation. Besides the
    pursuit of profit, this is also due to practitioners'' vague understanding of
    the industry, viewing participation in water army business merely as a job. Public
    opinion believes that it is precisely because practitioners lack clear understanding
    that they choose to continue in this line of work. Zhihu author @Macheng, when
    answering the question "What is it like to be an online water army?", stated that
    what most water armies engage in is actually a very normal advertising activity;
    water armies are essentially a type of online coolie labor, not much different
    from traditional odd jobs like handing out flyers or wearing mascot costumes.


    ### 5. Relatively Dispersed Water Army Teams, Making Crackdowns Relatively Difficult


    Online water armies are scattered across the entire cyberspace, requiring only
    online contact to conduct business. Public opinion believes that online water
    armies rely on the dispersed nature of cyberspace to evade supervision and crackdowns;
    even after successive heavy-handed governance, they may still "rise from the ashes."
    *China Voice''s "News Panorama"* reported that in July 2017, under the command
    of the Ministry of Public Security, 21 provinces, autonomous regions, and municipalities
    nationwide carried out a clustered net-closing operation on the "San Da Ha" online
    water army case, arresting 77 criminal suspects, with an involved amount of nearly
    4 million yuan. The case involved a wide geographic area, a large number of personnel,
    and complex networks.


    The dispersed nature of water army personnel also brings difficulties to technical
    governance. Cybersecurity engineer Li Tiejun believes that cracking down on the
    gray industry of the internet involves very high technical difficulty.


    ## 7.3 Risk Governance in an Open Context Society


    The masses'' joint prevention, joint governance, and joint management in the all-media
    era should become the rational paradigm and governance path for cyberspace governance.
    Risks in a risk society are ubiquitous; a single control model will inevitably
    consume enormous human and social costs. If every social individual is regarded
    as a risk-sensing front-end and a peripheral nerve of risk perception, and feedback
    is rapidly transmitted to the risk governance decision-making chain through orderly
    and effective channels, this is the optimal mechanism for mass prevention and
    governance of risks.


    There is a very important premise here: attempting to build a risk perception
    network under an open social system. This requires an open network context and
    a network governance strategy with highly transparent information. Establishing
    an efficient, collaborative, complementary, trusting, and harmonious network communication
    environment is crucial. This is the foundation of the modern risk governance system
    and the most powerful risk governance avoidance mechanism, as well as the strongest
    guarantee when responding to risks.


    Mao Zedong once said: "Heavy rain in Guangdong must be reported truthfully and
    publicly. National disaster conditions should also be reported openly to arouse
    the people to fight with all their strength. Not a single bit should be concealed.
    Government relief and people''s production self-rescue must be reported and advocated
    vigorously. Major industrial accidents and disasters should also be reported,
    with a focus on countermeasures."[[1]](#`Chapter_11_3.xhtml#B15`)


    ---


    [[1].](#`Chapter_11_3.xhtml#BT15`) Mao Zedong: *Selected Works of Mao Zedong on
    News Work*, Beijing: Xinhua Publishing House, 1983, p. 214.


    ## 7.4 Current Status of Risk Response in Cyberspace


    ### (I) Current Status of Response at the Legal Level


    #### 1. National Laws and Regulations Increasingly Improved


    In November 2016, the *Cybersecurity Law of the People''s Republic of China* was
    promulgated. This is one of the series of legal systems concerning cyber and information
    security issued by China since 2017, providing a strong guarantee for the healthy,
    orderly, and secure development of the internet. The continuous improvement of
    laws and regulations helps purify the online environment and provides legal guarantees
    for the handling of some public opinion incidents.


    #### 2. Institutional Setup Relatively Systematic and Three-Dimensional


    Currently, China''s internet public opinion monitoring and management departments
    can be specifically divided into: MIIT (Ministry of Industry and Information Technology)
    and SAIC (State Administration for Industry and Commerce), MPS (Ministry of Public
    Security) and MSS (Ministry of State Security), central and local news offices
    and foreign propaganda offices, cultural departments'' press and publication departments
    and radio/film/television departments, and the China Internet Network Information
    Center (CNNIC), etc. Since the Central Propaganda Department established the Public
    Opinion Information Bureau, provincial Party committee propaganda departments
    have set up Public Opinion Information Divisions. This vertical management model
    enables the government to understand and monitor online public opinion in a timely
    and efficient manner, thereby achieving the goal of reasonably guiding the direction
    of public opinion.


    #### 3. Non-Governmental Public Opinion Institutions "Multi-Source Integration"


    Nowadays, many government departments have established vertically managed public
    opinion service institutions. To prevent public opinion monitoring means from
    being too singular, many government departments have joined forces with mainstream
    media, university research institutes, public opinion service enterprises, and
    other scientific research institutions to establish joint public opinion service
    institutions.


    #### 4. Degree of Information Disclosure Continuously Strengthened


    Government departments, relying on the internet, have built a government self-media
    system, possessing strong information release capabilities. They are more convenient
    and efficient in responding to public opinion concerns, with enhanced PR awareness.
    Governments at all levels have begun to deeply "touch the net," and the degree
    of government information disclosure has continuously increased, which can effectively
    alleviate public anxiety and resolve public opinion pressure.


    #### 5. Public Opinion Response System Preliminarily Improved


    Most government departments have been equipped with corresponding public opinion
    monitoring software, able to quickly capture public opinion information, reserving
    precious time for public opinion disposal. Public opinion response has accelerated,
    and the accountability of officials has increased. In addition, public opinion
    work has received increasing attention; some leading cadres have preliminary public
    opinion awareness, the theoretical system has been preliminarily improved, and
    some government departments have also formulated public opinion disposal processes.


    ### (II) Experience in Risk Response in Cyberspace


    #### 1. Normalization and Systematization of Public Opinion Theory and Practical
    Training


    Public opinion-related theory and practical courses are increasingly valued. Government
    department public opinion response and crisis management have become important
    tasks, and the public opinion literacy of Party members and cadres continues to
    improve.


    #### 2. Initial Results in Building Online Commentator Teams


    To reasonably guide online public opinion, some government departments have carried
    out the construction of "Red Big Vs" (influencers) and online commentator teams.
    They have shown initial effectiveness in guiding major public opinion incidents.


    #### 3. Enhanced Guidance Capability of Self-Media Alliances


    Government departments have established good relations with self-media alliances.
    Some self-media alliances have continuously enhanced their capabilities in guiding
    public opinion involving police and medical issues, winning public trust.


    #### 4. Gradual Improvement of Online Public Opinion Joint Defense Mechanism


    Among various government functional departments, between internal departments,
    and at the level of government-civilian interaction, a full-network linkage joint
    defense mechanism has gradually formed, enabling efficient problem detection and
    rapid disposal.


    #### 5. Construction of a Reasonable Public Opinion Response Process


    In terms of public opinion disposal, some government departments have formed a
    public opinion prevention, response, and disposal system featuring pre-event assessment,
    mid-event monitoring, and post-event summary. They have also built public opinion
    information collection platforms, forming a three-dimensional public opinion information
    monitoring system. The gatekeeping role of public opinion risk is increasingly
    prominent, eliminating potential public opinion crises.


    #### 6. Continuous Escalation of Accountability in Public Opinion Disposal


    To ensure online public opinion remains stable and controllable, government departments
    have taken multiple measures to actively strengthen and standardize public opinion
    disposal work. Accountability efforts have also continuously intensified, forcing
    disposal personnel to cautiously carry out relevant response work.


    #### 7. Dual Improvement in Technical Strength and Talent Reserves


    With technological development, the demand for public opinion monitoring technology
    has become increasingly urgent. Many technology companies have joined in, and
    public opinion monitoring technology and data volume have developed by leaps and
    bounds. In addition, public opinion disposal and crisis management have begun
    to be valued by academia and the industry, and corresponding public opinion talent
    cultivation has gradually caught up.


    ### (III) Dilemmas in Risk Response in Cyberspace


    #### 1. Awareness Level


    There is a relative lack of professional literacy in public opinion response.
    The willingness and ability to proactively guide public opinion are relatively
    insufficient. Awareness and skills in turning crises into opportunities are obviously
    inadequate. Public opinion response texts are overly bureaucratic, lacking humanistic
    care, insufficient to avoid negative media reports, and missing opportunities
    for public opinion disposal. A serious polarization has appeared in public opinion
    response awareness and capability: the higher the level of government department,
    the stronger the public opinion awareness and mobilization response capability;
    while grassroots government departments suffer from serious lags in both public
    opinion awareness and response capability. The concept of putting people first
    is weak; bureaucratic consciousness has not been thoroughly eradicated, and bureaucratic
    consciousness leads public opinion response astray.


    #### 2. System Level


    Although corresponding disposal processes and response mechanisms have been formulated,
    they remain largely on paper. Many good response plans and strategies remain only
    at the level of theoretical discussion. Some leading cadres still hold a "block,
    suppress, delete" mindset towards public opinion. A strong response system has
    not been formed, and the accountability mechanism is difficult to operate normally.
    There is a lack of quantitative assessment, as well as the determination and courage
    to take real action. Passive disposal is often not held accountable, thus breeding
    a serious "ostrich mentality."


    #### 3. Technical Level


    Government departments are equipped with public opinion monitoring technology
    and have corresponding personnel engaged in public opinion information monitoring
    and collection. However, the corresponding technical level is still relatively
    low. The amount of information that can be monitored and obtained is relatively
    limited. In addition, some local and grassroots government departments have relatively
    limited financial support. Public opinion monitoring technical strength is weak,
    even relying mainly on manual work. In the era of internet information explosion,
    insufficient technical investment inevitably leads to greatly reduced work efficiency.
    Currently, some government departments have almost no corresponding technical
    talents, and content monitoring is difficult to digitize, resulting in high pressure
    on public opinion monitoring and disposal.


    #### 4. Organizational Level


    When responding to major emergencies, the organizational structure is relatively
    loose, making it difficult to form a 合力 (synergy/cohesive force). There is a lack
    of permanent institutions or teams dedicated to handling online public opinion
    incidents, leading to the inability of different functional departments to achieve
    smooth and efficient communication and coordination in emergency states. Secondary
    public opinion disasters are prone to occur during public opinion disposal. Relevant
    interest departments find it difficult to coordinate well, and occasional buck-passing
    occurs, seriously damaging the image and credibility of government departments.
    On the other hand, although local governments often carry out various trainings,
    in terms of public opinion organization, they still overly rely on the personal
    decisions of the leaders in charge. There are no scientific and effective organizational
    principles and response methods. If leaders cannot participate in disposal in
    time, public opinion response is basically paralyzed. If leaders lack public opinion
    awareness, the disposal plan is basically empty talk.


    #### 5. Skill Level


    Government information disclosure lacks confidence and initiative. The phenomenon
    of vacant news spokesperson positions is serious. New media utilization is insufficient;
    propaganda methods and means are outdated. New media operation and maintenance
    capabilities are limited, making it difficult to play the role of information
    disclosure. Public opinion response focuses heavily on deletion and blocking,
    light on guidance. There is heavy reliance on post-deletion methods, leading to
    boiling public resentment. Public opinion explanation relies too much on the discourse
    of officials and experts, lacking persuasiveness. There is a need to invite more
    social forces to participate in public opinion guidance. Public opinion sensitivity
    is relatively insufficient: either overreacting and unable to decide, or easily
    letting go, causing problems to continue amplifying. Public opinion disposal means
    are relatively singular; some government departments have obviously insufficient
    experience.


    ### (IV) Suggestions for Risk Response Measures in Cyberspace


    #### 1. Public Opinion Theory Level


    First, require leading cadres to continuously and deeply study public opinion
    theory, gradually cultivate and enhance public opinion awareness and media literacy,
    and have a correct understanding of domestic and foreign public opinion trends
    and network ideology. Second, pay attention to absorbing experience from public
    opinion response practice, solidify response skills, conduct more exchanges, enhance
    skills in utilizing and responding to media, learn to deal with various media
    and platforms, and study relevant theories. Third, pay attention to leveraging
    external forces to enhance public opinion response and disposal capabilities,
    independently build expert think tank teams to become the "brains trust" around
    leaders.


    #### 2. Public Opinion Practice Level


    First, pay attention to making basic judgments on public opinion events before
    response. Need to enhance public opinion sensitivity, able to consciously place
    individual public opinion events in the context of overall social mentality, social
    hidden ills, and key national work for consideration. Second, pay attention to
    grasping basic principles of public opinion response: steady and efficient, timely
    feedback, orders strictly enforced. Third, pay attention to doing a good job in
    public opinion response: timely and appropriately respond to public concerns,
    quickly dispose of personnel responsible for public opinion-related issues, to
    quell netizens'' negative emotions. Fourth, in the process of public opinion response,
    pay attention to repairing government image and official-civilian relations, and
    smooth communication channels between government and the public. Fifth, when releasing
    information and making major decisions, corresponding comparison and evaluation
    must be carried out to minimize public opinion risks as much as possible.


    #### 3. Technical Investment Level


    Government departments must increase investment in public opinion monitoring technology.
    With the advent of the 5G era, the efficiency of information dissemination will
    be greatly improved, and dissemination channels will become increasingly diverse.
    This requires monitoring technology to also steadily enhance, developing more
    intelligent public opinion monitoring platforms. In the 5G era, relying on manual
    monitoring is already impossible. Facing massive online information, only by using
    more advanced public opinion monitoring technology can one gain the upper hand
    in public opinion disposal and response.


    #### 4. Social Management Level


    Increase the utilization of emerging media and form benign interaction with various
    media. Strengthen social management innovation, encourage diversified development
    of online topics, and maintain a rational online environment. Make good use of
    government self-media, do a good job in information disclosure and doubt clarification,
    actively guide online public opinion, increase the rumor-refuting efforts of government
    self-media, release the truth in a timely manner, and make good use of online
    Big Vs and self-media alliances to disseminate true information, forming a network
    public opinion counterbalance mechanism. Innovate propaganda methods, means, and
    content. Strengthen government credibility building, repair and enhance government
    credibility, and build a sunshine, transparent government. Unblock normal public
    feedback channels to timely understand public sentiment.


    #### 5. System Construction Level


    Establish a normalized mechanism for online public opinion management. The public
    opinion response mechanism must not stay on paper but be implemented in action.
    Not only rely on the decision-making of principal leaders but also on scientific
    public opinion response strategies and skills, and form corresponding permanent
    public opinion disposal institutions to guide and coordinate the disjointed public
    opinion responses. Smooth internal government communication mechanisms to ensure
    timely information transmission up and down. Create a good online public opinion
    environment from multiple angles, improve relevant laws and regulations. Based
    on actual conditions, local governments can also formulate corresponding network
    management laws and regulations to avoid public opinion injuries caused by illegal
    acts such as rumor-making and rumor-spreading. Form a linkage disposal mechanism
    to help involved Party and government organs, enterprises, and institutions entrust
    public opinion disposal, reducing the damage of public opinion to government and
    local images. Increase accountability efforts; those who dispose improperly must
    be held accountable personally.


    ## 7.5 "Rumor-Mongering Takes One Mouth, Rumor-Refuting Runs Legs Off"


    In cyberspace governance, there is often a phenomenon, the so-called "Rumor-mongering
    takes one mouth, rumor-refuting runs legs off." The meaning is that rumor-mongers
    only need one mouth, move their lips, and based on personal judgment and preferences,
    can fabricate a joke or even a rumor. Online rumors, due to their fast transmission
    speed and high frequency of disguise, surpass any "positive energy" information.
    At this time, to quell the social harm of rumors, network managers need to spend
    more time refuting rumors, correcting errors, and releasing relevant internal
    information to stop the spread of the rumor. Scholars point out that the reason
    for this situation is that official institutions are doing the work that self-media
    should do. Officials should release true and authoritative information that the
    public does not understand in a timely manner *before* rumors appear, to prevent
    rumors in advance. One is active behavior, the other passive; the latter is always
    in a predicament of being exhausted from coping. Coupled with the existence of
    massive self-media users, limited management faces massive problems or rumors.
    This "rumor-mongering" and "rumor-refuting" has become an endless game between
    self-media and traditional media, ultimately resulting in mutual losses.


    As official-background media, their standpoint should be to fully exert their
    credibility status, timely and effectively release information that the social
    public does not understand or has not yet grasped, timely clarify or explain information
    that the public urgently wants to understand, timely counter false online information,
    and effectively dispel public doubts. Only in this way can the soil and environment
    for the growth of online rumors be destroyed.


    On the other hand, while governing online rumors, we need to maintain or reshape
    the public opinion self-purification function of the self-media environment itself.
    The internet is the pulverizer of rumors; any rumor will eventually show its tail
    in the cross-comparison and authenticity identification of multi-source information.


    While continuously improving the ability of self-media users to identify rumors,
    we must comprehensively improve the public''s rational expression ability and
    their ability to consciously participate in social affairs. Greatly improve the
    public''s scientific literacy and ability to distinguish right from wrong, and
    foster a good and upward online public opinion environment. At the same time,
    we must not pin hopes on ordinary self-media users becoming the main body of rumor
    discernment. In certain rumor dissemination scenarios, the majority of self-media
    individuals are also victims of rumors.


    ## 7.6 Social Psychological Crises Induced by Subcultural Phenomena


    With social development and the high prosperity of self-media, the public''s expression
    space has unprecedentedly expanded. Political themes and political forms have
    undergone tremendous changes as a consequence. The consequence of political modernization
    is the dissolution of the traditional state politics as a public power center
    and its authoritative status. A new type of power field called "sub-politics"
    by Beck gradually replaces parliamentary politics and begins to function automatically
    in the democratic field. "Political modernization makes politics and political
    society lose power and gain liberation."


    The decentralization trend of traditional political culture is continuously eroded
    and swallowed by various subcultures, gradually becoming a social climate and
    modern trend. This brings challenges to the modern political order. For some political
    governance systems that are highly rigid, systemically inflexible, and lack inclusiveness,
    risks follow closely and are obvious. "Seeing enemies everywhere" (literally:
    every bush and tree looks like an enemy soldier) is the most vivid and apt metaphor
    for the challenges and sense of crisis faced by such political governance culture.
    The prevalence of such subcultures can profoundly induce certain subtle and lasting
    changes in the psychology of the social masses. We need to tolerate and absorb
    all beneficial changes with an open and optimistic mindset, enhance the connotation
    of the existing political governance culture, and enrich the diverse expression
    methods of political culture and diverse paths of political participation.


    Traditional politics, bounded by the legal political system, is challenged. The
    political system is forced to open its inherent traditional boundaries, absorb
    various social resources, thereby solving various political and social problems
    in a changing world. Political culture can be divided into two levels: political
    psychological tendencies and political value orientations. It is a psychological-value
    structure. The subcultural structure of political culture refers to the decomposition
    and combination of a society''s political culture according to the diversification
    of social structure: the first is the basic subcultural structure, such as the
    political culture of different classes, the political culture of different ethnic
    groups in multi-ethnic countries; the second is the specific subcultural structure,
    such as the political culture of different occupational groups, different age
    groups, different regional groups, etc. The rise of "new social movements" as
    sub-politics also implies that politics continues to transform and grow in change.
    Political change is not only reflected in the blurring of political system boundaries
    due to frequent exchanges of political resources and information inside and outside
    the political system, but also in the slow change and displacement of political
    systems and structures.


    The cyclical mutual construction between social movements and national economy
    and social policies is one of the important characteristics of a social movement
    society. Currently, European and American countries have generally entered the
    social movement stage. Under the pressure of movements, their economic and social
    policies have generally shown a center-left shift trend. This brings governance
    risks that cannot be ignored to China''s various political and economic ecologies.
    It is necessary to systematically respond to these risks at the levels of governance
    thinking, governance practice, and international environment, and achieve mutually
    beneficial cooperation and common development with European and American countries.


    Western new social movements are the product of changes in contemporary Western
    social structure and class relations. This movement strongly impacted traditional
    party politics, giving rise to de-classed "neutral politics." This "new politics"
    forced Western mainstream parties based on class politics to adapt to the situation,
    adopt neutralized reform measures, and change governing concepts and methods.


    The internet has accelerated the prevalence of modern subcultures and profoundly
    changed the traditional political culture and social culture landscape imperceptibly.


    The rise of subculture is the process of the decentralization movement of traditional
    social power, a process of power equalization and redistribution. This process,
    jointly promoted by social individuals and various interest alliances, will inevitably
    lead to the loosening of various existing social frameworks in postmodern society,
    dissolve traditional shackles, and reconstruct current and future new types of
    postmodern social forms.


    # Chapter 8 Potential Social Risks of Modern New Technology Systems


    ## 8.1 Risks Brought by Big Data, 5G, and Artificial Intelligence Technologies


    The full application of 5G technology will change people''s communication modes,
    affecting people''s perception of time and space in a more rapid, jumping, and
    fragmented form. Regional and scenic spatial barriers truly disintegrate; space
    is extremely compressed and no longer serves as a shackle for people''s communication.


    According to statistics, the total number of devices connected to the global mobile
    communication network in the future will reach hundreds of billions. It is estimated
    that by 2021, the number of global mobile terminals (excluding IoT devices) will
    exceed 10 billion, of which China will exceed 2 billion. Whether in harsh environments
    such as remote areas and high-speed movement, or in areas with dense personnel
    and large traffic demands, people can still use mobile devices for remote communication.
    5G technology will not only shorten the time-space distance between people but
    also accelerate the transformation of information dissemination forms. Future
    information dissemination forms will be more concrete, direct, multi-dimensional,
    and dynamic. Mobile video communication will become the preferred communication
    method. In the 5G era, the speed of people''s access to information will be greatly
    increased, and the speed and scale of information collection and dissemination
    will reach unprecedented levels. Satellite internet will also help eliminate regional
    spatial barriers, allowing information dissemination to reach every corner. Due
    to its breadth and speed of dissemination, satellite internet and 5G jointly break
    the time-space limits of dissemination, making interactive communication among
    the public more convenient.


    With the continuous improvement of the national comprehensive internet governance
    system, whether it is laws and regulations based on the internet itself or legislation
    for relevant groups and fields, they will continue to deepen and refine, directly
    affecting relevant products of internet enterprises and platforms. For example,
    in early 2019, the state successively issued the *Regulations on the Management
    of Online Short Video Platforms* and the *Detailed Rules for Content Review Standards
    of Online Short Videos*, pointing directly at online short video operation platforms,
    followed by centralized rectification of domestic short video websites. Recently,
    regarding the draft revision of the Law on the Protection of Minors, many members
    of the NPC Standing Committee pointed out that online short videos have a huge
    impact on minors, with hazards even more severe than online games. They suggested
    that the draft revision should regulate this. The proposal triggered heated social
    discussion; once passed, it will directly affect short video platforms.


    From the perspective of network regulation, constantly emerging new internet terms
    bring regulatory difficulties. Behind the emergence of individual new words are
    corresponding events or represent certain social emotions, reflecting concentrated
    group demands. Online short video platforms are undoubtedly one of the sources
    of many popular internet terms. One of their core groups, the "ACG (2D) crowd,"
    also has unique communication methods and language systems. Particularly in the
    "bullet screens" (danmaku) of their video products, there may be user group complaints
    or questions about emergencies, public figures, social phenomena, etc., expressed
    through unique methods and vocabulary in a "group jeering" manner. This poses
    a challenge to both platform operators and network regulatory departments. With
    the deepening of international cultural exchanges, the input of foreign culture
    into the domestic market has become increasingly obvious. However, it is necessary
    to focus on the fact that cultural products with obvious national orientation,
    ethnic or racial symbols have certain political sensitivity points. Take the virtual
    anchor "Kizuna AI," originating from Japan and operating accounts on domestic
    video platforms, as an example. From the characteristics of the domestic public
    opinion field in the past two years, anti-Japanese sentiment remains an untouchable
    high-risk sensitive point. Undoubtedly, "Kizuna AI" is closely related to Japanese
    culture, whether from product development, cultural concepts, or artificially
    endowed behavioral habits. In netizen comments, complaints about the Japanese
    cultural tendency of the "Kizuna AI" product are also obvious, especially at some
    important nodes. For example, previously on July 6, the "Kizuna AI" official Weibo
    pushed a message: "Do you know what day it is tomorrow? Everyone in parts of Asia
    is very familiar with it, right?" Netizens left messages on Weibo: "Marco Polo
    Bridge Incident," "July 7 Incident." Although the original intention of the Weibo
    content was just to discuss "Qixi Festival" (Chinese Valentine''s Day) with users,
    due to a lack of localization knowledge, they failed to notice that China''s Qixi
    Festival is on the 7th day of the 7th lunar month. However, this incident also
    reflects the potential political risk points of the product, which are easily
    associated with issues such as "patriotism," "Sino-Japanese relations," and "spiritually
    Japanese" (jingri).


