    ## 8.1 Data Breaches and Cybersecurity Challenges


    The development of the latest internet technologies brings both convenience and
    trouble, and data breaches are clearly a difficult problem that enterprises and
    regulators must face. The leakage of large amounts of personal privacy data on
    the internet has become a common phenomenon, and hostile forces may even use this
    data to launch attacks. The development of the World Wide Web has enabled information
    flow to break through the constraints of time and space, blurring national territorial
    boundaries and posing challenges to cybersecurity and sovereign security. In the
    era of big data, the vulnerability of cybersecurity barriers has become prominent,
    triggering new concerns among countries regarding the security domain.


    Media outlets such as the British *Guardian* once broke major news: British data
    analytics firm Cambridge Analytica, without user consent, utilized personal data
    from 50 million Facebook users obtained on the platform to build profiles and
    conduct targeted propaganda against these individuals during the 2016 US presidential
    election. This shows that data breaches and misuse not only cause distress to
    individuals but also challenge national cybersecurity, leading to more serious
    social consequences and causing damage to national security.


    ## 8.2 Chaos in the Virtual Economy Triggering Major Systemic Risks


    ### 8.2.1 Theoretical Origins and Basic Connotations of the Virtual Economy


    The virtual economy is relative to the real economy; it is the inevitable product
    of economic virtualization (termed "financial deepening" in the West). The essence
    of the economy is a value system, comprising a material price system and an asset
    price system. Unlike the material price system, where pricing is supported by
    costs and technology, the asset price system is a specific price system based
    on capitalized pricing methods—this is the virtual economy. Due to capitalized
    pricing, psychological factors have a significant impact on the virtual economy;
    in other words, the virtual economy possesses inherent volatility in its operation.
    Broadly speaking, besides the financial and real estate industries that are currently
    the focus of research, the virtual economy also includes the sports economy, gambling
    industry, collection industry, etc. Excessive development of the virtual economy
    will lead to a bubble economy.


    The term "virtual economy" originates from Marx''s *Das Kapital* and is one of
    the theories Marx used to argue the inevitable demise of capitalism. Marx believed
    that fictitious capital arises on the basis of loan capital and the banking credit
    system, including stocks, bonds, etc. Fictitious capital can be traded as a commodity
    and can appreciate as capital, but it does not possess value itself; the actual
    capital it represents has already been invested in the sphere of production or
    the process of consumption, while it itself remains on the market as a tradable
    asset. The virtual economy is derived from fictitious capital with credit relations
    and develops with the high development of the credit economy.


    The author of *The Game Bible* gave a definition of the virtual economy: like
    a magic master making a group of dogs fight for a bone, a gambling game where
    the crowd places bets.


    Domestic research on the virtual economy began after the 1997 Asian Financial
    Crisis. The foundational work was *From Fictitious Capital to Virtual Economy*
    published by Professor Liu Junmin in 1998.


    ### 8.2.2 Five Core Characteristics of the Virtual Economy


    Virtual economy risk refers to economic activities related to the cyclical movement
    of fictitious capital primarily relying on the financial system; simply put, it
    is the activity of directly making money from money. The virtual economy plays
    a role in the effective allocation of capital. The internationalization of capital
    flows allows capital to flow globally on a larger scale and at a faster speed.
    On the one hand, this facilitates financing for enterprises, governments, and
    institutions on a broader scale; on the other hand, it facilitates investors in
    selecting investment projects globally to achieve higher expected returns. The
    facts of contemporary economic financialization and financial globalization demonstrate
    that the virtual economy has gradually replaced the real economy to become the
    mainstream of economic operation and development.


    The virtual economy is a product of a highly developed market economy, with the
    ultimate purpose of serving the real economy. With the rapid development of the
    virtual economy, its scale has exceeded that of the real economy, becoming an
    economic category relatively independent of the real economy. At the same time,
    compared with the real economy, the virtual economy has distinctly different characteristics,
    mainly manifested in the following five aspects:


    1.  **High Liquidity**: The virtual economy involves the holding and trading activities
    of fictitious capital, which is merely the transfer of value symbols. It is precisely
    the high liquidity of the virtual economy that improves the efficiency of social
    resource allocation and reallocation, making it an indispensable component of
    the modern market economy.

    2.  **Instability**: The virtual nature inherent in the virtual economy means
    that the pricing of various fictitious capitals in market transactions does not
    follow the law of value like the pricing process of the real economy, increasing
    the instability of the virtual economy.

    3.  **Information Asymmetry**: Constrained by the current financial accounting
    system and public policies, the incentive mechanism for real information to flow
    from the real economy domain to the virtual economy domain is insufficient, leading
    to an inadequate supply of information related to the virtual economy. This sows
    hidden dangers for the unfair distribution of information among different speculators.
    Individual speculators have a weak ability to discern real information; information
    excavation is insufficient, unprofessional, and uneconomical. Coupled with the
    malicious distortion of information by individual speculators, information presents
    an asymmetric distribution state among traders.

    4.  **High Risk and High Speculation**: With the rapid development of the virtual
    economy, its transaction scale and varieties continue to expand, making the existence
    and development of the virtual economy more complex and difficult to control.
    Fictitious capital investment has become a high-risk investment field, especially
    with the intervention of large amounts of speculative funds such as various venture
    capital funds and hedge funds, which exacerbates the high risk of the virtual
    economy.

    5.  **Policy or Institutional Risk**: The rapid development of electronic technology
    and network high-tech allows huge fund transfers, clearing, and fictitious capital
    transactions to be completed in an instant, creating technical conditions and
    providing technical support for high speculation of fictitious capital. At the
    same time, the newer and less developed, imperfect the market, the poorer the
    market regulatory capacity, the weaker the measures and intensity to prevent and
    respond to highly speculative behavior, the higher the speculation of the virtual
    economy, and the more likely speculative hot money is to frequent such markets
    to achieve the goal of short-term speculation and profiteering. Virtual economy
    activities rely on credit to guarantee the smooth progress of property rights
    transactions, but their high correlation with national macroeconomic policies
    makes the virtual economy inevitably face policy risks. From the current situation,
    the greatest risk encountered by the virtual economy comes from policy risk.


    ### 8.2.3 Identification and Analysis of Virtual Economy Risks


    In economic activities, risk usually refers to the difference between expected
    returns and actual returns. This difference stems from both the uncertainty of
    the objective world and the limitations of people''s cognitive abilities regarding
    the objective world. When analyzing virtual economy risks, full consideration
    must be given to the decision-making behavior of financial market entities, particularly
    irrational behavior.


    The emergence of any risk has precursors; usually, certain indicator data appears
    abnormal or behaves abnormally, and the risk early warning system captures these
    anomalies based on certain principles. Two aspects of work are needed to achieve
    the identification of risk intelligence: first, qualitative analysis, i.e., judging
    through qualitative descriptions of business characteristics from decision-making
    to operation of relevant projects; second, quantitative analysis, i.e., determining
    whether risks have occurred through the indicators of the risk early warning indicator
    system.


    ### 8.2.4 Chaos and Reflection on China''s Virtual Economy


    At the 2014 Summer Davos Forum, Premier Li Keqiang called for "Mass Entrepreneurship
    and Innovation" (Dual Innovation), and several months later, incorporated it into
    the 2015 Government Work Report for promotion. Under "Dual Innovation," internet
    enterprises developed vigorously, `O2O` projects grew unprecedentedly, and internet
    finance represented by `P2P` emerged one after another. This was the golden period
    of China''s virtual economy. The virtual economy represented by "Internet+" brought
    a rare highlight to the long-silent Chinese economy. At the same time, the financial
    industry, accompanied by the bull market starting in 2014, began a vigorous "leveraging"
    leapfrog sprint. Unfortunately, happiness is always short-lived. The Ezubao scam
    and the endless `P2P` crashes and absconding incidents caused the internet finance
    industry as a whole to be knocked down by public opinion. "After the 2015 bull
    market peaked, the ensuing capital winter made many question whether ''Dual Innovation''
    only sowed dragon seeds but harvested fleas."[¹] Li Keqiang also pointed out in
    the Government Work Report the need to promote financial institutions to focus
    on their main business, lower their center of gravity, enhance their ability to
    serve the real economy, and prevent diverting from the real to the virtual. In
    the public eye, the internet industry representing the virtual economy is a money-burning
    game, and the financial industry is a capital game. People turn pale at the mention
    of "virtual" but rejoice at the mention of "real."


    "Pseudo-economy is based on deception or Ponzi schemes, serving the profits of
    a few. Whether it is the real economy or the virtual economy, pseudo-economy exists
    in both," said scholar Zheng Fang in the field of economic research.


    "The virtual economy is based on credit and serves the real economy. If the virtual
    economy is not based on credit and does not serve the real economy, it will turn
    into a pseudo-economy. This pseudo-economy is like counterfeit goods in the real
    economy and requires government regulation and control," Zheng Fang said. Zheng
    Fang believes that the "virtual" to be shed in "shedding the virtual for the real"
    should be the pseudo-economy, not the virtual economy. Whether real economy or
    virtual economy, both have pseudo-economies; this is what the state needs to prevent
    and crack down on. Whether counterfeit drugs and fake bags in the real economy,
    or counterfeit money and fake accounts in the virtual economy, all need to be
    prevented. "Now, whenever ''shedding the virtual for the real'' is mentioned,
    it becomes ''no finance, no internet,'' which is wrong. The virtual economy is
    an effective supplement and service to the real economy," Zheng Fang said. A one-size-fits-all
    approach of "supporting the real and suppressing the virtual" can only lead to
    one result: without the virtual economy serving the real economy, the development
    of the real economy will become increasingly difficult. "Eliminating misunderstandings
    about the virtual economy is key; correctly handling the relationship among the
    real economy, virtual economy, and pseudo-economy is the top priority."


    ### 8.2.5 Construction of a Virtual Economy Risk Early Warning System


    Establishing a virtual economy risk early warning system requires a firm grasp
    of core indicators such as capital flow direction and volume, in order to build
    a reasonable and effective risk indicator monitoring system, enhance the ability
    to perceive and immunize against risks, and improve the capacity to prevent and
    resolve major systemic risks.


    ---


    [¹]: 36Kr: *Virtual Economy Becomes Public Enemy, Is This Really Good?*, `https://36kr.com/p/5067268`.


    ## 8.3 Media Entertainment Tendency Triggering Public Opinion Security Risks


    ### 8.3.1 Typical Case: The PG One Incident and the "Ziguangge" Storm


    Rap singer PG One received high attention due to the Li Xiaolu overnight stay
    scandal. His released works drew criticism from authoritative media. The *Ziguangge*
    (magazine of the Central Committee of the CPC''s Organs Work Committee), the Communist
    Youth League Central Committee''s official Weibo, *People''s Daily*, and Xinhuanet
    criticized his lyrics for being vulgar, inciting drug use, and insulting women.
    Unexpectedly, PG One''s fanatical fans launched a counterattack, and the fabricated
    tag "Ziguangge Gutter Oil" hit the Weibo hot search list. "Ziguangge" was mistaken
    by PG One fans for a restaurant; they bought the wrong hot search, causing "Weibo
    Hot Search" itself to hit the hot search. The topic of "public opinion manipulation"
    continued to attract attention. Zhihu user Liu Kongqing''s serial "Yang Mi vs.
    Tang Yan Battle" ignited the topic, also letting netizens see the chaos of celebrities
    manipulating public opinion.


    Entertainment capital manipulating online public opinion has become a universal
    and serious social phenomenon. Whether manufacturing rumors, buying hot searches,
    raising "water armies" (paid posters), or engaging in bullying, the phenomenon
    of public opinion manipulation appears intermittently, confusing right and wrong,
    reversing black and white, and hijacking public opinion. If "Ziguangge" really
    were a restaurant, it is unknown whether it could withstand such collateral damage.
    Facing the manipulation by entertainment capital, government departments must
    strengthen regulation to create a clean and clear cyberspace.


    ### 8.3.2 Five Major Means of Entertainment Capital Manipulating Online Public
    Opinion


    Reviewing various phenomena in the entertainment field in recent years reveals
    that entertainment capital''s manipulation of online public opinion is "omnipresent."
    Some manipulations maintain celebrity popularity and image; others directly counter
    and hedge against mainstream authoritative voices, mainly manifested as:


    1.  **Manufacturing Various Topics**: Boosting topic heat through entertainment
    capital hype and fan manipulation to gain high exposure, continuously maintaining
    topic relevance and heat. With the exposure of the Weibo hot search industry chain,
    such under-the-table operations have become "tacit rules." This manipulation leads
    to rampant hype in the entertainment circle, safeguarding the interests of celebrities
    and entertainment capital.

    2.  **Suppressing Public Opinion**: Using entertainment capital and fan power
    to suppress negative public opinion affecting their image. Fans attack critics
    recklessly, not hesitating to fabricate rumors and smear reputations, causing
    onlookers to be gradually "misled," finally forcing critics to dare not speak
    further. The phenomenon of celebrities using their influence to carry out cyberbullying
    also occurs frequently, especially regarding "traffic stars" (celebrities famous
    for popularity metrics), where the risk of criticizing them is high.

    3.  **Manipulating Public Perception**: Entertainment capital inevitably pursues
    profit maximization, including safeguarding its own interests, gaming with opponents,
    and even fabricating rumors, smearing, and denigrating other celebrities. On social
    media platforms, discussions surrounding film and television works often present
    an "irrational" state. The chaos of excellent works being panned and inferior
    works being praised occurs occasionally, affecting the market environment and
    seriously disturbing social public opinion.

    4.  **Countering Authoritative Voices**: At important nodes of mainstream propaganda,
    celebrity-related topics are hyped. Many online media and new media join in, creating
    a public opinion frenzy, forming a strong impact on mainstream authoritative reports,
    and even making it difficult for mainstream voices to spread fully. This phenomenon
    warrants vigilance.

    5.  **Countering Mainstream Discourse**: For negative reports involving celebrities,
    entertainment capital and fans take remedial measures, even mobilizing various
    resources to counter. Some mainstream media and new media are even manipulated
    into participating in the counterattack. The debate triggered by the "Zhao Wei
    hiring a ''Taiwan independence'' separatist as lead actor" incident is a typical
    showdown between entertainment capital and mainstream perception.


    Of course, there are many more ways for entertainment capital to manipulate online
    public opinion. Capital''s infiltration into social fields is ubiquitous. As the
    forces behind entertainment capital grow stronger, the risk of public opinion
    manipulation increases, and manipulation methods become more concealed. Entertainment
    capital''s manipulation of online public opinion undoubtedly brings negative impacts
    to social governance. Since the forces behind entertainment capital are relatively
    hidden, the risks brought by their manipulation of public opinion cannot be underestimated.


    ### 8.3.3 Seven Manifestations and Harms of Entertainment Capital Manipulating
    Public Opinion


    The manifestations and harms are as follows:


    1.  **Polluted Cyberspace, Public Opinion Confrontation Intensifies Social Tearing**:
    Regarding celebrity words and deeds, public opinion should have a relatively unified
    judgment. However, due to entertainment capital''s intervention, some celebrities''
    "black material" (scandals) can instead gain public opinion support; they even
    take pride in challenging the bottom line of social ethics. Capital''s strong
    intervention and misleading make the influence of the "post-truth" era increasingly
    apparent. Driven by emotions, fans cannot even distinguish right from wrong, blindly
    worshipping and supporting their idols. Irrational fans and rational netizens
    often "tear at each other" on social media, venting negative emotions, leading
    to a polluted cyberspace.

    2.  **Ignoring Truth and Justice, Cyberbullying Destroys Public Opinion Ecology**:
    Under the manipulation of entertainment capital, some fans have lost judgment
    ability. If netizens point out a celebrity''s problems, they may face a public
    opinion siege by fans; personal attacks are common on social media. Fans engage
    in carnival-style support for idols, spending money to buy hot searches. When
    idols face negative reviews, they do not hesitate to buy "water armies" to argue
    with netizens and carry out cyberbullying, making upright and rational netizens
    afraid to speak. Behind this is the incitement and support of public opinion capital,
    which seriously destroys the public opinion ecology, making online speech more
    polarized and netizens more extreme.

    3.  **Interfering with Cognitive Judgment, Media Platforms Become Capital Accomplices**:
    "Ziguangge Gutter Oil" is inherently ridiculous, but driven by fans, it entered
    the view of Big Vs and gained promotion, successfully becoming a hot topic. This
    shows that where capital reaches, some media platforms still become accomplices,
    losing basic self-purification ability or simply lacking filtering functions.
    Social public opinion and emotions are seriously disturbed; capital successfully
    reverses black and white. Social emotional restlessness and anxiety, and the public''s
    simplistic and shallow cognition, all become aids for capital''s crazy intervention
    and manipulation of public opinion.

    4.  **Skilled Manipulation Experience, Potential Risks Increase Governance Difficulty**:
    Celebrities are controlled by entertainment capital, becoming tools and carriers
    for monetization, while fans gradually become an important public opinion force
    for capital to maintain benign operation, like puppets on capital''s strings.
    Even if some celebrities have negative news (moral crises, illegal crimes), they
    can still, under entertainment capital''s manipulation, make fans continue to
    support them; this spiritual manipulation technique is already very sophisticated.
    Entertainment capital frequently manipulates public opinion with mature experience
    and abundant resources, posing a huge challenge to both network control and social
    governance.

    5.  **Neutralizing Authoritative Voices, Pan-Entertainment Dilutes Mainstream
    Propaganda**: If entertainment capital manipulates public opinion only for commercial
    purposes, strengthening industry management and rectification, and intensifying
    governance of media platforms, can quiet entertainment capital. In recent years,
    the impact of the pan-entertainment trend on mainstream propaganda reveals that
    the forces behind entertainment capital deserve more attention. Capital can hardly
    change its profit-seeking nature; even in areas related to national security and
    ideology, profit maximization remains its ultimate goal. In the face of interest
    games, capital sometimes takes desperate risks to hedge against mainstream propaganda.
    Worse still, foreign capital may participate in hype to neutralize authoritative
    voices.

    6.  **Confronting Mainstream Ideology, Mobilizing Various Resources for Counterattack**:
    With the rapid development of the internet industry, private capital and foreign
    capital (including entertainment capital) exert strong influence on the online
    media and new media industries. Capital uses its advantages in funds, technology,
    and management to promote the rapid development of media platforms and infiltrate
    them. Capital may not intervene much in media operations normally, but when its
    own interests are involved, it relies on its influence to manipulate online public
    opinion, even hiring water armies to post and delete posts... Capital''s strong
    intervention makes the truth more elusive; noise and clutter drown out the main
    melody, and even to maintain interests, they do not hesitate to launch crusades
    against mainstream ideology, becoming accomplices of certain forces.

    7.  **Increasingly Frequent Manipulation, Capital Intervention in Public Opinion
    Gradually Strengthens**: Looking back at the development of the entertainment
    industry, entertainment capital''s intervention is getting deeper. Whether it
    is celebrity packaging and hype, or entertainment product promotion and distribution,
    almost all have the boost of entertainment capital forces, and these capital forces''
    ability to manipulate social public opinion is also strengthening daily. For example,
    the movie *Forever Young*; its investor claimed that the movie achieved a double
    counterattack in reputation and box office. Apart from the excellent quality of
    *Forever Young* itself, it was inseparable from the efforts of the lead investor
    Penguin Pictures and the backing of Tencent. Penguin Pictures continuously integrated
    high-quality industry resources and even fought for precious resources such as
    Tencent News headlines and full-platform support of Tencent Video. This shows
    that capital forces'' intervention in and manipulation of public opinion has become
    quite powerful, not limited to the new media level; promotion is like this, and
    counterattacks are even more so.


    The capital forces relied upon by entertainment capital are growing daily, with
    complex and intricate interest relationships. The social harms of manipulating
    online public opinion are increasingly apparent. Facing the capital forces lurking
    in the dark, how can social governance be carried out to gradually purify the
    online public opinion environment?


    ### 8.3.4 Five Governance Strategies to Purify the Online Public Opinion Environment


    1.  **Strengthen Industry Self-Discipline, Improve Rules and Management Systems**:
    Media reports show that paying to buy Weibo hot searches has become a common means
    of public opinion hype. Not only can it rely on third-party channels, but it can
    also directly purchase "hot search recommendation spots" from Weibo officials,
    with clear pricing. In fact, the Weibo hot search list''s profit model is basically
    the same as Baidu Search. While this brings revenue, like Baidu, it faces huge
    hidden dangers; negligence in review can turn it into a tool for evil. This requires
    social media platforms to strengthen self-discipline, learn from negative lessons,
    and while cooperating with entertainment capital, improve hot search list rules
    and management systems, not excessively pursue profits at the expense of a clean
    and positive online environment.

    2.  **Timely Regulatory Intervention, Govern Online Chaos**: Cyberspace governance
    cannot rely solely on industry self-discipline; regulatory departments must intervene
    in a timely manner, strengthen industry management, and impose strong governance
    on the chaos of buying hot searches. Typical cases must be required to rectify.
    Entertainment capital manipulates online public opinion mainly through online
    media and new media. For management chaos existing on these media platforms, once
    verified, they must be actively dealt with to avoid serious social harm caused
    by public opinion manipulation. Strengthen guidance for media platforms, reminding
    them not to ignore social responsibility. At the same time, for self-media that
    blindly "chase hot spots" and publish speculative and inflammatory remarks, governance
    should be continuously strengthened.

    3.  **Enhance Cognitive Ability, Guide the Public to Think Rationally**: Seeing
    online hot topics, self-media will crazily follow up, while most netizens find
    it difficult to make rational judgments, only blindly following, being swept up
    or even utilized by entertainment topics. The "Spiral of Silence" is more obvious
    on social media; rational opposing voices are difficult to get a response and
    may even be "swarmed." Hot topics can easily achieve the hijacking of public opinion;
    entertainment capital only needs to exert a little force to make "hot topics"
    serve itself. Facing the increasingly frequent manipulation by entertainment capital,
    mainstream authoritative institutions and media should participate in guidance,
    gradually cultivating netizens'' habit of rational thinking, daring to question
    and speak out on some hot topics. Only by gradually improving netizens'' cognitive
    abilities, encouraging rational thinking, and forming a good atmosphere of public
    opinion discussion can we help netizens enhance their "immunity."

    4.  **Improve Laws and Regulations, Principles Cannot Be Challenged**: Facing
    condemnation and crusade by mainstream public opinion, entertainment capital,
    to safeguard its own interests, even mobilizes various media resources and social
    forces to participate in "counterattacks," and even in the fields of national
    security and ideology, does not show weakness, insisting on erroneous perceptions
    and attitudes. This requires government departments to improve laws and regulations,
    perfect relevant legal provisions for cyberspace governance, promptly purge sensitive
    and dangerous remarks, and rectify media platforms supporting erroneous views
    and attitudes. Strengthen network information supervision; principles cannot be
    challenged.

    5.  **Support Authoritative Media, Form a Strong Counterbalancing Force**: The
    rise of self-media has gradually blurred the boundaries between the public sphere
    and the private sphere. Everyone seems to have the right to speak in their hands,
    but it is not easy to truly form influence on social media platforms, and "agenda-setting"
    is almost impossible. The right to speak is mainly in the hands of "Big Vs" and
    marketing accounts, and their right to speak is almost controlled by entertainment
    capital. Capital''s control over self-media is obvious, while online media and
    self-media are close to netizens; the public opinion frenzy they stir up brings
    greater pressure to social governance. This requires increased investment in authoritative
    mainstream media, giving them more right to speak in cyberspace, bringing them
    closer to netizens, so that in mainstream propaganda, public opinion guidance,
    and debate and counterattack, they can become a strong force to counterbalance
    entertainment capital.


    ## 8.4 Opportunities and Challenges of Blockchain Technology Application


    ### 8.4.1 Development and Application of Blockchain


    Blockchain is essentially a `distributed ledger` technology, considered the latest
    way to ensure data storage security. It does not store data in a centralized location
    but distributes it across network nodes, with each node saving the full data of
    the entire blockchain, and simultaneously using powerful encryption algorithms
    and protocol combinations to maintain transaction generation and creation.


    The concept of blockchain originated in 2008, mentioned by a person under the
    pseudonym Satoshi Nakamoto in *Bitcoin: A Peer-to-Peer Electronic Cash System*.
    In 2009, the first Bitcoin was born, also known as blockchain technology version
    1.0, mainly serving as an algorithmic mechanical production and de-intermediated
    global cryptocurrency. This is the most basic application of blockchain, related
    to digital cash, mainly used in token issuance, transfer and exchange, payment,
    and bill electronization. However, due to its lack of scalability, it cannot meet
    user needs for building more advanced applications.


    From 2013 to 2014, `Ethereum` appeared, marking blockchain technology version
    2.0. It still operates relying on the token `Ether`. `Ethereum` built an open-source
    public blockchain platform with smart contract functionality, possessing scalability.
    The `Ethereum` network made it possible to achieve unrestricted, de-intermediated
    global value flow. `Ethereum` acts as a trust mechanism replacing central authority,
    and the landing of various industry applications has special value for the production,
    distribution, and consumption of news and information.


    On these technical foundations, blockchain technology will gradually evolve towards
    version 3.0, gradually opening up applications beyond finance, similar to international,
    non-sovereign management organizations like `ICANN` and `DNS`. Blockchain realizes
    a Decentralized Autonomous Society (`DAS`) in fields such as government governance,
    medical health, science, education, culture, and health. The new characteristics
    of anonymity, decentralization, and multi-party participation of blockchain technology
    make the social form under blockchain conditions more complex and difficult to
    grasp.


    Currently, blockchain is widely used in asset issuance, payment and exchange,
    evidence storage and credit reporting, and other aspects. Main application scenarios
    include cryptocurrency issuance, leasing and carpooling, bank clearing and settlement
    and payment, communication integration, crowdfunding and charitable donations,
    medical health, etc. The widespread application of blockchain will possibly have
    a disruptive impact on current internet applications.


