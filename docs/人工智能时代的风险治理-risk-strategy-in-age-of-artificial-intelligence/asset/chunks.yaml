    # 序言


    风险有改变或摧毁，甚至毁灭世界的力量。


    风险治理的核心是风险感知能力，风险感知的核心能力是人的风险认知能力、风险治理能力和风险应对能力。


    面对风险，趋利避害是人的本能。


    风险治理涉及的不仅仅是大数据，也不仅仅是技术问题。


    风险表现为各类事件，或是某种趋势。天灾和人祸就是典型的传统风险。


    谈到风险，我们每个人都有自己的认知，那些对社会个体或组织机构带来任何秩序的自然或人为改变都可能是潜在的风险。风险是治理当中的突变因素，如何治理这种因素甚至决定一个人或机构的生死存亡。对风险的认知能力决定了一个政治治理秩序、一个组织机构、一个群体或是一个社会个体的未来。


    在保证安全可控的前提下适度地人为制造风险或利用风险或为他人制造风险或将自己的风险转嫁输出给他人，是另一种精致利己或损人利己的“智慧算计”，但是，这是极具危险的游戏，因为其后果往往不可控，更有可能伤及自身。


    随着全球化进程的推进，世界已经成为一个多元的整体，任何局部的改变都可能引发全局的震荡或某种改变，从进步的意义上讲，这些带来改变的风险是社会进步的动力之一。人类社会的发展，一直是迎接并解决一个接一个风险而成长、进步的。从系统论角度来讲，“蝴蝶效应”是对风险改变世界的最好诠释。


    有研究表明，人类基因中有8%的DNA片段来自自然界的病毒，正是这些病毒，改造着人类的基因，并促使人类与这个世界更加和谐相处。对风险的认知和接纳，是人类必须面对的一个客观现实。对于一个组织来讲，接纳并阻止或改变风险的走向和风险带来的后果，是必须面对的核心议题。风险对社会的颠覆和改变有时候是良性的，它能推动某些进步，但它带来的更多是破坏和毁灭。《风险社会》的作者德国社会学家乌尔里希·贝克说，后现代社会的风险已经全面来临，并挑战工业社会所形成的文明框架和风险现实。他说，“后”是茫然无措的代号，自陷于流俗时髦，它“指向一种难以名状的超越之物”，这是我们“借以面对四分五裂的现实的基本处方”。因此，人类想要获得成功，“只有同旧的理论和思维习惯进行一场艰苦搏斗”。


    我们需要重新审视风险这只怪兽所带给我们的所有改变。只有积极地应对，有效地规避，合理地利用，努力让风险成为我们这个社会前进和发展的动力，才是我们风险治理的核心。这需要智慧。


    风险有大有小，但风险应对思维和风险应对策略是一致的，那就是勇敢面对，有效规避，合理利用，在改变风险的同时也改变我们自己。“黑天鹅事件”“灰犀牛事件”，这是我们常挂在嘴边的术语，这两类事件的本质是相同的，它们都能带来巨大的破坏力，甚至是颠覆力，它们轻则破坏一个组织，影响某些个体的方方面面；重则颠覆一个社会，一个治理的现存秩序。


    自然界充满了各类风险，人类社会也充满了各种风险，风险无处不在，无时不在，人类生活在一个被风险环绕的危机环境中，从来如此，并且，从未改变过，这就是过去的现实、今天的现实，还有未来的现实。没有风险的社会是不存在的，这不是危言耸听。


    “生于忧患，死于安乐”，“未雨绸缪，防患于未然”。中国的古人早就给我们的风险治理开出了良药。


    风险一直在倒逼我们反思，反思自身，反思我们这个社会的发展短板，反思我们的治理短板，它让我们清醒，让我们时刻保持戒备，让我们时刻准备接受来自风险的挑战。


    面对各类风险，我们真的准备好了吗？


    对风险的剖析和趋势分析、风险防范和风险应对是风险治理的核心要旨。古语云，良医治无治之病，故人常在生也；圣人治无患之患，故天下太平也。即居安思危、未雨绸缪是风险治理的首要目标。


    “星星之火，可以燎原。”任何对风险的无视或轻视都会让我们付出代价，这种代价可能是致命的。一个现实是，当无数风险累积和风险叠加态势来临的时候，我们如何科学应对、有效防范并化解，这不仅考验我们的勇气和决心，也同时考验我们的风险防范体系建设的成效。


    “压死骆驼的最后一根稻草”究竟在哪里？那一根稻草，可能是一次意外的事件，一个拍脑袋的决策，一个灵机一动的治理举措。


    忧患意识，风险思维，数据决策，这是我们每个人都必须重修的一堂课。我们在警惕显性风险的同时，更要警惕那些隐性的风险带给社会的巨大破坏力。


    “COVID-19”（新型冠状病毒），一个在2019年底开始肆虐的病毒终成2020年第一只“黑天鹅”，令人猝不及防。尽管这位不速之客终会束手就擒，但它留给我们的教训将会是长久的、深刻的。新型冠状病毒这个“黑天鹅”事件不仅是对各级政府的风险决策水平、公共应急体系、社会动员能力的一次大考，同时也是对公众现代意识和社会治理参与能力的一次检视。这一次，我们终于发现，我们与风险和危机只有一层口罩的距离，而那些所谓的“岁月静好”只是一种病态的安逸感和被幻象主导的满足感。


    社会重大风险防范和化解已经成为各级政府的核心任务和重要工作选项。居安思危，未雨绸缪。面对可能的风险，我们需要再多一些敬畏，再多一些准备，再多一些预见，同时要少一些侥幸，少一些盲目乐观，少一些拍脑袋决策。忧患意识，风险思维，数据决策应当成为各级政府风险战略管理的核心。“黑天鹅事件”经常是社会重大风险“灰犀牛事件”的催化剂和导火索。治理的短板即是风险之所在。治理体系和治理能力的现代化需要不断提升政府补齐短板的能力，通过增强风险防控手段，提升风险防控能力，让数据决策增进传统决策效能，构建现代风险研判标准和风险治理体系。归根结底，应对突发公共事件的能力和表现，是检验所有风险治理体系和风险防控能力建设的试金石。


    “吃一堑,长一智”，这是我们在风险治理当中所应秉持的初心，唯有如此，我们才不会在下一次风险来临的时候因为犹豫不决、手足无措而狼狈应对，进而陷于巨大的被动。


    这本书是我长期从事网络空间风险治理研究的个人思考，我希望本书能够成为我们重建风险思维，增强风险治理意识，推进风险治理体系建设，提升风险治理能力的一个参考。


    如何认知风险、建立风险思维、科学认知风险是撰写本书的基础,“未雨绸缪，防患于未然”是本书讨论的核心问题，感知和预警风险、规避和利用风险、协同和高效地处置应对风险是本书要讨论的方法论以及工具维度层面的重要问题。


    大数据、人工智能技术的快速发展和应用为现代风险治理提供了可能和技术实现的基础，亦会成为现代社会风险治理的利器。同时，我将对大数据和人工智能技术在现代风险治理中的应用场景进行一些思考和探索。


    未来已来，将至已至。


    是为记。


