    # 第三章 现代社会风险治理


    ## 3.1 建立现代风险前置研判及重大决策风险分析机制


    坚持底线思维，着力防范化解重大风险，应完善风险防控机制，建立健全风险研判机制、决策风险评估机制、风险防控协同机制、风险防控责任机制。而决策风险评估机制处于枢纽地位，把其他类型的机制连接在一起，推动全方位和一体化的风险治理体系运转。近些年，为使我们的各项工作真正赢得群众的理解和支持，从源头上预防矛盾纠纷的发生，我国在建立完善落实重大项目、重大决策风险评估机制上已取得实质性进展。


    决策风险评估机制有两层含义：第一，决策方案本身引发出来的意料之外的后果，触发潜在风险因子，激化风险的快速演化，例如重大工程项目或重大政策的决策方案设计不周全、不严密或者调查研究不充分，而直接导致群体性事件的爆发。第二，在具体领域的风险已经聚集状态下，需要采取风险型决策来快速动态应对。决策风险评估既是对暴露风险进行评估，同时还关注风险型决策方案对风险链的影响评估。简要地说，决策风险评估旨在从源头治理风险，避免、降低、缓解、转化或留存风险，通过科学和多主体参与的评估，形成科学合理的应对方案。一般而言，与日常或程序性决策相比，风险决策具有重大、战略、复杂的特征，决策过程需要更为精准，决策结果需要更接近目标。因此，决策的风险评估需要设计更为合理的机制。决策风险评估的机制是决策制度和工具相互结合的过程，是由分析、协商和判断构成的。


    对决策的风险分析是评估的科学基础。分析就是运用科学方法生产决策知识的过程，包含着问题结构分析、对决策结果的预期、对决策方案的选择，在特定情形下还包括对决策执行结果的监控并评价决策方案的绩效。问题结构分析是对决策问题要素之间进行分解，梳理要素之间的关系。通常而言，决策风险评估所需要解决的问题，其要素之间呈现出复杂关系，而非简单的线性关系。换言之，要素之间呈现出线性关系的问题纳入日常程序性决策，而要素之间的复杂关系需要跨学科知识的支撑。这些复杂关系体现在风险涉及的多个领域，或者在一个领域里长期想解决而没有能够解决的顽疾问题。从结构化程度来说，问题的复杂性主要表现在：演变机制和路径不清晰，需要多维度观察；问题的解决具有多个备选方案；问题涉及多个利益相关行动者，行动者之间存在着利益、需求和价值上的冲突。问题结构分析旨在刻画上述特征，为识别问题复杂程度提供科学依据。对预期决策结果的分析需要数据、信息和知识的支持。从数据到信息，再到形成知识，这个分析过程体现出对未来预期的认识逐步清晰。数据呈现出个体化和数量化特征，对数据进行分析的过程就构成各类信息的来源，经过科学研究，信息转化为知识，知识成为对决策结果预期的展现形式。对决策方案的选择既是价值判断，又是基于价值分析比较的事实判断。


    从事决策风险分析的通常有三类机构：大学和科研院所的科学研究机构、社会专业性研究机构、政府体系内的研究机构。这些机构具有智库的属性。专家和智库提供了决策的风险分析，提供多种类型的知识。


    决策风险评估需要构建协商机制。解决复杂问题的决策背后需要面对多种利益的竞争和冲突。风险评估需要建构化解价值和利益冲突的机制。因为分析的过程只是解决了决策方案科学化，而没有解决方案的可行性和合理性，因而决策过程本身需要多行动主体之间以协商为中心的对话和参与。对决策风险评估而言，多个行动主体之间的利益、需求、偏好以及情绪的交流能够提升风险评估的质量，使决策方案更加精准，执行更为顺畅。当前党和政府着力推进的多层次多渠道的协商民主建设具有推进决策风险评估的重要意义。


    决策风险评估还需要地方知识和实践经验的支持，这些知识弥补了分析过程提供的普遍性知识不足，从而全面提升决策风险评估的质量。地方知识和实践经验是通过多主体协商方式进入决策风险评估流程中的。成功的协商还需要信息公开、行动主体拥有协商能力、实质性的参与以及创造平等的协商机会等条件的保障。'
