    # Summary of Successful Experience in Public Opinion Crisis Response


    Successful experience in public opinion crisis response is worth summarizing and
    learning from. Through quantitative analysis of historical data, the inevitable
    development logic behind online events can be discovered. Relying on big data
    comparison and analysis of various dimensions in the historical event database,
    as well as intelligent deduction guiding disposal functions, the knowledge case
    database system compares historical data with incipient events to conduct predictive
    deduction, aiming to achieve simplicity, intuitiveness, practicality, and effectively
    guide crisis response and risk perception of incipient events. The system''s comparison
    can effectively enhance risk identification and assessment, move the public opinion
    risk checkpoint forward, greatly improve the level of disposal in online public
    opinion analysis and assessment, enhance the capabilities of risk prediction,
    foresight, forecasting, and early warning, and powerfully strengthen the comprehensive
    governance capacity of cyberspace.


    ### 3. Comparison of Real Events with Similar Historical Events to Enhance Precision
    of Risk Perception


    Online public opinion mainly utilizes integrated internet search technology and
    intelligent information processing technology to capture and discover hotspots
    from massive amounts of information on the internet, thereby meeting the needs
    of online public opinion monitoring and comparison. Through analysis of sensitive
    words, keywords, etc., similar historical events are excavated. Based on full-form
    big data mining and comparison of text, graphics, and video, real event information
    is tracked, ultimately forming corresponding analysis results. The knowledge case
    database comparison system can realize real-time monitoring and timely reporting
    of the online event case comparison system, enhance the scientific nature of risk
    assessment for major matters'' online public opinion, and improve the precision
    of customizable situation risk assessment.


    #### (IV) Countermeasures for Major Online Public Opinion Risk Identification
    and Intelligent Early Warning


    The major online public opinion risk identification and intelligent early warning
    system is an effective risk identification system relying on the organic combination
    of big data, cloud computing, and case databases. Major online public opinion
    risk identification and intelligent early warning require a multi-dimensional
    early warning based on a huge case database system, guided by expert public opinion
    assessment analysis, supported by big data and computing technology, and assisted
    by a public opinion early warning guidance mechanism.


    ##### 1. Improve the Online Event Case Database System, Rely on the Case Database
    as Power to Enhance Comprehensiveness of Risk Assessment


    Public opinion risk management is an important component of modern public opinion
    governance. Based on the online event case database comparison system, improve
    the online event case database system, strengthen the capacity for online public
    opinion risk governance, front-load public opinion risk management, and transform
    from past ex-post supervision to ex-ante early warning. Therefore, it is necessary
    to improve the online event case database system, rely on the network to collect,
    sort, and analyze major online events, improve key phrase extraction, key information
    extraction, body extraction, and automatic identification of hot online public
    opinion through retrieval methods such as sensitive word sources and key vocabulary.
    At the same time, improve the case database system''s retrieval methods, search
    functions, and presentation methods of related events, which can rely on the case
    database system to realize comparison of real events, historical events, historical
    data, real decisions, and incipient events, strengthening perception and assessment
    of online public opinion risks. Through system improvement, the problem of insufficient
    situation assessment capability in traditional comprehensive cyberspace governance
    means can be effectively solved. On the basis of knowledge base training, effective,
    all-round process simulation of public opinion risks of ongoing public events
    or upcoming major decisions can be conducted, providing important risk early warning
    and assessment services for decision-making formulation.


    ##### 2. Establish an Expert Experience Database for Public Opinion Risk, Rely
    on Professional Public Opinion Knowledge to Enhance Professionalism of Risk Early
    Warning


    The internet has become the largest platform for expressing demands, and online
    public opinion risks are prominent. Establishing an expert experience database
    for public opinion risk can enhance risk response capabilities and strengthen
    the authority of online public opinion risk disposal. First, a major decision-making
    online public opinion risk expert experience database shall be formed by senior
    journalists, legal experts, crisis management experts, public opinion experts,
    and relevant professionals. Professionals provide similar cases and historical
    event public opinion risk response and assessment experience, realizing the extraction
    of similar and successful experiences, enhancing public opinion risk disposal
    capabilities. With expert assistance, the "gold content" of online public opinion
    risk perception and early warning is increased. At the same time, regularly supplement
    experts in relevant professions, timely improve expert experience, carry out expert
    experience sharing, improve comprehensive public opinion risk response experience
    through sharing, and enhance the professionalism of public opinion risk early
    warning by relying on professional knowledge.


    ##### 3. Optimize Public Opinion Risk Early Warning Technology, Rely on Early
    Warning Technology and Platforms to Enhance Precision of Risk Identification and
    Early Warning


    The development of big data technology and cloud computing provides technical
    support for current risk early warning and pre-assessment. Therefore, major online
    event public opinion risk early warning must rely on big data, cloud computing,
    artificial intelligence, and other technologies to achieve early warning. The
    combination of mature data analysis technology and a sound case database can compare
    and assess data. At the same time, improve the public opinion information interaction
    and sharing platform; information exchange and sharing improve information utilization
    rates. Based on intelligent clustering technology of content similarity, automatically
    discover hot vocabulary on the network, including hot names of people, places,
    and other hot words, and organize them together through association technology
    to perceive network hotspots in advance. Relying on computer statistical analysis
    technology to classify public opinion information, effectively discover target
    information or harmful information in massive information, and automatically and
    accurately assess its propagation situation and social security harm, enhance
    regional cyberspace governance capabilities, and improve the early warning precision
    of major public opinion risks.


    ##### 4. Construct a Comprehensive Mechanism for Major Online Public Opinion Risk,
    Rely on a Three-Dimensional Mechanism to Enhance Systemicity of Risk Perception


    Public opinion risk identification and early warning are based on the full excavation,
    development, and utilization of online public opinion big data. Based on the knowledge
    case database comparison system for public opinion analysis and assessment, constructing
    a comprehensive mechanism for major online public opinion risk can greatly enhance
    the systemicity of early warning. First, establish and improve the public opinion
    early warning mechanism. Based on the knowledge case database comparison system,
    establish a three-dimensional monitoring and early warning mechanism of "human
    + technology," establish uninterrupted early warning for key events, key public
    opinion fields, and key areas, fully consider various risks that may trigger public
    opinion, and win precious time for the disposal of sudden public opinion events.
    Second, the online public opinion verification and assessment mechanism. Through
    system comparison, verify the authenticity of online public opinion, classify
    and orient influencing factors and sources, and enhance the timeliness and reliability
    of public opinion early warning. Third, improve the online public opinion guidance
    mechanism. Be good at using the analysis results of the case database comparison
    system to enhance the effectiveness of mainstream information guidance, realize
    the dissemination guidance of mainstream information, reduce potential risks of
    online public opinion, and reduce the probability of public opinion crises through
    early warning and guidance.


    ## 6.3 Online or Public Opinion Image Restoration


    Targeting the situation where the reputation, credibility, and image of Party
    and government organs or enterprises and institutions have been significantly
    damaged after experiencing the test of a major public opinion crisis, on the premise
    of following the basic laws of public opinion for major crisis events, fully considering
    the basic public opinion situation of the event, actively seeking effective public
    opinion breakthroughs, and formulating comprehensive image restoration implementation
    plans for the involved institutions, striving to restore and reshape the public
    opinion image of the involved institutions or individuals in the shortest possible
    time.


    After experiencing the test of a major public opinion crisis, facing the trauma
    and shock brought to their own reputation, credibility, and image by the event,
    the excessive subjective public opinion guidance or "giving up treatment" by the
    involved Party and government organs or enterprises and institutions are obviously
    unhelpful to the restoration of the public opinion image. This is precisely the
    key to the long-tail effect of major crisis events on the public opinion image
    of the involved institutions, and must be given high attention.


    With the help of the major crisis public opinion image restoration implementation
    plan, the public opinion guidance breakthrough for the involved institution can
    be effectively sought. With the help of active, proactive public opinion guidance
    or relevant auxiliary measures, the online public opinion image of the involved
    institution can be effectively restored, thereby reducing the negative impact
    and harm of the public opinion event.


    After negative public opinion is resolved, cooling down does not mean the disposal
    work can stop. If a closed loop is not formed in the public opinion response and
    disposal, any disturbance in associated factors may cause re-fermentation, reignite
    the fire of public opinion, and bring secondary trauma to the reputation of relevant
    departments or enterprises and institutions. Especially some major events have
    a latent long-tail effect, and relevant departments and units need to pay more
    attention. During image restoration, high-level response can not only settle disputes
    but also guide public opinion toward positive development through publicity and
    guidance. During the public opinion fermentation process, especially in the noisy
    online public opinion environment, some netizens'' stereotyped impressions of
    some departments and units exist for a long time, which also increases the difficulty
    of image restoration. In the early stage of public opinion, rapid response and
    active voicing have a positive effect on resolving problems. In the later stage
    of public opinion, proactive action, guiding according to the trend, and eliminating
    misunderstandings can effectively carry out image restoration. Facing sudden events,
    especially natural disasters, the level of public opinion response and disposal
    capabilities of relevant departments and units is the key to influencing image
    restoration. Every time summer rainstorms hit, some city managers face voices
    like "drainage pipes, the conscience of the city," "go to somewhere to see the
    sea," "management absence." At this time, relevant departments and units must
    summarize past experiences and lessons, prevent trouble before it happens, coordinate
    multiple parties, and actively dispose; their image restoration will naturally
    follow as a matter of course.


    The principles of public opinion image restoration are consistent with those when
    responding to online risks. First, it is an active behavior to reduce online public
    opinion harm under the principle of ensuring timeliness. Second, adhere to an
    attitude of seeking truth from facts, call a spade a spade, neither cover up faults
    nor distort facts, fabricate falsehoods, or slander others, lest they become the
    focus of public opinion attacks again, trigger greater online risks, and cause
    greater losses. Third, similar to crisis public relations strategies, necessary
    ways and methods must be adopted for restoration, for example, effectively utilizing
    authoritative third-party voices and channels.


    # Chapter 7 Self-Media and Online Risk Governance


    ## 7.1 Core Value of Self-Media


    Ulrich Beck said that after various risks became generalized in postmodern society,
    the public''s criticism and anti-scientific research tore off the veil it used
    to hide, giving it an important seat in socio-political debate.


    How did a celebrity''s tax evasion behavior become known to the public and trigger
    an earthquake in the entertainment industry? How did a "direct selling" company
    that had operated illegally for many years quickly become the target of public
    criticism under a single online article, and even the empire builder who had been
    at large for many years instantly fall from grace? What social value system does
    this public opinion storm originating from the network reflect? What posture should
    government management departments adopt to welcome this force?


    In recent years, hot topics spawned by online platforms have emerged one after
    another. The huge energy latent in online public sentiment has gradually been
    perceived by the public, and the laws and characteristics presented by a series
    of online public opinion events project the undercurrents surging behind public
    opinion, revealing the tip of the iceberg of complex intertwined social risks.


    On January 22, 2019, General Secretary Xi Jinping delivered a speech at the opening
    ceremony of the special seminar on adhering to bottom-line wisdom through in-depth
    historical research.


    As times change, in the era of informatization and self-media, the carriers of
    public opinion have undergone profound changes. "Modern public opinion is mainly
    manifested in the appearance, occurrence, development, and evolution of various
    public opinions in the network." Mobile networks, social media platforms, and
    self-media emerging like bamboo shoots after rain represent the new type of public
    opinion field in the big data era. The single public opinion pattern where traditional
    media occupied all discourse power has been completely subverted. Looking globally,
    traditional media such as newspapers, radio, and television strive to defend their
    industry status and head for the forefront of the next era, yet they have no choice
    but to accept the ferry of either extinction or transformation. Social media,
    as the new darling of the era for thought transmission and value sharing, has
    not simply replaced "single" with "single," but presents diversified characteristics.


    The arrival of the media socialization era brings a dazzling, lively situation
    mixed with mud and sand, and confusion of fish eyes with pearls. The complexity
    of online public opinion and the complexity of its information sources cannot
    be ignored. Enhancing discernment and scrutiny in the complex online public opinion
    space is particularly important.


    Social media provides the possibility for mass public opinion supervision, which
    is a manifestation of the masses actively participating in social interaction
    and sharing the fruits of informatization development. "The attitude towards social
    media reflects the conscience and confidence of state governance." At the same
    time, social media is growing strongly but cannot be allowed to grow wildly; the
    internet has never been a place outside the law. Grasping and familiarizing with
    the external characteristics of online public opinion and analyzing its internal
    communication laws are new requirements the era puts forward for our governance
    departments. "Any understanding and practice that despises the huge social ideological
    mobilization ability of online media is extremely erroneous," after all, the reality
    before us is that "the internet has grown into a huge stage where members of society
    can widely participate and a stage for public opinion expression."


    Recognizing the position of online public opinion in social governance is only
    the first step in understanding and mastering online public opinion. Based on
    certain social realities, combined with the general laws of online public opinion,
    it is not difficult to find the answer to the question of how a social topic develops
    into a vigorous online public opinion event.


    "The wind rises from the end of the green *![](img/figure_0157_0001.jpg)*." Behind
    the surging online public sentiment lies the citizens'' awareness of participation
    and the faint light of folk wisdom. One of the important purposes of online public
    opinion research is to take improving citizens'' ability to express opinions and
    sense of social responsibility as the premise for building a harmonious online
    public opinion environment, and to take improving the level of public governance
    and the ability to listen to public opinion as the core content of online public
    opinion research. As the subject of public management, the government cannot bypass
    online public opinion management as its "jurisdiction." Relative to the online
    world''s repeated self-development and reshaping, government department management
    is still in a critical period of transition from passive to active, and relevant
    online management mechanisms and legal systems are gradually being established.


    Whether it is government emergency disposal or general online public opinion management,
    technical means are indispensable support in modern governance solutions.


    An important concept runs through the public opinion management system established
    by relying on technical means and the wisdom of governors: break the stereotype
    that always places the government on the opposite side of public opinion; government
    management departments are also content providers and participants in the cyberspace
    of the information age. E-government, as a digital connection method between the
    government and citizens, is an important form for the government to provide services
    and broaden citizen participation. Government public service accounts and official
    opinion leaders active on social media are even more on the front line of participating
    in online public opinion. Relevant content on new e-government and government
    social media management is also an important agenda of the "12th Five-Year," "13th
    Five-Year," and "14th Five-Year" informatization development plans.


    Adhere to bottom-line, providing support for the organizer''s decision-making.
    The main groups of the water army are still students and social idlers, because
    this part of the people has no fixed economic income, and making money is their
    main motivation for entering the industry.


    #### 3. Group Characteristics of the Online Water Army


    The group characteristics of the online water army mainly include: First, the
    subject is non-specific, the industry threshold is extremely low, as long as they
    are ordinary netizens with typing and internet access capabilities, they can become
    subjects, and they are distributed in all corners of society. Once a network infringement
    case occurs, it is difficult for judicial organs to determine the subject implementing
    the infringement behavior. Second, the work is simple, no specific office space
    is required, so many people join the "online water army" ranks in pursuit of a
    quick work mode. Third, they pursue specific economic benefits; as the team continues
    to expand, the fields of their economic sources are also gradually widening. Fourth,
    their identities have a certain concealment; they appear as ordinary netizens,
    making it difficult to discern their true identities.


    ### (II) Problems Caused by the Online Water Army


    #### 1. Public Opinion Holds That the Scale of the Online Water Army Is Rapidly
    Expanding, Developing Towards Industrialization, Corporatization, and Professionalization,
    Destroying the Normal Network Ecology, and Seriously Infringing on Citizens''
    Personal and Property Rights


    The online water army has developed to today, with its scale growing and division
    of labor becoming more detailed, truly "intricate and complex." Public opinion
    believes that comprehensive rectification is not easy. The online water army not
    only infringes on citizens'' rights to reputation and privacy but may also lead
    to citizens'' property losses during the process of paid post deletion. *People''s
    Daily* reported that a relevant person in charge of the Cybersecurity Bureau of
    the Ministry of Public Security stated that illegal promotion, paid post deletion,
    defamation and attacks, technical support, after-sales service, and other businesses
    all have dedicated personnel responsible, seriously destroying the normal network
    ecology and seriously infringing on citizens'' personal and property rights. Since
    the Ministry of Public Security organized a special operation to crack down on
    illegal crimes by "online water armies" in May 2017, more than 40 related illegal
    criminal cases have been solved, with a total involved amount of over 100 million
    yuan.


    #### 2. Public Opinion Holds That the Online Water Army Affects Network Information
    Quality, Distorts the Network Public Opinion Space, Leads the Public Opinion Rhythm
    Astray, Fake News Flies Everywhere, and Netizens Find It Hard to Believe Network
    Information Anymore


    "Celebrities tearing at each other, celebrities'' alternate accounts exposed,
    various things are actually routines..." The confession of former water army member
    "Lao Xie" exposed various tricks of 乱带节奏 (leading the rhythm astray), making people
    deeply convinced that network information they believed in might just be hype.
    Public opinion believes that the rampant water army has led to serious distortion
    of the network public opinion space. A large amount of garbage, invalid, biased,
    and negative information has seriously affected network information quality, and
    netizens no longer easily believe network information. *People''s Daily Overseas
    Edition* pointed out that the network "water army" has damaged the quality of
    internet information. *The Paper* commented that "water armies" cover up real
    information through massive information crushing, lead the public opinion rhythm
    astray, thereby pointing at a deer and calling it a horse (distorting facts),
    and three men make a tiger (rumors become truth). The result is "when the false
    is made true, the true becomes false." Various malicious slander and attacks on
    enterprises and individuals, confusing right and wrong, "traffic stars" without
    works occupy our eyeballs.


    #### 3. Public Opinion Holds That the Online Water Army Manufactures Various Social
    Hotspots Under the Manipulation of Capital, and Public Opinion Is Even "Coerced"
    and Used, Becoming a Tool for Hype


    Spending money to "buy fans" and "buy hot searches" lets netizens see the power
    of capital. The "Ziguangge Gutter Oil" incident also showed the rampancy of the
    online water army. Public opinion believes that precisely in the most open public
    opinion space with the lowest threshold, some people, for profit, do not hesitate
    to fabricate rumors and concoct facts to disparage opponents, and even "coerce"
    unknowing netizens into it. "Public opinion" has become fish meat to be divided.
    *Legal Daily* reported that on the hot search lists of every network platform,
    there are shadows of the online water army. Buying hot searches has become a common
    means of hype. CCTV reported that hundreds of millions of netizens, following
    the baton of these online water armies, contribute click rates, and are guided
    and manipulated unknowingly, even unintentionally becoming tools of the hitmen.


    #### 4. Public Opinion Holds That the Online Water Army Will Lead to Unfair Competition,
    Merchants Use Water Armies to Mislead Propaganda or Attack Opponents, Leading
    Market Competition into a State of Disorder


    On January 1, 2019, the revised *Anti-Unfair Competition Law* officially came
    into effect. After the new law took effect, illegal operators such as online water
    armies will be severely punished. Public opinion believes that merchants using
    water armies to carry out fake orders, fake reviews, deletion of negative reviews,
    fabrication of transactions, and other businesses seriously interfere with consumer
    choices. Such breach-of-trust behaviors should have been cracked down on long
    ago. The online water army may even become a tool for merchants to attack opponents.
    *Beijing Daily* commented that certain online water armies help behind-the-scenes
    enterprises disparage and defame competitors, affecting their normal operations.
    This not only seriously infringes on the commercial reputation of victimized enterprises
    but also seriously disrupts the socialist market economic order.


    #### 5. Public Opinion Holds That the Online Water Army May Pose a Threat to National
    Security and Social Stability; They May Be Used by Foreign Hostile Forces, Endangering
    National Security and Causing Social Unrest


    The online water army operates under the employment of others; the pursuit of
    interests often drives them to break legal boundaries. Public opinion believes
    that if the online water army is utilized by foreign forces with ulterior motives
    to carry out activities inciting the splitting of the country and undermining
    national unity, it may well endanger national security. This obviously has precedents.
    *The Beijing News* once reported that the Beijing police organized a special operation
    for comprehensive management of online public security, strengthening the crackdown
    on online pushers and water armies spreading information endangering national
    security.


    ### (III) Reasons Why the Online Water Army Persists Despite Repeated Bans


    #### 1. Relatively Complete Organizational Structure, Possessing Response Strategies
    to Withstand Risks


    The online water army has already scaled up, forming a relatively mature management
    system. Public opinion believes that the organizational structure of the online
    water army has become complete in development and can withstand certain risks.
    *The Paper* article "Revealing the Water Army Kingdom: Tasks, Systems, and Soldiers"
    pointed out that the water army hides without a trace, yet is everywhere. Facing
    technical adjustments and upgrades of various network platforms, the water army
    still has its own response strategies. They discuss "business" and "skills" together,
    such as how to farm accounts, which platforms are safer, how to avoid account
    bans, etc.


    #### 2. Profit Space Still Exists, Illegal Costs Insufficient to Form Effective
    Deterrence


    Policies such as network real-name registration have been introduced and implemented
    intensively, continuously compressing the survival space of the online water army.
    Public opinion believes that the online water army persists despite repeated bans
    and continues to develop because the industry still has profit space, and illegal
    costs are still not high. Special commentator Bi Ge of *The Paper* believes that
    where there is profit, there is a 江湖 (underworld/jungle); there will still be
    people joining the water army trade for a little petty profit, and there will
    be enterprises taking risks due to interests. Only when the illegal costs of "Lao
    Xie" and the behind-the-scenes manipulators far exceed the gains will be the time
    for them to retire.


    #### 3. Professional Technology Gradually Improves, Manipulation and Planning
