    In 2010, IBM officially proposed the "Smarter Cities" vision, hoping to contribute
    its own strength to urban development in the world and China. IBM believes that
    a city consists of six core systems related to the city''s main functions: Organization
    (People), Business/Government, Transportation, Communication, Water, and Energy.
    These systems are not isolated but interconnect in a collaborative manner, and
    the city itself is a comprehensive complex system composed of these systems.


    Smart cities achieve comprehensive and thorough perception, early warning, ubiquitous
    interconnection, intelligent integrated applications, and sustainable urban development
    innovation characterized by user innovation, open innovation, mass innovation,
    and collaborative innovation through the application of new-generation information
    technologies such as IoT infrastructure, cloud computing infrastructure, geospatial
    infrastructure, and tools and methods like self-media. Accompanying the development
    of social media and the integrated and innovative development of mobile technologies,
    the smart city in the modern digital social environment is a new form of urban
    informatization development following the digital city.


    As a deep expansion and integrated application of information technology, the
    smart city is one of the important directions for breakthroughs nurtured by new-generation
    information technology and an important component of global strategic emerging
    industry development. Carrying out "Smart City" technology and standard pilots
    is a demonstration project jointly carried out by the Ministry of Science and
    Technology (MOST) and the Standardization Administration of China (SAC) to promote
    the healthy and orderly development of smart city construction in China and promote
    the application of China''s independent innovation achievements in smart cities.
    It aims to form a smart city technology and standard system and solutions with
    China''s independent intellectual property rights, providing scientific and technological
    support for China''s smart city construction.


    ## 4.11 Smart Government Affairs (Smart Governance)


    The core of smart government affairs is "Internet + Government Services" and "Data
    + Government Services".


    In the 2016 Government Work Report, Premier Li Keqiang proposed the concept of
    "Internet + Government Services". The report stated that efforts should be made
    to vigorously promote "Internet + Government Services", realize data sharing among
    departments, and enable residents and enterprises to make fewer trips, handle
    affairs easily, and avoid unnecessary trouble. Simplify administration and delegate
    powers, ban illegal activities, and give the people more equal opportunities and
    greater space for creation. On September 25, 2016, signed and approved by Premier
    Li Keqiang, the State Council issued the *Guiding Opinions on Accelerating the
    Promotion of "Internet + Government Services"*. On January 12, 2017, the *Notice
    of the General Office of the State Council on Issuing the Guidelines for the Construction
    of the Technical System of "Internet + Government Services"* was issued. By strengthening
    top-level design, it standardized the construction of online government service
    platforms in various regions and departments, optimized government service processes,
    and promoted the construction of a unified, standardized, multi-level linked national
    integrated "Internet + Government Services" technical and service system.


    "Internet + Government Services" is the process by which the government achieves
    integrated innovation by utilizing Internet strategies has become a sharp weapon
    for US intelligence departments in counter-terrorism. The main feature of this
    technology is having full-content Internet public opinion monitoring and early
    warning. Such technologies include: full-media content retrieval and analysis
    cloud platform, cloud search, Internet keyword monitoring, network sentiment text
    semantic analysis, sentiment analysis, social account dynamics and association
    analysis, other instant messaging tool platform content monitoring, dark web data
    mining analysis, protocol analysis, data analysis, intelligence analysis, intranet
    information collection, virtual population database, information blocking, public
    opinion guidance and control, information push, network attack situational awareness,
    etc. It also includes feature frame content recognition of various intelligence
    video sources and content directional analysis technology of graphic libraries.
    In the detection of the Los Angeles Marathon bombing and subsequent violent terrorist
    incidents, US public security departments all used such technologies.


    Image and video monitoring related technologies solve the semantic gap between
    humans and machines and the modal gap between text and images/videos by applying
    image/video feature extraction, image text detection and recognition, video subtitle
    recognition, scene recognition, face recognition, and other related technologies.
    They realize business applications such as search, attention, early warning, monitoring,
    hotspot discovery, and configuration management for image and video content, and
    provide interfaces for realizing cross-modal information monitoring and cross-departmental
    collaborative application of business processes.


    Facing terrorist activities, many countries in the world, in addition to using
    tough means to severely crack down, also pay attention to the comprehensive use
    of social, economic, and other means to thoroughly eradicate the social soil where
    terrorism easily breeds and spreads. In the fight against terrorism, attention
    should be paid to addressing terrorism from social, economic, and cultural roots.
    First, reduce corruption and promote social fairness, justice, and social development
    through legal means, guaranteeing equal political participation for all social
    strata and ethnic groups. Second, use economic, educational, and other means to
    improve the quality of socially vulnerable groups and the bottom population, enhance
    their ability to participate in economic activities, enhance their "hematopoietic"
    function, provide conditions for the people to live and work in peace, narrow
    the gap between social strata, reduce the possibility of escalation of social
    contradictions, and promote harmonious exchanges between different ethnic groups
    through more open cultural exchanges. Improve ethnic policies and media publicity
    strategies realistically, and properly handle ethnic and religious relations.
    Resolutely oppose the spread of illegal religious forces and ethnic separatism.
    On the basis of respecting multiculturalism and diverse development models, achieve
    all-round social integration.


    Terrorism has become the most severe and pressing security risk challenge facing
    the world today, and no country can stay out of it. Under economic globalization
    and the new international relations landscape, counter-terrorism relies not only
    on military strength and war means (like the Afghan War), but more on close cooperation
    among countries (like the Shanghai Cooperation Organization). Counter-terrorism
    is a combination of political, economic, cultural, and religious factors, a long-term
    and arduous process.


    ***


    # Chapter 5 China''s Risk Governance and Emergency Management


    Emergency management is proposed in response to the dangerous problems of major
    risks, accidents, and disasters. Emergency management refers to the relevant activities
    in which the government and other public institutions, in the process of pre-event
    prevention, event response, mid-event disposal, and post-event recovery of emergencies,
    establish necessary response mechanisms, take a series of necessary measures,
    and apply scientific, technical, planning, and management means to guarantee public
    life, health, and property safety; and promote harmonious and healthy social development.
    Risks include three categories: human risk, property risk, and liability risk.
    First, human risk can be divided into life risk and health risk; property risk
    refers to accidents and disasters threatening property safety, such as fire, lightning,
    typhoons, floods, etc.; liability risk arises from legal liability for damages,
    generally known as third-party liability insurance. Among them, risk consists
    of accidental incidents, the possibility of accidental incidents occurring, and
    the dangerous state implying the possibility of accidental incidents.


    The connotation of accident emergency management includes four stages: prevention,
    preparedness, response, and recovery. Although in practice these stages often
    overlap, each has its own separate goals and becomes part of the content of the
    next stage.


    Risk governance and emergency management are cross-industry comprehensive collaborative
    management. Not all departments, industries, or departments and industries involved
    in crisis emergency can be incorporated into the emergency management department.
    The emergency management competent department should be built into a professional
    department with full functions for emergency prevention, forecasting, early warning,
    coordination, and reserves, specifically prepared for national emergencies occurring
    in various industries.


    "Living in peace but, coordinated response; relying on science and technology,
    improving quality.


    Countries such as the United States, Japan, Australia, and Canada have all established
    a targeted emergency management system and specific practices, forming emergency
    systems and mechanisms with distinct characteristics. Among them, Japan, as a
    country with frequent earthquake disasters, is relatively mature in earthquake
    emergency response, and its theories and specific practices are worth learning
    from.


    The United States is one of the countries with the most complete emergency management
    system construction in the world today. The continuously improving system, mechanisms,
    and legal construction have made its ability to respond to emergencies increasingly
    strong. Japan is located at the junction of the Eurasian Plate, the Philippine
    Sea Plate, and the Pacific Plate, on the Pacific Ring of Fire. Typhoons, earthquakes,
    tsunamis, heavy rains, and other disasters are extremely common. It is one of
    the countries most vulnerable to natural disaster damage in the world. In the
    long-term struggle against disasters, Japan has formed a relatively complete comprehensive
    disaster prevention and mitigation countermeasure mechanism. Australia is located
    in Oceania in the Southern Hemisphere, with a vast territory and sparse population,
    mainly concentrated in central cities like Sydney and coastal areas. In the past
    few decades, surrounded by boundless oceans, Australia has strategically been
    a low-threat country. Its emergencies are mainly natural disasters, such as floods,
    heavy rains, tropical storms, bushfires, etc. Correspondingly, its emergency management
    also has its own distinct characteristics. Most of Canada belongs to the cold
    zone, with a long winter. 40% of the land is permafrost. Montreal''s winter temperature
    can reach minus 30 degrees Celsius. The main natural disaster is winter blizzards.
    Therefore, Canada''s emergency management is "commanded by snow".


    ## 5.1 Current Status of China''s Emergency Management System


    The Ministry of Emergency Management of the People''s Republic of China is a constituent
    department of the State Council, established in March 2018 according to the State
    Council Institutional Reform Plan approved by the First Session of the 13th National
    People''s Congress. The main responsibilities of the Ministry of Emergency Management
    are to organize the formulation of national general emergency plans and planning,
    guide local and departmental emergency response work, promote the construction
    of the emergency plan system and plan drills; establish a disaster information
    reporting system and uniformly release disaster information, coordinate the construction
    of emergency forces and material reserves and uniformly dispatch them during disaster
    relief, organize the construction of the disaster relief system, guide emergency
    rescue for work safety and natural disasters, undertake the work of the National
    Headquarters for Responding to Extraordinarily Major Disasters; guide the prevention
    and control of fires, drought/flood disasters, geological disasters, etc.; be
    responsible for comprehensive supervision and management of work safety and supervision
    and management of work safety in industries such as mining, industry, and commerce.
    After the transformation of the public security fire brigades and the armed police
    forestry brigades, they, together with work safety and other emergency rescue
    teams, serve as comprehensive standing emergency backbone forces, managed by the
    Ministry of Emergency Management, implementing special management and policy guarantees,
    adopting job rank sequences and management methods suitable for their own characteristics,
    enhancing professional honor, and maintaining vitality and combat effectiveness.
    The Ministry of Emergency Management must handle the relationship between disaster
    prevention and disaster relief well, clarify the division of responsibilities
    with relevant departments and localities, and establish a coordination and cooperation
    mechanism.


    With the establishment of the Ministry of Emergency Management, China has established
    a series of emergency management rules and regulations, including a preliminary
    disaster prevention and relief emergency response system.


    China''s emergency management system is adapted to the basic national conditions
    of the primary stage of socialism. Although China has established effective systems
    in emergency response, social mobilization, and reconstruction, it should also
    be soberly recognized that the historical stage of China''s social development
    determines that the level of emergency management system construction is still
    in its initial stage.


    ## 5.2 Current Status of China''s Emergency Management Legal System


    The promulgation and implementation of the *Emergency Response Law of the People''s
    Republic of China* marks the basic realization of standardization and legalization
    of China''s government emergency management system construction. A relatively
    complete system has been formed in the fields of natural disasters, work safety,
    public health, and social security.


    In terms of responding to natural disasters, a system has been formed with the
    *Water Law*, *Flood Control Law*, *Forest Law*, *Grassland Law*, and *Mineral
    Resources Law* as the backbone. In the management of water, soil, and mineral
    resources, systems for planning, development and utilization, engineering protection,
    resource allocation and conservation, dispute resolution and law enforcement supervision,
    and legal liability have been established.


    On this basis, the State Council has also formulated supporting regulations to
    make these systems more specific and easier to implement. For example, the *Flood
    Control Regulations* stipulate the implementation of the administrative chief
    responsibility system at all levels of people''s governments; unified command,
    graded and departmental responsibility; relevant departments implement flood control
    post responsibility systems, and make detailed provisions on flood control organization,
    flood control preparation, flood control and rescue, post-disaster work, flood
    control funds, rewards and punishments. In addition, there are the *Regulations
    on Safety Management of Reservoir Dams*, *Interim Measures for Compensation for
    the Use of Flood Storage Areas*, *Law on Sand Prevention and Control*, *Regulations
    on the Administration of Artificial Weather Modification*, *Regulations on the
    Participation of the Military in Emergency Rescue and Disaster Relief*.


    [¹]: `NATGRID`, National Intelligence Grid, US National Intelligence Grid.


