    ## 2.1 Introduction to Cyberspace Risk Governance


    Cyberspace risk governance includes the collection, analysis, and risk assessment
    and early warning of various types of social information carried by cyberspace.
    Cyber risks possess a destructive effect on the real social environment, hindering
    the realization of social goals. Cyber risks mainly originate from three aspects:
    first, the risk of failing to grasp public sentiment and public opinion; second,
    the risk of reverse psychological mobilization of the general public by various
    subjects in cyberspace; third, the risk of cyber risks transmitting offline.


    Cyber risk governance includes risk discovery, risk early warning, crisis response,
    emergency management, etc. So-called cyber public opinion monitoring or public
    opinion studies mainly involve research on risk discovery and analysis centered
    on the communication characteristics of various cyber public events.


    In a sense, the collaborative system of risk analysis, risk early warning, and
    risk governance is the most core component of the "Internet + Supervision" and
    "Data + Inspection" systems. The essence of risk analysis is interest analysis,
    and interest analysis is in turn one of the core considerations for evaluating
    the merits of risk governance measures and social risks. The essence of risk governance
    decision-making is also a choice of interest trade-offs.


    So-called interest analysis or interest motivation analysis is a method of observing
    social and historical phenomena from the perspective of interests, understanding
    their essence and roots, and grasping their motives through the words and deeds
    of various social subjects. It is a very important tool for people to grasp the
    realistic interest pattern and correctly formulate strategies. The interest analysis
    method has universal applicability, effectiveness, and pertinence in the social
    field and the process of human social development.


    Interest issues are both the fuse of major social events and their fundamental
    and deep-seated causes. Therefore, to grasp the essence of major social events,
    besides understanding the facts of their formation and development, it is more
    important to grasp their interest roots; only then can one avoid being confused
    by their false appearances and grasp their essence, motives, and development trends.
    The different positions of various classes and social groups in society determine
    their basic attitudes. Analyzing social relations and the entire interest pattern
    is the basis for formulating strategies. Social subjects advocate, plan, and implement
    any decisions out of certain interest motives; therefore, social risk governance
    policies and risk response strategies must be determined based on who benefits
    from the social event and the nature and degree of the interests involved.


    Good governance must be a series of decision-making actions based on the principle
    of maximizing public interest or maximum security; it is also the embodiment of
    the fundamental principle and core purpose of "serving the people wholeheartedly."


    Faced with a complex internal and external environment and various uncertainties,
    how to improve the overall level of social risk early warning and how to enhance
    risk response capabilities—making decisions based on data and speaking with data—should
    become the decision-making paradigm for leaders at all levels. Before the introduction
    of any major decision involving the overall situation, there must be a prior risk
    assessment and a social efficiency analysis of policy implementation. Efficiency
    analysis includes qualitative and quantitative analysis of risks, qualitative
    and quantitative assessment of risk consequences, qualitative and quantitative
    evaluation of risk governance countermeasures, and performance evaluation of risk
    governance policies.


    Traditional decision-making may encounter decision failure in certain scenarios,
    potentially leading to social disasters and public interest losses. One reason
    for decision failure is the serious information asymmetry problem faced by decision-makers
    regarding information related to the decision object. The decision-making process
    is a process of continuously resolving information asymmetry. The information
    asymmetry required for decision-making manifests as an insufficient grasp of the
    historical, current, or future trend information of the decision object. In other
    words, the incomplete grasp of various types of information required to support
    decisions, or the existence of information asymmetry, is absolute; while fully
    and comprehensively grasping all kinds of effective information required for decisions
    is relative. The process of decision-making assessment is the process of continuously
    eliminating information asymmetry and maximizing benefits while avoiding harm
    to the greatest extent. In this process, big data and artificial intelligence
    will play important roles; traditional decision-making processes are being redefined
    by data and algorithms, and the wave of a decision-making revolution driven by
    the "social machine" has arrived.


    Enhancing a sense of vigilance, establishing risks of enterprises to strategic
    environmental uncertainty: Avoidance (`Being avoidance`), Control (`Control`),
    Cooperation (`Cooperation`), Imitation (`Imitation`), and Flexibility (`Flexibility`).
    His research on risk leans more towards the study of enterprises or organizations
    facing uncertainty risks.


    Ulrich Beck said in his *Risk Society* that dangers are constantly growing, but
    in the political sphere, dangers have not been transformed into preventive risk
    control policies; this is a fact. He said that the political subject (or social
    majority) of class society is the proletariat, while the object of risk society
    leaves only the suffering of all people.


    Adrian J. Slywotzky, author of *Strategic Risk Management* [[1]](#Chapter_6_1.xhtml#B2),
    believes that no matter how large a company is, it may be severely damaged because
    it did not anticipate a transformation or was not prepared for it. Strategic risk
    is actually greater when a business is sailing smoothly. Precisely when you want
    to relax or feel complacent is when you should be tense and doubly vigilant. The
    book introduces seven strategies for turning crises into breakthrough growth:
    improving the odds of winning; understanding, not guessing, customer needs; preparing
    for two contingencies; beating unbeatable opponents; updating business models
    to protect brands; cooperating with competitors to escape the zero-profit zone;
    creating new forms of demand to expand the pie.


    Now, social risk strategic management should include the entire process of overall
    planning and rational response by social organizations at all levels to all factors
    that may break the conventional system in the external and internal environments
    faced by the organization, as well as the anticipation, avoidance, response, utilization
    and transfer, and disposal of possible structural changes.


    Risk strategic management includes static pre-event rehearsal, dynamic in-event
    disposal, and post-event repair. Risk strategy possesses the characteristics of
    systemicity, foresight, globality, synergy, strategy, operability, and interest
    maximization.


    ---


    [[1]](#Chapter_6_1.xhtml#BT2) Adrian J. Slywotzky is the Global Vice President
    of Mercer Management Consulting and a renowned best-selling author, hailed by
    *Industry Week* as the "Peter Drucker of the 21st Century, a Management Master
    Surpassing His Peers." He is the author of influential bestsellers such as *The
    Profit Zone*.


    ## 2.2 The Theoretical System of Risk Society


    Risk society refers to a stage of social development in the context of globalization
    where global risks caused by human practice occupy a dominant position. In such
    a society, various global risks pose serious threats to human survival and development.


    With the increase in the frequency of human activities and the expansion of their
    scope, the influence of their decisions and actions on nature and human society
    itself has also greatly increased, causing the risk structure to gradually evolve
    from one dominated by natural risks to one dominated by man-made uncertainties.
    Furthermore, there is the "institutionalization" of risk and the "risk of institutionalization."
    Humans possess an adventurous nature but also an instinct for safety; a series
    of institutional creations since modern times have provided an environment for
    realization and a normative framework for these two contradictory orientations.
    Various institutions related to the market (typically the stock market) provide
    incentives for adventurous behavior, while various institutions established by
    the modern state provide protection for human safety. However, whether they are
    adventure-oriented or safety-oriented institutions, they themselves bring another
    risk—the risk of operational failure—thereby transforming the "institutionalization
    of risk" into "risk of institutionalization."


    In 1986, Beck published *Risk Society* in Germany. The synopsis of this book states
    that Ulrich Beck interprets postmodern society as a risk society, its main characteristics
    being: humanity faces risks manufactured by society that threaten its existence.
    The society we live in is filled with an attitude of organized irresponsibility;
    especially, the manufacturers of risks protect their own interests at the expense
    of risk victims. The author believes that Western economic, legal, and political
    systems are not only involved in the manufacture of risks but also participate
    in covering up the truth of risks. Beck strongly advocates reflexive modernization,
    characterized by both insight into the dilemma of rationality in modernity and
    an attempt to resolve this dilemma with a rational spirit. [[1]](#Chapter_6_2.xhtml#B3)


    Beck believes that the concept of risk society refers to a stage of modernity.
    In this stage, the threats produced on the path of industrial society begin to
    dominate. The concept of risk society brings about epochal systemic transformations
    in three reference areas. First is the relationship between modern industrial
    society and natural and cultural resources, which gradually disappeared after
    modernization was fully established; second is the relationship between society
    and the threats and problems it produces itself, which exceed society''s understanding
    of safety. Once people realize the existence of these threats and problems, they
    are likely to shake the fundamental assumptions of the old social order; finally,
    the sources of collective or specific group meaning in industrial society culture
    (such as class consciousness or belief in progress) are drying up and losing their
    charm. In Beck''s view, one of the core problems of industrial society is the
    distribution of wealth and the improvement and legitimization of inequality. In
    risk society, however, we must take the mitigation and distribution of harm as
    the core problem. In classical modernity, wealth and power are its signature concepts,
    while risk and uncertainty are the concepts of reflexive modernity.


    Beck''s *Risk Society* remained silent for several years until it was translated
    into English by Mark Ritter in 1992; only then did "risk society" become accepted
    by more Western scholars and the public as a concept and theory.


    Risk society as a concept is not in the sense of historical periodization, nor
    is it a specific historical stage of development of a certain society and country,
    but rather a vivid depiction of the characteristics of the era in which humanity
    currently finds itself. Therefore, we can say that humanity is in the era of risk
    society, but we cannot say that a certain country is a risk society, even if that
    country''s domestic situation is more insecure than others. However, risk society
    is not only a cognitive concept but also an emerging order and public space. In
    the latter sense, it is more realistic and practical. As Giddens, Beck, and others
    have said, the order of risk society is not hierarchical or vertical, but network-based
    and horizontally expanding, because risks in risk society are "egalitarians,"
    sparing no one. The structure of risk society is not composed of elements such
    as classes and strata, but of individuals as subjects. Nation-states with clear
    geographical boundaries are no longer the sole governing subjects of this order;
    the cross-border nature of risks requires more governing subjects to emerge and
    reach cooperative relationships.


    In risk society, risks possess the following characteristics:


    (1) Fundamentally speaking, risks are endogenous, accompanying human decisions
    and behaviors, and are the joint result of the normal operation of various social
    systems, especially industrial systems, legal systems, technology, and applied
    sciences. The increase in the degree of "humanization" of nature makes the endogenous
    characteristics of risks even more obvious.


    (2) In terms of impact and consequences, risks are extensive. Their spatial impact
    is global, transcending the limitations of geographical boundaries and socio-cultural
    boundaries; their temporal impact is continuous, capable of affecting future generations.


    (3) In terms of characteristics, most risks have severe consequences but a low
    probability of occurrence. Therefore, we can say that although risks have increased,
    it does not mean that the world we live in has become unsafe.


    (4) In terms of response methods, existing risk calculation methods and economic
    compensation methods are difficult to fundamentally solve the problems. New mechanisms
    for responding to risks must be constructed by enhancing the reflexive capacity
    of modernity.


    ---


    [[1]](#Chapter_6_2.xhtml#BT3) Ulrich Beck: *Risk Society*, Beijing: Yilin Press,
    2004, pp. 15–22.


    ## 2.3 Dilemmas of Global Risk Governance


    The definition of modern risks has changed significantly compared to previous
    risks: first, man-made and subjective risks have greatly increased; second, organized
    and systemic sources of risk have clearly emerged; third, risk governance means
    have shifted from relying solely on technological progress to tending towards
    multi-dimensional governance systems.


    The emergence and development of modern risks are closely related to the theory
    of reflexive modernity. The theory of reflexive modernity incorporates the entire
    modernization process into its scope of thought, interpreting its structural fractures
    as consequences of modernization itself. Here, reflexivity contains a double meaning:
    one is self-refutation (`self-refutation`), and the other is self-reflection (`self-reflection`).
    Self-refutation refers to the irrational or even anti-rational consequences incurred
    by modernization centered on science and rationality, which continuously dissolve
    the foundations of its own existence; self-reflection represents the reflection
    of rationality—which pursues self-knowledge and certainty—on its own nature, thereby
    possessing the possibility of destroying its ability to acquire certain knowledge.
    Therefore, the study of modern risks possesses both the essence of modernity and
    the orientation of postmodernity. The essence of modernity is expressed in the
    value orientation of seeking value rationality for the development of the modern
    economy, and also in seeking a basis for the ethical spirit of modern society;
    the orientation of postmodernity is expressed in the perplexed questioning, value
    reflection, and critique and sublation of modern ethical methods regarding modernity
    and modernization. The study of modern risks faces many dilemmas: the dilemma
    of risk facts vs. risk judgment, the dilemma of the present vs. the future of
    risk, the dilemma of the individuality vs. publicity of risk, etc. Consequently,
    this inevitably requires risk governors to make effective and reasonable ethical
    decisions, thereby transcending risk itself and achieving the moral governance
    of modern risks.


    The most negative phenomenon in risk governance is risk avoidance, the so-called
    "governing by non-action" and "do less to make fewer mistakes, do nothing to make
    no mistakes."


    The difficulty of governing risk society is based on the ontological insecurity
    essence of this risk and the various characteristics derived from it. [[1]](#Chapter_6_3.xhtml#B4)
    It is precisely because of the many characteristics, manifestations, and symptoms
    of risk that we have the possibility of predicting, controlling, and governing
    risk. The insight into and generalization of various risk governance dilemmas
    and problems are prerequisites for effective governance; they therefore require
    us to have a systematic, comprehensive, and scientific understanding and plans.
    Generally speaking, compared with daily or procedural decisions, risk decisions
    have the characteristics of being major, strategic, and complex; the decision-making
    process needs to be more precise, and the decision-making results need to be closer
    to the target. Therefore, the risk assessment of decisions needs to design a more
    reasonable mechanism. The mechanism of decision-making risk assessment is a process
    of mutual combination of decision-making systems and tools, constituted by analysis,
    consultation, and judgment.


    Risk analysis of decisions is the scientific basis for assessment. Analysis is
    the process of producing decision-making knowledge using scientific methods, including
    problem structure analysis, expectations of decision-making results, selection
    of decision-making plans, and in specific situations, monitoring of decision-making
    execution results and evaluation of the performance of decision-making plans.
    Problem structure analysis is the decomposition of the elements of the decision-making
    problem and the sorting out of the relationships between elements. Usually, the
    problems that decision-making risk assessment needs to solve present complex relationships
    among their elements, rather than simple linear relationships. In other words,
    problems where elements present linear relationships are incorporated into daily
    procedural decisions, while complex relationships among elements require the support
    of interdisciplinary knowledge. These complex relationships are reflected in the
    multiple fields involved in risks, or in stubborn problems in a single field that
    have long been wanted to be solved but could not be. From the perspective of the
    degree of structuring, the complexity of the problem is mainly manifested in:
    unclear evolution mechanisms and paths, requiring multi-dimensional observation;
    the problem has multiple alternative solutions; the problem involves multiple
    interested actors, and there are conflicts of interest, needs, and values among
    the actors. Problem structure analysis aims to depict the above characteristics
    and provide a scientific basis for identifying the degree of problem complexity.
    Analysis of expected decision-making results requires the support of data, information,
    and knowledge. From data to information, and then to the formation of knowledge,
    this analysis process reflects the gradually clarifying understanding of future
    expectations. Data presents individualized and quantitative characteristics; the
    process of analyzing data constitutes the source of various types of information;
    through scientific research, information is transformed into knowledge, and knowledge
    becomes the presentation form of expectations for decision-making results. The
    selection of decision-making plans is both a value judgment and a factual judgment
    based on value analysis and comparison.


    The institutions usually engaged in decision-making risk analysis fall into three
    categories: scientific research institutions of universities and research institutes,
    social professional research institutions, and research institutions within the
    government system. These institutions possess the attributes of think tanks. Experts
    and think tanks provide risk analysis for decision-making and provide multiple
    types of knowledge.


    Decision-making risk assessment needs to build a consultation mechanism. Behind
    the decision-making to solve complex problems lies the need to face the competition
    and conflict of multiple interests. Risk assessment needs to construct a mechanism
    to resolve value and interest conflicts. Because the analysis process only solves
    the scientification of the decision-making plan, but does not solve the feasibility
    and rationality of the plan, the decision-making process itself needs dialogue
    and participation centered on consultation among multiple actors. For decision-making
    risk assessment, the exchange of interests, needs, preferences, and emotions among
    multiple actors can improve the quality of risk assessment, make the decision-making
    plan more precise, and make execution smoother. The multi-level and multi-channel
    consultative democracy construction currently vigorously promoted by the Party
    and the government has important significance for advancing decision-making risk
    assessment.


    Decision-making risk assessment also needs the support of local knowledge and
    practical experience; this knowledge makes up for the insufficiency of the universal
    knowledge provided by the analysis process, thereby comprehensively improving
    the quality of decision-making risk assessment. Local knowledge and practical
    experience enter the decision-making risk assessment process through multi-subject
    consultation methods. Successful consultation also requires guarantees such as
    information disclosure, actors possessing consultation capabilities, substantive
    participation, and the creation of equal consultation opportunities.


