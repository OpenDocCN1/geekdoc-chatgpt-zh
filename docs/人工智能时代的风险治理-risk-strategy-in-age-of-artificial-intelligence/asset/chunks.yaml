    Overall, "the Internet''s intervention in group events has produced a catalytic
    or radicalizing effect." To warn of group events more effectively and timely,
    so as to control them before they cause destructive impacts, it is necessary to
    rely on big data for group event early warning.


    ### 1. Data Sharing: Monitoring Social Conditions by Field for Precise Early Warning


    The large-scale production of massive data is a basic characteristic of the big
    data era and also the information source for group event early warning. Relying
    on big data collection and processing technology, the intelligent early warning
    model will capture full-network data, realizing quantitative analysis of massive
    data, letting the data speak. The full-data early warning model can effectively
    avoid the time lag and sample errors of sample data in traditional models, ensuring
    timely control of group event information and seizing effective early warning
    opportunities. Adopting a full-data early warning model, treating the whole as
    the sample, requires real-time monitoring, timely screening, and real-time sharing
    of massive data. To this end, Internet technology must be used to monitor real-time
    information across all fields of society—from macro fields to micro levels, from
    overall situations to local states, from group situations to individual cases—to
    achieve a comprehensive grasp of Internet data. In massive data clusters, based
    on keywords, indicator design, and statistical algorithms for group event early
    warning, valuable information is screened and shared in a timely manner across
    different fields. Relevant organizations in different fields closely track hotspot
    information that may facilitate group events, such as subject groups, involved
    regions, demand intentions, goal orientations, conflict nature, influencing factors,
    emotional changes, onlookers, development trends, and inter-correlations, drawing
    a "risk map" of group events, and making situation analysis and trend judgments
    as soon as possible. Relying on big data support, event clues can be discovered
    more keenly, and pre-control measures can be taken in a timely manner to achieve
    precise early warning of group events.


    ### 2. Experience Sharing: Building Categorized Case Libraries to Support Decision-Making


    Relying on full Internet data for information screening, precise early warning,
    and trend judgment of group events is of great significance. When these data point
    to a group event trend, early warning personnel need to take effective measures
    in a timely manner to prevent and control the occurrence of group events. However,
    what constitutes effective early warning measures, and which measures are low-cost
    and high-efficiency, can draw on the experience given by past cases. Collecting
    historical cases of group event governance and establishing case libraries categorized
    by field, type, and level provides a platform and channel for the transformation
    of knowledge into power and into practical benefits. Setting case semantic interpretation
    as data-based indicators, then providing keyword retrieval for timely early warning,
    establishing data decision-making process models and intelligent decision-making
    systems to assist in early warning decision-making for individual cases. On the
    one hand, using the search guidance of case data to quickly and accurately find
    similar cases and case groups, analyzing the early warning measures and implementation
    effects of occurred group events. On the other hand, using the experience sharing
    of case data to excavate the functions of case library data collection, data classification
    and mining, case management, and data retrieval. On the basis of setting key conditions
    and important factors, carrying out data operations, model deduction, and simulation
    reasoning to obtain the optimal early warning strategy for the current case, effectively
    avoiding subjective empiricism in manual decision-making, and promoting the scientific
    nature of group event early warning.


    ### 3. Knowledge Sharing: Leveraging the Advantages of Technical and Professional
    Knowledge in Early Warning of Group Events


    For a long time, emphasizing scientific and technological knowledge and information
    technology to enhance government emergency management and emergency decision-making
    has been an important tool and means for crisis management and emergency management.
    Knowledge is systematic, scientific, rational cognition based on objective research
    and practical verification. For promoting rapid and efficient early warning work,
    this rational cognition possesses technical and professional advantages. Precisely
    because of its professionalism and technicality, not everyone can possess knowledge.
    In group event early warning activities, enabling every participant to possess
    basic theoretical knowledge and action skills makes knowledge sharing particularly
    important. The emergence of the Internet has provided technical conditions for
    such knowledge sharing. First, the objectification of cognition requires mutual
    verification of Internet information. As a cognition of objective facts of social
    events, the Internet corrects the bias of the information market with its multi-source
    information flow, helping people form objective factual cognition and judgment,
    and preventing negative emotions from breeding group events. Second, the Internet
    provides more opportunities for people to consult and understand professional
    knowledge, which is greatly beneficial for preventing conflicts from breeding,
    escalating, and deriving destructive group events due to cognitive blindness in
    certain professional fields. Third, technical early warning is an important tool
    for group event early warning in the big data era. Information collection technology,
    data analysis technology, trend judgment technology, intelligence tracking technology,
    case search technology, decision support technology, etc., based on the Internet
    are basic technologies for group event early warning; technical learning and sharing
    are crucial for the smooth early warning of group events.


    ### 4. System Co-construction: Establishing a Data Early Warning System Around
    Group Event Related Information


    Relying on big data to carry out group event early warning requires a sound system
    as a guarantee. First, establish and improve a system for public online participation
    to promote rational and standardized online expression. The wishes and demands
    expressed by the public are the basic data source for technical early warning
    of group events; only expressed demands can be discovered, paid attention to,
    and then realized. On the one hand, encourage public expression and reduce silent
    repression: "Either explode in silence or perish in silence." Public expression
    not only makes them understood, increasing the possibility of realization, but
    also helps them vent emotions. On the other hand, reduce the public''s irrational
    anomie expression; anomie expression affects data authenticity and increases the
    scientific nature of data analysis and situation judgment; therefore, public online
    participation needs a complete system. Second, a system for data collection, analysis,
    and use. The orderly development of big data sharing covering real-time data,
    case experience, and knowledge technology is a prerequisite for group event data
    early warning. To this end, it is necessary to establish and improve a big data
    sharing system. Break information barriers between different subjects to achieve
    data collaboration; promote case library construction, establish case application
    and assisted decision-making technology, learn, exchange, and share group event
    early warning experience; popularize basic knowledge of group event early warning,
    learn professional data early warning technology, cultivate data early warning
    skills, and cultivate a data early warning team. Third, guarantee the implementation
    of group event early warning decisions with a networked system. Based on data
    operations, case deduction, and knowledge assistance, make the scientific nature
    of group event early warning decisions traceable. The quality of decision execution
    directly affects the overall social effect of early warning decisions; weak early
    warning instead leads to the expansion of group event scale and intensity, affecting
    government social credibility and early warning confidence.


    ### 5. Environment Co-construction: Purifying the Online Media Ecology, Reducing
    Negative Stimuli, Guidance, and Demonstration


    The Internet provides great convenience for the circulation and dissemination
    of information, but the noise existing in the circulation and dissemination of
    online information brings huge interference to the maintenance of online order.
    This noise is divided into two categories: one is premeditated online rumors,
    and the other is unconscious stimulating information. These two types of noise
    are most likely to emerge in risk-concentrated areas and reproduce and spread
    rapidly via the Internet. Group events, as an important manifestation of social
    risk habitation and social contradiction aggregation, are prone to generate conscious
    or unconscious interference information centered around them, which spreads rapidly
    under people''s self-protection psychology. This information affects people''s
    factual judgment, emotional reflection, and action choices, triggering group events.
    Strengthen Internet information regulation, purify the online media ecology, reduce
    the stimulation of online rumors on the public, avoid the bad guidance and demonstration
    of negative information, and build a trust-based cyberspace environment characterized
    by rational expression, neutral judgment, objective analysis, and positive guidance.


    In summary, integrating data resources that are relatively segmented across different
    regions, fields, and departments, relying on big data support, group event early
    warning needs to combine technology with management and integrate data with society
    under the overall national security governance framework. It should integrate
    social management into data technology, use data technology to improve management
    efficiency, advance intelligent decision-making for group event early warning
    through the sharing of data, experience, and knowledge and the co-construction
    of systems and environments, and achieve precise early warning and scientific
    prevention of group events in multi-party collaborative comprehensive social governance.


