    \n[\\[3\\].](#Chapter_8_1.xhtml#BT7)Christoph koutschan:《大数据最核心的关键技术—32个算法》, CIO时代学院网站，http://www.ciotimes.com/bigdata/169572.html.\n\
    \n[\\[4\\].](#Chapter_8_1.xhtml#BT8)王秉，吴超：《安全情报概念的由来、演进趋势及涵义—来自安全科学学理角度的思辨》, 《图书情报工作》,2019年第3期，第45—53页。\n\
    \n## 4.2 风险情报分析发现\n\n美国《国防部军事与相关术语字典》认为，情报分析是通过对全源数据进行综合、评估、分析和解读，将处理过的信息转化为情报以满足已知或预期用户需求的过程。\n\
    \n风险情报分析的目的是提供社会治理决策者或组织决策者有关风险信息的一整套综合决策支持和应对处置流程。\n\n风险情报分析平台一般包括多源数据采集收集、应用检索、决策知识库、数据分析（包括可视化呈现）、风险预警、决策支持、任务响应、行动协同、效能监测等几个部分。\n\
    \n有分析说：“战争中得到的情报，很大一部分是互相矛盾的，更多的是假的，绝大部分是相当不真实的。这就要求军官具有一定的辨别能力，这种能力只有通过对事物和人的认识和判断才能得到。”面对现代战争中越来越多的信息，如果不能有效提取优质信息，去除其中夹杂着的大量“信息糟粕”，就可能陷入“信息误区”，从而处于信息劣势地位，无法取得战争的主动权。\n\
    \n大数据技术就是从复杂信息中发现信息的关联性，揭示隐蔽性的事实，增强可信性的一门科学，它能够有效弥补传统分析方法在信息加工方面的不足，因此在战略态势感知方面越来越需要大数据技术的参与和支持。\n\
    \n风险情报数据分析算法的科学性对大数据处理来说至关重要，其直接影响所得结论的准确性。对于战略态势感知来说，需要有针对性地运用不同的算法，对特定事件出现的各种征兆或迹象进行采集、质疑、假设、数据补充、验证和评价，这一过程往往需要重复循环进行并不断修正，以提高结论的准确性。然而有关算法的逻辑基础大多是基于人的判断，虽然人的判断在后续会得到修正，但是如果一开始方向就是错误的，得到的结论可能会距离真相越来越远。\n\
    \n对于态势感知来说，大数据处理算法需要因时、因势、因事而定，片面的或者僵化的算法都将产生严重的误差，而人为因素的全程介入，则又将造成一定的主观性，二者的矛盾需要很好地协调解决，才能切实增强感知的有效性。同时，不同的数据场景、需求和应用场景也决定了使用的算法的不同或者性能的优劣，只有在不断地对相关算法进行调整、修正和测试比对的过程中才能找到最高效和接近现实演变及发展规律的算法。\n\
    \n通过大数据分析的方法发现风险的演进规律和预警性情报，对有效打击和预防风险提供必要的决策支持。信息化在国家安全领域的持续推进，随之带来的是各部门信息和数据意识的不断提升和增强，这也使得实际工作中大量数据的产生，在此类规模庞大的数据中，包含着我们尚未发现的有价值的内容。为有效利用海量数据，必须要有专门和高效的分析工具，实际运用和大数据有关的挖掘技术，将是有效解决这一需求的重要途径。\n\
    \n计算机应用技术的发展大致可以分为数值计算、数据处理、知识处理等三个方面。其中，数值计算主要侧重对于算法的研究；数据处理的主要对象为海量数据，数据库语言是其最具代表性的语言。伴随技术的发展，信息管理系统在数据库的基础上应运而生，主要作用在于实现对数据库进行方便的查询、修改和汇总，并及时提供我们需要的计算结果，以提高对数据库的管理效率。但是，实际工作中发现，对于复杂的系统，仅仅简单地依靠人工的方式提出计算指标，很难有效地实现对数据库的管理。此时，最有效的解决方案就是计算机代替人工对模型进行优化，再提出具体的解决方案。\n\
    \n数据库使用的时间越长，其自身所积累的数据就越多。随着数据的大量搜集和积累，我们运用有效的方式从中挖掘有用的信息就显得格外重要。解决问题的方法总是伴随问题而生，美国数据仓库之父比尔·恩门（Bill\
    \ Inmon）在《建立数据仓库》中提出了数据仓库概念，即数据仓库是面向主题的、集成的、相对稳定的且随时间变化的数据收集，为管理决策提供支撑。其主要作用是将分散在不同平台上的数据进行重新组合和处理，形成主要面向决策的数据集。数据仓库最根本的特点是其中的数据不是新产生和专有数据，而是对其他数据库中数据的重新整合。数据仓库的建立不是取代原有的数据库，而是建立一个更加全面、完善的信息应用平台来支持高层决策分析。\n\
    \n数据仓库是在数据库技术上发展的一个新应用，最大特点是利用数据库管理系统对数据进行管理，体现在面向主题、高度集成、系统稳定、数据量庞大四个特点上。在运行过程中，数据仓库还需借助可视化工具、联机分析处理等前端访问工具。可视化工具以图形的形式显示数据，以了解数据结构的特点上。联机分析处理能够实现在线分析的功能。从此类长期积累的数据中挖掘分析有用的信息，实现知识发现的主要任务。数据挖掘（Data\
    \ Mining）是知识发现（Knowledge Discovery in Database）的处理过程，也同时是知识发现的最重要环节。其具体含义是根据特定的要求从数据库中提取潜在有用信息的过程。\n\
    \n人工智能、统计学等也是知识发现和数据挖掘最常用的工具。人工智能概念在达特茅斯学院召开的研讨会上首次被提出来，到了20世纪70年代初期，人工智能开始新一轮的发展高潮，出现了大量成功的专家系统应用程序。20世纪80年代后期，人工神经网络研究将人工智能再次推向一个新的高度。与人工智能相关联的专家系统和机器学习等分支也在迅速发展。现实案例中典型的专家系统有两个部分：一是知识库+推理机+人机接口，与上述决策支持系统有些相似；二是人工神经网络系统，主要实现统计、回归、聚类等功能。知识发现和数据挖掘综合应用这些技术，从大量的数据中发现规律，提取模式，形成新的知识。虽然现在有专门的软件，但技术不能说已经非常成熟，人们已经认识到利用数据挖掘技术来寻找与行业工作相关的信息是每个行业适应信息时代发展的需要。因此，数据挖掘技术在各个行业中的有效应用逐渐受到人们的研究和重视。\n\
    \n“情报”在《辞海》里的解释为：“以侦察手段或其他方法获得的有关敌人军事、政治、经济等各方面的情况，以及对这些情况进行分析研究的成果”；“泛指一切最新的情况报道，如科学技术情报”。\n\
    \n社会安全风险情报工作是利用各种技术手段搜集、分析、研判、综合获取的内容，最终形成各种形式的风险情报产品。伴随现代化信息技术的发展，用户能够借助数据库和搜索引擎得到更多资源，并通过数据分析系统进行初步分析和研判。通用的信息获取和分析手段中，数据挖掘是最重要的技术之一，用户能够利用数据挖掘技术构建全面高效的情报分析预警体系。在新的国际环境和时代背景下，单纯依靠情报人员归纳、推理进行数据分析难以满足需求，在现有技术条件的支撑下，开发适合部门业务特点的数据挖掘和分析系统，将是提升风险情报发现能力赢得治理主动权，进而构建现代社会风险治理体系的必由之路。\n\
    \n\uFEFF\n\n## 4.3 风险数据挖掘\n\n数据挖掘是指从大量、不完整、有噪声、模糊和随机的数据中通过算法搜索隐藏在其中有用的信息和知识的过程，其本质是发现新知识的应用技术。随着信息技术的飞速发展，人们所积累的数据量在不断地高速增长，最明显的是以TB为计算单位的数据规模已成为数据挖掘的常态。如何从海量的数据中提取我们所需要的有用信息是数据挖掘的核心目的。\n\
    \n数据挖掘的本质是指从大量数据中提取或挖掘出有用的知识。知识发现（Knowledge Discovery in Database，简称KDD）是数据挖掘一种广义的说法，具体含义是指从各种媒体表达的信息中，根据不同的需求获得知识。知识发现的目的是替使用者筛除原始数据的烦琐细节，从原始数据中提炼出有意义的、简洁的知识，直接向使用者报告。数据挖掘是知识发现中的一个特殊步骤，它们之间的区别可以理解为：知识发现比数据挖掘更具普遍性，而数据挖掘是一个更为具体和深入的概念。知识发现过程由以下迭代序列组成：数据挖掘、模式评价和知识表示，其中数据清理、数据集成、数据选择和数据转换是为挖掘准备数据的不同形式的数据预处理。数据挖掘的步骤可以与用户或知识库交互。有趣的模式作为新知识提供给用户或存储在知识库中。从狭义上说，数据挖掘只是这个过程中的一个步骤，尽管是非常重要的一步。从广义上说，数据挖掘是从数据库、数据仓库或其他信息库中存储的大量数据中发现有趣知识的过程。\n\
    \n数据挖掘的任务一般可以分为两大类：一是预测任务，此类任务的目标是根据其他属性值来预测特定属性的值，这里被预测的属性一般称为目标变量，而用来做预测的属性称说明变量；二是描述任务，目标是导出概括数据中潜在联系的模式，描述性数据挖掘任务通常具有探索性，并且常常需要后处理技术来验证和解释结果。\n\
    \n一是总结。数据总结的目的是集中数据，对数据进行简洁的描述。传统的方法是计算每个字段的数据库中的求和值、平均值、方差等，或者使用图形化的方式进行表述。数据挖掘主要的关注点是从数据泛化的角度来讨论数据总结。数据泛化的具体概念是一个从相对低层概念到更高层概念，并且对数据库中与任务相关的大量数据进行抽象概述的分析过程。由于数据库中的数据或对象总是包含最原始、最基本的信息，这是为了不造成任何有用的数据信息遗漏。为了数据使用的便捷性，使用者往往希望能够从较高层次的视图上处理或浏览数据，因此对数据进行不同程度上的泛化是为了便于查询的需要。\n\
    \n二是分类。分类是找出数据库中一组数据对象的共同特点并按照分类模式将其划分为不同的类，其目的是通过分类模型，将数据库中的数据项映射到某个给定的类别。一般情况下，分类和回归可用于预测。预测的目的是自动从历史数据记录中推导出给定数据的扩展描述，从而可以预测未来遇到的数据。分类和回归最大的区别就是，分类的输出是离散的类别值，回归的输出是连续的数值。\n\
    \n三是聚类。聚类也称为聚类分析或细分，基于一组属性对事例进行分组，同一聚类中或多或少有相似的属性值。聚类分析是把一组数据按照相似性和差异性分为多个类别，其目的是使得属于同一类别的数据间的相似性尽可能大，不同类别中的数据间的相似性尽可能小。聚类的方法包括统计方法、机器学习方法、神经网络方法等。\n\
    \n四是关联。数据关联是数据库中存在的一类重要的可被发现的知识。具体含义是，若两个或多个变量的值存在某种规律性，我们就称之为关联。关联可分为简单关联、时序关联、因果关联。关联分析的目的是找出数据库中隐藏的关联网。然而，很多情况下，我们并不知道数据库中数据的关联函数，或者即使知道也不确定，因此关联分析生成的规则带有可信度。\n\
    \n五是时序。时序模式是指通过时间序列搜索出的重复发生概率较高的模式。和回归一样，它也是用已知的数据预测未来的值，但这些数据的区别是变量所处时间的不同。\n\
    \n六是偏差分析。偏差分析又称比较分析，指的是对差异和极端特例的描述，用于揭示事物偏离常规的异常现象。数据库中的数据存在许多异常情况。它们与数据的一般行为或模型不一致，此类数据对象也称为离群点。大多数数据挖掘方法将离群点处理为噪声或异常进行丢弃。然而，在一些应用程序中，罕见的事件可能比普通事件更有价值和意义。异常数据的数据库非常重要，偏差检验的基本方法是找出观测结果与参考值之间的差异。\n\
    \n数据挖掘方法一般分为以下几种：\n\n（1）遗传算法。遗传算法是一种自适应的全局优化概率搜索算法，用于模拟自然环境中生物体的遗传和进化过程。其第一次由美国密歇根大学计算机系教授、心理学系教授John\
    \ Holland提出，这种算法具有计算简单、优化效果好的特点，它在处理组合优化问题方面也有一定的优势，可用于聚类分析。\n\n（2）粗糙集方法。粗糙集理论作为数据分析处理理论，在1982年由波兰科学家Z.Pawlak创立。该理论最早由于语言的问题而被提出，1992年关于粗糙集理论的第一届国际学术会议在波兰召开，1995年ACM将粗糙集理论列为新兴的计算机科学的研究课题。粗糙集方法广泛应用于不精确、不确定和不完全信息的分类和知识获取。\n\
    \n（3）决策树方法。通俗来讲，将决策问题的自然状态或条件出现的概率、行动方案、益损值、预测结果等，用一个树状图表示出来，并利用该图反映出人们思考、预测、决策的全过程。决策树方法使用训练集生成测试函数，根据不同的值建立树的分支，并在每个分支集中反复建立下一层节点和分支。这样，生成决策树，然后修剪决策树，最后将决策树转化为规则，主要用于分类和挖掘。\n\
    \n（4）神经网络方法。人工神经网络就是模拟人类的思维方式，是一个非线性动力学系统，其特色在于信息的分布式存储和并行协同处理。虽然单个神经元的结构功能有限，但大量神经元构成的网络系统所能实现的行为却是极其丰富多彩的。\n\
    \n（5）模糊逻辑。主要是模仿人脑的不确定性概念判断、推理思维方式，对于模型未知或不能确定的描述系统，以及强非线性、大滞后的控制对象，应用模糊集合和模糊规则进行推理，表达过渡性界限或定性知识经验，模拟人脑方式，实行模糊综合判断，推理解决常规方法难于对付的规则型模糊信息问题。在数据挖掘领域，模糊逻辑可用于模糊综合判别和模糊聚类分析。\n\
    \n（6）聚类分析。聚类分析是根据事物的特点对其进行聚类或分类。从中发现规律和典型模式。通过聚类后，将数据集转换成群集，具有类似的数据变量值相同的类，不同类型的变量数据值不具有相似的性质。这种技术是数据挖掘中最重要的技术。"
  fmt: '

    ## 4.1 风险情报概述


    风险苗头信息的发现具有极大的社会价值，发现风险是风险治理的关键，也是风险治理的首要工作。这些信息已经具备了情报的意义。所谓风险情报，是指被发现或正在传递的风险线索、风险知识或风险事实，是运用一定的方式方法发现、接收、传递的特定信息或知识。风险情报、威胁情报、安全情报都是某一特定领域的危机线索、安全线索、风险线索信息。


    根据 Gartner 对威胁情报的定义，威胁情报是某种基于证据的知识，包括上下文、机制、标识、含义和能够执行的建议，这些知识与资产所面临的已有的或酝酿中的威胁或危害相关，可用于资产相关主体对威胁或危害的响应或处理决策提供信息支持。业内大多数所说的威胁情报可以认为是狭义的威胁情报，其主要内容为用于识别和检测威胁的失陷标识，如文件
    `HASH`、 `IP`、域名、程序运行路径、注册表项等，以及相关的归属标签。威胁情报旨在为面临威胁的资产主体（通常为资产所属企业或机构）提供全面的、准确的、与其相关的并且能够执行和决策的知识和信息。


    ### 威胁情报分类


    威胁情报通常分为以下四种：


    **战略威胁情报（`Strategic Threat Intelligence`）**。战略威胁情报提供一个全局视角看待威胁环境和业务问题，它的目的是告知执行董事会和高层人员的决策。战略威胁情报通常不涉及技术性情报，主要涵盖诸如网络攻击活动的财务影响、攻击趋势以及可能影响高层商业决策的领域。


    **运营威胁情报（`Operational Threat Intelligence`）**。运营威胁情报与具体的、即将发生的或预计发生的攻击有关。它帮助高级安全人员预测何时何地会发生攻击，并进行针对性的防御。


    **战术威胁情报（`Tactical Threat Intelligence`）**。战术威胁情报关注于攻击者的 `TTP`，其与针对特定行业或地理区域范围的攻击者使用的特定攻击向量有关。并且由类似应急响应人员确保面对此类威胁攻击准备好相应的响应和行动策略。


    **技术威胁情报（`Technical Threat Intelligence`）**。技术威胁情报主要是失陷标识，可以自动识别和阻断恶意攻击行为。当前，业内更广泛应用的威胁情报主要还是在技术威胁情报层面。


    ### 威胁情报来源


    威胁情报来源主要包括企业内部网络、终端和部署的安全设备产生的日志数据；安全厂商、行业组织产生的威胁数据；新闻网站、博客、论坛、社交网络；一些较为封闭的来源，如暗网、地下论坛等。


    ### 威胁情报分析方法与模型


    常用的威胁情报分析方法和模型包括 `Lockheed Martin` 的 `Cyber Kill Chain`、钻石分析法、`MITRE ATT&CK`。


    ### 安全情报概述


    安全情报是指所有影响系统安全行为的安全信息。从广义上讲，安全问题是当前国家、政府、企业、社会、大众及学界广泛关注的一个重要现实问题，而安全情报对保障社会安全至关重要。因此，安全情报研究具有十分重要的理论与现实意义，它涵盖了社会的方方面面。


    安全情报是开展系统安全管理工作的前提与基础，安全情报是系统安全管理的“耳目、尖兵与参谋”。


    ### 安全情报的价值


    系统安全管理失败的根本原因是安全情报缺失，就系统安全管理而言，安全情报的价值是解决系统安全管理中的安全信息缺失问题。由此，根据系统安全管理活动的分类（即安全预测活动、安全决策活动与安全执行活动），安全情报的价值主要有以下几个方面：


    1.  **“发现得了，发现得准，发现得早”**：安全情报可充当系统的安全预测（预警）支持系统。它是掌握系统安全管理主动权的先决条件。所谓“发现得了，发现得准，发现得早”，是指成功的安全预测（预警），即在充分收集、了解与掌握各种安全信息的基础上，并通过分析这些安全信息获得有效的安全情报，进而基于安全情报做出超前、正确、科学而精准的安全预测。换言之，安全情报有助于发现系统的安全威胁与安全促进机会，并通过增加超前安全预警时间而增加系统安全管理者的反应时间，进而获得系统安全风险管控优势，做到防患于未然。

    2.  **“决定得好，决定得快，决定得省”**：安全情报可充当系统的安全决策支持系统。它是制定系统安全管理方案的基本要求。所谓“决定得好，决定得快，决定得省”，是指成功的安全决策，即在综合研判各类安全预测情报的基础上，基于最佳安全情报快速作出科学、可靠、有效且经济的安全决策。

    3.  **“防控得早，防控得实，防控得住”**：安全情报可充当系统的安全执行支持系统。这是系统安全管理响应的终极目标。所谓“防控得早，防控得实，防控得住”，是指成功的安全执行，即根据安全决策情报，通过及时、有效而到位地实施安全决策方案（主要指各类安全措施，包括应急管理措施），尽力防控各类不安全事件发生，或通过有效的应急管理措施使不安全事件的不良后果减少及影响降至最低。


    “安全情报还可作为重要的安全学习系统，不仅能帮助系统安全管理者不断接触崭新的安全思想及先进的安全管理方法，并能让系统安全管理者学习事故经验教训等。总之，安全情报工作既可为安全管理工作提供具体线索与思路，又可为安全管理工作提供依据与参考。而安全情报工作是获取安全情报的重要途径，只有安全情报工作做得扎实有效，才能在安全管理中实现‘超前预防’‘耳聪目明’及‘精准施策’。此外，安全情报价值的实现须依赖于积极倡导和践行‘情报主导的安全管理’理念。”[\[4\]](#Chapter_8_1.xhtml#B8)


    ### 情报信息的主要特点


    知识性、传递性、价值性、秘密性和时效性是情报信息的主要特点。风险情报的发现和分析方法与安全情报的发现和分析方法有许多相似和共通之处。


    ## 4.2 风险情报分析发现


    美国《国防部军事与相关术语字典》认为，情报分析是通过对全源数据进行综合、评估、分析和解读，将处理过的信息转化为情报以满足已知或预期用户需求的过程。


    风险情报分析的目的是提供社会治理决策者或组织决策者有关风险信息的一整套综合决策支持和应对处置流程。


    风险情报分析平台一般包括多源数据采集收集、应用检索、决策知识库、数据分析（包括可视化呈现）、风险预警、决策支持、任务响应、行动协同、效能监测等几个部分。


    有分析说：“战争中得到的情报，很大一部分是互相矛盾的，更多的是假的，绝大部分是相当不真实的。这就要求军官具有一定的辨别能力，这种能力只有通过对事物和人的认识和判断才能得到。”面对现代战争中越来越多的信息，如果不能有效提取优质信息，去除其中夹杂着的大量“信息糟粕”，就可能陷入“信息误区”，从而处于信息劣势地位，无法取得战争的主动权。


    大数据技术就是从复杂信息中发现信息的关联性，揭示隐蔽性的事实，增强可信性的一门科学，它能够有效弥补传统分析方法在信息加工方面的不足，因此在战略态势感知方面越来越需要大数据技术的参与和支持。


    风险情报数据分析算法的科学性对大数据处理来说至关重要，其直接影响所得结论的准确性。对于战略态势感知来说，需要有针对性地运用不同的算法，对特定事件出现的各种征兆或迹象进行采集、质疑、假设、数据补充、验证和评价，这一过程往往需要重复循环进行并不断修正，以提高结论的准确性。然而有关算法的逻辑基础大多是基于人的判断，虽然人的判断在后续会得到修正，但是如果一开始方向就是错误的，得到的结论可能会距离真相越来越远。


    对于态势感知来说，大数据处理算法需要因时、因势、因事而定，片面的或者僵化的算法都将产生严重的误差，而人为因素的全程介入，则又将造成一定的主观性，二者的矛盾需要很好地协调解决，才能切实增强感知的有效性。同时，不同的数据场景、需求和应用场景也决定了使用的算法的不同或者性能的优劣，只有在不断地对相关算法进行调整、修正和测试比对的过程中才能找到最高效和接近现实演变及发展规律的算法。


    通过大数据分析的方法发现风险的演进规律和预警性情报，对有效打击和预防风险提供必要的决策支持。信息化在国家安全领域的持续推进，随之带来的是各部门信息和数据意识的不断提升和增强，这也使得实际工作中大量数据的产生，在此类规模庞大的数据中，包含着我们尚未发现的有价值的内容。为有效利用海量数据，必须要有专门和高效的分析工具，实际运用和大数据有关的挖掘技术，将是有效解决这一需求的重要途径。


    计算机应用技术的发展大致可以分为数值计算、数据处理、知识处理等三个方面。其中，数值计算主要侧重对于算法的研究；数据处理的主要对象为海量数据，数据库语言是其最具代表性的语言。伴随技术的发展，信息管理系统在数据库的基础上应运而生，主要作用在于实现对数据库进行方便的查询、修改和汇总，并及时提供我们需要的计算结果，以提高对数据库的管理效率。但是，实际工作中发现，对于复杂的系统，仅仅简单地依靠人工的方式提出计算指标，很难有效地实现对数据库的管理。此时，最有效的解决方案就是计算机代替人工对模型进行优化，再提出具体的解决方案。


    数据库使用的时间越长，其自身所积累的数据就越多。随着数据的大量搜集和积累，我们运用有效的方式从中挖掘有用的信息就显得格外重要。解决问题的方法总是伴随问题而生，美国数据仓库之父比尔·恩门（`Bill
    Inmon`）在《建立数据仓库》中提出了数据仓库概念，即数据仓库是面向主题的、集成的、相对稳定的且随时间变化的数据收集，为管理决策提供支撑。其主要作用是将分散在不同平台上的数据进行重新组合和处理，形成主要面向决策的数据集。数据仓库最根本的特点是其中的数据不是新产生和专有数据，而是对其他数据库中数据的重新整合。数据仓库的建立不是取代原有的数据库，而是建立一个更加全面、完善的信息应用平台来支持高层决策分析。


    数据仓库是在数据库技术上发展的一个新应用，最大特点是利用数据库管理系统对数据进行管理，体现在面向主题、高度集成、系统稳定、数据量庞大四个特点上。在运行过程中，数据仓库还需借助可视化工具、联机分析处理等前端访问工具。可视化工具以图形的形式显示数据，以了解数据结构的特点上。联机分析处理能够实现在线分析的功能。从此类长期积累的数据中挖掘分析有用的信息，实现知识发现的主要任务。`Data
    Mining`（数据挖掘）是 `Knowledge Discovery in Database`（知识发现，简称 `KDD`）的处理过程，也同时是知识发现的最重要环节。其具体含义是根据特定的要求从数据库中提取潜在有用信息的过程。


    人工智能、统计学等也是知识发现和数据挖掘最常用的工具。人工智能概念在达特茅斯学院召开的研讨会上首次被提出来，到了 20 世纪 70 年代初期，人工智能开始新一轮的发展高潮，出现了大量成功的专家系统应用程序。20
    世纪 80 年代后期，人工神经网络研究将人工智能再次推向一个新的高度。与人工智能相关联的专家系统和机器学习等分支也在迅速发展。现实案例中典型的专家系统有两个部分：一是知识库+推理机+人机接口，与上述决策支持系统有些相似；二是人工神经网络系统，主要实现统计、回归、聚类等功能。知识发现和数据挖掘综合应用这些技术，从大量的数据中发现规律，提取模式，形成新的知识。虽然现在有专门的软件，但技术不能说已经非常成熟，人们已经认识到利用数据挖掘技术来寻找与行业工作相关的信息是每个行业适应信息时代发展的需要。因此，数据挖掘技术在各个行业中的有效应用逐渐受到人们的研究和重视。


    “情报”在《辞海》里的解释为：“以侦察手段或其他方法获得的有关敌人军事、政治、经济等各方面的情况，以及对这些情况进行分析研究的成果”；“泛指一切最新的情况报道，如科学技术情报”。


    社会安全风险情报工作是利用各种技术手段搜集、分析、研判、综合获取的内容，最终形成各种形式的风险情报产品。伴随现代化信息技术的发展，用户能够借助数据库和搜索引擎得到更多资源，并通过数据分析系统进行初步分析和研判。通用的信息获取和分析手段中，数据挖掘是最重要的技术之一，用户能够利用数据挖掘技术构建全面高效的情报分析预警体系。在新的国际环境和时代背景下，单纯依靠情报人员归纳、推理进行数据分析难以满足需求，在现有技术条件的支撑下，开发适合部门业务特点的数据挖掘和分析系统，将是提升风险情报发现能力赢得治理主动权，进而构建现代社会风险治理体系的必由之路。


    ## 4.3 风险数据挖掘


    数据挖掘是指从大量、不完整、有噪声、模糊和随机的数据中通过算法搜索隐藏在其中有用的信息和知识的过程，其本质是发现新知识的应用技术。随着信息技术的飞速发展，人们所积累的数据量在不断地高速增长，最明显的是以
    `TB` 为计算单位的数据规模已成为数据挖掘的常态。如何从海量的数据中提取我们所需要的有用信息是数据挖掘的核心目的。


    数据挖掘的本质是指从大量数据中提取或挖掘出有用的知识。`Knowledge Discovery in Database`（知识发现，简称 `KDD`）是数据挖掘一种广义的说法，具体含义是指从各种媒体表达的信息中，根据不同的需求获得知识。知识发现的目的是替使用者筛除原始数据的烦琐细节，从原始数据中提炼出有意义的、简洁的知识，直接向使用者报告。数据挖掘是知识发现中的一个特殊步骤，它们之间的区别可以理解为：知识发现比数据挖掘更具普遍性，而数据挖掘是一个更为具体和深入的概念。知识发现过程由以下迭代序列组成：数据挖掘、模式评价和知识表示，其中数据清理、数据集成、数据选择和数据转换是为挖掘准备数据的不同形式的数据预处理。数据挖掘的步骤可以与用户或知识库交互。有趣的模式作为新知识提供给用户或存储在知识库中。从狭义上说，数据挖掘只是这个过程中的一个步骤，尽管是非常重要的一步。从广义上说，数据挖掘是从数据库、数据仓库或其他信息库中存储的大量数据中发现有趣知识的过程。


    ### 数据挖掘任务分类


    数据挖掘的任务一般可以分为两大类：一是预测任务，此类任务的目标是根据其他属性值来预测特定属性的值，这里被预测的属性一般称为目标变量，而用来做预测的属性称说明变量；二是描述任务，目标是导出概括数据中潜在联系的模式，描述性数据挖掘任务通常具有探索性，并且常常需要后处理技术来验证和解释结果。


    具体任务包括以下六类：


    1.  **总结**。数据总结的目的是集中数据，对数据进行简洁的描述。传统的方法是计算每个字段的数据库中的求和值、平均值、方差等，或者使用图形化的方式进行表述。数据挖掘主要的关注点是从数据泛化的角度来讨论数据总结。数据泛化的具体概念是一个从相对低层概念到更高层概念，并且对数据库中与任务相关的大量数据进行抽象概述的分析过程。由于数据库中的数据或对象总是包含最原始、最基本的信息，这是为了不造成任何有用的数据信息遗漏。为了数据使用的便捷性，使用者往往希望能够从较高层次的视图上处理或浏览数据，因此对数据进行不同程度上的泛化是为了便于查询的需要。

    2.  **分类**。分类是找出数据库中一组数据对象的共同特点并按照分类模式将其划分为不同的类，其目的是通过分类模型，将数据库中的数据项映射到某个给定的类别。一般情况下，分类和回归可用于预测。预测的目的是自动从历史数据记录中推导出给定数据的扩展描述，从而可以预测未来遇到的数据。分类和回归最大的区别就是，分类的输出是离散的类别值，回归的输出是连续的数值。

    3.  **聚类**。聚类也称为聚类分析或细分，基于一组属性对事例进行分组，同一聚类中或多或少有相似的属性值。聚类分析是把一组数据按照相似性和差异性分为多个类别，其目的是使得属于同一类别的数据间的相似性尽可能大，不同类别中的数据间的相似性尽可能小。聚类的方法包括统计方法、机器学习方法、神经网络方法等。

    4.  **关联**。数据关联是数据库中存在的一类重要的可被发现的知识。具体含义是，若两个或多个变量的值存在某种规律性，我们就称之为关联。关联可分为简单关联、时序关联、因果关联。关联分析的目的是找出数据库中隐藏的关联网。然而，很多情况下，我们并不知道数据库中数据的关联函数，或者即使知道也不确定，因此关联分析生成的规则带有可信度。

    5.  **时序**。时序模式是指通过时间序列搜索出的重复发生概率较高的模式。和回归一样，它也是用已知的数据预测未来的值，但这些数据的区别是变量所处时间的不同。

    6.  **偏差分析**。偏差分析又称比较分析，指的是对差异和极端特例的描述，用于揭示事物偏离常规的异常现象。数据库中的数据存在许多异常情况。它们与数据的一般行为或模型不一致，此类数据对象也称为离群点。大多数数据挖掘方法将离群点处理为噪声或异常进行丢弃。然而，在一些应用程序中，罕见的事件可能比普通事件更有价值和意义。异常数据的数据库非常重要，偏差检验的基本方法是找出观测结果与参考值之间的差异。


    ### 数据挖掘方法


    数据挖掘方法一般分为以下几种：


    1.  **遗传算法**。遗传算法是一种自适应的全局优化概率搜索算法，用于模拟自然环境中生物体的遗传和进化过程。其第一次由美国密歇根大学计算机系教授、心理学系教授
    `John Holland` 提出，这种算法具有计算简单、优化效果好的特点，它在处理组合优化问题方面也有一定的优势，可用于聚类分析。

    2.  **粗糙集方法**。粗糙集理论作为数据分析处理理论，在 1982 年由波兰科学家 `Z.Pawlak` 创立。该理论最早由于语言的问题而被提出，1992
    年关于粗糙集理论的第一届国际学术会议在波兰召开，1995 年 `ACM` 将粗糙集理论列为新兴的计算机科学的研究课题。粗糙集方法广泛应用于不精确、不确定和不完全信息的分类和知识获取。

    3.  **决策树方法**。通俗来讲，将决策问题的自然状态或条件出现的概率、行动方案、益损值、预测结果等，用一个树状图表示出来，并利用该图反映出人们思考、预测、决策的全过程。决策树方法使用训练集生成测试函数，根据不同的值建立树的分支，并在每个分支集中反复建立下一层节点和分支。这样，生成决策树，然后修剪决策树，最后将决策树转化为规则，主要用于分类和挖掘。

    4.  **神经网络方法**。人工神经网络就是模拟人类的思维方式，是一个非线性动力学系统，其特色在于信息的分布式存储和并行协同处理。虽然单个神经元的结构功能有限，但大量神经元构成的网络系统所能实现的行为却是极其丰富多彩的。

    5.  **模糊逻辑**。主要是模仿人脑的不确定性概念判断、推理思维方式，对于模型未知或不能确定的描述系统，以及强非线性、大滞后的控制对象，应用模糊集合和模糊规则进行推理，表达过渡性界限或定性知识经验，模拟人脑方式，实行模糊综合判断，推理解决常规方法难于对付的规则型模糊信息问题。在数据挖掘领域，模糊逻辑可用于模糊综合判别和模糊聚类分析。

    6.  **聚类分析**。聚类分析是根据事物的特点对其进行聚类或分类。从中发现规律和典型模式。通过聚类后，将数据集转换成群集，具有类似的数据变量值相同的类，不同类型的变量数据值不具有相似的性质。这种技术是数据挖掘中最重要的技术。


