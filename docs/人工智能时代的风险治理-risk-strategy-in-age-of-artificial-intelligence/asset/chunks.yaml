    ## （一）互联网最新技术发展现状


    ### 1. 大数据应用逐渐成熟，产业处于快速推进期


    大数据技术的发展如火如荼，在国内各个领域都得到了广泛的应用，具有十分良好的发展前景，商业类行业对`大数据`应用较多，主要将`大数据`与传统企业相结合，有效提升运营效率和结构效率、推动传统产业升级转型。目前`大数据`分析解决方案已经逐渐成熟，并且越来越普及。伴随技术进步，以`大数据`为基础而开发的应用将越来越丰富。目前，从发展阶段来看，我国`大数据`产业处于快速推进期，中国和美国几乎同时关注`大数据`产业，但与美国存在一定差距，我国处于探索的初期阶段，想要进一步发展还需要几年的时间。


    ### 2. 人工智能发展突飞猛进，摩尔定律赶不上其流行速度


    `2017年`以来，`人工智能`跳出`AlphaGo`的棋盘，在获得舆论极大关注和资本热情拥抱的同时，在各行业得到广泛应用：在出行领域，由`人工智能`驱动的无人驾驶汽车驶入各种展会；在医疗领域，具有深度学习和图像识别能力的`人工智能`已经可以帮助医生识别肺部结节，甚至通过国家执业医师考试……在人脸识别、智能家居、智能教育、智能语音、物联网等领域，`人工智能`都取得了较快发展。一切都进展得太快，连`摩尔定律`似乎都赶不上`人工智能`流行的速度。据前瞻产业研究院数据，中国`2017年``人工智能`产业规模大概为`135亿元`，`2018年`大概为`203亿元`，同比增长`50%`。


