    胸怀天下的宏大格局决定了一个学者的学术高度和理论视野。明刚院长的《人工智能时代的风险治理》这本极具社会意义和时代特征的风险治理研究专著再次让我们深深地感受到中国知识分子的悲天悯人情怀和大义担当，“为天地立心，为生民立命，为往圣继绝学，为万世开太平”。本书从历史到当代，从理论到实践，对风险问题及治理进行了系统的研究，具有较强的理论性和实践性，对于学习贯彻习近平总书记风险治理的重要论述具有一定的参考价值。我相信，这本书的出版对全社会具有极强的警示意义和较大的风险思维教育价值，对于如何科学准确地分析找出社会风险，及时预警，精准施策，有效治理具有一定的指导意义，并为中国现代社会风险治理基础理论研究和治理应用体系支撑提供借鉴。


