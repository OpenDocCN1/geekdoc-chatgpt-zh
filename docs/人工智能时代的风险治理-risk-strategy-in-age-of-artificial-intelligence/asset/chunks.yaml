- raw: '2010年，IBM正式提出了“智慧城市”愿景，希望为世界和中国的城市发展贡献自己的力量。IBM认为，城市由关系到城市主要功能的不同类型的网络、基础设施和环境六个核心系统组成：组织（人）、业务/政务、交通、通信、水和能源。这些系统不是零散的，而是以一种协作的方式相互衔接，而城市本身，则是由这些系统所组成的综合复杂系统。


    智慧城市通过物联网基础设施、云计算基础设施、地理空间基础设施等新一代信息技术以及自媒体等工具和方法的应用，实现全面透彻的感知、预警、泛在的互联、智能融合应用以及以用户创新、开放创新、大众创新、协同创新为特征的可持续城市发展创新。伴随着社会化媒体的发展与移动技术的融合发展和创新发展进程，现代数字社会环境下的智慧城市是继数字城市之后城市信息化发展的更新形态。


    智慧城市作为信息技术的深度拓展和集成应用，是新一代信息技术孕育突破的重要方向之一，是全球战略新兴产业发展的重要组成部分。开展“智慧城市”技术和标准试点，是科技部和国家标准委为促进中国智慧城市建设健康有序发展，推动中国自主创新成果在智慧城市中推广应用共同开展的一项示范性工作，旨在形成中国具有自主知识产权的智慧城市技术与标准体系和解决方案，为中国智慧城市建设提供科技支撑。


    ## 4.11 智慧政务


    智慧政务的核心是“互联网+政务服务”以及“数据+政务服务”。


    李克强总理在2016年政府工作报告中提出“互联网+政务服务”的概念。报告说，要大力推进“互联网+政务服务”，实现部门间数据共享，让居民和企业少跑腿、好办事、不添堵。简除烦苛，禁察非法，使人民群众有更平等的机会和更大的创造空间。2016年9月25日，经李克强总理签批，国务院印发《关于加快推进“互联网+政务服务”工作的指导意见》。2017年1月12日，《国务院办公厅关于印发“互联网+政务服务”技术体系建设指南的通知》印发，通过加强顶层设计，对各地区各部门网上政务服务平台建设进行规范，优化政务服务流程，推动构建统一、规范、多级联动的全国一体化“互联网+政务服务”技术和服务体系。


    “互联网+政务服务”是政府利用互联网思维、技术和资源实现融合创新的过程，除了通过“连接”提升运作效率、服务能力，更重要的是通过“化学反应”和“基因再造”，重构流程，重塑公共及政务服务，实现政府服务体系的“升级和重塑”。政府通过互联网提供综合型的政务服务平台，整合部门分设的办事窗口和审批服务系统为政府综合服务窗口和网上统一申办受理平台，打破部门界限、政务藩篱和信息孤岛，真正实现让信息多跑路，让群众少跑腿。


    “互联网+政务服务”，促进部门间信息共享，是深化简政放权、放管结合、优化服务改革的重要内容。为进一步推动部门间政务服务相互衔接，协同联动，打破信息孤岛，变“群众跑腿”为“信息跑路”，变“群众来回跑”为“部门协同办”，变被动服务为主动服务，实现“一号一窗一网”目标，促使服务流程显著优化，服务模式更加多元，服务渠道更为畅通，群众办事满意度显著提升。“互联网+政务服务”平台是充分利用基于新一代互联网技术，通过集聚政府资源，建设统一开放共享的政务服务平台，将涉及政府对公民、法人、社会团体提供的政务服务事项进行整合重构，对政府传统的管理理念、职能结构和运行方法进行整合再造，进一步优化调整政府内部的组织架构、运作程序和管理服务手段，提升政府的综合管理效率和服务水平。


    “数据+政务服务”是数据渠道，以政府决策、治理协同和公共服务为核心，充分利用大数据技术，对政府内部和外部各类数据进行收集、分析和利用，是国家治理体系的重要组成部分，是“互联网+政务服务”的升级和补充。“数据+政务服务”的目的是提升政府的社会态势感知能力，增强城市政府的治理能力和公共服务能力，为城市治理群策群治、联防联动提供业务支撑，并为政府重大风险防范与化解提供数据决策支持。


    ## 4.12 大数据与网络反恐


    进入数字时代，网络成为恐怖分子作案的主战场和活动空间，人工获取反恐情报已经难以应对恐怖组织的作案模式。借助网络的隐蔽性、便利性等特点，恐怖分子可以进行资金收集、思想动员、人员招募、蛊惑煽动极端思想，构成自己的力量体系。大量的涉暴涉恐情报信息淹没在网络世界，在虚拟身份的掩盖下更加容易滋生与发展恐怖活动犯罪。在大数据时代，通过技术手段获取、研判和分析反恐情报信息，将大数据分析技术作为反恐利器，已经成为必然之选。


    网络反恐，即在网络空间展开防范危害国家安全的各类治理和阻止、打击恐怖主义破坏的方式和方法。它分为三个层面：第一，充分利用互联网以及大数据技术，及时发现暴力恐怖分子的相关宣传、人员招募、资金筹措、召集、暴恐培训等信息，并利用大数据分析技术，掌握暴恐分子的各类行为，有效预测暴恐分子的各类计划、行踪等，并对暴恐分子进行精确打击和防范，减少暴恐分子对社会的危害。第二，充分利用各类手段，严密防范各类网络恐怖分子对互联网物理的、内容的危害，确保互联网的生态环境安全，同时，防范其可能对工业控制系统的危害，这些工业系统包括电力、水利、核电设施、军用通信网络（含卫星通信）以及民用通信网络等重点系统的安全。它包括相关设施的物理安全、设施安全。第三，充分利用各类媒体，确保互联网上国家舆论生态的安全，为社会发展提供有利的内部和外部舆论环境，拓展良好的外部舆论生态环境，塑造良好的内部社会舆论环境，凝聚人心，让民众安居乐业、团结一心，确保社会发展目标的顺利实现。


    近年来，国际恐怖主义及其破坏活动成为影响世界安全与稳定的一个突出因素，被人们比作“21世纪的政治瘟疫”和“21世纪的幽灵”。当代恐怖主义的特点表现为：一是恐怖主义的恐怖活动日趋政治化，经常以分裂国家和达到极端民族主义要求为目的；二是恐怖活动主要有秘密和公开两种形式，但具体方式日益多样化，包括爆炸、暗杀、绑架、劫持飞机或人质、施毒、危害计算机系统和各类重要基础信息系统安全以及公开打砸抢烧杀等；三是恐怖活动呈现跨国化趋势，恐怖主义往往具有复杂的国际背景，其活动范围涉及多个国家；四是恐怖组织日趋严密化，当今的恐怖活动大多是有组织、有计划的行为，甚至拥有较大规模的非法武装；五是恐怖工具和手段日趋先进；六是恐怖活动危害日益严重化。


    大数据作为信息综合分析的重要工具和态势感知的核心技术能力，再次成为反恐利器。值得注意的是，2014年3月1日发生的昆明暴恐事件，通过对火车站内视频监控系统的数据分析，对案件告破起到重要作用。目前国际上利用大数据技术进行反恐已成趋势，而国内信息采集、分析的逐步完善，也将提升大数据的反恐能力。


    国际上已成功应用大数据技术进行反恐。美国已将声纹信息管理系统应用到军事、情报、国家安全等重要部门。通过综合利用恐怖分子平时产生的各种信息，包括通话、交通、电子邮件、聊天记录、视频等，对恐怖行为发生进行预警和事后分析排查。基于大数据技术的信息安全智能化，已得到广泛应用。2013年发生在美国波士顿的马拉松恐怖袭击事件，政府部门借助于大数据分析，极大地提高了破案效率。


    美国政府较早就利用大数据进行反恐。据了解，美国政府NATGRID[\[1\]](#Chapter_8_12.xhtml#B12)部门对来自情报和执法机构等21个不同来源的大量数据进行分析，清晰勾勒出犯罪嫌疑人的行踪和面貌。Infosys公司副总裁兼印度业务负责人Raghu
    Cavale曾表示：“针对一些已经发生的欺诈，总会有些线索，或者人们期望会有些蛛丝马迹用于分辨一些欺诈行为，对此需要判断使用什么算法和数据编码。”这在经济数据领域已经存在了。“大数据技术可跟踪一个人的数字指纹，从而使执法机关更容易追踪犯罪嫌疑人，让政府部门可以更深入分析事件。”


    利用大数据态势感知技术进行反恐已成趋势。“9·11”事件之后，美国政府在反思中发现，多个安全部门之间协调不到位、不能及时分享情报资源，是其虽然掌握了诸多线索却没能预防恐怖事件发生的重要原因之一。通过建立“棱镜”等大数据平台，运用大数据技术和分析手段，美国的国家安全部门能够以更高效率完成对多种来源数据的分析，并揭示出不同行为间的互动关系，进而能够运用分析算法预测危险分子的行动趋势。这为安全部门预防恐怖主义等威胁国家利益的行为提供了前所未有的可能。“棱镜”计划曝光后，美国政府部门再三强调其存在的合理性。Palantir在洛杉矶警局通过技术与业务的深入交流与合作，采用Palantir的Gotham平台，构建了一个洛杉矶警局的语义知识搜索挖掘平台，用于日常的警方业务工作中。该平台全面整合警情日志文档、电子表格数据、数据库等结构化数据和电子邮件、文档、图片、录像等非结构化数据，对各类多源异构、繁杂的信息进行清洗梳理，总结提炼为八个关键的信息实体：人、车、位置、罪案、逮捕、文件、备注与其他。实体本身还有不同的属性，不同个体之间还存在着相应的知识关联。Palantir公共安全大数据语义知识搜索平台建立以后，警方就可以通过非常简洁的前端搜索页面，来搜索指定的各类实体与线索。通过Palantir平台，可以快速将各类庞杂的数据通过可视化平台的形式汇聚到一起，最终发现该疑犯的综合立体化视图，其中包括：使用的手机，入境记录，逮捕时开的车，逮捕的案子，同时涉嫌一起盗窃案和已有的两次审讯记录。点击任何一个节点，右边会展示其详细的属性与其他实体的关联关系。例如，点击该车，可以展示出该车的所有历史被抓拍的照片与数据。办案人员同时可以根据关联连接一层一层往下挖，并且人机互动，补充各种筛选条件，将模糊的破案线索逐步求精，最后极大地提高破案准确性与效率。综合大数据的前沿技术进展，可以综合研判出大数据反恐平台背后的三大关键技术：知识图谱、大数据人机可视化交互、非结构化精准搜索与数据的海量挖掘与收集。


    在搜索“9·11”事件的犯罪嫌疑人中间，美国公共安全部门采用了图数据的分析方法和社会网络关联分析模型。重点对涉嫌“9·11”事件的人员的社会关系、经济往来、出入境记录、社交网络痕迹、电话通信录、诊疗记录等信息进行综合分析，并通过图数据对相关人员的关联关系进行了立体的展示，通过可视化的应用，得以让公共安全部门快速发现事件的核心人员和重要成员，迅速锁定犯罪嫌疑人。各类线索零散分布的条件下，利用图数据的强大处理能力，得以在不确定性的条件下，通过算法实现这些零散数据之间的潜在关联关系，并提供各类算法之外的数据关联关系印证，极大地提高了犯罪嫌疑人或事件密谋的证据量。图数据库技术比传统的构建在需要预先建立数据关联关系和数据建模的前提下的大数据分析更有针对性地对数据关系进行呈现。图数据算法在分析各类弱链接关系例如反恐情报分析的环境下，能够更有效地进行假设、印证、再假设、再印证的循环计算，其效率比传统的大数据分析方法更快速也更直接，并能清晰地还原数据之间的逻辑关系。故此，图数据在反恐以及相关暴恐案件侦破当中发挥了重要的作用。同时，利用大数据可视化、知识图谱、地图GIS系统等手段，开放了大量方便的人机交互接口，实现了人与机器的融合，也实现了人与人之间的协同工作，大大提升了情报分析人员掌控数据和发现风险的能力。


    另一方面，对全媒体尤其是图形、视频以及其他虚拟视频产品内容的识别也是大数据应用的重要场景。借助全媒体大数据内容分析技术，能够快速锁定隐藏在网络海量信息当中的涉恐涉暴信息，并利用大数据分析技术，快速锁定目标人员。这一技术有赖于对图形和视频内容的特征提取和识别，并对重点人群的各类信息进行全方位的比对和识别。为此，基于互联网全态势感知，精准提取文本、图片、视频等全媒体内容，并进行精准的语义和情感分析，提供动态监测及防范应对策略的应用已经成为美国情报部门的反恐利器。该技术的主要特点在于具有互联网全内容舆情管控预警。此类技术包括，具有全媒体内容检索分析云平台、云搜索、互联网关键词监测、网络情绪文本语义分析、情绪研判、社交账号动态及关联关系分析、其他即时通信工具平台内容监测、暗网数据挖掘分析、协议分析、数据分析、情报分析、内网信息采集、虚拟人口库、信息阻断、舆论导控、信息推送、网络攻击态势感知等。另外还包括对各类情报视频源特征帧内容识别及图形库的内容定向分析技术。在洛杉矶马拉松爆炸案以及后续的几次暴恐事件的侦破中，美国公共安全部门均采用了此类技术。


    图片、视频监测相关技术通过运用图像视频特征提取、图片文字检测识别、视频字幕识别、场景识别、人脸识别等相关技术，解决人机之间语义鸿沟问题以及文字和图片、视频之间的模态鸿沟问题，实现面向图片、视频内容的搜索、关注、预警、监测、热点发现和配置管理等业务应用，并为实现跨模态信息监测和业务流跨部门协同应用提供了接口。


    面对恐怖主义活动，世界很多国家除采用强硬手段严厉打击外，还注重综合运用社会、经济等手段，以彻底清除恐怖主义容易滋生蔓延的社会土壤。在反恐斗争中，应当注重从社会、经济和文化根源上应对恐怖主义。首先应通过法治手段减少腐败、促进社会公平正义与社会发展，保障社会各阶层、各族群的平等政治参与。其次使用经济、教育等手段提升社会弱势群体、社会底层人口素质，提高其参与经济活动的能力，增强其造血功能，为人民实现安居乐业提供条件，缩减社会各阶层差距，减少社会矛盾激化的可能，以更开放的文化交流促进不同族群之间的和睦交往。实事求是改进民族政策、媒体宣传策略，妥善处理好民族、宗教关系。坚决反对非法宗教势力和民族分裂主义的传播，在尊重多元文化和多种发展模式的基础上，实现全方位的社会融合。


    恐怖主义已成为当前全球面临的最严峻和急迫的安全风险挑战，任何一个国家都不可能独善其身。在经济全球化和新的国际关系格局下，反恐不仅要靠军事实力和战争手段（像阿富汗战争），更要靠世界各国的密切配合（像上海合作组织），反恐是政治、经济、文化、宗教的集合因素，是一个长期而又艰巨的过程。


