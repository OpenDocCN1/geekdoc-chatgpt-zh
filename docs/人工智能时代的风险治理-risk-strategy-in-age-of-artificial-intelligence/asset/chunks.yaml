    # Impact of Latest Internet Technologies on Public Opinion Spread and Countermeasures


    Judging from the current core demands of national regulatory departments and netizens
    towards major online platforms, on the one hand, they stem from content issues,
    and on the other, from data security concerns. Particularly in the past two years,
    with the increase in illegal cases involving personal information, the state''s
    regulatory intensity on such incidents has been continuously strengthening. For
    example, in `late August 2019`, a face-swapping app `ZAO` developed by a certain
    technology company appeared fleetingly on major mobile app markets. The main reason
    for its rapid rise and swift removal was the violation of users'' personal information
    security. Individual clauses in its user agreement were suspected of infringing
    on user privacy and contained "overlord clauses" (unfair terms), among other issues.
    This incident triggered extreme dissatisfaction among netizens, and the Ministry
    of Industry and Information Technology (MIIT) summoned the developing company
    for talks, ultimately leading to the product being "aborted" (shut down).


    Previously, a domestic platform had also experienced incidents such as source
    code leaks and video information theft. Such emergencies not only threaten platform
    security and increase users'' sense of insecurity but also directly impact the
    company''s performance in the capital market.


    On `July 20, 2018`, CCTV News released a message "Reject Vulgar Online Animation,
    Create a Positive Cyberspace Environment," directly naming Bilibili (B Station).
    B Station was summoned by relevant state departments, penalized, and ordered to
    rectify due to vulgar animation content. Based on user age characteristics, the
    spread of vulgar content has a deep-rooted influence on young groups, and has
    also led to boycotts of such platforms by parent groups.


    ## (I) Current Status of Latest Internet Technology Development


    ### 1. Big Data Application Gradually Matures, Industry in Rapid Advancement Period


    The development of big data technology is in full swing, having been widely applied
    in various domestic fields with very promising development prospects. The commercial
    sector applies `big data` extensively, mainly combining `big data` with traditional
    enterprises to effectively improve operational and structural efficiency, and
    drive the transformation and upgrading of traditional industries. Currently, `big
    data` analysis solutions have gradually matured and are becoming increasingly
    popular. With technological progress, applications developed based on `big data`
    will become increasingly rich. At present, from the perspective of development
    stages, China''s `big data` industry is in a rapid advancement period. China and
    the US paid attention to the `big data` industry almost simultaneously, but there
    is a certain gap with the US. China is in the initial exploration stage and needs
    several more years for further development.


    ### 2. Artificial Intelligence Develops by Leaps and Bounds, Moore''s Law Can''t
    Keep Up with Its Popularity Speed


    Since `2017`, `Artificial Intelligence` (AI) has jumped out of the `AlphaGo` chessboard.
    While gaining enormous public attention and a warm embrace from capital, it has
    been widely applied in various industries: in the travel sector, `AI`-driven autonomous
    vehicles have entered various exhibitions; in the medical field, `AI` with deep
    learning and image recognition capabilities can already help doctors identify
    pulmonary nodules, and even pass the National Medical Licensing Examination...
    In fields such as facial recognition, smart home, smart education, smart voice,
    and the Internet of Things, `AI` has achieved rapid development. Everything is
    progressing so fast that even `Moore''s Law` seems unable to keep up with the
    speed of `AI`''s popularity. According to data from Qianzhan Industry Research
    Institute, the scale of China''s `AI` industry was about `13.5 billion RMB` in
    `2017`, about `20.3 billion RMB` in `2018`, a year-on-year growth of `50%`.


    ### 3. Blockchain Industry Chain Basically Formed, Encouraged and Supported by
    Government Departments


    `Blockchain` applications in China show characteristics of diversity, breadth,
    positivity, and activity. Since `2014`, private equity investment in China''s
    `blockchain` field has covered `8 fields`: mining, wallets, virtual currency,
    infrastructure, underlying technology, exchanges, related services, and blockchain
    applications. China''s `blockchain` industry chain can be said to be basically
    formed. China has established nearly `20` blockchain-related industry associations
    and alliances. `Blockchain` and digital currency have become mainstream concerns
    and daily vocabulary for the Chinese public, with traditional institutions and
    state-owned enterprises entering the field indirectly. Local governments highly
    encourage `blockchain` technology. The central bank''s ongoing national digital
    currency pilot uses `blockchain` as one of its key implementation technologies.


    ### 4. Satellite Internet Layout Accelerates, Competition Already White-Hot


    Competition in the `Satellite Internet` field is accelerating. Both China and
    the US have begun to exert efforts in this field, currently in the deployment
    stage. Recently, China Aerospace Science and Technology Corporation is deploying
    a low-earth orbit (LEO) communication satellite constellation. Phase I will build
    `54` satellites, followed by Phase II to achieve smooth system capability transition.
    The final number of satellites will exceed `300`, fully launching the construction
    of a global mobile broadband `Satellite Internet` system. Once completed, it will
    become a space information network infrastructure with global seamless coverage,
    providing internet transmission services for various terminals including ground
    fixed, handheld mobile, vehicle-mounted, ship-borne, and airborne types. The `Satellite
    Internet` system can achieve combined broadband and narrowband communication capabilities
    in deep seas, the North and South Poles, "Belt and Road" regions, etc. Through
    this system, any person or object at any location on Earth can achieve information
    interconnection at any time.


    ### 5. 5G Commercial Use Launched in 2020, Communication Equipment Enterprises
    Accelerating R&D


    The `5G` standardization research proposal was approved at the sixth plenary meeting
    of the `2016` World Telecommunication Standardization Assembly (`WTSA16`), indicating
    that China''s `5G` technology R&D has walked to the forefront globally. The "13th
    Five-Year Plan" Outline proposes to actively promote `5G` development, layout
    future network architecture, and launch `5G` commercial use by `2020`. Domestic
    leading communication equipment enterprises such as `Huawei`, `ZTE`, and `Datang`
    attach great importance to `5G` technology R&D layout, and have gained industry
    recognition in standard formulation and industrial application. On `December 21,
    2017`, at the `78th` plenary meeting of the international telecom standards organization
    `3GPP RAN`, the first version of `5G NR` was officially frozen and released. On
    `February 23, 2018`, `Vodafone` and `Huawei` completed the first `5G` call test.
    From `June 2018` to `December 2019`, China Telecom conducted large-scale trial
    commercial use, and large-scale commercial use would begin after `2020`.


    ## (II) Current Status and Prospects of Latest Internet Technology Application
    in Media Field


    ### 1. Big Data Promotes Media Transformation and Upgrading, Integration to Become
    Closer


    Major media outlets have begun to take the baton of `big data`, seeking more breakthroughs
    in dimensions such as news reporting, media convergence, and public opinion monitoring.
    Central-level media and many local media groups have embarked on the road of transformation
    with the help of `big data`, carrying out beneficial attempts and achieving preliminary
    results. For example, visual news, using `big data` to collect public opinion,
    etc. In various links of major news reporting, the shadow of `big data` can almost
    always be seen. The "`Central Kitchen`" `big data` gathering-editing-publishing
    model has become the choice of many mainstream authoritative media, not only promoting
    the integration of new and old media but also allowing content to be produced
    and released more elaborately, using `big data` permutation and combination to
    adapt to the needs of different reader groups. Meanwhile, using `big data` for
    public opinion monitoring and prediction has also broadened the cognitive horizons
    and reporting angles of the media industry, and helps narrow the distance between
    media and readers.


    As media and `big data` fit more closely, more interesting news can be automatically
    generated, news information and dimensions will be richer, and reader profiles
    will become clearer.


    ### 2. "AI+News" Mode Being Widely Tried, Media Becoming More Intelligent


    `Artificial Intelligence` has strongly entered the media industry in the past
    two years. `AI` originates from deep learning, which can effectively connect the
    internet with traditional industries, making "`AI+Media`" highly promising. The
    most commonly mentioned applications of `AI` in the media field are "writing robots"
    and "`algorithmic recommendation`". Robot writing is no longer unfamiliar; the
    report on the Jiuzhaigou earthquake on `August 8, 2017` was written in `25 seconds`
    by a robot from the China Earthquake Networks Center. `The Cover` (a media outlet)
    used a robot to write its first commercial promotion discount news as early as
    `December 20, 2016`. `Algorithmic recommendation` has become the standard configuration
    for news clients to recommend news in recent years. In terms of personalized recommendation,
    `Toutiao` (Jinri Toutiao), `Tiantian Kuaibao`, and `Baijiahao` are all constantly
    trying. With the increase in user numbers, people can be continuously grouped
    through similarity depiction for group distribution. Coupled with previously accumulated
    data, intelligent recommendation is completed through algorithmic calculation.


    Currently, the domestic development of "`AI+News`" is relatively slow, with no
    large-scale, high-frequency application. Machine news only occurs in information
    integration; `algorithmic recommendation` still needs continuous improvement;
    there is still a distance before `AI` is fully applied in the media field.


    ### 3. Blockchain Technology Steadily Eliminates Media Chronic Ills, Opens New
    Paths for Media Convergence


    `Facebook` founder `Zuckerberg` stated in his `2018` annual goals that he would
    explore the application of `blockchain` technology in `Facebook`, empowering people
    through "decentralization". The application of `blockchain` technology has long
    attracted high attention from domestic media. On `March 19, 2017`, the `People''s
    Daily` "`Central Kitchen`" and the Blockchain Professional Committee of the China
    Communications Industry Association jointly held a blockchain technology integrated
    media application cooperation exchange meeting, advocating close cooperation in
    copyright protection, enterprise management, information security technology,
    and other aspects. On `June 9, 2017`, the first China Newspaper Copyright Conference
    initiated the establishment of the China Digital Content `Blockchain` Copyright
    Alliance, dedicated to building a decentralized, trusted, and traceable digital
    copyright content circulation ecology. Media `blockchain`, as an application innovation
    of "`Blockchain+Media`", further improves news dissemination efficiency, reduces
    trust costs, and enhances regulatory real-time performance.


    The application of media `blockchain` in intellectual property rights, blockchain
    ecology, smart communities, social credit systems, and other aspects will open
    up entirely new paths for media convergence.


    ### 4. Satellite Internet Enables Information Reception Without Geographic Restrictions,
    Faster Transmission


    Currently, `Satellite Internet` is still in the hardware construction period,
    and large-scale application still requires time. In `2022`, China will deploy
    and operate the entire constellation, constructing a space-based broadband internet
    composed of `156` satellites, forming a comprehensive information system integrating
    communication, navigation, and remote sensing, mainly based on low-orbit broadband
    communication and possessing navigation enhancement and real-time remote sensing
    support capabilities. After the system is completed, internet access will no longer
    be restricted by geographical space, and information transmission will become
    more rapid. Currently, public cultural service platforms based on satellite networks
    have been preliminarily applied in various national fields and different regions,
    including the "`Satellite Digital Rural Library`" in cooperation with the National
    Press and Publication Administration, the "`Satellite Digital Women''s Home`"
    in cooperation with the All-China Women''s Federation, the `Health Communication
    Satellite Network`, the `Safety Propaganda Satellite Network`, etc. Each satellite
    network point is a public cultural service information distribution node, integrating
    `Wi-Fi` and other network technologies, covering a population within a `300-meter`
    radius; users can browse and watch using mobile phones and other devices.


    With the increasingly perfect construction of `Satellite Internet`, more information
    can be transmitted in real-time to remote rural areas, completely breaking the
    geographical limitations of information transmission.


    ### 5. 5G Accelerates Information Dissemination, Media Boundaries Will Continue
    to Blur and Dissolve


    Currently, the `5G` network is still in the basic construction period and has
    not yet begun large-scale commercial use. The `5G` vision is to let users enter
    a brand-new free world. The biggest feature of `5G` is fast transmission speed;
    its theoretical peak transmission speed can reach tens of `GB` per second, which
    is over a hundred times faster than `4G` network transmission speed. Through the
    `5G` network, high-fidelity programs and live broadcasts can be watched on any
    terminal without worrying about excessive charges. With the improvement of terminal
    device performance and network speed, self-media content production will become
    simpler, dissemination faster, small-scale interactivity stronger, and interaction
    forms more diversified. The boundary between professional and amateur media will
    further blur, and content perspective rather than technical channels will become
    the key factor in media competition.


    In this convergence state, media names will only have institutional significance;
    channel constraints on information flow will cease to exist. All information can
    be presented in the best form, and users can freely choose information expression
    methods. At that time, the lines between media will continue to blur and dissolve.
    Simultaneously, the `5G` era allows media to make great strides in exploring new
    forms of news reporting business.


    ## (III) Latest AI Technologies Bring New Opportunities to Public Opinion Spread


    ### 1. Media Convergence Will Accelerate Under the Boost of New Technologies


    In the field of public opinion spread, the application of `big data` and `artificial
    intelligence` has advanced the process of media convergence. The application of
    `big data` thinking—such as overall samples replacing random samples, increased
    tolerance for imprecision, and correlation replacing causality—has further boosted
    media convergence, exerting a prominent influence. `Big data` thinking has produced
    frontier, operational, and communicative impacts on media convergence. `Big data`
    boosts media convergence, helping it achieve composite communicators, multi-dimensional
    channels, and three-dimensional audiences, finding the most fitting communication
    methods. `AI` technology utilizes `algorithmic recommendation` technology to better
    match content and audiences; deep learning can also provide more possibilities
    in content production. The integration of technology and media platforms is accelerating.
    `Satellite Internet` and `5G` provide technical support for the realization of
    more applications, such as `AR` and `VR` technologies, making media convergence
    faster and deeper.


    ### 2. Spatio-temporal Restrictions of Public Opinion Spread Broken, Individuals
    and Society Achieve Wider Connection


    `5G` changes people''s communication modes on the basis of internet technology,
    influencing people''s perception of time and space in a more rapid, jumping, and
    fragmented form. Regional and scenic spaces are truly disintegrated; space is
    extremely compressed and no longer a shackle on communication. Statistics show
    that the total number of devices connected to the global mobile communication
    network in the future will reach hundreds of billions. Whether in remote areas,
    high-speed movement, and other harsh environments, or in densely populated areas
    with large traffic demands, people can still use mobile devices for remote communication.
    `5G` technology will not only shorten the spatio-temporal distance between people
    but also accelerate the transformation of information dissemination forms. Future
    information dissemination forms will be more concrete, direct, multi-dimensional,
    and dynamic; mobile video communication will become the preferred communication
    method. In the `5G` era, the speed at which people acquire information will greatly
    increase, and the speed and scale of information collection and dissemination
    will reach unprecedented levels. News practitioners can transmit massive data
    files almost without restriction, realizing the instant transmission of hundreds
    of news photos or news videos, and the efficiency of information dissemination
    will be greatly improved. `Satellite Internet` will also help eliminate geographical
    barriers, allowing information dissemination to reach every corner. Due to its
    breadth and speed of dissemination, `Satellite Internet` and `5G` jointly break
    the spatio-temporal limits of dissemination, making communication among the public
    more convenient.


    ### 3. Comprehensively Understanding Audiences, Facilitating More Targeted Dissemination
    Activities


    Whether `big data` or `artificial intelligence`, both can realize the calculation
    and analysis of massive data. Through `big data`, various audience data can be
    grasped; then using `AI` to analyze and learn from this data, audience "portraits"
    can be quickly drawn, understanding audience needs and preferences, thereby carrying
    out targeted dissemination activities. Of course, for the dissemination effects
    of various information and activities, analysis can also be relied upon `big data`,
    improving various work with a result-oriented approach. `Blockchain` technology
    can also better retain audience traces, facilitating the knowledge and analysis
    of the most genuine netizen psychology.


    ### 4. Steadily Solving Existing Problems in Media Industry, Changing Traditional
    Business Models


    Currently, there are many problems in the field of public opinion spread, such
    as information distortion, rampant rumors, copyright disputes, payment issues,
    etc. How to reduce online rumors and purify the new public opinion dissemination
    environment is a difficult problem for media regulation at home and abroad. However,
    `blockchain` technology has advantages such as no need for intermediary participation,
    efficient and transparent processes with low costs, and high data security. As
    `blockchain` is widely applied in this field, these thorny problems are highly
    likely to be steadily solved. First, `blockchain` technology can provide a complete
    set of solutions for tracking news sources, thereby realizing media source authentication.
    News released using `blockchain` technology is encrypted while being shared on
    multiple personal computers, making it difficult for third-party institutions
    to tamper with; rumor tracing can be easily realized directly through `blockchain`
    technology. Second, `blockchain` technology can well protect copyrights. `Blockchain`
    technology can accurately track news work copyrights through digital signatures
    and `hash algorithms`, completely recording the copyright transfer process of
    news works in three links: confirmation, authorization, and rights protection.
    The "`Quan Quan Jia`" application platform launched in `March 2017` uses `AI`
    and `blockchain` reinforcement technology to provide a series of services including
    copyright registration, transfer authorization contract filing registration, copyright
    retrieval, copyright transaction, royalty settlement, infringement reporting,
    and rights protection appeals. Third, `blockchain` can improve the efficiency
    of both parties in content transactions. With the help of `blockchain` technology,
    writers and self-media can independently price content through `smart contracts`,
    bypassing media platforms to directly interact with "fans" to obtain rewards and
    subscription fees, without needing to spend a lot of time and money on supervision,
    contract verification, and complex interest distribution. `Blockchain` also brings
    precise advertising placement and application. `Blockchain` technology can even
    solve problems such as opaque and biased dissemination data, and malicious deletion
    of netizen comments.


    ### 5. Realizing Intelligent Communication Between People and Things, Communication
    Media Ubiquitous


    The development of `5G` technology will accelerate humanity''s entry into the
    `Web3.0` era of the Internet of Everything. The new wave of intelligence can not
    only realize seamless connection between people but also high-speed connection
    between people and things, and things and things. With the support of `5G` technology,
    human capabilities to perceive, acquire, participate in, and control information
    will reach unprecedented heights. Using `5G` technology, people can exchange data
    with home devices in a timely manner, and realize new technologies such as autonomous
    driving and smart home appliances. Many information dissemination and object operations
    do not require personal participation but are realized through network technology.
    Driven by technologies such as `5G`, `big data`, `AI`, and `Satellite Internet`,
    information dissemination is no longer limited to traditional media and new media;
    various electronic devices in life may become media of dissemination.


    ## (IV) Latest Internet Technologies Bring New Challenges to Public Opinion Spread


    ### 1. Over-reliance on Technology Leads to Misguided Content Distribution


    `Big data` and `AI` technologies have spawned content distribution methods such
    as "`algorithmic recommendation`". While technology brings dividends, it also
    has a negative impact on the online public opinion ecology, bringing greater challenges
    to social management work. In `September 2017`, `People''s Daily Online` published
    `3` consecutive comment articles criticizing platforms represented by `Toutiao`
    (Jinri Toutiao) that rely solely on `algorithmic recommendation` for missing values,
    creating "information cocoons," tending towards vulgarity, and excessively pursuing
    "clickbait news". With the arrival of the `5G` era, information will become even
    more overloaded. The role of "`algorithmic recommendation`" may penetrate into
    all aspects; if regulation is not in place, its negative effects may be amplified.


    ### 2. Harmful Information May Spread Rapidly with the Help of New Technologies


    `Blockchain` technology has characteristics such as decentralization, traceability,
    and immutability. Then, harmful information is highly likely to spread using `blockchain`
    technology. Content uploads may not require special review, or only simple review
    conditions set by the enterprise, making it difficult to avoid potential content
    risks. Harmful information may use this to evade regulation. Once content is uploaded
    successfully, removal and disposal will also be more difficult, leaving time and
    space for the spread of harmful information. In the `5G` era, the dissemination
    efficiency of various harmful information increases significantly, and dissemination
    may even be video-based. This will not only accelerate the speed of information
    dissemination but also increase the volume of information and the space for interpretation.


    ### 3. Government Regulatory Difficulty Will Increase Sharply


    According to the technical logic of `blockchain`, deletion is not possible; even
    if content has obvious problems, it is difficult to handle. If dissemination relies
    on `blockchain` technology, elimination will be troublesome. The "decentralized"
    feature creates obstacles for content regulation and review, while "immutability"
    makes subsequent rectification difficult. Even if content can be effectively regulated,
    due to the excessive dissemination speed, treatment often begins after immeasurable
    negative impacts have already been caused. Simultaneously, if video review and
    monitoring technology fails to achieve a major breakthrough, video review will
    still mainly rely on manpower; review costs will skyrocket, and workload will
    grow geometrically.


    ### 4. Severe Overload of Various Information Leads Public into Anxiety


    While the latest internet technologies bring convenience, they may also produce
    a new alienation and negative effect. Information presents exponential growth;
    more and more scattered, fragmented information fills people''s vision. Facing
    chaotic information space and "data surplus," people may fall into a state of
    anxiety, with more sense of oppression and tension. Post-truth characteristics
    will become more prominent, and netizens are easily misled by harmful information.
    Various chaotic phenomena in public opinion dissemination existing in the `4G`
    era may become more severe in the `5G` era.


    ### 5. Big Data Technology May Have Data Blind Spots, Steal Privacy Data


    `AI` mainly relies on `big data` technology to deeply mine, analyze, and learn
    from data. In this process, personal privacy data may be captured, and there is
    even a risk of leakage. The premise of new technologies understanding audiences
    better is the collection and analysis of various audience data. `Big data` technology
    endangers personal privacy data security; various leakage and theft incidents
    have never stopped. In addition, `big data` technology may have data blind spots—some
    data cannot be captured or is incomplete, or fake data is manufactured. Under
    the banner of `big data`, erroneous conclusions are given, causing serious interference
    to netizens'' cognitive judgment.


    ## (V) How to Utilize and Manage Latest Internet Technologies


    ### 1. Reasonably Use Big Data to Collect and Insight Public Psychological Expectations


    Netizens'' cognition of social hotspots, attitudes towards policies and regulations,
    and views on international issues can all be collected and analyzed through `big
    data` technology. Reasonably utilizing data on social media and other online platforms
    for analysis and summary helps government decision-making become scientific and
    standardized. It can help relevant departments understand recent social trends
    and netizens'' basic views on hot issues, which is undoubtedly beneficial for
    decision-making and governance.


    ### 2. Use Blockchain to Handle Copyright Issues and Rumor Issues


    The traceability feature of `blockchain` solves many difficult problems in public
    opinion dissemination. `Blockchain` technology will more accurately track the
    copyright ownership of each content product, thereby better safeguarding the legal
    income of content owners. With the large-scale application of `blockchain`, infringement
    and piracy will become almost impossible to achieve. Authoritative media reports
    under `blockchain` technology are difficult to alter, while ordinary rumors can
    be quickly traced and cracked down upon.


    ### 3. Should Urgently Improve Netizens'' Media and Information Literacy


    The `5G` era is approaching; improving netizens'' media literacy and information
    literacy becomes more important. In the scenario of information explosion and
    accelerated dissemination, without strong information discrimination ability,
    one is easily deceived by harmful information, incited by harmful emotions, exploited
    or even harmed by ulterior motives. Government departments can use media publicity,
    community education, and other methods to gradually improve netizens'' information
    discrimination ability, carry out rumor refutation and publicity education work
    regularly, and promptly clarify and guide harmful information and emotions.


    ### 4. Increase R&D Efforts to Improve Video Review Efficiency


    In the `5G` era, dissemination will inevitably be video-based. Massive video content
    will flood the network; netizens shoot and post at will. Reviewing this content
    will become one of the important tasks of regulatory departments. If manual review
    is still used, not only is efficiency low and time-consuming, but it also affects
    netizens'' `5G` usage experience. This requires a breakthrough in the field of
    video review and monitoring technology as soon as possible. Currently, text monitoring
    and review technology is mature; video content review technology must also catch
    up with the development requirements of the `5G` era.


    ### 5. Improve Laws and Regulations, Intervene Early in New Technology Rule Formulation


    `Blockchain` technology requires "decentralization" and "immutability". Such technical
    logic can be promoted in certain fields, but carries high risks in the content
    dissemination field. First, content without review will have problems; second,
    content with problems cannot be deleted quickly. This requires regulatory departments
    to improve laws and regulations as soon as possible, and intervene early in the
    rule formulation of the `blockchain` field. For example, punishment methods for
    publishing illegal content using `blockchain` technology; what role regulatory
    departments play in control; or leaving review permissions for regulatory departments.


    For the application of `AI` technology in the content field, timely intervention
    in governance is also required. Regular inspections of "`algorithmic recommendation`"
    should be carried out to discover content problems and urge enterprises to adjust
    corresponding algorithm rules, making "`algorithmic recommendation`" more in line
    with the requirements of online content construction in the new era.


    The most important technical direction of `AI` is to use data and algorithms to
    simulate and restore the entire process of human thinking and decision-making.
    Human characteristics are the technical and developmental characteristics of `AI`.
    Human characteristics are manifested in: self-replication, self-repair, self-learning,
    self-evolution, self-awareness. The scene of human activity is the application
    scene of `AI`. The high convergence of `AI` technology development with human
    wisdom development characteristics is an inevitable trend, but it will never surpass
    human wisdom. However, in certain fields, the destructive power of `AI` facilities
    and equipment may far exceed that of humans. This is the `AI` application risk
    that should be avoided. These fields include political agenda setting, online
    public opinion manipulation, cyber warfare, information warfare, financial warfare,
    cybercrime, etc.


    ### 6. Crack Down on Data Leakage Issues, Strongly Safeguard National Cybersecurity

