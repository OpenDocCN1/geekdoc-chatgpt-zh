- raw: '研究一个随机变量y对另一个（x）或一组（x1, x2, …, xk）变量的相依关系的统计分析方法。回归分析是确定两种或两种以上变数间相互依赖的定量关系的一种统计分析方法。运用十分广泛，回归分析按照涉及的自变量的多少，可分为一元回归分析和多元回归分析；按照自变量和因变量之间的关系类型，可分为线性回归分析和非线性回归分析。


    方差分析（ANOVA/Analysis of Variance）


    方差分析又称“变异数分析”或“F检验”，是R.A.Fisher发明的，用于两个及两个以上样本均数差别的显著性检验。由于各种因素的影响，研究所得的数据呈现波动状。造成波动的原因可分成两类：一类是不可控的随机因素，另一类是研究中施加的对结果形成影响的可控因素。方差分析是从观测变量的方差入手，研究诸多控制变量中哪些变量是对观测变量有显著影响的变量。


    利用以上六种分析技术，对采集到的数据进行详尽的分析、处理，从而能够为下一步的数据挖掘工作提供可靠的保证。


    （二）基于历史事件知识库的即时比对决策支持实现


    （1）在对信息平面以及时间轴上的各类公共事件数据监测的基础上，从时间、地点、人物、经过以及传播学特征进行自动建立标签体系和案例的知识库自动归类并建立索引。


    （2）设置公共事件多维度相似度比较中心处理器。它是一个预置的案例库，库中的案例已经过结构化处理，是按使用场景的需要、事件分析的维度来设置。


    （3）对当前网络中收集到的各类公共事件的各类元数据进行处理，包括对结构化和非结构化的数据进行结构化处理，使之与知识库中的数据具备相同的分析维度。


    （4）在对单独事件进行的各类数据聚类算法处理的基础上，新的数据与库中的历史数据进行自动比对，并将比对结果输出给相关机构和管理部门。管理者通过这些特征以及相似度比对数据，就可以对目前正在发生发展的网络公共事件的未来以及发展趋势作出判断，从而有效应对，及时发布相关信息，干预事件的发展进程。


    （5）对域内的微信、微博、移动端等数据进行实时全量采集清洗去重后入库，分析梳理，研判其中风险点，并提供实时的预警，同时制定预警响应级别及研究预警等级标准。


    （三）从经验决策到数据决策


    以大数据、人工智能、机器学习技术为核心建立的知识案例库系统的工作原理就是由“平面、化验单式舆情呈现”系统转向了“大数据立体知识案例库”智能系统，类似于医学上的“临床路径式比对”。通过深究网络舆情内在的关联性，实现网络舆情的预测，进而通过比对，提供对网络风险的最佳辅助决策建议。实现网络风险的经验决策到数据决策的转变。


    进入移动互联网时代，网络空间风险产生的速度快，突发性强，传播力度空前，相应的数据体量巨大，演变动力机制复杂，其数学描述模式建立难度较大。在新的网络舆论生态环境下，我国的网络舆情风险管理遭遇前所未有的挑战，但大数据也为网络风险治理带来了新的机遇。


    在新形势下，应积极树立大数据思维，数据决策理念，深入挖掘和合理利用大数据在网络舆情发现以及网络风险治理中的价值，创新网络空间治理思维，抓住网络风险的本质特征，探索网络风险演变的内在规律，尽快建立起适应新形势需要的网络空间风险治理决策机制及应用。


    ## 4.9 智慧商业及企业声誉风险治理


    智慧商业这个概念于1951年在美国出现。经济学家把智慧商业概括为利用现代资讯技术收集、管理和分析结构化和非结构化的商务资料和资讯，创造、积累商务知识和见解，发送商务决策，支持决策者采取有效的商务行动，完善各种业务及商务流程，提升商务业绩和服务精细化程度，增加在自媒体时代品牌或网络口碑美誉度的塑造和维护、修复能力，通过大数据寻找与竞品的差距等，以增强综合商业竞争力的智慧和能力。


    未来的商业一定是智慧型商业，是高度场景化的商业，围绕人与人的链接、物与物的链接。电商、智慧商圈、智慧支付、末端商业网点和城市共同配送平台信息链、线下体验和线上下单等技术手段日新月异，甚至有专家学者认为线上线下的边界在逐渐消失，实体店场内场外的消费者活动正在融为一体。


    新型的智慧商业模式，不断推动着现代商业以及电子商务基础设施和支撑服务环境改善，对整合社会成本、集约生产规模起到了重要的作用。


    智慧商业情报是利用互联网技术、云计算及大数据，提供企业社会形象塑造和维护、拓展客户、运营管理、市场营销、产品服务和内部财务工具等提升企业生存能力的重要保证。新技术的应用能够让传统企业可以根据自己的实际情况和优势，建立企业经营闭环和企业风险防范矩阵，从本质上塑造并培养企业的现代智慧商业基因。


    智慧商业有以下五个特点：


    （1）技术进步带来智慧商业发展空间无限。互联网与无线射频识别（RFID）、电子数据交换（EDI）、全球定位系统（GPS）、地球信息系统（GIS）、定位服务（LBS）、移动定位服务（MPS）、大数据、云计算等技术的结合，既推动传统企业的创新发展，也不断催生新的商业形态，商业行为日益变得信息化、智能化、透明化、可视化、高效化。手机支付、购物应用（APP）、近场通信技术（NFC）等已为人们所熟知并广泛应用。


    （2）大数据是智慧商业的“神经”。全球知名咨询服务提供机构麦肯锡认为，数据已经渗透到当今每一个行业和业务职能领域，成为重要的生产要素，大数据是下一轮创新、竞争和生产力的前沿，海量电子数据的挖掘与运用将成为未来竞争和增长的基础；大数据帮助美国零售业净利润增长60%。移动互联时代，大数据与移动终端、云计算的结合，商家可以随时随地了解消费需求与习惯，孕育更多的商机和事业。


    （3）智慧物流是智慧商业的基础底盘。很多物流系统采用最新的互联网、物联网技术和设施，实现光、机、电、信息等技术的集成应用，形成了智慧物流。如亚马逊公司测试用无人机送货、用机器人管理仓储，通过用户数据的分析来预测购买行为，在顾客尚未下单之前提前发出包裹，最大限度地缩短物流时间，通过分析消费习惯与货物流向情况，改变传统物流的运行模式和管理方式。


    （4）移动支付是智慧商业的主要支付方式。移动支付，是指允许用户使用其移动终端（通常是手机移动端），对所消费的商品或服务进行账务支付的一种服务方式。移动支付将终端设备、互联网、应用提供商以及金融机构相融合，为用户提供金融服务。中国银行业协会发布的《2013年度中国银行业服务改进情况报告》显示，2013年中国移动支付业务共计16.74亿笔，同比增长212.86%。国际数据公司（IDC）的报告显示，2017年全球移动支付的金额将突破1万亿美元，今后几年全球移动支付业务将持续增长。


    （5）O2O[\[1\]](#Chapter_8_9.xhtml#B10)将成为智慧商业的主要形态。O2O成为信息化条件下商业发展繁荣的新模式和大趋势。O2O诞生之初即成为各行业关注的焦点，具体包括百货O2O、家电O2O、汽车O2O、酒类O2O、房地产O2O、社区商业O2O、家装O2O、餐饮O2O、家政O2O、媒体O2O等。定制化商业模式（C2B），也是O2O的一种形式。美国梅西百货、英国电商企业Argos及连锁超市TESCO、国美、苏宁易购等是线上线下渠道融合发展的典范。


    智慧商业的三个核心分别是数据、算法和产品。


    自媒体时代，商业和产品品牌的脆弱性已经显现，品牌所遭遇的各类风险和危机才刚刚开始。一夜之间，一个看似孤立的个案会带来极大的品牌认同风险，并有可能在非常短的时间内摧毁企业或品牌的公信力和多年打造的网络形象。这种前所未有的网络风险对企业或企业家个人来说，都是极其致命的。与此同时，自媒体的存在让二三线品牌有了巨大的成长机会，并有可能在短时间内成为行业的龙头，并取代一直处于头牌位置的企业和产品。


    自媒体时代，企业正在遭遇社会环境的不确定性带来的各类巨大商业风险。当然，国际、国内宏观政策以及各类行业导致的政策性风险一直存在。面对这种境况，企业和企业家们需要清醒地认识到，如何把控来自社会以及内部各方面的风险并有效地规避和利用风险成为企业家们的重要工作选项，风险思维也是企业家必须具备的现代企业管理运营思维。


    声誉风险是指由于机构行为、从业人员行为或外部事件等，导致利益相关方、社会公众、媒体等对机构形成负面评价，从而损害其品牌价值，不利于其正常经营，甚至影响社会稳定或市场稳定。


    声誉事件是指引发机构声誉明显受损的相关行为或活动。


    随着现代媒体的深度融合以及自媒体风起云涌，社交媒体无孔不入。面对现代传播变局，传统的企业口碑形象维护和危机应对已然无法满足企业声誉风险治理的需要。


    企业家们必须学会用风险思维来重新构架公关路径，实现公关活动的主动性、针对性、应用性，正确认知舆情、认识风险、合理应对危机，甚至通过主动策划、设置议题，转“危”为“机”，将风险事件成功转变为营销事件。


    学会用风险思维和数据思维改造企业危机公关将为企业带来巨大的商业回报。


    国内著名餐饮企业海底捞在处置相关舆情时以客户为中心的处置原则为海底捞赢得了广泛的赞誉，其处置方式获得了客户的高度认可，也提升了其品牌的影响。相比之下，百度在应对魏则西事件、鸿茅药酒在处置网络风险时的低能和粗暴表现严重损害了其自身的口碑形象，导致企业信誉大幅降低以及动摇了消费者的信心。正所谓，一招错招招错。


    秉持为消费者提供最优质服务的初心，一切为客户着想，如此，才能在应对风险时立于主动位置，如此，方能打造百年老店。


    近年来，越来越多的企业卷入公共舆论危机。在遭到公众的质疑和批评后，大多数企业都进行了危机公关。遗憾的是，由于这些企业在应对风险时的方法、策略不当，收效甚微，并且经常发现，越抹越黑。雀巢被爆出奶粉碘含量超标后，一味避重就轻坚持称自己的产品绝对安全，并以此为由拒绝消费者退货，从而引起公众广泛、激烈的批评，也极大地伤害了自己国际品牌的形象。著名经济学家宋清辉对法治周末记者评价：“雀巢近段时间的表现令人遗憾，其所作所为根本不像一个大型跨国企业，反而更像一个三流的企业。”“从1977年在美国爆发‘抵制雀巢产品’运动，到现在的产品危机，说明雀巢在产品市场的应变能力、公关能力很差。”[\[2\]](#Chapter_8_9.xhtml#B11)而西安奔驰利之星4S店在处理一个女消费者维权投诉时的拙劣手法更是粗糙，引发中国舆论场的一致谴责，导致其企业品牌信誉大幅度下跌，为企业带来的损失巨大。尽管后来西安利之星在社会的巨大压力下花费巨资赔偿该用户并积极弥补其此前的错失，但仍然得不到公众的原谅。


    品牌和消费者信心损失的修复工作可能需要更长的时间，也需要投入更多的形象修复成本。


    企业危机公关和风险应对的策略流程。


    企业如何进行舆论危机公关要视具体问题而定。企业的危机公关通常包括内部公关和外部公关。所谓外部公关，其主要对象包括媒体、政府、行业协会、消费者，以及经销商、供应商、银行等战略合作伙伴，如果是上市公司，还包括股民、基金经理、券商等；企业内部公关，则主要是针对公司内部的员工。具体如下：


    1．稳定军心，先从内部公关入手


    事实上，企业机构遭遇舆论危机后，最关注事态发展的除了媒体和相关当事人，便是与公司命运关联的相关利益群体，包括上级主管部门、合作伙伴、消费者等。其中，企业内部员工亦更是关注危机动态。如果企业不适时对员工加以引导，就可能让风险带来更大的破坏。科学应对、合理应对是面对风险时的第一要务。


    （1）成立危机公关小组。目前，相当多的企业都成立了专门的公关部门处置企业面临的各类风险和危机，针对危机事件快速做出反应。如果企业没有成立公关部或其他相应的组织，就要在危机发生后的第一时间成立危机公关小组。最好由副总裁以上级别的领导担任组长，对公司将要采取哪些公关措施、如何接待媒体的采访、谁来担任公司的新闻发言人等做出明确的规定。如果企业没有专业的公关人才，就要借助专业公关公司的力量，请他们策划如何开展工作。这样做的好处是，通过建立起顺畅的对外沟通渠道，争取处理事件的主动性，同时，以组织作为唯一权威的信息发布源头，确保对外发布的信息高度一致，避免让媒体找到借题发挥的把柄。


    （2）稳定市场一线的队伍。大凡企业遭遇严重的舆论危机后，企业的干部尤其是市场营销一线的干部很容易被竞争对手“挖墙脚”。而对企业来说，如果一线员工临阵倒戈，必定招致灾难性后果。所以，通过会议或书面通知的形式，让大家了解公司目前所遇到的困难只是暂时的，而且是完全可以解决的，就显得非常重要。必要时，还要采取一些“恩威并施”的措施，激励大家自觉与企业共渡难关。


    做好管理层稳定工作，是保证企业拥有凝聚力和向心力的前提，甚至可能是决定企业能否平稳渡过危机的关键因素。


    （3）安抚员工。分析近期一些企业的负面报道，其源头主要来自普通员工。这是因为与干部相比，普通员工关注的只是自己的切身利益，一旦受到公司冷遇或相关利益没有得到保证，就极可能对外包括对前来采访的记者，发泄不满情绪。因此，企业在进行内部公关时，要本着“再苦不能苦员工”的原则，对员工的薪酬、福利等一定要做到按时发放，包括在人文关怀和企业氛围营造上也要多下功夫，以稳定军心。


    2．积极与主管部门沟通，安抚合作伙伴


    企业外部公关主要包括以下几个部分：一是积极认真地表态，包括企业领导在第一时间面对媒体和公众，承诺将承担自己应负的责任；二是公布处理危机事件的措施；三是公布事件处理的最终结果；四是公布危机事件的详细原因及当事人弥补、改进方案；五是集中发布更多正面信息，支持和提升利益相关群体对自己的信心。


    企业在应对突发风险时快速反应和实事求是至关重要。企业要本着有错即改，无错加勉的态度处置风险，千万不要重复此前一些企业应对时的旧思维和老路子，因为这极有可能导致事态的进一步恶化。


    （1）积极、坦诚地面对媒体。企业发生舆论危机，大多数会对媒体有一种本能的“抵触”心态，这种心态千万要不得。值得注意的是，一些企业出现舆论危机后，对媒体采取拒之门外的态度，最终为此付出了惨重的代价。


    企业在对外发布信息时，要坚持诚实的原则。许多企业认为，做危机公关就是要对外讲有利于自己的假话、套话，这是极端错误的。有句话叫“纸包不住火”，如果企业发布的信息不实，终有被揭穿的一天，届时必定会付出更大、更沉重的代价。


    （2）利用权威媒体、第三方声音化解危机。企业被公众质疑和批评，不要自己为自己辩解。企业可以邀请政府部门、行业协会、市场研究机构以及有关专家、学者等社会知名人士，就公众普遍关心的问题进行调查和判断，然后通过媒体发布正面信息，让公众了解事情的真相，从而达到消除负面舆论的目的。


    （3）稳定合作伙伴的信心。针对关系企业命运的经销商、供应商、投资人、股东等开展有针对性的工作。对于企业的重点经销商、供应商、投资人等战略合作伙伴，企业高层应该及时出面邀请他们就相关网络风险进行座谈，认真听取意见，并对风险处置的办法策略进行及时调整，以重新获得信任。


    （4）恢复市场信心。重点选择主流媒体发布企业积极整改的措施，并对产品或服务环节出现的问题进行快速整改。


    企业进行舆论危机公关的目的是恢复相关机构和公众对企业的信心，通过采取符合大众期望的措施，化被动为主动，化不利为有利，从而达到顺利渡过危机、将经营风险降到最低的目的。


    建立实时的网络口碑风险监测、预警及处置体系已经成为现代企业的必备工作内容。


    在企业风险管理应用中，大数据风控平台与网络风险态势感知平台经常处于企业战略的核心地位。对金融、银行、保险、证券、品牌企业等组织来说，建立大数据业务风险控制系统是保证其业务良性、高效运行的重要支撑和保证平台。


    所谓大数据风控，狭义上讲，即大数据风险控制，是指通过运用大数据构建模型的方法对借款人进行风险控制和风险提示。与原有人为对借款企业或借款人进行经验式风控不同，通过采集大量借款人或借款企业的各项指标进行数据建模的大数据风控更为科学有效。大数据风控最早被用在金融、银行、证券等部门的业务风险控制，借贷违约控制，不良资产发现，商业欺诈和网络诈骗等有关犯罪行为的风险线索发现，是大数据技术用于行业风险治理的重要应用场景之一。


