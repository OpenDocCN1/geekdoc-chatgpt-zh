    # Blockchain Applications and Development Strategies


    Multiple industries have already exerted efforts in the application layer of blockchain,
    with some applications even beginning to be implemented. For instance, in fields
    such as financial services, healthcare, IP copyright, education management, social
    governance, and cultural entertainment, solutions based on blockchain technology
    are being proposed and applied. Characteristics such as decentralization, immutability,
    and traceability have constructed a more reliable and autonomous collaboration
    paradigm for the new era, allowing us to establish a sound trust mechanism relying
    on algorithms, machines, and protocols. This is bound to become the optimal choice
    for reducing trust costs and ensuring information security.


    ## (II) Impact of Blockchain on Cyber Public Opinion Governance


    ### 1. Positive Roles


    #### (1) Ensuring Data Authenticity and Preventing Human Tampering

    Blockchain technology can provide a complete set of solutions for tracking information
    sources, thereby realizing media source authentication and guaranteeing data authenticity
    to the greatest extent. Information released using blockchain technology is encrypted
    while being shared across multiple personal computers, making it difficult for
    third-party institutions to tamper with it. The entire information recording process
    can effectively correct reporters'' stereotypes and media preferences.


    #### (2) Ensuring Information Security and Resisting Multi-party Intervention

    Blockchain technology makes information immutable, guaranteeing the security of
    information data. Even with intervention from political, commercial, and technical
    forces, it can ensure information security, preventing information from dissipating
    due to ephemerality. This prevents information from deviating or omitting, thereby
    affecting the audience''s cognitive judgment.


    #### (3) Protecting Copyright and Combating Rumors

    Blockchain technology can effectively protect copyright, using digital signatures
    and hash algorithms to accurately track content copyright. It completely records
    the content copyright circulation process in three links: confirmation of rights,
    authorization, and rights protection. Relevant applications have already been
    launched, which helps solve the copyright issues prevalent in the current content
    management field. Content traceability also helps combat online rumors.


    #### (4) Improving Content Transaction Efficiency and Solving Media Economic Crisis

    Authoritative media institutions not only face a crisis of trust but also an economic
    crisis caused by exhausted revenue sources, with influence gradually declining.
    This is undoubtedly unfavorable for shaping cyber public opinion. Utilizing virtual
    currency can help media obtain new crowdfunding business models, improve content
    transaction efficiency through smart contracts, and seek new development opportunities.


    #### (5) Resolving Communication Data Bias and Avoiding Malicious Manipulation
    of Public Opinion

    In the current communication landscape, communication data is opaque, and bias
    is widespread. Much data is difficult to grasp, objectively leading to cyber public
    opinion being easily interfered with and influenced; true public sentiment is
    difficult to present. Phenomena such as comment deletion and "internet water armies"
    maliciously manipulating public opinion occur from time to time. Blockchain technology
    can trace sources and preserve authenticity, preventing public opinion manipulation.


    ### 2. Negative Impacts


    #### (1) Difficulty in Controlling Creation and Upload of Sensitive Information

    In the traditional internet, the creation and upload of sensitive remarks and
    other information may be restricted by the network, and sensitive words and topics
    can be effectively regulated. However, under blockchain technology, the creation
    and upload of sensitive information have found a "safe haven." Blockchain characteristics
    will put the dissemination of such sensitive information in a state of loss of
    control.


    #### (2) Difficulty in Conducting Information Review and Failure of Disposal Mechanisms

    The decentralized characteristic directly shatters the centralized management
    model. Information review is basically difficult to carry out, while data immutability
    and anonymity render review and disposal ineffective. Even if technical means
    can trace back to the source, or even associate anonymous users with real users,
    it is difficult to delete or tamper with information data, making disposal impossible.


    #### (3) Retention of Full Data Chain, Long-term Existence of Negative Information

    The current communication norm is that information accelerates its dissipation
    as time passes. However, blockchain technology will completely reverse this phenomenon;
    information will be preserved authentically and securely. This means negative,
    harmful, and sensitive information will exist long-term. As long as one is willing
    to query, they can see these information sources and dissemination situations.


    #### (4) Difficulty in Clarifying False Information, Limited Effect of Rumor Refutation
    and Correction

    Characteristics such as decentralization and immutability make it difficult to
    clarify false information. Even if tracing can be done quickly, because deletion
    is difficult, refutation content struggles to cover the target group (those who
    have read the rumor). This leads to the continued negative impact of rumors. Even
    if refutation is successful, because false information cannot be deleted, subsequent
    impacts still exist.


    #### (5) Transition from Niche to Mass Adoption, Management Mechanisms Likely
    to Lag

    Under current technical conditions, blockchain information is disseminated by
    linking to social media, having a small influence in the communication field and
    still in a niche stage. However, the technology is very simple and easy to learn
    to apply, and some are developing upload mini-programs. With the involvement of
    hackers, geeks, religious, political, and social organizations, once the technology
    matures, leveraging major events will lead to popularization across the entire
    network and rapid dissemination. Netizens will be able to complete the entire
    process of information production and dissemination on the blockchain. Blockchain
    will advance from niche to mass adoption in the communication field, while management
    of the technology often struggles to be timely and effective. The potential regulatory
    vacuum brings great uncertainty.


    #### (6) Anonymity Causing Disorder and Anomie, Making Control Impossible

    Blockchain anonymity is obviously more complex than traditional internet anonymity,
    involving technologies such as asymmetric encryption algorithms. For individuals,
    this guarantees high security, but for regulation, it undoubtedly creates disorder
    and anomie. Because technology cannot map to real-world speakers and disseminators,
    the approach of using strict control over sensitive or offending (criminal) groups,
    and constraining the words and deeds of these groups to force the realization
    of blockchain control, cannot be carried out.


    #### (7) Emergence of Numerous Self-organized Communities, Difficult Cross-regional
    and Cross-border Organizational Management

    Essentially, every blockchain organization is a self-organized institution. The
    generation of a large number of private chains forms a large number of self-organized
    institutions. These institutions write organizational rules into the blockchain,
    maintaining the validity and confidentiality of organizational rules. If these
    technologies are utilized by criminal gangs, triad organizations, religious institutions,
    or political organizations, they will pose hidden dangers to social stability,
    even the danger of subverting state power.


    ## (III) Blockchain Development Strategies


    ### 1. Carry Out Technical Monitoring and R&D of Analysis Tools

    Transaction generation and blockchain creation are immutable and anonymous to
    external personnel, making prevention difficult. However, through technical means,
    timely capture and timely interpretation can be achieved, thereby realizing timely
    grasp. Especially for those that have already formed scale and produced global
    influence, such as Bitcoin, Ethereum, and Boya Data, full data capture and storage
    can be realized. On the basis of developing relevant technologies, monitoring
    and early warning of main data can be basically realized. Furthermore, by monitoring
    transaction and circulation data, a database of risk groups (technology, speech,
    commerce, etc.) can be established.


    On this basis, combined with internet information and communication technology,
    attempts can be made to associate anonymous users with actual users (there are
    successful cases in European and American countries). Combined with social network
    behavior trajectories and social relations, their real-world activity behaviors
    can be analyzed and studied, thereby achieving the integration of "Darknet — Clearnet
    — Reality," up to real-world management.


    ### 2. Establish the Working Principle of "Using Technology to Govern Technology"

    On the basis of high attention, special research and development on relevant technologies
    and applications should be carried out, and research on "technology regulating
    technology" should be conducted. Not only must we achieve "I know," but we must
    also strive for "I am professional" and "I can do it." Closely grasp the entire
    process of blockchain technology development, and standardize blockchain operation
    and use as early as possible. Like other internet products, conduct early research
    and intervention on the operation rules, technical standards, and product standards
    of blockchain products, timely introduce international standards, seize the initiative,
    and strive for the initiative.


    Start the formulation of relevant laws and regulations, and carry out the construction
    of corresponding regulatory systems in a planned and follow-up manner. Currently,
    blockchain is divided into the "chain circle" and the "coin circle." The chain
    circle mainly focuses on technology development and exploration, while the coin
    circle has been used by ill-intentioned people for black market transactions,
    financial fraud, and other behaviors. In addition to domestic solved cases, more
    are cross-border and transnational criminal acts. Starting the design of laws
    and regulations is imminent.


    ### 3. Government "On-chain," Participating in Node Construction and Community
    Maintenance

    "On-chain" not only means the "right to know" and "operating rights," but also
    means management rights. With the maturity and popularization of technology, individual
    industries and enterprises going on-chain are already underway. Due to unclear
    management boundaries, the difficulty of technical learning, and insufficient
    enthusiasm for mastery, coupled with the fact that the practical troubles caused
    by blockchain have not yet become prominent, many departments have not paid enough
    attention.


    Participate in the construction of blockchain in roles such as computing power,
    storage, and monitoring, and explore suitable participation roles and management
    mechanisms. On the basis of full attention, the government should intervene early.
    In addition to gaining the technological initiative, it can also evaluate the
    development process of blockchain, grasp the development laws of "self-organized
    communities," prioritize layout, gain first-mover advantage, and avoid being caught
    off guard without a position when blockchain erupts during major events.


    ## 8.5 Security Risks in the Network and Information Field


    Network security, in essence, is information security on the network. Broadly
    speaking, anything involving the confidentiality, integrity, availability, authenticity,
    and controllability of information on the network falls within the scope of network
    security. Examples include personal information leakage, system paralysis caused
    by virus intrusion, rampant dissemination of illegal and harmful information,
    program vulnerabilities, and other security issues. The openness of the internet
    makes these problems constantly appear and affect the network security environment,
    bringing many troubles to the maintenance of network security. General Secretary
    Xi Jinping proposed the strategic thought of building a strong cyber nation at
    the first meeting of the Central Leading Group for Cybersecurity and Informatization,
    pointing out that the internet and other information networks have become new
    channels for information dissemination, new spaces for production and life, new
    engines for economic development, new carriers for cultural prosperity, new platforms
    for social governance, new links for exchange and cooperation, and new frontiers
    of national sovereignty. Currently, China is in the decisive stage of building
    a moderately prosperous society in all respects, with challenges and opportunities
    coexisting. We must strengthen the prevention of network security risks, identify
    risks in advance and resolve them in a timely manner, be prepared for danger in
    times of safety, and ensure the safe and healthy development of the network environment.


    ### (I) Existing Security Risk Problems in the Network Information Field


    #### 1. Lag in Network Information Security Legislation

    Due to the rapid development of information technology and its rapid integration
    with various aspects of society, a large amount of information circulates and
    spreads on the internet. While providing many conveniences for social life, this
    inevitably infringes on the legitimate rights and interests of others, and threats
    may appear in unexpected situations. Once they occur, they often catch people
    off guard, causing huge losses. Therefore, the development of the internet has
    brought many new national security and social problems. Many current network information
    security problems and crimes, such as leakage of state secrets, leakage of personal
    privacy, online fraud, telecom fraud, and more emerging network security and social
    problems, are closely related to the unsound and imperfect current network information
    security legislative system.


    When the internet was born, due to the lack of restrictions on internet openness,
    countries around the world did not build a clear network security legal system.
    To this day, there is still no network security legislative experience to draw
    from. Coupled with China''s legislative lag and lengthy legislative process, the
    current information network security legal system is difficult to adapt to the
    needs of information technology development and increasingly severe network security
    problems. All the above are important reasons for the formation of this risk.


    #### 2. Lack of Guiding Policies, Lack of Clear Evaluation Standards for Network
    Information Security in Some Technical Fields

    With the rapid development of computer technology, business processed on computers
    has evolved from stand-alone mathematical operations, file processing, office
    automation, etc., to enterprise-level computer processing systems based on complex
    intranets, extranets, and the global internet, and world-wide information sharing
    and business processing. However, while information connection and circulation
    capabilities have improved, security issues based on network connections have
    become increasingly prominent. Although China has proposed to achieve breakthroughs
    in core technologies of network security maintenance as soon as possible, coordinate
    the construction of network security infrastructure, and strengthen the review
    of key infrastructure and key imported technology products, the scope of review
    only involves national major projects and imported technology products in core
    key parts. Because information technology and information networks have gradually
    penetrated into all walks of life and fields, our technical review work cannot
    cover all information technology fields, which invisibly increases network security
    risks and hidden dangers. Although the National Information Security Standardization
    Technical Committee has successively issued and implemented 8 national standards
    such as the *Information Security Technology — Cloud Computing Service Security
    Capability Assessment Method*, there is a lack of guiding policies for security
    review of core network information technologies, especially the formulation of
    corresponding technical evaluation standards. Currently, various industries use
    their own standards in the review process, lacking uniformity, which will inevitably
    bring major network information security risks and hidden dangers, needing early
    resolution.


    #### 3. Lack of Necessary Protective Measures Against Risks of Large-scale Social
    Engineering Outbreaks

    Social engineering refers to taking humans as the attack object to control and
    utilize information systems. Hackers leverage the inherent individual thinking
    patterns and group collaboration patterns evolved in humans, aided by emotional
    reactions, to achieve ulterior motives. In the past, the targets of social engineering
    were mostly limited to the category of economic interests. However, in recent
    years, China''s computer technology has developed rapidly, and the use of internet
    technology has penetrated all aspects of life. For example, the four major backbone
    computer system networks have been built, e-commerce systems have been opened,
    school campus networks have been put into use, mobile payment has become popular,
    and e-commerce scale has expanded. These have shown unprecedented scaled innovation,
    combining the entire society into a huge ecological network environment closely
    linked by people and technology. However, many internet technology application
    systems have always been in a state of being hard to guard against, or even if
    certain protective measures are taken, they are not necessarily very effective.
    Against this background, driven by interests in many fields, the security risk
    of concentrated, high-intensity outbreaks of large-scale social engineering events
    may appear at any time.


    #### 4. Lack of Strategy for Long-term Secure Data Preservation

    With the arrival of the big data era, government agencies, scientific research
    institutions, enterprises, schools, and other types of organizations have generated
    and stored massive data resources in the process of governance, supervision, scientific
    research, and operation. Information network resources have become an important
    strategic resource influencing and determining social development, and an important
    indicator measuring a country''s comprehensive national strength.


    These massive data play important value in various organizations fulfilling their
    functions. Various organizations have formulated standardized data preservation
    systems, but most still remain at short-term (5–10 years) preservation, lacking
    a long-term preservation mechanism based on a strategic perspective.


    If these data, as key strategic resources of human civilization development stages,
    cannot be effectively preserved long-term, on the one hand, there will be a major
    hidden danger of missing human civilization memory; on the other hand, their potential
    strategic value will not be utilized, which may bring major potential hidden dangers
    to China''s long-term national governance and social security.


    #### 5. Lack of Efficient Coordination and Linkage Mechanism for Network Information
    Security

    China''s network information management system implements a "Tiao-Kuai" (vertical
    and horizontal) segmented management system. Each administrative agency is responsible
    for the network information security management of its own unit. Consequently,
    the entire network information security management has always been in a decentralized
    state, lacking a unified, specialized, and highly authoritative network information
    security management agency. This leads to the inability to supervise network security
    on a large scale and prevent trouble before it happens, and the inability to detect
    security problems in time and resolve them effectively immediately. For example,
    malicious attacks by foreign intelligence agency hackers and large-scale damage
    by network viruses—these large-scale network security problems cannot be handled
    by each agency self-supervising and self-processing. Once large-scale network
    system paralysis occurs, it may even endanger national security. Only by establishing
    a specialized network information security management agency can the network information
    security work between departments be effectively coordinated, relevant policies
    formulated, major decisions implemented, and the effective development of network
    information security prevention work guaranteed.


    ### (II) Network Information Risk Prevention


    Facing the above potential network information security risks, the state should
    plan in advance, accelerate legislative progress, accelerate the formulation of
    guiding policies, strengthen industry supervision, and increase the establishment
    of innovative institutions. It should plan in advance and resolve early to resolve
    the major information security risks existing in the decisive stage, which is
    of great significance for building a moderately prosperous society in all respects.


    #### 1. Comprehensive Planning, Accelerating Legislative Progress, Gradually Forming
    a Comprehensive and Systematic Network Information Security Legal System

    Law has authority and seriousness. To ensure network information security and
    protect user rights from infringement, network information security regulations
    should be improved and perfected, network behaviors strictly regulated, and network
    crime cases punished according to law, not allowing criminals to exploit legal
    loopholes. On the basis of existing legislation in relevant fields such as the
    *Cybersecurity Law* and the *Law on Guarding State Secrets*, more comprehensive
    laws such as the *Information Law*, *Electronic Information Entry and Exit Law*,
    and *Electronic Information Crime Law* should be enacted to enhance the coordination
    and integrity of the information network security legal system. Through these
    laws and regulations, legal protection should be provided for computer hardware,
    software, and network data to ensure the secure operation and reasonable use of
    network information. It is suggested that the Constitution and Law Committee of
    the National People''s Congress take the lead, with the Ministry of Industry and
    Information Technology, Ministry of Commerce, Ministry of Public Security, Ministry
    of Science and Technology, and other departments jointly discussing, to accelerate
    the establishment and improvement of a network information security legal system
    that quickly adapts to the informatization and digitalization environment. This
    legal system should be forward-looking, systematic, and comprehensive, and promote
    and guide the development of the network information security industry through
    legislation.


    #### 2. Accelerate the Formulation of Guiding Policies for Security Review of
    Key Network Information Technology Core Field Products, and Simultaneously Accelerate
    the Formulation and Implementation of Security Review Standards in This Aspect

    It is suggested that the National Information Security Standardization Technical
    Committee, based on the 8 national standards such as the *Information Security
    Technology — Cloud Computing Service Security Capability Assessment Method*, organize
    relevant experts from the Ministry of Industry and Information Technology, Ministry
    of State Security, and Ministry of Public Security to quickly improve other core
    field network information technology product safety standards currently in the
    solicitation of opinions stage. At the same time, for some technical standards
    not suitable for public disclosure (especially those involving key core technologies),
    it is suggested to solicit opinions within a small scope and implement them as
    soon as possible.


    Meanwhile, it is suggested that relevant departments start formulating supporting
    core field network information technology product safety review policies and systems
    related to the above standards. On the one hand, strengthen the protection of
    network intellectual property rights; on the other hand, resolve major network
    information security risks and hidden dangers early through unified evaluation
    standards.


    #### 3. Attach Importance to Network Information Security Talent Cultivation,
    Real-time Monitoring of Security Status, Resolve Risks of Large-scale Social Engineering
    Outbreaks

    To improve the level of network information security management and prevent the
    risk of large-scale social engineering outbreaks: First, attach importance to
    the cultivation of network information security talents. Network information security
    uses high-level technical means for network management. To detect hidden dangers
    early and resolve crises quickly, a certain number of high-level technical personnel
    are needed to handle crises. Only by having our own high-level technical talents
    can we truly ensure China''s network information security. Second, it is suggested
    that national security departments use professional technical security teams to
    lurk in the dark web to understand the scale and quantity of user privacy information
    currently being traded, monitor in real-time, seize the initiative, prevent trouble
    before it happens, and once problems arise, promptly use necessary means to cut
    off transactions that may have a major impact on society. Third, strengthen the
    security of industrial information systems of large-scale civil facilities such
    as basic water and electricity invested and built domestically or abroad. Focus
    on strengthening the security situation of industrial information systems such
    as power grids, water networks, natural gas networks, large hydropower stations,
    thermal power plants, nuclear power plants, railway transportation, maritime transport,
    and aviation. Prevent the harm of sudden network security attacks to society.
    List the basic civil informatization facilities of medium and large cities as
    key protection targets.


    #### 4. Formulate a National Strategy for Long-term Secure Data Preservation

    The core of the network is data. Once data is destroyed or lost, the consequences
    are unimaginable. To preserve data long-term: On the one hand, it is suggested
    that the Ministry of Science and Technology, Ministry of Culture and Tourism,
    Ministry of Commerce, Ministry of State Security, and Ministry of Public Security
    take the lead in establishing a national specialized big data preservation institution
    to effectively preserve data with strategic value from all aspects long-term.
    Establish this institution as a national directly affiliated independent department
    with large data collection and acquisition authority, establish the authority
    of the institution, and at the same time formulate supporting legal systems for
    data collection and preservation to enhance its strategic importance. On the other
    hand, do a good job in data backup, establish data backup plans, regularly back
    up server data, update backup plans in a timely manner, and at the same time regularly
    conduct security checks on network servers, patch vulnerabilities, and ensure
    data security.


    #### 5. Strengthen Network Information Security Education and Improve Network
    Security Awareness

    Improving public network information security awareness is the foundation of doing
    a good job in network information security. Only by striving to improve the public''s
    network information security awareness can various network security measures truly
    play a role. Network information security education for the public should be strengthened,
    incorporating network information security awareness and basic skills into university
    and social education systems. Through publicizing network security common sense,
    regularly holding network security related training and lectures, etc., enhance
    the public''s sense of worry about network information security and increase attention
    to network security. Once network security is threatened, all our data information
    will be instantly destroyed, causing immeasurable losses. Currently, we must actively
    do a good job in preventive measures to guarantee network information security,
    especially taking financial, military, and other departments as the top priority
    of network information security supervision, and gradually extending to other
    systems to form a strong network security prevention system.


    #### 6. Establish an Efficient Network Information Security Coordination and Linkage
    Management System

    To ensure the Party and the state''s centralized and unified leadership over network
    information security work, China should establish a network information security
    emergency management agency to coordinate network security management matters,
    coordinate network security management work between departments and units. At
    the same time, expand the management authority of the National Computer Network
    Emergency Response Technical Team/Coordination Center (CNCERT/CC), and establish
    specialized network security management departments in agencies and units at all
    levels to ensure full coverage of network security management work. A high-level,
    high-quality criminal investigation team proficient in electronic information
    technology can also be established, which can greatly enhance China''s ability
    to prevent and detect high-tech network crimes, escort China''s network security,
    and thereby improve the level of network security.


    ## 8.6 National Strategy for Cybersecurity Governance


    On December 27, 2016, the Cyberspace Administration of China (CAC) released the
    *National Cyberspace Security Strategy* (hereinafter referred to as the *Strategy*).
    This is the first time China has elaborated on its major positions and propositions
    regarding cyberspace development and security in the form of a national strategy
    document, clarifying strategic guidelines and main tasks. The release of the *Strategy*
    has attracted widespread attention and multi-party interpretation at home and
    abroad. The release of this strategic document has important promotional significance
    for guiding China''s cybersecurity work and advancing the modernization of the
    national governance system and governance capacity.

