    身处大数据时代，积极运用数据实现决策的科学性已成必然。对于数据的获取和收集，在技术上早已不是问题。那么，如何更好地利用这些数据则是技术研究及发展的方向。通过实际舆情工作及技术模型分析，公共事件知识库比对，是行之有效的数据分析研判工作方法。通过公共事件知识库，可以从众多相似舆情案例中抽取出共同特征和相似趋势，找出决定舆情发酵的关键因素，为舆情应急响应和处置提供有力支撑。基于数据的公共事件知识库系统本身也蕴含了科学精准的操作流程和分析研判，减少了因相关人员经验、能力的不同而导致的工作上的偏差。


    ## 第三，创新应急管理工作理念新要求


    当前，国家大力倡导大数据技术的现实应用。政府部门需要在工作方法、技术运用上与时俱进，跟上网络时代的新步伐、新节奏。与此同时，在舆情工作上也要创新思维。基于各机构系统舆情事件多发、分布范围广泛、舆情根源趋同等特征，能够充分发挥公共事件知识库系统舆情研判的优势。不仅如此，采用公共事件知识库系统，还能全面把握涉及社会系统舆情的整体发展趋势，随时掌握涉事主体和关注重点的转移和走向，紧密跟上网络舆论场的新特点、新趋势，为创新社会系统其他工作内容提供借鉴与思路。


    ## 第四，对风险过程进行全流程记录分析


    公共事件知识库系统的一个重要环节就是对于历史事件的还原与记录。当前，数据存储技术已经十分成熟，将过往舆情案例进行妥善记录保存，对于社会系统今后舆情工作的开展具有十分重要的意义。公共事件知识库，不仅仅是一定时期内的、具有阶段特征的各个案例的比较分析和概括归纳，更涉及跨时段的、从长周期来考察的各个案例的比对，即横向比对和纵向比对。所谓“横看成岭侧成峰”，多种比对方式有助于对舆情的理解和分析。公共事件知识库系统具有对舆情事件的全流程保存记录的能力，不会出现因时过境迁或信息删除而导致的信息残缺的困扰。


    ## 第五，化繁为简提高风险治理效率


    对于新技术的应用，实际上正是化繁为简、提高实际工作效率的必然手段。大数据时代，不仅纯人工分析研判舆情早已不可行，使用非专业的、非针对性的舆情收集研判系统，一样会导致出现各种偏差与失误，从而增加相关工作的负担。使用针对社会系统舆情事件特点而量身定做的公共事件知识库系统，能更好地有效抓取和收集相关舆情，不让无关信息淹没真正重要的内容，还能根据使用人员的使用习惯和关注重心，进行有针对性的调整。在进行舆情处置时，科学的公共事件知识库与风险评估，能够让相关处置方案有的放矢、有据可依，提高舆情工作效率。


    ## 第六，公共事件知识库提升风险应对水平


    公共事件知识库系统是一种技术，提供的系统平台是基于科学的数据模型而运行的，但这并不意味着舆情处置就会是冷冰冰的、没有人情温度。恰恰相反，利用数量巨大的成功的舆情处置范例，系统既可以找出那些应对过程中制度化的、流程化的“硬”手段，也能发现起到了安抚涉事者情绪、触动网民大众心理的“软”手段、“软”细节，从而为新的舆情事件应对提供人性化处置的重要参考意见。同时，系统接入专家智库的会商研判，更能增加处置的灵活性与机动性。舆情处置的人性化，既是应对舆情态势新变化的必要手段，本身也是舆情处置的意义之所在。系统平台的引入，将进一步增强对网民情绪变化的分析与研判，从而抓住能够“直指人心”的核心诉求，快速平息舆情演化过程中的负面情绪。


