    # 成功的舆论危机应对经验总结


    成功的舆论危机应对经验值得总结和借鉴，通过历史数据的量化分析，能够发现网络事件背后的必然发展逻辑。依托历史事件库各类维度的大数据比对分析以及智能推演指导处置功能，知识案例库系统将历史数据与苗头事件进行比对，进行预测推演，以期达到简捷、直观、实用并有效指导苗头事件的危机应对与风险感知。该系统的比对能够有效提升风险识别与研判，将舆情风险关口前移，大大提升网络舆情分析、研判的处置水平，提高风险的预测、预见、预报、预警能力，有力增强网络空间综合治理能力。


    ### 3. 现实事件与相似历史事件的对比，提升风险感知的精准性


    网络舆情主要是利用整合互联网搜索技术与信息智能处理技术，对互联网中大量的信息进行抓取与热点发现，从而满足网络舆情的监测和对比。通过对敏感词、关键词等的分析，挖掘相类似的历史事件，基于文本、图形、视频的全形态大数据挖掘比对，对现实事件信息进行追踪，最终形成相应的分析结果。知识案例库比对系统能够实现对网络事件案例对比系统发挥实时监测、及时报告，增强重大事项网络舆情风险研判的科学性，提升可定制的态势风险研判的精准性。


    #### （四）重大网络舆情风险识别与智能预警的对策


    重大网络舆情风险识别与智能预警系统是有效依托大数据、云计算、案例库有机结合的风险识别系统。重大网络舆情的风险识别与智能预警是需要以庞大案例库系统为基础、专家舆情研判分析为指导、大数据和与计算的技术为支持、舆情预警引导机制为辅助的多维预警。


    ##### 1. 完善网络事件案例库系统，依托案例库为动力提升风险研判全面性


    舆情风险管理是现代舆情治理中的重要组成部分，基于网络事件案例库比对系统，完善网络事件案例库系统，加强网络舆情风险治理能力，将舆情风险管理前置，由以往的事后监管转变为事前预警。因此，要完善网络事件案例库系统，依托网络对重大网络事件进行收集、整理分析，通过敏感词源、关键词汇等检索方式完善关键字抽取、关键信息提取、正文抽取、自动识别热点网络舆情。同时，完善案例库系统检索方式、搜索功能、相关事件的呈现方式，能够依托案例库系统实现现实事件、历史事件、历史数据、现实决策、苗头事件的对比，加强网络舆情风险的感知与研判。通过系统的完善能够有效解决传统网络空间综合治理手段中态势研判能力不足的问题，能够在知识库训练的基础上，对当下正在发生的公共事件或即将出台的重大决策之舆论风险进行有效的全方位的过程仿真，为决策的制定提供重要的风险预警研判服务。


    ##### 2. 组建舆情风险专家经验库，依托专业舆情知识，提升风险预警专业性


    网络已成为最大的表达诉求的平台，网络舆情风险凸显，组建舆情风险专家经验库可以提升风险应对能力，增强网络舆情风险处置的权威性。首先，由资深新闻记者、法律专家、危机管理专家、舆情专家和相关专业人士组建重大决策网络舆情风险专家经验库，由专业人士提供类似案例和历史事件舆情风险应对、研判经验，实现类似经验、成功经验的提取，提升舆情风险处置能力，有专家助力，为提高网络舆情风险感知与预警“含金量”加码。同时，定期对相关专业的专家进行增补，及时对专家经验进行完善，开展专家经验分享，通过分享完善综合舆情风险应对经验，依托专业知识提升舆情风险预警的专业性。


    ##### 3. 优化舆情风险预警技术，依托预警技术与平台，提升风险识别预警精准性


    大数据技术和云计算的发展为当前风险预警预研判提供了技术支撑，因此重大网络事件舆情风险预警要依托大数据、云计算、人工智能等技术实现预警。成熟的数据分析技术与完善的案例库的结合能够对数据进行对比、研判。同时，完善舆情信息交互分享平台，信息交流分享提升信息利用率，基于内容相似的智能聚类技术，自动发现网络的热点词汇，包括热点人名、地名以及其他热点词汇，并通过关联技术组织一起，提前感知网络热点。依托计算机统计分析技术对舆情信息分类，有效地在海量信息中发现目标信息或有害信息，并对其传播态势及社会安全危害进行自动精准研判，增强区域网络空间治理能力，提升重大舆情风险的预警精准性。


    ##### 4. 构建重大网络舆情风险综合机制，依托立体机制提升风险感知系统性


    舆情风险识别与预警是建立在网络舆情大数据被充分挖掘开发利用的情况下，基于网络事件知识案例库比对系统对舆情分析研判，构建重大网络舆情风险综合机制能够大大提升预警系统性。首先，建立健全舆情预警机制。基于知识案例库比对系统，建立“人工+技术”的立体化监测预警，建立重点事件、重点舆区、重点领域不间断预警，充分考虑可能爆发舆情的各种风险，为突发舆情事件处置赢得宝贵时间。其次，网络舆情甄别研判机制。通过系统对比对网络舆情真伪进行甄别，对影响因素、来源进行分类和定向，增强舆情预警的及时性和可靠性。最后，完善网络舆情引导机制。要善于利用案例库比对系统分析结果增强主流信息引导的有效性，实现主流信息的传播引导，降低网络舆情潜在风险，通过早期预警与引导降低舆情危机的发生概率。


    ## 6.3 网络或舆论形象修复


    针对党政机构或企事业单位经历重大舆情危机考验后，声誉公信力形象明显受损的形势，在遵循重大危机事件基本舆情规律的前提下，充分考虑事件的基本舆论形势，积极寻找有效舆论突破口，为涉事的相关机构撰写全面的形象修复实施方案，以争取在最短的时间内恢复、重塑涉事机构或个人的舆论形象。


    经历重大舆情危机考验后，面对事件给自身声誉、公信力、形象带来的创伤与冲击，涉事党政机构或企事业单位的过度主观舆论引导，或“放弃治疗”显然都无助于舆论形象的修复。而这正是左右重大危机事件对涉事机构舆论形象影响长尾效应的关键所在，必须要引起高度重视。


    借助重大危机舆论形象修复实施方案，可有效寻求涉事机构的舆论引导突破口，借助积极、主动的舆论引导或相关辅助措施，能够有效修复涉事机构的网络舆论形象，以此降低舆情事件的负面影响和危害。


    负面舆情解决之后，降温、冷却并不等于处置工作可以止步。若舆情处置应对中未能形成闭环，关联因子一有风吹草动，会重新发酵，点燃舆情之火，给有关部门或企事业单位的声誉带来二次创伤。特别是一些重大事件潜存长尾效应，相关部门和单位更需重视。在进行形象修复时，高层级响应不但可以定纷止争，通过宣传引导，更可以令舆论向正向发展。舆情发酵过程中，特别是在众声喧嚣的网络舆论环境中，一些网民对一些部门和单位的刻板印象长期存在，这也加大了形象修复的难度。在舆情发生前期，快速反应、积极发声对化解问题有积极作用。舆情后期，主动作为、顺势引导、消除误解则能有效地进行形象修复。面对突发事件特别是自然灾害，相关部门和单位舆情应对处置能力的高低是影响形象修复的关键。每当夏季暴雨来袭，一些城市管理者就会面临“下水管道，城市的良心”“去某地看海”“管理缺位”等声音。此时相关部门和单位须总结过往经验教训，防患于未然，多方联动，积极处置，其形象修复自然水到渠成。


    舆论形象修复的原则与应对网络风险时一致。第一，它是在确保及时性的原则下采取的降低网络舆论危害的主动行为。第二，要本着实事求是的态度，有一说一，有二说二，不能文过饰非，颠倒黑白，弄虚作假或者造谣诽谤他人，以免再次成为舆论攻击的焦点，引发更大的网络风险，造成更大的损失。第三，和危机公关的策略相类似，都要采取必要方式方法修复，例如有效利用第三方权威声音和渠道等。


    # 第七章 自媒体与网络风险治理


    ## 7.1 自媒体的核心价值


    乌尔里希·贝克说，在后现代社会各类风险泛化之后，公众的批评、反科学的研究，揭下了它借以隐藏的面纱，使它在社会政治的辩论中占有了重要的席位。


    一位明星的偷税漏税行为是如何被公之于众，并引发娱乐圈地震？一家违规运营多年的“直销”公司又是如何在一篇网文之下迅速成为众矢之的，乃至多年逍遥法外的帝国缔造者瞬间跌落神坛？这股发源于网络的舆情风暴折射了怎样的社会价值体系？政府管理部门又该以怎样的姿态来迎接这股力量？


    近年来，网络平台催生的热点话题层出不穷。网情民意中潜藏的巨大能量也逐渐为大众所感知，而一起起网络舆情事件呈现出的规律和特征，投射出舆情背后的暗涛涌动，掀开了社会风险复杂交织的冰山一角。


    2019年1月22日，习近平总书记在中央党校省部级主要领导干部坚持底线思维着力防范化解重大风险专题研讨班开班式上发表讲话时指出，要坚持以新时代中国特色社会主义思想为指导，全面贯彻落实党的十九大和十九届二中、三中全会精神，深刻认识和准确把握外部环境的深刻变化和我国改革发展稳定面临的新情况、新问题、新挑战，坚持底线思维，增强忧患意识，提高防控能力，着力防范化解重大风险，保持经济持续健康发展和社会大局稳定，为决胜全面建成小康社会、夺取新时代中国特色社会主义伟大胜利、实现中华民族伟大复兴的中国梦提供坚强保障。


    在互联网舆情方面，在保障公民话语权的同时，一些西方自由主义、个人主义思潮和其他有害言论所造成的舆论冲击，正在消解这个社会的核心价值观在网络空间中的主导地位，破坏并阻滞社会共识的形成，这已经成为网络舆情风险的一大突出表现。


    网络和社会媒体能够以其巨大的渗透力和影响力重塑我们的价值体系和文明体系，让我们分裂的社会思想体系得以最快地重建和恢复，找寻我们共同前进的最大共识和对未来的自信，这正是网络风险或网络舆论风险研究的公共价值所在。


    舆论不是一个新事物，它具有历史的渊源。早在西汉时期，已有汉文帝“广开言路”，且有“防民之口，甚于防川”等与舆论相关的醒世警言流传至今。“舆情管理要以史为鉴”，这是在发展的视角中对现代网络舆情的一次追根溯源，是以深入的史料研究对舆情产生的土壤和古人的应对智慧的借鉴阐释。


    时日更迭，身处信息化和自媒体时代，舆情载体发生了深刻的变化，“现代舆情主要表现为网络中各类舆情的出现及其发生、发展、演变”。移动网络和社交媒体平台及如雨后春笋般涌现的自媒体代表着大数据时代的新型舆论场。传统媒体占据全部话语权的单一的舆论格局被彻底颠覆。放眼全球，报纸、广播、电视等传统媒体努力捍卫行业地位，驶往下一个时代潮头，却也不得不接受或消亡、或转型的摆渡之舟。而社会化媒体作为思想传递、价值分享的时代新宠，也并非以“单一”战胜“单一”的简单替代，而是呈现出多样化特征。


    媒体社会化时代到来后带来精彩纷呈、热闹非凡以及裹挟着泥沙俱下和鱼目混珠的态势。网络舆论的复杂性及其信息源的复杂程度不容忽视，提升在网络复杂舆论空间的辨识力和审视力则尤为重要。


    社会化媒体为大众化的舆论监督提供了可能，是大众积极参与社会互动、共享信息化发展成果的表现，“对待社会媒体的态度能折射国家治理的良心和自信”。与此同时，社会化媒体势头强劲，却不能任由其野蛮生长，网络从来都不是法外之地。掌握、熟悉网络舆情外在特征，并分析其内在传播规律，是时代对我们的治理部门提出的新要求。“任何轻视网络媒体巨大社会思想动员能力的认识和做法都是极其错误的”，毕竟摆在面前的现实就是“互联网已经成长为一个能够让社会成员广泛参与的巨大舞台和民意表达舞台”。


    认识到网络舆情在社会治理中的地位，只是了解掌握网络舆情的第一步。基于一定的社会现实，结合网络舆情的一般性规律，便不难找出某一社会话题如何发展为轰轰烈烈的网络舆情事件这一问题的答案。


    “风起于青![](images/figure_0157_0001.jpg)之末”，汹涌的网情民意背后是公民的参与意识和民间的智慧微光。网络舆情研究的重要目的之一就是要将提高公民意见表达能力与社会责任感当成构建和谐网络舆论环境的前提，将提升公共治理水平、倾听民意的能力当作网络舆情研究的核心内容。政府作为公共管理的主体，网络舆情管理是绕不开的“辖区”。相对于网络世界一次次自行发展重塑，政府部门的管理尚处于从被动到主动的关键时期，相关的网络管理机制和法律体系逐步建立。


    无论是政府应急处置，抑或是一般性的网络舆情管理，技术手段都是现代化治理方案中不可或缺的支撑。


    依靠技术手段和治理者智慧建立起的舆情管理体系中还贯穿着一个重要的理念：打破始终将政府置于公众舆论对立面的刻板印象，政府管理部门亦是信息时代网络空间的内容供给者和参与者。电子政务作为政府与公民之间数字化的连接方式，是政府提供服务和拓宽公民参与的重要形式。而活跃在社会化媒体上的政府公共服务账号以及官方意见领袖，更是参与到网络舆论的最前线。有关新型电子政务与政府社会化媒体管理的内容，也是“十二五”“十三五”“十四五”信息化发展规划的重要议程。


    坚持底线思维，增强忧患意识，提高防控能力，着力防范化解重大风险。人类即将进入5G或6G时代，如何更好地掌握、化解网络舆情风险，揭开网络舆论风险的面纱，探察社情民意中隐藏的正向能量，在社会治理中寻找出路，在社会价值观上凝聚属于这个国家、这个时代的共识，是全社会的责任，更是治理者的义务。


    ## 7.2 网络灰色产业链带来社会隐形风险


    2018年3月20日，网民@前水军人老邪在澎湃问吧发帖《我是前水军团队BOSS，水军行业到底水有多深，问我吧！》，直言“创办过一家网站、两家传媒公司及水军炒作工作室”“水军行业的水很深，想更多地了解这个行业，来问我吧”。同年3月27日，澎湃新闻刊发文章《口述|一名水军的日常》对“老邪”做网络水军的日常进行全面报道，引发网民较高关注，也让舆论再度聚焦网络水军问题。


    ### （一）网络水军现状


    在维基百科中，网络水军被定义为一群在网络中针对特定内容发布特定信息的、被雇佣的网络写手。网络水军简称水军，又名网络枪手，他们通常活跃在电子商务网站以及论坛、微博等社交网络平台中。他们伪装成普通网民或消费者，通过发布、回复和传播博文等对正常用户产生影响，有专职和兼职之分。


    #### 1. 网络水军组织分类


    传统水军仅仅在论坛大量灌水，而现代水军已系统化、规模化，按工作性质简单分类，主要分为打击对手的营销水军和仅提供形象维护的营销水军。


    #### 2. 网络水军人员构成


    对于特定任务，通常有组织者团队负责组织此推广活动，通常有三组人员为他们工作：资源组、内容发布者和观察评估组。资源组负责为推广活动提供素材，如博文内容、图片、视频等；内容发布者，则将资源组提供的素材发布到特定的网站中，其可能是雇员，也可能是兼职人员；观察评估组通常评价己方推广活动的成果和分析敌方的应对，为组织者的决策提供支持。水军主要群体还是学生和社会闲杂人等，因为这部分人无固定经济收入，赚钱是其进入行业的主要动力。


    #### 3. 网络水军群体特征


    网络水军的群体特征主要有：一是主体不特定，行业门槛极低，只要是具备打字能力、上网能力的普通网民就可以成为主体，且分布在社会的各个角落，一旦发生网络侵权案件，司法机关很难确定实施侵权行为的主体；二是工作简易，不需要特定的办公场所，因此，很多人为了追求快捷的工作方式而加入“网络水军”的队伍；三是追求特定的经济利益，随着队伍的不断扩大，其经济来源的领域也在逐步拓宽；四是身份存在着一定的隐蔽性，以普通网民的身份出现，很难辨别其真实身份。


    ### （二）网络水军引发的问题


    #### 1. 舆论认为网络水军规模迅速膨胀，朝着行业化、公司化、职业化方向发展，破坏网络正常生态，严重侵害公民人身财产权利


    网络水军发展到今天，规模日益壮大分工也更细致，可谓“错综复杂”。舆论认为，想要进行全面整顿并不容易，网络水军不仅侵害公民名誉权、隐私权等，还可能在有偿删帖过程中导致公民财产损失。《人民日报》报道称，公安部网安局有关负责人表示，非法推广、有偿删帖、诽谤攻击、技术支撑、售后服务等各项业务都有专人负责，严重破坏网络正常生态，严重侵害公民人身财产权利。2017年5月公安部组织开展打击“网络水军”违法犯罪活动专项行动以来，已破获相关违法犯罪案件40余起，涉案总金额上亿元。


    #### 2. 舆论认为网络水军影响网络信息质量，扭曲网络舆论空间，带歪舆论节奏，各种假消息满天飞，网民很难再相信网络信息


    “明星互撕，明星的小号被曝光，各种东西其实都是套路……”前水军人“老邪”的自白，让各种乱带节奏的伎俩曝光，令人深信不疑的网络信息有可能只是炒作。舆论认为，水军猖獗导致网络舆论空间被严重扭曲，大量垃圾、无效、偏差、负面信息致使网络信息质量受到严重影响，网民不再轻易相信网络信息。《人民日报·海外版》指出，网络“水军”已经损害了互联网信息质量。澎湃新闻评论则称，“水军们”通过海量的信息碾压，覆盖真实信息，带歪舆论节奏，从而指鹿为马、三人成虎，结果是“假作真时真亦假”，各种对企业和个人的恶意诽谤攻击，颠倒黑白，拿不出作品的“流量明星”却霸占了我们的眼球。


    #### 3. 舆论认为网络水军在资本的操控下炮制各类社会热点，民意甚至被“裹挟”利用，沦为炒作的工具


    花钱就能“买粉”“买热搜”，让网民看到了资本的力量，“紫光阁地沟油”事件也显示了网络水军的猖獗。舆论认为，恰恰是在最开放、门槛最低的舆论空间，有些人为了利益，不惜炮制谣言，捏造事实诋毁对手，甚至将不知情的网民“裹挟”进来，“民意”成了被分食的鱼肉。《法制日报》报道称，每个网络平台热搜榜上，都有网络水军的影子，花钱购买热搜已经成为炒作的常用手段。央视报道则称，亿万网民，跟着这些网络水军的指挥棒贡献点击率，并在不知不觉中被引导和操纵，甚至无意中成为打手的工具。


    #### 4. 舆论认为网络水军会导致不正当竞争，商家利用水军来误导宣传或者打击对手，导致市场竞争处于无序状态


    2019年1月1日，修订后的《反不正当竞争法》正式施行。新法施行后，网络水军等不法经营者将受到严厉处罚。舆论认为，商家利用水军开展刷单、炒信、删除差评、虚构交易等业务严重干扰消费者选择，早就应该打击此类失信行为，网络水军甚至会沦为商家打击对手的工具。《北京日报》评论称，某些网络水军帮助幕后企业诋毁、诽谤竞争对手，影响其正常运营，这不仅严重侵害了受害企业商誉，而且也严重扰乱了社会主义市场经济秩序。


    #### 5. 舆论认为网络水军或对国家安全和社会稳定构成威胁，他们可能被境外敌对势力利用，危害国家安全，造成社会动荡


    网络水军系受雇于他人而展开活动，对利益的追求往往会促使其突破法律的界限。舆论认为，网络水军若被居心叵测的国外势力利用，借此实施煽动分裂国家、破坏国家统一的活动，就很可能危害国家安全。这显然有其先例。《新京报》曾报道，北京警方曾组织开展网上治安综合治理专项行动，强化打击散布危害国家安全信息的网络推手和水军。


    ### （三）网络水军屡禁不止的原因


    #### 1. 组织架构相对完备，拥有应对策略能抵御风险


    网络水军已然规模化，形成相对成熟的管理体系。舆论认为，网络水军组织架构在发展中完备，能够抵御一定的风险。澎湃新闻文章《揭秘网络水军王国：任务、系统与小兵》指出，水军隐匿无踪，却又无处不在。面对各网络平台技术调整升级，水军依然有自己的应对策略，他们会一起探讨“业务”和“技巧”，比如怎么养号，哪些平台比较安全，如何避免账号被封等。


    #### 2. 仍然存在利益空间，违法成本不足以形成有效震慑


    网络实名制等政策密集出台、细化实施，不断压缩网络水军的生存空间。舆论认为，网络水军仍然屡禁不止，仍然在持续发展，就是因为该行业还有利益空间，违法成本仍然不高。澎湃特约评论员毕舸认为，有利益的地方就会有江湖，依然会有人为了一点蝇头小利加入水军行当，也会有企业利益当头，继续铤而走险。只有当“老邪”和幕后操纵者们的违法成本远高于收益，才是这些人收山之时。


    #### 3. 专业技术逐步提高，操纵策划更加不露痕迹

