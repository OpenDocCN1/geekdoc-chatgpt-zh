    ### 2. 数值天气预报的分析模拟和运作模型


    #### 数据分析模型


    （1）给定初始和边界条件；


    （2）通过数值方法求解描述大气动力和热力规律的方程组；


    （3）达到由初始时刻大气状态预报未来大气状态的目的。


