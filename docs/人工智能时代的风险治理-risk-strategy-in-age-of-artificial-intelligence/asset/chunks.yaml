    ## 2.1 网络空间风险治理概论


    网络空间风险治理包括对网络空间所承载的各类社会信息的收集、分析以及风险的研判预警。网络风险具有对现实社会环境的破坏作用，阻滞社会目标的实现。网络风险主要来自三个方面：一是对社情民意失察风险；二是网络空间中的各类主体对社会大众心理反向动员风险；三是网络风险向线下传导的风险。


    网络风险治理包括风险发现、风险预警、危机应对、应急管理等。所谓的网络舆情监测或舆情学主要是围绕各类网络公共事件的传播学特征进行的风险发现、分析进行的研究。


    从某种意义上说，风险分析、风险预警和风险治理协同体系是“互联网+监管”“数据+督察”体系中最核心的组成部分。风险分析的本质是利益分析，利益分析又是评价风险治理举措优劣和社会风险的核心考量要素之一。风险治理决策其实质也是利益取舍抉择。


    所谓的利益分析或利益动机分析，是从利益的角度观察社会历史现象，并通过了解其本质和根源，透过各种社会主体的言论和行为把握其动因的方法。它是人们把握现实利益格局，正确制定战略的十分重要的工具。利益分析方法在社会领域和人类社会发展的进程中具有普遍的适用性、有效性和针对性。


    利益问题既是重大社会事件的导火索，又是它的根本原因和深层次原因，因此要把握重大社会事件的本质，除了了解事件形成和发展经过的事实外，更重要的是要把握它的利益根源，这样才能不被它的假象迷惑，把握到其本质、动因和发展的趋势。各个阶级和社会集团在社会中的不同地位决定其基本态度。分析社会关系和整个利益格局是制定战略的依据。社会主体倡导和策划，以及实施任何决策都出于一定的利益动因，因此必须根据社会事件对谁有利以及利害的性质和程度来决定社会风险治理政策和风险应对策略。


    善治一定是基于公众利益最大化或最大安全原则出发而做出的一系列决策行动，它也是体现“全心全意为人民服务”的根本原则和核心宗旨。


    面对复杂的内外环境和各种不确定性，如何提升社会风险预警的整体水平，如何提升风险应对能力，用数据说话，用数据决策，应当成为各级领导的决策范式，在任何涉及全局的重大决策出台之前，都必须要经过风险的前置研判以及政策施行的社会效能分析。效能分析包括风险的定性和定量分析，风险后果的定性和定量研判，风险治理对策的定性和定量评价，以及对风险治理政策的绩效测评。


    传统决策在某些场景下会遭遇决策失灵，并可能导致社会灾难和公共利益损失。决策失灵的原因之一在于决策者对决策对象相关信息存在严重的信息不对称问题。决策的过程就是不断地解决信息不对称的过程。决策所需的信息不对称表现在对决策对象的历史、现实或者未来的态势信息掌握得不充分。换句话说，对支持决策所需的各类信息掌握不全面，或者存在信息不对称是绝对的，而充分且全面地掌握各类有效决策所需的信息是相对的。决策研判的过程即是不断消除信息不对称并最大限度趋利避害的过程。在这个过程中，大数据和人工智能将扮演重要的角色，传统决策流程被数据和算法重新定义，以“社会机器”推动的决策革命的浪潮已经到来。


    增强忧患意识，树立风险思维，构建以数据决策为核心的现代治理模式和风险治理效能测评以及政策优劣检视思维应当成为各级政府领导和企业家们的共识。


    风险与社会的作用动力机制是风险治理研究的核心。推动善政善治惠民，提升政府治理能力和为人民服务的水平是政府大数据应用和风险治理的终极目标。


    风险战略的研究目前学术界并不统一。在有些研究中，经常把“风险战略”当作“战略风险”。“`Strategic Risk Management`”一词首次出现于Kent
    D. Miller的文章《国际商业中的综合风险管理架构》，该文1992年发表于《国际商业研究杂志》的第23卷第2册上。Miller指出了企业对于战略环境不确定性的五种一般反应：规避（`Being
    avoidance`）、控制（`Control`）、合作（`Cooperation`）、模仿（`Imitation`）以及适应（`Flexibility`）。他对风险的研究更多偏向于企业或组织机构对不确定性风险的研究。


    乌尔里希·贝克在他的《风险社会》中如是说，危险不断增长，但在政治领域，危险并没有被转变成预防性的风险管控政策，这是事实。他说，阶级社会的政治主体（或社会大多数）是无产阶级，风险社会的目标物却只剩所有人的痛苦。


    《战略风险管理》的作者亚德里安·斯莱沃斯基[\[1\]](#Chapter_6_1.xhtml#B2)认为，不管一家公司规模有多大，都有可能因为没有预料到转型或是没有为转型做好准备而受到重创。在企业一帆风顺的时候，战略风险反而更大。每当你想放松或得意一下的时候，却恰恰应该是你紧张且加倍警惕的时候。该书介绍了如何将危机转化为突破性增长的七个战略：提高胜率；了解，而不是猜测客户需求；两手准备；打赢不可战胜的对手；更新商业模式来保护品牌；与竞争对手合作，逃离零利润区；创造新的需求形式，做大蛋糕。


    现在社会风险战略管理应该包括各级社会组织对该组织所面临的外部和内部环境中可能出现的各类打破常规体系的所有因素以及对可能引致的结构性变化所采取的预见、规避、应对、利用和转移、处置等进行统筹谋划、合理应对的全过程。


    风险战略管理包括静态的事前预演和动态的事中处置以及事后修复。风险战略具备系统性、前瞻性、全局性、协同性、策略性、可操作性和利益最大化的特征。


