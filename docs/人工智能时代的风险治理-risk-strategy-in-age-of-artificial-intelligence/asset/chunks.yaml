    ## 第二


    依法治网是推进国家治理体系和治理能力现代化的重要环节和内在要求。十八届五中全会进一步提出，“十三五”期间“各方面制度更加成熟定型，国家治理体系和治理能力现代化取得重大进展”。很显然，在现实时空与网络时空的平行交叉中，“现代治理能力”不仅指向实体的生活场景，更涵盖了网络社会与网络生活。如何通过法治手段实现对网络社会的有效治理，已经成为推进国家治理体系和治理能力现代化的重要一环，甚至可能成为国家治理体系和治理能力现代化的重要着力点和突破口。


    把握网络社会的特征，进而实现治理创新，同时也是全面深化改革的重大课题。实现治理现代化目标的一个路径是社会共治。网络社会比实体社会更需要强调社会共治。网络社会的虚拟性、与实体社会的不可分割性、公众参与的广泛性三个特征指向的治理模式就应当是共治。


