- raw: '网络空间风险治理包括对网络空间所承载的各类社会信息的收集、分析以及风险的研判预警。网络风险具有对现实社会环境的破坏作用，阻滞社会目标的实现。网络风险主要来自三个方面：一是对社情民意失察风险；二是网络空间中的各类主体对社会大众心理反向动员风险；三是网络风险向线下传导的风险。


    网络风险治理包括风险发现、风险预警、危机应对、应急管理等。所谓的网络舆情监测或舆情学主要是围绕各类网络公共事件的传播学特征进行的风险发现、分析进行的研究。


    从某种意义上说，风险分析、风险预警和风险治理协同体系是“互联网+监管”“数据+督察”体系中最核心的组成部分。风险分析的本质是利益分析，利益分析又是评价风险治理举措优劣和社会风险的核心考量要素之一。风险治理决策其实质也是利益取舍抉择。


    所谓的利益分析或利益动机分析，是从利益的角度观察社会历史现象，并通过了解其本质和根源，透过各种社会主体的言论和行为把握其动因的方法。它是人们把握现实利益格局，正确制定战略的十分重要的工具。利益分析方法在社会领域和人类社会发展的进程中具有普遍的适用性、有效性和针对性。


    利益问题既是重大社会事件的导火索，又是它的根本原因和深层次原因，因此要把握重大社会事件的本质，除了了解事件形成和发展经过的事实外，更重要的是要把握它的利益根源，这样才能不被它的假象迷惑，把握到其本质、动因和发展的趋势。各个阶级和社会集团在社会中的不同地位决定其基本态度。分析社会关系和整个利益格局是制定战略的依据。社会主体倡导和策划，以及实施任何决策都出于一定的利益动因，因此必须根据社会事件对谁有利以及利害的性质和程度来决定社会风险治理政策和风险应对策略。


    善治一定是基于公众利益最大化或最大安全原则出发而做出的一系列决策行动，它也是体现“全心全意为人民服务”的根本原则和核心宗旨。


    面对复杂的内外环境和各种不确定性，如何提升社会风险预警的整体水平，如何提升风险应对能力，用数据说话，用数据决策，应当成为各级领导的决策范式，在任何涉及全局的重大决策出台之前，都必须要经过风险的前置研判以及政策施行的社会效能分析。效能分析包括风险的定性和定量分析，风险后果的定性和定量研判，风险治理对策的定性和定量评价，以及对风险治理政策的绩效测评。


    传统决策在某些场景下会遭遇决策失灵，并可能导致社会灾难和公共利益损失。决策失灵的原因之一在于决策者对决策对象相关信息存在严重的信息不对称问题。决策的过程就是不断地解决信息不对称的过程。决策所需的信息不对称表现在对决策对象的历史、现实或者未来的态势信息掌握得不充分。换句话说，对支持决策所需的各类信息掌握不全面，或者存在信息不对称是绝对的，而充分且全面地掌握各类有效决策所需的信息是相对的。决策研判的过程即是不断消除信息不对称并最大限度趋利避害的过程。在这个过程中，大数据和人工智能将扮演重要的角色，传统决策流程被数据和算法重新定义，以“社会机器”推动的决策革命的浪潮已经到来。


    增强忧患意识，树立风险思维，构建以数据决策为核心的现代治理模式和风险治理效能测评以及政策优劣检视思维应当成为各级政府领导和企业家们的共识。


    风险与社会的作用动力机制是风险治理研究的核心。推动善政善治惠民，提升政府治理能力和为人民服务的水平是政府大数据应用和风险治理的终极目标。


    风险战略的研究目前学术界并不统一。在有些研究中，经常把“风险战略”当作“战略风险”。“战略风险管理”（Strategic Risk Management）一词首次出现于Kent
    D. Miller的文章《国际商业中的综合风险管理架构》，该文1992年发表于《国际商业研究杂志》的第23卷第2册上。Miller指出了企业对于战略环境不确定性的五种一般反应：规避（Being
    avoidance）、控制（Control）、合作（Cooperation）、模仿（Imitation）以及适应（Flexibility）。他对风险的研究更多偏向于企业或组织机构对不确定性风险的研究。


    乌尔里希·贝克在他的《风险社会》中如是说，危险不断增长，但在政治领域，危险并没有被转变成预防性的风险管控政策，这是事实。他说，阶级社会的政治主体（或社会大多数）是无产阶级，风险社会的目标物却只剩所有人的痛苦。


    《战略风险管理》的作者亚德里安·斯莱沃斯基[\[1\]](#Chapter_6_1.xhtml#B2)认为，不管一家公司规模有多大，都有可能因为没有预料到转型或是没有为转型做好准备而受到重创。在企业一帆风顺的时候，战略风险反而更大。每当你想放松或得意一下的时候，却恰恰应该是你紧张且加倍警惕的时候。该书介绍了如何将危机转化为突破性增长的七个战略：提高胜率；了解，而不是猜测客户需求；两手准备；打赢不可战胜的对手；更新商业模式来保护品牌；与竞争对手合作，逃离零利润区；创造新的需求形式，做大蛋糕。


    现在社会风险战略管理应该包括各级社会组织对该组织所面临的外部和内部环境中可能出现的各类打破常规体系的所有因素以及对可能引致的结构性变化所采取的预见、规避、应对、利用和转移、处置等进行统筹谋划、合理应对的全过程。


    风险战略管理包括静态的事前预演和动态的事中处置以及事后修复。风险战略具备系统性、前瞻性、全局性、协同性、策略性、可操作性和利益最大化的特征。


    * * *


    [\[1\].](#Chapter_6_1.xhtml#BT2)亚德里安·斯莱沃斯基（Adrian J. Slywotzky）是美世管理顾问公司的全球副总裁，也是著名的畅销书作家，《工业周刊》将其誉为“21世纪的彼得·德鲁克、超越同侪的管理大师”。著有《发现利润区》（The
    Profit Zone）等影响深远的畅销书。


    ## 2.2 风险社会理论体系


    风险社会是指在全球化发展背景下，由于人类实践所导致的全球性风险占据主导地位的社会发展阶段，在这样的社会里，各种全球性风险对人类的生存和发展存在着严重的威胁。


    随着人类活动频率的增多、活动范围的扩大，其决策和行动对自然和人类社会本身的影响力也大大增强，从而风险结构从自然风险占主导逐渐演变成人为的不确定性占主导。再者二是风险的“制度化”和“制度化”的风险。人类具有冒险的天性，但也有寻求安全的本能，而近代以来一系列制度的创建为这两种矛盾的取向提供了实现的环境以及规范性的框架。与市场有关的诸多制度（典型的是股票市场）为冒险行为提供了激励，而现代国家建立的各种制度则为人类的安全提供了保护。但是无论是冒险取向还是安全取向的制度，其自身带来了另外一种风险，即运转失灵的风险，从而使风险的“制度化”转变成“制度化”风险。


    1986年贝克在德国出版了《风险社会》。这本书的内容简介说，乌尔里希·贝克将后现代社会诠释为风险社会，其主要特征在于：人类面临着威胁其生存的由社会所制造的风险。我们身处其中的社会充斥着组织化不负责任的态度，尤其是，风险的制造者以风险牺牲品为代价来保护自己的利益。作者认为西方的经济制度、法律制度和政治制度不仅卷入了风险制造，而且参与了对风险真相的掩盖。贝克力倡反思性现代化，其特点是既洞察到现代性中理性的困境，又试图以理性的精神来破解这种困境。[\[1\]](#Chapter_6_2.xhtml#B3)


    贝克认为，风险社会的概念指现代性一个阶段。在这个阶段，工业化社会道路上所产生的威胁开始占主导地位。风险社会的概念在三个参照领域内带来了划时代的系统性转变。首先是现代工业社会与自然资源和文化资源之间的关系，在现代化完全确立后这些资源逐渐消失了；其次是社会与其自身所产生的、超越了社会对安全的理解范围的威胁与问题之间的关系，人们一旦意识到这些威胁和问题的存在，就很可能动摇旧社会秩序的根本假设；最后，工业社会文化中的集体的或具体团体的意义之源（比如阶级意识或进步信念）正在枯竭、失去魅力。在贝克看来，工业社会的核心问题之一是财富分配以及不平等的改善与合法化。而在风险社会，我们必须把伤害的缓解与分配作为核心问题。在古典现代性中，财富和权力是其标志性概念，而风险和不确定性则是反思现代性的概念。


    贝克的《风险社会》一开始沉寂了数年，直到1992年被马克·里特（Mark Ritter）译成英文后，“风险社会”作为—个概念和理论才为更多的西方学者以及公众所接受。


    风险社会作为一个概念并不是历史分期意义上的，也不是某个具体社会和国家发展的历史阶段，而是对目前人类所处时代特征的形象描绘。因此，我们可以说，人类处于风险社会时代，但不能讲某个国家是风险社会，尽管那个国家的国内情况比其他国家更不安全。但是，风险社会不仅仅是一个认知概念，还是一种正在出现的秩序和公共空间。在后一种意义上，它更具有现实性和实践性。如吉登斯、贝克等人所说，风险社会的秩序并不是等级式的、垂直的，而是网络型的、平面扩展的，因为风险社会中的风险是“平等主义者”，不放过任何人。风险社会的结构不是由阶级、阶层等要素组成的，而是由个人作为主体组成的，有明确地理边界的民族国家不再是这种秩序的唯一治理主体，风险的跨边界特征要求更多的治理主体出现并达成合作关系。


    在风险社会中，风险具有了以下几个特点：


    （1）从根源上讲，风险是内生的，伴随着人类的决策与行为，是各种社会制度，尤其是工业制度、法律制度、技术和应用科学等正常运行的共同结果。而自然“人化”程度的提高，使得风险的内生特点更加明显。


    （2）在影响和后果上，风险是延展性的。其空间影响是全球性的，超越了地理边界和社会文化边界的限制，其时间影响是持续的，可以影响到后代。


    （3）在特征上，大部分风险后果严重，但发生的可能性低。因此我们可以说，尽管风险增加了，但并不意味着我们生活的世界不安全了。


    （4）在应对方法上，现有的风险计算方法、经济补偿方法都难以从根本上解决问题。要通过提高现代性的反思能力来建构应对风险的新机制。


    * * *


    [\[1\].](#Chapter_6_2.xhtml#BT3)乌尔里希·贝克：《风险社会》，北京：译林出版社，2004年，第15—22页。


    ## 2.3 全球风险治理的困境


    现代风险跟以往的风险界定已有了很大的变化，一是人为的、主观的风险大大增加，二是有组织的、体制性的风险来源也明显出现，三是对风险的治理手段也从以往单纯依靠技术进步而倾向于多维度的治理系统。


    现代风险的出现与发展跟现代性的自反性理论息息相关。自反性现代化理论把整个现代化过程都纳入思考视域，把其结构性断裂解释为现代化自身的后果。在这里，自反性包含双重含义：一是自我反对（self-refutation），二是自我反思（self-reflection）。自我反对是指以科学和理性为核心的现代化所招致的非理性甚至反理性后果，不断地消解着自身存在的基础；自我反思表征的是追求自知和确定性的理性对自身性质的反思，从而具有了破坏其获取某种确定性知识的可能。因此，现代风险的研究既有现代性的本质，又有后现代的指向。现代性的本质在价值取向上表现在为现代经济的发展寻求价值合理性，也表现在为现代社会的伦理精神寻求依据；后现代的指向表现为对现代性、现代化的困惑质疑和价值反思，也表现为对现代伦理学方法的批判和扬弃。现代风险的研究面临诸多困境：风险事实与风险判断的困境、风险的当下与未来的困境、风险的个体性与公共性的困境等。由此，必然要求风险治理者作出有效而合理的伦理决策，从而超越风险本身，实现对现代风险的道德治理。


    风险治理最消极的一个现象是风险避免，即所谓“无为而治”“少做少错，不做不错”。


    风险社会的治理之难，是基于这种风险所具有的本体性不安全的本质及其衍生出来的种种特征。[\[1\]](#Chapter_6_3.xhtml#B4)也正因为风险所具有的诸多特征、表现与症状，使得我们对风险的预测、控制与治理有了可能性。而各种风险治理的困境与难题的洞悉与概括是有效治理的前提条件，它因此要求我们对风险社会治理的各种困境与解决路径有系统全面科学的认知和思考。


    困境之一：洞察风险。对风险的认知要分两个层面：第一个层面是对风险本质有基本的认知和理性的思考。贝克与吉登斯等的风险社会理论均认为，工业文明与现代化，同时都会孪生其风险，风险本质上是现代化与生俱来的另一面。从这个意义上而言，风险永远不可能被完全认知，而且科技进步与潜在风险的缺口在实践中永远打开着。因为，科技进步是工业文明与现代化直接追求的结果，风险是衍生的，衍生总在原创后，即使紧跟着原创，也常常被忽略。所以，对现代化可能孪生的风险要有预先的思考与准备。第二个层面是，风险既有可预测的、实在的、可计算的、明面的风险，也有暗藏的、潜在的、未来的、难以确定的风险。即使是明的风险，认知也不是那么容易。而潜在的、未来的风险，就更不能显而易见地被认知，它不仅需要一个过程，更需要知识、智慧和技术。而且，明的或暗的风险并不是那么泾渭分明地存在，而是胶结在一起，甚至还有仍不能被现代人科学认知到的如量子纠缠般的其他风险。那么，如何去认知或明或暗的风险及寻找这条认知之路呢？若是不能科学地认知，那就谈不上治理。所以，风险治理的难度首先是认知之难。


    困境之二：风险鉴别。除了对风险有科学理性的总体认知和思考，还要具有对特定社会中的风险善于科学系统地概括与归类的能力。风险的表现与症候群林林总总，而要达到科学管理和有效治理的目的，就需要对五花八门的风险表象和表现分层级与种类进行科学、合理、清晰的归纳总结，形成纵横交错、覆盖面广的风险网络体系。然后，循着各自的网络线路追溯到风险源头，找到它们的症结所在，才有可能采取针对性的策略与措施。由于许多表象、表现或症状错综复杂，只有做出科学的剥离与归类，才能找到风险的真实源头。而其间的每一个环节都需要渊博的学识、高深的智慧、厚实的专业知识与精熟的专业技术及所有相关人员精心负责的精神与工作态度，同时更需要精熟风险知识的社会学家、思想家与全社会的协调与配合，个中难度由此可知。


    困境之三：风险管控。即提高应对风险的实际控制与有效治理的行动能力。这种行动力的考量是对整个社会主体无论是管理层还是普通公众的实践能力的考验，这里存在一个悖论。国民素质的高低、信仰的强弱、道德的高尚与沦丧等文化因素构成了风险强弱的重要元素，而这些元素又是影响风险的控制与治理能力的重要方面。其实，风险中的许多构成元素同时也是影响风险治理与规制能力的重要因素。科学认知、清晰分类、准确定位是有效行动的前提，而有效行动却受着其他许多因素的影响。因果关系的不断倒置转换，或者互为因果，也为行动增加了许多难度。这是治理与控制的行动力与实践能力方面的难度，也是对国家治理能力的考验。因此，风险的种种两面性构成了风险的治理之难。


    困境之四：决策协同。在风险决策、治理过程中，决策者、技术专家和公众之间会产生冲突，如何去平衡所有参与风险治理决策的参与者对决策的影响力是风险治理的核心困境之一。贝克认为，在风险社会决策非常重要，它更需要决策者能够充分利用法律与系统工程技术、自然科学、社会评估机制等工具，将风险与威胁纳入预警与防范体系加以规范，形成一种生态民主政治。


