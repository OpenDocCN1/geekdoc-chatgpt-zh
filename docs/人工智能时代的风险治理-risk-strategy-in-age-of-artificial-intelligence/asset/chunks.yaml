    （七）中国政府指数自启动机制


    指标权重赋值通过调研结合统计方法确定（如偏最小二乘法）。权重值在不同的社会情景下的取值是不同的。社会情景分为一般情景和特殊情景。一般情景是指社会运行正常情况下的情景，特殊情景是有突发事件时的情景。在不同的业务环境下，权重的取值是不同的。


    通过风险事件发生形成的事件触发和监督使用指标的阈值达标或触发，实现治理协同工作流程自动激活，并启动协同动作的智能分发机制。当社会出现突发风险和危机事件时，相应指标体系能就敏感事件作出反应，并自动预警及启动相关政府作业流程，协调政府部门应对风险，对政府部门的任务完成具有重要的意义。


    （八）自启动协同


    对发生事件按照问题进行分类，这个过程需要对过去事件进行聚类分析，然后对当前问题通过语义分析得到其特征，把事件分类到相应治理协同类别中。类别和职能的匹配是通过解读相关法条和规则进行的人工匹配，而这些职能在法条或三定方案中已经有了解释，分拆后建立起指数与部门的映射关系，这样就能实现自启动任务的精准分发，也为绩效考核和履职能力评价以及督察督办等业务场景应用提供支持。


    ## 9.5 中国政府指数的动态发布体系


    （一）中国政府指数网站板块设计


    （1）实时指数：包括动态展示各级指数，指数信号预警，任务自启动，作业协同，部门督考评价。


    （2）报告发布：报告下载列表。


    （3）CGI介绍：CGI体系介绍，指数说明，指数实现方法、数据来源。


    （4）合作参与：政府机构、科研机构、企业参与方式介绍、数据合作，开放指数合作。


    （5）CGI专家委员会：CGI智库体系结构、常设机构。


    （6）发布动态：CGI相关研究动态、有关会议动态、发布动态。


    （二）管理模式及网站发布路径


    日常的数据分析由数据分析体系根据业务模型，通过大数据体系生成中国城市指数的相关指标、排序等，并由相关机构和人员审核后发布。


    （三）CGI任务协同技术体系


    中国政府指数网站架构共分为五个层次，分别为资源层、指数计算层、用户服务层、应用调度层、信息交互与展示层。


    资源层提供了服务系统的基础设施资源，包括计算资源、结构化数据库、非结构化数据库以及政务指数数据源。


    指数计算层调用资源层中的计算资源的多个计算节点，利用分布式框架处理政务指数数据源数据，经过计算后存储到非结构化数据库中，包括指数更新模块、守护线程模块。


    用户服务层调用资源层结构化数据库存储的用户数据，完成相应的用户服务内容，包括用户管理模块、路径管理模块和数据缓存模块。


    应用调度层接收信息交互与展示层发送的各类用户请求，调用指数计算层以及用户服务层，完成用户请求，同时将请求结果反馈给信息交互与展示层，包括指数数据获取模块、用户数据获取模块、服务请求接收与分发模块。


    信息交互与展示层提供用户基于地图的指数信息的实时展示，进行指数信息的管理，该信息交互与展示层包括指数发布服务模块和二级、三级指数展示模块。信息展示模块包括各类发布段的动态展示、实时展示、区块展示、路径展示等。


    ## 9.6 中国政府指数的未来


    第一，建设城市治理自启动机制和工具包。自启动机制和工具包是基于政府指数的、以最小政务单元为工具的政府智慧化响应和作业的机制和工具，具有在不触及政府现有规章制度前提下，彻底改变政府作业状态和运行机制、丰富政府资源、提高政府响应能力、优化政府组织和人力资源调配等功能。


    第二，发展和完善电子政务服务业务体系。电子政务服务化是电子政务建设和应用在经历了产品阶段、项目阶段后，因应目前阶段社会经济和市场、技术发展水平的新一代电子政务的建设和应用模式。新一代电子政务以对政府用户的市场化“服务”为中心，强调电子政务服务提供商对政府及其工作人员的作业的资源、工具、数据和智慧的支撑及其相应的服务，形成电子政务基础设施、技术、运维等物质性、技术性内容的市场化与政府治理、公共服务和政府自身管理的政府专业化的二分结构，从而走出一条具有前瞻性、因应我国政府能力发展和绩效发展的新道路。


    第三，实现政府大数据线上线下融合落地。政府掌握大量的数据，以中国城市政府指数为主要内容的新一代电子政务建设和应用会积累大量的数据。在政府数据极大丰富的情况下，如何运营政府大数据，使政府大数据释放其社会和市场价值；如何整合社会、市场相关主体，实现基于政府数据的政务服务、社会服务和市场服务的交汇和融合，为公众创造更多的社会福利和市场收益，成为政府大数据领域即将面临的课题。政府大数据线上线下融合落地的技术和市场体系建设正是对这一问题的破解。其主要实现方式是充分利用政府大数据，建立与政府的良好关系，逐步整合社会、市场相关主体，实现基于政府大数据的政务服务、社会服务和市场服务的融合创新，使政府对社会福利、民生服务等的投入能够发挥更大的价值。


