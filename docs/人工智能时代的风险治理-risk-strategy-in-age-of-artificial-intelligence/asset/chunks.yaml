    ## 8.1 数据泄露与网络安全挑战


    互联网最新技术的发展，既会带来便利也会带来麻烦，而数据泄露显然是企业和监管者必须要面对的难题。大量个人隐私数据泄露在互联网上已成为普遍现象，甚至还会有敌对势力利用这些数据来展开攻击。世界互联网的发展，使信息流动突破了时间与空间的限制，模糊了国家领土边界，对网络安全和主权安全构成挑战。大数据时代，网络安全屏障的脆弱性凸显，引发了各国对安全领域的新关切。


    英国《卫报》等媒体曾曝出重磅消息，英国数据分析公司 Cambridge Analytica 在未经用户同意的情况下，利用在 Facebook 上获得的 5000
    万用户的个人资料数据，来创建档案，并在 2016 年美国总统大选期间针对这些人进行定向宣传。可见，数据泄露及不当使用，不仅对个人造成困扰，还会挑战国家网络安全，造成更为严重的社会后果，给国家安全带来损害。


    ## 8.2 虚拟经济乱象引致重大系统性风险


    ### 8.2.1 虚拟经济的理论溯源与基本内涵


    虚拟经济是相对实体经济而言的，是经济虚拟化（西方称之为“金融深化”）的必然产物。经济的本质是一套价值系统，包括物质价格系统和资产价格系统。与由成本和技术支撑定价的物质价格系统不同，资产价格系统是以资本化定价方式为基础的一套特定的价格体系，这也就是虚拟经济。由于资本化定价，人们的心理因素会对虚拟经济产生重要的影响，也就是说，虚拟经济在运行上具有内在的波动性。广义地讲，虚拟经济除了目前研究较为集中的金融业、房地产业，还包括体育经济、博彩业、收藏业等，虚拟经济发展过度将会带来泡沫经济。


    “虚拟经济”一词，出自马克思的《资本论》，是马克思用来论证资本主义必然灭亡的理论之一。马克思认为，虚拟资本是在借贷资本和银行信用制度的基础上产生的，包括股票、债券等。虚拟资本可以作为商品买卖，可以作为资本增值，但本身并不具有价值；它代表的实际资本已经投入生产领域或消费过程，而其自身却作为可以买卖的资产滞留在市场上。虚拟经济就是从具有信用关系的虚拟资本衍生出来的，并随着信用经济的高度发展而发展。


    《博弈圣经》著作人给虚拟经济下了一个定义：犹如看魔术大师让一群狗争夺一块骨头，让众人押注的赌博游戏。


    国内对虚拟经济的研究是从 1997 年东南亚金融危机以后开始的。奠基之作是刘骏民教授于 1998 年出版的《从虚拟资本到虚拟经济》。


    ### 8.2.2 虚拟经济的五大核心特征


    虚拟经济风险是指与虚拟资本以金融系统为主要依托的循环运动有关的经济活动，简单地说，就是直接以钱生钱的活动。虚拟经济起到资本有效配置的作用，资本流动的国际化使得资本可以以更大规模和更快的速度在全球范围内流动，一方面便于企业、政府、机构在更大的范围内融资，另一方面也便于投资者在全球范围内选择投资项目，实现更高的投资预期追求。当代经济金融化和金融全球化事实说明：虚拟经济已经逐步取代实体经济成为经济运行和发展的主流。


    虚拟经济是市场经济高度发达的产物，以服务于实体经济为最终目的。随着虚拟经济迅速发展，其规模已超过实体经济，成为与实体经济相对独立的经济范畴。同时，与实体经济相比，虚拟经济具有明显不同的特征，主要表现在以下五个方面：


    1.  **高度流动性**：虚拟经济是虚拟资本的持有与交易活动，只是价值符号的转移，正是虚拟经济的高度流动性，提高了社会资源配置和再配置的效率，使其成为现代市场经济不可或缺的组成部分。

    2.  **不稳定性**：虚拟经济自身具有的虚拟性，使得各种虚拟资本在市场买卖过程中，价格的决定并非像实体经济价格决定过程一样遵循价值规律，增加了虚拟经济的不稳定性。

    3.  **信息不对称性**：受现行财务会计制度及公共政策的制约，真实信息由实体经济领域向虚拟经济领域提供的激励机制不足，导致与虚拟经济相关的信息供给不充分，这就为信息在不同的投机者之间不能公平分配埋下了隐患。个体投机者鉴别真实信息的能力不强，信息的发掘不到位、不专业、不经济，再加上个别投机者对信息的恶意歪曲，信息在交易者之间呈不对称分布状态。

    4.  **高风险性和高投机性**：随着虚拟经济的快速发展，其交易规模和交易品种不断扩大，使虚拟经济的存在和发展变得更为复杂和难以驾驭，虚拟资本投资成为一个风险较高的投资领域，尤其是随着各种风险投资基金、对冲基金等大量投机性资金的介入，加剧了虚拟经济的高风险性。

    5.  **政策性或制度性风险**：电子技术和网络高科技的迅猛发展，巨额资金划转、清算和虚拟资本交易均可在瞬间完成，这为虚拟资本的高度投机创造了技术条件，提供了技术支持。同时，越是在新兴和发展不成熟、不完善，市场监管能力越差的市场，防范和应对高度投机行为的措施、力度越差，虚拟经济越具有更高的投机性，投机性游资也越容易光顾这样的市场，达到通过短期投机、赚取暴利的目的。虚拟经济活动是以信用保证产权交易的顺利进行的，但其与国家宏观经济政策高度的相关性使得虚拟经济必然面临政策风险。从目前的情况来看，虚拟经济遭遇的最大风险来自政策风险。


    ### 8.2.3 虚拟经济风险的识别与分析


    在经济活动中，风险通常是指人们预期的收益与实际收益之间的差异，这种差异既来自客观世界的不确定性，也来自人们对客观世界认识能力的局限性。在分析虚拟经济风险时，必须充分考虑到金融市场主体的决策行为，特别是非理性的行为。


    任何风险的出现都会有预兆，通常某些指标数据异常或表现异常，风险预警系统就根据一定的原则捕捉到这些异常。需要通过两方面的工作来实现风险情报的辨识：一是定性分析，即通过对有关项目从决策到运营等业务特征的定性描述判别；二是定量分析，即通过风险预警指标体系的指标来确定风险是否出现。


    ### 8.2.4 中国虚拟经济的乱象与反思


    2014 年夏季的达沃斯论坛上，李克强总理提出“大众创业、万众创新”的号召，几个月后，又将其写入 2015 年政府工作报告予以推动。“双创”之下，互联网企业获得大力发展，`O2O`
    等项目空前壮大，以 `P2P` 为代表的互联网金融也相继崛起。这是中国虚拟经济的黄金时期。以“互联网+”为代表的虚拟经济让沉寂已久的中国经济有了难得的亮色。与此同时，金融行业也伴随着于
    2014 年开始的大牛市，开始了一场轰轰烈烈的“加杠杆”跨越式冲刺。可惜快乐永远都是短暂的。e租宝骗局及层出不穷的 `P2P` 爆雷、跑路事件，让互联网金融行业整体被舆论打翻在地。“2015
    年牛市见顶之后的资本寒冬，又让不少人质疑‘双创’是否只是播下龙种，收获的却是跳蚤。”[^1] 李克强也在政府工作报告中指出，促进金融机构突出主业、下沉重心，增强服务实体经济能力，防止脱实向虚。在民众眼中，代表虚拟经济的互联网行业是烧钱游戏，金融业则是资本游戏。谈虚色变，谈实则喜。


    “虚假经济是以欺骗或者庞氏骗局为基础，为少数人获利而服务的，无论是实体经济，还是虚拟经济，都存在虚假经济。”经济研究领域学者郑方说。


    “虚拟经济是以信用为基础，为实体经济服务，如果虚拟经济不是以信用为基础，不是为实体经济服务，那么它就会变成一个虚假经济。这个虚假经济就像实体经济里的假货一样，是需要政府监管和控制的。”郑方说。郑方认为，所谓的“脱虚入实”，脱的虚应该是虚假经济，而不是虚拟经济。无论是实体经济还是虚拟经济，都会有虚假经济，这是国家需要去防范、去打假的。无论是实体经济中的假药、假包，还是虚拟经济中的假钞、假账，这些都是需要去防范的。“现在大家一说脱虚入实，就变成不能搞金融不能搞互联网了，那是不对的，虚拟经济是对实体经济的一个有效的补充和服务。”郑方说。一刀切式的“捧实踩虚”只能导致一个结果：没有了为实体经济服务的虚拟经济，实体经济的发展将愈发艰难。“消除对虚拟经济的误会是关键，正确对待实体经济、虚拟经济及虚假经济三者之间的关系更是当务之急。”


    ### 8.2.5 虚拟经济风险预警体系的建设


    建立虚拟经济风险预警系统，应把握好资金流向和流量等核心指标，才能建立合理有效的风险指标监测体系，增强对风险的感知能力和免疫能力，提升重大系统性风险的防范和化解能力。


    ---


    [^1]: 36氪：《虚拟经济成了全民公敌，这样真的好吗？》, `https://36kr.com/p/5067268`。


    ## 8.3 媒体娱乐化倾向引发舆论安全风险


    ### 8.3.1 典型案例：PG One 事件与“紫光阁”风波


    嘻哈歌手 PG One 因李小璐夜宿风波受到较高关注，其发布的作品引发权威媒体批判，中共中央国家机关工作委员会机关杂志《紫光阁》、共青团中央官微、《人民日报》、新华网等媒体批评其歌词低俗、教唆吸毒、侮辱女性。没想到，PG
    One 的疯狂粉丝们却发起反击，子虚乌有的“紫光阁地沟油”标签就这么上了微博热搜榜。“紫光阁”被 PG One 粉丝误认为饭店，买错热搜了，于是“微博热搜”上了热搜。围绕“舆论操控”的话题持续受到关注，知乎刘空青连载“杨幂唐嫣大战”引爆话题，也让网民看到明星操控舆论的乱象。


    娱乐资本操控网络舆论，已经成为普遍且严重的社会现象，无论是制造谣言、花钱买热搜，还是豢养水军、搞霸凌，舆论遭遇操控的现象时隐时现，混淆是非、颠倒黑白、绑架舆论，倘若“紫光阁”真是一家饭店，不知能否抵挡误伤。面对娱乐资本的操控行为，政府部门必须加强监管，营造清朗的网络空间。


    ### 8.3.2 娱乐资本操控网络舆论的五大手段


    梳理近年来娱乐领域各类现象可知，娱乐资本对网络舆论的操控可谓“无处不在”，这些操控有些是对明星热度和形象的维护，有些则直接反制对冲主流权威声音，主要表现为：


    1.  **制造各类话题**：通过娱乐资本助推炒作和操控粉丝，来提升话题热度，获得较高曝光度，持续维持自身话题性和热度。随着微博热搜产业链曝光，这类暗箱操作也成为“明规则”，如此操控致使娱乐圈炒作盛行，明星和娱乐资本的利益得到维护。

    2.  **打压舆论**：利用娱乐资本和粉丝力量，来对影响自身形象的负面舆论进行打压，粉丝对批评者进行肆意攻击，不惜造谣抹黑，导致围观者也逐渐被“带偏”，最后逼得批评者不敢多言。明星利用自身影响力开展网络霸凌的现象也时常出现，特别是流量明星，批评他们的风险较高。

    3.  **操控民众认知**：娱乐资本必然追逐利益最大化，这包括对自身利益的维护、与对手展开博弈，甚至不惜造谣、抹黑、诋毁其他明星。在社交媒体平台上，围绕影视作品展开的讨论时常呈现“非理性”状态，优秀作品被黑、劣质作品受捧的乱象偶有发生，市场环境受到影响，社会舆论也遭遇严重干扰。

    4.  **对冲权威声音**：在主流宣传重要节点，明星相关话题受到热炒，不少网络媒体和新媒体参与进来，形成舆论热潮，对主流权威报道形成强烈冲击，甚至让主流声音难以充分传播，这类现象值得警惕。

    5.  **反制主流言论**：对于涉及明星的负面报道，娱乐资本和粉丝们会采取措施补救，甚至调动各类资源开展反制，部分主流媒体和新媒体甚至都会受到操控，参与到反制中来，“赵薇用台独分子担任主演”事件引发的论战，就是典型的娱乐资本与主流认知展开的对决。


    当然，娱乐资本操控网络舆论的方式还有很多，资本对社会领域的渗透可谓无孔不入，随着不少娱乐资本背后的力量更为强大，舆论被操控的风险也在随之增加，操控方式也会更加隐蔽。娱乐资本操控网络舆论，无疑会给社会治理带来负面影响，由于娱乐资本背后的势力相对隐蔽，其操控舆论带来的风险不容小觑。


    ### 8.3.3 娱乐资本操控舆论的七大表现及危害


    其表现及危害如下：


    1.  **网络乌烟瘴气，舆论对攻加剧社会撕裂**：对于明星言论和作为，舆论本应该有相对统一的判断，然而，由于娱乐资本的介入，部分明星的“黑料”反而能够得到舆论支持，他们甚至以挑战社会伦理底线为荣。资本的强势干预和误导，让“后真相”的影响日益显现，粉丝们在情绪的带动下，甚至认不清是非黑白，对于偶像盲目崇拜支持，非理性的粉丝和理性的网民时常在社交媒体上“互撕”，宣泄不良情绪，导致网络空间乌烟瘴气。

    2.  **不问真相正义，网络霸凌破坏舆论生态**：部分粉丝在娱乐资本的操控下，已经失去判断能力。倘若有网民指出明星的问题，可能就会遭遇粉丝的舆论围殴，人身攻击在社交媒体上比较普遍。粉丝对偶像开展狂欢式应援，花钱买热搜，在偶像遭遇负面评价时，不惜买“水军”怼网友，开展网络霸凌，让正直理性的网民不敢说话，背后则有舆论资本的煽动和支持，这严重破坏了舆论生态，让网络言论更加极化，网民更加偏激。

    3.  **干扰认知判断，媒体平台成为资本帮凶**：“紫光阁地沟油”本身滑稽不堪，但却能在粉丝推动下，进入大V的视野并获得助推，成功成为热门话题。这表明，资本所到之处，部分媒体平台依然沦为帮凶，失去了基本自净能力，或者根本就没有过滤的功能设置。社会舆论和情绪受到严重干扰，资本成功颠倒黑白，社会情绪的浮躁焦虑、民众认知的简单疏浅，都成为资本疯狂干预操控舆论的助力。

    4.  **操控经验娴熟，潜在风险加剧治理难度**：明星受到娱乐资本控制，成为变现的工具和载体，而粉丝则逐渐成为资本维持良性运作的重要舆论力量，如同资本手里的提线木偶。部分明星即使出现负面新闻（道德危机、违法犯罪），也能在娱乐资本的操控下，让粉丝继续支持他，这种精神操控的手法已经非常娴熟。娱乐资本时常操控舆论，经验成熟、资源丰厚，这对于网络管控和社会治理，都是极大的挑战。

    5.  **消解权威声音，泛娱乐化冲淡主流宣传**：倘若娱乐资本操控舆论仅是为了商业目的，加大行业管理整顿，强化对媒体平台的整治管控，可以让娱乐资本消停下。近年来，泛娱乐化风潮对主流宣传的冲击，却可窥见，娱乐资本背后的力量更值得关注。资本很难改变其逐利本质，即使在关系到国家安全和意识形态的领域，利益的最大化依然会是它的终极目标，在利益博弈面前，资本有时会铤而走险，对冲主流宣传。更有甚者，境外资本可能会参与炒作消解权威声音。

    6.  **对抗主流意识，调用各类资源展开反制**：伴随互联网产业的快速发展，民营资本和境外资本（包括娱乐资本）对网络媒体和新媒体行业施加强大影响，资本利用资金、技术、管理等优势，促进媒体平台快速发展，也对这些媒体进行渗透。资本平时可能不会过多干预媒体运营，但在涉及自身利益时，就会依靠其影响力，操控网络舆论，甚至不惜雇佣水军发帖、删帖……资本的强力介入使得真相更加扑朔迷离，噪声、杂音盖过主旋律，甚至为维持利益，不惜对主流意识开展讨伐对攻，成为某些势力的帮凶。

    7.  **操控日益频繁，资本干预舆论逐步强化**：反观娱乐行业的发展，娱乐资本的介入越来越深，无论是明星包装炒作，还是娱乐产品的宣发推广，几乎都有娱乐资本力量的助推，而这些资本力量对于社会舆论的操控能力也在日益强化。比如电影《无问西东》，其投资方就宣称，电影获得口碑票房双逆袭，除《无问西东》本身出色的质量外，和主投方企鹅影视的努力及其背后腾讯的助力是分不开的，企鹅影视不断整合业内优质资源，更是争取到了诸如腾讯新闻头条、腾讯视频全平台支持等珍贵的资源，由此可见，资本力量对舆论的干预和操控已然比较强大，不仅仅停留在新媒体层面，宣发如此，开展反制时更是如此。


    娱乐资本所依托的资本力量日益强大，各类利益关系错综复杂，操控网络舆论带来的社会危害日益显现，面对站在暗处的资本力量，如何开展社会治理以逐步净化网络舆论环境呢？


    ### 8.3.4 净化网络舆论环境的五项治理对策


    1.  **加强行业自律，完善规则管理制度**：媒体报道显示，花钱购买微博热搜已经成为舆论炒作的常用手段，不仅可以依托第三方渠道，还可以直接向微博官方购买“热搜推荐位”，明码标价。其实，微博热搜榜与百度搜索盈利模式基本一致，这样虽能带来收入，但和百度类似，会面临较大隐患，审核疏忽会沦为作恶工具。这就需要社交媒体平台加强自律，能够吸取负面教训，在与娱乐资本合作的同时，能够完善热搜榜规则和管理制度，不能过度追逐利益，破坏清朗积极的网络环境。

    2.  **及时介入监管，管控治理网络乱象**：网络社会治理不能只靠行业自律，监管部门必须及时介入，加强行业管理，对于花钱买热搜的乱象进行强力管控治理，对典型案例必须要求整改。娱乐资本对网络舆论的操控，主要通过网络媒体和新媒体展开，对于这些媒体平台存在的管理乱象，只要查实就要积极处置，避免舆论操控给社会造成严重伤害，加强对媒体平台的引导，提醒其不要漠视社会责任。同时，对于盲目“蹭热点”并且发布猜测、煽动言论的自媒体，也应该持续强化管制。

    3.  **提升认知能力，引导民众理性思考**：看到网络热点话题，自媒体都会疯狂跟进，而多数网民难有理性判断，只会一味盲从，被娱乐话题裹挟甚至利用，“沉默的螺旋”在社交媒体上更加明显，理性的反对声音很难得到响应，甚至会被“群攻”，热点话题能够轻易实现对舆论的绑架，娱乐资本稍微发力，就能让“热点”为己所用。面对娱乐资本日益频繁的操控，主流权威机构和媒体理应参与引导，逐步培养网民理性思考的习惯，对部分热点敢于质疑发声。唯有逐步提升网民的认知能力，鼓励网民理性思考，形成良好的舆论探讨氛围，才能帮助网民增强“免疫力”。

    4.  **健全法律法规，原则问题不容挑战**：面对主流舆论的谴责和讨伐，娱乐资本为维护自身利益，甚至不惜动用各类媒体资源和社会力量参与“对攻”，甚至在国家安全和意识形态领域也不示弱，坚持错误的认知和态度。这就需要政府部门健全法律法规，完善网络社会治理相关法律规定，对于敏感危险言论要及时予以肃清，并且对支持错误观点态度的媒体平台进行整治，加强网络信息监管，原则问题不容挑战。

    5.  **扶持权威媒体，形成强大抗衡力量**：自媒体的兴起，舆论泛化逐渐模糊公共领域和私人领域的界限，每个人手里似乎都有话语权，但要真正在社交媒体平台形成影响力却并非易事，想要“设置议题”则几乎不可能，话语权主要掌握在“网络大V”和营销账号手里，而他们的话语权又几乎掌控在娱乐资本手中，资本对自媒体的操控显而易见，而网络媒体和自媒体离网民很近，他们掀起的舆论狂潮给社会治理带来较大压力。这就需要加大对权威主流媒体的投入，让他们在网络空间更有话语权，离网民更近，在主流宣传、舆论引导和论战对攻时，能够成为抗衡娱乐资本的强大力量。


    ## 8.4 区块链技术应用的机遇与挑战


    ### 8.4.1 区块链的发展及应用


    区块链本质上是一种 `distributed ledger`（分布式记账）技术，被认为是确保数据储存安全的最新方式。它不是将数据存放在一个中心化的地方，而是将其分布式地存储在网络节点中，每个节点都保存了整个区块链的全量数据，并同时使用强大的加密算法和协议组合维持交易产生和创建。


    区块链的概念源于 2008 年，由署名为中本聪的人在《比特币，一种点对点的现金支付系统》中提及。2009 年诞生了第一枚比特币，这也被称为区块链技术的 1.0
    版本，即主要作为一种算法机械式生产和去中介化的全球化加密货币，是区块链最基本的应用，和数字现金有关，主要应用于代币发行、转账汇兑、支付、票据电子化等，但因其缺乏扩展性，无法满足用户构建更高级的应用。


    2013 至 2014 年，`Ethereum`（以太坊）出现，也就是区块链技术的 2.0 版本，它仍然依靠代币—`Ether`（以太币）运行。`Ethereum`
    构建了一个开源的有智能合约功能的公共区块链平台，具有可扩展性。`Ethereum` 网络为实现不受任何限制和去中介化的全球化价值流动提供了可能，`Ethereum`
    充当替代中心权威的一个信任机制，各种行业应用落地，对新闻和信息的生产、发布和消费有着特别的价值。


    在这些技术基础之上，区块链技术将逐步向 3.0 版本演进，逐渐开启了它超越金融的应用，类似于 `ICANN`、`DNS` 类国际化、非主权管理组织。区块链在政府管理、医疗健康、科教文卫等领域实现一种去中心化自治社会（`DAS`）。而区块链技术匿名、去中心和多元参与的新特征使得在区块链条件下的社会形态变得更加复杂，且难以把握。


    当前，区块链广泛应用于资产发行、支付汇兑、存证征信等各个方面。相关应用场景主要包括加密货币发行、租赁和拼车、银行清结算和支付、整合通信、众筹和慈善捐赠、医疗保健等。区块链的广泛应用，将有可能对当前的互联网应用产生颠覆性的影响。

