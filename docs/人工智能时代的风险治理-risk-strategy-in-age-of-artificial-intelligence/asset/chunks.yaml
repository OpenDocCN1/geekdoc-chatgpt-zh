- raw: '风险演化为危机的概率是一个十分复杂的社会学和系统学问题。这里做一个抽象性的假设：“风险-危机”之间具有函数关系，可以用数学方法计算风险演化为危机的概率。可用“贝叶斯法”和“海因里希法”估算其概率。“贝叶斯法”又称条件概率法，是描述两个条件概率之间关系的方法，即从一件事的概率推导另一件事的概率。数学模型为：后验概率
    =（似然度 ×先验概率）/标准化常量。


    传统舆情面临从对事件“过去式”的解构到对正处于“将来时”的事件的预演和分析，面临从“开化验单”到出“处方”开药的转变。


    传统舆情系统以及基于传播学数据特征分析而做出的网络风险决策的单一性和局限性主要表现在以下几个方面：


    （1）社会风险和网络风险的复杂性，决定了单一风险源或基于单一事件数据的维度分析并不能体现风险的综合性和交叉性特征。事实上，许多风险之间是存在关联关系，并相互推动，相互作用。


    （2）社会风险矩阵的形成是一个模糊和混沌的发酵过程，其中的显性风险因子与隐性风险因子经过复杂的互相作用而导致或推动某一个风险的出现，从某种意义上说，对风险预警是一个不断学习和提升算法优化预测结论的互动过程。


    （3）风险传播中的外缘因子和内部因子的扰动性和不确定性最终导致风险的预测具有不可知性。


    （4）无法满足风险治理专家的经验及数据化特征对机器单一事件处理流程的参与和对预警的重要支持，也不能有效发挥或借鉴专家和风险处置的成功经验。换句话说，专家经验无法在传统舆情管理体系当中表现，亦无法与现有的舆情系统体系进行某种有机的融合。


    （5）对风险未来趋势的量化和特征分析依然存在算法能力支持和深度神经网络算法的支持。尽管目前的舆情管理体系已经在某些分析场景下使用了机器学习，但远远不够。


    （6）模拟人类思维决策过程的复杂网络算法还非常不成熟，仍有待大力提升。


    （7）对重大风险事件或重大决策的前置风险评估和研判依然缺乏系统的支持。前置风险预警及研判已经成为社会风险治理的重要思想，这个流程已经为相关法律规章制度所规范。


    （8）缺乏对风险情报的认知思维，以及基于风险的外部动力机制考量，导致对风险的研判支持能力严重欠缺。


    舆情思维弱化并制约了全社会对风险的认知能力和感知能力，在这种传统分析方法和应对思维的禁锢下，社会只注重眼前的困境，而对来自未来的更大更多的风险或危机视而不见。


    ## 5.9 突发性网络风险事件治理的必要性和紧迫性


    新媒体时代的到来，每一个个体、组织都成为信息的发布者和传播者，QQ、微信、微博、知乎等网络社交软件和平台的兴起加快了信息传播的速度、拓宽了信息的传播渠道、扩大了信息的传播范围，极易产生蝴蝶效应。网络中的肆意报道和传播严重影响网民认知和判断，引发公众和政府之间的矛盾，从而损害政府形象和破坏社会稳定的虚假新闻、恶意谣言、煽动性言论，暂可称为负面舆论。近年来受到广泛关注的突发事件中，“后真相”越来越深地介入社会热点事件，多次呈现出真相坍塌、情绪主导的状况。随着社会主义民主政治的发展，公民的权利意识不断觉醒，而社会转型的时代背景下矛盾又不断加深。因此，突发事件的出现会引起社会公众的广泛讨论，在当今复杂的网络舆论环境下，碎片化信息、谣言和非理性言论极其容易引发民众的负面情绪，损害政府公信力，激化公众与政府之间的矛盾，甚至成为社会危机的导火索。因此，如何对新媒体时代下突发事件的负面网络舆论进行治理，是政府必须探讨的一个重要议题。


    新媒体环境下，信息传播和社会舆论生态都发生了巨大的变化，高速传播的信息和自由开放的舆论空间给政府治理带来严峻的挑战。先进的信息技术可能对突发事件起到“推波助澜”的作用，使得突发事件愈演愈烈。面对“流言蜚语”，一旦权威信息源失去力量，民众又没有足够的信息辨别能力，就极易接受社交平台散播的情绪和偏见，形成与事实相去甚远的判断，把毫无根据的主观臆断当成事实，最后情绪主导下的“真相”成为多数网民的共识，舆论很有可能被带偏，甚至与政府发布的权威信息成为对立面，严重影响政府的形象和公信力，因此要正确应对网络负面舆情，努力破解舆论治理困境，营造一个健康、稳定、和谐、安全的网络舆论生态环境。


    （一）当下社会负面舆情的特点


    1．突发事件频发，“灰犀牛”风险不断加大


    近年来，我国各类突发风险事件频发，无论是自然灾害，还是安全事故，抑或是民生问题中的“黑天鹅事件”，任何一种突发事件的爆发都给人民群众的生命财产造成了极大的损害。突发事件每次出现都引发社会心理的剧烈反应，政府危机决策和舆论治理一旦不能得到民众的正确解读，群众的负面情绪就会爆发。长时间下负面情绪的叠加和积聚将会加深民众的不安全感和对政府的负面认知，最后一件小事都有可能引发社会危机。其实，许多危机事件在爆发之前已有迹象显现，“灰犀牛”已经朝我们狂奔而来，却总是被我们忽视。当下我们处于社会转型发展的关键时期和社会矛盾的凸显期，负面舆论极易演变为舆论危机，甚至引发社会危机，因此“灰犀牛”风险不断加大。


    2．公民关注度越来越高，易被利益团体操纵煽动


    随着我国社会主义民主政治、社会经济和互联网技术的发展，人民更加充分地运用知情权、表达权等权利，因此突发事件的发生必然伴随着舆论热潮的出现。同时，新媒体时代的到来，信息从传播速度、传播渠道、传播范围都有了时代性的发展，公民对突发事件的动态和发展也更为关注，对信息的需求量不断增加。但是，一些新闻媒体和其他利益团体在利益驱动下，散播极具煽动能力的谣言、虚假新闻和碎片化信息，煽动、利用和操纵民众。在事件发生的紧急处置时间和关键节点，制造谣言、包装事实就会引起民众的负面情绪，舆论也就更加容易被操纵。被操纵的网络舆论被负面情绪笼罩着，尽管自己的判断依据都来自一些碎片化的信息，民众仍然相信自己的判断是正确的，而不愿去相信政府发布的权威信息，甚至与政府处于对立状态，造成的负面效应越来越明显。


    3．情绪对抗和群体割裂湮灭真相，危害社会公共安全


    后真相时代的到来，突发事件的舆情状况总是事实坍塌，情绪主导。民众对待热点舆情的态度并不是理智寻找事实，而是在碎片化的信息中寻找观点认同和情感安慰。一旦政府危机决策被误解，情绪对抗则会更加激烈。


    当下热点事件网络舆论场的一个明显特点就是“立场决定态度，态度决定事实”。种族、行业、观念、信仰等因素逐步将社会分裂成不同的利益诉求团体，他们都拥有鲜明的立场和观点。同时，官民舆论场分野也在加速进行，官方发布的权威信息往往被自媒体等民间言论摧毁，民间舆论场对于主流声音多持质疑态度。网络中各种声音合流，民众的情绪将更加极端，留给理性思考的空间不断缩小，权威媒体和政府部门的声音难以获得关注。民众负面情绪长期得不到缓解，就会引发民众对政府的敌对心理，加深社会矛盾，不利于社会的和谐稳定，对社会安全造成极大威胁。


    4．政府陷入“塔西佗陷阱”，公信力下降，社会治理成本高企


    负面舆情事件的爆发如果不及时有效解决，负面影响将不断扩大。在焦虑、抵触等心理作用下，民众对权威信息和主流声音失去了信任，政府部门将在“塔西佗陷阱”中越陷越深。负面舆情长时间不能得到解决，社会价值观和社会信用体系都会有所偏离，政府在民众的形象和公信力也可能一落千丈，当政府形象和公信力受到损耗后，政府后续政策将难以推进，社会治理成本亦将会急剧上升。


    （二）政府应对突发事件负面舆情的治理困境


    随着网络信息技术的迅猛发展，网络舆情的传播源越来越多，也越来越难受控制。根据中国互联网中国信息中心统计报告，截至2018年12月，我国的网民数量突破了8.29亿，形成了一个庞大的网络舆论场，突发事件负面舆论一旦出现，会被论坛、微博、微信等现代传播媒体交叉、叠加式地疯狂转发，喷井而出，传播速度和范围是传统的传播媒体难以比拟的，容易造成“蝴蝶效应”。经济社会的快速发展，民众的参与、表达、监督等各种权利意识不断加强，对关乎国家和自身利益事件的关注度也越来越高，新华网发布的《2017年度社会热点事件网络舆情报告》显示，医疗卫生、人身安全、官民关系、教育公平、交通管理、社会保障、环境保护等事关生活质量和发展前景的热点话题，更能吸引网民的关注。突发事件的发生很可能就是问题的暴露，负面舆情的爆发很可能会使突发事件演变为社会危机。虽然政府采取了许多方式来应对负面舆情，但是传统理念、方式、主体和制度体系保障下的治理效率却不高，多多少少存在一些问题，因此政府需要从传统的管理模式的圈子中跳出来，对原有的舆论治理模式加以补充、完善和创新。


    1．政府对负面舆论的影响认识不够充分，缺乏风险防范意识


    网络舆论场的营造，打破了人们交流和沟通的时间和空间界限，带来了新的发展机遇，同时也引发了新的风险。后真相时代的到来，公众对新闻的需求偏好从事实偏好转向了价值偏好。马克·吐温曾说道：“当真理还在穿鞋的时候，谎言已经走遍半个世界。”在众声喧哗的网络时代，事实经过包装和篡改，早已偏离新闻报道的核心和初衷，增加了舆论危机乃至社会危机爆发的可能性。但是，一些政府部门和官员对于突发事件负面舆论的认识往往不够深刻，没有认识到负面舆论将会引发的社会危机，对负面舆论引发的风险防范意识不足，不重视突发性公共事件中负面舆论发挥的重要影响。领导干部缺乏网络舆情引导与疏导能力，凭借经验办事，缺少法治思维，面对负面舆论，既不愿意自己去处理，也不愿意培养专业的公关团队或专业人员，负面舆论从预警监测、干预控制、信息疏通等各个阶段的工作都没有清晰明确的分工，针对负面舆论引发的风险应对能力较弱。


    2．网络监管不到位，危机治理水平短板明显


    新媒体时代的到来，为民众营造了一个自由、开放、宽松的舆论环境，同时也造成了网络负面舆论的无尺度、无底线、无依据。“门槛低、获益高、责任小”的新闻生产和传播演化出了网络舆论的乱象。政府对网络的监管不到位，缺少制度规范和明显的法律界限，对网络上一些不负责任的负面舆论起到了“助长”作用，虚假、攻击、煽动、暴力性言论得不到约束、肆意散播。突发事件的社会关注度本就较高，公众的同情心理、认同心理、从众心理瞬间爆发，舆论场内的负面观点带有明显的情绪性、偏见性、煽动性，运动式的、粗浅的政府网络监管不能及时制止这些不实、不法的言论出现，容易引起民众的负面情绪甚至引发舆论危机。


    网络媒体的快速发展，使得政府对突发事件的应急管理更加透明地呈现于公众面前。突发事件涉及的部门往往比较多，部门间沟通、协调困难。我国突发事件应急管理缺少完善的部门协调机制，危机管理没有清晰的指挥链。关键时间内，政策的制定缺少理性进行的科学论证和风险预判，没有安全稳妥的行动方案。遇到突发事件采取错误的应对处置方式，可能带来更大的安全隐患，危害救援人员和人民群众的生命财产安全，因此容易引起网络的负面舆论狂潮，不及时进行政策调整和情绪疏导，很可能引发舆情危机事件。


    3．政府网络善治理念相对较弱，治理思维落后


    随着我国社会主义民主政治的不断发展，民众的权利意识更加清晰，但是有些地方政府仍然采取强制性的管理方式，强调政府权威，网络治理过程中缺少法治思维和善治理念。突发事件的发生，政府应该做出正确的决策并及时安抚民众。但在负面舆情发生后，面对各类负面信息、言论和部分谣言，尤其对于谣言和极端言论，某些相关政府部门的回应方式往往是不主动发声、避重就轻，甚至是信息封堵，缺少及时发声回应关切等方式的人文关怀，法治理念和服务意识相对比较薄弱。


    4．网络舆论治理主体单一，缺少民众参与


    在新媒体时代下，民众可以自由地表达观点，但这也有可能导致大量负面流言、谣言、虚假信息满天飞，如果不及时治理，很有可能引发社会危机。当今的网络舆论治理不仅仅涉及法治，而且还涉及人治，团结各界力量，凝聚人心已是负面舆论治理过程中一个不可或缺的关键因素。负面舆情治理过程中需要政府、企业、社会、个人多方参与，协同治理，但是目前，我国网络舆论的治理在传统“管制思维”的影响下，依然是以政府管理为主，社会参与不足。


    5．缺少完善的治理体制机制和法律体系


    地方政府针对网络舆论治理呈现出一种典型的模式就是“多头治理”，缺少独立、常设的机构来应对突发事件引发的负面舆论，无论是前期舆情监测的技术运用、中期回复引导能力的提升，还是后期舆情处置问责机制的建设，都还有较大的发展空间。传统的机制体制导致信息混乱、处理不及时、权力重复运用，公众对政府失去信任，最终造成治理效率低下。同时，网络空间不是法外之地，民众应为个人发表的言论承担法律责任，但是我国缺乏完善的法律法规体系约束民众的网络行为，无法避免恶意的谣言、流言和虚假新闻。


    （三）政府应对突发事件负面舆情困境的路径拓展


    网络作为承载大量信息的舆论场，治理工作量大，难度高。政府传统的网络管理方式已经不能应对突发事件负面舆论带来的影响。所以，政府应该顺应时代的发展，改变传统的思维模式，树立正确的治理理念，建立健全治理机制体系，从制度、机制、技术、方法等各个方面来实现对突发事件负面舆论高效的协同治理，消除网络负面舆情的不利影响，营造一个积极、健康的网络生态环境。


    1．正确理解后真相时代下的负面舆论，防范潜在风险


    后真相时代的到来，新闻丧失了其真实性，其对社会凝聚力和价值观的冲击需要我们去深思。《三国志》中提道：“明者防祸于未萌，智者图患于将来。”政府部门要正确感知危机，对于危机和潜在风险，要做提前预判，制定预案，做到防患于未然。全面理解“后真相时代”，对于公众的心态和网络技术的变革都要有清醒的认知，互联网技术的发展必然会给政府的治理带来越来越多的挑战，这几乎是不可逆转的。突发事件相关政策也要根据事态发展适时做出快速调整，避免风险发展成为隐患和危机。


    2．成立专门的应急管理部门，提高政府危机管理水平


    控制局面、防止危机只是突发事件应急管理的工作之一。对于突发事件发生的原因以及后续的发展，民间舆论场和官方舆论场有着很大的区别，民众的关注点与权威部门的主流媒体的关注点存在较大偏差。对于突发后续的发展和政府应急处置的方式稍有偏差就可能会引发舆论狂潮。因此，必须要成立专门的应急管理部门，提升政府的危机管理水平。为避免“一管就死、一放就乱”的治理困境，应当建立系统性的管理机制。加强中央与地方、不同职能部门之间的协调与沟通，各部门各司其职、各尽其责。针对舆情治理，建立专门的舆情治理机构，一方面大力发展舆情监控和处理技术，自动筛选带有“造谣”“煽动”等消极言论的IP地址，过滤掉不法、不实、不良的信息源，处置相关网络平台，实现对网络负面舆情的实时监管；一方面不断推动建立健全机构体系，从纵向和横向实现各方的协调与沟通，从而提高机构治理负面舆情的速度和效率。


    3．树立网络善治理念，由“管制”向“服务”转变


    中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。因此，政府要建立让人民满意的服务型政府。网络治理不仅涉及法治，而且还涉及人治。首先，随着公民参与、表达、监督等各项权利意识的增强，信息技术的不断革新，各种媒体的融合发展，应对突发事件舆情的方法不应再是“管制”，而应该是“服务”。避免采取突发、强制、管制的方式应对网络舆情，而应该采取长期、引导、服务的方式来治理网络舆情。政府应该转被动为主动，以人民为中心，建立一个公平公正、公开透明、廉洁高效的政府服务网络平台，打破政府与公众之间的信息壁垒，避免传统舆情治理当中的消极应对、视而不见、暴力删帖、信息封堵，运用各种现代智能化、信息化手段保证舆论信息的公开透明和政府与公众在舆论环境内关系的平等和谐，从而提高负面舆情治理的效率。党和政府必须加大投入，增加权威部门和主流媒体的话语权，以社会主义核心价值观为导向，做好价值宣传、思想引领和舆论引导，提升公众的网络素质，努力营造健康、稳定、和谐的网络舆论生态环境。


    4．增强社会参与，多元主体协同治理


    新媒体时代的到来，网络舆情无论是传播速度、传播渠道还是传播范围，都有了很大的提升，负面舆论一旦出现更像是洪水猛兽，短时间内难以控制。面对各种社会热点事件和问题，政府理应“开门”主动接受各方监督、听各方意见，创设更多渠道宣传和鼓励积极、理性的声音。只有“开门”，政府才能接触了解社会；只有“开门”，社会才能监督政府。政府要积极主动参与民意的形成过程，获得尽可能多的理解与支持，同时让更多民众能够参与到社会治理中来，一方面提高政务信息的公开与透明度，减少信息的不对称性，消除民众对政府不必要的误解，更重要的是通过社会的参与，弥补政府监督缺位、资源缺失、制度漏洞、技术不足等各种缺陷，通过吸引各种社会力量实现资源整合与功能互补，通过实现协同治理的方式来提高网络负面舆论的治理效率。


    5．建立完善的网络舆论治理机制和法律法规体系


    网络负面舆情的治理离不开高效的治理机制。通过建立完善的网络舆情监控预警机制、新闻发布机制、舆情处置问责机制来提升网络负面舆情的治理水平。首先，监控预警机制的主要工作是监测、分析、研判、评估、预警，建立完整的监控机制可以科学地预测和分析舆情的相关情况，为应对负面舆情做好充分的准备，避免负面舆情喷发式的发展。其次，新闻发布机制主要是健全政府面对突发事件主动回应、增加沟通的机制，权威部门和主流媒体以新的理念和方式站在公众的角度，全面、客观、真实、公正地阐述事件发展的过程与发展动态，树立政府形象，提升政府公信力，缩短民众与政府之间的距离，融洽双方的感情，增加沟通的效果。最后，建立健全舆情处置问责机制，一方面通过对政府部门及其工作人员进行考核问责，可以避免工作人员对舆情治理的不尽职、不尽责，通过相应的奖励与惩罚机制，明确责任，激发潜力；另一方面，通过问责可以找到处理问题过程中的问题和优势，为以后的舆情治理积累经验。


    党的十八届四中全会通过的《中共中央关于全面推进依法治国若干重大问题的决定》明确指出：“加强互联网领域立法，完善网络信息服务、网络安全保护、网络社会管理等方面的法律法规，依法规范网络行为。”因此，首先要树立法治意识和理念，政府要依法治理，民众也要依法发表言论。其次，要建立健全相关法律法规。明确各类主体在网络舆论空间内的权利与义务，使网络舆论治理有法可依、有章可循。缺少法律制度限制的一些网络负面舆论冲破了道德、法律的底线，但是却无法进行惩治。网络社会并非“法外之地”，只有实现网络空间的法制化，才能对“造谣”“煽动”等违法行为进行强有力的法律制度规范、约束和惩戒，鼓励网民发表正确、积极、理性的见解，减少不负责任的负面舆论，营造一个健康、持续、和谐、稳定的网络舆论生态环境。


    ## 5.10 现实风险环境推动网络风险治理体系升级


    从现实舆论环境来看，一方面，当前和可以预见的未来很长一段时间里，卫生健康工作将遭遇越来越多的新问题和新挑战；另一方面，网络舆情的监测和分析，无论是理论还是技术手段，都在不断地推陈出新，公共事件知识库系统是创新舆情工作的新方式、新手段。以创新思维应对日新月异的舆情态势，是应有之义，也是必要之举。


    第一，社会舆论风险大环境倒逼。舆论格局发生了重大的变化，自媒体兴起，各类社会风险频现，积极推动舆情工作上实现跨越式发展，及时把握网络涉社会舆情态势，避免社会舆情工作陷入“一步落后、步步落后”的窘境已经成为社会各界关注的重点。'
