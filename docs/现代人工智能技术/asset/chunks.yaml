- raw: "为了便于理解与描述，下面给出一个纵向联邦学习架构的例子：假设有两家公司A和B想要协同地训练一个机器学习模型，每一家公司都拥有各自的数据。其中，A公司是一家电商平台，拥有用户的购物行为数据；B公司是一家金融机构，拥有用户的信用评分数据。这两家公司的数据具有相同的样本空间（即用户ID），但不同的特征空间（即购物行为和信用评分）。如果这两家公司想要利用彼此的数据来提高模型性能，但又不想泄露自己的敏感信息，就可以采用纵向联邦学习架构：\n\
    \n1）A公司和B公司通过加密样本对齐找出共同的用户ID集合。具体地，A公司将自己的用户ID进行哈希处理后加密，并发送给第三方服务；B公司也将自己的用户ID进行哈希处理后加密，并发送给第三方服务；第三方服务将两边的加密数据进行比对，找出相同的部分，并返回给A公司和B公司各自对应的样本索引。\n\
    \n2）A公司和B公司通过加密模型训练在不暴露原始数据的情况下更新和优化模型参数。具体地，假设A公司拥有*n*个特征*x*，*x*，…，*x*[n]；B公司拥有*m*个特征*y*，*y*，…，*y*[m]；以及标签*z*（表示是否违约）。逻辑回归模型可以表示为\n\
    \n1212\n\n![](EPUB/images/image_603.jpg)\n\n式中，*f*是sigmoid函数；*w*是截距项；*w*[i]是权重系数；*ε*[i]是误差项。\n\
    \n### 0\n\n为了训练这个模型，需要最小化损失函数，使用梯度下降法或牛顿法求解其最小值。在纵向联邦学习架构中，这些梯度或海森矩阵需要在参与方之间进行交换，并且保证不泄露原始数据。因此，在每一轮迭代中：A公司计算自己特征相关的梯度或海森矩阵，并将其加密发送给第三方服务；B公司计算自己特征相关的梯度或海森矩阵，并将其加密发送给第三方服务；第三方服务将两边的加密数据进行解密、合并、再加密，并返回给A公司和B公司各自对应的部分；A公司和B公司根据收到的数据更新自己的模型参数。\n\
    \n3）在达到收敛条件后，A公司和B公司可以得到最终的逻辑回归模型，并用于预测用户是否会发生违约行为。\n\n### **9.5.3 FedBCD算法**\n\
    \n在纵向联邦学习的训练过程中，每一个参与者在每次迭代时都需要进行实时的梯度交换更新信息操作，这带来了巨大的通信开销，也导致了对于一个纵向联邦学习系统来说，通信效率是制约其可拓展性、实用性的瓶颈所在。\n\
    \n在9.4.3节中介绍了联邦平均算法，作为在横向联邦学习中被最为广泛使用的算法，其利用SGD让各参与者在本地进行多次局部更新，达到更好的通信效率。那么，我们能否在纵向联邦学习中也采用多次本地局部更新的思路，减少通信开销呢？这并不是一个能轻松解决的问题。对于联邦学习来说，协作效率与系统安全都是关键指标，而它们是彼此矛盾、平衡的。如何在设法提高协作效率的同时，保证算法的收敛性以及系统整体的安全性，是解决这一问题的一大难点。同时，纵向联邦学习每次迭代的梯度计算需要各参与者共同协作完成，联邦平均算法中所采用的直接简单加权平均梯度方法并不适用其中。\n\
    \n鉴于上述问题，刘洋及合作团队在2022年的工作《FedBCD:A Communication-Efficient Collaborative Learning Framework for Distributed Features》\
