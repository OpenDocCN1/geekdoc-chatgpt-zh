    # 决策树分类器


    由伪代码可以看出，决策树分类器的关键在于如何选择最优分化属性。通常我们希望随着划分过程的不断进行，分支节点所包含的样本尽可能属于同一类，即结点纯度越来越高。


    比较常用的决策树有`ID3`、`C4.5`和`CART`（Classification And Regression Tree，分类回归树），`CART`的分类效果一般优于其他决策树。下面介绍具体步骤。


    ## ID3


    最常用的衡量数据纯度的指标是信息熵。由增熵原理来决定哪个做父节点，哪个节点需要分裂。对于一组数据，熵越小说明分类结果越好。假定当前样本集合`D`中第`k`类样本所占的比例为`p[k]`（`k`=1，2，…，|`y`|），则`D`的信息熵定义如下：


    ![](img/image_188.jpg)


    假定离散属性`a`有`Q`个可能的取值{`a`，`a`，…，`a^Q`}，若使用该属性来对样本集`D`进行划分，则会产生`Q`个分支节点，其中第`q`个分支节点包含了`D`中所有在属性`a`上取值为`a^q`的样本记为`D^q`。我们可根据式（5-68）计算出`D^q`的信息熵，再考虑到不同的分支节点所包含的样本数不同，给分支节点赋予权重|`D^q|`/`|D|`，即样本数越多的分支节点的影响越大，于是可计算出用属性`a`对样本集`D`进行划分所获得的信息增益：


    ![](img/image_189.jpg)


    一般而言，信息增益越大，则意味着使用属性`a`来进行划分所获得的纯度提升越大。因此，我们可用信息增益来进行决策树的划分属性选择。


    ## C4.5


    通过对`ID3`的学习，可以知道`ID3`存在一个问题，那就是越细小的分割分类错误率越小，所以`ID3`会越分越细，甚至将分类错误率降到了 0，但是这种分割显然只对训练数据有用，面对新的数据分类错误率反倒上升了，这就是所说的过度学习。


    所以为了避免分割太细，`C4.5`对`ID3`进行了改进。在`C4.5`中，优化项要除以分割太细的代价，这个比值叫作信息增益率，定义为


    ![](img/image_190.jpg)


    式中，`H(D)`称为特征`A`的固有值。显然分割太细分母增加，信息增益率会降低。


    这里需要注意，信息增益率对可取值较少的特征有所偏好（分母越小，整体越大），因此`C4.5`并不是直接用增益率最大的特征进行划分，而是使用一个启发式方法：先从候选划分特征中找到信息增益高于平均值的特征，再从中选择增益率最高的。


    ## CART


    `ID3`和`C4.5`虽然在对训练样本集的学习中可以尽可能多地挖掘信息，但是其生成的决策树分支、规模都比较大，`CART`算法的二分法可以简化决策树的规模，提高生成决策树的效率，减少了大量的对数运算。`CART`是一个二叉树，也是回归树，同时也是分类树，`CART`的构成简单明了。其只能将一个父节点分为两个子节点。`CART`用`Gini`指数来决定如何分裂：


    ![](img/image_191.jpg)


    `Gini`指数跟熵的概念很相似，总体内包含的类别越杂乱，`Gini`指数就越大。可将其形象地理解为从数据集中随机抽取两个样本，其类别标记不一致的概率。则属性`a`的`Gini`指数为


    ![](img/image_192.jpg)


    于是，我们选择使得划分后`Gini`指数最小的属性作为最优划分属性，即


    ![](img/image_193.jpg)


    ## 剪枝与预剪枝


    由于过拟合的树在泛化能力的表现非常差，因此可以通过主动去掉一些分支来降低过拟合过程。


    预剪枝是在节点划分前来确定是否继续增长，后剪枝是在已经生成的决策树上进行剪枝，从而得到简化版的剪枝决策树。


    `ID3`没有剪枝策略，容易过拟合。`C4.5`采用的悲观剪枝方法，用递归的方式从底往上针对每一个非叶子节点，评估用一个最佳叶子节点去代替这棵子树是否有益。如果剪枝后与剪枝前相比其错误率保持不变或者下降，则这棵子树就可以被替换掉。`C4.5`通过训练数据集上的错误分类数量来估算未知样本上的错误率。后剪枝决策树的欠拟合风险很小，泛化性能往往优于预剪枝决策树，但同时其训练时间会大得多。`CART`采用代价复杂度剪枝，从最大树开始，每次选择训练数据熵对整体性能贡献最小的那个分裂节点作为下一个剪枝对象，直到只剩下根节点。`CART`会产生一系列嵌套的剪枝树，需要从中选出一颗最优的决策树。


    ## 特征值缺失


    在现实中，样本并不能保证全部完整，即某些特征值会缺失。特别是当属性数目较多时，如果简单地放弃所有不完整样本，则会对数据造成极大的浪费。因此需要探求如何使用部分属性值缺失的样本进行学习。


    第一个问题是在特征值缺失的情况下，进行划分属性选择。即该如何计算各个属性的信息增益。解决方案通常为对于具有缺失值的特征，用没有缺失的样本子集所占比重来折算。


    第二个问题是对于缺失该特征值的样本该如何处理。即应该把这个缺失该特征值的样本划分到哪个结点里。解决方案通常是将样本同时划分到所有子节点，不过要调整样本的权重值，也就是以不同概率划分到不同节点中。


    # 5.4.5 支持向量机


