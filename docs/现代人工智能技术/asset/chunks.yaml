    DQN算法是深度强化学习领域中先驱性的工作，其本身存在很大的改进空间。本节中将介绍两个非常著名的改进算法：DoubleDQN和DuelingDQN。


    **1. DoubleDQN**


    ![](EPUB/images/image_468.jpg)


    使用基本的DQN算法通常会导致对*Q*值的估计过高。在基本的DQN中，时序差分误差的目标可以转写为。换句话说，最大化操作实际上可以被拆解为两部分：首先选取状态*s′*下的最优动作，再使用目标网络计算该动作的价值。当这两步使用同一个网络进行计算时，每次得到的都是神经网络当前估算的所有动作价值中的最大值。考虑到借助神经网络估计*Q*值会产生一些误差，在上述更新过程中会导致正向误差的累积。这样的误差将会逐步累积。对于动作空间较大的任务，DQN中的过高估计问题会非常严重，造成DQN无法有效工作的后果。


    ![](EPUB/images/image_469.jpg)![](EPUB/images/image_470.jpg)![](EPUB/images/image_471.jpg)


