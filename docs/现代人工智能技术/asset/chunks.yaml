    ### 6.5.3 双向循环神经网络


    之前提到的循环神经网络都是单向循环神经网络，也就是未来的信息需要从过去的信息中提取捕获，同时也可能出现过去的标签值会对未来的信息预测有一定的影响，但是没有用到更远的未来可能出现的信息去预测未来的方式。但是在某些情况下，比如语言中，当前的词可能受到未来词的影响，在这样的背景下，双向循环神经网络应运而生。双向循环神经网络在训练经典数据集的时候都有很好的效果。


    本节将介绍双向循环神经网络的机理。双向循环神经网络示意图如图 6-22 所示。


    在双向循环神经网络中，我们可以看到每一个正向和反向各有一套隐藏层，这样就可以得到每一个方向的隐藏层公式，这两者的隐藏状态可分别表示为


    ![](img/image_295.jpg)![](img/image_296.jpg)![](img/image_297.jpg)![](img/image_298.jpg)![](img/image_299.jpg)![](img/image_300.jpg)


    其中，参数权重和偏差均为模型参数。而正向隐藏层状态，反向隐藏层状态。


    ×2`h`


    将两个隐藏状态拼接，可得到总体的隐藏状态`H`∈ℝ^n，并最终输入输出层中得到


    ### t


    ![](img/image_301.jpg)![](img/image_302.jpg)


    ▲图 6-22 双向循环神经网络示意图


    这样在训练的时候，就可以利用未来的信息去预测未来状态的信息，如自然语言处理中。当然双向循环神经网络不适用于所有的时间序列预测，比如电力预测这种和时间序列预测相关的能源预测等。


    卷积神经网络更关注于输入数据位置的信息，而循环神经网络中更加关注的是输入数据的时序上的信息状态。在使用用途上，卷积神经网络在图像、视频处理上应用更广泛，通过对相同位置的信息处理，获取较好的训练效果。在处理时序信息时，应用循环神经网络表现得更好，当然这些都不是固定的。随着`Transformer`等的提出，一种新的神经网络模型被越来越广泛地应用，当然这是后话了。


    ## 6.6 生成对抗神经网络


    生成对抗神经网络（Generative Adversarial Network，`GAN`）^(¹³)


    传统的神经网络模型，如卷积神经网络和循环神经网络，都是利用已经存在的数据进行模型的训练，最终能够得到拟合数据集的训练模型，从而用于验证、预测等。但是生成对抗神经网络可以通过训练生成训练数据相类似的数据类型，而生成的数据实际上是并不存在的。


    生成对抗神经网络被深度学习先驱 Yann LeCun 评价为“adversarial training is the coolest thing since
    sliced bread”，意为生成对抗神经网络是从神经网络诞生以来最酷的训练方式。


    生成对抗神经网络的结构如图 6-23 所示，在生成对抗神经网络模型中，具有生成器和判别器两个模块。而这两个模块往往是两个神经网络结构，因为神经网络可以拟合出任意想要的函数。实际上，生成对抗神经网络更像是一个大的框架，在这个框架中可以引入我们想要的神经网络类型，如在生成器部分使用卷积神经网络，可以用于图像模型等。


    ![](img/image_303.jpg)


    图 6-23 生成对抗神经网络的结构


    生成对抗神经网络的原理解释起来比较简单，生成器接收一个噪声`z`，随机生成和训练集相似的数据类型，经过判别器进行判断，确定生成器生成的数据是否满足判别器的预设要求，如果达到，则认为生成合适的数据类型，反之则没有生成合适的数据类型，继续更新迭代训练。


    而判断生成模型是否满足判别器的要求，则需要引入如下公式：


    ![](img/image_304.jpg)


    这个公式解释了判别要求。在该公式中，生成器将`G(z)`作为生成的假的数据，`x`是数据集的真实数据，函数`D(*)`则是判断这个数据是真的数据，而不是生成的数据的概率。当`D(*)`=1
    时，则可以判断这个数据是真数据。


    公式前半部分表示要想将真实数据判断为真，那么就需要去判断`D(x)`=1，而后半部分表示，要想将生成的数据判断为假，那么应该将`D(G(z))`=0，对于优化来说，约束就是`G`和`D`，所以优化要求也就是在约束`G`的条件优化使目标函数`V(D,
    G)`最小，而约束`D`的条件下使目标函数`V(D, G)`最大。经过多轮的迭代优化之后，生成对抗神经网络模型最终可以达到纳什均衡，也就是判别器对生成器产生的数据结果的鉴别正确率和错误率分别为
    50%。


    ## 6.7 小结


    自 20 世纪人工智能学习等概念提出以来，各种智能算法层出不穷。而神经网络作为人工智能的一种学习训练方式被提出之后，由于受限于硬件条件等，因此一直没有得到足够的认识。但是随着深度学习三巨头
    Yoshua Bengio、Geoffrey Hinton、Yann LeCun 对神经网络的重新认识，神经网络乃至之后发展起来的深度学习都推动了人工智能的飞速发展。


    本章介绍了线性神经网络、全连接神经网络、BP 神经网络、卷积神经网络、循环神经网络、生成对抗神经网络等。在线性神经网络中，为了给后续的神经网络的学习做铺垫，特意先介绍了神经网络中所涉及的激活函数等概念。


    在全连接神经网络中，介绍了如何创建一个简单的全连接神经网络，根据全连接神经网络的概念，可以初步得到全连接网络的作用，也就是类似于一个复杂函数的作用。为了更加深入地了解全连接神经网络的作用，又介绍了
    BP 神经网络，并详细介绍了其存在的问题以及优化的方法，当然在人工智能飞速发展的今天，BP 神经网络在最新的学习网络中已经没有过多的用处，但是 BP 神经网络的优化思想在人工智能中还会有应用。


    在介绍全连接神经网络之后，就进入当今深度学习两大分支卷积神经网络和循环神经网络的学习。卷积神经网络是神经网络复兴最开始的关键一步。LeNet 的提出，让世人意识到卷积神经网络在人工智能算法中的重要应用，而后续的
    AlexNet 更是在大规模视觉识别挑战赛中夺魁，一扫神经网络算法的阴霾，并由此开启了现代人工智能时代。本章详细介绍了卷积神经网络的原理以及卷积神经网络经常会用到的填充、池化等，主要是为了能够让读者更好地理解卷积神经网络在深度学习中的作用，原因在于这些操作在现代人工智能技术中也经常被使用，所以深入理解对之后的学习有很大的帮助。


    循环神经网络是完全不同于卷积神经网络的一种网络，从全连接神经网络和卷积神经网络的形式可以看出，训练较大模型的时候需要很大的内存。另外与时间序列相关的数据，很显然可以通过基于时间的模型来实现，这样可以有效地避免过多的数据量造成过多的参数内存。于是循环神经网络以及后续类似于循环神经网络的长短期记忆网络等时间序列模型的提出，在时间序列预测上起到了至关重要的作用。


    对于生成对抗神经网络，这是一个十分有创造性的工作，从数学理论来看，它是基于博弈论所产生的神经网络模型。另外，它的出现是颠覆性的，在这之前，往往都会基于卷积神经网络或者循环神经网络，但是生成对抗神经网络的出现让人们意识到神经网络不仅可以拟合和预测，还可以根据已有的数据创造数据，更可以让这些数据达到足以能够欺骗判别器的地步，人工智能技术也因此有了巨大的飞升。


