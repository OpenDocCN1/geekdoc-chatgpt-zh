    当人们面对各种问题，需要分析、综合和决策时，通常会根据已有的事实，运用已掌握的知识，发现事实之间的联系，或者总结出新的事实。这个过程就叫作推理，也就是从一些初始的证据开始，按照一定的规则，利用知识库里的知识，一步一步地推导出结论的过程。


