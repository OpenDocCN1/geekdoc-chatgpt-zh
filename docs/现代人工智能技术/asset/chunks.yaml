    ## **9.3 激励机制**


    ### **9.3.1 联邦学习中引入激励机制的必要性**


    联邦学习的设计理念是在不暴露原始数据的情况下，让海量的用户进行大规模的模型学习构建工作，起到既能保护用户隐私信息，又能达到较高的学习性能的作用。这一初衷无疑是美好的，但在联邦学习的实际落地运用过程中，不得不面对一个现实的问题：用户为什么要加入联邦学习系统中呢？


    一个联邦学习系统最终训练得到的模型质量在很大程度上依赖于每个参与系统的用户本地模型的更新质量，即对于参与者的贡献内容有很强的依赖性。然而，对于每个参与者来说，加入一个联邦学习系统进行模型的训练，往往是在增加自己的系统成本：需要负担起在联邦学习过程中的计算开销、与各方通信传输的通信开销、缩短电池使用寿命等。而且联邦学习本身对于隐私安全的保护并非尽善尽美，参与者仍然面临着隐私泄露的风险。在这种情况下，用户完全可能选择部分参与甚至不参与到联邦学习过程中，避免额外开销过大，保证自己的收益。当参与到联邦学习系统的用户由个人变为企业时，为了保证企业收益，选择不参与联邦学习这一行为发生的可能性更高。


    因此，在联邦学习中引入激励机制是十分有必要的。一方面，对于联邦学习的参与者来说，足够的激励机制可以激励参与者承担联邦学习所消耗的计算资源、网络带宽、电池寿命等成本，参与到联邦学习过程，做出贡献；另一方面，对于联邦学习系统本身来说，每一个参与者都是独立的，可以自行决定何时、何地、如何参与联邦学习，而激励机制在某种程度上可以影响到参与者的决策，采取不同的训练策略，影响训练得到的最终模型的性能。


    在联邦学习中引入激励机制，需要思考如何评估联邦学习每个参与者的贡献度，设计一种合理的回报机制，来吸引和留住更多的参与者加入联邦学习中。


    ### **9.3.2 基于数据质量评估**


    基于数据质量评估是指根据联邦学习每个参与者的数据本身的特征来评估贡献度，例如使用数据量、数据分布、数据标签等作为指标。这种方法的优点是比较简单和直观，不需要对模型训练的过程和结果进行分析。缺点是可能忽略了数据对模型性能的实际影响，以及数据之间的相关性和冗余性。


    一个基于数据质量评估的例子是：


    1）首先，对每个参与者的本地数据进行质量评估，包括计算重复值评分、缺失值评分、异常值评分和单一值评分等：


    ①重复值评分：每个参与者统计本地样本数据中重复的样本数量，计算重复的样本数量与总样本数量的比值，如下所示


    ![](EPUB/images/image_565.jpg)'
  fmt: '

    其次，由于设备条件、地理位置等条件的不同，联邦学习过程中的各个参与者的身份真实性以及其所提供的通信内容可靠性都难以确认，这一不可确认性加剧了隐私泄露的风险。联邦学习过程中一旦出现了不可靠的参与者，所有数据所有者的信息极易泄露。例如，半诚实的参与者在遵守隐私协议的同时，也可以通过合法获得的模型信息去推断其他参与者的标签甚至是数据；更进一步地，恶意的参与者可以设计上传有害的信息诱导其他参与方暴露更多的所有数据，或者直接不遵守隐私协议并影响到整个联邦学习系统的隐私安全。


    即使联邦学习的过程中隐私并未泄露，训练所得的模型本身同样面临着隐私泄露的风险。面临这种风险的原因是联邦学习或者说机器学习自身的脆弱性。机器学习模型的构建基于其训练过程中所使用的数据样本，一个机器学习模型需要对数据样本的规律充分挖掘才能保证其结果足够准确。在不断加强准确性的同时，模型的参数甚至是模型的结构“记住”数据样本细节的可能性也不断增加，使得最终得到的模型携带了原始数据的敏感信息。当模型发布后，攻击者可以通过模型公开的预测接口，不断进行查询，推测某个记录是否来自模型所使用的原始数据集、模型具体参数等，甚至根据模型的参数进一步推测该模型训练的参与者、使用的原始数据集的具体样本等。


    由此可见，即使联邦学习的设计在一定程度上保护了隐私，但如果在联邦学习过程中不加保护，所有的参与者仍然面临着隐私泄露的风险。一旦隐私泄露发生，不仅仅是对数据所有者来说面临着数据泄露的严重损失，对于参与联邦学习的所有参与者来说也意味着彼此之间的信任被打破，再想继续合作进行模型训练变得十分困难。因此，我们必须对隐私保护技术有一定的了解，并在联邦学习过程中加以利用，降低隐私泄露的风险。


    ### 9.2.2 差分隐私


    #### 1. 差分攻击


    介绍差分隐私前，我们要先了解一下其所针对的隐私攻击方式——差分攻击。


    我们假设有一家医院，其公布信息说：“我们有100个病人，其中10个感染HIV。”如果攻击者知道了其中99个人是否患有HIV的信息，将这99个人的信息和医院公布的信息进行比对，就可以得知第100个人是否患有HIV的信息。医院本身发布的信息并未泄露任何隐私信息，仅仅是正常的统计信息公布，但还是导致了个人隐私的泄露。


    我们再看一个例子：假设有一个体重数据库记录了三个人的体重，分别是50kg、60kg、70kg，对外公布的接口只能够查询到数据库中体重的平均值。在张三登记前，查询得到一个平均体重数值；在张三登记后又进行一次查询，得到一个新的平均体重数值。经过简单的数学计算，就可以得到张三的体重数据。


    这种对隐私的攻击行为就是差分攻击。


    #### 2. 差分隐私的定义


    差分隐私的直观原理如图9-4所示。将数据集`D′`中Alice的数据换成另一个人的数据组成数据集`D′`，如果攻击者无法判别信息`O`是来自于`D`还是`D′`，那么我们可以认为Alice的隐私受到了保护。差分隐私要求任何被发布的信息都应当与上述信息`O`类似，应当避免被攻击者分辨出任何具体的个人信息。因此，差分隐私要求被发布的信息需经一个随机算法处理，且该随机算法会对信息做一些扰动。


    ![](EPUB/images/image_545.jpg)


    图9-4 差分隐私的直观原理


    差分隐私的一般性方法如图9-5所示。如果数据所有者直接发布准确的查询结果给查询用户（可能是潜在的攻击者），由于用户可能通过结果反推数据信息，因此是有潜在的隐私泄露风险的。因此，差分隐私系统要求数据所有者提供一个由所有数据提炼得到的中间件，并利用随机算法对其注入适量噪声，再从带噪中间件得出带噪查询结果提供给查询用户。这样即使可以通过结果反推中间件，也会由于噪声的加入导致无法对原始的数据信息进行推理，以达到保护隐私的目的。


    ![](EPUB/images/image_546.jpg)


    图9-5 差分隐私的一般性方法


    对于只有一条记录不同的两个数据集`D`和`D′`，给定一个随机算法`M`，`Range(M)`为`M`的输出范围。若算法`M`在数据集`D`和数据集`D′`上任意输出结果`O`∈`Range(M)`满足式（9-2），则称`M`提供（`ε`，`δ`）-差分隐私保护：


    ![](EPUB/images/image_547.jpg)


    式中，`ε`是隐私预算，表示隐私保护程度，`ε`越小，隐私保护程度越高；`δ`是失败概率，表示算法`M`违背差分隐私保护的概率，`δ`越小，隐私保护程度越高。


    特别地，当`δ`=0时，便得到了性能更好的`ε`-差分隐私。


