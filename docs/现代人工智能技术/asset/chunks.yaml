    **3. ROC和AUC**


    很多学习器是为测试样本产生一个实值或概率预测，然后将这个预测值与一个分类阈值进行比较，若大于阈值则分为正类，否则为反类。例如，神经网络在一般情形下是对每个测试样本预测出一个［0.0，1.0］之间的实值，然后将这个值与0.5进行比较，大于0.5则判为正例，否则为反例。这个实值或概率预测结果的好坏，直接决定了学习器的泛化能力。实际上，根据这个实值或概率预测结果，我们可将测试样本进行排序，最可能是正例的排在最前面，最不可能是正例的排在最后面。这样，分类过程就相当于在这个排序中以某个截断点将样本分为两部分，前一部分判作正例，后一部分则判作反例。


    在不同的应用任务中，我们可根据任务需求来采用不同的截断点，例如若我们更重视查准率，则可选择排序中靠前的位置进行截断；若更重视查全率，则可选择靠后的位置进行截断。因此，排序本身的质量好坏，体现了综合考虑学习器在不同任务下的期望泛化性能的好坏，或者说一般情况下泛化性能的好坏。ROC（Receiver Operating Characteristic，受试者工作特征）曲线则是从这个角度出发来研究学习器泛化性能的有力工具。


    ROC曲线源于“二战”中用于敌机检测的雷达信号分析技术，20世纪60～70年代开始被用于一些心理学、医学检测应用中，此后被引入机器学习领域。与*P-R*曲线相似，我们根据学习器的预测结果对样例进行排序，按此顺序逐个把样本作为正例进行预测，每次计算出两个重要量的值，分别以它们为横、纵坐标作图，就得到了ROC曲线。与*P-R*曲线使用查准率、查全率为纵、横轴不同，ROC曲线的纵轴是真正例率（True Positive Rate，TPR），横轴是假正例率（False Positive Rate，FPR），两者分别定义为


    ![](EPUB/images/image_128.jpg)


    显示ROC曲线的图称为ROC图（见图5-14a）。显然，对角线对应于随机猜测模型，而点（0，1）则对应于将所有正例排在所有反例之前的理想模型。


    ![](EPUB/images/image_129.jpg)


