    # 第2章

    ## 知识表达

    本章首先讨论了知识与知识表达的概念，在此基础上介绍了一阶谓词逻辑表示法，此外还对产生式表示法和框架表示法进行了介绍。


    ## 2.1 知识与知识表达的概念

    ### 2.1.1 知识的概念

    知识是人们对客观世界的认识和经验，它来源于人们长期的生活、社会和科学实践。人们把实践中得到的信息联系起来，就构成了知识。一般来说，知识就是信息之间的某种结构。信息之间有很多种联系方式，其中最常见的一种是用“如果……，就……”来表示的联系方式。它表达了信息之间的某种因果关系。

    知识是人们对客观世界中事物的关系的理解，不同的事物或者同一事物的不同关系构成了不同的知识。比如，“空气是无色无味的”这句话就是一条知识，它表明了“空气”和“气味”之间有一种属性关系；再比如，“如果浑身发冷，那么可能是要发烧了”这句话也是一条知识，它表明了“浑身发冷”和“发烧”之间有一种因果关系。在人工智能中，把第一种知识叫作“事实”，而把第二种知识，也就是用“如果……，就……”连接起来的知识叫作“规则”。下面将进一步介绍它们。


    ### 2.1.2 知识的特征

    #### 1. 相对正确性

    知识是人类对客观世界的认识和归纳，它经过了实践的检验和积累。因此，在特定的条件和环境下，知识通常是正确的。这里，“特定的条件和环境”至关重要，它是知识正确性的前提。由于任何知识都是在特定的条件和环境下形成的，所以也只有在这样的条件和环境下才能保证其正确性。例如，牛顿力学只有在一定的条件下才能适用。再例如，`1+1=2`，这是一条众所周知的正确知识，但它也只是在十进制系统下才成立，如果换成二进制系统，它就不正确了。


    #### 2. 不确定性

    人类生活在一个复杂多变的世界，面对着各种各样的信息。这些信息有的是正确的、清楚的，有的是错误的、模糊的，有的是直接的、明确的，有的是间接的、隐晦的。这就意味着知识并不总是绝对的，而是存在着许多相对的、不确定的地带。也就是说，知识的真实性有高低之分。人们称知识具有这样一种特性为不确定性。

    知识不确定性的原因主要有以下几个方面：

    1）随机性造成的不确定性。由随机事件组成的知识无法用“真”或“假”来简明地评判，它是不确定的。比如，“头痛流涕，或许是感冒了”这句话就反映了一种不确定的因果联系，因为头痛流涕并非一定感冒。因此，这句话是一种不确定性知识。

    2）模糊性造成的不确定性。有些事物本身就没有明确的界限，让人们难以把它们严格地区别开来，也难以判断它们是否属于某个模糊概念；有些事物之间也存在模糊的关系，让人们难以准确地判断它们之间的关系是“真”还是“假”。这样由模糊概念、模糊关系组成的知识就具有不确定性。

    3）经验性导致的不确定性。这类知识通常是领域专家在长年的实践和研究中积淀而成的。领域专家能够灵活地应用这些知识，妥善地处理领域内的相关问题，但如果要求他们准确地阐述出来却很难。这就导致了知识的不确定性。而且，经验性知识本身就含有不精确性和模糊性，也加剧了知识的不确定性。所以，在专家系统中，绝大多数知识都有不确定性这一特征。

    4）不完全性造成的不确定性。人类对客观世界的认识是一个持续深入的过程，需要在大量的感性认识的基础上才能升华到理性认识的层次，形成系统的知识。因此，知识有一个逐渐完善的过程。在这个过程中，有时由于客观事物没有充分地显现自己，导致人类对它们的认识不够周全；有时由于人类没有把握事物的本质，导致人类对它们的认识不够精确。这种认识上的缺失、偏差就让相应的知识呈现出不精确、不确定的特征。因此，不完全性是导致知识不确定性的一个重要因素。


    #### 3. 可表示性

    知识的可表示性是指知识可以用适宜的形式表达出来，例如语言、文字、图形、神经网络等。这样一来，知识才能被储存和传播。


    #### 4. 可利用性

    知识的可利用性是指知识能够被运用到实际问题中。这是一种常理，人们每天都在利用自己掌握的知识来应对生活或工作中遇到的各种困难。


    ### 2.1.3 知识的表示

    知识的表示是一种将人类知识用形式化或模型化的方式表达出来的方法。它可以让计算机理解和处理知识，而不仅仅是数据。

    目前，有很多种知识的表示方法，比如一阶谓词逻辑、产生式、框架、状态空间、人工神经网络、遗传编码等表示法。这些方法都是为了解决某些特定的问题而设计的，所以它们各有优缺点和适用范围。在实际应用中，需要根据具体情况选择合适的方法，或者将多种方法结合起来使用。目前还没有一个通用的标准来评价和选择知识表示方法，也没有一个能够适应所有问题的万能方法。因此，在建立一个具体的智能系统时，需要根据系统的目标和需求，综合考虑各种因素，选择最适合的知识表示方法。


    ## 2.2 一阶谓词逻辑表示法

    人工智能中的逻辑可以分为两类：经典逻辑和非经典逻辑。经典逻辑包括命题逻辑和一阶谓词逻辑，它们的特点是每个命题只有真或假两种可能，没有其他选项，这种逻辑也叫二值逻辑。非经典逻辑是指除了经典逻辑以外的其他逻辑，比如三值逻辑、多值逻辑、模糊逻辑等，它们可以处理不确定性和模糊性的问题。

    命题逻辑和谓词逻辑是人工智能最早使用的两种逻辑，在知识表示和推理方面有很重要的作用，是人工智能发展历史上的基石。


    ### 2.2.1 命题

    下面首先讨论命题的概念。命题逻辑是研究命题及其组合的逻辑系统，也是谓词逻辑的特例。接下来将介绍命题的概念。

    **定义2.1** 命题是一个非真即假的陈述句。

    命题的真假并不是一成不变的，而是取决于具体的条件。比如，“`1+1=10`”这个命题，在二进制下是正确的（真值为`T`），但在十进制下是错误的（真值为`F`）。同理，对于“今天是晴天”这个命题，也要看当天实际天气才能判断其真假。

    在命题逻辑中，通常用大写英文字母来代表命题，例如可以用`P`代表“西安是个古老的城市”。

    英文字母可以表示具体的命题（称为命题常量），也可以表示抽象的命题（称为命题变元）。只有给定具体的命题后，命题变元才能有确定的真值。

    简单地说，一个句子就能表达出来的命题叫作简单命题或原子命题。还可以用否定、合取、析取、条件、双条件等连接词把原子命题组合成复合命题。通过定义推理规则和蕴涵式，可以进行基本的逻辑证明。这些内容与谓词逻辑相似，请参考相关书籍。

    命题逻辑表示法有很大的不足，它不能反映出事物的结构和逻辑特征，也不能表达出不同事物之间的共性。例如，“老李是小李的父亲”这个命题，如果用英文字母`P`来表示，就看不出老李和小李之间的父子关系。再比如，“李白是诗人”“杜甫也是诗人”这两个命题，用命题逻辑表示时，也无法形式化地表现出它们的共同特征（都是诗人）。因此，在命题逻辑的基础上发展了谓词逻辑。


    ### 2.2.2 谓词

    谓词逻辑是一种基于命题中谓词分析的逻辑方法。它把一个命题分成两个部分：谓词名和个体。个体是指某个具体或抽象的事物，比如“苹果”“爱情”等。谓词名是指描述个体的性质、状态或关系的词语，比如“红色的”“喜欢”等。

    一个谓词由谓词名和个体组成，一般形式是

    `P(x, x, …, x[n])`

    式中，`P`是谓词名；`x, x, …, x[n]`是个体。

    不同的谓词可以包含不同数量的个体。可以用元数来表示一个谓词包含的个体数量。例如，`P(x)`是一个一元谓词，因为它只包含一个个体。`P(x, y)`是一个二元谓词，因为它包含两个个体。`P(x,
    x, …, x[n])`是一个`n`元谓词，因为它包含`n`个个体。

    谓词名是人为定义的符号，通常用英文单词或大写字母表示其含义，也可以用其他符号或中文。个体是具体的事物或对象，通常用小写字母表示。例如，我们可以定义`S(x)`表示“`x`是一个学生”，也可以定义`S(x)`表示“`x`是一只船”。在谓词中，个体可以是常量、变量或函数。这些都叫作“项”。

    个体是指定的事物或个体，用常量表示。例如，“小李是一个学生”这个命题，可以用一元谓词`Student(Li)`表示。其中，`Student`是谓词名，`Li`是个体常量，表示小李这个人。`Student`表达了`Li`的职业特征。

    “7>2”这个不等式命题，可以用二元谓词`Greater(7, 2)`表示。其中，`Greater`是谓词名，7和2是个体常量，表示两个数。`Greater`表达了7和2之间的大小关系。

    可以使用三元谓词`Works(Li, MBI, Engineer)`来表示“Li是MBI的一名工程师”这一命题。不过，一个命题的谓词表示并不唯一。例如，“老李是一位工人”这一命题，也可以用二元谓词`Is-a(Li,
    Worker)`来表示。

    变元是指代表未指定的个体或个体集合的符号。例如，“`y`<8”这一命题，可以用`Less(y, 8)`来表示，其中`y`就是变元。当变元被具体的个体名字替换时，就称为常量化。当谓词中的所有变元都被特定的个体替换时，谓词就具有一个确定的真值：`T`或`F`。

    如今常把个体变元的取值范围叫作个体域。个体域可以是有限的，也可以是无限的。例如，如果用`R(x)`表示“`x`是负数”，那么个体域就是所有负数，它是无限的。

    函数是指一种从一个个体到另一个个体的映射关系。例如，“小马的父亲是警察”这一命题，可以用一元谓词`Police(father(Ma))`来表示；“小刘的妹妹与小李的哥哥结婚”这一命题，可以用二元谓词`Married(sister(Liu),
    brother(Li))`来表示。其中，`sister(Liu)`和`brother(Li)`都是函数。

    函数可以递归调用。例如，“小李的祖父”可以表示为`father(father(Li))`。

    函数与谓词在形式上很类似，容易引起混淆，但它们是两个完全不同的概念。谓词的值是真或假，而函数的值是个体域中的某个个体。函数没有真值，它只是在个体域中从某一个体到另一个体的映射关系。

    在谓词`P(x, x, …, x[n])`中，如果`x[i]`（`i`=1，…，`n`）都是个体常量、变量或函数，那么它是一阶谓词。如果某个`x[i]`本身又是一个一阶谓词，那么它是二阶谓词，依此类推。例如，命题“Li作为一名工程师为MBI工作”，可以表示为二阶谓词`Works(Engineer(Li),
    IBM)`，因为其中个体`Engineer(Li)`也是一个一阶谓词。


    ### 2.2.3 谓词公式

    无论是命题逻辑还是谓词逻辑，都可以用以下的逻辑连接词把一些简单命题联结起来，形成一个复合命题，以表达一个比较复杂的意义。


    #### 1. 逻辑连接词

    ①﹁：称为“否定”或者“非”。它表示否定其后的命题。当`P`名字为真时，﹁`P`为假；当`P`为假时，﹁`P`为真。

    例如，“老李不在2号房间内”，表示为

    `﹁INROOM(Li, R2)`

    ②∨：称为“析取”。它表示其链接的两个命题具有“或”关系。

    例如，“刘辉打羽毛球或乒乓球”，表示为

    `Plays(LiuHui, Badminton) ∨ Plays(LiuHui, Tabletennis)`

    ③∧：称为“合取”。它表示其连接的两个命题具有“与”关系。

    例如，“陈明喜欢学习和玩游戏”，表示为

    `Like(ChenMing, Study) ∧ Like(ChenMing, Playing)`

    有些简单的句子也可以用来构成复合形式，如：“老李住在一幢黑色的房子里”，表示为

    `Lives(Li, House) ∧ Color(House, Black)`

    ④→：称为“蕴涵”或者“条件”。`P→Q`表示“`P`蕴涵`Q`”，即表示“如果`P`，则`Q`”。其中，`P`称为条件的前件，`Q`称为条件的后件。

    例如，“如果李正跳得高，那么他取得冠军”表示为

    `Jumps(LiZheng, Highest) → Wins(LiZheng, Champion)`

    “如果这个笔是刘伟的，那么它是红色的”表示为

    `Owns(LiuWei, Pen) → Color(Pen, Red)`

    “如果我制造了一个发动机，且这个发动机不能起动，那么他或者在晚上进行修理，或者第二天把它交给工程师”表示为

    `Produces(I, Engine) ∧ ﹁Works(Engine) → Fix(I, Engine, Evening) ∨ Give(Engine,
    Engineer, Next-Day)`

    如果后项取值`T`（不管其前项的值如何），或者前项取值`F`（不管后项的值如何），则蕴涵取值`T`，否则蕴涵取值`F`。注意，只有当前项为真，后项为假时，蕴涵才为假，其余情况均为真，见表2-1。“蕴涵”与汉语中的“如……则……”有区别，汉语中前后要有逻辑联系，而命题中可以没有关联。例如，如果“人不会死亡”，则“雪是白的”，是一个真值为`T`的命题。

    ⑤↔：称为“等价”或“双条件”。`P↔Q`表示“`P`当且仅当`Q`”。

