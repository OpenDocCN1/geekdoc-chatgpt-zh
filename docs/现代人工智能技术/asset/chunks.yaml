    ## 8.3.4 On-policy 算法与 Off-policy 算法


    在估计值函数或者策略时，需要用到一些样本，这些样本也需要采用某种策略生成。On-policy 算法和 Off-policy 算法的区别关键在于估计值函数或者策略时使用的策略和生成样本时所使用的策略是否一致：若一致则该算法为
    On-policy 算法，否则为 Off-policy 算法。具体而言：


    1）对于`SARSA`算法，其动作价值函数更新公式如下所示：


    `Q^π(s,a) ← Q^π(s,a) + α[R + γQ^π(s′,a′) - Q^π(s,a)]`


    `SARSA`算法中必须执行两次动作得到（`s`，`a`，`r`，`s′`，`a′`）才可以更新一次动作价值函数值，而且`a′`是在某一策略`π`的指导下得出的，因此`SARSA`算法中更新得出的`Q(s,a)`是在该策略`π`下的`Q`值，生成成本和估计`Q`值所用的策略是相同的策略，因此`SARSA`算法是一个
    On-policy 算法。


    2）对于`Q-Learning`算法，其动作价值函数更新公式如下所示：


    ![](img/image_424.jpg)


    `Q-Learning`每次更新只需要执行一步动作得到（`s`，`a`，`r`，`s′`）就可以进行一次更新，由于`a′`永远是最优的那个动作，因此所估计的策略应该也是最优的，而生成样本时用的策略却不一定是最优的，因此`Q-Learning`算法是一个
    Off-policy 算法。


