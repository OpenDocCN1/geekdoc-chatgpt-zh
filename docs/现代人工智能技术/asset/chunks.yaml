    **3. 剪枝与预剪枝**


    由于过拟合的树在泛化能力的表现非常差，因此可以通过主动去掉一些分支来降低过拟合过程。


    预剪枝是在节点划分前来确定是否继续增长，后剪枝是在已经生成的决策树上进行剪枝，从而得到简化版的剪枝决策树。


    ID3没有剪枝策略，容易过拟合。C4.5采用的悲观剪枝方法，用递归的方式从底往上针对每一个非叶子节点，评估用一个最佳叶子节点去代替这棵子树是否有益。如果剪枝后与剪枝前相比其错误率保持不变或者下降，则这棵子树就可以被替换掉。C4.5通过训练数据集上的错误分类数量来估算未知样本上的错误率。后剪枝决策树的欠拟合风险很小，泛化性能往往优于预剪枝决策树，但同时其训练时间会大得多。CART采用代价复杂度剪枝，从最大树开始，每次选择训练数据熵对整体性能贡献最小的那个分裂节点作为下一个剪枝对象，直到只剩下根节点。CART会产生一系列嵌套的剪枝树，需要从中选出一颗最优的决策树。


    **4. 特征值缺失**


    在现实中，样本并不能保证全部完整，即某些特征值会缺失。特别是当属性数目较多时，如果简单地放弃所有不完整样本，则会对数据造成极大的浪费。因此需要探求如何使用部分属性值缺失的样本进行学习。


    第一个问题是在特征值缺失的情况下，进行划分属性选择。即该如何计算各个属性的信息增益。解决方案通常为对于具有缺失值的特征，用没有缺失的样本子集所占比重来折算。


    第二个问题是对于缺失该特征值的样本该如何处理。即应该把这个缺失该特征值的样本划分到哪个结点里。解决方案通常是将样本同时划分到所有子节点，不过要调整样本的权重值，也就是以不同概率划分到不同节点中。


