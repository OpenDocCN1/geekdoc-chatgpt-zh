    ## 2.2.4 谓词公式的性质


    ### 1. 谓词公式的解释


    在命题逻辑中，对命题公式中每个命题变量赋予一个真值（T或F）的过程称为命题公式的一个解释。给定一个命题公式，根据连接词的定义就可以计算出它的真值。


    在谓词逻辑中，由于公式中可能含有个体变量和函数，因此不能像命题公式那样直接进行真值赋值，而需要先确定个体变量和函数在个体域中的对应关系，然后再根据每个谓词的含义为其赋予真值。由于存在多种可能的对应关系，所以一个谓词公式可能有多个解释。对于每个解释，谓词公式都可以得到一个真值（T或F）。


    ### 2. 谓词公式的永真性、可满足性、不可满足性


    #### 定义2.3

    对于谓词公式`P`，如果它在个体域`D`上的所有解释下都为真，则称`P`在`D`上是永真的；如果`P`在任意非空个体域上都是永真的，则称`P`是永真的。


    #### 定义2.4

    对于谓词公式`P`，如果它在个体域`D`上的所有解释下都为假，则称`P`在`D`上是永假的；如果`P`在任意非空个体域上都是永假的，则称`P`是永假的。


    由此可见，要判断一个公式是否永真，需要对每个个体域上的所有解释进行检验。当解释的数量无限时，公式的永真性就难以确定了。


    #### 定义2.5

    对于谓词公式`P`，如果存在至少一个解释使得`P`在该解释下为真，则称`P`是可满足的；否则，称`P`是不可满足的。


    ### 3. 谓词公式的等价性


    #### 定义2.6

    设`P`和`Q`是两个谓词公式，它们具有相同的个体域`D`。如果对于`D`上的任意一个解释，`P`和`Q`都具有相同的真值，那么称`P`和`Q`在`D`上是等价的。如果对于任意的个体域`D`，`P`和`Q`都是等价的，那么称`P`和`Q`是等价的，并记作`P`≡`Q`。


    下面列出经常会用到的一些主要等价式：


    （1）交换律

    `P` ∨ `Q` ⇔ `Q` ∨ `P`

    `P` ∧ `Q` ⇔ `Q` ∧ `P`


    （2）结合律

    （`P` ∨ `Q`）∨ `R` ⇔ `P` ∨（`Q` ∨ `R`）

    （`P` ∧ `Q`）∧ `R` ⇔ `P` ∧（`Q` ∧ `R`）


    （3）分配律

    `P` ∨（`Q` ∧ `R`）⇔（`P` ∨ `Q`）∧（`P` ∨ `R`）

    `P` ∧（`Q` ∨ `R`）⇔（`P` ∧ `Q`）∨（`P` ∧ `R`）


    （4）德摩根律

    ﹁（`P` ∨ `Q`）⇔﹁`P` ∧﹁`Q`

    ﹁（`P` ∧ `Q`）⇔﹁`P` ∨﹁`Q`


    （5）双重否定率（对合率）

    ﹁﹁`P` ⇔ `P`


    （6）吸收率

    `P` ∨（`P` ∧ `Q`）⇔ `P`

    `P` ∧（`P` ∨ `Q`）⇔ `P`


    （7）补余率（否定率）

    `P` ∨﹁`P` ⇔ `T`

    `P` ∧﹁`P` ⇔ `F`


    （8）连接词化规律

    `P`→`Q` ⇔﹁`P` ∨ `Q`


    （9）逆否律

    `P`→`Q` ⇔﹁`Q`→﹁`P`


    （10）量词转化律

    ﹁（∃ `x`）`P` ⇔（∀ `x`）（﹁`P`）

    ﹁（∀ `x`）`P` ⇔（∃ `x`）（﹁`P`）


    （11）量词分配律

    （∀ `x`）（`P` ∧ `Q`）⇔（∀ `x`）`P`∧（∀ `x`）`Q`

    （∃ `x`）（`P` ∨ `Q`）⇔（∃ `x`）`P`∨（∀ `x`）`Q`


    ### 4. 谓词公式的永真蕴涵


    #### 定义2.7

    如果`P`和`Q`是两个谓词公式，`D`是它们的共同个体域，那么当`D`上的任何一个解释都使`P`→`Q`为真时，我们说公式`P`永真蕴涵`Q`，记作`P`→`Q`，并称`Q`是`P`的逻辑结论，`P`是`Q`的前提。


    以下是一些常用的永真蕴涵式：


    （1）假言推理

    `P`，`P`→`Q`⇒`Q`


    （2）拒取式推理

    ﹁`Q`，`P`→`Q`⇒﹁`P`


    （3）假言三段论

    `P`→`Q`，`Q`→`R`⇒`P`→`R`


    （4）全称固化

    （∀ `x`）`P`（`x`）⇒`P`（`y`）

    其中，`y`是个体域中的任一个体，利用此永真蕴涵式可消去公式中的全称量词。


    （5）存在固化

    （∃ `x`）`P`（`x`）⇒`P`（`y`）

    其中，`y`是个体域中某一个可使`P`（`y`）为真的个体。利用此永真蕴涵式可消去公式中的存在量词。


    （6）反证法


    #### 定理2.1

    `Q`为`P`，`P`，…，`P`[n]的逻辑结论，当且仅当（`P`∧ `P`∧…∧ `P`[n]）∧﹁`Q`是不可满足的。


    1212


    该定理是归结反演的理论依据。


    上面列出的等价式及永真蕴涵式是进行演绎推理的重要依据，因此这些公式又称为推理规则。


    ## 2.2.5 一阶谓词逻辑知识表示法


    在前面的介绍中，已经看到了用谓词逻辑表示知识的一些例子，一般来说，应该怎样用谓词公式来表达想要的知识呢？通常，需要遵循以下三个步骤：


    1）明确谓词和个体的含义，给出每个谓词和个体的准确定义。

    2）根据想要表达的事物或概念，给谓词中的变量赋予具体的值。

    3）根据语义，用合适的连接符号把各个谓词连接起来，构成谓词公式。


    #### 例2.1

    用一阶谓词逻辑表示“每个储蓄钱的人都得到利息”。


    **解** 定义谓词：`save`（`x`）表示`x`储蓄钱，`interest`（`x`）表示`x`获得利息。


    则“每个储蓄钱的人都得到利息”表示为


    （∀ `x`）（`save`（`x`）→`interest`（`x`））


    用一阶谓词逻辑表示知识并不是唯一的方法。有时候，可以用不同的谓词和变量来表达同样的意思。比如例2.1，也可以用另一种方式来表示。


    首先，定义谓词：`save`（`x`，`y`）表示`x`储蓄`y`，`money`（`y`）表示`y`是钱，`interest`（`y`）表示`y`是利息，`obtain`（`x`，`y`）表示`x`获得`y`。然后，用全称量词和存在量词把四个谓词连接起来，得到：


    （∀ `x`）（∃ `y`）（`money`（`y`）∧ `save`（`x`，`y`））→（∃ `u`）（`interest`（`u`）∧ `obatin`（`x`，`u`））


    这也是用一阶谓词逻辑表示“每个储蓄钱的人都得到利息”的一种公式。


    其实，还可以用一阶谓词逻辑来表示关系数据库。关系数据库是一种存储数据的方式，它把数据组织成表格的形式。例如，下面这个关系数据库就包含了两个表格。


