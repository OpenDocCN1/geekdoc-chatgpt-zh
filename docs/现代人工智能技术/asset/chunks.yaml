    这样的话，当输出层误差接近于0的时候，就可以令`λ`>1，这样的结果就可以提高`BP`神经网络算法的收敛速度。另一种在激活函数上做处理的方法是改变`Sigmoid`函数为`Relu`函数。


    另一种让算法迅速逃离平坦区的方法是增加动量项。标准`BP`神经网络算法的权值调节公式为


