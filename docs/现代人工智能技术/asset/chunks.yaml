    ### 9.5.3 FedBCD 算法


    在纵向联邦学习的训练过程中，每一个参与者在每次迭代时都需要进行实时的梯度交换更新信息操作，这带来了巨大的通信开销，也导致了对于一个纵向联邦学习系统来说，通信效率是制约其可拓展性、实用性的瓶颈所在。


    在 9.4.3 节中介绍了联邦平均算法，作为在横向联邦学习中被最为广泛使用的算法，其利用 SGD 让各参与者在本地进行多次局部更新，达到更好的通信效率。那么，我们能否在纵向联邦学习中也采用多次本地局部更新的思路，减少通信开销呢？这并不是一个能轻松解决的问题。对于联邦学习来说，协作效率与系统安全都是关键指标，而它们是彼此矛盾、平衡的。如何在设法提高协作效率的同时，保证算法的收敛性以及系统整体的安全性，是解决这一问题的一大难点。同时，纵向联邦学习每次迭代的梯度计算需要各参与者共同协作完成，联邦平均算法中所采用的直接简单加权平均梯度方法并不适用其中。


