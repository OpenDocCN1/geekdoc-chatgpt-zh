    *p*\=2时，即为欧氏距离


    ![](EPUB/images/image_219.jpg)


    *p*\=1时，即为曼哈顿距离


    ![](EPUB/images/image_220.jpg)


    在讨论距离计算时，属性上的序关系更为重要。例如定义域为{1，2，3}的离散属性与连续属性能直接在属性值上计算距离“1”“2”比较接近、与“3”比较远，这样的属性称为有序属性；而定义域为{苹果，李子，香蕉}这样的离散属性则不能直接在属性值上计算距离，称为无序属性。


    对有序属性的度量，直接在属性值上计算距离，可使用闵可夫斯基距离、欧氏距离、曼哈顿距离。


