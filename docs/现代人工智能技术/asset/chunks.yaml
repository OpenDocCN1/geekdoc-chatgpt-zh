    # 第3章 确定性推理方法


    本章首先从定义分类方向策略等方面介绍了确定性推理的基本概念，并进一步讨论了自然演绎推理、谓词公式化为子句集、鲁滨逊归结原理和归结反演等方法。


    ## 3.1 推理的基本概念


    ### 3.1.1 推理的定义

    '
  trans: '


    2）消解冲突。有时，匹配成功的规则可能不止一条，这就产生了冲突。此时，控制系统要调用相应的消解冲突策略，从多个匹配成功的规则中选出一条执行。


    3）执行规则。如果某条规则中有结论，就把结论加入综合数据库中；如果某条规则中有操作，就执行操作。对于不确定性知识，还要计算结论或操作的不确定性程度。


    4）检查推理终止条件。检查综合数据库中是否已经包含了最终结论，决定是否停止推理过程。


    ### 3. 综合数据库


    综合数据库是存放问题求解过程中各种当前信息的地方。这些信息包括问题的初始状态、原始证据、中间结论和最终结论等。综合数据库是规则系统进行推理的依据，它会随着推理过程而不断变化。当某条规则的前提条件与综合数据库中的某些信息相匹配时，这条规则就可以被使用，它会把推出的结论或操作加入综合数据库中，为后面的推理提供新的信息。


    ### 2.3.3 产生式系统的例子——动物识别系统


    下面以一个动物识别系统为例，介绍产生式系统求解问题的过程。这个动物识别系统是识别虎、金钱豹、斑马、长颈鹿、企鹅、鸵鸟、信天翁 7 种动物的产生式系统。


    首先根据这些动物识别的专家知识，建立如下规则库：


    ![](img/image_005.jpg)![](img/image_006.jpg)


    这个系统能够识别 7 种动物，但它并不是只用了 7 条规则，而是用了 15 条。它的设计思路是这样的：先根据一些简单的特征，比如有毛发、有羽毛、会飞等把动物分成几大类，比如哺乳动物、鸟等。然后再根据更多的特征，逐步缩小范围，最后确定是哪一种动物。这样做有两个好处：一是如果已知的特征不够全面，也能得到一个大概的分类；二是如果要增加对其他动物（比如牛、马等）的识别，只需要添加一些跟它们有关的规则，比如`r`～`r`那样，而不用改动其他的规则，这样就不会增加太多的规则。`r`～`r`是给每条规则的编号，方便引用。


    915115


    假设综合数据库里有这样一些已知特征：这个动物有暗斑点、长脖子、长腿、奶、蹄，并假设综合数据库中的已知事实与规则库中的知识是从第一条开始逐条进行匹配的，则当推理开始时，推理机构的工作过程如下所述。


    首先从规则库中选取第一条规则`r`，看看它的前提条件是否能和综合数据库中已有的事实相匹配。结果发现，综合数据库中并没有“该动物有毛发”这一事实，所以`r`不能用来推理。接着选取第二条规则`r`，进行同样的操作。很明显，`r`的前提条件“该动物有奶”和综合数据库中已有的事实是一致的。继续检查其他规则，发现从`r`～`r`都不能匹配。因此，只能执行`r`这一条规则，并把它的结论“该动物是哺乳动物”添加到综合数据库中。同时，还要给`r`打上一个标记，表示它已经被使用过了，以免重复匹配。这样一来，综合数据库中的内容就变成了：该动物的特征为有暗斑点、长脖子、长腿、奶、蹄、哺乳动物。检查一下综合数据库中的内容，发现还不能确定该动物是什么种类，所以还需要继续推理。


    112231522


    接下来，分别用`r`、`r`、`r`、`r`、`r`和综合数据库中的事实进行匹配，都没有成功。但当用`r`进行匹配时，就成功了。再检查其他规则，发现从`r`～`r`都不能匹配。因此，只能执行`r`这一条规则，并把它的结论“该动物是有蹄类动物”添加到综合数据库中，并给`r`打上一个标记，表示它已经被使用过了。这样一来，综合数据库中的内容就变成了：该动物的特征为有暗斑点、长脖子、长腿、奶、蹄、哺乳动物、有蹄类动物。再次检查一下综合数据库中的内容，发现还是不能确定该动物是什么种类，所以还需要继续推理。


    13456781577


    在这个过程中，除了已经用过的`r`、`r`之外，只有`r`能够和综合数据库里的已知事实相匹配。因此，把`r`的结论加入综合数据库里。这样，综合数据库里的内容就变成了：这种动物有暗色的斑点、长长的脖子和腿、奶、蹄，是哺乳动物、有蹄类动物和长颈鹿。检查一下综合数据库里的内容，发现要识别的动物长颈鹿已经包含在里面了。所以，得出了“这种动物是长颈鹿”的最终结论。这样，问题就解决了。


    271111


    上面的问题解决过程是一个不断地从规则库里选择可用规则和综合数据库里的已知事实进行匹配的过程。每一次规则成功匹配，都会让综合数据库增加一些新的内容，并且让问题更接近解决。这个过程叫作推理，是专家系统的核心内容。当然，上面的过程只是一个简单的推理过程，后面还会对推理的相关问题进行全面的介绍。可以用普通编程语言（比如`C`、`C++`）里的`if`语句来实现产生式系统。但是当产生式规则很多时，就会出现新的问题。比如，要检查哪条规则被匹配，就需要花很长时间遍历所有的规则。所以，人们开发了一些专门用来匹配规则触发条件的快速算法，如`RETE`。这种系统内置了解决多个冲突的算法。近年来，还开发了专门用于计算机游戏开发的`RC++`。它是`C++`语言的超集，增加了控制角色行为的产生式规则，提供了反应式控制器的专用子集。


    ### 2.3.4 产生式表示法的特点


    #### 1. 产生式表示法的主要优点


    （1）自然性


    产生式表示法用“如果…，那么…”的形式来表达知识，这是人们常用的一种描述因果关系的方式，既直观、自然，又便于推理。正因为如此，产生式表示法成为人工智能中最重要和最常用的一种知识表示方法。


    （2）模块性


    产生式是规则库中最基本的知识单元，它们与推理机制相对独立，而且每条规则都有相同的形式。这样就方便了对规则进行模块化处理，为知识的增加、删除、修改带来了便利，为规则库的建立和扩展提供了可管理性。


    （3）有效性


    产生式表示法既可以表示确定性知识，也可以表示不确定性知识；既有利于表示启发式知识，也可以方便地表示过程性知识。目前已经成功建造的专家系统中，大部分是用产生式来表达它们的过程性知识的。


    （4）清晰性


    产生式有固定的格式。每一条产生式规则都由前提和结论这两部分组成，而且每一部分包含的知识量都比较少。这既便于对规则进行设计，又易于对规则库中知识的一致性和完整性进行检测。


    #### 2. 产生式表示法的主要缺点


    （1）效率不高


    产生式系统求解问题的过程是这样的：先用产生式的前提部分和综合数据库中已知事实进行匹配，找出可用的规则；然后在这些规则中按一定的策略选择一个执行；最后把执行的结果加入综合数据库中。这个过程要反复进行，直到找到问题的答案或无法继续为止。因为规则库一般都很大，而匹配又很耗时，所以这个过程的效率不高，而且可能会出现组合爆炸的问题。


    （2）不能表达具有结构性的知识


    产生式适合于表达具有因果关系的过程性知识，是一种非结构化的知识表示方法。但是对于具有结构关系的知识，例如事物之间的分类、属性、关联等，产生式就无法很好地表示。它不能把具有结构关系的事物间的区别和联系表示出来（后面介绍的框架表示法可以解决这方面的问题）。因此，产生式表示法除了可以单独使用外，还经常和其他表示法结合起来表示特定领域的知识。例如，在专家系统`PROSPECTOR`中用产生式和语义网络相结合，在`Alkins`中把产生式和框架表示法结合起来等。


    #### 3. 产生式表示法适合表示的知识


    从上面关于产生式表示法的特点可以看出，产生式表示法适合于表示具有以下几种特点的领域知识：


    1）由许多相对独立的知识元组成的领域知识，彼此间关系不密切，不存在结构关系，如化学反应方面的知识。


    2）具有经验性和不确定性的知识，而且相关领域中对这些知识没有严格、统一的理论，如医疗诊断、故障诊断等方面的知识。


    3）领域问题的求解过程可以被表示为一系列相对独立的操作，而且每个操作可以被表示为一条或多条产生式规则。


    ## 2.4 框架表示法


    1975 年，美国人工智能领域的权威明斯基提出了框架理论。他认为，人类对世界上各种事物的认识，都是以一种类似于框架的结构储存在记忆中的。当遇到一个新事物时，人类就会从记忆中找出一个合适的框架，并根据实际情况对其细节进行调整和补充，从而形成对当前事物的认识。比如，一个人在走进一个教室之前，就能根据以往对“教室”的认识，想象出这个教室大概有四面墙、门窗、天花板和地板、课桌椅、讲台、黑板等。尽管他对这个教室的具体细节，如大小、门窗个数、桌椅数量颜色等还不清楚，但对教室的基本结构是可以预见的。这是因为他通过以往看到的教室，已经在记忆中建立了关于教室的框架。这个框架不仅包含了事物的名称（教室），还包含了事物各方面的属性（如有四面墙、课桌、黑板等）。通过查找这个框架，就很容易得到教室的各个特征。当他进入教室后，通过观察得到了教室的具体细节，把它们填入教室框架中，就得到了一个具体的教室实例。这是他对这个具体教室的视觉形象，称为实例框架。


    ### 2.4.1 框架的一般结构


    框架是一种用来描述对象（事物、事件或概念）属性的数据结构。


    一个框架由若干个称为“槽”的结构组成，每个槽又可以根据需要划分为若干个“侧面”。槽用来描述对象的某一方面的属性，侧面用来描述属性的某一方面。槽和侧面的属性值分别称为槽值和侧面值。在一个用框架表示知识的系统中，通常有多个框架，每个框架都有多个不同的槽和侧面，分别用不同的框架名、槽名和侧面名表示。


    下面是框架的一般表示形式：


    ![](img/image_007.jpg)


    框架是一种表示知识的方式，它由若干个槽和侧面组成。一个框架可以有任意个槽，每个槽可以有任意个侧面，每个侧面可以有任意个值。槽值或侧面值可以是数值、字符串、布尔值等基本类型，也可以是一个动作或过程，用于在满足某个条件时执行，还可以是另一个框架的名字，从而实现框架之间的引用，表示出它们的关联。约束条件是可选的，如果没有指定约束条件，则表示没有限制。


