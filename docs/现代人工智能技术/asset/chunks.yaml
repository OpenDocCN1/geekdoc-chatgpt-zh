    为了便于理解与描述，下面给出一个纵向联邦学习架构的例子：假设有两家公司A和B想要协同地训练一个机器学习模型，每一家公司都拥有各自的数据。其中，A公司是一家电商平台，拥有用户的购物行为数据；B公司是一家金融机构，拥有用户的信用评分数据。这两家公司的数据具有相同的样本空间（即用户ID），但不同的特征空间（即购物行为和信用评分）。如果这两家公司想要利用彼此的数据来提高模型性能，但又不想泄露自己的敏感信息，就可以采用纵向联邦学习架构：


    1）A公司和B公司通过加密样本对齐找出共同的用户ID集合。具体地，A公司将自己的用户ID进行哈希处理后加密，并发送给第三方服务；B公司也将自己的用户ID进行哈希处理后加密，并发送给第三方服务；第三方服务将两边的加密数据进行比对，找出相同的部分，并返回给A公司和B公司各自对应的样本索引。


