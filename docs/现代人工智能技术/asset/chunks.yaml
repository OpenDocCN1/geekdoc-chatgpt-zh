- raw: '20世纪90年代，蚁群算法逐渐引起了很多研究者的注意，于是他们对该算法进行了各种改进并且将其应用到了其他领域，取得了较好的效果。


    ### **4.5.1 基本蚁群算法模型**


    著名的旅行商问题（TSP）就可以通过蚁群优化算法来解决，曾有学者充分利用蚁群搜索食物的过程和旅行商旅行路线之间的相似性，通过人工模拟蚂蚁觅食的过程，也就是通过一群中的个体间的信息交流和相互协作去寻找最优的旅行商路线，从而解决旅行商问题。下面便是蚁群算法解决旅行商问题的方法：


    ![](EPUB/images/image_073.jpg)


    对于旅行商问题，为不失一般性，设整个蚂蚁群体中蚂蚁的数量为*m*，城市的数量为*n*，城市*i*与城市*j*之间的距离为*d*[ij]（*i*，*j*\=1，2，…，*n*），*t*时刻城市*i*与城市*j*连接路径上的信息素浓度为*τ*[ij]（*t*）。初始时刻，蚂蚁被放置在不同的城市里，且各城市间连接路径上的信息素浓度相同，不妨设*τ*[ij]（0）=*τ*（0）。然后蚂蚁将按一定的概率选择线路，不妨设为*t*时刻蚂蚁*k*从城市*i*转移到城市*j*的概率。我们知道，“蚂蚁旅行商问题”策略会受到两方面的左右，首先是访问某城市的期望，另外便是其他蚂蚁释放的信息素浓度，所以定义：


    ![](EPUB/images/image_074.jpg)


    式中，*η*[ij]（*t*）为启发函数，表示蚂蚁从一个城市*i*转移到城市*j*的期望程度；allow[k]（*k*\=1，2，…，*m*）为蚂蚁*k*待访问城市集合，开始时，allow[k]中有*n*\-1个元素，即包括除了蚂蚁*k*出发城市的其他城市，随着时间的推移，allow[k]中的元素越来越少，直至为空；*α*为信息素重要程度因子，简称信息度因子，其值越大，就表示信息影响强度越大；*β*为启发函数重要程度因子，简称启发函数因子，其值越大，表明启发函数的影响越大。


    在蚂蚁遍历城市的过程中，与实际情况相似的是，蚂蚁释放信息素的同时，各城市间连接路径上的信息素强度也在通过挥发等方式逐渐消失。为了描述这一特征，不妨用*p*（0<*p*<1）表示信息素的挥发程度。这样，当所有蚂蚁完整走完一遍所有城市后，各个城市间连接路径的信息素浓度为


    ![](EPUB/images/image_075.jpg)![](EPUB/images/image_076.jpg)


    式中，为第*k*只蚂蚁在城市*i*和城市*j*连接路径上释放信息素而增加的信息素浓度；Δ*τ*[ij]为所有蚂蚁在城市*i*和城市*j*连接路径上释放信息素而增加的信息素浓度。


    ![](EPUB/images/image_077.jpg)


    一般的值可由蚂蚁圈系统模型进行计算：


    ![](EPUB/images/image_078.jpg)


    式中，*Q*为信息素常数，表示蚂蚁循环一次所释放的信息素总量；*L*[k]为第*k*只蚂蚁经过路径的总长度。


    除此之外还有蚂蚁数量系统和蚂蚁密度系统，如下所示：


    ![](EPUB/images/image_079.jpg)![](EPUB/images/image_080.jpg)![](EPUB/images/image_081.jpg)


    比较三种方法，蚂蚁圈系统的效果更好，这是因为它利用的是全局信息*Q/L*[k]，而其余两种算法用的是局部信息*Q/d*[ij]和*Q*。全局信息更新方法很好地保证了残留信息素不至于无限积累，如果路径没有被选中，那么上面的残留信息素会随着时间的推移而逐渐减弱，这使算法能忘记不好的路径。即使路径经常被访问也不至于因为的累积，而产生*η*[ij]（*t*）使期望值的作用无法体现，这充分体现了算法中全局范围内较短路径（较好解）的生存能力，加强了信息正反馈性能，提高了系统搜索收敛的速度。因而，在蚁群算法中，通常采用蚂蚁圈系统作为基本的模型。


    ### **4.5.2 蚁群算法的参数选择**


    从一群搜索最短路径的机理中不难看出，算法中有关参数的不同选择对蚁群算法的性能有至关重要的作用，但目前其选取的方法和原则没有理论依据，通常都是根据经验而定的。


    信息素启发因子*α*的大小反映了蚁群在路径搜索中随机性因素作用的强度，其值越大，蚂蚁选择以前走过的路径的可能性越大，搜索的随机性减弱；当*α*过大时，会使蚁群的搜索过早限于局部最优。


    期望值启发式因子*β*的大小反映了蚁群在路径搜索中先验性、确定性因素作用的强度，其值越大，蚂蚁在某个局部点上选择局部最短路径的可能性越大，虽然搜索的收敛速度得以加快，但蚁群在最优路径的搜索过程中随机性减弱，易于陷入局部最优。


    蚁群算法的全局寻优性能，首先要求蚁群的搜索过程中必须有很强的随机性；而蚁群算法的快速收敛性，又要求蚁群的搜索过程必须要有较高的确定性。因此，*α*和*β*对蚁群算法性能的影响和作用是相互配合、密切相关的。


    信息素挥发度1*\-ρ*的大小直接关系到蚁群算法的全局搜索能力及其收敛速度。由于信息素挥发度1*\-ρ*的存在，当要处理的问题规模比较大时，会使那些从未被搜索的路径（可行解）上的信息素减少到接近于0，因此降低了算法的全局搜索能力；当1*\-ρ*过大时，以前搜索过的路径被再次选择的可能性过大，也会影响到算法的随机性能和全局搜索能力；反之，减少信息素挥发度1*\-ρ*虽然可以提高算法的随即性能和全局搜索能力，但也会使算法的收敛速度降低。


    总信息素量*Q*为蚂蚁循环一周时释放在所经路径上的信息素总量。总信息素量越大，则在蚂蚁已经走过的路径上信息素的累积越快，可以加强蚁群搜索时的正反馈性能，有助于算法的快速收敛。由于在蚁群算法中各个算法参数的作用实际上是紧密结合的，其中对算法性能起着主要作用的应该是信息素启发式因子*α*、期望启发式因子*β*和信息素残留常数*ρ*三个参数。总信息量*Q*对算法性能的影响则有赖于上述三个参数的配置以及算法模型的选取。


    ## **4.6 小结**


    **1. 遗传算法**


    遗传算法的设计包括编码、适应度函数、选择、控制参数、交叉与变异等遗传算子等。


    遗传算法常用的编码方案有二进制编码、实数编码等。


    遗传算法中初始种群中的个体可以是随机产生的。种群规模太小时，遗传算法的优化性能一般不会太好，容易陷入局部最优解；而当种群规模太大时，则计算复杂。


    遗传算法的适应度函数是用来区分种群中的个体好坏的标准。适应度函数一般由目标函数变换得到，但必须将目标函数转换为求最大值的形式，而且保证函数值必须非负。


    个体选择概率的常用分配函数有适应度比例方法、排序方法等。选择个体方法主要有轮盘赌选择、最佳个体保存方法等。


    变异操作主要有位点变异、逆转变异、插入变异、互换变异、移动变异等变异方法。


    **2. 粒子群优化算法**


    1）初始化每个粒子，即在允许范围内随机设置每个粒子的初始位置和速度。


    2）评价每个粒子的适应度，计算每个粒子的目标函数。


    3）设置每个粒子经历的最好的位置*P*[i]。对每个粒子，将其适应度与其所经历的最好的位置*P*[i]进行比较，如果优于*P*[i]，则将其作为该粒子的最好的位置*P*[i]。


    4）设置全局最优值*P*[g]。对每个粒子，将其适应度与群体经历过的最好的位置*P*[g]进行比较，如果优于*P*[g]，则将其作为当前群体的最好位置*P*[g]。


    5）可以根据粒子速度更新公式和位置更新公式去更新粒子的速度和位置。


    6）检查终止条件。如果未达到设定条件（预设误差或者迭代的次数），则返回第2）步。


    **3. 蚁群算法**


    蚂蚁在运动过程中，是根据路径上的信息素的多少来判断路径选择的。


    在*t*时刻蚂蚁*k*选择从城市*i*到城市*j*的概率为


    ![](EPUB/images/image_082.jpg)


    *α*的值越大，则该蚂蚁越倾向于选择其他蚂蚁经过的路径，该状态转移概率就越接近于贪婪规则。


