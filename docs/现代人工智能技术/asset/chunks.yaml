    ### **5.3.4 比较检验**


    有了实验评估方法和性能度量，看起来就能对学习器的性能进行评估比较了。先使用某种实验评估方法测得学习器的某个性能度量结果，然后对这些结果进行比较。但怎么来做这个比较呢？是直接取得性能度量的值然后比大小吗？实际上，机器学习中性能比较这件事要比大家想象中的复杂得多。这里面涉及几个重要因素：第一，我们希望比较的是泛化性能，然而通过实验评估方法获得的是测试集上的性能，两者的对比结果可能未必相同；第二，测试集上的性能与测试集本身的选择有很大的关系，且使用不同大小的测试集会得到不同的结果，即便使用相同大小的测试集，若包含的测试样例不同，测试结果也会有不同；第三，很多机器学习算法本身有一定的随机性，即便用相同的参数设置在同一个测试集上多次运行，其结果也会有不同。那么，有没有适当的方法对学习器的性能进行比较呢？


    统计假设检验为我们进行学习器性能比较提供了重要依据。基于统计假设检验结果我们可推断出，若在测试集上观察到学习器*A*比*B*好，则*A*的泛化性能是否在统计意义上优于*B*，以及这个结论的把握有多大。本节我们将介绍两种最基本的假设检验，除此之外，还有McNemar检验、Friedman检验与Nemenyi后续检验等几种常用的机器学习性能比较方法。为便于讨论，本节默认以错误率为性能度量，用*ε*表示。


    **1. 假设检验和*****t*****检验**'
  fmt: '

    与留出法相似，将数据集`D`划分为`k`个子集同样存在多种划分方式。为减小因样本划分不同而引入的差别，`k`折交叉验证通常要随机使用不同的划分重复`p`次，最终的评估结果是这`p`次`k`折交叉验证结果的均值，例如常见的有10次10折交叉验证。


    假定数据集`D`中包含`m`个样本，若令`k`=`m`，则得到了交叉验证法的一个特例：留一法。显然，留一法不受随机样本划分方式的影响，因为`m`个样本只有唯一的方式划分为`m`个子集，即每个子集包含一个样本；留一法使用的训练集与初始数据集相比只少了一个样本，这就使得在绝大多数情况下，留一法中被实际评估的模型与期望评估的用`D`训练出的模型很相似。因此，留一法的评估结果往往被认为比较准确。然而，留一法也有其缺陷：在数据集比较大时，训练`m`个模型的计算开销可能是难以忍受的（例如数据集包含100万个样本，则需训练100万个模型），而这还是在未考虑算法调参的情况下。另外，留一法的估计结果也未必永远比其他评估方法准确；“没有免费的午餐”定理对实验评估方法同样适用。


    ### 3. 自助法


    我们希望评估的是用`D`训练出的模型。但在留出法和交叉验证法中，由于保留了一部分样本用于测试，因此实际评估的模型所使用的训练集比`D`小，这必然会引入一些因训练样本规模不同而导致的估计偏差。留一法受训练样本规模变化的影响较小，但计算复杂度又太高了。如何减少训练样本规模不同造成的影响，同时还能比较高效地进行实验估计呢？


    ![](EPUB/images/image_112.jpg)


    自助法是一个比较好的解决方案，它直接以自助采样为基础 ^([⁹](#fn9))


    ![](EPUB/images/image_113.jpg)


    即通过自助采样，初始数据集`D`中约有36.8%的样本未出现在采样数据集`D′`中。于是我们可将`D′`用作训练集，`D\D′`用作测试集；这样，实际评估的模型与期望评估的模型都使用`m`个训练样本，而我们仍有数据总量约1/3的、没在训练集中出现的样本用于测试。这样的测试结果，也称为包外估计。


    自助法在数据集较小、难以有效划分训练/测试集时很有用；此外，自助法能从初始数据集中产生多个不同的训练集，这对集成学习等方法有很大的好处。然而，自助法产生的数据集改变了初始数据集的分布，这会引入估计偏差。因此，在初始数据量足够时，留出法和交叉验证法更常用一些。


    ## 5.3.2 调参与最终模型


    大多数学习算法都需要对一些参数进行设定，参数配置不同，学得模型的性能往往有显著差别。因此，在进行模型评估与选择时，除了要对适用学习算法进行选择，还需对算法参数进行设定，这就是通常所说的参数调节或简称为调参。


    对每种参数配置都训练出模型，然后把对应最好模型的参数作为结果。这样的考虑基本是正确的，但有一点需注意：学习算法的很多参数是在实数范围内取值，因此，对每种参数配置都训练出模型来是不可行的。现实中常用的做法是对每个参数选定一个范围和变化步长，这样选定的参数值往往不是最佳值，但这是在计算开销和性能估计之间进行折中的结果，通过这个折中，学习过程才变得可行。事实上，即便在进行这样的折中后，调参往往仍很困难。可以想象，很多强大的学习算法有大量参数需设定，这将导致极大的调参工程量，以至于在不少应用任务中，参数调得好不好往往对最终模型性能有关键性的影响。


    在模型评估与选择过程中由于需要留出一部分数据进行评估测试，事实上我们只使用了一部分数据训练模型。因此，在模型选择完成后，学习算法和参数配置已选定，此时应该用数据集重新训练模型。这个模型在训练过程中使用了所有样本，这才是我们最终提交给用户的模型。


    ## 5.3.3 性能度量


    对学习器的泛化性能进行评估，不仅需要有效可行的实验估计方法，还需要有衡量模型泛化能力的评价标准，这就是性能度量。性能度量反映了任务需求，在对比不同模型的能力时，使用不同的性能度量往往会导致不同的评判结果；这意味着模型的好坏是相对的，什么样的模型是好的呢？这不仅取决于算法和数据，还决定于任务需求。


    在预测任务中，给定样例集`D`={（`x`，`y`），（`x`，`y`），…，（`x[m]`，`y[m]`）}，其中`y[i]`是示例`x[i]`的真实标记。要评估学习器`f`的性能，就要把学习器的预测结果`f(x)`与真实标记`y`进行比较。


