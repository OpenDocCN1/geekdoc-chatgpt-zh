    式中，`η`是学习率；`ΔF(w[t])`是第`t`轮迭代中全局损失函数的梯度。然而，由于各个参与者的数据是分散的，无法直接计算全局损失函数的梯度。因此，联邦平均算法采用了一种近似的方法，即


