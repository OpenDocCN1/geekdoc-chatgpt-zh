  trans: '


    （∀ `x`）\[`Worker`（`x`）→`Fix`（`x`，`Engine`）\]


    ②存在量词（∃ `x`）：表示“在个体域中存在个体`x`”。例如：


    “2 号房间有个人”可表示为


    （∃ `x`）`InRoom`（`x`，`p1`）


    “某个工人操作引擎”可表示为


    （∃ `x`）\[`Worker`（`x`）→`Fix`（`x`，`Engine`）\]


    全称量词和存在量词可以同时出现在命题中。例如，设谓词`F`（`x`，`y`）表示`x`与`y`是朋友，则：


    （∀ `x`）（∃ `y`）`F`（`x`，`y`）表示对于个体域中的任何个体`x`，都存在个体`y`，使得`x`与`y`是朋友。


    （∃ `x`）（∀ `y`）`F`（`x`，`y`）表示在个体域中存在个体`x`，与个体域中的任何个体`y`都是朋友。


    （∃ `x`）（∃ `y`）`F`（`x`，`y`）表示在个体域中存在两个个体`x`和`y`，使得`x`与`y`是朋友。


    （∀ `x`）（∀ `y`）`F`（`x`，`y`）表示对于个体域中的任何两个个体`x`和`y`，都有`x`与`y`是朋友。


    当全称量词和存在量词同时出现在一个命题中时，量词的顺序会影响命题的意义。例如：


    （∀ `x`）（∃ `y`）（`Employee`（`x`）→`Manager`（`y`，`x`））表示“每个被雇佣者都有一个直属经理”；


