    对于离散函数，假设有两个离散序列`x(n)`和`h(n)`，假设它们的卷积结果是`y(n)`，那么可以用公式表达为


    ![](EPUB/images/image_266.jpg)


    如果想要简单地理解卷积的作用，可以把卷积设想为对两个函数的所有位置进行乘积叠加运算。


    对于卷积神经网络来说，比较高阶的运算更加有用。本节中，主要涉及的是二维卷积神经网络。在这里笔者先给出二维卷积计算公式，后面涉及具体的卷积神经网络时再进行详细介绍。


    有一个二维图像`I`和一个二维的卷积核`K`，卷积结果是`y`，那么卷积的结果可以表达为


    ![](EPUB/images/image_267.jpg)


    ### 6.4.2 卷积神经网络的产生动机


    二维卷积是卷积神经网络的理论基础，卷积运算中有三个十分重要的数学思想，有助于改进机器学习系统。分别是稀疏交互、参数共享和等变表示。


    在线性神经网络或者多层感知机中，比如最常用的`MLP`模型，在这个模型中，就可以看到输入层到隐藏层，再从隐藏层到输出层，每一个单元之间都有一个交互过程（可以简单地理解为有一个权重参数），这样的模型在输入较小规模的情况下是可以接受的，比如一些电力数据集。但是当数据集的规模增大到图片数据集的时候，这样的模型是很难完成训练和应用于实际的，无论是待更新参数的数量还是所需要调用的硬件资源都是庞大的，显然是不合实际的。


    在图像输入的时候，每一张图片有成千上万个像素点。一张图片中并不是所有的像素点都对神经网络训练是有意义的。卷积核的存在可以只收集有用的一些像素点，这样的话降低了训练参数，减少了待更新参数，减少了模型的储存需求。对于实际的训练来说，减少几个数量级的训练参数往往会提升训练效果。在实际训练中，调整卷积核的尺寸也可以训练出不同的效果。


    除了卷积核与输入层的稀疏交互，卷积核的存在也可以实现所谓的参数共享。在传统的神经网络中，单元之间的参数都只用一次，也就是在两个节点之间就只有一组待更新参数。但是当使用卷积核的时候，训练模型可以保证只需学习一个参数集合，不用像传统神经网络那样每一个位置都要学习一个单独的参数集合，这样的结果可以保证减少多余参数的储存量，并且通过参数共享，可以有效地提升网络模型的训练效果。


    对于卷积来说，参数共享的特殊形式使得神经网络层具有对平移的等变表示。具体用函数可以这样表示，如果函数`f(x)`和函数`g(x)`满足`f(g(x))`=
    `g(f(x))`，那么就可以说函数`f(x)`和函数`g(x)`满足等变性。具体到卷积神经网络上来说，图像像素点经过平移变成一种形式再进行卷积的结果和图像先卷积再进行平移所得到的结果相同。当然并不是对所有图像处理方式等变表示都成立，比如图像的放缩或者旋转变换等是不成立的，不过实际上我们可以通过数学推导来表示出来。


    ### 6.4.3 卷积神经网络的结构


    卷积神经网络是一个比较复杂的网络，它包括输入层、卷积层、激活层、池化层、输出层等，所以为了更好地分析各网络层对神经网络的影响，需要了解一些具体的实现方法，比如在卷积层层面上的填充和步幅，在池化层上的池化操作，以及输出层上使用`MLP`或者其他神经网络。


    #### 1. 填充和步幅


    填充和步幅是输入层和卷积核上的操作，是可以改变卷积层尺寸的操作。如图6-12所示，我们需要考虑卷积核和输入层的那些位置的数进行运算操作。在上节中介绍卷积运算的时候，自然而然地想到将卷积核沿着输入层从一端按照向右的方式每移动一次得到新的卷积结果，等到了另一端，再往下一步，然后从最左端再向右一步得到对应位置的卷积结果。


    但这是对二维卷积运算的解释，在实际的卷积网络中，我们需要考虑到数据集的影响，可能这个时候卷积核的步幅就不止一步了，合适的步幅可以有效地减少模型数量，提高模型训练的速度和训练的质量。


    所谓填充，就是对于输入层的边缘位置增加需要数量的元素，当然通常都是0元素。所带来的影响就是下一层的形状发生变化。


    在没有填充的情况下，如图6-12所示，我们首先将输入层的形状设为`n×n`，卷积核的形状设为`k×k`，这样的话输出的形状就是（`n-k+1`）×（`n-k+1`）。


    在有填充的情况下可以如图6-13所示，填充的行数为`p`，填充的列数为`p`，卷积核的形状不发生变化，那么输出的形状就是（`n-k+p+1`）×（`n-k+p+1`）。填充的作用不仅改变了输出的形状，还可以提升对边缘数据的检测效果。


    ![](EPUB/images/image_268.jpg)


    ▲图6-12 卷积示意图


    ![](EPUB/images/image_269.jpg)


    ▲图6-13 卷积填充示意图


    关于步幅，对于神经网络的某一层进行卷积处理的时候，需要去考虑卷积核的移动步幅，也就是决定处理卷积层的稀疏程度。如果按照步幅为1的方式移动卷积核，那么卷积之后得到的输出层尺寸还是较大，但是如果卷积核的步幅大于2的时候，卷积之后的输出层尺寸就会很快缩小。


    在填充的基础上，设置高上步幅为`s`，宽上步幅为`s`，卷积结果为［（`n-k+p+s`）/`s`］×［（`n-k+p+s`）/`s`］。另外如果最后一步可移动步数小于步幅的时候，则会舍弃这一步。


    #### 2. 池化


    池化是卷积神经网络中经常用到的一种处理输入的方法。一般用于卷积层之间，目的是为了减少待更新参数的数量，可以有效地加快神经网络训练速度及防止过拟合。


    在神经网络中，池化函数可以近似地保证输入的不变性。所谓近似不变，也就是说对输入进行少量平移的时候，输出的结果性质上不会发生变化。


    池化的操作一般分为最大化池化和平均化池化两种。最大化池化示意图如图6-14所示，平均化池化示意图如图6-15所示。


    可以看到，池化和卷积的计算方式相似，进行最大化池化操作的时候，池化层得到的结果就是每一个边框内部的最大值。最大化池化操作可以尽可能保持相同位置的信息。


