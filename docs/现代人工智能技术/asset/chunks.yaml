    需要注意的是，这种算法也会产生两个子代，另一个子代生成的过程则完全相同，只需要将两个父代染色体交换位置，第一步选中的基因型位置相同，本例中的另一个子代为254913678。


    与部分映射交叉不同的是，不用进行冲突检测工作（实际上也只有部分映射交叉需要冲突检测工作）。


    #### （5）定位交叉

    第一步，选择一对染色体（父代）中的几个基因，位置不可以连续，两个染色体被选择的位置要相同：


