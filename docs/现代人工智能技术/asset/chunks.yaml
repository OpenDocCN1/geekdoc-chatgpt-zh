    ### 推论 1

    设`C`和`C`是子句集`S`中的两个子句，`C`是它们的归结式，若用`C`代替`C`和`C`后得到新子句集`S`，则由`S`的不可满足性可推出原子句集`S`的不可满足性，即

    `S`的不可满足性⇒`S`的不可满足性


    ### 推论 2

    设`C`和`C`是子句集`S`中的两个子句，`C`是它们的归结式，若把`C`加入原子句集`S`中，得到新子句集`S`，则`S`与`S`在不可满足的意义上是等价的，即

    `S`的不可满足性⇒`S`的不可满足性


