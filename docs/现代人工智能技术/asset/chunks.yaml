    **2. 包裹式特征选择**


    过滤式特征选择使用相关统计量分量来对特征进行评价，而包裹式特征选择则直接把最终将要使用的学习器的性能作为特征子集的评价准则。


    一般而言，由于包裹式特征选择方法直接针对给定学习器进行优化，因此从最终学习器性能来看，包裹式特征选择比过滤式特征选择更好，但另一方面，由于在特征选择过程中需多次训练学习器，因此包裹式特征选择的计算开销通常比过滤式特征选择大得多。


    LVW（Las Vegas Wrapper）是一个典型的包裹式特征选择方法。它在拉斯维加斯方法（Las Vegas Method）框架下使用随机策略来进行子集搜索，并以最终分类器的误差为特征子集评价准则。


    需注意的是，由于LVW算法中特征子集搜索采用了随机策略，而每次特征子集评价都需训练学习器，计算开销很大，因此算法设置了停止条件控制参数*T*，然而，整个LVW算法是基于拉斯维加斯方法框架，若初始特征数很多、*T*设置较大，则算法可能运行很长时间都达不到停止条件。换言之，若有运行时间限制，则有可能给不出解。


    除此之外，还可以采取完全搜索，即穷举的策略。递归特征消除法使用一个基模型来进行多轮训练，每轮训练后，消除若干权值系数的特征，再基于新的特征集进行下一轮训练；递归特征消除法使用基模型在训练中进行迭代，选择不同特征构建单个特征的模型，通过模型的准确性为特征排序，借此来选择特征。


    也可采取启发式搜索，即贪心策略。前向选择法从0开始不断向模型加能最大限度提升模型效果的特征数据用以训练，直到任何训练数据都无法提升模型表现。后向剃除法先用所有特征数据进行建模，再逐一丢弃贡献最低的特征来提升模型效果，直到模型效果收敛。启发式搜索直接面向算法优化，不需要太多的知识，但其有庞大的搜索空间，且需要定义启发式策略。


