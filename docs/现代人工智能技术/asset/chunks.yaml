    ##### (2) 混淆电路


    混淆电路是双方进行安全计算的布尔电路，核心技术是将两方参与的安全计算函数编译成布尔电路的形式，并将真值表加密打乱，从而实现电路的正常输出而又不泄露参与计算的双方私有信息。


    可将整个计算过程分为两个阶段：第一阶段将安全计算函数转换为电路，称为电路产生阶段；第二阶段利用不经意传输、加密等密码学原语等执行电路，称为执行阶段。每一阶段由参与运算的一方来负责，直至电路执行完毕输出运算后的结果。针对参与运算的双方，从参与者的视角，又可以将参与安全运算的双方分为电路的产生者与电路的执行者。混淆电路示意图如图9-8所示。


