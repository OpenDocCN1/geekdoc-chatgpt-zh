    ### **5.2.4 特征选择**


    我们将属性称为特征，对当前学习任务有用的属性称为相关特征，没什么用的属性称为无关特征。从给定的特征集合中选择出相关特征子集的过程，称为特征选择。


    显然遍历所有可能的子集来选取一个包含所有重要信息的特征子集是不可行的，因为这样做会遭遇组合爆炸，特征个数稍多就无法进行。可行的做法是产生一个候选子集，评价出它的好坏，基于评价结果产生下一个候选子集，再对其进行评价，这个过程持续进行下去，直至无法找到更好的候选子集为止。


    第一个关键环节是子集搜索问题。给定特征集合{*a*，*a*，…，*a*[d]}，我们可将每个特征看作一个候选子集，对这个候选单特征子集进行评价，假定{*a*}最优，于是则将{*a*}作为第一轮的选定集；然后，在上一轮的选定集中加入一个特征，构成包含两个特征的候选子集，假定在这*d*\-1候选两特征子集中{*a*，*a*}最优，且优于{*a*}，则将{*a*，*a*}作为本轮的选定集，假定在第*k*+1轮时，最优的候选（*k*+1）特征子集不如上一轮的选定集时，则停止生成候选子集，并将上一轮选定的特征集合作为特征选择结果。这样逐渐增加相关特征的策略称为前向搜索。类似地，若我们从完整的特征集合开始，每次尝试去掉一个无关特征，这样逐渐减少特征的策略称为后向搜索。还可将前向与后向搜索结合起来，每一轮逐渐增加选定相关特征（这些特征在后续轮中将确定不会被去除）、同时减少无关特征，这样的策略称为双向搜索。


    122224224


    显然，上述策略都是贪心的，因为它们仅考虑了使本轮选定集最优，例如在第三轮假定选择*a*优于*a*，于是选定集为{*a*，*a*，*a*}，然而在第四轮却可能是{*a*，*a*，*a*，*a*}比所有的{*a*，*a*，*a*，*a*[i]}都更优。遗憾的是，若不进行穷举搜索，则这样的问题无法避免。


