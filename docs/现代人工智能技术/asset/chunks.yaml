    # **第9章**


    # **联邦学习**


    本章首先介绍了联邦学习的概念，接着介绍了隐私保护技术和激励机制，最后介绍了横向联邦学习、纵向联邦学习、联邦迁移学习三种基本技术。


    ## **9.1 联邦学习的概念**


    ### **9.1.1 人工智能面临的挑战**


    2016年是人工智能（Artificial Intelligence，AI）走向成熟的一年。随着AlphaGo击败人类顶尖的围棋棋手，AI的巨大潜力被见证，人们开始期望有更多、更复杂、更先进的AI技术被应用在生活当中。近些年来，机器学习（Machine Learning，ML）无疑是AI应用领域的热点话题，在推荐系统、自然语言处理、语音识别、机器视觉等多领域中迅猛发展，并取得了不小的突破。需要注意的是，这些AI技术的成功应用，离不开大量数据的支撑。通过大数据的使用，这些AI系统才能够实现许多人类难以完成的任务。例如，2016年AlphaGo总共使用了30万个棋局作为训练数据，最终取得出色的成绩；Facebook公司的目标检测系统则利用来自Instagram的3.5亿张图像数据集进行训练得到。


    遗憾的是，虽然已经有了诸如AlphaGo的AI技术成功应用的例子，但想要让此类大数据驱动型AI在我们生活的各个方面早日实现还是十分困难的。首当其冲的就是数据的获取。除少数行业外，大多数领域通常只能得到小数据，即数据有限或数据质量较差。因此，这一个个小数据就好像是数据海洋中的一个个孤立的小岛，无法聚合在一起发挥作用。那能否通过跨组织的数据传输，将一个个孤岛桥接起来，把数据融合在一个公共的站点中？这个想法很好，但实际上，要打破不同数据源之间的障碍在大多数情况下都是十分困难的。通常，任何AI项目中所需的数据都涉及多种类型。例如，在AI驱动的产品推荐服务中，产品卖方拥有有关产品的信息、用户购买的数据，但没有描述用户购买能力和付款习惯的数据。由于行业竞争、隐私安全和复杂的管理程序，即使同一公司的不同部门之间的数据集成也面临着巨大的阻力。因此，大数量、高质量的训练数据通常是很难获得的，所有AI技术研发应用者们不得不面对难以桥接的数据孤岛。


    同时，随着大型公司对数据安全和用户隐私的妥协意识日益增强，对数据隐私和安全的重视已成为全球性的主要问题。在法律层面，法规制定者和监管机构正在考虑出台新的法律来规范数据的管理和使用，例如，欧盟于2018年5月25日实施的《通用数据保护条例》（General Data Protection Regulation，GDPR）；美国于2020年1月在加利福尼亚州实施的《加利福尼亚州消费者隐私法》（California Consumer Privacy Act，CCPA）；中国于2017年颁布的《中华人民共和国民法通则》和《中华人民共和国网络安全法》同样对数据的收集和处理提出了严格的约束和控制要求。这些法规的建立显然将有助于建立一个更加文明的社会，但也将给当今AI中普遍使用的数据交互带来新的挑战。


    AI中的传统数据处理模型通常涉及简单的数据交互模型，其中一方收集数据并将其传输到另一方，而另一方将负责整理和融合数据。最后，第三方将获取集成数据并构建模型，以供其他各方使用。模型通常是作为服务出售的最终产品。在如今的法律环境下，不同组织间的数据收集和分享工作会越来越困难，某些高度敏感的数据（例如，金融交易数据和医疗健康数据等）的拥有者也会极力反对无限制地使用这些数据进行训练。更关键的是，以往的传统程序面临着新数据法规和法律的挑战，我们的数据是孤立的孤岛形式，但是在许多情况下，我们被禁止在不同地方收集、融合和使用数据进行AI处理。如何合法地解决数据碎片和隔离问题是AI研究人员和从业人员面临的主要挑战。


    ### **9.1.2 联邦学习的定义**


    如上文所述，为了解决由数据孤岛所带来的模型训练问题，人们开始寻找一种不必将所有数据集中到一个中心储存点就能完成训练的方法。联邦学习（Federated Learning，FL）便应运而生，其核心思想是：每一个小数据源的所有者自己训练一个小模型，各个所有者交换模型信息，最终通过模型聚合得到一个全局模型。整个过程中不涉及所有者本身的数据交互，模型信息的交换过程也被精心设计，以保证用户隐私和数据安全。


    联邦学习最初由McMahan等人 ^([^(19)](#fn19))


    更一般地，假设有*N*个数据所有者{*F*，*F*，…，*F*[N]}，他们希望用各自的数据{*D*，*D*，…，*D*[N]}共同训练一个机器学习模型。传统方法是将所有的数据集合在一起得到*D*\=*D*∪…∪*D*[N]，储存在一个中心储存点中，从而在该中心储存点上使用集中后的数据集*D*训练得到所需的模型*M*。在传统方法中，任何数据所有者*F*[i]都面临着将自己的数据*D*[i]暴露给中心储存节点甚至其他数据所有者的风险。联邦学习方法则是每个数据所有者*F*[i]利用自己的数据*D*[i]训练小模型*M*[i]，利用这些小模型{*M*，*M*，…，*M*[N]}交互聚合得到最终的模型*M*。在联邦学习方法中，任何数据所有者*F*[i]都不会将其数据*D*[i]暴露给其他人。设*ν*和*ν*分别为模型*M*和*M*的精度值，那么对于任意*δ*＞0，有


