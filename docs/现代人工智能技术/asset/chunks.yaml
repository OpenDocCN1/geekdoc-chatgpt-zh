    （∀ `x`）（∃ `y`）`Love`（`x`，`y`）表示“每个人都有喜欢的人”；


    （∃ `y`）（∀ `x`）`Love`（`x`，`y`）则表示“有的人是大家都喜欢的”。


    ### 3. 谓词公式


    #### 定义 2.2

    谓词公式是按照如下规则构造的表达式，其中包含谓词符号、常量符号、变量符号、函数符号以及括号、逗号等符号：


    ①单个谓词是原子谓词公式，也是谓词公式。

    ②如果`A`是谓词公式，那么﹁`A`也是谓词公式。

    ③如果`A`和`B`都是谓词公式，那么`A`∧`B`、`A`∨`B`、`A`→`B`、`A`↔`B`也都是谓词公式。

    ④如果`A`是谓词公式，那么（∀ `x`）`A`、（∃ `x`）`A`也都是谓词公式。

    ⑤有限次地使用①～④中的规则生成的表达式也是谓词公式。

    ⑥在谓词公式中，连接词的优先级别由高到低依次为

    ﹁，∧，∨，→，↔


    ### 4. 量词的辖域


    量词后面跟着的单个谓词或者用括号括起来的谓词公式称为量词的辖域。在辖域内，与量词相同的变量称为约束变量，而不受量词约束的变量称为自由变量。


    例如：


    （∃ `x`）（`P`（`x`，`y`））∨`R`（`x`，`y`）


    （∃ `x`）（`P`（`x`，`y`））∨`R`（`x`，`y`）是（∃ `x`）的辖域，辖域内的变量`x`是受（∃ `x`）约束的变量，而`R`（`x`，`y`）中的`x`是自由变量。公式中所有的`y`都是自由变量。


    在谓词公式中，变量的名称是任意的，可以用一个名称替换另一个名称。但是，当对量词辖域内的约束变量更名时，必须把同名的约束变量都统一改成相同的名称，并且不能与辖域内的自由变量同名；当对辖域内的自由变量更名时，不能改成与约束变量相同的名称。例如，对于公式（∃
    `x`）（`P`（`x`，`y`）），可以更名为（∃ `z`）（`Q`（`z`，`t`）），这里把约束变量`x`改成了`z`，把自由变量`y`改成了`t`。再例如，对于公式（∀
    `t`）`Q`（`t`，`x`），可以更名为（∀ `y`）`P`（`y`，`z`），这里把约束变量`t`改成了`y`，把自由变量`x`改成了`z`。


    ## 2.2.4 谓词公式的性质


    ### 1. 谓词公式的解释


    在命题逻辑中，对命题公式中每个命题变量赋予一个真值（T 或 F）的过程称为命题公式的一个解释。给定一个命题公式，根据连接词的定义就可以计算出它的真值。


    在谓词逻辑中，由于公式中可能含有个体变量和函数，因此不能像命题公式那样直接进行真值赋值，而需要先确定个体变量和函数在个体域中的对应关系，然后再根据每个谓词的含义为其赋予真值。由于存在多种可能的对应关系，所以一个谓词公式可能有多个解释。对于每个解释，谓词公式都可以得到一个真值（T
    或 F）。


    ### 2. 谓词公式的永真性、可满足性、不可满足性


    #### 定义 2.3

    对于谓词公式`P`，如果它在个体域`D`上的所有解释下都为真，则称`P`在`D`上是永真的；如果`P`在任意非空个体域上都是永真的，则称`P`是永真的。


    #### 定义 2.4

    对于谓词公式`P`，如果它在个体域`D`上的所有解释下都为假，则称`P`在`D`上是永假的；如果`P`在任意非空个体域上都是永假的，则称`P`是永假的。


    由此可见，要判断一个公式是否永真，需要对每个个体域上的所有解释进行检验。当解释的数量无限时，公式的永真性就难以确定了。


    #### 定义 2.5

    对于谓词公式`P`，如果存在至少一个解释使得`P`在该解释下为真，则称`P`是可满足的；否则，称`P`是不可满足的。


    ### 3. 谓词公式的等价性


    #### 定义 2.6

    设`P`和`Q`是两个谓词公式，它们具有相同的个体域`D`。如果对于`D`上的任意一个解释，`P`和`Q`都具有相同的真值，那么称`P`和`Q`在`D`上是等价的。如果对于任意的个体域`D`，`P`和`Q`都是等价的，那么称`P`和`Q`是等价的，并记作`P`≡`Q`。


    下面列出经常会用到的一些主要等价式：


    （1）交换律

    `P` ∨ `Q` ⇔ `Q` ∨ `P`

    `P` ∧ `Q` ⇔ `Q` ∧ `P`


    （2）结合律

    （`P` ∨ `Q`）∨ `R` ⇔ `P` ∨（`Q` ∨ `R`）

    （`P` ∧ `Q`）∧ `R` ⇔ `P` ∧（`Q` ∧ `R`）


    （3）分配律

    `P` ∨（`Q` ∧ `R`）⇔（`P` ∨ `Q`）∧（`P` ∨ `R`）

    `P` ∧（`Q` ∨ `R`）⇔（`P` ∧ `Q`）∨（`P` ∧ `R`）


    （4）德摩根律

    ﹁（`P` ∨ `Q`）⇔﹁`P` ∧﹁`Q`

    ﹁（`P` ∧ `Q`）⇔﹁`P` ∨﹁`Q`


    （5）双重否定率（对合率）

    ﹁﹁`P` ⇔ `P`


    （6）吸收率

    `P` ∨（`P` ∧ `Q`）⇔ `P`

    `P` ∧（`P` ∨ `Q`）⇔ `P`


    （7）补余率（否定率）

    `P` ∨﹁`P` ⇔ `T`

    `P` ∧﹁`P` ⇔ `F`


    （8）连接词化规律

    `P`→`Q` ⇔﹁`P` ∨ `Q`


    （9）逆否律

    `P`→`Q` ⇔﹁`Q`→﹁`P`


    （10）量词转化律

    ﹁（∃ `x`）`P` ⇔（∀ `x`）（﹁`P`）

    ﹁（∀ `x`）`P` ⇔（∃ `x`）（﹁`P`）


    （11）量词分配律

    （∀ `x`）（`P` ∧ `Q`）⇔（∀ `x`）`P`∧（∀ `x`）`Q`

    （∃ `x`）（`P` ∨ `Q`）⇔（∃ `x`）`P`∨（∀ `x`）`Q`


    ### 4. 谓词公式的永真蕴涵


    #### 定义 2.7

    如果`P`和`Q`是两个谓词公式，`D`是它们的共同个体域，那么当`D`上的任何一个解释都使`P`→`Q`为真时，我们说公式`P`永真蕴涵`Q`，记作`P`→`Q`，并称`Q`是`P`的逻辑结论，`P`是`Q`的前提。


    以下是一些常用的永真蕴涵式：


    （1）假言推理

    `P`，`P`→`Q`⇒`Q`


    （2）拒取式推理

    ﹁`Q`，`P`→`Q`⇒﹁`P`


    （3）假言三段论

    `P`→`Q`，`Q`→`R`⇒`P`→`R`


    （4）全称固化

    （∀ `x`）`P`（`x`）⇒`P`（`y`）

    其中，`y`是个体域中的任一个体，利用此永真蕴涵式可消去公式中的全称量词。


    （5）存在固化

    （∃ `x`）`P`（`x`）⇒`P`（`y`）

    其中，`y`是个体域中某一个可使`P`（`y`）为真的个体。利用此永真蕴涵式可消去公式中的存在量词。


    （6）反证法


    #### 定理 2.1

    `Q`为`P`，`P`，…，`P`[n]的逻辑结论，当且仅当（`P`∧ `P`∧…∧ `P`[n]）∧﹁`Q`是不可满足的。


    1212


    该定理是归结反演的理论依据。


    上面列出的等价式及永真蕴涵式是进行演绎推理的重要依据，因此这些公式又称为推理规则。


    ## 2.2.5 一阶谓词逻辑知识表示法


    在前面的介绍中，已经看到了用谓词逻辑表示知识的一些例子，一般来说，应该怎样用谓词公式来表达想要的知识呢？通常，需要遵循以下三个步骤：


    1）明确谓词和个体的含义，给出每个谓词和个体的准确定义。

    2）根据想要表达的事物或概念，给谓词中的变量赋予具体的值。

    3）根据语义，用合适的连接符号把各个谓词连接起来，构成谓词公式。


    #### 例 2.1

    用一阶谓词逻辑表示“每个储蓄钱的人都得到利息”。


    **解** 定义谓词：`save`（`x`）表示`x`储蓄钱，`interest`（`x`）表示`x`获得利息。


    则“每个储蓄钱的人都得到利息”表示为


    （∀ `x`）（`save`（`x`）→`interest`（`x`））


    用一阶谓词逻辑表示知识并不是唯一的方法。有时候，可以用不同的谓词和变量来表达同样的意思。比如例 2.1，也可以用另一种方式来表示。


    首先，定义谓词：`save`（`x`，`y`）表示`x`储蓄`y`，`money`（`y`）表示`y`是钱，`interest`（`y`）表示`y`是利息，`obtain`（`x`，`y`）表示`x`获得`y`。然后，用全称量词和存在量词把四个谓词连接起来，得到：


    （∀ `x`）（∃ `y`）（`money`（`y`）∧ `save`（`x`，`y`））→（∃ `u`）（`interest`（`u`）∧ `obatin`（`x`，`u`））


    这也是用一阶谓词逻辑表示“每个储蓄钱的人都得到利息”的一种公式。


    其实，还可以用一阶谓词逻辑来表示关系数据库。关系数据库是一种存储数据的方式，它把数据组织成表格的形式。例如，下面这个关系数据库就包含了两个表格。


    ![](img/image_002.jpg)


    表中有两个关系：


    `OCCUPANT`（给定用户和房间的居住关系）


    `TELEPHONE`（给定电话号码和房间的电话关系）


    用一阶谓词表示为


    `OCCUPANT`（`Zhang`，201），`OCCUPANT`（`Li`，201），…


    `TELEPHONE`（491，201），`TELEPHONE`（492，201），…


    ## 2.2.6 一阶谓词逻辑表示法的特点


    ### 1. 一阶谓词逻辑表示法的优点


    （1）接近自然语言

    一阶谓词逻辑是一种形式化的语言，它用谓词、变量、量词和连接符号来表达知识。这种语言比较接近日常使用的自然语言，所以可以比较容易地理解和表达知识。


    （2）表达精确的知识

    一阶谓词逻辑是一种二值逻辑，它只有两种真值：真和假。这意味着可以用它来表达精确的知识，而不需要考虑模糊或不确定的情况。而且，可以保证用它进行演绎推理得到的结论也是精确的。


    （3）有严格的定义和规则

    一阶谓词逻辑有明确的语法和语义，它规定了谓词公式的形式和含义。它还有一套完备的推理规则和定理证明技术，它们可以帮助从已知的事实推出新的事实，或者证明假设是否成立。


    （4）易于实现和管理

    用一阶谓词逻辑表示的知识可以比较容易地转换为计算机能够处理的内部形式，例如子句集。这样，就可以用计算机来存储、检索和修改知识。而且，还可以把知识分成不同的模块，便于管理和维护。


    ### 2. 一阶谓词逻辑表示法的局限性


    （1）不能处理不确定的知识

    一阶谓词逻辑只能处理精确的知识，它不能处理不精确或模糊的知识。但是，人类的知识往往是不确定的，有时只能用概率或程度来描述知识。这就限制了一阶谓词逻辑表示知识的范围和适用性。


    （2）组合爆炸

    在用一阶谓词逻辑进行推理的过程中，如果事实的数量很多，或者没有选择合适的推理规则，就有可能导致组合爆炸。组合爆炸是指推理过程中产生的中间结论数量呈指数级增长，导致推理无法继续或耗费过多的时间和空间。为了避免组合爆炸，人们提出了一些有效的方法，比如定义一个过程或启发式控制策略来选取合适的规则等。


    （3）效率低

    用一阶谓词逻辑表示知识时，其推理是基于形式逻辑的，它只关注谓词公式的形式和真值，而不关注其背后的语义和含义。这就使得推理过程很长，而且可能忽略了一些重要的信息和知识。这样就降低了系统的效率和智能性。


    虽然一阶谓词逻辑表示法有以上一些局限性，但它仍然是一种重要的表示方法，许多专家系统都采用了谓词逻辑来表达知识，例如格林等人开发的用于求解化学问题的 QA3
    系统，菲克斯等人开发的用于机器人行动规划的 STRIPS 系统，菲尔曼等人开发的用于机器证明的 FOL 系统等。


    # 2.3 产生式表示法


    产生式表示法又称为产生式规则表示法。


    产生式表示法是一种用规则来表示知识的方法。这个名词最早是由美国数学家波斯特在 1943 年提出的，他用一系列的替换规则定义了一种计算模型，每一条替换规则就叫作一个产生式。后来，这个概念经过了多次改进和扩展，被应用到了不同的领域，比如描述形式语言的语法，模拟人类思维的认知过程等。1972
    年，纽厄尔和西蒙在研究人类认知模型时开发了基于规则的产生式系统。现在，它已经成为人工智能中最常用的一种知识表示模型，许多成功的专家系统都采用它来表示知识，例如化学分子结构专家系统
    DENDRAL、传染病诊断专家系统 MYCIN 等。


    ## 2.3.1 产生式


    产生式表示法是一种用规则来表示知识的方法。它可以表示事实、规则以及它们的不确定性，适用于事实性知识和规则性知识。


    ### 1. 确定性规则知识的产生式表示


    确定性规则知识的产生式表示有一个基本的格式，就是


    IF `P` THEN `Q`


    或者


    `P`→`Q`


    式中，`P`是产生式的条件，用来判断这个规则是否适用；`Q`是产生式的结果，用来说明当条件`P`成立时，应该得出什么结论或做什么操作。一个产生式的意思就是：如果条件`P`满足了，那么就可以得到结果`Q`或执行结果`Q`指定的操作。例如：


    `r`：IF 动物会飞 AND 会下蛋 THEN 该动物是鸟


    ### 4


    这就是一个产生式。其中，`r`是这个产生式的编号；“动物会飞 AND 会下蛋”是条件`P`；“该动物是鸟”是结果`Q`。


    ### 2. 不确定性规则知识的产生式表示


    不确定性规则知识可以用产生式的形式来表示，其基本格式如下：


    IF `P` THEN `Q`（置信度）


    或者


    `P`→`Q`（置信度）


    式中，`P`是前提条件；`Q`是结论；置信度是一个 0 到 1 之间的数，表示结论的可信程度。


    例如，在专家系统 MYCIN 中有这样一条产生式：


    IF 本微生物的染色斑是革兰氏阴性

    本微生物的形状呈杆状

    病人是中间宿主

    THEN 该微生物是绿脓杆菌，置信度为 0.6。


    这意味着，如果当前提示中列出的三个条件都成立，那么结论“该微生物是绿脓杆菌”的可信程度为 0.6。这里，0.6 表示了知识的强度。


    ### 3. 确定性事实性知识的产生式表示


    确定性事实一般用三元组表示：


    （对象，属性，值）


    或者


    （关系，对象 1，对象 2）


    例如，老李的年龄是 40 岁，表示为（`Li`，`Age`，40）。老李和老王是朋友，表示为（`Friend`，`Li`，`Wang`）。


    ### 4. 不确定性事实性知识的产生式表示


    不确定性事实一般用四元组表示：


    （对象，属性，值，置信度）


    或者


    （关系，对象 1，对象 2，置信度）


    例如，老李的年龄很可能是 40 岁，表示为（`Li`，`Age`，40，0.8）。老李和老王不是朋友，表示为（`Friend`，`Li`，`Wang`，0）。


    产生式是一种用来表示知识的形式，它由前提和结论两部分组成，也可以称为规则或产生式规则。前提是产生式的条件部分，也可以叫作条件、前提条件、前件或左部等；结论是产生式的结果部分，也可以叫作后件或右部等。这些术语在本书中通用，不再特别说明。


    产生式和谓词逻辑中的蕴涵式有相似之处，但蕴涵式只是产生式的一种特例。产生式比蕴涵式更广泛，有以下两个方面的原因：


    1）除了逻辑蕴涵，产生式还可以包含各种操作、规则、变换、算子、函数等。例如，“如果炉温超过上限，则立即关闭风门”就是一个产生式，但不是一个蕴涵式。产生式描述了事物之间的一种对应关系（包括因果关系和蕴涵关系），其应用范围很广泛。逻辑中的逻辑蕴涵式和等价式、程序设计语言中的文法规则、数学中的微分和积分公式、化学中分子结构式的分解变换规则、体育比赛中的规则、国家的法律条文、单位的规章制度等都可以用产生式表示。


    2）蕴涵式只能表示确定性知识，其真值只能是真或假，而产生式不仅可以表示确定性的知识，还可以表示不确定性的知识。要判断一条知识是否可用，需要检查当前是否有已知事实与前提中的条件相匹配。对于谓词逻辑的蕴涵式来说，匹配必须是精确的。而在产生式表示知识的系统中，匹配可以是精确的，也可以是不精确的，只要按照某种算法计算出的相似度在预先指定的范围内就认为是可匹配的。


    由于产生式与蕴涵式存在这些区别，因此它们在处理方法及应用等方面也有较大的差别。


    为了严格地描述产生式，下面用巴克斯范式（Backus Normal Form，BNF）给出它的形式进行描述：


    ![](img/image_003.jpg)


    其中，符号“：：=”表示“定义为”，符号“|”表示“或者是”，符号“［ ］”表示“可省略”。


    ## 2.3.2 产生式系统


    把一些规则组合起来，让它们相互协作，共同解决问题，其中一个规则得出的结论，可以作为另一个规则的前提条件，这样就可以一步步推导出答案。这种用规则来解决问题的方法，叫作规则系统。


    一般来说，一个规则系统由三个部分组成：规则库、控制系统（也叫推理机）和综合数据库。产生式系统的基本结构关系如图 2-1 所示。


    ### 1. 规则库


    规则库是存放各种专业知识的地方。这些知识是用规则的形式表达的，每条规则都有一个前提条件和一个结论或操作。规则库是规则系统解决问题的基础，所以要保证规则库中的知识是完整的、一致的、准确的和灵活的。要对规则库中的知识进行合理的组织和管理，避免出现重复或矛盾的知识，以提高知识的利用率。


    ![](img/image_004.jpg)


    图 2-1 产生式系统的基本结构关系


    ### 2. 控制系统


    控制系统是控制整个规则系统运行的程序。它负责从规则库中选择合适的规则，解决可能出现的冲突，执行规则中的结论或操作，检查是否达到推理终止条件等。控制系统主要完成以下几项工作：


    1）按照一定的策略从规则库中挑选出与综合数据库中的信息相匹配的规则。匹配就是把规则的前提条件和综合数据库中的信息进行比较，看看它们是否一致或者近似一致。如果匹配成功，就说明这条规则可以被使用；如果匹配不成功，就说明这条规则不适用于当前的问题。


