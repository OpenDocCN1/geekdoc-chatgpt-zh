    `Relu`函数是最常用的激活函数，在搭建人工神经网络时应该有限尝试。`Relu`函数的优点有很多，其计算速度非常快，只需要判断输入是否大于 0 即可，另外，其收敛速度也远快于`Sigmoid`函数和`tanh`函数。当然`Relu`函数也有其相关缺点，比如它的输出不是一个闭合区间，另外`Relu`函数还有`Dead-Relu-Problem`的问题，也就是有些神经元永远不会被激活，导致相应的参数不会被更新。对于这个问题，需要修改学习率或者对参数重新初始化，在实验中，往往前者存在可能性较大。另外为了解决`Relu`函数中的`Dead-Relu-Problem`的问题，还提出一种`PRelu`函数，其函数表达式如下：


