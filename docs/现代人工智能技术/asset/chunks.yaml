    ### 5.2.5 特征提取和数据降维


    在数据的预处理阶段，特征提取和数据降维是提升模型表示能力的一种重要手段。


    特征提取主要是从数据中找到有用的特征，用于提升模型的表示能力，而数据降维主要是在不减少模型准确率的情况下减少数据的特征数量。


    从原理上来说，多维变量变为一维是将不同变量按照不同权重转化到一维空间，再将各个变量叠加就组成一个新的一维变量。


    从方法上来说，下面将主要介绍主成分分析、核主成分分析和`ISomap`流形学习，它们都能实现数据降维。其中，主成分分析和核主成分分析将应用于人脸数据集特征提取，`ISomap`流形学习将应用在手写数字数据集上。


    主成分分析将`n`维输入数据缩减为`k`维，其中`k`<`n`。但并非简单地从`n`维特征中去除其余`n`-`k`维特征，而是重新构造出来的`k`维正交特征。简单地说，主成分分析实质上是一个基变换，使得变换后的数据有最大的方差。


    通常可以基于特征值或者奇异值分解协方差矩阵以实现主成分分析算法。用奇异值分解方法举例，假定有`m`×`n`维数据样本`X`，共有`m`个样本，每个样本数据有`n`维，`X`实矩阵可以分解为


    ![](img/image_109.jpg)


    这里，正交阵`U`的维数是`m`×`m`，正交阵`V`的维数是`n`×`n`（正交阵满足：`U`^`T` `U`=`V`^`T` `V`=1），`Σ`是一个`m`×`n`的矩阵，除了主对角线上的元素以外全为
    0。找出最大的`k`个特征向量组成的`k`×`n`的矩阵`V`，则我们可以做如下处理：


    ![](img/image_110.jpg)


    可以得到一个`m`×`k`的矩阵`X′`，和`m`×`n`的矩阵`X`相比，列数从`n`减到了`k`，可见对列数进行了压缩，即特征维度的压缩。


    一般来说，主成分分析适用于数据的线性降维，而核主成分分析可实现数据的非线性降维，用于处理线性不可分的数据集。


    核主成分分析的大致思路是：对于输入空间中的矩阵，我们先用一个非线性映射把其中的所有样本通过核函数映射到一个高维甚至是无穷维的空间（也称为特征空间），使其在该特征空间中线性可分，然后在这个高维空间进行主成分分析降维。


    除此之外，常用的线性降维方法还有线性判别分析、局部线性嵌入、拉普拉斯特征映射、随机邻域嵌入、`t`分布邻域嵌入，迁移学习降维方法有迁移成分分析等。


    ## 5.3 模型评估


    我们把学习器的实际预测输出与样本的真实输出之间的差异称为误差，学习器在训练集上的误差称为训练误差或经验误差，在新样本上的误差称为泛化误差。显然，我们希望得到泛化误差小的学习器。然而，我们事先并不知道新样本是什么样的，实际能做的是努力使经验误差最小化。在很多情况下，我们可以学得一个经验误差很小、在训练集上表现很好的学习器，例如甚至对所有训练样本都分类正确，即分类错误率为零，分类精度为
    100%，但这样的学习器在多数情况下泛化性能都不好。


    为了获得在新样本上能表现得很好的学习器，应该从训练样本中尽可能学出适用于所有潜在样本的普遍规律。而当学习器把训练样本学得太好了的时候，很可能已经把训练样本自身的一些特点当作所有潜在样本都会具有的一般性质，这样就会导致泛化性能下降，这种现象在机器学习中称为过拟合。与过拟合相对的是欠拟合，这是指对训练样本的一般性质尚未学好。


    有多种因素可能导致过拟合，各类学习算法都必然带有一些针对过拟合的措施；然而必须认识到，过拟合是无法彻底避免的，我们所能做的只是缓解或者说减小其风险。


    在现实任务中，我们往往有多种学习算法可供选择，甚至对同一个学习算法，当使用不同的参数配置时，也会产生不同的模型。模型选择解决的就是该选择哪一个学习算法、使用哪一种参数配置的问题。理想的解决方案当然是对候选模型的泛化误差进行评估，然后选择泛化误差最小的那个模型。然而如上面所讨论的，我们无法直接获得泛化误差，而训练误差又由于过拟合现象的存在而不适合作为标准，那么，在现实中如何进行模型评估与选择呢？


    ### 5.3.1 评估方法


    #### 1. 留出法


    留出法直接将数据集`D`划分为两个互斥的集合，其中一个集合作为训练集`S`，另一个作为测试集`T`，即`D`=`S`∪`T`，`S`∩`T`=∅。在`S`上训练出模型后，用`T`来评估其测试误差，作为对泛化误差的估计。


    以二分类任务为例，假定`D`包含 1000 个样本，将其划分为`S`包含 700 个样本，`T`包含 300 个样本，用`S`进行训练后，如果模型在`T`上有
    90 个样本分类错误，那么其错误率为（90/300）×100%=30%，相应地，精度为 1-30%=70%。


    需注意的是，训练/测试集的划分要尽可能保持数据分布的一致性，避免因数据划分过程引入额外的偏差而对最终结果产生影响，例如在分类任务中至少要保持样本的类别比例相似。如果从采样的角度来看待数据集的划分过程，则保留类别比例的采样方式通常称为分层采样。例如通过对`D`进行分层采样而获得含
    70%样本的训练集`S`和含 30%样本的测试集`T`，若`D`包含 500 个正例、500 个反例，则分层采样得到的应包含 350 个正例、350 个反例，而`T`则包含
    150 个正例和 150 个反例；若`S`、`T`中样本类别比例差别很大，则误差估计将由于训练/测试数据分布的差异而产生偏差。


    另一个需注意的问题是，即使在给定训练/测试集的样本比例后，仍存在多种划分方式对初始数据集`D`进行分割。例如在上面的例子中，可以把`D`中的样本排序，然后把前
    350 个正例放到训练集中，也可以把后 350 个正例放到训练集中，这些不同的划分将导致不同的训练/测试集，相应地，模型评估的结果也会有差别。因此，单次使用留出法得到的估计结果往往不够稳定可靠，在使用留出法时，一般要采用若干次随机划分、重复进行实验评估后取平均值作为留出法的评估结果。例如进行
    100 次随机划分，每次产生一个训练/测试集用于实验评估，100 次后就得到 100 个结果，而留出法返回的则是这 100 个结果的平均。


    此外，我们希望评估的是用`D`训练出的模型的性能，但留出法需划分训练/测试集，这就会导致一个窘境：若令训练集`D`包含绝大多数样本，则训练出的模型可能更接近于用`D`训练出的模型，但由于`S`比较小，评估结果可能不够稳定可靠；若令测试集`T`多包含一些样本，则训练集`S`与`T`差别更大了，被评估的模型与用`D`训练出的模型相比可能有较大的差别，从而降低了评估结果的保真性。这个问题没有完美的解决方案，常见的做法是将
    2/3～4/5 样本用于训练，剩余样本用于测试。


    #### 2. 交叉验证法


    交叉验证法是将数据`D`分为`k`个大小相似的互斥子集，`D`=`D`∪`D`∪…∪`D`[`k`]，`D`[`i`]∩`D`[`j`]=∅（`i`≠`j`）。每个子集`D`[`i`]尽可能保持数据分布的一致性，即从`D`通过分层采样得到。然后，每次用`k`-1
    个子集的并集作为训练集，余下的那个子集作为测试集；这样就可获得`k`组训练/测试集，从而可进行`k`次训练和测试，最终返回的是`k`个测试结果的均值。显然，交叉验证法评估结果的稳定性和保真性在很大程度上取决于`k`的取值，为了强调这一点，通常把交叉验证法称为`k`折交叉验证。最常用的`k`的取值是
    10，此时称为 10 折交叉验证；其他常用的`k`值有 5、20 等。图 5-12 给出了 10 折交叉验证的示意图。


    ![](img/image_111.jpg)


    图 5-12 10 折交叉验证的示意图


