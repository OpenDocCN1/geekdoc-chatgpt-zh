    ### 6.2.2 全连接神经网络


    全连接神经网络也叫作多层感知机，是神经网络中最为常见的一种网络模型。在卷积神经网络、循环神经网络中都有应用，所以在学习以下几种网络的时候应该先了解到全连接神经网络的原理以及实现方式。


    1. 激活函数


    全连接神经网络实现中，最重要的问题在于非线性函数的引入。所谓非线性函数，也就是各种深度学习中经常提到的激活函数。


    本节将介绍几个常用的激活函数。第一个激活函数是 Sigmoid 函数，图像如图 6-5 所示，其表达式如下：


    ![](img/image_243.jpg)![](img/image_244.jpg)


    ▲图 6-5 Sigmoid 函数图像


    可以看出，Sigmoid 函数能够把输入的连续实值变换为 0～1 之间的输出。当输入趋于-∞时，Sigmoid 函数的输出趋于 0;当输入趋于+∞时，Sigmoid
    函数的输出趋于 1;当输入在 0 周围徘徊的时候，其函数的导数值最大。深度神经网络中的反向传递的时候会发生梯度爆炸和梯度消失，在引入 Sigmoid 函数之后梯度爆炸发生的概率较小，但是梯度消失较大。


    第二个激活函数是 tanh 函数，图像如图 6-6 所示，其表达式如下：


