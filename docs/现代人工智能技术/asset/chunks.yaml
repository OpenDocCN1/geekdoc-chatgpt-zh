    变量标准化的意思是给变量换个名字，让每个量词用不同的变量，这样就不会混淆不同量词的作用范围。这是因为在一个量词的作用范围内，被这个量词限制的变量是一个哑变量（假想的变量），它可以在这个范围内用另一个没有用过的任意变量替换，而不会影响谓词公式的真假。


