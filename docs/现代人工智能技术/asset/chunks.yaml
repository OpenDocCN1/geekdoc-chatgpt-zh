    ### 6.5.1 导师驱动过程


    上一节介绍的循环神经网络，其特征是用一个时间步的输出和下一个时间步的隐藏状态进行循环连接。这种网络的效果并不是很好，原因是缺乏隐藏到隐藏之间的循环连接，这样的后果是要求输出单元必须能够捕获所有的历史信息，同时由于输出单元已经和训练集中的目标有明确匹配，因此在这样的条件下，循环神经网络就很难去捕捉输入历史的必要信息。


    那么为了将输出反馈到循环之中，就可以采用导师驱动过程进行训练。所谓导师驱动过程，就是将该时刻`t`的真实值作为输入`t+1`时刻的隐藏状态，这样避免缺乏隐藏到隐藏的状态中通过时间进行反向传播。当然在隐藏状态成为比较早时间步函数的情况下，使用基于时间的反向传播算法也是必要的，因为必须考虑如何去获得较早时间的信息。导师驱动过程示意图如图6-20所示。


