    由伪代码可以看出，决策树分类器的关键在于如何选择最优分化属性。通常我们希望随着划分过程的不断进行，分支节点所包含的样本尽可能属于同一类，即结点纯度越来越高。


    比较常用的决策树有`ID3`、`C4.5`和`CART`（Classification And Regression Tree，分类回归树），`CART`的分类效果一般优于其他决策树。下面介绍具体步骤。


