    现实任务中通常是利用有限个测试样例来绘制ROC图，此时仅能获得有限个（真正例率、假正例率）坐标对，无法产生图5-14a中的光滑ROC曲线，只能绘制出如图5-14b所示的近似ROC曲线。绘图过程很简单：给定*m*个正例和*m*反例，根据学习器预测结果对样例进行排序，然后把分类阈值设为最大，即把所有样例均预测为反例，此时真正例率和假正例率均为0，在坐标（0，0）处标记一个点。然后，将分类阈值依次设为每个样例的预测值，即依次将每个样例划分为正例。设前一个标记点坐标为（*x*，*y*），当前若为真正例，则对应标记点的坐标为；当前若为假正例，则对应标记点的坐标为，然后用线段连接相邻点即可得到曲线。


    进行学习器的比较时，与*P-R*图相似，若一个学习器的ROC曲线被另一学习器的曲线完全包住，则可断言后者的性能优于前者；若两个学习ROC曲线发生交叉，则难以一般性地断言两者孰优孰劣。此时如果一定要进行比较，则较为合理的判据是比较ROC曲线下的面积。


    从定义可知，AUC通过对ROC曲线下各部分的面积求和而得。假定ROC曲线是由坐标为{（*x*，*y*），（*x*，*y*），…，（*x*[m]，*y*[m]）}的点按序连接而形成（见图5-14b），则AUC可估算为


