    ### 自适应机器人（第二代）

    自适应机器人是指具有感觉传感器和计算机控制系统的机器人。它们可以通过视觉、触觉、听觉等传感器获取作业环境和操作对象的简单信息，并由计算机分析、处理、控制机器人的动作。它们能够根据环境的变化而调整自己的行为，因此称为自适应机器人。目前，这一代机器人也已经商品化和实用化，主要从事焊接、装配、搬运等工作。这一代机器人虽然具有一些初级的智能，但还没有达到完全“自治”的程度，有时也被称为人-眼协调型机器人。


    ### 智能机器人（第三代）

    智能机器人是指具有类似于人的感知、思维和行为能力的机器人。它们可以通过视觉、听觉、触觉、嗅觉等感觉器官从外部环境中获取有关信息，并由中央处理器对信息进行处理和控制。它们可以通过传动机构使自己的“手”“脚”等肢体行动起来，正确、灵巧地执行思维机构下达的命令。目前，研制的机器人大都只具有部分智能，真正的智能机器人还处于研究之中，但已经迅速发展为新兴的高技术产业。


    ### 1.4.10 组合优化

    在实际应用中，有很多问题都属于组合优化问题的范畴。比如，旅行商要找到最短的路线、工厂要安排最合理的生产计划和调度、通信系统要选择最优的路由方案等，这些都是组合优化问题的典型例子。

    组合优化问题通常是非常难以解决的，它们被称为NP完全问题。NP完全问题意味着：如果用现有的最好方法来求解，那么随着问题规模的增大，所需花费的时间会呈指数级增长。也就是说，这些问题非常耗时，而且目前还没有找到更快速有效的解决办法。比如说，能够使求解时间按照多项式级增长而不是指数级增长。

    当面对大规模的组合优化问题时，会遇到一个严重的困难，即组合爆炸。这就是说，求解程序所需的时间和空间或者步骤会随着可能性的增加而急剧上升。因此，传统的优化方法往往无法胜任这样的任务，需要借助人工智能来寻找更好的方法。目前已经有一些人工智能方法被提出并证明有效，例如遗传算法、神经网络方法等。

    组合优化问题及其求解方法已经广泛应用于各个领域和系统中。例如，在生产计划与调度、通信路由调度、交通运输调度、列车组编、空中交通管制和军事指挥自动化等方面都有着重要作用。


    ### 1.4.11 人工神经网络

    人工神经网络是一种模仿人类大脑神经系统的人工网络，它由许多简单的处理单元通过广泛的连接构成。早在1943年，两位科学家麦克洛奇和匹兹就建立了神经元的数学模型，开启了神经科学理论研究的先河。但是，在20世纪60年代到20世纪70年代，由于神经网络研究存在一些困难和局限，导致了研究的停滞和衰退。尤其是1969年，人工智能领域的明斯基等人出版了《感知器》一书，对神经网络进行了严厉的批评和质疑，使得神经网络研究陷入了低潮。有意思的是，在同一年，Bryson和Ho就已经提出了BP学习算法，这是一种训练多层前向神经网络的有效方法。直到20世纪80年代，神经网络研究才重新焕发生机和活力。鲁梅尔哈特等人重新发现并推广了BP学习算法；霍普菲尔德提出了霍普菲尔德神经网络模型；这些都极大地促进了神经网络研究的发展，并取得了许多重要成果。

    2006年，一篇发表在Science上的文章引发了深度学习的热潮。这篇文章的作者是加拿大多伦多大学的Geoffrey Hinton教授和他的学生，他们利用神经网络实现了深度学习，并在机器视觉、自然语言处理等领域取得了令人惊叹的成果。随着云计算和大数据技术的不断发展，深度学习也展现出了更加广阔的应用前景。

    如今，神经网络已经成为人工智能中不可或缺的一个研究领域。对神经网络模型、算法、理论分析和硬件实现进行了大量的研究，为神经计算机走向实际应用奠定了坚实的基础。神经网络已经在模式识别、图像处理、组合优化、自动控制、信息处理、机器人学等领域得到了广泛而有效的应用。


    ### 1.4.12 分布式人工智能与多智能体

    分布式人工智能是把人工智能和分布式计算结合起来的一个研究领域。它旨在开发一些能够在多个异构系统之间交换信息和协作的解决方案。这些系统需要具有健壮性，即能够在快速变化的环境中适应和恢复。

    分布式人工智能的研究目标是要建立一种可以描述自然界和社会界的模型。在这个领域中，智能不是孤立存在的，而是通过团体协作实现的。因此，它主要关注多个智能体之间如何合作和对话。它包括两个子领域：分布式问题求解和多智能体系统。分布式问题求解是把一个复杂的问题划分成多个相互协作和共享知识的模块或节点。多智能体系统则是研究多个智能体之间如何协调行为。这两个子领域都需要研究如何划分知识、资源和控制权。但是，分布式问题求解通常有一个全局的概念模型、问题定义和成功标准，而多智能体系统则有多个局部的概念模型、问题定义和成功标准。多智能体系统更接近于人类社会中的智能，更具有灵活性和适应性，更适合开放和动态的世界环境，因此成为人工智能领域中一个热门的研究方向。


    ## 1.5 小结

    人类智能就像一座宝库，里面存放了各种各样的文化财富。这些财富是人们从自然界中获取并创造出来的，这帮助人们更好地了解和改变世界。不同的学派就像不同的钥匙，试图打开这座宝库，并探索其中的奥秘。简单地说，知识是智能行为的前提，而智能就是拥有和使用这些财富的能力。

    智能是指对外界有感知、记忆、思维、学习和行为等能力的特征。人工智能就是用计算机等机器来模拟这些特征的技术。

    人工智能从孕育到形成再到发展，涵盖了知识表示、机器感知、机器思维、机器学习、机器行为等多个领域。


