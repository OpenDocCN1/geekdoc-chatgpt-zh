    ### **4.2.2 遗传算法的发展历史**


    遗传算法是模拟达尔文生物进化论的自然选择和遗传学机理的生物进化过程的计算模型，是一种通过模拟自然进化过程搜索最优解的方法，它最初是由美国Michigan大学J.Holland教授于1975年提出来的，并出版了颇有影响的专著《Adaptation in Natural and Artificial Systems》，遗传算法这个名称才逐渐为人所知，J.Holland教授所提出的遗传算法通常为简单遗传算法。


    遗传算法兴盛于20世纪80～90年代，但它的历史可以追溯到20世纪60～70年代。一开始对遗传算法的研究是通过计算机对自然遗传系统进行模拟，特点主要是对某些复杂操作的研究。20世纪50年代中期开始仿生学研究，这是连接生物与技术的桥梁，同时也为遗传算法的提出奠定了基础。20世纪60年代，Holland，Bremermann等人提出了遗传算法，Rechenberg，Schwefel等人提出了进化策略，Fogel，Owens，Walsh等人提出了进化规划。尽管这一时期提出了一些让人印象深刻的优化方法，但是对于遗传算法的研究都是没有明确的目标方向，缺乏带有指导性的理论和计算工具。直到20世纪70年代中期，由于密歇根大学的J.Halland和DeJong的创造性作品的出版，情况才有所改变。当然，早期的研究成果对遗传算法的发展仍有一定的影响，特别是一些有代表性的技术和方法被后来的遗传算法所吸收和发展。


    1971年，Hollstien提出了第一个用于函数优化的遗传算法。在他的论文中，计算机控制系统对人工遗传自适应方法提出了一种用于数字反馈控制方法的遗传算法，但实际上主要讨论了两个变函数优化问题，其中，针对基因控制的优势、交叉和突变，以及各种编码技术进行了深入的研究。


    1975年是遗传算法研究史上非常重要的一年。Holland在这一年出版了他的专著《自然系统和人工系统的自适应》，第一次系统地阐述了遗传算法，因此人们认为遗传算法诞生于1975年。Holland在书中系统地阐述了遗传算法的基本理论和方法，并提出了遗传算法理论和发展重要模式理论的研究。该理论首次证实了重组遗传操作以获得隐式并行性的重要性。同年，K.A.De Jong完成了他的博士论文《一类遗传自适应系统的行为分析》，可以看成是遗传算法研究历史上的一个里程碑，这是因为他把Holland的模式理论和他自己的计算实验结合到了一起，他的研究为遗传算法及其应用打下了坚实的基础，他的一些理论至今仍具有普遍指导意义。


    进入20世纪80年代，遗传算法迎来了兴盛发展的时期，无论是理论研究还是应用研究都是十分火热的课题。1985年，在美国召开了第一届遗传算法的国际学术会议，并且成立了遗传算法国际学术会，规定会议每两年举办一次。


    1989年，Holland的学生Goldberg发表了自己的专著《搜索、优化和机器学习中的遗传算法》，该专著总结了此前遗传算法中的主要成果，对遗传算法进行了系统而全面的概括。


    在欧洲，从1990年开始每两年举办一次“Parallel Problem Solving from Nature”学术年会，其中遗传算法是该会议极其重要的课题之一。此外，以遗传算法理论基础为中心的学术年会“Foundations of Genetic Algorithms”也是从1990年开始每两年举办一次。这些国际会议及论文反映了当时遗传算法的最新动向和发展前沿。


    1991年，D.Whitey在他的论文中提出了基于领域交叉的交叉算子，这个算子是特别针对用符号表示的基因个体的交叉，并将其应用到了TSP问题当中，通过实验进行了验证。D.H.Ackley提出的迭代遗传爬山法采用了一种复杂的概率选举机制，此机制中由*m*个投票者来共同决定新个体的值。实验结果表明此方法与单点交叉、均匀交叉的神经遗传算法相比，所测出来的数据具有更好的性能，也更有竞争力。


    国内不少学者也对遗传算法的交叉算子进行了改进，例如2002年戴晓明等人应用多种群遗传并行进化的思想，对不同的种群基于不同的遗传策略并利用种群间迁移算子来进行遗传交流，以此来解决经典的遗传算法中收敛到局部的最优解问题。


    随着应用领域的扩大，遗传算法的研究出现了一些引人注目的新趋势：一是基于遗传算法的机器学习，遗传算法搜索空间的新研究课题从传统的离散优化搜索算法扩展到具有独特生成规则的新型机器学习算法。在这种新的学习机制中，为解决人工智能优化提炼了知识获取的瓶颈问题，给知识带来了希望。二是遗传算法、神经网络和模糊计算等智能计算独立发展、相互渗透，对21世纪人工智能有很大的推动作用。三是并行处理的遗传算法的研究十分活跃。四是人工生命也开始登上科技舞台。五是遗传算法、进化策略、进化规划三大算法独立发展，同时又日益紧密结合，也给未来的人工智能发展带来了更多的可能。


    ### **4.2.3 编码**


    遗传算法中包含五个基本要素：参数编码、初始群体设定、适应度函数设计、遗传操作设计和控制参数设定。


    编码的过程如图4-1所示。


    ![](EPUB/images/image_028.jpg)


    图4-1 编码的过程


    遗传编程是一种自动化的方法，从一个高级问题声明创建一个工作计算机程序的问题。基因编程从一个“需要做什么”的高级声明开始，并自动创建一个计算机程序来解决这个问题。由于遗传算法不能直接处理问题空间的参数，因此必须通过编码将需要解决的问题表示成遗传空间的染色体或者个体。它们由基因按照一定的结构组成，由于遗传算法的健壮性，因此对于编码的要求并不苛刻。针对某一个问题，我们如何利用遗传算法去编码是一个重要的问题。目前还不存在一种通用的编码方法，特殊的问题一般采用针对性的编码去解决。


    编码的原则如下：


    1）完备性：问题空间的所有解都可以表示为所设计的基因型。


    2）健全性：任何基因型都对应一个可能的解。


    3）非冗余性：问题空间（表现型）和表达空间（基因型）一一对应。


    **1. 二进制编码**


    个体基因型使用二值符号集{0，1}来构成，整个基因型是一个二进制编码符号串。二进制编码符号串的长度与问题所要求的求解精度有关。


    优点：二进制算法的编码更接近于染色体的组成，从而使其与自然遗传特点更加贴近，可以更好地诠释生物自然遗传规律，并使得选择、交叉、变异更容易实现，更容易理解。此外，采用二进制算法，处理算法的模式也是最多的。


    缺点：


    1）对于一些连续函数的优化问题，由于其随机性使其局部搜索能力差，当接近最优解时，表现型的变异差距很大，而且不连续，导致最终远离最优解。


    2）相邻整数的二进制编码可能具有较大的Hamming距离。例如，15和16的二进制表示形式是01111和10000。因此，要将算法从15改进为16，必须更改所有位。这个缺陷会产生Hamming悬崖，这将降低遗传操作员的搜索效率。


    3）二进制算法必须在一开始就要给出求解的精度，单精度给出后该算法在寻求最优解的过程中缺乏微调的功能，但是若给出的精度很高则会导致字符串过长，使算法的效率降低。


    4）二进制算法在高维优化的过程中，编码字符串会很长，导致搜索效率降低。


    **2. Gray编码**


    Gray编码是其连续的两个整数所对应的编码之间只有一个码位是不同的，其余码位均相同，Gray编码是将二进制编码进行一个转换而得到的编码。


    有二进制编码到Gray编码的转换公式：


    假设二进制编码*B*\=*b*[m]，*b*[m]，…，*b*，*b*，对应的Gray编码*G*\=*g*[m]，*g*[m]，…，*g*，*g*


    \-121-121


    *g*[m]\=*b*[m]


    *g*[i]\=（*b*[i]）⊕（*b*[i]），*i*\=*m*\-1，*m*\-2，…，2，1


    +1


    由Gray编码转二进制编码的公式为


    *b*[m]\=*g*[m]


    *b*[i]\=（*b*[i]）⊕（*g*[i]），*i*\=*m*\-1，*m*\-2，…，2，1


    +1


    Gray编码的特点是克服了二进制编码的Hamming悬崖的缺点，增强了遗传算法的局部搜索能力，便于连续函数的空间的局部搜索。


    ### **4.2.4 实数编码和浮点数编码**


    为克服二进制编码的缺点，对于问题的变量是实向量的情况，可以直接采用实数去编码。


    实数编码是采用多个实数去表示问题中的基因型，然后在实数空间里进行操作。


    浮点数编码是指个体的每个基因值用某一范围内的一个浮点数来表示，而个体的编码长度等于其决策变量的个数。因为这种编码方法使用的是决策变量的真实值，所以也称之为真值编码方法。


    在浮点数编码方法中，必须保证基因值在给定的区间限制范围内，遗传算法中所使用的交叉、变异等遗传算子也必须保证其运算结果所产生的新个体的基因值也在这个区间限制范围内。


    此外还有多参数级联编码、复数编码、DNA编码、符号编码等，在此就不一一展开了。


    ### **4.2.5 群体设定**


    遗传算法是针对某个问题提出来若干个解，也就是需要对一个种群进行操作。种群的设定主要有两方面：初始种群的产生和种群规模的确定。


    **1. 初始种群的产生**


    与自然遗传中种群产生的方式类似，遗传算法中初始种群的产生是随机的，但是最好采用一定的方法和策略，如下所述：


    1）根据所求问题的相关知识，把握该问题的最优解看可能出现的位置分布范围，通过这个范围进而可以锁定一个初始的最优解种群。


    2）然后就上面的种群我们可以随机地去产生一定数目的个体，再从里面去挑选最优质的个体添加到初始种群里，这些个体会不断交叉迭代，直到初始种群中的个体数目达到了所需要的确定值。


    **2. 种群规模的确定**


    种群中个体的数量称为种群规模。种群规模会影响到遗传优化的最终结果，若种群规模太小，会导致最优解的集合太小，优化效率一般比较低，造成局部最优解的现象；若种群规模太大，或许不会造成局部最优解的情况，但是会造成优化过程冗余复杂。因此可知，选择在遗传操作中的种群规模的确会对最终优化结果产生影响。'
