    这里，正交阵***U***的维数是*m*×*m*，正交阵***V***的维数是*n*×*n*（正交阵满足：UUT=VTV=1），***Σ***是一个*m*×*n*的矩阵，除了主对角线上的元素以外全为0。找出最大的*k*个特征向量组成的*k*×*n*的矩阵***V***，则我们可以做如下处理：


