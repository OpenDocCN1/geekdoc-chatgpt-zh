    从几何上来讲，牛顿法就是用一个二次曲面去拟合当前所处位置的局部曲面，而梯度下降法是用一个平面去拟合当前的局部曲面，通常情况下，二次曲面的拟合会比平面更好，所以牛顿法选择的下降路径会更符合真实的最优下降路径。


    ### 5.4.3 贝叶斯分类


    #### 1. 贝叶斯定理

    贝叶斯分类器是一类分类算法的总称，这类算法均以贝叶斯定理为基础，故统称为贝叶斯分类器。贝叶斯定理由英国数学家贝叶斯（Thomas Bayes，1702—1761）发展，用来描述两个条件概率之间的关系。


    在讲述贝叶斯定理之前，先介绍以下几个定义：

    1）条件概率（又称后验概率）：就是事件`A`在另一个事件`B`已经发生的条件下发生概率，公式表示为`P(A|B)`，读作“在`B`条件下`A`的概率”。


    ![](img/image_178.jpg)


    2）联合概率：表示两件事情共同发生的概率。`A`与`B`的联合概率表示为`P(A, B)`。


    3）边缘概率（又称先验概率）：就是某个事件发生的概率。边缘概率是这样得到的：在联合概率中，把最终结果中那些不需要的事件通过合并成它们的全概率，而消去它们（对离散随机变量用求和得全概率，对连续随机变量用积分得全概率），这称为边缘化，比如`A`的边缘概率表示为`P(A)`，`B`的边缘概率表示为`P(B)`。


    可以推导出贝叶斯定理中一个非常重要的公式：


    ![](img/image_179.jpg)


    #### 2. 朴素贝叶斯分类器

    那么贝叶斯在机器学习中是如何工作的呢？


    简单举例说明，在进行垃圾邮件识别的过程中，已知的垃圾邮件中关键词“AA”出现的频率很高，“BB”出现的频率比较低，那么如果一封新的邮件中出现了“AA”，则它是垃圾邮件的概率就会比较高。出现“BB”的时候是垃圾邮件的概率就比较低。


    而朴素贝叶斯分类器是贝叶斯分类器中最简单，也是最常见的一种分类方法。


    举例，数据集有`m`个标签 `c = [c, c, …, c[m]]`，每个数据`x`有`d`个属性 `x = [x, x, …, x[d]]`，根据贝叶斯公式可得


    ![](img/image_180.jpg)


    朴素贝叶斯采用了属性条件独立性假设：对已知的类别，假设所有属性相互独立。即每个属性独立地对分类结果发生影响。


    基于属性条件独立性假设，则样本`x`属于`c[j]`的概率为


    ![](img/image_181.jpg)


    `P(c[j])`是标签`c[j]`在数据集中的概率，`P(x[i])`是该属性在数据集中的概率，`P(x[i]|c[j])`是属性`x[i]`出现在标签为`c[j]`的所有数据中的概率。


    最后取`P`最大时的`c[j]`


    ![](img/image_182.jpg)


    可以看出，朴素贝叶斯分类器的训练过程就是基于训练集`D`来估计先验概率`P(c[j])`，并为每个属性估计条件概率`P(x[i]|c[j])`。


    需注意的是，这种参数化的方法虽能使条件概率估计变得相对简单，但估计结果的准确性严重依赖于所假设的概率分布形式是否符合潜在的真实数据分布。在现实应用中，欲做出能较好地接近潜在真实分布的假设，往往需要在一定程度上利用关于应用任务本身的经验知识，否则若仅凭猜测来假设概率分布形式，则很可能产生误导性的结果。


    当训练集`D`有充足的独立同分布样本时，则可容易地估计出类先验概率。


    ![](img/image_183.jpg)


    式中，`d[cj]`为训练集中标签`c[j]`的样本集合。


    ![](img/image_184.jpg)


    对离散的属性而言，令表示训练集中标签为`c[j]`且第`i`个属性上取值为`x[i]`的样本的集合，则条件概率可估计为


    ![](img/image_185.jpg)


    对连续属性可以使用概率密度函数。


    需注意，若某个属性值在训练集中没有与某个类同时出现过，则直接进行判别将出现问题。由于式（5-61）的连乘式计算出的概率值为零，因此，无论该样本的其他属性是什么，分类的结果都将是否定的，这显然是不太合理的。


    因此为了避免其他属性携带的信息被训练集中未出现的属性值抹去，在估计概率值时通常要进行平滑，常用拉普拉斯修正。具体来说，令`N`表示训练集中可能的类别，`N[i]`表示第`i`个属性可能的取值数，则上述两式分别修正为


    ![](img/image_186.jpg)


    显然，拉普拉斯修正避免了因训练集样本不充分而导致概率估值为零的问题，并且在训练集变大时，修正过程所引入的先验的影响也会逐渐变得可忽略，使得估值渐趋向于实际概率值。


    在现实任务中，朴素贝叶斯分类器有多种使用方式。例如，若任务对预测速度要求较高，则对给定训练集，可将朴素贝叶斯分类器涉及的所有概率估值事先计算好存储起来，这样在进行预测时只需查表即可进行判别。若任务数据更替频繁，则可采用懒惰学习方式，先不进行任何训练，待收到预测请求时再根据当前数据集进行概率估值；若数据不断增加，则可在现有估值的基础上，仅对新增样本的属性值所涉及的概率估值进行计数修正即可实现增量学习。


    ### 5.4.4 决策树


    #### 1. 决策树模型

    决策树是机器学习中常用的一种学习方法。以二分类任务为例，它是一种树形结构，如图 5-20 所示。


    其中每个内部节点表示一个属性上的判断，每个分支代表一个判断结果的输出，最后每个叶节点代表一种分类结果。


    一般决策树包含一个根节点、若干个内部节点和若干个叶节点。根节点包含样本全集，从根节点属性开始测试，每个内部结点对应一个属性测试，每个叶节点对应一个决策结果或标签。可以看出，根节点的选择和内部节点的顺序影响决策树的泛化性能。


    ![](img/image_187.jpg)

    图 5-20 决策树示意图


    当前节点下的所有样本均属于同一类别时，将该节点标记为叶节点。当前节点下属性集为空或所有样本在属性上取值相同时，将该节点标记为叶节点，并将其类别设定为其父节点所含样本最多的类别，这是利用了当前节点的后验分布。当前节点下样本集合为空时，则将其父节点标记为叶节点，但将其类别设定为其父节点所含样本最多的类别，这是把父节点的样本分布作为当前节点的先验分布。


