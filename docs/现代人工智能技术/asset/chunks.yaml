    ### 8.2.6 策略迭代


    在实际使用过程中，我们希望能够找到最优策略以最大化回报值。为了寻找最优策略（或者比当前策略更好的策略），可以通过策略迭代的方法对当前策略进行优化。策略迭代分为策略评估和策略提升两个部分，本节将分别对这两个过程进行介绍。


    #### 1. 策略评估


    策略评估是为了计算一个策略的状态价值函数。在如式（8-34）所示的贝尔曼期望方程中，可以看到当奖励函数和状态转移函数已知的情况下，可以根据下一个状态`s′`的价值来计算当前状态`s`的价值。按照动态规划的思想，可以将求解下一个状态的价值当作当前问题的子问题。在知道下一个状态`s′`的价值后便可计算当前状态`s`的价值。


    ![](img/image_381.jpg)


    更一般地，对于所有状态`s`∈`S`，便可以根据第`k`轮的状态价值函数计算第`k+1`轮的状态价值函数，如下所示


    ![](img/image_382.jpg)


    根据贝尔曼期望方程，可知`V^k = V^π`为式（8-35）的一个不动点。根据压缩映射定理可以知道当迭代次数足够多（`k→∞`）时，序列{`V^k`}将会收敛到`V^π`。


    对于确定性策略，式（8-35）退化为如式（8-36）所示的形式。若状态集`S`规模较低，则可以直接采用贝尔曼方程的解析解（式（8-12））进行计算。


