    ### 2. 查准率、查全率与 F1


    错误率与精度虽常用，但并不能满足所有的任务需求。例如在信息检索中，我们经常会关心“检索出的信息中有多少比例是用户感兴趣的”以及“用户感兴趣的信息中有多少被检索出来了”。查准率与查全率是更为适用于此类需求的性能度量。


    对于二分类问题，可将样例根据其真实类别与学习器预测类别的组合划分为真正例（True Positive，`TP`）、假正例（False Positive，`FP`）、真反例（True
    Negative，`TN`）和假反例（False Negative，`FN`）四种情形，令`TP`、`FP`、`TN`、`FN`分别表示其对应的样例数，则显然有`TP`+`FP`+`TN`+`FN`=样例总数。分类结果的混淆矩阵见表
    5-1。


    表 5-1 混淆矩阵


    ![](img/image_119.jpg)


    查准率`P`与查全率`R`分别定义为


    ![](img/image_120.jpg)![](img/image_121.jpg)


    查准率和查全率是一对矛盾的度量。一般来说，查准率高时，查全率往往偏低；而查全率高时，查准率往往偏低。通常只有在一些简单任务中，才可能使查全率和查准率都很高。


    在很多情形下，我们可根据学习器的预测结果对样例进行排序，排在前面的是学习器认为最可能是正例的样本，排在最后的则是学习器认为最不可能是正例的样本。按此顺序逐个把样本作为正例进行预测，则每次可以计算出当前的查全率、查准率。以查准率为纵轴、查全率为横轴作图，就得到了查准率-查全率曲线，简称`P-R`曲线，显示该曲线的图称为`P-R`图（见图
    5-13）。


    `P-R`图直观地显示出学习器在样本总体上的查全率、查准率。在进行比较时，若一个学习器的`P-R`曲线被另一个学习器的曲线完全包住，则可断言后者的性能优于前者，例如图
    5-13 中学习器`A`的性能优于学习器`C`；如果两个学习器的`P-R`曲线发生了交叉，例如图 5-13 中的`A`与`B`，则难以一般性地判断两者孰优孰劣，只能在具体的查准率或查全率条件下进行比较。然而，在很多情形下，人们往往仍希望把学习器`A`与`B`比出个高低。这时一个比较合理的判据是比较`P-R`曲线下面积的大小，它在一定程度上表征了学习器在查准率和查全率上取得相对双高的比例。但这个值不太容易估算，因此，人们设计了一些综合考虑查准率、查全率的性能度量。


    ![](img/image_122.jpg)


    图 5-13 `P-R`图


    平衡点就是这样一个度量，它是查准率=`查全率`时的取值，例如图 5-13 中学习器`C`的平衡点是 0.64，而基于平衡点的比较，可认为学习器`A`优于`B`。


    平衡点还是过于简化了些，更常用的是基于查准率与查全率的调和平均的`F`度量：


    ![](img/image_123.jpg)


    在一些应用中，对查准率和查全率的重视程度有所不同。例如在商品推荐系统中，为了尽可能少打扰用户，更希望推荐用户感兴趣的内容，此时查准率更重要；而在逃犯信息检索系统中，更希望尽可能少漏掉逃犯，此时查全率更重要。`F`度量的一般形式是基于调和算术平均的`F[β]`，能让我们表达出对查准率/查全率的不同偏好，其定义为


    ![](img/image_124.jpg)


    其中，`β`>0 度量了查全率对查准率的相对重要性。`β`=1 时退化为标准的`F`；`β`>1 时查全率有更大的影响；`β`<1 时查准率有更大的影响。


    很多时候我们有多个二分类混淆矩阵，例如进行多次训练/测试，每次得到一个混淆矩阵；或是在多个数据集上进行训练/测试，希望估计算法的全局性能；甚至执行多分类任务时，每两两类别的组合都对应一个混淆矩阵，总之，我们希望在`n`个二分类混淆矩阵上综合考察查准率和查全率。


    一种直接的做法是先在各混淆矩阵上分别计算出查准率和查全率，记为（`P`，`R`），（`P`，`R`），…，（`P[n]`，`R[n]`），再计算平均值，这样就得到宏查准率、宏查全率，以及相应的宏`F`：


