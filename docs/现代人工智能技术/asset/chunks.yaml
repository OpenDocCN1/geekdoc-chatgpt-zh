    ### **4.2.1 遗传算法的基本思想**


    遗传算法就是以达尔文的生物进化论为基础，利用了生物进化过程中适者生存的规律。在遗传算法中，数据和数组对应的就是生物遗传过程中的染色体，这通常是由一维的数据串结构来表示的。同样，数据串上的各个位置对应的就是染色体上的基因座，位置所包含的遗传信息就是染色体上的基因信息。遗传算法处理的是染色体，也可以成为基因型个体。首先是选择一个群体，当生物到了一定数量就会形成种群，种群中的生物数量称为种群规模，也就是种群的大小。种群中的各个个体对于环境的适应状况称为适应度。适应度大的个体则会有更大的生存下去的可能，因此将会有更大的可能被选择，适应度小的个体并不是不会被选择，只是被选择的可能性要小很多，这就好比在生物进化当中对环境适应度小的个体生存下去的可能性就会很小，但并不是就一定会死亡，凡事总有偶然的可能性，这就体现了物竞天择、适者生存的原理。选择两串数据进行交叉然后会产生一组新的数据串，这就类似生物进化过程中两个适应度大的个体会被选择然后繁衍出新的个体。在编码过程中某个份量的变化对应的其实就是生物遗传过程中的变异。


    遗传算法包含两个数据转换的操作，从表现型到基因型的转换，将搜索空间中的参数或解转换为遗传空间中的染色体或个体，这一过程称为编码。另一种是从基因型到表现型的转化，把个体转化为搜索空间的参数，这个过程叫作解码。


    遗传算法求解问题是从选择开始的，也就意味着一开始问题的求解有多个可能性，因此遗传算法是从多个解开始的，通过各种限制条件也就是所谓法则，然后一步一步地排除劣质的解，当然这个过程中也可能产生新的解，通过法则进行逐步的迭代，最终会形成一个最优解的集合，我们称为种群，记为*F*（*t*），这里*t*是指迭代步，就是演化的代数。一般地，*F*（*t*）中元素的个数是在整个迭代过程中固定的，因此可将种群的规模记为*M*，种群中的元素称为染色体或者个体，记为*x*（*t*），*x*（*t*），*x*（*t*），*x*（*t*），*x*（*t*）等在演化进行时，要选择当前解，然后进行交叉产生新一代的解。这些当前的解称为父解，新产生的解称为后代解。


