    #### 2. 牛顿法

    和梯度下降法一样，牛顿法也是寻找导数为 0 的点，同样是一种迭代法。核心思想是在某点处用二次函数来近似目标函数，得到导数为 0 的方程，然后求解该方程，得到下一个迭代点。因为是用二次函数近似，所以可能会有误差，需要反复这样迭代，直到达到导数为
    0 的点处。


