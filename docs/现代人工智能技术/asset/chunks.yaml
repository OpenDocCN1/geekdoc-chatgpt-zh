    `SMO`的基本思路是先固定`α[i]`之外的所有参数，然后求`α[i]`上的极值。由于存在约束，若固定`α[i]`之外的其他变量，则`α[i]`可由其他变量导出。于是，`SMO`每次选择两个变量`α[i]`和`α[j]`，并固定其他参数。这样，在参数初始化后，`SMO`不断执行如下两个步骤直至收敛。具体操作不在此详细介绍。


