    （2）锦标赛选择锦标赛选择方法是从种群中随机选择`m`个个体，将其中适应度最高的个体保存至下一代，只有适应度值高于其他`m`-1 个个体才能赢得锦标赛，这一过程会在算法过程中反复进行，直到保存到下一代的个体数量达到了预先设定的值为止。`m`称为竞赛规模。最劣的个体永远不会被保存，而最优的个体将总是会赢得锦标赛。在锦标赛选择方法中，选择压力可以通过改变个体数量`m`的大小来改变，当`m`的值较大时，种群中适应度值较差的个体将很难被选择，常见的有二元锦标赛、三元锦标赛等。与适应度比例选择相比，锦标赛选择由于缺乏随机噪声，在实际应用中经常使用，同时锦标赛选择与遗传算法的适应度函数的尺度没有关系，因为仅仅是比较绝对值的大小，无关正负值。锦标赛选择方法克服了适应度比例法的基于适应度的值以及排名的选择在种群规模特别大时计算的复杂性，因此可以得到更加多样化的种群。####
    （3）随机遍历选择随机遍历选择是一种给定概率以最小化波动概率的方式选择个体的方法（见图 4-2）。可以将其看作是一种特殊的轮盘赌游戏，在轮盘上有`n`个等间距的点进行旋转选择。随机遍历选择使用一个随机值在等间隔的空间间隔里选择个体，相比于适应度比例法，该方法中适应度值较差的个体也有很大的被选择的概率，从而奖励了不公平性。该方法是由
    James Baker 提出的，展示了其原理，其中`m`为要选择的个体数量。随机遍历选择保证了选出的子代，比轮盘赌选择更接近真实的情况。![](img/image_046.jpg)


    图 4-2 随机遍历选择示意图


    #### （4）玻尔兹曼选择

    玻尔兹曼选择器的选择概率定义如下：


    ![](img/image_047.jpg)


    式中，`b`是控制选择强度的参数；`Z`的定义如下：


    ![](img/image_048.jpg)![](img/image_049.jpg)


    当`b`>0 时，高适应度值的个体被选择的概率将会被增大；当`b`<0 时则概率被降低；当`b`=0 时，所有个体被选择的概率为。


    #### （5）最佳个体保存方法

    最佳个体保存方法或者称为精英选择法是把种群中适应度最高的个体或者多个个体不经过交叉而直接复制到下一代（通过精英主义被保留下来的仍有资格被选为下一代的父代），这样就保证了当遗传算法结束时最终的子代的个体中都是历代适应度最高的个体。使用这种方法可以明显提高遗传算法的效率，但是由于使得快速收敛可能会导致局部最优解。实验结果显示当保存种群个体数量的
    2%～5%的最高适应度个体时，其方法的效果最为理想。


    因此，在使用其他方法时通常会同时使用最佳个体保存方法使得最优个体不会丢失。


    ## 4.2.8 交叉

    当自然界的生物有机体交配或者复制时，其遗传物质会相互混合从而产生拥有新的基因组成的染色体的个体，遗传物质重组的过程就叫作交叉。


    交叉之后后代可能会继承双方优良的基因，从而表现出更好的适应度，但也不排除继承了双方的缺点，从而难以生存下去，甚至无法复制自己。在这些后代中，越能适应环境的后代则越有机会将自己的基因遗传给后代，这就会形成一种趋势，每一代都会比其父母这一代生存和复制得更好。


    在遗传算法中起到核心作用的是交叉算子，也叫基因重组，就是把两个父体部分结构加以替换，生成新的个体的操作，习惯上对实数编码的操作叫作重组，对二进制编码的操作称为交叉。子代可以部分或者全部继承来自父代的结构特征和有效基因。


    ### 1. 基本交叉算子

    #### （1）一点交叉

    一点交叉又称为简单交叉。其操作就是在所选择的交叉个体的染色体上随机选择一个交叉点，交叉时该点的前或后的部分结构进行交叉替换从而形成两个个体。


    #### （2）两点交叉

    与上面提到的一点交叉很相似，两点交叉则是在交叉的染色体上随机选择两个点，两点之间的部分结构进行交叉替换，从而形成两个新的染色体。与此类似，多点交叉也是如此。


    #### （3）部分映射交叉

    第一步，随机选择一对染色体（父代）中的几个基因的起止位置（两个染色体被选的位置相同）：


    ![](img/image_050.jpg)


    第二步，交换这两组基因的位置：


    ![](img/image_051.jpg)


    第三步，做冲突检测，根据交换的基因建立一个映射关系，以 1-6-3 这一个映射关系为例，可以看到第二步结果中子代 1 存在两个基因 1，这时将其通过映射关系转变为基因
    3，以此类推至没有冲突为止，最后所有冲突的基因都会经过映射，保证形成新的一对子代基因无冲突。


    最终结果为


    ![](img/image_052.jpg)


    #### （4）有序交叉

    第一步与部分映射交叉一样，随机选择一对染色体（父代）中的基因的起止位置（两个染色体被选的位置相同）：


    ![](img/image_053.jpg)


    第二步，生成一个子代，并保证子代被选中的基因位置与父代相同：


    ![](img/image_054.jpg)


    第三步（可再分两个小步），先找出第一步选中的基因在另一个父代中的位置，再将其余基因按顺序放入上一代生成的子代中：


    ![](img/image_055.jpg)


    需要注意的是，这种算法也会产生两个子代，另一个子代生成的过程则完全相同，只需要将两个父代染色体交换位置，第一步选中的基因型位置相同，本例中的另一个子代为 254913678。


    与部分映射交叉不同的是，不用进行冲突检测工作（实际上也只有部分映射交叉需要冲突检测工作）。


    #### （5）定位交叉

    第一步，选择一对染色体（父代）中的几个基因，位置不可以连续，两个染色体被选择的位置要相同：


    ![](img/image_056.jpg)


    第二步，与有序交叉的第二步相同，并保证子代被选中的位置与父代相同：


    ![](img/image_057.jpg)


    第三步，也与有序交叉的第三步相同，先找出选中的基因在另一个父代染色体上的位置，再将其余基因按顺序放入上一步生成的子代当中：


    ![](img/image_058.jpg)


    与以上两个算法不同的是，这里选择的基因位置是可以不连续的，除了这一点外，其他均与有序交叉相同，本例的另外一个子代为 243519678。


    ### 2. 修正的交叉方法

    在交叉过程中，会产生一些不满足约束条件的非法染色体。为了解决这种情况，可以构造惩罚函数的方法，但是效果不佳，因为这将会使得原本就复杂的算法变得更加复杂，使算法的运算效率降低。另一种方法就是对交叉变异等操作进行修正，使非法染色体经过修正后自动满足优化问题的约束条件。


    ## 4.2.9 变异

    变异是生物进化的根本动力，如果不存在变异，那么即使经过成千上万代的交叉遗传，生物的适应能力依然是不会进步的，例如眼睛的大小顶多维持在原种群眼睛最大的个体的程度而不会有进步。而从生物进化的角度来看，生物各种适应能力（包括人类一代又一代变大的眼睛）是在加强的，所以也就是说存在某种打破当前基因型的一种力量，使得生物可以在一代又一代的交叉中不断地突破自我。发生变异的概率通常都很小，但是经过很多代的持续变异以后将会产生巨大的变化。当然，变异并不会朝着生物的意愿而产生，变异是没有规律的，很多变异都是对生物不利的，也有一部分变异对生物的适应性没有影响，但也有一部分会给生物带来好处，使它们的能力远超其他个体，物竞天择，因此便会在生物进化中脱颖而出。此外，生物进化的机制不仅可以改进已有的能力特征，还可能会产生新的特征。


    在遗传算法中，变异是将个体编码的一些位进行随即变换，变异的目的是为了维持个体基因的多样性，对选择和交叉过程中丢失的一些基因进行修复和补充。变异算子是对群体中的某些个体串的基因座上的基因值进行变动，变异操作是按位进行的，即把某一位的内容进行变异，变异的概率是一个染色体中按位进行变化的概率，主要有以下几种变异：


    #### （1）位点变异

    位点变异是对群体中的个体码串，随机地去挑选一个或者多个位置，并对这些位置的基因值以变异概率`P`（一般不能很大）进行变动。对于二进制编码的个体来说，若某个位置的原基因值为
    1，那么变异以后的值为 0，反之也是这样。对于正数编码，则是依据其值变异后出现的概率进行选择，此外为了消除编译过程中出现的非法染色体，我们会将其他位置的基因值变为被选择基因。


    m


    #### （2）逆转变异

    在选择的个体码串上随机地选择两个点，将两个点之间的基因值进行逆转排序然后再插入原位置上。


    #### （3）插入变异

    在选择的个体码串上随机选择一个编码，然后插入得到选择插入点的位置。


    #### （4）互换变异

    在选择的个体码串中选择两个位置基因值进行简单的交换。


    #### （5）移动变异

    随机地选择一个基因值，然后随机向左或向右移动随机位数。


