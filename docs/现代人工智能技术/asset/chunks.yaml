    ### **9.3.3 基于模型参数评估**


    基于模型参数评估是指利用模型参数更新的大小来衡量每个参与者的数据价值，评估参与者的贡献度。该方法假设模型参数更新的大小与数据集的质量和多样性成正比，因此可以反映参与者对最终模型性能的影响。这种方法的优点是不需要访问参与者的原始数据，保护了数据隐私；也不需要额外的通信开销，节省了资源。缺点是可能存在激励不足或过度激励问题，即某些参与者可能得到低于或高于其真实的贡献度。


