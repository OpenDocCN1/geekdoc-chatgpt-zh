    # 第 9 章


    ## 联邦学习


    本章首先介绍了联邦学习的概念，接着介绍了隐私保护技术和激励机制，最后介绍了横向联邦学习、纵向联邦学习、联邦迁移学习三种基本技术。


    ## 9.1 联邦学习的概念


    ### 9.1.1 人工智能面临的挑战


    2016 年是人工智能（Artificial Intelligence，AI）走向成熟的一年。随着 AlphaGo 击败人类顶尖的围棋棋手，AI 的巨大潜力被见证，人们开始期望有更多、更复杂、更先进的
    AI 技术被应用在生活当中。近些年来，机器学习（Machine Learning，ML）无疑是 AI 应用领域的热点话题，在推荐系统、自然语言处理、语音识别、机器视觉等多领域中迅猛发展，并取得了不小的突破。需要注意的是，这些
    AI 技术的成功应用，离不开大量数据的支撑。通过大数据的使用，这些 AI 系统才能够实现许多人类难以完成的任务。例如，2016 年 AlphaGo 总共使用了
    30 万个棋局作为训练数据，最终取得出色的成绩；Facebook 公司的目标检测系统则利用来自 Instagram 的 3.5 亿张图像数据集进行训练得到。


    遗憾的是，虽然已经有了诸如 AlphaGo 的 AI 技术成功应用的例子，但想要让此类大数据驱动型 AI 在我们生活的各个方面早日实现还是十分困难的。首当其冲的就是数据的获取。除少数行业外，大多数领域通常只能得到小数据，即数据有限或数据质量较差。因此，这一个个小数据就好像是数据海洋中的一个个孤立的小岛，无法聚合在一起发挥作用。那能否通过跨组织的数据传输，将一个个孤岛桥接起来，把数据融合在一个公共的站点中？这个想法很好，但实际上，要打破不同数据源之间的障碍在大多数情况下都是十分困难的。通常，任何
    AI 项目中所需的数据都涉及多种类型。例如，在 AI 驱动的产品推荐服务中，产品卖方拥有有关产品的信息、用户购买的数据，但没有描述用户购买能力和付款习惯的数据。由于行业竞争、隐私安全和复杂的管理程序，即使同一公司的不同部门之间的数据集成也面临着巨大的阻力。因此，大数量、高质量的训练数据通常是很难获得的，所有
    AI 技术研发应用者们不得不面对难以桥接的数据孤岛。


    同时，随着大型公司对数据安全和用户隐私的妥协意识日益增强，对数据隐私和安全的重视已成为全球性的主要问题。在法律层面，法规制定者和监管机构正在考虑出台新的法律来规范数据的管理和使用，例如，欧盟于
    2018 年 5 月 25 日实施的《通用数据保护条例》（General Data Protection Regulation，GDPR）；美国于 2020
    年 1 月在加利福尼亚州实施的《加利福尼亚州消费者隐私法》（California Consumer Privacy Act，CCPA）；中国于 2017 年颁布的《中华人民共和国民法通则》和《中华人民共和国网络安全法》同样对数据的收集和处理提出了严格的约束和控制要求。这些法规的建立显然将有助于建立一个更加文明的社会，但也将给当今
    AI 中普遍使用的数据交互带来新的挑战。


    AI 中的传统数据处理模型通常涉及简单的数据交互模型，其中一方收集数据并将其传输到另一方，而另一方将负责整理和融合数据。最后，第三方将获取集成数据并构建模型，以供其他各方使用。模型通常是作为服务出售的最终产品。在如今的法律环境下，不同组织间的数据收集和分享工作会越来越困难，某些高度敏感的数据（例如，金融交易数据和医疗健康数据等）的拥有者也会极力反对无限制地使用这些数据进行训练。更关键的是，以往的传统程序面临着新数据法规和法律的挑战，我们的数据是孤立的孤岛形式，但是在许多情况下，我们被禁止在不同地方收集、融合和使用数据进行
    AI 处理。如何合法地解决数据碎片和隔离问题是 AI 研究人员和从业人员面临的主要挑战。


    ### 9.1.2 联邦学习的定义


    如上文所述，为了解决由数据孤岛所带来的模型训练问题，人们开始寻找一种不必将所有数据集中到一个中心储存点就能完成训练的方法。联邦学习（Federated Learning，FL）便应运而生，其核心思想是：每一个小数据源的所有者自己训练一个小模型，各个所有者交换模型信息，最终通过模型聚合得到一个全局模型。整个过程中不涉及所有者本身的数据交互，模型信息的交换过程也被精心设计，以保证用户隐私和数据安全。


    联邦学习最初由 McMahan 等人 ^(¹⁹)


    更一般地，假设有`N`个数据所有者{`F`，`F`，…，`F`[`N`]}，他们希望用各自的数据{`D`，`D`，…，`D`[`N`]}共同训练一个机器学习模型。传统方法是将所有的数据集合在一起得到`D`=`D`∪…∪`D`[`N`]，储存在一个中心储存点中，从而在该中心储存点上使用集中后的数据集`D`训练得到所需的模型`M`。在传统方法中，任何数据所有者`F`[`i`]都面临着将自己的数据`D`[`i`]暴露给中心储存节点甚至其他数据所有者的风险。联邦学习方法则是每个数据所有者`F`[`i`]利用自己的数据`D`[`i`]训练小模型`M`[`i`]，利用这些小模型{`M`，`M`，…，`M`[`N`]}交互聚合得到最终的模型`M`。在联邦学习方法中，任何数据所有者`F`[`i`]都不会将其数据`D`[`i`]暴露给其他人。设`ν`和`ν`分别为模型`M`和`M`的精度值，那么对于任意`δ`＞0，有


    ![](img/image_541.jpg)


    则称联邦学习模型`M`有`δ`的精度损失。


    FED


    式（9-1）表述了以下客观事实：在分布式数据上利用联邦学习方法构建机器学习模型，这个模型在未来数据上的性能在一定程度上能逼近把所有数据集中一起训练所得到的模型性能。在某些场景下，相比于`δ`的精度损失，联邦学习所带来的数据安全性和隐私保护更有价值，所以联邦学习模型在性能上与集中训练模型的些许差距是可以接受的。


    ### 9.1.3 联邦学习的分类


    令矩阵***D***表示每个数据所有者`i`持有的数据。矩阵的每一行代表一个样本，每一列代表一个特征。同时，某些数据集可能还包含标签数据，如财务字段中用户的信用、营销字段中用户的购买意愿等。我们将特征空间表示为`X`，将标签空间表示为`Y`，将样本
    ID 空间表示为`I`。特征空间`X`、标签空间`Y`和样本 ID 空间`I`构成了完整的训练数据集（`I`，`X`，`Y`）。数据参与方的特征和样本空间可能并不相同，根据特征和样本
    ID 空间中各方之间的数据分布情况，将联邦学习分为横向联邦学习（Horizontal Federated Learning，HFL）、纵向联邦学习（Vertical
    Federated Learning，VFL）和联邦迁移学习（Federated Transfer Learning，FTL） ^(²⁰)


    #### 1. 横向联邦学习


    横向联邦学习适用于各数据所有者的业务类型相似、所获得的数据特征有重叠而样本只有较少重叠或基本无重叠的场景。例如，各地区不同的商场拥有客户的购物信息大多类似，但是用户人群不同。两个数据所有者参与的横向联邦学习定义如图
    9-1 所示。


    ![](img/image_542.jpg)


    图 9-1 横向联邦学习定义


    横向联邦学习以数据的特征维度为导向，取出各数据所有者数据中特征相同而用户不完全相同的部分进行联合训练。在此过程中，通过各数据所有者之间的样本联合，扩大了训练的样本空间，从而提升了模型的准确度和泛化能力。


    #### 2. 纵向联邦学习


    纵向联邦学习适用于各数据所有者之间的数据样本空间重叠较多、而特征空间重叠较少或没有重叠的场景。例如，某区域内的银行和商场，由于地理位置相近，所服务的用户交叉较多，样本空间有大量重叠，但因为业务类型不同，用户的特征相差较大。两个数据所有者参与的纵向联邦学习定义如图
    9-2 所示。


    ![](img/image_543.jpg)


    图 9-2 纵向联邦学习定义


    纵向联邦学习是以共同数据样本为数据的对齐导向，取出数据所有者数据中样本相同而特征不完全相同的部分进行联合训练。因此，在联合训练时，需要先对各数据所有者数据进行样本对齐，获得样本重叠的数据，然后各自在被选出的数据集上进行训练。此外，为了保证非交叉部分数据的安全性，在系统级进行样本对齐操作，每个数据所有者只有基于本地数据训练的模型。


    #### 3. 联邦迁移学习


    联邦迁移学习是对横向联邦学习和纵向联邦学习的补充，适用于各数据所有者彼此样本空间和特征空间都重叠较少的场景。例如，不同地区的银行和商场之间，样本空间和特征空间基本无重叠。在该场景下，采用横向联邦学习可能会产生比单独训练更差的模型，采用纵向联邦学习可能会产生负迁移的情况。两个数据所有者参与的联邦迁移学习定义如图
    9-3 所示。


    联邦迁移学习基于各数据所有者的数据或模型之间的相似性，将在原始域中学习的模型迁移到目标域中。大多采用原始域中的标签来预测目标域中的标签准确性。


    ![](img/image_544.jpg)


    图 9-3 联邦迁移学习定义


    ## 9.2 隐私保护技术


    ### 9.2.1 联邦学习面临的隐私泄露风险


    联邦学习的训练过程中避免了各数据所有者数据的直接交换，与传统机器学习方法的集中式训练相比，更好地保障了参与者的隐私。这是否意味着使用联邦学习就能使隐私绝对安全呢？当然不是，就联邦学习本身而言，其使用的技术并未提供全面充分的隐私保护，在整个工作流程中仍然面临着隐私泄露风险。


    首先，虽然联邦学习采取交换抽象、可解释性低的模型信息的形式进行训练，但是这些模型信息是通过原始数据经过计算处理后得到的，仍然携带着原始数据的痕迹。这些原始数据痕迹暴露在所有参与训练的成员中，带来隐私泄露的风险。例如，通过对模型信息的推断，可以确定其是否来自于某个特定的数据所有者，或是根据模型信息利用梯度还原部分原始数据等。


