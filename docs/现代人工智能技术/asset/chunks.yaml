    # 5.5 无监督学习


    ## 5.5.1 基本模型


    正如前一节中所介绍的，对于有标签的数据，我们进行有监督学习，常见的分类任务就是监督学习；而对于无标签的数据，我们希望发现无标签的数据中的潜在信息，这就是无监督学习。此类学习任务中研究最多、应用最广的是聚类，它的概念是：将相似的对象归到同一个簇中，使得同一个簇内的数据对象的相似性尽可能大，同时不在同一个簇中的数据对象的差异性也尽可能大。即聚类后同一类的数据尽可能聚集到一起，不同类的数据尽量分离。通过对无标记训练样本的学习来揭示数据的内在性质及规律，为进一步的数据分析提供基础。原始数据和分类结果如图
    5-23 所示。


    ![](img/image_217.jpg)


    图 5-23 原始数据和分类结果


    对聚类结果，我们需通过某种性能度量来评估其好坏。另一方面，若明确了最终将要使用的性能度量，则可直接将其作为聚类过程中的优化目标，从而更好地得到符合要求的聚类结果。聚类结果的簇内相似度高且簇间相似度低。常见的度量指标有两种，外部指标和内部指标。


    外部指标为将聚类结构与某个参考模型进行比较，通常也可以称为有监督情况下的一种度量聚类算法和各参数的指标。值越大表明聚类结果和参考模型（有标签的、人工标准或基于一种理想的聚类的结果）直接的聚类结果越吻合，聚类结果就相对越好。


    常用的聚类性能度量外部指标有`Jaccard`系数（`JC`）、`FM`指数（`FMI`）、`Rand`指数（`RI`）。这些性能度量的结果值均在［0，1］区间。


    内部指标是无监督的，无需基准数据集，不需要借助于外部参考模型，利用样本数据集中样本点与聚类中心之间的距离来衡量聚类结果的优劣。


    通常会考虑紧密度、分割度等，紧密度是指每个聚类簇中的样本点到聚类中心的平均距离，分割度是指每个簇的簇心之间的平均距离。常用的聚类性能度量内部指标有`DB`指数（简称`DBI`，`DBI`值越小越好）、`Dunn`指数（简称`DI`，`DI`值越大越好）。


    以上描述中，多次提及距离。距离度量一般拥有非负性、同一性、对称性、直递性。


    对于给定样本`x[i]`=（`x[i]`，`x[i]`，…，`x[in]`）与`x[j]`=（`x[j]`，`x[j]`，…，`x[jn]`），最常用的是闵可夫斯基距离。


    ![](img/image_218.jpg)


    `p`=2 时，即为欧氏距离


    ![](img/image_219.jpg)


    `p`=1 时，即为曼哈顿距离


    ![](img/image_220.jpg)


    在讨论距离计算时，属性上的序关系更为重要。例如定义域为{1，2，3}的离散属性与连续属性能直接在属性值上计算距离“1”“2”比较接近、与“3”比较远，这样的属性称为有序属性；而定义域为{苹果，李子，香蕉}这样的离散属性则不能直接在属性值上计算距离，称为无序属性。


    对有序属性的度量，直接在属性值上计算距离，可使用闵可夫斯基距离、欧氏距离、曼哈顿距离。


    对无序属性的度量，不能直接在属性值上计算距离，可使用`VDM`（Value Difference Metric）距离。令`m[u]`表示在属性`u`上取值为`a`的样本数，`m[u]`表示第`i`个样本簇中在属性`u`上取值为`a`的样本数，`k`为样本簇数，则属性`u`上两个离散值`a`与`b`之间的`VDM`距离为


    ![](img/image_221.jpg)


    对混合属性的度量，由于混合属性既有有序属性又有无序属性，因此可将闵可夫斯基距离和`VDM`结合处理混合属性。当样本空间中不同属性的重要性不同时，可使用加权距离。类与类之间的距离度量通常会使用最短距离或单连接、最长距离或完全连接、中心距离、平均距离等。


    需注意的是，某些任务中我们可能希望有这样的相似度度量“人”与“人马”相似，“马”与“人马”相似，但“人”与“马”很不相似；要达到这个目的，可以令“人”“马”与“人马”之间的距离都比较小，但“人”与“马”之间的距离很大，即该距离不满足直递性，这样的距离称为非度量距离。此外，本节介绍的距离计算式都是事先定义好的，但在不少现实任务中，有必要基于数据样本来确定合适的距离计算式，这可通过距离度量学习来实现。


    ## 5.5.2 K 均值


    `K`均值（`K-Means`）算法是基于原型聚类的一种，此类算法假设聚类结构能通过一组原型刻画，在现实聚类任务中极为常用。通常情形下，算法先对原型进行初始化，然后对原型进行迭代更新求解。采用不同的原型表示、不同的求解方式将产生不同的算法。


    给定样本集`D`={`x`，`x`，…，`x[m]`}，`K`均值算法将其划分为`k`个簇`C`={`C`，`C`，…，`C[k]`}，并最小化其平方误差


    ![](img/image_222.jpg)![](img/image_223.jpg)


    式中，是簇`C[i]`的均值向量。`E`值越小则簇内样本相似度越高。


    最小化式（5-99）并不容易，找到它的最优解需考察样本集所有可能的簇划分，这是一个`NP`难问题


    1）首先我们选择一些类/组，并随机初始化它们各自的中心点。中心点是与每个数据点向量长度相同的位置。这需要我们提前预知类的数量（即中心点的数量）。


    2）计算每个数据点到中心点的距离，数据点距离哪个中心点最近就划分到哪一类中。


    3）计算每一类中中心点作为新的中心点。


    4）重复以上步骤，直到每一类中心点在每次迭代后变化不大为止。也可以多次随机初始化中心点，然后选择运行结果最好的一个。


    可以看出，该算法的优点在于速度快、计算简便，但是缺点也很明显，我们必须提前知道数据有多少类/组。


    `K-Medians`是`K-Means`的一种变体，是用数据集的中位数而不是均值来计算数据的中心点。其优势是使用中位数来计算中心点不受异常值的影响；缺点是计算中位数时需要对数据集中的数据进行排序，速度相对于`K-Means`较慢。


