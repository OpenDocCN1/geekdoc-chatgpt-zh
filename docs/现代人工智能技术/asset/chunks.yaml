    ### 8.2.5 最优策略


    在强化学习中，通常是期望找到一个策略，使得智能体在与环境互动过程中获得奖励值的期望值最大。首先需要定义策略之间的偏序关系：对于策略`π`和`π′`，当且仅当∀`s`∈`S`，`V^{π′}`（`s`）≥`V^{π}`（`s`），则可以认为有`π′`≥`π`。


