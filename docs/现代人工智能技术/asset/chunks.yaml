    否定前件是指，在已知`P`→`Q`为真的情况下，通过否定`P`为假来推出`Q`为假。这也是不合逻辑的。


    例如，下面的推理就使用了否定前件的推理，违反了逻辑规则：

    1）如果下雨，那么地上是湿的。

    2）没有下雨（否定前件）。

    3）所以，地上不湿。


    这显然是不正确的。因为即使没有下雨，地上也可能因为其他原因而湿。事实上，只要仔细分析蕴涵`P`→`Q`的定义，就会发现当`P`→`Q`为真时，肯定后件或否定前件所得的结论都不能确定，可能为真也可能为假。


    下面举例说明自然演绎推理方法。


    ### 例3.1

    设已知如下事实：

    1）凡是容易的课程小张（`Zhang`）都喜欢。

    2）`A`班的课程都是容易的。

    3）`C++`是`A`班的一门课程。


    求证：小张喜欢`C++`这门课程。


    ### 证明

    首先定义谓词：

    `EASY`（`x`）：`x`是容易的；

    `LIKE`（`x`，`y`）：`x`喜欢`y`；

    `A`（`x`）：`x`是`A`班的一门课程。


    把上述已知事实及待求证的问题用谓词公式表示出来：

    ![](EPUB/images/image_018.jpg)


    应用推理规则进行推理：

    因为

    （∀`x`）（`EASY`（`x`）→`LIKE`（`Zhang`，`x`））

    所以由全称固化得

    `EASY`（`z`）→`LIKE`（`Zhang`，`z`）


    因为

    （∀`x`）（`A`（`x`）→`EASY`（`x`））

    所以由全称固化得

    `A`（`y`）→`EASY`（`y`）


    由`P`规则及假言推理得

    `A`（`C++`），`A`（`y`）→`EASY`（`y`）⇒`EASY`（`C++`）

    `EASY`（`C++`），`EASY`（`z`）→`LIKE`（`Zhang`，`z`）


    由`T`规则及假言推理得

    `LIKE`（`Zhang`，`C++`）


