    这样的话，当输出层误差接近于0的时候，就可以令*λ*\>1，这样的结果就可以提高BP神经网络算法的收敛速度。另一种在激活函数上做处理的方法是改变Sigmoid函数为Relu函数。


    另一种让算法迅速逃离平坦区的方法是增加动量项。标准BP神经网络算法的权值调节公式为


