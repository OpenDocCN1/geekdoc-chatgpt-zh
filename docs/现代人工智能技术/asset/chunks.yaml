    在非均等代价下，ROC曲线不能直接反映出学习器的期望总体代价，而代价曲线则可达到该目的。代价曲线图的横轴是取值为［0，1］的正例概率代价


    ![](EPUB/images/image_137.jpg)


    式中，*p*是样例为正例的概率；纵轴是取值为［0，1］的归一化代价


    ![](EPUB/images/image_138.jpg)


    式中，FPR是式（5-28）定义的假正例率；FNR=1-TPR是假反例率。代价曲线的绘制很简单：ROC曲线上每一点对应了代价平面上的一条线段，设ROC曲线上点的坐标为（TPR，FPR），则可相应地计算出FNR，然后在代价平面上绘制一条从（0，FPR）到（1，FNR）的线段，线段下的面积即表示了该条件下的期望总体代价；如此将ROC曲线上的每个点转化为代价平面上的一条线段，然后取所有线段的下界，围成的面积即为在所有条件下学习器的期望总体代价，如图5-15所示。


