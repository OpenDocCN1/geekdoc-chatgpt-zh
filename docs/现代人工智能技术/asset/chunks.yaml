    ### **4.2.11 遗传算法的特点**


    遗传算法比起其他普通的优化搜索，采用了许多独特的方法和技术，总结起来主要有以下几个特点：


    1）遗传算法从问题解的串集开始搜索，而不是从单个解开始。这是遗传算法与传统优化算法的极大区别。传统优化算法是从单个初始值迭代求最优解的，容易误入局部最优解。遗传算法从串集开始搜索，覆盖面大，利于全局择优。


    2）遗传算法同时处理群体中的多个个体，即对搜索空间中的多个解进行评估，减少了陷入局部最优解的风险，同时算法本身易于实现并行化。


    3）遗传算法基本上不用搜索空间的知识或其他辅助信息，而仅用适应度函数值来评估个体，在此基础上进行遗传操作。适应度函数不仅不受连续可微的约束，而且其定义域可以任意设定。这一特点使得遗传算法的应用范围大大扩展。


    4）遗传算法不是采用确定性规则，而是采用概率的变迁规则来指导它的搜索方向。


    5）具有自组织、自适应和自学习性。遗传算法利用进化过程获得的信息自行组织搜索时，适应度大的个体具有较高的生存概率，并获得更适应环境的基因结构。


    6）此外，算法本身也可以采用动态自适应技术，在进化过程中自动调整算法控制参数和编码精度，比如使用模糊自适应法。


    ## **4.3 遗传算法的改进算法**


    ### **4.3.1 改进算法**


    为了使遗传算法的性能更加优越，人们提出了许多改进算法。下面将对几种改进算法进行介绍。


    上文所阐述的为单倍体遗传算法，即Holland提出的基本遗传算法，该算法的每个基因型由一条染色体组成（基因型为AB，分别只有一个等位基因A和B）。自然界中只有少部分的植物是单倍体遗传，大多数动物和高级植物都是采用双倍体遗传（也就是基因型为AaBb），即每个基因型都由一对染色体来决定，这就导致显隐性遗传问题的出现。由于双倍遗传体拥有显隐性染色体，因此该算法提供了一种记忆以前有用的基因块的功能：在某些低适应度的染色体中，其局部的基因块十分有用，是最优解中的基因片段，但由于基因块在当前染色体中的位置不适等因素，导致当前染色体适应度不高，因此保留这些基因块，将有利于提高物种的适应能力。


    双倍体遗传采用显性遗传，该遗传延长了有用的基因块的寿命，提高了算法的收敛能力，且即使变异的概率很低，仍能保持种群一定水平的多样性。Goldberg用动态Knapsack问题进行了比较研究，试验结果表明双倍体比单倍体的动态跟踪能力更强。


    双倍体遗传算法的设计步骤为：


    1）编码：对于双倍体遗传算法，群体中的每个个体都拥有两个染色体，一个为显性染色体，另一个为隐性染色体，双倍体遗传的染色体编码跟基本遗传算法是相同的。


    2）复制算子：在进行复制操作时，计算显性染色体的适应度，需要按照显性染色体的概率将个体基因复制到下一代群体当中。


    3）交叉算子：从种群中取出两个个体，两个个体的显性染色体进行交叉操作，隐性染色体也进行交叉操作，显性染色体的交叉概率和隐性染色体的交叉概率可以是不同的，但是工程上为了实验的方便，通常会使显隐性染色体的交叉率相同，然后进入下一代。


    4）变异算子：对于双倍体遗传算法，显性染色体的变异概率按照*P*进行，而隐性染色体则按照较大的概率进行。


    m


    5）双倍体遗传算法显隐性重排算子：当三个遗传算子都执行完以后，将个体染色体的显隐性进行重新排列，个体适应度高的染色体被设定为显性染色体，个体适应度低的染色体被设定为隐性染色体。


    ### **4.3.2 双种群遗传算法**


    **1. 基本思想**


    双种群遗传算法意在突破基本遗传算法的平衡态，基本遗传算法通过复制种群，然后进行交叉、变异等操作，类似于人类的进化过程。在一个种群当中的人随着时间的推移而不断地进化，长时间的进化会使某些特征趋于更加优良的状态，这体现了算法在全力逼近全局的最优解。但是由于这个种群的生长、演化以及环境和原始祖先的局限性，使其达到一个临界点后进化会趋于停止，该种群的特性就不会再变化，我们称该状态为平衡态。而双种群就是为了打破这种平衡态，增加了一步杂交操作，即交换种群之间优秀个体所携带的遗传信息，以打破种群的平衡态从而达到更高的平衡态，有利于算法跳出局部最优。就本质而言，多种群算法是一种并行算法，可以提高算法的效率。


    **2. 双种群遗传算法的设计**


    建立两个独立的种群，然后两个种群独立地进行选择、交叉、变异等操作，同时每一代运行结束以后，选择两种群中的随即个体以及最优个体进行交换（见图4-3）。


    ![](EPUB/images/image_062.jpg)


    图4-3 双种群遗传算法流程图


    1）编码/解码设计：编码和解码与基本遗传算法相同。


    2）交叉和变异算子：与基本遗传的操作相同，但双种群遗传算法有两个种群独立地进行选择、交叉、变异等操作，且交叉概率、变异概率不同。


    3）杂交算子：具体来说，设种群*A*和种群*B*，当两种群均完成了选择、交叉和变异操作后，产生一个随机数num，随机选择*A*中num个个体与*A*中最优个体，随机选择*B*中num个个体与*B*中最优个体，交换两者，打破平衡态。“产生随机数num”又一次体现了算法的随机性。


    ### **4.3.3 自适应遗传算法**


    **1. 基本思想**


    自适应遗传算法影响算法和行为的改进关键点在于交叉概率*P*和变异概率*P*，直接影响算法的收敛性。一般情况下，交叉概率越大，新的个体产生的概率就越大，但是交叉概率过大会增加导致遗传模式被破坏的可能性，从而使得具有高适应度的个体结构被快速破坏；然而交叉概率太小又会导致搜索的过程过于缓慢而停滞不前。对于变异概率，当变异概率太小时，种群不易产生新的个体结构，但是当变异概率过大时，会使遗传算法变成纯粹的随机搜索算法。针对不同的问题，我们需要不同的交叉概率和变异概率，这就导致需要反复地去确定*P*和*P*的值，而自适应算法就是使得*P*和*P*能够随适应度自动变化，这样即可保证算法可以跳出局部最优情况，也可以利于优良个体的生存。所以，自适应遗传算法在保持群体多样性的同时，也能保证遗传算法的收敛性。


    cmmccm


    **2. 自适应遗传算法的设计步骤**


    1）编码/解码：自适应遗传算法的编码和解码与基本遗传算法的相同。


    2）选择：用初始种群的选择方法去产生*N*个个体（*N*为偶数），组成初始解集合。


    3）创建函数：定义适应度函数为*f*\=1*/ob*，计算适应度为*f*[i]。


    4）按照轮盘赌的规则去选择*N*个个体，观察种群的最大适应度为*f*，平均适应度为*f*。


