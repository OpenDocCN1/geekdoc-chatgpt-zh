    ### **5.2.5 特征提取和数据降维**


    在数据的预处理阶段，特征提取和数据降维是提升模型表示能力的一种重要手段。


    特征提取主要是从数据中找到有用的特征，用于提升模型的表示能力，而数据降维主要是在不减少模型准确率的情况下减少数据的特征数量。


    从原理上来说，多维变量变为一维是将不同变量按照不同权重转化到一维空间，再将各个变量叠加就组成一个新的一维变量。


    从方法上来说，下面将主要介绍主成分分析、核主成分分析和ISomap流形学习，它们都能实现数据降维。其中，主成分分析和核主成分分析将应用于人脸数据集特征提取，ISomap流形学习将应用在手写数字数据集上。


    主成分分析将*n*维输入数据缩减为*k*维，其中*k*<*n*。但并非简单地从*n*维特征中去除其余*n-k*维特征，而是重新构造出来的*k*维正交特征。简单地说，主成分分析实质上是一个基变换，使得变换后的数据有最大的方差。


    通常可以基于特征值或者奇异值分解协方差矩阵以实现主成分分析算法。用奇异值分解方法举例，假定有*m*×*n*维数据样本***X***，共有*m*个样本，每个样本数据有*n*维，***X***实矩阵可以分解为


    *m*×*nm*×*n*


