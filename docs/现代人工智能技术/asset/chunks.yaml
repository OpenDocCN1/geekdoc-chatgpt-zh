    ## 8.6 模仿强化学习


    强化学习训练智能体的过程十分依赖奖励函数的设置。在很多现实场景中，奖励信号是极其稀疏的，此时对奖励函数的设计需要大量的实验和丰富的经验。但是如果存在一个专家智能体，其策略可以看成最优策略，那么便可以直接模仿这个专家在环境中交互的状态动作数据来训练一个策略而不需要环境反馈的奖励信号，这便是模仿学习研究的问题。本节将主要介绍行为克隆方法、逆向强化学习方法和生成式对抗模仿学习方法。


    ### 8.6.1 行为克隆


    行为克隆就是直接使用监督学习方法，将专家数据（`s`，`a`）中的`s`作为输入，`a`作为标签，学习目标如下所示


    `tttt`


    ![](img/image_511.jpg)


    式中，`B`是专家的数据集；`L`是对应监督学习框架下的损失函数。当`B`中数据量足够大的时候，行为克隆能够很快地学习到一个不错的策略。例如，围棋人工智能
    AlphaGo 就是首先在 16 万盘棋局的 3000 万次落子数据中学习人类选手是如何下棋的，仅仅凭这个行为克隆方法，AlphaGo 的棋力就已经超过了很多业余围棋爱好者。由于行为克隆的实现十分简单，因此在很多实际场景下它都可以作为策略预训练的方法，能够帮助智能体无需在较差时仍然低效地通过和环境交互来探索较好的动作，为接下来的强化学习创造一个高起点。


    相对地，在`B`中数据量较小时行为克隆的局限性明显。具体来说，由于通过行为克隆学习得到的策略只是拿小部分专家数据进行训练，因此行为克隆只能在专家数据的状态分布下预测得比较准。然而，面对贯续决策问题通过行为克隆学习得到的策略在和环境交互过程中不可能完全学成最优，只要存在一点偏差，就有可能导致下一个遇到的状态是在专家数据中没有见过的。在这种情况下，智能体会选择一个随机动作，进一步导致下一个状态更加偏离专家数据集。这被称为行为克隆的复合误差问题，如图
    8-10 所示。


