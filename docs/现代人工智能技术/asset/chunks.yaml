    ## 5.3.4 比较检验


    有了实验评估方法和性能度量，看起来就能对学习器的性能进行评估比较了。先使用某种实验评估方法测得学习器的某个性能度量结果，然后对这些结果进行比较。但怎么来做这个比较呢？是直接取得性能度量的值然后比大小吗？实际上，机器学习中性能比较这件事要比大家想象中的复杂得多。这里面涉及几个重要因素：第一，我们希望比较的是泛化性能，然而通过实验评估方法获得的是测试集上的性能，两者的对比结果可能未必相同；第二，测试集上的性能与测试集本身的选择有很大的关系，且使用不同大小的测试集会得到不同的结果，即便使用相同大小的测试集，若包含的测试样例不同，测试结果也会有不同；第三，很多机器学习算法本身有一定的随机性，即便用相同的参数设置在同一个测试集上多次运行，其结果也会有不同。那么，有没有适当的方法对学习器的性能进行比较呢？


    统计假设检验为我们进行学习器性能比较提供了重要依据。基于统计假设检验结果我们可推断出，若在测试集上观察到学习器`A`比`B`好，则`A`的泛化性能是否在统计意义上优于`B`，以及这个结论的把握有多大。本节我们将介绍两种最基本的假设检验，除此之外，还有
    McNemar 检验、Friedman 检验与 Nemenyi 后续检验等几种常用的机器学习性能比较方法。为便于讨论，本节默认以错误率为性能度量，用`ε`表示。


