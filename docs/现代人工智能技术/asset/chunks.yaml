    ## 7.6 长短期记忆网络


    ### 7.6.1 长短期记忆网络的简介


    长短期记忆网络（Long Short-Term Memory Networks，LSTM）最早由德国科学家 Hochreiter 和 Schmidhuber
    在 1997 年提出。他们的研究论文《Long Short-Term Memory》发表在《Neutral Computations》杂志上。长时间以来，神经网络模型存在着长期信息保存困难和短期输入缺失的问题，解决这一问题的最早方法之一便是长短期记忆网络。


    长短期记忆网络是循环神经网络的一种特殊的类型。它可以在处理序列数据时更好地捕捉长期依赖关系。传统循环神经网络训练经常会出现梯度消失、梯度爆炸，无法解决长期依赖的问题，学习能力有限，在实际任务中往往达不到预期效果。而长短期记忆网络专为解决长期依赖问题而设计出来，可以对有价值的信息进行长期记忆，减小了循环神经网络的学习难度。


    长短期记忆网络最早应用于语音识别领域是在 2014 年，对于处理各种类型的语音数据，如人说话的声音、语音识别任务中的噪声和背景音等，表现优异。除在语音识别领域应用广泛外，随着计算机硬件性能的提升和深度学习的兴起，长短期记忆网络在近年来还被广泛地应用于自然语言处理领域，例如文本分类、情感分析和机器翻译等任务；图像处理领域，例如图像分类、图像生成和图像分割等。


