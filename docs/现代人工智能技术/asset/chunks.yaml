    ## 6.3 BP 神经网络


    在神经网络的发展中，`BP`神经网络是一个重要的转折点，同时`BP`神经网络对后续神经网络的学习也是一个基础，所以本节将详细地介绍`BP`神经网络和一些改进方法，为后续神经网络的学习和优化奠定基础。


    ### 6.3.1 标准 BP 神经网络算法和流程


    `BP`神经网络是多层前向网络，也可以称为后向传播学习的前馈型神经网络，可以把其视作多层神经元网络的堆叠。`BP`神经网络具有多层，除了第一层称之为输入层，最后一层称之为输出层，中间的层都叫作隐藏层。`BP`神经网络结构图如图
    6-10 所示。


    ![](img/image_254.jpg)


    图 6-10 BP 神经网络结构图


    `BP`神经网络的网络结构是前馈型神经网络，在使用阶段直接输入，`BP`神经网络根据训练好的结果最终得到输出结果。`BP`神经网络的关键部分在训练阶段，也主要是通过反向传播的方式来更新参数，这就是`BP`神经网络命名的来历。`BP`反向算法在训练过程中，先进行一次前向的传播过程，再进行反向传播过程更新每一层参数，当满足迭代条件时停止。`BP`神经网络算法流程图如图
    6-11 所示。


    根据上文提到的`BP`神经网络更新策略，在实际的操作中，每一步操作都有一定的技巧性。具体如图 6-11 所示共有五步。


    步骤一：需要对`BP`神经网络权值和神经元的阈值进行初始化，在这里首先要考虑的是每一层参数权重值`w[ij]`，如果没有先验知识（也就是没有其他信息）的情况下，一般设置为均值为
    0 的均匀分布，其范围被定为［-1，1］或者［-0.5，0.5］。


    步骤二：样本每输入网络一次称为一个回合，每一个回合中都要对样本进行随机排序，这样做的目的是可以有效地使用样本特性。


    步骤三：从输入层沿着网络到输出层，每一个回合都会得到一个局部诱导域和函数输出值（这里需要相关的公式）。


    步骤四：从后向前，计算每一层神经元的局域梯度（这里也有相关的公式）。


    步骤五：更新每一层的参数。


    最后根据是否满足误差要求或者已经达到迭代要求停止继续更新参数。


    对于一个前馈型的神经网络，很重要的一点是能够完成权值参数的更新，这也是`BP`神经网络的精髓所在。


    `BP`神经网络的优点是显著的，其非线性映射能力、泛化能力和容错能力都是很不错的。它能学习和存储大量的输入-输出模式映射关系，无需存在描述这种映射关系的数学方程，这样的话可以避免复杂的数学计算，而是通过输入-输出模式映射的关系得到所需要的函数表达式。


    多层前馈网络训练将从样本中学习到的非线性映射关系存储在权值矩阵中。在其后的工作阶段，当向网络输入训练时未曾见过的非样本数据时，网络也能完成由输入空间向输出空间的正确映射。这也就是所谓的泛化能力，根据训练好的模型可以得到未训练样本的数据的结果，这也是深度学习的基础。


    另外，`BP`神经网络允许输入样本中带有较大的误差甚至个别错误。


    ### 6.3.2 标准 BP 神经网络分析和改进


    #### 1. BP 神经网络算法的局限性分析


    `BP`神经网络的误差曲面通常存在多个极小点，而且绝大部分都是非全局极小点，在训练的时候容易陷入局部最优的问题。局部最优问题是神经网络问题中典型的一类优化问题，原因是多种的，一般来说就是由于存在多个极小点，在梯度优化算法中，当优化到这些点的时候，算法就会停止，导致整个算法收敛到某个极小点。


    ![](img/image_255.jpg)


    图 6-11 BP 神经网络算法流程图


    `BP`神经网络的误差曲面有些区域比较平坦，也就是说当神经网络训练到这些误差曲面时，使用梯度优化算法会增加训练时间，而且训练效果也会变差。在上一节中提到的激活函数，当误差曲面变得平坦的时候，其会进入它的饱和区，梯度就会接近于
    0，其最终的结果就会导致网络参数更新变慢，增加训练时间。


    #### 2. BP 神经网络算法的改进方法


    针对上述两个问题，学者们提出了多种缓解和解决方法。


    关于`BP`神经网络在训练过程中容易陷入局部最优问题，随着深度学习理论的发展，学者们提出了新的优化算法策略，如`Adagrad`算法。


    ![](img/image_256.jpg)![](img/image_257.jpg)![](img/image_258.jpg)


    表示的是每一个元素的二次方，测试的机器学习良好问题的良好默认设置为`α`=0.001，`β`=0.9，`β`=0.999，`ε`=10^(-8)，对向量的所有操作多是逐元素的。用和表示在`t`时刻的`β`和`β`。


    `Adam`算法


    ![](img/image_260.jpg)


    同时考虑到收敛到某一个极小点和网络参数初始化息息相关，所以在实践中往往多次随机初始化网络参数，利用不同的初始化参数去找到训练的最佳初始化参数部分。


    为了解决网络误差曲面进入平坦区之后导致训练速度减慢的问题，有学者提出采用引入陡度因子的方式，思路是在误差曲面进入平坦区之后，压缩神经元的净输入，使得输出退出激活函数的饱和区，从而使得梯度下降法可以有效实现，最终脱离平坦区。在标准`BP`神经网络中引入的激活函数是`Sigmoid`函数，所以本改进方法是在`Sigmoid`函数的基础上引入陡度因子`λ`，使得其激活函数为


    ![](img/image_261.jpg)


    这样的话，当输出层误差接近于 0 的时候，就可以令`λ`>1，这样的结果就可以提高`BP`神经网络算法的收敛速度。另一种在激活函数上做处理的方法是改变`Sigmoid`函数为`Relu`函数。


    另一种让算法迅速逃离平坦区的方法是增加动量项。标准`BP`神经网络算法的权值调节公式为


    ![](img/image_262.jpg)


    可以看出，权值更新的快慢和超参数`η`有着十分密切的关系，当`η`很小的时候，权值更新速度会变慢，学习次数会为此增加；当`η`很大的时候，会导致神经网络振荡，这样的话也会导致学习的迭代次数增加。而带有动量项的加权调节公式可以对`BP`神经网络带来一些比较好的改善效果。带有动量项的加权调节公式为


    ![](img/image_263.jpg)


    一般来说，`α`称为动量系数，一般取 0.9 左右。动量项控制权值更新快慢具有明显效果，当权值处于波动区域的时候，由于公式最右项的存在，可以使得权值更新没有那么剧烈，起到了缓冲平滑权值的作用。当权值处于相对平缓区域的时候，误差变化很小，可以得到


    ![](img/image_264.jpg)


    这样得到的结果就是`Δw(t)`变化特别快，将使得权值参数尽快地远离饱和区和截止区。


    还有一种方式是增加自适应式学习参数：对于`BP`神经网学习算法来说，不同的学习参数会导致不同的结果，所以在实现的时候需要增加自适应式学习参数。


    ## 6.4 卷积神经网络


    `Yann LeCun`提出了`LeNet`


    `LeNet`虽然在识别效果上不如现在的各种各样的网络，但是其中所蕴含的思想是显著的，同时也是学习深度卷积神经网络的基础。本节将着重分析卷积神经网络的实现思路以及具体的实验思路。


    ### 6.4.1 卷积的基本知识


    卷积神经网络所涉及的数学运算是卷积运算。关于卷积运算有离散卷积和连续卷积两种运算方式。连续卷积的定义式如下，假设有两个连续函数`x(t)`和`x(t)`，假设它们的卷积结果是`y(t)`，那么可以用公式表达为


