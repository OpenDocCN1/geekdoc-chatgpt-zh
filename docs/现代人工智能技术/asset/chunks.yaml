    线性模型形式简单，当`ω`和`b`确定下来后，模型就可以确定下来。其具有很好的可解释性，`ω[i]`越大，`x[i]`越重要。另外，许多功能强大的非线性模型也是以线性模型为基础映射而得的。


    #### 2. 线性回归模型

    给定由`m`条数据组成的数据集 `D = {(x, y), (x, y), …, (x[m], y[m])}`，其中`x = (x[i], x[i], …,
    x[id])`具有`d`个属性。通过一个线性回归的算法学得一个线性模型，使其预测值尽可能地接近真实值，即


    ![](img/image_154.jpg)


    即


    ![](img/image_155.jpg)


    取得`ω`和`b`，使`f(x)`最接近`y[i]`。因此如何衡量接近是关键。最常用的是均方误差最小化，称为最小二乘法，即


    ![](img/image_156.jpg)![](img/image_157.jpg)


    也被称为损失函数，也就是衡量测试集到模型之前的损失大小的函数。


    #### 3. 梯度下降法

    均方误差使用了常用的欧氏距离，就是试图找到一条直线，使得所有样本到该直线的欧式距离之和最小。求解`w`和`b`的过程称为参数估计，最常用的是使用梯度下降法。


    梯度下降法是机器学习中一种常用到的算法，但其本身不是机器学习算法，而是一种求解的最优化算法。主要解决求最小值问题，其基本思想在于不断地逼近最优点，每一步的优化方向就是梯度的方向。利用梯度的反向传播，反复更新模型参数直至收敛，从而达到优化模型的目的。


    接下来先来看损失函数只有`w`和`b`两个参数时的情况。其所在的平面像一个山谷，梯度下降法就是从一点开始，寻找每个向下走的方向，然后一步一步地沿着下坡的方向一直走到谷底。每走一步，则更新一次`w`和`b`。


    ![](img/image_158.jpg)


    式中，`α`称为学习率，学习率是使用损失函数的梯度调整网络权重的超参数。可以形象地理解为每走一步的长度的参数，一般在 0.1～0.01。每一步的长度为学习率乘以当前该方向上的梯度。


    梯度越大，也就是坡度越大时，一般是离最优点很远的时候，步长越大；梯度很小的时候，也就是坡度很缓的时候，一般情况下就是接近最优点的时候，步长越小。


    如果学习率过大，可能会使损失函数直接越过全局最优点，此时表现为 loss 值过大。


    如果学习率过小，损失函数的变化速度很慢，会大大增加网络的收敛复杂度，并且很容易被困在局部最小值或者鞍点。学习率过大和过小示意图如图 5-17 所示。


    ![](img/image_159.jpg)

    图 5-17 学习率过大和过小示意图

    a）学习率过小 b）学习率过大


    以上只是从理论上来说明学习率对 loss 值的影响。在实际表现中，不同的初始化学习率导致的不同的 loss 值如图 5-18 所示。


    一般情况下从大到小尝试学习率，避免错过谷底。在不同的学习率下，达到最优解时，损失函数值越小，此学习率越好。也可以用机器求，该算法不在此详细介绍。


    常见的梯度下降法包括随机梯度下降法、批梯度下降法、Momentum 梯度下降法、Nest erov Momentum 梯度下降法、AdaGrad 梯度下降法、RMSprop
    梯度下降法、Adam 梯度下降法等。


