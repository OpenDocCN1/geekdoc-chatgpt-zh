    ## 4.2.7 选择

    从群体中选择优胜的个体，淘汰劣质的个体的操作叫作选择，选择也称为复制操作。选择算子又可以称为再生算子，选择的目的是把优化的个体（或解）直接遗传给下一代或通过交叉配对后产生新的个体再遗传给下一代。选择操作是建立在群体中个体适应度评估的基础上的，因此适应度越高则被选择的可能性就越大。


    需要注意的是：如果总是选择最优个体，就称为确定性优化方法，遗传算法会使种群过快收敛到局部最优解。如果仅仅作为随机选择，遗传算法就变成了完全随机的方法，需要很长时间才能收敛，甚至不收敛。因此，选择方法的关键是找到一种策略，既要使种群迅速收敛，又要保持种群的多样性。


    目前常用的选择算子有以下几种：轮盘赌、锦标赛、截断选择、蒙特卡洛选择、概率选择、线性排序、指数排序、玻尔兹曼、随机遍历、精英选择等，接下来做详细介绍。


    ### 1. 个体选择概率分配

    #### （1）蒙特卡洛法

    蒙特卡洛法也称为适应度比例法，是目前遗传算法过程中最常用也是最基础的方法。蒙特卡洛法选择个体的概率与该个体的适应度成比例，设种群规模的大小为`M`，个体`n`的适应度的值为`F[n]`，则个体被选择的概率为


    ![](img/image_038.jpg)


    #### （2）排序方法

    排序方法是计算每个个体的适应度后，根据适应度大小顺序对种群中的个体进行排序，然后把事先设计好的概率分配给个体，作为各自的选择概率。被选择的概率往往取决于个体在种群中的序位，而不是实际的适应度的值。


    它的优点是克服了适应度比例选择策略的过早收敛和停滞现象，还可以针对最大或最小的问题，不需要对自适应度值做标准化和调节，可以直接使用原有的适应度排序选择。排序法比比例法具有更好的鲁棒性，是较好的选择方法。


    ##### 1）线性排序。

    当适应度值差别很大时，轮盘赌选择将会出现问题。如果最优染色体的适应度值占适应度值总和的 90%，即其占据了轮盘上 90%的周长，那么其他染色体被选择的概率就很低。在线性排序选择中，首先按照适应度值对个体进行排序，最劣个体排在第
    1 位，最优个体排在第`N`位，根据排位先后，线性地分派给染色体`i`的选择概率`P(i)`为


    ![](img/image_039.jpg)![](img/image_040.jpg)![](img/image_041.jpg)


    是最劣染色体的选择概率，是最优染色体的选择概率。值得注意的是，所有的个体得到不同的排名，分别得到不同的选择概率，即使它们拥有相同的适应度值。


    ##### 2）非线性排序。

    非线性排序的一种方案就是使用指数函数为排序后的个体分配生存概率：


    ![](img/image_042.jpg)


    其中，`c`必须位于区间［0，1）内，`c`越小则最优个体被选择的概率越大，如果`c`=0，则最优个体被选择的概率为 1 而其他个体被选择的概率为 0，`c`越接近
    1，个体间的选择概率就越接近。注意：在计算概率前，需要按照适应度的值对种群进行降序排序。


    ### 2. 选择个体的方法

    选择操作是根据个体被选择的概率来确定在种群当中哪些个体将会被选择进行交叉、变异等操作，基本的选择方法如下：


    #### （1）轮盘赌选择

    轮盘赌选择法是依据个体的适应度值计算每个个体在子代中出现的概率，并按照此概率随机选择个体构成子代种群，因此该方法也被称为适应度比例法。轮盘赌选择策略的出发点是适应度值越好的个体被选择的概率越大。因此，在求解最大化问题的时候，我们可以直接采用适应度值来进行选择。但是在求解最小化问题的时候，我们必须首先将问题的适应度函数进行转换（如采用倒数或相反数），以将问题转化为最大化问题。


