    ### 5.3.5 偏差与方差

    对学习算法除了通过实验估计其泛化性能，人们往往还希望了解它为什么具有这样的性能。偏差-方差分解是解释学习算法泛化性能的一种重要工具。


    偏差-方差分解试图对学习算法的期望泛化错误率进行拆解。我们知道，算法在不同训练集上学得的结果很可能不同，即便这些训练集是来自同一个分布。对测试样本`x`，令`y`为`x`在数据集中的标记，`y`为`x`的真实标记，`f(x;D)`为训练集`D`上学得模型`f`在`x`上的预测输出。以回归任务为例，学习算法的期望预测为


    ![](img/image_145.jpg)


    使用样本数相同的不同训练集产生的方差为


    ![](img/image_146.jpg)


    噪声为


    ![](img/image_147.jpg)


    期望输出与真实标记的差别称为偏差，即


    ![](img/image_148.jpg)


    为便于讨论，假定噪声期望为零，即`E[y-y]=0`。通过简单的多项式展开合并，可对算法的期望泛化误差进行分解：


    `E(f;D)=E[(f(x;D)-y)²]`


    可得


    ![](img/image_149.jpg)


    于是


    ![](img/image_150.jpg)


    也就是说，泛化误差可分解为偏差、方差与噪声之和。


    回顾偏差、方差、噪声的含义：式（5-38）度量了学习算法的期望预测与真实结果的偏离程度，即刻画了学习算法本身的拟合能力；式（5-36）度量了同样大小的训练集的变动所导致的学习性能的变化，即刻画了数据扰动所造成的影响；式（5-37）则表达了在当前任务上任何学习算法所能达到的期望泛化误差的下界，即刻画了学习问题本身的难度。偏差-方差分解说明，泛化性能是由学习算法的能力、数据的充分性以及学习任务本身的难度所共同决定的。给定学习任务，为了取得好的泛化性能，则需使偏差较小，即能够充分拟合数据，并且使方差较小，即使得数据扰动产生的影响小。


    一般来说，偏差与方差是有冲突的，这称为偏差-方差窘境。图 5-16 所示为偏差、方差与泛化错误率的关系。给定学习任务，假定我们能控制学习算法的训练程度，则在训练不足时，学习器的拟合能力不够强，训练数据的扰动不足以使学习器产生显著变化，此时偏差主导了泛化错误率；随着训练程度的加深，学习器的拟合能力逐渐增强，训练数据发生的扰动渐渐能被学习器学到，方差逐渐主导了泛化错误率；在训练程度充足后，学习器的拟合能力已非常强，训练数据发生的轻微扰动都会导致学习器发生显著变化，若训练数据自身的、非全局的特性被学习器学到了，则将发生过拟合。


    ![](img/image_151.jpg)

