    # 第 6 章


    ## 神经网络


    本章从基础的神经元和神经网络开始介绍，然后详细讨论了线性神经网络、全连接神经网络、BP 神经网络、卷积神经网络和循环神经网络，最后简单介绍了生成对抗神经网络。


    ## 6.1 神经元和神经网络


    ### 6.1.1 生物神经元和人工神经元


    1. 生物神经元简介


    现代人的大脑中约有 10¹¹个神经元，每个神经元和其他神经元之间约有 1000 个连接，大脑中约有 10¹⁴个连接。生物神经元由包含核和大多数细胞复杂成分的细胞体组成，其中许多分支延伸称为树突，再加上一个很长的延伸称为轴突。轴突的长度可能比细胞体长几倍到几万倍。轴突在其末端附近分裂成许多分支，称为端粒，在这些分支的顶端是称为突触末端（或简称为突触）的微小结构，与其他神经元的树突或细胞体相连。


    生物神经元产生短的电脉冲称为动作电位，它们沿着轴突传播，使突触释放称为神经递质的化学信号。下一级的神经元在几毫秒中接收到足够数量的神经递质，并根据递质的种类来决定自己激发的电脉冲（既可能是兴奋也可能是抑制），单个生物神经元的机理和实现看似很简单，但是当神经元的数量级达到数十亿级时，生物神经元所取得的效果就很显著了。高度复杂的计算可以通过相当简单的神经元来执行，代价只是神经递质的种类以及剂量，而调节这一过程是网络本身。


    2. 人工神经元简介


    1943 年，美国神经和解剖学家 McCulloch 和数学家 Pitts 提出了人工神经元模型（M-P 模型）。从那个时候开始各种神经模型就被提出，本章将介绍一种标准型的数学模型，即感知机模型，主要包含三个部分，分别是加权求和、线性动态系统和激活函数（非线性函数）部分。神经元模型本质上是数学函数模型，为了可以逼近所有类型的数值，必须引入激活函数部分，同时考虑到以
    BP 神经网络为代表的梯度更新参数的方式，为了防止梯度爆炸，也需使用到激活函数部分，具体分析请看 BP 神经网络部分的介绍。


    3. 神经元结构和数学模型


