    ##### (1) 不经意传输


    不经意传输协议是一个两方安全计算协议，协议使得接收方除选取的内容外，无法获取剩余数据，并且发送方也无从知道被选取的内容。具体来说，发送方拥有一个“消息-索引”对（`M`，1），（`M`，2），…，（`M[N]`，`N`），每次传输的时候接收方选择一个索引`i`，`i`∈［1，`N`］并接收`M[i]`。接收方不能得知发送方的任何其他信息，发送方也不能了解接收方选择了哪个消息。


