    式中，`ω`是惯性权重因子；`q`，`q`是加速度常数，均为非负值；`rand(0,a)`和`rand(0,a)`为［0，`a`］、［0，`a`］范围内的具有均匀分布的随机数；`a`与`a`为相应的控制参数。


    上面第一个式子右边的第一部分是粒子在前一时刻的速度，由惯性权重和粒子自身速度构成，表示粒子对先前自身运动状态的信任；第二部分为个体认知分量，表示粒子本身的思考及粒子自己经验的部分，可理解为粒子当前与自身历史最优位置之间的距离和方向；第三部分为群体社会分量，表示粒子之间的信息共享与合作，即来源于群体中其他优秀粒子的经验，可理解为粒子当前位置与群体历史最优位置之间的距离和方向。`q`和`q`分别控制个体认知分量和群体社会分量相对贡献的学习率。引入`rand(0,a)`和`rand(0,a)`将增加认知以及社会搜索方向的随机性和算法多样性。


    基于学习率`q`和`q`，Kennedy给出以下四种类型的PSO模型：


    1）若`q>0`，`q>0`，则称该算法为PSO全模型。


    2）若`q>0`，`q=0`，则称该算法为PSO认知模型。


    3）若`q=0`，`q>0`，则称该算法为PSO社会模型。


    4）若`q=0`，`q>0`，且`g≠i`，则称该算法为PSO无私模型。


    标准的粒子群优化算法分为两个版本：全局版和局部版。上面介绍的是全局版粒子群优化算法。局部版与全局版的差别在于，用局部领域内最优邻居的状态代替整个群体的最优状态。全局版的收敛速度比较快，但容易陷入局部极值点，而局部版搜索到的解可能更优，但速度较慢。


    算法的流程如下：


    1）初始化：初始化粒子群（粒子群共有`n`个粒子）：给每个粒子赋予随机的初始位置和速度。


    2）计算适应度值：根据适应度函数，计算每个粒子的适应度值。


    3）求个体最佳适应度值：对每个粒子，将其当前位置的适应度值与其历史最佳位置（`p`）对应的适应度值进行比较，如果当前位置的适应度值更高，则用当前位置更新历史最佳位置。


    4）求群体最佳适应度值：对每个粒子，将其当前位置的适应度值与全局最佳位置（`p`）对应的适应度值进行比较，如果当前位置的适应度值更高，则用当前更新全局最佳位置。


    5）更新粒子位置和速度：根据公式更新每个粒子的位置和速度。


    6）判断算法是否结束：若未满足结束条件，则返回步骤2），若满足结束条件则算法结束，全局最佳位置（`p`）即全局最优解。


    ### 4.4.2 粒子群优化算法的参数分析


    #### 1. PSO算法的参数


    PSO算法的参数包括：群体规模`m`，惯性权重`ω`，加速度`q`、`q`，最大速度`V`，最大代数`G`。


    （1）最大速度`V`


    算法中有最大速度`V`作为限制，如果当前粒子的某维速度大于最大速度`V`，则该维的速度就被限制为最大速度`V`。


    最大速度`V`决定当前位置与最好位置之间的区域的分辨率（或精度）。如果`V`太高，粒子可能会飞过好的解；如果`V`太小，粒子容易陷入局部优值。


    （2）权重因子


    在PSO算法中有三个权重因子：惯性权重`ω`，加速度常数`q`、`q`。


    惯性权重`ω`使粒子保持运动惯性，使其具有扩展搜索空间的趋势，并有能力搜索新的区域。


    加速度常数`q`和`q`代表将每个粒子推向`P^i`和`P^g`位置的统计加速度项的权重。低的值允许粒子在被拉回之前可以在目标区域外徘徊，而高的值则导致粒子突然冲向或者越过目标区域。


    #### 2. 位置更新方程中的各部分的影响


    对于速度更新公式，如果只有第一部分，而没有后两部分，即`q=q=0`，则粒子将一直以当前的速度飞行，直到到达边界。由于它只能搜索有限的区域，所以很难找到好的解。


    假设没有第一部分，即`ω=0`，则速度只取决于粒子当前位置和其历史最好的位置`p^i`和`p^g`，速度本身没有记忆性。假设一个粒子位于全局的最好位置，它将保持静止。而其他粒子则飞向它本身最好的位置`p^i`和最好的全局位置`p^g`的加权中心。在这种条件下，粒子群将收敛到当前全局最好的位置，所以更像是一种局部算法。但是在加上了第一部分之后，粒子有了扩展搜索空间的趋势的能力，从而可以使粒子实现全局搜索。因此`ω`的作用就是针对不同的搜索问题，调整算法的全局和局部搜索能力之间的平衡。


    假设没有第二部分，即认知部分，`q=0`，则粒子没有认知能力，也就是说粒子只具备社会模型。在粒子的相互作用下，有能力达到新的搜索空间。这时的粒子收敛速度要比标准模型下的更快，但是面对复杂的搜索问题容易陷入局部最优解。


    假设没有第三部分，即`q=0`，则粒子间没有社会共享信息，只具备一个认知模型。因为缺少了社会模型，个体不具备交互能力，一个规模为`N`的群体等价于`N`个单个粒子的运行，因而得到最优解的概率非常小。


    #### 3. 参数设置


    早期实验将`ω`定为1.0，将`q`和`q`定为2.0，因此`V`为唯一需要调节的参数，通常的变化范围为10%～20%。实验表明，只要`q`和`q`为常数时函数便可以得到较好的解，但是不一定值必须为2。低的值使粒子在目标区域外徘徊，而高的值会导致粒子越过目标区域。典型的取值除了2.0，还可以取`q=1.6`和`q=1.8`，`q=1.6`和`q=2.0`，针对不同的问题有不同的取值，一般通过区间内试凑来调整这两个值。


    这些参数也可以通过模糊系统进行调节。Shi和Eberthart提出了一个模糊系统来调节`ω`，该系统有两个输入和一个输出。一个输入为当前全局最优的适应值，一个输入为当前的`ω`；输入为`ω`的变化。每个输入和输出定义了三个模糊集，结果显示该方法可以显著提高平均适应值。


    粒子的适应度函数需要根据具体的问题而定，将目标函数转换成适应度函数的方法与遗传算法类似。


    在基本的粒子群优化算法中，粒子的编码使用实数编码的方法。这种编码方法在求解连续的函数优化问题时十分方便，同时对粒子的速度求解与粒子的位置更新也很自然。


    ## 4.5 蚁群算法


    蚁群算法（Ant Clony Optimization，ACO）是一种群智能算法，它是由一群无智能或有轻微智能的个体通过相互协作而表现出智能行为，从而为求解复杂问题提供了新的可能性。蚁群算法最早是由意大利Colorni
    A，Dorigo M. 等人于1991年提出的


    蚁群算法是一种仿生学算法，受到自然界中蚂蚁觅食的行为的启发。研究发现，蚂蚁在觅食的时候总会存在信息素跟踪和信息素遗留两种行为，即一方面蚂蚁会按照一定的概率沿着信息素较强的路线去觅食，另一方面，蚂蚁会在走过的路上释放信息素，使得一定范围内的其他蚂蚁能够察觉到并由此影响它们的行为。当一条路上的信息素越来越多时，后来的蚂蚁选择这条路径的可能性也会越来越大，从而进一步加强该路上的信息素强度，因此其他路径上的蚂蚁反而越来越少，信息素也会越来越弱。这种选择的过程其实是蚂蚁催化过程，其原理是一种正反馈机制，因此蚂蚁系统也被称为增强型学习系统。

