    ### **9.4.3 联邦平均算法**


    联邦学习中隐含的优化问题被称为联邦优化，同典型的分布式优化相比，联邦优化有如下几个关键性质：


    1）非独立同分布：对于联邦学习的参与者来说，不同参与者拥有的数据分布可能完全不同，对数据集进行独立同分布的假设是不合理的。任何一个参与者所有的局部数据都不能代表总体数据的分布。


    2）不平衡性：在联邦学习的实际应用场景中，不同的参与者所拥有的数据集的规模也是不一样的。这就导致了在联邦学习过程里，不同的参与者训练本地模型所使用的数据集规模是不平衡的。


    3）广泛分布：一般而言，需要使用大量的数据进行训练才能得到一个符合预期的机器学习模型。而对于联邦学习来说，这就意味着很可能需要有许多参与者加入其中进行训练，特别是使用移动设备数据进行的联邦学习任务。因此，联邦学习的实际应用场景有着参与者数量多、分散程度大、广泛分布的特点。


    4）通信限制：在联邦学习的实际应用场景中，参与者与参与者、参与者与服务器之间的通信往往只能依赖不那么可靠的无线网络，特别是在使用移动设备数据进行的联邦学习任务中，往往还面临着设备经常离线、连接速度慢、通信成本高等挑战。


    为了应对联邦优化中的种种挑战，Google在2017年发表的论文《Communication-Efficient Learning of Deep Networks from Decentralized Data》
