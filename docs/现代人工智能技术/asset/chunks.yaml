    ## 9.7 小结


    本章首先介绍了联邦学习的基本概念，包括联邦学习的提出背景、定义、分类等。随着人工智能和大数据的不断发展，不断加剧的“数据孤岛”现象和人们对于自己隐私数据安全的担忧，促使相关研究工作者必须在兼顾到算法性能提升的同时，还要对隐私、安全等进行严格要求。联邦学习是一种分布式机器学习方法，它允许多个参与者在保留各自数据隐私的同时，协同训练一个共享的模型。研究应用联邦学习技术是解决上述挑战的一个可行途径。根据联邦学习参与者所有数据的样本、标签等特征，可以将联邦学习分为横向联邦学习、纵向联邦学习和联邦迁移学习。


    其次，本章详细介绍了联邦学习中的隐私保护技术。联邦学习同样面临着隐私泄露的风险，因此，隐私保护技术的使用是不可或缺的，也是联邦学习保护隐私的关键手段之一。本章具体介绍了差分隐私和多方安全计算两类方法，给出了定义以及简单的实现示例。


    再次，本章讨论了联邦学习中的激励机制。对于联邦学习的参与者来说，进行联邦学习任务往往意味着带来了额外的开销负担。为了引导参与者积极进行联邦学习任务，需要引入激励机制，对参与者进行激励引导。本章具体介绍了基于数据质量、模型参数、沙普利值的三种评估方案，给出了简单的评估示例。


    最后，本章分别介绍了横向联邦学习和纵向联邦学习的定义、架构以及典型算法。横向联邦学习适用于参与者之间数据特征相同但样本不同的情况，纵向联邦学习适用于参与者之间数据样本相同但特征不同的情况。本章还分别介绍了适用于横向联邦学习的联邦评价（`FedAvg`）算法和适用于纵向联邦学习的`FedBCD`算法。然后，本章介绍了联邦迁移学习的定义、分类以及典型框架。联邦迁移学习是指利用不同域的数据进行联邦学习的过程，它可以有效解决数据分布不一致的问题。


