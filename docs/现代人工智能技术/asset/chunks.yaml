    ## 6.4 卷积神经网络


    `Yann LeCun`提出了`LeNet`


    `LeNet`虽然在识别效果上不如现在的各种各样的网络，但是其中所蕴含的思想是显著的，同时也是学习深度卷积神经网络的基础。本节将着重分析卷积神经网络的实现思路以及具体的实验思路。


    ### 6.4.1 卷积的基本知识


    卷积神经网络所涉及的数学运算是卷积运算。关于卷积运算有离散卷积和连续卷积两种运算方式。连续卷积的定义式如下，假设有两个连续函数`x(t)`和`x(t)`，假设它们的卷积结果是`y(t)`，那么可以用公式表达为


