    可以发现，全连接神经网络实质上还是一个单层神经网络，所以必须在隐藏层引入激活函数，这样才可以真正实现多层感知机。多层感知机在各种神经网络或者深度学习模型中起到了很重要的作用。最早的深度学习模型AlexNet在最终输出结果时就使用到了全连接神经网络。全连接神经网络实现二值分类如图6-9所示。


