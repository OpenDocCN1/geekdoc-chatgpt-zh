    ## 2. 谓词逻辑中的归结原理


    在谓词逻辑中，由于子句中含有变元，所以不能像命题逻辑那样直接消去互补文字，而需要先用最一般合一对变元进行代换，然后才能进行归结。


    例如，设有如下两个子句

    `C`= `P`（`x`）∨`Q`（`x`）

    `C`=﹁`P`（`a`）∨`R`（`y`）


    由于`P`（`x`）与`P`（`a`）不同，所以`C`与`C`不能直接进行归结，但若用最一般合一

    `σ`={ `a/x` }

    对两个子句分别进行代换

    `C σ`= `P`（`a`）∨`Q`（`a`）

    `C σ`=﹁`P`（`a`）∨`R`（`y`）

    就可对它们进行直接归结，消去`P`（`a`）与﹁`P`（`a`），得到如下归结式

    `Q`（`a`）∨`R`（`y`）


    下面给出谓词逻辑中关于归结的定义。


    ### 定义 3.2

    设`C`与`C`是两个没有相同变元的子句，`L`和`L`分别是`C`和`C`中的文字，若`σ`是`L`和﹁`L`的最一般合一，则称

    `C`=（`Cσ` - {`Lσ`}）∨（`Cσ` - {`Lσ`}）

    为`C`和`C`的二元归结式。


    ### 例 3.6

    设`C`= `P`（`a`）∨﹁`Q`（`x`）∨`R`（`x`），`C`=﹁`P`（`y`）∨`Q`（`b`），求其二元归结式。


    **解**：若选`L`= `P`（`a`），`L`=﹁`P`（`y`），则`σ`={ `a/y` }是`L`与﹁`L`的最一般合一。因此，

    `C σ`= `P`（`a`）∨﹁`Q`（`x`）∨`R`（`x`)

    `C σ`=﹁`P`（`a`）∨`Q`（`b`）

    根据定义可得

    `C`=（`Cσ` - {`Lσ`}）∨（`Cσ` - {`Lσ`}）

    =（{`P`（`a`），﹁`Q`（`x`），`R`（`x`）}-{`P`（`a`）}）∨（{﹁`P`（`a`），`Q`（`b`）}-{﹁`P`（`a`）}）

    =（{﹁`Q`（`x`），`R`（`x`）}）∨（{`Q`（`b`）}）

    ={﹁`Q`（`x`），`R`（`x`），`Q`（`b`）}

    =﹁`Q`（`x`）∨`R`（`x`）∨`Q`（`b`）

    若选`L`=﹁`Q`（`x`），`L`=`Q`（`b`），`σ`={ `b/x` }，则可得

    `C`=（{`P`（`a`），﹁`Q`（`x`），`R`（`b`）}-{﹁`Q`（`b`）}）∨（{﹁`P`（`y`），`Q`（`b`）}-{`Q`（`b`）}）

    =（{`P`（`a`），`R`（`b`）}）∨（{﹁`P`（`y`）}）

    ={`P`（`a`），`R`（`b`），﹁`P`（`y`）}

    =`P`（`a`）∨`R`（`b`）∨﹁`P`（`y`）


    ### 例 3.7

    设`C`= `P`（`x`）∨`Q`（`a`），`C`=﹁`P`（`b`）∨`R`（`x`），求其二元归结式。


    **解**：由于`C`与`C`有相同的变元，不符合定义的要求。为了进行归结，需修改`C`中的变元的名字，令`C`=﹁`P`（`b`）∨`R`（`y`）。此时，`L`=
    `P`（`x`），`L`=﹁`P`（`b`）。

    `L`与﹁`L`的最一般合一`σ`={ `b/x` }，则

    `C`=（{`P`（`b`），`Q`（`a`）}-{`P`（`b`）}）∨（{﹁`P`（`b`），`R`（`y`）}-{`P`（`b`）}）

    ={ `Q`（`a`），`R`（`y`）}

    =`Q`（`a`）∨`R`（`y`）


    如果在参加归结的子句内部含有可合一的文字，则在归结之前应对这些文字先进行合一。


    ### 例 3.8

    设有如下两个子句`C`= `P`（`x`）∨`P`（`f`（`a`））∨`Q`（`x`），`C`=﹁`P`（`y`）∨`R`（`b`），求其二元归结式。


    **解**：在`C`中有可合一的文字`P`（`x`）与`P`（`f`（`a`）），若用它们的最一般合一`θ`={ `f`（`a`）/ `x` }进行代换，得到`Cθ`=
    `P`（`f`（`a`））∨`Q`（`f`（`a`））。此时可对`Cθ`和`C`进行归结，从而得到`C`与`C`的二元归结式。

    对`Cθ`和`C`分别选`L`= `P`（`f`（`a`）），`L`=﹁`P`（`y`）。`L`和﹁`L`的最一般合一是`σ`={ `f`（`a`）/ `y`
    }，则`C`= `R`（`b`）∨`Q`（`f`（`a`））。

    在上例中，把`Cθ`称为`C`的因子。一般来说，若子句`C`中有两个或两个以上的文字具有最一般合一`σ`，则称`Cσ`为子句`C`的因子。如果`Cσ`是一个单文字，则称它为`C`的单元因子。


    ### 定义 3.3

    子句`C`和`C`的归结式是下列二元归结式之一：

    1）`C`与`C`的二元归结式。

    2）`C`的因子`Cσ`与`C`的二元归结式。

    3）`C`与`C`的因子`Cσ`的二元归结式。

    4）`C`的因子`Cσ`与`C`的因子`Cσ`的二元归结式。


    与命题逻辑中的归结原理相同，谓词逻辑的归结式也是由它的亲本子句推导出来的。如果用归结式替换子句集`S`中的亲本子句，那么新的子句集和原来的子句集一样，都是不可满足的。


    对于一阶谓词逻辑，归结原理还具有完备性，也就是说，如果一个子句集不可满足，那么一定能从它推导出空子句；反过来，如果能从一个子句集推导出空子句，那么这个子句集也不可满足。归结原理的完备性可以用海伯伦的理论来证明，这里不再详述。


    需要指出的是，如果没有推导出空子句，不能断定`S`是不是可满足的。

    因为有两种可能：一种是`S`确实是可满足的，所以推导不出空子句；另一种是`S`不可满足，但没有找到正确的推导步骤。但是，如果确定不存在任何方法能推导出空子句，那么就可以肯定`S`是可满足的。

    归结原理虽然强大，但也有一定的局限性。


    ## 3.5 归结反演


    归结原理是一种证明子句集不可满足性的方法。要证明`Q`是`P`，`P`，…，`P`[n]的逻辑结论，只要证明（`P`∧`P`∧…∧`P`[n]）∧﹁`Q`是不可满足的就行了。

    根据定理 3.1，谓词公式的不可满足性和它的子句集的不可满足性是等价的。所以，我们可以用归结原理来自动证明定理。

    用归结原理证明定理的过程叫作归结反演。归结反演的一般步骤如下：

    1）把已知前提用谓词公式`F`表示。

    2）把要证明的结论用谓词公式`Q`表示，并取反得到﹁`Q`。

    3）把谓词公式集{`F`，﹁`Q`}转化为子句集`S`。

    4）用归结原理对子句集`S`中的子句进行归结，并把每次归结得到的归结式都加入`S`中。重复这个过程，直到出现空子句，就证明了`Q`是真的。


