    通过对`ID3`的学习，可以知道`ID3`存在一个问题，那就是越细小的分割分类错误率越小，所以`ID3`会越分越细，甚至将分类错误率降到了0，但是这种分割显然只对训练数据有用，面对新的数据分类错误率反倒上升了，这就是所说的过度学习。


