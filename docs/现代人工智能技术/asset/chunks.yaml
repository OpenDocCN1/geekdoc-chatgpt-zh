    # 第 5 章


    ## 机器学习

    本章首先对机器学习进行了简单的介绍，并针对其中的特征工程和模型评估两个部分进行了说明，最后详细讨论了有监督学习和无监督学习中的一些经典方法。


    ## 5.1 机器学习简介

    人们通常根据自己已有的经验来对事物进行分类鉴别并做出判断，例如，根据喵喵叫这一特点判断出该动物是猫，根据前额上有王字印记判断出该动物是老虎。可以看出，拥有经验就已经可以完成很多事情了。那么机器是否能做到这些呢？机器学习正是这样一门学科，它致力于研究如何通过计算的手段，利用经验来改善系统自身的性能。

    关于机器学习的研究可以追溯到 20 世纪 50 年代，本来希望搞清楚人类大脑及神经系统的学习机理，但由于受到客观条件的影响未能成功，之后又几经波折，直到 20
    世纪 80 年代才获得了蓬勃发展。其与计算机科学、心理学等多学科之间都有密切的联系。


    ### 5.1.1 专业术语

    在机器学习中，用来描述的问题称为模型，而机器如何运算推理的过程称为算法。例如，“判断该动物是否是猫”就是一个模型，“如果会‘喵喵’叫就是猫，反之则不是”就是算法。在计算机上，经验以数据的形式储存，算法调用经验并给出基于当前经验的判断。因此我们追求判断的准确性就要使用更好的算法，机器学习也因此可以称为研究算法的学科。

    在现代社会中，机器学习的应用十分广泛，例如识别手写的邮政编码，鉴别电子邮箱中的垃圾邮件等。以前人们使用`if`、`else`等代码语句来使机器实现部分智能，但是这需要人类为其书写规则，也就需要人类专家对问题本身有比较充分且正确的认识。但是人类制定规则的过程费时且费力，因此想要通过使用机器学习，让计算机自己从所给的数据中找规律。

    因此，机器学习的基础就是有数据。所有数据的集合称为数据集，每一条数据称为样本，是对一个事件或对象的描述。其中事件或对象在某一个方面的性质称为一个属性，在属性上的取值称为属性值。一个样本的属性个数称为样本的维数。

    从数据中通过某学习算法学得模型的过程称为学习或训练，用来训练模型的数据的集合称为训练集，用来测试训练好的模型是否合适的数据集合称为测试集。通常认为事实存在潜在的普遍规律，称之为真相。对于学得的模型中对应的某种潜在规律称为假设。学习过程就是使假设尽可能逼近真相。这里就要说明一下，我们通常假设所有使用和测试的数据都服从一个未知的分布，每一个样本独立，即独立同分布。因此通常情况下，我们获得的关于此分布的信息即数据样本越多，就会训练出更接近于真实分布的模型。

    我们希望学习后的模型针对一个事件和对象，根据给出的属性做出一个判断。因此训练集中的数据应该已经带有这个判断，称为标签。测试集中的数据也应该有标签，用来评估测试的结果。所有标签的集合称为输出空间。

    针对学习后的模型，需要进行检验并且对其评估与选择，需要考虑其性能、偏差、评价方法等，后续章节会进行详细的介绍。

    学习后的模型与真相的相似程度称为拟合程度，拟合程度过低称为欠拟合。对有限个样本点来说，会存在多个通过样本点的模型，因此需要考虑选择哪一条作为我们的模型，也可以称为归纳偏好。“奥卡姆剃刀”是一种常用的、自然科学研究中最基本的原则，即“若有多个假设与观察一致，则选最简单的那个”。当使用测试集测试的时候，是否依然拥有很好的拟合程度称为它的泛化性能。当模型对训练数据过度适配，导致在新的数据上表现较差，称为过拟合，此时泛化性能差。其原因可能是模型参数过多，复杂度高于实际问题，或者训练数据包含抽样误差。其直观表现是训练误差和测试误差之间的差距太大，模型在训练集上表现好，但在测试集上表现不好。

    另外除了拟合程度，要谈论算法的相对优劣，还必须要针对具体的学习问题。在某些问题上表现好的学习算法，在另一些问题上却可能不尽如人意，学习算法自身的归纳偏好与问题是否相配，往往会起到决定性的作用。


    ### 5.1.2 分类

    机器学习主要分为两个大类，监督学习和无监督学习（见图 5-1）。

    在监督学习中，计算机通过示例学习。它从过去的数据中学习，并将学习的结果应用到当前的数据中，以预测未来的事件。在这种情况下，输入和期望的输出数据都有助于预测未来事件。为了准确预测，将输入数据标记为正确答案。

    无监督学习是训练机器使用既未分类也未标记的数据的方法。这意味着无法提供训练数据，机器只能自行学习。机器必须能够对数据进行分类，而无需事先提供任何有关数据的信息。其理念是先让计算机与大量变化的数据接触，并允许它从这些数据中学习，以提供以前未知的见解，并识别隐藏的模式。因此，无监督学习算法不一定有明确的结果。相反，它确定了与给定数据集不同或有趣之处。计算机需要编程才能自学，并且计算机需要从结构化和非结构化数据中理解和提供见解。

    可应用于监督学习的算法主要有回归（预测的是连续值）、贝叶斯分类、支持向量积、决策树等，会在之后的章节中进行详细的介绍。

    可应用于无监督学习的算法主要有聚类，机器自动地根据一些特性将样本分为多个组，称为簇，这些特性不是人为规定的，而是机器自己发现的。


    ![](img/image_085.jpg)


    图 5-1 机器学习分类

    a）监督学习——分类 b）监督学习——回归 c）无监督学习——聚类

    居于两者之间的还有半监督学习，其使用的数据，一部分是标记过的，而大部分是没有标记的。和监督学习相比较，半监督学习的成本较低，但是又能达到较高的准确度。

    在适用半监督学习的一些实际问题中，通常只有少量的有标记的数据，因为对数据进行标记的代价有时很高，比如在生物学中，对某种蛋白质的结构分析或者功能鉴定，可能会花费生物学家很多年的工作时间，而大量的未标记的数据却很容易得到。

    目前机器学习的应用现状非常广泛，也与普通生活密切相关，与数据库、数据挖掘等领域也有紧密的结合。


    ## 5.2 特征工程


    ### 5.2.1 目的与基本流程

    特征工程是成功应用机器学习的一个很重要的环节。在实际项目中，我们可能会有大量的特征可使用，有的特征携带的信息丰富，有的特征携带的信息有重叠，有的特征则属于无关特征，如果所有特征不经筛选地全部作为训练特征，经常会出现维度灾难问题，甚至会降低模型的准确性。因此，我们需要通过特征工程将原始数据转化成能够更好地表达问题本质的特征，使得将这些特征运用到预测模型中时，能提高对不可见数据的模型预测精度。简单来说就是发现对因变量`y`有明显影响作用的特征，通常称自变量`x`为特征。

    特征工程还包含特征选择、特征提取和特征构造等子问题。特征工程的常见方法和步骤如图 5-2 所示。


    ![](img/image_086.jpg)


    图 5-2 特征工程的常见方法和步骤


    ### 5.2.2 数据获取

    要实现特征工程的目标，首先需要进行数据获取，需要结合特定的业务，对具体情况进行具体分析。一般需要重点考虑数据获取途径（例如存储方式）、数据可用性评估（例如获取难度、覆盖率、准确率）和特征维度。具体方法和步骤不在此详细描述。

    获取到原始数据后，可以先对数据的整体情况做一个描述、统计和分析，并且尝试相关的可视化操作。数据获取的常见步骤如图 5-3 所示。


    ![](img/image_087.jpg)


    图 5-3 数据获取的常见步骤


    ### 5.2.3 特征处理

    对数据的整体性有一个宏观的了解之后，即需要进入特征工程第一个重要的环节——特征处理，即数据的清洗工作。特征处理会消耗大量的时间，并且直接影响特征选择的结果。


    **1. 特征预处理**

    在对数据进行预处理的时候，有些特征可能因为无法采样或者没有观测值而出现特征值缺失的情况。常见的特征值缺失的处理方式如图 5-4 所示。

    通常还会进行异常值检验和处理，遇到重复值时需要根据需求判断是否需要去重操作，有时候还需要进行数据格式处理，例如数字类型的转换、数字单位的调整、时间格式的处理。


    **2. 特征转换**

    特征一般分为三类：连续型、无序类别（离散）型、有序类别（离散）型。几种特征转换方式如图 5-5 所示。

    对于连续型特征，通常遇到以下三种情况时需要进行处理。当模型的假设条件是要求特征服从某特殊分布（如正态分布），或服从该分布时，模型的表现较好时，需要对原始特征进行非线性函数转换。当某些特征值比其他特征值具有较大的跨度值时，需要通过缩放避免获得大小非常悬殊的权重值。另外，无量纲化可以使不同规格的数据转换到同一规格。而且，并不是什么时候都需要标准化，比如物理意义非常明确的经纬度，如果标准化的话，则其本身的意义就会丢失。常见的无量纲化方法如图
    5-6 所示。


    ![](img/image_088.jpg)


    ▲图 5-4 常见的特征值缺失的处理方式


    ![](img/image_089.jpg)


    ▲图 5-5 几种特征转换方式


    还可以对数据进行二值化。设定一个阈值，将数值型数据输出为布尔类型。有时候，将数值型属性转换成类别型更有意义，因此进行离散化分箱处理，同时将一定范围内的数值划分成确定的块，使算法减少噪声的干扰。当然，除了归一化，不用做太多的特殊处理，也可以直接把原始特征放进模型里使用。

    针对离散型特征可以进行数值化处理，当特征值不需要排序时，可进行二分类或多分类。对离散型特征还可以进行哑编码和独热编码。独热编码是基于数据集的某一特征的`N`个状态值，用`N`位编码来做区别。其中每一个状态位代表当前状态是否激活，1
    为激活，0 为未激活。而哑编码是基于数据集的某一特征的`N`个状态值，用`N-1`位编码来做区别。其中每一个状态位代表当前状态是否激活，1 为激活，0 为未激活。区别在于最后一个状态位，当前五个状态位都为未激活的状态，则默认为第六个状态。


    ![](img/image_090.jpg)


    图 5-6 常见的无量纲化方法


    例如将人群基于年龄特征分为婴儿、幼儿、少年、青年、中年和老年六个状态，则独热编码需六位编码来做区分，独热编码示意图如图 5-7 所示。


    ![](img/image_091.jpg)


    图 5-7 独热编码示意图


    哑编码则需要五位，哑编码示意图如图 5-8 所示。


    ![](img/image_092.jpg)


    图 5-8 哑编码示意图


    当特征值较多时，矩阵会过于稀疏，常见的方法是通过降维来避免产生稀疏矩阵，将变量值较多的分类维度尽可能降到最少，能降则降，不能降的，别勉强。


