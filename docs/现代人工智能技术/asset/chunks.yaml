    和 Sigmoid 函数类似，tanh 函数能够把输入的连续实值变换为-1～1 之间的输出。当输入趋于-∞时，tanh 函数的输出趋于-1;当输入趋于+∞时，tanh
    函数的输出趋于 1;当输入在 0 周围徘徊的时候，其函数的导数值最大。深度神经网络中的反向传递的时候会发生梯度爆炸和梯度消失，在引入 tanh 函数之后梯度爆炸发生的概率较小，但是梯度消失较大。可以看出，tanh
    函数和 Sigmoid 函数的作用相似，只是输出的范围在［-1，1］。


