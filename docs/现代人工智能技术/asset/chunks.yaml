    ## 8.7 集成强化学习


    在机器学习中，学习的目标是输出一个稳定的且在各个方面表现较好的模型，但是一般来说通过多次训练只能得到多个偏好的模型（即在某些方面表现较好）。集成学习就是期望对多个偏好的模型进行组合，得到一个更好的模型。在强化学习中，可以借助集成强化学习的方法，实现智能体的并行训练及并行决策。


    ### 8.7.1 Bootstrapped DQN


    Bootstrapped DQN算法是用Bootstrap修改DQN以近似`Q`值的分布。其中Bootstrap方法是一种有放回的抽样方法，通过多次的抽样实验得出统计量，并据此计算出统计量的置信区间。在Bagging方法中，利用Bootstrap方法从整体数据集中采取有放回抽样得到`N`个数据集，在每个数据集上学习出一个模型，最后的输出结果利用`N`个模型的输出得到。在每个周期开始时，Bootstrapped
    DQN从其近似后验中采样单个`Q`值函数。然后，智能体遵循在整个事件期间对该样本最优的策略。


    Bootstrapped DQN通过并行构建了`K`个数据集`D`[`i`]，`i`=1，2，…，`K`，然后用如图8-13所示的结构中的`K`个Head分别基于不同的数据集进行训练。其中每一个函数头`Q`[`i`](`s`，`a`|
