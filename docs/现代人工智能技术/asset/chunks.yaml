- raw: '当人们面对各种问题，需要分析、综合和决策时，通常会根据已有的事实，运用已掌握的知识，发现事实之间的联系，或者总结出新的事实。这个过程就叫作推理，也就是从一些初始的证据开始，按照一定的规则，利用知识库里的知识，一步一步地推导出结论的过程。


    在人工智能系统里，推理是由程序来完成的，这个程序叫作推理机。推理需要两个基本要素：事实和知识。事实也叫证据，它们是推理的起点和指导，告诉人们应该用什么知识来推理；知识是推理的动力和依据，它们让人们能够根据事实推进推理，逐渐接近目标
    ^([²](#fn2))


    ### **3.1.2 推理方式及其分类**


    人类智能有多种思维模式，人工智能也有多种推理方法。可以从不同的角度来对它们进行分类。


    **1. 演绎推理**、**归纳推理**、**默认推理**


    推理是根据已知的信息来得出新的结论的过程。推理有不同的类型，根据推出结论的方法，可以分为演绎推理、归纳推理和默认推理。


    演绎推理是从一般到个别的推理，它是用通用的知识或假设来推出适用于特定情况的结论。


    演绎推理是人工智能领域的一种常用的推理方法，许多智能系统都采用了这种方法。演绎推理有多种形式，其中最常见的是三段论。三段论是由以下三个部分组成的推理结构：


    1）大前提：已知的一般性知识或假设。


    2）小前提：关于具体情况或个别事实的判断。


    3）结论：根据大前提和小前提推出的新判断。


    下面是一个三段论推理的例子：


    1）大前提：足球运动员的身体都是强壮的。


    2）小前提：高波是一名足球运动员。


    3）结论：高波的身体是强壮的。


    归纳推理是一种从个别事例中总结出一般性结论的推理过程，是人工智能领域常用的一种推理方法。根据归纳时所选事例的广泛性，归纳推理可以分为完全归纳推理和不完全归纳推理两种。


    完全归纳推理是指在进行归纳时考察了相应事物的所有对象，并根据这些对象是否都具有某种属性，从而推出这个事物是否具有这个属性。例如，某厂进行产品质量检查，如果对每一件产品都进行了严格检查，并且都是合格的，则推导出结论“该厂生产的产品是合格的”。


    不完全归纳推理是指在进行归纳时只考察了相应事物的部分对象，就得出了结论。例如，检查产品质量时，只是随机地抽查了部分产品，只要它们都合格，就得出结论“该厂生产的产品是合格的”。


    不完全归纳推理推出的结论不一定正确，属于非必然性推理，而完全归纳推理推出的结论则是必然正确的，属于必然性推理。但由于要考察事物的所有对象通常都比较困难，因而大多数归纳推理都是不完全归纳推理。归纳推理是人类思维活动中最基本、最常用的一种推理形式。人们在由个别到一般的思维过程中经常要用到它。


    默认推理又称为缺省推理，是在知识不完全的情况下假设某些条件已经具备所进行的推理。


    例如，在条件*A*已成立的情况下，如果没有足够的证据能证明条件*B*不成立，则默认*B*是成立的，并在此默认的前提下进行推理，推导出某个结论。例如，要设计一种鸟笼，但不知道要放的鸟是否会飞，则默认这只鸟会飞，因此，推出这个鸟笼要有盖子的结论。


    由于这种推理允许默认某些条件是成立的，所以在知识不完全的情况下也能进行。在默认推理的过程中，如果到某一时刻发现原来所做的默认条件不正确，则要撤销所做的默认条件以及由此默认条件推出的所有结论，重新按新情况进行推理。


    **2. 确定性推理**、**不确定性推理**


    推理可以根据所用知识的确定性分为确定性推理和不确定性推理两种。


    确定性推理是指在推理时所用的知识和证据都是确定的，推出的结论也是确定的，其真值只有真或假两种可能。


    本章将讨论的经典逻辑推理就属于这一类。经典逻辑推理是最早提出的一类推理方法，是根据经典逻辑（命题逻辑和一阶谓词逻辑）的逻辑规则进行的一种推理，主要有自然演绎推理、归结演绎推理、与/或形演绎推理等。


    不确定性推理是指在推理时所用的知识和证据不都是确定的，推出的结论也是不确定的。


    现实世界中的事物和现象大都是不确定或模糊的，很难用精确的数学模型来表示和处理。不确定性推理又分为似然推理和近似推理或模糊推理，前者是基于概率论的推理，后者是基于模糊逻辑的推理。人们经常在知识不完全、不精确的情况下进行推理，因此，要使计算机能模拟人类的思维活动，就必须使它具有不确定性推理的能力。


    **3. 单调推理**、**非单调推理**


    推理可以根据推出的结论是否越来越接近最终目标来分为单调推理和非单调推理两种。


    单调推理是指在推理过程中随着推理向前推进及新知识的加入，推出的结论越来越接近最终目标。


    单调推理的推理过程中不会出现反复的情况，即不会由于新知识的加入否定了前面推出的结论，从而使推理又退回到前面的某一步。本章将要介绍的基于经典逻辑的演绎推理属于单调推理。


    非单调推理是指在推理过程中由于新知识的加入，不仅没有加强已推出的结论，反而要否定它，使推理退回到前面的某一步，然后重新开始。


    非单调推理一般是在知识不完全的情况下发生的。由于知识不完全，为使推理进行下去，就要先做某些假设，并在假设的基础上进行推理。当以后由于新知识的加入发现原来的假设不正确时，就需要撤销该假设以及由此假设推出的所有结论，再用新知识重新进行推理。显然，默认推理是一种非单调推理。


    在人们的日常生活及社会实践中，很多情况下进行的推理都是非单调推理。明斯基举了一个非单调推理的例子：当知道*X*是一只鸟时，一般认为*X*会飞，但之后又知道*X*是企鹅，而企鹅是不会飞的，则撤消先前加入的*X*会飞的结论，而加入*X*不会飞的结论。


    **4. 启发式推理**、**非启发式推理**


    推理可以根据是否运用与推理有关的启发性知识来分为启发式推理和非启发式推理两种。


    如果推理过程中运用与推理有关的启发性知识，则称为启发式推理，否则称为非启发式推理。


    启发式推理是指在推理过程中运用与推理有关的启发性知识，以加快推理速度，求得问题的最优解。所谓启发性知识是指与问题有关且能指导推理方向的知识。例如，推理的目标是要在脑膜炎、肺炎、流感这三种疾病中选择一个，又设有*r*、*r*、*r*这三条产生式规则可供使用，其中*r*推出的是脑膜炎，*r*推出的是肺炎，*r*推出的是流感。如果希望尽早地排除脑膜炎这一危险疾病，应该先选用*r*；如果本地区目前正在盛行流感，则应考虑首先选择*r*。这里，“脑膜炎危险”及“目前正在盛行流感”是与问题求解有关的启发性信息。


    12312313


    非启发式推理是指在推理过程中不运用与推理有关的启发性知识，只根据逻辑规则进行推理。非启发式推理一般是在知识完全的情况下进行的。由于知识完全，不需要做任何假设，也不会出现因为新知识的加入而撤销之前的结论的情况。本章将要介绍的基于经典逻辑的演绎推理属于非启发式推理。


    ### **3.1.3 推理的方向**


    推理过程是求解问题的过程。问题求解的质量与效率不仅取决于所采用的求解方法（如匹配方法、不确定性的传递算法等），还取决于求解问题的策略，即推理的控制策略。


    推理的控制策略主要包括推理方向、搜索策略、冲突消解策略、求解策略及限制策略等。推理方向根据推理过程中知识和目标之间的关系，分为正向推理、逆向推理、混合推理及双向推理四种。


    **1. 正向推理**


    正向推理是一种从已知事实出发，寻找问题解答的方法。


    正向推理的基本原理是：首先，根据用户提供的初始事实，在知识库中找出能够应用的知识，形成一个知识集合。然后，按照一定的规则从知识集合中选择一条知识进行推理，并把推理出来的新事实加入数据库中。接着，再在知识库中寻找能够应用的知识，重复上述过程，直到找到问题的答案或者没有可用的知识为止。


    正向推理的基本步骤如下：


    1）把用户提供的初始事实放入数据库（DB）中。


    2）检查数据库中是否已经有了问题的答案，如果有，就结束推理，并给出结果；如果没有，就继续下一步。


    3）根据数据库中的事实，查找知识库（KB）中能够与之匹配的知识，如果有，就进入下一步；如果没有，就进入第6）步。


    4）把知识库中所有能够匹配的知识都选出来，形成一个知识集合（KS）。


    5）如果知识集合不为空，就按照一定的规则从中选择一条知识进行推理，并把推理出来的新事实加入数据库中，然后回到第2）步；如果知识集合为空，就进入第6）步。


    6）询问用户是否还能提供更多的事实，如果能，就把新事实加入数据库中，然后回到第3）步；如果不能，就表示无法找到答案，推理失败。


    正向推理示意图如图3-1所示。


    正向推理要想实现，还有许多具体问题要解决。比如，要从知识库中找出能够应用的知识，并要把知识库中的知识和数据库中的事实进行比较，看看是否能够匹配。为了比较，就要确定比较的方法。但是，比较往往不是完全一致的，所以还要确定什么样的比较才算是成功的。


    **2. 逆向推理**


    逆向推理是一种从结果推出原因的思维方式。


    逆向推理的基本方法是：先假设一个可能的结果，然后寻找能够证明这个结果的事实。如果能找到足够的事实，就说明这个结果是正确的；如果找不到任何事实，就说明这个结果是错误的，需要换一个假设。


    逆向推理的步骤可以用下面的算法表示：


    1）提出一个想要证明的结果（假设）。


    2）检查这个结果是否已经在数据库中存在，如果存在，就说明这个结果是正确的，结束推理或者验证下一个假设；如果不存在，就继续下一步。


    3）判断这个结果是否是事实，也就是说，它是否需要用户来确认，如果是，就询问用户；如果不是，就继续下一步。


    4）在知识库中找出所有能推出这个结果的知识，形成一个可用的知识集合KS，然后继续下一步。


    ![](EPUB/images/image_014.jpg)


    图3-1 正向推理示意图


    5）从KS中选择一条知识，并把这条知识的条件作为新的假设，然后回到步骤2）。


    逆向推理示意图如图3-2所示。


    逆向推理比正向推理要复杂一些，上面的算法只是概括了大概步骤，还有很多细节没有说明。比如，怎么判断一个假设是不是事实？当有多条知识能推出一个假设时，怎么决定先用哪一条？还有，一条知识的条件通常有好几个，当验证了一个条件后，怎么自动地换成验证另一个条件？再者，在验证一个条件时，需要把它当作新的假设，并找出能推出这个假设的知识，这样就会产生一组新的条件，形成一个树形结构。当到达树的末端（也就是数据库中有对应的事实或者用户能确认对应的事实等）时，又要一层一层地往上回去。回去的过程中可能又要往下一层走，这样来来回回很多次，才能得出原假设是不是正确的答案。这是一个很复杂的推理过程。


    逆向推理的主要优点是只用和目标有关的知识，有明确的目的，而且还能给用户提供解释。它的主要缺点是开始的目标选得不好，可能不符合实际情况，就要多次更换假设，影响系统的效率。


    ![](EPUB/images/image_015.jpg)


    图3-2 逆向推理示意图


    **3. 混合推理**


    正向推理有一个缺点，就是会盲目地推出很多和问题无关的中间结果，浪费时间和资源。逆向推理也有一个缺点，就是如果开始的假设不对，也会降低系统的效率。为了解决这些问题，可以把正向推理和逆向推理结合起来，让它们互相配合，发挥各自的优点，弥补各自的缺点。这种既用正向又用逆向的推理叫作混合推理。在以下几种情况下，通常也需要用到混合推理。


    （1）事实不充分


    当数据库中的事实不够多时，用这些事实去匹配知识的条件进行正向推理，可能找不到一条合适的知识，就无法继续推理。这时，可以先用正向推理找出那些条件不完全匹配的知识，并把这些知识能推出的结果作为假设，然后对这些假设进行逆向推理。在逆向推理中，可以向用户询问相关的事实，这样就可能让推理继续下去。


    （2）结论不够可信


    用正向推理进行推理时，虽然得到了结论，但可信度可能不高，不符合要求。为了得到一个可信度高的结论，可以把这些结论作为假设，然后进行逆向推理，通过向用户询问更多的信息，有可能得到一个可信度高的结论。


    （3）结论不够多


    在逆向推理过程中，因为要和用户对话，有针对性地向用户提问，这样就可能获得一些原来不知道的有用信息。这些信息不仅可以用来证明假设，还可以用来推出其他结论。所以，在用逆向推理证明了一个假设之后，可以再利用逆向推理中得到的信息进行正向推理，推出更多的结论。比如，在医疗诊断系统中，先用逆向推理证明一个病人有某种病，然后再利用逆向推理中得到的信息进行正向推理，就可能发现这个病人还有其他病。


    总之，混合推理有两种方式：一种是先用正向推理从已知事实推出部分结果，帮助选择一个目标，然后再用逆向推理证明这个目标或提高它的可信度；另一种是先假设一个目标进行逆向推理，然后再利用逆向推理中得到的信息进行正向推理，以得到更多的结果。


    先正向后逆向混合推理示意图如图3-3所示。先逆向后正向混合推理示意图如图3-4所示。


    ![](EPUB/images/image_016.jpg)


    ▲图3-3 先正向后逆向混合推理示意图


    ![](EPUB/images/image_017.jpg)


    ▲图3-4 先逆向后正向混合推理示意图


    **4. 双向推理**


    在机器证明定理等问题中，常会用到双向推理。双向推理就是让正向推理和逆向推理同时进行，而且在推理的过程中能够“碰头”的一种推理。它的基本方法是：一方面从已知事实开始进行正向推理，但不一定要推到最终目标；另一方面从一个假设目标开始进行逆向推理，但不一定要推到原始事实，而是让它们在中间某个地方相遇，也就是说正向推理得到的中间结果正好是逆向推理需要的证据，这时候推理就可以结束了，逆向推理的假设就是推理的最终结果。


    双向推理的难点在于怎么判断“碰头”。另外，怎么平衡正向推理和逆向推理的比例，也就是说怎么确定“碰头”的时机也是一个难点。


    ### **3.1.4 冲突消解策略**


    在推理过程中，系统要不断地把已知的事实和知识库中的知识进行比较。这时可能出现以下三种情况：


    1）已知的事实只能和知识库中的一条知识比较成功。


    2）已知的事实和知识库中的任何知识都比较不成功。


    3）已知的事实能和知识库中的多条知识比较成功。或者多个（组）已知的事实都能和知识库中的某一条知识比较成功；或者有多个（组）已知的事实能和知识库中的多条知识比较成功。


    这里已知的事实和知识库中的知识比较成功的意思是，对于正向推理来说，是指产生式规则的条件和已知的事实比较成功；对于逆向推理来说，是指产生式规则的结果和假设比较成功。


    对于第一种情况，因为只有一条知识能比较成功，所以它就是可以用的知识，可以直接用它进行当前的推理。


    对于第二种情况，因为找不到能和已知事实比较成功的知识，所以推理无法继续下去。这可能是因为知识库中缺少一些必要的知识，或者是因为要解决的问题超出了系统能力范围等。此时，可以根据当前的实际情况做相应的处理。


    对于第三种情况，和第二种情况相反，推理过程中不是只有一条知识能比较成功，而是有多条知识能比较成功，这就叫作发生了冲突。按照一定的方法从比较成功的多条知识中挑出一条用于当前推理的过程叫作冲突消解。解决冲突时用到的方法叫作冲突消解方法。对于正向推理来说，它会决定选择哪一组已知事实来激活哪一条产生式规则，让它用于当前推理，得到结果所指出的结论或执行相应的操作。对于逆向推理来说，它会决定哪一个假设和哪一个产生式规则的结果进行比较，从而得到相应的条件，作为新的假设。


    现在已经有很多种消解冲突的方法，它们都是基于对知识进行排序。常用的有以下几种。


    **1. 按规则的针对性排序**


    这种方法是优先选择条件更多的产生式规则。如果*r*的条件包括了*r*的所有条件，而且还有其他条件，就说*r*比*r*更有针对性，*r*比*r*更有通用性。所以，当*r*和*r*发生冲突时，优先选择*r*。因为其条件更多，其结果更接近目标，一旦满足了，就可以缩短推理过程。


    212112212


    **2. 按已知事实的新鲜性排序**


    在产生式系统的推理过程中，每用一条产生式规则就会得到一个或多个结论或者执行某个操作，数据库就会增加新的事实。另外，推理时还会向用户询问相关的信息，也会改变数据库的内容。一般把数据库中后来出现的事实叫作新鲜的事实，也就是说后出现的事实比先出现的事实更新鲜。如果一条规则用了之后得到了多个结论，可以认为这些结论有相同的新鲜度，也可以认为排在前面（或后面）的结论更新鲜，根据具体情况而定。


    假设规则*r*能和事实组*A*比较成功，规则*r*能和事实组*B*比较成功，那么*A*和*B*中哪一组更新鲜，就用哪一条规则先进行推理。


    ### 12


    怎么判断*A*和*B*中哪一组事实更新鲜呢？常用的方法有以下三种：


    1）将*A*和*B*中的事实一个一个地比较它们的新鲜度，如果*A*中有更多的事实比*B*中的事实更新鲜，就认为*A*比*B*新鲜。比如，假设*A*和*B*中各有5个事实，而*A*中有3个事实比*B*中的事实更新鲜，就认为*A*比*B*新鲜。


    2）把*A*中最新鲜的事实和*B*中最新鲜的事实进行比较，哪一个更新鲜，就认为对应的事实组更新鲜。


    3）把*A*中最不新鲜的事实和*B*中最不新鲜的事实进行比较，哪一个更不新鲜，就认为对应的事实组更不新鲜。


    **3. 按匹配度排序**


    在不确定性推理中，需要计算已知事实和知识的相似度，当它们的相似度达到一定的标准时，就认为它们是可以比较成功的。如果产生式规则*r*和*r*都能比较成功，就优先选择相似度更高的产生式规则。


    ### 12


    **4. 条件个数排序**


    如果有多条产生式规则得到的结果一样，就优先选择条件少的产生式规则，因为条件少的规则比较时用的时间少。


    在实际应用中，可以把上面的几种方法结合起来，尽量减少冲突的出现，让推理更快且更有效。


    ## **3.2 自然演绎推理**


    自然演绎推理是指从一组已知为真的事实出发，运用经典逻辑的推理规则，直接得出结论的过程。经典逻辑的推理规则包括*P*规则、*T*规则、假言推理、拒取式推理等。其中，假言推理和拒取式推理是常用的两种形式。


    假言推理的一般形式是


    *P*，*P*→*Q*⇒*Q*


    它表示：如果已知*P*→*Q*为真，并且*P*也为真，那么可以推出*Q*为真。


    例如，已知“如果*x*是金属，那么*x*能导电”为真，并且“铜是金属”也为真，那么可以推出“铜能导电”的结论。


    拒取式推理的一般形式是


    *P*→*Q*，﹁*Q*⇒﹁*P*


    它表示：如果已知*P*→*Q*为真，并且*Q*为假，那么可以推出*P*为假。


    例如，已知“如果下雨，那么地上就湿”为真，并且“地上不湿”为假，那么可以推出“没有下雨”的结论。


    在使用这两种推理时，要注意避免两种常见的错误：肯定后件和否定前件。


    肯定后件是指，在已知*P*→*Q*为真的情况下，通过肯定*Q*为真来推出*P*为真。这是不合逻辑的。


    例如，伽利略在论证哥白尼的日心说时，曾使用了如下推理：


    1）如果行星系统是以太阳为中心的，那么金星会显示出位相变化。


    2）金星显示出位相变化（肯定后件）。


    3）所以，行星系统是以太阳为中心。


    这里使用了肯定后件的推理，违反了经典逻辑规则，因此受到了批评。'
