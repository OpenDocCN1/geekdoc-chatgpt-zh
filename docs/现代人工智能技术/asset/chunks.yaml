    ## 7.5 门控循环单元


    ### 7.5.1 门控循环单元的简介


    门控循环单元（Gated Recurrent Unit，`GRU`）是一种基于循环神经网络的深度学习模型，由 Kyunghyun Cho 等人于 2014
    年提出。与传统的循环神经网络相比，门控循环单元引入了门控机制，可以更好地处理长序列数据，并且参数更少，训练速度更快，其核心思想是引入两个门控单元，分别是重置门和更新门。重置门控制前一时间步的信息在当前时间步的丢弃程度，更新门控制前一时间步的信息在当前时间步的保留程度。通过这两个门控制信息的流动，门控循环单元可以更好地处理长序列数据，并解决梯度消失和梯度爆炸问题。


    门控循环单元的网络结构与传统的循环神经网络类似，但是只有一个单元，没有显式的输出。其计算可以分为三个步骤：重置门、更新门和当前状态的计算。其中，重置门和更新门的计算都是通过`Sigmoid`函数来实现的。当前状态的计算则是通过一个`tanh`函数来实现的，其输出会被更新门控制的前一时间步的状态加权平均，并与重置门控制的前一时间步的状态相结合，形成当前时间步的状态。


    门控循环单元已经在自然语言处理、语音识别、图像处理等领域中取得了广泛应用，并在多个公开数据集上取得了优秀的成果。


