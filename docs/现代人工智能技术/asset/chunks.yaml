    ## 3.6 小结


    ### 1. 推理的概念


    推理是指根据初始证据，利用知识库中的已知知识，按照一定的策略，逐步推导出结论的过程。推理有不同的类型，可以根据不同的标准进行分类。

    按照推理的方向，可以分为演绎推理和归纳推理。演绎推理是从一般性知识出发，推出适用于某个具体情况的结论。这是一种由一般到个别的推理。归纳推理是从大量的具体事例中总结出一般性结论的推理。这是一种由个别到一般的推理。

    按照推理中所涉及的知识和证据的确定性，可以分为确定性推理和不确定性推理。确定性推理是指在推理过程中，所用的知识和证据都是确定无疑的，因此得出的结论也是确定无疑的。不确定性推理是指在推理过程中，所用的知识和证据有一定的不确定性，因此得出的结论也有一定的不确定性。

    按照推理中所使用的启发性知识的有无，可以分为启发式推理和非启发式推理。启发式推理是指在推理过程中，运用与推理相关的启发性知识来指导或优化推理过程。非启发式推理是指在推理过程中，不使用任何启发性知识，只依靠逻辑规则进行推理。

    按照推理中所得到的结论是否随着新知识的加入而改变，可以分为单调推理和非单调推理。单调推理是指在推理过程中，随着新知识的加入，所得到的结论越来越多，越来越接近最终目标，但不会改变或否定之前已经得到的结论。非单调推理是指在推理过程中，由于新知识的加入，可能会导致之前已经得到的结论不再成立，需要撤销或修改它们，然后重新开始推理。

    按照推理开始时所依据的信息来源，可以分为正向推理和逆向推理。正向推理是以已知事实为出发点，向前进行推理，直到达到某个目标或无法继续为止。逆向推理是以某个假设目标为出发点，向后进行推理，直到找到支持或反驳它的事实或无法继续为止。正向和逆向相结合的推理称为混合推理。


    ### 2. 推理的方法


    自然演绎推理是一种从已知的真实事实出发，按照经典逻辑的规则，直接得出结论的思维方式。

    由一个原子谓词公式或它的否定构成的表达式叫作文字。文字之间用或连接起来的表达式叫作子句。

    任何一个谓词公式都可以转化成一组子句。如果一个谓词公式永远不可能成立，那么它对应的子句集也永远不可能成立。

    鲁滨逊归结原理是一种用来证明子句集不可能成立的理论和方法，也是机器定理证明的基础。它的基本步骤是：把要证明的定理写成谓词公式，然后转化成子句集，接着对子句集进行归结操作，如果归结出了空子句，就说明定理成立。


