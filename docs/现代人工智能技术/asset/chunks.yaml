    类似地，可给出基于分布定义的代价敏感错误率，以及其他一些性能度量如精度的代价敏感版本。若令`cost[ij]`中的`i`、`j`取值不限于0、1，则可定义出多分类任务的代价敏感性能度量。


    在非均等代价下，ROC曲线不能直接反映出学习器的期望总体代价，而代价曲线则可达到该目的。代价曲线图的横轴是取值为［0，1］的正例概率代价


