    ![](EPUB/images/image_058.jpg)


    与以上两个算法不同的是，这里选择的基因位置是可以不连续的，除了这一点外，其他均与有序交叉相同，本例的另外一个子代为243519678。


    ### 2. 修正的交叉方法

    在交叉过程中，会产生一些不满足约束条件的非法染色体。为了解决这种情况，可以构造惩罚函数的方法，但是效果不佳，因为这将会使得原本就复杂的算法变得更加复杂，使算法的运算效率降低。另一种方法就是对交叉变异等操作进行修正，使非法染色体经过修正后自动满足优化问题的约束条件。


    ## 4.2.9 变异

    变异是生物进化的根本动力，如果不存在变异，那么即使经过成千上万代的交叉遗传，生物的适应能力依然是不会进步的，例如眼睛的大小顶多维持在原种群眼睛最大的个体的程度而不会有进步。而从生物进化的角度来看，生物各种适应能力（包括人类一代又一代变大的眼睛）是在加强的，所以也就是说存在某种打破当前基因型的一种力量，使得生物可以在一代又一代的交叉中不断地突破自我。发生变异的概率通常都很小，但是经过很多代的持续变异以后将会产生巨大的变化。当然，变异并不会朝着生物的意愿而产生，变异是没有规律的，很多变异都是对生物不利的，也有一部分变异对生物的适应性没有影响，但也有一部分会给生物带来好处，使它们的能力远超其他个体，物竞天择，因此便会在生物进化中脱颖而出。此外，生物进化的机制不仅可以改进已有的能力特征，还可能会产生新的特征。


    在遗传算法中，变异是将个体编码的一些位进行随即变换，变异的目的是为了维持个体基因的多样性，对选择和交叉过程中丢失的一些基因进行修复和补充。变异算子是对群体中的某些个体串的基因座上的基因值进行变动，变异操作是按位进行的，即把某一位的内容进行变异，变异的概率是一个染色体中按位进行变化的概率，主要有以下几种变异：


    #### （1）位点变异

    位点变异是对群体中的个体码串，随机地去挑选一个或者多个位置，并对这些位置的基因值以变异概率`P`（一般不能很大）进行变动。对于二进制编码的个体来说，若某个位置的原基因值为1，那么变异以后的值为0，反之也是这样。对于正数编码，则是依据其值变异后出现的概率进行选择，此外为了消除编译过程中出现的非法染色体，我们会将其他位置的基因值变为被选择基因。


    m


    #### （2）逆转变异

    在选择的个体码串上随机地选择两个点，将两个点之间的基因值进行逆转排序然后再插入原位置上。


    #### （3）插入变异

    在选择的个体码串上随机选择一个编码，然后插入得到选择插入点的位置。


    #### （4）互换变异

    在选择的个体码串中选择两个位置基因值进行简单的交换。


    #### （5）移动变异

    随机地选择一个基因值，然后随机向左或向右移动随机位数。


