    # 第8章


    ## 强化学习


    本章首先介绍了强化学习的概念，然后讨论了马尔可夫过程，接着分别介绍了五种经典强化学习方法：基于价值的强化学习、基于策略的强化学习、深度强化学习、模仿强化学习和集成强化学习。


    ## 8.1 强化学习的概念


    在机器学习领域，有一类很重要的任务叫作序贯决策问题，即在每一个时段都做出决策，每一时段的决策都会对未来产生一定的影响


    ### 8.1.1 序贯决策问题


    序贯决策是指按时间顺序排列起来，以得到按顺序的各种决策（策略），是用于随机性或不确定性动态系统最优化的决策方法。序贯决策问题可以被表达为如下形式：一个智能体与离散的时间动态系统进行迭代地交互。在每个时间步开始时，系统会处于某种状态。基于智能体的决策规则，它会观察当前的状态，并从有限状态集中选择一个。然后，动态系统会进入下一个新的状态并获得一个对应的收益。这样循环进行状态选择，以获得一组最大化收益。


    一般而言，序贯决策问题可以被分为如下三类：


    1）马尔可夫决策问题：系统下一步可能出现的状态的概率分布是已知的。


    2）马尔可夫博弈问题：问题中存在一系列的智能体。在每一阶段的起始，博弈处于某种特定状态。每一智能体选择某种行动，然后会获得取决于当前状态和所选择行动的收益。之后，博弈发展到下一阶段，处于一个新的随机状态，这一随机状态的分布取决于先前状态和各智能体选择的行动。在新状态中重复上述过程，然后博弈继续进行有限或无限个数的阶段。


    3）部分可观察的马尔可夫决策过程：系统假设状态是由马尔可夫过程决定的，但是潜在的状态无法直接观察。


    在现阶段，强化学习被认为是马尔可夫决策过程的一部分。


    ### 8.1.2 强化学习


    强化学习是一种通过从交互中学习来实现目标的计算方法。与传统的监督学习的监督方法相比，强化学习中不需要标定过的数据对模型进行训练，而是通过智能体与环境的交互使智能体自主地学习。


    强化学习中有如下六个要素：历史、状态、策略、奖励、价值函数、模型。


    1）历史`H`：是观察`O`、行动`A`和奖励`R`的序列，即一直到时间`t`为止的所有可观测变量。


    ![](EPUB/images/image_346.jpg)


