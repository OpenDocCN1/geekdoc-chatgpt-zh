    #### 2. 量词

    谓词逻辑中引入了两个量词：全称量词和存在量词，用来刻画谓词与个体之间的关系。

    ①全称量词（∀ `x`）：表示“对个体域中的所有（或任一个）个体`x`”。例如：

    “所有的机器人都是白色的”可表示为

    `(∀ x)[Robot(x) → Color(x, White)]`

    “所有的工人都修理引擎”，可表示为

    '
