    （7）略去全称量词

    （﹁`P`（`x`，`f`（`x`））∨`Q`（`x`，`g`（`x`）））∧（﹁`P`（`x`，`f`（`x`））∨﹁`R`（`x`，`g`（`x`）））


    （8）消去合取词，把母式用子句集表示

    {﹁`P`（`x`，`f`（`x`））∨`Q`（`x`，`g`（`x`）），﹁`P`（`y`，`f`（`y`））∨﹁`R`（`y`，`g`（`y`））}


    ### 例3.3

    将下列谓词公式化为子句集：

    （∀`x`）{[﹁`P`（`x`）∨﹁`Q`（`x`）]→（∀`y`）[`S`（`x`，`y`）∧`Q`（`x`）]}∧（∀`x`）[`P`（`x`）∨`B`（`x`）]


