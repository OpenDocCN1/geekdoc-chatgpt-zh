    式中，`l(x, y; θ)`是单个样本（`x`, `y`）在参数`θ`下的损失。


    在每次迭代中，服务器将当前全局参数`θ`发送给所有参与者。每个参与者`i`利用自己的数据集和某种优化算法（如随机梯度下降）更新自己的本地参数 `θ`：


    ![](EPUB/images/image_582.jpg)


    然后每个参与方将自己的本地参数或者梯度上传给服务器。服务器根据某种聚合规则（如加权平均），计算出更新后的全局参数`θ`：


