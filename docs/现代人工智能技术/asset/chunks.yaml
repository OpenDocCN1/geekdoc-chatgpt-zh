    ## 9.5 纵向联邦学习


    ### 9.5.1 纵向联邦学习的定义


    纵向联邦学习适用于联邦学习的多个参与者拥有相同的样本 ID 空间，但拥有样本特征空间的不同场景。也就是说，每个参与者都拥有样本的部分特征，但没有其他参与者所有的特征。为了利用所有参与者的特征信息，搭建更好的机器学习模型，他们需要在不泄露原始数据的情况下协作训练一个模型。


    纵向联邦学习可以看作是按列划分数据的联邦学习。它可以用于交叉用户在不同业态下的特征联合，比如同一地区的商超和银行之间共享用户消费和信用等特征。纵向联邦学习通常需要一方提供标签信息，以便进行监督学习。


    更具体地，利用在 9.1.3 节所定义的特征空间`X`、标签空间`Y`和样本 ID 空间`I`，可以把纵向联邦学习适用的场景描述为


    ![](img/image_600.jpg)


    式中，`D[i]`和`D[j]`分别表示联邦学习参与者`i`和`j`所持有的数据集。


    通常来说，在针对纵向联邦学习系统中的安全性进行讨论时，往往会假设所有参与者都是诚实但好奇的，且整个模型训练过程中的通信过程足够安全，信息传输无损内容无变化。也就是说，我们通常假设纵向联邦学习的参与者在遵守安全协议的同时，也会尝试获得其他参与者所有的信息，隐私暴露风险仅可能发生在各个参与者处。


    有时为了提高纵向联邦学习的运行效率，一个半诚实的第三方（Semi-honest Third Party，`STP`）会加入纵向联邦系统中。`STP`类似于横向联邦系统中的中央服务器，会接收各个参与者经过加密或是混淆处理后的中间结果计算梯度、损失值等，再转发给每个参与者。`STP`需要保证各个参与者的所有数据不暴露给彼此，并且各个参与者只会收到与其拥有的特征相关的模型参数。


    在纵向联邦学习系统学习过程的最后，每一个参与者只会拥有与自己的特征相关的模型参数。因此，在执行推理任务时，也需要所有参与者协作生成结果。


    ### 9.5.2 纵向联邦学习架构


    纵向联邦学习的典型架构如图 9-12 所示。在这种架构下的纵向联邦学习一般包括以下几个角色：


    1）客户端：拥有数据的参与者，可以是企业或个人，他们在本地训练模型，并与其他参与方交换模型参数。


    2）协调者：负责协调客户端之间的通信和同步，以及提供一些公共服务，如加密、实体对齐等。


    3）审计者（非必须）：负责监督联邦学习的过程和结果，以确保数据隐私和模型安全。


    纵向联邦学习的训练过程主要可以分为加密样本对齐和加密模型训练两个部分：


    1）加密样本对齐：是指在不泄露用户 ID 差集的情况下，找出参与者之间的用户交集，作为建模的样本空间。这一步可以通过安全多方计算、同态加密等技术实现，加密样本对齐如图
    9-13 所示。


    ![](img/image_601.jpg)


    ▲图 9-12 纵向联邦学习的典型架构


    ![](img/image_602.jpg)


    ▲图 9-13 加密样本对齐


    2）加密模型训练：是指在不泄露用户特征数据的情况下，利用已对齐的样本空间进行模型参数更新和优化。这一步可以通过差分隐私、联合安全计算等技术实现。


