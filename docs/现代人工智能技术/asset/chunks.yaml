    ### 2.4.3 框架表示法的特点


    #### 1. 结构性


    框架表示法的特点是能够表达结构性知识，即知识的内部结构关系和知识之间的联系。这是产生式表示法所不具备的。产生式表示法的知识单位是产生式规则，它只能表示因果关系，而且规则太小，难以处理复杂问题。框架表示法的知识单位是框架，它可以通过不同的槽来表示更复杂的关系。例如，因果关系可以用`Infer`槽或`Possible-reason`槽来表示，其他类型的关系也可以用相应的槽来表示。框架还可以有子框架，从而形成层次结构。


    #### 2. 继承性


    框架表示法可以通过让一个框架的槽值指向另一个框架的名字，来实现不同框架之间的联系，从而构建复杂知识的框架网络。在这个网络中，下层框架可以继承上层框架的槽值，也可以对其进行补充和修改。这样既可以减少知识的重复，又可以保证知识的一致性。


    #### 3. 自然性


    框架表示法与人在观察事物时的思维活动是一致的，比较自然。


    ## 2.5 小结


    #### 1. 知识的概念


    知识是指将相关信息联系起来形成的信息结构。


    知识具有相对正确性、不确定性、可表示性和可利用性等特征。


    造成知识不确定性的原因主要有随机性、模糊性、经验性和不完全性。


    #### 2. 命题与一阶谓词公式


    命题是指能够判断真假的陈述句。


    谓词是一种表示某种性质或关系的符号，它的一般形式是`P`（`x`，`x`，…，`x`[`n`]），其中`P`是谓词名，`x`，`x`，…，`x`[`n`]，是个体。个体可以是常量、变量或函数。


    1212


    可以用否定、析取、合取、蕴涵、等价等逻辑连接词，以及全称量词、存在量词把简单命题连接成复合命题，以表达更复杂的含义。


    量词后面跟着的单个谓词或用括号括起来的谓词公式叫作量词的辖域，辖域内与量词中同名的变量叫作约束变量，不受约束的变量叫作自由变量。


    对于一个谓词公式`P`，如果存在至少一个解释使得`P`在这个解释下为真，那么称`P`是可满足的，否则称`P`是不可满足的。


    当且仅当（`P`∧`P`∧…∧`P`[`n`]）∧﹁`Q`是不可满足的，那么`Q`就是`P`，`P`，…，`P`[`n`]的逻辑结论。


    1212


    一阶谓词逻辑表示法具有自然、精确、严密、易于实现等优点，但也有表示不确定知识困难、组合爆炸问题、效率低下等缺点。


    #### 3. 产生式表示法


    产生式是一种广泛应用的知识表示模型，许多成功的专家系统都采用它来表示知识。


    产生式通常用于表示事实、规则及其不确定性度量。谓词逻辑中的蕴涵式只是产生式的一种特例。


    产生式不仅可以表示确定性规则，还可以表示各种操作、规则、变换、算子、函数等。产生式不仅可以表示确定性知识，而且还可以表示不确定性知识。


    产生式表示法具有自然性、模块性、有效性、清晰性等优点，但也存在效率不高、不能表达具有结构性的知识等缺点，其适合表示由许多相对独立的知识元组成的领域知识、具有经验性和不确定性的知识，也可以表示为一系列相对独立的求解问题的操作。


    一个产生式系统由规则库、和控制系统（推理机）综合数据库三部分组成。产生式系统求解问题的过程是一个不断地从规则库中选择可用规则与综合数据库中的已知事实进行匹配的过程，规则的每一次成功匹配都使综合数据库增加了新的内容，并朝着问题的解决方向前进了一步。这一过程称为推理，是专家系统中的核心内容。


    #### 4. 框架表示法


    一个框架由若干个称为“槽”的结构组成，每个槽又可以根据需要划分为若干个“侧面”。槽用于描述对象的某一方面的属性，侧面用于描述相应属性的一个方面。槽和侧面的属性值分别称为槽值和侧面值。


    框架表示法具有结构性、继承性、自然性等特点，但也存在效率不高、不能表达结构性知识等缺点，其适合表示由许多相对独立的知识元组成的领域知识、具有经验性和不确定性的知识，也可以表示一系列相对独立的求解问题的操作。


    框架是一种用于描述对象（事物、事件或概念）属性的数据结构。


