    ![](EPUB/images/image_347.jpg)


    3）策略`π`（·）：是学习智能体在特定时间的行为方式，是状态到行为的映射，分为确定性策略和随机策略。


    ![](EPUB/images/image_348.jpg)


    4）奖励`R`（`s`，`a`）：是一个定义强化学习目标的标量，在学习过程中被最大化（最小化）。


    5）价值函数`Q`（`s`，`a`）：价值函数是对于未来累积奖励的预测，用于评估在给定的策略下状态的好坏。


