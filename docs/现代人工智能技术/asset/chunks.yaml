    查准率和查全率是一对矛盾的度量。一般来说，查准率高时，查全率往往偏低；而查全率高时，查准率往往偏低。通常只有在一些简单任务中，才可能使查全率和查准率都很高。


    在很多情形下，我们可根据学习器的预测结果对样例进行排序，排在前面的是学习器认为最可能是正例的样本，排在最后的则是学习器认为最不可能是正例的样本。按此顺序逐个把样本作为正例进行预测，则每次可以计算出当前的查全率、查准率。以查准率为纵轴、查全率为横轴作图，就得到了查准率-查全率曲线，简称*P-R*曲线，显示该曲线的图称为*P-R*图（见图5-13）。


    *P-R*图直观地显示出学习器在样本总体上的查全率、查准率。在进行比较时，若一个学习器的*P-R*曲线被另一个学习器的曲线完全包住，则可断言后者的性能优于前者，例如图5-13中学习器*A*的性能优于学习器*C*；如果两个学习器的*P-R*曲线发生了交叉，例如图5-13中的*A*与*B*，则难以一般性地判断两者孰优孰劣，只能在具体的查准率或查全率条件下进行比较。然而，在很多情形下，人们往往仍希望把学习器*A*与*B*比出个高低。这时一个比较合理的判据是比较*P-R*曲线下面积的大小，它在一定程度上表征了学习器在查准率和查全率上取得相对双高的比例。但这个值不太容易估算，因此，人们设计了一些综合考虑查准率、查全率的性能度量。


