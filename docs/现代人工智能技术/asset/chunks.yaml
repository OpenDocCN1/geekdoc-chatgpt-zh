    ## **5.5 无监督学习**


    ### **5.5.1 基本模型**


    正如前一节中所介绍的，对于有标签的数据，我们进行有监督学习，常见的分类任务就是监督学习；而对于无标签的数据，我们希望发现无标签的数据中的潜在信息，这就是无监督学习。此类学习任务中研究最多、应用最广的是聚类，它的概念是：将相似的对象归到同一个簇中，使得同一个簇内的数据对象的相似性尽可能大，同时不在同一个簇中的数据对象的差异性也尽可能大。即聚类后同一类的数据尽可能聚集到一起，不同类的数据尽量分离。通过对无标记训练样本的学习来揭示数据的内在性质及规律，为进一步的数据分析提供基础。原始数据和分类结果如图5-23所示。


    ![](EPUB/images/image_217.jpg)


    图5-23 原始数据和分类结果


    对聚类结果，我们需通过某种性能度量来评估其好坏。另一方面，若明确了最终将要使用的性能度量，则可直接将其作为聚类过程中的优化目标，从而更好地得到符合要求的聚类结果。聚类结果的簇内相似度高且簇间相似度低。常见的度量指标有两种，外部指标和内部指标。


    外部指标为将聚类结构与某个参考模型进行比较，通常也可以称为有监督情况下的一种度量聚类算法和各参数的指标。值越大表明聚类结果和参考模型（有标签的、人工标准或基于一种理想的聚类的结果）直接的聚类结果越吻合，聚类结果就相对越好。


    常用的聚类性能度量外部指标有Jaccard系数（JC）、FM指数（FMI）、Rand指数（RI）。这些性能度量的结果值均在［0，1］区间。


    内部指标是无监督的，无需基准数据集，不需要借助于外部参考模型，利用样本数据集中样本点与聚类中心之间的距离来衡量聚类结果的优劣。


    通常会考虑紧密度、分割度等，紧密度是指每个聚类簇中的样本点到聚类中心的平均距离，分割度是指每个簇的簇心之间的平均距离。常用的聚类性能度量内部指标有DB指数（简称DBI，DBI值越小越好）、Dunn指数（简称DI，DI值越大越好）。


    以上描述中，多次提及距离。距离度量一般拥有非负性、同一性、对称性、直递性。


