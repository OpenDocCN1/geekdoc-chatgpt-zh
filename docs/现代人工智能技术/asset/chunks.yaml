    2）每个参与者从本地数据集中随机抽取一部分数据，用来训练自己的本地模型。


    3）每个参与者将自己的本地模型或者梯度上传给服务器。


    4）服务器根据某种聚合规则，如加权平均，对所有上传的本地模型或者梯度进行聚合，得到一个更新后的全局模型，并将其发送给所有参与者。


    5）重复步骤2）～4），直到达到预设的收敛条件或者迭代次数。


