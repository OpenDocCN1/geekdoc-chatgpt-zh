    ### 9.2.3 安全多方计算


    #### 1. 安全多方计算的定义


    安全多方计算的目的是构建一个安全协议，这个安全协议能允许多个互不信任的参与者在自己隐私输入上联合计算目标函数，同时确保输出的准确，甚至在面对不诚实行为时，能够保护和管控自己的隐私输入。


    具体来说，安全多方计算由`n`个互不信任的参与方进行，各个参与方分别持有数据`x`，`x`，…，`x[n]`，联合对一个协商确定的函数进行计算：


    ### 12


    ![](EPUB/images/image_553.jpg)


    此时，任意一个参与方只能根据自己的输入数据`x[i]`得到对应的结果`y[i]`，无法获得其他参与方的任何输入或输出信息。


    传统分布式多方计算模型和安全多方计算模型分别如图9-6和图9-7所示。在传统分布式计算模型下，中心节点协调各用户的计算进程，收集各参与方的明文输入信息，各参与方的原始数据对第三方来说毫无秘密可言，很容易造成数据泄露；而在安全多方计算模型下，不需要可信第三方收集所有参与节点的原始明文数据，只需要各参与节点之间相互交换处理后的数据即可，保证其他参与节点无法反推原始明文数据，确保了各参与方数据的私密性。


    #### 2. 安全多方计算的实现


    安全多方计算能够通过多个不同的方法实现。在某种程度上，不同的实现方法都使用了秘密共享的思想，也因此秘密共享被广泛认为是安全多方计算的核心。接下来将会分别介绍不经意传输（`Oblivious
    Transfer`，`OT`）、混淆电路（`Garbled Circuit`，`GC`）、秘密共享（`Secret Sharing`，`SS`）和同态加密（`Homomorphic
    Encryption`，`HE`）四种实现方法。


