    通常情况下，从已知事实推出的结论可能有很多，只要其中有要证明的结论，就说明问题解决了。


    自然演绎推理的优点是表达定理证明过程很自然，容易理解，而且它有很多推理规则，推理过程灵活，可以在它的推理规则中加入领域相关的启发式知识。但它也有一个缺点，就是容易导致组合爆炸，也就是说推理过程中产生的中间结论会呈指数级增长，这对于一个大的推理问题来说是非常不利的。


    ## 3.3 谓词公式化为子句集的方法

    在谓词逻辑中，有这样一些定义：

    原子谓词公式是一个最简单的命题，不能再分成更小的部分。

    原子谓词公式和它的否定，都叫作文字。`P`是一个正文字，表示`P`是真的。﹁`P`是一个负文字，表示﹁`P`是假的。`P`和﹁`P`互相矛盾，叫作互补文字。

    如果把一些文字用或连接起来，就得到一个子句。任何一个文字自己也可以看作一个子句。

    如果把一些子句放在一起，就得到一个子句集。

    一种特殊的子句，里面什么文字都没有，叫作空子句，用`NIL`表示。

    空子句没有任何内容，所以它永远是假的，不能被任何情况满足，叫作不可满足的。

    在谓词逻辑中，可以用一些等价关系和推理规则，把任何一个谓词公式变成一个相应的子句集。这样就可以更容易地判断谓词公式是否不可满足。下面用一个具体的例子，来说明把谓词公式化为子句集的方法。


    ### 例3.2

    将下列谓词公式化为子句集：

    （∀`x`）（（∀`y`）`P`（`x`，`y`））→﹁（∀`y`）（`Q`（`x`，`y`）→`R`（`x`，`y`））


    #### 解

    （1）消去谓词公式中的“→”和“↔”符号

    利用谓词公式的等价关系：

    `P`→`Q`⇔﹁`P`∨`Q`

    `P`↔`Q`⇔（`P`∧`Q`）∨（﹁`P`∧﹁`Q`）

    上例等价变换为

    （∀`x`）（﹁（∀`y`）`P`（`x`，`y`）∨﹁（∀`y`）（﹁`Q`（`x`，`y`）∨`R`（`x`，`y`）））


    （2）把否定符号移到紧靠谓词的位置上

    利用谓词公式的等价关系：

    双重否定律

    ﹁（﹁`P`）⇔`P`

    德摩根律

    ﹁（`P`∧`Q`）⇔﹁`P`∨﹁`Q`

    ﹁（`P`∨`Q`）⇔﹁`P`∧﹁`Q`

    量词转换律

    ﹁（∀`x`）`P`⇔（∃`x`）﹁`P`

    ﹁（∃`x`）`P`⇔（∀`x`）﹁`P`

    上例等价变换为

    （∀`x`）（（∃`y`）﹁`P`（`x`，`y`）∨（∃`y`）（`Q`（`x`，`y`）∧﹁`R`（`x`，`y`）））


    （3）变量标准化

    （∀`x`）`P`（`x`）≡（∀`y`）`P`（`y`）

    （∃`x`）`P`（`x`）≡（∃`y`）`P`（`y`）

    上例等价变换为

    （∀`x`）（（∃`y`）﹁`P`（`x`，`y`）∨（∃`z`）（`Q`（`x`，`z`）∧﹁`R`（`x`，`z`）））


    （4）消去存在量词

    存在量词`y`的Skolem函数记为`y`= `f`（`x`，`x`，…，`x`[n]）

    用Skolem函数代替每个存在量词量化的变量的过程称为Skolem化。

    设`y`和`z`的Skolem函数分别记为`f`（`x`）和`g`（`x`），则替换后得到

    （∀`x`）（﹁`P`（`x`，`f`（`x`））∨（`Q`（`x`，`g`（`x`））∧﹁`R`（`x`，`g`（`x`）））


    （5）化为前束形

    前束形=（前缀）|母式|

    对于上面的例子，因为只有一个全称量词，而且已经位于公式的最左边，所以，这一步不需要做任何工作。


    （6）化为Skolem标准形

    Skolem标准形的一般形式是

    （∀`x`）（∀`x`）…（∀`x`[n]）`M`

    一般利用

    `P`∨（`Q`∧`R`）⇔（`P`∨`Q`）∧（`P`∨`R`）

    对于上面的例子，有

