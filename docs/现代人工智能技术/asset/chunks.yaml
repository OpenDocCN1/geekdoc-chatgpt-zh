    ### 1. DoubleDQN


    ![](img/image_468.jpg)


    使用基本的 DQN 算法通常会导致对`Q`值的估计过高。在基本的 DQN 中，时序差分误差的目标可以转写为。换句话说，最大化操作实际上可以被拆解为两部分：首先选取状态`s′`下的最优动作，再使用目标网络计算该动作的价值。当这两步使用同一个网络进行计算时，每次得到的都是神经网络当前估算的所有动作价值中的最大值。考虑到借助神经网络估计`Q`值会产生一些误差，在上述更新过程中会导致正向误差的累积。这样的误差将会逐步累积。对于动作空间较大的任务，DQN
    中的过高估计问题会非常严重，造成 DQN 无法有效工作的后果。


    ![](img/image_469.jpg)![](img/image_470.jpg)![](img/image_471.jpg)


    为了解决这个问题，DoubleDQN 算法利用两个独立训练的神经网络估算。具体来讲，是将基础的 DQN 中的）修改为，即利用同一套神经网络的输出选取价值最大的动作，但是使用另一套神经网络计算其动作价值。基于这种方法，即使其中一个神经网络的某个动作估计过高，由于另一套神经网络的存在，最终`Q`值的估计过高的问题能够得到有效的缓解。DoubleDQN
