    2）然后，利用隐私集合求交（Private Set Intersection，`PSI`）、联邦信息价值（Federated Information Value，`FIV`）、联邦线性相关系数（Federated
    Linear Correlation Coefficient，`FLCC`）等算法，分别计算数据样本评分、`FIV`评分和`Corr`评分等。


    3）最后，综合上述各种评分，得到联邦数据质量评估结果，并根据结果给予相应的奖励。


    这种方法可以判断参与者对总体数据质量是否有增益作用，并鼓励参与者提供高质量的数据。


    ### 9.3.3 基于模型参数评估


    基于模型参数评估是指利用模型参数更新的大小来衡量每个参与者的数据价值，评估参与者的贡献度。该方法假设模型参数更新的大小与数据集的质量和多样性成正比，因此可以反映参与者对最终模型性能的影响。这种方法的优点是不需要访问参与者的原始数据，保护了数据隐私；也不需要额外的通信开销，节省了资源。缺点是可能存在激励不足或过度激励问题，即某些参与者可能得到低于或高于其真实的贡献度。


    一个基于模型参数评估的例子是：


    1）参数服务器初始化一个全局模型，并将其广播给所有的参与者。


    2）每轮训练中，参数服务器随机选择一部分参与者参与训练，并将全局模型发送给它们。


    3）每个选中的参与者在本地使用自己的数据集训练全局模型，并计算出本地模型与全局模型之间的参数更新量。具体来说，参数更新量的计算如下所示：


    ![](img/image_569.jpg)![](img/image_570.jpg)


    式中，是参与者`i`在第`t+1`轮训练后得到的本地模型参数；`w^t`是第`t`轮训练得到的全局模型参数。


    4）每个选中的参与者将自己的参数更新量上传给参数服务器，并接收相应的奖励。具体来说，奖励的计算如下所示


    ![](img/image_571.jpg)


    式中，`α`是总奖励池大小，为一正常数；`n`是选中的参与者的数量；`‖·‖[2]`是二范数。


    5）参数服务器根据所有选中参与者上传的参数更新量来更新全局模型，并重复步骤 2）～5），直到达到预定条件。具体来说，全局模型的更新如下所示


    ![](img/image_572.jpg)


    ### 9.3.4 基于沙普利值评估


    基于沙普利值评估的方法是一种基于博弈论的方法，它将联邦学习视为一个多方合作博弈问题，并利用沙普利值来评估每个参与者的贡献度。沙普利值是一种衡量一个玩家在一个合作博弈中对总收益的平均边际贡献的指标，它满足了一些公平性和效率性的性质，例如：


    1）效率性：所有玩家的沙普利值之和等于总收益。


    2）对称性：如果两个玩家对任何联盟的贡献相同，则他们的沙普利值也相同。


    3）线性性：如果两个博弈可以叠加，则每个玩家在叠加后的博弈中的沙普利值等于他们在两个博弈中的沙普利值之和。


    4）零玩家性：如果一个玩家对任何联盟的贡献都为零，则他的沙普利值也为零。


    具体来说，对于联邦学习中的一个参与者`i`，其在训练得到的联邦学习模型上的沙普利值可以定义为


    ![](img/image_573.jpg)


    式中，`N`是所有参与者的集合；`n`是参与者数量；`S`是任意子集；`f(S)`是由`S`中参与者提供数据训练得到模型后，在测试集上表现出来的某种指标（例如准确率、损失函数等）。


    一个基于沙普利值评估的例子是：


    1）对于每个参与者`i`，计算其边际贡献`Δfi`，即`i`加入或退出`S`后`f`的变化量。


    2）对于每个参与者`i`，计算其沙普利值`φ[i]`，即`i`在所有可能的参与者子集`S`中的平均边际贡献。


    3）根据每个玩家`i`的沙普利值`φ[i]`，给予相应的奖励或惩罚。


    基于沙普利值评估的方法可以保证公平地分配总收益给每个参与者，并激励更多参与者参与联邦学习。但这种方法也存在一些挑战和局限性，例如：


    1）计算复杂度高：要计算一个参与者`i`的沙普利值，需要遍历所有不包含`i`的子集`S`，并计算`f(S)`、`f(S-i)`、`f(S+i)`的差异。这样就需要`2^n`次模型训练和测试，其中`n`是参与者数量。这显然是不可行的，尤其是当`n`很大时。


    2）需要全局信息：要计算沙普利值，需要知道所有参与者提供数据训练得到模型后，在测试集上表现出来的指标`f(S)`。这需要将所有客户端数据汇总到服务器上进行训练和测试，或者将服务器模型分发给所有客户端进行本地训练和测试。这违背了联邦学习保护数据隐私和减少通信开销等目标。


    ![](img/image_574.jpg)


    3）需要选择合适的指标：要计算沙普利值，需要选择一个能够反映模型好坏程度并且具有可加性\即的指标作为`f(S)`。但实际上，并不是所有指标都满足这一条件，例如准确率就不具有可加性。


    ## 9.4 横向联邦学习


    ### 9.4.1 横向联邦学习的定义


    横向联邦学习是一种按样本划分的联邦学习方法，它适用于不同参与者拥有相同或相似的特征空间，但数据样本不同的场景。特征空间指的是数据集中所有样本共有的属性或特征，如年龄、性别、收入等；样本空间指的是数据集中所有样本的集合，如银行客户、医疗病人等。


    横向联邦学习的本质在某种程度上就是样本的联合，以达到提高模型训练和预测效果的目的。例如，两家不同地区的银行可以通过横向联邦学习，使用各自的客户数据共同构建一个用户模型，从而优化他们的风控模型和营销策略等。


    更具体地，利用在 9.1.3 节所定义的特征空间`X`、标签空间`Y`和样本 ID 空间`I`，可以把横向联邦学习适用的场景描述为


    ![


    式中，`D[i]`和`D[j]`分别表示联邦学习参与者`i`和`j`所持有的数据集。


    通常来说，在针对横向联邦学习系统中的安全性进行讨论时，往往会假设参与该横向联邦学习系统的每一个参与者都是诚实的，而中央服务器是诚实但好奇的。也就是说，我们通常假设横向联邦学习的参与者是安全可靠的，只有中央服务器才存在泄露各参与者隐私的风险。


    ### 9.4.2 横向联邦学习架构


    #### 1. 中心化联邦（客户端/服务器）架构


    横向联邦学习典型的中心化联邦（客户端/服务器）架构如图 9-10 所示。在这种架构中，有一个中央服务器（也被称为聚合服务器或参数服务器）负责模型的聚合和分发，多个参与者负责利用本地数据训练模型并上传梯度或参数，协作得到最终的模型。该种架构下的横向联邦学习通常步骤如下：


    ![](img/image_576.jpg)


    图 9-10 横向联邦学习典型的中心化联邦（客户端/服务器）架构


    1）中央服务器初始化一个全局模型，并将其发送给所有参与者。


    2）每个参与者从本地数据集中随机抽取一部分数据，用来训练自己的本地模型。


    3）每个参与者将自己的本地模型或者梯度上传给服务器。


    4）服务器根据某种聚合规则，如加权平均，对所有上传的本地模型或者梯度进行聚合，得到一个更新后的全局模型，并将其发送给所有参与者。


    5）重复步骤 2）～4），直到达到预设的收敛条件或者迭代次数。


    ![](img/image_577.jpg)


    具体来说，假设共有`N`个参与者，每个参与者`i`拥有`m[i]`个样本，即。假设全局模型参数为`θ`，损失函数为`L(θ)`，则横向联邦学习的目标是最小化全局损失函数：


    ![](img/image_578.jpg)![](img/image_579.jpg)


    式中，是总样本数；`Li`是第`i`个参与者的本地损失函数：


    ![](img/image_580.jpg)


    式中，`l(x, y; θ)`是单个样本（`x`, `y`）在参数`θ`下的损失。


    在每次迭代中，服务器将当前全局参数`θ`发送给所有参与者。每个参与者`i`利用自己的数据集和某种优化算法（如随机梯度下降）更新自己的本地参数 `θ`：


    ![](img/image_582.jpg)


    然后每个参与方将自己的本地参数或者梯度上传给服务器。服务器根据某种聚合规则（如加权平均），计算出更新后的全局参数`θ`：


    ![](img/image_583.jpg)


    这样就完成了一次迭代。重复这个过程直到收敛或者达到最大迭代次数，即完成了横向联邦学习。


    #### 2. 去中心化联邦（对等计算）架构


    横向联邦学习典型的去中心化联邦（对等计算）架构如图 9-11 所示。在这种架构中，每个参与者都是对等的，没有中心化的服务器或者聚合器，各参与者彼此直接通信协作，完成联邦学习过程，得到最终的模型。该种架构下的横向联邦学习通常步骤如下：


    ![](img/image_584.jpg)


    图 9-11 横向联邦学习典型的去中心化联邦（对等计算）架构


    1）各参与者在本地计算各自模型梯度，并使用加密技术，对梯度信息进行掩饰，并将掩饰后的结果（简称为加密梯度）发送给一个随机选定的邻居参与者。


    2）每个参与者收到邻居参与者的加密梯度后，进行安全聚合操作（如使用基于同态加密的加权平均），并将聚合后的结果发送给另一个随机选定的邻居参与者。


    3）重复步骤 2），直到每个参与者都收到所有其他参与者的聚合结果。


    4）每个参与者对收到的聚合结果进行解密，并使用解密后的梯度结果更新各自的模型参数。


    5）重复步骤 1）～4），直到达到预设的收敛条件或者达到允许的迭代次数或允许的训练时间。


    具体来说，假设共有`N`个参与者，每个参与者`i`有一个本地数据集`D[i]`，共同训练一个机器学习模型`f(w)`，其中`w`是模型参数。


    ![](img/image_585.jpg)![](img/image_586.jpg)![](img/image_587.jpg)


    在第`t`轮迭代中，每个参与者`i`计算本地梯度，并使用加密技术`E[i]`将其加密为，随机选择一个邻居参与者`j`，并将加密梯度发送给`j`。


    ![](img/image_588.jpg)![](img/image_589.jpg)![](img/image_590.jpg)


    每个参与者`j`收到邻居参与者`i`的加密梯度后，进行安全聚合操作，，并将聚合结果发送给另一个随即选定的邻居参与者`k`。


    ![](img/image_591.jpg)![](img/image_592.jpg)![](img/image_593.jpg)


    重复上述步骤，直到每个参与者`i`都收到所有其他参与者的聚合结果，…，。对收到的聚合结果进行解密，并使用解密后的梯度结果更新本地模型的参数：


    ![](img/image_594.jpg)


    式中，`α`是学习率。


    这样就完成了一次迭代。重复这个过程直到收敛或者达到最大迭代次数或者允许的训练时间，即完成了横向联邦学习。


    ### 9.4.3 联邦平均算法


    联邦学习中隐含的优化问题被称为联邦优化，同典型的分布式优化相比，联邦优化有如下几个关键性质：


    1）非独立同分布：对于联邦学习的参与者来说，不同参与者拥有的数据分布可能完全不同，对数据集进行独立同分布的假设是不合理的。任何一个参与者所有的局部数据都不能代表总体数据的分布。


    2）不平衡性：在联邦学习的实际应用场景中，不同的参与者所拥有的数据集的规模也是不一样的。这就导致了在联邦学习过程里，不同的参与者训练本地模型所使用的数据集规模是不平衡的。


    3）广泛分布：一般而言，需要使用大量的数据进行训练才能得到一个符合预期的机器学习模型。而对于联邦学习来说，这就意味着很可能需要有许多参与者加入其中进行训练，特别是使用移动设备数据进行的联邦学习任务。因此，联邦学习的实际应用场景有着参与者数量多、分散程度大、广泛分布的特点。


    4）通信限制：在联邦学习的实际应用场景中，参与者与参与者、参与者与服务器之间的通信往往只能依赖不那么可靠的无线网络，特别是在使用移动设备数据进行的联邦学习任务中，往往还面临着设备经常离线、连接速度慢、通信成本高等挑战。


    为了应对联邦优化中的种种挑战，Google 在 2017 年发表的论文《Communication-Efficient Learning of Deep Networks
    from Decentralized Data》


    联邦平均算法适用于所有目标函数关于有限个样本误差累加形式的函数：


    ![](img/image_595.jpg)


    式中，`n`是样本数量；`w ∈ ℝ^d`是`d`维的模型参数；`l(x[i], y[i]; w)`是模型在参数`w`上对样本（`x[i]`, `y[i]`）进行预测的损失。


    在联邦学习场景下，假设有`K`个参与者参与训练过程，`P[k]`是第`k`个参与者所有的训练样本集，`n[k]=|P[k]|`是第`k`个参与者所有样本的数量，式（9-22）可以改写为


    ![](img/image_596.jpg)


    随机梯度下降（Stochastic Gradient Descent，`SGD`）是众多深度学习成功应用的关键优化算法。联邦平均算法的核心思想同样也是使用`SGD`方法来更新模型参数，即


