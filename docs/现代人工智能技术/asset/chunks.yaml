    **3. 梯度下降法**


    均方误差使用了常用的欧氏距离，就是试图找到一条直线，使得所有样本到该直线的欧式距离之和最小。求解*w*和*b*的过程称为参数估计，最常用的是使用梯度下降法。


    梯度下降法是机器学习中一种常用到的算法，但其本身不是机器学习算法，而是一种求解的最优化算法。主要解决求最小值问题，其基本思想在于不断地逼近最优点，每一步的优化方向就是梯度的方向。利用梯度的反向传播，反复更新模型参数直至收敛，从而达到优化模型的目的。


    接下来先来看损失函数只有*w*和*b*两个参数时的情况。其所在的平面像一个山谷，梯度下降法就是从一点开始，寻找每个向下走的方向，然后一步一步地沿着下坡的方向一直走到谷底。每走一步，则更新一次*w*和*b*。


    ![](EPUB/images/image_158.jpg)


    式中，*α*称为学习率，学习率是使用损失函数的梯度调整网络权重的超参数。可以形象地理解为每走一步的长度的参数，一般在0.1～0.01。每一步的长度为学习率乘以当前该方向上的梯度。


    梯度越大，也就是坡度越大时，一般是离最优点很远的时候，步长越大；梯度很小的时候，也就是坡度很缓的时候，一般情况下就是接近最优点的时候，步长越小。


    如果学习率过大，可能会使损失函数直接越过全局最优点，此时表现为loss值过大。


    如果学习率过小，损失函数的变化速度很慢，会大大增加网络的收敛复杂度，并且很容易被困在局部最小值或者鞍点。学习率过大和过小示意图如图5-17所示。


