  trans: '


    即便是如此的蓬勃发展，人工智能依然与其他新兴学科一样，道路并非一帆风顺。20 世纪 70 年代，人工智能进入了一段痛苦而艰难的岁月。由于科研人员在人工智能的研究中对项目难度预估不足，导致美国国防高级研究计划以失败告终，让大家对人工智能的发展前景十分担忧。与此同时，社会舆论也开始对人工智能的研究施压，导致很多研究项目被叫停。在当时，人工智能的研究所面临的技术瓶颈主要有三个方面。第一，计算机性能不足，导致早期很多程序无法应用到人工智能领域。第二，问题的复杂度，早期人工智能程序主要是解决特定的问题，这些特定的问题对象较少，复杂性较低，可一旦问题上升维度，程序立马就不堪重负，甚至无法运行。第三，数据量严重缺失，深度学习需要极大数据量的支撑，在没有容量够大的数据库时，就会导致机器无法智能化。因此，人工智能项目停滞不前。1973
    年莱特希尔针对英国人工智能研究状况的报告中指出了人工智能在实现“伟大目标”上的失败。由此，人工智能在之后的六年内无人问津。


    经历过如此长时间的低谷期后，研究者们认真反思，总结研究时的经验教训，在 1980 年，卡内基梅隆大学为数字设备公司设计了一套名为`XCON`的“专家系统”。这是一种应用人工智能程序的系统，可以简单地理解为“`知识库+推理机`”的组合，`XCON`是一套具有完整专业知识和经验的计算机智能系统。


    自 20 世纪 90 年代中期开始，随着人工智能技术尤其是神经网络技术的逐步发展，以及人们开始对人工智能抱有客观理性的认知，人工智能技术进入了平稳发展时期。在
    1997 年，IBM 的计算机系统“`深蓝`”战胜了国际象棋世界冠军卡斯帕罗夫，又一次在公众领域引发了现象级的人工智能话题讨论，这是人工智能发展的一个重要里程碑。2006
    年，辛顿在神经网络的深度学习领域取得突破，人类又一次看到机器赶超人类的希望，也是标志性的技术进步。2016 年，Google 公司的`AlphaGo`战胜了韩国围棋选手李世石，再度引发人工智能热潮。围棋这一人类赖以自豪的最后堡垒，最终被计算机所攻破。


    ## 1.3 人工智能的基本原理及方法


    ### 1.3.1 知识表示

    知识表示是指用一定的方式将知识客体中的知识要素和知识关系表达出来，使人们能够识别和理解知识。知识表示是知识组织的前提和基础，任何知识组织方法都要依赖于知识表示的形式。不同的国家和民族都有自己独特的语言和文字。这是他们之间交流的媒介和工具，也是人类文明进步和社会发展的重要推动力。人类语言和文字虽然是一种优秀的知识表示方式，但对于计算机来说，这种方式很难处理，不适合用于计算机。


    人工智能研究的目标是要建立一个能够模拟人类智能行为并且能够自我思考的机器系统，但是智能行为是建立在知识水平之上的，也就是说人工智能要具备一定的知识水平才能模拟人类智能行为，因此知识表示的方法是研究的重点内容。


    知识表示方法是研究如何用机器表达知识的一门学科。要探索有效的知识表示方法，就需要对知识本身有深入的理解。然而，目前人类对自己的知识结构还没有清晰的认识，因此关于知识表示的完整理论还没有形成。尽管如此，在人工智能系统的研究中，人们根据实际需求提出了一些常用的知识表示方法，例如逻辑表示法、产生式表示法、框架表示法和连接机制表示法等。


    总体来看，知识表示的方法可分为两大类：符号表示法和连接机制表示法。


    符号表示法是一种用具有明确含义的符号来组合和表达知识的方法。它适合于表达逻辑性知识，本书第 2 章将详细介绍这类方法的各种形式。目前常用的符号表示法有很多种，例如一阶谓词逻辑表示法、产生式表示法、框架表示法、语义网络表示法、状态空间表示法、神经网络表示法、脚本表示法、过程表示法、Petri
    网络表示法和面向对象表示法等。


    连接机制表示法是一种用神经网络来组合和传递知识的方法。它将不同类型和顺序的物理对象通过各种连接方式组成一个网络，并在网络中处理含有特定意义的信息，从而构建相关概念和知识。与符号表示法相比，连接机制表示法是一种隐式的知识表达方式。它不像产生式系统那样用若干条规则来表示知识，而是用一个网络来综合地表示某个问题的多方面知识。因此，它特别适合于表达形象化的知识。


    ### 1.3.2 机器感知

    机器感知是指让机器（计算机）具备类似人类的感知能力，主要包括机器视觉和机器听觉两个方面。机器视觉是指让机器能够识别和理解文字、图像、物体等视觉信息；机器听觉是指让机器能够识别和理解语言、声音等听觉信息。


    机器感知是实现机器智能化的重要途径，它为机器提供了获取外部信息的基本手段。与人类智能无法缺少感知类似，为了让机器具有感知能力，就需要为它配置相应的传感器。因此，在人工智能领域中，已经形成了模式识别和自然语言理解两个专门的研究方向。


    ### 1.3.3 机器思维

    机器思维是指让机器（计算机）能够学习人类的思考方式，对它感知到的信息和它自己的行为进行有目的的处理。机器思维是实现机器智能化的核心，它让机器能够模仿人类的逻辑思维和形象思维。因此，在人工智能这个领域里，需要探索怎么让机器既能按照规则和逻辑去解决问题，又能用形象和创造力去发现新知识。


    ### 1.3.4 机器学习

    知识是智能的根本，要让计算机变聪明，就要让它有知识。人们可以把知识总结、整理好，然后用计算机能理解、处理的方式输入给计算机，让计算机有知识。但是，这样做不能让知识及时更新，也不能让计算机适应环境的变化。要让计算机真正变聪明，就要让它像人一样，能学习新的知识、技能，并在实践中不断改进、完善自己。


    机器学习就是让计算机能像人一样学习，让它能自己从学习中得到知识。计算机可以从书本上学习，可以和人聊天学习，也可以通过环境进行学习，并且在实践的时候不断改进、完善自己。


    机器学习是一个复杂而深刻的研究领域，它与脑科学、神经心理学、机器视觉、机器听觉等多个学科有着紧密的联系，需要这些学科的协同发展。因此，尽管近年来机器学习研究已经取得了显著的进展，提出了许多有效的学习方法，特别是深度学习的研究取得了突破性的进步，但仍未从根本上解决智能问题。


    ## 1.4 人工智能的主要研究及应用领域


    现在，智能与科技迅速发展，网络也越来越普及，人工智能就像一个神奇的工具，可以用在很多地方。下面简要介绍一些人工智能的主要研究以及应用领域。


    ### 1.4.1 自动定理证明

    自动定理证明是用机器来帮助证明数学或逻辑中的一些结论是否正确。这是人工智能一个很重要的研究方向，也是让机器自我推理的关键技术。


    自动定理证明的做法是把要证明的结论写成一种逻辑语言，然后让机器按照一些规则和步骤来找到证明或者反驳。


    自动定理证明有两种主要方法：一种是完全交给机器去做，用到了`SAT`、`SMT`、一阶定理证明等算法；另一种是需要人和机器合作，人来提供一些提示和指导。


    自动定理证明在很多领域都有用处，比如数学、计算机科学、软件工程、形式化方法等。它可以帮人们发现新的数学结论，检查已经证过的结论是否有错，保证程序和系统能正常和安全地运行等。


    自动定理证明是人工智能里最早研究并成功应用的一个方向，也是推动人工智能发展的一个重要力量。其实，不光是数学里面的结论，像医疗诊断、信息检索、问题求解等很多其他领域的问题，也可以变成定理证明问题。


    定理证明就是要证明从前提`P`出发能得到结论`Q`。但是，这样直接证明一般很难。常用的方法是反证。在这方面，海伯伦和鲁滨逊两位学者都做了很有价值的研究，提出了相应的理论和方法，为自动定理证明打下了理论基础。特别是鲁滨逊提出的归结原理让定理证明能在机器上实现，对机器推理有了重大贡献。我国吴文俊院士提出并实现的“吴氏方法”，可以让计算机证明几何定理，是机器定理证明领域的一项里程碑式成果。


    ### 1.4.2 博弈

    像下棋、打牌﹑战争这些需要智力竞争的活动叫作博弈。下棋是一个比拼智慧的过程，不光要求参赛者有很好的记忆力、很多的下棋经验，而且要求其有很强的思维力，能对随机变化的情况快速地做出反应，及时采取有效的措施。对人类来说，博弈是一种考验智能的竞争活动。


    人工智能研究博弈不是为了让计算机和人玩下棋﹑打牌这些游戏，而是为了通过博弈来测试人工智能技术能不能模仿人类的智慧，达到推动人工智能技术的进步的目的。就像俄罗斯的人工智能学者亚历山大·克朗罗德说的“象棋在人工智能里就像果蝇一样”，把象棋在人工智能里的作用比作果蝇在生物遗传里当实验对象的作用。


    ### 1.4.3 模式识别

    模式识别是一门学习怎样对对象进行描述和分类的学科。这些需要被识别并分析的模式对象可以是信号、图像或者数据。


    模式是对一个物体或者其他感兴趣的实体结构的描述，而模式类是指有些共同特征的模式的集合。用机器来识别模式的主要内容是研究一种自动技术，依靠这种技术，机器可以自己或者尽量少用人工来把模式放到它们对应的模式类里去。


    传统的识别模式有统计识别和结构识别等类型。近年来发展很快的模糊数学和人工神经网络技术也用到了模式识别里，形成了模糊识别﹑神经网络识别等方法，彰显了很大的发展可能。


    ### 1.4.4 机器视觉

    机器视觉是识别研究的一个重要方面，它可以分为低层视觉和高层视觉两大类。低层视觉主要负责图像的预处理功能，例如边缘检测、移动目标检测、纹理分析等，以及立体造型、曲面色彩等方面的处理。其主要目的是突出图像中的对象特征，为后续的理解阶段做好准备。高层视觉则主要涉及图像的理解功能，需要运用与对象相关的知识进行分析和判断。机器视觉目前的前沿课题包括：实时图像的并行处理，实时图像的压缩、传输与复原，三维景物的建模识别，动态和时变视觉等。


    机器视觉系统是一种利用图像处理技术实现目标识别和控制的系统。它通过图像摄取装置将目标转换成图像信号，并传送给专用的图像处理系统。图像处理系统根据像素分布、宽度、颜色等信息，将图像信号转换成数字信号，并进行各种运算，提取出目标的特征信息。然后根据判别结果来控制现场设备的动作。机器视觉的主要研究目标是使计算机能够通过二维图像感知三维环境中物体的几何信息，例如形状、位置、姿态、运动等。


    机器视觉与模式识别是两个有着密切联系但又有所区别的领域。机器视觉更侧重于处理三维视觉信息，例如物体的形状、位置、姿态、运动等；而模式识别则主要关注模式的类别，例如图像、声音、文字等。此外，模式识别还涵盖了非视觉信息的处理，例如听觉、语言、生物等。


    机器视觉在国外已经得到了广泛的应用，主要涉及电子、汽车、冶金、食品饮料、零配件装配及制造等行业。机器视觉系统在质量检测方面发挥了重要的作用。而在国内，机器视觉产品还处于起步阶段，目前主要应用于制药、印刷、包装、食品饮料等行业。但随着国内制造业的快速发展和对产品检测和质量的要求不断提高，各行各业对图像和机器视觉技术的工业自动化需求将越来越大。因此，机器视觉在未来制造业中将拥有很大的发展空间。


    ### 1.4.5 自然语言理解

    计算机是人类伟大的发明之一，但是人们使用计算机时，往往需要通过高级语言（如`C`、`C++`、`Java`等）编写程序来告诉计算机“做什么”和“怎么做”。这种方式不仅不便捷，而且限制了计算机应用的广泛性和普及性。如果计算机能够“听懂”和“看懂”人类语言（如汉语、英语等），那么计算机就能拥有更多的用途，尤其是在机器人技术方面取得更大的进步。自然语言理解（`Natural
    Language Understanding`）就是研究如何让计算机理解人类自然语言的一个重要领域，它属于人工智能的范畴。它旨在实现人与计算机之间用自然语言进行通信的理论与方法。具体地说，它要达到以下三个目标：


    1）计算机能正确理解人们用自然语言输入的信息，并能正确回答输入信息中的有关问题。


    2）计算机能根据输入的自然语言信息生成相应的摘要，并能用不同词语复述输入信息的内容。


    3）计算机能将用某一种自然语言表示的信息自动翻译为用另一种自然语言表示的相同信息。


    自然语言理解的研究起源于 20 世纪 50 年代初期。那时，随着通用计算机的诞生，人们开始探索用计算机实现一种语言到另一种语言的翻译的可能性。在接下来的十多年里，机器翻译成为自然语言理解中最主要的研究课题。最初，人们主要采用“词对词”的翻译方法，认为只要通过“查词典”和简单的“语法分析”，就能完成翻译任务。也就是说，对于一篇需要翻译的文章，先通过查词典找出两种语言之间的对应词，然后经过简单的语法分析调整词序，就能得到翻译结果。基于这种认识，人们把主要精力投入在计算机内建立不同语言对应关系的词典上。但是这种方法并没有达到预期的效果，反而造成了一些令人啼笑皆非、颠倒黑白的笑话。


    从 20 世纪 70 年代开始，自然语言理解领域出现了一些新的突破。这些系统采用了语法-语义分析技术，能够对语言进行更深入和更难度的分析。其中比较有名的系统有三个：`SHRDLU`、`LUNAR`和`MARGIE`。`SHRDLU`是一个模拟机器人手臂在“积木世界”中操作玩具积木的系统。用户可以用英语和它对话，让它做一些简单的动作，比如拿起或放下某个积木。`LUNAR`是一个帮助地质学家查询月球岩石和土壤样本数据的系统。它是第一个能够用普通英语和计算机交流的人机接口系统。`MARGIE`是一个基于概念依赖理论的心理学模型，旨在研究自然语言理解的过程。


    20 世纪 80 年代以后，人们开始更加重视知识在自然语言理解中的作用。1990 年 8 月，在赫尔辛基举行的第 13 届国际计算机语言学大会上，首次提出了处理大规模真实文本的战略目标，并举办了一系列专题讲座。这些讲座涉及“大型语料库在建造自然语言系统中的作用”“词典知识的获取与表示”等方面，标志着语言信息处理进入了一个新时期。


    语料库语言学是近 10 年来自然语言理解研究中的一个显著现象。它主张从大规模语料库中获取语言学知识，认为这是实现对语言真正理解的必要条件。目前，基于语料库的自然语言理解方法还在探索阶段，尚不成熟，但无疑它是一个目前值得关注的研究方向。


    ### 1.4.6 智能信息检索

    数据库系统是用于存储海量信息的计算机系统。随着计算机应用不断发展，信息量也日益增长，因此，智能信息检索系统成为一个具有重要理论意义和实际价值的研究方向。


    智能信息检索系统应该具备以下几个功能：第一，能够理解自然语言，让用户可以用自然语言来提出检索需求或者提问；第二，具有推理能力，可以根据数据库中存储的事实来推导出用户需要或者询问的答案；第三，拥有一定的常识性知识，可以利用这些常识性知识和专业知识来演绎出专业知识中未涉及的答案。比如说，在某单位人事档案数据库中，有这样两条事实：“张强是采购部工作人员”“李明是采购部经理”。如果系统掌握了“部门经理是该部门工作人员的领导”的常识性知识，那么它就可以通过演绎推理回答“谁是张强的领导”的问题，并给出正确答案“李明”。


    ### 1.4.7 数据挖掘

    计算机网络发展得越来越快，计算机处理的信息量也随之增加。然而，数据库中存储着许多没有被有效利用的信息，这不仅造成了资源浪费，还导致了数据垃圾堆积。为此，人们开始尝试从数据库中挖掘出新的知识。数据挖掘和知识发现就是涌现出的两种方法。数据挖掘就是从大量数据中提取出有价值或者有意义的信息或者模式；知识发现就是将这些信息或者模式转化为可理解或者可应用的知识。这两个概念都属于
    20 世纪 90 年代初期兴起并日益活跃的一个研究领域。


    人们可以用知识发现系统来从数据库中找出新的知识。这个系统会用各种学习方法，自动地分析数据库里面很多没有处理过的数据。它会从这些数据里面筛选出有规律性和意义性的信息，比如客户购买行为、市场趋势、疾病预防等。这样，就能看到这些数据之间有什么联系和规律，也就能得到新的知识。知识发现就是整个从数据库中找出新知识的过程。而数据挖掘只是其中一个重要的环节，就是用数学或者统计方法来提取信息。


    数据挖掘就是从数据库里发现有用的模式，也就是一些能够表示知识的规则、聚类、决策树或依赖网络等。一般来说，数据挖掘要经过四个步骤，即数据预处理、建模、模型评估和模型应用。在数据预处理阶段，要了解数据的特点，选择合适的属性，把连续属性分成几个区间，处理数据中的噪声和缺失值，选择有效的实例等。在建模阶段，要选择合适的学习算法，并确定算法的参数。在模型评估阶段，要用训练集和测试集来检验模型的性能，并对模型进行评价。如果得到了满意的模型，就可以用它来解释新数据。


    知识获取是人工智能领域一个很重要的问题。因此，在人工智能研究中，知识发现和数据挖掘也就成了一个热门话题。


    ### 1.4.8 专家系统

    专家系统是人工智能领域中最活跃和最有效的研究方向之一。自从费根鲍姆等人开发出了第一个专家系统`DENDRAL`后，它就迅速发展起来，并在医疗诊断、地质勘探、石油化工、教学和军事等多个领域得到了广泛应用，带来了巨大的社会效益和经济效益。


    专家系统是一种智能的计算机程序，它利用知识和推理步骤来解决只有专家才能解决的难题。因此，可以这样定义它：专家系统是一种拥有特定领域内大量知识和经验的程序系统，它运用人工智能技术模拟人类专家解决问题的思维过程来解决领域内的各种问题，并且其水平可以达到或者超过人类专家的水平。


    ### 1.4.9 机器人

    机器人是一种能够模仿人类或其他生物的行为和思维的电子机械装置。它可以利用人工智能的各种技术来感知、分析、判断和控制环境状态，也可以长时间持续工作、精确执行任务、抵抗恶劣条件。因此，它既是人工智能理论、方法、技术的实验平台，又是推动人工智能研究发展的重要动力。


    自从 20 世纪 60 年代初出现了尤尼梅特和沃莎特兰这两种机器人以来，机器人技术已经经历了三代的演进。从最初的低级机器人，只能按照预设程序执行简单动作；到第二代的中级机器人，具有一定的感知和反馈能力，可以适应不同环境；再到第三代的高级机器人，拥有更强大的智能和自主性，可以模拟复杂行为和情感。


    #### 程序控制机器人（第一代）

    程序控制机器人是指按照事先设定的程序逐步动作的机器人。它们的程序有两种生成和装入方式。一种是由人根据工作流程编写程序并输入机器人的存储器中；另一种是“示教-再现”方式，即由人引导机器人执行操作，让机器人学习应该做的工作，并将每个动作记录为一条指令，然后通过执行这些指令来重复同样的工作。如果任务或环境发生变化，就需要重新设计程序。这一代机器人能够成功地模拟人的运动功能，它们可以拿取、安放、拆卸、安装、翻转和抖动物品，可以看管机床、熔炉、焊机、生产线等设备，可以从事安装、搬运、包装、机械加工等工作。目前，市场上大多数商品化和实用化的机器人都属于这一类。这一代机器人的最大缺点是它们只能刻板地完成程序规定的动作，不能适应发生变化的情况。例如，如果装配线上的物品略有倾斜，就会出现问题。更严重的是它们会对现场的人员造成危害，因为它们没有感觉功能，有时会出现伤人甚至致命的事故。日本就曾经发生过一起机器人将现场工人抓起来塞到刀具下面致死的惨剧。

