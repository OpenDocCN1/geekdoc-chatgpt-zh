    ## 3.4 鲁滨逊归结原理

    经过分析，谓词公式的不可满足性分析可以转化为子句集中子句的不可满足性分析。1965 年，鲁滨逊提出了归结原理，为机器定理证明开辟了新的途径。


    ### 1. 命题逻辑中的归结原理

    **定义 3.1** 设`C`和`C`是子句集中的任意两个子句，如果`C`中的文字`L`和`C`中的文字`L`互补，那么从`C`和`C`中分别消去`L`和`L`，并将两个子句中剩余的部分析取，构成一个新子句`C`，这一过程称为归结。`C`称为`C`和`C`的归结式，`C`和`C`称为`C`的亲本子句。


    例如，在子句集中取两个子句`C`= `P`，`C`=﹁`P`，可见，`C`与`C`中的文字是互补的，则通过归结可得归结式`C`= `NIL`。


    又如，设`C`=﹁`P`∨`Q`∨`R`，`C`=﹁`Q`∨`S`，通过归结可得归结式`C`=﹁`P`∨`R`∨`S`。


    **定理 3.2** 归结式`C`是其亲本子句`C`与`C`的逻辑结论。即如果`C`与`C`为真，则`C`为真。


