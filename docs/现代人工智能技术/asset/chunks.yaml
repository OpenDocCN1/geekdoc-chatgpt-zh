- raw: '模式定理：低阶、短定义和平均适应度高于种群平均适应度的模型的后代呈指数增长。模式定理保证了更好的模式（遗传算法的最优解）的指数增长，为解释遗传算法的机理提供了数学基础。


    积木块假设：根据遗传算法的定义是指将短距离、低阶和具有极高平均适应度的模型（构建块），在遗传操作下相互结合，最终接近全局最优解。


    模式定理保证了更好的指数增长样本，从而存在寻找全局最优的遗传算法；并指出积木块假设在遗传算子的作用下，可以生成全局最优解。


    显然，如果种群规模越大则我们可以进行的遗传操作就会更多，可产生更多的基因型，从而可以找到更优质的解的可能性也就大大提高了。若种群规模小，那么我们在迭代过程中生成的基因型就会受限，优化可能会停止在未成熟的阶段，这样就会使算法陷入局部最优解之中，所以必须保持种群基因的多样性，这样才能在交叉中出现更多的可能性，才有更大的出现最优解的可能性。


    另外，种群规模过大也会带来一系列问题。如果基因型种类过于繁多，而交叉后又会出现更多的基因型，那么虽然说出现最优解的可能性也大大增加了，但是要在如此多的个体里面去找最优质的个体是一项非常复杂的工作，这就造成了遗传操作过于复杂，影响算法效率。此外，种群中的个体生存下来的概率大多采用和适应度成比例的方法，当种群个体非常多时，少量适应度很高的个体会被选择而生存下来，但是大多数适应度小的个体会被淘汰，这会影响基因库的多样性，从而影响交叉操作。


    种群规模一般取20～100。


    ### **4.2.6 适应度函数**


    遗传算法遵循的是自然界的优胜劣汰、适者生存的法则，在进化搜索中几乎不需要外部信息，每个个体的适应度值就代表了它可以存在的概率，从而称为遗传操作的依据。适应度是评价基因型优劣的依据，若适应度高，基因型被选择的概率就高，若适应度低的话，基因型被淘汰的概率也会大大增加。适应度函数是用来表达种群当中基因型优劣好坏的标准，是用来驱动算法演化的，是自然选择的唯一依据。改变群体内部的结构一般是通过改变适应度的值来控制的，因此适应度函数对于优化过程的重要性是不可否认的。


    在实际应用当中，适应度函数还是要根据问题的实际情况去设计。一般情况下，问题的目标函数经过变换可以获得适应度函数。下面将讨论如何将目标函数变换为适应度函数。


    **1. 将目标函数映射成为适应度函数**


    最直观的方法就是将所要求解的目标函数直接当作适应度函数。


    若是目标函数最大化问题，则适应度函数可取为


    ![](EPUB/images/image_029.jpg)


    若是目标函数最小化问题，则适应度函数可取为


    ![](EPUB/images/image_030.jpg)


    **2. 适应度函数的尺度变换**


    在遗传算法中，局部收敛和选择操作存在矛盾。没有选择操作的遗传算法运行性能差；而选择操作又容易使遗传算法得到局部最优解。为了解决两者之间的矛盾，提出了适应度尺度变换方法，通过不同的适应度评价标准来影响选择操作。因此，适应度尺度变换对于防止优化过程中过早收敛、陷入局部最优解，能产生明显的效果。


    在遗传算法中，将所有妨碍适应度值高的个体的产生，继而影响优化过程中遗传操作的问题称为欺骗问题。


    在遗传操作过程中，所选择的种群的基因型数目可能只有几十或者几百个，这与实际当中的情况可能相差很大，这就需要在交叉过程中去调节个体的数量。在遗传算法初期运行中，为了维护种群基因的多样性，可以降低种群个体的适应度差异程度；在算法运行后期，为了保证优质的基因型遗传下去，要提高个体之间的适应度差异程度。针对以上需求，我们提出了线性尺度变换、乘幂尺度变换和指数尺度变换。


    （1）线性尺度变换


