- raw: '否定前件是指，在已知*P*→*Q*为真的情况下，通过否定*P*为假来推出*Q*为假。这也是不合逻辑的。


    例如，下面的推理就使用了否定前件的推理，违反了逻辑规则：


    1）如果下雨，那么地上是湿的。


    2）没有下雨（否定前件）。


    3）所以，地上不湿。


    这显然是不正确的。因为即使没有下雨，地上也可能因为其他原因而湿。事实上，只要仔细分析蕴涵*P*→*Q*的定义，就会发现当*P*→*Q*为真时，肯定后件或否定前件所得的结论都不能确定，可能为真也可能为假。


    下面举例说明自然演绎推理方法。


    **例3.1** 设已知如下事实：


    1）凡是容易的课程小张（Zhang）都喜欢。


    2）*A*班的课程都是容易的。


    3）C++是*A*班的一门课程。


    求证：小张喜欢C++这门课程。


    **证明** 首先定义谓词：


    EASY（*x*）：*x*是容易的；


    LIKE（*x*，*y*）：*x*喜欢*y*；


    *A*（*x*）：*x*是*A*班的一门课程。


    把上述已知事实及待求证的问题用谓词公式表示出来：


    ![](EPUB/images/image_018.jpg)


    应用推理规则进行推理：


    因为


    （∀*x*）（EASY（*x*）→LIKE（Zhang，*x*））


    所以由全称固化得


    EASY（*z*）→LIKE（Zhang，*z*）


    因为


    （∀*x*）（*A*（*x*）→EASY（*x*））


    所以由全称固化得


    *A*（*y*）→EASY（*y*）


    由*P*规则及假言推理得


    *A*（C++），*A*（*y*）→EASY（*y*）⇒EASY（C++）


    EASY（C++），EASY（*z*）→LIKE（Zhang，*z*）


    由*T*规则及假言推理得


    LIKE（Zhang，C++）


    即小张喜欢C++这门课程。


    通常情况下，从已知事实推出的结论可能有很多，只要其中有要证明的结论，就说明问题解决了。


    自然演绎推理的优点是表达定理证明过程很自然，容易理解，而且它有很多推理规则，推理过程灵活，可以在它的推理规则中加入领域相关的启发式知识。但它也有一个缺点，就是容易导致组合爆炸，也就是说推理过程中产生的中间结论会呈指数级增长，这对于一个大的推理问题来说是非常不利的。


    ## **3.3 谓词公式化为子句集的方法**


    在谓词逻辑中，有这样一些定义：


    原子谓词公式是一个最简单的命题，不能再分成更小的部分。


    原子谓词公式和它的否定，都叫作文字。*P*是一个正文字，表示*P*是真的。﹁*P*是一个负文字，表示﹁*P*是假的。*P*和﹁*P*互相矛盾，叫作互补文字。


    如果把一些文字用或连接起来，就得到一个子句。任何一个文字自己也可以看作一个子句。


    如果把一些子句放在一起，就得到一个子句集。


    一种特殊的子句，里面什么文字都没有，叫作空子句，用NIL表示。


    空子句没有任何内容，所以它永远是假的，不能被任何情况满足，叫作不可满足的。


    在谓词逻辑中，可以用一些等价关系和推理规则，把任何一个谓词公式变成一个相应的子句集。这样就可以更容易地判断谓词公式是否不可满足。下面用一个具体的例子，来说明把谓词公式化为子句集的方法。


    **例3.2** 将下列谓词公式化为子句集：


    （∀*x*）（（∀*y*）*P*（*x*，*y*））→﹁（∀*y*）（*Q*（*x*，*y*）→*R*（*x*，*y*））


    **解**：


    （1）消去谓词公式中的“→”和“↔”符号


    利用谓词公式的等价关系：


    *P*→*Q*⇔﹁*P*∨*Q*


    *P*↔*Q*⇔（*P*∧*Q*）∨（﹁*P*∧﹁*Q*）


    上例等价变换为


    （∀*x*）（﹁（∀*y*）*P*（*x*，*y*）∨﹁（∀*y*）（﹁^Q（*x*，*y*）∨*R*（*x*，*y*）））


    （2）把否定符号移到紧靠谓词的位置上


    利用谓词公式的等价关系：


    双重否定律


    ﹁（﹁*P*）⇔*P*


    德摩根律


    ﹁（*P*∧*Q*）⇔﹁*P*∨﹁*Q*


