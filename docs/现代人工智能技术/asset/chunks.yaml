    ## **4.4 粒子群优化算法**


    ### **4.4.1 粒子群优化算法的基本原理**


    1995年，受到鸟群觅食行为的规律性启发，美国普渡大学的Kennedy和Eberhart建立了一个简化的算法模型且经过多年改进最终形成了粒子群优化（Particle Swarm Optimization，PSO）算法
    ^([⁴](#fn4))


    PSO算法的思想源于鸟群觅食行为的研究，鸟群通过集体的信息共享使群体找到最优的目的地。设想这样一个场景：鸟群在森林里寻找食物，它们想要获得能够得到食物最多的位置，但是都不知道哪个位置最容易获得食物，因此只能感受到大概的方位。于是鸟群中的个体按照自己的判断开始寻找食物，并且在寻找过程中记录下找到食物最多的位置，同时鸟群中的每只鸟都将共享每次所找到食物的位置和食物的量，所以鸟群便可以得知哪个位置的食物量最多。在搜索的过程中每只鸟都会根据自己记忆中食物量最多的位置和当前鸟群记录的食物量最多的位置，从而调整自己接下来搜索的方向。鸟群经过一段时间的搜索后，就可以知道森林中哪个位置的食物量最多（全局最优解）。


    PSO算法与其他进化算法相似，根据个体对环境的适应度将群体中的个体移动到好的区域，但是它不像其他演化算法一样对个体使用演化算子，而是将每个个体看作是*n*维空间里一个没有体积质量的粒子，在搜索空间里按一定的速度飞行。


