    **定理3.1** 谓词公式不可满足的充要条件是其子句集不可满足。


    由此定理可知，要证明一个谓词公式是不可满足的，只要证明相应的子句集是不可满足的就可以了。如何证明一个子句集是不可满足的呢？下面介绍一下鲁滨逊归结原理。


    ## **3.4 鲁滨逊归结原理**


    经过分析，谓词公式的不可满足性分析可以转化为子句集中子句的不可满足性分析。那么，如何判定一个子句集是否不可满足呢？首先，需要对子句集中的每个子句进行判定。其次，需要对个体域上的所有解释进行检验。只有当一个子句对任何非空个体域上的任何解释都不可满足时，才能说这个子句是不可满足的。这是一项非常困难的任务，要在计算机上实现它的证明过程更是难上加难。1965年，鲁滨逊提出了归结原理，为机器定理证明开辟了新的途径。


    鲁滨逊归结原理也叫消解原理，是一种证明子句集不可满足性的理论和方法，是机器定理证明的基础。


    从谓词公式转化为子句集的过程可以看出，子句集中的子句是合取关系，只要有一个子句不可满足，就意味着整个子句集不可满足。由于空子句是不可满足的，所以如果一个子句集中包含空子句，那么这个子句集一定是不可满足的。鲁滨逊归结原理就是基于这个思想提出来的。它的基本方法是：检查子句集*S*中是否包含空子句，如果包含，就说明*S*不可满足；如果不包含，就在子句集中选择合适的子句进行归结，直到通过归结得到空子句为止，这时就可以判定*S*是不可满足的。


    **1. 命题逻辑中的归结原理**


    **定义3.1** 设*C*和*C*是子句集中的任意两个子句，如果*C*中的文字*L*和*C*中的文字*L*互补，那么从*C*和*C*中分别消去*L*和*L*，并将两个子句中剩余的部分析取，构成一个新子句*C*，这一过程称为归结。*C*称为*C*和*C*的归结式，*C*和*C*称为*C*的亲本子句。


