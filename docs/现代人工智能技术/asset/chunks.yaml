    ### 5.2.4 特征选择


    我们将属性称为特征，对当前学习任务有用的属性称为相关特征，没什么用的属性称为无关特征。从给定的特征集合中选择出相关特征子集的过程，称为特征选择。


    显然遍历所有可能的子集来选取一个包含所有重要信息的特征子集是不可行的，因为这样做会遭遇组合爆炸，特征个数稍多就无法进行。可行的做法是产生一个候选子集，评价出它的好坏，基于评价结果产生下一个候选子集，再对其进行评价，这个过程持续进行下去，直至无法找到更好的候选子集为止。


    第一个关键环节是子集搜索问题。给定特征集合{`a`，`a`，…，`a`[`d`]}，我们可将每个特征看作一个候选子集，对这个候选单特征子集进行评价，假定{`a`}最优，于是则将{`a`}作为第一轮的选定集；然后，在上一轮的选定集中加入一个特征，构成包含两个特征的候选子集，假定在这`d`-1
    候选两特征子集中{`a`，`a`}最优，且优于{`a`}，则将{`a`，`a`}作为本轮的选定集，假定在第`k`+1 轮时，最优的候选（`k`+1）特征子集不如上一轮的选定集时，则停止生成候选子集，并将上一轮选定的特征集合作为特征选择结果。这样逐渐增加相关特征的策略称为前向搜索。类似地，若我们从完整的特征集合开始，每次尝试去掉一个无关特征，这样逐渐减少特征的策略称为后向搜索。还可将前向与后向搜索结合起来，每一轮逐渐增加选定相关特征（这些特征在后续轮中将确定不会被去除）、同时减少无关特征，这样的策略称为双向搜索。


    显然，上述策略都是贪心的，因为它们仅考虑了使本轮选定集最优，例如在第三轮假定选择`a`优于`a`，于是选定集为{`a`，`a`，`a`}，然而在第四轮却可能是{`a`，`a`，`a`，`a`}比所有的{`a`，`a`，`a`，`a`[`i`]}都更优。遗憾的是，若不进行穷举搜索，则这样的问题无法避免。


    #### 子集评价问题


    第二个环节是子集评价问题。给定数据集`D`，假定`D`中第`i`类样本所占的比例为`p`[`i`]（`i`=1，2，…，|`γ`|）。为便于讨论，假定样本属性均为离散型，对属性子集`A`，假定根据其取值将`D`分成了`V`个子集{`D`，`D`，…，`D`^`V`}，每个子集中的样本在`A`上取值相同，于是我们可计算属性子集`A`的信息增益为


    ![](img/image_095.jpg)


    其中信息熵定义为


    ![](img/image_096.jpg)


    信息增益`Gain`（`A`）越大，意味着特征子集`A`包含的有助于分类的信息越多。于是，对每个候选特征子集，我们可基于训练数据集`D`来计算其信息增益，以此作为评价准则。


    更一般地，特征子集`A`实际上确定了对数据集`D`的一个划分，每个划分区域对应着`A`上的一个取值，而样本标记信息`Y`则对应着对`D`的真实划分，通过估算这两个划分的差异，就能对`A`进行评价。与`Y`对应的划分的差异越小，则说明`A`越好。信息熵仅是判断这个差异的一种途径，其他能判断两个划分差异的机制都能用于特征子集评价。


    将特征子集搜索机制与子集评价机制相结合，即可得到特征选择方法。例如将前向搜索与信息熵相结合，这显然与决策树算法非常相似。事实上，决策树可用于特征选择，树结点的划分属性所组成的集合就是选择出的特征子集。其他的特征选择方法未必像决策树特征选择这么明显，但它们在本质上都是显式或隐式地结合了某种（或多种）子集搜索机制和子集评价机制。


    常见的特征选择方法大致可分为三类：过滤式、包裹式和嵌入式。


    #### 1. 过滤式特征选择


    过滤式特征选择方法是先对数据集进行特征选择，然后再训练学习器，特征选择过程与后续学习器无关。这相当于先用特征选择过程对初始特征进行过滤，再用过滤后的特征来训练模型。


    `Relief`（`Relevant Features`）是一种著名的过滤式特征选择方法，该方法设计了一个相关统计量来度量特征的重要性。该统计量是一个向量，其每个分量分别对应于一个初始特征，而特征子集的重要性则是由子集中特征所对应的相关统计量分量之和来决定的。于是，最终只需指定一个阈值`τ`，然后选择比`τ`大的相关统计量分量所对应的特征即可；也可指定欲选取的特征个数`k`，然后选择相关统计量分量最大的`k`个特征。


    显然，`Relief`的关键是如何确定相关统计量。给定训练集{（`x`，`y`），（`x`，`y`），…，（`x`[`m`]，`y`[`m`]）}，对每个示例`x`[`i`]，`Relief`先在`x`[`i`]的同类样本中寻找其最近邻`x`[`i`]，称为猜中近邻（near-hit），再从`x`[`i`]的异类样本中寻找其最近邻`x`[`i`]，称为猜错近邻（near-miss），然后，相关统计量对应于属性`j`的分量为


    ![](img/image_097.jpg)![](img/image_098.jpg)![](img/image_099.jpg)![](img/image_100.jpg)![](img/image_101.jpg)![](img/image_102.jpg)


    式中，表示样本`x`[`a`]均在属性`j`上的取值；取决于属性`j`的类型：若属性`j`为离散型，则，否则为 1；若属性`j`为连续型，，注意已规范化到[0，1]区间。


    从式（5-3）可看出，若`x`[`i`]与其猜中近邻`x`[`i`]在属性`j`上的距离小于`x`[`i`]与其猜错近邻`x`[`i`]的距离，则说明属性`j`对区分同类与异类样本是有益的，于是增大属性`j`所对应的统计量分量；反之，若`x`[`i`]与其猜中近邻`x`[`i`]在属性`j`上的距离大于`x`[`i`]与其猜错近邻`x`[`i`]的距离，则说明属性`j`起负面作用，于是减小属性`j`所对应的统计量分量。最后，对基于不同样本得到的估计结果进行平均，就得到各属性的相关统计量分量，分量值越大，则对应属性的分类能力就越强。


    式（5-3）中的`i`指出了用于平均的样本下标。实际上，`Relief`只需在数据集的采样上而不必在整个数据集上估计相关统计量


    `Relief`是为二分类问题设计的，其扩展变体`Relief-F`


    ![](img/image_104.jpg)


    式中，`p`[`l`]为第`l`类样本在数据集`D`中所占的比例。


    #### 2. 包裹式特征选择


    过滤式特征选择使用相关统计量分量来对特征进行评价，而包裹式特征选择则直接把最终将要使用的学习器的性能作为特征子集的评价准则。


    一般而言，由于包裹式特征选择方法直接针对给定学习器进行优化，因此从最终学习器性能来看，包裹式特征选择比过滤式特征选择更好，但另一方面，由于在特征选择过程中需多次训练学习器，因此包裹式特征选择的计算开销通常比过滤式特征选择大得多。


    `LVW`（`Las Vegas Wrapper`）是一个典型的包裹式特征选择方法。它在拉斯维加斯方法（`Las Vegas Method`）框架下使用随机策略来进行子集搜索，并以最终分类器的误差为特征子集评价准则。


    需注意的是，由于`LVW`算法中特征子集搜索采用了随机策略，而每次特征子集评价都需训练学习器，计算开销很大，因此算法设置了停止条件控制参数`T`，然而，整个`LVW`算法是基于拉斯维加斯方法框架，若初始特征数很多、`T`设置较大，则算法可能运行很长时间都达不到停止条件。换言之，若有运行时间限制，则有可能给不出解。


    除此之外，还可以采取完全搜索，即穷举的策略。递归特征消除法使用一个基模型来进行多轮训练，每轮训练后，消除若干权值系数的特征，再基于新的特征集进行下一轮训练；递归特征消除法使用基模型在训练中进行迭代，选择不同特征构建单个特征的模型，通过模型的准确性为特征排序，借此来选择特征。


    也可采取启发式搜索，即贪心策略。前向选择法从 0 开始不断向模型加能最大限度提升模型效果的特征数据用以训练，直到任何训练数据都无法提升模型表现。后向剃除法先用所有特征数据进行建模，再逐一丢弃贡献最低的特征来提升模型效果，直到模型效果收敛。启发式搜索直接面向算法优化，不需要太多的知识，但其有庞大的搜索空间，且需要定义启发式策略。


    #### 3. 嵌入式特征选择和正则化


    在过滤式和包裹式特征选择方法中，特征选择过程与学习器训练过程有明显的分别；与此不同，嵌入式特征选择是将特征选择过程与学习器训练过程融为一体，两者在同一个优化过程中完成，即在学习器训练过程中自动地进行了特征选择。


    给定数据集`D`={（`x`，`y`），（`x`，`y`），…，（`x`[`m`]，`y`[`m`]）}，其中`x`∈ℝ^`d`，`y`∈ℝ。我们考虑最简单的线性回归模型，以平方误差为损失函数，则优化目标为


