    ## 8.4.4 Actor-Critic 算法


    本章中之前的内容分别讲解了基于值函数的方法和基于策略的方法，这两种方法中均只学习了一个函数。与这两种算法不同，Actor-Critic 算法同时学习了价值函数和策略函数，并且达到了很好的学习效果。目前很多高效的前沿强化学习算法，例如`TRPO`、`PPO`、`DDPG`、`SAC`等，都是基于
