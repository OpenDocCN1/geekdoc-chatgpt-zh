    ### **9.1.3 联邦学习的分类**


    令矩阵***D***表示每个数据所有者*i*持有的数据。矩阵的每一行代表一个样本，每一列代表一个特征。同时，某些数据集可能还包含标签数据，如财务字段中用户的信用、营销字段中用户的购买意愿等。我们将特征空间表示为*X*，将标签空间表示为*Y*，将样本ID空间表示为*I*。特征空间*X*、标签空间*Y*和样本ID空间*I*构成了完整的训练数据集（*I*，*X*，*Y*）。数据参与方的特征和样本空间可能并不相同，根据特征和样本ID空间中各方之间的数据分布情况，将联邦学习分为横向联邦学习（Horizontal Federated Learning，HFL）、纵向联邦学习（Vertical Federated Learning，VFL）和联邦迁移学习（Federated Transfer Learning，FTL）
    ^([^(20)](#fn20))


    ### *i*


    **1. 横向联邦学习**


    横向联邦学习适用于各数据所有者的业务类型相似、所获得的数据特征有重叠而样本只有较少重叠或基本无重叠的场景。例如，各地区不同的商场拥有客户的购物信息大多类似，但是用户人群不同。两个数据所有者参与的横向联邦学习定义如图9-1所示。


    ![](EPUB/images/image_542.jpg)


    图9-1 横向联邦学习定义


    横向联邦学习以数据的特征维度为导向，取出各数据所有者数据中特征相同而用户不完全相同的部分进行联合训练。在此过程中，通过各数据所有者之间的样本联合，扩大了训练的样本空间，从而提升了模型的准确度和泛化能力。


    **2. 纵向联邦学习**


    纵向联邦学习适用于各数据所有者之间的数据样本空间重叠较多、而特征空间重叠较少或没有重叠的场景。例如，某区域内的银行和商场，由于地理位置相近，所服务的用户交叉较多，样本空间有大量重叠，但因为业务类型不同，用户的特征相差较大。两个数据所有者参与的纵向联邦学习定义如图9-2所示。


    ![](EPUB/images/image_543.jpg)


    图9-2 纵向联邦学习定义


    纵向联邦学习是以共同数据样本为数据的对齐导向，取出数据所有者数据中样本相同而特征不完全相同的部分进行联合训练。因此，在联合训练时，需要先对各数据所有者数据进行样本对齐，获得样本重叠的数据，然后各自在被选出的数据集上进行训练。此外，为了保证非交叉部分数据的安全性，在系统级进行样本对齐操作，每个数据所有者只有基于本地数据训练的模型。


    **3. 联邦迁移学习**


    联邦迁移学习是对横向联邦学习和纵向联邦学习的补充，适用于各数据所有者彼此样本空间和特征空间都重叠较少的场景。例如，不同地区的银行和商场之间，样本空间和特征空间基本无重叠。在该场景下，采用横向联邦学习可能会产生比单独训练更差的模型，采用纵向联邦学习可能会产生负迁移的情况。两个数据所有者参与的联邦迁移学习定义如图9-3所示。


    联邦迁移学习基于各数据所有者的数据或模型之间的相似性，将在原始域中学习的模型迁移到目标域中。大多采用原始域中的标签来预测目标域中的标签准确性。


    ![](EPUB/images/image_544.jpg)


    图9-3 联邦迁移学习定义


    ## **9.2 隐私保护技术**


    ### **9.2.1 联邦学习面临的隐私泄露风险**


    联邦学习的训练过程中避免了各数据所有者数据的直接交换，与传统机器学习方法的集中式训练相比，更好地保障了参与者的隐私。这是否意味着使用联邦学习就能使隐私绝对安全呢？当然不是，就联邦学习本身而言，其使用的技术并未提供全面充分的隐私保护，在整个工作流程中仍然面临着隐私泄露风险。


    首先，虽然联邦学习采取交换抽象、可解释性低的模型信息的形式进行训练，但是这些模型信息是通过原始数据经过计算处理后得到的，仍然携带着原始数据的痕迹。这些原始数据痕迹暴露在所有参与训练的成员中，带来隐私泄露的风险。例如，通过对模型信息的推断，可以确定其是否来自于某个特定的数据所有者，或是根据模型信息利用梯度还原部分原始数据等。'
