    在不同状态下智能体输出的动作取决于智能体的策略，用`π`表示。策略是状态`s`的函数，`π`（`s`）=`P`（`A`= `a`| `S`= `s`）表示在状态`s`下选择动作`a`的概率。对于确定性策略，其输出为一个确定的动作；而对于随机性策略，其输出为动作的概率分布，通过对该分布的采样便可得到一个确定的动作。


