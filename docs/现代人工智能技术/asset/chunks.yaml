    ## **6.3 BP神经网络**


    在神经网络的发展中，BP神经网络是一个重要的转折点，同时BP神经网络对后续神经网络的学习也是一个基础，所以本节将详细地介绍BP神经网络和一些改进方法，为后续神经网络的学习和优化奠定基础。


    ### **6.3.1 标准BP神经网络算法和流程**


    BP神经网络是多层前向网络，也可以称为后向传播学习的前馈型神经网络，可以把其视作多层神经元网络的堆叠。BP神经网络具有多层，除了第一层称之为输入层，最后一层称之为输出层，中间的层都叫作隐藏层。BP神经网络结构图如图6-10所示。


    ![](EPUB/images/image_254.jpg)


    图6-10 BP神经网络结构图


    BP神经网络的网络结构是前馈型神经网络，在使用阶段直接输入，BP神经网络根据训练好的结果最终得到输出结果。BP神经网络的关键部分在训练阶段，也主要是通过反向传播的方式来更新参数，这就是BP神经网络命名的来历。BP反向算法在训练过程中，先进行一次前向的传播过程，再进行反向传播过程更新每一层参数，当满足迭代条件时停止。BP神经网络算法流程图如图6-11所示。


    根据上文提到的BP神经网络更新策略，在实际的操作中，每一步操作都有一定的技巧性。具体如图6-11所示共有五步。


    步骤一：需要对BP神经网络权值和神经元的阈值进行初始化，在这里首先要考虑的是每一层参数权重值*w*[ij]，如果没有先验知识（也就是没有其他信息）的情况下，一般设置为均值为0的均匀分布，其范围被定为［-1，1］或者［-0.5，0.5］。


    步骤二：样本每输入网络一次称为一个回合，每一个回合中都要对样本进行随机排序，这样做的目的是可以有效地使用样本特性。


    步骤三：从输入层沿着网络到输出层，每一个回合都会得到一个局部诱导域和函数输出值（这里需要相关的公式）。


    步骤四：从后向前，计算每一层神经元的局域梯度（这里也有相关的公式）。


    步骤五：更新每一层的参数。


    最后根据是否满足误差要求或者已经达到迭代要求停止继续更新参数。


    对于一个前馈型的神经网络，很重要的一点是能够完成权值参数的更新，这也是BP神经网络的精髓所在。


    BP神经网络的优点是显著的，其非线性映射能力、泛化能力和容错能力都是很不错的。它能学习和存储大量的输入-输出模式映射关系，无需存在描述这种映射关系的数学方程，这样的话可以避免复杂的数学计算，而是通过输入-输出模式映射的关系得到所需要的函数表达式。


    多层前馈网络训练将从样本中学习到的非线性映射关系存储在权值矩阵中。在其后的工作阶段，当向网络输入训练时未曾见过的非样本数据时，网络也能完成由输入空间向输出空间的正确映射。这也就是所谓的泛化能力，根据训练好的模型可以得到未训练样本的数据的结果，这也是深度学习的基础。


    另外，BP神经网络允许输入样本中带有较大的误差甚至个别错误。


    ### **6.3.2 标准BP神经网络分析和改进**


    **1. BP神经网络算法的局限性分析**


    BP神经网络的误差曲面通常存在多个极小点，而且绝大部分都是非全局极小点，在训练的时候容易陷入局部最优的问题。局部最优问题是神经网络问题中典型的一类优化问题，原因是多种的，一般来说就是由于存在多个极小点，在梯度优化算法中，当优化到这些点的时候，算法就会停止，导致整个算法收敛到某个极小点。


    ![](EPUB/images/image_255.jpg)


    图6-11 BP神经网络算法流程图


    BP神经网络的误差曲面有些区域比较平坦，也就是说当神经网络训练到这些误差曲面时，使用梯度优化算法会增加训练时间，而且训练效果也会变差。在上一节中提到的激活函数，当误差曲面变得平坦的时候，其会进入它的饱和区，梯度就会接近于0，其最终的结果就会导致网络参数更新变慢，增加训练时间。


    **2. BP神经网络算法的改进方法**


    针对上述两个问题，学者们提出了多种缓解和解决方法。


    关于BP神经网络在训练过程中容易陷入局部最优问题，随着深度学习理论的发展，学者们提出了新的优化算法策略，如Adagrad算法。


    ![](EPUB/images/image_256.jpg)![](EPUB/images/image_257.jpg)![](EPUB/images/image_258.jpg)


    表示的是每一个元素的二次方，测试的机器学习良好问题的良好默认设置为*α*\=0.001，*β*\=0.9，*β*\=0.999，*ε*\=10^(\-8)，对向量的所有操作多是逐元素的。用和表示在*t*时刻的*β*和*β*。


    1212


    Adam算法 ^([^(11)](#fn11))


    ![](EPUB/images/image_260.jpg)


    同时考虑到收敛到某一个极小点和网络参数初始化息息相关，所以在实践中往往多次随机初始化网络参数，利用不同的初始化参数去找到训练的最佳初始化参数部分。


    为了解决网络误差曲面进入平坦区之后导致训练速度减慢的问题，有学者提出采用引入陡度因子的方式，思路是在误差曲面进入平坦区之后，压缩神经元的净输入，使得输出退出激活函数的饱和区，从而使得梯度下降法可以有效实现，最终脱离平坦区。在标准BP神经网络中引入的激活函数是Sigmoid函数，所以本改进方法是在Sigmoid函数的基础上引入陡度因子*λ*，使得其激活函数为


