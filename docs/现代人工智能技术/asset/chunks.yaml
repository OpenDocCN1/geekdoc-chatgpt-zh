    有时候，存在量词受到一个或多个全称量词的影响。这种情况下，我们可以用一个函数来代替存在量词所限定的变量，从而消去存在量词。这样做是合理的，因为我们可以认为存在的个体是由全称量词所限定的个体决定的，它们之间的关系由函数来描述。这个函数就叫作Skolem函数，它是一个含有变量的函数。


