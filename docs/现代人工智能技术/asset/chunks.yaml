    # 8.5 深度强化学习


    在之前的部分中，没有考虑状态空间和动作空间的大小。当状态或者动作的数量非常大的时候，之前介绍的几种算法可能会导致储存或计算上的“灾难”。例如利用`Q-Learning`算法玩一个视频游戏，输入状态是一张
    100×100×3 的 RGB 图像，此时共有 256^(100×100×3)种状态，在计算机中存储这个数量级的`Q`表格明显是十分困难的。更有甚者，当状态或者动作无限时，更加无法用这种表格的方法去储存各个状态-动作对的`Q`值。为此需要用函数拟合的方法来估计`Q`值。


    ## 8.5.1 深度 Q 网络


    在深度`Q`网络（DQN）中，使用神经网络来表示`Q`函数，对于连续动作的情况，神经网络的输入是状态向量`s`和动作向量`a`，输出为状态`s`下动作`a`的价值`Q(s,a)`。对于离散的动作，还可以只输入当前状态`s`，输出每一个动作的价值`Q(s,a)`。将用于拟合`Q`函数的神经网络称为`Q`网络


    为了训练`Q`网络，需要构造其损失函数。考虑`Q-Learning`算法的更新规则［式（8-45）］，期望使`Q(s,a)`和时序差分目标靠近。于是，假设`Q`网络的参数为`w`，对于一组数据，可以将`Q`网络的损失函数构造为如式（8-78）所示的形式。由于损失函数中存在，故如此定义的`Q`网络只适用于离散动作空间的情况。


    ![](img/image_464.jpg)


    由于 DQN 是一种 Off-policy 算法，故在收集数据的时候可以使用一个ò-贪心的方法，把收集到的数据储存起来供后续训练使用。DQN 算法中为了使每个数据能够使用多次，可以维护一个回放缓冲区，将每一次从环境中采样得到的四元组数据储存到回放缓冲区中，再从回放缓冲区中随机选择若干样本来训练`Q`网络，这种方式被称为经验回放。经验回放主要有如下两个作用：


    1）可以使样本满足独立假设。在马尔可夫决策过程中交互采样得到的数据本身不满足独立假设，因为下一时刻的状态与上一时刻的状态有关。使用经验回放可以打破数据之间的关联性，使其满足独立假设。


    2）提高数据利用率。回放缓冲区中每个数据可以被多次利用，提高了数据利用率。


    ![](img/image_465.jpg)


    此外，DQN 中还使用目标网络来拟合损失函数中的，其网络参数`w`的更新方法为保持`Q`网络的一套较为旧的参数，即每隔`C`＞1 步，将训练网络的参数复制到目标网络中。采用目标网络后的损失函数如下所示。


    ![](img/image_466.jpg)


    综上所述，DQN 算法的具体流程如算法 8-5 所示。


