    ### 9.3.4 基于沙普利值评估


    基于沙普利值评估的方法是一种基于博弈论的方法，它将联邦学习视为一个多方合作博弈问题，并利用沙普利值来评估每个参与者的贡献度。沙普利值是一种衡量一个玩家在一个合作博弈中对总收益的平均边际贡献的指标，它满足了一些公平性和效率性的性质，例如：


    1）效率性：所有玩家的沙普利值之和等于总收益。


    2）对称性：如果两个玩家对任何联盟的贡献相同，则他们的沙普利值也相同。


    3）线性性：如果两个博弈可以叠加，则每个玩家在叠加后的博弈中的沙普利值等于他们在两个博弈中的沙普利值之和。


    4）零玩家性：如果一个玩家对任何联盟的贡献都为零，则他的沙普利值也为零。


    具体来说，对于联邦学习中的一个参与者`i`，其在训练得到的联邦学习模型上的沙普利值可以定义为


    ![](EPUB/images/image_573.jpg)


    式中，`N`是所有参与者的集合；`n`是参与者数量；`S`是任意子集；`f(S)`是由`S`中参与者提供数据训练得到模型后，在测试集上表现出来的某种指标（例如准确率、损失函数等）。


    一个基于沙普利值评估的例子是：


    1）对于每个参与者`i`，计算其边际贡献`Δf[i](S)`，即`i`加入或退出`S`后`f`的变化量。


    2）对于每个参与者`i`，计算其沙普利值`φ[i]`，即`i`在所有可能的参与者子集`S`中的平均边际贡献。


    3）根据每个玩家`i`的沙普利值`φ[i]`，给予相应的奖励或惩罚。


    基于沙普利值评估的方法可以保证公平地分配总收益给每个参与者，并激励更多参与者参与联邦学习。但这种方法也存在一些挑战和局限性，例如：


    1）计算复杂度高：要计算一个参与者`i`的沙普利值，需要遍历所有不包含`i`的子集`S`，并计算`f(S)`、`f(S-i)`、`f(S+i)`的差异。这样就需要`2^n`次模型训练和测试，其中`n`是参与者数量。这显然是不可行的，尤其是当`n`很大时。


    2）需要全局信息：要计算沙普利值，需要知道所有参与者提供数据训练得到模型后，在测试集上表现出来的指标`f(S)`。这需要将所有客户端数据汇总到服务器上进行训练和测试，或者将服务器模型分发给所有客户端进行本地训练和测试。这违背了联邦学习保护数据隐私和减少通信开销等目标。


    ![](EPUB/images/image_574.jpg)


    3）需要选择合适的指标：要计算沙普利值，需要选择一个能够反映模型好坏程度并且具有可加性\[即的指标作为`f(S)`。但实际上，并不是所有指标都满足这一条件，例如准确率就不具有可加性。


    ## 9.4 横向联邦学习


    ### 9.4.1 横向联邦学习的定义


    横向联邦学习是一种按样本划分的联邦学习方法，它适用于不同参与者拥有相同或相似的特征空间，但数据样本不同的场景。特征空间指的是数据集中所有样本共有的属性或特征，如年龄、性别、收入等；样本空间指的是数据集中所有样本的集合，如银行客户、医疗病人等。


    横向联邦学习的本质在某种程度上就是样本的联合，以达到提高模型训练和预测效果的目的。例如，两家不同地区的银行可以通过横向联邦学习，使用各自的客户数据共同构建一个用户模型，从而优化他们的风控模型和营销策略等。


    更具体地，利用在9.1.3节所定义的特征空间`X`、标签空间`Y`和样本ID空间`I`，可以把横向联邦学习适用的场景描述为


    ![](EPUB/images/image_575.jpg)


    式中，`D[i]`和`D[j]`分别表示联邦学习参与者`i`和`j`所持有的数据集。


    通常来说，在针对横向联邦学习系统中的安全性进行讨论时，往往会假设参与该横向联邦学习系统的每一个参与者都是诚实的，而中央服务器是诚实但好奇的。也就是说，我们通常假设横向联邦学习的参与者是安全可靠的，只有中央服务器才存在泄露各参与者隐私的风险。


    ### 9.4.2 横向联邦学习架构


    #### 1. 中心化联邦（客户端/服务器）架构


    横向联邦学习典型的中心化联邦（客户端/服务器）架构如图9-10所示。在这种架构中，有一个中央服务器（也被称为聚合服务器或参数服务器）负责模型的聚合和分发，多个参与者负责利用本地数据训练模型并上传梯度或参数，协作得到最终的模型。该种架构下的横向联邦学习通常步骤如下：


    ![](EPUB/images/image_576.jpg)


    图9-10 横向联邦学习典型的中心化联邦（客户端/服务器）架构


