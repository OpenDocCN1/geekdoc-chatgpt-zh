    给定由`m`条数据组成的数据集 `D = {(x, y), (x, y), …, (x[m], y[m])}`，其中`x = (x[i], x[i], …,
    x[id])`具有`d`个属性。通过一个线性回归的算法学得一个线性模型，使其预测值尽可能地接近真实值，即


