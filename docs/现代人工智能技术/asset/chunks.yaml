    否定前件是指，在已知`P`→`Q`为真的情况下，通过否定`P`为假来推出`Q`为假。这也是不合逻辑的。


    例如，下面的推理就使用了否定前件的推理，违反了逻辑规则：

    1）如果下雨，那么地上是湿的。

    2）没有下雨（否定前件）。

    3）所以，地上不湿。


    这显然是不正确的。因为即使没有下雨，地上也可能因为其他原因而湿。事实上，只要仔细分析蕴涵`P`→`Q`的定义，就会发现当`P`→`Q`为真时，肯定后件或否定前件所得的结论都不能确定，可能为真也可能为假。


    下面举例说明自然演绎推理方法。


