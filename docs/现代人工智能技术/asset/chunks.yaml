    **2. 查准率**、**查全率与F1**


    错误率与精度虽常用，但并不能满足所有的任务需求。例如在信息检索中，我们经常会关心“检索出的信息中有多少比例是用户感兴趣的”以及“用户感兴趣的信息中有多少被检索出来了”。查准率与查全率是更为适用于此类需求的性能度量。


    对于二分类问题，可将样例根据其真实类别与学习器预测类别的组合划分为真正例（True Positive，TP）、假正例（False Positive，FP）、真反例（True Negative，TN）和假反例（False Negative，FN）四种情形，令*TP*、*FP*、*TN*、*FN*分别表示其对应的样例数，则显然有*TP*+*FP*+*TN*+*FN*\=样例总数。分类结果的混淆矩阵见表5-1。


