    （1）消去蕴涵符号

    （∀`x`）{﹁[﹁`P`（`x`）∨﹁`Q`（`x`）]∨（∃`y`）[`S`（`x`，`y`）∧`Q`（`x`）]}∧（∀`x`）[`P`（`x`）∨`B`（`x`）]

    （2）把否定符号移到每个谓词的前面

    （∀`x`）{[ `P`（`x`）∧`Q`（`x`）]∨（∃`y`）[`S`（`x`，`y`）∧`Q`（`x`）]}∧（∀`x`）[`P`（`x`）∨`B`（`x`）]

    （3）变量标准化

    （∀`x`）{[ `P`（`x`）∧`Q`（`x`）]∨（∃`y`）[`S`（`x`，`y`）∧`Q`（`x`）]}∧（∀`w`）[`P`（`w`）∨`B`（`w`）]

    （4）消去存在量词

    设`y`的Skolem函数是`f`（`x`）

    （5）化为前束形

    （∀`x`）（∀`w`）{[ `P`（`x`）∧`Q`（`x`）]∨[`S`（`x`，`f`（`x`））∧`Q`（`x`）]}∧[`P`（`w`）∨`B`（`w`）]

    （6）化为Skolem标准形

    （∀`x`）（∀`w`）{`Q`（`x`）∧[`P`（`x`）∨`S`（`x`，`f`（`x`））]∧[`P`（`w`）∨`B`（`w`）]}

    （7）略去全称量词

    `Q`（`x`）∧[`P`（`x`）∨`S`（`x`，`f`（`x`））]∧[`P`（`w`）∨`B`（`w`）]

    （8）消去合取词，把母式用子句集表示

    {`Q`（`x`），`P`（`x`）∨`S`（`x`，`f`（`x`）），`P`（`w`）∨`B`（`w`）}

    （9）子句变量标准化

    {`Q`（`x`），`P`（`y`）∨`S`（`y`，`f`（`y`）），`P`（`w`）∨`B`（`w`）}


    ### 例3.4

