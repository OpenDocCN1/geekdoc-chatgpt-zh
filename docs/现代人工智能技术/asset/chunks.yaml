    在这个过程中，除了已经用过的`r`、`r`之外，只有`r`能够和综合数据库里的已知事实相匹配。因此，把`r`的结论加入综合数据库里。这样，综合数据库里的内容就变成了：这种动物有暗色的斑点、长长的脖子和腿、奶、蹄，是哺乳动物、有蹄类动物和长颈鹿。检查一下综合数据库里的内容，发现要识别的动物长颈鹿已经包含在里面了。所以，得出了“这种动物是长颈鹿”的最终结论。这样，问题就解决了。


    271111


    上面的问题解决过程是一个不断地从规则库里选择可用规则和综合数据库里的已知事实进行匹配的过程。每一次规则成功匹配，都会让综合数据库增加一些新的内容，并且让问题更接近解决。这个过程叫作推理，是专家系统的核心内容。当然，上面的过程只是一个简单的推理过程，后面还会对推理的相关问题进行全面的介绍。可以用普通编程语言（比如`C`、`C++`）里的`if`语句来实现产生式系统。但是当产生式规则很多时，就会出现新的问题。比如，要检查哪条规则被匹配，就需要花很长时间遍历所有的规则。所以，人们开发了一些专门用来匹配规则触发条件的快速算法，如`RETE`。这种系统内置了解决多个冲突的算法。近年来，还开发了专门用于计算机游戏开发的`RC++`。它是`C++`语言的超集，增加了控制角色行为的产生式规则，提供了反应式控制器的专用子集。


    ### 2.3.4 产生式表示法的特点


    #### 1. 产生式表示法的主要优点


    （1）自然性


    产生式表示法用“如果…，那么…”的形式来表达知识，这是人们常用的一种描述因果关系的方式，既直观、自然，又便于推理。正因为如此，产生式表示法成为人工智能中最重要和最常用的一种知识表示方法。


    （2）模块性


    产生式是规则库中最基本的知识单元，它们与推理机制相对独立，而且每条规则都有相同的形式。这样就方便了对规则进行模块化处理，为知识的增加、删除、修改带来了便利，为规则库的建立和扩展提供了可管理性。


    （3）有效性


    产生式表示法既可以表示确定性知识，也可以表示不确定性知识；既有利于表示启发式知识，也可以方便地表示过程性知识。目前已经成功建造的专家系统中，大部分是用产生式来表达它们的过程性知识的。


    （4）清晰性


    产生式有固定的格式。每一条产生式规则都由前提和结论这两部分组成，而且每一部分包含的知识量都比较少。这既便于对规则进行设计，又易于对规则库中知识的一致性和完整性进行检测。


    #### 2. 产生式表示法的主要缺点


    （1）效率不高


    产生式系统求解问题的过程是这样的：先用产生式的前提部分和综合数据库中已知事实进行匹配，找出可用的规则；然后在这些规则中按一定的策略选择一个执行；最后把执行的结果加入综合数据库中。这个过程要反复进行，直到找到问题的答案或无法继续为止。因为规则库一般都很大，而匹配又很耗时，所以这个过程的效率不高，而且可能会出现组合爆炸的问题。


    （2）不能表达具有结构性的知识


    产生式适合于表达具有因果关系的过程性知识，是一种非结构化的知识表示方法。但是对于具有结构关系的知识，例如事物之间的分类、属性、关联等，产生式就无法很好地表示。它不能把具有结构关系的事物间的区别和联系表示出来（后面介绍的框架表示法可以解决这方面的问题）。因此，产生式表示法除了可以单独使用外，还经常和其他表示法结合起来表示特定领域的知识。例如，在专家系统`PROSPECTOR`中用产生式和语义网络相结合，在`Alkins`中把产生式和框架表示法结合起来等。


    #### 3. 产生式表示法适合表示的知识


    从上面关于产生式表示法的特点可以看出，产生式表示法适合于表示具有以下几种特点的领域知识：


    1）由许多相对独立的知识元组成的领域知识，彼此间关系不密切，不存在结构关系，如化学反应方面的知识。


    2）具有经验性和不确定性的知识，而且相关领域中对这些知识没有严格、统一的理论，如医疗诊断、故障诊断等方面的知识。


    3）领域问题的求解过程可以被表示为一系列相对独立的操作，而且每个操作可以被表示为一条或多条产生式规则。


    ## 2.4 框架表示法


    1975年，美国人工智能领域的权威明斯基提出了框架理论。他认为，人类对世界上各种事物的认识，都是以一种类似于框架的结构储存在记忆中的。当遇到一个新事物时，人类就会从记忆中找出一个合适的框架，并根据实际情况对其细节进行调整和补充，从而形成对当前事物的认识。比如，一个人在走进一个教室之前，就能根据以往对“教室”的认识，想象出这个教室大概有四面墙、门窗、天花板和地板、课桌椅、讲台、黑板等。尽管他对这个教室的具体细节，如大小、门窗个数、桌椅数量颜色等还不清楚，但对教室的基本结构是可以预见的。这是因为他通过以往看到的教室，已经在记忆中建立了关于教室的框架。这个框架不仅包含了事物的名称（教室），还包含了事物各方面的属性（如有四面墙、课桌、黑板等）。通过查找这个框架，就很容易得到教室的各个特征。当他进入教室后，通过观察得到了教室的具体细节，把它们填入教室框架中，就得到了一个具体的教室实例。这是他对这个具体教室的视觉形象，称为实例框架。


    ### 2.4.1 框架的一般结构


    框架是一种用来描述对象（事物、事件或概念）属性的数据结构。


    一个框架由若干个称为“槽”的结构组成，每个槽又可以根据需要划分为若干个“侧面”。槽用来描述对象的某一方面的属性，侧面用来描述属性的某一方面。槽和侧面的属性值分别称为槽值和侧面值。在一个用框架表示知识的系统中，通常有多个框架，每个框架都有多个不同的槽和侧面，分别用不同的框架名、槽名和侧面名表示。


    下面是框架的一般表示形式：


    ![](EPUB/images/image_007.jpg)


    框架是一种表示知识的方式，它由若干个槽和侧面组成。一个框架可以有任意个槽，每个槽可以有任意个侧面，每个侧面可以有任意个值。槽值或侧面值可以是数值、字符串、布尔值等基本类型，也可以是一个动作或过程，用于在满足某个条件时执行，还可以是另一个框架的名字，从而实现框架之间的引用，表示出它们的关联。约束条件是可选的，如果没有指定约束条件，则表示没有限制。


