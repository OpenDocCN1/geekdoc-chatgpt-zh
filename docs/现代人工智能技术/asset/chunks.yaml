    对于一阶谓词逻辑，归结原理还具有完备性，也就是说，如果一个子句集不可满足，那么一定能从它推导出空子句；反过来，如果能从一个子句集推导出空子句，那么这个子句集也不可满足。归结原理的完备性可以用海伯伦的理论来证明，这里不再详述。


    需要指出的是，如果没有推导出空子句，不能断定*S*是不是可满足的。


    因为有两种可能：一种是*S*确实是可满足的，所以推导不出空子句；另一种是*S*不可满足，但没有找到正确的推导步骤。但是，如果确定不存在任何方法能推导出空子句，那么就可以肯定*S*是可满足的。


    归结原理虽然强大，但也有一定的局限性。


    ## **3.5 归结反演**


    归结原理是一种证明子句集不可满足性的方法。要证明*Q*是*P*，*P*，…，*P*[n]的逻辑结论，只要证明（*P*∧*P*∧…∧*P*[n]）∧﹁*Q*是不可满足的就行了。


    1212


    根据定理3.1，谓词公式的不可满足性和它的子句集的不可满足性是等价的。所以，我们可以用归结原理来自动证明定理。


    用归结原理证明定理的过程叫作归结反演。归结反演的一般步骤如下：


    1）把已知前提用谓词公式*F*表示。


    2）把要证明的结论用谓词公式*Q*表示，并取反得到﹁*Q*。


    3）把谓词公式集{*F*，﹁*Q*}转化为子句集*S*。


    4）用归结原理对子句集*S*中的子句进行归结，并把每次归结得到的归结式都加入*S*中。重复这个过程，直到出现空子句，就证明了*Q*是真的。


    **例3.9** 某公司招聘工作人员，*A*，*B*，*C*三人应试，经面试后公司表示如下想法：


    1）三人中至少录取一人。


    2）如果录取*A*而不录取*B*，则一定录取*C*。


    3）如果录取*B*，则一定录取*C*。


    求证：公司一定录取*C*。


    **证明** 设用谓词*P*（*x*）表示录取*x*，则把公司的想法用谓词公式表示如下：


    （1）*P*（*A*）∨*P*（*B*）∨*P*（*C*）


    （2）*P*（*A*）∧﹁*P*（*B*）→*P*（*C*）


    （3）*P*（*B*）→*P*（*C*）


    把要求证的结论用谓词公式表示出来并否定，得


    （4）﹁*P*（*C*）


    把上述公式化成子句集


    （1）*P*（*A*）∨*P*（*B*）∨*P*（*C*）


    （2）﹁*P*（*A*）∨*P*（*B*）∨*P*（*C*）


    （3）﹁*P*（*B*）∨*P*（*C*）


    （4）﹁*P*（*C*）


    应用归结原理进行归结


    （5）*P*（*B*）∨*P*（*C*）


    （1）与（2）归结


    （6）*P*（*C*）


    （3）与（5）归结


    （7）NIL


    （4）与（6）归结


    所以公司一定录取*C*。


