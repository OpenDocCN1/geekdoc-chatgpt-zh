    \n这种计算方法也被称为FedSGD算法。然而，若按式（9-36）进行计算，则在每一轮的迭代中都需要计算中间结果，并进行通信，会带来极大的通信负担。因此，在FedBCD算法中，所有的参与者在彼此之间通信中间结果前会执行*Q*≥1次连续的本地梯度更新。当*Q*\\\
