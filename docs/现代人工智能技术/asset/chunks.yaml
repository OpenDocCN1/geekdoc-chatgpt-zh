    ### 6.1.2 神经网络简介


    神经网络具有初步的自适应和自组织能力，可以在训练过程中更新神经元之间的权重，这样可以适应训练数据集。神经网络具有学习能力，可以超过设计者本身具有的知识能力，这也是它能够成为深度学习基础的一个关键因素。


    神经网络根据输入数据类型可以分为监督学习和无监督学习。判断神经网络是否为监督学习的关键在于看输入数据是否有标签，如果存在标签，那么是有监督学习，否则为无监督学习。在回归和分类中，因为每一个输入样本都有一个输出标签，这种学习的目的本质上就是找到输入特征和输出标签之间的关系，所以回归和分类是典型的监督学习。


    同时神经网络根据结构可以分为以下几种：前馈神经网络、反馈神经网络、自组织神经网络、生成对抗神经网络等。本节将主要介绍前馈神经网络（线性神经网络、卷积神经网络为代表）、反馈神经网络（循环神经网络为代表）和生成对抗神经网络等。


    ## 6.2 线性神经网络和全连接神经网络


    ### 6.2.1 线性神经网络


    线性神经网络发展时间很长，其最典型的例子是自适应线性元件。在 20 世纪 50 年代末提出，主要用途是通过线性逼近一个函数式而进行模式联想以及信号滤波、预测、模型识别和控制等。


    在介绍线性神经网络之前，先复习一下神经元知识。神经元系统的传输函数只可以输出两种可能的值，而线性神经网络却可以输出任意值，实现这一点的原理也很简单，就是神经元输出之后进行线性变换。虽然线性神经网络在收敛速度和精度上远远超过感知器，但是其线性运算也决定了其只能解决线性可分问题，不能解决异或问题乃至更加复杂的非线性问题。


