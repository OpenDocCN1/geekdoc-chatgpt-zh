    （5）化为前束形

    （∀`x`）（∀`y`）{﹁`P`（`x`）∨{[﹁`P`（`y`）∨`P`（`f`（`x`，`y`））]∧[`Q`（`x`，`g`（`x`））∧﹁`P`（`g`（`x`））]}}

    （6）化为Skolem标准形

