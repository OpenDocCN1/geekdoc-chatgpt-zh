    1）客户端：拥有数据的参与者，可以是企业或个人，他们在本地训练模型，并与其他参与方交换模型参数。


    2）协调者：负责协调客户端之间的通信和同步，以及提供一些公共服务，如加密、实体对齐等。


    3）审计者（非必须）：负责监督联邦学习的过程和结果，以确保数据隐私和模型安全。


