    ### 8.2.4 马尔可夫决策过程


    在马尔可夫过程和马尔可夫奖励过程中，状态之间的转换是自发的。然而在马尔可夫决策过程中，有一个来自外界的刺激来改变这个转换过程，这个刺激被称为智能体的动作。一般来说，一个马尔可夫决策过程被定义为一个元组（`S`，`A`，`P`，`r`，`γ`），其中：


    1）`S`：有限状态的集合。

