    ## 9.6 联邦迁移学习


    ### 9.6.1 联邦迁移学习的定义


    想要构建一个横向联邦学习或是纵向联邦学习系统，必须要保证所有参与者所有数据的特征空间或是样本空间相同或相似，才能实现协力训练一个机器学习模型。然而，在实际应用场景中，更多时候我们面对的参与者们所有数据存在着高度差异，特征空间与样本空间重叠少甚至没有重叠。例如，两家不同地区的商超和银行，其所有的用户样本不同，收集的用户特征信息也不同，想要共享用户消费和信用等特征，构建机器学习模型，横向联邦学习和纵向联邦学习方法都不适用。


    在这种情况下，联邦迁移学习被提出，使用迁移学习技术，拓展应用范围，帮助参与者建立精确有效的机器学习模型。联邦迁移学习基于各参与者所有数据或模型之间的相似性，将在源域中学习的模型迁移到目标域中，利用两个领域之间的不变性进行知识的传输。大多采用源域中的标签来预测目标域中的标签准确性。联邦迁移学习可以处理超出横向联邦学习和纵向联邦学习使用范围之外的问题。


    更具体地，利用在 9.1.3 节所定义的特征空间`X`、标签空间`Y`和样本 ID 空间`I`，可以把联邦迁移学习适用的场景描述为


    ![](img/image_622.jpg)


    式中，`D[i]`和`D[j]`分别表示联邦学习参与者`i`和`j`所持有的数据集。


    通常来说，在针对联邦迁移学习系统中的安全性进行讨论时，同针对纵向联邦学习讨论时采取的方式类似，往往会假设参与联邦的每一方都是诚实但好奇的。这意味着，联邦中的所有参与者在遵守安全协议的同时，也会尝试从收到的数据中推测出尽量多的信息。


    ### 9.6.2 联邦迁移学习的分类


    联邦迁移学习的本质是将迁移学习技术应用到横向联邦学习或纵向联邦学习中，根据应用的迁移学习技术的不同主要分为三类：基于样本的联邦迁移学习、基于特征的联邦迁移学习、基于模型的联邦迁移学习。下面将对三类联邦迁移学习进行简要概述。


    **1. 基于样本的联邦迁移学习**


    基于样本的联邦迁移学习重点关注对参与者所有数据样本的处理。在横向联邦学习中，由于不同参与者的数据样本往往来自不同的分布，从而导致利用这些数据样本训练会得到性能较差的机器学习模型。因此，参与者可以对训练样本进行挑选或者加权，以达到减小分布差异的效果，从而提升模型的性能。在纵向联邦学习中，由于不同参与者往往具有不同的业务目标，得到的对齐的样本和特征可能对联邦迁移学习带来负面影响，即负迁移。同样地，此时参与者可以对训练样本和特征进行挑选，起到避免负迁移产生的作用。


    **2. 基于特征的联邦迁移学习**


    基于特征的联邦迁移学习的目标是让所有参与者协同学习一个共同的表征空间，作为数据样本转换得到的表征分布和语义的缓冲空间，缩小彼此之间的差异，从而保证不同领域的知识信息可以传递。在横向联邦学习中，共同的表征空间可以利用最小化参与者样本之间的最大平均差异（Maximum
    Mean Piscrepancy，`MMD`）来学习得到。在纵向联邦学习中，共同的表征空间可以利用最小化对齐样本中不同参与者的表征之间的距离来学习得到。


    **3. 基于模型的联邦迁移学习**


    基于模型的联邦迁移学习希望所有参与者能够一同训练一个共享模型用于迁移学习过程，或是将预训练的模型用作联邦学习任务参与者的全部或部分初始模型。在横向联邦学习中，由于每个通信回合所有参与者会协同训练一个全局模型，并且会基于这个全局模型作为初始模型各自进行调整。因此，在某种程度上可以认为横向联邦学习也是基于模型的联邦迁移学习。在纵向联邦学习中，可以利用已对齐的样本训练预测模型，或是利用半监督学习来推断缺失的特征和标签，使用扩大的训练样本学习得到更高性能的共享模型。


