    这样，每个参与者在每轮迭代中，只需要计算自己的本地损失函数的梯度，并将其发送给服务器，服务器则根据参与者的数据量进行加权平均，得到一个近似的全局损失函数的梯度，然后用它来更新模型参数。这就完成了联邦平均算法的一轮迭代过程。


    联邦平均算法的伪代码在算法 9-1 中给出。


