    #### 2. 去中心化联邦（对等计算）架构


    横向联邦学习典型的去中心化联邦（对等计算）架构如图9-11所示。在这种架构中，每个参与者都是对等的，没有中心化的服务器或者聚合器，各参与者彼此直接通信协作，完成联邦学习过程，得到最终的模型。该种架构下的横向联邦学习通常步骤如下：


    ![](EPUB/images/image_584.jpg)


    图9-11 横向联邦学习典型的去中心化联邦（对等计算）架构


    1）各参与者在本地计算各自模型梯度，并使用加密技术，对梯度信息进行掩饰，并将掩饰后的结果（简称为加密梯度）发送给一个随机选定的邻居参与者。


    2）每个参与者收到邻居参与者的加密梯度后，进行安全聚合操作（如使用基于同态加密的加权平均），并将聚合后的结果发送给另一个随机选定的邻居参与者。


    3）重复步骤2），直到每个参与者都收到所有其他参与者的聚合结果。


    4）每个参与者对收到的聚合结果进行解密，并使用解密后的梯度结果更新各自的模型参数。


    5）重复步骤1）～4），直到达到预设的收敛条件或者达到允许的迭代次数或允许的训练时间。


