    ### 5.1.3 帝国理工学院


    英国帝国理工学院（Imperial College London）也有着悠久的 FPGA 研究传统。在 FPGA 领域，帝国理工比较知名的教授有来自电子系的
    George Constantinides、Peter Cheung，以及来自计算机系的 Wayne Luk（陆永青）三位，见图 5-3。其中，Constantinides
    是电子系电路与系统研究组主任，他有很强的数学功底，因此他的研究方向主要集中在和数学相关的 FPGA 字长优化、高层次综合算法，以及近年来不断兴起的近似计算等领域。Cheung
    和 Luk 两位华人教授是 FPGA 学术研究领域的元老级人物，他们的研究奠定了很多近现代 FPGA 发展的大方向。其中，Cheung 曾任帝国理工学院电子系主任，他主要专注于研究
    FPGA 设计过程中可能出现的各种问题，如可重构设计、信号处理、可靠性、工艺漂移（Process Variation）等。Luk 的研究更偏高层应用，包括
    FPGA 的设计语言、建模和工具等，以及如何使用可重构硬件进行特定算法和应用的加速计算。


