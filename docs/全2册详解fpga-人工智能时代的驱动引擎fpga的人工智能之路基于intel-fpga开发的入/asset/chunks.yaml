- raw: '另一方面，互联网企业也纷纷对云数据中心里的硬件加速领域展开布局。例如，微软率先将FPGA在自家的Azure云数据中心里进行了相当大规模的部署，并取得了瞩目的成就。以亚马逊为代表的很多云服务提供商则选择了另一条道路，把FPGA作为AWS实例的一部分进行推广，也同样获得了成功。


    新兴领域必然有新兴技术。为了使FPGA在云端更加易用、高效和可靠，出现了很多全新的FPGA应用技术。FPGA虚拟化，就是其中最有代表性的技术之一。


    本章将介绍像微软和亚马逊这样的互联网巨头通过何种方式在大型数据中心里部署和应用FPGA，以及传统的FPGA公司又是如何帮助更多用户进行云端FPGA加速的。同时，本章也将深入探讨FPGA虚拟化技术的具体细节以及未来的发展方向。


    ### 2.1　第一个吃螃蟹的人——微软Catapult项目


    2014年，微软在计算机架构领域的顶级会议ISCA上发表了一篇为*A* *Reconfigurable* *Fabric* *for* *Accelerating*
    *Large*\-*Scale Datacenter* *Services*的论文，对微软的一个名为Catapult的项目进行了详细介绍。在这个项目中，微软将英特尔的Stratix
    V系列FPGA部署到了自家数据中心的1632台服务器中，并使用FPGA对必应（Bing）搜索引擎的文件排名运算进行了硬件加速，最终得到了高达95%的吞吐量提升。


    这篇文章仿佛一声惊雷，轰动了整个业界。它是第一篇真正意义上详述由互联网巨头开发并部署FPGA的专业论文，标志着FPGA第一次在互联网及软件公司的大型数据中心里得到实质性应用。这篇文章正式将微软Catapult项目引入大众的视野，并向人们传达着一个重要的信息，那就是FPGA已不再仅仅是硬件公司的专属产品，而是可以有效地应用于像微软这样的互联网和软件公司，并有机会部署在谷歌、亚马逊、脸书、阿里、腾讯、百度等其他互联网巨头遍布全球的成千上万台服务器中。


    #### ■2.1.1　Catapult项目的产生背景


    说到Catapult项目，就不能不提一下它的主要负责人Doug Burger博士。他现任微软技术院士（Technical Fellow），并曾任微软研究院的杰出工程师（Distinguished
    Engineer）。在加入微软之前，Doug Burger曾担任得克萨斯大学奥斯汀分校的计算机科学教授。当他还在高校做研究时，学术界和业界的主要发展趋势是多核心架构。当时人们普遍认为，如果可以找到编写和运行高效并行软件的方法，就能将处理器架构扩展到数千个核心。但Doug
    Burger却对此不以为然。


    在2011年，Doug Burger发表了一篇论文，主要讨论了所谓的“暗硅效应”，即Dark Silicon。暗硅效应指的是，虽然我们可以不断增加处理器核心的数量，但是由于能耗的限制，并不能让它们同时工作。这就好像一栋大楼里有很多房间，但由于耗电量太大，无法同时打开每个房间的灯光，这使得这栋大楼在夜里看起来有很多黑暗的部分，“暗硅效应”也由此得名。


    Doug Burger认为，暗硅效应出现的本质原因是：在后摩尔定律时代，晶体管的能效发展已经趋于停滞。这样，即使人们开发出了并行软件，不断增加了核心数量，所带来的性能提升也会比以往要小得多。在他看来，解决暗硅效应的一个可行的手段就是采用“定制计算”，也就是为特定的工作场景与负载对硬件设计进行优化。这个概念在当时与微软不谋而合。


    微软对FPGA在数据中心里应用的研究起源于2010年底。当时，微软正希望从一个基于PC软件的公司，逐步转型为提供各类互联网服务的企业。Doug Burger加入微软后提出，像微软这种体量的互联网巨头不能只提供软件层面的互联网服务，还要从根本上掌控最高效的网络硬件设备。随着大数据时代的到来，包括人工智能在内的各类新应用不断涌现，网络带宽也由1Gbps不断增长为10Gbps、40Gbps直至100Gbps甚至更高。此时，传统的基于CPU的服务器和网络设备已无法满足日益增长的对计算量和网络带宽的需求。因此，寻找合适的网络加速设备势在必行。


    在当时，Doug Burger的这个想法遭到了很多微软内部人士的反对。在很多微软高管看来，微软自研网络硬件设备就好比“可口可乐宣布要做鱼翅”。幸运的是，Doug
    Burger得到了陆奇的鼎力支持。陆奇当时担任必应（Bing）搜索引擎负责人，在他的推动下，Doug Burger最终得以来到时任微软CEO的鲍尔默及其继任者纳德拉的面前，并向他们展示了FPGA在加速数据中心实际应用时的巨大潜力。图2-1为Catapult团队的成员合影。


    ![](OEBPS/Images/Figure-P67_864.jpg)


    图2-1　Catapult团队，右一为Doug Burger（图片来自微软）


    #### ■2.1.2　在数据中心里部署硬件加速单元的考虑因素


    在持续运行的大型数据中心里，有着数以万计的服务器在日夜不停地运转。在这里部署任何额外的硬件加速设备都并非易事。此时，硬件设备带来的性能提升往往只是众多的考虑因素之一。数据中心的管理者更加看重的，是性能与增加的整体功耗和成本之间的权衡。


    除此以外，这类部署还必须兼顾以下三点要求：


    第一，硬件加速设备应该具备良好的灵活性和可扩展性。在实际应用中，数据中心的负载并不固定，执行的应用和任务也纷繁复杂。因此，所选用的硬件加速设备不能只针对某种单一的应用场景。对于硬件加速设备所提供的逻辑资源和加速资源来说，它们应该能够根据给定的任务场景，进行有效的动态分配，并且避免在应用场景变换时，带来硬件资源的短缺或过剩。否则，对这些硬件加速资源进行的额外管理和开销会直接反映在数据中心的运维成本上。


    第二，部署的硬件加速设备必须能够保持数据中心的同构性。换句话说，选用的硬件加速器必须重复利用当前数据中心已有的软硬件结构。这其中，硬件结构包括现有的服务器、机柜、网络拓扑、供电和散热等，软件结构包括现有的各种数据中心管理、监控、资源分配软件等。这一点也和数据中心的开发和运维成本紧密相关。当前，没有公司会为了硬件加速单元而直接放弃早已部署运行的数据中心基础设施，因此在设计硬件加速单元时，不应该首先考虑对现有的数据中心结构和布局进行修改。


    第三，硬件加速器要有一定程度的容错性。其实，数据中心在部署和运行时，会考虑保留一定的冗余度，这样即便部分服务器发生故障，也不会影响数据中心整体性能的稳定。但是，由于在大型数据中心内部的各类硬件数量极大，很难靠人力对这些硬件进行维护。因此，需要硬件加速器有一定程度的容错性，并且当故障发生时能够对其进行定位、调试和分析。


    #### ■2.1.3　几类硬件加速模块的对比


    一般来说，硬件加速单元可以在FPGA、GPU，以及ASIC之间进行考虑。结合上面提出的各项评价因素，将这三类硬件加速单元与CPU在性能、灵活性、同构性、成本和功耗五个方面进行定性的比较和分析。


    在这五个指标中，“性能”指的是采用某种硬件加速单元带来的系统性能的提升；“灵活性”指这种硬件加速器对不同应用场景的适应程度；“同构性”反映了硬件加速器能否直接用于现有数据中心，并重复利用已有的基础设施架构和软硬件资源，而不用对数据中心进行重新设计；“成本”既包括对该硬件加速器的研发投入，也包含了它的采购、部署和运维开支；“功耗”是指引入该硬件加速器后，对数据中心带来的额外功耗负担。


    ##### 1．CPU


    CPU的性能指标矩阵如图2-2所示。CPU一直是传统数据中心里的主力计算单元，在部署时只需要线性地扩展机柜、网络连接、供电等，不需要改变数据中心的设计架构，因此有着很高的同构性。作为通用处理器，CPU可以应对和处理任何数据中心的应用，因此拥有极高的灵活性。但是，相比ASIC和FPGA等硬件计算模块，CPU的功耗水平比较高，这也是由它极高的通用性和灵活性决定的。在性能方面，CPU并非针对计算加速而设计，因此它能提供的算力也无法与GPU、ASIC或FPGA相比。同时，对于目前的很多高性能多核CPU而言，其开发部署和运维的成本也比较可观。


    ![](OEBPS/Images/Figure-P70_887.jpg)


    图2-2　CPU的各项性能指标


    ##### 2．GPU


    GPU的性能指标矩阵如图2-3所示。作为一个当前很流行的研究领域，很多研究人员一直在尝试使用GPU（通常也指通用GPU，即GPGPU）作为数据中心的硬件加速器。与CPU相比，GPU最大的特点就是运算性能有了质的提升，尤其是对于计算密集型应用，例如人工神经网络、大数据分析、数学建模、模拟回归等，GPU性能通常比CPU要高几个量级。


    ![](OEBPS/Images/Figure-P70_892.jpg)


    图2-3　GPU的各项性能指标


    但除此以外，GPU在其他几个性能指标上的表现就不尽如人意。GPU最大的问题是它基本上是个“功耗黑洞”，中等性能的GPU功耗都普遍超过200W，如果使用高性能GPU，这个数字会超过300W。相比于FPGA或ASIC的几十瓦甚至几瓦的功耗而言，这个数字显得过于惊人。高功耗对于GPU在数据中心里的大规模部署是致命的，因为这不仅代表着高昂的电费开支，还意味着数据中心现有的供电、散热等硬件架构需要进行重新修改，这势必会影响GPU在同构性和低成本这两项要求上的评分。


    在灵活性方面，GPU通常更适用于计算密集型运算，对于通信密集型的应用来说，GPU需要借助CPU和网卡组成一个完整的通信系统，从而与其他设备进行通信，因此对于这类应用，GPU的灵活性会受到较大限制，部署成本也会随之上升。


    ##### 3．ASIC（专用集成电路）


    ASIC的性能指标矩阵如图2-4所示。近年来，也有公司开始尝试自行研发专用硬件加速器，并在自家的数据中心里批量部署。这些硬件加速器通常针对某些特定应用开发，以专用芯片（ASIC）的方式进行部署。这其中，谷歌的张量处理器TPU（Tensor
    Processing Unit）就是典型的例子。TPU专为谷歌的深度学习框架TensorFlow设计，用来加速神经网络训练后的分析决策。ASIC最主要的优势是它的超高性能和超低功耗。例如，TPU的性能比GPU高一个量级，而功耗则比GPU低一到两个量级。


    不过，为了得到这样高性能和低功耗的专用芯片，需要付出巨大的研发成本。与软件开发不同，芯片的开发需要大量的人力物力投入，开发周期往往长达数年，而且失败的风险极大。放眼全球，同时拥有雄厚的资金实力和技术储备以进行这类研发的公司，大概用两只手就能数得出来，这种方案对于大多数公司而言并没有直接的借鉴意义。


    除此之外，ASIC的另外一个缺点就是它的低灵活性。顾名思义，专用芯片通常是针对某种特定应用而生，因此它无法或很难适用于其他的应用。在使用成本的角度，如果要采用基于ASIC的方案，就需要这类目标应用有足够的使用量，以分摊高昂的研发费用。同时，这类应用需要足够稳定，避免核心的算法和协议不断变化，而这对于诸如AI、5G等快速发展的行业也很难做到。综上，领域专用的硬件加速芯片在短时间内很难成为在数据中心里大规模部署的主流选择。


    ![](OEBPS/Images/Figure-P72_899.jpg)


    图2-4　ASIC的各项性能指标


    ##### 4．FPGA


    FPGA的性能指标矩阵如图2-5所示。总体来说，FPGA能够在各项性能指标中达到比较理想的平衡。在性能方面，FPGA可以实现定制化的硬件流水线，并且可以在硬件层面进行大规模的并行运算。因此，虽然它的绝对性能不如GPU或ASIC，但相比CPU的话还是有着至少一到两个量级的性能跃升。FPGA具有硬件可编程的特点，这使得它可以应对包括计算密集型和通信密集型在内的各类应用。此外，FPGA独有的动态可编程、部分可编程的特点，使其可以跨空间和时间两个维度，同时处理多个应用，或在不同时刻处理不同应用，因此灵活性很强。


    ![](OEBPS/Images/Figure-P73_905.jpg)


    图2-5　FPGA的性能指标


    功耗和成本方面，FPGA的功耗通常为几十瓦，运维成本远低于GPU。FPGA的开发成本主要包括购买特定的FPGA设计套件和调试软件、采购FPGA芯片或加速卡，以及组建团队进行或外包FPGA开发项目等投入。虽不及CPU或GPU等基于软件的开发方式，但由于省去了芯片流片的相关环节，因此研发成本远低于开发专用芯片。


    在部署方面，FPGA目前通常以加速卡的形式配合现有的通用处理器进行大规模部署，对额外的供电和冷却等环节大都没有特殊要求，因此可以兼容数据中心的现有硬件基础设施。在实际部署时，可能会需要进行额外的软件开发，例如驱动、配置软件，以及FPGA虚拟化相关的软件框架和接口等，但并不需要大量修改已有的数据中心软件架构以迎合FPGA的特殊功能。


    综上，相比其他硬件加速单元而言，FPGA在性能、灵活性、同构性、成本和功耗五个方面达到了比较理想的平衡，这也是微软最终选用FPGA进行数据中心应用加速的主要原因。在本节接下来的部分，将详细介绍Catapult项目的几个阶段，以及不同阶段所取得的成果和启示。


    #### ■2.1.4　Catapult项目的三个阶段


    2016年，微软在计算机体系架构顶级会议MICRO上发表了名为*A* *Cloud*\-*Scale* *Acceleration* *Architecture*的论文，介绍了Catapult项目的新一代架构和技术细节。至此，Catapult项目已经历三个阶段。在下文中，我们将对每个阶段进行详细讨论，特别包含以下几点内容：


    （1）FPGA片上逻辑架构；


    （2）FPGA加速卡结构，以及与其他硬件资源的互连方式；


    （3）多FPGA之间的资源分配、调度方式与网络拓扑；


    （4）主要性能指标。


    ##### 1．第一阶段


    在Catapult项目最初期，团队采用了单板多FPGA的方案，每块加速卡上集成了6片赛灵思的Virtix-6系列FPGA，各FPGA之间通过自身的通用I/O端口相连和通信，如图2-6所示。


    ![](OEBPS/Images/Figure-P74_919.jpg)


    图2-6　Catapult第一阶段的FPGA板卡（图片来自微软）


    然而，这种大型的加速卡在实际部署时遇到了很多问题。首先，这种方案的灵活性极差。例如，如果某种大型应用需要多于6片FPGA，则无法用该方案实现。从图中可以看到，这个加速卡除PCIe接口外，没有任何网络接口，因此板卡之间的通信带宽势必会受到很大限制。这样基本无法将单一应用映射在多块板卡上，同样的，如果一个应用只需要少量FPGA，甚至只需要单一FPGA的一部分，板卡的FPGA资源就相当于被浪费了。


    其次，这个方案的同构性极差。由于功耗、供电和尺寸限制，这种大型板卡很难直接部署在数据中心的高密度服务器上。如果要部署这个板卡，需要采购和配置额外的服务器，或者重新设计整个数据中心服务器集群的硬件架构。这显然是本末倒置、不切实际的。


    最后，这个方案的稳定性也无法满足部署要求。对于这种大型板卡，任何元件发生故障都有可能造成整个板卡的失效，继而可能导致相关服务器和应用出现故障。这是数据中心运行过程中不允许出现的。


    Catapult项目的第一个阶段更像是原型验证，其主要目的并非立刻进行商业化部署，而是利用这个阶段对FPGA作为数据中心硬件加速器的功能进行实验。鉴于上述的这些主要问题，项目团队对FPGA系统架构进行了较大的改动，项目也由此进入到下一个阶段。


    ##### 2．第二阶段


    Catapult项目第二阶段的主要工作发表在2014年的ISCA会议上，这也是Catapult项目的首个代表性成果。正是这个阶段的工作，引发了业界对这个项目的强烈关注。与前一阶段的工作相比，第二阶段仍然采用了FPGA加速卡的实现形式。不同之处在于，加速卡的架构从单板多FPGA，变成了单板单FPGA的结构，如图2-7所示。


    在每个第二代加速卡中，都使用了一枚Altera公司（当时还未被英特尔收购）的Stratix V系列FPGA芯片。这个FPGA是当时Altera公司的高端FPGA器件，其中包含了17.2万个可编程逻辑单元，2014个M20K片上存储单元，同时还有1590个硬核DSP单元。板卡上整合了8GB
    DDR3内存，接口方面则是一个PCIe Gen3×8接口，以及两个SFF-8088 SAS端口，可以实现FPGA之间高达20Gbps的通信带宽。网络拓扑方面，第二代Catapult架构将48个加速卡通过SFF-8088
    SAS端口组成了一个6×8的二维Torus网络。其中，每台服务器安装一块加速卡，并通过PCIe对加速卡供电，也并没有安装额外的制冷系统，如图2-8所示（右下角圆圈处即为加速卡位置）。


    ![](OEBPS/Images/Figure-P76_927.jpg)


    图2-7　Catapult第二阶段的FPGA板卡（图片来自微软）


    ![](OEBPS/Images/Figure-P76_934.jpg)


    图2-8　Catapult板卡在服务器中的位置（右下角圆圈处）（图片来自微软）


    第二代FPGA架构的主要特点是使用了名为“Shell & Role”的系统结构，如图2-9所示。其中，Shell包含了通用的系统基础架构和IP，例如内存控制器、PCIe、DMA模块、各种I/O接口和控制器等。Role本质为可重构区域，提供了与Shell相连的标准化接口，用来实现各类用户应用。


    ![](OEBPS/Images/Figure-P77_942.jpg)


    图2-9　Catapult FPGA采用的“Shell & Role”架构


    在软件方面，Catapult对数据中心软件和服务器软件分别进行了修改，加入了名为Mapping Manager和Health Manager的模块，前者用来根据给定的应用对FPGA进行配置，后者用来管理和监测FPGA和其他服务的正常运行。


    Catapult项目第二阶段的最主要工作之一，是将必应（Bing）搜索引擎中原先超过3万行C++代码的文件排名运算，卸载到了FPGA上进行硬件加速，并得到了惊人的结果。由于单个FPGA上的资源限制，整个文件排名运算算法被映射到8块FPGA上分别实现，并且总共部署了1632台服务器进行并行运算。


    图2-10总结了这项工作最具代表性的结果，即使用FPGA后与纯软件方案的对比。其中，坐标横轴代表系统延时，纵轴代表吞吐量。由于纯软件方案已经经过了深度优化，因此这个比较结果具有极高的说服力。


    这个结果可以从两个方面解读：第一，在系统延时相同的情况下，采用FPGA进行硬件加速后的系统吞吐量提升了接近一倍；'
  fmt: '

    另一方面，互联网企业也纷纷对云数据中心里的硬件加速领域展开布局。例如，微软率先将`FPGA`在自家的`Azure`云数据中心里进行了相当大规模的部署，并取得了瞩目的成就。以亚马逊为代表的很多云服务提供商则选择了另一条道路，把`FPGA`作为`AWS`实例的一部分进行推广，也同样获得了成功。


    新兴领域必然有新兴技术。为了使`FPGA`在云端更加易用、高效和可靠，出现了很多全新的`FPGA`应用技术。`FPGA`虚拟化，就是其中最有代表性的技术之一。


    本章将介绍像微软和亚马逊这样的互联网巨头通过何种方式在大型数据中心里部署和应用`FPGA`，以及传统的`FPGA`公司又是如何帮助更多用户进行云端`FPGA`加速的。同时，本章也将深入探讨`FPGA`虚拟化技术的具体细节以及未来的发展方向。


    ### 2.1　第一个吃螃蟹的人——微软Catapult项目


    2014年，微软在计算机架构领域的顶级会议`ISCA`上发表了一篇为*A* *Reconfigurable* *Fabric* *for* *Accelerating*
    *Large*\-*Scale Datacenter* *Services*的论文，对微软的一个名为`Catapult`的项目进行了详细介绍。在这个项目中，微软将英特尔的`Stratix
    V`系列`FPGA`部署到了自家数据中心的1632台服务器中，并使用`FPGA`对必应（`Bing`）搜索引擎的文件排名运算进行了硬件加速，最终得到了高达95%的吞吐量提升。


    这篇文章仿佛一声惊雷，轰动了整个业界。它是第一篇真正意义上详述由互联网巨头开发并部署`FPGA`的专业论文，标志着`FPGA`第一次在互联网及软件公司的大型数据中心里得到实质性应用。这篇文章正式将微软`Catapult`项目引入大众的视野，并向人们传达着一个重要的信息，那就是`FPGA`已不再仅仅是硬件公司的专属产品，而是可以有效地应用于像微软这样的互联网和软件公司，并有机会部署在谷歌、亚马逊、脸书、阿里、腾讯、百度等其他互联网巨头遍布全球的成千上万台服务器中。


    #### 2.1.1　Catapult项目的产生背景


    说到`Catapult`项目，就不能不提一下它的主要负责人Doug Burger博士。他现任微软技术院士（`Technical Fellow`），并曾任微软研究院的杰出工程师（`Distinguished
    Engineer`）。在加入微软之前，Doug Burger曾担任得克萨斯大学奥斯汀分校的计算机科学教授。当他还在高校做研究时，学术界和业界的主要发展趋势是多核心架构。当时人们普遍认为，如果可以找到编写和运行高效并行软件的方法，就能将处理器架构扩展到数千个核心。但Doug
    Burger却对此不以为然。


    在2011年，Doug Burger发表了一篇论文，主要讨论了所谓的“暗硅效应”，即`Dark Silicon`。暗硅效应指的是，虽然我们可以不断增加处理器核心的数量，但是由于能耗的限制，并不能让它们同时工作。这就好像一栋大楼里有很多房间，但由于耗电量太大，无法同时打开每个房间的灯光，这使得这栋大楼在夜里看起来有很多黑暗的部分，“暗硅效应”也由此得名。


    Doug Burger认为，暗硅效应出现的本质原因是：在后摩尔定律时代，晶体管的能效发展已经趋于停滞。这样，即使人们开发出了并行软件，不断增加了核心数量，所带来的性能提升也会比以往要小得多。在他看来，解决暗硅效应的一个可行的手段就是采用“定制计算”，也就是为特定的工作场景与负载对硬件设计进行优化。这个概念在当时与微软不谋而合。


    微软对`FPGA`在数据中心里应用的研究起源于2010年底。当时，微软正希望从一个基于PC软件的公司，逐步转型为提供各类互联网服务的企业。Doug Burger加入微软后提出，像微软这种体量的互联网巨头不能只提供软件层面的互联网服务，还要从根本上掌控最高效的网络硬件设备。随着大数据时代的到来，包括人工智能在内的各类新应用不断涌现，网络带宽也由`1Gbps`不断增长为`10Gbps`、`40Gbps`直至`100Gbps`甚至更高。此时，传统的基于`CPU`的服务器和网络设备已无法满足日益增长的对计算量和网络带宽的需求。因此，寻找合适的网络加速设备势在必行。


    在当时，Doug Burger的这个想法遭到了很多微软内部人士的反对。在很多微软高管看来，微软自研网络硬件设备就好比“可口可乐宣布要做鱼翅”。幸运的是，Doug
    Burger得到了陆奇的鼎力支持。陆奇当时担任必应（`Bing`）搜索引擎负责人，在他的推动下，Doug Burger最终得以来到时任微软CEO的鲍尔默及其继任者纳德拉的面前，并向他们展示了`FPGA`在加速数据中心实际应用时的巨大潜力。图2-1为`Catapult`团队的成员合影。


    ![](OEBPS/Images/Figure-P67_864.jpg)


    图2-1　`Catapult`团队，右一为Doug Burger（图片来自微软）


    #### 2.1.2　在数据中心里部署硬件加速单元的考虑因素


    在持续运行的大型数据中心里，有着数以万计的服务器在日夜不停地运转。在这里部署任何额外的硬件加速设备都并非易事。此时，硬件设备带来的性能提升往往只是众多的考虑因素之一。数据中心的管理者更加看重的，是性能与增加的整体功耗和成本之间的权衡。


    除此以外，这类部署还必须兼顾以下三点要求：


    第一，硬件加速设备应该具备良好的灵活性和可扩展性。在实际应用中，数据中心的负载并不固定，执行的应用和任务也纷繁复杂。因此，所选用的硬件加速设备不能只针对某种单一的应用场景。对于硬件加速设备所提供的逻辑资源和加速资源来说，它们应该能够根据给定的任务场景，进行有效的动态分配，并且避免在应用场景变换时，带来硬件资源的短缺或过剩。否则，对这些硬件加速资源进行的额外管理和开销会直接反映在数据中心的运维成本上。


    第二，部署的硬件加速设备必须能够保持数据中心的同构性。换句话说，选用的硬件加速器必须重复利用当前数据中心已有的软硬件结构。这其中，硬件结构包括现有的服务器、机柜、网络拓扑、供电和散热等，软件结构包括现有的各种数据中心管理、监控、资源分配软件等。这一点也和数据中心的开发和运维成本紧密相关。当前，没有公司会为了硬件加速单元而直接放弃早已部署运行的数据中心基础设施，因此在设计硬件加速单元时，不应该首先考虑对现有的数据中心结构和布局进行修改。


    第三，硬件加速器要有一定程度的容错性。其实，数据中心在部署和运行时，会考虑保留一定的冗余度，这样即便部分服务器发生故障，也不会影响数据中心整体性能的稳定。但是，由于在大型数据中心内部的各类硬件数量极大，很难靠人力对这些硬件进行维护。因此，需要硬件加速器有一定程度的容错性，并且当故障发生时能够对其进行定位、调试和分析。


    #### 2.1.3　几类硬件加速模块的对比


    一般来说，硬件加速单元可以在`FPGA`、`GPU`，以及`ASIC`之间进行考虑。结合上面提出的各项评价因素，将这三类硬件加速单元与`CPU`在性能、灵活性、同构性、成本和功耗五个方面进行定性的比较和分析。


    在这五个指标中，“性能”指的是采用某种硬件加速单元带来的系统性能的提升；“灵活性”指这种硬件加速器对不同应用场景的适应程度；“同构性”反映了硬件加速器能否直接用于现有数据中心，并重复利用已有的基础设施架构和软硬件资源，而不用对数据中心进行重新设计；“成本”既包括对该硬件加速器的研发投入，也包含了它的采购、部署和运维开支；“功耗”是指引入该硬件加速器后，对数据中心带来的额外功耗负担。


    ##### 1．CPU


    `CPU`的性能指标矩阵如图2-2所示。`CPU`一直是传统数据中心里的主力计算单元，在部署时只需要线性地扩展机柜、网络连接、供电等，不需要改变数据中心的设计架构，因此有着很高的同构性。作为通用处理器，`CPU`可以应对和处理任何数据中心的应用，因此拥有极高的灵活性。但是，相比`ASIC`和`FPGA`等硬件计算模块，`CPU`的功耗水平比较高，这也是由它极高的通用性和灵活性决定的。在性能方面，`CPU`并非针对计算加速而设计，因此它能提供的算力也无法与`GPU`、`ASIC`或`FPGA`相比。同时，对于目前的很多高性能多核`CPU`而言，其开发部署和运维的成本也比较可观。


    ![](OEBPS/Images/Figure-P70_887.jpg)


    图2-2　`CPU`的各项性能指标


    ##### 2．GPU


    `GPU`的性能指标矩阵如图2-3所示。作为一个当前很流行的研究领域，很多研究人员一直在尝试使用`GPU`（通常也指通用`GPU`，即`GPGPU`）作为数据中心的硬件加速器。与`CPU`相比，`GPU`最大的特点就是运算性能有了质的提升，尤其是对于计算密集型应用，例如人工神经网络、大数据分析、数学建模、模拟回归等，`GPU`性能通常比`CPU`要高几个量级。


    ![](OEBPS/Images/Figure-P70_892.jpg)


    图2-3　`GPU`的各项性能指标


    但除此以外，`GPU`在其他几个性能指标上的表现就不尽如人意。`GPU`最大的问题是它基本上是个“功耗黑洞”，中等性能的`GPU`功耗都普遍超过200W，如果使用高性能`GPU`，这个数字会超过300W。相比于`FPGA`或`ASIC`的几十瓦甚至几瓦的功耗而言，这个数字显得过于惊人。高功耗对于`GPU`在数据中心里的大规模部署是致命的，因为这不仅代表着高昂的电费开支，还意味着数据中心现有的供电、散热等硬件架构需要进行重新修改，这势必会影响`GPU`在同构性和低成本这两项要求上的评分。


    在灵活性方面，`GPU`通常更适用于计算密集型运算，对于通信密集型的应用来说，`GPU`需要借助`CPU`和网卡组成一个完整的通信系统，从而与其他设备进行通信，因此对于这类应用，`GPU`的灵活性会受到较大限制，部署成本也会随之上升。


    ##### 3．ASIC（专用集成电路）


    `ASIC`的性能指标矩阵如图2-4所示。近年来，也有公司开始尝试自行研发专用硬件加速器，并在自家的数据中心里批量部署。这些硬件加速器通常针对某些特定应用开发，以专用芯片（`ASIC`）的方式进行部署。这其中，谷歌的张量处理器`TPU`（`Tensor
    Processing Unit`）就是典型的例子。`TPU`专为谷歌的深度学习框架`TensorFlow`设计，用来加速神经网络训练后的分析决策。`ASIC`最主要的优势是它的超高性能和超低功耗。例如，`TPU`的性能比`GPU`高一个量级，而功耗则比`GPU`低一到两个量级。


    不过，为了得到这样高性能和低功耗的专用芯片，需要付出巨大的研发成本。与软件开发不同，芯片的开发需要大量的人力物力投入，开发周期往往长达数年，而且失败的风险极大。放眼全球，同时拥有雄厚的资金实力和技术储备以进行这类研发的公司，大概用两只手就能数得出来，这种方案对于大多数公司而言并没有直接的借鉴意义。


    除此之外，`ASIC`的另外一个缺点就是它的低灵活性。顾名思义，专用芯片通常是针对某种特定应用而生，因此它无法或很难适用于其他的应用。在使用成本的角度，如果要采用基于`ASIC`的方案，就需要这类目标应用有足够的使用量，以分摊高昂的研发费用。同时，这类应用需要足够稳定，避免核心的算法和协议不断变化，而这对于诸如AI、5G等快速发展的行业也很难做到。综上，领域专用的硬件加速芯片在短时间内很难成为在数据中心里大规模部署的主流选择。


    ![](OEBPS/Images/Figure-P72_899.jpg)


    图2-4　`ASIC`的各项性能指标


    ##### 4．FPGA


    `FPGA`的性能指标矩阵如图2-5所示。总体来说，`FPGA`能够在各项性能指标中达到比较理想的平衡。在性能方面，`FPGA`可以实现定制化的硬件流水线，并且可以在硬件层面进行大规模的并行运算。因此，虽然它的绝对性能不如`GPU`或`ASIC`，但相比`CPU`的话还是有着至少一到两个量级的性能跃升。`FPGA`具有硬件可编程的特点，这使得它可以应对包括计算密集型和通信密集型在内的各类应用。此外，`FPGA`独有的动态可编程、部分可编程的特点，使其可以跨空间和时间两个维度，同时处理多个应用，或在不同时刻处理不同应用，因此灵活性很强。


    ![](OEBPS/Images/Figure-P73_905.jpg)


    图2-5　`FPGA`的性能指标


    功耗和成本方面，`FPGA`的功耗通常为几十瓦，运维成本远低于`GPU`。`FPGA`的开发成本主要包括购买特定的`FPGA`设计套件和调试软件、采购`FPGA`芯片或加速卡，以及组建团队进行或外包`FPGA`开发项目等投入。虽不及`CPU`或`GPU`等基于软件的开发方式，但由于省去了芯片流片的相关环节，因此研发成本远低于开发专用芯片。


    在部署方面，`FPGA`目前通常以加速卡的形式配合现有的通用处理器进行大规模部署，对额外的供电和冷却等环节大都没有特殊要求，因此可以兼容数据中心的现有硬件基础设施。在实际部署时，可能会需要进行额外的软件开发，例如驱动、配置软件，以及`FPGA`虚拟化相关的软件框架和接口等，但并不需要大量修改已有的数据中心软件架构以迎合`FPGA`的特殊功能。


    综上，相比其他硬件加速单元而言，`FPGA`在性能、灵活性、同构性、成本和功耗五个方面达到了比较理想的平衡，这也是微软最终选用`FPGA`进行数据中心应用加速的主要原因。在本节接下来的部分，将详细介绍`Catapult`项目的几个阶段，以及不同阶段所取得的成果和启示。


    #### 2.1.4　Catapult项目的三个阶段


    2016年，微软在计算机体系架构顶级会议`MICRO`上发表了名为*A* *Cloud*\-*Scale* *Acceleration* *Architecture*的论文，介绍了`Catapult`项目的新一代架构和技术细节。至此，`Catapult`项目已经历三个阶段。在下文中，我们将对每个阶段进行详细讨论，特别包含以下几点内容：


    （1）`FPGA`片上逻辑架构；

    （2）`FPGA`加速卡结构，以及与其他硬件资源的互连方式；

    （3）多`FPGA`之间的资源分配、调度方式与网络拓扑；

    （4）主要性能指标。


    ##### 1．第一阶段


    在`Catapult`项目最初期，团队采用了单板多`FPGA`的方案，每块加速卡上集成了6片赛灵思的`Virtix-6`系列`FPGA`，各`FPGA`之间通过自身的通用I/O端口相连和通信，如图2-6所示。


    ![](OEBPS/Images/Figure-P74_919.jpg)


    图2-6　`Catapult`第一阶段的`FPGA`板卡（图片来自微软）


    然而，这种大型的加速卡在实际部署时遇到了很多问题。首先，这种方案的灵活性极差。例如，如果某种大型应用需要多于6片`FPGA`，则无法用该方案实现。从图中可以看到，这个加速卡除`PCIe`接口外，没有任何网络接口，因此板卡之间的通信带宽势必会受到很大限制。这样基本无法将单一应用映射在多块板卡上，同样的，如果一个应用只需要少量`FPGA`，甚至只需要单一`FPGA`的一部分，板卡的`FPGA`资源就相当于被浪费了。


    其次，这个方案的同构性极差。由于功耗、供电和尺寸限制，这种大型板卡很难直接部署在数据中心的高密度服务器上。如果要部署这个板卡，需要采购和配置额外的服务器，或者重新设计整个数据中心服务器集群的硬件架构。这显然是本末倒置、不切实际的。


    最后，这个方案的稳定性也无法满足部署要求。对于这种大型板卡，任何元件发生故障都有可能造成整个板卡的失效，继而可能导致相关服务器和应用出现故障。这是数据中心运行过程中不允许出现的。


    `Catapult`项目的第一个阶段更像是原型验证，其主要目的并非立刻进行商业化部署，而是利用这个阶段对`FPGA`作为数据中心硬件加速器的功能进行实验。鉴于上述的这些主要问题，项目团队对`FPGA`系统架构进行了较大的改动，项目也由此进入到下一个阶段。


    ##### 2．第二阶段


    `Catapult`项目第二阶段的主要工作发表在2014年的`ISCA`会议上，这也是`Catapult`项目的首个代表性成果。正是这个阶段的工作，引发了业界对这个项目的强烈关注。与前一阶段的工作相比，第二阶段仍然采用了`FPGA`加速卡的实现形式。不同之处在于，加速卡的架构从单板多`FPGA`，变成了单板单`FPGA`的结构，如图2-7所示。


    在每个第二代加速卡中，都使用了一枚`Altera`公司（当时还未被英特尔收购）的`Stratix V`系列`FPGA`芯片。这个`FPGA`是当时`Altera`公司的高端`FPGA`器件，其中包含了17.2万个可编程逻辑单元，2014个M20K片上存储单元，同时还有1590个硬核DSP单元。板卡上整合了8GB
    `DDR3`内存，接口方面则是一个`PCIe Gen3×8`接口，以及两个`SFF-8088 SAS`端口，可以实现`FPGA`之间高达20Gbps的通信带宽。网络拓扑方面，第二代`Catapult`架构将48个加速卡通过`SFF-8088
    SAS`端口组成了一个6×8的二维`Torus`网络。其中，每台服务器安装一块加速卡，并通过`PCIe`对加速卡供电，也并没有安装额外的制冷系统，如图2-8所示（右下角圆圈处即为加速卡位置）。


    ![](OEBPS/Images/Figure-P76_927.jpg)


    图2-7　`Catapult`第二阶段的`FPGA`板卡（图片来自微软）


    ![](OEBPS/Images/Figure-P76_934.jpg)


    图2-8　`Catapult`板卡在服务器中的位置（右下角圆圈处）（图片来自微软）


    第二代`FPGA`架构的主要特点是使用了名为“`Shell & Role`”的系统结构，如图2-9所示。其中，`Shell`包含了通用的系统基础架构和IP，例如内存控制器、`PCIe`、DMA模块、各种I/O接口和控制器等。`Role`本质为可重构区域，提供了与`Shell`相连的标准化接口，用来实现各类用户应用。


    ![](OEBPS/Images/Figure-P77_942.jpg)


    图2-9　`Catapult FPGA`采用的“`Shell & Role`”架构


    在软件方面，`Catapult`对数据中心软件和服务器软件分别进行了修改，加入了名为`Mapping Manager`和`Health Manager`的模块，前者用来根据给定的应用对`FPGA`进行配置，后者用来管理和监测`FPGA`和其他服务的正常运行。


    `Catapult`项目第二阶段的最主要工作之一，是将必应（`Bing`）搜索引擎中原先超过3万行`C++`代码的文件排名运算，卸载到了`FPGA`上进行硬件加速，并得到了惊人的结果。由于单个`FPGA`上的资源限制，整个文件排名运算算法被映射到8块`FPGA`上分别实现，并且总共部署了1632台服务器进行并行运算。


    图2-10总结了这项工作最具代表性的结果，即使用`FPGA`后与纯软件方案的对比。其中，坐标横轴代表系统延时，纵轴代表吞吐量。由于纯软件方案已经经过了深度优化，因此这个比较结果具有极高的说服力。


    这个结果可以从两个方面解读：第一，在系统延时相同的情况下，采用`FPGA`进行硬件加速后的系统吞吐量提升了接近一倍；

    '
  trans: '


    另一方面，互联网企业也纷纷对云数据中心里的硬件加速领域展开布局。例如，微软率先将`FPGA`在自家的`Azure`云数据中心里进行了相当大规模的部署，并取得了瞩目的成就。以亚马逊为代表的很多云服务提供商则选择了另一条道路，把`FPGA`作为`AWS`实例的一部分进行推广，也同样获得了成功。


    新兴领域必然有新兴技术。为了使`FPGA`在云端更加易用、高效和可靠，出现了很多全新的`FPGA`应用技术。`FPGA`虚拟化，就是其中最有代表性的技术之一。


    本章将介绍像微软和亚马逊这样的互联网巨头通过何种方式在大型数据中心里部署和应用`FPGA`，以及传统的`FPGA`公司又是如何帮助更多用户进行云端`FPGA`加速的。同时，本章也将深入探讨`FPGA`虚拟化技术的具体细节以及未来的发展方向。


    ### 2.1　第一个吃螃蟹的人——微软 Catapult 项目


    2014 年，微软在计算机架构领域的顶级会议`ISCA`上发表了一篇为*A* *Reconfigurable* *Fabric* *for* *Accelerating*
    *Large*\-*Scale Datacenter* *Services*的论文，对微软的一个名为`Catapult`的项目进行了详细介绍。在这个项目中，微软将英特尔的`Stratix
    V`系列`FPGA`部署到了自家数据中心的 1632 台服务器中，并使用`FPGA`对必应（`Bing`）搜索引擎的文件排名运算进行了硬件加速，最终得到了高达
    95%的吞吐量提升。


    这篇文章仿佛一声惊雷，轰动了整个业界。它是第一篇真正意义上详述由互联网巨头开发并部署`FPGA`的专业论文，标志着`FPGA`第一次在互联网及软件公司的大型数据中心里得到实质性应用。这篇文章正式将微软`Catapult`项目引入大众的视野，并向人们传达着一个重要的信息，那就是`FPGA`已不再仅仅是硬件公司的专属产品，而是可以有效地应用于像微软这样的互联网和软件公司，并有机会部署在谷歌、亚马逊、脸书、阿里、腾讯、百度等其他互联网巨头遍布全球的成千上万台服务器中。


    #### 2.1.1　Catapult 项目的产生背景


    说到`Catapult`项目，就不能不提一下它的主要负责人 Doug Burger 博士。他现任微软技术院士（`Technical Fellow`），并曾任微软研究院的杰出工程师（`Distinguished
    Engineer`）。在加入微软之前，Doug Burger 曾担任得克萨斯大学奥斯汀分校的计算机科学教授。当他还在高校做研究时，学术界和业界的主要发展趋势是多核心架构。当时人们普遍认为，如果可以找到编写和运行高效并行软件的方法，就能将处理器架构扩展到数千个核心。但
    Doug Burger 却对此不以为然。


    在 2011 年，Doug Burger 发表了一篇论文，主要讨论了所谓的“暗硅效应”，即`Dark Silicon`。暗硅效应指的是，虽然我们可以不断增加处理器核心的数量，但是由于能耗的限制，并不能让它们同时工作。这就好像一栋大楼里有很多房间，但由于耗电量太大，无法同时打开每个房间的灯光，这使得这栋大楼在夜里看起来有很多黑暗的部分，“暗硅效应”也由此得名。


    Doug Burger 认为，暗硅效应出现的本质原因是：在后摩尔定律时代，晶体管的能效发展已经趋于停滞。这样，即使人们开发出了并行软件，不断增加了核心数量，所带来的性能提升也会比以往要小得多。在他看来，解决暗硅效应的一个可行的手段就是采用“定制计算”，也就是为特定的工作场景与负载对硬件设计进行优化。这个概念在当时与微软不谋而合。


    微软对`FPGA`在数据中心里应用的研究起源于 2010 年底。当时，微软正希望从一个基于 PC 软件的公司，逐步转型为提供各类互联网服务的企业。Doug
    Burger 加入微软后提出，像微软这种体量的互联网巨头不能只提供软件层面的互联网服务，还要从根本上掌控最高效的网络硬件设备。随着大数据时代的到来，包括人工智能在内的各类新应用不断涌现，网络带宽也由`1Gbps`不断增长为`10Gbps`、`40Gbps`直至`100Gbps`甚至更高。此时，传统的基于`CPU`的服务器和网络设备已无法满足日益增长的对计算量和网络带宽的需求。因此，寻找合适的网络加速设备势在必行。


    在当时，Doug Burger 的这个想法遭到了很多微软内部人士的反对。在很多微软高管看来，微软自研网络硬件设备就好比“可口可乐宣布要做鱼翅”。幸运的是，Doug
    Burger 得到了陆奇的鼎力支持。陆奇当时担任必应（`Bing`）搜索引擎负责人，在他的推动下，Doug Burger 最终得以来到时任微软 CEO 的鲍尔默及其继任者纳德拉的面前，并向他们展示了`FPGA`在加速数据中心实际应用时的巨大潜力。图
    2-1 为`Catapult`团队的成员合影。


    ![](img/Figure-P67_864.jpg)


    图 2-1　`Catapult`团队，右一为 Doug Burger（图片来自微软）


    #### 2.1.2　在数据中心里部署硬件加速单元的考虑因素


    在持续运行的大型数据中心里，有着数以万计的服务器在日夜不停地运转。在这里部署任何额外的硬件加速设备都并非易事。此时，硬件设备带来的性能提升往往只是众多的考虑因素之一。数据中心的管理者更加看重的，是性能与增加的整体功耗和成本之间的权衡。


    除此以外，这类部署还必须兼顾以下三点要求：


    第一，硬件加速设备应该具备良好的灵活性和可扩展性。在实际应用中，数据中心的负载并不固定，执行的应用和任务也纷繁复杂。因此，所选用的硬件加速设备不能只针对某种单一的应用场景。对于硬件加速设备所提供的逻辑资源和加速资源来说，它们应该能够根据给定的任务场景，进行有效的动态分配，并且避免在应用场景变换时，带来硬件资源的短缺或过剩。否则，对这些硬件加速资源进行的额外管理和开销会直接反映在数据中心的运维成本上。


    第二，部署的硬件加速设备必须能够保持数据中心的同构性。换句话说，选用的硬件加速器必须重复利用当前数据中心已有的软硬件结构。这其中，硬件结构包括现有的服务器、机柜、网络拓扑、供电和散热等，软件结构包括现有的各种数据中心管理、监控、资源分配软件等。这一点也和数据中心的开发和运维成本紧密相关。当前，没有公司会为了硬件加速单元而直接放弃早已部署运行的数据中心基础设施，因此在设计硬件加速单元时，不应该首先考虑对现有的数据中心结构和布局进行修改。


    第三，硬件加速器要有一定程度的容错性。其实，数据中心在部署和运行时，会考虑保留一定的冗余度，这样即便部分服务器发生故障，也不会影响数据中心整体性能的稳定。但是，由于在大型数据中心内部的各类硬件数量极大，很难靠人力对这些硬件进行维护。因此，需要硬件加速器有一定程度的容错性，并且当故障发生时能够对其进行定位、调试和分析。


    #### 2.1.3　几类硬件加速模块的对比


    一般来说，硬件加速单元可以在`FPGA`、`GPU`，以及`ASIC`之间进行考虑。结合上面提出的各项评价因素，将这三类硬件加速单元与`CPU`在性能、灵活性、同构性、成本和功耗五个方面进行定性的比较和分析。


    在这五个指标中，“性能”指的是采用某种硬件加速单元带来的系统性能的提升；“灵活性”指这种硬件加速器对不同应用场景的适应程度；“同构性”反映了硬件加速器能否直接用于现有数据中心，并重复利用已有的基础设施架构和软硬件资源，而不用对数据中心进行重新设计；“成本”既包括对该硬件加速器的研发投入，也包含了它的采购、部署和运维开支；“功耗”是指引入该硬件加速器后，对数据中心带来的额外功耗负担。


    ##### 1．CPU


    `CPU`的性能指标矩阵如图 2-2 所示。`CPU`一直是传统数据中心里的主力计算单元，在部署时只需要线性地扩展机柜、网络连接、供电等，不需要改变数据中心的设计架构，因此有着很高的同构性。作为通用处理器，`CPU`可以应对和处理任何数据中心的应用，因此拥有极高的灵活性。但是，相比`ASIC`和`FPGA`等硬件计算模块，`CPU`的功耗水平比较高，这也是由它极高的通用性和灵活性决定的。在性能方面，`CPU`并非针对计算加速而设计，因此它能提供的算力也无法与`GPU`、`ASIC`或`FPGA`相比。同时，对于目前的很多高性能多核`CPU`而言，其开发部署和运维的成本也比较可观。


    ![](img/Figure-P70_887.jpg)


    图 2-2　`CPU`的各项性能指标


    ##### 2．GPU


    `GPU`的性能指标矩阵如图 2-3 所示。作为一个当前很流行的研究领域，很多研究人员一直在尝试使用`GPU`（通常也指通用`GPU`，即`GPGPU`）作为数据中心的硬件加速器。与`CPU`相比，`GPU`最大的特点就是运算性能有了质的提升，尤其是对于计算密集型应用，例如人工神经网络、大数据分析、数学建模、模拟回归等，`GPU`性能通常比`CPU`要高几个量级。


    ![](img/Figure-P70_892.jpg)


    图 2-3　`GPU`的各项性能指标


    但除此以外，`GPU`在其他几个性能指标上的表现就不尽如人意。`GPU`最大的问题是它基本上是个“功耗黑洞”，中等性能的`GPU`功耗都普遍超过 200W，如果使用高性能`GPU`，这个数字会超过
    300W。相比于`FPGA`或`ASIC`的几十瓦甚至几瓦的功耗而言，这个数字显得过于惊人。高功耗对于`GPU`在数据中心里的大规模部署是致命的，因为这不仅代表着高昂的电费开支，还意味着数据中心现有的供电、散热等硬件架构需要进行重新修改，这势必会影响`GPU`在同构性和低成本这两项要求上的评分。


    在灵活性方面，`GPU`通常更适用于计算密集型运算，对于通信密集型的应用来说，`GPU`需要借助`CPU`和网卡组成一个完整的通信系统，从而与其他设备进行通信，因此对于这类应用，`GPU`的灵活性会受到较大限制，部署成本也会随之上升。


    ##### 3．ASIC（专用集成电路）


    `ASIC`的性能指标矩阵如图 2-4 所示。近年来，也有公司开始尝试自行研发专用硬件加速器，并在自家的数据中心里批量部署。这些硬件加速器通常针对某些特定应用开发，以专用芯片（`ASIC`）的方式进行部署。这其中，谷歌的张量处理器`TPU`（`Tensor
    Processing Unit`）就是典型的例子。`TPU`专为谷歌的深度学习框架`TensorFlow`设计，用来加速神经网络训练后的分析决策。`ASIC`最主要的优势是它的超高性能和超低功耗。例如，`TPU`的性能比`GPU`高一个量级，而功耗则比`GPU`低一到两个量级。


    不过，为了得到这样高性能和低功耗的专用芯片，需要付出巨大的研发成本。与软件开发不同，芯片的开发需要大量的人力物力投入，开发周期往往长达数年，而且失败的风险极大。放眼全球，同时拥有雄厚的资金实力和技术储备以进行这类研发的公司，大概用两只手就能数得出来，这种方案对于大多数公司而言并没有直接的借鉴意义。


    除此之外，`ASIC`的另外一个缺点就是它的低灵活性。顾名思义，专用芯片通常是针对某种特定应用而生，因此它无法或很难适用于其他的应用。在使用成本的角度，如果要采用基于`ASIC`的方案，就需要这类目标应用有足够的使用量，以分摊高昂的研发费用。同时，这类应用需要足够稳定，避免核心的算法和协议不断变化，而这对于诸如
    AI、5G 等快速发展的行业也很难做到。综上，领域专用的硬件加速芯片在短时间内很难成为在数据中心里大规模部署的主流选择。


    ![](img/Figure-P72_899.jpg)


    图 2-4　`ASIC`的各项性能指标


    ##### 4．FPGA


    `FPGA`的性能指标矩阵如图 2-5 所示。总体来说，`FPGA`能够在各项性能指标中达到比较理想的平衡。在性能方面，`FPGA`可以实现定制化的硬件流水线，并且可以在硬件层面进行大规模的并行运算。因此，虽然它的绝对性能不如`GPU`或`ASIC`，但相比`CPU`的话还是有着至少一到两个量级的性能跃升。`FPGA`具有硬件可编程的特点，这使得它可以应对包括计算密集型和通信密集型在内的各类应用。此外，`FPGA`独有的动态可编程、部分可编程的特点，使其可以跨空间和时间两个维度，同时处理多个应用，或在不同时刻处理不同应用，因此灵活性很强。


    ![](img/Figure-P73_905.jpg)


    图 2-5　`FPGA`的性能指标


    功耗和成本方面，`FPGA`的功耗通常为几十瓦，运维成本远低于`GPU`。`FPGA`的开发成本主要包括购买特定的`FPGA`设计套件和调试软件、采购`FPGA`芯片或加速卡，以及组建团队进行或外包`FPGA`开发项目等投入。虽不及`CPU`或`GPU`等基于软件的开发方式，但由于省去了芯片流片的相关环节，因此研发成本远低于开发专用芯片。


    在部署方面，`FPGA`目前通常以加速卡的形式配合现有的通用处理器进行大规模部署，对额外的供电和冷却等环节大都没有特殊要求，因此可以兼容数据中心的现有硬件基础设施。在实际部署时，可能会需要进行额外的软件开发，例如驱动、配置软件，以及`FPGA`虚拟化相关的软件框架和接口等，但并不需要大量修改已有的数据中心软件架构以迎合`FPGA`的特殊功能。


    综上，相比其他硬件加速单元而言，`FPGA`在性能、灵活性、同构性、成本和功耗五个方面达到了比较理想的平衡，这也是微软最终选用`FPGA`进行数据中心应用加速的主要原因。在本节接下来的部分，将详细介绍`Catapult`项目的几个阶段，以及不同阶段所取得的成果和启示。


    #### 2.1.4　Catapult 项目的三个阶段


    2016 年，微软在计算机体系架构顶级会议`MICRO`上发表了名为*A* *Cloud*\-*Scale* *Acceleration* *Architecture*的论文，介绍了`Catapult`项目的新一代架构和技术细节。至此，`Catapult`项目已经历三个阶段。在下文中，我们将对每个阶段进行详细讨论，特别包含以下几点内容：


    （1）`FPGA`片上逻辑架构；

    （2）`FPGA`加速卡结构，以及与其他硬件资源的互连方式；

    （3）多`FPGA`之间的资源分配、调度方式与网络拓扑；

    （4）主要性能指标。


    ##### 1．第一阶段


    在`Catapult`项目最初期，团队采用了单板多`FPGA`的方案，每块加速卡上集成了 6 片赛灵思的`Virtix-6`系列`FPGA`，各`FPGA`之间通过自身的通用
    I/O 端口相连和通信，如图 2-6 所示。


    ![](img/Figure-P74_919.jpg)


    图 2-6　`Catapult`第一阶段的`FPGA`板卡（图片来自微软）


    然而，这种大型的加速卡在实际部署时遇到了很多问题。首先，这种方案的灵活性极差。例如，如果某种大型应用需要多于 6 片`FPGA`，则无法用该方案实现。从图中可以看到，这个加速卡除`PCIe`接口外，没有任何网络接口，因此板卡之间的通信带宽势必会受到很大限制。这样基本无法将单一应用映射在多块板卡上，同样的，如果一个应用只需要少量`FPGA`，甚至只需要单一`FPGA`的一部分，板卡的`FPGA`资源就相当于被浪费了。


    其次，这个方案的同构性极差。由于功耗、供电和尺寸限制，这种大型板卡很难直接部署在数据中心的高密度服务器上。如果要部署这个板卡，需要采购和配置额外的服务器，或者重新设计整个数据中心服务器集群的硬件架构。这显然是本末倒置、不切实际的。


    最后，这个方案的稳定性也无法满足部署要求。对于这种大型板卡，任何元件发生故障都有可能造成整个板卡的失效，继而可能导致相关服务器和应用出现故障。这是数据中心运行过程中不允许出现的。


    `Catapult`项目的第一个阶段更像是原型验证，其主要目的并非立刻进行商业化部署，而是利用这个阶段对`FPGA`作为数据中心硬件加速器的功能进行实验。鉴于上述的这些主要问题，项目团队对`FPGA`系统架构进行了较大的改动，项目也由此进入到下一个阶段。


    ##### 2．第二阶段


    `Catapult`项目第二阶段的主要工作发表在 2014 年的`ISCA`会议上，这也是`Catapult`项目的首个代表性成果。正是这个阶段的工作，引发了业界对这个项目的强烈关注。与前一阶段的工作相比，第二阶段仍然采用了`FPGA`加速卡的实现形式。不同之处在于，加速卡的架构从单板多`FPGA`，变成了单板单`FPGA`的结构，如图
    2-7 所示。


    在每个第二代加速卡中，都使用了一枚`Altera`公司（当时还未被英特尔收购）的`Stratix V`系列`FPGA`芯片。这个`FPGA`是当时`Altera`公司的高端`FPGA`器件，其中包含了
    17.2 万个可编程逻辑单元，2014 个 M20K 片上存储单元，同时还有 1590 个硬核 DSP 单元。板卡上整合了 8GB `DDR3`内存，接口方面则是一个`PCIe
    Gen3×8`接口，以及两个`SFF-8088 SAS`端口，可以实现`FPGA`之间高达 20Gbps 的通信带宽。网络拓扑方面，第二代`Catapult`架构将
    48 个加速卡通过`SFF-8088 SAS`端口组成了一个 6×8 的二维`Torus`网络。其中，每台服务器安装一块加速卡，并通过`PCIe`对加速卡供电，也并没有安装额外的制冷系统，如图
    2-8 所示（右下角圆圈处即为加速卡位置）。


    ![](img/Figure-P76_927.jpg)


    图 2-7　`Catapult`第二阶段的`FPGA`板卡（图片来自微软）


    ![](img/Figure-P76_934.jpg)


    图 2-8　`Catapult`板卡在服务器中的位置（右下角圆圈处）（图片来自微软）


    第二代`FPGA`架构的主要特点是使用了名为“`Shell & Role`”的系统结构，如图 2-9 所示。其中，`Shell`包含了通用的系统基础架构和
    IP，例如内存控制器、`PCIe`、DMA 模块、各种 I/O 接口和控制器等。`Role`本质为可重构区域，提供了与`Shell`相连的标准化接口，用来实现各类用户应用。


    ![](img/Figure-P77_942.jpg)


    图 2-9　`Catapult FPGA`采用的“`Shell & Role`”架构


    在软件方面，`Catapult`对数据中心软件和服务器软件分别进行了修改，加入了名为`Mapping Manager`和`Health Manager`的模块，前者用来根据给定的应用对`FPGA`进行配置，后者用来管理和监测`FPGA`和其他服务的正常运行。


    `Catapult`项目第二阶段的最主要工作之一，是将必应（`Bing`）搜索引擎中原先超过 3 万行`C++`代码的文件排名运算，卸载到了`FPGA`上进行硬件加速，并得到了惊人的结果。由于单个`FPGA`上的资源限制，整个文件排名运算算法被映射到
    8 块`FPGA`上分别实现，并且总共部署了 1632 台服务器进行并行运算。


    图 2-10 总结了这项工作最具代表性的结果，即使用`FPGA`后与纯软件方案的对比。其中，坐标横轴代表系统延时，纵轴代表吞吐量。由于纯软件方案已经经过了深度优化，因此这个比较结果具有极高的说服力。


    这个结果可以从两个方面解读：第一，在系统延时相同的情况下，采用`FPGA`进行硬件加速后的系统吞吐量提升了接近一倍；


