    然而，这项成果表明，在 1997 年就可以使用基于 0.6μm 工艺的赛灵思 XC2100A FPGA 以 250MHz 时钟频率运行。时至今日，这个性能对于大多数
    45nm FPGA 器件的开发者来说都是可以接受的。


    诚然，为了实现这个性能确实需要对 FPGA 设计进行相当多的优化，包括仔细的布局、流水线设计，以及严格规划信号在一个周期内传输的距离和位置等。值得注意的是，这项工作阐述了整体的设计方法论，并为
    CAD 工具及 FPGA 架构研究提出了很多前瞻性的指导，以充分发挥 FPGA 的最大性能。之后的很多研究，包括 GARP、HSRA、CHESS、SFRA、Tabula
    等，以及互连重定时、流计算模型等，都是基于这个成果的发展。


    这项工作是 FPGA 应用领域研究的代表性成果之一。它展示了超越传统认知的 FPGA 性能结果，并详细说明了如何利用 FPGA 的架构特点来实现这一超越。这些都为
    FPGA 相关的研究提供了宝贵经验，尽管这项成果的有些部分读起来比较晦涩，甚至像一份实验报告，但即使在今天，这项成果仍然有着很强的可读性，而且并不过时。


    ### 3. 基于 FPGA 的 CORDIC 算法研究综述

    一句话总结：使用 FPGA 进行高效算法实现的经典之作

    英文名：A survey of CORDIC algorithms for FPGA based computers

    作者：Ray Andraka

    发表时间：1998 年

    推介人：Paul Chow（多伦多大学）


    这项工作详细阐述了如何在 FPGA 上进行高效的算法实现，它可以说是这一类工作的代表性作品。1998 年，可编程 DSP 芯片被普遍用来做信号处理，当时最先进的器件有着
    128KB 的片上内存，以及 100 MIPS 的性能。对于 FPGA 而言，它能构建 DSP 无法完成的信号处理系统，但比开发一个 ASIC 又简单很多。1998
    年的 FPGA 比现在要小很多，有上千个 4 输入 LUT，正如这项成果中采用的赛灵思 4013E 器件。因此，高效和小面积的 DSP 功能实现是这类 FPGA
    设计的关键。


    自从发表以来，这项著名的成果一直是 FPGA 设计工程师在硬件中构建信号处理算法的重要参考。DSP 算法中包含很多超越函数，如正弦、余弦等，然而在硬件中计算这些函数并不像软件中直接调用库函数那么简单。当信号处理工程师开始转向使用
    FPGA 时，他们会通过这项成果意识到，为了实现高效的 DSP 算法，就需要使用不同的硬件架构和设计方案。具体来讲，这项成果阐述了 CORDIC 算法的基本理论，这个算法基于移位和加法运算，因此非常适合在
    FPGA 上实现。


    传统的 FPGA 应用研究主要是探索某种具体应用在 FPGA 的实现方式。这项成果的不同点在于，它主要针对的是广大的应用设计工程师群体，并对这个群体进行技术传播和教育。这也使得它在更广的层面上不断影响后来的研究者。


    ### 4. 对流水线可重构 FPGA 的管理

    一句话总结：可重构计算与硬件虚拟化的首次结合与探索

    英文名：Managing Pipeline-Reconfigurable FPGAs

    作者：Srihari Cadambi，Jeffrey Weener，Seth Copen Goldstein，Herman Schmit，Donald E.
    Thomas

    发表时间：1998 年

    推介人：Katherine Compton and Andre DeHon


    在 1998 年，即使是最大的 FPGA 也只有不过 5 万个 LUT，因此在一个 FPGA 上往往很难装下整个设计。此外，即使设计在当前 FPGA 上可用，当下一代
    FPGA 面市后，就不得不重新设计，至少需要对设计重新编译，以更好地利用新 FPGA 上更多的逻辑单元和容量。时至今日，FPGA 上有着上百万可编程逻辑资源，因此大多数设计通常不会受制于
    FPGA 的容量。然而，目前仍然缺乏对各代 FPGA 的兼容性与伸缩性的研究。


    这项成果中提出了 PipeRench 架构，它为 FPGA 开发者提供了动态重构的逻辑模型。它将计算看作是一个大型的静态前向图，并使用动态重构的方法来控制和交换电路中不同的部分。如果电路太大而无法由可用资源实现，那就将系统中的不同电路部分换入和换出，从而最终满足资源要求。


    PipeRench 的独特之处在于，它展示了如何通过计算实现流水线重构，从而实现在有限的内存带宽时完成快速的配置切换。当一个 PipeRench 实例编译完成并得到
    FPGA 映像之后，PipeRench 还允许这个映像被加载到更大或者更小的其他 PipeRench 实例中，并伴随着相应的性能提升或下降。这就使得 FPGA
    的弹性扩展成为可能。


    这项成果是一个开创性的大型系统项目，它涵盖了可重构计算的很多领域。这个工作阐述了配置数据的管理，并介绍了 PipeRench 架构的很多底层设计细节，它还讨论了可重构硬件的配置过程与机理，以及如何确保数据通过虚拟流水线达到合适的物理位置。综上，这项成果是可重构计算领域的标志性工作，它和它的后续工作为这个领域的研究者指明了前进的方向、可能遇到的问题，以及解决这些问题的一些创新方法。


    ### 5. FPGA vs CPU：峰值浮点性能的趋势

    一句话总结：FPGA 在浮点数计算领域的开创性工作

    英文名：FPGAs vs CPUs：Trends in Peak Floating-Point Performance

    作者：Keith Underwood

    发表时间：2004 年

    推介人：Paul Chow（多伦多大学）


    这项工作表明，FPGA 在未来的超级计算应用中有着很好的应用前景，而这个领域的应用往往需要密集的高精度浮点运算。从 FPGA 出现伊始，业界就有一种观点认为，FPGA
    可以被用来加速“计算”这一过程，尽管这并不是 FPGA 出现的初衷，也不是 FPGA 在当时的主要应用市场。在这项工作发表之时，FPGA 已经展示出在定点数计算的潜力，特别是在信号处理领域中，使用
    FPGA 比可编程 DSP 有着更好的性能优势。然而，大多数科学计算和应用都基于 IEEE 格式的浮点数，特别是双精度浮点数，以获得稳定的计算结果。在这项成果之前，人们普遍认为在
    FPGA 上无法得到足够的浮点数性能来与当时的 CPU 竞争。


    在这个工作中，作者在多代 FPGA 中实现了浮点数加法、乘法、除法、乘加等基本运算，并对它们进行了时钟频率和硬件面积的定量分析。通过结合对应 FPGA 器件的容量，这项工作分析并得到了这些基本单元的最优性能的趋势曲线。根据摩尔定律，对于
    CPU 来说，这些运算单元的性能趋势曲线都会每 18 个月翻一倍。然而对于 FPGA，这项成果表明 FPGA 的浮点数峰值性能已经或即将超过 CPU，并将继续增长。


    这项成果是第一个尝试定量分析并证明 FPGA 可以作为浮点运算加速器的工作。通过对模型的建立和分析，可以看出这个趋势在某种程度上有利于 FPGA 与 CPU
    的相互竞争。这也证明了可重构计算研究依然前途光明。然而，客观地说，这项工作的结果在很大程度上依赖于计算的峰值性能，究竟如何在实际应用中获取这样的性能，以及峰值性能与实际性能的相关性，依然是研究者不断探讨的问题。


    ### 6. FPGA 高效多端口存储器的设计

    一句话总结：在根本上改变了现代 FPGA 的内存设计和容量

    英文名：Efficient Multi-Ported Memories for FPGAs

    作者：Charles Eric LaForest，J. Gregory Steffan

    发表时间：2010 年

    推介人：Scott Hauck（华盛顿大学）


    FPGA 的一个重要特性就是能构建大量简单的逻辑模块，然后可以将这些逻辑块组合起来，并形成更大、功能更复杂的设计。虽然 FPGA 中的每个可编程单元只有 4～6
    个输入，但一组 LUT 就可以支持任意数量的输入，并完成任意功能的计算。虽然一个触发器只能存储 1 位数据，但这些触发器可以组合起来以支持 32 位数据，并再进行组合形成多级的
    FIFO。


    随着 FPGA 技术的不断演进，人们开始在 FPGA 里加入为了特定任务而优化的硬核单元，如乘法器、存储器，甚至处理器内核等。这些模块从根本上提升了 FPGA
    进行通用计算的性能，但它们的相对不灵活性使得这些模块很难相互级联并组成更大的逻辑单元。另外，对于一个特定应用，如果这些硬核单元没有相对应的逻辑功能，那么设计者就很难继续使用它们，只能转而使用传统的方法，即使用
    LUT 和寄存器等进行逻辑设计，这个问题的一个典型例子就是存储器。如果内存单元的容量太小，或者寻址空间不够大，我们或许还可以组合多个存储单元以满足设计需求。然而，如果存储器的端口数量是固定的，例如某个内存单元只能允许每周期写入两次，而应用要求每周期写入三次，那么这就很尴尬了。事实上，额外的读端口可以通过复制内存来实现，但对于
    RAM 来说，独立的写端口数量才是影响性能的重点。


    这项工作从根本上解决了这个问题。一个重要的事实是，通常情况下底层硬件的运行速度会比用户设计的实际速度要快很多，因此就可以对内存端口进行时间复用以增加独立访存的数量。此外，通过巧妙的设计，多个内存可以被组合在一起，以支持读写带宽的增长，同时保持对整个机制的控制。如果将二者相结合，就可以得到一个提供更多内存端口的有效方案。


    ## 5.3 这是最好的时代——FPGA 未来的发展方向

    纵观 FPGA 几十年的发展历程，目前 FPGA 的芯片结构、开发工具、使用场景等各个方面的发展，都已经远远超出 FPGA 出现时所设定的目标，甚至也远远超出很多人的想象。正是由于一代代研究者和工程师的不懈努力，才让
    FPGA 在不同的时代背景下，都焕发出新的生机，并不断推动摩尔定律的延续。


    展望未来，FPGA 领域仍然有着很多难题需要解决，也有着很多潜力巨大的方向，亟待学术界和工业界的研究者去探索和发现。如果仔细看一下四大 FPGA 顶级学术会议近年来发表的文章，并结合业界不断发布的最新成果和动态，就可以对
    FPGA 未来的主要发展方向看出些许端倪。


    总体而言，高层次综合和人工智能应用仍然会是未来一段时间的主流。在学术界，FPGA 四大顶级会议中每年大概有超过一半的文章都集中在这两个领域。这其中，既包括人工智能和机器学习与
    FPGA 结合的相关工作，还包括 FPGA 高层综合相关的工作，如高层语言优化、工具和 HLS 算法设计等。而高层次综合也一直是过去 5～10 年间 FPGA
    研究的重点和热点。例如，在 2019 年的 FPGA 大会上，与 AI 相关的文章有 8 篇，与 HLS 相关的文章有 6 篇，占会议接收的全部论文的一半还多。2020
    年的 FPGA 大会也延续了这一趋势，与 AI 和 HLS 相关的论文各有 7 篇和 8 篇。


    值得注意的是，人工智能和高层次综合这两个领域并非泾渭分明，而是相互耦合、相互促进和相互激发的。很多文章同时讨论了使用 HLS 对人工智能应用进行设计和加速。例如，在本书
    HLS 章节中介绍过的，2019 年丛京生教授与张志如副教授就合作开发了名为 HeteroCL 的基于 Python 的硬件加速模型，这项工作可以帮助 AI
    和 Python 开发者利用 FPGA 迅速完成 AI 图形图像算法的开发和硬件实现。类似的工作还有很多，由此可见高层次综合，特别是领域专用的高层次综合工具和算法的设计研发，将会是未来
    FPGA 发展的一个重要方向。有了更先进、更易用的开发工具，会促使更多软件和算法工程师开始使用 FPGA 作为他们算法和软件实现的硬件平台，从而进一步正向促进
    FPGA 的发展。


    此外，FPGA 在 AI 领域的应用也会越来越广泛。在第 3 章，我们介绍过人工智能算法目前正在经历爆炸式发展，但距离稳定和成熟可能还有一段路要走。为了不断提升算力，同时兼顾功耗、成本和灵活性的要求，采用
    FPGA 进行定制化架构设计就成为了一个性价比很高的选择。在这个领域中，FPGA 微架构设计、AI 加速资源的扩展、对数据吞吐量的提升等方向，会成为今后发展的重点。


    在数据中心领域，FPGA 也在开始扮演越来越重要的角色。在第 2 章，我们介绍了很多 FPGA 加速云计算和大数据处理的实际例子，例如微软的 Catapult
    项目和亚马逊 AWS 的 F1 实例等。除了云计算之外，电信网络提供商也在使用 FPGA 对自身的网络架构进行转型。这主要受到当前软件定义网络（SDN）和网络功能虚拟化（NFV）的强力推动。在第
    2 章中也提过，如何有效利用 FPGA 这种可编程硬件加速资源，探索并推广 FPGA 在数据中心里的高效部署方法，如何对这类应用场景设计有效的商业模型，以及对部署
    FPGA 带来的安全性问题等，都将是未来一段时间内业界的研究重点。


    另外，随着业界对摩尔定律存续问题的讨论不断升温，如何进一步延续芯片的性能提升，并不断降低芯片的功耗，一直是学术界和工业界投入大量人力物力的重要研究方向。我们看到，近年来新型
    FPGA 架构层出不穷，各类最新的 IP、制造工艺、封装技术等尖端科技，都将 FPGA 作为主要的实现载体，这在第 1 章中也有过详细介绍。可以预见的是，当半导体制造工艺逼近原子极限，更多诸如
    SSI、EMIB、3D IC 等“黑科技”会不断涌现，而 FPGA 也会像现在这样成为这些黑科技的集大成者。另一方面，量子计算、类脑计算、存内计算等全新的计算模式也会纷纷上场，并呈现百花齐放的局面。如何将这些新型计算模式与现有的基于
    FPGA 的可重构计算相互融合和补充，会是非常有趣的研究方向。


