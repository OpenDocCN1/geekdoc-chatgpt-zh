    # FPGA智能网卡与虚拟化技术


    Mellanox公司的这款智能网卡如图2-29所示。它包括两个主要芯片，一个是Mellanox自研的`ConnectX-5`以太网控制器，另一个是赛灵思的`Kintex
    UltraScale FPGA`。板上包含两个`25Gbps`以太网端口，并都与`ConnectX-5`相连，然后再通过`PCIe Switch`连接主机和`FPGA`。`ConnectX-5`本身就可以实现不少硬件加速功能，例如常见的虚拟交换和虚拟路由卸载，`SRIOV`、`QoS`与流量控制等。`FPGA`在这个卡上更像是一个“辅助”的加速单元，主要的设计目的是用来满足各种定制化的需求。


    ![](OEBPS/Images/Figure-P104_1189.jpg)


    图2-29　Mellanox FPGA智能网卡


    可以看到，不管是`FPGA`芯片厂商，还是服务器与第三方厂商，都开始争相布局`FPGA`加速卡市场。在这个布局的背后，更多的是对`FPGA`易用性的提升，并借此构建属于`FPGA`开发者的软硬件生态系统。有了基于`FPGA`加速卡的系统级解决方案，必将会帮助`FPGA`在更多应用领域大显身手。


    ## 2.5 虚拟与现实之间——FPGA虚拟化


    为了实现`FPGA`在数据中心的应用与部署，需要有方法对`FPGA`的硬件资源进行开发、管理和调度，而传统的`FPGA`开发方法在这里并不适用。近年来，`FPGA`的虚拟化方法逐渐成为业界关注和研究的重点。使用这种方法，可以简化`FPGA`开发流程，方便系统管理，降低`FPGA`的应用门槛。本节将详细介绍`FPGA`虚拟化方法的具体技术细节，并讨论几种常见的`FPGA`虚拟化技术，以及它们如何帮助`FPGA`在数据中心里更快、更方便地进行部署和使用。


    ### 2.5.1 为什么要进行FPGA虚拟化


    在传统的`FPGA`开发模型中，如图2-30所示，使用者通常使用硬件描述语言（`HDL`）对应用场景进行建模，并构建业务逻辑，然后通过特定的`FPGA`开发工具，将硬件模型直接映射到`FPGA`上，并由`EDA`工具自动完成布局布线和时序优化等操作，最终生成可以在`FPGA`上运行的映像文件。使用这种方法直接对`FPGA`进行开发，好处是能够任意使用需要的硬件逻辑资源，如`FPGA`上的`LUT`查找表、`RAM`、`DSP`，以及各类`I/O`模块和接口，如`PCIe`和以太网控制器等。同时，用户可以在硬件层面对设计进行有针对性的调整和优化，所以一般会得到比较高的系统性能。


    不过，这种开发方法的主要缺点之一是对开发者的技能要求很高。例如，开发者需要非常了解`FPGA`的结构及其内部资源，需要掌握硬件描述语言对设计进行建模，还需要熟练使用目标`FPGA`器件的开发、仿真与调试工具。特别是在实际工程项目中，实际掌握上述技能往往需要数年的积累。


    ![](OEBPS/Images/Figure-P106_1207.jpg)


    图2-30　传统的FPGA开发层级


    这种开发模式另外的一个主要缺点是，`FPGA`只能由单一用户开发和使用。对于一个对资源需求不大，而且不需要连续运行的应用而言，大部分`FPGA`的硬件资源在大部分时间内都会闲置。很显然，这样无法对`FPGA`的硬件资源进行充分利用。


    伴随着当前大数据浪潮的兴起，`FPGA`作为典型的硬件加速器，被越来越广泛地应用在各类数据分析、处理、传输等业务场景，并和其他通用处理器如`CPU`、`GPGPU`，以及各种与应用相关的专用处理器和`ASIC`等组成复杂的异构计算系统。这时，由于异构系统中的其他单元大都是通过软件指令进行编程，传统的基于硬件电路描述的`FPGA`开发模型就很难直接适用于异构系统的开发，这也限制了`FPGA`的进一步扩展使用。


    所以，为了提高`FPGA`的开发效率，更好地利用`FPGA`的逻辑资源，方便`FPGA`的大规模部署和应用，需要将`FPGA`进行一定程度的逻辑抽象，使顶层用户不必太多关注于`FPGA`硬件逻辑的实现方式与细节，见图2-31。由此，`FPGA`虚拟化技术应运而生。


    ![](OEBPS/Images/Figure-P107_1214.jpg)


    图2-31　新型FPGA开发模型


    简单来说，`FPGA`虚拟化可以看作在传统的开发模型中加入了一个抽象层，它就像一座桥梁，将用户开发的应用和底层的`FPGA`硬件连接了起来，如图2-32所示。在最上层，用户的应用和业务逻辑通过特定的虚拟化编译工具首先映射到抽象层，这样避免了直接对`FPGA`硬件进行操作。抽象层可以兼具任务调度、资源分配与管理等功能，这与传统虚拟化技术中的编排器（`Hypervisor`）类似。对于底层的`FPGA`，它只需实现和执行抽象层分配的任务即可。同时，硬件层中还可以包含一个完整的异构计算系统，即拥有`FPGA`、`多核CPU`、`GPU`，以及其他硬件加速芯片等。


    ![](OEBPS/Images/Figure-P108_1221.jpg)


    图2-32　FPGA虚拟化分层


    ### 2.5.2 FPGA虚拟化的主要目标


    与软件虚拟化的目标类似，实现`FPGA`虚拟化技术主要是为了将`FPGA`的特定计算资源进行抽象、分配和整合，在更高的使用层面打破它们的物理界限，从而提供更有效的`FPGA`资源管理与使用，并且兼顾扩展性与安全性。


    具体而言，作为一项正在逐步兴起的技术，工业界与学术界对于`FPGA`虚拟化的认识和定义也在不断推进和丰富。目前，我们对于`FPGA`虚拟化的主要目标的定义可以细化为以下九点：


    （1）多租户架构：通过`FPGA`虚拟化技术，能够使用相同的`FPGA`结构为多个不同的用户提供服务。值得注意的是，这里“相同的`FPGA`结构”并不一定只是代表一块相同的`FPGA`芯片，而是可以在更广义的范畴里代表多个虚拟化层级。


    （2）资源管理：利用`FPGA`虚拟化技术，可以将具体的`FPGA`逻辑资源进行抽象，同时为使用者提供相应的驱动、API，以及监控`FPGA`任务调度和资源使用的方法。


    （3）灵活性：通过使用`FPGA`虚拟化技术，使系统能够灵活地支持更加广泛的应用场景，并为之提供`FPGA`的硬件加速能力。除了应用场景不同，加速器的描述方式也应具有灵活性，既可以使用硬件描述语言（`HDL`）实现的自定义加速模块，也可以使用基于高层语言（如`C/C++`、`OpenCL`等）描述并综合地针对特定协议框架的加速结构。


    （4）独立性：通过`FPGA`虚拟化技术，将使用相同`FPGA`逻辑资源的不同用户进行逻辑分隔，确保每个用户的应用能独立、安全地运行。


    （5）可扩展性：虚拟化平台对`FPGA`的支持需要具有可扩展性。例如，在硬件层面，能够支持不同厂商的不同`FPGA`架构，同一个厂商的多代`FPGA`产品，不同的加速板卡系列等。在软件层面，需要有能力支持多种开发环境、开发语言，以及多种开发框架等。


    （6）高性能：`FPGA`虚拟化技术会不可避免地对系统性能带来一定程度的影响，同时也需要占用额外的`FPGA`逻辑资源实现特定的虚拟化功能。但是，这些性能的影响和`FPGA`的资源占用应该尽量小，从而保证每个用户对各自应用和任务的性能要求。


    （7）安全性：`FPGA`虚拟化平台应保证每个用户的信息安全，确保平台的基础架构和资源不会被恶意使用，并保护平台及其用户不被恶意用户攻击和入侵。


    （8）稳定性：`FPGA`虚拟化平台应该有能力保证系统和服务的稳定运行。


    （9）开发效率：利用`FPGA`虚拟化技术，可以大幅提高`FPGA`的开发效率，并显著缩短设计的面世时间，增加设计和应用的竞争力。


    以上这九点已经基本涵盖了设计一个完整的虚拟化计算平台所需要考虑的大部分要素。这也从另一个角度说明了开发、实现并部署`FPGA`虚拟化技术的复杂性。


    一个“完美”的`FPGA`虚拟化系统会满足所有的上述目标，并和谐地达成各类性能指标之间的相互统一。然而在实际应用中，`FPGA`并非单独存在，而是伴随着`CPU`、`GPU`，以及其他软硬件加速模块等共同作用在一个异构计算系统中。上述目标的实现，很大程度上取决于具体在哪个层面进行`FPGA`虚拟化，这个层次的划分，会直接影响多个虚拟化系统的设计要素，例如`FPGA`如何与其他计算单元相互耦合，系统面向的是通用领域还是针对某些特定应用，开发方式是采用高级语言描述还是硬件语言，开发团队熟悉和擅长的`FPGA`架构及开发工具是什么。这些设计要素也会反过来影响和制约上述`FPGA`虚拟化目标的实现。


    ### 2.5.3 FPGA虚拟化的层次划分


    对于硬件加速器虚拟化或`FPGA`虚拟化的分类，业界并没有一个明确的定义或标准。2004年，瑞士苏黎世联邦理工大学的Christian Plessl等人将`FPGA`虚拟化划分为三个层次：


    （1）时域划分（`Temporal Partitioning`）：将一个较大的设计分解成若干个较小的模块，并通过重新配置`FPGA`，采用类似时间片轮转的方式顺序执行这些小模块。这通常适用于`FPGA`出现早期、硬件资源较为缺乏的阶段。同时也在某种程度上适用于某些应用场景中`FPGA`硬件资源受限的情况。


    （2）虚拟化执行（`Virtualized Execution`）：将一个应用划分成多个可以相互通信的运行单元或任务，每个任务可由一类`FPGA`器件系列完成，而非针对某种`FPGA`，这样`FPGA`的特定资源或结构就被虚拟化了。应用中的多个任务由统一的运行环境进行调度，这种方式类似于`CPU`或微处理器中的指令集的定义与执行方法。


    （3）硬件虚拟机（`Virtual Machine`）：这是更高层级的虚拟化，它引入了一层硬件抽象架构，使得开发者不用关注`FPGA`底层的具体结构和资源。设计会通过软件工具重新翻译映射到`FPGA`上。


    随着`FPGA`技术的发展，单片`FPGA`的容量、资源以及处理能力飞速增长，`FPGA`的应用场景也不断扩展，因此上面对于`FPGA`虚拟化层级的划分逐渐开始显得不够全面。2018年，曼彻斯特大学的Anuj
    Vaishnav等人将`FPGA`虚拟化根据计算系统的抽象程度重新划分成以下三个层次：


    （1）资源级（`Resource Level`）虚拟化：主要划分依据是`FPGA`的片上资源的虚拟化程度，具体包括架构虚拟化和`I/O`虚拟化两类。


    （2）单节点级（`Node Level`）虚拟化：即虚拟化的最小粒度为单个`FPGA`器件，资源管理和基础设施的搭建都围绕着单个`FPGA`器件展开。


    （3）多节点级（`Multi-node Level`）虚拟化：虚拟化的最小粒度为多个`FPGA`器件，这主要适用于使用多个`FPGA`的大型应用场景。


    这三个虚拟化层次与软件虚拟化的大致对应关系如图2-33所示。


    不管采用何种层次划分的方法，其核心都离不开如何使用单个或多个`FPGA`的相关逻辑资源，以及如何开发相应的虚拟化软件与工具。为了实现虚拟化而引入的抽象层，既可以是一层，也可以由多层抽象组合而成。不同的抽象层次与各种虚拟化目标之间，往往是此消彼长的关系，而且很难全部满足。在图2-34中，我们将虚拟化的层次按照单`FPGA`和多`FPGA`分成两大类，并总结了这两大类包含的常见的`FPGA`虚拟化方法，以及它与`FPGA`使用灵活性、开发风格与开发效率等性能指标的对应关系。


    ![](OEBPS/Images/Figure-P112_1252.jpg)


    图2-33　FPGA虚拟化层次与软件虚拟化（`JVM`）层次的大致对应关系


    随着虚拟化程度的不断增加，对`FPGA`片上资源的使用灵活性会逐渐下降，这有多方面的原因。其一是由于需要使用额外的`FPGA`资源实现虚拟化管理的相关逻辑，另一方面则是因为通过软件进行多个`FPGA`资源的分配和管理时，很难与人工优化的结果相比。但是抽象程度越高，其开发风格就更类似于软件开发，因此开发效率就会越高。


    ### 2.5.4 常见的FPGA虚拟化实现方法


    本小节将介绍三种`FPGA`虚拟化实现方法：`Overlay`、部分可重构与虚拟化管理器、`FPGA`资源池与虚拟化框架。


    ![](OEBPS/Images/Figure-P113_1264.jpg)


    图2-34　不同抽象层次与多个性能指标之间的相对关系


    #### 1. Overlay


    `Overlay`本意是覆盖或叠加，它在网络技术里是一种构建虚拟逻辑网络的方法。它的实现方法通常是在物理网络架构的基础上，增加一层虚拟的网络平面，使得上层应用与底层物理网络相分离。这个虚拟的网络平面本质上可以通过隧道封装技术实现，在数据中心网络中常用的`VxLAN`就是`Overlay`的主流标准之一。


    `FPGA Overlay`可以说是目前应用最广泛的`FPGA`虚拟化方法之一，和网络技术相似，`FPGA Overlay`是一层位于`FPGA`硬件层之上，并连接顶层应用的虚拟可编程架构，如图2-35所示。


    ![](OEBPS/Images/Figure-P114_1272.jpg)


    图2-35　Overlay结构图


    `Overlay`的具体实现形式有很多种，它既可以是工程中常用的软核通用处理器，如英特尔的`NIOS-II`和赛灵思的`MicroBlaze`，也可以是一组支持更高级编程模型的可编程逻辑处理单元，称为`CGRA`（`Coarse-Grained
    Reconfigurable Array`），或者是一些实现特定功能的专用处理器，如Virtual Box公司开发的针对加速向量计算的向量处理器（Vector
    Processor）等。


    使用`Overlay`的主要目的是为上层用户提供一个他们更为熟悉的编程架构与接口，便于他们通过高层语言对`Overlay`中的通用处理器等进行编程，而无需担心具体的硬件电路实现，由此实现了对`FPGA`底层硬件资源的抽象和虚拟化。另外，由于`Overlay`层提供的逻辑处理单元或软核处理器通常与底层`FPGA`硬件无关，因此方便了上层设计在不同`FPGA`架构之间的移植。


    使用`Overlay`的另外一个好处是可以在很大程度上缩短`FPGA`的编译时间。在传统的`FPGA`开发流程中，`FPGA`的编译需要经过逻辑综合、映射、布局布线等步骤，整个编译过程通常会长达几个小时之久。由于`Overlay`层的逻辑架构相对固定，因此可以由`Overlay`的开发者提前进行全部或部分编译。用户在使用时，只需编译自己编写的逻辑部分即可，这样大大缩短了整体的开发时间，也方便对应用进行调试和修改。


    `Overlay`技术与高层次综合（`High-Level Synthesis`，`HLS`）技术的主要区别在于，前者引入的`Overlay`层并不能完全隐藏底层的`FPGA`结构，由此可能带来额外的开发难度和成本。这通常体现在两个方面：


    （1）`Overlay`层往往不能实现上层用户的全部逻辑。例如使用`FPGA`软核处理器时，通常用它们进行数据通路和逻辑的控制，但仍然需要专门的硬件工程师开发数据通路的部分。


    （2）`Overlay`还没有一个业界统一的标准化开发模型。如果在`Overlay`中使用专门的处理器阵列或`CGRA`，由于现在并没有一个类似在`HLS`中采用的通用标准，那么就需要软件工程师提前学习和掌握所用的`CGRA`的编程模型，也需要有硬件工程师团队负责在`FPGA`中实现和优化`Overlay`层中的`CRGA`硬件电路。


    #### 2. 部分可重构（Partial Reconfiguration）与虚拟化管理器（Hypervisor）


    部分可重构是`FPGA`的主要特点之一，它体现了`FPGA`特有的灵活性。具体来说，可以将`FPGA`内部划分出一个或多个区域，并在`FPGA`运行过程中单独对这些区域进行编程和配置，以改变区域内电路的逻辑，但并不影响`FPGA`其他部分的正常运行。这使得`FPGA`可以在时间和空间两个维度，由硬件直接进行多任务的切换，如图2-36所示。


    ![](OEBPS/Images/Figure-P116_1280.jpg)


    图2-36　通过FPGA部分重构进行多任务切换


    利用部分可重构技术，可以将`FPGA`划分成若干个子区域，作为虚拟`FPGA`供单个或多个用户使用，同时保留一部分逻辑资源作为不可重配置区域，用来实现必要的基础架构，如内存管理与网络通信等。


    一个典型的例子是微软的Catapult项目。在前文提到的Catapult第二阶段的工作中，每个`FPGA`都在逻辑上被划分成“`Role`”和“`Shell`”两部分。其中，`Role`即为可重构的逻辑单元，可以根据不同用户应用进行编程和配置；`Shell`即为不可重配置区域，包含了不同应用都可能需要的基础架构，例如`DRAM`控制器、高速串行收发器、负责与主机通信的`PCIe`模块与`DMA`、控制重构的`Flash`读写模块，以及其他各种`I/O`接口等。


    另外一个基于`FPGA`部分可重构技术进行`FPGA`虚拟化的例子，是IBM的cloudFPGA项目。在它2015年发表的文章中，`FPGA`被划分成三部分：管理层（`Management
    Layer`）、网络服务层（`Network Service Layer`）以及虚拟`FPGA`层（`vFPGA`），如图2-37所示。


    ![](OEBPS/Images/Figure-P117_1288.jpg)


    图2-37　IBM cloudFPGA结构示意图


    其中，`vFPGA`本质上就是一个或多个可以动态重构的`FPGA`区域，它们可以共同属于一个用户，或分属多个用户，运行着相同或不同的应用。在一个`vFPGA`进行动态重构时，其他`vFPGA`的运行不会受到影响。管理层是不可被用户配置的区域，主要负责对这些`vFPGA`进行内存的分配和管理。`vFPGA`和管理层类似于传统虚拟化架构中虚拟机和编排器的关系。网络服务层则主要负责控制多个`vFPGA`与数据中心网络的通信，并在`FPGA`硬件上实现了L2-L4层网络协议，供所有`vFPGA`使用。


    为了通过部分重构技术进行`FPGA`虚拟化，通常都需要引入额外的管理层，用来对虚拟后的`FPGA`进行各类资源的统一管理与调度。但是，管理层的引入势必会占用原本可以用于应用逻辑的可编程资源，同时对系统的整体性能带来负面影响。


    另外，对`FPGA`强行划分多个可重构区域，也可能会严重影响系统性能。例如，一旦划分了可重构区域，就代表着其他应用逻辑不能使用该区域内的硬件资源，这样会严重影响编译时布局布线的灵活度，导致某些时序路径必须“绕道”，以避免这些可重构区域，从而造成过长的布线延时。另一方面，如果划分了过少的可重构区域，就可能会造成`FPGA`资源的空置和浪费。因此，如何优化`FPGA`上可重构区域的划分数目，以及针对动态重构进行布局布线工具的优化设计，是当前学术界和工业界正在探索的问题。


    #### 3. FPGA资源池与虚拟化框架


    为了实现多用户的支持，与其在单一`FPGA`芯片上使用动态重构技术划分多个可重构区域，不如使用多个`FPGA`级联，使每个`FPGA`负责单个或少量用户，并通过一个整体的虚拟化框架完成系统的集成与资源调度。同样的，这个架构也可以支持单一用户同时需求多个`FPGA`的应用场景。这种多租户的`FPGA`虚拟化架构通常需要软硬件两个层面的支持，如图2-38所示。


    ![](OEBPS/Images/Figure-P118_1296.jpg)


    图2-38　FPGA资源池与虚拟化框架示意图


    在硬件层面，需要实现多`FPGA`互连，形成`FPGA`“资源池”，同时也要支持其他硬件结构，例如`CPU`、`GPU`，或者其他硬件加速器等。在软件层面，需要有一个虚拟化框架，对用户任务进行有效的`FPGA`部署。具体来说，就是对各类硬件资源进行分配调度，管理包括`FPGA`在内的各个加速器之间的通信和数据传输，控制`FPGA`的连接方式，以及对`FPGA`进行动态重构和配置等。

