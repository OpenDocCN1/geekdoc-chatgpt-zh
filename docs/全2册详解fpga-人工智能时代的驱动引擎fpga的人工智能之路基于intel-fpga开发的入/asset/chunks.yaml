    ## 3.2 AI 加速引擎：FPGA 与深度神经网络的近似算法


    通常来说，AI 系统的推断（Inference）是包括 FPGA 和 ASIC 在内的硬件加速器的主要应用领域。伴随着 AI 应用的爆发式发展，推断的应用场景也在不断丰富和变化。与
    AI 训练往往在数据中心内进行不同，推断计算可以在数据中心、基站、自动驾驶汽车、摄像头等多种多样的场景进行。因此，需要推断芯片有着更高的灵活性，同时对实时性、吞吐量、能效和成本有着更高的要求。


    另一方面，AI 推断对算力的需求并没有因为应用场景的丰富而妥协太多，此外，计算准确度也一直是评价 AI 推断系统的重要标准之一。作为当前 AI 训练的主力器件，GPU
    有着强大的并行浮点数运算能力，而且它的单指令多线程（SMIT）和单指令多数据（SIMD）架构决定了 GPU 非常适用于处理高密度的浮点数矩阵计算。然而，在推断计算中，这样高密度的浮点数运算势必会对系统的能效、实时性，以及数据的存储和移动造成很大压力，并很难满足在推断计算中不同应用场景的灵活性需要。因此，如何进一步降低深度神经网络推断的计算复杂度和数据的存储与访问需求，是学术界和工业界不断研究的方向。


    越来越多的研究发现，在深度神经网络（DNN）中采用近似化的方法，可以在几乎不损失推断精度的情况下，极大地提升系统性能。到目前为止，业界常用的 DNN 近似化方法包括：用低精度定点数代替浮点数，网络剪枝，网络结构优化和压缩等。而
    GPU 的 SMIT 和 SMID 架构并不适用于这些近似化后的低密度数据集，导致其性能优势丧失，再加上 GPU 高昂的功耗支出，从而使 GPU 无法满足此时系统对能效的综合要求。


    相比之下，包括 FPGA 和 ASIC 在内的定制化硬件可以有效地实现上述 DNN 近似化方法，这也使得定制化硬件逐渐在 AI 推断计算中占据了主导地位。在上一章介绍过，FPGA
    与 ASIC 相比有着更强的灵活性，并在性能、功耗和开发成本上取得了良好的折中。近年来，FPGA 技术和架构也在不断发展和演进。例如，在英特尔 Stratix10
    系列和 Agilex 系列的 FPGA 上，集成了硬核浮点数 DSP 单元、大量片上内存单元，以及片外高速存储单元 HBM 等。再例如，在赛灵思的 ACAP
    器件上，集成了专门用于 AI 推断计算的加速引擎。FPGA 公司早已将人工智能应用看作公司未来的重要发展方向之一，并全力投入和布局，这部分内容将在下一节详细介绍。与此同时，由于高层次综合工具的不断进步和普及，FPGA
    的易用性也有了极大的提升。因此，我们看到越来越多的研究和应用都在使用 FPGA 作为加速 DNN 推断的硬件平台。


    在本节接下来的部分，将详细讨论几种常见的 DNN 近似算法，以及使用 FPGA 对其进行硬件加速的独特优势。


    ### 3.2.1 使用低精度定点数代替浮点数


    使用低精度的定点数代替浮点数是一种最常见的 DNN 近似方法。这种方法的思路非常直接，就是在损失一部分理论精度的基础上，换取更加简单的硬件实现，从而获得更高的并行度、更高的吞吐量，以及更低的访存开销。


    由于低精度定点数会不可避免地带来一定的精度损失，这个领域研究的热点之一就是如何在保持很高吞吐量和能效比的同时，尽量提升计算精度。在早期的研究中，每层网络都使用相同精度的定点数。由于每层权重的范围很可能不同，而且可能差别很大，这样会带来较大的截断和量化误差。因此这种方式在整体精度上的表现往往不尽如人意。为了应对精度损失，有研究提出以每层为单位，自动选择定点数精度。也有研究专注于改进数据表示的舍入方法，例如采用随机舍入算法（Stochastic
    Rounding）等。


    这种使用低精度定点数代替浮点数计算的方法，特别利于 FPGA 的实现。一方面，FPGA 可以自定义数据总线的位宽，甚至可以采用单比特的数据表示方法。另一方面，FPGA
    的 DSP 单元里包含了不同精度的定点乘加模块。例如，在现有的英特尔 FPGA 中，已经可以支持固化的定点数以及 FP32 浮点数计算。在 Agilex FPGA
    中，又扩展支持了 FP8、FP16 和 BFLOAT16 运算，同时增加了 9×9 乘法器数量，以及乘法器的不同配置方式。这都使得 FPGA 在实现自定义精度
    DNN 时有着比 GPU 和 ASIC 更灵活的优势。


    例如，Nurvitadhi 等人在 2017 年的研究表明，与英伟达的 Titan X GPU 相比，在英特尔 Stratix10 FPGA 上使用 6 位定点数时，可以得到超过
    50%的性能提升。此外，由于 FPGA 有着更低的能耗，此时 FPGA 的能耗达到了 GPU 的两倍，见图 3-6。


    ![](img/Figure-P135_1412.jpg)


    图 3-6　FPGA 使用 Int6 精度时的性能对比


    ### 3.2.2 网络剪枝


    顾名思义，网络剪枝是去除 DNN 中多余连接的过程。这里的多余连接，既可以是多余的神经元，也可以是低权重的网络突触，如图 3-7 所示。通过网络剪枝，网络结构得到大幅简化，从而可以极大地减少神经网络的存储需求，并提高计算效率。


    在网络剪枝领域最具代表性的工作之一，是深鉴科技联合创始人韩松在斯坦福期间完成的迭代剪枝方法。它借鉴了人类大脑发育过程中的神经元“剪枝”过程，并对每层网络迭代进行剪枝—再训练方法。这样，可以将神经网络进行大幅压缩。在韩松等人于
    2015 年 NIPS 大会上的文章*Learning both Weights and Connections*中表示，使用 ImageNet 数据集时，这种剪枝方法可以将
    AlexNet 和 VGG-16 的参数数量缩小到 1/9 和 1/13，并且没有精度损失。此外，对于 GoogleNet、SqueezeNet 和 ResNet-50
    网络来说，它们约有 70%的参数可以被剪枝，而不会在 ImageNet Top-1 和 Top-5 精度上有任何损失。


    ![](img/Figure-P136_1422.jpg)


    图 3-7　网络剪枝示意图


    剪枝会将原先的密集型网络转换成稀疏型网络。如前文所述，GPU 并不适合于对稀疏矩阵运算进行加速，而 FPGA 对此却非常合适。在 2017 年的 FPGA
    国际研讨会上，韩松等人发表了名为*ESE*：*Efficient* *Speech* *Recognition* *Engine* *with* *Sparse*
    *LSTM* *on* *FPGA*的文章，介绍了一种利用 FPGA 加速稀疏 LSTM 模型的方法和硬件架构，特别是其中稀疏矩阵向量乘法和单元乘法器的设计方法。当该架构在赛灵思
    Kintex UltraScale 器件上实现后，相比英特尔 Core i7 5930k CPU 和英伟达 Pascal Titan X GPU 分别可以得到
    43 倍和 3 倍的性能提升。由于 FPGA 高能效的特性，本例中 FPGA 的能效比 CPU 和 GPU 分别高 40 倍和 11.5 倍。


    ### 3.2.3 深度压缩


    深度压缩由韩松在 2016 年提出，它可以说是上述多种技术的集大成者。总体来说，深度压缩分三步进行，如图 3-8 所示。第一，先进行前面介绍的迭代剪枝方法，在保留精度的同时去掉低权重的网络分支。第二，进行权值量化和共享。这一步可以使多个连接共享相同的权重，这样就只需要保存有效权重及索引，而无须保存整个权重矩阵。此外，由于采用了共享权重，保存时也不需要很长的位宽。第三，采用了霍夫曼编码，对非均匀分布的权重进行进一步无损压缩。通过深度压缩算法，将
    AlexNet 压缩了 97%，从 240MB 减少到 6.9MB；将 VGG-16 压缩了 98%，从 552MB 压缩到了 11.3MB。由于深度压缩出色的性能和学术贡献，这篇名为*Deep*
    *Compression*：*Compressing* *Deep* *Neural* *Networks With* *Pruning*，*Trained*
    *Quantization* *and* *Huffman* *Coding*也获得了 2016 年 ICLR 大会的最佳论文奖。


    ![](img/Figure-P137_1443.jpg)


    图 3-8　深度压缩算法流程


    深度压缩带来的最直接的好处之一，就是大幅减少了内存的使用。一方面，减少了访存带来的延时和功耗开销，另一方面则可以将压缩后的参数信息完全保存在片上内存里，而无须借助片外存储器。这对于诸如
    FPGA 的硬件加速单元来说具有重要意义。对于 FPGA 来说，它的片上内存有着很高的读存带宽，但容量较小；相比之下，虽然片外内存容量很大，但带宽相对较低，因此往往成为传统
    DNN 加速应用中的性能瓶颈。有了深度压缩方法的加持，就可以进一步打破片外内存带宽造成的性能损失，通过利用 FPGA 的片上存储单元，大幅提升系统的能效。


    ## 3.3 下一个 Big Thing：FPGA 公司在 AI 时代的布局


    ### 3.3.1 赛灵思


    2018 年，赛灵思的新任 CEO Victor Peng 正式走马上任。与很多具有市场营销背景的职业经理人不同，这位台湾出生、纽约皇后区长大、康奈尔大学毕业的首席执行官一直都有着浓厚的工程背景。上任伊始，他就宣布要将赛灵思进行战略转型，将数据中心作为公司的优先发展方向。在这其中，AI
    则是最为重要的应用领域。


    在 Victor Peng 上任后第一年，赛灵思就推出了名为 ACAP 的下一代计算平台。在发布时，赛灵思就再三强调 ACAP 是整合了硬件可编程逻辑单元、软件可编程处理器，以及软件可编程加速引擎的计算平台产品。和
    FPGA 相比，ACAP 最主要的架构创新之一，就是集成了 AI 加速引擎系列，主要用来加速机器学习和无线网络等应用中常见的数学和矩阵计算。可以说，这款芯片产品就是为了
    AI 而生。


    同年七月，赛灵思收购了我国的 AI 芯片初创企业公司——深鉴科技，这距离深鉴科技刚完成的 A+轮融资还不到 9 个月。作为国内的明星初创公司，深鉴科技在创立伊始就备受关注。深鉴科技最大的特点之一就是几位来自清华大学的创始人，他们有着深厚的学术背景，尤其是在
    FPGA 和 AI 的交叉领域深耕多年，因此公司在学术研发方面有着过硬的实力。赛灵思一直是深鉴科技的 FPGA 提供商、主要合作伙伴和投资者，曾领投了深鉴科技的
    A 轮融资。


    2019 年，赛灵思发布了 Vitis 设计软件，其中包含专门针对 AI 应用的面向软件的开发框架和库文件，并提供了一些预先训练和优化过的 AI 模型。包括来自深鉴科技的深度压缩、量化、剪枝等技术，以及深鉴科技的
    DNNDK 开发框架，也被整合成为 Vitis 的 AI 优化器。


    ### 3.3.2 英特尔


    和赛灵思相比，英特尔的 FPGA 业务只占它业务总量很小的一部分。从公司层面来看，英特尔在人工智能领域有着比赛灵思更为广阔的布局。由于错过了移动计算时代，人工智能芯片就成为了英特尔不能再错过的重要发展方向。特别是在数据中心领域，英特尔面临着巨大的挑战和压力。例如，英伟达的
    GPU 已经基本占据了数据中心 AI 训练计算的垄断地位。与此同时，各大云数据中心巨头，如国外的谷歌、亚马逊、微软、脸书，以及国内的阿里、腾讯、百度等公司，都在相继研发深度学习加速芯片，并不断加大投入。对于英特尔来说，必须尽全力在最短的时间内占有最大的市场份额，以免重蹈移动计算时代失利的覆辙。


    近年来，英特尔相继收购了多家 AI 芯片初创公司，例如专注于终端 AI 计算的 Movidius、专注于无人驾驶的以色列公司 Mobileye、专注于云端
    AI 计算的 Nervana 和 2019 年完成收购的同样来自以色列的 Habana Labs 等。随着这几年的发展，这些公司已经逐渐成为了英特尔 AI
    布局的重要推动力量。例如，近年来 Mobileye 连续多个季度取得创纪录的两位数增长，并成为英特尔增长速度最快的业务部门；Movidius 和 Nervana
    相继推出了多款用于各自领域的 DNN 训练和推断 ASIC 芯片，如 NNP-I 和 NNP-T 等。在 2020 年初，英特尔更是决定大幅调整 AI 芯片路线图，将
    Habana 的 Gaudi 系列 DNN 训练芯片和系统作为旗下 AI 芯片的主打方案。


    英特尔在自己的传统优势项目——数据中心 CPU 领域，也在不断加入针对 AI 应用的加速模块和优化，例如在 Xeon 可扩展处理器中加速 AI 推断的“深度学习加速引擎（DL
    Boost）”。此外，英特尔还在加紧自研高性能独立 GPU 的步伐，并已经在多个场合宣传过旗下名为 Xe 的独立 GPU 产品。


    英特尔的 AI 产品版图并不止于 CPU、ASIC 和 GPU。虽然 FPGA 对于英特尔整体业务的占比不大，但 FPGA 在 AI 领域的数据传输、计算和硬件加速等多个应用场景都有着重要意义。在
    FPGA 领域，英特尔在 2019 年发布了新一代 FPGA 旗舰 Agilex 产品系列，其中包含了很多针对 AI 计算而优化的硬件单元，如可变精度 DSP
    等，这在第 2 章中有详细介绍。


    和赛灵思一样，英特尔的 FPGA 部门也在通过收购来扩展自己在 AI 领域的技术储备和竞争力。2019 年 4 月，英特尔收购了一家名为 Omnitek 的英国公司。虽然
    Omnitek 的主营业务是开发和提供基于 FPGA 的视频和图像处理 IP，包括超高清视频图像的旋转、形变、3D 映射、编解码等，但这家公司在深度学习领域也颇有造诣。在
    2018 年底，Omnitek 发布了一款自研的深度学习处理器（DPU），与前文提到的微软 DPU 相比，Omnitek 的 DPU 有着自己独有的特点。


    简单来说，用户可以使用 TensorFlow、Caffe 或者 OpenVINO 等主流机器学习框架构建的模型，或者是自己用高层语言编写的模型，通过 DPU
    编译器生成特定的微代码（Microcode），这与微软 DPU 采用数据流图的方式不同。这些微代码将被用来配置 FPGA 上的 DPU 数据处理流水线。


    ![](img/Figure-P141_1475.jpg)


    图 3-9　不同模型的网络拓扑


    OmnitekDPU 的另一个主要特点是可以通过编程，调整对不同 DNN 拓扑的支持效率。通常来讲，某种 DNN 硬件加速器往往是针对某种特定的 DNN 拓扑设计的。以谷歌的
    TPU 为例，它对于阿尔法狗所使用的 CNN 模型有着高达 78.2%的运行效率，平均性能也可以达到 86TOPS。然而对于另外的 CNN 模型，如 GoogleNet，谷歌
    TPU 只能达到 46.2%的运行效率，性能也骤降至 14.1TOPS。由此可见，不同 CNN 模型对于单一硬件架构的实际性能有着很大影响。除 CNN 之外，诸如
    RNN 和 MLP 等其他 DNN 拓扑有着和 CNN 明显不同的特点。随着人工智能理论研究的不断推进，想必会不断涌现出其他更加新颖的网络拓扑结构，如图 3-9
    所示。因此，如果使用相同的硬件架构对这些 DNN 拓扑“一视同仁”，则必然不会得到满意的性能。对于这种情况，也只有 FPGA 能够快速调整硬件结构，以适应不同的网络拓扑结构，这是
    ASIC 或 GPU 都无法实现的。


    ### 3.3.3 Achronix


    和之前的两家老牌 FPGA 厂商相比，Achronix 可以说是 FPGA 领域近年来冉冉升起的一颗“新星”。说是新星，其实这家总部位于美国硅谷 Santa
    Clara 的公司距成立至今已经有 16 年的历史。但就在这两年，Achronix 取得了飞速发展，其季度营收从 2016 年第四季度的 500 万美元，一年后跃升至
    4000 万美元，并成为当时世界上发展速度最快的半导体公司之一。


    在 2019 年 5 月底，Achronix 发布了名为 Speedster7t 的 FPGA 产品，主打高速网络传输、机器学习加速等热门领域，并有着和赛灵思、英特尔等
    FPGA 巨头正面对决的势头。Speedster7t 针对 AI 计算加速做了充分的优化，例如，这款 FPGA 上集成了多个机器学习处理器，可以支持不同定点数及浮点数的运算操作。此外，Speedster7t
    最多能集成 300Mb 片上内存，和英特尔的高端产品 Stratix10 FPGA 的内存容量近似。


    另外，Speedster7t 还集成了很多当前的最尖端的技术。这款 FPGA 将基于台积电的 7nm 工艺制造，这与赛灵思的 ACAP 芯片相同，与英特尔
    FPGA 的新旗舰 Agilex 系列相比也有很强的竞争力。


    在芯片架构方面，这款 FPGA 采用了遍布芯片的 2D 片上网络技术，这与赛灵思的 ACAP 产品再一次不谋而合。片上网络的出现是为了应对现在不断出现的高吞吐、低延时的应用场景。例如，在数据中心、5G
    等领域，已经需要 FPGA 线速处理高达 400Gbps 的以太网流量。如果使用传统的设计方法，需要 1024 位宽的数据总线，并运行在 724MHz 的时钟频率下才能满足带宽要求。此外，可编程逻辑单元往往需要从芯片的不同位置传输数据，包括片上和片外的存储器，以及特定的硬件加速模块，如机器学习加速器等。为了在片上进行大量数据传输和搬运，必须采用全新的片上网络技术。


    在 Speedster7t 上采用了横向和纵向的 2D 片上网络，并使用 256 位宽的 AXI 总线实现，运行在高达 2GHz 的频率下，从而提供单路 512Gbps、总共
    20Tbps 的片上网络带宽。除了满足带宽要求，通过使用片上网络还能将片上逻辑单元划分成相对粗粒度的区域，从而极大降低布局布线算法的复杂度，也能提高时序收敛的速度。


    可以说，Achronix 历时 16 年的发展，从无到有、从小到大，直到今天拥有了能和两大 FPGA 巨头公司一较高下的技术储备和实力。它在 AI 时代的表现值得我们继续关注。


    ## 3.4 路在何方：FPGA 在 AI 时代未来的发展方向


    人工智能和深度神经网络等算法的发展日新月异，相比 CPU、GPU 和 ASIC 而言，FPGA 有着独特的竞争优势。我们也应该看到，FPGA 及可编程逻辑技术也在不断更新和进步，以不断适应层出不穷的新算法、新应用和新要求。


