- raw: "前文提到的微软Catapult项目和IBM cloudFPGA项目都有各自的对多租户的支持。例如，在Catapult第三阶段的工作中，每个FPGA内都集成了一个弹性路由单元（Elastic\
    \ Router），多个用户可配置模块（Role）可以通过这个弹性路由提供的虚拟通道与外界进行网络通信。在更高层面，Catapult提出了一种“硬件即服务（Hardware\
    \ as a Service，HaaS）”的使用模型，这个HaaS模型通过一个中心化的资源管理器（Resource Manager，RM），对数据中心里的FPGA资源进行统一管理和调度。每个FPGA资源池中，都有一个服务管理器（Service\
    \ Manager，SM）通过API与RM进行通信。SM对整个资源池的FPGA进行管理，实现如FPGA负载均衡、互连管理、故障处理等功能。\n\n在cloudFPGA项目中，FPGA与CPU完全解耦，直接作为网络设备接入数据中心网络，并成为池化的硬件加速资源。同时，IBM提出了一个基于OpenStack的虚拟化框架和加速服务，使得用户可以通过在FPGA中预先设定的管理员IP地址，对FPGA资源池进行服务注册、任务分配、FPGA配置以及使用。\n\
    \n在池化FPGA和虚拟化框架领域其他的代表性工作还有来自英国Maxeler公司开发的基于FPGA的数据流引擎（Dataflow Engine），如图2-39所示。在传统的基于CPU的计算架构中（图2-39a），CPU通过读取内存中的指令和数据进行相应的计算，当前指令的计算结果会写入内存，并读取下一条指令和数据，直到程序运行结束。在基于数据流的架构（图2-39b）中，只需在应用开始时从内存中读取数据，随后会在FPGA上进行数据流处理和计算，所有中间数据不会返回内存，直到计算结束，这样从根本上规避了访存的性能瓶颈。多个数据流引擎的计算节点可以互连，并与x86\
    \ CPU、网络单元、存储单元等共同组成完整的计算集群。\n\nMaxeler公司还提供了一种类似于Java的编程语言，称为MaxJ，用来对数据流图进行描述和建模。然后通过对应的编译器MaxCompiler，将数据流图映射到底层的FPGA硬件平台，从而对上层用户虚拟化了底层电路逻辑的具体实现。目前，这套数据流引擎架构已经被用在多个高性能计算的应用场景，例如蒙特卡洛仿真、金融风险计算、科学计算，以及一些新兴的应用场景，如卷积神经网络的硬件加速等。\n\
    \n![](OEBPS/Images/Figure-P120_1304.jpg)\n\n图2-39　基于CPU的传统计算模型与基于数据流引擎的计算模型\n\n\
    在虚拟化框架协议方面的另一个主要工作是对MapReduce框架的FPGA支持。MapReduce是Google提出的针对大规模数据处理的并行计算框架，已被用于多种计算平台和架构，如多核CPU、Xeon\
    \ Phi和GPU等。通过MapReduce框架，上层用户只需要调用给定的软件库和API，而不需要知道底层的硬件结构。MapReduce的核心即为map和reduce两个函数的实现，为了对MapReduce增加FPGA支持，可以首先设计map和reduce的FPGA硬件模块以及对应的编程接口，然后通过MapReduce框架调用，这样可以实现FPGA的分布式部署和配置。在这里，map和reduce的FPGA设计可以通过传统的硬件描述语言完成，也可以通过高层语言，如OpenCL等，并借助高层次综合工具完成设计。\n\
    \n#### ■2.5.5　FPGA虚拟化的未来研究方向\n\n为了进一步实现FPGA虚拟化技术的成熟应用和部署，目前仍然有很多问题亟待解决，特别有以下几点：\n\
    \n（1）需要对FPGA资源池、虚拟化框架以及多用户支持做更多更深入的研究。虚拟化的终极目标是对FPGA硬件资源的完全抽象，给上层用户提供一个近似于“无限”的FPGA硬件加速资源池，使得用户完全不用担心硬件的使用和分配情况，这就需要在硬件和软件两个层面进行更多深入的探索。\n\
    \n在虚拟化环境中，FPGA通常要和传统的计算平台相互配合。因此在硬件层面，需要研究更先进的高吞吐量与低延时的互连与通信的方法，以实现多FPGA、FPGA与CPU、FPGA与其他硬件加速器，以及FPGA与各种网络和存储单元之间的高速互连与通信。在软件层面，需要进一步研究虚拟化框架和协议，能够有效地实现FPGA资源池的管理和配置，并提供软硬件接口供开发者使用。这些虚拟化基础设施研究往往无法只由一个公司主导完成，而如何协调和统一多个公司开发和提出的框架和标准，也将成为充满争议的焦点。\n\
    \n（2）需要增加FPGA虚拟化环境的可扩展性。一个理想的FPGA虚拟化平台，应该支持不同的FPGA架构、不同的FPGA厂商及开发环境，以及不同的开发语言。只有这样，才能吸引不同背景的开发者使用该平台进行开发。另外，虚拟化平台应该具有足够的弹性，能够在它具体的应用场景中进行扩展。例如在大数据中心，FPGA虚拟化平台要能够应对FPGA的大规模部署，同时兼容现有的数据中心的软硬件架构和服务。\n\
    \n（3）需要进一步研究和提高FPGA虚拟化技术的安全性与可靠性。虚拟化安全一直是传统虚拟化技术的研究重点之一，而FPGA虚拟化又有其独有的安全性与可靠性问题需要解决。由于FPGA具有硬件可编程的特性，一旦被恶意用户控制，不仅会造成软件服务的中断和入侵，还可以随意改变硬件电路逻辑，甚至造成大规模的硬件瘫痪。例如，德国卡尔斯鲁厄理工学院（KIT）的研究人员在2017年指出，现代FPGA架构都有可能被远程攻击和控制，并实施电气层面的破坏，使得FPGA无法通过重新编程进行恢复，而必须手动断电并重启整台服务器，这在大规模部署FPGA时会造成灾难性后果。因此如何在FPGA虚拟化平台中增加更多安全性和可靠性的支持，会是今后FPGA虚拟化研究的一大重点。\n\
    \n### 2.6　本章小结\n\n在FPGA诞生后的近二十年时间里，FPGA的主要作用都是作为芯片流片前的原型验证和硬件仿真平台而存在的。但随着技术和文明的车轮不断滚滚向前，FPGA这个已经步入“而立之年”的芯片产品在大数据时代又重新焕发了新生。\n\
    \n在云数据中心里，FPGA首先作为网络数据加速器，在微软占据了一席之地。通过几个阶段的不断更新和迭代，微软已经在遍布全球的云数据中心里部署了上百万个基于FPGA的加速卡。有了完善的基础设施的加持，这些FPGA加速器和资源池就可以在很多其他应用领域大显身手。在下一章，我们将介绍微软如何使用FPGA构建实时AI系统，并对AI应用进行FPGA加速。\n\
    \n另一个云服务巨头，亚马逊的AWS则开创了另外一种将FPGA部署在云端的方式，即AWS-F1实例的“FPGA即服务FaaS”。这使得用户可以像操作其他CPU或GPU实例那样，对部署在公有云里的FPGA资源进行开发，并对自己的应用进行硬件加速。这种使用模式也被很多其他的互联网巨头和云服务提供商所广泛采用。\n\
    \n除此之外，电信网络提供商也开始使用FPGA作为硬件加速平台和NFV的实现载体，对网络功能进行卸载和计算加速，并推动电信网络朝着SDN进行架构转型。通过对FPGA的使用，大幅提高了软硬件资源的利用率，同时带来了系统性能的提升和功耗的下降，减少了部署和运行的成本。\n\
    \n与CPU或GPU相比，FPGA的开发难度与陡峭的学习曲线一直为开发者所诟病，这也在很大程度上限制了FPGA的广泛使用。为了解决这个问题，FPGA厂商与第三方公司都相继推出了各种FPGA加速卡产品，这在很大程度上降低了FPGA的开发和部署成本，从而进一步推动了FPGA的使用和发展。在今天，FPGA厂商已经从单纯提供FPGA芯片和底层开发工具，逐渐转变成提供基于FPGA加速卡和完整软件开发环境的全栈式解决方案。同时，第三方FPGA加速卡的出现，也极大地丰富了FPGA加速卡产品的可选择性，以针对不同应用场景下的用户需求。\n\
    \n另一方面，FPGA虚拟化技术也在不断提升和进步，这使得FPGA可以作为一个云中的虚拟加速资源而存在，使得开发者不用关心底层硬件的实现细节，只需专注于算法和应用的开发和实现。在后面的章节，我们会进一步探究FPGA当前的全新开发方法与工具，例如高层次综合，以及领域专用语言和开发等。\n\
    \n# 第3章  \n\nFPGA在人工智能时代的独特优势\n\n灵活性是FPGA最重要的特点之一。人们可以把不同的硬件设计重复加载到FPGA里，这使得FPGA可以执行不同的硬件设计和功能。另外，人们也可以在FPGA的使用现场，动态地改变它运行的功能，这也就是所谓的“现场可编程”。事实上，使用者可以每隔几秒就改变一次FPGA芯片上运行的硬件设计，因此FPGA可以非常灵活地适用于各种应用。\n\
    \n在人工智能时代，对FPGA灵活性的需求被无限放大，这主要有两方面的原因：一方面，AI应用对硬件平台的算力提出了极高的需求，又同时要求硬件架构兼顾高能效、低延时、高吞吐、可伸缩等一系列特性；另一方面，AI应用和算法层出不穷，对训练和推断任务的系统需求也不尽相同。这样一来，就急需拥有强大处理能力、有极强灵活性的硬件，以满足AI应用的需求。\n\
    \n通过FPGA，人们可以快速开展定制化计算与对应芯片架构的研究和设计，同时也可以在最大程度上保持与现有的软硬件平台相互兼容。如果具体的应用场景或算法发展得太快，或者硬件规模太小，以致开发和使用ASIC的成本过于高昂时，也可以继续使用FPGA作为实现平台。当应用规模逐渐扩大时，就可以在合适的时机，选择将这些已经成熟的定制化硬件设计直接转化成定制化芯片，以提高它们的稳定性，并降低功耗和平均成本。\n\
    \n在本章，我们将详细介绍FPGA在人工智能领域的一些典型应用实例。首先，我们将深入分析微软的脑波项目，这个项目是使用FPGA构建实时AI系统的重要里程碑，它首次在云数据中心里大规模部署了FPGA，并将其用于深度神经网络（Deep\
    \ Neural Network，DNN）的加速计算，因此对业界有着很好的启发和借鉴意义。此外，本章将从技术的角度，深入分析FPGA在人工智能时代的独特优势。最后，本章将讨论当前FPGA公司在AI领域的战略布局，以及FPGA技术在AI时代的发展方向。\n\
    \n### 3.1　实时AI处理：微软脑波项目\n\n第2章详细介绍了微软的Catapult项目。这个项目取得的主要成就是搭建了一个基于FPGA的数据中心硬件加速平台，以及各种必要的软硬件基础设施。通过三个阶段的发展，微软成功地在其遍布全球的云数据中心里部署了成千上万的FPGA加速资源。从2015年末开始，微软就在其购买的几乎每台新服务器上部署来自Catapult项目的FPGA板卡。这些服务器被用于微软的必应搜索、Azure云服务以及其他网络服务和应用。\n\
    \n更重要的是，Catapult项目通过深入的学术研究和工程实践，为微软积累了丰富的FPGA开发、部署、运维的相关经验和人才。在人工智能快速发展的今天，使用Catapult平台进行AI应用的FPGA加速，就成了合理且自然的下一步。\n\
    \n人工智能的发展很大程度上归功于深度学习技术的发展。通过使用深度学习，我们在很多传统的AI领域取得了长足的进展，例如机器翻译、语音识别、计算机视觉等。同时，深度学习也可以逐步替换这些领域发展多年的专用算法。\n\
    \n这些巨大的发展和变革，促使人们思考它们对半导体行业和芯片架构的影响。对于微软来说，它们开始重点布局针对AI、机器学习、特别是深度学习的定制化硬件架构，这也就是脑波项目（Project\
    \ Brainwave）产生的主要背景。\n\n#### ■3.1.1　FPGA资源池化的主要优点\n\n与现有的其他FPGA云平台相比，Catapult平台的最主要特点就是构建了一个遍布全球的FPGA资源池，并能对资源池中的FPGA硬件资源进行灵活的分配和使用。相比其他方案，这种对FPGA的池化有着巨大的优势。\n\
    \n第一，FPGA池化打破了CPU和FPGA的界限。在传统的FPGA使用模型中，FPGA往往作为硬件加速单元，用于卸载和加速原本在CPU上实现的软件功能，因此与CPU紧耦合，严重依赖于CPU的管理，同时与CPU泾渭分明。\n\
    \n在Catapult平台里，FPGA一跃成为“一等公民”，不再完全受限于CPU的管理。在Catapult项目的FPGA加速卡中，FPGA直接与数据中心网络的TOR交换机相连，而不需要通过CPU和网卡进行数据转发。这使得同一数据中心，甚至不同数据中心里的任意FPGA可以直接通过高速网络互连和通信，从而构成FPGA资源池。管理软件可以直接对FPGA资源进行划分，而无须通过与资源池中每个FPGA互连的CPU完成，从而实现了FPGA与CPU的有效解耦。\n\
    \n第二，FPGA池化打破了单一FPGA的资源界限。从逻辑层面上看，池化FPGA架构相当于在传统的基于CPU的计算层之上，增加了一层平行的FPGA计算资源，并可以独立地实现多种服务与应用的计算加速。在微软的数据中心里，池化FPGA的数量级以10万记，而这些FPGA的通信延时只有10μs左右。\n\
    \n对于人工智能应用，特别是基于深度学习的应用来说，很多应用场景对实时性有着严格的要求，例如搜索、语音识别等。同时，微软有着很多富文本的AI应用场景，例如网络搜索、语音到文本的转换、翻译与问答等。与传统CNN相比，这些富文本应用和模型对内存带宽有着更加严苛的需求。\n\
    \n如果结合“低延时”和“高带宽”这两点需求，传统的深度学习模型和硬件的解决方法是对神经网络进行剪枝和压缩，从而减少模型的大小，直到满足AI加速芯片有限的硬件资源为止。然而，这种方法最主要的问题就是会对模型的精度和质量造成不可避免的损失，而且这些损失往往是不可修复的。\n\
    \n与之相比，Catapult平台里的FPGA资源可以看成是“无限”的，因此可以将一个大的DNN模型分解成若干小部分，每个小部分可以完整映射到单个FPGA上实现，然后各部分再通过高速数据中心网络互连。这样不仅保证了低延时与高带宽的性能要求，也保持了模型的完整性，不会造成精度和质量损失。这便是微软脑波项目（Project\
    \ Brainwave）的起因。\n\n#### ■3.1.2　脑波项目系统架构\n\n脑波项目的主要目标是利用Catapult的基础设施与大规模的池化FPGA资源，为没有硬件设计经验的用户提供深度神经网络的自动部署和硬件加速，同时满足系统和模型的实时性和低成本的要求。\n\
    \n为了实现这个目标，脑波项目提出了一个完整的软硬件解决方案，主要包含以下三点：\n\n（1）根据资源和需求对训练好的DNN模型进行自动区域划分的完整工具链；\n\
    \n（2）对划分好的子模型进行FPGA和CPU映射的系统架构；\n\n（3）在FPGA上实现并优化的NPU软核和指令集。\n\n图3-1展示了使用脑波项目进行DNN加速的完整流程。对于一个训练好的DNN模型，系统分析工具会首先将其表示为计算流图的形式，这也称为模型的“中间表示”（Intermediate\
    \ Representation，IR）。其中，图的节点表示张量运算，例如矩阵乘法等，而连接节点的边表示不同运算之间的数据流。\n\n![](OEBPS/Images/Figure-P128_1357.jpg)\n\
    \n图3-1　脑波项目的完整计算流程\n\n计算流图表示完成后，工具会继续将整张大图分解成若干小图，使得每个小图都可以完整映射到单个FPGA上实现。对于模型中可能存在的不适合在FPGA上实现的运算和操作，则可以映射到与FPGA相连的CPU上实现。这样就实现了基于Catapult架构的DNN异构加速系统。\n\
    \n在FPGA上进行具体的逻辑实现时，为了解决前文提到的“低延时”与“高带宽”两个关键性需求，脑波项目采用了两种主要的技术措施。\n\n第一，脑波项目完全弃用了板级DDR内存，取而代之的是全部数据都存储在FPGA芯片上的高速RAM之中。相比其他方案，不管使用ASIC还是FPGA，这一点对于单一芯片的方案都是不可能实现的。在脑波项目所使用的英特尔Stratix10系列FPGA上，有着11721个512×40b的SRAM模块，相当于30MB的片上内存容量，以及在600MHz运行频率下35Tbps的等效带宽。如果只使用单一FPGA，那么对于任何DNN应用，这30MB的片上内存都是完全不够的。但正是基于Catapult的超大规模FPGA的低延时互连，才将这些在单一FPGA上十分有限的片上RAM组成了看似“无限”的资源池，并极大地突破了困扰DNN加速应用已久的内存带宽瓶颈。\n\
    \n第二，脑波项目采用了自定义的窄精度数据位宽。这个其实也是DNN加速领域的常见方法。项目提出了8～9位的浮点数表达方式，称为ms-fp8和ms-fp9。与相同精度的定点数表达方式相比，这种表达需要的逻辑资源数量大致相同，但能够表达更广的动态范围和更高的精度。与传统的32位浮点数相比，使用8～9位浮点表示的精度损失很小，如图3-2所示。值得注意的是，通过对模型的重新训练，就可以补偿这种方法带来的精度损失。\n\
    \n![](OEBPS/Images/Figure-P129_1364.jpg)\n\n图3-2　自定义浮点数与32位浮点数的精度对比\n\n脑波项目的核心单元是一个在FPGA上实现的软核神经网络处理器NPU，及其对应的NPU指令集。之所以采用软核NPU的方式，实质上是在高性能与高灵活性之间做出的折中。从宏观上看，DNN的硬件实现可以使用CPU、GPU、FPGA或者ASIC等多种方式，然而它们又有着各自的优缺点。例如，CPU有着最高的灵活性，但性能不尽如人意；ASIC方案与之相反。目前来看，只有FPGA能够在性能和灵活性之间达到良好的平衡。这在前一章详细讨论过。\n\
    \n从微观上看，FPGA方案本身对于DNN的实现也有多种方式。例如，既可以通过编写底层RTL的方式，直接对特定的网络结构进行针对性的优化，也可以采用高层次综合（HLS）的方法，通过高层语言对网络结构进行快速描述。但是，前者需要丰富的FPGA硬件设计与开发经验，并伴随着很长的开发周期；而后者由于开发工具的限制，最终得到的硬件系统在性能上往往很难满足设计要求。\n\
    \n![](OEBPS/Images/Figure-P130_1371.jpg)\n\n图3-3　脑波项目中的神经网络处理器架构图\n\n鉴于此，微软采用了软核NPU与特定指令集的方式。这种方法一方面兼顾了性能，使硬件工程师可以对NPU的架构和实现方式进行进一步优化；另一方面兼顾了灵活性，使软件工程师可以通过指令集对DNN算法进行快速描述，而无须关心硬件的实现细节。\n\
    \n脑波NPU的架构图如图3-3所示，它的核心是一个进行矩阵向量乘的算术单元MVU（Matrix Vector Unit）。它针对FPGA的底层硬件结构进行了深度优化，并采用了上文提到的“片上内存”和“低精度”的方法进一步提高系统性能。NPU的最主要特点之一是采用了“超级SIMD”的指令集架构，这与GPU的SIMD指令集类似，但是NPU的一条指令可以生成超过一百万个运算，等效于在英特尔Stratix10系列FPGA上实现每个时钟周期13万次运算。\n\
    \n#### ■3.1.3　脑波项目的性能分析\n\n脑波NPU在不同FPGA上的峰值性能如图3-4所示，当使用ms-fp8精度时，脑波NPU在Stratix10\
    \ FPGA上可以得到90 TFLOPS的峰值性能，这一数据也可以和现有的NPU芯片方案相媲美。"
