    # 第 1 章 延续摩尔定律——FPGA 的架构革新


    20 世纪 60 年代中期，英特尔公司的创始人之一，时任仙童半导体工程师的戈登·摩尔在《电子学》杂志发表了一篇论文，他在这篇论文中指出，芯片上晶体管的密度会每年提升一倍。在
    1975 年，他进一步修改了这个规律，将晶体管翻倍的周期由每年改为每两年，这个规律在后来被人们称为“摩尔定律”。如同摩尔定律预测的那样，在过去的 50 年中，每隔一年半到两年，芯片内晶体管的密度都会翻倍，形成指数级的增长。同时，芯片的性能也随之取得指数级的增长，使用晶体管电路进行计算的成本和功耗也都在这
    50 年间呈现指数级的下降。摩尔定律见证了半导体与集成电路技术的突破性发展，而这也是驱动人类社会和现代文明在这半个世纪里飞速前进的根本动力。


    FPGA 的发展，一直完美符合摩尔定律的描述。自 1984 年 FPGA 面世至今，FPGA 的容量增长超过 1 万倍、运行速度增长超过 100 倍，同时其成本和功耗均降低并超过
    1000 倍。这些发展一方面归功于半导体制造工艺的不断进步，另一方面，FPGA 本身也在不断创造和设计新颖的芯片架构和系统，以不断延续这样的指数级发展轨迹。


    随着半导体工艺突破 10nm 节点，并继续不断向原子极限推进，芯片架构设计的思路和方法也要随之不断更新和变革。对于 FPGA 来说，它的架构在未来应该如何继续发展，已经成为工业界和学术界一直在探讨的重要课题。那么，FPGA
    究竟是什么？它从发明至今经历了哪些发展阶段？它的未来发展阶段在何处？FPGA 能否继续跟随摩尔定律的发展脚步？需要何种技术才能继续支撑摩尔定律的延续？接下来，就请跟随笔者的文字，在本章中寻找和探讨这些问题的答案。


    ## 1.1　什么是 FPGA


    FPGA 的英文全称是 Field Programmable Gate Array，翻译成中文则是“现场可编程门阵列”。初听起来，这个名字的确有些拗口。从
    FPGA 的本质上看，它实际上就是半导体芯片的一种。从这个意义上讲，它和我们更加熟悉的中央处理器 CPU，或者图形处理器 GPU 等芯片并无二致。


    顾名思义，从 FPGA 的名字上就能体现出它的三个最主要的特点：门阵列、可编程、现场。


    首先，FPGA 芯片由大量的逻辑门阵列组成。我们知道，逻辑门是数字电路的基本组成单元，它们基于“布尔代数”对二进制数 0 和 1 进行操作，并完成不同的逻辑运算，例如与、或、非、异或，等等。举例来说，“非”就是把
    0 变成 1，或者把 1 变成 0；把一个 0 和一个 1 进行“或”操作就会得到 1；把一个 0 和一个 1 进行“与”操作就会得到 0。在图 1-1 中，就列举了一些常见逻辑门的电路符号。


    ![](img/Figure-P18_393.jpg)


    图 1-1　几个常见的逻辑门


    通过对这些逻辑门的排列组合，可以得到一些稍微复杂的运算单元，例如执行算术运算的加法器和乘法器等。图 1-2 就是一个二进制加法器，它的功能是完成一位二进制加法的运算，这个运算只需要五个逻辑门就可以实现。


    ![](img/Figure-P19_401.jpg)


    图 1-2　全加器（full adder）的逻辑结构图


    有了这些基于逻辑门的通用运算单元，就能进一步用它们设计出更加复杂的功能模块，并最终形成一个个功能各异的 IP（Intellectual Property）。对于大部分数字芯片来说，它们都是通过使用不同的
    IP，实现特定的逻辑功能，然后经过验证、集成、优化等过程，最终将设计流片，制造得到最终的芯片产品。


    我们应该注意到的是，这些芯片一旦被生产出来，它的逻辑功能就已经被“固化”在芯片上了。也就是说，这些功能已经成为了芯片的一部分。尽管很多芯片都可以通过对片上的寄存器进行编程，但这种编程更多的是改变芯片的配置，并不会改变它本身的逻辑功能。如果想要对它的逻辑功能进行更改，或者发现设计的缺陷和漏洞，就要重新对芯片进行设计、验证和制造，而这些过程都需要耗费大量的时间、人力、金钱，这样的投入和风险是很多公司无法承担的。


    在这个大背景下，芯片设计者们提出，与其将逻辑固化在芯片中，不如设计一种更加通用的芯片，在其中只包含最基本的逻辑门，并通过某种方式对这些逻辑门进行排列组合，使之能够通过编程改变它的逻辑结构。这样，就可以使用一种芯片实现许多不同芯片的功能了。这个想法，就是
    FPGA 的前身。


    FPGA 最主要的组成部分就是海量的“逻辑门”，它们通过特定的方式组合成逻辑门阵列，并通过互连单元进行连接。由于逻辑门可以任意组成更加复杂的电路单元，这就使得
    FPGA 在理论上可以实现任意的数字逻辑功能。随着 FPGA 技术的不断发展，在现代 FPGA 中集成了上千万个这样的逻辑单元，因此人们可以使用 FPGA
    完成很多非常复杂的功能，它甚至在某些领域替代了专用芯片，这一点在之后的章节里会深入介绍。


    值得一提的是，这里的“逻辑门”加上了引号，是因为 FPGA 里的逻辑门是通过查找表（Lookup-Table，LUT）的方式实现的。简单来说，就是将某个简单逻辑功能的全部可能结果写到一个存储单元中，并根据输入的变化直接查找结果并输出。除了部分中低端以及较早的
    FPGA 采用了 4 输入 LUT 结构之外，在大部分的现代 FPGA 中，例如英特尔的 Arria10、Stratix10 和 Agilex，以及赛灵思的
    6 系、7 系、UltraScale 及 UltraScale+系列等，查找表 LUT 的输入通常有 6 个，也就是说，这样的查找表结构最多可以实现任意 6
    输入、1 输出的逻辑功能。


    除了查找表之外，FPGA 的最小逻辑单元里还包括寄存器、选择器，甚至一些算术运算单元，例如加法的进位链，等等。不同的厂商对于 FPGA 的这个最小逻辑单元的命名都不尽相同，例如英特尔将其称为
    ALM（Adaptive Logic Module，自适应逻辑单元），赛灵思称之为 CLB（Configurable Logic Block，可配置逻辑模块）。虽然名称有所差异，但它们的主要组成部分都很类似，也都包含上面所说的这几个主要组成部分。图
    1-3 展示了英特尔 Stratix10 FPGA 芯片的最小逻辑单元 ALM 的结构示意图。


    ![](img/Figure-P21_411.jpg)


    图 1-3　Stratix10 FPGA 的 ALM 逻辑结构示意图


    FPGA 的第二个主要特点是可编程性。很多人有这样的疑问：CPU、GPU，以及很多专用芯片都可以进行编程，那么 FPGA 的可编程性又有什么独特之处？事实上，FPGA
    的可编程性，指的是可以对逻辑阵列进行编程，从而改变 FPGA 实现的逻辑功能，这与其他芯片的可编程性有着本质区别。相比之下，用户对专用芯片的编程大都是通过改变芯片上各种寄存器的配置实现的，而这并不会改变芯片的主要功能，打个简单的比方，这种编程并不能使一个网络交换芯片变成视频处理芯片。


    正是由于 FPGA 可以对逻辑门阵列进行重复编程，使得 FPGA 可以在逻辑层面改变自身实现的硬件结构，从而有着极高的灵活性。从理论上讲，如果 FPGA 的可编程资源足够多，一个
    FPGA 就可以实现任何数字电路的逻辑功能。FPGA 的一个重要应用领域，就是用来构建专用芯片 ASIC 流片前的硬件仿真或原型验证平台，即 emulation
    或 prototyping，而这正是利用了 FPGA 的可编程性。在这个过程中，芯片设计者使用 FPGA 实现目标功能，与真实的软硬件系统进行交互和仿真，并且可以不断地进行迭代和修改。待设计满足要求后，再进行流片生产。这极大降低了因设计疏漏导致流片失败的风险，还能在芯片尚未流片之前就启动固件、驱动、应用程序的开发，进一步缩短了项目开发周期。

