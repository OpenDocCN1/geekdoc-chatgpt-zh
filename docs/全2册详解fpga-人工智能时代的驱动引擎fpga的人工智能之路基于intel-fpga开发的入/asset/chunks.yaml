    # 内容简介


    FPGA（现场可编程门阵列）是一款特殊的半导体器件，它在制造出来后仍然能够被任意修改电路结构，以适应不同应用的需要。相比于其他种类的芯片，FPGA具有极强的灵活性，同时在性能、功耗和开发成本等方面达到了出色的平衡。因此FPGA被广泛应用在电信、工业控制、高性能计算等多个领域。


    本书详细梳理和分析了FPGA在大数据和人工智能时代的新技术、开发的新方法，以及FPGA在异构计算时代的新趋势和新方向，并重点讨论了FPGA的主要技术特点。


    本书致力于向业界决策人士提供FPGA的先进理念与有价值的实践模式，促进大数据、人工智能等新兴技术与各行业的深度融合提升。同时也为FPGA从业人员在处理实际工程技术问题时，提供系统的方案和有价值的参考。此外，本书对学界、企业界和社会中的非专业人员或技术爱好者了解FPGA的先进理念和知识，也有很大的参考价值。


    # 作者简介


    **石侃**


    博士毕业于伦敦帝国理工学院电子工程系，现就职于英特尔公司，担任FPGA研发工程师，兼任英特尔研究院的研究科学家。他深耕于FPGA的数据中心网络加速、网络功能虚拟化、高速有线网络通信等领域的研发和创新工作。在学术界，他曾经针对FPGA，近似计算、计算机数学等技术和领域，在DAC，FCCM，FPT，ISCAS，TRETS、TVLSI等多个国际顶级会议和期刊上发表过研究论文，并两次获得欧盟HiPEAC论文奖。


    是微信公众号“老石谈芯”的主理人，已发表70余篇原创文章，以及数十条原创视频内容，深受读者好评，B站关注人数超过10万，全网关注人数超过25万，全网累计视频播放量达数百万。


    # 推荐序1


    进入21世纪，网络信息产业发展极快，究其原因，是因为复杂集成电路技术发展的突飞猛进。芯片的集成度越来越高，成本却越来越低。但是这么复杂的集成电路是怎么设计出来的，知道的人并不多。


    石侃先生编写的这本书告诉我们，在现代网络信息系统中，发挥着重要作用的集成电路，其复杂的处理巨大数据流的逻辑功能是完全可以用FPGA实现的。因为集成电路投片生产成本很高，所以在集成电路设计过程中的第一个阶段，就是用FPGA来验证为集成电路芯片设计的逻辑功能是否完全正确，并能以极高的速度完全正确地处理巨大的数据流，并代替正式定型大规模生产前的集成电路。因为FPGA内的硬件逻辑是可以通过编码修改的，而且它的规模相当大，可以容纳几千万甚至几亿个逻辑器件，因此选用FPGA器件设计，可以把许多软件也用硬件逻辑实现，使数据处理系统的运行速度成百倍甚至成千倍地增加。


    我很高兴地看到石侃先生编写的这本书把FPGA用于大数据处理的技术概念介绍给许多非FPGA设计专业人士（电子信息技术爱好者），这本书里的大部分专业知识只有一线工作者才能真正了解其意义和实现的细节。无论是软件开发者、计算机网络信息工作者、业余电子系统的爱好者，还是技术领域的决策者，凡是关心FPGA和集成电路及大数据处理技术的人，都可以通过阅读或浏览本书收获丰富的最新专业知识，让自己跟上时代的步伐。我本人非常感谢石侃先生的技术分享。


    我在数字逻辑设计行业里耕耘了近50年，近25年来一直从事FPGA和集成电路的设计和Verilog设计方法学的推广，这本书也开阔了我的眼界，受益匪浅，因此我向对FPGA/IC设计技术感兴趣的本科生和研究生推荐这本书。认真阅读本书将对同学们选择专业分枝、技术方向和导师有很大的帮助。


    希望石侃先生的这本新书被更多的读者喜欢，我真诚地推荐给各位读者。


    夏宇闻


    北京航空航天大学退休教授


    # 推荐序2


    第一眼看到石侃博士这本《详解FPGA：人工智能时代的驱动引擎》时，一下子勾起了我的回忆。回想起来，我大约是在2005年第一次接触FPGA，从此为我打开了一扇通往硬件世界的大门。


    我的博士工作便是研制了一套基于FPGA的内存总线监测设备HMTT。它支持软硬件协同，可以算是一款颇具特色的自研设备，撰写的相关论文也被2008年系统评测领域国际顶级会议SIGMETEICS接收，这可能是该会1973年举办以来接收的中国大陆第一篇论文。


    虽然已经是15年前的工作，但现在对HMTT的一些技术细节依然是如数家珍：硬件部分是一块自制的带有FPGA的PCB，直接插在DDR内存槽上，而内存条则插在PCB上。内存总线上的信号被分为两路，一路送往内存条去读写数据，另一路则被送到FPGA进行处理，实时还原为包含物理地址的读写命令，然后通过以太网发送到一个磁盘阵列存下来。


    软件部分设计了一种同步机制，能让FPGA识别软件操作（如操作系统页表更新、函数调用等），从而将物理地址和软件操作关联起来，例如通过和页表关联就能将物理地址还原为进程的虚拟地址。


    如今，HMTT已经发展到第四代，从早期支持DDR-200到现在已能支持DDR4-2600，伴随的是所使用的FPGA也从Xilinx的Virtex-4/5发展到Kintex
    UltraScale XCKU035。研制HMTT成功之后的十多年，我们团队的每一项科研工作都没离开过FPGA。


    有时会想，为什么会出现FPGA这样的技术？为什么这类硬科技大多先在美国诞生？中国未来又有什么新机会？翻阅着石侃博士的这本关于FPGA的大作，读着书中一个个与FPGA深度融合的前沿技术及其背后的人和故事，启发我对这几个问题更深入的思考。


    石侃博士在书中把FPGA的诞生称为“历史的必然”。20世纪80年代，2/3的芯片项目由于需求变化、设计漏洞、流片失败等种种原因而赔钱，只有1/3的芯片设计能实际投入生产。因此业界急需一种技术能在流片前充分测试与验证，从而降低流片失败率。于是FPGA应运而生！1984年，Xilinx推出了世界上第一款FPGA
    XC2064，只有64个可编程逻辑单元，800个晶体管。35年后的2019年，英特尔推出了当时世界上最大的FPGA—Stratix10 GX 10M，1020万个可编程逻辑单元，433亿个晶体管。如今FPGA已经发展成一个全球市场规模约60亿美元的产业，在整个芯片产业链中发挥着不可或缺的作用，甚至成为我国面临“卡脖子”的一类核心芯片。回顾一项项硬科技的发展历程，哪怕诞生之初再渺小，只要能真正解决市场需求，那么它的诞生就是一种“历史的必然”。


    为什么FPGA先在美国诞生？而不是在日本或者欧洲？事实上，20世纪80年代初，日本的半导体产业如日中天，1986年日本半导体在全球市场的份额甚至超过了美国。虽然这本书并没有直接回答这个问题，但从书中所介绍的一系列FPGA与云计算、大数据、人工智能等前沿应用的深入融合例子，结合80年代美国和日本各自半导体产业的发展历程，也许能给我们一些启发。当时美日半导体产业的发展存在两点主要的区别：


    （1）技术出口侧：美国的市场需求更旺盛、更前沿。虽然日本在80年代的半导体产业突飞猛进，但是大部分仍然是出口到美国，1980—1984年日本对美出口额增长了8倍。换而言之，日本并没有直接感知到最前沿的需求。


    （2）技术供应侧：美国的研发投入更具前瞻性，布局更合理。1984年Xilinx公司成立，得益于政府支持的MOSIS项目所发明的MPW技术以及推动的Fabless模式，也得益于政府支持的一系列CAD/EDA项目。相比较而言，日本的研发投入则更聚焦于对已有产品的改良，使得产品质量更高、价格更低、供货更稳定，但缺少了开拓性。同期，美国还启动了多个研究机构，如SRC、SEMATECH等，大力支持半导体领域的基础研究与共性技术，培养大批高水平人才，为产业发展提供深厚的技术储备与人才储备。


    诚然，中国错过了20世纪80年代半导体发展的黄金期，导致半导体产业成为今天中国与发达国家差距最大的领域之一。但是，从这本书中我也看到新的机会：一方面，书中介绍的云计算、大数据、人工智能等新兴应用在中国也发展得如火如荼，并产生了许多前沿需求，甚至有些已经催生了一些基于FPGA的达到国际先进水平的技术，例如深鉴科技的FPGA人工智能加速技术，阿里巴巴的弹性裸金属服务器神龙架构，我们团队研制的芯片敏捷设计SERVE云平台，等等。另一方面，中国对半导体领域的重视程度前所未有，社会各界均在积极投入，不同的维度（市场、科研、资本、知识产权、教育等），不同的环节（应用、设计、制造、封测、装备、材料等），不同的路线（引进消化、独立自主、开源共享等）……相信只要坚持投入，在不久的将来一定能看到成效。


    包云岗


    中科院计算所研究员，副所长


    # 前言


    PREFACE


    2011年，我正式踏入学术界，从事和FPGA相关的学术研究，2015年进入工业界，继续做FPGA的工程研发工作。直到今天，已入行十年时间了。


    在这十年间，我亲眼见证了FPGA这个特殊的半导体芯片是如何在人工智能时代取得飞速发展的。除了它的传统应用领域之外，FPGA在云数据中心、人工智能、高速网络处理、金融科技、数字医疗等多个行业里又开辟了很多崭新的应用，并逐步成为了这些领域中不可或缺的关键单元。在这场不为大多数人所知的技术变革里，我也有幸参与其中，并且完成了一些关键工程项目的研发工作。


    我们既要低头拉车，又应抬头看路。一直以来，我都在寻找这样一类书籍——能对FPGA技术本身及其未来的发展进行探讨和总结。因为这能帮助大家明确一些很重要的“动机”，例如为什么要学习FPGA，从事这个行业的前景怎样。更重要的是，如何通过分析FPGA的发展历史和现状，来分析和解答前面的这些问题，并且得到一个比较完整的思维方式和体系。我相信，很多学习FPGA或者从事FPGA行业的朋友也在寻找这些问题的答案。


    很可惜，当前市面上的绝大多数关于FPGA的书籍，讲的都是FPGA具体的开发方法、流程和经验，侧重点大部分是针对“怎么学”或者“怎么用”，而非“为什么学”或者“为什么用”。


    事实上，就FPGA的广泛应用来说，它早已不单是一项技术或者产品，更代表着一种理念。特别是摩尔定律已近黄昏的当下，以FPGA为代表的异构计算技术不断兴起，更是成为了延续摩尔定律发展的重要力量。因此，信息化技术对各行各业的重大提升，与FPGA的强力助推直接相关。正是它们在新领域以新形式的结合，深刻改变了FPGA的地位和作用，FPGA所面临的前所未有的发展机遇，让业界对其体系、架构、功能等许多方面提出了变革与发展的新要求。这也需要我们以全新的视角去重新认识和看待FPGA。


    由此，我便产生了撰写本书的想法，希望在书中以通俗易懂的语言，分析和梳理以下几点内容：第一，FPGA在大数据和人工智能时代的新应用，以及它们的主要技术特点；第二，FPGA开发的新方法和新手段；第三，FPGA发展的历史、现状，以及FPGA技术发展的新趋势和未来的发展方向。就像前面提到的，我并不想借由此书教给读者FPGA具体的开发方法，而是希望在大家抬头看路时，还能有一些可以参考的路标和方向。


    在本书的写作过程中，我也尽力平衡技术的广度和深度。本书的读者并不局限于专业的FPGA从业者或学习者，还可以是学界、企业界和社会中的非专业人员和技术爱好者。希望不同层次、不同经验、不同背景，但对FPGA技术有兴趣和追求的读者朋友都能从本书中获益，并且借由此书，为他们自己的相关工程实践与学术研究提供借鉴和启发。由于笔者的水平和能力有限，本书难免存在错误和疏漏，欢迎各位读者批评指正。


    本书付梓之际，我想感谢清华大学出版社的杨迪娜编辑，她在我写作和出版过程中给出了很多重要的建议和帮助。感谢北京航空航天大学的退休教授夏宇闻老师和中科院计算所研究员，副所长包云岗老师，在百忙之中为本书作序，也感谢摩尔精英的CEO张竞扬先生、英特尔中国创新中心总经理张瑞先生、西南交通大学的邸志雄老师、电子科技大学的黄乐天老师为本书做推介。我还想感谢“老石谈芯”的所有读者和观众，他们的支持、鼓励和反馈，让我不断提升自己，并且最终写出了书中的这些内容。最后，我想感谢我的家人，包括我的父母、岳父母，特别是我的妻子和儿子，他们无私的爱与包容，让我成为更好的人。


    本书献给我的外公，他教给了我“众里寻他千百度，蓦然回首，那人却在灯火阑珊处”的治学境界。愿他在天国一切安好。


