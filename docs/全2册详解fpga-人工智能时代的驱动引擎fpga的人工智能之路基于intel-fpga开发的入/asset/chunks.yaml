- raw: '这项工作更重要的贡献是向人们揭示了FPGA的架构特性（如固化的内存单元和DSP等）与基准测试结果的相关性。同时，这项工作深入分析了FPGA里固化的逻辑结构对性能和成本的影响与关联，而这也直接对现代FPGA的架构设计产生了深远影响。在现代FPGA中，将哪些IP或逻辑电路采用硬核的方式实现，已经成为了影响FPGA发展的重要命题。这与像查找表LUT的大小、布线拓扑结构等传统FPGA架构问题同样重要。


    在学术界，像这样的基准测试工作也总是充满争议的。因为它们要么在比较时采用了不同的衡量标准，要么对比较的标准进行了抽象，使得结果不具有扩展性和通用性。然而，这项成果为这类工作树立了典范，它展示了如何客观地做比较，以及如何细致地描述比较的具体细节，这样使得研究者可以从结果中得到自己的结论，并将这种思想应用到今后的研究工作中。


    #### ■5.2.2　FPGA微架构篇


    本篇介绍了五个FPGA微架构领域的重要工作，它们有的奠定了现代FPGA查找表LUT微结构的理论基础，有的探讨了FPGA布线架构的设计与优化方法，有的探索了当代最新科技与FPGA微架构设计的结合。


    ##### 1．在可重构计算阵列中平衡互连与计算


    **一句话总结：**首次考虑了逻辑资源与布线资源的平衡使用，从而得到更优的资源利用率，对FPGA架构与CAD工具设计具有深远影响


    **英文名：**Balancing Interconnect and Computation in a Reconfigurable Computing Array（or，why
    you don''t really want 100% LUT utilization）


    **作者：**Andre DeHon


    **发表时间：**1999年


    **推介人：**Mike Hutton（谷歌）


    这项成果完美结合了理论、实证分析，以及富有洞见的探讨，打破了关于FPGA架构优化的常见假设，特别是通过对比逻辑面积与布线面积，证明了100%的硬件利用率并不一定会带来最优的结果。


    这项成果首次深入研究了FPGA设计中不同部分的布线需求，分析了最坏情况下的布线要求及其对器件整体的影响。这项成果影响了后来很多关于FPGA架构的研究工作，并在发表十多年后仍然被多次引用。由这项成果发展而成的一项名为HSRA的布线方法，也重新引起了学术界和工业界对层次化FPGA架构设计及分析的兴趣。


    这项成果的另外一个贡献是，它清晰地描述了FPGA架构风格与CAD算法风格之间的对应关系：在这个工作中就是分层递归分解。Andre DeHon进一步对比了FPGA逻辑互连的增长率与器件大小之间的关系，阐述了高效的系统架构设计的一系列实证结果。


    除此之外，这项成果最值得借鉴的地方是它的方法论。通过使用基于树状网格的架构，可以得到伸缩性更强的FPGA互连架构模型，并对基于逻辑簇（Logic Clusters）的传统方法提出了挑战。当结果与传统观念不同的时候，Andre
    DeHon对问题的本质有着清晰而敏锐的认识。这也使得这项工作在FPGA的很多领域有着全面而深远的影响。


    ##### 2．LUT和簇大小对深亚微米FPGA性能与密度的影响


    **一句话总结：**现代FPGA里6输入LUT结构的理论基础


    **英文名：**The Effect of LUT and Cluster Size on Deep-Submicron FPGA Performance
    and Density


    **作者：**Elias Ahmed，Jonathan Rose


    **发表时间：**2000年


    **推介人：**Mike Hutton（谷歌）


    这项开创性的研究深入分析了将逻辑单元组成层次化结构的过程中，查找表LUT大小和逻辑簇大小对系统性能和整体面积的影响。在这项成果发表之前，学术界刚刚开始探索和讨论FPGA里的逻辑簇结构，见图5-7。在工业界，尽管Altera和赛灵思已经开始使用层次化结构，但它们有着不同的大小和接口类型，从而限制了其进一步使用。在这个大背景下，这项工作首次探讨了面积和延时的权衡与折中，以及它们与簇输入数量的关系。


    这项工作的主要成果是在给定电路面积的情况下，对理想情况下的输入数量进行了建模，并给出了LUT大小和簇大小的最优范围，以满足特定的面积与延时要求。值得注意的是，这项工作指出6输入的LUT会取得比以往都要好的面积与延时结果，见图5-8，而这个结论也为现代FPGA里采用的6输入LUT结构奠定了理论基础。


    ![](OEBPS/Images/Figure-P183_1895.jpg)


    图5-7　FPGA逻辑簇结构


    这项工作除了它的结果影响深远之外，它所采用的方法论也有着很强的借鉴意义。两位作者指出，他们得到的这些最优解取决于当时的工艺参数和条件，随着半导体制造工艺的不断进步，这些最优解也会随之变化。他们也在这项工作中给出了一个清晰且可以重用的框架，用来预测和判断当工艺进步时这些最优点的变化情况。


    这项工作另外的一个主要贡献是，它建立了一个评估FPGA架构的标准化体系，这其中包含了从综合到布局布线的各个FPGA开发阶段。它也为后续的FPGA架构研究以及CAD算法开发提供了参考标准。


    ![](OEBPS/Images/Figure-P184_1901.jpg)


    图5-8　LUT大小对面积和延时的影响


    ##### 3．在LUT簇中使用稀疏交换结构


    **一句话总结：**现代FPGA布线微架构设计的奠基之作


    **英文名：**Using Sparse Crossbars within LUT Clusters


    **作者：**Guy Lemieux，David Lewis


    **发表时间：**2001年


    **推介人：**Sinan Kaptanoglu（Microsemi公司）


    这项成果着重探讨了一个全新的问题，那就是在不假设全连接的情况下，如何构建FPGA逻辑簇里的布线架构。在之前的其他工作中，很多研究人员已经深入研究了基于逻辑簇的FPGA结构。然而，这些对簇和LUT大小、互连方式等的研究，都基于这样的一个假设，即簇内布线是全连接的。然而，在这项成果中，我们看到如果大量减少负责全连接的交换结构（Crossbar），就可以显著地改变簇的最优特性，并保持很好的布线灵活度与较高的系统性能。


    为了印证这个观点，这项工作首先提出了一种通用度很高的FPGA簇结构，并引入了面积与延时模型，用来计算和比较面积和性能的相关参数。此外，这项工作还讨论了FPGA架构中各项参数对面积和性能的影响，包括加入额外的LUT输入等。


    这项工作对FPGA业界有着极大的启发意义。在今天，绝大多数商业级FPGA的布线架构都基于逻辑簇结构，而这些簇都是由部分连接（而非全连接）的交换结构组成的。为了实现这种部分连接的交换结构，虽然不同的FPGA厂商、不同的FPGA芯片采用了不同的方法，但其中蕴含的中心思想是类似的。此外，这篇文章对学术研究也有着重大的影响。这项成果发表后的数年间，其中包含的实验结果被不断地进行理论归纳，从而为其他研究者奠定了坚实的理论基础。


    ##### 4．实验假设、工具和分析技术对FPGA架构研究结论的影响


    **一句话总结：**超越FPGA研究领域的研究方法论佳作


    **英文名：**On the Sensitivity of FPGA Architectural Conclusions to Experimental Assumptions，Tools，and
    Techniques


    **作者：**Andy Yan，Rebecca Cheng，Steven J. E. Wilton


    **发表时间：**2002年


    **推介人：**Katherine Compton（威斯康星大学麦迪逊分校）


    从事FPGA架构研究的学者都知道，研究时使用的实验方法会对架构研究的结果产生重要的影响。对于一个FPGA架构参数，有太多的因素会对它造成影响，例如选取的测试基准电路，用来把电路映射到FPGA上的EDA工具等。


    然而，知道这些因素可能会影响结果是一回事，看EDA数据到它们确实会影响结果则是另外一回事。这项工作为我们揭示了一个重要结论，那就是通过实验的方法寻找最优的FPGA架构参数可能并不会带来最优EDA结果，因为实验结果可能在很大程度上取决于实验是如何设置的。例如，图5-9清晰地展示了当使用不同的EDA工具和设置时，最优的LUT大小会在4～6输入之间来回变化。


    ![](OEBPS/Images/Figure-P186_1936.jpg)


    图5-9　使用不同EDA工具时，LUT大小与电路面积的关系


    更重要的是，这项工作从方法论的角度鼓励研究人员去更加仔细地设计他们的实验，并构建他们的结论。事实上，这已经超出了FPGA的研究范畴，并对所有刚刚从事科学研究的学者都有着很大的借鉴意义。这项成果所传递的研究思路，会让研究者仔细审视自己的研究方法，而避免只从表面上看结果。通过这项成果，人们应该意识到仔细构建实验和客观分析结果的重要性，并要永远质疑结果的有效性和适用性。


    ##### 5．基于纳米线的亚光刻可编程逻辑阵列


    **一句话总结：**利用时代前沿技术设计制造FPGA的开创性研究


    **英文名：**Nanowire-Based Sublithographic Programmable Logic Arrays


    **作者：**Andre DeHon，Michael J. Wilson


    **推介人：**Deming Chen（伊利诺伊大学香槟分校）


    2003年，基于纳米线的集成电路设计取得了两个突破性成就。其一是哈佛大学发表的一种通用的控制纳米线结构和层级的方法，另一个则是惠普实验室发表的对纳米级电路元件进行制造和测试的方法。尽管如此，这个领域的大多数研究都只是专注于纳米线晶体管设计，或者简单的基于纳米线的逻辑与存储单元设计。


    受此启发，这项工作的作者抓住机会将纳米元件的制造与纳米系统的设计结合起来，并展现了纳米技术的真正力量。这项成果使用纳米线构建了大型可编程逻辑阵列的布线交换结构，并对系统设计进行了详细建模。此外，这项成果还指出了许多独特的设计挑战与问题，包括如何使用一种随机机制来处理纳米级别的二极管的恢复（Restoration）问题等。这项成果还对纳米架构的芯片面积、良率、时序等问题进行了详尽的理论分析，并将一系列基准测试电路映射到这个新型纳米架构上，以评估他们的逻辑密度。


    这项成果详细分析了这种架构的设计和制造挑战，以及它对传统的CMOS FPGA架构的潜在竞争优势。这样的研究对于业界理解纳米科技，以及它将如何给FPGA带来提升有着重要意义。在这项成果的后续工作中，作者还讨论了纳米线结构的制造缺陷等问题。


    光刻技术一直是制造CMOS电路的根本性技术之一。这项成果表明，在不使用光刻技术的情况下，利用新兴的制造技术来构建高密度、大规模的可编程逻辑结构是可行的。这也为学术界和业界提供了一种可以超越传统光刻限制的替代方案。


    #### ■5.2.3　FPGA布局布线算法篇


    本篇介绍五个FPGA布局布线算法领域的重要工作。在这些工作中，有的建立了大部分现代商用FPGA的布线算法基础，有的大幅改进了FPGA布局、布线、时序优化等多个环节的算法性能，有的则对FPGA设计软件及算法进行了跨越式的提升和优化。


    ##### 1．寻路者：基于协商的FPGA性能优化布线算法


    **一句话总结：**历史最强FPGA布线算法，没有之一


    **英文名：**Pathfinder：A Negotiation-Based Performance-Driven Router for FPGAs


    **作者：**Larry McMurchie，Carl Ebeling（见图5-10）


    **发表时间：**1995年


    **推介人：**Sinan Kaptanoglu（Microsemi公司）


    ![](OEBPS/Images/Figure-P188_1966.jpg)


    图5-10　Carl Ebeling，现任华盛顿大学教授


    这项工作可以算是过去20年中影响FPGA技术发展的最重要的成果之一。这项成果对工业界和学术界都产生了极其深远的影响。最重要的是，这个工作将FPGA的布线研究，从一个结果波动极大的问题，转化为一个能够很好控制结果的优化问题。时至今日，几乎所有的FPGA厂商都在使用这项工作提出的协商拥塞（Negotiated
    Congestion）布线算法，或者是由这个算法引申出来的其他布线方法。此外，学术界最为广泛使用的FPGA架构设计和分析工具VPR，也是基于这项成果开发的。


    通常来说，有些研究成果会立刻在学术界引起轰动，而有些则会首先被低估一段时间，然后才会被人们完全理解，这项成果就属于后者。很多研究FPGA设计工具的工作都会遵循一定的套路，那就是先提出一些新的想法，然后使用基准测试对这些想法进行实验，最后得到的结论是比当时的其他工作取得5%～10%的提升，诸如此类。并不是说这些工作不够优秀，但事实上，由于EDA领域会不断出现新的工作，并取得更好的结果，因此大多数的工作所取得的成就和影响都是暂时的。


    1995年，大多数FPGA研究者都认为这项工作也只不过是又一个取得了10%性能提升的成果，和其他研究并无二致。只有很少的人认识到，这项成果带来的是改变整个游戏规则的根本性创新，它将在今后的几十年里经受住其他工作的挑战，而且不会被其他布线算法所超越。幸运的是，在随后的几年里，学术界和工业界都渐渐认识到，这项成果所提出的理念已经达到了前所未有的高度。


    这项工作首先阐述了协商的基本思想，以及处理一阶拥塞的方法。然后分析了二阶拥塞，并引入了对“历史成本（History Cost）”的需求。之后将这个概念进行了推广，并将布线延时引入考量。最后给出了这个算法的伪代码，以及一些实验结果。相比于当时的其他商用工具，这个方法能取得11%的效果提升。


    时至今日，我们已经能够广泛而成功地使用协商拥塞算法来处理FPGA的布线问题了。尽管如此，这个方法为何如此有效，学术界在理论层面上仍然莫衷一是。例如，现在我们基本能理解和分析退火算法是如何工作和收敛的，但对于协商拥塞算法的理解还远远达不到这个层次，人们还没有对这个思想构建起足够严谨的理论体系。因此，这项工作仍将继续激发研究者们对这一课题的进一步研究。


    ##### 2．FPGA布线架构：分段与缓冲及其对速度和逻辑密度的优化


    **一句话总结：**对VPR工具的跨越式优化，从而直接影响高端商业FPGA的成形和发展


    **英文名：**FPGA Routing Architecture：Segmentation and Buffering to Optimize Speed
    and Density


    **作者：**Vaughn Betz，Jonathan Rose


    **发表时间：**1999年


    **推介人：**Carl Ebeling（华盛顿大学）


    这项工作在VPR中加入了对时序优先布线算法的支持，并对延时进行了精确估计。这使得VPR可以对FPGA互连网络结构进行更加深入的研究。通常来说，FPGA上90%的面积都是用来进行可编程布线的，而关键路径延时里有80%都是布线延时。因此，如何构建正确的FPGA互连网络，对于性能和资源消耗来说都是至关重要的。随着FPGA面积的不断增加，这一点更为明显，因为根据Rent法则，电路中导线数量的增长必须快于逻辑单元数量的增长。


    然而，芯片架构师们经常习惯于根据直觉和以往的经验做出决策，而不是根据基准测试和理论分析。EDA工具通常针对单一架构进行优化，如果架构进行了变更，工具的性能和有效性就会不可避免的下降。此外，如果要量化互连对性能的影响，就需要有基于时序驱动的综合、布局和布线算法。


    这项工作在VPR中引入了一种用来精确估计延时的Elmore模型，并阐述了一种使用VPR对FPGA布线架构进行分析和评估的方法。这使得FPGA架构师可以通过一种架构描述语言（Architecture
    Description Language），对FPGA架构进行建模和分析，然后工具就可以自动对这种架构进行适配。


    这项成果首先假设了一个传统的岛型FPGA架构，然后尝试使用最优的方法对连线进行分段，并将这些分段连接起来。通过使用VPR，可以自动对大部分的参数空间进行探索，从而得到对于给定的参数的最优布线结果。


    这项成果最大的贡献在于它所使用的方法论和工具，仅仅在几年之后，Altera在构建Stratix架构时就采用了相似的设计方法，并且采用了基于VPR的工具包。这进一步表明，创新既需要跳出固有的思维模式，又要使用先进的工具来评估这些新的想法，两者缺一不可。


    ##### 3．从高层描述自动生成FPGA布线架构


    **一句话总结：**通过自动处理FPGA布线架构研究中烦琐的部分，推进了整个研究领域的跨越式发展


    **英文名：**Automatic Generation of FPGA Routing Architectures from High-Level Descriptions


    **作者：**Vaughn Betz，Jonathan Rose


    **发表时间：**2000年


    **推介人：**Scott Hauck（华盛顿大学）


    FPGA的架构研究是非常复杂的，有时即使是为了回答最简单的问题，都需要付出相当程度的努力。在很多情况下，FPGA架构师会认为他们的一些新想法，例如更大的逻辑块、新型的进位链等，理应会极大地提升系统的功耗、性能、面积、稳定性等指标。然而，为了证明这些想法的可行性，就需要设计工具和实际应用来对这些想法进行验证。同时，也需要结合很多和这些想法无关的FPGA架构细节，以组成一个完整的系统。在工具层面，大名鼎鼎的Pathfinder和VPR的出现，已经为大多数逻辑映射工作提供了一个稳定而高效的后端平台。


    然而，对于FPGA互连架构来说，仍然有着很多细节问题需要注意。例如，连线长度、互连方法、逻辑块结构等，这些问题往往与研究者们希望研究的主要问题无关，但却都是必须统筹考虑的问题。例如，尽管单向导线（Unidirectional
    Wires）也许是个好的想法，但如果我们将其用于所有的互连节点，那么面积和容抗的增加将迅速掩盖这个想法带来的优点和好处。那么，如果我们只将其用于50%的互连节点，然后将所有的逻辑块输出连接到奇数号导线、将所有逻辑块输入连接到偶数号导线呢？如果我们又想到了其他的互连架构和方式呢？在这项成果面世之前，这些问题都是无法求解的。


    因此，解决这类问题的重点，是这项成果所展示的架构描述语言，以及VPR中的架构生成器。简单来说，这项成果专注于处理那些布线架构中没人关心，但却非常重要的细节问题，例如，逻辑块是如何连接的？如何保证连线之间的交互不会对系统产生不确定影响？交换架构是如何组织排列的？当设计中存在长导线时，如何保证这条穿过芯片多个区域的连线以合理的方式进行分段？这样的问题还有很多很多，而这项成果就是用来解决这些在FPGA架构研究中的细微问题。'
  fmt: '

    这项工作更重要的贡献是向人们揭示了FPGA的架构特性（如固化的内存单元和DSP等）与基准测试结果的相关性。同时，这项工作深入分析了FPGA里固化的逻辑结构对性能和成本的影响与关联，而这也直接对现代FPGA的架构设计产生了深远影响。在现代FPGA中，将哪些IP或逻辑电路采用硬核的方式实现，已经成为了影响FPGA发展的重要命题。这与像查找表LUT的大小、布线拓扑结构等传统FPGA架构问题同样重要。


    在学术界，像这样的基准测试工作也总是充满争议的。因为它们要么在比较时采用了不同的衡量标准，要么对比较的标准进行了抽象，使得结果不具有扩展性和通用性。然而，这项成果为这类工作树立了典范，它展示了如何客观地做比较，以及如何细致地描述比较的具体细节，这样使得研究者可以从结果中得到自己的结论，并将这种思想应用到今后的研究工作中。


    ## ■5.2.2　FPGA微架构篇

    本篇介绍了五个FPGA微架构领域的重要工作，它们有的奠定了现代FPGA查找表LUT微结构的理论基础，有的探讨了FPGA布线架构的设计与优化方法，有的探索了当代最新科技与FPGA微架构设计的结合。


    ### 1．在可重构计算阵列中平衡互连与计算

    **一句话总结：**首次考虑了逻辑资源与布线资源的平衡使用，从而得到更优的资源利用率，对FPGA架构与CAD工具设计具有深远影响


    **英文名：**Balancing Interconnect and Computation in a Reconfigurable Computing Array（or，why
    you don''t really want 100% LUT utilization）


    **作者：**Andre DeHon


    **发表时间：**1999年


    **推介人：**Mike Hutton（谷歌）


    这项成果完美结合了理论、实证分析，以及富有洞见的探讨，打破了关于FPGA架构优化的常见假设，特别是通过对比逻辑面积与布线面积，证明了100%的硬件利用率并不一定会带来最优的结果。


    这项成果首次深入研究了FPGA设计中不同部分的布线需求，分析了最坏情况下的布线要求及其对器件整体的影响。这项成果影响了后来很多关于FPGA架构的研究工作，并在发表十多年后仍然被多次引用。由这项成果发展而成的一项名为HSRA的布线方法，也重新引起了学术界和工业界对层次化FPGA架构设计及分析的兴趣。


    这项成果的另外一个贡献是，它清晰地描述了FPGA架构风格与CAD算法风格之间的对应关系：在这个工作中就是分层递归分解。Andre DeHon进一步对比了FPGA逻辑互连的增长率与器件大小之间的关系，阐述了高效的系统架构设计的一系列实证结果。


    除此之外，这项成果最值得借鉴的地方是它的方法论。通过使用基于树状网格的架构，可以得到伸缩性更强的FPGA互连架构模型，并对基于逻辑簇（Logic Clusters）的传统方法提出了挑战。当结果与传统观念不同的时候，Andre
    DeHon对问题的本质有着清晰而敏锐的认识。这也使得这项工作在FPGA的很多领域有着全面而深远的影响。


    ### 2．LUT和簇大小对深亚微米FPGA性能与密度的影响

    **一句话总结：**现代FPGA里6输入LUT结构的理论基础


    **英文名：**The Effect of LUT and Cluster Size on Deep-Submicron FPGA Performance
    and Density


    **作者：**Elias Ahmed，Jonathan Rose


    **发表时间：**2000年


    **推介人：**Mike Hutton（谷歌）


    这项开创性的研究深入分析了将逻辑单元组成层次化结构的过程中，查找表LUT大小和逻辑簇大小对系统性能和整体面积的影响。在这项成果发表之前，学术界刚刚开始探索和讨论FPGA里的逻辑簇结构，见图5-7。在工业界，尽管Altera和赛灵思已经开始使用层次化结构，但它们有着不同的大小和接口类型，从而限制了其进一步使用。在这个大背景下，这项工作首次探讨了面积和延时的权衡与折中，以及它们与簇输入数量的关系。


    这项工作的主要成果是在给定电路面积的情况下，对理想情况下的输入数量进行了建模，并给出了LUT大小和簇大小的最优范围，以满足特定的面积与延时要求。值得注意的是，这项工作指出6输入的LUT会取得比以往都要好的面积与延时结果，见图5-8，而这个结论也为现代FPGA里采用的6输入LUT结构奠定了理论基础。


    ![](OEBPS/Images/Figure-P183_1895.jpg)

    图5-7　FPGA逻辑簇结构


    这项工作除了它的结果影响深远之外，它所采用的方法论也有着很强的借鉴意义。两位作者指出，他们得到的这些最优解取决于当时的工艺参数和条件，随着半导体制造工艺的不断进步，这些最优解也会随之变化。他们也在这项工作中给出了一个清晰且可以重用的框架，用来预测和判断当工艺进步时这些最优点的变化情况。


    这项工作另外的一个主要贡献是，它建立了一个评估FPGA架构的标准化体系，这其中包含了从综合到布局布线的各个FPGA开发阶段。它也为后续的FPGA架构研究以及CAD算法开发提供了参考标准。


    ![](OEBPS/Images/Figure-P184_1901.jpg)

    图5-8　LUT大小对面积和延时的影响


    ### 3．在LUT簇中使用稀疏交换结构

    **一句话总结：**现代FPGA布线微架构设计的奠基之作


    **英文名：**Using Sparse Crossbars within LUT Clusters


    **作者：**Guy Lemieux，David Lewis


    **发表时间：**2001年


    **推介人：**Sinan Kaptanoglu（Microsemi公司）


    这项成果着重探讨了一个全新的问题，那就是在不假设全连接的情况下，如何构建FPGA逻辑簇里的布线架构。在之前的其他工作中，很多研究人员已经深入研究了基于逻辑簇的FPGA结构。然而，这些对簇和LUT大小、互连方式等的研究，都基于这样的一个假设，即簇内布线是全连接的。然而，在这项成果中，我们看到如果大量减少负责全连接的交换结构（Crossbar），就可以显著地改变簇的最优特性，并保持很好的布线灵活度与较高的系统性能。


    为了印证这个观点，这项工作首先提出了一种通用度很高的FPGA簇结构，并引入了面积与延时模型，用来计算和比较面积和性能的相关参数。此外，这项工作还讨论了FPGA架构中各项参数对面积和性能的影响，包括加入额外的LUT输入等。


    这项工作对FPGA业界有着极大的启发意义。在今天，绝大多数商业级FPGA的布线架构都基于逻辑簇结构，而这些簇都是由部分连接（而非全连接）的交换结构组成的。为了实现这种部分连接的交换结构，虽然不同的FPGA厂商、不同的FPGA芯片采用了不同的方法，但其中蕴含的中心思想是类似的。此外，这篇文章对学术研究也有着重大的影响。这项成果发表后的数年间，其中包含的实验结果被不断地进行理论归纳，从而为其他研究者奠定了坚实的理论基础。


    ### 4．实验假设、工具和分析技术对FPGA架构研究结论的影响

    **一句话总结：**超越FPGA研究领域的研究方法论佳作


    **英文名：**On the Sensitivity of FPGA Architectural Conclusions to Experimental Assumptions，Tools，and
    Techniques


    **作者：**Andy Yan，Rebecca Cheng，Steven J. E. Wilton


    **发表时间：**2002年


    **推介人：**Katherine Compton（威斯康星大学麦迪逊分校）


    从事FPGA架构研究的学者都知道，研究时使用的实验方法会对架构研究的结果产生重要的影响。对于一个FPGA架构参数，有太多的因素会对它造成影响，例如选取的测试基准电路，用来把电路映射到FPGA上的EDA工具等。


    然而，知道这些因素可能会影响结果是一回事，看EDA数据到它们确实会影响结果则是另外一回事。这项工作为我们揭示了一个重要结论，那就是通过实验的方法寻找最优的FPGA架构参数可能并不会带来最优EDA结果，因为实验结果可能在很大程度上取决于实验是如何设置的。例如，图5-9清晰地展示了当使用不同的EDA工具和设置时，最优的LUT大小会在4～6输入之间来回变化。


    ![](OEBPS/Images/Figure-P186_1936.jpg)

    图5-9　使用不同EDA工具时，LUT大小与电路面积的关系


    更重要的是，这项工作从方法论的角度鼓励研究人员去更加仔细地设计他们的实验，并构建他们的结论。事实上，这已经超出了FPGA的研究范畴，并对所有刚刚从事科学研究的学者都有着很大的借鉴意义。这项成果所传递的研究思路，会让研究者仔细审视自己的研究方法，而避免只从表面上看结果。通过这项成果，人们应该意识到仔细构建实验和客观分析结果的重要性，并要永远质疑结果的有效性和适用性。


    ### 5．基于纳米线的亚光刻可编程逻辑阵列

    **一句话总结：**利用时代前沿技术设计制造FPGA的开创性研究


    **英文名：**Nanowire-Based Sublithographic Programmable Logic Arrays


    **作者：**Andre DeHon，Michael J. Wilson


    **推介人：**Deming Chen（伊利诺伊大学香槟分校）


    2003年，基于纳米线的集成电路设计取得了两个突破性成就。其一是哈佛大学发表的一种通用的控制纳米线结构和层级的方法，另一个则是惠普实验室发表的对纳米级电路元件进行制造和测试的方法。尽管如此，这个领域的大多数研究都只是专注于纳米线晶体管设计，或者简单的基于纳米线的逻辑与存储单元设计。


    受此启发，这项工作的作者抓住机会将纳米元件的制造与纳米系统的设计结合起来，并展现了纳米技术的真正力量。这项成果使用纳米线构建了大型可编程逻辑阵列的布线交换结构，并对系统设计进行了详细建模。此外，这项成果还指出了许多独特的设计挑战与问题，包括如何使用一种随机机制来处理纳米级别的二极管的恢复（Restoration）问题等。这项成果还对纳米架构的芯片面积、良率、时序等问题进行了详尽的理论分析，并将一系列基准测试电路映射到这个新型纳米架构上，以评估他们的逻辑密度。


    这项成果详细分析了这种架构的设计和制造挑战，以及它对传统的CMOS FPGA架构的潜在竞争优势。这样的研究对于业界理解纳米科技，以及它将如何给FPGA带来提升有着重要意义。在这项成果的后续工作中，作者还讨论了纳米线结构的制造缺陷等问题。


    光刻技术一直是制造CMOS电路的根本性技术之一。这项成果表明，在不使用光刻技术的情况下，利用新兴的制造技术来构建高密度、大规模的可编程逻辑结构是可行的。这也为学术界和业界提供了一种可以超越传统光刻限制的替代方案。


    ## ■5.2.3　FPGA布局布线算法篇

    本篇介绍五个FPGA布局布线算法领域的重要工作。在这些工作中，有的建立了大部分现代商用FPGA的布线算法基础，有的大幅改进了FPGA布局、布线、时序优化等多个环节的算法性能，有的则对FPGA设计软件及算法进行了跨越式的提升和优化。


    ### 1．寻路者：基于协商的FPGA性能优化布线算法

    **一句话总结：**历史最强FPGA布线算法，没有之一


    **英文名：**Pathfinder：A Negotiation-Based Performance-Driven Router for FPGAs


    **作者：**Larry McMurchie，Carl Ebeling（见图5-10）


    **发表时间：**1995年


    **推介人：**Sinan Kaptanoglu（Microsemi公司）


    ![](OEBPS/Images/Figure-P188_1966.jpg)

    图5-10　Carl Ebeling，现任华盛顿大学教授


    这项工作可以算是过去20年中影响FPGA技术发展的最重要的成果之一。这项成果对工业界和学术界都产生了极其深远的影响。最重要的是，这个工作将FPGA的布线研究，从一个结果波动极大的问题，转化为一个能够很好控制结果的优化问题。时至今日，几乎所有的FPGA厂商都在使用这项工作提出的协商拥塞（Negotiated
    Congestion）布线算法，或者是由这个算法引申出来的其他布线方法。此外，学术界最为广泛使用的FPGA架构设计和分析工具VPR，也是基于这项成果开发的。


    通常来说，有些研究成果会立刻在学术界引起轰动，而有些则会首先被低估一段时间，然后才会被人们完全理解，这项成果就属于后者。很多研究FPGA设计工具的工作都会遵循一定的套路，那就是先提出一些新的想法，然后使用基准测试对这些想法进行实验，最后得到的结论是比当时的其他工作取得5%～10%的提升，诸如此类。并不是说这些工作不够优秀，但事实上，由于EDA领域会不断出现新的工作，并取得更好的结果，因此大多数的工作所取得的成就和影响都是暂时的。


    1995年，大多数FPGA研究者都认为这项工作也只不过是又一个取得了10%性能提升的成果，和其他研究并无二致。只有很少的人认识到，这项成果带来的是改变整个游戏规则的根本性创新，它将在今后的几十年里经受住其他工作的挑战，而且不会被其他布线算法所超越。幸运的是，在随后的几年里，学术界和工业界都渐渐认识到，这项成果所提出的理念已经达到了前所未有的高度。


    这项工作首先阐述了协商的基本思想，以及处理一阶拥塞的方法。然后分析了二阶拥塞，并引入了对“历史成本（History Cost）”的需求。之后将这个概念进行了推广，并将布线延时引入考量。最后给出了这个算法的伪代码，以及一些实验结果。相比于当时的其他商用工具，这个方法能取得11%的效果提升。


    时至今日，我们已经能够广泛而成功地使用协商拥塞算法来处理FPGA的布线问题了。尽管如此，这个方法为何如此有效，学术界在理论层面上仍然莫衷一是。例如，现在我们基本能理解和分析退火算法是如何工作和收敛的，但对于协商拥塞算法的理解还远远达不到这个层次，人们还没有对这个思想构建起足够严谨的理论体系。因此，这项工作仍将继续激发研究者们对这一课题的进一步研究。


    ### 2．FPGA布线架构：分段与缓冲及其对速度和逻辑密度的优化

    **一句话总结：**对VPR工具的跨越式优化，从而直接影响高端商业FPGA的成形和发展


    **英文名：**FPGA Routing Architecture：Segmentation and Buffering to Optimize Speed
    and Density


    **作者：**Vaughn Betz，Jonathan Rose


    **发表时间：**1999年


    **推介人：**Carl Ebeling（华盛顿大学）


    这项工作在VPR中加入了对时序优先布线算法的支持，并对延时进行了精确估计。这使得VPR可以对FPGA互连网络结构进行更加深入的研究。通常来说，FPGA上90%的面积都是用来进行可编程布线的，而关键路径延时里有80%都是布线延时。因此，如何构建正确的FPGA互连网络，对于性能和资源消耗来说都是至关重要的。随着FPGA面积的不断增加，这一点更为明显，因为根据Rent法则，电路中导线数量的增长必须快于逻辑单元数量的增长。


    然而，芯片架构师们经常习惯于根据直觉和以往的经验做出决策，而不是根据基准测试和理论分析。EDA工具通常针对单一架构进行优化，如果架构进行了变更，工具的性能和有效性就会不可避免的下降。此外，如果要量化互连对性能的影响，就需要有基于时序驱动的综合、布局和布线算法。


    这项工作在VPR中引入了一种用来精确估计延时的Elmore模型，并阐述了一种使用VPR对FPGA布线架构进行分析和评估的方法。这使得FPGA架构师可以通过一种架构描述语言（Architecture
    Description Language），对FPGA架构进行建模和分析，然后工具就可以自动对这种架构进行适配。


    这项成果首先假设了一个传统的岛型FPGA架构，然后尝试使用最优的方法对连线进行分段，并将这些分段连接起来。通过使用VPR，可以自动对大部分的参数空间进行探索，从而得到对于给定的参数的最优布线结果。


    这项成果最大的贡献在于它所使用的方法论和工具，仅仅在几年之后，Altera在构建Stratix架构时就采用了相似的设计方法，并且采用了基于VPR的工具包。这进一步表明，创新既需要跳出固有的思维模式，又要使用先进的工具来评估这些新的想法，两者缺一不可。


    ### 3．从高层描述自动生成FPGA布线架构

    **一句话总结：**通过自动处理FPGA布线架构研究中烦琐的部分，推进了整个研究领域的跨越式发展


    **英文名：**Automatic Generation of FPGA Routing Architectures from High-Level Descriptions


    **作者：**Vaughn Betz，Jonathan Rose


    **发表时间：**2000年


    **推介人：**Scott Hauck（华盛顿大学）


    FPGA的架构研究是非常复杂的，有时即使是为了回答最简单的问题，都需要付出相当程度的努力。在很多情况下，FPGA架构师会认为他们的一些新想法，例如更大的逻辑块、新型的进位链等，理应会极大地提升系统的功耗、性能、面积、稳定性等指标。然而，为了证明这些想法的可行性，就需要设计工具和实际应用来对这些想法进行验证。同时，也需要结合很多和这些想法无关的FPGA架构细节，以组成一个完整的系统。在工具层面，大名鼎鼎的Pathfinder和VPR的出现，已经为大多数逻辑映射工作提供了一个稳定而高效的后端平台。


    然而，对于FPGA互连架构来说，仍然有着很多细节问题需要注意。例如，连线长度、互连方法、逻辑块结构等，这些问题往往与研究者们希望研究的主要问题无关，但却都是必须统筹考虑的问题。例如，尽管单向导线（Unidirectional
    Wires）也许是个好的想法，但如果我们将其用于所有的互连节点，那么面积和容抗的增加将迅速掩盖这个想法带来的优点和好处。那么，如果我们只将其用于50%的互连节点，然后将所有的逻辑块输出连接到奇数号导线、将所有逻辑块输入连接到偶数号导线呢？如果我们又想到了其他的互连架构和方式呢？在这项成果面世之前，这些问题都是无法求解的。


    因此，解决这类问题的重点，是这项成果所展示的架构描述语言，以及VPR中的架构生成器。简单来说，这项成果专注于处理那些布线架构中没人关心，但却非常重要的细节问题，例如，逻辑块是如何连接的？如何保证连线之间的交互不会对系统产生不确定影响？交换架构是如何组织排列的？当设计中存在长导线时，如何保证这条穿过芯片多个区域的连线以合理的方式进行分段？这样的问题还有很多很多，而这项成果就是用来解决这些在FPGA架构研究中的细微问题。

    '
  trans: '


    这项工作更重要的贡献是向人们揭示了 FPGA 的架构特性（如固化的内存单元和 DSP 等）与基准测试结果的相关性。同时，这项工作深入分析了 FPGA 里固化的逻辑结构对性能和成本的影响与关联，而这也直接对现代
    FPGA 的架构设计产生了深远影响。在现代 FPGA 中，将哪些 IP 或逻辑电路采用硬核的方式实现，已经成为了影响 FPGA 发展的重要命题。这与像查找表
    LUT 的大小、布线拓扑结构等传统 FPGA 架构问题同样重要。


    在学术界，像这样的基准测试工作也总是充满争议的。因为它们要么在比较时采用了不同的衡量标准，要么对比较的标准进行了抽象，使得结果不具有扩展性和通用性。然而，这项成果为这类工作树立了典范，它展示了如何客观地做比较，以及如何细致地描述比较的具体细节，这样使得研究者可以从结果中得到自己的结论，并将这种思想应用到今后的研究工作中。


    ## ■5.2.2　FPGA 微架构篇

    本篇介绍了五个 FPGA 微架构领域的重要工作，它们有的奠定了现代 FPGA 查找表 LUT 微结构的理论基础，有的探讨了 FPGA 布线架构的设计与优化方法，有的探索了当代最新科技与
    FPGA 微架构设计的结合。


    ### 1．在可重构计算阵列中平衡互连与计算

    **一句话总结：**首次考虑了逻辑资源与布线资源的平衡使用，从而得到更优的资源利用率，对 FPGA 架构与 CAD 工具设计具有深远影响


    **英文名：**Balancing Interconnect and Computation in a Reconfigurable Computing Array（or，why
    you don''t really want 100% LUT utilization）


    **作者：**Andre DeHon


    **发表时间：**1999 年


    **推介人：**Mike Hutton（谷歌）


    这项成果完美结合了理论、实证分析，以及富有洞见的探讨，打破了关于 FPGA 架构优化的常见假设，特别是通过对比逻辑面积与布线面积，证明了 100%的硬件利用率并不一定会带来最优的结果。


    这项成果首次深入研究了 FPGA 设计中不同部分的布线需求，分析了最坏情况下的布线要求及其对器件整体的影响。这项成果影响了后来很多关于 FPGA 架构的研究工作，并在发表十多年后仍然被多次引用。由这项成果发展而成的一项名为
    HSRA 的布线方法，也重新引起了学术界和工业界对层次化 FPGA 架构设计及分析的兴趣。


    这项成果的另外一个贡献是，它清晰地描述了 FPGA 架构风格与 CAD 算法风格之间的对应关系：在这个工作中就是分层递归分解。Andre DeHon 进一步对比了
    FPGA 逻辑互连的增长率与器件大小之间的关系，阐述了高效的系统架构设计的一系列实证结果。


    除此之外，这项成果最值得借鉴的地方是它的方法论。通过使用基于树状网格的架构，可以得到伸缩性更强的 FPGA 互连架构模型，并对基于逻辑簇（Logic Clusters）的传统方法提出了挑战。当结果与传统观念不同的时候，Andre
    DeHon 对问题的本质有着清晰而敏锐的认识。这也使得这项工作在 FPGA 的很多领域有着全面而深远的影响。


    ### 2．LUT 和簇大小对深亚微米 FPGA 性能与密度的影响

    **一句话总结：**现代 FPGA 里 6 输入 LUT 结构的理论基础


    **英文名：**The Effect of LUT and Cluster Size on Deep-Submicron FPGA Performance
    and Density


    **作者：**Elias Ahmed，Jonathan Rose


    **发表时间：**2000 年


    **推介人：**Mike Hutton（谷歌）


    这项开创性的研究深入分析了将逻辑单元组成层次化结构的过程中，查找表 LUT 大小和逻辑簇大小对系统性能和整体面积的影响。在这项成果发表之前，学术界刚刚开始探索和讨论
    FPGA 里的逻辑簇结构，见图 5-7。在工业界，尽管 Altera 和赛灵思已经开始使用层次化结构，但它们有着不同的大小和接口类型，从而限制了其进一步使用。在这个大背景下，这项工作首次探讨了面积和延时的权衡与折中，以及它们与簇输入数量的关系。


    这项工作的主要成果是在给定电路面积的情况下，对理想情况下的输入数量进行了建模，并给出了 LUT 大小和簇大小的最优范围，以满足特定的面积与延时要求。值得注意的是，这项工作指出
    6 输入的 LUT 会取得比以往都要好的面积与延时结果，见图 5-8，而这个结论也为现代 FPGA 里采用的 6 输入 LUT 结构奠定了理论基础。


    ![](img/Figure-P183_1895.jpg)

    图 5-7　FPGA 逻辑簇结构


    这项工作除了它的结果影响深远之外，它所采用的方法论也有着很强的借鉴意义。两位作者指出，他们得到的这些最优解取决于当时的工艺参数和条件，随着半导体制造工艺的不断进步，这些最优解也会随之变化。他们也在这项工作中给出了一个清晰且可以重用的框架，用来预测和判断当工艺进步时这些最优点的变化情况。


    这项工作另外的一个主要贡献是，它建立了一个评估 FPGA 架构的标准化体系，这其中包含了从综合到布局布线的各个 FPGA 开发阶段。它也为后续的 FPGA
    架构研究以及 CAD 算法开发提供了参考标准。


    ![](img/Figure-P184_1901.jpg)

    图 5-8　LUT 大小对面积和延时的影响


    ### 3．在 LUT 簇中使用稀疏交换结构

    **一句话总结：**现代 FPGA 布线微架构设计的奠基之作


    **英文名：**Using Sparse Crossbars within LUT Clusters


    **作者：**Guy Lemieux，David Lewis


    **发表时间：**2001 年


    **推介人：**Sinan Kaptanoglu（Microsemi 公司）


    这项成果着重探讨了一个全新的问题，那就是在不假设全连接的情况下，如何构建 FPGA 逻辑簇里的布线架构。在之前的其他工作中，很多研究人员已经深入研究了基于逻辑簇的
    FPGA 结构。然而，这些对簇和 LUT 大小、互连方式等的研究，都基于这样的一个假设，即簇内布线是全连接的。然而，在这项成果中，我们看到如果大量减少负责全连接的交换结构（Crossbar），就可以显著地改变簇的最优特性，并保持很好的布线灵活度与较高的系统性能。


    为了印证这个观点，这项工作首先提出了一种通用度很高的 FPGA 簇结构，并引入了面积与延时模型，用来计算和比较面积和性能的相关参数。此外，这项工作还讨论了
    FPGA 架构中各项参数对面积和性能的影响，包括加入额外的 LUT 输入等。


    这项工作对 FPGA 业界有着极大的启发意义。在今天，绝大多数商业级 FPGA 的布线架构都基于逻辑簇结构，而这些簇都是由部分连接（而非全连接）的交换结构组成的。为了实现这种部分连接的交换结构，虽然不同的
    FPGA 厂商、不同的 FPGA 芯片采用了不同的方法，但其中蕴含的中心思想是类似的。此外，这篇文章对学术研究也有着重大的影响。这项成果发表后的数年间，其中包含的实验结果被不断地进行理论归纳，从而为其他研究者奠定了坚实的理论基础。


    ### 4．实验假设、工具和分析技术对 FPGA 架构研究结论的影响

    **一句话总结：**超越 FPGA 研究领域的研究方法论佳作


    **英文名：**On the Sensitivity of FPGA Architectural Conclusions to Experimental Assumptions，Tools，and
    Techniques


    **作者：**Andy Yan，Rebecca Cheng，Steven J. E. Wilton


    **发表时间：**2002 年


    **推介人：**Katherine Compton（威斯康星大学麦迪逊分校）


    从事 FPGA 架构研究的学者都知道，研究时使用的实验方法会对架构研究的结果产生重要的影响。对于一个 FPGA 架构参数，有太多的因素会对它造成影响，例如选取的测试基准电路，用来把电路映射到
    FPGA 上的 EDA 工具等。


    然而，知道这些因素可能会影响结果是一回事，看 EDA 数据到它们确实会影响结果则是另外一回事。这项工作为我们揭示了一个重要结论，那就是通过实验的方法寻找最优的
    FPGA 架构参数可能并不会带来最优 EDA 结果，因为实验结果可能在很大程度上取决于实验是如何设置的。例如，图 5-9 清晰地展示了当使用不同的 EDA
    工具和设置时，最优的 LUT 大小会在 4～6 输入之间来回变化。


    ![](img/Figure-P186_1936.jpg)

    图 5-9　使用不同 EDA 工具时，LUT 大小与电路面积的关系


    更重要的是，这项工作从方法论的角度鼓励研究人员去更加仔细地设计他们的实验，并构建他们的结论。事实上，这已经超出了 FPGA 的研究范畴，并对所有刚刚从事科学研究的学者都有着很大的借鉴意义。这项成果所传递的研究思路，会让研究者仔细审视自己的研究方法，而避免只从表面上看结果。通过这项成果，人们应该意识到仔细构建实验和客观分析结果的重要性，并要永远质疑结果的有效性和适用性。


    ### 5．基于纳米线的亚光刻可编程逻辑阵列

    **一句话总结：**利用时代前沿技术设计制造 FPGA 的开创性研究


    **英文名：**Nanowire-Based Sublithographic Programmable Logic Arrays


    **作者：**Andre DeHon，Michael J. Wilson


    **推介人：**Deming Chen（伊利诺伊大学香槟分校）


    2003 年，基于纳米线的集成电路设计取得了两个突破性成就。其一是哈佛大学发表的一种通用的控制纳米线结构和层级的方法，另一个则是惠普实验室发表的对纳米级电路元件进行制造和测试的方法。尽管如此，这个领域的大多数研究都只是专注于纳米线晶体管设计，或者简单的基于纳米线的逻辑与存储单元设计。


    受此启发，这项工作的作者抓住机会将纳米元件的制造与纳米系统的设计结合起来，并展现了纳米技术的真正力量。这项成果使用纳米线构建了大型可编程逻辑阵列的布线交换结构，并对系统设计进行了详细建模。此外，这项成果还指出了许多独特的设计挑战与问题，包括如何使用一种随机机制来处理纳米级别的二极管的恢复（Restoration）问题等。这项成果还对纳米架构的芯片面积、良率、时序等问题进行了详尽的理论分析，并将一系列基准测试电路映射到这个新型纳米架构上，以评估他们的逻辑密度。


    这项成果详细分析了这种架构的设计和制造挑战，以及它对传统的 CMOS FPGA 架构的潜在竞争优势。这样的研究对于业界理解纳米科技，以及它将如何给 FPGA
    带来提升有着重要意义。在这项成果的后续工作中，作者还讨论了纳米线结构的制造缺陷等问题。


    光刻技术一直是制造 CMOS 电路的根本性技术之一。这项成果表明，在不使用光刻技术的情况下，利用新兴的制造技术来构建高密度、大规模的可编程逻辑结构是可行的。这也为学术界和业界提供了一种可以超越传统光刻限制的替代方案。


    ## ■5.2.3　FPGA 布局布线算法篇

    本篇介绍五个 FPGA 布局布线算法领域的重要工作。在这些工作中，有的建立了大部分现代商用 FPGA 的布线算法基础，有的大幅改进了 FPGA 布局、布线、时序优化等多个环节的算法性能，有的则对
    FPGA 设计软件及算法进行了跨越式的提升和优化。


    ### 1．寻路者：基于协商的 FPGA 性能优化布线算法

    **一句话总结：**历史最强 FPGA 布线算法，没有之一


    **英文名：**Pathfinder：A Negotiation-Based Performance-Driven Router for FPGAs


    **作者：**Larry McMurchie，Carl Ebeling（见图 5-10）


    **发表时间：**1995 年


    **推介人：**Sinan Kaptanoglu（Microsemi 公司）


    ![](img/Figure-P188_1966.jpg)

    图 5-10　Carl Ebeling，现任华盛顿大学教授


    这项工作可以算是过去 20 年中影响 FPGA 技术发展的最重要的成果之一。这项成果对工业界和学术界都产生了极其深远的影响。最重要的是，这个工作将 FPGA
    的布线研究，从一个结果波动极大的问题，转化为一个能够很好控制结果的优化问题。时至今日，几乎所有的 FPGA 厂商都在使用这项工作提出的协商拥塞（Negotiated
    Congestion）布线算法，或者是由这个算法引申出来的其他布线方法。此外，学术界最为广泛使用的 FPGA 架构设计和分析工具 VPR，也是基于这项成果开发的。


    通常来说，有些研究成果会立刻在学术界引起轰动，而有些则会首先被低估一段时间，然后才会被人们完全理解，这项成果就属于后者。很多研究 FPGA 设计工具的工作都会遵循一定的套路，那就是先提出一些新的想法，然后使用基准测试对这些想法进行实验，最后得到的结论是比当时的其他工作取得
    5%～10%的提升，诸如此类。并不是说这些工作不够优秀，但事实上，由于 EDA 领域会不断出现新的工作，并取得更好的结果，因此大多数的工作所取得的成就和影响都是暂时的。


    1995 年，大多数 FPGA 研究者都认为这项工作也只不过是又一个取得了 10%性能提升的成果，和其他研究并无二致。只有很少的人认识到，这项成果带来的是改变整个游戏规则的根本性创新，它将在今后的几十年里经受住其他工作的挑战，而且不会被其他布线算法所超越。幸运的是，在随后的几年里，学术界和工业界都渐渐认识到，这项成果所提出的理念已经达到了前所未有的高度。


    这项工作首先阐述了协商的基本思想，以及处理一阶拥塞的方法。然后分析了二阶拥塞，并引入了对“历史成本（History Cost）”的需求。之后将这个概念进行了推广，并将布线延时引入考量。最后给出了这个算法的伪代码，以及一些实验结果。相比于当时的其他商用工具，这个方法能取得
    11%的效果提升。


    时至今日，我们已经能够广泛而成功地使用协商拥塞算法来处理 FPGA 的布线问题了。尽管如此，这个方法为何如此有效，学术界在理论层面上仍然莫衷一是。例如，现在我们基本能理解和分析退火算法是如何工作和收敛的，但对于协商拥塞算法的理解还远远达不到这个层次，人们还没有对这个思想构建起足够严谨的理论体系。因此，这项工作仍将继续激发研究者们对这一课题的进一步研究。


    ### 2．FPGA 布线架构：分段与缓冲及其对速度和逻辑密度的优化

    **一句话总结：**对 VPR 工具的跨越式优化，从而直接影响高端商业 FPGA 的成形和发展


    **英文名：**FPGA Routing Architecture：Segmentation and Buffering to Optimize Speed
    and Density


    **作者：**Vaughn Betz，Jonathan Rose


    **发表时间：**1999 年


    **推介人：**Carl Ebeling（华盛顿大学）


    这项工作在 VPR 中加入了对时序优先布线算法的支持，并对延时进行了精确估计。这使得 VPR 可以对 FPGA 互连网络结构进行更加深入的研究。通常来说，FPGA
    上 90%的面积都是用来进行可编程布线的，而关键路径延时里有 80%都是布线延时。因此，如何构建正确的 FPGA 互连网络，对于性能和资源消耗来说都是至关重要的。随着
    FPGA 面积的不断增加，这一点更为明显，因为根据 Rent 法则，电路中导线数量的增长必须快于逻辑单元数量的增长。


    然而，芯片架构师们经常习惯于根据直觉和以往的经验做出决策，而不是根据基准测试和理论分析。EDA 工具通常针对单一架构进行优化，如果架构进行了变更，工具的性能和有效性就会不可避免的下降。此外，如果要量化互连对性能的影响，就需要有基于时序驱动的综合、布局和布线算法。


    这项工作在 VPR 中引入了一种用来精确估计延时的 Elmore 模型，并阐述了一种使用 VPR 对 FPGA 布线架构进行分析和评估的方法。这使得 FPGA
    架构师可以通过一种架构描述语言（Architecture Description Language），对 FPGA 架构进行建模和分析，然后工具就可以自动对这种架构进行适配。


    这项成果首先假设了一个传统的岛型 FPGA 架构，然后尝试使用最优的方法对连线进行分段，并将这些分段连接起来。通过使用 VPR，可以自动对大部分的参数空间进行探索，从而得到对于给定的参数的最优布线结果。


    这项成果最大的贡献在于它所使用的方法论和工具，仅仅在几年之后，Altera 在构建 Stratix 架构时就采用了相似的设计方法，并且采用了基于 VPR 的工具包。这进一步表明，创新既需要跳出固有的思维模式，又要使用先进的工具来评估这些新的想法，两者缺一不可。


    ### 3．从高层描述自动生成 FPGA 布线架构

    **一句话总结：**通过自动处理 FPGA 布线架构研究中烦琐的部分，推进了整个研究领域的跨越式发展


    **英文名：**Automatic Generation of FPGA Routing Architectures from High-Level Descriptions


    **作者：**Vaughn Betz，Jonathan Rose


    **发表时间：**2000 年


    **推介人：**Scott Hauck（华盛顿大学）


    FPGA 的架构研究是非常复杂的，有时即使是为了回答最简单的问题，都需要付出相当程度的努力。在很多情况下，FPGA 架构师会认为他们的一些新想法，例如更大的逻辑块、新型的进位链等，理应会极大地提升系统的功耗、性能、面积、稳定性等指标。然而，为了证明这些想法的可行性，就需要设计工具和实际应用来对这些想法进行验证。同时，也需要结合很多和这些想法无关的
    FPGA 架构细节，以组成一个完整的系统。在工具层面，大名鼎鼎的 Pathfinder 和 VPR 的出现，已经为大多数逻辑映射工作提供了一个稳定而高效的后端平台。


    然而，对于 FPGA 互连架构来说，仍然有着很多细节问题需要注意。例如，连线长度、互连方法、逻辑块结构等，这些问题往往与研究者们希望研究的主要问题无关，但却都是必须统筹考虑的问题。例如，尽管单向导线（Unidirectional
    Wires）也许是个好的想法，但如果我们将其用于所有的互连节点，那么面积和容抗的增加将迅速掩盖这个想法带来的优点和好处。那么，如果我们只将其用于 50%的互连节点，然后将所有的逻辑块输出连接到奇数号导线、将所有逻辑块输入连接到偶数号导线呢？如果我们又想到了其他的互连架构和方式呢？在这项成果面世之前，这些问题都是无法求解的。


    因此，解决这类问题的重点，是这项成果所展示的架构描述语言，以及 VPR 中的架构生成器。简单来说，这项成果专注于处理那些布线架构中没人关心，但却非常重要的细节问题，例如，逻辑块是如何连接的？如何保证连线之间的交互不会对系统产生不确定影响？交换架构是如何组织排列的？当设计中存在长导线时，如何保证这条穿过芯片多个区域的连线以合理的方式进行分段？这样的问题还有很多很多，而这项成果就是用来解决这些在
    FPGA 架构研究中的细微问题。


