  trans: '


    由此可见，在未来的电信网络中，SDN 将会是重要的发展方向，这也将引领现有的电信网络架构进行重构和转型。对于中国电信而言，这场技术转型和智能化重构将于 2025
    年之前全部完成。


    ## 2.3.2 使用 FPGA 加速虚拟网络功能的实现


    SDN 和 NFV 已经在引领电信网络智慧转型的大潮，但在实际工程实践中，设计实现有效的 SDN 和 NFV 架构仍然面临着很多问题和挑战。例如，在不同的应用场景中，网络负载的种类五花八门，而很多应用都需要进行线速的处理，如
    QoS（Quality of Service，服务质量）、流量整形、VPN、防火墙、网络地址转换、加密解密、实时监控、深度包检测（DPI）等。然而，用软件实现的网络功能在性能上很难和专有硬件相比，即便有像
    DPDK 这样的网络专用的软件开发库，目前单纯使用软件实现这些网络服务的线速处理，在技术上仍然存在很大困难。这样一来，人们会反过来质疑使用 NFV 和 SDN
    的出发点和动机。同时，鉴于这两项技术仍然处于相对早期的方案探讨阶段，很多相关的协议和标准还没有最终确定，这也在一定程度上劝退了不少企业，也有很多企业在观望和犹豫是否要投入大量资源去进行前期的探究工作。


    在 SDN 和 NFV 中，上面提到的这些网络负载都可以使用虚拟化技术实现，并成为一个个虚拟网络功能（Virtualized Network Function，VNF）。通常而言，对于一个有效的
    SDN 和 NFV 实现来说，其中的 VNF 必须非常灵活，便于使用，同时容易大规模扩展，不局限于某种应用场景或网络。此外，这些 VNF 的性能应该不低于，甚至高于专用的硬件设备。因此，为了有效地实现这些虚拟网络功能，就需要做到控制面和转发面的分离和独立扩展，同时设计并优化拥有可编程能力的转发面，最终将其进行标准化。


    在电信网络的应用场景中，NFV 的一个典型应用就是虚拟化的宽带远程接入服务 vBRAS（virtual Broadband Remote Access Server），又称为
    vBNG（virtual Broadband Network Gateway）。在 vBRAS 中可能包含很多虚拟网络功能，例如远程用户拨入验证服务 RADIUS、动态主机设置协议
    DHCP，以及之前提过的 DPI、防火墙、QoS 等。


    一个重要的发现是，这些网络应用从计算资源的需求上可以分成两类：一类不需要大量的计算资源，如 RADIUS 和 DHCP。同时，这类应用很多属于控制平面，因此它们很适合直接放在控制平面，并且有很好的纵向和横向的扩展性，也很适合用通用的计算和存储设备进行实现。另一类应用往往需要很大的计算能力，如流量管理、路由转发、数据包处理等，且通常需要在线速下（如
    40Gbps、100Gbps 或更高）进行处理。这类应用往往属于数据平面。对于数据平面，它还需要支持很多种计算量很大的网络功能，这样才能区别于使用专有硬件，符合
    NFV 技术的初衷。


    综上而言，数据平面应该能线速进行高吞吐量的复杂数据包处理，同时支持多种网络功能，具有很强的可编程能力。然而，如果直接使用软件方法实现，这两点功能很难同时满足，这主要是由
    CPU 和软件的性能瓶颈造成的。如果采用其他特制的硬件加速单元，如自研 ASIC，又无法灵活地适应不断变化的 SDN 和 NFV 协议，同时对数据中心的同构性、开发和运维成本等造成过大负担，这和之前介绍的云数据中心硬件加速器的评价标准相同。


    在这个背景之下，FPGA 就成为了性价比最优的方案。采用 FPGA 作为智能硬件加速平台，能同时解决处理速度和可编程性两个问题。首先，相比纯软件实现的方法，FPGA
    在数据包处理上拥有着性能的绝对优势，可以在硬件上对网络数据进行并行处理。相比于传统的专有硬件设备，FPGA 还拥有灵活的可编程能力，可以支持各种虚拟网络应用的实现。


    例如，2017 年中国电信就联合英特尔与 HPE 发布了名为《为下一代电信基础设施寻找有效的虚拟网络体系架构》的技术白皮书，在系统层面详细阐述了三家公司在推动
    SDN 和 NFV 技术发展所做的工作和成果。其中，他们使用了 FPGA 作为数据平面的主要计算加速单元，在多租户情况下对 QoS 和多级流量整形进行线速处理。


    与微软 Catapult 项目中使用的 FPGA 智能网卡类似，这种基于 FPGA 的网络数据包处理方式十分灵活。例如，可以将数据包完全在 FPGA 内部处理后转发，不经过
    CPU；也可以将数据包通过 PCIe 传送到 CPU，使用 DPDK 等包处理软件进行处理，再通过 CPU 转发；或者二者结合，一部分虚拟网络功能在 CPU
    上实现，另一部分则可以卸载到 FPGA 上完成。


    此外，由于 FPGA 有着动态重构的特点，它可以在不同的时间段，对多种网络功能进行计算加速，而不需要更换硬件板卡或设备。除了通用的网络功能之外，用户的自定义网络功能也能在
    FPGA 中很好地支持，而不需要专有设备完成。这些都很好地平衡了高性能和高通用性两者间的矛盾。


    可以看到，FPGA 已经逐渐开始在电信网络提供商的数据中心得到使用和部署，并深度参与到电信网络的智能化转型过程中。在这个过程中，有很多全新的问题和要求不断出现，很多甚至是我们从未考虑过的。例如，如何有效地设计
    CPU+FPGA 这样的异构计算架构，如何实现计算-控制-存储等单元的有效管理和分配，如何将硬件加速资源在数据中心进行高效部署，如何设计商业模型以明确 FPGA
    或者其他硬件加速器在整个系统中的位置和作用等。这些问题都对今后如何在数据中心里高效地使用 FPGA 提出了全新的要求，也将会是未来一段时间企业和学术界共同的研究重点。


    ## 2.4 系统级解决方案：FPGA 加速卡


    作为加速云数据中心的重要组件，FPGA 已经开始了它在数据中心领域的广泛使用。除了像微软、亚马逊这样的大型云服务提供商之外，FPGA 也逐渐开始进入其他类型和规模的数据中心，并在大数据处理、AI、网络功能加速等领域扮演着重要的角色。


    在这些基于大数据浪潮的全新应用中，FPGA 厂商也在不断地探索和尝试新的 FPGA 推广方法。这些推广的目的非常明确，就是让更多的用户使用自己的 FPGA
    产品。在这个过程里，我们可以看到一个重要的发展趋势，那就是 FPGA 厂商正在逐渐地从一个单纯的芯片厂商，转变为系统级解决方案提供商。


    在本节中，我们将详细介绍当前 FPGA 厂商如何不断布局加速卡产品市场，以及他们如何使用加速卡推广自身的 FPGA 系统级解决方案。


    ### 2.4.1 FPGA 应用方案的转型


    在传统的 FPGA 业务模型里，FPGA 厂商通常只负责卖给客户两样东西：一个是 FPGA 芯片，另外一个是 FPGA 的 EDA 开发工具。这两件东西一旦售出，客户开发何种应用就与厂商无关。虽然厂商也会提供详尽的技术支持，但主要的开发过程还是由客户完成。然而，这种业务模型并不适用于新的
    FPGA 应用领域。一方面，在这些新兴领域里，有着 CPU、GPU、ASIC 等多种硬件实现方案，FPGA 在很多时候并不是用户的第一选择。另一方面，用户的研发重点在于新算法、新应用的设计，而非
    FPGA 本身的开发。事实上，只有能更快地完成算法和应用实现的硬件平台，才能帮助客户快速进入并抢占市场。


    基于此，现如今 FPGA 厂商更倾向于提供给客户一个完整的系统级解决方案。两大 FPGA 厂商目前纷纷推出的各类 FPGA 加速卡，就是这个趋势的典型代表。


    总体而言，FPGA 厂商在硬件层面已经不单单提供芯片级的产品，而是进一步提供板卡级的产品组合。与开发板不同，FPGA 加速卡是针对特定领域和应用的专业板卡，通常以
    PCIe 扩展卡的方式进行部署。板卡上设计有丰富的高速 I/O 接口与存储资源，但往往不会配备太多开发板上常见的功能与资源，例如通用 I/O 与调试接口等。


    在软件层面，FPGA 厂商除了提供传统的开发套件之外，现在还会提供与 FPGA 加速卡配套的驱动、各类软件库、编程接口（API），甚至还有下文会提到的完整的软件开发栈以及软硬件参考设计。通过提供这些完整的开发环境，大大简化了
    FPGA 的开发难度，使得软件开发人员也能在短时间内完成算法模型的 FPGA 实现。FPGA 厂商的主要目的，是在不断提供原厂软硬件解决方案的同时，也在不断吸收第三方的
    IP 与应用，从而构建一个完整的 FPGA 生态系统。


    同时我们也应该注意到，除了 FPGA 原厂的加速卡方案之外，很多第三方厂家，例如华为、浪潮和 Mellanox 等，也相继推出了各自的 FPGA 加速卡产品。这些第三方加速卡虽然采用的都是英特尔或赛灵思的
    FPGA 芯片，但都针对各自的细分领域做了优化设计，以适应目标应用的需要。


    接下来，我们将详细介绍主要 FPGA 厂商的 FPGA 加速卡产品，以及基于该加速卡的 FPGA 生态系统布局。同时，也将介绍目前主要的第三方 FPGA 加速卡产品，以及它们各自的特点。


    ### 2.4.2 英特尔的 FPGA 加速卡布局


    早在 2017 年 10 月，英特尔就官宣了旗下的首款 FPGA 加速卡产品，名为“Programmable Acceleration Card”，简称 PAC，见图
    2-18。同时发布的，还有与之配套的软硬件开发框架与加速栈系统。这不仅是英特尔 FPGA 的首款通用 FPGA 加速卡产品，也是当时市场上的首款面向大数据、AI、高性能计算等新兴领域的数据中心
    FPGA 加速卡，因此 PAC 的意义非同小可。


    ![](img/Figure-P96_1101.jpg)


    图 2-18　英特尔 PAC FPGA 加速卡（图片来自英特尔）


    ![](img/Figure-P96_1105.jpg)


    图 2-19　英特尔 PAC FPGA 加速卡板级资源


    这款 FPGA 加速卡的硬件资源如图 2-19 所示。在硬件规格方面，PAC 基于英特尔的 Arria10 GX 系列 FPGA，它由英特尔的 20nm 工艺制造，拥有
    115 万个可编程逻辑单元，是英特尔在当时性能和容量最强大的 FPGA 产品。在板卡上，集成了 8GB 的 DDR4 内存和 128MB 闪存。接口方面，PAC
    有一个 QSFP+接口，能满足最高 40Gbps 的网络连接带宽，同时有 PCIe Gen3×8 接口与主机 CPU 互连。值得注意的是，PAC 的板级功耗约为
    45～60W，因此采用了被动散热设计，从而将板卡的尺寸控制在了半高半长，方便在各类服务器的部署。


    PAC 的主要应用场景是加速数据中心的各类应用。作为英特尔的原厂产品，PAC 在数据中心里有着得天独厚的优势。它天生可以作为英特尔 Xeon 处理器的硬件加速单元，用于卸载和加速原本在
    CPU 上实现的各类应用，从而构成英特尔 CPU+FPGA 的高性能数据处理组合。


    作为生态系统构建的重要组成部分，除了硬件板卡之外，英特尔还发布了面向 Xeon 和 FPGA 的加速堆栈（Acceleration Stack），见图 2-20。这个加速堆栈本质上是一个软件开发框架，包含了
    FPGA 板卡的驱动、API、接口管理、软件库与开发工具等，从而为 CPU 与 FPGA 的联合开发提供了通用的编程接口，简化了开发流程，缩短了开发时间。


    ![](img/Figure-P97_1113.jpg)


    图 2-20　英特尔 FPGA 加速堆栈结构


    为了向软件开发者进一步抽象底层的 FPGA 硬件资源，英特尔使用并开源了名为“开放可编程加速引擎（Open Programmable Acceleration
    Engine，OPAE）”的技术。OPAE 是一个层次化模型，它提供了一系列标准的软件接口，以及常见硬件功能的 FPGA 实现，例如各类寄存器与内存分配逻辑等，见图
    2-21。同时也提供了很多操作系统内核空间的 FPGA 支持，使得开发者可以专注于用户空间的应用开发。


    ![](img/Figure-P98_1120.jpg)


    图 2-21　英特尔 OPAE 技术的结构层级


    PAC 发布一年后，英特尔在 2018 年 10 月发布了另一款基于 Stratix10 SX 系列 FPGA 的 PAC 产品，名为 PAC D5005，见图
    2-22。相比基于 Arria10 FPGA 的 PAC，这款新发布的加速卡在硬件性能上有了质的飞越。Stratix10 作为英特尔的高端 FPGA 系列，基于英特尔的
    14nm 工艺制造，并采用了 3D 系统级封装技术，有着更高的集成度。在这款 PAC 采用的 Stratix10 SX FPGA 上，有 280 万可编程逻辑单元，244Mb
    片上内存以及高达 26Gbps 的串行收发器。


    ![](img/Figure-P98_1126.jpg)


    图 2-22　英特尔 Stratix10 PAC FPGA 加速卡（图片来自英特尔）


    PAC D5005 加速卡的板级资源如图 2-23 所示。可以看到，这款 PAC 包含 32GB DDR4 内存，两个最高支持 100Gbps 网络带宽的
    QSFP28 接口，以及 PCIe Gen3×16 接口。由于这个板卡面向更高性能的数据中心应用场景，因此在功耗和尺寸方面都较另一款 PAC 有所增加，其中板级功耗约为
    225W，尺寸为全高、3/4 长的双槽设计。


    ![](img/Figure-P99_1137.jpg)


    图 2-23　英特尔 Stratix10 FPGA 加速卡板级资源


    英特尔的 FPGA 加速卡产品最大的优势，就是英特尔在数据中心处理器领域的核心支配地位。由于英特尔 Xeon 处理器占据了数据中心市场的 x86 处理器的绝大部分市场份额，因此无论谁家的
    FPGA 加速卡都必须针对 Xeon 处理器做大量的兼容性设计和优化，而英特尔 FPGA 在这方面有着先天的优势。这也使得英特尔成为目前唯一一个能够提供全栈式数据中心解决方案的公司。


    此外，英特尔与各大服务器制造商保持着良好的合作关系，因此包括戴尔、慧与（HPE）、富士通等服务器制造商会很自然地在自家的服务器产品中加入并销售基于英特尔 FPGA
    的加速卡。


    ### 2.4.3 赛灵思的 FPGA 加速卡布局


    赛灵思的 FPGA 加速卡产品起步相对较晚。在 2018 年 10 月，赛灵思才正式发布了旗下首款面向数据中心应用加速的 FPGA 加速卡产品，名为 Alveo，如图
    2-24 所示。首批推出的 Alveo U200 和 U250 板卡均基于赛灵思的 16nm UltraScale FPGA 器件制造，分别拥有 89.2
    万和 134.1 万个可编程逻辑单元。在 FPGA 器件方面，这两款 Alveo 卡与英特尔的 PAC 相比，可以说在伯仲之间。


    ![](img/Figure-P100_1150.jpg)


    图 2-24　赛灵思 Alveo FPGA 加速卡（图片来自赛灵思）


    与英特尔的策略类似，这两款板卡主要针对的都是大型数据中心应用，因此板上集成了 64GB DDR4 内存，以及两个 QSFP28 网络接口和一个 PCIe Gen3
    接口。与 PAC 相比，这两款板卡的板级资源要丰富得多。然而，这也导致 Alveo 板卡的外形尺寸和功耗都会有所增加。当采用主动散热时，板卡尺寸为全高全长，标准功耗为
    100～110W，功耗峰值可达 225W，远超过基于 Arria10 FPGA 的 PAC 板卡的 45～60W 功耗，与基于 Stratix10 FPGA
    的 PAC 板卡类似。


    在生态系统建设方面，Alveo 加速卡将主要基于赛灵思的 SDAccel 软件进行开发，如图 2-25 所示。SDAccel 是一个集成的开发环境，它最主要的特点之一是包含针对
    C/C++和 OpenCL 等高层次语言的 FPGA 编译器、软件库和 API 等模块单元和基础架构，以帮助软件开发者更快地对 FPGA 硬件进行开发和使用。这一点，与英特尔的面向
    Xeon 和 FPGA 的加速堆栈有异曲同工之妙。这也印证了当前 FPGA 软件系统发展的趋势，那就是需要不断降低 FPGA 开发的门槛，通过尽量多地提供高层次语言的支持，以提高
    FPGA 的开发效率，缩短产品面世时间。在后面的章节中，我们将详细介绍包括高层次综合在内的当前最新的 FPGA 开发手段。


    ![](img/Figure-P101_1158.jpg)


    图 2-25　赛灵思 SDAccel 开发环境


    ### 2.4.4 第三方 FPGA 加速卡


    除了英特尔和赛灵思推出的原厂 FPGA 加速卡之外，很多第三方厂商也在近年相继推出了基于 FPGA 的硬件加速卡产品。其中比较典型的有浪潮、华为等公司推出的加速卡，以及国外
    Mellanox 公司推出的基于 FPGA 的智能网卡产品。


    F10A FPGA 加速卡是目前浪潮在售的一款 FPGA 加速卡产品，如图 2-26 所示，它采用了英特尔 Arria10 系列 FPGA，最多包含 115
    万个片上可编程逻辑单元。加速卡上提供了两个 SFP+10Gbps 以太网端口，PCIe Gen3×8 接口，以及最高 32GB 板载 DDR 内存。


    ![](img/Figure-P102_1169.jpg)


    图 2-26　浪潮 F10A FPGA 加速卡


    在 2018 年 10 月底的赛灵思开发者大会上，浪潮和华为都发布了自己的新 FPGA 加速卡产品，分别叫作浪潮 F37X 和华为 FX 系列，如图 2-27
    和图 2-28 所示。


    ![](img/Figure-P102_1174.jpg)


    图 2-27　浪潮 F37X FPGA 加速卡


    ![](img/Figure-P103_1180.jpg)


    图 2-28　华为 FPGA 加速卡


    这两款加速卡都采用了赛灵思的 16nm UltraScale+FPGA 器件。相比赛灵思的原厂 Alveo 加速卡，浪潮和华为的这两款产品进一步削减了板卡的功耗，这主要得益于
    FPGA 芯片规格的提升。例如，浪潮的 F37X 加速卡的典型功耗只有 75W 左右，而华为的 FX 系列的中端加速卡的典型功耗最大为 75W，高端卡为 200W。


    在其他技术规格方面，浪潮 F37X 加速卡使用的 FPGA 集成了 8GB 的 HBM2 片上高速缓存，与 DDR 相比，HBM2 能大幅提高存储带宽和访存效率。此外，新推出的这两个第三方加速卡都比
    Alveo 有着更高的片上逻辑单元数量，足以应对各种新兴的数据中心计算与应用场景，例如机器学习、视频编解码、NFV、图像与语音识别等。


    除了国内的厂商外，以色列厂商 Mellanox 也有不少基于 FPGA 的智能网卡产品，例如它的 Innova-2 Flex 系列。Mellanox 是一家著名的网络设备供应商，旗下产品包括网络控制芯片、网卡、线缆、交换机、软件等，主要应用在数据中心里的各类网络连接，可以说几乎涵盖了数据中心网络产品的各大门类。在
    2019 年，包括赛灵思、英特尔和微软在内的多家科技巨头争相竞购 Mellanox，并最终花落英伟达。


    智能网卡的“智能”之处，就是将很多原本运行在 CPU 内核上的应用，卸载到网卡上通过硬件加速器实现。特别是对于虚拟交换、虚拟路由等与数据中心基础架构相关的设备，而对于与数据中心用户无关的应用来说，如果用
    CPU 实现这些功能非常不实惠，因为这样相当于变相减少了本来可以卖给用户的 CPU 内核资源。相反的，如果将这些应用卸载到智能网卡上实现，就可以显著减少 CPU
    内核的使用，同时降低网卡与 CPU 的通信量，节省 PCIe 带宽。


