- raw: "现已退休的Mark Bohr（马克·波尔）曾是负责英特尔工艺研发的灵魂人物之一，他是英特尔资深院士（Senior Fellow）和美国工程院院士，并曾任英特尔半导体科技与制造业务部总监。在40余年的英特尔职业生涯中，波尔和他的同事们不断的突破物理学极限，使计算机系统在不断缩小的同时，性能却成倍增强。这使得在过去的几十年时间内，英特尔的半导体工艺技术一直处于世界的绝对领先位置。因此，波尔在业界享有盛名，被誉为是不断推动摩尔定律前进的人。\n\
    \n在2017年9月，波尔曾在英特尔的“精尖制造日”上发表了名为“工艺领导者”的主旨演讲。这个演讲最重要的内容之一，就是发布了英特尔的10nm工艺路线图。波尔认为，相比于前几代工艺发展的时间节点，10nm的研发周期将会更久，但同时也会带来更高的性能提升，由此在整体上保持摩尔定律的延续。\n\
    \n后来的故事我们都知道了，英特尔这家芯片巨头在10nm工艺上遇到了阻碍。后来，波尔也承认说“我认为，我们在10nm工艺上有些冲动了”，“也许我们应该下调一些我们的目标，这样过渡起来就会容易得多”。这次受阻的结果是，曾经被远远甩在身后的竞争者们纷纷在10nm这个工艺节点完成了超车。在过去的几年中，台积电和三星都逐渐将自家的10nm工艺投入量产，并已经开始布局7nm甚至更小制程的研发和路线图规划。\n\
    \n终于，在2019年初，痛定思痛的英特尔一口气发布了4款基于10nm工艺的芯片产品，包括“Ice Lake”和“Lakefiled”CPU，以及“Snow\
    \ Ridge”网络处理器等。这些新产品涵盖了个人计算平台、数据中心、5G网络等多个应用领域。而这次发布的Agilex系列FPGA，也正是基于英特尔10nm工艺的旗舰级FPGA产品。\n\
    \n在Agilex系列FPGA中，使用了基于10nm工艺的第二代EMIB技术，用来连接可编程逻辑阵列以及周围的各类芯粒（Chiplet）。前文介绍过，与赛灵思采用的SSI技术相比，EMIB不需要引入额外的硅中介层，因此也不需要SSI技术中不可或缺的大量硅通孔，这样显著降低了系统的制造复杂度。EMIB不需要在中介层中使用长导线，因此降低了不同晶片间的传输延时，减少了信号的传输干扰。另外，EMIB可以将不同的子芯片集进行快速连接和互换，从而实现芯片的快速迭代。\n\
    \n#### ■1.5.2　全新的芯片布局与微架构优化\n\n相比目前的英特尔旗舰FPGA系列Stratix10，Agilex在芯片布局和微架构设计上都做出了多个重要改变。Agilex的芯片布局如图1-18所示。与现有的英特尔FPGA相似，Agilex也使用了EMIB技术提供多个异构硅片之间的高速互连，特别是可编程逻辑部分与不同速度的收发器Tile之间的连接。在图1-18中可以看到，收发器固定位于芯片的东西两侧，而其他的非可编程逻辑结构，例如通用I/O接口、存储器接口、嵌入式SRAM、4核ARM\
    \ CPU等，都将固定位于芯片的南北两侧。\n\nAgilex在芯片布局上的一个重大变化，就是将原本位于芯片中间的很多通用I/O、存储器I/O、硬核处理器等部分移到了芯片两端。在英特尔之前的几代FPGA中，例如Arria10系列和Stratix10系列FPGA，可编程逻辑阵列、I/O单元、存储器、DSP等逻辑结构都是按列为单位进行间隔排列的，如图1-19所示。事实上，这也是包括赛灵思在内的其他FPGA厂商所常用的FPGA芯片布局方法。\n\
    \n![](OEBPS/Images/Figure-P51_742.jpg)\n\n图1-18　Agilex FPGA的芯片布局示意图\n\n![](OEBPS/Images/Figure-P51_746.jpg)\n\
    \n图1-19　英特尔Arria10系列FPGA的芯片布局\n\n这种间隔排列的结构最大的优点在于，它能简化FPGA设计过程中对硬件资源的布局规划，特别是与I/O引脚相关的布局。这是因为在这种架构中，每个逻辑单元与I/O单元的距离近似，所以在布局和放置时有着比较高的灵活性。\n\
    \n然而，这种结构最突出的缺点是，它相当于人为地将一整片可编程逻辑阵列分成了很多区域，这就极大地增加了跨区域的布线延时。同时，对于高速且大型的设计而言，这种结构很有可能造成局部的布局拥塞。相信对于很多有经验的FPGA工程师来说，他们在很多实际的项目中都可以看到这样一种情况，即FPGA片上有很多区域的设计拥堵严重，而其他区域却有着大量可用资源。造成这个问题的根源之一，就是FPGA的这种列型结构。\n\
    \n在Agilex里，这些I/O单元被移到了整个逻辑阵列的上下两侧，从而在中间形成了一个更加规整的可编程阵列布局，如图1-20所示。由于消除了I/O单元对逻辑阵列带来的区隔，系统性能得到了提升，这也会极大简化时序计算，并提升对硬件资源布局与放置的灵活性。\n\
    \n![](OEBPS/Images/Figure-P52_754.jpg)\n\n图1-20　英特尔Agilex FPGA的芯片布局\n\n在微架构方面，Agilex对其中的自适应逻辑模块ALM进行了设计优化，以进一步降低其传输延时。ALM是英特尔FPGA的基本可编程单元，在Stratix10\
    \ FPGA中，它的ALM结构如图1-21所示。可以看到，它主要包含一个6输入LUT，一个加法器进位链，以及4个输出寄存器。多个ALM可以组成更大的可编程阵列，名为逻辑阵列块（Logic\
    \ Array Block，LAB）。\n\n![](OEBPS/Images/Figure-P53_763.jpg)\n\n图1-21　Stratix10\
    \ FPGA的ALM结构\n\n和Stratix10相比，Agilex对ALM做了不少架构升级，如图1-22所示。其中，增加了两个LUT的快速输出端口，使得LUT的输出可以直连HyperFlex寄存器，而无须再通过ALM内部的寄存器中转。这显然是针对利用HyperFlex对关键路径进行重定时（Retiming）的应用场景而进行的优化。同时，ALM内部的寄存器灵活性得到了极大增强，可以看到，Agilex\
    \ ALM的每个寄存器输入都增加了一个4输入选择器，用来选通不同的输入信号。同时，ALM里的4个寄存器都可以通过两个独立的时钟进行控制。\n\n![](OEBPS/Images/Figure-P54_772.jpg)\n\
    \n图1-22　Agilex FPGA的ALM结构\n\n除了ALM之外，Agilex还特别增加了片上内存MLAB（Memory LAB）的逻辑密度。与Stratix10相比，单位面积内Agilex有着双倍的MLAB密度，而且50%的LAB可以配置成存储器模式。这个优化很明显是针对高带宽需求的应用领域，如AI相关的计算加速等。\n\
    \n![](OEBPS/Images/Figure-P55_189.jpg)\n\n图1-23　Agilex的布线节点（图片来自英特尔）\n\nAgilex还对FPGA的布线单元进行了重新设计，如图1-23所示。其中，DIM（Driver\
    \ Input Mux）、LIM（Logic Input Mux）、LEIM（Logic Element Input Mux）如图1-23所示。可以看到，每个交换节点都只连接一个逻辑功能单元（可以是LAB、RAM、DSP等），但可以连接多个其他的布线单元或者其他的交换节点。在之前的FPGA架构中，通常情况下一个交换节点会和左右两侧的两个逻辑功能单元进行连接。这样的简化设计使得Agilex整体的布线架构更加简洁，也在很大程度上减少了交换节点MUX的输入，从而在保证布线灵活性的基础上，有效地降低容抗，并提升性能。事实上，之前就有研究表明，FPGA的布线节点并不需要保持全连接。而Agilex则更进一步，直接做成了1对1连接，相信这也对FPGA设计工具和布局布线算法提出了更高的要求。\n\
    \n此外，Agilex对各个逻辑单元之间延时的统一性做了针对性的优化。在之前的FPGA中，由于存在不可避免的工艺和时序变化（Variation），会特意对芯片上的各种硬件资源做差异化处理。也就是说，同样的硬件资源可能有着不同的延时分布。从理论上讲，FPGA设计工具会在优化设计时自动避免将慢速资源分配到关键路径上。但在实际应用中，这并非总是可行的。例如，在高速设计或深度流水线设计中，就可能存在多条与关键路径有着类似延时的路径，即“Near\
    \ Critical Path”，而这就会给资源分配造成很大的限制，也会极大增加EDA工具的计算难度。\n\n![](OEBPS/Images/Figure-P56_200.jpg)\n\
    \n图1-24　Stratix10与Agilex的延时分布对比（图片来自英特尔）\n\n为了应对这个问题，Agilex使用了基本同化的硬件资源，以及对应的布线方法，从而使得各个硬件资源的延时趋于近似。从图1-24中可以清楚地看到，相比Stratix10\
    \ FPGA，Agilex的延时分布非常平坦。这样就简化了布局布线工具对资源分配的过程，从而提升了开发效率和系统性能。\n\n#### ■1.5.3　CXL：CPU与FPGA互连的终极方案\n\
    \n当前，FPGA的一个主要应用场景是在数据中心里作为CPU的硬件加速器，用来加速各类应用，如深度学习的模型训练、金融计算、网络功能卸载等，这在本书后面的章节将会详细介绍。在数据中心的CPU领域，英特尔的Xeon\
    \ CPU一直是最强王者，占据着大多数的市场份额。虽然大量竞争对手都不断尝试从中分一杯羹，例如x86阵营的AMD，或者ARM阵营的高通等，但至少目前还没有对英特尔的支配地位形成足够的威胁。在这种情况下，作为数据中心加速器的FPGA，首先需要考虑的就是与Xeon\
    \ CPU的兼容性问题。很明显，作为具有“纯正血统”的Agilex FPGA，从出生就相比竞争对手占据了天时和地利的优势。\n\n缓存一致性问题一直是硬件加速器领域亟待解决的核心问题之一。解决这个问题的主要方法，就是明确和标准化普及CPU与硬件加速器之间的内存互联协议，就好比大家熟知的用于CPU和加速器通信的PCIe协议等。\n\
    \n基于此，很多半导体公司与设备厂商发起了多种多样的缓存一致性协议，具有代表性的包括AMD、高通等公司发起的CCIX，见图1-25，以及IBM发起的OpenCAPI等，见图1-26。每个协议阵营都包含了CPU厂商，以及加速器厂商，负责提供FPGA或网络加速器等方案。可以看到，英特尔并不属于这两个阵营中的任何一个。\n\
    \n在2019年3月，英特尔宣布联合微软、阿里、思科、戴尔EMC、Facebook、谷歌、惠普企业HPE和华为等公司，共同组建一个全新的缓存一致性标准，名为CXL（Compute\
    \ Express Link），如图1-27所示。值得注意的是，与OpenCAPI和CCIX的主要发起公司多为半导体公司不同，CXL的发起者中有4个互联网巨头、两个服务器设备制造商，以及两个网络设备制造商。这种多元性立体地呈现了CXL的目标应用领域：互联网数据中心、通信基础设施、云计算与云服务，等等。而这些领域也正是FPGA大显身手的重要平台。\n\
    \n![](OEBPS/Images/Figure-P58_231.jpg)\n\n图1-25　CCIX的主要成员\n\n![](OEBPS/Images/Figure-P58_234.jpg)\n\
    \n图1-26　OpenCAPI的主要成员\n\n对于Agilex FPGA，它将原生支持CXL协议，并将成为业界首款面向Xeon可扩展处理器的内存一致性硬件加速器。值得注意的是，CXL协议基于第五代PCIe协议进行设计和扩展，这样可以完全复用PCIe\
    \ PHY和通道，与其他类似的协议相比有着更好的易用性。这在天时和地利的基础上，势必为Agilex在数据中心的使用带来巨大的人和优势。\n\n![](OEBPS/Images/Figure-P59_781.jpg)\n\
    \n图1-27　CXL的主要成员\n\n#### ■1.5.4　可变精度DSP：全力支持AI应用\n\n在人工智能应用中，FPGA的最大优势之一就是可以在运算时采用可变精度，而不是CPU等芯片中采用的固定字长，从而带来巨大的性能提升。在现有的英特尔FPGA中，就以硬核的方式固化了定点数及双精度浮点数（FP32）的DSP单元，以提升相应操作的性能，并降低功耗。在Agilex\
    \ FPGA中，又加入了对FP8、单精度浮点数FP16和块浮点数BFLOAT16的支持，同时也增加了DSP中不同精度乘法器的数量、并扩展了乘法器的配置方式。一些常用的DSP配置结构示意图如图1-28所示，请注意这里是简化过的结构图，更多细节可以去英特尔官方的Agilex\
    \ FPGA可变精度DSP支持文档里查看。通过支持不同精度的DSP配置，使得FPGA既可以使用浮点数进行AI模型的训练，也可以使用更低精度的定点数进行AI模型的推断。可以说，这些针对AI应用的革新，势必会极大地扩大未来FPGA在AI领域的使用范围。\n\
    \n![](OEBPS/Images/Figure-P60_793.jpg)\n\n图1-28　Agilex可变精度DSP的一些配置模式\n\n#### ■1.5.5　增强版HyperFlex架构\n\
    \n与CPU或GPU相比，FPGA的时钟频率很低，通常只有200～400MHz。因此，为了达到一定的吞吐量需求，FPGA需要使用更高的数据总线宽度，以弥补时钟频率的不足。但过宽的数据总线会带来布局布线的拥挤，以及时序的收敛问题。所以，在现代FPGA架构中，如何不断提升FPGA的工作频率，一直是业界研究的重点。\n\
    \nHyperFlex架构是英特尔在Stratix10系列FPGA上采用的一项主要架构创新。它的主要思想就是在FPGA的布线网络上，加入很多名为Hyper-Register的小型寄存器，这样可以把原本比较长的时序路径分割成多个较短的路径，从而达到提升工作频率的目的。\n\
    \n但是，理想很丰满，现实很骨感。这样的设计有着很好的初衷，但在实际应用中还是存在着很多的问题。在很多情况下，不是所有的Hyper-Register都会被使用，这就需要每个寄存器都配备一个2：1选择器用来选通，以控制Hyper-Register的使用。然而，这样的架构反而会带来较大的额外延时，也使FPGA设计工具中的重定时和自动流水线算法变得更加复杂。此外，每个Hyper-Register并非由边沿驱动的“寄存器”（flip-flop），而是由脉冲驱动的“锁存器”（latch），这就使得它的时序特性较差，并且非常容易受工艺变化（Process\
    \ Variation）的影响。显然，英特尔也意识到了这些问题。在Agilex FPGA中，采用了“第二代”HyperFlex架构，并对上面的问题进行了大幅改进。新一代的Hyper-Register把锁存器替换成了寄存器，并对驱动节点进行了重新设计，使得Hyper-Register的旁路延时最高降低了40%。同时，Agilex在布线网络中移除了近2/3的Hyper-Register，这无论对于面积、功耗，或是设计工具的优化来说，都是极为有利的。\n\
    \n与Stratix10相比，Agilex可以取得平均41%的性能提升。在英特尔公布的基准测试数据中，Agilex FPGA工程样片最高时钟频率的平均值是566MHz，最小值是284MHz，而最高的时钟频率则达到了951MHz。相比于传统FPGA设计的300MHz左右的时钟频率，这组数据也标志着FPGA的时钟频率提升到了一个全新的高度。同时应该注意到，尽管Agilex使用了10nm工艺，但相比Stratix10而言，Agilex使用了更低的电压以降低功耗。在这个背景下，这些频率的提升很多都归功于Agilex的架构创新。这也让人们对Agilex量产并交付后的表现更加期待。\n\
    \n#### ■1.5.6　oneAPI：英特尔的雄心\n\noneAPI是英特尔在生态布局中最重要的一环，这已经不是什么秘密了。在2018年底举行的英特尔架构日上，英特尔的芯片首席架构师Raja\
    \ Koduri对外公布了公司正在着力研发的一件“大事”：oneAPI的软件编程框架，而Agilex FPGA也将成为首款支持oneAPI的FPGA产品。\n\
    \n顾名思义，oneAPI将会为英特尔旗下的各类芯片产品，包括CPU、GPU、FPGA，以及各种AI和其他应用的硬件加速器等，提供一个统一的软件编程接口，使得开发者可以随意在底层硬件之间进行切换和优化，而无须太多关心具体的电路结构和细节。\n\
    \n除了编程接口外，oneAPI还包含一个完整的开发环境、软件库、驱动程序等。这个跨平台的编程框架代表了英特尔最大的野心，就是将旗下所有的芯片和硬件产品通过这个软件系统连接起来，实现无缝切换，并适用于各类主流应用。同时，可以预见英特尔还将围绕这个软件系统逐步构建生态环境。因此这个系统一旦实现，将成为其他竞争对手难以匹敌的优势。有关oneAPI的更多内容，将在第4章中详细介绍。\n\
    \n### 1.6　本章小结\n\n很多人将FPGA比作积木，是因为FPGA就像积木那样，可以用来搭建和实现各种应用。然而，制造和设计FPGA本身却不像搭积木那样简单。FPGA从发明到兴起已超过30年的时间。作为摩尔定律的完美体现，FPGA见证了半导体行业从小到大、从弱到强的不断演进。\n\
    \n我们现在正处于一个充满变数的时代。随着摩尔定律进入黄昏，集成电路在性能、功耗和成本上的进步可能会越来越慢，半导体行业的发展也进入了重要的十字路口。如何延续发展，如何寻找下一个行业爆发点，已经成为业界努力追求的目标。\n\
    \n值得欣喜的是，FPGA再一次成为了最早实践全新科技的领军者，为我们带来了诸多系统和微结构的换代和革新，并不断突破芯片集成的限制和边界。这些来自FPGA的科技创新，都让人们看到了业界为了延续摩尔定律的发展所做的不懈努力。\n\
    \n# 第2章  \n\n拥抱大数据洪流——云中的FPGA\n\n目前，全世界超过90%的数据都是在过去两年之内产生的。随着人工智能、自动驾驶、5G、云计算等各种技术的不断发展，海量数据将会源源不断地产生，预计到2025年，数据总量将比现在增长10倍。在上述技术的发展中，很大一部分都基于对大数据的研究和分析，也因此，有人形象地将数据比喻为人工智能时代的石油。\n\
    \n即便如此，现如今只有不到1%的数据被进行了有效的处理、分析和利用。由此可见，如何以数据为中心，寻找对现有系统进行优化设计、升级和创新的方法，拥有巨大的市场潜力和前景，是急需解决的事情。这其中，数据中心是支持数据计算与传输最重要的环节。因此，数据中心市场也逐渐成为了各大半导体与互联网公司的必争之地。\n\
    \n一方面我们看到，传统FPGA企业在积极争取数据中心领域的市场份额。例如，英特尔在近年来一直在积极地寻求业务转型，其核心愿景是从一家以个人计算机和CPU为主要市场和产品的传统半导体企业，转向以数据为中心并围绕其发展全栈式解决方案的公司。在这其中，FPGA将作为硬件加速器，主要用于加速数据的计算和传输。对于赛灵思，自从其现任CEO\
    \ Victor Peng在2018年上任以来，就高调宣布要将Xilinx进行战略转型，将数据中心作为公司的优先发展方向，并在接下来的几年中发布了诸如ACAP和Vitis等多款软硬件产品，大举进军数据中心市场。"
  fmt: '

    现已退休的Mark Bohr（马克·波尔）曾是负责英特尔工艺研发的灵魂人物之一，他是英特尔资深院士（Senior Fellow）和美国工程院院士，并曾任英特尔半导体科技与制造业务部总监。在40余年的英特尔职业生涯中，波尔和他的同事们不断的突破物理学极限，使计算机系统在不断缩小的同时，性能却成倍增强。这使得在过去的几十年时间内，英特尔的半导体工艺技术一直处于世界的绝对领先位置。因此，波尔在业界享有盛名，被誉为是不断推动摩尔定律前进的人。


    在2017年9月，波尔曾在英特尔的“精尖制造日”上发表了名为“工艺领导者”的主旨演讲。这个演讲最重要的内容之一，就是发布了英特尔的10nm工艺路线图。波尔认为，相比于前几代工艺发展的时间节点，10nm的研发周期将会更久，但同时也会带来更高的性能提升，由此在整体上保持摩尔定律的延续。


    后来的故事我们都知道了，英特尔这家芯片巨头在10nm工艺上遇到了阻碍。后来，波尔也承认说“我认为，我们在10nm工艺上有些冲动了”，“也许我们应该下调一些我们的目标，这样过渡起来就会容易得多”。这次受阻的结果是，曾经被远远甩在身后的竞争者们纷纷在10nm这个工艺节点完成了超车。在过去的几年中，台积电和三星都逐渐将自家的10nm工艺投入量产，并已经开始布局7nm甚至更小制程的研发和路线图规划。


    终于，在2019年初，痛定思痛的英特尔一口气发布了4款基于10nm工艺的芯片产品，包括“Ice Lake”和“Lakefiled”CPU，以及“Snow Ridge”网络处理器等。这些新产品涵盖了个人计算平台、数据中心、5G网络等多个应用领域。而这次发布的Agilex系列FPGA，也正是基于英特尔10nm工艺的旗舰级FPGA产品。


    在Agilex系列FPGA中，使用了基于10nm工艺的第二代EMIB技术，用来连接可编程逻辑阵列以及周围的各类芯粒（Chiplet）。前文介绍过，与赛灵思采用的SSI技术相比，EMIB不需要引入额外的硅中介层，因此也不需要SSI技术中不可或缺的大量硅通孔，这样显著降低了系统的制造复杂度。EMIB不需要在中介层中使用长导线，因此降低了不同晶片间的传输延时，减少了信号的传输干扰。另外，EMIB可以将不同的子芯片集进行快速连接和互换，从而实现芯片的快速迭代。


    ### 1.5.2 全新的芯片布局与微架构优化

    相比目前的英特尔旗舰FPGA系列Stratix10，Agilex在芯片布局和微架构设计上都做出了多个重要改变。Agilex的芯片布局如图1-18所示。与现有的英特尔FPGA相似，Agilex也使用了EMIB技术提供多个异构硅片之间的高速互连，特别是可编程逻辑部分与不同速度的收发器Tile之间的连接。在图1-18中可以看到，收发器固定位于芯片的东西两侧，而其他的非可编程逻辑结构，例如通用I/O接口、存储器接口、嵌入式SRAM、4核ARM
    CPU等，都将固定位于芯片的南北两侧。


    Agilex在芯片布局上的一个重大变化，就是将原本位于芯片中间的很多通用I/O、存储器I/O、硬核处理器等部分移到了芯片两端。在英特尔之前的几代FPGA中，例如Arria10系列和Stratix10系列FPGA，可编程逻辑阵列、I/O单元、存储器、DSP等逻辑结构都是按列为单位进行间隔排列的，如图1-19所示。事实上，这也是包括赛灵思在内的其他FPGA厂商所常用的FPGA芯片布局方法。


    ![](OEBPS/Images/Figure-P51_742.jpg)

    图1-18 Agilex FPGA的芯片布局示意图


    ![](OEBPS/Images/Figure-P51_746.jpg)

    图1-19 英特尔Arria10系列FPGA的芯片布局


    这种间隔排列的结构最大的优点在于，它能简化FPGA设计过程中对硬件资源的布局规划，特别是与I/O引脚相关的布局。这是因为在这种架构中，每个逻辑单元与I/O单元的距离近似，所以在布局和放置时有着比较高的灵活性。


    然而，这种结构最突出的缺点是，它相当于人为地将一整片可编程逻辑阵列分成了很多区域，这就极大地增加了跨区域的布线延时。同时，对于高速且大型的设计而言，这种结构很有可能造成局部的布局拥塞。相信对于很多有经验的FPGA工程师来说，他们在很多实际的项目中都可以看到这样一种情况，即FPGA片上有很多区域的设计拥堵严重，而其他区域却有着大量可用资源。造成这个问题的根源之一，就是FPGA的这种列型结构。


    在Agilex里，这些I/O单元被移到了整个逻辑阵列的上下两侧，从而在中间形成了一个更加规整的可编程阵列布局，如图1-20所示。由于消除了I/O单元对逻辑阵列带来的区隔，系统性能得到了提升，这也会极大简化时序计算，并提升对硬件资源布局与放置的灵活性。


    ![](OEBPS/Images/Figure-P52_754.jpg)

    图1-20 英特尔Agilex FPGA的芯片布局


    在微架构方面，Agilex对其中的自适应逻辑模块ALM进行了设计优化，以进一步降低其传输延时。ALM是英特尔FPGA的基本可编程单元，在Stratix10
    FPGA中，它的ALM结构如图1-21所示。可以看到，它主要包含一个6输入LUT，一个加法器进位链，以及4个输出寄存器。多个ALM可以组成更大的可编程阵列，名为逻辑阵列块（Logic
    Array Block，LAB）。


    ![](OEBPS/Images/Figure-P53_763.jpg)

    图1-21 Stratix10 FPGA的ALM结构


    和Stratix10相比，Agilex对ALM做了不少架构升级，如图1-22所示。其中，增加了两个LUT的快速输出端口，使得LUT的输出可以直连HyperFlex寄存器，而无须再通过ALM内部的寄存器中转。这显然是针对利用HyperFlex对关键路径进行重定时（Retiming）的应用场景而进行的优化。同时，ALM内部的寄存器灵活性得到了极大增强，可以看到，Agilex
    ALM的每个寄存器输入都增加了一个4输入选择器，用来选通不同的输入信号。同时，ALM里的4个寄存器都可以通过两个独立的时钟进行控制。


    ![](OEBPS/Images/Figure-P54_772.jpg)

    图1-22 Agilex FPGA的ALM结构


    除了ALM之外，Agilex还特别增加了片上内存MLAB（Memory LAB）的逻辑密度。与Stratix10相比，单位面积内Agilex有着双倍的MLAB密度，而且50%的LAB可以配置成存储器模式。这个优化很明显是针对高带宽需求的应用领域，如AI相关的计算加速等。


    ![](OEBPS/Images/Figure-P55_189.jpg)

    图1-23 Agilex的布线节点（图片来自英特尔）


    Agilex还对FPGA的布线单元进行了重新设计，如图1-23所示。其中，DIM（Driver Input Mux）、LIM（Logic Input Mux）、LEIM（Logic
    Element Input Mux）如图1-23所示。可以看到，每个交换节点都只连接一个逻辑功能单元（可以是LAB、RAM、DSP等），但可以连接多个其他的布线单元或者其他的交换节点。在之前的FPGA架构中，通常情况下一个交换节点会和左右两侧的两个逻辑功能单元进行连接。这样的简化设计使得Agilex整体的布线架构更加简洁，也在很大程度上减少了交换节点MUX的输入，从而在保证布线灵活性的基础上，有效地降低容抗，并提升性能。事实上，之前就有研究表明，FPGA的布线节点并不需要保持全连接。而Agilex则更进一步，直接做成了1对1连接，相信这也对FPGA设计工具和布局布线算法提出了更高的要求。


    此外，Agilex对各个逻辑单元之间延时的统一性做了针对性的优化。在之前的FPGA中，由于存在不可避免的工艺和时序变化（Variation），会特意对芯片上的各种硬件资源做差异化处理。也就是说，同样的硬件资源可能有着不同的延时分布。从理论上讲，FPGA设计工具会在优化设计时自动避免将慢速资源分配到关键路径上。但在实际应用中，这并非总是可行的。例如，在高速设计或深度流水线设计中，就可能存在多条与关键路径有着类似延时的路径，即“Near
    Critical Path”，而这就会给资源分配造成很大的限制，也会极大增加EDA工具的计算难度。


    ![](OEBPS/Images/Figure-P56_200.jpg)

    图1-24 Stratix10与Agilex的延时分布对比（图片来自英特尔）


    为了应对这个问题，Agilex使用了基本同化的硬件资源，以及对应的布线方法，从而使得各个硬件资源的延时趋于近似。从图1-24中可以清楚地看到，相比Stratix10
    FPGA，Agilex的延时分布非常平坦。这样就简化了布局布线工具对资源分配的过程，从而提升了开发效率和系统性能。


    ### 1.5.3 CXL：CPU与FPGA互连的终极方案

    当前，FPGA的一个主要应用场景是在数据中心里作为CPU的硬件加速器，用来加速各类应用，如深度学习的模型训练、金融计算、网络功能卸载等，这在本书后面的章节将会详细介绍。在数据中心的CPU领域，英特尔的Xeon
    CPU一直是最强王者，占据着大多数的市场份额。虽然大量竞争对手都不断尝试从中分一杯羹，例如x86阵营的AMD，或者ARM阵营的高通等，但至少目前还没有对英特尔的支配地位形成足够的威胁。在这种情况下，作为数据中心加速器的FPGA，首先需要考虑的就是与Xeon
    CPU的兼容性问题。很明显，作为具有“纯正血统”的Agilex FPGA，从出生就相比竞争对手占据了天时和地利的优势。


    缓存一致性问题一直是硬件加速器领域亟待解决的核心问题之一。解决这个问题的主要方法，就是明确和标准化普及CPU与硬件加速器之间的内存互联协议，就好比大家熟知的用于CPU和加速器通信的PCIe协议等。


    基于此，很多半导体公司与设备厂商发起了多种多样的缓存一致性协议，具有代表性的包括AMD、高通等公司发起的CCIX，见图1-25，以及IBM发起的OpenCAPI等，见图1-26。每个协议阵营都包含了CPU厂商，以及加速器厂商，负责提供FPGA或网络加速器等方案。可以看到，英特尔并不属于这两个阵营中的任何一个。


    在2019年3月，英特尔宣布联合微软、阿里、思科、戴尔EMC、Facebook、谷歌、惠普企业HPE和华为等公司，共同组建一个全新的缓存一致性标准，名为CXL（Compute
    Express Link），如图1-27所示。值得注意的是，与OpenCAPI和CCIX的主要发起公司多为半导体公司不同，CXL的发起者中有4个互联网巨头、两个服务器设备制造商，以及两个网络设备制造商。这种多元性立体地呈现了CXL的目标应用领域：互联网数据中心、通信基础设施、云计算与云服务，等等。而这些领域也正是FPGA大显身手的重要平台。


    ![](OEBPS/Images/Figure-P58_231.jpg)

    图1-25 CCIX的主要成员


    ![](OEBPS/Images/Figure-P58_234.jpg)

    图1-26 OpenCAPI的主要成员


    对于Agilex FPGA，它将原生支持CXL协议，并将成为业界首款面向Xeon可扩展处理器的内存一致性硬件加速器。值得注意的是，CXL协议基于第五代PCIe协议进行设计和扩展，这样可以完全复用PCIe
    PHY和通道，与其他类似的协议相比有着更好的易用性。这在天时和地利的基础上，势必为Agilex在数据中心的使用带来巨大的人和优势。


    ![](OEBPS/Images/Figure-P59_781.jpg)

    图1-27 CXL的主要成员


    ### 1.5.4 可变精度DSP：全力支持AI应用

    在人工智能应用中，FPGA的最大优势之一就是可以在运算时采用可变精度，而不是CPU等芯片中采用的固定字长，从而带来巨大的性能提升。在现有的英特尔FPGA中，就以硬核的方式固化了定点数及双精度浮点数（FP32）的DSP单元，以提升相应操作的性能，并降低功耗。在Agilex
    FPGA中，又加入了对FP8、单精度浮点数FP16和块浮点数BFLOAT16的支持，同时也增加了DSP中不同精度乘法器的数量、并扩展了乘法器的配置方式。一些常用的DSP配置结构示意图如图1-28所示，请注意这里是简化过的结构图，更多细节可以去英特尔官方的Agilex
    FPGA可变精度DSP支持文档里查看。通过支持不同精度的DSP配置，使得FPGA既可以使用浮点数进行AI模型的训练，也可以使用更低精度的定点数进行AI模型的推断。可以说，这些针对AI应用的革新，势必会极大地扩大未来FPGA在AI领域的使用范围。


    ![](OEBPS/Images/Figure-P60_793.jpg)

    图1-28 Agilex可变精度DSP的一些配置模式


    ### 1.5.5 增强版HyperFlex架构

    与CPU或GPU相比，FPGA的时钟频率很低，通常只有200～400MHz。因此，为了达到一定的吞吐量需求，FPGA需要使用更高的数据总线宽度，以弥补时钟频率的不足。但过宽的数据总线会带来布局布线的拥挤，以及时序的收敛问题。所以，在现代FPGA架构中，如何不断提升FPGA的工作频率，一直是业界研究的重点。


    HyperFlex架构是英特尔在Stratix10系列FPGA上采用的一项主要架构创新。它的主要思想就是在FPGA的布线网络上，加入很多名为Hyper-Register的小型寄存器，这样可以把原本比较长的时序路径分割成多个较短的路径，从而达到提升工作频率的目的。


    但是，理想很丰满，现实很骨感。这样的设计有着很好的初衷，但在实际应用中还是存在着很多的问题。在很多情况下，不是所有的Hyper-Register都会被使用，这就需要每个寄存器都配备一个2：1选择器用来选通，以控制Hyper-Register的使用。然而，这样的架构反而会带来较大的额外延时，也使FPGA设计工具中的重定时和自动流水线算法变得更加复杂。此外，每个Hyper-Register并非由边沿驱动的“寄存器”（flip-flop），而是由脉冲驱动的“锁存器”（latch），这就使得它的时序特性较差，并且非常容易受工艺变化（Process
    Variation）的影响。显然，英特尔也意识到了这些问题。在Agilex FPGA中，采用了“第二代”HyperFlex架构，并对上面的问题进行了大幅改进。新一代的Hyper-Register把锁存器替换成了寄存器，并对驱动节点进行了重新设计，使得Hyper-Register的旁路延时最高降低了40%。同时，Agilex在布线网络中移除了近2/3的Hyper-Register，这无论对于面积、功耗，或是设计工具的优化来说，都是极为有利的。


    与Stratix10相比，Agilex可以取得平均41%的性能提升。在英特尔公布的基准测试数据中，Agilex FPGA工程样片最高时钟频率的平均值是566MHz，最小值是284MHz，而最高的时钟频率则达到了951MHz。相比于传统FPGA设计的300MHz左右的时钟频率，这组数据也标志着FPGA的时钟频率提升到了一个全新的高度。同时应该注意到，尽管Agilex使用了10nm工艺，但相比Stratix10而言，Agilex使用了更低的电压以降低功耗。在这个背景下，这些频率的提升很多都归功于Agilex的架构创新。这也让人们对Agilex量产并交付后的表现更加期待。


    ### 1.5.6 oneAPI：英特尔的雄心

    oneAPI是英特尔在生态布局中最重要的一环，这已经不是什么秘密了。在2018年底举行的英特尔架构日上，英特尔的芯片首席架构师Raja Koduri对外公布了公司正在着力研发的一件“大事”：oneAPI的软件编程框架，而Agilex
    FPGA也将成为首款支持oneAPI的FPGA产品。


    顾名思义，oneAPI将会为英特尔旗下的各类芯片产品，包括CPU、GPU、FPGA，以及各种AI和其他应用的硬件加速器等，提供一个统一的软件编程接口，使得开发者可以随意在底层硬件之间进行切换和优化，而无须太多关心具体的电路结构和细节。


    除了编程接口外，oneAPI还包含一个完整的开发环境、软件库、驱动程序等。这个跨平台的编程框架代表了英特尔最大的野心，就是将旗下所有的芯片和硬件产品通过这个软件系统连接起来，实现无缝切换，并适用于各类主流应用。同时，可以预见英特尔还将围绕这个软件系统逐步构建生态环境。因此这个系统一旦实现，将成为其他竞争对手难以匹敌的优势。有关oneAPI的更多内容，将在第4章中详细介绍。


    ## 1.6 本章小结

    很多人将FPGA比作积木，是因为FPGA就像积木那样，可以用来搭建和实现各种应用。然而，制造和设计FPGA本身却不像搭积木那样简单。FPGA从发明到兴起已超过30年的时间。作为摩尔定律的完美体现，FPGA见证了半导体行业从小到大、从弱到强的不断演进。


    我们现在正处于一个充满变数的时代。随着摩尔定律进入黄昏，集成电路在性能、功耗和成本上的进步可能会越来越慢，半导体行业的发展也进入了重要的十字路口。如何延续发展，如何寻找下一个行业爆发点，已经成为业界努力追求的目标。


    值得欣喜的是，FPGA再一次成为了最早实践全新科技的领军者，为我们带来了诸多系统和微结构的换代和革新，并不断突破芯片集成的限制和边界。这些来自FPGA的科技创新，都让人们看到了业界为了延续摩尔定律的发展所做的不懈努力。


    # 第2章 拥抱大数据洪流——云中的FPGA

    目前，全世界超过90%的数据都是在过去两年之内产生的。随着人工智能、自动驾驶、5G、云计算等各种技术的不断发展，海量数据将会源源不断地产生，预计到2025年，数据总量将比现在增长10倍。在上述技术的发展中，很大一部分都基于对大数据的研究和分析，也因此，有人形象地将数据比喻为人工智能时代的石油。


    即便如此，现如今只有不到1%的数据被进行了有效的处理、分析和利用。由此可见，如何以数据为中心，寻找对现有系统进行优化设计、升级和创新的方法，拥有巨大的市场潜力和前景，是急需解决的事情。这其中，数据中心是支持数据计算与传输最重要的环节。因此，数据中心市场也逐渐成为了各大半导体与互联网公司的必争之地。


    一方面我们看到，传统FPGA企业在积极争取数据中心领域的市场份额。例如，英特尔在近年来一直在积极地寻求业务转型，其核心愿景是从一家以个人计算机和CPU为主要市场和产品的传统半导体企业，转向以数据为中心并围绕其发展全栈式解决方案的公司。在这其中，FPGA将作为硬件加速器，主要用于加速数据的计算和传输。对于赛灵思，自从其现任CEO
    Victor Peng在2018年上任以来，就高调宣布要将Xilinx进行战略转型，将数据中心作为公司的优先发展方向，并在接下来的几年中发布了诸如ACAP和Vitis等多款软硬件产品，大举进军数据中心市场。

    '
  trans: '

    现已退休的 Mark Bohr（马克·波尔）曾是负责英特尔工艺研发的灵魂人物之一，他是英特尔资深院士（Senior Fellow）和美国工程院院士，并曾任英特尔半导体科技与制造业务部总监。在
    40 余年的英特尔职业生涯中，波尔和他的同事们不断的突破物理学极限，使计算机系统在不断缩小的同时，性能却成倍增强。这使得在过去的几十年时间内，英特尔的半导体工艺技术一直处于世界的绝对领先位置。因此，波尔在业界享有盛名，被誉为是不断推动摩尔定律前进的人。


    在 2017 年 9 月，波尔曾在英特尔的“精尖制造日”上发表了名为“工艺领导者”的主旨演讲。这个演讲最重要的内容之一，就是发布了英特尔的 10nm 工艺路线图。波尔认为，相比于前几代工艺发展的时间节点，10nm
    的研发周期将会更久，但同时也会带来更高的性能提升，由此在整体上保持摩尔定律的延续。


    后来的故事我们都知道了，英特尔这家芯片巨头在 10nm 工艺上遇到了阻碍。后来，波尔也承认说“我认为，我们在 10nm 工艺上有些冲动了”，“也许我们应该下调一些我们的目标，这样过渡起来就会容易得多”。这次受阻的结果是，曾经被远远甩在身后的竞争者们纷纷在
    10nm 这个工艺节点完成了超车。在过去的几年中，台积电和三星都逐渐将自家的 10nm 工艺投入量产，并已经开始布局 7nm 甚至更小制程的研发和路线图规划。


    终于，在 2019 年初，痛定思痛的英特尔一口气发布了 4 款基于 10nm 工艺的芯片产品，包括“Ice Lake”和“Lakefiled”CPU，以及“Snow
    Ridge”网络处理器等。这些新产品涵盖了个人计算平台、数据中心、5G 网络等多个应用领域。而这次发布的 Agilex 系列 FPGA，也正是基于英特尔 10nm
    工艺的旗舰级 FPGA 产品。


    在 Agilex 系列 FPGA 中，使用了基于 10nm 工艺的第二代 EMIB 技术，用来连接可编程逻辑阵列以及周围的各类芯粒（Chiplet）。前文介绍过，与赛灵思采用的
    SSI 技术相比，EMIB 不需要引入额外的硅中介层，因此也不需要 SSI 技术中不可或缺的大量硅通孔，这样显著降低了系统的制造复杂度。EMIB 不需要在中介层中使用长导线，因此降低了不同晶片间的传输延时，减少了信号的传输干扰。另外，EMIB
    可以将不同的子芯片集进行快速连接和互换，从而实现芯片的快速迭代。


    ### 1.5.2 全新的芯片布局与微架构优化

    相比目前的英特尔旗舰 FPGA 系列 Stratix10，Agilex 在芯片布局和微架构设计上都做出了多个重要改变。Agilex 的芯片布局如图 1-18
    所示。与现有的英特尔 FPGA 相似，Agilex 也使用了 EMIB 技术提供多个异构硅片之间的高速互连，特别是可编程逻辑部分与不同速度的收发器 Tile
    之间的连接。在图 1-18 中可以看到，收发器固定位于芯片的东西两侧，而其他的非可编程逻辑结构，例如通用 I/O 接口、存储器接口、嵌入式 SRAM、4 核
    ARM CPU 等，都将固定位于芯片的南北两侧。


    Agilex 在芯片布局上的一个重大变化，就是将原本位于芯片中间的很多通用 I/O、存储器 I/O、硬核处理器等部分移到了芯片两端。在英特尔之前的几代 FPGA
    中，例如 Arria10 系列和 Stratix10 系列 FPGA，可编程逻辑阵列、I/O 单元、存储器、DSP 等逻辑结构都是按列为单位进行间隔排列的，如图
    1-19 所示。事实上，这也是包括赛灵思在内的其他 FPGA 厂商所常用的 FPGA 芯片布局方法。


    ![](img/Figure-P51_742.jpg)

    图 1-18 Agilex FPGA 的芯片布局示意图


    ![](img/Figure-P51_746.jpg)

    图 1-19 英特尔 Arria10 系列 FPGA 的芯片布局


    这种间隔排列的结构最大的优点在于，它能简化 FPGA 设计过程中对硬件资源的布局规划，特别是与 I/O 引脚相关的布局。这是因为在这种架构中，每个逻辑单元与
    I/O 单元的距离近似，所以在布局和放置时有着比较高的灵活性。


    然而，这种结构最突出的缺点是，它相当于人为地将一整片可编程逻辑阵列分成了很多区域，这就极大地增加了跨区域的布线延时。同时，对于高速且大型的设计而言，这种结构很有可能造成局部的布局拥塞。相信对于很多有经验的
    FPGA 工程师来说，他们在很多实际的项目中都可以看到这样一种情况，即 FPGA 片上有很多区域的设计拥堵严重，而其他区域却有着大量可用资源。造成这个问题的根源之一，就是
    FPGA 的这种列型结构。


    在 Agilex 里，这些 I/O 单元被移到了整个逻辑阵列的上下两侧，从而在中间形成了一个更加规整的可编程阵列布局，如图 1-20 所示。由于消除了 I/O
    单元对逻辑阵列带来的区隔，系统性能得到了提升，这也会极大简化时序计算，并提升对硬件资源布局与放置的灵活性。


    ![](img/Figure-P52_754.jpg)

    图 1-20 英特尔 Agilex FPGA 的芯片布局


    在微架构方面，Agilex 对其中的自适应逻辑模块 ALM 进行了设计优化，以进一步降低其传输延时。ALM 是英特尔 FPGA 的基本可编程单元，在 Stratix10
    FPGA 中，它的 ALM 结构如图 1-21 所示。可以看到，它主要包含一个 6 输入 LUT，一个加法器进位链，以及 4 个输出寄存器。多个 ALM 可以组成更大的可编程阵列，名为逻辑阵列块（Logic
    Array Block，LAB）。


    ![](img/Figure-P53_763.jpg)

    图 1-21 Stratix10 FPGA 的 ALM 结构


    和 Stratix10 相比，Agilex 对 ALM 做了不少架构升级，如图 1-22 所示。其中，增加了两个 LUT 的快速输出端口，使得 LUT 的输出可以直连
    HyperFlex 寄存器，而无须再通过 ALM 内部的寄存器中转。这显然是针对利用 HyperFlex 对关键路径进行重定时（Retiming）的应用场景而进行的优化。同时，ALM
    内部的寄存器灵活性得到了极大增强，可以看到，Agilex ALM 的每个寄存器输入都增加了一个 4 输入选择器，用来选通不同的输入信号。同时，ALM 里的
    4 个寄存器都可以通过两个独立的时钟进行控制。


    ![](img/Figure-P54_772.jpg)

    图 1-22 Agilex FPGA 的 ALM 结构


    除了 ALM 之外，Agilex 还特别增加了片上内存 MLAB（Memory LAB）的逻辑密度。与 Stratix10 相比，单位面积内 Agilex
    有着双倍的 MLAB 密度，而且 50%的 LAB 可以配置成存储器模式。这个优化很明显是针对高带宽需求的应用领域，如 AI 相关的计算加速等。


    ![](img/Figure-P55_189.jpg)

    图 1-23 Agilex 的布线节点（图片来自英特尔）


    Agilex 还对 FPGA 的布线单元进行了重新设计，如图 1-23 所示。其中，DIM（Driver Input Mux）、LIM（Logic Input
    Mux）、LEIM（Logic Element Input Mux）如图 1-23 所示。可以看到，每个交换节点都只连接一个逻辑功能单元（可以是 LAB、RAM、DSP
    等），但可以连接多个其他的布线单元或者其他的交换节点。在之前的 FPGA 架构中，通常情况下一个交换节点会和左右两侧的两个逻辑功能单元进行连接。这样的简化设计使得
    Agilex 整体的布线架构更加简洁，也在很大程度上减少了交换节点 MUX 的输入，从而在保证布线灵活性的基础上，有效地降低容抗，并提升性能。事实上，之前就有研究表明，FPGA
    的布线节点并不需要保持全连接。而 Agilex 则更进一步，直接做成了 1 对 1 连接，相信这也对 FPGA 设计工具和布局布线算法提出了更高的要求。


    此外，Agilex 对各个逻辑单元之间延时的统一性做了针对性的优化。在之前的 FPGA 中，由于存在不可避免的工艺和时序变化（Variation），会特意对芯片上的各种硬件资源做差异化处理。也就是说，同样的硬件资源可能有着不同的延时分布。从理论上讲，FPGA
    设计工具会在优化设计时自动避免将慢速资源分配到关键路径上。但在实际应用中，这并非总是可行的。例如，在高速设计或深度流水线设计中，就可能存在多条与关键路径有着类似延时的路径，即“Near
    Critical Path”，而这就会给资源分配造成很大的限制，也会极大增加 EDA 工具的计算难度。


    ![](img/Figure-P56_200.jpg)

    图 1-24 Stratix10 与 Agilex 的延时分布对比（图片来自英特尔）


    为了应对这个问题，Agilex 使用了基本同化的硬件资源，以及对应的布线方法，从而使得各个硬件资源的延时趋于近似。从图 1-24 中可以清楚地看到，相比 Stratix10
    FPGA，Agilex 的延时分布非常平坦。这样就简化了布局布线工具对资源分配的过程，从而提升了开发效率和系统性能。


    ### 1.5.3 CXL：CPU 与 FPGA 互连的终极方案

    当前，FPGA 的一个主要应用场景是在数据中心里作为 CPU 的硬件加速器，用来加速各类应用，如深度学习的模型训练、金融计算、网络功能卸载等，这在本书后面的章节将会详细介绍。在数据中心的
    CPU 领域，英特尔的 Xeon CPU 一直是最强王者，占据着大多数的市场份额。虽然大量竞争对手都不断尝试从中分一杯羹，例如 x86 阵营的 AMD，或者
    ARM 阵营的高通等，但至少目前还没有对英特尔的支配地位形成足够的威胁。在这种情况下，作为数据中心加速器的 FPGA，首先需要考虑的就是与 Xeon CPU
    的兼容性问题。很明显，作为具有“纯正血统”的 Agilex FPGA，从出生就相比竞争对手占据了天时和地利的优势。


    缓存一致性问题一直是硬件加速器领域亟待解决的核心问题之一。解决这个问题的主要方法，就是明确和标准化普及 CPU 与硬件加速器之间的内存互联协议，就好比大家熟知的用于
    CPU 和加速器通信的 PCIe 协议等。


    基于此，很多半导体公司与设备厂商发起了多种多样的缓存一致性协议，具有代表性的包括 AMD、高通等公司发起的 CCIX，见图 1-25，以及 IBM 发起的
    OpenCAPI 等，见图 1-26。每个协议阵营都包含了 CPU 厂商，以及加速器厂商，负责提供 FPGA 或网络加速器等方案。可以看到，英特尔并不属于这两个阵营中的任何一个。


    在 2019 年 3 月，英特尔宣布联合微软、阿里、思科、戴尔 EMC、Facebook、谷歌、惠普企业 HPE 和华为等公司，共同组建一个全新的缓存一致性标准，名为
    CXL（Compute Express Link），如图 1-27 所示。值得注意的是，与 OpenCAPI 和 CCIX 的主要发起公司多为半导体公司不同，CXL
    的发起者中有 4 个互联网巨头、两个服务器设备制造商，以及两个网络设备制造商。这种多元性立体地呈现了 CXL 的目标应用领域：互联网数据中心、通信基础设施、云计算与云服务，等等。而这些领域也正是
    FPGA 大显身手的重要平台。


    ![](img/Figure-P58_231.jpg)

    图 1-25 CCIX 的主要成员


    ![](img/Figure-P58_234.jpg)

    图 1-26 OpenCAPI 的主要成员


    对于 Agilex FPGA，它将原生支持 CXL 协议，并将成为业界首款面向 Xeon 可扩展处理器的内存一致性硬件加速器。值得注意的是，CXL 协议基于第五代
    PCIe 协议进行设计和扩展，这样可以完全复用 PCIe PHY 和通道，与其他类似的协议相比有着更好的易用性。这在天时和地利的基础上，势必为 Agilex
    在数据中心的使用带来巨大的人和优势。


    ![](img/Figure-P59_781.jpg)

    图 1-27 CXL 的主要成员


    ### 1.5.4 可变精度 DSP：全力支持 AI 应用

    在人工智能应用中，FPGA 的最大优势之一就是可以在运算时采用可变精度，而不是 CPU 等芯片中采用的固定字长，从而带来巨大的性能提升。在现有的英特尔 FPGA
    中，就以硬核的方式固化了定点数及双精度浮点数（FP32）的 DSP 单元，以提升相应操作的性能，并降低功耗。在 Agilex FPGA 中，又加入了对 FP8、单精度浮点数
    FP16 和块浮点数 BFLOAT16 的支持，同时也增加了 DSP 中不同精度乘法器的数量、并扩展了乘法器的配置方式。一些常用的 DSP 配置结构示意图如图
    1-28 所示，请注意这里是简化过的结构图，更多细节可以去英特尔官方的 Agilex FPGA 可变精度 DSP 支持文档里查看。通过支持不同精度的 DSP
    配置，使得 FPGA 既可以使用浮点数进行 AI 模型的训练，也可以使用更低精度的定点数进行 AI 模型的推断。可以说，这些针对 AI 应用的革新，势必会极大地扩大未来
    FPGA 在 AI 领域的使用范围。


    ![](img/Figure-P60_793.jpg)

    图 1-28 Agilex 可变精度 DSP 的一些配置模式


    ### 1.5.5 增强版 HyperFlex 架构

    与 CPU 或 GPU 相比，FPGA 的时钟频率很低，通常只有 200～400MHz。因此，为了达到一定的吞吐量需求，FPGA 需要使用更高的数据总线宽度，以弥补时钟频率的不足。但过宽的数据总线会带来布局布线的拥挤，以及时序的收敛问题。所以，在现代
    FPGA 架构中，如何不断提升 FPGA 的工作频率，一直是业界研究的重点。


    HyperFlex 架构是英特尔在 Stratix10 系列 FPGA 上采用的一项主要架构创新。它的主要思想就是在 FPGA 的布线网络上，加入很多名为
    Hyper-Register 的小型寄存器，这样可以把原本比较长的时序路径分割成多个较短的路径，从而达到提升工作频率的目的。


    但是，理想很丰满，现实很骨感。这样的设计有着很好的初衷，但在实际应用中还是存在着很多的问题。在很多情况下，不是所有的 Hyper-Register 都会被使用，这就需要每个寄存器都配备一个
    2：1 选择器用来选通，以控制 Hyper-Register 的使用。然而，这样的架构反而会带来较大的额外延时，也使 FPGA 设计工具中的重定时和自动流水线算法变得更加复杂。此外，每个
    Hyper-Register 并非由边沿驱动的“寄存器”（flip-flop），而是由脉冲驱动的“锁存器”（latch），这就使得它的时序特性较差，并且非常容易受工艺变化（Process
    Variation）的影响。显然，英特尔也意识到了这些问题。在 Agilex FPGA 中，采用了“第二代”HyperFlex 架构，并对上面的问题进行了大幅改进。新一代的
    Hyper-Register 把锁存器替换成了寄存器，并对驱动节点进行了重新设计，使得 Hyper-Register 的旁路延时最高降低了 40%。同时，Agilex
    在布线网络中移除了近 2/3 的 Hyper-Register，这无论对于面积、功耗，或是设计工具的优化来说，都是极为有利的。


    与 Stratix10 相比，Agilex 可以取得平均 41%的性能提升。在英特尔公布的基准测试数据中，Agilex FPGA 工程样片最高时钟频率的平均值是
    566MHz，最小值是 284MHz，而最高的时钟频率则达到了 951MHz。相比于传统 FPGA 设计的 300MHz 左右的时钟频率，这组数据也标志着
    FPGA 的时钟频率提升到了一个全新的高度。同时应该注意到，尽管 Agilex 使用了 10nm 工艺，但相比 Stratix10 而言，Agilex 使用了更低的电压以降低功耗。在这个背景下，这些频率的提升很多都归功于
    Agilex 的架构创新。这也让人们对 Agilex 量产并交付后的表现更加期待。


    ### 1.5.6 oneAPI：英特尔的雄心

    oneAPI 是英特尔在生态布局中最重要的一环，这已经不是什么秘密了。在 2018 年底举行的英特尔架构日上，英特尔的芯片首席架构师 Raja Koduri
    对外公布了公司正在着力研发的一件“大事”：oneAPI 的软件编程框架，而 Agilex FPGA 也将成为首款支持 oneAPI 的 FPGA 产品。


    顾名思义，oneAPI 将会为英特尔旗下的各类芯片产品，包括 CPU、GPU、FPGA，以及各种 AI 和其他应用的硬件加速器等，提供一个统一的软件编程接口，使得开发者可以随意在底层硬件之间进行切换和优化，而无须太多关心具体的电路结构和细节。


    除了编程接口外，oneAPI 还包含一个完整的开发环境、软件库、驱动程序等。这个跨平台的编程框架代表了英特尔最大的野心，就是将旗下所有的芯片和硬件产品通过这个软件系统连接起来，实现无缝切换，并适用于各类主流应用。同时，可以预见英特尔还将围绕这个软件系统逐步构建生态环境。因此这个系统一旦实现，将成为其他竞争对手难以匹敌的优势。有关
    oneAPI 的更多内容，将在第 4 章中详细介绍。


    ## 1.6 本章小结

    很多人将 FPGA 比作积木，是因为 FPGA 就像积木那样，可以用来搭建和实现各种应用。然而，制造和设计 FPGA 本身却不像搭积木那样简单。FPGA 从发明到兴起已超过
    30 年的时间。作为摩尔定律的完美体现，FPGA 见证了半导体行业从小到大、从弱到强的不断演进。


    我们现在正处于一个充满变数的时代。随着摩尔定律进入黄昏，集成电路在性能、功耗和成本上的进步可能会越来越慢，半导体行业的发展也进入了重要的十字路口。如何延续发展，如何寻找下一个行业爆发点，已经成为业界努力追求的目标。


    值得欣喜的是，FPGA 再一次成为了最早实践全新科技的领军者，为我们带来了诸多系统和微结构的换代和革新，并不断突破芯片集成的限制和边界。这些来自 FPGA
    的科技创新，都让人们看到了业界为了延续摩尔定律的发展所做的不懈努力。


    # 第 2 章 拥抱大数据洪流——云中的 FPGA

    目前，全世界超过 90%的数据都是在过去两年之内产生的。随着人工智能、自动驾驶、5G、云计算等各种技术的不断发展，海量数据将会源源不断地产生，预计到 2025
    年，数据总量将比现在增长 10 倍。在上述技术的发展中，很大一部分都基于对大数据的研究和分析，也因此，有人形象地将数据比喻为人工智能时代的石油。


    即便如此，现如今只有不到 1%的数据被进行了有效的处理、分析和利用。由此可见，如何以数据为中心，寻找对现有系统进行优化设计、升级和创新的方法，拥有巨大的市场潜力和前景，是急需解决的事情。这其中，数据中心是支持数据计算与传输最重要的环节。因此，数据中心市场也逐渐成为了各大半导体与互联网公司的必争之地。


    一方面我们看到，传统 FPGA 企业在积极争取数据中心领域的市场份额。例如，英特尔在近年来一直在积极地寻求业务转型，其核心愿景是从一家以个人计算机和 CPU
    为主要市场和产品的传统半导体企业，转向以数据为中心并围绕其发展全栈式解决方案的公司。在这其中，FPGA 将作为硬件加速器，主要用于加速数据的计算和传输。对于赛灵思，自从其现任
    CEO Victor Peng 在 2018 年上任以来，就高调宣布要将 Xilinx 进行战略转型，将数据中心作为公司的优先发展方向，并在接下来的几年中发布了诸如
    ACAP 和 Vitis 等多款软硬件产品，大举进军数据中心市场。

