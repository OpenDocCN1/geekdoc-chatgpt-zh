- raw: "高层次综合方法经过十数年的发展，涌现出了如AutoPilot、OpenCL SDK等FPGA HLS的商业化成功案例。然而，高层次综合距离完全替代人工RTL建模还有很长的路要走。对于FPGA而言，内存瓶颈一直是制约系统性能的重要因素。除片上的各类BRAM之外，还有各类片外存储单元，如DDR、QDR，以及近年兴起的HBM等。因此，如何有效利用片上和片外各类存储单元一直是HLS的研究热点。\n\
    \n此外，对于高层次综合工具生成结果的等效性、仿真和调试的方法也需要进一步探索。在等效性方面，可能需要采用形式化的方法，证明HLS生成的RTL代码与高层次代码在逻辑功能上等效。当需要进行软硬件的协同仿真、调试时，高层次综合工具应该提供相关的测试环境、用例、脚本、调试方法等。当硬件出现问题时，如何自下而上地进行调试，并寻找和发现高层次代码中的漏洞，也需要有成熟的方法论作为支持。\n\
    \n近年来，越来越多的研究开始专注于特定领域（Domain Specific）的编程语言和对应的高层次综合方法，例如近年来非常热门的P4语言，即Programming\
    \ Protocol-Independent Packet Processors，就是针对网络数据包领域的高层编程语言。P4语言诞生于2014年，由一家名为Barefoot的初创公司联合英特尔、谷歌、微软以及斯坦福大学和普林斯顿大学共同起草发布并开源。而P4背后的主要设计者，则是斯坦福大学教授Nick\
    \ McKeown，见图4-3，他是软件定义网络（Software Defined Network，SDN）的提出者和先驱，先后发起成立了开放网络基金会（ONF），以及负责制定P4标准的P4.org。在Barefoot公司内，他是联合创始人和首席科学家。\n\
    \n![](OEBPS/Images/Figure-P156_1630.jpg)\n\n图4-3　P4语言的主要设计者之一Nick McKeown教授\n\n\
    发明P4语言的主要目的是为软件定义网络（SDN）的数据平面提供协议无关的可编程能力，例如包头解析、匹配、表项配置等。众所周知，网络数据包处理是FPGA的传统优势领域，而SDN与网络功能虚拟化等最近正蓬勃发展的网络应用，则是FPGA未来的应用领域之一，这在之前的章节已经详细介绍过。当这二者结合在一起，就需要有新型的FPGA开发工具，对P4等高层语言进行编译和支持。目前，赛灵思与英特尔都已经发布了自己对P4的FPGA编译器，使设计者可以通过P4语言直接在FPGA上生成高性能数据包处理流水线。2019年，英特尔宣布收购Barefoot公司，Nick\
    \ McKeown也成为了英特尔的资深院士（Senior Fellow）。\n\n随着人工智能的发展，业界也出现了很多专门为AI应用而生的Python高层次综合工具。例如，在2019年的FPGA国际研讨会上，UCLA丛京生教授课题组与康奈尔大学张志如副教授课题组再次强强联合，他们合作的文章*HeteroCL*：*A*\
    \ *Multi*\\-*Paradigm Programming* *Infrastructure* *for* *Software*\\-*Defined*\
    \ *Reconfigurable Computing*获得了大会的最佳论文奖。这个工作提出了一个名为HetroCL的领域专用语言和编程模型，它基于Python，专门为图像处理和机器学习应用而进行针对性的优化。和之前介绍的HLS工作类似，这个高层次编程框架在很大程度上降低了FPGA的编程难度，并有效解决了当前的一些高层次综合工具存在的问题与痛点。\n\
    \n具体来说，目前的高层次综合工具的使用体验并没有想象中那么简单有效，可以说是“理想很丰满，现实很骨感”。虽然算法和模型可以使用C、OpenCL等高层语言进行编写，但如果直接对这些软件代码进行综合，大多数情况无法取得令人满意的结果。因此，为了达到最优的硬件性能，开发者仍然需要对底层FPGA的硬件架构有着清楚的了解，按硬件设计的思路编写软件代码。在此基础上，还需要通过一些特殊的预处理指令（Pragma）指导HLS编译器达到期望的硬件结构。这个过程都需要开发者手动完成，而这会极大影响开发效率与代码的可读性。在很多情况下，通过这些处理之后的代码与源代码都有着很大区别。图4-4就展示了一个点积函数的源代码以及为了HLS优化后的代码，可以清晰看到二者的不同。\n\
    \n![](OEBPS/Images/Figure-P158_1639.jpg)\n\n图4-4　HLS代码优化前后的对比\n\n为了解决这个问题，这项工作提出的HetroCL框架能够将算法描述与底层硬件结构完全解耦，使得算法设计师和软件工程师不需要关心底层硬件的数据类型、计算单元实现，以及存储器架构的优化等。\n\
    \n可以看到，通过使用特定领域的高层次综合技术，可以进一步对工具进行领域的针对性优化，也能大幅提升系统性能，减少面积和功耗。面向特定领域的高层次综合算法的优化与设计，也将会是高层次综合领域未来发展的重要方向之一。\n\
    \n### 4.3　商业级开源开发工具：赛灵思Vitis\n\n在2019年10月举办的赛灵思开发者大会（XDF）上，赛灵思发布了一款名为“Vitis”的软件框架。赛灵思表示，Vitis历经5年打造，总共花费了1000人·年（即1名工程师全职工作1年）的工作量。换句话说，假设赛灵思自1984年成立之日起就开始Vitis的设计工作，那么也需要至少28名工程师在35年的时间里全职为Vitis编写代码。虽然这是玩笑，但从中也能看出赛灵思为Vitis投入的巨大工程量。\n\
    \nVitis工具面向的是软件开发者。它位于Vivado工具套件的上层，用来为软件开发者提供设计、调试和运行FPGA的一系列必要组件。Vitis并没有强制开发者使用固定的IDE，与之相反，它可以被插入到很多常见的软件开发工具和框架中，并依靠一系列硬件加速库连接底层的赛灵思的生态系统。赛灵思强调，这些库和硬件IP都是开源的，尽管这里的“开源”是指专门为赛灵思自身的硬件架构设计的，即在竞品上使用这些开源库和IP可能会很困难，但这也被业界看作是一个大胆的举措。\n\
    \nVitis的架构示意图如图4-5所示。其中，Vitis的核心开发工具包（Core Development Kit）包括编译器、分析器和调试器，它们位于运行库之上。运行库负责管理各种硬件加速计算和子系统。在框架的最底层，是硬件相关的目标平台，它根据目标FPGA器件或开发板定义了基本软硬件架构及应用环境，包括存储器接口、自定义I/O接口、数据传输协议和接口等。\n\
    \n![](OEBPS/Images/Figure-P159_1651.jpg)\n\n图4-5　Vitis架构示意图\n\n在核心开发工具包之上，就是硬件加速库（Accelerated\
    \ Libraries），它由针对不同应用领域的8个子库组成，分别对应AI模型、视频编解码、视觉与图像处理、数据分析、金融量化、基础线性代数计算、求解器，以及数据库操作。这8个子库总共包含400多个预先优化的开源应用，能极大地减轻这些领域应用开发的难度，降低开发时间。对于软件工程师和算法工程师而言，他们可以根据这些硬件加速库，很快地对算法和应用进行高层次建模，并直接利用底层的可编程逻辑器件对这些应用进行硬件加速。\n\
    \n这些硬件加速库中适合FPGA硬件实现的部分，在底层已经完成了RTL实现、调试、综合、映射、布局布线和时序收敛的工作，在调用时这些步骤会自动在后端进行。对外则以开源C/C++函数或API的形式分发，并已经为赛灵思HLS编译器进行过了预先优化。因此，软件和算法开发者无须关心这些函数和功能的底层硬件实现。\n\
    \n在Vitis顶层，则是针对特定领域的开发环境。以AI为例，它支持TensorFlow、PyTorch和Caffe等标准AI框架，并提供了一些预先训练和优化过的AI模型。\n\
    \n通常来说，AI模型的训练过程是在数据中心环境里，使用高精度浮点数进行的。当这些模型被部署并用于推理时，往往会经过并行化、量化、剪枝，以及在时间、空间和能耗三个维度进行优化。Vitis\
    \ AI可以帮助这些优化在FPGA上执行，并取得可观的改进。\n\n综上所述，Vitis是一个顺应时代潮流的产物，对于赛灵思来说也是一个巨大的进步和机遇。Vitis为硬件工程师、软件工程师和算法工程师这三类开发者，提供了一个利用FPGA进行硬件加速的清晰入手点和熟悉的开发环境。作为一个开源的FPGA开发框架，相信它会吸引更多开发者投身FPGA设计，并进一步推动整个生态系统的建设和发展。\n\
    \n### 4.4　一个晶体管也不能少：英特尔oneAPI\n\n早在2018年底，英特尔的芯片首席架构师Raja Koduri就对外公布，英特尔正在全力开发一个名为oneAPI的软件编程框架，并将以此为基础，整合英特尔旗下包括CPU、GPU、ASIC和FPGA在内的各种芯片产品，并构建英特尔完整的软硬件生态布局。\n\
    \n顾名思义，oneAPI旨在提供一个适用于各类计算架构的统一编程模型和应用程序接口。应用程序的开发者只需要开发一次代码，就可以让代码在跨平台的异构系统上执行。oneAPI的口号是“No\
    \ transistor left behind”，即“晶体管一个也不能少”，这也很形象地总结了oneAPI的终极目标。\n\noneAPI希望解决的主要问题，就是简化异构系统的可编程性。在前面的章节介绍过，应用程序的跨平台优化一直是业界研究的热点和重点之一。因此，英特尔希望通过oneAPI提供一个通用、开放的编程体验，让开发者可以自由选择架构，无须在性能上做出妥协。同时，使用统一的编程环境和开发平台，也能极大降低使用不同的代码库、编程语言、编程工具和工作流程所带来的复杂性。\n\
    \n具体来说，英特尔将旗下的芯片架构分成了SVMS四类：\n\n·标量架构（Scalar）：CPU；\n\n·矢量架构（Vector）：GPU；\n\n·矩阵架构（Matrix）：AI芯片；\n\
    \n·空间架构（Special）：FPGA。\n\n这四类架构分别有各自的优势和适用范围，同时也有着各自的编程模型和方法。以FPGA为例，FPGA的硬件可编程性一直是它最主要的特点之一，也是FPGA与其他硬件加速器的差异化所在。然而，如前文所述，对FPGA进行编程远远没有想象中那么简单。这其中最大的难点，就是要使用硬件描述语言对电路进行寄存器传输级建模，而且这种建模往往在比较低的抽象程度里进行。FPGA开发者需要将目标算法进行分解、并行化、设计流水线，使其成为一个个数据通路或控制电路，同时还要设计数据的存储和读取方式、各种时钟域的同步，进行时序收敛等诸多优化，以符合系统的功耗、吞吐量、精度、面积等需求。这还不包括电路仿真、调试，以及在软件层面需要做的一系列工作。\n\
    \n这样，为了做出一个真正优化过的FPGA设计，往往需要一个有着丰富设计经验的团队协同合作。而就算有这样的团队，在处理一个再常见不过的for循环嵌套时，都可能花费长达数月的时间进行FPGA的硬件实现与性能调优。这并非危言耸听，只需要看一下过去几年里，各类FPGA国际会议和期刊上有多少关于FPGA循环展开与优化的论文就可见一斑了。\n\
    \n为了应对FPGA的设计复杂度过大的问题，业界通常有两种方法：第一，尽量将优化过的硬件设计封装成IP，让使用者直接调用；第二，使用高层次综合的方法，直接将高层语言描述的模型转化为FPGA硬件。\n\
    \n高层次综合的主要问题是，它设计的初衷是为了服务硬件工程师，而非软件和算法开发者。因此，起码到目前为止，在业界取得成功的高层次综合工具仍然需要使用者有着丰富的硬件知识。在数字电路工程师手中，高层次综合工具已经被证明可以极大地缩短设计周期，有时甚至可以得到近似或优于人工优化过的RTL代码。然而对于没有硬件背景的软件工程师来说，通过高层次综合设计FPGA，就好比让C罗去湖人队打篮球，固然噱头十足，但恐怕很难得到令人满意的成绩。\n\
    \noneAPI在很大程度上可以看作是高层次综合的扩展，但它的主要目标受众则是软件和算法工程师，这也将成为oneAPI与其他高层次综合工具的最主要区别。oneAPI提供了一个统一的软件编程接口，使得开发者可以随意在底层的SVMS硬件架构之间进行切换和优化，而无须关心具体的电路结构和实现细节。\n\
    \n具体来说，oneAPI的核心是一个名为Data Parallel C++（DPC++）的编程语言。DPC++本质上是C++的扩展，增加了对一个名为SYCL的抽象层的支持。SYCL由Khronos组织开发，它原本针对OpenCL开发，使得用户可以直接用简洁的C++对GPU等进行设计，而无须被OpenCL限制。\n\
    \n除了编程接口外，oneAPI还会包含一个完整的开发环境、软件库、驱动程序、调试工具等要素，并且这些加速库都已经针对底层硬件进行了优化设计。这种基于优化过的加速库的设计，和赛灵思的Vitis系统有着异曲同工之妙，而这也代表了业界发展的方向。现如今，生态为王，为了掌握生态和吸引开发者，就必须尽可能多地提供各类开发库和IP，以便开发者专注于应用开发，避免重复造轮子。\n\
    \n为了支持SVMS四大类硬件架构，oneAPI实际上给自己设置了非常高的目标。英特尔已经在2019年第四季度发布了oneAPI的开发者测试版。除了基本开发工具包之外，英特尔还发布了针对高性能计算、深度学习、物联网，以及视觉和视频等四种领域专用的开发工具包，以期为这些特定的应用进行针对性的优化。在当前的版本中，开发者仍然需要在SVMS四大类中手动指定目标器件类别。但除此之外，oneAPI就会自动对目标器件的子类别进行优化。\n\
    \n### 4.5　本章小结\n\n业界普遍认为，英伟达和GPU之所以在人工智能时代取得了非凡成功，很大程度上得益于它对GPU编程方法和环境易用性的提升。与之相比，FPGA虽然也在不断扩展自己的应用范围，并在单位功耗的性能上相比GPU有着明显优势，但是FPGA的编程模型还是以硬件工程师进行RTL开发为主，而这种开发方法对于软件和算法工程师来说非常不友好。\n\
    \n随着高层次综合理论和工具的不断发展，FPGA的高层次综合将会是业界发展的必然趋势。我们可以看到，像Vitis和oneAPI之类的高层次设计工具也在不断发展和成熟。在某种意义上，这些高层次设计工具，类似于英伟达在多年前对CUDA所做的那样，将进一步允许普通的软件工程师借此使用非传统的硬件架构进行高性能编程。对于FPGA阵营来说，人们已经眼睁睁地看着英伟达和GPU在硬件加速领域取得了多年的主导地位。值得欣慰的是，Vitis和oneAPI走在了正确的道路上，它们也许会给赛灵思和英特尔提供更多对抗英伟达的筹码。\n\
    \n相信随着高层次综合领域的难题不断被攻破，使用高层语言对FPGA进行高效编程也必然会实现，而这也将最终成为FPGA更广泛应用的最后一块拼图。\n\n# 第5章\
    \  \n\n站在巨人的肩上——FPGA发展的新趋势\n\n很多世界顶尖的“建筑师”可能是你从未听说过的人，他们设计并创造出了很多你可能从未见过的神奇结构，例如在芯片内部源于沙子的复杂体系。如果你使用手机、电脑，或者通过互联网收发信息，那么你就无时无刻不在受益于这些建筑师们的伟大工作。\n\
    \n在FPGA领域，也有着一群才华横溢的“建筑师”。在他们的不断创造和推动下，FPGA已经从简单的可编程门阵列，历经30多年发展成为了基于大量可编程逻辑的复杂片上系统。除了芯片的硬件架构之外，FPGA的开发工具和应用场景也都取得了长足的进步和扩展。\n\
    \n站在巨人的肩上，方能一览众山小。想要深入理解一个领域，就有必要先了解这个领域有哪些重要的人，以及他们做过哪些重要的事。在本章中，就请跟随我们的脚步，一起认识那些FPGA研究领域的杰出人士，以及这个领域在过去几十年间涌现的诸多重要成果，并一起讨论FPGA未来的发展趋势。\n\
    \n### 5.1　百花齐放、百家争鸣：FPGA学术研究概况\n\n任何科学技术的发展和进步都离不开两个主要的推动力量，一个是相关领域各大公司的研发，另一个就是各大高校与科研院所的学术研究。这两者往往是相互补充、相互合作、相互促进的关系。综合二者，既能涵盖短期的实用性研究，又有长期技术难题的攻关与突破。\n\
    \n这样的技术发展模式，在FPGA行业也不例外。除了英特尔、赛灵思等FPGA公司的研发投入之外，世界上的很多顶尖大学和研究组也在不断开展FPGA相关的各类研究，并在过去的几十年间，取得了一系列学术突破。从FPGA架构到开发工具，现代FPGA使用的很多技术都源自于这些学术研究。相比来自工业界的各种动态，普通读者对于学术界的了解可能并不多。因此在本节中，我们将介绍在FPGA学术研究领域国内外鼎鼎有名的大学和专家学者，以及他们所专攻的领域和主要学术贡献。此外，在本节的最后，也将简要介绍FPGA领域主要的学术会议。由于篇幅所限，我们无法对FPGA领域的所有知名学者做一一介绍，因此我们选取了四所国内外具有代表性的高校，并对在这些高校里从事FPGA研究的知名专家进行简单介绍。通过这些内容，希望能让您对FPGA学术研究领域有一个初步的认识。\n\
    \n#### ■5.1.1　多伦多大学\n\n多伦多大学的FPGA研究一直被公认是世界顶尖水平。在这里聚集了一群知名教授，包括Jonathan Rose、Vaughn\
    \ Betz、Jason Anderson、Paul Chow等，见图5-1。这些教授的研究领域基本涵盖了FPGA的各个层面，包括架构、开发工具、应用等多个领域，其研究的广度和深度都是世界一流水准。\n\
    \n多伦多大学的FPGA研究兼顾前瞻性和实用性，研究成果经常能够成功地转化成为工业界产品。这些成果和这些教授的个人经历密不可分，他们很多人都曾担任过FPGA公司的高管或高级工程师，有着多年的工业界一线研发经历。回归学术界后，仍然与工业界结合非常紧密，这使得他们的研究非常实用，对FPGA行业的发展也有着很重要的推动作用。例如，Jonathan\
    \ Rose和Vaughn Betz曾创办Right Track CAD公司，专注于FPGA的自动化设计和布局布线技术。后来公司被Altera收购，并逐渐发展为Altera的多伦多研发中心，Rose和Betz两位教授也在Altera里担任了十数年的高级管理职位。正是基于该公司的技术，Altera将Quartus软件升级成为了Quartus\
    \ II CAD工具套件，并一直发展至今。\n\n![](OEBPS/Images/Figure-P167_1699.jpg)\n\n图5-1　多伦多大学的FPGA知名教授\n\
    \n再例如，Jason Anderson曾在赛灵思工作十年，同样专注于FPGA的自动化设计和优化技术，曾担任赛灵思的主任工程师、资深经理等职位。在回归学术界后，他在2015年与学生联合创办了LegUp公司，并担任首席科学顾问。LegUp是当前业界性能领先的高层次综合工具之一，公司已经获得了英特尔资本（Intel\
    \ Capital）领投的种子轮融资。\n\n#### ■5.1.2　加州大学洛杉矶分校（UCLA）\n\nUCLA在FPGA领域的代表性人物就是丛京生教授（Jason\
    \ Cong），见图5-2。他是美国工程院院士、中国工程院外籍院士，他的研究主要集中在集成电路设计自动化、FPGA综合、互连优化等领域。丛教授著作等身，发表了超过400篇高水平的学术论文，其中15篇获得最佳论文奖。"
  fmt: "\n高层次综合方法经过十数年的发展，涌现出了如`AutoPilot`、`OpenCL SDK`等`FPGA HLS`的商业化成功案例。然而，高层次综合距离完全替代人工`RTL`建模还有很长的路要走。对于`FPGA`而言，内存瓶颈一直是制约系统性能的重要因素。除片上的各类`BRAM`之外，还有各类片外存储单元，如`DDR`、`QDR`，以及近年兴起的`HBM`等。因此，如何有效利用片上和片外各类存储单元一直是`HLS`的研究热点。\n\
    \n此外，对于高层次综合工具生成结果的等效性、仿真和调试的方法也需要进一步探索。在等效性方面，可能需要采用形式化的方法，证明`HLS`生成的`RTL`代码与高层次代码在逻辑功能上等效。当需要进行软硬件的协同仿真、调试时，高层次综合工具应该提供相关的测试环境、用例、脚本、调试方法等。当硬件出现问题时，如何自下而上地进行调试，并寻找和发现高层次代码中的漏洞，也需要有成熟的方法论作为支持。\n\
    \n近年来，越来越多的研究开始专注于特定领域（Domain Specific）的编程语言和对应的高层次综合方法，例如近年来非常热门的`P4`语言，即`Programming\
    \ Protocol-Independent Packet Processors`，就是针对网络数据包领域的高层编程语言。`P4`语言诞生于2014年，由一家名为`Barefoot`的初创公司联合英特尔、谷歌、微软以及斯坦福大学和普林斯顿大学共同起草发布并开源。而`P4`背后的主要设计者，则是斯坦福大学教授`Nick\
    \ McKeown`，见图4-3，他是软件定义网络（`Software Defined Network`，`SDN`）的提出者和先驱，先后发起成立了开放网络基金会（`ONF`），以及负责制定`P4`标准的`P4.org`。在`Barefoot`公司内，他是联合创始人和首席科学家。\n\
    \n![](OEBPS/Images/Figure-P156_1630.jpg)\n\n图4-3　`P4`语言的主要设计者之一`Nick McKeown`教授\n\
    \n发明`P4`语言的主要目的是为软件定义网络（`SDN`）的数据平面提供协议无关的可编程能力，例如包头解析、匹配、表项配置等。众所周知，网络数据包处理是`FPGA`的传统优势领域，而`SDN`与网络功能虚拟化等最近正蓬勃发展的网络应用，则是`FPGA`未来的应用领域之一，这在之前的章节已经详细介绍过。当这二者结合在一起，就需要有新型的`FPGA`开发工具，对`P4`等高层语言进行编译和支持。目前，赛灵思与英特尔都已经发布了自己对`P4`的`FPGA`编译器，使设计者可以通过`P4`语言直接在`FPGA`上生成高性能数据包处理流水线。2019年，英特尔宣布收购`Barefoot`公司，`Nick\
    \ McKeown`也成为了英特尔的资深院士（`Senior Fellow`）。\n\n随着人工智能的发展，业界也出现了很多专门为`AI`应用而生的`Python`高层次综合工具。例如，在2019年的`FPGA`国际研讨会上，`UCLA`丛京生教授课题组与康奈尔大学张志如副教授课题组再次强强联合，他们合作的文章`HeteroCL`：`A\
    \ Multi-Paradigm Programming Infrastructure for Software-Defined Reconfigurable\
    \ Computing`获得了大会的最佳论文奖。这个工作提出了一个名为`HetroCL`的领域专用语言和编程模型，它基于`Python`，专门为图像处理和机器学习应用而进行针对性的优化。和之前介绍的`HLS`工作类似，这个高层次编程框架在很大程度上降低了`FPGA`的编程难度，并有效解决了当前的一些高层次综合工具存在的问题与痛点。\n\
    \n具体来说，目前的高层次综合工具的使用体验并没有想象中那么简单有效，可以说是“理想很丰满，现实很骨感”。虽然算法和模型可以使用`C`、`OpenCL`等高层语言进行编写，但如果直接对这些软件代码进行综合，大多数情况无法取得令人满意的结果。因此，为了达到最优的硬件性能，开发者仍然需要对底层`FPGA`的硬件架构有着清楚的了解，按硬件设计的思路编写软件代码。在此基础上，还需要通过一些特殊的预处理指令（`Pragma`）指导`HLS`编译器达到期望的硬件结构。这个过程都需要开发者手动完成，而这会极大影响开发效率与代码的可读性。在很多情况下，通过这些处理之后的代码与源代码都有着很大区别。图4-4就展示了一个点积函数的源代码以及为了`HLS`优化后的代码，可以清晰看到二者的不同。\n\
    \n![](OEBPS/Images/Figure-P158_1639.jpg)\n\n图4-4　`HLS`代码优化前后的对比\n\n为了解决这个问题，这项工作提出的`HetroCL`框架能够将算法描述与底层硬件结构完全解耦，使得算法设计师和软件工程师不需要关心底层硬件的数据类型、计算单元实现，以及存储器架构的优化等。\n\
    \n可以看到，通过使用特定领域的高层次综合技术，可以进一步对工具进行领域的针对性优化，也能大幅提升系统性能，减少面积和功耗。面向特定领域的高层次综合算法的优化与设计，也将会是高层次综合领域未来发展的重要方向之一。\n\
    \n## 4.3　商业级开源开发工具：赛灵思`Vitis`\n\n在2019年10月举办的赛灵思开发者大会（`XDF`）上，赛灵思发布了一款名为“`Vitis`”的软件框架。赛灵思表示，`Vitis`历经5年打造，总共花费了1000人·年（即1名工程师全职工作1年）的工作量。换句话说，假设赛灵思自1984年成立之日起就开始`Vitis`的设计工作，那么也需要至少28名工程师在35年的时间里全职为`Vitis`编写代码。虽然这是玩笑，但从中也能看出赛灵思为`Vitis`投入的巨大工程量。\n\
    \n`Vitis`工具面向的是软件开发者。它位于`Vivado`工具套件的上层，用来为软件开发者提供设计、调试和运行`FPGA`的一系列必要组件。`Vitis`并没有强制开发者使用固定的`IDE`，与之相反，它可以被插入到很多常见的软件开发工具和框架中，并依靠一系列硬件加速库连接底层的赛灵思的生态系统。赛灵思强调，这些库和硬件`IP`都是开源的，尽管这里的“开源”是指专门为赛灵思自身的硬件架构设计的，即在竞品上使用这些开源库和`IP`可能会很困难，但这也被业界看作是一个大胆的举措。\n\
    \n`Vitis`的架构示意图如图4-5所示。其中，`Vitis`的核心开发工具包（`Core Development Kit`）包括编译器、分析器和调试器，它们位于运行库之上。运行库负责管理各种硬件加速计算和子系统。在框架的最底层，是硬件相关的目标平台，它根据目标`FPGA`器件或开发板定义了基本软硬件架构及应用环境，包括存储器接口、自定义`I/O`接口、数据传输协议和接口等。\n\
    \n![](OEBPS/Images/Figure-P159_1651.jpg)\n\n图4-5　`Vitis`架构示意图\n\n在核心开发工具包之上，就是硬件加速库（`Accelerated\
    \ Libraries`），它由针对不同应用领域的8个子库组成，分别对应`AI`模型、视频编解码、视觉与图像处理、数据分析、金融量化、基础线性代数计算、求解器，以及数据库操作。这8个子库总共包含400多个预先优化的开源应用，能极大地减轻这些领域应用开发的难度，降低开发时间。对于软件工程师和算法工程师而言，他们可以根据这些硬件加速库，很快地对算法和应用进行高层次建模，并直接利用底层的可编程逻辑器件对这些应用进行硬件加速。\n\
    \n这些硬件加速库中适合`FPGA`硬件实现的部分，在底层已经完成了`RTL`实现、调试、综合、映射、布局布线和时序收敛的工作，在调用时这些步骤会自动在后端进行。对外则以开源`C/C++`函数或`API`的形式分发，并已经为赛灵思`HLS`编译器进行过了预先优化。因此，软件和算法开发者无须关心这些函数和功能的底层硬件实现。\n\
    \n在`Vitis`顶层，则是针对特定领域的开发环境。以`AI`为例，它支持`TensorFlow`、`PyTorch`和`Caffe`等标准`AI`框架，并提供了一些预先训练和优化过的`AI`模型。\n\
    \n通常来说，`AI`模型的训练过程是在数据中心环境里，使用高精度浮点数进行的。当这些模型被部署并用于推理时，往往会经过并行化、量化、剪枝，以及在时间、空间和能耗三个维度进行优化。`Vitis\
    \ AI`可以帮助这些优化在`FPGA`上执行，并取得可观的改进。\n\n综上所述，`Vitis`是一个顺应时代潮流的产物，对于赛灵思来说也是一个巨大的进步和机遇。`Vitis`为硬件工程师、软件工程师和算法工程师这三类开发者，提供了一个利用`FPGA`进行硬件加速的清晰入手点和熟悉的开发环境。作为一个开源的`FPGA`开发框架，相信它会吸引更多开发者投身`FPGA`设计，并进一步推动整个生态系统的建设和发展。\n\
    \n## 4.4　一个晶体管也不能少：英特尔`oneAPI`\n\n早在2018年底，英特尔的芯片首席架构师`Raja Koduri`就对外公布，英特尔正在全力开发一个名为`oneAPI`的软件编程框架，并将以此为基础，整合英特尔旗下包括`CPU`、`GPU`、`ASIC`和`FPGA`在内的各种芯片产品，并构建英特尔完整的软硬件生态布局。\n\
    \n顾名思义，`oneAPI`旨在提供一个适用于各类计算架构的统一编程模型和应用程序接口。应用程序的开发者只需要开发一次代码，就可以让代码在跨平台的异构系统上执行。`oneAPI`的口号是“`No\
    \ transistor left behind`”，即“晶体管一个也不能少”，这也很形象地总结了`oneAPI`的终极目标。\n\n`oneAPI`希望解决的主要问题，就是简化异构系统的可编程性。在前面的章节介绍过，应用程序的跨平台优化一直是业界研究的热点和重点之一。因此，英特尔希望通过`oneAPI`提供一个通用、开放的编程体验，让开发者可以自由选择架构，无须在性能上做出妥协。同时，使用统一的编程环境和开发平台，也能极大降低使用不同的代码库、编程语言、编程工具和工作流程所带来的复杂性。\n\
    \n具体来说，英特尔将旗下的芯片架构分成了`SVMS`四类：\n\n·标量架构（`Scalar`）：`CPU`；\n·矢量架构（`Vector`）：`GPU`；\n\
    ·矩阵架构（`Matrix`）：`AI`芯片；\n·空间架构（`Special`）：`FPGA`。\n\n这四类架构分别有各自的优势和适用范围，同时也有着各自的编程模型和方法。以`FPGA`为例，`FPGA`的硬件可编程性一直是它最主要的特点之一，也是`FPGA`与其他硬件加速器的差异化所在。然而，如前文所述，对`FPGA`进行编程远远没有想象中那么简单。这其中最大的难点，就是要使用硬件描述语言对电路进行寄存器传输级建模，而且这种建模往往在比较低的抽象程度里进行。`FPGA`开发者需要将目标算法进行分解、并行化、设计流水线，使其成为一个个数据通路或控制电路，同时还要设计数据的存储和读取方式、各种时钟域的同步，进行时序收敛等诸多优化，以符合系统的功耗、吞吐量、精度、面积等需求。这还不包括电路仿真、调试，以及在软件层面需要做的一系列工作。\n\
    \n这样，为了做出一个真正优化过的`FPGA`设计，往往需要一个有着丰富设计经验的团队协同合作。而就算有这样的团队，在处理一个再常见不过的`for`循环嵌套时，都可能花费长达数月的时间进行`FPGA`的硬件实现与性能调优。这并非危言耸听，只需要看一下过去几年里，各类`FPGA`国际会议和期刊上有多少关于`FPGA`循环展开与优化的论文就可见一斑了。\n\
    \n为了应对`FPGA`的设计复杂度过大的问题，业界通常有两种方法：第一，尽量将优化过的硬件设计封装成`IP`，让使用者直接调用；第二，使用高层次综合的方法，直接将高层语言描述的模型转化为`FPGA`硬件。\n\
    \n高层次综合的主要问题是，它设计的初衷是为了服务硬件工程师，而非软件和算法开发者。因此，起码到目前为止，在业界取得成功的高层次综合工具仍然需要使用者有着丰富的硬件知识。在数字电路工程师手中，高层次综合工具已经被证明可以极大地缩短设计周期，有时甚至可以得到近似或优于人工优化过的`RTL`代码。然而对于没有硬件背景的软件工程师来说，通过高层次综合设计`FPGA`，就好比让`C罗`去湖人队打篮球，固然噱头十足，但恐怕很难得到令人满意的成绩。\n\
    \n`oneAPI`在很大程度上可以看作是高层次综合的扩展，但它的主要目标受众则是软件和算法工程师，这也将成为`oneAPI`与其他高层次综合工具的最主要区别。`oneAPI`提供了一个统一的软件编程接口，使得开发者可以随意在底层的`SVMS`硬件架构之间进行切换和优化，而无须关心具体的电路结构和实现细节。\n\
    \n具体来说，`oneAPI`的核心是一个名为`Data Parallel C++`（`DPC++`）的编程语言。`DPC++`本质上是`C++`的扩展，增加了对一个名为`SYCL`的抽象层的支持。`SYCL`由`Khronos`组织开发，它原本针对`OpenCL`开发，使得用户可以直接用简洁的`C++`对`GPU`等进行设计，而无须被`OpenCL`限制。\n\
    \n除了编程接口外，`oneAPI`还会包含一个完整的开发环境、软件库、驱动程序、调试工具等要素，并且这些加速库都已经针对底层硬件进行了优化设计。这种基于优化过的加速库的设计，和赛灵思的`Vitis`系统有着异曲同工之妙，而这也代表了业界发展的方向。现如今，生态为王，为了掌握生态和吸引开发者，就必须尽可能多地提供各类开发库和`IP`，以便开发者专注于应用开发，避免重复造轮子。\n\
    \n为了支持`SVMS`四大类硬件架构，`oneAPI`实际上给自己设置了非常高的目标。英特尔已经在2019年第四季度发布了`oneAPI`的开发者测试版。除了基本开发工具包之外，英特尔还发布了针对高性能计算、深度学习、物联网，以及视觉和视频等四种领域专用的开发工具包，以期为这些特定的应用进行针对性的优化。在当前的版本中，开发者仍然需要在`SVMS`四大类中手动指定目标器件类别。但除此之外，`oneAPI`就会自动对目标器件的子类别进行优化。\n\
    \n## 4.5　本章小结\n\n业界普遍认为，英伟达和`GPU`之所以在人工智能时代取得了非凡成功，很大程度上得益于它对`GPU`编程方法和环境易用性的提升。与之相比，`FPGA`虽然也在不断扩展自己的应用范围，并在单位功耗的性能上相比`GPU`有着明显优势，但是`FPGA`的编程模型还是以硬件工程师进行`RTL`开发为主，而这种开发方法对于软件和算法工程师来说非常不友好。\n\
    \n随着高层次综合理论和工具的不断发展，`FPGA`的高层次综合将会是业界发展的必然趋势。我们可以看到，像`Vitis`和`oneAPI`之类的高层次设计工具也在不断发展和成熟。在某种意义上，这些高层次设计工具，类似于英伟达在多年前对`CUDA`所做的那样，将进一步允许普通的软件工程师借此使用非传统的硬件架构进行高性能编程。对于`FPGA`阵营来说，人们已经眼睁睁地看着英伟达和`GPU`在硬件加速领域取得了多年的主导地位。值得欣慰的是，`Vitis`和`oneAPI`走在了正确的道路上，它们也许会给赛灵思和英特尔提供更多对抗英伟达的筹码。\n\
    \n相信随着高层次综合领域的难题不断被攻破，使用高层语言对`FPGA`进行高效编程也必然会实现，而这也将最终成为`FPGA`更广泛应用的最后一块拼图。\n\n\
    # 第5章  \n站在巨人的肩上——FPGA发展的新趋势\n\n很多世界顶尖的“建筑师”可能是你从未听说过的人，他们设计并创造出了很多你可能从未见过的神奇结构，例如在芯片内部源于沙子的复杂体系。如果你使用手机、电脑，或者通过互联网收发信息，那么你就无时无刻不在受益于这些建筑师们的伟大工作。\n\
    \n在`FPGA`领域，也有着一群才华横溢的“建筑师”。在他们的不断创造和推动下，`FPGA`已经从简单的可编程门阵列，历经30多年发展成为了基于大量可编程逻辑的复杂片上系统。除了芯片的硬件架构之外，`FPGA`的开发工具和应用场景也都取得了长足的进步和扩展。\n\
    \n站在巨人的肩上，方能一览众山小。想要深入理解一个领域，就有必要先了解这个领域有哪些重要的人，以及他们做过哪些重要的事。在本章中，就请跟随我们的脚步，一起认识那些`FPGA`研究领域的杰出人士，以及这个领域在过去几十年间涌现的诸多重要成果，并一起讨论`FPGA`未来的发展趋势。\n\
    \n## 5.1　百花齐放、百家争鸣：`FPGA`学术研究概况\n\n任何科学技术的发展和进步都离不开两个主要的推动力量，一个是相关领域各大公司的研发，另一个就是各大高校与科研院所的学术研究。这两者往往是相互补充、相互合作、相互促进的关系。综合二者，既能涵盖短期的实用性研究，又有长期技术难题的攻关与突破。\n\
    \n这样的技术发展模式，在`FPGA`行业也不例外。除了英特尔、赛灵思等`FPGA`公司的研发投入之外，世界上的很多顶尖大学和研究组也在不断开展`FPGA`相关的各类研究，并在过去的几十年间，取得了一系列学术突破。从`FPGA`架构到开发工具，现代`FPGA`使用的很多技术都源自于这些学术研究。相比来自工业界的各种动态，普通读者对于学术界的了解可能并不多。因此在本节中，我们将介绍在`FPGA`学术研究领域国内外鼎鼎有名的大学和专家学者，以及他们所专攻的领域和主要学术贡献。此外，在本节的最后，也将简要介绍`FPGA`领域主要的学术会议。由于篇幅所限，我们无法对`FPGA`领域的所有知名学者做一一介绍，因此我们选取了四所国内外具有代表性的高校，并对在这些高校里从事`FPGA`研究的知名专家进行简单介绍。通过这些内容，希望能让您对`FPGA`学术研究领域有一个初步的认识。\n\
    \n### 5.1.1　多伦多大学\n\n多伦多大学的`FPGA`研究一直被公认是世界顶尖水平。在这里聚集了一群知名教授，包括`Jonathan Rose`、`Vaughn\
    \ Betz`、`Jason Anderson`、`Paul Chow`等，见图5-1。这些教授的研究领域基本涵盖了`FPGA`的各个层面，包括架构、开发工具、应用等多个领域，其研究的广度和深度都是世界一流水准。\n\
    \n多伦多大学的`FPGA`研究兼顾前瞻性和实用性，研究成果经常能够成功地转化成为工业界产品。这些成果和这些教授的个人经历密不可分，他们很多人都曾担任过`FPGA`公司的高管或高级工程师，有着多年的工业界一线研发经历。回归学术界后，仍然与工业界结合非常紧密，这使得他们的研究非常实用，对`FPGA`行业的发展也有着很重要的推动作用。例如，`Jonathan\
    \ Rose`和`Vaughn Betz`曾创办`Right Track CAD`公司，专注于`FPGA`的自动化设计和布局布线技术。后来公司被`Altera`收购，并逐渐发展为`Altera`的多伦多研发中心，`Rose`和`Betz`两位教授也在`Altera`里担任了十数年的高级管理职位。正是基于该公司的技术，`Altera`将`Quartus`软件升级成为了`Quartus\
    \ II CAD`工具套件，并一直发展至今。\n\n![](OEBPS/Images/Figure-P167_1699.jpg)\n\n图5-1　多伦多大学的`FPGA`知名教授\n\
    \n再例如，`Jason Anderson`曾在赛灵思工作十年，同样专注于`FPGA`的自动化设计和优化技术，曾担任赛灵思的主任工程师、资深经理等职位。在回归学术界后，他在2015年与学生联合创办了`LegUp`公司，并担任首席科学顾问。`LegUp`是当前业界性能领先的高层次综合工具之一，公司已经获得了英特尔资本（`Intel\
    \ Capital`）领投的种子轮融资。\n\n### 5.1.2　加州大学洛杉矶分校（`UCLA`）\n\n`UCLA`在`FPGA`领域的代表性人物就是丛京生教授（`Jason\
    \ Cong`），见图5-2。他是美国工程院院士、中国工程院外籍院士，他的研究主要集中在集成电路设计自动化、`FPGA`综合、互连优化等领域。丛教授著作等身，发表了超过400篇高水平的学术论文，其中15篇获得最佳论文奖。\n"
  trans: "\n\n高层次综合方法经过十数年的发展，涌现出了如`AutoPilot`、`OpenCL SDK`等`FPGA HLS`的商业化成功案例。然而，高层次综合距离完全替代人工`RTL`建模还有很长的路要走。对于`FPGA`而言，内存瓶颈一直是制约系统性能的重要因素。除片上的各类`BRAM`之外，还有各类片外存储单元，如`DDR`、`QDR`，以及近年兴起的`HBM`等。因此，如何有效利用片上和片外各类存储单元一直是`HLS`的研究热点。\n\
    \n此外，对于高层次综合工具生成结果的等效性、仿真和调试的方法也需要进一步探索。在等效性方面，可能需要采用形式化的方法，证明`HLS`生成的`RTL`代码与高层次代码在逻辑功能上等效。当需要进行软硬件的协同仿真、调试时，高层次综合工具应该提供相关的测试环境、用例、脚本、调试方法等。当硬件出现问题时，如何自下而上地进行调试，并寻找和发现高层次代码中的漏洞，也需要有成熟的方法论作为支持。\n\
    \n近年来，越来越多的研究开始专注于特定领域（Domain Specific）的编程语言和对应的高层次综合方法，例如近年来非常热门的`P4`语言，即`Programming\
    \ Protocol-Independent Packet Processors`，就是针对网络数据包领域的高层编程语言。`P4`语言诞生于 2014 年，由一家名为`Barefoot`的初创公司联合英特尔、谷歌、微软以及斯坦福大学和普林斯顿大学共同起草发布并开源。而`P4`背后的主要设计者，则是斯坦福大学教授`Nick\
    \ McKeown`，见图 4-3，他是软件定义网络（`Software Defined Network`，`SDN`）的提出者和先驱，先后发起成立了开放网络基金会（`ONF`），以及负责制定`P4`标准的`P4.org`。在`Barefoot`公司内，他是联合创始人和首席科学家。\n\
    \n![](img/Figure-P156_1630.jpg)\n\n图 4-3　`P4`语言的主要设计者之一`Nick McKeown`教授\n\n发明`P4`语言的主要目的是为软件定义网络（`SDN`）的数据平面提供协议无关的可编程能力，例如包头解析、匹配、表项配置等。众所周知，网络数据包处理是`FPGA`的传统优势领域，而`SDN`与网络功能虚拟化等最近正蓬勃发展的网络应用，则是`FPGA`未来的应用领域之一，这在之前的章节已经详细介绍过。当这二者结合在一起，就需要有新型的`FPGA`开发工具，对`P4`等高层语言进行编译和支持。目前，赛灵思与英特尔都已经发布了自己对`P4`的`FPGA`编译器，使设计者可以通过`P4`语言直接在`FPGA`上生成高性能数据包处理流水线。2019\
    \ 年，英特尔宣布收购`Barefoot`公司，`Nick McKeown`也成为了英特尔的资深院士（`Senior Fellow`）。\n\n随着人工智能的发展，业界也出现了很多专门为`AI`应用而生的`Python`高层次综合工具。例如，在\
    \ 2019 年的`FPGA`国际研讨会上，`UCLA`丛京生教授课题组与康奈尔大学张志如副教授课题组再次强强联合，他们合作的文章`HeteroCL`：`A\
    \ Multi-Paradigm Programming Infrastructure for Software-Defined Reconfigurable\
    \ Computing`获得了大会的最佳论文奖。这个工作提出了一个名为`HetroCL`的领域专用语言和编程模型，它基于`Python`，专门为图像处理和机器学习应用而进行针对性的优化。和之前介绍的`HLS`工作类似，这个高层次编程框架在很大程度上降低了`FPGA`的编程难度，并有效解决了当前的一些高层次综合工具存在的问题与痛点。\n\
    \n具体来说，目前的高层次综合工具的使用体验并没有想象中那么简单有效，可以说是“理想很丰满，现实很骨感”。虽然算法和模型可以使用`C`、`OpenCL`等高层语言进行编写，但如果直接对这些软件代码进行综合，大多数情况无法取得令人满意的结果。因此，为了达到最优的硬件性能，开发者仍然需要对底层`FPGA`的硬件架构有着清楚的了解，按硬件设计的思路编写软件代码。在此基础上，还需要通过一些特殊的预处理指令（`Pragma`）指导`HLS`编译器达到期望的硬件结构。这个过程都需要开发者手动完成，而这会极大影响开发效率与代码的可读性。在很多情况下，通过这些处理之后的代码与源代码都有着很大区别。图\
    \ 4-4 就展示了一个点积函数的源代码以及为了`HLS`优化后的代码，可以清晰看到二者的不同。\n\n![](img/Figure-P158_1639.jpg)\n\
    \n图 4-4　`HLS`代码优化前后的对比\n\n为了解决这个问题，这项工作提出的`HetroCL`框架能够将算法描述与底层硬件结构完全解耦，使得算法设计师和软件工程师不需要关心底层硬件的数据类型、计算单元实现，以及存储器架构的优化等。\n\
    \n可以看到，通过使用特定领域的高层次综合技术，可以进一步对工具进行领域的针对性优化，也能大幅提升系统性能，减少面积和功耗。面向特定领域的高层次综合算法的优化与设计，也将会是高层次综合领域未来发展的重要方向之一。\n\
    \n## 4.3　商业级开源开发工具：赛灵思`Vitis`\n\n在 2019 年 10 月举办的赛灵思开发者大会（`XDF`）上，赛灵思发布了一款名为“`Vitis`”的软件框架。赛灵思表示，`Vitis`历经\
    \ 5 年打造，总共花费了 1000 人·年（即 1 名工程师全职工作 1 年）的工作量。换句话说，假设赛灵思自 1984 年成立之日起就开始`Vitis`的设计工作，那么也需要至少\
    \ 28 名工程师在 35 年的时间里全职为`Vitis`编写代码。虽然这是玩笑，但从中也能看出赛灵思为`Vitis`投入的巨大工程量。\n\n`Vitis`工具面向的是软件开发者。它位于`Vivado`工具套件的上层，用来为软件开发者提供设计、调试和运行`FPGA`的一系列必要组件。`Vitis`并没有强制开发者使用固定的`IDE`，与之相反，它可以被插入到很多常见的软件开发工具和框架中，并依靠一系列硬件加速库连接底层的赛灵思的生态系统。赛灵思强调，这些库和硬件`IP`都是开源的，尽管这里的“开源”是指专门为赛灵思自身的硬件架构设计的，即在竞品上使用这些开源库和`IP`可能会很困难，但这也被业界看作是一个大胆的举措。\n\
    \n`Vitis`的架构示意图如图 4-5 所示。其中，`Vitis`的核心开发工具包（`Core Development Kit`）包括编译器、分析器和调试器，它们位于运行库之上。运行库负责管理各种硬件加速计算和子系统。在框架的最底层，是硬件相关的目标平台，它根据目标`FPGA`器件或开发板定义了基本软硬件架构及应用环境，包括存储器接口、自定义`I/O`接口、数据传输协议和接口等。\n\
    \n![](img/Figure-P159_1651.jpg)\n\n图 4-5　`Vitis`架构示意图\n\n在核心开发工具包之上，就是硬件加速库（`Accelerated\
    \ Libraries`），它由针对不同应用领域的 8 个子库组成，分别对应`AI`模型、视频编解码、视觉与图像处理、数据分析、金融量化、基础线性代数计算、求解器，以及数据库操作。这\
    \ 8 个子库总共包含 400 多个预先优化的开源应用，能极大地减轻这些领域应用开发的难度，降低开发时间。对于软件工程师和算法工程师而言，他们可以根据这些硬件加速库，很快地对算法和应用进行高层次建模，并直接利用底层的可编程逻辑器件对这些应用进行硬件加速。\n\
    \n这些硬件加速库中适合`FPGA`硬件实现的部分，在底层已经完成了`RTL`实现、调试、综合、映射、布局布线和时序收敛的工作，在调用时这些步骤会自动在后端进行。对外则以开源`C/C++`函数或`API`的形式分发，并已经为赛灵思`HLS`编译器进行过了预先优化。因此，软件和算法开发者无须关心这些函数和功能的底层硬件实现。\n\
    \n在`Vitis`顶层，则是针对特定领域的开发环境。以`AI`为例，它支持`TensorFlow`、`PyTorch`和`Caffe`等标准`AI`框架，并提供了一些预先训练和优化过的`AI`模型。\n\
    \n通常来说，`AI`模型的训练过程是在数据中心环境里，使用高精度浮点数进行的。当这些模型被部署并用于推理时，往往会经过并行化、量化、剪枝，以及在时间、空间和能耗三个维度进行优化。`Vitis\
    \ AI`可以帮助这些优化在`FPGA`上执行，并取得可观的改进。\n\n综上所述，`Vitis`是一个顺应时代潮流的产物，对于赛灵思来说也是一个巨大的进步和机遇。`Vitis`为硬件工程师、软件工程师和算法工程师这三类开发者，提供了一个利用`FPGA`进行硬件加速的清晰入手点和熟悉的开发环境。作为一个开源的`FPGA`开发框架，相信它会吸引更多开发者投身`FPGA`设计，并进一步推动整个生态系统的建设和发展。\n\
    \n## 4.4　一个晶体管也不能少：英特尔`oneAPI`\n\n早在 2018 年底，英特尔的芯片首席架构师`Raja Koduri`就对外公布，英特尔正在全力开发一个名为`oneAPI`的软件编程框架，并将以此为基础，整合英特尔旗下包括`CPU`、`GPU`、`ASIC`和`FPGA`在内的各种芯片产品，并构建英特尔完整的软硬件生态布局。\n\
    \n顾名思义，`oneAPI`旨在提供一个适用于各类计算架构的统一编程模型和应用程序接口。应用程序的开发者只需要开发一次代码，就可以让代码在跨平台的异构系统上执行。`oneAPI`的口号是“`No\
    \ transistor left behind`”，即“晶体管一个也不能少”，这也很形象地总结了`oneAPI`的终极目标。\n\n`oneAPI`希望解决的主要问题，就是简化异构系统的可编程性。在前面的章节介绍过，应用程序的跨平台优化一直是业界研究的热点和重点之一。因此，英特尔希望通过`oneAPI`提供一个通用、开放的编程体验，让开发者可以自由选择架构，无须在性能上做出妥协。同时，使用统一的编程环境和开发平台，也能极大降低使用不同的代码库、编程语言、编程工具和工作流程所带来的复杂性。\n\
    \n具体来说，英特尔将旗下的芯片架构分成了`SVMS`四类：\n\n·标量架构（`Scalar`）：`CPU`；\n·矢量架构（`Vector`）：`GPU`；\n\
    ·矩阵架构（`Matrix`）：`AI`芯片；\n·空间架构（`Special`）：`FPGA`。\n\n这四类架构分别有各自的优势和适用范围，同时也有着各自的编程模型和方法。以`FPGA`为例，`FPGA`的硬件可编程性一直是它最主要的特点之一，也是`FPGA`与其他硬件加速器的差异化所在。然而，如前文所述，对`FPGA`进行编程远远没有想象中那么简单。这其中最大的难点，就是要使用硬件描述语言对电路进行寄存器传输级建模，而且这种建模往往在比较低的抽象程度里进行。`FPGA`开发者需要将目标算法进行分解、并行化、设计流水线，使其成为一个个数据通路或控制电路，同时还要设计数据的存储和读取方式、各种时钟域的同步，进行时序收敛等诸多优化，以符合系统的功耗、吞吐量、精度、面积等需求。这还不包括电路仿真、调试，以及在软件层面需要做的一系列工作。\n\
    \n这样，为了做出一个真正优化过的`FPGA`设计，往往需要一个有着丰富设计经验的团队协同合作。而就算有这样的团队，在处理一个再常见不过的`for`循环嵌套时，都可能花费长达数月的时间进行`FPGA`的硬件实现与性能调优。这并非危言耸听，只需要看一下过去几年里，各类`FPGA`国际会议和期刊上有多少关于`FPGA`循环展开与优化的论文就可见一斑了。\n\
    \n为了应对`FPGA`的设计复杂度过大的问题，业界通常有两种方法：第一，尽量将优化过的硬件设计封装成`IP`，让使用者直接调用；第二，使用高层次综合的方法，直接将高层语言描述的模型转化为`FPGA`硬件。\n\
    \n高层次综合的主要问题是，它设计的初衷是为了服务硬件工程师，而非软件和算法开发者。因此，起码到目前为止，在业界取得成功的高层次综合工具仍然需要使用者有着丰富的硬件知识。在数字电路工程师手中，高层次综合工具已经被证明可以极大地缩短设计周期，有时甚至可以得到近似或优于人工优化过的`RTL`代码。然而对于没有硬件背景的软件工程师来说，通过高层次综合设计`FPGA`，就好比让`C\
    \ 罗`去湖人队打篮球，固然噱头十足，但恐怕很难得到令人满意的成绩。\n\n`oneAPI`在很大程度上可以看作是高层次综合的扩展，但它的主要目标受众则是软件和算法工程师，这也将成为`oneAPI`与其他高层次综合工具的最主要区别。`oneAPI`提供了一个统一的软件编程接口，使得开发者可以随意在底层的`SVMS`硬件架构之间进行切换和优化，而无须关心具体的电路结构和实现细节。\n\
    \n具体来说，`oneAPI`的核心是一个名为`Data Parallel C++`（`DPC++`）的编程语言。`DPC++`本质上是`C++`的扩展，增加了对一个名为`SYCL`的抽象层的支持。`SYCL`由`Khronos`组织开发，它原本针对`OpenCL`开发，使得用户可以直接用简洁的`C++`对`GPU`等进行设计，而无须被`OpenCL`限制。\n\
    \n除了编程接口外，`oneAPI`还会包含一个完整的开发环境、软件库、驱动程序、调试工具等要素，并且这些加速库都已经针对底层硬件进行了优化设计。这种基于优化过的加速库的设计，和赛灵思的`Vitis`系统有着异曲同工之妙，而这也代表了业界发展的方向。现如今，生态为王，为了掌握生态和吸引开发者，就必须尽可能多地提供各类开发库和`IP`，以便开发者专注于应用开发，避免重复造轮子。\n\
    \n为了支持`SVMS`四大类硬件架构，`oneAPI`实际上给自己设置了非常高的目标。英特尔已经在 2019 年第四季度发布了`oneAPI`的开发者测试版。除了基本开发工具包之外，英特尔还发布了针对高性能计算、深度学习、物联网，以及视觉和视频等四种领域专用的开发工具包，以期为这些特定的应用进行针对性的优化。在当前的版本中，开发者仍然需要在`SVMS`四大类中手动指定目标器件类别。但除此之外，`oneAPI`就会自动对目标器件的子类别进行优化。\n\
    \n## 4.5　本章小结\n\n业界普遍认为，英伟达和`GPU`之所以在人工智能时代取得了非凡成功，很大程度上得益于它对`GPU`编程方法和环境易用性的提升。与之相比，`FPGA`虽然也在不断扩展自己的应用范围，并在单位功耗的性能上相比`GPU`有着明显优势，但是`FPGA`的编程模型还是以硬件工程师进行`RTL`开发为主，而这种开发方法对于软件和算法工程师来说非常不友好。\n\
    \n随着高层次综合理论和工具的不断发展，`FPGA`的高层次综合将会是业界发展的必然趋势。我们可以看到，像`Vitis`和`oneAPI`之类的高层次设计工具也在不断发展和成熟。在某种意义上，这些高层次设计工具，类似于英伟达在多年前对`CUDA`所做的那样，将进一步允许普通的软件工程师借此使用非传统的硬件架构进行高性能编程。对于`FPGA`阵营来说，人们已经眼睁睁地看着英伟达和`GPU`在硬件加速领域取得了多年的主导地位。值得欣慰的是，`Vitis`和`oneAPI`走在了正确的道路上，它们也许会给赛灵思和英特尔提供更多对抗英伟达的筹码。\n\
    \n相信随着高层次综合领域的难题不断被攻破，使用高层语言对`FPGA`进行高效编程也必然会实现，而这也将最终成为`FPGA`更广泛应用的最后一块拼图。\n\n\
    # 第 5 章  \n站在巨人的肩上——FPGA 发展的新趋势\n\n很多世界顶尖的“建筑师”可能是你从未听说过的人，他们设计并创造出了很多你可能从未见过的神奇结构，例如在芯片内部源于沙子的复杂体系。如果你使用手机、电脑，或者通过互联网收发信息，那么你就无时无刻不在受益于这些建筑师们的伟大工作。\n\
    \n在`FPGA`领域，也有着一群才华横溢的“建筑师”。在他们的不断创造和推动下，`FPGA`已经从简单的可编程门阵列，历经 30 多年发展成为了基于大量可编程逻辑的复杂片上系统。除了芯片的硬件架构之外，`FPGA`的开发工具和应用场景也都取得了长足的进步和扩展。\n\
    \n站在巨人的肩上，方能一览众山小。想要深入理解一个领域，就有必要先了解这个领域有哪些重要的人，以及他们做过哪些重要的事。在本章中，就请跟随我们的脚步，一起认识那些`FPGA`研究领域的杰出人士，以及这个领域在过去几十年间涌现的诸多重要成果，并一起讨论`FPGA`未来的发展趋势。\n\
    \n## 5.1　百花齐放、百家争鸣：`FPGA`学术研究概况\n\n任何科学技术的发展和进步都离不开两个主要的推动力量，一个是相关领域各大公司的研发，另一个就是各大高校与科研院所的学术研究。这两者往往是相互补充、相互合作、相互促进的关系。综合二者，既能涵盖短期的实用性研究，又有长期技术难题的攻关与突破。\n\
    \n这样的技术发展模式，在`FPGA`行业也不例外。除了英特尔、赛灵思等`FPGA`公司的研发投入之外，世界上的很多顶尖大学和研究组也在不断开展`FPGA`相关的各类研究，并在过去的几十年间，取得了一系列学术突破。从`FPGA`架构到开发工具，现代`FPGA`使用的很多技术都源自于这些学术研究。相比来自工业界的各种动态，普通读者对于学术界的了解可能并不多。因此在本节中，我们将介绍在`FPGA`学术研究领域国内外鼎鼎有名的大学和专家学者，以及他们所专攻的领域和主要学术贡献。此外，在本节的最后，也将简要介绍`FPGA`领域主要的学术会议。由于篇幅所限，我们无法对`FPGA`领域的所有知名学者做一一介绍，因此我们选取了四所国内外具有代表性的高校，并对在这些高校里从事`FPGA`研究的知名专家进行简单介绍。通过这些内容，希望能让您对`FPGA`学术研究领域有一个初步的认识。\n\
    \n### 5.1.1　多伦多大学\n\n多伦多大学的`FPGA`研究一直被公认是世界顶尖水平。在这里聚集了一群知名教授，包括`Jonathan Rose`、`Vaughn\
    \ Betz`、`Jason Anderson`、`Paul Chow`等，见图 5-1。这些教授的研究领域基本涵盖了`FPGA`的各个层面，包括架构、开发工具、应用等多个领域，其研究的广度和深度都是世界一流水准。\n\
    \n多伦多大学的`FPGA`研究兼顾前瞻性和实用性，研究成果经常能够成功地转化成为工业界产品。这些成果和这些教授的个人经历密不可分，他们很多人都曾担任过`FPGA`公司的高管或高级工程师，有着多年的工业界一线研发经历。回归学术界后，仍然与工业界结合非常紧密，这使得他们的研究非常实用，对`FPGA`行业的发展也有着很重要的推动作用。例如，`Jonathan\
    \ Rose`和`Vaughn Betz`曾创办`Right Track CAD`公司，专注于`FPGA`的自动化设计和布局布线技术。后来公司被`Altera`收购，并逐渐发展为`Altera`的多伦多研发中心，`Rose`和`Betz`两位教授也在`Altera`里担任了十数年的高级管理职位。正是基于该公司的技术，`Altera`将`Quartus`软件升级成为了`Quartus\
    \ II CAD`工具套件，并一直发展至今。\n\n![](img/Figure-P167_1699.jpg)\n\n图 5-1　多伦多大学的`FPGA`知名教授\n\
    \n再例如，`Jason Anderson`曾在赛灵思工作十年，同样专注于`FPGA`的自动化设计和优化技术，曾担任赛灵思的主任工程师、资深经理等职位。在回归学术界后，他在\
    \ 2015 年与学生联合创办了`LegUp`公司，并担任首席科学顾问。`LegUp`是当前业界性能领先的高层次综合工具之一，公司已经获得了英特尔资本（`Intel\
    \ Capital`）领投的种子轮融资。\n\n### 5.1.2　加州大学洛杉矶分校（`UCLA`）\n\n`UCLA`在`FPGA`领域的代表性人物就是丛京生教授（`Jason\
    \ Cong`），见图 5-2。他是美国工程院院士、中国工程院外籍院士，他的研究主要集中在集成电路设计自动化、`FPGA`综合、互连优化等领域。丛教授著作等身，发表了超过\
    \ 400 篇高水平的学术论文，其中 15 篇获得最佳论文奖。\n\n"
