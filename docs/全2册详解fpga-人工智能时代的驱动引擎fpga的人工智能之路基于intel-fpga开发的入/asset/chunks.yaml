- raw: '第二，对于相同的吞吐量要求，采用FPGA加速后系统延时会下降29%。由此可见，FPGA大幅提升了系统的整体性能。此外，每个FPGA带来的额外功耗小于25W，系统的总功耗增加了不到10%，且总体成本的增加不超过30%。在稳定性方面，只有在部署初期发现了7块FPGA板卡发生了硬件故障，占总板卡数量的0.4%。在之后几个月的运行中，所有板卡和服务器都稳定运转，这也足以证明FPGA系统的稳定性。


    ![](OEBPS/Images/Figure-P78_953.jpg)


    图2-10　Catapult项目取得的性能提升


    ##### 3．第三阶段


    在Catapult项目的第二阶段中，采用了FPGA对必应搜索引擎的文档排名算法进行了硬件加速，取得了2倍于纯软件方案的性能提升。但是，这个方案仍有一些突出的缺点和问题需要进一步改进。其中最主要的问题在于，为了实现FPGA之间的低延时通信，第二阶段的Catapult方案引入了一个6×8的二维Torus网络。相比于数据中心网络常见的TOR交换机直连CPU的结构，这个Torus网络相当于额外增加了一个二层网络，而这会在扩展性和同构性方面带来了诸多问题。


    例如，在这个新引入的Torus网络拓扑里，FPGA的互连需要通过两类特殊定制的线缆，如图2-11所示。其中，左边的线缆连接8个FPGA，右边的线缆连接6个FPGA。这种连接方式不但成本高昂，而且需要知道机柜里FPGA的确切物理位置，以实现正确的拓扑连接。这非常不利于系统的扩容和维护。


    ![](OEBPS/Images/Figure-P79_961.jpg)


    图2-11　FPGA互连网络的连线方式与线缆（图片来自微软）


    在Torus网络内，有共计48个FPGA。虽然它们彼此通信时具有很高的速度，但如果不同的Torus网络里的FPGA需要相互通信，则需要复杂的路由，并随之带来相当大的通信延时和性能损失。这对于某些应用来说是不可接受的。


    还应注意的是，这个方案中的FPGA只能用来作为特定应用的硬件加速器。对于数据中心的常用网络功能，如数据包加解密、流量控制、虚拟化等基础设施结构和应用来说，FPGA并没有任何帮助和补强的作用。


    为了解决上述问题，微软在2016年发表了Catapult项目第三阶段的工作。这个阶段最主要的贡献，就是取消了FPGA互连的第二级网络，并直接将FPGA与数据中心网络进行连接，如图2-12所示。


    ![](OEBPS/Images/Figure-P80_967.jpg)


    图2-12　Catapult第三阶段的FPGA加速卡和系统框图


    可以看到，新一代的FPGA加速卡仍然采用了英特尔的Stratix V系列FPGA，板卡上的网络接口升级为两个40Gbps的QSFP端口。FPGA加速卡位于服务器和数据中心网络之间，一个网口连接TOR交换机，另外一个网口与服务器的网卡相连。和上一个版本相同，CPU可以通过PCIe
    Gen3×8总线访问FPGA，并使用FPGA为各类计算任务进行硬件加速运算。除此之外，新版本的硬件布局还带来了以下几点好处：


    第一，可以使用FPGA加速数据中心的各类网络功能和存储功能。在这个版本的硬件设计中，FPGA直接通过网络接口与数据中心网络相连，而不需要经过原来的第二层Torus网络，这样极大地扩展了系统的灵活性。例如，FPGA可以作为智能网卡的处理单元，用来卸载原本在CPU上实现的很多数据中心网络功能，例如前文提到的数据加解密、流量控制、服务质量控制等。这样一来，很多网络流量可以直接在FPGA里进行处理，而无须再消耗CPU的计算资源。这样做的好处是一方面提高了网络流量的处理速度和效率，另一方面释放了宝贵的CPU内核资源，这些被释放的CPU资源可以再进行其他任务的部署，或者用来实现其他的用户应用。


    第二，新版本Catapult板卡的优点是，FPGA不再与CPU在地理位置上紧密耦合。在这个版本中，FPGA之间可以通过网络进行互连和通信，这使得CPU可以控制和使用“远程”的FPGA。换句话说，如果CPU不需要服务器内的FPGA进行硬件加速，闲置的FPGA可以组成资源池，供有需要的CPU调用，这就打破了FPGA部署的地域限制。值得注意的是，为了实现FPGA的远程使用，需要定义和实现新的通信协议。微软在这里提出了名为LTL（Lightweight
    Transport Layer）的协议，我们接下来会讲到。在这个阶段的工作中，微软在自家数据中心的5670个服务器里部署了新一代的FPGA加速卡，在地域范围上遍布全球五大洲的15个国家，这也使得微软一跃成为了世界上最大的FPGA客户之一。


    第三代Catapult FPGA架构延续了前一代的Shell & Role结构，并增加了一些新的功能，如图2-13所示。首先，增加了40Gbps网络数据处理流水线，包括两个40Gbps
    MAC/PHY以及数据包处理逻辑。另外，使用FPGA上的硬件逻辑实现了前文提到的LTL协议，用来完成FPGA之间的通信。


    第三，引入了名为Elastic Router的模块，主要用来控制多个用户可配置区域（Role）与外界网络的通信。为了实现对池化FPGA资源的统一管理和分配，微软还提出了一种硬件即服务（Hardware
    as a Service，HaaS）的使用模型，这个模型也成为了FPGA虚拟化的代表性技术之一。


    至此，Catapult项目的第三代FPGA加速卡被正式部署在微软的Azure云数据中心，并对必应搜索引擎的页面排序算法进行了FPGA加速。对于给定的延时要求，相比于深度优化后的软件实现（实线），FPGA（虚线）可以轻松达到2.25倍的吞吐量提升，如图2-14所示。


    ![](OEBPS/Images/Figure-P82_975.jpg)


    图2-13　Catapult第三代FPGA架构


    ![](OEBPS/Images/Figure-P82_979.jpg)


    图2-14　Catapult第三代取得的性能提升


    同时，微软还对比测试了使用远程FPGA获得的结果，如图2-15所示。可以看到，使用远程FPGA（Remote FPGA）与使用本地FPGA（虚线所示）相比，并没有明显的性能差异。这证明了LTL协议与HaaS使用模型的有效性。


    ![](OEBPS/Images/Figure-P83_986.jpg)


    图2-15　Catapult第三阶段远程FPGA与本地FPGA的性能对比


    Catapult第三阶段的工作很好地解决了FPGA在大型数据中心里部署的灵活性和扩展性问题，为今后FPGA的大规模部署打下了坚实的基础。在2017年，微软推出了一款基于FPGA的深度学习加速平台，名为“脑波（Brainwave）”项目。脑波项目代表着FPGA在数据中心里的应用正式扩展到人工智能领域。关于脑波项目的具体内容，我们将在下一章详细探讨。


    #### ■2.1.5　微软Catapult项目小结


    微软的Catapult项目可以称作是FPGA在大型商业数据中心里进行大规模部署和使用的开山之作，直至目前仍然是这个领域最具代表性的工作之一。与学术界的相关研究有所不同的是，Catapult兼顾了学术创新和工程的实用性，这对于业界其他的公司更具有直接的借鉴意义。另外，在结果方面，微软使用了自家已经深度优化的纯软件方案作为对比，使得FPGA取得的显著性能提升有着更高的可信度和说服力。


    有趣的是，除了项目初期的原型验证外，微软均采用了英特尔（原Altera）的FPGA芯片，微软也一跃成为英特尔FPGA的最大客户之一。有人曾断言，那些年叱咤风云的“Wintel”联盟，在后PC时代终将土崩瓦解。然而，在风起云涌的大数据时代，伴随着两家公司的一步步华丽转型，Wintel组合正通过FPGA再一次获得新生。


    ### 2.2　FPGA即服务（FPGA as a Service）


    对于微软的Catapult项目来说，它产生的背景更多的是伴随着自身数据中心发展和扩张，传统的数据中心软硬件架构已经无法满足不断增长的性能和功耗需求，因此要寻找能出色平衡性能、功耗、成本、灵活性等多个方面的硬件加速器，以应对人工智能与大数据时代的全新应用场景和业务模式。在这里，FPGA的主要客户是微软内部的各个部门，例如必应搜索以及之后的深度学习团队等。事实上，FPGA进入数据中心的方式并非只有这一种，以亚马逊为代表的云服务提供商就拓展了另外一种模式，名为“FPGA即服务（FPGA
    as a Service，FaaS）”。


    #### ■2.2.1　亚马逊AWS-F1实例：FPGA云服务的首次尝试


    与Catapult项目在微软的私有云中“自产自销”的使用模式不同，FaaS的主要特点是将FPGA作为公有云基础设施的一部分，向用户提供基于FPGA的云服务。首创这一使用模式的，则是亚马逊的云服务部门AWS（Amazon
    Web Services）。事实上，FPGA并非亚马逊在云服务里采用的首个硬件加速器。在此之前，AWS已经推出了基于GPU的P2实例。每个P2实例集成了高达16个英伟达GK210系列GPU，能够提供70TFLOPS的单精度浮点运算能力，以及超过23TFLOPS的双精度浮点运算能力，主要用来进行深度神经网络的训练加速，以及其他包括工程模拟、大数据分析与建模等应用。


    在2017年的HotChips大会上，AWS做了名为*FPGA Accelerated* *Computing* *Using* *AWS* *F*1 *Instances*的大会报告，正式公布了旗下首个基于FPGA的云计算加速实例AWS-F1。这标志着FPGA进入了公有云数据中心，并且和GPU一样作为公有云的硬件加速服务推向市场，供广大云计算开发者使用。


    在构建和提供FPGA云服务时，FPGA开发的便利程度和易用性至关重要。对于像微软这样的FPGA大客户，FPGA厂商必定会使出浑身解数努力争取，包括公司高层专门关注项目进展，组织强大的开发团队帮助FPGA的开发，有专门的工程师对出现的各种问题提供技术支持，同时也有庞大的市场和销售队伍进行沟通和配合。


    然而，与FPGA在私有云中的应用不同，在AWS-F1实例中FPGA的主要用户是公有云的广大开发者。他们很可能并没有足够的研发实力和深厚的资本，与FPGA厂家也并没有紧密的合作关系，很多时候都无法获得来自厂商的直接技术支持。因此，这就需要在FPGA云服务里提供完整的开发、调试、部署、维护的基础设施架构，并兼顾FPGA开发和使用时的便利性。正如各类软件开发社区那样，通过构建一个由FPGA开发者组成的活跃社区，可以起到群策群力，互相取长补短的效果。


    具体到这个云端FPGA的开发平台来说，它至少需要满足以下两点要求：一方面，平台需要将底层FPGA的逻辑资源抽象化，使用户不用花太多精力去考虑常用IP和接口的实现细节；另一方面，平台需要提供完整的FPGA软硬件开发工具，以便在云端实现全部的FPGA开发流程。


    综上，可以总结出AWS使用FPGA作为计算加速服务的主要意义，具体有以下四点：


    （1）将FPGA作为标准的AWS实例，提供给广大的开发人员社区和AWS数以百万计的终端用户。


    （2）通过提供基于云端的标准化FPGA开发工具，简化整个FPGA的开发流程。


    （3）通过使用统一定义的FPGA逻辑接口，抽象FPGA的物理接口，从而使得开发者专注于自己的算法设计和实现。


    （4）为各种FPGA设计和IP提供一个统一的应用市场和交易平台，为所有AWS用户提供更多的选择和更加方便的使用。


    #### ■2.2.2　AWS FPGA云服务的技术概述


    AWS-F1的系统架构框图如图2-16所示。可以看到，在一个完整的F1实例中，除了FPGA之外还有两个主要的组成部分：AMI和AFI。AMI全称为Amazon
    Machine Image，本质为操作系统的映像，同时包含了全套FPGA软硬件开发和仿真调试工具。AFI全称为Amazon FPGA Image，它的本质是FPGA的比特流配置文件，也称作FPGA的映像文件，它将被用来直接烧录到F1实例的FPGA上运行。AFI可以由AWS提供，或由第三方用户开发完成。同时，本实例最终生成的比特流配置文件也称为AFI，它将直接烧录到F1实例的FPGA上运行。


    ![](OEBPS/Images/Figure-P86_1025.jpg)


    图2-16　AWS-F1实例示意图


    F1实例目前采用了赛灵思公司的16nm UltraScale+FPGA器件，每个实例有两种模式，可以包含1个或8个FPGA器件，分别支持4×16GB和32×16GB的DDR4内存，以及10Gbps和25Gbps的网络通信带宽。


    F1实例也提供了一个FPGA的底层逻辑设计，这个结构类似于微软Catapult项目里的Shell & Role结构，即将FPGA划分成I/O接口和用户可编程逻辑两个部分。这样用户只需专注于自身的算法和应用开发，而无须关心太多外部通信逻辑的实现细节。


    F1实例的开发流程与普通的FPGA开发并无本质区别，开发者使用Vivado工具进行综合、布局布线、时序优化以及仿真调试等步骤，只不过这些步骤都需要借助AWS提供的AMI环境完成。开发完成后，生成的FPGA映像文件（AFI）可以直接下载到FPGA上运行，同时也可以放到AWS的应用市场供其他开发者使用。目前，很多FPGA初创公司都在AWS应用市场发布了自己的AFI，例如我国的深鉴科技（目前已被赛灵思收购）的语音识别引擎，英国Maxeler公司的金融计算加速应用，美国Falcon
    Computing公司的基因检测加速引擎，以及加拿大LegUp公司的网络功能加速应用等。国外的很多高校，如加利福尼亚大学洛杉矶分校（University of
    Culifornia，Los Angeles，UCLA）等，也将AWS-F1实例作为FPGA设计课程和实验的主要平台。这也省去了每个学校单独搭建FPGA实验设施的烦琐过程，而且还能充分利用最先进的FPGA开发工具、器件和流程，让学生专注于创新设计本身。


    #### ■2.2.3　其他公有云提供商的FPGA加速服务


    亚马逊AWS为FPGA的数据中心应用提供了一个全新的应用模式：FPGA即服务，这使得广大公有云的用户和开发者可以相对方便地使用和开发FPGA，也为FPGA开发者提供了一个完善的FPGA应用市场，供大家互通有无。


    与此同时，国内的很多云服务提供商也开始积极布局公有云的FPGA服务。例如，阿里云至今发布了三款基于FPGA的云计算加速实例，其中2018年发布的FPGA计算实例F3搭载了赛灵思的Virtex
    UltraScale+FPGA器件，而之前发布的F1则使用了英特尔的FPGA器件和开发套件。腾讯云也推出了基于赛灵思Kintex UltraScale FPGA的云服务，并将今后推出基于英特尔FPGA的计算实例。华为云也有基于赛灵思器件的FPGA加速云服务器，其正在被推向市场。


    可以说，目前国内的互联网巨头企业都纷纷进入FPGA云服务领域。随着竞争的不断升级，作为使用者的我们肯定会不断享受到技术进步带来的红利，这也会不断促进FPGA技术的发展和整体生态环境的完善。同时，如何进一步差异化竞争，像微软和亚马逊一样走出一条与众不同的技术道路，会是各家公司以及一众初创公司将要努力思考的问题。


    ### 2.3　下一代电信网络：SDN、NFV与FPGA


    除了像微软Azure和亚马逊AWS这样的云数据中心之外，电信网络提供商也在使用FPGA对自身数据中心的网络架构进行转型。这个转型背后的主要推动力，就是当前正在蓬勃发展的网络功能虚拟化（Network
    Function Virtualization，NFV）和软件定义网络（Software Defined Network，SDN）这两项技术。


    #### ■2.3.1　网络功能虚拟化（NFV）与软件定义网络（SDN）的意义


    据预测，五年后全球的网络流量将较今日增长超过3倍。在万物互连的今天，尤其是5G、物联网、自动驾驶等技术已经成为各大科技公司争夺的焦点之时，各种设备和服务都需要电信网络及其数据中心进行处理和支持。然而，电信基础架构和数据中心按传统的方法很难进行有效的扩展，其主要原因有硬件和软件两个方面的考量。


    在硬件层面，传统电信网络基础架构使用的是各类专用硬件设备，例如各种接入设备、交换机、路由器、防火墙、QoS等。虽然这些专用设备能提供高性能和高稳定性，但随着数据规模的快速增长，使用专用设备所带来的问题也随之浮上水面，例如不同设备之间的兼容性差，维护升级困难，供应商垄断资源从而大幅提高成本，若需要加入新功能则要开发新硬件设备等。


    在软件层面，不同设备都需要各自对应的软件进行配置和控制。对于来自不同供应商和规格的设备，还需要对这些不同的软件和配置方法进行整合，因此，使用这样的方法难以在系统层面进行大范围统一部署和配置。另一方面，如果某些网络功能通过纯软件的方法实现，则传统的实现方法也有着诸多问题，例如对服务器的有效利用率很低，且无法进行服务的动态迁移等。


    因此，虚拟化技术，特别是网络功能虚拟化（NFV）技术，逐渐成为各大运营商解决上述问题的有效途径。NFV出现的最直接的动因之一，就是为了支持指数级的带宽增长。在NFV领域，欧洲电信标准协会（ETSI）做了大量的标准化工作，它发布的NFV概念示意图如图2-17所示。


    可以看到，和传统方法相比，NFV利用了通用的服务器、通用的存储设备，以及通用的高速以太网交换机，以实现传统电信网络基础架构中的各种网络功能。具体而言，就是将网络功能在通用服务器中用软件实现，数据使用通用的存储设备存储，网络流量通过通用的网卡和高速交换机进行转发。这样理论上能很好地解决上述硬件层面的问题：使用通用设备而非专用设备，提高了数据中心的弹性扩展能力。在成本上，不会受某个供应商的制约，反而会通过开放竞争减少硬件采购和部署的成本。


    ![](OEBPS/Images/Figure-P90_1059.jpg)


    图2-17　NFV概念示意图


    另外，借助虚拟化技术，将网络功能在不同虚拟机中实现，这样在理论上就能解决软件层面的问题：即某个特定应用不会占用服务器的全部资源；反之，一个服务器可以同时运行多个虚拟机或网络服务。同时，虚拟机在数据中心的扩展和迁移也更加方便，不会造成服务下线或中断。


    NFV和软件定义网络（SDN）经常一起出现。它们的核心思想就是将网络的控制面和转发面进行分离。这样，所有的数据转发面设备都可以同时被控制、配置、管理，从而避免了系统管理员需要分别配置每个网络设备的低效情形。


    2016年，中国电信宣布将启动为期十年的网络智能化重构，并发布了《中国电信CTNet2025网络架构白皮书》。在这部白皮书中写道：


    “从更好地适应互联网应用的角度出发，未来网络架构必须要求网络能力接口的开放和标准化，通过软件定义网络技术，能够实现面向业务提供网络资源和能力的调度和定制化，同时为进一步加速网络能力的平台化，还需要提供网络可编程的能力，真正实现网络业务的深度开放。”'
  fmt: '

    第二，对于相同的吞吐量要求，采用FPGA加速后系统延时会下降29%。由此可见，FPGA大幅提升了系统的整体性能。此外，每个FPGA带来的额外功耗小于25W，系统的总功耗增加了不到10%，且总体成本的增加不超过30%。在稳定性方面，只有在部署初期发现了7块FPGA板卡发生了硬件故障，占总板卡数量的0.4%。在之后几个月的运行中，所有板卡和服务器都稳定运转，这也足以证明FPGA系统的稳定性。


    ![](OEBPS/Images/Figure-P78_953.jpg)


    图2-10　Catapult项目取得的性能提升


    ### 第三阶段


    在Catapult项目的第二阶段中，采用了FPGA对必应搜索引擎的文档排名算法进行了硬件加速，取得了2倍于纯软件方案的性能提升。但是，这个方案仍有一些突出的缺点和问题需要进一步改进。其中最主要的问题在于，为了实现FPGA之间的低延时通信，第二阶段的Catapult方案引入了一个6×8的二维Torus网络。相比于数据中心网络常见的TOR交换机直连CPU的结构，这个Torus网络相当于额外增加了一个二层网络，而这会在扩展性和同构性方面带来了诸多问题。


    例如，在这个新引入的Torus网络拓扑里，FPGA的互连需要通过两类特殊定制的线缆，如图2-11所示。其中，左边的线缆连接8个FPGA，右边的线缆连接6个FPGA。这种连接方式不但成本高昂，而且需要知道机柜里FPGA的确切物理位置，以实现正确的拓扑连接。这非常不利于系统的扩容和维护。


    ![](OEBPS/Images/Figure-P79_961.jpg)


    图2-11　FPGA互连网络的连线方式与线缆（图片来自微软）


    在Torus网络内，有共计48个FPGA。虽然它们彼此通信时具有很高的速度，但如果不同的Torus网络里的FPGA需要相互通信，则需要复杂的路由，并随之带来相当大的通信延时和性能损失。这对于某些应用来说是不可接受的。


    还应注意的是，这个方案中的FPGA只能用来作为特定应用的硬件加速器。对于数据中心的常用网络功能，如数据包加解密、流量控制、虚拟化等基础设施结构和应用来说，FPGA并没有任何帮助和补强的作用。


    为了解决上述问题，微软在2016年发表了Catapult项目第三阶段的工作。这个阶段最主要的贡献，就是取消了FPGA互连的第二级网络，并直接将FPGA与数据中心网络进行连接，如图2-12所示。


    ![](OEBPS/Images/Figure-P80_967.jpg)


    图2-12　Catapult第三阶段的FPGA加速卡和系统框图


    可以看到，新一代的FPGA加速卡仍然采用了英特尔的Stratix V系列FPGA，板卡上的网络接口升级为两个40Gbps的QSFP端口。FPGA加速卡位于服务器和数据中心网络之间，一个网口连接TOR交换机，另外一个网口与服务器的网卡相连。和上一个版本相同，CPU可以通过PCIe
    Gen3×8总线访问FPGA，并使用FPGA为各类计算任务进行硬件加速运算。除此之外，新版本的硬件布局还带来了以下几点好处：


    第一，可以使用FPGA加速数据中心的各类网络功能和存储功能。在这个版本的硬件设计中，FPGA直接通过网络接口与数据中心网络相连，而不需要经过原来的第二层Torus网络，这样极大地扩展了系统的灵活性。例如，FPGA可以作为智能网卡的处理单元，用来卸载原本在CPU上实现的很多数据中心网络功能，例如前文提到的数据加解密、流量控制、服务质量控制等。这样一来，很多网络流量可以直接在FPGA里进行处理，而无须再消耗CPU的计算资源。这样做的好处是一方面提高了网络流量的处理速度和效率，另一方面释放了宝贵的CPU内核资源，这些被释放的CPU资源可以再进行其他任务的部署，或者用来实现其他的用户应用。


    第二，新版本Catapult板卡的优点是，FPGA不再与CPU在地理位置上紧密耦合。在这个版本中，FPGA之间可以通过网络进行互连和通信，这使得CPU可以控制和使用“远程”的FPGA。换句话说，如果CPU不需要服务器内的FPGA进行硬件加速，闲置的FPGA可以组成资源池，供有需要的CPU调用，这就打破了FPGA部署的地域限制。值得注意的是，为了实现FPGA的远程使用，需要定义和实现新的通信协议。微软在这里提出了名为LTL（Lightweight
    Transport Layer）的协议，我们接下来会讲到。在这个阶段的工作中，微软在自家数据中心的5670个服务器里部署了新一代的FPGA加速卡，在地域范围上遍布全球五大洲的15个国家，这也使得微软一跃成为了世界上最大的FPGA客户之一。


    第三代Catapult FPGA架构延续了前一代的Shell & Role结构，并增加了一些新的功能，如图2-13所示。首先，增加了40Gbps网络数据处理流水线，包括两个40Gbps
    MAC/PHY以及数据包处理逻辑。另外，使用FPGA上的硬件逻辑实现了前文提到的LTL协议，用来完成FPGA之间的通信。


    第三，引入了名为Elastic Router的模块，主要用来控制多个用户可配置区域（Role）与外界网络的通信。为了实现对池化FPGA资源的统一管理和分配，微软还提出了一种硬件即服务（Hardware
    as a Service，HaaS）的使用模型，这个模型也成为了FPGA虚拟化的代表性技术之一。


    至此，Catapult项目的第三代FPGA加速卡被正式部署在微软的Azure云数据中心，并对必应搜索引擎的页面排序算法进行了FPGA加速。对于给定的延时要求，相比于深度优化后的软件实现（实线），FPGA（虚线）可以轻松达到2.25倍的吞吐量提升，如图2-14所示。


    ![](OEBPS/Images/Figure-P82_975.jpg)


    图2-13　Catapult第三代FPGA架构


    ![](OEBPS/Images/Figure-P82_979.jpg)


    图2-14　Catapult第三代取得的性能提升


    同时，微软还对比测试了使用远程FPGA获得的结果，如图2-15所示。可以看到，使用远程FPGA（Remote FPGA）与使用本地FPGA（虚线所示）相比，并没有明显的性能差异。这证明了LTL协议与HaaS使用模型的有效性。


    ![](OEBPS/Images/Figure-P83_986.jpg)


    图2-15　Catapult第三阶段远程FPGA与本地FPGA的性能对比


    Catapult第三阶段的工作很好地解决了FPGA在大型数据中心里部署的灵活性和扩展性问题，为今后FPGA的大规模部署打下了坚实的基础。在2017年，微软推出了一款基于FPGA的深度学习加速平台，名为“脑波（Brainwave）”项目。脑波项目代表着FPGA在数据中心里的应用正式扩展到人工智能领域。关于脑波项目的具体内容，我们将在下一章详细探讨。


    #### 2.1.5　微软Catapult项目小结


    微软的Catapult项目可以称作是FPGA在大型商业数据中心里进行大规模部署和使用的开山之作，直至目前仍然是这个领域最具代表性的工作之一。与学术界的相关研究有所不同的是，Catapult兼顾了学术创新和工程的实用性，这对于业界其他的公司更具有直接的借鉴意义。另外，在结果方面，微软使用了自家已经深度优化的纯软件方案作为对比，使得FPGA取得的显著性能提升有着更高的可信度和说服力。


    有趣的是，除了项目初期的原型验证外，微软均采用了英特尔（原Altera）的FPGA芯片，微软也一跃成为英特尔FPGA的最大客户之一。有人曾断言，那些年叱咤风云的“Wintel”联盟，在后PC时代终将土崩瓦解。然而，在风起云涌的大数据时代，伴随着两家公司的一步步华丽转型，Wintel组合正通过FPGA再一次获得新生。


    ## 2.2　FPGA即服务（FPGA as a Service）


    对于微软的Catapult项目来说，它产生的背景更多的是伴随着自身数据中心发展和扩张，传统的数据中心软硬件架构已经无法满足不断增长的性能和功耗需求，因此要寻找能出色平衡性能、功耗、成本、灵活性等多个方面的硬件加速器，以应对人工智能与大数据时代的全新应用场景和业务模式。在这里，FPGA的主要客户是微软内部的各个部门，例如必应搜索以及之后的深度学习团队等。事实上，FPGA进入数据中心的方式并非只有这一种，以亚马逊为代表的云服务提供商就拓展了另外一种模式，名为“FPGA即服务（FPGA
    as a Service，FaaS）”。


    ### 2.2.1　亚马逊AWS-F1实例：FPGA云服务的首次尝试


    与Catapult项目在微软的私有云中“自产自销”的使用模式不同，FaaS的主要特点是将FPGA作为公有云基础设施的一部分，向用户提供基于FPGA的云服务。首创这一使用模式的，则是亚马逊的云服务部门AWS（Amazon
    Web Services）。事实上，FPGA并非亚马逊在云服务里采用的首个硬件加速器。在此之前，AWS已经推出了基于GPU的P2实例。每个P2实例集成了高达16个英伟达GK210系列GPU，能够提供70TFLOPS的单精度浮点运算能力，以及超过23TFLOPS的双精度浮点运算能力，主要用来进行深度神经网络的训练加速，以及其他包括工程模拟、大数据分析与建模等应用。


    在2017年的HotChips大会上，AWS做了名为*FPGA Accelerated* *Computing* *Using* *AWS* *F*1 *Instances*的大会报告，正式公布了旗下首个基于FPGA的云计算加速实例AWS-F1。这标志着FPGA进入了公有云数据中心，并且和GPU一样作为公有云的硬件加速服务推向市场，供广大云计算开发者使用。


    在构建和提供FPGA云服务时，FPGA开发的便利程度和易用性至关重要。对于像微软这样的FPGA大客户，FPGA厂商必定会使出浑身解数努力争取，包括公司高层专门关注项目进展，组织强大的开发团队帮助FPGA的开发，有专门的工程师对出现的各种问题提供技术支持，同时也有庞大的市场和销售队伍进行沟通和配合。


    然而，与FPGA在私有云中的应用不同，在AWS-F1实例中FPGA的主要用户是公有云的广大开发者。他们很可能并没有足够的研发实力和深厚的资本，与FPGA厂家也并没有紧密的合作关系，很多时候都无法获得来自厂商的直接技术支持。因此，这就需要在FPGA云服务里提供完整的开发、调试、部署、维护的基础设施架构，并兼顾FPGA开发和使用时的便利性。正如各类软件开发社区那样，通过构建一个由FPGA开发者组成的活跃社区，可以起到群策群力，互相取长补短的效果。


    具体到这个云端FPGA的开发平台来说，它至少需要满足以下两点要求：一方面，平台需要将底层FPGA的逻辑资源抽象化，使用户不用花太多精力去考虑常用IP和接口的实现细节；另一方面，平台需要提供完整的FPGA软硬件开发工具，以便在云端实现全部的FPGA开发流程。


    综上，可以总结出AWS使用FPGA作为计算加速服务的主要意义，具体有以下四点：


    （1）将FPGA作为标准的AWS实例，提供给广大的开发人员社区和AWS数以百万计的终端用户。


    （2）通过提供基于云端的标准化FPGA开发工具，简化整个FPGA的开发流程。


    （3）通过使用统一定义的FPGA逻辑接口，抽象FPGA的物理接口，从而使得开发者专注于自己的算法设计和实现。


    （4）为各种FPGA设计和IP提供一个统一的应用市场和交易平台，为所有AWS用户提供更多的选择和更加方便的使用。


    ### 2.2.2　AWS FPGA云服务的技术概述


    AWS-F1的系统架构框图如图2-16所示。可以看到，在一个完整的F1实例中，除了FPGA之外还有两个主要的组成部分：AMI和AFI。AMI全称为Amazon
    Machine Image，本质为操作系统的映像，同时包含了全套FPGA软硬件开发和仿真调试工具。AFI全称为Amazon FPGA Image，它的本质是FPGA的比特流配置文件，也称作FPGA的映像文件，它将被用来直接烧录到F1实例的FPGA上运行。AFI可以由AWS提供，或由第三方用户开发完成。同时，本实例最终生成的比特流配置文件也称为AFI，它将直接烧录到F1实例的FPGA上运行。


    ![](OEBPS/Images/Figure-P86_1025.jpg)


    图2-16　AWS-F1实例示意图


    F1实例目前采用了赛灵思公司的16nm UltraScale+FPGA器件，每个实例有两种模式，可以包含1个或8个FPGA器件，分别支持4×16GB和32×16GB的DDR4内存，以及10Gbps和25Gbps的网络通信带宽。


    F1实例也提供了一个FPGA的底层逻辑设计，这个结构类似于微软Catapult项目里的Shell & Role结构，即将FPGA划分成I/O接口和用户可编程逻辑两个部分。这样用户只需专注于自身的算法和应用开发，而无须关心太多外部通信逻辑的实现细节。


    F1实例的开发流程与普通的FPGA开发并无本质区别，开发者使用Vivado工具进行综合、布局布线、时序优化以及仿真调试等步骤，只不过这些步骤都需要借助AWS提供的AMI环境完成。开发完成后，生成的FPGA映像文件（AFI）可以直接下载到FPGA上运行，同时也可以放到AWS的应用市场供其他开发者使用。目前，很多FPGA初创公司都在AWS应用市场发布了自己的AFI，例如我国的深鉴科技（目前已被赛灵思收购）的语音识别引擎，英国Maxeler公司的金融计算加速应用，美国Falcon
    Computing公司的基因检测加速引擎，以及加拿大LegUp公司的网络功能加速应用等。国外的很多高校，如加利福尼亚大学洛杉矶分校（University of
    Culifornia，Los Angeles，UCLA）等，也将AWS-F1实例作为FPGA设计课程和实验的主要平台。这也省去了每个学校单独搭建FPGA实验设施的烦琐过程，而且还能充分利用最先进的FPGA开发工具、器件和流程，让学生专注于创新设计本身。


    ### 2.2.3　其他公有云提供商的FPGA加速服务


    亚马逊AWS为FPGA的数据中心应用提供了一个全新的应用模式：FPGA即服务，这使得广大公有云的用户和开发者可以相对方便地使用和开发FPGA，也为FPGA开发者提供了一个完善的FPGA应用市场，供大家互通有无。


    与此同时，国内的很多云服务提供商也开始积极布局公有云的FPGA服务。例如，阿里云至今发布了三款基于FPGA的云计算加速实例，其中2018年发布的FPGA计算实例F3搭载了赛灵思的Virtex
    UltraScale+FPGA器件，而之前发布的F1则使用了英特尔的FPGA器件和开发套件。腾讯云也推出了基于赛灵思Kintex UltraScale FPGA的云服务，并将今后推出基于英特尔FPGA的计算实例。华为云也有基于赛灵思器件的FPGA加速云服务器，其正在被推向市场。


    可以说，目前国内的互联网巨头企业都纷纷进入FPGA云服务领域。随着竞争的不断升级，作为使用者的我们肯定会不断享受到技术进步带来的红利，这也会不断促进FPGA技术的发展和整体生态环境的完善。同时，如何进一步差异化竞争，像微软和亚马逊一样走出一条与众不同的技术道路，会是各家公司以及一众初创公司将要努力思考的问题。


    ## 2.3　下一代电信网络：SDN、NFV与FPGA


    除了像微软Azure和亚马逊AWS这样的云数据中心之外，电信网络提供商也在使用FPGA对自身数据中心的网络架构进行转型。这个转型背后的主要推动力，就是当前正在蓬勃发展的网络功能虚拟化（Network
    Function Virtualization，NFV）和软件定义网络（Software Defined Network，SDN）这两项技术。


    ### 2.3.1　网络功能虚拟化（NFV）与软件定义网络（SDN）的意义


    据预测，五年后全球的网络流量将较今日增长超过3倍。在万物互连的今天，尤其是5G、物联网、自动驾驶等技术已经成为各大科技公司争夺的焦点之时，各种设备和服务都需要电信网络及其数据中心进行处理和支持。然而，电信基础架构和数据中心按传统的方法很难进行有效的扩展，其主要原因有硬件和软件两个方面的考量。


    在硬件层面，传统电信网络基础架构使用的是各类专用硬件设备，例如各种接入设备、交换机、路由器、防火墙、QoS等。虽然这些专用设备能提供高性能和高稳定性，但随着数据规模的快速增长，使用专用设备所带来的问题也随之浮上水面，例如不同设备之间的兼容性差，维护升级困难，供应商垄断资源从而大幅提高成本，若需要加入新功能则要开发新硬件设备等。


    在软件层面，不同设备都需要各自对应的软件进行配置和控制。对于来自不同供应商和规格的设备，还需要对这些不同的软件和配置方法进行整合，因此，使用这样的方法难以在系统层面进行大范围统一部署和配置。另一方面，如果某些网络功能通过纯软件的方法实现，则传统的实现方法也有着诸多问题，例如对服务器的有效利用率很低，且无法进行服务的动态迁移等。


    因此，虚拟化技术，特别是网络功能虚拟化（NFV）技术，逐渐成为各大运营商解决上述问题的有效途径。NFV出现的最直接的动因之一，就是为了支持指数级的带宽增长。在NFV领域，欧洲电信标准协会（ETSI）做了大量的标准化工作，它发布的NFV概念示意图如图2-17所示。


    可以看到，和传统方法相比，NFV利用了通用的服务器、通用的存储设备，以及通用的高速以太网交换机，以实现传统电信网络基础架构中的各种网络功能。具体而言，就是将网络功能在通用服务器中用软件实现，数据使用通用的存储设备存储，网络流量通过通用的网卡和高速交换机进行转发。这样理论上能很好地解决上述硬件层面的问题：使用通用设备而非专用设备，提高了数据中心的弹性扩展能力。在成本上，不会受某个供应商的制约，反而会通过开放竞争减少硬件采购和部署的成本。


    ![](OEBPS/Images/Figure-P90_1059.jpg)


    图2-17　NFV概念示意图


    另外，借助虚拟化技术，将网络功能在不同虚拟机中实现，这样在理论上就能解决软件层面的问题：即某个特定应用不会占用服务器的全部资源；反之，一个服务器可以同时运行多个虚拟机或网络服务。同时，虚拟机在数据中心的扩展和迁移也更加方便，不会造成服务下线或中断。


    NFV和软件定义网络（SDN）经常一起出现。它们的核心思想就是将网络的控制面和转发面进行分离。这样，所有的数据转发面设备都可以同时被控制、配置、管理，从而避免了系统管理员需要分别配置每个网络设备的低效情形。


    2016年，中国电信宣布将启动为期十年的网络智能化重构，并发布了《中国电信CTNet2025网络架构白皮书》。在这部白皮书中写道：


    “从更好地适应互联网应用的角度出发，未来网络架构必须要求网络能力接口的开放和标准化，通过软件定义网络技术，能够实现面向业务提供网络资源和能力的调度和定制化，同时为进一步加速网络能力的平台化，还需要提供网络可编程的能力，真正实现网络业务的深度开放。”

    '
  trans: '


    第二，对于相同的吞吐量要求，采用 FPGA 加速后系统延时会下降 29%。由此可见，FPGA 大幅提升了系统的整体性能。此外，每个 FPGA 带来的额外功耗小于
    25W，系统的总功耗增加了不到 10%，且总体成本的增加不超过 30%。在稳定性方面，只有在部署初期发现了 7 块 FPGA 板卡发生了硬件故障，占总板卡数量的
    0.4%。在之后几个月的运行中，所有板卡和服务器都稳定运转，这也足以证明 FPGA 系统的稳定性。


    ![](img/Figure-P78_953.jpg)


    图 2-10　Catapult 项目取得的性能提升


    ### 第三阶段


    在 Catapult 项目的第二阶段中，采用了 FPGA 对必应搜索引擎的文档排名算法进行了硬件加速，取得了 2 倍于纯软件方案的性能提升。但是，这个方案仍有一些突出的缺点和问题需要进一步改进。其中最主要的问题在于，为了实现
    FPGA 之间的低延时通信，第二阶段的 Catapult 方案引入了一个 6×8 的二维 Torus 网络。相比于数据中心网络常见的 TOR 交换机直连 CPU
    的结构，这个 Torus 网络相当于额外增加了一个二层网络，而这会在扩展性和同构性方面带来了诸多问题。


    例如，在这个新引入的 Torus 网络拓扑里，FPGA 的互连需要通过两类特殊定制的线缆，如图 2-11 所示。其中，左边的线缆连接 8 个 FPGA，右边的线缆连接
    6 个 FPGA。这种连接方式不但成本高昂，而且需要知道机柜里 FPGA 的确切物理位置，以实现正确的拓扑连接。这非常不利于系统的扩容和维护。


    ![](img/Figure-P79_961.jpg)


    图 2-11　FPGA 互连网络的连线方式与线缆（图片来自微软）


    在 Torus 网络内，有共计 48 个 FPGA。虽然它们彼此通信时具有很高的速度，但如果不同的 Torus 网络里的 FPGA 需要相互通信，则需要复杂的路由，并随之带来相当大的通信延时和性能损失。这对于某些应用来说是不可接受的。


    还应注意的是，这个方案中的 FPGA 只能用来作为特定应用的硬件加速器。对于数据中心的常用网络功能，如数据包加解密、流量控制、虚拟化等基础设施结构和应用来说，FPGA
    并没有任何帮助和补强的作用。


    为了解决上述问题，微软在 2016 年发表了 Catapult 项目第三阶段的工作。这个阶段最主要的贡献，就是取消了 FPGA 互连的第二级网络，并直接将
    FPGA 与数据中心网络进行连接，如图 2-12 所示。


    ![](img/Figure-P80_967.jpg)


    图 2-12　Catapult 第三阶段的 FPGA 加速卡和系统框图


    可以看到，新一代的 FPGA 加速卡仍然采用了英特尔的 Stratix V 系列 FPGA，板卡上的网络接口升级为两个 40Gbps 的 QSFP 端口。FPGA
    加速卡位于服务器和数据中心网络之间，一个网口连接 TOR 交换机，另外一个网口与服务器的网卡相连。和上一个版本相同，CPU 可以通过 PCIe Gen3×8
    总线访问 FPGA，并使用 FPGA 为各类计算任务进行硬件加速运算。除此之外，新版本的硬件布局还带来了以下几点好处：


    第一，可以使用 FPGA 加速数据中心的各类网络功能和存储功能。在这个版本的硬件设计中，FPGA 直接通过网络接口与数据中心网络相连，而不需要经过原来的第二层
    Torus 网络，这样极大地扩展了系统的灵活性。例如，FPGA 可以作为智能网卡的处理单元，用来卸载原本在 CPU 上实现的很多数据中心网络功能，例如前文提到的数据加解密、流量控制、服务质量控制等。这样一来，很多网络流量可以直接在
    FPGA 里进行处理，而无须再消耗 CPU 的计算资源。这样做的好处是一方面提高了网络流量的处理速度和效率，另一方面释放了宝贵的 CPU 内核资源，这些被释放的
    CPU 资源可以再进行其他任务的部署，或者用来实现其他的用户应用。


    第二，新版本 Catapult 板卡的优点是，FPGA 不再与 CPU 在地理位置上紧密耦合。在这个版本中，FPGA 之间可以通过网络进行互连和通信，这使得
    CPU 可以控制和使用“远程”的 FPGA。换句话说，如果 CPU 不需要服务器内的 FPGA 进行硬件加速，闲置的 FPGA 可以组成资源池，供有需要的
    CPU 调用，这就打破了 FPGA 部署的地域限制。值得注意的是，为了实现 FPGA 的远程使用，需要定义和实现新的通信协议。微软在这里提出了名为 LTL（Lightweight
    Transport Layer）的协议，我们接下来会讲到。在这个阶段的工作中，微软在自家数据中心的 5670 个服务器里部署了新一代的 FPGA 加速卡，在地域范围上遍布全球五大洲的
    15 个国家，这也使得微软一跃成为了世界上最大的 FPGA 客户之一。


    第三代 Catapult FPGA 架构延续了前一代的 Shell & Role 结构，并增加了一些新的功能，如图 2-13 所示。首先，增加了 40Gbps
    网络数据处理流水线，包括两个 40Gbps MAC/PHY 以及数据包处理逻辑。另外，使用 FPGA 上的硬件逻辑实现了前文提到的 LTL 协议，用来完成
    FPGA 之间的通信。


    第三，引入了名为 Elastic Router 的模块，主要用来控制多个用户可配置区域（Role）与外界网络的通信。为了实现对池化 FPGA 资源的统一管理和分配，微软还提出了一种硬件即服务（Hardware
    as a Service，HaaS）的使用模型，这个模型也成为了 FPGA 虚拟化的代表性技术之一。


    至此，Catapult 项目的第三代 FPGA 加速卡被正式部署在微软的 Azure 云数据中心，并对必应搜索引擎的页面排序算法进行了 FPGA 加速。对于给定的延时要求，相比于深度优化后的软件实现（实线），FPGA（虚线）可以轻松达到
    2.25 倍的吞吐量提升，如图 2-14 所示。


    ![](img/Figure-P82_975.jpg)


    图 2-13　Catapult 第三代 FPGA 架构


    ![](img/Figure-P82_979.jpg)


    图 2-14　Catapult 第三代取得的性能提升


    同时，微软还对比测试了使用远程 FPGA 获得的结果，如图 2-15 所示。可以看到，使用远程 FPGA（Remote FPGA）与使用本地 FPGA（虚线所示）相比，并没有明显的性能差异。这证明了
    LTL 协议与 HaaS 使用模型的有效性。


    ![](img/Figure-P83_986.jpg)


    图 2-15　Catapult 第三阶段远程 FPGA 与本地 FPGA 的性能对比


    Catapult 第三阶段的工作很好地解决了 FPGA 在大型数据中心里部署的灵活性和扩展性问题，为今后 FPGA 的大规模部署打下了坚实的基础。在 2017
    年，微软推出了一款基于 FPGA 的深度学习加速平台，名为“脑波（Brainwave）”项目。脑波项目代表着 FPGA 在数据中心里的应用正式扩展到人工智能领域。关于脑波项目的具体内容，我们将在下一章详细探讨。


    #### 2.1.5　微软 Catapult 项目小结


    微软的 Catapult 项目可以称作是 FPGA 在大型商业数据中心里进行大规模部署和使用的开山之作，直至目前仍然是这个领域最具代表性的工作之一。与学术界的相关研究有所不同的是，Catapult
    兼顾了学术创新和工程的实用性，这对于业界其他的公司更具有直接的借鉴意义。另外，在结果方面，微软使用了自家已经深度优化的纯软件方案作为对比，使得 FPGA 取得的显著性能提升有着更高的可信度和说服力。


    有趣的是，除了项目初期的原型验证外，微软均采用了英特尔（原 Altera）的 FPGA 芯片，微软也一跃成为英特尔 FPGA 的最大客户之一。有人曾断言，那些年叱咤风云的“Wintel”联盟，在后
    PC 时代终将土崩瓦解。然而，在风起云涌的大数据时代，伴随着两家公司的一步步华丽转型，Wintel 组合正通过 FPGA 再一次获得新生。


    ## 2.2　FPGA 即服务（FPGA as a Service）


    对于微软的 Catapult 项目来说，它产生的背景更多的是伴随着自身数据中心发展和扩张，传统的数据中心软硬件架构已经无法满足不断增长的性能和功耗需求，因此要寻找能出色平衡性能、功耗、成本、灵活性等多个方面的硬件加速器，以应对人工智能与大数据时代的全新应用场景和业务模式。在这里，FPGA
    的主要客户是微软内部的各个部门，例如必应搜索以及之后的深度学习团队等。事实上，FPGA 进入数据中心的方式并非只有这一种，以亚马逊为代表的云服务提供商就拓展了另外一种模式，名为“FPGA
    即服务（FPGA as a Service，FaaS）”。


    ### 2.2.1　亚马逊 AWS-F1 实例：FPGA 云服务的首次尝试


    与 Catapult 项目在微软的私有云中“自产自销”的使用模式不同，FaaS 的主要特点是将 FPGA 作为公有云基础设施的一部分，向用户提供基于 FPGA
    的云服务。首创这一使用模式的，则是亚马逊的云服务部门 AWS（Amazon Web Services）。事实上，FPGA 并非亚马逊在云服务里采用的首个硬件加速器。在此之前，AWS
    已经推出了基于 GPU 的 P2 实例。每个 P2 实例集成了高达 16 个英伟达 GK210 系列 GPU，能够提供 70TFLOPS 的单精度浮点运算能力，以及超过
    23TFLOPS 的双精度浮点运算能力，主要用来进行深度神经网络的训练加速，以及其他包括工程模拟、大数据分析与建模等应用。


    在 2017 年的 HotChips 大会上，AWS 做了名为*FPGA Accelerated* *Computing* *Using* *AWS* *F*1
    *Instances*的大会报告，正式公布了旗下首个基于 FPGA 的云计算加速实例 AWS-F1。这标志着 FPGA 进入了公有云数据中心，并且和 GPU
    一样作为公有云的硬件加速服务推向市场，供广大云计算开发者使用。


    在构建和提供 FPGA 云服务时，FPGA 开发的便利程度和易用性至关重要。对于像微软这样的 FPGA 大客户，FPGA 厂商必定会使出浑身解数努力争取，包括公司高层专门关注项目进展，组织强大的开发团队帮助
    FPGA 的开发，有专门的工程师对出现的各种问题提供技术支持，同时也有庞大的市场和销售队伍进行沟通和配合。


    然而，与 FPGA 在私有云中的应用不同，在 AWS-F1 实例中 FPGA 的主要用户是公有云的广大开发者。他们很可能并没有足够的研发实力和深厚的资本，与
    FPGA 厂家也并没有紧密的合作关系，很多时候都无法获得来自厂商的直接技术支持。因此，这就需要在 FPGA 云服务里提供完整的开发、调试、部署、维护的基础设施架构，并兼顾
    FPGA 开发和使用时的便利性。正如各类软件开发社区那样，通过构建一个由 FPGA 开发者组成的活跃社区，可以起到群策群力，互相取长补短的效果。


    具体到这个云端 FPGA 的开发平台来说，它至少需要满足以下两点要求：一方面，平台需要将底层 FPGA 的逻辑资源抽象化，使用户不用花太多精力去考虑常用 IP
    和接口的实现细节；另一方面，平台需要提供完整的 FPGA 软硬件开发工具，以便在云端实现全部的 FPGA 开发流程。


    综上，可以总结出 AWS 使用 FPGA 作为计算加速服务的主要意义，具体有以下四点：


    （1）将 FPGA 作为标准的 AWS 实例，提供给广大的开发人员社区和 AWS 数以百万计的终端用户。


    （2）通过提供基于云端的标准化 FPGA 开发工具，简化整个 FPGA 的开发流程。


    （3）通过使用统一定义的 FPGA 逻辑接口，抽象 FPGA 的物理接口，从而使得开发者专注于自己的算法设计和实现。


    （4）为各种 FPGA 设计和 IP 提供一个统一的应用市场和交易平台，为所有 AWS 用户提供更多的选择和更加方便的使用。


    ### 2.2.2　AWS FPGA 云服务的技术概述


    AWS-F1 的系统架构框图如图 2-16 所示。可以看到，在一个完整的 F1 实例中，除了 FPGA 之外还有两个主要的组成部分：AMI 和 AFI。AMI
    全称为 Amazon Machine Image，本质为操作系统的映像，同时包含了全套 FPGA 软硬件开发和仿真调试工具。AFI 全称为 Amazon FPGA
    Image，它的本质是 FPGA 的比特流配置文件，也称作 FPGA 的映像文件，它将被用来直接烧录到 F1 实例的 FPGA 上运行。AFI 可以由 AWS
    提供，或由第三方用户开发完成。同时，本实例最终生成的比特流配置文件也称为 AFI，它将直接烧录到 F1 实例的 FPGA 上运行。


    ![](img/Figure-P86_1025.jpg)


    图 2-16　AWS-F1 实例示意图


    F1 实例目前采用了赛灵思公司的 16nm UltraScale+FPGA 器件，每个实例有两种模式，可以包含 1 个或 8 个 FPGA 器件，分别支持
    4×16GB 和 32×16GB 的 DDR4 内存，以及 10Gbps 和 25Gbps 的网络通信带宽。


    F1 实例也提供了一个 FPGA 的底层逻辑设计，这个结构类似于微软 Catapult 项目里的 Shell & Role 结构，即将 FPGA 划分成 I/O
    接口和用户可编程逻辑两个部分。这样用户只需专注于自身的算法和应用开发，而无须关心太多外部通信逻辑的实现细节。


    F1 实例的开发流程与普通的 FPGA 开发并无本质区别，开发者使用 Vivado 工具进行综合、布局布线、时序优化以及仿真调试等步骤，只不过这些步骤都需要借助
    AWS 提供的 AMI 环境完成。开发完成后，生成的 FPGA 映像文件（AFI）可以直接下载到 FPGA 上运行，同时也可以放到 AWS 的应用市场供其他开发者使用。目前，很多
    FPGA 初创公司都在 AWS 应用市场发布了自己的 AFI，例如我国的深鉴科技（目前已被赛灵思收购）的语音识别引擎，英国 Maxeler 公司的金融计算加速应用，美国
    Falcon Computing 公司的基因检测加速引擎，以及加拿大 LegUp 公司的网络功能加速应用等。国外的很多高校，如加利福尼亚大学洛杉矶分校（University
    of Culifornia，Los Angeles，UCLA）等，也将 AWS-F1 实例作为 FPGA 设计课程和实验的主要平台。这也省去了每个学校单独搭建
    FPGA 实验设施的烦琐过程，而且还能充分利用最先进的 FPGA 开发工具、器件和流程，让学生专注于创新设计本身。


    ### 2.2.3　其他公有云提供商的 FPGA 加速服务


    亚马逊 AWS 为 FPGA 的数据中心应用提供了一个全新的应用模式：FPGA 即服务，这使得广大公有云的用户和开发者可以相对方便地使用和开发 FPGA，也为
    FPGA 开发者提供了一个完善的 FPGA 应用市场，供大家互通有无。


    与此同时，国内的很多云服务提供商也开始积极布局公有云的 FPGA 服务。例如，阿里云至今发布了三款基于 FPGA 的云计算加速实例，其中 2018 年发布的
    FPGA 计算实例 F3 搭载了赛灵思的 Virtex UltraScale+FPGA 器件，而之前发布的 F1 则使用了英特尔的 FPGA 器件和开发套件。腾讯云也推出了基于赛灵思
    Kintex UltraScale FPGA 的云服务，并将今后推出基于英特尔 FPGA 的计算实例。华为云也有基于赛灵思器件的 FPGA 加速云服务器，其正在被推向市场。


    可以说，目前国内的互联网巨头企业都纷纷进入 FPGA 云服务领域。随着竞争的不断升级，作为使用者的我们肯定会不断享受到技术进步带来的红利，这也会不断促进 FPGA
    技术的发展和整体生态环境的完善。同时，如何进一步差异化竞争，像微软和亚马逊一样走出一条与众不同的技术道路，会是各家公司以及一众初创公司将要努力思考的问题。


    ## 2.3　下一代电信网络：SDN、NFV 与 FPGA


    除了像微软 Azure 和亚马逊 AWS 这样的云数据中心之外，电信网络提供商也在使用 FPGA 对自身数据中心的网络架构进行转型。这个转型背后的主要推动力，就是当前正在蓬勃发展的网络功能虚拟化（Network
    Function Virtualization，NFV）和软件定义网络（Software Defined Network，SDN）这两项技术。


    ### 2.3.1　网络功能虚拟化（NFV）与软件定义网络（SDN）的意义


    据预测，五年后全球的网络流量将较今日增长超过 3 倍。在万物互连的今天，尤其是 5G、物联网、自动驾驶等技术已经成为各大科技公司争夺的焦点之时，各种设备和服务都需要电信网络及其数据中心进行处理和支持。然而，电信基础架构和数据中心按传统的方法很难进行有效的扩展，其主要原因有硬件和软件两个方面的考量。


    在硬件层面，传统电信网络基础架构使用的是各类专用硬件设备，例如各种接入设备、交换机、路由器、防火墙、QoS 等。虽然这些专用设备能提供高性能和高稳定性，但随着数据规模的快速增长，使用专用设备所带来的问题也随之浮上水面，例如不同设备之间的兼容性差，维护升级困难，供应商垄断资源从而大幅提高成本，若需要加入新功能则要开发新硬件设备等。


    在软件层面，不同设备都需要各自对应的软件进行配置和控制。对于来自不同供应商和规格的设备，还需要对这些不同的软件和配置方法进行整合，因此，使用这样的方法难以在系统层面进行大范围统一部署和配置。另一方面，如果某些网络功能通过纯软件的方法实现，则传统的实现方法也有着诸多问题，例如对服务器的有效利用率很低，且无法进行服务的动态迁移等。


    因此，虚拟化技术，特别是网络功能虚拟化（NFV）技术，逐渐成为各大运营商解决上述问题的有效途径。NFV 出现的最直接的动因之一，就是为了支持指数级的带宽增长。在
    NFV 领域，欧洲电信标准协会（ETSI）做了大量的标准化工作，它发布的 NFV 概念示意图如图 2-17 所示。


    可以看到，和传统方法相比，NFV 利用了通用的服务器、通用的存储设备，以及通用的高速以太网交换机，以实现传统电信网络基础架构中的各种网络功能。具体而言，就是将网络功能在通用服务器中用软件实现，数据使用通用的存储设备存储，网络流量通过通用的网卡和高速交换机进行转发。这样理论上能很好地解决上述硬件层面的问题：使用通用设备而非专用设备，提高了数据中心的弹性扩展能力。在成本上，不会受某个供应商的制约，反而会通过开放竞争减少硬件采购和部署的成本。


    ![](img/Figure-P90_1059.jpg)


    图 2-17　NFV 概念示意图


    另外，借助虚拟化技术，将网络功能在不同虚拟机中实现，这样在理论上就能解决软件层面的问题：即某个特定应用不会占用服务器的全部资源；反之，一个服务器可以同时运行多个虚拟机或网络服务。同时，虚拟机在数据中心的扩展和迁移也更加方便，不会造成服务下线或中断。


    NFV 和软件定义网络（SDN）经常一起出现。它们的核心思想就是将网络的控制面和转发面进行分离。这样，所有的数据转发面设备都可以同时被控制、配置、管理，从而避免了系统管理员需要分别配置每个网络设备的低效情形。


    2016 年，中国电信宣布将启动为期十年的网络智能化重构，并发布了《中国电信 CTNet2025 网络架构白皮书》。在这部白皮书中写道：


    “从更好地适应互联网应用的角度出发，未来网络架构必须要求网络能力接口的开放和标准化，通过软件定义网络技术，能够实现面向业务提供网络资源和能力的调度和定制化，同时为进一步加速网络能力的平台化，还需要提供网络可编程的能力，真正实现网络业务的深度开放。”


    '
