    ### 4.2.3 高层次综合工具常用的优化方法


    高层次综合工具需要统筹考虑各种电路设计的主要指标，如性能、功耗、面积等，同时也要兼顾工具本身的性能，例如占用的资源和运行时间等。因此，在开发`HLS`工具时，要额外考虑和采用更多的优化方法，而这些优化方法也是当今学术界和工业界在`HLS`领域重点研究的方向。总的来说，`HLS`工具的主流优化方法有以下几种。


    第一，字长分析和优化。`FPGA`的一个最主要特点就是可以使用任意字长的数据通路和运算。因此，`FPGA`的`HLS`工具不需要拘泥于某种固定长度（如常见的32位或64位）的表达方式，而可以对设计进行全局或局部的字长优化，从而达到性能提升和面积缩减的双重效果。然而，字长分析和优化需要`HLS`的使用者对目标算法和数据集有深入的了解，这也是限制这种优化方式广泛使用的主要因素之一。


    第二，循环优化。这种优化方法的主要目的，是把高层软件中原本顺序执行的循环语句，有效映射到硬件结构中，实现并行执行。循环优化的最终目标，就是尽量将循环里两次相邻的操作以最小的时延实现。理想情况下，相邻的循环操作可以完全并行执行，然而，由于硬件资源的限制，以及更多的是循环间存在嵌套和依赖关系，很难将循环完全展开。因此，如何优化各种循环，以实现最优的硬件结构，就成为了学术界和工业界最为关心的要点。


    循环优化一直是`HLS`优化方法研究的重中之重。当前，一个比较流行的循环优化方法，就是所谓的多面体模型，即`Polyhedral Model`。多面体模型的应用非常广泛，在`HLS`里主要被用来将循环语句以空间多面体表示（见图4-2），然后根据边界约束和依赖关系，通过几何操作进行语句调度，从而实现循环的变换。


    ![](OEBPS/Images/Figure-P154_1615.jpg)


    图4-2　多面体模型建模示例


    关于多面体模型的细节，由于篇幅所限在本书不再展开。需要指出的是，多面体模型在`FPGA`的`HLS`研究里已经取得了相当的成功，很多研究均证明多面体模型可以帮助实现性能和面积的优化，同时也能帮助提升`FPGA`片上内存的使用效率。


    `HLS`工具的第三种优化方式，就是对软件并行性的支持。高层语言`C/C++`与`RTL`相比，前者编写的程序被设计用来在处理器上顺序执行，而后者可以通过直接例化多个运算单元，实现任务的并行处理。随着处理器对并行性的逐步支持，以及如`GPU`等非处理器芯片的兴起，`C/C++`也开始逐渐引入对并行性的支持。例如，出现了`pthreads`和`OpenMP`等多线程并行编程方法，以及`OpenCL`等针对`GPU`等异构系统进行并行编程的`C`语言扩展。因此作为`HLS`工具，势必要增加对这些软件并行性的支持。例如，多伦多大学提出的`LegUp`工具就整合了对`pthreads`和`OpenMP`的支持，从而可以实现任务和数据层面的并行性。


    ### 4.2.4 高层次综合的发展前景

    '
  trans: '


    例如，`FPGA`的架构正在集成越来越多`AI`相关的硬件资源。如前文提到的，传统的`FPGA`片上`DSP`结构已经从单纯支持固定字长的定点数计算，扩展到支持多种精度的浮点数，以及可变精度的定点数等，可以根据具体需要进行灵活的配置。此外，`AI`专用的加速引擎也被逐渐集成到`FPGA`和`ACAP`器件中。可以预见的是，会有更多专门针对`AI`加速的`FPGA`架构创新涌现出来，例如对矩阵运算和乘加运算的进一步支持，对访存的进一步优化，使用片上网络等方式对数据传输的吞吐量做进一步提升等。这些针对`AI`应用的`FPGA`架构革新，也是学术界和工业界研究的热点。


    除了将`AI`加速单元以`IP`的形式集成到`FPGA`中，还可以将`AI`处理子系统与`FPGA`进行异构集成。例如，可以通过`EMIB`或芯片组桥接的方式，将`FPGA`和不同的`AI`加速芯片互连，并完成系统级整合，形成多芯片封装（`Multi-Chip
    Package`，`MCP`）的半导体器件。这样的异构系统可以将`FPGA`与`ASIC`的优势进行互补，并进一步提升系统性能，降低功耗和延时。此外，随着`FPGA`异构芯片的能效不断提升，将其用于`DNN`训练领域也会是一个重要的发展方向。


    再好的芯片也离不开工具易用性的支持。相比`CPU`和`GPU`，`FPGA`开发难度大、调试困难、学习曲线陡峭一直都是制约其大范围推广的最重要原因。在人工智能领域，让软件工程师或算法专家学习并掌握高性能的`FPGA`开发方法是不现实的。因此，如何提高`FPGA`的易用性和开发效率，如何采用高层次语言对`FPGA`进行编程，如何对现有的人工智能`IP`进行封装和复用等，将是学术界和业界共同关注的热点问题。


    目前，两大`FPGA`公司英特尔和赛灵思都选择支持基于`OpenCL`的`FPGA`高层次开发语言，并分别发布了自己的`API`和`SDK`开发工具。这在一定程度上降低了`FPGA`的开发难度，使得软件工程师可以使用自己相对熟悉的语言在`FPGA`平台上进行算法开发。尽管如此，软件开发者仍然需要了解基本的`FPGA`体系结构和设计约束，这样才能有效地指导和约束开发工具进行针对性的优化。此外，基于`OpenCL`的`FPGA`设计移植性并不好，并且严重依赖厂商提供的开发工具和底层模块，调试起来也有诸多困难。关于更多的使用高层次语言开发`FPGA`的问题与挑战，我们将在下一章进一步详细阐述。


    除了`OpenCL`之外，英特尔还发布了基于`OpenVINO`（`Open Visual Inference & Neural Network Optimization`）的`FPGA`开发套件，它专门为计算机视觉应用进行优化，针对的是深度学习在边缘计算的应用场景。`OpenVINO`最大的特点之一就是能支持英特尔的全栈视觉加速方案以及硬件平台，除了`FPGA`外还包括`CPU`、`GPU`，以及`Movidius
    VPU`等，并支持多种深度学习框架。提出如`OpenVINO`这样的领域专用框架、语言、开发套件等，并使用`FPGA`作为硬件加速单元，这将会是业界接下来的重要发展方向。


    我们也能看到，`FPGA`在`AI`领域的应用也在逐步扩展到网络边缘和端点，例如智能安防、视频采集和处理、自动驾驶和机器人等。边缘计算+人工智能一直是国内外初创企业切入市场的主要方法。通过使用`FPGA`，可以直接在数据来源进行人工智能模型的推断和处理，并对相关计算进行硬件加速。这也是业界很多公司都在参与的热门领域。


    ## 3.5 本章小结


    在诞生 30 年后，`FPGA`在人工智能时代重新焕发了新生，这固然是由于`FPGA`本身的架构特点所决定，但更是因为人们对`FPGA`技术进行的不断迭代和创新。我们看到，人工智能技术，还有它在各个领域的应用，已经成为`FPGA`公司的战略发展方向。我们还看到，以微软为代表的软件和互联网公司也在积极拥抱`FPGA`，并将其作为加速`AI`应用的重要引擎。可以想象，这些成果和进步只是一个开端，`FPGA`一定会继续延续它发展的脚步，在人工智能时代继续创造新的成就。


    # 第 4 章 更简单也更复杂——FPGA 开发的新方法


    美国加州大学洛杉矶分校的丛京生教授是`FPGA`学术研究领域的巨擘，他是多个高效的`FPGA`设计工具与算法的发明人，也成功地将其研究成果进行了商业转化，例如创立了`AutoESL`公司、`Falcon
    Computing`公司等。丛京生教授在 2020 年亚太地区设计自动化会议（`ASP-DAC`）发表的主旨演讲中提到，他的整个学术生涯大致可以分成两个阶段：在
    2009 年之前，他的研究主要侧重于面向硬件设计人员的电子设计自动化，也就是如何帮助硬件工程师更快更好地完成设计。而在过去的十年间，丛教授的主要研究方向已经转变成了面向软件工程师的可定制电路的电子设计自动化领域。之所以会有这样的方向转换，既是因为业界对可编程逻辑器件的需求不断升温，又因为开发`FPGA`伴随的诸多难点、痛点与挑战。


    `FPGA`作为一个“特殊”的芯片，经历了 30 多年的发展之后，目前已经成为了一个包含各种最先进电路、逻辑单元、接口、芯片封装、制造等技术的“集大成者”。在芯片硬件不断进化的同时，`FPGA`的开发软件与设计工具也在不停地迭代和更新。一方面，`FPGA`的设计工具一直在不断整合最先进的算法与创新成果，在基于硬件描述语言`HDL`的开发流程的基础上，逐渐演化出了基于高层语言的设计方法。这其中最有代表性的，就是所谓的高层次综合（`High-Level
    Synthesis`，`HLS`）技术。通过这些高层次设计方法，隐藏了`FPGA`的很多底层逻辑与实现细节，使得软件和算法工程师能够专注于应用于算法实现，这也在很大程度上使得`FPGA`的开发变得更加简单。


    另一方面，这些`FPGA`的高层次设计工具也给使用者和研究者带来了很多难题。对于使用者来说，`FPGA`的高层次设计并不完全像`CPU`或`GPU`的应用设计那样，可以使用任意语言、任意编程框架、任意设计模式。对于`FPGA`来说，它需要设计者在一定程度上了解`FPGA`以及它的内部架构，这样才能引导高层语言综合工具得到优化的系统性能，而这就使得`FPGA`的高层次开发变得更加复杂了。


    在本章，我们将详细介绍近年来不断涌现的`FPGA`开发的新方法，以及这些方法对`FPGA`开发流程的影响。此外，本章还将介绍`FPGA`公司为了顺应这一趋势所推出的新型`FPGA`设计工具，以及`FPGA`的开发工具与开发方法在今后的发展方向。


    ## 4.1 难上加难：现代 FPGA 开发的痛点


    随着`FPGA`发展到今天，它可能是有史以来最为复杂的半导体器件之一。例如，赛灵思在 2019 年发布的`Versal FPGA`包含 360 亿支晶体管；而英特尔发布的全球最大的`FPGA`器件，`Stratix10
    GX 10M`有 433 亿只晶体管、1020 万个可编程逻辑单元，以及 2304 个可编程 I/O 接口。


    事实上，`FPGA`的复杂度远远不能通过晶体管数量进行简单量化。这几百亿只晶体管，组成了大量可编程逻辑单元和查找表结构、数千个高性能运算单元、各种类型和大小的内存资源、高速串行
    I/O 接口、多个嵌入式处理器，还有成百上千种不同功能的软核和硬核`IP`等。和其他芯片结构相比，`FPGA`有着独特的可编程逻辑阵列，从而可以实现大规模的硬件并行和定制化的深度流水线，并带来极高的吞吐量、极低的功耗，以及各种对系统性能和效率的连锁收益。这也是`FPGA`架构最吸引人的地方。


    然而，当所有这些硬件资源都被集成到一个芯片上时，就产生了一个重要的问题：用户该如何对这些硬件资源进行编程？


    通常来说，当考虑一个具体应用的实现时，需要将其分解成在硬件上运行的部分，以及在软件上运行的部分。对于`FPGA`，这种分解方式将会变得更加复杂，例如，哪部分要用可编程逻辑实现，哪部分要用片上的微处理器实现；如何合理地分配片上内存，当片上内存不足时如何优化使用片外内存；如何提升系统性能、吞吐量、时钟频率；如何对设计增加并行性、添加流水线等。


    从这些例子就可以看出，设计一个高效的`FPGA`应用是一个极其复杂的工作。对于许多尝试使用`FPGA`的团队而言，这其中最大的挑战就来自于`FPGA`结构本身。当系统的软硬件架构确定下来，并开始进行实现时，开发团队就面临着设计复杂数字电路的严峻任务。而这个过程需要使用特定的硬件描述语言对电路逻辑进行建模，同时要求工程师对电路综合、逻辑映射、布局布线、时序收敛等各个环节都有丰富的经验。这一切的一切，都大大增加了`FPGA`设计的难度和门槛，也让很多团队望而却步。


    如何降低`FPGA`的开发难度，一直是`FPGA`公司几十年来致力解决的重点问题。时至今日，包括英特尔和赛灵思在内的`FPGA`公司，负责`EDA`工具开发的工程师数量，都远多于开发`FPGA`芯片本身的工程师数量。除此之外，这些`FPGA`厂商还有着庞大的现场应用工程师大军，他们时刻准备着帮助客户解决各种`FPGA`的实际问题。同时，业界也出现了很多第三方的`FPGA`设计咨询公司、`IP`提供商、外包公司等，它们挣钱的方式就是帮助客户尽可能地简化`FPGA`的开发过程。也就是说，为了应对`FPGA`复杂的编程性，业界已经发展产生了很多特定的分工。


    当前，`FPGA`正在不断进入各种快速扩张的市场，包括从边缘计算到云计算的加速、网络数据处理和存储的加速，以及各种嵌入式应用，例如 5G 和汽车市场等。然而，这些领域中的大多数开发团队都没有`FPGA`相关的设计专业知识和经验。更重要的是，在这些领域中，大多数的应用都是使用纯软件方法进行设计开发的，并越来越依赖人工智能技术的发展。这些都使得`FPGA`的开发难度被无限放大，也极大地阻碍了`FPGA`的进一步使用。


    因此，业界都在期待`FPGA`的开发环境能够升级，使得特定领域的软件开发者能够高效地利用复杂的异构硬件，独立实现`FPGA`应用开发，且无须了解底层的电路结构和细节，也无须`FPGA`专家过多地介入开发过程。


    ## 4.2 让软件工程师开发 FPGA——高层次综合


    高层次综合，指的是将高层次语言描述的逻辑结构，通过`EDA`工具自动转换成低抽象级语言描述的电路模型的过程。所谓的高层次语言，包括`C`、`C++`、`SystemC`等，通常有着较高的抽象度，并且往往不具有时钟或时序的概念。相比之下，`Verilog`、`VHDL`、`SystemVerilog`等硬件描述语言，通常用来描述时钟周期精确（Cycle
    accurate）的寄存器传输级电路模型，这也是当前`ASIC`和`FPGA`设计最为普遍使用的电路建模和描述方法。


    近十年来，`HLS`技术获得了大量的关注和飞速的发展，尤其是在`FPGA`领域。纵观近年来各大`FPGA`学术会议，`HLS`一直是学术界和工业界研究最集中的领域之一。究其原因，主要有以下几点。


    第一，使用更高的抽象层次对电路建模，是集成电路设计发展的必然选择。集成电路伴随摩尔定律发展至今，其复杂性已经逐渐超过人类可以手工管理的范畴。根据 NEC 2004
    年发布的研究，一个拥有 100 万逻辑门的芯片设计通常需要编写 30 万行`RTL`代码。因此，完全使用`RTL`级的逻辑抽象设计当代芯片是不现实的，并将对设计、验证、集成等各个环节造成巨大的压力。然而，使用像`C`、`C++`等高层语言对系统建模，可以将代码密度压缩到原先的
    10%～14%，压缩率高达 7～10 倍，这极大地缓解了设计复杂度。


    第二，高层语言能促进`IP`重用的效率。传统的基于`RTL`的`IP`往往需要定义固定的架构和接口标准，在`IP`重用时需要花费大量时间进行系统互连和接口验证。相比之下，高层语言隐藏了这些要求，转而由`HLS`工具负责具体实现。对于`FPGA`而言，现代`FPGA`里有着大量成熟的`IP`单元，如嵌入式存储器、算术运算单元、嵌入式处理器，以及最近逐渐兴起的`AI`加速器、片上网络系统等。这些`FPGA`的`IP`单元有着固定的功能和位置，因此可以被`HLS`工具充分利用，在提升`IP`重用效率的同时，简化综合算法，提高综合后电路的性能。


    第三，`HLS`能帮助软件和算法工程师参与和主导芯片或`FPGA`设计。这是由于`HLS`工具能封装和隐藏硬件的实现细节，从而使软件和算法工程师能专注于上层算法的实现。对于硬件工程师而言，`HLS`也能帮助他们进行快速的设计迭代，并专注于对性能、面积或功耗敏感的模块和子系统的优化设计。


    ### 4.2.1 FPGA 高层次综合的前世今生


    伴随集成电路的复杂性的飞速增长，芯片设计方法学也在不断演进。早在`FPGA`出现之前，人们就已经开始尝试摆脱依靠人工检视芯片版图的设计方法，转而探索使用高层语言对电路逻辑进行行为级描述，并通过自动化工具将电路模型转化为实际的电路设计。在
    20 世纪 80～90 年代，面向集成电路设计的`HLS`工具就已经是学术界研究的热点。这其中比较有代表性的工作，包括卡耐基梅隆大学的`CMU-DA`（`Design
    Automation`）工具，以及加拿大卡尔顿大学提出的 force-directed 调度算法等。


    从现在来看，这些工作为当前的电路综合算法打下了基础，并为后来`HLS`研究提供了很多宝贵的经验和借鉴。然而，这个阶段的`HLS`工作在成果转化方面十分失败，并未有效地转化成工业实践。一个最主要的原因，就在于“在错误的时间，遇上了对的人”。


    当时正值摩尔定律蓬勃兴起的时期，集成电路设计正在经历史上最大的变革。在后端，自动布局布线已经逐渐成为主流；在前端，`RTL`综合也在逐渐兴起。传统电路设计工程师都纷纷开始采用基于`RTL`的电路建模方法，取代传统的基于原理图和版图的设计，并由此带来`RTL`综合工具的飞速发展。相比之下，这个阶段的`HLS`研究往往使用了特殊的编程语言，如`CMU-DA`采用的名为“`ISPS`”的语言，因此很难获得那些正在和`RTL`处于“蜜月期”的工程师们的青睐。


    伴随着一段时间的沉寂，`HLS`在 2000 年之后再次开始获得学术界和工业界的关注，比较有名的工具包括`Bluespec`和`AutoPilot`等。主导这一变化的主要原因是，`HLS`工具开始将`C/C++`作为主要的目标语言，从而被很多不了解`RTL`的软件工程师与算法工程师所逐渐接受。同时，`HLS`工具综合生成的结果也有了长足进步，在某些应用领域甚至可以达到和人工手写`RTL`近似的性能水平。


    此外，`FPGA`的逐渐兴起也对`HLS`的发展起到了重要的助推作用。和`ASIC`设计不同，`FPGA`有着固定数量的片上逻辑资源。因此`HLS`工具不用过度纠结于`ASIC`设计中面积、性能和功耗的绝对优化，而只需要将设计合理地映射到`FPGA`的固定架构上即可。这样，`HLS`就成为了在`FPGA`上快速实现目标算法的绝佳方式。


    时至今日，高层次综合技术取得了进一步的发展。大型`FPGA`公司都推出了各自的`HLS`工具，如赛灵思的`Vivado HLS`和英特尔的`HLS`编译器、`OpenCL
    SDK`等。在学术界也有诸多成果涌现，如多伦多大学的`LegUp`工具等。


    ### 4.2.2 高层次综合的主要工作原理：以 AutoPilot 为例


    `AutoESL`公司的`AutoPilot`工具，可以说是`HLS`领域最为成功的学术成果转化案例。`AutoPilot`源自于`UCLA`丛京生教授主导的`xPilot`项目，丛京生随后与当时负责该课题的博士生张志如（现任康奈尔大学副教授）一起创办了`AutoESL`公司，并在
    2011 年被赛灵思收购，成为了之后的`Vivado HLS`。


    `AutoPilot`的工作流程框图如图 4-1 所示。在前端，它使用了基于`LLVM`的编译器架构，能够处理可综合的`ANSI C`、`C++`，以及`OSCI
    SystemC`等语言编写的模型。这个名为`llvm-gcc`的前端编译器会将高层语言模型转换为中间表达式（`IR`），并进行一系列针对代码复杂度、冗余、并行性等方面的代码优化。然后，再根据具体的硬件平台，综合生成`RTL`代码、验证与仿真环境，以及必需的时序和布局约束等。


    ![](img/Figure-P152_1546.jpg)


    图 4-1　`AutoPilot`高层次综合工具的工作流程框图


    `AutoPilot`的成功之处在于，它的`HLS`结果在某些应用领域完胜人工优化`RTL`取得的结果。例如，在一个无线`MIMO`系统中使用的`Sphere`解码器`IP`中，`AutoPilot`将
    4000 行`C`代码算法成功综合到赛灵思`Virtex5`系列`FPGA`上，运行在 225MHz，并取得了比赛灵思`Sphere`解码器`IP`更少的逻辑资源使用量，见表
    4-1。这个结果放在现在也令人十分震撼，它很好地证明了`HLS`有潜力取得比`RTL IP`更为出色的性能。


    **表 4-1　`AutoPilot`工具运行结果比较**


    ![](img/Figure-T153_2335.jpg)


    ### 4.2.3 高层次综合工具常用的优化方法


    高层次综合工具需要统筹考虑各种电路设计的主要指标，如性能、功耗、面积等，同时也要兼顾工具本身的性能，例如占用的资源和运行时间等。因此，在开发`HLS`工具时，要额外考虑和采用更多的优化方法，而这些优化方法也是当今学术界和工业界在`HLS`领域重点研究的方向。总的来说，`HLS`工具的主流优化方法有以下几种。


    第一，字长分析和优化。`FPGA`的一个最主要特点就是可以使用任意字长的数据通路和运算。因此，`FPGA`的`HLS`工具不需要拘泥于某种固定长度（如常见的
    32 位或 64 位）的表达方式，而可以对设计进行全局或局部的字长优化，从而达到性能提升和面积缩减的双重效果。然而，字长分析和优化需要`HLS`的使用者对目标算法和数据集有深入的了解，这也是限制这种优化方式广泛使用的主要因素之一。


    第二，循环优化。这种优化方法的主要目的，是把高层软件中原本顺序执行的循环语句，有效映射到硬件结构中，实现并行执行。循环优化的最终目标，就是尽量将循环里两次相邻的操作以最小的时延实现。理想情况下，相邻的循环操作可以完全并行执行，然而，由于硬件资源的限制，以及更多的是循环间存在嵌套和依赖关系，很难将循环完全展开。因此，如何优化各种循环，以实现最优的硬件结构，就成为了学术界和工业界最为关心的要点。


    循环优化一直是`HLS`优化方法研究的重中之重。当前，一个比较流行的循环优化方法，就是所谓的多面体模型，即`Polyhedral Model`。多面体模型的应用非常广泛，在`HLS`里主要被用来将循环语句以空间多面体表示（见图
    4-2），然后根据边界约束和依赖关系，通过几何操作进行语句调度，从而实现循环的变换。


    ![](img/Figure-P154_1615.jpg)


    图 4-2　多面体模型建模示例


    关于多面体模型的细节，由于篇幅所限在本书不再展开。需要指出的是，多面体模型在`FPGA`的`HLS`研究里已经取得了相当的成功，很多研究均证明多面体模型可以帮助实现性能和面积的优化，同时也能帮助提升`FPGA`片上内存的使用效率。


    `HLS`工具的第三种优化方式，就是对软件并行性的支持。高层语言`C/C++`与`RTL`相比，前者编写的程序被设计用来在处理器上顺序执行，而后者可以通过直接例化多个运算单元，实现任务的并行处理。随着处理器对并行性的逐步支持，以及如`GPU`等非处理器芯片的兴起，`C/C++`也开始逐渐引入对并行性的支持。例如，出现了`pthreads`和`OpenMP`等多线程并行编程方法，以及`OpenCL`等针对`GPU`等异构系统进行并行编程的`C`语言扩展。因此作为`HLS`工具，势必要增加对这些软件并行性的支持。例如，多伦多大学提出的`LegUp`工具就整合了对`pthreads`和`OpenMP`的支持，从而可以实现任务和数据层面的并行性。


    ### 4.2.4 高层次综合的发展前景


