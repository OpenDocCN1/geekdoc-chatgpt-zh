- raw: '正因如此，尽管这项工作并没有专注于架构研究的重点和流行的部分，但它极大地帮助了这个领域向前迈进了一大步。这项工作通过提供更加高效的工具，使研究人员更有生产力，从而在另外一个角度帮助FPGA架构研究带来了大量创新。


    ##### 4．时序驱动的FPGA布局算法


    **一句话总结：**现代FPGA设计工具中的核心布局与时序优化算法


    **英文名：**Timing-driven placement for FPGAs


    **作者：**Alexander（Sandy）Marquardt，Vaughn Betz，Jonathan Rose


    **发表时间：**2000年


    **推介人：**丛京生（加州大学洛杉矶分校）


    众所周知，VPR是FPGA学术界最流行的开源CAD软件，几乎每个新的FPGA架构研究都使用了VPR。而这项成果就详细阐述了在VPR中使用的时序驱动的布局算法。在这项成果中介绍的T-VPlace算法，除了广受好评和广泛使用之外，它还对FPGA的布局算法有着三个重要的贡献。


    第一，在T-VPlace算法中，时序优化的过程是通过最小化延时与导线长度的加权和实现的。这个计算过程通过一个基于模拟退火（Simulated Annealing）的优化引擎完成。其中，每个节点的权值是该节点时序临界性的多项式函数。这项工作的结果表明，这种权值函数能够得到很好的时序收敛。此外，导线长度和时序都可以根据前一次的迭代进行自主归一化，这使得算法有着很好的稳定性。


    第二，这项工作表明，每个节点的时序裕量（Timing Slack）不需要随着逻辑单元的移动而不断更新。只需要在对每个温度进行的迭代完成之后，再进行精确的基于路径的时序分析即可。使用未更新的时序裕量通常并不会对时序优化造成影响，反而会大幅提升T-VPlace算法的性能和效率。不过，后来的工作也表明，在高度流水线化的设计中，如果使用未更新的时序裕量会对性能造成负面影响。


    第三，在一个给定的分段可编程互连架构中，在源-汇节点间的延时不能简单地通过其曼哈顿距离来估计。然而，如果在布局期间使用一个布线器来计算每个源-汇节点之间的延时也是非常不现实的。因此，通过利用FPGA架构中的对称性，T-VPlace算法使用了一个预先计算的延时查找表，根据水平和垂直方向的距离作为索引，从而实现对延时的快速查找。


    通过以上三种技术，使得T-VPlace可以高效地产生高质量的时序优化结果。事实上，前两种技术同样可以被应用于其他集成电路设计的标准单元布局，而非FPGA专属。可以说，T-VPlace算法是现代FPGA布局布线算法的基石。作者所在的RightTrack公司在2000年被Altera收购后，T-VPlace及其优化技术就被整合进Altera的Quartus设计软件中，并被世界上成千上万的FPGA设计者所使用至今。


    ##### 5．在商用计算机上的高质量、确定性的FPGA并行布局算法


    **一句话总结：**利用多核处理器显著降低FPGA项目编译时间的标志性工作


    **英文名：**High-Quality，Deterministic Parallel Placement for FPGAs on Commodity Hardware


    **作者：**Adrian Ludwin，Vaughn Betz，Ketan Padalia


    **发表时间：**2008年


    **推介人：**Jonathan Rose（多伦多大学）


    FPGA业界当前面临的最关键的问题之一是设计工具编译的时间过长，这一方面是由于计算机处理器的性能并没有质的飞跃，另外一方面是由于FPGA的大小随着半导体制造工艺的发展而不断增加，使得计算的复杂度也随之增长。为了应对这个问题，一个有效的方法是使用多个处理器核心进行并行编译。


    这项成果旨在加速FPGA设计流程中最慢的环节之一，即布局的并行化问题。在这个工作中，采用了几项非常独特而重要的方法。例如，这是目前首个，也是唯一一个尝试对工业级布局软件进行并行化的工作，并最终将成果转化为成功的商用软件。在此之前，尽管有很多工作试图对布局算法做并行化处理，它们其实都是基于学术版本的理想化算法，也就是说，这些工作并不需要应对海量的器件数据库、复杂的时序分析，以及在商业版软件中会遇到的各种细节问题。


    此外，这项工作对算法的确定性（Determinism）做了重要阐述。算法的确定性指，不管使用多少个处理器对算法进行计算，它的结果都会是完全相同的。尽管在学术界中存在争议，但确定性在商业软件中对于复现结果以及调试都是不可或缺的。这项成果表明，需要做一系列细致的工作以保证算法的确定性。此外，这项成果也证明了这些工作对性能的损失很小。这个工作还就内存架构对并行算法性能的影响进行了深入分析。值得注意的是，它表明不同的内存结构对算法性能的影响很大。


    总体来说，这项成果在算法性能方面取得了很大的提升：在布局阶段，使用4个处理器内核可以得到2.2倍的性能提升。对于大型设计，这样的性能提升会节省好几个小时的运行时间。在一个完整的FPGA编译流程中，还存在着很多耗时的阶段，这也意味着需要做更多的工作，才能最终将FPGA项目的编译时间进一步缩短。但是，这项成果为实现这一目标做出了巨大的贡献，也是其他后续工作值得参考的典范。


    #### ■5.2.4　其他EDA/CAD算法篇


    本篇介绍了四种重要工作，集中在FPGA的计算机设计自动化领域。它们有的成为了现代FPGA设计工具中通用的逻辑映射方法，有的从理论层面对逻辑簇结构及其包装算法进行了深入研究，有的则对FPGA的功耗提出了简单而强大的优化方法。


    ##### 1．在基于LUT的FPGA映射中最小化逻辑深度和面积


    **一句话总结：**FPGA逻辑映射算法的基础性工作


    **英文名：**Simultaneous depth and area minimization in LUT-based FPGA mapping


    **作者：**Jason Cong，Yean-Yow Hwang


    **发表时间：**1995年


    **推介人：**Eugene Ding（赛灵思）


    这项成果对FPGA逻辑映射算法的发展起到了非常重要的推动作用。1994年，Jason Cong及团队发表了名为FlowMap的映射算法。它是首个有着多项式时间复杂度的映射算法，并且能在理论上对逻辑层数量达到最佳的优化。这个方法的核心思想是将K输入LUT的映射问题，建模成一个最小高度、K可行度的割问题（Minimum-height，K-feasible
    cut），而不是像传统方法那样基于局部的簇进行映射。


    FlowMap算法本质上就是在一个保证最小高度的图上计算最小割的问题。虽然这个方法简单而高效，但它有可能会产生并使用小的LUT，并且会产生大量的逻辑冗余，而这都会造成更高的面积成本。虽然作者也提出了一些后续处理的方法，以及考虑将非关键路径的高度约束进行适量放宽，但这些方法本质上都属于局部优化，因此并不属于这种基于全局割的理论框架。


    在这个工作中，作者提出了CutMap算法。相比它的“前任”FlowMap，这项成果能在多项式时间内完成深度优化（Depthoptimal）的映射结果，而且使用的LUT数量会极大减少。


    这项成果有着以下几个关键性的贡献。首先，它使用了成本函数以控制割数的产生。这样，除了最小割之外，算法不仅可以找到所有的可行割，还能在映射过程中考虑次要的优化目标，甚至考虑多个并行的优化目标。其次，CutMap算法可以全局寻找共享逻辑的可能性、减少顺序依赖，以及将映射质量与逻辑网络的结构更加紧密地联系在一起。最后，它提出了一些剪枝规则，能帮助加速割计算的过程。虽然在今天看来，这里很多的想法和思路是显而易见的，但在当时，这些方法还并没有得到广泛应用。此外，CutMap方法在实践中表现很好，并成为了后续很多工作用来对比的基础性工作。


    基于割的多目标优化方法已经成为逻辑映射领域的标准性工作，而这并不局限在FPGA领域。正是这项工作推动了这一突破的不断发展。


    ##### 2．割的排序和修剪：构建一个通用且高效的FPGA映射方法


    **一句话总结：**FPGA映射算法的再一次跨越式性能提升


    **英文名：**Cut Ranking and Pruning：Enabling a General and Efficient FPGA Mapping
    Solution


    **作者：**Jason Cong，Chang Wu，Yuzheng Ding


    **发表时间：**1999年


    **推介人：**Steve Wilton（英属哥伦比亚大学）


    这项成果通过割的生成、排序和修剪技术，极大地减少了LUT映射的复杂度和运行时间，从而提升了LUT逻辑映射的可扩展性。


    从最早的商用FPGA开始，查找表LUT就是大多数器件中实现逻辑功能的主要结构。如何将逻辑功能映射到LUT上，也一直是FPGA CAD工具所致力解决和优化的核心问题。正因为如此，在过去的很多年中，有大量的研究工作都在不断寻找高效的逻辑映射算法。


    这项工作发表于1999年，在此之前，FlowMap、Chortle、DFmap等方法都已经发表了，研究者们也已经知道对LUT进行有效的逻辑映射是可行的。对于这项工作来说，它不只是介绍了一种新的算法，更是阐述了一些足够通用的技术原理。这些技术可以用来提高大部分逻辑映射算法的核心操作效率，而这也是这项工作最为重要的贡献之一。


    例如，这项工作讨论了割生成（Cut Generation）、割排序（Cut Ranking）和割修剪（Cut Pruning）。其中，割生成指的是如何构建一组割，割排序指的是如何对割进行评估和排序，割修剪指的是不重要的割会被丢弃和剪枝。对于大型电路来说，这些任务都有着很高的计算难度，因此急需高效的算法以应对这些问题。此外，这项工作还展示了如何使用这些技术对以往发表过的映射算法进行改进和性能提升。


    综上所述，这项成果已经成为任何FPGA CAD算法工程师必须掌握的理论技能，在实际的FPGA设计工具中这些技术也已经经过了多次迭代更新。时至今日，逻辑映射仍然是一个活跃的研究领域，这项发表于1999年的工作也将会继续影响新的逻辑映射算法的出现和进步。


    ##### 3．使用基于簇的逻辑块和时序优先的包装算法来提升FPGA的速度和逻辑密度


    **一句话总结：**FPGA簇结构包装算法的奠基之作


    **英文名：**Using Cluster-Based Logic Blocks and Timing-Driven Packing to Improve
    FPGA Speed and Density


    **作者：**Alexander（Sandy）Marquardt，Vaughn Betz，Jonathan Rose


    **发表时间：**1999年


    **推介人：**Steve Wilton（英属哥伦比亚大学）


    这项成果首次对基于簇的逻辑块（Cluster-based Logic Blocks）的速度优势进行了量化分析。在1999年，在大部分的商用FPGA中都已经使用了基于簇的逻辑块，包括Altera的Flex系列和赛灵思的Virtex系列等。然而，对于这种体系结构的建模和分析仍然处于起步阶段。在之前的工作中，Vaughn
    Betz已经证明基于簇的逻辑块结构可以提升逻辑密度。事实上，正如这项工作中所揭示的，基于簇的逻辑块的真正优势其实是在速度方面。正因此，这项工作开辟了一个全新的研究领域，即为众多的包装算法（Packing
    Algorithms）搭建了基础框架，并成为了所有FPGA CAD流程中的基础性部分。


    在这项工作中，作者首先描述了一个CAD流程（见图5-11），以及适用于对这类架构进行分析的方法。然后，作者根据Vaughn Betz之前的工作，给出了一个参数化的簇架构，它被用来探究不同的基于簇的逻辑块结构。接下来，他们提出了一个名为T-VPACK的算法，这个时序优先的算法负责将LUT和寄存器包装到逻辑簇中。通过实验验证，这项工作表明基于簇的逻辑块结构可以显著地提升FPGA的速度。此外，最优的簇大小是7～10个逻辑单元。在此之后的很多年，这种簇大小一直都是学术界和工业界的体系结构标准。


    ![](OEBPS/Images/Figure-P199_2096.jpg)


    图5-11　FPGA时序与面积分析流程图


    这项工作的真正价值在于，它为未来的研究人员开发新的簇包装算法、研究新的簇逻辑结构构建了理论基础。例如，后来的很多工作，包括RPACK、iRAC、DVPack和P-T-VPACK等都建立在这项成果之上。当前，FPGA里的簇逻辑结构已经越发重要。多伦多大学的这个课题组已经将簇逻辑结构的研究进行了极大的扩展，但这些扩展仍然保持着这项成果中提出的很多基本假设、评估方法以及体系结构框架。


    ##### 4．FPGA漏电流功耗的优化方法


    **一句话总结：**充分利用FPGA特性的无损功耗优化方法


    **英文名：**Active Leakage Power Optimization for FPGAs


    **作者：**Jason H. Anderson，Farid N. Najm，Tim Tuan


    **发表时间：**2004年


    **推介人：**Russ Tessier（马萨诸塞大学）


    这项成果的主要贡献在于提出了一个简单的方法，可以显著地降低FPGA的漏电流功耗。在FPGA的特征尺寸大于100nm时，漏电流功耗通常是可以忽略不计的，FPGA设计工具也通常不考虑这种功耗的优化。然而随着FPGA的特征尺寸降至100nm以下，有越来越多的移动应用领域开始对FPGA产生了兴趣。要知道，在100nm以内，总功耗超过30%的部分都是漏电流功耗。但是对于FPGA来说，它不能像ASIC那样完全关闭器件的某个区域，以实现功耗优化的目的。此外，随着FPGA被越来越广泛地应用于数据中心、移动通信等功耗敏感的领域，对FPGA功耗的要求也越来越严格。因此，漏电流功耗也随之成为了研究者关注和尝试优化的重要领域。


    通常来说，在对特定约束进行优化时，往往需要进行多方面的权衡。例如在一个设计中，为了在一个维度取得良好的结果，另一个或更多的其他维度有可能会变得更差。然而，这项成果所介绍的功耗优化技术很好地兼顾了多个设计维度。这个方法只需要进行一些轻度的FPGA设计预处理，就可以节省高达25%的静态功耗。除此之外，不需要牺牲额外的电路面积，抑或是损失系统性能。


    这项工作基于一个简单但十分有效的概念：如果CMOS三极管的栅极为逻辑1时，将漏极和源极也设置为逻辑1，那么它的静态功耗就会降低。如果布线架构将其驱动的信号默认设置为逻辑1，那么互连架构的静态功耗也将大幅降低。由于FPGA有着可配置性，在大多数情况下可以对这些信号进行设置，由此就达成了功耗优化。


    这项成果的最大贡献之一，在于它所阐述的观点有着极大的通用性和互补性。该技术可以和任何其他的FPGA功耗优化方法一起使用，而不会对其他方法产生负面影响。在软件层面，实现该技术所需要的软件也十分简单。毫无疑问，这项成果是充分利用了FPGA的灵活可配置性，并将简单的思想应用于重要领域的一个典型代表。


    #### ■5.2.5　FPGA应用篇


    本篇介绍了6个FPGA应用领域的重要工作。它们有的为FPGA动态重构研究确立了坚实的理论和实践基础，有的首次探索了FPGA与虚拟化技术的结合与实现，有的则向世人展示了何为高效、高性能的FPGA应用设计。


    ##### 1．DPGA的使用和应用领域


    **一句话总结：**FPGA动态重构领域的奠基之作


    **英文名：**DPGA Utilization and Application


    **作者：**Andre DeHon


    **发表时间：**1996年


    **推介人：**John Wawrzynek（加州大学伯克利分校）


    这项成果是最早研究FPGA动态重构（Runtime Reconfiguration）的工作之一，它为大量后续的工作奠定了坚实的基础。


    在这个工作中，作者深入分析了能够提升FPGA运行效率的器件架构和应用设计模式。在这项工作之前，有许多研究人员对于FPGA的动态重构功能非常着迷，有些研究已经构建了基于商用FPGA的动态重构应用实例。其中，一个典型的工作是Chris
    Jones等人的“在无线视频编码中使用FPGA动态重构的问题研究”（Issues in Wireless Video Coding using Run-time-reconfigurable
    FPGAs）。然而，人们对于动态重构及其设计模式并没有一个清晰的理解。此外，对动态重构的成本和优势也缺乏量化标准和理论分析。


    Andre DeHon很早就开始关注并思考这些问题。在MIT做研究生期间，他就在研究中引入了动态可重构器件这一概念。在这个工作中，他阐述了一组实用的设计模式，并严谨地展示了这些模式如何与动态可重构器件一起，为系统带来明显的面积优势。


    尽管这项工作的学术贡献巨大，它却在更广泛的意义上影响和启发了其他研究者。这项工作展示了如何将定量分析用于可重构器件的架构和系统层面的研究，例如对某项特性的成本与优势分析等。此外，和商用可编程逻辑阵列相比，作者在系统架构层面有着截然不同而大胆的想法，而这也在微架构研究领域为其他研究者树立了一个创新思维的榜样。通常来讲，研究者都局限于商业器件，以及这些FPGA针对特定领域的优化，而这也在一定程度上限制了整个领域的创新和发展。


    总体来说，这项成果在几个方面产生了持久的影响：它设立了可重构计算的定量分析标准，并激励了一代研究人员探索动态重构的方法和应用。这项成果中包含的架构和设计思想，已经被很多研究团队和初创公司所采用。


    ##### 2．使用高性能FPGA在250MHz频率下进行信号处理


    **一句话总结：**高性能FPGA设计的典范作品，使FPGA时钟频率大幅超越同期x86 CPU


    **英文名：**Signal processing at 250 MHz using high-performance FPGA''s


    **作者：**Brian von Herzen


    **发表时间：**1997年


    **推介人：**Andre DeHon（宾夕法尼亚大学），Steve Trimberger（DARPA，美国国防先进计划研究署，前赛灵思院士）


    这项成果是FPGA设计领域中令人振奋的力作，它展示了FPGA所能达到的最大性能，以及如何通过设计FPGA获取这样的性能。为了理解这项成果，有必要先介绍一下FPGA设计在1997年左右是什么样子的。当时的高时钟频率设计的典范是使用0.5μm和0.6μm工艺制造的英特尔奔腾CPU，只不过运行在75～100MHz。只有到了0.35μm工艺时，奔腾CPU才有可能在200MHz的时钟频率下运行。此外，当时的大多数FPGA设计都运行在25～40MHz。业界的基本共识是，FPGA必然会比ASIC或处理器的运行速度慢很多。'
  fmt: '

    正因如此，尽管这项工作并没有专注于架构研究的重点和流行的部分，但它极大地帮助了这个领域向前迈进了一大步。这项工作通过提供更加高效的工具，使研究人员更有生产力，从而在另外一个角度帮助FPGA架构研究带来了大量创新。


    ### 4．时序驱动的FPGA布局算法

    **一句话总结：**现代FPGA设计工具中的核心布局与时序优化算法

    **英文名：**Timing-driven placement for FPGAs

    **作者：**Alexander（Sandy）Marquardt，Vaughn Betz，Jonathan Rose

    **发表时间：**2000年

    **推介人：**丛京生（加州大学洛杉矶分校）

    众所周知，VPR是FPGA学术界最流行的开源CAD软件，几乎每个新的FPGA架构研究都使用了VPR。而这项成果就详细阐述了在VPR中使用的时序驱动的布局算法。在这项成果中介绍的T-VPlace算法，除了广受好评和广泛使用之外，它还对FPGA的布局算法有着三个重要的贡献。

    第一，在T-VPlace算法中，时序优化的过程是通过最小化延时与导线长度的加权和实现的。这个计算过程通过一个基于模拟退火（Simulated Annealing）的优化引擎完成。其中，每个节点的权值是该节点时序临界性的多项式函数。这项工作的结果表明，这种权值函数能够得到很好的时序收敛。此外，导线长度和时序都可以根据前一次的迭代进行自主归一化，这使得算法有着很好的稳定性。

    第二，这项工作表明，每个节点的时序裕量（Timing Slack）不需要随着逻辑单元的移动而不断更新。只需要在对每个温度进行的迭代完成之后，再进行精确的基于路径的时序分析即可。使用未更新的时序裕量通常并不会对时序优化造成影响，反而会大幅提升T-VPlace算法的性能和效率。不过，后来的工作也表明，在高度流水线化的设计中，如果使用未更新的时序裕量会对性能造成负面影响。

    第三，在一个给定的分段可编程互连架构中，在源-汇节点间的延时不能简单地通过其曼哈顿距离来估计。然而，如果在布局期间使用一个布线器来计算每个源-汇节点之间的延时也是非常不现实的。因此，通过利用FPGA架构中的对称性，T-VPlace算法使用了一个预先计算的延时查找表，根据水平和垂直方向的距离作为索引，从而实现对延时的快速查找。

    通过以上三种技术，使得T-VPlace可以高效地产生高质量的时序优化结果。事实上，前两种技术同样可以被应用于其他集成电路设计的标准单元布局，而非FPGA专属。可以说，T-VPlace算法是现代FPGA布局布线算法的基石。作者所在的RightTrack公司在2000年被Altera收购后，T-VPlace及其优化技术就被整合进Altera的Quartus设计软件中，并被世界上成千上万的FPGA设计者所使用至今。


    ### 5．在商用计算机上的高质量、确定性的FPGA并行布局算法

    **一句话总结：**利用多核处理器显著降低FPGA项目编译时间的标志性工作

    **英文名：**High-Quality，Deterministic Parallel Placement for FPGAs on Commodity Hardware

    **作者：**Adrian Ludwin，Vaughn Betz，Ketan Padalia

    **发表时间：**2008年

    **推介人：**Jonathan Rose（多伦多大学）

    FPGA业界当前面临的最关键的问题之一是设计工具编译的时间过长，这一方面是由于计算机处理器的性能并没有质的飞跃，另外一方面是由于FPGA的大小随着半导体制造工艺的发展而不断增加，使得计算的复杂度也随之增长。为了应对这个问题，一个有效的方法是使用多个处理器核心进行并行编译。

    这项成果旨在加速FPGA设计流程中最慢的环节之一，即布局的并行化问题。在这个工作中，采用了几项非常独特而重要的方法。例如，这是目前首个，也是唯一一个尝试对工业级布局软件进行并行化的工作，并最终将成果转化为成功的商用软件。在此之前，尽管有很多工作试图对布局算法做并行化处理，它们其实都是基于学术版本的理想化算法，也就是说，这些工作并不需要应对海量的器件数据库、复杂的时序分析，以及在商业版软件中会遇到的各种细节问题。

    此外，这项工作对算法的确定性（Determinism）做了重要阐述。算法的确定性指，不管使用多少个处理器对算法进行计算，它的结果都会是完全相同的。尽管在学术界中存在争议，但确定性在商业软件中对于复现结果以及调试都是不可或缺的。这项成果表明，需要做一系列细致的工作以保证算法的确定性。此外，这项成果也证明了这些工作对性能的损失很小。这个工作还就内存架构对并行算法性能的影响进行了深入分析。值得注意的是，它表明不同的内存结构对算法性能的影响很大。

    总体来说，这项成果在算法性能方面取得了很大的提升：在布局阶段，使用4个处理器内核可以得到2.2倍的性能提升。对于大型设计，这样的性能提升会节省好几个小时的运行时间。在一个完整的FPGA编译流程中，还存在着很多耗时的阶段，这也意味着需要做更多的工作，才能最终将FPGA项目的编译时间进一步缩短。但是，这项成果为实现这一目标做出了巨大的贡献，也是其他后续工作值得参考的典范。


    ## ■5.2.4　其他EDA/CAD算法篇

    本篇介绍了四种重要工作，集中在FPGA的计算机设计自动化领域。它们有的成为了现代FPGA设计工具中通用的逻辑映射方法，有的从理论层面对逻辑簇结构及其包装算法进行了深入研究，有的则对FPGA的功耗提出了简单而强大的优化方法。


    ### 1．在基于LUT的FPGA映射中最小化逻辑深度和面积

    **一句话总结：**FPGA逻辑映射算法的基础性工作

    **英文名：**Simultaneous depth and area minimization in LUT-based FPGA mapping

    **作者：**Jason Cong，Yean-Yow Hwang

    **发表时间：**1995年

    **推介人：**Eugene Ding（赛灵思）

    这项成果对FPGA逻辑映射算法的发展起到了非常重要的推动作用。1994年，Jason Cong及团队发表了名为FlowMap的映射算法。它是首个有着多项式时间复杂度的映射算法，并且能在理论上对逻辑层数量达到最佳的优化。这个方法的核心思想是将K输入LUT的映射问题，建模成一个最小高度、K可行度的割问题（Minimum-height，K-feasible
    cut），而不是像传统方法那样基于局部的簇进行映射。

    FlowMap算法本质上就是在一个保证最小高度的图上计算最小割的问题。虽然这个方法简单而高效，但它有可能会产生并使用小的LUT，并且会产生大量的逻辑冗余，而这都会造成更高的面积成本。虽然作者也提出了一些后续处理的方法，以及考虑将非关键路径的高度约束进行适量放宽，但这些方法本质上都属于局部优化，因此并不属于这种基于全局割的理论框架。

    在这个工作中，作者提出了CutMap算法。相比它的“前任”FlowMap，这项成果能在多项式时间内完成深度优化（Depthoptimal）的映射结果，而且使用的LUT数量会极大减少。

    这项成果有着以下几个关键性的贡献。首先，它使用了成本函数以控制割数的产生。这样，除了最小割之外，算法不仅可以找到所有的可行割，还能在映射过程中考虑次要的优化目标，甚至考虑多个并行的优化目标。其次，CutMap算法可以全局寻找共享逻辑的可能性、减少顺序依赖，以及将映射质量与逻辑网络的结构更加紧密地联系在一起。最后，它提出了一些剪枝规则，能帮助加速割计算的过程。虽然在今天看来，这里很多的想法和思路是显而易见的，但在当时，这些方法还并没有得到广泛应用。此外，CutMap方法在实践中表现很好，并成为了后续很多工作用来对比的基础性工作。

    基于割的多目标优化方法已经成为逻辑映射领域的标准性工作，而这并不局限在FPGA领域。正是这项工作推动了这一突破的不断发展。


    ### 2．割的排序和修剪：构建一个通用且高效的FPGA映射方法

    **一句话总结：**FPGA映射算法的再一次跨越式性能提升

    **英文名：**Cut Ranking and Pruning：Enabling a General and Efficient FPGA Mapping
    Solution

    **作者：**Jason Cong，Chang Wu，Yuzheng Ding

    **发表时间：**1999年

    **推介人：**Steve Wilton（英属哥伦比亚大学）

    这项成果通过割的生成、排序和修剪技术，极大地减少了LUT映射的复杂度和运行时间，从而提升了LUT逻辑映射的可扩展性。

    从最早的商用FPGA开始，查找表LUT就是大多数器件中实现逻辑功能的主要结构。如何将逻辑功能映射到LUT上，也一直是FPGA CAD工具所致力解决和优化的核心问题。正因为如此，在过去的很多年中，有大量的研究工作都在不断寻找高效的逻辑映射算法。

    这项工作发表于1999年，在此之前，FlowMap、Chortle、DFmap等方法都已经发表了，研究者们也已经知道对LUT进行有效的逻辑映射是可行的。对于这项工作来说，它不只是介绍了一种新的算法，更是阐述了一些足够通用的技术原理。这些技术可以用来提高大部分逻辑映射算法的核心操作效率，而这也是这项工作最为重要的贡献之一。

    例如，这项工作讨论了割生成（Cut Generation）、割排序（Cut Ranking）和割修剪（Cut Pruning）。其中，割生成指的是如何构建一组割，割排序指的是如何对割进行评估和排序，割修剪指的是不重要的割会被丢弃和剪枝。对于大型电路来说，这些任务都有着很高的计算难度，因此急需高效的算法以应对这些问题。此外，这项工作还展示了如何使用这些技术对以往发表过的映射算法进行改进和性能提升。

    综上所述，这项成果已经成为任何FPGA CAD算法工程师必须掌握的理论技能，在实际的FPGA设计工具中这些技术也已经经过了多次迭代更新。时至今日，逻辑映射仍然是一个活跃的研究领域，这项发表于1999年的工作也将会继续影响新的逻辑映射算法的出现和进步。


    ### 3．使用基于簇的逻辑块和时序优先的包装算法来提升FPGA的速度和逻辑密度

    **一句话总结：**FPGA簇结构包装算法的奠基之作

    **英文名：**Using Cluster-Based Logic Blocks and Timing-Driven Packing to Improve
    FPGA Speed and Density

    **作者：**Alexander（Sandy）Marquardt，Vaughn Betz，Jonathan Rose

    **发表时间：**1999年

    **推介人：**Steve Wilton（英属哥伦比亚大学）

    这项成果首次对基于簇的逻辑块（Cluster-based Logic Blocks）的速度优势进行了量化分析。在1999年，在大部分的商用FPGA中都已经使用了基于簇的逻辑块，包括Altera的Flex系列和赛灵思的Virtex系列等。然而，对于这种体系结构的建模和分析仍然处于起步阶段。在之前的工作中，Vaughn
    Betz已经证明基于簇的逻辑块结构可以提升逻辑密度。事实上，正如这项工作中所揭示的，基于簇的逻辑块的真正优势其实是在速度方面。正因此，这项工作开辟了一个全新的研究领域，即为众多的包装算法（Packing
    Algorithms）搭建了基础框架，并成为了所有FPGA CAD流程中的基础性部分。

    在这项工作中，作者首先描述了一个CAD流程（见图5-11），以及适用于对这类架构进行分析的方法。然后，作者根据Vaughn Betz之前的工作，给出了一个参数化的簇架构，它被用来探究不同的基于簇的逻辑块结构。接下来，他们提出了一个名为T-VPACK的算法，这个时序优先的算法负责将LUT和寄存器包装到逻辑簇中。通过实验验证，这项工作表明基于簇的逻辑块结构可以显著地提升FPGA的速度。此外，最优的簇大小是7～10个逻辑单元。在此之后的很多年，这种簇大小一直都是学术界和工业界的体系结构标准。

    ![](OEBPS/Images/Figure-P199_2096.jpg)

    图5-11　FPGA时序与面积分析流程图

    这项工作的真正价值在于，它为未来的研究人员开发新的簇包装算法、研究新的簇逻辑结构构建了理论基础。例如，后来的很多工作，包括RPACK、iRAC、DVPack和P-T-VPACK等都建立在这项成果之上。当前，FPGA里的簇逻辑结构已经越发重要。多伦多大学的这个课题组已经将簇逻辑结构的研究进行了极大的扩展，但这些扩展仍然保持着这项成果中提出的很多基本假设、评估方法以及体系结构框架。


    ### 4．FPGA漏电流功耗的优化方法

    **一句话总结：**充分利用FPGA特性的无损功耗优化方法

    **英文名：**Active Leakage Power Optimization for FPGAs

    **作者：**Jason H. Anderson，Farid N. Najm，Tim Tuan

    **发表时间：**2004年

    **推介人：**Russ Tessier（马萨诸塞大学）

    这项成果的主要贡献在于提出了一个简单的方法，可以显著地降低FPGA的漏电流功耗。在FPGA的特征尺寸大于100nm时，漏电流功耗通常是可以忽略不计的，FPGA设计工具也通常不考虑这种功耗的优化。然而随着FPGA的特征尺寸降至100nm以下，有越来越多的移动应用领域开始对FPGA产生了兴趣。要知道，在100nm以内，总功耗超过30%的部分都是漏电流功耗。但是对于FPGA来说，它不能像ASIC那样完全关闭器件的某个区域，以实现功耗优化的目的。此外，随着FPGA被越来越广泛地应用于数据中心、移动通信等功耗敏感的领域，对FPGA功耗的要求也越来越严格。因此，漏电流功耗也随之成为了研究者关注和尝试优化的重要领域。

    通常来说，在对特定约束进行优化时，往往需要进行多方面的权衡。例如在一个设计中，为了在一个维度取得良好的结果，另一个或更多的其他维度有可能会变得更差。然而，这项成果所介绍的功耗优化技术很好地兼顾了多个设计维度。这个方法只需要进行一些轻度的FPGA设计预处理，就可以节省高达25%的静态功耗。除此之外，不需要牺牲额外的电路面积，抑或是损失系统性能。

    这项工作基于一个简单但十分有效的概念：如果CMOS三极管的栅极为逻辑1时，将漏极和源极也设置为逻辑1，那么它的静态功耗就会降低。如果布线架构将其驱动的信号默认设置为逻辑1，那么互连架构的静态功耗也将大幅降低。由于FPGA有着可配置性，在大多数情况下可以对这些信号进行设置，由此就达成了功耗优化。

    这项成果的最大贡献之一，在于它所阐述的观点有着极大的通用性和互补性。该技术可以和任何其他的FPGA功耗优化方法一起使用，而不会对其他方法产生负面影响。在软件层面，实现该技术所需要的软件也十分简单。毫无疑问，这项成果是充分利用了FPGA的灵活可配置性，并将简单的思想应用于重要领域的一个典型代表。


    ## ■5.2.5　FPGA应用篇

    本篇介绍了6个FPGA应用领域的重要工作。它们有的为FPGA动态重构研究确立了坚实的理论和实践基础，有的首次探索了FPGA与虚拟化技术的结合与实现，有的则向世人展示了何为高效、高性能的FPGA应用设计。


    ### 1．DPGA的使用和应用领域

    **一句话总结：**FPGA动态重构领域的奠基之作

    **英文名：**DPGA Utilization and Application

    **作者：**Andre DeHon

    **发表时间：**1996年

    **推介人：**John Wawrzynek（加州大学伯克利分校）

    这项成果是最早研究FPGA动态重构（Runtime Reconfiguration）的工作之一，它为大量后续的工作奠定了坚实的基础。

    在这个工作中，作者深入分析了能够提升FPGA运行效率的器件架构和应用设计模式。在这项工作之前，有许多研究人员对于FPGA的动态重构功能非常着迷，有些研究已经构建了基于商用FPGA的动态重构应用实例。其中，一个典型的工作是Chris
    Jones等人的“在无线视频编码中使用FPGA动态重构的问题研究”（Issues in Wireless Video Coding using Run-time-reconfigurable
    FPGAs）。然而，人们对于动态重构及其设计模式并没有一个清晰的理解。此外，对动态重构的成本和优势也缺乏量化标准和理论分析。

    Andre DeHon很早就开始关注并思考这些问题。在MIT做研究生期间，他就在研究中引入了动态可重构器件这一概念。在这个工作中，他阐述了一组实用的设计模式，并严谨地展示了这些模式如何与动态可重构器件一起，为系统带来明显的面积优势。

    尽管这项工作的学术贡献巨大，它却在更广泛的意义上影响和启发了其他研究者。这项工作展示了如何将定量分析用于可重构器件的架构和系统层面的研究，例如对某项特性的成本与优势分析等。此外，和商用可编程逻辑阵列相比，作者在系统架构层面有着截然不同而大胆的想法，而这也在微架构研究领域为其他研究者树立了一个创新思维的榜样。通常来讲，研究者都局限于商业器件，以及这些FPGA针对特定领域的优化，而这也在一定程度上限制了整个领域的创新和发展。

    总体来说，这项成果在几个方面产生了持久的影响：它设立了可重构计算的定量分析标准，并激励了一代研究人员探索动态重构的方法和应用。这项成果中包含的架构和设计思想，已经被很多研究团队和初创公司所采用。


    ### 2．使用高性能FPGA在250MHz频率下进行信号处理

    **一句话总结：**高性能FPGA设计的典范作品，使FPGA时钟频率大幅超越同期x86 CPU

    **英文名：**Signal processing at 250 MHz using high-performance FPGA''s

    **作者：**Brian von Herzen

    **发表时间：**1997年

    **推介人：**Andre DeHon（宾夕法尼亚大学），Steve Trimberger（DARPA，美国国防先进计划研究署，前赛灵思院士）

    这项成果是FPGA设计领域中令人振奋的力作，它展示了FPGA所能达到的最大性能，以及如何通过设计FPGA获取这样的性能。为了理解这项成果，有必要先介绍一下FPGA设计在1997年左右是什么样子的。当时的高时钟频率设计的典范是使用0.5μm和0.6μm工艺制造的英特尔奔腾CPU，只不过运行在75～100MHz。只有到了0.35μm工艺时，奔腾CPU才有可能在200MHz的时钟频率下运行。此外，当时的大多数FPGA设计都运行在25～40MHz。业界的基本共识是，FPGA必然会比ASIC或处理器的运行速度慢很多。

    '
  trans: '


    正因如此，尽管这项工作并没有专注于架构研究的重点和流行的部分，但它极大地帮助了这个领域向前迈进了一大步。这项工作通过提供更加高效的工具，使研究人员更有生产力，从而在另外一个角度帮助
    FPGA 架构研究带来了大量创新。


    ### 4．时序驱动的 FPGA 布局算法

    **一句话总结：**现代 FPGA 设计工具中的核心布局与时序优化算法

    **英文名：**Timing-driven placement for FPGAs

    **作者：**Alexander（Sandy）Marquardt，Vaughn Betz，Jonathan Rose

    **发表时间：**2000 年

    **推介人：**丛京生（加州大学洛杉矶分校）

    众所周知，VPR 是 FPGA 学术界最流行的开源 CAD 软件，几乎每个新的 FPGA 架构研究都使用了 VPR。而这项成果就详细阐述了在 VPR 中使用的时序驱动的布局算法。在这项成果中介绍的
    T-VPlace 算法，除了广受好评和广泛使用之外，它还对 FPGA 的布局算法有着三个重要的贡献。

    第一，在 T-VPlace 算法中，时序优化的过程是通过最小化延时与导线长度的加权和实现的。这个计算过程通过一个基于模拟退火（Simulated Annealing）的优化引擎完成。其中，每个节点的权值是该节点时序临界性的多项式函数。这项工作的结果表明，这种权值函数能够得到很好的时序收敛。此外，导线长度和时序都可以根据前一次的迭代进行自主归一化，这使得算法有着很好的稳定性。

    第二，这项工作表明，每个节点的时序裕量（Timing Slack）不需要随着逻辑单元的移动而不断更新。只需要在对每个温度进行的迭代完成之后，再进行精确的基于路径的时序分析即可。使用未更新的时序裕量通常并不会对时序优化造成影响，反而会大幅提升
    T-VPlace 算法的性能和效率。不过，后来的工作也表明，在高度流水线化的设计中，如果使用未更新的时序裕量会对性能造成负面影响。

    第三，在一个给定的分段可编程互连架构中，在源-汇节点间的延时不能简单地通过其曼哈顿距离来估计。然而，如果在布局期间使用一个布线器来计算每个源-汇节点之间的延时也是非常不现实的。因此，通过利用
    FPGA 架构中的对称性，T-VPlace 算法使用了一个预先计算的延时查找表，根据水平和垂直方向的距离作为索引，从而实现对延时的快速查找。

    通过以上三种技术，使得 T-VPlace 可以高效地产生高质量的时序优化结果。事实上，前两种技术同样可以被应用于其他集成电路设计的标准单元布局，而非 FPGA
    专属。可以说，T-VPlace 算法是现代 FPGA 布局布线算法的基石。作者所在的 RightTrack 公司在 2000 年被 Altera 收购后，T-VPlace
    及其优化技术就被整合进 Altera 的 Quartus 设计软件中，并被世界上成千上万的 FPGA 设计者所使用至今。


    ### 5．在商用计算机上的高质量、确定性的 FPGA 并行布局算法

    **一句话总结：**利用多核处理器显著降低 FPGA 项目编译时间的标志性工作

    **英文名：**High-Quality，Deterministic Parallel Placement for FPGAs on Commodity Hardware

    **作者：**Adrian Ludwin，Vaughn Betz，Ketan Padalia

    **发表时间：**2008 年

    **推介人：**Jonathan Rose（多伦多大学）

    FPGA 业界当前面临的最关键的问题之一是设计工具编译的时间过长，这一方面是由于计算机处理器的性能并没有质的飞跃，另外一方面是由于 FPGA 的大小随着半导体制造工艺的发展而不断增加，使得计算的复杂度也随之增长。为了应对这个问题，一个有效的方法是使用多个处理器核心进行并行编译。

    这项成果旨在加速 FPGA 设计流程中最慢的环节之一，即布局的并行化问题。在这个工作中，采用了几项非常独特而重要的方法。例如，这是目前首个，也是唯一一个尝试对工业级布局软件进行并行化的工作，并最终将成果转化为成功的商用软件。在此之前，尽管有很多工作试图对布局算法做并行化处理，它们其实都是基于学术版本的理想化算法，也就是说，这些工作并不需要应对海量的器件数据库、复杂的时序分析，以及在商业版软件中会遇到的各种细节问题。

    此外，这项工作对算法的确定性（Determinism）做了重要阐述。算法的确定性指，不管使用多少个处理器对算法进行计算，它的结果都会是完全相同的。尽管在学术界中存在争议，但确定性在商业软件中对于复现结果以及调试都是不可或缺的。这项成果表明，需要做一系列细致的工作以保证算法的确定性。此外，这项成果也证明了这些工作对性能的损失很小。这个工作还就内存架构对并行算法性能的影响进行了深入分析。值得注意的是，它表明不同的内存结构对算法性能的影响很大。

    总体来说，这项成果在算法性能方面取得了很大的提升：在布局阶段，使用 4 个处理器内核可以得到 2.2 倍的性能提升。对于大型设计，这样的性能提升会节省好几个小时的运行时间。在一个完整的
    FPGA 编译流程中，还存在着很多耗时的阶段，这也意味着需要做更多的工作，才能最终将 FPGA 项目的编译时间进一步缩短。但是，这项成果为实现这一目标做出了巨大的贡献，也是其他后续工作值得参考的典范。


    ## ■5.2.4　其他 EDA/CAD 算法篇

    本篇介绍了四种重要工作，集中在 FPGA 的计算机设计自动化领域。它们有的成为了现代 FPGA 设计工具中通用的逻辑映射方法，有的从理论层面对逻辑簇结构及其包装算法进行了深入研究，有的则对
    FPGA 的功耗提出了简单而强大的优化方法。


    ### 1．在基于 LUT 的 FPGA 映射中最小化逻辑深度和面积

    **一句话总结：**FPGA 逻辑映射算法的基础性工作

    **英文名：**Simultaneous depth and area minimization in LUT-based FPGA mapping

    **作者：**Jason Cong，Yean-Yow Hwang

    **发表时间：**1995 年

    **推介人：**Eugene Ding（赛灵思）

    这项成果对 FPGA 逻辑映射算法的发展起到了非常重要的推动作用。1994 年，Jason Cong 及团队发表了名为 FlowMap 的映射算法。它是首个有着多项式时间复杂度的映射算法，并且能在理论上对逻辑层数量达到最佳的优化。这个方法的核心思想是将
    K 输入 LUT 的映射问题，建模成一个最小高度、K 可行度的割问题（Minimum-height，K-feasible cut），而不是像传统方法那样基于局部的簇进行映射。

    FlowMap 算法本质上就是在一个保证最小高度的图上计算最小割的问题。虽然这个方法简单而高效，但它有可能会产生并使用小的 LUT，并且会产生大量的逻辑冗余，而这都会造成更高的面积成本。虽然作者也提出了一些后续处理的方法，以及考虑将非关键路径的高度约束进行适量放宽，但这些方法本质上都属于局部优化，因此并不属于这种基于全局割的理论框架。

    在这个工作中，作者提出了 CutMap 算法。相比它的“前任”FlowMap，这项成果能在多项式时间内完成深度优化（Depthoptimal）的映射结果，而且使用的
    LUT 数量会极大减少。

    这项成果有着以下几个关键性的贡献。首先，它使用了成本函数以控制割数的产生。这样，除了最小割之外，算法不仅可以找到所有的可行割，还能在映射过程中考虑次要的优化目标，甚至考虑多个并行的优化目标。其次，CutMap
    算法可以全局寻找共享逻辑的可能性、减少顺序依赖，以及将映射质量与逻辑网络的结构更加紧密地联系在一起。最后，它提出了一些剪枝规则，能帮助加速割计算的过程。虽然在今天看来，这里很多的想法和思路是显而易见的，但在当时，这些方法还并没有得到广泛应用。此外，CutMap
    方法在实践中表现很好，并成为了后续很多工作用来对比的基础性工作。

    基于割的多目标优化方法已经成为逻辑映射领域的标准性工作，而这并不局限在 FPGA 领域。正是这项工作推动了这一突破的不断发展。


    ### 2．割的排序和修剪：构建一个通用且高效的 FPGA 映射方法

    **一句话总结：**FPGA 映射算法的再一次跨越式性能提升

    **英文名：**Cut Ranking and Pruning：Enabling a General and Efficient FPGA Mapping
    Solution

    **作者：**Jason Cong，Chang Wu，Yuzheng Ding

    **发表时间：**1999 年

    **推介人：**Steve Wilton（英属哥伦比亚大学）

    这项成果通过割的生成、排序和修剪技术，极大地减少了 LUT 映射的复杂度和运行时间，从而提升了 LUT 逻辑映射的可扩展性。

    从最早的商用 FPGA 开始，查找表 LUT 就是大多数器件中实现逻辑功能的主要结构。如何将逻辑功能映射到 LUT 上，也一直是 FPGA CAD 工具所致力解决和优化的核心问题。正因为如此，在过去的很多年中，有大量的研究工作都在不断寻找高效的逻辑映射算法。

    这项工作发表于 1999 年，在此之前，FlowMap、Chortle、DFmap 等方法都已经发表了，研究者们也已经知道对 LUT 进行有效的逻辑映射是可行的。对于这项工作来说，它不只是介绍了一种新的算法，更是阐述了一些足够通用的技术原理。这些技术可以用来提高大部分逻辑映射算法的核心操作效率，而这也是这项工作最为重要的贡献之一。

    例如，这项工作讨论了割生成（Cut Generation）、割排序（Cut Ranking）和割修剪（Cut Pruning）。其中，割生成指的是如何构建一组割，割排序指的是如何对割进行评估和排序，割修剪指的是不重要的割会被丢弃和剪枝。对于大型电路来说，这些任务都有着很高的计算难度，因此急需高效的算法以应对这些问题。此外，这项工作还展示了如何使用这些技术对以往发表过的映射算法进行改进和性能提升。

    综上所述，这项成果已经成为任何 FPGA CAD 算法工程师必须掌握的理论技能，在实际的 FPGA 设计工具中这些技术也已经经过了多次迭代更新。时至今日，逻辑映射仍然是一个活跃的研究领域，这项发表于
    1999 年的工作也将会继续影响新的逻辑映射算法的出现和进步。


    ### 3．使用基于簇的逻辑块和时序优先的包装算法来提升 FPGA 的速度和逻辑密度

    **一句话总结：**FPGA 簇结构包装算法的奠基之作

    **英文名：**Using Cluster-Based Logic Blocks and Timing-Driven Packing to Improve
    FPGA Speed and Density

    **作者：**Alexander（Sandy）Marquardt，Vaughn Betz，Jonathan Rose

    **发表时间：**1999 年

    **推介人：**Steve Wilton（英属哥伦比亚大学）

    这项成果首次对基于簇的逻辑块（Cluster-based Logic Blocks）的速度优势进行了量化分析。在 1999 年，在大部分的商用 FPGA 中都已经使用了基于簇的逻辑块，包括
    Altera 的 Flex 系列和赛灵思的 Virtex 系列等。然而，对于这种体系结构的建模和分析仍然处于起步阶段。在之前的工作中，Vaughn Betz
    已经证明基于簇的逻辑块结构可以提升逻辑密度。事实上，正如这项工作中所揭示的，基于簇的逻辑块的真正优势其实是在速度方面。正因此，这项工作开辟了一个全新的研究领域，即为众多的包装算法（Packing
    Algorithms）搭建了基础框架，并成为了所有 FPGA CAD 流程中的基础性部分。

    在这项工作中，作者首先描述了一个 CAD 流程（见图 5-11），以及适用于对这类架构进行分析的方法。然后，作者根据 Vaughn Betz 之前的工作，给出了一个参数化的簇架构，它被用来探究不同的基于簇的逻辑块结构。接下来，他们提出了一个名为
    T-VPACK 的算法，这个时序优先的算法负责将 LUT 和寄存器包装到逻辑簇中。通过实验验证，这项工作表明基于簇的逻辑块结构可以显著地提升 FPGA 的速度。此外，最优的簇大小是
    7～10 个逻辑单元。在此之后的很多年，这种簇大小一直都是学术界和工业界的体系结构标准。

    ![](img/Figure-P199_2096.jpg)

    图 5-11　FPGA 时序与面积分析流程图

    这项工作的真正价值在于，它为未来的研究人员开发新的簇包装算法、研究新的簇逻辑结构构建了理论基础。例如，后来的很多工作，包括 RPACK、iRAC、DVPack
    和 P-T-VPACK 等都建立在这项成果之上。当前，FPGA 里的簇逻辑结构已经越发重要。多伦多大学的这个课题组已经将簇逻辑结构的研究进行了极大的扩展，但这些扩展仍然保持着这项成果中提出的很多基本假设、评估方法以及体系结构框架。


    ### 4．FPGA 漏电流功耗的优化方法

    **一句话总结：**充分利用 FPGA 特性的无损功耗优化方法

    **英文名：**Active Leakage Power Optimization for FPGAs

    **作者：**Jason H. Anderson，Farid N. Najm，Tim Tuan

    **发表时间：**2004 年

    **推介人：**Russ Tessier（马萨诸塞大学）

    这项成果的主要贡献在于提出了一个简单的方法，可以显著地降低 FPGA 的漏电流功耗。在 FPGA 的特征尺寸大于 100nm 时，漏电流功耗通常是可以忽略不计的，FPGA
    设计工具也通常不考虑这种功耗的优化。然而随着 FPGA 的特征尺寸降至 100nm 以下，有越来越多的移动应用领域开始对 FPGA 产生了兴趣。要知道，在
    100nm 以内，总功耗超过 30%的部分都是漏电流功耗。但是对于 FPGA 来说，它不能像 ASIC 那样完全关闭器件的某个区域，以实现功耗优化的目的。此外，随着
    FPGA 被越来越广泛地应用于数据中心、移动通信等功耗敏感的领域，对 FPGA 功耗的要求也越来越严格。因此，漏电流功耗也随之成为了研究者关注和尝试优化的重要领域。

    通常来说，在对特定约束进行优化时，往往需要进行多方面的权衡。例如在一个设计中，为了在一个维度取得良好的结果，另一个或更多的其他维度有可能会变得更差。然而，这项成果所介绍的功耗优化技术很好地兼顾了多个设计维度。这个方法只需要进行一些轻度的
    FPGA 设计预处理，就可以节省高达 25%的静态功耗。除此之外，不需要牺牲额外的电路面积，抑或是损失系统性能。

    这项工作基于一个简单但十分有效的概念：如果 CMOS 三极管的栅极为逻辑 1 时，将漏极和源极也设置为逻辑 1，那么它的静态功耗就会降低。如果布线架构将其驱动的信号默认设置为逻辑
    1，那么互连架构的静态功耗也将大幅降低。由于 FPGA 有着可配置性，在大多数情况下可以对这些信号进行设置，由此就达成了功耗优化。

    这项成果的最大贡献之一，在于它所阐述的观点有着极大的通用性和互补性。该技术可以和任何其他的 FPGA 功耗优化方法一起使用，而不会对其他方法产生负面影响。在软件层面，实现该技术所需要的软件也十分简单。毫无疑问，这项成果是充分利用了
    FPGA 的灵活可配置性，并将简单的思想应用于重要领域的一个典型代表。


    ## ■5.2.5　FPGA 应用篇

    本篇介绍了 6 个 FPGA 应用领域的重要工作。它们有的为 FPGA 动态重构研究确立了坚实的理论和实践基础，有的首次探索了 FPGA 与虚拟化技术的结合与实现，有的则向世人展示了何为高效、高性能的
    FPGA 应用设计。


    ### 1．DPGA 的使用和应用领域

    **一句话总结：**FPGA 动态重构领域的奠基之作

    **英文名：**DPGA Utilization and Application

    **作者：**Andre DeHon

    **发表时间：**1996 年

    **推介人：**John Wawrzynek（加州大学伯克利分校）

    这项成果是最早研究 FPGA 动态重构（Runtime Reconfiguration）的工作之一，它为大量后续的工作奠定了坚实的基础。

    在这个工作中，作者深入分析了能够提升 FPGA 运行效率的器件架构和应用设计模式。在这项工作之前，有许多研究人员对于 FPGA 的动态重构功能非常着迷，有些研究已经构建了基于商用
    FPGA 的动态重构应用实例。其中，一个典型的工作是 Chris Jones 等人的“在无线视频编码中使用 FPGA 动态重构的问题研究”（Issues in
    Wireless Video Coding using Run-time-reconfigurable FPGAs）。然而，人们对于动态重构及其设计模式并没有一个清晰的理解。此外，对动态重构的成本和优势也缺乏量化标准和理论分析。

    Andre DeHon 很早就开始关注并思考这些问题。在 MIT 做研究生期间，他就在研究中引入了动态可重构器件这一概念。在这个工作中，他阐述了一组实用的设计模式，并严谨地展示了这些模式如何与动态可重构器件一起，为系统带来明显的面积优势。

    尽管这项工作的学术贡献巨大，它却在更广泛的意义上影响和启发了其他研究者。这项工作展示了如何将定量分析用于可重构器件的架构和系统层面的研究，例如对某项特性的成本与优势分析等。此外，和商用可编程逻辑阵列相比，作者在系统架构层面有着截然不同而大胆的想法，而这也在微架构研究领域为其他研究者树立了一个创新思维的榜样。通常来讲，研究者都局限于商业器件，以及这些
    FPGA 针对特定领域的优化，而这也在一定程度上限制了整个领域的创新和发展。

    总体来说，这项成果在几个方面产生了持久的影响：它设立了可重构计算的定量分析标准，并激励了一代研究人员探索动态重构的方法和应用。这项成果中包含的架构和设计思想，已经被很多研究团队和初创公司所采用。


    ### 2．使用高性能 FPGA 在 250MHz 频率下进行信号处理

    **一句话总结：**高性能 FPGA 设计的典范作品，使 FPGA 时钟频率大幅超越同期 x86 CPU

    **英文名：**Signal processing at 250 MHz using high-performance FPGA''s

    **作者：**Brian von Herzen

    **发表时间：**1997 年

    **推介人：**Andre DeHon（宾夕法尼亚大学），Steve Trimberger（DARPA，美国国防先进计划研究署，前赛灵思院士）

    这项成果是 FPGA 设计领域中令人振奋的力作，它展示了 FPGA 所能达到的最大性能，以及如何通过设计 FPGA 获取这样的性能。为了理解这项成果，有必要先介绍一下
    FPGA 设计在 1997 年左右是什么样子的。当时的高时钟频率设计的典范是使用 0.5μm 和 0.6μm 工艺制造的英特尔奔腾 CPU，只不过运行在 75～100MHz。只有到了
    0.35μm 工艺时，奔腾 CPU 才有可能在 200MHz 的时钟频率下运行。此外，当时的大多数 FPGA 设计都运行在 25～40MHz。业界的基本共识是，FPGA
    必然会比 ASIC 或处理器的运行速度慢很多。


    '
  toc: []
- raw: '然而，这项成果表明，在1997年就可以使用基于0.6μm工艺的赛灵思XC2100A FPGA以250MHz时钟频率运行。时至今日，这个性能对于大多数45nm
    FPGA器件的开发者来说都是可以接受的。


    诚然，为了实现这个性能确实需要对FPGA设计进行相当多的优化，包括仔细的布局、流水线设计，以及严格规划信号在一个周期内传输的距离和位置等。值得注意的是，这项工作阐述了整体的设计方法论，并为CAD工具及FPGA架构研究提出了很多前瞻性的指导，以充分发挥FPGA的最大性能。之后的很多研究，包括GARP、HSRA、CHESS、SFRA、Tabula等，以及互连重定时、流计算模型等，都是基于这个成果的发展。


    这项工作是FPGA应用领域研究的代表性成果之一。它展示了超越传统认知的FPGA性能结果，并详细说明了如何利用FPGA的架构特点来实现这一超越。这些都为FPGA相关的研究提供了宝贵经验，尽管这项成果的有些部分读起来比较晦涩，甚至像一份实验报告，但即使在今天，这项成果仍然有着很强的可读性，而且并不过时。


    ##### 3．基于FPGA的CORDIC算法研究综述


    **一句话总结：**使用FPGA进行高效算法实现的经典之作


    **英文名：**A survey of CORDIC algorithms for FPGA based computers


    **作者：**Ray Andraka


    **发表时间：**1998年


    **推介人：**Paul Chow（多伦多大学）


    这项工作详细阐述了如何在FPGA上进行高效的算法实现，它可以说是这一类工作的代表性作品。1998年，可编程DSP芯片被普遍用来做信号处理，当时最先进的器件有着128KB的片上内存，以及100
    MIPS的性能。对于FPGA而言，它能构建DSP无法完成的信号处理系统，但比开发一个ASIC又简单很多。1998年的FPGA比现在要小很多，有上千个4输入LUT，正如这项成果中采用的赛灵思4013E器件。因此，高效和小面积的DSP功能实现是这类FPGA设计的关键。


    自从发表以来，这项著名的成果一直是FPGA设计工程师在硬件中构建信号处理算法的重要参考。DSP算法中包含很多超越函数，如正弦、余弦等，然而在硬件中计算这些函数并不像软件中直接调用库函数那么简单。当信号处理工程师开始转向使用FPGA时，他们会通过这项成果意识到，为了实现高效的DSP算法，就需要使用不同的硬件架构和设计方案。具体来讲，这项成果阐述了CORDIC算法的基本理论，这个算法基于移位和加法运算，因此非常适合在FPGA上实现。


    传统的FPGA应用研究主要是探索某种具体应用在FPGA的实现方式。这项成果的不同点在于，它主要针对的是广大的应用设计工程师群体，并对这个群体进行技术传播和教育。这也使得它在更广的层面上不断影响后来的研究者。


    ##### 4．对流水线可重构FPGA的管理


    **一句话总结：**可重构计算与硬件虚拟化的首次结合与探索


    **英文名：**Managing Pipeline-Reconfigurable FPGAs


    **作者：**Srihari Cadambi，Jeffrey Weener，Seth Copen Goldstein，Herman Schmit，Donald
    E. Thomas


    **发表时间：**1998年


    **推介人：**Katherine Compton and Andre DeHon


    在1998年，即使是最大的FPGA也只有不过5万个LUT，因此在一个FPGA上往往很难装下整个设计。此外，即使设计在当前FPGA上可用，当下一代FPGA面市后，就不得不重新设计，至少需要对设计重新编译，以更好地利用新FPGA上更多的逻辑单元和容量。时至今日，FPGA上有着上百万可编程逻辑资源，因此大多数设计通常不会受制于FPGA的容量。然而，目前仍然缺乏对各代FPGA的兼容性与伸缩性的研究。


    这项成果中提出了PipeRench架构，它为FPGA开发者提供了动态重构的逻辑模型。它将计算看作是一个大型的静态前向图，并使用动态重构的方法来控制和交换电路中不同的部分。如果电路太大而无法由可用资源实现，那就将系统中的不同电路部分换入和换出，从而最终满足资源要求。


    PipeRench的独特之处在于，它展示了如何通过计算实现流水线重构，从而实现在有限的内存带宽时完成快速的配置切换。当一个PipeRench实例编译完成并得到FPGA映像之后，PipeRench还允许这个映像被加载到更大或者更小的其他PipeRench实例中，并伴随着相应的性能提升或下降。这就使得FPGA的弹性扩展成为可能。


    这项成果是一个开创性的大型系统项目，它涵盖了可重构计算的很多领域。这个工作阐述了配置数据的管理，并介绍了PipeRench架构的很多底层设计细节，它还讨论了可重构硬件的配置过程与机理，以及如何确保数据通过虚拟流水线达到合适的物理位置。综上，这项成果是可重构计算领域的标志性工作，它和它的后续工作为这个领域的研究者指明了前进的方向、可能遇到的问题，以及解决这些问题的一些创新方法。


    ##### 5．FPGA vs CPU：峰值浮点性能的趋势


    **一句话总结：**FPGA在浮点数计算领域的开创性工作


    **英文名：**FPGAs vs CPUs：Trends in Peak Floating-Point Performance


    **作者：**Keith Underwood


    **发表时间：**2004年


    **推介人：**Paul Chow（多伦多大学）


    这项工作表明，FPGA在未来的超级计算应用中有着很好的应用前景，而这个领域的应用往往需要密集的高精度浮点运算。从FPGA出现伊始，业界就有一种观点认为，FPGA可以被用来加速“计算”这一过程，尽管这并不是FPGA出现的初衷，也不是FPGA在当时的主要应用市场。在这项工作发表之时，FPGA已经展示出在定点数计算的潜力，特别是在信号处理领域中，使用FPGA比可编程DSP有着更好的性能优势。然而，大多数科学计算和应用都基于IEEE格式的浮点数，特别是双精度浮点数，以获得稳定的计算结果。在这项成果之前，人们普遍认为在FPGA上无法得到足够的浮点数性能来与当时的CPU竞争。


    在这个工作中，作者在多代FPGA中实现了浮点数加法、乘法、除法、乘加等基本运算，并对它们进行了时钟频率和硬件面积的定量分析。通过结合对应FPGA器件的容量，这项工作分析并得到了这些基本单元的最优性能的趋势曲线。根据摩尔定律，对于CPU来说，这些运算单元的性能趋势曲线都会每18个月翻一倍。然而对于FPGA，这项成果表明FPGA的浮点数峰值性能已经或即将超过CPU，并将继续增长。


    这项成果是第一个尝试定量分析并证明FPGA可以作为浮点运算加速器的工作。通过对模型的建立和分析，可以看出这个趋势在某种程度上有利于FPGA与CPU的相互竞争。这也证明了可重构计算研究依然前途光明。然而，客观地说，这项工作的结果在很大程度上依赖于计算的峰值性能，究竟如何在实际应用中获取这样的性能，以及峰值性能与实际性能的相关性，依然是研究者不断探讨的问题。


    ##### 6．FPGA高效多端口存储器的设计


    **一句话总结：**在根本上改变了现代FPGA的内存设计和容量


    **英文名：**Efficient Multi-Ported Memories for FPGAs


    **作者：**Charles Eric LaForest，J. Gregory Steffan


    **发表时间：**2010年


    **推介人：**Scott Hauck（华盛顿大学）


    FPGA的一个重要特性就是能构建大量简单的逻辑模块，然后可以将这些逻辑块组合起来，并形成更大、功能更复杂的设计。虽然FPGA中的每个可编程单元只有4～6个输入，但一组LUT就可以支持任意数量的输入，并完成任意功能的计算。虽然一个触发器只能存储1位数据，但这些触发器可以组合起来以支持32位数据，并再进行组合形成多级的FIFO。


    随着FPGA技术的不断演进，人们开始在FPGA里加入为了特定任务而优化的硬核单元，如乘法器、存储器，甚至处理器内核等。这些模块从根本上提升了FPGA进行通用计算的性能，但它们的相对不灵活性使得这些模块很难相互级联并组成更大的逻辑单元。另外，对于一个特定应用，如果这些硬核单元没有相对应的逻辑功能，那么设计者就很难继续使用它们，只能转而使用传统的方法，即使用LUT和寄存器等进行逻辑设计，这个问题的一个典型例子就是存储器。如果内存单元的容量太小，或者寻址空间不够大，我们或许还可以组合多个存储单元以满足设计需求。然而，如果存储器的端口数量是固定的，例如某个内存单元只能允许每周期写入两次，而应用要求每周期写入三次，那么这就很尴尬了。事实上，额外的读端口可以通过复制内存来实现，但对于RAM来说，独立的写端口数量才是影响性能的重点。


    这项工作从根本上解决了这个问题。一个重要的事实是，通常情况下底层硬件的运行速度会比用户设计的实际速度要快很多，因此就可以对内存端口进行时间复用以增加独立访存的数量。此外，通过巧妙的设计，多个内存可以被组合在一起，以支持读写带宽的增长，同时保持对整个机制的控制。如果将二者相结合，就可以得到一个提供更多内存端口的有效方案。


    ### 5.3　这是最好的时代——FPGA未来的发展方向


    纵观FPGA几十年的发展历程，目前FPGA的芯片结构、开发工具、使用场景等各个方面的发展，都已经远远超出FPGA出现时所设定的目标，甚至也远远超出很多人的想象。正是由于一代代研究者和工程师的不懈努力，才让FPGA在不同的时代背景下，都焕发出新的生机，并不断推动摩尔定律的延续。


    展望未来，FPGA领域仍然有着很多难题需要解决，也有着很多潜力巨大的方向，亟待学术界和工业界的研究者去探索和发现。如果仔细看一下四大FPGA顶级学术会议近年来发表的文章，并结合业界不断发布的最新成果和动态，就可以对FPGA未来的主要发展方向看出些许端倪。


    总体而言，高层次综合和人工智能应用仍然会是未来一段时间的主流。在学术界，FPGA四大顶级会议中每年大概有超过一半的文章都集中在这两个领域。这其中，既包括人工智能和机器学习与FPGA结合的相关工作，还包括FPGA高层综合相关的工作，如高层语言优化、工具和HLS算法设计等。而高层次综合也一直是过去5～10年间FPGA研究的重点和热点。例如，在2019年的FPGA大会上，与AI相关的文章有8篇，与HLS相关的文章有6篇，占会议接收的全部论文的一半还多。2020年的FPGA大会也延续了这一趋势，与AI和HLS相关的论文各有7篇和8篇。


    值得注意的是，人工智能和高层次综合这两个领域并非泾渭分明，而是相互耦合、相互促进和相互激发的。很多文章同时讨论了使用HLS对人工智能应用进行设计和加速。例如，在本书HLS章节中介绍过的，2019年丛京生教授与张志如副教授就合作开发了名为HeteroCL的基于Python的硬件加速模型，这项工作可以帮助AI和Python开发者利用FPGA迅速完成AI图形图像算法的开发和硬件实现。类似的工作还有很多，由此可见高层次综合，特别是领域专用的高层次综合工具和算法的设计研发，将会是未来FPGA发展的一个重要方向。有了更先进、更易用的开发工具，会促使更多软件和算法工程师开始使用FPGA作为他们算法和软件实现的硬件平台，从而进一步正向促进FPGA的发展。


    此外，FPGA在AI领域的应用也会越来越广泛。在第3章，我们介绍过人工智能算法目前正在经历爆炸式发展，但距离稳定和成熟可能还有一段路要走。为了不断提升算力，同时兼顾功耗、成本和灵活性的要求，采用FPGA进行定制化架构设计就成为了一个性价比很高的选择。在这个领域中，FPGA微架构设计、AI加速资源的扩展、对数据吞吐量的提升等方向，会成为今后发展的重点。


    在数据中心领域，FPGA也在开始扮演越来越重要的角色。在第2章，我们介绍了很多FPGA加速云计算和大数据处理的实际例子，例如微软的Catapult项目和亚马逊AWS的F1实例等。除了云计算之外，电信网络提供商也在使用FPGA对自身的网络架构进行转型。这主要受到当前软件定义网络（SDN）和网络功能虚拟化（NFV）的强力推动。在第2章中也提过，如何有效利用FPGA这种可编程硬件加速资源，探索并推广FPGA在数据中心里的高效部署方法，如何对这类应用场景设计有效的商业模型，以及对部署FPGA带来的安全性问题等，都将是未来一段时间内业界的研究重点。


    另外，随着业界对摩尔定律存续问题的讨论不断升温，如何进一步延续芯片的性能提升，并不断降低芯片的功耗，一直是学术界和工业界投入大量人力物力的重要研究方向。我们看到，近年来新型FPGA架构层出不穷，各类最新的IP、制造工艺、封装技术等尖端科技，都将FPGA作为主要的实现载体，这在第1章中也有过详细介绍。可以预见的是，当半导体制造工艺逼近原子极限，更多诸如SSI、EMIB、3D
    IC等“黑科技”会不断涌现，而FPGA也会像现在这样成为这些黑科技的集大成者。另一方面，量子计算、类脑计算、存内计算等全新的计算模式也会纷纷上场，并呈现百花齐放的局面。如何将这些新型计算模式与现有的基于FPGA的可重构计算相互融合和补充，会是非常有趣的研究方向。


    ### 5.4　本章小结


    FPGA自诞生之日起，就在摩尔定律的指引下不断发展和进化。FPGA从一个单纯负责粘合逻辑或原型验证的简单芯片，逐步蜕变成为汇集现代最新科技、架构、IP与开发方法的复杂片上系统SoC，并仍然在技术的道路上不断高速前进。之所以能取得这些令人瞩目的成就，全部都归功于那些在FPGA领域不断探索、发明和创新的一代代研究者。他们作为建筑师，架构起了这个领域，并不断推动FPGA和可重构计算技术的发展。


    本章介绍了很多FPGA领域的知名学者，以及他们在过去几十年间做出的贡献和取得的成果。可以看到，虽然当前FPGA的研究领域还是以欧美学者为主，但我国的FPGA学术研究已经在过去的几年间取得了突飞猛进的成就，特别是在人工智能和FPGA开发工具等领域，我国学者的很多工作和技术成果都开始跃居世界前列。除此之外，我们的学术成果转化和商业FPGA发展也在不断加速前行，深鉴、寒武纪、地平线等初创企业都逐渐成为了各自领域的全球领军者。


    这是FPGA最好的时代，也是芯片技术最好的时代。笔者相信，芯片作为人类文明史上最重要的成就之一，会继续推动更多的社会进步与技术创新。FPGA作为一种重要的芯片类别，将会在人工智能、大数据、云计算等多个领域不断焕发新生。而FPGA蕴含的技术思想，也将持续启发一代代智慧的研究者不断创新。'
  fmt: '

    然而，这项成果表明，在1997年就可以使用基于0.6μm工艺的赛灵思XC2100A FPGA以250MHz时钟频率运行。时至今日，这个性能对于大多数45nm
    FPGA器件的开发者来说都是可以接受的。


    诚然，为了实现这个性能确实需要对FPGA设计进行相当多的优化，包括仔细的布局、流水线设计，以及严格规划信号在一个周期内传输的距离和位置等。值得注意的是，这项工作阐述了整体的设计方法论，并为CAD工具及FPGA架构研究提出了很多前瞻性的指导，以充分发挥FPGA的最大性能。之后的很多研究，包括GARP、HSRA、CHESS、SFRA、Tabula等，以及互连重定时、流计算模型等，都是基于这个成果的发展。


    这项工作是FPGA应用领域研究的代表性成果之一。它展示了超越传统认知的FPGA性能结果，并详细说明了如何利用FPGA的架构特点来实现这一超越。这些都为FPGA相关的研究提供了宝贵经验，尽管这项成果的有些部分读起来比较晦涩，甚至像一份实验报告，但即使在今天，这项成果仍然有着很强的可读性，而且并不过时。


    ### 3. 基于FPGA的CORDIC算法研究综述

    一句话总结：使用FPGA进行高效算法实现的经典之作

    英文名：A survey of CORDIC algorithms for FPGA based computers

    作者：Ray Andraka

    发表时间：1998年

    推介人：Paul Chow（多伦多大学）


    这项工作详细阐述了如何在FPGA上进行高效的算法实现，它可以说是这一类工作的代表性作品。1998年，可编程DSP芯片被普遍用来做信号处理，当时最先进的器件有着128KB的片上内存，以及100
    MIPS的性能。对于FPGA而言，它能构建DSP无法完成的信号处理系统，但比开发一个ASIC又简单很多。1998年的FPGA比现在要小很多，有上千个4输入LUT，正如这项成果中采用的赛灵思4013E器件。因此，高效和小面积的DSP功能实现是这类FPGA设计的关键。


    自从发表以来，这项著名的成果一直是FPGA设计工程师在硬件中构建信号处理算法的重要参考。DSP算法中包含很多超越函数，如正弦、余弦等，然而在硬件中计算这些函数并不像软件中直接调用库函数那么简单。当信号处理工程师开始转向使用FPGA时，他们会通过这项成果意识到，为了实现高效的DSP算法，就需要使用不同的硬件架构和设计方案。具体来讲，这项成果阐述了CORDIC算法的基本理论，这个算法基于移位和加法运算，因此非常适合在FPGA上实现。


    传统的FPGA应用研究主要是探索某种具体应用在FPGA的实现方式。这项成果的不同点在于，它主要针对的是广大的应用设计工程师群体，并对这个群体进行技术传播和教育。这也使得它在更广的层面上不断影响后来的研究者。


    ### 4. 对流水线可重构FPGA的管理

    一句话总结：可重构计算与硬件虚拟化的首次结合与探索

    英文名：Managing Pipeline-Reconfigurable FPGAs

    作者：Srihari Cadambi，Jeffrey Weener，Seth Copen Goldstein，Herman Schmit，Donald E.
    Thomas

    发表时间：1998年

    推介人：Katherine Compton and Andre DeHon


    在1998年，即使是最大的FPGA也只有不过5万个LUT，因此在一个FPGA上往往很难装下整个设计。此外，即使设计在当前FPGA上可用，当下一代FPGA面市后，就不得不重新设计，至少需要对设计重新编译，以更好地利用新FPGA上更多的逻辑单元和容量。时至今日，FPGA上有着上百万可编程逻辑资源，因此大多数设计通常不会受制于FPGA的容量。然而，目前仍然缺乏对各代FPGA的兼容性与伸缩性的研究。


    这项成果中提出了PipeRench架构，它为FPGA开发者提供了动态重构的逻辑模型。它将计算看作是一个大型的静态前向图，并使用动态重构的方法来控制和交换电路中不同的部分。如果电路太大而无法由可用资源实现，那就将系统中的不同电路部分换入和换出，从而最终满足资源要求。


    PipeRench的独特之处在于，它展示了如何通过计算实现流水线重构，从而实现在有限的内存带宽时完成快速的配置切换。当一个PipeRench实例编译完成并得到FPGA映像之后，PipeRench还允许这个映像被加载到更大或者更小的其他PipeRench实例中，并伴随着相应的性能提升或下降。这就使得FPGA的弹性扩展成为可能。


    这项成果是一个开创性的大型系统项目，它涵盖了可重构计算的很多领域。这个工作阐述了配置数据的管理，并介绍了PipeRench架构的很多底层设计细节，它还讨论了可重构硬件的配置过程与机理，以及如何确保数据通过虚拟流水线达到合适的物理位置。综上，这项成果是可重构计算领域的标志性工作，它和它的后续工作为这个领域的研究者指明了前进的方向、可能遇到的问题，以及解决这些问题的一些创新方法。


    ### 5. FPGA vs CPU：峰值浮点性能的趋势

    一句话总结：FPGA在浮点数计算领域的开创性工作

    英文名：FPGAs vs CPUs：Trends in Peak Floating-Point Performance

    作者：Keith Underwood

    发表时间：2004年

    推介人：Paul Chow（多伦多大学）


    这项工作表明，FPGA在未来的超级计算应用中有着很好的应用前景，而这个领域的应用往往需要密集的高精度浮点运算。从FPGA出现伊始，业界就有一种观点认为，FPGA可以被用来加速“计算”这一过程，尽管这并不是FPGA出现的初衷，也不是FPGA在当时的主要应用市场。在这项工作发表之时，FPGA已经展示出在定点数计算的潜力，特别是在信号处理领域中，使用FPGA比可编程DSP有着更好的性能优势。然而，大多数科学计算和应用都基于IEEE格式的浮点数，特别是双精度浮点数，以获得稳定的计算结果。在这项成果之前，人们普遍认为在FPGA上无法得到足够的浮点数性能来与当时的CPU竞争。


    在这个工作中，作者在多代FPGA中实现了浮点数加法、乘法、除法、乘加等基本运算，并对它们进行了时钟频率和硬件面积的定量分析。通过结合对应FPGA器件的容量，这项工作分析并得到了这些基本单元的最优性能的趋势曲线。根据摩尔定律，对于CPU来说，这些运算单元的性能趋势曲线都会每18个月翻一倍。然而对于FPGA，这项成果表明FPGA的浮点数峰值性能已经或即将超过CPU，并将继续增长。


    这项成果是第一个尝试定量分析并证明FPGA可以作为浮点运算加速器的工作。通过对模型的建立和分析，可以看出这个趋势在某种程度上有利于FPGA与CPU的相互竞争。这也证明了可重构计算研究依然前途光明。然而，客观地说，这项工作的结果在很大程度上依赖于计算的峰值性能，究竟如何在实际应用中获取这样的性能，以及峰值性能与实际性能的相关性，依然是研究者不断探讨的问题。


    ### 6. FPGA高效多端口存储器的设计

    一句话总结：在根本上改变了现代FPGA的内存设计和容量

    英文名：Efficient Multi-Ported Memories for FPGAs

    作者：Charles Eric LaForest，J. Gregory Steffan

    发表时间：2010年

    推介人：Scott Hauck（华盛顿大学）


    FPGA的一个重要特性就是能构建大量简单的逻辑模块，然后可以将这些逻辑块组合起来，并形成更大、功能更复杂的设计。虽然FPGA中的每个可编程单元只有4～6个输入，但一组LUT就可以支持任意数量的输入，并完成任意功能的计算。虽然一个触发器只能存储1位数据，但这些触发器可以组合起来以支持32位数据，并再进行组合形成多级的FIFO。


    随着FPGA技术的不断演进，人们开始在FPGA里加入为了特定任务而优化的硬核单元，如乘法器、存储器，甚至处理器内核等。这些模块从根本上提升了FPGA进行通用计算的性能，但它们的相对不灵活性使得这些模块很难相互级联并组成更大的逻辑单元。另外，对于一个特定应用，如果这些硬核单元没有相对应的逻辑功能，那么设计者就很难继续使用它们，只能转而使用传统的方法，即使用LUT和寄存器等进行逻辑设计，这个问题的一个典型例子就是存储器。如果内存单元的容量太小，或者寻址空间不够大，我们或许还可以组合多个存储单元以满足设计需求。然而，如果存储器的端口数量是固定的，例如某个内存单元只能允许每周期写入两次，而应用要求每周期写入三次，那么这就很尴尬了。事实上，额外的读端口可以通过复制内存来实现，但对于RAM来说，独立的写端口数量才是影响性能的重点。


    这项工作从根本上解决了这个问题。一个重要的事实是，通常情况下底层硬件的运行速度会比用户设计的实际速度要快很多，因此就可以对内存端口进行时间复用以增加独立访存的数量。此外，通过巧妙的设计，多个内存可以被组合在一起，以支持读写带宽的增长，同时保持对整个机制的控制。如果将二者相结合，就可以得到一个提供更多内存端口的有效方案。


    ## 5.3 这是最好的时代——FPGA未来的发展方向

    纵观FPGA几十年的发展历程，目前FPGA的芯片结构、开发工具、使用场景等各个方面的发展，都已经远远超出FPGA出现时所设定的目标，甚至也远远超出很多人的想象。正是由于一代代研究者和工程师的不懈努力，才让FPGA在不同的时代背景下，都焕发出新的生机，并不断推动摩尔定律的延续。


    展望未来，FPGA领域仍然有着很多难题需要解决，也有着很多潜力巨大的方向，亟待学术界和工业界的研究者去探索和发现。如果仔细看一下四大FPGA顶级学术会议近年来发表的文章，并结合业界不断发布的最新成果和动态，就可以对FPGA未来的主要发展方向看出些许端倪。


    总体而言，高层次综合和人工智能应用仍然会是未来一段时间的主流。在学术界，FPGA四大顶级会议中每年大概有超过一半的文章都集中在这两个领域。这其中，既包括人工智能和机器学习与FPGA结合的相关工作，还包括FPGA高层综合相关的工作，如高层语言优化、工具和HLS算法设计等。而高层次综合也一直是过去5～10年间FPGA研究的重点和热点。例如，在2019年的FPGA大会上，与AI相关的文章有8篇，与HLS相关的文章有6篇，占会议接收的全部论文的一半还多。2020年的FPGA大会也延续了这一趋势，与AI和HLS相关的论文各有7篇和8篇。


