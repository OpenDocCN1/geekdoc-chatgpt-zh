- raw: 'FPGA的第三个主要特点，就是它的“现场”可编程性。“现场”这个词指的是，FPGA可以在使用时进行编程，而无须将芯片拆下并返回生产厂家完成编程。这个特点在现在看起来有些理所当然，毕竟目前的大部分芯片都有着现场编程能力，而且这也并非FPGA专有的特点。事实上，现场可编程这个特点的存在有着背后的历史原因。在20世纪80年代以前，芯片的固件大都是保存在掩膜ROM（mask
    ROM）或者基于熔丝的PROM里，只能读取而不能写入，更不用说多次写入了。后来出现了能擦写的PROM（EPROM），但擦写过程非常复杂，需要使用特殊设备，对芯片进行长时间的强紫外线照射，这个过程并不能在芯片的使用现场完成。在20世纪80年代之后，人们发明了EEPROM和闪存（Flash
    memory），这才使得现场可编程成为可能。对于现代FPGA而言，人们可以每隔几秒就改变一次FPGA芯片上运行的硬件设计，这也使得FPGA有着极大的灵活性。


    由此我们知道了，FPGA作为一种包含大量逻辑门阵列的芯片，可以在使用现场通过编程改变自身的硬件逻辑，并在理论上可以实现任何数字电路的功能。人们对于FPGA有着很多形象的比喻，有人把它比成乐高积木，通过很多基本的积木单元，可以组成汽车、高楼和飞船；也有人把它比成活字印刷，使用一个个字膜，就可以排列组合成任意的诗词歌赋。这些比喻都形象地突出了FPGA的最大特点：灵活性和通用性。


    随着半导体和芯片技术飞速发展至今，FPGA早已不再是面世之初的简单的可编程门阵列。除了可编程逻辑单元之外，FPGA芯片逐渐变得越来越复杂，并结合最新的半导体制造技术，衍生出了很多不同的架构和设计。在本章接下来的部分，我们将首先回顾FPGA发展的三个重要阶段，以及当前最新的FPGA架构变革与技术突破，特别是3D芯片封装技术在FPGA上的使用。最后，我们将以赛灵思和英特尔最新的高端FPGA产品为例，详细分析这些FPGA上采用了哪些当代最新的尖端科技。通过这些内容，相信大家会对FPGA的发展脉络建立一个完整而清晰的认识，并深入了解当前FPGA芯片采用的新工艺、新架构和新技术。


    ### 1.2　从无到有，从小到大，从大到强——FPGA发展的三个阶段


    FPGA的架构一直伴随着摩尔定律不断演进，与其他类型的芯片相比，FPGA可以说是当前最先进半导体技术的集大成者。1984年，赛灵思（Xilinx）推出了第一款商用FPGA-XC2064，如图1-4所示。在这个FPGA上，只有64个可编程逻辑单元、2个3输入查找表（LUT）、总共800个逻辑门。35年后，英特尔在2019年底推出了当今世界上最大的FPGA，这款名为Stratix10
    GX 10M的FPGA芯片，基于英特尔14nm工艺制造，有着433亿只晶体管、1020万个可编程逻辑单元，以及2304个可编程I/O。


    ![](OEBPS/Images/Figure-P23_429.jpg)


    图1-4　世界上首枚商用FPGA-XC2064


    可以看到，在这35年间，FPGA的芯片架构发生了极其巨大的变化，用翻天覆地来形容也不为过。在这期间，有多次根本性的架构变革，它们奠定了现代FPGA架构的核心和发展方向。这些架构变革发生的根本原因，都是基于FPGA新兴应用的驱动。


    前赛灵思院士，在FPGA和芯片架构领域拥有超过200项专利的Steve Trimberger博士曾把FPGA的发展历程大致划分为三个阶段，即发明阶段（the
    age of invention）、扩张阶段（the age of expansion）、累积阶段（the age of accumulation）。这三个发展阶段，也分别代表了FPGA技术从无到有、从小到大、从大到强的发展过程，见证了FPGA从单纯的可编程逻辑单元，逐渐发展到拥有成百上千万个可编程逻辑单元的大型阵列，再发展到集成了各类硬件资源、IP核，甚至处理器内核的复杂片上系统，并形成当前丰富的FPGA产品门类，在各类应用场景中得到越来越广泛的使用。


    #### ■1.2.1　发明阶段：历史的必然


    FPGA的发明阶段横跨20世纪80年代和90年代。当时的芯片设计与生产模式与现在有着较大的不同。在当时，无晶圆厂模式尚未兴起，ASIC公司只有在客户的设计投入生产时才赚钱。然而由于开发过程中需求的变化、流片失败，或者存在无法通过固件升级进行修复的设计漏洞，往往只有1/3的芯片设计实际投入生产。也就是说，在当时有2/3的芯片项目是赔钱的。由于芯片的流片成本巨大，业界急需一种通用的半导体器件，用来进行流片前的测试、验证等工作，从而减少流片失败的可能性。在这个大环境下，可编程逻辑器件应运而生，而这也是FPGA的前身。


    正如前文提到的那样，FPGA的本质也是一种芯片，它的主要特殊之处是当制造出来后，可以根据不同用户的需求，通过编程来改变自身的逻辑功能，而且这个过程可以重复进行。同时，FPGA使用固定的开发工具和开发环境，而不需要像ASIC那样开发定制化的工具链。这样一来，不同的ASIC芯片可以在流片前使用相同的FPGA进行测试和验证，这使得ASIC厂商流片前的成本和风险得到了大幅降低。


    以现在的标准来看，赛灵思推出的业界第一款FPGA-XC2064更像是一个“玩具”。这个售价55美元的芯片由2.5μm工艺制造，只有64个逻辑单元，以及不超过1000个逻辑门。也就是说，实现一个简单的64位移位寄存器就会占用XC2064的全部片上逻辑。然而在当时看来，作为ASIC流片前的硬件仿真与验证平台，FPGA本身的性能并没有那么重要。此时业界需要的，只是一堆相互连接的可编程逻辑门而已。因此，XC2064的问世，在当时依然引发了不小的轰动。到了20世纪90年代，FPGA芯片的主体架构也在慢慢发展，并逐渐演变成为了现在我们熟悉的可编程逻辑阵列的结构，如图1-5所示。


    ![](OEBPS/Images/Figure-P25_448.jpg)


    图1-5　FPGA的基本架构


    #### ■1.2.2　扩张阶段：设计自动化的兴起


    20世纪末是摩尔定律大放异彩的时代。在摩尔定律的指引下，半导体行业在这十几年里经历了飞速发展。与之对应的，FPGA在1992年到1999年之间迎来了自己的扩张阶段。此时由于芯片制程技术的持续突破，制造大尺寸的芯片已经不像以前那么困难了。对于FPGA来说，不断提升自身的容量就成为了自然而然的选择。FPGA包含的逻辑单元、I/O引脚、时钟和布线等片上资源的数量都在持续增加。伴随着FPGA容量的增长，曾经非常宝贵的芯片面积也逐渐变得相对廉价，这也直接影响了很多电路设计方法论的发展。例如，在此时就出现了“面积换性能”之类的电路设计方法。


    更大的芯片面积也给FPGA的架构创新提供了更多的想象空间。例如，FPGA可编程单元中的LUT查找表结构，从最初的三输入，开始变成四输入和六输入，甚至更多。在这些基本的可编程单元内部，还逐渐增加了寄存器和多路选择器等更多额外功能。渐渐地，这些FPGA片上资源的互连复杂性已经开始取代逻辑结构的复杂性，并成为FPGA厂商需要优先解决的问题。


    与前一个阶段相比，在扩张阶段发生的另一个主要的变化就是FPGA自动设计工具和软件的兴起。由于FPGA结构变得越来越复杂，出现了针对FPGA进行优化设计的自动综合、布局和布线的EDA工具，使用这些工具进行FPGA设计，也逐渐成为了FPGA开发的主流方法。和ASIC设计不同的是，FPGA厂商并没有依赖传统EDA公司提供的这些设计工具，而是走了自主研发的道路。这是由于FPGA公司敏锐地认识到，只有将EDA技术掌握在自己手中，才能牢牢把握FPGA发展的未来。而这个看法，现在已被证明是绝对的真理。FPGA厂商针对自家FPGA产品开发的设计自动化工具，如英特尔（原Altera）的Quartus系列、赛灵思的ISE和Vivado系列等，一直被认为是这些公司“皇冠上的明珠”。早年间，由于各个厂商FPGA主体架构都比较相似，如何优化自家的设计工具，以取得更加出色的性能，就成为了FPGA厂商努力竞争的主战场。这些EDA工具中包含的各种专利与技术机密，也为这些公司构建了深厚的技术护城河。


    #### ■1.2.3　累积阶段：复杂片上系统的形成


    进入21世纪，FPGA的发展进入了累积阶段。人们发现，FPGA的发展此时遭遇了瓶颈，因为单纯提升FPGA的容量已经不能满足各类应用的需求。同时，很多客户开始追求更高的性价比，并不愿意为过大的FPGA买单。在这个大环境下，FPGA开始从单纯的可编程门阵列，逐步转变为拥有复杂功能的可编程片上系统。除了进一步改进可编程逻辑单元本身的微架构之外，FPGA厂商还在FPGA的易用性上做足了功夫。例如，它们推动定义了诸多标准化的数据传输协议，方便不同设计和模块之间的互连与通信。它们还为很多重要而常见的功能开发了可以重复使用的IP核，例如软核微处理器（英特尔/Altera的NIOS，赛灵思的MicroBlaze）、存储控制器和各种通信协议栈等，可以供客户直接调用而无须再从头制造轮子。


    与此同时，很多专用的逻辑单元也被添加到FPGA器件中，并逐渐成为现代FPGA的“标配”。例如，用于数学计算的加法进位链、乘法器、定点与浮点DSP单元，固定容量的片上存储器，以及各种速率的串行收发器和物理接口等。随着人工智能的兴起，AI引擎、可变精度的DSP等针对AI应用开发的IP核也被固化到FPGA中。可以看到，现代FPGA已经成为了各类全新科技的集大成者，而这也会反过来促使FPGA在更多应用场景里被使用。


    那么，随着半导体技术的进一步发展，FPGA下一步会如何进化，以不断突破芯片维度和集成度的限制，并进一步为摩尔定律续命？当摩尔定律行将终结的时候，FPGA的架构又会发生怎样的改变，以适应下一个半导体行业发展的全新周期？在本章接下来的部分，我们将继续深入探究这些问题。


    ### 1.3　超越维度的限制——3D FPGA


    在过去的几十年中，半导体和芯片技术在摩尔定律的指引下得到了飞速发展，然而近年来，人们注意到这种增长速度有逐渐放缓的趋势，很多人因此开始质疑摩尔定律在目前是否仍然有效，“摩尔定律已死”的声浪也不绝于耳。


    从单一晶体管的角度来说，半导体技术的革新从未停歇，例如，科学家已经制造出了单原子甚至单电子的晶体管，也可以对单个原子的位置进行移动和调整，以取得更好的晶体管性能。但从整个半导体产业的角度来看，这未必是下一步的发展方向。当前人们遇到的问题并不是能不能造出来这样小尺寸的单一晶体管，而是能否造出一个包含100亿个这样晶体管的芯片。也就是说，这本质上是个经济问题。因为在理论上，我们是可以制造更小的设备和器件的，但能否让这些设备稳定工作，并以足够低的成本进行生产和销售，则是当前产业亟待思考的问题。


    当晶体管的尺寸逐渐接近原子极限时，再使用传统的晶体管制造技术已经几乎不可能了。传统的晶体管结构曾经非常简单，而现在已经演变成了以FinFET晶体管为代表的非常复杂的3D结构。此外，制造芯片的半导体材料、设备、封装与测试等全产业链都需要同步发展。同样地，由这些晶体管组成的芯片架构也要不断进化，从而继续保持芯片性能的不断进步。


    例如，当芯片在水平维度的扩展逼近技术极限之后，科学家和工程师们就开始探索在垂直方向上对芯片密度进行扩展的可能，并由此发明了3D芯片封装技术。在FPGA领域，厂商采用的3D芯片技术主要有两种：赛灵思的堆叠硅片互联（SSI）技术，以及英特尔的嵌入式多管芯互联桥接（EMIB）技术。


    #### ■1.3.1　赛灵思堆叠硅片互联（SSI）技术


    在每一代半导体工艺早期，工艺和生产技术尚未成熟，因此良率往往较低，对于面积较大的芯片而言更是如此。研究表明，如果硅片面积为6cm²，使用泊松良率模型推断后，其在工艺早期的良率仅为0.25%。也就是说，此时在一个12英寸的晶圆上仅能产出0.3个能正常工作的芯片。然而，如果硅片面积只有1.5cm²，良率则会高达22%。此时，在同样的一个12英寸的晶圆上会产出107个能正常工作的芯片，如图1-6所示。由此可见，在工艺早期，不同硅片面积大小会带来巨大的良率落差。


    ![](OEBPS/Images/Figure-P29_487.jpg)


    图1-6　工艺早期不同面积的裸晶良率与产量的关系


    有意思的是，如果可以将上例中的4个1.5cm²的硅片通过某种方式“组合”成一枚6cm²的芯片，那么同样的晶圆就可以产出平均26.75枚芯片，并随之带来超过100倍的产能提升。这便是赛灵思采用的堆叠硅片互联（Stacked
    Silicon Interconnect，SSI）技术产生的主要背景。


    堆叠硅片互联（SSI）技术示意图如图1-7所示。和传统封装技术相比，SSI技术在封装基板（Package Substrate）和FPGA硅片之间加入了一层无源硅中介层（Silicon
    Interposer）。在硅中介层上可以放置多枚FPGA硅片。这些硅片通过在中介层里的硅通孔（Through Silicon Vias，TSV）、微凸块（Microbumps）以及大量连线进行相互连接。


    ![](OEBPS/Images/Figure-P30_495.jpg)


    图1-7　堆叠硅片互联（SSI）技术示意图


    在这个结构里，微凸块用来连接FPGA硅片上的各类引脚；硅通孔负责将硅片的电源、接地以及I/O接口通过C4凸块连接到封装基板；在硅中介层中，有着上万条连线将相邻的两枚FPGA硅片进行互连。在SSI技术中，硅通孔是它的核心创新点与技术难点。由于TSV通过蚀刻工艺制造，而非激光钻孔，因此对制造工艺有着严格要求。为了降低系统的制造难度，中介层会使用已经十分成熟的工艺而非最新的工艺制程进行加工，例如65nm工艺等。在硅中介层中，也不包含晶体管等有源器件，这样可以保证较高的良率，降低制造风险和系统的静态功耗。


    使用SSI技术最主要的优点：能在每代半导体制造工艺的早期，快速生产出良率高的大型FPGA器件，加快了产品面世周期，从而能快速抢占市场，尤其是高端市场。此外，当制造工艺逐渐成熟，并可以生产良率较高的大型单硅片FPGA器件时，使用SSI这种基于硅中介层的技术也能通过组合多枚硅片集成更多的可编程逻辑单元。


    在2017年的HotChips大会上，赛灵思发布了Virtex UltraScale+HBM系列FPGA，其中仍然使用了基于第四代硅中介层的技术来组合3枚16nm
    FPGA，以及2枚32GB的高带宽存储芯片（High Bandwidth Memory，HBM），如图1-8所示。


    ![](OEBPS/Images/Figure-P31_503.jpg)


    图1-8　Virtex UltraScale+HBM FPGA结构图（图片来自赛灵思）


    #### ■1.3.2　SSI技术的主要缺点


    尽管SSI技术能在半导体制造工艺初期大幅提升良率，它的缺点也同样明显。总结起来主要有以下4点。


    （1）如前文所述，SSI技术特别适用于每代半导体制造工艺的早期。此时制造大型硅片的工艺并不成熟，以至于良率较低。不过，当工艺成熟后，良率会明显上升，这时采用SSI技术的好处就不明显了。在开头的例子中，当工艺成熟后，制造6cm²硅片的良率会从一开始的0.25%猛增至55%，制造1.5cm²硅片的良率会从22%上升至86%。这样一来，一块12英寸的晶圆可以产出66.9片6cm²的硅片，以及104.6片4×1.5cm²的硅片，产量差别已然不大。同时，制造硅中介层、TSV以及在同一封装内组装多枚硅片的成本就会在此时逐步显现，导致整体的成本优势进一步减弱。


    （2）和一片完整的大型FPGA硅片相比，将多枚FPGA硅片通过硅中间层组合可能会显著降低芯片的性能。这里对性能的影响来自于很多方面，例如在垂直方向上，由于硅中间层的引入，为了连接硅片引脚和封装引脚，就需要先后经过包括TSV在内的很多额外结构，这势必造成延时的增加。相比之下，在单芯片结构里由于没有这些额外结构，信号只需经过封装基板内的导线即可。


    在水平方向上，硅中介层中的导线和微凸块也会带来额外的延迟开销。研究表明，对于一个尺寸为7mm×12mm的硅片而言，其中的微凸块可能分布在距离芯片边界为2.25mm的“远方”。此时如果将两个硅片进行互连，在中介层中的导线长度会非常可观，从而可能带来1ns左右的线路延时。相比之下，FPGA片上的延时才不过几百ps，大概只是前者的1/10。


    在2014年，多伦多大学Andre Pereira和Vaughn Betz等人在FPGA国际研讨会发表的研究结果指出，硅片间由中介层带来的延时会对系统性能带来消极影响。例如，当中介层的互连延时造成关键路径增加0.5ns，1ns或1.5ns时，系统性能会分别下降约20%，35%和50%。


    此外，硅通孔TSV也可能会降低系统性能。对于一个大型的FPGA，可能存在成百上千只I/O引脚，而每只都需要有TSV与之对应，这样会大大增加芯片的制造难度。同时，高密度TSV也可能对信号一致性造成干扰，引发串扰和耦合，尤其对于高速模拟信号而言，这极大增加了设计和控制的难度和复杂性。


    （3）SSI技术对FPGA配置的灵活性也可能会造成很大影响。采用多枚FPGA硅片相当于人为地划分了多个设计区域和硬边界。为了优化实现一个较大的FPGA设计，就可能需要对系统进行额外的逻辑划分，尽量使每个逻辑区域不会散落在多个硅片上，而这势必会增加项目周期和设计难度。此外，这些无法改动的设计区域和边界也可能会造成额外的片上资源的使用，从而导致功耗的增加和性能的降低。如图1-9所示，假设原本有一个设计包含模块A到模块D，其中D为内存控制器，并连接了大量并行I/O。在单芯片系统中，该设计只使用2/3的芯片面积即可实现，如图1-9上半部分所示。然而在SSI器件中，由于两个硅片间的互连延时增加，将模块D分布于两个硅片已无法满足时序要求，因此只能将其放于单个硅片中。这样一来，模块A、B、C要重新布局到整个芯片，造成不必要的资源使用，见图1-9下半部分。


    （4）SSI技术的第四个缺点是，为了适应这种新的多硅片FPGA架构，FPGA设计工具需要进行一定程度的改动和优化。对于时序优化工具而言，片间延时的增加使得时序收敛的难度增加。对于布局布线工具而言，由于片间只存在相对有限的布局布线资源，因此增加了布局拥堵的可能性。和传统FPGA设计流程相比，在布局映射（Mapping）和布线（Routing）两个步骤之间，可能会需要加入额外步骤实现设计区域划分，以协调各个硅片的资源使用和时序收敛。另外，由于硅片间硬边界的存在，在设计工具中可能会需要加入额外的设计区域划分，以协调各个硅片的资源使用和时序收敛，这也使得全局的时序和布局布线的协同优化变得更加复杂。


    ![](OEBPS/Images/Figure-P34_523.jpg)


    图1-9　多硅片模型对FPGA配置灵活性的影响


    #### ■1.3.3　SSI技术小结'
  fmt: '

    FPGA的第三个主要特点，就是它的“现场”可编程性。“现场”这个词指的是，FPGA可以在使用时进行编程，而无须将芯片拆下并返回生产厂家完成编程。这个特点在现在看起来有些理所当然，毕竟目前的大部分芯片都有着现场编程能力，而且这也并非FPGA专有的特点。事实上，现场可编程这个特点的存在有着背后的历史原因。在20世纪80年代以前，芯片的固件大都是保存在掩膜ROM（mask
    ROM）或者基于熔丝的PROM里，只能读取而不能写入，更不用说多次写入了。后来出现了能擦写的PROM（EPROM），但擦写过程非常复杂，需要使用特殊设备，对芯片进行长时间的强紫外线照射，这个过程并不能在芯片的使用现场完成。在20世纪80年代之后，人们发明了EEPROM和闪存（Flash
    memory），这才使得现场可编程成为可能。对于现代FPGA而言，人们可以每隔几秒就改变一次FPGA芯片上运行的硬件设计，这也使得FPGA有着极大的灵活性。


    由此我们知道了，FPGA作为一种包含大量逻辑门阵列的芯片，可以在使用现场通过编程改变自身的硬件逻辑，并在理论上可以实现任何数字电路的功能。人们对于FPGA有着很多形象的比喻，有人把它比成乐高积木，通过很多基本的积木单元，可以组成汽车、高楼和飞船；也有人把它比成活字印刷，使用一个个字膜，就可以排列组合成任意的诗词歌赋。这些比喻都形象地突出了FPGA的最大特点：灵活性和通用性。


    随着半导体和芯片技术飞速发展至今，FPGA早已不再是面世之初的简单的可编程门阵列。除了可编程逻辑单元之外，FPGA芯片逐渐变得越来越复杂，并结合最新的半导体制造技术，衍生出了很多不同的架构和设计。在本章接下来的部分，我们将首先回顾FPGA发展的三个重要阶段，以及当前最新的FPGA架构变革与技术突破，特别是3D芯片封装技术在FPGA上的使用。最后，我们将以赛灵思和英特尔最新的高端FPGA产品为例，详细分析这些FPGA上采用了哪些当代最新的尖端科技。通过这些内容，相信大家会对FPGA的发展脉络建立一个完整而清晰的认识，并深入了解当前FPGA芯片采用的新工艺、新架构和新技术。


    ## 1.2　从无到有，从小到大，从大到强——FPGA发展的三个阶段


    FPGA的架构一直伴随着摩尔定律不断演进，与其他类型的芯片相比，FPGA可以说是当前最先进半导体技术的集大成者。1984年，赛灵思（Xilinx）推出了第一款商用FPGA-XC2064，如图1-4所示。在这个FPGA上，只有64个可编程逻辑单元、2个3输入查找表（LUT）、总共800个逻辑门。35年后，英特尔在2019年底推出了当今世界上最大的FPGA，这款名为Stratix10
    GX 10M的FPGA芯片，基于英特尔14nm工艺制造，有着433亿只晶体管、1020万个可编程逻辑单元，以及2304个可编程I/O。


    ![](OEBPS/Images/Figure-P23_429.jpg)

    图1-4　世界上首枚商用FPGA-XC2064


    可以看到，在这35年间，FPGA的芯片架构发生了极其巨大的变化，用翻天覆地来形容也不为过。在这期间，有多次根本性的架构变革，它们奠定了现代FPGA架构的核心和发展方向。这些架构变革发生的根本原因，都是基于FPGA新兴应用的驱动。


    前赛灵思院士，在FPGA和芯片架构领域拥有超过200项专利的Steve Trimberger博士曾把FPGA的发展历程大致划分为三个阶段，即发明阶段（the
    age of invention）、扩张阶段（the age of expansion）、累积阶段（the age of accumulation）。这三个发展阶段，也分别代表了FPGA技术从无到有、从小到大、从大到强的发展过程，见证了FPGA从单纯的可编程逻辑单元，逐渐发展到拥有成百上千万个可编程逻辑单元的大型阵列，再发展到集成了各类硬件资源、IP核，甚至处理器内核的复杂片上系统，并形成当前丰富的FPGA产品门类，在各类应用场景中得到越来越广泛的使用。


    ### ■1.2.1　发明阶段：历史的必然


    FPGA的发明阶段横跨20世纪80年代和90年代。当时的芯片设计与生产模式与现在有着较大的不同。在当时，无晶圆厂模式尚未兴起，ASIC公司只有在客户的设计投入生产时才赚钱。然而由于开发过程中需求的变化、流片失败，或者存在无法通过固件升级进行修复的设计漏洞，往往只有1/3的芯片设计实际投入生产。也就是说，在当时有2/3的芯片项目是赔钱的。由于芯片的流片成本巨大，业界急需一种通用的半导体器件，用来进行流片前的测试、验证等工作，从而减少流片失败的可能性。在这个大环境下，可编程逻辑器件应运而生，而这也是FPGA的前身。


    正如前文提到的那样，FPGA的本质也是一种芯片，它的主要特殊之处是当制造出来后，可以根据不同用户的需求，通过编程来改变自身的逻辑功能，而且这个过程可以重复进行。同时，FPGA使用固定的开发工具和开发环境，而不需要像ASIC那样开发定制化的工具链。这样一来，不同的ASIC芯片可以在流片前使用相同的FPGA进行测试和验证，这使得ASIC厂商流片前的成本和风险得到了大幅降低。


    以现在的标准来看，赛灵思推出的业界第一款FPGA-XC2064更像是一个“玩具”。这个售价55美元的芯片由2.5μm工艺制造，只有64个逻辑单元，以及不超过1000个逻辑门。也就是说，实现一个简单的64位移位寄存器就会占用XC2064的全部片上逻辑。然而在当时看来，作为ASIC流片前的硬件仿真与验证平台，FPGA本身的性能并没有那么重要。此时业界需要的，只是一堆相互连接的可编程逻辑门而已。因此，XC2064的问世，在当时依然引发了不小的轰动。到了20世纪90年代，FPGA芯片的主体架构也在慢慢发展，并逐渐演变成为了现在我们熟悉的可编程逻辑阵列的结构，如图1-5所示。


    ![](OEBPS/Images/Figure-P25_448.jpg)

    图1-5　FPGA的基本架构


    ### ■1.2.2　扩张阶段：设计自动化的兴起


    20世纪末是摩尔定律大放异彩的时代。在摩尔定律的指引下，半导体行业在这十几年里经历了飞速发展。与之对应的，FPGA在1992年到1999年之间迎来了自己的扩张阶段。此时由于芯片制程技术的持续突破，制造大尺寸的芯片已经不像以前那么困难了。对于FPGA来说，不断提升自身的容量就成为了自然而然的选择。FPGA包含的逻辑单元、I/O引脚、时钟和布线等片上资源的数量都在持续增加。伴随着FPGA容量的增长，曾经非常宝贵的芯片面积也逐渐变得相对廉价，这也直接影响了很多电路设计方法论的发展。例如，在此时就出现了“面积换性能”之类的电路设计方法。


    更大的芯片面积也给FPGA的架构创新提供了更多的想象空间。例如，FPGA可编程单元中的LUT查找表结构，从最初的三输入，开始变成四输入和六输入，甚至更多。在这些基本的可编程单元内部，还逐渐增加了寄存器和多路选择器等更多额外功能。渐渐地，这些FPGA片上资源的互连复杂性已经开始取代逻辑结构的复杂性，并成为FPGA厂商需要优先解决的问题。


    与前一个阶段相比，在扩张阶段发生的另一个主要的变化就是FPGA自动设计工具和软件的兴起。由于FPGA结构变得越来越复杂，出现了针对FPGA进行优化设计的自动综合、布局和布线的EDA工具，使用这些工具进行FPGA设计，也逐渐成为了FPGA开发的主流方法。和ASIC设计不同的是，FPGA厂商并没有依赖传统EDA公司提供的这些设计工具，而是走了自主研发的道路。这是由于FPGA公司敏锐地认识到，只有将EDA技术掌握在自己手中，才能牢牢把握FPGA发展的未来。而这个看法，现在已被证明是绝对的真理。FPGA厂商针对自家FPGA产品开发的设计自动化工具，如英特尔（原Altera）的Quartus系列、赛灵思的ISE和Vivado系列等，一直被认为是这些公司“皇冠上的明珠”。早年间，由于各个厂商FPGA主体架构都比较相似，如何优化自家的设计工具，以取得更加出色的性能，就成为了FPGA厂商努力竞争的主战场。这些EDA工具中包含的各种专利与技术机密，也为这些公司构建了深厚的技术护城河。


    ### ■1.2.3　累积阶段：复杂片上系统的形成


    进入21世纪，FPGA的发展进入了累积阶段。人们发现，FPGA的发展此时遭遇了瓶颈，因为单纯提升FPGA的容量已经不能满足各类应用的需求。同时，很多客户开始追求更高的性价比，并不愿意为过大的FPGA买单。在这个大环境下，FPGA开始从单纯的可编程门阵列，逐步转变为拥有复杂功能的可编程片上系统。除了进一步改进可编程逻辑单元本身的微架构之外，FPGA厂商还在FPGA的易用性上做足了功夫。例如，它们推动定义了诸多标准化的数据传输协议，方便不同设计和模块之间的互连与通信。它们还为很多重要而常见的功能开发了可以重复使用的IP核，例如软核微处理器（英特尔/Altera的NIOS，赛灵思的MicroBlaze）、存储控制器和各种通信协议栈等，可以供客户直接调用而无须再从头制造轮子。


    与此同时，很多专用的逻辑单元也被添加到FPGA器件中，并逐渐成为现代FPGA的“标配”。例如，用于数学计算的加法进位链、乘法器、定点与浮点DSP单元，固定容量的片上存储器，以及各种速率的串行收发器和物理接口等。随着人工智能的兴起，AI引擎、可变精度的DSP等针对AI应用开发的IP核也被固化到FPGA中。可以看到，现代FPGA已经成为了各类全新科技的集大成者，而这也会反过来促使FPGA在更多应用场景里被使用。


    那么，随着半导体技术的进一步发展，FPGA下一步会如何进化，以不断突破芯片维度和集成度的限制，并进一步为摩尔定律续命？当摩尔定律行将终结的时候，FPGA的架构又会发生怎样的改变，以适应下一个半导体行业发展的全新周期？在本章接下来的部分，我们将继续深入探究这些问题。


    ## 1.3　超越维度的限制——3D FPGA


    在过去的几十年中，半导体和芯片技术在摩尔定律的指引下得到了飞速发展，然而近年来，人们注意到这种增长速度有逐渐放缓的趋势，很多人因此开始质疑摩尔定律在目前是否仍然有效，“摩尔定律已死”的声浪也不绝于耳。


    从单一晶体管的角度来说，半导体技术的革新从未停歇，例如，科学家已经制造出了单原子甚至单电子的晶体管，也可以对单个原子的位置进行移动和调整，以取得更好的晶体管性能。但从整个半导体产业的角度来看，这未必是下一步的发展方向。当前人们遇到的问题并不是能不能造出来这样小尺寸的单一晶体管，而是能否造出一个包含100亿个这样晶体管的芯片。也就是说，这本质上是个经济问题。因为在理论上，我们是可以制造更小的设备和器件的，但能否让这些设备稳定工作，并以足够低的成本进行生产和销售，则是当前产业亟待思考的问题。


    当晶体管的尺寸逐渐接近原子极限时，再使用传统的晶体管制造技术已经几乎不可能了。传统的晶体管结构曾经非常简单，而现在已经演变成了以FinFET晶体管为代表的非常复杂的3D结构。此外，制造芯片的半导体材料、设备、封装与测试等全产业链都需要同步发展。同样地，由这些晶体管组成的芯片架构也要不断进化，从而继续保持芯片性能的不断进步。


    例如，当芯片在水平维度的扩展逼近技术极限之后，科学家和工程师们就开始探索在垂直方向上对芯片密度进行扩展的可能，并由此发明了3D芯片封装技术。在FPGA领域，厂商采用的3D芯片技术主要有两种：赛灵思的堆叠硅片互联（SSI）技术，以及英特尔的嵌入式多管芯互联桥接（EMIB）技术。


    ### ■1.3.1　赛灵思堆叠硅片互联（SSI）技术


    在每一代半导体工艺早期，工艺和生产技术尚未成熟，因此良率往往较低，对于面积较大的芯片而言更是如此。研究表明，如果硅片面积为6cm²，使用泊松良率模型推断后，其在工艺早期的良率仅为0.25%。也就是说，此时在一个12英寸的晶圆上仅能产出0.3个能正常工作的芯片。然而，如果硅片面积只有1.5cm²，良率则会高达22%。此时，在同样的一个12英寸的晶圆上会产出107个能正常工作的芯片，如图1-6所示。由此可见，在工艺早期，不同硅片面积大小会带来巨大的良率落差。


    ![](OEBPS/Images/Figure-P29_487.jpg)

    图1-6　工艺早期不同面积的裸晶良率与产量的关系


    有意思的是，如果可以将上例中的4个1.5cm²的硅片通过某种方式“组合”成一枚6cm²的芯片，那么同样的晶圆就可以产出平均26.75枚芯片，并随之带来超过100倍的产能提升。这便是赛灵思采用的堆叠硅片互联（Stacked
    Silicon Interconnect，SSI）技术产生的主要背景。


    堆叠硅片互联（SSI）技术示意图如图1-7所示。和传统封装技术相比，SSI技术在封装基板（Package Substrate）和FPGA硅片之间加入了一层无源硅中介层（Silicon
    Interposer）。在硅中介层上可以放置多枚FPGA硅片。这些硅片通过在中介层里的硅通孔（Through Silicon Vias，TSV）、微凸块（Microbumps）以及大量连线进行相互连接。


    ![](OEBPS/Images/Figure-P30_495.jpg)

    图1-7　堆叠硅片互联（SSI）技术示意图


    在这个结构里，微凸块用来连接FPGA硅片上的各类引脚；硅通孔负责将硅片的电源、接地以及I/O接口通过C4凸块连接到封装基板；在硅中介层中，有着上万条连线将相邻的两枚FPGA硅片进行互连。在SSI技术中，硅通孔是它的核心创新点与技术难点。由于TSV通过蚀刻工艺制造，而非激光钻孔，因此对制造工艺有着严格要求。为了降低系统的制造难度，中介层会使用已经十分成熟的工艺而非最新的工艺制程进行加工，例如65nm工艺等。在硅中介层中，也不包含晶体管等有源器件，这样可以保证较高的良率，降低制造风险和系统的静态功耗。


    使用SSI技术最主要的优点：能在每代半导体制造工艺的早期，快速生产出良率高的大型FPGA器件，加快了产品面世周期，从而能快速抢占市场，尤其是高端市场。此外，当制造工艺逐渐成熟，并可以生产良率较高的大型单硅片FPGA器件时，使用SSI这种基于硅中介层的技术也能通过组合多枚硅片集成更多的可编程逻辑单元。


    在2017年的HotChips大会上，赛灵思发布了Virtex UltraScale+HBM系列FPGA，其中仍然使用了基于第四代硅中介层的技术来组合3枚16nm
    FPGA，以及2枚32GB的高带宽存储芯片（High Bandwidth Memory，HBM），如图1-8所示。


    ![](OEBPS/Images/Figure-P31_503.jpg)

    图1-8　Virtex UltraScale+HBM FPGA结构图（图片来自赛灵思）


    ### ■1.3.2　SSI技术的主要缺点


    尽管SSI技术能在半导体制造工艺初期大幅提升良率，它的缺点也同样明显。总结起来主要有以下4点。


    （1）如前文所述，SSI技术特别适用于每代半导体制造工艺的早期。此时制造大型硅片的工艺并不成熟，以至于良率较低。不过，当工艺成熟后，良率会明显上升，这时采用SSI技术的好处就不明显了。在开头的例子中，当工艺成熟后，制造6cm²硅片的良率会从一开始的0.25%猛增至55%，制造1.5cm²硅片的良率会从22%上升至86%。这样一来，一块12英寸的晶圆可以产出66.9片6cm²的硅片，以及104.6片4×1.5cm²的硅片，产量差别已然不大。同时，制造硅中介层、TSV以及在同一封装内组装多枚硅片的成本就会在此时逐步显现，导致整体的成本优势进一步减弱。


    （2）和一片完整的大型FPGA硅片相比，将多枚FPGA硅片通过硅中间层组合可能会显著降低芯片的性能。这里对性能的影响来自于很多方面，例如在垂直方向上，由于硅中间层的引入，为了连接硅片引脚和封装引脚，就需要先后经过包括TSV在内的很多额外结构，这势必造成延时的增加。相比之下，在单芯片结构里由于没有这些额外结构，信号只需经过封装基板内的导线即可。


    在水平方向上，硅中介层中的导线和微凸块也会带来额外的延迟开销。研究表明，对于一个尺寸为7mm×12mm的硅片而言，其中的微凸块可能分布在距离芯片边界为2.25mm的“远方”。此时如果将两个硅片进行互连，在中介层中的导线长度会非常可观，从而可能带来1ns左右的线路延时。相比之下，FPGA片上的延时才不过几百ps，大概只是前者的1/10。


    在2014年，多伦多大学Andre Pereira和Vaughn Betz等人在FPGA国际研讨会发表的研究结果指出，硅片间由中介层带来的延时会对系统性能带来消极影响。例如，当中介层的互连延时造成关键路径增加0.5ns，1ns或1.5ns时，系统性能会分别下降约20%，35%和50%。


    此外，硅通孔TSV也可能会降低系统性能。对于一个大型的FPGA，可能存在成百上千只I/O引脚，而每只都需要有TSV与之对应，这样会大大增加芯片的制造难度。同时，高密度TSV也可能对信号一致性造成干扰，引发串扰和耦合，尤其对于高速模拟信号而言，这极大增加了设计和控制的难度和复杂性。


    （3）SSI技术对FPGA配置的灵活性也可能会造成很大影响。采用多枚FPGA硅片相当于人为地划分了多个设计区域和硬边界。为了优化实现一个较大的FPGA设计，就可能需要对系统进行额外的逻辑划分，尽量使每个逻辑区域不会散落在多个硅片上，而这势必会增加项目周期和设计难度。此外，这些无法改动的设计区域和边界也可能会造成额外的片上资源的使用，从而导致功耗的增加和性能的降低。如图1-9所示，假设原本有一个设计包含模块A到模块D，其中D为内存控制器，并连接了大量并行I/O。在单芯片系统中，该设计只使用2/3的芯片面积即可实现，如图1-9上半部分所示。然而在SSI器件中，由于两个硅片间的互连延时增加，将模块D分布于两个硅片已无法满足时序要求，因此只能将其放于单个硅片中。这样一来，模块A、B、C要重新布局到整个芯片，造成不必要的资源使用，见图1-9下半部分。


    （4）SSI技术的第四个缺点是，为了适应这种新的多硅片FPGA架构，FPGA设计工具需要进行一定程度的改动和优化。对于时序优化工具而言，片间延时的增加使得时序收敛的难度增加。对于布局布线工具而言，由于片间只存在相对有限的布局布线资源，因此增加了布局拥堵的可能性。和传统FPGA设计流程相比，在布局映射（Mapping）和布线（Routing）两个步骤之间，可能会需要加入额外步骤实现设计区域划分，以协调各个硅片的资源使用和时序收敛。另外，由于硅片间硬边界的存在，在设计工具中可能会需要加入额外的设计区域划分，以协调各个硅片的资源使用和时序收敛，这也使得全局的时序和布局布线的协同优化变得更加复杂。


    ![](OEBPS/Images/Figure-P34_523.jpg)

    图1-9　多硅片模型对FPGA配置灵活性的影响


    ### ■1.3.3　SSI技术小结

    '
  trans: '


    FPGA 的第三个主要特点，就是它的“现场”可编程性。“现场”这个词指的是，FPGA 可以在使用时进行编程，而无须将芯片拆下并返回生产厂家完成编程。这个特点在现在看起来有些理所当然，毕竟目前的大部分芯片都有着现场编程能力，而且这也并非
    FPGA 专有的特点。事实上，现场可编程这个特点的存在有着背后的历史原因。在 20 世纪 80 年代以前，芯片的固件大都是保存在掩膜 ROM（mask ROM）或者基于熔丝的
    PROM 里，只能读取而不能写入，更不用说多次写入了。后来出现了能擦写的 PROM（EPROM），但擦写过程非常复杂，需要使用特殊设备，对芯片进行长时间的强紫外线照射，这个过程并不能在芯片的使用现场完成。在
    20 世纪 80 年代之后，人们发明了 EEPROM 和闪存（Flash memory），这才使得现场可编程成为可能。对于现代 FPGA 而言，人们可以每隔几秒就改变一次
    FPGA 芯片上运行的硬件设计，这也使得 FPGA 有着极大的灵活性。


    由此我们知道了，FPGA 作为一种包含大量逻辑门阵列的芯片，可以在使用现场通过编程改变自身的硬件逻辑，并在理论上可以实现任何数字电路的功能。人们对于 FPGA
    有着很多形象的比喻，有人把它比成乐高积木，通过很多基本的积木单元，可以组成汽车、高楼和飞船；也有人把它比成活字印刷，使用一个个字膜，就可以排列组合成任意的诗词歌赋。这些比喻都形象地突出了
    FPGA 的最大特点：灵活性和通用性。


    随着半导体和芯片技术飞速发展至今，FPGA 早已不再是面世之初的简单的可编程门阵列。除了可编程逻辑单元之外，FPGA 芯片逐渐变得越来越复杂，并结合最新的半导体制造技术，衍生出了很多不同的架构和设计。在本章接下来的部分，我们将首先回顾
    FPGA 发展的三个重要阶段，以及当前最新的 FPGA 架构变革与技术突破，特别是 3D 芯片封装技术在 FPGA 上的使用。最后，我们将以赛灵思和英特尔最新的高端
    FPGA 产品为例，详细分析这些 FPGA 上采用了哪些当代最新的尖端科技。通过这些内容，相信大家会对 FPGA 的发展脉络建立一个完整而清晰的认识，并深入了解当前
    FPGA 芯片采用的新工艺、新架构和新技术。


    ## 1.2　从无到有，从小到大，从大到强——FPGA 发展的三个阶段


    FPGA 的架构一直伴随着摩尔定律不断演进，与其他类型的芯片相比，FPGA 可以说是当前最先进半导体技术的集大成者。1984 年，赛灵思（Xilinx）推出了第一款商用
    FPGA-XC2064，如图 1-4 所示。在这个 FPGA 上，只有 64 个可编程逻辑单元、2 个 3 输入查找表（LUT）、总共 800 个逻辑门。35
    年后，英特尔在 2019 年底推出了当今世界上最大的 FPGA，这款名为 Stratix10 GX 10M 的 FPGA 芯片，基于英特尔 14nm 工艺制造，有着
    433 亿只晶体管、1020 万个可编程逻辑单元，以及 2304 个可编程 I/O。


    ![](img/Figure-P23_429.jpg)

    图 1-4　世界上首枚商用 FPGA-XC2064


    可以看到，在这 35 年间，FPGA 的芯片架构发生了极其巨大的变化，用翻天覆地来形容也不为过。在这期间，有多次根本性的架构变革，它们奠定了现代 FPGA
    架构的核心和发展方向。这些架构变革发生的根本原因，都是基于 FPGA 新兴应用的驱动。


    前赛灵思院士，在 FPGA 和芯片架构领域拥有超过 200 项专利的 Steve Trimberger 博士曾把 FPGA 的发展历程大致划分为三个阶段，即发明阶段（the
    age of invention）、扩张阶段（the age of expansion）、累积阶段（the age of accumulation）。这三个发展阶段，也分别代表了
    FPGA 技术从无到有、从小到大、从大到强的发展过程，见证了 FPGA 从单纯的可编程逻辑单元，逐渐发展到拥有成百上千万个可编程逻辑单元的大型阵列，再发展到集成了各类硬件资源、IP
    核，甚至处理器内核的复杂片上系统，并形成当前丰富的 FPGA 产品门类，在各类应用场景中得到越来越广泛的使用。


    ### ■1.2.1　发明阶段：历史的必然


    FPGA 的发明阶段横跨 20 世纪 80 年代和 90 年代。当时的芯片设计与生产模式与现在有着较大的不同。在当时，无晶圆厂模式尚未兴起，ASIC 公司只有在客户的设计投入生产时才赚钱。然而由于开发过程中需求的变化、流片失败，或者存在无法通过固件升级进行修复的设计漏洞，往往只有
    1/3 的芯片设计实际投入生产。也就是说，在当时有 2/3 的芯片项目是赔钱的。由于芯片的流片成本巨大，业界急需一种通用的半导体器件，用来进行流片前的测试、验证等工作，从而减少流片失败的可能性。在这个大环境下，可编程逻辑器件应运而生，而这也是
    FPGA 的前身。


    正如前文提到的那样，FPGA 的本质也是一种芯片，它的主要特殊之处是当制造出来后，可以根据不同用户的需求，通过编程来改变自身的逻辑功能，而且这个过程可以重复进行。同时，FPGA
    使用固定的开发工具和开发环境，而不需要像 ASIC 那样开发定制化的工具链。这样一来，不同的 ASIC 芯片可以在流片前使用相同的 FPGA 进行测试和验证，这使得
    ASIC 厂商流片前的成本和风险得到了大幅降低。


    以现在的标准来看，赛灵思推出的业界第一款 FPGA-XC2064 更像是一个“玩具”。这个售价 55 美元的芯片由 2.5μm 工艺制造，只有 64 个逻辑单元，以及不超过
    1000 个逻辑门。也就是说，实现一个简单的 64 位移位寄存器就会占用 XC2064 的全部片上逻辑。然而在当时看来，作为 ASIC 流片前的硬件仿真与验证平台，FPGA
    本身的性能并没有那么重要。此时业界需要的，只是一堆相互连接的可编程逻辑门而已。因此，XC2064 的问世，在当时依然引发了不小的轰动。到了 20 世纪 90
    年代，FPGA 芯片的主体架构也在慢慢发展，并逐渐演变成为了现在我们熟悉的可编程逻辑阵列的结构，如图 1-5 所示。


    ![](img/Figure-P25_448.jpg)

    图 1-5　FPGA 的基本架构


    ### ■1.2.2　扩张阶段：设计自动化的兴起


    20 世纪末是摩尔定律大放异彩的时代。在摩尔定律的指引下，半导体行业在这十几年里经历了飞速发展。与之对应的，FPGA 在 1992 年到 1999 年之间迎来了自己的扩张阶段。此时由于芯片制程技术的持续突破，制造大尺寸的芯片已经不像以前那么困难了。对于
    FPGA 来说，不断提升自身的容量就成为了自然而然的选择。FPGA 包含的逻辑单元、I/O 引脚、时钟和布线等片上资源的数量都在持续增加。伴随着 FPGA
    容量的增长，曾经非常宝贵的芯片面积也逐渐变得相对廉价，这也直接影响了很多电路设计方法论的发展。例如，在此时就出现了“面积换性能”之类的电路设计方法。


    更大的芯片面积也给 FPGA 的架构创新提供了更多的想象空间。例如，FPGA 可编程单元中的 LUT 查找表结构，从最初的三输入，开始变成四输入和六输入，甚至更多。在这些基本的可编程单元内部，还逐渐增加了寄存器和多路选择器等更多额外功能。渐渐地，这些
    FPGA 片上资源的互连复杂性已经开始取代逻辑结构的复杂性，并成为 FPGA 厂商需要优先解决的问题。


    与前一个阶段相比，在扩张阶段发生的另一个主要的变化就是 FPGA 自动设计工具和软件的兴起。由于 FPGA 结构变得越来越复杂，出现了针对 FPGA 进行优化设计的自动综合、布局和布线的
    EDA 工具，使用这些工具进行 FPGA 设计，也逐渐成为了 FPGA 开发的主流方法。和 ASIC 设计不同的是，FPGA 厂商并没有依赖传统 EDA 公司提供的这些设计工具，而是走了自主研发的道路。这是由于
    FPGA 公司敏锐地认识到，只有将 EDA 技术掌握在自己手中，才能牢牢把握 FPGA 发展的未来。而这个看法，现在已被证明是绝对的真理。FPGA 厂商针对自家
    FPGA 产品开发的设计自动化工具，如英特尔（原 Altera）的 Quartus 系列、赛灵思的 ISE 和 Vivado 系列等，一直被认为是这些公司“皇冠上的明珠”。早年间，由于各个厂商
    FPGA 主体架构都比较相似，如何优化自家的设计工具，以取得更加出色的性能，就成为了 FPGA 厂商努力竞争的主战场。这些 EDA 工具中包含的各种专利与技术机密，也为这些公司构建了深厚的技术护城河。


    ### ■1.2.3　累积阶段：复杂片上系统的形成


    进入 21 世纪，FPGA 的发展进入了累积阶段。人们发现，FPGA 的发展此时遭遇了瓶颈，因为单纯提升 FPGA 的容量已经不能满足各类应用的需求。同时，很多客户开始追求更高的性价比，并不愿意为过大的
    FPGA 买单。在这个大环境下，FPGA 开始从单纯的可编程门阵列，逐步转变为拥有复杂功能的可编程片上系统。除了进一步改进可编程逻辑单元本身的微架构之外，FPGA
    厂商还在 FPGA 的易用性上做足了功夫。例如，它们推动定义了诸多标准化的数据传输协议，方便不同设计和模块之间的互连与通信。它们还为很多重要而常见的功能开发了可以重复使用的
    IP 核，例如软核微处理器（英特尔/Altera 的 NIOS，赛灵思的 MicroBlaze）、存储控制器和各种通信协议栈等，可以供客户直接调用而无须再从头制造轮子。


    与此同时，很多专用的逻辑单元也被添加到 FPGA 器件中，并逐渐成为现代 FPGA 的“标配”。例如，用于数学计算的加法进位链、乘法器、定点与浮点 DSP
    单元，固定容量的片上存储器，以及各种速率的串行收发器和物理接口等。随着人工智能的兴起，AI 引擎、可变精度的 DSP 等针对 AI 应用开发的 IP 核也被固化到
    FPGA 中。可以看到，现代 FPGA 已经成为了各类全新科技的集大成者，而这也会反过来促使 FPGA 在更多应用场景里被使用。


    那么，随着半导体技术的进一步发展，FPGA 下一步会如何进化，以不断突破芯片维度和集成度的限制，并进一步为摩尔定律续命？当摩尔定律行将终结的时候，FPGA
    的架构又会发生怎样的改变，以适应下一个半导体行业发展的全新周期？在本章接下来的部分，我们将继续深入探究这些问题。


    ## 1.3　超越维度的限制——3D FPGA


    在过去的几十年中，半导体和芯片技术在摩尔定律的指引下得到了飞速发展，然而近年来，人们注意到这种增长速度有逐渐放缓的趋势，很多人因此开始质疑摩尔定律在目前是否仍然有效，“摩尔定律已死”的声浪也不绝于耳。


    从单一晶体管的角度来说，半导体技术的革新从未停歇，例如，科学家已经制造出了单原子甚至单电子的晶体管，也可以对单个原子的位置进行移动和调整，以取得更好的晶体管性能。但从整个半导体产业的角度来看，这未必是下一步的发展方向。当前人们遇到的问题并不是能不能造出来这样小尺寸的单一晶体管，而是能否造出一个包含
    100 亿个这样晶体管的芯片。也就是说，这本质上是个经济问题。因为在理论上，我们是可以制造更小的设备和器件的，但能否让这些设备稳定工作，并以足够低的成本进行生产和销售，则是当前产业亟待思考的问题。


    当晶体管的尺寸逐渐接近原子极限时，再使用传统的晶体管制造技术已经几乎不可能了。传统的晶体管结构曾经非常简单，而现在已经演变成了以 FinFET 晶体管为代表的非常复杂的
    3D 结构。此外，制造芯片的半导体材料、设备、封装与测试等全产业链都需要同步发展。同样地，由这些晶体管组成的芯片架构也要不断进化，从而继续保持芯片性能的不断进步。


    例如，当芯片在水平维度的扩展逼近技术极限之后，科学家和工程师们就开始探索在垂直方向上对芯片密度进行扩展的可能，并由此发明了 3D 芯片封装技术。在 FPGA
    领域，厂商采用的 3D 芯片技术主要有两种：赛灵思的堆叠硅片互联（SSI）技术，以及英特尔的嵌入式多管芯互联桥接（EMIB）技术。


    ### ■1.3.1　赛灵思堆叠硅片互联（SSI）技术


    在每一代半导体工艺早期，工艺和生产技术尚未成熟，因此良率往往较低，对于面积较大的芯片而言更是如此。研究表明，如果硅片面积为 6cm²，使用泊松良率模型推断后，其在工艺早期的良率仅为
    0.25%。也就是说，此时在一个 12 英寸的晶圆上仅能产出 0.3 个能正常工作的芯片。然而，如果硅片面积只有 1.5cm²，良率则会高达 22%。此时，在同样的一个
    12 英寸的晶圆上会产出 107 个能正常工作的芯片，如图 1-6 所示。由此可见，在工艺早期，不同硅片面积大小会带来巨大的良率落差。


    ![](img/Figure-P29_487.jpg)

    图 1-6　工艺早期不同面积的裸晶良率与产量的关系


    有意思的是，如果可以将上例中的 4 个 1.5cm²的硅片通过某种方式“组合”成一枚 6cm²的芯片，那么同样的晶圆就可以产出平均 26.75 枚芯片，并随之带来超过
    100 倍的产能提升。这便是赛灵思采用的堆叠硅片互联（Stacked Silicon Interconnect，SSI）技术产生的主要背景。


    堆叠硅片互联（SSI）技术示意图如图 1-7 所示。和传统封装技术相比，SSI 技术在封装基板（Package Substrate）和 FPGA 硅片之间加入了一层无源硅中介层（Silicon
    Interposer）。在硅中介层上可以放置多枚 FPGA 硅片。这些硅片通过在中介层里的硅通孔（Through Silicon Vias，TSV）、微凸块（Microbumps）以及大量连线进行相互连接。


    ![](img/Figure-P30_495.jpg)

    图 1-7　堆叠硅片互联（SSI）技术示意图


    在这个结构里，微凸块用来连接 FPGA 硅片上的各类引脚；硅通孔负责将硅片的电源、接地以及 I/O 接口通过 C4 凸块连接到封装基板；在硅中介层中，有着上万条连线将相邻的两枚
    FPGA 硅片进行互连。在 SSI 技术中，硅通孔是它的核心创新点与技术难点。由于 TSV 通过蚀刻工艺制造，而非激光钻孔，因此对制造工艺有着严格要求。为了降低系统的制造难度，中介层会使用已经十分成熟的工艺而非最新的工艺制程进行加工，例如
    65nm 工艺等。在硅中介层中，也不包含晶体管等有源器件，这样可以保证较高的良率，降低制造风险和系统的静态功耗。


    使用 SSI 技术最主要的优点：能在每代半导体制造工艺的早期，快速生产出良率高的大型 FPGA 器件，加快了产品面世周期，从而能快速抢占市场，尤其是高端市场。此外，当制造工艺逐渐成熟，并可以生产良率较高的大型单硅片
    FPGA 器件时，使用 SSI 这种基于硅中介层的技术也能通过组合多枚硅片集成更多的可编程逻辑单元。


    在 2017 年的 HotChips 大会上，赛灵思发布了 Virtex UltraScale+HBM 系列 FPGA，其中仍然使用了基于第四代硅中介层的技术来组合
    3 枚 16nm FPGA，以及 2 枚 32GB 的高带宽存储芯片（High Bandwidth Memory，HBM），如图 1-8 所示。


    ![](img/Figure-P31_503.jpg)

    图 1-8　Virtex UltraScale+HBM FPGA 结构图（图片来自赛灵思）


    ### ■1.3.2　SSI 技术的主要缺点


    尽管 SSI 技术能在半导体制造工艺初期大幅提升良率，它的缺点也同样明显。总结起来主要有以下 4 点。


    （1）如前文所述，SSI 技术特别适用于每代半导体制造工艺的早期。此时制造大型硅片的工艺并不成熟，以至于良率较低。不过，当工艺成熟后，良率会明显上升，这时采用
    SSI 技术的好处就不明显了。在开头的例子中，当工艺成熟后，制造 6cm²硅片的良率会从一开始的 0.25%猛增至 55%，制造 1.5cm²硅片的良率会从
    22%上升至 86%。这样一来，一块 12 英寸的晶圆可以产出 66.9 片 6cm²的硅片，以及 104.6 片 4×1.5cm²的硅片，产量差别已然不大。同时，制造硅中介层、TSV
    以及在同一封装内组装多枚硅片的成本就会在此时逐步显现，导致整体的成本优势进一步减弱。


    （2）和一片完整的大型 FPGA 硅片相比，将多枚 FPGA 硅片通过硅中间层组合可能会显著降低芯片的性能。这里对性能的影响来自于很多方面，例如在垂直方向上，由于硅中间层的引入，为了连接硅片引脚和封装引脚，就需要先后经过包括
    TSV 在内的很多额外结构，这势必造成延时的增加。相比之下，在单芯片结构里由于没有这些额外结构，信号只需经过封装基板内的导线即可。


    在水平方向上，硅中介层中的导线和微凸块也会带来额外的延迟开销。研究表明，对于一个尺寸为 7mm×12mm 的硅片而言，其中的微凸块可能分布在距离芯片边界为
    2.25mm 的“远方”。此时如果将两个硅片进行互连，在中介层中的导线长度会非常可观，从而可能带来 1ns 左右的线路延时。相比之下，FPGA 片上的延时才不过几百
    ps，大概只是前者的 1/10。


    在 2014 年，多伦多大学 Andre Pereira 和 Vaughn Betz 等人在 FPGA 国际研讨会发表的研究结果指出，硅片间由中介层带来的延时会对系统性能带来消极影响。例如，当中介层的互连延时造成关键路径增加
    0.5ns，1ns 或 1.5ns 时，系统性能会分别下降约 20%，35%和 50%。


    此外，硅通孔 TSV 也可能会降低系统性能。对于一个大型的 FPGA，可能存在成百上千只 I/O 引脚，而每只都需要有 TSV 与之对应，这样会大大增加芯片的制造难度。同时，高密度
    TSV 也可能对信号一致性造成干扰，引发串扰和耦合，尤其对于高速模拟信号而言，这极大增加了设计和控制的难度和复杂性。


    （3）SSI 技术对 FPGA 配置的灵活性也可能会造成很大影响。采用多枚 FPGA 硅片相当于人为地划分了多个设计区域和硬边界。为了优化实现一个较大的 FPGA
    设计，就可能需要对系统进行额外的逻辑划分，尽量使每个逻辑区域不会散落在多个硅片上，而这势必会增加项目周期和设计难度。此外，这些无法改动的设计区域和边界也可能会造成额外的片上资源的使用，从而导致功耗的增加和性能的降低。如图
    1-9 所示，假设原本有一个设计包含模块 A 到模块 D，其中 D 为内存控制器，并连接了大量并行 I/O。在单芯片系统中，该设计只使用 2/3 的芯片面积即可实现，如图
    1-9 上半部分所示。然而在 SSI 器件中，由于两个硅片间的互连延时增加，将模块 D 分布于两个硅片已无法满足时序要求，因此只能将其放于单个硅片中。这样一来，模块
    A、B、C 要重新布局到整个芯片，造成不必要的资源使用，见图 1-9 下半部分。


    （4）SSI 技术的第四个缺点是，为了适应这种新的多硅片 FPGA 架构，FPGA 设计工具需要进行一定程度的改动和优化。对于时序优化工具而言，片间延时的增加使得时序收敛的难度增加。对于布局布线工具而言，由于片间只存在相对有限的布局布线资源，因此增加了布局拥堵的可能性。和传统
    FPGA 设计流程相比，在布局映射（Mapping）和布线（Routing）两个步骤之间，可能会需要加入额外步骤实现设计区域划分，以协调各个硅片的资源使用和时序收敛。另外，由于硅片间硬边界的存在，在设计工具中可能会需要加入额外的设计区域划分，以协调各个硅片的资源使用和时序收敛，这也使得全局的时序和布局布线的协同优化变得更加复杂。


    ![](img/Figure-P34_523.jpg)

    图 1-9　多硅片模型对 FPGA 配置灵活性的影响


    ### ■1.3.3　SSI 技术小结


