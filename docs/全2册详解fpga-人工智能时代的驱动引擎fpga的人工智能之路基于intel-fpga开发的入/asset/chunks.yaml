    #### ■5.1.5　FPGA领域的主要学术会议


    FPGA领域的顶级国际学术会议主要有四个，分别是：FPGA、FCCM、FPT、FPL。其中，第一个会议的全称为“ACM/SIGDA International
    Symposium on Field-Programmable Gate Arrays”，即“FPGA国际研讨会”，自从1993年举办至今。从名字就可以看出来，它是FPGA领域的旗舰级顶会，为了避免和FPGA本身混淆，我们在下文中都将这个会议称为“FPGA大会”。


    “FPGA大会”每年的举办地固定，都在美国加州的海滨城市Monterey。每届会议接收并全文发表的文章大约有30篇，除此以外还有不少海报论文，以及各种讲座、演示、讨论等。这些在“FPGA大会”上全文发表的文章，每篇10页，工作量和质量都堪比期刊论文。“FPGA大会”的审稿标准十分严格，因此在这里发表的文章都代表着当时FPGA最前沿和最优秀的研究成果，也普遍被业界人士看作是预测FPGA今后发展方向的风向标。


    FCCM全称为“IEEE Symposium on Field-Programmable Custom Computing Machines”，即IEEE现场可编程自定义计算研讨会，它常年在北美各地巡回举办。FPT全称为“International
    Conference on Field-Programmable Technology”，即现场可编程技术国际会议，它始创于2002年，每年在亚太地区举办。FPL全称为“Field-Programmable
    Logic”，自1991年创办起，它每年都在欧洲各个大学巡回举办。


    FCCM、FPT和FPL基本涵盖了FPGA和可编程器件研究的绝大多数方向，包括硬件架构、软件开发工具、综合算法、具体应用实例等。加上“FPGA大会”，这四个国际会议可以说是海内外FPGA研究者每年都会积极参与的盛会。


    前文提到的几位FPGA领域的知名学者，都是这些学术会议的常客。有人曾做过统计，截至2017年，丛京生教授在“FPGA大会”上共发表62篇文章，位列全球所有学者之首。而纵观FPGA、FCCM、FPT、FPL四大会议，帝国理工学院的Wayne
    Luk教授在这些会议上一共发表了247篇文章，Peter Cheung教授共发表了131篇文章，George Constantinides教授共发表了103篇文章，这三人位居全球所有学者的前三名。此外，上面提到的其他学者也在这四大会议上发表过数十篇文章，且获得过多项最佳论文奖。例如，汪玉教授的神经网络压缩算法文章就获得了2017年“FPGA大会”的最佳论文奖。


    ### 5.2　FPGA 20年最有影响力的25项研究成果


    2011年，FPGA研究领域的学术权威与工业界领袖为了庆祝“FPGA国际研讨会”举办20周年，评选出了自20世纪90年代以来FPGA领域最有影响力的25项研究成果。这些重要的成果能帮助我们解答两个重要的问题，也就是FPGA从哪来，以及FPGA将去向何方。


    这25项研究成果按研究领域分为FPGA架构、计算机设计自动化（CAD）工具、FPGA应用、可重构计算等几个大类。其中的每个成果都由一名该领域的顶级学者做推介。在本节中，我们将按类别对这些成果做逐一解读。虽然这里的有些工作现在看起来并不那么新颖，但在这些成果发表的当时，它们无不在学术界和工业界引起巨大反响。而这也恰恰证明了，这里很多工作的影响力一直流传至今，让我们觉得习以为常。除了这些工作本身的贡献之外，它们所采用的方法论、思维方式、前瞻性与实用性的结合，以及这些学者和科学家严谨的治学态度，都为后来的研究树立了最高的典范。


    #### ■5.2.1　FPGA系统架构篇


    在本篇中，有五个FPGA系统架构领域的重要研究成果，它们有的奠定了现代商用FPGA的基础架构，例如赛灵思的Virtex系列和Altera的Stratix系列；有的开创了FPGA作为并行硬件加速器的这一重要应用方向；有的统一了FPGA架构研究中基准测试的规范和标准。可以说，这些工作为现代FPGA系统架构的发展打下了坚实的理论基础。


    ##### 1．FPGA与SIMD阵列的结合与统一


    **一句话总结：**FPGA作为并行计算加速器的开山之作


    **英文名：**Unifying FPGAs and SMID Arrays


    **作者：**Michael Bolotski，Andre DeHon（见图5-5），Thomas F. Knight，Jr


    **发表时间：**1994年


    **推介人：**Jonathan Rose（多伦多大学）


    ![](OEBPS/Images/Figure-P174_1785.jpg)


    图5-5　Andre DeHon，现任宾夕法尼亚大学教授


    这项成果在哲学的角度重新审视了FPGA这种计算“介质”，并将其与单指令多数据（Single Instruction Multiple Data，SIMD）方法联系起来，以进行常规计算的并行加速。这个工作最早揭示了如何把FPGA和SIMD这两种计算方法看成一个连续的整体，并在某种意义上将二者进行了结合和统一。


    这项成果提出了一种混合架构，名为“动态可编程门阵列（DPGA）”。在这种架构中，用来配置逻辑和布线的比特流（Bitstream）位于特殊设计过的本地存储单元中，并会不断地快速变化。在DPGA里，有一个中央上下文标识器（Central
    Context Identifier），负责决定从本地内存中加载哪些配置。


    通过使用这种方法，使DPGA架构在某种程度上类似于SIMD。具体来说，如果这些本地内存里的内容相同，那么就会执行相同的“指令”；反之，如果本地内存中的内容不同，那么每个处理单元就会各自为战，这使得这种DPGA架构既可以并行处理数据，又可以串行处理数据。此外，这项成果还对这种新的计算体系架构的成本和收益进行了深入的分析。


    这项成果是关于DPGA的一系列富有影响力的成果的开山之作，也是第一批探讨FPGA编程里上下文的工作之一。虽然这种可编程架构在后来并未成为业界主流，但它启发了很多后续的高质量工作，并为来者奠定了坚实的理论基础。同时，这种打破常规的创新思维，也值得所有研究者借鉴和学习。


    ##### 2．一种高速的层次化同步可编程阵列


    **一句话总结：**高性能、高时钟频率FPGA架构设计与时序优化算法的开创性探索


    **英文名：**HSRA：High-Speed，Hierarchical Synchronous Reconfigurable Array


    **作者：**William Tsu，Kip Macy，Atul Joshi，Randy Huang，Tony Tung，Omid Rowhani，Varghese
    George，John Wawrzynek，Andre DeHon


    **发表时间：**1999年


    **推介人：**Carl Ebeling（华盛顿大学）


    这项工作专注于解答这样的一个问题：是否有可能设计一个FPGA架构，使它能够和CPU或ASIC的时钟频率一较高下？


    通常情况下，FPGA的时钟频率要比CPU或ASIC慢很多，往往只能达到CPU或ASIC时钟频率的10%～20%，这主要受制于FPGA内部的逻辑延时与互连延时。而这项工作则希望通过结合FPGA架构创新和CAD工具创新两方面，使得FPGA的性能上升到一个新的台阶。


    这项工作采取了一种与传统FPGA设计方法完全相左的方法，即根据特定的时钟频率设计系统架构。然而通过这种方式，设计者可以精确地定义一个时钟周期中逻辑层的数量、互连和距离等参数，这样就可以得到一个包括可编程互连在内的高度流水化的结构。


    这个成果提出了一个名为HSRA的新型架构，它最新颖的地方在于其中的树形分层互连结构，如图5-6所示。这种架构允许连接通过点对点的方式完成，因此就可以得到任意两点间的距离和延时。利用这些信息，就可以从时序的角度解决很多布局和布线问题。


    另一方面，并不是所有设计都可以按照HSRA架构进行深度流水线优化。为了解决这个问题，这项工作创造性地采用了名为C-slowing的方法，即当设计中包含较大反馈时，就通过在电路中引入额外的并行性，来处理和补偿这些反馈带来的延时。值得注意的是，C-slowing也在后来逐渐成为了重定时技术的主流方法之一。


    综上所述，这项工作在FPGA体系结构这个领域中开拓出了一个新的方向，那就是针对时序和高性能的FPGA架构设计。HSRA架构本身由于与传统FPGA的差别太大，从而没有在商业化的道路上走远，但这个工作中的很多思路和方法，都对现代FPGA架构的演进产生了深远的影响。


    ##### 3．Virtex-II FPGA的动态功耗


    **一句话总结：**现代FPGA动态功耗分析、建模与优化方法的开山之作


    **英文名：**Dynamic Power Consumption in Virtex-II FPGA Family


    ![](OEBPS/Images/Figure-P177_1805.jpg)


    图5-6　HSRA中的树形分层互连结构


    **作者：**Li Shang，Alireza Kaviani，Kusuma Bathala


    **发表时间：**2002年


    **推介人：**Russ Tessier（马萨诸塞大学）


    在这项工作之前，很少有研究专门讨论FPGA的功耗问题。因此，这项成果为研究者深入理解FPGA的功耗，并进行功耗优化迈出了重要的第一步。


    关于FPGA的功耗问题，业界一直假设互连功耗是FPGA动态功耗的主要来源，这项工作通过实验证明了这一假设的正确性。在对动态功耗的分析过程中，这项工作研究了FPGA中不同结构对功耗的影响，从而为后来针对功耗优化的CAD算法的出现提供了理论基础。同时，通过仿真和物理实测，这项成果提出的功耗分布结果是非常可信的。例如，在Virtex-II系列FPGA上，芯片内部的互连功耗占总功耗的60%，逻辑功耗占16%，时钟和I/O单元的功耗各占14%和10%。


    大约在21世纪初，业界开始对FPGA的功耗优化产生兴趣。当时，继面积和延时优化之后，FPGA的功耗优化正在成为FPGA设计和优化的另一个主要方向。这项工作不仅提供了FPGA上动态功耗的分布结果，还为今后十年间的功耗分析和优化算法提供了详细的方法论支持。


    这项工作还是一个工业界与学术界紧密合作的典型代表。在这项工作中，赛灵思提供了FPGA器件的模型和数据集，并提供了先进的动态功耗分析方法和技术。由于学术界对Virtex-II系列的FPGA架构比较熟悉，因此不需要FPGA厂商公布额外的机密信息，这也使得这项工作使用的方法论有着很强的通用性。


    ##### 4．Stratix FPGA的布线和逻辑架构


    **一句话总结：**奠定五代Stratix核心架构的基石之作


    **英文名：**The Stratix Routing and Logic Architecture


    **作者：**David Lewis，Vaughn Betz，David Jefferson，Andy Lee，Chris Lane，Paul Leventis，Sandy
    Marquardt，Cameron McClintock，Bruce Pedersen，Giles Powell，Srinivas Reddy，Chris
    Wysocki，Richard Cliff，Jonathan Rose


    **发表时间：**2003年


    **推介人：**Herman Schmit（卡耐基-梅隆大学）


    在过去的很多年中，由Jonathan Rose教授领导的多伦多大学团队开发了名为VPR（Versatile Place and Route）的FPGA设计工具套件，并用来设计和探索简化过的FPGA系统架构和微架构。VPR包含FPGA后端设计的很多算法和流程，包含逻辑封装、布局和布线等。这使得很多的FPGA架构问题都可以借助VPR进行量化分析，而这也使得多伦多大学成为了全球最重要的FPGA学术研究中心之一。


    1998年，Jonathan Rose教授创办了一个名为RightTrack CAD的初创公司，其主旨就是将VPR进行商业转化。与此同时，Altera也在努力改进他们的FPGA架构，以应对赛灵思成功的Virtex系列带来的竞争。2000年，Altera收购了RightTrack公司，并开发了Altera
    FPGA建模工具包（Modelling Toolkit），用来优化他们的第一代Stratix FPGA架构。


    这项成果就详细介绍了Stratix架构的技术细节。更重要的是，它系统阐述了FPGA架构师在设计Stratix时所作决策的具体过程。这项工作证明了VPR所采用的定量分析方法同样适用于分析实际FPGA的性能和设计指标，如FPGA的物理面积和关键路径延时等。这些方法和工具已经被用于接下来的至少5代Stratix
    FPGA的设计。而这项工作也成功地展示了学术研究与工业界技术发展之间的紧密联系与合作。


    ##### 5．量化FPGA与ASIC的区别


    **一句话总结：**FPGA基准测试的标杆之作


    **英文名：**Measuring the Gap between FPGAs and ASICs


    **作者：**Ian Kuon，Jonathan Rose


    **发表时间：**2006年


    **推介人：**Herman Schmit（卡耐基-梅隆大学）


    值得注意的是，自内容发表以来，这项工作已被引用超过1400次，这也使它成为了被引用次数最多的FPGA文章之一。它的最主要贡献就是对可编程性的成本进行了量化。这项工作表明，FPGA的核心面积要比一个标准的ASIC单元大40倍。对于所有致力于提升和改进FPGA架构的工作来说，这就是它们最主要的动力之一。


    在这项工作之前，FPGA与ASIC之间大多数的比较都基于小型电路，并且倾向于对比FPGA与掩膜可编程门阵列（Maskprogrammable Gate Arrays）。在这种情况下，FPGA比ASIC的面积只增加了约10倍。然而，到了2006年，ASIC的EDA工具已经得到了长足的发展和进步。基于可综合的逻辑单元的ASIC设计已经成为了业界的常见选择。


    从客观上讲，这里所说的40倍面积实际并不合理，因为这里只考虑了FPGA核心区域的面积，同时很多的逻辑和算术运算单元都没有使用固化的乘法器帮助实现。在这项成果中，它根据电路中是否包含算术运算、内存单元、结构化逻辑以及寄存器，将待研究的基准电路集分成了四大类。例如，在包含逻辑单元和算术运算单元的电路设计中，如果FPGA架构里包含固化的乘法器和DSP单元，那么相比ASIC而言FPGA的面积会大28倍。'
  fmt: '

    ![](OEBPS/Images/Figure-P168_1714.jpg)


    图5-2　丛京生教授


    丛教授的研究兼顾了学术深度，也有着很高的实用性。因此，他的研究一直保持着很高的商业转化记录。例如，他曾联合创办了Aplus Design Technologies公司，后被Synopsis公司收购。在2006年，他和当时的博士生张志如（现任康奈尔大学副教授）联合创办了AutoESL公司。在前面的章节介绍过，AutoESL公司的AutoPilot工具是高层次综合领域最成功的学术成果商业化的案例。AutoESL随后被赛灵思公司收购，AutoPilot工具也随后更名为Vivado
    HLS。除此之外，丛教授目前是初创公司Falcon Computing Solutions的联合创始人和首席科学顾问，这家公司专注于为数据中心提供可编程计算方案。


    丛教授还和国内外的大学和研究机构保持着高效的合作和联系。例如，丛教授牵头成立了北京大学高能效计算与应用中心，并任中心主任和客座教授。此外，他还任北京大学-UCLA理工联合研究所共同主任。


    ### 5.1.3 帝国理工学院


    英国帝国理工学院（Imperial College London）也有着悠久的FPGA研究传统。在FPGA领域，帝国理工比较知名的教授有来自电子系的George
    Constantinides、Peter Cheung，以及来自计算机系的Wayne Luk（陆永青）三位，见图5-3。其中，Constantinides是电子系电路与系统研究组主任，他有很强的数学功底，因此他的研究方向主要集中在和数学相关的FPGA字长优化、高层次综合算法，以及近年来不断兴起的近似计算等领域。Cheung和Luk两位华人教授是FPGA学术研究领域的元老级人物，他们的研究奠定了很多近现代FPGA发展的大方向。其中，Cheung曾任帝国理工学院电子系主任，他主要专注于研究FPGA设计过程中可能出现的各种问题，如可重构设计、信号处理、可靠性、工艺漂移（Process
    Variation）等。Luk的研究更偏高层应用，包括FPGA的设计语言、建模和工具等，以及如何使用可重构硬件进行特定算法和应用的加速计算。


    ![](OEBPS/Images/Figure-P170_1730.jpg)


    图5-3　帝国理工学院的FPGA知名教授


    值得一提的是，Cheung和Luk两位教授是FPGA领域很多知名学术会议和期刊的创始人和主要发起者。例如，Luk是FPL和FPT两大FPGA顶会的创始人，同时是FPGA领域的知名期刊TRETS的创刊者。目前，Luk还是我国初创公司鲲云科技的联合创始人和首席科学官。


    ### 5.1.4 清华大学


    清华大学电子工程系的汪玉教授是当前国内FPGA研究领域的领军人物之一，见图5-4。汪玉教授目前任电子工程系主任、信息科学技术学院副院长。他本硕博均毕业于清华大学，博士导师是杨华中教授和谢源教授。值得一提的是，谢源教授目前任教于加州大学圣塔芭芭拉分校，同时担任阿里平头哥的首席科学家、阿里达摩院计算技术实验室负责人。


    汪玉教授的主要研究方向是EDA和硬件计算加速，已发表了200余篇学术论文，并三次获得最佳论文奖。他近年来最引人注目的工作，就是利用FPGA对深度神经网络进行剪枝、压缩和优化，从而在精度损失极小的情况下取得几十倍的网络压缩。在这个工作的基础上，汪玉教授的研究组还提出了对应的硬件架构、编译器和设计框架，形成了完整的用于神经网络推断的低功耗高性能系统。更加引人注目的是，基于这一系列工作，汪玉教授作为联合创始人创办了深鉴科技，并一度成为国内当红的AI初创公司。在2018年，深鉴科技被赛灵思收购，其DPU和DNNDK开发工具包也被随后整合到赛灵思最新推出的Vitis
    AI开发框架中。


