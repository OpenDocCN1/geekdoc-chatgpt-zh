- raw: '赛灵思的堆叠硅片互联（SSI）技术自2012年发布至今，已经完成了多代的演进，时至今日仍然用于赛灵思最新的FPGA器件中。作为一种多芯片的集成和互联技术，SSI能在每代半导体工艺的发展初期，迅速提升大型芯片的良率，缩短产品面世的时间，快速抢占市场份额。然而，SSI技术最主要的问题就是人为引入了硅片间的“硬边界”，并且会给芯片性能造成不可逆的负面影响，也给FPGA设计和优化工具带来了更大的挑战。


    #### ■1.3.4　英特尔EMIB技术


    英特尔从基于14nm制造的Stratix10系列FPGA开始，就采用了“异构3D系统级封装（System in Package，SiP）技术”。该技术产生的背景，与半导体制造工艺的发展也有密切联系，最主要的因素有以下两点：


    第一，对于不同功能的IP，它们所对应的成熟或性价比更高的制造工艺不尽相同。例如，对于逻辑电路而言，工艺越先进通常会带来更好的性能和功耗，这也是为何CPU、GPU、FPGA等芯片产品不断追求新工艺的原因。然而对于很多其他类型的IP，如DRAM、Flash、传感器和模拟器件等，它们都适合或只能使用已成熟的工艺进行制造。这样就需要提供一种全新的硅片互连方式，将不同代的IP进行异构整合。


    第二，不同IP的更新迭代速度不同。这里最典型的例子就是各类收发器IP与FPGA的整合。对于相同的FPGA，例如Stratix10，可能需要集成不同类型的收发器，由此形成多种FPGA的子产品门类。这些FPGA产品可能需要支持不同的协议和标准，如PCIe、以太网等，也可能有不同的数据速率的发展和迭代，如从10.3Gbps到28Gbps，再到56Gbps等。但是如果将收发器和FPGA进行同构集成，也就是做在同一枚硅片上，那么每次收发器进行功能迭代和发展，都要重新进行整枚芯片的流片过程。同时，如果需要支持不同的速率或标准，就需要制造多个不同的完整芯片。因此，需要一种全新的硅片集成方式，既能保持FPGA硅片独立不变，又能异构连接多种收发器IP以组成完整系统。


    为了应对这两个问题，英特尔提出了一个名为“嵌入式多硅片互联桥接（Embedded Multi-die Interconnect Bridge，EMIB）”的技术。EMIB技术的示意图和封装切面图如图1-10所示。可以看到，和赛灵思的SSI技术不同，EMIB没有引入额外的硅中介层，而是只在两枚硅片边缘连接处加入了一条硅桥接层（Silicon
    Bridge），并重新定制化硅片边缘的I/O引脚以配合桥接标准。


    ![](OEBPS/Images/Figure-P36_544.jpg)


    图1-10　EMIB技术示意图


    与SSI这样使用硅中介层的技术相比，EMIB最大的优点在于它降低了系统的制造复杂度，并降低了不同硅片间的传输延时。由于无须制造覆盖整个芯片的硅中介层，以及遍布在硅中介层上的大量硅通孔，EMIB只需使用较小的硅桥在硅片间进行互连就可以满足硅片间的互联需求。同样地，由芯片I/O至封装引脚的连接和普通封装技术相比并未变化，因而无须再通过TSV或硅中介层进行走线。此外，硅桥接只需在硅片边缘进行，不需要在中介层中使用长导线。对于模拟器件（如收发器）而言，由于不存在通用的中介层，因此对高速信号的干扰明显降低。


    在英特尔的Stratix10系列FPGA中，EMIB目前主要被用来进行FPGA与收发器以及高带宽存储器HBM的连接，如图1-11所示。这些由EMIB与FPGA互连的部分，英特尔将其称为不同的“Tiles”（子模块）。Stratix10系列FPGA和赛灵思的3D
    FPGA最大的不同点，在于它的可编程逻辑阵列部分使用了一枚完整的FPGA硅片，而非多个分立的小型FPGA硅片，这使其理论上可以规避上文提到的多硅片模型的各种缺点。


    ![](OEBPS/Images/Figure-P37_553.jpg)


    图1-11　使用EMIB技术进行FPGA的异构集成


    在2019年的HotChips大会上，一家名为Ayar Labs的初创公司展示了一款名为TeraPHY的硅光学收发器。这个硅光收发器以芯粒（Chiplet）的形式，通过EMIB技术集成在英特尔Stratix10
    FPGA上，并完成异构芯片封装。相比传统的电气收发器，这个光学收发器的最高数据带宽可达2Tbps，传输距离最高可达2km，而每比特的传输功耗则不超过1pJ（10^(\-12)
    J）。


    除了收发器和HBM外，EMIB还可以用来直接连接多个FPGA硅片。例如在前文提到的目前世界上最大的FPGA-Stratix10 GX 10M中，英特尔首次将两个拥有510万可编程逻辑单元的大型FPGA硅片通过EMIB相连，由此形成一个超大FPGA。这两个FPGA硅片通过25920个EMIB数据接口进行互连，其中每个数据连接可以提供2Gbps的吞吐量，因此系统整体的通信吞吐量高达6.5TBps。这事实上是在印证EMIB技术完全可以胜任处理超高带宽的吞吐量需求。


    从另一个角度看，这种异构集成技术解耦了FPGA与各种IP单元的开发周期，形成了一种模块化的系统集成方案。这种基于EMIB的桥接方式，能够将FPGA与其他不同功能的IP，以及不同的制造工艺进行混合集成。这样使得不同的IP可以在最优的制造工艺下实现，并分别进行工艺迭代。这进一步扩展了FPGA的应用场景，加速了细分产品的面市时间。在简化芯片本身开发的同时，研发资源也可以逐渐转移到软件和生态层面，相对而言降低了开发门槛，使得更多开发者加入，有助于扩大整个生态系统。


    #### ■1.3.5　基于EMIB技术的异构FPGA的潜在问题


    值得注意的是，基于EMIB的异构FPGA集成方式也有一些潜在的问题和风险。


    首先，当使用单枚较大的FPGA硅片时，每代工艺早期的良率将可能会成为很大的问题，这会直接影响产品的面世时间。在当前激烈的市场竞争下，谁的产品优先面世，谁就能抢占更多的市场。不过，随着半导体制造工艺不断推进，技术难度不断增加，两代工艺的间隔会被逐渐拉长，这样会使得每代工艺的成熟时间也对应增长，从而在一定程度上缓解工艺早期的良率问题。


    第二，通过EMIB连接不同硅片后，可能会形成一个不规则的芯片结构，由此可能引发一系列潜在的问题。在英特尔Stratix10 MX FPGA中（如图1-12所示），可以看到FPGA与HBM以及收发器的布局排列并不规则。由于EMIB是无源器件，且FPGA和其他外置位IP的制作工艺、集成方法都不尽相同，例如Stratix10
    MX中的高带宽存储器HBM是基于TSV制造的3D芯粒。那么，在芯片工作时，EMIB两端的一致性可能会成为问题，如发热不均衡导致的应力、连接和可靠性问题等。


    ![](OEBPS/Images/Figure-P39_574.jpg)


    图1-12　Stratix 10 MX FPGA芯片图（图片来自英特尔）


    #### ■1.3.6　EMIB技术小结


    EMIB是英特尔在芯片互连和集成领域的杀手锏，它能够将多种不同工艺、不同功能、不同大小的硅片进行互连集成，同时提供高带宽、低延时的数据传输性能。除了FPGA之外，EMIB已经被广泛用于英特尔的其他芯片产品，如旗下的Nervana
    AI芯片NNP-I等。


    值得注意的是，EMIB并不是英特尔唯一的3D互连和集成技术。事实上，上文介绍的SSI和EMIB技术也并非是真正意义上的3D芯片技术，这是因为各个硅片仍然只是排列在二维平面，而只是通过额外的中介层或桥接进行互连和集成。在业界，这种集成技术通常被称为2.5D技术，即介于二维芯片和三维芯片之间。


    在2019年初，英特尔就公布了一项名为Foveros的“真·3D”封装技术，它可以将CPU、GPU、DRAM、Cache等不同功能的硅片堆叠在一起，然后再封装成为一枚完整的芯片。Foveros将在英特尔基于10nm工艺的Lakefield
    CPU上使用。


    值得相信，随着半导体集成与封装技术的不断推进，诸如Foveros的3D芯片技术也必将用于FPGA上，3D FPGA芯片也终将面世并逐渐成为主流，将来也必然会出现更大、更复杂的FPGA器件。而驱动它出现的技术，也将不断推动科技和文明的延续。


    ### 1.4　突破集成度的边界——从FPGA到ACAP


    #### ■1.4.1　ACAP概述


    2018年，赛灵思推出了名为ACAP的芯片产品。在发布伊始，赛灵思CEO Victor Peng就再三强调，ACAP并不是FPGA，而是整合了硬件可编程逻辑单元、软件可编程处理器，以及软件可编程加速引擎的下一代计算平台，是赛灵思“发明FPGA以来最卓越的工程成就”，足可见这个产品系列的重要性。


    与其说ACAP是某种具体的芯片产品，不如说它像FPGA一样，代指一种芯片架构。在2019年，赛灵思公布了基于ACAP架构的首款产品：Versal。相比传统的FPGA架构，Versal
    ACAP在系统架构、电路结构、互连方式等很多方面进行了大胆革新。在本节中，笔者将对Versal和ACAP的各项技术创新进行详细的介绍与解读。


    #### ■1.4.2　芯片架构：在传统中变革


    Versal ACAP基于台积电的7nm工艺制造，它的芯片布局如图1-13所示。总体来看，它与传统FPGA结构非常类似，主要包含可编程逻辑部分、高速I/O与收发器、嵌入式处理器、存储器控制等FPGA的常见硬件资源与模块。


    ![](OEBPS/Images/Figure-P41_610.jpg)


    图1-13　Versal ACAP芯片资源布局


    与传统FPGA相比，ACAP架构有两点主要的不同：第一，芯片中固化了一组AI加速引擎阵列，如图1-14所示。在Versal中，包含400个AI引擎单元（AI
    Engine），并按横竖两个方向分布排列。这些AI加速引擎主要用来加速神经网络的推断计算和无线网络等应用中常见的数学计算和信号处理，其峰值INT8性能可以达到133TOPs。在每个AI加速引擎中，包含两种内置处理器，一个是32位的RISC处理器，另外一个是有着512位数据总线的向量处理器，可以进行单指令多数据（SIMD）的定点数与浮点数并行计算。此外，每个AI引擎有32KB分布式内存，其中L1缓存有12.5MB。每个AI引擎的内存单元也可以和临近的AI引擎以DMA的方式共享。


    ACAP架构的第二个创新点是在传统FPGA片上互连技术的基础上，采用了固化的片上网络（Network on Chip，NoC）技术，这主要是针对高带宽、高吞吐量的应用场景。NoC一方面可以提供超高的数据传输带宽，另一方面减少了布局布线的压力。因此，相比于传统的FPGA互连方法，NoC可以提供高达8倍的能效优化。


    ![](OEBPS/Images/Figure-P42_620.jpg)


    图1-14　Versal ACAP中的AI加速引擎阵列（图片来自赛灵思）


    相比基于CPU或GPU的开发，FPGA开发最大的痛点之一就是编译时间过长。通常情况下，编译一个中等规模的FPGA设计往往需要几个小时之久。为此，Versal
    ACAP架构采用了更加规整的可编程逻辑阵列和时钟域分布。通过这种方式，大大提升了IP接口的复用性。也就是说，把一个IP从一个位置移动到另一个位置时，不需要对整个设计重新编译，只需要单独处理修改的部分即可。这样一来，用户可以重复使用已经完成布局布线的“半成品”或“模板”，只需要在事先保留的区域内加入新设计即可，这样可以极大地减少编译时间。


    #### ■1.4.3　CLB微结构：翻天覆地


    CLB是可编程逻辑块（Configurable Logic Block）的缩写，它包含了多个可编程逻辑单元及其互连，是FPGA体系架构中的主要组成部分。与传统FPGA相比，Versal
    ACAP对它的CLB微结构进行了“翻天覆地”式的重大革新。其中，最主要的架构变化有以下4点。


    第一，与赛灵思现有的UltraScale FPGA架构相比，ACAP中的CLB面积扩大了4倍，如图1-15所示。也就是说，在新的CLB中包含32个LUT和64个寄存器。这样做的主要目的，是为了减少全局布线资源的使用。ACAP为每个CLB设置了单独的内部高速互连，与全局布线相比，这些内部互连更加快速，布线逻辑也更简单，从而减轻了全局布线的压力与拥挤。采用了大CLB后，有18%的布线可以直接通过内部互连完成。而对于传统FPGA，只有7%的布线能在CLB内完成，而其他的布线都需要通过占用全局布线资源。


    ![](OEBPS/Images/Figure-P44_663.jpg)


    图1-15　Versal ACAP的新CLB结构


    第二，每个查找表结构LUT增加了一个额外的输出，这是一个重要的架构变化，如图1-16所示。传统FPGA的LUT结构曾经只有4个输入，当前的大部分FPGA已经将其增加为6输入、2输出，从而可以实现任意的6输入逻辑，或者两个5输入逻辑。当添加了一个新的输出之后，就可以在一个LUT内实现两个独立的6输入逻辑功能。这种结构的另外一个好处是允许更多的逻辑功能进行合并，以减少LUT的使用量。FPGA设计工具会根据两个LUT的距离，判断这两个LUT里的逻辑能否进行合并。例如，与UltraScale架构相比，当两个LUT之间的距离小于5个Slice网格距离时，Versal
    ACAP架构能多合并21.5%的逻辑功能，从而减少相应的硬件资源使用。


    ![](OEBPS/Images/Figure-P45_684.jpg)


    图1-16　Versal ACAP的新LUT结构


    作为代价，在UltraScale架构中的宽函数功能被移走。因此如果需要实现例如32选1的选择器时，可能就会将逻辑扩展到多个逻辑片，而这将对时序造成负面影响，并且需要额外的硬件资源支持。


    第三，每个逻辑片的进位链逻辑结构进行了彻底修改。在这其中，一直是现代FPGA标配的加法器进位链被完全移除，取而代之的是使用LUT中新增加的“进位输入”信号和查找表逻辑完成加法和进位传输。


    第四，引入了名为“Imux寄存器”的新结构。这种结构与英特尔Stratix10和Agilex系列FPGA中的HyperFlex架构有着异曲同工之妙，它们的主要目的都是用于在关键路径中引入额外的寄存器和流水线层级，从而实现流水线重定时（Retiming），加速时序收敛的过程。关于英特尔HyperFlex架构的细节介绍，将会在1.5节给出。值得注意的是，与HyperFlex架构相比，赛灵思的Imux结构有着它的不同之处。例如，这些Imux寄存器包含了复位、初始化、时钟使能等常见的寄存器功能，而不是HyperFlex里采用的锁存器（Latch）结构。此外，Imux只存在于CLB之前，且并没有在全部的布线资源上都设置寄存器，因此引入的额外延时会更小。但在深度流水线设计中，这种结构的绝对性能应该不如HyperFlex。


    #### ■1.4.4　第四代SSI技术：3D FPGA的进一步优化


    ACAP采用了赛灵思的第四代硅片堆叠技术SSI。SSI的技术细节和主要优缺点在前文已经详细介绍过。针对SSI技术延时较高的主要缺点，ACAP在架构层面进行了大量优化。例如，在Versal架构中，采用了更多的硅片间的互联通道（SLL
    Channel）。同时，这些互联通道的传输延时也得到了进一步优化，相比传统连线的延时下降了30%。


    #### ■1.4.5　片上网络：高带宽数据传输的全新利器


    在诸如DDR存储器、高速网络、PCIe等高速接口与应用中，通常有着很高的带宽要求。为了应对这个问题，一方面需要采用高位宽的总线，另一方面需要高速时钟。因此，传统的FPGA设计方法都是通过对总线进行深度流水线来实现高带宽和高吞吐量。但是，对于一个大型设计而言，这种方法会很快造成FPGA片上布线资源的拥挤，继而导致时序收敛困难和性能下降。这就需要寻找有效的方法，同时解决高速数据传输和低拥堵布线两个问题。


    ACAP带来的答案就是片上网络NoC技术，它的结构示意图如图1-17所示。在传统的FPGA布线资源之外，ACAP引入了固化的NoC网络，将需要进行高速数据传输的内容转化成基于数据包的形式，通过片上网络的交换机逻辑实现数据交换。这种方法最大的优点是，在系统层面将数据传输与数据计算进行了分离，从而在保证带宽的基础上，缓解了系统的布局布线压力。例如，数据计算可以在AI引擎或片上其他部分实现，而不需紧靠DDR控制器等高速接口。同时，与网络应用类似，这种片上网络也能对各类的传输进行服务质量控制（QoS）。


    ![](OEBPS/Images/Figure-P47_711.jpg)


    图1-17　ACAP采用的片上网络NoC结构示意图


    不过，在FPGA上采用片上网络的主要问题是引入了额外的传输延时，这对于需要固定延时或者低延时的应用可能会有影响。此外，片上网络的位宽是固定的，无法对应用进行优化，这也有可能对不同应用的系统性能造成负面影响。


    ### 1.5　灵活与敏捷共存——英特尔Agilex FPGA


    伴随着英特尔10nm工艺的逐渐成熟，基于10nm工艺的FPGA也终于揭开了它神秘的面纱。2019年4月，曾经代号为Falcon Mesa的英特尔最新一代10nm
    FPGA正式亮相，并命名为“Agilex”。


    Agilex是Agile（敏捷）和Flexible（灵活）的结合，而这两个特点正是现代FPGA技术最为核心的两大要点。具体来说，“灵活性”就是指可编程性，它基于FPGA的核心技术——可编程逻辑阵列，可以灵活地针对不同应用场景进行编程，并改变FPGA的逻辑结构和功能。“敏捷性”指的是异构，它既可以是不同逻辑单元之间的异构，也可以是不同工艺的异构，或者两者兼而有之。前文曾提到，不同类型的IP所对应的成熟工艺与迭代时间都不尽相同，只有采用异构的模式，才能充分发挥不同IP和不同工艺节点的优势，取长补短，在性能和成本上取得良好的平衡。正因如此，异构FPGA也是未来FPGA架构发展和研究的主要方向。


    在这个大背景下，Agilex FPGA应运而生。它既包含了传统FPGA灵活的可编程性，又结合了现代FPGA基于异构架构的敏捷性，因此能够同时适用于众多应用领域，并针对不同的应用场景进行配置和快速迭代。


    与进化多年的Stratix、Arria、Cyclone、Max等FPGA产品系列相比，Agilex是原FPGA巨头Altera在2015年底被英特尔收购，并成为其可编程方案事业部（PSG）后正式推出的一个全新的FPGA系列。正因如此，Agilex无疑被英特尔寄予了更多的期待。在这些期待背后，离不开来自英特尔的核心技术的加持。而这也将是区分Agilex与它的前代产品，以及其他竞争产品的最主要的优势。


    #### ■1.5.1　英特尔10nm工艺能否后发制人


    英特尔在半导体领域称雄几十年，靠的就是两个独门绝技：第一是众所周知的x86架构，第二则是曾经遥遥领先竞争对手的半导体制造工艺。这也促成了英特尔著名的“Tick-Tock”战略，即架构和工艺的更新逐年交错进行，同时还能保持处理器性能的稳步增长。'
  fmt: '

    赛灵思的堆叠硅片互联（`SSI`）技术自2012年发布至今，已经完成了多代的演进，时至今日仍然用于赛灵思最新的`FPGA`器件中。作为一种多芯片的集成和互联技术，`SSI`能在每代半导体工艺的发展初期，迅速提升大型芯片的良率，缩短产品面世的时间，快速抢占市场份额。然而，`SSI`技术最主要的问题就是人为引入了硅片间的“硬边界”，并且会给芯片性能造成不可逆的负面影响，也给`FPGA`设计和优化工具带来了更大的挑战。


    ### 1.3.4 英特尔EMIB技术


    英特尔从基于14nm制造的`Stratix10`系列`FPGA`开始，就采用了“异构3D系统级封装（System in Package，`SiP`）技术”。该技术产生的背景，与半导体制造工艺的发展也有密切联系，最主要的因素有以下两点：


    第一，对于不同功能的`IP`，它们所对应的成熟或性价比更高的制造工艺不尽相同。例如，对于逻辑电路而言，工艺越先进通常会带来更好的性能和功耗，这也是为何`CPU`、`GPU`、`FPGA`等芯片产品不断追求新工艺的原因。然而对于很多其他类型的`IP`，如`DRAM`、`Flash`、传感器和模拟器件等，它们都适合或只能使用已成熟的工艺进行制造。这样就需要提供一种全新的硅片互连方式，将不同代的`IP`进行异构整合。


    第二，不同`IP`的更新迭代速度不同。这里最典型的例子就是各类收发器`IP`与`FPGA`的整合。对于相同的`FPGA`，例如`Stratix10`，可能需要集成不同类型的收发器，由此形成多种`FPGA`的子产品门类。这些`FPGA`产品可能需要支持不同的协议和标准，如`PCIe`、以太网等，也可能有不同的数据速率的发展和迭代，如从10.3Gbps到28Gbps，再到56Gbps等。但是如果将收发器和`FPGA`进行同构集成，也就是做在同一枚硅片上，那么每次收发器进行功能迭代和发展，都要重新进行整枚芯片的流片过程。同时，如果需要支持不同的速率或标准，就需要制造多个不同的完整芯片。因此，需要一种全新的硅片集成方式，既能保持`FPGA`硅片独立不变，又能异构连接多种收发器`IP`以组成完整系统。


    为了应对这两个问题，英特尔提出了一个名为“嵌入式多硅片互联桥接（Embedded Multi-die Interconnect Bridge，`EMIB`）”的技术。`EMIB`技术的示意图和封装切面图如图1-10所示。可以看到，和赛灵思的`SSI`技术不同，`EMIB`没有引入额外的硅中介层，而是只在两枚硅片边缘连接处加入了一条硅桥接层（Silicon
    Bridge），并重新定制化硅片边缘的I/O引脚以配合桥接标准。


    ![](OEBPS/Images/Figure-P36_544.jpg)


    图1-10　`EMIB`技术示意图


    与`SSI`这样使用硅中介层的技术相比，`EMIB`最大的优点在于它降低了系统的制造复杂度，并降低了不同硅片间的传输延时。由于无须制造覆盖整个芯片的硅中介层，以及遍布在硅中介层上的大量硅通孔，`EMIB`只需使用较小的硅桥在硅片间进行互连就可以满足硅片间的互联需求。同样地，由芯片I/O至封装引脚的连接和普通封装技术相比并未变化，因而无须再通过`TSV`或硅中介层进行走线。此外，硅桥接只需在硅片边缘进行，不需要在中介层中使用长导线。对于模拟器件（如收发器）而言，由于不存在通用的中介层，因此对高速信号的干扰明显降低。


    在英特尔的`Stratix10`系列`FPGA`中，`EMIB`目前主要被用来进行`FPGA`与收发器以及高带宽存储器`HBM`的连接，如图1-11所示。这些由`EMIB`与`FPGA`互连的部分，英特尔将其称为不同的“Tiles”（子模块）。`Stratix10`系列`FPGA`和赛灵思的3D
    `FPGA`最大的不同点，在于它的可编程逻辑阵列部分使用了一枚完整的`FPGA`硅片，而非多个分立的小型`FPGA`硅片，这使其理论上可以规避上文提到的多硅片模型的各种缺点。


    ![](OEBPS/Images/Figure-P37_553.jpg)


    图1-11　使用`EMIB`技术进行`FPGA`的异构集成


    在2019年的HotChips大会上，一家名为Ayar Labs的初创公司展示了一款名为`TeraPHY`的硅光学收发器。这个硅光收发器以芯粒（Chiplet）的形式，通过`EMIB`技术集成在英特尔`Stratix10`
    `FPGA`上，并完成异构芯片封装。相比传统的电气收发器，这个光学收发器的最高数据带宽可达2Tbps，传输距离最高可达2km，而每比特的传输功耗则不超过1pJ（10^(-12)
    J）。


    除了收发器和`HBM`外，`EMIB`还可以用来直接连接多个`FPGA`硅片。例如在前文提到的目前世界上最大的`FPGA`-`Stratix10` GX 10M中，英特尔首次将两个拥有510万可编程逻辑单元的大型`FPGA`硅片通过`EMIB`相连，由此形成一个超大`FPGA`。这两个`FPGA`硅片通过25920个`EMIB`数据接口进行互连，其中每个数据连接可以提供2Gbps的吞吐量，因此系统整体的通信吞吐量高达6.5TBps。这事实上是在印证`EMIB`技术完全可以胜任处理超高带宽的吞吐量需求。


    从另一个角度看，这种异构集成技术解耦了`FPGA`与各种`IP`单元的开发周期，形成了一种模块化的系统集成方案。这种基于`EMIB`的桥接方式，能够将`FPGA`与其他不同功能的`IP`，以及不同的制造工艺进行混合集成。这样使得不同的`IP`可以在最优的制造工艺下实现，并分别进行工艺迭代。这进一步扩展了`FPGA`的应用场景，加速了细分产品的面市时间。在简化芯片本身开发的同时，研发资源也可以逐渐转移到软件和生态层面，相对而言降低了开发门槛，使得更多开发者加入，有助于扩大整个生态系统。


    ### 1.3.5 基于EMIB技术的异构FPGA的潜在问题


    值得注意的是，基于`EMIB`的异构`FPGA`集成方式也有一些潜在的问题和风险。


    首先，当使用单枚较大的`FPGA`硅片时，每代工艺早期的良率将可能会成为很大的问题，这会直接影响产品的面世时间。在当前激烈的市场竞争下，谁的产品优先面世，谁就能抢占更多的市场。不过，随着半导体制造工艺不断推进，技术难度不断增加，两代工艺的间隔会被逐渐拉长，这样会使得每代工艺的成熟时间也对应增长，从而在一定程度上缓解工艺早期的良率问题。


    第二，通过`EMIB`连接不同硅片后，可能会形成一个不规则的芯片结构，由此可能引发一系列潜在的问题。在英特尔`Stratix10` MX `FPGA`中（如图1-12所示），可以看到`FPGA`与`HBM`以及收发器的布局排列并不规则。由于`EMIB`是无源器件，且`FPGA`和其他外置位`IP`的制作工艺、集成方法都不尽相同，例如`Stratix10`
    MX中的高带宽存储器`HBM`是基于`TSV`制造的3D芯粒。那么，在芯片工作时，`EMIB`两端的一致性可能会成为问题，如发热不均衡导致的应力、连接和可靠性问题等。


    ![](OEBPS/Images/Figure-P39_574.jpg)


    图1-12　`Stratix 10 MX FPGA`芯片图（图片来自英特尔）


    ### 1.3.6 EMIB技术小结


    `EMIB`是英特尔在芯片互连和集成领域的杀手锏，它能够将多种不同工艺、不同功能、不同大小的硅片进行互连集成，同时提供高带宽、低延时的数据传输性能。除了`FPGA`之外，`EMIB`已经被广泛用于英特尔的其他芯片产品，如旗下的Nervana
    AI芯片`NNP-I`等。


    值得注意的是，`EMIB`并不是英特尔唯一的3D互连和集成技术。事实上，上文介绍的`SSI`和`EMIB`技术也并非是真正意义上的3D芯片技术，这是因为各个硅片仍然只是排列在二维平面，而只是通过额外的中介层或桥接进行互连和集成。在业界，这种集成技术通常被称为2.5D技术，即介于二维芯片和三维芯片之间。


    在2019年初，英特尔就公布了一项名为`Foveros`的“真·3D”封装技术，它可以将`CPU`、`GPU`、`DRAM`、`Cache`等不同功能的硅片堆叠在一起，然后再封装成为一枚完整的芯片。`Foveros`将在英特尔基于10nm工艺的`Lakefield
    CPU`上使用。


    值得相信，随着半导体集成与封装技术的不断推进，诸如`Foveros`的3D芯片技术也必将用于`FPGA`上，3D `FPGA`芯片也终将面世并逐渐成为主流，将来也必然会出现更大、更复杂的`FPGA`器件。而驱动它出现的技术，也将不断推动科技和文明的延续。


    ## 1.4 突破集成度的边界——从FPGA到ACAP


    ### 1.4.1 ACAP概述


    2018年，赛灵思推出了名为`ACAP`的芯片产品。在发布伊始，赛灵思CEO Victor Peng就再三强调，`ACAP`并不是`FPGA`，而是整合了硬件可编程逻辑单元、软件可编程处理器，以及软件可编程加速引擎的下一代计算平台，是赛灵思“发明`FPGA`以来最卓越的工程成就”，足可见这个产品系列的重要性。


    与其说`ACAP`是某种具体的芯片产品，不如说它像`FPGA`一样，代指一种芯片架构。在2019年，赛灵思公布了基于`ACAP`架构的首款产品：`Versal`。相比传统的`FPGA`架构，`Versal
    ACAP`在系统架构、电路结构、互连方式等很多方面进行了大胆革新。在本节中，笔者将对`Versal`和`ACAP`的各项技术创新进行详细的介绍与解读。


    ### 1.4.2 芯片架构：在传统中变革


    `Versal ACAP`基于台积电的7nm工艺制造，它的芯片布局如图1-13所示。总体来看，它与传统`FPGA`结构非常类似，主要包含可编程逻辑部分、高速I/O与收发器、嵌入式处理器、存储器控制等`FPGA`的常见硬件资源与模块。


    ![](OEBPS/Images/Figure-P41_610.jpg)


    图1-13　`Versal ACAP`芯片资源布局


    与传统`FPGA`相比，`ACAP`架构有两点主要的不同：第一，芯片中固化了一组AI加速引擎阵列，如图1-14所示。在`Versal`中，包含400个AI引擎单元（`AI
    Engine`），并按横竖两个方向分布排列。这些AI加速引擎主要用来加速神经网络的推断计算和无线网络等应用中常见的数学计算和信号处理，其峰值INT8性能可以达到133TOPs。在每个`AI
    Engine`中，包含两种内置处理器，一个是32位的`RISC`处理器，另外一个是有着512位数据总线的向量处理器，可以进行单指令多数据（`SIMD`）的定点数与浮点数并行计算。此外，每个`AI
    Engine`有32KB分布式内存，其中L1缓存有12.5MB。每个`AI Engine`的内存单元也可以和临近的`AI Engine`以`DMA`的方式共享。


    `ACAP`架构的第二个创新点是在传统`FPGA`片上互连技术的基础上，采用了固化的片上网络（Network on Chip，`NoC`）技术，这主要是针对高带宽、高吞吐量的应用场景。`NoC`一方面可以提供超高的数据传输带宽，另一方面减少了布局布线的压力。因此，相比于传统的`FPGA`互连方法，`NoC`可以提供高达8倍的能效优化。


    ![](OEBPS/Images/Figure-P42_620.jpg)


    图1-14　`Versal ACAP`中的AI加速引擎阵列（图片来自赛灵思）


    相比基于`CPU`或`GPU`的开发，`FPGA`开发最大的痛点之一就是编译时间过长。通常情况下，编译一个中等规模的`FPGA`设计往往需要几个小时之久。为此，`Versal
    ACAP`架构采用了更加规整的可编程逻辑阵列和时钟域分布。通过这种方式，大大提升了`IP`接口的复用性。也就是说，把一个`IP`从一个位置移动到另一个位置时，不需要对整个设计重新编译，只需要单独处理修改的部分即可。这样一来，用户可以重复使用已经完成布局布线的“半成品”或“模板”，只需要在事先保留的区域内加入新设计即可，这样可以极大地减少编译时间。


    ### 1.4.3 CLB微结构：翻天覆地


    `CLB`是可编程逻辑块（Configurable Logic Block）的缩写，它包含了多个可编程逻辑单元及其互连，是`FPGA`体系架构中的主要组成部分。与传统`FPGA`相比，`Versal
    ACAP`对它的`CLB`微结构进行了“翻天覆地”式的重大革新。其中，最主要的架构变化有以下4点。


    第一，与赛灵思现有的`UltraScale FPGA`架构相比，`ACAP`中的`CLB`面积扩大了4倍，如图1-15所示。也就是说，在新的`CLB`中包含32个`LUT`和64个寄存器。这样做的主要目的，是为了减少全局布线资源的使用。`ACAP`为每个`CLB`设置了单独的内部高速互连，与全局布线相比，这些内部互连更加快速，布线逻辑也更简单，从而减轻了全局布线的压力与拥挤。采用了大`CLB`后，有18%的布线可以直接通过内部互连完成。而对于传统`FPGA`，只有7%的布线能在`CLB`内完成，而其他的布线都需要通过占用全局布线资源。


    ![](OEBPS/Images/Figure-P44_663.jpg)


    图1-15　`Versal ACAP`的新`CLB`结构


    第二，每个查找表结构`LUT`增加了一个额外的输出，这是一个重要的架构变化，如图1-16所示。传统`FPGA`的`LUT`结构曾经只有4个输入，当前的大部分`FPGA`已经将其增加为6输入、2输出，从而可以实现任意的6输入逻辑，或者两个5输入逻辑。当添加了一个新的输出之后，就可以在一个`LUT`内实现两个独立的6输入逻辑功能。这种结构的另外一个好处是允许更多的逻辑功能进行合并，以减少`LUT`的使用量。`FPGA`设计工具会根据两个`LUT`的距离，判断这两个`LUT`里的逻辑能否进行合并。例如，与`UltraScale`架构相比，当两个`LUT`之间的距离小于5个`Slice`网格距离时，`Versal
    ACAP`架构能多合并21.5%的逻辑功能，从而减少相应的硬件资源使用。


    ![](OEBPS/Images/Figure-P45_684.jpg)


    图1-16　`Versal ACAP`的新`LUT`结构


    作为代价，在`UltraScale`架构中的宽函数功能被移走。因此如果需要实现例如32选1的选择器时，可能就会将逻辑扩展到多个逻辑片，而这将对时序造成负面影响，并且需要额外的硬件资源支持。


    第三，每个逻辑片的进位链逻辑结构进行了彻底修改。在这其中，一直是现代`FPGA`标配的加法器进位链被完全移除，取而代之的是使用`LUT`中新增加的“进位输入”信号和查找表逻辑完成加法和进位传输。


    第四，引入了名为“`Imux`寄存器”的新结构。这种结构与英特尔`Stratix10`和`Agilex`系列`FPGA`中的`HyperFlex`架构有着异曲同工之妙，它们的主要目的都是用于在关键路径中引入额外的寄存器和流水线层级，从而实现流水线重定时（Retiming），加速时序收敛的过程。关于英特尔`HyperFlex`架构的细节介绍，将会在1.5节给出。值得注意的是，与`HyperFlex`架构相比，赛灵思的`Imux`结构有着它的不同之处。例如，这些`Imux`寄存器包含了复位、初始化、时钟使能等常见的寄存器功能，而不是`HyperFlex`里采用的锁存器（Latch）结构。此外，`Imux`只存在于`CLB`之前，且并没有在全部的布线资源上都设置寄存器，因此引入的额外延时会更小。但在深度流水线设计中，这种结构的绝对性能应该不如`HyperFlex`。


    ### 1.4.4 第四代SSI技术：3D FPGA的进一步优化


    `ACAP`采用了赛灵思的第四代硅片堆叠技术`SSI`。`SSI`的技术细节和主要优缺点在前文已经详细介绍过。针对`SSI`技术延时较高的主要缺点，`ACAP`在架构层面进行了大量优化。例如，在`Versal`架构中，采用了更多的硅片间的互联通道（`SLL
    Channel`）。同时，这些互联通道的传输延时也得到了进一步优化，相比传统连线的延时下降了30%。


    ### 1.4.5 片上网络：高带宽数据传输的全新利器


    在诸如`DDR`存储器、高速网络、`PCIe`等高速接口与应用中，通常有着很高的带宽要求。为了应对这个问题，一方面需要采用高位宽的总线，另一方面需要高速时钟。因此，传统的`FPGA`设计方法都是通过对总线进行深度流水线来实现高带宽和高吞吐量。但是，对于一个大型设计而言，这种方法会很快造成`FPGA`片上布线资源的拥挤，继而导致时序收敛困难和性能下降。这就需要寻找有效的方法，同时解决高速数据传输和低拥堵布线两个问题。


    `ACAP`带来的答案就是片上网络`NoC`技术，它的结构示意图如图1-17所示。在传统的`FPGA`布线资源之外，`ACAP`引入了固化的`NoC`网络，将需要进行高速数据传输的内容转化成基于数据包的形式，通过片上网络的交换机逻辑实现数据交换。这种方法最大的优点是，在系统层面将数据传输与数据计算进行了分离，从而在保证带宽的基础上，缓解了系统的布局布线压力。例如，数据计算可以在`AI
    Engine`或片上其他部分实现，而不需紧靠`DDR`控制器等高速接口。同时，与网络应用类似，这种片上网络也能对各类的传输进行服务质量控制（`QoS`）。


    ![](OEBPS/Images/Figure-P47_711.jpg)


    图1-17　`ACAP`采用的片上网络`NoC`结构示意图


    不过，在`FPGA`上采用片上网络的主要问题是引入了额外的传输延时，这对于需要固定延时或者低延时的应用可能会有影响。此外，片上网络的位宽是固定的，无法对应用进行优化，这也有可能对不同应用的系统性能造成负面影响。


    ## 1.5 灵活与敏捷共存——英特尔Agilex FPGA


    伴随着英特尔10nm工艺的逐渐成熟，基于10nm工艺的`FPGA`也终于揭开了它神秘的面纱。2019年4月，曾经代号为`Falcon Mesa`的英特尔最新一代10nm
    `FPGA`正式亮相，并命名为“`Agilex`”。


    `Agilex`是`Agile`（敏捷）和`Flexible`（灵活）的结合，而这两个特点正是现代`FPGA`技术最为核心的两大要点。具体来说，“灵活性”就是指可编程性，它基于`FPGA`的核心技术——可编程逻辑阵列，可以灵活地针对不同应用场景进行编程，并改变`FPGA`的逻辑结构和功能。“敏捷性”指的是异构，它既可以是不同逻辑单元之间的异构，也可以是不同工艺的异构，或者两者兼而有之。前文曾提到，不同类型的`IP`所对应的成熟工艺与迭代时间都不尽相同，只有采用异构的模式，才能充分发挥不同`IP`和不同工艺节点的优势，取长补短，在性能和成本上取得良好的平衡。正因如此，异构`FPGA`也是未来`FPGA`架构发展和研究的主要方向。


    在这个大背景下，`Agilex FPGA`应运而生。它既包含了传统`FPGA`灵活的可编程性，又结合了现代`FPGA`基于异构架构的敏捷性，因此能够同时适用于众多应用领域，并针对不同的应用场景进行配置和快速迭代。


    与进化多年的`Stratix`、`Arria`、`Cyclone`、`Max`等`FPGA`产品系列相比，`Agilex`是原`FPGA`巨头`Altera`在2015年底被英特尔收购，并成为其可编程方案事业部（`PSG`）后正式推出的一个全新的`FPGA`系列。正因如此，`Agilex`无疑被英特尔寄予了更多的期待。在这些期待背后，离不开来自英特尔的核心技术的加持。而这也将是区分`Agilex`与它的前代产品，以及其他竞争产品的最主要的优势。


    ### 1.5.1 英特尔10nm工艺能否后发制人


    英特尔在半导体领域称雄几十年，靠的就是两个独门绝技：第一是众所周知的`x86`架构，第二则是曾经遥遥领先竞争对手的半导体制造工艺。这也促成了英特尔著名的“`Tick-Tock`”战略，即架构和工艺的更新逐年交错进行，同时还能保持处理器性能的稳步增长。

    '
  trans: '


    赛灵思的堆叠硅片互联（`SSI`）技术自 2012 年发布至今，已经完成了多代的演进，时至今日仍然用于赛灵思最新的`FPGA`器件中。作为一种多芯片的集成和互联技术，`SSI`能在每代半导体工艺的发展初期，迅速提升大型芯片的良率，缩短产品面世的时间，快速抢占市场份额。然而，`SSI`技术最主要的问题就是人为引入了硅片间的“硬边界”，并且会给芯片性能造成不可逆的负面影响，也给`FPGA`设计和优化工具带来了更大的挑战。


    ### 1.3.4 英特尔 EMIB 技术


    英特尔从基于 14nm 制造的`Stratix10`系列`FPGA`开始，就采用了“异构 3D 系统级封装（System in Package，`SiP`）技术”。该技术产生的背景，与半导体制造工艺的发展也有密切联系，最主要的因素有以下两点：


    第一，对于不同功能的`IP`，它们所对应的成熟或性价比更高的制造工艺不尽相同。例如，对于逻辑电路而言，工艺越先进通常会带来更好的性能和功耗，这也是为何`CPU`、`GPU`、`FPGA`等芯片产品不断追求新工艺的原因。然而对于很多其他类型的`IP`，如`DRAM`、`Flash`、传感器和模拟器件等，它们都适合或只能使用已成熟的工艺进行制造。这样就需要提供一种全新的硅片互连方式，将不同代的`IP`进行异构整合。


    第二，不同`IP`的更新迭代速度不同。这里最典型的例子就是各类收发器`IP`与`FPGA`的整合。对于相同的`FPGA`，例如`Stratix10`，可能需要集成不同类型的收发器，由此形成多种`FPGA`的子产品门类。这些`FPGA`产品可能需要支持不同的协议和标准，如`PCIe`、以太网等，也可能有不同的数据速率的发展和迭代，如从
    10.3Gbps 到 28Gbps，再到 56Gbps 等。但是如果将收发器和`FPGA`进行同构集成，也就是做在同一枚硅片上，那么每次收发器进行功能迭代和发展，都要重新进行整枚芯片的流片过程。同时，如果需要支持不同的速率或标准，就需要制造多个不同的完整芯片。因此，需要一种全新的硅片集成方式，既能保持`FPGA`硅片独立不变，又能异构连接多种收发器`IP`以组成完整系统。


    为了应对这两个问题，英特尔提出了一个名为“嵌入式多硅片互联桥接（Embedded Multi-die Interconnect Bridge，`EMIB`）”的技术。`EMIB`技术的示意图和封装切面图如图
    1-10 所示。可以看到，和赛灵思的`SSI`技术不同，`EMIB`没有引入额外的硅中介层，而是只在两枚硅片边缘连接处加入了一条硅桥接层（Silicon Bridge），并重新定制化硅片边缘的
    I/O 引脚以配合桥接标准。


    ![](img/Figure-P36_544.jpg)


    图 1-10　`EMIB`技术示意图


    与`SSI`这样使用硅中介层的技术相比，`EMIB`最大的优点在于它降低了系统的制造复杂度，并降低了不同硅片间的传输延时。由于无须制造覆盖整个芯片的硅中介层，以及遍布在硅中介层上的大量硅通孔，`EMIB`只需使用较小的硅桥在硅片间进行互连就可以满足硅片间的互联需求。同样地，由芯片
    I/O 至封装引脚的连接和普通封装技术相比并未变化，因而无须再通过`TSV`或硅中介层进行走线。此外，硅桥接只需在硅片边缘进行，不需要在中介层中使用长导线。对于模拟器件（如收发器）而言，由于不存在通用的中介层，因此对高速信号的干扰明显降低。


    在英特尔的`Stratix10`系列`FPGA`中，`EMIB`目前主要被用来进行`FPGA`与收发器以及高带宽存储器`HBM`的连接，如图 1-11 所示。这些由`EMIB`与`FPGA`互连的部分，英特尔将其称为不同的“Tiles”（子模块）。`Stratix10`系列`FPGA`和赛灵思的
    3D `FPGA`最大的不同点，在于它的可编程逻辑阵列部分使用了一枚完整的`FPGA`硅片，而非多个分立的小型`FPGA`硅片，这使其理论上可以规避上文提到的多硅片模型的各种缺点。


    ![](img/Figure-P37_553.jpg)


    图 1-11　使用`EMIB`技术进行`FPGA`的异构集成


    在 2019 年的 HotChips 大会上，一家名为 Ayar Labs 的初创公司展示了一款名为`TeraPHY`的硅光学收发器。这个硅光收发器以芯粒（Chiplet）的形式，通过`EMIB`技术集成在英特尔`Stratix10`
    `FPGA`上，并完成异构芯片封装。相比传统的电气收发器，这个光学收发器的最高数据带宽可达 2Tbps，传输距离最高可达 2km，而每比特的传输功耗则不超过
    1pJ（10^(-12) J）。


    除了收发器和`HBM`外，`EMIB`还可以用来直接连接多个`FPGA`硅片。例如在前文提到的目前世界上最大的`FPGA`-`Stratix10` GX 10M
    中，英特尔首次将两个拥有 510 万可编程逻辑单元的大型`FPGA`硅片通过`EMIB`相连，由此形成一个超大`FPGA`。这两个`FPGA`硅片通过 25920
    个`EMIB`数据接口进行互连，其中每个数据连接可以提供 2Gbps 的吞吐量，因此系统整体的通信吞吐量高达 6.5TBps。这事实上是在印证`EMIB`技术完全可以胜任处理超高带宽的吞吐量需求。


    从另一个角度看，这种异构集成技术解耦了`FPGA`与各种`IP`单元的开发周期，形成了一种模块化的系统集成方案。这种基于`EMIB`的桥接方式，能够将`FPGA`与其他不同功能的`IP`，以及不同的制造工艺进行混合集成。这样使得不同的`IP`可以在最优的制造工艺下实现，并分别进行工艺迭代。这进一步扩展了`FPGA`的应用场景，加速了细分产品的面市时间。在简化芯片本身开发的同时，研发资源也可以逐渐转移到软件和生态层面，相对而言降低了开发门槛，使得更多开发者加入，有助于扩大整个生态系统。


    ### 1.3.5 基于 EMIB 技术的异构 FPGA 的潜在问题


    值得注意的是，基于`EMIB`的异构`FPGA`集成方式也有一些潜在的问题和风险。


    首先，当使用单枚较大的`FPGA`硅片时，每代工艺早期的良率将可能会成为很大的问题，这会直接影响产品的面世时间。在当前激烈的市场竞争下，谁的产品优先面世，谁就能抢占更多的市场。不过，随着半导体制造工艺不断推进，技术难度不断增加，两代工艺的间隔会被逐渐拉长，这样会使得每代工艺的成熟时间也对应增长，从而在一定程度上缓解工艺早期的良率问题。


    第二，通过`EMIB`连接不同硅片后，可能会形成一个不规则的芯片结构，由此可能引发一系列潜在的问题。在英特尔`Stratix10` MX `FPGA`中（如图
    1-12 所示），可以看到`FPGA`与`HBM`以及收发器的布局排列并不规则。由于`EMIB`是无源器件，且`FPGA`和其他外置位`IP`的制作工艺、集成方法都不尽相同，例如`Stratix10`
    MX 中的高带宽存储器`HBM`是基于`TSV`制造的 3D 芯粒。那么，在芯片工作时，`EMIB`两端的一致性可能会成为问题，如发热不均衡导致的应力、连接和可靠性问题等。


    ![](img/Figure-P39_574.jpg)


    图 1-12　`Stratix 10 MX FPGA`芯片图（图片来自英特尔）


    ### 1.3.6 EMIB 技术小结


    `EMIB`是英特尔在芯片互连和集成领域的杀手锏，它能够将多种不同工艺、不同功能、不同大小的硅片进行互连集成，同时提供高带宽、低延时的数据传输性能。除了`FPGA`之外，`EMIB`已经被广泛用于英特尔的其他芯片产品，如旗下的
    Nervana AI 芯片`NNP-I`等。


    值得注意的是，`EMIB`并不是英特尔唯一的 3D 互连和集成技术。事实上，上文介绍的`SSI`和`EMIB`技术也并非是真正意义上的 3D 芯片技术，这是因为各个硅片仍然只是排列在二维平面，而只是通过额外的中介层或桥接进行互连和集成。在业界，这种集成技术通常被称为
    2.5D 技术，即介于二维芯片和三维芯片之间。


    在 2019 年初，英特尔就公布了一项名为`Foveros`的“真·3D”封装技术，它可以将`CPU`、`GPU`、`DRAM`、`Cache`等不同功能的硅片堆叠在一起，然后再封装成为一枚完整的芯片。`Foveros`将在英特尔基于
    10nm 工艺的`Lakefield CPU`上使用。


    值得相信，随着半导体集成与封装技术的不断推进，诸如`Foveros`的 3D 芯片技术也必将用于`FPGA`上，3D `FPGA`芯片也终将面世并逐渐成为主流，将来也必然会出现更大、更复杂的`FPGA`器件。而驱动它出现的技术，也将不断推动科技和文明的延续。


    ## 1.4 突破集成度的边界——从 FPGA 到 ACAP


    ### 1.4.1 ACAP 概述


    2018 年，赛灵思推出了名为`ACAP`的芯片产品。在发布伊始，赛灵思 CEO Victor Peng 就再三强调，`ACAP`并不是`FPGA`，而是整合了硬件可编程逻辑单元、软件可编程处理器，以及软件可编程加速引擎的下一代计算平台，是赛灵思“发明`FPGA`以来最卓越的工程成就”，足可见这个产品系列的重要性。


    与其说`ACAP`是某种具体的芯片产品，不如说它像`FPGA`一样，代指一种芯片架构。在 2019 年，赛灵思公布了基于`ACAP`架构的首款产品：`Versal`。相比传统的`FPGA`架构，`Versal
    ACAP`在系统架构、电路结构、互连方式等很多方面进行了大胆革新。在本节中，笔者将对`Versal`和`ACAP`的各项技术创新进行详细的介绍与解读。


    ### 1.4.2 芯片架构：在传统中变革


    `Versal ACAP`基于台积电的 7nm 工艺制造，它的芯片布局如图 1-13 所示。总体来看，它与传统`FPGA`结构非常类似，主要包含可编程逻辑部分、高速
    I/O 与收发器、嵌入式处理器、存储器控制等`FPGA`的常见硬件资源与模块。


    ![](img/Figure-P41_610.jpg)


    图 1-13　`Versal ACAP`芯片资源布局


    与传统`FPGA`相比，`ACAP`架构有两点主要的不同：第一，芯片中固化了一组 AI 加速引擎阵列，如图 1-14 所示。在`Versal`中，包含 400
    个 AI 引擎单元（`AI Engine`），并按横竖两个方向分布排列。这些 AI 加速引擎主要用来加速神经网络的推断计算和无线网络等应用中常见的数学计算和信号处理，其峰值
    INT8 性能可以达到 133TOPs。在每个`AI Engine`中，包含两种内置处理器，一个是 32 位的`RISC`处理器，另外一个是有着 512 位数据总线的向量处理器，可以进行单指令多数据（`SIMD`）的定点数与浮点数并行计算。此外，每个`AI
    Engine`有 32KB 分布式内存，其中 L1 缓存有 12.5MB。每个`AI Engine`的内存单元也可以和临近的`AI Engine`以`DMA`的方式共享。


    `ACAP`架构的第二个创新点是在传统`FPGA`片上互连技术的基础上，采用了固化的片上网络（Network on Chip，`NoC`）技术，这主要是针对高带宽、高吞吐量的应用场景。`NoC`一方面可以提供超高的数据传输带宽，另一方面减少了布局布线的压力。因此，相比于传统的`FPGA`互连方法，`NoC`可以提供高达
    8 倍的能效优化。


    ![](img/Figure-P42_620.jpg)


    图 1-14　`Versal ACAP`中的 AI 加速引擎阵列（图片来自赛灵思）


    相比基于`CPU`或`GPU`的开发，`FPGA`开发最大的痛点之一就是编译时间过长。通常情况下，编译一个中等规模的`FPGA`设计往往需要几个小时之久。为此，`Versal
    ACAP`架构采用了更加规整的可编程逻辑阵列和时钟域分布。通过这种方式，大大提升了`IP`接口的复用性。也就是说，把一个`IP`从一个位置移动到另一个位置时，不需要对整个设计重新编译，只需要单独处理修改的部分即可。这样一来，用户可以重复使用已经完成布局布线的“半成品”或“模板”，只需要在事先保留的区域内加入新设计即可，这样可以极大地减少编译时间。


    ### 1.4.3 CLB 微结构：翻天覆地


    `CLB`是可编程逻辑块（Configurable Logic Block）的缩写，它包含了多个可编程逻辑单元及其互连，是`FPGA`体系架构中的主要组成部分。与传统`FPGA`相比，`Versal
    ACAP`对它的`CLB`微结构进行了“翻天覆地”式的重大革新。其中，最主要的架构变化有以下 4 点。


    第一，与赛灵思现有的`UltraScale FPGA`架构相比，`ACAP`中的`CLB`面积扩大了 4 倍，如图 1-15 所示。也就是说，在新的`CLB`中包含
    32 个`LUT`和 64 个寄存器。这样做的主要目的，是为了减少全局布线资源的使用。`ACAP`为每个`CLB`设置了单独的内部高速互连，与全局布线相比，这些内部互连更加快速，布线逻辑也更简单，从而减轻了全局布线的压力与拥挤。采用了大`CLB`后，有
    18%的布线可以直接通过内部互连完成。而对于传统`FPGA`，只有 7%的布线能在`CLB`内完成，而其他的布线都需要通过占用全局布线资源。


    ![](img/Figure-P44_663.jpg)


    图 1-15　`Versal ACAP`的新`CLB`结构


    第二，每个查找表结构`LUT`增加了一个额外的输出，这是一个重要的架构变化，如图 1-16 所示。传统`FPGA`的`LUT`结构曾经只有 4 个输入，当前的大部分`FPGA`已经将其增加为
    6 输入、2 输出，从而可以实现任意的 6 输入逻辑，或者两个 5 输入逻辑。当添加了一个新的输出之后，就可以在一个`LUT`内实现两个独立的 6 输入逻辑功能。这种结构的另外一个好处是允许更多的逻辑功能进行合并，以减少`LUT`的使用量。`FPGA`设计工具会根据两个`LUT`的距离，判断这两个`LUT`里的逻辑能否进行合并。例如，与`UltraScale`架构相比，当两个`LUT`之间的距离小于
    5 个`Slice`网格距离时，`Versal ACAP`架构能多合并 21.5%的逻辑功能，从而减少相应的硬件资源使用。


    ![](img/Figure-P45_684.jpg)


    图 1-16　`Versal ACAP`的新`LUT`结构


    作为代价，在`UltraScale`架构中的宽函数功能被移走。因此如果需要实现例如 32 选 1 的选择器时，可能就会将逻辑扩展到多个逻辑片，而这将对时序造成负面影响，并且需要额外的硬件资源支持。


    第三，每个逻辑片的进位链逻辑结构进行了彻底修改。在这其中，一直是现代`FPGA`标配的加法器进位链被完全移除，取而代之的是使用`LUT`中新增加的“进位输入”信号和查找表逻辑完成加法和进位传输。


    第四，引入了名为“`Imux`寄存器”的新结构。这种结构与英特尔`Stratix10`和`Agilex`系列`FPGA`中的`HyperFlex`架构有着异曲同工之妙，它们的主要目的都是用于在关键路径中引入额外的寄存器和流水线层级，从而实现流水线重定时（Retiming），加速时序收敛的过程。关于英特尔`HyperFlex`架构的细节介绍，将会在
    1.5 节给出。值得注意的是，与`HyperFlex`架构相比，赛灵思的`Imux`结构有着它的不同之处。例如，这些`Imux`寄存器包含了复位、初始化、时钟使能等常见的寄存器功能，而不是`HyperFlex`里采用的锁存器（Latch）结构。此外，`Imux`只存在于`CLB`之前，且并没有在全部的布线资源上都设置寄存器，因此引入的额外延时会更小。但在深度流水线设计中，这种结构的绝对性能应该不如`HyperFlex`。


    ### 1.4.4 第四代 SSI 技术：3D FPGA 的进一步优化


    `ACAP`采用了赛灵思的第四代硅片堆叠技术`SSI`。`SSI`的技术细节和主要优缺点在前文已经详细介绍过。针对`SSI`技术延时较高的主要缺点，`ACAP`在架构层面进行了大量优化。例如，在`Versal`架构中，采用了更多的硅片间的互联通道（`SLL
    Channel`）。同时，这些互联通道的传输延时也得到了进一步优化，相比传统连线的延时下降了 30%。


    ### 1.4.5 片上网络：高带宽数据传输的全新利器


    在诸如`DDR`存储器、高速网络、`PCIe`等高速接口与应用中，通常有着很高的带宽要求。为了应对这个问题，一方面需要采用高位宽的总线，另一方面需要高速时钟。因此，传统的`FPGA`设计方法都是通过对总线进行深度流水线来实现高带宽和高吞吐量。但是，对于一个大型设计而言，这种方法会很快造成`FPGA`片上布线资源的拥挤，继而导致时序收敛困难和性能下降。这就需要寻找有效的方法，同时解决高速数据传输和低拥堵布线两个问题。


    `ACAP`带来的答案就是片上网络`NoC`技术，它的结构示意图如图 1-17 所示。在传统的`FPGA`布线资源之外，`ACAP`引入了固化的`NoC`网络，将需要进行高速数据传输的内容转化成基于数据包的形式，通过片上网络的交换机逻辑实现数据交换。这种方法最大的优点是，在系统层面将数据传输与数据计算进行了分离，从而在保证带宽的基础上，缓解了系统的布局布线压力。例如，数据计算可以在`AI
    Engine`或片上其他部分实现，而不需紧靠`DDR`控制器等高速接口。同时，与网络应用类似，这种片上网络也能对各类的传输进行服务质量控制（`QoS`）。


    ![](img/Figure-P47_711.jpg)


    图 1-17　`ACAP`采用的片上网络`NoC`结构示意图


    不过，在`FPGA`上采用片上网络的主要问题是引入了额外的传输延时，这对于需要固定延时或者低延时的应用可能会有影响。此外，片上网络的位宽是固定的，无法对应用进行优化，这也有可能对不同应用的系统性能造成负面影响。


    ## 1.5 灵活与敏捷共存——英特尔 Agilex FPGA


    伴随着英特尔 10nm 工艺的逐渐成熟，基于 10nm 工艺的`FPGA`也终于揭开了它神秘的面纱。2019 年 4 月，曾经代号为`Falcon Mesa`的英特尔最新一代
    10nm `FPGA`正式亮相，并命名为“`Agilex`”。


    `Agilex`是`Agile`（敏捷）和`Flexible`（灵活）的结合，而这两个特点正是现代`FPGA`技术最为核心的两大要点。具体来说，“灵活性”就是指可编程性，它基于`FPGA`的核心技术——可编程逻辑阵列，可以灵活地针对不同应用场景进行编程，并改变`FPGA`的逻辑结构和功能。“敏捷性”指的是异构，它既可以是不同逻辑单元之间的异构，也可以是不同工艺的异构，或者两者兼而有之。前文曾提到，不同类型的`IP`所对应的成熟工艺与迭代时间都不尽相同，只有采用异构的模式，才能充分发挥不同`IP`和不同工艺节点的优势，取长补短，在性能和成本上取得良好的平衡。正因如此，异构`FPGA`也是未来`FPGA`架构发展和研究的主要方向。


    在这个大背景下，`Agilex FPGA`应运而生。它既包含了传统`FPGA`灵活的可编程性，又结合了现代`FPGA`基于异构架构的敏捷性，因此能够同时适用于众多应用领域，并针对不同的应用场景进行配置和快速迭代。


    与进化多年的`Stratix`、`Arria`、`Cyclone`、`Max`等`FPGA`产品系列相比，`Agilex`是原`FPGA`巨头`Altera`在
    2015 年底被英特尔收购，并成为其可编程方案事业部（`PSG`）后正式推出的一个全新的`FPGA`系列。正因如此，`Agilex`无疑被英特尔寄予了更多的期待。在这些期待背后，离不开来自英特尔的核心技术的加持。而这也将是区分`Agilex`与它的前代产品，以及其他竞争产品的最主要的优势。


    ### 1.5.1 英特尔 10nm 工艺能否后发制人


    英特尔在半导体领域称雄几十年，靠的就是两个独门绝技：第一是众所周知的`x86`架构，第二则是曾经遥遥领先竞争对手的半导体制造工艺。这也促成了英特尔著名的“`Tick-Tock`”战略，即架构和工艺的更新逐年交错进行，同时还能保持处理器性能的稳步增长。


