- raw: '20世纪80年代，从样例中学习的一大主流是符号主义学习，其代表包括决策树和基于逻辑的学习。典型的决策树学习以信息论为基础，以信息熵的最小化为目标，直接模拟了人类对概念进行判定的树形流程。而基于逻辑的学习，其著名代表是归纳逻辑程序设计，可以看作机器学习与逻辑程序设计的交叉。这两种方法各有特点，决策树简单易用，直至今天仍然是机器学习常用技术之一。基于逻辑的学习具有很强的知识表达能力，可以较容易地表达出复杂数据关系。在20世纪90年代中期之前，“从样例中学习”的另一主流技术是基于神经网络的连接主义学习。连接主义学习在20世纪50年代取得了很大发展，但因为早期人工智能的研究者对符号表示特别偏爱，而且连接主义自身也遇到了很大的障碍，当时的神经网络只能处理线性问题，甚至都处理不了“异或”这种简单问题。直到J.J.Hopfield利用神经网络求解“流动推销员问题”这个著名的NP难题取得重大进展，才使连接主义重新受到人们的关注。1986年，D.E.Rumelhart等人发明了著名的BP算法，产生了深远的影响，使连接主义的发展突飞猛进。而且BP算法一直是应用最为广泛的机器学习算法之一。


    20世纪90年代中期，“统计学习”闪亮登场并迅速占领“从样例中学习”的主流舞台，其代表性技术是支持向量机。其实这方面的研究早在20世纪60—70年代就已经开始，统计学习理论在那时就已经打下了基础，但直至20世纪90年代才成为机器学习的主流技术。一方面是因为有效的支持向量机算法在20世纪90年代初才被提出，并且其优越的性能在20世纪90年代中期文本分类的应用中才得以显现；另一方面，正是在连接主义学习技术的局限性凸显之后，人们才把目光转向以统计学习理论为直接支撑的统计学习技术。在支持向量机被普遍接受后，该技巧被人们利用到机器学习的每个角落，该方法也成为机器学习的基本内容之一。


    21世纪初期，随着社会进入大数据时代，数据量和计算设备的发展使连接主义技术焕发出新的生机，掀起了以“深度学习”为名的热潮。所谓的深度学习，狭义地说就是很多层神经网络。在涉及语音、图像等复杂对象的应用中，深度学习技术具有优越的性能。虽然深度学习模型复杂度高，参数较多，但如果下功夫“调参”，把参数调节好，其性能往往较好。因此，深度学习虽然缺乏严格的理论基础，但是显著降低了机器学习应用者的门槛，为机器学习走向工程实践带来诸多便利。


    机器学习是现阶段实现人工智能应用的主要手段和方法，在人工智能体系中处于基础与核心的地位，它被广泛地应用于计算机视觉、语音识别、自然语言处理、数据挖掘等领域（图1-6）。


    ![](Images/figure_0018_0006.jpg)


    图1-6　机器学习任务的一般流程


    机器学习策略可以广泛地分为无监督学习和监督学习。无监督学习的重点是发现数据集中变量之间的潜在结构或关系，而监督学习通常涉及将观察结果分类为1个或多个类别或结果。监督学习需要一个具有预测变量和标记结果的数据集。特征选择对于预测建模至关重要，而机器学习对它特别有用。


    例如，在医学上，当观察结果通常有“病例”或“对照”等标签时，就可以进行预测建模，并且这些观察结果与相关特征如年龄、性别或临床变量配对。假设考虑一个医生希望预测某患者是否会在入院后30天内再次入院。对于这个困难的问题，机器学习技术已被证明可以改进传统的统计方法。我们假设的临床医生拥有一个大但“混乱”的电子健康记录数据集。通常，电子病历包括一些变量，如病历号、药物处方、检测指标、影像学数据等。利用人口统计学、实验室值和生命体征，各种不同的算法在临床显著程度上优于逻辑回归。


    事实上，人们很难决定在预测模型中应该包含哪些变量。当自变量大于观测变量时，拟合逻辑回归模型在代数上是困难的。人们通常使用单变量方差筛选或正向逐步回归等技术。不幸的是，这些方法导致的模型不倾向于在其他数据集中进行验证，并且不适用于患者使用。


    对于机器学习，变量之间经常存在复杂的相互作用。这种交互作用的数量和质量很难用传统的方法来描述。通过机器学习，我们可以捕获和使用这些复杂的关系。由无监督学习设计的特征也经常被纳入监督学习模型中，在比较机器学习特征选择的方法中证明了机器学习特征选择的实用性。


    缺乏可解释性可能是大多数机器学习算法的主要缺点，包括人工神经网络。换句话说，不可能准确地理解一个网络是如何近似于一个特定的函数。这种“暗箱”行为的一个直接结果是，不可能预测输入的微小变化将如何影响网络的预测能力。作为人工神经网络输入的图片，一些难以查觉的微小差别，可能会导致网络性能的急剧下降。相反，对同一张图片进行重大修改，使人眼无法再识别它们，并没有改变人工神经网络对图像进行分类的方式。在实践中，当使用人工神经网络代替线性模型时，预测性能的提高应平衡可解释性的损失。


    在药物发现项目中使用的大多数学习任务和技术可分为七大类：监督学习、无监督学习、半监督学习、主动学习、强化学习、迁移学习和多任务学习。每一类都有自己的特征性的优点和局限性。


    （1）监督学习。


    监督学习是指在存在标记的样本数据中进行模型训练的过程，是机器学习中应用最为成熟的学习方法。其中数据存在标记的主要功能是提供误差的精确度量，也就是当数据输入到模型中得到模型预测值，能够与真实值进行比较得到误差的精确度量。在监督学习的过程（即建立预测模型的过程）中，可以根据误差的精确度量对预测模型进行不断调整，直到预测模型的结果达到一个预期的准确率，这样模型的准确性可以得到一定的保证。监督学习常见的应用场景有分类问题和回归问题。两者的区别主要在于对待预测的结果是否为离散值，若待预测的数据是离散的，此类学习任务称为分类；若待预测的数据为连续的，则此类任务称为“回归”。在分类问题中只涉及两个类别的分类问题，人们一般称其中一个为正类（positive
    class），一个为反类（negative class）。当涉及多个类别时，则称为多分类任务。常见的监督学习应用包括基于回归或分类的预测性分析、垃圾邮件检测、模式检测、自然语言处理、情感分析、自动图像分类等。


    监督学习用于描述预测任务，因为其目标是预测或分类感兴趣的特定结果。监督学习已被应用于包括人口统计学、临床和社会预测因素在内的大型数据结构。


    （2）无监督学习。


    与监督学习相对应，在不存在标记的样本数据中建立机器学习模型的过程称为无监督学习。由于不存在标记数据，所以有绝对误差的衡量。无监督学习中得到的模型大多是为了推断此数据的内在结构，其中应用最广、研究最多的就是“聚类”，其可以根据训练数据中数据之间的相似度，对数据进行聚类（分组）。经过聚类得到的簇也就是形成的分组可能对应一些潜在的概念划分，进而厘清数据的内在结构。如一批图形数据通过聚类算法可以将三角图形确定一个集合，圆点图形确定一个集合。经过这样的过程可以为下一步具体的数据分析建立基础，但需要注意，聚类过程仅能自动形成簇结构，但是簇对应的具体语义要使用者来进行命名和把握。其实从过程也可以看出无监督学习方法在于寻找数据集的规律性，这种规律性不一定要达到划分数据集的目的，也就是说不一定要对数据进行“分类”，而且无监督学习方法所需训练数据是不存在标记的数据集，这就使无监督学习比监督学习用途更广，如分析一堆数据的主分量或者分析数据集有什么特点都可以归为无监督学习。常见的无监督应用包括对象分割、相似性检测、自动标记、推荐引擎等。


    无监督机器学习方法在描述任务中特别有用，可在没有测量结果的情况下找到数据结构中的关系。无监督学习的目标是识别数据结构中的潜在维度、组件、集群或轨迹。心理健康分类和心理测量研究中常用的几种方法都属于无监督学习的范畴，包括主成分分析、因子分析和混合建模。


    无监督学习可用于识别潜在或未观察到的维度和轨迹，并确定如何最好地将维度分类为亚型。识别数据驱动的维度和亚组可能会导致围绕新症状、表型或诊断提出新的假设。当前瞻性数据可用时，无监督学习方法也可以用于识别症状或表型随时间发展的异质性。


    （3）半监督学习。


    标记样本的数量占所有样本的数量比例较小，直接监督学习方法不可行，用于训练模型的数据不能代表整体分布，如果直接采用无监督学习则造成有标记数据的浪费。而半监督学习处于监督学习和无监督学习的折中位置。


    半监督学习的目标，是利用大量未标记的数据来提高监督学习在小数据集上的性能。通常，半监督学习算法使用未标记的数据来学习有关输入分布的附加结构。例如，输入分布中聚类结构的存在可能暗示样本被分离成不同的标签，这通常被称为聚类假设。如果两个样本在输入分布中属于同一个聚类，那么它们很可能属于同一类。聚类假设等效于低密度分离假设，决策边界应该位于低密度区域。等价性很容易推断，位于高密度区域的决策边界将一个聚类划分为两个不同的类，要求来自不同类的样本位于同一聚类中。


    （4）主动学习。


    主动学习是从稀疏标记的数据中获取知识的最常见方法之一。它旨在通过搜索最相关的示例来减少注释数据所需的时间。大数据样本量巨大，但标注成本太高，赋予标签需要大量的工作，因此，训练一个具有少量标记的准确预测模型，能大大减少成本提高效率。主动学习方法在许多领域取得了成功，得到了快速和持续的改进，正逐渐成为医药研究的新工具。


    （5）强化学习。


    强化学习是指一类旨在训练计算主体与环境成功交互的技术，通常是为了实现特定目标。这种学习可以通过试错、演示或混合方法进行。当代理在其环境中采取行动时，奖励和结果的迭代反馈循环会训练代理更好地完成手头的目标。通过监督学习（即模仿学习）直接学习预测专家的行为，或者通过推断专家的目标（即反向强化学习），可以实现从专家演示中学习。为了成功地训练一个智能体，关键是要有一个模型函数，它可以将来自环境的感觉信号作为输入，并输出智能体要采取的下一步行动。以深度学习模型作为模型函数的深度强化学习显示出了良好的应用前景。


    一个可以从深度强化学习中受益的医疗保健领域是机器人辅助手术。目前，机器人辅助手术在很大程度上依赖于外科医生以远程操作的方式引导机器人的器械。深度学习可以通过使用计算机视觉模型来感知手术环境，并使用强化学习的方法来从外科医生的身体运动中学习，从而增强机器人辅助手术的稳健性和适应性。这些技术支持高度重复和时间紧迫的外科手术任务的自动化，如缝合和打结。例如，计算机视觉技术可以根据图像数据重建开放性伤口的景观，并且可以通过解决路径优化问题来生成缝合或打结轨迹，该路径优化问题在考虑外部约束（如关节限制和障碍）的情况下找到最佳轨迹。与此类似，经过图像训练的递归神经网络可以通过学习事件序列来自主打结，这种情况以前需要外科医生的物理动作。


    ## 1.3　经典机器学习方法


    药学相关研究可选择多种机器学习算法，下面介绍一些最经典的方法。


    （1）线性回归。


    线性回归可以说是最简单的机器学习算法。回归分析背后的主要思想是指定一个或多个数字特征与单个数字目标之间的关系。线性回归是一种用直线来描述数据集，以解决回归问题的分析技术。


    单变量线性回归是一个只将单一特征用于预测目标值的回归问题，可以用斜线截距形式表示。


    ![](Images/figure_0021_0007.jpg)


    式中，a是一个描述斜率的权重，它描述了x增加时直线在y轴上增加了多少。截距b描述了直线截距y轴的点。线性回归使用这种斜率-截距形式建模一个数据集，其中机器的任务是识别a和b的值，这样确定的线能够最好地将x值与y值联系起来。多元线性回归与此类似。但在算法中有多个权重，每个权重都描述了每个特征对目标的影响程度。


    在实践中，很少有一个函数能够完美地适合数据集。为了测量与拟合相关的误差，需要测量残差。从概念上讲，残差是预测值y＾和实际值y之间的垂直距离。在机器学习中，代价函数是一个微积分推导出的术语，旨在最小化与模型相关的误差。最小化代价函数的过程涉及一个被称为梯度下降的迭代优化算法，其中所涉及的数学计算超出了本文的范围。在线性回归中，代价函数是前面描述的MSE。最小化这个函数通常可以得到最佳建模数据集的a和b的估计值。所有基于模型的学习算法都有一个代价函数，其目标是将该函数最小化，以找到最佳拟合的模型。


    （2）逻辑回归。


    逻辑回归是一种分类算法，其目标是找到特征和特定结果的概率之间的关系。逻辑回归不是使用线性回归产生的直线来估计类概率，而是使用s型曲线来估计类概率。这条曲线由s型函数决定，它产生一个s形曲线，将离散或连续的数值特征（x）转换为一个介于0到1之间的单个数值（y）。


    ![](Images/figure_0022_0008.jpg)


    这种方法的主要优点是概率被限制在0和1之间（即概率不能为负数或大于1）。它可以是二项式的，即只有两种可能的结果，也可以是多项式的，即可以有3种或更多可能的结果。


    事实上，逻辑回归的一个主要优势是，它在分析二元结果时保留了线性回归的许多特征。在逻辑回归中，表示处于一个二元结果类别相对于另一个二元结果类别的估计概率，而不是表示估计的连续结果。同时，逻辑回归表示自变量的线性回归方程，用量表表示，而不是原始的线性格式。这种尺度转换的原因在于逻辑回归模型的基本参数。具体来说，用概率表示的二元结果必须为0～1。相反，逻辑回归方程中的自变量可能具有任何数量。


    逻辑回归是一种有价值的研究方法，因为它可以广泛应用于不同的研究环境。例如，人们可能希望检查结果与几个自变量（也称为协变量、预测变量和解释变量）之间的关联，或者可能希望确定从一组自变量中预测结果的效果。此外人们可能对控制特定自变量的影响感兴趣，尤其是那些充当混杂因素的因素，它们与结果和另一个自变量的关系掩盖了该自变量与结果之间的关系。后一种应用在不允许随机分配给治疗组的环境中尤其有用，例如观察性研究。通过随机分配，人们通常可以对混杂变量进行充分的控制，因为随机分组往往具有相等或平衡的混杂因素分布。相比之下，观察性研究不涉及任何实验操作，因此如果不加以解释，混淆变量可能会成为一个真正的问题，这就是逻辑回归在这种情况下非常有吸引力的原因。


    在实践中，线性回归很常见，但它不适用于某些类型的医疗结果。对于二元事件，如死亡率，逻辑回归是通常的选择方法。与线性回归类似，逻辑回归可能只包括一个或多个自变量，检查多个变量更具信息性，它揭示了每个变量在调整其他变量后的独特贡献。变量选择过程的一个关键部分是承认和解释潜在混杂因素的作用。


    如前所述，混淆变量是指那些与结果和另一个自变量的关系掩盖了该自变量与结果之间的真实联系的变量。例如，社会经济地位可能会混淆种族和每年急诊就诊之间的关系，因为它与种族（即某些种族群体往往在某些社会经济地位类别中更具代表性）和急诊就诊（即较贫穷的患者可能更频繁地使用急诊进行基本医疗保健）都有关联。然而，这类因果关系可能并不明显，因此应考虑在变量选择过程中对其进行正式评估，以确保对其进行适当的表征并随后进行建模。路径分析图在这方面可能特别有用。


    （3）决策树和随机森林。


    决策树是一种有监督的学习技术，主要用于分类任务，也可以用于回归。决策树以根节点开始，根节点是分割数据集的第一个决策点，它包含一个将数据最好地分割成各自类的单一功能（图1-7）。每个分割都有一条边，它可以连接到包含另一个特征的新决策节点，以进一步将数据分割为同质组，也可以连接到预测该类的终端节点。这种将数据划分为两个二进制分区的过程被称为递归分区。


    ![](Images/figure_0023_0009.jpg)


    图1-7　决策树


    随机森林是决策树的扩展，可称为集成方法，它可以产生多个决策树，不是使用每个特征来创建随机森林中的每个决策树，而是使用特征的子样本来创建每个决策树。然后，一个树预测一个类的结果，树中的大多数票被用作模型的最终类预测（图1-8）。


    ![](Images/figure_0023_0010.jpg)


    图1-8　随机森林


    随机森林是树的预测因子的组合，其中每棵树投票给其首选类别，根据投票最多的类别提供最终的预测。随机森林已经广泛地应用于数据集的快速训练。研究也表明，尽管组合中使用了树，随机森林通常也不会过度拟合。


    集成方法背后的主要原理是，一组弱数值描述符可以聚在一起，形成一个针对数据集的强预测器。随机森林中的每个分类器单独都是一个弱描述符，而所有的分类器合并在一起都是一个强预测器。随机森林从一种被称为决策树的标准机器学习技术开始，在集成术语中，它对应于我们的弱预测器。随机森林运行时相当快，可以处理不平衡和丢失的数据。随机森林的弱点是，当用于回归时，它们不能预测超过训练数据的范围，而且它们可能会过拟合，特别是有噪声的数据集。


    为了实现随机森林，需要设置两个参数：树数和每个分割中的特性数。使用默认参数可以获得令人满意的结果。


    （4）迁移学习。


    迁移学习又称为归纳迁移、领域适配，是机器学习中的一个重要研究课题，目标是将某个领域或任务中学习到的知识或模型应用到不同或者相关的领域和问题中，具体是指利用数据、任务或模型之间的相似性，将在旧领域学习过的模型，应用于新领域的一种学习过程（图1-9）。迁移学习试图实现人通过类比学习的能力。


    ![](Images/figure_0024_0011.jpg)


    图1-9　迁移学习与机器学习区别


    迁移学习的总体思路可以概括为学习算法最大限度地利用有标注领域的知识，来辅助目标领域的知识获取，迁移学习的核心是找到源领域和目标领域的相似性，并加以合理利用。这种相似性非常普遍，例如人的身体构造是相似的，人骑自行车和骑摩托车的方式是相似的。找到这种相似性是迁移学习的核心问题。找到这种相似性之后，下一步的工作就是“如何度量和利用这种相似性”，度量工作的目标有两点：一是很好地度量两个领域的相似性，不仅定性地告诉人们它们是否相似，而且定量地给出相似程度；二是以度量为准则，通过所要采用的学习手段，增大两个领域之间的相似性，从而完成迁移学习。另外需要说明的是，与半监督学习和主动学习等标注性学习不同，迁移学习放宽了训练数据和测试数据服从独立同分布这一假设，使参与学习的领域或任务可以服从不同的边缘概率分布或条件概率分布（图1-10）。


    ![](Images/figure_0025_0012.jpg)


    图1-10　基于参数的迁移学习方法示意图


    ## 1.4　最新机器学习方法


    （1）人工神经网络。


    人工神经网络，就是模仿人体的神经网络创建的一种网络架构。人们对于世界的感知是依靠神经元的相互作用（图1-11）。但人体的每个神经元的刺激程度是不一样的，有的对某些信号表现得很兴奋，而有的对某些信号表现抑制，可以通过这些神经元的反应来看出一个人的情绪状况。在感知器中，通常会引入权重来代表每个感知器对信号的兴奋程度。除了神经元的兴奋度外，每个神经元都有其固定的阈值。


    人工神经网络是一个计算神经网络，它的工作原理是基于“生物神经网络的结构和功能如何相互通信、信息如何从一个神经元传递到另一个神经元，以及它产生结果的机制”。神经网络也遵循相同的过程，它从给定的数据集中获取信息，并考虑其中隐藏的信息，最后通过适应未知情况给出高精度的输出。人工神经网络是功能强大的分类器之一，它也可以有更复杂的功能。'
  fmt: '

    ## 机器学习发展历程

    20世纪80年代，从样例中学习的一大主流是符号主义学习，其代表包括决策树和基于逻辑的学习。典型的决策树学习以信息论为基础，以信息熵的最小化为目标，直接模拟了人类对概念进行判定的树形流程。而基于逻辑的学习，其著名代表是归纳逻辑程序设计，可以看作机器学习与逻辑程序设计的交叉。这两种方法各有特点，决策树简单易用，直至今天仍然是机器学习常用技术之一。基于逻辑的学习具有很强的知识表达能力，可以较容易地表达出复杂数据关系。在20世纪90年代中期之前，“从样例中学习”的另一主流技术是基于神经网络的连接主义学习。连接主义学习在20世纪50年代取得了很大发展，但因为早期人工智能的研究者对符号表示特别偏爱，而且连接主义自身也遇到了很大的障碍，当时的神经网络只能处理线性问题，甚至都处理不了“异或”这种简单问题。直到J.J.Hopfield利用神经网络求解“流动推销员问题”这个著名的NP难题取得重大进展，才使连接主义重新受到人们的关注。1986年，D.E.Rumelhart等人发明了著名的BP算法，产生了深远的影响，使连接主义的发展突飞猛进。而且BP算法一直是应用最为广泛的机器学习算法之一。


    20世纪90年代中期，“统计学习”闪亮登场并迅速占领“从样例中学习”的主流舞台，其代表性技术是支持向量机。其实这方面的研究早在20世纪60—70年代就已经开始，统计学习理论在那时就已经打下了基础，但直至20世纪90年代才成为机器学习的主流技术。一方面是因为有效的支持向量机算法在20世纪90年代初才被提出，并且其优越的性能在20世纪90年代中期文本分类的应用中才得以显现；另一方面，正是在连接主义学习技术的局限性凸显之后，人们才把目光转向以统计学习理论为直接支撑的统计学习技术。在支持向量机被普遍接受后，该技巧被人们利用到机器学习的每个角落，该方法也成为机器学习的基本内容之一。


    21世纪初期，随着社会进入大数据时代，数据量和计算设备的发展使连接主义技术焕发出新的生机，掀起了以“深度学习”为名的热潮。所谓的深度学习，狭义地说就是很多层神经网络。在涉及语音、图像等复杂对象的应用中，深度学习技术具有优越的性能。虽然深度学习模型复杂度高，参数较多，但如果下功夫“调参”，把参数调节好，其性能往往较好。因此，深度学习虽然缺乏严格的理论基础，但是显著降低了机器学习应用者的门槛，为机器学习走向工程实践带来诸多便利。


    ## 机器学习策略与应用

    机器学习是现阶段实现人工智能应用的主要手段和方法，在人工智能体系中处于基础与核心的地位，它被广泛地应用于计算机视觉、语音识别、自然语言处理、数据挖掘等领域（图1-6）。


    ![](Images/figure_0018_0006.jpg)


    图1-6　机器学习任务的一般流程


    机器学习策略可以广泛地分为无监督学习和监督学习。无监督学习的重点是发现数据集中变量之间的潜在结构或关系，而监督学习通常涉及将观察结果分类为1个或多个类别或结果。监督学习需要一个具有预测变量和标记结果的数据集。特征选择对于预测建模至关重要，而机器学习对它特别有用。


    例如，在医学上，当观察结果通常有“病例”或“对照”等标签时，就可以进行预测建模，并且这些观察结果与相关特征如年龄、性别或临床变量配对。假设考虑一个医生希望预测某患者是否会在入院后30天内再次入院。对于这个困难的问题，机器学习技术已被证明可以改进传统的统计方法。我们假设的临床医生拥有一个大但“混乱”的电子健康记录数据集。通常，电子病历包括一些变量，如病历号、药物处方、检测指标、影像学数据等。利用人口统计学、实验室值和生命体征，各种不同的算法在临床显著程度上优于逻辑回归。


    事实上，人们很难决定在预测模型中应该包含哪些变量。当自变量大于观测变量时，拟合逻辑回归模型在代数上是困难的。人们通常使用单变量方差筛选或正向逐步回归等技术。不幸的是，这些方法导致的模型不倾向于在其他数据集中进行验证，并且不适用于患者使用。


    对于机器学习，变量之间经常存在复杂的相互作用。这种交互作用的数量和质量很难用传统的方法来描述。通过机器学习，我们可以捕获和使用这些复杂的关系。由无监督学习设计的特征也经常被纳入监督学习模型中，在比较机器学习特征选择的方法中证明了机器学习特征选择的实用性。


    缺乏可解释性可能是大多数机器学习算法的主要缺点，包括人工神经网络。换句话说，不可能准确地理解一个网络是如何近似于一个特定的函数。这种“暗箱”行为的一个直接结果是，不可能预测输入的微小变化将如何影响网络的预测能力。作为人工神经网络输入的图片，一些难以查觉的微小差别，可能会导致网络性能的急剧下降。相反，对同一张图片进行重大修改，使人眼无法再识别它们，并没有改变人工神经网络对图像进行分类的方式。在实践中，当使用人工神经网络代替线性模型时，预测性能的提高应平衡可解释性的损失。


    在药物发现项目中使用的大多数学习任务和技术可分为七大类：监督学习、无监督学习、半监督学习、主动学习、强化学习、迁移学习和多任务学习。每一类都有自己的特征性的优点和局限性。


    ### (1) 监督学习

    监督学习是指在存在标记的样本数据中进行模型训练的过程，是机器学习中应用最为成熟的学习方法。其中数据存在标记的主要功能是提供误差的精确度量，也就是当数据输入到模型中得到模型预测值，能够与真实值进行比较得到误差的精确度量。在监督学习的过程（即建立预测模型的过程）中，可以根据误差的精确度量对预测模型进行不断调整，直到预测模型的结果达到一个预期的准确率，这样模型的准确性可以得到一定的保证。监督学习常见的应用场景有分类问题和回归问题。两者的区别主要在于对待预测的结果是否为离散值，若待预测的数据是离散的，此类学习任务称为分类；若待预测的数据为连续的，则此类任务称为“回归”。在分类问题中只涉及两个类别的分类问题，人们一般称其中一个为正类（positive
    class），一个为反类（negative class）。当涉及多个类别时，则称为多分类任务。常见的监督学习应用包括基于回归或分类的预测性分析、垃圾邮件检测、模式检测、自然语言处理、情感分析、自动图像分类等。


    监督学习用于描述预测任务，因为其目标是预测或分类感兴趣的特定结果。监督学习已被应用于包括人口统计学、临床和社会预测因素在内的大型数据结构。


    ### (2) 无监督学习

    与监督学习相对应，在不存在标记的样本数据中建立机器学习模型的过程称为无监督学习。由于不存在标记数据，所以有绝对误差的衡量。无监督学习中得到的模型大多是为了推断此数据的内在结构，其中应用最广、研究最多的就是“聚类”，其可以根据训练数据中数据之间的相似度，对数据进行聚类（分组）。经过聚类得到的簇也就是形成的分组可能对应一些潜在的概念划分，进而厘清数据的内在结构。如一批图形数据通过聚类算法可以将三角图形确定一个集合，圆点图形确定一个集合。经过这样的过程可以为下一步具体的数据分析建立基础，但需要注意，聚类过程仅能自动形成簇结构，但是簇对应的具体语义要使用者来进行命名和把握。其实从过程也可以看出无监督学习方法在于寻找数据集的规律性，这种规律性不一定要达到划分数据集的目的，也就是说不一定要对数据进行“分类”，而且无监督学习方法所需训练数据是不存在标记的数据集，这就使无监督学习比监督学习用途更广，如分析一堆数据的主分量或者分析数据集有什么特点都可以归为无监督学习。常见的无监督应用包括对象分割、相似性检测、自动标记、推荐引擎等。


    无监督机器学习方法在描述任务中特别有用，可在没有测量结果的情况下找到数据结构中的关系。无监督学习的目标是识别数据结构中的潜在维度、组件、集群或轨迹。心理健康分类和心理测量研究中常用的几种方法都属于无监督学习的范畴，包括主成分分析、因子分析和混合建模。


    无监督学习可用于识别潜在或未观察到的维度和轨迹，并确定如何最好地将维度分类为亚型。识别数据驱动的维度和亚组可能会导致围绕新症状、表型或诊断提出新的假设。当前瞻性数据可用时，无监督学习方法也可以用于识别症状或表型随时间发展的异质性。


    ### (3) 半监督学习

    标记样本的数量占所有样本的数量比例较小，直接监督学习方法不可行，用于训练模型的数据不能代表整体分布，如果直接采用无监督学习则造成有标记数据的浪费。而半监督学习处于监督学习和无监督学习的折中位置。


    半监督学习的目标，是利用大量未标记的数据来提高监督学习在小数据集上的性能。通常，半监督学习算法使用未标记的数据来学习有关输入分布的附加结构。例如，输入分布中聚类结构的存在可能暗示样本被分离成不同的标签，这通常被称为聚类假设。如果两个样本在输入分布中属于同一个聚类，那么它们很可能属于同一类。聚类假设等效于低密度分离假设，决策边界应该位于低密度区域。等价性很容易推断，位于高密度区域的决策边界将一个聚类划分为两个不同的类，要求来自不同类的样本位于同一聚类中。


    ### (4) 主动学习

    主动学习是从稀疏标记的数据中获取知识的最常见方法之一。它旨在通过搜索最相关的示例来减少注释数据所需的时间。大数据样本量巨大，但标注成本太高，赋予标签需要大量的工作，因此，训练一个具有少量标记的准确预测模型，能大大减少成本提高效率。主动学习方法在许多领域取得了成功，得到了快速和持续的改进，正逐渐成为医药研究的新工具。


    ### (5) 强化学习

    强化学习是指一类旨在训练计算主体与环境成功交互的技术，通常是为了实现特定目标。这种学习可以通过试错、演示或混合方法进行。当代理在其环境中采取行动时，奖励和结果的迭代反馈循环会训练代理更好地完成手头的目标。通过监督学习（即模仿学习）直接学习预测专家的行为，或者通过推断专家的目标（即反向强化学习），可以实现从专家演示中学习。为了成功地训练一个智能体，关键是要有一个模型函数，它可以将来自环境的感觉信号作为输入，并输出智能体要采取的下一步行动。以深度学习模型作为模型函数的深度强化学习显示出了良好的应用前景。


    一个可以从深度强化学习中受益的医疗保健领域是机器人辅助手术。目前，机器人辅助手术在很大程度上依赖于外科医生以远程操作的方式引导机器人的器械。深度学习可以通过使用计算机视觉模型来感知手术环境，并使用强化学习的方法来从外科医生的身体运动中学习，从而增强机器人辅助手术的稳健性和适应性。这些技术支持高度重复和时间紧迫的外科手术任务的自动化，如缝合和打结。例如，计算机视觉技术可以根据图像数据重建开放性伤口的景观，并且可以通过解决路径优化问题来生成缝合或打结轨迹，该路径优化问题在考虑外部约束（如关节限制和障碍）的情况下找到最佳轨迹。与此类似，经过图像训练的递归神经网络可以通过学习事件序列来自主打结，这种情况以前需要外科医生的物理动作。


    ## 1.3 经典机器学习方法

    药学相关研究可选择多种机器学习算法，下面介绍一些最经典的方法。


    ### (1) 线性回归

    线性回归可以说是最简单的机器学习算法。回归分析背后的主要思想是指定一个或多个数字特征与单个数字目标之间的关系。线性回归是一种用直线来描述数据集，以解决回归问题的分析技术。


    单变量线性回归是一个只将单一特征用于预测目标值的回归问题，可以用斜线截距形式表示。


    ![](Images/figure_0021_0007.jpg)


    式中，`a`是一个描述斜率的权重，它描述了`x`增加时直线在`y`轴上增加了多少。截距`b`描述了直线截距`y`轴的点。线性回归使用这种斜率-截距形式建模一个数据集，其中机器的任务是识别`a`和`b`的值，这样确定的线能够最好地将`x`值与`y`值联系起来。多元线性回归与此类似。但在算法中有多个权重，每个权重都描述了每个特征对目标的影响程度。


    在实践中，很少有一个函数能够完美地适合数据集。为了测量与拟合相关的误差，需要测量残差。从概念上讲，残差是预测值`y^`和实际值`y`之间的垂直距离。在机器学习中，代价函数是一个微积分推导出的术语，旨在最小化与模型相关的误差。最小化代价函数的过程涉及一个被称为梯度下降的迭代优化算法，其中所涉及的数学计算超出了本文的范围。在线性回归中，代价函数是前面描述的`MSE`。最小化这个函数通常可以得到最佳建模数据集的`a`和`b`的估计值。所有基于模型的学习算法都有一个代价函数，其目标是将该函数最小化，以找到最佳拟合的模型。


    ### (2) 逻辑回归

    逻辑回归是一种分类算法，其目标是找到特征和特定结果的概率之间的关系。逻辑回归不是使用线性回归产生的直线来估计类概率，而是使用s型曲线来估计类概率。这条曲线由s型函数决定，它产生一个s形曲线，将离散或连续的数值特征（`x`）转换为一个介于0到1之间的单个数值（`y`）。


    ![](Images/figure_0022_0008.jpg)


    这种方法的主要优点是概率被限制在0和1之间（即概率不能为负数或大于1）。它可以是二项式的，即只有两种可能的结果，也可以是多项式的，即可以有3种或更多可能的结果。


    事实上，逻辑回归的一个主要优势是，它在分析二元结果时保留了线性回归的许多特征。在逻辑回归中，表示处于一个二元结果类别相对于另一个二元结果类别的估计概率，而不是表示估计的连续结果。同时，逻辑回归表示自变量的线性回归方程，用量表表示，而不是原始的线性格式。这种尺度转换的原因在于逻辑回归模型的基本参数。具体来说，用概率表示的二元结果必须为0～1。相反，逻辑回归方程中的自变量可能具有任何数量。


    逻辑回归是一种有价值的研究方法，因为它可以广泛应用于不同的研究环境。例如，人们可能希望检查结果与几个自变量（也称为协变量、预测变量和解释变量）之间的关联，或者可能希望确定从一组自变量中预测结果的效果。此外人们可能对控制特定自变量的影响感兴趣，尤其是那些充当混杂因素的因素，它们与结果和另一个自变量的关系掩盖了该自变量与结果之间的关系。后一种应用在不允许随机分配给治疗组的环境中尤其有用，例如观察性研究。通过随机分配，人们通常可以对混杂变量进行充分的控制，因为随机分组往往具有相等或平衡的混杂因素分布。相比之下，观察性研究不涉及任何实验操作，因此如果不加以解释，混淆变量可能会成为一个真正的问题，这就是逻辑回归在这种情况下非常有吸引力的原因。


    在实践中，线性回归很常见，但它不适用于某些类型的医疗结果。对于二元事件，如死亡率，逻辑回归是通常的选择方法。与线性回归类似，逻辑回归可能只包括一个或多个自变量，检查多个变量更具信息性，它揭示了每个变量在调整其他变量后的独特贡献。变量选择过程的一个关键部分是承认和解释潜在混杂因素的作用。


    如前所述，混淆变量是指那些与结果和另一个自变量的关系掩盖了该自变量与结果之间的真实联系的变量。例如，社会经济地位可能会混淆种族和每年急诊就诊之间的关系，因为它与种族（即某些种族群体往往在某些社会经济地位类别中更具代表性）和急诊就诊（即较贫穷的患者可能更频繁地使用急诊进行基本医疗保健）都有关联。然而，这类因果关系可能并不明显，因此应考虑在变量选择过程中对其进行正式评估，以确保对其进行适当的表征并随后进行建模。路径分析图在这方面可能特别有用。


    ### (3) 决策树和随机森林

    决策树是一种有监督的学习技术，主要用于分类任务，也可以用于回归。决策树以根节点开始，根节点是分割数据集的第一个决策点，它包含一个将数据最好地分割成各自类的单一功能（图1-7）。每个分割都有一条边，它可以连接到包含另一个特征的新决策节点，以进一步将数据分割为同质组，也可以连接到预测该类的终端节点。这种将数据划分为两个二进制分区的过程被称为递归分区。


    ![](Images/figure_0023_0009.jpg)


    图1-7　决策树


    随机森林是决策树的扩展，可称为集成方法，它可以产生多个决策树，不是使用每个特征来创建随机森林中的每个决策树，而是使用特征的子样本来创建每个决策树。然后，一个树预测一个类的结果，树中的大多数票被用作模型的最终类预测（图1-8）。


    ![](Images/figure_0023_0010.jpg)


    图1-8　随机森林


    随机森林是树的预测因子的组合，其中每棵树投票给其首选类别，根据投票最多的类别提供最终的预测。随机森林已经广泛地应用于数据集的快速训练。研究也表明，尽管组合中使用了树，随机森林通常也不会过度拟合。


    集成方法背后的主要原理是，一组弱数值描述符可以聚在一起，形成一个针对数据集的强预测器。随机森林中的每个分类器单独都是一个弱描述符，而所有的分类器合并在一起都是一个强预测器。随机森林运行时相当快，可以处理不平衡和丢失的数据。随机森林的弱点是，当用于回归时，它们不能预测超过训练数据的范围，而且它们可能会过拟合，特别是有噪声的数据集。


    为了实现随机森林，需要设置两个参数：树数和每个分割中的特性数。使用默认参数可以获得令人满意的结果。


    ### (4) 迁移学习

    迁移学习又称为归纳迁移、领域适配，是机器学习中的一个重要研究课题，目标是将某个领域或任务中学习到的知识或模型应用到不同或者相关的领域和问题中，具体是指利用数据、任务或模型之间的相似性，将在旧领域学习过的模型，应用于新领域的一种学习过程（图1-9）。迁移学习试图实现人通过类比学习的能力。


    ![](Images/figure_0024_0011.jpg)


    图1-9　迁移学习与机器学习区别


    迁移学习的总体思路可以概括为学习算法最大限度地利用有标注领域的知识，来辅助目标领域的知识获取，迁移学习的核心是找到源领域和目标领域的相似性，并加以合理利用。这种相似性非常普遍，例如人的身体构造是相似的，人骑自行车和骑摩托车的方式是相似的。找到这种相似性是迁移学习的核心问题。找到这种相似性之后，下一步的工作就是“如何度量和利用这种相似性”，度量工作的目标有两点：一是很好地度量两个领域的相似性，不仅定性地告诉人们它们是否相似，而且定量地给出相似程度；二是以度量为准则，通过所要采用的学习手段，增大两个领域之间的相似性，从而完成迁移学习。另外需要说明的是，与半监督学习和主动学习等标注性学习不同，迁移学习放宽了训练数据和测试数据服从独立同分布这一假设，使参与学习的领域或任务可以服从不同的边缘概率分布或条件概率分布（图1-10）。


    ![](Images/figure_0025_0012.jpg)


    图1-10　基于参数的迁移学习方法示意图


    ## 1.4 最新机器学习方法

    ### (1) 人工神经网络

    人工神经网络，就是模仿人体的神经网络创建的一种网络架构。人们对于世界的感知是依靠神经元的相互作用（图1-11）。但人体的每个神经元的刺激程度是不一样的，有的对某些信号表现得很兴奋，而有的对某些信号表现抑制，可以通过这些神经元的反应来看出一个人的情绪状况。在感知器中，通常会引入权重来代表每个感知器对信号的兴奋程度。除了神经元的兴奋度外，每个神经元都有其固定的阈值。


    ![](Images/figure_0011.jpg)


    人工神经网络是一个计算神经网络，它的工作原理是基于“生物神经网络的结构和功能如何相互通信、信息如何从一个神经元传递到另一个神经元，以及它产生结果的机制”。神经网络也遵循相同的过程，它从给定的数据集中获取信息，并考虑其中隐藏的信息，最后通过适应未知情况给出高精度的输出。人工神经网络是功能强大的分类器之一，它也可以有更复杂的功能。

