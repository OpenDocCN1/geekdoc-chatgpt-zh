    ### 3）利福平相关`miRNA`和负调控基因分析。


    为了揭示利福平相关的`miRNA`和基因，我们构建了`miRNA`-负相关表达基因网络（图 6-11）。


    ![](img/figure_0159_0062.jpg)


    图 6-11　关键`miRNA`-基因负相关表达网络


    **注**　黄色和灰色矩形分别代表下调和上调的`miRNA`。圆圈表示`miRNA`调控的基因，用颜色表示调控关系，红色表示上调基因，绿色表示下调基因。颜色的深度表示折叠变化的大小。


    其中有 10 个`miRNA`负调控 33 个基因，网络中有 62 对`miRNA`-基因。为了关注利福平相关的`miRNA`, `miR-576-30`被指定为该网络中最重要的
    11 个基因之一，并被建议参与创伤反应、伤口愈合、药物反应、防御反应和炎症反应。`miR-186`负调控包括`CYP3A5`在内的 7 个基因，提示`miR-186`与药物代谢过程相关。虽然`miR-335`对`CYP3A5`没有负向调控，但对`ADH1B`有负向调控，与药物代谢相关。


    这 33 个基因通过蛋白质直接或间接地发挥作用。`ADH1B`、`IGF1`、`CAV1`和`SGMS1`的数量变化显著，且受多个`miRNA`调控，`CYP3A5`是参与药物代谢并差异表达的重要基因。这些结果表明，这
    5 个基因在利福平诱导的生物过程中具有重要的功能。


    在本节中，我们提取显著差异表达的`miRNA`，预测`miRNA`调控的负相关表达靶基因（`MCeTG`），通过扩展蛋白相互作用网络，构建了一个`miRNA`调控的负相关表达蛋白相互作用网络（`MNePIN`）。通过`GO`分析和`KEGG`通路富集分析挖掘`miRNA`功能，我们共鉴定出
    20 个差异显著`miRNA`，预测出 632 个`miRNA`调控基因。最后识别的 10 个`miRNA`及 33 个基因证实其与损伤反应、伤口愈合、药物反应、防御反应、炎症反应、肝脏发育和药物代谢
    7 种功能相关。本研究为利福平对`miRNA`、基因和蛋白质水平的影响提供了有价值的见解。


    另一角度，为了解利福平诱导的差异表达`miRNA`及其功能，整合`miRNA`和基因谱，识别显著差异表达`miRNA`和`miRNA`负调控基因，我们利用蛋白质网络进一步构建`miRNA`调控的负相关表达蛋白相互作用网络，并通过`GO`分析和`KEGG`通路富集，提取了
    7 个功能。总的来说，结果表明利福平有助于改变多个`miRNA`的表达，这为`miRNA`在利福平诱导的人肝细胞生物学过程中发挥重要调控作用提供了证据。


    # 第 7 章


    人工智能助力药物生产


    参与人工智能制药领域的主要有人工智能制药初创公司、互联网头部公司以及大型制药企业。人工智能制药初创公司具有自研新药管线或者药物发现平台，由于自研管线后期的临床试验成本较高，风险较大，更多的人工智能制药初创公司选择利用自身技术优势提供
    CRO 服务。互联网巨头利用其在人工智能领域的优势，也在加速布局人工智能制药产业，目前国内互联网头部企业华为、百度、腾讯等都在积极布局人工智能制药赛道，并建立了各自的药物研发平台。传统的大型制药企业则是通过自建团队或者寻求与人工智能制药企业或互联网公司的合作进行人工智能药物研发。根据
    Deep Pharma Intelligence 的统计数据，在 44 家世界头部传统药企中，已有 93%的药企完成与人工智能制药企业的合作布局。近年来人工智能制药领域日益受到资本市场青睐，根据
    Research And Markets 的数据，2022 年全球人工智能制药市场规模为 10.4 亿美元，预计到 2026 年市场规模将达到 29.94
    亿美元。目前从人工智能制药市场规模来看，美国具有绝对的领先优势，近年来国内人工智能制药也实现了快速增长，英矽智能、晶泰科技等公司均获得了大额融资与合作资本加持，目前有多个人工智能新药管线已经进入临床试验阶段（表
    7-1）。


