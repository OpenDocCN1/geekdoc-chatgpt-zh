- raw: "人工智能技术已被广泛用于将化学品的ADMET特性与分子描述符（或特征）直接关联，并从可用数据集构建预测模型。随着对分子结构与物理化学性质之间关系的理解日益加深，包括脂水分配系数（log\
    \ P）、水溶解度（log S）、透膜性以及化合物的生物学行为，特别是其药代动力学特性，人们已经开发了用于快速预测ADMET特性的间接方法。这些方法旨在将药物发现工作引导到可能更具生产力的化学领域，而不在现阶段对特定的化学基团施加苛刻的限制。\n\
    \n小分子候选药物的简单物理化学性质通过影响ADMET性质、药效和药物化合物的选择性，对其最终进入市场的成功具有众所周知的影响。例如，化合物熟悉的物理化学性质已被用于对其可能的目标家族进行分类。\n\
    \n这种方法可能在某种程度上被小分子和me-too方法的发展所迷惑，但它仍然是一种启发性的见解。小分子候选药物必须表现出足够的溶解度和渗透性，以达到其作用部位并参与其靶点。因此，更好地理解和准确预测其理化性质将有助于设计具有所需药代动力学和药效学特征的化合物。\n\
    \n早期的ADMET预测，可以帮助研究人员选择良好的候选药物，并在整个开发过程中促进药物的成药性。近年来，人工智能辅助ADMET预测领域取得了许多进步，基于深度学习和大数据的新一代预测因子，将促进从实验室到临床的药物发现和开发过程。\n\
    \n（1）药物吸收度预测。\n\n药物吸收是药物分子通过一个或多个生物膜屏障，从吸收部位被吸收到血液中的关键第一步。这是一个复杂的过程，在很大程度上受到药物的物理化学性质、给药途径、所选择的配方和生理因素的影响。药物吸收的预测模型分为物理化学和生理两个主要领域。\n\
    \n目前，已经提出了几种基于评估吸收过程中涉及的物理化学性质的简单过滤方法，包括但不限于log P、log S和内在渗透率，以快速预测小分子的生物利用度。这些方法，有助于药物化学家在先导物的优化过程中，做出初步和快速的判断，例如，如果候选药物分子的内在水溶性较低，预计其吸收能力较差。\n\
    \n然而，由于生物膜具有多种药物吸收机制，仅基于物理化学特征的药物吸收预测难以实现合理的准确性，而且每一个缺失的分子都是潜在的药效团。因此，一个生理模型有助于开发一种可靠的、高通量的方法。人肠道吸收是ADMET最具影响力的特性之一，直接影响口服生物利用度。基于体内和体外实验分析的数据，已经引入了许多计算分类和回归模型来预测人肠道吸收。\n\
    \n机器学习方法在这方面也有广泛的应用。一般来说，在绝大多数已发表的研究中，人肠道吸收的预测精度在一个可接受的范围内，最大最突出的问题是有限的数据容易导致过拟合。几种技术已被应用来缓解小样本量问题，并实现更可靠的性能。例如，最近报道的集成学习技术，可以获得一个可靠的模型来预测不同化学物质的人肠道吸收。\n\
    \n基于集成学习的预测模型，在几种严格的外部验证条件下进行了评估，并显示出良好的人肠道吸收模型的预测能力。最近提出了一个基于卷积神经网络的计算模型，该模型从分子描述符中预测化合物的吸收潜力，而不需要明确的特征要求。\n\
    \n解决过拟合问题，另一种方法是使用一个大的、多样化的初始数据集。初始数据集作为在实际应用中预测候选药物人肠道吸收的一个起点，可以建立稳健和可靠的预测模型，输出并预测候选药物的吸收度。\n\
    \n（2）药物分布预测。\n\n药物分布是指药物分子从血流扩散或主动运输至身体组织，尤其是预期发生作用的组织的过程。\n\n影响药物吸收的相同特征，如亲脂性、分子大小、pH值、电离度等，也会影响药物分布到各种组织的速率和程度。其他因素也发挥作用，特别是非特异性和可逆蛋白与血浆蛋白的结合，包括人血清白蛋白、脂蛋白、α-酸糖蛋白等。与血浆蛋白结合，会影响药物的分布量、药理学和药代动力学，因为只有未结合的药物分子才能达到其生物靶点，并发挥预期的治疗作用。因此，与血浆蛋白不结合的化学部分是分布建模的关键参数。机器学习方法常被用来预测人类血浆蛋白结合的模型，如人工神经网络、随机森林和支持向量机等。\n\
    \n尽管已有大量工作来研究血浆蛋白结合的实验数据，但由于产生相关数据源的研究目的不一，要覆盖完整、一致的药物空间，难度非常大。只有广泛管理数据集，构建回归模型，才能有效预测药物血浆蛋白结合能力。在决定药物分布的各种因素中，生理屏障经常被提及，如血脑屏障和胎盘屏障。血脑屏障在保护大脑免受血液成分变化（如激素、神经递质和其他异种生物）和大脑稳态的变化中起着关键作用。不过，它也为治疗中枢神经系统疾病的药物开发工作制造了一个主要障碍。\n\
    \n药物分子从血液转移到大脑的速率，主要取决于其膜的通透性。近年来，利用机器学习方法预测血脑屏障渗透性，大大减少了高成本、高耗时的实验室工作。大量的体内和体外参数，可用于测量血脑屏障渗透，但最受欢迎和公认的参数仍然是药物在血液中的深度，高比例的血药浓度对应大脑更高的相对浓度。\n\
    \n与血脑的屏障渗透相关的一些描述符，被广泛用于构建预测模型，包括物理化学性质，如亲脂性、电离状态、电荷描述符、氢键供体和受体的数量、极性表面积等。因为缺少公开数据集，建立分子描述符之间的可靠关系，测量血脑屏障渗透仍然具有挑战性。此外，相对于对肠道通透性的了解，对限制血脑屏障渗透的复杂机制的理解仍然相对有限。\n\
    \n真核生物系统的渗透机制主要包括被动扩散、被动运输和主动转运。被动扩散被认为是药物通过血脑屏障最常见的机制，因此，迄今为止建立的大多数渗透预测模型都集中在这一机制上，而排除了其他机制。考虑到药物是通过多种途径透过血脑屏障的，难以从分子的物理化学特征来预测，最近引入了一种通过药物临床表型预测药物血脑屏障渗透的新方法。药物的中枢神经系统副作用与血脑屏障的渗透密切相关。基于文献中药物预警中可用的副作用数据的相对丰度，使用异构数据构建预测模型可能有助于提高预测成功率。\n\
    \n（3）药物代谢预测。\n\n异种生物在肝脏或其他组织和器官中的化学转化，即代谢，通常是一个酶介导的过程，考虑到代谢酶的多功能性、底物和抑制剂的多样性，以及代谢过程的复杂性，代谢预测被认为最具挑战性。代谢决定了一种药物在体内的命运，从而影响其安全性和治疗效果。它在许多过程中起着关键作用，如许多药物疗效的丧失、特殊的药物不良相互作用、肝毒性和药物-药物相互作用等。\n\
    \n大部分药物分子主要经由细胞色素P450亚型（CYP450s）和葡萄糖醛酸基转移酶（UGT）参与的Ⅰ期和Ⅱ期代谢。约58%的药物经由CYP450代谢。因此，CYP450抑制试验，通常用于检测那些在药物发现的早期阶段可能具有不期望的药代动力学特性的分子。\n\
    \n近年来，有越来越多的研究主要筛选非CYP450Ⅰ期代谢酶介导的代谢过程。蛋白质-配体对接、分子动力学、分子力学-广义玻恩表面积连续溶剂化、量子力学等多种计算方法，针对CYP450s和UGTs等靶标进行研究，研究代谢的位点、产物和代谢酶的抑制或诱导。\n\
    \n应用人工智能方法，研究人员通过明确描述参与破坏和形成分子键的电子，研究特定系统、代谢机制的细节，根据大量分子通过特定酶面板代谢的可能性进行预测。一般情况下，人工智能在代谢预测领域的应用主要包括预测代谢位点的位置，预测负责代谢的特定亚型，预测代谢药代动力学。代谢位点的预测对于药物研究至关重要，因为它为可能的代谢物的衍生提供了关键信息，为开发更安全、更有效的药物提供了指导。\n\
    \n当前，已经开发了一些基于人工智能的预测代谢部位的模型，并显示出令人满意的准确性。例如，随机森林预测器使用层次描述符的组合，识别CYP450介导的类药物分子代谢的潜在位点，其形式类似于支持向量机，在训练期间具有量身定制的实例错误值。Xe⁃noSite，是一种基于神经网络预测CYP450介导的Ⅰ期代谢位点的工具。FAME，另一种快速、有效的基于人工智能的预测工具。在FAME预测器基础上，最近又提出了一种修正的预测代谢部位的方法，集成为一个新开发的软件包——FAME2，现在可以在线免费获得。\n\
    \n人工智能方法已被应用于相关分子对代谢酶的抑制谱的分类。除了预测代谢位点外，推断阶段Ⅰ或Ⅱ酶的特定异构体可能负责特定化合物的代谢。同时，研究人员对预测由非CYP450酶介导的代谢表现出越来越大的兴趣，尽管到目前为止，只有相对较少的文献报道了基于人工智能的代谢位点、亚型特异性和这些酶的动力学参数预测模型。目前大多数可用的模型仅对提供的初始分子进行代谢预测。\n\
    \n实际上，许多初级代谢物，要经历另一轮Ⅰ期或Ⅱ期代谢，形成次生有毒代谢物，例如，第一阶段聚芳烃氧化形成的环氧化物。因此，量子和分子力学的方法可以模拟这些反应的热力学和动力学，以及涉及代谢生物转化的详细机制。量子化学已经证明了它在生成信息性分子表征方面的效用，实现了对药物优化运动的回顾性预测的持续准确性。为了更现实地预测代谢物，并在药物开发的早期阶段识别有问题的化合物，有必要将当前的代谢组学和毒性信息与化学和酶反应机制的分子知识相结合，提供一个兼容性的代谢预测平台。\n\
    \n（4）药物排泄预测。\n\n药物排泄，是从体内清除药物分子的过程，直接影响药物及其代谢物的血浆浓度，在药物设计中起着重要作用。排泄是一个复杂的过程，涉及多种消除途径，如胆道和肾的排泄，每种排泄都由许多不同的过程组成。例如，肾脏的排泄是由肾小球滤过、主动分泌和再吸收过程决定的。药物排泄过程的复杂性阻碍了基于人工智能的排泄预测因子的发展。最近，出现一种新方法，即应用偏最小二乘线性法和随机森林的非线性算法预测人体内的药物分布体积。\n\
    \n上面提到的方法，仔细选择了一组分子描述符，并使用遗漏法和独立测试集评估了预测因子的表现。根据750种化合物的数据，使用物理化学描述符和结构片段，构建预测人类血浆清除率的线性偏最小二乘预测因子，建立基于随机向量机的预测因子，其中包含一组根据药物化学结构计算的描述符，用于预测141种已批准药物在人体内的主要清除途径，并显示出较高的预测性能。\n\
    \n（5）药物毒性预测。\n\n药物毒性，是指由于化合物的作用，或代谢而对机体或机体的子结构，如细胞和器官，产生的不良影响。毒性的测量是药物发现和开发周期中最重要和最具挑战性的步骤。高通量的分析结果可靠，但耗能高，耗时耗力。因此，寻找合理的计算模型，提供快速、廉价、可靠的方法，替代大规模体内和体外生物分析，有很高的研究价值。现已有多种Web工具和软件包发布，来预测毒性，如admetSAR,\
    \ Toxtree, LimTox, pkCSM和DLAOT。\n\n与此同时，先进的人工智能算法为预测毒性开辟了新的途径，许多文献讨论了人工智能在这一领域的潜在作用，如预测毒理学终点或有毒化合物的分类。这些算法，大多大致分为基于相似性和基于特征的方法。一种基于相似性的方法，通过计算化合物之间的成对相似性矩阵，来预测分子的毒性，然后通过最近邻算法和支持向量机等预测方法来分配分类。与大多数虚拟筛选工作类似，其潜在的假设是相似的结构应该发挥类似的生物学效应。基于特征的方法通过选择或加权输入特征来预测毒性，包括随机森林和朴素贝叶斯模型。\n\
    \n与基于特征的方法不同，成功预测的关键，是选择与任务最相关的特征，基于相似性的方法需要在以特征向量或二维/三维图表示的分子之间，进行有用的相似性度量。在这些表示中，存在识别不同的结构、物理化学和生化模式，如毒物团搜索、子图挖掘和图核。在毒性实验数据上训练时，人们构建了基于这些方法的人工智能预测因子，且表现出良好的整体性能水平。\n\
    \n测试集数据选自已报道的毒理学数据，利用实验动物进行药物毒性测试，包括小鼠或大鼠口服急性毒性、呼吸毒性和尿路毒性。考虑到这组不同任务的总体性能，支持向量机方法，对于构建可靠的毒性预测模型始终有效，在测试集中实现皮尔逊相关系数的10倍交叉验证平方约为0.7。\n\
    \n此外，增强算法都从一个弱预测因子的集合中生成了一个强毒性预测因子。近期报道了另一种集成技术，使用标记分类器对已批准药物的四种不同的毒性效应进行了评估。尽管上述方法开发了性能良好的预测模型，但一个关键限制是，它无法自动学习和提取任务特定的化学特征。\n\
    \n准确预测模型的发展在很大程度上取决于适当的分子表示。近年来，深度学习技术的出现，使分子表示的新方法出现，并能够生成新的、抽象的和特定任务的特征。这些特征使深度学习方法非常适合预测毒性，这从它们在Tox21数据挑战中的成功，可以得到证明。\n\
    \nTox21挑战，主要是由食品和药物管理局发起的，旨在评估各种计算方法预测毒性的性能，并评估这些工具在减少体内实验数量方面的潜在价值。多人参与了这一挑战，以评估多任务深度学习方法在预测毒性方面的性能。一个名为DeepTox的预测管道赢得了这一挑战，他以深度学习支持自动学习，输出结果与专家知识和经验确定的成熟毒物性质几乎高度一致。\n\
    \n多任务学习，允许一个任务从相关任务中“借鉴”特征，从而大大提高整体表现。这一发现得到了偶然结果的支持。关于多任务目标的预测，最近还报道了多任务深度网络在四种药物数据收集上，相对于随机森林方法的优越性。模型中较低的层倾向于学习毒团的小成分，如磺酸基，而在较高的层中，这些成分合并成子结构或整个毒团。\n\
    \n在大多数深度学习应用中，特定分子的编码由固定长度的向量表示，因此深度学习方法的成功，很大程度上依赖于良好的编码功能将分子结构信息映射到向量中。部分开发者描述了深度学习体系结构，通过从原始分子图中学习相关特征来预测毒性，以克服这一限制。这些结构的典型示例包括，用于预测药物诱导肝损伤的无向图递归神经网络，以及用于预测急性口服毒性的改进分子图编码卷积神经网络结构。\n\
    \n使用大规模多任务网络进行虚拟筛选，可以显著提高预测精度，但这些网络需要在包含数百万数据点的大型数据集上进行训练。这说明，深度学习在预测毒性和药物开发领域的成功，在很大程度上取决于输入数据的数量和质量。将重点放在仅从少数几个数据点学习有意义的化学信息这一问题上，引入了“一次性学习”技术，以提高稀疏数据任务的预测能力。利用迭代求精与图卷积神经网络相结合，形成一种新的深度学习体系结构，通过在相关但不同的任务之间传递信息来训练这些模型。\n\
    \n一次性学习的成功，需要3个关键要素。首先，通过使用相似度度量，比较新数据点与可用数据以及这些新数据点的后续属性推断，使稀疏训练数据的影响最小化。其次，学习一个有意义的距离度量，使这种相似性可转移，以便信息在查询示例和支持集元素之间进行交换。最后，通过图卷积网络，使用一个灵活而有意义的数据表示作为输入。这种体系结构大大提高了在Tox21的有限子集和内部集合上训练的模型的性能，从而恢复了通常使用较少的输入数据丢失的信息。\n\
    \n为了更准确地预测药物的ADMET值，需要更多的研究来建立一个全球适用且可靠的ADMET预测因子。构建可靠的人工智能预测因子时，应考虑几个因素，包括多物种毒性数据，并考虑与计算相关的已知问题。这种方法的一个重要前提是，需要验证和仔细定义人工智能模型的适用性域，在人工智能模型中建立信任。尽管目前基于人工智能的ADMET预测因子仍然不够精确，无法取代生物相关系统中的体外测量，但它们仍有助于推动药物化学朝着正确的方向发展，从而减少解决ADMET相关问题所需的合成周期。\n\
    \n# 第4章  \n\n人工智能让候选药物筛选事半功倍\n\n在药物发现中，第一步也是最重要的一步是识别与疾病病理生理学有关的适当靶点（如基因、蛋白质），然后找到可以干预这些靶点的适当药物或类药物分子，现在我们可以访问一系列生物医学数据库，这些数据库可以在这方面能帮助我们。此外，人工智能的发展使大数据分析变得更加容易，因为现在有无数的机器学习技术可用，这些技术可以帮助提取这些大型生物医学数据集中存在的有用特征、模式和结构。对于靶标识别，基因表达等特征被广泛用于了解疾病机制和寻找导致疾病的基因。\n\
    \n大数据可以定义为过于庞大和复杂的数据集，无法使用传统的数据分析软件、工具和技术进行分析。大数据的三个主要特征是体积、速度和多样性，其中体积表示生成的大量数据，速度表示这些数据的复制速度，多样性表示数据集中存在的异质性。随着微阵列、RNA-seq和高通量测序（HTS）技术的出现，每天都会产生大量的生物医学数据，因此当代药物发现已经过渡到大数据时代。\n\
    \n在制药行业，人工智能已经成为解决经典化学或化学空间的问题的可行方案，这些问题阻碍了药物的发现和开发。随着技术的进步和高性能计算机的发展，人工智能算法在计算机辅助药物设计（CADD）中得到了增强。人工智能并不是科学家在药物发现和开发方面的新技术，如Hammett将平衡常数与反应速率联系起来，Hansch对药物化合物的物理化学性质和生物活性进行了计算机辅助预测。Hansch的成功为药物研究提供了一条途径，该研究侧重于化学结构的详细识别和预测，以及药效团和三维结构等特性的表征，并假设与预测化合物的化学表征和生物活性相关的复杂数学方程。然而，在当前时代，科学家的主要目标是通过基于经典化学活动的机器学习算法，以高精度和置信度分数改进药物发现和开发过程。\n\
    \n## 4.1　从头药物设计\n\n开发从头设计算法来虚拟设计和评估化合物，有可能减少寻找合适针头的时间和成本，尤其是如果人工智能设计与自动匹配化学相结合的话。早期的从头设计算法，使用基于结构的方法来设计在空间和静电上适合感兴趣靶的结合口袋的配体。通过这种类型的方法设计的化合物通常具有较差的DMPK性质和合成难处理性。另一种从头设计方法是首先列举大型虚拟图书馆，然后通过对接和相似性/药效团搜索来探索化学空间。\n\
    \n近年来，旨在发现新活性分子的从头设计，已经引入了许多方法和软件解决方案。将多目标优化法集成到设计工作流程中，是计算化学方法最直接的应用。从头设计，可分为两种典型的方法：基于配体的方法和基于结构的方法。基于配体的方法只使用配体信息，如分子相似性或活性模型，而基于结构的方法使用蛋白质结构，在目标结合位点存在的情况下优化设计的配体。\n\
    \n从头药物设计的一个中心问题是确定配体与受体的结合能力。配体识别评分算法，可以估计给定三维结构的蛋白配体复合物的结合亲和力。该方法使用经验评分函数来描述束缚自由能。相互作用参数包括范德华力、氢键、脱溶效应和金属螯合。该法使用线性模型建模解离平衡常数，引入原子类型来区分不同原子对之间的范德华力、氢键相互作用和金属螯合的参数。\n\
    \n在靶蛋白的结构已知的情况下，分子对接可以用来识别可能与之结合的分子。此阶段仅仅是药物与蛋白质结合。对接过程并不能直接预测这种结合的任何药理或生理后果。该分子是否真的能实际结合（更不用说作为抑制剂、激动剂、拮抗剂、反向激动剂等）还需要后续研究。\n\
    \n发现可成药的小分子结构的主要挑战是，合成最少的分子目标，有效地探索化学空间。其中，多目标优化方法，通过对驱动药物设计成功因素的总结，扩大药物化学设计中应考虑的相应的参数数量，避免化合物相关的无效设计。\n\
    \n理想情况下，提高对生物靶点的效价和选择性应与亲脂性、解离度和适当的配体效率等因素一起进行评估，以增加代谢稳定性和膜通透性，同时最大限度地减少非靶点结合和转运体亲和力。\n\
    \n在实际药物发现过程中，大量的化学空间探索中需要优化的并发参数可能无法在单个分子中实现。近几十年来，快速平行合成化学技术取得了长足进步，多样性导向合成作为化学范式出现，但对所有化学空间的全面实验探索是不现实的。过早地将合成工作集中在化学空间的局部区域，可能会忽略更有可能满足更多参数要求的解决方案的机会。"
  fmt: '

    人工智能技术已被广泛用于将化学品的`ADMET`特性与分子描述符（或特征）直接关联，并从可用数据集构建预测模型。随着对分子结构与物理化学性质之间关系的理解日益加深，包括脂水分配系数（`log
    P`）、水溶解度（`log S`）、透膜性以及化合物的生物学行为，特别是其药代动力学特性，人们已经开发了用于快速预测`ADMET`特性的间接方法。这些方法旨在将药物发现工作引导到可能更具生产力的化学领域，而不在现阶段对特定的化学基团施加苛刻的限制。


    小分子候选药物的简单物理化学性质通过影响`ADMET`性质、药效和药物化合物的选择性，对其最终进入市场的成功具有众所周知的影响。例如，化合物熟悉的物理化学性质已被用于对其可能的目标家族进行分类。


    这种方法可能在某种程度上被小分子和`me-too`方法的发展所迷惑，但它仍然是一种启发性的见解。小分子候选药物必须表现出足够的溶解度和渗透性，以达到其作用部位并参与其靶点。因此，更好地理解和准确预测其理化性质将有助于设计具有所需药代动力学和药效学特征的化合物。


    早期的`ADMET`预测，可以帮助研究人员选择良好的候选药物，并在整个开发过程中促进药物的成药性。近年来，人工智能辅助`ADMET`预测领域取得了许多进步，基于深度学习和大数据的新一代预测因子，将促进从实验室到临床的药物发现和开发过程。


    ### （1）药物吸收度预测

    药物吸收是药物分子通过一个或多个生物膜屏障，从吸收部位被吸收到血液中的关键第一步。这是一个复杂的过程，在很大程度上受到药物的物理化学性质、给药途径、所选择的配方和生理因素的影响。药物吸收的预测模型分为物理化学和生理两个主要领域。


    目前，已经提出了几种基于评估吸收过程中涉及的物理化学性质的简单过滤方法，包括但不限于`log P`、`log S`和内在渗透率，以快速预测小分子的生物利用度。这些方法，有助于药物化学家在先导物的优化过程中，做出初步和快速的判断，例如，如果候选药物分子的内在水溶性较低，预计其吸收能力较差。


    然而，由于生物膜具有多种药物吸收机制，仅基于物理化学特征的药物吸收预测难以实现合理的准确性，而且每一个缺失的分子都是潜在的药效团。因此，一个生理模型有助于开发一种可靠的、高通量的方法。人肠道吸收是`ADMET`最具影响力的特性之一，直接影响口服生物利用度。基于体内和体外实验分析的数据，已经引入了许多计算分类和回归模型来预测人肠道吸收。


    机器学习方法在这方面也有广泛的应用。一般来说，在绝大多数已发表的研究中，人肠道吸收的预测精度在一个可接受的范围内，最大最突出的问题是有限的数据容易导致过拟合。几种技术已被应用来缓解小样本量问题，并实现更可靠的性能。例如，最近报道的集成学习技术，可以获得一个可靠的模型来预测不同化学物质的人肠道吸收。


    基于集成学习的预测模型，在几种严格的外部验证条件下进行了评估，并显示出良好的人肠道吸收模型的预测能力。最近提出了一个基于卷积神经网络的计算模型，该模型从分子描述符中预测化合物的吸收潜力，而不需要明确的特征要求。


    解决过拟合问题，另一种方法是使用一个大的、多样化的初始数据集。初始数据集作为在实际应用中预测候选药物人肠道吸收的一个起点，可以建立稳健和可靠的预测模型，输出并预测候选药物的吸收度。


    ### （2）药物分布预测

    药物分布是指药物分子从血流扩散或主动运输至身体组织，尤其是预期发生作用的组织的过程。


    影响药物吸收的相同特征，如亲脂性、分子大小、pH值、电离度等，也会影响药物分布到各种组织的速率和程度。其他因素也发挥作用，特别是非特异性和可逆蛋白与血浆蛋白的结合，包括人血清白蛋白、脂蛋白、α-酸糖蛋白等。与血浆蛋白结合，会影响药物的分布量、药理学和药代动力学，因为只有未结合的药物分子才能达到其生物靶点，并发挥预期的治疗作用。因此，与血浆蛋白不结合的化学部分是分布建模的关键参数。机器学习方法常被用来预测人类血浆蛋白结合的模型，如人工神经网络、随机森林和支持向量机等。


    尽管已有大量工作来研究血浆蛋白结合的实验数据，但由于产生相关数据源的研究目的不一，要覆盖完整、一致的药物空间，难度非常大。只有广泛管理数据集，构建回归模型，才能有效预测药物血浆蛋白结合能力。在决定药物分布的各种因素中，生理屏障经常被提及，如血脑屏障和胎盘屏障。血脑屏障在保护大脑免受血液成分变化（如激素、神经递质和其他异种生物）和大脑稳态的变化中起着关键作用。不过，它也为治疗中枢神经系统疾病的药物开发工作制造了一个主要障碍。


    药物分子从血液转移到大脑的速率，主要取决于其膜的通透性。近年来，利用机器学习方法预测血脑屏障渗透性，大大减少了高成本、高耗时的实验室工作。大量的体内和体外参数，可用于测量血脑屏障渗透，但最受欢迎和公认的参数仍然是药物在血液中的深度，高比例的血药浓度对应大脑更高的相对浓度。


    与血脑的屏障渗透相关的一些描述符，被广泛用于构建预测模型，包括物理化学性质，如亲脂性、电离状态、电荷描述符、氢键供体和受体的数量、极性表面积等。因为缺少公开数据集，建立分子描述符之间的可靠关系，测量血脑屏障渗透仍然具有挑战性。此外，相对于对肠道通透性的了解，对限制血脑屏障渗透的复杂机制的理解仍然相对有限。


    真核生物系统的渗透机制主要包括被动扩散、被动运输和主动转运。被动扩散被认为是药物通过血脑屏障最常见的机制，因此，迄今为止建立的大多数渗透预测模型都集中在这一机制上，而排除了其他机制。考虑到药物是通过多种途径透过血脑屏障的，难以从分子的物理化学特征来预测，最近引入了一种通过药物临床表型预测药物血脑屏障渗透的新方法。药物的中枢神经系统副作用与血脑屏障的渗透密切相关。基于文献中药物预警中可用的副作用数据的相对丰度，使用异构数据构建预测模型可能有助于提高预测成功率。


    ### （3）药物代谢预测

    异种生物在肝脏或其他组织和器官中的化学转化，即代谢，通常是一个酶介导的过程，考虑到代谢酶的多功能性、底物和抑制剂的多样性，以及代谢过程的复杂性，代谢预测被认为最具挑战性。代谢决定了一种药物在体内的命运，从而影响其安全性和治疗效果。它在许多过程中起着关键作用，如许多药物疗效的丧失、特殊的药物不良相互作用、肝毒性和药物-药物相互作用等。


    大部分药物分子主要经由细胞色素`P450`亚型（`CYP450s`）和葡萄糖醛酸基转移酶（`UGT`）参与的Ⅰ期和Ⅱ期代谢。约58%的药物经由`CYP450`代谢。因此，`CYP450`抑制试验，通常用于检测那些在药物发现的早期阶段可能具有不期望的药代动力学特性的分子。


    近年来，有越来越多的研究主要筛选非`CYP450`Ⅰ期代谢酶介导的代谢过程。蛋白质-配体对接、分子动力学、分子力学-广义玻恩表面积连续溶剂化、量子力学等多种计算方法，针对`CYP450s`和`UGTs`等靶标进行研究，研究代谢的位点、产物和代谢酶的抑制或诱导。


    应用人工智能方法，研究人员通过明确描述参与破坏和形成分子键的电子，研究特定系统、代谢机制的细节，根据大量分子通过特定酶面板代谢的可能性进行预测。一般情况下，人工智能在代谢预测领域的应用主要包括预测代谢位点的位置，预测负责代谢的特定亚型，预测代谢药代动力学。代谢位点的预测对于药物研究至关重要，因为它为可能的代谢物的衍生提供了关键信息，为开发更安全、更有效的药物提供了指导。


    当前，已经开发了一些基于人工智能的预测代谢部位的模型，并显示出令人满意的准确性。例如，随机森林预测器使用层次描述符的组合，识别`CYP450`介导的类药物分子代谢的潜在位点，其形式类似于支持向量机，在训练期间具有量身定制的实例错误值。`Xe⁃noSite`，是一种基于神经网络预测`CYP450`介导的Ⅰ期代谢位点的工具。`FAME`，另一种快速、有效的基于人工智能的预测工具。在`FAME`预测器基础上，最近又提出了一种修正的预测代谢部位的方法，集成为一个新开发的软件包——`FAME2`，现在可以在线免费获得。


    人工智能方法已被应用于相关分子对代谢酶的抑制谱的分类。除了预测代谢位点外，推断阶段Ⅰ或Ⅱ酶的特定异构体可能负责特定化合物的代谢。同时，研究人员对预测由非`CYP450`酶介导的代谢表现出越来越大的兴趣，尽管到目前为止，只有相对较少的文献报道了基于人工智能的代谢位点、亚型特异性和这些酶的动力学参数预测模型。目前大多数可用的模型仅对提供的初始分子进行代谢预测。


    实际上，许多初级代谢物，要经历另一轮Ⅰ期或Ⅱ期代谢，形成次生有毒代谢物，例如，第一阶段聚芳烃氧化形成的环氧化物。因此，量子和分子力学的方法可以模拟这些反应的热力学和动力学，以及涉及代谢生物转化的详细机制。量子化学已经证明了它在生成信息性分子表征方面的效用，实现了对药物优化运动的回顾性预测的持续准确性。为了更现实地预测代谢物，并在药物开发的早期阶段识别有问题的化合物，有必要将当前的代谢组学和毒性信息与化学和酶反应机制的分子知识相结合，提供一个兼容性的代谢预测平台。


    ### （4）药物排泄预测

    药物排泄，是从体内清除药物分子的过程，直接影响药物及其代谢物的血浆浓度，在药物设计中起着重要作用。排泄是一个复杂的过程，涉及多种消除途径，如胆道和肾的排泄，每种排泄都由许多不同的过程组成。例如，肾脏的排泄是由肾小球滤过、主动分泌和再吸收过程决定的。药物排泄过程的复杂性阻碍了基于人工智能的排泄预测因子的发展。最近，出现一种新方法，即应用偏最小二乘线性法和随机森林的非线性算法预测人体内的药物分布体积。


    上面提到的方法，仔细选择了一组分子描述符，并使用遗漏法和独立测试集评估了预测因子的表现。根据750种化合物的数据，使用物理化学描述符和结构片段，构建预测人类血浆清除率的线性偏最小二乘预测因子，建立基于随机向量机的预测因子，其中包含一组根据药物化学结构计算的描述符，用于预测141种已批准药物在人体内的主要清除途径，并显示出较高的预测性能。


    ### （5）药物毒性预测

    药物毒性，是指由于化合物的作用，或代谢而对机体或机体的子结构，如细胞和器官，产生的不良影响。毒性的测量是药物发现和开发周期中最重要和最具挑战性的步骤。高通量的分析结果可靠，但耗能高，耗时耗力。因此，寻找合理的计算模型，提供快速、廉价、可靠的方法，替代大规模体内和体外生物分析，有很高的研究价值。现已有多种Web工具和软件包发布，来预测毒性，如`admetSAR`,
    `Toxtree`, `LimTox`, `pkCSM`和`DLAOT`。


    与此同时，先进的人工智能算法为预测毒性开辟了新的途径，许多文献讨论了人工智能在这一领域的潜在作用，如预测毒理学终点或有毒化合物的分类。这些算法，大多大致分为基于相似性和基于特征的方法。一种基于相似性的方法，通过计算化合物之间的成对相似性矩阵，来预测分子的毒性，然后通过最近邻算法和支持向量机等预测方法来分配分类。与大多数虚拟筛选工作类似，其潜在的假设是相似的结构应该发挥类似的生物学效应。基于特征的方法通过选择或加权输入特征来预测毒性，包括随机森林和朴素贝叶斯模型。


    与基于特征的方法不同，成功预测的关键，是选择与任务最相关的特征，基于相似性的方法需要在以特征向量或二维/三维图表示的分子之间，进行有用的相似性度量。在这些表示中，存在识别不同的结构、物理化学和生化模式，如毒物团搜索、子图挖掘和图核。在毒性实验数据上训练时，人们构建了基于这些方法的人工智能预测因子，且表现出良好的整体性能水平。


    测试集数据选自已报道的毒理学数据，利用实验动物进行药物毒性测试，包括小鼠或大鼠口服急性毒性、呼吸毒性和尿路毒性。考虑到这组不同任务的总体性能，支持向量机方法，对于构建可靠的毒性预测模型始终有效，在测试集中实现皮尔逊相关系数的10倍交叉验证平方约为0.7。


    此外，增强算法都从一个弱预测因子的集合中生成了一个强毒性预测因子。近期报道了另一种集成技术，使用标记分类器对已批准药物的四种不同的毒性效应进行了评估。尽管上述方法开发了性能良好的预测模型，但一个关键限制是，它无法自动学习和提取任务特定的化学特征。


    准确预测模型的发展在很大程度上取决于适当的分子表示。近年来，深度学习技术的出现，使分子表示的新方法出现，并能够生成新的、抽象的和特定任务的特征。这些特征使深度学习方法非常适合预测毒性，这从它们在`Tox21`数据挑战中的成功，可以得到证明。


    `Tox21`挑战，主要是由食品和药物管理局发起的，旨在评估各种计算方法预测毒性的性能，并评估这些工具在减少体内实验数量方面的潜在价值。多人参与了这一挑战，以评估多任务深度学习方法在预测毒性方面的性能。一个名为`DeepTox`的预测管道赢得了这一挑战，他以深度学习支持自动学习，输出结果与专家知识和经验确定的成熟毒物性质几乎高度一致。


    多任务学习，允许一个任务从相关任务中“借鉴”特征，从而大大提高整体表现。这一发现得到了偶然结果的支持。关于多任务目标的预测，最近还报道了多任务深度网络在四种药物数据收集上，相对于随机森林方法的优越性。模型中较低的层倾向于学习毒团的小成分，如磺酸基，而在较高的层中，这些成分合并成子结构或整个毒团。


    在大多数深度学习应用中，特定分子的编码由固定长度的向量表示，因此深度学习方法的成功，很大程度上依赖于良好的编码功能将分子结构信息映射到向量中。部分开发者描述了深度学习体系结构，通过从原始分子图中学习相关特征来预测毒性，以克服这一限制。这些结构的典型示例包括，用于预测药物诱导肝损伤的无向图递归神经网络，以及用于预测急性口服毒性的改进分子图编码卷积神经网络结构。


    使用大规模多任务网络进行虚拟筛选，可以显著提高预测精度，但这些网络需要在包含数百万数据点的大型数据集上进行训练。这说明，深度学习在预测毒性和药物开发领域的成功，在很大程度上取决于输入数据的数量和质量。将重点放在仅从少数几个数据点学习有意义的化学信息这一问题上，引入了“一次性学习”技术，以提高稀疏数据任务的预测能力。利用迭代求精与图卷积神经网络相结合，形成一种新的深度学习体系结构，通过在相关但不同的任务之间传递信息来训练这些模型。


    一次性学习的成功，需要3个关键要素。首先，通过使用相似度度量，比较新数据点与可用数据以及这些新数据点的后续属性推断，使稀疏训练数据的影响最小化。其次，学习一个有意义的距离度量，使这种相似性可转移，以便信息在查询示例和支持集元素之间进行交换。最后，通过图卷积网络，使用一个灵活而有意义的数据表示作为输入。这种体系结构大大提高了在`Tox21`的有限子集和内部集合上训练的模型的性能，从而恢复了通常使用较少的输入数据丢失的信息。


    为了更准确地预测药物的`ADMET`值，需要更多的研究来建立一个全球适用且可靠的`ADMET`预测因子。构建可靠的人工智能预测因子时，应考虑几个因素，包括多物种毒性数据，并考虑与计算相关的已知问题。这种方法的一个重要前提是，需要验证和仔细定义人工智能模型的适用性域，在人工智能模型中建立信任。尽管目前基于人工智能的`ADMET`预测因子仍然不够精确，无法取代生物相关系统中的体外测量，但它们仍有助于推动药物化学朝着正确的方向发展，从而减少解决`ADMET`相关问题所需的合成周期。


    # 第4章 人工智能让候选药物筛选事半功倍

    在药物发现中，第一步也是最重要的一步是识别与疾病病理生理学有关的适当靶点（如基因、蛋白质），然后找到可以干预这些靶点的适当药物或类药物分子，现在我们可以访问一系列生物医学数据库，这些数据库可以在这方面能帮助我们。此外，人工智能的发展使大数据分析变得更加容易，因为现在有无数的机器学习技术可用，这些技术可以帮助提取这些大型生物医学数据集中存在的有用特征、模式和结构。对于靶标识别，基因表达等特征被广泛用于了解疾病机制和寻找导致疾病的基因。


    大数据可以定义为过于庞大和复杂的数据集，无法使用传统的数据分析软件、工具和技术进行分析。大数据的三个主要特征是体积、速度和多样性，其中体积表示生成的大量数据，速度表示这些数据的复制速度，多样性表示数据集中存在的异质性。随着微阵列、`RNA-seq`和高通量测序（`HTS`）技术的出现，每天都会产生大量的生物医学数据，因此当代药物发现已经过渡到大数据时代。


    在制药行业，人工智能已经成为解决经典化学或化学空间的问题的可行方案，这些问题阻碍了药物的发现和开发。随着技术的进步和高性能计算机的发展，人工智能算法在计算机辅助药物设计（`CADD`）中得到了增强。人工智能并不是科学家在药物发现和开发方面的新技术，如`Hammett`将平衡常数与反应速率联系起来，`Hansch`对药物化合物的物理化学性质和生物活性进行了计算机辅助预测。`Hansch`的成功为药物研究提供了一条途径，该研究侧重于化学结构的详细识别和预测，以及药效团和三维结构等特性的表征，并假设与预测化合物的化学表征和生物活性相关的复杂数学方程。然而，在当前时代，科学家的主要目标是通过基于经典化学活动的机器学习算法，以高精度和置信度分数改进药物发现和开发过程。


    ## 4.1 从头药物设计

    开发从头设计算法来虚拟设计和评估化合物，有可能减少寻找合适针头的时间和成本，尤其是如果人工智能设计与自动匹配化学相结合的话。早期的从头设计算法，使用基于结构的方法来设计在空间和静电上适合感兴趣靶的结合口袋的配体。通过这种类型的方法设计的化合物通常具有较差的`DMPK`性质和合成难处理性。另一种从头设计方法是首先列举大型虚拟图书馆，然后通过对接和相似性/药效团搜索来探索化学空间。


    近年来，旨在发现新活性分子的从头设计，已经引入了许多方法和软件解决方案。将多目标优化法集成到设计工作流程中，是计算化学方法最直接的应用。从头设计，可分为两种典型的方法：基于配体的方法和基于结构的方法。基于配体的方法只使用配体信息，如分子相似性或活性模型，而基于结构的方法使用蛋白质结构，在目标结合位点存在的情况下优化设计的配体。


    从头药物设计的一个中心问题是确定配体与受体的结合能力。配体识别评分算法，可以估计给定三维结构的蛋白配体复合物的结合亲和力。该方法使用经验评分函数来描述束缚自由能。相互作用参数包括范德华力、氢键、脱溶效应和金属螯合。该法使用线性模型建模解离平衡常数，引入原子类型来区分不同原子对之间的范德华力、氢键相互作用和金属螯合的参数。


    在靶蛋白的结构已知的情况下，分子对接可以用来识别可能与之结合的分子。此阶段仅仅是药物与蛋白质结合。对接过程并不能直接预测这种结合的任何药理或生理后果。该分子是否真的能实际结合（更不用说作为抑制剂、激动剂、拮抗剂、反向激动剂等）还需要后续研究。


    发现可成药的小分子结构的主要挑战是，合成最少的分子目标，有效地探索化学空间。其中，多目标优化方法，通过对驱动药物设计成功因素的总结，扩大药物化学设计中应考虑的相应的参数数量，避免化合物相关的无效设计。


    理想情况下，提高对生物靶点的效价和选择性应与亲脂性、解离度和适当的配体效率等因素一起进行评估，以增加代谢稳定性和膜通透性，同时最大限度地减少非靶点结合和转运体亲和力。


    在实际药物发现过程中，大量的化学空间探索中需要优化的并发参数可能无法在单个分子中实现。近几十年来，快速平行合成化学技术取得了长足进步，多样性导向合成作为化学范式出现，但对所有化学空间的全面实验探索是不现实的。过早地将合成工作集中在化学空间的局部区域，可能会忽略更有可能满足更多参数要求的解决方案的机会。

