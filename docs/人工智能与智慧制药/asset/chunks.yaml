  trans: '


    由于药物发现是一个多参数优化挑战，在通常的情况下，多任务学习可能会更有效地利用相关数据，在这种情况下，整个分子库没有在所有感兴趣的终点上进行详尽的测试，并且不需要事先插补。多输出
    QSAR 建模的想法，旨在将一组预定义的化学描述符与可观察的终点联系起来，在深度学习方法流行之前就已经被探索过了。尽管有多任务学习的前景，但迄今为止，与单任务模型相比，它只有适度的性能改进。


    深度学习的一个众所周知的缺点是它在中低数据场景中的性能较差。一些基于化学基因组的方法可能通过利用额外的基因组或生物相互作用组数据源，为这些情况提供进一步的见解。


    沿着这些思路，纯粹数据驱动的分子性质预测方法，与（完全或部分）基于物理的技术相比，对看不见的化合物类进行推断和做出可靠预测的能力有限。物理化的机器学习方法和额外的主动学习策略（即模型要求特定的训练数据以改进泛化方面发挥作用的方法）提供了额外的工具来克服这些限制。这些策略的成功将进一步严重取决于它们的具体实现如何应对数据稀疏性，因为能够进行有效数据计算的合适来源往往是稀缺的。


    深度学习模型也因其臭名昭著的调试困难和“黑盒”角色而受到广泛批评。相比之下，手工开发特定领域的特性（即针对特定任务专门设计的描述符）仍然有潜力以一种更容易理解的方式整合背景知识。可解释的人工智能技术可以通过深度学习方法，为这些问题提供部分解决方案。继续发展特征归因技术（即旨在强调输入的总体重要性的方法）基于实例的解释（如反事实、基于用户定义查询的模型生成的例子）和基于注意力的网络将有助于缩小深度学习和药物发现专家之间的差距。因此，这些领域之间的密切合作是非常必要的。


    深度学习方法的另一个常见的缺点是它们的计算成本很高。如果没有专门的硬件，如消费级图形处理或张量处理单元，深度学习通常需要比许多其他机器学习方法更长的训练和评估时间。虽然前面的陈述在大多数情况下都没有问题，但深度学习模型可以自然地利用其最流行的训练策略，即随机梯度下降优化来进行在线学习。这具有相对于训练数据集的大小线性缩放的优点，因此不需要将训练数据集完全加载到系统的存储器中。在连续、随机、批量的数据上随机训练深度学习模型的能力，可以使它们比大数据场景中的其他替代方案更适合。


    一个相关的问题是，与其他更彻底的测试方法相比，预测性深度学习在许多实际场景中往往需要更多的人类专业知识。例如，虽然可以用相对较小的努力来训练一个性能良好的随机森林模型，但我们对当代深度学习方法的理解还没有达到可靠的默认水平，尽管最近的理论表明，这种情况可能在不久的将来发生改变。


    此外，神经网络可能会出现误导性，即所谓的 Clever-Hans 效应，并有产生过于自信的预测的倾向，即使这些预测显然是错误的。在药物发现的性质预测的背景下，这种情况进一步加剧，因为在类似条件下的实验可以提供明显不同的测量结果。随着不确定性估计技术的广泛采用，这一缺陷可能会在未来几年得到缓解，无论是使用直接嵌入不确定性的深度学习方法，如贝叶斯神经网络，还是使用集成学习等后组织技术。


    神经网络在基于结构的蛋白质配体活性预测方面也取得了显著的进展，与经典的 QSAR 不同，这需要一个共晶或对接姿态来推测不同的目标。许多经典的方法都建模了一个明确的、预定义的蛋白质-配体通过偏最小二乘或多元线性回归的蛋白质-配体复合物的数学关系，以便准确地考虑单个描述符的贡献，并预测物理化学性质的目标性质。


    更先进、更灵活的非线性模型方法，如随机森林或支持向量机，在 2010 年代初流行起来，再加上广泛的描述符使其进一步发展，如蛋白质-配体-原子对计数、性质编码的形状分布或基本原子相互作用。与纯粹基于配体的对应物类似，这一特定的子领域最近见证了深度学习的出现，并利用了它的优势。早期方法受到计算机可视化和图像识别的启发，这些进步主要由卷积神经网络驱动，并最终适用于生物活性预测。其他研究使用了基于图形的方法，以及基于距离和角度的方法来实现相同的目标。在基于结构的虚拟筛选和线索优化竞赛中，其中一些方法比以前的方法提供了渐进的性能改进。但质疑的声音一直存在，他们认为一些众所周知的基准更倾向于支持基于机器学习的评分函数，而不是经典的评分函数。


    为了与人们对可解释人工智能日益增长的兴趣保持一致，最近对解释基于结构的卷积神经网络模型的尝试表明，这些模型能够以可理解的术语突出相关的蛋白质-配体相互作用，如氢桥和π-π堆叠。


    然而，基于三维卷积神经网络的方法，具有一定的理论局限性，缺乏相对于输入的旋转不变性，这是对原子系统建模时所必需的特性。如何克服这个问题，最近成为了一个非常活跃的研究领域，新开发的神经网络架构，如欧几里得神经网络和
    SchNet，相对于三维（即旋转和平移）中的特殊欧几里得神经网络等将变性直接嵌入它们的设计中。这些结构已经应用于一些分子任务，例如预测分子的电子性质。这一方向的研究，预计将在不久的将来为结构建模开辟新的机会。


    考虑到深度学习在药物发现中的应用快速增长，但极度依赖大型训练集的事实，开发新的模型，进行全面的数据管理和适当的基准测试，就显得非常重要。在过去的几年里，化合物库的可用性和规模都有所提高，ZINC
    和 ChEMBL 等数据库代表了基于配体识别方法的常用起点。在基于结构的建模中，也观察到了类似的趋势，PDB-bind 和 BindingDB 等数据库，提供了关于蛋白质-配体复合物的高度详细的结构信息，及其相关的生物活性数据。蛋白质结构预测和测定领域的最新进展喜人，未来将有更多药物靶点的结构信息可用。


    在化学信息学的背景下，机器学习方法的开放和标准化已经投入了大量精力。例如，MoleculeNet 基准测试套件，旨在通过生物物理、物理化学和生理学等领域精心策划的数据集，及时评估许多流行的深度学习架构，从而促进模型测试。尽管公共数据的数量正在快速增长，但大多数结构-活性关系数据仍然是由商业研究组织、出版商和制药公司生成的，他们通常认为生成的数据是一种需要保密的差异化资产。最近的研究表明，分子结构通常可以从分子描述符中部分恢复，这可能会使数据共享进一步复杂化，甚至在潜在特征水平上也是如此。


    QSAR 建模是一种计算方法，通过它，可以在化学结构和生物活动之间创建定量数学模型。开发数学模型的主要优点是从分子数据库中识别不同的化学结构，这些结构可以用作对抗疾病靶点的治疗化合物。一旦选择出最有前景的化合物，就要进行实验室合成和体外或体内测试。


    QSAR 模型大致分为回归模型和分类模型两类。高斯回归是一种建立 QSAR 回归模型的类型，是一种稳健而强大的 QSAR 建模方法。高斯回归方法可以处理大量的描述符并识别关键的描述符。最近，已经使用高斯回归证明了两个分类模型，高斯回归是固有的高斯回归分类方法，另一个是高斯回归技术和概率分析的结合。


    该方法适用于对非线性关系进行建模，并且不需要主观确定模型参数。机器学习算法（如神经网络、深度学习和支持向量机）的最新进展和越来越多的应用为 QSAR 建模提供了一条很好的途径。现已有多种基于网络的
    QSAR 建模工具和算法，如 VEGA 平台、QSAR-Co、Meta-QSAR 等。


    QSAR-Co 可用于不同的研究，例如开发抑制磷酸肌醇 3 激酶异构体的多靶点化学计量模型、筛选 ERK 抑制剂作为抗癌剂、预测 K562 细胞功能抑制剂，以及预测酚类化合物的抗真菌特性等。


    机器学习模型的一个普遍问题是，QSAR 模型生成的生物测定数据中缺失值的数据插补。基本上有三种主要类型的缺失值：①随机完全缺失，当变量中缺失值的概率对所有样本都相同时，就会发生这种情况；②随机缺失，这意味着变量中随机缺失值的概率，仅取决于其他预测器中的可用信息；③非随机缺失，这意味着缺失值的概率不是随机的，并且取决于未记录的信息以及现有信息预测缺失值。


    有几种方法可以处理缺失值，如使用零、平均值、中值或模式共同值进行插补，使用随机选择的值进行插补，使用模型进行插补。每个数据集都有缺失的值，需要明智地处理这些值，以便构建一个稳健的模型。此外，应该消除数据的复杂性，必须对数据进行整理，以提高生成模型的准确性和准确性。此外，最初的
    QSAR 模型用于预测小分子的毒性和代谢，例如分子量小于 1500MW 的分子。


    除了经典的 Hansch 和 Free Wilson 方法外，QSAR 在过去几年中随着描述符计算的新方法、系统验证的实施以及受体结构信息的丰富而逐渐发展。除了经典的先导优化外，QSAR
    已经应用于药物发现和设计的不同新兴领域，如多肽 QSAR、混合物毒性 QSAR、纳米颗粒 QSAR、离子液体 QSAR、化妆品 QSAR、植物化学 QSAR
    和材料信息学。


    然而，最初的 QSAR 技术有一些限制，如准确性和可靠性。随着 QSAR 在药物发现和设计过程中的日益应用，如可视化筛选、先导优化和靶点识别，药物科学家和生物学家一直在努力开发更可靠的方法。


    基于人工智能/机器学习算法的 QSAR 模型，即基于全息图的 QSAR、基于组的 QSAR 和基于集合的 QSAR，将药物发现过程加速了数倍，有可能消除早期方法的不足。


    除了 QSAR 建模外，人工智能算法还被用于药物再利用或药物重新定位。在药物设计和发现中，药物重新定位是指对已经为一种疾病开发的药物进行研究，并将其重新指向其他疾病。由于多靶点参与多种疾病的可能性，重新定位药物是可行的。另外，基因组学、蛋白质组学、药理学体内外研究的大量数据集的出现，为药物重新定位提供了一条很好的途径。


    近年来出现了多种基于人工智能的算法和基于网络的工具，如 DrugNet、DRIMC、DP⁃DR-CPI。机器学习算法用系统生物学方法，取代了基于化学相似性和分子对接的传统方法，可以评估药物效果。基于人工智能的药物发现工具和算法的出现，为新未来的研究提供了平台。


    随着技术的进步，药物化学科学家、生物科学家和计算科学家正在寻找提高基于人工智能的模型准确性的方法。如果没有用于分析靶分子和配体分子之间相互作用的分子对接，药物发现的
    QSAR 和药物重新定位方法都是不完整的。分子对接曾被开发为一种独立的工具，用于确定两个分子（目标分子和配体分子）之间的相互作用。然而，随着人工智能技术的出现，分子对接的适用性发生了变化。现在，分子对接正与分子动力学模拟和基于人工智能的工具结合在药物发现的不同领域，如可视化筛选、靶标识别、多药生态学。


    分子动力学模拟和基于人工智能的算法，可以提高分子对接的效率和准确性，分子对接的使用限制也得到了解决。在药物设计中，分子对接只能用于那些晶体结构可用的生物靶标，因为有许多靶标的结构不可用。在人工智能的辅助下，已经出现了一种类似同源建模的技术来克服这种障碍。此外，PDB
    中的晶体结构数据呈指数级增长，增强了分子对接在药物发现中的适用性。


    ## （2）QSAR 预测


    20 世纪 90 年代开始，神经网络被广泛用于定量结构-活性关系研究。QSAR 是制药行业中一种非常常用的预测上靶和脱靶活性的技术。这些预测有助于在药物发现过程中确定实验的优先次序，并将大幅减少需要做的实验工作。在药物发现环节，QSAR
    通常被用于对大量化合物进行优先排序，在这种情况下，每个单独的预测都十分准确。也就是说，更高的预测精度总是可取的，但对可能使用的 QSAR 方法有实际的约束条件。


    即使硬件支持良好、高性能的内部计算环境中，计算机的时间和内存也可能会受到限制。在实际的环境中，一个理想的 QSAR 方法应该能够在 24 小时内，利用万级的分子描述符构建一个预测模型，无须人工干预。QSAR
    方法是计算机密集型的，或需要调整许多敏感参数，以实现对单个 QSAR 数据集的良好预测。


    由于这些限制，已经提出的许多机器学习算法中只有少数适用于药物发现中的一般 QSAR 应用。目前，最常用的方法是在随机森林和支持向量机上的变化，这是最具预测性的方法之一。由于其高预测精度、易用性和对可调参数的适应性，随机森林已成为其他
    QSAR 方法比较的“金标准”。对于非 QSAR 类型的机器学习也是如此。


    QSAR 和机器学习模型，有多个端点可供使用，但通常只针对一个端点进行训练。卷积神经网络，提供了将几个端点的预测作为多任务学习的可能性。多任务学习，可以提高预测质量。总的来说，通过多任务学习可以观察到模型性能的提高，同时对于某些任务似乎能进一步增强。当一个数据集与其他任务共享许多活性化合物时，它显示出更好的性能。此外，数据的量和任务的数量，都能够影响多任务学习。在关于行业规模的
    ADMET 数据集的研究中，也可以识别出对多任务学习的有益影响，但性能改进需要高度依赖于数据集的提高。


    深神经网是机器学习中越来越流行的方法之一，并在语音识别、计算机视觉和其他人工智能应用中产生了表现出高性能。深神经网与广泛用于化学应用的经典人工神经网络之间的主要区别之一是，深神经网有多个隐藏层，每一层都有更多的神经元，因此“更深”和“更宽”。


    深度学习也被用于预测有机小分子的势能，用快速机器学习方法取代了要求计算的量子化学计算。对于大型数据集，量子化学衍生的 DFT 势能，可以通过计算并用于训练深层神经元网络。该网络可以预测训练集分子的势能，即使是分子量比训练集分子大的测试分子。


    深度学习被广泛地用于验证许多不同的数据集和学习任务。在许多比较中，卷积神经网络在成熟的机器学习技术上做出了改进，其性能被认为可与体外检测相媲美。然而，许多研究都是回顾性地显示了深度学习体系结构在属性预测方面的适用性，并将该方法与已建立的机器学习算法进行了比较。


    通常，深度学习会使用像 ChEMBL 这样的公共数据集。在 ChEMBL 中，生物数据通常只用于一个目标，导致稀疏矩阵，使跨目标学习成为一个重大挑战。因此，在某些情况下，卷积神经网络明显优于其他机器学习方法，特别是因为训练和参数优化对许多其他机器学习方法的要求较低。一个很有前途的发展是通过学习引擎对化合物描述的自编码，这将提供依赖于问题的优化化合物描述。


    经典的神经网络面临着许多实际的困难。例如，它们只能处理有限数量的输入描述符。因此，必须应用描述符的选择或提取方法来将描述符的有效数量从数千个减少到数十个或最多数百个。因此，有价值的预测信息就丢失了。同时，为了避免训练数据过拟合，并减少计算负担，隐藏层的数量限制在
    1 层，且必须限制该隐藏层的神经元数量。


    由于理论方法、优化算法和计算硬件的进步，经典神经网络的大部分问题已经得到了解决。如今，具有多个隐藏层和每一层数千个神经元的神经网络可以常规地应用于具有数十万种化合物和数千个描述符的数据集，而不需要进行数据缩减。此外，即使网络有数百万个的重量，也可以控制过拟合。另一方面，与任何神经网络方法一样，用户可设置一些可调参数。


    默克结构化学实验室检查了 15 个不同的 QSAR 数据集，并确认深神经网在大多数情况下比随机森林能做出更好的预测。当隐藏层的数量为 2 时，隐藏层中有少量的神经元会降低深神经网的预测能力。当数据被输入到输入层时，下一层神经元只能看到前一层传递的信息。神经元数量较少的一层表示数据的能力较小。如果一层中的神经元数量太少，无法准确地捕捉到数据中变化的重要因素，那么下一层也将无法捕捉到这些信息，而添加更多的层只会使优化更加困难。


    此外，给定任意数量的隐藏层，一旦每层的神经元数量足够大，进一步增加神经元的数量只有一个边际的好处。例如，一旦两隐藏层深神经网的每层神经元数量达到 128，它的性能开始接近平缓。当进一步增加每层神经元数量时，深神经网的预测性能往往有更高的提升。三层和四层网络的行为很像两层网络，即更深的深神经网每层需要大量的神经元，这比两层深神经网要多。


    当网络只有一个包含 12 个神经元的隐藏层时，神经网络实现了与随机森林相同的平均预测能力。这种大小的神经网络确实可以与 QSAR 中使用的经典神经网络相媲美。虽然在一些数据集中，r2
    相对于随机森林的变化幅度可能很小。


    尽管推荐的参数对联合任务模式和单任务模式下的大多数数据集都有很好的预测，但这并不一定意味着推荐的参数对于任何特定的数据集都是计算效率最高的。例如，大多数单任务问题可以用两个隐藏层运行，使用更少的神经元（1000
    和 500），与推荐参数相比，预测 r2 的下降非常小，但计算时间节省了几倍。


    随机森林和深神经网都可以使用高性能计算技术高效地加快速度，但由于其算法的固有差异，它们可以以不同的方式加快速度。随机森林通过为每个节点提供一个树，可以使用集群上的粗并行化来加速。


    相反，深神经网可以有效地利用现代 GPU 的并行计算能力。随着 GPU 硬件的巨大进步和 GPU 计算资源可用性的增加，深神经网更易于实现，节省计算时间和硬件成本。这比传统的计算机集群更经济。在
    Python 中编程 GPU 计算几乎与传统的 Python 编程完全相同。


    默克结构化学实验室的研究表明，平均同时训练所有 15 个数据集的联合深神经网可以略微提高一些训练集较小的 QSAR 任务的预测能力。这 15 个数据集在几个方面之间有很大的不同，如所涉及的分子类型和
    QSAR 任务的目的。一般来说，对于其他 QSAR 方法，一次只处理一个数据集，化学家们理解嵌入在联合深神经网中的 QSAR 模型如何从其他不相关的 QSAR
    数据集借用信息。因此，需要进一步的研究来更好地了解深神经网是如何工作的。幸运的是，即使数据集被单独处理，深神经网仍然可以获得比随机森林更好的结果。


    在许多机器学习应用中，深神经网起了关键作用，通常会提高深神经网在 QSAR 任务中的预测能力。目前，人们还没有完整地解释为什么预训练会损害性能，尽管它可能与子结构描述符的属性有关。


    另一个未来的发展方向是，开发一种有效的策略来细化每个特定 QSAR 任务的深神经网的可调参数。为了最大限度地提高深神经网的性能，可能仍然需要自动微调每个数据集的深神经网参数。对于许多机器学习任务，这可以通过使用交叉验证方法的不同变体来实现。工业药物研发环境中的
    QSAR 任务，可以通过时间分割训练和测试集更好地模拟。在此场景下，交叉验证对某些数据集的算法参数的微调无效。在机器学习中使用的自动调整深神经网参数的方法，依赖于验证性能的准确程度。因此，需要开发出能够更好地表明深神经网在时间分割测试集中的预测能力的新方法。


    ## 3.4 ADMET 属性预测


    药物设计与开发，最理想的目标是实现高的生物活性和理想的安全性，为了达到这些目标，候选结构必须与主要靶点或靶标形成最佳的相互作用，并避免与非靶点不必要的相互作用。导致不期望的毒理事件。吸收（absorption）、分布（distribution）、代谢（metabo⁃lism）、排泄（excretion）和毒性（toxicity）对功效和安全性都有显着影响，它们通常缩写为
    ADMET。


    不平衡的 ADMET 特性，是候选药物晚期失败的常见原因，并可能导致已批准药物的停用。在药物发现过程中，尽早确定一种化合物的 ADMET 特性的重要性已经得到了广泛的认识。因此，计算模型的发展引起了制药公司和科研团体的极大兴趣，因为这种模型可以提供有价值的信息，以指导构建一个筛选库，以最大限度地减少此类问题。


