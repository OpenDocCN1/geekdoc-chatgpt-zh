    # 第 1 章 人工智能


    人工智能作为新一代数字技术的典型代表，逐渐从专业领域走向实际应用。在日常生活领域，人类围棋冠军被电脑击败，智能手机利用了面部识别算法，自动驾驶汽车在街道上行驶；在医学领域，食品和药物管理局已经允许临床医生在不同的医疗领域使用人工智能，如人工智能现在可以常规检测糖尿病视网膜病变，而不需要眼科医生来确认该算法的诊断结果。


    作为新一轮产业变革的核心驱动力，人工智能将催生新的技术、产品、产业、业态、模式，从而引发经济结构的重大变革，实现社会生产力的整体提升。当前，人工智能发展进入了新阶段，涉及数学、神经生理学、计算机科学、信息控制论、生物学、语言学、心理学等多门学科，是研究、开发用于模拟、延伸和扩展人的智能的理论、方法、技术及应用系统的一门新的交叉性、边缘性学科。人工智能的研究内容包括知识表示和知识图谱、自动推理、专家系统、群智能算法等，目标是使机器能完成一些原来只有人类才能完成的复杂性工作（图
    1-1）。


    ![](img/figure_0012_0001.jpg)


    图 1-1　人工智能产业链


    人工智能是一个总括术语，指计算机程序能够像人类一样思考和执行行为，而机器学习则超越了将数据与决策树、隐马尔可夫模型等算法一起输入机器的范畴，这有助于机器在不被明确编程的情况下进行学习。一些人将机器学习描述为主要的人工智能应用程序，而另一些人则描述为人工智能的一个子集。后来，随着神经网络的发展，机器可以像人脑一样对输入的数据进行分类和组织，这进一步促进了人工智能的进步。20
    世纪前后，出现了“深度学习”一词。深度学习是机器学习的子集，机器学习本身就是人工智能的子集，因此，它们之间的关系类似于人工智能＞机器学习＞深度学习。


    机器学习要么使用监督学习，其中模型被训练为使用标记数据，这意味着输入已经被相应的优选输出标签标记，要么使用无监督学习，在其中模型被培训为使用未标记数据，但从输入数据中寻找重复模式。另外还有使用监督和非监督学习相结合的半监督学习；自监督学习是一种特殊情况，它采用两步过程，即无监督学习为未标记的数据生成标签，其最终目标是建立监督学习模型；强化学习是一种机器学习，它在恒定反馈回路的帮助下随着时间的推移改进了算法。最后是深度学习，其中有许多层机器学习算法，被称为模仿人脑的受大脑启发的算法家族，但需要高计算能力才能进行训练和大数据分析。


    机器学习的起源可以追溯到 1943 年，当时 McCulloch 和 Pitts 发表了一篇题为《神经活动中固有思想的逻辑演算》的文章，他们在文章中给出了有史以来第一个神经网络的数学模型。Alan
    M.Turing 在 1950 年发表的开创性论文中对机器学习的概念进行了理论化。1952 年，Arthur L.Samuel 为 IBM 编写了一个棋盘游戏程序，推广了“机器学习”一词。1957
    年，Frank Rosenblatt 开发了用于图像识别的感知器。Henry J.Kelley 于 1960 年开发了连续反向传播模型，Stuart Dreyfus
    于 1962 年开发了一个仅基于链式规则的更简单版本。1965 年，Ivakhnenko 和 Lapa 开发了第一个可工作的深度学习网络。1980 年左右，福岛邦彦开发了一种名为新认知机的人工神经网络，该网络具有多层设计，可以帮助计算机学习如何识别视觉模式，他还开发了基于动物视觉皮层组织的卷积神经网络。


    ## 1.1　人工智能概述


    人工智能，最早由约翰·麦卡锡在 1956 年的达特茅斯会议上提出，用来描述“制造智能机器的科学和工程”。麦卡锡最初的描述今天仍然成立，但细节上有了丰富的扩展。简单地说，人工智能可以被看作是对计算的研究，它使感知、推理和行为预测成为可能。人工智能本身可以被用来执行各种任务，但另一种用途是利用人工智能算法来增强人类智能，而不是取代它，这个概念被称为增强智能。


    斯坦福大学的尼尔斯教授认为：“人工智能致力于使机器智能化，智能化是衡量实体在一定环境中反应和判断的定量值。”麻省理工学院的温斯顿教授认为：“人工智能是研究如何使计算机去做只有人类才能做的智能工作。”这些说法反映了人工智能学科的基本思想和基本内容，即人工智能是研究人类智能活动的规律，构造具有一定智能的机器系统，最终让计算机完成人类大脑才能胜任的工作。总地说来，人工智能是研究、开发用于模拟、延伸和扩展人的智能理论、方法、技术及应用系统的一门科学。


    人工智能的探索道路充满曲折和起伏，发展并非一凡风顺，经历了 20 世纪中期的人工智能浪潮期，也经历了 20 世纪七八十年代的沉寂期，最终在 21 世纪初迎来了发展黄金期。随着大数据、云计算、物联网等信息技术的发展，泛在感知数据和图形处理器等计算平台推动人工智能技术飞速发展，大幅跨越了科学与应用之间的鸿沟。人工智能自
    1956 年以来的发展历程，大至可以分为以下 6 个阶段（图 1-2）。


    ![](img/figure_0014_0002.jpg)


    图 1-2　人工智能的发展历程


    （1）起步发展期：1956—20 世纪 60 年代初。


    达特茅斯会议确立了人工智能这一术语，之后又陆续出现了如跳棋程序、感知神经网络软件和聊天软件等，并且人们用机器证明的办法去证明和推理一些定理，相继取得了一批令人瞩目的研究成果，掀起人工智能发展的第一个高潮。


    （2）反思发展期：20 世纪 60—70 年代初。


    人工智能发展初期的突破性进展大大提升了人们对人工智能的期望，人们开始尝试更具挑战性的任务，并提出了一些不切实际的研发目标。然而，接二连三的失败和预期目标的落空（例如，无法用机器证明两个连续函数之和还是连续函数，机器翻译闹出笑话等），使人工智能的发展走入低谷，人工智能进入第一次寒冬。


    （3）应用发展期：20 世纪 70 年代初—80 年代中期。


    20 世纪 70 年代出现的系统模拟人类专家的知识和经验解决特定领域的问题，实现了人工智能从理论研究走向实际应用、从一般推理策略探讨转向专门知识运用的重大突破。人工智能在医疗、化学、地质等领域取得的成功，推动人工智能进入应用发展的新高潮。


    （4）低迷发展期：20 世纪 80 年代中—90 年代中期。


    随着人工智能的应用规模不断扩大，专家系统存在的应用领域狭窄、缺乏常识性知识、知识获取困难、推理方法单一、缺乏分布式功能、难以与现有数据库兼容等问题逐渐暴露出来，人工智能进入第二次寒冬。


    （5）稳步发展期：20 世纪 90 年代—2010 年。


    网络技术特别是互联网技术的发展，加速了人工智能的创新研究，促使人工智能技术进一步走向实用化。1997 年，国际商业机器公司（IBM）“深蓝”超级计算机战胜了国际象棋世界冠军卡斯帕罗夫；2002
    年，iRobot 公司打造出全球首款家用自动扫地机器人；2006 年出现深度学习技术；2008 年 IBM 提出“智慧地球”的概念，与此同时，Siri、Alexa、Cortana
    等语音识别应用在智能手机上得到应用，以上都是这一时期的标志性事件。


    （6）蓬勃发展期：2010 年以来。


    随着大数据、云计算、互联网、物联网等信息技术的发展，泛在感知数据和图形处理器等计算平台推动以深度神经网络为代表的人工智能技术的飞速发展，大幅跨越了科学与应用之间的“技术鸿沟”，诸如图像分类、语音识别、知识问答、人机对弈、无人驾驶等人工智能技术实现了从“不能用、不好用”到“可以用”的技术突破。同时，这一轮人工智能发展的影响已经不局限于学界，政府、企业、非营利机构都开始拥抱人工智能技术。人们身处的第三次人工智能浪潮仅仅是一个开始，人工智能的高速发展将揭开一个新时代的帷幕，迎来爆发式增长的蓬勃发展期。


    作为一个多学科领域，人工智能涉及来自不同学科的知识，如计算机科学、数学、心理学、语言学、哲学、神经科学、人工心理学和许多其他领域。这些领域的知识和工程进步，帮助人工智能从纯理论研究发展到解决我们生活各个方面问题的智能系统。


    ## 1.2　机器学习


    从 20 世纪 50 年代提出机器学习，到今天多媒体、图形学、网络通信、软件工程乃至体系结构芯片设计，都能找到机器学习技术的身影。机器学习已经成为最重要的技术进步源泉之一。为了使读者对机器学习有一个初步的了解，本节将对机器学习的发展历程和相关基础概念、范畴进行说明，使读者对机器学习有一个基本的认识。


    人工智能的一个主要分支被称为机器学习（图 1-3）。机器学习可以被定义为一组能够从经验中学习和改进的算法，而无须为特定的任务进行显式的编程。这一特性使机器学习本质上不同与经典的计算方法。机器学习与其他类型的计算机编程的不同之处在于，它使用统计、数据驱动的规则将算法的输入转换为输出，这些规则是从大量示例中自动派生的，而不是由人类明确指定的（图
    1-4、图 1-5）。


    ![](img/figure_0016_0003.jpg)


    图 1-3　机器学习与相关学科


    ![](img/figure_0016_0004.jpg)


    图 1-4　机器学习与人类学习对比


    ![](img/figure_0016_0005.jpg)


    图 1-5　经典编程与机器学习模式


    机器学习算法的流行是随机森林、支持向量机、人工神经网络和深度学习的发展而来的。由于人工神经网络和深度学习在医药人工智能中占主导地位，本节将更详细地讨论它们。


    机器学习是人工智能发展到一定时期的必然产物。在 20 世纪 50—70 年代初，人工智能的研究处于“推理期”，那时的人们以为只要赋予机器逻辑推理能力，机器就能具有智能。然而随着研究的发展，人们逐渐认识到仅仅具有逻辑推理能力是无法实现人工智能的。E.A.Feigenbaum
    等人认为，要使机器学习具有人工智能，就必须设法使机器具有知识。在他们的倡导下，从 20 世纪 70 年代中期开始，人工智能的研究进入“知识期”。在这一时期，大量专家系统问世，在很多应用领域取得了大量的成果。但人们也意识到专家系统面临“知识工程瓶颈”，也就是说，人们把知识总结出来交给计算机是相当困难的。于是，一些学者想到让机器自己去学习知识。

    '
