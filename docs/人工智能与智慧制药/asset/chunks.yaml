    ## CYP450酶在药物代谢中的作用


    `CYP1`、`CYP2`、`CYP3`家族约占总肝`P450`含量的70%，并负责大多数药物的代谢。根据它们在肝脏的表达，`CYP3A`约占总肝`P450`的30%，`CYP2`约占20%，`CYP1A2`占13%，`CYP2E1`占7%，`CYP2A6`占4%，`CYP2D6`占2%。在大量的组织内，包括小肠、胰、脑、肺、肾上腺、肾、骨髓、肥大细胞、皮肤、卵巢及睾丸均发现有其他的肝细胞色素`P450`。


    已清楚药物的肝外代谢对体内药物总的降解起一定的作用。其中胃肠道内的生物转化是非常重要的，因为它可降低口服药物的生物利用度。遗传多态性、酶抑制、酶诱导及生理因素均可引起细胞色素`P450`活性的改变。这有一定的临床含意，因为这会引起药物药代动力学的改变，导致药物效能改变，如因代谢减少或毒性代谢物生成增多而增加药物毒性，以及导致药物的相互作用。


    `CYP450`酶是临床前药物代谢研究的重要对象，涉及药物代谢的`CYP450`主要为`CYP1`、`CYP2`、`CPY3`家族中的7种重要的亚型，其中，在`CYP1`家族中存在`CYP1A1`、`CYP1A2`、`CYP1B1`
    3种亚型。`CYP2`家族是`CYP450`酶系中最大的家族，包括`CYP2A`、`CYP2B`、`CYP2C`、`CYP2D`、`CYP2E`亚家族，其中`CYP2C9`、`CYP2C19`、`CYP2D6`、`CYP2E1`是其中主要的亚型，而对于`CYP2A`、`CYP2B`研究较少。`CYP3`包括`CYP3A3`、`CYP3A4`、`CYP3A5`及`CYP3A7`共4种基因亚型，约占肝内`CYP450`总量的28.8%，是参与口服药物首过效应的重要酶系，研究主要集中在`CYP3A1`、`CYP3A4`亚型。


    ## 基因检测


    近年来，随着基因检测技术发展，为了能更好地了解患者用药后的效果，人们采用基因检测技术分析和预测标志物基因。基因检测技术是个体化用药的一个方向和手段，基于个体差异定制个性化治疗方案，可实现药物治疗最佳效果。


    常见的基因检测技术主要有全基因组测序、重组荧光免疫分析、聚合酶链式反应、基因扩增技术、定点突变和基因表达分析等。全基因组测序（`Whole Genome Sequencing`,
    `WGS`）是一种新型的高通量、高灵敏度检测技术，可以扩展识别每一条染色体上的基因及其不同变体，也同时包括对保守普遍存在的DNA序列（如同源基因簇）重复序列（中心、变异类型等）进行识别。重组荧光免疫分析（`Multiplex
    Fluorescence Immunoassay`, `MFI`）是一种基因芯片技术，联用荧光定量技术，通过特定的抗体模板进行靶向检测，可在一份样品中同时检测出多个基因片段，用于筛查、诊断及预防各种遗传性疾病。聚合酶链式反应（`Polymerase
    Chain Reaction`, `PCR`）可以模拟生物体在分子水平上进行基因复制，配合荧光探针或DNA杂交，以增强基因特异性标记及定量，以用于基因表达、定点突变检测、等位基因的判定等。`PCR`多用于基因或全基因组定点突变检测，以及用于无水合成DNA、增广和基因重组等。基因扩增技术（`Polymerase
    Chain Reaction Amplification`, `PCRA`）是一种常用的计算机大规模基因扩增检测技术，通过专用扩增模式，克隆指定基因长度中包含单一序列的DNA链段，一般用于检测生物样本中特征基因或某一基因序列及其变异。下面对全基因组测序的高通量技术重点介绍。


    高通量测序技术是对传统测序一次革命性的改变，它一次对几十万到几百万条DNA分子进行序列测定，使对一个物种的转录组和基因组进行细致全貌的分析成为可能，所以又被称为深度测序（`deep
    sequencing`）。现在仍有大量先进平台被研发，它们共同的特点是极高的测序通量，相对于传统测序的96道毛细管测序，高通量测序一次实验可以读取40万～400万条序列。读取长度根据平台不同为25～450bp，不同的测序平台在一次实验中，可以读取1～14G不等的碱基数，这样庞大的测序能力是传统测序仪所不能比拟的。高通量测序技术已在全基因组mRNA表达谱、microRNA表达谱、`ChIP-chip`以及DNA甲基化等方面应用。2008年Mortazavi等人对小鼠的大脑、肝脏和骨骼肌进行了RNA深度测序，这项工作展示了深度测序在转录组研究上的两大进展，即表达计数和序列分析。高通量测序另一个被广泛应用的领域是小分子RNA或非编码RNA（`ncRNA`）研究。测序方法能轻易的解决芯片技术在检测小分子时遇到的技术难题（短序列、高度同源），而且小分子RNA的短序列正好配合了高通量测序的长度，使数据“不浪费”，同时测序方法还能在实验中发现新的小分子RNA。


    ## 6.3 人工智能算法及生物软件


    ### (1) 模拟退火


    模拟退火算法（`Simulated Annealing`, `SA`）最早的思想是由N.Metropolis等人于1953年提出。1983年S.Kirkpatrick等成功地将退火思想引入组合优化领域。它是基于`Monte-Carlo`迭代求解策略的一种随机寻优算法，其出发点是基于物理中固体物质的退火过程与一般组合优化问题之间的相似性。模拟退火算法从某一较高初温出发，伴随温度参数的不断下降，结合概率突跳特性在解空间中随机寻找目标函数的全局最优解，即在局部最优解能概率性地跳出并最终趋于全局最优。模拟退火算法是一种通用的优化算法，理论上算法具有概率的全局优化性能，目前已在工程中得到了广泛应用，诸如`VLSI`、生产调度、控制工程、机器学习、神经网络、信号处理等领域。


    模拟退火算法来源于固体退火原理，是一种基于概率的算法。固体退火即将固体加温至充分高，再让其徐徐冷却，加温时，固体内部粒子随温升变为无序状，内能增大，而徐徐冷却时粒子渐趋有序，在每个温度都达到平衡态，最后在常温时达到基态，内能减为最小。模拟退火算法是通过赋予搜索过程一种时变且最终趋于零的概率突跳性，从而可有效避免陷入局部极小并最终趋于全局最优的串行结构的优化算法。


    模拟退火算法过程如下：


    1）随机挑选一个单元`K`，并给它一个随机的唯一，求出系统因此产生的能量变化`ΔEK`。


    2）若`ΔEK`≤0，该位移可采纳，而变化后系统状态可作为下次变化的起点。


    若`ΔEK`＞0，若位移后的状态可采纳的概率见式（6-1）。


    ![](Images/figure_0136_0029.jpg)


    式中，`T`为温度，然后从（0，1）区间均匀分布的随机数中挑选一个数`R`，若`R`＜`PK`，则变化后的状态作为下次的起点；否则，将变化前的状态作为下次的起点。


    3）转第（1）步继续执行，直到达到平衡状态为止。


    ### (2) 线性规划


    线性规划法`Linear Programming`（`LP`问题）就是在线性等式或不等式的约束条件下，求解线性目标函数的最大值或最小值的方法。其中目标函数是决策者要求达到目标的数学表达式，用一个极大或极小值表示。约束条件是指实现目标的能力资源和内部条件的限制因素，用一组等式或不等式来表示。目标函数和约束条件均为线性函数，故称为线性规划问题。


    s. t.约束条件，线性规划模型一般表达式写成式（6-2）、式（6-3）。


    ![](Images/figure_0136_0030.jpg)


    其中，`c`和`x`为n维列向量，`A`、`Aeq`为适当维数的矩阵，`b`、`beq`为适当维数的列向量。


    一般线性规划问题（数学）标准型为见式（6-4）、式（6-5）。


    ![](Images/figure_0136_0031.jpg)


    可行解：满足约束条件的解。


    最优解：使目标函数达到最大值的可行解为最优解。


    最优域：所有可行解构成的集合成为问题的可行域。


    ### (3) 基因模块识别软件


    为了识别利福平相关功能模块，我们采用基于模拟退火和线性规划算法的两个软件`jActiveModules`和`BioNet`。


    `BioNet`是基于线性规划算法的功能模块提取方法，它是一个`bioconductor`的软件包，基于测序数据的基因表达水平进行网络功能分析。


    `jActiveModules`软件是`cytoscape`的一个插件，用于识别功能模块。`jActiveModules`是采用模拟退火算法的功能子网提取方法，它的特点是可以设置搜索深度、网络结点重复率和选取的模块数量。


    ### (4) DAVID


    生物分析工具`DAVID`（`Database for Annotation, Visualization, and Integrated Discovery`）提供了大量基因的生物功能注释，我们主要采用其中的`GO`（`Gene
    Ontology`）和`KEGG`（`Kyoto Encyclopedia of Genes and Genomes`）两个资源。`GO`分析能找出在统计上显著富集的功能分类，包含分子功能（`Molecular
    Function`）、生物过程（`biological process`）和细胞组成（`cellular component`）三个部分。


    ## 6.4 基因诱导的药物基因识别


    miRNA通过调控蛋白质功能实现自身功能，蛋白质具有很多功能，比如组成并修护生物体、对生物体的调节机能、作为运输载体和能量供给等。蛋白质网络包含了蛋白质之间、蛋白质与DNA之间和蛋白质与RNA之间的物理互作、调节作用、遗传互作以及功能关联等关系。蛋白质互作能够改变蛋白质的功能，直接发生相互作用的蛋白质可能组成复合体参与同一生物过程或实现某一个特定功能。因为蛋白质网络包括了人体全部已知的蛋白互作，而基因表达谱代表了特定条件下特定细胞或组织表达种类和丰度信息，是RNA层面上特定条件下分子变化水平，所以将基因表达谱和蛋白质网络整合在一起，能够超越单一RNA水平，即在蛋白质组和基因组整体水平上，对复杂生物过程机制进一步挖掘。比如Zhang等人解析了冠心病相关关键基因和模块，发现两个关键基因与冠心病发展密切相关；Lin等人研究扩张型心肌病相关的动态功能模块和共表达蛋白质相互作用网络。上述研究表明，整合蛋白质互作用网络和基因表达谱有助于识别生物通路相关的功能模块和关键基因。目前对miRNA调控的蛋白质网络得到了广泛研究，但是部分研究只建立在miRNA和靶基因网络研究，没有结合资源丰富的蛋白质网络；还有一部分研究结合了蛋白质网络资源，但是只针对某一特定条件下miRNA调控网络研究，比如针对某一疾病或某一药物作用下的miRNA调控网络研究。而且，在研究miRNA调控蛋白质网络过程中，靶基因的预测假阳性高，导致构建的miRNA调控网络庞大，不利于功能分析，且假阳性影响功能预测准确率。


    利福平是一种有效的抗菌药物，自从1960年问世以来被广泛用于治疗肺结核和其他传染疾病，临床上用于减轻药效或增加药物性能。研究表明，利福平诱导miRNA表达量的改变来调控药物代谢酶、转运蛋白，比如，利福平改变药物代谢酶P450（`cytochrome
    P450 enzymes`, `CYPs`）和miRNA，重要的是研究表明，大量的药物代谢酶是这些miRNA调控的靶基因，例如`miR-27b`靶向`CYP1B1`；体外研究表明，`miR-148a`靶向`pregnane
    X receptor`（`PXR`），而`PXR`是一种重要的P450基因表达的调控因子，并且持续下调`CYP3A4`药物代谢酶的表达；多miRNA靶向肝细胞核因子1（`hepatic
    nuclear factor 4α`，`HNF4A`），而`HNF4A`是一种主要的多药物处置基因调控因子。虽然针对利福平作用于肝脏中调控药物代谢酶、转运蛋白和miRNA机制已经得到研究，但是都是从单一方面进行的，从全局上来说整合多组学、多资源的方式系统地研究利福平作用于肝脏后行使功能的关键基因和miRNA功能的研究还很少。


    针对上述问题，人们设计了一套整合蛋白质网络疾病和药物相关生物标志物挖掘方法，该方法整合基因组和蛋白质组学，提出基于蛋白质网络的标志物挖掘方法研究，在对疾病和药物作用相关研究中，有助于发现重要生物通路和相关分子机制研究，能够广泛地应用于药物作用后以miRNA和基因为主分子标志物的挖掘。另外，本节采用基于模拟退火和线性规划两种方法的miRNA调控蛋白质网络的功能模块识别方法，进而结合了基因表达谱基因水平变化数据，来减少了miRNA在基因预测中假阳性高对功能分析的影响，有助于发现疾病和药物作用后miRNA调控的重要功能模块挖掘。本方法应用于利福平药物作用后人体肝脏相关miRNA和基因研究，能够识别一些列重要miRNA和基因等分子标志物和重要生物通路，为利福平作用后人体肝脏分子机制研究作出重要探索性研究。


    ### (1) 数据和方法


    数据集主要包括四部分数据：基因表达谱数据、miRNA表达谱数据、蛋白质互作用网络、人类肝脏蛋白质网络。


    数据一和数据二均来自于人类肝脏组织。肝脏组织来自七个捐献者，每一个经过生物复制，所有体外研究都控制在肝脏组织分离后72～120h，肝脏组织经过24h的利福平（10um）处理，同时配以0.01%的甲醇。基因表达谱数据包括12780个基因的表达水平。miRNA表达谱数据包括334个miRNA的表达水平。基因表达谱的数据处理采用标准过程：`EZBead`准备、下一代基因测序、基因短序列评估、序列比对。miRNA表达谱数据获取采用实时荧光定量PCR分析系统（`Taqman
    OpenArray`）完成。本文中使用的完整的`RNA-seq`数据可以从`GEO`数据库下载，号码：`GSE79933`；完整的miRNA OpenArray数据下载地址为`http://compbio.iupui.edu/group/6/pages/rifampin`。


    数据三，即蛋白质互作用网络下载自人类蛋白质参考数据库（`Human Protein Reference Database`, `HPRD`）。`HPRD`描述信息对人类蛋白质功能包括蛋白质-蛋白质之间的关系、转录后修饰、酶和酶作用物关系和疾病的关联。蛋白质注释信息从人工搜集的生物学家和专家对蛋白质序列生物分析发表的论文中获取。`HPRD`已经收集了超过38000条高可信度的人类蛋白质交互数据，`HPRD`构建的人类蛋白质相互作用网络来自实验验证的蛋白质交互和亚细胞定位数据。


    数据四为人类肝脏蛋白质相互作用网络（`human liver protein interaction network`, `HLPN`），包含人类肝脏相关的蛋白质组相互作用映射。该网络包含了维护肝脏功能的关键所在，富集丰富的代谢酶和肝脏特异性、肝脏表型和肝病包含的2582个蛋白质和3484个它们之间涉及人类肝脏相关的系统生物学、疾病研究和药物发现等领域的相互作用关联关系。


    #### 1）整合多组学的miRNA功能识别方法


    整合多组学的miRNA功能识别方法原理如图6-4所示。


    ![](Images/figure_0139_0032.jpg)


    图6-4　整合多组学miRNA功能识别方法


    为了挖掘miRNA的功能，我们提出了`miRFun omi`方法，它是建立在蛋白质网络、基因表达数据和miRNA表达数据基础上的，该方法的大体流程归纳为：


    第一步，通过基因表达谱分析差异表达基因。这里我们采用正常组织和特殊状态组织进行t检验。t检验是较常用的统计方法，设某一基因正常条件下和特定条件下表达水平均值为![](Images/figure_0139_0033.jpg)和![](Images/figure_0139_0034.jpg)，`n1`和`n2`为两种条件下样本的数量，`σ2x1`和`σ2x2`为两个样本的方差，则t值的计算见式（6-6）。


    ![](Images/figure_0139_0035.jpg)


    根据t值计算`P`值，然后设定阈值，选定差异表达基因。


    第二步，构建特殊状态下的蛋白质网络｡设差异表达基因`Sgene`={g1，g2，……，gi}，i为差异表达基因个数；蛋白质互作用网定义为`G`=（`V`,
    `E`），`V`为结点，`E`为相互作用关系，定义为结点蛋白质`V`={v1，v2，……，vi}，i为蛋白质结点个数；`E`={e1，e2，……et}，t为蛋白质网络相互作用关系数，则特定状态相关蛋白质互作网络为`GS`=（`VS`，`ES`）结点和相互作用关系定义见式（6-7）､式（6-8）｡


    ![](Images/figure_0140_0036.jpg)


    第三步，特定状态下蛋白质网络的功能模块提取。我们构建的特殊状态下相关蛋白质网络需要考察的基因比较多，更重要的是，这些基因之间的相互关系也需要考察。功能模块是指在特定条件和正常条件下，蛋白质网络中总体表达量显著差异的子网，且子网内的蛋白质结点在网络中密切连接。这些功能模块整合了基因表达量水平和蛋白质相互作用信息，在系统分析生命过程中，能够发现发生明显变化的关键通路。这一部分我们尝试了两种算法，分别为采用模拟退火算法和线性规划算法的功能模块识别，定义基于功能模块的差异表达分数见式（6-9）。


    ![](Images/figure_0140_0037.jpg)


    第四步，功能模块的富集分析。对功能模块中的基因进行功能富集分析，通过借助生物信息已知数据和分析工具，采用统计分析方法，挖掘相同分子谱数据具有显著相关的生物功能及参与生物通路。


    第五步，通过miRNA表达谱分析差异表达miRNA。这里我们同样采用正常组织和特殊状态组织进行t检验。对差异表达miRNA进行靶基因预测，采用阈值设置和多靶基因预测软件结果取交集的方法降低预测结果的假阳性问题。


    第六步，构建miRNA调控的特定状态蛋白质网络（`miRNA-regulated-PIN`）`Gmir-PIN`=（`Vmir-PIN`，`Emir-PIN`）。设miRNA靶基因为`Gtarget`，则`miRNA-regulated-PIN`的网络结点定义见式（6-10）。


    ![](Images/figure_0140_0038.jpg)


    `miRNA-regulated-PIN`的网络结点定义见式（6-11）。


    ![](Images/figure_0140_0039.jpg)


    第七步，通过对`miRNA-regulated-PIN`的结点基因进行功能富集分析，进一步识别miRNA的相关功能。


    #### 2）利福平作用于肝脏miRNA功能分析


    基于`miRFun_omi`方法的利福平作用于肝脏miRNA功能分析流程见图6-5。


    ![](Images/figure_0141_0040.jpg)


    图6-5　基于miRFun omi方法的利福平作用于肝脏miRNA功能分析流程


    #### 3）构建利福平相关的蛋白质互作网络


    首先，设蛋白质互作网络1（`HPRD`）`GHPRD`=（`VHPRD`，`EHPRD`）和人类肝脏蛋白质网络2（`HLPN`）`GHLPN`=（`VHLPN`，`EHLPN`），人类蛋白质互作网络`GHPIN`=（`VHPIN`，`EHPIN`）定义见式（6-12）、式（6-13）。


