- raw: '![](Images/figure_0057_0018.jpg)


    图3-1　药物研发耗时及资金投入


    药物发现过程主要包括靶分子的确定和选择、苗头化合物的筛选，先导化合物的发现以及先导化合物的优化，经过这几个过程后就可以得到临床前候选化合物，这是新药研究中的重要节点。


    临床前研究：临床前研究主要包括药物的制备方法以及药物有效性和安全性的初步评价，工业化制备及工艺研究是新药研发的重要内容，以实现药品的稳定以及大批量的制备为目标，以期满足后续的临床前和临床研究使用，也为后续新药的工业化生产奠定基础。临床前的药物评价主要包括药效学和药代动力学、安全性和药物毒理学评价，临床前研究主要是确认药物的安全性和生物活性，并为后续的临床试验研究提供依据。


    ![](Images/figure_0058_0019.jpg)


    图3-2　药物研发基本流程


    临床研究：通常临床研究可分为Ⅰ—Ⅲ，Ⅰ期临床研究主要针对药物的安全性、耐受性和体内药代动力学性质开展，通常是在健康志愿者身上进行实验，受试者人数要求20～30例。Ⅱ期临床试验主要评价药物的治疗效果和安全性，需要在患者身上开展，受试者人数要求100～300例左右，通过与对照药物对比，了解受试药物的治疗价值和安全性，确定新药的适应症以及最佳的用药方案。Ⅲ期临床试验通过随机、双盲对照试验，进行更大规模、较长时间的临床试验，受试者均为适应症患者，人数要求大于300例，确定药物的疗效并监测可能出现的副作用。


    药物上市：完成上述研究后就可以递交新药上市申请，获批准后即可上市销售。药品上市后仍需要对其长期的安全性和有效性进行监测，即上市后研究或称为Ⅳ期临床试验。


    人工智能技术在药物研究方面的应用，能够回答药物化学家和生物学家两个关键的问题：“下一个化合物应该是什么”和“这个新结构的成药性怎么样”。


    在过去的20年里，出现了许多用于计算药物发现、定量构效关系（QSAR）方法和自由能最小化技术的技术和工具。例如，使用机器智能方法区分复合细胞活性，如决策树、随机森林方法、卷积神经网络、支持向量机、长短期记忆网络和梯度增强机。在上述模型中，化合物通过简化的分子输入行输入系统表示为字符串，并直接用作输入数据，而不是任何化学描述符，并充当自然语言处理。对单个数据集（z分数=3）和整个数据集（z分数=5或6）使用两种不同的截距，再引入多种不同的指标，用于评估模型的精度、准确性、曲线下面积，验证该梯度提升机能够实现数据的均衡分布。


    传统的以化学为导向的药物发现和开发概念与计算药物设计相结合，提供了一个伟大的未来研究平台。此外，世界各地的系统生物学和化学科学家与计算科学家合作，开发现代机器学习算法和原理，以加强药物的发现和开发。


    经典的机器学习方法和深度学习方法可以对复合细胞活性进行分类。类似地，使用双构效关系方法可以预测有效渗透率，使用偏最小二乘（PLS）方案和分层支持向量机方案可以开发经典的构效关系模型和基于机器学习的构效关系模式。在训练集、测试集和统计分析方面，分层支持向量机方案比偏最小二乘方案执行得更好。此外，对于新化合物的合成，化学科学家很容易依赖已发表的文献。


    ## 3.2　理化性质和生物活性的预测


    每种化合物都与溶解度、分配系数、电离度、渗透系数等物理化学性质有关，这些参数会影响化合物的药代动力学性质，以及药物与靶点结合效率。因此，在设计新型药物分子时，必须考虑上面提到的化合物的物理化学性质。为此，已经出现了不同的基于人工智能的工具来预测化合物的物理化学性质。为预测化合物的生物物理和生物化学性质而开发的基于人工智能的工具包括分子指纹、SMILES格式、库仑矩阵和势能测量，这些工具可用于深度神经网络训练阶段。可以说，基于人工智能的方法通过预测物理化学性质在药物发现和开发中发挥着重要作用。


    药物分子的治疗活性，取决于其与受体或靶标的结合效率，不能显示出与药物靶标结合能力的化学分子将不被视为具有成药性。因此，预测化学分子与治疗靶点的结合性质对药物的发现和开发至关重要。人工智能算法的最新进展增强了结合一致性预测的过程，该过程利用了药物及其相关靶标的相似性特征。现已出现了多种基于网络的工具，如Chem⁃Mapper和相似性集成方法。


    自20世纪60年代以来，药物化学以各种形式将人工智能应用于设计化合物，并取得了不同程度的成功。监督学习被广泛应用，其使用标记的训练数据集来训练模型。一个例子是定量结构-活性关系（QSAR）方法，该方法被广泛用于预测给定化学结构的性质，如LogP、溶解度和生物活性。而不依赖标签的无监督学习在药物化学中也很流行，分层聚类、算法和主成分分析等例子被广泛用于分析大型分子库，并将其分解为类似化合物的较小集合。


    将人工智能和机器学习方法，应用于药物发现的最终目标是：找到最突出的药物，以满足医疗需求。特别是对于药物发现和药物化学，这涉及识别药物靶点、识别先导化合物、针对感兴趣的多种性质优化其设计以及识别实现物质组成的合成路线。


    人工智能通常被视为一个神奇的按钮，可以随意按下以产生完美的输出，通常与输入无关。人工智能的挑战是从一个根据猫的图像训练的模型中设计出一只猫的完美图像，或是一辆能够在不犯任何错误的情况下自行驾驶的汽车，或是一种可以安全有效地治疗疾病的药物。虽然人工智能并不是所有挑战的答案，但它是一种有用的工具，如果使用得当，可以帮助增强当前的理解并推动新的发现。在药物化学和药物发现中，最好的人工智能不一定是能够自主设计新药的单个人工智能，而是一个或多个不同的人工智能，在药物发现过程中，从靶标选择、命中识别、线索优化到临床前研究和临床试验，这些人工智能能够更好地理解和设计新的输入。


    （1）物理化学性质预测。


    在药物发现中，临床候选分子必须满足一系列不同的标准。除了生物靶标的正确效力外，该化合物还应具有相当高的选择性，以对抗不希望的靶标，并表现出良好的物理化学和ADMET特性（吸收、分布、代谢、排泄和毒性特性）。因此，复合优化是一个多维的挑战。在优化过程中应用了大量的计算预测方法，以实现有效的化合物设计。一些机器学习技术已经被成功地使用，例如支持向量机（SVM）、随机森林（RF）或贝叶斯学习。


    机器学习用于属性预测，一个重要方面是访问大型数据集，这是应用人工智能的先决条件。在制药工业中，化合物优化过程中收集了大量不同性质的数据集。这些针对目标和反目标的大型数据集，可用于不同的化学系列，并系统地用于训练机器学习模型，以推动化合物优化。在药物研究中，新型人工智能技术受到了广泛的关注，因为深度学习体系结构在性质预测方面表现出了优异的结果。与基线机器学习方法相比，深度神经网络显示出更好的预测性。与此同时，人工智能在早期药物发现中的应用范围已经扩大，例如化合物和多肽的从头设计，以及合成规划。


    有大量不受专利权限制的数据集，可用于衍生机器学习模型，以预测跨目标活动。这些模型可应用于药物设计，即现有药物新靶点的识别。例如，在Kaggle竞争中，深度神经网络已被用于许多属性预测问题。深度神经网络属于人工神经网络，是一种大脑启发系统。含多个节点，也被称为神经元，就像大脑中的神经元一样相互连接。来自不同节点的信号被转换并级联到下一层的神经元，输入层和输出层之间的图层称为隐藏层。在神经网络的训练过程中，会调整不同节点的权重和偏差。


    深度神经网络使用的隐藏层和节点数量明显大于浅层架构。因此，在神经网络的训练过程中，必须拟合大量的参数，以提高计算能力并改进一些算法，解决过拟合问题。使用卷积神经网络进行属性预测，包括ADMET性能和物理化学参数，显示出较好的性能。其中，定义一个合理的参数集是实现良好性能的关键。


    （2）亲脂性预测。


    亲脂性作为药物发现工作中最重要的物理化学性质之一，在调节许多关键的药代动力学过程中起着至关重要的作用。具体来说，它影响药物分子的膜通透性，从而影响药物的转运、分布和清除行为。它还强烈影响药物分子与大分子的结合，影响代谢和毒性过程，以及几乎任何其他药物诱导的体内生物过程。定量表征亲脂性的金标准是辛醇-水分配系数（log
    P）或pH相关分布系数（log D）的对数，替代方法包括脂质体/水分配比和固定化人工膜色谱。


    传统的预测亲脂性的计算方法，包括色谱方法量子化学驱动方法，如真实溶剂的导体样筛选模型、个分子模拟和线性/非线性QSPR。相比上面介绍的方法，科研人员越来越普遍地采用人工智能方法，将log
    P或log D与分子描述符集联系起来。常用的分子描述符包括原子电荷、氢键效应、分子体积和表面积等。


    神经网络已被用于预测辛醇-水分配系数，例如ADMET预测器。基于结合前馈网络和k近邻算的联想神经网络的ALOGPS程序已被证明能够可靠地预测低分子量化合物的log
    P。两种类型的描述符通常被用来构建预测模型、结构片段和数字索引，通常使用遗传方法从中选择有用的子集。


    现有模型的分子量范围有限，且可能与所选描述符捕获的性质无关，因此要求通过包含更具物理意义的表示来改进log P预测。基于辛醇-水的人工智能方法，作为参考系统，可以可靠地预测各种不同数据集的log
    P或log D，从而选择最有前途的化合物进行初始研究。预测log P或log D的主要困难与水溶度有关。基于人工智能的方法，在准确性和效率上各不相同，但都是在实验数据上训练的，这可能会限制其他基于物理的方法，如真实溶剂的筛选模型或分子模拟。


    （3）透膜能力预测。


    体外膜通透性数据的评估，对于药物发现和开发工作至关重要，因为在大多数药物相关生物过程中，分子通过被动跨膜扩散和主动转运机制穿过生物膜。科学家们已经花费了大量的努力，开发精确预测小分子膜渗透行为的计算模型。为此，许多人工智能辅助的预测因子已经接受了不同化学类别及其相关实验渗透率数据的训练。这些数据已通过多种体外渗透性试验验证，包括平行人工膜渗透性试验、人结肠腺癌细胞系和其他基于细胞的试验。


    人工膜渗透性试验越来越多地用于药物发现过程，以评估化合物的膜通透性。在收集初始数据集时需要特别小心，须将所有已知的外排转运体底物排除在训练集中。应用计算模型预测渗透率，可能会大大加速发现过程，但须仔细分析观察到的计算值和体内值之间的差异。


    机器学习模型使用其内部的AutoQSAR系统，将Caco-2细胞的内在通透性与分子结构联系起来。由于预测模型的性能，可能会因特定的项目而有所不同，出了一个“渗透性决策树”，通过将预测的渗透性与亲脂性和分子量相结合，来帮助指导项目设计。内在渗透性也很容易使用AutoQSAR进行评估。AutoQSAR是一种基于细胞的方法，具有几个优点，包括成本低、良好的时间有效性、对更宽的pH范围的耐受性和更高的DMSO含量，以及易于高通量筛选。


    当建立预测AutoQSAR渗透性的模型时，有一个相对较大的渗透率数据集，其中包括超过5435个满足结构多样性的化合物条目。收集数据集时必须小心，除非在模型训练过程中整合了条件信息，否则只能收集一致条件下的渗透率数据测量值。同时，应考虑细胞系中表达的不同转运蛋白的影响，以及对不同复合文库的需求。


    最近的文献报道了机器学习方法在预测内在渗透率方面的巨大潜力。这些研究清楚地表明，基于机器学习方法的模型可以用于药物开发的早期阶段，以高度的置信度筛选出渗透性差的化合物，并将合成工作集中在具有最佳渗透性潜力的化学空间区域。


    （4）水溶性预测。


    足够的水溶性对于口服药物至关重要，因为它们必须在从胃肠道吸收之前首先溶解在胃肠道液中。多年来，许多计算方法被提出来预测水溶度，根据其基本原理分为三类：量子化学方法、分子力学模拟，以及建立在统计学或机器学习算法中的描述符方法。


    水溶度的预测，通常基于四个主要的描述符，包括相关物理化学性质、原子或基团贡献、量子化学性质和结构信息。更具体地说，基于物理化学性质的描述符与可以通过实验测量，或从计算方法中获得的log
    P和熔点值有关。一般溶解度方程法，及其扩展改进的方法，是从log P和熔点出发评估水溶性。虽然这种方法产生了很好的结果，但它将预测水溶度的问题替换为测量或预测log
    P和熔点值，增加了复杂性。它使用原子或基团贡献描述符的方法，以捕获分子中原子或基团的存在，并通过与可用的实验数据的相关性来估计每个原子对水溶性的贡献。


    基于结构的方法可根据化学结构信息，如分子拓扑、连接性或碎片信息等，预测一个物质的溶解度。除了分子大小这一可追溯到Fuhner工作的关键特征外，多年来还发现了与溶解度有关的其他分子特征，包括氢键数和多种分子连接性指数。分子结构的各个方面已经用多种方式来表示，典型的选择是二元指纹，它在简单性和预测能力之间提供了良好的折衷。


    用于预测水溶解度的指纹示例包括扩展连接性指纹（对两个化学键直径内的每个原子及其分子环境进行编码）和神经指纹（直接从任意大小和形状的分子图生成）。一些深层结构和深层学习方法也被用于预测类药物分子的水溶性，如无向图递归神经网络（UG
    RNNs）和基于图像的卷积神经网络。


    这些方法侧重于学习有关本地环境的特定信息，目的是构建特定于任务的内部表示。前一种方法，通过枚举分子的有向无环图表示，来学习描述符表示。后一种方法，通过对分子图进行卷积，来构建一种特定于任务的指纹图谱，与其他溶解度任务以及辛醇溶解度和熔点任务方法相比，该方法表现出显著的改进。在这些情况下，可用于模型构建和测试的分子相对较少。


    虽然许多信息性描述符已经被设计并纳入到人工智能预测器的构建中，但似乎没有一个能够完美地、准确地预测溶解度。对于不同方法的预测因子的质量评估发现，包括多元线性回归、人工神经网络和类别形成，没有一个能完美地预测溶解度，尽管多元线性回归比其他更复杂的方法表现更好，且它的过拟合的概率较低。


    除了对该性质的内在复杂性认识不足外，当前模型预测能力有限的另一个经常被引用的原因是文献中从多个来源收集的溶解度数据的噪声，实验数据中的估计均方根误差（RMSE）范围为0.6～0.7溶解度。然而，最近的一项研究表明，实验数据的质量并不是预测类药物分子水溶性的过度限制因素。作为一个比较，当使用一个噪声大得多的数据集时，该数据集是从已发表文献中的几个不同来源中提取的，其值为0.6～0.7溶解度单位。


    与人们预期相反，从CheqSol实验数据中得出的模型并不比从公布数据中得出的模型更准确。可见，虽然水溶度是小分子药物和候选药物的一种重要的物理化学性质，但要准确预测仍然十分困难。每种预测方法，都有自己的优点和局限性，最佳选择仍然很大程度上取决于个人需求。对于高通量分子筛选，高效的人工智能方法代表了一种合适和足够可靠的方法，以拓宽细化大集合。然而，当需要对一些特定药物分子的基本原理，进行特定的物理和机制理解时，研究人员通常倾向于使用基于量子力学或分子力学等更有物理意义的方法。


    （5）药物与靶标共晶型预测。


    药物分子以许多不同的方式出现，可能覆盖各种晶体形式，从多态性和水合物到更复杂的多组分晶体。在后者中，靶标和辅助化合物之间形成新的分子间相互作用，被证明是修饰靶化合物的物理化学特性的一个很好的工具，如溶解度、生物利用度、密度和熔点等。


    因此，多组分晶体可应用于各个领域，并在药物的有效配方中发挥着关键作用。共晶体具有改变分子的物理化学性质的潜力，科研工作者对共晶体合成的设计热情高涨。然而，当寻找足够的分子组合来形成共晶体时，就出现了困难，阻碍了对目标晶型的有效探索。


    多组分晶体的预测困难重重，新的形式经常面对多次错误识别。与成盐类不同，质子转移导致强离子作用，溶剂酸盐和共晶体是通过较弱的非共价相互作用组装的。这种官能团之间的分子间相互作用，经常被用来合理化可能的聚集，但不能保证假定的相互作用会出现。


    多态性盐和溶剂盐，通常使用自动高通量系统进行筛选，但共晶体的实验筛选仍然耗时耗力，而且失败率极高。为了缩短这一过程，现已有多种计算工具，如基于氢键、分子描述符的统计分析建模、静电势图、晶体结构预测、分子动力学或像素计算等计算工具，以帮助发现成分或共构体的充分组合。


    ## 3.3　定量结构-活性关系预测（QSAR）


    （1）QSAR建模。


    在药物设计和发现中，探究化学结构及其理化性质与生物活性之间的关系至关重要。QSAR/QSPR建模自50多年前成立以来，已经取得了长足的进步。生物活性和药物动力学参数的成功预测，包括吸收、分布、代谢、排泄和毒性等，证明这些计算模型对药物发现的促进是不可否认的。对于基于配体的QSAR/QSPR建模，分子的结构特征（如药效团分布、物理化学性质和官能团）通常使用所谓的分子描述符转换为机器可读的数字。


    化合物的物理化学反应仅仅是其化学组成的函数，然而定义这种函数仍然具有挑战性。从原子论的起源开始，化学家们就努力预测化合物的性质，而不需要合成这些化合物。QSAR及其关系，一直是一个活跃的研究领域。QSAR的工作已经导致了特定物理化学性质预测的常规进展，特别是log
    P，可用于计算辛醇/水分配系数。


    伴随人工智能的发展，QSAR建模技术、分子表示、数据量和可用计算资源的数量显著增加。所有这些领域的进步都意味着以前不适合或不适用于这些数据集的深度学习等技术现在可以利用了。我们现在可以访问大量的化学结构数据以及测量的相关终点，并从中生成预测模型。然而，这些数据的数量仍然有限，即使可以访问，质量也参差不齐。在这里，人们期望更聪明的机器学习方法能够处理这些有噪声的数据。


    手工制作的分子描述符的范围很广，旨在捕捉潜在化学结构的各个方面。一般来说，QSAR/QSPR方法已经从使用简单的模型（如线性回归和k近邻算法）过渡到更普遍适用的机器学习技术，如支持向量机和梯度增强方法，旨在解决化学结构与其物理化学/生物活性之间更复杂和潜在的非线性关系，通常以牺牲可解释性为代价。


    深度学习并不是一种新技术。化学信息学中的人工神经网络在20世纪90年代迎来了第一个鼎盛时期，当时许多概念都是首创的，包括深度和自适应网络架构、自组织映射、序列和时间序列分析的递归系统以及自动编码器。其中，深度网络在2012年默克分子活性挑战赛中取得成功后，终于取得了突破。虽然在使用相同的描述符集时，后一种类型的模型在性能方面是否优于其他方法（如梯度提升机）存在一些争议，但深度学习方法提供了几个优点，其中最重要的一点是深度网络可以在训练过程中进行自动特征提取。


    图神经网络，也称为消息传递方法和递归神经网络，能够生成分子结构的内部上下文特定表示。图神经网络在特定情况下，通过在训练过程中学习潜在的原子和键表示来实现的。因此，深度学习方法很有希望用于建模那些最初没有设计经典描述符的任务。实例包括肽、大环和蛋白水解靶向嵌合体（PROTACs）的建模。深度架构的另一个潜在优势是其适用于多任务学习，其目的是找到一种对一组相关端点有用的通用内部表示（与多输出学习不同，多输出学习不会明确利用要学习的任务之间的相关信息）。'
