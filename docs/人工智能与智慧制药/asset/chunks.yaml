    ### 5）与其他相关算法比较


    Matthew 等人提出的方法首先识别了差异显著 miRNA，然后通过靶基因预测，构建了 miRNA 调控靶基因网络，以腹部主动脉瘤研究为例，识别了 8 个差异显著
    miRNA 和其调控的 222 个基因。Liu 等人提出的方法首先选取差异表达 miRNA，然后通过靶基因预测选取靶基因，并构建了 miRNA 与靶基因的共表达网络，对重要
    miRNA 和基因节点进行分析识别，从而发现重要生物标志物，该方法以酒精肝为例，发现了 26 个 miRNA 和 878 个差异表达基因，重点分析了共表达网络中
    6 个 miRNA 结点和 2 个基因结点。Zhang 等人整合基因表达谱数据和蛋白质网络数据，构建了差异表达基因相关的蛋白质网络，然后采用模块识别算法，识别了重要功能模块和基因，算法以冠状动脉疾病为例，结果识别了
    10 个关键模块，包含 4 个与`GO`条目相关基因和 12 个中心结点基因。


    本文提出的`miRFun omi`通过整合基因表达谱数据和蛋白质网络数据获取更多的特定条件相关的分子机制信息，并采用模块提取算法选取差异表达显著模块，然后，通过靶基因预测方法筛选差异显著
    miRNA 调控的靶基因，并构建 miRNA 调控的靶基因网络，从而分析 miRNA 功能。可见，我们的方法整合了更多的生物资源，相对于上述算法理论依据更充分，对
    miRNA 功能识别准确率更高。


    ## （3）基因诱导的药物基因识别


    整合多组学的 miRNA 功能识别方法是切实可行的，并且我们在利福平作用于肝脏实例的验证下，识别了一系列的重要功能模块、关键基因和 miRNA 的功能，这说明我们的方法具有以下优势。


    ### 1）可靠的理论依据


    miRNA 参与了一系列重要的生命过程，包括细胞生长、组织发育、细胞增殖和凋亡等，并且与肿瘤的发生、诊断、治疗和预后密切相关，它调控了人类 60%的转录过程和超过三分之一的蛋白质基因，我们就是在此理论基础上，提出结合了蛋白质组学、基因组学和
    RNA 组学的 miRNA 表达谱、基因表达谱和蛋白质网络整合方法来分析 miRNA 功能。


    ### 2）有效的处理方法


    我们提出的`miRFun omi`方法中采用了 t 检验方法、功能模块识别方法、基因功能富集解析方法和 miRNA 靶基因预测方法等。为了使我们的方法更具有普遍性，功能模块识别采用了基于线性规划算法和模拟退火算法的最大功能模块识别和多模块识别的两种方法，并对结果进行综合考虑；富集解析采用了关键字和
    P 值相结合方法，既分析了生物功能又关注了涉及的生命通路；为了防止 miRNA 靶基因预测过程中的假阳性，采取了多预测结果取交集的方法。


    ### 3）利福平作用于肝脏组织实例验证


    以利福平作用人体肝脏组织为研究对象，采用`miRFun omi`方法，我们识别了利福平相关的涉及 84 个基因 89 相互作用关系的功能模块；找到 19 个基因及其相关
    7 个生命通路；构建了涉及 14 个 miRNA 的 21 个 miRNA-靶基因对的利福平相关 miRNA 调控蛋白质网络；识别了 12 个 miRNA
    通过调控 8 个基因与 6 个生物通路相关。重要的是，我们的识别结果得到大量研究文献的证实。


    本章提出了基于蛋白质组学、基因组学和 RNA 组学的 miRNA 功能识别方法。该方法通过整合蛋白质网络、基因表达谱和 miRNA 表达谱构建特定条件下蛋白质网络，并提取了功能模块，通过多生物通路和生物功能相关资源数据库基础上的富集解析，识别了特定状态下关键基因和
    miRNA。另外，本节以利福平作用于肝脏组织为研究对象，采用`miRFun omi`方法分析利福平作用于肝脏引起的一系列生物通路作用，以此识别关键的生物功能模块，并通过对基因富集分析，找出起关键作用的基因和
    miRNA。结果发现，有 19 个基因和 7 个关键通路与利福平作用人体肝脏后生命活动相关，7 个功能富集通路为药物反应、代谢细胞色素 P450 的外源性物质、视黄素代谢、药物代谢、亚油酸代谢、癌症通路和黏着斑；并且，通过构建和分析
    miRNA 调控的蛋白质网络，我们发现有 12 个 miRNA 通过调控 8 个靶基因参与了利福平作用肝脏的 6 个重要生物通路：药物反应、代谢细胞色素 P450
    的外源性物质、药物代谢、亚油酸代谢、癌症通路和黏着斑。我们的结果表明，利福平作用于人体肝脏导致了一系列的 miRNA 和基因表达水平发生改变，进而诱导了多个生物通路。这项研究不仅对利福平作用肝脏涉及的蛋白质网络中的功能模块研究提供了新方法，而且，这种整合了基因表达谱、miRNA
    表达谱和蛋白质网络的方法同时对利福平诱导的药物处置方面的研究提供了新思路。


    # 6.5　miRNA 诱导的药物基因识别


    上一节提出识别方法是从基因角度出发的 miRNA 功能预测，本节从 miRNA 出发，整合蛋白质网络解析 miRNA 和基因功能。该方法结合 miRNA 和
    mRNA 表达谱，从差异表达 miRNA 出发，预测它们的靶基因，筛选 miRNAs 调控的负相关表达基因，整合 PPI 网络构建立利福平相关的 miRNA
    调控的负相关表达蛋白质互作网络（miRNA-regulated negative-expressed protein interaction network,
    `MNePIN`），通过功能富集分析评估每个潜在功能的基因，预测人体肝脏内利福平调控的 miRNA 的功能，以进一步揭示利福平调控的 miRNA 的功能及其在人肝细胞中的潜在分子机制。技术路线如图
    6-10 所示。


    ![](img/figure_0155_0056.jpg)


    图 6-10　技术路线图


    ## （1）数据处理方法


    miRNA 诱导的整合网络解析的功能基因识别方法如下：


    ### 1）对基因表达谱和 miRNA 表达谱采用 Benjamini-Hochberg 校正法计算假发现率（FDR），用不配对的双尾 t 检验计算两组（正常和利福平处理的样本）的每个
    miRNA 和每个基因的 P 值。


    ### 2）定义`p < 0.01`时的 miRNA 有统计学意义，为差异表达 miRNA。利用`BioMart`将基因`Entrez ID`转化为基因`Symbol`，采用`RmiR`软件预测差异表达
    miRNA 靶基因，使用的靶基因方法包括`Targetscan`、`miRanda`和`PicTar`。


    ### 3）人类蛋白参考数据库（`HPRD`）包含 30047 个蛋白和 41327 个蛋白相互作用，人肝蛋白相互作用网络（`HLPN`）包含 2582 个与人肝相关的蛋白之间的
    3484 个相互作用。本节将整合`HPRD`和`HLPN`的蛋白质整合和相互作用，去除重复，使用`cytoscape version 3.0.2`软件生成蛋白质互作网络。


    ### 4）整合 miRNA 差异基因、负调控靶基因和人类蛋白质互作网络共同构建利福平相关蛋白质互作网络，构建利福平相关的 miRNA 调控的负相关表达蛋白质互作网络`MNePIN`。


    ### 5）利用基因生物解释工具`DAVID`对`MNePIN`的生物学过程和通路进行富集分析。利用`GO`和`KEGG`对重要基因通路进行功能分类，预测功能
    miRNA 和靶基因。


    ## （2）数据结果分析


    ### 1）构建 MNePIN


    差异表达的 miRNAs 根据 P 值（`p < 0.01`）进行检索。上调和下调的 miRNA 分别通过阈值大于 1（`Fold Change > 1`）和阈值小于
    1（`Fold Change < 1`）进行识别，最后识别 20 个 miRNA，其中 12 个 miRNA 表达上调，8 个 miRNA 表达下调（表 6-9）。


    表 6-9　差异表达 miRNA


    ![](img/figure_0156_0057.jpg)


    为了预测 20 个 miRNA 的靶基因，我们使用`Pictar`、`Targetscan`和`miRanda`方法，不设置任何阈值。20 个 miRNA
    的靶基因是三个数据库结果的混合数据集。分析过程中，我们关注基因表达谱中的基因，最后提取了 6211 个基因，通过表达变化度量的倍数变化（`fold change`）参数筛选每个
    miRNA 的负调控靶基因，结果保留 20 个 miRNA 中有 4115 个负相关表达基因。负相关表达基因按照`P < 0.1`筛选显著差异基因。


    通过合并所有蛋白和相互作用，将`HPRD`和`HLPN`整合，然后去除重复序列。人类蛋白质网络包含 10210 个蛋白质之间的 42521 个相互作用关系。整合
    miRNA 差异基因、负调控差异表达靶基因和人类蛋白质互作网络构建的`MNePIN`包含 632 个显著差异表达基因，1187 对 miRNA-基因负相关表达。具体来说，miRNA
    调控的蛋白质网络通过选择基因的第一级蛋白节点进行扩展。因此，`MNePIN`是由 20 个 miRNA 和 632 个蛋白之间的 11219 个相互作用构建而成。在负相关表达的
    1187 对 miRNA 基因中，`miR-660`负调控的基因最多（136 个），`miR-886`负调控的基因最少（12 个）。


