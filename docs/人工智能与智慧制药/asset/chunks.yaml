    ### （2）人工智能在药物生产过程中的应用场景。


    优化工艺设计和放大：机器学习等人工智能手段可以通过对过程开发数据的分析和处理从而更快地确定最佳处理参数或放大过程，减少开发时间。例如利用人工智能可以帮助化学药物的合成路线设计、反应条件推荐等，并且在工艺放大过程中，通过实时模拟预测反应进程，对反应工艺参数进行调整，以提高反应收率或者排除反应过程中的安全隐患。


    过程控制：在配方驱动的生产过程中，可以利用`MES`系统对生产过程的重点参数进行监控，确保生产过程按既定的工艺流程作业，与此同时还能实现生产过程质量控制的实时检测，代替传统的实验室离线检测模式，进一步提高产品生产效率。先进过程控制（`APC`）可以对制造过程进行动态控制，从而建立基于工艺模型的多变量参数预测或监控模型，还可以将人工智能与实时传感器数据相结合，从而实现精准的过程控制。`APC`方法结合人工智能和对制造过程中发生的化学、物理和生物转化的理解，将更广泛地应用于药物的智能制造。


    过程监控和故障检测：人工智能方法可用于监控设备和监测正常运行过程中的数据变化，从而判断是否需要开展设备维护，减少生产过程的停机时间。利用过程分析技术（`PAT`）可以实现生产过程的自动取样检测，实现对产品关键参数的实时监测。视觉识别技术的应用还可以对生产过程中操作人员的行为规范进行管理，发现不合规的操作及时进行预警和提醒，以确保生产过程符合操作规范，此外视觉识别技术还可以用于产品的质量检测。


    ### （3）我国制药行业智能制造的发展现状。


    制药工业智能制造的发展基础相对薄弱，整个行业的自动化和信息化水平较低。目前在制药行业中，虽然机械化水平较高，也不缺少自动化控制系统的应用，但是往往这种自动化只能局限于生产流程的局部单元。虽然在制剂阶段设备自动化程度会相对高一些，但是往往是比较封闭的，无法实现内部数据的向外传输，同样也无法利用外部的系统实现设备的控制。这些系统和设备之间大部分无法实现系统化的集成，也就导致了整个生产过程的孤立，无法实现端到端的连续生产过程。目前在药品生产过程中所涉及的物料的转运和投放大部分仍然依靠人力完成，使整个生产过程中存在许多信息化的孤岛。目前大多数药企都有一定的信息化建设基础，例如办公自动化系统（`OA`）、企业资源管理系统（`ERP`）、财务及成本管理（`FCM`）和生产执行系统（`MES`）等在制药企业中已经被较广泛的使用，但是制药企业的整体信息化建设方面仍较为薄弱，各个企业在信息化建设的水平上参差不齐，并且这些系统主要还是用于企业的日常管理和办公，缺少与产品生产过程的深度融合。此外，目前制药企业对于连续制造、过程分析技术、数字孪生、电子批记录、物联网、大数据、云计算等人工智能相关新技术的使用仍处于探索阶段。


    在国家政策和法规以及制药企业提升生产效率的需求下，制药行业智能制造迎来了发展机遇。工信部关于“十三五”《医药工业发展规划指南》中提出：“到2020年，医药生产过程自动化、信息化水平显著提升，大型企业关键工艺过程基本实现自动化，制造执行系统（`MES`）使用率达到30%以上，建成一批智能制造示范车间”。2015年“中国制造2025”战略被首次提出，作为制造业的重要组成部分，制药企业必须重视药品制造的智能化、信息化和可追溯性。近年来，对于药品监管的力度越来越大，2021年《“十四五”国家药品安全及促进高质量发展规划》正式发布，全面加强药品全生命周期监管。随着质量监管要求的不断提升，制药企业需要不断提升和健全自身质量体系，提高产品质量，对于药品智能制造的需求也是迫在眉睫。此外，对于疫苗生产企业，信息化建设已经成为了强制要求，`GMP`《生物制品》附录第59条规定疫苗生产企业应采用信息化手段如实记录生产、检验过程中形成的所有数据，确保生产全过程持续符合法定要求。对于人工操作（包括人工操作、观察及记录等）步骤，应将该过程形成的数据及时录入相关信息化系统或转化为电子数据，确保相关数据的真实、完整和可追溯。从这一点也可以预见，今后对于制药企业的信息化建设要求会越来越普遍。药品上市许可持有人制度和集中采购制度加大了目前制药企业间的竞争力度，企业提升生产效率的需求日益凸显，进一步提升了企业推动智能化转型的内在动力。


    对于我国制药工业来说，实现智能制造的关键是要打好两个基础：从下提升制药生产底层制药装备和制药过程的自动化、数字化与网络化的水平，建立所谓的信息物理系统`CPS`的智能化物理基础；从上充分采用工业互联网、物联网、工业大数据、云计算等新一代的信息化技术，建立以这些技术为基础的数据中心和支撑服务平台，以达到实现智能决策、优化管理、协同发展和服务的目的。


    随着“中国制造2025”战略和“工业4.0”的推进，以及人工智能相关技术的不断完善，加上法规政策的压力，国内制药企业顺应趋势，积极尝试智能化转型。同时政府相关部门也高度重视并积极推动制药行业的智能制造，工业和信息化部产业发展促进中心和中国医药企业管理协会等相关部门发布了《中国制药工业智能制造白皮书（2020年版）》和《制药企业智能制造典型场景指南（2022版）》，助力制药企业推进智能制造。


    [1]王颖.成熟`microRNA`识别及其功能预测方法研究[D].哈尔滨工程大学，2016.

