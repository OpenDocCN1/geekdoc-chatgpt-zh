    ## 7.1　人工智能制药产业的挑战和风险


    数据制约：人工智能制药需要海量数据的支撑，才能实现模型的训练，并提高模型的准确性，目前数据的来源主要依靠科研基金、出版物等公开数据，由于数据来源比较复杂，数据质量参差不齐，对于这些数据的有效性和规范性的筛选整合需要花费大量的精力。计算机科学是较为共享与开放的，而生物医药领域则较为注重保密，所以人工智能制药本身就是一个矛盾复合体。由于制药行业相对封闭，很多制药企业虽然掌握着核心数据，但是出于知识产权保护方面的考量，并不会轻易公开核心数据。


    缺乏专业人才：人工智能制药是信息科技与生物医药的高度融合，从事人工智能制药工作的研究人员既需要具备人工智能相关的技术手段，同时还需具备药物研发过程中所涉及的生物学、医学和化学等相关知识积累。这种复合型人才目前来说是极度缺乏的，并且培养难度大，目前国内高校也没有开设相关专业以很好地支撑此类复合型人才的培养。


    新药研发的不确定性：新药研发是一项漫长并且花费巨大的工程，人工智能制药目前已经展现了巨大的发展潜力，但是其安全性、预期效果以及是否能达到传统药物的监管标准仍然存在一定的质疑。目前虽然多个人工智能药物管线已经进入临床试验阶段，但是仍然缺少上市的人工智能药物来进一步验证人工智能制药的可靠性。


    ## 7.2　人工智能药物生产的发展


    智能制造目前尚无统一的定义，国家工信部和国家标准化管理委员会 2015 年 10 月正式发布《国家智能制造标准体系建设指南》（征求意见稿）对“智能制造”所作的定义如下：“智能制造是指将物联网、大数据、云计算等新一代信息技术与设计、生产、管理、服务等制造活动的各个环节融合，具有信息深度自感知、智慧优化自决策、精准控制自执行等功能的先进制造过程、系统与模式的总称。”工业
    4.0 是指第四次工业革命，它汇聚了物联网、人工智能、机器人和先进计算等快速发展的技术，极大地改变了制造业的格局。工业 4.0 环境中集成的自主和机器人系统将工业生产流程的在线数据和人工智能融合，以优化制造过程和企业管理。《“十四五”医药工业发展规划》提出，要深入实施智能制造、绿色制造和质量提升行动，提高药品、医疗器械全生命周期质量管理水平和产品品质，推动医药工业高端化、智能化和绿色化发展。因此制药工业智能制造备受关注，制药
    4.0 的概念也越来越多被提及。其实制药 4.0 可以理解为第四次工业革命在制药行业的应用，它将物联网、人工智能、机器人技术和先进计算等快速发展的技术结合起来，从而彻底改变制药行业的格局。制药
    4.0 通过数字化、自动化和智能化的生产系统，实现制药生产的高效、灵活、质量可控和可持续发展。


    ### （1）制药工业智能制造的系统构架。


    由于目前国内制药工业的智能制造仍处于发展阶段，根据工信部产业发展促进中心、中国医药企业管理协会联合编制的《中国制药工业智能制造白皮书（2020 年版）》，制药工业智能制造的主要目标是，按照相关法规要求，实现生产记录和管控流程的电子化和系统化，确保生产全过程的合规性和信息透明化，提高生产质量管控水平，降低人为因素引起的合规性风险，从而提高产品质量、降低成本。生产系统应该以生产质量管理规范（`GMP`）要求为标准，通过业务全程管控等手段，实现自动化与信息化的协同，优化关键业务间的交互融合，实现业务一体化，优化整体业务协同能力。


    制药工业智能制造总体系统架构可以分为设备层、控制层、业务管理层和运营管理层（图 7-1）。设备层主要为物理基础设施，可通过可编程逻辑控制器（`PLC`）、过程管理系统（`PCS`）采集和管理设备以及传感器产生的数据，实现各类数据的完整记录。控制层主要由数据采集及监控系统（`SCADA`）和自动化控制系统构成，为生产系统提供数据采集及报警监控的一体化平台，实现全车间生产设备的数据采集、存储及流程运行监控。业务管理层主要面向生产过程，覆盖生产运行与管理、设备管理、仓储管理、质量保证和质量控制、能源管理等方面的业务，实现生产的集成化和智能化。运营管理层覆盖公司的产供销以及供应链业务，实现经营管控一体化，并且通过信息技术与制造管理技术深度融合，汇聚各个业务系统的数据，利用大数据分析技术实现分析决策的智能化。


