    ### （2）生物网络


    生命活动是一个多系统协调的过程，单一地研究某一方向无法诠释全部生物活动。在过去的几十年，研究较多的生物网络主要有基因调控网、蛋白质相互作用网、细胞信号传导网、代谢网、遗传或小分子互作网和蛋白质磷酸化网等，这些生物网络被认为是主要调控系统。这里主要介绍常用的生物网络数据库（表6-2）。


    表6-2　生物网络数据资源


    ![](Images/figure_0130_0027.jpg)


    蛋白质互作网络隶属于蛋白质组学，是由单独蛋白通过彼此之间的相互作用构成，来参与生物信号传递、基因表达调节、能量和物质代谢及细胞周期调控等生命过程的各个环节。该网络系统分析大量蛋白在生物系统中的相互作用关系，对于了解生物系统中蛋白质的工作原理、了解疾病等特殊生理状态下生物信号和能量物质代谢的反应机制，以及了解蛋白之间的功能联系都有重要意义。蛋白质互作网络已成为蛋白质组学研究中的热点，也是后基因时代难题所在。蛋白质相互作用网络常用数据库如HPRD以可视方式描绘和整合蛋白质组中每种蛋白质的域结构、翻译后修饰、相互作用网络和疾病关联有关的信息。BioGRID包含了76687个出版物、2045743个蛋白质和遗传相互作用、29093间化学相互作用和1070825个的主要模式生物物种翻译后修饰。STRING包含蛋白质-蛋白质相互作用网络功能富集分析，包含了5090个有机体、2460万种蛋白质和20亿种蛋白质的相互作用。iRefWeb包含与疾病有关的蛋白质和基因，还有它们之间相互作用的信息。MINT涵盖了607个物种，共117001个蛋白相互作用关系。IntAct是分子相互作用小组产生分子相互作用证据的数据库。PINA是对肿瘤相关疾病进行相互作用和验证的数据库，是整合了多个数据的结果来进行构建的。PhosphoSitePlus是翻译后修饰数据库，包含了30多万蛋白翻译后修饰位点信息，以及25000多PTMVars（PTMs
    Impacted by Variants）信息。Phospho.ELM是真核蛋白中经过实验验证的磷酸化位点的数据库，包含556个磷酸化蛋白的1703个磷酸化位点实例。PTMcode是相互作用的蛋白质内和相互作用的蛋白质之间的蛋白质翻译后修饰（PTM）的已知和预测的功能关联的资源，它包含来自69种不同PTM类型的316546个修饰位点，这些位点涉及19种不同的真核生物，共160万个位点和1700万个功能性关联，超过100000种蛋白质。Interactome3D是用于蛋白质-蛋白质相互作用网络的结构注释的Web服务，可根据结果信息预测生物的一组蛋白质或相互作用组的相互作用。3did是用于高分辨率三维结构模板的集合域的域相互作用，包含用于两个球状结构域之间相互作用的模板以及新颖的结构域-肽相互作用的模板。Instruct是3D结构分辨率的高质量蛋白质相互作用组网络的数据库，收录了6585个人、644个拟南芥、120只秀丽线虫、166只黑腹果蝇、119只小家鼠、1273个酿酒酵母和37个pombe结构解析的相互作用。


    通路注释或功能富集数据库如KEGG是一个数据库资源，用于从分子水平的信息（尤其是通过基因组测序和其他高通量生成的大规模分子数据集）中了解生物系统（如细胞、生物体和生态系统）的高级功能和实用性实验技术。WikiPathways是涵盖主要基因、蛋白质和小分子系统的集成数据库，还包括了典型的信号传导途径可以代表受体结合事件、蛋白质复合物、磷酸化反应、易位和转录调控。Reactome是开放的信号和代谢分子及其组织成生物途径和过程关系的开源关系数据库。其中参与反应的实体（核酸、蛋白质、复合物、疫苗、抗癌治疗剂和小分子）形成生物相互作用网络，并分为通路。Pathway
    Common有5772条通路、2424055次相互作用和22个数据库。Go表示了我们当前有关从人类到细菌的许多不同生物体的基因功能，即基因产生的蛋白质和非编码RNA分子的科学知识。


    ## 6.2　药物代谢和药物基因


    人类基因的不同表达会导致个体的药物代谢与药效产生差异。一些基因的变异会导致药物代谢过快或过慢，进而影响药物在体内的浓度和药效。通过对这些影响药物代谢与药效的基因进行识别，可以为临床医师提供精准的药物用药方案，个体化地制订用药方案，避免不必要的药物不良反应和治疗失败。药物代谢和药效相关基因是近年来备受关注的研究领域之一。本节从药物代谢和药效基因、药物代谢酶作用和基因检测三个方面介绍。


    ### （1）药物代谢和药物基因


    药物进入体内需要经过吸收、分布、代谢、排泄等一系列复杂的过程。药物代谢和药物基因是指一些与药物使用时代谢和药物效果相关的基因，这些基因编码的蛋白质参与药物代谢和对药物产生效应的调控过程，这些基因是影响个体对药物反应性和个体化药物治疗效果的重要因素。参与药物作用的关键因子本质都是蛋白质，蛋白质又是受基因，比如miRNA调控。所以，基因表达水平改变会导致合成的蛋白质改变，使其不能正常的发挥作用，从而影响药物的作用效果。药物疗效问题面临耐药严重、药物不良反应评估不全面及个性化用药带来的挑战。由此，药物基因识别成为当前的重要研究课题之一。


    药物基因识别从复杂系统的整体网络水平，利用分子生物学技术和人工智能技术评估患者用药后基因表达水平变化进而识别患者与药物相关的基因，即人的药物代谢基因、药物应答（药效）基因、药物副反应相关基因，明确不同人群的基因差异，预测患者对不同药物的应答情况和不良反应程度。它属于精准治疗的范畴，打破了传统的试药模式，能更科学地辅助医生为患者选择最适合的药物。


    网络水平是以生物网络之间相互作用或相互关系为研究基础，其中，尤为重要的是蛋白质相互作用网络。蛋白质之间相互作用是生物过程的内在特性，蛋白质相互作用网络解释了基本的细胞机制。蛋白质网络能描绘和整合蛋白质组中域结构、翻译后修改、相互作用网络和疾病相关的每一个蛋白。表达谱描绘了特定细胞或组织在特定状态下的基因表达种类和丰度信息，动态地诠释了基因的功能、状态和环境等信息。它整合了蛋白质网络和基因表达谱来挖掘多种疾病相关的细胞机制。miRNA在转录后水平上调控靶基因mRNA，蛋白质从mRNA模板通过高度保守的过程进行合成，所以miRNA调控着蛋白质编码基因，据估计，miRNA调控人类基因组中超过三分之一的蛋白质基因。蛋白质相互作用网络结合基因表达谱能够识别基因间特殊关联，进而识别生物通路相关关键基因和功能模块。进一步整合miRNA表达谱诠释miRNA表达改变与它靶向靶基因之间的关联，故而大量研究也表明，miRNA的功能能够通过解析miRNA调控的蛋白质网络发掘。近年来，随着高通量测序技术的发展，多组学数据呈爆炸性增长，尤其是miRNA组学、蛋白质组学、基因组学与代谢组学，为基于数据挖掘全面了解药物学提供了坚实的数据基础。生物网络模型历经十多年的发展，成为多组学数据挖掘新方法的重要分支，有望从网络水平在药物疗效上产生新突破，助力发现药物作用新靶标和新治疗策略的研究。


    ### （2）药物代谢酶


    药物用药指导基因检测通常包括检测与药物代谢和药效相关的酶：如细胞色素P450（cytochromeP450或CYP450，简称CYP450）家族基因、UGT家族基因、GST家族基因、ABCB家族基因、SLCO家族基因等。这些酶主要存在于肝脏、小肠、脑和肺等组织中，参与药物代谢、转化、消除以及药物效果调控等过程，调节机体对药物反应。通过基因检测可以了解患者体内的药物代谢能力和细胞对药物作用的敏感程度，从而在用药时针对性地进行用药调整，提高治疗效果和减少药物不良反应。下面对CYP450家族基因重点介绍。


    CYP450代表着一个很大的可自身氧化的亚铁血红素蛋白家族，属于单氧酶的一类，因其在450nm有特异吸收峰而得名。它参与内源性物质和包括药物、环境化合物在内的外源性物质的代谢。根据氨基酸序列的同源程度，其成员又依次分为家族、亚家族和酶个体三级。细胞色素P450酶系统可缩写为CYP，其中家族以阿拉伯数字表示，亚家族以大写英文字母表示，酶个体以阿拉伯数字表示，如CYP2D6、CYP2C19、CYP3A4等。人类肝细胞色素P450酶系中至少有9种P450与药物代谢相关。肝脏的细胞色素P450系统在药物的代谢中起着重要作用，它将药物由疏水型转化为更易排泄的亲水型。生物转化反应一般可分为细胞色素P450依赖的Ⅰ相和Ⅱ相结合反应。

