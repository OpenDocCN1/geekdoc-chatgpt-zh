- raw: "此外，大多数生物学特征是连续变量，将这些特征简化为分类和/或离散变量对于其在临床决策中的使用是必要的。然而，生物标志物的开发通常是一维的、定性的，并且不能解释肿瘤细胞，或组织的复杂信号传导和细胞网络。基于人工智能的常规苏木精和伊红（H&E）染色后，多个亚视觉形态计量学特征的自动提取，仍然受到采样问题和肿瘤异质性的限制，但可以帮助克服主观视觉评估的局限性，并整合多个测量，以捕捉组织结构的复杂性。这些组织病理学特征可能与其他放射学、基因组学和病理学测量结合使用，以提供更客观、多维和功能相关的诊断输出。\n\
    \n随着机器学习技术，特别是深度学习技术的出现和图形处理单元的发展，使用人工智能技术的大数据分析现在在各个领域，包括医学领域都很普遍。它在医学领域的引入允许对生物现象进行更客观的分析，这些现象天生复杂和多样，需要仔细确定从分析中获得的结果的普遍性。在这样一个学术领域，如果科学讨论只涉及有限的数据，那么就很难理解一个现象的完整图景，很容易陷入“树木看不到森林”的状态。相比之下，使用人工智能技术的大规模数据分析将更客观、不遗漏地阐明生物现象，它有望对医学的进步做出巨大贡献。\n\
    \n有人使用傅里叶变换红外光谱测量血清样本，并使用深度学习分析结果，以显示其在区分健康个体、过敏患者和接受过敏原特异性免疫治疗的患者的血清方面的潜力。\n\n\
    有人利用贝叶斯网络构建了一个代表基因-基因相互作用的上皮-间充质过渡（EMT）网络，表明该EMT网络的样本特异性边缘贡献值模式是肺癌患者的生存率，且使用一个公开的数据集\\\
    [癌症基因组图谱（TCGA），重点是肺腺癌（LUAD）\\]。有人通过结合深度学习和机器学习的多组学分析，成功地对预后良好和不良组进行了分类，并成功识别了有助于LUAD患者生存的基因。高桥等人通过结合深度学习和机器学习，分析由6类TCGA组成的多组学数据集，根据预后（差或好）对肺癌患者进行了分类。\n\
    \n## 5.8　临床决策\n\n临床决策是一个复杂的过程，可以用最初在认知科学中发展起来的双过程理论来建模。双过程理论指出，临床决策涉及两种不同的途径：第一种是直观的，通常被描述为潜意识的、非语言的和自主的，第二种是分析性的，被描述为有意识的、语言的和深思熟虑的。\n\
    \n面对复杂的临床问题，即使受过相同培训的病理学家之间也可能出现意见分歧，导致诊断不一致的情况。这个问题的本质很可能是，多因素和有效的解决方案仍然难以确定。此外，非侵入性或微创手术获取诊断样本的广泛使用，大大降低了所获得样本的大小和质量，使病理学家的工作更具挑战性。与其相反，这种困难伴随着对进行精细诊断的需求不断增加，包括报告具有预后或预测价值的变量。即使使用更客观的分子分析策略，频繁的限制也会使疾病过程的生物学驱动因素的明确诊断或表征复杂化。患者偏好和报销考虑因素也会对诊断过程产生很大影响，临床团队应谨慎行动。因缺乏标准，伴随诊断分析和用于指导治疗决策的生物标志物的可变性进一步加剧了这些问题，但也是样本中空间和/或时间生物异质性的结果。\n\
    \n参与临床决策的医生所期望的一些特征，如理性、批判性思维、反思和沟通技巧，都属于分析途径。与直观路径相关的其他特征，如认知和情感偏见，当它们没有被正确地理解和管理时，可能会对临床判断构成威胁。\n\
    \n人工智能可能是帮助临床决策医生的一个有价值的工具，特别是因为在大多数国家的医疗培训中，专门针对临床决策和解决问题的医学课程很少或不存在。人工智能不仅可以指导临床医生进行推理，而且可以帮助他们更多地意识到自己的认知和情感偏见。\n\
    \n除了临床决策之外，人工智能在临床医学中的应用还提出了一个关于医学本质的更具理论性的问题。在20世纪，由于科学和技术的进步，医学成为一门艺术和一门科学。这种双重身份的一个很好的证明是，尽管循证医学被广泛接受，但仍得到专家意见的补充。如今，医学人工智能的出现从根本上将医学与一般的硬科学，特别是数学和计算机科学联系起来。\n\
    \n总之，在药物化学和药物发现中，最好的人工智能不一定是能够自主设计新药的单个人工智能，而是多个不同的人工智能。在药物发现过程中，从靶标选择、先导物确定、高通量筛选到临床前研究和临床试验，人工智能能够更好地理解和设计新的输入。\n\
    \n虽然人工智能并不是所有挑战的答案，但它是一种有用的工具，如果使用得当，可以有效提高药物研发效率并推动新的发现。\n\n# 第6章  \n\n人工智能辅助药物基因识别\n\
    \n药物进入体内需要经过吸收、分布、代谢、排泄等一系列复杂的过程，单一地研究某一方向无法诠释这一生命问题。药物基因识别是一种通过分析个体基因组信息来预测药物反应的科学方法。随着基因检测技术的不断发展，整合多组学信息和生物网络识别药物基因识别成为可能。药物基因识别作为一种新兴的医学技术，在未来的临床应用将越来越广泛，为患者带来更为精确和个性化的药物治疗方案。本章综述了多组学数据和生物网络，介绍了药物代谢和药效相关基因，并给出人工智能的药物基因识别方法和应用实践。\n\
    \n## 6.1　多组学数据和生物信息软件\n\n（1）多组学数据。\n\n多组学是测序技术的产物，它通常包括基因组学、转录组学、蛋白质组学、代谢组学、表观组学等多个维度数据。在现代生物学领域，多组学迅猛发展解决了单一组学数据对于探究生物学问题的单一局限性，使生物体问题从多维度信息进行表征。\n\
    \n多组学数据之间的级联关系见图6-1。\n\n![](Images/figure_0127_0023.jpg)\n\n图6-1　多组学数据之间的级联关系\n\
    \n基因组学是对生物体所有基因进行集体表征、定量研究及不同基因组比较研究的一门交叉生物学学科。基因组学主要研究基因组的结构、功能、进化、定位和编辑等，以及它们对生物体的影响。基因组学的目的是对一个生物体所有基因进行集体表征和量化，并研究它们之间的相互关系及对生物体的影响。基因组学还包括基因组测序和分析，通过使用高通量DNA测序和生物信息学来组装和分析整个基因组的功能和结构。\n\
    \n转录组学是指一门在整体水平上研究细胞中基因转录的情况及转录调控规律的学科。转录组学是从RNA水平研究基因表达的情况，转录组即一个活细胞所能转录出来的所有RNA的总和，是研究细胞表型和功能的一个重要手段。以DNA为模板合成RNA的转录过程是基因表达的第一步，也是基因表达调控的关键环节。所谓基因表达，是指基因携带的遗传信息转变为可辨别的表型的整个过程。与基因组不同的是，转录组的定义中包含了时间和空间的限制。同一细胞在不同的生长时期及生长环境下，其基因表达情况是不完全相同的。\n\
    \n蛋白质组学是以蛋白质组为研究对象，研究细胞、组织或生物体蛋白质组成及其变化规律的科学，本质上指的是在大规模水平上研究蛋白质的特征，包括蛋白质的表达水平、翻译后的修饰、蛋白与蛋白相互作用等，由此获得蛋白质水平上的关于疾病发生、细胞代谢等过程的整体而全面的认识。蛋白质之间互相作用是必不可少的，它是细胞进行一切代谢活动的基础。\n\
    \n代谢组学是对生物体内所有代谢物进行定量分析，并寻找代谢物与生理病理变化的相对关系的研究方式，是系统生物学的组成部分，其研究对象大都是相对分子质量1000以内的小分子物质。代谢组学的概念来源于代谢组，代谢组是指某一生物或细胞在一特定生理时期内所有的低分子量代谢产物，同时对其进行定性和定量分析的一门新学科，它是以组群指标分析为基础，以高通量检测和数据处理为手段，以信息建模与系统整合为目标的系统生物学的一个分支。\n\
    \n人类miRNA组学：miRNA是一类长度为20～24nt的高度保守的内源性小分子RNA，在转录后水平上调控基因表达。miRNA通过与mRNA靶向结合，抑制蛋白质的合成，实现对基因的表达控制。据估计，miRNA调控了人类60%的转录过程。miRNA通过序列特异性的RNA基因沉默作用调节参与了多种生物过程。现有研究已发现miRNA参与了细胞增殖发育、组织分化、细胞循环和细胞凋亡等。比如miRNA与植物胚芽和叶的发育、人和鼠的细胞发育、神经细胞的生长发育以及神经干细胞向神经细胞的转化等密切相关；miRNA与一些疾病有密切关系，如精神分裂症、帕金森综合征和其他神经异常症状、白血病、糖尿病、艾滋病、心肌肥大和老年痴呆等常见疾病，更重要的是随着进一步研究发现，超过50%的人类miRNA被定位于与癌症相关的基因片断区域，其中包括乳腺癌、肺癌、直肠癌、皮肤癌、鼻咽癌、卵巢癌以及神经细胞癌等，最近研究也说明miRNA在药物作用后体内分子水平起到重要调节作用。综上所述，miRNA在人类疾病的诊断、治疗、预后以及评估疗效方面扮演者重要角色。\n\
    \nmiRNA生成加工机制（图6-2）：首先pri-miRNAs在核内通过Rnase Ⅲ核酸酶Drosha加工成pre-miRNAs，然后在Exportin-5的协助下从核内输出。pre-miRNAs长度为60-90nt，二级结构呈茎环组成的发夹结构，在细胞质中核酸酶\
    \ ⅢDicer作用下，从pre-miRNA的发夹茎上剪切下miRNA：miRNA∗双链体，然后Dicer单独或者在酶Drosha帮助下，将miRNA：miRNA∗双链体劈开，来自该双链的成熟miRNA掺入沉默复合物，进而发挥其生物学功能，而miRNA∗序列则衰退。带有miRISC功能的成熟miRNAs通过部分碱基配对来预测靶mRNAs和衰退产物miRNA∗，在某种情况下，miRNA和miRNA∗都行使功能。\n\
    \nmiRNA通过与靶基因mRNA序列互补实现对其调控作用。miRNA对mRNA转录后调控主要有两种方式：①通过RNA介导，与靶基因mRNA几乎完全互补方式结合，从而引发基因沉默；②miRNA以不完全互补配对方式与mRNA序列互补，对靶基因mRNA起到翻译抑制作用。miRNA与靶基因作用的方式在动物和植物中截然不同。通常，第一种方式发生在植物中，而在动物体中更多的是第二种方式。miRNA对mRNA调控机制如图6-3所示。\n\
    \n![](Images/figure_0129_0024.jpg)\n\n图6-2　miRNA生成机制\n\n![](Images/figure_0129_0025.jpg)\n\
    \n图6-3　miRNA对mRNA调控机制\n\nmiRNA作为非编码RNA，在药物多组学研究中占有重要角色，是疾病治疗和药物治疗重要生物标志物，一滴血就可以诊断疾病和分析药物疗效。通过miRNA表达水平差异分析药物安全，实现个性化精准治疗。以miRNA为生物标志物的药物基因识别已经成为药物研究热点之一（表6-1）。\n\
    \n表6-1　miRNA相关数据库\n\n![](Images/figure_0130_0026.jpg)\n\n（2）生物网络。\n\n生命活动是一个多系统协调的过程，单一地研究某一方向无法诠释全部生物活动。在过去的几十年，研究较多的生物网络主要有基因调控网、蛋白质相互作用网、细胞信号传导网、代谢网、遗传或小分子互作网和蛋白质磷酸化网等，这些生物网络被认为是主要调控系统。这里主要介绍常用的生物网络数据库（表6-2）。\n\
    \n表6-2　生物网络数据资源\n\n![](Images/figure_0130_0027.jpg)\n\n蛋白质互作网络隶属于蛋白质组学，是由单独蛋白通过彼此之间的相互作用构成，来参与生物信号传递、基因表达调节、能量和物质代谢及细胞周期调控等生命过程的各个环节。该网络系统分析大量蛋白在生物系统中的相互作用关系，对于了解生物系统中蛋白质的工作原理、了解疾病等特殊生理状态下生物信号和能量物质代谢的反应机制，以及了解蛋白之间的功能联系都有重要意义。蛋白质互作网络已成为蛋白质组学研究中的热点，也是后基因时代难题所在。蛋白质相互作用网络常用数据库如HPRD以可视方式描绘和整合蛋白质组中每种蛋白质的域结构、翻译后修饰、相互作用网络和疾病关联有关的信息。BioGRID包含了76687个出版物、2045743个蛋白质和遗传相互作用、29093间化学相互作用和1070825个的主要模式生物物种翻译后修饰。STRING包含蛋白质-蛋白质相互作用网络功能富集分析，包含了5090个有机体、2460万种蛋白质和20亿种蛋白质的相互作用。iRefWeb包含与疾病有关的蛋白质和基因，还有它们之间相互作用的信息。MINT涵盖了607个物种，共117001个蛋白相互作用关系。IntAct是分子相互作用小组产生分子相互作用证据的数据库。PINA是对肿瘤相关疾病进行相互作用和验证的数据库，是整合了多个数据的结果来进行构建的。PhosphoSitePlus是翻译后修饰数据库，包含了30多万蛋白翻译后修饰位点信息，以及25000多PTMVars（PTMs\
    \ Impacted by Variants）信息。Phospho.ELM是真核蛋白中经过实验验证的磷酸化位点的数据库，包含556个磷酸化蛋白的1703个磷酸化位点实例。PTMcode是相互作用的蛋白质内和相互作用的蛋白质之间的蛋白质翻译后修饰（PTM）的已知和预测的功能关联的资源，它包含来自69种不同PTM类型的316546个修饰位点，这些位点涉及19种不同的真核生物，共160万个位点和1700万个功能性关联，超过100000种蛋白质。Interactome3D是用于蛋白质-蛋白质相互作用网络的结构注释的Web服务，可根据结果信息预测生物的一组蛋白质或相互作用组的相互作用。3did是用于高分辨率三维结构模板的集合域的域相互作用，包含用于两个球状结构域之间相互作用的模板以及新颖的结构域-肽相互作用的模板。Instruct是3D结构分辨率的高质量蛋白质相互作用组网络的数据库，收录了6585个人、644个拟南芥、120只秀丽线虫、166只黑腹果蝇、119只小家鼠、1273个酿酒酵母和37个pombe结构解析的相互作用。\n\
    \n通路注释或功能富集数据库如KEGG是一个数据库资源，用于从分子水平的信息（尤其是通过基因组测序和其他高通量生成的大规模分子数据集）中了解生物系统（如细胞、生物体和生态系统）的高级功能和实用性实验技术。WikiPathways是涵盖主要基因、蛋白质和小分子系统的集成数据库，还包括了典型的信号传导途径可以代表受体结合事件、蛋白质复合物、磷酸化反应、易位和转录调控。Reactome是开放的信号和代谢分子及其组织成生物途径和过程关系的开源关系数据库。其中参与反应的实体（核酸、蛋白质、复合物、疫苗、抗癌治疗剂和小分子）形成生物相互作用网络，并分为通路。Pathway\
    \ Common有5772条通路、2424055次相互作用和22个数据库。Go表示了我们当前有关从人类到细菌的许多不同生物体的基因功能，即基因产生的蛋白质和非编码RNA分子的科学知识。\n\
    \n## 6.2　药物代谢和药物基因\n\n人类基因的不同表达会导致个体的药物代谢与药效产生差异。一些基因的变异会导致药物代谢过快或过慢，进而影响药物在体内的浓度和药效。通过对这些影响药物代谢与药效的基因进行识别，可以为临床医师提供精准的药物用药方案，个体化地制订用药方案，避免不必要的药物不良反应和治疗失败。药物代谢和药效相关基因是近年来备受关注的研究领域之一。本节从药物代谢和药效基因、药物代谢酶作用和基因检测三个方面介绍。\n\
    \n（1）药物代谢和药物基因。\n\n药物进入体内需要经过吸收、分布、代谢、排泄等一系列复杂的过程。药物代谢和药物基因是指一些与药物使用时代谢和药物效果相关的基因，这些基因编码的蛋白质参与药物代谢和对药物产生效应的调控过程，这些基因是影响个体对药物反应性和个体化药物治疗效果的重要因素。参与药物作用的关键因子本质都是蛋白质，蛋白质又是受基因，比如miRNA调控。所以，基因表达水平改变会导致合成的蛋白质改变，使其不能正常的发挥作用，从而影响药物的作用效果。药物疗效问题面临耐药严重、药物不良反应评估不全面及个性化用药带来的挑战。由此，药物基因识别成为当前的重要研究课题之一。\n\
    \n药物基因识别从复杂系统的整体网络水平，利用分子生物学技术和人工智能技术评估患者用药后基因表达水平变化进而识别患者与药物相关的基因，即人的药物代谢基因、药物应答（药效）基因、药物副反应相关基因，明确不同人群的基因差异，预测患者对不同药物的应答情况和不良反应程度。它属于精准治疗的范畴，打破了传统的试药模式，能更科学地辅助医生为患者选择最适合的药物。\n\
    \n网络水平是以生物网络之间相互作用或相互关系为研究基础，其中，尤为重要的是蛋白质相互作用网络。蛋白质之间相互作用是生物过程的内在特性，蛋白质相互作用网络解释了基本的细胞机制。蛋白质网络能描绘和整合蛋白质组中域结构、翻译后修改、相互作用网络和疾病相关的每一个蛋白。表达谱描绘了特定细胞或组织在特定状态下的基因表达种类和丰度信息，动态地诠释了基因的功能、状态和环境等信息。它整合了蛋白质网络和基因表达谱来挖掘多种疾病相关的细胞机制。miRNA在转录后水平上调控靶基因mRNA，蛋白质从mRNA模板通过高度保守的过程进行合成，所以miRNA调控着蛋白质编码基因，据估计，miRNA调控人类基因组中超过三分之一的蛋白质基因。蛋白质相互作用网络结合基因表达谱能够识别基因间特殊关联，进而识别生物通路相关关键基因和功能模块。进一步整合miRNA表达谱诠释miRNA表达改变与它靶向靶基因之间的关联，故而大量研究也表明，miRNA的功能能够通过解析miRNA调控的蛋白质网络发掘。近年来，随着高通量测序技术的发展，多组学数据呈爆炸性增长，尤其是miRNA组学、蛋白质组学、基因组学与代谢组学，为基于数据挖掘全面了解药物学提供了坚实的数据基础。生物网络模型历经十多年的发展，成为多组学数据挖掘新方法的重要分支，有望从网络水平在药物疗效上产生新突破，助力发现药物作用新靶标和新治疗策略的研究。\n\
    \n（2）药物代谢酶。\n\n药物用药指导基因检测通常包括检测与药物代谢和药效相关的酶：如细胞色素P450（cytochromeP450或CYP450，简称CYP450）家族基因、UGT家族基因、GST家族基因、ABCB家族基因、SLCO家族基因等。这些酶主要存在于肝脏、小肠、脑和肺等组织中，参与药物代谢、转化、消除以及药物效果调控等过程，调节机体对药物反应。通过基因检测可以了解患者体内的药物代谢能力和细胞对药物作用的敏感程度，从而在用药时针对性地进行用药调整，提高治疗效果和减少药物不良反应。下面对CYP450家族基因重点介绍。\n\
    \nCYP450代表着一个很大的可自身氧化的亚铁血红素蛋白家族，属于单氧酶的一类，因其在450nm有特异吸收峰而得名。它参与内源性物质和包括药物、环境化合物在内的外源性物质的代谢。根据氨基酸序列的同源程度，其成员又依次分为家族、亚家族和酶个体三级。细胞色素P450酶系统可缩写为CYP，其中家族以阿拉伯数字表示，亚家族以大写英文字母表示，酶个体以阿拉伯数字表示，如CYP2D6、CYP2C19、CYP3A4等。人类肝细胞色素P450酶系中至少有9种P450与药物代谢相关。肝脏的细胞色素P450系统在药物的代谢中起着重要作用，它将药物由疏水型转化为更易排泄的亲水型。生物转化反应一般可分为细胞色素P450依赖的Ⅰ相和Ⅱ相结合反应。"
  fmt: '

    此外，大多数生物学特征是连续变量，将这些特征简化为分类和/或离散变量对于其在临床决策中的使用是必要的。然而，生物标志物的开发通常是一维的、定性的，并且不能解释肿瘤细胞，或组织的复杂信号传导和细胞网络。基于人工智能的常规苏木精和伊红（H&E）染色后，多个亚视觉形态计量学特征的自动提取，仍然受到采样问题和肿瘤异质性的限制，但可以帮助克服主观视觉评估的局限性，并整合多个测量，以捕捉组织结构的复杂性。这些组织病理学特征可能与其他放射学、基因组学和病理学测量结合使用，以提供更客观、多维和功能相关的诊断输出。


    随着机器学习技术，特别是深度学习技术的出现和图形处理单元的发展，使用人工智能技术的大数据分析现在在各个领域，包括医学领域都很普遍。它在医学领域的引入允许对生物现象进行更客观的分析，这些现象天生复杂和多样，需要仔细确定从分析中获得的结果的普遍性。在这样一个学术领域，如果科学讨论只涉及有限的数据，那么就很难理解一个现象的完整图景，很容易陷入“树木看不到森林”的状态。相比之下，使用人工智能技术的大规模数据分析将更客观、不遗漏地阐明生物现象，它有望对医学的进步做出巨大贡献。


    有人使用傅里叶变换红外光谱测量血清样本，并使用深度学习分析结果，以显示其在区分健康个体、过敏患者和接受过敏原特异性免疫治疗的患者的血清方面的潜力。


    有人利用贝叶斯网络构建了一个代表基因-基因相互作用的上皮-间充质过渡（EMT）网络，表明该EMT网络的样本特异性边缘贡献值模式是肺癌患者的生存率，且使用一个公开的数据集\[癌症基因组图谱（TCGA），重点是肺腺癌（LUAD）\]。有人通过结合深度学习和机器学习的多组学分析，成功地对预后良好和不良组进行了分类，并成功识别了有助于LUAD患者生存的基因。高桥等人通过结合深度学习和机器学习，分析由6类TCGA组成的多组学数据集，根据预后（差或好）对肺癌患者进行了分类。


    ## 5.8　临床决策


    临床决策是一个复杂的过程，可以用最初在认知科学中发展起来的双过程理论来建模。双过程理论指出，临床决策涉及两种不同的途径：第一种是直观的，通常被描述为潜意识的、非语言的和自主的，第二种是分析性的，被描述为有意识的、语言的和深思熟虑的。


    面对复杂的临床问题，即使受过相同培训的病理学家之间也可能出现意见分歧，导致诊断不一致的情况。这个问题的本质很可能是，多因素和有效的解决方案仍然难以确定。此外，非侵入性或微创手术获取诊断样本的广泛使用，大大降低了所获得样本的大小和质量，使病理学家的工作更具挑战性。与其相反，这种困难伴随着对进行精细诊断的需求不断增加，包括报告具有预后或预测价值的变量。即使使用更客观的分子分析策略，频繁的限制也会使疾病过程的生物学驱动因素的明确诊断或表征复杂化。患者偏好和报销考虑因素也会对诊断过程产生很大影响，临床团队应谨慎行动。因缺乏标准，伴随诊断分析和用于指导治疗决策的生物标志物的可变性进一步加剧了这些问题，但也是样本中空间和/或时间生物异质性的结果。


    参与临床决策的医生所期望的一些特征，如理性、批判性思维、反思和沟通技巧，都属于分析途径。与直观路径相关的其他特征，如认知和情感偏见，当它们没有被正确地理解和管理时，可能会对临床判断构成威胁。


    人工智能可能是帮助临床决策医生的一个有价值的工具，特别是因为在大多数国家的医疗培训中，专门针对临床决策和解决问题的医学课程很少或不存在。人工智能不仅可以指导临床医生进行推理，而且可以帮助他们更多地意识到自己的认知和情感偏见。


    除了临床决策之外，人工智能在临床医学中的应用还提出了一个关于医学本质的更具理论性的问题。在20世纪，由于科学和技术的进步，医学成为一门艺术和一门科学。这种双重身份的一个很好的证明是，尽管循证医学被广泛接受，但仍得到专家意见的补充。如今，医学人工智能的出现从根本上将医学与一般的硬科学，特别是数学和计算机科学联系起来。


    总之，在药物化学和药物发现中，最好的人工智能不一定是能够自主设计新药的单个人工智能，而是多个不同的人工智能。在药物发现过程中，从靶标选择、先导物确定、高通量筛选到临床前研究和临床试验，人工智能能够更好地理解和设计新的输入。


    虽然人工智能并不是所有挑战的答案，但它是一种有用的工具，如果使用得当，可以有效提高药物研发效率并推动新的发现。


    # 第6章


    ## 人工智能辅助药物基因识别


    药物进入体内需要经过吸收、分布、代谢、排泄等一系列复杂的过程，单一地研究某一方向无法诠释这一生命问题。药物基因识别是一种通过分析个体基因组信息来预测药物反应的科学方法。随着基因检测技术的不断发展，整合多组学信息和生物网络识别药物基因识别成为可能。药物基因识别作为一种新兴的医学技术，在未来的临床应用将越来越广泛，为患者带来更为精确和个性化的药物治疗方案。本章综述了多组学数据和生物网络，介绍了药物代谢和药效相关基因，并给出人工智能的药物基因识别方法和应用实践。


    ## 6.1　多组学数据和生物信息软件


    ### （1）多组学数据


    多组学是测序技术的产物，它通常包括基因组学、转录组学、蛋白质组学、代谢组学、表观组学等多个维度数据。在现代生物学领域，多组学迅猛发展解决了单一组学数据对于探究生物学问题的单一局限性，使生物体问题从多维度信息进行表征。


    多组学数据之间的级联关系见图6-1。


    ![](Images/figure_0127_0023.jpg)


    图6-1　多组学数据之间的级联关系


    基因组学是对生物体所有基因进行集体表征、定量研究及不同基因组比较研究的一门交叉生物学学科。基因组学主要研究基因组的结构、功能、进化、定位和编辑等，以及它们对生物体的影响。基因组学的目的是对一个生物体所有基因进行集体表征和量化，并研究它们之间的相互关系及对生物体的影响。基因组学还包括基因组测序和分析，通过使用高通量DNA测序和生物信息学来组装和分析整个基因组的功能和结构。


    转录组学是指一门在整体水平上研究细胞中基因转录的情况及转录调控规律的学科。转录组学是从RNA水平研究基因表达的情况，转录组即一个活细胞所能转录出来的所有RNA的总和，是研究细胞表型和功能的一个重要手段。以DNA为模板合成RNA的转录过程是基因表达的第一步，也是基因表达调控的关键环节。所谓基因表达，是指基因携带的遗传信息转变为可辨别的表型的整个过程。与基因组不同的是，转录组的定义中包含了时间和空间的限制。同一细胞在不同的生长时期及生长环境下，其基因表达情况是不完全相同的。


    蛋白质组学是以蛋白质组为研究对象，研究细胞、组织或生物体蛋白质组成及其变化规律的科学，本质上指的是在大规模水平上研究蛋白质的特征，包括蛋白质的表达水平、翻译后的修饰、蛋白与蛋白相互作用等，由此获得蛋白质水平上的关于疾病发生、细胞代谢等过程的整体而全面的认识。蛋白质之间互相作用是必不可少的，它是细胞进行一切代谢活动的基础。


    代谢组学是对生物体内所有代谢物进行定量分析，并寻找代谢物与生理病理变化的相对关系的研究方式，是系统生物学的组成部分，其研究对象大都是相对分子质量1000以内的小分子物质。代谢组学的概念来源于代谢组，代谢组是指某一生物或细胞在一特定生理时期内所有的低分子量代谢产物，同时对其进行定性和定量分析的一门新学科，它是以组群指标分析为基础，以高通量检测和数据处理为手段，以信息建模与系统整合为目标的系统生物学的一个分支。


    人类miRNA组学：miRNA是一类长度为20～24nt的高度保守的内源性小分子RNA，在转录后水平上调控基因表达。miRNA通过与mRNA靶向结合，抑制蛋白质的合成，实现对基因的表达控制。据估计，miRNA调控了人类60%的转录过程。miRNA通过序列特异性的RNA基因沉默作用调节参与了多种生物过程。现有研究已发现miRNA参与了细胞增殖发育、组织分化、细胞循环和细胞凋亡等。比如miRNA与植物胚芽和叶的发育、人和鼠的细胞发育、神经细胞的生长发育以及神经干细胞向神经细胞的转化等密切相关；miRNA与一些疾病有密切关系，如精神分裂症、帕金森综合征和其他神经异常症状、白血病、糖尿病、艾滋病、心肌肥大和老年痴呆等常见疾病，更重要的是随着进一步研究发现，超过50%的人类miRNA被定位于与癌症相关的基因片断区域，其中包括乳腺癌、肺癌、直肠癌、皮肤癌、鼻咽癌、卵巢癌以及神经细胞癌等，最近研究也说明miRNA在药物作用后体内分子水平起到重要调节作用。综上所述，miRNA在人类疾病的诊断、治疗、预后以及评估疗效方面扮演者重要角色。


    miRNA生成加工机制（图6-2）：首先pri-miRNAs在核内通过Rnase Ⅲ核酸酶Drosha加工成pre-miRNAs，然后在Exportin-5的协助下从核内输出。pre-miRNAs长度为60-90nt，二级结构呈茎环组成的发夹结构，在细胞质中核酸酶
    ⅢDicer作用下，从pre-miRNA的发夹茎上剪切下miRNA：miRNA∗双链体，然后Dicer单独或者在酶Drosha帮助下，将miRNA：miRNA∗双链体劈开，来自该双链的成熟miRNA掺入沉默复合物，进而发挥其生物学功能，而miRNA∗序列则衰退。带有miRISC功能的成熟miRNAs通过部分碱基配对来预测靶mRNAs和衰退产物miRNA∗，在某种情况下，miRNA和miRNA∗都行使功能。


    miRNA通过与靶基因mRNA序列互补实现对其调控作用。miRNA对mRNA转录后调控主要有两种方式：①通过RNA介导，与靶基因mRNA几乎完全互补方式结合，从而引发基因沉默；②miRNA以不完全互补配对方式与mRNA序列互补，对靶基因mRNA起到翻译抑制作用。miRNA与靶基因作用的方式在动物和植物中截然不同。通常，第一种方式发生在植物中，而在动物体中更多的是第二种方式。miRNA对mRNA调控机制如图6-3所示。


    ![](Images/figure_0129_0024.jpg)


    图6-2　miRNA生成机制


    ![](Images/figure_0129_0025.jpg)


    图6-3　miRNA对mRNA调控机制


    miRNA作为非编码RNA，在药物多组学研究中占有重要角色，是疾病治疗和药物治疗重要生物标志物，一滴血就可以诊断疾病和分析药物疗效。通过miRNA表达水平差异分析药物安全，实现个性化精准治疗。以miRNA为生物标志物的药物基因识别已经成为药物研究热点之一（表6-1）。


