- raw: '最后，根据利福平作用肝脏的差异显著基因和人类蛋白质互作网络构建利福平相关蛋白质互作网络。


    4）识别利福平相关功能模块。


    我们采用基于模拟退火和线性规划算法的两个软件jActiveModules和BioNet识别利福平相关功能模块。


    BioNet识别最大子网的流程为：首先，加载输入数据，包含结点、结点属性文件和蛋白质网络；其次，获得结点属性中的结点P值，如果有多P值的，通过函数aggrPvals（pvals,
    order=1，plot=FALSE）合并P值；再次，根据P值给每个结点打分，打分函数为scoreNodes（network, fb, fdr），其中，FDR是控制模块大小的的阈值，是调节信号噪声分解的一个阈值，这里我们分别设定FDR为0.01、0.001和0.0001来选定功能模块规模；最后，根据打分采用子网识别函数runFastHeinz（network,
    scores）生成最大子网，并通过函数plotModule（module, scores=scores, diff.expr=logFC）显示子网，其中logFC为倍数变化（Fold
    change），它是样本处理前后表达值之间的比值，其中，正值表示表达水平上调，负值表示表达水平下调。


    为了避免偏私，使我们的结果根据有一般性，实现多个模块的提取，我们同时采用了jActiveModules软件。jActiveModules是采用模拟退火算法的功能子网提取方法，它的特点是可以设置搜索深度、网络结点重复率和选取的模块数量。在这里，我们设置搜索深度为2，网络结点重复率为10%，选取模块数量为5个模块。


    5）功能模块的富集分析。


    根据我们的样本和研究目的，我们主要考查了包含“代谢”和“药”相关的GO条目。KEGG则提供了关键的生物通路，它把基因及表达信息作为一个整体网络进行研究，包括细胞生化过程如代谢、膜转运、信号传递、细胞周期，以及同系保守的子通路等信息；另外还包含关于化学物质、酶分子、酶反应等信息。我们的数据根据KEGG分析结果，按照评估其参加各生物过程的P值进行排序，考察排名靠前的功能通路。


    6）差异显著miRNA识别及功能分析。


    差异显著miRNA识别及功能分析分为几步：首先，miRNA表达谱采用t检验分析基因显著性分析，选取p＜0.05为阈值，提取差异显著基因；其次，对这些差异表达基因预测靶基因，为了降低靶基因预测存在的假阳性，我们采用了Targetscan,
    miRanda, PicTar和miRTarBase几种靶基因预测软件，为了去除靶基因预测软件中存在的假阳性问题，Tar⁃getscan采用的P值阈值为0.05，miRanda的P值阈值为0.01，PicTar假阳性较低，不设置阈值，将它们的识别结果取交集。在靶基因预测前，我们需要将基因号转换为基因符号进行转换，这里我们采用BiomaRt库，BiomaRt提供了基因注释数据的广泛查询服务，参考数据库为hsapiens
    gene ensembl database；再次，miRNA的靶基因与功能模块中结点取交集，并保留他们之间的相互作用关系，构建利福平相关的miRNA调控的蛋白质互作网；最后，对每一miRNA调控的靶基因采用GO和KEGG进行功能分析，进而分析miRNA的潜在功能。


    （2）数据分析方法。


    1）利福平作用于肝脏相关蛋白质网络（图6-6）。


    ![](Images/figure_0143_0042.jpg)


    图6-6　利福平作用于肝脏相关蛋白质网络


    **注**　颜色代表变化倍数（logFC），红色代表上调基因，绿色代表下调基因，颜色的深浅代表差异显著程度的变化，颜色越深，差异显著程度越大。


    2）功能模块的提取结果及分析。


    为了提取网络中紧密互连的差异表达显著的功能模块，我们选用的软件是jActiveMod⁃ules和BioNet。采用BioNet构建的最大功能子网包含84个基因和89个相互作用关系，为了取得更多的模块，我们采用jActiveModules识别功能模块，设置选取模块个数为5个，识别深度2，模块间结点重复率为0，结果识别了5个包含31个结点和36个相互作用关系的子网。正如我们预料的一样，两种算法识别结果是一致的，其中jActiveModules的结果与BioNet结果重复率达到92%。基于BioNet和jActiveModules利福平调控的蛋白质网络功能模块见图6-7。


    ![](Images/figure_0144_0043.jpg)


    图6-7　基于BioNet和jActiveModules利福平调控的蛋白质网络功能模块


    **注**　颜色代表变化倍数（log FC），红色代表表达水平上调，绿色代表表达水平下调；颜色的深浅代表差异显著程度的变化，颜色越深，差异显著程度越大；结点形状代表结点分数，圆形代表分数为负值，方形代表分数为正值。


    最大功能模块的84个结点基因的P值（P-value）、基因表达水平变化倍数（logFC）和错误发现率（false discovery rates, FDR）见表6-3。


    表6-3　最大功能模块的84个结点基因


    ![](Images/figure_0145_0044.jpg)![](Images/figure_0146_0045.jpg)![](Images/figure_0147_0046.jpg)


    3）利福平作用于肝脏功能模块富集分析。


    如上所述，jActiveModules的结果与BioNet结果重复率达到92%，所以，我们选用包含更多结点的BioNet识别的最大功能子网作为研究对象。排名前20的GO项目和排名前10的KEGG生物通路如表6-4所示。


    表6-4　功能模块排名前20的GO项目和排名前10的KEGG生物通路


    ![](Images/figure_0148_0047.jpg)


    因为我们主要考察利福平药物代谢功能，所以，对于GO条目，我们主要考察“代谢”和“药”作为关键字的GO条目，而KEGG也采用P值进行排序，重点考察排名前五的生物通路。利福平调控蛋白质网络最大功能网络富集解析结果如表6-5所示。


    表6-5　利福平调控蛋白质网络最大功能网络富集解析结果


    ![](Images/figure_0149_0048.jpg)


    结果表明，最大功能模块为7个功能富集通路：药物反应、代谢细胞色素P450的外源性物质、视黄素代谢、药物代谢、亚油酸代谢、癌症通路和黏着斑。在这些条目中，视黄素代谢、药物代谢、亚油酸代谢包含很多相似基因，因为这三者功能具有一定相似性。更重要的是，这些功能通路与很多之前研究报道的利福平诱导的功能通路是一致的。例如，利福平影响肝脏药物处置和代谢，并且潜在地诱导了药物代谢酶，而且，利福平是一个抑制剂，快速地防止靶向癌症细胞的血管生成和有丝分裂基因。


    从表6-5可以看出，一共有19个基因设计7个功能通路。为了进一步分析这些基因和功能通路，我们构建了基于这19个基因的最大功能模块扩展子网，子网包含50个结点和53个相互作用，见图6-8。


    4）关键miRNA识别及功能分析。


    我们采用P值小于0.05来筛选差异基因，共取得20个差异表达miRNA，表达水平上调miRNA 12个，表达水平下调miRNA 8个，见表6-6。


    值得注意的是，UGT1A4、ADH6、CYP1A1、CYP2C19、CYP2C9和CYP2E1与外源性物质代谢、药物代谢、视黄醇代谢，以及亚油酸代谢相关。BIRC3、CAV1、CAV2、FN1、ITGA1和THBS1都与黏着斑、导致反血管增生和抗肿瘤相关。结果表明，利福平通过UGT1A4、ADH6、CYP1A1、CYP2C19、CYP2C9和CYP2E1诱导药物代谢。另外，结果表明利福平能够通过调控BIRC3、CAV1、CAV2、FN1、ITGA1和THBS1影响抗血管生成和抗肿瘤过程。已经有研究表明UGT1A4、CYP1A1、CYP2C19、CYP2C9和CYP2E1是药物代谢酶，并且ADH6调控药物依赖风险。BIRC3可抑制抵消癌变活动。CAV1和CAV2与肿瘤生长和生成相关。FN1是一些癌症的潜在标志，ITGA1和THBS1与癌症风险相关。


    ![](Images/figure_0150_0049.jpg)


    图6-8　19个关键基因和7个功能通路相关的扩展子网


    表6-6　差异显著miRNA


    ![](Images/figure_0150_0050.jpg)


    接下来，我们预测了差异表达miRNA的靶基因，得到的miRNA调控靶基因对中，我们重点考察包含在最大功能模块中的靶基因及miRNA对，共包含21个miRNA和靶基因对，由此，我们构建了利福平作用于肝脏相关的miRNA调控蛋白质网络，如图6-9所示，网络具体信息见表6-7。


    ![](Images/figure_0151_0052.jpg)


    图6-9　利福平作用于肝脏相关的miRNA调控蛋白质网络


    表6-7　miRNA调控的蛋白质互作网络


    ![](Images/figure_0151_0053.jpg)


    我们一共提取了14个miRNA和8个基因，每个基因都被多个miRNA所调控。由于miRNA通过与靶基因结合或抑制蛋白质翻译来调控靶基因表达，miRNA调控的蛋白质网络能够揭示miRNA调控蛋白质相互作用的新规则。因此，我们识别了miRNA的潜在功能，如表6-8所示。


    表6-8　miRNA潜在功能


    ![](Images/figure_0152_0055.jpg)


    如表6-8所示，12个miRNA通过调控8个基因与6个生物通路相关。这些生物通路包括：药物反应、代谢细胞色素P450的外源性物质、药物代谢、亚油酸代谢、癌症通路和黏着斑。研究结果建议，miR-335通过负调控CYP2E1影响药物代谢，其中CYP2E1为药物代谢酶，大量研究表明它被利福平所影响，因此，我们推测利福平通过改变miRNA表达来影响药物代谢酶CYP2E1的表达。MiR-186调控两个基因，分别为CEBPA和CREBBP，这两个基因与癌症通路相关。MiR-186、miR-769、miR-95、miR-202和let-7g也与癌症通路相关。利福平通过调控多个miRNAs表达抑制了血管生成和有丝分裂，这些miRNA包含：miR-34b、miR-886-3p、miR-218、miR-576-3p、miR-200c、miR-616、miR-660、miR-335和miR-92a，再通过这些miRNA进一步调控BIRC3、CAV1、CAV2、FN1、ITGA1和THBS1这些基因的表达。


    5）与其他相关算法比较。


    Matthew等人提出的方法首先识别了差异显著miRNA，然后通过靶基因预测，构建了miRNA调控靶基因网络，以腹部主动脉瘤研究为例，识别了8个差异显著miRNA和其调控的222个基因。Liu等人提出的方法首先选取差异表达miRNA，然后通过靶基因预测选取靶基因，并构建了miRNA与靶基因的共表达网络，对重要miRNA和基因节点进行分析识别，从而发现重要生物标志物，该方法以酒精肝为例，发现了26个miRNA和878个差异表达基因，重点分析了共表达网络中6个miRNA结点和2个基因结点。Zhang等人整合基因表达谱数据和蛋白质网络数据，构建了差异表达基因相关的蛋白质网络，然后采用模块识别算法，识别了重要功能模块和基因，算法以冠状动脉疾病为例，结果识别了10个关键模块，包含4个与GO条目相关基因和12个中心结点基因。


    本文提出的miRFun omi通过整合基因表达谱数据和蛋白质网络数据获取更多的特定条件相关的分子机制信息，并采用模块提取算法选取差异表达显著模块，然后，通过靶基因预测方法筛选差异显著miRNA调控的靶基因，并构建miRNA调控的靶基因网络，从而分析miRNA功能。可见，我们的方法整合了更多的生物资源，相对于上述算法理论依据更充分，对miRNA功能识别准确率更高。


    （3）基因诱导的药物基因识别。


    整合多组学的miRNA功能识别方法是切实可行的，并且我们在利福平作用于肝脏实例的验证下，识别了一系列的重要功能模块、关键基因和miRNA的功能，这说明我们的方法具有以下优势。


    1）可靠的理论依据。


    miRNA参与了一系列重要的生命过程，包括细胞生长、组织发育、细胞增殖和凋亡等，并且与肿瘤的发生、诊断、治疗和预后密切相关，它调控了人类60%的转录过程和超过三分之一的蛋白质基因，我们就是在此理论基础上，提出结合了蛋白质组学、基因组学和RNA组学的miRNA表达谱、基因表达谱和蛋白质网络整合方法来分析miRNA功能。


    2）有效的处理方法。


    我们提出的miRFun omi方法中采用了t检验方法、功能模块识别方法、基因功能富集解析方法和miRNA靶基因预测方法等。为了使我们的方法更具有普遍性，功能模块识别采用了基于线性规划算法和模拟退火算法的最大功能模块识别和多模块识别的两种方法，并对结果进行综合考虑；富集解析采用了关键字和P值相结合方法，既分析了生物功能又关注了涉及的生命通路；为了防止miRNA靶基因预测过程中的假阳性，采取了多预测结果取交集的方法。


    3）利福平作用于肝脏组织实例验证。


    以利福平作用人体肝脏组织为研究对象，采用miRFun omi方法，我们识别了利福平相关的涉及84个基因89相互作用关系的功能模块；找到19个基因及其相关7个生命通路；构建了涉及14个miRNA的21个miRNA-靶基因对的利福平相关miRNA调控蛋白质网络；识别了12个miRNA通过调控8个基因与6个生物通路相关。重要的是，我们的识别结果得到大量研究文献的证实。


    本章提出了基于蛋白质组学、基因组学和RNA组学的miRNA功能识别方法。该方法通过整合蛋白质网络、基因表达谱和miRNA表达谱构建特定条件下蛋白质网络，并提取了功能模块，通过多生物通路和生物功能相关资源数据库基础上的富集解析，识别了特定状态下关键基因和miRNA。另外，本节以利福平作用于肝脏组织为研究对象，采用miRFun
    omi方法分析利福平作用于肝脏引起的一系列生物通路作用，以此识别关键的生物功能模块，并通过对基因富集分析，找出起关键作用的基因和miRNA。结果发现，有19个基因和7个关键通路与利福平作用人体肝脏后生命活动相关，7个功能富集通路为药物反应、代谢细胞色素P450的外源性物质、视黄素代谢、药物代谢、亚油酸代谢、癌症通路和黏着斑；并且，通过构建和分析miRNA调控的蛋白质网络，我们发现有12个miRNA通过调控8个靶基因参与了利福平作用肝脏的6个重要生物通路：药物反应、代谢细胞色素P450的外源性物质、药物代谢、亚油酸代谢、癌症通路和黏着斑。我们的结果表明，利福平作用于人体肝脏导致了一系列的miRNA和基因表达水平发生改变，进而诱导了多个生物通路。这项研究不仅对利福平作用肝脏涉及的蛋白质网络中的功能模块研究提供了新方法，而且，这种整合了基因表达谱、miRNA表达谱和蛋白质网络的方法同时对利福平诱导的药物处置方面的研究提供了新思路。


    ## 6.5　miRNA诱导的药物基因识别


    上一节提出识别方法是从基因角度出发的miRNA功能预测，本节从miRNA出发，整合蛋白质网络解析miRNA和基因功能。该方法结合miRNA和mRNA表达谱，从差异表达miRNA出发，预测它们的靶基因，筛选miRNAs调控的负相关表达基因，整合PPI网络构建立利福平相关的miRNA调控的负相关表达蛋白质互作网络（miRNA-regulated
    negative-expressed protein interaction network, MNePIN），通过功能富集分析评估每个潜在功能的基因，预测人体肝脏内利福平调控的miRNA的功能，以进一步揭示利福平调控的miRNA的功能及其在人肝细胞中的潜在分子机制。技术路线如图6-10所示。


    ![](Images/figure_0155_0056.jpg)


    图6-10　技术路线图


    （1）数据处理方法。


    miRNA诱导的整合网络解析的功能基因识别方法如下：


    1）对基因表达谱和miRNA表达谱采用Benjamini-Hochberg校正法计算假发现率（FDR），用不配对的双尾t检验计算两组（正常和利福平处理的样本）的每个miRNA和每个基因的P值。


    2）定义p＜0.01时的miRNA有统计学意义，为差异表达miRNA。利用BioMart将基因Entrez ID转化为基因Symbol，采用RmiR软件预测差异表达miRNA靶基因，使用的靶基因方法包括Targetscan、miRanda和PicTar。


    3）人类蛋白参考数据库（HPRD）包含30047个蛋白和41327个蛋白相互作用，人肝蛋白相互作用网络（HLPN）包含2582个与人肝相关的蛋白之间的3484个相互作用。本节将整合HPRD和HLPN的蛋白质整合和相互作用，去除重复，使用cytoscape
    version 3.0.2软件生成蛋白质互作网络。


    4）整合miRNA差异基因、负调控靶基因和人类蛋白质互作网络共同构建利福平相关蛋白质互作网络，构建利福平相关的miRNA调控的负相关表达蛋白质互作网络MNePIN。


    5）利用基因生物解释工具DAVID对MNePIN的生物学过程和通路进行富集分析。利用GO和KEGG对重要基因通路进行功能分类，预测功能miRNA和靶基因。


    （2）数据结果分析。


    1）构建MNePIN。


    差异表达的miRNAs根据P值（p＜0.01）进行检索。上调和下调的miRNA分别通过阈值大于1（Fold Change＞1）和阈值小于1（Fold Change＜1）进行识别，最后识别20个miRNA，其中12个miRNA表达上调，8个miRNA表达下调（表6-9）。


