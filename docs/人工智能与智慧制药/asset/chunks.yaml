    ## 4）识别利福平相关功能模块


    我们采用基于模拟退火和线性规划算法的两个软件`jActiveModules`和`BioNet`识别利福平相关功能模块。


    `BioNet`识别最大子网的流程为：首先，加载输入数据，包含结点、结点属性文件和蛋白质网络；其次，获得结点属性中的结点 P 值，如果有多 P 值的，通过函数`aggrPvals(pvals,
    order=1, plot=FALSE)`合并 P 值；再次，根据 P 值给每个结点打分，打分函数为`scoreNodes(network, fb, fdr)`，其中，`FDR`是控制模块大小的的阈值，是调节信号噪声分解的一个阈值，这里我们分别设定`FDR`为
    0.01、0.001 和 0.0001 来选定功能模块规模；最后，根据打分采用子网识别函数`runFastHeinz(network, scores)`生成最大子网，并通过函数`plotModule(module,
    scores=scores, diff.expr=logFC)`显示子网，其中`logFC`为倍数变化（Fold change），它是样本处理前后表达值之间的比值，其中，正值表示表达水平上调，负值表示表达水平下调。


    为了避免偏私，使我们的结果根据有一般性，实现多个模块的提取，我们同时采用了`jActiveModules`软件。`jActiveModules`是采用模拟退火算法的功能子网提取方法，它的特点是可以设置搜索深度、网络结点重复率和选取的模块数量。在这里，我们设置搜索深度为
    2，网络结点重复率为 10%，选取模块数量为 5 个模块。


    ## 5）功能模块的富集分析


    根据我们的样本和研究目的，我们主要考查了包含“代谢”和“药”相关的`GO`条目。`KEGG`则提供了关键的生物通路，它把基因及表达信息作为一个整体网络进行研究，包括细胞生化过程如代谢、膜转运、信号传递、细胞周期，以及同系保守的子通路等信息；另外还包含关于化学物质、酶分子、酶反应等信息。我们的数据根据`KEGG`分析结果，按照评估其参加各生物过程的
    P 值进行排序，考察排名靠前的功能通路。


    ## 6）差异显著 miRNA 识别及功能分析


    差异显著 miRNA 识别及功能分析分为几步：首先，miRNA 表达谱采用 t 检验分析基因显著性分析，选取`p < 0.05`为阈值，提取差异显著基因；其次，对这些差异表达基因预测靶基因，为了降低靶基因预测存在的假阳性，我们采用了`Targetscan`,
    `miRanda`, `PicTar`和`miRTarBase`几种靶基因预测软件，为了去除靶基因预测软件中存在的假阳性问题，`Targetscan`采用的
    P 值阈值为 0.05，`miRanda`的 P 值阈值为 0.01，`PicTar`假阳性较低，不设置阈值，将它们的识别结果取交集。在靶基因预测前，我们需要将基因号转换为基因符号进行转换，这里我们采用`BiomaRt`库，`BiomaRt`提供了基因注释数据的广泛查询服务，参考数据库为`hsapiens
    gene ensembl database`；再次，miRNA 的靶基因与功能模块中结点取交集，并保留他们之间的相互作用关系，构建利福平相关的 miRNA
    调控的蛋白质互作网；最后，对每一 miRNA 调控的靶基因采用`GO`和`KEGG`进行功能分析，进而分析 miRNA 的潜在功能。


