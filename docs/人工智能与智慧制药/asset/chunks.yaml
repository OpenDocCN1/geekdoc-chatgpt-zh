- raw: '人工智能在药物治疗中的目的是将数据减少到医生可以解释的规模，让临床医生获得他们以前无法考虑的信息。且人工智能辅助的医疗行为要足够透明，并简单易懂，以便应用人员能理解它们。不幸的是，这种简化通常是以降低预测能力为代价的。基于人工智能的决策支持解决方案具有更高的准确性，但透明度较低。人们对使用所谓的黑箱模型感到非常焦虑，因为它们的决策过程很难被患者理解，如果它们被证明是成功的，并且患者存活率增加，那么这种压力可能得到缓解。所以必须进行广泛的试验来证明任何医学黑箱模型的预测能力，因为这类软件通常缺乏可解释性。


    在临床应用之前，必须证明这些模型能够无可辩驳地改善患者的预后。深度学习的选择和优化药物治疗的引入和更广泛的使用，将使模型更难以实现透明度。我们必须学会信任我们的机器提供的决定和建议，就像孩子们必须学会信任他们父母的决定一样。


    深度学习已经彻底改变了计算机视觉、机器人技术、游戏和自然语言处理等领域。它正在基因组学、医学诊断和计算化学方面迅速取得进展。深度学习的核心是一套可推广的技术，它们在推断复杂关系时利用大规模数据蓬勃发展。虽然新兴的神经网络在预测广泛的分子特性方面表现优于最先进的模型，但迄今为止，由于缺乏训练数据，它们的使用仅限于单个分子。


    早期机器学习在癌症和药物发现中的应用只关注一种类型的基因组谱。2012年，梦想联盟发起了一项药物敏感性挑战，集成了多种组学测量。在44种基于人工智能的方法中，表现最好的模型包括贝叶斯多任务多核学习和基于集成的方法。在另一个公开的挑战中，31种建模方法在预测药物对活性方面进行了竞争。虽然这些方法的表现明显优于偶然性，但没有一种是接近最优的方案。由于这两个挑战都集中以排序作为评价指标，它们的结果不能直接与实验室研究相比较。此外，它们的样本量小，分别为29对和91对药物单一药物，可能具有实际意义。


    对患者疾病的理想治疗药物，要考虑到来自患者的所有相关医疗信息，包括基因组学或蛋白质组学数据，与描述药物特性的特征相结合，通常有必要预测药物与生物分子的相互作用，如蛋白质、DNA、RNA、MicroRNA等生物分子的相互作用。这种系统的临床应用将需要这些方法的结合，特别是对于常见的复杂性疾病。


    对药物-靶点相互作用的预测，是单药治疗优化问题的一小部分，但它也同样重要。预测药物-靶点的相互作用对于现有药物的重新利用和寻找新药物，以及理解相关的信号传导和代谢通路至关重要。预测现有药物的新用途的尝试，往往依赖于通过人工智能引擎解释的基因、转录组学和副作用数据的使用。


    药物-靶点相互作用的预测主要依赖于人工智能技术的两个分支：一个是网络理论方法，输入表征与药物相互作用的蛋白质网络；另一个是机器学习，利用像支持向量机这样的体系，构建一个依赖于药物化学结构和治疗相似性指数的模型，使用支持向量机体系结构来预测新的和意想不到的药物-靶点相互作用。支持向量机是一种机器学习方法，旨在通过在分类变量之间绘制多维曲面来分析它们间的直接关系。


    基于药物的相似性推理，或基于目标的相似性推理，以及基于二部图网络的方法，称为基于网络的推理，可用来预测新的药物-靶点相互作用。基于网络的推理被证明是最强大的方法，可用于测试进一步的数据。它首先对它们的输入、药物结构相似性、蛋白质靶点序列相似性及其输出和药物-靶点相互作用网络拓扑进行相关性分析。这些数据可以用于评估预测。然后，它使用药物结构相似性和蛋白质靶标序列相似性特征，预测未知的药物靶标相互作用网络，其使用的独立的统计方法包括轮廓方法、加权轮廓方法和二部图学习方法等。


    利用与疾病的遗传学或蛋白质组学相关的生物数据，结合化学信息，如QSAR描述符，可使用机器方法开发用于肿瘤决策支持的联合治疗预测引擎，以预测药物组合是否具有协同作用。从整合数据开发的模型应用到独立的药物组合数据集，差异表达基因的预测贡献表明，药代动力学特性与预测协同作用优于物理化学或目标网络属性，但表现最好的模型，得益于有可用的全球系统生物学方法的数据支持，使之有一个更完整的画面。


    ## 5.1　临床研究


    临床试验是新药研发中至关重要的一个环节，虽然一个药物在取得临床实验批件之前，其有效性和安全性已经在实验室和动物实验中经过了系统的研究和论证，但是该药物在人体内是否可以发挥预期的活性以及符合安全性的要求仍然充满了未知数。据估计，在Ⅰ、Ⅱ、Ⅲ期药物开发临床试验中，有33.6%～52.4%的试验无法顺利进入下一阶段。


    患者招募是开展新药临床试验的前提和保证，近年来国内的新药临床试验数量大幅增加，加上临床试验的入组标准不断细化，在严格的招募时间下，是否能按计划招募到符合要求的受试者会很大程度影响临床试验的进度和结果，患者招募也成为临床试验推迟的首要原因。临床试验对于招募患者的资格、适宜性、参与动机和授权方面都有相应的要求，利用人工智能可以对患者的资料进行识别，并与临床试验的要求进行筛选和匹配，可以在很大程度提高患者招募的效率。2020年报道的一项关于人工智能和传统方法在患者招募方面的对比研究，利用人工智能技术Mendel.AI重新模拟了3项已完成的肿瘤相关临床研究患者预筛选工作，结果发现Mendel.AI在保证筛选结果准确度的情况下，相比于标准操作可以筛选到更多潜在的合格受试者，并且可以大大缩短筛选时间，在数小时内即可完成受试者的预筛选，而标准方法则需要花费数十天甚至更长的时间。人工智能在患者招募上的优势已经得到了关注，心力衰竭治疗设备开发商Ancora
    Heart宣布与数字健康公司Egnite建立战略伙伴关系，很大的原因在于Egnite公司开发的人工智能试验加速器可以帮助其识别符合条件的患者以推动其关键性临床试验的开展，这也进一步说明了人工智能在患者招募方面的可靠性。当然人工智能也可用于主动挖掘公开的网络内容，包括数字试验数据库、试验公告和社交媒体，以自动识别特定患者和相关试验之间的潜在匹配关系，可以让更多的患者有可能接触到感兴趣的临床试验项目，为患者招募提供更多的可能性。


    临床试验通常不是为了在普通人群的随机样本中证明药物有效性而设计的，而是为了前瞻性地选择人群中的一个子集，可以更容易地证明受试药物的效果，这一策略被称为临床试验富集。人工智能模型和方法通过FDA确定的下列方法来增强患者队列选择：通过减少人群异质性；通过选择更有可能具有可测量临床终点的患者（预后富集）；通过识别对治疗更有反应的人群（预测富集）。除了用于富集策略，人工智能也被用于参与者分层，例如，如果AI/ML模型可以在给予研究治疗之前预测严重不良事件的概率。根据这些严重不良事件的预测风险，可以将参与者分层到不同的组，然后进行相应的监测，或根据预测的不良事件严重程度将参与者排除在外。


    对于一项临床试验来说，患者招募、选择和分组只是一个开端，只有这些受试患者在整个实验过程中遵守试验程序和规则，并有效可靠地收集监测受试药物的相关数据，临床试验才有可能实现投资回报。据统计，只有15%的临床试验没有出现患者脱落的情况，患者脱落势必带来额外的招募工作，也进一步增加了临床试验的成本。当然患者脱落的原因有很多，包括受试者个体因素、环境因素、试验用药因素、研究者因素和项目流程因素等，而人工智能对于解决患者脱落问题也有相应的应用。例如，在临床试验中患者需要配合记录药物摄入量、身体功能、药物反应等各种数据，对于大部分患者来说这是一项较为烦琐的任务，因此患者的依从性较差。人工智能技术可以与可穿戴技术相结合，为开发节能、移动、实时和个性化的患者监测系统提供了新的策略。可穿戴传感器与视频监控可用于自动连续收集患者数据，从而减轻患者的负担。人工智能还可以用于动态预测特定患者脱落的风险，通过发现不依从性的早期预警信号，项目组可以积极与特定患者进行沟通和干预，在患者脱落前将问题解决。


    人工智能对于临床试验具体方案的改进也有很大的作用，人工智能可用来描述和预测药物给药后的药代动力学性质，因此可以用于剂量和给药方案的优化，对于罕见病、儿童和孕妇用药这些缺少现有数据的特殊群体的用药方案，人工智能可以发挥更大的优势。2023年5月10日，美国食品药品监督管理局FDA发布的一份讨论性报告*Using
    Artificial Intelligence&Machine Learning in the Development of Drug&Biological
    Products*中还提及，人工智能还可用于研究地点的选择、临床试验数据的收集、管理和分析、临床终点评估等新药临床研究环节。


    药物警戒是与发现、评价、理解和预防不良反应或其他任何可能与药物有关问题的科学研究与活动。药物警戒不仅涉及药物的不良反应，还涉及与药物相关的其他问题。虽然在药品上市前的各阶段研究中对药物的安全性已经进行了较为细致的考察，但是由于研究时间有限，对于一些较为罕见的不良反应、长期毒性以及药物在特殊人群（如儿童、孕妇、老人等）中的表现，临床研究阶段可能并不能提供完整的数据，因此药物上市后的安全监测显得尤其重要。个例安全性报告（Individual
    Case Safety Report, ICSR）被用于在药物批准后向药品监管部门报告不良事件，是药品上市后监控潜在药物安全问题的重要数据来源。目前个例安全性报告不良事件数据来源的数量和复杂性均在不断攀升，数据来源可能包括自发报告、临床试验、社交媒体、电话、电子邮件、患者主动登记、索赔数据等，相较于人工识别的费时费力，人工智能在从数据源中获取这些案例之后，可以识别该报告的有效性，并进行案例的优先级排序，此外还能完成重复性检查，并根据报告的内容对其进行分类编码。人工智能不仅可以实现病例的处理，同时还能进行病例评估和病例提交。


    应用实例：美国FDA药品审评与研究中心（CDER）监督与流行病学办公室（OSE）开发了信息可视化平台（Information Visualization Platform,
    InfoViP）用于支持OSE安全性审评员审查数据或内容，形成更深入的见解，给出预测或建议，以便支持上市后安全性监督。InfoViP结合了自然语言处理（NLP）、机器学习（ML）以及先进的数据可视化技术。InfoVip可以通过自然语言处理技术对报告进行自动扫描和识别，并实现相关临床信息的提取和可视化，便于审评人员审评，此外InfoVip可以评估不良事件与药物的因果关系，从而对报告进行分级评估，这样审查员就可以优先对高质量的报告进行审查。InfoVip另一个功能就是剔除重复数据，InfoViP基于NLP的“重复数据删除”算法可以有效地扫描、提取和比较大量ICSR中的众多数据点，自动检测重复报告，并将其提交给安全性审评员进行确认。


    ## 5.2　联合治疗


    联合治疗对治疗复杂疾病很有效。不同药物间的协同作用有助于对抗耐药性疾病菌株和肿瘤，因为这些疗法可以在多个方面攻击疾病。然而，联合治疗可能与毒性增加有关。由于药物的大量和不断增长而导致的组合爆炸，人们需要开发计算方法来选择毒性最小的优化联合治疗。基于人工智能的模型已经被开发出来，用于预测许多疾病中的协同药物组合，包括传染病和癌症。非疾病特异性的联合治疗预测因子也已经被开发出来。这些模型在输入、输出和体系结构上差异很大。


    联合药物治疗自20世纪60年代以来一直被用于癌症治疗。由于各种原因，在大多数情况下比单药治疗更可取。在单药治疗不能克服的情况下，联合药物治疗被证明可以克服患者对抗癌药物的固有耐药性，也可以防止获得性耐药性的产生；也被证明可以导致剂量相关毒性的降低，同时通过添加剂或协同效应增加癌细胞的消除。


    然而，寻找新的有效药物组合是一项复杂的工作，因为存在大量可能的药物组合，而且每次新药开发出来，这个数字就会增加。当前，有效的药物组合的发现，很大程度上是基于医生的经验，因为他们在临床上不断尝试新的治疗组合，但这个过程中，患者的分子数据很少被利用。


    虽然可能的药物组合的空间太大，无法进行详尽的测试，但最近已经有努力通过高通量筛选来衡量药物组合的疗效。两两药物组合的数量是指数级的，数量巨大，详尽地测试可能的组合是不可行的，这显然需要一种数据驱动的方法来发现有效的药物组合。上述来自体外筛选的数据集使这些方法的发展成为可能，目前已经有各种尝试使用机器学习方法来预测抗癌药物的最佳协同组合。


    人工智能辅助药物联合选择策略已开发用于治疗人类免疫缺陷病毒。由于病毒不断产生病毒蛋白酶和逆转录酶的耐药突变，艾滋病毒的治疗变得复杂。这一现象迫使患者定期改变治疗方案，以解决病毒遗传学的变化，并防止病毒载量的增长。药物造成的毒性负荷也必须被最小化。依赖于机器学习的计算方法已被开发出来，以分析这些蛋白质的变化。三种机器学习方法，人工神经网络、随机森林和支持向量机，可根据病毒突变数据和一些添加的临床生物标志物，来预测药物组合给药后的病毒学反应。结果的准确性通过实际结果和预期结果之间的r2值来评估。


    当将基于规则的系统输出作为逻辑回归模型输入时，所得到的结果可与纯机器方法相比较。精度的提高与否，与模型中基于规则的部分有关，因为它在没有基于规则的系统的情况下实现了与逻辑回归类似的结果。在预测精度方面，机器学习方法比基于规则的系统具有更高的性能，支持应用这种不透明的方法来降低复杂生物数据的维数，用于药物治疗选择，可作为辅助建议形式供医生利用。


    预测特定癌症对治疗的反应是现代肿瘤学的一个主要目标，其结果可以作为个性化治疗的依据。通过对基因组异质性癌细胞系潜在活性化合物的活性研究，能够提示基因组改变和药物反应之间的多种联系。已有多种计算方法被提出来预测药物敏感性。为了整合这些互补的计算方法，哈佛医学院Michael
    Menden等人开发了机器学习模型来预测癌细胞系对药物治疗的反应，通过预测半数抑制浓度，对基于细胞系的基因组特征和所考虑过的药物的化学特性进行量化。


    ## 5.3　评估药物反应


    机器学习模型的开发，可以为测量肿瘤药物反应提供一个协同有效的途径。虽然以往的大多数研究都集中在使用经典机器学习方法的单一药物筛选数据上，但大数据库的发布，使适合大规模数据的深度神经网络系统地建模成为可能。


    虽然模型在预测肿瘤细胞系生长和协同药物对排序方面取得了很好的结果，但仍有很大的改进空间。例如，分子特征的贡献可能会随着更多细胞系的加入而增加。另一个没有充分利用的信息来源是药物浓度。现在更需要做的是，寻求将多个单一药物筛选研究，整合到一个统一的剂量反应预测框架中的方法。肿瘤类型和药物作用机制等辅助特性也可以作为多任务模型中的辅助预测靶点来添加。为了了解药物反应模型的普遍性，需要更系统的交叉验证方案来分析它们对新药、细胞系和跨研究的预测能力。


    癌症是一种极其复杂的疾病，一个肿瘤细胞可以发展为亿计的编码区突变，并可能导致耐药性的出现。为了对抗这种巨大的不确定性，联合疗法被开发出来，以同时与多个靶点相互作用。基于已有的细胞生物学知识，虽然一些有前途的药物组合已经可以使用，但许多药物的相互作用机制仍然未知。


    药物反应模型的一个重要应用是在高通量虚拟筛选中。如果一个机器学习模型是准确的，它就可以在推理模式下作为一个计算运行，以降低筛选成本。


    未来研究的几个方向似乎特别吸引人。首先，纳入更多的药物特征，如浓度、分子图卷积和原子卷积等。其次，采用其他计算描述符和指纹工具，以覆盖整个药物集，这样就会有足够的数据点来创建一个用于测试的保留集。再次，利用半监督学习方法来编码分子特征与外部基因表达和其他类型的数据。最后，探索先进的网络架构，并使用正在开发的可扩展的深度学习框架来执行严格的超参数优化。


    上述预测方法的主要问题是其推理对操作者或选择者不透明，使决定治疗决策变得困难。机器学习方法通常会为了提高预测性能而牺牲一定程度的透明度。


    虽然能够识别可能是协同作用的药物组合很重要，但理解为什么模型预测这些组合具有很高的协同作用也很重要。


    （1）应用实践一。


    芝加哥大学计算研究所使用从真实对接筛选中获得的最佳组合评分，计算了每个细胞系的前100对药物对的列表。然后，从所有细胞系中汇集了这些列表，并按频率对药物对进行排序。将前10个有前途的药物对与来自模型推断的生长分数的预测版本进行了比较发析。结果显示的列表中90%相同的。


    基于此，他们提出了一个简单的、两阶段的深度神经网络模型，用于预测药物对反应。它支持多种类型的肿瘤特征，可以很容易地扩展到适应两种以上药物的联合治疗。该模型具有良好的性能（R2\=0.94），对细胞系或药物对没有明显的偏差。最初的结果看起来也有希望在许多细胞系中挑选出始终大于单药疗效的药物对。对输入特征的实验表明，该模型不仅仅是记住药物组合。相反，药物描述符使r2提高了0.81。


    这与以前的协同模型不同，因为它是一个回归问题，预测一个连续的值而不是一个类别。正描述为协同作用，而负描述为拮抗作用。它应用了两类数据：化学结构数据，以104种药物的QSAR描述符和分子指纹的形式；细胞系描述符，以基因表达微阵列、mi⁃croRNA表达谱和NCI-60细胞系的蛋白质丰度测量。他们使用均方误差、平均平均误差和r2值来表示模型的精度，通过整合所有的数据表单，再次取得了最佳的结果。他们还分析了模型作为输入的准确性和输入的函数，发现药物化学描述符比细胞系描述符重要得多。


    当仅使用基因表达和一个热编码药物名称，或仅使用基因表达和药物化学描述符时，模型预测的r2值分别从0.1272跃升至0.9005。一个热编码描述了一种方法，其中一个类别列表被转换为一组数，1表示该实例在给定类别中的存在，0表示其不存在。添加化学特征所导致的r2值的大跳跃，与r2值的小增加，0.8892到0.9208形成对比，这是由于细胞系特征的蛋白质浓度、表达水平和RNA表达水平，而不仅仅是热编码的分子特征。这些结果表明，正如作者所述，化学特征的信息对模型的预测能力更重要，但也可能意味着一个热编码比化学特征更好地代表细胞系的特征。仅使用细胞系或化学描述符构建的模型的例子将有助于阐明哪种形式的数据才是真正最重要的。


    （2）应用实践二。


    华盛顿大学计算科学工程中心，利用极端梯度增强树开发了一个机器学习模型，构建一个具有显著药物反应预测能力的计算模型，用于预测药物协同得分。


    模型使用总共8846个特征，包括细胞系的基因表达水平、QSAR描述符和分子指纹的药物实现等级相关参数，然后使用基于树的架构特性排序方法，给特性代表在构建树的权重量化描述符。由此证明，机器学习模型如果只有前1000特性几乎没有性能损失。他们还检查了排名前100位的特征，发现其中只有17个与基因表达谱相关，其余的都是与药物相关的特征。由于很难将这些结果与其他模型的结果进行比较，该模型与其他模型的计算规模不同，没有提供预测结果与实际模型之间的r2值。但相关值相当高，支持了该建模方法的实用性。协同作用预测明显更依赖于药物特征、化学描述符、相似性指标和相互作用网络，而不是患者特征和基因谱。


    ## 5.4　药物-药物相互作用'
  fmt: '

    # 人工智能在药物治疗中的应用


    人工智能在药物治疗中的目的是将数据减少到医生可以解释的规模，让临床医生获得他们以前无法考虑的信息。且人工智能辅助的医疗行为要足够透明，并简单易懂，以便应用人员能理解它们。不幸的是，这种简化通常是以降低预测能力为代价的。基于人工智能的决策支持解决方案具有更高的准确性，但透明度较低。人们对使用所谓的黑箱模型感到非常焦虑，因为它们的决策过程很难被患者理解，如果它们被证明是成功的，并且患者存活率增加，那么这种压力可能得到缓解。所以必须进行广泛的试验来证明任何医学黑箱模型的预测能力，因为这类软件通常缺乏可解释性。


    在临床应用之前，必须证明这些模型能够无可辩驳地改善患者的预后。深度学习的选择和优化药物治疗的引入和更广泛的使用，将使模型更难以实现透明度。我们必须学会信任我们的机器提供的决定和建议，就像孩子们必须学会信任他们父母的决定一样。


    深度学习已经彻底改变了计算机视觉、机器人技术、游戏和自然语言处理等领域。它正在基因组学、医学诊断和计算化学方面迅速取得进展。深度学习的核心是一套可推广的技术，它们在推断复杂关系时利用大规模数据蓬勃发展。虽然新兴的神经网络在预测广泛的分子特性方面表现优于最先进的模型，但迄今为止，由于缺乏训练数据，它们的使用仅限于单个分子。


    早期机器学习在癌症和药物发现中的应用只关注一种类型的基因组谱。2012年，梦想联盟发起了一项药物敏感性挑战，集成了多种组学测量。在44种基于人工智能的方法中，表现最好的模型包括贝叶斯多任务多核学习和基于集成的方法。在另一个公开的挑战中，31种建模方法在预测药物对活性方面进行了竞争。虽然这些方法的表现明显优于偶然性，但没有一种是接近最优的方案。由于这两个挑战都集中以排序作为评价指标，它们的结果不能直接与实验室研究相比较。此外，它们的样本量小，分别为29对和91对药物单一药物，可能具有实际意义。


    对患者疾病的理想治疗药物，要考虑到来自患者的所有相关医疗信息，包括基因组学或蛋白质组学数据，与描述药物特性的特征相结合，通常有必要预测药物与生物分子的相互作用，如蛋白质、DNA、RNA、MicroRNA等生物分子的相互作用。这种系统的临床应用将需要这些方法的结合，特别是对于常见的复杂性疾病。


    对药物-靶点相互作用的预测，是单药治疗优化问题的一小部分，但它也同样重要。预测药物-靶点的相互作用对于现有药物的重新利用和寻找新药物，以及理解相关的信号传导和代谢通路至关重要。预测现有药物的新用途的尝试，往往依赖于通过人工智能引擎解释的基因、转录组学和副作用数据的使用。


    药物-靶点相互作用的预测主要依赖于人工智能技术的两个分支：一个是网络理论方法，输入表征与药物相互作用的蛋白质网络；另一个是机器学习，利用像支持向量机这样的体系，构建一个依赖于药物化学结构和治疗相似性指数的模型，使用支持向量机体系结构来预测新的和意想不到的药物-靶点相互作用。支持向量机是一种机器学习方法，旨在通过在分类变量之间绘制多维曲面来分析它们间的直接关系。


    基于药物的相似性推理，或基于目标的相似性推理，以及基于二部图网络的方法，称为基于网络的推理，可用来预测新的药物-靶点相互作用。基于网络的推理被证明是最强大的方法，可用于测试进一步的数据。它首先对它们的输入、药物结构相似性、蛋白质靶点序列相似性及其输出和药物-靶点相互作用网络拓扑进行相关性分析。这些数据可以用于评估预测。然后，它使用药物结构相似性和蛋白质靶标序列相似性特征，预测未知的药物靶标相互作用网络，其使用的独立的统计方法包括轮廓方法、加权轮廓方法和二部图学习方法等。


    利用与疾病的遗传学或蛋白质组学相关的生物数据，结合化学信息，如QSAR描述符，可使用机器方法开发用于肿瘤决策支持的联合治疗预测引擎，以预测药物组合是否具有协同作用。从整合数据开发的模型应用到独立的药物组合数据集，差异表达基因的预测贡献表明，药代动力学特性与预测协同作用优于物理化学或目标网络属性，但表现最好的模型，得益于有可用的全球系统生物学方法的数据支持，使之有一个更完整的画面。


    ## 5.1 临床研究


    临床试验是新药研发中至关重要的一个环节，虽然一个药物在取得临床实验批件之前，其有效性和安全性已经在实验室和动物实验中经过了系统的研究和论证，但是该药物在人体内是否可以发挥预期的活性以及符合安全性的要求仍然充满了未知数。据估计，在Ⅰ、Ⅱ、Ⅲ期药物开发临床试验中，有33.6%～52.4%的试验无法顺利进入下一阶段。


    患者招募是开展新药临床试验的前提和保证，近年来国内的新药临床试验数量大幅增加，加上临床试验的入组标准不断细化，在严格的招募时间下，是否能按计划招募到符合要求的受试者会很大程度影响临床试验的进度和结果，患者招募也成为临床试验推迟的首要原因。临床试验对于招募患者的资格、适宜性、参与动机和授权方面都有相应的要求，利用人工智能可以对患者的资料进行识别，并与临床试验的要求进行筛选和匹配，可以在很大程度提高患者招募的效率。2020年报道的一项关于人工智能和传统方法在患者招募方面的对比研究，利用人工智能技术Mendel.AI重新模拟了3项已完成的肿瘤相关临床研究患者预筛选工作，结果发现Mendel.AI在保证筛选结果准确度的情况下，相比于标准操作可以筛选到更多潜在的合格受试者，并且可以大大缩短筛选时间，在数小时内即可完成受试者的预筛选，而标准方法则需要花费数十天甚至更长的时间。人工智能在患者招募上的优势已经得到了关注，心力衰竭治疗设备开发商Ancora
    Heart宣布与数字健康公司Egnite建立战略伙伴关系，很大的原因在于Egnite公司开发的人工智能试验加速器可以帮助其识别符合条件的患者以推动其关键性临床试验的开展，这也进一步说明了人工智能在患者招募方面的可靠性。当然人工智能也可用于主动挖掘公开的网络内容，包括数字试验数据库、试验公告和社交媒体，以自动识别特定患者和相关试验之间的潜在匹配关系，可以让更多的患者有可能接触到感兴趣的临床试验项目，为患者招募提供更多的可能性。


    临床试验通常不是为了在普通人群的随机样本中证明药物有效性而设计的，而是为了前瞻性地选择人群中的一个子集，可以更容易地证明受试药物的效果，这一策略被称为临床试验富集。人工智能模型和方法通过FDA确定的下列方法来增强患者队列选择：通过减少人群异质性；通过选择更有可能具有可测量临床终点的患者（预后富集）；通过识别对治疗更有反应的人群（预测富集）。除了用于富集策略，人工智能也被用于参与者分层，例如，如果AI/ML模型可以在给予研究治疗之前预测严重不良事件的概率。根据这些严重不良事件的预测风险，可以将参与者分层到不同的组，然后进行相应的监测，或根据预测的不良事件严重程度将参与者排除在外。


    对于一项临床试验来说，患者招募、选择和分组只是一个开端，只有这些受试患者在整个实验过程中遵守试验程序和规则，并有效可靠地收集监测受试药物的相关数据，临床试验才有可能实现投资回报。据统计，只有15%的临床试验没有出现患者脱落的情况，患者脱落势必带来额外的招募工作，也进一步增加了临床试验的成本。当然患者脱落的原因有很多，包括受试者个体因素、环境因素、试验用药因素、研究者因素和项目流程因素等，而人工智能对于解决患者脱落问题也有相应的应用。例如，在临床试验中患者需要配合记录药物摄入量、身体功能、药物反应等各种数据，对于大部分患者来说这是一项较为烦琐的任务，因此患者的依从性较差。人工智能技术可以与可穿戴技术相结合，为开发节能、移动、实时和个性化的患者监测系统提供了新的策略。可穿戴传感器与视频监控可用于自动连续收集患者数据，从而减轻患者的负担。人工智能还可以用于动态预测特定患者脱落的风险，通过发现不依从性的早期预警信号，项目组可以积极与特定患者进行沟通和干预，在患者脱落前将问题解决。


    人工智能对于临床试验具体方案的改进也有很大的作用，人工智能可用来描述和预测药物给药后的药代动力学性质，因此可以用于剂量和给药方案的优化，对于罕见病、儿童和孕妇用药这些缺少现有数据的特殊群体的用药方案，人工智能可以发挥更大的优势。2023年5月10日，美国食品药品监督管理局FDA发布的一份讨论性报告*Using
    Artificial Intelligence&Machine Learning in the Development of Drug&Biological
    Products*中还提及，人工智能还可用于研究地点的选择、临床试验数据的收集、管理和分析、临床终点评估等新药临床研究环节。


    药物警戒是与发现、评价、理解和预防不良反应或其他任何可能与药物有关问题的科学研究与活动。药物警戒不仅涉及药物的不良反应，还涉及与药物相关的其他问题。虽然在药品上市前的各阶段研究中对药物的安全性已经进行了较为细致的考察，但是由于研究时间有限，对于一些较为罕见的不良反应、长期毒性以及药物在特殊人群（如儿童、孕妇、老人等）中的表现，临床研究阶段可能并不能提供完整的数据，因此药物上市后的安全监测显得尤其重要。个例安全性报告（Individual
    Case Safety Report, ICSR）被用于在药物批准后向药品监管部门报告不良事件，是药品上市后监控潜在药物安全问题的重要数据来源。目前个例安全性报告不良事件数据来源的数量和复杂性均在不断攀升，数据来源可能包括自发报告、临床试验、社交媒体、电话、电子邮件、患者主动登记、索赔数据等，相较于人工识别的费时费力，人工智能在从数据源中获取这些案例之后，可以识别该报告的有效性，并进行案例的优先级排序，此外还能完成重复性检查，并根据报告的内容对其进行分类编码。人工智能不仅可以实现病例的处理，同时还能进行病例评估和病例提交。


    应用实例：美国FDA药品审评与研究中心（CDER）监督与流行病学办公室（OSE）开发了信息可视化平台（Information Visualization Platform,
    InfoViP）用于支持OSE安全性审评员审查数据或内容，形成更深入的见解，给出预测或建议，以便支持上市后安全性监督。InfoViP结合了自然语言处理（NLP）、机器学习（ML）以及先进的数据可视化技术。InfoVip可以通过自然语言处理技术对报告进行自动扫描和识别，并实现相关临床信息的提取和可视化，便于审评人员审评，此外InfoVip可以评估不良事件与药物的因果关系，从而对报告进行分级评估，这样审查员就可以优先对高质量的报告进行审查。InfoVip另一个功能就是剔除重复数据，InfoViP基于NLP的“重复数据删除”算法可以有效地扫描、提取和比较大量ICSR中的众多数据点，自动检测重复报告，并将其提交给安全性审评员进行确认。


    ## 5.2 联合治疗


    联合治疗对治疗复杂疾病很有效。不同药物间的协同作用有助于对抗耐药性疾病菌株和肿瘤，因为这些疗法可以在多个方面攻击疾病。然而，联合治疗可能与毒性增加有关。由于药物的大量和不断增长而导致的组合爆炸，人们需要开发计算方法来选择毒性最小的优化联合治疗。基于人工智能的模型已经被开发出来，用于预测许多疾病中的协同药物组合，包括传染病和癌症。非疾病特异性的联合治疗预测因子也已经被开发出来。这些模型在输入、输出和体系结构上差异很大。


    联合药物治疗自20世纪60年代以来一直被用于癌症治疗。由于各种原因，在大多数情况下比单药治疗更可取。在单药治疗不能克服的情况下，联合药物治疗被证明可以克服患者对抗癌药物的固有耐药性，也可以防止获得性耐药性的产生；也被证明可以导致剂量相关毒性的降低，同时通过添加剂或协同效应增加癌细胞的消除。


    然而，寻找新的有效药物组合是一项复杂的工作，因为存在大量可能的药物组合，而且每次新药开发出来，这个数字就会增加。当前，有效的药物组合的发现，很大程度上是基于医生的经验，因为他们在临床上不断尝试新的治疗组合，但这个过程中，患者的分子数据很少被利用。


    虽然可能的药物组合的空间太大，无法进行详尽的测试，但最近已经有努力通过高通量筛选来衡量药物组合的疗效。两两药物组合的数量是指数级的，数量巨大，详尽地测试可能的组合是不可行的，这显然需要一种数据驱动的方法来发现有效的药物组合。上述来自体外筛选的数据集使这些方法的发展成为可能，目前已经有各种尝试使用机器学习方法来预测抗癌药物的最佳协同组合。


    人工智能辅助药物联合选择策略已开发用于治疗人类免疫缺陷病毒。由于病毒不断产生病毒蛋白酶和逆转录酶的耐药突变，艾滋病毒的治疗变得复杂。这一现象迫使患者定期改变治疗方案，以解决病毒遗传学的变化，并防止病毒载量的增长。药物造成的毒性负荷也必须被最小化。依赖于机器学习的计算方法已被开发出来，以分析这些蛋白质的变化。三种机器学习方法，人工神经网络、随机森林和支持向量机，可根据病毒突变数据和一些添加的临床生物标志物，来预测药物组合给药后的病毒学反应。结果的准确性通过实际结果和预期结果之间的`r2`值来评估。


    当将基于规则的系统输出作为逻辑回归模型输入时，所得到的结果可与纯机器方法相比较。精度的提高与否，与模型中基于规则的部分有关，因为它在没有基于规则的系统的情况下实现了与逻辑回归类似的结果。在预测精度方面，机器学习方法比基于规则的系统具有更高的性能，支持应用这种不透明的方法来降低复杂生物数据的维数，用于药物治疗选择，可作为辅助建议形式供医生利用。


    预测特定癌症对治疗的反应是现代肿瘤学的一个主要目标，其结果可以作为个性化治疗的依据。通过对基因组异质性癌细胞系潜在活性化合物的活性研究，能够提示基因组改变和药物反应之间的多种联系。已有多种计算方法被提出来预测药物敏感性。为了整合这些互补的计算方法，哈佛医学院Michael
    Menden等人开发了机器学习模型来预测癌细胞系对药物治疗的反应，通过预测半数抑制浓度，对基于细胞系的基因组特征和所考虑过的药物的化学特性进行量化。


    ## 5.3 评估药物反应


    机器学习模型的开发，可以为测量肿瘤药物反应提供一个协同有效的途径。虽然以往的大多数研究都集中在使用经典机器学习方法的单一药物筛选数据上，但大数据库的发布，使适合大规模数据的深度神经网络系统地建模成为可能。


    虽然模型在预测肿瘤细胞系生长和协同药物对排序方面取得了很好的结果，但仍有很大的改进空间。例如，分子特征的贡献可能会随着更多细胞系的加入而增加。另一个没有充分利用的信息来源是药物浓度。现在更需要做的是，寻求将多个单一药物筛选研究，整合到一个统一的剂量反应预测框架中的方法。肿瘤类型和药物作用机制等辅助特性也可以作为多任务模型中的辅助预测靶点来添加。为了了解药物反应模型的普遍性，需要更系统的交叉验证方案来分析它们对新药、细胞系和跨研究的预测能力。


    癌症是一种极其复杂的疾病，一个肿瘤细胞可以发展为亿计的编码区突变，并可能导致耐药性的出现。为了对抗这种巨大的不确定性，联合疗法被开发出来，以同时与多个靶点相互作用。基于已有的细胞生物学知识，虽然一些有前途的药物组合已经可以使用，但许多药物的相互作用机制仍然未知。


    药物反应模型的一个重要应用是在高通量虚拟筛选中。如果一个机器学习模型是准确的，它就可以在推理模式下作为一个计算运行，以降低筛选成本。


    未来研究的几个方向似乎特别吸引人。首先，纳入更多的药物特征，如浓度、分子图卷积和原子卷积等。其次，采用其他计算描述符和指纹工具，以覆盖整个药物集，这样就会有足够的数据点来创建一个用于测试的保留集。再次，利用半监督学习方法来编码分子特征与外部基因表达和其他类型的数据。最后，探索先进的网络架构，并使用正在开发的可扩展的深度学习框架来执行严格的超参数优化。


    上述预测方法的主要问题是其推理对操作者或选择者不透明，使决定治疗决策变得困难。机器学习方法通常会为了提高预测性能而牺牲一定程度的透明度。


    虽然能够识别可能是协同作用的药物组合很重要，但理解为什么模型预测这些组合具有很高的协同作用也很重要。


    （1）应用实践一。


    芝加哥大学计算研究所使用从真实对接筛选中获得的最佳组合评分，计算了每个细胞系的前100对药物对的列表。然后，从所有细胞系中汇集了这些列表，并按频率对药物对进行排序。将前10个有前途的药物对与来自模型推断的生长分数的预测版本进行了比较发析。结果显示的列表中90%相同的。


    基于此，他们提出了一个简单的、两阶段的深度神经网络模型，用于预测药物对反应。它支持多种类型的肿瘤特征，可以很容易地扩展到适应两种以上药物的联合治疗。该模型具有良好的性能（`R2\=0.94`），对细胞系或药物对没有明显的偏差。最初的结果看起来也有希望在许多细胞系中挑选出始终大于单药疗效的药物对。对输入特征的实验表明，该模型不仅仅是记住药物组合。相反，药物描述符使`r2`提高了0.81。


    这与以前的协同模型不同，因为它是一个回归问题，预测一个连续的值而不是一个类别。正描述为协同作用，而负描述为拮抗作用。它应用了两类数据：化学结构数据，以104种药物的QSAR描述符和分子指纹的形式；细胞系描述符，以基因表达微阵列、mi⁃croRNA表达谱和NCI-60细胞系的蛋白质丰度测量。他们使用均方误差、平均平均误差和`r2`值来表示模型的精度，通过整合所有的数据表单，再次取得了最佳的结果。他们还分析了模型作为输入的准确性和输入的函数，发现药物化学描述符比细胞系描述符重要得多。


    当仅使用基因表达和一个热编码药物名称，或仅使用基因表达和药物化学描述符时，模型预测的`r2`值分别从0.1272跃升至0.9005。一个热编码描述了一种方法，其中一个类别列表被转换为一组数，1表示该实例在给定类别中的存在，0表示其不存在。添加化学特征所导致的`r2`值的大跳跃，与`r2`值的小增加，0.8892到0.9208形成对比，这是由于细胞系特征的蛋白质浓度、表达水平和RNA表达水平，而不仅仅是热编码的分子特征。这些结果表明，正如作者所述，化学特征的信息对模型的预测能力更重要，但也可能意味着一个热编码比化学特征更好地代表细胞系的特征。仅使用细胞系或化学描述符构建的模型的例子将有助于阐明哪种形式的数据才是真正最重要的。


    （2）应用实践二。


    华盛顿大学计算科学工程中心，利用极端梯度增强树开发了一个机器学习模型，构建一个具有显著药物反应预测能力的计算模型，用于预测药物协同得分。


    模型使用总共8846个特征，包括细胞系的基因表达水平、QSAR描述符和分子指纹的药物实现等级相关参数，然后使用基于树的架构特性排序方法，给特性代表在构建树的权重量化描述符。由此证明，机器学习模型如果只有前1000特性几乎没有性能损失。他们还检查了排名前100位的特征，发现其中只有17个与基因表达谱相关，其余的都是与药物相关的特征。由于很难将这些结果与其他模型的结果进行比较，该模型与其他模型的计算规模不同，没有提供预测结果与实际模型之间的`r2`值。但相关值相当高，支持了该建模方法的实用性。协同作用预测明显更依赖于药物特征、化学描述符、相似性指标和相互作用网络，而不是患者特征和基因谱。


    ## 5.4 药物-药物相互作用

    '
  trans: '


    # 人工智能在药物治疗中的应用


    人工智能在药物治疗中的目的是将数据减少到医生可以解释的规模，让临床医生获得他们以前无法考虑的信息。且人工智能辅助的医疗行为要足够透明，并简单易懂，以便应用人员能理解它们。不幸的是，这种简化通常是以降低预测能力为代价的。基于人工智能的决策支持解决方案具有更高的准确性，但透明度较低。人们对使用所谓的黑箱模型感到非常焦虑，因为它们的决策过程很难被患者理解，如果它们被证明是成功的，并且患者存活率增加，那么这种压力可能得到缓解。所以必须进行广泛的试验来证明任何医学黑箱模型的预测能力，因为这类软件通常缺乏可解释性。


    在临床应用之前，必须证明这些模型能够无可辩驳地改善患者的预后。深度学习的选择和优化药物治疗的引入和更广泛的使用，将使模型更难以实现透明度。我们必须学会信任我们的机器提供的决定和建议，就像孩子们必须学会信任他们父母的决定一样。


    深度学习已经彻底改变了计算机视觉、机器人技术、游戏和自然语言处理等领域。它正在基因组学、医学诊断和计算化学方面迅速取得进展。深度学习的核心是一套可推广的技术，它们在推断复杂关系时利用大规模数据蓬勃发展。虽然新兴的神经网络在预测广泛的分子特性方面表现优于最先进的模型，但迄今为止，由于缺乏训练数据，它们的使用仅限于单个分子。


    早期机器学习在癌症和药物发现中的应用只关注一种类型的基因组谱。2012 年，梦想联盟发起了一项药物敏感性挑战，集成了多种组学测量。在 44 种基于人工智能的方法中，表现最好的模型包括贝叶斯多任务多核学习和基于集成的方法。在另一个公开的挑战中，31
    种建模方法在预测药物对活性方面进行了竞争。虽然这些方法的表现明显优于偶然性，但没有一种是接近最优的方案。由于这两个挑战都集中以排序作为评价指标，它们的结果不能直接与实验室研究相比较。此外，它们的样本量小，分别为
    29 对和 91 对药物单一药物，可能具有实际意义。


    对患者疾病的理想治疗药物，要考虑到来自患者的所有相关医疗信息，包括基因组学或蛋白质组学数据，与描述药物特性的特征相结合，通常有必要预测药物与生物分子的相互作用，如蛋白质、DNA、RNA、MicroRNA
    等生物分子的相互作用。这种系统的临床应用将需要这些方法的结合，特别是对于常见的复杂性疾病。


    对药物-靶点相互作用的预测，是单药治疗优化问题的一小部分，但它也同样重要。预测药物-靶点的相互作用对于现有药物的重新利用和寻找新药物，以及理解相关的信号传导和代谢通路至关重要。预测现有药物的新用途的尝试，往往依赖于通过人工智能引擎解释的基因、转录组学和副作用数据的使用。


    药物-靶点相互作用的预测主要依赖于人工智能技术的两个分支：一个是网络理论方法，输入表征与药物相互作用的蛋白质网络；另一个是机器学习，利用像支持向量机这样的体系，构建一个依赖于药物化学结构和治疗相似性指数的模型，使用支持向量机体系结构来预测新的和意想不到的药物-靶点相互作用。支持向量机是一种机器学习方法，旨在通过在分类变量之间绘制多维曲面来分析它们间的直接关系。


    基于药物的相似性推理，或基于目标的相似性推理，以及基于二部图网络的方法，称为基于网络的推理，可用来预测新的药物-靶点相互作用。基于网络的推理被证明是最强大的方法，可用于测试进一步的数据。它首先对它们的输入、药物结构相似性、蛋白质靶点序列相似性及其输出和药物-靶点相互作用网络拓扑进行相关性分析。这些数据可以用于评估预测。然后，它使用药物结构相似性和蛋白质靶标序列相似性特征，预测未知的药物靶标相互作用网络，其使用的独立的统计方法包括轮廓方法、加权轮廓方法和二部图学习方法等。


    利用与疾病的遗传学或蛋白质组学相关的生物数据，结合化学信息，如 QSAR 描述符，可使用机器方法开发用于肿瘤决策支持的联合治疗预测引擎，以预测药物组合是否具有协同作用。从整合数据开发的模型应用到独立的药物组合数据集，差异表达基因的预测贡献表明，药代动力学特性与预测协同作用优于物理化学或目标网络属性，但表现最好的模型，得益于有可用的全球系统生物学方法的数据支持，使之有一个更完整的画面。


    ## 5.1 临床研究


    临床试验是新药研发中至关重要的一个环节，虽然一个药物在取得临床实验批件之前，其有效性和安全性已经在实验室和动物实验中经过了系统的研究和论证，但是该药物在人体内是否可以发挥预期的活性以及符合安全性的要求仍然充满了未知数。据估计，在Ⅰ、Ⅱ、Ⅲ期药物开发临床试验中，有
    33.6%～52.4%的试验无法顺利进入下一阶段。


    患者招募是开展新药临床试验的前提和保证，近年来国内的新药临床试验数量大幅增加，加上临床试验的入组标准不断细化，在严格的招募时间下，是否能按计划招募到符合要求的受试者会很大程度影响临床试验的进度和结果，患者招募也成为临床试验推迟的首要原因。临床试验对于招募患者的资格、适宜性、参与动机和授权方面都有相应的要求，利用人工智能可以对患者的资料进行识别，并与临床试验的要求进行筛选和匹配，可以在很大程度提高患者招募的效率。2020
    年报道的一项关于人工智能和传统方法在患者招募方面的对比研究，利用人工智能技术 Mendel.AI 重新模拟了 3 项已完成的肿瘤相关临床研究患者预筛选工作，结果发现
    Mendel.AI 在保证筛选结果准确度的情况下，相比于标准操作可以筛选到更多潜在的合格受试者，并且可以大大缩短筛选时间，在数小时内即可完成受试者的预筛选，而标准方法则需要花费数十天甚至更长的时间。人工智能在患者招募上的优势已经得到了关注，心力衰竭治疗设备开发商
    Ancora Heart 宣布与数字健康公司 Egnite 建立战略伙伴关系，很大的原因在于 Egnite 公司开发的人工智能试验加速器可以帮助其识别符合条件的患者以推动其关键性临床试验的开展，这也进一步说明了人工智能在患者招募方面的可靠性。当然人工智能也可用于主动挖掘公开的网络内容，包括数字试验数据库、试验公告和社交媒体，以自动识别特定患者和相关试验之间的潜在匹配关系，可以让更多的患者有可能接触到感兴趣的临床试验项目，为患者招募提供更多的可能性。


    临床试验通常不是为了在普通人群的随机样本中证明药物有效性而设计的，而是为了前瞻性地选择人群中的一个子集，可以更容易地证明受试药物的效果，这一策略被称为临床试验富集。人工智能模型和方法通过
    FDA 确定的下列方法来增强患者队列选择：通过减少人群异质性；通过选择更有可能具有可测量临床终点的患者（预后富集）；通过识别对治疗更有反应的人群（预测富集）。除了用于富集策略，人工智能也被用于参与者分层，例如，如果
    AI/ML 模型可以在给予研究治疗之前预测严重不良事件的概率。根据这些严重不良事件的预测风险，可以将参与者分层到不同的组，然后进行相应的监测，或根据预测的不良事件严重程度将参与者排除在外。


    对于一项临床试验来说，患者招募、选择和分组只是一个开端，只有这些受试患者在整个实验过程中遵守试验程序和规则，并有效可靠地收集监测受试药物的相关数据，临床试验才有可能实现投资回报。据统计，只有
    15%的临床试验没有出现患者脱落的情况，患者脱落势必带来额外的招募工作，也进一步增加了临床试验的成本。当然患者脱落的原因有很多，包括受试者个体因素、环境因素、试验用药因素、研究者因素和项目流程因素等，而人工智能对于解决患者脱落问题也有相应的应用。例如，在临床试验中患者需要配合记录药物摄入量、身体功能、药物反应等各种数据，对于大部分患者来说这是一项较为烦琐的任务，因此患者的依从性较差。人工智能技术可以与可穿戴技术相结合，为开发节能、移动、实时和个性化的患者监测系统提供了新的策略。可穿戴传感器与视频监控可用于自动连续收集患者数据，从而减轻患者的负担。人工智能还可以用于动态预测特定患者脱落的风险，通过发现不依从性的早期预警信号，项目组可以积极与特定患者进行沟通和干预，在患者脱落前将问题解决。


    人工智能对于临床试验具体方案的改进也有很大的作用，人工智能可用来描述和预测药物给药后的药代动力学性质，因此可以用于剂量和给药方案的优化，对于罕见病、儿童和孕妇用药这些缺少现有数据的特殊群体的用药方案，人工智能可以发挥更大的优势。2023
    年 5 月 10 日，美国食品药品监督管理局 FDA 发布的一份讨论性报告*在药物和生物制品开发中使用人工智能和机器学习*中还提及，人工智能还可用于研究地点的选择、临床试验数据的收集、管理和分析、临床终点评估等新药临床研究环节。


    药物警戒是与发现、评价、理解和预防不良反应或其他任何可能与药物有关问题的科学研究与活动。药物警戒不仅涉及药物的不良反应，还涉及与药物相关的其他问题。虽然在药品上市前的各阶段研究中对药物的安全性已经进行了较为细致的考察，但是由于研究时间有限，对于一些较为罕见的不良反应、长期毒性以及药物在特殊人群（如儿童、孕妇、老人等）中的表现，临床研究阶段可能并不能提供完整的数据，因此药物上市后的安全监测显得尤其重要。个例安全性报告（Individual
    Case Safety Report, ICSR）被用于在药物批准后向药品监管部门报告不良事件，是药品上市后监控潜在药物安全问题的重要数据来源。目前个例安全性报告不良事件数据来源的数量和复杂性均在不断攀升，数据来源可能包括自发报告、临床试验、社交媒体、电话、电子邮件、患者主动登记、索赔数据等，相较于人工识别的费时费力，人工智能在从数据源中获取这些案例之后，可以识别该报告的有效性，并进行案例的优先级排序，此外还能完成重复性检查，并根据报告的内容对其进行分类编码。人工智能不仅可以实现病例的处理，同时还能进行病例评估和病例提交。


    应用实例：美国 FDA 药品审评与研究中心（CDER）监督与流行病学办公室（OSE）开发了信息可视化平台（Information Visualization
    Platform, InfoViP）用于支持 OSE 安全性审评员审查数据或内容，形成更深入的见解，给出预测或建议，以便支持上市后安全性监督。InfoViP
    结合了自然语言处理（NLP）、机器学习（ML）以及先进的数据可视化技术。InfoVip 可以通过自然语言处理技术对报告进行自动扫描和识别，并实现相关临床信息的提取和可视化，便于审评人员审评，此外
    InfoVip 可以评估不良事件与药物的因果关系，从而对报告进行分级评估，这样审查员就可以优先对高质量的报告进行审查。InfoVip 另一个功能就是剔除重复数据，InfoViP
    基于 NLP 的“重复数据删除”算法可以有效地扫描、提取和比较大量 ICSR 中的众多数据点，自动检测重复报告，并将其提交给安全性审评员进行确认。


    ## 5.2 联合治疗


    联合治疗对治疗复杂疾病很有效。不同药物间的协同作用有助于对抗耐药性疾病菌株和肿瘤，因为这些疗法可以在多个方面攻击疾病。然而，联合治疗可能与毒性增加有关。由于药物的大量和不断增长而导致的组合爆炸，人们需要开发计算方法来选择毒性最小的优化联合治疗。基于人工智能的模型已经被开发出来，用于预测许多疾病中的协同药物组合，包括传染病和癌症。非疾病特异性的联合治疗预测因子也已经被开发出来。这些模型在输入、输出和体系结构上差异很大。


    联合药物治疗自 20 世纪 60 年代以来一直被用于癌症治疗。由于各种原因，在大多数情况下比单药治疗更可取。在单药治疗不能克服的情况下，联合药物治疗被证明可以克服患者对抗癌药物的固有耐药性，也可以防止获得性耐药性的产生；也被证明可以导致剂量相关毒性的降低，同时通过添加剂或协同效应增加癌细胞的消除。


    然而，寻找新的有效药物组合是一项复杂的工作，因为存在大量可能的药物组合，而且每次新药开发出来，这个数字就会增加。当前，有效的药物组合的发现，很大程度上是基于医生的经验，因为他们在临床上不断尝试新的治疗组合，但这个过程中，患者的分子数据很少被利用。


    虽然可能的药物组合的空间太大，无法进行详尽的测试，但最近已经有努力通过高通量筛选来衡量药物组合的疗效。两两药物组合的数量是指数级的，数量巨大，详尽地测试可能的组合是不可行的，这显然需要一种数据驱动的方法来发现有效的药物组合。上述来自体外筛选的数据集使这些方法的发展成为可能，目前已经有各种尝试使用机器学习方法来预测抗癌药物的最佳协同组合。


    人工智能辅助药物联合选择策略已开发用于治疗人类免疫缺陷病毒。由于病毒不断产生病毒蛋白酶和逆转录酶的耐药突变，艾滋病毒的治疗变得复杂。这一现象迫使患者定期改变治疗方案，以解决病毒遗传学的变化，并防止病毒载量的增长。药物造成的毒性负荷也必须被最小化。依赖于机器学习的计算方法已被开发出来，以分析这些蛋白质的变化。三种机器学习方法，人工神经网络、随机森林和支持向量机，可根据病毒突变数据和一些添加的临床生物标志物，来预测药物组合给药后的病毒学反应。结果的准确性通过实际结果和预期结果之间的`r2`值来评估。


    当将基于规则的系统输出作为逻辑回归模型输入时，所得到的结果可与纯机器方法相比较。精度的提高与否，与模型中基于规则的部分有关，因为它在没有基于规则的系统的情况下实现了与逻辑回归类似的结果。在预测精度方面，机器学习方法比基于规则的系统具有更高的性能，支持应用这种不透明的方法来降低复杂生物数据的维数，用于药物治疗选择，可作为辅助建议形式供医生利用。


    预测特定癌症对治疗的反应是现代肿瘤学的一个主要目标，其结果可以作为个性化治疗的依据。通过对基因组异质性癌细胞系潜在活性化合物的活性研究，能够提示基因组改变和药物反应之间的多种联系。已有多种计算方法被提出来预测药物敏感性。为了整合这些互补的计算方法，哈佛医学院
    Michael Menden 等人开发了机器学习模型来预测癌细胞系对药物治疗的反应，通过预测半数抑制浓度，对基于细胞系的基因组特征和所考虑过的药物的化学特性进行量化。


    ## 5.3 评估药物反应


    机器学习模型的开发，可以为测量肿瘤药物反应提供一个协同有效的途径。虽然以往的大多数研究都集中在使用经典机器学习方法的单一药物筛选数据上，但大数据库的发布，使适合大规模数据的深度神经网络系统地建模成为可能。


    虽然模型在预测肿瘤细胞系生长和协同药物对排序方面取得了很好的结果，但仍有很大的改进空间。例如，分子特征的贡献可能会随着更多细胞系的加入而增加。另一个没有充分利用的信息来源是药物浓度。现在更需要做的是，寻求将多个单一药物筛选研究，整合到一个统一的剂量反应预测框架中的方法。肿瘤类型和药物作用机制等辅助特性也可以作为多任务模型中的辅助预测靶点来添加。为了了解药物反应模型的普遍性，需要更系统的交叉验证方案来分析它们对新药、细胞系和跨研究的预测能力。


    癌症是一种极其复杂的疾病，一个肿瘤细胞可以发展为亿计的编码区突变，并可能导致耐药性的出现。为了对抗这种巨大的不确定性，联合疗法被开发出来，以同时与多个靶点相互作用。基于已有的细胞生物学知识，虽然一些有前途的药物组合已经可以使用，但许多药物的相互作用机制仍然未知。


    药物反应模型的一个重要应用是在高通量虚拟筛选中。如果一个机器学习模型是准确的，它就可以在推理模式下作为一个计算运行，以降低筛选成本。


    未来研究的几个方向似乎特别吸引人。首先，纳入更多的药物特征，如浓度、分子图卷积和原子卷积等。其次，采用其他计算描述符和指纹工具，以覆盖整个药物集，这样就会有足够的数据点来创建一个用于测试的保留集。再次，利用半监督学习方法来编码分子特征与外部基因表达和其他类型的数据。最后，探索先进的网络架构，并使用正在开发的可扩展的深度学习框架来执行严格的超参数优化。


    上述预测方法的主要问题是其推理对操作者或选择者不透明，使决定治疗决策变得困难。机器学习方法通常会为了提高预测性能而牺牲一定程度的透明度。


    虽然能够识别可能是协同作用的药物组合很重要，但理解为什么模型预测这些组合具有很高的协同作用也很重要。


    （1）应用实践一。


    芝加哥大学计算研究所使用从真实对接筛选中获得的最佳组合评分，计算了每个细胞系的前 100 对药物对的列表。然后，从所有细胞系中汇集了这些列表，并按频率对药物对进行排序。将前
    10 个有前途的药物对与来自模型推断的生长分数的预测版本进行了比较发析。结果显示的列表中 90%相同的。


    基于此，他们提出了一个简单的、两阶段的深度神经网络模型，用于预测药物对反应。它支持多种类型的肿瘤特征，可以很容易地扩展到适应两种以上药物的联合治疗。该模型具有良好的性能（`R2\=0.94`），对细胞系或药物对没有明显的偏差。最初的结果看起来也有希望在许多细胞系中挑选出始终大于单药疗效的药物对。对输入特征的实验表明，该模型不仅仅是记住药物组合。相反，药物描述符使`r2`提高了
    0.81。


    这与以前的协同模型不同，因为它是一个回归问题，预测一个连续的值而不是一个类别。正描述为协同作用，而负描述为拮抗作用。它应用了两类数据：化学结构数据，以 104
    种药物的 QSAR 描述符和分子指纹的形式；细胞系描述符，以基因表达微阵列、mi⁃croRNA 表达谱和 NCI-60 细胞系的蛋白质丰度测量。他们使用均方误差、平均平均误差和`r2`值来表示模型的精度，通过整合所有的数据表单，再次取得了最佳的结果。他们还分析了模型作为输入的准确性和输入的函数，发现药物化学描述符比细胞系描述符重要得多。


    当仅使用基因表达和一个热编码药物名称，或仅使用基因表达和药物化学描述符时，模型预测的`r2`值分别从 0.1272 跃升至 0.9005。一个热编码描述了一种方法，其中一个类别列表被转换为一组数，1
    表示该实例在给定类别中的存在，0 表示其不存在。添加化学特征所导致的`r2`值的大跳跃，与`r2`值的小增加，0.8892 到 0.9208 形成对比，这是由于细胞系特征的蛋白质浓度、表达水平和
    RNA 表达水平，而不仅仅是热编码的分子特征。这些结果表明，正如作者所述，化学特征的信息对模型的预测能力更重要，但也可能意味着一个热编码比化学特征更好地代表细胞系的特征。仅使用细胞系或化学描述符构建的模型的例子将有助于阐明哪种形式的数据才是真正最重要的。


    （2）应用实践二。


    华盛顿大学计算科学工程中心，利用极端梯度增强树开发了一个机器学习模型，构建一个具有显著药物反应预测能力的计算模型，用于预测药物协同得分。


    模型使用总共 8846 个特征，包括细胞系的基因表达水平、QSAR 描述符和分子指纹的药物实现等级相关参数，然后使用基于树的架构特性排序方法，给特性代表在构建树的权重量化描述符。由此证明，机器学习模型如果只有前
    1000 特性几乎没有性能损失。他们还检查了排名前 100 位的特征，发现其中只有 17 个与基因表达谱相关，其余的都是与药物相关的特征。由于很难将这些结果与其他模型的结果进行比较，该模型与其他模型的计算规模不同，没有提供预测结果与实际模型之间的`r2`值。但相关值相当高，支持了该建模方法的实用性。协同作用预测明显更依赖于药物特征、化学描述符、相似性指标和相互作用网络，而不是患者特征和基因谱。


    ## 5.4 药物-药物相互作用


