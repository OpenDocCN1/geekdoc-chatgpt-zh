- raw: "伪氨基酸组成（PseAAC）通过各种伪成分如疏水性、亲水性和侧链质量值与传统氨基酸默认生成50个描述符的特征向量，其中PseAAC特征向量的前20个元素代表传统的氨基酸组成向量。\n\
    \n特定位置的评分矩阵，可以通过位置特定迭代爆炸的评分矩阵方式获得。该矩阵包含20×N个元素，N是查询序列的长度，每个元素表示对其中特定位置的特定残基替换的频率，以生成固定长度的输入向量，用于模型训练。\n\
    \n特定位置的评分矩阵包含3个不同的特征集：第一种是由每个有5%序列的块上的平均配置文件组成；第二个特征集更关注具有转换率相似的结构域；而第三个特征集考虑了使用原始蛋白质序列的探测残基的物理化学性质。其中，第二个特征集被证明具有最有效的蛋白质预测功能。该特征向量捕获了蛋白质序列上多个物理化学基团的保守性。蛋白质残基的理化性质包括极性、疏水性、归一化范德华体积、极性、电荷和分子量。\n\
    \n（2）特征向量预处理。\n\n数据清理是检测和修复粗数据的过程，是预测建模中长期面临的挑战。如果不这样做，可能会导致误导性的分析。处理缺失值、识别和删除异常值、删除重复值、处理数据输入中的不一致性，可以有效避免容易的出错和不相关的属性。\n\
    \n处理缺失值：这个过程可以用来检查特征向量的完整性，即确认在构建的有毒蛋白质组学描述符的向量中是否有任何缺失的值，一般只须删除其中包含缺失属性的任何行或列，或者生成诱饵属性来替换这些缺失的值。用缺失的属性替换值，以确保特征向量的完整性，是计算过程中重要的一步。\n\
    \n识别和删除异常值：为了保证任何机器学习算法中输入毒素数据的数据质量，检测异常值是非常有用的，可以提高模型的可靠性和可预测性。机器学习算法在训练模型时，受到异常值存在的极大影响。这背后的原因是，异常值可能会被忽视，因为它远离数据集的正态分布。四分位数范围评分、z分数、基于接近度的模型和高维离群值检测方法，是离群值检测的一些常用方法。\n\
    \n删除缺失值：数据应该规范化，以适应在特定范围内的数据。归一化是一种预处理技术，用于重新调整属性值，以适应一个特定的范围。在处理不同单元和尺度的属性时，输入数据的规范化非常重要。虽然构建机器模型或其他数据挖掘方法的应用，但需要对输入进行规范化，否则模型将是不完整的。这可以保证权重和偏差的稳定收敛。为此，可以使用诸如重新缩放、十进制缩放或标准化等方法。\n\
    \nMinMax归一化：这种方法也被称为MinMax缩放。它将特征缩放到位于给定的最小值和最大值之间，通常在0～1。该方法不处理异常值，但确保所有特性都具有相同的规模。\n\
    \nz分数归一化：该方法确保输入特征向量的每个元素被转换为输出特征向量，其均值和单位方差为零。它在计算经验平均值方面有一些局限性，而标准偏差异常值由于每个特征的大小不同而会受到影响。因此，它不能保证在存在异常值时的平衡特征尺度。\n\
    \n（3）数据集划分。\n\n有了所有计算出的有毒蛋白描述符，最终的数据集可以分为测试集、训练集和验证集。数据集的划分可以使用分层分类器程序以一定的比例进行。这将提供一个训练集（应用于建模）、测试集（用于测试模型的预测精度）和验证集（用于验证数据集）。\n\
    \n在计算了与有毒蛋白相关的描述符后，根据需求，可以从整个数据集中选择最可靠的最佳描述符。毒性蛋白相关描述符的结果不应该太多，因为它会导致模糊性，并降低模型的准确性。因此，描述符的选择是一个重要的步骤，它将影响模型的最终预测性能。\n\
    \n特征选择也被称为变量选择或属性选择。它是与预测建模问题最相关的自动选择数据属性。特征选择不同于降维分析，这两种方法都试图减少数据集中变量的数量，但降维分析通过创建一个新的属性组合来实现，而特征选择包含和排除数据中存在的属性，而不改变这些属性。变量选择的目标是提高预测因子的预测性能，提供更快、更具成本效益的预测因子，并更好地提供对底层过程的理解。\n\
    \nBoruta算法作为一种围绕随机森林的包装算法，是一种集成方法，通过对多个弱决策树的无偏弱分类器，进行投票来进行分类。这些树是在训练集的不同装袋样本上独立开发的。该算法试图通过分类器的性能迭代选择特征，来寻找最优特征子集。它从一个空的特征子集开始，在每一轮中添加一个特征，这一个特征是从特征子集中的所有特征池中选择的，当添加时，会产生最好的分类器性能。对于每个特征子集组合进行训练和交叉验证的模型非常重要，而且这种方法比方差阈值等过滤器方法要昂贵得多。\n\
    \n递归特征消除可以递归地删除特征，使用剩余的属性构建一个模型，并计算模型的精度。递归特征消除可以计算出有助于预测目标变量的属性组合。非线性核的递归特征消除算法，允许对变量进行排序，但不比较特定迭代中所有变量的性能，这可以解释结果与响应变量的关联，这种关联的大小，是生物医学研究的本质。该算法的最终输出是一个排序列表，并根据变量的相关性进行排序。\n\
    \n特征子集的选择可以使用遗传算法来完成。实用模式分类和知识探索存在的组学数据，需要选择特征或属性的子集来代表模式分类，这种遗传算法，是一种启发式方法，借鉴达尔文的自然进化理论选择，是通过基于适应度过程开发的实例。\n\
    \n（4）模型开发与验证。\n\n统计分类是机器学习研究的一个主要问题。它是一种监督学习，是一种机器学习的方法，其中类别是预定义的，并用于将新的概率观察分类为预定义的类别或类。当只有两类时，这个问题被称为统计二元分类，其中研究的目的是分类或预测给定的未知序列/结构是否属于所述有毒蛋白类别的类别。有许多建模技术可用于基于分类的预测模型，其中支持向量机、随机森林、朴素贝叶斯分类器和人工神经网络，在大多数模型中都是首选的，具有较高的准确性。\n\
    \n模型验证，主要是为了评估了由训练数据集生成的模型的性能。性能评估可以通过k倍交叉验证和独立的测试集来完成。在k倍交叉验证中，原始数据集需要被划分为k个子集（通常是5个或10个子集）。在k个子集中，k-1子集作为训练集，剩下的单个子集作为验证数据，来测试训练模型。然后，这个过程将重复k次，每个子集将恰好用于验证一次。在执行k倍交叉验证后，可以将经过训练最好的模型用于测试。为了评估生成的模型的准确性，可以使用以下统计措施：灵敏性、特异性、准确性和阳性预测价值。\n\
    \n灵敏性被定义为有毒蛋白被正确预测为有毒蛋白的百分比。特异性是指被正确预测为无毒蛋白的无毒蛋白序列的百分比。准确性是正确预测占预测总数的百分比。阳性预测值是指分类器报告的作为有毒蛋白的序列是有毒蛋白的可能性，其中，真阳性是被正确识别的有毒蛋白；真阴性是被正确识别的无毒蛋白；假阳性是被错误预测为有毒蛋白的无毒蛋白；假阴性是指被错误归类为无毒蛋白的有毒蛋白。\n\
    \n（5）在线毒素蛋白预测应用工具。\n\nToxinPred是一种预测肽毒性的计算方法。该工具只能预测小的多肽毒素。ToxinPred下提交模块预测，将上传的肽序列分类为有毒或无毒类，ToxinPred模型以蛋白质序列的双肽组成为一组特征，预测准确率约为95%。ToxinPred主要功能如下。①设计肽：该模块允许用户生成其肽的所有可能的单一突变类似物，并预测该类似物是否有毒。②批量提交：ToxinPred的此模块，允许用户预测提交的有毒肽的数量。③蛋白质扫描：该模块生成用户提交的所有可能重叠的肽及其单个蛋白质突变体类似物，它还可以预测重叠的肽/类似物是否有毒。④QMS计算器：该工具允许用户以FASTA格式提交查询肽，并根据基于定量矩阵的位置特异性得分优化肽序列以获得最大/最小/所需毒性。它将帮助用户调整前体肽的任何残基，以获得具有所需性质（最高/最低毒性）的类似物。\n\
    \nToxClassifier毒素分类器可作为一个基于Web的应用程序使用，或作为一个独立的工具来分类毒素，并下载无毒的蛋白质序列。ToxClassifier模型对从PDB获得的8093个蛋白质序列的动物毒素和毒液数据集进行训练，显示了96%的准确性。\n\
    \nClanTox是一个基于Web的小动物毒素分类器机器学习应用程序。该应用可用于预测毒性肽，特别是用于分析动物的毒性蛋白质组学数据。对毒素序列的额外分析也可以使用这个应用程序进行，如基于直方图的预测分析。ClanTox的分类器，是通过从一组人工审查的一组离子通道毒素抑制剂中获得的一组真实例和假实例开发的。从有毒或非有毒的设置中，对于给定的序列输入列表，ClanTox系统预测每个序列是否可能为毒素。该工具由增强的残端分类器支持，并使用序列导出的全局特征来预测小动物毒素。ClanTox还根据统计数据，提供了一份根据置信度排名积极预测的候选者列表。\n\
    \nNNTox通过基因本体论术语注释来预测蛋白质的毒性，是一种由五层前馈神经网络支持的蛋白质毒性预测方法。该方法的性能准确率约为82%，MCC值为0.8，F1评分为0.77。该方法还扩展到预测序列输入的特定毒性类型的多标签模型。\n\
    \n## 2.4　蛋白质-蛋白质相互作用的预测\n\n分析蛋白质-蛋白质相互作用，对于有效的药物开发至关重要。大多数蛋白质注释方法都使用范围有限的序列同源性。高通量的蛋白质-蛋白质相互作用数据，随着数量的不断增加，正在成为新的生物学发现的基础。生物信息学面临的一大挑战是管理、分析和建模这些数据。因此，计算模型被开发出来，可以同时预测一个地方的多个参数。\n\
    \n人工智能计算方法，被用来研究蛋白质-蛋白质相互作用和蛋白质-蛋白质非相互作用，尽管前者被认为比后者更具信息性。蛋白质-蛋白质相互作用预测可分为直接预测、具有间接功能关联的直接作用和信号转导途径的作用。\n\
    \n机器和统计学习方法，如k近邻、朴素贝叶斯、支持向量机、人工神经网络、决策树和随机森林，被用于预测蛋白质-蛋白质相互作用。贝叶斯网络的使用已被应用于预测蛋白质-蛋白质相互作用，主要使用基因共表达、基因本体论和其他生物过程相似性。使用贝叶斯网络的数据集集成产生了精确和准确的蛋白质-蛋白质相互作用网络。\n\
    \nPCA-ELM，一种仅使用蛋白质序列信息，预测蛋白质-蛋白质相互作用的新型层次模型主成分分析集成极限学习机，已成为一种强大的工具，可以提供准确且持续时间更短的输出。\n\
    \n在哺乳动物细胞中，信号转导主要由非结构基序和球状蛋白结合结构域之间的蛋白质-蛋白质相互作用控制。为了预测多个蛋白质家族中的这些球状蛋白结合结构域，人们开发了定制的机器学习工具，称为层次统计机械建模。\n\
    \nPPI SVM，是一种基于机器学习、结构域特征和频率表的蛋白质-蛋白质相互作用预测工具。其中，由于已解决的复杂结构的数量不断增加，已经开发出一种多体线程方法MULTIPROS\
    \ PECTOR。在这种方法中，重新设计具有已知模板结构的蛋白质，并建立它们与其他蛋白质的相互作用、界面能和z评分。\n\n除了同源性建模之外，基于结构的线程逻辑回归工具Struct2Net，是第一个基于结构的蛋白质-蛋白质相互作用预测平台，可用于评估相互作用概率。Struct2Net，基于基因簇的方法，计算由相同基因簇编码的查询蛋白的直向同源物的共现概率。这种方法也被命名为领域/基因共现。如果两种蛋白质的基因在基因组中不相近，那么这种方法就不能可靠地预测这两种基因之间的相互作用。\n\
    \n（1）通过诱导折叠引导药物靶向蛋白质。\n\n深度学习方法的实现，在解决蛋白质折叠问题方面取得了显著进展，即基于氨基酸序列预测蛋白质链所采用的3D结构。\n\
    \nAlphaFold用PDB报道的蛋白质结构，训练一个多层卷积神经网络，并生成适合精确预测残基对之间距离的3D模型。这种预测是基于成对共进化信息的2D阵列表示，其前提是如果两个残基的进化在多序列比对中相关，那么它们很可能在空间上相关。进化信息与残基分析相连接，包括氨基酸同一性和二级结构预测。距离约束，即从一层到下一层的局部传播是通过逐步扩展的卷积运算实现的，其中，卷积滤波器允许合并，通过扩展滤波器的感受视野来合并周围参数。\n\
    \n蛋白质结构预测假设链采用3D结构，对于一个蛋白来说，该结构是独特的。在实践中，许多蛋白质不能自主折叠，其结构不是唯一的，而是依赖于与伙伴蛋白的结合来保持其完整性。事实上，多因素密切相关的折叠集合中选择蛋白质折叠，将其命名为诱导折叠集合。\n\
    \n抗体通常表现出抗原诱导的构象多样性，而构成药物靶向标志的蛋白质通常具有各种复合形式，这取决于它们所结合的配体/药物。\n\n诱导折叠意味着蛋白质依赖于结合伙伴来保持结构完整性，配体从诱导折叠集中选择构象。因此，为了描绘诱导折叠集的基于深度学习的预测器的合适的卷积神经网络架构，需要首先确定结构完整性损失的起因。由于主链氢键是蛋白质结构的决定因素，很明显，主链酰胺和羰基的水合作用与分子内氢键的形成竞争会产生结构破坏效应。\n\
    \n蛋白质的完整性，取决于结构本身或复合物内是否能够防止主链水合，以及一个蛋白质折叠自主程度，或其对聚合蛋白关系的依赖程度。\n\n未包覆的主链氢键构成了一种结构缺陷，称为脱氢，在主链氢键周围聚集的侧链非极性基团数量不足，从而使脱氢暴露于破坏结构的水合作用中。延伸的未包裹区域，如脱氢簇，具有很高的无序倾向，因为骨架水合作用可能优先于结构形成。因此，诱导折叠可以被解释为对结合配体的最佳结构适应，以确保对未折叠区域的最大屏蔽。\n\
    \n脱氢或包裹可以根据蛋白质的结构坐标来计算，并且该计算可以结合在深度学习平台的特征提取工作流程中。为此，该结构域定义了训练报告结构中的主链氢键微环境。脱氢烃被边缘包裹，位于结构数据库中主链氢键中w值分布的尾部。蛋白质结构中的脱氢酶破坏了其完整性，并促进蛋白质结合，以此来排除周围的水。通过这种方式，脱氢成为蛋白质结合的决定因素，因为通过减少电荷筛选，从脱氢微环境中外源性去除水可以加强和稳定主链氢键背后的静电相互作用。\n\
    \n关于脱氢在蛋白质复合物界面的分布，大量生物信息学证据支持这一观点，指出脱氢是驱动复合物形成的关键因素，富含脱氢的区域是灵活的，因此容易经历结合诱导的折叠。诱导折叠状态的先验推断对于理性的药物设计者来说至关重要，寻求通过导线优化来控制药物亲和力和特异性，以从诱导折叠集中选择完整形式。\n\
    \n利用深度学习平台，预测诱导的构象取决于特征提取阶段蛋白质链的包裹形式。结构包装必须适用于张量表示，其中信息是可描述的，并在分层架构内的数字条目的多维数组上进行处理。因此，指导药物设计过程，以靶向结合能力诱导折叠涉及使用靶蛋白的初级序列作为输入来推断诱导折叠集。\n\
    \nAlphaFold和其他结构预测模型相比，残基需要结合一个关键的额外信号进行分析，基于序列的内在无序预测是一种描述当蛋白质被分离时，沿链的内在非结构化倾向的描述符。预计将出现混乱的地区，将依赖具有约束力的聚合蛋白，以改善主链氢键的包裹，使其达到可持续的程度。\n\
    \n为了诱导折叠集基于序列的推断，需要将无序评分信号集成在残差分析中。如果蛋白质被视为自主折叠物，螺旋将部分不可持续，并且可以根据配体的不同，通过诱导折叠而部分破坏或扭曲，就像重叠区域的情况一样。\n\
    \n由主链氢键配对的残基，用成对共进化信息输入的2D阵列表示。如果两个残基的进化在多序列比对中相关，那么它们很可能在空间上相关。虽然结构张量表示允许在具有张量流的深度学习平台中进行适当的处理，但张量应被解码为3D渲染，指定包裹残留物相对于主链氢键的相对空间位置，以使片段结构连接到它上面。\n\
    \n（2）通过诱导靶向折叠进行药物设计。\n\n合理的药物设计面临诸多困难，往往达不到预期。这主要是因为靶蛋白通常不是固定的靶点，它们在结构上适应配体的方式很难预测。这就引出了药物诱导的折叠问题，这项工作旨在推动人工智能平台内的药物开发。\n\
    \n深度学习模型能够推断蛋白诱导折叠的可能性，重新调整用途，可在用于特征提取的分层结构中结合扩张卷积，这对于将非局部结构添加到诱导折叠的预测中很关键，因为在深度学习处理的特征提取阶段，每个层输入的感受域根据给定卷积核或滤波器的膨胀参数的值而逐渐放大。\n\
    \n基于药物的靶向治疗，旨在阻断特定功能失调的蛋白质，由于诱导折叠，这是一种难以预测的现象，通常会产生意想不到和不希望的交叉反应，同时使预期的靶点难以被分子识别。深度学习可以通过控制靶蛋白中诱导的折叠来指导药物设计以达到治疗效果。\n\
    \n通过在过滤器的指导下，对亲本支架进行化学修饰，来消除潜在的有害交叉反应，可以在诱导折叠集的全基因组检查的指导下，引入新的、治疗上理想的交叉反应。\n\n\
    深度学习系统旨在指导药物设计，以诱导靶向结合能力蛋白构象。药物或配体对诱导折叠的控制需要深度学习平台，该平台与蛋白质折叠预测因子不同，整合结构紊乱的信号以预测依赖于有意设计的聚合关系来维持结构完整性的松软区域的构象。这些区域的构象多样性产生了诱导折叠集，通过深度学习指导的药物设计从中选择靶向构象，从而实现具有治疗意义的药物-靶标复合。\n\
    \n在过去的几十年里，机器学习方法已经应用于制药和毒理学研究中的许多数据集，以实现前瞻性预测，并可能提高效率，最大限度地降低测试成本。\n\n# 第3章 \
    \ \n\n人工智能让结构性质预测变得简单\n\n药物发现是一个漫长而昂贵的过程，通常被描述为大海捞针。其中，我们需要找到一种完美的化合物，它满足许多标准，包括生物活性、药物代谢和药代动力学特征、合成可及性等。从药物发现项目的初始化到确定临床前研究的候选药物的过程通常需要3～5年，需要合成和测试成百上千的化合物。\n\
    \n一个药物从研发到最终上市需要经历十分漫长的过程，新药研发从最初靶点的确定、候选药物的发现和优化、再经过系统的临床前和临床研究到最终上市销售，其中需要付出巨大的人力和物力，更需要耗费漫长的时间。药物研发需要面临大量错综复杂的研究数据，研究人员需要通过对研究数据的跟踪、分析和处理来及时调整新药开发的方向和进程，每一个决定都关系到一个药物是否能最终推向临床应用。药物研发的过程花费巨大、时间漫长，一个药物从发现到上市需要10～20年的时间，例如对于化学药物来说，大约每一万个分子中，只有不到10个分子可以被选为候选药物进行临床研究，而能顺利通过临床研究的只有不到10%。在创新药物研发的实践中，出于各种原因而被迫终止的新药研发案例不胜枚举，在药物研发的任何环节出现问题都有可能导致该项目的终止，即使一个药物已经到了后期的临床研究，离上市只有一步之遥，也可能因为安全性等问题而被迫终止研究，这也意味着前期所有的努力和付出都将付诸东流。\n\
    \n随着可成药靶点的逐渐枯竭，对于新药的要求越来越高，因此目前新药研发的难度以及研发所需投入也在不断增加。在目前药物研发的过程中，如何提高药物发现和临床研究的成功率是药物研发机构重点关注的问题，在前面论述中，我们已经介绍了人工智能相关技术在药物研发各个领域的应用，可以说人工智能目前已经渗透到了药物研发的各个阶段，为药物研发提供助力。\n\
    \n当然人工智能在药物生产过程中的应用也受到了越来越多的关注，随着“工业4.0”的不断推进，以药物智能制造为内涵的“制药工业4.0”也越来越多被提及，人工智能等相关技术在药品生产作业、质量管控、物流仓储以及制药企业的其他管理方面都具有很好的应用前景。当然目前我国的药品智能制造仍处于初期发展阶段，但随着制药企业加快制药装备的智能化升级改造以及不断推进药品生产过程的智能化，我国药品制造行业智能制造水平将迎来质的提升。\n\
    \n## 3.1　新药创制过程概述\n\n总体来说新药的创新大致可以分为两个阶段：新药的发现阶段和新药的开发阶段，而新药的开发阶段还可进一步细分为临床前研究、临床研究以及新药上市3个阶段（图3-1、图3-2）。"
