    \n表6-10　MNePIN中miRNA调控的基因和蛋白富集分析\n\n![](Images/figure_0157_0059.jpg)\n\n损伤反应、伤口愈合、药物反应、防御反应、炎症反应、肝脏发育和药物代谢-P450是表6-10中确定的7种不同功能。利福平相关的miRNA和基因列在表6-11中。\n\
    \n表6-11　MNePIN的miRNA和基因\n\n![](Images/figure_0158_0061.jpg)\n\n表6-11中共鉴定出33个不同的利福平相关基因，其中P450和CYP3A5在药物代谢中有重要作用，SP3、ARF6、CEBPA、RELA与肝脏发育有关。此外，CXCL13和RELA也曾被报道为炎症标志物。\n\
    \n靶向33个基因的10个利福平相关miRNA如下：miR-107、miR-186、miR-218、miR-576-3p、miR-886-3p、miR-335、miR-616、miR-766、miR-218和Let-7g。既往研究报道利福平可诱导基因和miRNA表达变化。这些结果表明，miR-107、miR-186、miR-218、miR-576-3p、miR-886-3p、miR-335、miR-616和miR-766通过调控基因的直接或间接机制影响损伤反应。此外，let-7g、miR-107、miR-218、miR-576-3p、miR-799和miR-886-3p诱导的6个基因与伤口愈合相关，miR-218、miR-766、miR-886-3p、miR-660和miR-576-3p在药物反应中富集，miR-107和miR-186是参与肝脏发育的候选者。同样，miR-107、miR-335和miR-186也被认为通过调控ADH1B和CYP3A5与药物代谢相关。\n\
    \n3）利福平相关miRNA和负调控基因分析。\n\n为了揭示利福平相关的miRNA和基因，我们构建了miRNA-负相关表达基因网络（图6-11）。\n\n\
    ![](Images/figure_0159_0062.jpg)\n\n图6-11　关键miRNA-基因负相关表达网络\n\n**注**　黄色和灰色矩形分别代表下调和上调的miRNA。圆圈表示miRNA调控的基因，用颜色表示调控关系，红色表示上调基因，绿色表示下调基因。颜色的深度表示折叠变化的大小。\n\
    \n其中有10个miRNA负调控33个基因，网络中有62对miRNA-基因。为了关注利福平相关的miRNA, miR-576-30被指定为该网络中最重要的11个基因之一，并被建议参与创伤反应、伤口愈合、药物反应、防御反应和炎症反应。miR-186负调控包括CYP3A5在内的7个基因，提示miR-186与药物代谢过程相关。虽然miR-335对CYP3A5没有负向调控，但对ADH1B有负向调控，与药物代谢相关。\n\
    \n这33个基因通过蛋白质直接或间接地发挥作用。ADH1B、IGF1、CAV1和SGMS1的数量变化显著，且受多个miRNA调控，CYP3A5是参与药物代谢并差异表达的重要基因。这些结果表明，这5个基因在利福平诱导的生物过程中具有重要的功能。\n\
    \n在本节中，我们提取显著差异表达的miRNA，预测miRNA调控的负相关表达靶基因（MCeTG），通过扩展蛋白相互作用网络，构建了一个miRNA调控的负相关表达蛋白相互作用网络（MNePIN）。通过GO分析和KEGG通路富集分析挖掘miRNA功能，我们共鉴定出20个差异显著miRNA，预测出632个miRNA调控基因。最后识别的10个miRNA及33个基因证实其与损伤反应、伤口愈合、药物反应、防御反应、炎症反应、肝脏发育和药物代谢7种功能相关。本研究为利福平对miRNA、基因和蛋白质水平的影响提供了有价值的见解。\n\
    \n另一角度，为了解利福平诱导的差异表达miRNA及其功能，整合miRNA和基因谱，识别显著差异表达miRNA和miRNA负调控基因，我们利用蛋白质网络进一步构建miRNA调控的负相关表达蛋白相互作用网络，并通过GO分析和KEGG通路富集，提取了7个功能。总的来说，结果表明利福平有助于改变多个miRNA的表达，这为miRNA在利福平诱导的人肝细胞生物学过程中发挥重要调控作用提供了证据。\n\
    \n# 第7章  \n\n人工智能助力药物生产\n\n参与人工智能制药领域的主要有人工智能制药初创公司、互联网头部公司以及大型制药企业。人工智能制药初创公司具有自研新药管线或者药物发现平台，由于自研管线后期的临床试验成本较高，风险较大，更多的人工智能制药初创公司选择利用自身技术优势提供CRO服务。互联网巨头利用其在人工智能领域的优势，也在加速布局人工智能制药产业，目前国内互联网头部企业华为、百度、腾讯等都在积极布局人工智能制药赛道，并建立了各自的药物研发平台。传统的大型制药企业则是通过自建团队或者寻求与人工智能制药企业或互联网公司的合作进行人工智能药物研发。根据Deep\
    \ Pharma In⁃telligence的统计数据，在44家世界头部传统药企中，已有93%的药企完成与人工智能制药企业的合作布局。近年来人工智能制药领域日益受到资本市场青睐，根据Research\
    \ And Markets的数据，2022年全球人工智能制药市场规模为10.4亿美元，预计到2026年市场规模将达到29.94亿美元。目前从人工智能制药市场规模来看，美国具有绝对的领先优势，近年来国内人工智能制药也实现了快速增长，英矽智能、晶泰科技等公司均获得了大额融资与合作资本加持，目前有多个人工智能新药管线已经进入临床试验阶段（表7-1）。\n\
    \n表7-1　处于临床试验阶段的人工智能新药\n\n![](Images/figure_0161_0063.jpg)![](Images/figure_0162_0064.jpg)\n\
    \n资料来源：F.Pun, I.Ozerov, A.Zhavoronkov.AI-powered therapeutic target discovery\\\
    [J\\].Trends in Pharmacological Sciences，2023，44（9），561-572.\n\n## 7.1　人工智能制药产业的挑战和风险\n\
    \n数据制约：人工智能制药需要海量数据的支撑，才能实现模型的训练，并提高模型的准确性，目前数据的来源主要依靠科研基金、出版物等公开数据，由于数据来源比较复杂，数据质量参差不齐，对于这些数据的有效性和规范性的筛选整合需要花费大量的精力。计算机科学是较为共享与开放的，而生物医药领域则较为注重保密，所以人工智能制药本身就是一个矛盾复合体。由于制药行业相对封闭，很多制药企业虽然掌握着核心数据，但是出于知识产权保护方面的考量，并不会轻易公开核心数据。\n\
    \n缺乏专业人才：人工智能制药是信息科技与生物医药的高度融合，从事人工智能制药工作的研究人员既需要具备人工智能相关的技术手段，同时还需具备药物研发过程中所涉及的生物学、医学和化学等相关知识积累。这种复合型人才目前来说是极度缺乏的，并且培养难度大，目前国内高校也没有开设相关专业以很好地支撑此类复合型人才的培养。\n\
    \n新药研发的不确定性：新药研发是一项漫长并且花费巨大的工程，人工智能制药目前已经展现了巨大的发展潜力，但是其安全性、预期效果以及是否能达到传统药物的监管标准仍然存在一定的质疑。目前虽然多个人工智能药物管线已经进入临床试验阶段，但是仍然缺少上市的人工智能药物来进一步验证人工智能制药的可靠性。\n\
    \n## 7.2　人工智能药物生产的发展\n\n智能制造目前尚无统一的定义，国家工信部和国家标准化管理委员会2015年10月正式发布《国家智能制造标准体系建设指南》（征求意见稿）对“智能制造”所作的定义如下：“智能制造是指将物联网、大数据、云计算等新一代信息技术与设计、生产、管理、服务等制造活动的各个环节融合，具有信息深度自感知、智慧优化自决策、精准控制自执行等功能的先进制造过程、系统与模式的总称。”工业4.0是指第四次工业革命，它汇聚了物联网、人工智能、机器人和先进计算等快速发展的技术，极大地改变了制造业的格局。工业4.0环境中集成的自主和机器人系统将工业生产流程的在线数据和人工智能融合，以优化制造过程和企业管理。《“十四五”医药工业发展规划》提出，要深入实施智能制造、绿色制造和质量提升行动，提高药品、医疗器械全生命周期质量管理水平和产品品质，推动医药工业高端化、智能化和绿色化发展。因此制药工业智能制造备受关注，制药4.0的概念也越来越多被提及。其实制药4.0可以理解为第四次工业革命在制药行业的应用，它将物联网、人工智能、机器人技术和先进计算等快速发展的技术结合起来，从而彻底改变制药行业的格局。制药4.0通过数字化、自动化和智能化的生产系统，实现制药生产的高效、灵活、质量可控和可持续发展。\n\
    \n（1）制药工业智能制造的系统构架。\n\n由于目前国内制药工业的智能制造仍处于发展阶段，根据工信部产业发展促进中心、中国医药企业管理协会联合编制的《中国制药工业智能制造白皮书（2020年版）》，制药工业智能制造的主要目标是，按照相关法规要求，实现生产记录和管控流程的电子化和系统化，确保生产全过程的合规性和信息透明化，提高生产质量管控水平，降低人为因素引起的合规性风险，从而提高产品质量、降低成本。生产系统应该以生产质量管理规范（GMP）要求为标准，通过业务全程管控等手段，实现自动化与信息化的协同，优化关键业务间的交互融合，实现业务一体化，优化整体业务协同能力。\n\
    \n制药工业智能制造总体系统架构可以分为设备层、控制层、业务管理层和运营管理层（图7-1）。设备层主要为物理基础设施，可通过可编程逻辑控制器（PLC）、过程管理系统（PCS）采集和管理设备以及传感器产生的数据，实现各类数据的完整记录。控制层主要由数据采集及监控系统（SCADA）和自动化控制系统构成，为生产系统提供数据采集及报警监控的一体化平台，实现全车间生产设备的数据采集、存储及流程运行监控。业务管理层主要面向生产过程，覆盖生产运行与管理、设备管理、仓储管理、质量保证和质量控制、能源管理等方面的业务，实现生产的集成化和智能化。运营管理层覆盖公司的产供销以及供应链业务，实现经营管控一体化，并且通过信息技术与制造管理技术深度融合，汇聚各个业务系统的数据，利用大数据分析技术实现分析决策的智能化。\n\
    \n![](Images/figure_0164_0065.jpg)\n\n图7-1　生产制造体系智能制造系统构架\n\n资料来源：工业和信息化部产业发展促进中心和中国医药企业管理协会。\n\
    \n（2）人工智能在药物生产过程中的应用场景。\n\n优化工艺设计和放大：机器学习等人工智能手段可以通过对过程开发数据的分析和处理从而更快地确定最佳处理参数或放大过程，减少开发时间。例如利用人工智能可以帮助化学药物的合成路线设计、反应条件推荐等，并且在工艺放大过程中，通过实时模拟预测反应进程，对反应工艺参数进行调整，以提高反应收率或者排除反应过程中的安全隐患。\n\
    \n过程控制：在配方驱动的生产过程中，可以利用MES系统对生产过程的重点参数进行监控，确保生产过程按既定的工艺流程作业，与此同时还能实现生产过程质量控制的实时检测，代替传统的实验室离线检测模式，进一步提高产品生产效率。先进过程控制（APC）可以对制造过程进行动态控制，从而建立基于工艺模型的多变量参数预测或监控模型，还可以将人工智能与实时传感器数据相结合，从而实现精准的过程控制。APC方法结合人工智能和对制造过程中发生的化学、物理和生物转化的理解，将更广泛地应用于药物的智能制造。\n\
    \n过程监控和故障检测：人工智能方法可用于监控设备和监测正常运行过程中的数据变化，从而判断是否需要开展设备维护，减少生产过程的停机时间。利用过程分析技术（PAT）可以实现生产过程的自动取样检测，实现对产品关键参数的实时监测。视觉识别技术的应用还可以对生产过程中操作人员的行为规范进行管理，发现不合规的操作及时进行预警和提醒，以确保生产过程符合操作规范，此外视觉识别技术还可以用于产品的质量检测。\n\
    \n（3）我国制药行业智能制造的发展现状。\n\n制药工业智能制造的发展基础相对薄弱，整个行业的自动化和信息化水平较低。目前在制药行业中，虽然机械化水平较高，也不缺少自动化控制系统的应用，但是往往这种自动化只能局限于生产流程的局部单元。虽然在制剂阶段设备自动化程度会相对高一些，但是往往是比较封闭的，无法实现内部数据的向外传输，同样也无法利用外部的系统实现设备的控制。这些系统和设备之间大部分无法实现系统化的集成，也就导致了整个生产过程的孤立，无法实现端到端的连续生产过程。目前在药品生产过程中所涉及的物料的转运和投放大部分仍然依靠人力完成，使整个生产过程中存在许多信息化的孤岛。目前大多数药企都有一定的信息化建设基础，例如办公自动化系统（OA）、企业资源管理系统（ERP）、财务及成本管理（FCM）和生产执行系统（MES）等在制药企业中已经被较广泛的使用，但是制药企业的整体信息化建设方面仍较为薄弱，各个企业在信息化建设的水平上参差不齐，并且这些系统主要还是用于企业的日常管理和办公，缺少与产品生产过程的深度融合。此外，目前制药企业对于连续制造、过程分析技术、数字孪生、电子批记录、物联网、大数据、云计算等人工智能相关新技术的使用仍处于探索阶段。\n\
    \n在国家政策和法规以及制药企业提升生产效率的需求下，制药行业智能制造迎来了发展机遇。工信部关于“十三五”《医药工业发展规划指南》中提出：“到2020年，医药生产过程自动化、信息化水平显著提升，大型企业关键工艺过程基本实现自动化，制造执行系统（MES）使用率达到30%以上，建成一批智能制造示范车间”。2015年“中国制造2025”战略被首次提出，作为制造业的重要组成部分，制药企业必须重视药品制造的智能化、信息化和可追溯性。近年来，对于药品监管的力度越来越大，2021年《“十四五”国家药品安全及促进高质量发展规划》正式发布，全面加强药品全生命周期监管。随着质量监管要求的不断提升，制药企业需要不断提升和健全自身质量体系，提高产品质量，对于药品智能制造的需求也是迫在眉睫。此外，对于疫苗生产企业，信息化建设已经成为了强制要求，GMP《生物制品》附录第59条规定疫苗生产企业应采用信息化手段如实记录生产、检验过程中形成的所有数据，确保生产全过程持续符合法定要求。对于人工操作（包括人工操作、观察及记录等）步骤，应将该过程形成的数据及时录入相关信息化系统或转化为电子数据，确保相关数据的真实、完整和可追溯。从这一点也可以预见，今后对于制药企业的信息化建设要求会越来越普遍。药品上市许可持有人制度和集中采购制度加大了目前制药企业间的竞争力度，企业提升生产效率的需求日益凸显，进一步提升了企业推动智能化转型的内在动力。\n\
    \n对于我国制药工业来说，实现智能制造的关键是要打好两个基础：从下提升制药生产底层制药装备和制药过程的自动化、数字化与网络化的水平，建立所谓的信息物理系统CPS的智能化物理基础；从上充分采用工业互联网、物联网、工业大数据、云计算等新一代的信息化技术，建立以这些技术为基础的数据中心和支撑服务平台，以达到实现智能决策、优化管理、协同发展和服务的目的。\n\
    \n随着“中国制造2025”战略和“工业4.0”的推进，以及人工智能相关技术的不断完善，加上法规政策的压力，国内制药企业顺应趋势，积极尝试智能化转型。同时政府相关部门也高度重视并积极推动制药行业的智能制造，工业和信息化部产业发展促进中心和中国医药企业管理协会等相关部门发布了《中国制药工业智能制造白皮书（2020年版）》和《制药企业智能制造典型场景指南（2022版）》，助力制药企业推进智能制造。\n\
    \n[\\[1\\]](../Text/Chapter7.xhtml#z1)王颖.成熟microRNA识别及其功能预测方法研究\\[D\\].哈尔滨工程大学，2016."
  fmt: '

