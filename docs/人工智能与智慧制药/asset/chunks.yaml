- raw: '客观地探索广泛的化学空间和解决多目标优化中的相关挑战，是计算化学应用的一项重要任务。通过使用计算机程序，自动评估“非常大的化合物库”，来识别在药物发现中的苗头和先导化合物的过程被称为虚拟筛选。


    虚拟对接，包括将一个小分子最佳地拟合到一个大分子中，并评估该拟合的质量。从这两个分子的合适结构开始是很关键的，通常来说，期望蛋白质和配体的构象与之前相同是不现实的。同样地，将一个配体分子从蛋白质晶体结构中切割出来，然后将完全相同的构象对接到完全相同的空腔中，也是一个不切实际的简单测试。


    对接方法的一个要求是彻底探索搜索空间，这样就不会错过蛋白质和配体或姿态的正确配置。即使蛋白质和配体都是刚体，没有构象的灵活性，搜索空间也已经是六维的，增加了配体的灵活性和蛋白质的一些构象自由，显著增加了有待探索的空间。这意味着，理想情况下，配体很适合结合位点，没有明显的冲突或空隙。


    其中蛋白质和配体结合具有形状和化学互补性。这意味着，理想情况下，配体能很好地嵌入结合位点，不会产生明显的碰撞或空洞。氢键、极性和疏水基团也被适当地定位。使用一个具有能量维度的函数来近似蛋白质-配体复合物的自由能是很常见的，虽然不是强制性的。为了有更好的效果，需要一个快速评估的能量函数，既可以评估当前配置的质量，也可以指导寻找更好的解决方案。而且，尽管与真实模式有差别，但全局最小值尽可能接近正确的位置。分子力学力场可能提供适当的能量函数，特别是它们很可能产生梯度，可以引导搜索到能量分布上的局部或全局最小值。这是解决搜索和优化问题的众多方法之一。


    从头药物设计旨在产生符合特定标准的化学物质，包括对靶点的疗效、合理的安全性、合适的化学和生物特性、足够的新颖性，以确保获得知识产权等。在新算法的帮助下，进行计算分子的设计和评价，从头药物设计被认为是一种有效的手段，以减少制备大量的新化学结构花费的时间、金钱，并高效地识别化学基因组研，从中找到可以作为先导物的起点结构。


    早期的从头药物设计方法，无论是直接从蛋白质结构还是从已知配体的特性推断，几乎完全使用基于结构的方法，在目标的结合袋的约束内生长配体。这些早期方法的一个局限性是，生成的结构制备难度大，药物成药性差。


    最近，基于配体的从头设计方法已经证明了其在药物化学中的适用性。生成的化合物库，可以通过评分函数进行额外的分析，该函数考虑了一些特性，如生物活性、合成可行性、代谢和药代动力学特性等。构建这样一个虚拟库的一种方法是使用化学反应子集、一组可用的化学构建块，以及一个合成可获得的分子池。


    ## 4.2　药物筛选的一般方法


    （1）虚拟筛选。


    药物的设计和开发是一个非常漫长而昂贵的过程。虚拟筛选的最大好处是，它完全是用生物信息学进行的，可以避免花费时间和金钱来购买、合成和分析不合适的分子。一个成功的虚拟屏幕就是一个生物信息学涵盖的集合，它大量丰富了可能的活动，与原始的虚拟库相比，其中包含的比例要高得多。


    虚拟筛选是一系列计算工具的名称，用于搜索化学数据库，以识别对特定生物目标表现出活性的分子。这些工具被广泛用于降低药物发现的成本，过滤掉在传统生物筛选中不太可能产生积极结果的大量典型数据库。


    虚拟筛选主要有两种类型，当生物目标的三维结构可用时，可以使用基于结构的方法；在缺乏这类结构信息的情况下，可以使用基于配体的方法，如相似性搜索、药效团映射和机器学习等。虚拟筛选方法的选择取决于可用数据的数量和类型，与方法的相关计算需求有很大差异。例如，三维虚拟筛选方法可能需要为正在搜索的数据库中的所有分子生成低能量构象。


    相似性搜索是基于配体的虚拟筛选中最简单和最广泛使用的工具之一，因为它只需要一个已知的生物活性分子或参考结构作为数据库搜索的起点。相似性搜索的基本思想是相似的性质原理，即结构相似的分子将表现出相似的物理化学和生物学性质。近年来，许多测量分子结构相似性的方法已经被广泛使用。最常见的方法包括，使用具有二维指纹特征的分子，以编码分子中二维片段亚结构，然后计算两个分子之间的相似性，使用一对结构共同的亚结构片段的数量和一个简单的关联系数。


    （2）配体识别评分。


    现今，基于结构的药物从头设计是计算机辅助药物设计的主要手段和方法。基于靶点的结构，通过评价氢键作用、共价键作用及范德华作用，识别能够与靶蛋白结合的优势结构。对药物化学家来说，准确预测出目标结构与蛋白的结合能力是非常重要的。评价目标结构与靶蛋白的结合能力，主要有三种方式，包括基于经验的评分方式，基于知识的评分方式和基于物理的评分方式。基于经验的评分函数，计算效率高，函数简单。但它也有局限性，它很难发现亲和力和用于建模的晶体结构之间的联系。基于知识的评分函数，根据数据库当中的原子平均力势，这种原子之间的作用往往忽略周围环境的影响，但实际上，环境的影响是不可以忽略的，并且数据集有限，无法包括所有的化学类型。基于物理的评分函数利用实验信息进行量子力学计算，一般需要大量的计算，评估成本较高。


    第一种方法是结合能值预测的方法，通过使用评分函数，来预测给定几何形状的蛋白质-配体复合体的结合自由能，或等效的结合亲和力。对接完成后，可以重新评估最佳姿势。这个评分函数，既不受非常快速评估的限制，也不受任何需要其梯度来引导能量分布，搜索达到有意义的最小值的限制。因此，它不一定与对接内用于优化的能量函数相同。尽管如此，使用分子力学力场进行评分仍然很常见。这可能涉及相关溶剂环境中的分子力学计算。


    第二种流行的方法是开发经验评分函数，原则上，评分函数中与对结合自由能、物理意义上热力学贡献之间存在直接的对应关系。然而，这些参数是从数据中通过经验得出的。拟合通常只针对总束缚自由能，所以单个项的精确值不那么重要。


    第三种方法，是使用已知的蛋白质-配体复杂结构作为知识库。这些基于已知情况的评分函数试图描述蛋白质-配体结合，并最终使用平均力形式预测结合亲和力，给真实复合物原子间距离分布相似的复合物很好的分数。它们只需要结构数据，而不需要绑定的亲和力作为输入，对蛋白质-配体复合物中的原子-原子距离进行采样，然后将它们作为准化学平衡产生的变量来处理，然后应用反向玻尔兹曼方法，将距离的直方图转换为一个自由能函数。当所有的蛋白质-配体原子-原子的贡献加起来时，所产生的结合能平均大约大了十倍，与实验数据的相关性很好。


    这个误差的数量级实际上很容易理解。在液体和气体的统计物理学中，原子-原子距离本质上是自变量，可以在环境温度下平衡的假设下采样，蛋白质-配体复合物中的原子-原子距离也不是这样的。在蛋白质-配体的相互作用中，分子的拓扑连通性，意味着配体分子和蛋白质之间的不同原子-原子距离绝对不是独立的，相反，它们是强相关的。因此，虽然数学假设一个是抽样自变量，但实际上，是对高度相关的变量抽样。因此，信号的概率强度被高估了，并预测了过强的结合能。原则上，人们可以尝试找到一个粒度，以最小化这个误差。然而，这样的尝试将是经验性的，似乎不能在这种蛋白质-配体的背景下被严格地证明。因此，人们将相反的玻尔兹曼技巧简单地看作是一种将原子-原子距离的直方图，转换为具有能量维度和适当极限性质的适当函数，而不尝试提供任何物理或数学证明。这些困难可以通过使用机器学习方法，获得基于知识的潜力来克服。在基于知识的评分函数的生成中，添加一个机器学习组件，允许它们利用绑定亲和关系和结构数据。


    此外，也可以使用共识评分方法，将不同的评分函数组合到一个单一的预测中。这可以充分利用已知与目标结合的分子，以三维排列覆盖，获得共同结构特征的最佳匹配：氢键供体或受体、疏水基团、芳香环、带电基团等。


    所得到的模板被称为药效团。药效团通常是一个分子的一部分结构，需要具备一组特征组成，以及它为了结合目标而必须满足的几何约束条件。这些都是一组分子以相同的方式与给定的结合位点相互作用的必要不充分条件，从而产生相同的药理作用。由于药效团是基于活性分子的，正在测试的假设与活性有关，而不仅仅是结合。很有可能，另一组分子可能与同一受体或另一个受体相互作用，从而产生相同的效果。这些都不会被最初的药效团所覆盖。


    即使在目标结构存在的情况下，药效团的生成也可能仍然是一个有用的替代对接。蛋白质结构的存在，将允许直接从大分子坐标开发一个药效团模型。一个药效团可以用于虚拟筛选，在一个只需要存在于生物信息学中的大型化学结构库中搜索命中点。在这里，至关重要的是，生物学相关的三维构象的生成和搜索。这种几何形状可能与分子的最小能量构象完全不同，无论是孤立的还是固态的，虽然它广泛符合药效团建模的传统原则。


    利用机器学习，自动生成基于晶体结构数据的交互模型的方法。这些基于药效团的模型可以用于虚拟筛选，或者用于指导从头分子设计，而不是文库搜索。


    （3）形状识别方法。


    基于配体的识别归属于形状识别方法，使用正式的药效团模型，根据分子形状将虚拟文库中的结构与已知的结合物进行比较，有时还与其他特性相结合。该方法利用分子间原子距离分布来描述分子。有三个重要的特性：第一，力矩与大小无关，允许对具有相当不同原子数量的分子进行比较。第二，与传统方法相比，描述三维化学结构的数据要少得多，整个分子为12个描述符，而不是具有n个原子的化合物的3n个坐标。第三，也是最重要的，该方法并不依赖于显式的分子排列。


    （4）分子相似性搜索。


    虚拟筛选中最简单的方法之一是分子相似性搜索。同样，正如在形状识别中一样，其目标是在虚拟库中找到与之类似的已知活性或活性分子。现在，相似性的定义是基于化学描述符，而不是形状描述符。该法假定结构相似的分子将具有相似的生物活性。这是类似性质原理的一个例子，即由一组基于结构的描述符定义的“化学空间”中紧密相连的两个分子比两个相距较远的分子更有可能共享相似的性质。相似性搜索说明，关于分子，决定其生物活性的机制并没有什么新信息，因为没有考虑到蛋白质靶标的结构。尽管如此，我们可以合理地推测，表现出相同生物活性的高度相似的分子，可能与目标产生类似的相互作用。


    为了进行相似性搜索，可以在计算机中对化学结构进行许多表示，从而为每个化合物产生一组特征。其特征，可以是单个原子或原子群，或计数或键碎片的拓扑指数，或物理化学性质的计算或估计值，如对数P；可以是电子性质如轨道能量、原子部分电荷、极化率或偶极矩，可能来自半经验量子力学；也可以是形状、表面积、体积、分子量。然后这些特性形成一个向量，在描述符定义的化学空间中，定位一个给定的分子。如果不同特性的值具有不同的范围，则通常会对它们进行缩放。由于许多特征将相互关联，因此通常是通过消除每一对高度相关的描述符，或使用主成分分析等技术，来减少空间的维数。然后，搜索依赖于计算化学空间中两点之间的距离度量，如欧几里得距离或曼哈顿距离，或相似性度量，如谷本系数。因此，人们可以找到其他与已知活性分子具有高度相似性，或较小距离的分子。


    重要的是，该法要理解用于描述分子的特征、描述符和指纹。它们没有单一的正确定义，相反，一个给定的定义，可以通过分析具有相似结构和相似性质的分子对的高相似性，来得到经验证明。


    （5）多靶点预测。


    新化学物质的发现需要在设计过程中平衡几个标准，包括目标效价、选择性、清除率和渗透性。然而，对其中一个属性进行优化可能会损害其他属性。这种潜在的冲突目标的问题可以在计算框架中进行转换，也被称为多参数优化、多目标规划、向量优化、多迭代优化、多属性优化。药物发现和开发领域已经在很好地利用这些计算技术，目前这些技术与机器学习作为人工智能的一个分支。


    多目标化设置中，需要访问每个所需属性的一组计算预测模型，然后可以应用许多现有多目标化算法中的一种来尝试解决潜在的优化问题，即找到一个或多个平衡所需属性的分子。由于这些属性经常发生冲突，我们的目标是生成一组可能的解决方案线索，每个线索都以不同的方式进行权衡，但解决方案集的任何成员都无法在一个属性中得到改进，而不在不同的属性中放弃某些东西。在后一种意义上，每个解决方案都是最优的。这组解可以被认为是描绘出一个最优性的边界，沿着边界移动会产生一组最优解，每个最优解都有自己的交换属性的方式。


    追踪这种边界的目标所固有的事实是，我们缺少全面的信息集。特别是，如果确切地知道如何权衡各种药物设计标准，有时在项目开始时，就可以使用更传统的计算优化方法来寻找优化精确已知权衡函数的分子。然而，在药物发现领域，就像在许多领域一样，开发过程是迭代的，而不是分析性的，具有大量的“人为因素”成分。例如，一个药物化学家，提供的专家知识和决策，还不能被统计和机器学习模型编码，要么是因为缺乏相关数据，要么因为问题本身就很困难。因此，多目标化的目标是生成一组不同但实际上最优的特定分子设计挑战的解决方案，随后，这些解决方案被交给人类专家，以筛选深入的、隐含的知识和直觉。


    基于相似性方法，最有价值的改进是将其扩展并应用于搜索多个目标。原理很简单，每个分子都对大量与已知不同目标关联的化合物进行相似性评估。因此，输出不是返回一个单一的活性，而是一个生物活性谱，显示了每个化合物对每个目标的预测活性。


    多靶点预测，在提供药物潜在副作用的快速计算评估方面具有明显的应用价值。显然，预测与多个靶点的混杂相互作用，可能是药物开发项目的一个良好指示。从更积极的方面来看，多靶点预测可以帮助预测和合理化多药理活性，其中，一种药物通过与多种蛋白质相互作用而起作用。这种计算方法甚至可能对现有药物梳理出新的作用机制。


    因此，多靶点预测在计算毒理学中是非常有价值的。在越来越重视动物伦理的环境下，计算方法将在毒性预测中发挥越来越大的作用。使用的模型将从简单的结构过滤器中，通过量化，特定于一个毒性相关的目标或终点，或本地配体化学空间，类似之前讨论过的复杂的目标预测方法。


    （6）反向QSAR。


    反向QSAR方法从一个不同的角度处理从头设计任务，而不是首先生成一个虚拟化学库，然后对基于相似模板的化合物进行评分和排名。反向QSAR，试图找到一个显式反向映射分子描述符，然后从描述符空间的有利区域映射回相应的分子。反向QSAR方法的主要障碍在于，选择一种分子表征，该分子表示信息丰富，不仅适合充分处理给定生物特性的正向QSAR任务，而且适合于后续的重建阶段。


    为了避免忽视有吸引力的候选分子，增加生成结构的多样性和新颖性，应该使用大片段库。这是以增加片段交换和相似性搜索过程的成本为代价的。许多从头药物设计方法，利用一组分子构建块或合成化合物片段，进行分子组装，以减少产生不利化学结构的风险。药物化学家们创建了一个基于简化分子输入线输入规范的化学语言模型，以规避过多无效结构的问题。


    要解决这个问题，主要努力集中在通过生成模型隐式学习这种转换的方法上。深度生成网络，鉴于其处理序列数据与长期依赖的关系，在没有任何明确的先验化学库的情况下，在从头药物设计中显示出可喜的前景。


    为了实现分子设计，需要对额外的多层感知器进行训练，以基于分子的潜在空间坐标，来预测合适的特性。预测任务在重建任务上进行联合训练，当给定编码分子的潜在向量时，可以通过向最有可能改善目标特性的方向移动，将新的候选向量，生成并解码成相应的分子。同时，该模型对电子性能具有良好的预测能力。此外，在采用结合药物成药性和合成可行性等混合优化目标后，该模型能够执行迭代的、基于梯度的优化，以更好地匹配所需的分子特性。


    经过简化分子输入线输入规范表征训练的循环神经网络，既可以学习生成描述符，也可以生成与模板化合物性质相似、但支架不同的候选分子。该方法的从头药物设计，采用了转移学习，首先将循环神经网络模型在大量分子上进行训练，然后进一步用小组活性分子进行再训练，以使采样分子偏向于给定的模板集。


    基于机器学习的表征空间内分子识别，属于一种新的训练集生成方法。该方法包括两个步骤。第一步是使用字符级，来学习给定化学子集字符串中字符的概率分布，然后是后处理来消除无效价、芳香性的结构，从而模拟具有相似特性和不同支架的分子输出。在细胞分析中，研究发现，模拟生成的化合物可以作为未折叠蛋白反应和VEGFR2通路的抑制剂，以证明模拟输出结果，并可作为药物从头设计的先导物。


    上面提到的方法，允许生成包含天然产物样特征的化合物，同时仍然保留一些典型小分子化合物的合成可行性，并保证结构多样性。此外，此方法使用简化图表示分子的描述符，然后生成满足药物形态模板的相应参数，将分子属性信息与分子的潜在表示连接起来。该模型的性能是通过生成具有五种目标特性的类药物分子的特定值来证明的，包括分子量、分配系数、氢键供体和受体的数量以及拓扑极性表面积，满足可接受的误差范围，并通过创建具有可变对数P值的类似物，限制其他特性。


    但全新设计在药物发现中尚未得到广泛应用。这至少部分与化合物的产生有关，这些化合物在合成上难以获得。由于人工智能领域的发展，该领域最近出现了一些复兴。


    关于量化生成的化合物的多样性的最合适的方法，一直有一些争论，包括模型自身和化合物的训练资料库。这种方法可以以直接的方式扩展到其他此类分子表示，并允许直接测量微调，使取样偏向给定目标空间。


    ## 4.3　人工智能辅助药物筛选


    计算药物化学的未来趋势，可能包括越来越常规地使用信息学方法来预测脱靶和在靶上的生物活性，包括可能的副作用（图4-1）。随着动物实验数量的减少，对毒理学终点的计算预测将变得越来越关键。相当一部分药物以酶作为它们的靶点。随着人们越来越强调理解药物治疗疾病的作用机制，化学信息的重要性不言而喻，可以期待，药物设计和计算酶学之间出现一个越来越有效的界面。我们对酶机制的日益系统化，将促进这一过程。我们还可以期待药物化学和系统生物学之间越来越重要的相互促进作用。


    ![](Images/figure_0086_0020.jpg)


    图4-1　指导数据收集和模型改进策略的算法


    虽然人工智能为科学家提供了新的挑战和很多新的工具，但一些科学家对此持怀疑态度，期待在药物发现过程当中看到更加显著的影响。生物学和免疫学已经取得了长足进步，高通量合成及活性筛选也广泛应用，但新药的开发仍然是一个耗时的过程。大量的药物研发人员投入了巨大的精力，但临床试验的高失败率导致新药研发困难重重。因此，需要更加创新的方法寻找低成本的研究方案，为更多的患者提供治疗药物。


    长期以来，计算机辅助药物设计被认为是降低药物研发投入，提高药物研发成功率的有效手段。随着继续学习和数据处理能力的提高，计算机辅助药物设计能帮助我们更快的寻找到候选药物。


    过去，小分子药物的发现大量依赖于高通量筛选，此过程需要制备大量的小分子结构，但机体生物环境的复杂性影响药物活性的多因素性，导致成功率极低。在药物筛选过程中，需要考虑很多因素，包括靶点结构、多靶点的选择性、药物的代谢、毒理作用等一些重要的参考指标。


    应用人工智能进行药物设计首先要考虑的是寻找到合适的数据集。合适的数据集对建立预测模型至关重要，否则即使一个非常完美的模型，也无法解决关键问题。在评估数据集时要看此数据集是否考虑到建模的重点，一个可靠的药理学模型能够减少药物开发时间。


    虽然近代药物研究已经发表了千万篇药理研究论文，但相比于复杂的体内生理学环境，现有的体内药理数据仍显得单薄和有限。现有的方式是采用体外实验结果，替代体内实验。但体外实验结果与体内的药理作用往往表现出巨大的差异。'
  fmt: '

    客观地探索广泛的化学空间和解决多目标优化中的相关挑战，是计算化学应用的一项重要任务。通过使用计算机程序，自动评估“非常大的化合物库”，来识别在药物发现中的苗头和先导化合物的过程被称为虚拟筛选。


    虚拟对接，包括将一个小分子最佳地拟合到一个大分子中，并评估该拟合的质量。从这两个分子的合适结构开始是很关键的，通常来说，期望蛋白质和配体的构象与之前相同是不现实的。同样地，将一个配体分子从蛋白质晶体结构中切割出来，然后将完全相同的构象对接到完全相同的空腔中，也是一个不切实际的简单测试。


    对接方法的一个要求是彻底探索搜索空间，这样就不会错过蛋白质和配体或姿态的正确配置。即使蛋白质和配体都是刚体，没有构象的灵活性，搜索空间也已经是六维的，增加了配体的灵活性和蛋白质的一些构象自由，显著增加了有待探索的空间。这意味着，理想情况下，配体很适合结合位点，没有明显的冲突或空隙。


    其中蛋白质和配体结合具有形状和化学互补性。这意味着，理想情况下，配体能很好地嵌入结合位点，不会产生明显的碰撞或空洞。氢键、极性和疏水基团也被适当地定位。使用一个具有能量维度的函数来近似蛋白质-配体复合物的自由能是很常见的，虽然不是强制性的。为了有更好的效果，需要一个快速评估的能量函数，既可以评估当前配置的质量，也可以指导寻找更好的解决方案。而且，尽管与真实模式有差别，但全局最小值尽可能接近正确的位置。分子力学力场可能提供适当的能量函数，特别是它们很可能产生梯度，可以引导搜索到能量分布上的局部或全局最小值。这是解决搜索和优化问题的众多方法之一。


    从头药物设计旨在产生符合特定标准的化学物质，包括对靶点的疗效、合理的安全性、合适的化学和生物特性、足够的新颖性，以确保获得知识产权等。在新算法的帮助下，进行计算分子的设计和评价，从头药物设计被认为是一种有效的手段，以减少制备大量的新化学结构花费的时间、金钱，并高效地识别化学基因组研，从中找到可以作为先导物的起点结构。


    早期的从头药物设计方法，无论是直接从蛋白质结构还是从已知配体的特性推断，几乎完全使用基于结构的方法，在目标的结合袋的约束内生长配体。这些早期方法的一个局限性是，生成的结构制备难度大，药物成药性差。


    最近，基于配体的从头设计方法已经证明了其在药物化学中的适用性。生成的化合物库，可以通过评分函数进行额外的分析，该函数考虑了一些特性，如生物活性、合成可行性、代谢和药代动力学特性等。构建这样一个虚拟库的一种方法是使用化学反应子集、一组可用的化学构建块，以及一个合成可获得的分子池。


    ## 4.2　药物筛选的一般方法


    ### （1）虚拟筛选

    药物的设计和开发是一个非常漫长而昂贵的过程。虚拟筛选的最大好处是，它完全是用生物信息学进行的，可以避免花费时间和金钱来购买、合成和分析不合适的分子。一个成功的虚拟屏幕就是一个生物信息学涵盖的集合，它大量丰富了可能的活动，与原始的虚拟库相比，其中包含的比例要高得多。


    虚拟筛选是一系列计算工具的名称，用于搜索化学数据库，以识别对特定生物目标表现出活性的分子。这些工具被广泛用于降低药物发现的成本，过滤掉在传统生物筛选中不太可能产生积极结果的大量典型数据库。


    虚拟筛选主要有两种类型，当生物目标的三维结构可用时，可以使用基于结构的方法；在缺乏这类结构信息的情况下，可以使用基于配体的方法，如相似性搜索、药效团映射和机器学习等。虚拟筛选方法的选择取决于可用数据的数量和类型，与方法的相关计算需求有很大差异。例如，三维虚拟筛选方法可能需要为正在搜索的数据库中的所有分子生成低能量构象。


    相似性搜索是基于配体的虚拟筛选中最简单和最广泛使用的工具之一，因为它只需要一个已知的生物活性分子或参考结构作为数据库搜索的起点。相似性搜索的基本思想是相似的性质原理，即结构相似的分子将表现出相似的物理化学和生物学性质。近年来，许多测量分子结构相似性的方法已经被广泛使用。最常见的方法包括，使用具有二维指纹特征的分子，以编码分子中二维片段亚结构，然后计算两个分子之间的相似性，使用一对结构共同的亚结构片段的数量和一个简单的关联系数。


    ### （2）配体识别评分

    现今，基于结构的药物从头设计是计算机辅助药物设计的主要手段和方法。基于靶点的结构，通过评价氢键作用、共价键作用及范德华作用，识别能够与靶蛋白结合的优势结构。对药物化学家来说，准确预测出目标结构与蛋白的结合能力是非常重要的。评价目标结构与靶蛋白的结合能力，主要有三种方式，包括基于经验的评分方式，基于知识的评分方式和基于物理的评分方式。基于经验的评分函数，计算效率高，函数简单。但它也有局限性，它很难发现亲和力和用于建模的晶体结构之间的联系。基于知识的评分函数，根据数据库当中的原子平均力势，这种原子之间的作用往往忽略周围环境的影响，但实际上，环境的影响是不可以忽略的，并且数据集有限，无法包括所有的化学类型。基于物理的评分函数利用实验信息进行量子力学计算，一般需要大量的计算，评估成本较高。


    第一种方法是结合能值预测的方法，通过使用评分函数，来预测给定几何形状的蛋白质-配体复合体的结合自由能，或等效的结合亲和力。对接完成后，可以重新评估最佳姿势。这个评分函数，既不受非常快速评估的限制，也不受任何需要其梯度来引导能量分布，搜索达到有意义的最小值的限制。因此，它不一定与对接内用于优化的能量函数相同。尽管如此，使用分子力学力场进行评分仍然很常见。这可能涉及相关溶剂环境中的分子力学计算。


    第二种流行的方法是开发经验评分函数，原则上，评分函数中与对结合自由能、物理意义上热力学贡献之间存在直接的对应关系。然而，这些参数是从数据中通过经验得出的。拟合通常只针对总束缚自由能，所以单个项的精确值不那么重要。


    第三种方法，是使用已知的蛋白质-配体复杂结构作为知识库。这些基于已知情况的评分函数试图描述蛋白质-配体结合，并最终使用平均力形式预测结合亲和力，给真实复合物原子间距离分布相似的复合物很好的分数。它们只需要结构数据，而不需要绑定的亲和力作为输入，对蛋白质-配体复合物中的原子-原子距离进行采样，然后将它们作为准化学平衡产生的变量来处理，然后应用反向玻尔兹曼方法，将距离的直方图转换为一个自由能函数。当所有的蛋白质-配体原子-原子的贡献加起来时，所产生的结合能平均大约大了十倍，与实验数据的相关性很好。


    这个误差的数量级实际上很容易理解。在液体和气体的统计物理学中，原子-原子距离本质上是自变量，可以在环境温度下平衡的假设下采样，蛋白质-配体复合物中的原子-原子距离也不是这样的。在蛋白质-配体的相互作用中，分子的拓扑连通性，意味着配体分子和蛋白质之间的不同原子-原子距离绝对不是独立的，相反，它们是强相关的。因此，虽然数学假设一个是抽样自变量，但实际上，是对高度相关的变量抽样。因此，信号的概率强度被高估了，并预测了过强的结合能。原则上，人们可以尝试找到一个粒度，以最小化这个误差。然而，这样的尝试将是经验性的，似乎不能在这种蛋白质-配体的背景下被严格地证明。因此，人们将相反的玻尔兹曼技巧简单地看作是一种将原子-原子距离的直方图，转换为具有能量维度和适当极限性质的适当函数，而不尝试提供任何物理或数学证明。这些困难可以通过使用机器学习方法，获得基于知识的潜力来克服。在基于知识的评分函数的生成中，添加一个机器学习组件，允许它们利用绑定亲和关系和结构数据。


    此外，也可以使用共识评分方法，将不同的评分函数组合到一个单一的预测中。这可以充分利用已知与目标结合的分子，以三维排列覆盖，获得共同结构特征的最佳匹配：氢键供体或受体、疏水基团、芳香环、带电基团等。


    所得到的模板被称为药效团。药效团通常是一个分子的一部分结构，需要具备一组特征组成，以及它为了结合目标而必须满足的几何约束条件。这些都是一组分子以相同的方式与给定的结合位点相互作用的必要不充分条件，从而产生相同的药理作用。由于药效团是基于活性分子的，正在测试的假设与活性有关，而不仅仅是结合。很有可能，另一组分子可能与同一受体或另一个受体相互作用，从而产生相同的效果。这些都不会被最初的药效团所覆盖。


    即使在目标结构存在的情况下，药效团的生成也可能仍然是一个有用的替代对接。蛋白质结构的存在，将允许直接从大分子坐标开发一个药效团模型。一个药效团可以用于虚拟筛选，在一个只需要存在于生物信息学中的大型化学结构库中搜索命中点。在这里，至关重要的是，生物学相关的三维构象的生成和搜索。这种几何形状可能与分子的最小能量构象完全不同，无论是孤立的还是固态的，虽然它广泛符合药效团建模的传统原则。


    利用机器学习，自动生成基于晶体结构数据的交互模型的方法。这些基于药效团的模型可以用于虚拟筛选，或者用于指导从头分子设计，而不是文库搜索。


    ### （3）形状识别方法

    基于配体的识别归属于形状识别方法，使用正式的药效团模型，根据分子形状将虚拟文库中的结构与已知的结合物进行比较，有时还与其他特性相结合。该方法利用分子间原子距离分布来描述分子。有三个重要的特性：第一，力矩与大小无关，允许对具有相当不同原子数量的分子进行比较。第二，与传统方法相比，描述三维化学结构的数据要少得多，整个分子为12个描述符，而不是具有n个原子的化合物的3n个坐标。第三，也是最重要的，该方法并不依赖于显式的分子排列。


    ### （4）分子相似性搜索

    虚拟筛选中最简单的方法之一是分子相似性搜索。同样，正如在形状识别中一样，其目标是在虚拟库中找到与之类似的已知活性或活性分子。现在，相似性的定义是基于化学描述符，而不是形状描述符。该法假定结构相似的分子将具有相似的生物活性。这是类似性质原理的一个例子，即由一组基于结构的描述符定义的“化学空间”中紧密相连的两个分子比两个相距较远的分子更有可能共享相似的性质。相似性搜索说明，关于分子，决定其生物活性的机制并没有什么新信息，因为没有考虑到蛋白质靶标的结构。尽管如此，我们可以合理地推测，表现出相同生物活性的高度相似的分子，可能与目标产生类似的相互作用。


    为了进行相似性搜索，可以在计算机中对化学结构进行许多表示，从而为每个化合物产生一组特征。其特征，可以是单个原子或原子群，或计数或键碎片的拓扑指数，或物理化学性质的计算或估计值，如对数P；可以是电子性质如轨道能量、原子部分电荷、极化率或偶极矩，可能来自半经验量子力学；也可以是形状、表面积、体积、分子量。然后这些特性形成一个向量，在描述符定义的化学空间中，定位一个给定的分子。如果不同特性的值具有不同的范围，则通常会对它们进行缩放。由于许多特征将相互关联，因此通常是通过消除每一对高度相关的描述符，或使用主成分分析等技术，来减少空间的维数。然后，搜索依赖于计算化学空间中两点之间的距离度量，如欧几里得距离或曼哈顿距离，或相似性度量，如谷本系数。因此，人们可以找到其他与已知活性分子具有高度相似性，或较小距离的分子。


    重要的是，该法要理解用于描述分子的特征、描述符和指纹。它们没有单一的正确定义，相反，一个给定的定义，可以通过分析具有相似结构和相似性质的分子对的高相似性，来得到经验证明。


    ### （5）多靶点预测

    新化学物质的发现需要在设计过程中平衡几个标准，包括目标效价、选择性、清除率和渗透性。然而，对其中一个属性进行优化可能会损害其他属性。这种潜在的冲突目标的问题可以在计算框架中进行转换，也被称为多参数优化、多目标规划、向量优化、多迭代优化、多属性优化。药物发现和开发领域已经在很好地利用这些计算技术，目前这些技术与机器学习作为人工智能的一个分支。


    多目标化设置中，需要访问每个所需属性的一组计算预测模型，然后可以应用许多现有多目标化算法中的一种来尝试解决潜在的优化问题，即找到一个或多个平衡所需属性的分子。由于这些属性经常发生冲突，我们的目标是生成一组可能的解决方案线索，每个线索都以不同的方式进行权衡，但解决方案集的任何成员都无法在一个属性中得到改进，而不在不同的属性中放弃某些东西。在后一种意义上，每个解决方案都是最优的。这组解可以被认为是描绘出一个最优性的边界，沿着边界移动会产生一组最优解，每个最优解都有自己的交换属性的方式。


    追踪这种边界的目标所固有的事实是，我们缺少全面的信息集。特别是，如果确切地知道如何权衡各种药物设计标准，有时在项目开始时，就可以使用更传统的计算优化方法来寻找优化精确已知权衡函数的分子。然而，在药物发现领域，就像在许多领域一样，开发过程是迭代的，而不是分析性的，具有大量的“人为因素”成分。例如，一个药物化学家，提供的专家知识和决策，还不能被统计和机器学习模型编码，要么是因为缺乏相关数据，要么因为问题本身就很困难。因此，多目标化的目标是生成一组不同但实际上最优的特定分子设计挑战的解决方案，随后，这些解决方案被交给人类专家，以筛选深入的、隐含的知识和直觉。


    基于相似性方法，最有价值的改进是将其扩展并应用于搜索多个目标。原理很简单，每个分子都对大量与已知不同目标关联的化合物进行相似性评估。因此，输出不是返回一个单一的活性，而是一个生物活性谱，显示了每个化合物对每个目标的预测活性。


    多靶点预测，在提供药物潜在副作用的快速计算评估方面具有明显的应用价值。显然，预测与多个靶点的混杂相互作用，可能是药物开发项目的一个良好指示。从更积极的方面来看，多靶点预测可以帮助预测和合理化多药理活性，其中，一种药物通过与多种蛋白质相互作用而起作用。这种计算方法甚至可能对现有药物梳理出新的作用机制。


    因此，多靶点预测在计算毒理学中是非常有价值的。在越来越重视动物伦理的环境下，计算方法将在毒性预测中发挥越来越大的作用。使用的模型将从简单的结构过滤器中，通过量化，特定于一个毒性相关的目标或终点，或本地配体化学空间，类似之前讨论过的复杂的目标预测方法。


    ### （6）反向QSAR

    反向QSAR方法从一个不同的角度处理从头设计任务，而不是首先生成一个虚拟化学库，然后对基于相似模板的化合物进行评分和排名。反向QSAR，试图找到一个显式反向映射分子描述符，然后从描述符空间的有利区域映射回相应的分子。反向QSAR方法的主要障碍在于，选择一种分子表征，该分子表示信息丰富，不仅适合充分处理给定生物特性的正向QSAR任务，而且适合于后续的重建阶段。


    为了避免忽视有吸引力的候选分子，增加生成结构的多样性和新颖性，应该使用大片段库。这是以增加片段交换和相似性搜索过程的成本为代价的。许多从头药物设计方法，利用一组分子构建块或合成化合物片段，进行分子组装，以减少产生不利化学结构的风险。药物化学家们创建了一个基于简化分子输入线输入规范的化学语言模型，以规避过多无效结构的问题。


    要解决这个问题，主要努力集中在通过生成模型隐式学习这种转换的方法上。深度生成网络，鉴于其处理序列数据与长期依赖的关系，在没有任何明确的先验化学库的情况下，在从头药物设计中显示出可喜的前景。


    为了实现分子设计，需要对额外的多层感知器进行训练，以基于分子的潜在空间坐标，来预测合适的特性。预测任务在重建任务上进行联合训练，当给定编码分子的潜在向量时，可以通过向最有可能改善目标特性的方向移动，将新的候选向量，生成并解码成相应的分子。同时，该模型对电子性能具有良好的预测能力。此外，在采用结合药物成药性和合成可行性等混合优化目标后，该模型能够执行迭代的、基于梯度的优化，以更好地匹配所需的分子特性。


    经过简化分子输入线输入规范表征训练的循环神经网络，既可以学习生成描述符，也可以生成与模板化合物性质相似、但支架不同的候选分子。该方法的从头药物设计，采用了转移学习，首先将循环神经网络模型在大量分子上进行训练，然后进一步用小组活性分子进行再训练，以使采样分子偏向于给定的模板集。


    基于机器学习的表征空间内分子识别，属于一种新的训练集生成方法。该方法包括两个步骤。第一步是使用字符级，来学习给定化学子集字符串中字符的概率分布，然后是后处理来消除无效价、芳香性的结构，从而模拟具有相似特性和不同支架的分子输出。在细胞分析中，研究发现，模拟生成的化合物可以作为未折叠蛋白反应和VEGFR2通路的抑制剂，以证明模拟输出结果，并可作为药物从头设计的先导物。


    上面提到的方法，允许生成包含天然产物样特征的化合物，同时仍然保留一些典型小分子化合物的合成可行性，并保证结构多样性。此外，此方法使用简化图表示分子的描述符，然后生成满足药物形态模板的相应参数，将分子属性信息与分子的潜在表示连接起来。该模型的性能是通过生成具有五种目标特性的类药物分子的特定值来证明的，包括分子量、分配系数、氢键供体和受体的数量以及拓扑极性表面积，满足可接受的误差范围，并通过创建具有可变对数P值的类似物，限制其他特性。


    但全新设计在药物发现中尚未得到广泛应用。这至少部分与化合物的产生有关，这些化合物在合成上难以获得。由于人工智能领域的发展，该领域最近出现了一些复兴。


    关于量化生成的化合物的多样性的最合适的方法，一直有一些争论，包括模型自身和化合物的训练资料库。这种方法可以以直接的方式扩展到其他此类分子表示，并允许直接测量微调，使取样偏向给定目标空间。


    ## 4.3　人工智能辅助药物筛选

    计算药物化学的未来趋势，可能包括越来越常规地使用信息学方法来预测脱靶和在靶上的生物活性，包括可能的副作用（图4-1）。随着动物实验数量的减少，对毒理学终点的计算预测将变得越来越关键。相当一部分药物以酶作为它们的靶点。随着人们越来越强调理解药物治疗疾病的作用机制，化学信息的重要性不言而喻，可以期待，药物设计和计算酶学之间出现一个越来越有效的界面。我们对酶机制的日益系统化，将促进这一过程。我们还可以期待药物化学和系统生物学之间越来越重要的相互促进作用。


    ![](Images/figure_0086_0020.jpg)


    图4-1　指导数据收集和模型改进策略的算法


    虽然人工智能为科学家提供了新的挑战和很多新的工具，但一些科学家对此持怀疑态度，期待在药物发现过程当中看到更加显著的影响。生物学和免疫学已经取得了长足进步，高通量合成及活性筛选也广泛应用，但新药的开发仍然是一个耗时的过程。大量的药物研发人员投入了巨大的精力，但临床试验的高失败率导致新药研发困难重重。因此，需要更加创新的方法寻找低成本的研究方案，为更多的患者提供治疗药物。


    长期以来，计算机辅助药物设计被认为是降低药物研发投入，提高药物研发成功率的有效手段。随着继续学习和数据处理能力的提高，计算机辅助药物设计能帮助我们更快的寻找到候选药物。


    过去，小分子药物的发现大量依赖于高通量筛选，此过程需要制备大量的小分子结构，但机体生物环境的复杂性影响药物活性的多因素性，导致成功率极低。在药物筛选过程中，需要考虑很多因素，包括靶点结构、多靶点的选择性、药物的代谢、毒理作用等一些重要的参考指标。


    应用人工智能进行药物设计首先要考虑的是寻找到合适的数据集。合适的数据集对建立预测模型至关重要，否则即使一个非常完美的模型，也无法解决关键问题。在评估数据集时要看此数据集是否考虑到建模的重点，一个可靠的药理学模型能够减少药物开发时间。


    虽然近代药物研究已经发表了千万篇药理研究论文，但相比于复杂的体内生理学环境，现有的体内药理数据仍显得单薄和有限。现有的方式是采用体外实验结果，替代体内实验。但体外实验结果与体内的药理作用往往表现出巨大的差异。

    '
  trans: '


    客观地探索广泛的化学空间和解决多目标优化中的相关挑战，是计算化学应用的一项重要任务。通过使用计算机程序，自动评估“非常大的化合物库”，来识别在药物发现中的苗头和先导化合物的过程被称为虚拟筛选。


    虚拟对接，包括将一个小分子最佳地拟合到一个大分子中，并评估该拟合的质量。从这两个分子的合适结构开始是很关键的，通常来说，期望蛋白质和配体的构象与之前相同是不现实的。同样地，将一个配体分子从蛋白质晶体结构中切割出来，然后将完全相同的构象对接到完全相同的空腔中，也是一个不切实际的简单测试。


    对接方法的一个要求是彻底探索搜索空间，这样就不会错过蛋白质和配体或姿态的正确配置。即使蛋白质和配体都是刚体，没有构象的灵活性，搜索空间也已经是六维的，增加了配体的灵活性和蛋白质的一些构象自由，显著增加了有待探索的空间。这意味着，理想情况下，配体很适合结合位点，没有明显的冲突或空隙。


    其中蛋白质和配体结合具有形状和化学互补性。这意味着，理想情况下，配体能很好地嵌入结合位点，不会产生明显的碰撞或空洞。氢键、极性和疏水基团也被适当地定位。使用一个具有能量维度的函数来近似蛋白质-配体复合物的自由能是很常见的，虽然不是强制性的。为了有更好的效果，需要一个快速评估的能量函数，既可以评估当前配置的质量，也可以指导寻找更好的解决方案。而且，尽管与真实模式有差别，但全局最小值尽可能接近正确的位置。分子力学力场可能提供适当的能量函数，特别是它们很可能产生梯度，可以引导搜索到能量分布上的局部或全局最小值。这是解决搜索和优化问题的众多方法之一。


    从头药物设计旨在产生符合特定标准的化学物质，包括对靶点的疗效、合理的安全性、合适的化学和生物特性、足够的新颖性，以确保获得知识产权等。在新算法的帮助下，进行计算分子的设计和评价，从头药物设计被认为是一种有效的手段，以减少制备大量的新化学结构花费的时间、金钱，并高效地识别化学基因组研，从中找到可以作为先导物的起点结构。


    早期的从头药物设计方法，无论是直接从蛋白质结构还是从已知配体的特性推断，几乎完全使用基于结构的方法，在目标的结合袋的约束内生长配体。这些早期方法的一个局限性是，生成的结构制备难度大，药物成药性差。


    最近，基于配体的从头设计方法已经证明了其在药物化学中的适用性。生成的化合物库，可以通过评分函数进行额外的分析，该函数考虑了一些特性，如生物活性、合成可行性、代谢和药代动力学特性等。构建这样一个虚拟库的一种方法是使用化学反应子集、一组可用的化学构建块，以及一个合成可获得的分子池。


    ## 4.2　药物筛选的一般方法


    ### （1）虚拟筛选

    药物的设计和开发是一个非常漫长而昂贵的过程。虚拟筛选的最大好处是，它完全是用生物信息学进行的，可以避免花费时间和金钱来购买、合成和分析不合适的分子。一个成功的虚拟屏幕就是一个生物信息学涵盖的集合，它大量丰富了可能的活动，与原始的虚拟库相比，其中包含的比例要高得多。


    虚拟筛选是一系列计算工具的名称，用于搜索化学数据库，以识别对特定生物目标表现出活性的分子。这些工具被广泛用于降低药物发现的成本，过滤掉在传统生物筛选中不太可能产生积极结果的大量典型数据库。


    虚拟筛选主要有两种类型，当生物目标的三维结构可用时，可以使用基于结构的方法；在缺乏这类结构信息的情况下，可以使用基于配体的方法，如相似性搜索、药效团映射和机器学习等。虚拟筛选方法的选择取决于可用数据的数量和类型，与方法的相关计算需求有很大差异。例如，三维虚拟筛选方法可能需要为正在搜索的数据库中的所有分子生成低能量构象。


    相似性搜索是基于配体的虚拟筛选中最简单和最广泛使用的工具之一，因为它只需要一个已知的生物活性分子或参考结构作为数据库搜索的起点。相似性搜索的基本思想是相似的性质原理，即结构相似的分子将表现出相似的物理化学和生物学性质。近年来，许多测量分子结构相似性的方法已经被广泛使用。最常见的方法包括，使用具有二维指纹特征的分子，以编码分子中二维片段亚结构，然后计算两个分子之间的相似性，使用一对结构共同的亚结构片段的数量和一个简单的关联系数。


    ### （2）配体识别评分

    现今，基于结构的药物从头设计是计算机辅助药物设计的主要手段和方法。基于靶点的结构，通过评价氢键作用、共价键作用及范德华作用，识别能够与靶蛋白结合的优势结构。对药物化学家来说，准确预测出目标结构与蛋白的结合能力是非常重要的。评价目标结构与靶蛋白的结合能力，主要有三种方式，包括基于经验的评分方式，基于知识的评分方式和基于物理的评分方式。基于经验的评分函数，计算效率高，函数简单。但它也有局限性，它很难发现亲和力和用于建模的晶体结构之间的联系。基于知识的评分函数，根据数据库当中的原子平均力势，这种原子之间的作用往往忽略周围环境的影响，但实际上，环境的影响是不可以忽略的，并且数据集有限，无法包括所有的化学类型。基于物理的评分函数利用实验信息进行量子力学计算，一般需要大量的计算，评估成本较高。


    第一种方法是结合能值预测的方法，通过使用评分函数，来预测给定几何形状的蛋白质-配体复合体的结合自由能，或等效的结合亲和力。对接完成后，可以重新评估最佳姿势。这个评分函数，既不受非常快速评估的限制，也不受任何需要其梯度来引导能量分布，搜索达到有意义的最小值的限制。因此，它不一定与对接内用于优化的能量函数相同。尽管如此，使用分子力学力场进行评分仍然很常见。这可能涉及相关溶剂环境中的分子力学计算。


    第二种流行的方法是开发经验评分函数，原则上，评分函数中与对结合自由能、物理意义上热力学贡献之间存在直接的对应关系。然而，这些参数是从数据中通过经验得出的。拟合通常只针对总束缚自由能，所以单个项的精确值不那么重要。


    第三种方法，是使用已知的蛋白质-配体复杂结构作为知识库。这些基于已知情况的评分函数试图描述蛋白质-配体结合，并最终使用平均力形式预测结合亲和力，给真实复合物原子间距离分布相似的复合物很好的分数。它们只需要结构数据，而不需要绑定的亲和力作为输入，对蛋白质-配体复合物中的原子-原子距离进行采样，然后将它们作为准化学平衡产生的变量来处理，然后应用反向玻尔兹曼方法，将距离的直方图转换为一个自由能函数。当所有的蛋白质-配体原子-原子的贡献加起来时，所产生的结合能平均大约大了十倍，与实验数据的相关性很好。


    这个误差的数量级实际上很容易理解。在液体和气体的统计物理学中，原子-原子距离本质上是自变量，可以在环境温度下平衡的假设下采样，蛋白质-配体复合物中的原子-原子距离也不是这样的。在蛋白质-配体的相互作用中，分子的拓扑连通性，意味着配体分子和蛋白质之间的不同原子-原子距离绝对不是独立的，相反，它们是强相关的。因此，虽然数学假设一个是抽样自变量，但实际上，是对高度相关的变量抽样。因此，信号的概率强度被高估了，并预测了过强的结合能。原则上，人们可以尝试找到一个粒度，以最小化这个误差。然而，这样的尝试将是经验性的，似乎不能在这种蛋白质-配体的背景下被严格地证明。因此，人们将相反的玻尔兹曼技巧简单地看作是一种将原子-原子距离的直方图，转换为具有能量维度和适当极限性质的适当函数，而不尝试提供任何物理或数学证明。这些困难可以通过使用机器学习方法，获得基于知识的潜力来克服。在基于知识的评分函数的生成中，添加一个机器学习组件，允许它们利用绑定亲和关系和结构数据。


    此外，也可以使用共识评分方法，将不同的评分函数组合到一个单一的预测中。这可以充分利用已知与目标结合的分子，以三维排列覆盖，获得共同结构特征的最佳匹配：氢键供体或受体、疏水基团、芳香环、带电基团等。


    所得到的模板被称为药效团。药效团通常是一个分子的一部分结构，需要具备一组特征组成，以及它为了结合目标而必须满足的几何约束条件。这些都是一组分子以相同的方式与给定的结合位点相互作用的必要不充分条件，从而产生相同的药理作用。由于药效团是基于活性分子的，正在测试的假设与活性有关，而不仅仅是结合。很有可能，另一组分子可能与同一受体或另一个受体相互作用，从而产生相同的效果。这些都不会被最初的药效团所覆盖。


    即使在目标结构存在的情况下，药效团的生成也可能仍然是一个有用的替代对接。蛋白质结构的存在，将允许直接从大分子坐标开发一个药效团模型。一个药效团可以用于虚拟筛选，在一个只需要存在于生物信息学中的大型化学结构库中搜索命中点。在这里，至关重要的是，生物学相关的三维构象的生成和搜索。这种几何形状可能与分子的最小能量构象完全不同，无论是孤立的还是固态的，虽然它广泛符合药效团建模的传统原则。


    利用机器学习，自动生成基于晶体结构数据的交互模型的方法。这些基于药效团的模型可以用于虚拟筛选，或者用于指导从头分子设计，而不是文库搜索。


    ### （3）形状识别方法

    基于配体的识别归属于形状识别方法，使用正式的药效团模型，根据分子形状将虚拟文库中的结构与已知的结合物进行比较，有时还与其他特性相结合。该方法利用分子间原子距离分布来描述分子。有三个重要的特性：第一，力矩与大小无关，允许对具有相当不同原子数量的分子进行比较。第二，与传统方法相比，描述三维化学结构的数据要少得多，整个分子为
    12 个描述符，而不是具有 n 个原子的化合物的 3n 个坐标。第三，也是最重要的，该方法并不依赖于显式的分子排列。


    ### （4）分子相似性搜索

    虚拟筛选中最简单的方法之一是分子相似性搜索。同样，正如在形状识别中一样，其目标是在虚拟库中找到与之类似的已知活性或活性分子。现在，相似性的定义是基于化学描述符，而不是形状描述符。该法假定结构相似的分子将具有相似的生物活性。这是类似性质原理的一个例子，即由一组基于结构的描述符定义的“化学空间”中紧密相连的两个分子比两个相距较远的分子更有可能共享相似的性质。相似性搜索说明，关于分子，决定其生物活性的机制并没有什么新信息，因为没有考虑到蛋白质靶标的结构。尽管如此，我们可以合理地推测，表现出相同生物活性的高度相似的分子，可能与目标产生类似的相互作用。


    为了进行相似性搜索，可以在计算机中对化学结构进行许多表示，从而为每个化合物产生一组特征。其特征，可以是单个原子或原子群，或计数或键碎片的拓扑指数，或物理化学性质的计算或估计值，如对数
    P；可以是电子性质如轨道能量、原子部分电荷、极化率或偶极矩，可能来自半经验量子力学；也可以是形状、表面积、体积、分子量。然后这些特性形成一个向量，在描述符定义的化学空间中，定位一个给定的分子。如果不同特性的值具有不同的范围，则通常会对它们进行缩放。由于许多特征将相互关联，因此通常是通过消除每一对高度相关的描述符，或使用主成分分析等技术，来减少空间的维数。然后，搜索依赖于计算化学空间中两点之间的距离度量，如欧几里得距离或曼哈顿距离，或相似性度量，如谷本系数。因此，人们可以找到其他与已知活性分子具有高度相似性，或较小距离的分子。


    重要的是，该法要理解用于描述分子的特征、描述符和指纹。它们没有单一的正确定义，相反，一个给定的定义，可以通过分析具有相似结构和相似性质的分子对的高相似性，来得到经验证明。


    ### （5）多靶点预测

    新化学物质的发现需要在设计过程中平衡几个标准，包括目标效价、选择性、清除率和渗透性。然而，对其中一个属性进行优化可能会损害其他属性。这种潜在的冲突目标的问题可以在计算框架中进行转换，也被称为多参数优化、多目标规划、向量优化、多迭代优化、多属性优化。药物发现和开发领域已经在很好地利用这些计算技术，目前这些技术与机器学习作为人工智能的一个分支。


    多目标化设置中，需要访问每个所需属性的一组计算预测模型，然后可以应用许多现有多目标化算法中的一种来尝试解决潜在的优化问题，即找到一个或多个平衡所需属性的分子。由于这些属性经常发生冲突，我们的目标是生成一组可能的解决方案线索，每个线索都以不同的方式进行权衡，但解决方案集的任何成员都无法在一个属性中得到改进，而不在不同的属性中放弃某些东西。在后一种意义上，每个解决方案都是最优的。这组解可以被认为是描绘出一个最优性的边界，沿着边界移动会产生一组最优解，每个最优解都有自己的交换属性的方式。


    追踪这种边界的目标所固有的事实是，我们缺少全面的信息集。特别是，如果确切地知道如何权衡各种药物设计标准，有时在项目开始时，就可以使用更传统的计算优化方法来寻找优化精确已知权衡函数的分子。然而，在药物发现领域，就像在许多领域一样，开发过程是迭代的，而不是分析性的，具有大量的“人为因素”成分。例如，一个药物化学家，提供的专家知识和决策，还不能被统计和机器学习模型编码，要么是因为缺乏相关数据，要么因为问题本身就很困难。因此，多目标化的目标是生成一组不同但实际上最优的特定分子设计挑战的解决方案，随后，这些解决方案被交给人类专家，以筛选深入的、隐含的知识和直觉。


    基于相似性方法，最有价值的改进是将其扩展并应用于搜索多个目标。原理很简单，每个分子都对大量与已知不同目标关联的化合物进行相似性评估。因此，输出不是返回一个单一的活性，而是一个生物活性谱，显示了每个化合物对每个目标的预测活性。


    多靶点预测，在提供药物潜在副作用的快速计算评估方面具有明显的应用价值。显然，预测与多个靶点的混杂相互作用，可能是药物开发项目的一个良好指示。从更积极的方面来看，多靶点预测可以帮助预测和合理化多药理活性，其中，一种药物通过与多种蛋白质相互作用而起作用。这种计算方法甚至可能对现有药物梳理出新的作用机制。


    因此，多靶点预测在计算毒理学中是非常有价值的。在越来越重视动物伦理的环境下，计算方法将在毒性预测中发挥越来越大的作用。使用的模型将从简单的结构过滤器中，通过量化，特定于一个毒性相关的目标或终点，或本地配体化学空间，类似之前讨论过的复杂的目标预测方法。


    ### （6）反向 QSAR

    反向 QSAR 方法从一个不同的角度处理从头设计任务，而不是首先生成一个虚拟化学库，然后对基于相似模板的化合物进行评分和排名。反向 QSAR，试图找到一个显式反向映射分子描述符，然后从描述符空间的有利区域映射回相应的分子。反向
    QSAR 方法的主要障碍在于，选择一种分子表征，该分子表示信息丰富，不仅适合充分处理给定生物特性的正向 QSAR 任务，而且适合于后续的重建阶段。


    为了避免忽视有吸引力的候选分子，增加生成结构的多样性和新颖性，应该使用大片段库。这是以增加片段交换和相似性搜索过程的成本为代价的。许多从头药物设计方法，利用一组分子构建块或合成化合物片段，进行分子组装，以减少产生不利化学结构的风险。药物化学家们创建了一个基于简化分子输入线输入规范的化学语言模型，以规避过多无效结构的问题。


    要解决这个问题，主要努力集中在通过生成模型隐式学习这种转换的方法上。深度生成网络，鉴于其处理序列数据与长期依赖的关系，在没有任何明确的先验化学库的情况下，在从头药物设计中显示出可喜的前景。


    为了实现分子设计，需要对额外的多层感知器进行训练，以基于分子的潜在空间坐标，来预测合适的特性。预测任务在重建任务上进行联合训练，当给定编码分子的潜在向量时，可以通过向最有可能改善目标特性的方向移动，将新的候选向量，生成并解码成相应的分子。同时，该模型对电子性能具有良好的预测能力。此外，在采用结合药物成药性和合成可行性等混合优化目标后，该模型能够执行迭代的、基于梯度的优化，以更好地匹配所需的分子特性。


    经过简化分子输入线输入规范表征训练的循环神经网络，既可以学习生成描述符，也可以生成与模板化合物性质相似、但支架不同的候选分子。该方法的从头药物设计，采用了转移学习，首先将循环神经网络模型在大量分子上进行训练，然后进一步用小组活性分子进行再训练，以使采样分子偏向于给定的模板集。


    基于机器学习的表征空间内分子识别，属于一种新的训练集生成方法。该方法包括两个步骤。第一步是使用字符级，来学习给定化学子集字符串中字符的概率分布，然后是后处理来消除无效价、芳香性的结构，从而模拟具有相似特性和不同支架的分子输出。在细胞分析中，研究发现，模拟生成的化合物可以作为未折叠蛋白反应和
    VEGFR2 通路的抑制剂，以证明模拟输出结果，并可作为药物从头设计的先导物。


    上面提到的方法，允许生成包含天然产物样特征的化合物，同时仍然保留一些典型小分子化合物的合成可行性，并保证结构多样性。此外，此方法使用简化图表示分子的描述符，然后生成满足药物形态模板的相应参数，将分子属性信息与分子的潜在表示连接起来。该模型的性能是通过生成具有五种目标特性的类药物分子的特定值来证明的，包括分子量、分配系数、氢键供体和受体的数量以及拓扑极性表面积，满足可接受的误差范围，并通过创建具有可变对数
    P 值的类似物，限制其他特性。


    但全新设计在药物发现中尚未得到广泛应用。这至少部分与化合物的产生有关，这些化合物在合成上难以获得。由于人工智能领域的发展，该领域最近出现了一些复兴。


    关于量化生成的化合物的多样性的最合适的方法，一直有一些争论，包括模型自身和化合物的训练资料库。这种方法可以以直接的方式扩展到其他此类分子表示，并允许直接测量微调，使取样偏向给定目标空间。


    ## 4.3　人工智能辅助药物筛选

    计算药物化学的未来趋势，可能包括越来越常规地使用信息学方法来预测脱靶和在靶上的生物活性，包括可能的副作用（图 4-1）。随着动物实验数量的减少，对毒理学终点的计算预测将变得越来越关键。相当一部分药物以酶作为它们的靶点。随着人们越来越强调理解药物治疗疾病的作用机制，化学信息的重要性不言而喻，可以期待，药物设计和计算酶学之间出现一个越来越有效的界面。我们对酶机制的日益系统化，将促进这一过程。我们还可以期待药物化学和系统生物学之间越来越重要的相互促进作用。


    ![](img/figure_0086_0020.jpg)


    图 4-1　指导数据收集和模型改进策略的算法


    虽然人工智能为科学家提供了新的挑战和很多新的工具，但一些科学家对此持怀疑态度，期待在药物发现过程当中看到更加显著的影响。生物学和免疫学已经取得了长足进步，高通量合成及活性筛选也广泛应用，但新药的开发仍然是一个耗时的过程。大量的药物研发人员投入了巨大的精力，但临床试验的高失败率导致新药研发困难重重。因此，需要更加创新的方法寻找低成本的研究方案，为更多的患者提供治疗药物。


    长期以来，计算机辅助药物设计被认为是降低药物研发投入，提高药物研发成功率的有效手段。随着继续学习和数据处理能力的提高，计算机辅助药物设计能帮助我们更快的寻找到候
    candidate 药物。


    过去，小分子药物的发现大量依赖于高通量筛选，此过程需要制备大量的小分子结构，但机体生物环境的复杂性影响药物活性的多因素性，导致成功率极低。在药物筛选过程中，需要考虑很多因素，包括靶点结构、多靶点的选择性、药物的代谢、毒理作用等一些重要的参考指标。


    应用人工智能进行药物设计首先要考虑的是寻找到合适的数据集。合适的数据集对建立预测模型至关重要，否则即使一个非常完美的模型，也无法解决关键问题。在评估数据集时要看此数据集是否考虑到建模的重点，一个可靠的药理学模型能够减少药物开发时间。


    虽然近代药物研究已经发表了千万篇药理研究论文，但相比于复杂的体内生理学环境，现有的体内药理数据仍显得单薄和有限。现有的方式是采用体外实验结果，替代体内实验。但体外实验结果与体内的药理作用往往表现出巨大的差异。


    '
  toc: []
- raw: '这种差异并非是体外药理结果特有的，一般情况下动物的药理实验也往往与人体的实验结果仍存在巨大的差异。同时，在体外作为靶标的蛋白结构，也往往与体内有着巨大的结构差异。这些复杂的因素左右着建模的效率。人工智能药物设计的最终挑战是从零开始自主生成具有所需性质的新化学实体，而不需要通常成本高昂的全层高通量筛选。


    在药物设计中应用人工智能的部分吸引力在于，有可能开发数据驱动的隐式模型构建过程，由高能量筛选产生大量数据集，并对替代方案进行优先排序。这至少代表了决策能力向机器智能的部分转移，并可以被视为与人类智能的协同作用，即一个领域特定的内隐式人工智能，它将增强药物化学家在药物设计和选择方面的能力。


    为了从长远来看取得成功，使用人工智能进行药物设计，必须为几个问题提供解决方案，这些问题包括五个“重大挑战”：获得适当的数据集，生成新的假设，以多目标的方式进行优化，减少周期时间，改变研究文化和创造适当的思维方式。这一观点是2018年关于与人工智能重新思考药物设计的会议提出的，会议围绕这五个重大挑战的讨论，并得出了主要结论以及对自那以后的进展进行讨论。


    适当的输入数据对于构建决策和生成的有用预测模型至关重要。如果没有一个适当的数据集和对这些数据的范围和局限性的理解，即使是一个看似复杂的模型也将无法产生有用的结果。


    化学设计可以被认为是模式匹配，自20世纪90年代以来，基于计算机的重新设计方法已经被探索作为思想生成器来支持药物设计。今天，生成性人工智能通过为决策提供了一个统计框架，为药物的重新设计提供了一种新的方法。与早期的分子设计引擎使用了一组显式的化学转换和组装规则（如片段生长和链接）相比，这些生成模型根据数据分布的统计概率隐含地代表了化学知识。换句话说，这两个不同概念所使用的语言不再是教科书上的化学，而是从训练数据中学到的一种新语言。


    这种方法值得进一步讨论，因为它直接涉及化学中人工智能系统的可解释性问题。开创性的前瞻性应用已经表明，生成性的从头设计会产生具有所需性质和活性的合成可及分子。与以前的从头设计方法相比，这些模型的主要优点是：手头项目的快速再训练或微调；可伸缩性提供不需要明确的几乎无限化学空间；软件可用性；以及设计的合成可访问性。这给许多早期的从头设计方法造成了麻烦。


    药物设计将面临越来越复杂的数据和目标假设。药物发现过程中的一个关键局限性是缺乏关于人类生物学的基本知识。虽然这一观点关注药物设计，但前一点意味着在优化和设计过程中需要适应性，因为生物分析在被研究系统的生命周期中往往随着知识的进化而迅速变化。因此，随着药物发现知识的发展，人工智能需要灵活地提供答案。


    另一方面，“机制”模型能够通过捕获不同抽象层次的行为（如遗传、分子和细胞），并解释这些行为如何进化和相互作用来解决这两个挑战。在计算化学中，机制模型是对基于人工智能的方法的补充，因为它们可以为机器学习模型发现的关联添加解释。因此，这些模型提供新的假设和机器学习模型，并提供进一步的数据来测试这些假设和改进模型，这就形成了一个虚拟循环，创建了一个完整的学习系统。


    （1）机器学习。


    信息化时代，大数据应用无处不在。对新药设计来说，通过对现有结构的数据进行多角度的分析，可以系统地研究分子的特征。同时数据信息每年都在成倍的增加，给人工智能提供了庞大的信息数据库，为药物化学家提供了多种结构特征。大数据在药物组合化学中发挥了至关重要的作用。


    人工智能通过计算机技术，模拟药物化学家的设计思路，通过机器学习和解释药物大数据来发现新的结构。许多生物制药企业正将人工智能、机器学习与药物发现管道集成起来。辉瑞自2016年12月以来一直与IBM合作，利用其云平台进行免疫肿瘤学药物研究。赛诺菲也正在与总部位于英国的人工智能驱动药物设计公司合作，寻找治疗代谢疾病的方法。


    机器学习可以分为有监督学习、无监督学习和强化学习，并在分类、生成建模中得到应用，监督学习、分类和回归方法，根据输入和输出数据源来预测模型。有监督机器学习适用于疾病诊断的方法中，分类方法对于筛选合适的ADMET大有帮助。


    机器学习利用生物活性和化学结构之间的关系来开展药物设计工作，通过学习技术对生物靶点（蛋白质结构、结构域、跨膜区域、糖基化和磷酸化位置）的结构进行预测和验证，并建立和定量结构活性关系模型、药效团模型、分子对接分析和相似性搜索中的排序。机器学习技术通过对药代动力学和毒理学谱进行分类，结合对生物活性先导化合物的发现或优化，以及构建新配体模型来实现新药物的设计与挖掘。


    与经典的评分函数相比，机器学习不仅仅将分析限制在结构特征和绑定亲和值之间的预定义函数形式上。机器学习是构建和优化模型以预测绑定姿态和亲和性的动态技术。这些方法考虑了配体和靶标之间的相互作用，而忽略了容易出错的相互作用。此外，机器学习技术的多种方法，如随机森林、支持向量机和神经网络，在绑定相互作用之间具有非线性依赖性。因此，基于机器学习的评分函数在结合能计算的情况下比其他方法更好。另一个被称为共识评分的评分函数使用集体分数来最小化个体分数的错误率，并增加真正的积极选择的可能性。


    针对结合亲和力的预测和已知结合构象的重现性，许多研究都对各种评分函数的效率进行了比较。所有的现代评分函数在不同的条件下都有不同的准确率。因此，共识评分函数比单评分方法表现更好，并广泛应用于各种生物信息研究学。共识评分函数补偿了单个评分函数的局限性。它通过基于一个简单的原因结合多个评分函数来提高命中率，真实值往往更接近重复实验的平均值。


    机器学习的输出依赖于多个参数，如训练数据集的多样性、处理库中活性和非活性化合物的不平衡数据集的能力，以及定义精确参数，覆盖包括活性和非活性分子在内的完整化学空间。因此高效的机器学习模型的开发，可以筛选在输出中产生少量假阳性和大量活性化合物的大型库。这一目标可以通过包含预测的非活性化合物的多功能训练数据集来实现。


    （2）深度学习。


    人工神经网络属监督神经启发机器学习技术，被用来解决语音和图像识别等问题。人工神经网络是作为大脑中神经元的机器学习算法：它们接收大量的输入信号，并通过非线性激活函数计算输入的加权和产生激活反应，并将输出信号传递给随后连接的神经元。神经网络的基本结构由输入层、隐藏层和输出层组成。


    在人工神经网络中，处理节点可以是完全连接，也可以是部分连接。它从输入节点中获取输入变量，并通过隐藏节点转换为输出节点，在其中计算输出值。人们通过反向传播方法，对神经网络进行迭代训练。由于过拟合、梯度减小等问题，传统的神经网络方法表现不佳，已被随机森林算法和支持向量机等其他机器学习算法所取代。


    深度学习概念起源于具有许多隐藏层的前馈神经网络。通过传统的QSAR方法，不可能进行大数据量、速度、多样性和准确性的表征。深度学习是用于分析和探索大数据的机器学习算法，其需求很大。与其他机器学习方法相比，深度学习体系结构是灵活的。可对具有相同数量分子描述符的化合物建立模型。


    贝叶斯推理网络，为现有的基于相似的虚拟筛选工具，提供了一个有趣的替代工具。当被寻找的活性分子具有高度的结构同质性时，贝叶斯推理网络特别有效，但它已被发现在结构异构的活性分子中表现不理想。


    深度学习的转化影响，已经扩展到计算生物学和计算化学等领域。其中一个里程碑时刻是一个深度神经网络赢得了对分子活性预测的Kaggle挑战。最近，在分子网基准测试和DeepChepchem开源库中整理了更多基于分子的数据集和预测任务。多种机器学习方法可以用来预测不同活动类别中的目标。在具有回归任务的模型中，最佳验证r2的物理化学范围为0.61～0.87，生物物理验证范围为0.45～0.51，量子物理验证范围约为0.99。


    （3）强化学习。


    通过微调预训练集来改善上面的问题。最近提出的序列图，通过任务特定添加强化学习，优化logP、成药性的定量估计。奖励函数倾向于产生结构相对简单的分子，因为它们的有效性和正确属性分布的概率都较高。但选择适当且有用的奖励函数比较困难。近期提出了基于策略的强化学习方法，通过引入一种“增强可能性”方法，来扩展之前的工作。从本质上说，这涉及化学空间中预先训练的网络和评分函数，通过对分子质量的估计来训练一个代理集，以指导模型生成仍然代表原始化学域但反映所用评分函数意图的输出示例。


    此外，该模型可以生成类似于结构查询的分子。即使从训练集中去除所有这些化合物，也可以产生结构相似的类似物。部分结构已通过药理学实验被证实是有效的，但并未包括在活性预测或生成模型的训练集中。


    强化学习的另一种方法是迁移学习方法，它旨在通过使用先前任务训练中获得的见解，将它们转移到一个新的相关的任务中。迁移学习可以将小片段组装成更大的类药物分子，无论模型是在片段还是更大的分子上训练的，性能都是大致相似的。强化学习方法已应用于药物设计的多个方向，如生成针对腺苷A2A受体的配体。


    （4）递归神经网络。


    最初，它们是在自然语言处理领域建立起来的。递归神经网络以顺序信息作为输入。由于以字母序列编码化学结构，递归神经网络已经被用于生成化学结构。为了训练神经网络的语法，递归神经网络用大量的化合物进行训练，这些化合物来自现有的化合物集合，如CHEMBL或商业上可用的化合物。结果表明，递归神经网络能够产生大量有效的字符串。


    （5）迁移学习。


    迁移学习是另一种产生具有所需生物活性的新化学结构的方法。在第一步中，使用网络收集一个大型的训练集。在第二步中，使用具有所需活性的化合物进行训练。不需要额外的训练，它足以使新化合物的产生偏向于被活性分子所占据的化学空间。此方法结合了几种不同的架构，可以探索新的化学空间，生成的分子的性质分布与训练空间的化学空间相似，能够生成有效的、有意义的新结构。


    迁移学习技术被用于微调模型，以产生在结构上类似于聚焦目标的小化合物库。从单个受体结合片段开始，该法使用循环神经网络模型，可以依次生长剩余的分子片段。在微调过程中，该法使用少量的代表性分子，以生成具有类似结构特征的化学子集，用有限数据进行同导联优化。在实际应用中，用于学习分子指纹如何变化的两层编码器，一个用于重建输入的两层解码器，另一个潜在的中间层作为鉴别器。一旦训练阶段完成，该法就可对采样的潜在向量进行解码，生成指纹向量和相应的药物浓度。


    自动编码器方法，在重建质量和处理大数据集方面，可以优于同等结构的变分自动编码器，但代价是失去一些化学空间的覆盖范围。变分自动编码器和自动编码器，作为无监督提取器生成模型，用于预测分子的水溶性。该架构的局限性包括，使用二值化的化学化合物描述符向量，和对化学文库筛选输出指纹有较高的要求。新的自动编码器模型，改进了原始的监督对抗自动编码器架构，允许开发者合并目标和潜在的解纠缠变量，本质上是一个降低复杂程度的过程。


    一种有趣的方法是变分自动编码器，它由两个神经网络、一个编码器网络和一个解码器网络组成。解码器能够将来自该潜在空间的向量转化为化学结构。该特征用于计算模型，寻找潜在空间中的最优解，并通过解码器将这些向量反向转化为真实的分子。对于大多数反向翻译，一个分子占主导地位，但小的结构修饰存在的可能性较小。


    对抗性自动编码器，由一个生成新的化学结构的生成模型组成，具有判别的对抗模型被训练来区分真实的分子和生成的分子，而生成模型则试图掩盖具有判别的分子。在生成模式下，对抗自动编码器比变分自动编码器产生更有效的结构，可以得到一条具有改进的目标特性的分子路径。


    最初的方法只是简单地将标准化的目标变量，连接到一个分子的潜在向量表示上，后期，开发人员提出了两种方法，第一种方法是预测解纠缠，它使用神经网络模型来学习，并去除冗余变量。第二种方法是联合解纠缠，它训练网络来区分真实的z和y变量对，以及噪声对和y变量的影应。


    分子结构的产生，不是产生一个原子一个原子的分子序列，这可能会导致无效的冗余分子。在生成阶段，它在深度优先搜索中逐节点生成一个连接树，在每个点，评估任何给定的节点是否应该有子节点，如果有，添加它们并预测它们的子结构标签。在这个过程完成后，对与每个子结构标签相匹配的子结构，进行评分和放置，从而得到一个完整的分子。如果连接图中没有有效的候选节点，则对新节点重复此过程。作为这个过程的一部分，价规则被用来帮助确保测试集上构建有效的分子。作为一个扩展，其可以对潜在空间训练药物可能性预测器进行定量估计，并使用该预测器，指导采样轨迹，对药物可能性评分生成的分子进行更高的定量估计。


    先导结构的确定，依赖不同的目标特性，如特定蛋白质的活性、溶解度，或制备难易度。基于人工智能的虚拟筛选，结合体外合成并测试，具有中等的活性和靶标选择性，显示了具有新颖结构候选药物的潜力。


    但是，这些方法并非没有问题。训练模型生成服从化学逻辑的新颖结构，但要满足所有期望，仍然是一项具有挑战性的任务。正在研究的架构组合，结合相关领域的新想法，可以帮助完成诸如与特定支架生成类似物、提高药物成药性、合成可行性以及合理设计等多种任务。在基于人工智能的从头药物设计领域，几乎所有的生成模型，没有考虑目标蛋白质的结构信息，尽管存在用于预测蛋白质-配体结合亲和力的包含蛋白质结构信息的例子。最常用的技巧是利用小分子活性，采用额外的对抗性方法或强化学习方法，来引导生成过程达到特定期望的标准。


    人工智能的概念诞生于20世纪70年代，在QSAR研究提出后被用于药物发现。在药物发现的早期阶段，用于模型开发的常用计算方法是线性回归。在这些早期的研究中，用于建模的化学描述符也仅限于化学结构特征，如原子类型和碎片描述符。


    人工智能在药物发现方面的进步首先是由于新型化学描述符的发展，如拓扑描述符和分子指纹，这大大增加了从训练集计算出的描述符的大小或类别。


    分子指纹包括有限的拓扑距离、官能团的基本物理化学参数及复杂的多点三维药效团排列，在长度和复杂性上差异很大。这一事实使拓扑指纹对于将化合物聚在一起特别有用，类似于药物化学家如何将化合物划分为结构相关的组。结构关键指纹将预定义的功能组、子结构或片段联系起来。药效团指纹通常聚焦于三联体或四联体特征，将药效团特征分配给单个原子或一组原子。


    机器学习不是使用所有可用的描述符，而是将描述符选择集成到建模过程中，如遗传算法和模拟退火。机器学习没有使用线性回归，而常用的建模研究是基于非线性建模算法的，如支持向量机和随机森林。同时，机器学习更强调模型验证，将其视为建模的必备组成部分。使用这些新的机器学习方法开发的模型，需要通过交叉验证、外部验证或实验验证进行验证。


    近年，除了人工智能的发展，硬件的计算能力和可用的建模数据得到了显著的提高，促进了药物设计的进一步发展。早期，通过简单的算法对小训练集的计算建模，不需要显著的计算能力。计算能力的进步和药物生物数据的可用性使新的建模技术的应用成为可能。


    人工神经网络方法形成了数百个人工神经元，这些神经元以网络的形式与量化权重相连。单个神经元可能在预测输出方面有一些有效性，但实际的预测是由数百甚至数千个神经元组成的网络做出的。由于人工神经网络从输入数据中学习，因此它们代表了一种优秀的机器学习方法，用于构建变量和目标生物活动之间的非线性关系。使用各种机器学习方法的先进人工神经网络，需要强大的计算能力。


    基于深度神经网络的多任务学习是一种允许同时对多个相关任务进行建模的方法，通过多任务学习对几个生物相关终点进行建模，分析共享相似机制的生物活性，用于药物发现。通过减少过拟合、解决偏数据问题和从相关任务中识别变量，该法已经显示出优于传统QSAR模型的性能。


    这些深度神经网络模型的高性能展示了使用深度学习方法来建模大数据集和选择有意义的特征的优点。然而，深度学习和机器学习建模之间的比较结果好坏参半。深度学习是一个全新的正在应用于计算机辅助药物发现的概念，因此没有选择相关建模参数或构建建模工作流程的通用标准。


    ## 4.4　人工智能改造传统的药物设计


    （1）分子动力学模拟。


    多年来，计算方法在药物设计和发现中发挥了重要作用，改变了药物设计的整个过程。然而，许多问题，如时间成本、计算成本和可靠性，仍然与传统的计算方法有关。人工智能有可能消除计算药物设计领域的所有这些瓶颈，它还可以增强计算方法在药物开发中的作用。此外，随着基于机器学习的工具的出现，确定靶蛋白的三维结构变得相对容易，这是药物发现的关键一步，因为新药是基于蛋白质的三维配体结合环境设计的。


    此外，量子力学用于在亚原子水平上确定分子的性质，以及用于估计药物开发过程中蛋白质与配体的相互作用。量子力学在计算上非常昂贵和苛刻，这会影响其准确性，这时需要使用传统的计算技术。


    有了人工智能，量子力学可以变得更加用户友好和有效。SchNOrb，一种深度学习驱动的工具，可以准确预测有机分子的分子轨道和波函数。有了这些数据，就可以确定分子的电子性质、分子周围化学键的排列以及反应位点的位置。因此，SchNOrb可以帮助研究人员设计新药。此外，分子动力学模拟分析了分子在原子水平上的行为和相互作用。在药物发现中，分子动力学模拟用于评估蛋白质-配体相互作用和结合稳定性。分子动力学模拟的一个主要问题是它可能非常困难和耗时。人工智能具有加速分子动力学模拟过程的能力。执行分子动力学模拟可计算将15000个小分子从水转移到环己烷的自由能，从而使用这些自由能和一些其他原子特征来训练3D卷积网络和空间图卷积神经网络。研究人员发现，与分子动力学模拟计算相比，经过训练的神经网络预测转移自由能的精度几乎一致。这说明机器学习技术可以即兴发挥并加快分子动力学模拟，但实现这一点需要大量的训练数据。


    AlphaFold分两步预测蛋白质的3D结构：首先，使用卷积神经网络将蛋白质的氨基酸序列转换为距离矩阵和扭角矩阵。其次，使用梯度优化技术将这两个矩阵转换为蛋白质的三维结构。同样，哈佛医学院也设计了一种基于深度学习的工具，该工具将蛋白质的氨基酸序列作为输入，并生成其三维结构。该模型被称为递归几何网络，使用单个神经网络来计算连接不同氨基酸的化学键的键角和旋转角，以预测给定蛋白质的三维结构。


    PISTON就是一种可以使用自然语言处理和主题建模预测药物副作用和药物适应症的工具。DisGeNET是一个文本挖掘驱动的数据库，包含了大量关于基因疾病和变异疾病关系的信息。DisGeNET中的数据可以分析各种生物过程，如药物不良反应、与疾病有关的分子途径、药物对靶点的作用。STRING也是一个文本挖掘驱动的数据库，包含各种生物体的蛋白质-蛋白质相互作用的无数信息。STITCH是另一个文本挖掘驱动的数据库，其中包含蛋白质和化学物质/小分子之间相互作用的信息。STICH中的信息也可用于确定药物的结合强度和药物-靶标的关联性。


    （2）人工智能在初级和次级药物筛选中的应用。


    人工智能是一项非常成功且要求很高的技术，因为它节省了时间，而且成本效益高。通常，细胞分类、细胞分选、计算小分子的性质、在计算机程序的帮助下合成有机化合物、设计新化合物、开发分析方法和预测目标分子的3D结构是一些耗时且令人厌倦的任务，在人工智能的帮助下，这些任务可以被缩减，从而加快药物发现的进程。初级药物筛选包括通过人工智能技术的图像分析对细胞进行分类和分选。


    许多使用不同算法的机器学习模型，可以非常准确地识别图像，但在分析大数据时却变得力不从心。'
