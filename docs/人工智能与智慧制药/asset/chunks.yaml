    # 模型训练与泛化


    对输入数据进行特征分层，重新训练模型的不同比例的模型均匀，以获得模型的通用性和稳定性，这是一个有用的训练，最好以相对实惠的成本，收集更多高质量的原始数据。收集高质量数据集往往成本昂贵，实现起来难度很大，这通常是生物数据的药物发现的情况。


    训练集可以通过生成人工数据点，或通过使用多任务或迁移学习程序，来丰富模型对相关数据的见解。该模型可以通过超参数优化、合并正则化，或通过采用更专门的神经网络架构来改进，这取决于针对任务的目的。


    如果测试集上的性能仍然比训练集上差得多，即使调整了正则化超参数，也无法收集更多的训练数据，那么减少泛化误差最简单的方法，可能是改进学习算法本身。再次强调，初始的训练数据不仅数量足够，而且质量也应该足够高。然而，目前药物发现领域的情况是，数据质量并不好，数量也不是那么大。


    假设有10000个值可用，与用于构建视觉模型的大量信息相比，这一数据量也是无穷小的，这些模型将你所收集的东西与你可能想收集的其他东西联系起来。此外，通过高通量筛选，生成的数据库通常与活性和非活性化合物不平衡，这时特定的数据采样技术可以用于平衡建模中的活性分布。


    实际上数据集是不完整的，它们会包含错误。此外，众所周知，大多数药物具有多个生物靶点和活性，患者的个体基因谱也有相对差异。这意味着，在药物设计领域，由于未知的贡献因素和多对多的非线性关系，我们面临着大量的难题。


    该模型有时会将化合物规入无活性集，在没有实验验证的情况下，给化合物一个“非活性”标签。这个问题可以通过使用半监督方法解决，在训练期间使用包含活性和未标记化合物的信息，通过引导或使用噪声适应神经网络，来估计现有标签不正确的可能性，并使用它来相应地加权数据（图4-3）。


    ![](Images/figure_0103_0022.jpg)


    图4-3　模型评估


    ## 应用实践


    ### (3) 应用实践


    Michael Menden等人通过整合77个基因的突变谱和608种细胞系的`QSAR`描述符，开发了一个预测半数抑制浓度的模型。`QSAR`描述符表示小分子的各种物理化学性质。训练数据集包含38930对已知半数抑制浓度值的药物和细胞系，测试集包含13565对已知半数抑制浓度值的药物和细胞系。


    他们在单独的模型中使用神经网络和随机森林架构，训练集的实际半数抑制浓度值和预测半数抑制浓度值之间达到0.72，测试集的`r2`值为0.64。`r2`是一个在0～1的标量度量，表示一系列预测值与期望值的匹配程度，值为1表示完美的预测，0表示计算输出和真实输出之间没有相关性。`r2`值≥0.7被认为是训练集上可接受的验证，而测试集上的`r2`值≥0.6可以验证模型为预测。


    模型通过8倍交叉验证和独立盲检，预测半数抑制浓度值，确定系数`r2`分别为0.72和0.64。此种计算模型可用于优化药物细胞筛选的实验设计，估算大部分未知的半数抑制深度，而不必通过实验测量。这种结果的应用效果不亚于虚拟药物设计，成千上万的药物可以通过计算，系统地测试它们的潜在药理活性，并最终通过将患者的基因组特征与药物敏感性联系，指导患者个性化用药。


    模型通过建立机器学习模型，使用细胞系筛选实验数据预测药物敏感性，其中细胞系经不同浓度的给定药物处理，用半数抑制浓度总结剂量反应关系。癌细胞对药物分子的敏感性是由细胞和药物的特征决定的。细胞特征最终与细胞的内部工作有关，药物特征包括分子穿过细胞膜的能力、与靶蛋白结合的能力等相关的物理化学性质。训练神经网络模型根据不同细胞的基因组背景，预测不同药物的半数抑制浓度。


    事实上，根据分子的化学性质预测全细胞活性方面已有广泛的定量构效关系。然而，这种仅基于化学特征的定量构效关系方法，并不能区分耐药细胞系和敏感细胞系。


    此机器学习模型，除了细胞系的分子特征外，还包括了来自药物的输入化学特征。这种集成方法不仅集成了两个互补的信息流，还允许使用更多的数据进行训练，这是提高预测性能的关键因素。因此，该模型包括689个药物的化学描述符和138个用于区分细胞系的基因组特征，从而得到827个特征的输入空间。


    该模型通过利用来自细胞系的基因组特征和来自药物的化学信息，构建计算模型，用非参数机器学习算法来推断缺失的半数抑制浓度值。由于一些药物在不同的浓度范围内具有活性，该模型能够以相似的精度覆盖更大的动态范围。由于使用了化学描述符，多药物模型的训练使用了比数据大两个数量级的数据量来训练每个单一药物模型。


    尽管上面提到的模型没有捕捉到所有已知的与药物关联的基因，但随着未来几年更大的药物敏感性和基因组数据集的应用，这些模型的预测能力将会增加。另一个有价值的扩展是包含药物治疗后的基因表达数据，这是预测治疗结果和阐明化合物作用模式的强大电子资源，也是识别新的药物重新定位机会的一个很有前途的方向。此外，表观遗传学数据可以提高未来方法的预测能力。


    当与已知的先验基因和蛋白网络配对时，转录谱对药物反应和作用模式的预测显著增强，并根据计算预测的撞击通路推断出药物相似性。已知的基因和转录数据之间的调控关系，可以用于识别调控的通路，并进一步与驱动它们的基因组相联系，这突出了子网络对药物反应的重要性。


    模型根据输入特征对最终训练模型的影响，对输入特征进行优先排序，通过模型中集成特征选择标准和降维技术可以明确地揭示特征和结果之间的关联。在预测模型方面，标准的机器学习方法包括神经网络和随机森林，考虑到它们的灵活性，此建模技术将有广泛的应用范围。


    根据不同程度的数据稀疏度的预测精度，在设计覆盖率必须与精度平衡的实验时具有实用性。此外，由于模型能够预测尚未筛选的细胞系上的半数抑制浓度，这些模型的预测可以用来决定其是否值得扩大细胞系的范围，或者更确切地说，专注于一些选定的细胞系。这已经超出了它们在优化药物筛选的实验设计方面的效用。一旦建立了一个模型，人们就可以根据其化学特征和相似性，系统地测试新药物的潜在作用。这些预测可以帮助评估新药的潜在活性，此外，对临床批准的药物的预测有望揭示药物重新利用的候选药物，并有可能识别出对反应最敏感的的特定疾病亚型。虽然细胞系并不是真实肿瘤的确切复制品，但此预测模型以及扩展的基因组和表观基因组数据集，有助于开发针对个体患者量身定制的新治疗策略。


    ## 4.6 应用实践


    临床前的候选药物需要具备良好的活性、选择性以及合适的物理化学性质，以期该药物在后期临床中可以展现出合适的`ADMET`特性。药物在发现和开发的过程之中，需要经过多个阶段的研究和优化，才能使最终上市的药物符合要求。人工智能在药物发现和优化阶段发挥着重要的作用，比如利用人工智能辅助药物分子设计和虚拟筛选实现先导化合物的发现，利用构效关系、分子对接等方法实现先导化合物的优化，以及药物性质预测、协助结构优化和临床前研究，这些具体的方法在前面的章节已经详细介绍，这里不在赘述。这里主要列举几个人工智能助力药物研发的典型案例。


    ### (1) 筛选Abl抑制剂


    `Abl`激酶通过调节形态发生和运动性，并通过`Bcr-Abl`介导的`Src`家族激酶和`PI3K`、`Ras`、`Myc`、`c-jun`和`STAT`通路的激活促进细胞生长和存活，在癌症中发挥关键作用。`Abl`抑制剂在治疗白血病和其他癌症的临床试验中有效。`Abl`通过调节细胞形态发生、运动性、生长和存活来促进癌细胞生长。几种针对白血病和其他癌症的`Abl`抑制剂已上市，但耐药性的出现，迫使人们要开发新的`Abl`抑制剂。


    一般情况下，这些抑制剂对常见突变的活性可以忽略不计，在癌症晚期表现出一定的影响。一些患者产生与`Abl`激酶结构域突变相关的耐药性。现在，已出现多种计算方法被用于`Abl`抑制剂的搜索和设计，包括药效团、`QSAR`、支架组装、分子对接等。


    这些计算方法在识别潜在`Abl`抑制剂方面，表现出令人印象深刻的能力，但其应用可能会受到需要搜索的化学空间的广度和稀疏性、目标结构的复杂性和灵活性、准确估计结合亲和力和溶剂化效应的困难，以及训练活性化合物的有限多样性等问题的影响。因此，有必要探索其他计算方法，以扩大化学空间的覆盖范围、提高筛选速度和降低误命中率来补充这些方法，而不必依赖于目标结构灵活性、结合亲和力和拯救效应的建模。


    基于配体的虚拟筛选方法——支持向量机，用于从大型化合物库中搜索单一和多个的活性物质，并表现出高命中率和低的误判率，可以用于识别不同结构的活性基团。


    由稀疏分布的活性化合物训练得到的支持向量机，也可以获得良好的可视筛选性能。支持向量机根据区分活性和非活性化合物与活性化合物本身的结构相似性，对活性化合物进行分类，它的优点是不依赖于结构灵活性、活性相关特征、结合亲和力和溶剂化效应的准确计算。此外，支持向量机的快速和扩展的适用性，使其能够有效地搜索一个巨大的化学空间。


    新加坡国立大学生物信息学和药物设计实验室，应用支持向量机作为从大型化合物库中搜索`Abl`抑制剂的虚拟筛选工具。在5倍交叉验证研究中，支持向量机通过708种抑制剂和65494种假定的非抑制剂进行训练和测试，正确识别出84.4%～92.3%的抑制剂和99.96%～99.99%的非抑制剂。和另一种基于相同训练、测试数据集和分子描述符的机器学习方法相比，支持向量机显示高准确率和非常低的假阳性率。这说明支持向量机能够从大型化合物库中搜索`Abl`抑制剂。


    他们开发了一个用于识别`Abl`抑制剂的支持向量机模型，并通过5倍交叉验证试验和大型化合物数据库筛选试验来评估其性能。在5倍交叉验证测试中，一组`Abl`抑制剂和非抑制剂的数据被随机分成五组大致相同大小的数据组，四组用于训练支持向量机可视化工具，一组用于测试，并对所有五种可能的成分重复测试，以获得平均的可视化筛选性能。


    在大型数据库筛选测试中，支持向量机可视化筛选工具通过使用之前发表的`Abl`抑制剂，它的准确性是通过以往报告的`Abl`抑制剂来评估的，而不包括在训练数据集中。它比对`PubChem`和`MDDR`化合物库中结构和物理化学性质与已知`Abl`抑制剂的相似性，评估搜索大型文库的虚拟命中和假命中率。


    `PubChem`和`MDDR`含有高比例的与`Abl`抑制剂显著不同的非活性化合物，其易于区分的特征可通过可视化筛选得到良好呈现。尽管如此，一些`PubChem`和`MDDR`化合物，具有激酶抑制活性或与已知的`Abl`抑制剂相似。通过使用这些和其他类似于已知`Abl`抑制剂的物理化性质的化合物，可以更严格地测试可视化筛选的性能，因此富集不仅仅是一种简单的物理化学特征的分离。为了进一步评估支持向量机可视化筛选工具是否预测了`Abl`抑制剂和非抑制剂，而不是某些化合物家族的成员身份，他们又分析了预测的活性和非活性化合物在化合物家族中的分布。


    #### 1) 数据集的收集和构建


    从Pubmed和BindingDB数据库中共收集708种`Abl`抑制剂，半抑制浓度＜50μmol/L。选择半抑制浓度＜50μmol/L的抑制剂为标准，因为它覆盖了大部分报道的先导化合物。由于很少有非抑制剂的报道，假定的非抑制剂是通过上面的方法生成的假定的非活性化合物。


    收集到的`Abl`抑制剂分布在221个家族中。由于在已知的化合物库中寻找激酶抑制剂的广泛努力，在`PubChem`和`MDDR`数据库中未发现的`Abl`抑制剂家族的数量预计相对较小，很可能不超过几百个家族。


    一个假定的非抑制剂训练数据集，可以通过从每个家族中提取一些不包含已知抑制剂的代表性化合物来生成，最大可能的“误判”分类率为＜15%，即使所有未发现的抑制剂都不属于非抑制剂类。由高达15%的错误阴性家族所产生的噪声水平，预计将远远小于支持向量机所容忍的最大50%的假阴性噪声水平。在假定的非抑制剂家族中，未被发现的抑制剂可以被归类为抑制剂，即使它们的家族代表被归入非抑制剂训练集。


    在数据库筛选测试中，50%的结构家族包含已报道的`Abl`抑制剂，这些结构家庭的代表性化合物被故意放在非活性训练集，假设在此研究中，对这些结构的生物活性是未知的。这些错位的、含有抑制剂的非抑制剂家族中，大量抑制剂被支持向量机可视化筛选工具预测为抑制剂。此外，在这些假定的非抑制剂数据集中，有一小部分化合物预计是未被报道的或未被发现的抑制剂，而且它们在这些数据集中的存在，预计不会对支持向量机的估计假命中率产生显著影响。


    #### 2) 分子描述符


    分子描述符是分子结构和物理化学特征的定量表示，已广泛用于推导定量结构活性关系和可视化筛选工具。所有的描述符，以最佳形式覆盖化合物的化学空间。这些描述符包括简单分子性质中的18个描述符、化学性质类中的3个描述符、电拓扑状态类中的42个描述符，以及分子连通性和形状类中的35个描述符。


    前三类的描述符是非冗余的。第四类中的一些描述符，尽管它们的数学表达式不同，但在描述拓扑特征上有一定程度的重叠。这些描述符包括舒尔茨分子拓扑指数、古特曼分子拓扑指数、维纳指数、哈拉里指数和引力拓扑指数。拓扑描述符的部分重叠，并不是支持向量机分类的一个严重问题，因为支持向量机对描述符冗余的惩罚较小。


    #### 3) 支持向量机方法


    下面介绍训练和使用支持向量机筛选模型筛选化合物的筛选过程。支持向量机基于统计学习理论的结构风险最小化原则，始终表现出突出的分类性能，受样本冗余的惩罚较小，过拟合的风险较低。


    在线性可分离的情况下，支持向量机构建了一个超平面，来分离具有最大边缘的活性和非活性化合物类。化合物由其分子描述符组成的向量`xi`表示。模型通过找到另一个向量`w`和一个最小化｜`w`｜，以及满足条件的参数`b`来构造超平面。


    在开发此支持向量机可视化筛选工具时，使用了硬边距，发现`σ`值为0.06。其性能指标可以从真阳性、真阴性、假阳性和假阴性的数量中得出。


    概率神经网络的网络架构，由训练集中化合物和描述符的数量决定。在一个概率神经网络中有四个层。输入层为模式层中的所有神经元提供输入值，其神经元与训练集中描述符的数量相同。模式神经元的数量是由训练集中化合物的总数决定的。每个模式神经元计算输入和由该神经元表示的训练情况之间的距离测量，然后将距离测量交给非参数估计器。总和层每个类都有一个神经元，神经元将所有模式神经元的输出进行总和，对应于该总和神经元类的成员，得到该类的估计概率密度函数。然后，输出层中的单个神经元通过比较求和神经元的所有概率密度函数和选择概率密度函数最高的类来估计未知化合物`x`的类别。


    从`MDDR`数据库的659个支持向量机虚拟命中，有20%是通过分子对接选择的，其中包括128个属于酪氨酸特异性蛋白激酶抑制剂类的化合物。这表明，达成一致的方法可能有助于丰富真正的命中选择率。


    同时，许多支持向量机虚拟命中都是抗肿瘤化合物，它们可以抑制酪氨酸激酶和可能参与信号转导、血管生成和其他癌症相关途径的其他激酶。虽然这些激酶抑制剂可能是真正的`Abl`抑制剂，但它们中的大多数，预计是来自其他激酶抑制剂的错误选择。


    共有98个支持向量机虚拟命中序列属于抗关节炎类。`Abl`抑制剂格列卫，对治疗关节炎有效，这可能是由于它抑制了其他相关激酶，如`c-kit`和`PDGFR`。此外，其他一些激酶也与关节炎有关。`EGFR`样受体刺激滑膜细胞，其活性升高可能参与了类风湿性关节炎的发病机制。


    `VEGF`与系统性红斑狼疮、类风湿性关节炎和多发性硬化症等自身免疫性疾病有关。`FGFR`可能部分介导骨关节炎。`PDGF`样因子刺激类风湿性关节炎滑膜结缔组织细胞的增殖和侵袭性表型。因此，抗关节炎类中的一些支持向量机虚拟命中可能是这些激酶或其能够产生抗关节炎活性的激酶样物的抑制剂。


    此模型分析了已识别的`Abl`抑制剂和非抑制剂的化合物家族分布，共有19.6%的已鉴定的抑制剂，属于不含已知的`Abl`抑制剂的家族。对于那些含有至少一种已知的`Abl`抑制剂的家族，每个家族中＞70%的化合物被`SVM`预测为非抑制剂。这些结果表明，基于支持向量机可视化筛选可识别`Abl`抑制剂，而不局限于某些化合物家族。一些已确定的抑制剂不属于已知抑制剂家族，可能作为潜在的“新型”`Abl`抑制剂。因此，正如早期研究所示的情况一样，支持向量机具有从稀疏的活性数据集中识别新的活性化合物的能力。


    ### (2) 5-HT1A激动剂


    据报道，`DSP-1181`是第一个完全由人工智能设计开发并成功进入临床试验的人工智能候选药物，该药物由Exscientia公司联合住友制药合作开发。`DSP-1181`是一个长效的`5-HT1A`激动剂，主要用于治疗强迫症，该药物从最初筛选到完成临床前试验仅花费一年不到的时间，可见人工智能助力的研发效率远高于传统药物开发模式。本项目的成功得益于Exscientia公司的人工智能药物研发技术以及住友制药在G-蛋白偶联受体药物研发中的优势，目前两家公司仍在积极推动该项目。


    ### (3) 英矽智能（Insilico Medicine）实现多个人工智能药物研发


    英矽智能是一家由端到端人工智能驱动的临床阶段生物医药公司，目前该公司已构建三款人工智能药物研发平台，贯穿新药研发的三个阶段，包括靶点发现平台`PandaOmics`，化合物设计和生成平台`Chemistry42`，以及临床试验预测平台`InClinico`。在成立的短短几年时间中，英矽智能利用人工智能赋能助力多个创新药物的研发。2019年，该公司团队报道利用其开发的深度学习模型——生成式张量强化学习（`GENTRL`）在短短的21天内，就完成了3万个化合物的筛选，并发现了6个`DDR1`激酶抑制剂，其中一个化合物在小鼠体内表现出良好的药代动力学性质。抗特发性肺纤维化项目`INS018055`是该公司利用人工智能助力药物研发中更为成功的案例，该项目从靶点的发现到候选药物的筛选都是利用人工智能完成，目前该药物已经处于临床Ⅱ期试验阶段，是人工智能助力具有全新作用机制的抗特发性肺纤维化药物研发的典型案例。值得关注的是，该药物的整个研发过程仅耗时18个月，花费大约为200万美元，这是人工智能加速药物研发的强有力证明。近期，英矽智能再次报道了利用`AlphaFold`实现`CDK20`激酶抑制剂的快速研发，利用`AlphaFold2`与其开发的药物研发平台`PandaOmics`和`Chemistry42`，在30天的时间内实现了靶点筛选、化合物设计、化合物合成以及生物活性测试的工作，在合成的7个化合物中，`ISM042-2-001`表现出良好的`CDK20`抑制活性。他们以此为基础利用30天的时间完成了第二轮的人工智能助力药物优化，最终得到候选化合物`ISM042-2-048`。


    # 第5章 人工智能辅助药物治疗


    人工智能在药物治疗中最常见的应用是寻找匹配患者的最佳药物或药物组合，预测药物-靶点或药物-药物相互作用，并优化治疗方案。为患者选择最佳的药物，通常需要整合患者数据，如遗传学或蛋白质组学，以及相关的药物数据，用以评价药物的治疗疗效。药物相互作用的预测通常依赖于相似度指标，假设具有相似结构或靶点的药物具有相近的效果，可能会相互干扰。


    个性化医疗时代已经开启。基因组学研究的飞速发展，为个性化诊疗提供了大量与疾病、组织、动物和细胞系相关的基因组和转录组数据。同时，数以千计的定量构活性关系描述符和分子指纹已经被开发出来，用于药物分子的定量和分类表征。研究人员利用这些新获得的计算方法和数据开发引擎，以帮助预测患者特定的药物治疗，优化剂量和药物计划，确保患者康复的最高可能性和生活质量。

