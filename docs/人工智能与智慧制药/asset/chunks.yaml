    # 模型训练与泛化


    对输入数据进行特征分层，重新训练模型的不同比例的模型均匀，以获得模型的通用性和稳定性，这是一个有用的训练，最好以相对实惠的成本，收集更多高质量的原始数据。收集高质量数据集往往成本昂贵，实现起来难度很大，这通常是生物数据的药物发现的情况。


    训练集可以通过生成人工数据点，或通过使用多任务或迁移学习程序，来丰富模型对相关数据的见解。该模型可以通过超参数优化、合并正则化，或通过采用更专门的神经网络架构来改进，这取决于针对任务的目的。


    如果测试集上的性能仍然比训练集上差得多，即使调整了正则化超参数，也无法收集更多的训练数据，那么减少泛化误差最简单的方法，可能是改进学习算法本身。再次强调，初始的训练数据不仅数量足够，而且质量也应该足够高。然而，目前药物发现领域的情况是，数据质量并不好，数量也不是那么大。


    假设有 10000 个值可用，与用于构建视觉模型的大量信息相比，这一数据量也是无穷小的，这些模型将你所收集的东西与你可能想收集的其他东西联系起来。此外，通过高通量筛选，生成的数据库通常与活性和非活性化合物不平衡，这时特定的数据采样技术可以用于平衡建模中的活性分布。


    实际上数据集是不完整的，它们会包含错误。此外，众所周知，大多数药物具有多个生物靶点和活性，患者的个体基因谱也有相对差异。这意味着，在药物设计领域，由于未知的贡献因素和多对多的非线性关系，我们面临着大量的难题。


    该模型有时会将化合物规入无活性集，在没有实验验证的情况下，给化合物一个“非活性”标签。这个问题可以通过使用半监督方法解决，在训练期间使用包含活性和未标记化合物的信息，通过引导或使用噪声适应神经网络，来估计现有标签不正确的可能性，并使用它来相应地加权数据（图
    4-3）。


