    ## 2 蛋白质毒性预测与机器学习概述

    尽管在人工智能和机器学习方面取得了进步，但这些技术在许多领域都面临着问题。其中一个主要问题是，与蛋白质毒素相关的质量数据作为一个输入可能是非结构化的，因此在任何基于预测的分析或建模之前，需要清理数据，以获得一个有组织的训练集。例如，由实验产生的数据不能假定在现实世界中有完美的测量值，这可能会导致有偏差的输出。


    同时，最新发现的大分子或毒素基序，可能没有结构数据。要解决这个问题，可以设计一系列序列或同源模型作为诱饵集，对应一个特定的生物目标计算模型，然后使用这个模型作为数据集，来设计新的非毒素候选机器学习模型。毒理学领域的大数据是由组学技术、高通量筛选数据和基因阵列等产生的数据。除了通过高通量和组学技术获得的数据外，来自监测和流行病学的大型数据集也正在迅速增加。


    这些数据可公开和免费地获取。但越来越多的数据，包括不相关的数据，将产生更多的噪声或虚假相关性。所以，有必要确定适当、充分和相关的数据，并提炼出足够的信息，这些信息可能取决于所作出的预测的背景或要回答的毒理学问题。因此，寻找有用的数据方面的挑战，比识别和选择相关数据以支持预测建模和安全性评估具有更大的权重。尽管存在信息学和技术问题，但预测毒理学和安全性评估的一个主要挑战是数据内容的整合、不同数据权重的评估，可能的差异及存在的一般相关性也对预测问题有很大的影响。


    具有多个不同描述符集的多视图学习或建模，正在朝着机器学习的方向快速发展，并已形成良好的理论去推动。多视图数据更容易集成，未来将用于精确医学，并具有更好的药物-疾病关联预测能力。极限学习机，是一种相对较新的基于单隐层前馈神经网络，是经验风险最小化理论的学习算法。为了避免多次迭代、局部最小值和过拟合等问题，极限学习机可以作为构建毒物蛋白质组学模型的一种选择。


    人工智能已开始被用于细胞图像处理、物理生物活性和药物毒性预测。然而，准确预测药物分子或目标蛋白的毒性仍然具有挑战性，计算方法有时在这方面表现不佳。首先，人工智能是一种数据挖掘方法，可用数据的数量和质量直接影响人工智能模型的性能。其次，现有数据的质量有时不足以进行有效的人工智能学习。例如，用不同方法测量的分子的治疗指数，可以产生完全不同的数据，不能相互比较。


    最后，蛋白质解析的工作非常困难，因为它需要在 4 个不同的水平上分解和思考，氨基酸一级序列结构特征的一维预测；氨基酸之间空间关系的二维预测；蛋白质三级结构的三维预测；以及多蛋白质复合物四级结构的四维预测。由于这一组多样化的信息片段，人工智能很难将这些信息字符串整合为基于多变量的分类模型。


    更多可用的公开数据，以及新的机器学习和深度学习方法的发展，已经改变了蛋白质组学领域。深度学习是人工智能的辅助部分，它使用多层从原始输入中逐步提取高级特征，已被用于预测蛋白质的三维结构，也擅长分子毒性预测。近年来，从分子或蛋白质组学数据库，到三维结构数据集的多尺度数据集成，深度学习模型都锚定这些数据类型。


    随着多组学领域的发展，使用了随机森林、支持向量机和神经网络等已建立的方法，深度学习的使用取得了辉煌的结果。由于计算性能的快速发展，现在可以实现适用于大数据问题的深度学习。


    基于蛋白质一级序列的描述符，可以结合到简单的物理化学性质上，而这些物理化学性质，又可以结合到复杂的结构特征和高维特征，或毒素载体上。因此，深度学习算法可以用来构建蛋白质组学特征的层次结构，这使深度学习非常适用于计算毒理学。


    随着生物信息学的深度学习进入一个更成熟的阶段，细致的基准和评估在已发表的文献中变得越来越常见。由于以下原因，这一趋势可能会持续几年：架构和算法的不断改进；收集的实验数据不断增加；生物信息学和机器学习之间的交叉越来越多。


    一些疾病明显与蛋白质毒性有关，这是主要的致病机制之一，但其细节仍不完全了解。治疗性蛋白或多肽的毒性学图谱，在人类的临床发展和进一步研究领域至关重要。这些方法可以通过各种体内方法来进行，如细胞毒性研究、溶血毒性，以及可以在动物身上进行的标准毒性研究。通过利用计算方法，如机器学习、分子建模及动力学技术，蛋白质或多肽的毒性效应可以有效预测，甚至在初步阶段也可以实现，从而使毒性预测成为一种合理的方法。


    现在，蛋白质毒性预测的基础还很模糊，在毒性蛋白质组学数据的水平上，现已有不同的方法，如利用一级序列信息，而很少有模型考虑二级结构特征和蛋白质一级序列信息。有几个基于
    Web 的应用程序可用，它们能够通过合理的性能指标，来预测和分类蛋白质或多肽的有毒和无毒，这些服务器得到了几种基于机器学习的技术的反向支持。毒性信息学的最终目标不仅是准确地预测任务，而且能够理解潜在的生物过程。毒性蛋白质组学人工智能或机器学习技术和计算建模的未来发展，需要更多关注基于多肽的治疗方法，以增强治疗特性并筛选出低毒性的多肽类候选药物。


    ## 2.1 靶蛋白结构预测

    药物研发在制药行业仍然需要投入巨大而沉重的金融成本。然而，每年只有少数候选药物，主要是小分子，可以成功进入市场。现代新药研究与开发的关键首先是寻找、确定和制备药物筛选靶——分子药靶。药物靶点是指药物在体内的作用结合位点，包括基因位点、受体、酶、离子通道、核酸等生物大分子。选择确定新颖的有效药物靶点是新药开发的首要任务。但已清晰阐明结构及功能的靶点数量可能仅占人体极微小的一部分。新的药物靶点对于新药研发至关重要，往往会成为一系列新药发现的突破口。


    在传统的基于实验的靶点识别方法中，基于化学修饰探针的靶点发现策略是较为常用的，使用小分子亲和探针可以在配体-蛋白质相互作用时进行无痕蛋白质标记，其中基于活性的蛋白质谱分析（activity-based
    protein profiling, `ABPP`）技术已经较为成熟。分子探针是指能与特定的靶分子发生特异性相互作用并能被特殊方法所检测的分子，`ABPP`通常利用一个链接臂将反应基团与报告基团连接起来，利用反应基团与靶蛋白发生共价结合，从而将探针分子标记在靶点上，并利用质谱进行分析。基于靶蛋白与配体结合时稳定性会增加，导致微量的热量变化，通过检测这种热量的变化，就发展出了基于蛋白质热稳定性的靶点发现策略。同样利用靶点与配体结合后的稳定性增加，结合了配体的靶蛋白就不容易被蛋白酶破坏，利用药物亲和反应的靶点稳定性（drug
    affinity responsive target stability, `DARTS`）同样可以寻找靶标蛋白。此外通过改变基因的序列或改变基因的表达水平来发现疾病相关的靶点也是较为常用的方法，包括
    RNA 干扰（`RNAi`）筛选和`CRISPR`基因编辑技术，尤其`CRISPR`技术的出现与发展，使基于`CRISPR`技术的高通量筛选系统可以用于大规模地敲除（`CRISPR-KO`）、抑制（`CRISPRi`）或激活（`CRISPRa`）大量候选基因，通过观察疾病表型的恶化或是缓解，可以找到潜在的药物作用靶点。由于基于实验的靶点识别效率较低，通过计算方法的靶标识别成为了较好的替代和补充。药效团筛选、反向对接和结构相似性评估等计算手段已被用于预测配体的新生物靶标。


    目前，生物医学数据的爆炸式增长，为数据分析带来了挑战，而人工智能在处理这些复杂的生物医学数据网络时具有独特的优势，例如深度学习方法近年来在生物医药领域被广泛应用，如
    Fabris 等人建立了一种基于深度学习的方法，该方法具有新颖的模块化构架，通过从基因或蛋白质特征中检索学习模式，并以此来识别多种年龄相关疾病的致病基因。此外大型语言模型可以通过对已报道的相关生物医学文本信息的快速挖掘，基于大型语言模型
    AI 聊天功能，连接疾病、基因和生物过程，从而能够识别、推断疾病发生和发展的机制，并实现潜在药物靶标和生物标志物的鉴定。目前创新药物研发公司 Insilico
    Medicine 已将基于大型语言模型最新进展的高级人工智能聊天工具`ChatGPT`集成到其`Pan⁃daOmics`平台中，`ChatPandaGPT`使研究人员能够与平台进行自然语言对话，并有效地导航和分析大型数据集，从而以更有效的方式促进潜在治疗靶点和生物标志物的发现。微软也发布了基于生物医学研究文献的大型语言模型`BioGPT`。面临现有数据比较缺乏的情况，也可以通过人工智能合成数据来进行靶标识别，通过人工智能算法，可以创建合成数据模拟各种生物场景，为研究人员深入研究分析提供更多可能性，合成数据还可用于训练人工智能模型，并寻找潜在的治疗靶点，该技术对于一些研究数据较少的罕见病尤为适用。


    关于蛋白质折叠的知识对理解蛋白质的异质性和分子功能有深远的影响，并将进一步促进创新药物研究。预测蛋白质的三维结构是分子生物学中的一个关键问题。蛋白质折叠量的测定主要依赖于分子实验方法。随着新一代测序技术的发展，新的蛋白质序列的发现已经迅速增加。由于蛋白质数量庞大，使用实验技术来确定蛋白质折叠是极其困难的，这些技术耗时并昂贵。因此，迫切需要开发能够自动、快速、准确地将未知蛋白质序列分类为特定折叠类别的计算预测方法。


    蛋白质折叠的计算识别一直是生物信息学和计算生物学的研究热点。人们已经做了许多计算工作，产生了多种计算预测方法，特别是基于机器学习的方法。对折叠类别下未知结构的蛋白质的分类称为折叠识别，这是确定蛋白质三级结构的基本步骤。


    理解蛋白质如何采用其 3D 结构仍然是科学上最大的挑战之一。阐明这一过程将极大地影响生物学和医学的各个领域，以及新的功能蛋白和药物分子的合理设计。确定一个蛋白质的折叠类别是至关重要的，因为它揭示了蛋白质的三维结构。


    在早期，蛋白质结构的测定依赖于传统的实验方法，如 X 射线晶体学和核磁共振光谱学。在后基因组时代，通过新一代测序技术产生了大量的序列。虽然用实验方法对结构确定的序列进行结构特征分析越来越多，但结构确定的序列与无特征序列之间的差距不断增加。因此，迫切需要开发一种快速、准确地测定蛋白质结构的计算方法。


    蛋白质折叠的精确计算预测，将逐渐替代劳动密集和昂贵的蛋白解析试验。蛋白质折叠识别的计算方法一般可分为 3 类：从头建模方法、基于模板的方法和无模板的方法。由于从头建模有两个局限性，许多工作都集中在基于模板的方法和无模板的方法开发上。首先，它需要较长的计算时间和大量的数据库，其次，它只能成功地应用于小的蛋白质解析。


    用于确定蛋白质结构的基于模板的方法，是基于蛋白质的进化关系发展而来的。基于模板的方法的过程可以总结如下。


    首先，从公共蛋白质结构数据库中检索到的已知结构的蛋白质，被用作查询蛋白序列的模板蛋白。为了使基于模板的预测快速、可靠，通常采用一个简化的数据库，其中序列相似度小于
    50%～70%。


    其次，检测到目标序列与已知结构的蛋白质之间的远距离进化关系。在这一步中，采用多比对算法，通过编码氨基酸序列来利用进化信息。


    再次，为了确定最优的条件，评估来自查询蛋白的配置文件，与具有已知结构的模板蛋白的配置文件之间的相似性，作为评分函数的度量值。z 分数和 e 值是两种常用的评分函数。对齐的准确性在模型构建中非常重要。


    最后，建立了基于模板原子坐标和最优查询-模板对齐的三维结构模型。最后，通过进一步的结构优化，从候选模型中确定最优的结构模型。常用的结构优化方法包括能量最小化和回路建模。


    在过去的几十年里，人们开发了一系列基于模板的方法。这一系列的方法被认为是构建蛋白质结构理论模型最成功的方法。例如，Sanford Burnham 医学研究中心开发了一种名为折叠和功能分配系统的蛋白质识别方法，通过使用轮廓-轮廓对齐策略，而不使用任何结构信息，查询和模板配置文件是通过对`PDB`数据库进行搜索来获得的，然后这些配置文件通过点积评分函数对齐。通过比较蛋白质与一对不相关蛋白质的分布得分，计算出对齐得分的显著性。改进的折叠和功能分配系统方法，提出了一种称为`3D-折叠和功能分配系统`的方法，其中引入了结构信息，如二级结构、溶剂可及性和残留深度。`3D-折叠和功能分配系统`的功能有明显的提高。


    此外，Cambridge 大学生物化学实验室开发了一种名为`赋格`的蛋白质折叠识别方法，它可以通过使用与环境特定的替代表和结构依赖的间隙，来搜索蛋白质折叠库的序列，是一种利用线性规划的数学理论，建立蛋白质的三维模型和预测蛋白质折叠的新方法。同时，名为`I-TASSER`（迭代线程集成改进）的在线预测服务器，是一个基于序列到结构再到功能范式，对蛋白质结构和功能自动预测的集成平台。


    Sorbonne 大学新药研究中心提出了一种新的蛋白折叠识别方法，该方法基于成对比较，包含蛋白质序列及其结构的进化信息。基于模板的方法和建模程序也被成功开发出来。建模器通过满足空间约束来实现比较蛋白质结构建模，而`TMFR`应用特殊的评分函数来对齐序列，并预测给定的序列对是否共享相同的折叠。如上所述，已经提出了几种典型的基于模板的方法。然而，检查基于模板的建模质量的方法仍然不完善。目前，`CASP`（蛋白质结构预测的关键评估）是一个主流平台，用于建立一个独立的机制来评估当前在蛋白质结构建模中使用的方法。


    基于模板的建模方法已经取得了很大的进展，但仍存在一些问题。首先，需要确定模板蛋白的结构，许多蛋白质的三维结构仍有待确定。其次，基于模板的建模在很大程度上依赖于目标蛋白和模板蛋白之间的同源性。当目标蛋白和模板蛋白的序列相似性高于
    30%时，使用序列比对方法可以揭示它们的进化关系。然而，这种方法不适用于序列标识为 20%～30%的目标，因为它和模板之间的关系不明显。最后，基于模板的结构建模很耗时。


    为了解决上述问题，最近的研究工作都集中在无模板方法的发展上。无模板方法寻求仅基于氨基酸序列，而不是基于已知的结构蛋白作为模板，来建立模型和准确预测蛋白质结构。许多机器学习算法利用这一点，包括隐马尔可夫模型、遗传算法、人工神经网络、支持向量机和集成分类器。使用基于机器学习的蛋白质折叠识别方法的一个关键的潜在假设是，蛋白质折叠类的数量是有限的。


    机器学习的目的是通过学习不同蛋白质折叠类别之间的差异，来建立一个预测模型，并使用学习到的模型，自动将查询蛋白质分配给特定的蛋白质折叠类。因此，这种方法对于大规模预测更有效，并可以检查大量有前途的候选方法并进行进一步的实验验证。


    大多数最近开发的蛋白质折叠识别方法，都是基于集成分类器模型。①对于给定的`n`个不同的单一基本分类器，第一种基于集成分类器的方法，使用一个特定的特征描述符来编码具有特征表示的查询蛋白质，用每个基本分类器训练特征表示，创建`n`个单一分类器模型，然后将所有训练过的`n`个单一分类器模型与集成策略相结合，生成一个基于集成分类器的模型。②对于给定的`n`个不同的单一基本分类器和`n`个不同的特征描述符，第二种基于集成分类器的方法使用`n`个特征描述符来编码具有`n`个不同特征表示的查询蛋白质。`n`个特征表示依次组合为一个来训练`n`个基本分类器，然后训练所有`n`个基本分类器将单个分类器模型与集成策略相结合，生成一个基于集成分类器的模型。③对于给定的特定分类器和`n`个不同的特征描述符，第三种基于集成分类器的方法使用`n`个特征描述符编码具有`n`个不同特征表示的查询蛋白质，分别用特定的单个分类器训练`n`个基于单一分类器的模型，然后将所有训练的`n`个单一分类器模型与集成策略相结合，生成一个基于集成分类器的模型。


    依据此原理，出现了一种叫作`ProFold`的识别方法。在`ProFold`中，除了其他常用的特征，如氨基酸序列的全局特征、`PSSM`特征、功能域特征和理化学特征外，还首先考虑了蛋白质三级结构的信息。三级结构特征利用`DSSP`从`PDB`文件中计算八种二级结构状态。此外，`ProFold`还提出了一种构建集成分类器的新策略。


    与传统的实验方法相比，基于机器学习的方法有 3 个优点：首先，它们展示了准确、健壮和可靠的性能；其次，它们可以应用于大规模的蛋白质折叠识别，这一应用在后基因组时代非常重要，其中仍有许多蛋白质有待结构表征；最后，它们可以有效地解决实验方法的内在问题，即它们耗时和昂贵。在过去的几十年里，蛋白质折叠识别计算方法取得了显著的进展，但还有一些难题有待解决。


    用于评估预测器性能的基准数据集实际上受到了一些局限。此外，每个折叠类的样本量都很小，一般来说，基于这种不平衡和小数据集生成的预测模型很容易过拟合。大多数现有的方法，特别是对于那些使用在线服务器的方法，只能提供填充的
    27 倍类预测。虽然 27 倍类的序列覆盖了`SCOP`数据库中的大部分序列，但在`SCOP`中实际上存在大约 1800 个蛋白质折叠类。因此，由于发现了越来越多的蛋白质折叠预测因子，开发适应性多类蛋白质折叠预测因子是可取的。已建立的集成分类器已经证明了其在蛋白质折叠识别方面的分类能力。利用深度学习算法进行分类任务是机器学习领域的研究热点。深度学习网络已成功应用于蛋白质折叠识别。将深度学习网络与成熟的集成分类器相结合，可能是提高蛋白质折叠识别效率的另一种方法。


    基于机器学习的方法可以成功地应用于蛋白质折叠识别。未来，机器学习方法将广泛应用于其他类似但未被探索的领域，如致病氨基酸变化预测、蛋白-蛋白结合位点或相互作用预测、DNA-蛋白结合位点或相互作用预测等。


    蛋白质的检测和定量是我们理解细胞生物学和人类疾病的关键。在这种情况下，高分辨率质谱的发展，对获得稳健的结果至关重要。肽的可检测性也是蛋白质组学中蛋白质鉴定、蛋白质定量和差异表达研究的一个重要问题。蛋白质组学是高通量实验领域中最重要的技术之一。在目前大多数用于蛋白质组学实验分析的生物信息学管道中，这一特征没有被考虑在内。这种肽的特征很难量化，因为有大量的变量干扰通过质谱仪检测某个肽或氨基酸序列。


    由于质谱仪中肽选择的随机性，结果的统计分析困难重重。同时，由于变性肽的存在，使用高通量蛋白质组学技术进行蛋白质检测和定量仍然具有挑战性。然而，在分析中只考虑那些可以通过质谱检测到的肽，也称为蛋白型肽，可以提高结果的准确性。有几种方法已被应用于预测基于肽的物理化学性质的肽的可检测性。


    西班牙纳瓦拉大学生物信息学平台，发明`DeepMSPeptide`，一种用`Python`编写的生物信息学工具，专门考虑肽氨基酸序列预测肽检测性。它使用卷积神经网络实现的深度学习分类器，输入向量是肽序列的整数转换，为每个氨基酸分配整数。由于肽的长度不同，对输入进行了标准化，以供卷积神经网络进行填充。通过这种方式，每个代表一个肽的载体包含
    81 个元素。使用一个嵌入层来处理这个输入量作为网络的第一层。第二层是退出层，在训练的每个阶段将输入单元随机设置为 0，防止过拟合。接下来添加了一维或二十一维的卷积层，应用
    64 个滤波器，滑动窗口为 1，宽度为 3。最后，该模型包括了两个额外的隐藏层。分类器的输出为概率（具有 s 型激活函数的单元层），选择进行训练的损失函数为二进制交叉熵。每个模型在
    100 个样本中批量训练 200 个周期。在训练过程中，以 1=4 个样本作为验证集，当损失函数在连续 5 个周期稳定时停止训练。


    该数据库的使用克服了其他研究的局限性。数据库中每种类型的质谱具有代表性，可用于预测每种肽的内在可检测性，而与所使用的质谱仪器的偏差无关。深神经网络是一个简单的深度学习结构，在标准神经网络中添加了更多的层，因此预测函数的复杂性不够高，不足以改进机器学习技术。然而，使用卷积神经网络的深度学习方法显著优于随机森林和其他仅使用每个肽的氨基酸序列作为输入的方法。并且使用`GPU`而不是`CPU`，其执行速度要快
    46%。

    '
