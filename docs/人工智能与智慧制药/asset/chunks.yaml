    # 前言


    药物的发现和设计包括漫长而复杂的步骤，如靶点选择和验证、先导化合物优化、临床前试验和临床试验以及生产实践。在过去的几十年里，药物化学家和生物科学家致力于以最大的效率开发靶向治疗药物。创新药物研究的成本和时间消耗是药物设计和开发过程中的巨大障碍。为了最大限度地克服这些挑战和障碍，全球研究人员越来越多地借助虚拟筛选和分子对接等计算方法，大大提高先导物的筛选效率，但这些技术也伴随诸如不准确性和效率仍不理想等问题。


    人工智能的兴起和不断完善，包括深度学习和机器学习算法，尤其是其在药物研究领域的应用已经成为一种可能的解决方案。相较传统方式，它能以简单科学的方式解决现实问题，克服药物设计和发现过程中的问题和障碍。新技术的实现，足以消除传统计算方法中遇到的挑战，在一定程度上减少了药物研究过程的时间消耗和成本。生物和化学科学家将人工智能算法广泛应用于药物设计和发现过程中。基于人工智能和机器学习原理的计算建模为化合物的识别和验证、靶标识别、肽合成、药物毒性和理化性质评估、药物监测、药物疗效和有效性以及药物重新定位提供了一条很好的途径。随着人工智能原理以及机器学习和深度学习算法的出现，来自化学文库的化合物虚拟筛选（包括超过
    1 亿种化合物）变得简单且高效。此外，人工智能模型消除了由于靶标相互作用而产生的毒性问题。


    为了更好地介绍人工智能在药物研究各领域的应用及相关技术，我们组织编写了此书。本书积极响应党的二十大精神，简要讨论了人工智能从机器学习到深度学习的演变，以及大数据参与药物发现过程的革命性变化。全书分为
    7 章。第 1 章概述了人工智能的起源和发展，重点论述了经典机器学习方法和最新机器学习方法；第 2 章论述了人工智能在蛋白质结构方向中的应用，包括蛋白质活性及毒性预测，以及蛋白质与蛋白质间的相互作用；第
    3 章主要论述了人工智能在药物筛选过程中，对化合物成药性相关的物理、化学性质的预测，以及结构与活性关系预测；第 4 章主要论述了人工智能在改进传统药物发现过程方面的应用，如一次和二次筛选、药物毒性、药物释放和监测、药物剂量的有效性、药物重新定位和多药效以及药物-靶标相互作用；第
    5 章从联合治疗、评估药物反应及药物-药物相互作用等方面，介绍了人工智能在药物治疗方面的应用。第 6 章论述了多组学数据和生物网络，介绍了药物代谢和药效相关基因，并给出人工智能的药物基因识别方法和应用实践。第
    7 章主要介绍了制药工业智能制造的系统构架，人工智能在药物生产过程中的应用场景，以及我国制药行业智能制造的发展现状。


    本书由常熟理工学院生物与食品工程学院孙先宇、何卫刚，常熟理工学院计算机学院王颖共同编写。其中第 1 章、第 2 章由孙先宇编写，第 3 章由何卫刚编写，第
    4 章、第 5 章、第 6 章由王颖编写，第 7 章由上海药坦研究开发有限公司郭利军编写。


    由于人工智能技术涉及广泛且发展迅速，加之编者视野及水平限制，书中难免存在疏漏和不足，敬请广大读者批评指正。


