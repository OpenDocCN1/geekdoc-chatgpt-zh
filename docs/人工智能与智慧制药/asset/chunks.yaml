    为蛋白质网络相互作用关系数，则特定状态相关蛋白质互作网络为`GS`=（`VS`，`ES`）结点和相互作用关系定义见式（6-7）､式（6-8）｡


    ![](img/figure_0140_0036.jpg)


    第三步，特定状态下蛋白质网络的功能模块提取。我们构建的特殊状态下相关蛋白质网络需要考察的基因比较多，更重要的是，这些基因之间的相互关系也需要考察。功能模块是指在特定条件和正常条件下，蛋白质网络中总体表达量显著差异的子网，且子网内的蛋白质结点在网络中密切连接。这些功能模块整合了基因表达量水平和蛋白质相互作用信息，在系统分析生命过程中，能够发现发生明显变化的关键通路。这一部分我们尝试了两种算法，分别为采用模拟退火算法和线性规划算法的功能模块识别，定义基于功能模块的差异表达分数见式（6-9）。


    ![](img/figure_0140_0037.jpg)


    第四步，功能模块的富集分析。对功能模块中的基因进行功能富集分析，通过借助生物信息已知数据和分析工具，采用统计分析方法，挖掘相同分子谱数据具有显著相关的生物功能及参与生物通路。


    第五步，通过 miRNA 表达谱分析差异表达 miRNA。这里我们同样采用正常组织和特殊状态组织进行 t 检验。对差异表达 miRNA 进行靶基因预测，采用阈值设置和多靶基因预测软件结果取交集的方法降低预测结果的假阳性问题。


    第六步，构建 miRNA 调控的特定状态蛋白质网络（`miRNA-regulated-PIN`）`Gmir-PIN`=（`Vmir-PIN`，`Emir-PIN`）。设
    miRNA 靶基因为`Gtarget`，则`miRNA-regulated-PIN`的网络结点定义见式（6-10）。


    ![](img/figure_0140_0038.jpg)


    `miRNA-regulated-PIN`的网络结点定义见式（6-11）。


    ![](img/figure_0140_0039.jpg)


    第七步，通过对`miRNA-regulated-PIN`的结点基因进行功能富集分析，进一步识别 miRNA 的相关功能。


    #### 2）利福平作用于肝脏 miRNA 功能分析


    基于`miRFun_omi`方法的利福平作用于肝脏 miRNA 功能分析流程见图 6-5。


    ![](img/figure_0141_0040.jpg)


    图 6-5　基于 miRFun omi 方法的利福平作用于肝脏 miRNA 功能分析流程


    #### 3）构建利福平相关的蛋白质互作网络


    首先，设蛋白质互作网络 1（`HPRD`）`GHPRD`=（`VHPRD`，`EHPRD`）和人类肝脏蛋白质网络 2（`HLPN`）`GHLPN`=（`VHLPN`，`EHLPN`），人类蛋白质互作网络`GHPIN`=（`VHPIN`，`EHPIN`）定义见式（6-12）、式（6-13）。


    ![](img/figure_0142_0041.jpg)


    其中，`EHPIN`∩`EHPRD`且`EHPIN`∩`EHLPN`，或`EHPIN`∩`EHLPN`且`EHPIN`∩`EHPRD`


    其次，基因表达谱采用 t 检验分析基因显著性分析，选取`p`＜0.05 为阈值，提取差异显著基因。


