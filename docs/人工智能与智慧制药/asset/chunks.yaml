- raw: '不考虑修饰肽的情况，DeepMSPeptide是一种通用的方法，除了包含这类氨基酸的训练数据集外，还将修饰肽作为新的整数，这将使它们的可检测性预测成为可能。


    ## 2.2　多肽活性预测


    一般来说，对新肽的实验评价是昂贵和耗时的。因此，有必要发展计算方法来预测多肽的潜在活性。机器学习方法的发展促进了药物发现中活性肽的鉴定。机器学习方法，包括支持向量机、随机森林、人工神经网络等，已被广泛应用于开发针对肽活性的预测模型（图2-1）。近年来，深度学习作为一种新的、有效的方法被引入药物发现，进一步促进了机器学习的发展，是有效的加速小分子药物发现的计算方法。作为经济的方法，基于机器学习的方法在识别新的潜在肽方面得到了广泛的关注。


    在过去的几年里，许多基于多肽的数据库和基于机器学习的网络服务器已经出现，用于多肽活性的预测。随着肽段数量的急剧增加，处理大量分散的数据是一项具有挑战性的任务。总的来说，许多多肽及其相关信息，如序列和活性，都是分散的。基于多肽的生物信息学资源可以促进各种肽的管理、搜索和挖掘，进一步加快多肽药物预测和设计模型的构建。因此，有必要构建高质量的肽基数据库来识别活性肽。


    ![](Images/figure_0042_0017.jpg)


    图2-1　卷积神经网络筛选抗菌肽


    一般来说，构建基于机器学习的肽预测模型的过程包括4个不同的部分：数据收集、数据描述、模型构建和模型评估。最重要的步骤是收集高质量的实验数据，如下列数据库。


    Peptaibol数据库包含非常规的肽类，被称为肽阀类，其特征是存在一种不寻常的氨基酸，一种氨基异丁酸和一种C端羟基化氨基酸。在该数据库中，只有10个结构条目。通过构建隐藏的Markov模型，建立了AMPer数据库，可以识别单独的抗菌肽，如防御素和抗菌肽。AMPer数据库包含1050个成熟肽和255个前肽。隐藏的Markov模型的高精度，使用户能够有效地识别新的抗菌肽作为候选药物。


    防御素知识库是一个集中于防御素家族的数据库，是目前最大且研究广泛的数据库之一。数据库提供了超过360条单独的记录，其中包括来自蛋白质数据库的64个实验确定的三维结构。此外，该数据库还提供了脊椎动物、无脊椎动物和植物等360种防御素的详细序列、结构和活动信息。


    作为一个环状蛋白的数据库，CyBase致力于提供环状主链蛋白的序列、结构和功能数据，其中包含260个蛋白序列、50个核酸序列、40个结构和95个活性相关条目。与传统蛋白相比，环状蛋白似乎具有更好的稳定性和更强的结合亲和力。此外，CyBase提供了一系列的工具，可以应用于可视化、分析、表征和工程循环蛋白。


    PhytAMP数据库从UniProt数据库和其他研究中收集了270个抗菌植物肽的详细信息。它包含的信息包括分类学、微生物学和物理化学数据等。此外，用户可以预测肽的结构或功能关系，并预测目标生物体，快速利用植物肽的生物活性。


    微生物肽数据库从NCBI数据库中收集了3800多条抗菌序列，将其分割为实验验证数据集和预测数据集。实验验证的数据集通常被应用于构建预测工具，通过使用机器学习的方法来识别。微生物肽数据库的数据源已经扩展到UniProtKB和PDB数据库，达到10240多个抗菌肽序列，其中包括4900多个实验验证序列和5400多个预测序列。通过分析实验研究的抗菌肽，还生成了50个抗菌肽家族的家族特异性序列签名。与其他抗菌肽数据库相比，微生物肽数据库提供了真核生物和原核生物抗菌肽的家族特异性的详细信息。


    YADAMP数据库整合了来自所有可用生物来源的综合抗菌肽，包括植物、动物和人类。它明确地揭示了肽对最常见的菌株的抗菌活性。YADAMP还包含数量最多的序列，其中大部分被证明对细菌具有抗菌活性。研究人员可以利用YADAMP中的数据来建立定量的构效关系模型。


    通常，在训练分类模型之前，将准备两个数据集，包括一个正数据集和一个负数据集。为了将数据的化学结构描述为数字特征，将使用两种常见的描述方法，即分子描述符和分子指纹，它们可以通过机器学习方法进行处理。到目前为止，有许多工具可以用来计算描述符。特征选择是利用一些数理统计数据，然后应用机器学习方法通过相关软件构建分类模型。


    在构建预测模型后，将计算性能指标，包括真阳性、真阴性、假阳性和假阴性。同时，通过以下方程得到灵敏度、特异性、精度等相关系数指标，并计算接收机工作特性曲线下的面积（AUC），以评价模型的性能。AUC值的范围从0到1，完美的分类器为AUC=1.0，而AUC=0.5时，分类器没有鉴别能力。


    抗炎肽和抗癌肽也是多肽药物的重要组成部分。与小分子相比，抗炎肽因其高特异性和最小的毒性而显示出更多的潜在治疗价值。至于抗癌肽，先前的研究已经表明，它们可以选择性地杀死癌细胞，以实现抗癌肽和癌细胞膜之间的静电相互作用。经过Pubmed的系统搜索发现，有一些关于抗炎肽和抗癌肽的预测工具被报道。


    印度Bhopal研究所系统生物学组开发了预测模型，利用支持向量机和随机森林方法来区分抗炎肽和非抗炎肽。基于三肽组成的混合支持向量机混合模型在10倍交叉验证中准确率为78%，MCC值为0.57。随机森林模型的性能优于支持向量机模型，准确率为80.0%，MCC值为0.59。然而，支持向量机模型在验证集上的准确性和MCC值分别为72%和0.45，均高于随机森林模型。因此，选择支持向量机模型作为默认模型，并选择随机森林模型作为附加选项。


    IL-10pred，构建了用于预测潜在的白细胞介素10诱导肽的模拟。白细胞介素10是一种重要的细胞因子，它能够抑制炎症反应，缓解自身免疫性疾病，延长移植物存活。该服务器基于二肽组成的随机森林算法开发，准确率和MCC值最高，分别为81.2%和0.60。


    AIPPred是最近开发的一个Web服务器，它专注于识别潜在的抗炎肽候选。在抗炎肽预测的过程中，采用极端随机树、支持向量机和随机森林方法结合所选择的最优特征构建分类器。AIPPRed在独立数据集中的AUC值达到0.814，比现有的抗炎方法和其他3种方法具有更好的性能。AIPPred有利于抗炎肽的大规模预测，并促进抗炎肽研究的发展。


    除了相关的数据库和预测工具外，仍有许多基于机器学习的计算研究，可以用来预测多肽的活性，尽管这些模型还没有集成到Web服务器上。此外，机器学习方法也与其他方法相结合，以提高多肽活性的预测能力。例如，自适应神经模糊推理系统模型，可以用来预测模式识别的抗菌肽。作为一种混合方法，其集成了神经网络方法和模糊推理系统，可以提高分类模型的性能。


    此外，将机器学习方法与基因编程相结合，可以提高对抗菌肽的识别。例如EFC-FCBF方法，通过构建并选择更好的基于序列特征，来进一步识别抗菌肽，然后利用逻辑回归方法建立预测模型。EFC-FCBF方法是表现最好的方法之一，为科研人员提供了一个全新的设计抗菌活性多肽思路。


    通过回归模型预测的抗菌肽与实验验证结果一致性较高。基于三维描述符的思路，与以往使用传统的1D或2D描述符如AAC、PCP等开发的研究不同。总的来说，机器学习方法极大地促进了多肽的活性预测过程。


    多肽的计算资源，以及策略，如机器学习技术，在开发肽药物中发挥着关键作用。近年来，这一领域的进展极大地促进了对各种疾病的活性多肽的鉴定。然而，它仍面临着进一步发展的挑战。


    首先，用不同标准建立不同的多肽数据库，以不同的截断点来定义一个活性肽。其次，一些数据库不能提供多肽的详细结构信息，这使结合来自不同数据集的数据来开发分类模型变得困难。在未来，科学家们应该通过建立一些通用的规则，整合更广泛的数据源，来开发一个全面的数据库。


    同时，从实验验证的非活性化合物中提取的高质量的负数据，可以提高基于机器学习的模型的性能。迄今为止，由于文献报道有限，很少有多肽数据库涵盖这类数据。我们应该鼓励科学家建立一个具有阴性肽的非活性肽数据库，该数据库应包含从已发表的论文或高通量筛选中验证出的任何无生物活性多肽。


    此外，肽活性预测模型的性能，应该在权威的基准数据集上进行评估。目前，还没有建立这样的基准数据集，以用于对基于多肽的预测模型进行系统评估，它有待于在未来进行开发。


    分类模型的预测精度，取决于训练集和测试集中大而多样的化合物。对于每个模型，都应该定义其模型应用领域。然而，大多数报道的肽活性模型忽略了这个问题。事实上，预测一个特定模型应用领域之外的多肽活性，是没有意义的。


    与有机小分子相比，选择合适的分子描述符，来代表肽的特征是一项具有挑战性的任务，因为肽有更复杂的特征，如肽的多个手性原子。此外，由于预测缺乏详细的生物学或分子机制，大多数机器学习模型都像“摸象”一样。整合描述符可以呈现配符-蛋白质相互作用，可能为理解预测的详细分子机制提供一个见解。


    最后，基于机器学习的模型可能会面临“过拟合”的高风险。避免“过拟合”风险的一种有效方法是，模型应该使用更相关的特性开发模型，并通过外部验证集进行验证。近年来，深度学习技术或组合分类器在合理发现药物方面显示出了巨大的前景，如预测药物-靶点相互作用和药物诱导的毒性。用深度学习算法或组合分类器替代传统的机器学习方法可以进一步提高精度。


    ## 2.3　蛋白质毒性预测


    研究人员不只关注靶向药物传递系统，同时对开发活性肽疗法，也投入了大量工作。这背后的主要想法是锚定受体的特性，以开发基于多肽的治疗方法。由于这些大分子和小分子相比具有不同的物理化学性质，它们成为治疗疾病的一个重要领域。为此，机器学习和人工智能的应用，已经开发了各种计算模型来推测蛋白质结构。通过分析蛋白的性质和结构，研究人员旨在讨论一些蛋白质毒性的机制，从中可以得出治疗的启示。


    世界范围内，已经存在许多模型，强调自己是蛋白质大分子毒性预测的最重要模型。它们中很少有能与其他预测蛋白毒性模型相对竞争，并令人信服地给出高性能的准确性结果。它们的基础是相当模糊的，在构建机器学习模型时，在毒物蛋白质组学数据的利用水平上发现了不同的方法。


    计算机技术已经在蛋白质组学和药物设计方面广泛应用，以识别和表征多肽和蛋白质的治疗和毒理学特性。通过将这些技术应用于蛋白质功能预测、酶功能预测、有毒蛋白/肽的鉴定和表征，可以很容易地进行蛋白质组学解析。


    检测活性多肽的毒性，在多肽类药物发现中发挥着不可或缺的作用。然而，它非常耗时，且需要耗费大量人力。为了避免这些限制，计算建模和模拟方法被广泛使用，例如，在药物发现的初步阶段，利用计算方法预测基于蛋白质组学的毒性数据分析。


    近年来，人们对开发活性肽作为潜在候选药物兴趣盎然。多肽已经成为对抗多种疾病的潜在治疗方法，包括癌症、糖尿病和心血管疾病。高特异性、高组织穿透率和相对较低的生产成本，使多肽药物成为可以和小分子与抗体相媲美的治疗方法。


    体内和体外的实验毒理学方法，可以用于评估未知蛋白质或多肽的毒性。现在，由于考虑评估成本、实验动物使用量大等因素，人们更倾向于将分子建模和机器学习等电子技术应用于蛋白质毒性表征预测。此外，与小分子相比，多肽可以很容易地进行修饰。然而，免疫原性、毒性和稳定性是多基础治疗需要面对的主要问题。


    随着多肽合成的发展，现在可以通过结合几种化学修饰来调整多肽的物理化学性质，从而优化多肽的功能，在不损害其药理活性的情况下减少毒性。此外，一些用于多肽毒性预测和蛋白质治疗设计的计算工具已经被开发出来，这有助于对具有预期物理化学特性的治疗肽进行建模和预测分析。


    毒性评价对多肽药物的治疗开发和批准至关重要。“蛋白质毒素”通常被认为是一种特定类型的蛋白质或多肽，作为一种大分子，会对生物机体造成伤害，或通过破坏细胞生长的正常周期损害细胞的功能。这种蛋白质毒素通常在结构上表现出内在的无序性，蛋白质结构的构象变化可能是活细胞或生物体内蛋白质毒性的主要原因。这些毒素是身体生理改变的原因，所以蛋白质毒性是其致病性的根本原因。


    生物大分子是维持身体组织和器官的结构、功能的主要工具，因为它们同小分子相比具有不同的物理化学性质。因此，生物大分子药物成为疾病治疗及诊断的一种重要手段。多年来，几种理解、预测和预防蛋白质对人类和其他生物体的毒性的计算方法已经越来越受到青睐。


    监管机构和制药公司通过评估蛋白质毒性，然后评估蛋白质毒性转化为无毒和功能性的原生状态，关注基于蛋白质的疗法，以应用于治疗多类疾病。神经退行性疾病的主要原因之一是存在蛋白质毒性。大多数神经退行性疾病的患者，如帕金森症、阿尔茨海默病和亨廷顿病等，大多在蛋白质和蛋白质毒性的结构上显示构象畸形，这是其致病的关键机制之一，尽管其病理机制仍是一个有待研究的问题。


    多肽在生物活性、特异性、低生产成本和高渗透率方面优于小分子药物，越来越多的多性多肽被开发出来，治疗自身免疫性疾病、癌症、神经退行性疾病等。同时，为了提高研发效率，多种计算方法被用来设计更好的治疗用多肽，在保留其治疗功能的同时，降低潜在的蛋白质毒性。


    由于成本效益和准确性，研究人员已经开始使用机器学习来预测蛋白质毒性。随机森林、遗传算法和人工神经网络等算法的组合也被用于优化现有的定量结构-毒性关系模型，以预测基于蛋白质的药物的毒性。


    后基因组时代发现的生物序列的爆炸性增长，促进了人工智能方法在基于蛋白质组学的蛋白质、多肽的物理化学、治疗和毒理学特征的预测分析中的适用性的巨大提高。为了及时利用大量的蛋白质组学数据进行肽类药物开发，人们通过各种序列生物信息学工具推断出大量的序列信息，如细胞网络中的蛋白质-药物相互作用、蛋白质-蛋白质相互作用、重组点。


    序列蛋白质组学和结构蛋白质组学的快速发展，产生蛋白质组学的原始数据。为了解决这些蛋白质组学的大数据，机器学习及人工智能等技术的应用，可以及时评估更好的基于多肽的治疗效果，评估其是否具有理想的物理化学特性。


    阐明毒性蛋白质组学大数据，存在很多未解的问题与挑战，迫切需要一个有效的机器学习策略来解决。受人类脑启发，神经网络和深度学习等多种计算方法出现。另外也有寻求更复杂生物学数据的方法，如利用峰值的神经元模型，通过神经连接可塑化结合时间和空间的概念，或更复杂的方法，如带峰值神经元的深度学习方法。这些方法正在有效地应用于化合物筛选和高效物体识别。


    基于上述情况，人工智能及机器学习预测性蛋白质毒性模型的不同方面的几个关键点如下：毒理蛋白质组学数据的整理；用于模型开发的各种人工智能及机器学习方法；将蛋白质毒性预测工具和基于网络的应用程序，用于大分子毒性预测；蛋白质毒性预测模型的性能。


    预测性蛋白质毒性机器学习模型，必须有大量的例子，如蛋白质毒性预测建模数据集，以便分类器算法在收集高质量的蛋白质毒素数据时从中学习。蛋白质毒素在过去的十年中得到了广泛的研究，有很多文献信息。这些信息已经被几个数据库存储、注释，并易于检索，以服务于科学研究。


    （1）蛋白质特征描述。


    蛋白质毒性预测是一个非常复杂的问题，它经常在4个不同的层次上被分解和攻击：蛋白质毒素沿氨基酸一级序列的结构特征的一维预测；利用毒性肽的二级结构对氨基酸之间的空间关系进行二维预测；蛋白质毒素三级结构的三维预测；多蛋白毒素复合物的四级结构的四维预测。


    在毒性蛋白预测分析的机器学习模型的开发过程中，毒性蛋白/肽数据管理是一个重要的部分，蛋白质一级序列形式的原始数据可以通过几个免费的数据库收集，如UniprotKB数据库、蛋白质数据库（PDB）、蛋白质信息资源库等。UniprotKB数据库是免费访问的，并包含高质量的蛋白质治疗信息收集。首先，有毒蛋白的蛋白质序列数据可以从Swiss-Prot中收集，这是UniProtKB的一个回顾子数据库，包含手动注释的蛋白质记录、从文献中提取的信息和管理员评估的计算分析。有关有毒蛋白的数据，可以通过相关的关键字搜索来收集，也可以使用数据库中可用的高级搜索功能，借助手动管理，从数据库中提取信息。


    通过直接从数据库下载，或通过在文本文件中粘贴蛋白质一级序列，手动生成训练文件，可以将蛋白质毒素一级序列数据集的形式保存为FASTA文件。由蛋白毒素一级序列组成的FASTA文件需要对数据进行清理和预处理，然后进行下一个机器学习模型开发步骤，即特征向量提取，或从有毒蛋白序列中合成数值向量。


    蛋白质或肽的毒性通常以其二级结构为特征，其中最典型的特征是几何规则的α螺旋和β折叠；不规则的结构模式，如“转弯”和“环”还不太清楚。基于这些二级结构参数，可以通过应用机器学习技术来分析蛋白质结构的毒性特性。


    为了使用DSSP程序提取二级结构特征，可以使用蛋白质毒素晶体结构的PDB文件作为输入。PDB文件提供了α-C原子的坐标，这些坐标可以勾勒出整个有毒蛋白质最大的三维形状。毒性蛋白质的结构数据可以从PDB中获得。


    PDB文件或蛋白质晶体结构的三维信息，可以用于基于机器学习的预测模型的开发，但毒物蛋白质组机器学习模型的开发还不够，因此需要科学家做更多的关注和努力。毒性蛋白质或多肽的理化学性质，在得到实验方法的支持下，可以用来建立一个机器学习模型来预测未知蛋白质的毒性性质。


    在收集了与目标研究目标相关的毒物蛋白质组学数据后，下一步是细化收集到的数据，即进一步进行机器学习和神经网络建模所必需的预处理任务。


    对于机器学习模型的开发，应该确保数据集是多样化的，同时应该具有更少的冗余数据。为了将不相关的数据从数据集中分离出来，数据预处理和数据转换，可以通过不同的方法进行，即对蛋白质序列或蛋白质结构数据进行过滤和排序，验证蛋白质序列转录水平的实验证据，通过各种可视化工具进行晶体结构可视化，如PyMol，以确认各种二级结构的存在，如α螺旋和β折叠，从不同的来源提取不同文件格式的序列及结构数据，然后处理文件，以使存储数据文件保持一致性，并进一步确保在使用编码环境时，处理数据文件的便利性。


    在开发毒性预测的预测模型时，蛋白质序列不能直接作为机器算法的输入来训练或验证模型。因此，如果序列或序列中随片段一起存在模糊的氨基酸，它将在训练或测试数据集中作为变量的描述符中表示。因此，细化数据可以直接影响性能，而不是模型优化，这是其中一项关键的任务。


    在处理有毒蛋白的三维结构时，可以使用诸如分辨率比、过滤掉理论模型更差或更好的标准。基于图像的深度学习算法，具有独特的结合特征提取和分类阶段的结构，也被部署用于预测蛋白质功能，因此在使用基于图像的蛋白质结构、功能、毒性预测等预测模型时，所有的三维蛋白质结构，也需要转换为可以作为神经网络输入的格式。


    蛋白质或多肽特征，是以数值特征向量的形式，可作为设计预测模型的输入所需的关键元素。蛋白质或多肽特征，可称为氨基酸的组成、蛋白质二级及三级结构的结构特征组合，以及以数值向量形式编码的蛋白质的物理化学特征。在机器学习中使用的算法通常需要数值特征，来开发一个合适的模型。


    现已有多种技术广泛用于以文本格式表示每个氨基酸。为了考虑到氨基酸残基的耦合和特定序列中的局部序效应，可以使用双肽组成。双肽组成是一个二肽的分数除以给定蛋白质序列中可能的二肽总数。这就产生了一个400维的训练向量。为了从有毒蛋白序列中提取双肽组成，可以使用PyFeat、PseAAC等工具。'
  fmt: '

    # 多肽活性预测与蛋白质毒性预测


    不考虑修饰肽的情况，`DeepMSPeptide`是一种通用的方法，除了包含这类氨基酸的训练数据集外，还将修饰肽作为新的整数，这将使它们的可检测性预测成为可能。


    ## 2.2 多肽活性预测


    一般来说，对新肽的实验评价是昂贵和耗时的。因此，有必要发展计算方法来预测多肽的潜在活性。机器学习方法的发展促进了药物发现中活性肽的鉴定。机器学习方法，包括支持向量机、随机森林、人工神经网络等，已被广泛应用于开发针对肽活性的预测模型（图2-1）。近年来，深度学习作为一种新的、有效的方法被引入药物发现，进一步促进了机器学习的发展，是有效的加速小分子药物发现的计算方法。作为经济的方法，基于机器学习的方法在识别新的潜在肽方面得到了广泛的关注。


    在过去的几年里，许多基于多肽的数据库和基于机器学习的网络服务器已经出现，用于多肽活性的预测。随着肽段数量的急剧增加，处理大量分散的数据是一项具有挑战性的任务。总的来说，许多多肽及其相关信息，如序列和活性，都是分散的。基于多肽的生物信息学资源可以促进各种肽的管理、搜索和挖掘，进一步加快多肽药物预测和设计模型的构建。因此，有必要构建高质量的肽基数据库来识别活性肽。


    ![](Images/figure_0042_0017.jpg)


    图2-1 卷积神经网络筛选抗菌肽


    一般来说，构建基于机器学习的肽预测模型的过程包括4个不同的部分：数据收集、数据描述、模型构建和模型评估。最重要的步骤是收集高质量的实验数据，如下列数据库。


    `Peptaibol`数据库包含非常规的肽类，被称为肽阀类，其特征是存在一种不寻常的氨基酸，一种氨基异丁酸和一种C端羟基化氨基酸。在该数据库中，只有10个结构条目。通过构建隐藏的`Markov`模型，建立了`AMPer`数据库，可以识别单独的抗菌肽，如防御素和抗菌肽。`AMPer`数据库包含1050个成熟肽和255个前肽。隐藏的`Markov`模型的高精度，使用户能够有效地识别新的抗菌肽作为候选药物。


    防御素知识库是一个集中于防御素家族的数据库，是目前最大且研究广泛的数据库之一。数据库提供了超过360条单独的记录，其中包括来自蛋白质数据库的64个实验确定的三维结构。此外，该数据库还提供了脊椎动物、无脊椎动物和植物等360种防御素的详细序列、结构和活动信息。


    作为一个环状蛋白的数据库，`CyBase`致力于提供环状主链蛋白的序列、结构和功能数据，其中包含260个蛋白序列、50个核酸序列、40个结构和95个活性相关条目。与传统蛋白相比，环状蛋白似乎具有更好的稳定性和更强的结合亲和力。此外，`CyBase`提供了一系列的工具，可以应用于可视化、分析、表征和工程循环蛋白。


    `PhytAMP`数据库从`UniProt`数据库和其他研究中收集了270个抗菌植物肽的详细信息。它包含的信息包括分类学、微生物学和物理化学数据等。此外，用户可以预测肽的结构或功能关系，并预测目标生物体，快速利用植物肽的生物活性。


    微生物肽数据库从`NCBI`数据库中收集了3800多条抗菌序列，将其分割为实验验证数据集和预测数据集。实验验证的数据集通常被应用于构建预测工具，通过使用机器学习的方法来识别。微生物肽数据库的数据源已经扩展到`UniProtKB`和`PDB`数据库，达到10240多个抗菌肽序列，其中包括4900多个实验验证序列和5400多个预测序列。通过分析实验研究的抗菌肽，还生成了50个抗菌肽家族的家族特异性序列签名。与其他抗菌肽数据库相比，微生物肽数据库提供了真核生物和原核生物抗菌肽的家族特异性的详细信息。


    `YADAMP`数据库整合了来自所有可用生物来源的综合抗菌肽，包括植物、动物和人类。它明确地揭示了肽对最常见的菌株的抗菌活性。`YADAMP`还包含数量最多的序列，其中大部分被证明对细菌具有抗菌活性。研究人员可以利用`YADAMP`中的数据来建立定量的构效关系模型。


    通常，在训练分类模型之前，将准备两个数据集，包括一个正数据集和一个负数据集。为了将数据的化学结构描述为数字特征，将使用两种常见的描述方法，即分子描述符和分子指纹，它们可以通过机器学习方法进行处理。到目前为止，有许多工具可以用来计算描述符。特征选择是利用一些数理统计数据，然后应用机器学习方法通过相关软件构建分类模型。


    在构建预测模型后，将计算性能指标，包括真阳性、真阴性、假阳性和假阴性。同时，通过以下方程得到灵敏度、特异性、精度等相关系数指标，并计算接收机工作特性曲线下的面积（`AUC`），以评价模型的性能。`AUC`值的范围从0到1，完美的分类器为`AUC=1.0`，而`AUC=0.5`时，分类器没有鉴别能力。


    抗炎肽和抗癌肽也是多肽药物的重要组成部分。与小分子相比，抗炎肽因其高特异性和最小的毒性而显示出更多的潜在治疗价值。至于抗癌肽，先前的研究已经表明，它们可以选择性地杀死癌细胞，以实现抗癌肽和癌细胞膜之间的静电相互作用。经过`Pubmed`的系统搜索发现，有一些关于抗炎肽和抗癌肽的预测工具被报道。


    印度Bhopal研究所系统生物学组开发了预测模型，利用支持向量机和随机森林方法来区分抗炎肽和非抗炎肽。基于三肽组成的混合支持向量机混合模型在10倍交叉验证中准确率为78%，`MCC`值为0.57。随机森林模型的性能优于支持向量机模型，准确率为80.0%，`MCC`值为0.59。然而，支持向量机模型在验证集上的准确性和`MCC`值分别为72%和0.45，均高于随机森林模型。因此，选择支持向量机模型作为默认模型，并选择随机森林模型作为附加选项。


    `IL-10pred`，构建了用于预测潜在的白细胞介素10诱导肽的模拟。白细胞介素10是一种重要的细胞因子，它能够抑制炎症反应，缓解自身免疫性疾病，延长移植物存活。该服务器基于二肽组成的随机森林算法开发，准确率和`MCC`值最高，分别为81.2%和0.60。


    `AIPPred`是最近开发的一个Web服务器，它专注于识别潜在的抗炎肽候选。在抗炎肽预测的过程中，采用极端随机树、支持向量机和随机森林方法结合所选择的最优特征构建分类器。`AIPPRed`在独立数据集中的`AUC`值达到0.814，比现有的抗炎方法和其他3种方法具有更好的性能。`AIPPred`有利于抗炎肽的大规模预测，并促进抗炎肽研究的发展。


    除了相关的数据库和预测工具外，仍有许多基于机器学习的计算研究，可以用来预测多肽的活性，尽管这些模型还没有集成到Web服务器上。此外，机器学习方法也与其他方法相结合，以提高多肽活性的预测能力。例如，自适应神经模糊推理系统模型，可以用来预测模式识别的抗菌肽。作为一种混合方法，其集成了神经网络方法和模糊推理系统，可以提高分类模型的性能。


    此外，将机器学习方法与基因编程相结合，可以提高对抗菌肽的识别。例如`EFC-FCBF`方法，通过构建并选择更好的基于序列特征，来进一步识别抗菌肽，然后利用逻辑回归方法建立预测模型。`EFC-FCBF`方法是表现最好的方法之一，为科研人员提供了一个全新的设计抗菌活性多肽思路。


    通过回归模型预测的抗菌肽与实验验证结果一致性较高。基于三维描述符的思路，与以往使用传统的`1D`或`2D`描述符如`AAC`、`PCP`等开发的研究不同。总的来说，机器学习方法极大地促进了多肽的活性预测过程。


    多肽的计算资源，以及策略，如机器学习技术，在开发肽药物中发挥着关键作用。近年来，这一领域的进展极大地促进了对各种疾病的活性多肽的鉴定。然而，它仍面临着进一步发展的挑战。


    首先，用不同标准建立不同的多肽数据库，以不同的截断点来定义一个活性肽。其次，一些数据库不能提供多肽的详细结构信息，这使结合来自不同数据集的数据来开发分类模型变得困难。在未来，科学家们应该通过建立一些通用的规则，整合更广泛的数据源，来开发一个全面的数据库。


    同时，从实验验证的非活性化合物中提取的高质量的负数据，可以提高基于机器学习的模型的性能。迄今为止，由于文献报道有限，很少有多肽数据库涵盖这类数据。我们应该鼓励科学家建立一个具有阴性肽的非活性肽数据库，该数据库应包含从已发表的论文或高通量筛选中验证出的任何无生物活性多肽。


    此外，肽活性预测模型的性能，应该在权威的基准数据集上进行评估。目前，还没有建立这样的基准数据集，以用于对基于多肽的预测模型进行系统评估，它有待于在未来进行开发。


    分类模型的预测精度，取决于训练集和测试集中大而多样的化合物。对于每个模型，都应该定义其模型应用领域。然而，大多数报道的肽活性模型忽略了这个问题。事实上，预测一个特定模型应用领域之外的多肽活性，是没有意义的。


    与有机小分子相比，选择合适的分子描述符，来代表肽的特征是一项具有挑战性的任务，因为肽有更复杂的特征，如肽的多个手性原子。此外，由于预测缺乏详细的生物学或分子机制，大多数机器学习模型都像“摸象”一样。整合描述符可以呈现配符-蛋白质相互作用，可能为理解预测的详细分子机制提供一个见解。


    最后，基于机器学习的模型可能会面临“过拟合”的高风险。避免“过拟合”风险的一种有效方法是，模型应该使用更相关的特性开发模型，并通过外部验证集进行验证。近年来，深度学习技术或组合分类器在合理发现药物方面显示出了巨大的前景，如预测药物-靶点相互作用和药物诱导的毒性。用深度学习算法或组合分类器替代传统的机器学习方法可以进一步提高精度。


    ## 2.3 蛋白质毒性预测


    研究人员不只关注靶向药物传递系统，同时对开发活性肽疗法，也投入了大量工作。这背后的主要想法是锚定受体的特性，以开发基于多肽的治疗方法。由于这些大分子和小分子相比具有不同的物理化学性质，它们成为治疗疾病的一个重要领域。为此，机器学习和人工智能的应用，已经开发了各种计算模型来推测蛋白质结构。通过分析蛋白的性质和结构，研究人员旨在讨论一些蛋白质毒性的机制，从中可以得出治疗的启示。


    世界范围内，已经存在许多模型，强调自己是蛋白质大分子毒性预测的最重要模型。它们中很少有能与其他预测蛋白毒性模型相对竞争，并令人信服地给出高性能的准确性结果。它们的基础是相当模糊的，在构建机器学习模型时，在毒物蛋白质组数据的利用水平上发现了不同的方法。


    计算机技术已经在蛋白质组学和药物设计方面广泛应用，以识别和表征多肽和蛋白质的治疗和毒理学特性。通过将这些技术应用于蛋白质功能预测、酶功能预测、有毒蛋白/肽的鉴定和表征，可以很容易地进行蛋白质组学解析。


    检测活性多肽的毒性，在多肽类药物发现中发挥着不可或缺的作用。然而，它非常耗时，且需要耗费大量人力。为了避免这些限制，计算建模和模拟方法被广泛使用，例如，在药物发现的初步阶段，利用计算方法预测基于蛋白质组学的毒性数据分析。


    近年来，人们对开发活性肽作为潜在候选药物兴趣盎然。多肽已经成为对抗多种疾病的潜在治疗方法，包括癌症、糖尿病和心血管疾病。高特异性、高组织穿透率和相对较低的生产成本，使多肽药物成为可以和小分子与抗体相媲美的治疗方法。


    体内和体外的实验毒理学方法，可以用于评估未知蛋白质或多肽的毒性。现在，由于考虑评估成本、实验动物使用量大等因素，人们更倾向于将分子建模和机器学习等电子技术应用于蛋白质毒性表征预测。此外，与小分子相比，多肽可以很容易地进行修饰。然而，免疫原性、毒性和稳定性是多基础治疗需要面对的主要问题。


    随着多肽合成的发展，现在可以通过结合几种化学修饰来调整多肽的物理化学性质，从而优化多肽的功能，在不损害其药理活性的情况下减少毒性。此外，一些用于多肽毒性预测和蛋白质治疗设计的计算工具已经被开发出来，这有助于对具有预期物理化学特性的治疗肽进行建模和预测分析。


    毒性评价对多肽药物的治疗开发和批准至关重要。“蛋白质毒素”通常被认为是一种特定类型的蛋白质或多肽，作为一种大分子，会对生物机体造成伤害，或通过破坏细胞生长的正常周期损害细胞的功能。这种蛋白质毒素通常在结构上表现出内在的无序性，蛋白质结构的构象变化可能是活细胞或生物体内蛋白质毒性的主要原因。这些毒素是身体生理改变的原因，所以蛋白质毒性是其致病性的根本原因。


    生物大分子是维持身体组织和器官的结构、功能的主要工具，因为它们同小分子相比具有不同的物理化学性质。因此，生物大分子药物成为疾病治疗及诊断的一种重要手段。多年来，几种理解、预测和预防蛋白质对人类和其他生物体的毒性的计算方法已经越来越受到青睐。


    监管机构和制药公司通过评估蛋白质毒性，然后评估蛋白质毒性转化为无毒和功能性的原生状态，关注基于蛋白质的疗法，以应用于治疗多类疾病。神经退行性疾病的主要原因之一是存在蛋白质毒性。大多数神经退行性疾病的患者，如帕金森症、阿尔茨海默病和亨廷顿病等，大多在蛋白质和蛋白质毒性的结构上显示构象畸形，这是其致病的关键机制之一，尽管其病理机制仍是一个有待研究的问题。


    多肽在生物活性、特异性、低生产成本和高渗透率方面优于小分子药物，越来越多的多性多肽被开发出来，治疗自身免疫性疾病、癌症、神经退行性疾病等。同时，为了提高研发效率，多种计算方法被用来设计更好的治疗用多肽，在保留其治疗功能的同时，降低潜在的蛋白质毒性。


    由于成本效益和准确性，研究人员已经开始使用机器学习来预测蛋白质毒性。随机森林、遗传算法和人工神经网络等算法的组合也被用于优化现有的定量结构-毒性关系模型，以预测基于蛋白质的药物的毒性。


    后基因组时代发现的生物序列的爆炸性增长，促进了人工智能方法在基于蛋白质组学的蛋白质、多肽的物理化学、治疗和毒理学特征的预测分析中的适用性的巨大提高。为了及时利用大量的蛋白质组学数据进行肽类药物开发，人们通过各种序列生物信息学工具推断出大量的序列信息，如细胞网络中的蛋白质-药物相互作用、蛋白质-蛋白质相互作用、重组点。


    序列蛋白质组学和结构蛋白质组学的快速发展，产生蛋白质组学的原始数据。为了解决这些蛋白质组学的大数据，机器学习及人工智能等技术的应用，可以及时评估更好的基于多肽的治疗效果，评估其是否具有理想的物理化学特性。


    阐明毒性蛋白质组学大数据，存在很多未解的问题与挑战，迫切需要一个有效的机器学习策略来解决。受人类脑启发，神经网络和深度学习等多种计算方法出现。另外也有寻求更复杂生物学数据的方法，如利用峰值的神经元模型，通过神经连接可塑化结合时间和空间的概念，或更复杂的方法，如带峰值神经元的深度学习方法。这些方法正在有效地应用于化合物筛选和高效物体识别。


    基于上述情况，人工智能及机器学习预测性蛋白质毒性模型的不同方面的几个关键点如下：毒理蛋白质组学数据的整理；用于模型开发的各种人工智能及机器学习方法；将蛋白质毒性预测工具和基于网络的应用程序，用于大分子毒性预测；蛋白质毒性预测模型的性能。


    预测性蛋白质毒性机器学习模型，必须有大量的例子，如蛋白质毒性预测建模数据集，以便分类器算法在收集高质量的蛋白质毒素数据时从中学习。蛋白质毒素在过去的十年中得到了广泛的研究，有很多文献信息。这些信息已经被几个数据库存储、注释，并易于检索，以服务于科学研究。


    ### 蛋白质特征描述


    蛋白质毒性预测是一个非常复杂的问题，它经常在4个不同的层次上被分解和攻击：蛋白质毒素沿氨基酸一级序列的结构特征的一维预测；利用毒性肽的二级结构对氨基酸之间的空间关系进行二维预测；蛋白质毒素三级结构的三维预测；多蛋白毒素复合物的四级结构的四维预测。


    在毒性蛋白预测分析的机器学习模型的开发过程中，毒性蛋白/肽数据管理是一个重要的部分，蛋白质一级序列形式的原始数据可以通过几个免费的数据库收集，如`UniprotKB`数据库、`蛋白质数据库（PDB）`、`蛋白质信息资源库`等。`UniprotKB`数据库是免费访问的，并包含高质量的蛋白质治疗信息收集。首先，有毒蛋白的蛋白质序列数据可以从`Swiss-Prot`中收集，这是`UniProtKB`的一个回顾子数据库，包含手动注释的蛋白质记录、从文献中提取的信息和管理员评估的计算分析。有关有毒蛋白的数据，可以通过相关的关键字搜索来收集，也可以使用数据库中可用的高级搜索功能，借助手动管理，从数据库中提取信息。


    通过直接从数据库下载，或通过在文本文件中粘贴蛋白质一级序列，手动生成训练文件，可以将蛋白质毒素一级序列数据集的形式保存为`FASTA`文件。由蛋白毒素一级序列组成的`FASTA`文件需要对数据进行清理和预处理，然后进行下一个机器学习模型开发步骤，即特征向量提取，或从有毒蛋白序列中合成数值向量。


    蛋白质或肽的毒性通常以其二级结构为特征，其中最典型的特征是几何规则的α螺旋和β折叠；不规则的结构模式，如“转弯”和“环”还不太清楚。基于这些二级结构参数，可以通过应用机器学习技术来分析蛋白质结构的毒性特性。


    为了使用`DSSP`程序提取二级结构特征，可以使用蛋白质毒素晶体结构的`PDB`文件作为输入。`PDB`文件提供了α-C原子的坐标，这些坐标可以勾勒出整个有毒蛋白质最大的三维形状。毒性蛋白质的结构数据可以从`PDB`中获得。


    `PDB`文件或蛋白质晶体结构的三维信息，可以用于基于机器学习的预测模型的开发，但毒物蛋白质组机器学习模型的开发还不够，因此需要科学家做更多的关注和努力。毒性蛋白质或多肽的理化学性质，在得到实验方法的支持下，可以用来建立一个机器学习模型来预测未知蛋白质的毒性性质。


    在收集了与目标研究目标相关的毒物蛋白质组学数据后，下一步是细化收集到的数据，即进一步进行机器学习和神经网络建模所必需的预处理任务。


    对于机器学习模型的开发，应该确保数据集是多样化的，同时应该具有更少的冗余数据。为了将不相关的数据从数据集中分离出来，数据预处理和数据转换，可以通过不同的方法进行，即对蛋白质序列或蛋白质结构数据进行过滤和排序，验证蛋白质序列转录水平的实验证据，通过各种可视化工具进行晶体结构可视化，如`PyMol`，以确认各种二级结构的存在，如α螺旋和β折叠，从不同的来源提取不同文件格式的序列及结构数据，然后处理文件，以使存储数据文件保持一致性，并进一步确保在使用编码环境时，处理数据文件的便利性。


    在开发毒性预测的预测模型时，蛋白质序列不能直接作为机器算法的输入来训练或验证模型。因此，如果序列或序列中随片段一起存在模糊的氨基酸，它将在训练或测试数据集中作为变量的描述符中表示。因此，细化数据可以直接影响性能，而不是模型优化，这是其中一项关键的任务。


    在处理有毒蛋白的三维结构时，可以使用诸如分辨率比、过滤掉理论模型更差或更好的标准。基于图像的深度学习算法，具有独特的结合特征提取和分类阶段的结构，也被部署用于预测蛋白质功能，因此在使用基于图像的蛋白质结构、功能、毒性预测等预测模型时，所有的三维蛋白质结构，也需要转换为可以作为神经网络输入的格式。


    蛋白质或多肽特征，是以数值特征向量的形式，可作为设计预测模型的输入所需的关键元素。蛋白质或多肽特征，可称为氨基酸的组成、蛋白质二级及三级结构的结构特征组合，以及以数值向量形式编码的蛋白质的物理化学特征。在机器学习中使用的算法通常需要数值特征，来开发一个合适的模型。


    现已有多种技术广泛用于以文本格式表示每个氨基酸。为了考虑到氨基酸残基的耦合和特定序列中的局部序效应，可以使用双肽组成。双肽组成是一个二肽的分数除以给定蛋白质序列中可能的二肽总数。这就产生了一个400维的训练向量。为了从有毒蛋白序列中提取双肽组成，可以使用`PyFeat`、`PseAAC`等工具。

