- raw: "人工神经网络是适应性很强，能够表示各种形式和复杂性的线性和非线性函数。局限性包括需要参数调整和无法解释神经网络学习到的概念，这些概念被编码在权重中。\n\
    \n神经网络仅仅是一层排列的人工神经元的集合。人工神经网络自20世纪中叶就开始发展，应用最广泛的人工神经元模型被称为乙状神经元。乙状神经元是一个基本单位，可以被视为生物神经元的模型。因此，乙状神经元接收到的1个或更多的加权输入，决定了神经元在多大程度上被激活。\n\
    \n每个神经网络都包含一些节点（类似于细胞体），这些节点通过连接（类似于轴突和树突）与其他节点进行通信。当神经元之间的突触在生物神经网络中有关联输出时会增强（赫比安理论假定，“神经一起燃烧，连接在一起”），神经网络中节点之间的连接是根据它们提供期望结果的能力来加权的。\n\
    \n![](Images/figure_0026_0013.jpg)\n\n图1-11　人工神经网络的结构\n\n一个人工神经网络有1个输入层、可选的隐藏层和1个输出层。一层的单个神经元都与下一层的每个单神经元相连，因此，这种网络被称为全连接的神经网络。每层神经元的最佳数量，以及每层神经网络的最佳层数，是根据经验确定的。\n\
    \n在人工神经网络用于实际目的之前，必须进行训练。训练的第一步是为网络选择一个合适的架构，必须选择足够数量的单一隐藏层，和适当数量的神经元。第二步与数据收集和组织有关。训练神经网络所需的数据量与网络的大小成正比。此外，由于技术原因，每一块数据只能贡献学习过程中的非常小的一部分。因此，数据集通常由几十万项组成。数据必须随机分为训练批和测试批。前者用于网络训练，后者允许在培训完成时评估网络的性能。\n\
    \n在学习步骤中，人工神经网络逐步将其输入的输入值映射到相应的输出值。为了实现这样的映射，神经网络必须充分设置构成它的所有神经元的所有权重。该过程使用许多可用的训练算法之一自动执行，例如具有反向传播的梯度下降算法。经过适当的训练后，当神经网络的输入神经元得到适当的值时，神经网络的每个输出神经元将提供一个相关的输出值。\n\
    \n多种学习技术可以用于训练人工神经网络，例如，梯度下降算法包括随机梯度下降和反向传播。反向传播，是指返回模型输出的计算误差的分布，将总网络误差的一部分，分配给每个神经元，并使梯度下降算法能够找到更好的解决方案，即底层函数的近似问题。误差反向传播主要用于监督学习任务，因为它需要目标输出值来计算误差，尽管它也适用于量化或构造误差，使其能够用于自动编码器等架构。\n\
    \n当使用训练过的人工神经网络时，信息从网络的输入层流到输出层，某一层的每个神经元的输出成为下一层神经元的输入之一。这种对信息的处理被称为正向传递。\n\n\
    人工神经网络很受欢迎，是因为它对近似函数非常有效。函数是与一个称为域的集合中的每个元素关联的关系，域是另一个称为协域的集合中的唯一元素。这个普遍的近似定理，证明了任何具有适当体系结构的前馈神经网络，都可以近似任何函数，包括复杂的非线性函数。\n\
    \n基于通用近似定理，利用人工神经网络来逼近分类问题中取离散值的函数。人工神经网络还可以预测连续函数的价值，使其成为很好的回归分析工具。在实践中，人工神经网络通常是近似复杂非线性函数的最佳选择。然而，更简单的线性回归模型仍应用于估计简单函数，因为它们需要更少的计算资源，并且更稳健。\n\
    \n人工神经网络有3个主要的局限性：首先，培训人工神经网络需要大量的数据，这可能是对罕见疾病患者使用人工智能的一个限制因素；其次，神经网络需要良好的预测因子来正确地近似函数，换言之，网络需要提供与函数密切相关的可测量数据来进行分析；最后，训练神经网络，特别是中枢神经网络，需要大量的计算资源。\n\
    \n人工神经网络的另一个缺点是，网络的输入和输出通常可以替代临床的情况，以最大限度地提高网络预测和临床情况之间的相关性。这种相关性可能并不总是最优的。因此，当更简单的线性方法不能提供准确的结果时，人工神经网络应该优先用于大型和复杂的数据集。\n\
    \n（2）深度学习。\n\n深度学习的概念是在20世纪80年代与人工神经网络一起提出的。然而，当时用于模型开发的数据有限，神经网络并没有比其他机器学习方法显示出显著的优势。从20世纪90年代到21世纪初，计算机硬件仍然不足以支持训练具有多隐藏层的神经网络或超大数据集的模型开发。现今，GPU和云计算的通用，使神经网络建模研究不再受硬件限制。\n\
    \n深度学习是机器学习的一个子领域，在过去几年中出现了戏剧性的复苏，这主要是由于计算能力的提高和大量新数据集的可用性（图1-12）。该领域见证了机器理解和处理数据（包括图像、语言和语音）能力的巨大进步。医疗和药物学从深度学习中受益匪浅，因为生成的数据量巨大，医疗设备和数字记录系统的数量也在不断增加。\n\
    \n![](Images/figure_0028_0014.jpg)\n\n图1-12　深度学习与知识图谱的关系\n\n从历史上看，构建机器学习系统需要领域专业知识来设计特征提取器，将原始数据转换为合适的表示，学习算法可以从中检测。相比之下，深度学习是一种表示学习形式，其中机器被提供原始数据，并开发出模式识别所需的表示，该表示由多层表示组成。这些层通常按顺序排列，并由大量原始非线性运算组成，从而将一层的表示（从原始数据输入开始）输入下一层，并转换为更抽象的表示。当数据流经系统的各个层时，输入空间会反复扭曲，直到数据点变得可区分为止。通过这种方式，可以学习高度复杂的函数。\n\
    \n尽管深度学习似乎是一个新兴的名词，但是它所基于的神经网络模型和数据编程的核心思想人们已经研究了几百年。从古至今，人们一直渴望能够通过数据来预测和分析未来。事实上，数据分析就是大多数自然科学的本质，人类通过发现自然事物中的变化规律，寻找它们的不确定因素，最终推测出与事实相近的结果。其实人们每天观看的天气预报就是通过观测大气的流动，从而计算出未来的天气状况。如何让人类预测的结果更加准确，需要观测到的数据以及数据模型更加精准。同样的道理，如果想让机器识别图片更加精准，就需要对模型（也就是神经网络）进行不断优化，使这个模型能够将误差降到最小。\n\
    \n说到深度学习，就不得不了解一下神经网络，简单来说，神经网络就是模仿人体神经网络创建的一种网络架构。人类的大脑内部有很多神经，人们对这个世界的认知就是依靠神经元的相互作用，人们看到一张照片能分辨出照片中的动物是狗还是猫，看到一段文字能理解文字表达的意思，这都是大脑的神经元在发生作用。历史上，科学家一直希望模拟人的大脑，造出可以思考的机器。人为什么能够思考？科学家发现，原因在于人体的神经网络。\n\
    \n深度学习是一种无监督学习，其源于人工神经网络的研究，含有多个隐藏层的多层感知器就是一种深度学习结构。现在有多种深度学习框架，如深度神经网络、卷积神经网络、深度置信网络和循环神经网络，它们被应用在计算机视觉、语音识别、自然语言处理、音频识别与生物信息学等领域。深度学习使机器模仿视听和思考人类的活动，解决了很多复杂的模式识别难题，使人工智能相关技术取得了很大的进步。\n\
    \n深度学习模型能够扩展到大型数据集，部分原因是它们能够在专门的计算硬件上运行，并随着更多的数据不断改进，使它们能够超越许多经典的机器学习方法。深度学习系统可以接受多种数据类型作为输入，这是医药研究数据的特定技术的一个方面。最常见的模型是使用监督学习进行训练的，其中数据集由输入数据点（如药物靶点识别）和相应的输出数据标签（如“良性”或“一般”）组成。\n\
    \n完全连接的网络被限制在1个或2个隐藏层内。然而，具有更多隐藏层的更深的网络可以更容易地拟合出非常复杂的函数。为了克服浅层神经网络的局限性，引入了一种新的网络模型：用于深度学习的深度神经网络。卷积神经网络是最常用的深度网络模型之一。\n\
    \n基本上，卷积神经网络与完全连接的前馈人工神经网络具有相同的体系结构。然而，人工神经网络中的层没有完全连接。此外，随着网络的深入，卷积神经网络隐藏层中的神经元数量逐渐减少。这些特殊性允许权重总数减少，这反过来极大地减少训练或使用网络所需的计算资源。因此，卷积神经网络可以比人工神经网络更深，并且可以逼近更复杂的函数。\n\
    \n卷积神经网络在分析空间或时间依赖的数据方面特别有效，如图像或声音。因此，卷积神经网络通常是解决图像或语音识别问题的强大方法。它们还能有效地分析大数据。\n\
    \n深度学习的最大成功应用是在计算机视觉领域。计算机视觉专注于静态图像和视频，并处理对象分类、检测和分割等任务，这些任务有助于确定药物分子能否有效结合到作用靶点。\n\
    \n（3）支持向量机。\n\n自从Vapnik提出支持向量机以来，它在过去的10年里受到了许多研究人员的关注。支持向量机是一种非参数最大裕度分类技术，旨在将数据分类为两组，使其适用于两组分类问题（图1-13）。然而，它也被扩展到解决多组分类问题。\n\
    \n![](Images/figure_0029_0015.jpg)\n\n图1-13　支持向量机\n\n支持向量机是一种数据分类技术，属于一种监督学习算法，可用于识别复杂数据集中的细化模式。该算法已应用于文本分类等多种领域。支持向量机从根本上说是一个二进制分类器：给定两类数据，为了进行多类分类，可以使用成对分类。支持向量机学会了区分它们，并预测以前未见过的例子的分类。它将每个训练示例视为高维空间中的一个点，并搜索一个超平面来区分正和负。该算法不仅适应稀疏数据，而且能够对组进行分类或为输入数据创建预测规则，而输入数据不能通过简单的线性决策函数进行分类。\n\
    \n为了评估变量在支持向量机中的重要性，目前有3类方法：过滤器、包装器和嵌入式方法。这些现有方法的瓶颈是它们的使用基于具有线性的内核。支持向量机可以有效地对径向基函数、s型或多项式核进行非线性分类。\n\
    \n支持向量机具有更好的泛化能力。此外，支持向量机突出表现其对高维数据的持久性。但对生成的模型的解释，及其对真正的参数调优的敏感性，决定了其主要局限性，导致某些数据集的分离效率低下，因此这种方法的效率与数据结构有关。这一事实尤其适用于支持向量机的线性模型，这些模型不够灵活，因此具有很强的案例依赖性。避免这种低效的传统技巧是使用核函数和其他特征映射与支持向量机相结合来建立非线性分类器。此外，支持向量机模型的训练和核参数对其结果有很大影响。\n\
    \n为了解决这些限制，支持向量机的非线性形式提出了一种基于核函数或其他非线性特征映射的改进机器，从而消除了上述缺陷。然而，选择一个有效的内核或特征映射函数在很大程度上取决于数据结构。因此，灵活的特征映射可以有效地应用于不同类型的数据结构，而不会对内核选择及其调整提出质疑。虽然已经提出了许多调整支持向量机参数的方法，但它们的解决方案可能仅产生局部最优解。此外，如果没有基于规则的过程来选择映射函数或内核，更灵活的核函数将导致更准确的模型，因此难以达到所需的精度水平。\n\
    \n（4）k近邻算法。\n\nk近邻算法，是一种基于特征空间中最近的训练实例，对对象进行分类的方法（图1-14）。连同一个新的样本分类器，选择数据库中最接近新样本的k个条目。它可以找到这些条目中最常见的分类。k近邻算法是一个非常简单的分类器，它可以很好地处理基本的识别问题。k近邻算法利用距离测度的度量特性来降低计算成本，少数算法可以有效地处理度量和非度量测度。\n\
    \nk近邻算法背后的一般理论是，在校准数据集中，它识别出了一组最接近未知样本的k个样本。然后，通过计算响应变量的平均值，从这k个样本中确定未知样本的标签。因此，对于该分类器，k在k近邻算法的性能中起着重要的作用。k近邻算法是基于实例的机器学习技术中最简单的代表之一。根据给定数据集中大部分k近邻算法的类别，它存储所有的训练数据，并对一个新的数据点进行分类。为了获得数据的最近邻，k近邻算法使用了一种度量来计算数据项对之间的距离。一般来说，所采用的度量是欧氏距离。\n\
    \n![](Images/figure_0031_0016.jpg)\n\n图1-14　k近邻算法\n\nk近邻算法也能够建立目标函数的局部近似，这对于每个被分类的新数据点也可能是不同的。它能对于几个具有低复杂度的局部近似进行描述，特别是当目标函数相对复杂时，这可能是有利的。\n\
    \nk近邻算法作为一种强大的非参数模式识别技术，得到了广泛的应用。然而，对于大型训练集，需要密集的相异性计算。在过去的30年里，k近邻算法一直是一个活跃的研究领域。虽然在模式识别中已经简要解释了非度量相异度测度，但大多数现有的k近邻快速算法只有在度量相异性测度的情况下才有效。用于加速k近邻算法的算法分为两类：模板压缩和模板重组。模板压缩去除模板集中的冗余模式，将模板压缩规则引入模板重组中，产生了一种创新的算法，即基于压缩的树算法。\n\
    \n虽然许多模板重组算法依赖于度量相异性度量的基本性质（如三角形不等式），但其他适用于非度量的算法仅在低维特征空间中有效。一个例外是基于凝聚的树算法，它适用于任何相异度测度、度量或非度量。利用度量的三角形不等式的算法在搜索和分类方面更有效。\n\
    \n基于聚类的算法包括两个阶段：树生成和分类。与现有的树分类方法不同，该算法引入了类条件聚类，并为早期决策建立了两个决策层次。树中的决策级别是每个节点及其子节点都具有唯一类标签的级别。因此，在决策级别上，可以使用k近邻分类来确定看不见模板的类别。超级别的生成是一个类条件聚类的过程，即将属于同一类的模板分组在一起。超级别之上的级别的建立仅基于一组节点之间的接近度。具体而言，聚类过程是基于当前级别的聚类中心的位置来迭代。所有聚类中心都是实际的数据点，因此在树生成和分类阶段都可以使用相同的相异性度量。\n\
    \n（5）卷积神经网络。\n\n卷积神经网络是人工神经网络的一种特殊情况，它通过保留图像中像素之间的空间关系来克服神经网络存在的问题。卷积神经网络不是使用单个像素作为输入，而是将图像的补丁提供给下一层节点（而不是所有节点）中的特定节点，从而保留了提取特征的空间上下文。这些节点的补丁学习提取特定的特征，被称为卷积滤波器。\n\
    \n卷积神经网络也是一种深度学习算法，旨在处理表现出自然空间不变性的数据，已成为该领域的核心。卷积神经网络被广泛用于图像处理领域，并且经常用于模糊或锐化图像，或者用于诸如边缘检测之类的其他任务。如果图像是灰度的，可见光数字图像只是一个矩阵，如果图像是彩色的，则是3个堆叠的矩阵（红色、绿色和蓝色通道）。这些矩阵包含的值通常为0～255，表示图像中的像素以及每个像素处每个颜色通道的强度。\n\
    \n卷积滤波器是一个小得多的矩阵，通常是平方的，大小从2×2到9×9。这个滤波器通过原始图像，在每个位置，执行元素级矩阵乘法。卷积神经网络的输出映射到一个新的矩阵（特征映射），其中包含与卷积滤波器是否检测到感兴趣的特征相对应的值。\n\
    \n在卷积神经网络中，过滤器被训练从图像中提取特定的特征（如垂直线、多形物体），并在特征地图上标记它们的位置。一个深度卷积神经网络使用特征图作为下一层的输入，它使用新的过滤器来创建另一个新的特征图。\n\
    \n这种情况可以继续到许多层，随着它的继续，提取的特征变得抽象，但对于预测非常有用。然后将最终的特征图从正方形表示压缩并输入前馈神经网络，可以根据提取的特征和纹理对图像进行分类。这个过程被称为深度学习。\n\
    \n卷积神经网络用于输入数据，可以表示为图像或类似图像的对象的情况。典型的卷积神经网络至少包含3个组件：卷积层、池化层和密集连接层。卷积层根据它的宽度、高度和深度来描述，也就是说，它在一个小的接受域上捕获x和y坐标信息，深度z对应不同的信息来源，并使用在输入图像中滑动时观察到的模式来设置权重。卷积层的主要优点是，这些层通过其权重共享机制减少了参数的数量，并逐渐建立了空间和配置不变性。\n\
    \n池化层本质上实现了子采样，以减少噪声的影响和学习参数的数量。此外，池化层为输入特征的位置和方向的小变化增加了一定程度的弹性。卷积层和池化层可以形成一个卷积模块，卷积神经网络的每个模块学习在识别特征的同时保持它们的空间关系。这些特性导致了卷积神经网络比标准人工神经网络有一个主要优势，它们是平移不变的，可以在输入场的不同区域识别相同的特征。\n\
    \n因此，在大多数情况下，卷积层的输出将通过某种形式的非线性激活函数，以允许网络处理更复杂的关系。随着卷积神经网络的不断加深，一个新的问题出现了：关于输入或梯度的信息可能会逐渐消失，当它到达网络的末端时就会消失并“洗脱”。目前已经提出了几种不同的方法来解决这一问题，例如创建从早期层到后期层的路径，或以前馈方式，将每一层连接到每一层，以确保网络中层之间的最大信息流。\n\
    \n与其他神经网络架构类似，超参数调优对卷积神经网络模型的性能有很大的影响，可能的选择数量，使这些架构的设计空间很大，但无法进行手动搜索。在这种情况下，已经开发了多种方法，来提供合理的初始超参数值，并合理优化过程，其中包括网格搜索、随机搜索和贝叶斯优化和等。\n\
    \n卷积神经网络最初是为二维图像识别而开发的。在典型的卷积神经网络网络中使用的一些方法，如池化算法，被用来降低表示的维数并允许位置转移，这可能导致信息的丢失，从而在与药物发现相关的研究中表现较差。一个先进的深度学习架构，如胶囊网络，允许对网络的内部知识表示的层次关系进行建模，并可能在与药物发现相关的研究中具有相当大的潜力。\n\
    \n对于图像识别任务，每个输入在一个前馈神经网络对应于图像中的一个像素。然而，这并不理想，因为在一个层中的节点之间没有连接。在实践中，这意味着图像中特征的空间上下文丢失了。换言之，在一个图像中彼此接近的像素可能比在图像的相对两侧的像素更相关，但卷积神经网络没有考虑到这一点。\n\
    \n# 第2章  \n\n人工智能解开蛋白质结构谜团\n\n寻找合适的治疗靶点以及建立相关疾病模型是新药研发的初始步骤，靶点的选择可能会影响后续药物开发的进程，例如在抗阿尔茨海默病新药研发中备受关注的抗β淀粉样蛋白相关靶点，各大制药公司均开展了相关研究，但大都以失败告终，因此新药开发靶点的选择是十分关键的。到2022年，已明确治疗作用的药物靶点不超过500个，仍有大量的可成药靶点亟待探索。人体是一个十分复杂的生命体系，大部分疾病的发病机制仍不够明晰，因此开发新的药物靶点需要耗费大量的时间、精力和资源。尽管药物进入临床前已经经过了大量的优化和论证，但大部分药物仍然不能顺利通过临床实验，而很多药物开发失败的原因可能是最初选择的研究靶点的成药性存在缺陷，因此在药物研发初期选择合适的药物靶点，并对其进行充分的论证，可以大大提高后续研究的成功率，减少财务损失和资源浪费。\n\
    \n人工智能方法和工具的日新月异，提高了创新药物研究的时间和成本效益。虚拟高通量筛选已成为早期药物发现的一个重要组成部分，以制定寻找新的先导化合物的策略。在临床实验的后期阶段发生的不可预测的毒性事件常导致巨大的损失，而且过程大多非常耗时。人工智能领域与神经形态系统的快速发展，将为解决此种复杂性难题铺就一条更好的预测道路。\n\
    \n大数据时代已经到来，基础数据量以指数级速度增长。大数据集计算三维转换，对蛋白质结构进行信息学处理，让先导物筛选工作事半功倍。现有技术能够满足基本需要，但对应预测毒理学领域使用的数据类型有特别需求。"
  fmt: '

    # 人工神经网络


    ## 概述与基本概念


    人工神经网络是适应性很强，能够表示各种形式和复杂性的线性和非线性函数。局限性包括需要参数调整和无法解释神经网络学习到的概念，这些概念被编码在权重中。


    神经网络仅仅是一层排列的人工神经元的集合。人工神经网络自20世纪中叶就开始发展，应用最广泛的人工神经元模型被称为乙状神经元。乙状神经元是一个基本单位，可以被视为生物神经元的模型。因此，乙状神经元接收到的1个或更多的加权输入，决定了神经元在多大程度上被激活。


    每个神经网络都包含一些节点（类似于细胞体），这些节点通过连接（类似于轴突和树突）与其他节点进行通信。当神经元之间的突触在生物神经网络中有关联输出时会增强（赫比安理论假定，“神经一起燃烧，连接在一起”），神经网络中节点之间的连接是根据它们提供期望结果的能力来加权的。


    ![](Images/figure_0026_0013.jpg)


    图1-11　人工神经网络的结构


    一个人工神经网络有1个输入层、可选的隐藏层和1个输出层。一层的单个神经元都与下一层的每个单神经元相连，因此，这种网络被称为全连接的神经网络。每层神经元的最佳数量，以及每层神经网络的最佳层数，是根据经验确定的。


    ## 训练与学习


    在人工神经网络用于实际目的之前，必须进行训练。训练的第一步是为网络选择一个合适的架构，必须选择足够数量的单一隐藏层，和适当数量的神经元。第二步与数据收集和组织有关。训练神经网络所需的数据量与网络的大小成正比。此外，由于技术原因，每一块数据只能贡献学习过程中的非常小的一部分。因此，数据集通常由几十万项组成。数据必须随机分为训练批和测试批。前者用于网络训练，后者允许在培训完成时评估网络的性能。


    在学习步骤中，人工神经网络逐步将其输入的输入值映射到相应的输出值。为了实现这样的映射，神经网络必须充分设置构成它的所有神经元的所有权重。该过程使用许多可用的训练算法之一自动执行，例如具有反向传播的梯度下降算法。经过适当的训练后，当神经网络的输入神经元得到适当的值时，神经网络的每个输出神经元将提供一个相关的输出值。


    多种学习技术可以用于训练人工神经网络，例如，梯度下降算法包括随机梯度下降和反向传播。反向传播，是指返回模型输出的计算误差的分布，将总网络误差的一部分，分配给每个神经元，并使梯度下降算法能够找到更好的解决方案，即底层函数的近似问题。误差反向传播主要用于监督学习任务，因为它需要目标输出值来计算误差，尽管它也适用于量化或构造误差，使其能够用于自动编码器等架构。


    当使用训练过的人工神经网络时，信息从网络的输入层流到输出层，某一层的每个神经元的输出成为下一层神经元的输入之一。这种对信息的处理被称为正向传递。


    ## 性能与局限性


    人工神经网络很受欢迎，是因为它对近似函数非常有效。函数是与一个称为域的集合中的每个元素关联的关系，域是另一个称为协域的集合中的唯一元素。这个普遍的近似定理，证明了任何具有适当体系结构的前馈神经网络，都可以近似任何函数，包括复杂的非线性函数。


    基于通用近似定理，利用人工神经网络来逼近分类问题中取离散值的函数。人工神经网络还可以预测连续函数的价值，使其成为很好的回归分析工具。在实践中，人工神经网络通常是近似复杂非线性函数的最佳选择。然而，更简单的线性回归模型仍应用于估计简单函数，因为它们需要更少的计算资源，并且更稳健。


    人工神经网络有3个主要的局限性：首先，培训人工神经网络需要大量的数据，这可能是对罕见疾病患者使用人工智能的一个限制因素；其次，神经网络需要良好的预测因子来正确地近似函数，换言之，网络需要提供与函数密切相关的可测量数据来进行分析；最后，训练神经网络，特别是中枢神经网络，需要大量的计算资源。


    人工神经网络的另一个缺点是，网络的输入和输出通常可以替代临床的情况，以最大限度地提高网络预测和临床情况之间的相关性。这种相关性可能并不总是最优的。因此，当更简单的线性方法不能提供准确的结果时，人工神经网络应该优先用于大型和复杂的数据集。


    ## 深度学习


    深度学习的概念是在20世纪80年代与人工神经网络一起提出的。然而，当时用于模型开发的数据有限，神经网络并没有比其他机器学习方法显示出显著的优势。从20世纪90年代到21世纪初，计算机硬件仍然不足以支持训练具有多隐藏层的神经网络或超大数据集的模型开发。现今，GPU和云计算的通用，使神经网络建模研究不再受硬件限制。


    深度学习是机器学习的一个子领域，在过去几年中出现了戏剧性的复苏，这主要是由于计算能力的提高和大量新数据集的可用性（图1-12）。该领域见证了机器理解和处理数据（包括图像、语言和语音）能力的巨大进步。医疗和药物学从深度学习中受益匪浅，因为生成的数据量巨大，医疗设备和数字记录系统的数量也在不断增加。


    ![](Images/figure_0028_0014.jpg)


    图1-12　深度学习与知识图谱的关系


    从历史上看，构建机器学习系统需要领域专业知识来设计特征提取器，将原始数据转换为合适的表示，学习算法可以从中检测。相比之下，深度学习是一种表示学习形式，其中机器被提供原始数据，并开发出模式识别所需的表示，该表示由多层表示组成。这些层通常按顺序排列，并由大量原始非线性运算组成，从而将一层的表示（从原始数据输入开始）输入下一层，并转换为更抽象的表示。当数据流经系统的各个层时，输入空间会反复扭曲，直到数据点变得可区分为止。通过这种方式，可以学习高度复杂的函数。


    尽管深度学习似乎是一个新兴的名词，但是它所基于的神经网络模型和数据编程的核心思想人们已经研究了几百年。从古至今，人们一直渴望能够通过数据来预测和分析未来。事实上，数据分析就是大多数自然科学的本质，人类通过发现自然事物中的变化规律，寻找它们的不确定因素，最终推测出与事实相近的结果。其实人们每天观看的天气预报就是通过观测大气的流动，从而计算出未来的天气状况。如何让人类预测的结果更加准确，需要观测到的数据以及数据模型更加精准。同样的道理，如果想让机器识别图片更加精准，就需要对模型（也就是神经网络）进行不断优化，使这个模型能够将误差降到最小。


    说到深度学习，就不得不了解一下神经网络，简单来说，神经网络就是模仿人体神经网络创建的一种网络架构。人类的大脑内部有很多神经，人们对这个世界的认知就是依靠神经元的相互作用，人们看到一张照片能分辨出照片中的动物是狗还是猫，看到一段文字能理解文字表达的意思，这都是大脑的神经元在发生作用。历史上，科学家一直希望模拟人的大脑，造出可以思考的机器。人为什么能够思考？科学家发现，原因在于人体的神经网络。


    深度学习是一种无监督学习，其源于人工神经网络的研究，含有多个隐藏层的多层感知器就是一种深度学习结构。现在有多种深度学习框架，如深度神经网络、卷积神经网络、深度置信网络和循环神经网络，它们被应用在计算机视觉、语音识别、自然语言处理、音频识别与生物信息学等领域。深度学习使机器模仿视听和思考人类的活动，解决了很多复杂的模式识别难题，使人工智能相关技术取得了很大的进步。


    深度学习模型能够扩展到大型数据集，部分原因是它们能够在专门的计算硬件上运行，并随着更多的数据不断改进，使它们能够超越许多经典的机器学习方法。深度学习系统可以接受多种数据类型作为输入，这是医药研究数据的特定技术的一个方面。最常见的模型是使用监督学习进行训练的，其中数据集由输入数据点（如药物靶点识别）和相应的输出数据标签（如“良性”或“一般”）组成。


    完全连接的网络被限制在1个或2个隐藏层内。然而，具有更多隐藏层的更深的网络可以更容易地拟合出非常复杂的函数。为了克服浅层神经网络的局限性，引入了一种新的网络模型：用于深度学习的深度神经网络。卷积神经网络是最常用的深度网络模型之一。


    基本上，卷积神经网络与完全连接的前馈人工神经网络具有相同的体系结构。然而，人工神经网络中的层没有完全连接。此外，随着网络的深入，卷积神经网络隐藏层中的神经元数量逐渐减少。这些特殊性允许权重总数减少，这反过来极大地减少训练或使用网络所需的计算资源。因此，卷积神经网络可以比人工神经网络更深，并且可以逼近更复杂的函数。


    卷积神经网络在分析空间或时间依赖的数据方面特别有效，如图像或声音。因此，卷积神经网络通常是解决图像或语音识别问题的强大方法。它们还能有效地分析大数据。


    深度学习的最大成功应用是在计算机视觉领域。计算机视觉专注于静态图像和视频，并处理对象分类、检测和分割等任务，这些任务有助于确定药物分子能否有效结合到作用靶点。


    ## 支持向量机


    自从Vapnik提出支持向量机以来，它在过去的10年里受到了许多研究人员的关注。支持向量机是一种非参数最大裕度分类技术，旨在将数据分类为两组，使其适用于两组分类问题（图1-13）。然而，它也被扩展到解决多组分类问题。


    ![](Images/figure_0029_0015.jpg)


    图1-13　支持向量机


    支持向量机是一种数据分类技术，属于一种监督学习算法，可用于识别复杂数据集中的细化模式。该算法已应用于文本分类等多种领域。支持向量机从根本上说是一个二进制分类器：给定两类数据，为了进行多类分类，可以使用成对分类。支持向量机学会了区分它们，并预测以前未见过的例子的分类。它将每个训练示例视为高维空间中的一个点，并搜索一个超平面来区分正和负。该算法不仅适应稀疏数据，而且能够对组进行分类或为输入数据创建预测规则，而输入数据不能通过简单的线性决策函数进行分类。


    为了评估变量在支持向量机中的重要性，目前有3类方法：过滤器、包装器和嵌入式方法。这些现有方法的瓶颈是它们的使用基于具有线性的内核。支持向量机可以有效地对径向基函数、s型或多项式核进行非线性分类。


    支持向量机具有更好的泛化能力。此外，支持向量机突出表现其对高维数据的持久性。但对生成的模型的解释，及其对真正的参数调优的敏感性，决定了其主要局限性，导致某些数据集的分离效率低下，因此这种方法的效率与数据结构有关。这一事实尤其适用于支持向量机的线性模型，这些模型不够灵活，因此具有很强的案例依赖性。避免这种低效的传统技巧是使用核函数和其他特征映射与支持向量机相结合来建立非线性分类器。此外，支持向量机模型的训练和核参数对其结果有很大影响。


    为了解决这些限制，支持向量机的非线性形式提出了一种基于核函数或其他非线性特征映射的改进机器，从而消除了上述缺陷。然而，选择一个有效的内核或特征映射函数在很大程度上取决于数据结构。因此，灵活的特征映射可以有效地应用于不同类型的数据结构，而不会对内核选择及其调整提出质疑。虽然已经提出了许多调整支持向量机参数的方法，但它们的解决方案可能仅产生局部最优解。此外，如果没有基于规则的过程来选择映射函数或内核，更灵活的核函数将导致更准确的模型，因此难以达到所需的精度水平。


    ## k近邻算法


    k近邻算法，是一种基于特征空间中最近的训练实例，对对象进行分类的方法（图1-14）。连同一个新的样本分类器，选择数据库中最接近新样本的k个条目。它可以找到这些条目中最常见的分类。k近邻算法是一个非常简单的分类器，它可以很好地处理基本的识别问题。k近邻算法利用距离测度的度量特性来降低计算成本，少数算法可以有效地处理度量和非度量测度。


    k近邻算法背后的一般理论是，在校准数据集中，它识别出了一组最接近未知样本的k个样本。然后，通过计算响应变量的平均值，从这k个样本中确定未知样本的标签。因此，对于该分类器，k在k近邻算法的性能中起着重要的作用。k近邻算法是基于实例的机器学习技术中最简单的代表之一。根据给定数据集中大部分k近邻算法的类别，它存储所有的训练数据，并对一个新的数据点进行分类。为了获得数据的最近邻，k近邻算法使用了一种度量来计算数据项对之间的距离。一般来说，所采用的度量是欧氏距离。


    ![](Images/figure_0031_0016.jpg)


    图1-14　k近邻算法


    k近邻算法也能够建立目标函数的局部近似，这对于每个被分类的新数据点也可能是不同的。它能对于几个具有低复杂度的局部近似进行描述，特别是当目标函数相对复杂时，这可能是有利的。


    k近邻算法作为一种强大的非参数模式识别技术，得到了广泛的应用。然而，对于大型训练集，需要密集的相异性计算。在过去的30年里，k近邻算法一直是一个活跃的研究领域。虽然在模式识别中已经简要解释了非度量相异度测度，但大多数现有的k近邻快速算法只有在度量相异性测度的情况下才有效。用于加速k近邻算法的算法分为两类：模板压缩和模板重组。模板压缩去除模板集中的冗余模式，将模板压缩规则引入模板重组中，产生了一种创新的算法，即基于压缩的树算法。


    虽然许多模板重组算法依赖于度量相异性度量的基本性质（如三角形不等式），但其他适用于非度量的算法仅在低维特征空间中有效。一个例外是基于凝聚的树算法，它适用于任何相异度测度、度量或非度量。利用度量的三角形不等式的算法在搜索和分类方面更有效。


    基于聚类的算法包括两个阶段：树生成和分类。与现有的树分类方法不同，该算法引入了类条件聚类，并为早期决策建立了两个决策层次。树中的决策级别是每个节点及其子节点都具有唯一类标签的级别。因此，在决策级别上，可以使用k近邻分类来确定看不见模板的类别。超级别的生成是一个类条件聚类的过程，即将属于同一类的模板分组在一起。超级别之上的级别的建立仅基于一组节点之间的接近度。具体而言，聚类过程是基于当前级别的聚类中心的位置来迭代。所有聚类中心都是实际的数据点，因此在树生成和分类阶段都可以使用相同的相异性度量。


    ## 卷积神经网络


    卷积神经网络是人工神经网络的一种特殊情况，它通过保留图像中像素之间的空间关系来克服神经网络存在的问题。卷积神经网络不是使用单个像素作为输入，而是将图像的补丁提供给下一层节点（而不是所有节点）中的特定节点，从而保留了提取特征的空间上下文。这些节点的补丁学习提取特定的特征，被称为卷积滤波器。


    卷积神经网络也是一种深度学习算法，旨在处理表现出自然空间不变性的数据，已成为该领域的核心。卷积神经网络被广泛用于图像处理领域，并且经常用于模糊或锐化图像，或者用于诸如边缘检测之类的其他任务。如果图像是灰度的，可见光数字图像只是一个矩阵，如果图像是彩色的，则是3个堆叠的矩阵（红色、绿色和蓝色通道）。这些矩阵包含的值通常为0～255，表示图像中的像素以及每个像素处每个颜色通道的强度。


    卷积滤波器是一个小得多的矩阵，通常是平方的，大小从2×2到9×9。这个滤波器通过原始图像，在每个位置，执行元素级矩阵乘法。卷积神经网络的输出映射到一个新的矩阵（特征映射），其中包含与卷积滤波器是否检测到感兴趣的特征相对应的值。


    在卷积神经网络中，过滤器被训练从图像中提取特定的特征（如垂直线、多形物体），并在特征地图上标记它们的位置。一个深度卷积神经网络使用特征图作为下一层的输入，它使用新的过滤器来创建另一个新的特征图。


    这种情况可以继续到许多层，随着它的继续，提取的特征变得抽象，但对于预测非常有用。然后将最终的特征图从正方形表示压缩并输入前馈神经网络，可以根据提取的特征和纹理对图像进行分类。这个过程被称为深度学习。


    卷积神经网络用于输入数据，可以表示为图像或类似图像的对象的情况。典型的卷积神经网络至少包含3个组件：卷积层、池化层和密集连接层。卷积层根据它的宽度、高度和深度来描述，也就是说，它在一个小的接受域上捕获x和y坐标信息，深度z对应不同的信息来源，并使用在输入图像中滑动时观察到的模式来设置权重。卷积层的主要优点是，这些层通过其权重共享机制减少了参数的数量，并逐渐建立了空间和配置不变性。


    池化层本质上实现了子采样，以减少噪声的影响和学习参数的数量。此外，池化层为输入特征的位置和方向的小变化增加了一定程度的弹性。卷积层和池化层可以形成一个卷积模块，卷积神经网络的每个模块学习在识别特征的同时保持它们的空间关系。这些特性导致了卷积神经网络比标准人工神经网络有一个主要优势，它们是平移不变的，可以在输入场的不同区域识别相同的特征。


    因此，在大多数情况下，卷积层的输出将通过某种形式的非线性激活函数，以允许网络处理更复杂的关系。随着卷积神经网络的不断加深，一个新的问题出现了：关于输入或梯度的信息可能会逐渐消失，当它到达网络的末端时就会消失并“洗脱”。目前已经提出了几种不同的方法来解决这一问题，例如创建从早期层到后期层的路径，或以前馈方式，将每一层连接到每一层，以确保网络中层之间的最大信息流。


    与其他神经网络架构类似，超参数调优对卷积神经网络模型的性能有很大的影响，可能的选择数量，使这些架构的设计空间很大，但无法进行手动搜索。在这种情况下，已经开发了多种方法，来提供合理的初始超参数值，并合理优化过程，其中包括网格搜索、随机搜索和贝叶斯优化和等。


    卷积神经网络最初是为二维图像识别而开发的。在典型的卷积神经网络网络中使用的一些方法，如池化算法，被用来降低表示的维数并允许位置转移，这可能导致信息的丢失，从而在与药物发现相关的研究中表现较差。一个先进的深度学习架构，如胶囊网络，允许对网络的内部知识表示的层次关系进行建模，并可能在与药物发现相关的研究中具有相当大的潜力。


    对于图像识别任务，每个输入在一个前馈神经网络对应于图像中的一个像素。然而，这并不理想，因为在一个层中的节点之间没有连接。在实践中，这意味着图像中特征的空间上下文丢失了。换言之，在一个图像中彼此接近的像素可能比在图像的相对两侧的像素更相关，但卷积神经网络没有考虑到这一点。


    # 第2章 人工智能解开蛋白质结构谜团


    寻找合适的治疗靶点以及建立相关疾病模型是新药研发的初始步骤，靶点的选择可能会影响后续药物开发的进程，例如在抗阿尔茨海默病新药研发中备受关注的抗β淀粉样蛋白相关靶点，各大制药公司均开展了相关研究，但大都以失败告终，因此新药开发靶点的选择是十分关键的。到2022年，已明确治疗作用的药物靶点不超过500个，仍有大量的可成药靶点亟待探索。人体是一个十分复杂的生命体系，大部分疾病的发病机制仍不够明晰，因此开发新的药物靶点需要耗费大量的时间、精力和资源。尽管药物进入临床前已经经过了大量的优化和论证，但大部分药物仍然不能顺利通过临床实验，而很多药物开发失败的原因可能是最初选择的研究靶点的成药性存在缺陷，因此在药物研发初期选择合适的药物靶点，并对其进行充分的论证，可以大大提高后续研究的成功率，减少财务损失和资源浪费。


    人工智能方法和工具的日新月异，提高了创新药物研究的时间和成本效益。虚拟高通量筛选已成为早期药物发现的一个重要组成部分，以制定寻找新的先导化合物的策略。在临床实验的后期阶段发生的不可预测的毒性事件常导致巨大的损失，而且过程大多非常耗时。人工智能领域与神经形态系统的快速发展，将为解决此种复杂性难题铺就一条更好的预测道路。


    大数据时代已经到来，基础数据量以指数级速度增长。大数据集计算三维转换，对蛋白质结构进行信息学处理，让先导物筛选工作事半功倍。现有技术能够满足基本需要，但对应预测毒理学领域使用的数据类型有特别需求。

