    如果不讨论药物-药物相互作用，关于选择联合治疗的决策支持系统的讨论将是不完整的。预测模型中的药物-药物相互作用对药物治疗的选择和给药过程很重要，因为它可以帮助减少不良反应和最大限度地提高剂量效率。尤其是越来越多的老年人群，以及可能需要服用多种药物的复杂疾病患者，他们与多药治疗相关的风险越来越受到关注。


    患者同时服用多种药物的概率随着年龄的增长而增加，因为患者同时患疾病的数量增加。复杂的疾病往往需要多方面的药物方案来针对所有有问题的区域。因此必须开发预测药物-药物相互作用的方法用于临床，以防止多药治疗对患者健康产生负面影响。


    虽然药物-药物相互作用是作为药物批准过程的一部分进行筛选的，但由于大量可能的组合，其中许多表现直到临床试验后才被注意到。目前还没有预测新的药物-药物相互作用的标准方法，但肯定需要开发和采用某种方法。开发基于人工智能的模型，可以用于从生物、化学和药代动力学数据中先验检测药物-药物相互作用，并向着最终满足临床实验要求迈进。


    使用机器学习预测药物-药物相互作用通常是通过计算两个分子的目标、通路和结构的相似性来完成的。由于添加每个新药物结构所造成的巨大不确定性，以及每种添加药物所需的计算能力呈指数级增长，很少有研究试图预测两种以上药物的组合。


    但需要注意的是，描述一个模型的预测能力的通常度量标准是不完整的，甚至对具有类分布偏差的二元分类具有误导性。根据药物银行和双药银行的药物-药物相互作用数据，基于随机森林的模型的预测能力最高。这种建模方法的缺点是它依赖于语义和拓扑数据，而不是像QSAR描述符这样纯粹的定量变量。


    Vanderbilt大学生物医学信息中心的科研人员，利用朴素贝叶斯及逻辑回归技术整合与药物-药物组合的表型、治疗、基因组和结构相似性相关的数据，开发了基于机器的模型来预测药物-药物相互作用。朴素贝叶斯是一种统计方法，它利用各种表示类别的概率，并给出最可能的类作为预测。精度随核类型的函数而变化。该法通过计算两个节点之间存在一个链接（即交互）的概率，从描述网络相似性的拓扑指数和药物之间描述治疗、化学、结构、副作用和文本分类相似性的语义特征。它具有更简单的优点，但以牺牲操作员的透明度为代价而提高精度的趋势仍然存在。这些是迄今为止任何药物组合预测因素的最佳结果，加强了协同效应预测更依赖于药物相关数据而不是患者相关数据的情况。


    ## 5.5 剂量控制和时间


    正确控制剂量和给药时间，对于个性化的药物方案至关重要。理想的给药方案，可以使体内药物浓度保持在高于最低有效浓度，但低于最低毒性浓度的恒定平衡状态。这种理想的给药被称为零阶释放。计算模型被利用来描述接近理想的零阶释放，以最大化药物的有效性，同时最小化副作用。


    在实际临床过程中，可以将实时传感器与软件相结合，以测量和优化测试药物的药代动力学特性，指导给药剂量和给药时间。一些模型旨在预测药物将如何与各种转运体和膜相互作用，参与药物的吸收、分布、代谢、排泄和毒性，以阐明患者机体如何对药物作出反应。通过开发一种特征选择和参数优化的系统方法，可以极大地改进预测ADMET特性的机器学习方法。华西医学院生物治疗实验室的研究人员使用遗传算法，通过特征选择和共轭梯度方法进行参数优化，建立了4种与药物药代动力学相关的模型的支持向量机架构。共轭梯度法是一种迭代计算误差减少最小方向的数学技术，直到找到最小的误差。遗传算法通过对每个特征向量或一行特征进行评分，基于其对所解决问题的信息贡献，并将这些高得分特征与其他进行交叉，来找到一组最优特征。它重复这个过程，直到模型的精度不再增加，从而找到导致可达到的最小误差的参数权值集。遗传算法的特征选择和参数优化方法已被证明对于构建基于支持向量机的机器学习模型特别有用。


    应用支持向量机架构预测药代动力学特性，以及在支持向量机架构中应用这些优化技术可以带来巨大收益。在多种情况下，最好的准确性都是通过应用这里所示的技术来实现的，但其中一些可能是因为他们所预测的类有严重的偏差。没有一个数据集可以选择两个类别的实例，在不同情况下，具有更多代表性的类的准确性都要高得多。可以使用像这样的度量来证明模型独立于这类偏差的预测能力，或者使用像合成少数过采样这样的技术，来解决这个问题。


    随着时间的推移，准确预测肿瘤体积或任何其他疾病对药物的反应，对于最大限度地提高药物的有效性，同时通过阐明疾病进展程度作为药物敏感性、剂量和给药时间的函数来降低不必要的毒性程度，是极其重要的。


    ### （1）应用实践一


    蒙特利尔大学新药中心开发了一个循环神经网络模型，用于预测一般疾病的时间反应，称为循环边缘结构网络。此数学模型描述了肿瘤体积与其前一时间点的大小关系，以及四项相关系数：①肿瘤生长速率。②辐射剂量、敏感性和暴露时间。③化疗剂量和敏感性。④偏倚项。目的是证明无偏治疗反应和多步骤预测性能，从而评测给药时间和剂量的变量。他们将该模型预测肿瘤体积的能力与其他已知方法进行了比较，发现与一些基准和最先进的方法相比，它们的均方根误差最低。表明该模型能够随着时间的推移调整治疗变化，误差增长可以忽略不计。通过均方根误差测量，该模型的预测性能比传统方法高80.9%，比最先进的贝叶斯方法高66.1%。该模型由两部分组成：它首先编码给定患者当前疾病状态的表示，然后使用解码器来预测选定药物方案在一定时间内的治疗反应。


    ### （2）应用实践二


    里昂大学药物研究实验室使用蒙特卡罗树启发的方法，开发了一个用于替莫唑胺剂量和时间与减小肿瘤大小有关的优化参数的模型。他们使用替莫唑胺的药代动力学和药效学数据来代表该药物，并使用绝对中性粒细胞计数的最低点、替莫唑胺的骨髓抑制作用描述的生理因素来描述毒性。使用这些技术和数据开发的方案导致平均预测肿瘤收缩7.66倍，95%置信区间为7.36～7.97。这些模型没有在真实患者上进行测试，仍然需要开发一种方法来促进这些结果的体内测试。


    ## 5.6 辅助诊疗


    应用人工智能作为选择和管理个性化的药物方案的辅助手段，非常有必要，特别是在许多患者需要全新的治疗方案的复杂疾病时。现代医学利用疫苗接种和抗生素等技术取得了巨大的成功，这些技术通常在患者之间没有多少调整。精确和个性化的药物方法是为了对抗遗留下来的疾病——那些没有一刀切的解决方案的疾病。只有通过应用依赖于人工智能引擎的计算工具，我们才能真正利用需要整合的大量生物、化学和医学数据，以充分理解和对抗癌症等复杂疾病。人工智能可以作为骨架关键，推荐所有疾病的治疗。相反，人们目前正在开发工具，以处理每种疾病和每个患者的药物选择和给药过程中的特定任务。


    与其他数学近似方法非常相似，人工智能建模方法确定的函数在不外推到大输出区域时最精确。通过分别减少分类和回归问题的可能输出数量或输出范围，限制模型的预测空间有助于提高其准确性。


    人工智能技术中所依赖的数据和建模方法的复杂性通常导致决策过程的执行，这是人类操作员完全无法理解的。这是不可避免的，因为我们没有一种可想象的方式来考虑和整合所有与每个患者相关的适当的生物、化学和医学信息，以设计一个特定于他们需要的治疗方案。如果我们能处理这种情况，我们就不需要人工智能了。


    了解疾病的遗传学可以让临床医生推荐治疗方法，并提供更准确的诊断。医生面临的一个关键挑战是确定患者基因组中的新变异是否与医学相关。在某种程度上，这一决定依赖于预测突变的致病性，这项任务已经使用了蛋白质结构和进化守恒等特征来训练学习算法。鉴于深度学习技术在有效整合不同数据类型方面具有更大的能力，它们将提供比今天更准确的致病性预测。


    人工智能和机器学习几乎会影响疾病药物治疗的各个方面。对于疾病诊断来说，机器学习能够为临床医生提供与疾病相关的预测建模概念，如特征选择和常见的缺陷等。并呈现普通医学和重症医学中的历史案例，解释这些方法如何应用于实现精确的疾病学和改善患者的预后。人工智能和机器学习在疾病诊断中的前景是提供一种有力分析工具，以增强和扩展医生的判断能力。全基因组测序和流媒体移动设备生物识别技术等数据分析技术的临床引入，可以增强患者护理的每个阶段，即从研究发现到诊断，再到治疗的选择。因此，临床实践将变得更有效、更方便、更个性化、更有效。


    长期以来，医生一直需要识别、量化和解释变量之间的关系，以改善患者护理。人工智能和机器学习包括多种方法，允许计算机通过算法学习数据的有效表示来做到这一点。在这里，“人工智能”和“机器学习”或多或少是同义词，更准确地说，机器学习可以被理解为一组实现人工智能的技术。经典机器学习和经典统计学之间的区别与其说是一种方法，不如说是一种意图和文化。统计的主要重点是对样本或总体参数进行推断，而机器学习侧重于算法表示数据结构和做出预测或分类。这两者往往相互交织在一起。因此，不能在经典的统计学和机器学习方法之间设置一个明确的边界，它们是类似的，但可以用于回答和解决不同的问题。


    神经网络训练需要大量的有效的数据，这就提出了两种类型的问题。首先，在数据共享方面，个人和集体利益之间存在两难困境。一方面，大多数患者的个人利益是通过限制数据访问和共享或提供匿名或不完整的数据来保护其隐私和数据的机密性。另一方面，集体利益有利于更好的健康表现，这意味着临床医生和研究人员必须收集和共享完整的数据。多个国家正在以不同的方式修改各自的立法来处理数据保护和共享。在国内和国际上尚未建立收集和共享大数据的标准程序。让患者参与数据收集和数据登记，可能是缓解患者对数据保密性和临床数据共享需求的焦虑的一种方法。


    在临床实践中，使用人工智能还有一个值得一提的结果：改变医患关系。患者在知情的情况下寻求医生的帮助，医生在知情的情况下接受个人作为患者。医患关系主要基于信任、知识、尊重和忠诚。值得注意的是，这种关系对健康结果有实际的影响。糟糕的医患关系会显著损害患者的健康。人工智能在临床应用必然会以复杂的预测的方式改变医患关系，但必须采用最佳的患者护理方式。


    最近，有几家大公司已经投资了医学人工智能。谷歌的子公司DeepMind健康公司正在与英国国家卫生服务部门合作，在伦敦的几家医院部署人工智能解决方案，旨在解决未能对住院患者进行救援的问题。IBM的子公司沃森健康公司也参与了医学人工智能的业务。在肿瘤学方面，据报道，沃森对93%的乳腺癌病例的建议与肿瘤委员会的建议相一致，至少在实验室条件下是这样的。


    私营企业参与医学人工智能研究是一个加速人工智能在临床实践中部署的机会。然而，也有一些问题必须强调。首先，在公立医院工作的临床医生和参与医学人工智能研究的私人公司之间的伙伴关系应该保持平衡。在一种公私合作的模式中，临床医生将只提供数据，而私营公司将全权负责开发人工智能算法，这将涉及临床医生可能被迫使用人工智能工具的风险。相反，一个良好平衡的伙伴关系可以更容易地确保患者由训练有素的临床医生治疗，并获得最佳技术。


    医学人工智能是一把双刃剑，它可以很容易地远程使用。因此，它有可能帮助发展中国家获得尖端的诊断和预后工具。然而，必须努力确保最脆弱的人将有效地从先进的药物中获益。医疗培训是在部署医学人工智能过程中必须面临的另一个挑战。医生需要发展对人工智能算法的正确理解，以在临床实践中安全地使用它们。然而，深入理解人工智能算法需要使用先进的数学工具，完成这一工作可能并不需要专业医生。因此，应讨论修改医学培训和继续医学教育。


    人工智能在临床医学中的应用为患者和临床医生开辟了一个广阔的机会领域。然而，在伦理、医疗培训、法规和责任方面，一些挑战尚未得到满足。特别是，我们应该采取行动来控制人工智能在临床实践中的使用，如更新良好的临床实践指南，以考虑到机器学习算法的使用，保护患者的数据，同时支持临床研究。


    需要强调一些基本原则：临床研究中使用的医学人工智能算法应在多中心、双盲、随机、前瞻性研究中进行评估，并采用外部验证数据集，以确保其性能在相对异质的目标人群中可重复。从事研究的个人应该获得医学和人工智能方面的充分资格和培训。此外，应持续监测医学人工智能算法的上市后性能，并及时报告不良事件。这些措施将确保人工智能在临床医学中得到最佳使用，以便患者和医生能够安全地利用其诊疗辅助能力。


    ## 5.7 诊疗图像分析


    在数字病理学中，人工智能方法已被应用于各种图像处理和分类任务，包括低级别任务，如重点关注对象识别问题，以及高级别任务，如基于图像中的模式预测疾病诊断和治疗反应的预后。与最终应用无关，人工智能方法最初是为了提取适当的图像表示，然后可以用于训练用于特定分割、诊断或预测任务的机器分类器。数字病理学中的一些人工智能应用集中在需要自动化病理学家耗时的任务上，从而使它们能够在高级决策任务上花费额外的时间，尤其是与具有更多混杂特征的疾病表现相关的任务。此外，数字病理学中的人工智能方法越来越多地被应用于帮助解决肿瘤学家面临的问题，例如，通过开发评估疾病严重程度和结果的预后分析，以及预测治疗反应的分析。


    基于人工智能的方法是缓解肿瘤学家和病理学家面临的一些挑战的起点，这些方法稳健且可重复。这一前提得到了几项研究的结果的支持，基于人工智能的方法与专业病理学家的方法具有相似的准确性。


    病理学家和肿瘤学家利用固有专业知识，创建特定的手工制作的基于特征的机器学习方法，或者在没有固有领域知识的情况下，来描绘和开发机器学习算法的构建块，在手工创建的机器学习方法中，尝试构建固定到问题域的新特征，即算法通常针对特定的癌症或组织类型，重点关注可能不适用于广泛应用的特定特征。例如，这些手工制作的特征可以反映有丝分裂图的定量计数，病理学家目前在乳腺癌分级过程中对其进行定性评估。然而，手工制作的特征也可以包括领域不可知的特征，例如组织的亚视觉纹理异质性测量或细胞核形状和大小的定量测量，这些特征可以应用于疾病和组织类型。


    广泛使用的特征，要求其能够量化单个类型的离散组织元素或基元（如细胞核、淋巴细胞或腺结构）或不同组织特异性基元之间的空间分布、排列和结构。这些基于特征的领域识别和领域特异性手工方法已用于癌症亚型的诊断、分级、预后和治疗反应预测，包括前列腺癌、乳腺癌、口咽癌和脑瘤。


    基于卷积神经网络的图像诊断方法方面已经有很多成果，这在很大程度上是由于卷积神经网络在对象分类任务中达到了人类的分析水平，在该任务中，卷积神经网络学习对图像中包含的对象进行分类。这些相同的网络在迁移学习中表现出了强大的性能，其中最初在与感兴趣任务无关的海量数据集上训练的卷积神经网络在与感兴趣任务相关的小得多的数据集上进一步微调，比如对医学图像。在第一步中，该算法利用大量数据来学习图像中的自然统计数据，直线、曲线、颜色等；在第二步中，对算法的更高层进行重新训练，以区分诊断病例。


    类似地，对象检测和分割算法识别图像中与特定对象相对应的特定部分。卷积神经网络将图像数据作为输入，并通过一系列卷积和非线性运算对其进行迭代扭曲，直到将原始数据矩阵转换为潜在图像类别上的概率分布。


    如今，深度学习模型在各种诊断任务中都达到了医生级别的准确性，包括从黑色素瘤、糖尿病视网膜病变、心血管风险中识别痣、从眼底和光学相干断层扫描图像中转诊、在乳房X线照片中检测乳腺病变，以及用磁共振成像进行脊柱分析。单一的深度学习模型也能有效地应用于跨医学模式的诊断中。然而，在比较人类与算法性能的研究中，临床背景变得很关键，它限制了算法仅使用现有的图像进行诊断。这通常会增加诊断任务难度，因为在现实世界的临床环境中，医生可以访问医学图像和补充数据，包括患者病史和健康记录、额外测试、患者证词等。


    临床上，医生开始在紧急和容易错过的病例图像中使用对象检测和分析，例如在患者发生永久性脑损伤之前的有限时间里，使用放射学图像标记大脑中的大动脉闭塞，或需要医生费力地扫描和诊断千兆像素图像（或相当大的物理幻灯片）的癌症组织病理学读数。这些可以用经过训练的卷积神经网络来补充，以检测有丝分裂细胞或肿瘤区域。他们可以被训练来量化组织病理学图像中存在的PD-L1的量，这对于确定患者接受哪种类型的免疫肿瘤学药物很重要。


    结合高像素分析，卷积神经网络甚至被用于发现与生存概率相关的组织的生物学特征，为新的医学成像任务构建有监督的深度学习系统的主要限制，是足够大的标记数据集。用于特定任务的小型标记数据集更容易收集，但会导致算法在新数据上表现不佳。在这些情况下，用于大量数据扩充的技术已被证明在帮助算法泛化方面是有效的。同样，大型但未标记的数据集也更容易收集，但需要转向改进的半监督和无监督技术。


    自然语言处理侧重于分析文本和语音，从单词中推断意义。递归神经网络是一种有效处理语言、语音和时间序列数据等顺序输入的深度学习算法，在该领域发挥着重要作用。自然语言处理的显著成功包括机器翻译、文本生成和图像字幕。在医药研究领域，顺序深度学习和语言技术为电子健康记录等领域的应用提供了帮助。


    在进行预测时，迄今为止的大多数工作都对有限的结构化数据集使用监督学习，包括实验室结果、生命体征、诊断代码和人口统计数据。为了解释结构化和非结构化数据，研究人员开始采用无监督学习方法，例如自动编码器，在自动编码器中，首先训练网络，通过压缩然后重建未标记的数据来学习有用的表示。最近使用卷积和递归神经网络对患者记录中发生的结构化事件的时间序列进行深度学习建模，以预测未来的医疗事件。


    下一代自动语音识别和信息提取模型可能会开发临床语音助手，以准确转录患者就诊。医生在工作日中很容易花大量精力外理电子健康记录，会导致倦怠并减少与患者相处的时间。自动化转录将缓解这种情况，大大地提高效率。


    数字病理学包括使用全玻片扫描仪对组织病理学切片进行数字化的过程，以及使用计算方法对这些数字化的全玻片图像（WSI）进行分析。数字病理学一词最初被用于包括使用先进的玻片扫描技术将全玻片图像数字化的过程，现在还指用于数字化图像的检测、分割、诊断和分析的基于人工智能的方法。


    计算机工程师和数据科学家正在引导开发病理学和肿瘤学中新的基于人工智能的图像分析方法，他们正在开发和应用人工智能工具执行各种任务，例如帮助提高诊断准确性和识别精确肿瘤学的新生物标志物方法。病理学家和肿瘤学家是这些图像分析方法的主要最终用户。在常规临床实践中，病理学家（尤其是解剖病理学家）的组织学诊断的基础是对分析样本的多种形态特征的视觉识别、半定量和整合，以及潜在疾病过程的背景。通过广泛的研究生系统培训，病理学家能够快速提取与预定义标准和预先存在的临床特征相关的主要形态学模式，以便对其观察结果进行分类。最常见的是，这一过程的结果是组织病理学诊断，并以书面报告的形式提交给治疗医生。虽然系统培训和使用标准化指南可以支持分析过程和诊断准确性的统一，但组织病理学分析本身就受到其主观性质以及独立观察者之间视觉感知、数据整合和判断方面的自然差异的限制。


    在癌症中，影响细胞信号传递和细胞与环境相互作用的基因组改变的复杂性会影响疾病的生物学过程，并影响对治疗干预的反应。对这种变化的评估需要用高度敏感和精确的方法同时询问多个特征。

