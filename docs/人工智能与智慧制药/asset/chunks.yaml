  trans: '


    # 人工智能药物设计


    这种差异并非是体外药理结果特有的，一般情况下动物的药理实验也往往与人体的实验结果仍存在巨大的差异。同时，在体外作为靶标的蛋白结构，也往往与体内有着巨大的结构差异。这些复杂的因素左右着建模的效率。人工智能药物设计的最终挑战是从零开始自主生成具有所需性质的新化学实体，而不需要通常成本高昂的全层高通量筛选。


    在药物设计中应用人工智能的部分吸引力在于，有可能开发数据驱动的隐式模型构建过程，由高能量筛选产生大量数据集，并对替代方案进行优先排序。这至少代表了决策能力向机器智能的部分转移，并可以被视为与人类智能的协同作用，即一个领域特定的内隐式人工智能，它将增强药物化学家在药物设计和选择方面的能力。


    ## 五大挑战与核心问题


    为了从长远来看取得成功，使用人工智能进行药物设计，必须为几个问题提供解决方案，这些问题包括五个“重大挑战”：获得适当的数据集，生成新的假设，以多目标的方式进行优化，减少周期时间，改变研究文化和创造适当的思维方式。这一观点是
    2018 年关于与人工智能重新思考药物设计的会议提出的，会议围绕这五个重大挑战的讨论，并得出了主要结论以及对自那以后的进展进行讨论。


    ### 适当的数据


    适当的输入数据对于构建决策和生成的有用预测模型至关重要。如果没有一个适当的数据集和对这些数据的范围和局限性的理解，即使是一个看似复杂的模型也将无法产生有用的结果。


    ### 化学设计的模式匹配


    化学设计可以被认为是模式匹配，自 20 世纪 90 年代以来，基于计算机的重新设计方法已经被探索作为思想生成器来支持药物设计。今天，生成性人工智能通过为决策提供了一个统计框架，为药物的重新设计提供了一种新的方法。与早期的分子设计引擎使用了一组显式的化学转换和组装规则（如片段生长和链接）相比，这些生成模型根据数据分布的统计概率隐含地代表了化学知识。换句话说，这两个不同概念所使用的语言不再是教科书上的化学，而是从训练数据中学到的一种新语言。


    ### 生成性人工智能的可解释性


    这种方法值得进一步讨论，因为它直接涉及化学中人工智能系统的可解释性问题。开创性的前瞻性应用已经表明，生成性的从头设计会产生具有所需性质和活性的合成可及分子。与以前的从头设计方法相比，这些模型的主要优点是：手头项目的快速再训练或微调；可伸缩性提供不需要明确的几乎无限化学空间；软件可用性；以及设计的合成可访问性。这给许多早期的从头设计方法造成了麻烦。


    ### 数据复杂性与适应性


    药物设计将面临越来越复杂的数据和目标假设。药物发现过程中的一个关键局限性是缺乏关于人类生物学的基本知识。虽然这一观点关注药物设计，但前一点意味着在优化和设计过程中需要适应性，因为生物分析在被研究系统的生命周期中往往随着知识的进化而迅速变化。因此，随着药物发现知识的发展，人工智能需要灵活地提供答案。


    ### 机制模型


    另一方面，“机制”模型能够通过捕获不同抽象层次的行为（如遗传、分子和细胞），并解释这些行为如何进化和相互作用来解决这两个挑战。在计算化学中，机制模型是对基于人工智能的方法的补充，因为它们可以为机器学习模型发现的关联添加解释。因此，这些模型提供新的假设和机器学习模型，并提供进一步的数据来测试这些假设和改进模型，这就形成了一个虚拟循环，创建了一个完整的学习系统。


    ## 机器学习方法概述


    ### （1）机器学习


    信息化时代，大数据应用无处不在。对新药设计来说，通过对现有结构的数据进行多角度的分析，可以系统地研究分子的特征。同时数据信息每年都在成倍的增加，给人工智能提供了庞大的信息数据库，为药物化学家提供了多种结构特征。大数据在药物组合化学中发挥了至关重要的作用。


    人工智能通过计算机技术，模拟药物化学家的设计思路，通过机器学习和解释药物大数据来发现新的结构。许多生物制药企业正将人工智能、机器学习与药物发现管道集成起来。辉瑞自
    2016 年 12 月以来一直与 IBM 合作，利用其云平台进行免疫肿瘤学药物研究。赛诺菲也正在与总部位于英国的人工智能驱动药物设计公司合作，寻找治疗代谢疾病的方法。


    机器学习可以分为有监督学习、无监督学习和强化学习，并在分类、生成建模中得到应用，监督学习、分类和回归方法，根据输入和输出数据源来预测模型。有监督机器学习适用于疾病诊断的方法中，分类方法对于筛选合适的`ADMET`大有帮助。


    机器学习利用生物活性和化学结构之间的关系来开展药物设计工作，通过学习技术对生物靶点（蛋白质结构、结构域、跨膜区域、糖基化和磷酸化位置）的结构进行预测和验证，并建立和定量结构活性关系模型、药效团模型、分子对接分析和相似性搜索中的排序。机器学习技术通过对药代动力学和毒理学谱进行分类，结合对生物活性先导化合物的发现或优化，以及构建新配体模型来实现新药物的设计与挖掘。


    与经典的评分函数相比，机器学习不仅仅将分析限制在结构特征和绑定亲和值之间的预定义函数形式上。机器学习是构建和优化模型以预测绑定姿态和亲和性的动态技术。这些方法考虑了配体和靶标之间的相互作用，而忽略了容易出错的相互作用。此外，机器学习技术的多种方法，如随机森林、支持向量机和神经网络，在绑定相互作用之间具有非线性依赖性。因此，基于机器学习的评分函数在结合能计算的情况下比其他方法更好。另一个被称为共识评分的评分函数使用集体分数来最小化个体分数的错误率，并增加真正的积极选择的可能性。


    针对结合亲和力的预测和已知结合构象的重现性，许多研究都对各种评分函数的效率进行了比较。所有的现代评分函数在不同的条件下都有不同的准确率。因此，共识评分函数比单评分方法表现更好，并广泛应用于各种生物信息研究学。共识评分函数补偿了单个评分函数的局限性。它通过基于一个简单的原因结合多个评分函数来提高命中率，真实值往往更接近重复实验的平均值。


    机器学习的输出依赖于多个参数，如训练数据集的多样性、处理库中活性和非活性化合物的不平衡数据集的能力，以及定义精确参数，覆盖包括活性和非活性分子在内的完整化学空间。因此高效的机器学习模型的开发，可以筛选在输出中产生少量假阳性和大量活性化合物的大型库。这一目标可以通过包含预测的非活性化合物的多功能训练数据集来实现。


    ### （2）深度学习


    人工神经网络属监督神经启发机器学习技术，被用来解决语音和图像识别等问题。人工神经网络是作为大脑中神经元的机器学习算法：它们接收大量的输入信号，并通过非线性激活函数计算输入的加权和产生激活反应，并将输出信号传递给随后连接的神经元。神经网络的基本结构由输入层、隐藏层和输出层组成。


    在人工神经网络中，处理节点可以是完全连接，也可以是部分连接。它从输入节点中获取输入变量，并通过隐藏节点转换为输出节点，在其中计算输出值。人们通过反向传播方法，对神经网络进行迭代训练。由于过拟合、梯度减小等问题，传统的神经网络方法表现不佳，已被随机森林算法和支持向量机等其他机器学习算法所取代。


    深度学习概念起源于具有许多隐藏层的前馈神经网络。通过传统的`QSAR`方法，不可能进行大数据量、速度、多样性和准确性的表征。深度学习是用于分析和探索大数据的机器学习算法，其需求很大。与其他机器学习方法相比，深度学习体系结构是灵活的。可对具有相同数量分子描述符的化合物建立模型。


    贝叶斯推理网络，为现有的基于相似的虚拟筛选工具，提供了一个有趣的替代工具。当被寻找的活性分子具有高度的结构同质性时，贝叶斯推理网络特别有效，但它已被发现在结构异构的活性分子中表现不理想。


    深度学习的转化影响，已经扩展到计算生物学和计算化学等领域。其中一个里程碑时刻是一个深度神经网络赢得了对分子活性预测的`Kaggle`挑战。最近，在分子网基准测试和`DeepChepchem`开源库中整理了更多基于分子的数据集和预测任务。多种机器学习方法可以用来预测不同活动类别中的目标。在具有回归任务的模型中，最佳验证`r2`的物理化学范围为
    0.61～0.87，生物物理验证范围为 0.45～0.51，量子物理验证范围约为 0.99。


    ### （3）强化学习


    通过微调预训练集来改善上面的问题。最近提出的序列图，通过任务特定添加强化学习，优化`logP`、成药性的定量估计。奖励函数倾向于产生结构相对简单的分子，因为它们的有效性和正确属性分布的概率都较高。但选择适当且有用的奖励函数比较困难。近期提出了基于策略的强化学习方法，通过引入一种“增强可能性”方法，来扩展之前的工作。从本质上说，这涉及化学空间中预先训练的网络和评分函数，通过对分子质量的估计来训练一个代理集，以指导模型生成仍然代表原始化学域但反映所用评分函数意图的输出示例。


    此外，该模型可以生成类似于结构查询的分子。即使从训练集中去除所有这些化合物，也可以产生结构相似的类似物。部分结构已通过药理学实验被证实是有效的，但并未包括在活性预测或生成模型的训练集中。


    强化学习的另一种方法是迁移学习方法，它旨在通过使用先前任务训练中获得的见解，将它们转移到一个新的相关的任务中。迁移学习可以将小片段组装成更大的类药物分子，无论模型是在片段还是更大的分子上训练的，性能都是大致相似的。强化学习方法已应用于药物设计的多个方向，如生成针对腺苷
    A2A 受体的配体。


    ### （4）递归神经网络


    最初，它们是在自然语言处理领域建立起来的。递归神经网络以顺序信息作为输入。由于以字母序列编码化学结构，递归神经网络已经被用于生成化学结构。为了训练神经网络的语法，递归神经网络用大量的化合物进行训练，这些化合物来自现有的化合物集合，如`CHEMBL`或商业上可用的化合物。结果表明，递归神经网络能够产生大量有效的字符串。


    ### （5）迁移学习


    迁移学习是另一种产生具有所需生物活性的新化学结构的方法。在第一步中，使用网络收集一个大型的训练集。在第二步中，使用具有所需活性的化合物进行训练。不需要额外的训练，它足以使新化合物的产生偏向于被活性分子所占据的化学空间。此方法结合了几种不同的架构，可以探索新的化学空间，生成的分子的性质分布与训练空间的化学空间相似，能够生成有效的、有意义的新结构。


    迁移学习技术被用于微调模型，以产生在结构上类似于聚焦目标的小化合物库。从单个受体结合片段开始，该法使用循环神经网络模型，可以依次生长剩余的分子片段。在微调过程中，该法使用少量的代表性分子，以生成具有类似结构特征的化学子集，用有限数据进行同导联优化。在实际应用中，用于学习分子指纹如何变化的两层编码器，一个用于重建输入的两层解码器，另一个潜在的中间层作为鉴别器。一旦训练阶段完成，该法就可对采样的潜在向量进行解码，生成指纹向量和相应的药物浓度。


    自动编码器方法，在重建质量和处理大数据集方面，可以优于同等结构的变分自动编码器，但代价是失去一些化学空间的覆盖范围。变分自动编码器和自动编码器，作为无监督提取器生成模型，用于预测分子的水溶性。该架构的局限性包括，使用二值化的化学化合物描述符向量，和对化学文库筛选输出指纹有较高的要求。新的自动编码器模型，改进了原始的监督对抗自动编码器架构，允许开发者合并目标和潜在的解纠缠变量，本质上是一个降低复杂程度的过程。


    一种有趣的方法是变分自动编码器，它由两个神经网络、一个编码器网络和一个解码器网络组成。解码器能够将来自该潜在空间的向量转化为化学结构。该特征用于计算模型，寻找潜在空间中的最优解，并通过解码器将这些向量反向转化为真实的分子。对于大多数反向翻译，一个分子占主导地位，但小的结构修饰存在的可能性较小。


    对抗性自动编码器，由一个生成新的化学结构的生成模型组成，具有判别的对抗模型被训练来区分真实的分子和生成的分子，而生成模型则试图掩盖具有判别的分子。在生成模式下，对抗自动编码器比变分自动编码器产生更有效的结构，可以得到一条具有改进的目标特性的分子路径。


    最初的方法只是简单地将标准化的目标变量，连接到一个分子的潜在向量表示上，后期，开发人员提出了两种方法，第一种方法是预测解纠缠，它使用神经网络模型来学习，并去除冗余变量。第二种方法是联合解纠缠，它训练网络来区分真实的
    z 和 y 变量对，以及噪声对和 y 变量的影应。


    分子结构的产生，不是产生一个原子一个原子的分子序列，这可能会导致无效的冗余分子。在生成阶段，它在深度优先搜索中逐节点生成一个连接树，在每个点，评估任何给定的节点是否应该有子节点，如果有，添加它们并预测它们的子结构标签。在这个过程完成后，对与每个子结构标签相匹配的子结构，进行评分和放置，从而得到一个完整的分子。如果连接图中没有有效的候选节点，则对新节点重复此过程。作为这个过程的一部分，价规则被用来帮助确保测试集上构建有效的分子。作为一个扩展，其可以对潜在空间训练药物可能性预测器进行定量估计，并使用该预测器，指导采样轨迹，对药物可能性评分生成的分子进行更高的定量估计。


    先导结构的确定，依赖不同的目标特性，如特定蛋白质的活性、溶解度，或制备难易度。基于人工智能的虚拟筛选，结合体外合成并测试，具有中等的活性和靶标选择性，显示了具有新颖结构候选药物的潜力。


    但是，这些方法并非没有问题。训练模型生成服从化学逻辑的新颖结构，但要满足所有期望，仍然是一项具有挑战性的任务。正在研究的架构组合，结合相关领域的新想法，可以帮助完成诸如与特定支架生成类似物、提高药物成药性、合成可行性以及合理设计等多种任务。在基于人工智能的从头药物设计领域，几乎所有的生成模型，没有考虑目标蛋白质的结构信息，尽管存在用于预测蛋白质-配体结合亲和力的包含蛋白质结构信息的例子。最常用的技巧是利用小分子活性，采用额外的对抗性方法或强化学习方法，来引导生成过程达到特定期望的标准。


    人工智能的概念诞生于 20 世纪 70 年代，在`QSAR`研究提出后被用于药物发现。在药物发现的早期阶段，用于模型开发的常用计算方法是线性回归。在这些早期的研究中，用于建模的化学描述符也仅限于化学结构特征，如原子类型和碎片描述符。


    人工智能在药物发现方面的进步首先是由于新型化学描述符的发展，如拓扑描述符和分子指纹，这大大增加了从训练集计算出的描述符的大小或类别。


    分子指纹包括有限的拓扑距离、官能团的基本物理化学参数及复杂的多点三维药效团排列，在长度和复杂性上差异很大。这一事实使拓扑指纹对于将化合物聚在一起特别有用，类似于药物化学家如何将化合物划分为结构相关的组。结构关键指纹将预定义的功能组、子结构或片段联系起来。药效团指纹通常聚焦于三联体或四联体特征，将药效团特征分配给单个原子或一组原子。


    机器学习不是使用所有可用的描述符，而是将描述符选择集成到建模过程中，如遗传算法和模拟退火。机器学习没有使用线性回归，而常用的建模研究是基于非线性建模算法的，如支持向量机和随机森林。同时，机器学习更强调模型验证，将其视为建模的必备组成部分。使用这些新的机器学习方法开发的模型，需要通过交叉验证、外部验证或实验验证进行验证。


    近年，除了人工智能的发展，硬件的计算能力和可用的建模数据得到了显著的提高，促进了药物设计的进一步发展。早期，通过简单的算法对小训练集的计算建模，不需要显著的计算能力。计算能力的进步和药物生物数据的可用性使新的建模技术的应用成为可能。


    人工神经网络方法形成了数百个人工神经元，这些神经元以网络的形式与量化权重相连。单个神经元可能在预测输出方面有一些有效性，但实际的预测是由数百甚至数千个神经元组成的网络做出的。由于人工神经网络从输入数据中学习，因此它们代表了一种优秀的机器学习方法，用于构建变量和目标生物活动之间的非线性关系。使用各种机器学习方法的先进人工神经网络，需要强大的计算能力。


    基于深度神经网络的多任务学习是一种允许同时对多个相关任务进行建模的方法，通过多任务学习对几个生物相关终点进行建模，分析共享相似机制的生物活性，用于药物发现。通过减少过拟合、解决偏数据问题和从相关任务中识别变量，该法已经显示出优于传统`QSAR`模型的性能。


    这些深度神经网络模型的高性能展示了使用深度学习方法来建模大数据集和选择有意义的特征的优点。然而，深度学习和机器学习建模之间的比较结果好坏参半。深度学习是一个全新的正在应用于计算机辅助药物发现的概念，因此没有选择相关建模参数或构建建模工作流程的通用标准。


    ## 4.4 人工智能改造传统的药物设计


    ### （1）分子动力学模拟


    多年来，计算方法在药物设计和发现中发挥了重要作用，改变了药物设计的整个过程。然而，许多问题，如时间成本、计算成本和可靠性，仍然与传统的计算方法有关。人工智能有可能消除计算药物设计领域的所有这些瓶颈，它还可以增强计算方法在药物开发中的作用。此外，随着基于机器学习的工具的出现，确定靶蛋白的三维结构变得相对容易，这是药物发现的关键一步，因为新药是基于蛋白质的三维配体结合环境设计的。


    此外，量子力学用于在亚原子水平上确定分子的性质，以及用于估计药物开发过程中蛋白质与配体的相互作用。量子力学在计算上非常昂贵和苛刻，这会影响其准确性，这时需要使用传统的计算技术。


    有了人工智能，量子力学可以变得更加用户友好和有效。`SchNOrb`，一种深度学习驱动的工具，可以准确预测有机分子的分子轨道和波函数。有了这些数据，就可以确定分子的电子性质、分子周围化学键的排列以及反应位点的位置。因此，`SchNOrb`可以帮助研究人员设计新药。此外，分子动力学模拟分析了分子在原子水平上的行为和相互作用。在药物发现中，分子动力学模拟用于评估蛋白质-配体相互作用和结合稳定性。分子动力学模拟的一个主要问题是它可能非常困难和耗时。人工智能具有加速分子动力学模拟过程的能力。执行分子动力学模拟可计算将
    15000 个小分子从水转移到环己烷的自由能，从而使用这些自由能和一些其他原子特征来训练 3D 卷积网络和空间图卷积神经网络。研究人员发现，与分子动力学模拟计算相比，经过训练的神经网络预测转移自由能的精度几乎一致。这说明机器学习技术可以即兴发挥并加快分子动力学模拟，但实现这一点需要大量的训练数据。


    `AlphaFold`分两步预测蛋白质的 3D 结构：首先，使用卷积神经网络将蛋白质的氨基酸序列转换为距离矩阵和扭角矩阵。其次，使用梯度优化技术将这两个矩阵转换为蛋白质的三维结构。同样，哈佛医学院也设计了一种基于深度学习的工具，该工具将蛋白质的氨基酸序列作为输入，并生成其三维结构。该模型被称为递归几何网络，使用单个神经网络来计算连接不同氨基酸的化学键的键角和旋转角，以预测给定蛋白质的三维结构。


    `PISTON`就是一种可以使用自然语言处理和主题建模预测药物副作用和药物适应症的工具。`DisGeNET`是一个文本挖掘驱动的数据库，包含了大量关于基因疾病和变异疾病关系的信息。`DisGeNET`中的数据可以分析各种生物过程，如药物不良反应、与疾病有关的分子途径、药物对靶点的作用。`STRING`也是一个文本挖掘驱动的数据库，包含各种生物体的蛋白质-蛋白质相互作用的无数信息。`STITCH`是另一个文本挖掘驱动的数据库，其中包含蛋白质和化学物质/小分子之间相互作用的信息。`STICH`中的信息也可用于确定药物的结合强度和药物-靶标的关联性。


    ### （2）人工智能在初级和次级药物筛选中的应用


    人工智能是一项非常成功且要求很高的技术，因为它节省了时间，而且成本效益高。通常，细胞分类、细胞分选、计算小分子的性质、在计算机程序的帮助下合成有机化合物、设计新化合物、开发分析方法和预测目标分子的
    3D 结构是一些耗时且令人厌倦的任务，在人工智能的帮助下，这些任务可以被缩减，从而加快药物发现的进程。初级药物筛选包括通过人工智能技术的图像分析对细胞进行分类和分选。


    许多使用不同算法的机器学习模型，可以非常准确地识别图像，但在分析大数据时却变得力不从心。


    '
