- raw: '首先，为了对目标细胞进行分类，需要训练机器学习模型，使其能够识别细胞及其特征，这基本上是通过对比目标细胞的图像来完成的，从而将其与背景分离，提取具有不同纹理特征的图像，并通过主成分分析进一步降维。一项研究表明，最小二乘支持向量机的分类准确率最高，为95.34%。关于细胞分类，机器需要快速从给定样本中分离出目标细胞类型。图像激活的细胞分选是最先进的设备，可以测量细胞的光学、电学和机械性能。


    二次药物筛选包括分析化合物的物理性质、生物活性和毒性。熔点和分配系数是控制化合物生物利用度的一些物理特性，也是设计新化合物的关键。在设计药物时，可以使用不同的方法进行分子表征，如分子指纹、简化分子输入线输入系统和库仑矩阵。


    这些数据可用于深度神经网络，深度神经网络包括两个不同的阶段，即生成阶段和预测阶段。虽然这两个阶段都是通过监督学习单独训练的，但当它们被联合训练时，偏差可以应用于输出，并为特定属性赋值。


    整个过程可用于强化学习。匹配分子对已被广泛用于构效关系研究。匹配分子对与候选药物的单一变化有关，这进一步影响了化合物的生物活性。除了匹配分子对，该法还使用了其他机器学习方法，如深度神经网络、随机森林和梯度增强机来进行修改。现已知，深度神经网络比随机森林和梯度增强机能够更好地进行预测。随着ChEMBL、PubChem和ZINC等公开数据库的增加，我们可以访问数百万种化合物，注释它们的结构、已知靶标和可购买性等信息。匹配分子对以及机器学习可以预测生物活性，如口服时间、清除率和作用机制。


    （3）人工智能在药物开发过程中的应用。


    药物发现和开发过程中，最艰巨和最令人沮丧的步骤是，识别存在于千万分子数量级的巨大化学空间中的合适且具有生物活性的药物分子。此外，药物的发现和开发过程被认为是一个耗费时间和成本的过程。最令人无奈的是，超过九成的药物分子通常无法通过Ⅱ期临床试验和其他监管批准。


    上述药物发现和开发的局限性，可以通过实施基于人工智能的工具和技术来解决。人工智能参与药物开发过程的每个阶段，如小分子设计、药物剂量和相关疗效的鉴定、生物活性的预测、蛋白质-蛋白质相互作用、蛋白质折叠和错误折叠的鉴定、基于结构和配体的可视化筛选、构效关系建模、药物再利用、毒性和生物活性特性的预测，以及药物化合物作用模式的鉴定。


    1）多肽的合成和小分子的设计。


    多肽是一种2～50个氨基酸的生物活性小链，它们能够穿过细胞屏障并到达所需的靶位点，因此越来越多地被用于治疗目的。近年来，研究人员开发了多种基于不同方法的人工智能平台，以发现更有价值的多肽结构。


    Deep-AmPEP30，一种基于深度学习的平台，可用于短抗菌肽的生物活性的预测。DeepAmPEP30是一种卷积神经网络驱动的工具，可从DNA序列数据中预测短抗菌肽，以及在胃肠道中的真菌病原体光滑乳杆菌的基因组序列中鉴定新的抗菌肽。


    IAMPE，是一个用于鉴定抗菌肽的网络服务器，它集成了基于抗菌肽13C-NMR特征和肽的物理化学特征，作为机器学习算法输入，以鉴定新的抗菌肽。


    ACP-DL，是一种基于深度学习的工具，用于发现新型抗癌多肽。ACP-DL使用长短期记忆算法，这是递归神经网络的改进版本，用于区分抗癌多肽和非抗癌多肽。


    此外，分子量非常低的小分子与多肽一样，也在使用基于人工智能的工具进行设计。GENTRL是一种基于生成张量强化学习的小分子从头设计工具，基于此工具，人们发现了一种新的DDR1激酶抑制剂。


    2）生物活性剂的预测与药物释放监测。


    确定生物活性配体是为特定靶点选择强效药物的关键步骤。现在，药物化学家正在利用人工智能来确定可用于与疾病相关的特定靶点的生物活性化合物。药物成药性的设计和监测是一个乏味而耗时的过程。伴随人工智能的发展，出现了多种在线工具来分析药物释放，并预估选定的生物活性化合物的药理作用。基于化学特征的药效团适用此种评估方法。这些模型构建了包括通过计算得到的化合物，以及已有报道的实体结构所组成的大型三维数据库。研究人员可使用可视化筛选，以研究基于配体的化学特征。


    除了筛选有效的生物活性剂外，另一个关键的工作领域是成药的可能性及其释放后的相互作用。药物不良反应，是由给药引起的意外的、有害的、致命的副作用。不良反应是药物开发中的一个主要挑战，在药物开发的初期阶段识别可能的不良反应，使药物开发过程更加稳健和有效已变得至关重要。最近，研究人员在不同药物上市供公众使用之前，使用人工智能来确定与这些药物相关的可能不良反应。


    SwissADME是一个可自由访问、用户友好的图形界面，用于评估药物的兼容性及其药代动力学作用。其数学模型也已应用于药物发现，最常见的实践之一是计算所选或筛选的生物活性分子的载药能力。


    3）基于结构和配体的虚拟筛选。


    在药物设计和药物发现中，可视化筛选是计算机辅助药物设计的关键方法之一。可视化筛选是指识别一种与药物靶点结合的小化合物。可视化筛选是一种从化合物库中筛选出有前景的治疗化合物的有效方法。因此，它成为高通量筛选的重要工具，这带来了高成本和低准确率的问题。通常，有两种重要类型的可视化筛选，即基于结构的可视化筛选和基于配体的可视化筛选。


    基于配体的可视化筛选取决于活性和非活性配体的化学结构和经验数据，该数据利用活性配体的物理化学和化学相似性来从具有高生物活性的化合物库中预测另一个活性配体。然而，基于配体的可视化筛选不依赖靶蛋白的3D结构，因此，在靶结构或信息缺失的情况下实施该方法，所获得的结构精度低。另外，基于结构的可视化筛选已经在通过体外或体内实验，或通过计算建模阐明蛋白质或靶标的3D结构信息的情况下实现。


    通常，该方法用于预测活性配体或其相关靶标之间的相互作用，并预测参与药物靶标结合的氨基酸残基。与基于配体的可视化筛选相比，基于结构的可视化筛选具有较高的精度和精密度。基于结构的可视化筛选与致病蛋白数量增加及其复杂构象有关。


    为了将机器学习用于可视化筛选，应该有一个由已知的活性和非活性化合物组成的过滤训练集。这些训练数据可使用监督学习技术来训练模型。然后对训练后的模型进行验证，如果它足够准确，则将该模型用于新的数据集，以筛选针对目标具有所需活性的化合物。之后，入围的化合物可以进行ADMET分析，然后在进入临床试验之前进行各种生物测定。因此，机器学习有能力加快可视化筛选的速度，使其更加有效，甚至可以减少可视化筛选中的误报。对接是基于结构的可视化筛选中应用的主要原则，人们已经开发了几种基于人工智能和机器学习的评分算法，如NNScore、CScore、SVR
    Score和ID Score。


    机器学习和深度学习方法，如随机森林、支持向量机、卷积神经网络和浅层神经网络，已经被构建来预测基于结构的可视化筛选中的蛋白质-配体亲和力。此外，基于人工智能的算法已被开发用于基于结构的可视化筛选中的分子动力学模拟分析。另外，基于配体的可视化筛选由几个步骤组成，每个步骤都会提出新的基于机器学习和深度学习的算法，以加快过程并提高可靠性。例如，人们已经构建了几种基于机器学习和深度学习的算法来准备有用的诱饵集，如高斯混合模型机器学习和深度学习、隔离林和人工神经网络。


    目前已出现为基于结构的可视化筛选构建的机器学习模型，如PARASHIFT、HEX、USR和ShaPE算法。随着人工智能算法在医疗保健和制药行业的兴起，基于结构的可视化筛选和基于配体的可视化筛选都开发了不同的工具和模型，如TiOpenScreen、FlexX-Scan、CompCore、PlayMolecule、METADOCK和AutoDock
    Bias等工具。


    随着化合物库的不断扩大，寻找潜在的配体，就像大海捞针。因此，基于结构的可视化筛选和基于配体的可视化筛选，最大限度地降低了鉴定针对致病靶点的潜在治疗化合物的复杂性。此外，基于结构的可视化筛选和基于配体的可视化筛选中基于人工智能的模型使其更简单，具有高精度和高精密度。


    4）分子设计。


    在药物研究过程中，人们经常问的一个问题是：哪些化学结构会引发所需的性质特征。从头分子设计可以将预测模型和分子相似性等优化参数与分子生成和搜索相结合，以模拟设计-制造-测试整个研发周期。然后，这些计算机设计循环提供候选解决方案的列表，这些候选解决方案确定了为对所定义的轮廓最佳的化学结构。然而，在这些候选者的合成易处理性方面仍然存在重大挑战。


    最近发表的一种分子设计方法，应用进化的类似物来针对一组定义的目标优化化学结构，从而产生具有所需轮廓的结构，称为多参数优化。片段的多目标自动替换算法，通过初始化候选结构的群体来进行，对候选结构进行迭代评估、采样和评分，以针对感兴趣的结构轮廓进行优化。碎片的多目标自动替换算法使用一个由已知合成有机化学衍生的构建块数据库，称为合成断开规则，其中保留了每种结合模式和出现频率。


    此外，一种称为拓扑结构快速对齐的新算法，可选择替换子结构，以同时平衡对替换的探索，最大限度地减少对候选结构中包含的信息的破坏，由于其用于生成分子构建块列表的方法，间接考虑了合成可行性。鉴于化学结构的多样性与反应规则的复杂性，这种合成可行性的衡量标准绝不适用于所有情况。


    解决化合物合成自动化设计中所面临挑战的一种方法是，使用基于合成规则的模型，该模型将标准合成偶联构建块组合在一起。然而，这些方法往往限制了对相关化学空间的探索。


    上面提到的计算模型，大多是在已知药物化学空间的分子结构的数据集基础上训练的，可以看作是对数据集中分子分布的学习。从这种分布来看，这些方法，允许从化学空间中采样新分子。最近，许多网络神经生成方法被提出并用于分子设计，其中递归神经网络表现最突出。然而，合成线的可行性需要在人工智能领域进一步完善。


    活性分子设计领域的研究表明，没有一种方案能解决所有方向的问题，因此需要不断地了解那些与合成和药理测试进展最相关的化学结构，据此不断地探索和改善相关的化学空间，或者说是药效团。这一过程中，最大的挑战是预测的可靠性，例如生物活性。优化化合物的生物活性以及毒性，是药物发现中最耗时、最昂贵的任务，也是一个关键、不可或缺的数据，因为它是药物的一项关键属性。


    5）合成路线设计。


    设计新化合物的合成需要专业知识、经验和创造力。药物化学家现在可以合成他们想要的几乎所有东西，但有些化合物的复杂程度远超人们的想象。从头设计可以很容易地在数百万种化学结构中筛选到潜在的治疗药物，却只能提供制造它们的原因，而未指出如何实现它们。计算机辅助合成，可在两个方面提供帮助，包括提供替代路线或帮助优先考虑容易合成的化合物。


    计算机辅助合成最近取得了突破性进展，即使用转换规则和启发式方式，从目标结构不断拆分，以寻找最优的合成路线，现在也被称为逆合成分析。机器学习甚至可以在没有特定输入的情况下，从化学反应数据中自主学习有机化学的规则。该法使用深度神经网络，首先让机器学习专注于最有前途的反分析规则，然后将其与现代蒙特卡洛树搜索算法相结合，进行反应预测。一项双盲研究发现，这种方法产生的路线与文献中的路线相同。


    人工智能也被用于升级合成路线设计，该路线为确定感兴趣分子的最佳合成途径。Chematica（SYNTHIA）是一个基于决策树的程序，可为所需分子设计新的合成途径，其包含上百万种已知分子和化学反应。通过利用由100000多个手动编码的反应规则驱动的先进算法，该工具可细化筛选逆向合成可能性，同时检查已完成的工作、可以完成的工作以及可用的起始材料。化学家只须把目标分子输入Chematica就能得到基于成本、底物易得性、步骤数筛选出的反应路线，这一切仅仅需要数秒。每一步反应及产物都会基于两个方程进行评分：反应评分函数和化合物评分函数。


    AiZynthFinder是基于人工神经网络的一种开源工具，利用蒙特卡洛树搜索进行逆向合成规划，进行基于Jupyter notebook的逆合成分析，简洁快速。ICSYNTH是另一种可以通过使用机器学习模型生成的化学规则集合来产生新的化学合成途径的工具。


    此外，还出现了各种基于文本挖掘的工具，这些工具可以帮助传统的药物发现过程。文本挖掘使用自然语言处理等方法将各种文献和数据库中的非结构化文本转换为结构化数据，对这些数据可以进行适当的分析以获得新的见解。自然语言处理是人工智能的一个分支，它允许计算机，通过基于人工智能的算法，处理和分析语音和文本等人类语言。利用这种人工智能驱动的技术，人们开发了各种基于文本挖掘的工具。


    药物化学的研究工作和药物发现的结果形成一个闭环，相互支持，形成“设计—制造—测试—设计”的循环，其中设计的化合物必须经过合成和实验测试，为进一步的决策提供反馈。显然，这一过程相对缓慢和昂贵。生成实验数据可能需要数周时间才能做出新的设计决策。使用“分子设计”部分中描述的方法生成具有适当轮廓的候选药物，甚至指导如何制备新结构，无疑将简化这一过程。


    因此，应用主动学习，可以有效地决定下一个要标记的数据点，或要合成和测试的新结构。模型主动学习是机器学习的一个领域，这种方法的预期优势之一是能够同时预测将推进项目的化合物，但也能更快地确定应该合成的化合物以改进模型。模型中的这种改进可以间接地促进和简化药物发现过程，因为主动学习模型将更快地改进质量预测。


    鉴于此，在药物发现的主动学习方面，已有了一些科学努力和探索，但这仍然是一个有待大量投资的领域，以证明其对于制造和测试已鉴定化合物的价值。要想从药物化学家那里获得信心，挖掘出具有潜在成药性，并最终筛选出治疗药物，这是一项艰巨的工作。因此，人工智能和机器学习不仅直接关联到药物发现，还与依靠此系统合成和测试化合物的科学家的支持有关。


    尽管许多人工智能与机器学习方法在药物推向市场方面尚未取得成果，但可以预见，它们将会在药物发现过程中变得更加不可或缺。通过应用新的和有前景的技术，其可以有效地设计新的化学结构，预测所需的分子性质，甚至设计合成这些化合物的路线。它正在成为一场完美的科技风暴，将不同药物研究领域推向它们的顶峰。


    6）药物剂量和给药效果。


    给患者服用任何剂量的药物，都可能导致不良和致命的副作用，因此确定用于治疗目的的安全药物剂量是至关重要的。多年来，确定一种药物的最佳剂量是一项艰巨的挑战，以期药物可以在最小毒副作用的情况下达到预期效果。


    随着人工智能的出现，许多研究人员正在借助机器学习和深度学习算法来确定合适的药物剂量。AI-PRS是一个基于人工智能的平台，借助神经网络驱动的方法，通过抛物线反应曲线将药物组合和剂量与疗效联系起来，以确定通过抗逆转录病毒疗法治疗艾滋病毒的最佳剂量和药物组合。此项研究发现，对10名HIV患者联合使用替诺福韦、依非韦伦和拉米夫定，在适当的时候，替诺福维尔的剂量可以减少起始剂量的33%，而不会导致病毒复发。使用AI-PRS也可以找到治疗其他疾病的最佳药物剂量。


    ## 4.5　计算建模应用


    （1）模型构建（图4-2）。


    在药物发现过程中，应用某个特定的人工智能算法，是一个连续的过程，需要正确地定义要解决问题的领域。这个过程通常包括问题定义、数据准备、人工智能架构的设计、模型培训和评估，以及理解和解释结果。


    ![](Images/figure_0100_0021.jpg)


    图4-2　模型构建


    更具体地说，在做出任何特定的体系结构决策之前，我们应该清楚手头的问题，因为机器学习方法的选择应该适用于正在研究的问题。首先，我们需要知道这个特定的问题是属于鉴别任务还是生成任务的领域。考虑到人工智能建模的任务，下一步是设计一个合适的模型体系结构。


    这一步包括选择一个合适的算法，并为超参数设置合理的初始值。对于鉴别性任务，随机向量机、随机森林和人工神经网络是迄今为止最常用的算法。各种模型可用于生成任务，如深层信念网络、生成性对抗网络、变分自动编码器和自动编码器等。一般来说，神经网络是这些任务的首选算法，因为它们具有泛化和假设的近似任何输入输出关系函数的能力。超参数因不同的人工智能算法而异。神经网络的结构参数，包括但不限于神经元和层数的选择、学习率和衰减、正则化参数以及神经元，或相邻层之间的连接。


    确定临时架构之后，接下来准备数据集。初始数据的代表性、质量和数量对人工智能模型的质量有至关重要的影响。一旦建立了初始架构和数据集，就可以继续进行模型训练和评估。


    训练步骤旨在搜索一组参数，目的是最小化预测误差。最终的人工智能模型应该有能力表达分子表征，发现特定目的之间的潜在关系。如果做不到，那么检查特定的例子可以帮助开发者开发新模型“生态系统”来实现目标。


    （2）输入数据准备。


    人工智能方法，在药物发现项目中的应用，倾向于通过重点部署最新的人工智能方法来改进模型的整体性能。首先，集中训练数据往往更有帮助，因为它是支撑所有进一步进展的基础。无论选择什么模型，高质量的数据通常会有更好的泛化性能。然而，数据准备是一项任务量大并相当艰苦的任务。


    开发者需要了解训练数据的起源和意义，例如，所表示的实体的类型和复杂性、数据的数量，以及更具体地说，它们在化学空间中的分布。总的来说，问题是要如何更好地填充可能的输入空间。如果对更多数据需求明显，就必须决定预处理策略、未标记数据是否足够，哪样的表示对编码所代表的实体最有用等。需要注意的是，没有一条规则是普遍适用的。


    在药物发现过程中，药物化学领域要构建人工智能模型的输入（x）或输出（y）的数据类型。药物设计中最常用的输入数据类型是固定长度的输入向量。然而，这种类型的表示存在两个主要局限性。这样的向量往往相当大，可以编码所有可能的子结构而没有碰撞，这导致模型具有过多可学习的参数，试图从相对稀疏的输入中学习。在这样一个高维化学空间中的相似性评估，容易出错。为了缓解这一问题，人们利用可微神经网络计算输入的分子结构图，提出了各种类型的指纹图谱。


    另一个限制是，由于难以在输入向量和分子结构之间建立一对一的对应关系，输入向量可以很容易地从分子结构生成，但从向量反向推导结构是一项极其困难的任务，特别是当单一指纹表示可能对应于多种可能的化学结构时。


    避免这种限制的一种方法是，使用人工智能深度生成模型作为分子表示。近年来，这种组合已经有了广泛的研究，以产生具有预期特性的新化合物。在这种情况下，输出数据要么是字符串，要么是指纹向量。大多数其他人工智能辅助药物发现项目的输出数据为数值，二元值对应于二元分类、多类分类的整数值，以及回归任务中涉及的实值数字，通常是实验生化数据。


    应特别注意初始数据的代表性和基数。如果数据集的大小不能代表底层的延迟任务，那么训练过程往往会产生过拟合，并出现条件较差的平均误差，这两者都增加了给定模型无法真正泛化到新数据的可能性。


    首先应确定训练集性能是否有效，如果训练集的性能不可接受，那么所选择的体系结构很可能无法工作。如果在调整或尝试其他架构后，仍然没有看到改进，那么可能是时候考虑训练数据的质量，并检查训练分布是否平衡，输入输出对应是否符合逻辑。


    如果训练集的性能可以接受，则应检查测试集的性能。如果训练集和测试集性能之间的差距令人难以接受，那么收集更多的数据将是最有效的解决方案之一。此时关键的考虑因素，包括收集更多数据与以其他方式提高测试集性能相比的相对成本，以及预期显著提高测试集性能所需的数据量。'
