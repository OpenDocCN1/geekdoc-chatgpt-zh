- raw: '心智与世界割裂开来的理论预设间接地导致认知主义将心智视作一个计算系统，大脑的计算等同于数字计算机的计算，人的智能正是凭借控制内部信息处理的输入和输出规则得到解释。这种规则只是纯粹形式的句法理论，它的意义只产生于符号自身的因果效力，也就是说，意义是内在的，而不是由外在的世界所赋予的。在认知主义和联结主义的视域中，世界（环境）是和主体对置并被给予的认知材料，忽视了主体与客体之间的一切情境性关联。[^(\[17\])](#chapter002.html#m17)世界就像一个巨大的、由原始的物质材料堆砌而成的东西，人的大脑作为中央处理器将全部由感官刺激产生的感觉经验加以形式化，形成符号以便进行操作计算，因此，世界类似于一个可以随时供主体取用的数据库，两者之间的关系是平行的，通过形式化的表征进行勾连。然而，这样带来的潜在问题是我们能否对世界进行可靠性表征？换言之，我们能否借助表征的利刃撕裂现象的帷幕，从而精确地把握实在本身？主体与作为客体之世界之间的对峙产生了解释鸿沟，这个问题从近代以来便困扰着哲学家。休谟说道，“我们既然假设，心与物是两种十分相反，甚至于相矛盾的实体，所以物体究竟在什么方式下来把它的影像传达到心里，那真是最难解释的一件事”。[^(\[18\])](#chapter002.html#m18)康德则是在休谟的启发下直面这个问题，通过所谓的“哥白尼革命”区分了现象与物自体，虽然他为人类理性划定了地盘，人的知性能力只可以触碰现象世界而无法认知超出现象之外的事物，但是由于坚持表征是主体认知世界的唯一方式，所以在康德那里，心智与世界仍然是断裂的，世界的本来面目依旧遥不可及。然而人类理性自身具有的能动性以及巨大求知欲不可能满足于只认识现象，我们依然会不遗余力地去追问、考察那些永远无法放弃的东西，正如康德所言，“幻相的大本营……在不停地以空幻的希望诱骗着东奔西闯的航海家去作出种种发现，将他卷入那永远无法放弃、但也永远不能抵达目的之冒险”。[^(\[19\])](#chapter002.html#m19)我们认为，要摆脱这种困境有两种方法：一是跳出“我”的牢笼，立足于上帝视角审视认知主体与世界的关系；二是放弃笛卡尔的主客二分原则，摒弃主—客对立的本体论预设或前提，放弃唯表征论但不放弃表征，表征不是我们认识对象世界的唯一方式和途径。第一种似乎是抛却表征最为彻底的方法，但在我们看来这只是形而上学的想象，人不可能超出自身的限制去认识对象，这样的超越只会发生在意识中，由“我思”来进行，我们作为有限的存在者并没有这样的知觉经验，至多只是头脑中的虚幻设想。第二种方法相对来说更为可行，海德格尔对“此在”“在世存在”的揭示为人们超越主客二分的表征之路提供了启示，即“在传统的沉思、表征、计算之上，补充实践、操作、交互，以一种替代和开放的方案来实现心智与世界的勾连”。[^(\[20\])](#chapter002.html#m20)


    在海德格尔看来，我们作为“此在”是被抛入世界之中的，“被抛”这一生存论现象具有强制性、不可选择性，“此在”始终与世界具有一种因缘关系。人不可能作为没有身体的精神或纯粹的先验自我而存在，因为他已被投入一个先在的世界，必定要与其他“此在”以及非“此在”的存在者产生关联，这种相关的前提条件是“此在”存在于世界之中，且这种关联首先是存在关系，而非认知关系。我们在前述中提到，认知主义和联结主义并非完全搁置世界或环境的影响，也不完全否认认知对环境的依赖，关键在于世界（环境）在二者的眼中是否具有交互的意义，即它在人类认知中能否充当积极的角色，能否对人的认知活动产生某种主动、有效的反馈。笛卡尔式认知科学基于内在主义的立场把认知与世界相分离，将世界视作消极、次要的环节，然而世界是变动不居的，赫拉克利特说过，“人不能两次踏进同一条河流”，主体的行动在某种程度上也可能造成世界（环境）的扰动，传统认知科学主张的物理符号系统并不能将世界完全形式化，无力处理由世界的变动所产生的巨量信息，人却可以灵活地应对这些变动，因而也就无法实现对人类认知的实质模拟。在这个意义上，智能主体不可能也不能够在世界与自身之间画下严格的界线，人的认知需要世界（环境）的积极参与和反馈，两者间不存在勾连的问题，因为主体本身就“在世界之中”，而这正是海德格尔的“在世存在”最为根本的观点，“在世存在”就是人（此在）的基本建构。


    ### 二 心身二分导致认知与身体的割裂


    第一代认知科学研究范式将人的认知活动描述为基于规则对符号的操作与计算过程，将人脑类比为数字计算机，基于功能主义假设的认知主义提倡的是一种离身认知，身体只是作为认知的承载者而持存，本身不参与认知过程。作为联结计算心智理论的联结主义也只是模拟生物大脑的神经网络活动，依然不涉及身体。在我们看来，认知主义和联结主义将身体排斥在外的一个原因在于它们继承和发扬了笛卡尔理性主义哲学传统。笛卡尔认为，人区别于物的关键就在于其全部本质是思维，“而另一方面，我对于肉体有一个分明的观念，即它只是一个有广延的东西而不能思维，所言肯定的是：这个我，也就是说我的灵魂，也就是说我之所以为我的那个东西，是完全、真正跟我的肉体有分别的，灵魂可以没有肉体而存在”。[^(\[21\])](#chapter002.html#m21)身体是广延，属于物质的范畴，永远是可分的，但是思维是单一、完整的东西，是不可分的。在笛卡尔看来，身体某一部分的缺失并不会影响精神的认识能力，“尽管整个精神似乎和整个肉体结合在一起，可是当一只脚或者一只胳膊或别的什么部分从我的肉体截去的时候，肯定从我的精神上并没有截去什么东西”。[^(\[22\])](#chapter002.html#m22)故愿望、感觉和想象等认识活动只是精神的事，与身体无关，而认知主义和联结主义范式模拟的计算思维则更加不需要身体的参与，符号的计算表征就能解释一切。一言以蔽之，人脑是认知的核心，实现对生物大脑的模拟就可理解人的全部认知活动。


    第一代认知科学研究范式自诞生以来便有着恢宏的愿景：基于物理符号系统为人类认知建立模型，人工系统能够模拟智能甚至本身就具有智能或心智。在我们看来，这种抛却身体的离身认知不仅没有实现既定的目标，反而遭遇各种挫折而变得渐行渐远，脱离身体的认知研究面临诸多困境，我们认为主要有两种：①不能正确理解人类认知，无法解释情感体验、意志冲动等非理性活动；②不能正确说明认知的形成与演化。


    我们先来考察第一种困境。认知主义的符号研究进路和联结主义的神经网络加工进路皆是采用计算机隐喻来解释人的认知和心理活动的，主张认知活动的本质在于计算，是根据形式系统和算法规则对信息或符号的操作过程。然而无论是哪一种进路，揭示的都是计算的心智（computational
    mind），而非体验的心智（experiential mind）。[^(\[23\])](#chapter002.html#m23)这种计算隐喻只是模拟和描述了人类认知理性的一个方面，一般而言，主体的认知过程往往伴随着情感或情绪状态，即便是常人看来最为理智化的科学实验、逻辑演算等活动也都随附着情绪，只是不轻易为人们所察觉和感知。在我们看来，不存在任何纯粹理性的、不掺杂任何情感要素的认知形式和过程。将认知和心理过程理解为抽象的符号计算剥离了人类认知的现象属性和情绪属性，忽略了认知与情感相互交织这一错综复杂的方式。而且在某种程度上，人是以具身介入世界的方式来理解这个世界的，将情绪和身体感觉排除在认知之外，我们得到的不是稳固的自我意识、开明的决策、明智的道德判断以及有效的社会交互，而是一种精神机能障碍的状态。[^(\[24\])](#chapter002.html#m24)


    另外，抽象的符号计算不能很好地解释人类认知活动中瞬间迸发的、具有创造性、偶然性的突发思维状态，比如灵感。在强人工智能看来，经过恰当编程的计算机具有心智，可以进行理解和其他认知操作，人工神经网络的逻辑运算过程可以涌现出智能。那么，这种严格遵循规则、程式化的计算如何能够产生突现的思维状态呢？日常经验告诉我们，灵感往往是在人们经历长期的艰苦思考，在“百思不得其解”的状态下受到外界因素的偶然刺激而突然涌现的思维状态，灵感本身没有规则，也不遵循规则，具有突现性和不可预测性的特征。图灵式的逻辑推理和计算不会产生灵感，图灵机的整个操作过程都由若干控制命令顺序连接而成，每一步操作都有其控制命令，所以，图灵计算是基于规则的“机械步骤”，无法理解甚至产生灵感。此外，我们认为灵感的产生也离不开身体，得益于主体与世界的交互，牛顿被苹果砸中而发现万有引力，阿基米德在泡澡时发现浮力定律都是凭借身体对外界的接触与感知。人的身体塑造着认知过程，“身体是认知的限制者、认知过程的分配者和认知活动的调节者”，[^(\[25\])](#chapter002.html#m25)因而有着举足轻重的作用，不能轻易地舍弃。


    鲜活、生动的人类经验向我们表明，理性认知不是单纯的逻辑推理和符号操作，而且非理性的意志、欲望和冲动也在为人类构筑认知大厦添砖加瓦，理性和非理性之间不是截然对立的关系。亚里士多德在著作《形而上学》开宗明义地写道，“求知是人类的天性”，追本溯源，这种天性就是求知的欲望和满足自身好奇心的冲动，而意志的冲动往往通过身体表现出来。人们对世界的理解都是从对身体的理解开始，身体是我们与世界打交道的媒介（这是身体的工具性特征）。世界不是一个对象性的存在，不可能被理性认识所穷尽，通达世界的道路，是通过身体去体验、去知觉。[^(\[26\])](#chapter002.html#m26)身体不仅是认知与意识的载体，也是个体活动的核心，然而却被人们有意或无意地“遗忘”了。


    其次，从进化论的角度讲，人的认知、意识与人的身体一样都是自然选择和进化的产物，既不是上帝的恩赐，也不是突如其来的惊喜，它具有独特的自然起源和演化机制。科学研究发现，在人类进化过程中，大脑容量不断增加，在大约200万年的演化过程中，人的大脑体积扩大了三倍，中枢神经系统和大脑额叶的迅速扩张使得大脑的功能越来越复杂、完善，最后出现了抽象思维。同时，躯体的进化改变了人类行为，制造和使用工具以及劳动形式的日益丰富反过来又增强了人的知觉、注意、记忆、思维和想象等认知能力，认知的形成和演化离不开以大脑为核心的身体。直接从高度进化发展的人类大脑和人类现有的认知模式来研究认知、智能和意识，不能从根本上全面解决认知、智能和意识的本质及其演化与发展的基本规律等重大基础问题，我们所能得到的充其量是一些关于人类认知、智能和意识的部分知识而已。[^(\[27\])](#chapter002.html#m27)正如前文所述，单凭认知主义和联结主义远不足以回答关于人类认知本质的全部问题，身体也是认知过程的参与者而非旁观者，认知能力的增强离不开感官系统的进化。即便是没有任何感觉器官的多细胞生物，也是以具身的方式直接与环境进行交互作用，在德雷福斯看来，人与世界的交互往往呈现为一种熟练应对（skillful
    coping）活动，以一种上手、不经意的方式进行着。一部分认知官能已经内化于身体，内在表征植根于身体与外部环境的感官互动过程。我们的一切知识都源于经验，人正是通过视觉、听觉、嗅觉等身体感官系统接收外部世界的大量信息，经验是身体图式对于知觉的汇集。著名人工智能学家布鲁克斯充分考虑了身体对智能的影响，他进行了类人机器人的研究并设计制造了具有类似人的外形的机器人考格（Cog），许多科学家都在进行相关研究，这表明对人类认知的研究与探索离不开身体。人不是天生就具有完备的推理、感官系统，而是长久以来在和复杂多变的环境交互和完成任务的过程中不断发展起来的，布鲁克斯因此指出人类认知和智能具有发展性的特征，既然认知是不断发展、进化的，那么局限于理解、思维等某一阶段的认知层级便不能把握人类认知发展的总体脉络。人的认知和智能的进化离不开身体的运动、感知系统，不考虑身体的因素，就无法正确说明认知的演化与发展，没有身体，人的认知就成了无根之木、无源之水，只能像空中楼阁那样虚无缥缈罢了。


    海德格尔明确地向我们表明，“此在”是“身体式的在世界之中的存在”，身体是人在世界中存在的根本方式，“人类的整体的存在方式只能以这样的方式来把握，它必须被把握为人的身体式的在世界之中的存在”。[^(\[28\])](#chapter002.html#m28)具体就认知而言，一方面，人类认知的生成需要身体来予以保证；另一方面，对人类认知的研究在不触及身体维度的条件下可能无法确保其有效性。毋宁说，如果从存在论现象学的视角来看，人的身体不是某一现成意义上的存在物，比如生物学和医学领域的概念范畴，而是一种动态的身体化。从某种程度上说，这一观念与具身认知的核心立场在本质上并不相通，后者对于身体的构造、感官和运动系统的强调更像是把身体当作一种躯体来看待，将身体加以量化、功能化，强调人的认知过程与身体之间绝对的因果力，致力于身体—认知的因果解释，身体仍被单纯地视为一种当下之物。而从身体作为人（“此在”）之存在方式，认知又是奠基于在世存在的一种方式和途径来看，人的身体与其自身的认知活动的确是不可分割、彼此交织的，谈及在世界中存在，我们就不能否认身体这一要素。因此，认知与身体之间的割裂并不符合“此在”本真的生存状况，笛卡尔的心身二分是有问题的。


    ### 三 并非一切皆可计算


    国内有学者对“计算主义强纲领”的立场作了如下概括：主张物理世界、生命过程甚至人类心智都可计算，整个宇宙都由算法支配。[^(\[29\])](#chapter002.html#m29)依次对应计算主义的三个发展阶段，小到分子细胞，大到天体宇宙皆可归于算法，都可看作自然的计算过程。现如今，计算主义已经被最前沿的科学研究领域奉为一种标准的研究范式和指南，在神经科学、脑科学、人工智能、生命科学等学科领域，计算主义俨然作为标尺指导着一切。有的学者因此认为，计算主义是关于认知或生命的一种哲学理论，不能仅满足于此，它要成为一种普遍的世界观，[^(\[30\])](#chapter002.html#m30)这是计算主义的根本任务和目标，而实现宏大的目标必然会遭遇一系列的难题与困境，计算科学、复杂性科学以及哲学阵营纷纷对之发起挑战。计算主义面临着哥德尔不完备性定理、符号奠基问题以及框架问题的诘难，人们纷纷质疑数字计算机能表现出人类意识的关键特征，即“自主产生和理解语义的能力、表征动态变化的世界的能力，以及意识的最精微和神秘的直觉能力”。[^(\[31\])](#chapter002.html#m31)除此之外，我们认为，计算主义不是放之四海而皆准的先验规则，在面对非理性的欲望、自由意志和审美体验时计算主义的解释力便显得捉襟见肘、十分有限，因此并非一切皆可计算。下面我们分三点予以论证。


    第一，人的非理性活动如意志、欲望、冲动不可计算。在我们看来，计算主义是对理性主义传统新的继承和发展，自巴门尼德区分“真理之路”与“意见之路”以来，理性主义一直在西方哲学史中占据主导地位，牢牢掌握着理解和阐述世界的话语权，成为解决一切问题的根本原则和方法。近代的笛卡尔高举理性主义的旗帜，首次鲜明地提出了机械之身体和自由之心智之间的二元对立，他将人的身体视为一部结构非常精致巧妙的机器：“如果我把人的肉体看作是由骨骼、神经、筋肉、血管、血液和皮肤组成的一架机器，即使里面没有精神，也并不妨碍它跟现在完全一样的方式来运作……”[^(\[32\])](#chapter002.html#m32)笛卡尔坚决否认心智也可视为一部精妙的机器的观点，他的心身二元论彻底堵死了二者的勾连，作为物质的身体只是作为人类心智的载体和容器，它无法产生心智，按照这一逻辑，即便是上帝也制造不出能够产生心智活动的机器，只能对心身之间的关联作出有效或必要的保证。此外，霍布斯认为“推理即计算”，拉美特利则更为激进，提出“人是机器”的口号，认为心理活动就是机械活动，莱布尼兹提出了“普遍语言”的设想，也就是以符号语言系统描述哲学与科学，类似于弗雷格、罗素等人创立的数理逻辑。


    我们认为，从近代的唯理论哲学到现代的逻辑经验主义，再到盛行于认知科学和人工智能领域的计算主义，都关注作为主体之人的理性认识能力，也就是以逻辑方式重构、理解对象物，并将其纳入一种因果的、合规范性的、合目的性的解释框架，以实现对世界的精确性把握。然而，认知的理性主义进路与非理性的情感和意志冲动是相背离的，理性对经验材料进行概括和总结，将通过直观获取的表象抽象为逻辑表征，它体现的是人类认知反思性的方面，都要遵循某种规则，正如逻辑主义之于命题，谓词逻辑推理规则、计算主义之于算法，因而是有条件的、因果的。相反，意志是盲目的，没有理由和目标，也不遵循规则，按照叔本华的说法，它不受根据律的制约，是漫无目的的原创力，因而具有能动性。在我们看来，叔本华的唯意志论有其正确性，在某种意义上揭示出人作为生命存在物的本质特征，人的生存意志先于理性认知，一切认知能力都以意志能力为前提，意志是认知的驱动力。叔本华认为，人认识的是自己所欲求的东西，而不是欲求自己所知的东西，主体正是根据自己的意志来认识自己和对象，这也表明了意志的本质就是欲求和欲望。那么遵循理性主义传统的计算主义能否界定非理性的意志？答案是否定的，也就是说意志不可计算。叔本华将意志看作世界最本原的存在，它不是构成现象世界的因果链条的环节，不服从现象法则，因而意志是自由的。我们可以假设，如果计算主义是正确的，即大脑、生命体以及整个世界（从微观粒子到宇宙星系）皆为一个完备的计算系统，那么，任何实在都可以看作这台超级计算机的计算程序的不同计算结果。也就是说，只要有足够的信息输入，我们便可以计算出任意实体、事件在任意状态下的坐标与趋向曲线，从某种意义上而言，计算主义就是一种决定论，它的计算程序和算法规则具有相当强的因果效力，每一步程式化的运算相当于因果链条中的一个环节，是符号状态之间的因果映射。然而，这样便没有为自由意志留下空间，人有可能再一次陷入因果决定而无自由可言的尴尬境遇。因果关系不具有完满的解释力，计算主义同样做不到这一点。'
  fmt: '

    心智与世界割裂开来的理论预设间接地导致认知主义将心智视作一个计算系统，大脑的计算等同于数字计算机的计算，人的智能正是凭借控制内部信息处理的输入和输出规则得到解释。这种规则只是纯粹形式的句法理论，它的意义只产生于符号自身的因果效力，也就是说，意义是内在的，而不是由外在的世界所赋予的。在认知主义和联结主义的视域中，世界（环境）是和主体对置并被给予的认知材料，忽视了主体与客体之间的一切情境性关联。[^(\[17\])](#chapter002.html#m17)世界就像一个巨大的、由原始的物质材料堆砌而成的东西，人的大脑作为中央处理器将全部由感官刺激产生的感觉经验加以形式化，形成符号以便进行操作计算，因此，世界类似于一个可以随时供主体取用的数据库，两者之间的关系是平行的，通过形式化的表征进行勾连。然而，这样带来的潜在问题是我们能否对世界进行可靠性表征？换言之，我们能否借助表征的利刃撕裂现象的帷幕，从而精确地把握实在本身？主体与作为客体之世界之间的对峙产生了解释鸿沟，这个问题从近代以来便困扰着哲学家。休谟说道，“我们既然假设，心与物是两种十分相反，甚至于相矛盾的实体，所以物体究竟在什么方式下来把它的影像传达到心里，那真是最难解释的一件事”。[^(\[18\])](#chapter002.html#m18)康德则是在休谟的启发下直面这个问题，通过所谓的“哥白尼革命”区分了现象与物自体，虽然他为人类理性划定了地盘，人的知性能力只可以触碰现象世界而无法认知超出现象之外的事物，但是由于坚持表征是主体认知世界的唯一方式，所以在康德那里，心智与世界仍然是断裂的，世界的本来面目依旧遥不可及。然而人类理性自身具有的能动性以及巨大求知欲不可能满足于只认识现象，我们依然会不遗余力地去追问、考察那些永远无法放弃的东西，正如康德所言，“幻相的大本营……在不停地以空幻的希望诱骗着东奔西闯的航海家去作出种种发现，将他卷入那永远无法放弃、但也永远不能抵达目的之冒险”。[^(\[19\])](#chapter002.html#m19)我们认为，要摆脱这种困境有两种方法：一是跳出“我”的牢笼，立足于上帝视角审视认知主体与世界的关系；二是放弃笛卡尔的主客二分原则，摒弃主—客对立的本体论预设或前提，放弃唯表征论但不放弃表征，表征不是我们认识对象世界的唯一方式和途径。第一种似乎是抛却表征最为彻底的方法，但在我们看来这只是形而上学的想象，人不可能超出自身的限制去认识对象，这样的超越只会发生在意识中，由“我思”来进行，我们作为有限的存在者并没有这样的知觉经验，至多只是头脑中的虚幻设想。第二种方法相对来说更为可行，海德格尔对“此在”“在世存在”的揭示为人们超越主客二分的表征之路提供了启示，即“在传统的沉思、表征、计算之上，补充实践、操作、交互，以一种替代和开放的方案来实现心智与世界的勾连”。[^(\[20\])](#chapter002.html#m20)


    在海德格尔看来，我们作为“此在”是被抛入世界之中的，“被抛”这一生存论现象具有强制性、不可选择性，“此在”始终与世界具有一种因缘关系。人不可能作为没有身体的精神或纯粹的先验自我而存在，因为他已被投入一个先在的世界，必定要与其他“此在”以及非“此在”的存在者产生关联，这种相关的前提条件是“此在”存在于世界之中，且这种关联首先是存在关系，而非认知关系。我们在前述中提到，认知主义和联结主义并非完全搁置世界或环境的影响，也不完全否认认知对环境的依赖，关键在于世界（环境）在二者的眼中是否具有交互的意义，即它在人类认知中能否充当积极的角色，能否对人的认知活动产生某种主动、有效的反馈。笛卡尔式认知科学基于内在主义的立场把认知与世界相分离，将世界视作消极、次要的环节，然而世界是变动不居的，赫拉克利特说过，“人不能两次踏进同一条河流”，主体的行动在某种程度上也可能造成世界（环境）的扰动，传统认知科学主张的物理符号系统并不能将世界完全形式化，无力处理由世界的变动所产生的巨量信息，人却可以灵活地应对这些变动，因而也就无法实现对人类认知的实质模拟。在这个意义上，智能主体不可能也不能够在世界与自身之间画下严格的界线，人的认知需要世界（环境）的积极参与和反馈，两者间不存在勾连的问题，因为主体本身就“在世界之中”，而这正是海德格尔的“在世存在”最为根本的观点，“在世存在”就是人（此在）的基本建构。


    ## 二 心身二分导致认知与身体的割裂


    第一代认知科学研究范式将人的认知活动描述为基于规则对符号的操作与计算过程，将人脑类比为数字计算机，基于功能主义假设的认知主义提倡的是一种离身认知，身体只是作为认知的承载者而持存，本身不参与认知过程。作为联结计算心智理论的联结主义也只是模拟生物大脑的神经网络活动，依然不涉及身体。在我们看来，认知主义和联结主义将身体排斥在外的一个原因在于它们继承和发扬了笛卡尔理性主义哲学传统。笛卡尔认为，人区别于物的关键就在于其全部本质是思维，“而另一方面，我对于肉体有一个分明的观念，即它只是一个有广延的东西而不能思维，所言肯定的是：这个我，也就是说我的灵魂，也就是说我之所以为我的那个东西，是完全、真正跟我的肉体有分别的，灵魂可以没有肉体而存在”。[^(\[21\])](#chapter002.html#m21)身体是广延，属于物质的范畴，永远是可分的，但是思维是单一、完整的东西，是不可分的。在笛卡尔看来，身体某一部分的缺失并不会影响精神的认识能力，“尽管整个精神似乎和整个肉体结合在一起，可是当一只脚或者一只胳膊或别的什么部分从我的肉体截去的时候，肯定从我的精神上并没有截去什么东西”。[^(\[22\])](#chapter002.html#m22)故愿望、感觉和想象等认识活动只是精神的事，与身体无关，而认知主义和联结主义范式模拟的计算思维则更加不需要身体的参与，符号的计算表征就能解释一切。一言以蔽之，人脑是认知的核心，实现对生物大脑的模拟就可理解人的全部认知活动。


    第一代认知科学研究范式自诞生以来便有着恢宏的愿景：基于物理符号系统为人类认知建立模型，人工系统能够模拟智能甚至本身就具有智能或心智。在我们看来，这种抛却身体的离身认知不仅没有实现既定的目标，反而遭遇各种挫折而变得渐行渐远，脱离身体的认知研究面临诸多困境，我们认为主要有两种：①不能正确理解人类认知，无法解释情感体验、意志冲动等非理性活动；②不能正确说明认知的形成与演化。


    我们先来考察第一种困境。认知主义的符号研究进路和联结主义的神经网络加工进路皆是采用计算机隐喻来解释人的认知和心理活动的，主张认知活动的本质在于计算，是根据形式系统和算法规则对信息或符号的操作过程。然而无论是哪一种进路，揭示的都是计算的心智（computational
    mind），而非体验的心智（experiential mind）。[^(\[23\])](#chapter002.html#m23)这种计算隐喻只是模拟和描述了人类认知理性的一个方面，一般而言，主体的认知过程往往伴随着情感或情绪状态，即便是常人看来最为理智化的科学实验、逻辑演算等活动也都随附着情绪，只是不轻易为人们所察觉和感知。在我们看来，不存在任何纯粹理性的、不掺杂任何情感要素的认知形式和过程。将认知和心理过程理解为抽象的符号计算剥离了人类认知的现象属性和情绪属性，忽略了认知与情感相互交织这一错综复杂的方式。而且在某种程度上，人是以具身介入世界的方式来理解这个世界的，将情绪和身体感觉排除在认知之外，我们得到的不是稳固的自我意识、开明的决策、明智的道德判断以及有效的社会交互，而是一种精神机能障碍的状态。[^(\[24\])](#chapter002.html#m24)


    另外，抽象的符号计算不能很好地解释人类认知活动中瞬间迸发的、具有创造性、偶然性的突发思维状态，比如灵感。在强人工智能看来，经过恰当编程的计算机具有心智，可以进行理解和其他认知操作，人工神经网络的逻辑运算过程可以涌现出智能。那么，这种严格遵循规则、程式化的计算如何能够产生突现的思维状态呢？日常经验告诉我们，灵感往往是在人们经历长期的艰苦思考，在“百思不得其解”的状态下受到外界因素的偶然刺激而突然涌现的思维状态，灵感本身没有规则，也不遵循规则，具有突现性和不可预测性的特征。图灵式的逻辑推理和计算不会产生灵感，图灵机的整个操作过程都由若干控制命令顺序连接而成，每一步操作都有其控制命令，所以，图灵计算是基于规则的“机械步骤”，无法理解甚至产生灵感。此外，我们认为灵感的产生也离不开身体，得益于主体与世界的交互，牛顿被苹果砸中而发现万有引力，阿基米德在泡澡时发现浮力定律都是凭借身体对外界的接触与感知。人的身体塑造着认知过程，“身体是认知的限制者、认知过程的分配者和认知活动的调节者”，[^(\[25\])](#chapter002.html#m25)因而有着举足轻重的作用，不能轻易地舍弃。


    鲜活、生动的人类经验向我们表明，理性认知不是单纯的逻辑推理和符号操作，而且非理性的意志、欲望和冲动也在为人类构筑认知大厦添砖加瓦，理性和非理性之间不是截然对立的关系。亚里士多德在著作《形而上学》开宗明义地写道，“求知是人类的天性”，追本溯源，这种天性就是求知的欲望和满足自身好奇心的冲动，而意志的冲动往往通过身体表现出来。人们对世界的理解都是从对身体的理解开始，身体是我们与世界打交道的媒介（这是身体的工具性特征）。世界不是一个对象性的存在，不可能被理性认识所穷尽，通达世界的道路，是通过身体去体验、去知觉。[^(\[26\])](#chapter002.html#m26)身体不仅是认知与意识的载体，也是个体活动的核心，然而却被人们有意或无意地“遗忘”了。


    其次，从进化论的角度讲，人的认知、意识与人的身体一样都是自然选择和进化的产物，既不是上帝的恩赐，也不是突如其来的惊喜，它具有独特的自然起源和演化机制。科学研究发现，在人类进化过程中，大脑容量不断增加，在大约200万年的演化过程中，人的大脑体积扩大了三倍，中枢神经系统和大脑额叶的迅速扩张使得大脑的功能越来越复杂、完善，最后出现了抽象思维。同时，躯体的进化改变了人类行为，制造和使用工具以及劳动形式的日益丰富反过来又增强了人的知觉、注意、记忆、思维和想象等认知能力，认知的形成和演化离不开以大脑为核心的身体。直接从高度进化发展的人类大脑和人类现有的认知模式来研究认知、智能和意识，不能从根本上全面解决认知、智能和意识的本质及其演化与发展的基本规律等重大基础问题，我们所能得到的充其量是一些关于人类认知、智能和意识的部分知识而已。[^(\[27\])](#chapter002.html#m27)正如前文所述，单凭认知主义和联结主义远不足以回答关于人类认知本质的全部问题，身体也是认知过程的参与者而非旁观者，认知能力的增强离不开感官系统的进化。即便是没有任何感觉器官的多细胞生物，也是以具身的方式直接与环境进行交互作用，在德雷福斯看来，人与世界的交互往往呈现为一种熟练应对（skillful
    coping）活动，以一种上手、不经意的方式进行着。一部分认知官能已经内化于身体，内在表征植根于身体与外部环境的感官互动过程。我们的一切知识都源于经验，人正是通过视觉、听觉、嗅觉等身体感官系统接收外部世界的大量信息，经验是身体图式对于知觉的汇集。著名人工智能学家布鲁克斯充分考虑了身体对智能的影响，他进行了类人机器人的研究并设计制造了具有类似人的外形的机器人考格（`Cog`），许多科学家都在进行相关研究，这表明对人类认知的研究与探索离不开身体。人不是天生就具有完备的推理、感官系统，而是长久以来在和复杂多变的环境交互和完成任务的过程中不断发展起来的，布鲁克斯因此指出人类认知和智能具有发展性的特征，既然认知是不断发展、进化的，那么局限于理解、思维等某一阶段的认知层级便不能把握人类认知发展的总体脉络。人的认知和智能的进化离不开身体的运动、感知系统，不考虑身体的因素，就无法正确说明认知的演化与发展，没有身体，人的认知就成了无根之木、无源之水，只能像空中楼阁那样虚无缥缈罢了。


    海德格尔明确地向我们表明，“此在”是“身体式的在世界之中的存在”，身体是人在世界中存在的根本方式，“人类的整体的存在方式只能以这样的方式来把握，它必须被把握为人的身体式的在世界之中的存在”。[^(\[28\])](#chapter002.html#m28)具体就认知而言，一方面，人类认知的生成需要身体来予以保证；另一方面，对人类认知的研究在不触及身体维度的条件下可能无法确保其有效性。毋宁说，如果从存在论现象学的视角来看，人的身体不是某一现成意义上的存在物，比如生物学和医学领域的概念范畴，而是一种动态的身体化。从某种程度上说，这一观念与具身认知的核心立场在本质上并不相通，后者对于身体的构造、感官和运动系统的强调更像是把身体当作一种躯体来看待，将身体加以量化、功能化，强调人的认知过程与身体之间绝对的因果力，致力于身体—认知的因果解释，身体仍被单纯地视为一种当下之物。而从身体作为人（“此在”）之存在方式，认知又是奠基于在世存在的一种方式和途径来看，人的身体与其自身的认知活动的确是不可分割、彼此交织的，谈及在世界中存在，我们就不能否认身体这一要素。因此，认知与身体之间的割裂并不符合“此在”本真的生存状况，笛卡尔的心身二分是有问题的。


    ## 三 并非一切皆可计算


    国内有学者对“计算主义强纲领”的立场作了如下概括：主张物理世界、生命过程甚至人类心智都可计算，整个宇宙都由算法支配。[^(\[29\])](#chapter002.html#m29)依次对应计算主义的三个发展阶段，小到分子细胞，大到天体宇宙皆可归于算法，都可看作自然的计算过程。现如今，计算主义已经被最前沿的科学研究领域奉为一种标准的研究范式和指南，在神经科学、脑科学、人工智能、生命科学等学科领域，计算主义俨然作为标尺指导着一切。有的学者因此认为，计算主义是关于认知或生命的一种哲学理论，不能仅满足于此，它要成为一种普遍的世界观，[^(\[30\])](#chapter002.html#m30)这是计算主义的根本任务和目标，而实现宏大的目标必然会遭遇一系列的难题与困境，计算科学、复杂性科学以及哲学阵营纷纷对之发起挑战。计算主义面临着哥德尔不完备性定理、符号奠基问题以及框架问题的诘难，人们纷纷质疑数字计算机能表现出人类意识的关键特征，即“自主产生和理解语义的能力、表征动态变化的世界的能力，以及意识的最精微和神秘的直觉能力”。[^(\[31\])](#chapter002.html#m31)除此之外，我们认为，计算主义不是放之四海而皆准的先验规则，在面对非理性的欲望、自由意志和审美体验时计算主义的解释力便显得捉襟见肘、十分有限，因此并非一切皆可计算。下面我们分三点予以论证。


    第一，人的非理性活动如意志、欲望、冲动不可计算。在我们看来，计算主义是对理性主义传统新的继承和发展，自巴门尼德区分“真理之路”与“意见之路”以来，理性主义一直在西方哲学史中占据主导地位，牢牢掌握着理解和阐述世界的话语权，成为解决一切问题的根本原则和方法。近代的笛卡尔高举理性主义的旗帜，首次鲜明地提出了机械之身体和自由之心智之间的二元对立，他将人的身体视为一部结构非常精致巧妙的机器：“如果我把人的肉体看作是由骨骼、神经、筋肉、血管、血液和皮肤组成的一架机器，即使里面没有精神，也并不妨碍它跟现在完全一样的方式来运作……”[^(\[32\])](#chapter002.html#m32)笛卡尔坚决否认心智也可视为一部精妙的机器的观点，他的心身二元论彻底堵死了二者的勾连，作为物质的身体只是作为人类心智的载体和容器，它无法产生心智，按照这一逻辑，即便是上帝也制造不出能够产生心智活动的机器，只能对心身之间的关联作出有效或必要的保证。此外，霍布斯认为“推理即计算”，拉美特利则更为激进，提出“人是机器”的口号，认为心理活动就是机械活动，莱布尼兹提出了“普遍语言”的设想，也就是以符号语言系统描述哲学与科学，类似于弗雷格、罗素等人创立的数理逻辑。


    我们认为，从近代的唯理论哲学到现代的逻辑经验主义，再到盛行于认知科学和人工智能领域的计算主义，都关注作为主体之人的理性认识能力，也就是以逻辑方式重构、理解对象物，并将其纳入一种因果的、合规范性的、合目的性的解释框架，以实现对世界的精确性把握。然而，认知的理性主义进路与非理性的情感和意志冲动是相背离的，理性对经验材料进行概括和总结，将通过直观获取的表象抽象为逻辑表征，它体现的是人类认知反思性的方面，都要遵循某种规则，正如逻辑主义之于命题，谓词逻辑推理规则、计算主义之于算法，因而是有条件的、因果的。相反，意志是盲目的，没有理由和目标，也不遵循规则，按照叔本华的说法，它不受根据律的制约，是漫无目的的原创力，因而具有能动性。在我们看来，叔本华的唯意志论有其正确性，在某种意义上揭示出人作为生命存在物的本质特征，人的生存意志先于理性认知，一切认知能力都以意志能力为前提，意志是认知的驱动力。叔本华认为，人认识的是自己所欲求的东西，而不是欲求自己所知的东西，主体正是根据自己的意志来认识自己和对象，这也表明了意志的本质就是欲求和欲望。那么遵循理性主义传统的计算主义能否界定非理性的意志？答案是否定的，也就是说意志不可计算。叔本华将意志看作世界最本原的存在，它不是构成现象世界的因果链条的环节，不服从现象法则，因而意志是自由的。我们可以假设，如果计算主义是正确的，即大脑、生命体以及整个世界（从微观粒子到宇宙星系）皆为一个完备的计算系统，那么，任何实在都可以看作这台超级计算机的计算程序的不同计算结果。也就是说，只要有足够的信息输入，我们便可以计算出任意实体、事件在任意状态下的坐标与趋向曲线，从某种意义上而言，计算主义就是一种决定论，它的计算程序和算法规则具有相当强的因果效力，每一步程式化的运算相当于因果链条中的一个环节，是符号状态之间的因果映射。然而，这样便没有为自由意志留下空间，人有可能再一次陷入因果决定而无自由可言的尴尬境遇。因果关系不具有完满的解释力，计算主义同样做不到这一点。

    '
  trans: '


    心智与世界割裂开来的理论预设间接地导致认知主义将心智视作一个计算系统，大脑的计算等同于数字计算机的计算，人的智能正是凭借控制内部信息处理的输入和输出规则得到解释。这种规则只是纯粹形式的句法理论，它的意义只产生于符号自身的因果效力，也就是说，意义是内在的，而不是由外在的世界所赋予的。在认知主义和联结主义的视域中，世界（环境）是和主体对置并被给予的认知材料，忽视了主体与客体之间的一切情境性关联。[^(\[17\])](#chapter002.html#m17)世界就像一个巨大的、由原始的物质材料堆砌而成的东西，人的大脑作为中央处理器将全部由感官刺激产生的感觉经验加以形式化，形成符号以便进行操作计算，因此，世界类似于一个可以随时供主体取用的数据库，两者之间的关系是平行的，通过形式化的表征进行勾连。然而，这样带来的潜在问题是我们能否对世界进行可靠性表征？换言之，我们能否借助表征的利刃撕裂现象的帷幕，从而精确地把握实在本身？主体与作为客体之世界之间的对峙产生了解释鸿沟，这个问题从近代以来便困扰着哲学家。休谟说道，“我们既然假设，心与物是两种十分相反，甚至于相矛盾的实体，所以物体究竟在什么方式下来把它的影像传达到心里，那真是最难解释的一件事”。[^(\[18\])](#chapter002.html#m18)康德则是在休谟的启发下直面这个问题，通过所谓的“哥白尼革命”区分了现象与物自体，虽然他为人类理性划定了地盘，人的知性能力只可以触碰现象世界而无法认知超出现象之外的事物，但是由于坚持表征是主体认知世界的唯一方式，所以在康德那里，心智与世界仍然是断裂的，世界的本来面目依旧遥不可及。然而人类理性自身具有的能动性以及巨大求知欲不可能满足于只认识现象，我们依然会不遗余力地去追问、考察那些永远无法放弃的东西，正如康德所言，“幻相的大本营……在不停地以空幻的希望诱骗着东奔西闯的航海家去作出种种发现，将他卷入那永远无法放弃、但也永远不能抵达目的之冒险”。[^(\[19\])](#chapter002.html#m19)我们认为，要摆脱这种困境有两种方法：一是跳出“我”的牢笼，立足于上帝视角审视认知主体与世界的关系；二是放弃笛卡尔的主客二分原则，摒弃主—客对立的本体论预设或前提，放弃唯表征论但不放弃表征，表征不是我们认识对象世界的唯一方式和途径。第一种似乎是抛却表征最为彻底的方法，但在我们看来这只是形而上学的想象，人不可能超出自身的限制去认识对象，这样的超越只会发生在意识中，由“我思”来进行，我们作为有限的存在者并没有这样的知觉经验，至多只是头脑中的虚幻设想。第二种方法相对来说更为可行，海德格尔对“此在”“在世存在”的揭示为人们超越主客二分的表征之路提供了启示，即“在传统的沉思、表征、计算之上，补充实践、操作、交互，以一种替代和开放的方案来实现心智与世界的勾连”。[^(\[20\])](#chapter002.html#m20)


    在海德格尔看来，我们作为“此在”是被抛入世界之中的，“被抛”这一生存论现象具有强制性、不可选择性，“此在”始终与世界具有一种因缘关系。人不可能作为没有身体的精神或纯粹的先验自我而存在，因为他已被投入一个先在的世界，必定要与其他“此在”以及非“此在”的存在者产生关联，这种相关的前提条件是“此在”存在于世界之中，且这种关联首先是存在关系，而非认知关系。我们在前述中提到，认知主义和联结主义并非完全搁置世界或环境的影响，也不完全否认认知对环境的依赖，关键在于世界（环境）在二者的眼中是否具有交互的意义，即它在人类认知中能否充当积极的角色，能否对人的认知活动产生某种主动、有效的反馈。笛卡尔式认知科学基于内在主义的立场把认知与世界相分离，将世界视作消极、次要的环节，然而世界是变动不居的，赫拉克利特说过，“人不能两次踏进同一条河流”，主体的行动在某种程度上也可能造成世界（环境）的扰动，传统认知科学主张的物理符号系统并不能将世界完全形式化，无力处理由世界的变动所产生的巨量信息，人却可以灵活地应对这些变动，因而也就无法实现对人类认知的实质模拟。在这个意义上，智能主体不可能也不能够在世界与自身之间画下严格的界线，人的认知需要世界（环境）的积极参与和反馈，两者间不存在勾连的问题，因为主体本身就“在世界之中”，而这正是海德格尔的“在世存在”最为根本的观点，“在世存在”就是人（此在）的基本建构。


    ## 二 心身二分导致认知与身体的割裂


    第一代认知科学研究范式将人的认知活动描述为基于规则对符号的操作与计算过程，将人脑类比为数字计算机，基于功能主义假设的认知主义提倡的是一种离身认知，身体只是作为认知的承载者而持存，本身不参与认知过程。作为联结计算心智理论的联结主义也只是模拟生物大脑的神经网络活动，依然不涉及身体。在我们看来，认知主义和联结主义将身体排斥在外的一个原因在于它们继承和发扬了笛卡尔理性主义哲学传统。笛卡尔认为，人区别于物的关键就在于其全部本质是思维，“而另一方面，我对于肉体有一个分明的观念，即它只是一个有广延的东西而不能思维，所言肯定的是：这个我，也就是说我的灵魂，也就是说我之所以为我的那个东西，是完全、真正跟我的肉体有分别的，灵魂可以没有肉体而存在”。[^(\[21\])](#chapter002.html#m21)身体是广延，属于物质的范畴，永远是可分的，但是思维是单一、完整的东西，是不可分的。在笛卡尔看来，身体某一部分的缺失并不会影响精神的认识能力，“尽管整个精神似乎和整个肉体结合在一起，可是当一只脚或者一只胳膊或别的什么部分从我的肉体截去的时候，肯定从我的精神上并没有截去什么东西”。[^(\[22\])](#chapter002.html#m22)故愿望、感觉和想象等认识活动只是精神的事，与身体无关，而认知主义和联结主义范式模拟的计算思维则更加不需要身体的参与，符号的计算表征就能解释一切。一言以蔽之，人脑是认知的核心，实现对生物大脑的模拟就可理解人的全部认知活动。


    第一代认知科学研究范式自诞生以来便有着恢宏的愿景：基于物理符号系统为人类认知建立模型，人工系统能够模拟智能甚至本身就具有智能或心智。在我们看来，这种抛却身体的离身认知不仅没有实现既定的目标，反而遭遇各种挫折而变得渐行渐远，脱离身体的认知研究面临诸多困境，我们认为主要有两种：①不能正确理解人类认知，无法解释情感体验、意志冲动等非理性活动；②不能正确说明认知的形成与演化。


    我们先来考察第一种困境。认知主义的符号研究进路和联结主义的神经网络加工进路皆是采用计算机隐喻来解释人的认知和心理活动的，主张认知活动的本质在于计算，是根据形式系统和算法规则对信息或符号的操作过程。然而无论是哪一种进路，揭示的都是计算的心智（computational
    mind），而非体验的心智（experiential mind）。[^(\[23\])](#chapter002.html#m23)这种计算隐喻只是模拟和描述了人类认知理性的一个方面，一般而言，主体的认知过程往往伴随着情感或情绪状态，即便是常人看来最为理智化的科学实验、逻辑演算等活动也都随附着情绪，只是不轻易为人们所察觉和感知。在我们看来，不存在任何纯粹理性的、不掺杂任何情感要素的认知形式和过程。将认知和心理过程理解为抽象的符号计算剥离了人类认知的现象属性和情绪属性，忽略了认知与情感相互交织这一错综复杂的方式。而且在某种程度上，人是以具身介入世界的方式来理解这个世界的，将情绪和身体感觉排除在认知之外，我们得到的不是稳固的自我意识、开明的决策、明智的道德判断以及有效的社会交互，而是一种精神机能障碍的状态。[^(\[24\])](#chapter002.html#m24)


    另外，抽象的符号计算不能很好地解释人类认知活动中瞬间迸发的、具有创造性、偶然性的突发思维状态，比如灵感。在强人工智能看来，经过恰当编程的计算机具有心智，可以进行理解和其他认知操作，人工神经网络的逻辑运算过程可以涌现出智能。那么，这种严格遵循规则、程式化的计算如何能够产生突现的思维状态呢？日常经验告诉我们，灵感往往是在人们经历长期的艰苦思考，在“百思不得其解”的状态下受到外界因素的偶然刺激而突然涌现的思维状态，灵感本身没有规则，也不遵循规则，具有突现性和不可预测性的特征。图灵式的逻辑推理和计算不会产生灵感，图灵机的整个操作过程都由若干控制命令顺序连接而成，每一步操作都有其控制命令，所以，图灵计算是基于规则的“机械步骤”，无法理解甚至产生灵感。此外，我们认为灵感的产生也离不开身体，得益于主体与世界的交互，牛顿被苹果砸中而发现万有引力，阿基米德在泡澡时发现浮力定律都是凭借身体对外界的接触与感知。人的身体塑造着认知过程，“身体是认知的限制者、认知过程的分配者和认知活动的调节者”，[^(\[25\])](#chapter002.html#m25)因而有着举足轻重的作用，不能轻易地舍弃。


    鲜活、生动的人类经验向我们表明，理性认知不是单纯的逻辑推理和符号操作，而且非理性的意志、欲望和冲动也在为人类构筑认知大厦添砖加瓦，理性和非理性之间不是截然对立的关系。亚里士多德在著作《形而上学》开宗明义地写道，“求知是人类的天性”，追本溯源，这种天性就是求知的欲望和满足自身好奇心的冲动，而意志的冲动往往通过身体表现出来。人们对世界的理解都是从对身体的理解开始，身体是我们与世界打交道的媒介（这是身体的工具性特征）。世界不是一个对象性的存在，不可能被理性认识所穷尽，通达世界的道路，是通过身体去体验、去知觉。[^(\[26\])](#chapter002.html#m26)身体不仅是认知与意识的载体，也是个体活动的核心，然而却被人们有意或无意地“遗忘”了。


    其次，从进化论的角度讲，人的认知、意识与人的身体一样都是自然选择和进化的产物，既不是上帝的恩赐，也不是突如其来的惊喜，它具有独特的自然起源和演化机制。科学研究发现，在人类进化过程中，大脑容量不断增加，在大约
    200 万年的演化过程中，人的大脑体积扩大了三倍，中枢神经系统和大脑额叶的迅速扩张使得大脑的功能越来越复杂、完善，最后出现了抽象思维。同时，躯体的进化改变了人类行为，制造和使用工具以及劳动形式的日益丰富反过来又增强了人的知觉、注意、记忆、思维和想象等认知能力，认知的形成和演化离不开以大脑为核心的身体。直接从高度进化发展的人类大脑和人类现有的认知模式来研究认知、智能和意识，不能从根本上全面解决认知、智能和意识的本质及其演化与发展的基本规律等重大基础问题，我们所能得到的充其量是一些关于人类认知、智能和意识的部分知识而已。[^(\[27\])](#chapter002.html#m27)正如前文所述，单凭认知主义和联结主义远不足以回答关于人类认知本质的全部问题，身体也是认知过程的参与者而非旁观者，认知能力的增强离不开感官系统的进化。即便是没有任何感觉器官的多细胞生物，也是以具身的方式直接与环境进行交互作用，在德雷福斯看来，人与世界的交互往往呈现为一种熟练应对（skillful
    coping）活动，以一种上手、不经意的方式进行着。一部分认知官能已经内化于身体，内在表征植根于身体与外部环境的感官互动过程。我们的一切知识都源于经验，人正是通过视觉、听觉、嗅觉等身体感官系统接收外部世界的大量信息，经验是身体图式对于知觉的汇集。著名人工智能学家布鲁克斯充分考虑了身体对智能的影响，他进行了类人机器人的研究并设计制造了具有类似人的外形的机器人考格（`Cog`），许多科学家都在进行相关研究，这表明对人类认知的研究与探索离不开身体。人不是天生就具有完备的推理、感官系统，而是长久以来在和复杂多变的环境交互和完成任务的过程中不断发展起来的，布鲁克斯因此指出人类认知和智能具有发展性的特征，既然认知是不断发展、进化的，那么局限于理解、思维等某一阶段的认知层级便不能把握人类认知发展的总体脉络。人的认知和智能的进化离不开身体的运动、感知系统，不考虑身体的因素，就无法正确说明认知的演化与发展，没有身体，人的认知就成了无根之木、无源之水，只能像空中楼阁那样虚无缥缈罢了。


    海德格尔明确地向我们表明，“此在”是“身体式的在世界之中的存在”，身体是人在世界中存在的根本方式，“人类的整体的存在方式只能以这样的方式来把握，它必须被把握为人的身体式的在世界之中的存在”。[^(\[28\])](#chapter002.html#m28)具体就认知而言，一方面，人类认知的生成需要身体来予以保证；另一方面，对人类认知的研究在不触及身体维度的条件下可能无法确保其有效性。毋宁说，如果从存在论现象学的视角来看，人的身体不是某一现成意义上的存在物，比如生物学和医学领域的概念范畴，而是一种动态的身体化。从某种程度上说，这一观念与具身认知的核心立场在本质上并不相通，后者对于身体的构造、感官和运动系统的强调更像是把身体当作一种躯体来看待，将身体加以量化、功能化，强调人的认知过程与身体之间绝对的因果力，致力于身体—认知的因果解释，身体仍被单纯地视为一种当下之物。而从身体作为人（“此在”）之存在方式，认知又是奠基于在世存在的一种方式和途径来看，人的身体与其自身的认知活动的确是不可分割、彼此交织的，谈及在世界中存在，我们就不能否认身体这一要素。因此，认知与身体之间的割裂并不符合“此在”本真的生存状况，笛卡尔的心身二分是有问题的。


    ## 三 并非一切皆可计算


    国内有学者对“计算主义强纲领”的立场作了如下概括：主张物理世界、生命过程甚至人类心智都可计算，整个宇宙都由算法支配。[^(\[29\])](#chapter002.html#m29)依次对应计算主义的三个发展阶段，小到分子细胞，大到天体宇宙皆可归于算法，都可看作自然的计算过程。现如今，计算主义已经被最前沿的科学研究领域奉为一种标准的研究范式和指南，在神经科学、脑科学、人工智能、生命科学等学科领域，计算主义俨然作为标尺指导着一切。有的学者因此认为，计算主义是关于认知或生命的一种哲学理论，不能仅满足于此，它要成为一种普遍的世界观，[^(\[30\])](#chapter002.html#m30)这是计算主义的根本任务和目标，而实现宏大的目标必然会遭遇一系列的难题与困境，计算科学、复杂性科学以及哲学阵营纷纷对之发起挑战。计算主义面临着哥德尔不完备性定理、符号奠基问题以及框架问题的诘难，人们纷纷质疑数字计算机能表现出人类意识的关键特征，即“自主产生和理解语义的能力、表征动态变化的世界的能力，以及意识的最精微和神秘的直觉能力”。[^(\[31\])](#chapter002.html#m31)除此之外，我们认为，计算主义不是放之四海而皆准的先验规则，在面对非理性的欲望、自由意志和审美体验时计算主义的解释力便显得捉襟见肘、十分有限，因此并非一切皆可计算。下面我们分三点予以论证。


    第一，人的非理性活动如意志、欲望、冲动不可计算。在我们看来，计算主义是对理性主义传统新的继承和发展，自巴门尼德区分“真理之路”与“意见之路”以来，理性主义一直在西方哲学史中占据主导地位，牢牢掌握着理解和阐述世界的话语权，成为解决一切问题的根本原则和方法。近代的笛卡尔高举理性主义的旗帜，首次鲜明地提出了机械之身体和自由之心智之间的二元对立，他将人的身体视为一部结构非常精致巧妙的机器：“如果我把人的肉体看作是由骨骼、神经、筋肉、血管、血液和皮肤组成的一架机器，即使里面没有精神，也并不妨碍它跟现在完全一样的方式来运作……”[^(\[32\])](#chapter002.html#m32)笛卡尔坚决否认心智也可视为一部精妙的机器的观点，他的心身二元论彻底堵死了二者的勾连，作为物质的身体只是作为人类心智的载体和容器，它无法产生心智，按照这一逻辑，即便是上帝也制造不出能够产生心智活动的机器，只能对心身之间的关联作出有效或必要的保证。此外，霍布斯认为“推理即计算”，拉美特利则更为激进，提出“人是机器”的口号，认为心理活动就是机械活动，莱布尼兹提出了“普遍语言”的设想，也就是以符号语言系统描述哲学与科学，类似于弗雷格、罗素等人创立的数理逻辑。


    我们认为，从近代的唯理论哲学到现代的逻辑经验主义，再到盛行于认知科学和人工智能领域的计算主义，都关注作为主体之人的理性认识能力，也就是以逻辑方式重构、理解对象物，并将其纳入一种因果的、合规范性的、合目的性的解释框架，以实现对世界的精确性把握。然而，认知的理性主义进路与非理性的情感和意志冲动是相背离的，理性对经验材料进行概括和总结，将通过直观获取的表象抽象为逻辑表征，它体现的是人类认知反思性的方面，都要遵循某种规则，正如逻辑主义之于命题，谓词逻辑推理规则、计算主义之于算法，因而是有条件的、因果的。相反，意志是盲目的，没有理由和目标，也不遵循规则，按照叔本华的说法，它不受根据律的制约，是漫无目的的原创力，因而具有能动性。在我们看来，叔本华的唯意志论有其正确性，在某种意义上揭示出人作为生命存在物的本质特征，人的生存意志先于理性认知，一切认知能力都以意志能力为前提，意志是认知的驱动力。叔本华认为，人认识的是自己所欲求的东西，而不是欲求自己所知的东西，主体正是根据自己的意志来认识自己和对象，这也表明了意志的本质就是欲求和欲望。那么遵循理性主义传统的计算主义能否界定非理性的意志？答案是否定的，也就是说意志不可计算。叔本华将意志看作世界最本原的存在，它不是构成现象世界的因果链条的环节，不服从现象法则，因而意志是自由的。我们可以假设，如果计算主义是正确的，即大脑、生命体以及整个世界（从微观粒子到宇宙星系）皆为一个完备的计算系统，那么，任何实在都可以看作这台超级计算机的计算程序的不同计算结果。也就是说，只要有足够的信息输入，我们便可以计算出任意实体、事件在任意状态下的坐标与趋向曲线，从某种意义上而言，计算主义就是一种决定论，它的计算程序和算法规则具有相当强的因果效力，每一步程式化的运算相当于因果链条中的一个环节，是符号状态之间的因果映射。然而，这样便没有为自由意志留下空间，人有可能再一次陷入因果决定而无自由可言的尴尬境遇。因果关系不具有完满的解释力，计算主义同样做不到这一点。


