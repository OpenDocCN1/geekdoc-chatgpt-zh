  trans: '


    另一方面，将认知系统看作对表征状态的计算，这是人们长期以来理解智能和认知的有效方法，计算本质上涉及具有表征内容的状态转换。那么，作为人类智能的现象之一的理解，计算能否揭示或展现其包含的意义？在我们看来，这是计算成为一种人类理解形式需要具有的特征。如果计算是人类理解的一种形式，一个满足条件就在于前者须能够充分描述某种意向心理状态，并呈现出意义。很多心智哲学家，比如福多，认为计算的目的在于获取有意义的信息，计算是含有语义的过程。然而在塞尔看来，计算系统或模型只是单纯地在进行信息加工，比如，我说出“2
    个汉堡加 1 份炸薯条”这一话语，当我在表达这句话的时候可能会想象某一场景或图像，我会设想自己在快餐店里点餐，也可能在点外卖，甚至会联想到自己会因此而变胖，从而下决心改变饮食结构等。相较而言，计算机不会产生对相关情境的联想，它据有的是符号、规则以及算法。正确编程的计算机或许能够思维，但不能够像人一样进行理解，换言之，人的理解活动或内容不能用计算的形式或术语予以呈现。人们可以进行理解，原因在于心智能够将文字符号与意义相互勾连，如果计算是依据算法对符号的形式操作的话，那么理解则可以看作对意义的融贯，并因此可能产生出新的意义。


    根据狄尔泰的体验诠释学，理解过程中伴随着个人体验，体验的整体性决定了意义是统一的整体，他的体验概念同时又和生命有着密切的关系。伽达默尔在谈到这一概念时指出，体验和生命处于一种整体性的关联之中，体验的整体性源自生命之总体的统一性。同时，由于体验在时间上是双向流动的，过去、现在和未来在理解过程中是融为一体的（计算依然遵循的是一种单向度的时间观念，即以一种过去—现在—未来的模式进行延伸），人在生命体验的共同性的基础上达到意义的理解。[^(\[20\])](#chapter006.html#m20)人们对事物的共同理解何以可能，对共同意义的理解何以可能，狄尔泰将解决的希望寄托于人类生命的共同性，理解意义就是“一种返回，即由生命的客观化返回到它们由之产生的富有生气的生命性中”，[^(\[21\])](#chapter006.html#m21)作为体验的理解构成了作为认知的解释之基础，更构成了对客体的一切知识的认识论基础。显而易见的是，这正是计算所缺失的维度，计算不可能，也无须体验（如同在流水线上作业的机器人按部就班的程式化操作，它们对自己工作的意义没有清楚而明晰的觉知）。即便将计算用于解释和理解生命的本质，这一形式过程没有也不会产生体验的维度，纵使被描述和理解的生命本身是体验性的。因为体验甚至理解行为是内在、深层次的，而通用的计算模式是一种表层的信息处理过程。如果狄尔泰的观点是正确的，那么基于体验而理解的东西则是具体的并具有某种感受性的东西，相较而言，计算则是基于一种完全抽象化的思维，本质上是对纯粹理性的推崇与模拟，[^(\[22\])](#chapter006.html#m22)是可以用准确指令清晰表述的东西，理解显然不属于这一范畴。正如狄尔泰所说的，“我们通过纯粹理智的过程进行说明，但我们却通过联结一切心理力量的领悟活动来理解”。[^(\[23\])](#chapter006.html#m23)


    我们认为，计算与理解的区别代表着描述对象或世界的两种方式，前者以抽象的、严肃理性的方式描述世界，后者以具象的、略带感性的方式描述世界。之所以说理解略带感性，是因为我们可能会在理解的过程中掺杂自己有关对象的体验，甚至是对个体生命的体验。正是体验使得理解成为可能，它使每一个体的心智与对象的纽结从心理上得以关联着，在某种意义上，这可能是理解难以摆脱个体性与主观性的原因之一。体验虽然不是孤立存在的，但终究是个别性的，而基于个别性的体验的理解在我们看来是不能提供“放之四海而皆准”的统一解释的。相较而言，普遍性正是计算的优势以及计算主义力求实现的目标——实现计算在解释智能与心智、生命过程以及世界或宇宙的刚性统一，使计算发挥元语言之作用，计算如同语言一样是人们认识世界不可或缺的工具。从这一角度来看，计算可以被我们看作一种精确性、工具性的人类理解形式。


    我们看到，将人的理解活动或过程置于计算模式的解释机制，这一尝试似乎是行不通的。在理解活动中，主体（理解者）和意义并不能通过计算而形成强有力的关联。此外，计算的“不充分性”，即计算不能充分说明精神的认知现象，理解的计算化也难以真正实现。计算在信息的输入和输出行为之间建立的对应与映射关系很难产生理解，因为理解者在理解活动中的心理或意向状态并不是通过信息的输入或输出就能获得的，即使可以获得，这种体验式的认知结果也很难被符号化。纯粹形式化的计算在处理和应对理解的不确定性问题时会显得力不从心，这说明“心理能力实际上超出了计算所能涵盖的范围”。[^(\[24\])](#chapter006.html#m24)在我们看来，计算与认知在某一抽象层次上的共同功能描述尚不足以覆盖整体的认知现象，背后的原因依旧是计算的不充分性。


    ## 二 计算与人类理解结合的可能性


    若要寻找一个能够将计算与理解相统一的点，伽达默尔的论断或许可以给予我们一些启示。一切理解无非是对语言的理解，一切解释也无非是对语言的解释，在语言的沟通中，我们相互地理解和解释了。[^(\[25\])](#chapter006.html#m25)语言本身也是一套符号系统，是人们用于进行解释和理解的工具。施莱尔马赫认为解释是一种语言的外在表达，主要以文字、言语为载体，理解更重要的是一种心理层次的表达和实现，是在主体内部对意义的运思，而心理层次的理解一经说出口，便成了对某物、某事件的解释。解释（尤其是以计算主义为代表的科学解释）是根据客观、普遍的语法规则进行的，它关注的是对象物与解释的契合程度，关注解释能否恰当地描述对象，其目标在于追求和揭示“真”。理解关注的是主体本身的精神状态，以及个人对意义的体悟，其目标在于追求“善”。然而，无论是追求“真”还是“善”，一切过程和行为都发生在语言之中，都处在由语言编织的关系网内。一言以蔽之，理解与解释都具有语言性的特征，[^(\[26\])](#chapter006.html#m26)一切的计算与理解过程最终都要落在语言之上，都是通过语言系统产生了一种语言性的存在结果。


    从这种意义上来说，计算与人的理解之间的通约意味着严格、精确的人工语言（符号语言）与灵活、模糊的自然语言之间的“对话”，也就是如何将前者应用于后者的问题。伽达默尔认为在语言层面可以将理解与解释，甚至全部的自然科学与精神科学统一起来（但他所指的语言主要指自然语言，抑或是文本语言，可能由于时代的限制，他没有考虑到计算依赖的人工式的逻辑符号语言对于自然语言所要表达和承载的意义而言是不充分的）。同样，利科也认为在一个由符号的关系体系所构成的语言系统中能够实现理解与解释的融合，消除二者间的对立。在计算主义的语境中，理解世界相当于建构语言，语言的结构即世界的结构，它试图在排除或脱离情境的前提下实现或建构符号与世界之间的映射关系。相反，理解是人与自身所处的情境之间形成的一种联系，与情境的关系决定了计算与理解之间存在的差别。在我们看来，将计算纳入理解的语境中才有可能实现两者的通约。计算语言和自然语言由于使用着不同的符号表达系统，因而之间存在着一条天然的鸿沟，意味着它们各自具有对言语行为以及对象独特的说明和描述。由于自身包含的体验要素，理解通过语言与对象物形成的是一种直接性的关联，未包含体验要素的计算与对象物之间则是隔着作为中介的表征符号，它们形成的是一种间接性的关联。计算关注的是对象在思维中可以被抽象化的部分，而不是对象本身。直接性与间接性的碰撞与对立使我们认识到，计算是将对象物以形式化和符号化的方式再现，而理解不是纯粹的再现，它在新的视域中生成了新的意义，所以理解过程就是一种创造过程，是一种意义生成活动。从这种意义上说，理解活动似乎无须借助计算来实现。


    然而，我们认为，若要将人类理解予以精确化，将“真”的判断融入人的理解过程中，从而尽可能地避免误解或者错误，就不能将计算绝对地排除在人的理解活动之外，甚至应当充分发挥计算的确定性与精确性，将计算作为匡正理解的一种工具。计算与人类理解可能结合的另一个理由在于，理解者心中的理解内容必须被解释出来方能实现。[^(\[27\])](#chapter006.html#m27)海德格尔独特的理解观表明，意义是通过理解的展开而逐步得到展现的，它是被生成的。解释与理解之间不是截然对立的关系，两者是不可分割的。解释是在理解基础上的，它植根于理解，可以被视为理解造就自身，展开自身的活动，“对理解有所裨益的一切解释，必然已经对被解释的东西有所理解”。[^(\[28\])](#chapter006.html#m28)由于解释是诠释学必不可少的构成要素，放弃了解释，也就意味着在诠释学中所展示的一切都将永远陷入晦暗不明的状态，缺乏任何理论思考所必备的明晰性和确定性，换句话说，理解只能是“模糊不清”的。[^(\[29\])](#chapter006.html#m29)计算作为一种解释方式和工具，在我们看来具有将理解展现出来的可能性，因为从根本上说，理解是对语言的理解，而符号本身并不是意义或者对象物，只是对意义或对象物的抽象化表征，人们需要将符号承载的意义揭示出来。所以，不论是怎样的一种解释形式，都是以语言为基础的，计算则是我们在以某种特殊的方式完善着理解。


    此外，我们需要计算自身具有的客观性和不偏倚性来限制人在理解过程中可能具有的主观随意性，从而避免理解由于任意的主观立场而陷入相对主义。这个问题也是诠释学的不同流派所共同关注的焦点，即如何克服理解中的相对主义和不确定性，如何解决理解过程的客观性问题。如果将计算纳入理解过程，把它视为其中的一个环节或一种形式，在我们看来便有可能防止意义回归主观化的可能性。符号化的计算作为主体（理解者）理解对象或进行自我理解的媒介，它筹划展示出了理解的一种新的可能性。理解者在推动理解的过程中不可避免地加入了自己的主观要素，但也正是这种主观性帮助人们揭示出隐藏在对象背后的意义，尤其在理解文本时有可能生发出连作者自己都没有意识到的东西，这恰恰是计算难以实现的，也就是说，计算难以超越形式和先在设定之规则的约束而生成新的意义，产生新的理解，但另一方面，计算仍可作为增强人类理解确定性的工具而被加以利用。


    ## 第三节 诠释学视域下的人工智能是否具有理解力


    从哲学解释学的视角看，理解过程涉及语言、传统、思维方式以及情绪等一系列因素。人工智能执行的是符号操作的技术进路，接受的是一种关于科学知识的规范概念，沿袭的是客观主义的认知立场，遵循着严格、精确的程序与规则。唯有中立的、不带偏见的意识才能保证知识的客观性，对人而言，这确实是困难的，人工智能则成为实现这一设想的典范，它形式化地模拟了人类思维的各种认知功能，从而无限接近理想的目标，即追寻普遍性的、无关个体的推理准则。然而，笔者认为，这种功能模拟不能产生类似于人的理解活动，原因在于：第一，人的理解充斥着意识的反思要素，理解同时是一种自我理解；第二，人工智能缺乏人之理解的“前结构”，根本上仍然是人工智能的离身性与人类智能的具身性之间矛盾的外化；第三，人工智能的计算程序缺失与历史的意义关联；第四，人工智能自身的离身认知逻辑与人类具身性的理解并不融贯。


    第一，人的理解是自我意识的“自思”，人工智能缺乏这种能力。人（此在）与人工智能的重要区别就在于，前者总是在向着自身的可能性不断地进行筹划和设计，体现出人自身的某种创造性和自主性，表明人类具有强烈的自我意识，它关涉着主体之于对象的理解程度。对于人工智能而言这是悬而未决的问题，它尚不具备自我意识，更没有自我反思和自我觉察的能力，人们大多担忧人工智能可能会通过自主改变自身的程序并创造新的规则，进而衍生出理解与反思能力。就目前来看，符号主义姑且不论，即便是模拟大脑神经元网络的人工神经网络也缺乏类似于人的创造性与理解力。换言之，人工神经网络只能响应固定情境下的固定特征，无法创造性地响应新的特征和情境，[^(\[30\])](#chapter006.html#m30)面对滚滚江水，人工智能不会发出“大江东去浪淘尽，千古风流人物”或“逝者如斯夫，不舍昼夜”的感叹。依照规则和算法生成的程序是对事物进行刻画和描述的一种形式，而理解不只是一种创造性的解释，在某种意义上它也是人的自我理解。也就是说，某人对他的理解是有意识的，能够理解自己所理解的内容，理解自产生伊始就包括了反思的东西在内。据此而论，严格按照规则进行计算和推理的人工智能不构成理解，若不考虑内存，它会将`π`无限计算下去。人显然不会这样，他理解到圆周率是无限不循环小数，故以字母`π`指代，如果现在有人无脑地计算`π`，我们会感到疑惑。人工智能的程序相当于人类提前输入的思想，是对人类观念系统的外化与复制，反复遵守规则的行动不具有创造性。理解是创造的前提，人借助理解是有可能避开思想陷阱的，比如“二律背反”“飞矢不动”等哲学悖论。人工智能或许永远只会依照规则并在程序预先设定的范围内推理和解决问题。相比之下，人可以理解规则并在这一前提下灵活地予以运用，甚至会修改抑或废弃规则，这得益于以自我意识为基础进行的自我分析。人会根据已有的“前见”，即人自身具有的知识背景、文化传统以及信念系统不断修正自己的现有理解，而这正是人工智能缺失的一环。


    第二，人工智能缺少人类理解具有的“前结构”。理解的可能性就存在于人（此在）向来就有的“前结构”中，它是我们进行理解的前提和基础。理解的“前结构”包括前有、前见以及前把握。前有是先行占有我们的历史、文化和传统；前见是指我们在进行认知和理解时利用的语言和观念，任何状态下的理解都需要语言和观念的参与；前把握是指人在理解之前具有的诸前提和假定，是我们理解和认知必要的知识储备，是由已知推向未知的脚手架与参照系。我们无法从空如白板的心理状态出发展开理解活动，即使“前结构”中存在某些错误的观念与假设，也只能在理解过程中予以修正。关于某物的理解和认知过程在某种程度上也是对自身的前理解结构的重塑。可以说，没有“前结构”，我们不会知道更多东西。


    此外，理解主体和理解对象之间存在着循环结构，人自身的“前结构”与理解对象的内容之间交互的结果便是理解。在海德格尔看来，理解过程一直是在先行存在的“前结构”的引导下展开的，这种“前结构”奠定了我们现有的认知框架和模式，反过来，理解过程的推进又会不断地修正我们已有的信念系统。人们正是依据已有“框架”生成认识和理解，也就是说，人们在理解之前总是已经“有所知晓”，而“有所知晓”使人们拥有了在本质上可以被理解清晰表达的东西。[^(\[31\])](#chapter006.html#m31)因此，不存在无前提的理解过程，人的心灵从来不是一片认知的空白之地，它具有初始的信息存储，理解也可看作已有和现有认知状态的碰撞与循环。相较而言，计算机如果没有输入程序或者算法，就像没有心灵的躯壳，不具有任何功能状态，更遑论人类理解过程中涌现的灵感和顿悟了。


    哲学解释学将“循环”作为理解的一个基本特征，经过海德格尔的改造，“解释学循环”摆脱了恶性的标签，成为人之理解活动必要牵涉的东西。他写道，“在这种循环中包藏着最原始认识的一种积极的可能性。当然，这种可能性只有在如下情况下才能得到真实理解，这就是解释（Auslegung）理解到它的首要的经常的和最终的任务始终是不让向来就有的前有（Vorhabe）、前见（Vorsicht）和前把握（Vorgriff）以偶发奇想和流俗之见的方式出现，而是从事情本身出发处理这些前有、前见和前把握，从而确保论题的科学性”。[^(\[32\])](#chapter006.html#m32)这一循环结构表现在，人作为此在自理解之始便置身于一种由前有、前见和前把握构成的背景之中（比如历史文化、传统观念与道德规范等），理解主体正是通过理解的前结构进入了理解的“循环”，任何关于事件、事物的理解都不是单向度的线性模式，这一结构是人的理解“程序”，可由人自主地加以修改和补足。虽然人工智能也必须依靠先行植入的程序和资料数据，例如“好的老式人工智能”预先设定或默认程序系统储存了完备的知识，设想能够以任何方式处理和应对遇到的诸多问题，但异于人自身先有的认知框架和信念系统，人为输入程序系统的知识框架不会自动进行修正和扩容，且人工智能没有能力在运行过程中自主地修正、改变程序或算法中的某些漏洞和错误，程序与算法可以看作人的“权威前见”在技术上的体现。


    我们最后想指出的是，人工智能缺乏人类理解具有的“前结构”，其根本原因仍是二者背后的离身性与具身性原则的对立，“前结构”作为人类理解的组成部分，是信息的具身式存储，本质上离不开人的生物学意义上的身体组织，长期以来是由大脑和身体塑造的，它不与身体相绝缘。人工智能则不属于“生物体”的意义范畴，其本质仍是离身性的人工产物，我们不认为它具有承载具身的“理解前结构”的可能性。


    第三，人是历史性的存在者，而人工智能基于算法的计算程序缺失历史维度，从某种意义上说，人类理解呈现的是一种“历史理性”，人工智能则呈现出一种“计算理性”或“纯粹理性”。笔者认为，人工智能不具有理解能力的原因之一在于其缺乏对历史性的把握与关切，人的理解具有历史性，主体总是从自己的历史存在出发去理解某物，这是重要的解释学原则。理解的循环结构表明：“在循环中，一切前结构与理解着的此在表现为一种历史的关联，把历史上曾发生的与正在发生的以及将要发生的东西联结起来，此在就存在于这种历史的关联之中；此在在历史的关联中存在着，它是一个历史的存在。”[^(\[33\])](#chapter006.html#m33)一切深思熟虑的解释与理解都是以理解者自身的历史性为基础的，即以一种从具体情境出发的对存在的前反思理解为基础，这种具体的情境同解释者的过去和未来具有内在的关系。[^(\[34\])](#chapter006.html#m34)人的理解具有历史性的特征，是一个由过去、现在和未来构成的复合体，历史性意味着理解不能摆脱它本身所处的历史情境，理解基于它的“前结构”向事物投射（“前结构”就是人类信念的历史积淀，通过教育、学习等途径得以保留，并内化于人的头脑当中），且人的每一理解都基于在历史情境中先行给定的信念体系，纯化的分析反思活动无法消除理解过程的历史参与。能否历史地认知事物，是人与人工智能的重要区别，后者被描述为在逻辑上融贯的人工系统，但逻辑的融贯与自洽并不能使其拥有人类理解特有的循环结构。人对事物的理解不是自我意识的自由活动产生的结果，相反，先在的人类智慧沉积已然为个体的理解奠定了可能性，并先验地塑造着个人的信念内容和结构。从这种意义上讲，在工程技术层面反映和呈现人类智慧成果的人工智能依旧是在模仿人的智能行为，程序与算法的更新凝结着人的新近思考。历史是人类丰富的智力资源，人类知识的历史沉淀造就的前见奠定了人类理解产生与进步的基石。对于人工智能而言，它没有历史感，有的只是被浓缩的一连串的代码，它的“前见”是由符号代码依照规则组成的程序所进行的信息处理，各系统之间以及系统与历史之间缺乏有效的意义流动。虽然人工神经网络已经足够复杂，但计算机的编程算法并不能呈现人类理解的醇厚历史性，也就是说，后者不能通过数学抑或逻辑的方法纯化为形式。


