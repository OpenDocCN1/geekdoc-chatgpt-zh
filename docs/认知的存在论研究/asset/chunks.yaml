- raw: '在我们看来，即便使用锤子敲击钉子的活动再流畅，人也是处于被用具所束缚的不自由状态，而新的延展实践形式使人与用具之间增添了许多中间环节，对用具的具身性的上手操作转变为人仅需凭借信息的输出就可完成的实践活动。海德格尔喜欢用锤子敲击钉子的例子来阐明上手性为何是源始的，他所讲的用具的上手状态物理性地依赖于人的身体，而发达的技术使得我们如今无须身体力行地用锤子来敲击钉子，锤击活动全然可以脱离人的手进行，与人照面的不再是一种动态的实践性关联，而是一种静态的信息性关联。特别是在脑控型的延展实践中，外在行为完全由内在的信息行为所取代。[^(\[12\])](#chapter004.html#m12)也就是说，大脑内部的心智表征和信念系统已然先在地导引着行动，我们仿佛看到被海德格尔以上手状态驱逐出去的笛卡尔主义幽灵又借着新的形式复归，他认为对用具的瞠目凝视越少，我们对用具的理解也就越得要领。但正如前述所言，海德格尔所指的上手活动具有被心智内的实践信念取代的风险和可能性，他认为用具在被人们操作和使用的过程中变得通透了，有某种要“消失”的倾向。以盲人为例，他在平静地触摸自己的手杖时会觉知到一连串属性，比如手杖的重量、质感以及长短等，但当盲人拄着手杖行走时，他便失去了关于手杖本身的意识，他只是意识到手杖与路面的接触点，甚至连这个都不会意识到，而仅仅意识到自如的行走以及遭遇到的事物。根据塞尔的理解，海德格尔意欲表明人们日常打交道的活动拒斥自我指涉的心智状态，行动是无心智参与的、流畅的行为。延展实践对“知行合一”的可能实现说明主体内部的心智状态有着之于行动的优先性，我们甚至可以大胆地推断，海德格尔赋予上手活动以源始地位的论断是有问题的。“脱手”状态意味着人不再亲密无间地占有用具，用具用以揭示自身的存在而产生的实践之知随着人工运动和过程的延伸而消逝了。人们关注的不再是锤子之类的用具是否称手，因为新的延展实践系统比人手更有效率，锤子等用具从根本上看是没有上手的，也无须上手。因而人们从一开始面对的便是现成存在的东西，一开始关注的便是自身“观念世界”的虚拟运动何以有效地呈现为现实世界的“实在过程”。


    我们想要表明的是，在大多数情况下，一种熟练的、非表征的、技能化的应对活动与身体密切相关，人通过身体认知世界。海德格尔认为，认知活动只有用具在使用中发生故障或活动中断时才会显现，这一论断的前提在于用具与人之间的直接的上手性关联，也就是人以身体为中介操作用具展开实践活动，这类实践仍然属于传统的实践操作类型。德雷福斯所谓的技能性应对（skillful
    coping）是经过无数次训练后肢体（主要是手）与大脑的耦合，新的延展实践则不再体现人脑与人手的耦合，而是人脑与工具的耦合，大脑将延展的工具有机地融合到自己的意念操作过程中。[^(\[13\])](#chapter004.html#m13)故而，不管对用具的使用是否顺畅，都会牵涉到某种心智状态，整个实践似乎都处于大脑内部并受到心智状态的驱动。从这种意义上来说，以上手的熟练应对取代自我的心智过程是不成功的，至少在新的延展实践语境下，大脑内的状态要比外在的行为显现更为源始和在先。


    ### 三 “手”与“脑”：上手活动的创造性


    在我们看来，海德格尔指出的上手活动可以被视为一种包含认知、创造性以及身体操作在内的人类活动，既包括德雷福斯所指的熟练、技能性的应对活动，又包括亚里士多德意义上的将“形式”赋予“质料”的创造性活动。创造力不是一种只在人类大脑中进行的认知行为，头脑中的创造不能与人的身体活动相分离，也就是说，创造力不止于概念空间的映射、探索和转换，从而产生出从未有过的新奇观念，以及各种现有观念的重新组合，我们还应当将身体（手）的熟练活动考虑在内。以珠宝的设计和制造为例，设计过程中大脑中呈现的分析行为与手头的材料加工之间存在着持续的相互作用，从切割和镶嵌宝石到穿刺和切割金属，再到铸造金属和制造成品，都包含着珠宝设计者的设计理念和构思，上到手头的加工活动不是紧跟认知行为或是由之衍生而出的。虽然珠宝设计师在产品投入生产之前会思考和勾勒设计理念，但是设计和制造活动之间的界限却较为模糊，也就是说，创造力不是始于人脑中的某种意向，然后通过行动加以实现。设计师在敲击宝石时，宝石的相关信息并不由大脑予以表征和处理，以形成设计师自身意向立场的表征内容。相反，宝石和设计师的身体一样，属于其意向中不可缺少的部分，设计师不是简单地对宝石这样的人工制品施加外观或构造方面的影响，而是积极地与它们进行交互。在我们看来，海德格尔所谓的上手活动是一种具有双重维度的复杂现象，不能被简单地归为使用或操作器具的熟练实践，我们不能将使用用具的身体行动与可能具有创造力的认知行为分割开来。上手活动所体现的具身关系不仅是一种行动样式，同时也是一种认知样式，经验与实践使得我们能够有效预测手边活动的变化，并通过合理的方式（比如改变和更换使用的器具）加以应对。


    大部分研究者都将人类活动视为一种动态系统，他们基于该事实判断：这一活动是具身的并且牵涉身体行为。在海德格尔眼中，在日常生活中人首先是作为实践主体与自身、他物以及他人打交道的，同时，实践也不是无知的。[^(\[14\])](#chapter004.html#m14)此外，我们也提到上手活动不能被视为单纯的身体实践行为，它是包含“手”与“脑”在内的动态系统，创造力不是为大脑独有的专属产品，我们需要排除旧有的观念，即“创造力是认知活动的一个本质特征”，身体活动也能展现出人的创造力。从某种意义上说，珠宝加工是一种具有“反思性”特征的实践形式，创造性行动与身体行动是分不开的，二者缠结着并相互影响。熟练的工匠不仅需要在加工过程中应对材料的状态，而且要应对材料可能出现的异常情况。从某种意义上说，材料的状态转变是通过工具实现的，但是工匠在加工过程的某些节点仍有可能对不同的锻造路径作出决策，而这些决策点正是工匠展现其创造力的要点。同时我们看到，基于工匠对珠宝加工过程中的问题解决，上手活动的创造性也表现为对不断变化的情境特征的循序反应，不是按照预先设定的路径来确定解决问题的方案。这种上手活动从另一方面体现了海德格尔对情境性的强调与关注，人的上手活动是对包括情境在内的不同约束条件的适应性反应，从对环境的约束反应到对身体的运动技能的反应，到关于对象状态变化的知觉和认知上的反应，也就是说，上手活动作为“手”与“脑”的动态系统，体现的是一种情境性认知的立场。


    ## 第二节 以情境性认知取代离身性认知


    熟悉心灵哲学与认知哲学的人都知道，笛卡尔在形而上学层面将心智与身体分离开来，把前者的本质归于思维，后者的本质归于广延。他的哲学体系被这一条鸿沟深深地割裂了：一方面是离身的心智，另一方面是囊括身体的物理世界。笛卡尔说道：“我的本质就在于我是一个在思维的东西，或者就在于我是一个实体，这个实体的全部本质或本性就是思维。而且，虽然也许（或者不如说的确，像我将要说的那样）我有一个肉体，我和它非常紧密地结合在一起；不过，因为一方面我对我自己有一个清楚、分明的观念，即我只是一个在思维的东西而没有广延，而另一方面，我对于肉体有一个分明的观念，即它只是一个有广延的东西而不能思维，所以肯定的是：这个我，也就是说我的灵魂，也就是说我之所以为我的那个东西，是完全、真正跟我的肉体有分别的，灵魂可以没有肉体而存在。”[^(\[15\])](#chapter004.html#m15)笛卡尔区分了主体与客体并首先指明了“我”作为精神实体存在的真实性，他克服了怀疑主义和相对主义对主体认知可能造成的威胁。有了对主体的肯定和主体认知自我存在能力的肯定，就有了衡量客体存在知识的标尺，知识确定性因此有了立足的根据，主体对客体在认知上的把握，由此成为可能。[^(\[16\])](#chapter004.html#m16)“我思故我在”与普罗泰戈拉之“人是万物的尺度”这一命题遥相呼应，万物皆需置于主体面前予以审视，保证关于客体的知识具有客观性这一繁重任务也落在了主体之理性的肩上，而如今，以认知主义和联结主义为代表的离身性认知继承了这一趋向，从以理性统摄对象的哲学思辨转换为以计算隐喻为核心的自上而下的认知模拟。


    ### 一 离身性认知对身体和情境的忽略


    为了解释人的认知与智能活动，笛卡尔一次又一次地容忍心智与世界之间的因果交互，这让他画下的红线变得形同虚设。纵然笛卡尔对心—身、主—客的二元区分自产生之日起便遭到诸多批评，但他无疑确立了影响至今的认知范式，[^(\[17\])](#chapter004.html#m17)该范式甚至影响到了如今的计算机科学。一直以来，认知科学都是以电子计算机作为其研究和效仿的理想模型，人类的思维、推理和决策等高阶认知形式在本质上类似于计算机程序的运行过程，即构造许多可被解释、组合且赋予意义的要素与符号，在其基础上进行复制、存储以及检索等操作，早期的认知科学家认为这是人的高阶认知过程万变不离其宗的本质形式。有些强立场甚至认为我们心智的活动方式仅此无他，生成人类智能行动的心理过程是，存取已有的符号表征建立新的表征，在提取的表征基础上按照规则执行操作。由于计算机可以完美地执行这一过程，因此有人认为计算机具备实现认知的所有必要成分，而认知则是产生智能行为的充分条件，这也为关于人工智能的争论埋下了伏笔。


    在我们看来，该主张预设了认知是一种机制化的过程，完全意义上的符号处理与加工能够产生智能化的理性行动，从中我们可以看到，情境并未被纳入这一机制过程，大脑承担着近乎繁重的任务，它已成为按照既定的逻辑规则处理和运算符号的一种信息处理装置。正如计算机的软件程序与其硬件设备是可以分离的一样，心智的内容独立于人的身体和所处的情境，“身体只不过是一个恰巧适合于运行程序的载体而已”，[^(\[18\])](#chapter004.html#m18)对于离身性认知来说，实现认知和智能现象的工具或载体似乎并不重要，因为前者可以从计算系统或程序中涌现出来，是独立于身体和环境的封闭性活动，不在这一涌现机制内的身体和环境要素自然不会对人类的认知和心智构成影响。人类认知的计算隐喻将人的身体看作输入、加工和输出信息的载体，身体的物质构成（不论是碳基还是硅基形式）不是理解认知和智能的必要条件。既然认知过程与人的身体结构是相割裂的，而人的身体与世界之间存在即时、有效和丰富形式的互动，那么离身性认知在切断与身体关联的同时也等于截断了心智与更广泛的社会、文化和历史传统的通路，因而离身性认知也是非情境化的认知形式，从这种意义上说，人的认知和知觉能力独立于世界/情境中事物的属性，它通过抽象和普遍的概念思维与之产生联系，而不直接受到其作用。


    严格来说，关于离身性认知的讨论可以区分为以下三个问题：①是否存在离身的意识？②是否存在离身的心智？③是否存在离身的个体？[^(\[19\])](#chapter004.html#m19)第一个问题关系到我们的经验或心理事件有无可能在身体之外的任何物质基础上生成，比如某种离身的疼痛感。如果我们能够理解离身经验的具体观念，那么有无可能为汇集这些经验提供一个有效的基础，也就是构成某一离身的心智存在。如果我们理解了离身心智的概念，那么离身的心智是否可以被视作一个独立的个体，比如科幻小说中描述的赛博格。如今，新出现的脑机接口（Brain-Computer
    Interfaces，BCI）技术将人的心智与机器运作相连接，它以人的神经元信号作为输入信息，将其进行处理和转换之后作为输出信息来控制设备和工具。BCI系统通过头皮、表层皮质或者直接植入皮质组织中的电极记录脑电活动，随后，信号被放大和数字化，相关的信号特征被提取出来进行计算处理，并转换为可以控制应用程序或外部设备的命令。[^(\[20\])](#chapter004.html#m20)从本质上说，在脑机接口的背景下，人的大脑通过计算机而非身体来影响外部世界，更抽象地说，BCI提供了人类与计算机进行互动的一种新的方式，并通过该方式与更为广泛的物理和社会环境互动，其特点是通过思维或神经心理过程间接地改变外在世界，而无须身体本身的行动。在一定程度上，BCI超出了对身体行动的需要，从而以一种独特的方式影响着世界，身体的静止和无为状态有可能给世界留下明显的痕迹。常识是，人类影响世界的每一种手段和方式都需要其移动身体的外壳，即便只是轻微的动作，比如眨眼或说话时嘴唇的闭合。BCI的出现使得人们仅凭“思想”就可以“做事”，即使缺少身体作为中介，它创造了不同于中枢神经系统的新的通路，绕过了身体的肌肉系统，抽象而言，BCI恰恰体现出了离身性这一重要的特征。


    目前看来，虽然认知科学领域内产生的新模型，即基于情境性、具身性、生成性以及延展性的第二代认知研究纲领都在针对认知的离身性作出批判，但我们需要看到的是，BCI除了治疗那些缺失某些肢体和感官功能的人群，还有可能进一步增强健康的人的感知和行动能力，延展和提升人类大脑中思维的驱动力，使“意念控制”成为现实。从某种意义上说，BCI对于思维的实践性赋能反而强化了认知的离身性，因为大脑的认知官能可以与外在的认知工具进行直接性的交互，认知过程变得愈来愈不依赖生物学意义上的身体。脑内的认知信念和外部机器之间动态的“耦合”与“协同”强化了认知的离身立场，同时也给批判离身性认知的理论带来了新的挑战和思考。然而，我们要认识到，BCI对于离身性的支持虽在一定程度上挑战了具身性立场，但仍无法对认知的情境性立场构成冲击和威胁，原因在于，人们头脑中包含的信念来源于自身浸没着的由文化、社会与历史等要素构成的情境，如果没有情境要素的影响，大脑自身恐怕很难产生信念内容，即便产生也是空洞、盲目的。BCI使人们进一步体验到“脑”的作用，真切地感受到了“我做的一切都是靠脑来完成的”，感受到了大脑所起的重要作用与功能，[^(\[21\])](#chapter004.html#m21)客观上达到了认知强化的效果。在身体不动或者不考虑身体因素的情况下，这一特殊的认知形式强调的是大脑、与大脑相连的机器和世界在线的动态耦合，将大脑的认知负荷卸载到世界中，从而使后者承担了某些认知任务（但是早先只承认世界的影响和作用是辅助性的）。认知产生的来源不是单一的，离身认知完全忽略了有机体与世界契合的情况下生成认知行为的可能性（这种离身性的认知形式只适用于计算机或赛博格式的机器），同时，将认知和心智局限于个体的颅骨和体肤之内的观念缺乏对历史与文化情境的考量。概言之，情境在产生认知的过程中具有和大脑以及身体同样重要的作用。


    ### 二 “在世存在”就是一种情境化认知


    海德格尔的“在世存在”（Being-in-the-world）告诉我们，人类发现自身往往处于熟悉的情境中，能够知晓自己应该以何种方式正确处理遇到的问题。因此，情境以及情境中的要素是有意义的，它使我们得以明晰可以采取的应对方式，拥有恰当的方式不在于了解大量的事实与规则（这些事实与规则告诉人们应该如何有效地处理和应对面临的各种情况），在于把握情境自身开显出来的诸多可能性。理解了可能性就是理解了意义，而意义就是看到不同情境以及情境内各要素之间的联系。然而，传统认知科学的核心概念——“表征”是剥离了语境（context-independent）的结构，认知主体和被表征的对象是完全不同的两个实体。世界是物理的实在，主体具有与之相关的信念，只有在主体内在的心智状态与外在世界的状态相契合的情况下，他才能获得关于客观实在的印象、观念以及知识。如此看来，通过内在表征认识世界成为我们通达它的唯一进路，表征就像从主体这座灯塔发出的光束，以驱散情境中无意义的黑暗，对象的意义是人通过表征的方式赋予的。但在海德格尔看来，我们始终是生存于有意义世界中的情境性存在，人在世界中与他照面的诸多情境中行动着、筹划着，筹划和行动的目的是使我们更好地生存。沿着笛卡尔主义进路考察主客关系忽略了我们作为“此在”存在于世的既有事实，我们会自然而然地认为人是在物理对象的世界之外并努力获得关于这一世界的认识，会在主体和客体之间画一道形而上学意义上的“楚河汉界”，将两者划分为完全不同的实体，[^(\[22\])](#chapter004.html#m22)这恰恰是海德格尔要竭力摆脱的“阴影”。


    通过对人类日常生存的现象学分析，海德格尔发现，人们在大多数情况下是以上手和不上手两种模式来应对与之照面的事物的，以往的哲学传统总是将目光集中于客观真理。从巴门尼德区分“真理之路”与“意见之路”开始，到近代经验论和唯理论关于认识的标准以及来源的论争，再到康德提出的先天综合判断等，都是在追求普遍必然的真理，至少也是在确定衡量客观真理的某些准则。哲学家们蜂拥而至，不辞辛劳地在这片领域忙碌着，一心想着挖掘出“真理”的宝藏，以致他们无暇顾及甚至忽略了周围的事物以及日常面对的诸多情境。此外，科学的认知方式也是追求客观知识的典型例子，我们在探究某一对象时总是习惯于将之从所处的背景中截取出来，并将注意力集中于对象自身各种确定的、可量化的属性，在海德格尔看来，这种现成在手的认知方式只是人类与世界照面的诸多途径之一，[^(\[23\])](#chapter004.html#m23)但体现不出人在世界中的生存活动。在世（being-in-the-world）的英文介词是in，德雷福斯认为in有两层含义，一层是我们日常理解的空间上的意义（如“甲虫在盒子中”），另一层是生存论上的意义［如参军（in
    the army）、恋爱（in love）］，前者表示包含，后者表示因缘。[^(\[24\])](#chapter004.html#m24)因缘意味着我们所处的是一个相互交织的关系网络，情境不是以一个整体向我们呈现（情境中的事物也并非单独存在着，而是彼此相互影响），并通过我们忙碌于事物展现出来。也就是说，它不是认识论意义上的一个单纯的认知对象，而是支撑着智能体的生存活动，人的认知活动不是纯粹理性的，因为这仍然是在现成存在的意义上理解人，理解“此在”，而海德格尔认为“此在”先行沉浸于对存在的理解当中，“此在”向来对存在有所领会，德雷福斯则把“此在”对存在的领会称为“背景”。'
