- raw: '如果从相关性的角度看，海德格尔的“世界”与认知科学的“环境”之间似乎具有共同之处，两者都反对人与世界/环境的彼此绝缘与疏远。具体而言，认知研究强调“环境”在主体的人认知过程中的相关性，强调环境对于延展至个体大脑和皮肤之外的认知过程的承载（affordance）与外包（outsource），比如，嵌入认知主张，认知过程在很大程度上是以一种意想不到的方式依赖于有机体外部的器具，以及认知发生的外在环境的结构。[^(\[50\])](#chapter003.html#m50)对于新的具身—延展认知模型而言，基于感知的、在线的认知加工往往嵌入了人的身体之外的环境背景，物理、社会/文化环境中的非神经性资源被纳入延展的认知行为、倾向以及活动之中，而且在功能层面有可能被整合进一个更为广泛的认知系统。环境不只是被现成性地放置在那里，等待人们去认知或思考的物的集合，除了作为反馈机制的重要环节之外，新的认知模型主张它可以产生更为积极主动的影响和作用（当然，其中不乏一些激进的观点），以此来克服以往的心智/认知的计算模型的弊病，也就是将注意力集中于亚主体层次的神经编码和计算表征，从而构造超越认知主义的更大的概念框架。外在的环境因素能够影响发生于大脑皮层中的回路和网络的神经过程，因为大脑皮层是身体的一部分，身体则处于一个更大的物理/技术/社会环境之中，我们既可以把认知加工过程“卸载”到其中（比如我们日常使用的手机、计算机等设备），又可以将这一加工过程内化于自身的计算网络。从中我们看到，对于认知科学而言，空间性在它有关环境的理解中居于核心地位，对于海德格尔哲学中关于空间性的颠覆性理解并未给予过多关注。


    概言之，对海德格尔来说，世界不是现成空间的无限延续，他反对笛卡尔将空间数学化的操作，反对把客观的坐标系加于世界以确定空间位置。“此在”从最根本的意义上把它和对象的空间关系理解为远和近的关系，而且这种远和近的关系反过来在和“此在”的实际目的的关系中被理解。[^(\[51\])](#chapter003.html#m51)事物对于“此在”总是以上手或不上手的面貌呈现，世界可能就是这些事物所组成的相互关联的整体，它最根本的意义就是被置于同“此在”的存在关系。某种意义上说，海德格尔是在一种实践意义的范围内谈及“世界”概念的，世界是一个日常实践世界，事物之于“此在”的远近源于它在一般实践中的熟悉感。相较而言，认知科学视域下的“环境”仍是在现成存在的意义上被谈及的，它没有脱离康德甚至笛卡尔所谈论的空间范畴。


    ## 第三节 在世存在：使认知得以可能


    如果说海德格尔的存在论哲学为认知科学留下了什么重要的思想遗产的话，首先应该是他的“在世存在”概念（Being-in-the-world），这一概念直观地呈现了主体与世界的相关性问题以及主体如何在世界中存在等问题，所以它不是一个简单的概念，而是包含了诸多值得我们讨论的内容。


    在海德格尔的视域中，“在世存在”作为“此在”的存在结构，不是人作为有形的存在者在空间上被世界所有的包容状态。它所指的不是“人的身体”这个血肉之躯在一种空间的容器（讲堂、大学城）里、在所谓的世界里的现成可见状态。[^(\[52\])](#chapter003.html#m52)由此看到，海德格尔在人的存在方式方面有意识地排除了身体成分，同时他又坚决拒绝将人视为笛卡尔式的心灵实体或者胡塞尔主张的“纯粹意识”和“先验主体”。海德格尔对身体问题的避而不谈在一定意义上为梅洛-庞蒂的身体现象学留有了足够的空间，这也是为什么梅洛-庞蒂的“在世存在”与海德格尔有着貌合神离的区别。此外，杜威也表达过类似于“在世存在”的哲学思想，[^(\[53\])](#chapter003.html#m53)然而，海德格尔与梅洛-庞蒂各自所指的“在世存在”却有着较为明显的差别。


    ### 一 “在世存在”与“身体朝向世界存在”


    海德格尔“在世存在”的目标直指笛卡尔的“我思故我在”，他认为笛卡尔首先对我思者进行设定是荒谬的，不考量“我”的存在样式而预先孤立地设定自我和思维主体是本末倒置的做法。他说道，“经过一番辨析，可以看到笛卡尔的‘我思故我在’（cogito
    sum）的意图恰好就在于对‘我思’（cogito）和‘我思者’（cogitare）作出界定，然而它却遗漏了‘我在’（sum）。与此相对，在我们的考察中，我们首先将‘我思者’（cogitare）及其界定悬搁一旁，转而去争取‘我在’（sum）及其界定”。[^(\[54\])](#chapter003.html#m54)那么“我”如何在？海德格尔回答道，“在-世界-中-存在”，这是关于“此在”统一而原初的规定，它是“此在”的根本枢机，是作为其本身而整个在此的，不是由许多可分离的要素构成的整体。从字面意义上理解，“在世存在”表示“某物处在某物之中”的关系，人似乎是作为存在者居于另一个存在者（世界）之中。然而，海德格尔指出，“在世存在”不是“空间上的一物被包容在另一物之中，即两种本身在空间上具有广延的存在者的就位置和空间而言的存在关系”。[^(\[55\])](#chapter003.html#m55)空间位置的关联只是“此在”存在的一种外观样式，更为基本的，“在世存在”表达的是“此在”与世界之间更为基本的因缘关系，即“此在”总是依据与它打交道的事物来理解自身与世界。


    在海德格尔看来，“在世存在”的“在……之中”首先意味着“此在”与世界的亲熟（familiarity），我们将亲熟理解为主体和世界之间的耦合关系，像在水中游动的鱼一样具有某种相互纠缠的关联。“此在”栖留于世界，我们与世界中的其他存在者的关联是融贯的，世界对于我们而言不是一个对象。作为“此在”的我们全身心地在世界中操劳着。我和我居于其中的东西之间的关联不能基于主客体之间的关系的模式而被理解，[^(\[56\])](#chapter003.html#m56)海德格尔反对主客分立，表征恰恰又是主体性与对象之客观性相区分的产物。因此从表面上看，“此在”的“在世存在”同他对世界的表征是对立的。


    加拉格尔一直将海德格尔视作情境认知的哲学先驱，“在世存在”凸显出人（“此在”）的情境性特征，世界构成生成认知行为与活动的必要条件。在一定意义上，海德格尔的“世界”概念可以被理解为甚至等同于一种情境，当然，这样的理解还不充分，容易使人们将主体与世界的关系理解为某种刺激—反应关联。海德格尔首先指出，这种在之中的存在方式具有一种还有待于阐明的操持的特性，也就是为世界而牵挂、为世界而操心，说明我们对世界投射了意向性的关注，其中牵涉着我们的态度。他说道，“即使我百事不为而只是心怀隐忧地羁留在世界上，我也具备这一固有的操持性的在-世界-中-存在——我每时每刻都无不秉有这样的一种随身耽着的存在”。[^(\[57\])](#chapter003.html#m57)


    同为现象学的重要代表，梅洛-庞蒂也对“在世存在”给予了充分关注，他直接借鉴了海德格尔关于“在世存在”的术语表述，然而他对这一概念的界定却同海德格尔相去甚远。在我们看来，两人之间的重要分歧在于“身体性”与“在世存在”哪一个更具源始性和基础性，可以作为人类认知最原初的条件。梅洛-庞蒂从身体的知觉出发阐述人的“在世”，在他面前，世界不是作为因缘整体性的网络，而是经过了人的感知活动的改造，“世界是被感知的”（le
    monde percu）。[^(\[58\])](#chapter003.html#m58)梅洛-庞蒂认为，“世界不是我掌握其构成规律的客体，世界是自然环境，我的一切想象和我的一切鲜明知觉的场……没有内在的人，人在世界上存在，人只有在世界中才能认识自己”。[^(\[59\])](#chapter003.html#m59)在这里他明确提到了“在世”，但作为主语的不是海德格尔标识的“此在”，而是人的“活生生的身体”。


    梅洛-庞蒂可能认为，我们的身体是巧妙地融合与化解了主客二元对立的存在物，身体既是“我的”，“我”能够随心所欲地操行各种动作和行为。另外，身体又是我的“对象物”，是可以意向地静观和反思的对象，“我”能够以第三人称的视角观察和体验身体的某些感觉，比如痛觉以及肢体的麻木感。因而梅洛-庞蒂的身体是“一种保留了‘二元性’的存在”，[^(\[60\])](#chapter003.html#m60)“一种介于其（物质和心灵）间的第三种存在，一种身体-主体的存在”。[^(\[61\])](#chapter003.html#m61)“在世存在”本质上就是身体的活动，人凭借身体走向世界，梅洛-庞蒂的“在世”意图说明我们是以知觉为媒介与世界相接触的，主体积极主动地关联对象，这一关联是感性的、纠缠式的，不适合理性地分析。我不是站在上帝视角旁观对世界的知觉体验，这和海德格尔的立场有所差异：身体就是世界的一部分。身体的活动使得我们在世界中的存在成为可能，这种活动表现为一种对环境的适应性。故而，不同于海德格尔把身体视为在存在者层面上占据广延的躯体，梅洛-庞蒂将其作为理解在世之结构的切入点，身体在在世的结构中占有一席之地。通过对身体的阐明，梅洛-庞蒂明确了身体在在世的结构当中的核心地位。身体的在世表现为一种处境的在而非空间位置的在，也就是要把世界当作身体体验的场域，对此，梅洛-庞蒂认为，只要人们把世界当作一个对象，我们就不能理解世界。[^(\[62\])](#chapter003.html#m62)当我说我在世界中存在时，我指的是世界以作为人的知觉经验的方式呈现在我面前，开显出它的意义，主体也只有凭借身体进入世界并往世界中去存在，才能实现充分的自我觉知。身体与世界不可分离，世界是主体从整体上把捉的世界，身体是有认知能力的身体。另外需注意的是，梅洛-庞蒂认为身体是我们拥有世界的一般方式，活生生的身体承载着我们与世界之间的互动，而在海德格尔看来，“此在”拥有世界的原因在于世界向来就在他的生存结构之中，与身体无关。因此，梅洛-庞蒂力图恢复“身体”与世界之间前反思的连接，他的“在世存在”应该被准确地理解为“朝向世界的存在”（being-towards-the-world），“身体”通过其朝向而与世界对象在知觉中关联，[^(\[63\])](#chapter003.html#m63)这可能就是他与海德格尔的“在世存在”概念的根本差别所在。


    通过分析我们看到，梅洛-庞蒂只是借用了“在世存在”的术语，其实质内容已与海德格尔完全不同，“身体朝向世界存在”似乎更能恰当地通达他的思想。我们认为，无论是“在世存在”还是“身体朝向世界存在”，都呈现了人类存在的情境性特征，强调情境是人类存在的本质构成，区别在于施动者（agent）不同。梅洛-庞蒂批评海德格尔的“此在”是一个超越世界、凌空蹈虚、俯视苍生的局外旁观者，一个把世界作为一个由我掌握其构成规律的客体全然展现在我面前的先验主体……在世限定了“此在”看世界的视点和视角。[^(\[64\])](#chapter003.html#m64)认知主体总是处于一定情境中并为之包纳，梅洛-庞蒂对海德格尔的批评使我们意识到，本质上作为情境性存在的人类不可能对世界或情境整体进行反思，不可能有明晰的整体印象和观念，因为主体是被“身体围绕”而置于世界中的——我仅仅存在于我作为一个物体而存在的地方。[^(\[65\])](#chapter003.html#m65)从这种意义上说，梅洛-庞蒂对海德格尔的质疑是有道理的，将“在世存在”理解为不能依据主体—客体关系而得到说明的先决条件，不可表征和形式化描述使这一概念既缺乏内容而又神秘。如此，认知作为植根于“在世存在”的一种方式也是模糊不清的，因而我们认为有必要对人的“在世存在”与其表征之间的关系予以审视。


    ### 二 “此在”的“在世存在”是否消解了表征


    首先要指出的是，无论是“在世存在”抑或是“身体朝向世界存在”，它们针对的都是笛卡尔的认知模型。人们是如何将无意义的物理刺激体验为有意义的呢？所有普遍为人们所接受的神经模型都无力予以解释，即便它们都谈到了动态耦合，因为它们依然接受作为基础的笛卡尔式认知模型。[^(\[66\])](#chapter003.html#m66)


    （1）大脑通过其感觉器官接受来自世界的信息输入（视网膜上的图像、耳蜗产生的振动、鼻腔内的气味粒子等）。


    （2）大脑将特征从这些刺激信息中抽离出来，并以之构造关于世界的表征。


    从中我们看到，主体作为超然的理性实体通过感觉材料（sensory data）这一媒介与外部世界中的他物相关联，直到今天，该模型依然活跃在认知科学领域。问题在于，这一超然的实体如何与实然的世界之中的存在物有意义地关联。无心状态的感觉材料向表征式心智的转换不会生成意义，[^(\[67\])](#chapter003.html#m67)这样一来，经验知识的合法性就出现了问题，主体与对象世界的联系就被切断了，我们时时刻刻感觉到的外部世界的物性实在以及与之接触而产生的对象性知识都变得没有意义（即便有，也无法投射于我），人们只能理解“现象”杂多，却触碰不到“物自体”（这样看来，我们又回到了康德当年所面临的问题）。概言之，世界图景不是自明性的。海德格尔也同意这一点，他对人类状况的存在主义分析的意图就是表明人类存在总是以世界为首先预备上手的方式而情境性地存在。[^(\[68\])](#chapter003.html#m68)事物通过“此在”的上手和在手状态为我们所熟知，例如，幼儿第一次看到桌子时会好奇面前的东西是什么，即便我们告诉他这是桌子，他也只有关于桌子的形状、颜色、体积等模糊抑或清晰的表象，没有通透地把捉到桌子的本质（也就是使得桌子之为其自身的东西，一般而言是指它的用途）。只有当桌子上到手头（比如触摸、使用）时，他才会理解桌子的意蕴（知道桌子是用来学习、吃饭以及堆放物品的），而不是仅仅停留在关于物体表象的觉知层面。上手活动呈现了人类认知的前理论态度和特征，表达了反对以纯形式的理论光线映射事物表象的立场，该活动是我们研究“此在”在世的基础，“在世存在”就是我们与世界的其他存在者“打交道”，而打交道的活动也非仅仅依靠一种纯粹的知觉表征。


    在海德格尔看来，“在世存在”从根本上不可依靠认知来理解和把握，他反对人们以认知表征的方式理解“此在”的“在世存在”，因为这一做法会导致源始、先天的存在论关系蜕变为后天的认知关系。他认为，若要认识这种存在建构，认识活动就突出出来，而它作为对世界的认识这样的任务恰恰把它自己弄成了“心灵”对世界的关系之范本。[^(\[69\])](#chapter003.html#m69)表征虽呈现了人与世界的关系，但“在世存在”本身依旧晦暗不明，没有得到澄清。若按海德格尔的理解，表征意味着从存在者层面将“在世存在”理解为两个存在者——现成的世界与人类心智之间的映射关系，“在世存在”作为“此在”的生存论要素，表明“此在”是完全投入世界的，即“此在”与世界内的存在者首要、源始的关系不是外在的理论认知，而是“此在”全身心的专注行动，“此在”完全融入了与其他存在者的关系之中，两者亲密无间、没有距离。从这种意义上讲，“在世存在”弥合了人/心智与世界（以及世界中的实在）之间的认知间距，以及由此产生的表征关系，否认认知在人与世界关系中的首要地位。海德格尔认为，人作为“此在”早已先行投入对周围世界的操劳活动中，事物的上手操用比单纯的瞠目直观更能绽露本身的现象性质。“在操劳活动中首先照面的存在者不是纯粹的物，而是用具器物［Zeug］，我们首先与之打交道的是文具、缝纫用具、加工用具、交通用具、测量用具。”[^(\[70\])](#chapter003.html#m70)只有在操持用具的过程受到干扰和阻断之后（比如工具用着不顺手或者坏了）表征才会显现。然而，表征是人为了实现某个目的而认识外部世界的中介，人要认识世界，就必须借助表征这个中介来完成，所有表征都是心灵与外部世界直接或间接相互作用的产物，表征本身则是心灵通达世界的手段或工具。[^(\[71\])](#chapter003.html#m71)同时，表征具有意向性的特征，内在的心理表象和外在世界中的某一事件具有因果关联，而在海德格尔看来，认知表征不是“此在”勾连世界的媒介和桥梁，“认知不是一种这样的东西：那在一开始仿佛还不是在世界中存在的此在，正是通过认知、正是在认知中才产生了一种与世界的联系”。[^(\[72\])](#chapter003.html#m72)他始终是从存在出发来谈论和理解“此在”的生存问题，表征意味着“此在”与其表征对象一样是现成存在者，它依然是一种认知性活动，不像上手的操劳更能揭示“此在”与世界内其他存在者的关系。可以看到，海德格尔极力想摆脱笛卡尔、康德乃至胡塞尔推崇的主体性结构，消除由之产生的内在主体经验与外在经验客体之间的分殊，对事物的积极理解和领会不是知觉表征，而是上手性的熟练使用和操作过程。


    我们的观点是，海德格尔已然截断了主体通过表征通达世界内的事物的路径，至少不承认表征是我们接触世界的首要方式。对他而言，认知是一种典型的主—客模式的关系行为，如果我们将认知视作“此在”基本的存在方式，便会陷入表征主义的窠臼，而他极力避免引入主体/客体的区分，避免心智的意向内容与客观世界相分离。对事物的表征不是主体掠取性地出走，之后带着它所赢得的战利品又重新回到内在性的意识容器里，即便是进行着表征活动的“此在”也依然“在外”，即在世界之中，这是海德格尔最坚定的立场和观点。他举例说，“当我单纯表象起弗莱堡大教堂的时候，这并不意味着，大教堂仅仅以内在的方式现成可见地存在于表象行为之中，相反，这一单纯的表象行为在真正的和最为切合的意义上就是寓于存在者本身之中的”。[^(\[73\])](#chapter003.html#m73)换言之，表征不是由内而外地对对象的把捉，寓于存在者说明我们与之有着最为紧密的存在论联系，因为作为表征者的此在也是存在者，与作为被表征对象的存在者同样寓于世界中。“把捉正是奠基于让某物先行得见的基础之上”，[^(\[74\])](#chapter003.html#m74)被表征物是在“在世存在”这一框架的约束下被主体所“视”。“‘仅仅地’表象存在者的存在联系……同我在原本字义上的把捉活动的情况下一样，我仍在世界中寓于外部存在者处。”[^(\[75\])](#chapter003.html#m75)即使人们在单纯地表征着对象，也依然是与其他存在者一道存在于世界中，表征改变不了我们“在世存在”这一存在状况。在我们看来，“此在”在世界中的先行照面是表征过程得以产生和进行的基础，只有依凭“在世存在”去理解认知性的表征，才能准确地领会到后者是怎样作为“此在”在世的一种方式的。'
  fmt: '

    如果从相关性的角度看，海德格尔的“世界”与认知科学的“环境”之间似乎具有共同之处，两者都反对人与世界/环境的彼此绝缘与疏远。具体而言，认知研究强调“环境”在主体的人认知过程中的相关性，强调环境对于延展至个体大脑和皮肤之外的认知过程的承载（affordance）与外包（outsource），比如，嵌入认知主张，认知过程在很大程度上是以一种意想不到的方式依赖于有机体外部的器具，以及认知发生的外在环境的结构。[^(\[50\])](#chapter003.html#m50)对于新的具身—延展认知模型而言，基于感知的、在线的认知加工往往嵌入了人的身体之外的环境背景，物理、社会/文化环境中的非神经性资源被纳入延展的认知行为、倾向以及活动之中，而且在功能层面有可能被整合进一个更为广泛的认知系统。环境不只是被现成性地放置在那里，等待人们去认知或思考的物的集合，除了作为反馈机制的重要环节之外，新的认知模型主张它可以产生更为积极主动的影响和作用（当然，其中不乏一些激进的观点），以此来克服以往的心智/认知的计算模型的弊病，也就是将注意力集中于亚主体层次的神经编码和计算表征，从而构造超越认知主义的更大的概念框架。外在的环境因素能够影响发生于大脑皮层中的回路和网络的神经过程，因为大脑皮层是身体的一部分，身体则处于一个更大的物理/技术/社会环境之中，我们既可以把认知加工过程“卸载”到其中（比如我们日常使用的手机、计算机等设备），又可以将这一加工过程内化于自身的计算网络。从中我们看到，对于认知科学而言，空间性在它有关环境的理解中居于核心地位，对于海德格尔哲学中关于空间性的颠覆性理解并未给予过多关注。


    概言之，对海德格尔来说，世界不是现成空间的无限延续，他反对笛卡尔将空间数学化的操作，反对把客观的坐标系加于世界以确定空间位置。“此在”从最根本的意义上把它和对象的空间关系理解为远和近的关系，而且这种远和近的关系反过来在和“此在”的实际目的的关系中被理解。[^(\[51\])](#chapter003.html#m51)事物对于“此在”总是以上手或不上手的面貌呈现，世界可能就是这些事物所组成的相互关联的整体，它最根本的意义就是被置于同“此在”的存在关系。某种意义上说，海德格尔是在一种实践意义的范围内谈及“世界”概念的，世界是一个日常实践世界，事物之于“此在”的远近源于它在一般实践中的熟悉感。相较而言，认知科学视域下的“环境”仍是在现成存在的意义上被谈及的，它没有脱离康德甚至笛卡尔所谈论的空间范畴。


    ## 第三节 在世存在：使认知得以可能


    如果说海德格尔的存在论哲学为认知科学留下了什么重要的思想遗产的话，首先应该是他的“在世存在”概念（Being-in-the-world），这一概念直观地呈现了主体与世界的相关性问题以及主体如何在世界中存在等问题，所以它不是一个简单的概念，而是包含了诸多值得我们讨论的内容。


    在海德格尔的视域中，“在世存在”作为“此在”的存在结构，不是人作为有形的存在者在空间上被世界所有的包容状态。它所指的不是“人的身体”这个血肉之躯在一种空间的容器（讲堂、大学城）里、在所谓的世界里的现成可见状态。[^(\[52\])](#chapter003.html#m52)由此看到，海德格尔在人的存在方式方面有意识地排除了身体成分，同时他又坚决拒绝将人视为笛卡尔式的心灵实体或者胡塞尔主张的“纯粹意识”和“先验主体”。海德格尔对身体问题的避而不谈在一定意义上为梅洛-庞蒂的身体现象学留有了足够的空间，这也是为什么梅洛-庞蒂的“在世存在”与海德格尔有着貌合神离的区别。此外，杜威也表达过类似于“在世存在”的哲学思想，[^(\[53\])](#chapter003.html#m53)然而，海德格尔与梅洛-庞蒂各自所指的“在世存在”却有着较为明显的差别。


    ### 一 “在世存在”与“身体朝向世界存在”


    海德格尔“在世存在”的目标直指笛卡尔的“我思故我在”，他认为笛卡尔首先对我思者进行设定是荒谬的，不考量“我”的存在样式而预先孤立地设定自我和思维主体是本末倒置的做法。他说道，“经过一番辨析，可以看到笛卡尔的‘我思故我在’（cogito
    sum）的意图恰好就在于对‘我思’（cogito）和‘我思者’（cogitare）作出界定，然而它却遗漏了‘我在’（sum）。与此相对，在我们的考察中，我们首先将‘我思者’（cogitare）及其界定悬搁一旁，转而去争取‘我在’（sum）及其界定”。[^(\[54\])](#chapter003.html#m54)那么“我”如何在？海德格尔回答道，“在-世界-中-存在”，这是关于“此在”统一而原初的规定，它是“此在”的根本枢机，是作为其本身而整个在此的，不是由许多可分离的要素构成的整体。从字面意义上理解，“在世存在”表示“某物处在某物之中”的关系，人似乎是作为存在者居于另一个存在者（世界）之中。然而，海德格尔指出，“在世存在”不是“空间上的一物被包容在另一物之中，即两种本身在空间上具有广延的存在者的就位置和空间而言的存在关系”。[^(\[55\])](#chapter003.html#m55)空间位置的关联只是“此在”存在的一种外观样式，更为基本的，“在世存在”表达的是“此在”与世界之间更为基本的因缘关系，即“此在”总是依据与它打交道的事物来理解自身与世界。


    在海德格尔看来，“在世存在”的“在……之中”首先意味着“此在”与世界的亲熟（familiarity），我们将亲熟理解为主体和世界之间的耦合关系，像在水中游动的鱼一样具有某种相互纠缠的关联。“此在”栖留于世界，我们与世界中的其他存在者的关联是融贯的，世界对于我们而言不是一个对象。作为“此在”的我们全身心地在世界中操劳着。我和我居于其中的东西之间的关联不能基于主客体之间的关系的模式而被理解，[^(\[56\])](#chapter003.html#m56)海德格尔反对主客分立，表征恰恰又是主体性与对象之客观性相区分的产物。因此从表面上看，“此在”的“在世存在”同他对世界的表征是对立的。


    加拉格尔一直将海德格尔视作情境认知的哲学先驱，“在世存在”凸显出人（“此在”）的情境性特征，世界构成生成认知行为与活动的必要条件。在一定意义上，海德格尔的“世界”概念可以被理解为甚至等同于一种情境，当然，这样的理解还不充分，容易使人们将主体与世界的关系理解为某种刺激—反应关联。海德格尔首先指出，这种在之中的存在方式具有一种还有待于阐明的操持的特性，也就是为世界而牵挂、为世界而操心，说明我们对世界投射了意向性的关注，其中牵涉着我们的态度。他说道，“即使我百事不为而只是心怀隐忧地羁留在世界上，我也具备这一固有的操持性的在-世界-中-存在——我每时每刻都无不秉有这样的一种随身耽着的存在”。[^(\[57\])](#chapter003.html#m57)


    同为现象学的重要代表，梅洛-庞蒂也对“在世存在”给予了充分关注，他直接借鉴了海德格尔关于“在世存在”的术语表述，然而他对这一概念的界定却同海德格尔相去甚远。在我们看来，两人之间的重要分歧在于“身体性”与“在世存在”哪一个更具源始性和基础性，可以作为人类认知最原初的条件。梅洛-庞蒂从身体的知觉出发阐述人的“在世”，在他面前，世界不是作为因缘整体性的网络，而是经过了人的感知活动的改造，“世界是被感知的”（le
    monde percu）。[^(\[58\])](#chapter003.html#m58)梅洛-庞蒂认为，“世界不是我掌握其构成规律的客体，世界是自然环境，我的一切想象和我的一切鲜明知觉的场……没有内在的人，人在世界上存在，人只有在世界中才能认识自己”。[^(\[59\])](#chapter003.html#m59)在这里他明确提到了“在世”，但作为主语的不是海德格尔标识的“此在”，而是人的“活生生的身体”。


    梅洛-庞蒂可能认为，我们的身体是巧妙地融合与化解了主客二元对立的存在物，身体既是“我的”，“我”能够随心所欲地操行各种动作和行为。另外，身体又是我的“对象物”，是可以意向地静观和反思的对象，“我”能够以第三人称的视角观察和体验身体的某些感觉，比如痛觉以及肢体的麻木感。因而梅洛-庞蒂的身体是“一种保留了‘二元性’的存在”，[^(\[60\])](#chapter003.html#m60)“一种介于其（物质和心灵）间的第三种存在，一种身体-主体的存在”。[^(\[61\])](#chapter003.html#m61)“在世存在”本质上就是身体的活动，人凭借身体走向世界，梅洛-庞蒂的“在世”意图说明我们是以知觉为媒介与世界相接触的，主体积极主动地关联对象，这一关联是感性的、纠缠式的，不适合理性地分析。我不是站在上帝视角旁观对世界的知觉体验，这和海德格尔的立场有所差异：身体就是世界的一部分。身体的活动使得我们在世界中的存在成为可能，这种活动表现为一种对环境的适应性。故而，不同于海德格尔把身体视为在存在者层面上占据广延的躯体，梅洛-庞蒂将其作为理解在世之结构的切入点，身体在在世的结构中占有一席之地。通过对身体的阐明，梅洛-庞蒂明确了身体在在世的结构当中的核心地位。身体的在世表现为一种处境的在而非空间位置的在，也就是要把世界当作身体体验的场域，对此，梅洛-庞蒂认为，只要人们把世界当作一个对象，我们就不能理解世界。[^(\[62\])](#chapter003.html#m62)当我说我在世界中存在时，我指的是世界以作为人的知觉经验的方式呈现在我面前，开显出它的意义，主体也只有凭借身体进入世界并往世界中去存在，才能实现充分的自我觉知。身体与世界不可分离，世界是主体从整体上把捉的世界，身体是有认知能力的身体。另外需注意的是，梅洛-庞蒂认为身体是我们拥有世界的一般方式，活生生的身体承载着我们与世界之间的互动，而在海德格尔看来，“此在”拥有世界的原因在于世界向来就在他的生存结构之中，与身体无关。因此，梅洛-庞蒂力图恢复“身体”与世界之间前反思的连接，他的“在世存在”应该被准确地理解为“朝向世界的存在”（being-towards-the-world），“身体”通过其朝向而与世界对象在知觉中关联，[^(\[63\])](#chapter003.html#m63)这可能就是他与海德格尔的“在世存在”概念的根本差别所在。


    通过分析我们看到，梅洛-庞蒂只是借用了“在世存在”的术语，其实质内容已与海德格尔完全不同，“身体朝向世界存在”似乎更能恰当地通达他的思想。我们认为，无论是“在世存在”还是“身体朝向世界存在”，都呈现了人类存在的情境性特征，强调情境是人类存在的本质构成，区别在于施动者（agent）不同。梅洛-庞蒂批评海德格尔的“此在”是一个超越世界、凌空蹈虚、俯视苍生的局外旁观者，一个把世界作为一个由我掌握其构成规律的客体全然展现在我面前的先验主体……在世限定了“此在”看世界的视点和视角。[^(\[64\])](#chapter003.html#m64)认知主体总是处于一定情境中并为之包纳，梅洛-庞蒂对海德格尔的批评使我们意识到，本质上作为情境性存在的人类不可能对世界或情境整体进行反思，不可能有明晰的整体印象和观念，因为主体是被“身体围绕”而置于世界中的——我仅仅存在于我作为一个物体而存在的地方。[^(\[65\])](#chapter003.html#m65)从这种意义上说，梅洛-庞蒂对海德格尔的质疑是有道理的，将“在世存在”理解为不能依据主体—客体关系而得到说明的先决条件，不可表征和形式化描述使这一概念既缺乏内容而又神秘。如此，认知作为植根于“在世存在”的一种方式也是模糊不清的，因而我们认为有必要对人的“在世存在”与其表征之间的关系予以审视。


    ### 二 “此在”的“在世存在”是否消解了表征


    首先要指出的是，无论是“在世存在”抑或是“身体朝向世界存在”，它们针对的都是笛卡尔的认知模型。人们是如何将无意义的物理刺激体验为有意义的呢？所有普遍为人们所接受的神经模型都无力予以解释，即便它们都谈到了动态耦合，因为它们依然接受作为基础的笛卡尔式认知模型。[^(\[66\])](#chapter003.html#m66)


    （1）大脑通过其感觉器官接受来自世界的信息输入（视网膜上的图像、耳蜗产生的振动、鼻腔内的气味粒子等）。


    （2）大脑将特征从这些刺激信息中抽离出来，并以之构造关于世界的表征。


    从中我们看到，主体作为超然的理性实体通过感觉材料（sensory data）这一媒介与外部世界中的他物相关联，直到今天，该模型依然活跃在认知科学领域。问题在于，这一超然的实体如何与实然的世界之中的存在物有意义地关联。无心状态的感觉材料向表征式心智的转换不会生成意义，[^(\[67\])](#chapter003.html#m67)这样一来，经验知识的合法性就出现了问题，主体与对象世界的联系就被切断了，我们时时刻刻感觉到的外部世界的物性实在以及与之接触而产生的对象性知识都变得没有意义（即便有，也无法投射于我），人们只能理解“现象”杂多，却触碰不到“物自体”（这样看来，我们又回到了康德当年所面临的问题）。概言之，世界图景不是自明性的。海德格尔也同意这一点，他对人类状况的存在主义分析的意图就是表明人类存在总是以世界为首先预备上手的方式而情境性地存在。[^(\[68\])](#chapter003.html#m68)事物通过“此在”的上手和在手状态为我们所熟知，例如，幼儿第一次看到桌子时会好奇面前的东西是什么，即便我们告诉他这是桌子，他也只有关于桌子的形状、颜色、体积等模糊抑或清晰的表象，没有通透地把捉到桌子的本质（也就是使得桌子之为其自身的东西，一般而言是指它的用途）。只有当桌子上到手头（比如触摸、使用）时，他才会理解桌子的意蕴（知道桌子是用来学习、吃饭以及堆放物品的），而不是仅仅停留在关于物体表象的觉知层面。上手活动呈现了人类认知的前理论态度和特征，表达了反对以纯形式的理论光线映射事物表象的立场，该活动是我们研究“此在”在世的基础，“在世存在”就是我们与世界的其他存在者“打交道”，而打交道的活动也非仅仅依靠一种纯粹的知觉表征。


    在海德格尔看来，“在世存在”从根本上不可依靠认知来理解和把握，他反对人们以认知表征的方式理解“此在”的“在世存在”，因为这一做法会导致源始、先天的存在论关系蜕变为后天的认知关系。他认为，若要认识这种存在建构，认识活动就突出出来，而它作为对世界的认识这样的任务恰恰把它自己弄成了“心灵”对世界的关系之范本。[^(\[69\])](#chapter003.html#m69)表征虽呈现了人与世界的关系，但“在世存在”本身依旧晦暗不明，没有得到澄清。若按海德格尔的理解，表征意味着从存在者层面将“在世存在”理解为两个存在者——现成的世界与人类心智之间的映射关系，“在世存在”作为“此在”的生存论要素，表明“此在”是完全投入世界的，即“此在”与世界内的存在者首要、源始的关系不是外在的理论认知，而是“此在”全身心的专注行动，“此在”完全融入了与其他存在者的关系之中，两者亲密无间、没有距离。从这种意义上讲，“在世存在”弥合了人/心智与世界（以及世界中的实在）之间的认知间距，以及由此产生的表征关系，否认认知在人与世界关系中的首要地位。海德格尔认为，人作为“此在”早已先行投入对周围世界的操劳活动中，事物的上手操用比单纯的瞠目直观更能绽露本身的现象性质。“在操劳活动中首先照面的存在者不是纯粹的物，而是用具器物［Zeug］，我们首先与之打交道的是文具、缝纫用具、加工用具、交通用具、测量用具。”[^(\[70\])](#chapter003.html#m70)只有在操持用具的过程受到干扰和阻断之后（比如工具用着不顺手或者坏了）表征才会显现。然而，表征是人为了实现某个目的而认识外部世界的中介，人要认识世界，就必须借助表征这个中介来完成，所有表征都是心灵与外部世界直接或间接相互作用的产物，表征本身则是心灵通达世界的手段或工具。[^(\[71\])](#chapter003.html#m71)同时，表征具有意向性的特征，内在的心理表象和外在世界中的某一事件具有因果关联，而在海德格尔看来，认知表征不是“此在”勾连世界的媒介和桥梁，“认知不是一种这样的东西：那在一开始仿佛还不是在世界中存在的此在，正是通过认知、正是在认知中才产生了一种与世界的联系”。[^(\[72\])](#chapter003.html#m72)他始终是从存在出发来谈论和理解“此在”的生存问题，表征意味着“此在”与其表征对象一样是现成存在者，它依然是一种认知性活动，不像上手的操劳更能揭示“此在”与世界内其他存在者的关系。可以看到，海德格尔极力想摆脱笛卡尔、康德乃至胡塞尔推崇的主体性结构，消除由之产生的内在主体经验与外在经验客体之间的分殊，对事物的积极理解和领会不是知觉表征，而是上手性的熟练使用和操作过程。


    我们的观点是，海德格尔已然截断了主体通过表征通达世界内的事物的路径，至少不承认表征是我们接触世界的首要方式。对他而言，认知是一种典型的主—客模式的关系行为，如果我们将认知视作“此在”基本的存在方式，便会陷入表征主义的窠臼，而他极力避免引入主体/客体的区分，避免心智的意向内容与客观世界相分离。对事物的表征不是主体掠取性地出走，之后带着它所赢得的战利品又重新回到内在性的意识容器里，即便是进行着表征活动的“此在”也依然“在外”，即在世界之中，这是海德格尔最坚定的立场和观点。他举例说，“当我单纯表象起弗莱堡大教堂的时候，这并不意味着，大教堂仅仅以内在的方式现成可见地存在于表象行为之中，相反，这一单纯的表象行为在真正的和最为切合的意义上就是寓于存在者本身之中的”。[^(\[73\])](#chapter003.html#m73)换言之，表征不是由内而外地对对象的把捉，寓于存在者说明我们与之有着最为紧密的存在论联系，因为作为表征者的此在也是存在者，与作为被表征对象的存在者同样寓于世界中。“把捉正是奠基于让某物先行得见的基础之上”，[^(\[74\])](#chapter003.html#m74)被表征物是在“在世存在”这一框架的约束下被主体所“视”。“‘仅仅地’表象存在者的存在联系……同我在原本字义上的把捉活动的情况下一样，我仍在世界中寓于外部存在者处。”[^(\[75\])](#chapter003.html#m75)即使人们在单纯地表征着对象，也依然是与其他存在者一道存在于世界中，表征改变不了我们“在世存在”这一存在状况。在我们看来，“此在”在世界中的先行照面是表征过程得以产生和进行的基础，只有依凭“在世存在”去理解认知性的表征，才能准确地领会到后者是怎样作为“此在”在世的一种方式的。

    '
  trans: '


    如果从相关性的角度看，海德格尔的“世界”与认知科学的“环境”之间似乎具有共同之处，两者都反对人与世界/环境的彼此绝缘与疏远。具体而言，认知研究强调“环境”在主体的人认知过程中的相关性，强调环境对于延展至个体大脑和皮肤之外的认知过程的承载（affordance）与外包（outsource），比如，嵌入认知主张，认知过程在很大程度上是以一种意想不到的方式依赖于有机体外部的器具，以及认知发生的外在环境的结构。[^(\[50\])](#chapter003.html#m50)对于新的具身—延展认知模型而言，基于感知的、在线的认知加工往往嵌入了人的身体之外的环境背景，物理、社会/文化环境中的非神经性资源被纳入延展的认知行为、倾向以及活动之中，而且在功能层面有可能被整合进一个更为广泛的认知系统。环境不只是被现成性地放置在那里，等待人们去认知或思考的物的集合，除了作为反馈机制的重要环节之外，新的认知模型主张它可以产生更为积极主动的影响和作用（当然，其中不乏一些激进的观点），以此来克服以往的心智/认知的计算模型的弊病，也就是将注意力集中于亚主体层次的神经编码和计算表征，从而构造超越认知主义的更大的概念框架。外在的环境因素能够影响发生于大脑皮层中的回路和网络的神经过程，因为大脑皮层是身体的一部分，身体则处于一个更大的物理/技术/社会环境之中，我们既可以把认知加工过程“卸载”到其中（比如我们日常使用的手机、计算机等设备），又可以将这一加工过程内化于自身的计算网络。从中我们看到，对于认知科学而言，空间性在它有关环境的理解中居于核心地位，对于海德格尔哲学中关于空间性的颠覆性理解并未给予过多关注。


    概言之，对海德格尔来说，世界不是现成空间的无限延续，他反对笛卡尔将空间数学化的操作，反对把客观的坐标系加于世界以确定空间位置。“此在”从最根本的意义上把它和对象的空间关系理解为远和近的关系，而且这种远和近的关系反过来在和“此在”的实际目的的关系中被理解。[^(\[51\])](#chapter003.html#m51)事物对于“此在”总是以上手或不上手的面貌呈现，世界可能就是这些事物所组成的相互关联的整体，它最根本的意义就是被置于同“此在”的存在关系。某种意义上说，海德格尔是在一种实践意义的范围内谈及“世界”概念的，世界是一个日常实践世界，事物之于“此在”的远近源于它在一般实践中的熟悉感。相较而言，认知科学视域下的“环境”仍是在现成存在的意义上被谈及的，它没有脱离康德甚至笛卡尔所谈论的空间范畴。


    ## 第三节 在世存在：使认知得以可能


    如果说海德格尔的存在论哲学为认知科学留下了什么重要的思想遗产的话，首先应该是他的“在世存在”概念（Being-in-the-world），这一概念直观地呈现了主体与世界的相关性问题以及主体如何在世界中存在等问题，所以它不是一个简单的概念，而是包含了诸多值得我们讨论的内容。


    在海德格尔的视域中，“在世存在”作为“此在”的存在结构，不是人作为有形的存在者在空间上被世界所有的包容状态。它所指的不是“人的身体”这个血肉之躯在一种空间的容器（讲堂、大学城）里、在所谓的世界里的现成可见状态。[^(\[52\])](#chapter003.html#m52)由此看到，海德格尔在人的存在方式方面有意识地排除了身体成分，同时他又坚决拒绝将人视为笛卡尔式的心灵实体或者胡塞尔主张的“纯粹意识”和“先验主体”。海德格尔对身体问题的避而不谈在一定意义上为梅洛-庞蒂的身体现象学留有了足够的空间，这也是为什么梅洛-庞蒂的“在世存在”与海德格尔有着貌合神离的区别。此外，杜威也表达过类似于“在世存在”的哲学思想，[^(\[53\])](#chapter003.html#m53)然而，海德格尔与梅洛-庞蒂各自所指的“在世存在”却有着较为明显的差别。


    ### 一 “在世存在”与“身体朝向世界存在”


    海德格尔“在世存在”的目标直指笛卡尔的“我思故我在”，他认为笛卡尔首先对我思者进行设定是荒谬的，不考量“我”的存在样式而预先孤立地设定自我和思维主体是本末倒置的做法。他说道，“经过一番辨析，可以看到笛卡尔的‘我思故我在’（cogito
    sum）的意图恰好就在于对‘我思’（cogito）和‘我思者’（cogitare）作出界定，然而它却遗漏了‘我在’（sum）。与此相对，在我们的考察中，我们首先将‘我思者’（cogitare）及其界定悬搁一旁，转而去争取‘我在’（sum）及其界定”。[^(\[54\])](#chapter003.html#m54)那么“我”如何在？海德格尔回答道，“在-世界-中-存在”，这是关于“此在”统一而原初的规定，它是“此在”的根本枢机，是作为其本身而整个在此的，不是由许多可分离的要素构成的整体。从字面意义上理解，“在世存在”表示“某物处在某物之中”的关系，人似乎是作为存在者居于另一个存在者（世界）之中。然而，海德格尔指出，“在世存在”不是“空间上的一物被包容在另一物之中，即两种本身在空间上具有广延的存在者的就位置和空间而言的存在关系”。[^(\[55\])](#chapter003.html#m55)空间位置的关联只是“此在”存在的一种外观样式，更为基本的，“在世存在”表达的是“此在”与世界之间更为基本的因缘关系，即“此在”总是依据与它打交道的事物来理解自身与世界。


    在海德格尔看来，“在世存在”的“在……之中”首先意味着“此在”与世界的亲熟（familiarity），我们将亲熟理解为主体和世界之间的耦合关系，像在水中游动的鱼一样具有某种相互纠缠的关联。“此在”栖留于世界，我们与世界中的其他存在者的关联是融贯的，世界对于我们而言不是一个对象。作为“此在”的我们全身心地在世界中操劳着。我和我居于其中的东西之间的关联不能基于主客体之间的关系的模式而被理解，[^(\[56\])](#chapter003.html#m56)海德格尔反对主客分立，表征恰恰又是主体性与对象之客观性相区分的产物。因此从表面上看，“此在”的“在世存在”同他对世界的表征是对立的。


    加拉格尔一直将海德格尔视作情境认知的哲学先驱，“在世存在”凸显出人（“此在”）的情境性特征，世界构成生成认知行为与活动的必要条件。在一定意义上，海德格尔的“世界”概念可以被理解为甚至等同于一种情境，当然，这样的理解还不充分，容易使人们将主体与世界的关系理解为某种刺激—反应关联。海德格尔首先指出，这种在之中的存在方式具有一种还有待于阐明的操持的特性，也就是为世界而牵挂、为世界而操心，说明我们对世界投射了意向性的关注，其中牵涉着我们的态度。他说道，“即使我百事不为而只是心怀隐忧地羁留在世界上，我也具备这一固有的操持性的在-世界-中-存在——我每时每刻都无不秉有这样的一种随身耽着的存在”。[^(\[57\])](#chapter003.html#m57)


    同为现象学的重要代表，梅洛-庞蒂也对“在世存在”给予了充分关注，他直接借鉴了海德格尔关于“在世存在”的术语表述，然而他对这一概念的界定却同海德格尔相去甚远。在我们看来，两人之间的重要分歧在于“身体性”与“在世存在”哪一个更具源始性和基础性，可以作为人类认知最原初的条件。梅洛-庞蒂从身体的知觉出发阐述人的“在世”，在他面前，世界不是作为因缘整体性的网络，而是经过了人的感知活动的改造，“世界是被感知的”（le
    monde percu）。[^(\[58\])](#chapter003.html#m58)梅洛-庞蒂认为，“世界不是我掌握其构成规律的客体，世界是自然环境，我的一切想象和我的一切鲜明知觉的场……没有内在的人，人在世界上存在，人只有在世界中才能认识自己”。[^(\[59\])](#chapter003.html#m59)在这里他明确提到了“在世”，但作为主语的不是海德格尔标识的“此在”，而是人的“活生生的身体”。


    梅洛-庞蒂可能认为，我们的身体是巧妙地融合与化解了主客二元对立的存在物，身体既是“我的”，“我”能够随心所欲地操行各种动作和行为。另外，身体又是我的“对象物”，是可以意向地静观和反思的对象，“我”能够以第三人称的视角观察和体验身体的某些感觉，比如痛觉以及肢体的麻木感。因而梅洛-庞蒂的身体是“一种保留了‘二元性’的存在”，[^(\[60\])](#chapter003.html#m60)“一种介于其（物质和心灵）间的第三种存在，一种身体-主体的存在”。[^(\[61\])](#chapter003.html#m61)“在世存在”本质上就是身体的活动，人凭借身体走向世界，梅洛-庞蒂的“在世”意图说明我们是以知觉为媒介与世界相接触的，主体积极主动地关联对象，这一关联是感性的、纠缠式的，不适合理性地分析。我不是站在上帝视角旁观对世界的知觉体验，这和海德格尔的立场有所差异：身体就是世界的一部分。身体的活动使得我们在世界中的存在成为可能，这种活动表现为一种对环境的适应性。故而，不同于海德格尔把身体视为在存在者层面上占据广延的躯体，梅洛-庞蒂将其作为理解在世之结构的切入点，身体在在世的结构中占有一席之地。通过对身体的阐明，梅洛-庞蒂明确了身体在在世的结构当中的核心地位。身体的在世表现为一种处境的在而非空间位置的在，也就是要把世界当作身体体验的场域，对此，梅洛-庞蒂认为，只要人们把世界当作一个对象，我们就不能理解世界。[^(\[62\])](#chapter003.html#m62)当我说我在世界中存在时，我指的是世界以作为人的知觉经验的方式呈现在我面前，开显出它的意义，主体也只有凭借身体进入世界并往世界中去存在，才能实现充分的自我觉知。身体与世界不可分离，世界是主体从整体上把捉的世界，身体是有认知能力的身体。另外需注意的是，梅洛-庞蒂认为身体是我们拥有世界的一般方式，活生生的身体承载着我们与世界之间的互动，而在海德格尔看来，“此在”拥有世界的原因在于世界向来就在他的生存结构之中，与身体无关。因此，梅洛-庞蒂力图恢复“身体”与世界之间前反思的连接，他的“在世存在”应该被准确地理解为“朝向世界的存在”（being-towards-the-world），“身体”通过其朝向而与世界对象在知觉中关联，[^(\[63\])](#chapter003.html#m63)这可能就是他与海德格尔的“在世存在”概念的根本差别所在。


    通过分析我们看到，梅洛-庞蒂只是借用了“在世存在”的术语，其实质内容已与海德格尔完全不同，“身体朝向世界存在”似乎更能恰当地通达他的思想。我们认为，无论是“在世存在”还是“身体朝向世界存在”，都呈现了人类存在的情境性特征，强调情境是人类存在的本质构成，区别在于施动者（agent）不同。梅洛-庞蒂批评海德格尔的“此在”是一个超越世界、凌空蹈虚、俯视苍生的局外旁观者，一个把世界作为一个由我掌握其构成规律的客体全然展现在我面前的先验主体……在世限定了“此在”看世界的视点和视角。[^(\[64\])](#chapter003.html#m64)认知主体总是处于一定情境中并为之包纳，梅洛-庞蒂对海德格尔的批评使我们意识到，本质上作为情境性存在的人类不可能对世界或情境整体进行反思，不可能有明晰的整体印象和观念，因为主体是被“身体围绕”而置于世界中的——我仅仅存在于我作为一个物体而存在的地方。[^(\[65\])](#chapter003.html#m65)从这种意义上说，梅洛-庞蒂对海德格尔的质疑是有道理的，将“在世存在”理解为不能依据主体—客体关系而得到说明的先决条件，不可表征和形式化描述使这一概念既缺乏内容而又神秘。如此，认知作为植根于“在世存在”的一种方式也是模糊不清的，因而我们认为有必要对人的“在世存在”与其表征之间的关系予以审视。


    ### 二 “此在”的“在世存在”是否消解了表征


    首先要指出的是，无论是“在世存在”抑或是“身体朝向世界存在”，它们针对的都是笛卡尔的认知模型。人们是如何将无意义的物理刺激体验为有意义的呢？所有普遍为人们所接受的神经模型都无力予以解释，即便它们都谈到了动态耦合，因为它们依然接受作为基础的笛卡尔式认知模型。[^(\[66\])](#chapter003.html#m66)


    （1）大脑通过其感觉器官接受来自世界的信息输入（视网膜上的图像、耳蜗产生的振动、鼻腔内的气味粒子等）。


    （2）大脑将特征从这些刺激信息中抽离出来，并以之构造关于世界的表征。


    从中我们看到，主体作为超然的理性实体通过感觉材料（sensory data）这一媒介与外部世界中的他物相关联，直到今天，该模型依然活跃在认知科学领域。问题在于，这一超然的实体如何与实然的世界之中的存在物有意义地关联。无心状态的感觉材料向表征式心智的转换不会生成意义，[^(\[67\])](#chapter003.html#m67)这样一来，经验知识的合法性就出现了问题，主体与对象世界的联系就被切断了，我们时时刻刻感觉到的外部世界的物性实在以及与之接触而产生的对象性知识都变得没有意义（即便有，也无法投射于我），人们只能理解“现象”杂多，却触碰不到“物自体”（这样看来，我们又回到了康德当年所面临的问题）。概言之，世界图景不是自明性的。海德格尔也同意这一点，他对人类状况的存在主义分析的意图就是表明人类存在总是以世界为首先预备上手的方式而情境性地存在。[^(\[68\])](#chapter003.html#m68)事物通过“此在”的上手和在手状态为我们所熟知，例如，幼儿第一次看到桌子时会好奇面前的东西是什么，即便我们告诉他这是桌子，他也只有关于桌子的形状、颜色、体积等模糊抑或清晰的表象，没有通透地把捉到桌子的本质（也就是使得桌子之为其自身的东西，一般而言是指它的用途）。只有当桌子上到手头（比如触摸、使用）时，他才会理解桌子的意蕴（知道桌子是用来学习、吃饭以及堆放物品的），而不是仅仅停留在关于物体表象的觉知层面。上手活动呈现了人类认知的前理论态度和特征，表达了反对以纯形式的理论光线映射事物表象的立场，该活动是我们研究“此在”在世的基础，“在世存在”就是我们与世界的其他存在者“打交道”，而打交道的活动也非仅仅依靠一种纯粹的知觉表征。


    在海德格尔看来，“在世存在”从根本上不可依靠认知来理解和把握，他反对人们以认知表征的方式理解“此在”的“在世存在”，因为这一做法会导致源始、先天的存在论关系蜕变为后天的认知关系。他认为，若要认识这种存在建构，认识活动就突出出来，而它作为对世界的认识这样的任务恰恰把它自己弄成了“心灵”对世界的关系之范本。[^(\[69\])](#chapter003.html#m69)表征虽呈现了人与世界的关系，但“在世存在”本身依旧晦暗不明，没有得到澄清。若按海德格尔的理解，表征意味着从存在者层面将“在世存在”理解为两个存在者——现成的世界与人类心智之间的映射关系，“在世存在”作为“此在”的生存论要素，表明“此在”是完全投入世界的，即“此在”与世界内的存在者首要、源始的关系不是外在的理论认知，而是“此在”全身心的专注行动，“此在”完全融入了与其他存在者的关系之中，两者亲密无间、没有距离。从这种意义上讲，“在世存在”弥合了人/心智与世界（以及世界中的实在）之间的认知间距，以及由此产生的表征关系，否认认知在人与世界关系中的首要地位。海德格尔认为，人作为“此在”早已先行投入对周围世界的操劳活动中，事物的上手操用比单纯的瞠目直观更能绽露本身的现象性质。“在操劳活动中首先照面的存在者不是纯粹的物，而是用具器物［Zeug］，我们首先与之打交道的是文具、缝纫用具、加工用具、交通用具、测量用具。”[^(\[70\])](#chapter003.html#m70)只有在操持用具的过程受到干扰和阻断之后（比如工具用着不顺手或者坏了）表征才会显现。然而，表征是人为了实现某个目的而认识外部世界的中介，人要认识世界，就必须借助表征这个中介来完成，所有表征都是心灵与外部世界直接或间接相互作用的产物，表征本身则是心灵通达世界的手段或工具。[^(\[71\])](#chapter003.html#m71)同时，表征具有意向性的特征，内在的心理表象和外在世界中的某一事件具有因果关联，而在海德格尔看来，认知表征不是“此在”勾连世界的媒介和桥梁，“认知不是一种这样的东西：那在一开始仿佛还不是在世界中存在的此在，正是通过认知、正是在认知中才产生了一种与世界的联系”。[^(\[72\])](#chapter003.html#m72)他始终是从存在出发来谈论和理解“此在”的生存问题，表征意味着“此在”与其表征对象一样是现成存在者，它依然是一种认知性活动，不像上手的操劳更能揭示“此在”与世界内其他存在者的关系。可以看到，海德格尔极力想摆脱笛卡尔、康德乃至胡塞尔推崇的主体性结构，消除由之产生的内在主体经验与外在经验客体之间的分殊，对事物的积极理解和领会不是知觉表征，而是上手性的熟练使用和操作过程。


    我们的观点是，海德格尔已然截断了主体通过表征通达世界内的事物的路径，至少不承认表征是我们接触世界的首要方式。对他而言，认知是一种典型的主—客模式的关系行为，如果我们将认知视作“此在”基本的存在方式，便会陷入表征主义的窠臼，而他极力避免引入主体/客体的区分，避免心智的意向内容与客观世界相分离。对事物的表征不是主体掠取性地出走，之后带着它所赢得的战利品又重新回到内在性的意识容器里，即便是进行着表征活动的“此在”也依然“在外”，即在世界之中，这是海德格尔最坚定的立场和观点。他举例说，“当我单纯表象起弗莱堡大教堂的时候，这并不意味着，大教堂仅仅以内在的方式现成可见地存在于表象行为之中，相反，这一单纯的表象行为在真正的和最为切合的意义上就是寓于存在者本身之中的”。[^(\[73\])](#chapter003.html#m73)换言之，表征不是由内而外地对对象的把捉，寓于存在者说明我们与之有着最为紧密的存在论联系，因为作为表征者的此在也是存在者，与作为被表征对象的存在者同样寓于世界中。“把捉正是奠基于让某物先行得见的基础之上”，[^(\[74\])](#chapter003.html#m74)被表征物是在“在世存在”这一框架的约束下被主体所“视”。“‘仅仅地’表象存在者的存在联系……同我在原本字义上的把捉活动的情况下一样，我仍在世界中寓于外部存在者处。”[^(\[75\])](#chapter003.html#m75)即使人们在单纯地表征着对象，也依然是与其他存在者一道存在于世界中，表征改变不了我们“在世存在”这一存在状况。在我们看来，“此在”在世界中的先行照面是表征过程得以产生和进行的基础，只有依凭“在世存在”去理解认知性的表征，才能准确地领会到后者是怎样作为“此在”在世的一种方式的。


