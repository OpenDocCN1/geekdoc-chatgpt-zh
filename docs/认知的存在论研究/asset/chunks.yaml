    # 第五章 存在论认知的拓展：诠释学与认知研究的融合


    在前述的内容中，笔者从海德格尔的存在论视角审视了当前主要的认知科学研究进路，具体探讨了存在论关涉认知的主要核心概念和论题，并剖析了存在论现象学与认知科学具体结合过程中可能产生的两个理论困难。笔者由此产生了一个疑问，即目前对存在论与认知科学相结合的考虑是否全面？存在论作为切入认知研究的一条新的路径与视角，为我们审视和考察人类认知活动进行了有益的尝试。然而，正如我们在前面谈到的，存在论作为认知科学的单独“智库”是不够的，二者相结合所产生的存在论认知也需要新“资源”的填充和注入，而诠释学与存在论的特殊关联，使得我们看到了存在论认知向诠释学拓展的可能性。我们相信，认知科学（包括人工智能）可以从诠释学这里得到有益的启示，二者之间存在着合理的通路。


    ## 第一节 存在论认知为何要向诠释学拓展

    '
  toc: []
- raw: '诠释学（Hermeneutics），本义是宣告、翻译、解释和阐明的技术，它的词根源自古希腊神话中诸神的信使赫耳墨斯（Hermes），他专门为人类带来天启，不是简单地宣告天神的旨意，而是将神的语言翻译为人的语言，从而向人类传达和诠释诸神的话语，因而诠释学具有呈现意义的维度，是不同语言之间的意义转换。一般而言，人们将之界定为有关理解和解释的理论和实践，它是一种关于意义的理解和解释的理论和哲学。诠释学主要来源于两种形式：一是来自法律的法学解释，二是来自圣经经典文献的神学和文献学解释。经过德国哲学家施莱尔马赫以及狄尔泰的努力，诠释学摆脱了一切教义的偶然因素，成为一门关于理解和解释的一般性学说，它也从一开始对文本和历史的理解逐渐转向了对人的理解活动的理解，它为自身规定的任务在于调和与化解各种解释之间的冲突，从而成为人文学科的方法论基础和普遍的哲学方法。[^(\[1\])](#chapter006.html#m1)


    在我们看来，将诠释学看作存在论认知的发展趋向并从中汲取可能的观念启示，这并不是天马行空式的思维跳跃和想象，而是有着重要的逻辑理路。对于海德格尔来说，存在论的目的是对作为存在着的“此在”之存在意义的追问，不论是他早期以“此在”为核心的基础存在论，还是后期对存在意义本身的追问，他的手段和方法就是诠释学。若要表明诠释学可以被运用于认知研究的某些领域，我们就要给出适当的理由来说明这一过渡和扩展是合理的。


    ### 一 海德格尔的存在论现象学就是一种诠释学


    从海德格尔开始，他不再使诠释学去关注理解和解释本身，而是将理解视为“此在”本身一个重要的生存论要素，“此在”通过理解来意识到自己存在于一个世界之中。从某种意义上说，海德格尔关于“此在”的现象学就是一种诠释学，“此在”是作为理解的“此在”，对“此在”之生存结构的刻画与分析本身就具有诠释的性质，“现象学描述的方法论意义就是解释……通过诠释，存在的本真意义与此在本己存在的基本结构就向居于此在本身的存在之领会宣告出来。此在的现象学就是诠释学”。[^(\[2\])](#chapter006.html#m2)“此在”自始就将对存在意义的把握当作自属的课题，而意义的领会和阐释又属于诠释学的研究范畴，那么自然会逻辑地得出关于“此在”的现象学就是诠释学这一结论。既然“此在”的现象学就是诠释学，而“此在”的现象学作为“此在”的生存论分析的工作本身就构成了探究存在意义问题的基础存在论，那么，我们也可以说“此在”的诠释学也就是基础存在论。[^(\[3\])](#chapter006.html#m3)海德格尔提出诠释学的目的也在于探究“此在”自身的存在，“此在”向来是在理解和解释，源始地产生了对存在的主题性或非主题性的理解，这种理解和解释活动的本质就是“此在”关于存在的反思。这一反思不是胡塞尔所指的意识行为，而是“此在”的一种存在方式，牵涉着“此在”对自己以及其他存在者的存在状况的理解。也就是说，海德格尔不满足于将理解仅限于一种认知方式，而是将之作为我们在世界中存在并与世界打交道的一种基本能力，即“我知道如何去处理我在做的事情，在每一个情境中我都能做恰当的事情”。[^(\[4\])](#chapter006.html#m4)这也是后来伽达默尔更加明确化了的重要观点——诠释学就是实践哲学，[^(\[5\])](#chapter006.html#m5)从一种解释转向另一种解释表明了人们如何应对不同的生存境况。人与世界打交道的过程本身就是对世界敞开的过程，它呈现出人在时间和空间维度同世界中的其他事物之间的交互。在海德格尔那里，理解是与“此在”相关的全部模式，包括感知、知道如何的实践性知识、知道是什么的认知性知识以及和其他人的日常打交道活动，而不仅仅是作为一种认知现象呈现在我们面前。


    概言之，海德格尔的存在论现象学就是诠释学，两者之间存在着本质上的关联，因为人（“此在”）始终对存在具有本真或非本真的理解，如何将关于存在意义的恰当理解显现出来，这成为诠释学与基础存在论共同的任务。由此，诠释学便从传统的阐释文本的方法论提高到了哲学本身的地位与高度，诠释学成为人对存在的理解。既然海德格尔的存在论现象学与诠释学是一体的，而后继的伽达默尔亦在整体上承袭了海德格尔的诠释学思想，那么我们便有理由认为，存在论与认知研究的结合同样可以扩展到诠释学，也就是说，诠释学的思想资源可以在认知研究中加以汲取和利用。


    ### 二 认知也是一种诠释


    海德格尔提出诠释学也是为了克服近代以来盛行的主体认识论，在他看来，这种孤立的、无世界性的认知主体观念破坏了人与世界之间源始的存在关联，并在这一被遮蔽的关联之上建立了新的联系，而存在论现象学（具体来说是“此在”的生存论分析）的任务之一就在于从世界来理解人与事物之间的各种关系。理解就是世界本身和“此在”与世界的关系的具体化，存在不能没有“此在”的理解，存在呈现在“此在”的理解中。[^(\[6\])](#chapter006.html#m6)人不仅是一种行动的存在，而且是诠释的存在，人的认知与行动先在地被领会和理解了。从某种意义上说，认知本身也是一种行动，原因在于它的表征性，即认知对象的模型或对应物的形成过程，认识和呈现个体事物、形成理论以及设计模型都是一种诠释的过程。或许我们可以将诠释视为对认知对象的解释性呈现，人一直是以诠释的方式，并且从不同的视角来面对世界，人的思维、认知、行动都依赖于诠释、渗透着诠释，如果没有符合逻辑的诠释，我们就不能思考、认识、行动、评价和评判。[^(\[7\])](#chapter006.html#m7)


    除了诠释对于认知的渗透性之外，人类认知对于诠释的依赖性也极深，经过仔细思考就会发现，我们绝大部分关于事物、事件的认知、思考、判断和评价中潜藏着诠释的身影，诠释普遍渗透于人的认知现象和智能活动之中。我们在日常生活中面对的大部分是具有可理解性的事实（维特根斯坦就认为，“世界是事实而非物的总和”），事实经过诠释才被我们所认知和理解，可以说，事实的存在是某种诠释的产物，它呈现在我们的认知当中。任何事物只有作为对象被纳入诠释过程中才能被认识，我们甚至可以推断，诠释的范围才是我们认知的范围，人的认知世界通过诠释而被理解和建构。人的认知活动产生的结果也是一种诠释的结果，我们既以认知的方式，同时又以诠释的方式朝向世界，作为一种能诠释并且时刻在诠释着的存在，我们在思维、认知和行动过程中依赖于这一要素。


    另外，诠释与认知具有结构上的“家族相似”。一般而言，人的认知行为与过程都联结着作为始端和终端的认知主体和认知客体（虽然不少哲学家反对这样的截然二分，但普遍的共识仍是这一主张）。同样的，当我们在进行诠释时，作为思维活动和符号行动的诠释本身也是以诠释客体为前提的，[^(\[8\])](#chapter006.html#m8)从某种意义上说，人的认知和诠释行为都承认被认知之物和被诠释之物的定然存在。区别在于，人类认知（比如科学认知）内在地要求保持认知对象/客体的相对完整性和原初性，即本身的是其所是，不对被给予之物施以任何的更改，从而追求思维与存在的绝对符合与同一。与之不同，被诠释之物则被诠释所渗透，被诠释的客体在一定程度上是经由诠释过程构建的产物，不是什么绝对不变的东西，诠释客体的过程同时也是一个建构的过程，其中包含的自我理解触及对象物。同时，诠释的实施者与执行者就是诠释的主体，诠释主体与认知主体一样，是具有积极和主动能力的存在，需要将对象/客体纳入自身的图式内，认知和诠释活动都以具有认知能力和诠释能力的主体为前提，诠释与认知一样，是一种由某个个体采取的行动。


    ### 三 诠释学能够对认知科学产生助益


    第一，从整体上看，诠释学与认知科学似乎有着相同的目标，都在从根本上寻求关于人类理解和认知的一般性和普遍性解释。两者代表着人文科学和自然科学的分野，在理解的性质以及如何理解他人等问题上，诠释学与认知科学之间有可能相互助力，并且弥合诠释学和认知科学在方法、对象和性质方面的差别。但是这样的做法必定会遭遇不小的挑战与困难，最明显之处在于诠释学是以“非确定性”的原则来探索人类的理解现象，而认知科学追求的是严谨、精确性和可预测性，突出的代表是认知主义的可计算模型。在我们看来，精确性的解释也是一种理解模式，提供了关于人类理解的另一种可能性。对于哲学诠释学而言，它的任务是探索语言、符号与象征的理解和解释之可能性与基础，[^(\[9\])](#chapter006.html#m9)这和认知科学的一些研究目标相符。实际而言，对人类认知和心智现象的解蔽就是一种理解，因而在理解的一般意义上，诠释学与认知科学之间有明显的通路。不论是技术诠释学、哲学诠释学还是解释哲学，它们关于理解的方法和规则，以及对理解和解释的反思都有可能对探究人类认知有所助益。


    第二，关于理解的本质，伽达默尔提出了“视界融合”概念，强调每一个体都有自身无法摆脱的历史条件，就像我们完全脱离不了身体的束缚和限制，由个人所处的文化、语言和历史实践传统所决定。理解是在视界不断融合与交互的过程中产生的，或者说，理解的过程就是视界融合的过程。理解一经产生，被理解物的视界便进入了理解者的视界之中，从而生成新的视界。理解最终是获得以视界融合为标志的新视界，这体现了理解变动不居的动态特征，在视界与视界间的碰撞中，理解的前见中的一些东西被扬弃，同时又加进了新的东西。也就是说，视界的开放性和不封闭性使得人类理解不断运动着，体现出一种可变化性。


    第三，诠释学的首要特征是突出、深化了理解的整体性原则。在诠释学的视域中，任何被理解的对象（包括观念体系）都是一个有机的整体，各个部分之间都相互联系着，对部分的理解要求建立在对整体的理解之上。也就是说，理解任何一个单一的思想和原则，都必须关注思想所栖居的整体历史背景，在理解部分的同时要将思想整体予以深化和具体化，另外，对思想整体的理解离不开对各个单一思想的理解，如此便在整体与部分层面实现了理解的循环运动。同样的，人类认知活动的展开也需要一个包含着具体情境的解释框架，从而推动我们对于客体和对象的认知把握，客体本身的意义不是固定不变的，而是随着主体的诠释和理解具有了某种相对性。也就是说，人类认知在某种程度上也处于一种循环之中。


    第四，认知科学作为精神科学与自然科学的交叉和结合的产物，在我们看来，它的本质既非解释的，亦非理解的，而是类似于光的波粒二象性特征：既可以部分地利用解释的方法进行描述，也可以部分地利用理解的方法进行描述。也就是说，既能以确定的符号结构或概念体系来解释或描述对象（在某种程度上，科学的解释要求排斥个体主观意义上的自我理解，而认知科学中的相关哲学问题却需要相关实证经验的支撑），又能以某种开放性、创造性的方式理解对象。因此，与科学解释发现真理不同，理解过程本质上是生成性的。前者表现为一种符合式的认知观，具有确定的、普遍的评判标准，只有符合对象的解释和描述才是合理的、正确的，甚至可称为真理。相较而言，由于理解自身难以规避的主观因素，因而它所生成的东西具有很大的流动性，不可避免地会被烙上相对性以及不确定性的印记。


    概言之，我们想表明的是，诠释学与存在论不是相互割裂的两个领域，相反，二者是相互融合、彼此互通的关系，基于诠释学对人类认知的描述不是存在论认知不合理的凭空跳跃，而是我们基于前述四个原因作出的有效推断。正如我们下文所指出的，诠释学能够为在不确定的、不依据方法规则之情境中的认知现象提供一种合理的解释，区别于具有固定形式并且结构性较强的认知现象，比如计算。如何应对非形式、不确定的、模糊的认知活动，这是诠释学能够给予认知研究的有效启示。


    ## 第二节 计算究竟是一种解释还是理解


    作为认知科学中流行的解释模式，计算主义追求一种对认知、心智、生命乃至宇宙的确定性描述以及抽象化理解，目的就是要把具有模糊特征的表象世界以符号化、逻辑化的方式加以固定。一直以来，计算带给我们的是不可思议的强大预测力，甚至使得人们笃定了计算主义可以成为一种世界观的想法，例如天文学家能够根据开普勒定律和牛顿的万有引力定律准确计算出小行星的运行周期和轨迹。[^(\[10\])](#chapter006.html#m10)理论的威力在于预见，计算主义取得的巨大成功给予了人们圆满解决认知难题的希望与勇气，它不仅将计算作为研究人类认知的主要手段，还将其当作目的，甚至在哲学层面将人类认知和心智的本质视为基于规则的符号计算。在我们看来，认知计算主义的解释链条在面对关于人类理解的问题时出现了某种“断裂”，也就是有没有可能用严格客观的计算术语来说明人的理解的不确定性和相对性。[^(\[11\])](#chapter006.html#m11)加拉格尔认为，在这一问题上诠释学能够给予认知科学一些支持，计算与理解之间的裂痕能够弥合。


    ### 一 计算作为一种人类理解方式的可能性


    人的理解不是计算，但计算可以作为人类理解的一种形式吗？在尝试回答这一问题之前，我们需要对“计算”这一重要概念进行界定。计算是什么？这个问题对很多人来说可能是一个微不足道的问题，但是在心灵哲学、认知科学甚至物理学中，这一点远未达成共识。缺乏共识产生了一些有争议的主张，比如说认知甚至宇宙都是计算的。不过有些人认为，计算是一种主观现象：一个物理系统是否是计算性的，以及如果是的话，它进行的是何种计算，完全是观察者选择怎样看待它的问题。按照塞尔的理解，世界上只有一个系统可以进行计算，其他系统只有相对于这个系统才可以说是不是在进行计算。[^(\[12\])](#chapter006.html#m12)某一过程能否称为计算，其评判尺度在于人，是相对于人而言的，也就是说，人可以将任一足够复杂的过程视为计算。对于任何足够复杂的物理对象O（即具有足够多的可区分的部分）以及对于任意的程序规范P，存在从O的物理状态的某一子集S向P的形式结构的同构映射。[^(\[13\])](#chapter006.html#m13)在我们看来，他的这一主张强调的是计算的呈现形式，计算从形式上看是从一种符号状态向另一种符号状态的映射，并且这种映射需要因果地实现。然而，这样的实现过程是否伴随或携带着语义与信息，则是人们围绕计算产生的又一个争论与分歧点，计算也因此被视为有意义的信息处理过程。但无论是信息式的还是语义式的计算观念，都基于一种人类中心主义立场，因为信息、语义等都是关于人并由人赋予对象的东西。最为极端的看法是，没有人，便没有信息与语义，因而没有人就没有计算。另外一种观点认为计算是纯粹的句法操作，塞尔著名的“中文屋”思想实验就是以此为基础的，他论证了计算是依循句法规则的，心智则能理解意义，并且能够给意义赋予这些符号，计算的运作过程以一种纯粹的句法学的方式得到界定。[^(\[14\])](#chapter006.html#m14)在这里，我们将计算概念定义为在明确界定的有限范围内，受到规则支配的信息处理过程，也可指计算模型或计算机的计算过程。


    加拉格尔认为，计算方式适用于处理没有和情境产生关联的、简单的形式活动，抑或是诸如下象棋这样的形式活动，大部分简单或复杂的形式过程都是去情境化的，都是一种理论知识，而非一种实践知识。后者需要运用想象或直觉的顿悟，去获取人类生活的不确定环境中生发出来的问题的答案，大多数情况下，我们无须以精确的方式去应对和处理生活世界中发生的事件，更无须以纯粹理性的计算程序来决定我们下一步要做什么。从这种意义上说，现实的生活世界不是依靠计算，而是依靠人自身的理解。


    在我们看来，诠释学最为突出的贡献之一就在于对解释和理解的区分。亚里士多德指出“口语是心智的符号，而文字是口语的符号”，这表明他的诠释学思想混淆了理解和解释，[^(\[15\])](#chapter006.html#m15)直接将二者视为同一的概念。施莱尔马赫在语言和心理层面对理解和解释进行了区分，他认为解释总是需要语言作为载体，理解既能够以语言表达，亦能在心理层面表达和体验，因此两者的实现方式有所不同。相较而言，狄尔泰区分得更为严格，他将理解与解释截然对立起来，使之分属于精神科学与自然科学各自的方法论领域，因而精神科学与自然科学之间呈现出对立局面。如果依照狄尔泰的观点，认知科学本身具有的交叉学科性质意味着其内部会产生理解与解释的分疏，那么，认知科学领域中大行其道的计算究竟是人的理解方式还是客观的解释方式，我们认为有必要予以讨论。[^(\[16\])](#chapter006.html#m16)


    一方面，计算是否可以作为人类理解的一种方式而存在？也就是说，人类理解是否能够通过计算的符号操作方式呈现？英国数学物理学家彭罗斯认为人类智能的确体现了一种计算力，但是除了计算力之外，人类智能更多地体现为某种理解力。[^(\[17\])](#chapter006.html#m17)也许在他看来，计算力具有一种能够依循的客观而精确的尺度，形式化计算难以说明和描述认知与意识活动的主观性特质，其根源可能依然是老生常谈的主—客鸿沟。依据逻辑规则进行确定性描述的计算如何能够准确地刻画主体内部晦暗的、充斥着不确定性的理解活动？表面看来，人的理解活动与计算相去甚远，但是一个普遍性的原则告诉我们：任何通过语言来表达的理论，无论是自然科学还是精神科学，它们作为知识都存在着通过语言而对语言诠释与理解的问题。[^(\[18\])](#chapter006.html#m18)只要对象被语言所染指（不管是自然语言还是人工语言），它便成为一种语言性存在，海德格尔指出语言是存在之家，维特根斯坦也将语言的界限看作世界的界限。只要关联语言，就必然会牵涉到被理解和认知的问题，反过来说，一切理解和认知都发生在语言之中，理解者与被理解之物、认知主体与认知对象只有在语言中才能产生具体的关联。


    计算模型使用的人工语言在确定其规则时是超越情境的，但依据规则的描述似乎依然能通达对象的结构要素，逻辑实证主义已然作过这样的尝试。相反，人的理解则是向情境敞开的，施莱尔马赫强调理解本身所具有的一种“设身处地”的精神，“理解的本质在于，通过移情的心理学方法创造性地还原或重建作者所要表达的东西”。[^(\[19\])](#chapter006.html#m19)此外，诠释学内在具有的开放精神使得理解本身具有一种开放性，原因在于理解活动的原初意义就是指读者与作者之间的“对话”，这一过程是以作品为中介的。“对话”意味着双方之间没有设限，并不存在一个统一的严格规则来对理解活动进行约束，也就是说，理解本身似乎是没有规范性的，理解者的主观创造性使理解呈现出多元化的趋势（莎士比亚的名言——“一千个读者眼中就会有一千个哈姆雷特”充分说明了人类理解本身具有的丰富可能性）。相比之下，计算模型在处理具有开放关系和结构的问题时却显得有些手足无措。此外，遵循线性的形式规则的计算难以应对生成的多种意义的可能性。在理解过程中，由于历史性已经被内化为普遍的原则，因此理解者无论是理解文本还是作者，总是要将其置于一个更大的历史情境当中，理解的历史性特征在很大程度上决定了人的理解是情境化的。同时，理解作为一个开放的过程，不断会有新的要素汇入，意义因而是不断涌现和生成的。'
  fmt: '

    # 诠释学与认知研究


    诠释学（Hermeneutics），本义是宣告、翻译、解释和阐明的技术，它的词根源自古希腊神话中诸神的信使赫耳墨斯（Hermes），他专门为人类带来天启，不是简单地宣告天神的旨意，而是将神的语言翻译为人的语言，从而向人类传达和诠释诸神的话语，因而诠释学具有呈现意义的维度，是不同语言之间的意义转换。一般而言，人们将之界定为有关理解和解释的理论和实践，它是一种关于意义的理解和解释的理论和哲学。诠释学主要来源于两种形式：一是来自法律的法学解释，二是来自圣经经典文献的神学和文献学解释。经过德国哲学家施莱尔马赫以及狄尔泰的努力，诠释学摆脱了一切教义的偶然因素，成为一门关于理解和解释的一般性学说，它也从一开始对文本和历史的理解逐渐转向了对人的理解活动的理解，它为自身规定的任务在于调和与化解各种解释之间的冲突，从而成为人文学科的方法论基础和普遍的哲学方法。[^(\[1\])](#chapter006.html#m1)


    在我们看来，将诠释学看作存在论认知的发展趋向并从中汲取可能的观念启示，这并不是天马行空式的思维跳跃和想象，而是有着重要的逻辑理路。对于海德格尔来说，存在论的目的是对作为存在着的“此在”之存在意义的追问，不论是他早期以“此在”为核心的基础存在论，还是后期对存在意义本身的追问，他的手段和方法就是诠释学。若要表明诠释学可以被运用于认知研究的某些领域，我们就要给出适当的理由来说明这一过渡和扩展是合理的。


    ## 一 海德格尔的存在论现象学就是一种诠释学


    从海德格尔开始，他不再使诠释学去关注理解和解释本身，而是将理解视为“此在”本身一个重要的生存论要素，“此在”通过理解来意识到自己存在于一个世界之中。从某种意义上说，海德格尔关于“此在”的现象学就是一种诠释学，“此在”是作为理解的“此在”，对“此在”之生存结构的刻画与分析本身就具有诠释的性质，“现象学描述的方法论意义就是解释……通过诠释，存在的本真意义与此在本己存在的基本结构就向居于此在本身的存在之领会宣告出来。此在的现象学就是诠释学”。[^(\[2\])](#chapter006.html#m2)“此在”自始就将对存在意义的把握当作自属的课题，而意义的领会和阐释又属于诠释学的研究范畴，那么自然会逻辑地得出关于“此在”的现象学就是诠释学这一结论。既然“此在”的现象学就是诠释学，而“此在”的现象学作为“此在”的生存论分析的工作本身就构成了探究存在意义问题的基础存在论，那么，我们也可以说“此在”的诠释学也就是基础存在论。[^(\[3\])](#chapter006.html#m3)海德格尔提出诠释学的目的也在于探究“此在”自身的存在，“此在”向来是在理解和解释，源始地产生了对存在的主题性或非主题性的理解，这种理解和解释活动的本质就是“此在”关于存在的反思。这一反思不是胡塞尔所指的意识行为，而是“此在”的一种存在方式，牵涉着“此在”对自己以及其他存在者的存在状况的理解。也就是说，海德格尔不满足于将理解仅限于一种认知方式，而是将之作为我们在世界中存在并与世界打交道的一种基本能力，即“我知道如何去处理我在做的事情，在每一个情境中我都能做恰当的事情”。[^(\[4\])](#chapter006.html#m4)这也是后来伽达默尔更加明确化了的重要观点——诠释学就是实践哲学，[^(\[5\])](#chapter006.html#m5)从一种解释转向另一种解释表明了人们如何应对不同的生存境况。人与世界打交道的过程本身就是对世界敞开的过程，它呈现出人在时间和空间维度同世界中的其他事物之间的交互。在海德格尔那里，理解是与“此在”相关的全部模式，包括感知、知道如何的实践性知识、知道是什么的认知性知识以及和其他人的日常打交道活动，而不仅仅是作为一种认知现象呈现在我们面前。


    概言之，海德格尔的存在论现象学就是诠释学，两者之间存在着本质上的关联，因为人（“此在”）始终对存在具有本真或非本真的理解，如何将关于存在意义的恰当理解显现出来，这成为诠释学与基础存在论共同的任务。由此，诠释学便从传统的阐释文本的方法论提高到了哲学本身的地位与高度，诠释学成为人对存在的理解。既然海德格尔的存在论现象学与诠释学是一体的，而后继的伽达默尔亦在整体上承袭了海德格尔的诠释学思想，那么我们便有理由认为，存在论与认知研究的结合同样可以扩展到诠释学，也就是说，诠释学的思想资源可以在认知研究中加以汲取和利用。


    ## 二 认知也是一种诠释


    海德格尔提出诠释学也是为了克服近代以来盛行的主体认识论，在他看来，这种孤立的、无世界性的认知主体观念破坏了人与世界之间源始的存在关联，并在这一被遮蔽的关联之上建立了新的联系，而存在论现象学（具体来说是“此在”的生存论分析）的任务之一就在于从世界来理解人与事物之间的各种关系。理解就是世界本身和“此在”与世界的关系的具体化，存在不能没有“此在”的理解，存在呈现在“此在”的理解中。[^(\[6\])](#chapter006.html#m6)人不仅是一种行动的存在，而且是诠释的存在，人的认知与行动先在地被领会和理解了。从某种意义上说，认知本身也是一种行动，原因在于它的表征性，即认知对象的模型或对应物的形成过程，认识和呈现个体事物、形成理论以及设计模型都是一种诠释的过程。或许我们可以将诠释视为对认知对象的解释性呈现，人一直是以诠释的方式，并且从不同的视角来面对世界，人的思维、认知、行动都依赖于诠释、渗透着诠释，如果没有符合逻辑的诠释，我们就不能思考、认识、行动、评价和评判。[^(\[7\])](#chapter006.html#m7)


    除了诠释对于认知的渗透性之外，人类认知对于诠释的依赖性也极深，经过仔细思考就会发现，我们绝大部分关于事物、事件的认知、思考、判断和评价中潜藏着诠释的身影，诠释普遍渗透于人的认知现象和智能活动之中。我们在日常生活中面对的大部分是具有可理解性的事实（维特根斯坦就认为，“世界是事实而非物的总和”），事实经过诠释才被我们所认知和理解，可以说，事实的存在是某种诠释的产物，它呈现在我们的认知当中。任何事物只有作为对象被纳入诠释过程中才能被认识，我们甚至可以推断，诠释的范围才是我们认知的范围，人的认知世界通过诠释而被理解和建构。人的认知活动产生的结果也是一种诠释的结果，我们既以认知的方式，同时又以诠释的方式朝向世界，作为一种能诠释并且时刻在诠释着的存在，我们在思维、认知和行动过程中依赖于这一要素。


    另外，诠释与认知具有结构上的“家族相似”。一般而言，人的认知行为与过程都联结着作为始端和终端的认知主体和认知客体（虽然不少哲学家反对这样的截然二分，但普遍的共识仍是这一主张）。同样的，当我们在进行诠释时，作为思维活动和符号行动的诠释本身也是以诠释客体为前提的，[^(\[8\])](#chapter006.html#m8)从某种意义上说，人的认知和诠释行为都承认被认知之物和被诠释之物的定然存在。区别在于，人类认知（比如科学认知）内在地要求保持认知对象/客体的相对完整性和原初性，即本身的是其所是，不对被给予之物施以任何的更改，从而追求思维与存在的绝对符合与同一。与之不同，被诠释之物则被诠释所渗透，被诠释的客体在一定程度上是经由诠释过程构建的产物，不是什么绝对不变的东西，诠释客体的过程同时也是一个建构的过程，其中包含的自我理解触及对象物。同时，诠释的实施者与执行者就是诠释的主体，诠释主体与认知主体一样，是具有积极和主动能力的存在，需要将对象/客体纳入自身的图式内，认知和诠释活动都以具有认知能力和诠释能力的主体为前提，诠释与认知一样，是一种由某个个体采取的行动。


    ## 三 诠释学能够对认知科学产生助益


    第一，从整体上看，诠释学与认知科学似乎有着相同的目标，都在从根本上寻求关于人类理解和认知的一般性和普遍性解释。两者代表着人文科学和自然科学的分野，在理解的性质以及如何理解他人等问题上，诠释学与认知科学之间有可能相互助力，并且弥合诠释学和认知科学在方法、对象和性质方面的差别。但是这样的做法必定会遭遇不小的挑战与困难，最明显之处在于诠释学是以“非确定性”的原则来探索人类的理解现象，而认知科学追求的是严谨、精确性和可预测性，突出的代表是认知主义的可计算模型。在我们看来，精确性的解释也是一种理解模式，提供了关于人类理解的另一种可能性。对于哲学诠释学而言，它的任务是探索语言、符号与象征的理解和解释之可能性与基础，[^(\[9\])](#chapter006.html#m9)这和认知科学的一些研究目标相符。实际而言，对人类认知和心智现象的解蔽就是一种理解，因而在理解的一般意义上，诠释学与认知科学之间有明显的通路。不论是技术诠释学、哲学诠释学还是解释哲学，它们关于理解的方法和规则，以及对理解和解释的反思都有可能对探究人类认知有所助益。


    第二，关于理解的本质，伽达默尔提出了“视界融合”概念，强调每一个体都有自身无法摆脱的历史条件，就像我们完全脱离不了身体的束缚和限制，由个人所处的文化、语言和历史实践传统所决定。理解是在视界不断融合与交互的过程中产生的，或者说，理解的过程就是视界融合的过程。理解一经产生，被理解物的视界便进入了理解者的视界之中，从而生成新的视界。理解最终是获得以视界融合为标志的新视界，这体现了理解变动不居的动态特征，在视界与视界间的碰撞中，理解的前见中的一些东西被扬弃，同时又加进了新的东西。也就是说，视界的开放性和不封闭性使得人类理解不断运动着，体现出一种可变化性。


    第三，诠释学的首要特征是突出、深化了理解的整体性原则。在诠释学的视域中，任何被理解的对象（包括观念体系）都是一个有机的整体，各个部分之间都相互联系着，对部分的理解要求建立在对整体的理解之上。也就是说，理解任何一个单一的思想和原则，都必须关注思想所栖居的整体历史背景，在理解部分的同时要将思想整体予以深化和具体化，另外，对思想整体的理解离不开对各个单一思想的理解，如此便在整体与部分层面实现了理解的循环运动。同样的，人类认知活动的展开也需要一个包含着具体情境的解释框架，从而推动我们对于客体和对象的认知把握，客体本身的意义不是固定不变的，而是随着主体的诠释和理解具有了某种相对性。也就是说，人类认知在某种程度上也处于一种循环之中。


    第四，认知科学作为精神科学与自然科学的交叉和结合的产物，在我们看来，它的本质既非解释的，亦非理解的，而是类似于光的波粒二象性特征：既可以部分地利用解释的方法进行描述，也可以部分地利用理解的方法进行描述。也就是说，既能以确定的符号结构或概念体系来解释或描述对象（在某种程度上，科学的解释要求排斥个体主观意义上的自我理解，而认知科学中的相关哲学问题却需要相关实证经验的支撑），又能以某种开放性、创造性的方式理解对象。因此，与科学解释发现真理不同，理解过程本质上是生成性的。前者表现为一种符合式的认知观，具有确定的、普遍的评判标准，只有符合对象的解释和描述才是合理的、正确的，甚至可称为真理。相较而言，由于理解自身难以规避的主观因素，因而它所生成的东西具有很大的流动性，不可避免地会被烙上相对性以及不确定性的印记。


    概言之，我们想表明的是，诠释学与存在论不是相互割裂的两个领域，相反，二者是相互融合、彼此互通的关系，基于诠释学对人类认知的描述不是存在论认知不合理的凭空跳跃，而是我们基于前述四个原因作出的有效推断。正如我们下文所指出的，诠释学能够为在不确定的、不依据方法规则之情境中的认知现象提供一种合理的解释，区别于具有固定形式并且结构性较强的认知现象，比如计算。如何应对非形式、不确定的、模糊的认知活动，这是诠释学能够给予认知研究的有效启示。


    ## 第二节 计算究竟是一种解释还是理解


    作为认知科学中流行的解释模式，计算主义追求一种对认知、心智、生命乃至宇宙的确定性描述以及抽象化理解，目的就是要把具有模糊特征的表象世界以符号化、逻辑化的方式加以固定。一直以来，计算带给我们的是不可思议的强大预测力，甚至使得人们笃定了计算主义可以成为一种世界观的想法，例如天文学家能够根据开普勒定律和牛顿的万有引力定律准确计算出小行星的运行周期和轨迹。[^(\[10\])](#chapter006.html#m10)理论的威力在于预见，计算主义取得的巨大成功给予了人们圆满解决认知难题的希望与勇气，它不仅将计算作为研究人类认知的主要手段，还将其当作目的，甚至在哲学层面将人类认知和心智的本质视为基于规则的符号计算。在我们看来，认知计算主义的解释链条在面对关于人类理解的问题时出现了某种“断裂”，也就是有没有可能用严格客观的计算术语来说明人的理解的不确定性和相对性。[^(\[11\])](#chapter006.html#m11)加拉格尔认为，在这一问题上诠释学能够给予认知科学一些支持，计算与理解之间的裂痕能够弥合。


    ### 一 计算作为一种人类理解方式的可能性


    人的理解不是计算，但计算可以作为人类理解的一种形式吗？在尝试回答这一问题之前，我们需要对“计算”这一重要概念进行界定。计算是什么？这个问题对很多人来说可能是一个微不足道的问题，但是在心灵哲学、认知科学甚至物理学中，这一点远未达成共识。缺乏共识产生了一些有争议的主张，比如说认知甚至宇宙都是计算的。不过有些人认为，计算是一种主观现象：一个物理系统是否是计算性的，以及如果是的话，它进行的是何种计算，完全是观察者选择怎样看待它的问题。按照塞尔的理解，世界上只有一个系统可以进行计算，其他系统只有相对于这个系统才可以说是不是在进行计算。[^(\[12\])](#chapter006.html#m12)某一过程能否称为计算，其评判尺度在于人，是相对于人而言的，也就是说，人可以将任一足够复杂的过程视为计算。对于任何足够复杂的物理对象O（即具有足够多的可区分的部分）以及对于任意的程序规范P，存在从O的物理状态的某一子集S向P的形式结构的同构映射。[^(\[13\])](#chapter006.html#m13)在我们看来，他的这一主张强调的是计算的呈现形式，计算从形式上看是从一种符号状态向另一种符号状态的映射，并且这种映射需要因果地实现。然而，这样的实现过程是否伴随或携带着语义与信息，则是人们围绕计算产生的又一个争论与分歧点，计算也因此被视为有意义的信息处理过程。但无论是信息式的还是语义式的计算观念，都基于一种人类中心主义立场，因为信息、语义等都是关于人并由人赋予对象的东西。最为极端的看法是，没有人，便没有信息与语义，因而没有人就没有计算。另外一种观点认为计算是纯粹的句法操作，塞尔著名的“中文屋”思想实验就是以此为基础的，他论证了计算是依循句法规则的，心智则能理解意义，并且能够给意义赋予这些符号，计算的运作过程以一种纯粹的句法学的方式得到界定。[^(\[14\])](#chapter006.html#m14)在这里，我们将计算概念定义为在明确界定的有限范围内，受到规则支配的信息处理过程，也可指计算模型或计算机的计算过程。


    加拉格尔认为，计算方式适用于处理没有和情境产生关联的、简单的形式活动，抑或是诸如下象棋这样的形式活动，大部分简单或复杂的形式过程都是去情境化的，都是一种理论知识，而非一种实践知识。后者需要运用想象或直觉的顿悟，去获取人类生活的不确定环境中生发出来的问题的答案，大多数情况下，我们无须以精确的方式去应对和处理生活世界中发生的事件，更无须以纯粹理性的计算程序来决定我们下一步要做什么。从这种意义上说，现实的生活世界不是依靠计算，而是依靠人自身的理解。


    在我们看来，诠释学最为突出的贡献之一就在于对解释和理解的区分。亚里士多德指出“口语是心智的符号，而文字是口语的符号”，这表明他的诠释学思想混淆了理解和解释，[^(\[15\])](#chapter006.html#m15)直接将二者视为同一的概念。施莱尔马赫在语言和心理层面对理解和解释进行了区分，他认为解释总是需要语言作为载体，理解既能够以语言表达，亦能在心理层面表达和体验，因此两者的实现方式有所不同。相较而言，狄尔泰区分得更为严格，他将理解与解释截然对立起来，使之分属于精神科学与自然科学各自的方法论领域，因而精神科学与自然科学之间呈现出对立局面。如果依照狄尔泰的观点，认知科学本身具有的交叉学科性质意味着其内部会产生理解与解释的分疏，那么，认知科学领域中大行其道的计算究竟是人的理解方式还是客观的解释方式，我们认为有必要予以讨论。[^(\[16\])](#chapter006.html#m16)


    一方面，计算是否可以作为人类理解的一种方式而存在？也就是说，人类理解是否能够通过计算的符号操作方式呈现？英国数学物理学家彭罗斯认为人类智能的确体现了一种计算力，但是除了计算力之外，人类智能更多地体现为某种理解力。[^(\[17\])](#chapter006.html#m17)也许在他看来，计算力具有一种能够依循的客观而精确的尺度，形式化计算难以说明和描述认知与意识活动的主观性特质，其根源可能依然是老生常谈的主—客鸿沟。依据逻辑规则进行确定性描述的计算如何能够准确地刻画主体内部晦暗的、充斥着不确定性的理解活动？表面看来，人的理解活动与计算相去甚远，但是一个普遍性的原则告诉我们：任何通过语言来表达的理论，无论是自然科学还是精神科学，它们作为知识都存在着通过语言而对语言诠释与理解的问题。[^(\[18\])](#chapter006.html#m18)只要对象被语言所染指（不管是自然语言还是人工语言），它便成为一种语言性存在，海德格尔指出语言是存在之家，维特根斯坦也将语言的界限看作世界的界限。只要关联语言，就必然会牵涉到被理解和认知的问题，反过来说，一切理解和认知都发生在语言之中，理解者与被理解之物、认知主体与认知对象只有在语言中才能产生具体的关联。


    计算模型使用的人工语言在确定其规则时是超越情境的，但依据规则的描述似乎依然能通达对象的结构要素，逻辑实证主义已然作过这样的尝试。相反，人的理解则是向情境敞开的，施莱尔马赫强调理解本身所具有的一种“设身处地”的精神，“理解的本质在于，通过移情的心理学方法创造性地还原或重建作者所要表达的东西”。[^(\[19\])](#chapter006.html#m19)此外，诠释学内在具有的开放精神使得理解本身具有一种开放性，原因在于理解活动的原初意义就是指读者与作者之间的“对话”，这一过程是以作品为中介的。“对话”意味着双方之间没有设限，并不存在一个统一的严格规则来对理解活动进行约束，也就是说，理解本身似乎是没有规范性的，理解者的主观创造性使理解呈现出多元化的趋势（莎士比亚的名言——“一千个读者眼中就会有一千个哈姆雷特”充分说明了人类理解本身具有的丰富可能性）。相比之下，计算模型在处理具有开放关系和结构的问题时却显得有些手足无措。此外，遵循线性的形式规则的计算难以应对生成的多种意义的可能性。在理解过程中，由于历史性已经被内化为普遍的原则，因此理解者无论是理解文本还是作者，总是要将其置于一个更大的历史情境当中，理解的历史性特征在很大程度上决定了人的理解是情境化的。同时，理解作为一个开放的过程，不断会有新的要素汇入，意义因而是不断涌现和生成的。

