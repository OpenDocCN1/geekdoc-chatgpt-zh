    # 第一章 对认知科学研究纲领的存在论现象学考察


    自20世纪50年代以来，认知科学领域发生了令人瞠目结舌的发展和变化。以1956年达特茅斯会议为起点，认知科学如今已走过了将近七十年的漫漫长路：从基于计算—表征的笛卡尔式第一代认知科学研究纲领，到基于大脑—身体—环境相耦合、以“4E+S”为核心的第二代认知科学，以及包括认知的自然主义和现象学进路。所有这些研究路径与纲领都各自从不同的角度解释、回答了与人类认知与心智相关的一系列重大问题，比如什么是认知，认知的预设和机制是什么，认知与意识、意向性是何关系，心智的本质是什么，心智与脑、身体是什么关系，它们之间的作用机制是什么等诸多问题，产生的研究成果不胜枚举。在这一章，笔者意图对已有的诸多认知科学研究纲领进行梳理，并从海德格尔存在论现象学的视角予以分析，重点在于解蔽这些研究进路的缺陷与不足，并以此为认知的存在论研究进路提供某些有益的借鉴。


    ## 第一节 笛卡尔式认知科学的主要哲学来源

    '
  trans: '


    作为 20 世纪最为杰出的哲学家之一，海德格尔的著作以艰深晦涩闻名于世，其创造的许多词语更是让试图理解他哲学思想的人望而却步，他对作为“此在”的人的存在模式以及世界作了精确、详细却又晦涩的分析。理解海德格尔的哲学本身就是一项颇具难度的任务，而如何将存在论以及作为延伸的诠释学同认知科学相结合，这无疑具有相当的难度。然而，难点同时也蕴含着创新的可能性，本书着力在研究内容上进行创新。


    （1）通过对国内外研究现状的分析可以看出，国内外认知科学哲学的研究领域主要集中在对正统认知科学研究纲领的批判和寻找新的替代范式方面，对海德格尔哲学思想的挖掘并不系统，只是利用了他的某些概念和观点，而且也没有考察与存在论渊源颇深的诠释学与认知科学之间的关联，这体现在相关的学位论文和研究专著比较少，对如何利用存在论描述人类认知缺乏全方位、多角度的探究上。本书将努力解决这一问题，明确提出并论证存在论与诠释学和人类认知的相关性。


    （2）国内学者从计算维度、具身维度、现象学维度等切入来研究认知哲学的相关问题，本书则从存在论的角度切入，为其提供一种新的可能的研究视角，并对认知研究同诠释学的结合作分析与展望，最终提出存在论认知这一新的认知研究概念和路径。


    诚然，本书的缺陷也较为明显，具体而言：第一，海德格尔本人著作等身，论述颇多，中文版本的《海德格尔文集》就有 30 卷之多。论著之多、涉及的内容之杂给我们的研究造成了很大的难度，要从他的诸多论述中找出能够给予认知研究以启示的内容极为不易，所以难免会有疏漏，国外学者可能也是基于这一原因，故而将目光主要集中于《存在与时间》这部富有革新精神的著作。第二，海德格尔哲学是出了名的晦涩难懂，包含不少海德格尔本人创造的生僻词，由于笔者自身学术水平和素养的制约，很难做到对其思想的精确把握与理解，甚至有可能在某些观点上存在谬误。第三，由于国内学界对这一问题的重视程度较低，英美学界在该领域的论著较为丰富，笔者因此需要阅读大量英文文献，以了解这一领域的最新成果，但由于“翻译的不准确性”因素的影响，对文献的理解和解读必然会有偏倚。这有可能导致笔者对某些观点的引用不恰当。


