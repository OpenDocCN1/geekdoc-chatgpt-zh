    \ Michael Wheeler，“Cognition in Context：Phenomenology，Situated Robotics and the\
    \ Frame-Problem，” *International Journal of Philosophical Studies* 16（2008）：332-335.\n\
    \n[\\[67\\]](#chapter005.html#w67) 情境机器人的核心在于实时地整合感知与行动，从而可以生成迅速且流畅的具身性的适应性行为，它完全规避了内部表征模型，将重心转向了引导其行动的外部环境。经此定义后的智能，其灵活性和丰富程度不是由通用的推理过程决定，而是取决于结合了神经机制、非神经的身体因素以及环境要素的具有专属目标的自适应耦合状态。\n\
