    # 结语：存在论认知


    ——存在论现象学与作为延伸的诠释学对于认知科学的意义


    本书主要致力于以下两方面的工作。


    一方面，对认知科学的主要研究路径（主要是“4E+S”的认知模型）以及哲学根源进行梳理和分析，澄清它们对于认知研究的积极意义和可能产生的消极后果，从而为我们将视线转向海德格尔的存在论现象学，甚至构建一门新的“存在论认知”进行铺垫。我们看到，旧有的认知科学研究范式，包括计算—表征主义、认知主义以及人工神经网络的符号操作，它们背后深刻的哲学基础都能够追溯至笛卡尔的二元认识论。“4E+S”认知模型内的具身认知、嵌入认知、生成认知、延展认知以及情境认知这些理论都将批判的矛头指向了这一点，其核心的主张是，旧的认知范式在考虑人的认知或智能活动时，忽略了身体和环境在其中产生的重要作用。之所以将其置于一个认知模型，在于它们都被认为拒斥或至少从各自方面重构了传统的认知主义。区别在于，不同认知理论在心智/大脑和身体/环境之间此消彼长的参与程度上有所差异，这是促使梅纳里对“4E”模型加以整合的一个原因，但同时他也承认这几种认知理论在侧重点和方法上都具有差异性。在我们看来，大体的特征是从对等性向互补性的转换，“4E”理论试图将每个“E”所代表的立场（即认知的具身、生成、嵌入以及延展立场）更好地区分开来，并找出它们之间的关联。然而，每一种立场都提供了一个充分、明确的研究框架，我们没有理由认为一个统一的模型适用于所有关于认知的科学研究，而是认为有必要采取一种多元的开放性态度。也就是说，利用明晰的“4E”框架考虑认知的科学研究时，我们要清楚其研究目的，因为不同研究的目标是相异的。例如，脑科学的方法可能更适于探究杏仁核功能的神经科学研究，而延展认知这一框架则有可能深化我们关于认知的具身性与离身性的理解。


    另一方面，认知研究转向对存在论现象学的思考是有意义的，因为海德格尔注意到了作为人类主体更深层次基础的世界性，它比胡塞尔绝对的“先验意识”与笛卡尔无身性的“我思”更为接地（grounded）。他明确指出，存在于世界之中的不是孤立、俯瞰一切的“纯粹意识”，并为自身创造一个由与己相关的存在者所构成的世界。在我们看来，将主体性设想为在世界中存在的一种事实性，海德格尔的这一独特理解有可能流畅地改变人类主体惯常的概念内容，后者是具身地嵌入被科学揭示的世界之中的。惠勒采用的正是这一思路，他将海德格尔视作认知科学的新研究范式在哲学上的亲密联盟，认为海德格尔的存在论现象学可以为他所指的嵌入—具身式认知科学提供某种哲学根基，他以和环境进行动态交互的具身和嵌入系统为框架，用更为“海德格尔式”的认知描述取代以孤立的表征系统为框架的“笛卡尔式”认知描述。一言以蔽之，就是构建新的“海德格尔式认知科学”。


    那么，认知科学家惠勒做了什么工作呢？他认为，作为一条新的认知研究路径，海德格尔式认知科学的目标在于提供构成“此在”在世存在的现象的可能解释，我们将之理解为褪去海德格尔的存在论现象学本身具有的思辨性特征，代之以因果状态和过程的描述。因为认知科学的目的在于整合各种要素，这些要素之因果性地组织、运作和交互生成了人的心智或认知现象，进而弄清潜在的因果机制。厘清人类认知需要哲学的构成性理解（constitutive
    understanding）和经验科学的可实现性理解（enabling understanding）相结合，也就是说，哲学（存在论现象学）提供概念的现象学解释（比如上手活动、被抛、情绪等“此在”在世的诸多现象），而认知科学提供的是实现这些现象的可被量化和观察的状态和过程，这也是为什么德雷福斯和惠勒将海德格尔描述的“我们对存在的领会”解释为一种“背景应对活动”。后者之于人们具有一种直接的可理解性，而这种可理解性则源于比较容易描述的因果要素和结构，惠勒认为这就是海德格尔认知科学家的工作，也就是使我们知晓如何在我们存在的世界中实现背景应对。[^(\[1\])](#chapter007.html#m1)然而，这样会使所谓的“海德格尔式认知科学”出现问题：第一，经验性的可实现解释可能只适于描述人的心理现象，遇到“此在”的存在方式便显得无能为力；第二，存在论与科学的自然主义是否相容的问题，首先便是“此在”能否被自然化的问题。


    关于第一个问题，海德格尔早已明确地区分了人作为“此在”和心理或意识主体的存在方式，拒绝对“此在”作意识或心理学意义的解释，在他看来，这绝不是正确的途径。“海德格尔式认知科学”以因果机制对心理现象的有效描述并不能确保同样的因果机制在人们在世存在这一根本的生存状况层面的等同实现，从根本上说，“此在”的存在方式不能依据因果关系得到理解，在世存在呈现出的是一种存在论的本质性关联。那么，对存在论现象学的方法和科学的自然主义方法而言，“此在”被因果机制加以实现的设想是有问题的。对“此在”的因果说明和描述在本质上意味着我们对客观实体的形而上依赖，客观实在成为描述可靠或有效的支撑性条件，然而恰恰相反，海德格尔明确指出，“此在”之在世存在既不是自然科学研究的客观存在的对象，也不能还原为某种实体现象，更不能依据自然科学来解释。“此在”的在世存在不是集合了物理属性与心理属性的客观存在，不论从本体意义，还是从存在论的意义而言，“此在”的在世存在都不是任何物理和心理属性的复杂或简单的结合。即使这种可实现性理解提供的因果机制可能有助于我们揭示人类认知的具体过程，但心理的认知过程并不完全等于“此在”在世的存在方式，正如海德格尔所指出的，认知是人们在世界中存在的一种派生而非根本的方式。


    关于第二个问题，如果可实现性理解对于“此在”而言是不可能的，也就是说，“此在”不是能够通过因果过程实现的存在者（海德格尔明确拒绝了这一可能性）。那么，我们便不能依循世界中的对象来理解人本质的存在方式，这也表明强调因果性的自然化方法并不适用于“此在”。我们要看到，海德格尔关于“此在”在世存在的基本论断为我们先验地描述了人类一开始所面对的现象结构，描述了人的这一存在方式为何能够使其理解存在。因而，就“此在”是对存在的唯一领会者而言，它不可能以这样或那样的方式还原为在世界中存在的实体。对于海德格尔来说，人的生存并不只是成为实在的，石头甚至上帝都不在他的这个术语的意义上生存，只有能够进行自我解释的存在者（也就是人本身）才能生存。[^(\[2\])](#chapter007.html#m2)如果排除掉功能主义的影响，承认“此在”不能从本体论上被还原为自然主义的概念，我们会发现，海德格尔的存在论现象学与惠勒提出的形而上学解释之间有着不可调和的矛盾点，“此在”的在世存在与自然科学的研究对象具有本质上的不同，“此在”不能被自然化。海德格尔提出的一些先验哲学概念有效地使人类经验的可能性条件摆脱了科学的影响，关于人之在世存在的现象学理解不太可能简单地归于因果性的反馈循环，对于实证认知科学的因果—机械性解释而言，“此在”仍然难以理解，甚至可以说是一个“幻象”，这可能是海德格尔式认知科学以及存在论认知面临的最大困境与挑战。


    作为海德格尔式认知科学以及存在论认知的重要组成部分与内容，海德格尔式人工智能面临着“框架问题”的诘难。与其他解决路径不同的是，它主要借鉴和利用了“被抛”这一思想资源。这一存在论概念被德雷福斯和惠勒视为可以规避表征的有效手段，尤其是惠勒，他认为动力学的涌现机制能够给予人“被抛”的细节描述。在某种意义上，我们认为他们简化了海德格尔关于“此在”“被抛”的哲学意蕴，单纯地将“被抛”当作一种情境化的操作，人“被抛入世界中”也体现出人具有的嵌入性特征。确实，以“被抛”的机制化来解决“框架问题”是一项有益的尝试，意图说明日常认知中的智能主体总是发现自身处于一个有意义的语境当中，他的一系列行为都是语境敏感的，因而无须建立或检索关于情境的亚主体层次的表征。但我们经过分析后认为，人类智能离不开表征，它是人类智能的重要体现，表征的主动性也是智能的特征之一。按照“被抛”设计的机器可能会具有机器意义上的智能，但不一定会产生类人的智能现象，而机器智能的核心目标就是在物理符号系统的硅基架构上模拟和再现人类智能。“被抛”呈现出来的是一种被动的智能，着重强调在受到外在世界的作用时产生的交互活动，不属于主动智能的范畴。


    如果从“被抛”的结果来考量，人被抛入了一个受语言裹挟的世界当中，“被抛”涉及的是“此在”的本真性生存，并不能够被某种预先设定的抽象、逻辑性的技术语言描述。在我们看来，惠勒对“被抛”作因果的、形式化的说明可能表现了自然主义对人类认知的影响，因果性构成了自然主义解释的“集-置”。技术的集-置“带有一种强迫性，将一切在场者纳入技术之中，并且使得语言成为形式化的语言，在形式化的语言中得不到真正的本质”，[^(\[3\])](#chapter007.html#m3)而自然主义的集-置利用因果概念来界定“被抛”这一“此在”的生存现象，具身—嵌入机制的解释有可能会遮蔽海德格尔意图通过“被抛”所表达的生存论意蕴。从这一角度看，“被抛的机器”似乎不太可能完整地呈现人类智能的全貌。


    我们看到，海德格尔的存在论现象学同认知科学的结合产生了两种结果，即“海德格尔式认知科学”与“存在论认知”。它们的共同点是都反对认知主义和联结主义范式内在持有的笛卡尔哲学假设，后者的困难在于如何解释人们为了适应所处的情境，在产生流畅而灵活的适应性行动时对相关性的敏感程度。正是对这一能力的解释催生了认知科学研究中的海德格尔转向，并迫使认知科学家逐渐放弃这一假设，即认知主体在基于表征纯粹事实来应对无意义的情境时，根本上是以去世界、离身的方式进行的。在这里需要明确的一点是，二者并非“A
    是 A”的同义反复，存在论认知并不等同于“海德格尔式认知科学”，其中重要的区分在于我们将诠释学包纳了进来。我们推动存在论（以及诠释学）同认知研究的结合，目的并不是构建一门具有科学规范性的认知研究纲领，在前述的内容中已经论证了这一可能后果，当人们试图这样做时，“此在”的自然化问题就立刻凸显出来了。也就是说，存在论以及诠释学的一些观点与方法虽然对认知科学的研究有所帮助，但与构建一门“海德格尔式认知科学”之间并无绝对直接的因果关联，在我们看来，这是由海德格尔的存在论现象学与认知科学之间的差异所决定的。


    现在，我们要对存在论认知与惠勒的“海德格尔式认知科学”作简要的描述和区分：一方面，惠勒的“海德格尔式认知科学”似乎作了科学上的考量，意图寻找和海德格尔哲学相呼应的思考心智的方式，他将海德格尔关于“此在”在世界中存在的论断描述为认知主体之于情境的嵌入性，描述为对不同情境或语境之间的敏感程度，人类认知与智能产生于大脑、身体和环境之间巧妙的适应性耦合之中。他对认知主体所处的情境作了空间意义上的解释，主张将认知放回大脑中，将大脑放回身体中，将身体放回世界中，而存在论认知强调情境的整体性和统一性，强调认知主体与认知情境之间浑然一体的亲缘性。另一方面，惠勒的“海德格尔式认知科学”提倡一种行动导向的表征，将表征视作行动的先行准备，将行动视作表征的必然结果。存在论认知主张表征也是人们灵活、流畅地适应情境的方式之一，只是行动相对于表征具有存在论上的优先性，表征与行动之间并不彼此取代，后者并不排斥对认知的表征说明，及时的行动反馈保证着表征的有效性，行动是认知主体在表征之上的扩展和延伸，认知是行动与表征能力的叠加耦合。


