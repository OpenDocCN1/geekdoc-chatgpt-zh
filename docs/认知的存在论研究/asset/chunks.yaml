- raw: "惠勒的目的不在于另起炉灶，独辟蹊径，而是要对正统的认知科学（Orthodox Cognitive Science）进行基于海德格尔哲学的改造，并使二者相互联结。这与我们的目的和做法不同，存在论认知是在认知研究中汲取海德格尔存在论现象学这一思想资源的产物，它以“此在”“世界”“在世存在”为核心概念，强调“此在”是具身的、有实践意蕴的、情境性的存在者，具有身体、实践以及情境三个维度；世界不止具有空间性的维度，同时是通过实践被构造起来的指引网络；“在世存在”是人（“此在”）产生认知经验的背景或场域，它离不开人的身体，我们是以“作为身体”和“拥有身体”两种方式在世界中展开着自身。存在论认知具有三个主要命题：（1）以动态的原初上手活动取代静态的静观认知，（2）以具身的情境性认知取代无身的离身性认知，（3）由表征性认知扩展和延伸为行动与表征的叠加耦合。在我们看来，存在论认知在“此在”能否自然化以及海德格尔式人工智能尝试解决“框架问题”这两个方面可能会遭到批评，前文也作了具体讨论。这一形式的认知科学，其实质是把海德格尔对“此在”的生存论分析转变为一种科学解释。同时我们也要看到，只从海德格尔的这一分析汲取思想资源是不够的，我们有必要将诠释学与认知科学结合，作为对存在论认知的有益补充。具体原因有以下三点。首先，海德格尔的诠释学关注的是“此在”的生存，诠释学是构成“此在”生存的一部分，因此它与存在论之间具有紧密的连续性；其次，诠释学自觉或不自觉地克服了笛卡尔的主体认知模式，理解活动同时也是人与世界之间关联的深化；最后，诠释学与认知科学都在寻求关于人类认知的普遍理解或解释，二者的某些问题域相互重合（比如“他心问题”），而且在处理非形式的、具有不确定性的模糊认知活动方面，诠释学具有某种优势。这是我们在书中提出的一个新的观点。“前见”是构成人类认知与理解的重要因素，后者同时离不开当下以及历史的情境关联，人的认知根基于一种行动与解释的可能性，同时，诠释学划分的前反思性的直接理解与反思性的叙事理解使我们对人类认知有了新的认识，我们有理由相信，诠释学对认知哲学的研究而言是有所助益的。\n\
    \n概言之，存在论现象学与认知科学的结合使我们看到了一种不同于以往的“海德格尔式认知科学”，惠勒基于科学主义的立场称之为具身—嵌入式认知，他自己也认为这种科学的可实现性解释同现象学的构成性解释之间不能相互还原。然而，他本人却有意或无意地违背了自己坚持的信条。严格地说，与现象学自然化的问题类似，惠勒关于海德格尔式认知科学的设想仍需要进一步商榷。相比之下，我们持较弱的立场，不主张构建类似于惠勒的“海德格尔式认知科学”，而是试图提出将海德格尔存在论现象学与认知科学进行泛化结合的存在论认知，不谋求使之成为认知研究中的一个科学范式。在我们看来，以“在世存在”这一整体性的现象学描述说明智能主体的处境，以上手活动的实践领会说明关于人的具身性知识，以“被抛”的因果机制尝试解决人工智能的“框架问题”，这些都展现出了海德格尔的存在论哲学对认知研究的影响和启示，诠释学也为我们揭示出人类认知的复杂之维，客观上阐明了认知具有的动态性与不断的自我超越性。存在论现象学需要和诠释学共同构成推动认知科学发展的新基础和新动力，这也是我们将来需要继续深入研究的方向，认知科学有可能在诠释学中寻找到新的哲学支撑。\n\
    \n* * *\n\n[\\[1\\]](#chapter007.html#w1) M.Wheeler，“Science Friction：Phenomenology，Naturalism\
    \ and Cognitive Science，” *Royal Institute of Philosophy Supplement* 72（2013）：147.\n\
    \n[\\[2\\]](#chapter007.html#w2) 〔美〕休伯特·德雷福斯：《在世：评海德格尔的〈存在与时间〉第一篇》，朱松峰译，浙江大学出版社，2018，第19页。\n\
    \n[\\[3\\]](#chapter007.html#w3) 陶锋：《人工智能语言的哲学阐释》，《南开学报》（哲学社会科学版）2020年第3期。\n\n\
    \uFEFF\n\n# 致谢\n\n曾经无数次地畅想书写《致谢》时的洒脱与轻松，以为自己会有李白斗酒诗百篇一般的顺畅与豪情，可真到落笔之时，心中却感慨万千，不知从何说起。六年的博士生涯如同白驹过隙般一闪而逝，现在还记得当初2017年金秋入学时的意气风发，博士生的光环使自己短暂地产生了“春风得意马蹄疾，一日看尽长安花”的奇妙之感，想到自己未来拿到博士学位，不免心生悸动。只是没有料到，这条路我走了六年之久。道路虽艰难曲折，但在老师亲朋的关怀之下，我还是走到了最后，没有你们的支持和帮助，我是绝对坚持不到现在的。\n\
    \n首先，我要深挚地感谢我的博导魏屹东教授。从2014年拜入导师门下，到如今已近十个春夏秋冬，导师对学术的执着追求深深地影响了我，使我暗下决心走上学术研究的道路。可以说，如果没有导师，我绝不会成为今天的自己。现在还记得，自己第一次将写好的论文交给导师时的紧张与不安，食不知味，夜不能寐，心中无数次设想着被导师批评的场景。然而，当忐忑不安的我走进导师的办公室时，看到的却是导师亲切的微笑，脑海中的臆想不仅没有出现，而且导师还热心地给予了肯定。当我拿到论文，映入眼帘的是密密麻麻的修改痕迹，甚至细微到每一个标点符号。每一次的论文写作和修改，我都获益良多，导师不止一次地叮嘱我，要时刻保持对学术前沿问题的敏锐洞察，学术研究要杜绝闭门造车，并且要走出去进行充分的交流。除此之外，导师对学术研究的严谨也令我叹服，他一直强调研究成果的独创性，切忌各种学术不端行为。正是在魏老师的严格要求下，我最终完成了博士论文的写作，从论文的选题策划到最后的定稿，无不倾注了导师大量的心血。近十年的光阴，导师渊博的学识，宽厚的为人、严谨的治学态度以及在学术上不断探索、勇攀高峰的精神都深深地感染着我，使我终于明晰了自己的人生方向。\n\
    \n同时，我想要感谢一路走来遇到的老师和朋友，感谢山西大学哲学学院的各位老师，正是他们的传道授业指引着我这个半路出家的“和尚”通向哲学殿堂的大门，特别是王航赞老师、王玉彬老师、原海成老师、陈敬坤老师、胡瑞娜老师、邢媛老师、韩宁老师、范莉老师；感谢周斌老师、吴文清老师、胡瑞娜老师在预答辩时提出细致的修改意见；感谢一起打篮球的球友伙伴，非常感谢球友们的信任，不停地为我挡拆、传球，让我每次都能在球场上宣泄出积聚已久的压力。还要感谢我的师姐杜雅君博士，在我心情低落的时候积极地开导我，让我得以迅速重整旗鼓，她总能及时地回复我的疑问，让我倍受感动。感谢同学们给予我无私的帮助，特别要感谢赵秀红老师，每次都特别耐心地帮我校对和润色英文翻译。感谢王凯兄日常组织的茶局，与建斌兄、春羊兄还有李肖兄的茶余闲谈为我平淡的读博生涯添抹了有趣的一笔。正是因为有你们相伴，我才能在并不平坦的求学之路上披荆斩棘，一路前行。\n\
    \n感谢国家社科基金重大项目“人工认知对自然认知挑战的哲学研究”（21&ZD061）、山西省“1331工程”重点学科建设计划以及山西大学“双一流”学科建设规划的资助，正因如此，本书才得以出版。最后要特别感谢社会科学文献出版社的编辑周琼老师，她对全书内容进行了认真细致的审校，感谢周琼老师的辛勤付出。\n\
    \n在山西大学将近十载，家人始终是我最有力的后盾，每当遭遇挫折，无论感到多么沮丧，回家看到爷爷慈祥的面庞，心情就会平静下来。求学二十余载，爷爷和天堂里的奶奶是我最大的精神支柱，他们是我努力前行、刻苦奋斗的力量源泉，爷爷奶奶将我从襁褓中的婴儿抚养成人，没有他们，便没有我如今的成就！感谢父母在我离家的日子里对爷爷的悉心照料，使我可以心无旁骛地专注于自己的学业。\n\
    \n谨以此书献给我挚爱的爷爷奶奶！\n\n王敬\n\n2023年12月13日\n\n\uFEFF\n\n# 参考文献\n\n**1.中文著作**\n\n［1］〔美〕埃利泽·斯腾伯格：《神经的逻辑》，高天羽译，广西师范大学出版社，2018。\n\
