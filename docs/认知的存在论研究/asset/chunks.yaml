- raw: '我们看到，海德格尔似乎是把在世当作一种必要的情境性背景，认知表征的目的不在于获取关于对象的经验知识，而是“通过认识，在一向被揭示了的世界取得一种新的存在之地位”，[^(\[76\])](#chapter003.html#m76)也就是一种新的存在之可能性。我们认为，任何表征形式都具有语境相关性这一特征，表征负载着内容，而内容的含义是根据语境加以确定的，离开语境谈论表征不能确定表征的意义。对于表征而言，语境是客观、实在的基底，表征因此是语境化的，“脱离语境的表征和认知是无根据的，也是不合理的”。[^(\[77\])](#chapter003.html#m77)正因为“此在”与其他存在者都在世界中存在，二者才可能通过表征关联起来，[^(\[78\])](#chapter003.html#m78)因而从这种意义上说，“在世存在”不仅没有取消表征，而且还是表征的语境框架，只不过在海德格尔眼里，“在世存在”不可被概念化，它也是“此在”的生存活动。同时，语境伴随着人而存在，石头是“无世界”的，动物“贫乏于世”，人则“拥有世界”并“建构世界”，表征亦是人构造世界的一种方式，甚至是他的一种存在方式。


    ### 三 “此在”的“在世存在”是否反表征


    我们认为，“此在”的“在世存在”这一生存特征与表征并非剑拔弩张的关系，“在世存在”需要且不能完全取消表征，抽离了“在世存在”的表征是不可言说的神秘之物。同样，剥离了表征的“在世存在”亦缺乏了内容，是形式的、空洞的概念。德雷福斯所谓无心的应对活动（mindless
    coping）和沉浸于手头的活动并未完全描绘关于“在世存在”的图像，熟练应对是直接通达对象本身之意义的一种方式，超然的理性只有在全神贯注的活动被打断时才会显现，这一观念也并没有涵盖人与其他实体相关联方式的所有方面。概言之，“在世存在”不是反表征的，主要原因有以下三点。


    首先，海德格尔认为，人们作为“此在”，其日常在世的主要活动是与世界内的存在者打交道，“打交道”一词形象地道出了他本人自身持有的实践立场。他相信存在论现象学要关注的不是理论认知的对象，而是人在世界内的操劳活动显现的东西，后者比前者具有存在意义上的优先性。他说道，“现象学首先问的就是这种在操劳中照面的存在者的存在……它是被使用的东西、被制造的东西”。[^(\[79\])](#chapter003.html#m79)我们需要厘清的是，存在论现象学的真正目标是存在问题，纯粹的认知不可能切中存在。认知无非就是“此在”在-世界-中-存在的一种方式，更具体地讲，它还不是在-世界-中-存在的一种首要和根本的方式，而是奠基于在-世界-中-存在的一种存在方式，它在一种非认知行为的基础上才是可能的。[^(\[80\])](#chapter003.html#m80)这里的非认知行为就是海德格尔谓之的“源始的操劳”以及德雷福斯谓之的“沉浸应对”，即用锤子敲击钉子以及扭转门把手等活动。在我们看来，这些活动固然先行于理论性的认知，但并没有过分地凸显出静观式的认知表征在切中对象时的无力感，表征仍然是必要甚至是必需的。主体—客体关系在事实上无可指摘，因为“此在”日常的非本己的存在方式决定了他是以认知表征的方式（也就是他所指的存在者状态）理解着世界中的事物。“人们恰好首先就是从世界的存在在一种认识行为面前的显现方式出发，去界定此在所处于其中的世界之存在的，就是说，人们正是根据在对于世界之认识面前显示出来的世界所具有的特定的客体属性而去界划世界的存在方式的。”[^(\[81\])](#chapter003.html#m81)非表征模型固然可以解释我们应对世界的上手活动，但这样的活动并不仅仅包括打篮球、打网球，或者是用锤子敲击钉子，人们经常会遭遇现成在手状态，因而需要关于对象的表征。上手性的操作活动产生的实践知识（know-how）和默会知识（tacit
    knowledge）无法囊括人类知识的全部范围。表征是知识呈现的前提和必要条件，完全以无表征认知排除表征认知是不可取的，表征和非表征之间需要保持一种辩证的张力。[^(\[82\])](#chapter003.html#m82)


    其次，如果我们承认“在世存在”这一根基式的先在条件，那么它就在先地预设了一个世界，意图否定、排除这个世界的实体性和存在特征是不合理的，预先设定不是像基督教的创世说一样由某种超验之先在（比如上帝）创造的具有广延的存在者。海德格尔认为世界就是“此在”之存在所在的其间，这一“其间”所指的不是一种空间性的包容。如果世界被把捉为以上所指明的“之中-在”所属的其间，那么空间性的包容状态无论如何都不能构成世界的首要特性，[^(\[83\])](#chapter003.html#m83)人是在与世界的实践交互过程中塑造、理解着自身，同时也塑造、理解着他所面对的对象世界。海德格尔主张这样的构造其本质是实践性的操用器物，“此在”借之开显出了世界，而我们要展示的是表征何以显现世界，它是我们面对和处理一系列关于认知问题的有效工具，虽然在海德格尔眼中可能并不重要。他认为“在世存在”表现的是人与世界相互依存的关系，是主体全身心地投入和专注于和世界的交互过程当中，主体与世界水乳交融、不分彼此。“此在”是完全投入世界的，它与世内存在者的源始存在关系不是外在的理论观察（认识）的关系，“此在”对世内存在者心领神会、了如指掌、没有距离，后者不是“此在”关系行为的外在对象，而就是它的一部分。[^(\[84\])](#chapter003.html#m84)这说明海德格尔意图打破人与世界之间惯常的认知模式。在我们看来，海德格尔可能是想把“此在”自身具有的抽象思维植根于对存在的理解和体验之中。根据惠勒的观点，海德格尔对“在世存在”的分析可以卓有成效地解释为一个经验性的假设，即认知不仅是大脑中的表征系统，而且是基于一个扩展的身体—脑—环境系统中复杂的因果交互。[^(\[85\])](#chapter003.html#m85)一般而言，人类心智通过身体的技能性和意向性活动与环境进行交互，并以这样的形式嵌入环境之中。这表明了主体与世界相互间熟练的、在线式的耦合，也就是能够以纯熟、自如的方式对情境作出反应，从而与他人以及所处环境实现互动而无须有意识的熟思、推理或筹划。[^(\[86\])](#chapter003.html#m86)


    在海德格尔和德雷福斯等反表征主义者看来，心理表征在解释熟练的技能活动时似乎显得多余且不必要。[^(\[87\])](#chapter003.html#m87)例如当我在开车时，我只是无须进行程序式的、有意识的表征活动，不用过多关注执行具体操作任务的身体部分（控制离合器、刹车以及油门的脚以及拨动变速杆的手），然而，我的身体虽以恰当方式熟练地掌控着汽车，但仍然需要视觉图像表征和心理表征，也就是说，在驾驶过程中我必须密切关注可能的突发状况，比如，在衡量与周围其他车辆的间距时不能只靠身体的感觉，而需要视觉表征的介入。以驾驶为例，我们认为隐匿了表征从而凸显身体技能的“无心之境”并不贯穿于全部驾驶过程，严格来讲它只出现于靠无意识的直觉反应就可充分应对的平稳状态，表征并没有消弭，只是暂时隐入了背景之中。笔者认为，人与世界最为源始的接触依然需要表征，二者交互和碰撞的结果总归是产生关于世界的一连串认知结果。不需要概念和表征且完全依赖于身体应对的交互方式固然能够给予我们一种更平滑、更契合意向体验的行动流，但概念和表征是渗透于这种涉身性的沉浸应对中的，锤子等上手工具在被人们流畅地使用之前总是已经作为表象呈现于心智之中。我们对工具的熟知奠基于工具的上手性，但只有具备了关于工具的完备知识，理解了工具的何所用，我们才能顺利地操用它。


    最后，“此在”“在世存在”的许多活动并不都是德雷福斯所谓的“非命题的、非概念的、非理性的、非语言”的“无意识活动”，[^(\[88\])](#chapter003.html#m88)因为就连“在世存在”本身都可能不是非概念式的。海德格尔指出，在世界中存在的是“此在”，而“此在”向来是我所是的那种存在者。虽然海德格尔明确反对“主体”这一说法，意图用“此在”这个看起来更加温和、中性的术语加以替换，但是我们认为这一做法仍然未能阻止具有心智的“我”对在世的介入，即使我们在以熟练的实践形式与世界相融，“我”与我的心智仍然占据一定的地位。心智对世界的表征是自由的，原因可能在于普遍存在于主体中的人类理性，概念、图像、符号等表征形式和身体性的实践应对活动一样，是我们向世界敞开并揭示世界的重要方式。可表征的世界就是我们存在并生活于其中的世界，在海德格尔看来，表征的介入可能会导致主体与世界（情境）的分离，会把笛卡尔主义的幽灵重新带回到认知的领域当中，他强烈反对这种分离态度。然而，人类认知终须回归经验并依赖经验，我们的日常经验依然具有一定的解释效力，“因而当我们在研究认知或心智本身的时候，不考虑经验就显得站不住脚了，甚至是悖谬的”。[^(\[89\])](#chapter003.html#m89)它们产生自心理表征、知觉表征等一系列表征形式，故而我们认为，表征不是像胡塞尔那样随意加括号便可置而不论的，它是人和世界相勾连的重要通路和媒介。世界固然如布鲁克斯所言，是认知系统的最好模型，但若不能通过感知、表征等恰当的方式与人相关联，人类拥有世界这一观念也就无从谈起了。我们的认知总是借助表征把握、解释着世界，将表征看作一面静态的“世界之镜”只会忽略它的丰富细节。认知主体凭借表征生成、塑造着自己所处的周围世界，即便是将刺激视网膜的物体能量模式映射成视觉场景的视觉表征也是之于对象世界的某种主观解释，例如视觉欺骗试验，该试验表明人看到的内容与其自身希望看到的内容有关，也就是和人当下的心理状态相关联。另一个典型的例子是卡尼萨三角（Kanizsa
    Triangle）：一个白色的三角形似乎盖到了作为背景的黑边三角形之上，事实上并没有什么白色三角形，它只是由零散的线条和三个有缺口的圆构成的。该图形表明视觉并不是对世界简单的反映，而是对它的一种解释。[^(\[90\])](#chapter003.html#m90)心智在表征世界的同时也在生成着一个作为差别域的世界（a
    world as a domain of distinction），它与认知系统所具身的结构无法分离。[^(\[91\])](#chapter003.html#m91)


    总之，海德格尔标识的“在世存在”不是单纯的一系列对象、事件和过程的集合，它更像是产生经验的一个背景或场域，这样的背景和场域同我们的身体结构、行为和认知是无法分离的。“此在”的“在世存在”与他对事物的表征之间不是矛盾对立的关系，相反，前者是后者的背景条件，后者要在前者设定的框架内进行。我们想要去说明或描述任何对象，都要借助于表征这一工具来获取某物的表象并生成与之相关的信念，即使我们对世界的表征模型不能产生关于这个世界的好的描述，它也总可以告诉我们些什么，至少提供了某种解释。表征体现了人的自适应能力，它使我们能够以一种有效的方式（即便不是最有效的）应对周围世界中的事物和事件。从这种意义上讲，表征是人必然具有的能力，无论主体是“拥有”一个世界还是“面对”一个世界，它都不能剥离表征。海德格尔和伽达默尔等欧洲大陆哲学家的讨论表明认知是如何依赖于“在世存在”的，这种“在世存在”与我们的身体、与我们的具身性紧密相连，不可分离，而关于人的身体、具身性同“在世存在”之间的关联，海德格尔在《存在与时间》中也着墨甚少，这引起了其他哲学家相当的疑惑，我们接下来将论述这一问题。


    ### 四 “在世存在”与身体


    众所周知，在《存在与时间》中，关于“此在”的生存论分析匪夷所思地缺失了对身体现象的讨论，[^(\[92\])](#chapter003.html#m92)对此，海德格尔只是轻描淡写地谈道：“此在在它的‘肉体性’——这里准备不讨论‘肉体性’本身包含的问题——中的空间化也是依循这些方向标明的。”[^(\[93\])](#chapter003.html#m93)对身体问题的视而不见在他关于“在世存在”的论述中也有体现，梅洛-庞蒂与新现象学因此认为，“在世存在”的一个重要缺陷在于忽略了身体的基础性意义，没有看到主体的在世是一种“切身”的状态。原因之一在于海德格尔对主体性的严格刻画在某种意义上使得“此在”丧失了身体维度，他对“此在”在世的生存论分析似乎是以超然的视角进行的一种直观分析，而我们也在前文指出，认知主体不可能脱离自身的背景和情境并对之进行理论上的观照。另一原因在于，海德格尔自始至终都标识着“此在”的在-世界-中-存在与现成之物的“处于世界之中”的存在论差别，强调“此在”不是以空间上具有广延的存在者的特征和状态伫立于世，从这一意义上讲，在-世界-中-存在似乎必然舍弃和排斥身体的切入（因为身体占据着空间），除非对身体概念予以改造，以作为身体性的“身体”取代作为躯体（具有广延）的“身体”。查尔斯·泰勒认为，我们经验或“生活”在世界上的方式本质上是一种有这种身体的主体的方式……要理解什么是“近在手边”，就必须理解什么是一个具有特定身体能力的主体。[^(\[94\])](#chapter003.html#m94)也就是说，主体的世界是依凭他的具身性加以塑造的，海德格尔在《存在与时间》中以上手状态表示人与周围事物的关系，世界通过用具器物的上手性而与我们相照面，他将注意力集中于工具本身是否称手，是否能流畅地进行应对活动，却忽略了“手”乃至整个身体的参与性。在我们看来，工具的应手性直接呈现为身体操作使用工具的某种顺畅感，而这种顺畅感是以主体的身体维度作为前提的，对于人工机器人而言则不存在如此这般的上手性，因为它缺失了人具有的身体感知形式，这是上手状态的隐含条件，只是可能被海德格尔忽略了。


    由此，我们认为身体是在世存在一个必不可少的要素，主体并非以具有心灵结构的先验主体“骄傲地”在世，进而俯瞰着视域内可成为对象的事物，如此产生的一切经验、命题和知识难以满足内格尔界定的客观性——努力不是从内在于实际的某个地方看世界，或从一种特殊的生命、意识的有利位置看世界，而是不从任何特殊的处所与特殊的生活形式出发……由此达到一种对事物如它们真实所是那样的理解。[^(\[95\])](#chapter003.html#m95)在世存在似乎就是要实现这一目标，然而这可能只是一个美好的愿景，因为主体首先表现为身体这一存在样式，我们以作为身体（being
    a body）和拥有身体（having a body）这两种方式而在世界中存在，胡塞尔准确地将其划分为身体—躯体（Leib-Körper），前者是感知的主体，后者是感知的对象。我们作为鲜活的主体觉知、经验着世界，“正是我们的物质性使我们向世界敞开并受到它的影响”。[^(\[96\])](#chapter003.html#m96)海德格尔的观点是，“此在”在世必然会对世界和世界内的存在者有所交涉和领会，但这样的交涉与领会是基于“此在”的具身性（比如人具有前后左右的方向感正是因为自身的身体构造），我们不仅积极地导向世界（凭借触觉和视觉进行探索），而且会对我们通过视觉和触觉揭示的东西有所觉知。海德格尔认为，石头无世界（worldless），植物是贫乏于世（poverty
    in world）的，人作为“此在”则拥有世界。但就实现过程而言，“无心智的”石头和植物是开放的，并与世界相交织，而身体对人类心智的包裹性使后者将自己与周围世界相隔绝，故而人类心智并没有完全融入世界之中，相反，它必须积极寻求与世界之间的关联。事实上，世界只不过是我们的经验场，我们只不过是关于世界的某种视景，[^(\[97\])](#chapter003.html#m97)而这一论断的前提就是身体，是身体而非先验自我、纯粹意识使我们得以知觉并经验着世界以及其中的东西，我们也正是因为具有身体而获取了关于世界的有限图景。一言以蔽之，人之在世就是身体的在世，身体是在世存在这一整体结构的不可分割的方面，它在一定程度上确保了我们与世界之间的勾连不会断裂，与世界的接触不会停止。


    从认知的角度来看，作为“此在”的我们是从身体的感觉能力出发面对着在世存在这一基本境况的，这可能是大多数人不能否认的一点，我与我的身体亦是一个不可分割的整体，这也是无法否认的事实。即便通过笛卡尔普遍怀疑的方法也仍然要面对心智与身体的关系问题，身体就像横亘在认知道路上的斯芬克斯[^(\[98\])](#chapter003.html#m98)，喋喋不休地向我们发问，我们无法绕过它继续前行。“此在”作为一个鲜活的存在，一个离不开任何身体感觉能力的有机体，他离不开对对象物和所处环境的主观体验，更依赖于身体的知觉和运动能力，如果缺失了这些能力，“此在”便不能够进行敲钉子、打网球等流畅的上手活动，正如汤普森所言，“没有本体感受和肌肉运动的体验，很多正常的知觉和运动行为就不可能发生”。[^(\[99\])](#chapter003.html#m99)身体作为我们拥有世界的一般方式亦限定了我们自身的认知世界，身体的构造与功能给我们的认知能力限定了范围，划定了界限，不论是从感觉系统还是神经结构实现和理解人类认知，都呈现出认知的具身性特征。虽然，海德格尔不愿意将人（“此在”）理解为精神之心智与物质之身体的现成结合，将在世存在理解为这种现成存在者在范畴性的空间中的存在。他把在世存在理解为“此在”同世界中的存在者打交道或产生关联的种种方式，是一种意向的、实践性的活动。既然是实践活动，那么我们便仍然跳不出身体的圆圈，换言之，在世存在已经预设了身体的要素在其中了，“此在”的在世就是身心操劳的在世，是其“身体”的在世。


    ## 小结


    这一章节的主要任务和目的是梳理和厘清核心概念，这是我们继续研究的基石和重要环节。但需要注意而且在前文中早已提到的是：我们要明确区分海德格尔的存在论现象学和认知与心智科学的问题域，尝试将存在论现象学与认知科学相结合并不意味着研究目标的重叠。也就是说，存在问题不属于认知科学所要予以解答的问题域，同样的，海德格尔本人对于认识论问题的关注程度也远远不及人的存在问题。当然，这并不妨碍我们将海德格尔的哲学理解作为一种新的非笛卡尔式认知科学的哲学基础，原因就在于其和笛卡尔主义哲学的本质差异。海德格尔哲学的“此在”概念在某种意义上改变了我们对于智能主体的理解，他对“在世存在”的现象学描述也揭示出人类认知是与境遇相交互的这一本质特征，然而，我们并不准备照搬、复刻关键的核心概念，而是以一种批判性的方式对其进行审慎的考察。'
  fmt: '

    我们看到，海德格尔似乎是把在世当作一种必要的情境性背景，认知表征的目的不在于获取关于对象的经验知识，而是“通过认识，在一向被揭示了的世界取得一种新的存在之地位”，[^(\[76\])](#chapter003.html#m76)也就是一种新的存在之可能性。我们认为，任何表征形式都具有语境相关性这一特征，表征负载着内容，而内容的含义是根据语境加以确定的，离开语境谈论表征不能确定表征的意义。对于表征而言，语境是客观、实在的基底，表征因此是语境化的，“脱离语境的表征和认知是无根据的，也是不合理的”。[^(\[77\])](#chapter003.html#m77)正因为“此在”与其他存在者都在世界中存在，二者才可能通过表征关联起来，[^(\[78\])](#chapter003.html#m78)因而从这种意义上说，“在世存在”不仅没有取消表征，而且还是表征的语境框架，只不过在海德格尔眼里，“在世存在”不可被概念化，它也是“此在”的生存活动。同时，语境伴随着人而存在，石头是“无世界”的，动物“贫乏于世”，人则“拥有世界”并“建构世界”，表征亦是人构造世界的一种方式，甚至是他的一种存在方式。


    ## 三 “此在”的“在世存在”是否反表征


    我们认为，“此在”的“在世存在”这一生存特征与表征并非剑拔弩张的关系，“在世存在”需要且不能完全取消表征，抽离了“在世存在”的表征是不可言说的神秘之物。同样，剥离了表征的“在世存在”亦缺乏了内容，是形式的、空洞的概念。德雷福斯所谓无心的应对活动（mindless
    coping）和沉浸于手头的活动并未完全描绘关于“在世存在”的图像，熟练应对是直接通达对象本身之意义的一种方式，超然的理性只有在全神贯注的活动被打断时才会显现，这一观念也并没有涵盖人与其他实体相关联方式的所有方面。概言之，“在世存在”不是反表征的，主要原因有以下三点。


    首先，海德格尔认为，人们作为“此在”，其日常在世的主要活动是与世界内的存在者打交道，“打交道”一词形象地道出了他本人自身持有的实践立场。他相信存在论现象学要关注的不是理论认知的对象，而是人在世界内的操劳活动显现的东西，后者比前者具有存在意义上的优先性。他说道，“现象学首先问的就是这种在操劳中照面的存在者的存在……它是被使用的东西、被制造的东西”。[^(\[79\])](#chapter003.html#m79)我们需要厘清的是，存在论现象学的真正目标是存在问题，纯粹的认知不可能切中存在。认知无非就是“此在”在-世界-中-存在的一种方式，更具体地讲，它还不是在-世界-中-存在的一种首要和根本的方式，而是奠基于在-世界-中-存在的一种存在方式，它在一种非认知行为的基础上才是可能的。[^(\[80\])](#chapter003.html#m80)这里的非认知行为就是海德格尔谓之的“源始的操劳”以及德雷福斯谓之的“沉浸应对”，即用锤子敲击钉子以及扭转门把手等活动。在我们看来，这些活动固然先行于理论性的认知，但并没有过分地凸显出静观式的认知表征在切中对象时的无力感，表征仍然是必要甚至是必需的。主体—客体关系在事实上无可指摘，因为“此在”日常的非本己的存在方式决定了他是以认知表征的方式（也就是他所指的存在者状态）理解着世界中的事物。“人们恰好首先就是从世界的存在在一种认识行为面前的显现方式出发，去界定此在所处于其中的世界之存在的，就是说，人们正是根据在对于世界之认识面前显示出来的世界所具有的特定的客体属性而去界划世界的存在方式的。”[^(\[81\])](#chapter003.html#m81)非表征模型固然可以解释我们应对世界的上手活动，但这样的活动并不仅仅包括打篮球、打网球，或者是用锤子敲击钉子，人们经常会遭遇现成在手状态，因而需要关于对象的表征。上手性的操作活动产生的实践知识（know-how）和默会知识（tacit
    knowledge）无法囊括人类知识的全部范围。表征是知识呈现的前提和必要条件，完全以无表征认知排除表征认知是不可取的，表征和非表征之间需要保持一种辩证的张力。[^(\[82\])](#chapter003.html#m82)


    其次，如果我们承认“在世存在”这一根基式的先在条件，那么它就在先地预设了一个世界，意图否定、排除这个世界的实体性和存在特征是不合理的，预先设定不是像基督教的创世说一样由某种超验之先在（比如上帝）创造的具有广延的存在者。海德格尔认为世界就是“此在”之存在所在的其间，这一“其间”所指的不是一种空间性的包容。如果世界被把捉为以上所指明的“之中-在”所属的其间，那么空间性的包容状态无论如何都不能构成世界的首要特性，[^(\[83\])](#chapter003.html#m83)人是在与世界的实践交互过程中塑造、理解着自身，同时也塑造、理解着他所面对的对象世界。海德格尔主张这样的构造其本质是实践性的操用器物，“此在”借之开显出了世界，而我们要展示的是表征何以显现世界，它是我们面对和处理一系列关于认知问题的有效工具，虽然在海德格尔眼中可能并不重要。他认为“在世存在”表现的是人与世界相互依存的关系，是主体全身心地投入和专注于和世界的交互过程当中，主体与世界水乳交融、不分彼此。“此在”是完全投入世界的，它与世内存在者的源始存在关系不是外在的理论观察（认识）的关系，“此在”对世内存在者心领神会、了如指掌、没有距离，后者不是“此在”关系行为的外在对象，而就是它的一部分。[^(\[84\])](#chapter003.html#m84)这说明海德格尔意图打破人与世界之间惯常的认知模式。在我们看来，海德格尔可能是想把“此在”自身具有的抽象思维植根于对存在的理解和体验之中。根据惠勒的观点，海德格尔对“在世存在”的分析可以卓有成效地解释为一个经验性的假设，即认知不仅是大脑中的表征系统，而且是基于一个扩展的身体—脑—环境系统中复杂的因果交互。[^(\[85\])](#chapter003.html#m85)一般而言，人类心智通过身体的技能性和意向性活动与环境进行交互，并以这样的形式嵌入环境之中。这表明了主体与世界相互间熟练的、在线式的耦合，也就是能够以纯熟、自如的方式对情境作出反应，从而与他人以及所处环境实现互动而无须有意识的熟思、推理或筹划。[^(\[86\])](#chapter003.html#m86)


    在海德格尔和德雷福斯等反表征主义者看来，心理表征在解释熟练的技能活动时似乎显得多余且不必要。[^(\[87\])](#chapter003.html#m87)例如当我在开车时，我只是无须进行程序式的、有意识的表征活动，不用过多关注执行具体操作任务的身体部分（控制离合器、刹车以及油门的脚以及拨动变速杆的手），然而，我的身体虽以恰当方式熟练地掌控着汽车，但仍然需要视觉图像表征和心理表征，也就是说，在驾驶过程中我必须密切关注可能的突发状况，比如，在衡量与周围其他车辆的间距时不能只靠身体的感觉，而需要视觉表征的介入。以驾驶为例，我们认为隐匿了表征从而凸显身体技能的“无心之境”并不贯穿于全部驾驶过程，严格来讲它只出现于靠无意识的直觉反应就可充分应对的平稳状态，表征并没有消弭，只是暂时隐入了背景之中。笔者认为，人与世界最为源始的接触依然需要表征，二者交互和碰撞的结果总归是产生关于世界的一连串认知结果。不需要概念和表征且完全依赖于身体应对的交互方式固然能够给予我们一种更平滑、更契合意向体验的行动流，但概念和表征是渗透于这种涉身性的沉浸应对中的，锤子等上手工具在被人们流畅地使用之前总是已经作为表象呈现于心智之中。我们对工具的熟知奠基于工具的上手性，但只有具备了关于工具的完备知识，理解了工具的何所用，我们才能顺利地操用它。


    最后，“此在”“在世存在”的许多活动并不都是德雷福斯所谓的“非命题的、非概念的、非理性的、非语言”的“无意识活动”，[^(\[88\])](#chapter003.html#m88)因为就连“在世存在”本身都可能不是非概念式的。海德格尔指出，在世界中存在的是“此在”，而“此在”向来是我所是的那种存在者。虽然海德格尔明确反对“主体”这一说法，意图用“此在”这个看起来更加温和、中性的术语加以替换，但是我们认为这一做法仍然未能阻止具有心智的“我”对在世的介入，即使我们在以熟练的实践形式与世界相融，“我”与我的心智仍然占据一定的地位。心智对世界的表征是自由的，原因可能在于普遍存在于主体中的人类理性，概念、图像、符号等表征形式和身体性的实践应对活动一样，是我们向世界敞开并揭示世界的重要方式。可表征的世界就是我们存在并生活于其中的世界，在海德格尔看来，表征的介入可能会导致主体与世界（情境）的分离，会把笛卡尔主义的幽灵重新带回到认知的领域当中，他强烈反对这种分离态度。然而，人类认知终须回归经验并依赖经验，我们的日常经验依然具有一定的解释效力，“因而当我们在研究认知或心智本身的时候，不考虑经验就显得站不住脚了，甚至是悖谬的”。[^(\[89\])](#chapter003.html#m89)它们产生自心理表征、知觉表征等一系列表征形式，故而我们认为，表征不是像胡塞尔那样随意加括号便可置而不论的，它是人和世界相勾连的重要通路和媒介。世界固然如布鲁克斯所言，是认知系统的最好模型，但若不能通过感知、表征等恰当的方式与人相关联，人类拥有世界这一观念也就无从谈起了。我们的认知总是借助表征把握、解释着世界，将表征看作一面静态的“世界之镜”只会忽略它的丰富细节。认知主体凭借表征生成、塑造着自己所处的周围世界，即便是将刺激视网膜的物体能量模式映射成视觉场景的视觉表征也是之于对象世界的某种主观解释，例如视觉欺骗试验，该试验表明人看到的内容与其自身希望看到的内容有关，也就是和人当下的心理状态相关联。另一个典型的例子是卡尼萨三角（Kanizsa
    Triangle）：一个白色的三角形似乎盖到了作为背景的黑边三角形之上，事实上并没有什么白色三角形，它只是由零散的线条和三个有缺口的圆构成的。该图形表明视觉并不是对世界简单的反映，而是对它的一种解释。[^(\[90\])](#chapter003.html#m90)心智在表征世界的同时也在生成着一个作为差别域的世界（a
    world as a domain of distinction），它与认知系统所具身的结构无法分离。[^(\[91\])](#chapter003.html#m91)


    总之，海德格尔标识的“在世存在”不是单纯的一系列对象、事件和过程的集合，它更像是产生经验的一个背景或场域，这样的背景和场域同我们的身体结构、行为和认知是无法分离的。“此在”的“在世存在”与他对事物的表征之间不是矛盾对立的关系，相反，前者是后者的背景条件，后者要在前者设定的框架内进行。我们想要去说明或描述任何对象，都要借助于表征这一工具来获取某物的表象并生成与之相关的信念，即使我们对世界的表征模型不能产生关于这个世界的好的描述，它也总可以告诉我们些什么，至少提供了某种解释。表征体现了人的自适应能力，它使我们能够以一种有效的方式（即便不是最有效的）应对周围世界中的事物和事件。从这种意义上讲，表征是人必然具有的能力，无论主体是“拥有”一个世界还是“面对”一个世界，它都不能剥离表征。海德格尔和伽达默尔等欧洲大陆哲学家的讨论表明认知是如何依赖于“在世存在”的，这种“在世存在”与我们的身体、与我们的具身性紧密相连，不可分离，而关于人的身体、具身性同“在世存在”之间的关联，海德格尔在《存在与时间》中也着墨甚少，这引起了其他哲学家相当的疑惑，我们接下来将论述这一问题。


    ## 四 “在世存在”与身体


    众所周知，在《存在与时间》中，关于“此在”的生存论分析匪夷所思地缺失了对身体现象的讨论，[^(\[92\])](#chapter003.html#m92)对此，海德格尔只是轻描淡写地谈道：“此在在它的‘肉体性’——这里准备不讨论‘肉体性’本身包含的问题——中的空间化也是依循这些方向标明的。”[^(\[93\])](#chapter003.html#m93)对身体问题的视而不见在他关于“在世存在”的论述中也有体现，梅洛-庞蒂与新现象学因此认为，“在世存在”的一个重要缺陷在于忽略了身体的基础性意义，没有看到主体的在世是一种“切身”的状态。原因之一在于海德格尔对主体性的严格刻画在某种意义上使得“此在”丧失了身体维度，他对“此在”在世的生存论分析似乎是以超然的视角进行的一种直观分析，而我们也在前文指出，认知主体不可能脱离自身的背景和情境并对之进行理论上的观照。另一原因在于，海德格尔自始至终都标识着“此在”的在-世界-中-存在与现成之物的“处于世界之中”的存在论差别，强调“此在”不是以空间上具有广延的存在者的特征和状态伫立于世，从这一意义上讲，在-世界-中-存在似乎必然舍弃和排斥身体的切入（因为身体占据着空间），除非对身体概念予以改造，以作为身体性的“身体”取代作为躯体（具有广延）的“身体”。查尔斯·泰勒认为，我们经验或“生活”在世界上的方式本质上是一种有这种身体的主体的方式……要理解什么是“近在手边”，就必须理解什么是一个具有特定身体能力的主体。[^(\[94\])](#chapter003.html#m94)也就是说，主体的世界是依凭他的具身性加以塑造的，海德格尔在《存在与时间》中以上手状态表示人与周围事物的关系，世界通过用具器物的上手性而与我们相照面，他将注意力集中于工具本身是否称手，是否能流畅地进行应对活动，却忽略了“手”乃至整个身体的参与性。在我们看来，工具的应手性直接呈现为身体操作使用工具的某种顺畅感，而这种顺畅感是以主体的身体维度作为前提的，对于人工机器人而言则不存在如此这般的上手性，因为它缺失了人具有的身体感知形式，这是上手状态的隐含条件，只是可能被海德格尔忽略了。


    由此，我们认为身体是在世存在一个必不可少的要素，主体并非以具有心灵结构的先验主体“骄傲地”在世，进而俯瞰着视域内可成为对象的事物，如此产生的一切经验、命题和知识难以满足内格尔界定的客观性——努力不是从内在于实际的某个地方看世界，或从一种特殊的生命、意识的有利位置看世界，而是不从任何特殊的处所与特殊的生活形式出发……由此达到一种对事物如它们真实所是那样的理解。[^(\[95\])](#chapter003.html#m95)在世存在似乎就是要实现这一目标，然而这可能只是一个美好的愿景，因为主体首先表现为身体这一存在样式，我们以作为身体（being
    a body）和拥有身体（having a body）这两种方式而在世界中存在，胡塞尔准确地将其划分为身体—躯体（Leib-Körper），前者是感知的主体，后者是感知的对象。我们作为鲜活的主体觉知、经验着世界，“正是我们的物质性使我们向世界敞开并受到它的影响”。[^(\[96\])](#chapter003.html#m96)海德格尔的观点是，“此在”在世必然会对世界和世界内的存在者有所交涉和领会，但这样的交涉与领会是基于“此在”的具身性（比如人具有前后左右的方向感正是因为自身的身体构造），我们不仅积极地导向世界（凭借触觉和视觉进行探索），而且会对我们通过视觉和触觉揭示的东西有所觉知。海德格尔认为，石头无世界（worldless），植物是贫乏于世（poverty
    in world）的，人作为“此在”则拥有世界。但就实现过程而言，“无心智的”石头和植物是开放的，并与世界相交织，而身体对人类心智的包裹性使后者将自己与周围世界相隔绝，故而人类心智并没有完全融入世界之中，相反，它必须积极寻求与世界之间的关联。事实上，世界只不过是我们的经验场，我们只不过是关于世界的某种视景，[^(\[97\])](#chapter003.html#m97)而这一论断的前提就是身体，是身体而非先验自我、纯粹意识使我们得以知觉并经验着世界以及其中的东西，我们也正是因为具有身体而获取了关于世界的有限图景。一言以蔽之，人之在世就是身体的在世，身体是在世存在这一整体结构的不可分割的方面，它在一定程度上确保了我们与世界之间的勾连不会断裂，与世界的接触不会停止。


    从认知的角度来看，作为“此在”的我们是从身体的感觉能力出发面对着在世存在这一基本境况的，这可能是大多数人不能否认的一点，我与我的身体亦是一个不可分割的整体，这也是无法否认的事实。即便通过笛卡尔普遍怀疑的方法也仍然要面对心智与身体的关系问题，身体就像横亘在认知道路上的斯芬克斯[^(\[98\])](#chapter003.html#m98)，喋喋不休地向我们发问，我们无法绕过它继续前行。“此在”作为一个鲜活的存在，一个离不开任何身体感觉能力的有机体，他离不开对对象物和所处环境的主观体验，更依赖于身体的知觉和运动能力，如果缺失了这些能力，“此在”便不能够进行敲钉子、打网球等流畅的上手活动，正如汤普森所言，“没有本体感受和肌肉运动的体验，很多正常的知觉和运动行为就不可能发生”。[^(\[99\])](#chapter003.html#m99)身体作为我们拥有世界的一般方式亦限定了我们自身的认知世界，身体的构造与功能给我们的认知能力限定了范围，划定了界限，不论是从感觉系统还是神经结构实现和理解人类认知，都呈现出认知的具身性特征。虽然，海德格尔不愿意将人（“此在”）理解为精神之心智与物质之身体的现成结合，将在世存在理解为这种现成存在者在范畴性的空间中的存在。他把在世存在理解为“此在”同世界中的存在者打交道或产生关联的种种方式，是一种意向的、实践性的活动。既然是实践活动，那么我们便仍然跳不出身体的圆圈，换言之，在世存在已经预设了身体的要素在其中了，“此在”的在世就是身心操劳的在世，是其“身体”的在世。


    ## 小结


    这一章节的主要任务和目的是梳理和厘清核心概念，这是我们继续研究的基石和重要环节。但需要注意而且在前文中早已提到的是：我们要明确区分海德格尔的存在论现象学和认知与心智科学的问题域，尝试将存在论现象学与认知科学相结合并不意味着研究目标的重叠。也就是说，存在问题不属于认知科学所要予以解答的问题域，同样的，海德格尔本人对于认识论问题的关注程度也远远不及人的存在问题。当然，这并不妨碍我们将海德格尔的哲学理解作为一种新的非笛卡尔式认知科学的哲学基础，原因就在于其和笛卡尔主义哲学的本质差异。海德格尔哲学的“此在”概念在某种意义上改变了我们对于智能主体的理解，他对“在世存在”的现象学描述也揭示出人类认知是与境遇相交互的这一本质特征，然而，我们并不准备照搬、复刻关键的核心概念，而是以一种批判性的方式对其进行审慎的考察。

    '
  trans: '


    我们看到，海德格尔似乎是把在世当作一种必要的情境性背景，认知表征的目的不在于获取关于对象的经验知识，而是“通过认识，在一向被揭示了的世界取得一种新的存在之地位”，[^(\[76\])](#chapter003.html#m76)也就是一种新的存在之可能性。我们认为，任何表征形式都具有语境相关性这一特征，表征负载着内容，而内容的含义是根据语境加以确定的，离开语境谈论表征不能确定表征的意义。对于表征而言，语境是客观、实在的基底，表征因此是语境化的，“脱离语境的表征和认知是无根据的，也是不合理的”。[^(\[77\])](#chapter003.html#m77)正因为“此在”与其他存在者都在世界中存在，二者才可能通过表征关联起来，[^(\[78\])](#chapter003.html#m78)因而从这种意义上说，“在世存在”不仅没有取消表征，而且还是表征的语境框架，只不过在海德格尔眼里，“在世存在”不可被概念化，它也是“此在”的生存活动。同时，语境伴随着人而存在，石头是“无世界”的，动物“贫乏于世”，人则“拥有世界”并“建构世界”，表征亦是人构造世界的一种方式，甚至是他的一种存在方式。


    ## 三 “此在”的“在世存在”是否反表征


    我们认为，“此在”的“在世存在”这一生存特征与表征并非剑拔弩张的关系，“在世存在”需要且不能完全取消表征，抽离了“在世存在”的表征是不可言说的神秘之物。同样，剥离了表征的“在世存在”亦缺乏了内容，是形式的、空洞的概念。德雷福斯所谓无心的应对活动（mindless
    coping）和沉浸于手头的活动并未完全描绘关于“在世存在”的图像，熟练应对是直接通达对象本身之意义的一种方式，超然的理性只有在全神贯注的活动被打断时才会显现，这一观念也并没有涵盖人与其他实体相关联方式的所有方面。概言之，“在世存在”不是反表征的，主要原因有以下三点。


    首先，海德格尔认为，人们作为“此在”，其日常在世的主要活动是与世界内的存在者打交道，“打交道”一词形象地道出了他本人自身持有的实践立场。他相信存在论现象学要关注的不是理论认知的对象，而是人在世界内的操劳活动显现的东西，后者比前者具有存在意义上的优先性。他说道，“现象学首先问的就是这种在操劳中照面的存在者的存在……它是被使用的东西、被制造的东西”。[^(\[79\])](#chapter003.html#m79)我们需要厘清的是，存在论现象学的真正目标是存在问题，纯粹的认知不可能切中存在。认知无非就是“此在”在-世界-中-存在的一种方式，更具体地讲，它还不是在-世界-中-存在的一种首要和根本的方式，而是奠基于在-世界-中-存在的一种存在方式，它在一种非认知行为的基础上才是可能的。[^(\[80\])](#chapter003.html#m80)这里的非认知行为就是海德格尔谓之的“源始的操劳”以及德雷福斯谓之的“沉浸应对”，即用锤子敲击钉子以及扭转门把手等活动。在我们看来，这些活动固然先行于理论性的认知，但并没有过分地凸显出静观式的认知表征在切中对象时的无力感，表征仍然是必要甚至是必需的。主体—客体关系在事实上无可指摘，因为“此在”日常的非本己的存在方式决定了他是以认知表征的方式（也就是他所指的存在者状态）理解着世界中的事物。“人们恰好首先就是从世界的存在在一种认识行为面前的显现方式出发，去界定此在所处于其中的世界之存在的，就是说，人们正是根据在对于世界之认识面前显示出来的世界所具有的特定的客体属性而去界划世界的存在方式的。”[^(\[81\])](#chapter003.html#m81)非表征模型固然可以解释我们应对世界的上手活动，但这样的活动并不仅仅包括打篮球、打网球，或者是用锤子敲击钉子，人们经常会遭遇现成在手状态，因而需要关于对象的表征。上手性的操作活动产生的实践知识（know-how）和默会知识（tacit
    knowledge）无法囊括人类知识的全部范围。表征是知识呈现的前提和必要条件，完全以无表征认知排除表征认知是不可取的，表征和非表征之间需要保持一种辩证的张力。[^(\[82\])](#chapter003.html#m82)


    其次，如果我们承认“在世存在”这一根基式的先在条件，那么它就在先地预设了一个世界，意图否定、排除这个世界的实体性和存在特征是不合理的，预先设定不是像基督教的创世说一样由某种超验之先在（比如上帝）创造的具有广延的存在者。海德格尔认为世界就是“此在”之存在所在的其间，这一“其间”所指的不是一种空间性的包容。如果世界被把捉为以上所指明的“之中-在”所属的其间，那么空间性的包容状态无论如何都不能构成世界的首要特性，[^(\[83\])](#chapter003.html#m83)人是在与世界的实践交互过程中塑造、理解着自身，同时也塑造、理解着他所面对的对象世界。海德格尔主张这样的构造其本质是实践性的操用器物，“此在”借之开显出了世界，而我们要展示的是表征何以显现世界，它是我们面对和处理一系列关于认知问题的有效工具，虽然在海德格尔眼中可能并不重要。他认为“在世存在”表现的是人与世界相互依存的关系，是主体全身心地投入和专注于和世界的交互过程当中，主体与世界水乳交融、不分彼此。“此在”是完全投入世界的，它与世内存在者的源始存在关系不是外在的理论观察（认识）的关系，“此在”对世内存在者心领神会、了如指掌、没有距离，后者不是“此在”关系行为的外在对象，而就是它的一部分。[^(\[84\])](#chapter003.html#m84)这说明海德格尔意图打破人与世界之间惯常的认知模式。在我们看来，海德格尔可能是想把“此在”自身具有的抽象思维植根于对存在的理解和体验之中。根据惠勒的观点，海德格尔对“在世存在”的分析可以卓有成效地解释为一个经验性的假设，即认知不仅是大脑中的表征系统，而且是基于一个扩展的身体—脑—环境系统中复杂的因果交互。[^(\[85\])](#chapter003.html#m85)一般而言，人类心智通过身体的技能性和意向性活动与环境进行交互，并以这样的形式嵌入环境之中。这表明了主体与世界相互间熟练的、在线式的耦合，也就是能够以纯熟、自如的方式对情境作出反应，从而与他人以及所处环境实现互动而无须有意识的熟思、推理或筹划。[^(\[86\])](#chapter003.html#m86)


    在海德格尔和德雷福斯等反表征主义者看来，心理表征在解释熟练的技能活动时似乎显得多余且不必要。[^(\[87\])](#chapter003.html#m87)例如当我在开车时，我只是无须进行程序式的、有意识的表征活动，不用过多关注执行具体操作任务的身体部分（控制离合器、刹车以及油门的脚以及拨动变速杆的手），然而，我的身体虽以恰当方式熟练地掌控着汽车，但仍然需要视觉图像表征和心理表征，也就是说，在驾驶过程中我必须密切关注可能的突发状况，比如，在衡量与周围其他车辆的间距时不能只靠身体的感觉，而需要视觉表征的介入。以驾驶为例，我们认为隐匿了表征从而凸显身体技能的“无心之境”并不贯穿于全部驾驶过程，严格来讲它只出现于靠无意识的直觉反应就可充分应对的平稳状态，表征并没有消弭，只是暂时隐入了背景之中。笔者认为，人与世界最为源始的接触依然需要表征，二者交互和碰撞的结果总归是产生关于世界的一连串认知结果。不需要概念和表征且完全依赖于身体应对的交互方式固然能够给予我们一种更平滑、更契合意向体验的行动流，但概念和表征是渗透于这种涉身性的沉浸应对中的，锤子等上手工具在被人们流畅地使用之前总是已经作为表象呈现于心智之中。我们对工具的熟知奠基于工具的上手性，但只有具备了关于工具的完备知识，理解了工具的何所用，我们才能顺利地操用它。


    最后，“此在”“在世存在”的许多活动并不都是德雷福斯所谓的“非命题的、非概念的、非理性的、非语言”的“无意识活动”，[^(\[88\])](#chapter003.html#m88)因为就连“在世存在”本身都可能不是非概念式的。海德格尔指出，在世界中存在的是“此在”，而“此在”向来是我所是的那种存在者。虽然海德格尔明确反对“主体”这一说法，意图用“此在”这个看起来更加温和、中性的术语加以替换，但是我们认为这一做法仍然未能阻止具有心智的“我”对在世的介入，即使我们在以熟练的实践形式与世界相融，“我”与我的心智仍然占据一定的地位。心智对世界的表征是自由的，原因可能在于普遍存在于主体中的人类理性，概念、图像、符号等表征形式和身体性的实践应对活动一样，是我们向世界敞开并揭示世界的重要方式。可表征的世界就是我们存在并生活于其中的世界，在海德格尔看来，表征的介入可能会导致主体与世界（情境）的分离，会把笛卡尔主义的幽灵重新带回到认知的领域当中，他强烈反对这种分离态度。然而，人类认知终须回归经验并依赖经验，我们的日常经验依然具有一定的解释效力，“因而当我们在研究认知或心智本身的时候，不考虑经验就显得站不住脚了，甚至是悖谬的”。[^(\[89\])](#chapter003.html#m89)它们产生自心理表征、知觉表征等一系列表征形式，故而我们认为，表征不是像胡塞尔那样随意加括号便可置而不论的，它是人和世界相勾连的重要通路和媒介。世界固然如布鲁克斯所言，是认知系统的最好模型，但若不能通过感知、表征等恰当的方式与人相关联，人类拥有世界这一观念也就无从谈起了。我们的认知总是借助表征把握、解释着世界，将表征看作一面静态的“世界之镜”只会忽略它的丰富细节。认知主体凭借表征生成、塑造着自己所处的周围世界，即便是将刺激视网膜的物体能量模式映射成视觉场景的视觉表征也是之于对象世界的某种主观解释，例如视觉欺骗试验，该试验表明人看到的内容与其自身希望看到的内容有关，也就是和人当下的心理状态相关联。另一个典型的例子是卡尼萨三角（Kanizsa
    Triangle）：一个白色的三角形似乎盖到了作为背景的黑边三角形之上，事实上并没有什么白色三角形，它只是由零散的线条和三个有缺口的圆构成的。该图形表明视觉并不是对世界简单的反映，而是对它的一种解释。[^(\[90\])](#chapter003.html#m90)心智在表征世界的同时也在生成着一个作为差别域的世界（a
    world as a domain of distinction），它与认知系统所具身的结构无法分离。[^(\[91\])](#chapter003.html#m91)


    总之，海德格尔标识的“在世存在”不是单纯的一系列对象、事件和过程的集合，它更像是产生经验的一个背景或场域，这样的背景和场域同我们的身体结构、行为和认知是无法分离的。“此在”的“在世存在”与他对事物的表征之间不是矛盾对立的关系，相反，前者是后者的背景条件，后者要在前者设定的框架内进行。我们想要去说明或描述任何对象，都要借助于表征这一工具来获取某物的表象并生成与之相关的信念，即使我们对世界的表征模型不能产生关于这个世界的好的描述，它也总可以告诉我们些什么，至少提供了某种解释。表征体现了人的自适应能力，它使我们能够以一种有效的方式（即便不是最有效的）应对周围世界中的事物和事件。从这种意义上讲，表征是人必然具有的能力，无论主体是“拥有”一个世界还是“面对”一个世界，它都不能剥离表征。海德格尔和伽达默尔等欧洲大陆哲学家的讨论表明认知是如何依赖于“在世存在”的，这种“在世存在”与我们的身体、与我们的具身性紧密相连，不可分离，而关于人的身体、具身性同“在世存在”之间的关联，海德格尔在《存在与时间》中也着墨甚少，这引起了其他哲学家相当的疑惑，我们接下来将论述这一问题。


    ## 四 “在世存在”与身体


    众所周知，在《存在与时间》中，关于“此在”的生存论分析匪夷所思地缺失了对身体现象的讨论，[^(\[92\])](#chapter003.html#m92)对此，海德格尔只是轻描淡写地谈道：“此在在它的‘肉体性’——这里准备不讨论‘肉体性’本身包含的问题——中的空间化也是依循这些方向标明的。”[^(\[93\])](#chapter003.html#m93)对身体问题的视而不见在他关于“在世存在”的论述中也有体现，梅洛-庞蒂与新现象学因此认为，“在世存在”的一个重要缺陷在于忽略了身体的基础性意义，没有看到主体的在世是一种“切身”的状态。原因之一在于海德格尔对主体性的严格刻画在某种意义上使得“此在”丧失了身体维度，他对“此在”在世的生存论分析似乎是以超然的视角进行的一种直观分析，而我们也在前文指出，认知主体不可能脱离自身的背景和情境并对之进行理论上的观照。另一原因在于，海德格尔自始至终都标识着“此在”的在-世界-中-存在与现成之物的“处于世界之中”的存在论差别，强调“此在”不是以空间上具有广延的存在者的特征和状态伫立于世，从这一意义上讲，在-世界-中-存在似乎必然舍弃和排斥身体的切入（因为身体占据着空间），除非对身体概念予以改造，以作为身体性的“身体”取代作为躯体（具有广延）的“身体”。查尔斯·泰勒认为，我们经验或“生活”在世界上的方式本质上是一种有这种身体的主体的方式……要理解什么是“近在手边”，就必须理解什么是一个具有特定身体能力的主体。[^(\[94\])](#chapter003.html#m94)也就是说，主体的世界是依凭他的具身性加以塑造的，海德格尔在《存在与时间》中以上手状态表示人与周围事物的关系，世界通过用具器物的上手性而与我们相照面，他将注意力集中于工具本身是否称手，是否能流畅地进行应对活动，却忽略了“手”乃至整个身体的参与性。在我们看来，工具的应手性直接呈现为身体操作使用工具的某种顺畅感，而这种顺畅感是以主体的身体维度作为前提的，对于人工机器人而言则不存在如此这般的上手性，因为它缺失了人具有的身体感知形式，这是上手状态的隐含条件，只是可能被海德格尔忽略了。


    由此，我们认为身体是在世存在一个必不可少的要素，主体并非以具有心灵结构的先验主体“骄傲地”在世，进而俯瞰着视域内可成为对象的事物，如此产生的一切经验、命题和知识难以满足内格尔界定的客观性——努力不是从内在于实际的某个地方看世界，或从一种特殊的生命、意识的有利位置看世界，而是不从任何特殊的处所与特殊的生活形式出发……由此达到一种对事物如它们真实所是那样的理解。[^(\[95\])](#chapter003.html#m95)在世存在似乎就是要实现这一目标，然而这可能只是一个美好的愿景，因为主体首先表现为身体这一存在样式，我们以作为身体（being
    a body）和拥有身体（having a body）这两种方式而在世界中存在，胡塞尔准确地将其划分为身体—躯体（Leib-Körper），前者是感知的主体，后者是感知的对象。我们作为鲜活的主体觉知、经验着世界，“正是我们的物质性使我们向世界敞开并受到它的影响”。[^(\[96\])](#chapter003.html#m96)海德格尔的观点是，“此在”在世必然会对世界和世界内的存在者有所交涉和领会，但这样的交涉与领会是基于“此在”的具身性（比如人具有前后左右的方向感正是因为自身的身体构造），我们不仅积极地导向世界（凭借触觉和视觉进行探索），而且会对我们通过视觉和触觉揭示的东西有所觉知。海德格尔认为，石头无世界（worldless），植物是贫乏于世（poverty
    in world）的，人作为“此在”则拥有世界。但就实现过程而言，“无心智的”石头和植物是开放的，并与世界相交织，而身体对人类心智的包裹性使后者将自己与周围世界相隔绝，故而人类心智并没有完全融入世界之中，相反，它必须积极寻求与世界之间的关联。事实上，世界只不过是我们的经验场，我们只不过是关于世界的某种视景，[^(\[97\])](#chapter003.html#m97)而这一论断的前提就是身体，是身体而非先验自我、纯粹意识使我们得以知觉并经验着世界以及其中的东西，我们也正是因为具有身体而获取了关于世界的有限图景。一言以蔽之，人之在世就是身体的在世，身体是在世存在这一整体结构的不可分割的方面，它在一定程度上确保了我们与世界之间的勾连不会断裂，与世界的接触不会停止。


    从认知的角度来看，作为“此在”的我们是从身体的感觉能力出发面对着在世存在这一基本境况的，这可能是大多数人不能否认的一点，我与我的身体亦是一个不可分割的整体，这也是无法否认的事实。即便通过笛卡尔普遍怀疑的方法也仍然要面对心智与身体的关系问题，身体就像横亘在认知道路上的斯芬克斯[^(\[98\])](#chapter003.html#m98)，喋喋不休地向我们发问，我们无法绕过它继续前行。“此在”作为一个鲜活的存在，一个离不开任何身体感觉能力的有机体，他离不开对对象物和所处环境的主观体验，更依赖于身体的知觉和运动能力，如果缺失了这些能力，“此在”便不能够进行敲钉子、打网球等流畅的上手活动，正如汤普森所言，“没有本体感受和肌肉运动的体验，很多正常的知觉和运动行为就不可能发生”。[^(\[99\])](#chapter003.html#m99)身体作为我们拥有世界的一般方式亦限定了我们自身的认知世界，身体的构造与功能给我们的认知能力限定了范围，划定了界限，不论是从感觉系统还是神经结构实现和理解人类认知，都呈现出认知的具身性特征。虽然，海德格尔不愿意将人（“此在”）理解为精神之心智与物质之身体的现成结合，将在世存在理解为这种现成存在者在范畴性的空间中的存在。他把在世存在理解为“此在”同世界中的存在者打交道或产生关联的种种方式，是一种意向的、实践性的活动。既然是实践活动，那么我们便仍然跳不出身体的圆圈，换言之，在世存在已经预设了身体的要素在其中了，“此在”的在世就是身心操劳的在世，是其“身体”的在世。


    ## 小结


    这一章节的主要任务和目的是梳理和厘清核心概念，这是我们继续研究的基石和重要环节。但需要注意而且在前文中早已提到的是：我们要明确区分海德格尔的存在论现象学和认知与心智科学的问题域，尝试将存在论现象学与认知科学相结合并不意味着研究目标的重叠。也就是说，存在问题不属于认知科学所要予以解答的问题域，同样的，海德格尔本人对于认识论问题的关注程度也远远不及人的存在问题。当然，这并不妨碍我们将海德格尔的哲学理解作为一种新的非笛卡尔式认知科学的哲学基础，原因就在于其和笛卡尔主义哲学的本质差异。海德格尔哲学的“此在”概念在某种意义上改变了我们对于智能主体的理解，他对“在世存在”的现象学描述也揭示出人类认知是与境遇相交互的这一本质特征，然而，我们并不准备照搬、复刻关键的核心概念，而是以一种批判性的方式对其进行审慎的考察。


