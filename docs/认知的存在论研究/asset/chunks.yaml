    作为认知科学的主要问题域之一，意识的“难问题”一直以来备受重视和关注，胡塞尔的描述现象学对于意识结构的先验分析为解决这一问题提供了可能，胡塞尔对于意识问题的关注源于他对绝对真理的不懈追求，源于他对使哲学成为一门“严格的科学”这一理想目标的不懈追求，源于他本人的认识论关切，即确保知识，包括科学知识，建立在坚实的基础上。[^(\[85\])](#chapter002.html#m85)所谓“严格的科学”一方面是指最具有确定性的知识起源于内在感知之中，更确切地说，起源于对意识活动的内在反思之中。[^(\[86\])](#chapter002.html#m86)通过本质还原和先验还原的一系列理性活动，将一切自然的立场和观点，包括关于世界存在的信念，一切不可靠的判断、命题、理论、常识悬搁起来不予讨论，而不是教条、独断地否定这种自然态度。因为“科学的现象学态度”不持有任何立场，不具有偏倚性，故而胡塞尔发出了“回到实事本身”的呐喊，也就是回归主体原初的意识体验结构，全部事物都是意向活动（也就是在纯粹意识中得以构造的，都是意向相关项）。从这种意义上说，胡塞尔的现象学“消除了笛卡尔的主客二分认识论的传统模式，认知关系在更原初的本质上是‘关于……的意识’的主客不分的意向形式”。[^(\[87\])](#chapter002.html#m87)所以，他的怀疑主义与笛卡尔“普遍怀疑”的方法仍有区别，在胡塞尔那里，认识论没有基础、不存在任何前提并且不依赖任何东西，而笛卡尔的怀疑活动已经暗示了主体“我”的存在（而这也是海德格尔对胡塞尔的不满意之处），因而前者进行的怀疑比后者更加彻底，作为结果的“我思”也更加明晰。


    胡塞尔由描述现象学向先验现象学的转变使他关于意识的分析得到了进一步深化，前者要求人们摆脱心理主义影响，从心理学的现象到达纯粹、一般性的本质，后者要求进一步转向对纯粹意识本身的研究。也就是说，意识活动及其对象都被统摄到纯粹意识之下，至此，胡塞尔以彻底的超越论方法完成了由二元论向一元论的转化，全部事物都在意识中被给予、被显现。新的认知科学研究纲领当然不会接受类似于纯粹意识这种形而上的超验概念，也会拒斥胡塞尔的超越立场，它们只把胡塞尔看作心智与认知表征理论的哲学先驱。德雷福斯说道，“胡塞尔终于被认为是现今对意向性感兴趣的先驱，是第一位在语言哲学和心智哲学中提出心理表征作用的一般理论的人。作为首位将心理表征的指向性（directedness）置于其哲学之核心地位的思想家，胡塞尔也开始作为现今认知心理学和人工智能的研究之父而出现”。[^(\[88\])](#chapter002.html#m88)在德雷福斯眼里，胡塞尔的哲学观念同如今的认知主义有不少相似之处，倘若胡塞尔还在世，他有可能会赞同认知主义的计算—表征观点和形式化立场。


    在我们看来，胡塞尔本人对绝对有效性和明见性的追求与如今的认知科学研究具有某些相似之处，都力求精确。“对胡塞尔来说重要的是，将自然科学的科学倾向贯彻到极致”，[^(\[89\])](#chapter002.html#m89)从而把人类认知现象的一切要素均统摄到纯粹意识的领域之内，对认知现象、活动与过程的研究转变为对纯粹意识的研究。胡塞尔将数学与逻辑学视为精确知识的典范，认知科学也旨在精确地揭示人类认知的机制与过程，前者是朝向纯粹意识这一内在、原初领域进行的先验探索，后者是对认知现象的经验探索，前者悬搁了纯粹意识之外的一切现象，后者需要考察关涉认知活动的一切影响因素，特别是外在的环境以及文化等，而这些是胡塞尔所要竭力排除的。海德格尔对胡塞尔现象学的批判正是基于这一点，人在周遭世界中的体验和存在状况才是关键，意识的建构性作用只有在反思中才具有其有效性。从这种意义上说，海德格尔的存在论现象学比胡塞尔的先验现象学更适合于为认知科学提供智力支撑，因为其回归了现实性，不是单纯“观念性的”。他强调人在世界中鲜活的周遭体验，而非经过现象学还原剩余的纯粹意识，强调人同周围切近事物的相互关联。胡塞尔是向作为先验主体的纯粹意识寻求人的认知以及外部世界的可靠性根基的，“先验还原以‘悬搁’的彻底化为前提，将‘悬搁’获取的‘无基地化了的’内部性解释为先验的主体性，由此由世界基地和世间的自身统觉所承载的纯粹意识才成为世界构造性的起源”。[^(\[90\])](#chapter002.html#m90)当胡塞尔由描述现象学转向先验（纯粹）现象学之后，包括海德格尔在内的大多数现象学运动的成员都不理解他的这一思想转变，纷纷指责他退回了康德式的先验唯心主义。在海德格尔看来，胡塞尔确定纯粹意识的优先地位，就是为了在纯粹的内在意识中确定人构造外部对象的明晰与可靠的起点。胡塞尔的先验还原要求排除对自然世界存在的全部信念上的设定和前提，要求直达纯粹意识本身，从还原的意义上说，对于现在的认知科学研究，他可能会持一种完全拒绝的态度。


    我们的观点是，胡塞尔现象学与认知科学的直接结合背离了胡塞尔本人的反自然主义立场，他反对把认知或心智过程理解为世界内的心理—物理过程。认知科学的研究领域需要以自然态度为先，而现象学研究领域的开拓需要以方法论的反思——悬搁来摆脱自然态度，两种领域的研究甚至是相反的。在他看来，如果继续把认知性体验仅看作发生于自然界的事实过程的话，就不可能理解认知的基本认识论性质……按照自然主义方式不足以反思认知行为的成就。[^(\[91\])](#chapter002.html#m91)因此，把胡塞尔的先验现象学整合进认知科学的解释框架的做法仍然有待进一步讨论和商榷。


    ## 小结


    在这一章，我们对认知科学领域中主要的研究范式和进路及其哲学来源作了较为详细的梳理和分析，传统认知科学范式主要基于计算—表征和笛卡尔之主客二分的认识论模式，它进一步汇入了计算主义的观念流之中，主张心智活动甚至世界的本质都是计算，倡导一种计算主义的认知观和世界观，大有包容万象、解释一切之势。然而，我们在分析之后认为这只是形而上的假想。一方面，由于它遵循心物二分原则造成了人类认知与世界、身体的割裂，因而难以理解人的情感、意志活动且不能正确描绘认知的形成与演化。另一方面，计算主义对情感体验、意志冲动以及审美活动而言是不充分的，甚至没有任何解释力，总之并非一切皆可计算。


    以“4E+S”认知模型为核心的研究纲领意图取代认知主义和联结主义，成为一种新的认知科学范式，虽然各个进路在批判对象方面目标一致，但是在融合为统一的理论方面面临着难题。总体来看，诸研究进路在身体、环境和认知的关系上存在着因果性和构成性的差异，比如强立场的具身认知、激进的生成认知和延展认知便是一种构成性理论，强调以大脑、身体和外在环境的交互过程取代计算—表征。然而，正如我们在前述中提到的，认知作为一种复杂的意识现象具有多重维度，表征是主体同世界进行有效勾连的不可或缺的工具，取消表征并完全以身体和行动解释人的认知活动可能会陷入还原论和行为主义的困境，因此我们认为温和的、因果性的“4E+S”模型更好一些，具有较为融贯的解释力。


    除了“4E+S”认知模型之外，认知科学与现象学的结合如今已成为一种新的趋势，强调现象学在认知科学研究中的积极作用，尤其是提倡以新的第一人称视角来破解意识的“难问题”。此外，有人还尝试从自然化途径对现象学加以改造，希望使之与经验科学产生有效的互动，但是胡塞尔现象学特殊的方法论——先验还原决定了现象学描述和一般的神经生物学描述处于完全不同的层次。前者是本质的、超验的，后者是形式的、经验的，能否修正两者间的矛盾对立可能是现象学能否自然化的关键。然而，按照扎哈维的主张，现象学自然化得以成功的可能性在于现象学心理学，而不是先验现象学，[^(\[92\])](#chapter002.html#m92)因为前者即便经受过本质还原的洗礼，也仍然具有某种自然主义态度。但是胡塞尔本人并未停留在这一思想阶段，他在后期的思考中彻底地否定了自然主义，走向了纯粹自我的先验领域，因而回溯到了康德式的先验唯心主义，这是认知科学家所不能接受的，对认知研究而言，胡塞尔先验现象学自上而下的探究方式并不适合于这一任务。因此，胡塞尔的先验现象学不能成为认知科学新的哲学基础，于是我们尝试将目光转向海德格尔的存在论现象学，看看它与当代认知科学的理论互动能否实现后者哲学基础的转换，甚至能否成为一种新的研究进路。


