  trans: '

    # 世界、背景与认知视域


    ## 一 世界与背景的哲学阐释


    根据著名哲学家休伯特·德雷福斯的阐释，海德格尔对世界具有的四种意义的区分可以划分为包纳和因缘两种类型的关联，从包纳的意义上看，无论是存在者层次抑或是存在论层次，世界都是某种对象的总体集合，作为物理对象之集合，抑或具有共同的抽象之本质特征的对象集合。胡塞尔和萨特顺延着笛卡尔，从“我”的世界开始，然后试图说明一个绝缘的主体如何能够为他人的心灵和那被共享的交互主体性的世界赋予意义。[^(\[32\])](#chapter003.html#m32)与他们不同，海德格尔认为世界是被人们共享的，这一特征向来是蕴含于世界观念之中的，世界总是先行于“我”的世界。[^(\[33\])](#chapter003.html#m33)德雷福斯将世界描述为背景概念，视为通常情况下不被我们所觉知的隐晦背景。在他看来，作为背景的世界，其结构始终是晦暗不明、无法言说清楚的，并不存在适用于任何世界的一般结构，因而也就没有关于世界的先天知识，用德雷福斯的话说就是，“我们至多能够对那些与我们一起栖留于世界之中的人们指出这一现实世界的某些突出的结构性方面”。[^(\[34\])](#chapter003.html#m34)


    我们认为，对于其本身而言，世界在人的认知过程中扮演的是一个必要的、活跃的角色，而不单单是一个潜在的外部背景。世界不是各种事物的集合，它们加在一起也仍然不是世界，依然不能揭示作为整体的世界现象，在我们看来，德雷福斯的背景概念恰恰是为了解释这一“世界现象”，也就是海德格尔所谓的世界之世界性，这一概念更加强调的是世界内的存在者，也就是由全部事物之间的相互关联而构造、交织形成的意义境遇。我们认为，“世界”与“背景”之间具有某些相似之处，也就是都和“此在”的存在相关，海德格尔从存在论的角度出发，指出世界的存在不与世界内的诸存在者相关，而认为“此在恰恰是倾听世界的”。[^(\[35\])](#chapter003.html#m35)对于世界和背景而言，两者似乎都只对“此在”显现，因为只有“此在”方能对它们进行理解。


    德雷福斯说道：“人们从来都不是直接存在于世界之中的，我们总是通过存在于某些具体的周围世界之中而存在于此世界。”[^(\[36\])](#chapter003.html#m36)背景或情境似乎是我们理解世界的先在条件，因为人们总是发现自己首先处于某一情境或背景中，并且是通过基于背景或情境的实践性的应对活动和非实践性（抑或反思性）的认知活动来理解更为宽泛的世界概念。如果将世界视为一个整体的集合，那么情境或背景则相当于它的一个子集，是对它的局部化。“此在”不直接暴露在世界之中，用海德格尔的术语来讲就是通过存在于某一情境（being-in-a-situation）而在世界中存在，在他看来，“此在”所处的情境是可以共享的，这是由它最本己的特征（在世存在）所决定的。周遭世界对于每一个“此在”而言都是不同的，都有着各自不同的感知和认知图式，但我们依然栖居于一个共同的世界之中。由此可以推断，我们的认知不是封闭的，在某种程度上我们能够对个人私密的内在心理和感受性有所理解和突破（比如维特根斯坦所谓的“私人语言”），尽管一个人的心灵状态和感受体验在本质上是私密性的，我无法感受或体验到他人牙齿的痛觉，因为如果我感受或体验到了，那就变成了我在牙疼。然而，心灵状态所依附的情境或背景是可以被人分享的，如果我分享了某人的情境，那么它不会成为“我独有的”情境，也就是说，不会像牙痛、头痛等感受性一样具有私人性的特征，而是变为“我们”的情境。世界、情境以及背景的可理解性正是基于它们可被共享的特征，我们作为“此在”进行的认知和实践活动都是对一个已经被共享的世界的一种可共享的把握。由于在世存在是“此在”最本己的特性，因而“此在”总已走出了自身，不管是在世界中，抑或是在作为子世界的情境或背景中，“此在”总已在外，故而在海德格尔眼中，“此在”不是“一个像主观的内在领域一样的东西”，[^(\[37\])](#chapter003.html#m37)“此在”的认知活动与行为也具有不被封闭的特性。


    背景作为互补的世界而持存，除去这一差别，世界与背景（情境）的另一个不同之处在于是否可以完全予以明晰化，是否清楚明白。休伯特·德雷福斯与约翰·塞尔各自都对背景作了详细的描述，通过比较二者观点之间的某些差异，我们希望可以对背景和海德格尔的“世界”概念作出一些明确的区分。我们先来看德雷福斯对背景的理解与描述。


    背景是什么？一言以蔽之，德雷福斯主张背景就是一组实践、技能和活动。关于背景是否明晰的问题，德雷福斯的答案是否定的。对于他而言，背景是人类遇到事实、话语和问题时所处的环境（如果用最模糊的术语来描述的话），不能由规则定义，是它的本质性规定。此外，背景不能单纯依靠可表征的事实和规则予以形式化的分析，它是一种可能性条件，因为对于任何有存在意义的事物而言，背景总是在场。在一般情况下，背景不仅没有被表征，而且也不能被某一认知系统转化为一连串表征，比如人、动物或人工智能，认知系统正是基于这些表征来确定适当的行动方式。然而，我们对自身行为的解释，必定依赖于我们的日常实践，而且简单地说，“这就是我们所做的”或“这就是人之为人的意义所在”。所以归根结底，全部可理解性和所有智能行为，都必须追溯到我们是什么的意义，根据这一论点，这必然会引起的倒退，是某种我们永远无法明确知晓的东西。[^(\[38\])](#chapter003.html#m38)这种不能明确可知的东西也就是所谓的背景。而且他将海德格尔对“存在的领会”解释为不清楚明白的背景，它是使我们理解和认识事物的必要条件，也就是说，我们的认知和行动不是依靠和利用清晰的规则而进行的，亦无法以清晰的规则对生活进行明智的控制。这样的规则只能在背景中发挥效用，但背景本身是模糊的，不能被预先构造为具体的原子事实或信息而在计算机中加以描述。


    德雷福斯提出背景概念是为了反对心智的认知主义模型，该模型将心智与世界的关系、心智理解自身和周围世界的能力都视为某种信息的处理过程。它将我们遭遇的世界描述为一系列毫无意义的原子要素，即世界由独立的要素所构成，这些要素以感官材料的形式冲击着我们的心智，它们本身对于主体而言没有意义，[^(\[39\])](#chapter003.html#m39)用康德的术语来表述就是杂多表象，心智的功能就在于对这些独立的要素进行表征，将其作信息化的处理，从而建构一个对主体有意义的、符合规则结构的世界。然而在德雷福斯看来，人们将事物理解为独立的现存实体的做法是不合适的，这是“独立的”这一功能谓词给我们造成的假象。没有任何东西对我们是可理解的，除非它首先作为已经被整合进我们的世界、融入我们的应对实践之中的东西而显现。[^(\[40\])](#chapter003.html#m40)事物只有在背景中触目、碍眼的情况下才会显现，才会被主体感知并成为主体心智聚焦的对象，如荀子所说“目不能两视而明，耳不能两听而聪”，人们只能处理直立于其心智前的对象，后者只有在背景中才能凸显出来，事物是在背景中表现出它的意义的，我们认知的可能性就根植于背景中。


    相比之下，塞尔是从神经生物学的立场出发阐明他的“背景”的，但德雷福斯不愿将背景还原为一种基于心理过程的神经科学描述，因此我们看到，塞尔“背景”的概念内容似乎与德雷福斯有着根本性的出入，他认为背景是能够生成意向状态的神经元结构。塞尔更乐于将背景解释为一组能力，“背景是指能够使得所有表征得以发生的一个由非表征性心理能力组成的集合”。[^(\[41\])](#chapter003.html#m41)由此看来，塞尔主张背景是心理的，他以心理内容和外在事物的关系为基础，认为背景在某种意义上是某种信念系统，即便不是，也依然是心理的东西，包括心智能力、倾向以及立场等等。正是背景能力使我们能够在恰当的时间、恰当的地点施行恰当的行动，使我们可以流畅地应付具体场景中的事件或任务，例如，当在餐厅用餐时，我们只需做好与服务员、菜单以及要吃的食物相关联的事情就足以在餐厅这一背景中应付自如。另外，在塞尔看来，对语句的字面意义的理解要求有一种前意向背景，一个语句的字面意义不是一个语境豁免（context-free）的概念，[^(\[42\])](#chapter003.html#m42)只有在给定背景的情况下才能确定某一语句的真值条件。正如他所举的例子：


    主席召开了（opened）会议


    炮兵开了（opened）火


    比尔开了（opened）一家餐馆


    三个句子中的 opened 一词都具有相同的语义内容，但这一内容正确的理解或打开方式都依赖于塞尔所谓的前意向背景，比如“炮兵开了火”这个简单句，用塞尔的话来说“就是语法上极好的语句”。[^(\[43\])](#chapter003.html#m43)我们可以很容易地理解句子的每一个成分，但对于解释和理解完整的句子，则是丝毫没有头绪的。我们知道“炮兵”“火”是什么意思，也知道“开”这一谓词，但是根据语法规则联结以后的意思我们是不清楚的，这时就需要背景的介入，它为我们理解语句提供了更多信息，背景的差异造成了对句子、语词的不同理解。可以说，如果没有背景的参与，无论是塞尔区分的“深层背景”（deep
    background）还是“局部背景”（local background），我们对语言的把握就只能停留于孤立的语义内容上。此外，塞尔将人自身的身体技能和能力也归属于背景，但另一方面他又坚持背景可能具有根本的心理属性，坚称背景是由心理现象所构成的。人的周遭世界堆砌着自然对象和人工制品，我们就作为生物性和社会性存在物生活于其中，而塞尔拒绝将存在物之间的诸多联系纳入背景的范畴，而是将之心理化，我们似乎是通过背景与世界相互作用的。背景不是一个事物的集合，也不是我们自己和事物之间的神秘莫测的关系构成的集合，[^(\[44\])](#chapter003.html#m44)总之，塞尔描述的背景不是一种实在，而是为人们实现意向状态提供满足条件的东西，本身无法被意向地表征，背景就像一个黑洞，我们可以猜想其中有什么，但却看不到这些东西的存在，塞尔的比喻则更为形象：正如我们可以看到眼前的任何东西，却唯独看不到自己的眼球一样。


    通过比较德雷福斯与塞尔对“背景”的不同描述，我们发现背景具有以下几个特征：①背景是模糊的，不足以被清晰地予以表征；②背景本身不是一种实在，它是“我们的实在表象的特征，不是表象的实在特征”；[^(\[45\])](#chapter003.html#m45)③背景是人的理解和认知活动的起动条件，是必不可少的、必要的。我们在这里要表明的立场是，背景或许是由实践、技能和习惯等要素构成的集合，但它在很大程度上不是心理的，因为若像塞尔一样将背景视作心理性的存在物，对之作出心理主义的解释，那么背景就必然会被打上主观主义的烙印，任何个人都可以依据自己的心理内容和观念塑造自己的背景，因而背景有可能失掉原本的客观意义与特征。在我们看来，背景虽然是属于“我”的，但它同时也是客观的，技能、实践和习惯等背景中包含的要素似乎是主体的东西，我们在行动时往往不会予以过多关注，它们在背景中固定下来成为人们无意识地加以运用的东西。比如，初学者在学习驾驶机动车时教练会发出一系列指令：“膝盖稍稍弯曲”“前脚掌踩离合器”“轻打方向盘”等。其中，每一项指令都基于明确的表征和规则，使得初学者能够有效地习得驾驶技能。然而，初学者在经过一段时间的练习和实践后会愈发熟练，不再单纯且僵硬地依靠对规则的表征而进行操作了，他就是在驾驶而已。塞尔认为，在这种情况下。规则不是被内化，而是被剥离了，就像儿童在蹒跚学步时使用的学步车一样，当孩子学会走路之后便不再使用这一辅助工具了。但在我们看来，规则并非变得完全不相关，而是内化于背景中了，或者从某种意义上说，这些规则本身就是背景，熟练的司机是以一种完全不同的方式在驾驶，他和新手之间的区别就在于是否能够流畅、无意识地遵循规则。我们的确是按照规则行事的，只不过历经无数次的实践后规则被“遗忘”了，成为身体的一种下意识的本能反应。


    海德格尔的存在论现象学指出，最切近“此在”的不是自然环境，而是周遭世界，是人们日常的实践世界，自然环境只有在与“此在”有所关联后才能进入“周围世界”这一范畴，海德格尔往往在该意义上使用“世界”这一概念。他认为，“此在”与世内存在者的相遇方式不在于知觉认识和静观的反思，而在于日常生活中与其打交道的上手活动，而这种最切近的打交道活动不是觉知，而是与事物产生实践关联，也就是“此在”沉浸地操作用具的“操劳”活动（海德格尔将所有我们在操劳活动中遭遇到的东西称为用具）。从某种意义上讲，正是“此在”上手的操劳活动构成了他的周围世界，后者在用具整体的指引下与我们照面。操劳的结果不是一个单纯的东西，··它包含着整个由实践目的勾连在一起的用具关联系统。[^(\[46\])](#chapter003.html#m46)用具和利用用具制造的东西都有着可用性，都能通达其他用具，我们似乎正是在这种用具的整体关联中看到了世界现象，也正是在操劳活动中我们与所处的世界相遇，世界就像是无数个用具的相关系统构成的整体联结，我们对用具的理解总是先行于对世界的理解，通过用具之间的相属关系逐步揭示出一个更大的整体世界，虽然事物是以整体向我们呈现的，而不是像胡塞尔所谓的感觉经验之综合，但世界是在事物（用具与质料）自身具有的指向中被我们发现的，而背景本身则具有一种整体主义的设定。此外，背景本身是模糊的，不大可能被我们所表征，但切近于我们的世界却不是这样的，它是前理论的、实践性的。在世存在先要越过操劳活动中上手的东西才能推进到对仅现成在手的东西的分析，[^(\[47\])](#chapter003.html#m47)也就是说，理论认知活动是以“此在”在操劳中与上手事物打交道的活动为基础的，上手性的操劳被妨碍或者阻断将世界展现在了心智的面前。这表明，世界具有被心智表征的可能性，能够成为我们的意向对象，相较而言，背景是使得意向状态成为可能的东西，没有背景就没有意向状态。它不在意向性的外围，而是渗透于意向状态的整个网络，没有背景，这些状态就不可能发挥作用。[^(\[48\])](#chapter003.html#m48)故而背景不具有被心智表征的可能性，这是世界与背景之间具有的两个显著区别。


    ## 二 “世界”与认知视域下的环境


    由于认知科学领域中的颅内主义、积极外在主义等理论对于环境有着不同的论述，不能一概而论，所以，我们要对诸理论所提及的环境概念进行详细的区分。首先，由于颅内主义将作为认知器官的大脑看作全部的认知系统，因此，大脑之外的包括身体都可纳入环境的范畴，我们称之为“环境
    1”。然而，这里存在严重的问题：大脑作为人类认知的生物学基础，并不等同于认知主体的概念内容，从某种程度上讲，颅内主义的错误在于它把认知意义上的环境和认知目标、认知主体和大脑混淆了。其次，为了克服颅内主义的缺陷，具身认知理论强调了人之身体的主体性，更加注重身体体验（experience），因此，具身认知意义上的认知系统是包括身体在内的人（大脑+身体），身体之外的其他客观存在属于环境的范畴，我们称之为“环境
    2”。虽然具身认知突破了颅内主义的桎梏，但它仍未对认知环境与认知目标进行区分，对颅内主义自身缺陷的克服并不彻底。再次，延展认知主义在具身认知的基础上进行了一次大胆的突破和尝试，将人在进行推理、决策等高阶认知活动时所使用的工具（如语言、纸笔甚至计算机）纳入了认知系统当中，更加强调认知主体可能的离散特征。从某种意义上来说，延展认知主义是具身认知的强化和激进版本。因此，它所指涉的环境是人和所使用工具之外的境遇，我们称之为“环境
    3”。认知系统在前述的基础上又囊括了工具，形成了大脑—身体—工具的结构，但环境和认知的对象和目标之间的关系依然是模糊的，后者仍然没有从前者中分离出来。我们认为，根本原因在于主客二分这一认知方面的固有惯例。它是有缺陷的，表现在我们的认知活动中就是主体与客体的彼此对立，认知的对象和目标因为异于主体并在主体之外，被划入客体的范畴。最后，我们从认知系统观的立场出发，在延展认知的基础上更进一步，主张把认知的对象和目标纳入认知系统中，因此，我们理解的认知系统就成为人、工具还有认知的对象以及目标所构成的有机整体（大脑+身体+工具+目标），除它之外的则成为环境的内容，我们称之为“环境
    4”。不论是实证研究还是日常生活，我们都能强烈地感觉到环境对我们认知活动的影响和作用，关键在于合乎逻辑地说明环境是如何参与到我们的认知过程中的。


    要看到的是，海德格尔的“世界”概念和认知科学所重视的“环境”之间存在相当的差别，后者具有的一个特征是空间意义上的广延性，环境就像是一个巨大的容器，人的心智都存在于这个“容器”之内。这是人们早已熟知的观念，而且这种观念也通过物理学等自然科学的发展而得到了强化，海德格尔将之看作一种现成的理解方式，是基于日常经验的一般性描述。对于他而言，作为事物存在的方式，“世界”的物理空间意义显得不再那么重要，相反，与人们初始照面的是近在手边的上手之物，也就是器具。物理距离的远近和长短淡出了海德格尔考虑的范围，器具与我们的生存活动具有一种亲缘关系，是一种“海内存知己，天涯若比邻”的存在意义上的切近。“世界”是通过上手器具的相关性而逐渐展开的，在我们看来，海德格尔谈及的“世界”总是一个切己的概念，总已向我们先行展开了一种实践意蕴。也就是说，世界总是上手的，贴近于“此在”的生存活动，具有“上手状态”这一特征，世界不能被远化为与“此在”的生存活动无关的、单纯的认识对象。[^(\[49\])](#chapter003.html#m49)“此在”之所以区别于石头、植物、动物而拥有世界，原因就在于他是通过自己的栖居构造周遭世界的，世界对于“此在”而言是一种被表象的有用之物，是他“在-世界-中-存在”的一个环节。世界不是在人静观的理论态度之下的对象物，而是通过人自身的活动组织而成的，因为认知与实践的分殊而具有了内在的心智世界和外在的周围世界两个维度。对于海德格尔而言，世界本身不是一个存在者，而是从实践交互的角度被构造起来的指引网络，由于通常处于不触目的状态，故而不能为人们清晰地巡视和关切。

