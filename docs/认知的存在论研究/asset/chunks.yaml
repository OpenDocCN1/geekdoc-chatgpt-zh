    \n[\\[74\\]](#chapter005.html#w74) 谢地坤主编《西方哲学史（学术版）》第7卷上册，江苏人民出版社，2011，第207页。\n\
    \n[\\[75\\]](#chapter005.html#w75) 夏永红：《人工智能的创造性与自主性——论德雷福斯对新派人工智能的批判》，《哲学动态》2020年第9期。\n\
    \n[\\[76\\]](#chapter005.html#w76) 诚然，如德雷福斯所言，存在某些无表征的人类智能形式，但这不足以表明无表征是人类智能的本质属性和特征，而且表征本身具有多种形式，诸如知识表征、视觉表征和心理表征等，完全的无表征描述本身反而是不完备的。即便是像舒马赫这样的冠军级别的赛车手，我们很难想象他在驾驶过程中不会触及任何形式的表征，只依靠纯粹的身体行动和对当下情境的自发反应就可以完成并赢得比赛。\n\
    \n[\\[77\\]](#chapter005.html#w77) 孟伟、刘晓力：《认知科学哲学基础的转换——从笛卡尔到海德格尔》，《科学技术与辩证法》2008年第6期。\n\
    \n[\\[78\\]](#chapter005.html#w78) 王波：《后人类纪的现象学与认知科学：对心智的重新思考——访肖恩·加拉格尔教授》，《哲学动态》2020年第12期。\n\
    \n\uFEFF\n\n# 第五章 存在论认知的拓展：诠释学与认知研究的融合\n\n在前述的内容中，笔者从海德格尔的存在论视角审视了当前主要的认知科学研究进路，具体探讨了存在论关涉认知的主要核心概念和论题，并剖析了存在论现象学与认知科学具体结合过程中可能产生的两个理论困难。笔者由此产生了一个疑问，即目前对存在论与认知科学相结合的考虑是否全面？存在论作为切入认知研究的一条新的路径与视角，为我们审视和考察人类认知活动进行了有益的尝试。然而，正如我们在前面谈到的，存在论作为认知科学的单独“智库”是不够的，二者相结合所产生的存在论认知也需要新“资源”的填充和注入，而诠释学与存在论的特殊关联，使得我们看到了存在论认知向诠释学拓展的可能性。我们相信，认知科学（包括人工智能）可以从诠释学这里得到有益的启示，二者之间存在着合理的通路。\n\
    \n## 第一节 存在论认知为何要向诠释学拓展"
