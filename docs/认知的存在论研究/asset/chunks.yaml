    ### 首先

    关于“此在”概念，我们主要从身体维度将之与认知科学哲学语境下的认知主体作了区分，第二代认知科学的诸多研究进路都表达了这一核心观念：认知的许多特征是具身的，是因为认知深深地依赖于主体的身体特征，身体是认知的限制者、认知过程的分配者以及认知活动的调节者。[^(\[100\])](#chapter003.html#m100)身体的重要性得到空前的提升，身体甚至成了认知的主要组分，但海德格尔对“此在”的论述似乎刻意缺失了对身体现象的关涉，而且在“此在”是否表现出“主体性”的问题上，海德格尔的描述也较为晦暗。当然在笔者看来，“此在”具有其身体维度、实践维度以及情境维度，它是具身的、有实践意蕴的、情境性的存在者，由于认知是“此在”在世的一种样式，故而认知主体也作为“此在”的一种样式而得以呈现。


    ### 其次

    在澄清“世界”这一概念时，我们将其与背景/情境作了较为详细的分析。海德格尔区分了“世界”具有的四种意义，他要求从根本上将世界把握为非客体、非对象性的存在，并将以往人们认为世界固有的范畴意义的空间性予以排除，其意在于颠覆人与世界之间反思性的认知关系，不从一种外在、形式的意义上理解和描述世界，而就像德雷福斯所言，世界是人们浸没其中，时时刻刻受之渲染和影响的背景。也就是说，世界不仅是“此在”展开认知活动的寓所以及加以认识的东西，而且使得认知得以可能。


    ### 最后

    “在世存在”作为海德格尔对认知科学最具影响力的创见，其重要性自然不言而喻，但这一概念仍然有为人诟病之处。海德格尔将身体排除在外，但同时他又反对“此在”以笛卡尔式的心智实体和胡塞尔式的“纯粹意识”“先验主体”等这些形式“在世”，这样似乎与我们的日常经验相矛盾。梅洛-庞蒂正是因为看到了这一点才提出了自己的“朝向世界存在”概念，他重新把身体接纳进来并将其作为这一概念的重心，世界是经过人的感知知觉过滤后的世界，在世界中存在的是人的鲜活身体而非别的什么东西，身体的活动构成了人在世界中的在场。我们赞同梅洛-庞蒂恢复身体与世界的前反思性连接这一做法，两者之于“在世存在”的立场差异都表明人类存在具有本质的情境性特征，而且对主体“在世”的承诺并未取消表征存在的合理性，前者不是反表征的。此外，身体亦是人之“在世存在”的必不可少的要素，因为我们是以作为身体和拥有身体这两种方式在世界中生存和展开自身的，它确保了我们与世界之间的勾连和接触。


