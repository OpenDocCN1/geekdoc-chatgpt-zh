- raw: '由于《存在与时间》论述身体的文字仅有寥寥数语，人们都质疑海德格尔关于“此在”之存在方式的研究是否遗漏掉了身体维度。有的学者直接将“此在”形容为“离身的”（disembodied），认为海德格尔对“此在”的描述比他所能承认的更接近于无身体的先验主体，那种康德从笛卡尔那里继承来的无身体的先验主体。[^(\[8\])](#chapter003.html#m8)德雷福斯也认为，“海德格尔似乎在暗示拥有一个身体并不属于此在的本质结构”，“此在并不必然是具身化的”，“身体不是根本”。[^(\[9\])](#chapter003.html#m9)我们的观点是，海德格尔略过关于身体问题的研究是有意为之，海德格尔真正在意的不是“此在”有无身体，而是具身性能否和“此在”存在的本质方式相牵涉。他以“此在”这样一个中性的概念代替人的概念，某种意义上表明身体不是他讨论的重心，因为身体总是某个“我”的身体，是被“我”主观化从而具有主体性特征的身体，这明显有笛卡尔主义的影子。然而，海德格尔自始至终都在试图超越笛卡尔的二元区分，因此他没有在一般意义上谈论身体，而认为是现身情态和情绪将人的身体遮蔽了，身体在其最原初的意义上是一种非本质的现象。在20世纪60年代举办的“泽利康讲座”中，海德格尔提出了全新的身体观念，他反对把身体视为一种可分解、可还原的结构，这样会导致人们滑向“人是机器”的极端立场。海德格尔警示我们，“身体这一现象是完全独特的，它不能还原为其他任何东西，比如，不能还原为机械式的系统”。[^(\[10\])](#chapter003.html#m10)“此在”是能够揭示存在意义的存在者，它不是一种现成意义上的存在者，只有在自己的生存中它方能显现自身，海德格尔认为，“此在”不能将自身理解为现成性，作为“此在”不可分割的部分，自然也不能只关注身体的生物学意义。他说道，“如果人们意图以一种恰当的方式理解身体，那么，人类的身体存在从根本上绝对不能被仅仅看作现成在手的存在物”。[^(\[11\])](#chapter003.html#m11)如果强调身体的事实性和实在性，很容易把身体也视为非“此在”的存在者，这可能也是海德格尔区分“身体”和“躯体”，并要求注意区分身体之界限和躯体之界限的原因。在他看来，躯体以皮肤为界，身体则是无界限的，二者属于不同的维度，前者居于存在者的层次，后者要从“此在”的存在论分析中予以阐明。我们举一个例子：当我用手指指向远处耸立的高塔时，指尖是我的躯体边界，但我的身体却不限于此，也就是说，高塔被纳入我的存在视域之中，与我发生了生存意义上的关联。身体不是一个内嵌于世界中的实在，相反，它为人们与世界中存在的实体相照面设定了可能性条件，也就是说，身体的界限是动态的，处于不断的变化之中。[^(\[12\])](#chapter003.html#m12)从某种意义上说，海德格尔以他特有的方式解构了作为科学和生物学概念的身体。


    总而言之，在对待身体的问题上，“此在”与认知主体存在较大差异，认知科学范式转换的一个本质特征就是对身体的日益重视，从忽略身体作用的认知主义与联结主义的无身认知到将身体纳入认知过程核心的具身认知。身体的地位与重要性不断得到提升，在某些理论的强立场中，身体甚至成了认知的主体，自我意识就是身体体验，心智内容与认知内容取决于身体结构，不同的身体结构可能会产生不同的思维方式。相比之下，海德格尔的身体观念要更加深刻和新颖，为我们理解身体提供了全新的视角，我们认为，在具身认知等理论的视域中，认知主体的身体处于海德格尔所描述的“躯体维度”。基于身体结构对人的认知功能和过程进行考察，这种方式可能会使我们对认知的研究变得更加精确，但可能会把身体当作一种可以量化的物来对待。在我们看来，延展认知对身体界限的突破之所以引发如此多的争论，一个可能的原因就在于它仍然是在生物学的意义上使用身体概念，意欲以一种和技术工具耦合纠缠的方式穿透身体和世界之间的绝对限制，然而，这种强行的突破违背了我们关于身体的一般常识。从存在论的角度将身体视为“此在”本质的存在方式，使身体成为动态的存在，依照海德格尔的术语描述就是“身体化”，身体的界限就是“此在”的存在视域的界限，从这种意义上看，倒是有可能为延展认知提供某种可行性论证。从以上分析我们可以看到，海德格尔声称的“此在”并未抛弃和轻视身体，不能认为《存在与时间》中关于身体的阐述只有寥寥数语就认为他觉得身体问题无关紧要，更不能认为“此在”是无身或者离身的，“此在”当然是具身的，需要身体的支撑。只不过在海德格尔眼中，身体已然隐入了“此在”的生存之中，隐入了“此在”的上手活动，隐入了“此在”对世内存在者的实践因缘之中。“此在”并不是像使用工具一样利用身体，正如他所言，“并非我们‘拥有’一个肉身，而是我们就‘是’肉身存在”。[^(\[13\])](#chapter003.html#m13)


    ### 二 “此在”的“实践”维度


    作为一个自在自为的实体，“此在”与自存的物体比如桌子、石头等不同，按照海德格尔的区分，石头等自然物是无世界的（worldless），动物是贫乏于世的（poverty
    in world），“此在”则是建构世界的，原因就在于它能够揭示、领会周围的存在者，从而最终通达存在意义本身。从某种意义上言，“此在”不是一种发生的事实，而是不断流动着的、自创生的事实。在我们看来，人建构世界的方式有两种：静观式的认知建构（比如头脑风暴和思想实验）和动态式的实践建构。笛卡尔式的认知主体与胡塞尔的先验自我、纯粹意识都属于前一范畴。笛卡尔利用普遍怀疑的方法明确区分了物质属性的身体自我和精神属性的心灵自我，并且排除了主体的身体成分，强调认知与心智活动的纯反思的单一性，意欲将纯粹“我思”视作行动的源始基础，也就是说赋予心智或心灵一种实践力和行动力。基于哲学上更为彻底的先验立场，胡塞尔将意识视作一种绝对的存在，认为无意识则无世界，意识是世界存在的先验条件，认为“世界是通过意识被开放的，产生意义的，或者被揭示的。世界离开意识是不可想象的”。[^(\[14\])](#chapter003.html#m14)由此我们看到，与笛卡尔不同，胡塞尔赋予意识以充分的主动性，意识的揭示性作用在某种意义上也显现了它的行动维度。然而，胡塞尔通过现象学还原[^(\[15\])](#chapter003.html#m15)悬搁了“我”的身体负载，先验自我作为悬搁之后的剩余物具有了构造身体与世界的能力，但这种构造行为只是内在的，是在意识之中对构造对象的可能揭示。在我们看来，胡塞尔将身体作为其现象学还原的一个环节似乎暗示了自我与现实的断离，他“放弃了对现实世界、对事实性的指涉关系……而只是关注我们的体验是如何从内部被如实区分的”。[^(\[16\])](#chapter003.html#m16)我凝视、观照着纸笔、桌椅等对象物，这其实仍然是一种内在的心理把握，依然是一种纯粹的“看”，主体在意识中构造对象的结构，将实在性与事实性的经验解释为一系列意识行为或意识结构的伴随物。然而，这样的主体似乎缺失了更为主动的实践特征。海德格尔似乎正是看到了这一点，故而十分强调“此在”在世界中与其他存在者的实践接触，这正是我们首先具体体验到的东西，他反对将人与事物的理论性交互置于优先地位，而强调一种上手活动和事物的用具性和上手性。


    我们认为，“此在”的实践维度主要体现为它与世界内各种现实的存在者打交道的过程，“此在”始终表现出一种固有的能力，并构成了人的诸多活动模式。它不是作为笛卡尔式的“心智”对事物的静观，而是首先使用着、操作着对象物，事物也因为“此在”的操作活动而有了用具的属性，不再作为“纯粹的物”而与“此在”相照面。我们首先与之打交道的是文具、缝纫用具、加工用具、交通工具、测量用具，在使用的过程中，用具与用具所指向的诸事物得到了揭示，海德格尔通过这种方式取消了“我思”式的认知主体——心灵的绝对地位，在他看来，实践活动至少和认知活动一样重要，都是“此在”在世界中存在的一种方式。严格来说，没有一件东西可以单独“是”用具，存在的一向是用具器物的整体。[^(\[17\])](#chapter003.html#m17)我们认为，用具的整体联系为“此在”显现了某种情境的基本架构，比如，自习室内的电脑、桌椅、纸笔等都不是独自或作为物的总和向我显现，都是在一种动态的使用过程中指向我，在上手的过程中对象物的意义和存在方式才向我揭示。因而，在关于对象的应对方式上，胡塞尔之“先验自我”与海德格尔之“此在”的一个明显差别在于，前者是在纯粹意识领域内的意向构造，体现的是意识意向性，后者是相对外显的上手操用，体现的是一种实践或行动的意向性。海德格尔认为对用具的上手操用更为源始，在世的“此在”只有通过对上手事物的操劳活动才能推进到对现成事物的分析。认识是一种派生的存在样式，[^(\[18\])](#chapter003.html#m18)在某种意义上，在情境中使用用具的活动具有对纯粹观察事物的优先性，“此在”也正是在使用用具的过程中变得通透、明晰起来，并对沉浸其中的操劳活动进而对自己的存在有所体验、有所领会。在海德格尔眼中，这种实践感知是人们最为自然的、在先的经验方式，而不是孤立的静观式的感知，胡塞尔的现象学体验实质上是纯化了的先验意识，悬搁了人与其所处的周围世界的行动关联（这恰是海德格尔重视的），行动、实践维度的缺失导致他的体验概念变得有些空洞。海德格尔正是看到了这一点，故而以一种更加具有行动力与实践力的“此在”概念取而代之，将静态的认知建构和动态式的实践建构结合在了一起，不再把人单纯地束缚于某一个固定的观察点，“此在”之生存的内涵更多的是实践，而不是认知。通俗地讲，“此在”既可以对手头锤子的实在属性进行审视和分析，又可以拿着锤子进行敲击与锤打，后者比前者更为源始和基本，因而充分体现“此在”的实践意蕴，而这正是我们理解“此在”概念的出发点。


    ### 三 “此在”的“情境”维度


    在前述中，我们讨论了“此在”具有的实践维度，强调了海德格尔所谓的“此在”与这个世界之间的行动关联，行动是在某一具体的情境中进行并受到情境中诸多要素的影响和制约的，海德格尔关于“此在”“在世存在”的阐述表明，“此在”是一种情境性的存在者，它总是处于一种情境构成当中，“此在”的实践维度决定了它也具有情境维度。海德格尔说道，“某种上手东西何因何缘，这向来是由因缘整体性先行描绘出来的”，[^(\[19\])](#chapter003.html#m19)“此在”作为认知主体在展开认知活动之前已经先行处于一种整体的因缘之中，并且被这种因缘整体性所规定。在我们看来，我们作为“此在”与情境（或世界）本身之间是一种根本上相互牵引的关联，“此在”作为一种存在方式具有“去存在”“存在起来”的动态性，而不是以现成存在的形式和状态被置于情境/世界之内，“此在”的“去存在或‘悬而不定的状态’并不没入一个发散的‘坏无限’之中，而是就依凭这‘去’（zu）的悬临趋势而回旋牵连出‘我’与‘世界’共处的一个境遇”。[^(\[20\])](#chapter003.html#m20)这一鲜活、动态的“去存在”使得我们与情境/世界的联系更加紧密，作为“此在”存在的一种样式，人的认知自然也脱离不了这种情境性的背景，在笔者看来，“此在”的情境维度主要体现为“此在”与世界的关联。


    在海德格尔眼中，“此在”与世界不是传统认识论中的主体与客体的对立关系，也不是胡塞尔经过现象学还原后保留的意向行为与意向相关项之间的构成关系，而是“此在”向来就生存于世界当中，在世存在本质上就是“此在”的先天条件，“此在”的被抛决定了它自产生伊始就与世界缘结着、关联着，但是这样的缘结和关联并不意味着“此在”和世界之间是并列共存的关系，“绝没有一个叫做‘此在’的存在者同另一个叫做‘世界’的存在者‘比肩并列’那样一回事”，[^(\[21\])](#chapter003.html#m21)因为这样便又重新退回了二元论的立场，而是指“此在”“依寓世界而存在，说的是消融在世界之中”，[^(\[22\])](#chapter003.html#m22)“此在”从最根本上就在世界之中，没有无世界的“此在”，亦没有无“此在”的世界。[^(\[23\])](#chapter003.html#m23)从这种意义上讲，被主体经验地理解为心灵与世界之间勾连的认知活动亦失去了其优先地位，更能与世界内的存在者相融合的实践性之上手活动的重要性便凸显了出来。也就是说，海德格尔将“那些由境遇引发的和相互牵引的认识方式看作更原本和更在先的；而视那些以主客相对为前提的和依据现成的认知渠道（比如感性直观和知性反思）的认识方式为次生的和贫乏化了的”，[^(\[24\])](#chapter003.html#m24)他可能在“此在”与情境/世界相互缠绕的界面看到了摆脱笛卡尔主义的主客二分模式的希望。认知不是锁闭在主体大脑内部的东西，对现成事物之反思性的认知活动之所以可能，在于主体与世界的交互活动发生海德格尔所谓的某种“残断”现象，也就是惠勒与德雷福斯等人所说的流畅应付（smooth
    coping）和熟练应对过程遇到中断的情况。主体认知活动的着眼点始终在外，海德格尔说道，“此在一向已经‘在外’，一向滞留于属于已被揭示的世界的、前来照面的存在者……此在的这种依寓于对象的‘在外存在’就是真正意义上的‘在内’”，[^(\[25\])](#chapter003.html#m25)因而根本无须回答主体如何实现从内在领域之意识、心智向外在领域之世界的超越（海德格尔的这种观点是极为深刻的，他真正彻底地排除了主客二元的立场。我们认为，即便如延展认知这样激进地反对笛卡尔式认知科学的理论假设也未能彻底摆脱主体—客体、内在—外在的对立，无论是对等论证、耦合论证、进化论证以及梅纳里主张的认知内部资源与外部资源的整合，都暗含着某种对立的主张，延展就意味着超越，而超越就蕴含着主体与客体、内在与外在的二分基础）。“此在”本身就是作为认识着的“在世界之中”，也就是说，“此在”与其他非“此在”的存在者共存于一个世界中，“如果有什么‘内在领域’的话，“此在”与其他存在者都在世界这一个‘内在领域’中”。[^(\[26\])](#chapter003.html#m26)海德格尔认为，对被认识的东西的知觉不是先有出征把捉，然后带着赢得的猎物转回意识的“密室”，而是即使在知觉的收藏和保存中，进行认识的“此在”依然作为“此在”而在外。[^(\[27\])](#chapter003.html#m27)我们作为“此在”总是在世界中，在世存在是我们存在的动态结构，而认知作为一种存在方式自然也要符合这一结构，正是在世存在体现了“此在”的情境特征和维度。


    综上所述，在这一部分，我们对“此在”概念作了较为详细的分析和界定，主张“此在”具有身体、实践以及情境三个维度，也就是说，“此在”是具身的、有实践意蕴的、情境性的存在者。另外，“此在”与认知主体有不同的内涵，不能相互等同和替换，认知是“此在”植根于在世的一种样式，是我们作为“此在”存在的方式之一，因此从这种意义上说，认知主体亦是“此在”的一种显现，是“此在”这一观念集合的子集，而“在世存在”作为“此在”存在的一种先天结构已然先行规定了它（“此在”）的情境性。总之，人类首先是以实践性的预备上手方式而被情境浸没了的存在。


    ## 第二节 世界：认知的因缘与背景


    在前述中我们提到，“在世界中存在”体现了“此在”的情境维度，同时它也是“此在”最基本的特征，要理解“在世存在”，首先要对“世界”这一概念作出澄清，理解“在世存在”的关键是理解“世界”这一概念本身。海德格尔基于传统哲学和存在论现象学的意义对“世界”作了区分，他列出了“世界”自身蕴含着的四种意义：①用作存在者层次上的世界概念，指能够现成存在于世界之内的存在者的总体，比如我们眼中看到的日月星辰、山川形胜等诸多事物的排列与集合，也就是世界上所有存在物的总和；②世界可以成为总是包括形形色色的存在者在内的一个范围的名称；③一个实际上的“此在”作为“此在”“生活”“在其中”的东西，亦指最切近于我们的周围世界；④指世界之为世界的存在论生存论上的概念，它是特殊“世界”的先天性的结构整体。[^(\[28\])](#chapter003.html#m28)在我们看来，海德格尔之所以把“世界”的传统意义和存在论意义区分开来，目的是把世界改造成构成人类认知以及意向性的支撑背景。


    海德格尔自始就对传统认识论的一些基本问题有着独特、深刻的理解，他不同意对世界作一种外在的、形式上的理解和描述，因为这样就会从根本上将世界视为外在于主体并与之针锋相对的东西，对世界的认知也就变成了主体与客体之间反思性的映射关系，这与海德格尔的初衷是背道而驰的。主体和客体同“此在”和世界不是一而二二而一的，[^(\[29\])](#chapter003.html#m29)也就是说，主体与客体和“此在”与世界绝对不是一回事，绝对不能混为一谈，主体与客体都是现成的存在者，它们的关系是两个存在者之间的现成性关系，而“此在”是人的生存，即对存在的理解，世界则是这种理解展示的境遇。[^(\[30\])](#chapter003.html#m30)因而，若要从存在论现象学的角度切入认知，就必须舍弃和悬搁“世界”的前两种意义，世界不是现成存在者的总体累积，而是能够将我们融入有意义之活动的因缘背景，它不是认知的清晰对象。换言之，“此在”与世界、主体与客体是如此紧密地纠缠在一起的，“此在”区别于现成存在者的根本特征就在于其超越性。一般情况下，认知强调的是主客体二分基础上的内在超越，自觉地把认知活动定位于“内在领域”，大脑与意识内的主体突破内在的界限而达到它之外的客体，也就是作为一般事物的现成存在者，即一般的认知对象物。人们诉诸不同的方法（比如意向性）以解释这种超越关系，解释人的认知是如何翻出意识的围墙从而在主体内部和外部的对象之间保持勾连的。无论是以笛卡尔主义为基础的经典认知理论框架还是以“4E+S”认知为代表的新认知模型，都试图从主体的内在性出发去描述这一超越，因而这种超越在本质上依然是一个内在领域和外在领域之间的关系，世界也依然是外在于“此在”的一个存在者而已。然而，在存在论现象学的语境下，超越是“此在”源始具有的特征，“此在”的存在本身就是在超越，也就是超越一般的非“此在”的存在者。存在者首先被超越，然后才能成为客体，这就是说，展开认知活动的前提条件是“此在”在意识到自己亦是存在者的情况下与后者（非“此在”的存在者）产生关联，但被超越的不是“此在”“自己和客体之间的一道鸿沟、一道界限，而恰恰是它作为事实的此在也是的存在者，是存在者被此在超越”。[^(\[31\])](#chapter003.html#m31)这样的超越是在世界中发生的，“此在”的超越实质上就是指它在世界中存在的生存现象，不过是换了一种说法而已。因此，世界不仅仅是“此在”展开认知活动的寓所以及加以认识的东西，它就是“此在”的本质特征和属性之一，在世存在是“此在”的基本状况，而世界，则是使我们的认知得以可能的东西，在海德格尔那里就是在世存在重要的结构要素。


