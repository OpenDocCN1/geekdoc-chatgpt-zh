- raw: '在德雷福斯那里，常识问题与框架问题密切相关，如果人工智能能够回答前者，那么后者自然就会迎刃而解。在这种意义上，成功构建一个完全指导智能主体行动的框架，其关键就在于将极易扩充的日常知识纳入其中，并能依据所处情境作出相应的调整。常识是人们在长期生活和实践的过程中积淀下来的经验以及经过理论化之后的成果，表现了人类对环境的适应程度。从进化论的角度看，它是人类生存的必要手段，是日常生活的知识源泉，在一定程度上保证了人类行动普遍后果具有可靠的预见性。然而，常识并不是具有明确系统且融贯的真理体系，与科学知识相比，常识的内容在很大程度上不具有精确性，后者是一种基于直觉的、非明晰的知识，因而很难予以形式化。德雷福斯认为，常识在根本上不关乎我们对世界的判断，而是关乎我们对世界的应对方式。[^(\[64\])](#chapter005.html#m64)他从海德格尔的“被抛入世”概念入手，强调“此在”本身具有的对所处境况的操心与关切。在他看来，“此在”的被抛恰恰呈现出认知主体固有的情境属性，能够更为灵活地处理机器难以应付的巨量信息，因为它摒弃了作为沉重负荷的精确表征，海德格尔有关上手状态和现成在手状态的思想体现了这一核心观念。


    为什么机器会受到框架问题的束缚而人类不会，原因可能在于二者应对世界的方式不同。前者是基于命题知识（knowing-that）的表征性应对，后者是基于技能知识（knowing-how）的实践性应对，两种应对方式的不同之处在于对精确、清晰表征的核心诉求。人类知识具有明显的情境特征，它依赖于具体、特定的语境，并不是只有严格遵循句法规则的语句才表达和承载意义，只要达到预期的目标，并不一定要按照逻辑规则来进行认知活动。德雷福斯认为，框架问题产生的根源在于好的老式人工智能（GOFAI）假设任何与情境相契合的行动都必定是替代外在情境和对象的内在表征的结果与产物，内在表征是GOFAI模型解释世界的核心组分，而依照他的理解，以表征方式描述“在世存在”不会使我们感到满意。


    由此，德雷福斯走向了一条在我们看来颇为极端的道路，他拒斥了所有形式的表征主义，要求回到无意识的前反思状态，认为这才是人类智能最源始和本质的状态，将表征成分剔除出了智能范畴，进而提倡一种无表征智能。他坚信认知科学和人工智能若不能摆脱笛卡尔主义的认识论假设，直接的后果便是导致框架问题，要克服这一“阿喀琉斯之踵”，必须纠正笛卡尔关于认知主体本质的错误观念。表征—行动认知模型遭遇的失败与困境在另一方面也支持了海德格尔关于人“在世存在”的论断和理解，这也是为什么德雷福斯转向存在论现象学寻求消解棘手的框架问题。


    在我们看来，德雷福斯声称的无表征智能不可能轻易地实现，虽然他提供了解决框架问题的路径，即诉诸“此在”的“被抛”状态，但在如何在功能层面描述“被抛”的具体机制上却缺乏必要的说明。海德格尔认为，“此在”是被抛到这个世界中的，就像石头被抛入河中一样，“此在”在这一过程中向世界开显自身。如何为被抛状态提供一种具有因果力的解释，成为惠勒的主要任务和目标。他认为海德格尔指出了关于“此在”与事物照面的三种方式，包括上手状态（ready-to-hand）、现成在手状态（present-to-hand）以及未上手状态（un-ready-to-hand）。这三种照面方式奠定了海德格尔理解心智、认知与智能的基础，进而得出海德格尔关于认知能动者本质上是嵌入世界的论断，而世界在惠勒看来则是使事物呈现意义的整体语境网络。[^(\[65\])](#chapter005.html#m65)他认为德雷福斯提出的海德格尔式进路回避了框架问题，因为它没有从认知科学视角予以正面回应。前者依然具有某种神秘的形而上学色彩，如何将他的观念转变为一种现实的机制系统，从而能够提供一种科学的认知解释，这才是对框架问题的正确和有效的回应。用惠勒的话说就是“规避表征的被抛的机器”。[^(\[66\])](#chapter005.html#m66)


    在惠勒看来，要从哲学层面完全解决框架问题既需要现象学分析，又需要有解释能动者（agent）被抛的因果机制。他从布鲁克斯等人对情境机器人学的研究中获得了灵感。[^(\[67\])](#chapter005.html#m67)现象学意义上的被抛可以看作对主体的情境化操作，自适应的耦合状态在某种意义上可以看作对周遭事物的一种流畅应对（也就是海德格尔所指的上手状态）。在流畅应对的过程中，主体（认知能动者）与用具在认知上的间隙暂时得到了弥合，（主体）在过程中觉知到的不是自身与对象物的清晰分离，而是持续性的绵延任务，而在另外两种照面方式中，主体与客体的分立是存在的，由于主客二分是主体表征的必要条件，因此它们都存在认知能动者的表征。在未上手状态中，表征具有特定行动，以自我为中心，并内在地依赖于行动的语境，是以行动导向的亚能动表征机制，[^(\[68\])](#chapter005.html#m68)惠勒希望以这一机制和自适应的耦合机制构造出具有被抛特征的机器，从而能够克服他所谓的“语境内”和“语境间”的框架问题，他认为只要能够使机器保有语境敏感性以及对语境的灵活自适应性，自然就能避免机器由于语境不敏感而导致的框架问题。[^(\[69\])](#chapter005.html#m69)因而，从这种意义上来说，“被抛”是关于认知能动者语境敏感程度的现象学描述。


    ### 四 “被抛”能否解决框架问题


    遵循海德格尔哲学路线的人工智能究竟如何解决“框架问题”？德雷福斯主张借鉴“此在”“被抛入世”的观点，并努力提供关于人“被抛”的因果机制。惠勒对此表示赞同，他认为可以从海德格尔关于“此在”“被抛”的思想中获得灵感，“如果我们要针对框架问题得出一个能让认知科学家满意的答案，那就需要补充现象学分析，并且提出一个能够因果地解释主体如何被抛的机制”。[^(\[70\])](#chapter005.html#m70)当然，海德格尔本人并没有将“此在”的“被抛”机制化，也没有在因果意义上讨论这一概念，他始终是基于“此在”生存论的立场来展开讨论的。


    “被抛”这个概念首次出现在《存在与时间》第五章的第三十八小节，海德格尔用它来标识“此在”本身固有的性质，是其无法摆脱和逃避的境况。“此在”只要生存，便总被裹挟进常人的、非本真的存在状态当中，海德格尔称之为“沉沦”，而“沉沦”绽露出“此在”的“被抛”特征，表现出一种不可抗力。在德雷福斯和惠勒看来，“此在”的“被抛”在某种意义上可以被理解为主体对情境的具身嵌入和依赖，主体发现自己始终处于一个有意义的世界中，世界中的事物（存在者）与自己有着切己的关联，神经机制与非神经的身体要素和环境要素的耦合有可能在经验层面解释人的“被抛”状态。他们力图对这一存在论概念作自然主义解释，将之描述为清楚明白的、非神秘的因果过程。在他们眼中，“被抛”意味着智能主体对自身感知和行动的实时整合，产生流畅、具身的适应性行为。人“被抛”到日常的生活世界之中，需要时刻应对所处的诸多情境。如果能够将“被抛”这一设计策略应用于机器人，那么它在很大程度上能够减少甚至摆脱对内部世界表征模型的依赖，从而有效地降低计算成本。


    在惠勒眼里，机器人的“被抛”机制其实就是机器人的被情境化/语境化，语境不是人独有的东西，它能够在亚主体层次因果地实现。但正如加拉格尔所指出的，惠勒的“语境”概念在现象学的主体层次和机制的亚主体层次之间跳跃得过于频繁了，两个层次之间的“语境”概念不能进行自由切换。确实，人工智能若要展现出智能主体灵活的语境敏感性，需要在亚主体层次确定明晰的因果机制，以便使我们理解“被抛”这一现象学描述何以适用于机器人这样的类人智能体。语境敏感性体现为智能体有效栖居环境的一种能力和事实，惠勒想要说明“被抛”作为语境敏感性的可能条件，主体的适应性活动（包括认知行为）都是在它“被抛”的条件下展开的，并且在“被抛”中显现出来。德雷福斯与惠勒敏锐地关注到了“此在”被抛入世界之后具有的情境性特征，但海德格尔明确指出，“被抛境况不仅不是一种‘既成事实’，而且也不是一种已成定论的实际情形”，[^(\[71\])](#chapter005.html#m71)意在提醒我们，要努力避免将“被抛状态”看作某种经验事实，绝不能把“此在”的被抛状态理解为“此在存在的客观历史条件、时代背景或客观社会背景和文化背景之类的东西”。[^(\[72\])](#chapter005.html#m72)


    如果海德格尔是对的，那么计算机就不能借助算法将人的“被抛”形式化或转换为某种可以被处理和加工的信息，因为“被抛”意味着人是被整体地卷入与世界的交互之中的，而依循规则的计算机或人工智能恰巧缺乏对世界体验的直觉性把握。另外，在海德格尔看来，“被抛”境况是区别于理性决策的行动情境，人在被抛状态下的活动不是基于有限理性的、静态的推理表征，而是当下直接的、非反思的行动，“人的最佳行动不是理性思虑的结果，而是完全无我地受被抛境况引导的结果”。[^(\[73\])](#chapter005.html#m73)我们日常生活中相当多的活动是非审慎的（nondeliberate），即一个人在没有意识到自身所作之事的情况下进行的活动。这样看来，寻求构建人工智能的“被抛”机制是放弃寻求对世界的精确表征，而框架问题的产生正是源于对世界进行彻底、精确、统一的形式化描述的逻辑追求，因此我们发现，“被抛”其实是以放弃表征的方式巧妙地规避了框架问题，而非对后者的正面回应与解决。


    从某种意义上说，布鲁克斯提出的“无表征智能”契合了“此在”“被抛”的观念，智能体的智能行为是从动态、难以预测的现实世界中生成的。然而问题在于，按照“被抛”机制建造的机器能够称得上是“智能”的吗？我们认为，智能体的一个重要特征在于它具有主动思维的能力（主动思维蕴含有创造性），表征正是这一主动能力的形式呈现。依靠与世界的复杂交互虽然能在一定程度上减轻甚至摆脱对内在表征的依赖，但这有可能会丧失智能的主动性和自主性，而且行动并不必然产生智能行为，只会行动不会思维的机器人谈不上是“智能体”，它实现的是一种“被动理智”，也就是针对环境的变化被动地作出反应，即身体的感官接受和躯体行为。相反，“主动理智”是人类智能的显性能力，它帮助我们解决各种问题，理解大脑的各种认知成果，诸如数学证明、科学理论和经验报告等，这些也是人类智能的创造性的产物和结果。依据我们对“被抛”的理解，“此在”被抛入它所寓居的世界中并始终操劳着，它“总处在抛掷状态中而且被卷入常人的非本真状态的漩涡中”，[^(\[74\])](#chapter005.html#m74)而常人的非本真状态表现为对规范的遵从倾向，它早已先天地继承了规范性的概念框架，甚至于将这种倾向带入AI的研究当中。试想一下，人工智能不正是遵循着程序指令而进行工作的吗？故而人工智能仅能因循既有的部分规范，却无法创造新的规范，只能达到“此在”的常人理解，却触不到创造性的本真理解。[^(\[75\])](#chapter005.html#m75)因此，按照“被抛”机制设计的人工智能既没有解决框架问题，也不能完整地呈现人类智能的创造性本质，按照“被抛”路径设计的人工智能仍是一种低阶的“智能体”。


    我们的观点是，面对框架问题的诘难，任何逃避回答它的企图都暗藏着失败的可能性，必须直面框架问题并设法加以解决。这里有两个问题。第一，从技术层面解决框架问题的确是重要的，而哲学关心的是解决由框架问题所引发的认识论困境。我们认为，德雷福斯和惠勒以存在论现象学的“被抛”为基础提出了海德格尔式的解答策略，尤其是惠勒，进一步将被抛现象予以机制化。这可能面临着非因果的现象学解释与因果的自然主义解释之间能否相容的问题，以及存在论概念是否能够被置换为科学解释或者得到科学解释的辩护的问题。通过之前的论证，我们看到要实现这样的一种相容和置换仍然面临着困难（详见前述关于“此在”能否被自然化的讨论），以“被抛”解决人工智能的框架问题是不彻底的，按照“被抛”设计的人工智能也未能完整地呈现人类智能的整体结构。第二，我们认为，表征能力作为人类进化的产物，恒久地伴随着人类的实践活动，离线智能需要表征，人与世界的交互过程中产生的在线智能也需要表征，只不过这类表征受行动的导引。人工智能既然是以模拟和实现人类智能为最终目标的人工系统，而表征始终是作为人类智能的一环，那么它也需要思考表征问题而不是尝试建构一种“无表征智能”。[^(\[76\])](#chapter005.html#m76)引入存在论现象学的目的不是反表征，而是要以一种建设性的姿态介入认知科学以及人工智能，同时调和其与表征的矛盾，进而丰富人类智能的内容与形式。即便是专家级别的熟练技能活动也需要触及表征，在最弱的意义上，人的大脑或心智仍然具备对整体情境的表征结构。


    ## 小结


    综上所述，我们看到了将海德格尔哲学引入认知研究可能会面临的困境，在能将此在自然化、以“被抛”为特征的海德格尔式人工智能解决框架问题上，这种存在论的认知路径存在着被质疑之处。在某种程度上，这反映出存在论认知这一进路尚未像具身认知那样成为一种较为成熟、完整的理论体系。同时，有学者指出，由于认知科学本身较为庞杂，涉及的问题繁多，因此探索其本身的哲学基础亦是一项复杂的任务，仅仅聚焦于海德格尔哲学是不够的，还有的认知科学家将杜威、梅洛-庞蒂、后期的维特根斯坦和罗蒂作为哲学来源。[^(\[77\])](#chapter005.html#m77)海德格尔的存在论现象学只是推动认知科学发展的动力之一，若要单独为一种认知研究进路提供哲学基础可能不够充分，故而，我们在此引入诠释学作为认知研究的另一支撑和方法。海德格尔与之后的伽达默尔发展了一种关于人类理解和解释本体论的阐释，指出人的理解和解释活动何以可能。同时，理解和解释也体现出人所具有的一种认知能力，反过来说，人的认知活动，诸如思维、判断、推理以及问题求解等几乎也可以被看作一种理解或解释现象。正如加拉格尔所指出的，诠释学与认知科学这两者之间存在着一些明确的通路，使得它们能够相互助益。[^(\[78\])](#chapter005.html#m78)


