    [\\[57\\]](#chapter006.html#w57) 例如，机器翻译将初始语言转换为目标语言，在很大程度上消除了不同语言和文字之间的隔阂，但它很难达到人们常说的“信、达、雅”（忠实原文谓“信”，文辞言畅谓“达”，有文采谓“雅”）的要求和标准。“信、达、雅”是建立在对初始语言的深度理解的基础上，所体现得更多的是人类理解力而非计算力，而以计算和形式化为方法并基于规则的机译系统几乎不可能达到这一程度。\n\
