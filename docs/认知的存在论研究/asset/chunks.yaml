    # 第四章 存在论认知可能遭遇的困境


    认知科学奠基于这样一种观念之上：人类的智能活动产生自内在的心理过程，当我们在进行判断、推理以及决策等思维活动时，就是在以类似于数字计算机的运作方式施行着这种活动。人类认知的传统解释模型是围绕被概念化了的“表征”和“计算”建构起来的，存在论认知同其他的认知研究进路一样，也将反对“计算—表征”的立场作为自己的主要阵地，[^(\[1\])](#chapter005.html#m1)不同之处在于，它寻求以海德格尔的存在论现象学作为认知科学的哲学基础（至少是最主要的基础之一），期望最终建立一门“海德格尔式认知科学”，惠勒乐观地将它视为一种具有先进性和启发性的研究范式。然而，如同自然化现象学一样，这一新的路径也遭遇了自己的困境。一方面，能否将“此在”这一属于存在论范畴的概念予以自然化？既然要称之为一门“科学”，那么就需要符合科学要求和标准的概念。然而，存在论现象学与认知科学各自隶属于不同的语境，海德格尔本人也反对以自然主义方法去触碰关于存在的问题域，若要构建一种以存在论作为哲学基础的“海德格尔式认知科学”，首要的是将“此在”改造为一个科学概念，我们认为这具有相当的困难。另一方面，存在论认知还涉及对人工智能的考察，德雷福斯提出“海德格尔式人工智能”的主要目的就是完满、合理地解决“框架难题”，德雷福斯和惠勒从海德格尔关于“此在”“被抛”的生存论分析出发，惠勒也提出了“被抛的机器”（thrown
    machine），来规避表征和相关性的信息储存与计算，从而提供一种解决“框架问题”的有效路径。我们的观点是，德雷福斯对于人工智能的批判尖锐而深刻，甚至现在依然具有一定的效力，但“无表征智能”不能完整地覆盖人类智能的整体面貌，“被抛”的因果机制也不能彻底解决“框架问题”。


    ## 第一节 “此在”自然化的可能性


    “此在”是《存在与时间》中的核心主题之一，它以对存在的理解为本己的任务。海德格尔的这一论断被人们认为晦涩难懂，甚至连海德格尔本人有时都对这一概念的定义不甚清晰，有时专指人这个存在者，有时指人对存在的理解，有时亦指人整体的生存现象，但无论如何，“此在”是作为探究存在问题的重要切入点而被提及的关键概念。对于寻求构建海德格尔式认知科学的人们而言，“此在”能否被自然化成为这一新的认知进路关注的焦点和必须回答的问题。可以说，“此在”的自然化在很大程度上决定着海德格尔哲学是否能够成功地介入认知科学。惠勒坚定地主张海德格尔哲学与认知科学的联姻，认为“此在”有必要被自然化，但必要性与可能性并不是一回事，拉特克利夫（Ratcliffe）则否认实现这一目标的可能性，“海德格尔式认知科学的前景令人感到困惑……试图利用认知科学的术语去理解此在的在世存在是荒谬的”。[^(\[2\])](#chapter005.html#m2)也就是说，思辨的“此在”概念不能和本质上是经验性的认知科学相联结，后者奉行的是自然主义。在拉特克利夫看来，海德格尔哲学从根本上是反自然主义的，“此在”不是一个科学概念，而是一个存在论概念。因而，“此在”的自然化从根本上背离了“此在”本身先验的存在论预设（即“此在”是一种人类特有的存在方式，也就是他的生存），“此在”不再是它源始的意义，而是成为掺杂着自然主义成分的某种存在者。“此在”究竟能不能被自然化，成了一个相当重要的问题，惠勒和拉特克利夫等人也因之产生了分歧。虽然我们在前述对“此在”概念作了具体描述，但在这里仍有必要作进一步分析，我们需要考察存在论语境中的“此在”与人类的认知和智能的相关性，这关系到“此在”被自然化的可能性。


    ### 一 存在论语境下的“此在”


    “此在”涉及的是“人的本质是什么”这一问题。亚里士多德认为人类区别于动物的特质在于对未知现象的认知欲求，基督教哲学把不朽的灵魂看作人最本质的东西。从笛卡尔伊始，呼唤理性的声音日益高涨，他将“能思”的能力作为人区别于其他实体的标志，康德认为人的独特性在于追求知识与自由的能力，胡塞尔则提出了“先验自我”。豪格兰德指出，“此在”这一术语是对漫长的哲学表达传统的延续，也就是探究人的独特之处，但是“此在”与之前的任何描述都是不同的。[^(\[3\])](#chapter005.html#m3)


