    \n[\\[47\\]](#chapter005.html#w47) 现象学要求考察第一人称的活生生的意识体验，而认知科学是从第三人称视角来解释人类的心智现象，许多人在两者相互兼容的问题上产生了较大的分歧。有的学者，比如扎哈维，认为现象学能够对认知科学研究人类心智活动提供有益和必要的补充，现象学的解释模型可以与认知科学的解释模型进行卓有成效的交流；马尔巴赫主张现象学所讲的个人意识体验与内省报告应该而且可以为认知科学提供解释的基础；丹尼特则认为，认知科学是在亚主体层次说明认知行为的结构和过程，而主体层次的自我意识和前者存在着差别，第一人称的意识体验不能还原为功能层面的信息处理系统。\n\
