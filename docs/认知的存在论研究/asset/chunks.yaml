- raw: '在拉特克利夫看来，没有理由相信经验科学所采用的认知实践的偶然集合足以完全地揭示世界中的一切对象。现成在手的认知模式对上手活动作了抽象化的处理，它剥离了上手活动本身具有的某些特征与意义，正是上手活动使得人们产生了与世界之间的归属关联，但认知科学没有能够充分说明这一点（至少在海德格尔看来是这样的）。认知科学在某种程度上避开了海德格尔哲学关注的研究域，它不能被用来解释人类“拥有世界”这一基本的存在形式，而这也正是“此在”的核心特征之一。


    第二，“此在”与其他动物、植物以及其他物质性的东西（如石头）不同，区别在于“此在”能够“拥有世界”，而“拥有世界”表明“此在”不是基于“刺激—反应”，抑或是“感知—表征—决策—行动”的一般模式，[^(\[26\])](#chapter005.html#m26)而是具有了更为强烈的主动意味。蚂蚁等非“此在”的其他存在者只是“拥有环境”，处于一个被严格限定的特定范围，“此在”与这些存在者之间的区别不在于他的行动反应更灵活、更具适应性，而是“此在”本身不会像动物一样限于固定的环境当中，世界会随着“此在”生存之可能性而延伸或收缩。也就是说，“此在”置身于一个由有意义的可能性形成的场域，并且拥抱着可能性。海德格尔说道：“人不仅被认作世界的一部分，在世界中出现着，共同建构着世界，而且人与世界相对而立。”[^(\[27\])](#chapter005.html#m27)相对而立是人的主动选择，正如马克思所指出的，人作为实践和认识的主体，始终在不断地认识世界和改造世界，在海德格尔的视域中“此在”就是对世界的一种“拥有”。拉特克利夫认为，人与其他有机体之间存在三个根本差别：①（其他有机体）对有限刺激的僵化反应；②（人）具有灵活的反应形式，可以预测一系列可能性；③（人）能够将可能性理解为可能性。[^(\[28\])](#chapter005.html#m28)在他看来，惠勒的“行动导向的表征”（action-oriented
    representation）只是②的复杂版本，没有能够说明为什么可能性是人与世界相关联的根本途径，而这才是人们理解世界和自身与世界关系的独特之处。


    概言之，拉特克利夫认为，海德格尔的方法从任何意义上讲都不是自然主义的，将“此在”自然化归根结底是对“此在”作了现成性的误读，按照他的理解，上手活动与现成性的科学描述之间并不是融贯的，有机体—环境灵活地耦合也不是“海德格尔式”的。随着认知科学的不断发展和进步，未来或许能够完满地描述和解释人的全部经验与行动，但这不是存在论现象学的目标。如果海德格尔的观点是正确的，那么“拥有世界”是认知科学永远无法抵达的彼岸，不管我们对人类认知能力的解释如何连贯。海德格尔可能并不会让我们放弃全部的认知科学，但它同生物学、人类学等实证学科一样，定位于事实的状况，而忽视了“此在”向自身境遇的可能筹划。正如拉特克利夫所言，一门关于“此在”的认知科学就如同通过画一幅精美的图像来做心脏移植手术，或者通过思量289和47624的美学特质来进行加法运算一样，属实是拙劣的设想了。[^(\[29\])](#chapter005.html#m29)


    #### （四）“此在”自然化的三种维度及其可能性


    什么是自然主义，在不同的语境当中这一术语具有不同的含义，我们在这里将自然主义主要区分为三种形式，即本体论的自然主义、认识论的自然主义以及方法论的自然主义，因此，自然化的具体方式取决于对象所属之具体范畴，现象学的自然化也分为本体论、认识论和方法论上的自然化。[^(\[30\])](#chapter005.html#m30)每一种自然化的形式是不同的，我们需要分析从三个维度将“此在”自然化的可能性，从而更为全面地考察和把握“此在”自然化的问题。


    第一，从本体论的维度看，本体论的自然化现象学直接承自本体论的自然主义，后者主张事物构成的一元论，每一事物的构成要素和属性都是自然的。本体论方面的自然化似乎是自然化现象学的核心诉求，如果可能，便可以从根本上弥合因果描述—现象学描述、物理属性—现象属性的“解释鸿沟”。从这种意义上说，“此在”在本体论意义上自然化的必要条件是将其看作某一自然人，人的意识不是什么神秘的“个人体验”，而是具有自然属性的自然物（大脑包含的神经过程），以此来表明“此在”同其他存在者一样是以实存的方式被我们把握。然而，这一理解遮蔽了“此在”同其他存在者经上手活动而建立的指引关系，而上手活动也就是一种实践活动。在海德格尔眼中，“此在”更多的是一种实践性而非认知性的存在者，它的首要存在方式不是认知，而是在世界中的上手操劳，操劳活动蕴含着人之存在的源始意义，这种意义具有不可还原的特征。相较而言，自然化现象学的方法是将现象学分析的结果转化为清楚明白的科学语言（比如数学），任何一种现象学描述只有在融入自然科学之解释框架的意义上才能自然化，前提是这种描述可以被形式严谨的数学语言代替，罗伊等人认为，数学化是自然化的关键手段，[^(\[31\])](#chapter005.html#m31)而数学化在某种程度上可以看作一种还原类型。例如，马尔巴赫便尝试建立一种形式语言描述现象学的第一人称报告，将现象性的个人描述符号化，构成能够被主体间共享的意义。从另一角度看，类似的现象学符号抛却了经验的内容，它专注于经验的形式结构，数学作为中立的、形式化的工具能够被大多数人理解和接受，而且数学理论能够有效描述“连续”与“离散”的动态系统，并且已经为人类心智提供了一种解释框架，比如戈尔德等对认知的动力学分析。因此，足够复杂、精密的数学可以促进现象学材料与自然科学领域的数据向一种普遍语言转化，[^(\[32\])](#chapter005.html#m32)自然化“此在”的理想形式如图4-1所示。


    ![](image/b0000001000000200000000000018001.jpg)


    图4-1 自然化“此在”的理想形式


    资料来源：笔者自制。


    然而，从“此在”的构成性上说，在世存在是避绕不开的问题，“此在”从本质上说就是在世界之中存在。这不是指两个客体在空间中并列，抑或客体在空间内的物理联系，“既不是指客体的存留存在，也不是指主体与客体的关系”，[^(\[33\])](#chapter005.html#m33)它是“此在”的基本结构。在海德格尔看来，存在于世的不是孤立的、绝对的“先验自我（意识）”，而是诸多个体的生存活动。惠勒对“此在”在世的生存结构作了经验性的描述，在他看来，在世存在意味着人类主体是以具身的方式嵌入科学描述的世界之中。然而，这样的描述方式忽视了“此在”在世界之中的存在方式，也就是忧虑（Sorge），更忽略了“此在”最本质的特征——向死而在。在世存在给“此在”带来了“畏”这一基本的情绪体验，不是对其他存在者的情绪，而是在被抛入世界后感受到的不确定性，它意味着“此在”之生存的结构可能性。


    概言之，如果站在海德格尔的立场，“此在”的存在根本不是现成存在，形式化的对象是现成的存在物。当我们讨论自然化，尤其是以数学方法形式化“此在”时，我们便失去了对“此在”进行适当的生存论分析的可能性。海德格尔已经明确表明了“此在”概念根本不同于一切旧有的、关于人的传统观念，人的认知与思维能力不是他论述的主题，对他而言，重要的是对存在的理解。从本体论的维度看，“此在”是将存在问题扛在肩上前行的特殊存在者，它需要在存在论上加以确定，海德格尔不是在作现象学的人类学研究，因而“此在”也不是属于人类学范畴的概念。在我们看来，自然化也是一种对象化、机制化，它将身体与心智统一的人解释为具身—嵌入的智能主体。然而，一个具象的“人”不是“此在”，人体的肉身和心身统一体的自我都不是“此在”，[^(\[34\])](#chapter005.html#m34)自然化的运作需要建立在关于人的因果以及功能层次的理解之上，这无疑是和“此在”的本质定义相矛盾的。因此，从本体论角度谈论“此在”的自然化并不可行。


    第二，从认识论的维度看，自然主义主张，认识论的证明和解释是与自然科学相伴随的持续过程，科学的方法是我们获得知识的唯一方法，[^(\[35\])](#chapter005.html#m35)是我们认识事物和对象唯一可靠的途径和手段。自然主义的认识论强调经验知识的唯一合法性与有效性，强调知识应当同自然的事物、属性、法则以及规律相关。反映在现象学上，表现为三种自然化路径的现象学：罗伊、马尔巴赫等人提出的形式化的现象学（formalized
    Phenomenology）；瓦雷拉和汤普森等人提出的神经现象学（Neurophenomenology）以及加拉格尔等人提出的前置现象学（front-loaded
    Phenomenology）。后两种形式是在基本保留现象学的材料、方法和洞见的前提下将现象学与认知科学结合，现象学主动地融合进技术和实验方法，现象学与认知科学通过相互引导将彼此关联在一起。它们都力图沟通现象学材料和神经生理学材料，前者通过第一人称的内省报告获得，后者则借助于功能核磁共振成像（fMRI）等实验，其共同目标是通过将详细的现象学研究形式和神经科学研究的实验方案相结合，生成新的数据资料，以获得关于人的自身体验和大脑神经过程复杂关系的理解和解释。


    我们认为，从认识论维度讨论“此在”的自然化涉及我们如何认识“此在”的问题，我们看到，自然化现象学的一般方式是利用了第一人称的现象学方法，将人作为自身体验的报告者与观察者，“此在”成为第一人称视角的体验主体。胡塞尔否认现象学语境下的意识形态或结构同神经科学语境下的自然的因果形式或结构之间具有某种类型同一，“意识的综合完全不同于自然要素的外部组合……而是关于意识生活的本质，而意识生活包含在一个意向的交织、动机，以及通过意义的相互蕴含，在其形式和原则上都与物理世界的方式毫不雷同”。[^(\[36\])](#chapter005.html#m36)他将一切事物的有效性，甚至世界的存在与否都置于先验主体内，先验自我成为经验何以可能的必要条件，通过连续的现象学还原，胡塞尔最终走向了先验唯心主义。相反，海德格尔认为，“此在”不是先验的主体性或一束意识流，并非现成的主体或客体，不能作为一个业已发生的存在者被我们所理解。他竭力避免从“主体的我”这一角度切入。按照张祥龙先生的解释，海德格尔利用“此在”既保持了“主体”指示出的人的关键性的存在论地位，又清除掉了人性观中的主体主义，“此在”就是诠释学和现象学化了的人本身。[^(\[37\])](#chapter005.html#m37)我们可以看到，不论是胡塞尔的先验唯心立场（作为意识）还是海德格尔的存在论立场（作为一种生存现象），“此在”都不能被自然化，因为它不是自然要素的综合。


    第三，从方法论的维度看，“此在”的自然化问题同时也是一个方法论问题，也就是说我们是否能够以一般的科学方法对“此在”概念本身进行分析和阐明。一种强立场的方法论自然主义将自然主义视为一种元哲学，主张哲学研究（包括认识论、伦理学、形而上学）应当采用，或者至少与自然科学的方法（比如实证试验、概念的操作化等等）及其证明标准［如简约性（parsimony）、简明性（simplicity）、预测力（predictive
    power）以及结果的可重复性（reproducibility）］保持一致。[^(\[38\])](#chapter005.html#m38)强立场的方法论自然主义要求保持哲学与自然科学在方法上的连续性，暗含着取消哲学在方法论领域内的自主性的危险。由于这一立场过于强硬，不会为大多数人所接受，因而我们在这里主要关注方法论自然主义的较弱立场：如果X是某一自然实体或属性，那么研究它的最恰当方法就是与自然科学的研究方法相融贯或连续。[^(\[39\])](#chapter005.html#m39)承认和接受方法论自然主义需要拒斥本体论自然主义，只有在这一前提下，前者才能作为一种理论立场被我们解读。如果我们接纳了自然主义的本体论承诺，就意味着消除了使方法论自然主义得以成立的约束条件，即命题的适用范围不是哲学中的全部话语和对象，而是那些被认为是自然实体或属性的对象。


    笔者认为，海德格尔存在论哲学语境中的“此在”与这种较为和缓的方法论自然主义并不兼容。关于人的活生生的身体（lived body）和心智，我们赞成弱的方法论自然主义的介入，因为它们可以被看作具有自然属性的事物，甚至还有专门研究身体与心智的自然科学（胡塞尔也设想了讨论身体的躯体学）。对于“此在”而言，它既不适合于“无身”的描述，不能看作脱离身体的先验主体，同时也非心智寓于肉身的心身统一体。不同于自然科学的研究方法，海德格尔是利用现象学方法来应对“此在”这一研究对象的，“此在”并非对“人”这个名称的一个随随便便的替换，而是对一种存在方式的特别限定。[^(\[40\])](#chapter005.html#m40)在他看来，身体首先必须作为人在世界中存在的根本方式而被我们把握，它不是放置心智的容器，“此在”因之也可被视为一种身体式的存在。海德格尔反对以传统的方式对“此在”展开说明，所以他一直在强调自己不是在作人类学研究，与其他人不同，他认为诠释学才是研究“此在”的正确、恰当的方法。这一方法不是为了描述某个处于历史或文化情境中的具体个人，而是“为我们摆明我们的自我解释着的存在方式之普遍的、跨文化的、超历史的结构”，[^(\[41\])](#chapter005.html#m41)对于海德格尔来说，“此在”的自然化就是对“此在”本身之领会的误解，我们对“此在”的探究不等于以规则和程式将诸多属性、因素和特征关联起来，如何通达“此在”涉及对存在的理解，而这种理解不是纯粹的认知和心理过程。也就是说，这种理解不能通过自然科学的实验方法还原为某一较为完备的、并被某一主体所有的科学信念系统。此外，每一方法都有它所要实现的目标，自然化方法论的意图是将“此在”本身科学化，从而与认知科学的概念体系相容。这样造成的后果是使“此在”有其名而无其实，“此在”面对的存在问题在自然科学的视域中被忽视了，更不用说探讨和解决，他成了具有经验内容并奠基于科学的认知机制的认知主体，这背离了海德格尔的原意。


    综上所述，我们从本体论、认识论和方法论三个维度讨论了自然化“此在”成立的可能性，结果表明将“此在”自然化为适用认知科学语境的概念面临着不小的困难。不论立场的强或弱，借用自然科学的理论来研究“此在”，甚至形成一套描述“此在”的科学机制，这样的做法始终会更迭“此在”原有的生存论意义以及他作为追问存在问题的特殊存在者的存在论地位，“此在”的自然化可能只是如同水中月镜中花一样的幻象。


    ### 三 “自然化此在”只是一个“幻象”


    在惠勒看来，一个人在持有科学的实在论立场的同时赞同海德格尔的哲学观点其实并不矛盾。[^(\[42\])](#chapter005.html#m42)海德格尔并不反对科学本身，他反对的是一种以朴素的眼光看待世界和存在者的理论态度，任何学科都必须在对存在有所理解的前提，即在一个“生物、社会和文化信念和实践的既定背景”[^(\[43\])](#chapter005.html#m43)下展开。惠勒的目的在于寻求建立一门新的“海德格尔式认知科学”，将海德格尔的某些哲学主张纳入自然主义的解释框架当中，实现这一目标的关键点在于如何以认知科学的概念术语描述和确定“此在”，如何在认知科学中为“此在”寻求一个恰当的位置。从某种意义上说，对人类认知的考察与研究既需要朝外转向自然主义的因果解释，也需要朝内转向对个人经验的内省描述。丘奇兰德（Patricia
    S.Churchland）坚定地认为我们的个体经验和认识是错误的，按照他的观点，我们在日常生活中应该诉诸大脑和神经状态而非经验（但是人们不太可能随身携带着仪器对自己进行检验，这听起来有点匪夷所思而且没有必要）。同样地，我们不能把对认知的理解束缚于某种科学或哲学的解释，而应当力图融合两者之间的裂痕，寻求它们在解释上的统一。人（“此在”）恰好处在一个交叉点上，若要成功地构建一门真正的“海德格尔式认知科学”，“此在”的自然化是重要的一环。所谓自然化则是运用认知科学的概念来说明“此在”，说明他在认知科学领域中具有的本体论地位。胡塞尔先前指出，“由于自然主义想将哲学建立在严格科学的基础上，并且想将哲学作为严格的科学构建起来，而它看起来又显得完全不可信，因此，它的方法目的本身也就显得不可信”。[^(\[44\])](#chapter005.html#m44)需要明确的是，胡塞尔并不反对自然科学解释，他反对的是统摄一切的自然主义解释范式，有关意识、意向性本质的描述只能是现象学的任务，自然主义的经验分析是现象学排除的对象。从这种意义上看，“此在”的自然化似乎违背了现象学最基本的原则和信条。


    在前述中我们厘清了认知科学视域下“此在”的基本内涵。按照海德格尔的说法，“此在”首先不能被描述为一个意识主体，“我们应当指出，迄今为止以‘此在’为目标的提问与探索虽然在事实方面大有收效，但错失了真正的哲学问题，而只要它们坚持这样错失哲学问题，就不可要求它们竟能够去成就它们根本上为之努力的事业”。[^(\[45\])](#chapter005.html#m45)海德格尔就是要将关于“此在”的生存论分析同心理学、生物学以及人类学区分开来，在他看来，学科之间的分立决定了它们只能独立地把“此在”的某一方面作为自己的课题加以研究和解决，因而未能指向“整个人的存在”。相较而言，自然主义将解释限制在了物理事件和物理对象的范围内，对自然主义来说，任何不能依照物理过程加以解释的东西都是神秘的，需要被解释和可以被解释的一切东西尽在自然之中。若依照自然主义的信念来理解，“此在”和其他事物一样，是服从严格的自然法则（因果律）的时间—空间存在者，是一个在世界中实在地发生着的实体。即便是心理现象也是依附于物理自然的一个变体，是“平行的伴随物”，任何东西都明白无误地受严格的自然法则的支配。[^(\[46\])](#chapter005.html#m46)'
  fmt: '

    在拉特克利夫看来，没有理由相信经验科学所采用的认知实践的偶然集合足以完全地揭示世界中的一切对象。现成在手的认知模式对上手活动作了抽象化的处理，它剥离了上手活动本身具有的某些特征与意义，正是上手活动使得人们产生了与世界之间的归属关联，但认知科学没有能够充分说明这一点（至少在海德格尔看来是这样的）。认知科学在某种程度上避开了海德格尔哲学关注的研究域，它不能被用来解释人类“拥有世界”这一基本的存在形式，而这也正是“此在”的核心特征之一。


    第二，“此在”与其他动物、植物以及其他物质性的东西（如石头）不同，区别在于“此在”能够“拥有世界”，而“拥有世界”表明“此在”不是基于“刺激—反应”，抑或是“感知—表征—决策—行动”的一般模式，[^(\[26\])](#chapter005.html#m26)而是具有了更为强烈的主动意味。蚂蚁等非“此在”的其他存在者只是“拥有环境”，处于一个被严格限定的特定范围，“此在”与这些存在者之间的区别不在于他的行动反应更灵活、更具适应性，而是“此在”本身不会像动物一样限于固定的环境当中，世界会随着“此在”生存之可能性而延伸或收缩。也就是说，“此在”置身于一个由有意义的可能性形成的场域，并且拥抱着可能性。海德格尔说道：“人不仅被认作世界的一部分，在世界中出现着，共同建构着世界，而且人与世界相对而立。”[^(\[27\])](#chapter005.html#m27)相对而立是人的主动选择，正如马克思所指出的，人作为实践和认识的主体，始终在不断地认识世界和改造世界，在海德格尔的视域中“此在”就是对世界的一种“拥有”。拉特克利夫认为，人与其他有机体之间存在三个根本差别：①（其他有机体）对有限刺激的僵化反应；②（人）具有灵活的反应形式，可以预测一系列可能性；③（人）能够将可能性理解为可能性。[^(\[28\])](#chapter005.html#m28)在他看来，惠勒的“行动导向的表征”（action-oriented
    representation）只是②的复杂版本，没有能够说明为什么可能性是人与世界相关联的根本途径，而这才是人们理解世界和自身与世界关系的独特之处。


    概言之，拉特克利夫认为，海德格尔的方法从任何意义上讲都不是自然主义的，将“此在”自然化归根结底是对“此在”作了现成性的误读，按照他的理解，上手活动与现成性的科学描述之间并不是融贯的，有机体—环境灵活地耦合也不是“海德格尔式”的。随着认知科学的不断发展和进步，未来或许能够完满地描述和解释人的全部经验与行动，但这不是存在论现象学的目标。如果海德格尔的观点是正确的，那么“拥有世界”是认知科学永远无法抵达的彼岸，不管我们对人类认知能力的解释如何连贯。海德格尔可能并不会让我们放弃全部的认知科学，但它同生物学、人类学等实证学科一样，定位于事实的状况，而忽视了“此在”向自身境遇的可能筹划。正如拉特克利夫所言，一门关于“此在”的认知科学就如同通过画一幅精美的图像来做心脏移植手术，或者通过思量289和47624的美学特质来进行加法运算一样，属实是拙劣的设想了。[^(\[29\])](#chapter005.html#m29)


    ## （四）“此在”自然化的三种维度及其可能性


    什么是自然主义，在不同的语境当中这一术语具有不同的含义，我们在这里将自然主义主要区分为三种形式，即本体论的自然主义、认识论的自然主义以及方法论的自然主义，因此，自然化的具体方式取决于对象所属之具体范畴，现象学的自然化也分为本体论、认识论和方法论上的自然化。[^(\[30\])](#chapter005.html#m30)每一种自然化的形式是不同的，我们需要分析从三个维度将“此在”自然化的可能性，从而更为全面地考察和把握“此在”自然化的问题。


    第一，从本体论的维度看，本体论的自然化现象学直接承自本体论的自然主义，后者主张事物构成的一元论，每一事物的构成要素和属性都是自然的。本体论方面的自然化似乎是自然化现象学的核心诉求，如果可能，便可以从根本上弥合因果描述—现象学描述、物理属性—现象属性的“解释鸿沟”。从这种意义上说，“此在”在本体论意义上自然化的必要条件是将其看作某一自然人，人的意识不是什么神秘的“个人体验”，而是具有自然属性的自然物（大脑包含的神经过程），以此来表明“此在”同其他存在者一样是以实存的方式被我们把握。然而，这一理解遮蔽了“此在”同其他存在者经上手活动而建立的指引关系，而上手活动也就是一种实践活动。在海德格尔眼中，“此在”更多的是一种实践性而非认知性的存在者，它的首要存在方式不是认知，而是在世界中的上手操劳，操劳活动蕴含着人之存在的源始意义，这种意义具有不可还原的特征。相较而言，自然化现象学的方法是将现象学分析的结果转化为清楚明白的科学语言（比如数学），任何一种现象学描述只有在融入自然科学之解释框架的意义上才能自然化，前提是这种描述可以被形式严谨的数学语言代替，罗伊等人认为，数学化是自然化的关键手段，[^(\[31\])](#chapter005.html#m31)而数学化在某种程度上可以看作一种还原类型。例如，马尔巴赫便尝试建立一种形式语言描述现象学的第一人称报告，将现象性的个人描述符号化，构成能够被主体间共享的意义。从另一角度看，类似的现象学符号抛却了经验的内容，它专注于经验的形式结构，数学作为中立的、形式化的工具能够被大多数人理解和接受，而且数学理论能够有效描述“连续”与“离散”的动态系统，并且已经为人类心智提供了一种解释框架，比如戈尔德等对认知的动力学分析。因此，足够复杂、精密的数学可以促进现象学材料与自然科学领域的数据向一种普遍语言转化，[^(\[32\])](#chapter005.html#m32)自然化“此在”的理想形式如图4-1所示。


    ![](image/b0000001000000200000000000018001.jpg)


    图4-1 自然化“此在”的理想形式


    资料来源：笔者自制。


    然而，从“此在”的构成性上说，在世存在是避绕不开的问题，“此在”从本质上说就是在世界之中存在。这不是指两个客体在空间中并列，抑或客体在空间内的物理联系，“既不是指客体的存留存在，也不是指主体与客体的关系”，[^(\[33\])](#chapter005.html#m33)它是“此在”的基本结构。在海德格尔看来，存在于世的不是孤立的、绝对的“先验自我（意识）”，而是诸多个体的生存活动。惠勒对“此在”在世的生存结构作了经验性的描述，在他看来，在世存在意味着人类主体是以具身的方式嵌入科学描述的世界之中。然而，这样的描述方式忽视了“此在”在世界之中的存在方式，也就是忧虑（Sorge），更忽略了“此在”最本质的特征——向死而在。在世存在给“此在”带来了“畏”这一基本的情绪体验，不是对其他存在者的情绪，而是在被抛入世界后感受到的不确定性，它意味着“此在”之生存的结构可能性。


    概言之，如果站在海德格尔的立场，“此在”的存在根本不是现成存在，形式化的对象是现成的存在物。当我们讨论自然化，尤其是以数学方法形式化“此在”时，我们便失去了对“此在”进行适当的生存论分析的可能性。海德格尔已经明确表明了“此在”概念根本不同于一切旧有的、关于人的传统观念，人的认知与思维能力不是他论述的主题，对他而言，重要的是对存在的理解。从本体论的维度看，“此在”是将存在问题扛在肩上前行的特殊存在者，它需要在存在论上加以确定，海德格尔不是在作现象学的人类学研究，因而“此在”也不是属于人类学范畴的概念。在我们看来，自然化也是一种对象化、机制化，它将身体与心智统一的人解释为具身—嵌入的智能主体。然而，一个具象的“人”不是“此在”，人体的肉身和心身统一体的自我都不是“此在”，[^(\[34\])](#chapter005.html#m34)自然化的运作需要建立在关于人的因果以及功能层次的理解之上，这无疑是和“此在”的本质定义相矛盾的。因此，从本体论角度谈论“此在”的自然化并不可行。


    第二，从认识论的维度看，自然主义主张，认识论的证明和解释是与自然科学相伴随的持续过程，科学的方法是我们获得知识的唯一方法，[^(\[35\])](#chapter005.html#m35)是我们认识事物和对象唯一可靠的途径和手段。自然主义的认识论强调经验知识的唯一合法性与有效性，强调知识应当同自然的事物、属性、法则以及规律相关。反映在现象学上，表现为三种自然化路径的现象学：罗伊、马尔巴赫等人提出的形式化的现象学（formalized
    Phenomenology）；瓦雷拉和汤普森等人提出的神经现象学（Neurophenomenology）以及加拉格尔等人提出的前置现象学（front-loaded
    Phenomenology）。后两种形式是在基本保留现象学的材料、方法和洞见的前提下将现象学与认知科学结合，现象学主动地融合进技术和实验方法，现象学与认知科学通过相互引导将彼此关联在一起。它们都力图沟通现象学材料和神经生理学材料，前者通过第一人称的内省报告获得，后者则借助于功能核磁共振成像（fMRI）等实验，其共同目标是通过将详细的现象学研究形式和神经科学研究的实验方案相结合，生成新的数据资料，以获得关于人的自身体验和大脑神经过程复杂关系的理解和解释。


    我们认为，从认识论维度讨论“此在”的自然化涉及我们如何认识“此在”的问题，我们看到，自然化现象学的一般方式是利用了第一人称的现象学方法，将人作为自身体验的报告者与观察者，“此在”成为第一人称视角的体验主体。胡塞尔否认现象学语境下的意识形态或结构同神经科学语境下的自然的因果形式或结构之间具有某种类型同一，“意识的综合完全不同于自然要素的外部组合……而是关于意识生活的本质，而意识生活包含在一个意向的交织、动机，以及通过意义的相互蕴含，在其形式和原则上都与物理世界的方式毫不雷同”。[^(\[36\])](#chapter005.html#m36)他将一切事物的有效性，甚至世界的存在与否都置于先验主体内，先验自我成为经验何以可能的必要条件，通过连续的现象学还原，胡塞尔最终走向了先验唯心主义。相反，海德格尔认为，“此在”不是先验的主体性或一束意识流，并非现成的主体或客体，不能作为一个业已发生的存在者被我们所理解。他竭力避免从“主体的我”这一角度切入。按照张祥龙先生的解释，海德格尔利用“此在”既保持了“主体”指示出的人的关键性的存在论地位，又清除掉了人性观中的主体主义，“此在”就是诠释学和现象学化了的人本身。[^(\[37\])](#chapter005.html#m37)我们可以看到，不论是胡塞尔的先验唯心立场（作为意识）还是海德格尔的存在论立场（作为一种生存现象），“此在”都不能被自然化，因为它不是自然要素的综合。


    第三，从方法论的维度看，“此在”的自然化问题同时也是一个方法论问题，也就是说我们是否能够以一般的科学方法对“此在”概念本身进行分析和阐明。一种强立场的方法论自然主义将自然主义视为一种元哲学，主张哲学研究（包括认识论、伦理学、形而上学）应当采用，或者至少与自然科学的方法（比如实证试验、概念的操作化等等）及其证明标准［如简约性（parsimony）、简明性（simplicity）、预测力（predictive
    power）以及结果的可重复性（reproducibility）］保持一致。[^(\[38\])](#chapter005.html#m38)强立场的方法论自然主义要求保持哲学与自然科学在方法上的连续性，暗含着取消哲学在方法论领域内的自主性的危险。由于这一立场过于强硬，不会为大多数人所接受，因而我们在这里主要关注方法论自然主义的较弱立场：如果X是某一自然实体或属性，那么研究它的最恰当方法就是与自然科学的研究方法相融贯或连续。[^(\[39\])](#chapter005.html#m39)承认和接受方法论自然主义需要拒斥本体论自然主义，只有在这一前提下，前者才能作为一种理论立场被我们解读。如果我们接纳了自然主义的本体论承诺，就意味着消除了使方法论自然主义得以成立的约束条件，即命题的适用范围不是哲学中的全部话语和对象，而是那些被认为是自然实体或属性的对象。


    笔者认为，海德格尔存在论哲学语境中的“此在”与这种较为和缓的方法论自然主义并不兼容。关于人的活生生的身体（lived body）和心智，我们赞成弱的方法论自然主义的介入，因为它们可以被看作具有自然属性的事物，甚至还有专门研究身体与心智的自然科学（胡塞尔也设想了讨论身体的躯体学）。对于“此在”而言，它既不适合于“无身”的描述，不能看作脱离身体的先验主体，同时也非心智寓于肉身的心身统一体。不同于自然科学的研究方法，海德格尔是利用现象学方法来应对“此在”这一研究对象的，“此在”并非对“人”这个名称的一个随随便便的替换，而是对一种存在方式的特别限定。[^(\[40\])](#chapter005.html#m40)在他看来，身体首先必须作为人在世界中存在的根本方式而被我们把握，它不是放置心智的容器，“此在”因之也可被视为一种身体式的存在。海德格尔反对以传统的方式对“此在”展开说明，所以他一直在强调自己不是在作人类学研究，与其他人不同，他认为诠释学才是研究“此在”的正确、恰当的方法。这一方法不是为了描述某个处于历史或文化情境中的具体个人，而是“为我们摆明我们的自我解释着的存在方式之普遍的、跨文化的、超历史的结构”，[^(\[41\])](#chapter005.html#m41)对于海德格尔来说，“此在”的自然化就是对“此在”本身之领会的误解，我们对“此在”的探究不等于以规则和程式将诸多属性、因素和特征关联起来，如何通达“此在”涉及对存在的理解，而这种理解不是纯粹的认知和心理过程。也就是说，这种理解不能通过自然科学的实验方法还原为某一较为完备的、并被某一主体所有的科学信念系统。此外，每一方法都有它所要实现的目标，自然化方法论的意图是将“此在”本身科学化，从而与认知科学的概念体系相容。这样造成的后果是使“此在”有其名而无其实，“此在”面对的存在问题在自然科学的视域中被忽视了，更不用说探讨和解决，他成了具有经验内容并奠基于科学的认知机制的认知主体，这背离了海德格尔的原意。


    综上所述，我们从本体论、认识论和方法论三个维度讨论了自然化“此在”成立的可能性，结果表明将“此在”自然化为适用认知科学语境的概念面临着不小的困难。不论立场的强或弱，借用自然科学的理论来研究“此在”，甚至形成一套描述“此在”的科学机制，这样的做法始终会更迭“此在”原有的生存论意义以及他作为追问存在问题的特殊存在者的存在论地位，“此在”的自然化可能只是如同水中月镜中花一样的幻象。


    ## 三 “自然化此在”只是一个“幻象”


    在惠勒看来，一个人在持有科学的实在论立场的同时赞同海德格尔的哲学观点其实并不矛盾。[^(\[42\])](#chapter005.html#m42)海德格尔并不反对科学本身，他反对的是一种以朴素的眼光看待世界和存在者的理论态度，任何学科都必须在对存在有所理解的前提，即在一个“生物、社会和文化信念和实践的既定背景”[^(\[43\])](#chapter005.html#m43)下展开。惠勒的目的在于寻求建立一门新的“海德格尔式认知科学”，将海德格尔的某些哲学主张纳入自然主义的解释框架当中，实现这一目标的关键点在于如何以认知科学的概念术语描述和确定“此在”，如何在认知科学中为“此在”寻求一个恰当的位置。从某种意义上说，对人类认知的考察与研究既需要朝外转向自然主义的因果解释，也需要朝内转向对个人经验的内省描述。丘奇兰德（Patricia
    S.Churchland）坚定地认为我们的个体经验和认识是错误的，按照他的观点，我们在日常生活中应该诉诸大脑和神经状态而非经验（但是人们不太可能随身携带着仪器对自己进行检验，这听起来有点匪夷所思而且没有必要）。同样地，我们不能把对认知的理解束缚于某种科学或哲学的解释，而应当力图融合两者之间的裂痕，寻求它们在解释上的统一。人（“此在”）恰好处在一个交叉点上，若要成功地构建一门真正的“海德格尔式认知科学”，“此在”的自然化是重要的一环。所谓自然化则是运用认知科学的概念来说明“此在”，说明他在认知科学领域中具有的本体论地位。胡塞尔先前指出，“由于自然主义想将哲学建立在严格科学的基础上，并且想将哲学作为严格的科学构建起来，而它看起来又显得完全不可信，因此，它的方法目的本身也就显得不可信”。[^(\[44\])](#chapter005.html#m44)需要明确的是，胡塞尔并不反对自然科学解释，他反对的是统摄一切的自然主义解释范式，有关意识、意向性本质的描述只能是现象学的任务，自然主义的经验分析是现象学排除的对象。从这种意义上看，“此在”的自然化似乎违背了现象学最基本的原则和信条。


    在前述中我们厘清了认知科学视域下“此在”的基本内涵。按照海德格尔的说法，“此在”首先不能被描述为一个意识主体，“我们应当指出，迄今为止以‘此在’为目标的提问与探索虽然在事实方面大有收效，但错失了真正的哲学问题，而只要它们坚持这样错失哲学问题，就不可要求它们竟能够去成就它们根本上为之努力的事业”。[^(\[45\])](#chapter005.html#m45)海德格尔就是要将关于“此在”的生存论分析同心理学、生物学以及人类学区分开来，在他看来，学科之间的分立决定了它们只能独立地把“此在”的某一方面作为自己的课题加以研究和解决，因而未能指向“整个人的存在”。相较而言，自然主义将解释限制在了物理事件和物理对象的范围内，对自然主义来说，任何不能依照物理过程加以解释的东西都是神秘的，需要被解释和可以被解释的一切东西尽在自然之中。若依照自然主义的信念来理解，“此在”和其他事物一样，是服从严格的自然法则（因果律）的时间—空间存在者，是一个在世界中实在地发生着的实体。即便是心理现象也是依附于物理自然的一个变体，是“平行的伴随物”，任何东西都明白无误地受严格的自然法则的支配。[^(\[46\])](#chapter005.html#m46)

    '
  trans: '


    在拉特克利夫看来，没有理由相信经验科学所采用的认知实践的偶然集合足以完全地揭示世界中的一切对象。现成在手的认知模式对上手活动作了抽象化的处理，它剥离了上手活动本身具有的某些特征与意义，正是上手活动使得人们产生了与世界之间的归属关联，但认知科学没有能够充分说明这一点（至少在海德格尔看来是这样的）。认知科学在某种程度上避开了海德格尔哲学关注的研究域，它不能被用来解释人类“拥有世界”这一基本的存在形式，而这也正是“此在”的核心特征之一。


    第二，“此在”与其他动物、植物以及其他物质性的东西（如石头）不同，区别在于“此在”能够“拥有世界”，而“拥有世界”表明“此在”不是基于“刺激—反应”，抑或是“感知—表征—决策—行动”的一般模式，[^(\[26\])](#chapter005.html#m26)而是具有了更为强烈的主动意味。蚂蚁等非“此在”的其他存在者只是“拥有环境”，处于一个被严格限定的特定范围，“此在”与这些存在者之间的区别不在于他的行动反应更灵活、更具适应性，而是“此在”本身不会像动物一样限于固定的环境当中，世界会随着“此在”生存之可能性而延伸或收缩。也就是说，“此在”置身于一个由有意义的可能性形成的场域，并且拥抱着可能性。海德格尔说道：“人不仅被认作世界的一部分，在世界中出现着，共同建构着世界，而且人与世界相对而立。”[^(\[27\])](#chapter005.html#m27)相对而立是人的主动选择，正如马克思所指出的，人作为实践和认识的主体，始终在不断地认识世界和改造世界，在海德格尔的视域中“此在”就是对世界的一种“拥有”。拉特克利夫认为，人与其他有机体之间存在三个根本差别：①（其他有机体）对有限刺激的僵化反应；②（人）具有灵活的反应形式，可以预测一系列可能性；③（人）能够将可能性理解为可能性。[^(\[28\])](#chapter005.html#m28)在他看来，惠勒的“行动导向的表征”（action-oriented
    representation）只是②的复杂版本，没有能够说明为什么可能性是人与世界相关联的根本途径，而这才是人们理解世界和自身与世界关系的独特之处。


    概言之，拉特克利夫认为，海德格尔的方法从任何意义上讲都不是自然主义的，将“此在”自然化归根结底是对“此在”作了现成性的误读，按照他的理解，上手活动与现成性的科学描述之间并不是融贯的，有机体—环境灵活地耦合也不是“海德格尔式”的。随着认知科学的不断发展和进步，未来或许能够完满地描述和解释人的全部经验与行动，但这不是存在论现象学的目标。如果海德格尔的观点是正确的，那么“拥有世界”是认知科学永远无法抵达的彼岸，不管我们对人类认知能力的解释如何连贯。海德格尔可能并不会让我们放弃全部的认知科学，但它同生物学、人类学等实证学科一样，定位于事实的状况，而忽视了“此在”向自身境遇的可能筹划。正如拉特克利夫所言，一门关于“此在”的认知科学就如同通过画一幅精美的图像来做心脏移植手术，或者通过思量
    289 和 47624 的美学特质来进行加法运算一样，属实是拙劣的设想了。[^(\[29\])](#chapter005.html#m29)


    ## （四）“此在”自然化的三种维度及其可能性


    什么是自然主义，在不同的语境当中这一术语具有不同的含义，我们在这里将自然主义主要区分为三种形式，即本体论的自然主义、认识论的自然主义以及方法论的自然主义，因此，自然化的具体方式取决于对象所属之具体范畴，现象学的自然化也分为本体论、认识论和方法论上的自然化。[^(\[30\])](#chapter005.html#m30)每一种自然化的形式是不同的，我们需要分析从三个维度将“此在”自然化的可能性，从而更为全面地考察和把握“此在”自然化的问题。


    第一，从本体论的维度看，本体论的自然化现象学直接承自本体论的自然主义，后者主张事物构成的一元论，每一事物的构成要素和属性都是自然的。本体论方面的自然化似乎是自然化现象学的核心诉求，如果可能，便可以从根本上弥合因果描述—现象学描述、物理属性—现象属性的“解释鸿沟”。从这种意义上说，“此在”在本体论意义上自然化的必要条件是将其看作某一自然人，人的意识不是什么神秘的“个人体验”，而是具有自然属性的自然物（大脑包含的神经过程），以此来表明“此在”同其他存在者一样是以实存的方式被我们把握。然而，这一理解遮蔽了“此在”同其他存在者经上手活动而建立的指引关系，而上手活动也就是一种实践活动。在海德格尔眼中，“此在”更多的是一种实践性而非认知性的存在者，它的首要存在方式不是认知，而是在世界中的上手操劳，操劳活动蕴含着人之存在的源始意义，这种意义具有不可还原的特征。相较而言，自然化现象学的方法是将现象学分析的结果转化为清楚明白的科学语言（比如数学），任何一种现象学描述只有在融入自然科学之解释框架的意义上才能自然化，前提是这种描述可以被形式严谨的数学语言代替，罗伊等人认为，数学化是自然化的关键手段，[^(\[31\])](#chapter005.html#m31)而数学化在某种程度上可以看作一种还原类型。例如，马尔巴赫便尝试建立一种形式语言描述现象学的第一人称报告，将现象性的个人描述符号化，构成能够被主体间共享的意义。从另一角度看，类似的现象学符号抛却了经验的内容，它专注于经验的形式结构，数学作为中立的、形式化的工具能够被大多数人理解和接受，而且数学理论能够有效描述“连续”与“离散”的动态系统，并且已经为人类心智提供了一种解释框架，比如戈尔德等对认知的动力学分析。因此，足够复杂、精密的数学可以促进现象学材料与自然科学领域的数据向一种普遍语言转化，[^(\[32\])](#chapter005.html#m32)自然化“此在”的理想形式如图
    4-1 所示。


    ![](img/b0000001000000200000000000018001.jpg)


    图 4-1 自然化“此在”的理想形式


    资料来源：笔者自制。


    然而，从“此在”的构成性上说，在世存在是避绕不开的问题，“此在”从本质上说就是在世界之中存在。这不是指两个客体在空间中并列，抑或客体在空间内的物理联系，“既不是指客体的存留存在，也不是指主体与客体的关系”，[^(\[33\])](#chapter005.html#m33)它是“此在”的基本结构。在海德格尔看来，存在于世的不是孤立的、绝对的“先验自我（意识）”，而是诸多个体的生存活动。惠勒对“此在”在世的生存结构作了经验性的描述，在他看来，在世存在意味着人类主体是以具身的方式嵌入科学描述的世界之中。然而，这样的描述方式忽视了“此在”在世界之中的存在方式，也就是忧虑（Sorge），更忽略了“此在”最本质的特征——向死而在。在世存在给“此在”带来了“畏”这一基本的情绪体验，不是对其他存在者的情绪，而是在被抛入世界后感受到的不确定性，它意味着“此在”之生存的结构可能性。


    概言之，如果站在海德格尔的立场，“此在”的存在根本不是现成存在，形式化的对象是现成的存在物。当我们讨论自然化，尤其是以数学方法形式化“此在”时，我们便失去了对“此在”进行适当的生存论分析的可能性。海德格尔已经明确表明了“此在”概念根本不同于一切旧有的、关于人的传统观念，人的认知与思维能力不是他论述的主题，对他而言，重要的是对存在的理解。从本体论的维度看，“此在”是将存在问题扛在肩上前行的特殊存在者，它需要在存在论上加以确定，海德格尔不是在作现象学的人类学研究，因而“此在”也不是属于人类学范畴的概念。在我们看来，自然化也是一种对象化、机制化，它将身体与心智统一的人解释为具身—嵌入的智能主体。然而，一个具象的“人”不是“此在”，人体的肉身和心身统一体的自我都不是“此在”，[^(\[34\])](#chapter005.html#m34)自然化的运作需要建立在关于人的因果以及功能层次的理解之上，这无疑是和“此在”的本质定义相矛盾的。因此，从本体论角度谈论“此在”的自然化并不可行。


    第二，从认识论的维度看，自然主义主张，认识论的证明和解释是与自然科学相伴随的持续过程，科学的方法是我们获得知识的唯一方法，[^(\[35\])](#chapter005.html#m35)是我们认识事物和对象唯一可靠的途径和手段。自然主义的认识论强调经验知识的唯一合法性与有效性，强调知识应当同自然的事物、属性、法则以及规律相关。反映在现象学上，表现为三种自然化路径的现象学：罗伊、马尔巴赫等人提出的形式化的现象学（formalized
    Phenomenology）；瓦雷拉和汤普森等人提出的神经现象学（Neurophenomenology）以及加拉格尔等人提出的前置现象学（front-loaded
    Phenomenology）。后两种形式是在基本保留现象学的材料、方法和洞见的前提下将现象学与认知科学结合，现象学主动地融合进技术和实验方法，现象学与认知科学通过相互引导将彼此关联在一起。它们都力图沟通现象学材料和神经生理学材料，前者通过第一人称的内省报告获得，后者则借助于功能核磁共振成像（fMRI）等实验，其共同目标是通过将详细的现象学研究形式和神经科学研究的实验方案相结合，生成新的数据资料，以获得关于人的自身体验和大脑神经过程复杂关系的理解和解释。


    我们认为，从认识论维度讨论“此在”的自然化涉及我们如何认识“此在”的问题，我们看到，自然化现象学的一般方式是利用了第一人称的现象学方法，将人作为自身体验的报告者与观察者，“此在”成为第一人称视角的体验主体。胡塞尔否认现象学语境下的意识形态或结构同神经科学语境下的自然的因果形式或结构之间具有某种类型同一，“意识的综合完全不同于自然要素的外部组合……而是关于意识生活的本质，而意识生活包含在一个意向的交织、动机，以及通过意义的相互蕴含，在其形式和原则上都与物理世界的方式毫不雷同”。[^(\[36\])](#chapter005.html#m36)他将一切事物的有效性，甚至世界的存在与否都置于先验主体内，先验自我成为经验何以可能的必要条件，通过连续的现象学还原，胡塞尔最终走向了先验唯心主义。相反，海德格尔认为，“此在”不是先验的主体性或一束意识流，并非现成的主体或客体，不能作为一个业已发生的存在者被我们所理解。他竭力避免从“主体的我”这一角度切入。按照张祥龙先生的解释，海德格尔利用“此在”既保持了“主体”指示出的人的关键性的存在论地位，又清除掉了人性观中的主体主义，“此在”就是诠释学和现象学化了的人本身。[^(\[37\])](#chapter005.html#m37)我们可以看到，不论是胡塞尔的先验唯心立场（作为意识）还是海德格尔的存在论立场（作为一种生存现象），“此在”都不能被自然化，因为它不是自然要素的综合。


    第三，从方法论的维度看，“此在”的自然化问题同时也是一个方法论问题，也就是说我们是否能够以一般的科学方法对“此在”概念本身进行分析和阐明。一种强立场的方法论自然主义将自然主义视为一种元哲学，主张哲学研究（包括认识论、伦理学、形而上学）应当采用，或者至少与自然科学的方法（比如实证试验、概念的操作化等等）及其证明标准［如简约性（parsimony）、简明性（simplicity）、预测力（predictive
    power）以及结果的可重复性（reproducibility）］保持一致。[^(\[38\])](#chapter005.html#m38)强立场的方法论自然主义要求保持哲学与自然科学在方法上的连续性，暗含着取消哲学在方法论领域内的自主性的危险。由于这一立场过于强硬，不会为大多数人所接受，因而我们在这里主要关注方法论自然主义的较弱立场：如果
    X 是某一自然实体或属性，那么研究它的最恰当方法就是与自然科学的研究方法相融贯或连续。[^(\[39\])](#chapter005.html#m39)承认和接受方法论自然主义需要拒斥本体论自然主义，只有在这一前提下，前者才能作为一种理论立场被我们解读。如果我们接纳了自然主义的本体论承诺，就意味着消除了使方法论自然主义得以成立的约束条件，即命题的适用范围不是哲学中的全部话语和对象，而是那些被认为是自然实体或属性的对象。


    笔者认为，海德格尔存在论哲学语境中的“此在”与这种较为和缓的方法论自然主义并不兼容。关于人的活生生的身体（lived body）和心智，我们赞成弱的方法论自然主义的介入，因为它们可以被看作具有自然属性的事物，甚至还有专门研究身体与心智的自然科学（胡塞尔也设想了讨论身体的躯体学）。对于“此在”而言，它既不适合于“无身”的描述，不能看作脱离身体的先验主体，同时也非心智寓于肉身的心身统一体。不同于自然科学的研究方法，海德格尔是利用现象学方法来应对“此在”这一研究对象的，“此在”并非对“人”这个名称的一个随随便便的替换，而是对一种存在方式的特别限定。[^(\[40\])](#chapter005.html#m40)在他看来，身体首先必须作为人在世界中存在的根本方式而被我们把握，它不是放置心智的容器，“此在”因之也可被视为一种身体式的存在。海德格尔反对以传统的方式对“此在”展开说明，所以他一直在强调自己不是在作人类学研究，与其他人不同，他认为诠释学才是研究“此在”的正确、恰当的方法。这一方法不是为了描述某个处于历史或文化情境中的具体个人，而是“为我们摆明我们的自我解释着的存在方式之普遍的、跨文化的、超历史的结构”，[^(\[41\])](#chapter005.html#m41)对于海德格尔来说，“此在”的自然化就是对“此在”本身之领会的误解，我们对“此在”的探究不等于以规则和程式将诸多属性、因素和特征关联起来，如何通达“此在”涉及对存在的理解，而这种理解不是纯粹的认知和心理过程。也就是说，这种理解不能通过自然科学的实验方法还原为某一较为完备的、并被某一主体所有的科学信念系统。此外，每一方法都有它所要实现的目标，自然化方法论的意图是将“此在”本身科学化，从而与认知科学的概念体系相容。这样造成的后果是使“此在”有其名而无其实，“此在”面对的存在问题在自然科学的视域中被忽视了，更不用说探讨和解决，他成了具有经验内容并奠基于科学的认知机制的认知主体，这背离了海德格尔的原意。


    综上所述，我们从本体论、认识论和方法论三个维度讨论了自然化“此在”成立的可能性，结果表明将“此在”自然化为适用认知科学语境的概念面临着不小的困难。不论立场的强或弱，借用自然科学的理论来研究“此在”，甚至形成一套描述“此在”的科学机制，这样的做法始终会更迭“此在”原有的生存论意义以及他作为追问存在问题的特殊存在者的存在论地位，“此在”的自然化可能只是如同水中月镜中花一样的幻象。


    ## 三 “自然化此在”只是一个“幻象”


    在惠勒看来，一个人在持有科学的实在论立场的同时赞同海德格尔的哲学观点其实并不矛盾。[^(\[42\])](#chapter005.html#m42)海德格尔并不反对科学本身，他反对的是一种以朴素的眼光看待世界和存在者的理论态度，任何学科都必须在对存在有所理解的前提，即在一个“生物、社会和文化信念和实践的既定背景”[^(\[43\])](#chapter005.html#m43)下展开。惠勒的目的在于寻求建立一门新的“海德格尔式认知科学”，将海德格尔的某些哲学主张纳入自然主义的解释框架当中，实现这一目标的关键点在于如何以认知科学的概念术语描述和确定“此在”，如何在认知科学中为“此在”寻求一个恰当的位置。从某种意义上说，对人类认知的考察与研究既需要朝外转向自然主义的因果解释，也需要朝内转向对个人经验的内省描述。丘奇兰德（Patricia
    S.Churchland）坚定地认为我们的个体经验和认识是错误的，按照他的观点，我们在日常生活中应该诉诸大脑和神经状态而非经验（但是人们不太可能随身携带着仪器对自己进行检验，这听起来有点匪夷所思而且没有必要）。同样地，我们不能把对认知的理解束缚于某种科学或哲学的解释，而应当力图融合两者之间的裂痕，寻求它们在解释上的统一。人（“此在”）恰好处在一个交叉点上，若要成功地构建一门真正的“海德格尔式认知科学”，“此在”的自然化是重要的一环。所谓自然化则是运用认知科学的概念来说明“此在”，说明他在认知科学领域中具有的本体论地位。胡塞尔先前指出，“由于自然主义想将哲学建立在严格科学的基础上，并且想将哲学作为严格的科学构建起来，而它看起来又显得完全不可信，因此，它的方法目的本身也就显得不可信”。[^(\[44\])](#chapter005.html#m44)需要明确的是，胡塞尔并不反对自然科学解释，他反对的是统摄一切的自然主义解释范式，有关意识、意向性本质的描述只能是现象学的任务，自然主义的经验分析是现象学排除的对象。从这种意义上看，“此在”的自然化似乎违背了现象学最基本的原则和信条。


    在前述中我们厘清了认知科学视域下“此在”的基本内涵。按照海德格尔的说法，“此在”首先不能被描述为一个意识主体，“我们应当指出，迄今为止以‘此在’为目标的提问与探索虽然在事实方面大有收效，但错失了真正的哲学问题，而只要它们坚持这样错失哲学问题，就不可要求它们竟能够去成就它们根本上为之努力的事业”。[^(\[45\])](#chapter005.html#m45)海德格尔就是要将关于“此在”的生存论分析同心理学、生物学以及人类学区分开来，在他看来，学科之间的分立决定了它们只能独立地把“此在”的某一方面作为自己的课题加以研究和解决，因而未能指向“整个人的存在”。相较而言，自然主义将解释限制在了物理事件和物理对象的范围内，对自然主义来说，任何不能依照物理过程加以解释的东西都是神秘的，需要被解释和可以被解释的一切东西尽在自然之中。若依照自然主义的信念来理解，“此在”和其他事物一样，是服从严格的自然法则（因果律）的时间—空间存在者，是一个在世界中实在地发生着的实体。即便是心理现象也是依附于物理自然的一个变体，是“平行的伴随物”，任何东西都明白无误地受严格的自然法则的支配。[^(\[46\])](#chapter005.html#m46)


