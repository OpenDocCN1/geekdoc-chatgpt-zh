    # 第一章 对认知科学研究纲领的存在论现象学考察


    自 20 世纪 50 年代以来，认知科学领域发生了令人瞠目结舌的发展和变化。以 1956 年达特茅斯会议为起点，认知科学如今已走过了将近七十年的漫漫长路：从基于计算—表征的笛卡尔式第一代认知科学研究纲领，到基于大脑—身体—环境相耦合、以“4E+S”为核心的第二代认知科学，以及包括认知的自然主义和现象学进路。所有这些研究路径与纲领都各自从不同的角度解释、回答了与人类认知与心智相关的一系列重大问题，比如什么是认知，认知的预设和机制是什么，认知与意识、意向性是何关系，心智的本质是什么，心智与脑、身体是什么关系，它们之间的作用机制是什么等诸多问题，产生的研究成果不胜枚举。在这一章，笔者意图对已有的诸多认知科学研究纲领进行梳理，并从海德格尔存在论现象学的视角予以分析，重点在于解蔽这些研究进路的缺陷与不足，并以此为认知的存在论研究进路提供某些有益的借鉴。


    ## 第一节 笛卡尔式认知科学的主要哲学来源


    '
  toc: []
- raw: '在认知科学家和哲学家眼中，认知科学是探索人类的智力如何由物质产生和人脑信息处理的过程的科学，包括从感觉的输入到复杂问题求解，从人类个体到人类社会的智能活动，以及人类智能和机器智能的性质。[^(\[1\])](#chapter002.html#m1)认知科学哲学领域中能够称得上研究范式的只有以笛卡尔的主体哲学为理论基石的认知计算主义，包括认知主义与联结主义。以计算表征为核心，以计算操作过程为基础，笛卡尔式认知科学将心智的内部状态视作抽象的逻辑计算，表征与认知的计算过程都发生在大脑内部，离身认知是最主要的实现形式。产生于20世纪50年代的第一代认知科学研究范式，既经历过如日中天的灿烂与辉煌，也陷入过被群起攻之的困顿与落寞，如今，虽然人们对以“4E+S”认知模型为代表的第二代认知科学纲领大谈特谈，意图消解甚至取代认知计算主义，但这样的努力看起来似乎依然任重而道远，后者依然顽强地存在着，并没有一蹶不振，反而在吸收了前者的一些主张后焕发了新的生机（比如威尔逊的“宽计算主义”）。4E认知正是在批判和吸取认知主义和联结主义的基础上发展起来的，皮之不存，毛将焉附，因此，我们首先要对传统的认知科学研究范式进行梳理和分析。


    ### 一 毕达哥拉斯：“数是万物的本原”


    传统的认知主义和联结主义的本质在于计算，二者在哲学立场上都坚持计算主义，其思想渊源可以追溯至18世纪西欧盛行一时的理性主义哲学，比如霍布斯提出了“推理即计算”。计算的质料是数字和符号，而对“数”的重视和强调则肇始于古希腊时期的毕达哥拉斯学派，对数学富有成效的研究在一定程度上促使他提出了“数是万物的本原”这一哲学思想。毕达哥拉斯贬低了水、火、土、气等具体的物质性元素在构造世界中的作用，更看重世界的构成方式，表明他已经注意到了抽象性思维，并努力地为包括抽象事物和具象事物在内的万物寻求统一的本原。这可能是毕达哥拉斯的学说相较于米利都学说革命性的一点：最终决定事物的行为和性质的因素，不是各种原初物质，而是它们的构成形式。[^(\[2\])](#chapter002.html#m2)他发现了音乐谐音的数学基础，即谐音的音程之间存在比例关系，因此，他假定事物之间关联的实质就是数量关系，而数量关系本身也是人的思想与世界的同构，数也就成为衡量万物的标准和尺度。如果说“数是世界的本原”这一命题同计算主义有什么相似之处的话，在我们看来，则是对于世界的抽象理解。“数”是存在于事物的量的规定性，事物的多样性可以被归为量的统一性，“数”是事物的量的统一的抽象原则。[^(\[3\])](#chapter002.html#m3)数量关系预示了一个理解自然与世界的认识理论，与现代人相比，毕达哥拉斯学派缺少了概念与范畴的工具，但他们依然从现象的杂多中进行了科学的抽象，即便以我们的眼光来看显得有些稚嫩。


    此外，毕达哥拉斯学派关于数与具体事物的关系和认知与联结主义推崇符号之间也有一些相似之处：前者认为万物都是在模仿（分有）数，后者试图将所有对象化约为逻辑符号，可以看作前者的逆向。数与符号成了事物的范型，亚里士多德将毕达哥拉斯的“数”既归于形式因，又归于质料因。作为形式因的“数”不包含形体，是抽象的，毕达哥拉斯希望从理想的“数”出发，从完满的几何关系推出构造世界的规则。


    ### 二 笛卡尔：“心身二分”


    在当代，认知科学家和哲学家会受到笛卡尔哲学思想的影响与渗透，认为认知就是心智或者说是心智的表现活动，是与物理、化学等机械运动相对立的、具有现象特质的心理和意识过程，认知活动与身体活动被截然分开了。第一代认知科学之所以被人们称为笛卡尔式的认知科学，是因为这一科学研究纲领的哲学基础就是笛卡尔的理性主义哲学。笛卡尔将心智与物质区分为两种独立的实体，二者的属性差异之一在于广延，即是否占据以长、宽、高为基准的物理空间。从这种意义上讲，由于身体也占据物理空间，因此其本质是广延，故而属于物质的范畴。心智虽然没有广延，但笛卡尔认为它拥有空间位置。所谓空间也就是指大脑的松果体，人的灵魂就居住在其中，它是联结心智和身体的“枢纽”，是两者交互的“中转站”，负责统摄两者的行动。随着现代医学的发展与进步，人们已然揭开了松果体的神秘面纱，现代解剖学告诉我们，其中并不存在笛卡尔所谓的“灵魂”，松果体的主要作用是通过分泌激素以抑制神经系统。以今人的视角来看，松果体的观点有些幼稚甚至荒谬，但如果我们基于笛卡尔的理论语境便不难理解他的这一看似不合理的做法。由彻底怀疑一切存在得出了“我思故我在”（Cogito
    ergo sum）的哲学命题（这里的“我”不是作为身心统一体的我，而是指独立存在的心智），强调不能怀疑以思维为属性的心智实体的存在，进而论证物质与心智是相互平行、彼此独立的关系。笛卡尔构造出来的清楚明白的“我思”亦确立了心智区别于身体的性质，无论思维的幽灵身在何处，它的基本性质就是自由，[^(\[4\])](#chapter002.html#m4)属于物质范畴的身体则被机械因果律的锁链牢牢禁锢，因而不灭的灵魂（心智）是第一位的，优先于身体，纯粹智性的东西一定优于纯粹物质性的东西。


    第二代认知科学惯常地主张笛卡尔提出的心身二元论为当代的无身认知（认知主义和联结主义）提供了哲学基础，在某种程度上给予了其可行性论证，认为笛卡尔过于重理性（心智）而轻身体。但笛卡尔自始至终都在强调心智与身体的统一性，他明确地说道，“我们不能光说理性灵魂驻扎在人的身体里面，就像舵手住在船上一样，否则就不能使身体肢体得以运动，那是不够的，灵魂必须更加紧密地与身体连接和统一在一起，才能在运动以外还有同我们一样的感情和欲望，这才构成一个真正的人”。[^(\[5\])](#chapter002.html#m5)显而易见，笛卡尔并没有摒弃和抛离身体，相反，他愈发强调和重视人是心智与身体的统一体，而不是单纯的复合，只有这样，人才称得上是完全的实体。在他看来，心智与身体之间并不松散，如果认为二者是舵手与舰船的关系，那么舵手完全可以下船或者换乘别的船只，从这种意义上来说，身体之于心智类似于舰船之于舵手正是第二代认知科学对笛卡尔哲学的理解。然而，我们认为，这样的理解失之偏颇，误解了笛卡尔对心身关系的描述。他自始至终都坚持身心统一体的“人”的观点，并把它看作一个原初的，从而是不可被怀疑的基本概念。[^(\[6\])](#chapter002.html#m6)但是在二者如何实现互动的问题上，笛卡尔始终没有给出令人满意的解决办法，这也为后来的哲学家，如胡塞尔、梅洛-庞蒂以及认知科学家的工作留下了足够的空间。总的来说，笛卡尔从主观上对心智与身体的区分客观地、不经意地为第一代认知科学、计算机科学以及人工智能描绘了某种可行性。


    ### 三 霍布斯：“推理即计算”


    如今，大多数认知科学研究者都将笛卡尔的理性主义哲学传统看作第一代认知科学的研究基础，因而也将其称为笛卡尔式认知科学。但是笛卡尔在著作中从未表达过“认知是可计算的”这一观点，也就是所谓的“计算隐喻”。认知主义和联结主义都将人的认知活动理解为基于规则的符号表征与计算，这是传统认知科学的核心观念之一，而这一思想的来源最早可以追溯至17世纪英国经验主义哲学家托马斯·霍布斯（Thomas
    Hobbes），他明确提出了“推理即计算”的思想，霍布斯和笛卡尔一样是传统认知科学的思想先驱。


    认识论在霍布斯的哲学体系中占有十分重要的地位，他首次将牛顿经典力学原理引入认识论，是近代西方哲学史机械主义认识论最主要的代表之一。霍布斯认为人的认知能力是构成人性的各种自然能力之一，而自然能力又分为两类：肉体能力和心智能力。作为哲学研究对象的后者又可分为“认知能力或概念能力”以及“促动能力”。[^(\[7\])](#chapter002.html#m7)第一种能力可以使人进行判断、推理等理性认识活动，第二种能力则使人产生各种情感的非理性活动。霍布斯认识论的研究重点就是人的认知能力。他认为思维推理的方法是加减计算，霍布斯说道，“所谓推理，我所意指的是计算。而计算或者是要加到一起的许多东西集合成一个总数，或者是求知从一件事物中取走另一件事物后还剩下的东西。因此，推理与加减是一回事……因此，一切推理，都包含在心灵的这两种运作，即加减里面”。[^(\[8\])](#chapter002.html#m8)我们如何对心中的观念进行推理和计算呢？根据霍布斯的观点，当我们远远地看到某个东西，由于距离较远，我们看到的是一个具有广延的形体。因此，首先出现在我们心中的是“物体”的观念，走近时发现这个形体具有理性动物的一切特征，包括言语、动作、表情等，心中随之产生“理性的”观念，这些观念的叠加便构成了“人”的观念，减法与此相反。霍布斯认为不应把这种加减计算限于数学、物理学与几何学领域，一切与推理相关的东西都可以利用这种计算方式，“由此可见，无论哪种事物，只要用得上加减法，就得靠推理。相反，如果用不上加减法，推理也就无从存在”。[^(\[9\])](#chapter002.html#m9)从我们的视角来看，霍布斯的这一思想过于简单浅显，人的认知能力不仅包括推理，还有感觉、知觉、记忆、思维、想象甚至情感等等。仅就推理而言，加减计算也不能涵盖一切推理形式，将推理等同于加减运算表明霍布斯在当时受到了几何学与经典机械力学的深刻影响，因而将人的理性认知活动简单化了，将之完全视作符号化的数量关系运算，抹杀了其他功能，如抽象思辨和具象思维。他提出的“推理即计算”这一原则虽然与计算主义的核心假设相比要简单得多，也未上升到理解人类认知和心智本质的高度，陷入了机械论的思维方式。但在我们看来，霍布斯的这一思想不自觉地成了计算主义的哲学先驱，虽然与图灵的计算概念有着巨大的差别，但就当时的时代背景而言，这已是十分卓越的哲学设想了。


    ### 四 莱布尼兹：“普遍语言”


    一直以来，传统的认知研究范式对于符号尤为重视（因而被称为符号主义），我们认为有可能受到了莱布尼兹的启发。莱布尼兹在他的《神正论》一书中提出了一个雄心勃勃的设想——“普遍语言”：“这种语言是一种用来代替自然语言的人工语言，它通过字母和符号进行逻辑分析与综合，把一般逻辑推理的规则改变为演算规则，以便更精确更敏捷地进行推理。”[^(\[10\])](#chapter002.html#m10)他尝试将数学与逻辑统一起来，建立普遍的符号逻辑，这样做的目的在于为人类认知提供一种统一的表达方式，从而摆脱或者消除长久以来人们在认识论领域中的纠缠与纷争，实现不同语言、民族以及学科之间的有效交流。在莱布尼兹眼里，人虽然在外貌、体质、种族和风俗习惯等方面存在着诸多差异，有些差异甚至是本质性的，但在人类理性层面却存在某种融贯和共通。莱布尼兹认为，符号可以使我们获得更为一般性的、准确的定义和论证过程，理性推理的实质就是符号的演算过程，人们使用符号来指称那些我们所确定知晓的属性或者过程，符号的结构直接反映概念世界甚至实在世界的结构本身。在我们看来，对于理解莱布尼兹的认知观而言，“普遍语言”是不可缺少的部分，认知的目标之一在于获得知识与真理，而要想获取清楚明白且完整的知识，形式语言则是必要的条件和手段。莱布尼兹确信，符号或者文字不仅能够使我们借助形式的符号构造我们的推理、表达我们的思想，而且能够使我们获得从纯粹的心理表征那里得不到的概念和真理。[^(\[11\])](#chapter002.html#m11)符号化的思维方式对于增强人的记忆能力而言是一个相当有用的工具，同时它也是演绎推理的必要组成部分。


    从本质上来说，莱布尼兹的“普遍语言”推崇的是一种符号主义，我们认为它可能包含了莱布尼兹本人的两个期许：一是使人们的推理不依赖于对推理过程中的命题的含义内容的思考，就像计算不依赖于对计算中出现的符号和含义内容的思考一样；[^(\[12\])](#chapter002.html#m12)二是以符号结构为基础的推理过程优于依赖心理表征的推理。莱布尼兹强烈反对笛卡尔的演绎概念，他希望以数学家的方式来解决哲学、逻辑方面的推演问题，操作字符的形式化过程则是实现有效论证的唯一途径，也就是以符号取代概念和图像，依据形式的组合规则构成推理的最佳模式。从这种意义上看，“普遍语言”并不注重心理内容，而是转向以客观的符号标记来表示概念。因此，它的主要功能在于为心灵提供导引，避免它在复杂的定义或概念的链条中迷失，心智在面对概念和推理演绎的复杂性时往往不知所措，同时既可以区分定义，又可以简化推理过程。“所谓方法就是一条为思维服务的导引线，它简便而可靠，跟着这条线就能没有紧张，也没有白费气力，也不怕会出错误，我们的思维就能安全进行，好象希腊神话里那个提修斯执有阿里阿德涅的导引线在迷宫中走路一样。”[^(\[13\])](#chapter002.html#m13)


    总而言之，在莱布尼兹那里，概念作为人类理性的产物，需要借助于符号形式的转向来超越作为知觉和想象力的感知。他已经向人们指明，心智能够在不利用心理内容的情况下对符号进行组合与计算，理解与分析符号不必以分析它的概念意义为前提，将符号承载的意义内容搁置一旁，心智就能够自由地聚焦于抽象、形式的元素。从某种意义上说，“普遍语言”背后折射出来的符号思维为我们表达巨量的数字和图形提供了可能性，而这正是认知主义甚至当下人工智能的主流路线。


    ## 第二节 笛卡尔式认知科学的缺陷与困境


    自20世纪50年代以来，控制论、信息论以及计算机科学等多门学科的蓬勃发展，以及一系列具有开创性的研究成果的发表，例如图灵发表的《论可计算数及其在判定问题中的应用》《计算机器与智能》，麦卡洛克与皮茨发表的《神经活动内在概念的逻辑演算》，纽厄尔与西蒙发表的《作为经验探索的计算机科学：符号和搜索》等，为人工智能以及认知科学的发展开辟了道路，指明了方向，一场轰轰烈烈的研究人类心智的革命呼之欲出。1956年的达特茅斯会议成为人工智能的发端，长期以来，人们都将人工智能视为认知科学的智力内核，并希望这门一般性的智能科学能够对以意向性为基础的各种心理能力甚至生物具有的心智作出完满的解释，“它必须告诉我们，智能是仅仅体现于那些具有大脑般的基本构造（包括由关联细胞组成的网络中的并行处理过程）的系统之中，还是也可以用某种别的方式来实现”。[^(\[14\])](#chapter002.html#m14)西蒙甚至预言，在20年内，机器将做到人所能做到的一切事情。无论是认知主义抑或联结主义都把大脑看作一种计算系统，只关心“它体现出何种函数关系，而不是哪些脑细胞体现出这些关系，或大脑生理机能怎样使这种关系成为可能”。[^(\[15\])](#chapter002.html#m15)因此，尽管联结主义以模拟大脑神经网络来研究人类的认知活动，展现出与认知主义截然不同的工作方式——对信息数据的处理由顺序式的串行转变为并行分布式的处理方式，但从根本上看，二者都是在应用形式规则对符号进行形式操作，这种由神经科学家构造的人工神经元组成的联结网络模型只是对大脑神经活动高度抽象的理想形式，其本质仍然是数字式的信息加工。在我们看来，这样的模型无法在构造上与神经联结实现一一对应，无法在生物学意义上重现神经系统的运作机制，原因之一是大脑的神经元和突触的数量过于庞大，人工神经元的形式模拟并不是保证智能得以涌现的充分条件，且人工神经网络未能展现出人类大脑特有的直觉、顿悟、灵感等突现的智能表现形式，更未能表现出人类认知的情感特征（情感认知）。无论认知主义还是联结主义都只截取了人类认知的一个片段和方面，任何形式的系统都不可能纯粹借助计算而达到对认知的完满理解，而认知主义与联结主义也由于心物和心身二分的理论预设面临着诸多难以解决的困境。


    ### 一 心物二分导致认知与世界的割裂


    在研究人类认知活动与心智本质的道路上，联结主义比认知主义更进了一步。从仿生学的意义上讲，联结主义对认知的研究具有某种整体性，对大脑神经网络联结活动的模拟要比单纯的符号操作更具有优势，它克服了认知主义本身在形式化方面的困难，在认知主义难以应对的快速认知、联想记忆等方面，联结主义展现出了较好的处理能力。认知主义的逻辑规则被联结主义的神经元联结规则取代了，[^(\[16\])](#chapter002.html#m16)但是从计算本质上来说，二者并无不同，它们都把认知活动看作基于规则对符号的转换和计算，认知离不开表征。如果非要找出不同点的话，那就是认知主体与对象（世界）的表征中介由心智转变为人工神经网络，表征方式由符号表征转变为神经网络激活模式的表征，但是强调表征关系依然是认知主义与联结主义的不谋而合之处，不愿意放弃表征体现出两者的基本框架都是基于心物、主客的二元对立。这种做法的后果便是不可避免地将人的身体和环境的影响和作用从人类认知的领域中排除出去了，人的身体并不参与人的认知过程，环境对于人而言是分离的、客观的，心智与身体、环境之间互相分离，这样的立场和观点是第一代认知科学研究纲领面临的理论瓶颈，同时也成为以“4E+S”为核心的第二代认知科学研究纲领批评的重点。具身认知、情境认知、延展认知等都是在批判前者的过程中发展起来的，它们都强调身体和环境在解释人类认知中的积极作用并赋予之重要的地位，而不仅仅将其看作可有可无的附属物。'
  fmt: '

    在认知科学家和哲学家眼中，认知科学是探索人类的智力如何由物质产生和人脑信息处理的过程的科学，包括从感觉的输入到复杂问题求解，从人类个体到人类社会的智能活动，以及人类智能和机器智能的性质。[^(\[1\])](#chapter002.html#m1)认知科学哲学领域中能够称得上研究范式的只有以笛卡尔的主体哲学为理论基石的认知计算主义，包括认知主义与联结主义。以计算表征为核心，以计算操作过程为基础，笛卡尔式认知科学将心智的内部状态视作抽象的逻辑计算，表征与认知的计算过程都发生在大脑内部，离身认知是最主要的实现形式。产生于20世纪50年代的第一代认知科学研究范式，既经历过如日中天的灿烂与辉煌，也陷入过被群起攻之的困顿与落寞，如今，虽然人们对以“4E+S”认知模型为代表的第二代认知科学纲领大谈特谈，意图消解甚至取代认知计算主义，但这样的努力看起来似乎依然任重而道远，后者依然顽强地存在着，并没有一蹶不振，反而在吸收了前者的一些主张后焕发了新的生机（比如威尔逊的“宽计算主义”）。4E认知正是在批判和吸取认知主义和联结主义的基础上发展起来的，皮之不存，毛将焉附，因此，我们首先要对传统的认知科学研究范式进行梳理和分析。


    ## 一 毕达哥拉斯：“数是万物的本原”


    传统的认知主义和联结主义的本质在于计算，二者在哲学立场上都坚持计算主义，其思想渊源可以追溯至18世纪西欧盛行一时的理性主义哲学，比如霍布斯提出了“推理即计算”。计算的质料是数字和符号，而对“数”的重视和强调则肇始于古希腊时期的毕达哥拉斯学派，对数学富有成效的研究在一定程度上促使他提出了“数是万物的本原”这一哲学思想。毕达哥拉斯贬低了水、火、土、气等具体的物质性元素在构造世界中的作用，更看重世界的构成方式，表明他已经注意到了抽象性思维，并努力地为包括抽象事物和具象事物在内的万物寻求统一的本原。这可能是毕达哥拉斯的学说相较于米利都学说革命性的一点：最终决定事物的行为和性质的因素，不是各种原初物质，而是它们的构成形式。[^(\[2\])](#chapter002.html#m2)他发现了音乐谐音的数学基础，即谐音的音程之间存在比例关系，因此，他假定事物之间关联的实质就是数量关系，而数量关系本身也是人的思想与世界的同构，数也就成为衡量万物的标准和尺度。如果说“数是世界的本原”这一命题同计算主义有什么相似之处的话，在我们看来，则是对于世界的抽象理解。“数”是存在于事物的量的规定性，事物的多样性可以被归为量的统一性，“数”是事物的量的统一的抽象原则。[^(\[3\])](#chapter002.html#m3)数量关系预示了一个理解自然与世界的认识理论，与现代人相比，毕达哥拉斯学派缺少了概念与范畴的工具，但他们依然从现象的杂多中进行了科学的抽象，即便以我们的眼光来看显得有些稚嫩。


    此外，毕达哥拉斯学派关于数与具体事物的关系和认知与联结主义推崇符号之间也有一些相似之处：前者认为万物都是在模仿（分有）数，后者试图将所有对象化约为逻辑符号，可以看作前者的逆向。数与符号成了事物的范型，亚里士多德将毕达哥拉斯的“数”既归于形式因，又归于质料因。作为形式因的“数”不包含形体，是抽象的，毕达哥拉斯希望从理想的“数”出发，从完满的几何关系推出构造世界的规则。


    ## 二 笛卡尔：“心身二分”


    在当代，认知科学家和哲学家会受到笛卡尔哲学思想的影响与渗透，认为认知就是心智或者说是心智的表现活动，是与物理、化学等机械运动相对立的、具有现象特质的心理和意识过程，认知活动与身体活动被截然分开了。第一代认知科学之所以被人们称为笛卡尔式的认知科学，是因为这一科学研究纲领的哲学基础就是笛卡尔的理性主义哲学。笛卡尔将心智与物质区分为两种独立的实体，二者的属性差异之一在于广延，即是否占据以长、宽、高为基准的物理空间。从这种意义上讲，由于身体也占据物理空间，因此其本质是广延，故而属于物质的范畴。心智虽然没有广延，但笛卡尔认为它拥有空间位置。所谓空间也就是指大脑的松果体，人的灵魂就居住在其中，它是联结心智和身体的“枢纽”，是两者交互的“中转站”，负责统摄两者的行动。随着现代医学的发展与进步，人们已然揭开了松果体的神秘面纱，现代解剖学告诉我们，其中并不存在笛卡尔所谓的“灵魂”，松果体的主要作用是通过分泌激素以抑制神经系统。以今人的视角来看，松果体的观点有些幼稚甚至荒谬，但如果我们基于笛卡尔的理论语境便不难理解他的这一看似不合理的做法。由彻底怀疑一切存在得出了“我思故我在”（Cogito
    ergo sum）的哲学命题（这里的“我”不是作为身心统一体的我，而是指独立存在的心智），强调不能怀疑以思维为属性的心智实体的存在，进而论证物质与心智是相互平行、彼此独立的关系。笛卡尔构造出来的清楚明白的“我思”亦确立了心智区别于身体的性质，无论思维的幽灵身在何处，它的基本性质就是自由，[^(\[4\])](#chapter002.html#m4)属于物质范畴的身体则被机械因果律的锁链牢牢禁锢，因而不灭的灵魂（心智）是第一位的，优先于身体，纯粹智性的东西一定优于纯粹物质性的东西。


    第二代认知科学惯常地主张笛卡尔提出的心身二元论为当代的无身认知（认知主义和联结主义）提供了哲学基础，在某种程度上给予了其可行性论证，认为笛卡尔过于重理性（心智）而轻身体。但笛卡尔自始至终都在强调心智与身体的统一性，他明确地说道，“我们不能光说理性灵魂驻扎在人的身体里面，就像舵手住在船上一样，否则就不能使身体肢体得以运动，那是不够的，灵魂必须更加紧密地与身体连接和统一在一起，才能在运动以外还有同我们一样的感情和欲望，这才构成一个真正的人”。[^(\[5\])](#chapter002.html#m5)显而易见，笛卡尔并没有摒弃和抛离身体，相反，他愈发强调和重视人是心智与身体的统一体，而不是单纯的复合，只有这样，人才称得上是完全的实体。在他看来，心智与身体之间并不松散，如果认为二者是舵手与舰船的关系，那么舵手完全可以下船或者换乘别的船只，从这种意义上来说，身体之于心智类似于舰船之于舵手正是第二代认知科学对笛卡尔哲学的理解。然而，我们认为，这样的理解失之偏颇，误解了笛卡尔对心身关系的描述。他自始至终都坚持身心统一体的“人”的观点，并把它看作一个原初的，从而是不可被怀疑的基本概念。[^(\[6\])](#chapter002.html#m6)但是在二者如何实现互动的问题上，笛卡尔始终没有给出令人满意的解决办法，这也为后来的哲学家，如胡塞尔、梅洛-庞蒂以及认知科学家的工作留下了足够的空间。总的来说，笛卡尔从主观上对心智与身体的区分客观地、不经意地为第一代认知科学、计算机科学以及人工智能描绘了某种可行性。


    ## 三 霍布斯：“推理即计算”


    如今，大多数认知科学研究者都将笛卡尔的理性主义哲学传统看作第一代认知科学的研究基础，因而也将其称为笛卡尔式认知科学。但是笛卡尔在著作中从未表达过“认知是可计算的”这一观点，也就是所谓的“计算隐喻”。认知主义和联结主义都将人的认知活动理解为基于规则的符号表征与计算，这是传统认知科学的核心观念之一，而这一思想的来源最早可以追溯至17世纪英国经验主义哲学家托马斯·霍布斯（Thomas
    Hobbes），他明确提出了“推理即计算”的思想，霍布斯和笛卡尔一样是传统认知科学的思想先驱。


    认识论在霍布斯的哲学体系中占有十分重要的地位，他首次将牛顿经典力学原理引入认识论，是近代西方哲学史机械主义认识论最主要的代表之一。霍布斯认为人的认知能力是构成人性的各种自然能力之一，而自然能力又分为两类：肉体能力和心智能力。作为哲学研究对象的后者又可分为“认知能力或概念能力”以及“促动能力”。[^(\[7\])](#chapter002.html#m7)第一种能力可以使人进行判断、推理等理性认识活动，第二种能力则使人产生各种情感的非理性活动。霍布斯认识论的研究重点就是人的认知能力。他认为思维推理的方法是加减计算，霍布斯说道，“所谓推理，我所意指的是计算。而计算或者是要加到一起的许多东西集合成一个总数，或者是求知从一件事物中取走另一件事物后还剩下的东西。因此，推理与加减是一回事……因此，一切推理，都包含在心灵的这两种运作，即加减里面”。[^(\[8\])](#chapter002.html#m8)我们如何对心中的观念进行推理和计算呢？根据霍布斯的观点，当我们远远地看到某个东西，由于距离较远，我们看到的是一个具有广延的形体。因此，首先出现在我们心中的是“物体”的观念，走近时发现这个形体具有理性动物的一切特征，包括言语、动作、表情等，心中随之产生“理性的”观念，这些观念的叠加便构成了“人”的观念，减法与此相反。霍布斯认为不应把这种加减计算限于数学、物理学与几何学领域，一切与推理相关的东西都可以利用这种计算方式，“由此可见，无论哪种事物，只要用得上加减法，就得靠推理。相反，如果用不上加减法，推理也就无从存在”。[^(\[9\])](#chapter002.html#m9)从我们的视角来看，霍布斯的这一思想过于简单浅显，人的认知能力不仅包括推理，还有感觉、知觉、记忆、思维、想象甚至情感等等。仅就推理而言，加减计算也不能涵盖一切推理形式，将推理等同于加减运算表明霍布斯在当时受到了几何学与经典机械力学的深刻影响，因而将人的理性认知活动简单化了，将之完全视作符号化的数量关系运算，抹杀了其他功能，如抽象思辨和具象思维。他提出的“推理即计算”这一原则虽然与计算主义的核心假设相比要简单得多，也未上升到理解人类认知和心智本质的高度，陷入了机械论的思维方式。但在我们看来，霍布斯的这一思想不自觉地成了计算主义的哲学先驱，虽然与图灵的计算概念有着巨大的差别，但就当时的时代背景而言，这已是十分卓越的哲学设想了。


    ## 四 莱布尼兹：“普遍语言”


    一直以来，传统的认知研究范式对于符号尤为重视（因而被称为符号主义），我们认为有可能受到了莱布尼兹的启发。莱布尼兹在他的《神正论》一书中提出了一个雄心勃勃的设想——“普遍语言”：“这种语言是一种用来代替自然语言的人工语言，它通过字母和符号进行逻辑分析与综合，把一般逻辑推理的规则改变为演算规则，以便更精确更敏捷地进行推理。”[^(\[10\])](#chapter002.html#m10)他尝试将数学与逻辑统一起来，建立普遍的符号逻辑，这样做的目的在于为人类认知提供一种统一的表达方式，从而摆脱或者消除长久以来人们在认识论领域中的纠缠与纷争，实现不同语言、民族以及学科之间的有效交流。在莱布尼兹眼里，人虽然在外貌、体质、种族和风俗习惯等方面存在着诸多差异，有些差异甚至是本质性的，但在人类理性层面却存在某种融贯和共通。莱布尼兹认为，符号可以使我们获得更为一般性的、准确的定义和论证过程，理性推理的实质就是符号的演算过程，人们使用符号来指称那些我们所确定知晓的属性或者过程，符号的结构直接反映概念世界甚至实在世界的结构本身。在我们看来，对于理解莱布尼兹的认知观而言，“普遍语言”是不可缺少的部分，认知的目标之一在于获得知识与真理，而要想获取清楚明白且完整的知识，形式语言则是必要的条件和手段。莱布尼兹确信，符号或者文字不仅能够使我们借助形式的符号构造我们的推理、表达我们的思想，而且能够使我们获得从纯粹的心理表征那里得不到的概念和真理。[^(\[11\])](#chapter002.html#m11)符号化的思维方式对于增强人的记忆能力而言是一个相当有用的工具，同时它也是演绎推理的必要组成部分。


    从本质上来说，莱布尼兹的“普遍语言”推崇的是一种符号主义，我们认为它可能包含了莱布尼兹本人的两个期许：一是使人们的推理不依赖于对推理过程中的命题的含义内容的思考，就像计算不依赖于对计算中出现的符号和含义内容的思考一样；[^(\[12\])](#chapter002.html#m12)二是以符号结构为基础的推理过程优于依赖心理表征的推理。莱布尼兹强烈反对笛卡尔的演绎概念，他希望以数学家的方式来解决哲学、逻辑方面的推演问题，操作字符的形式化过程则是实现有效论证的唯一途径，也就是以符号取代概念和图像，依据形式的组合规则构成推理的最佳模式。从这种意义上看，“普遍语言”并不注重心理内容，而是转向以客观的符号标记来表示概念。因此，它的主要功能在于为心灵提供导引，避免它在复杂的定义或概念的链条中迷失，心智在面对概念和推理演绎的复杂性时往往不知所措，同时既可以区分定义，又可以简化推理过程。“所谓方法就是一条为思维服务的导引线，它简便而可靠，跟着这条线就能没有紧张，也没有白费气力，也不怕会出错误，我们的思维就能安全进行，好象希腊神话里那个提修斯执有阿里阿德涅的导引线在迷宫中走路一样。”[^(\[13\])](#chapter002.html#m13)


    总而言之，在莱布尼兹那里，概念作为人类理性的产物，需要借助于符号形式的转向来超越作为知觉和想象力的感知。他已经向人们指明，心智能够在不利用心理内容的情况下对符号进行组合与计算，理解与分析符号不必以分析它的概念意义为前提，将符号承载的意义内容搁置一旁，心智就能够自由地聚焦于抽象、形式的元素。从某种意义上说，“普遍语言”背后折射出来的符号思维为我们表达巨量的数字和图形提供了可能性，而这正是认知主义甚至当下人工智能的主流路线。


    ## 第二节 笛卡尔式认知科学的缺陷与困境


    自20世纪50年代以来，控制论、信息论以及计算机科学等多门学科的蓬勃发展，以及一系列具有开创性的研究成果的发表，例如图灵发表的《论可计算数及其在判定问题中的应用》《计算机器与智能》，麦卡洛克与皮茨发表的《神经活动内在概念的逻辑演算》，纽厄尔与西蒙发表的《作为经验探索的计算机科学：符号和搜索》等，为人工智能以及认知科学的发展开辟了道路，指明了方向，一场轰轰烈烈的研究人类心智的革命呼之欲出。1956年的达特茅斯会议成为人工智能的发端，长期以来，人们都将人工智能视为认知科学的智力内核，并希望这门一般性的智能科学能够对以意向性为基础的各种心理能力甚至生物具有的心智作出完满的解释，“它必须告诉我们，智能是仅仅体现于那些具有大脑般的基本构造（包括由关联细胞组成的网络中的并行处理过程）的系统之中，还是也可以用某种别的方式来实现”。[^(\[14\])](#chapter002.html#m14)西蒙甚至预言，在20年内，机器将做到人所能做到的一切事情。无论是认知主义抑或联结主义都把大脑看作一种计算系统，只关心“它体现出何种函数关系，而不是哪些脑细胞体现出这些关系，或大脑生理机能怎样使这种关系成为可能”。[^(\[15\])](#chapter002.html#m15)因此，尽管联结主义以模拟大脑神经网络来研究人类的认知活动，展现出与认知主义截然不同的工作方式——对信息数据的处理由顺序式的串行转变为并行分布式的处理方式，但从根本上看，二者都是在应用形式规则对符号进行形式操作，这种由神经科学家构造的人工神经元组成的联结网络模型只是对大脑神经活动高度抽象的理想形式，其本质仍然是数字式的信息加工。在我们看来，这样的模型无法在构造上与神经联结实现一一对应，无法在生物学意义上重现神经系统的运作机制，原因之一是大脑的神经元和突触的数量过于庞大，人工神经元的形式模拟并不是保证智能得以涌现的充分条件，且人工神经网络未能展现出人类大脑特有的直觉、顿悟、灵感等突现的智能表现形式，更未能表现出人类认知的情感特征（情感认知）。无论认知主义还是联结主义都只截取了人类认知的一个片段和方面，任何形式的系统都不可能纯粹借助计算而达到对认知的完满理解，而认知主义与联结主义也由于心物和心身二分的理论预设面临着诸多难以解决的困境。


    ### 一 心物二分导致认知与世界的割裂


    在研究人类认知活动与心智本质的道路上，联结主义比认知主义更进了一步。从仿生学的意义上讲，联结主义对认知的研究具有某种整体性，对大脑神经网络联结活动的模拟要比单纯的符号操作更具有优势，它克服了认知主义本身在形式化方面的困难，在认知主义难以应对的快速认知、联想记忆等方面，联结主义展现出了较好的处理能力。认知主义的逻辑规则被联结主义的神经元联结规则取代了，[^(\[16\])](#chapter002.html#m16)但是从计算本质上来说，二者并无不同，它们都把认知活动看作基于规则对符号的转换和计算，认知离不开表征。如果非要找出不同点的话，那就是认知主体与对象（世界）的表征中介由心智转变为人工神经网络，表征方式由符号表征转变为神经网络激活模式的表征，但是强调表征关系依然是认知主义与联结主义的不谋而合之处，不愿意放弃表征体现出两者的基本框架都是基于心物、主客的二元对立。这种做法的后果便是不可避免地将人的身体和环境的影响和作用从人类认知的领域中排除出去了，人的身体并不参与人的认知过程，环境对于人而言是分离的、客观的，心智与身体、环境之间互相分离，这样的立场和观点是第一代认知科学研究纲领面临的理论瓶颈，同时也成为以“4E+S”为核心的第二代认知科学研究纲领批评的重点。具身认知、情境认知、延展认知等都是在批判前者的过程中发展起来的，它们都强调身体和环境在解释人类认知中的积极作用并赋予之重要的地位，而不仅仅将其看作可有可无的附属物。

    '
  trans: '

    在认知科学家和哲学家眼中，认知科学是探索人类的智力如何由物质产生和人脑信息处理的过程的科学，包括从感觉的输入到复杂问题求解，从人类个体到人类社会的智能活动，以及人类智能和机器智能的性质。[^(\[1\])](#chapter002.html#m1)认知科学哲学领域中能够称得上研究范式的只有以笛卡尔的主体哲学为理论基石的认知计算主义，包括认知主义与联结主义。以计算表征为核心，以计算操作过程为基础，笛卡尔式认知科学将心智的内部状态视作抽象的逻辑计算，表征与认知的计算过程都发生在大脑内部，离身认知是最主要的实现形式。产生于
    20 世纪 50 年代的第一代认知科学研究范式，既经历过如日中天的灿烂与辉煌，也陷入过被群起攻之的困顿与落寞，如今，虽然人们对以“4E+S”认知模型为代表的第二代认知科学纲领大谈特谈，意图消解甚至取代认知计算主义，但这样的努力看起来似乎依然任重而道远，后者依然顽强地存在着，并没有一蹶不振，反而在吸收了前者的一些主张后焕发了新的生机（比如威尔逊的“宽计算主义”）。4E
    认知正是在批判和吸取认知主义和联结主义的基础上发展起来的，皮之不存，毛将焉附，因此，我们首先要对传统的认知科学研究范式进行梳理和分析。


    ## 一 毕达哥拉斯：“数是万物的本原”


    传统的认知主义和联结主义的本质在于计算，二者在哲学立场上都坚持计算主义，其思想渊源可以追溯至 18 世纪西欧盛行一时的理性主义哲学，比如霍布斯提出了“推理即计算”。计算的质料是数字和符号，而对“数”的重视和强调则肇始于古希腊时期的毕达哥拉斯学派，对数学富有成效的研究在一定程度上促使他提出了“数是万物的本原”这一哲学思想。毕达哥拉斯贬低了水、火、土、气等具体的物质性元素在构造世界中的作用，更看重世界的构成方式，表明他已经注意到了抽象性思维，并努力地为包括抽象事物和具象事物在内的万物寻求统一的本原。这可能是毕达哥拉斯的学说相较于米利都学说革命性的一点：最终决定事物的行为和性质的因素，不是各种原初物质，而是它们的构成形式。[^(\[2\])](#chapter002.html#m2)他发现了音乐谐音的数学基础，即谐音的音程之间存在比例关系，因此，他假定事物之间关联的实质就是数量关系，而数量关系本身也是人的思想与世界的同构，数也就成为衡量万物的标准和尺度。如果说“数是世界的本原”这一命题同计算主义有什么相似之处的话，在我们看来，则是对于世界的抽象理解。“数”是存在于事物的量的规定性，事物的多样性可以被归为量的统一性，“数”是事物的量的统一的抽象原则。[^(\[3\])](#chapter002.html#m3)数量关系预示了一个理解自然与世界的认识理论，与现代人相比，毕达哥拉斯学派缺少了概念与范畴的工具，但他们依然从现象的杂多中进行了科学的抽象，即便以我们的眼光来看显得有些稚嫩。


    此外，毕达哥拉斯学派关于数与具体事物的关系和认知与联结主义推崇符号之间也有一些相似之处：前者认为万物都是在模仿（分有）数，后者试图将所有对象化约为逻辑符号，可以看作前者的逆向。数与符号成了事物的范型，亚里士多德将毕达哥拉斯的“数”既归于形式因，又归于质料因。作为形式因的“数”不包含形体，是抽象的，毕达哥拉斯希望从理想的“数”出发，从完满的几何关系推出构造世界的规则。


    ## 二 笛卡尔：“心身二分”


    在当代，认知科学家和哲学家会受到笛卡尔哲学思想的影响与渗透，认为认知就是心智或者说是心智的表现活动，是与物理、化学等机械运动相对立的、具有现象特质的心理和意识过程，认知活动与身体活动被截然分开了。第一代认知科学之所以被人们称为笛卡尔式的认知科学，是因为这一科学研究纲领的哲学基础就是笛卡尔的理性主义哲学。笛卡尔将心智与物质区分为两种独立的实体，二者的属性差异之一在于广延，即是否占据以长、宽、高为基准的物理空间。从这种意义上讲，由于身体也占据物理空间，因此其本质是广延，故而属于物质的范畴。心智虽然没有广延，但笛卡尔认为它拥有空间位置。所谓空间也就是指大脑的松果体，人的灵魂就居住在其中，它是联结心智和身体的“枢纽”，是两者交互的“中转站”，负责统摄两者的行动。随着现代医学的发展与进步，人们已然揭开了松果体的神秘面纱，现代解剖学告诉我们，其中并不存在笛卡尔所谓的“灵魂”，松果体的主要作用是通过分泌激素以抑制神经系统。以今人的视角来看，松果体的观点有些幼稚甚至荒谬，但如果我们基于笛卡尔的理论语境便不难理解他的这一看似不合理的做法。由彻底怀疑一切存在得出了“我思故我在”（Cogito
    ergo sum）的哲学命题（这里的“我”不是作为身心统一体的我，而是指独立存在的心智），强调不能怀疑以思维为属性的心智实体的存在，进而论证物质与心智是相互平行、彼此独立的关系。笛卡尔构造出来的清楚明白的“我思”亦确立了心智区别于身体的性质，无论思维的幽灵身在何处，它的基本性质就是自由，[^(\[4\])](#chapter002.html#m4)属于物质范畴的身体则被机械因果律的锁链牢牢禁锢，因而不灭的灵魂（心智）是第一位的，优先于身体，纯粹智性的东西一定优于纯粹物质性的东西。


    第二代认知科学惯常地主张笛卡尔提出的心身二元论为当代的无身认知（认知主义和联结主义）提供了哲学基础，在某种程度上给予了其可行性论证，认为笛卡尔过于重理性（心智）而轻身体。但笛卡尔自始至终都在强调心智与身体的统一性，他明确地说道，“我们不能光说理性灵魂驻扎在人的身体里面，就像舵手住在船上一样，否则就不能使身体肢体得以运动，那是不够的，灵魂必须更加紧密地与身体连接和统一在一起，才能在运动以外还有同我们一样的感情和欲望，这才构成一个真正的人”。[^(\[5\])](#chapter002.html#m5)显而易见，笛卡尔并没有摒弃和抛离身体，相反，他愈发强调和重视人是心智与身体的统一体，而不是单纯的复合，只有这样，人才称得上是完全的实体。在他看来，心智与身体之间并不松散，如果认为二者是舵手与舰船的关系，那么舵手完全可以下船或者换乘别的船只，从这种意义上来说，身体之于心智类似于舰船之于舵手正是第二代认知科学对笛卡尔哲学的理解。然而，我们认为，这样的理解失之偏颇，误解了笛卡尔对心身关系的描述。他自始至终都坚持身心统一体的“人”的观点，并把它看作一个原初的，从而是不可被怀疑的基本概念。[^(\[6\])](#chapter002.html#m6)但是在二者如何实现互动的问题上，笛卡尔始终没有给出令人满意的解决办法，这也为后来的哲学家，如胡塞尔、梅洛-庞蒂以及认知科学家的工作留下了足够的空间。总的来说，笛卡尔从主观上对心智与身体的区分客观地、不经意地为第一代认知科学、计算机科学以及人工智能描绘了某种可行性。


    ## 三 霍布斯：“推理即计算”


    如今，大多数认知科学研究者都将笛卡尔的理性主义哲学传统看作第一代认知科学的研究基础，因而也将其称为笛卡尔式认知科学。但是笛卡尔在著作中从未表达过“认知是可计算的”这一观点，也就是所谓的“计算隐喻”。认知主义和联结主义都将人的认知活动理解为基于规则的符号表征与计算，这是传统认知科学的核心观念之一，而这一思想的来源最早可以追溯至
    17 世纪英国经验主义哲学家托马斯·霍布斯（Thomas Hobbes），他明确提出了“推理即计算”的思想，霍布斯和笛卡尔一样是传统认知科学的思想先驱。


    认识论在霍布斯的哲学体系中占有十分重要的地位，他首次将牛顿经典力学原理引入认识论，是近代西方哲学史机械主义认识论最主要的代表之一。霍布斯认为人的认知能力是构成人性的各种自然能力之一，而自然能力又分为两类：肉体能力和心智能力。作为哲学研究对象的后者又可分为“认知能力或概念能力”以及“促动能力”。[^(\[7\])](#chapter002.html#m7)第一种能力可以使人进行判断、推理等理性认识活动，第二种能力则使人产生各种情感的非理性活动。霍布斯认识论的研究重点就是人的认知能力。他认为思维推理的方法是加减计算，霍布斯说道，“所谓推理，我所意指的是计算。而计算或者是要加到一起的许多东西集合成一个总数，或者是求知从一件事物中取走另一件事物后还剩下的东西。因此，推理与加减是一回事……因此，一切推理，都包含在心灵的这两种运作，即加减里面”。[^(\[8\])](#chapter002.html#m8)我们如何对心中的观念进行推理和计算呢？根据霍布斯的观点，当我们远远地看到某个东西，由于距离较远，我们看到的是一个具有广延的形体。因此，首先出现在我们心中的是“物体”的观念，走近时发现这个形体具有理性动物的一切特征，包括言语、动作、表情等，心中随之产生“理性的”观念，这些观念的叠加便构成了“人”的观念，减法与此相反。霍布斯认为不应把这种加减计算限于数学、物理学与几何学领域，一切与推理相关的东西都可以利用这种计算方式，“由此可见，无论哪种事物，只要用得上加减法，就得靠推理。相反，如果用不上加减法，推理也就无从存在”。[^(\[9\])](#chapter002.html#m9)从我们的视角来看，霍布斯的这一思想过于简单浅显，人的认知能力不仅包括推理，还有感觉、知觉、记忆、思维、想象甚至情感等等。仅就推理而言，加减计算也不能涵盖一切推理形式，将推理等同于加减运算表明霍布斯在当时受到了几何学与经典机械力学的深刻影响，因而将人的理性认知活动简单化了，将之完全视作符号化的数量关系运算，抹杀了其他功能，如抽象思辨和具象思维。他提出的“推理即计算”这一原则虽然与计算主义的核心假设相比要简单得多，也未上升到理解人类认知和心智本质的高度，陷入了机械论的思维方式。但在我们看来，霍布斯的这一思想不自觉地成了计算主义的哲学先驱，虽然与图灵的计算概念有着巨大的差别，但就当时的时代背景而言，这已是十分卓越的哲学设想了。


    ## 四 莱布尼兹：“普遍语言”


    一直以来，传统的认知研究范式对于符号尤为重视（因而被称为符号主义），我们认为有可能受到了莱布尼兹的启发。莱布尼兹在他的《神正论》一书中提出了一个雄心勃勃的设想——“普遍语言”：“这种语言是一种用来代替自然语言的人工语言，它通过字母和符号进行逻辑分析与综合，把一般逻辑推理的规则改变为演算规则，以便更精确更敏捷地进行推理。”[^(\[10\])](#chapter002.html#m10)他尝试将数学与逻辑统一起来，建立普遍的符号逻辑，这样做的目的在于为人类认知提供一种统一的表达方式，从而摆脱或者消除长久以来人们在认识论领域中的纠缠与纷争，实现不同语言、民族以及学科之间的有效交流。在莱布尼兹眼里，人虽然在外貌、体质、种族和风俗习惯等方面存在着诸多差异，有些差异甚至是本质性的，但在人类理性层面却存在某种融贯和共通。莱布尼兹认为，符号可以使我们获得更为一般性的、准确的定义和论证过程，理性推理的实质就是符号的演算过程，人们使用符号来指称那些我们所确定知晓的属性或者过程，符号的结构直接反映概念世界甚至实在世界的结构本身。在我们看来，对于理解莱布尼兹的认知观而言，“普遍语言”是不可缺少的部分，认知的目标之一在于获得知识与真理，而要想获取清楚明白且完整的知识，形式语言则是必要的条件和手段。莱布尼兹确信，符号或者文字不仅能够使我们借助形式的符号构造我们的推理、表达我们的思想，而且能够使我们获得从纯粹的心理表征那里得不到的概念和真理。[^(\[11\])](#chapter002.html#m11)符号化的思维方式对于增强人的记忆能力而言是一个相当有用的工具，同时它也是演绎推理的必要组成部分。


    从本质上来说，莱布尼兹的“普遍语言”推崇的是一种符号主义，我们认为它可能包含了莱布尼兹本人的两个期许：一是使人们的推理不依赖于对推理过程中的命题的含义内容的思考，就像计算不依赖于对计算中出现的符号和含义内容的思考一样；[^(\[12\])](#chapter002.html#m12)二是以符号结构为基础的推理过程优于依赖心理表征的推理。莱布尼兹强烈反对笛卡尔的演绎概念，他希望以数学家的方式来解决哲学、逻辑方面的推演问题，操作字符的形式化过程则是实现有效论证的唯一途径，也就是以符号取代概念和图像，依据形式的组合规则构成推理的最佳模式。从这种意义上看，“普遍语言”并不注重心理内容，而是转向以客观的符号标记来表示概念。因此，它的主要功能在于为心灵提供导引，避免它在复杂的定义或概念的链条中迷失，心智在面对概念和推理演绎的复杂性时往往不知所措，同时既可以区分定义，又可以简化推理过程。“所谓方法就是一条为思维服务的导引线，它简便而可靠，跟着这条线就能没有紧张，也没有白费气力，也不怕会出错误，我们的思维就能安全进行，好象希腊神话里那个提修斯执有阿里阿德涅的导引线在迷宫中走路一样。”[^(\[13\])](#chapter002.html#m13)


    总而言之，在莱布尼兹那里，概念作为人类理性的产物，需要借助于符号形式的转向来超越作为知觉和想象力的感知。他已经向人们指明，心智能够在不利用心理内容的情况下对符号进行组合与计算，理解与分析符号不必以分析它的概念意义为前提，将符号承载的意义内容搁置一旁，心智就能够自由地聚焦于抽象、形式的元素。从某种意义上说，“普遍语言”背后折射出来的符号思维为我们表达巨量的数字和图形提供了可能性，而这正是认知主义甚至当下人工智能的主流路线。


    ## 第二节 笛卡尔式认知科学的缺陷与困境


    自 20 世纪 50 年代以来，控制论、信息论以及计算机科学等多门学科的蓬勃发展，以及一系列具有开创性的研究成果的发表，例如图灵发表的《论可计算数及其在判定问题中的应用》《计算机器与智能》，麦卡洛克与皮茨发表的《神经活动内在概念的逻辑演算》，纽厄尔与西蒙发表的《作为经验探索的计算机科学：符号和搜索》等，为人工智能以及认知科学的发展开辟了道路，指明了方向，一场轰轰烈烈的研究人类心智的革命呼之欲出。1956
    年的达特茅斯会议成为人工智能的发端，长期以来，人们都将人工智能视为认知科学的智力内核，并希望这门一般性的智能科学能够对以意向性为基础的各种心理能力甚至生物具有的心智作出完满的解释，“它必须告诉我们，智能是仅仅体现于那些具有大脑般的基本构造（包括由关联细胞组成的网络中的并行处理过程）的系统之中，还是也可以用某种别的方式来实现”。[^(\[14\])](#chapter002.html#m14)西蒙甚至预言，在
    20 年内，机器将做到人所能做到的一切事情。无论是认知主义抑或联结主义都把大脑看作一种计算系统，只关心“它体现出何种函数关系，而不是哪些脑细胞体现出这些关系，或大脑生理机能怎样使这种关系成为可能”。[^(\[15\])](#chapter002.html#m15)因此，尽管联结主义以模拟大脑神经网络来研究人类的认知活动，展现出与认知主义截然不同的工作方式——对信息数据的处理由顺序式的串行转变为并行分布式的处理方式，但从根本上看，二者都是在应用形式规则对符号进行形式操作，这种由神经科学家构造的人工神经元组成的联结网络模型只是对大脑神经活动高度抽象的理想形式，其本质仍然是数字式的信息加工。在我们看来，这样的模型无法在构造上与神经联结实现一一对应，无法在生物学意义上重现神经系统的运作机制，原因之一是大脑的神经元和突触的数量过于庞大，人工神经元的形式模拟并不是保证智能得以涌现的充分条件，且人工神经网络未能展现出人类大脑特有的直觉、顿悟、灵感等突现的智能表现形式，更未能表现出人类认知的情感特征（情感认知）。无论认知主义还是联结主义都只截取了人类认知的一个片段和方面，任何形式的系统都不可能纯粹借助计算而达到对认知的完满理解，而认知主义与联结主义也由于心物和心身二分的理论预设面临着诸多难以解决的困境。


    ### 一 心物二分导致认知与世界的割裂


    在研究人类认知活动与心智本质的道路上，联结主义比认知主义更进了一步。从仿生学的意义上讲，联结主义对认知的研究具有某种整体性，对大脑神经网络联结活动的模拟要比单纯的符号操作更具有优势，它克服了认知主义本身在形式化方面的困难，在认知主义难以应对的快速认知、联想记忆等方面，联结主义展现出了较好的处理能力。认知主义的逻辑规则被联结主义的神经元联结规则取代了，[^(\[16\])](#chapter002.html#m16)但是从计算本质上来说，二者并无不同，它们都把认知活动看作基于规则对符号的转换和计算，认知离不开表征。如果非要找出不同点的话，那就是认知主体与对象（世界）的表征中介由心智转变为人工神经网络，表征方式由符号表征转变为神经网络激活模式的表征，但是强调表征关系依然是认知主义与联结主义的不谋而合之处，不愿意放弃表征体现出两者的基本框架都是基于心物、主客的二元对立。这种做法的后果便是不可避免地将人的身体和环境的影响和作用从人类认知的领域中排除出去了，人的身体并不参与人的认知过程，环境对于人而言是分离的、客观的，心智与身体、环境之间互相分离，这样的立场和观点是第一代认知科学研究纲领面临的理论瓶颈，同时也成为以“4E+S”为核心的第二代认知科学研究纲领批评的重点。具身认知、情境认知、延展认知等都是在批判前者的过程中发展起来的，它们都强调身体和环境在解释人类认知中的积极作用并赋予之重要的地位，而不仅仅将其看作可有可无的附属物。


