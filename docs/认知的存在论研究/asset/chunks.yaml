- raw: '然而，海德格尔会认为“此在”的生存论分析是更为基本的，在自然主义者眼中，认知神经科学等领域的研究也同样基础。在一些现象学家看来，这两种类别的研究之间不可通约和还原。海德格尔虽然不赞同胡塞尔先验主体的转向，但他接受了后者“悬搁一切预先设定”（包括自然主义的立场和态度）的现象学方法。因此，基于这一点分析，海德格尔是不会赞成从自然主义视角诠释“此在”，并将“此在”自然化的，我们认为，这是现象学与认知科学之间对立关系的又一体现。[^(\[47\])](#chapter005.html#m47)此外，海德格尔认为，实证科学与存在论现象学的研究领域之间存在着重要的差别，一个讨论事物的实存，另一个则关注作为奠基的存在。然而，海德格尔给予“此在”以特殊的存在论地位，是能对主体和自我意识的存在问题进行追问的“特殊”存在者，存在问题只能从“此在”切入，它自身蕴含着比主体性和意识维度更加丰富的内容。认知科学将“此在”定义为一种“人类主体”（human
    agency），甚至重新解释为主体性，我们认为，这在很大程度上掩盖了人的存在与一般存在的本质关系，并且海德格尔的《存在与时间》不是要对人类认知作出解释和说明，更不是一部知识论和心智哲学的著作，他要澄清的是，关于人类认知与心智的传统解释和说明没有考虑到“此在”基本的生存境况，也就是在世存在的生存结构。


    在我们看来，自然化“此在”是以分析方法解读海德格尔哲学的结果，它有可能会贬低人类自身的经验。“分析性”不仅指海德格尔哲学被受过分析训练的英美哲学家照搬照用，而且指为了推进新的认知科学范式而被利用的海德格尔哲学，因此只关注《存在与时间》第一篇中的特定部分，同样的，这些部分也被非常有选择地加以利用。这种接受是“分析性”的，它构成了海德格尔哲学的一个相当程式化的版本，而这恰恰背离了存在论的语境。[^(\[48\])](#chapter005.html#m48)惠勒将海德格尔哲学的许多概念引入了认知科学研究，虽然我们也认为，不能依靠纯粹的哲学思辨来考察认知问题，一条真正的认知进路应当为旧有认知模式产生的困难提供解决方案。但类似于“拿来式”的概念引用很容易引起误解，比如他把人对用具的上手操用理解为，以行动为导向的表征在亚主体层次解决在线的问题求解。“此在”的自然化是海德格尔哲学与认知科学进行对话的关键，而对话本身就意味着一定限度的矛盾消解或者一方对另一方的退让，这里则是表现出了存在论现象学对某种自然主义版本的妥协和屈服。


    综上所述，“此在”的自然化是不可能的，至少目前看来仍有待商榷。我们多次强调，海德格尔对以胡塞尔和笛卡尔为代表的哲学传统的批判是为了回答存在这一根本性的问题，实际上，他并非在主动意义上触碰关于人类认知、心智以及智能的问题域，而是不自觉地反对以一种纯粹反思的方式来解释认知和心智现象。严肃地说，海德格尔无意使“此在”取代笛卡尔的“我思”，成为认知活动的新的主体，而是视其为在世界中存在的日常的实践能动者。相比之下，认知科学是以与之截然不同的模式来回答截然不同的问题，“此在”根本上表现为操劳和共在的生存现象，它适用于思辨式的、现象学的先验解释和先验分析，而不适于形式化、模型化的科学解释。因此，作为存在论概念的“此在”与事实层面的自然化描述并不相互包容，自然化“此在”并没有现实层面的可能性，这对于构建海德格尔式认知科学而言无疑是一个严重的困难。同样，海德格尔式认知科学的另一维度，也就是存在论现象学与人工智能相结合的产物——“海德格尔式人工智能”，面对框架问题也陷入了困境。


    ## 第二节 存在论现象学与“框架问题”


    近年来，随着人工智能（Artificial Intelligence）技术水平的不断发展和成熟，无人驾驶、语言识别、智能家居以及专家系统等成果给人们的生产和生活带来了意想不到的便捷。然而，人工智能的终极理想在于理解人类智能的本质，使计算机能做到人类心灵所能作的任何事情甚至更多。总体看来，人工智能的技术路线主要还是计算式的，依然是在进行某种信息处理，“计算机就是在做信息处理”，这已成为人们约定俗成的共同信念。所谓信息处理就是按照“预先编好的程序对有限种符号的有限长序列做有穷的变换，以得到一组新的符号作为结果”，[^(\[49\])](#chapter005.html#m49)人工智能的两个派别——强人工智能（strong
    AI）与弱人工智能（weak AI）都是在以计算的方式模拟人类认知能力，从本质上而言，人工智能（不论强弱）是物理符号系统假设的产物。在纽厄尔和西蒙看来，所谓物理符号系统假设，是指对一般智能行动来说，物理符号系统具有必要的和充分的手段：“必要的”是指，任何表现出一般智能的系统都可以经分析证明是一个物理符号系统；“充分的”是指，任何足够大的物理符号系统都可以通过进一步地组织而表现出一般智能，[^(\[50\])](#chapter005.html#m50)一般智能行动是与人类行动相吻合的，智能的范围即行动的范围，符号是智能行动的根基。因此，人工智能自诞生伊始便在进行着某种逻辑游戏，它先是剔除了意义，也就是将全部信息作为一种形式符号加以处理，然后再将意义引入并且通过符号再现。但在德雷福斯看来，这一方法是行不通的，符号串之间的推演不足以完满表达人类世界中呈现出来的意义，他从海德格尔哲学的视角出发对这一理论假设进行了激烈的批判。[^(\[51\])](#chapter005.html#m51)窥一斑而见全豹，从他的批判中我们可以看到人工智能可以从海德格尔哲学中获取哪些重要观念，同时也要留意德雷福斯的批判对现阶段的人工智能是否仍然有效，[^(\[52\])](#chapter005.html#m52)海德格尔哲学是否真的为人工智能提供了新的理论支持，是否为“框架问题”的解决提供了新的方法与视角。由于经典认知科学和人工智能是基于规则对符号进行表征与操作，因而框架问题成为它们必然要面对和处理的难题。长期的实践和研究已经证明了该问题不可能在认知计算主义范式内得到合理的解决，于是德雷福斯和惠勒等学者将目光转向了存在论现象学，意欲利用现象学资源回应框架问题的诘难。


    ### 一 德雷福斯对传统人工智能的批评


    早在20世纪70年代，德雷福斯便敏锐地看到了人工智能发展的诸多弊端，他在1965年为兰德公司撰写的报告《炼金术与人工智能》给予发展正盛的人工智能以当头棒喝。在他看来，传统人工智能将人的智能视作通用的符号加工装置这一思路主要基于四个假设：①生物学假设——大脑加工信息运用的离散的计算方式相当于开关的闭合；②心理学假设——大脑是按照形式规则加工信息的设备或装置；③认识论假设——一切知识都可被形式化，凡是能理解的都可表现为某种逻辑关系；④本体论假设——存在是一组在逻辑上完全互相独立的事实，外部世界的全部信息，包括意义都能够分解为与情境无关的确定元素。[^(\[53\])](#chapter005.html#m53)在德雷福斯看来，传统人工智能预设了世界是由清晰的原子事实构成的集合体，在按照明晰的规则对情境中的行为作出精确描述之前，人们不会对这类行为有所理解，计算机只能处理明晰、确定的数据材料，但这些材料并不直接在世界当中显现，必须经过人的抽象化的操作方能产生出来，而人被比喻为能够依照规则运算数据的装置。德雷福斯认为人工智能最初的发展设想遗忘了人具有身体这一事实，结果导致研究者们过分相信人类可以形式化为数字计算机的启发式程序，他将身体视为产生智能行为的必要之物，认为其是应对情境的可靠保证，决定着人们进行实践活动的能力，“把人同机器（不管它建造得多么巧妙）区别开来的，不是一个独立的、周全的、非物质的灵魂，而是一个复杂的、处于情境中的、物质的躯体”。[^(\[54\])](#chapter005.html#m54)在德雷福斯看来，人工智能自身的“阿喀琉斯之踵”就在于它始终未能驾驭包括感觉、知觉等在内的“低阶”功能。也就是说，仍未能拥有人和动物独有的感受性的人工智能，如今却在逻辑推断及信息处理等方面表现出远超于人的水准，这不得不说是一个十分奇怪的现象。


    我们的观点是，人的智能行为和现象需要被整体地看待。康德早先便将人的认知能力划分为感性、知性和理性，他说道：“人类知识有两个主干，它们也许出自一个共同的但不为我们所知的根源，这两个主干就是感性和知性，对象通过前者被给予我们，但通过后者被思维。”[^(\[55\])](#chapter005.html#m55)感性与知性紧密地交织结合在一起，感官的构造决定了我们可以经验到的内容，知性决定了经验的形式，而人工智能对人类智能的模拟就是经验性的，不过是抽离了感觉的成分和要素，只剩下可以形式化的经验结构，并依照规则进行推理和计算。然而康德告诉我们，人类认知不是由单一的知性能力构成，试图完全依靠先验的推理是唯理论的做法（他不遗余力地调和经验论与唯理论之间的争论可能因为他看到了人类认知具有的多重维度）。休谟也认为人类的思想观念起源于感官产生的感觉经验，任何对感官的模拟只是一定程度上的，永远无法企及或达到原初感受的生动与鲜活，哪怕是最生动的思考，作为一种间接产物，也无法与最迟钝的直接感官相比。


    这样便涉及另一个问题，即人工智能与身体之间有何种关联？德雷福斯将身体视作人工智能进一步向前发展的首要瓶颈，认为如果不能破解身体与智能的关系，那么人工智能模拟人类智能行为的举动就像是在一个黑箱中寻找另一个黑箱。作为心灵模型的物理符号系统和模拟人类大脑神经元结构的人工神经网络，两者都依赖符号表征，缺乏基于具身性主体特有的诸如知觉、情感以及意向性等功能。事实证明，脱离身体来模拟智能，其结果就是仅得到了人类智能的形式化计算方面，这样理解人类认知是狭隘的，而人与世界打交道依靠的恰恰是身体，以眼睛观察世界，以肢体触摸事物。作为近代主体哲学的开创者，笛卡尔在确立了清楚明白的“我思”的同时，确立了身体与理智相区别的性质。虽然他在形而上学方面只看重纯粹的理智，但其显然意识到身体并非可以轻易弃之不论，他写道：“我不仅住在我的肉体里，就像一个舵手住在他的船上一样，而且除此而外，我和它非常紧密地连结在一起，融合、掺混得像一个整体一样地同它结合在一起。”[^(\[56\])](#chapter005.html#m56)笛卡尔通过日常经验推断身与心的融合，这说明他并没有完全抛弃身体，他仍对身体充满敬畏，依旧认为身体对心灵有着深刻的影响。然而，人工智能的经典范式在早期深化了这一对立，它代表着一种“无身认知”的思想，大脑执行全部的认知加工和信息处理过程，基于实践的考量才设计了工程学意义上的机械臂，但仅限于某些实践操作，身体完全不参与智能行动，用德雷福斯的话而言就是“躯体是智能与理性的多余之物，而不是智能与理性的必要之物”，[^(\[57\])](#chapter005.html#m57)心灵统摄和掌握一切。然而人类要以恰当的方式应对无限多的情境，不只是依靠大脑严谨缜密的思考，还有灵活的身体。在德雷福斯看来，具身性的技术路线才是未来人工智能的发展方向，他本人也提出了一种“海德格尔式人工智能”的新型构想。


    ### 二 “海德格尔式人工智能”与框架问题


    总体来看，“海德格尔式人工智能”主要是基于海德格尔哲学对人工智能的理论基石作出修正，进而希望开辟一条新的技术路线，并重新看待、评估设计智能机器的符号表征路径。在海德格尔眼中，人类在日常生活中的应对活动并不基于理性的、推理式的思维过程，心理表征不是人类智能的普遍机制。自20世纪60年代以来，心智的计算机隐喻将表征置于智能行动的核心，表征成为构建智能体框架的关键环节。这一隐喻具有两方面假设：①计算机拥有必要方式来执行人类具有的任何智能活动，②必须将智能理解为心智的形式操作。[^(\[58\])](#chapter005.html#m58)但在海德格尔看来，重要的不在于智能体是否能够进行充分的信息表征，而在于能否在恰当的情境中运用恰当的知识恰当地解决问题。占有客观知识之多寡与人们应对所遇之事件并无多大的关联（正如一句流行语所言，“我们知道很多道理，却依然过不好这一生”），相反，后者依赖于人们与用具和系统的有效耦合，表征只有在耦合中断的情况下才会呈现。[^(\[59\])](#chapter005.html#m59)我们可以设想，如果海德格尔还健在的话，他会反对人工智能沿袭认知主义的路线，拒绝按照从信息收集到形成假设，经过推理运算后求解问题的模型。计算机作为认知主义的典范而诞生，人的智能行为可以视为一系列确定、独立的简单要素的复杂集合。所谓认知就是操作和处理大量的表征，在人工智能中则体现为依照算法进行处理的数据资料，但我们生存其中的世界并不直接呈现出这样的形式。也就是说，我们从世界直接接收到的不是离散、明晰和确定的数据信息与符号，需要内在的自动处理符号的官能加以转换。从这种意义上说，人工智能成功模拟人类智能行为的关键在于像人一样直接取用非离散形式的信息。人每时每刻都处于某一情境并经历着情境间的变动不居（这导致了人工智能所面临的语境内和语境间两个方面的框架问题），思维往往处于具体而复杂的环境当中，认知是实时的、情境中的活动。


    海德格尔式人工智能试图破除认知主义设定的信息处理模式，即“力图依据逻辑上独立的符号——它们代表着世界之中的元素、属性或原始的东西——的一个复杂的复合体来说明人的活动”。[^(\[60\])](#chapter005.html#m60)以明斯基为代表的认知主义者笃信，尽可能充分地表征存在的事实是能够解决常识难题的，但他们低估了人类常识本身的庞大体量。德雷福斯认为，深层的问题不在于存储数以百万计关于事实的表征信息，而在于如何在特定情境下辨别出相关事实。[^(\[61\])](#chapter005.html#m61)我们经常是以整体性的视角去把握情境中的对象，对象物不是以一组独立于语境的要素同我们接触，而是已经承载了依赖于语境的意义。例如，教室内摆放着一张桌子，我们是在所处的背景下一眼识别出这是讲桌/课桌，而不是餐桌或者其他别的什么东西。若只关注原初的感觉材料，比如对颜色的视觉经验，便可能隐去我们关于对象之功能或属性的认识，只有在有意义的信念系统构成的背景下，对象才能更加完整地向我们显现。


    德雷福斯将海德格尔式人工智能区分为三个阶段。


    （1）通过构造基于行动的机器人来消除表征，主要代表是著名的人工智能和机器人学家鲁迪·布鲁克斯。他提出了一个重要口号：“世界的最佳模型就是世界本身。”德雷福斯认为他的进路绕过而非解决了框架问题，他的机器人只对环境的孤立、固定特征而非语境作出反应。布鲁克斯采用了自下而上的设计路径，从知觉和行动出发来模拟原始的低等智能活动，他将智能体在动态环境中的感知与活动能力（mobility）看作高阶认知的基础，对于世界的清晰符号表征和模型反倒阻碍着人们理解认知的本质。在我们看来，布鲁克斯的设计过分追求同环境的灵活互动，只是模拟了没有信息加工过程的人类智能，人工系统对生物系统的模拟不能仅仅停留在原始智能的层次，后者严格来说并不代表生物系统（尤其是人）具有的智能水平，他的尝试和努力仍然停留在实践和经验层面。


    （2）为上手状态编程（programming the ready-to-hand）。相较于布鲁克斯，阿格雷（Phil Agre）则是有意识地汲取了海德格尔的哲学思想，他设计的机器人面对的不是现成在手之对象的属性，而是引发主体恰当反应的行动可能性。在德雷福斯看来，阿格雷对海德格尔的理解展现了新的内容，后者将器具视为引发行动的可能性，而不是具有功能特征的实体。虽然他试图为海德格尔明言的日常活动编程，但在如何面对情境的转换方面依然束手无策，他设计的人工智能面对的可能联系都是预先设定的，没有任何获得技能与学习情况出现。[^(\[62\])](#chapter005.html#m62)和布鲁克斯一样，阿格雷也是在消解而非解决框架问题。


    （3）虚拟的海德格尔式人工智能：嵌入、具身以及延展的心灵。与前两者不同，惠勒是在为行动导向的表征进行辩护，认为自己提出的“具身—嵌入式认知科学隐然是一种海德格尔式的冒险旅程”。[^(\[63\])](#chapter005.html#m63)他赞同德雷福斯的观点，即笛卡尔与海德格尔在形而上学层面的哲学僵局可以通过认知科学以经验方法加以解决，且海德格尔的思想为心智和智能的非笛卡尔式概念化提供了令人信服的模型。在德雷福斯眼中，惠勒的行动导向式表征相比于布鲁克斯之前的人工智能而言是倒退了，他对海德格尔作了认知主义的误读。他的理由是，既然是依托在世存在构建新的具身—嵌入式认知科学，那就不能掺杂任何形式的表征，因为在世存在作为人的生存背景，比思维和问题求解更加基本，在世本身亦非表征。也就是说，我们与器具打交道是全神贯注的，是不会停顿的进程，其中弥合了因为表征所造成的内外差别与对立。德雷福斯认为，惠勒的新表征路径依旧面临框架问题的诘难，尽管惠勒宣称自己的海德格尔式认知科学预示了解决框架问题的可能性，但根据德雷福斯对海德格尔的解读，所有表征性的说明都是有问题的，尝试以在线的表征状态触碰框架问题即徒劳。


    我们看到，海德格尔式人工智能的几种版本在德雷福斯眼里都不够“海德格尔化”，它们仍无力解决日常世界的复杂相关性，而这是人们惯常的能力。人们之所以能够对世界中的变化作出反应，根本上是因为其有着具身性的应对能力和梅洛-庞蒂所谓的“意向弧”，而不是通过信念、表象以及图式等表征形式关联外部世界。概言之，真正意义上的海德格尔式人工智能是不包含任何表征成分的，否则便称不上是基于海德格尔哲学的假设。在德雷福斯看来，这种尝试成功的关键在于模型能再现人体验意义的独有方式。在大多数情况下，我们可以准确地把捉与自身紧密关联的要素，而不是眉毛胡子一把抓，这样意义便凸显出来了。怎样才能像人一样在世界中智能地行动，靠的不是心灵表征，而是在线的身体行动，这才是海德格尔式人工智能成功的关键，也是德雷福斯着重强调的核心主张。和惠勒一样，德雷福斯借鉴了海德格尔关于“此在”“被抛”的论断，然而，如何模拟人“被抛入世”的生存现象，也就是将“被抛”形式化和机制化，这成为他们共同需要阐明的问题。


    ### 三 存在论现象学对“框架问题”的介入'
  fmt: '

    然而，海德格尔会认为“此在”的生存论分析是更为基本的，在自然主义者眼中，认知神经科学等领域的研究也同样基础。在一些现象学家看来，这两种类别的研究之间不可通约和还原。海德格尔虽然不赞同胡塞尔先验主体的转向，但他接受了后者“悬搁一切预先设定”（包括自然主义的立场和态度）的现象学方法。因此，基于这一点分析，海德格尔是不会赞成从自然主义视角诠释“此在”，并将“此在”自然化的，我们认为，这是现象学与认知科学之间对立关系的又一体现。[^(\[47\])](#chapter005.html#m47)此外，海德格尔认为，实证科学与存在论现象学的研究领域之间存在着重要的差别，一个讨论事物的实存，另一个则关注作为奠基的存在。然而，海德格尔给予“此在”以特殊的存在论地位，是能对主体和自我意识的存在问题进行追问的“特殊”存在者，存在问题只能从“此在”切入，它自身蕴含着比主体性和意识维度更加丰富的内容。认知科学将“此在”定义为一种“人类主体”（human
    agency），甚至重新解释为主体性，我们认为，这在很大程度上掩盖了人的存在与一般存在的本质关系，并且海德格尔的《存在与时间》不是要对人类认知作出解释和说明，更不是一部知识论和心智哲学的著作，他要澄清的是，关于人类认知与心智的传统解释和说明没有考虑到“此在”基本的生存境况，也就是在世存在的生存结构。


    在我们看来，自然化“此在”是以分析方法解读海德格尔哲学的结果，它有可能会贬低人类自身的经验。“分析性”不仅指海德格尔哲学被受过分析训练的英美哲学家照搬照用，而且指为了推进新的认知科学范式而被利用的海德格尔哲学，因此只关注《存在与时间》第一篇中的特定部分，同样的，这些部分也被非常有选择地加以利用。这种接受是“分析性”的，它构成了海德格尔哲学的一个相当程式化的版本，而这恰恰背离了存在论的语境。[^(\[48\])](#chapter005.html#m48)惠勒将海德格尔哲学的许多概念引入了认知科学研究，虽然我们也认为，不能依靠纯粹的哲学思辨来考察认知问题，一条真正的认知进路应当为旧有认知模式产生的困难提供解决方案。但类似于“拿来式”的概念引用很容易引起误解，比如他把人对用具的上手操用理解为，以行动为导向的表征在亚主体层次解决在线的问题求解。“此在”的自然化是海德格尔哲学与认知科学进行对话的关键，而对话本身就意味着一定限度的矛盾消解或者一方对另一方的退让，这里则是表现出了存在论现象学对某种自然主义版本的妥协和屈服。


    综上所述，“此在”的自然化是不可能的，至少目前看来仍有待商榷。我们多次强调，海德格尔对以胡塞尔和笛卡尔为代表的哲学传统的批判是为了回答存在这一根本性的问题，实际上，他并非在主动意义上触碰关于人类认知、心智以及智能的问题域，而是不自觉地反对以一种纯粹反思的方式来解释认知和心智现象。严肃地说，海德格尔无意使“此在”取代笛卡尔的“我思”，成为认知活动的新的主体，而是视其为在世界中存在的日常的实践能动者。相比之下，认知科学是以与之截然不同的模式来回答截然不同的问题，“此在”根本上表现为操劳和共在的生存现象，它适用于思辨式的、现象学的先验解释和先验分析，而不适于形式化、模型化的科学解释。因此，作为存在论概念的“此在”与事实层面的自然化描述并不相互包容，自然化“此在”并没有现实层面的可能性，这对于构建海德格尔式认知科学而言无疑是一个严重的困难。同样，海德格尔式认知科学的另一维度，也就是存在论现象学与人工智能相结合的产物——“海德格尔式人工智能”，面对框架问题也陷入了困境。


    ## 第二节 存在论现象学与“框架问题”


    近年来，随着人工智能（Artificial Intelligence）技术水平的不断发展和成熟，无人驾驶、语言识别、智能家居以及专家系统等成果给人们的生产和生活带来了意想不到的便捷。然而，人工智能的终极理想在于理解人类智能的本质，使计算机能做到人类心灵所能作的任何事情甚至更多。总体看来，人工智能的技术路线主要还是计算式的，依然是在进行某种信息处理，“计算机就是在做信息处理”，这已成为人们约定俗成的共同信念。所谓信息处理就是按照“预先编好的程序对有限种符号的有限长序列做有穷的变换，以得到一组新的符号作为结果”，[^(\[49\])](#chapter005.html#m49)人工智能的两个派别——强人工智能（strong
    AI）与弱人工智能（weak AI）都是在以计算的方式模拟人类认知能力，从本质上而言，人工智能（不论强弱）是物理符号系统假设的产物。在纽厄尔和西蒙看来，所谓物理符号系统假设，是指对一般智能行动来说，物理符号系统具有必要的和充分的手段：“必要的”是指，任何表现出一般智能的系统都可以经分析证明是一个物理符号系统；“充分的”是指，任何足够大的物理符号系统都可以通过进一步地组织而表现出一般智能，[^(\[50\])](#chapter005.html#m50)一般智能行动是与人类行动相吻合的，智能的范围即行动的范围，符号是智能行动的根基。因此，人工智能自诞生伊始便在进行着某种逻辑游戏，它先是剔除了意义，也就是将全部信息作为一种形式符号加以处理，然后再将意义引入并且通过符号再现。但在德雷福斯看来，这一方法是行不通的，符号串之间的推演不足以完满表达人类世界中呈现出来的意义，他从海德格尔哲学的视角出发对这一理论假设进行了激烈的批判。[^(\[51\])](#chapter005.html#m51)窥一斑而见全豹，从他的批判中我们可以看到人工智能可以从海德格尔哲学中获取哪些重要观念，同时也要留意德雷福斯的批判对现阶段的人工智能是否仍然有效，[^(\[52\])](#chapter005.html#m52)海德格尔哲学是否真的为人工智能提供了新的理论支持，是否为“框架问题”的解决提供了新的方法与视角。由于经典认知科学和人工智能是基于规则对符号进行表征与操作，因而框架问题成为它们必然要面对和处理的难题。长期的实践和研究已经证明了该问题不可能在认知计算主义范式内得到合理的解决，于是德雷福斯和惠勒等学者将目光转向了存在论现象学，意欲利用现象学资源回应框架问题的诘难。


    ### 一 德雷福斯对传统人工智能的批评


    早在20世纪70年代，德雷福斯便敏锐地看到了人工智能发展的诸多弊端，他在1965年为兰德公司撰写的报告《炼金术与人工智能》给予发展正盛的人工智能以当头棒喝。在他看来，传统人工智能将人的智能视作通用的符号加工装置这一思路主要基于四个假设：①生物学假设——大脑加工信息运用的离散的计算方式相当于开关的闭合；②心理学假设——大脑是按照形式规则加工信息的设备或装置；③认识论假设——一切知识都可被形式化，凡是能理解的都可表现为某种逻辑关系；④本体论假设——存在是一组在逻辑上完全互相独立的事实，外部世界的全部信息，包括意义都能够分解为与情境无关的确定元素。[^(\[53\])](#chapter005.html#m53)在德雷福斯看来，传统人工智能预设了世界是由清晰的原子事实构成的集合体，在按照明晰的规则对情境中的行为作出精确描述之前，人们不会对这类行为有所理解，计算机只能处理明晰、确定的数据材料，但这些材料并不直接在世界当中显现，必须经过人的抽象化的操作方能产生出来，而人被比喻为能够依照规则运算数据的装置。德雷福斯认为人工智能最初的发展设想遗忘了人具有身体这一事实，结果导致研究者们过分相信人类可以形式化为数字计算机的启发式程序，他将身体视为产生智能行为的必要之物，认为其是应对情境的可靠保证，决定着人们进行实践活动的能力，“把人同机器（不管它建造得多么巧妙）区别开来的，不是一个独立的、周全的、非物质的灵魂，而是一个复杂的、处于情境中的、物质的躯体”。[^(\[54\])](#chapter005.html#m54)在德雷福斯看来，人工智能自身的“阿喀琉斯之踵”就在于它始终未能驾驭包括感觉、知觉等在内的“低阶”功能。也就是说，仍未能拥有人和动物独有的感受性的人工智能，如今却在逻辑推断及信息处理等方面表现出远超于人的水准，这不得不说是一个十分奇怪的现象。


    我们的观点是，人的智能行为和现象需要被整体地看待。康德早先便将人的认知能力划分为感性、知性和理性，他说道：“人类知识有两个主干，它们也许出自一个共同的但不为我们所知的根源，这两个主干就是感性和知性，对象通过前者被给予我们，但通过后者被思维。”[^(\[55\])](#chapter005.html#m55)感性与知性紧密地交织结合在一起，感官的构造决定了我们可以经验到的内容，知性决定了经验的形式，而人工智能对人类智能的模拟就是经验性的，不过是抽离了感觉的成分和要素，只剩下可以形式化的经验结构，并依照规则进行推理和计算。然而康德告诉我们，人类认知不是由单一的知性能力构成，试图完全依靠先验的推理是唯理论的做法（他不遗余力地调和经验论与唯理论之间的争论可能因为他看到了人类认知具有的多重维度）。休谟也认为人类的思想观念起源于感官产生的感觉经验，任何对感官的模拟只是一定程度上的，永远无法企及或达到原初感受的生动与鲜活，哪怕是最生动的思考，作为一种间接产物，也无法与最迟钝的直接感官相比。


    这样便涉及另一个问题，即人工智能与身体之间有何种关联？德雷福斯将身体视作人工智能进一步向前发展的首要瓶颈，认为如果不能破解身体与智能的关系，那么人工智能模拟人类智能行为的举动就像是在一个黑箱中寻找另一个黑箱。作为心灵模型的物理符号系统和模拟人类大脑神经元结构的人工神经网络，两者都依赖符号表征，缺乏基于具身性主体特有的诸如知觉、情感以及意向性等功能。事实证明，脱离身体来模拟智能，其结果就是仅得到了人类智能的形式化计算方面，这样理解人类认知是狭隘的，而人与世界打交道依靠的恰恰是身体，以眼睛观察世界，以肢体触摸事物。作为近代主体哲学的开创者，笛卡尔在确立了清楚明白的“我思”的同时，确立了身体与理智相区别的性质。虽然他在形而上学方面只看重纯粹的理智，但其显然意识到身体并非可以轻易弃之不论，他写道：“我不仅住在我的肉体里，就像一个舵手住在他的船上一样，而且除此而外，我和它非常紧密地连结在一起，融合、掺混得像一个整体一样地同它结合在一起。”[^(\[56\])](#chapter005.html#m56)笛卡尔通过日常经验推断身与心的融合，这说明他并没有完全抛弃身体，他仍对身体充满敬畏，依旧认为身体对心灵有着深刻的影响。然而，人工智能的经典范式在早期深化了这一对立，它代表着一种“无身认知”的思想，大脑执行全部的认知加工和信息处理过程，基于实践的考量才设计了工程学意义上的机械臂，但仅限于某些实践操作，身体完全不参与智能行动，用德雷福斯的话而言就是“躯体是智能与理性的多余之物，而不是智能与理性的必要之物”，[^(\[57\])](#chapter005.html#m57)心灵统摄和掌握一切。然而人类要以恰当的方式应对无限多的情境，不只是依靠大脑严谨缜密的思考，还有灵活的身体。在德雷福斯看来，具身性的技术路线才是未来人工智能的发展方向，他本人也提出了一种“海德格尔式人工智能”的新型构想。


    ### 二 “海德格尔式人工智能”与框架问题


    总体来看，“海德格尔式人工智能”主要是基于海德格尔哲学对人工智能的理论基石作出修正，进而希望开辟一条新的技术路线，并重新看待、评估设计智能机器的符号表征路径。在海德格尔眼中，人类在日常生活中的应对活动并不基于理性的、推理式的思维过程，心理表征不是人类智能的普遍机制。自20世纪60年代以来，心智的计算机隐喻将表征置于智能行动的核心，表征成为构建智能体框架的关键环节。这一隐喻具有两方面假设：①计算机拥有必要方式来执行人类具有的任何智能活动，②必须将智能理解为心智的形式操作。[^(\[58\])](#chapter005.html#m58)但在海德格尔看来，重要的不在于智能体是否能够进行充分的信息表征，而在于能否在恰当的情境中运用恰当的知识恰当地解决问题。占有客观知识之多寡与人们应对所遇之事件并无多大的关联（正如一句流行语所言，“我们知道很多道理，却依然过不好这一生”），相反，后者依赖于人们与用具和系统的有效耦合，表征只有在耦合中断的情况下才会呈现。[^(\[59\])](#chapter005.html#m59)我们可以设想，如果海德格尔还健在的话，他会反对人工智能沿袭认知主义的路线，拒绝按照从信息收集到形成假设，经过推理运算后求解问题的模型。计算机作为认知主义的典范而诞生，人的智能行为可以视为一系列确定、独立的简单要素的复杂集合。所谓认知就是操作和处理大量的表征，在人工智能中则体现为依照算法进行处理的数据资料，但我们生存其中的世界并不直接呈现出这样的形式。也就是说，我们从世界直接接收到的不是离散、明晰和确定的数据信息与符号，需要内在的自动处理符号的官能加以转换。从这种意义上说，人工智能成功模拟人类智能行为的关键在于像人一样直接取用非离散形式的信息。人每时每刻都处于某一情境并经历着情境间的变动不居（这导致了人工智能所面临的语境内和语境间两个方面的框架问题），思维往往处于具体而复杂的环境当中，认知是实时的、情境中的活动。


    海德格尔式人工智能试图破除认知主义设定的信息处理模式，即“力图依据逻辑上独立的符号——它们代表着世界之中的元素、属性或原始的东西——的一个复杂的复合体来说明人的活动”。[^(\[60\])](#chapter005.html#m60)以明斯基为代表的认知主义者笃信，尽可能充分地表征存在的事实是能够解决常识难题的，但他们低估了人类常识本身的庞大体量。德雷福斯认为，深层的问题不在于存储数以百万计关于事实的表征信息，而在于如何在特定情境下辨别出相关事实。[^(\[61\])](#chapter005.html#m61)我们经常是以整体性的视角去把握情境中的对象，对象物不是以一组独立于语境的要素同我们接触，而是已经承载了依赖于语境的意义。例如，教室内摆放着一张桌子，我们是在所处的背景下一眼识别出这是讲桌/课桌，而不是餐桌或者其他别的什么东西。若只关注原初的感觉材料，比如对颜色的视觉经验，便可能隐去我们关于对象之功能或属性的认识，只有在有意义的信念系统构成的背景下，对象才能更加完整地向我们显现。


    德雷福斯将海德格尔式人工智能区分为三个阶段。


    （1）通过构造基于行动的机器人来消除表征，主要代表是著名的人工智能和机器人学家鲁迪·布鲁克斯。他提出了一个重要口号：“世界的最佳模型就是世界本身。”德雷福斯认为他的进路绕过而非解决了框架问题，他的机器人只对环境的孤立、固定特征而非语境作出反应。布鲁克斯采用了自下而上的设计路径，从知觉和行动出发来模拟原始的低等智能活动，他将智能体在动态环境中的感知与活动能力（mobility）看作高阶认知的基础，对于世界的清晰符号表征和模型反倒阻碍着人们理解认知的本质。在我们看来，布鲁克斯的设计过分追求同环境的灵活互动，只是模拟了没有信息加工过程的人类智能，人工系统对生物系统的模拟不能仅仅停留在原始智能的层次，后者严格来说并不代表生物系统（尤其是人）具有的智能水平，他的尝试和努力仍然停留在实践和经验层面。


    （2）为上手状态编程（programming the ready-to-hand）。相较于布鲁克斯，阿格雷（Phil Agre）则是有意识地汲取了海德格尔的哲学思想，他设计的机器人面对的不是现成在手之对象的属性，而是引发主体恰当反应的行动可能性。在德雷福斯看来，阿格雷对海德格尔的理解展现了新的内容，后者将器具视为引发行动的可能性，而不是具有功能特征的实体。虽然他试图为海德格尔明言的日常活动编程，但在如何面对情境的转换方面依然束手无策，他设计的人工智能面对的可能联系都是预先设定的，没有任何获得技能与学习情况出现。[^(\[62\])](#chapter005.html#m62)和布鲁克斯一样，阿格雷也是在消解而非解决框架问题。


    （3）虚拟的海德格尔式人工智能：嵌入、具身以及延展的心灵。与前两者不同，惠勒是在为行动导向的表征进行辩护，认为自己提出的“具身—嵌入式认知科学隐然是一种海德格尔式的冒险旅程”。[^(\[63\])](#chapter005.html#m63)他赞同德雷福斯的观点，即笛卡尔与海德格尔在形而上学层面的哲学僵局可以通过认知科学以经验方法加以解决，且海德格尔的思想为心智和智能的非笛卡尔式概念化提供了令人信服的模型。在德雷福斯眼中，惠勒的行动导向式表征相比于布鲁克斯之前的人工智能而言是倒退了，他对海德格尔作了认知主义的误读。他的理由是，既然是依托在世存在构建新的具身—嵌入式认知科学，那就不能掺杂任何形式的表征，因为在世存在作为人的生存背景，比思维和问题求解更加基本，在世本身亦非表征。也就是说，我们与器具打交道是全神贯注的，是不会停顿的进程，其中弥合了因为表征所造成的内外差别与对立。德雷福斯认为，惠勒的新表征路径依旧面临框架问题的诘难，尽管惠勒宣称自己的海德格尔式认知科学预示了解决框架问题的可能性，但根据德雷福斯对海德格尔的解读，所有表征性的说明都是有问题的，尝试以在线的表征状态触碰框架问题即徒劳。


    我们看到，海德格尔式人工智能的几种版本在德雷福斯眼里都不够“海德格尔化”，它们仍无力解决日常世界的复杂相关性，而这是人们惯常的能力。人们之所以能够对世界中的变化作出反应，根本上是因为其有着具身性的应对能力和梅洛-庞蒂所谓的“意向弧”，而不是通过信念、表象以及图式等表征形式关联外部世界。概言之，真正意义上的海德格尔式人工智能是不包含任何表征成分的，否则便称不上是基于海德格尔哲学的假设。在德雷福斯看来，这种尝试成功的关键在于模型能再现人体验意义的独有方式。在大多数情况下，我们可以准确地把捉与自身紧密关联的要素，而不是眉毛胡子一把抓，这样意义便凸显出来了。怎样才能像人一样在世界中智能地行动，靠的不是心灵表征，而是在线的身体行动，这才是海德格尔式人工智能成功的关键，也是德雷福斯着重强调的核心主张。和惠勒一样，德雷福斯借鉴了海德格尔关于“此在”“被抛”的论断，然而，如何模拟人“被抛入世”的生存现象，也就是将“被抛”形式化和机制化，这成为他们共同需要阐明的问题。


    ### 三 存在论现象学对“框架问题”的介入

    '
  trans: '


    然而，海德格尔会认为“此在”的生存论分析是更为基本的，在自然主义者眼中，认知神经科学等领域的研究也同样基础。在一些现象学家看来，这两种类别的研究之间不可通约和还原。海德格尔虽然不赞同胡塞尔先验主体的转向，但他接受了后者“悬搁一切预先设定”（包括自然主义的立场和态度）的现象学方法。因此，基于这一点分析，海德格尔是不会赞成从自然主义视角诠释“此在”，并将“此在”自然化的，我们认为，这是现象学与认知科学之间对立关系的又一体现。[^(\[47\])](#chapter005.html#m47)此外，海德格尔认为，实证科学与存在论现象学的研究领域之间存在着重要的差别，一个讨论事物的实存，另一个则关注作为奠基的存在。然而，海德格尔给予“此在”以特殊的存在论地位，是能对主体和自我意识的存在问题进行追问的“特殊”存在者，存在问题只能从“此在”切入，它自身蕴含着比主体性和意识维度更加丰富的内容。认知科学将“此在”定义为一种“人类主体”（human
    agency），甚至重新解释为主体性，我们认为，这在很大程度上掩盖了人的存在与一般存在的本质关系，并且海德格尔的《存在与时间》不是要对人类认知作出解释和说明，更不是一部知识论和心智哲学的著作，他要澄清的是，关于人类认知与心智的传统解释和说明没有考虑到“此在”基本的生存境况，也就是在世存在的生存结构。


    在我们看来，自然化“此在”是以分析方法解读海德格尔哲学的结果，它有可能会贬低人类自身的经验。“分析性”不仅指海德格尔哲学被受过分析训练的英美哲学家照搬照用，而且指为了推进新的认知科学范式而被利用的海德格尔哲学，因此只关注《存在与时间》第一篇中的特定部分，同样的，这些部分也被非常有选择地加以利用。这种接受是“分析性”的，它构成了海德格尔哲学的一个相当程式化的版本，而这恰恰背离了存在论的语境。[^(\[48\])](#chapter005.html#m48)惠勒将海德格尔哲学的许多概念引入了认知科学研究，虽然我们也认为，不能依靠纯粹的哲学思辨来考察认知问题，一条真正的认知进路应当为旧有认知模式产生的困难提供解决方案。但类似于“拿来式”的概念引用很容易引起误解，比如他把人对用具的上手操用理解为，以行动为导向的表征在亚主体层次解决在线的问题求解。“此在”的自然化是海德格尔哲学与认知科学进行对话的关键，而对话本身就意味着一定限度的矛盾消解或者一方对另一方的退让，这里则是表现出了存在论现象学对某种自然主义版本的妥协和屈服。


    综上所述，“此在”的自然化是不可能的，至少目前看来仍有待商榷。我们多次强调，海德格尔对以胡塞尔和笛卡尔为代表的哲学传统的批判是为了回答存在这一根本性的问题，实际上，他并非在主动意义上触碰关于人类认知、心智以及智能的问题域，而是不自觉地反对以一种纯粹反思的方式来解释认知和心智现象。严肃地说，海德格尔无意使“此在”取代笛卡尔的“我思”，成为认知活动的新的主体，而是视其为在世界中存在的日常的实践能动者。相比之下，认知科学是以与之截然不同的模式来回答截然不同的问题，“此在”根本上表现为操劳和共在的生存现象，它适用于思辨式的、现象学的先验解释和先验分析，而不适于形式化、模型化的科学解释。因此，作为存在论概念的“此在”与事实层面的自然化描述并不相互包容，自然化“此在”并没有现实层面的可能性，这对于构建海德格尔式认知科学而言无疑是一个严重的困难。同样，海德格尔式认知科学的另一维度，也就是存在论现象学与人工智能相结合的产物——“海德格尔式人工智能”，面对框架问题也陷入了困境。


    ## 第二节 存在论现象学与“框架问题”


    近年来，随着人工智能（Artificial Intelligence）技术水平的不断发展和成熟，无人驾驶、语言识别、智能家居以及专家系统等成果给人们的生产和生活带来了意想不到的便捷。然而，人工智能的终极理想在于理解人类智能的本质，使计算机能做到人类心灵所能作的任何事情甚至更多。总体看来，人工智能的技术路线主要还是计算式的，依然是在进行某种信息处理，“计算机就是在做信息处理”，这已成为人们约定俗成的共同信念。所谓信息处理就是按照“预先编好的程序对有限种符号的有限长序列做有穷的变换，以得到一组新的符号作为结果”，[^(\[49\])](#chapter005.html#m49)人工智能的两个派别——强人工智能（strong
    AI）与弱人工智能（weak AI）都是在以计算的方式模拟人类认知能力，从本质上而言，人工智能（不论强弱）是物理符号系统假设的产物。在纽厄尔和西蒙看来，所谓物理符号系统假设，是指对一般智能行动来说，物理符号系统具有必要的和充分的手段：“必要的”是指，任何表现出一般智能的系统都可以经分析证明是一个物理符号系统；“充分的”是指，任何足够大的物理符号系统都可以通过进一步地组织而表现出一般智能，[^(\[50\])](#chapter005.html#m50)一般智能行动是与人类行动相吻合的，智能的范围即行动的范围，符号是智能行动的根基。因此，人工智能自诞生伊始便在进行着某种逻辑游戏，它先是剔除了意义，也就是将全部信息作为一种形式符号加以处理，然后再将意义引入并且通过符号再现。但在德雷福斯看来，这一方法是行不通的，符号串之间的推演不足以完满表达人类世界中呈现出来的意义，他从海德格尔哲学的视角出发对这一理论假设进行了激烈的批判。[^(\[51\])](#chapter005.html#m51)窥一斑而见全豹，从他的批判中我们可以看到人工智能可以从海德格尔哲学中获取哪些重要观念，同时也要留意德雷福斯的批判对现阶段的人工智能是否仍然有效，[^(\[52\])](#chapter005.html#m52)海德格尔哲学是否真的为人工智能提供了新的理论支持，是否为“框架问题”的解决提供了新的方法与视角。由于经典认知科学和人工智能是基于规则对符号进行表征与操作，因而框架问题成为它们必然要面对和处理的难题。长期的实践和研究已经证明了该问题不可能在认知计算主义范式内得到合理的解决，于是德雷福斯和惠勒等学者将目光转向了存在论现象学，意欲利用现象学资源回应框架问题的诘难。


    ### 一 德雷福斯对传统人工智能的批评


    早在 20 世纪 70 年代，德雷福斯便敏锐地看到了人工智能发展的诸多弊端，他在 1965 年为兰德公司撰写的报告《炼金术与人工智能》给予发展正盛的人工智能以当头棒喝。在他看来，传统人工智能将人的智能视作通用的符号加工装置这一思路主要基于四个假设：①生物学假设——大脑加工信息运用的离散的计算方式相当于开关的闭合；②心理学假设——大脑是按照形式规则加工信息的设备或装置；③认识论假设——一切知识都可被形式化，凡是能理解的都可表现为某种逻辑关系；④本体论假设——存在是一组在逻辑上完全互相独立的事实，外部世界的全部信息，包括意义都能够分解为与情境无关的确定元素。[^(\[53\])](#chapter005.html#m53)在德雷福斯看来，传统人工智能预设了世界是由清晰的原子事实构成的集合体，在按照明晰的规则对情境中的行为作出精确描述之前，人们不会对这类行为有所理解，计算机只能处理明晰、确定的数据材料，但这些材料并不直接在世界当中显现，必须经过人的抽象化的操作方能产生出来，而人被比喻为能够依照规则运算数据的装置。德雷福斯认为人工智能最初的发展设想遗忘了人具有身体这一事实，结果导致研究者们过分相信人类可以形式化为数字计算机的启发式程序，他将身体视为产生智能行为的必要之物，认为其是应对情境的可靠保证，决定着人们进行实践活动的能力，“把人同机器（不管它建造得多么巧妙）区别开来的，不是一个独立的、周全的、非物质的灵魂，而是一个复杂的、处于情境中的、物质的躯体”。[^(\[54\])](#chapter005.html#m54)在德雷福斯看来，人工智能自身的“阿喀琉斯之踵”就在于它始终未能驾驭包括感觉、知觉等在内的“低阶”功能。也就是说，仍未能拥有人和动物独有的感受性的人工智能，如今却在逻辑推断及信息处理等方面表现出远超于人的水准，这不得不说是一个十分奇怪的现象。


    我们的观点是，人的智能行为和现象需要被整体地看待。康德早先便将人的认知能力划分为感性、知性和理性，他说道：“人类知识有两个主干，它们也许出自一个共同的但不为我们所知的根源，这两个主干就是感性和知性，对象通过前者被给予我们，但通过后者被思维。”[^(\[55\])](#chapter005.html#m55)感性与知性紧密地交织结合在一起，感官的构造决定了我们可以经验到的内容，知性决定了经验的形式，而人工智能对人类智能的模拟就是经验性的，不过是抽离了感觉的成分和要素，只剩下可以形式化的经验结构，并依照规则进行推理和计算。然而康德告诉我们，人类认知不是由单一的知性能力构成，试图完全依靠先验的推理是唯理论的做法（他不遗余力地调和经验论与唯理论之间的争论可能因为他看到了人类认知具有的多重维度）。休谟也认为人类的思想观念起源于感官产生的感觉经验，任何对感官的模拟只是一定程度上的，永远无法企及或达到原初感受的生动与鲜活，哪怕是最生动的思考，作为一种间接产物，也无法与最迟钝的直接感官相比。


    这样便涉及另一个问题，即人工智能与身体之间有何种关联？德雷福斯将身体视作人工智能进一步向前发展的首要瓶颈，认为如果不能破解身体与智能的关系，那么人工智能模拟人类智能行为的举动就像是在一个黑箱中寻找另一个黑箱。作为心灵模型的物理符号系统和模拟人类大脑神经元结构的人工神经网络，两者都依赖符号表征，缺乏基于具身性主体特有的诸如知觉、情感以及意向性等功能。事实证明，脱离身体来模拟智能，其结果就是仅得到了人类智能的形式化计算方面，这样理解人类认知是狭隘的，而人与世界打交道依靠的恰恰是身体，以眼睛观察世界，以肢体触摸事物。作为近代主体哲学的开创者，笛卡尔在确立了清楚明白的“我思”的同时，确立了身体与理智相区别的性质。虽然他在形而上学方面只看重纯粹的理智，但其显然意识到身体并非可以轻易弃之不论，他写道：“我不仅住在我的肉体里，就像一个舵手住在他的船上一样，而且除此而外，我和它非常紧密地连结在一起，融合、掺混得像一个整体一样地同它结合在一起。”[^(\[56\])](#chapter005.html#m56)笛卡尔通过日常经验推断身与心的融合，这说明他并没有完全抛弃身体，他仍对身体充满敬畏，依旧认为身体对心灵有着深刻的影响。然而，人工智能的经典范式在早期深化了这一对立，它代表着一种“无身认知”的思想，大脑执行全部的认知加工和信息处理过程，基于实践的考量才设计了工程学意义上的机械臂，但仅限于某些实践操作，身体完全不参与智能行动，用德雷福斯的话而言就是“躯体是智能与理性的多余之物，而不是智能与理性的必要之物”，[^(\[57\])](#chapter005.html#m57)心灵统摄和掌握一切。然而人类要以恰当的方式应对无限多的情境，不只是依靠大脑严谨缜密的思考，还有灵活的身体。在德雷福斯看来，具身性的技术路线才是未来人工智能的发展方向，他本人也提出了一种“海德格尔式人工智能”的新型构想。


    ### 二 “海德格尔式人工智能”与框架问题


    总体来看，“海德格尔式人工智能”主要是基于海德格尔哲学对人工智能的理论基石作出修正，进而希望开辟一条新的技术路线，并重新看待、评估设计智能机器的符号表征路径。在海德格尔眼中，人类在日常生活中的应对活动并不基于理性的、推理式的思维过程，心理表征不是人类智能的普遍机制。自
    20 世纪 60 年代以来，心智的计算机隐喻将表征置于智能行动的核心，表征成为构建智能体框架的关键环节。这一隐喻具有两方面假设：①计算机拥有必要方式来执行人类具有的任何智能活动，②必须将智能理解为心智的形式操作。[^(\[58\])](#chapter005.html#m58)但在海德格尔看来，重要的不在于智能体是否能够进行充分的信息表征，而在于能否在恰当的情境中运用恰当的知识恰当地解决问题。占有客观知识之多寡与人们应对所遇之事件并无多大的关联（正如一句流行语所言，“我们知道很多道理，却依然过不好这一生”），相反，后者依赖于人们与用具和系统的有效耦合，表征只有在耦合中断的情况下才会呈现。[^(\[59\])](#chapter005.html#m59)我们可以设想，如果海德格尔还健在的话，他会反对人工智能沿袭认知主义的路线，拒绝按照从信息收集到形成假设，经过推理运算后求解问题的模型。计算机作为认知主义的典范而诞生，人的智能行为可以视为一系列确定、独立的简单要素的复杂集合。所谓认知就是操作和处理大量的表征，在人工智能中则体现为依照算法进行处理的数据资料，但我们生存其中的世界并不直接呈现出这样的形式。也就是说，我们从世界直接接收到的不是离散、明晰和确定的数据信息与符号，需要内在的自动处理符号的官能加以转换。从这种意义上说，人工智能成功模拟人类智能行为的关键在于像人一样直接取用非离散形式的信息。人每时每刻都处于某一情境并经历着情境间的变动不居（这导致了人工智能所面临的语境内和语境间两个方面的框架问题），思维往往处于具体而复杂的环境当中，认知是实时的、情境中的活动。


    海德格尔式人工智能试图破除认知主义设定的信息处理模式，即“力图依据逻辑上独立的符号——它们代表着世界之中的元素、属性或原始的东西——的一个复杂的复合体来说明人的活动”。[^(\[60\])](#chapter005.html#m60)以明斯基为代表的认知主义者笃信，尽可能充分地表征存在的事实是能够解决常识难题的，但他们低估了人类常识本身的庞大体量。德雷福斯认为，深层的问题不在于存储数以百万计关于事实的表征信息，而在于如何在特定情境下辨别出相关事实。[^(\[61\])](#chapter005.html#m61)我们经常是以整体性的视角去把握情境中的对象，对象物不是以一组独立于语境的要素同我们接触，而是已经承载了依赖于语境的意义。例如，教室内摆放着一张桌子，我们是在所处的背景下一眼识别出这是讲桌/课桌，而不是餐桌或者其他别的什么东西。若只关注原初的感觉材料，比如对颜色的视觉经验，便可能隐去我们关于对象之功能或属性的认识，只有在有意义的信念系统构成的背景下，对象才能更加完整地向我们显现。


    德雷福斯将海德格尔式人工智能区分为三个阶段。


    （1）通过构造基于行动的机器人来消除表征，主要代表是著名的人工智能和机器人学家鲁迪·布鲁克斯。他提出了一个重要口号：“世界的最佳模型就是世界本身。”德雷福斯认为他的进路绕过而非解决了框架问题，他的机器人只对环境的孤立、固定特征而非语境作出反应。布鲁克斯采用了自下而上的设计路径，从知觉和行动出发来模拟原始的低等智能活动，他将智能体在动态环境中的感知与活动能力（mobility）看作高阶认知的基础，对于世界的清晰符号表征和模型反倒阻碍着人们理解认知的本质。在我们看来，布鲁克斯的设计过分追求同环境的灵活互动，只是模拟了没有信息加工过程的人类智能，人工系统对生物系统的模拟不能仅仅停留在原始智能的层次，后者严格来说并不代表生物系统（尤其是人）具有的智能水平，他的尝试和努力仍然停留在实践和经验层面。


    （2）为上手状态编程（programming the ready-to-hand）。相较于布鲁克斯，阿格雷（Phil Agre）则是有意识地汲取了海德格尔的哲学思想，他设计的机器人面对的不是现成在手之对象的属性，而是引发主体恰当反应的行动可能性。在德雷福斯看来，阿格雷对海德格尔的理解展现了新的内容，后者将器具视为引发行动的可能性，而不是具有功能特征的实体。虽然他试图为海德格尔明言的日常活动编程，但在如何面对情境的转换方面依然束手无策，他设计的人工智能面对的可能联系都是预先设定的，没有任何获得技能与学习情况出现。[^(\[62\])](#chapter005.html#m62)和布鲁克斯一样，阿格雷也是在消解而非解决框架问题。


    （3）虚拟的海德格尔式人工智能：嵌入、具身以及延展的心灵。与前两者不同，惠勒是在为行动导向的表征进行辩护，认为自己提出的“具身—嵌入式认知科学隐然是一种海德格尔式的冒险旅程”。[^(\[63\])](#chapter005.html#m63)他赞同德雷福斯的观点，即笛卡尔与海德格尔在形而上学层面的哲学僵局可以通过认知科学以经验方法加以解决，且海德格尔的思想为心智和智能的非笛卡尔式概念化提供了令人信服的模型。在德雷福斯眼中，惠勒的行动导向式表征相比于布鲁克斯之前的人工智能而言是倒退了，他对海德格尔作了认知主义的误读。他的理由是，既然是依托在世存在构建新的具身—嵌入式认知科学，那就不能掺杂任何形式的表征，因为在世存在作为人的生存背景，比思维和问题求解更加基本，在世本身亦非表征。也就是说，我们与器具打交道是全神贯注的，是不会停顿的进程，其中弥合了因为表征所造成的内外差别与对立。德雷福斯认为，惠勒的新表征路径依旧面临框架问题的诘难，尽管惠勒宣称自己的海德格尔式认知科学预示了解决框架问题的可能性，但根据德雷福斯对海德格尔的解读，所有表征性的说明都是有问题的，尝试以在线的表征状态触碰框架问题即徒劳。


    我们看到，海德格尔式人工智能的几种版本在德雷福斯眼里都不够“海德格尔化”，它们仍无力解决日常世界的复杂相关性，而这是人们惯常的能力。人们之所以能够对世界中的变化作出反应，根本上是因为其有着具身性的应对能力和梅洛-庞蒂所谓的“意向弧”，而不是通过信念、表象以及图式等表征形式关联外部世界。概言之，真正意义上的海德格尔式人工智能是不包含任何表征成分的，否则便称不上是基于海德格尔哲学的假设。在德雷福斯看来，这种尝试成功的关键在于模型能再现人体验意义的独有方式。在大多数情况下，我们可以准确地把捉与自身紧密关联的要素，而不是眉毛胡子一把抓，这样意义便凸显出来了。怎样才能像人一样在世界中智能地行动，靠的不是心灵表征，而是在线的身体行动，这才是海德格尔式人工智能成功的关键，也是德雷福斯着重强调的核心主张。和惠勒一样，德雷福斯借鉴了海德格尔关于“此在”“被抛”的论断，然而，如何模拟人“被抛入世”的生存现象，也就是将“被抛”形式化和机制化，这成为他们共同需要阐明的问题。


    ### 三 存在论现象学对“框架问题”的介入


