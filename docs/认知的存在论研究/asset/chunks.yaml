- raw: '概言之，认知研究需要而且应当考虑文化传统等历史性、情境性要素，正如伽达默尔所主张的，我们不能脱离自身的历史。前见是先于一切的绝对知识和状态，如果说这一主张是独断论和抽象的，那么彻底抛弃前见的主张亦是一种独断论。前见作为人类理解和认知的历史传承物，摈弃它意味着切断了人类理解自身所有的意义连续性。对一切前见的根本贬斥本身也是一种前见，这展现出前见对于人类理性的绝对影响，同时支配着我们的理解意识。理性对于我们来说只是作为实际历史性的东西而存在，即根本地说，理性不是它自己的主人，而总是经常地依赖于它所活动的被给予的环境。[^(\[54\])](#chapter006.html#m54)狄尔泰将“体验”作为理解的基础和出发点，是最初的、先于意义而存在的东西，生命体验汇入了被理解的对象，虽然他也认为个人总是在历史和社会的关联中被理解的，但其最终根据是个人的心智，也就是基于个体性。但在伽达默尔看来则恰恰相反，“体验”的内在意识不能架起一座通向理解他人的桥梁，历史和社会传统产生的前见对于任何“体验”总是具有“先行决定性”。早在我们通过自我反思理解我们自己之前，我们就以某种明显的方式在我们所生活的家庭、社会和国家中理解了我们自己……因此个人的前见比起个人的判断来说，更是个人存在的历史实在。[^(\[55\])](#chapter006.html#m55)这样的历史实在是被全部个体所共享的情境，它构成了我们认知对象、理解他人的基石。


    第三，我们还应该看到，诠释学强调的情境关联还与时间性有关，也就是说，理解和解释不是在静态、非时间的范畴中进行。人的理解具有前结构这一事实说明理解是一个具有历史性和时间性特征的概念，它关涉到我们自身历史地形成的对世界的认知架构。可以说，我们是在历史地形成的世界中展开活动的，理解等认知活动和过程都是在时间性的模式中进行的。也就是说，一个人既是在当前情境中与事物相照面，也是在回忆（他历史地形成的认知架构和模式）和预测（他的理解投射到未来的方式）的基础上与事物照面。认知并不是外在于时间的一种静态活动，它处于时空某一特定的位置，不同时空条件下的认知呈现的结果也有可能不同。因此，关于认知对象的把握和理解，不能只在空间的、静止的以及非时间的概念知识的范畴内进行，认知过程是动态的、时间的。它不是仅仅涉及人类心智的某一部分功能（比如信息加工和表征计算等等），人的自我理解同样发挥着重要的作用，换言之，我们总是理解地认识着对象世界。从某种意义上说，计算不是人类智能的单一本质，在计算力之外更多体现的是一种理解力（该能力有可能是进化选择的结果）。彭罗斯认为，“对我们遥远的祖先而言，会做复杂数学问题的特殊能力很难构成选择优势，而所需要的是一般的理解能力”，[^(\[56\])](#chapter006.html#m56)这也是人工智能面临的主要难题之一。相较于人，计算机在处理和应对复杂和庞大的科学计算时具有明显的优势，但是却不能理解计算本身的意义。如果计算机的设计不能改变传统的依靠编码程序运行的方式，便很难触碰人类认知中居于更高层面的理解领域。[^(\[57\])](#chapter006.html#m57)


    第四，诠释学的引入使得我们对人类认知有了新的划分。根据维斯特林（Veronica Vasterling）的观点，人的认知也是意向的理解活动，主要包括前反思性的直接理解（direct
    understanding）与反思性的叙事理解（narrative understanding）。在她看来，直接理解是人们在日常生活中基本的认知模式，它是人在世界中同其他事物、事件和情境进行非反思性交互的认知维度。[^(\[58\])](#chapter006.html#m58)它类似于我们关于世界的整体性、直接性的感知能力，当我们环顾四周时所看到的不是形状和色彩的斑块，而是书本、电脑和水杯，当下的直接理解暗含着记忆的影响，能够被人直接理解的对象早已内化于个人的记忆当中。如果说直接理解的对象是我们熟悉的东西，比如婴儿对勺子的理解基于行动和解释可能性的前反思的熟悉，当他能够熟练地用勺子吃饭时，我们会认为他理解了勺子的功能。那么，叙事理解应对的则是陌生的对象，当我们试图理解不熟悉的某物或者向他人解释某一行为、境况或技能时，通常便会陷入叙事理解。[^(\[59\])](#chapter006.html#m59)与直接理解不加反思地为我们呈现出恰当的行动可能性相比，叙事理解是对行动和解释蕴含的可能性进行的反思性探究。直接理解构成了我们日常认知活动的默认模式，叙事理解则是对直接理解的进一步阐释和延伸，而这种阐释和延伸往往以语言为中介，比如我们习惯性地社会互动。由于交互性的实践在很大程度上与习惯相牵涉，比如遇到熟人习惯性地寒暄与打招呼，而遇到陌生人则需要思考恰当的言语内容和行为。因此，维斯特林认为叙事理解的反思实质上是一个程度问题，习惯使得叙事理解能够近乎直接理解的非反思性，以至与直接理解几乎没有区别。[^(\[60\])](#chapter006.html#m60)


    此外，叙事理解还包含命题理解，也就是“雪是白的”这类具有真值的谓词陈述。由于命题理解需要以语言作为载体，因此这一理解形式可能是叙事理解的一个部分或子集，它内嵌于作为整体的叙事理解当中，反过来说，后者是命题理解的意义背景，我们是在叙事理解的整体描述中判断命题理解的真值条件。比如，母亲告诉我玻璃很干净，但在角上有一点脏的痕迹，她的话语表达了对我所做之事的满意程度，经过仔细检查后，我可能会回答：“这只是一道划痕，根本擦不掉。”这一回答纠正了她话语中包含的谓词陈述。叙事理解表现了人们对所处情境的完满解释（thick
    interpretation），其中包括个人的情感状态（满意）、评价（玻璃很干净）、关切（玻璃角有脏痕）以及目的（擦掉脏痕）。概言之，人们通过熟悉自己所栖居的世界的行动和解释的可能性来实现直接理解，考虑到习惯和语言因素的影响，在某些情况下我们很难将叙事理解和直接理解区分开来，因此两者之间是相互重叠的关系。命题理解是叙事理解的子集，某人具备叙事理解能力也意味着他能够理解命题。


    我们看到，诠释学的构建是基于一种行动和解释可能性的整体网络，非诠释学认知是对这一可能性网络的抽象，因而属于表征认知的范畴。维斯特林认为，诠释学认知作为一种低阶认知确立了人的实践知识、技能、常识以及朝向世界的根本趋向，表征认知从实践维度、存在维度和逻辑维度上依赖于诠释学认知。[^(\[61\])](#chapter006.html#m61)“在世存在”的生存特征给予了人们诠释学认知模式的可能性，诠释学认知表明人们总是居于某一特定的世界背景并在世界中活动。人工智能和相应的人工认知尚不具备这种诠释学认知的能力，它是以一种非诠释学的表征框架来呈现人们日常接触的现象，它的解释路径是自上而下的，诠释学认知采取的是类似于进化论和具身认知的自下而上的路径。由于人工智能是在执行或操作着机械过程或算法，并以数学化、信息化了的人工语言和算法取代了基于行动和诠释的可能性，因而缺失了人们在生存维度上具有的丰富语义内容，客观上使得遵循这一技术路线的人工智能不会具有类人的理解力。


    ## 小结


    在我们看来，人的理解从某种意义上仍然可以被视为人类认知的范畴，是一种认知现象。海德格尔认为源始的理解是某种实践知识，在一般的存在者层次的意义上，理解是指“‘能够领受某事’、‘会某事’或‘胜任某事’、‘能做某事’”，[^(\[62\])](#chapter006.html#m62)我知道如何处理手头正在做的事情，如何能够在合适的情境中做出恰当的行为。因此，对某一事物（例如锤子）的理解不以知晓该事物的具体知识为前提，最源始的理解就是知道如何上手操用器具。德雷福斯认为这是一种实践性的应对活动，他以锤子为例，说明领会（理解）一把锤子并不意味着知道如下事实：锤子拥有如此这般的属性……或者为了进行捶打，人们遵循某种程序，即把锤子抓在手里，等等。[^(\[63\])](#chapter006.html#m63)然而我们认为，海德格尔似乎过分迷恋像拿锤子敲击东西这类活动了，活动的过程与机制过于单一，锤子这样的工具也过于简易。如今，人们使用的工具已愈来愈智能化和精密化，复杂程度也愈来愈高（例如人工智能），以至我们在使用时需要先了解工具特有的属性并且熟悉它的使用方法，而并非无缝衔接地上手操作。人工智能的迅猛发展使得工具不再以上手的方式与人照面，人以一种审慎的方式视见着工具。简单的锤打能够使我们达到/获得关于锤子的最为源始的理解，而非上手或无须上手的工具是否也能得到同样的结果呢？海德格尔并未予以明确的分析和讨论，从这种意义上说，海德格尔与德雷福斯所谓的“熟练应对”并不能完全取消认知表征。


    总之，我们重视诠释学并认为它对阐明和解决认知相关问题是有所助益的，希望将认知纳入诠释学的框架中进行新的解释，并不试图构建一种彻底颠覆人类旧有或传统的描述方式。在我们看来，诠释学能够给予认知研究最核心的启发就在于使我们意识到“前见”是人类认知和理解活动中不可缺少的环节和组分。[^(\[64\])](#chapter006.html#m64)它不是凌驾于认知主体之上的观念或信息，而是能够被心智予以修正的知识体系和信念系统，甚至心智本身都是处于由人的历史存在造就的前见之中，心智不是一个容纳知识和信念的器皿，前见就是它具有的认知状态，[^(\[65\])](#chapter006.html#m65)改变、修正前见也是一种自我认知的过程。人类认知是一个同世界相交互的意义建构的开放循环，认知不是知识积累的单向、均匀的线性过程，而是行动和解释的可能性网络与认知对象之间循环往复式的运动，也是通过视域的不断融合而逐步发展的非线性过程。诠释学以其特有的方式反映了人类认知的复杂性：认知不是主体认识结构中某种结构单独作用的结果，也不是各种结构的机械相加造成的加和性（迭加性），而是由前理解、成见中蕴含的由知识能力结构与驱动调控结构组成的心理结构，理解中使用的相关文本与语言媒体组成的工具结构，认知主体的历史性中蕴含的认识关系结构等，在视域的交互作用中产生的整体涌现的结果。[^(\[66\])](#chapter006.html#m66)前见使我们对自身的历史存在有了明确的觉知，认知过程并非主体不断地自我否定，从而获得一种毫无偏倚、不受任何前见“污染”的认知结果，而是主体始于“前见”足下，由已知迈向未知的脚手架与参照系。人类认知由此呈现出开放性特征，拓展出了向未知的无限开放性。


