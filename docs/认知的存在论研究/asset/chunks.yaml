    # 第三章 存在论认知的核心论题分析


    认知哲学作为研究人类思维的学科，关注的是“认知是什么”“心智是什么”等元问题，目标在于着力厘清“认知”、“智能”以及“心智”等诸多核心概念。然而，随着以脑科学和神经科学为代表的认知科学的发展，对人类认知和心智本质的探讨呈现出“百花齐放、百家争鸣”的景象，这恰好反映出认知科学哲学没有形成库恩意义上的“范式”和统一的研究纲领，各种研究进路依旧在相互竞争，特别是关于认知是纯粹的心理表征，是基于符号的处理操作，还是心智与外部世界相互作用的结果的讨论。哈尼什将经典认知科学依据的基本假设总结为以下三点。[^(\[1\])](#chapter004.html#m1)


    （1）认知状态是具有心理内容的计算—心理表征的计算关系。


    （2）认知过程是具有心理内容的计算—心理表征的计算操作。


    （3）计算的结构和表征都是数字符号的。


    人类的智能行为是由类似于数字计算机之运行方式的内在心理过程所引起的，也就是对符号或要素进行复制、组合、创建、清除、存储以及检索等操作。以传统观点来看，我们的思维和推理就是类似于这样的活动。对符号表征的建构、提取等能够解释诸如专家推理、逻辑演算等各种心理过程，有些激进的认知科学家所主张的涉及人类智能行为的心理过程，就是依据规则对符号表征进行具体操作，大脑的运行方式除此之外再无其他。在我们看来，这样的强认知主义立场虽然充分体现了对人类理性的尊重与敬意，但却忽略了对情境维度（包括历史与文化）的考量，忽略了认知是从生物世界中的有机体中生发出来的东西。之后的研究进路认识到了这一点，开始强调大脑、身体与世界之间实时的动态耦合，在认知行为的生成过程中赋予三者以平等的地位。这在很大程度上是受到了海德格尔存在论现象学的影响。我们认为海德格尔给予认知科学的重要启发在于，人们总是基于自身与世界亲熟的情境性来确定存在的意义，而这种意义并不是现成事实与规则给予的，主体在世界中的流畅行动与认知不是基于了解大量的事实与规则（这些规则与事实告诉我们应该如何应对不同情况），而是基于自身的兴趣与需求。前述对概念的界定与分析已经指明情境性是如何构成人存在结构的本质部分，以及情境性如何渗透到人类认知和实践的各个方面的。然而我们需要注意的是，海德格尔提供给认知科学的有益启发不仅仅在于他指出了人类主体的本质是一种情境式的而非嵌入式的属性，被广泛提及的“在世存在”作为第二代认知科学研究纲领吸收的核心观念不能全部涵盖海德格尔对认知科学的全部贡献，他对上手活动与应手活动的区分以及对因缘的讨论也值得我们作进一步的研究。这一章节的目的在于澄清海德格尔的存在论现象学之于认知科学的理论洞见并概括为具体的命题，揭示前者所产生的建设性作用。


    ## 第一节 以上手的动态认知取代静态的静观认知


    通过阅读哲学史，我们可以看到，笛卡尔的理性主义在胡塞尔那里达到了真正的巅峰，世界的实在性在严格的现象学还原下“消失”了，世界本身成为先验自我的意向相关项，纯粹意识成为一个绝对自明的开端和基础，而“先验自我”和“纯粹意识”被视为绝对的存在。因此，在我们看来，笛卡尔的心身或心物二元论被胡塞尔的意识一元论取代了，后者宣扬了一种更加深刻和自由的主体性，在排除了前现象学、前反思的世界信念之后，胡塞尔在纯粹内在的意识领域将世界意向地重建，主体与客体之间的认知关系因而首先呈现为一种意向性关联。海德格尔承袭了胡塞尔的这种认识论描述，但拒绝接纳意识本身的先验特征，强调从人（此在）的生存维度理解实践和认知活动，强调对存在状况的本质理解。从这种意义上讲，海德格尔的存在论现象学似乎也在排斥胡塞尔所指的关于世界之自然态度的一般设定：“世界”是客观的、物理性的，主体具有关于它的信念。客观是指世界由独立于主体经验的物质、属性、关系和事件构成，它的存在不以主体的意志为转移。借此摆脱主客二分的笛卡尔主义认识模式，即一种感官—表征—规划—行动的认知主义模式，[^(\[2\])](#chapter004.html#m2)重视认知主体与情境化和背景化了的世界的实时交互，海德格尔认为我们总是居于一个有意义的世界中，它给予我们行动的可能性，若要依照笛卡尔的认识论路线理解主体与客体，很可能会缺失对“此在”在世的存在论理解。“此在”在世的根本方式之一就是将自身置于一种“上手关系”中，即一个由工具、目的和世界共同构成的关系网络，[^(\[3\])](#chapter004.html#m3)使事物以上手存在的形式来与他照面。我们可以看到海德格尔发现了先于认知状态的行动本性，从而以一种动态的、原初的上手活动取代了静态的、瞠目式的静观认知。


    ### 一 静观认知以“计算”为特征


    一门新的科学的诞生通常始于一个过于简化的自我概念（self-conception），这些概念的定义往往是否定式的，更多的是通过指涉它们所要取代的事物来进行定义，即通过它“不是什么”来确定自身所属的范畴和具有的概念内容，而不是通过对其新的主题本质的深刻理解来获得定义。[^(\[4\])](#chapter004.html#m4)认知科学也不例外，它的出现源于对沃森和斯金纳的激进行为主义的回应，因此，认知一开始被设想为人类心智内部的信息处理过程，以某种方式超越了传统行为主义主张的条件反射。认知主义旨在以内部的表征状态为基础进行计算，从而解释和预测等具有复杂形式的高阶认知行为（如计划和推理）。然而，事实证明这样的认知解释并不充分，描述人类认知的计算草图遭遇了挑战，从严格意义上说，认知过程并不限于非动态的脑内的神经计算过程。相较于显性、动态的行动，大脑内的计算就是隐性、静态的，从某种意义上说是一种静观认知，它在很大程度上忽略了大脑、身体和环境之间错综复杂的交互形式，而人类认知的灵活性往往体现为这些互动。归根结底，问题在于认知的核心特征是什么，是计算还是海德格尔所谓以目标为导向的上手活动。


    按照我们的理解，经典的认知主义（Classic Cognitivism）可以被看作一种静观式的认知形式，其核心主张是：心智基本上是一个在大脑内部操作符号（亚符号）表征的信息处理系统；认知本质上就是该系统的计算过程，人类认知主要是一种“离线”的“心理体操”（mental
    gymnastics）活动。[^(\[5\])](#chapter004.html#m5)这一活动与身体的联系并不紧密，认知与身体和外部世界的交互往往居于次要地位，离线的信息处理主要关涉内在的表征计算，它不受主体的身体和所处环境之特征的约束。静观认知的重心在于心智具有的诸多内部状态，主体的认知过程就是内部状态和环境中存在的一系列可能的外部状态之间的耦合、调节与映射，外部状态的变化与波动需要根据内部状态作功能主义的解释。认知主体以自身从经验活动中总结、抽象出来的一套形式系统和算法规则来揭示对象世界的意义，认知就是信息符号的操作加工，也是依据逻辑规则进行的心理状态转换。对于静观认知而言，它将心智的计算过程同主体外在的物理行动相关联，计算属于认知系统的内部状态，是对外部世界的符号化与形式化过程。主体的主要认知路径是瞠目式的，他只将大脑作为唯一的认知器官，而忽略了脑外的身体部分。总体来看，认知主义和联结主义等形式的静观认知遵循的是自上而下、由内而外的途径：从自上而下的意义来说，其模拟的智能核心始终是人的大脑，不论是作为整体的中枢系统还是大脑内部的神经元活动，大脑始终作为人类认知和智能活动的唯一基础和载体被模拟和建构，认知是依托符号表征进行的基于规则的计算活动；从由内而外的意义来看，认知主体总是从自己内在具有的信念出发去推测和构造关于外部世界的观念、判断与评价，换言之，他只需要考虑自己的心智状态，这可能是笛卡尔的“我思故我在”包含的另一层内容。概言之，静观认知是一种秉持内在主义和大脑中心立场的认知形式，人们主要不是以身体（比如海德格尔所谓的“手”）认知世界，而是依赖以概念、范畴、规则为主的推理形式反映世界，计算是其特征。相较而言，海德格尔提出的上手活动处于一种以动态方式关联世界的向度，不是计算性的，而是实践性的，“上手操用”是其特征。


    ### 二 动态认知以“上手操用”为特征


    如何超越经典、传统的认知主义和联结主义的认知范式，新的认知科学研究进路从海德格尔哲学那里获得了重要的思想启发，后者对于传统笛卡尔认识论的批判以及“此在”生存结构的分析为人们提供了有效的理论洞见。


    在人与事物、环境的关系方面，海德格尔赋予了上手状态以新的原初地位（同时我们也应该注意，海德格尔对行动的过分专注可能有滑入行为主义的风险），他特别强调这一状态在解释“此在”生存方式上的优先性，强调用具的情境式使用在某种意义上先于对事物的纯粹观看，而且被使用所绽露的东西在存在论上比由超然沉思所绽露的带有确定的、无背景的属性的实体更加根本。[^(\[6\])](#chapter004.html#m6)也就是说，理性的沉思所生成的认知经验与语境是无关涉的，是一种去情境化的，与行动保持中立的观念，意义是内生的，是主体通过自身具有的心智内容与客体相关联的产物。海德格尔认为以这样的传统模式进行认识论的阐述并不恰切，这和“此在”在世的存在状况并不相容，他是将主体与客体纳入“在世存在”的框架中予以理解的，“此在”的在世不是占有空间的世界包围着“此在”，后者在其中生存着，也就是不能从存在者的层次看待和描述“此在”在世的存在状态。因此，我们不能理所当然地把对认知客体的主体的传统阐述当作我们对在世的研究的基础。[^(\[7\])](#chapter004.html#m7)


    在海德格尔看来，破除笛卡尔主义迷雾的钥匙就隐藏在我们日常的操劳应对活动中，通过用具的使用而把捉到的东西与世界本身更具有亲缘性，有可能弥合笛卡尔制造的外在之物与内在之心智现象之间的鸿沟，纯粹的知觉认知很难切近对象本身，操作事物并使用它们的操劳活动才是正确的通达其本身的方式。[^(\[8\])](#chapter004.html#m8)也就是说，出现在心智面前或在其中呈现的不是“纯粹的事物”，胡塞尔认为我们应该关注事物显现于我们的模式或方式。海德格尔在某种程度上遵循着他老师的现象学还原方法，也就是从对事物的反思和审慎的沉浸中退回，事物仍在我们面前，不过是更换了一个新的观察角度，即严格按照如其所是的体验去观察事物，这样的体验就是流畅、无障碍地使用用具。依照他的观点，如果我们只把对象当作单纯的物来理解，就会错失或掩盖它本身可能涉及的“此在”的操劳现象，“沿着当下给定的”物去追问，得到的是一连串诸如质量、颜色、密度以及是否易燃等物理化学性质，而这些性质完全没有涉及在操劳之际照面的事物的现象性质。[^(\[9\])](#chapter004.html#m9)


    也就是说，对象物的用具性质并不顺适于专题式的认知活动，对用具的纯粹凝视和观察不是最恰当的了解方式，只有在使用它的操劳活动中，才能使用具是其所是的属性显现出来，也只有在这时主体与工具的源始关联才会出现，也就是海德格尔所言指的上手的存在方式。这才是用具的“自在”，对摆在眼前的东西的静观，无论多么敏锐，都不能揭示上手的东西，“理论考察”缺乏对上手状态的领会。[^(\[10\])](#chapter004.html#m10)


    然而，我们需要注意的是，随着科学技术的发展和进步，本来由人的身体承担的实践已经可以由身体之外的技术工具或系统加以实施，一种新的延展实践应运而生。这种实践活动在某种程度上已无须上手，身体的活动转变为体外延展系统的活动。或者是人基于计算机的“指控”，即通过手指敲击计算机，向其输出自己的实践意念，从而控制延展系统工具的运作；或者是人的实践意念通过脑机接口实现对计算机和机器的控制。两者的共性是，人所承担的职能都是信息控制而非直接的物质变换操作。[^(\[11\])](#chapter004.html#m11)从某种意义上说，海德格尔与德雷福斯所讲的上手活动似乎可以被延展的实践形式所消解，大脑或心智中的信念在这一特殊的实践形式中占据了主导的控制地位，人与用具的关系发生了变化，需要予以重新界定，这样便引发了关于上手状态的新的哲学思考。

