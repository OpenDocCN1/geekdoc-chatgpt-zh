    \n[\\[47\\]](#chapter006.html#w47) 我们认为，理解作为深植于语境之中的东西，它建立在先于语言的某种东西之上，也就是说，一切前判断的单纯视见，其本身都已经是正在理解着的视见了。\n\
    \n[\\[48\\]](#chapter006.html#w48) 在伽达默尔看来，科学认知和理解之所以要完全排除前见，是因为要遵循笛卡尔的普遍怀疑原则，即不把任何一般可以的东西认为是确实的。前见可以划分为两种类型，即产生于人的威望以及过分轻率的判断。从某种意义上讲，正是人类理性的强化使得人们认为自己的普遍行动能够摆脱前见的束缚，因为只有理性才是权威的最终源泉，一切都要放到理性的审判台上加以权衡，是理性赋予了前见可信性，同样，理性也可以将这种可信性移除。\n\
