    ## 第四，人工智能自身蕴含的认识论的逻辑理路与人的理解不同

    众所周知，当前的人工智能主要被划分为三大流派：以好的老式人工智能为代表的符号主义、以深度学习为代表的联结主义和以智能机器人为代表的行为主义。它们背后秉持的认识论是理性主义、经验主义、控制论以及具身理论。证明当前的人工智能是否具备理解力的一个关键点就在于考察其认识论逻辑是否与人类理解的内在逻辑相契合，下面我们予以简要分析。


    对于符号主义进路的人工智能来说，世界本身就充斥着逻辑和符号，是由清晰的原子事实构成的集合体。它以演绎推理为基础，以逻辑分析为方法，从信息加工的角度来研究人类认知，认知过程以计算—表征的模型展开。然而，符号主义人工智能采用的方法一直为人们所诟病，也就是将心智还原为符号化的抽象层次，因而往往难以描述和把捉人类心智的丰富内容。可以说，经典算法及其相应的符号主义人工智能较为成功地模拟了人的左脑的抽象逻辑思维。[^(\[35\])](#chapter006.html#m35)它是以推理和计算为主要代表的理性思维，但人类理解作为一个复杂的、有着多重维度的现象，还包括直观、感受的体验以及诸如“山重水复疑无路，柳暗花明又一村”这样带有神秘主义色彩的顿悟。为了应对在世界中遭遇的复杂、不确定的事实，我们自身的理解结构也呈现出复杂性和不确定性的特征。符号主义人工智能的逻辑结构奠基在规则之上，是以规则统摄信息/数据，但在成功地复制高阶认知能力（比如运算、推理或下棋）的同时却将世界过于简化，故而在复杂的事实面前陷入困境、手足无措。显然，符号主义人工智能的逻辑理路并不是滋生人类理解现象的土壤。


    同样是“自上而下”的设计路径，以深度学习为代表的联结主义人工智能是以信息/数据来总结规则。通过模拟大脑神经元网络的效用机制和原理，将全部计算发散到人工神经元之间的动态联结，将信息存储于各个神经元之间的连接突触，计算不再由中央处理器集中进行，而是一个并行分布式的过程。基于深度学习的联结主义人工智能抓住了人类认知的自主性和适应性特征，通过“学习学习再学习”的强化机制涌现出智能，人工智能因此产生了某种自我进化、自我超越的能力和态势。然而，对以模拟人的学习能力为基础的人工智能能够涌现出类人的理解力的观点，我们持怀疑态度。人的确是通过学习获取知识、认识世界从而改造世界的，这种“学习认知也使得人具有了指称、定义、理解和构造对象、事实和世界的认知能力”。[^(\[36\])](#chapter006.html#m36)深度学习的实现以人类专家提供的大量专业信息数据为逻辑前提，但人的理解活动并不必然地需要专家知识的填充。另外，由于深度学习系统是在输入信息和目标信息之间构建一种非线性的映射关系，因而它的算法具有某种不透明性，甚至不可捉摸，出现连设计者都无法理解的神秘“黑箱”，也就是所谓算法不可知的问题，这一类型的人工智能“只知其然而不知其所以然”。相较而言，人的理解是清楚明白的，不是神秘“黑箱”的输出结果，我理解意味着我知道自己为何理解，除非进行自我欺骗。因此，逻辑上不透明的算法不能实现逻辑自明的人类理解，以深度学习为代表的联结主义人工智能也无法具备类人的理解力。


    行为主义人工智能所秉持的认知观是：智能源自感知和行动，它是在与环境的相互作用中得以体现的，认知就是身体应对环境的一种活动，是智能系统与环境的交互过程，是在不断适应周围复杂环境时所进行的行为调整。[^(\[37\])](#chapter006.html#m37)它取消了符号表征和逻辑推理，强调智能系统在世界中的自适应行动，“通过建构能对环境作出适恰应对的行为模块来实现人工智能”。[^(\[38\])](#chapter006.html#m38)在我们看来，这一系统形成和展现出的行动与人类本身的行动是不同的，前者呈现刺激—反应的映射关系，后者呈现的是理解关系，行动是理解的外化，人既因理解而行动，又在行动中丰富着理解，而行为主义人工智能模拟的行动之中并不包含理解的要素。换句话说，通过模拟人的行动而设计的人工智能也不具有理解力。


    总体来看，一方面，当前流行的人工智能关注的是“人如何认知”以及“人如何行动”的问题，希望以对人类计算力和行动力的成熟模拟和分析为跳板，跃入更高智能层次的理解力。从某种意义上说，它们实现的是各自意义上的“理解”：推理计算、学习和行动，这些都是人类理解的片段或部分，它是兼蓄理性、体验、直觉和行动的复杂现象。另一方面，人工智能蕴含的内在逻辑仍然是离身认知的，不论是深度学习、强化学习还是类脑人工智能，都在刻画人类神经系统的运作细节，模拟神经回路的计算，却将认知的具身性忽略了。人类理解之所以复杂，根本原因可能就在于大脑不是唯一的理解器官，还有身体的参与，人工智能的算法依赖的是“硬件”，而人的理解则是靠“湿件”。


    人工智能的发展使人们产生了其具有类似于人类理解力的期盼，但基于哲学解释学的分析后我们看到，人的理解是基于前见的自我反思活动，自产生便具有某种反思因素。就此而言，目前的人工智能尚不具备类人的理解力，它不像人一样具有理解的“前结构”。作为理解之“循环”过程的关键环节，前见是我们正确对待人这一有限、历史的理性存在时需予以重视的概念。人类理解无法从历史的直接缠绕和伴随着这种缠绕的前见中解脱出来，理解的历史性因之向人们呈现，而这恰是人工智能缺失的维度。任何关于人工智能理解力的讨论都应严肃看待理解本有的历史之维，它是人的理解自身的本质特征。人工智能的设计者试图使之具有“理解之心”，但后者缺失了与历史之间的意义关联。当前人工智能的主要流派都是从各自的维度朝着“理解力”的金字塔尖推进，它们实现的只是一种“人工理解力”，仍然没有实现带有自然和文化属性的人类理解力。如果能够出现将计算、学习和行动相整合的“超级人工智能”，也许实现人的理解力是可能的，但就目前而言，人工智能的“理解之路”依然道阻且长。


    ## 第四节 诠释学对于认知研究的意义

    以派利夏恩（Zenon W. Pylyshyn）等人为代表的传统认知科学主张，人的心智是一种表征结构以及在这种结构上进行操作的计算程序，并通过计算来对认知加以解释和说明，这就是心智的计算—表征假设。派利夏恩在其代表作《计算与认知》一书中指出，计算是心理行为的实际模型而不仅仅是模拟，计算过程与认知过程应由同样的方式形成，人的认知与计算之间存在很强的等同性。[^(\[39\])](#chapter006.html#m39)心智是对符号表征与代码的操作，关于认知行为的解释基于三个层面：功能层面、符号层面以及语义层面。心智的计算理论强调三者缺一不可。概言之，在一般人看来，认知就是一种计算，认知主义的愿景在于成为认知科学的基础假设，而且这在很大程度上已经得以实现。虽然遭受前所未有的冲击，但计算依然是可以将支离破碎的认知科学各片断连接起来的稳定要素，从而使得后者避免成为一个形式松散的学科联盟，并具备某种普遍的共性，即心理表征是理解人类认知活动的理论设定，计算是理解人类认知机制的核心。这种认知的信息加工理论或认知主义（也称为符号主义）的强大立场使人们几乎达成了普遍的共识——人类认知应被理解为基于规则对符号表征的计算过程和活动。虽然之后兴起了以具身认知为核心的新的认知科学研究纲领（注重身体体验以及主体与情境之间的互动），它认为以表征和计算为核心的认知解释不能真实地理解和再现人类的认知现象（尤其是知觉、情感和体验等低阶的认知现象），但又无法视之为无用之物而被彻底摈弃。正如有学者指出：“随着新知识和新理论的不断涌现，表征—计算这一经典假说由于其局限性受到了广泛的挑战和质疑。但目前解决问题的最好的方法仍是对这一假设不断修改和完善，而非彻底抛弃它。”[^(\[40\])](#chapter006.html#m40)这在很大程度上反映了计算与认知难以割舍的关联，也表现出人对于认知精确性和确定性的不懈追求：认知，需要精确的描述。形式化是最为普遍的做法，思想与观念的推演完全是程序式的，符号自身含有的各种可能解释被搁置不论。这种类型的理解已然变成了一种根据某些句法规则进行的无意义的符号游戏。一般而言，形式的符号处理机制缺乏重要的灵活性与可塑性。也就是说，虽然该机制可以产生任意的输入—输出函数，但如果输入的符号是确定的，那么可输出的结果也只有一个。然而，人类认知与思维具有发散性的特征，诸个体对同一信息的理解可能不同，即便是同一个体，在不同时间段对同一信息的理解也会有所差异。也就是说，理解作为一种人类认知形式可能并不适合符号的输入—输出机制。这样的实践会遇到一个显著的困难：潜在的输入—输出函数太多，我们无法用有限的指令集合，或任何其他有限的手段来确认它们。[^(\[41\])](#chapter006.html#m41)


    正如我们在前述中指出的，理解不能通过函数式的输入—输出机制进行窥视，因为理解并不单纯显现为一种认知模式。按照海德格尔的说法，理解是“此在”的一种存在方式，“此在”的生存意义在于对世界的敞开，也就是同世界上的其他人或者事物在时间与空间维度上的交互，理解作为一个诠释学术语代表着这一敞开的认知维度。海德格尔创造性地将人类理解置于“在世存在”的框架内进行描述，我们作为“此在”皆“被抛入世”，理解被海德格尔描述为一种被抛的筹划，并根据理解的诠释学循环来解释人类认知的结构。作为一种认知活动形式，人类理解是一个与世界进行意义建构的开放循环，它始于“此在”先验地具有的与世界之间的前反思性的亲熟，这一循环结构之所以是开放性的，原因在于理解本身是一个具有差异性的筹划，我们自出生伊始便与之亲熟的世界和我们通过理解来维持和改变的世界是不同的。


    正是这一条件使理解与解释得以可能，也就是说，我们在进行理解和认知活动之前，必须首先发现自己，发现我们自己“在那儿”。烦心（care）、忧虑（anxiety）等情绪体验在海德格尔看来都揭示了“此在”与现实的关联，它比主—客关系更加根本。在认知中，我们把对象放置于面前，但将我们置于世界之中（也就是“在-世界-中-存在”）使得我们对情境的感觉先于对对象的感觉。因而在海德格尔眼中，认知的目的不是把握某种对象事实，不是去揭示在先地包含于对象中的意义，而是领会和揭露它所指示的存在可能性。解释是一种说明，同时可看成是一种理解的进展，它是“领会（理解）使自己成形的活动”，“解释并非要对被领会的东西有所认知，而是把领会中所筹划的可能性整理出来”。[^(\[42\])](#chapter006.html#m42)以往的古典诠释学将解释与理解割裂开了，视之为认知主体的两种不同行动，二者互有分殊，互不等同，却有着相同的目标——认识对象。海德格尔在“此在”的生存论层面将二者统一起来：解释植根于理解，而不是相反。理解是前主题性的，即它尚未将被理解者变为一个主题，而阐释（解释）则是主题性的，即它确定和规定所理解的东西。[^(\[43\])](#chapter006.html#m43)所有的解释向来是奠基于一种先有之见，都体现了人（“此在”）自身的先行掌握。因此，海德格尔颇有预见性地使我们认识到，不存在“中立的”“局外的”认知行为，不存在“纯粹的”看，也不存在未经解释的“纯粹的”事物。哲学在传统意义上始终在追寻关于对象的纯粹知觉和经验（比如笛卡尔与胡塞尔），殊不知这样的尝试往往徒劳无功，因为任何知觉，尤其是关于上手用具的知觉都已经是有所理解、有所解释的了。我们并不是先遭遇到事物并产生关于它的知觉，然后再对这种知觉作出理解和解释。两者基本上是同时发生的：当我们说出“天上有一架飞机”这一事实描述时，我们已然理解了“飞机”是什么，我们是以理解的方式与事物照面的。


    在我们看来，海德格尔的哲学诠释学为关于认知问题的探讨提供了有益的思想资源。第一，它使我们意识到自身关于事物的认知与解释渗透着诸多前见，它在相当程度上影响着我们的认知态度以及在认识事物时采取的角度和方向。前见不是作为模糊的背景而存在，相反，它因为明确的前概念而得到清晰的表达。前概念是我们预先已经掌握的东西，我们用它来使在先见中的东西概念化，[^(\[44\])](#chapter006.html#m44)也就是说，前概念使人对与之照面的事物具有清晰的概念图像，知晓其解释和认知的东西为何物，这也就是我们会把某物作为某物加以解释的原因。海德格尔早已指明，解释从来不是对先行给定的东西所作的无前提的把握。[^(\[45\])](#chapter006.html#m45)即便是关于“无”的解释也是基于“有”这一前提而展开的，“无”中不能生“有”。绝对无前提的理解和认知活动是无本之木，就像人在绝对光滑、摩擦力为零的地面无法站立一样。理解与认知的前结构规定着它的方向性，使我们不会闹出指鹿为马的笑话，不会将爆炸声理解为雷声。


    追寻着海德格尔的足迹，伽达默尔也认为，我们对于某一对象的理解与认知，并非按照对象如其所示的那样，而是通过效果历史的积累加以把握，在理解与认知的过程中，我们朝向对象投射自己的意向，对象之于我们自身也有作用力。故而这一过程不是主体之于对象客体的予取予求，在投射意向的过程中对象和主体世界相互融合了。[^(\[46\])](#chapter006.html#m46)在我们看来，所谓效果历史是以往关于对象的认知结果的沉积，它显示了我们与传统以及他者之间的联系，为新的认知经验和理解的产生提供了可能。效果历史形成了伽达默尔所说的前判断，而前见在他看来决定着一切理解活动。伽达默尔充分正视了前见带来的积极意义和效果，正如海德格尔所言——此在“被抛入世”，同时也被抛入一个“充斥着前见”的世界。[^(\[47\])](#chapter006.html#m47)即使我们能够有意识地规避掉某一特定的前见，我们亦无法消除所有的偏见或前见，因为前见对于理解而言是必要的，理解者总是从自身的前见和观念体系出发展开解释和理解活动。当然，前见等可能会产生消极的作用，比如干扰人们正常的理解和判断，但在某种意义上它仍有积极的作用与效果，这是伽达默尔力图表达的一个重要观点。[^(\[48\])](#chapter006.html#m48)


    任何理解与解释都不是随心所欲的突发奇想，都具有难以察觉的思维的局限性。海德格尔早已指出这一点，他认为理解和筹划向来被一种先行存在的结构引导着，理解的前结构是理解产生的前提。此在的种种可能性，理解的可能筹划，都基于这种先在结构，海德格尔更多的是将前结构当作理解的结构要素来揭示。[^(\[49\])](#chapter006.html#m49)可以说，理解的诸多可能性取决于前结构本身作用的可能性与内容的丰富性，举例而言，牛顿从苹果落地这一常规现象中发现了万有引力定律，而普通人即使目睹无数次也不能洞察分毫（要么选择无视，要么一脚踢开或把苹果吃掉）。这表明，对于现象的纯粹事实性判断，在很大程度上是基于主体先行具有的理论框架，从某种意义上说，正是理解的前结构指引人们作出关于世界的诸判断。故而如伽达默尔所主张的，前见属于个人的视域，它是滋生判断的温床，导引着我们的所思并构成了我们向世界敞开的预设和前提。这些前见是人们基于特定的文化或传统的特殊体验，是人们如何看待世界的部分表现。所以，前见并不必然地等价于一种错误的判断，它是包含有肯定和否定价值的丰富概念。伽达默尔之所以如此重视前见，在我们看来，原因在于他的诠释学为自身规定的任务，即试图描述理解实际的生成方式，而不是构造某种增进主体间实践的规定性，它关注的是理解源始的规定性。


    如此这般，和理解活动相类似，人的认知和思维活动也并非从某种零点和无开始，我们通常不构造概念，而是在活生生的历史传统和情境中承袭它们。我们也并非先知觉到某种纯粹在手边的东西然后才将其解释为某一事物，而是我们遇到的事物已经通过一组可能性被解释了，此组可能性我们把握为该物所具有，“在每一情况下此解释都是基于某种我们预先已有者，即一种‘前有’”，我们根据对该物的一种“前有”、一种“前见”来把握和解释对象。[^(\[50\])](#chapter006.html#m50)前见积淀于人们的心智当中，纯粹的无知不可能产生问题，我们不可能将前见从头脑中完全去除，不可能像蛇蜕皮一样摆脱前见对我们的影响。人的认知活动不能单纯依靠知觉分析，决定人们视角和观点的不是视觉、身体甚至空间感知，而是其自身具有的信念系统以及历史、文化传统造成的前见和前判断体系，人们在展开认知活动的伊始便已经随附着这些因素了。人类认知不存在绝对澄明的、纯粹的无前提，我们甚至可以断言，绝大部分理解和认知活动都只在我们的前见内并通过我们的前见而发生。前见并没有构成阻断人们获取知识和把握真理的任意盲目性，反之，它成为人们展开认知活动（甚至科学认知）的脚手架。人们往往是以某种最初的前见或认知模式接近某一主题，正是这初始的一组信念使我们能够思考并质疑，全部的理解和认知活动都以这类前见为基础。为了理解和认知某一对象，我们必须进入由自身与对象之间的关系所建立的那种“熟悉和陌生的辩证法”：一方面，对象因为我们自身的“前见”和“前把握”具有了熟悉性；另一方面，它也由于和我们之间的距离而对我们提出了挑战。若以伽达默尔的口吻描述，认知则是基于“一种由熟悉性和异他性构成的对极性关系”。[^(\[51\])](#chapter006.html#m51)从这种意义上说，我们认为人类认知可能包含着一种不可移除的间距，间距是认知产生的一个前提条件，而不是某种亟待克服和略去的东西，认知主体与所要认知的对象客体之间的鸿沟似乎并不那么容易填平，完全被同化的东西也没有被理解和认识的必要。在我们看来，人作为认知者、诠释者需要心怀谦卑地面对眼前的对象，不要被自己的虚荣傲慢所误导。保持对前见足够的尊重，这是我们在以诠释学研究认知问题时获得的重要启示。


    第二，诠释学使我们意识到情境的重要性，强调人的理解和解释活动离不开当下以及历史的情境关联，人的认知行为是与情境关联在一起的，人的观念是根据某种情境得出的，并且依托情境而获得理解。当然，这一观念数见不鲜，语境论、情境认知等理论都持有这一主张。我们在展开理解等认知活动时，要重视其情境的历史性特征，它不单指过去，更绵延至现在以及未来。文化传统不是一成不变的静态存在，在人的生存以及与他人的交互过程中不断地变化着，因此人总是生存在他的传统中。从这个前提出发，认知的可理解性便基于情境，后者关乎能否正确地解释人的认知和行动。如今，诠释学在追问人对作品的理解时反对以旧有的主—客体模式对诠释学情境展开界定，认为这一模式只是虚构出来的，“它不是源自理解的经验，而是被反思地建构起来的，且又投射到诠释情境的一种模式”。[^(\[52\])](#chapter006.html#m52)存在于主体—客体框架内的理解和解释活动已然成为一种主体性和心智的反思活动，体验式的生动理解成了一种冰冷的技术性分析，得到的结果自然也就不是生动的经验，而是静态的知识，是一种关于客体的纯粹、明晰的观念，每一事物都成了可度量、可重复或可显现的图式。[^(\[53\])](#chapter006.html#m53)计算主义盛行的原因之一可能是，符号和逻辑规则是最为纯粹、明晰和抽象的观念，是知识与经验形式化的基础。

