    \n[\\[52\\]](#chapter005.html#w52) 与技术日新月异的发展相比，哲学理论的更新显得尤为缓慢，这就要求我们审慎地对待任何一种批判性的观点和主张，以旧有的、过时的目光去审视全新的事物无异于刻舟求剑，必然是无效的。\n\
