- raw: '作为《存在与时间》的研究主题，“此在”是解决存在问题的必要条件，对“此在”之存在论特征的详述是基础存在论的初步和必要准备。海德格尔认为，以往有关人类本质的定义都不具有牢固的根基，因为它们都未能通过对存在的追问而通达存在者，回避了对人的存在样式的研究。他用“此在”表示人这一特殊存在者的“如此存在”（that-being），更准确地说，是表示人的存在性和存在状态，人的存在方式体现了他们对于自身以及其他存在者存在的一种领会。对海德格尔来说，把人看作某一意识主体，甚至是胡塞尔所谓的“先验自我”反而会掩盖人类实际的生存结构，是完全没有必要的。“人在生存论上的本质是人能够表象存在者自身，并能够意识到它们的原因。所有的意识都以……作为人之本质的生存为前提。”[^(\[4\])](#chapter005.html#m4)


    Dasein一词在德国古典哲学中指每一种存在，[^(\[5\])](#chapter005.html#m5)海德格尔以之来表示人类的存在方式。从词形上看，如果我们将“此在”看作一个个自在自为的独立主体，认为Dasein=Subject，这样就完全忽略了前缀Da的意义。Da指人类必定在世界中有他的一席之地，即在“此”。严格来说，“此在”应该表述为Da-sein，“‘此’就是此在的展示性，就是此在存在理解的可能性，存在正是在‘此’中显露”。[^(\[6\])](#chapter005.html#m6)其结构就是在世存在，这样一种存在（sein）是整个人类的生存结构，不是这个或那个特殊个人的现成存在。[^(\[7\])](#chapter005.html#m7)因而“此在”不是任何意义上的对象，对“此在”的分析不是关于如何通达存在方式的认知方面的研究，它不是孤立于主体的心智与身体的外在结合。


    约瑟夫·科克尔曼斯（Joseph J.Kockelmans）认为，不能将“此在”想象为自然的或者人为的事物，事物以概念对其进行规定和约束，事物的具体本质总已必然地展开了，概念工具适用于仅仅是其所是的东西，而“此在”的存在样式是要以生存论加以表达，他总是在进行着自我阐释、自我调整以及自我规定。他把“此在”解读成一种向来具有并实现其可能性的东西，可能性不是“此在”自身的某一性质，换言之，“此在”是它自己生存之可能性，并不断予以开显。必须通过生存论的概念来谈论作为“此在”的人的存在样式，不能借助于用以谈论存在者、谈论事物的存在样式的那些基本概念的那种范畴来进行。[^(\[8\])](#chapter005.html#m8)也就是说，作为存在论概念的“此在”不适于“主体”这一概念框架，“此在”的基本特点在于超越，虽然认知也是某种意义上的超越，但这是基于主—客、大脑—环境分立的超越现象，在科克尔曼斯看来，“此在”的超越不能用主客关系来定义。


    由于存在不是一般意义的存在者，而是决定了存在者本身并且逻辑上始终在先的东西，因此必须从某一存在者入手。马尔霍尔将“此在”看作使存在从多样的存在者中浮现出来的恰当切入点，认为需要保证“此在”在探究存在问题方面具有的优先性。在他看来，Dasein虽从字面上被译为“此在”，但从本质上看讨论的依然是人。海德格尔之所以引入这个术语，原因有三：首先，Dasein在德语中指称的是人，且是指人所独具的存在形式；其次，Dasein能够避免像主体性、灵魂、意识以及心灵等术语一样产生误读；最后，Dasein没有先入为主的意见，就像一块白板，不含任何可能招致误解的内涵，其中只有海德格尔自己赋予的含义。[^(\[9\])](#chapter005.html#m9)马尔霍尔认为，理解“此在”需要以适用它的术语来展开，不能以适用于其他类型的存在者的术语进行描述。“此在”不是所谓的“什么—存在”，不是已经展开的具体的本质和特性，换言之，“此在”的存在方式不可以由具体的范畴或者规范性的概念加以设定。“此在”不是人，更准确地说，“此在”不是生物学的自然人或者社会关系的总和，而是在世界之中的全部生存活动。因此，“此在”的任何生存状态都必定与自己的周围世界相关联，以认知或实践的形式同其他存在者联系着，只不过相较于认知，实践在存在论上居于一种优先地位，认知是奠基于在世存在的一种次要的、派生的存在方式。


    人们由于惯常从主体和意识角度理解“此在”，因而往往认为（包括胡塞尔在内）海德格尔对“此在”的生存论分析实质上是在利用现象学方法进行人类学分析，这是对“此在”概念的明显误解。我们不能把“此在”一词轻易地拿来并将其作为人类主体（human
    agent）的全新指称加以利用，两个术语严格来说并没有概念上的通约性。“此在”身上表现出的各种性质不是现成存在者的现成属性，它的本质是生存，也就是去存在，去绽露和展开诸多存在的可能性，性质是“此在”存在的可能方式，因而“此在”并不表达它是什么（如桌子、椅子、树），而是表达它怎样去存在。[^(\[10\])](#chapter005.html#m10)从这种意义上说，认为“此在”是一种人类主体的观点是聚焦于自然人普遍具有的主体性特征，狭隘化了对“此在”的本真理解，“此在”确实是指人这一存在者，但又不仅限于这层含义。所以，海德格尔本人不会赞同利用研究其他事物的研究方法，比如观察、统计以及实验等科学方法来研究“此在”，对“此在”的分析因而也就成了一个方法论问题，恰当的方法是正确理解“此在”的出发点。


    此外，将“此在”看作认知主体也不甚适宜，“此在”的优先地位并不像笛卡尔的“我思”一样体现为认知主体。原因在于，如果将“此在”视为一个“认知主体”的概念，那么在存在论意义上便已经设定了“认知客体”和“认知对象”等概念的存在，主客两极的分立先于认知关系而在存在论中显现出来了。这样一来，克服笛卡尔的二元认识论便成为一句空话，因为始终都存在着对立关系。因此，海德格尔就是要从人之存在这一原初的事实本身终结掉心—物、主—客生成的根源，将“此在”看作“在我们现实生命活动之中的活生生的、个别的、有血有肉的、前理论的、先于主体客体、人与世界二分的存在物，它不受任何理论、概念的羁绊，相反，它的活生生的、有血有肉的生存活动使得任何‘主体’‘客体’的概念，使得人与世界的划分成为可能”。[^(\[11\])](#chapter005.html#m11)人的认知和心智活动需要从更原初、更本真的具体、现实的操劳和操心的生存活动中寻求描述和解释。从这种意义上说，“此在”是一个具体的主体，海德格尔抽离了胡塞尔借助本质还原抽象而来的“纯粹意识”，强调人对世界的实践拥有，强调对实用事务的实践导向。与在世界中被理论地思考的“现成在手”事物相比，在世界中以实践方式遭遇的“上手”事物更具有存在论上的优先地位，我们不是从一个认知主体及其心智内容出发谈论“此在”的“在世存在”，而是从一个必然同所处环境打交道的实践主体出发展开讨论的，“此在”与世界之间最基本的关系不是一种认知关系，而是一种本真或非本真的生存关系。因此，我们不能把“此在”理解为单纯的认知主体，尤其是理解为封闭在自身心智内容和表象中的、无世界的、“笛卡尔式”的主体。


    总之，关于“此在”的描述，有一点是清楚明白的，即“此在”居于发问存在问题的优先地位。“此在”不是从属于人类学、心理学和生物学范畴的概念，它必须借助生存论的分析加以阐明，科学理论的分析是不充分的。海德格尔反对以意识和主体为出发点解释“此在”，认为这样会遮蔽后者的存在方式。作为主体的“我思”对客体、对世界的认知活动只是“此在”生存活动的一种方式，而不是全部，甚至不是那最紧要和最原初的方式。[^(\[12\])](#chapter005.html#m12)然而，认知科学是在把人当作一种经验主体的基础上展开对认知与智能等的研究的，无论是认知主义还是联结主义，还是具身—交互的能动主体，都在为解决心智与世界之间的连续性而绞尽脑汁。新的认知科学范式虽然极力摆脱了主体对计算—表征的依赖，并将人理解为身体—心智的统一体，但是海德格尔式认知科学的认知主体——“此在”不只是基于一种嵌入环境的具身行动，更重要的是人整体的生存活动和现象。如果剥离了“此在”之生存本质的主导规定，那它便不再是海德格尔式的了。


    ### 二 海德格尔式认知科学语境下的“自然化此在”


    即使面临着失去存在论意义的风险，有人依旧认为海德格尔现象学与认知科学的研究是相关的，经过自然化改造的“此在”概念适用于新的认知科学范式，自然化的解释框架有可能保证海德格尔现象学与认知科学在重要概念上的连续性。但是两者关于“此在”的分析方法有着很大的不同，这成为二者相互融合的重要障碍。这里的问题是：为什么不能直接将“此在”应用于认知科学？这一问题我们已经在前述作了简要回答：“此在”不单是进行意向性的认知活动，更涉及对存在的理解和把握，它植根于存在论现象学的语境，因而不能不加限制、自由地混用，[^(\[13\])](#chapter005.html#m13)需要予以自然化。那么，什么是自然化？“此在”如何自然化？自然化后的“此在”还是“此在”吗？下面我们将尝试回答这些问题。


    #### （一）自然化与自然化的现象学


    自然化最初是由奎因为了消除怀疑论而提出的，主张为了发现构成知识及其获得的基础，必须诉诸行为主义心理学以及对科学的历史研究，人们拥有的科学信念源于其感官刺激，人的认知官能是自然中的实体，认识论和自然科学相互包含。[^(\[14\])](#chapter005.html#m14)自然化现象学的初衷则是利用现象学和认知科学的资源，以现象学的分析方法解决意识、感受质等难问题，通过正确理解和描述意识活动的本质结构，寻求与实证研究关于大脑状态的功能解释（认知科学给出了关于心智和认知的因果解释）的勾连和对应，表明现象学可以作为理解心智的一个可行的解释路径，最终提供一个将现象学和认知科学统摄起来的解释框架，同时保留现象学自身独特的分析方法与特征。我们可以看到，自然化现象学是基于自然而非超自然的存在展开，承认自然科学解释的权威，正如塞拉斯（Wilfrid
    Sellars）所言，“在描述和解释世界的维度上，科学是所有事物的尺度，是事物是什么和不是什么的尺度”。[^(\[15\])](#chapter005.html#m15)需要承认的是，自然科学对哲学构成了相当程度的挑战，持有自然主义立场的人认为，对意识、心智等现象的研究本质上是一个科学而非哲学问题，不能通过一般的哲学论证加以解决，“鉴于哲学家在过去两千年来如此糟糕的表现，他们最好表现出谦逊的态度，而不是通常具有的高傲优越感……哲学家必须学会在对其不利的科学证据面前放弃他们钟爱的理论，否则只会令自己陷入群嘲的尴尬境地”。[^(\[16\])](#chapter005.html#m16)对于现象学家而言，现象学虽然不是一门经验科学，但并不能排除它对意识和认知科学等实证研究可能产生的积极影响，相反，科学研究需要现象学本身具有的先验洞察力。关于将现象学自然化的问题，人们似乎已经达成了某种共识，只是在自然化的具体细节上发生了分歧，产生了激进与温和两种不同的自然化路径。所谓激进的现象学自然化，是将现象学的第一人称描述体验等同于大脑的神经生物学过程，弥合第三人称的经验科学描述与第一人称的个体体验之间的解释鸿沟，最终使现象学成为自然科学的一部分。温和的现象学自然化则是要在保持现象学与认知科学各自独立性的前提下实现二者之间有意义的互动：一方面，现象学有助于质疑和阐明经验科学的基本理论假设；另一方面，经验科学可以向现象学提供具体的发现，现象学不能简单地无视，相反，它必须容纳这些新的发现，因为这些证据能够促使现象学完善或修正自己的分析。[^(\[17\])](#chapter005.html#m17)总的看来，自然化现象学的基本立场是在本体论上将自己限制于能被人们信赖的科学属性的范围内，使得自己的概念与自然科学所承认的概念具有属性上的连续性，但这可能造成其与现象学的先验传统相割裂的危险。


    #### （二）惠勒关于“自然化此在”的主张


    人的认知现象和能力问题，向来为哲学的认识论与经验性的认知科学所关注，二者的研究在此形成了交叉。在惠勒看来，“此在”是在世界之中且能够完全应付世界的具身的智能体，他关注的是人类认知，并将“此在”的情境性的存在方式纳入这一范畴之内。关于认知的表现形式，惠勒指出他所谓的“流畅应对”是人类认知活动的主要形式，这种“在线”的智能形式比“离线”的理论反思更加准确，更能完整地描述人类认知的全貌，同时更易于同身体和世界产生关联，即认知在很大程度上是身体和环境交互的结果。我们看到，惠勒的研究和讨论都遵循着自然主义，他也承认，“任何称得上是‘认知科学’的研究纲领都不可避免地伴随着自然主义的身影”。[^(\[18\])](#chapter005.html#m18)其目的在于避免海德格尔哲学本身可能具有的一种神秘感，希望对认知现象的海德格尔式研究同自然科学保持一致，[^(\[19\])](#chapter005.html#m19)当我们以科学认知的方式促成对世界的理解时，给出的科学主张与断言便具有了或真或假的事实价值。惠勒认为，依托着对于存在的理解，经验科学的理论态度能更好地发现事物的本来面目，而探究事物的构成从来就是人的天然诉求。因此，他不认为烙有海德格尔印记的心智理论必然会与认知科学呈现对立的态势，海德格尔哲学并不必然地反对自然主义。相反，海德格尔哲学与自然主义是否以及能否相融是决定海德格尔式认知科学前景的关键。在惠勒看来，海德格尔哲学是有可能为认知科学开辟出一条新的道路的，条件是关于心智与认知的哲学在形式上必须是自然主义的。换句话说，就是要求保证哲学与实证科学的连续性，对于某一现象X（心智、认知抑或是在世存在）的科学解释限制着哲学的理论化。


    惠勒认为，“此在”能够被自然化的理论基石在于承认自然主义是认知科学的规范性前提，海德格尔式认知科学是一种系统地将海德格尔哲学框架同认知、智能、思维以及行动的认知科学路径的基本特征相结合的认知科学。“此在”作为海德格尔式认知科学的核心概念，同时是后者的解释目标，海德格尔本人始终避免把“此在”当作一个现成存在的对象来考察和研究，只有这样我们才能够理解“此在”包含的意蕴。惠勒发现了其中的矛盾，他认为，海德格尔式认知科学的亮点在于以一种非对象化的意义建构模式来描述“此在”，然而问题在于，包括认知科学在内的现代科学的根本特征反而是意义建构的对象化模式，如此便产生了明显的矛盾。在这里惠勒自己也面临着艰难的取舍，是聚焦于人的认知现象还是“此在”的存在方式，正如加拉格尔和扎哈维所指出的，现象学家与心理学家都试图对同样的经验作出解释和说明，但他们采用了不同的方法，提出了不同的问题，并寻找着不同类型的答案。[^(\[20\])](#chapter005.html#m20)他力图兼顾二者之间的动态平衡，既要实现对人类认知的海德格尔式考察，又想回避拉特克利夫和德雷福斯等人对他的诘难。后者批评他背离了海德格尔对人类原初的生存体验的关切，忽视了关于“此在”亲熟于世界，即“此在”“在-世界-中-存在”这一至关重要的生存现象。根据海德格尔的思维方式，“在世存在”是人类认知的先验条件，认知科学作为揭示存在者的独特模式也以之作为自身的先验条件，而“此在”在世的先验性阻碍着关于“此在”的自然化描述（因为世界不能被还原为数学及物理学意义上的空间性，“在世存在”也不是一物在另一物中层层镶嵌的状况，我们在前述已经予以详细论证）。在惠勒看来这一挑战并不致命，他认为“此在”同世界相亲熟的现象学理解的具体细节可以被认知科学重塑为生成这一熟悉感的因果反馈循环，“此在”的“在世”也能被描述为一种具身—嵌入式的认知机制，因为“此在”在世具有某种历史性，同时历史性也是“此在”生存论的构成部分，认知科学作为人的意义建构活动则是内嵌于人类历史中的。[^(\[21\])](#chapter005.html#m21)


    概言之，惠勒的结论就是“此在”能够而且应该被自然化，再过抽象、先验的哲学概念都不能让我们无视自己是经验性的存在者这一事实，我们对于存在之领会的澄明亦需要对于实在的理解，而后者正是科学的任务。这可能是惠勒坚定支持“自然化此在”的根本原因。


    #### （三）“没有关于此在的认知科学！”：拉特克利夫的反驳


    针对惠勒提出的“海德格尔式自然主义”，[^(\[22\])](#chapter005.html#m22)拉特克利夫认为这一设想在原则上存在着不可克服的局限性，经验科学的基本概念都是围绕着存在者建构起来的，对存在者的聚焦阻碍着我们关于“此在”和世界的充分理解，海德格尔早期的哲学立场同自然主义并不相容。海德格尔在授课的时候以桌子为例仔细说明了经验科学视角与现象学视角的本质差别：我们不是在描画此时此地的一个特定的（对于椅子的）感知，而是感知活动本身。我看到的不是椅子的“表象”，把捉的不是椅子的图像，我觉知的不是对椅子的知觉，毋宁说，我只是简捷地看到了它——看到它本身。我不是在作关于椅子的探察和理论性研究，即确定作为质料之物的椅子的硬度和密度，而是在说，这把椅子用起来不舒适。我们对椅子的“看”不能在狭隘的视知觉的意义上去理解，“看”是对“显现物的简捷的认知”。[^(\[23\])](#chapter005.html#m23)关于惠勒将“此在自然化”的设想，拉特克利夫提出了两点反驳意见。第一，根据海德格尔的观点，科学的研究对象是完全客观的、独立于主体的存在物及其属性，并不涉及对存在问题的考察与理解。从某种意义上说，认知科学的目标是受限的，它不是最能切近“此在”的方式，会湮没“此在”与其他存在者的突出不同之处，从而将“此在”置于众多存在者之中，泯然于众存在者，以坚持自然主义立场的认知科学解读海德格尔的哲学观点是一种非常肤浅的方式。他概括、抽离了海德格尔在《存在与时间》第一部分关于经验科学未能揭示“此在”之本质的先验论证。[^(\[24\])](#chapter005.html#m24)


    （1）经验科学探究的事物是什么，在回答这一问题之前，人们必须区分存在与非存在。也就是说，必须理解事物的是其所是（what it is to be）。


    （2）我们是对存在有所理解的存在者，因而对人类认知的完整解释需要囊括我们关于存在的理解。


    （3）经验科学关注事物的在手状态（present-at-hand），只关涉填充在世界中的事物（这样的说法暗示了世界是一种容器，但海德格尔明确反对对世界作类似的隐喻），故而它不可能包含关于“此在”的充足描述。[^(\[25\])](#chapter005.html#m25)


    （4）经验性的科学理论不能充分概括“此在”拥有世界（have a world）的特征，这一特征同“此在”不可分割。世界自身不是作为现成在手之物同“此在”遭遇，我们凭借着对存在的领会得以理解世界，“属于世界”（belonging
    to a world）的意义不能简单地还原为和一些对象的照面。


    （5）因此，经验性的科学理解仅限于弄清楚事物是什么（也就是事物自身的构成以及相互联系），没有考虑到当我们进行科学研究时如何发现自己的在世性。'
  fmt: '

    ## 一 此在的生存论分析


    作为《存在与时间》的研究主题，“此在”是解决存在问题的必要条件，对“此在”之存在论特征的详述是基础存在论的初步和必要准备。海德格尔认为，以往有关人类本质的定义都不具有牢固的根基，因为它们都未能通过对存在的追问而通达存在者，回避了对人的存在样式的研究。他用“此在”表示人这一特殊存在者的“如此存在”（that-being），更准确地说，是表示人的存在性和存在状态，人的存在方式体现了他们对于自身以及其他存在者存在的一种领会。对海德格尔来说，把人看作某一意识主体，甚至是胡塞尔所谓的“先验自我”反而会掩盖人类实际的生存结构，是完全没有必要的。“人在生存论上的本质是人能够表象存在者自身，并能够意识到它们的原因。所有的意识都以……作为人之本质的生存为前提。”[^(\[4\])](#chapter005.html#m4)


    Dasein一词在德国古典哲学中指每一种存在，[^(\[5\])](#chapter005.html#m5)海德格尔以之来表示人类的存在方式。从词形上看，如果我们将“此在”看作一个个自在自为的独立主体，认为Dasein=Subject，这样就完全忽略了前缀Da的意义。Da指人类必定在世界中有他的一席之地，即在“此”。严格来说，“此在”应该表述为Da-sein，“‘此’就是此在的展示性，就是此在存在理解的可能性，存在正是在‘此’中显露”。[^(\[6\])](#chapter005.html#m6)其结构就是在世存在，这样一种存在（sein）是整个人类的生存结构，不是这个或那个特殊个人的现成存在。[^(\[7\])](#chapter005.html#m7)因而“此在”不是任何意义上的对象，对“此在”的分析不是关于如何通达存在方式的认知方面的研究，它不是孤立于主体的心智与身体的外在结合。


    约瑟夫·科克尔曼斯（Joseph J.Kockelmans）认为，不能将“此在”想象为自然的或者人为的事物，事物以概念对其进行规定和约束，事物的具体本质总已必然地展开了，概念工具适用于仅仅是其所是的东西，而“此在”的存在样式是要以生存论加以表达，他总是在进行着自我阐释、自我调整以及自我规定。他把“此在”解读成一种向来具有并实现其可能性的东西，可能性不是“此在”自身的某一性质，换言之，“此在”是它自己生存之可能性，并不断予以开显。必须通过生存论的概念来谈论作为“此在”的人的存在样式，不能借助于用以谈论存在者、谈论事物的存在样式的那些基本概念的那种范畴来进行。[^(\[8\])](#chapter005.html#m8)也就是说，作为存在论概念的“此在”不适于“主体”这一概念框架，“此在”的基本特点在于超越，虽然认知也是某种意义上的超越，但这是基于主—客、大脑—环境分立的超越现象，在科克尔曼斯看来，“此在”的超越不能用主客关系来定义。


    由于存在不是一般意义的存在者，而是决定了存在者本身并且逻辑上始终在先的东西，因此必须从某一存在者入手。马尔霍尔将“此在”看作使存在从多样的存在者中浮现出来的恰当切入点，认为需要保证“此在”在探究存在问题方面具有的优先性。在他看来，Dasein虽从字面上被译为“此在”，但从本质上看讨论的依然是人。海德格尔之所以引入这个术语，原因有三：首先，Dasein在德语中指称的是人，且是指人所独具的存在形式；其次，Dasein能够避免像主体性、灵魂、意识以及心灵等术语一样产生误读；最后，Dasein没有先入为主的意见，就像一块白板，不含任何可能招致误解的内涵，其中只有海德格尔自己赋予的含义。[^(\[9\])](#chapter005.html#m9)马尔霍尔认为，理解“此在”需要以适用它的术语来展开，不能以适用于其他类型的存在者的术语进行描述。“此在”不是所谓的“什么—存在”，不是已经展开的具体的本质和特性，换言之，“此在”的存在方式不可以由具体的范畴或者规范性的概念加以设定。“此在”不是人，更准确地说，“此在”不是生物学的自然人或者社会关系的总和，而是在世界之中的全部生存活动。因此，“此在”的任何生存状态都必定与自己的周围世界相关联，以认知或实践的形式同其他存在者联系着，只不过相较于认知，实践在存在论上居于一种优先地位，认知是奠基于在世存在的一种次要的、派生的存在方式。


    人们由于惯常从主体和意识角度理解“此在”，因而往往认为（包括胡塞尔在内）海德格尔对“此在”的生存论分析实质上是在利用现象学方法进行人类学分析，这是对“此在”概念的明显误解。我们不能把“此在”一词轻易地拿来并将其作为人类主体（human
    agent）的全新指称加以利用，两个术语严格来说并没有概念上的通约性。“此在”身上表现出的各种性质不是现成存在者的现成属性，它的本质是生存，也就是去存在，去绽露和展开诸多存在的可能性，性质是“此在”存在的可能方式，因而“此在”并不表达它是什么（如桌子、椅子、树），而是表达它怎样去存在。[^(\[10\])](#chapter005.html#m10)从这种意义上说，认为“此在”是一种人类主体的观点是聚焦于自然人普遍具有的主体性特征，狭隘化了对“此在”的本真理解，“此在”确实是指人这一存在者，但又不仅限于这层含义。所以，海德格尔本人不会赞同利用研究其他事物的研究方法，比如观察、统计以及实验等科学方法来研究“此在”，对“此在”的分析因而也就成了一个方法论问题，恰当的方法是正确理解“此在”的出发点。


    此外，将“此在”看作认知主体也不甚适宜，“此在”的优先地位并不像笛卡尔的“我思”一样体现为认知主体。原因在于，如果将“此在”视为一个“认知主体”的概念，那么在存在论意义上便已经设定了“认知客体”和“认知对象”等概念的存在，主客两极的分立先于认知关系而在存在论中显现出来了。这样一来，克服笛卡尔的二元认识论便成为一句空话，因为始终都存在着对立关系。因此，海德格尔就是要从人之存在这一原初的事实本身终结掉心—物、主—客生成的根源，将“此在”看作“在我们现实生命活动之中的活生生的、个别的、有血有肉的、前理论的、先于主体客体、人与世界二分的存在物，它不受任何理论、概念的羁绊，相反，它的活生生的、有血有肉的生存活动使得任何‘主体’‘客体’的概念，使得人与世界的划分成为可能”。[^(\[11\])](#chapter005.html#m11)人的认知和心智活动需要从更原初、更本真的具体、现实的操劳和操心的生存活动中寻求描述和解释。从这种意义上说，“此在”是一个具体的主体，海德格尔抽离了胡塞尔借助本质还原抽象而来的“纯粹意识”，强调人对世界的实践拥有，强调对实用事务的实践导向。与在世界中被理论地思考的“现成在手”事物相比，在世界中以实践方式遭遇的“上手”事物更具有存在论上的优先地位，我们不是从一个认知主体及其心智内容出发谈论“此在”的“在世存在”，而是从一个必然同所处环境打交道的实践主体出发展开讨论的，“此在”与世界之间最基本的关系不是一种认知关系，而是一种本真或非本真的生存关系。因此，我们不能把“此在”理解为单纯的认知主体，尤其是理解为封闭在自身心智内容和表象中的、无世界的、“笛卡尔式”的主体。


    总之，关于“此在”的描述，有一点是清楚明白的，即“此在”居于发问存在问题的优先地位。“此在”不是从属于人类学、心理学和生物学范畴的概念，它必须借助生存论的分析加以阐明，科学理论的分析是不充分的。海德格尔反对以意识和主体为出发点解释“此在”，认为这样会遮蔽后者的存在方式。作为主体的“我思”对客体、对世界的认知活动只是“此在”生存活动的一种方式，而不是全部，甚至不是那最紧要和最原初的方式。[^(\[12\])](#chapter005.html#m12)然而，认知科学是在把人当作一种经验主体的基础上展开对认知与智能等的研究的，无论是认知主义还是联结主义，还是具身—交互的能动主体，都在为解决心智与世界之间的连续性而绞尽脑汁。新的认知科学范式虽然极力摆脱了主体对计算—表征的依赖，并将人理解为身体—心智的统一体，但是海德格尔式认知科学的认知主体——“此在”不只是基于一种嵌入环境的具身行动，更重要的是人整体的生存活动和现象。如果剥离了“此在”之生存本质的主导规定，那它便不再是海德格尔式的了。


    ## 二 海德格尔式认知科学语境下的“自然化此在”


    即使面临着失去存在论意义的风险，有人依旧认为海德格尔现象学与认知科学的研究是相关的，经过自然化改造的“此在”概念适用于新的认知科学范式，自然化的解释框架有可能保证海德格尔现象学与认知科学在重要概念上的连续性。但是两者关于“此在”的分析方法有着很大的不同，这成为二者相互融合的重要障碍。这里的问题是：为什么不能直接将“此在”应用于认知科学？这一问题我们已经在前述作了简要回答：“此在”不单是进行意向性的认知活动，更涉及对存在的理解和把握，它植根于存在论现象学的语境，因而不能不加限制、自由地混用，[^(\[13\])](#chapter005.html#m13)需要予以自然化。那么，什么是自然化？“此在”如何自然化？自然化后的“此在”还是“此在”吗？下面我们将尝试回答这些问题。


    ### （一）自然化与自然化的现象学


    自然化最初是由奎因为了消除怀疑论而提出的，主张为了发现构成知识及其获得的基础，必须诉诸行为主义心理学以及对科学的历史研究，人们拥有的科学信念源于其感官刺激，人的认知官能是自然中的实体，认识论和自然科学相互包含。[^(\[14\])](#chapter005.html#m14)自然化现象学的初衷则是利用现象学和认知科学的资源，以现象学的分析方法解决意识、感受质等难问题，通过正确理解和描述意识活动的本质结构，寻求与实证研究关于大脑状态的功能解释（认知科学给出了关于心智和认知的因果解释）的勾连和对应，表明现象学可以作为理解心智的一个可行的解释路径，最终提供一个将现象学和认知科学统摄起来的解释框架，同时保留现象学自身独特的分析方法与特征。我们可以看到，自然化现象学是基于自然而非超自然的存在展开，承认自然科学解释的权威，正如塞拉斯（Wilfrid
    Sellars）所言，“在描述和解释世界的维度上，科学是所有事物的尺度，是事物是什么和不是什么的尺度”。[^(\[15\])](#chapter005.html#m15)需要承认的是，自然科学对哲学构成了相当程度的挑战，持有自然主义立场的人认为，对意识、心智等现象的研究本质上是一个科学而非哲学问题，不能通过一般的哲学论证加以解决，“鉴于哲学家在过去两千年来如此糟糕的表现，他们最好表现出谦逊的态度，而不是通常具有的高傲优越感……哲学家必须学会在对其不利的科学证据面前放弃他们钟爱的理论，否则只会令自己陷入群嘲的尴尬境地”。[^(\[16\])](#chapter005.html#m16)对于现象学家而言，现象学虽然不是一门经验科学，但并不能排除它对意识和认知科学等实证研究可能产生的积极影响，相反，科学研究需要现象学本身具有的先验洞察力。关于将现象学自然化的问题，人们似乎已经达成了某种共识，只是在自然化的具体细节上发生了分歧，产生了激进与温和两种不同的自然化路径。所谓激进的现象学自然化，是将现象学的第一人称描述体验等同于大脑的神经生物学过程，弥合第三人称的经验科学描述与第一人称的个体体验之间的解释鸿沟，最终使现象学成为自然科学的一部分。温和的现象学自然化则是要在保持现象学与认知科学各自独立性的前提下实现二者之间有意义的互动：一方面，现象学有助于质疑和阐明经验科学的基本理论假设；另一方面，经验科学可以向现象学提供具体的发现，现象学不能简单地无视，相反，它必须容纳这些新的发现，因为这些证据能够促使现象学完善或修正自己的分析。[^(\[17\])](#chapter005.html#m17)总的看来，自然化现象学的基本立场是在本体论上将自己限制于能被人们信赖的科学属性的范围内，使得自己的概念与自然科学所承认的概念具有属性上的连续性，但这可能造成其与现象学的先验传统相割裂的危险。


    ### （二）惠勒关于“自然化此在”的主张


    人的认知现象和能力问题，向来为哲学的认识论与经验性的认知科学所关注，二者的研究在此形成了交叉。在惠勒看来，“此在”是在世界之中且能够完全应付世界的具身的智能体，他关注的是人类认知，并将“此在”的情境性的存在方式纳入这一范畴之内。关于认知的表现形式，惠勒指出他所谓的“流畅应对”是人类认知活动的主要形式，这种“在线”的智能形式比“离线”的理论反思更加准确，更能完整地描述人类认知的全貌，同时更易于同身体和世界产生关联，即认知在很大程度上是身体和环境交互的结果。我们看到，惠勒的研究和讨论都遵循着自然主义，他也承认，“任何称得上是‘认知科学’的研究纲领都不可避免地伴随着自然主义的身影”。[^(\[18\])](#chapter005.html#m18)其目的在于避免海德格尔哲学本身可能具有的一种神秘感，希望对认知现象的海德格尔式研究同自然科学保持一致，[^(\[19\])](#chapter005.html#m19)当我们以科学认知的方式促成对世界的理解时，给出的科学主张与断言便具有了或真或假的事实价值。惠勒认为，依托着对于存在的理解，经验科学的理论态度能更好地发现事物的本来面目，而探究事物的构成从来就是人的天然诉求。因此，他不认为烙有海德格尔印记的心智理论必然会与认知科学呈现对立的态势，海德格尔哲学并不必然地反对自然主义。相反，海德格尔哲学与自然主义是否以及能否相融是决定海德格尔式认知科学前景的关键。在惠勒看来，海德格尔哲学是有可能为认知科学开辟出一条新的道路的，条件是关于心智与认知的哲学在形式上必须是自然主义的。换句话说，就是要求保证哲学与实证科学的连续性，对于某一现象X（心智、认知抑或是在世存在）的科学解释限制着哲学的理论化。


    惠勒认为，“此在”能够被自然化的理论基石在于承认自然主义是认知科学的规范性前提，海德格尔式认知科学是一种系统地将海德格尔哲学框架同认知、智能、思维以及行动的认知科学路径的基本特征相结合的认知科学。“此在”作为海德格尔式认知科学的核心概念，同时是后者的解释目标，海德格尔本人始终避免把“此在”当作一个现成存在的对象来考察和研究，只有这样我们才能够理解“此在”包含的意蕴。惠勒发现了其中的矛盾，他认为，海德格尔式认知科学的亮点在于以一种非对象化的意义建构模式来描述“此在”，然而问题在于，包括认知科学在内的现代科学的根本特征反而是意义建构的对象化模式，如此便产生了明显的矛盾。在这里惠勒自己也面临着艰难的取舍，是聚焦于人的认知现象还是“此在”的存在方式，正如加拉格尔和扎哈维所指出的，现象学家与心理学家都试图对同样的经验作出解释和说明，但他们采用了不同的方法，提出了不同的问题，并寻找着不同类型的答案。[^(\[20\])](#chapter005.html#m20)他力图兼顾二者之间的动态平衡，既要实现对人类认知的海德格尔式考察，又想回避拉特克利夫和德雷福斯等人对他的诘难。后者批评他背离了海德格尔对人类原初的生存体验的关切，忽视了关于“此在”亲熟于世界，即“此在”“在-世界-中-存在”这一至关重要的生存现象。根据海德格尔的思维方式，“在世存在”是人类认知的先验条件，认知科学作为揭示存在者的独特模式也以之作为自身的先验条件，而“此在”在世的先验性阻碍着关于“此在”的自然化描述（因为世界不能被还原为数学及物理学意义上的空间性，“在世存在”也不是一物在另一物中层层镶嵌的状况，我们在前述已经予以详细论证）。在惠勒看来这一挑战并不致命，他认为“此在”同世界相亲熟的现象学理解的具体细节可以被认知科学重塑为生成这一熟悉感的因果反馈循环，“此在”的“在世”也能被描述为一种具身—嵌入式的认知机制，因为“此在”在世具有某种历史性，同时历史性也是“此在”生存论的构成部分，认知科学作为人的意义建构活动则是内嵌于人类历史中的。[^(\[21\])](#chapter005.html#m21)


    概言之，惠勒的结论就是“此在”能够而且应该被自然化，再过抽象、先验的哲学概念都不能让我们无视自己是经验性的存在者这一事实，我们对于存在之领会的澄明亦需要对于实在的理解，而后者正是科学的任务。这可能是惠勒坚定支持“自然化此在”的根本原因。


    ### （三）“没有关于此在的认知科学！”：拉特克利夫的反驳


    针对惠勒提出的“海德格尔式自然主义”，[^(\[22\])](#chapter005.html#m22)拉特克利夫认为这一设想在原则上存在着不可克服的局限性，经验科学的基本概念都是围绕着存在者建构起来的，对存在者的聚焦阻碍着我们关于“此在”和世界的充分理解，海德格尔早期的哲学立场同自然主义并不相容。海德格尔在授课的时候以桌子为例仔细说明了经验科学视角与现象学视角的本质差别：我们不是在描画此时此地的一个特定的（对于椅子的）感知，而是感知活动本身。我看到的不是椅子的“表象”，把捉的不是椅子的图像，我觉知的不是对椅子的知觉，毋宁说，我只是简捷地看到了它——看到它本身。我不是在作关于椅子的探察和理论性研究，即确定作为质料之物的椅子的硬度和密度，而是在说，这把椅子用起来不舒适。我们对椅子的“看”不能在狭隘的视知觉的意义上去理解，“看”是对“显现物的简捷的认知”。[^(\[23\])](#chapter005.html#m23)关于惠勒将“此在自然化”的设想，拉特克利夫提出了两点反驳意见。第一，根据海德格尔的观点，科学的研究对象是完全客观的、独立于主体的存在物及其属性，并不涉及对存在问题的考察与理解。从某种意义上说，认知科学的目标是受限的，它不是最能切近“此在”的方式，会湮没“此在”与其他存在者的突出不同之处，从而将“此在”置于众多存在者之中，泯然于众存在者，以坚持自然主义立场的认知科学解读海德格尔的哲学观点是一种非常肤浅的方式。他概括、抽离了海德格尔在《存在与时间》第一部分关于经验科学未能揭示“此在”之本质的先验论证。[^(\[24\])](#chapter005.html#m24)


    （1）经验科学探究的事物是什么，在回答这一问题之前，人们必须区分存在与非存在。也就是说，必须理解事物的是其所是（what it is to be）。


    （2）我们是对存在有所理解的存在者，因而对人类认知的完整解释需要囊括我们关于存在的理解。


    （3）经验科学关注事物的在手状态（present-at-hand），只关涉填充在世界中的事物（这样的说法暗示了世界是一种容器，但海德格尔明确反对对世界作类似的隐喻），故而它不可能包含关于“此在”的充足描述。[^(\[25\])](#chapter005.html#m25)


    （4）经验性的科学理论不能充分概括“此在”拥有世界（have a world）的特征，这一特征同“此在”不可分割。世界自身不是作为现成在手之物同“此在”遭遇，我们凭借着对存在的领会得以理解世界，“属于世界”（belonging
    to a world）的意义不能简单地还原为和一些对象的照面。


    （5）因此，经验性的科学理解仅限于弄清楚事物是什么（也就是事物自身的构成以及相互联系），没有考虑到当我们进行科学研究时如何发现自己的在世性。

    '
  trans: '


    ## 一 此在的生存论分析


    作为《存在与时间》的研究主题，“此在”是解决存在问题的必要条件，对“此在”之存在论特征的详述是基础存在论的初步和必要准备。海德格尔认为，以往有关人类本质的定义都不具有牢固的根基，因为它们都未能通过对存在的追问而通达存在者，回避了对人的存在样式的研究。他用“此在”表示人这一特殊存在者的“如此存在”（that-being），更准确地说，是表示人的存在性和存在状态，人的存在方式体现了他们对于自身以及其他存在者存在的一种领会。对海德格尔来说，把人看作某一意识主体，甚至是胡塞尔所谓的“先验自我”反而会掩盖人类实际的生存结构，是完全没有必要的。“人在生存论上的本质是人能够表象存在者自身，并能够意识到它们的原因。所有的意识都以……作为人之本质的生存为前提。”[^(\[4\])](#chapter005.html#m4)


    Dasein 一词在德国古典哲学中指每一种存在，[^(\[5\])](#chapter005.html#m5)海德格尔以之来表示人类的存在方式。从词形上看，如果我们将“此在”看作一个个自在自为的独立主体，认为
    Dasein=Subject，这样就完全忽略了前缀 Da 的意义。Da 指人类必定在世界中有他的一席之地，即在“此”。严格来说，“此在”应该表述为 Da-sein，“‘此’就是此在的展示性，就是此在存在理解的可能性，存在正是在‘此’中显露”。[^(\[6\])](#chapter005.html#m6)其结构就是在世存在，这样一种存在（sein）是整个人类的生存结构，不是这个或那个特殊个人的现成存在。[^(\[7\])](#chapter005.html#m7)因而“此在”不是任何意义上的对象，对“此在”的分析不是关于如何通达存在方式的认知方面的研究，它不是孤立于主体的心智与身体的外在结合。


    约瑟夫·科克尔曼斯（Joseph J.Kockelmans）认为，不能将“此在”想象为自然的或者人为的事物，事物以概念对其进行规定和约束，事物的具体本质总已必然地展开了，概念工具适用于仅仅是其所是的东西，而“此在”的存在样式是要以生存论加以表达，他总是在进行着自我阐释、自我调整以及自我规定。他把“此在”解读成一种向来具有并实现其可能性的东西，可能性不是“此在”自身的某一性质，换言之，“此在”是它自己生存之可能性，并不断予以开显。必须通过生存论的概念来谈论作为“此在”的人的存在样式，不能借助于用以谈论存在者、谈论事物的存在样式的那些基本概念的那种范畴来进行。[^(\[8\])](#chapter005.html#m8)也就是说，作为存在论概念的“此在”不适于“主体”这一概念框架，“此在”的基本特点在于超越，虽然认知也是某种意义上的超越，但这是基于主—客、大脑—环境分立的超越现象，在科克尔曼斯看来，“此在”的超越不能用主客关系来定义。


    由于存在不是一般意义的存在者，而是决定了存在者本身并且逻辑上始终在先的东西，因此必须从某一存在者入手。马尔霍尔将“此在”看作使存在从多样的存在者中浮现出来的恰当切入点，认为需要保证“此在”在探究存在问题方面具有的优先性。在他看来，Dasein
    虽从字面上被译为“此在”，但从本质上看讨论的依然是人。海德格尔之所以引入这个术语，原因有三：首先，Dasein 在德语中指称的是人，且是指人所独具的存在形式；其次，Dasein
    能够避免像主体性、灵魂、意识以及心灵等术语一样产生误读；最后，Dasein 没有先入为主的意见，就像一块白板，不含任何可能招致误解的内涵，其中只有海德格尔自己赋予的含义。[^(\[9\])](#chapter005.html#m9)马尔霍尔认为，理解“此在”需要以适用它的术语来展开，不能以适用于其他类型的存在者的术语进行描述。“此在”不是所谓的“什么—存在”，不是已经展开的具体的本质和特性，换言之，“此在”的存在方式不可以由具体的范畴或者规范性的概念加以设定。“此在”不是人，更准确地说，“此在”不是生物学的自然人或者社会关系的总和，而是在世界之中的全部生存活动。因此，“此在”的任何生存状态都必定与自己的周围世界相关联，以认知或实践的形式同其他存在者联系着，只不过相较于认知，实践在存在论上居于一种优先地位，认知是奠基于在世存在的一种次要的、派生的存在方式。


    人们由于惯常从主体和意识角度理解“此在”，因而往往认为（包括胡塞尔在内）海德格尔对“此在”的生存论分析实质上是在利用现象学方法进行人类学分析，这是对“此在”概念的明显误解。我们不能把“此在”一词轻易地拿来并将其作为人类主体（human
    agent）的全新指称加以利用，两个术语严格来说并没有概念上的通约性。“此在”身上表现出的各种性质不是现成存在者的现成属性，它的本质是生存，也就是去存在，去绽露和展开诸多存在的可能性，性质是“此在”存在的可能方式，因而“此在”并不表达它是什么（如桌子、椅子、树），而是表达它怎样去存在。[^(\[10\])](#chapter005.html#m10)从这种意义上说，认为“此在”是一种人类主体的观点是聚焦于自然人普遍具有的主体性特征，狭隘化了对“此在”的本真理解，“此在”确实是指人这一存在者，但又不仅限于这层含义。所以，海德格尔本人不会赞同利用研究其他事物的研究方法，比如观察、统计以及实验等科学方法来研究“此在”，对“此在”的分析因而也就成了一个方法论问题，恰当的方法是正确理解“此在”的出发点。


    此外，将“此在”看作认知主体也不甚适宜，“此在”的优先地位并不像笛卡尔的“我思”一样体现为认知主体。原因在于，如果将“此在”视为一个“认知主体”的概念，那么在存在论意义上便已经设定了“认知客体”和“认知对象”等概念的存在，主客两极的分立先于认知关系而在存在论中显现出来了。这样一来，克服笛卡尔的二元认识论便成为一句空话，因为始终都存在着对立关系。因此，海德格尔就是要从人之存在这一原初的事实本身终结掉心—物、主—客生成的根源，将“此在”看作“在我们现实生命活动之中的活生生的、个别的、有血有肉的、前理论的、先于主体客体、人与世界二分的存在物，它不受任何理论、概念的羁绊，相反，它的活生生的、有血有肉的生存活动使得任何‘主体’‘客体’的概念，使得人与世界的划分成为可能”。[^(\[11\])](#chapter005.html#m11)人的认知和心智活动需要从更原初、更本真的具体、现实的操劳和操心的生存活动中寻求描述和解释。从这种意义上说，“此在”是一个具体的主体，海德格尔抽离了胡塞尔借助本质还原抽象而来的“纯粹意识”，强调人对世界的实践拥有，强调对实用事务的实践导向。与在世界中被理论地思考的“现成在手”事物相比，在世界中以实践方式遭遇的“上手”事物更具有存在论上的优先地位，我们不是从一个认知主体及其心智内容出发谈论“此在”的“在世存在”，而是从一个必然同所处环境打交道的实践主体出发展开讨论的，“此在”与世界之间最基本的关系不是一种认知关系，而是一种本真或非本真的生存关系。因此，我们不能把“此在”理解为单纯的认知主体，尤其是理解为封闭在自身心智内容和表象中的、无世界的、“笛卡尔式”的主体。


    总之，关于“此在”的描述，有一点是清楚明白的，即“此在”居于发问存在问题的优先地位。“此在”不是从属于人类学、心理学和生物学范畴的概念，它必须借助生存论的分析加以阐明，科学理论的分析是不充分的。海德格尔反对以意识和主体为出发点解释“此在”，认为这样会遮蔽后者的存在方式。作为主体的“我思”对客体、对世界的认知活动只是“此在”生存活动的一种方式，而不是全部，甚至不是那最紧要和最原初的方式。[^(\[12\])](#chapter005.html#m12)然而，认知科学是在把人当作一种经验主体的基础上展开对认知与智能等的研究的，无论是认知主义还是联结主义，还是具身—交互的能动主体，都在为解决心智与世界之间的连续性而绞尽脑汁。新的认知科学范式虽然极力摆脱了主体对计算—表征的依赖，并将人理解为身体—心智的统一体，但是海德格尔式认知科学的认知主体——“此在”不只是基于一种嵌入环境的具身行动，更重要的是人整体的生存活动和现象。如果剥离了“此在”之生存本质的主导规定，那它便不再是海德格尔式的了。


    ## 二 海德格尔式认知科学语境下的“自然化此在”


    即使面临着失去存在论意义的风险，有人依旧认为海德格尔现象学与认知科学的研究是相关的，经过自然化改造的“此在”概念适用于新的认知科学范式，自然化的解释框架有可能保证海德格尔现象学与认知科学在重要概念上的连续性。但是两者关于“此在”的分析方法有着很大的不同，这成为二者相互融合的重要障碍。这里的问题是：为什么不能直接将“此在”应用于认知科学？这一问题我们已经在前述作了简要回答：“此在”不单是进行意向性的认知活动，更涉及对存在的理解和把握，它植根于存在论现象学的语境，因而不能不加限制、自由地混用，[^(\[13\])](#chapter005.html#m13)需要予以自然化。那么，什么是自然化？“此在”如何自然化？自然化后的“此在”还是“此在”吗？下面我们将尝试回答这些问题。


    ### （一）自然化与自然化的现象学


    自然化最初是由奎因为了消除怀疑论而提出的，主张为了发现构成知识及其获得的基础，必须诉诸行为主义心理学以及对科学的历史研究，人们拥有的科学信念源于其感官刺激，人的认知官能是自然中的实体，认识论和自然科学相互包含。[^(\[14\])](#chapter005.html#m14)自然化现象学的初衷则是利用现象学和认知科学的资源，以现象学的分析方法解决意识、感受质等难问题，通过正确理解和描述意识活动的本质结构，寻求与实证研究关于大脑状态的功能解释（认知科学给出了关于心智和认知的因果解释）的勾连和对应，表明现象学可以作为理解心智的一个可行的解释路径，最终提供一个将现象学和认知科学统摄起来的解释框架，同时保留现象学自身独特的分析方法与特征。我们可以看到，自然化现象学是基于自然而非超自然的存在展开，承认自然科学解释的权威，正如塞拉斯（Wilfrid
    Sellars）所言，“在描述和解释世界的维度上，科学是所有事物的尺度，是事物是什么和不是什么的尺度”。[^(\[15\])](#chapter005.html#m15)需要承认的是，自然科学对哲学构成了相当程度的挑战，持有自然主义立场的人认为，对意识、心智等现象的研究本质上是一个科学而非哲学问题，不能通过一般的哲学论证加以解决，“鉴于哲学家在过去两千年来如此糟糕的表现，他们最好表现出谦逊的态度，而不是通常具有的高傲优越感……哲学家必须学会在对其不利的科学证据面前放弃他们钟爱的理论，否则只会令自己陷入群嘲的尴尬境地”。[^(\[16\])](#chapter005.html#m16)对于现象学家而言，现象学虽然不是一门经验科学，但并不能排除它对意识和认知科学等实证研究可能产生的积极影响，相反，科学研究需要现象学本身具有的先验洞察力。关于将现象学自然化的问题，人们似乎已经达成了某种共识，只是在自然化的具体细节上发生了分歧，产生了激进与温和两种不同的自然化路径。所谓激进的现象学自然化，是将现象学的第一人称描述体验等同于大脑的神经生物学过程，弥合第三人称的经验科学描述与第一人称的个体体验之间的解释鸿沟，最终使现象学成为自然科学的一部分。温和的现象学自然化则是要在保持现象学与认知科学各自独立性的前提下实现二者之间有意义的互动：一方面，现象学有助于质疑和阐明经验科学的基本理论假设；另一方面，经验科学可以向现象学提供具体的发现，现象学不能简单地无视，相反，它必须容纳这些新的发现，因为这些证据能够促使现象学完善或修正自己的分析。[^(\[17\])](#chapter005.html#m17)总的看来，自然化现象学的基本立场是在本体论上将自己限制于能被人们信赖的科学属性的范围内，使得自己的概念与自然科学所承认的概念具有属性上的连续性，但这可能造成其与现象学的先验传统相割裂的危险。


    ### （二）惠勒关于“自然化此在”的主张


    人的认知现象和能力问题，向来为哲学的认识论与经验性的认知科学所关注，二者的研究在此形成了交叉。在惠勒看来，“此在”是在世界之中且能够完全应付世界的具身的智能体，他关注的是人类认知，并将“此在”的情境性的存在方式纳入这一范畴之内。关于认知的表现形式，惠勒指出他所谓的“流畅应对”是人类认知活动的主要形式，这种“在线”的智能形式比“离线”的理论反思更加准确，更能完整地描述人类认知的全貌，同时更易于同身体和世界产生关联，即认知在很大程度上是身体和环境交互的结果。我们看到，惠勒的研究和讨论都遵循着自然主义，他也承认，“任何称得上是‘认知科学’的研究纲领都不可避免地伴随着自然主义的身影”。[^(\[18\])](#chapter005.html#m18)其目的在于避免海德格尔哲学本身可能具有的一种神秘感，希望对认知现象的海德格尔式研究同自然科学保持一致，[^(\[19\])](#chapter005.html#m19)当我们以科学认知的方式促成对世界的理解时，给出的科学主张与断言便具有了或真或假的事实价值。惠勒认为，依托着对于存在的理解，经验科学的理论态度能更好地发现事物的本来面目，而探究事物的构成从来就是人的天然诉求。因此，他不认为烙有海德格尔印记的心智理论必然会与认知科学呈现对立的态势，海德格尔哲学并不必然地反对自然主义。相反，海德格尔哲学与自然主义是否以及能否相融是决定海德格尔式认知科学前景的关键。在惠勒看来，海德格尔哲学是有可能为认知科学开辟出一条新的道路的，条件是关于心智与认知的哲学在形式上必须是自然主义的。换句话说，就是要求保证哲学与实证科学的连续性，对于某一现象
    X（心智、认知抑或是在世存在）的科学解释限制着哲学的理论化。


    惠勒认为，“此在”能够被自然化的理论基石在于承认自然主义是认知科学的规范性前提，海德格尔式认知科学是一种系统地将海德格尔哲学框架同认知、智能、思维以及行动的认知科学路径的基本特征相结合的认知科学。“此在”作为海德格尔式认知科学的核心概念，同时是后者的解释目标，海德格尔本人始终避免把“此在”当作一个现成存在的对象来考察和研究，只有这样我们才能够理解“此在”包含的意蕴。惠勒发现了其中的矛盾，他认为，海德格尔式认知科学的亮点在于以一种非对象化的意义建构模式来描述“此在”，然而问题在于，包括认知科学在内的现代科学的根本特征反而是意义建构的对象化模式，如此便产生了明显的矛盾。在这里惠勒自己也面临着艰难的取舍，是聚焦于人的认知现象还是“此在”的存在方式，正如加拉格尔和扎哈维所指出的，现象学家与心理学家都试图对同样的经验作出解释和说明，但他们采用了不同的方法，提出了不同的问题，并寻找着不同类型的答案。[^(\[20\])](#chapter005.html#m20)他力图兼顾二者之间的动态平衡，既要实现对人类认知的海德格尔式考察，又想回避拉特克利夫和德雷福斯等人对他的诘难。后者批评他背离了海德格尔对人类原初的生存体验的关切，忽视了关于“此在”亲熟于世界，即“此在”“在-世界-中-存在”这一至关重要的生存现象。根据海德格尔的思维方式，“在世存在”是人类认知的先验条件，认知科学作为揭示存在者的独特模式也以之作为自身的先验条件，而“此在”在世的先验性阻碍着关于“此在”的自然化描述（因为世界不能被还原为数学及物理学意义上的空间性，“在世存在”也不是一物在另一物中层层镶嵌的状况，我们在前述已经予以详细论证）。在惠勒看来这一挑战并不致命，他认为“此在”同世界相亲熟的现象学理解的具体细节可以被认知科学重塑为生成这一熟悉感的因果反馈循环，“此在”的“在世”也能被描述为一种具身—嵌入式的认知机制，因为“此在”在世具有某种历史性，同时历史性也是“此在”生存论的构成部分，认知科学作为人的意义建构活动则是内嵌于人类历史中的。[^(\[21\])](#chapter005.html#m21)


    概言之，惠勒的结论就是“此在”能够而且应该被自然化，再过抽象、先验的哲学概念都不能让我们无视自己是经验性的存在者这一事实，我们对于存在之领会的澄明亦需要对于实在的理解，而后者正是科学的任务。这可能是惠勒坚定支持“自然化此在”的根本原因。


    ### （三）“没有关于此在的认知科学！”：拉特克利夫的反驳


    针对惠勒提出的“海德格尔式自然主义”，[^(\[22\])](#chapter005.html#m22)拉特克利夫认为这一设想在原则上存在着不可克服的局限性，经验科学的基本概念都是围绕着存在者建构起来的，对存在者的聚焦阻碍着我们关于“此在”和世界的充分理解，海德格尔早期的哲学立场同自然主义并不相容。海德格尔在授课的时候以桌子为例仔细说明了经验科学视角与现象学视角的本质差别：我们不是在描画此时此地的一个特定的（对于椅子的）感知，而是感知活动本身。我看到的不是椅子的“表象”，把捉的不是椅子的图像，我觉知的不是对椅子的知觉，毋宁说，我只是简捷地看到了它——看到它本身。我不是在作关于椅子的探察和理论性研究，即确定作为质料之物的椅子的硬度和密度，而是在说，这把椅子用起来不舒适。我们对椅子的“看”不能在狭隘的视知觉的意义上去理解，“看”是对“显现物的简捷的认知”。[^(\[23\])](#chapter005.html#m23)关于惠勒将“此在自然化”的设想，拉特克利夫提出了两点反驳意见。第一，根据海德格尔的观点，科学的研究对象是完全客观的、独立于主体的存在物及其属性，并不涉及对存在问题的考察与理解。从某种意义上说，认知科学的目标是受限的，它不是最能切近“此在”的方式，会湮没“此在”与其他存在者的突出不同之处，从而将“此在”置于众多存在者之中，泯然于众存在者，以坚持自然主义立场的认知科学解读海德格尔的哲学观点是一种非常肤浅的方式。他概括、抽离了海德格尔在《存在与时间》第一部分关于经验科学未能揭示“此在”之本质的先验论证。[^(\[24\])](#chapter005.html#m24)


    （1）经验科学探究的事物是什么，在回答这一问题之前，人们必须区分存在与非存在。也就是说，必须理解事物的是其所是（what it is to be）。


    （2）我们是对存在有所理解的存在者，因而对人类认知的完整解释需要囊括我们关于存在的理解。


    （3）经验科学关注事物的在手状态（present-at-hand），只关涉填充在世界中的事物（这样的说法暗示了世界是一种容器，但海德格尔明确反对对世界作类似的隐喻），故而它不可能包含关于“此在”的充足描述。[^(\[25\])](#chapter005.html#m25)


    （4）经验性的科学理论不能充分概括“此在”拥有世界（have a world）的特征，这一特征同“此在”不可分割。世界自身不是作为现成在手之物同“此在”遭遇，我们凭借着对存在的领会得以理解世界，“属于世界”（belonging
    to a world）的意义不能简单地还原为和一些对象的照面。


    （5）因此，经验性的科学理解仅限于弄清楚事物是什么（也就是事物自身的构成以及相互联系），没有考虑到当我们进行科学研究时如何发现自己的在世性。


