    \n[\\[58\\]](#chapter005.html#w58) Vincent C.Müller，*Fundamental Issues of Artificial\
    \ Intelligence* （Switzerland：Springer，2016），p.498.\n\n[\\[59\\]](#chapter005.html#w59)\
    \ 要谨慎地看待这一点，在我们看来，表征仍然是人类智能最为重要的功能之一，海德格尔以及德雷福斯所指的日常活动是技能性的，不具有明确的觉知，比如两者常以锤击、驾驶等活动例示，但在诸如弈棋、决策、问题解决以及系统分析等高阶认知活动中，我们总是在运用心理表征、模型表征等诸表征形式和方法。完全摒弃表征且基于行动的机器人称不上“智能”，因为它处理不了更为复杂的任务，表征对于智能而言虽不充分，但却是必要的。\n\
    \n[\\[60\\]](#chapter005.html#w60) 〔美〕休伯特·德雷福斯：《计算机不能做什么——人工智能的极限》，宁春岩译，三联书店，1986，第6页。\n\
