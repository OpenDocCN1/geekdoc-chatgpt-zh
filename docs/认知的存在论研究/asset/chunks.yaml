- raw: '无论是情境、背景抑或是语境，对人类而言都是其遭遇事实、言说话语和解决问题时所处的环境，共同的特征在于不能由规则来定义，或者予以形式化和符号化处理。情境性是人类认知和心理过程的基本特征，对人而言，任何符号、任务以及事实从不会孤立地出现，即便是现代人难以识别的符号，比如古埃及、古苏美尔人留下的神秘文字符号也不是孤立的，只是人们尚未弄清其背后隐藏的意义联系而已。意义、规则、信息、表征或知识也不是固定的，只是以恰当的方式X附着在给定的符号上面而已，是否“恰当”则基于当下的情境。强调情境在认知过程中的作用表明海德格尔是在以自下而上的方式看待智能，与之相反，笛卡尔描述智能的方式则是自上而下的。在我们看来，自上而下的进路彰显了人们先前寄托于理性的殷切愿景，认为理性绝缘于外在世界，认知无须环境的支撑，人类理性仅凭自身就可以产生具有确定性的认知结果。事实证明，理性的功能与作用被过分地夸大和高估了，虽然人类理性擅长于推理、思维等高阶的离线认知活动，感性只是负责知觉等低阶的在线认知，但情境对头脑中的信息加工亦具有影响力。从进化论的角度看，人类的进化和成长是自身不断适应自然环境的结果，社会和文化的形成反过来又成为人类认知能力进步的加速器。我们深深地依赖自己所创造的文化，这种依赖性拓展至各种符号表征和思想。孤立于社会之外的个体不可能发展出语言或任何形式的符号思想，也不可能拥有任何一种真正符号。事实上，孤立的人脑不会像一个符号化的器官一样工作，它与猩猩的脑没有多大区别。很显然，它无法凭借自身产生出符号表征。只能通过强有力的文化适应才能做到这一点。[^(\[25\])](#chapter004.html#m25)


    我们可以看到，关于人类认知抑或智能，无论是对哪种现象的考察，情境都不能缺席，逻辑的、抽象化的描述方式不足以完全刻画认知过程的实质内容，即便它足够深刻。在我们看来，人的智能和认知并不完全体现为程序性、明晰性以及确定性，不等同于计算机需要利用规则加工信息，它可能更多是人类理性经过“抽丝剥茧”处理后的结果，是“哲学成为科学”这一古老传统的延续（尤其是自近代以来）。认知的目的在于获得确定的意义，但意义的确定性不是由对象单独呈现，而是在对象所处情境中涌现出来的，事物正是在渗透着人类活动的情境中获得其意义的。德雷福斯拒绝对情境作任何形式上的处理，他认为人对情境的理解是含混的，意欲在某种“模型结构”之中无意识地、明晰地表达关于情境的事实，这样的努力只是一种虚假的“本体论假设”，我们之所以把一个事物当作一把椅子识别了出来，其含义是理解了它同其他事物以及人之间的关系。[^(\[26\])](#chapter004.html#m26)情境不可能在一种产生批判之距离的反思中完全把握住并予以客观化，它是模糊的，我们只会把意向投射到我们所关注的事物上，一个具有明晰性、确定性并且可控的世界只是柏拉图的理念，是充满了乐观主义的假设。正如德雷福斯所言，情境不等同于一种物理状态，“情境的类型不可能与物理状态的类型相同”，[^(\[27\])](#chapter004.html#m27)后者可以被精确量化，被抽象为一群能够按照规则加以组合的独立元素，是可以被形式化的函数表达式。然而，从严格的意义上说，情境并不局限于物理状态，它包括了文化、社会、历史传统以及身体、环境等诸多要素，体现了要素间的内在关联性。海德格尔虽然指出“在世存在”是人类认知活动的根本模式，但需要厘清的是，认知主体嵌入的不是纯粹的物理世界，而是充斥着实践和习俗的社会文化世界，我们在对这个世界有所认识之前便已经浸没在文化传统之中，文化可以视为终极意义上的情境，人的认知能力正是在情境中不断得到增强。[^(\[28\])](#chapter004.html#m28)认知的情境性凸显出认知主体自身与情境的密切关联，虽然海德格尔明确反对“认知主体”这一提法并以带有些许神秘色彩的“此在”代替，但他已经预设了他眼中原初的认知主体——“此在”是情境性的，他的这一看法使我们得以对智能主体有了全新的理解与认识，甚至实现了某种转换。


    ### 三 存在论现象学语境下情境的多维度性


    然而，将情境引入对认知和心智的解释可能会使我们遇到以下问题，即面对居于不同情境中的认知主体以及动物，比如托马斯·内格尔所举的蝙蝠，我们应该如何理解不同主体具有的心理内容，或者动物的具体情况呢？更进一步说，我们应该如何认识居于世界不同维度中的事物或对象？在海德格尔看来，就是人对于自身之外的动物和他人的可通达性，以何种方法设身处地地描述他人、动物的事实。他认为，所谓设身处地，并不意味着某个存在着的人，实际地移入另一个存在者内部，同样也不是说实际地代替另一个存在者，不是自己置身于其位置上，毋宁说，另一个存在者恰恰应该仍然保持为其所是及其如何存在。[^(\[29\])](#chapter004.html#m29)


    认知的情境性表现了认知主体同自身所处的具体情境之间的对应关系，即主体受到当时的历史条件、文化传统、自然和社会环境等要素的影响和制约。面对与自身背景不同甚至身体构造相异的对象，海德格尔提出的办法是“与之随行”，也就是直接性的体验，不是把要体验的对象从他的境遇中排斥出去，然后将自己自由地想象为他者，想象意味着对自身的遗忘。相反，成功体验他者的首要条件是保持自身存在的独立性，“在那想要或本该随行的人首先把自己放弃的地方，绝没有一道同行这回事。‘置身于……境地’既不意味着真实地置入，也不是一种简单的思想实验，完成了的某种假定”。[^(\[30\])](#chapter004.html#m30)在这里，海德格尔指出要和移情区分开来，作为精神分析的术语，移情强调被试者对于采访者情感的外在的投射和转换，是一个人在对他人同情的想象性认同的基础上，对于对方的内在情感的透彻理解。他认为移情的方式具有局限性，因为它始终将两者的关系视为先行在外的，我们总是要以由外而内的方式理解和考察对方的特殊事实，总是要设法窥探对方内在的心智内容。这样很容易被人看作一种以想象力为依据的胡思乱想。


    如何理解动物（比如蝙蝠）置身的处境，内格尔在《成为一只蝙蝠可能是什么样子》一文中通过思想实验探讨了人获取蝙蝠在主观上具有的现象经验的可能性。在海德格尔看来，成为一只蝙蝠的关键在于复刻它的存在方式，以其活动和感觉方式，以其攻击猎物和躲避天敌的方式与蝙蝠随行。与海德格尔的观点有些类似，内格尔认为，理解蝙蝠的现象经验的实质是具有和蝙蝠一样的感知世界的知觉模式（与人类的活动相异，蝙蝠是通过自身的声呐和回音系统来判断地形、捕捉食物、分辨距离），但我们只能凭借自身的经验想象某人具有类似于蝙蝠的行为方式，比如用嘴去捕捉昆虫，利用高频声音信号系统感知周围世界，以脚倒挂于高处等，却始终不知道蝙蝠之为蝙蝠可能是什么样子。[^(\[31\])](#chapter004.html#m31)与内格尔不同的是，海德格尔的讨论没有涉及动物本身的构造以及感觉经验，他并不怀疑“此在”通达其他动物这一事件的可能性，他在意的是前者是否能够进到动物存在的界域之中。“成问题的根本不是，动物本身仿佛自己携带着那样一个可置身的领域，成问题的只不过是，我们自己实际上能否成功地置身于这种特定的领域，成问题的仍然是衡量那种设身处地的实际的、必要的尺度以及实际的界限。”[^(\[32\])](#chapter004.html#m32)我们的理解是，动物的存在始终是向我们敞开的，它为我们留了置于它之内的理解空间，不论是以存在论的方式，还是以科学研究的方式，只是“此在”尚未找到通达动物本身的可能手段。


    海德格尔提出了三个引导性命题：石头（质料性的东西）无世界，动物缺乏世界，人形成着世界。虽然他的目的在于追问“什么是世界”这一形而上学的问题，但在某种程度上，海德格尔以这样的论断表明了世界（情境）的多维度性，动物的世界局限于某个特定的地带，并且这种规模和范围都是固定的。工蜂熟悉它们所寻找的花朵的颜色和香味，但它们不会把这朵花的雄蕊当作雄蕊来认识，它们不认识植物的根，它们不认识雄蕊或叶片这些东西。[^(\[33\])](#chapter004.html#m33)与之相比，人的情境是丰富的，在规模、范围上也更大，但人无法完整地占有情境（世界），即使我们能够借助外在的仪器工具不断加深探索的深度和扩大探索的广度。情境（世界）的多维度、多层次性使我们只能观察到有限的对象，外在的认知工具增强和延展了人们的感知机制，帮助其感知外部的客体，例如，借助正电子发射断层扫描（Positron
    Emission Tomography）以及功能性磁共振成像（functional Magnetic Resonance Imaging）技术，人们可以观察到神经激活模式的现象活动。相较而言，内在的认知工具（比如自省）使我们能够觉知到自己的意识和内在经验，专注于自己的内在世界。需要注意的是，使用外在的技术手段和工具观察大脑状态和对心理状态的内在觉察不能等同。在我们看来，自我认知有内外之分，对外物的认知也有着层次之别，认知对象处于各自的时空框架之中，在不同的认知条件下，人类主体观察和认知到的是同一事物的现象层面，因而每一不同的现象层面都表示一个认知世界，人类认知也因此表现为不同认知世界之间的迁移和转换，在不同的条件下，我们所面对的是不同的认知世界。


    任何工具、理论和假设都有其适用区间，[^(\[34\])](#chapter004.html#m34)都适用于各自所属的认知世界，而每一个认知世界都是由具备相同的结构、属性、关系和过程的实体所构成的，比如原子、电子、质子和中子等微粒子组成的微观世界，以及行星、恒星和星系等组成的宇观世界。在特定的条件下，我们只能观察到某一认知世界包含的对象内容，人的注意力是一个连续的过程，不可能同时观察不同的认知世界，对某一认知世界的考察意味着其他认知世界的暂时退却和缺失。比如，用肉眼看到的桌子和借助电子显微镜看到的桌子有些不同：正常情况下，我们感知到桌子相对于周围环境处于一种静止状态，但透过电子显微镜，我们看到的是不断运动中的粒子以及它们之间的相互作用，桌子不再作为一个整体存在向我们显现。不同的认知世界展现出了人们所面对的情境的多维度和多层次性，由此需要不同的概念理论描述从属于不同认知世界中的对象或现象。所以，我们要澄清误区，无论从横向还是纵向看，我们面对的情境从来都不是铁板一块。


    在如何认识、通达处于不同情境的主体这一问题上，海德格尔认为这与人们通达蝙蝠等动物的情况相异，“此在”不存在如何置于他人中的问题，也就是说，“此在”无须假设自己置于其他人所处情境的可能性，因为“此在”的本质就是与人共在，这是奠基于“此在”本身的特征，“此在”也就是在他者之中，与他人共同生存。在海德格尔看来，人在日常生活中并行不悖的生存现象给我们造成一种错觉，即我们只能通过移情的方式通达、理解他人，彼此之间是相互独立、自在自为的个体，与他人随行的初始与终端都是“自我”，都是唯我的。我可以谈论你的关联行止和我的关联行止，也可以谈论你的活动中的存在之领会和我的活动中的存在之领会，但这不应导致我认为你的关联行止在你的世界之中而我的关联行止在“我”的世界之中，或者你有你的存在之领会而我有我的存在之领会。[^(\[35\])](#chapter004.html#m35)海德格尔的意图就是消除这种唯我论的色彩，去除自我的图像。正如海德格尔多次强调的，一定要从生存论的意义出发看待“此在”，如果把“此在”看作诸多独立、具有各自特殊性的主体，那就意味着又将“此在”带回了现成性的范畴当中，使得我们只知晓自己的内在经验，从而难免走向质疑他心存在的怀疑论立场。因此，海德格尔主张放弃将人视作主体、心智或意识这一观念，而要首先且必须理解为生存着的东西，从某种意义上说，他排斥基于个人的意向状态的交互认知形式。“此在”是在与上手事物的打交道中（操劳）发现自己的，同样的，它也在同其他“此在”打交道的过程中（操持）发现他人。他人首先不是作为主体向我们呈现，而是在人共同与事物和他人打交道的实践活动中才为我们所识，海德格尔倾向于从实践维度把捉他人的存在，理解他人不是表现为一种认知关系。如果海德格尔的观点是正确的，那么他是将认知他人心智的问题消解了，至少是替换了。


    从存在论的视角看，对居于不同情境中的人的认知和理解不能单纯地通过移情或设身处地地想象等技术性手段来解决，即“从首先被给定为茕茕孑立的自己的主体通到首先根本封闭不露的其他主体”。[^(\[36\])](#chapter004.html#m36)和他人共在是“此在”的一个生存论要素，由于“此在”（人）的本质是“在世存在”，世界作为所有“此在”共同展示的意义的境域而被“此在”共享，“此在的世界是共同世界”，[^(\[37\])](#chapter004.html#m37)共在成为“此在”生存先天规定的样式。在海德格尔看来，人们之所以会遭遇棘手的“他心”问题，就在于仍将“此在”理解为某种现成的存在者或范畴，共在不是多个主体的聚合，不是一定数目的主体摆在那里，而是“此在”生存意蕴的展开。其他“此在”早已先天呈现在我的生存视域当中，所处情境的差异性不会影响我们对他人的理解，在世存在先在地确定了我们与他者共同在此这一现象。从这种意义上讲，我与“他人”都是“此在”，没有分别，“‘他人’并不等于说在我之外的全体余数，而这个我则从这全部余数中兀然特立；他人倒是我们本身多半与之无别、我们也在其中的那些人”。[^(\[38\])](#chapter004.html#m38)海德格尔并不关注他人内在的“私人语言”和意识体验，这些都是存在者层面的东西，他所要思考的是我的“此在”与他人的“此在”在生存论上的联结，也就是在上手的操劳活动中与他人相关。就像上手的应对活动被打断时会瞠目凝视一样，对他人心理内容和意识体验的关注也是一种有缺陷的、派生的共在方式，对用具的本真理解是通过流畅、沉浸的实践操用获得的，对他人的认识和理解不是依靠主观的诸认知形式，而要基于“此在”原初的生存状况（共在）。


    概言之，海德格尔排除了主体主义哲学隐含的“无我何他”的预设，即对他人的理解和认知必须以某一明晰的自我作为出发点，不同自我之间的相互理解是一种存在关系而非认知关系。不是移情和设身处地地理解构成人的共在，而是只有以共在为基础，以移情方式认知和理解他人才成为可能。我们看到，海德格尔将认知他人的问题放到“此在”共享操劳活动这一背景中来解决，表现出对于“此在”日常打交道活动的极度重视，从某种角度表明了“此在”实践性的行动维度，而行动在我们看来正是“此在”具有的一个重要功能。对于同一事物而言，它向来以认知对象和实践对象的存在方式向我们显现，因而“此在”暗含着从认知主体到实践主体的延伸，具体表现为表征向行动的功能扩展。


    ## 第三节 从表征到行动：主体核心功能的延伸


    作为“后笛卡尔主义”的概念，“此在”不仅仅具有表征世界的功能与作用。它反对心智作为某种完备、独立的表征系统对客观、外在的世界施加影响，相比而言，“此在”能做到更多。要充分描述和说明人在世界中的行动，只通过心智表征显然是不够的，心智的计算模型尚不足以充分描述情境化的人类活动。在前述中我们阐明了所认为的存在论认知具有的一个核心论题，即情境性认知对离身性认知的取代。既然认知是在情境中发生的，而情境又确定了和主体当下关切之物相关联的事实，那么认知行为与过程的施动主体也需要予以相应的改变，换言之，是我们对主体的判断应当作出改变。人作为“此在”“在世界之中”，而“在世存在”从某种意义上说就是情境化。情境就像一张大网包裹着表征与规则，它本身不能被表征并用规则加以形式化，因为后者只有在情境中才是有意义的，情境是构成人类认知的重要成分。故而，有学者将“此在”区分为“此在[1]”和“此在[2]”：“此在[1]”是指我们与世界之间具有的因果性、机械性联结，比如，只有物体将光线反射到视网膜上，它才会被我们所看见，相反，我们看不到视线之外的东西；“此在[2]”是我们在具有意义的情境、体验以及筹划中表现出的实践上的因缘关系。[^(\[39\])](#chapter004.html#m39)对于“此在[2]”而言，它要应对的不是命题之间纯粹的逻辑联结，也不是事物之间的因果关系，而是在“此在”对存在理解的基础上和世界的某种实践与行动关联。


    在海德格尔看来，人的所有活动（包括认知与行动）都以厘清和回答存在问题为前提，明晰自身和诸多存在者的存在方式，需要以对存在之本真理解为先决条件，这才是理解和认识事物的根本方式。正是在这一点上，海德格尔同笛卡尔的认知路径决裂了，[^(\[40\])](#chapter004.html#m40)关乎认知者与被认知者关系的认识论问题被关乎我们是何种存在者和我们的存在如何紧密关联于世界之可理解性的存在论问题所取代。[^(\[41\])](#chapter004.html#m41)而这种对存在的领会不能被清楚明白地予以解释和说明，它不存在于表征形式当中，更不是主体内在具有的信念系统，而是需要人们从“此在”日常的实践行动中去寻获。恰如狄尔泰所言，“一切沉思、严肃的探索和思维皆源于生活这个深不可测的东西，一切知识都植根于这个从未充分认识的东西”，[^(\[42\])](#chapter004.html#m42)他与海德格尔一样，都认为思维认知是实践行动的派生物，后者才是最根本的，而不是相反，认知过程不是驱动人类行动的一种机制。也就是说，认知与行动相异。


    ### 一 认知与行动：孰先孰后'
  fmt: '

    无论是情境、背景抑或是语境，对人类而言都是其遭遇事实、言说话语和解决问题时所处的环境，共同的特征在于不能由规则来定义，或者予以形式化和符号化处理。情境性是人类认知和心理过程的基本特征，对人而言，任何符号、任务以及事实从不会孤立地出现，即便是现代人难以识别的符号，比如古埃及、古苏美尔人留下的神秘文字符号也不是孤立的，只是人们尚未弄清其背后隐藏的意义联系而已。意义、规则、信息、表征或知识也不是固定的，只是以恰当的方式`X`附着在给定的符号上面而已，是否“恰当”则基于当下的情境。强调情境在认知过程中的作用表明海德格尔是在以自下而上的方式看待智能，与之相反，笛卡尔描述智能的方式则是自上而下的。在我们看来，自上而下的进路彰显了人们先前寄托于理性的殷切愿景，认为理性绝缘于外在世界，认知无须环境的支撑，人类理性仅凭自身就可以产生具有确定性的认知结果。事实证明，理性的功能与作用被过分地夸大和高估了，虽然人类理性擅长于推理、思维等高阶的离线认知活动，感性只是负责知觉等低阶的在线认知，但情境对头脑中的信息加工亦具有影响力。从进化论的角度看，人类的进化和成长是自身不断适应自然环境的结果，社会和文化的形成反过来又成为人类认知能力进步的加速器。我们深深地依赖自己所创造的文化，这种依赖性拓展至各种符号表征和思想。孤立于社会之外的个体不可能发展出语言或任何形式的符号思想，也不可能拥有任何一种真正符号。事实上，孤立的人脑不会像一个符号化的器官一样工作，它与猩猩的脑没有多大区别。很显然，它无法凭借自身产生出符号表征。只能通过强有力的文化适应才能做到这一点。[^(\[25\])](#chapter004.html#m25)


    我们可以看到，关于人类认知抑或智能，无论是对哪种现象的考察，情境都不能缺席，逻辑的、抽象化的描述方式不足以完全刻画认知过程的实质内容，即便它足够深刻。在我们看来，人的智能和认知并不完全体现为程序性、明晰性以及确定性，不等同于计算机需要利用规则加工信息，它可能更多是人类理性经过“抽丝剥茧”处理后的结果，是“哲学成为科学”这一古老传统的延续（尤其是自近代以来）。认知的目的在于获得确定的意义，但意义的确定性不是由对象单独呈现，而是在对象所处情境中涌现出来的，事物正是在渗透着人类活动的情境中获得其意义的。德雷福斯拒绝对情境作任何形式上的处理，他认为人对情境的理解是含混的，意欲在某种“模型结构”之中无意识地、明晰地表达关于情境的事实，这样的努力只是一种虚假的“本体论假设”，我们之所以把一个事物当作一把椅子识别了出来，其含义是理解了它同其他事物以及人之间的关系。[^(\[26\])](#chapter004.html#m26)情境不可能在一种产生批判之距离的反思中完全把握住并予以客观化，它是模糊的，我们只会把意向投射到我们所关注的事物上，一个具有明晰性、确定性并且可控的世界只是柏拉图的理念，是充满了乐观主义的假设。正如德雷福斯所言，情境不等同于一种物理状态，“情境的类型不可能与物理状态的类型相同”，[^(\[27\])](#chapter004.html#m27)后者可以被精确量化，被抽象为一群能够按照规则加以组合的独立元素，是可以被形式化的函数表达式。然而，从严格的意义上说，情境并不局限于物理状态，它包括了文化、社会、历史传统以及身体、环境等诸多要素，体现了要素间的内在关联性。海德格尔虽然指出“在世存在”是人类认知活动的根本模式，但需要厘清的是，认知主体嵌入的不是纯粹的物理世界，而是充斥着实践和习俗的社会文化世界，我们在对这个世界有所认识之前便已经浸没在文化传统之中，文化可以视为终极意义上的情境，人的认知能力正是在情境中不断得到增强。[^(\[28\])](#chapter004.html#m28)认知的情境性凸显出认知主体自身与情境的密切关联，虽然海德格尔明确反对“认知主体”这一提法并以带有些许神秘色彩的“此在”代替，但他已经预设了他眼中原初的认知主体——“此在”是情境性的，他的这一看法使我们得以对智能主体有了全新的理解与认识，甚至实现了某种转换。


    ## 三 存在论现象学语境下情境的多维度性


    然而，将情境引入对认知和心智的解释可能会使我们遇到以下问题，即面对居于不同情境中的认知主体以及动物，比如托马斯·内格尔所举的蝙蝠，我们应该如何理解不同主体具有的心理内容，或者动物的具体情况呢？更进一步说，我们应该如何认识居于世界不同维度中的事物或对象？在海德格尔看来，就是人对于自身之外的动物和他人的可通达性，以何种方法设身处地地描述他人、动物的事实。他认为，所谓设身处地，并不意味着某个存在着的人，实际地移入另一个存在者内部，同样也不是说实际地代替另一个存在者，不是自己置身于其位置上，毋宁说，另一个存在者恰恰应该仍然保持为其所是及其如何存在。[^(\[29\])](#chapter004.html#m29)


    认知的情境性表现了认知主体同自身所处的具体情境之间的对应关系，即主体受到当时的历史条件、文化传统、自然和社会环境等要素的影响和制约。面对与自身背景不同甚至身体构造相异的对象，海德格尔提出的办法是“与之随行”，也就是直接性的体验，不是把要体验的对象从他的境遇中排斥出去，然后将自己自由地想象为他者，想象意味着对自身的遗忘。相反，成功体验他者的首要条件是保持自身存在的独立性，“在那想要或本该随行的人首先把自己放弃的地方，绝没有一道同行这回事。‘置身于……境地’既不意味着真实地置入，也不是一种简单的思想实验，完成了的某种假定”。[^(\[30\])](#chapter004.html#m30)在这里，海德格尔指出要和移情区分开来，作为精神分析的术语，移情强调被试者对于采访者情感的外在的投射和转换，是一个人在对他人同情的想象性认同的基础上，对于对方的内在情感的透彻理解。他认为移情的方式具有局限性，因为它始终将两者的关系视为先行在外的，我们总是要以由外而内的方式理解和考察对方的特殊事实，总是要设法窥探对方内在的心智内容。这样很容易被人看作一种以想象力为依据的胡思乱想。


    如何理解动物（比如蝙蝠）置身的处境，内格尔在《成为一只蝙蝠可能是什么样子》一文中通过思想实验探讨了人获取蝙蝠在主观上具有的现象经验的可能性。在海德格尔看来，成为一只蝙蝠的关键在于复刻它的存在方式，以其活动和感觉方式，以其攻击猎物和躲避天敌的方式与蝙蝠随行。与海德格尔的观点有些类似，内格尔认为，理解蝙蝠的现象经验的实质是具有和蝙蝠一样的感知世界的知觉模式（与人类的活动相异，蝙蝠是通过自身的声呐和回音系统来判断地形、捕捉食物、分辨距离），但我们只能凭借自身的经验想象某人具有类似于蝙蝠的行为方式，比如用嘴去捕捉昆虫，利用高频声音信号系统感知周围世界，以脚倒挂于高处等，却始终不知道蝙蝠之为蝙蝠可能是什么样子。[^(\[31\])](#chapter004.html#m31)与内格尔不同的是，海德格尔的讨论没有涉及动物本身的构造以及感觉经验，他并不怀疑“此在”通达其他动物这一事件的可能性，他在意的是前者是否能够进到动物存在的界域之中。“成问题的根本不是，动物本身仿佛自己携带着那样一个可置身的领域，成问题的只不过是，我们自己实际上能否成功地置身于这种特定的领域，成问题的仍然是衡量那种设身处地的实际的、必要的尺度以及实际的界限。”[^(\[32\])](#chapter004.html#m32)我们的理解是，动物的存在始终是向我们敞开的，它为我们留了置于它之内的理解空间，不论是以存在论的方式，还是以科学研究的方式，只是“此在”尚未找到通达动物本身的可能手段。


    海德格尔提出了三个引导性命题：石头（质料性的东西）无世界，动物缺乏世界，人形成着世界。虽然他的目的在于追问“什么是世界”这一形而上学的问题，但在某种程度上，海德格尔以这样的论断表明了世界（情境）的多维度性，动物的世界局限于某个特定的地带，并且这种规模和范围都是固定的。工蜂熟悉它们所寻找的花朵的颜色和香味，但它们不会把这朵花的雄蕊当作雄蕊来认识，它们不认识植物的根，它们不认识雄蕊或叶片这些东西。[^(\[33\])](#chapter004.html#m33)与之相比，人的情境是丰富的，在规模、范围上也更大，但人无法完整地占有情境（世界），即使我们能够借助外在的仪器工具不断加深探索的深度和扩大探索的广度。情境（世界）的多维度、多层次性使我们只能观察到有限的对象，外在的认知工具增强和延展了人们的感知机制，帮助其感知外部的客体，例如，借助正电子发射断层扫描（Positron
    Emission Tomography）以及功能性磁共振成像（functional Magnetic Resonance Imaging）技术，人们可以观察到神经激活模式的现象活动。相较而言，内在的认知工具（比如自省）使我们能够觉知到自己的意识和内在经验，专注于自己的内在世界。需要注意的是，使用外在的技术手段和工具观察大脑状态和对心理状态的内在觉察不能等同。在我们看来，自我认知有内外之分，对外物的认知也有着层次之别，认知对象处于各自的时空框架之中，在不同的认知条件下，人类主体观察和认知到的是同一事物的现象层面，因而每一不同的现象层面都表示一个认知世界，人类认知也因此表现为不同认知世界之间的迁移和转换，在不同的条件下，我们所面对的是不同的认知世界。


    任何工具、理论和假设都有其适用区间，[^(\[34\])](#chapter004.html#m34)都适用于各自所属的认知世界，而每一个认知世界都是由具备相同的结构、属性、关系和过程的实体所构成的，比如原子、电子、质子和中子等微粒子组成的微观世界，以及行星、恒星和星系等组成的宇观世界。在特定的条件下，我们只能观察到某一认知世界包含的对象内容，人的注意力是一个连续的过程，不可能同时观察不同的认知世界，对某一认知世界的考察意味着其他认知世界的暂时退却和缺失。比如，用肉眼看到的桌子和借助电子显微镜看到的桌子有些不同：正常情况下，我们感知到桌子相对于周围环境处于一种静止状态，但透过电子显微镜，我们看到的是不断运动中的粒子以及它们之间的相互作用，桌子不再作为一个整体存在向我们显现。不同的认知世界展现出了人们所面对的情境的多维度和多层次性，由此需要不同的概念理论描述从属于不同认知世界中的对象或现象。所以，我们要澄清误区，无论从横向还是纵向看，我们面对的情境从来都不是铁板一块。


    在如何认识、通达处于不同情境的主体这一问题上，海德格尔认为这与人们通达蝙蝠等动物的情况相异，“此在”不存在如何置于他人中的问题，也就是说，“此在”的本质就是与人共在，这是奠基于“此在”本身的特征，“此在”也就是在他者之中，与他人共同生存。在海德格尔看来，人在日常生活中并行不悖的生存现象给我们造成一种错觉，即我们只能通过移情的方式通达、理解他人，彼此之间是相互独立、自在自为的个体，与他人随行的初始与终端都是“自我”，都是唯我的。我可以谈论你的关联行止和我的关联行止，也可以谈论你的活动中的存在之领会和我的活动中的存在之领会，但这不应导致我认为你的关联行止在你的世界之中而我的关联行止在“我”的世界之中，或者你有你的存在之领会而我有我的存在之领会。[^(\[35\])](#chapter004.html#m35)海德格尔的意图就是消除这种唯我论的色彩，去除自我的图像。正如海德格尔多次强调的，一定要从生存论的意义出发看待“此在”，如果把“此在”看作诸多独立、具有各自特殊性的主体，那就意味着又将“此在”带回了现成性的范畴当中，使得我们只知晓自己的内在经验，从而难免走向质疑他心存在的怀疑论立场。因此，海德格尔主张放弃将人视作主体、心智或意识这一观念，而要首先且必须理解为生存着的东西，从某种意义上说，他排斥基于个人的意向状态的交互认知形式。“此在”是在与上手事物的打交道中（操劳）发现自己的，同样的，它也在同其他“此在”打交道的过程中（操持）发现他人。他人首先不是作为主体向我们呈现，而是在人共同与事物和他人打交道的实践活动中才为我们所识，海德格尔倾向于从实践维度把捉他人的存在，理解他人不是表现为一种认知关系。如果海德格尔的观点是正确的，那么他是将认知他人心智的问题消解了，至少是替换了。


    从存在论的视角看，对居于不同情境中的人的认知和理解不能单纯地通过移情或设身处地地想象等技术性手段来解决，即“从首先被给定为茕茕孑立的自己的主体通到首先根本封闭不露的其他主体”。[^(\[36\])](#chapter004.html#m36)和他人共在是“此在”的一个生存论要素，由于“此在”（人）的本质是“在世存在”，世界作为所有“此在”共同展示的意义的境域而被“此在”共享，“此在的世界是共同世界”，[^(\[37\])](#chapter004.html#m37)共在成为“此在”生存先天规定的样式。在海德格尔看来，人们之所以会遭遇棘手的“他心”问题，就在于仍将“此在”理解为某种现成的存在者或范畴，共在不是多个主体的聚合，不是一定数目的主体摆在那里，而是“此在”生存意蕴的展开。其他“此在”早已先天呈现在我的生存视域当中，所处情境的差异性不会影响我们对他人的理解，在世存在先在地确定了我们与他者共同在此这一现象。从这种意义上讲，我与“他人”都是“此在”，没有分别，“‘他人’并不等于说在我之外的全体余数，而这个我则从这全部余数中兀然特立；他人倒是我们本身多半与之无别、我们也在其中的那些人”。[^(\[38\])](#chapter004.html#m38)海德格尔并不关注他人内在的“私人语言”和意识体验，这些都是存在者层面的东西，他所要思考的是我的“此在”与他人的“此在”在生存论上的联结，也就是在上手的操劳活动中与他人相关。就像上手的应对活动被打断时会瞠目凝视一样，对他人心理内容和意识体验的关注也是一种有缺陷的、派生的共在方式，对用具的本真理解是通过流畅、沉浸的实践操用获得的，对他人的认识和理解不是依靠主观的诸认知形式，而要基于“此在”原初的生存状况（共在）。


    概言之，海德格尔排除了主体主义哲学隐含的“无我何他”的预设，即对他人的理解和认知必须以某一明晰的自我作为出发点，不同自我之间的相互理解是一种存在关系而非认知关系。不是移情和设身处地地理解构成人的共在，而是只有以共在为基础，以移情方式认知和理解他人才成为可能。我们看到，海德格尔将认知他人的问题放到“此在”共享操劳活动这一背景中来解决，表现出对于“此在”日常打交道活动的极度重视，从某种角度表明了“此在”实践性的行动维度，而行动在我们看来正是“此在”具有的一个重要功能。对于同一事物而言，它向来以认知对象和实践对象的存在方式向我们显现，因而“此在”暗含着从认知主体到实践主体的延伸，具体表现为表征向行动的功能扩展。


    ## 第三节 从表征到行动：主体核心功能的延伸


    作为“后笛卡尔主义”的概念，“此在”不仅仅具有表征世界的功能与作用。它反对心智作为某种完备、独立的表征系统对客观、外在的世界施加影响，相比而言，“此在”能做到更多。要充分描述和说明人在世界中的行动，只通过心智表征显然是不够的，心智的计算模型尚不足以充分描述情境化的人类活动。在前述中我们阐明了所认为的存在论认知具有的一个核心论题，即情境性认知对离身性认知的取代。既然认知是在情境中发生的，而情境又确定了和主体当下关切之物相关联的事实，那么认知行为与过程的施动主体也需要予以相应的改变，换言之，是我们对主体的判断应当作出改变。人作为“此在”“在世界之中”，而“在世存在”从某种意义上说就是情境化。情境就像一张大网包裹着表征与规则，它本身不能被表征并用规则加以形式化，因为后者只有在情境中才是有意义的，情境是构成人类认知的重要成分。故而，有学者将“此在”区分为“`此在[1]`”和“`此在[2]`”：“`此在[1]`”是指我们与世界之间具有的因果性、机械性联结，比如，只有物体将光线反射到视网膜上，它才会被我们所看见，相反，我们看不到视线之外的东西；“`此在[2]`”是我们在具有意义的情境、体验以及筹划中表现出的实践上的因缘关系。[^(\[39\])](#chapter004.html#m39)对于“`此在[2]`”而言，它要应对的不是命题之间纯粹的逻辑联结，也不是事物之间的因果关系，而是在“此在”对存在理解的基础上和世界的某种实践与行动关联。


    在海德格尔看来，人的所有活动（包括认知与行动）都以厘清和回答存在问题为前提，明晰自身和诸多存在者的存在方式，需要以对存在之本真理解为先决条件，这才是理解和认识事物的根本方式。正是在这一点上，海德格尔同笛卡尔的认知路径决裂了，[^(\[40\])](#chapter004.html#m40)关乎认知者与被认知者关系的认识论问题被关乎我们是何种存在者和我们的存在如何紧密关联于世界之可理解性的存在论问题所取代。[^(\[41\])](#chapter004.html#m41)而这种对存在的领会不能被清楚明白地予以解释和说明，它不存在于表征形式当中，更不是主体内在具有的信念系统，而是需要人们从“此在”日常的实践行动中去寻获。恰如狄尔泰所言，“一切沉思、严肃的探索和思维皆源于生活这个深不可测的东西，一切知识都植根于这个从未充分认识的东西”，[^(\[42\])](#chapter004.html#m42)他与海德格尔一样，都认为思维认知是实践行动的派生物，后者才是最根本的，而不是相反，认知过程不是驱动人类行动的一种机制。也就是说，认知与行动相异。


    ### 一 认知与行动：孰先孰后

    '
  trans: '


    无论是情境、背景抑或是语境，对人类而言都是其遭遇事实、言说话语和解决问题时所处的环境，共同的特征在于不能由规则来定义，或者予以形式化和符号化处理。情境性是人类认知和心理过程的基本特征，对人而言，任何符号、任务以及事实从不会孤立地出现，即便是现代人难以识别的符号，比如古埃及、古苏美尔人留下的神秘文字符号也不是孤立的，只是人们尚未弄清其背后隐藏的意义联系而已。意义、规则、信息、表征或知识也不是固定的，只是以恰当的方式`X`附着在给定的符号上面而已，是否“恰当”则基于当下的情境。强调情境在认知过程中的作用表明海德格尔是在以自下而上的方式看待智能，与之相反，笛卡尔描述智能的方式则是自上而下的。在我们看来，自上而下的进路彰显了人们先前寄托于理性的殷切愿景，认为理性绝缘于外在世界，认知无须环境的支撑，人类理性仅凭自身就可以产生具有确定性的认知结果。事实证明，理性的功能与作用被过分地夸大和高估了，虽然人类理性擅长于推理、思维等高阶的离线认知活动，感性只是负责知觉等低阶的在线认知，但情境对头脑中的信息加工亦具有影响力。从进化论的角度看，人类的进化和成长是自身不断适应自然环境的结果，社会和文化的形成反过来又成为人类认知能力进步的加速器。我们深深地依赖自己所创造的文化，这种依赖性拓展至各种符号表征和思想。孤立于社会之外的个体不可能发展出语言或任何形式的符号思想，也不可能拥有任何一种真正符号。事实上，孤立的人脑不会像一个符号化的器官一样工作，它与猩猩的脑没有多大区别。很显然，它无法凭借自身产生出符号表征。只能通过强有力的文化适应才能做到这一点。[^(\[25\])](#chapter004.html#m25)


    我们可以看到，关于人类认知抑或智能，无论是对哪种现象的考察，情境都不能缺席，逻辑的、抽象化的描述方式不足以完全刻画认知过程的实质内容，即便它足够深刻。在我们看来，人的智能和认知并不完全体现为程序性、明晰性以及确定性，不等同于计算机需要利用规则加工信息，它可能更多是人类理性经过“抽丝剥茧”处理后的结果，是“哲学成为科学”这一古老传统的延续（尤其是自近代以来）。认知的目的在于获得确定的意义，但意义的确定性不是由对象单独呈现，而是在对象所处情境中涌现出来的，事物正是在渗透着人类活动的情境中获得其意义的。德雷福斯拒绝对情境作任何形式上的处理，他认为人对情境的理解是含混的，意欲在某种“模型结构”之中无意识地、明晰地表达关于情境的事实，这样的努力只是一种虚假的“本体论假设”，我们之所以把一个事物当作一把椅子识别了出来，其含义是理解了它同其他事物以及人之间的关系。[^(\[26\])](#chapter004.html#m26)情境不可能在一种产生批判之距离的反思中完全把握住并予以客观化，它是模糊的，我们只会把意向投射到我们所关注的事物上，一个具有明晰性、确定性并且可控的世界只是柏拉图的理念，是充满了乐观主义的假设。正如德雷福斯所言，情境不等同于一种物理状态，“情境的类型不可能与物理状态的类型相同”，[^(\[27\])](#chapter004.html#m27)后者可以被精确量化，被抽象为一群能够按照规则加以组合的独立元素，是可以被形式化的函数表达式。然而，从严格的意义上说，情境并不局限于物理状态，它包括了文化、社会、历史传统以及身体、环境等诸多要素，体现了要素间的内在关联性。海德格尔虽然指出“在世存在”是人类认知活动的根本模式，但需要厘清的是，认知主体嵌入的不是纯粹的物理世界，而是充斥着实践和习俗的社会文化世界，我们在对这个世界有所认识之前便已经浸没在文化传统之中，文化可以视为终极意义上的情境，人的认知能力正是在情境中不断得到增强。[^(\[28\])](#chapter004.html#m28)认知的情境性凸显出认知主体自身与情境的密切关联，虽然海德格尔明确反对“认知主体”这一提法并以带有些许神秘色彩的“此在”代替，但他已经预设了他眼中原初的认知主体——“此在”是情境性的，他的这一看法使我们得以对智能主体有了全新的理解与认识，甚至实现了某种转换。


    ## 三 存在论现象学语境下情境的多维度性


    然而，将情境引入对认知和心智的解释可能会使我们遇到以下问题，即面对居于不同情境中的认知主体以及动物，比如托马斯·内格尔所举的蝙蝠，我们应该如何理解不同主体具有的心理内容，或者动物的具体情况呢？更进一步说，我们应该如何认识居于世界不同维度中的事物或对象？在海德格尔看来，就是人对于自身之外的动物和他人的可通达性，以何种方法设身处地地描述他人、动物的事实。他认为，所谓设身处地，并不意味着某个存在着的人，实际地移入另一个存在者内部，同样也不是说实际地代替另一个存在者，不是自己置身于其位置上，毋宁说，另一个存在者恰恰应该仍然保持为其所是及其如何存在。[^(\[29\])](#chapter004.html#m29)


    认知的情境性表现了认知主体同自身所处的具体情境之间的对应关系，即主体受到当时的历史条件、文化传统、自然和社会环境等要素的影响和制约。面对与自身背景不同甚至身体构造相异的对象，海德格尔提出的办法是“与之随行”，也就是直接性的体验，不是把要体验的对象从他的境遇中排斥出去，然后将自己自由地想象为他者，想象意味着对自身的遗忘。相反，成功体验他者的首要条件是保持自身存在的独立性，“在那想要或本该随行的人首先把自己放弃的地方，绝没有一道同行这回事。‘置身于……境地’既不意味着真实地置入，也不是一种简单的思想实验，完成了的某种假定”。[^(\[30\])](#chapter004.html#m30)在这里，海德格尔指出要和移情区分开来，作为精神分析的术语，移情强调被试者对于采访者情感的外在的投射和转换，是一个人在对他人同情的想象性认同的基础上，对于对方的内在情感的透彻理解。他认为移情的方式具有局限性，因为它始终将两者的关系视为先行在外的，我们总是要以由外而内的方式理解和考察对方的特殊事实，总是要设法窥探对方内在的心智内容。这样很容易被人看作一种以想象力为依据的胡思乱想。


    如何理解动物（比如蝙蝠）置身的处境，内格尔在《成为一只蝙蝠可能是什么样子》一文中通过思想实验探讨了人获取蝙蝠在主观上具有的现象经验的可能性。在海德格尔看来，成为一只蝙蝠的关键在于复刻它的存在方式，以其活动和感觉方式，以其攻击猎物和躲避天敌的方式与蝙蝠随行。与海德格尔的观点有些类似，内格尔认为，理解蝙蝠的现象经验的实质是具有和蝙蝠一样的感知世界的知觉模式（与人类的活动相异，蝙蝠是通过自身的声呐和回音系统来判断地形、捕捉食物、分辨距离），但我们只能凭借自身的经验想象某人具有类似于蝙蝠的行为方式，比如用嘴去捕捉昆虫，利用高频声音信号系统感知周围世界，以脚倒挂于高处等，却始终不知道蝙蝠之为蝙蝠可能是什么样子。[^(\[31\])](#chapter004.html#m31)与内格尔不同的是，海德格尔的讨论没有涉及动物本身的构造以及感觉经验，他并不怀疑“此在”通达其他动物这一事件的可能性，他在意的是前者是否能够进到动物存在的界域之中。“成问题的根本不是，动物本身仿佛自己携带着那样一个可置身的领域，成问题的只不过是，我们自己实际上能否成功地置身于这种特定的领域，成问题的仍然是衡量那种设身处地的实际的、必要的尺度以及实际的界限。”[^(\[32\])](#chapter004.html#m32)我们的理解是，动物的存在始终是向我们敞开的，它为我们留了置于它之内的理解空间，不论是以存在论的方式，还是以科学研究的方式，只是“此在”尚未找到通达动物本身的可能手段。


    海德格尔提出了三个引导性命题：石头（质料性的东西）无世界，动物缺乏世界，人形成着世界。虽然他的目的在于追问“什么是世界”这一形而上学的问题，但在某种程度上，海德格尔以这样的论断表明了世界（情境）的多维度性，动物的世界局限于某个特定的地带，并且这种规模和范围都是固定的。工蜂熟悉它们所寻找的花朵的颜色和香味，但它们不会把这朵花的雄蕊当作雄蕊来认识，它们不认识植物的根，它们不认识雄蕊或叶片这些东西。[^(\[33\])](#chapter004.html#m33)与之相比，人的情境是丰富的，在规模、范围上也更大，但人无法完整地占有情境（世界），即使我们能够借助外在的仪器工具不断加深探索的深度和扩大探索的广度。情境（世界）的多维度、多层次性使我们只能观察到有限的对象，外在的认知工具增强和延展了人们的感知机制，帮助其感知外部的客体，例如，借助正电子发射断层扫描（Positron
    Emission Tomography）以及功能性磁共振成像（functional Magnetic Resonance Imaging）技术，人们可以观察到神经激活模式的现象活动。相较而言，内在的认知工具（比如自省）使我们能够觉知到自己的意识和内在经验，专注于自己的内在世界。需要注意的是，使用外在的技术手段和工具观察大脑状态和对心理状态的内在觉察不能等同。在我们看来，自我认知有内外之分，对外物的认知也有着层次之别，认知对象处于各自的时空框架之中，在不同的认知条件下，人类主体观察和认知到的是同一事物的现象层面，因而每一不同的现象层面都表示一个认知世界，人类认知也因此表现为不同认知世界之间的迁移和转换，在不同的条件下，我们所面对的是不同的认知世界。


    任何工具、理论和假设都有其适用区间，[^(\[34\])](#chapter004.html#m34)都适用于各自所属的认知世界，而每一个认知世界都是由具备相同的结构、属性、关系和过程的实体所构成的，比如原子、电子、质子和中子等微粒子组成的微观世界，以及行星、恒星和星系等组成的宇观世界。在特定的条件下，我们只能观察到某一认知世界包含的对象内容，人的注意力是一个连续的过程，不可能同时观察不同的认知世界，对某一认知世界的考察意味着其他认知世界的暂时退却和缺失。比如，用肉眼看到的桌子和借助电子显微镜看到的桌子有些不同：正常情况下，我们感知到桌子相对于周围环境处于一种静止状态，但透过电子显微镜，我们看到的是不断运动中的粒子以及它们之间的相互作用，桌子不再作为一个整体存在向我们显现。不同的认知世界展现出了人们所面对的情境的多维度和多层次性，由此需要不同的概念理论描述从属于不同认知世界中的对象或现象。所以，我们要澄清误区，无论从横向还是纵向看，我们面对的情境从来都不是铁板一块。


    在如何认识、通达处于不同情境的主体这一问题上，海德格尔认为这与人们通达蝙蝠等动物的情况相异，“此在”不存在如何置于他人中的问题，也就是说，“此在”的本质就是与人共在，这是奠基于“此在”本身的特征，“此在”也就是在他者之中，与他人共同生存。在海德格尔看来，人在日常生活中并行不悖的生存现象给我们造成一种错觉，即我们只能通过移情的方式通达、理解他人，彼此之间是相互独立、自在自为的个体，与他人随行的初始与终端都是“自我”，都是唯我的。我可以谈论你的关联行止和我的关联行止，也可以谈论你的活动中的存在之领会和我的活动中的存在之领会，但这不应导致我认为你的关联行止在你的世界之中而我的关联行止在“我”的世界之中，或者你有你的存在之领会而我有我的存在之领会。[^(\[35\])](#chapter004.html#m35)海德格尔的意图就是消除这种唯我论的色彩，去除自我的图像。正如海德格尔多次强调的，一定要从生存论的意义出发看待“此在”，如果把“此在”看作诸多独立、具有各自特殊性的主体，那就意味着又将“此在”带回了现成性的范畴当中，使得我们只知晓自己的内在经验，从而难免走向质疑他心存在的怀疑论立场。因此，海德格尔主张放弃将人视作主体、心智或意识这一观念，而要首先且必须理解为生存着的东西，从某种意义上说，他排斥基于个人的意向状态的交互认知形式。“此在”是在与上手事物的打交道中（操劳）发现自己的，同样的，它也在同其他“此在”打交道的过程中（操持）发现他人。他人首先不是作为主体向我们呈现，而是在人共同与事物和他人打交道的实践活动中才为我们所识，海德格尔倾向于从实践维度把捉他人的存在，理解他人不是表现为一种认知关系。如果海德格尔的观点是正确的，那么他是将认知他人心智的问题消解了，至少是替换了。


    从存在论的视角看，对居于不同情境中的人的认知和理解不能单纯地通过移情或设身处地地想象等技术性手段来解决，即“从首先被给定为茕茕孑立的自己的主体通到首先根本封闭不露的其他主体”。[^(\[36\])](#chapter004.html#m36)和他人共在是“此在”的一个生存论要素，由于“此在”（人）的本质是“在世存在”，世界作为所有“此在”共同展示的意义的境域而被“此在”共享，“此在的世界是共同世界”，[^(\[37\])](#chapter004.html#m37)共在成为“此在”生存先天规定的样式。在海德格尔看来，人们之所以会遭遇棘手的“他心”问题，就在于仍将“此在”理解为某种现成的存在者或范畴，共在不是多个主体的聚合，不是一定数目的主体摆在那里，而是“此在”生存意蕴的展开。其他“此在”早已先天呈现在我的生存视域当中，所处情境的差异性不会影响我们对他人的理解，在世存在先在地确定了我们与他者共同在此这一现象。从这种意义上讲，我与“他人”都是“此在”，没有分别，“‘他人’并不等于说在我之外的全体余数，而这个我则从这全部余数中兀然特立；他人倒是我们本身多半与之无别、我们也在其中的那些人”。[^(\[38\])](#chapter004.html#m38)海德格尔并不关注他人内在的“私人语言”和意识体验，这些都是存在者层面的东西，他所要思考的是我的“此在”与他人的“此在”在生存论上的联结，也就是在上手的操劳活动中与他人相关。就像上手的应对活动被打断时会瞠目凝视一样，对他人心理内容和意识体验的关注也是一种有缺陷的、派生的共在方式，对用具的本真理解是通过流畅、沉浸的实践操用获得的，对他人的认识和理解不是依靠主观的诸认知形式，而要基于“此在”原初的生存状况（共在）。


    概言之，海德格尔排除了主体主义哲学隐含的“无我何他”的预设，即对他人的理解和认知必须以某一明晰的自我作为出发点，不同自我之间的相互理解是一种存在关系而非认知关系。不是移情和设身处地地理解构成人的共在，而是只有以共在为基础，以移情方式认知和理解他人才成为可能。我们看到，海德格尔将认知他人的问题放到“此在”共享操劳活动这一背景中来解决，表现出对于“此在”日常打交道活动的极度重视，从某种角度表明了“此在”实践性的行动维度，而行动在我们看来正是“此在”具有的一个重要功能。对于同一事物而言，它向来以认知对象和实践对象的存在方式向我们显现，因而“此在”暗含着从认知主体到实践主体的延伸，具体表现为表征向行动的功能扩展。


    ## 第三节 从表征到行动：主体核心功能的延伸


    作为“后笛卡尔主义”的概念，“此在”不仅仅具有表征世界的功能与作用。它反对心智作为某种完备、独立的表征系统对客观、外在的世界施加影响，相比而言，“此在”能做到更多。要充分描述和说明人在世界中的行动，只通过心智表征显然是不够的，心智的计算模型尚不足以充分描述情境化的人类活动。在前述中我们阐明了所认为的存在论认知具有的一个核心论题，即情境性认知对离身性认知的取代。既然认知是在情境中发生的，而情境又确定了和主体当下关切之物相关联的事实，那么认知行为与过程的施动主体也需要予以相应的改变，换言之，是我们对主体的判断应当作出改变。人作为“此在”“在世界之中”，而“在世存在”从某种意义上说就是情境化。情境就像一张大网包裹着表征与规则，它本身不能被表征并用规则加以形式化，因为后者只有在情境中才是有意义的，情境是构成人类认知的重要成分。故而，有学者将“此在”区分为“`此在[1]`”和“`此在[2]`”：“`此在[1]`”是指我们与世界之间具有的因果性、机械性联结，比如，只有物体将光线反射到视网膜上，它才会被我们所看见，相反，我们看不到视线之外的东西；“`此在[2]`”是我们在具有意义的情境、体验以及筹划中表现出的实践上的因缘关系。[^(\[39\])](#chapter004.html#m39)对于“`此在[2]`”而言，它要应对的不是命题之间纯粹的逻辑联结，也不是事物之间的因果关系，而是在“此在”对存在理解的基础上和世界的某种实践与行动关联。


    在海德格尔看来，人的所有活动（包括认知与行动）都以厘清和回答存在问题为前提，明晰自身和诸多存在者的存在方式，需要以对存在之本真理解为先决条件，这才是理解和认识事物的根本方式。正是在这一点上，海德格尔同笛卡尔的认知路径决裂了，[^(\[40\])](#chapter004.html#m40)关乎认知者与被认知者关系的认识论问题被关乎我们是何种存在者和我们的存在如何紧密关联于世界之可理解性的存在论问题所取代。[^(\[41\])](#chapter004.html#m41)而这种对存在的领会不能被清楚明白地予以解释和说明，它不存在于表征形式当中，更不是主体内在具有的信念系统，而是需要人们从“此在”日常的实践行动中去寻获。恰如狄尔泰所言，“一切沉思、严肃的探索和思维皆源于生活这个深不可测的东西，一切知识都植根于这个从未充分认识的东西”，[^(\[42\])](#chapter004.html#m42)他与海德格尔一样，都认为思维认知是实践行动的派生物，后者才是最根本的，而不是相反，认知过程不是驱动人类行动的一种机制。也就是说，认知与行动相异。


    ### 一 认知与行动：孰先孰后


