    # 第二章 存在论认知的核心概念分析


    在上一章，笔者较为细致地分析了当前认知科学领域中主要的研究纲领和进路，发现对传统的认知主义和联结主义范式的批判都呈现出一种哲学基底转换的可能趋势，也就是从笛卡尔的理性主义哲学转换为现象学、维特根斯坦日常语言哲学以及杜威的经验自然主义的共同混合体，而其中数现象学的作用最为人们所重视。在前文中，我们简要论述了胡塞尔的先验现象学与自然化现象学，发现两者在对待自然主义的态度上有着相互矛盾的方面。现象学的基本主张之一是批判主客二分的自然主义认识论及其相应的客观主义倾向，在此基础上将主体和客体之间相互依存的意向性关系确认为首要的、非二分的基础关系。[^(\[1\])](#chapter003.html#m1)在我们看来，胡塞尔向先验唯心主义的进一步转变使得他的现象学失去了作为实证性的认知科学的哲学基础之可能性，他将一切意义的源泉都置于先验主体性之内，这种主体性可以看作笛卡尔之“我思”的超越版本，世界的全部都见之于主体性本身的创造，都是主体性的成就，是先验自我的成就。先验自我是一个世界可能性的必要条件，是理解世界可能性的条件，因而在胡塞尔那里，一切绝对独立于心智的事物之实存属性都被舍弃和剥离了。胡塞尔认为，笛卡尔的“自我—我思—我思对象”结构的错误之处在于将自我视为自然世界的一部分，一种“我思物”（res
    cogitans），一种思维实体，我不是世界的一部分，世界也不是我的一部分。[^(\[2\])](#chapter003.html#m2)


    现象学还原排除了一切与自我相关的身体与心理体验，只剩下作为意义之绝对源泉的纯粹自我。这正是海德格尔诟病胡塞尔之处，他追问“存在”的意义，就是为了反对后者的“纯粹自我”概念，褪去虚无缥缈的先验光环，使人重新回到具体的现实生活（在海德格尔看来，人早已在日常的言行中展现出对于存在意义的初步理解和领会），在作为“此在”的“我”的生存过程中揭示自我的本质。因此，海德格尔没有像胡塞尔一样赋予意向性以哲学意义上的主动性和创造力，而是从人类生存的维度理解和认识意向关系，揭示出了意向认识更为基础和根本的行动维度。因此，海德格尔的存在论现象学有可能为认知科学提供一种不同于笛卡尔主义的哲学基石，有的学者也将其描述为由“心身对立”的笛卡尔剧场向“心灵—大脑—身体—环境—世界”的海德格尔剧场的转换，[^(\[3\])](#chapter003.html#m3)海德格尔在对“此在”进行生存论分析的过程中对认知重新进行了定义，创造了诸如“此在”、在世存在、上手及现成在手状态等新的概念，同时也对世界等旧有的概念作了重新解读。考察和界定核心概念是研究的基石和脚手架，因而我们首先要厘清几个主要核心概念的内涵。


    ## 第一节 “此在”：身体、实践与情境的三维一体


    “此在”这一概念是由海德格尔在其著作《存在与时间》中提出的，是其使用的一个关键词，德文是 Dasein[^(\[4\])](#chapter003.html#m4)，意思是“生存”“生活”。这个词由两部分构成，后一部分
    sein 在德语中的意思为“存在”“是”，与 being 相类似，前一部分 Da 的意思比较灵活多样，表示“此时此地”“那里”“那时”“那么”等诸多含义。海德格尔选择
    Dasein 这一不寻常的术语是为了避免引起或唤醒人们的前见，比如意识、心灵以及灵魂等概念就容易产生误导。我们在面对“此在”的时候，不能简单地依照字面意思将其理解为所谓的“在这里存在”（there-being），因为“此在”首要的含义是指人的特殊的存在方式，或者指人这种特殊的存在者，也就是人作为“此在”的根本任务在于追问存在问题。海德格尔将“此在”定义为在其存在中关心存在本身之意义的存在者，他毕生追求的目标就是弄清“存在的意义”问题，要回答这一问题，就必须从作为人的“此在”入手，因为只有“此在”这种存在者才能够追问存在问题。他说道：“我们所说的东西，我们意指的东西，我们这样那样对之有所关联行止的东西，这一切都是存在着的。我们自己的所是以及我们如何所是，这些也都存在着。在其存在与如是而存在中，在实在、现成性、持存、有效性、‘此在’中，在有（es
    gibt）中，都有着存在。”[^(\[5\])](#chapter003.html#m5)“此在”在无数的存在者中具有阐明存在意义问题的优先性，它是区别于其他存在者的，差异就在于只有“此在”能够理解存在，其他存在者的存在意义只能通过“此在”对存在问题的追问以及对存在的理解才能开显出来。因此，我们认为在海德格尔眼中，“此在”是解开“存在之谜”的唯一钥匙。


    在认知科学的视域中，尤其是具身认知、情境认知等新的认知研究理论也利用了海德格尔的“此在”概念，那么海德格尔意义上的“此在”和认知科学意义上的“此在”是一回事吗？“此在”是否与认知主体相等同呢？如果二者的内涵是不同的，那么存在哪些差别？下面我们予以详细分析。


    ### 一 “此在”的“身体”维度


    我们认为，海德格尔的“此在”概念与认知科学语境下所讲的认知主体并不等同，不能相互替换，更不能随意滥用，两者不具有同一性。首先，海德格尔所讲的“此在”似乎没有强调身体的特殊和重要意义，更未涉及“主体”甚至“主体性”，而以具身认知为核心的新的认知科学，其视域下的认知主体则是将身体置于极其重要的位置，主张以一种基于具身性的机制描述人的认知过程。身体不是一个无助的旁观者，只能在那里注视着从一种固定的感觉、行动和表象的面纱背后溜过去的东西，而是展示自己的界面和能力的积极的建筑师。[^(\[6\])](#chapter003.html#m6)在我们看来，如果从海德格尔的视角加以审视，那么强调和重视人的身体可能会遗漏对“此在”本质的考量，他认为“此在”的本质就在于它的生存，也就是说，不能将“此在”看作现成存在的存在者，这一概念着眼的不是人的身体，而是它的存在方式。海德格尔的目的在于削弱先前占统治地位的笛卡尔式的主体观念，即人的本质是自主（autonomous）、独立（self-contained）的心灵（mind）与自我（egos），人与世界之间最原初、最基本的关系是认知（诸如感知、相信、理解等等）。海德格尔对人类存在的阐释，颠覆了这种现代早已确定的自主个体概念，这一概念通过知道（knowing）、相信（believing）、感知（perceiving）等认识论状态来界定其与世界之间的关联。[^(\[7\])](#chapter003.html#m7)他通过对“此在”日常状态的现象学描述对这一传统观念进行了反驳，由于“此在”生存的基本结构是在世（being-in-the-world），它是被卷入现实环境中的，因而，实践交互实质上才是人与世界的原初关系。存在论现象学涉及的是包含人之身体的具身实践，触摸、抓取、手写以及拥抱等活动都是以身体为前提的，如果没有身体作为预设，所有这些活动便没有意义，甚至都不可理解。人的根本活动在于以身体熟练地使用器具来完成各项任务，笛卡尔式的理论沉思在此基础上才是可理解的。然而，海德格尔在《存在与时间》中没有对“此在”的身体、身体性有过任何具体的主题描述，于是人们怀疑他要么疏忽了这一重大问题，要么是完全不关心身体问题。


