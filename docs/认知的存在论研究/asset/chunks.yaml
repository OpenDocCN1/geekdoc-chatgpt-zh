- raw: '第二，人的情绪感觉不可计算，计算对于情感而言是不充分的。人们现在普遍认识到，人的认知活动与情感相互交织，不可分割，概念、判断、演绎、推理等理性思维形式都受到某种情感因素、情绪或动机的影响。在萨伽德看来，推理过程往往就是一种情感过程，人类思维和推理活动的许多方面都受情感积极抑或消极的影响。[^(\[33\])](#chapter002.html#m33)对认知的描述与理解离不开对情感的说明，纯粹理性的认知过程是不存在的。我们认为，基于抽象的逻辑形式规则建立的计算结构或程序不能理解情感，无力对主观性的情绪进行数字化、客观化的解释，因为情感是第一人称的、感受性的体验，某种类型的情绪体验不能被某种计算状态所决定和实现，两者之间并非一一对应的关系。更重要的是，人的情感体验伴随着身体感觉，依据威廉·詹姆斯（William
    James）的情绪理论，情感/情绪是我们在受到外部事实的刺激时对身体变化的感知，不同情感状态之间的转换一定具有某种躯体表现，人们是因为哭泣感到悲伤，因为颤抖感到恐惧，因为报复感到愤怒，而不是相反。詹姆斯认为，没有知觉而起的躯体状态，知觉就只是一种纯粹的、苍白暗淡的、没有情绪激动的认知，没有身体上的变化，情绪所剩的只是一种冷静的、中性的、理智上的感知状态。[^(\[34\])](#chapter002.html#m34)相当多的证据表明，主体处于某种特定情感状态时的感觉包含着他对与这一情绪相关的身体变化与反应的感知，一些身体变化与情感模式之间具有非常密切的相关性，比如，当我们感到恐惧时，若取消掉全部的身体感觉，只保留关于危险的信念判断，那么这样的情绪便很难称为恐惧了。


    在我们看来，主张情感体验可以计算蕴含着对情感的抽象化理解，然而，这种抽象理解的前提在于一种强认知主义立场，即情感就是认知评价和判断，而判断和评价能够被抽象化、形式化为承载语义的符号信息。从这种意义上说，强认知主义视域下的情感可以进行计算，而且国外已有学者作了相关研究，保罗·萨伽德以环境、身体和心理状态作为变量建立了以数学演绎或工具模拟为特征的关于情感的动态系统，通过计算机模拟该系统的运行状况解释情感现象。[^(\[35\])](#chapter002.html#m35)但是剥离了身体感觉的情感毕竟是不完整的，它缺失了主观维度的感受性体验，但这正是情感和理性认知之间的一个有效区分。认知本身无法产生一个情绪状态，[^(\[36\])](#chapter002.html#m36)抽象化、程式化的符号计算亦无法生成情绪。此外，对情感的纯形式化描述也未必可以实现对情感的精确预测和解释，情感是多变的，主体有能力在各种情绪状态之间自由切换，可以人为控制自身的情绪，故常有喜怒不形于色的说法。因此，我们认为情感和意志活动相类似，亦不遵循规则，不能纳入基于算法规则的计算主义解释框架。概言之，人的情感或情绪不可计算。


    第三，人的审美认识和体验不可计算。在康德眼中，人类认识的知性能力要求建立一个可以统摄一切经验对象的完整系统，这与计算主义致力实现的目标不谋而合。但由于世界中的经验事实往往呈现出偶然性和不可预测性的特征，因而，概念系统无法做到全部统摄而毫无遗漏。在康德看来，坚持一切皆可计算的计算主义范式俨然超出了人类知性能力的范围，可能会陷入形而上学幻象的泥淖。康德的人本学说将人分为知、情、意三部分，即认知能力、情感能力和欲求能力，而情感能力之中包含着人的审美判断力。对美的鉴赏不同于对物的认识，审美自产生伊始就与认知区别开来，正如康德所言，“没有对于美的科学，而只有对于美的批判”。[^(\[37\])](#chapter002.html#m37)美具备一种基于主观而非概念的普遍性，具有无功利的愉快感，在康德看来，“这朵花真美”和“这朵花是美的”不是逻辑判断，只是借用了“客观判断”的形式。这种客观性不是真正的客观性，而是为了普遍传达主观情感，即达到“主观普遍性”的效果，从而实现其社会本性的方式。[^(\[38\])](#chapter002.html#m38)审美是产生意象的认识，而非产生概念的认识，审美的体验往往是一种直觉，它不含有概念，克罗齐写道，“直觉认识不需要主人，也无必要依靠他人……融合在直觉中的概念，鉴于它们被真正地融合，就不再是概念……而变成了直觉的单纯要素”。[^(\[39\])](#chapter002.html#m39)从这种意义上说，人的审美体验独立于理性认识，前者依赖于直觉给予的具体表象，而非抽象的原则和概念，而计算主义主张的计算过程几乎是机械的，它关注的是可以形式化、程序式的逻辑事实，因此，能够以计算方式表现的东西不具有美与丑的两极，只有抽象理智确定的因果关系。人在进行审美体验时无须借助抽象思考和逻辑判断进行理性分析，就能迅即地、不假思索地感知到对象的美丑。[^(\[40\])](#chapter002.html#m40)


    人与其他动物的区别除了抽象思维之外还在于前者可以进行审美，对美的把握亦是人必不可少的活动，也是人本质的一种体现和外化。在我们看来，如果生命的本质是计算，那么面对不涉及抽象原则和概念的审美活动，计算主义几乎没有任何解释效力，因为前者不受算法和规则支配。此外，审美活动与认知活动一样具有意向性，两者都生发于意识，审美活动本身具有某种意义，但形式系统执行的符号计算不能产生意向性和意义，也不能理解意义，更不能理解以无功利和崇高为特征的审美活动。而且从某种角度看，人在审美过程中似乎暂时摆脱了因果律的束缚，切实感受到了自身的“自由”，实现了自身形式的合目的性。我们在第一点论证中已指出计算主义与自由意志是不相容的，会使人陷入因果决定论的窠臼，因此，体现了人的自由意志的审美活动亦与计算主义不相容，也就是说，人的审美活动不可计算。


    从某种意义上说，计算主义的出现与盛行可能与现代技术在当今时代的狂飙与宰制不无关联，后者的核心要求是严格性与精确性，这同计算主义的诉求主张一拍即合，排斥诗性的想象、审美意象以及思维的“不合理”跳跃。计算主义在我们看来类似于一种哲学的技术化，哲学语境中的计算术语被技术性地使用，它以数学的方式将对象描述为一个封闭系统，“以可计算、可掌控的方式将自然物摆置到作为主体的人面前，从而使其研究的每一进程都带有严格性和准确性的特点”。[^(\[41\])](#chapter002.html#m41)在海德格尔的存在论语境中，计算是指“预计到某物，也即考虑到某物，指望某物，也即期待某物。以此方式，一切对现实的对象化都是一种计算，无论这种对象化是以因果说明的方式来追踪原因之结果，还是以形态学的方式阐明对象，还是确保一种序列和秩序联系的基础”。[^(\[42\])](#chapter002.html#m42)他认为，数学和物理学与它们所要维系的对象区域具有精确性的特征，但是一切精神科学，包括哲学在内，恰恰是为了保持自身的严格性而不必然地被精确性所覆盖。从这种意义上说，海德格尔也许会从根本上反对计算主义的观念，“此在”亦不可能凭倚计算获得关于存在的理解，正如我们在前述所言，并非一切皆可计算。


    综上所述，奉行笛卡尔理性主义哲学传统的第一代认知科学将人内在的心智状态抽象化为符号的逻辑表征和计算过程，无论是推崇物理符号系统的认知主义还是主张模拟人类脑神经网络的联结主义，都把计算视为理解人类认知和心智的充要条件，由此生成的认知计算主义甚至宣称一切皆可计算，计算主义俨然成为一种新的世界观。但我们认为，这一主张具有三个缺陷：第一，遵循心物二分原则造成了认知与世界的割裂，从存在论现象学的视角看，在世界中存在是“此在”的基本建构；第二，割裂了认知与身体的联系，因而难以理解人的情感、意志活动且不能正确说明认知的形成与演化，从存在论的角度看，身体与认知作为“此在”在世的一种方式是彼此交织的，无法切割，认知与身体之间的割裂遮蔽了“此在”本真的生存状况；第三，计算对于机器智能而言可能是充分的，但对于人类心智而言则并非如此，人的心智状态除了认知以外，还包括情感体验、意志冲动以及审美活动，计算对于后者而言是不充分的，不构成满足条件，甚至没有任何解释力，也无法实现“此在”对于存在的理解与领会。可以认为人的一些心理状态和过程在某种程度上能够以计算的形式存在，但是这种计算的观点并不能穷尽人类认知和思维的本质。概言之，并非一切皆可计算，计算主义意图成为一种新的世界观依旧困难重重。


    ## 第三节 对“4E+S”认知科学的考察与分析


    近年来，在认知科学领域掀起的对笛卡尔式认知科学的批判浪潮催生了一系列新的认知观，认为前者只注重关于符号的计算表征和信息加工，将人的认知过程等同于大脑的神经过程，把认知局限于颅内并消除了身体和环境对认知施加的影响，因而被人们视为一种无身认知或离身认知理论。由于受该理论指导的人工智能在理论和实践层面均遭遇了严重的困境与挫折，于是人们提出了新的认知科学研究理论来弥补以计算表征为基础的认知主义和联结主义范式的缺陷和不足，主要包括具身认知、延展认知、生成认知、嵌入认知以及情境认知，合称“4E+S”认知理论/模型。一部分认知科学家和哲学家将这种认知理论视作认知科学领域的“哥白尼革命”，认为其可以取代传统认知科学而成为认知科学新的研究纲领和范式，事实果真如此吗？在我们看来，这样的目标依然较为遥远，还有许多亟待回答的问题，比如认知计算主义是否真的如日薄西山般衰落而到了必须被舍弃的境地，“4E+S”模型包含的五条路径是否具有缺陷。我们力图在这一部分进行考察并给出回答，并努力从存在论现象学的角度予以简要分析。


    ### 一 “4E+S”认知的哲学来源


    第二代认知科学的产生具有诸多方面的思想来源，比如认知主义和联结主义、动力学与复杂系统理论以及人工智能，其在哲学上还得益于海德格尔和梅洛-庞蒂现象学、经验自然主义和维特根斯坦后期语言哲学的启发与影响，鉴于篇幅限制，我们在此处仅梳理“4E+S”认知的哲学来源。


    #### （一）“此在”与“身体”现象学


    人们通常将第一代认知科学称为笛卡尔式认知科学，原因之一在于它坚持的是笛卡尔开创的以“我思”为代表的理性主义哲学传统，由此产生了心智与物质、我思与对象之间的对立鸿沟。受其影响，认知主义和联结主义将认知过程紧紧局限在人的大脑之中，结果造成了人的认知与自己身体和世界的割裂，为弥合这一裂痕，人们将目光转向现象学，希望实现由笛卡尔剧场向现象学剧场的转换，现象学方法也被用来批判心智的认知主义和计算主义范式，现象学本身也具有这种可能性，“在世存在”与“身体”概念现今已融入了认知科学的视野，因此，我们首先梳理现象学对第二代认知科学的影响。


    20世纪初兴起的现象学运动包含着多位哲学家的贡献，除了为这一运动奠基的胡塞尔外，还有海德格尔、舍勒以及梅洛-庞蒂。而其中最受认知科学关注的当属海德格尔的存在论现象学与梅洛-庞蒂的身体现象学，他们在胡塞尔的本质现象学和先验现象学的基础上提出了各自的现象学理论，为现象学运动开辟出了不同的道路和发展方向。胡塞尔第一次提出“回归实事本身”，所谓“实事”就是意识活动本身的直接经验的总和，他与笛卡尔一样，都是朝向内在感知去寻求人类认知可能具有的普遍确定性，不同之处在于，胡塞尔通过本质直观分析了意识的本质结构，以悬搁的方法排除了笛卡尔“二元论”的理论预设，这种本质直观是“一种在反思中进行的、对意识本质要素以及这些要素之间的本质联系的直接直观把握”。[^(\[43\])](#chapter002.html#m43)对意识结构的分析使他从布伦塔诺那里接受的“意向性”概念的内涵得以展现，意向性也在被胡塞尔赋予哲学意义后发挥了真正的力量。现如今，意向性已成为使人工智能倍感棘手的难问题，因为胡塞尔将意向性视为意识的基本结构和性质，而人工智能的目标是模拟甚至具有人类心智，意向性成了一道难以跨过的障碍、一条难以逾越的鸿沟，就此而言，意向性的存在从某种意义上也说明认知计算主义是不充分的。另外，胡塞尔对意识所作的现象学分析也为人们解决意识难问题提供了有益的启发。


    为了掌握观念的本质意义、正确性和有效性，胡塞尔利用直观的方法对现象本身进行细致描述，因此体现出现象学的无前提原则，而获得无前提的经验内容与结构的关键就在于中止/悬搁我们的日常经验、偏见甚至科学的知识，不能作任何科学或哲学上的假设。本质还原与先验还原引导我们通向作为自我体验的意识之先验结构，与胡塞尔关注意识先验结构不同的是，海德格尔与梅洛-庞蒂侧重于揭示和强调世界与身体在人的认知活动中发挥的影响和作用。海德格尔要求越过意识理论的主体，回到具体的现实生活中的自我，[^(\[44\])](#chapter002.html#m44)在他看来，“此在”是作为世界之中的存在者而在，“在世存在”是事物（包括人在内）普遍的存在方式，人正是在世界这个整体域内和事物照面、打交道，“此在”和世界的关系不同于钱之于口袋、饼干之于盒子，世界不是全部存在者的总和与堆积，其本身亦非存在者。表面上看，“此在”和世界以时空的方式关联着，但本质上“此在”是生存于世界的意义境遇中。他强烈反对笛卡尔的主—客、心—物的二元论框架，笛卡尔认为人的存在方式在本质上是复合的，是纯粹物质世界中的不同成分（也就是说思想和身体）的范畴综合。[^(\[45\])](#chapter002.html#m45)海德格尔否认“此在”从根本上是以表征方式认识事物，强调人对事物具有一种非反思性的存在论理解，和世界的实践交互先于这种冷静的、基于逻辑规则的表征性的认知活动。


    与海德格尔偏重讨论此在的情境性（整体因缘性）不同，梅洛-庞蒂是从身体出发，从具身性角度切入来展开对笛卡尔心身二元论的批判。他反对笛卡尔将心智看作“具有自思能力的物”，批评笛卡尔主义将意识、身体和世界彻底分离的做法。在他看来，灵魂与身体的结合不是由外在的客体与主体之间随意的决定关系保证的，身体活动本身就是灵魂与身体相结合的表现形式。梅洛-庞蒂将身体看作知觉活动的主体，身体是人之体验的核心要素，并且作为主体当前的和现实的知觉场与世界相接触，将它归于物理世界便无法真正理解人类自身的体验，也就是说，体验活动与人被分割开来了。因此，梅洛-庞蒂眼中的身体具有了牵涉世界的功能，人的身体与世界以一种“预定和谐”的方式紧密地纠缠在一起，我们是作为身体性的存在者被投入世界并成为世界的一部分，而非“作为一空间世界中的简单的空间客体”。[^(\[46\])](#chapter002.html#m46)“身体是在世界上存在的媒介物，拥有一个身体，对一个生物来说就是介入一个确定的环境，参与某个计划和继续置身于其中……我通过我的身体意识到世界。”[^(\[47\])](#chapter002.html#m47)缺少了身体，我们便不能实际地、以上手的方式介入世界。因为身体与我是一体的，它始终贴近我，始终为我而存在，“它留在我的所有知觉的边缘，它和我在一起”。[^(\[48\])](#chapter002.html#m48)梅洛-庞蒂力图将科学的意义奠基于人的身体体验，科学本身是这种体验的间接表达，对世界的体验是我们严肃地思考科学意义的前提。梅洛-庞蒂对身体和具身性的深入探讨、对心智与身体、意识与身体之间的传统二元论的讨论为第二代认知科学理论，尤其是具身认知理论提供了有益的启示，促使人们开始重新关注被笛卡尔式认知科学忽略的身体因素。


    我们看到，以海德格尔和梅洛-庞蒂为代表的现象学是“4E+S”认知模型重要的哲学来源，在现象学的影响下，新的认知科学进路重新将世界（环境）和身体纳入了研究范畴，开始注重认知主体与世界、身体的实践交互。同时，在人工智能领域也引发了研究者（如塞尔、德雷福斯等人）对基于认知主义的经典人工智能的批判。总之，现象学与认知科学的汇聚产生了许多深邃、富有意义的理论成果，为后者提供了有益的思想助力，认知科学的发展需要现象学的参与，它离不开现象学。


    #### （二）杜威的经验自然主义


    加拉格尔将杜威看作情境认知重要的哲学先驱。[^(\[49\])](#chapter002.html#m49)为克服和超越传统哲学中的各种二元对立，杜威提出了经验自然主义，也就是不把经验当作知识或主观对客体的反映，也不把经验当作独立的意识存在，而是当作主体和对象即有机体和环境之间的相互作用，“每一个存在的东西，只要它是被认知的和可知的，它就是在和其他事物的交相作用之中了”。[^(\[50\])](#chapter002.html#m50)即便是自言自语式的内省也不是在孤立的心智中发生的事情，而是与他人交互的结果和反映，不以交互为前提，我们便不可能具有反省的能力。对于杜威而言，情境是一种视界和复杂性条件，它塑造着我们对世界的经验，“‘情境’指的不是某一单个的对象或事件，也不是某一组对象和事件，因为我们从不孤立地经验或形成对事物和事件的判断，我们只在同整体环境的联系中生成自身的经验，后者谓之‘情境’”。[^(\[51\])](#chapter002.html#m51)作为有机体的人在生存中总要遇到某种环境，必须对之作出反应，以更好地适应环境。经验就是人与环境之间的相互作用，它使主体和对象、有机体和环境、经验和自然连成一个不可分割的统一整体，正是经验确立了这些要素间的连续性。此外，杜威还反对“反射弧”主张的机械的刺激—反应关系，他认为，感觉、思维和行动之间密不可分，感官刺激、中枢连接和运动反应当被视作整体中不同的功能因素，而不是各自孤立的、自身存在的实体。在杜威看来，客观的自然本身是可知的，可能使人获得一种“安适、秩序和美丽的感觉”，但笛卡尔的理性主义传统人为地将这个世界分裂了，造成了心智与身体的二元对立，使得我们对世界的认识成为一件神秘的事情。基于自然主义立场，杜威认为世界就是它本身，心身结构都与自然的部分结构相吻合，都是从世界里面发展出来的，而且身体作为心智唯一的活动器官与后者不可分离，心身关系如同树木与土壤的关系一样不可怀疑。[^(\[52\])](#chapter002.html#m52)总之，杜威重视的是有机体与环境间的交互，强调情境与身体在认知活动中的重要作用，强调环境与身体之间的耦合互动。认知首先不是一种心理现象，而是在社会交往基础上展开的实践活动。因而，认知就是一种行为形式，不是心智中的某种思考和世界中的某种行为之间的联系，经验的基本构成就是有机体—环境，而非笛卡尔的“我思”或者康德主义的纯粹自我。杜威的这些观点有力地影响了第二代认知科学，成为后者又一个重要的思想来源，尤其是具身认知和生成认知的某些观点，其都和杜威的主张有着相通之处。


    #### （三）维特根斯坦的“日常生活语言”'
  fmt: '

    第二，人的情绪感觉不可计算，计算对于情感而言是不充分的。人们现在普遍认识到，人的认知活动与情感相互交织，不可分割，概念、判断、演绎、推理等理性思维形式都受到某种情感因素、情绪或动机的影响。在萨伽德看来，推理过程往往就是一种情感过程，人类思维和推理活动的许多方面都受情感积极抑或消极的影响。[^(\[33\])](#chapter002.html#m33)对认知的描述与理解离不开对情感的说明，纯粹理性的认知过程是不存在的。我们认为，基于抽象的逻辑形式规则建立的计算结构或程序不能理解情感，无力对主观性的情绪进行数字化、客观化的解释，因为情感是第一人称的、感受性的体验，某种类型的情绪体验不能被某种计算状态所决定和实现，两者之间并非一一对应的关系。更重要的是，人的情感体验伴随着身体感觉，依据威廉·詹姆斯（William
    James）的情绪理论，情感/情绪是我们在受到外部事实的刺激时对身体变化的感知，不同情感状态之间的转换一定具有某种躯体表现，人们是因为哭泣感到悲伤，因为颤抖感到恐惧，因为报复感到愤怒，而不是相反。詹姆斯认为，没有知觉而起的躯体状态，知觉就只是一种纯粹的、苍白暗淡的、没有情绪激动的认知，没有身体上的变化，情绪所剩的只是一种冷静的、中性的、理智上的感知状态。[^(\[34\])](#chapter002.html#m34)相当多的证据表明，主体处于某种特定情感状态时的感觉包含着他对与这一情绪相关的身体变化与反应的感知，一些身体变化与情感模式之间具有非常密切的相关性，比如，当我们感到恐惧时，若取消掉全部的身体感觉，只保留关于危险的信念判断，那么这样的情绪便很难称为恐惧了。


    在我们看来，主张情感体验可以计算蕴含着对情感的抽象化理解，然而，这种抽象理解的前提在于一种强认知主义立场，即情感就是认知评价和判断，而判断和评价能够被抽象化、形式化为承载语义的符号信息。从这种意义上说，强认知主义视域下的情感可以进行计算，而且国外已有学者作了相关研究，保罗·萨伽德以环境、身体和心理状态作为变量建立了以数学演绎或工具模拟为特征的关于情感的动态系统，通过计算机模拟该系统的运行状况解释情感现象。[^(\[35\])](#chapter002.html#m35)但是剥离了身体感觉的情感毕竟是不完整的，它缺失了主观维度的感受性体验，但这正是情感和理性认知之间的一个有效区分。认知本身无法产生一个情绪状态，[^(\[36\])](#chapter002.html#m36)抽象化、程式化的符号计算亦无法生成情绪。此外，对情感的纯形式化描述也未必可以实现对情感的精确预测和解释，情感是多变的，主体有能力在各种情绪状态之间自由切换，可以人为控制自身的情绪，故常有喜怒不形于色的说法。因此，我们认为情感和意志活动相类似，亦不遵循规则，不能纳入基于算法规则的计算主义解释框架。概言之，人的情感或情绪不可计算。


    第三，人的审美认识和体验不可计算。在康德眼中，人类认识的知性能力要求建立一个可以统摄一切经验对象的完整系统，这与计算主义致力实现的目标不谋而合。但由于世界中的经验事实往往呈现出偶然性和不可预测性的特征，因而，概念系统无法做到全部统摄而毫无遗漏。在康德看来，坚持一切皆可计算的计算主义范式俨然超出了人类知性能力的范围，可能会陷入形而上学幻象的泥淖。康德的人本学说将人分为知、情、意三部分，即认知能力、情感能力和欲求能力，而情感能力之中包含着人的审美判断力。对美的鉴赏不同于对物的认识，审美自产生伊始就与认知区别开来，正如康德所言，“没有对于美的科学，而只有对于美的批判”。[^(\[37\])](#chapter002.html#m37)美具备一种基于主观而非概念的普遍性，具有无功利的愉快感，在康德看来，“这朵花真美”和“这朵花是美的”不是逻辑判断，只是借用了“客观判断”的形式。这种客观性不是真正的客观性，而是为了普遍传达主观情感，即达到“主观普遍性”的效果，从而实现其社会本性的方式。[^(\[38\])](#chapter002.html#m38)审美是产生意象的认识，而非产生概念的认识，审美的体验往往是一种直觉，它不含有概念，克罗齐写道，“直觉认识不需要主人，也无必要依靠他人……融合在直觉中的概念，鉴于它们被真正地融合，就不再是概念……而变成了直觉的单纯要素”。[^(\[39\])](#chapter002.html#m39)从这种意义上说，人的审美体验独立于理性认识，前者依赖于直觉给予的具体表象，而非抽象的原则和概念，而计算主义主张的计算过程几乎是机械的，它关注的是可以形式化、程序式的逻辑事实，因此，能够以计算方式表现的东西不具有美与丑的两极，只有抽象理智确定的因果关系。人在进行审美体验时无须借助抽象思考和逻辑判断进行理性分析，就能迅即地、不假思索地感知到对象的美丑。[^(\[40\])](#chapter002.html#m40)


    人与其他动物的区别除了抽象思维之外还在于前者可以进行审美，对美的把握亦是人必不可少的活动，也是人本质的一种体现和外化。在我们看来，如果生命的本质是计算，那么面对不涉及抽象原则和概念的审美活动，计算主义几乎没有任何解释效力，因为前者不受算法和规则支配。此外，审美活动与认知活动一样具有意向性，两者都生发于意识，审美活动本身具有某种意义，但形式系统执行的符号计算不能产生意向性和意义，也不能理解意义，更不能理解以无功利和崇高为特征的审美活动。而且从某种角度看，人在审美过程中似乎暂时摆脱了因果律的束缚，切实感受到了自身的“自由”，实现了自身形式的合目的性。我们在第一点论证中已指出计算主义与自由意志是不相容的，会使人陷入因果决定论的窠臼，因此，体现了人的自由意志的审美活动亦与计算主义不相容，也就是说，人的审美活动不可计算。


    从某种意义上说，计算主义的出现与盛行可能与现代技术在当今时代的狂飙与宰制不无关联，后者的核心要求是严格性与精确性，这同计算主义的诉求主张一拍即合，排斥诗性的想象、审美意象以及思维的“不合理”跳跃。计算主义在我们看来类似于一种哲学的技术化，哲学语境中的计算术语被技术性地使用，它以数学的方式将对象描述为一个封闭系统，“以可计算、可掌控的方式将自然物摆置到作为主体的人面前，从而使其研究的每一进程都带有严格性和准确性的特点”。[^(\[41\])](#chapter002.html#m41)在海德格尔的存在论语境中，计算是指“预计到某物，也即考虑到某物，指望某物，也即期待某物。以此方式，一切对现实的对象化都是一种计算，无论这种对象化是以因果说明的方式来追踪原因之结果，还是以形态学的方式阐明对象，还是确保一种序列和秩序联系的基础”。[^(\[42\])](#chapter002.html#m42)他认为，数学和物理学与它们所要维系的对象区域具有精确性的特征，但是一切精神科学，包括哲学在内，恰恰是为了保持自身的严格性而不必然地被精确性所覆盖。从这种意义上说，海德格尔也许会从根本上反对计算主义的观念，“此在”亦不可能凭倚计算获得关于存在的理解，正如我们在前述所言，并非一切皆可计算。


    综上所述，奉行笛卡尔理性主义哲学传统的第一代认知科学将人内在的心智状态抽象化为符号的逻辑表征和计算过程，无论是推崇物理符号系统的认知主义还是主张模拟人类脑神经网络的联结主义，都把计算视为理解人类认知和心智的充要条件，由此生成的认知计算主义甚至宣称一切皆可计算，计算主义俨然成为一种新的世界观。但我们认为，这一主张具有三个缺陷：第一，遵循心物二分原则造成了认知与世界的割裂，从存在论现象学的视角看，在世界中存在是“此在”的基本建构；第二，割裂了认知与身体的联系，因而难以理解人的情感、意志活动且不能正确说明认知的形成与演化，从存在论的角度看，身体与认知作为“此在”在世的一种方式是彼此交织的，无法切割，认知与身体之间的割裂遮蔽了“此在”本真的生存状况；第三，计算对于机器智能而言可能是充分的，但对于人类心智而言则并非如此，人的心智状态除了认知以外，还包括情感体验、意志冲动以及审美活动，计算对于后者而言是不充分的，不构成满足条件，甚至没有任何解释力，也无法实现“此在”对于存在的理解与领会。可以认为人的一些心理状态和过程在某种程度上能够以计算的形式存在，但是这种计算的观点并不能穷尽人类认知和思维的本质。概言之，并非一切皆可计算，计算主义意图成为一种新的世界观依旧困难重重。


    ## 第三节 对“4E+S”认知科学的考察与分析


    近年来，在认知科学领域掀起的对笛卡尔式认知科学的批判浪潮催生了一系列新的认知观，认为前者只注重关于符号的计算表征和信息加工，将人的认知过程等同于大脑的神经过程，把认知局限于颅内并消除了身体和环境对认知施加的影响，因而被人们视为一种无身认知或离身认知理论。由于受该理论指导的人工智能在理论和实践层面均遭遇了严重的困境与挫折，于是人们提出了新的认知科学研究理论来弥补以计算表征为基础的认知主义和联结主义范式的缺陷和不足，主要包括具身认知、延展认知、生成认知、嵌入认知以及情境认知，合称“4E+S”认知理论/模型。一部分认知科学家和哲学家将这种认知理论视作认知科学领域的“哥白尼革命”，认为其可以取代传统认知科学而成为认知科学新的研究纲领和范式，事实果真如此吗？在我们看来，这样的目标依然较为遥远，还有许多亟待回答的问题，比如认知计算主义是否真的如日薄西山般衰落而到了必须被舍弃的境地，“4E+S”模型包含的五条路径是否具有缺陷。我们力图在这一部分进行考察并给出回答，并努力从存在论现象学的角度予以简要分析。


    ### 一 “4E+S”认知的哲学来源


    第二代认知科学的产生具有诸多方面的思想来源，比如认知主义和联结主义、动力学与复杂系统理论以及人工智能，其在哲学上还得益于海德格尔和梅洛-庞蒂现象学、经验自然主义和维特根斯坦后期语言哲学的启发与影响，鉴于篇幅限制，我们在此处仅梳理“4E+S”认知的哲学来源。


    #### （一）“此在”与“身体”现象学


    人们通常将第一代认知科学称为笛卡尔式认知科学，原因之一在于它坚持的是笛卡尔开创的以“我思”为代表的理性主义哲学传统，由此产生了心智与物质、我思与对象之间的对立鸿沟。受其影响，认知主义和联结主义将认知过程紧紧局限在人的大脑之中，结果造成了人的认知与自己身体和世界的割裂，为弥合这一裂痕，人们将目光转向现象学，希望实现由笛卡尔剧场向现象学剧场的转换，现象学方法也被用来批判心智的认知主义和计算主义范式，现象学本身也具有这种可能性，“在世存在”与“身体”概念现今已融入了认知科学的视野，因此，我们首先梳理现象学对第二代认知科学的影响。


    20世纪初兴起的现象学运动包含着多位哲学家的贡献，除了为这一运动奠基的胡塞尔外，还有海德格尔、舍勒以及梅洛-庞蒂。而其中最受认知科学关注的当属海德格尔的存在论现象学与梅洛-庞蒂的身体现象学，他们在胡塞尔的本质现象学和先验现象学的基础上提出了各自的现象学理论，为现象学运动开辟出了不同的道路和发展方向。胡塞尔第一次提出“回归实事本身”，所谓“实事”就是意识活动本身的直接经验的总和，他与笛卡尔一样，都是朝向内在感知去寻求人类认知可能具有的普遍确定性，不同之处在于，胡塞尔通过本质直观分析了意识的本质结构，以悬搁的方法排除了笛卡尔“二元论”的理论预设，这种本质直观是“一种在反思中进行的、对意识本质要素以及这些要素之间的本质联系的直接直观把握”。[^(\[43\])](#chapter002.html#m43)对意识结构的分析使他从布伦塔诺那里接受的“意向性”概念的内涵得以展现，意向性也在被胡塞尔赋予哲学意义后发挥了真正的力量。现如今，意向性已成为使人工智能倍感棘手的难问题，因为胡塞尔将意向性视为意识的基本结构和性质，而人工智能的目标是模拟甚至具有人类心智，意向性成了一道难以跨过的障碍、一条难以逾越的鸿沟，就此而言，意向性的存在从某种意义上也说明认知计算主义是不充分的。另外，胡塞尔对意识所作的现象学分析也为人们解决意识难问题提供了有益的启发。


    为了掌握观念的本质意义、正确性和有效性，胡塞尔利用直观的方法对现象本身进行细致描述，因此体现出现象学的无前提原则，而获得无前提的经验内容与结构的关键就在于中止/悬搁我们的日常经验、偏见甚至科学的知识，不能作任何科学或哲学上的假设。本质还原与先验还原引导我们通向作为自我体验的意识之先验结构，与胡塞尔关注意识先验结构不同的是，海德格尔与梅洛-庞蒂侧重于揭示和强调世界与身体在人的认知活动中发挥的影响和作用。海德格尔要求越过意识理论的主体，回到具体的现实生活中的自我，[^(\[44\])](#chapter002.html#m44)在他看来，“此在”是作为世界之中的存在者而在，“在世存在”是事物（包括人在内）普遍的存在方式，人正是在世界这个整体域内和事物照面、打交道，“此在”和世界的关系不同于钱之于口袋、饼干之于盒子，世界不是全部存在者的总和与堆积，其本身亦非存在者。表面上看，“此在”和世界以时空的方式关联着，但本质上“此在”是生存于世界的意义境遇中。他强烈反对笛卡尔的主—客、心—物的二元论框架，笛卡尔认为人的存在方式在本质上是复合的，是纯粹物质世界中的不同成分（也就是说思想和身体）的范畴综合。[^(\[45\])](#chapter002.html#m45)海德格尔否认“此在”从根本上是以表征方式认识事物，强调人对事物具有一种非反思性的存在论理解，和世界的实践交互先于这种冷静的、基于逻辑规则的表征性的认知活动。


    与海德格尔偏重讨论此在的情境性（整体因缘性）不同，梅洛-庞蒂是从身体出发，从具身性角度切入来展开对笛卡尔心身二元论的批判。他反对笛卡尔将心智看作“具有自思能力的物”，批评笛卡尔主义将意识、身体和世界彻底分离的做法。在他看来，灵魂与身体的结合不是由外在的客体与主体之间随意的决定关系保证的，身体活动本身就是灵魂与身体相结合的表现形式。梅洛-庞蒂将身体看作知觉活动的主体，身体是人之体验的核心要素，并且作为主体当前的和现实的知觉场与世界相接触，将它归于物理世界便无法真正理解人类自身的体验，也就是说，体验活动与人被分割开来了。因此，梅洛-庞蒂眼中的身体具有了牵涉世界的功能，人的身体与世界以一种“预定和谐”的方式紧密地纠缠在一起，我们是作为身体性的存在者被投入世界并成为世界的一部分，而非“作为一空间世界中的简单的空间客体”。[^(\[46\])](#chapter002.html#m46)“身体是在世界上存在的媒介物，拥有一个身体，对一个生物来说就是介入一个确定的环境，参与某个计划和继续置身于其中……我通过我的身体意识到世界。”[^(\[47\])](#chapter002.html#m47)缺少了身体，我们便不能实际地、以上手的方式介入世界。因为身体与我是一体的，它始终贴近我，始终为我而存在，“它留在我的所有知觉的边缘，它和我在一起”。[^(\[48\])](#chapter002.html#m48)梅洛-庞蒂力图将科学的意义奠基于人的身体体验，科学本身是这种体验的间接表达，对世界的体验是我们严肃地思考科学意义的前提。梅洛-庞蒂对身体和具身性的深入探讨、对心智与身体、意识与身体之间的传统二元论的讨论为第二代认知科学理论，尤其是具身认知理论提供了有益的启示，促使人们开始重新关注被笛卡尔式认知科学忽略的身体因素。


    我们看到，以海德格尔和梅洛-庞蒂为代表的现象学是“4E+S”认知模型重要的哲学来源，在现象学的影响下，新的认知科学进路重新将世界（环境）和身体纳入了研究范畴，开始注重认知主体与世界、身体的实践交互。同时，在人工智能领域也引发了研究者（如塞尔、德雷福斯等人）对基于认知主义的经典人工智能的批判。总之，现象学与认知科学的汇聚产生了许多深邃、富有意义的理论成果，为后者提供了有益的思想助力，认知科学的发展需要现象学的参与，它离不开现象学。


    #### （二）杜威的经验自然主义


    加拉格尔将杜威看作情境认知重要的哲学先驱。[^(\[49\])](#chapter002.html#m49)为克服和超越传统哲学中的各种二元对立，杜威提出了经验自然主义，也就是不把经验当作知识或主观对客体的反映，也不把经验当作独立的意识存在，而是当作主体和对象即有机体和环境之间的相互作用，“每一个存在的东西，只要它是被认知的和可知的，它就是在和其他事物的交相作用之中了”。[^(\[50\])](#chapter002.html#m50)即便是自言自语式的内省也不是在孤立的心智中发生的事情，而是与他人交互的结果和反映，不以交互为前提，我们便不可能具有反省的能力。对于杜威而言，情境是一种视界和复杂性条件，它塑造着我们对世界的经验，“‘情境’指的不是某一单个的对象或事件，也不是某一组对象和事件，因为我们从不孤立地经验或形成对事物和事件的判断，我们只在同整体环境的联系中生成自身的经验，后者谓之‘情境’”。[^(\[51\])](#chapter002.html#m51)作为有机体的人在生存中总要遇到某种环境，必须对之作出反应，以更好地适应环境。经验就是人与环境之间的相互作用，它使主体和对象、有机体和环境、经验和自然连成一个不可分割的统一整体，正是经验确立了这些要素间的连续性。此外，杜威还反对“反射弧”主张的机械的刺激—反应关系，他认为，感觉、思维和行动之间密不可分，感官刺激、中枢连接和运动反应当被视作整体中不同的功能因素，而不是各自孤立的、自身存在的实体。在杜威看来，客观的自然本身是可知的，可能使人获得一种“安适、秩序和美丽的感觉”，但笛卡尔的理性主义传统人为地将这个世界分裂了，造成了心智与身体的二元对立，使得我们对世界的认识成为一件神秘的事情。基于自然主义立场，杜威认为世界就是它本身，心身结构都与自然的部分结构相吻合，都是从世界里面发展出来的，而且身体作为心智唯一的活动器官与后者不可分离，心身关系如同树木与土壤的关系一样不可怀疑。[^(\[52\])](#chapter002.html#m52)总之，杜威重视的是有机体与环境间的交互，强调情境与身体在认知活动中的重要作用，强调环境与身体之间的耦合互动。认知首先不是一种心理现象，而是在社会交往基础上展开的实践活动。因而，认知就是一种行为形式，不是心智中的某种思考和世界中的某种行为之间的联系，经验的基本构成就是有机体—环境，而非笛卡尔的“我思”或者康德主义的纯粹自我。杜威的这些观点有力地影响了第二代认知科学，成为后者又一个重要的思想来源，尤其是具身认知和生成认知的某些观点，其都和杜威的主张有着相通之处。


    #### （三）维特根斯坦的“日常生活语言”

    '
  trans: '


    第二，人的情绪感觉不可计算，计算对于情感而言是不充分的。人们现在普遍认识到，人的认知活动与情感相互交织，不可分割，概念、判断、演绎、推理等理性思维形式都受到某种情感因素、情绪或动机的影响。在萨伽德看来，推理过程往往就是一种情感过程，人类思维和推理活动的许多方面都受情感积极抑或消极的影响。[^(\[33\])](#chapter002.html#m33)对认知的描述与理解离不开对情感的说明，纯粹理性的认知过程是不存在的。我们认为，基于抽象的逻辑形式规则建立的计算结构或程序不能理解情感，无力对主观性的情绪进行数字化、客观化的解释，因为情感是第一人称的、感受性的体验，某种类型的情绪体验不能被某种计算状态所决定和实现，两者之间并非一一对应的关系。更重要的是，人的情感体验伴随着身体感觉，依据威廉·詹姆斯（William
    James）的情绪理论，情感/情绪是我们在受到外部事实的刺激时对身体变化的感知，不同情感状态之间的转换一定具有某种躯体表现，人们是因为哭泣感到悲伤，因为颤抖感到恐惧，因为报复感到愤怒，而不是相反。詹姆斯认为，没有知觉而起的躯体状态，知觉就只是一种纯粹的、苍白暗淡的、没有情绪激动的认知，没有身体上的变化，情绪所剩的只是一种冷静的、中性的、理智上的感知状态。[^(\[34\])](#chapter002.html#m34)相当多的证据表明，主体处于某种特定情感状态时的感觉包含着他对与这一情绪相关的身体变化与反应的感知，一些身体变化与情感模式之间具有非常密切的相关性，比如，当我们感到恐惧时，若取消掉全部的身体感觉，只保留关于危险的信念判断，那么这样的情绪便很难称为恐惧了。


    在我们看来，主张情感体验可以计算蕴含着对情感的抽象化理解，然而，这种抽象理解的前提在于一种强认知主义立场，即情感就是认知评价和判断，而判断和评价能够被抽象化、形式化为承载语义的符号信息。从这种意义上说，强认知主义视域下的情感可以进行计算，而且国外已有学者作了相关研究，保罗·萨伽德以环境、身体和心理状态作为变量建立了以数学演绎或工具模拟为特征的关于情感的动态系统，通过计算机模拟该系统的运行状况解释情感现象。[^(\[35\])](#chapter002.html#m35)但是剥离了身体感觉的情感毕竟是不完整的，它缺失了主观维度的感受性体验，但这正是情感和理性认知之间的一个有效区分。认知本身无法产生一个情绪状态，[^(\[36\])](#chapter002.html#m36)抽象化、程式化的符号计算亦无法生成情绪。此外，对情感的纯形式化描述也未必可以实现对情感的精确预测和解释，情感是多变的，主体有能力在各种情绪状态之间自由切换，可以人为控制自身的情绪，故常有喜怒不形于色的说法。因此，我们认为情感和意志活动相类似，亦不遵循规则，不能纳入基于算法规则的计算主义解释框架。概言之，人的情感或情绪不可计算。


    第三，人的审美认识和体验不可计算。在康德眼中，人类认识的知性能力要求建立一个可以统摄一切经验对象的完整系统，这与计算主义致力实现的目标不谋而合。但由于世界中的经验事实往往呈现出偶然性和不可预测性的特征，因而，概念系统无法做到全部统摄而毫无遗漏。在康德看来，坚持一切皆可计算的计算主义范式俨然超出了人类知性能力的范围，可能会陷入形而上学幻象的泥淖。康德的人本学说将人分为知、情、意三部分，即认知能力、情感能力和欲求能力，而情感能力之中包含着人的审美判断力。对美的鉴赏不同于对物的认识，审美自产生伊始就与认知区别开来，正如康德所言，“没有对于美的科学，而只有对于美的批判”。[^(\[37\])](#chapter002.html#m37)美具备一种基于主观而非概念的普遍性，具有无功利的愉快感，在康德看来，“这朵花真美”和“这朵花是美的”不是逻辑判断，只是借用了“客观判断”的形式。这种客观性不是真正的客观性，而是为了普遍传达主观情感，即达到“主观普遍性”的效果，从而实现其社会本性的方式。[^(\[38\])](#chapter002.html#m38)审美是产生意象的认识，而非产生概念的认识，审美的体验往往是一种直觉，它不含有概念，克罗齐写道，“直觉认识不需要主人，也无必要依靠他人……融合在直觉中的概念，鉴于它们被真正地融合，就不再是概念……而变成了直觉的单纯要素”。[^(\[39\])](#chapter002.html#m39)从这种意义上说，人的审美体验独立于理性认识，前者依赖于直觉给予的具体表象，而非抽象的原则和概念，而计算主义主张的计算过程几乎是机械的，它关注的是可以形式化、程序式的逻辑事实，因此，能够以计算方式表现的东西不具有美与丑的两极，只有抽象理智确定的因果关系。人在进行审美体验时无须借助抽象思考和逻辑判断进行理性分析，就能迅即地、不假思索地感知到对象的美丑。[^(\[40\])](#chapter002.html#m40)


    人与其他动物的区别除了抽象思维之外还在于前者可以进行审美，对美的把握亦是人必不可少的活动，也是人本质的一种体现和外化。在我们看来，如果生命的本质是计算，那么面对不涉及抽象原则和概念的审美活动，计算主义几乎没有任何解释效力，因为前者不受算法和规则支配。此外，审美活动与认知活动一样具有意向性，两者都生发于意识，审美活动本身具有某种意义，但形式系统执行的符号计算不能产生意向性和意义，也不能理解意义，更不能理解以无功利和崇高为特征的审美活动。而且从某种角度看，人在审美过程中似乎暂时摆脱了因果律的束缚，切实感受到了自身的“自由”，实现了自身形式的合目的性。我们在第一点论证中已指出计算主义与自由意志是不相容的，会使人陷入因果决定论的窠臼，因此，体现了人的自由意志的审美活动亦与计算主义不相容，也就是说，人的审美活动不可计算。


    从某种意义上说，计算主义的出现与盛行可能与现代技术在当今时代的狂飙与宰制不无关联，后者的核心要求是严格性与精确性，这同计算主义的诉求主张一拍即合，排斥诗性的想象、审美意象以及思维的“不合理”跳跃。计算主义在我们看来类似于一种哲学的技术化，哲学语境中的计算术语被技术性地使用，它以数学的方式将对象描述为一个封闭系统，“以可计算、可掌控的方式将自然物摆置到作为主体的人面前，从而使其研究的每一进程都带有严格性和准确性的特点”。[^(\[41\])](#chapter002.html#m41)在海德格尔的存在论语境中，计算是指“预计到某物，也即考虑到某物，指望某物，也即期待某物。以此方式，一切对现实的对象化都是一种计算，无论这种对象化是以因果说明的方式来追踪原因之结果，还是以形态学的方式阐明对象，还是确保一种序列和秩序联系的基础”。[^(\[42\])](#chapter002.html#m42)他认为，数学和物理学与它们所要维系的对象区域具有精确性的特征，但是一切精神科学，包括哲学在内，恰恰是为了保持自身的严格性而不必然地被精确性所覆盖。从这种意义上说，海德格尔也许会从根本上反对计算主义的观念，“此在”亦不可能凭倚计算获得关于存在的理解，正如我们在前述所言，并非一切皆可计算。


    综上所述，奉行笛卡尔理性主义哲学传统的第一代认知科学将人内在的心智状态抽象化为符号的逻辑表征和计算过程，无论是推崇物理符号系统的认知主义还是主张模拟人类脑神经网络的联结主义，都把计算视为理解人类认知和心智的充要条件，由此生成的认知计算主义甚至宣称一切皆可计算，计算主义俨然成为一种新的世界观。但我们认为，这一主张具有三个缺陷：第一，遵循心物二分原则造成了认知与世界的割裂，从存在论现象学的视角看，在世界中存在是“此在”的基本建构；第二，割裂了认知与身体的联系，因而难以理解人的情感、意志活动且不能正确说明认知的形成与演化，从存在论的角度看，身体与认知作为“此在”在世的一种方式是彼此交织的，无法切割，认知与身体之间的割裂遮蔽了“此在”本真的生存状况；第三，计算对于机器智能而言可能是充分的，但对于人类心智而言则并非如此，人的心智状态除了认知以外，还包括情感体验、意志冲动以及审美活动，计算对于后者而言是不充分的，不构成满足条件，甚至没有任何解释力，也无法实现“此在”对于存在的理解与领会。可以认为人的一些心理状态和过程在某种程度上能够以计算的形式存在，但是这种计算的观点并不能穷尽人类认知和思维的本质。概言之，并非一切皆可计算，计算主义意图成为一种新的世界观依旧困难重重。


    ## 第三节 对“4E+S”认知科学的考察与分析


    近年来，在认知科学领域掀起的对笛卡尔式认知科学的批判浪潮催生了一系列新的认知观，认为前者只注重关于符号的计算表征和信息加工，将人的认知过程等同于大脑的神经过程，把认知局限于颅内并消除了身体和环境对认知施加的影响，因而被人们视为一种无身认知或离身认知理论。由于受该理论指导的人工智能在理论和实践层面均遭遇了严重的困境与挫折，于是人们提出了新的认知科学研究理论来弥补以计算表征为基础的认知主义和联结主义范式的缺陷和不足，主要包括具身认知、延展认知、生成认知、嵌入认知以及情境认知，合称“4E+S”认知理论/模型。一部分认知科学家和哲学家将这种认知理论视作认知科学领域的“哥白尼革命”，认为其可以取代传统认知科学而成为认知科学新的研究纲领和范式，事实果真如此吗？在我们看来，这样的目标依然较为遥远，还有许多亟待回答的问题，比如认知计算主义是否真的如日薄西山般衰落而到了必须被舍弃的境地，“4E+S”模型包含的五条路径是否具有缺陷。我们力图在这一部分进行考察并给出回答，并努力从存在论现象学的角度予以简要分析。


    ### 一 “4E+S”认知的哲学来源


    第二代认知科学的产生具有诸多方面的思想来源，比如认知主义和联结主义、动力学与复杂系统理论以及人工智能，其在哲学上还得益于海德格尔和梅洛-庞蒂现象学、经验自然主义和维特根斯坦后期语言哲学的启发与影响，鉴于篇幅限制，我们在此处仅梳理“4E+S”认知的哲学来源。


    #### （一）“此在”与“身体”现象学


    人们通常将第一代认知科学称为笛卡尔式认知科学，原因之一在于它坚持的是笛卡尔开创的以“我思”为代表的理性主义哲学传统，由此产生了心智与物质、我思与对象之间的对立鸿沟。受其影响，认知主义和联结主义将认知过程紧紧局限在人的大脑之中，结果造成了人的认知与自己身体和世界的割裂，为弥合这一裂痕，人们将目光转向现象学，希望实现由笛卡尔剧场向现象学剧场的转换，现象学方法也被用来批判心智的认知主义和计算主义范式，现象学本身也具有这种可能性，“在世存在”与“身体”概念现今已融入了认知科学的视野，因此，我们首先梳理现象学对第二代认知科学的影响。


    20 世纪初兴起的现象学运动包含着多位哲学家的贡献，除了为这一运动奠基的胡塞尔外，还有海德格尔、舍勒以及梅洛-庞蒂。而其中最受认知科学关注的当属海德格尔的存在论现象学与梅洛-庞蒂的身体现象学，他们在胡塞尔的本质现象学和先验现象学的基础上提出了各自的现象学理论，为现象学运动开辟出了不同的道路和发展方向。胡塞尔第一次提出“回归实事本身”，所谓“实事”就是意识活动本身的直接经验的总和，他与笛卡尔一样，都是朝向内在感知去寻求人类认知可能具有的普遍确定性，不同之处在于，胡塞尔通过本质直观分析了意识的本质结构，以悬搁的方法排除了笛卡尔“二元论”的理论预设，这种本质直观是“一种在反思中进行的、对意识本质要素以及这些要素之间的本质联系的直接直观把握”。[^(\[43\])](#chapter002.html#m43)对意识结构的分析使他从布伦塔诺那里接受的“意向性”概念的内涵得以展现，意向性也在被胡塞尔赋予哲学意义后发挥了真正的力量。现如今，意向性已成为使人工智能倍感棘手的难问题，因为胡塞尔将意向性视为意识的基本结构和性质，而人工智能的目标是模拟甚至具有人类心智，意向性成了一道难以跨过的障碍、一条难以逾越的鸿沟，就此而言，意向性的存在从某种意义上也说明认知计算主义是不充分的。另外，胡塞尔对意识所作的现象学分析也为人们解决意识难问题提供了有益的启发。


    为了掌握观念的本质意义、正确性和有效性，胡塞尔利用直观的方法对现象本身进行细致描述，因此体现出现象学的无前提原则，而获得无前提的经验内容与结构的关键就在于中止/悬搁我们的日常经验、偏见甚至科学的知识，不能作任何科学或哲学上的假设。本质还原与先验还原引导我们通向作为自我体验的意识之先验结构，与胡塞尔关注意识先验结构不同的是，海德格尔与梅洛-庞蒂侧重于揭示和强调世界与身体在人的认知活动中发挥的影响和作用。海德格尔要求越过意识理论的主体，回到具体的现实生活中的自我，[^(\[44\])](#chapter002.html#m44)在他看来，“此在”是作为世界之中的存在者而在，“在世存在”是事物（包括人在内）普遍的存在方式，人正是在世界这个整体域内和事物照面、打交道，“此在”和世界的关系不同于钱之于口袋、饼干之于盒子，世界不是全部存在者的总和与堆积，其本身亦非存在者。表面上看，“此在”和世界以时空的方式关联着，但本质上“此在”是生存于世界的意义境遇中。他强烈反对笛卡尔的主—客、心—物的二元论框架，笛卡尔认为人的存在方式在本质上是复合的，是纯粹物质世界中的不同成分（也就是说思想和身体）的范畴综合。[^(\[45\])](#chapter002.html#m45)海德格尔否认“此在”从根本上是以表征方式认识事物，强调人对事物具有一种非反思性的存在论理解，和世界的实践交互先于这种冷静的、基于逻辑规则的表征性的认知活动。


    与海德格尔偏重讨论此在的情境性（整体因缘性）不同，梅洛-庞蒂是从身体出发，从具身性角度切入来展开对笛卡尔心身二元论的批判。他反对笛卡尔将心智看作“具有自思能力的物”，批评笛卡尔主义将意识、身体和世界彻底分离的做法。在他看来，灵魂与身体的结合不是由外在的客体与主体之间随意的决定关系保证的，身体活动本身就是灵魂与身体相结合的表现形式。梅洛-庞蒂将身体看作知觉活动的主体，身体是人之体验的核心要素，并且作为主体当前的和现实的知觉场与世界相接触，将它归于物理世界便无法真正理解人类自身的体验，也就是说，体验活动与人被分割开来了。因此，梅洛-庞蒂眼中的身体具有了牵涉世界的功能，人的身体与世界以一种“预定和谐”的方式紧密地纠缠在一起，我们是作为身体性的存在者被投入世界并成为世界的一部分，而非“作为一空间世界中的简单的空间客体”。[^(\[46\])](#chapter002.html#m46)“身体是在世界上存在的媒介物，拥有一个身体，对一个生物来说就是介入一个确定的环境，参与某个计划和继续置身于其中……我通过我的身体意识到世界。”[^(\[47\])](#chapter002.html#m47)缺少了身体，我们便不能实际地、以上手的方式介入世界。因为身体与我是一体的，它始终贴近我，始终为我而存在，“它留在我的所有知觉的边缘，它和我在一起”。[^(\[48\])](#chapter002.html#m48)梅洛-庞蒂力图将科学的意义奠基于人的身体体验，科学本身是这种体验的间接表达，对世界的体验是我们严肃地思考科学意义的前提。梅洛-庞蒂对身体和具身性的深入探讨、对心智与身体、意识与身体之间的传统二元论的讨论为第二代认知科学理论，尤其是具身认知理论提供了有益的启示，促使人们开始重新关注被笛卡尔式认知科学忽略的身体因素。


    我们看到，以海德格尔和梅洛-庞蒂为代表的现象学是“4E+S”认知模型重要的哲学来源，在现象学的影响下，新的认知科学进路重新将世界（环境）和身体纳入了研究范畴，开始注重认知主体与世界、身体的实践交互。同时，在人工智能领域也引发了研究者（如塞尔、德雷福斯等人）对基于认知主义的经典人工智能的批判。总之，现象学与认知科学的汇聚产生了许多深邃、富有意义的理论成果，为后者提供了有益的思想助力，认知科学的发展需要现象学的参与，它离不开现象学。


    #### （二）杜威的经验自然主义


    加拉格尔将杜威看作情境认知重要的哲学先驱。[^(\[49\])](#chapter002.html#m49)为克服和超越传统哲学中的各种二元对立，杜威提出了经验自然主义，也就是不把经验当作知识或主观对客体的反映，也不把经验当作独立的意识存在，而是当作主体和对象即有机体和环境之间的相互作用，“每一个存在的东西，只要它是被认知的和可知的，它就是在和其他事物的交相作用之中了”。[^(\[50\])](#chapter002.html#m50)即便是自言自语式的内省也不是在孤立的心智中发生的事情，而是与他人交互的结果和反映，不以交互为前提，我们便不可能具有反省的能力。对于杜威而言，情境是一种视界和复杂性条件，它塑造着我们对世界的经验，“‘情境’指的不是某一单个的对象或事件，也不是某一组对象和事件，因为我们从不孤立地经验或形成对事物和事件的判断，我们只在同整体环境的联系中生成自身的经验，后者谓之‘情境’”。[^(\[51\])](#chapter002.html#m51)作为有机体的人在生存中总要遇到某种环境，必须对之作出反应，以更好地适应环境。经验就是人与环境之间的相互作用，它使主体和对象、有机体和环境、经验和自然连成一个不可分割的统一整体，正是经验确立了这些要素间的连续性。此外，杜威还反对“反射弧”主张的机械的刺激—反应关系，他认为，感觉、思维和行动之间密不可分，感官刺激、中枢连接和运动反应当被视作整体中不同的功能因素，而不是各自孤立的、自身存在的实体。在杜威看来，客观的自然本身是可知的，可能使人获得一种“安适、秩序和美丽的感觉”，但笛卡尔的理性主义传统人为地将这个世界分裂了，造成了心智与身体的二元对立，使得我们对世界的认识成为一件神秘的事情。基于自然主义立场，杜威认为世界就是它本身，心身结构都与自然的部分结构相吻合，都是从世界里面发展出来的，而且身体作为心智唯一的活动器官与后者不可分离，心身关系如同树木与土壤的关系一样不可怀疑。[^(\[52\])](#chapter002.html#m52)总之，杜威重视的是有机体与环境间的交互，强调情境与身体在认知活动中的重要作用，强调环境与身体之间的耦合互动。认知首先不是一种心理现象，而是在社会交往基础上展开的实践活动。因而，认知就是一种行为形式，不是心智中的某种思考和世界中的某种行为之间的联系，经验的基本构成就是有机体—环境，而非笛卡尔的“我思”或者康德主义的纯粹自我。杜威的这些观点有力地影响了第二代认知科学，成为后者又一个重要的思想来源，尤其是具身认知和生成认知的某些观点，其都和杜威的主张有着相通之处。


    #### （三）维特根斯坦的“日常生活语言”


