- raw: '“存在先于本质”，麦克拉姆洛克从萨特提出的这一存在主义信条出发，主张人类思维的存在状态先于它本身所包含的内容，前者在世界中的存在相较于其本质和定义具有逻辑上的优先性。他认为笛卡尔的“我思故我在”正是将人的属性存在优先于实体存在，我们首先知晓和意识到的是心灵的“思维”属性，而不是在世界中存在这一事实。同海德格尔的“在世存在”所持立场相似，萨特的“存在先于本质”也反对笛卡尔的唯我论，反对自我在意识之中和外部世界的对立，世界没有内在与外在的严格区分。所谓表征也不是心灵的内在图像，而是呈现为主体同世界之间的意向关系，表象就是世界中的事物向意识的投射（因此不存在表象与存在的分殊和对立，存在也不是隐匿于表象背后的东西）。思维和行动只有依托结构化的世界才能展现其意义，脱离开世界进行分析很有可能徒劳无功。


    休伯特·德雷福斯与马克·A.拉索尔（Mark A.Wrathall）主编的《现象学与存在主义指南》（*A Companion to Phenomenology
    and Existentialism*）对比研究了20世纪的两大哲学流派——现象学与存在主义，以及两者的基本问题和概念。第16章、第17章、第21章论述了存在主义和现象学的情感和身体问题。[^(\[48\])](#chapter001.html#m48)


    迈克尔·惠勒所著的《认知世界的重构：下一步骤》（*Reconstructing the Cognitive World：The Next Step*）在其第5～9章利用海德格尔的哲学观点来解释其核心的DEEDS主张：①在线智能（online
    intelligence）是智能的基本类型；②在线智能形成于延展的大脑—身体—环境系统；③认知科学需要对生物维度有更多认识，认知科学应当采用动力系统视角。在韦勒看来，海德格尔哲学与心灵、认知科学息息相关，海德格尔式的流畅应对、实时环境的相互作用是知识的一种构成形式，他对默会知识（know-how）的环视可以有效地理解人类认知。[^(\[49\])](#chapter001.html#m49)


    马克·拉索尔与杰夫·玛帕斯（Jeff Malpas）主编的《海德格尔、应对与认知科学——纪念德雷福斯文集》第2卷（*Heidegger，Coping，and
    Cognitive Science—Essays in Honor of Hubert L.Drefus* Volume 2）是在阐述、研究德雷福斯在人工智能与认知科学领域的观点的基础上挖掘海德格尔哲学与认知科学的关系。该卷由一些学者的论文构成，他们为德雷福斯准备将现象学的洞察力应用于各种问题的做法所影响。德雷福斯对海德格尔等哲学家的解读构成了意向性、熟练应对（skillful
    coping）和具身性等问题的背景。[^(\[50\])](#chapter001.html#m50)


    该书的第一部分讨论基于现象学的实践分析，这是德雷福斯的大部分研究工作的基础。约瑟夫·劳斯（Joseph Rouse）、戴维·斯特恩（David Stern）、西奥多·R.沙茨基（Theodore
    R.Schatzki）、约翰·塞尔（John Searle）、马克·A.拉塞尔（Mark A.Wrathall）和查尔斯·泰勒（Charles Taylor）都对德雷福斯关于熟练应对所产生的问题进行了评论。劳斯一方面将德雷福斯对实践应对的区分予以复杂化，另一方面又将显性表达和理论理解间的区别予以复杂化，主张将显性表达与理论反思同化为熟练行为的一般模型。沙茨基阐述了德雷福斯批判笛卡尔心理状态理论的一个特点，认为信念、希望等常识心理学观念可以而且应该以某一方式来理解，即符合德雷福斯对模型的现象学批判，在这一模型中，心理状态必然包含主题觉知（thematic
    awareness）。德雷福斯主张可对实际行为进行某种分析，斯特恩和塞尔都予以回应。斯特恩强调熟练应对抵制任何形式分析，并探讨了许多支持这一观点的论证。与劳斯一样，塞尔提出某些明确的熟练应对形式（如撰写哲学论文）以挑战德雷福斯对意向性的反表征主义说明，他认为，所有的熟练应对都必然涉及意向的心理活动。塞尔还认为，德雷福斯关于熟练应对的现象学未能适当地考虑熟练应对包含的意识和逻辑结构。拉索尔的文章在讨论海德格尔的“解蔽”概念的语境下，探讨了塞尔与德雷福斯的“背景”之间的关系。查尔斯·泰勒在这一部分的结尾考察了反基础主义的影响，强调了具身性、熟练应对在我们理解人类存在时的重要性。同时，泰勒坚持认为不仅仅是实践在推动历史的变迁。


    第二部分讨论了德雷福斯与现代形式的笛卡尔主义进行现象学批判的持续相关性。丹尼尔·安德勒（Daniel Andler）考察了人工智能和认知科学的当代发展（如新语境论）受到的德雷福斯式影响（Dreyfusian
    influence）。安德勒与肖恩·D.凯利（Sean D.Kelly）的论文对人们批评（比如塞尔）德雷福斯运用现象学研究意向性和心智的相关问题作出了回应。凯利认为现象学应该在认知科学中发挥作用，他将现象学与脑科学的关系比作数据与模型的关系。他利用熟练的驾车行为说明这种关系。哈里·柯林斯（Harry
    Collins）探讨了德雷福斯对人工智能批判的实质局限，认为德雷福斯没有充分考虑到不同的知识和具身状态（embodiment）。柯林斯主张这样做的结果是，虽然德雷福斯正确识别了计算机不能做的事情，但在确定计算机能做什么事情方面他的作用甚微。最后，阿尔伯特·伯格曼（Albert
    Borgmann）通过计算机介导的多用户领域使得对结果进行分析并限制离身性（disembodiment）成为可能。


    该书最后一部分介绍了受德雷福斯的“应用哲学”启发的一类研究工作的几个典型例子。德雷福斯赞扬了查尔斯·斯皮诺萨（Charles Spinosa），并指出其最好的著作总是以一种存在论现象学意义为指导，因为哲学理念背后的日常现象都存在着争议和问题。斯皮诺萨的论文试图通过描述现代的经验来阐明海德格尔对神性的解释。这反过来又让斯皮诺萨以非神秘主义的方式说明在我们当代感到幻灭的世界为活生生的上帝保留经验的位置到底具有何种意义。罗伯特·C.所罗门（Robert
    C.Solomon）利用德雷福斯的著作对信任进行了详细阐述，他认为信任是一种共同的、变革性实践，而非一方面是一种精神或心理状态，另一方面是一种社会现实。乔治·唐宁（George
    Downing）扩展了德雷福斯对专家应对的描述，以理解身体在我们的情感体验中的作用。费尔南多·弗洛雷斯（Fernando Flores）采用德雷福斯对实践的在世存在（being-in-the-world）的理解来重新解释商业活动，并概述了这种重新解释对商业理论产生的某些后果。最后，帕特里夏·本纳（Patricia
    Benner）探讨了德雷福斯将海德格尔对牵挂（care）的说明解释为与世界接触的日常实践结构对护理理论和实践的影响，她还利用德雷福斯阐释海德格尔对技术的解释来批判技术医学日益提升的主导地位。


    A-T.图米尼斯卡（A-T.Tymieniecka）主编的《二十世纪的现象学与存在主义》（*Phenomenology and Existentialism
    in the Twentieth Century*）第5章“具身性与存在：梅洛-庞蒂和自然主义的局限”（Embodiment and Existence：Merleau-Ponty
    and the Limits of Naturalism）主要论述了梅洛-庞蒂的具身存在论，认为对身体的自然主义解释只有与存在论进路相结合才是可能的，其具身存在论能够为意识的自然化提供一个更为广泛的具身性概念。[^(\[51\])](#chapter001.html#m51)


    在论文方面，约瑟夫·乌尔里克·奈瑟（Joseph Ulric Neisser）于1999年发表的《论认知科学对“此在”的使用与滥用》（On the Use
    and Abuse of Dasein in Cognitive Science）认为范·戈尔德（Van Gelder）的动力系统理论是在世存在的一种模型，海德格尔的此在并不否认任何内在表征以及行为的潜在机制。[^(\[52\])](#chapter001.html#m52)


    大卫·苏亚雷斯（David Suarez）在论文《海德格尔式认知科学的困境》（A Dilemma for Heideggerian Cognitive Science）中指出，迈克尔·惠勒的海德格尔式认知科学在解释主体性的问题上陷入了进退两难的境地，无论它是直接关切主体性抑或是旨在发展一种海德格尔式的现象学心理学，都不能成功地将现象学自然化。[^(\[53\])](#chapter001.html#m53)


    此外，国外学界开始注重由海德格尔开创、伽达默尔予以发展的哲学诠释学对认知科学的影响，如维罗妮卡·瓦斯特林（Veronica Vasterling）的论文《海德格尔关于认知的诠释学说明》（Heidegger’s
    Hermeneutic Account of Cognition）论述了海德格尔的诠释学转向对4EAC（具身认知、生成认知、嵌入认知、延展认知以及情感认知）的影响。认知的诠释学说明，其核心观点在于认知是与世界的交互与互动，并讨论了第一、第二、第三人称视角的认知所具有的不同意蕴，作者区分了直观（直接）与叙事、命题与表征这两种理解方式，最后提出了一种探索性的诠释学认知模型。[^(\[54\])](#chapter001.html#m54)肖恩·加拉格尔在论文《诠释学与认知科学》（Hermeneutics
    and the Cognitive Sciences）中试图超越解释与理解的简单对立，从而考察诠释学和认知科学的关系问题。作者主要表达了三个观点：①诠释学和认知科学了解到的事实并不完全相反，这些学科在许多事情上的观点是一致的；②诠释学对认知科学和意识科学有着积极的贡献；③认知科学也对诠释学领域有所贡献。各自对应三个问题：①我们如何认识对象？②如何认识情境？③如何理解他人？国内学界对这一问题的研究虽不成熟，但有人已经敏锐地意识到了，费多益早在2008年发表的论文《认知研究的诠释学之维》中便深入研究了如何利用诠释学方法理解认知现象，以及可能面临的逻辑困境和难题。[^(\[55\])](#chapter001.html#m55)


    综上所述，现有的利用存在论解释认知现象的文献只是涉及认知科学和人工智能的某些领域和问题，虽然在总体上提出了一些基本的原则和方向，但是缺乏将之有效统一起来的理论框架。也就是说，当前的研究只是将海德格尔的存在论分析方法运用于解决认知科学领域的某些问题，并没有在此基础上更进一步，提出一个类似于认知现象学的研究纲领，而这正是本书所着力探究的。


    #### （四）其他存在主义哲学家有关认知问题的论述概况


    ##### 1.萨特关于意识问题的研究


    萨特本人十分关注意识问题，他在自身意识、对象意识和反思意识之间作了区分，指明了“反思前的我思”。目前国内学界已关注到萨特的意识理论，庞培培在其论文《萨特的意向性概念：内部否定》一文阐述了萨特提出的意识的内部否定概念，这一概念所确立的自为存在与自在存在，以及它在萨特整个意识理论中的作用。[^(\[56\])](#chapter001.html#m56)《第一人称视角假设与他人问题——萨特的思路》还讨论了萨特对他人问题的解决，萨特认为不能将他人问题等同于对他人心灵的知觉问题，而应在与世界和与我的关系中定义他人。[^(\[57\])](#chapter001.html#m57)通过分析遭遇他人的日常经验，萨特阐明了我与他人在意识层面上的根本关联，即“我的为他存在”。其在《萨特的自身意识理论与自由概念》中认为萨特强调意识的能动性是重要的，它是意识非主题性的自身关系在意识层面的最终奠基。[^(\[58\])](#chapter001.html#m58)贾江鸿的论文《萨特的本体论证明和对笛卡尔身心关系问题的解决》阐述了萨特富有辩证意味的心身关系理论，及其关于自为的身体和为他的身体的区分与界定。[^(\[59\])](#chapter001.html#m59)莫伟民、杜小真的论文《“我思”：从笛卡儿到萨特》论述了萨特独特的意识观，他强调意识和它所意识到的意识是同一的，意识是存在而非认识，主体出自世界而非处于意识之中，正是绝对意识把我与世界相关联，他人也是意识的所是。因此作者认为萨特坚持的是一种存在论的意识哲学。[^(\[60\])](#chapter001.html#m60)


    关于认知问题，萨特从本体论的层面对意识的存在作了深入的分析与探讨，并进一步分析了非反思意识与反思意识的关系，从而为认识问题提供了新的解释思路。20世纪90年代初，杨深的《萨特认识理论剖析》一文已分析了萨特对自然世界的认识理论，在萨特看来，除了直观认识之外没有别的认识形式，演绎和推理只是导致直观的工具，认识就是自为对自在的存在关系。作者还论述了萨特对认识之范畴的理解，认为真理是认识的本体论矛盾。[^(\[61\])](#chapter001.html#m61)贾江鸿在论文《萨特论认识：反思意识，还是非反思意识？》中认为萨特的三部代表作《自我的超越性》、《想象物》和《存在与虚无》各自代表一种认识类型，即反思意识的认识、非反思意识的认识和作为一种存在方式的意识。在萨特看来，认识是自为存在的一种在世方式，体现了其与自在存在的内在否定关系，认识不仅是一种意识的抽象判断，而且应该从人的在世这一具体现象出发，谈论认识必须以思考意识现象为前提。[^(\[62\])](#chapter001.html#m62)


    ##### 2.伽达默尔关于真理的研究


    伽达默尔的哲学诠释学是当今西方哲学思潮中极为重要的一派，他的独创性理论不仅突破了传统诠释学方法论的框架，而且为当代西方哲学的发展开辟了新的视域。特别是关于真理的阐释，在他的诠释学理论中占据着核心位置，可以说，真理观是贯穿伽达默尔哲学诠释学的一条主线。目前国内研究者对此展开了不同程度和不同角度的探讨。孙丽君在《伽达默尔真理观及其理论资源》一文中对伽达默尔的真理观进行了系统的梳理，她认为真理的本质在于向一个“公共视域的形成”前进，真理是一种态度而非认识的成果；[^(\[63\])](#chapter001.html#m63)帅巍的论文《伽达默尔解释学“我-你”关系及其真理观》比较了诠释学真理观与传统真理观的差异，认为伽达默尔意义上的真理是在实际的人与人之间的交往实践或对话中被揭示的，不是干瘪的、理论化的概念运动；[^(\[64\])](#chapter001.html#m64)王坡的硕士学位论文《作为实践的理解的真理观——伽达默尔的真理观研究》从实践的角度出发详细论述了伽达默尔的诠释学真理观。伽达默尔反对认识论的真理观的独断性，试图为精神科学乃至整个人类科学建立一种统摄性的真理观，主张这种真理观首先必须从精神开始。他继承了海德格尔的真理观，认为真理不能脱离人的存在而存在，真理必须在人的实践活动中获得其价值体现，真理需要指导人的实践活动。我们看到，伽达默尔哲学诠释学批判了认识论的真理观预设的主客二分，对于我们克服传统真理观的狭隘性，从而全面理解真理的本质具有很大的启迪作用，并深刻地揭示了主体认识真理的动力机制。[^(\[65\])](#chapter001.html#m65)


    综上所述，目前在将以海德格尔为主的存在论哲学同认知科学的相关问题相结合的方面，国内学者的认识显得有些不足，只是从宏观角度描述了海德格尔哲学是否可以作为认知科学新的哲学基础，并未深入、具体地进行研究。相比之下，国外学者在这一方面的研究显得相当热烈。虽然研究的主题比较杂，范围较广，涉及主体间性、框架问题，认知的自然化解释等诸多问题，但主要的意图是以“在世存在”这一概念为核心构建一种新的海德格尔式认知科学（Heideggerian
    Cognitive Science），甚至认为其有可能取代认知科学的笛卡尔范式，并对“此在”概念以及由“此在”衍生出来的“在……之中”、“共在”和“被抛”等一系列概念进行了深入的研究，主张对认知的解释以对此在基本的存在状况的理解为前提。然而，在我们看来，当前国内外学者的研究只是将海德格尔哲学与认知科学进行了初步的结合，更多的是借助概念进行分析，既然要构建一门新的“海德格尔式认知科学”，那就不能仅仅限定于对某些概念的讨论，而是要将存在论视为一种具体的方法来回答认知科学的相关问题，尽可能在此基础上进一步提炼出存在论认知这一新的可能的认知科学研究纲领，另外，鉴于诠释学与存在论之间承前启后的密切关联，我们亦有必要考察其作为存在论认知基础的可能性。总的来说，存在论认知作为认知研究领域一个新的研究路径，我们应当充分地列举它包含的概念以及所涉及的哲学流派、理论、观念和问题，从而为之奠定扎实的理论基础。然而，从以上对文献的分析综述中我们可以看到，这一问题的研究关涉的主题实在是纷繁复杂，特别是国外学者将海德格尔哲学与认知科学相结合的部分，牵涉不少的理论和问题，对这些问题的分析又会关联一些其他认知哲学领域的观点，虽然不能罗列所有的文献，但这正好说明了对这一问题研究的意义所在，它是重要的，值得我们进行研究。


    ### 三 研究思路与方法


    存在论认知或“海德格尔式认知科学”作为一种可能的认知研究纲领，在概念界定和理论建构方面还有些薄弱，因而在认知哲学层面对之进行抽象性反思可以有效地推进其理论建构的进程。第一，厘清其哲学根源，特别是与海德格尔存在论现象学的密切关系，避免进入这样一个误区：我们似乎是在从事存在论的哲学研究。相反，笔者是基于存在论现象学的视角来审视和分析人类认知的重要问题，我们的目的，是在海德格尔存在论的哲学体系中寻找与人的认知活动相关涉的概念和观念，并将其同认知科学的具体研究相结合（比如人工智能的“框架问题”），尤其以关于此在的生存论分析为基础构建一种描述和回答认知现象与问题的新路径，并探讨其成立之可能性。第二，澄清基本概念与主要命题，避免使用过程中遇到的模糊和产生歧义等问题，分析并论证其核心论题的合理性与有效性。第三，探讨存在论认知在具体的应用过程中可能产生的问题，分析这一路径是否有扩展的必要（也就是将诠释学糅合进这一路径当中）。


    本书的主要研究方法是文献分析法、定性研究法以及认知的历史分析：通过对中英文资料的文献分析，全面考察认知科学哲学的各种研究进路，并在深入理解海德格尔哲学的思想内涵的基础上，将对认知现象的解释置于存在论的语境下进行分析，挖掘其对认知科学以及人工智能的理论贡献。采取从局部分析到整体综合的研究思路，充分借鉴海德格尔的存在论分析和哲学解释学的研究理论和方法，可以说，我们是在将海德格尔有关“此在”、世界和在世存在的理解存在论地反射到对人的认知现象的阐释与分析上。


    具体途径：系统梳理目前国内外研究存在论认知解释的文献资料，在借鉴其表述形式的基础上，充分考察其不足之处与原因；针对当前存在论认知解释的研究现状，考察存在论分析应用于认知解释的具体机制，争取构建一种新的描述路径，并按照拟定的项目纲领开展研究工作。


    ### 四 难点与创新之处'
  fmt: '

    “存在先于本质”，麦克拉姆洛克从萨特提出的这一存在主义信条出发，主张人类思维的存在状态先于它本身所包含的内容，前者在世界中的存在相较于其本质和定义具有逻辑上的优先性。他认为笛卡尔的“我思故我在”正是将人的属性存在优先于实体存在，我们首先知晓和意识到的是心灵的“思维”属性，而不是在世界中存在这一事实。同海德格尔的“在世存在”所持立场相似，萨特的“存在先于本质”也反对笛卡尔的唯我论，反对自我在意识之中和外部世界的对立，世界没有内在与外在的严格区分。所谓表征也不是心灵的内在图像，而是呈现为主体同世界之间的意向关系，表象就是世界中的事物向意识的投射（因此不存在表象与存在的分殊和对立，存在也不是隐匿于表象背后的东西）。思维和行动只有依托结构化的世界才能展现其意义，脱离开世界进行分析很有可能徒劳无功。


    休伯特·德雷福斯与马克·A.拉索尔（Mark A.Wrathall）主编的《现象学与存在主义指南》（*A Companion to Phenomenology
    and Existentialism*）对比研究了20世纪的两大哲学流派——现象学与存在主义，以及两者的基本问题和概念。第16章、第17章、第21章论述了存在主义和现象学的情感和身体问题。[^(\[48\])](#chapter001.html#m48)


    迈克尔·惠勒所著的《认知世界的重构：下一步骤》（*Reconstructing the Cognitive World：The Next Step*）在其第5～9章利用海德格尔的哲学观点来解释其核心的DEEDS主张：①在线智能（online
    intelligence）是智能的基本类型；②在线智能形成于延展的大脑—身体—环境系统；③认知科学需要对生物维度有更多认识，认知科学应当采用动力系统视角。在韦勒看来，海德格尔哲学与心灵、认知科学息息相关，海德格尔式的流畅应对、实时环境的相互作用是知识的一种构成形式，他对默会知识（know-how）的环视可以有效地理解人类认知。[^(\[49\])](#chapter001.html#m49)


    马克·拉索尔与杰夫·玛帕斯（Jeff Malpas）主编的《海德格尔、应对与认知科学——纪念德雷福斯文集》第2卷（*Heidegger，Coping，and
    Cognitive Science—Essays in Honor of Hubert L.Drefus* Volume 2）是在阐述、研究德雷福斯在人工智能与认知科学领域的观点的基础上挖掘海德格尔哲学与认知科学的关系。该卷由一些学者的论文构成，他们为德雷福斯准备将现象学的洞察力应用于各种问题的做法所影响。德雷福斯对海德格尔等哲学家的解读构成了意向性、熟练应对（skillful
    coping）和具身性等问题的背景。[^(\[50\])](#chapter001.html#m50)


    该书的第一部分讨论基于现象学的实践分析，这是德雷福斯的大部分研究工作的基础。约瑟夫·劳斯（Joseph Rouse）、戴维·斯特恩（David Stern）、西奥多·R.沙茨基（Theodore
    R.Schatzki）、约翰·塞尔（John Searle）、马克·A.拉塞尔（Mark A.Wrathall）和查尔斯·泰勒（Charles Taylor）都对德雷福斯关于熟练应对所产生的问题进行了评论。劳斯一方面将德雷福斯对实践应对的区分予以复杂化，另一方面又将显性表达和理论理解间的区别予以复杂化，主张将显性表达与理论反思同化为熟练行为的一般模型。沙茨基阐述了德雷福斯批判笛卡尔心理状态理论的一个特点，认为信念、希望等常识心理学观念可以而且应该以某一方式来理解，即符合德雷福斯对模型的现象学批判，在这一模型中，心理状态必然包含主题觉知（thematic
    awareness）。德雷福斯主张可对实际行为进行某种分析，斯特恩和塞尔都予以回应。斯特恩强调熟练应对抵制任何形式分析，并探讨了许多支持这一观点的论证。与劳斯一样，塞尔提出某些明确的熟练应对形式（如撰写哲学论文）以挑战德雷福斯对意向性的反表征主义说明，他认为，所有的熟练应对都必然涉及意向的心理活动。塞尔还认为，德雷福斯关于熟练应对的现象学未能适当地考虑熟练应对包含的意识和逻辑结构。拉索尔的文章在讨论海德格尔的“解蔽”概念的语境下，探讨了塞尔与德雷福斯的“背景”之间的关系。查尔斯·泰勒在这一部分的结尾考察了反基础主义的影响，强调了具身性、熟练应对在我们理解人类存在时的重要性。同时，泰勒坚持认为不仅仅是实践在推动历史的变迁。


    第二部分讨论了德雷福斯与现代形式的笛卡尔主义进行现象学批判的持续相关性。丹尼尔·安德勒（Daniel Andler）考察了人工智能和认知科学的当代发展（如新语境论）受到的德雷福斯式影响（Dreyfusian
    influence）。安德勒与肖恩·D.凯利（Sean D.Kelly）的论文对人们批评（比如塞尔）德雷福斯运用现象学研究意向性和心智的相关问题作出了回应。凯利认为现象学应该在认知科学中发挥作用，他将现象学与脑科学的关系比作数据与模型的关系。他利用熟练的驾车行为说明这种关系。哈里·柯林斯（Harry
    Collins）探讨了德雷福斯对人工智能批判的实质局限，认为德雷福斯没有充分考虑到不同的知识和具身状态（embodiment）。柯林斯主张这样做的结果是，虽然德雷福斯正确识别了计算机不能做的事情，但在确定计算机能做什么事情方面他的作用甚微。最后，阿尔伯特·伯格曼（Albert
    Borgmann）通过计算机介导的多用户领域使得对结果进行分析并限制离身性（disembodiment）成为可能。


    该书最后一部分介绍了受德雷福斯的“应用哲学”启发的一类研究工作的几个典型例子。德雷福斯赞扬了查尔斯·斯皮诺萨（Charles Spinosa），并指出其最好的著作总是以一种存在论现象学意义为指导，因为哲学理念背后的日常现象都存在着争议和问题。斯皮诺萨的论文试图通过描述现代的经验来阐明海德格尔对神性的解释。这反过来又让斯皮诺萨以非神秘主义的方式说明在我们当代感到幻灭的世界为活生生的上帝保留经验的位置到底具有何种意义。罗伯特·C.所罗门（Robert
    C.Solomon）利用德雷福斯的著作对信任进行了详细阐述，他认为信任是一种共同的、变革性实践，而非一方面是一种精神或心理状态，另一方面是一种社会现实。乔治·唐宁（George
    Downing）扩展了德雷福斯对专家应对的描述，以理解身体在我们的情感体验中的作用。费尔南多·弗洛雷斯（Fernando Flores）采用德雷福斯对实践的在世存在（being-in-the-world）的理解来重新解释商业活动，并概述了这种重新解释对商业理论产生的某些后果。最后，帕特里夏·本纳（Patricia
    Benner）探讨了德雷福斯将海德格尔对牵挂（care）的说明解释为与世界接触的日常实践结构对护理理论和实践的影响，她还利用德雷福斯阐释海德格尔对技术的解释来批判技术医学日益提升的主导地位。


    A-T.图米尼斯卡（A-T.Tymieniecka）主编的《二十世纪的现象学与存在主义》（*Phenomenology and Existentialism
    in the Twentieth Century*）第5章“具身性与存在：梅洛-庞蒂和自然主义的局限”（Embodiment and Existence：Merleau-Ponty
    and the Limits of Naturalism）主要论述了梅洛-庞蒂的具身存在论，认为对身体的自然主义解释只有与存在论进路相结合才是可能的，其具身存在论能够为意识的自然化提供一个更为广泛的具身性概念。[^(\[51\])](#chapter001.html#m51)


    在论文方面，约瑟夫·乌尔里克·奈瑟（Joseph Ulric Neisser）于1999年发表的《论认知科学对“此在”的使用与滥用》（On the Use
    and Abuse of Dasein in Cognitive Science）认为范·戈尔德（Van Gelder）的动力系统理论是在世存在的一种模型，海德格尔的此在并不否认任何内在表征以及行为的潜在机制。[^(\[52\])](#chapter001.html#m52)


    大卫·苏亚雷斯（David Suarez）在论文《海德格尔式认知科学的困境》（A Dilemma for Heideggerian Cognitive Science）中指出，迈克尔·惠勒的海德格尔式认知科学在解释主体性的问题上陷入了进退两难的境地，无论它是直接关切主体性抑或是旨在发展一种海德格尔式的现象学心理学，都不能成功地将现象学自然化。[^(\[53\])](#chapter001.html#m53)


    此外，国外学界开始注重由海德格尔开创、伽达默尔予以发展的哲学诠释学对认知科学的影响，如维罗妮卡·瓦斯特林（Veronica Vasterling）的论文《海德格尔关于认知的诠释学说明》（Heidegger’s
    Hermeneutic Account of Cognition）论述了海德格尔的诠释学转向对4EAC（具身认知、生成认知、嵌入认知、延展认知以及情感认知）的影响。认知的诠释学说明，其核心观点在于认知是与世界的交互与互动，并讨论了第一、第二、第三人称视角的认知所具有的不同意蕴，作者区分了直观（直接）与叙事、命题与表征这两种理解方式，最后提出了一种探索性的诠释学认知模型。[^(\[54\])](#chapter001.html#m54)肖恩·加拉格尔在论文《诠释学与认知科学》（Hermeneutics
    and the Cognitive Sciences）中试图超越解释与理解的简单对立，从而考察诠释学和认知科学的关系问题。作者主要表达了三个观点：①诠释学和认知科学了解到的事实并不完全相反，这些学科在许多事情上的观点是一致的；②诠释学对认知科学和意识科学有着积极的贡献；③认知科学也对诠释学领域有所贡献。各自对应三个问题：①我们如何认识对象？②如何认识情境？③如何理解他人？国内学界对这一问题的研究虽不成熟，但有人已经敏锐地意识到了，费多益早在2008年发表的论文《认知研究的诠释学之维》中便深入研究了如何利用诠释学方法理解认知现象，以及可能面临的逻辑困境和难题。[^(\[55\])](#chapter001.html#m55)


    综上所述，现有的利用存在论解释认知现象的文献只是涉及认知科学和人工智能的某些领域和问题，虽然在总体上提出了一些基本的原则和方向，但是缺乏将之有效统一起来的理论框架。也就是说，当前的研究只是将海德格尔的存在论分析方法运用于解决认知科学领域的某些问题，并没有在此基础上更进一步，提出一个类似于认知现象学的研究纲领，而这正是本书所着力探究的。


    ## （四）其他存在主义哲学家有关认知问题的论述概况


    ### 1. 萨特关于意识问题的研究


    萨特本人十分关注意识问题，他在自身意识、对象意识和反思意识之间作了区分，指明了“反思前的我思”。目前国内学界已关注到萨特的意识理论，庞培培在其论文《萨特的意向性概念：内部否定》一文阐述了萨特提出的意识的内部否定概念，这一概念所确立的自为存在与自在存在，以及它在萨特整个意识理论中的作用。[^(\[56\])](#chapter001.html#m56)《第一人称视角假设与他人问题——萨特的思路》还讨论了萨特对他人问题的解决，萨特认为不能将他人问题等同于对他人心灵的知觉问题，而应在与世界和与我的关系中定义他人。[^(\[57\])](#chapter001.html#m57)通过分析遭遇他人的日常经验，萨特阐明了我与他人在意识层面上的根本关联，即“我的为他存在”。其在《萨特的自身意识理论与自由概念》中认为萨特强调意识的能动性是重要的，它是意识非主题性的自身关系在意识层面的最终奠基。[^(\[58\])](#chapter001.html#m58)贾江鸿的论文《萨特的本体论证明和对笛卡尔身心关系问题的解决》阐述了萨特富有辩证意味的心身关系理论，及其关于自为的身体和为他的身体的区分与界定。[^(\[59\])](#chapter001.html#m59)莫伟民、杜小真的论文《“我思”：从笛卡儿到萨特》论述了萨特独特的意识观，他强调意识和它所意识到的意识是同一的，意识是存在而非认识，主体出自世界而非处于意识之中，正是绝对意识把我与世界相关联，他人也是意识的所是。因此作者认为萨特坚持的是一种存在论的意识哲学。[^(\[60\])](#chapter001.html#m60)


    关于认知问题，萨特从本体论的层面对意识的存在作了深入的分析与探讨，并进一步分析了非反思意识与反思意识的关系，从而为认识问题提供了新的解释思路。20世纪90年代初，杨深的《萨特认识理论剖析》一文已分析了萨特对自然世界的认识理论，在萨特看来，除了直观认识之外没有别的认识形式，演绎和推理只是导致直观的工具，认识就是自为对自在的存在关系。作者还论述了萨特对认识之范畴的理解，认为真理是认识的本体论矛盾。[^(\[61\])](#chapter001.html#m61)贾江鸿在论文《萨特论认识：反思意识，还是非反思意识？》中认为萨特的三部代表作《自我的超越性》、《想象物》和《存在与虚无》各自代表一种认识类型，即反思意识的认识、非反思意识的认识和作为一种存在方式的意识。在萨特看来，认识是自为存在的一种在世方式，体现了其与自在存在的内在否定关系，认识不仅是一种意识的抽象判断，而且应该从人的在世这一具体现象出发，谈论认识必须以思考意识现象为前提。[^(\[62\])](#chapter001.html#m62)


    ### 2. 伽达默尔关于真理的研究


    伽达默尔的哲学诠释学是当今西方哲学思潮中极为重要的一派，他的独创性理论不仅突破了传统诠释学方法论的框架，而且为当代西方哲学的发展开辟了新的视域。特别是关于真理的阐释，在他的诠释学理论中占据着核心位置，可以说，真理观是贯穿伽达默尔哲学诠释学的一条主线。目前国内研究者对此展开了不同程度和不同角度的探讨。孙丽君在《伽达默尔真理观及其理论资源》一文中对伽达默尔的真理观进行了系统的梳理，她认为真理的本质在于向一个“公共视域的形成”前进，真理是一种态度而非认识的成果；[^(\[63\])](#chapter001.html#m63)帅巍的论文《伽达默尔解释学“我-你”关系及其真理观》比较了诠释学真理观与传统真理观的差异，认为伽达默尔意义上的真理是在实际的人与人之间的交往实践或对话中被揭示的，不是干瘪的、理论化的概念运动；[^(\[64\])](#chapter001.html#m64)王坡的硕士学位论文《作为实践的理解的真理观——伽达默尔的真理观研究》从实践的角度出发详细论述了伽达默尔的诠释学真理观。伽达默尔反对认识论的真理观的独断性，试图为精神科学乃至整个人类科学建立一种统摄性的真理观，主张这种真理观首先必须从精神开始。他继承了海德格尔的真理观，认为真理不能脱离人的存在而存在，真理必须在人的实践活动中获得其价值体现，真理需要指导人的实践活动。我们看到，伽达默尔哲学诠释学批判了认识论的真理观预设的主客二分，对于我们克服传统真理观的狭隘性，从而全面理解真理的本质具有很大的启迪作用，并深刻地揭示了主体认识真理的动力机制。[^(\[65\])](#chapter001.html#m65)


    综上所述，目前在将以海德格尔为主的存在论哲学同认知科学的相关问题相结合的方面，国内学者的认识显得有些不足，只是从宏观角度描述了海德格尔哲学是否可以作为认知科学新的哲学基础，并未深入、具体地进行研究。相比之下，国外学者在这一方面的研究显得相当热烈。虽然研究的主题比较杂，范围较广，涉及主体间性、框架问题，认知的自然化解释等诸多问题，但主要的意图是以“在世存在”这一概念为核心构建一种新的海德格尔式认知科学（Heideggerian
    Cognitive Science），甚至认为其有可能取代认知科学的笛卡尔范式，并对“此在”概念以及由“此在”衍生出来的“在……之中”、“共在”和“被抛”等一系列概念进行了深入的研究，主张对认知的解释以对此在基本的存在状况的理解为前提。然而，在我们看来，当前国内外学者的研究只是将海德格尔哲学与认知科学进行了初步的结合，更多的是借助概念进行分析，既然要构建一门新的“海德格尔式认知科学”，那就不能仅仅限定于对某些概念的讨论，而是要将存在论视为一种具体的方法来回答认知科学的相关问题，尽可能在此基础上进一步提炼出存在论认知这一新的可能的认知科学研究纲领，另外，鉴于诠释学与存在论之间承前启后的密切关联，我们亦有必要考察其作为存在论认知基础的可能性。总的来说，存在论认知作为认知研究领域一个新的研究路径，我们应当充分地列举它包含的概念以及所涉及的哲学流派、理论、观念和问题，从而为之奠定扎实的理论基础。然而，从以上对文献的分析综述中我们可以看到，这一问题的研究关涉的主题实在是纷繁复杂，特别是国外学者将海德格尔哲学与认知科学相结合的部分，牵涉不少的理论和问题，对这些问题的分析又会关联一些其他认知哲学领域的观点，虽然不能罗列所有的文献，但这正好说明了对这一问题研究的意义所在，它是重要的，值得我们进行研究。


    ## 三 研究思路与方法


    存在论认知或“海德格尔式认知科学”作为一种可能的认知研究纲领，在概念界定和理论建构方面还有些薄弱，因而在认知哲学层面对之进行抽象性反思可以有效地推进其理论建构的进程。第一，厘清其哲学根源，特别是与海德格尔存在论现象学的密切关系，避免进入这样一个误区：我们似乎是在从事存在论的哲学研究。相反，笔者是基于存在论现象学的视角来审视和分析人类认知的重要问题，我们的目的，是在海德格尔存在论的哲学体系中寻找与人的认知活动相关涉的概念和观念，并将其同认知科学的具体研究相结合（比如人工智能的“框架问题”），尤其以关于此在的生存论分析为基础构建一种描述和回答认知现象与问题的新路径，并探讨其成立之可能性。第二，澄清基本概念与主要命题，避免使用过程中遇到的模糊和产生歧义等问题，分析并论证其核心论题的合理性与有效性。第三，探讨存在论认知在具体的应用过程中可能产生的问题，分析这一路径是否有扩展的必要（也就是将诠释学糅合进这一路径当中）。


    本书的主要研究方法是文献分析法、定性研究法以及认知的历史分析：通过对中英文资料的文献分析，全面考察认知科学哲学的各种研究进路，并在深入理解海德格尔哲学的思想内涵的基础上，将对认知现象的解释置于存在论的语境下进行分析，挖掘其对认知科学以及人工智能的理论贡献。采取从局部分析到整体综合的研究思路，充分借鉴海德格尔的存在论分析和哲学解释学的研究理论和方法，可以说，我们是在将海德格尔有关“此在”、世界和在世存在的理解存在论地反射到对人的认知现象的阐释与分析上。


    具体途径：系统梳理目前国内外研究存在论认知解释的文献资料，在借鉴其表述形式的基础上，充分考察其不足之处与原因；针对当前存在论认知解释的研究现状，考察存在论分析应用于认知解释的具体机制，争取构建一种新的描述路径，并按照拟定的项目纲领开展研究工作。


    ## 四 难点与创新之处

    '
  trans: '


    “存在先于本质”，麦克拉姆洛克从萨特提出的这一存在主义信条出发，主张人类思维的存在状态先于它本身所包含的内容，前者在世界中的存在相较于其本质和定义具有逻辑上的优先性。他认为笛卡尔的“我思故我在”正是将人的属性存在优先于实体存在，我们首先知晓和意识到的是心灵的“思维”属性，而不是在世界中存在这一事实。同海德格尔的“在世存在”所持立场相似，萨特的“存在先于本质”也反对笛卡尔的唯我论，反对自我在意识之中和外部世界的对立，世界没有内在与外在的严格区分。所谓表征也不是心灵的内在图像，而是呈现为主体同世界之间的意向关系，表象就是世界中的事物向意识的投射（因此不存在表象与存在的分殊和对立，存在也不是隐匿于表象背后的东西）。思维和行动只有依托结构化的世界才能展现其意义，脱离开世界进行分析很有可能徒劳无功。


    休伯特·德雷福斯与马克·A.拉索尔（Mark A.Wrathall）主编的《现象学与存在主义指南》（*A Companion to Phenomenology
    and Existentialism*）对比研究了 20 世纪的两大哲学流派——现象学与存在主义，以及两者的基本问题和概念。第 16 章、第 17 章、第
    21 章论述了存在主义和现象学的情感和身体问题。[^(\[48\])](#chapter001.html#m48)


    迈克尔·惠勒所著的《认知世界的重构：下一步骤》（*Reconstructing the Cognitive World：The Next Step*）在其第
    5～9 章利用海德格尔的哲学观点来解释其核心的 DEEDS 主张：①在线智能（online intelligence）是智能的基本类型；②在线智能形成于延展的大脑—身体—环境系统；③认知科学需要对生物维度有更多认识，认知科学应当采用动力系统视角。在韦勒看来，海德格尔哲学与心灵、认知科学息息相关，海德格尔式的流畅应对、实时环境的相互作用是知识的一种构成形式，他对默会知识（know-how）的环视可以有效地理解人类认知。[^(\[49\])](#chapter001.html#m49)


    马克·拉索尔与杰夫·玛帕斯（Jeff Malpas）主编的《海德格尔、应对与认知科学——纪念德雷福斯文集》第 2 卷（*Heidegger，Coping，and
    Cognitive Science—Essays in Honor of Hubert L.Drefus* Volume 2）是在阐述、研究德雷福斯在人工智能与认知科学领域的观点的基础上挖掘海德格尔哲学与认知科学的关系。该卷由一些学者的论文构成，他们为德雷福斯准备将现象学的洞察力应用于各种问题的做法所影响。德雷福斯对海德格尔等哲学家的解读构成了意向性、熟练应对（skillful
    coping）和具身性等问题的背景。[^(\[50\])](#chapter001.html#m50)


    该书的第一部分讨论基于现象学的实践分析，这是德雷福斯的大部分研究工作的基础。约瑟夫·劳斯（Joseph Rouse）、戴维·斯特恩（David Stern）、西奥多·R.沙茨基（Theodore
    R.Schatzki）、约翰·塞尔（John Searle）、马克·A.拉塞尔（Mark A.Wrathall）和查尔斯·泰勒（Charles Taylor）都对德雷福斯关于熟练应对所产生的问题进行了评论。劳斯一方面将德雷福斯对实践应对的区分予以复杂化，另一方面又将显性表达和理论理解间的区别予以复杂化，主张将显性表达与理论反思同化为熟练行为的一般模型。沙茨基阐述了德雷福斯批判笛卡尔心理状态理论的一个特点，认为信念、希望等常识心理学观念可以而且应该以某一方式来理解，即符合德雷福斯对模型的现象学批判，在这一模型中，心理状态必然包含主题觉知（thematic
    awareness）。德雷福斯主张可对实际行为进行某种分析，斯特恩和塞尔都予以回应。斯特恩强调熟练应对抵制任何形式分析，并探讨了许多支持这一观点的论证。与劳斯一样，塞尔提出某些明确的熟练应对形式（如撰写哲学论文）以挑战德雷福斯对意向性的反表征主义说明，他认为，所有的熟练应对都必然涉及意向的心理活动。塞尔还认为，德雷福斯关于熟练应对的现象学未能适当地考虑熟练应对包含的意识和逻辑结构。拉索尔的文章在讨论海德格尔的“解蔽”概念的语境下，探讨了塞尔与德雷福斯的“背景”之间的关系。查尔斯·泰勒在这一部分的结尾考察了反基础主义的影响，强调了具身性、熟练应对在我们理解人类存在时的重要性。同时，泰勒坚持认为不仅仅是实践在推动历史的变迁。


    第二部分讨论了德雷福斯与现代形式的笛卡尔主义进行现象学批判的持续相关性。丹尼尔·安德勒（Daniel Andler）考察了人工智能和认知科学的当代发展（如新语境论）受到的德雷福斯式影响（Dreyfusian
    influence）。安德勒与肖恩·D.凯利（Sean D.Kelly）的论文对人们批评（比如塞尔）德雷福斯运用现象学研究意向性和心智的相关问题作出了回应。凯利认为现象学应该在认知科学中发挥作用，他将现象学与脑科学的关系比作数据与模型的关系。他利用熟练的驾车行为说明这种关系。哈里·柯林斯（Harry
    Collins）探讨了德雷福斯对人工智能批判的实质局限，认为德雷福斯没有充分考虑到不同的知识和具身状态（embodiment）。柯林斯主张这样做的结果是，虽然德雷福斯正确识别了计算机不能做的事情，但在确定计算机能做什么事情方面他的作用甚微。最后，阿尔伯特·伯格曼（Albert
    Borgmann）通过计算机介导的多用户领域使得对结果进行分析并限制离身性（disembodiment）成为可能。


    该书最后一部分介绍了受德雷福斯的“应用哲学”启发的一类研究工作的几个典型例子。德雷福斯赞扬了查尔斯·斯皮诺萨（Charles Spinosa），并指出其最好的著作总是以一种存在论现象学意义为指导，因为哲学理念背后的日常现象都存在着争议和问题。斯皮诺萨的论文试图通过描述现代的经验来阐明海德格尔对神性的解释。这反过来又让斯皮诺萨以非神秘主义的方式说明在我们当代感到幻灭的世界为活生生的上帝保留经验的位置到底具有何种意义。罗伯特·C.所罗门（Robert
    C.Solomon）利用德雷福斯的著作对信任进行了详细阐述，他认为信任是一种共同的、变革性实践，而非一方面是一种精神或心理状态，另一方面是一种社会现实。乔治·唐宁（George
    Downing）扩展了德雷福斯对专家应对的描述，以理解身体在我们的情感体验中的作用。费尔南多·弗洛雷斯（Fernando Flores）采用德雷福斯对实践的在世存在（being-in-the-world）的理解来重新解释商业活动，并概述了这种重新解释对商业理论产生的某些后果。最后，帕特里夏·本纳（Patricia
    Benner）探讨了德雷福斯将海德格尔对牵挂（care）的说明解释为与世界接触的日常实践结构对护理理论和实践的影响，她还利用德雷福斯阐释海德格尔对技术的解释来批判技术医学日益提升的主导地位。


    A-T.图米尼斯卡（A-T.Tymieniecka）主编的《二十世纪的现象学与存在主义》（*Phenomenology and Existentialism
    in the Twentieth Century*）第 5 章“具身性与存在：梅洛-庞蒂和自然主义的局限”（Embodiment and Existence：Merleau-Ponty
    and the Limits of Naturalism）主要论述了梅洛-庞蒂的具身存在论，认为对身体的自然主义解释只有与存在论进路相结合才是可能的，其具身存在论能够为意识的自然化提供一个更为广泛的具身性概念。[^(\[51\])](#chapter001.html#m51)


    在论文方面，约瑟夫·乌尔里克·奈瑟（Joseph Ulric Neisser）于 1999 年发表的《论认知科学对“此在”的使用与滥用》（On the Use
    and Abuse of Dasein in Cognitive Science）认为范·戈尔德（Van Gelder）的动力系统理论是在世存在的一种模型，海德格尔的此在并不否认任何内在表征以及行为的潜在机制。[^(\[52\])](#chapter001.html#m52)


    大卫·苏亚雷斯（David Suarez）在论文《海德格尔式认知科学的困境》（A Dilemma for Heideggerian Cognitive Science）中指出，迈克尔·惠勒的海德格尔式认知科学在解释主体性的问题上陷入了进退两难的境地，无论它是直接关切主体性抑或是旨在发展一种海德格尔式的现象学心理学，都不能成功地将现象学自然化。[^(\[53\])](#chapter001.html#m53)


    此外，国外学界开始注重由海德格尔开创、伽达默尔予以发展的哲学诠释学对认知科学的影响，如维罗妮卡·瓦斯特林（Veronica Vasterling）的论文《海德格尔关于认知的诠释学说明》（Heidegger’s
    Hermeneutic Account of Cognition）论述了海德格尔的诠释学转向对 4EAC（具身认知、生成认知、嵌入认知、延展认知以及情感认知）的影响。认知的诠释学说明，其核心观点在于认知是与世界的交互与互动，并讨论了第一、第二、第三人称视角的认知所具有的不同意蕴，作者区分了直观（直接）与叙事、命题与表征这两种理解方式，最后提出了一种探索性的诠释学认知模型。[^(\[54\])](#chapter001.html#m54)肖恩·加拉格尔在论文《诠释学与认知科学》（Hermeneutics
    and the Cognitive Sciences）中试图超越解释与理解的简单对立，从而考察诠释学和认知科学的关系问题。作者主要表达了三个观点：①诠释学和认知科学了解到的事实并不完全相反，这些学科在许多事情上的观点是一致的；②诠释学对认知科学和意识科学有着积极的贡献；③认知科学也对诠释学领域有所贡献。各自对应三个问题：①我们如何认识对象？②如何认识情境？③如何理解他人？国内学界对这一问题的研究虽不成熟，但有人已经敏锐地意识到了，费多益早在
    2008 年发表的论文《认知研究的诠释学之维》中便深入研究了如何利用诠释学方法理解认知现象，以及可能面临的逻辑困境和难题。[^(\[55\])](#chapter001.html#m55)


    综上所述，现有的利用存在论解释认知现象的文献只是涉及认知科学和人工智能的某些领域和问题，虽然在总体上提出了一些基本的原则和方向，但是缺乏将之有效统一起来的理论框架。也就是说，当前的研究只是将海德格尔的存在论分析方法运用于解决认知科学领域的某些问题，并没有在此基础上更进一步，提出一个类似于认知现象学的研究纲领，而这正是本书所着力探究的。


    ## （四）其他存在主义哲学家有关认知问题的论述概况


    ### 1. 萨特关于意识问题的研究


    萨特本人十分关注意识问题，他在自身意识、对象意识和反思意识之间作了区分，指明了“反思前的我思”。目前国内学界已关注到萨特的意识理论，庞培培在其论文《萨特的意向性概念：内部否定》一文阐述了萨特提出的意识的内部否定概念，这一概念所确立的自为存在与自在存在，以及它在萨特整个意识理论中的作用。[^(\[56\])](#chapter001.html#m56)《第一人称视角假设与他人问题——萨特的思路》还讨论了萨特对他人问题的解决，萨特认为不能将他人问题等同于对他人心灵的知觉问题，而应在与世界和与我的关系中定义他人。[^(\[57\])](#chapter001.html#m57)通过分析遭遇他人的日常经验，萨特阐明了我与他人在意识层面上的根本关联，即“我的为他存在”。其在《萨特的自身意识理论与自由概念》中认为萨特强调意识的能动性是重要的，它是意识非主题性的自身关系在意识层面的最终奠基。[^(\[58\])](#chapter001.html#m58)贾江鸿的论文《萨特的本体论证明和对笛卡尔身心关系问题的解决》阐述了萨特富有辩证意味的心身关系理论，及其关于自为的身体和为他的身体的区分与界定。[^(\[59\])](#chapter001.html#m59)莫伟民、杜小真的论文《“我思”：从笛卡儿到萨特》论述了萨特独特的意识观，他强调意识和它所意识到的意识是同一的，意识是存在而非认识，主体出自世界而非处于意识之中，正是绝对意识把我与世界相关联，他人也是意识的所是。因此作者认为萨特坚持的是一种存在论的意识哲学。[^(\[60\])](#chapter001.html#m60)


    关于认知问题，萨特从本体论的层面对意识的存在作了深入的分析与探讨，并进一步分析了非反思意识与反思意识的关系，从而为认识问题提供了新的解释思路。20 世纪 90
    年代初，杨深的《萨特认识理论剖析》一文已分析了萨特对自然世界的认识理论，在萨特看来，除了直观认识之外没有别的认识形式，演绎和推理只是导致直观的工具，认识就是自为对自在的存在关系。作者还论述了萨特对认识之范畴的理解，认为真理是认识的本体论矛盾。[^(\[61\])](#chapter001.html#m61)贾江鸿在论文《萨特论认识：反思意识，还是非反思意识？》中认为萨特的三部代表作《自我的超越性》、《想象物》和《存在与虚无》各自代表一种认识类型，即反思意识的认识、非反思意识的认识和作为一种存在方式的意识。在萨特看来，认识是自为存在的一种在世方式，体现了其与自在存在的内在否定关系，认识不仅是一种意识的抽象判断，而且应该从人的在世这一具体现象出发，谈论认识必须以思考意识现象为前提。[^(\[62\])](#chapter001.html#m62)


    ### 2. 伽达默尔关于真理的研究


    伽达默尔的哲学诠释学是当今西方哲学思潮中极为重要的一派，他的独创性理论不仅突破了传统诠释学方法论的框架，而且为当代西方哲学的发展开辟了新的视域。特别是关于真理的阐释，在他的诠释学理论中占据着核心位置，可以说，真理观是贯穿伽达默尔哲学诠释学的一条主线。目前国内研究者对此展开了不同程度和不同角度的探讨。孙丽君在《伽达默尔真理观及其理论资源》一文中对伽达默尔的真理观进行了系统的梳理，她认为真理的本质在于向一个“公共视域的形成”前进，真理是一种态度而非认识的成果；[^(\[63\])](#chapter001.html#m63)帅巍的论文《伽达默尔解释学“我-你”关系及其真理观》比较了诠释学真理观与传统真理观的差异，认为伽达默尔意义上的真理是在实际的人与人之间的交往实践或对话中被揭示的，不是干瘪的、理论化的概念运动；[^(\[64\])](#chapter001.html#m64)王坡的硕士学位论文《作为实践的理解的真理观——伽达默尔的真理观研究》从实践的角度出发详细论述了伽达默尔的诠释学真理观。伽达默尔反对认识论的真理观的独断性，试图为精神科学乃至整个人类科学建立一种统摄性的真理观，主张这种真理观首先必须从精神开始。他继承了海德格尔的真理观，认为真理不能脱离人的存在而存在，真理必须在人的实践活动中获得其价值体现，真理需要指导人的实践活动。我们看到，伽达默尔哲学诠释学批判了认识论的真理观预设的主客二分，对于我们克服传统真理观的狭隘性，从而全面理解真理的本质具有很大的启迪作用，并深刻地揭示了主体认识真理的动力机制。[^(\[65\])](#chapter001.html#m65)


    综上所述，目前在将以海德格尔为主的存在论哲学同认知科学的相关问题相结合的方面，国内学者的认识显得有些不足，只是从宏观角度描述了海德格尔哲学是否可以作为认知科学新的哲学基础，并未深入、具体地进行研究。相比之下，国外学者在这一方面的研究显得相当热烈。虽然研究的主题比较杂，范围较广，涉及主体间性、框架问题，认知的自然化解释等诸多问题，但主要的意图是以“在世存在”这一概念为核心构建一种新的海德格尔式认知科学（Heideggerian
    Cognitive Science），甚至认为其有可能取代认知科学的笛卡尔范式，并对“此在”概念以及由“此在”衍生出来的“在……之中”、“共在”和“被抛”等一系列概念进行了深入的研究，主张对认知的解释以对此在基本的存在状况的理解为前提。然而，在我们看来，当前国内外学者的研究只是将海德格尔哲学与认知科学进行了初步的结合，更多的是借助概念进行分析，既然要构建一门新的“海德格尔式认知科学”，那就不能仅仅限定于对某些概念的讨论，而是要将存在论视为一种具体的方法来回答认知科学的相关问题，尽可能在此基础上进一步提炼出存在论认知这一新的可能的认知科学研究纲领，另外，鉴于诠释学与存在论之间承前启后的密切关联，我们亦有必要考察其作为存在论认知基础的可能性。总的来说，存在论认知作为认知研究领域一个新的研究路径，我们应当充分地列举它包含的概念以及所涉及的哲学流派、理论、观念和问题，从而为之奠定扎实的理论基础。然而，从以上对文献的分析综述中我们可以看到，这一问题的研究关涉的主题实在是纷繁复杂，特别是国外学者将海德格尔哲学与认知科学相结合的部分，牵涉不少的理论和问题，对这些问题的分析又会关联一些其他认知哲学领域的观点，虽然不能罗列所有的文献，但这正好说明了对这一问题研究的意义所在，它是重要的，值得我们进行研究。


    ## 三 研究思路与方法


    存在论认知或“海德格尔式认知科学”作为一种可能的认知研究纲领，在概念界定和理论建构方面还有些薄弱，因而在认知哲学层面对之进行抽象性反思可以有效地推进其理论建构的进程。第一，厘清其哲学根源，特别是与海德格尔存在论现象学的密切关系，避免进入这样一个误区：我们似乎是在从事存在论的哲学研究。相反，笔者是基于存在论现象学的视角来审视和分析人类认知的重要问题，我们的目的，是在海德格尔存在论的哲学体系中寻找与人的认知活动相关涉的概念和观念，并将其同认知科学的具体研究相结合（比如人工智能的“框架问题”），尤其以关于此在的生存论分析为基础构建一种描述和回答认知现象与问题的新路径，并探讨其成立之可能性。第二，澄清基本概念与主要命题，避免使用过程中遇到的模糊和产生歧义等问题，分析并论证其核心论题的合理性与有效性。第三，探讨存在论认知在具体的应用过程中可能产生的问题，分析这一路径是否有扩展的必要（也就是将诠释学糅合进这一路径当中）。


    本书的主要研究方法是文献分析法、定性研究法以及认知的历史分析：通过对中英文资料的文献分析，全面考察认知科学哲学的各种研究进路，并在深入理解海德格尔哲学的思想内涵的基础上，将对认知现象的解释置于存在论的语境下进行分析，挖掘其对认知科学以及人工智能的理论贡献。采取从局部分析到整体综合的研究思路，充分借鉴海德格尔的存在论分析和哲学解释学的研究理论和方法，可以说，我们是在将海德格尔有关“此在”、世界和在世存在的理解存在论地反射到对人的认知现象的阐释与分析上。


    具体途径：系统梳理目前国内外研究存在论认知解释的文献资料，在借鉴其表述形式的基础上，充分考察其不足之处与原因；针对当前存在论认知解释的研究现状，考察存在论分析应用于认知解释的具体机制，争取构建一种新的描述路径，并按照拟定的项目纲领开展研究工作。


    ## 四 难点与创新之处


