- raw: '虽然各种认知理论和假设在关于认知过程的本质问题上争论不断，但一个共同的预设是：认知与行动不同。这里提到的认知，我们将之界定为包括记忆、推理和判断等形式在内的心智活动，是主体与对象的动态联结，行动是具有复合结构的概念，包括物理性的具身运动和心理性的目标和意向状态，并排除掉那些无意识的身体动作，比如条件反射等单纯的物理运动，以及由意志、情感等非理性因素驱动而产生的行为。不论是认知主义，还是具身和情境认知，它们都在坚持传统的观点，把认知与行动区分开来，认知作为一种信息处理过程，不是行动包括的子集，相反，它是产生行动的内因。根据认知计算主义的观点，人类认知是将来自世界的某种形式输入编码为内在的符号，并在这些内部符号之间进行操作和计算，如果计算过于复杂，则会产生符号的行动操作，比如拿计算器或纸笔手动进行计算。在埃扎瓦看来，即便是延展认知也依然蕴含着认知是行动之因的立场，在著名的英伽-奥托思想实验中，克拉克和查尔默斯并没有摆脱关于认知与行动的旧有观念，奥托笔记本内记录的信息和英伽大脑中的记忆都是两人前往艺术博物馆这一行动的因果相关要素。[^(\[43\])](#chapter004.html#m43)他的看法是，不论认知在形式上是延展还是生成的，也不管它的本质是否为一种计算，只要认知过程与行动表现为一种前后相继的关系，那么认知与行动就属于完全不同的范畴，这与认知科学的正统观点并不冲突，思维和认知过程在脑内，而任务的执行和完成（行动）在脑外。当然，也有不同的观点。认知实用主义持有的立场是：认知不应被理解为有机体被动地获得世界模型并加以表征的能力或过程，而应是在环境中通过行动生成世界的过程，有机体在世界中有效的具身行动实际上构成其知觉，并进而成为认知的根基。[^(\[44\])](#chapter004.html#m44)可以说，认知先于行动体现的是基于认知的行动观，行动先于认知则体现的是基于行动的认知观。除此之外，有的观点将认知与行动等同起来，转向了极端的行动主义，把认知视为行动，主张人的认知过程通过密切协调的感知和行动加以实现，激进的具身认知甚至将认知解释为大脑—身体—环境系统的行动展开。


    对于将认知等同于行动的观点，有些实验能够给予有力的回击，如神经肌肉阻滞和闭锁综合征（locked-in syndrome）。前者表明身体的瘫痪程度并不影响主体的认知活动，模式化的行动表现与自由的认知相互分离；后者表明人在失去对身体控制的情况下（如大脑内部受到了损伤）仍可以进行认知加工。因此这些实验证明了认知就是行动这一假设是有问题的，至少对其进行了强烈的挑战。可以说，认知不应该被理解为一种行动，至少二者不能完全等同。如果这一假设是正确、必要的，那么认知与行动的关联是什么？谁更具优先性？若我们把行动定义为认知过程的物理实现，那么从逻辑上来说，行动是认知之后的，受到属于认知范畴的目标和预期的驱动，“是需要由认知过程或知识来解释的经验现象”，[^(\[45\])](#chapter004.html#m45)因而，行动的意向性与认知体现出的意向性可能是一致的，也就是说，行动是认知意向的现实化和实践化。


    认知主义的观点是，关于同我们互动的现成之物，即便我们不可能具有关于它们的清晰表征，但是心智的认知机制伴随始终。在熟练操用器具的过程中，我们必定先构造了关于器具的某一表征模型，因为只有预先了解了工具的属性与功能才能更加流畅地使用它。因此，表征在人与世界的交互中占据着主导地位，交互离不开以表征为核心的认知机制的参与，认知实质上体现为表征—世界—行动的结构，需要借助心智内在的认知机制作为中介加以实现，行动则是这一机制的输出结果。从这种意义上说，“瞠目”式的表征似乎是行动展开的前提，一般而言，人们不太可能不假思索地使用工具，先“知”后“行”似乎才是更加普遍的模式。所谓“知”是对器具等其他存在者之样式和属性的认知和纯粹察看，“行”是基于情境对器具的上手操用。主体熟练、具身的行动在一定程度上决定了他所持有的信念，我关于“桌子”的认知表征同我围绕桌子产生的活动相关，比如在桌子上写字、阅读等，而这种技能活动是非形式、非表征的，并总是处于特定的情境中。正如德雷福斯所言，一件用具依据人们用它来干什么而得到界定，[^(\[46\])](#chapter004.html#m46)沉浸的（absorbed）意向性总是先于表征的意向性。以椅子为例，我们都知道椅子具有“坐”的功能与属性，本质上正是“坐”这一行动使我们将它作为一把椅子而分辨出来，而非通过形状、材料等物理描述确定椅子的表象。对于人而言，椅子的类型并不重要，只要某一物体能够同人坐下的行动相契合，我们就可以认为它是椅子，或者至少具有了椅子的功能和效用。


    我们认为，强调行动之于主体认知活动的重要作用，其目的不是取消表征（即便是旗帜鲜明地反对表征主义的动力理论，也在一定程度上为表征留有地盘），更不是重新回到斯金纳和华生主张的行为主义立场。奈瑟尔指出，作为“后笛卡尔主体”概念，“此在”不是将思维与行动或行动的生成机制相等同的操作主义，而是对主体性自身的意义根基的认识。为了保证输入心智信息具有意义，这一输入必须和成为一极的世界和主体相关联。[^(\[47\])](#chapter004.html#m47)但是认知表征作为唯一的关联方式显然是不够的，需要行动“并驾齐驱”，人类认知产生的一个重要结果就是主体在以表征为核心的认知机制的引导之下采取的理性行动，也就是社会的生活、生产实践。


    在奈瑟尔看来，海德格尔对“此在”的生存论分析并不否定人具有内在的心理表征，并不否认行动背后存在的某种机制，也就是说，对认知而言重要的东西必定是存在于头脑中的，认知在本质上依然是颅内的（intracranial）。[^(\[48\])](#chapter004.html#m48)从这种意义上说，心智成为一个在本体论意义上独立的领域，心智的符号内容与身体过程之间似乎必须存在某种转换，从笛卡尔所谓的松果体到现代科学的传感器，都充当了转换器的角色——将物理存在与心理存在相耦合。如果任何形式的身体过程和外部世界的刺激都必须转换为某种形式的符号或心理表征，那么智能主体则是在对内部表征作出反应，而不是对环境或世界作出反应，人与世界本身的联系也会因此被单薄化。换言之，正是智能主体的行动丰富了他和世界之间的关联，认知与行动都是人与世界交互的必要方式，不存在一方取代另一方，认知不是存在于大脑中的独立闭环，它本身是附着于行动之上的。深思熟虑、反思性思考和想象等更高阶的认知，也是与熟练技能的操作以及与环境打交道的涉身性行动紧密结合的。[^(\[49\])](#chapter004.html#m49)


    ### 二 认知是行动与表征的叠加耦合


    表征与行动，究竟哪一个是存在论认知的核心概念？在这一问题上，德雷福斯与惠勒产生了分歧：前者认为惠勒保留了表征使人产生一种怀疑，即他所谓的行动导向的表征（action-oriented
    representation）是否仍然是以海德格尔哲学为导引，抑或只是贴着海德格尔哲学的标签来为表征进行某种辩护。在德雷福斯眼中，惠勒的行动导向表征假设实质上是向旧有认知科学的复归，不放弃表征的做法说明他对海德格尔作了认知主义的误读。行动导向的表征这一概念本身就是一个矛盾体：在线的行动根本不是表征性的，表征是以离线的方式呈现出来，非上手活动的全部形式都衍生于上手性的行动。我们认为，德雷福斯的根本想法是构造一个能够给予行动以基础性地位的动态模型，真正的海德格尔式认知科学不在表征与行动两个选项中间做非此即彼的选择，它始终遵循着海德格尔的观点。在我们看来，海德格尔是想将认知表征从作为人与世界关联的基础性方式当中剥离出来，但他本人不会拒绝主体或自我通过表征来关联世界的旧有观念，心智并非塑造我们的最基本之物。我们不是嵌入世界的孤立心智本身，而是在具身的行动中裹挟着世界，这样看来内在与外在之间的区分就显得多余了，克拉克与查尔莫斯主张的认知的延展性也便无从谈起，“延展心智的外在论是不自然、微不足道、无关紧要的观点”。[^(\[50\])](#chapter004.html#m50)


    相反，惠勒认为，德雷福斯对人工智能和人工理性的批判依旧停留在形而上学层面，并没有为如何摆脱传统的笛卡尔式认知进路提供具体的解决方案，而海德格尔在认知科学中的理论立场需要得到经验层面的辩护。因此，惠勒致力于证明以海德格尔哲学为思想基础的认知理论在经验层面的可能性，同时试图将海德格尔现象学的洞察力纳入表征框架。[^(\[51\])](#chapter004.html#m51)康德将人视为“一种有限的理性存在”，人之为人就在于“理性”，而惠勒的判断似乎是“人是认知性的”，因此人的本质要在认知当中寻找。他将表征和行动看作认知科学描述自然智能的两种相互竞争的观点：前者表明智能主体是感知推理和通用推理的核心，它意识到自身是非情境化的主体，并同一个由独立于自身的客体所构成的世界相对立，智能行为在内部表征的过程中产生。[^(\[52\])](#chapter004.html#m52)然而，这种观点却忽略了认知本身丰富的时间性和动态性，环境与身体的作用被模糊化、边缘化了：人们认为身体只是心智与认知发生的容器，并且仅关注环境给予的信息和感觉刺激的维度，行动（行为）仅被设想为一种动作输出。相较而言，从这种意义上谈及的行动是被动的，不具有主动的意味，我们在这里谈论的行动是实时的、适应性的，不是简单的指令输入与行为输出。


    从某种意义上说，德雷福斯依旧是在追随海德格尔，将认知看作人类存在的衍生形式。海德格尔在向人们阐明此在在世界中的存在方式时总会强调，世界不仅是具有实体性、物质性和延展性特征的对象所构成的一个复杂的统一体，而且是一个意义网络，我们生活于其中且被我们所感知的世界，已被功能的实践标识浸没了。[^(\[53\])](#chapter004.html#m53)人们需要区分两个世界：传统的作为对象之总体的“世界”，以及作为有序的用具和实践的世界。[^(\[54\])](#chapter004.html#m54)“此在”身处于实践的世界当中，并依据实践来规定自身，实践也因此成为自我的存在方式。正因为有了实践的应对方式，不论是现成状态还是上手状态，[^(\[55\])](#chapter004.html#m55)都为人们对实体展开理论上的探索提供了可能性。人们先使用工具，当工具运转失灵时才将注意力转向它，观察其自身具有的诸多属性。在我们看来，这种未上手状态为表征留了地盘，流畅应对活动固然包含了没有主体与对象的意识状态，它只关注手头进行的任务，只有对任务本身的体验（我们在专心打字时，可能完全不会注意到键盘与手指之间的触觉以及周围的情况）。然而，它只是暂时性地消除了主体与对象之间的认知间距（cognitive
    distance），人的理论推理能力隐匿了。当流畅的上手活动结束后，主客二分便显现出来，表征成为人与世界之间的勾连的主要途径。对人而言，行动与表征构成了主体与被揭示世界的两种联系，对于海德格尔和德雷福斯来说，表征是作为实践行动的修正（modification）而存在的。


    此外，从海德格尔对“此在”的基本规定中我们也看到了他对行动的重视，他对于人之生存的最基本规定为：人或者“此在”不是一种现成者，生存也不能被理解为现成存在或者现成性。[^(\[56\])](#chapter004.html#m56)“此在”的本质是生存，不是实存，生存展现的不是对实在性的追求，而是一种“去存在”和“在起来”的姿态或态势，人（“此在”）在生存的过程中不断揭示自身，完成自身。海德格尔反对静态地观察“此在”，把“此在”当作标本一样进行剖析，规定“此在”的不是物的属性，而是“此在”的可能方式。这就造成对人的提问方式的变化，假如我们向海德格尔发问“人是什么”，他可能会回答“人是‘此在’”，如果问“‘此在’是什么”，他会说你的提问方式有误，应该问“‘此在’是谁”。“‘此在’是什么”的提问方式预设了“此在”是像物一样的实体或现成存在，抹掉了其自身具有的可能性，“此在”的存在方式也就被固化了。人不能首先被视为一种物，然后再通过某种特殊的属性（理性、思维、自由等）与其他的种类的物区别开来。[^(\[57\])](#chapter004.html#m57)人不是先在地具有了这些具体的本质，然后通过内省、反思等方式揭示出来并加以把握，而要从他生存的可能朝向，即“向……存在”的角度去考量。“此在”的“本质”在于他的生存，[^(\[58\])](#chapter004.html#m58)生存于世界之中，便必定要与自身以及其他存在者打交道。海德格尔没有将“此在”生存的“任务”交付于认知、思维和意识，他认为“此在”“在世存在”的本质是操心，其中包含着操劳，后者消散于人的日常存在方式之中，包括“和某种东西打交道，制做某种东西，安排照顾某种东西，利用某种东西，放弃或浪费某种东西”[^(\[59\])](#chapter004.html#m59)等活动，“此在”透过上手的操劳达到对其他存在者了如指掌的理解和认识。


    从不严格的意义上讲，操劳作为“此在”依寓世界的方式意味着实践行动，是“此在”意向地同世界中其他事物交互的方式，“生存就是实践，它包含“此在”与自身、与他物以及他人打交道这三个方面”。[^(\[60\])](#chapter004.html#m60)海德格尔并不否认，也未尝试取消主客之间的认知关系，他也没有否认人的全部意向活动所具有的表征性，尤其是与熟悉事物日常打交道的活动，而是在强调实践行动与认知之间孰更原初的问题。他认为，“此在”与世界的源始关系不是出于认知这一存在样式而得到规定的，以往把认知活动归于主体（人）的做法恰巧表明：“对世界的认知是此在的一种存在方式，以至于在实存状态上，认识这一存在方式就植根于此在的根本枢机之中，即植根于‘在-世界-中-存在’之中。”[^(\[61\])](#chapter004.html#m61)“此在”日常是以行动者（agent）的姿态在世的，作为实践主体和其他存在者以及自身打交道，海德格尔是要让人们明白，只有聚焦于原初的现象（在我们看来就是日常的上手操劳）才能把捉一切由“此在”的存在所生发的问题。


    在海德格尔看来，认知表征就是以让表征对象得到保藏的方式趋向被表征的事物，这一认知进程应基于“此在”“去存在”的特征加以理解，主体不是某种获得诸多表象的心理存在物。相反，它素来是以“欠缺”或“完整”的实践行动和世界内的其他存在者产生关系的，“此在”应当被看作一个实践和行动主体，它和与之照面的事物之间的表征关系不是终极性的，是建立在“此在”在世存在的基础上。“此在”借助操劳依于其他事物，而操劳是“此在”和其他存在者之间基本的存在关系，“此在”在世的存在状况促使它先行投入与存在者打交道的过程中去，先行操劳起来。这样便回到了“此在”同其他存在者/事物照面的原初方式，虽然我们不能对操劳作实用主义的解释，也就是看作具体的行为类型和行动模式，但仍可视其为实践性的。


    总之，对于“此在”而言，最有可能切近事物的不是理论观照和表征，事物不是通过表征被“此在”“看见”，或者说“此在”看到的是事物的功能和属性，也就是海德格尔所指的存在者状况。事物向“此在”呈现的意义是在日常的实践行动中显现出来的，换言之，“此在”与事物最为本己的触碰是一种行动的相遇、上手的相遇，而非觉知的相遇、反思的相遇。在很多情况下，人的当下行动都是下意识、直觉性的，并不总是伴随着审慎的熟思。但我们也不能据此完全将表征排除在外，“此在”的日常行动总是包纳着知觉、意志和情感倾向，即便是熟练、语境敏感的意向行动也涉及最低程度的表征觉知，也就是关于某一存在者的意识。行动与表征之间不是相互取代的关系，对于人而言，具有表征能力是重要的，但表征的有效性需要行动的及时反馈，人类之于世界的适应性特征决定了由认知表征向认知行动的功能延伸，这在某种程度上也迎合了海德格尔关于“此在”与世界之间是一种实践性的生存关系的论断。


    ## 小结


    在这一章，我们提炼并总结出了将海德格尔的存在论现象学与认知科学具体结合的三个主要命题：（1）以动态的原初上手活动取代静态的静观认知，（2）以具身的情境性认知取代无身的离身性认知，（3）由表征性认知向将行动与表征叠加耦合扩展与延伸。首先，我们分析了海德格尔关于“此在”上手操劳的讨论，从某种意义上说，他确实为人们指出了一条新的掌握世界的原初方式，我们也认为这种上手活动有可能重塑我们对自身知觉与行动的理解，人与事物（工具）之间的实践互动成为认知的奠基之石。然而，这一命题在遇到延展实践这一新的实践形式时却遭遇了一定挑战，严格地说，以原初的上手状态作为人类认知生成的起点，海德格尔的这一论断仍有待商榷。其次，海德格尔最明确的立场是指出认知主体具有一种基础的情境性，他坚定地反对笛卡尔倡导的“无身认知”模式，相较于笛卡尔，海德格尔给予认知主体以新的要素，即一种情境性的构成。“此在”“在世界中存在”的生存结构使得我们最具理论性、最审慎的沉思都是基于情境的活动，在某种意义上，“在世存在”其实就是一种情境化的认知形式，抛离了身体而成为一种思维实体或存在的无身心智并不符合人类真实的存在境况。另外，海德格尔关于“共在”是“此在”之生存论结构的思想给予了我们启示，此即在日常的情境中如何认识同为“此在”的他人。在他看来，“在世存在”已经包括了“共在”，情境性的存在已经包括了与他人的情境性存在，[^(\[62\])](#chapter004.html#m62)海德格尔以他特有的方式回避甚至消解了“他心问题”。同时我们认为，海德格尔哲学语境下的“情境”不是具有单薄内容的概念，而是具有多维度和多层次性，在不同的观察条件下，主体面前呈现的是不同的认知世界，并在其间不断地迁移和转换。最后，海德格尔所描述的这种流畅、上手的应对活动虽然不能被基于表征或推理的模型/机制解释，也就是不能被理解为一种纯粹的推理过程，但我们认为存在论认知也并不完全排斥关于认知的表征理解，相反，人类智能需要一种面向行动以及受行动导引的表征。所以，我们没有提出行动导向认知“取代”了表征性认知，而是将行动看作智能主体功能的扩展和延伸，人类认知是行动与表征能力的叠加耦合。


    * * *


    [\[1\]](#chapter004.html#w1) 〔美〕R.M.哈尼什：《心智、大脑与计算机：认知科学创立史导论》，王淼、李鹏鑫译，浙江大学出版社，2010，第171页。


    [\[2\]](#chapter004.html#w2) 刘晓力、孟伟：《认知科学前沿中的哲学问题》，金城出版社，2014，第116页。


    [\[3\]](#chapter004.html#w3) 韩连庆：《哲学与科学的短路——德雷福斯人工智能的批判》，《哲学分析》2017年第6期。'
  fmt: '

    虽然各种认知理论和假设在关于认知过程的本质问题上争论不断，但一个共同的预设是：认知与行动不同。这里提到的认知，我们将之界定为包括记忆、推理和判断等形式在内的心智活动，是主体与对象的动态联结，行动是具有复合结构的概念，包括物理性的具身运动和心理性的目标和意向状态，并排除掉那些无意识的身体动作，比如条件反射等单纯的物理运动，以及由意志、情感等非理性因素驱动而产生的行为。不论是认知主义，还是具身和情境认知，它们都在坚持传统的观点，把认知与行动区分开来，认知作为一种信息处理过程，不是行动包括的子集，相反，它是产生行动的内因。根据认知计算主义的观点，人类认知是将来自世界的某种形式输入编码为内在的符号，并在这些内部符号之间进行操作和计算，如果计算过于复杂，则会产生符号的行动操作，比如拿计算器或纸笔手动进行计算。在埃扎瓦看来，即便是延展认知也依然蕴含着认知是行动之因的立场，在著名的英伽-奥托思想实验中，克拉克和查尔默斯并没有摆脱关于认知与行动的旧有观念，奥托笔记本内记录的信息和英伽大脑中的记忆都是两人前往艺术博物馆这一行动的因果相关要素。[^(\[43\])](#chapter004.html#m43)他的看法是，不论认知在形式上是延展还是生成的，也不管它的本质是否为一种计算，只要认知过程与行动表现为一种前后相继的关系，那么认知与行动就属于完全不同的范畴，这与认知科学的正统观点并不冲突，思维和认知过程在脑内，而任务的执行和完成（行动）在脑外。当然，也有不同的观点。认知实用主义持有的立场是：认知不应被理解为有机体被动地获得世界模型并加以表征的能力或过程，而应是在环境中通过行动生成世界的过程，有机体在世界中有效的具身行动实际上构成其知觉，并进而成为认知的根基。[^(\[44\])](#chapter004.html#m44)可以说，认知先于行动体现的是基于认知的行动观，行动先于认知则体现的是基于行动的认知观。除此之外，有的观点将认知与行动等同起来，转向了极端的行动主义，把认知视为行动，主张人的认知过程通过密切协调的感知和行动加以实现，激进的具身认知甚至将认知解释为大脑—身体—环境系统的行动展开。


    对于将认知等同于行动的观点，有些实验能够给予有力的回击，如神经肌肉阻滞和闭锁综合征（locked-in syndrome）。前者表明身体的瘫痪程度并不影响主体的认知活动，模式化的行动表现与自由的认知相互分离；后者表明人在失去对身体控制的情况下（如大脑内部受到了损伤）仍可以进行认知加工。因此这些实验证明了认知就是行动这一假设是有问题的，至少对其进行了强烈的挑战。可以说，认知不应该被理解为一种行动，至少二者不能完全等同。如果这一假设是正确、必要的，那么认知与行动的关联是什么？谁更具优先性？若我们把行动定义为认知过程的物理实现，那么从逻辑上来说，行动是认知之后的，受到属于认知范畴的目标和预期的驱动，“是需要由认知过程或知识来解释的经验现象”，[^(\[45\])](#chapter004.html#m45)因而，行动的意向性与认知体现出的意向性可能是一致的，也就是说，行动是认知意向的现实化和实践化。


    认知主义的观点是，关于同我们互动的现成之物，即便我们不可能具有关于它们的清晰表征，但是心智的认知机制伴随始终。在熟练操用器具的过程中，我们必定先构造了关于器具的某一表征模型，因为只有预先了解了工具的属性与功能才能更加流畅地使用它。因此，表征在人与世界的交互中占据着主导地位，交互离不开以表征为核心的认知机制的参与，认知实质上体现为表征—世界—行动的结构，需要借助心智内在的认知机制作为中介加以实现，行动则是这一机制的输出结果。从这种意义上说，“瞠目”式的表征似乎是行动展开的前提，一般而言，人们不太可能不假思索地使用工具，先“知”后“行”似乎才是更加普遍的模式。所谓“知”是对器具等其他存在者之样式和属性的认知和纯粹察看，“行”是基于情境对器具的上手操用。主体熟练、具身的行动在一定程度上决定了他所持有的信念，我关于“桌子”的认知表征同我围绕桌子产生的活动相关，比如在桌子上写字、阅读等，而这种技能活动是非形式、非表征的，并总是处于特定的情境中。正如德雷福斯所言，一件用具依据人们用它来干什么而得到界定，[^(\[46\])](#chapter004.html#m46)沉浸的（absorbed）意向性总是先于表征的意向性。以椅子为例，我们都知道椅子具有“坐”的功能与属性，本质上正是“坐”这一行动使我们将它作为一把椅子而分辨出来，而非通过形状、材料等物理描述确定椅子的表象。对于人而言，椅子的类型并不重要，只要某一物体能够同人坐下的行动相契合，我们就可以认为它是椅子，或者至少具有了椅子的功能和效用。


    我们认为，强调行动之于主体认知活动的重要作用，其目的不是取消表征（即便是旗帜鲜明地反对表征主义的动力理论，也在一定程度上为表征留有地盘），更不是重新回到斯金纳和华生主张的行为主义立场。奈瑟尔指出，作为“后笛卡尔主体”概念，“此在”不是将思维与行动或行动的生成机制相等同的操作主义，而是对主体性自身的意义根基的认识。为了保证输入心智信息具有意义，这一输入必须和成为一极的世界和主体相关联。[^(\[47\])](#chapter004.html#m47)但是认知表征作为唯一的关联方式显然是不够的，需要行动“并驾齐驱”，人类认知产生的一个重要结果就是主体在以表征为核心的认知机制的引导之下采取的理性行动，也就是社会的生活、生产实践。


    在奈瑟尔看来，海德格尔对“此在”的生存论分析并不否定人具有内在的心理表征，并不否认行动背后存在的某种机制，也就是说，对认知而言重要的东西必定是存在于头脑中的，认知在本质上依然是颅内的（intracranial）。[^(\[48\])](#chapter004.html#m48)从这种意义上说，心智成为一个在本体论意义上独立的领域，心智的符号内容与身体过程之间似乎必须存在某种转换，从笛卡尔所谓的松果体到现代科学的传感器，都充当了转换器的角色——将物理存在与心理存在相耦合。如果任何形式的身体过程和外部世界的刺激都必须转换为某种形式的符号或心理表征，那么智能主体则是在对内部表征作出反应，而不是对环境或世界作出反应，人与世界本身的联系也会因此被单薄化。换言之，正是智能主体的行动丰富了他和世界之间的关联，认知与行动都是人与世界交互的必要方式，不存在一方取代另一方，认知不是存在于大脑中的独立闭环，它本身是附着于行动之上的。深思熟虑、反思性思考和想象等更高阶的认知，也是与熟练技能的操作以及与环境打交道的涉身性行动紧密结合的。[^(\[49\])](#chapter004.html#m49)


    ## 二 认知是行动与表征的叠加耦合


    表征与行动，究竟哪一个是存在论认知的核心概念？在这一问题上，德雷福斯与惠勒产生了分歧：前者认为惠勒保留了表征使人产生一种怀疑，即他所谓的行动导向的表征（action-oriented
    representation）是否仍然是以海德格尔哲学为导引，抑或只是贴着海德格尔哲学的标签来为表征进行某种辩护。在德雷福斯眼中，惠勒的行动导向表征假设实质上是向旧有认知科学的复归，不放弃表征的做法说明他对海德格尔作了认知主义的误读。行动导向的表征这一概念本身就是一个矛盾体：在线的行动根本不是表征性的，表征是以离线的方式呈现出来，非上手活动的全部形式都衍生于上手性的行动。我们认为，德雷福斯的根本想法是构造一个能够给予行动以基础性地位的动态模型，真正的海德格尔式认知科学不在表征与行动两个选项中间做非此即彼的选择，它始终遵循着海德格尔的观点。在我们看来，海德格尔是想将认知表征从作为人与世界关联的基础性方式当中剥离出来，但他本人不会拒绝主体或自我通过表征来关联世界的旧有观念，心智并非塑造我们的最基本之物。我们不是嵌入世界的孤立心智本身，而是在具身的行动中裹挟着世界，这样看来内在与外在之间的区分就显得多余了，克拉克与查尔莫斯主张的认知的延展性也便无从谈起，“延展心智的外在论是不自然、微不足道、无关紧要的观点”。[^(\[50\])](#chapter004.html#m50)


    相反，惠勒认为，德雷福斯对人工智能和人工理性的批判依旧停留在形而上学层面，并没有为如何摆脱传统的笛卡尔式认知进路提供具体的解决方案，而海德格尔在认知科学中的理论立场需要得到经验层面的辩护。因此，惠勒致力于证明以海德格尔哲学为思想基础的认知理论在经验层面的可能性，同时试图将海德格尔现象学的洞察力纳入表征框架。[^(\[51\])](#chapter004.html#m51)康德将人视为“一种有限的理性存在”，人之为人就在于“理性”，而惠勒的判断似乎是“人是认知性的”，因此人的本质要在认知当中寻找。他将表征和行动看作认知科学描述自然智能的两种相互竞争的观点：前者表明智能主体是感知推理和通用推理的核心，它意识到自身是非情境化的主体，并同一个由独立于自身的客体所构成的世界相对立，智能行为在内部表征的过程中产生。[^(\[52\])](#chapter004.html#m52)然而，这种观点却忽略了认知本身丰富的时间性和动态性，环境与身体的作用被模糊化、边缘化了：人们认为身体只是心智与认知发生的容器，并且仅关注环境给予的信息和感觉刺激的维度，行动（行为）仅被设想为一种动作输出。相较而言，从这种意义上谈及的行动是被动的，不具有主动的意味，我们在这里谈论的行动是实时的、适应性的，不是简单的指令输入与行为输出。


    从某种意义上说，德雷福斯依旧是在追随海德格尔，将认知看作人类存在的衍生形式。海德格尔在向人们阐明此在在世界中的存在方式时总会强调，世界不仅是具有实体性、物质性和延展性特征的对象所构成的一个复杂的统一体，而且是一个意义网络，我们生活于其中且被我们所感知的世界，已被功能的实践标识浸没了。[^(\[53\])](#chapter004.html#m53)人们需要区分两个世界：传统的作为对象之总体的“世界”，以及作为有序的用具和实践的世界。[^(\[54\])](#chapter004.html#m54)“此在”身处于实践的世界当中，并依据实践来规定自身，实践也因此成为自我的存在方式。正因为有了实践的应对方式，不论是现成状态还是上手状态，[^(\[55\])](#chapter004.html#m55)都为人们对实体展开理论上的探索提供了可能性。人们先使用工具，当工具运转失灵时才将注意力转向它，观察其自身具有的诸多属性。在我们看来，这种未上手状态为表征留了地盘，流畅应对活动固然包含了没有主体与对象的意识状态，它只关注手头进行的任务，只有对任务本身的体验（我们在专心打字时，可能完全不会注意到键盘与手指之间的触觉以及周围的情况）。然而，它只是暂时性地消除了主体与对象之间的认知间距（cognitive
    distance），人的理论推理能力隐匿了。当流畅的上手活动结束后，主客二分便显现出来，表征成为人与世界之间的勾连的主要途径。对人而言，行动与表征构成了主体与被揭示世界的两种联系，对于海德格尔和德雷福斯来说，表征是作为实践行动的修正（modification）而存在的。


    此外，从海德格尔对“此在”的基本规定中我们也看到了他对行动的重视，他对于人之生存的最基本规定为：人或者“此在”不是一种现成者，生存也不能被理解为现成存在或者现成性。[^(\[56\])](#chapter004.html#m56)“此在”的本质是生存，不是实存，生存展现的不是对实在性的追求，而是一种“去存在”和“在起来”的姿态或态势，人（“此在”）在生存的过程中不断揭示自身，完成自身。海德格尔反对静态地观察“此在”，把“此在”当作标本一样进行剖析，规定“此在”的不是物的属性，而是“此在”的可能方式。这就造成对人的提问方式的变化，假如我们向海德格尔发问“人是什么”，他可能会回答“人是‘此在’”，如果问“‘此在’是什么”，他会说你的提问方式有误，应该问“‘此在’是谁”。“‘此在’是什么”的提问方式预设了“此在”是像物一样的实体或现成存在，抹掉了其自身具有的可能性，“此在”的存在方式也就被固化了。人不能首先被视为一种物，然后再通过某种特殊的属性（理性、思维、自由等）与其他的种类的物区别开来。[^(\[57\])](#chapter004.html#m57)人不是先在地具有了这些具体的本质，然后通过内省、反思等方式揭示出来并加以把握，而要从他生存的可能朝向，即“向……存在”的角度去考量。“此在”的“本质”在于他的生存，[^(\[58\])](#chapter004.html#m58)生存于世界之中，便必定要与自身以及其他存在者打交道。海德格尔没有将“此在”生存的“任务”交付于认知、思维和意识，他认为“此在”“在世存在”的本质是操心，其中包含着操劳，后者消散于人的日常存在方式之中，包括“和某种东西打交道，制做某种东西，安排照顾某种东西，利用某种东西，放弃或浪费某种东西”[^(\[59\])](#chapter004.html#m59)等活动，“此在”透过上手的操劳达到对其他存在者了如指掌的理解和认识。


    从不严格的意义上讲，操劳作为“此在”依寓世界的方式意味着实践行动，是“此在”意向地同世界中其他事物交互的方式，“生存就是实践，它包含“此在”与自身、与他物以及他人打交道这三个方面”。[^(\[60\])](#chapter004.html#m60)海德格尔并不否认，也未尝试取消主客之间的认知关系，他也没有否认人的全部意向活动所具有的表征性，尤其是与熟悉事物日常打交道的活动，而是在强调实践行动与认知之间孰更原初的问题。他认为，“此在”与世界的源始关系不是出于认知这一存在样式而得到规定的，以往把认知活动归于主体（人）的做法恰巧表明：“对世界的认知是此在的一种存在方式，以至于在实存状态上，认识这一存在方式就植根于此在的根本枢机之中，即植根于‘在-世界-中-存在’之中。”[^(\[61\])](#chapter004.html#m61)“此在”日常是以行动者（agent）的姿态在世的，作为实践主体和其他存在者以及自身打交道，海德格尔是要让人们明白，只有聚焦于原初的现象（在我们看来就是日常的上手操劳）才能把捉一切由“此在”的存在所生发的问题。


    在海德格尔看来，认知表征就是以让表征对象得到保藏的方式趋向被表征的事物，这一认知进程应基于“此在”“去存在”的特征加以理解，主体不是某种获得诸多表象的心理存在物。相反，它素来是以“欠缺”或“完整”的实践行动和世界内的其他存在者产生关系的，“此在”应当被看作一个实践和行动主体，它和与之照面的事物之间的表征关系不是终极性的，是建立在“此在”在世存在的基础上。“此在”借助操劳依于其他事物，而操劳是“此在”和其他存在者之间基本的存在关系，“此在”在世的存在状况促使它先行投入与存在者打交道的过程中去，先行操劳起来。这样便回到了“此在”同其他存在者/事物照面的原初方式，虽然我们不能对操劳作实用主义的解释，也就是看作具体的行为类型和行动模式，但仍可视其为实践性的。


    总之，对于“此在”而言，最有可能切近事物的不是理论观照和表征，事物不是通过表征被“此在”“看见”，或者说“此在”看到的是事物的功能和属性，也就是海德格尔所指的存在者状况。事物向“此在”呈现的意义是在日常的实践行动中显现出来的，换言之，“此在”与事物最为本己的触碰是一种行动的相遇、上手的相遇，而非觉知的相遇、反思的相遇。在很多情况下，人的当下行动都是下意识、直觉性的，并不总是伴随着审慎的熟思。但我们也不能据此完全将表征排除在外，“此在”的日常行动总是包纳着知觉、意志和情感倾向，即便是熟练、语境敏感的意向行动也涉及最低程度的表征觉知，也就是关于某一存在者的意识。行动与表征之间不是相互取代的关系，对于人而言，具有表征能力是重要的，但表征的有效性需要行动的及时反馈，人类之于世界的适应性特征决定了由认知表征向认知行动的功能延伸，这在某种程度上也迎合了海德格尔关于“此在”与世界之间是一种实践性的生存关系的论断。


    ## 小结


    在这一章，我们提炼并总结出了将海德格尔的存在论现象学与认知科学具体结合的三个主要命题：（1）以动态的原初上手活动取代静态的静观认知，（2）以具身的情境性认知取代无身的离身性认知，（3）由表征性认知向将行动与表征叠加耦合扩展与延伸。首先，我们分析了海德格尔关于“此在”上手操劳的讨论，从某种意义上说，他确实为人们指出了一条新的掌握世界的原初方式，我们也认为这种上手活动有可能重塑我们对自身知觉与行动的理解，人与事物（工具）之间的实践互动成为认知的奠基之石。然而，这一命题在遇到延展实践这一新的实践形式时却遭遇了一定挑战，严格地说，以原初的上手状态作为人类认知生成的起点，海德格尔的这一论断仍有待商榷。其次，海德格尔最明确的立场是指出认知主体具有一种基础的情境性，他坚定地反对笛卡尔倡导的“无身认知”模式，相较于笛卡尔，海德格尔给予认知主体以新的要素，即一种情境性的构成。“此在”“在世界中存在”的生存结构使得我们最具理论性、最审慎的沉思都是基于情境的活动，在某种意义上，“在世存在”其实就是一种情境化的认知形式，抛离了身体而成为一种思维实体或存在的无身心智并不符合人类真实的存在境况。另外，海德格尔关于“共在”是“此在”之生存论结构的思想给予了我们启示，此即在日常的情境中如何认识同为“此在”的他人。在他看来，“在世存在”已经包括了“共在”，情境性的存在已经包括了与他人的情境性存在，[^(\[62\])](#chapter004.html#m62)海德格尔以他特有的方式回避甚至消解了“他心问题”。同时我们认为，海德格尔哲学语境下的“情境”不是具有单薄内容的概念，而是具有多维度和多层次性，在不同的观察条件下，主体面前呈现的是不同的认知世界，并在其间不断地迁移和转换。最后，海德格尔所描述的这种流畅、上手的应对活动虽然不能被基于表征或推理的模型/机制解释，也就是不能被理解为一种纯粹的推理过程，但我们认为存在论认知也并不完全排斥关于认知的表征理解，相反，人类智能需要一种面向行动以及受行动导引的表征。所以，我们没有提出行动导向认知“取代”了表征性认知，而是将行动看作智能主体功能的扩展和延伸，人类认知是行动与表征能力的叠加耦合。


    * * *


    [\[1\]] 〔美〕R.M.哈尼什：《心智、大脑与计算机：认知科学创立史导论》，王淼、李鹏鑫译，浙江大学出版社，2010，第171页。


    [\[2\]] 刘晓力、孟伟：《认知科学前沿中的哲学问题》，金城出版社，2014，第116页。


    [\[3\]] 韩连庆：《哲学与科学的短路——德雷福斯人工智能的批判》，《哲学分析》2017年第6期。

