- raw: '纵观整个哲学史，似乎没有哪一位哲学家能够比维特根斯坦更富有传奇色彩了，他经历了从前期的“语言图像论”到后期“日常语言哲学”的颠覆性转变，甚至完全推翻了自己前期的哲学体系。作为逻辑经验主义的代表，前期的维特根斯坦极力推崇逻辑化的语言，使用逻辑分析的研究方式，将语言看作描述世界和事实的逻辑图像，这里所讲的语言是指由哲学家和逻辑学家构造的、具有精确性的、理想化的逻辑语言，而不是人们日常使用的语言形式。然而，后期的维特根斯坦批判和放弃了自己早先追捧的逻辑原子主义，后者主张通过对命题的逻辑分析就可以揭示出世界的逻辑结构。与之相反，他认为命题和世界不存在这样的逻辑结构，命题的逻辑形式只是语言的语法结构，而语法是动态、鲜活的，语词和句子的意义要根据其在不同语境中的使用加以确定。因而不存在所谓“客观的意义”，我们想要了解的其实是一个词或句子在不同语言环境中的不同用法，[^(\[53\])](#chapter002.html#m53)维特根斯坦的“用法”概念旨在强调说出或写出某个词或句子的特定情境或环境，而“用法”本身则是这个词或句子在其中起作用的语言游戏。[^(\[54\])](#chapter002.html#m54)这样，维特根斯坦就从对语句命题进行的孤立、内在的逻辑分析转向了在交互、外在的环境和情境中的语言使用，从而转向了某种外在主义立场，他通过对“语言游戏”的描述和对“私人语言”的反驳论证突出了实践交往和情境的重要性。


    根据维特根斯坦的描述，我们对语言的使用类似于参与具有某种具体规则的游戏活动，使用语言和儿童、成人所玩的各种游戏非常相似，可以说，使用语言就是在进行某种游戏。因此，语言的意义只有在交流的语境中才能生成，语言只有“流动”起来方才具有生命力，语言不属于个人，而具有情境性、社会性的特征。在维特根斯坦看来，语言游戏就是人生活的构成部分，人们日常就是在进行各种各样的语言游戏活动。在此基础上他进一步讨论了语言游戏的规则问题，主张不能对规则进行逻辑分析，我们应该在游戏的参与过程中予以观察和体会，否则就会造成遵守规则的悖论，因为不存在普遍意义上的规则，规则由游戏产生，也应该在游戏中得到遵守和解释。孤立地谈论遵守规则必然会产生哲学的错误，[^(\[55\])](#chapter002.html#m55)因而规则亦具有情境性的特征。在此基础上，维特根斯坦对“私人语言”进行了反驳，认为根本不存在无法交流的语言，个体心智内在地生成的心理语言不能对具体的情形予以明确的概括，它如同人的指纹一样只与个人特定的心理状态相联系，具有不可通约性。从这种意义上说，维特根斯坦是基于语言的交流和理解来进行反驳论证的，而交流和理解自然离不开语境，情境可看作广义的语境，语言活动也可看作人在情境中的实践和交互活动，所以在他看来，认知不是一种由全知心智紧密组织起来的命题式知识，而是一种依赖于常识知识和情境化特定知识的技巧和实践的集合。[^(\[56\])](#chapter002.html#m56)我们认为，维特根斯坦对逻辑原子主义所谓理想语言的批判和攻击似乎显现出认知主义范式的符号化、形式化进路的某种缺陷，他对于语言使用的情境、交流和理解的重视与前面提到的杜威的主张有诸多相似，正如加拉格尔所言，维特根斯坦为理解认知的情境本质提供了深厚的思想资源。


    综上所述，通过分析和追溯第二代认知科学的哲学来源，我们看到现象学、杜威的经验自然主义以及维特根斯坦的日常语言哲学为新的认知科学进路提供了丰富的思想资源和观念启示，不只如加拉格尔所言仅是作为情境认知的哲学先驱，其他认知进路诸如具身认知、生成认知等理论观点也都受到了他们的影响，重视和依赖身体与情境的作用成了“4E+S”认知理论的共同诉求。


    ### 二 对“4E+S”认知模型的考察与分析


    针对认知主义、联结主义日益暴露的缺陷和困境，第二代认知科学研究纲领对之展开了反思与批判，主要针对两个问题：①人类认知的本质是什么？②人类认知的空间定位是什么，即认知在何处发生？我们对认知的本质和外延至今没有严格的定义和令人满意的解释，导致出现如此多的认知研究路径，“有这样一门关于认知的科学……却不知道认知的构成要素，至少这么说是很尴尬的”。[^(\[57\])](#chapter002.html#m57)关于认知的本质，各种研究纲领之间未能达成统一的意见，新的认知科学进路认为传统的笛卡尔式认知科学对认知本质的理解是错误的，至少是不全面的，认知不仅是基于规则对符号的操作和计算过程，而且涉及作为活动图式和物理结构的身体同世界的交互耦合；在认知的定位问题上，各研究进路的看法不一，众说纷纭，但无论是具身认知、延展认知、嵌入认知、生成认知还是情境认知，其共同之处在于都重视情境（世界）对人的认知过程的作用和影响，因此，沃尔特（Sven
    Walter）将4E认知都纳入情境认知的范畴当中，作为情境认知框架统摄下不同的子研究进路，他认为，认知涉及的“颅外过程”包括两个要素：一是脑外的其他身体部分；二是外在于身体的环境，即自然性和技术性的资源。根据对认知的关系维度（relational
    dimension），即因果性和构成性的区分，他提出了四种不同的情境认知假设。[^(\[58\])](#chapter002.html#m58)


    A.认知过程与身体过程相互依赖。


    B.认知过程与身体过程相互构成。


    C.认知过程与自然性或技术性的外在身体过程相互依赖。


    D.认知过程与自然性或技术性的外在身体过程相互构成。


    A和B构成了具身认知的核心主张，C表明认知是嵌入式的，D则表明认知是可延展的。下面我们分别对情境认知和4E认知进行分析并判断其是否能够整合为一，能否成为取代笛卡尔式认知科学的新范式。


    #### （一）情境认知：情境依赖不能取消认知的反向自识


    情境认知的核心预设是，智能行为是从智能体与其所处的环境的动态耦合过程中涌现出来的，而不是心智自身的产物。这种观点与传统的认知主义的内在表征主义针锋相对。信息并不是某种先验的存在，而是有机体和环境耦合的结果。我们认为情境认知具有四个特征：境遇性、交互性、动态性和即时性。事实上，这四个特征不是情境认知的产物，而是人类认识活动本身就具有的特质，由于长久以来认知科学受到笛卡尔主义二元论的影响，特别在第一代认知科学研究范式的认知主义、联结主义的计算表征的大一统形势之下，这些特征被无情地遮蔽了，尽管两种框架都取得了令人瞩目的成就，但是在自身的发展过程也暴露了许多缺陷，没有完全揭示人类认知的真正本质，因此接下来我们要将被遮蔽的特征重新开显出来。


    ##### 1.境遇性：认知的主体自适应


    情境认知的境遇性主要针对认知内在主义（internalism），该观点认为心智与认知不仅不涉及而且独立于任何外在环境，心智与认知的内容都在大脑之内。情境认知主张，认知是在有机体与世界（包括自然界与文化社会）的交互中涌现出来的一个适应性过程。由于情境在认知中的特殊地位与作用，境遇性成了情境认知理论最根本的特征。海德格尔的“在世存在”为我们指出了情境的意义，认为我们的存在方式就是一种与外部世界有着意向性关联的存在，也是最能体现人的本真状态的存在方式。他在《存在与时间》一书中也提到了“situation”一词，并将其理解为“形势”，“代表着一种发自人的生活境遇或世界的诠释学形势……世界与经验着它的人的实际生活息息相通而不可区分，因此世界（welt）就绝不只是所有存在者的集合，而意味着一个世界境域”。[^(\[59\])](#chapter002.html#m59)海德格尔将情境称为“环境”或“周遭世界（Umwelt）”，在他看来，世界是在与人、人与事物的关系的基础上对我们显现的意义整体，人对于世界是一种情境性的而非嵌入性的存在，我们不是仅仅在地理意义上被置于环境之中，相反，是一种有意义的世界构成了我们存在的一部分，情境作为我们生存的构成部分而存在。我们无法想象在没有意义的情境中进行认知活动，因此从一开始，人就是境遇性的，浸没在情境之中。


    ##### 2.交互性：认知的环境关联


    情境认知的交互性特征与认知主义孤立的认知观相对立。认知主义将人的认识活动看作基于规则对符号和信息进行的孤立计算，后来的联结主义有所进步，将认知和智能看作大量单一神经元处理信息时相互作用而涌现出的结果，是基于神经元承载信息的并行分布式处理过程，是对人的大脑处理信息过程的抽象和模拟。但从情境认知的角度看，它们都忽视了外在环境的影响和作用，认为认知行为只是大脑与心智的产物，因此仍属于孤立的内在表征主义立场。与之相比，情境认知的交互性是包括心、脑、身体在内的人与情境之间的相互映射，不单单强调身体的基础性作用，更注重其与情境的耦合过程。


    此外，认知的交互性保证了认知主体以及情境的能动性，使人在认识世界时居于一种主动地位。现象学告诉我们，更为原初、根本和现实的状况是主体与自然对象、他人之间的一种共存关系，我们作为认知主体是嵌入整个情境中的，认知活动伴随着与情境间的交互，这样便模糊了主体与世界的概念差别，消解了二元论造成的人与世界之间的对立和矛盾。加拉格尔也指出，“我们原初和通常的在世方式，就是一种实践的互动（即一种行动、介入或基于环境因素的互动），而不是心理主义的或概念式的沉思”。[^(\[60\])](#chapter002.html#m60)换句话说，认知的交互性以主体和情境的实践互动为基础，认知的结果不是心智内在的自我反省，也并非对于抽象符号的内在表征，而是认知主体与情境交互活动的结果。


    ##### 3.动态性：认知的机制呈现


    情境认知的动态性是针对传统认知研究范式的静态的内在计算—表征而言的。以往的表征—计算模型将认识活动局限于大脑内，认为认知产生于脑内的神经活动。这种符号主义进路的认识模式以笛卡尔的主—客、心—物二分对立为预设和前提，认知成为孤立的主体对客体的反映和表征。在我们看来，这种静态的认识模式与现实情况不相符，忽略了认知主体是与情境进行动态交互的存在状况。人的存在的基本结构是“在世界中存在”，人和世界的联系不是日常经验中的空间关系，人（此在）的在世意味着它与其世界处于一种浑然一体、类似于耦合的关系，作为认知主体的人和其所处的情境存在着协调和共变。海德格尔指出，“认识乃是在世的另有根基的样式，而在世之存在先要越过在操劳活动中上手的东西才能推进到对现成在手的东西的分析”。[^(\[61\])](#chapter002.html#m61)人们通过与事物发生实践性的关联，了解事物的上手状态才能揭示其本真的属性，我们可以察觉到，海德格尔试图以一种动态的认知方式去替换笛卡尔主义传统的静态认知方式。这样看来，海德格尔为我们打开了认知动态性的广阔视域，使我们意识到人类认知在最根本、最原初的意义上就是能动的，动态性是人类认知活动的本质特征之一。


    ##### 4.即时性：认知的当下耦合


    情境认知主张，人的全部认知活动不只是依赖于认知主体的自上而下、由内到外的信息处理和加工过程，也就是由人出发构造和解释关于外部世界的一切知识，它更依赖于外部环境对主体的自下而上、由外而内的刺激，并且这种刺激过程是当下的、即时的，同所处的情境是协调共变的关系，一旦变换所处的情境，那么该情境对认知主体的刺激和影响过程也发生相应的改变，我们将这种特征称为即时性。


    人类的日常活动，特别是人们的日常交流都离不开语言，都要在一定的语境下进行，并且这种语境具有当下性和直接性的特征。人们在某一确定的语境中交谈和对话，一旦对话终结，语境也自然随之消失，当变换了交谈对象，对话的语境也自动改变。在这里，我们认为语境和情境是相通的：即时的语境即情境。如果我们要理解谈话者的意图、接收最准确的信息，那么我们就有必要投入即时的语境或情境当中去，这就是为什么人们特别是新闻记者强调要获得第一手的信息和资料。在我们看来，即时、当下获得的信息是最真实可靠的（当然不排除会有虚假信息的可能性），准确程度也最高，即使是过后的回忆、推理和之前的预测、判断也要基于当下、即时的情境，所以，我们有理由认为人类认知具有即时性的特征。


    我们认为，境遇性发挥着基础性的作用，动态性与交互性都是在情境基础之上展开的，即时性则是对境遇性的进一步详细描述，也就是说，这四个特征相互依存、相辅相成，共同体现出情境认知最本质与核心的主张。这些特征不是某一种认知进路的产物，而是人类认知活动本身就具有的性质。我们认为，分析情境认知的四个特征并不是为了单纯从本体论层面对认知活动进行描述与刻画，而是为了加深人们对于情境认知的理解，认识到情境认知对于传统认知理论的必要批判和反思。心理学的研究表明，情境会强烈地作用于人的行动。通常而言，即使我们没有觉知到情境的特征或影响，情境的特征似乎也会驱动着我们的行动，但这样会产生比较消极的后果：人类主体对自己的所为几乎没有自觉的控制力，关于何所为也几乎不自知。[^(\[62\])](#chapter002.html#m62)对于情境认知这一概念框架而言，情境对人类认知与行动的影响不是单纯被动的，需要从具身性、嵌入性和生成性的角度对主体和情境的交互予以分析。当前的情境认知与具身认知科学都没有明确地回答以下关键问题：我们应当如何区分情境和情境要素（situational
    factor）？在何种意义上，对情境要素的反应不是一种消极的因果现象？为什么不同的人会对同一情境要素产生不同的反应？为什么个人的反应会随着时间的推移发生改变？人们应该如何理解他与情境要素之间的互动？这些问题仍需要情境认知理论给出明确的答案。同时，情境认知的确切含义是什么依然存在着争议，在一些观点的表述上，我们可能很难将之与具身认知区别开来，情境认知与具身认知存在着一种相似和兼容，特别是在概念和历史上相互通约。


    #### （二）具身认知：身体之于认知的因果性而非构成性


    一般而言，具身认知主要有两种含义：一是作为某种范畴术语，用于区分具身与非具身的认知过程，从而能够正确判断社会认知、语言以及意识等特定现象；二是指理解和研究全部认知的一种方式，不单指适用于某些认知现象的范畴。[^(\[63\])](#chapter002.html#m63)从这种意义上说，具身性已经成为研究人类认知的必要起点，关于身体是否参与认知已不是存有争议的论题，它成为被人们普遍接受的原则，人们的研究重心转向了认知的具身机制。具身认知是在对传统的认知主义和联结主义范式的质疑声中产生的，它批判了后者持有的离身立场，强调人的身体在认知过程中的渗透和影响，甚至将身体体验和感官知觉视为基本的认知能力，要求摒弃一种以大脑为中心的还原主义。认知是蕴含具身性、嵌入性、延展性、生成性以及生态性特征的现象。我们看到，具身认知不仅主张身体对于认知具有某种因果力，还认为身体具有之于认知的基础性和构成性作用。相较于古老的心身二元论，具身认知视域下的心身关系产生了某种反转，身体似乎成为决定认知和心智状态的因素，不再是笛卡尔眼中只具有广延属性的东西，心智的特性也随附于它，心智与身体之间的坚实壁垒被打破了。具身性不是对心理和行为现象的某些事例的假设，而是对我们研究和理解这些现象的初始假设，具身认知是作为认知科学的整体研究方案而提出的，而不是对传统认知研究范式的理论和方法论承诺的有限补充。


    在认知科学领域，针对经典认知科学的“无身性”，根据身体在认知过程中的作用，有学者将具身认知划分为朴素具身化和激进具身化两种形式，[^(\[64\])](#chapter002.html#m64)这表明，具身认知虽然在反对离身认知方面目标一致，但在如何看待身体的作用方面依然存在分歧，还算不上一个统一的范式。


    “朴素具身化”强调身体对认知的因果作用与影响，并不反对和排斥计算和表征，而是将其内涵进行了延伸和扩展。在以往信息加工的单一基础上加入了身体的要素和内容，身体和环境的互动为人的认知提供了信息来源，三者构成了紧密的结合体。计算和表征的内容有了具身性的特征，身体的感觉和运动系统也具有了某种表征作用，高级认知过程所加工的内容接纳了身体感觉和运动信息。[^(\[65\])](#chapter002.html#m65)在某种意义上，“弱立场”的具身认知对认知表征的态度是温和、包容的，并非彻底批判这种解释策略，其实质是以身体和环境的交互为核心对计算主义框架进行一种补充和修正，典型代表是威尔逊的“宽计算主义”和克拉克的“动态计算主义”理论。结果也导致这种朴素的具身认知呈现出“严重依赖内部表征、计算转换和抽象的数据结构等特点……对身体、环境和行为的关注就仅仅是作为一种获得内部数据结构和操作权限的方法与工具”。[^(\[66\])](#chapter002.html#m66)


    如果说“弱立场”的具身认知主张身体参与认知的话，那么“强的、激进立场”的具身认知则主张身体塑造认知，后者不满足于对传统认知科学修补式的改良，要求彻底拒绝和消除计算和表征在认知科学中的影响，“认知科学中结构的、符号的、表征的和计算的观点都是错误的”。[^(\[67\])](#chapter002.html#m67)认知和心智活动是人的身体与环境互动的产物，身体的生理构造和其包含的感官系统决定了人类认知能力的范围、程度和强弱，大脑内部的神经生理特征决定了心智的形式结构，因此，强具身观之所以‘强’，在于它赋予身体在塑造心智特征方面重要地位。[^(\[68\])](#chapter002.html#m68)这表明，强立场的具身认知已然将身体视作心智和认知状态实现的关键乃至唯一的途径和载体，具身认知的强、弱立场的临界点在于表征的有用与无用。


    区别于强弱立场的对立，笔者试图在具身认知的两种立场之间保持某种张力，采取温和的理论态度。一方面，我们不同意完全否认和取消认知机制的计算与表征功能，虽然计算不可能全方位、立体式地涵盖与描述认知现象，心智活动也不能完全借助计算来理解。然而，德雷福斯却指出，计算主义根植于西方哲学中悠久的理性主义传统，作为一种抽象化思维，它以概念和规则编制而成的逻辑之网理解世界（计算不仅限于一般意义的数字运算，还包括概念、命题的操作和推理演绎）。因此，只要人们以抽象方式认知对象便无法摆脱计算的影响。同样，表征作为人与外部世界勾连的主要方式，即便在德雷福斯描述的专家阶段，主体只是不需要进行预先表征，不意味着表征不存在，我们认为它只是暂时隐入了技能背景。表征是人类认知活动的重要组分，虽然可能与感觉—运动等较低层的认知加工关联不甚紧密，但是在思维、推理和记忆等高阶的认知加工过程中却发挥着基础性的作用。


    另一方面，我们也赞同强具身认知的某些观点，即身体构造的特殊性决定心智的特殊性，[^(\[69\])](#chapter002.html#m69)比如，除非我们有能力成为一只蝙蝠，否则永远不可能具有与之相同的知觉和关于世界的经验，身体构造存在差异的生命体对世界的感知方式不同。所有生命体的知觉经验都是基于身体的构造，是具身性的。我们通常是利用身体具有的感知通路和机制来理解世界中的其他事物，比如，我们以眼睛测量远近，以手掂量、估测物体的轻重，人们也往往以躯体的某些部分作为通用的符号系统（例如在大多数文化背景下，人以点头和摇头的形式表示对某一观点的赞成与反对）。'
  fmt: '

    纵观整个哲学史，似乎没有哪一位哲学家能够比维特根斯坦更富有传奇色彩了，他经历了从前期的“语言图像论”到后期“日常语言哲学”的颠覆性转变，甚至完全推翻了自己前期的哲学体系。作为逻辑经验主义的代表，前期的维特根斯坦极力推崇逻辑化的语言，使用逻辑分析的研究方式，将语言看作描述世界和事实的逻辑图像，这里所讲的语言是指由哲学家和逻辑学家构造的、具有精确性的、理想化的逻辑语言，而不是人们日常使用的语言形式。然而，后期的维特根斯坦批判和放弃了自己早先追捧的逻辑原子主义，后者主张通过对命题的逻辑分析就可以揭示出世界的逻辑结构。与之相反，他认为命题和世界不存在这样的逻辑结构，命题的逻辑形式只是语言的语法结构，而语法是动态、鲜活的，语词和句子的意义要根据其在不同语境中的使用加以确定。因而不存在所谓“客观的意义”，我们想要了解的其实是一个词或句子在不同语言环境中的不同用法，[^(\[53\])](#chapter002.html#m53)维特根斯坦的“用法”概念旨在强调说出或写出某个词或句子的特定情境或环境，而“用法”本身则是这个词或句子在其中起作用的语言游戏。[^(\[54\])](#chapter002.html#m54)这样，维特根斯坦就从对语句命题进行的孤立、内在的逻辑分析转向了在交互、外在的环境和情境中的语言使用，从而转向了某种外在主义立场，他通过对“语言游戏”的描述和对“私人语言”的反驳论证突出了实践交往和情境的重要性。


    根据维特根斯坦的描述，我们对语言的使用类似于参与具有某种具体规则的游戏活动，使用语言和儿童、成人所玩的各种游戏非常相似，可以说，使用语言就是在进行某种游戏。因此，语言的意义只有在交流的语境中才能生成，语言只有“流动”起来方才具有生命力，语言不属于个人，而具有情境性、社会性的特征。在维特根斯坦看来，语言游戏就是人生活的构成部分，人们日常就是在进行各种各样的语言游戏活动。在此基础上他进一步讨论了语言游戏的规则问题，主张不能对规则进行逻辑分析，我们应该在游戏的参与过程中予以观察和体会，否则就会造成遵守规则的悖论，因为不存在普遍意义上的规则，规则由游戏产生，也应该在游戏中得到遵守和解释。孤立地谈论遵守规则必然会产生哲学的错误，[^(\[55\])](#chapter002.html#m55)因而规则亦具有情境性的特征。在此基础上，维特根斯坦对“私人语言”进行了反驳，认为根本不存在无法交流的语言，个体心智内在地生成的心理语言不能对具体的情形予以明确的概括，它如同人的指纹一样只与个人特定的心理状态相联系，具有不可通约性。从这种意义上说，维特根斯坦是基于语言的交流和理解来进行反驳论证的，而交流和理解自然离不开语境，情境可看作广义的语境，语言活动也可看作人在情境中的实践和交互活动，所以在他看来，认知不是一种由全知心智紧密组织起来的命题式知识，而是一种依赖于常识知识和情境化特定知识的技巧和实践的集合。[^(\[56\])](#chapter002.html#m56)我们认为，维特根斯坦对逻辑原子主义所谓理想语言的批判和攻击似乎显现出认知主义范式的符号化、形式化进路的某种缺陷，他对于语言使用的情境、交流和理解的重视与前面提到的杜威的主张有诸多相似，正如加拉格尔所言，维特根斯坦为理解认知的情境本质提供了深厚的思想资源。


    综上所述，通过分析和追溯第二代认知科学的哲学来源，我们看到现象学、杜威的经验自然主义以及维特根斯坦的日常语言哲学为新的认知科学进路提供了丰富的思想资源和观念启示，不只如加拉格尔所言仅是作为情境认知的哲学先驱，其他认知进路诸如具身认知、生成认知等理论观点也都受到了他们的影响，重视和依赖身体与情境的作用成了“4E+S”认知理论的共同诉求。


    ## 二 对“4E+S”认知模型的考察与分析


    针对认知主义、联结主义日益暴露的缺陷和困境，第二代认知科学研究纲领对之展开了反思与批判，主要针对两个问题：①人类认知的本质是什么？②人类认知的空间定位是什么，即认知在何处发生？我们对认知的本质和外延至今没有严格的定义和令人满意的解释，导致出现如此多的认知研究路径，“有这样一门关于认知的科学……却不知道认知的构成要素，至少这么说是很尴尬的”。[^(\[57\])](#chapter002.html#m57)关于认知的本质，各种研究纲领之间未能达成统一的意见，新的认知科学进路认为传统的笛卡尔式认知科学对认知本质的理解是错误的，至少是不全面的，认知不仅是基于规则对符号的操作和计算过程，而且涉及作为活动图式和物理结构的身体同世界的交互耦合；在认知的定位问题上，各研究进路的看法不一，众说纷纭，但无论是具身认知、延展认知、嵌入认知、生成认知还是情境认知，其共同之处在于都重视情境（世界）对人的认知过程的作用和影响，因此，沃尔特（Sven
    Walter）将4E认知都纳入情境认知的范畴当中，作为情境认知框架统摄下不同的子研究进路，他认为，认知涉及的“颅外过程”包括两个要素：一是脑外的其他身体部分；二是外在于身体的环境，即自然性和技术性的资源。根据对认知的关系维度（relational
    dimension），即因果性和构成性的区分，他提出了四种不同的情境认知假设。[^(\[58\])](#chapter002.html#m58)


    A.认知过程与身体过程相互依赖。


    B.认知过程与身体过程相互构成。


    C.认知过程与自然性或技术性的外在身体过程相互依赖。


    D.认知过程与自然性或技术性的外在身体过程相互构成。


    A和B构成了具身认知的核心主张，C表明认知是嵌入式的，D则表明认知是可延展的。下面我们分别对情境认知和4E认知进行分析并判断其是否能够整合为一，能否成为取代笛卡尔式认知科学的新范式。


    ### （一）情境认知：情境依赖不能取消认知的反向自识


    情境认知的核心预设是，智能行为是从智能体与其所处的环境的动态耦合过程中涌现出来的，而不是心智自身的产物。这种观点与传统的认知主义的内在表征主义针锋相对。信息并不是某种先验的存在，而是有机体和环境耦合的结果。我们认为情境认知具有四个特征：境遇性、交互性、动态性和即时性。事实上，这四个特征不是情境认知的产物，而是人类认识活动本身就具有的特质，由于长久以来认知科学受到笛卡尔主义二元论的影响，特别在第一代认知科学研究范式的认知主义、联结主义的计算表征的大一统形势之下，这些特征被无情地遮蔽了，尽管两种框架都取得了令人瞩目的成就，但是在自身的发展过程也暴露了许多缺陷，没有完全揭示人类认知的真正本质，因此接下来我们要将被遮蔽的特征重新开显出来。


    #### 1.境遇性：认知的主体自适应


    情境认知的境遇性主要针对认知内在主义（internalism），该观点认为心智与认知不仅不涉及而且独立于任何外在环境，心智与认知的内容都在大脑之内。情境认知主张，认知是在有机体与世界（包括自然界与文化社会）的交互中涌现出来的一个适应性过程。由于情境在认知中的特殊地位与作用，境遇性成了情境认知理论最根本的特征。海德格尔的“在世存在”为我们指出了情境的意义，认为我们的存在方式就是一种与外部世界有着意向性关联的存在，也是最能体现人的本真状态的存在方式。他在《存在与时间》一书中也提到了“situation”一词，并将其理解为“形势”，“代表着一种发自人的生活境遇或世界的诠释学形势……世界与经验着它的人的实际生活息息相通而不可区分，因此世界（welt）就绝不只是所有存在者的集合，而意味着一个世界境域”。[^(\[59\])](#chapter002.html#m59)海德格尔将情境称为“环境”或“周遭世界（Umwelt）”，在他看来，世界是在与人、人与事物的关系的基础上对我们显现的意义整体，人对于世界是一种情境性的而非嵌入性的存在，我们不是仅仅在地理意义上被置于环境之中，相反，是一种有意义的世界构成了我们存在的一部分，情境作为我们生存的构成部分而存在。我们无法想象在没有意义的情境中进行认知活动，因此从一开始，人就是境遇性的，浸没在情境之中。


    #### 2.交互性：认知的环境关联


    情境认知的交互性特征与认知主义孤立的认知观相对立。认知主义将人的认识活动看作基于规则对符号和信息进行的孤立计算，后来的联结主义有所进步，将认知和智能看作大量单一神经元处理信息时相互作用而涌现出的结果，是基于神经元承载信息的并行分布式处理过程，是对人的大脑处理信息过程的抽象和模拟。但从情境认知的角度看，它们都忽视了外在环境的影响和作用，认为认知行为只是大脑与心智的产物，因此仍属于孤立的内在表征主义立场。与之相比，情境认知的交互性是包括心、脑、身体在内的人与情境之间的相互映射，不单单强调身体的基础性作用，更注重其与情境的耦合过程。


    此外，认知的交互性保证了认知主体以及情境的能动性，使人在认识世界时居于一种主动地位。现象学告诉我们，更为原初、根本和现实的状况是主体与自然对象、他人之间的一种共存关系，我们作为认知主体是嵌入整个情境中的，认知活动伴随着与情境间的交互，这样便模糊了主体与世界的概念差别，消解了二元论造成的人与世界之间的对立和矛盾。加拉格尔也指出，“我们原初和通常的在世方式，就是一种实践的互动（即一种行动、介入或基于环境因素的互动），而不是心理主义的或概念式的沉思”。[^(\[60\])](#chapter002.html#m60)换句话说，认知的交互性以主体和情境的实践互动为基础，认知的结果不是心智内在的自我反省，也并非对于抽象符号的内在表征，而是认知主体与情境交互活动的结果。


    #### 3.动态性：认知的机制呈现


    情境认知的动态性是针对传统认知研究范式的静态的内在计算—表征而言的。以往的表征—计算模型将认识活动局限于大脑内，认为认知产生于脑内的神经活动。这种符号主义进路的认识模式以笛卡尔的主—客、心—物二分对立为预设和前提，认知成为孤立的主体对客体的反映和表征。在我们看来，这种静态的认识模式与现实情况不相符，忽略了认知主体是与情境进行动态交互的存在状况。人的存在的基本结构是“在世界中存在”，人和世界的联系不是日常经验中的空间关系，人（此在）的在世意味着它与其世界处于一种浑然一体、类似于耦合的关系，作为认知主体的人和其所处的情境存在着协调和共变。海德格尔指出，“认识乃是在世的另有根基的样式，而在世之存在先要越过在操劳活动中上手的东西才能推进到对现成在手的东西的分析”。[^(\[61\])](#chapter002.html#m61)人们通过与事物发生实践性的关联，了解事物的上手状态才能揭示其本真的属性，我们可以察觉到，海德格尔试图以一种动态的认知方式去替换笛卡尔主义传统的静态认知方式。这样看来，海德格尔为我们打开了认知动态性的广阔视域，使我们意识到人类认知在最根本、最原初的意义上就是能动的，动态性是人类认知活动的本质特征之一。


    #### 4.即时性：认知的当下耦合


    情境认知主张，人的全部认知活动不只是依赖于认知主体的自上而下、由内到外的信息处理和加工过程，也就是由人出发构造和解释关于外部世界的一切知识，它更依赖于外部环境对主体的自下而上、由外而内的刺激，并且这种刺激过程是当下的、即时的，同所处的情境是协调共变的关系，一旦变换所处的情境，那么该情境对认知主体的刺激和影响过程也发生相应的改变，我们将这种特征称为即时性。


    人类的日常活动，特别是人们的日常交流都离不开语言，都要在一定的语境下进行，并且这种语境具有当下性和直接性的特征。人们在某一确定的语境中交谈和对话，一旦对话终结，语境也自然随之消失，当变换了交谈对象，对话的语境也自动改变。在这里，我们认为语境和情境是相通的：即时的语境即情境。如果我们要理解谈话者的意图、接收最准确的信息，那么我们就有必要投入即时的语境或情境当中去，这就是为什么人们特别是新闻记者强调要获得第一手的信息和资料。在我们看来，即时、当下获得的信息是最真实可靠的（当然不排除会有虚假信息的可能性），准确程度也最高，即使是过后的回忆、推理和之前的预测、判断也要基于当下、即时的情境，所以，我们有理由认为人类认知具有即时性的特征。


    我们认为，境遇性发挥着基础性的作用，动态性与交互性都是在情境基础之上展开的，即时性则是对境遇性的进一步详细描述，也就是说，这四个特征相互依存、相辅相成，共同体现出情境认知最本质与核心的主张。这些特征不是某一种认知进路的产物，而是人类认知活动本身就具有的性质。我们认为，分析情境认知的四个特征并不是为了单纯从本体论层面对认知活动进行描述与刻画，而是为了加深人们对于情境认知的理解，认识到情境认知对于传统认知理论的必要批判和反思。心理学的研究表明，情境会强烈地作用于人的行动。通常而言，即使我们没有觉知到情境的特征或影响，情境的特征似乎也会驱动着我们的行动，但这样会产生比较消极的后果：人类主体对自己的所为几乎没有自觉的控制力，关于何所为也几乎不自知。[^(\[62\])](#chapter002.html#m62)对于情境认知这一概念框架而言，情境对人类认知与行动的影响不是单纯被动的，需要从具身性、嵌入性和生成性的角度对主体和情境的交互予以分析。当前的情境认知与具身认知科学都没有明确地回答以下关键问题：我们应当如何区分情境和情境要素（situational
    factor）？在何种意义上，对情境要素的反应不是一种消极的因果现象？为什么不同的人会对同一情境要素产生不同的反应？为什么个人的反应会随着时间的推移发生改变？人们应该如何理解他与情境要素之间的互动？这些问题仍需要情境认知理论给出明确的答案。同时，情境认知的确切含义是什么依然存在着争议，在一些观点的表述上，我们可能很难将之与具身认知区别开来，情境认知与具身认知存在着一种相似和兼容，特别是在概念和历史上相互通约。


    ### （二）具身认知：身体之于认知的因果性而非构成性


    一般而言，具身认知主要有两种含义：一是作为某种范畴术语，用于区分具身与非具身的认知过程，从而能够正确判断社会认知、语言以及意识等特定现象；二是指理解和研究全部认知的一种方式，不单指适用于某些认知现象的范畴。[^(\[63\])](#chapter002.html#m63)从这种意义上说，具身性已经成为研究人类认知的必要起点，关于身体是否参与认知已不是存有争议的论题，它成为被人们普遍接受的原则，人们的研究重心转向了认知的具身机制。具身认知是在对传统的认知主义和联结主义范式的质疑声中产生的，它批判了后者持有的离身立场，强调人的身体在认知过程中的渗透和影响，甚至将身体体验和感官知觉视为基本的认知能力，要求摒弃一种以大脑为中心的还原主义。认知是蕴含具身性、嵌入性、延展性、生成性以及生态性特征的现象。我们看到，具身认知不仅主张身体对于认知具有某种因果力，还认为身体具有之于认知的基础性和构成性作用。相较于古老的心身二元论，具身认知视域下的心身关系产生了某种反转，身体似乎成为决定认知和心智状态的因素，不再是笛卡尔眼中只具有广延属性的东西，心智的特性也随附于它，心智与身体之间的坚实壁垒被打破了。具身性不是对心理和行为现象的某些事例的假设，而是对我们研究和理解这些现象的初始假设，具身认知是作为认知科学的整体研究方案而提出的，而不是对传统认知研究范式的理论和方法论承诺的有限补充。


    在认知科学领域，针对经典认知科学的“无身性”，根据身体在认知过程中的作用，有学者将具身认知划分为朴素具身化和激进具身化两种形式，[^(\[64\])](#chapter002.html#m64)这表明，具身认知虽然在反对离身认知方面目标一致，但在如何看待身体的作用方面依然存在分歧，还算不上一个统一的范式。


    “朴素具身化”强调身体对认知的因果作用与影响，并不反对和排斥计算和表征，而是将其内涵进行了延伸和扩展。在以往信息加工的单一基础上加入了身体的要素和内容，身体和环境的互动为人的认知提供了信息来源，三者构成了紧密的结合体。计算和表征的内容有了具身性的特征，身体的感觉和运动系统也具有了某种表征作用，高级认知过程所加工的内容接纳了身体感觉和运动信息。[^(\[65\])](#chapter002.html#m65)在某种意义上，“弱立场”的具身认知对认知表征的态度是温和、包容的，并非彻底批判这种解释策略，其实质是以身体和环境的交互为核心对计算主义框架进行一种补充和修正，典型代表是威尔逊的“宽计算主义”和克拉克的“动态计算主义”理论。结果也导致这种朴素的具身认知呈现出“严重依赖内部表征、计算转换和抽象的数据结构等特点……对身体、环境和行为的关注就仅仅是作为一种获得内部数据结构和操作权限的方法与工具”。[^(\[66\])](#chapter002.html#m66)


    如果说“弱立场”的具身认知主张身体参与认知的话，那么“强的、激进立场”的具身认知则主张身体塑造认知，后者不满足于对传统认知科学修补式的改良，要求彻底拒绝和消除计算和表征在认知科学中的影响，“认知科学中结构的、符号的、表征的和计算的观点都是错误的”。[^(\[67\])](#chapter002.html#m67)认知和心智活动是人的身体与环境互动的产物，身体的生理构造和其包含的感官系统决定了人类认知能力的范围、程度和强弱，大脑内部的神经生理特征决定了心智的形式结构，因此，强具身观之所以‘强’，在于它赋予身体在塑造心智特征方面重要地位。[^(\[68\])](#chapter002.html#m68)这表明，强立场的具身认知已然将身体视作心智和认知状态实现的关键乃至唯一的途径和载体，具身认知的强、弱立场的临界点在于表征的有用与无用。


    区别于强弱立场的对立，笔者试图在具身认知的两种立场之间保持某种张力，采取温和的理论态度。一方面，我们不同意完全否认和取消认知机制的计算与表征功能，虽然计算不可能全方位、立体式地涵盖与描述认知现象，心智活动也不能完全借助计算来理解。然而，德雷福斯却指出，计算主义根植于西方哲学中悠久的理性主义传统，作为一种抽象化思维，它以概念和规则编制而成的逻辑之网理解世界（计算不仅限于一般意义的数字运算，还包括概念、命题的操作和推理演绎）。因此，只要人们以抽象方式认知对象便无法摆脱计算的影响。同样，表征作为人与外部世界勾连的主要方式，即便在德雷福斯描述的专家阶段，主体只是不需要进行预先表征，不意味着表征不存在，我们认为它只是暂时隐入了技能背景。表征是人类认知活动的重要组分，虽然可能与感觉—运动等较低层的认知加工关联不甚紧密，但是在思维、推理和记忆等高阶的认知加工过程中却发挥着基础性的作用。


    另一方面，我们也赞同强具身认知的某些观点，即身体构造的特殊性决定心智的特殊性，[^(\[69\])](#chapter002.html#m69)比如，除非我们有能力成为一只蝙蝠，否则永远不可能具有与之相同的知觉和关于世界的经验，身体构造存在差异的生命体对世界的感知方式不同。所有生命体的知觉经验都是基于身体的构造，是具身性的。我们通常是利用身体具有的感知通路和机制来理解世界中的其他事物，比如，我们以眼睛测量远近，以手掂量、估测物体的轻重，人们也往往以躯体的某些部分作为通用的符号系统（例如在大多数文化背景下，人以点头和摇头的形式表示对某一观点的赞成与反对）。

