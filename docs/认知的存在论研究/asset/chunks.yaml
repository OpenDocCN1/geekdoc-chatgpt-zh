    # 致谢


    曾经无数次地畅想书写《致谢》时的洒脱与轻松，以为自己会有李白斗酒诗百篇一般的顺畅与豪情，可真到落笔之时，心中却感慨万千，不知从何说起。六年的博士生涯如同白驹过隙般一闪而逝，现在还记得当初
    2017 年金秋入学时的意气风发，博士生的光环使自己短暂地产生了“春风得意马蹄疾，一日看尽长安花”的奇妙之感，想到自己未来拿到博士学位，不免心生悸动。只是没有料到，这条路我走了六年之久。道路虽艰难曲折，但在老师亲朋的关怀之下，我还是走到了最后，没有你们的支持和帮助，我是绝对坚持不到现在的。


    首先，我要深挚地感谢我的博导魏屹东教授。从 2014 年拜入导师门下，到如今已近十个春夏秋冬，导师对学术的执着追求深深地影响了我，使我暗下决心走上学术研究的道路。可以说，如果没有导师，我绝不会成为今天的自己。现在还记得，自己第一次将写好的论文交给导师时的紧张与不安，食不知味，夜不能寐，心中无数次设想着被导师批评的场景。然而，当忐忑不安的我走进导师的办公室时，看到的却是导师亲切的微笑，脑海中的臆想不仅没有出现，而且导师还热心地给予了肯定。当我拿到论文，映入眼帘的是密密麻麻的修改痕迹，甚至细微到每一个标点符号。每一次的论文写作和修改，我都获益良多，导师不止一次地叮嘱我，要时刻保持对学术前沿问题的敏锐洞察，学术研究要杜绝闭门造车，并且要走出去进行充分的交流。除此之外，导师对学术研究的严谨也令我叹服，他一直强调研究成果的独创性，切忌各种学术不端行为。正是在魏老师的严格要求下，我最终完成了博士论文的写作，从论文的选题策划到最后的定稿，无不倾注了导师大量的心血。近十年的光阴，导师渊博的学识，宽厚的为人、严谨的治学态度以及在学术上不断探索、勇攀高峰的精神都深深地感染着我，使我终于明晰了自己的人生方向。


    同时，我想要感谢一路走来遇到的老师和朋友，感谢山西大学哲学学院的各位老师，正是他们的传道授业指引着我这个半路出家的“和尚”通向哲学殿堂的大门，特别是王航赞老师、王玉彬老师、原海成老师、陈敬坤老师、胡瑞娜老师、邢媛老师、韩宁老师、范莉老师；感谢周斌老师、吴文清老师、胡瑞娜老师在预答辩时提出细致的修改意见；感谢一起打篮球的球友伙伴，非常感谢球友们的信任，不停地为我挡拆、传球，让我每次都能在球场上宣泄出积聚已久的压力。还要感谢我的师姐杜雅君博士，在我心情低落的时候积极地开导我，让我得以迅速重整旗鼓，她总能及时地回复我的疑问，让我倍受感动。感谢同学们给予我无私的帮助，特别要感谢赵秀红老师，每次都特别耐心地帮我校对和润色英文翻译。感谢王凯兄日常组织的茶局，与建斌兄、春羊兄还有李肖兄的茶余闲谈为我平淡的读博生涯添抹了有趣的一笔。正是因为有你们相伴，我才能在并不平坦的求学之路上披荆斩棘，一路前行。


    感谢国家社科基金重大项目“人工认知对自然认知挑战的哲学研究”（21&ZD061）、山西省“1331 工程”重点学科建设计划以及山西大学“双一流”学科建设规划的资助，正因如此，本书才得以出版。最后要特别感谢社会科学文献出版社的编辑周琼老师，她对全书内容进行了认真细致的审校，感谢周琼老师的辛勤付出。


    在山西大学将近十载，家人始终是我最有力的后盾，每当遭遇挫折，无论感到多么沮丧，回家看到爷爷慈祥的面庞，心情就会平静下来。求学二十余载，爷爷和天堂里的奶奶是我最大的精神支柱，他们是我努力前行、刻苦奋斗的力量源泉，爷爷奶奶将我从襁褓中的婴儿抚养成人，没有他们，便没有我如今的成就！感谢父母在我离家的日子里对爷爷的悉心照料，使我可以心无旁骛地专注于自己的学业。


    谨以此书献给我挚爱的爷爷奶奶！


    王敬


    2023 年 12 月 13 日


