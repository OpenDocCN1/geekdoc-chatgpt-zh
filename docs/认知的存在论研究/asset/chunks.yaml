    \n# 导论\n\n## 一 选题意义\n\n自20世纪50年代以来，人类认知的本质问题已经成为现代科学关注的焦点，与之相应的认知科学随之诞生。在短短的70多年间，它的发展速度之快，涉及范围之广，是任何时代的科学都难以企及的。如今，已经成为21世纪前沿科学的认知科学先后产生了计算隐喻和符号主义、脑隐喻和联结主义、交互隐喻与具身心灵等不同的理论模型，也经历了以认知心理学、人工智能、人工神经网络、神经科学为主要研究方向的发展阶段。同样的，在认知哲学的领域也产生了符号主义、计算主义、情境主义等理论以及随之而来的各种哲学反思和批判。我们的选题意义主要有以下三点。\n\
    \n第一，从认知研究的切入角度来说，以符号主义、联结主义为代表的第一代认知科学研究纲领、以“4E+S”为核心的第二代认知科学研究范式、动力系统理论以及现象学都从各自立场对认知相关问题进行了回答与解释。经典认知范式之后的绝大多数研究进路都基于对笛卡尔的主客二元认识论模式的哲学批判。海德格尔的存在论从对世界的世界性分析和“此在”的生存论分析展开了他对笛卡尔的批判，着力把人当作世界的参与者而非旁观者，摒弃了超越性的“视见”，这种实践描述引起了认知科学家和哲学家的关注。因而，从存在论角度切入认知科学可以说是一种新的研究进路。\n\
    \n第二，海德格尔的存在论与胡塞尔的现象学都是现代西方哲学史上具有相当影响力的哲学流派，有着举足轻重的地位，二者都与认知科学有着密切关系，都对认知科学研究范式的哲学基础转换产生了积极的作用，甚至有可能成为认知科学新的哲学基础和来源。例如海德格尔的“在世存在”、对事物的上手性和现成性的区分等，都为具身认知、情境认知等研究进路提供了富有启发性的启示和指导。另外，由于海德格尔将“此在”看作存在意义显现之所，对存在意义的追问也是诠释学自身的目标与任务，因此，可以说，他的存在论是与诠释学相结合的，他将两者统一了起来。一般而言，理解与人的认知有着千丝万缕的联系，甚至可以把后者纳入前者的范畴，海德格尔与伽达默尔对于理解之“前结构”的重视有助于描述人类认知自身的澄明。概言之，海德格尔的诠释学与受到其实质性推动的伽达默尔诠释学有可能给予研究人类认知现象以何种有效的启示，需要我们加以考察。\n\
    \n第三，根据笔者的搜索，目前国内学界对将海德格尔与认知科学相结合这一领域的关注不多，相关文献仅有数篇论文，而国外已有数本研究专著和若干论文，说明国外学界业已注意到这一问题的重要性，而国内学界对此认识不足。因此，本书在全面考察作为认知科学哲学基础的笛卡尔到海德格尔之转向的基础上，充分将认知科学的相关问题与海德格尔的存在论哲学相结合，在对认知进行存在论分析的基础上提出一条新的并具有可行性的研究路径。在笔者看来，虽然这一选题有很大的难度和挑战性，相关资料也较少，但这在一定程度上可以拓展认知科学的研究视野，推动认知哲学领域的学术研究，还可以弥补国内相关研究的不足。\n\
    \n## 二 国内外研究现状\n\n认知科学是研究人类心智、认知和智能的交叉学科，其智力起源主要包括1956年以来兴起的人工智能研究热潮、心灵哲学中的“功能主义”理论、认知心理学和语言学反对激进行为主义的“认知革命”等。到现在为止，走过半个多世纪历程的认知科学，已不像产生初期那样“仅仅是不同领域的人对心智的泛泛而谈”。今天，不同领域的研究者联手为心智与认知的探索贡献了许多新奇的研究方法和富有创见的成果，例如传统的符号计算主义与联结主义，以“4E+S”为核心的第二代认知科学研究纲领，从现象学、实用主义、生态学等角度介入认知科学的研究路径，等等。以上各个研究方向的论文不一而足，汗牛充栋。国内学界对海德格尔存在论的研究也十分重视，成果颇丰，但大多是对其著作展开的文本解读。因此，我们首先梳理这一解读过程中关于意向性、语言、知识等与认知相关联的文献。\n\
    \n### （一）海德格尔与认知相关的问题研究状况\n\n海德格尔本人虽然几乎没有谈过“认知”这一词，但这并不能说明他不重视这一问题，恰恰相反，海德格尔格外重视认识论问题。《存在与时间》一书中便有关于认识和真理的讨论；在《时间概念史导论》中，他进一步指明了人的认知在存在论哲学中的地位，但他把认知视为此在在世界中存在的一种“派生”方式。海德格尔在着手阐述在世现象之际就特别注重对传统认识论（主要是笛卡尔主义认识论）的批判。在他看来，整个传统认识论陷入了认识主体如何以一种合理的方式从其内在范围抵达外在对象这一窠臼，要摆脱这一困境，必须一开始就将认识理解为“此在在世界中存在的一种方式”。目前，国内学界对这一问题域的关注度较高，诸多新的认知研究进路也都吸收了海德格尔的这一思想，并以此为基础作进一步解读。\n\
    \n#### 1. 海德格尔关于认识论的研究状况\n\n李龙的博士学位论文《认识论的先验转向和生存论转向——以生存论维度重新理解认识论》认为海德格尔在批判先验哲学的独断性和传统形而上学的实体性中开启了认识论的生存论转向，揭示出了认识论的生存论前提，在生存论维度上重新理解了认识论。作者指出，其生存论转向本质上是反对科学主义认识论、反对技术控制论的，实际上是在认识论的先验转向基础上强调思维方向的重新开拓，不再从思维的先验结构、思维的逻辑机能去研究认识的可能前提，而是从在世的生存论结构、人的生存领会来研究认识的可能前提。海德格尔的生存论转向改变了认识论的主题，认识论的根本问题已不再是寻求知识的客观性、真理性问题，而是通达存在的意义。[^(\\\
    [1\\])](#chapter001.html#m1)\n\n丁蓓增的《海德格尔对传统认识论的解构》一文认为，海德格尔哲学的目的在于摆脱以自然科学为思维模式的世界观，对存在问题的重新分析使他突破了狭隘的主—客体认识关系，向人们展示了一个新的、广阔无比的领域；[^(\\\
    [2\\])](#chapter001.html#m2)张一兵的论文《意蕴：遭遇世界中的上手与在手——海德格尔早期思想构境》深入探讨了海德格尔哲学语境下的“意蕴”概念，他认为意蕴不是认识论的范畴，而是一种遭遇性的存在，它的展露表现为两个存在特征——意蕴的上手—在手状态和意蕴共同世界中的显现，存在就是意蕴建构起来的相遇之发生；[^(\\\
    [3\\])](#chapter001.html#m3)余平的论文《“朝向实事本身”之思——从笛卡儿到海德格尔》认为海德格尔以“在-世界-中-存在”化解掉了意识哲学的不破金身，进而击中了认识论哲学一直够不着的自在存在，亦即那种滚滚而来激荡并席卷着我们的“实事本身”；[^(\\\
    [4\\])](#chapter001.html#m4)刘丽霞在《心物关系问题的解决：从胡塞尔到海德格尔》一文中论述了海德格尔对胡塞尔的认识论范式的批判，反对从内部解决心物关系，坚持从此在领域出发理解“物自身的经验”；[^(\\\
    [5\\])](#chapter001.html#m5)陈辉在其论文《海德格尔对“世界观”概念批判的多重意蕴》中论述了海德格尔所理解的“世界观”，在他看来，后者是对主体形而上学的一种表达方式，应坚决予以解构、批判，人与世界的关系完全不同于这一概念所显示的那样，他试图在这一层面上超越主客二分。[^(\\\
    [6\\])](#chapter001.html#m6)\n\n#### 2. 关于认知的意向性问题\n\n由布伦塔诺开创，后经胡塞尔改造而来的意向性概念也受到了海德格尔的极大关注，他将这一概念用于研究此在“在世界中存在”的问题，脱离了胡塞尔解释意识的原初路径，因此具有不同的意义。国内学界对这一问题的关注较多，孙周兴的论文《我们如何得体地描述生活世界——早期海德格尔与意向性问题》认为海德格尔早期正是借助“意向性”获得了真正的“实事域”，并在视域到世界、理论化到生命体验等方面对意向性作了诸多推进；[^(\\\
    [7\\])](#chapter001.html#m7)舒红跃的论文《从“意识的意向性”到“身体的意向性”》认为海德格尔对胡塞尔现象学的批判不在于拒绝意向性，而在于否认意向性是第一性的存在基本结构，他认为“意识的意向性”、单纯地朝向某物，必须被回置到“在之中存在”的基本结构中，意向性奠基于此在的超越性，它不是此在最原初的特征，意向行为是被奠基的，根基于此在的实存；[^(\\\
    [8\\])](#chapter001.html#m8)杨晓斌的博士论文《意识意向性、身体意向性与伦理意向性——胡塞尔、海德格尔与列维纳斯哲学中的意向性概念》认为海德格尔确立了一种与胡塞尔的意识意向性不同的身体意向性，他将意向式存在者（实在的人，此在）作为这一意向性的起点，并且通过对“本质”和“实有”的回溯，将这意向式存在者等同于“动手性或制作性施为者”；[^(\\\
    [9\\])](#chapter001.html#m9)陈攀文的论文《现象学意向性理论的生存论转向：从胡塞尔到海德格尔》论述了海德格尔基于“存在论”立场对胡塞尔的意识意向性理论作出的三个方面的批判性改造：海德格尔认为意向性之“主体”是指向实践价值意义的此在而非先验自我，意向之意义出自此在之实践和价值性质的筹划而非纯粹意识之授意活动，意向性之指向性根源于使生存价值得以绽出的时间性而非意识的本质结构之事实。作者认为海德格尔的意向性理论超越了传统哲学而走向了价值和实践哲学，从意识意向性转向了生存意向性。[^(\\\
    [10\\])](#chapter001.html#m10)\n\n#### 3. 关于认知的语言问题\n"
  trans: "\n\n![](img/Cover.jpg)\n\n![](img/QZY.jpg)\n\n本书由国家社科基金重大项目“人工认知对自然认知挑战的哲学研究”（21&ZD061）\n\
    \n山西省“1331 工程”重点学科建设计划\n\n山西大学“双一流”学科建设规划\n\n资助出版\n\n![](img/SMY.jpg)\n\n# 文库总序\n\
    \n认知（Cognition）是我们人类及灵长类动物的模仿学习和理解能力。认知的发生机制，特别是意识的生成过程，迄今仍然是个谜，尽管认知科学和神经科学取得了大量成果。人工认知系统，特别是人工智能和认知机器人以及新近的脑机接口，还主要是模拟大脑的认知功能，本身并不能像生物系统那样产生自我意识。这可能是生物系统与物理系统之间的天然差异造成的。而人之为人主要是文化的作用，动物没有文化特性，尤其是符号特性。\n\
    \n然而，非生物的人工智能和机器人是否也有认知能力，学界是有争议的。争议的焦点主要体现在理解能力方面。目前较普遍的看法是，机器人有学习能力，如机器学习，但没有理解能力，因为它没有意识，包括生命。如果将人工智能算作一种另类认知方式，那么智能机器人如对话机器人，就是有认知能力的，即使是表面看起来的，比如\
    \ 2022 年 12 月初开放人工智能公司（Open AI）公布的对话系统 Chat GPT，两个 AI 系统之间的对话就像两个人之间的对话。这种现象引发的问题，不仅是科学和工程学要探究的，也是哲学要深入思考的。\n\
    \n认知哲学是近十多年来新兴起的一个哲学研究领域，其研究对象是各种认知现象，包括生物脑和人工脑产生的各种智能行为，诸如感知、意识、心智、自我、观念、思想、机器意识，人工认知包括人工生命、人工感知、人工意识、人工心智等。这些内容涉及自然认知和人工认知以及二者的混合或融合，既极其重要又十分艰难，是认知科学、人工智能、神经科学以及认知哲学面临的重大研究课题。\n\
    \n“认知哲学文库”紧紧围绕自然认知和人工认知及其哲学问题展开讨论，内容涉及认知的现象学、符号学、语义学、存在论、涌现论和逻辑学分析，认知的心智表征、心理空间和潜意识研究，以及人工认知系统的生命、感知、意识、心智、智能的哲学和伦理问题的探讨，旨在建构认知哲学的中国话语体系、学术体系和学科体系。\n\
    \n“认知哲学文库”是继“认知哲学译丛”“认知哲学丛书”之后的又一套学术丛书。该文库是我承担的国家社科基金重大项目“人工认知对自然认知挑战的哲学研究”（21&ZD061）系列成果之一。鉴于该项目的多学科交叉性和研究的广泛性，它同时获得了山西省“1331\
    \ 工程”重点学科建设计划和山西大学“双一流”学科建设规划的资助。\n\n魏屹东\n\n2022 年 12 月 12 日\n\n# 摘要\n\n以存在论现象学研究人类认知是回答以什么样的方法、形式或核心去解决关于认知的哲学问题。借鉴和利用海德格尔关于“此在”的生存论分析对认知的相关要素进行说明和解释，可能是研究认知问题的一条新的途径，一定程度上能够促进认知科学与欧陆哲学相结合，以一种新的态势区别于认知哲学中传统的研究范式。海德格尔的存在论哲学与认知科学的结合是否具有其合理性与有效性，以及由此产生的存在论认知能否成为认知科学中一条新的研究进路，这是亟须论证的问题。对已有认知科学研究纲领及其哲学基础的梳理和分析表明，诸多认知研究路径都有其缺陷：经典的认知主义和联结主义模型受困于“计算至上”的形而上学迷梦，遵循心物与心身二分原则造成了认知与世界、身体的割裂，因而难以理解人的情感、意志活动，且不能正确说明人类认知的形成与演化，而且计算主义对于描述人的情感体验、意志冲动以及审美活动而言并不充分；以“4E+S”为核心的第二代认知科学研究纲领虽在批判笛卡尔主义的哲学基础方面颇有进展，但自身却面临着难以融合为一的困境，认知活动的脑外要素之因果性与构成性的分歧仍未弥合；胡塞尔现象学因其先验唯心主义和反自然主义立场而与认知科学的实证原则相悖，它将全部意义都植根于先验的主体性之中，而这一先验主体性缺少经验世界的支撑。理论建构的基石是概念。本书讨论了存在论认知的三个核心概念——“此在”、世界和在世存在，分析了“此在”具有的身体、实践以及情境三种维度，澄清了世界与背景，以及认知视域中的环境概念的差别，将在世存在看作人类认知得以可能的条件。海德格尔力图把人的存在设想为在世界中存在，却缺失了对身体要素的讨论，需要对之作出修正。在将海德格尔的存在论现象学与认知科学相结合的方面，存在论认知具有三个主要命题：（1）以动态的原初上手活动取代静态的静观认知；（2）以具身的情境性认知取代无身的离身性认知；（3）由表征性认知拓展为行动导向性认知，人类认知是表征和行动的叠加耦合。海德格尔将理论性的认知看作对上手操劳的一种修正，操用器具的上手活动是通达事物本身的正确方式，但这一直接的上手活动也遭遇了自动化、智能化的延展实践形式的挑战。任何单一的上手状态都是在情境中与人们照面，身体性的“在世界中存在”才真正符合人类真实的生存境况。同时，上手活动并不必然地排斥表征，认知是行动导向的，这是对既有的表征性认知的拓展而非替代。将存在论哲学引入认知研究也面临着理论困境与质疑。一方面，“此在”作为存在论概念与事实层面的自然化描述并不相容，自然化“此在”并没有现实层面的可能性，它是思辨式的、现象学的先验解释和先验分析的产物，不适于形式化、模型化的科学解释。另一方面，“海德格尔式人工智能”尝试以“被抛”的机制化回答“框架问题”，面临着非因果的现象学解释与因果的自然主义解释之间不相容的矛盾，按照“被抛”设计的人工智能也未能完整地呈现人类智能的整体结构。存在论认知的理论困境以及存在论现象学与诠释学之间在理论上的连续性表明，单纯依靠存在论哲学不足以支撑整个存在论认知，有必要将诠释学纳入存在论认知的框架中，以丰富其内涵。首先，海德格尔的存在论现象学就是一种诠释学；其次，人类认知也是一种诠释，认知依赖于诠释，渗透着诠释，诠释与认知具有结构上的“家族相似”；最后，诠释学能够对认知科学产生助益。同时，诠释学也揭示了人类认知本身的复杂之维，凸显了认知的动态性与自我超越性的特征。存在论与诠释学可以共同构成推动认知研究的新助力。\n\
    \n**关键词：**存在论认知；“此在”；在世存在；人工智能；诠释学\n\n*   导论\n*   第一章 对认知科学研究纲领的存在论现象学考察\n   \
