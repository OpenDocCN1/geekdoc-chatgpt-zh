- raw: '语言作为人类认知的一种特殊现象，一直受到哲学家们的关注，海德格尔的存在论哲学也对语言问题展开了独特的追问。国内目前的研究状况如下。冯凯迪的硕士学位论文《试论海德格尔的语言之思——基于语言与世界之关联的考察》从语言和世界的内在关联阐释了海德格尔的语言观，并分析了世界概念以及世界和语言的关系问题；[^(\[11\])](#chapter001.html#m11)谢文静的硕士学位论文《行走在“思”与“诗”的路上——海德格尔存在论的语言学诠释》在诗、语言和存在的框架下讨论了海德格尔语言和存在的关系；[^(\[12\])](#chapter001.html#m12)张贤根的《语言：区分与道路——海德格尔语言思想研究》论述了海德格尔在批判流俗语言和技术语言的基础上实现的语言转向，以及海德格尔为保持语言的纯粹性和本真性所作的努力，即区分诗意语言与技术语言，并利用前者克服后者；[^(\[13\])](#chapter001.html#m13)杨佑文的《海德格尔的“语言转向”及其语言观》一文探讨了海德格尔的“语言转向”及其意义，区分了他前期和后期语言观的差别；[^(\[14\])](#chapter001.html#m14)张海洋的《本体论语言哲学视域中的海德格尔语言观》批判了海德格尔前后期语言观，从“语言与此在”、“语言与意识世界”和“语言与存在”三个维度来澄清海德格尔语言观的本质；[^(\[15\])](#chapter001.html#m15)王锺陵的《论海德格尔的语言观》一文分析了海德格尔关于语言的“道说”概念与老庄哲学之谓道的异同。[^(\[16\])](#chapter001.html#m16)综上，我们看到，海德格尔对语言的理解以其“存在论”思想为理论基础，把对“存在”意义的追问作为其探究语言本质的出发点，海德格尔认为人如何通过意识世界认识外在世界正是语言意义的体现。“语言是存在自身既澄明又遮蔽的到来，因此语言是存在之家，人在其中生存着。”[^(\[17\])](#chapter001.html#m17)语言的本质既体现在语言与存在的关系中，也体现在语言与人和人的世界的关系中，语言的意义既离不开存在，也离不开人和人的世界。


    ##### 4.关于认知的情绪问题


    与认知科学和心理学等学科对情绪的讨论不同，海德格尔对情绪的研究进路另辟蹊径，他是从此在生存论分析的角度考察此在在世的情绪问题的，国内学术界对此的研究主要集中在“畏”和“烦”两种情绪上。刘丰的硕士学位论文《论海德格尔的“根本情绪”——畏》论述了作为本体的情绪以及情绪的基本结构；[^(\[18\])](#chapter001.html#m18)张银华的硕士学位论文《海德格尔生存论中的情绪问题研究》通过分析与阐述“烦”与“畏”这两种情绪的本质和情绪的本真含义来寻找此在（人）在生存论中的结构性因素，以获得对此在的本真性认识；[^(\[19\])](#chapter001.html#m19)孙周兴的《为什么我们需要一种低沉的情绪？——海德格尔对哲学基本情绪的存在历史分析》一文以存在论方式分析了“惊恐”“压抑”“畏惧”三种时代的基本情绪，认为它们是极为重要的，对于哲学或者思想具有根本的“调音—规定”作用；[^(\[20\])](#chapter001.html#m20)肖庆生等的论文《海德格尔哲学中的情绪本体论探究》论述了此在的基本情绪——“操心”和本真情绪——“畏”，认为海德格尔的情绪本体论是一种具有颠覆性并影响深远的思想，并且揭示了其现实启示。[^(\[21\])](#chapter001.html#m21)综上，我们看到，海德格尔将情绪理解为此在的一种源始存在方式，此在是一种情绪性的存在者，这是它的又一特征。他说道：“在现身情态中此在总已被带到它自己面前来了，它总已经发现了它自己，不是那种有所感知地发现自己摆在眼前，而是带有情绪的自己现身。”[^(\[22\])](#chapter001.html#m22)因此，此在最初在情绪之中展开其存在和世界。海德格尔认为情绪具有两个主要环节：“烦”和“畏”。此在正是借助这两种情绪来揭示、把握此在本真的存在意义，他也正是通过对“畏”和“烦”两种情绪的细致分析厘清本真存在的确切含义。我们可以看到，海德格尔的情绪分析不属于认知科学的任务和范畴。


    #### （二）关于海德格尔式人工智能的问题


    近年来，人工智能的不断发展为人类的生产和生活带来了巨大的便利，但其自身也面临着诸多问题，哲学家出于自身责任对人工智能展开了批判和分析。有的哲学家，比如德雷福斯，利用海德格尔的现象学思想对人工智能的前景进行了深刻的反思，他将现象学与人工智能的具体技术紧密地结合在了一起。国内学者以德雷福斯的理论主张为基础，对他提出的“海德格尔式人工智能”（Heideggerian
    AI）进行了进一步的反思和批判。


    徐献军是较早关注这一问题的学者，他在2011年发表的《国外现象学与认知科学研究述评》中介绍了海德格尔式人工智能的初步研究，指出了现象学与认知科学之间合作的可能潜力。[^(\[23\])](#chapter001.html#m23)在其2013年发表的论文《海德格尔与计算机——兼论当代哲学与技术的理想关系》中，他论述了在海德格尔与计算机的联系的影响之下，计算机专家作出的一些改变，即以海德格尔哲学为基础构建新式的计算机系统的设计进路，包括威诺格拉德的存在主义设计、阿格勒的指示表征设计以及多罗西的具身交互设计。同时指出各自进路所具有的理论和实践意义。[^(\[24\])](#chapter001.html#m24)在《论德雷福斯、现象学与人工智能》一文中，作者对德雷福斯的哲学贡献作了描述，认为他的贡献主要有两部分：一是基于海德格尔的存在论现象学和梅洛-庞蒂身体现象学形成了自己的现象学哲学，二是成功地建立了现象学、计算机科学与人工智能等不同学科之间的联系。作者在对德雷福斯的思想进行分析后认为，德雷福斯的研究存在两个缺陷：一是对胡塞尔的评价有失公允，低估了胡塞尔对于人工智能和认知科学的重要程度；二是德雷福斯过于强调身体的重要性而忽视了意识。在作者看来，随着技术的进步，德雷福斯要求的人造身体可能会实现，但人和机器的本质区别不在于身体，而在于意识，使人工智能具有意识和心智，才是它成功的标志。问题在于，如果约翰·塞尔的生物自然主义是正确的，那么这种观点恰恰指出了意识、心智与身体构成的因果关系。目前看来，只有碳基构造的生命体才展现出了意识现象，人们有理由相信，身体才是产生意识和心理现象，甚至发展成智能的基础。[^(\[25\])](#chapter001.html#m25)


    在另一篇论文《德雷福斯对人工智能的批判仍然成立吗？》中，徐献军考察了德雷福斯对人工智能进行批判的哲学依据，同时力图回答在深度学习和强化学习长足发展的背景下，德雷福斯对人工智能批判的有效性问题。作者认为德雷福斯是立足于海德格尔和梅洛-庞蒂的现象学哲学对人工智能进行批判的，而且他对原有的现象学进行了改造，是“德雷福斯式的海德格尔与梅洛-庞蒂现象学”。在作者看来，人工智能的哲学假设是理性主义，是其哲学原则的极致演绎和实践化，人工智能的发展可能会面临传统理性主义与海德格尔—梅洛-庞蒂现象学之间的取舍。关于批判是否有效的问题，作者持正面态度，认为德雷福斯的批判到今天为止依然有效，他揭示出了束缚人工智能发展的哲学假设，这是至关重要的。[^(\[26\])](#chapter001.html#m26)


    王颖吉的论文《作为形而上学遗产的人工智能——休伯特·德雷福斯对人工智能的现象学批判》重温了德雷福斯关于人工智能的重要见解，论述了德雷福斯基于存在论现象学对经典人工智能的批判。作者汲取了海德格尔与梅洛-庞蒂现象学的重要观念，认为智能的实质是情境化和具身化的心智，指出未来人工智能的前景在于发展出一种去除表征、重视身体和情境且不依赖规则的智能形式。[^(\[27\])](#chapter001.html#m27)


    张昌盛的论文《人工理性批判：对德雷福斯的人工智能哲学的现象学反思》从德雷福斯关于人工智能极限的现象学分析入手，通过与塞尔的生物自然主义进行对比，作者认为德雷福斯诉诸海德格尔与梅洛-庞蒂现象学而提出的“海德格尔式人工智能”是优于表征主义式人工智能的，但不能应对认知科学的发展和生物自然主义所带来的挑战。因此，理解人工智能问题的关键是理解认知、智能和意识之间的关系，而涉及意识问题就不能不提及胡塞尔的先验现象学，德雷福斯恰恰在这一点上误解了胡塞尔。人工智能的本质是对人类认知和智能的揭示，是对意识的重新思考。[^(\[28\])](#chapter001.html#m28)


    段似膺的论文《海德格尔式人工智能及其对“意识”问题的反思——兼与何怀宏先生商榷》探讨在海德格尔式人工智能中再现“意识”的问题。作者认为，虽然海德格尔式人工智能改变了以往传统的符号表征模式，并以生物和日常世界间的交互活动为基础，但它依然会面临强人工智能遇到的困境，即人类是以身体为中介在诸多情境中直接把握意义的，人与世界打交道的方式之基础在于他的身体存在，人工智能与人类的本质区别在于身体而非意识，关键是没有依托“在世存在”的“身体—意识”。[^(\[29\])](#chapter001.html#m29)


    陶锋的论文《人工智能语言的哲学阐释》从海德格尔存在论的视角出发，探讨了人工智能语言面临的根本难题。作者认为，人工智能语言是一种技术语言，而技术语言是抽象的逻辑演算的公式，它遮蔽了存在者的现象和显现，因此人工智能永远无法实现本真的语言（诗的语言）。基于海德格尔的语言观，作者认为人工智能不会像人一样独立地获得语言，因为前者不具有生存论意义上的超越、领会和情绪，无法像人一样体会语言的本质，也没有类似于人的言谈能力。[^(\[30\])](#chapter001.html#m30)


    夏永红在《人工智能的创造性与自主性——论德雷福斯对新派人工智能的批判》一文中梳理和考察了德雷福斯对人工神经网络和具身人工智能的批判。作者认为德雷福斯已有的批判缺乏必要的理论基础和理论指引，因而流于单纯的技术评估。通过引入德雷福斯对本真性这一海德格尔哲学概念的重新阐释，作者力图从生存论层次阐明人工智能的创造性和自主性的先验条件：两者都奠基于生命的脆弱性。作者将人工智能不具有完全智能的根本原因归于它缺乏人类本身具有的自主性和创造性，缺乏一个脆弱的活生生的身体，指出人工智能研究的前景在于人工与生命的结合。[^(\[31\])](#chapter001.html#m31)


    朱清华的论文《德雷福斯与海德格尔式人工智能》考察了海德格尔式人工智能如何应对框架问题这一难题。首先，作者论述了德雷福斯对人工智能具有的四个形而上学假设的批评。其次，作者区分了海德格尔式人工智能的三个发展阶段：①基于行为的机器人学；②给上手状态编程；③虚拟的海德格尔式人工智能，并指出了海德格尔式人工智能在解决框架问题时的缺陷，认为它不足以彻底地解决框架问题。最后，作者考察了德雷福斯对人工智能批判的有效性问题，认为德雷福斯的批判关乎更为根本的问题，即人根本的思维和行动方式是否为概念性和表征性的。他认为德雷福斯的批判在哲学上是站得住脚的，海德格尔对“在世存在”的本质描述可以作为人工智能发展的一个参照系。[^(\[32\])](#chapter001.html#m32)


    李日荣的《海德格尔的时间性此在与人工智能发展的自主性难题——兼论德雷福斯人工智能批判的局限性》一文从此在的本真性和自主性的视角出发，认为德雷福斯对人工智能的批判未能看到海德格尔对人类智能本质的完整揭示，其本质介于形式与非形式之间，人工智能的正确发展方向应当是能够揭示人类智能形式与非形式化特征的融合统一，呈现二者之间的“关联领域”。[^(\[33\])](#chapter001.html#m33)


    同时，国外学界对海德格尔哲学与人工智能的讨论也具有一定热度，时间的跨度比国内学界要更大。贝斯·普雷斯顿（Beth Preston）在论文《海德格尔与人工智能》（Heidegger
    and Artificial Intelligence）中指出，海德格尔式人工智能并非将“表征”和“计算”作为核心概念，而是以社会性为本质特征，它从根本上对立于认知主义，智能的涌现在于同外在环境的交互，而非神经元的联结。[^(\[34\])](#chapter001.html#m34)卡罗斯·埃雷拉（Carlos
    Herrera）与里卡多·桑斯（Ricardo Sanz）在论文《海德格尔式AI与机器人的存在》（Heideggerian AI and the Being
    of Robots）中认为，海德格尔对人类（此在）的生存论分析并不适用于人工系统，因为海德格尔的存在论哲学否认机器人或人工智能具有与人类相同类别的存在论意义。他们对人工系统进行了海德格尔式的存在论分析，认为机器人或人工智能是一种特殊的、不同于人类和动物的存在者，是执行人类劳动的机器。对人工智能或机器人进行存在论分析是一项艰巨的挑战，作者认为海德格尔式人工智能的任务在于为制造智能机器提供智力方面的支持。[^(\[35\])](#chapter001.html#m35)查理塔（Mario
    Andrés Chalita）和塞泽拉兹（Alexander Sedzielarz）的论文《超越框架问题：海德格尔对AI的贡献》［Beyond the Frame
    Problem：What （Else） Can Heidegger Do for AI？］对海德格尔哲学是否可以作为人工智能的思想来源进行考察：如果海德格尔启发的认知科学是可能的，那么这种科学应该聚焦于存在论的差异，而不是海德格尔思想中的任何其他特征。[^(\[36\])](#chapter001.html#m36)


    我们看到，将海德格尔哲学应用于人工智能成了当前的一个研究热点，由于德雷福斯是利用海德格尔哲学批判人工智能的先驱和集大成者，因此，国内学者首先关注的是德雷福斯从存在论现象学角度对经典人工智能的批判，并在其基础上作进一步的分析和再批判，关注的侧重点包括意识问题、框架问题以及人工智能的形而上学预设等。可以说，国内学者几乎是以德雷福斯的批判为依托来展开自己的分析研究的，特别是后者在《计算机不能做什么：人工智能的极限》一书中提出的关于传统人工智能的四个假设：①生物学假设、②心理学假设、③认识论假设以及④本体论假设。[^(\[37\])](#chapter001.html#m37)这四种假设至今仍在对我们的研究产生影响。总体看来，国内学者在相关方面的研究似乎仍旧没有脱离德雷福斯，集中于对计算机的无身性（disebodied）、非情境性特征的批判，没有对海德格尔式人工智能作出具体、清晰的描述和定义。我们认为，德雷福斯的批判是否仍然有效，需要结合人工智能最新的研究成果来予以审视，并以此来判断海德格尔式人工智能的适应性，不能简单、匆忙地作出海德格尔式人工智能已经过时的结论。


    #### （三）其他学者将存在论哲学与认知科学相结合的研究状况


    ##### 1.第二代认知科学研究纲领与存在论哲学的关系述评


    在对第一代研究纲领的认知主义、联结主义进行反思与批判的背景下，以“4E+S”为核心的第二代认知科学研究纲领应运而生，后者注重身体和情境在认知过程中的作用，强调主体与环境的交互作用与过程。其主要进路包括具身认知（embodied
    cognition）、延展认知（extended cognition）、生成认知（enactive cognition）、嵌入认知（embedded cognition）以及情境认知（situated
    cognition）。后四种进路实质上是具身认知的不同形式，但这四种认知理论与存在论现象学的关系并不密切，只是在关于具身认知的“身体”概念方面，国外学界进行了较为细致的研究。


    关于具身认知的研究和探讨，国内学界主要是围绕其与以计算—表征为核心的正统认知科学之间的争论展开，有的从现象学角度加以论述，有的则从认知心理学角度进行探究，但还没有人从海德格尔存在论哲学的角度介入具身认知理论。讨论“身体”概念的论文也非常少，原因可能在于海德格尔本人不太重视身体问题，在《存在与时间》和其他著作中没有对身体予以适当的哲学分析。在海德格尔看来身体只是空间性的物体，没有独特的存在论地位。相比于国内，国外学者的讨论和研究要热烈、深刻得多。埃德加·E.彼得斯（Meindert
    E.Peters）的论文《海德格尔的他者化——论〈存在与时间〉中对身体和“主体间性”的批判》（Heidegger’s Embodied Others：On
    Critiques of the Body and “Intersubjectivity” in *Being and Time*）研究了加拉格尔与雅各布森在认知科学领域提出的有关海德格尔的“主体间性”的问题，后者认为海德格尔之《存在与时间》对主体间性的研究忽视了源始的主体间性：具身性交互，作者为之进行了辩护。[^(\[38\])](#chapter001.html#m38)查尔斯·戈登（Charles
    Guignon）的论文《身体、躯体感觉和生存性感觉：一种海德格尔视角》（The Body，Bodily Feelings，and Existential Feelings：A
    Heideggerian Perspective）考察了海德格尔对身体和以身体为基础的感觉的存在论分析。[^(\[39\])](#chapter001.html#m39)阿科伊贾姆·托伊比萨纳（Akoijam
    Thoibisana）的《海德格尔论此在作为习惯体的概念》（Heidegger on the Notion of Dasein as Habited Body，2015）一文对人们认为海德格尔忽视身体的观点进行了批判，他认为海德格尔在《存在与时间》中所讲的是一种活生生的身体（lived
    body），是对此在身体的现象学理解。克里斯蒂安·乔坎（Cristian Ciocan）的《论海德格尔对此在分析中的活身》（The Question of
    the Living Body in Heidegger’s Analytic of Dasein）分析了海德格尔对此在的存在论分析忽视身体的原因和意义。[^(\[40\])](#chapter001.html#m40)经过搜索后，我们发现国外关于海德格尔存在论哲学与身体问题的研究成果主要表现为论文形式，目前尚无相关专著，且主要是分析存在论哲学语境中的“身体”概念，对认知科学哲学语境下的“身体”研究比较薄弱，并没有将存在论分析与认知科学哲学的相关身体问题予以有效的结合，这恰好给我们提供了一种新的思路。


    ##### 2.海德格尔存在论现象学与认知科学的关系述评'
  fmt: '

    语言作为人类认知的一种特殊现象，一直受到哲学家们的关注，海德格尔的存在论哲学也对语言问题展开了独特的追问。国内目前的研究状况如下。冯凯迪的硕士学位论文《试论海德格尔的语言之思——基于语言与世界之关联的考察》从语言和世界的内在关联阐释了海德格尔的语言观，并分析了世界概念以及世界和语言的关系问题；[^(\[11\])](#chapter001.html#m11)谢文静的硕士学位论文《行走在“思”与“诗”的路上——海德格尔存在论的语言学诠释》在诗、语言和存在的框架下讨论了海德格尔语言和存在的关系；[^(\[12\])](#chapter001.html#m12)张贤根的《语言：区分与道路——海德格尔语言思想研究》论述了海德格尔在批判流俗语言和技术语言的基础上实现的语言转向，以及海德格尔为保持语言的纯粹性和本真性所作的努力，即区分诗意语言与技术语言，并利用前者克服后者；[^(\[13\])](#chapter001.html#m13)杨佑文的《海德格尔的“语言转向”及其语言观》一文探讨了海德格尔的“语言转向”及其意义，区分了他前期和后期语言观的差别；[^(\[14\])](#chapter001.html#m14)张海洋的《本体论语言哲学视域中的海德格尔语言观》批判了海德格尔前后期语言观，从“语言与此在”、“语言与意识世界”和“语言与存在”三个维度来澄清海德格尔语言观的本质；[^(\[15\])](#chapter001.html#m15)王锺陵的《论海德格尔的语言观》一文分析了海德格尔关于语言的“道说”概念与老庄哲学之谓道的异同。[^(\[16\])](#chapter001.html#m16)综上，我们看到，海德格尔对语言的理解以其“存在论”思想为理论基础，把对“存在”意义的追问作为其探究语言本质的出发点，海德格尔认为人如何通过意识世界认识外在世界正是语言意义的体现。“语言是存在自身既澄明又遮蔽的到来，因此语言是存在之家，人在其中生存着。”[^(\[17\])](#chapter001.html#m17)语言的本质既体现在语言与存在的关系中，也体现在语言与人和人的世界的关系中，语言的意义既离不开存在，也离不开人和人的世界。


    ### 4.关于认知的情绪问题


    与认知科学和心理学等学科对情绪的讨论不同，海德格尔对情绪的研究进路另辟蹊径，他是从此在生存论分析的角度考察此在在世的情绪问题的，国内学术界对此的研究主要集中在“畏”和“烦”两种情绪上。刘丰的硕士学位论文《论海德格尔的“根本情绪”——畏》论述了作为本体的情绪以及情绪的基本结构；[^(\[18\])](#chapter001.html#m18)张银华的硕士学位论文《海德格尔生存论中的情绪问题研究》通过分析与阐述“烦”与“畏”这两种情绪的本质和情绪的本真含义来寻找此在（人）在生存论中的结构性因素，以获得对此在的本真性认识；[^(\[19\])](#chapter001.html#m19)孙周兴的《为什么我们需要一种低沉的情绪？——海德格尔对哲学基本情绪的存在历史分析》一文以存在论方式分析了“惊恐”“压抑”“畏惧”三种时代的基本情绪，认为它们是极为重要的，对于哲学或者思想具有根本的“调音—规定”作用；[^(\[20\])](#chapter001.html#m20)肖庆生等的论文《海德格尔哲学中的情绪本体论探究》论述了此在的基本情绪——“操心”和本真情绪——“畏”，认为海德格尔的情绪本体论是一种具有颠覆性并影响深远的思想，并且揭示了其现实启示。[^(\[21\])](#chapter001.html#m21)综上，我们看到，海德格尔将情绪理解为此在的一种源始存在方式，此在是一种情绪性的存在者，这是它的又一特征。他说道：“在现身情态中此在总已被带到它自己面前来了，它总已经发现了它自己，不是那种有所感知地发现自己摆在眼前，而是带有情绪的自己现身。”[^(\[22\])](#chapter001.html#m22)因此，此在最初在情绪之中展开其存在和世界。海德格尔认为情绪具有两个主要环节：“烦”和“畏”。此在正是借助这两种情绪来揭示、把握此在本真的存在意义，他也正是通过对“畏”和“烦”两种情绪的细致分析厘清本真存在的确切含义。我们可以看到，海德格尔的情绪分析不属于认知科学的任务和范畴。


    ## （二）关于海德格尔式人工智能的问题


    近年来，人工智能的不断发展为人类的生产和生活带来了巨大的便利，但其自身也面临着诸多问题，哲学家出于自身责任对人工智能展开了批判和分析。有的哲学家，比如德雷福斯，利用海德格尔的现象学思想对人工智能的前景进行了深刻的反思，他将现象学与人工智能的具体技术紧密地结合在了一起。国内学者以德雷福斯的理论主张为基础，对他提出的“海德格尔式人工智能”（Heideggerian
    AI）进行了进一步的反思和批判。


    徐献军是较早关注这一问题的学者，他在2011年发表的《国外现象学与认知科学研究述评》中介绍了海德格尔式人工智能的初步研究，指出了现象学与认知科学之间合作的可能潜力。[^(\[23\])](#chapter001.html#m23)在其2013年发表的论文《海德格尔与计算机——兼论当代哲学与技术的理想关系》中，他论述了在海德格尔与计算机的联系的影响之下，计算机专家作出的一些改变，即以海德格尔哲学为基础构建新式的计算机系统的设计进路，包括威诺格拉德的存在主义设计、阿格勒的指示表征设计以及多罗西的具身交互设计。同时指出各自进路所具有的理论和实践意义。[^(\[24\])](#chapter001.html#m24)在《论德雷福斯、现象学与人工智能》一文中，作者对德雷福斯的哲学贡献作了描述，认为他的贡献主要有两部分：一是基于海德格尔的存在论现象学和梅洛-庞蒂身体现象学形成了自己的现象学哲学，二是成功地建立了现象学、计算机科学与人工智能等不同学科之间的联系。作者在对德雷福斯的思想进行分析后认为，德雷福斯的研究存在两个缺陷：一是对胡塞尔的评价有失公允，低估了胡塞尔对于人工智能和认知科学的重要程度；二是德雷福斯过于强调身体的重要性而忽视了意识。在作者看来，随着技术的进步，德雷福斯要求的人造身体可能会实现，但人和机器的本质区别不在于身体，而在于意识，使人工智能具有意识和心智，才是它成功的标志。问题在于，如果约翰·塞尔的生物自然主义是正确的，那么这种观点恰恰指出了意识、心智与身体构成的因果关系。目前看来，只有碳基构造的生命体才展现出了意识现象，人们有理由相信，身体才是产生意识和心理现象，甚至发展成智能的基础。[^(\[25\])](#chapter001.html#m25)


    在另一篇论文《德雷福斯对人工智能的批判仍然成立吗？》中，徐献军考察了德雷福斯对人工智能进行批判的哲学依据，同时力图回答在深度学习和强化学习长足发展的背景下，德雷福斯对人工智能批判的有效性问题。作者认为德雷福斯是立足于海德格尔和梅洛-庞蒂的现象学哲学对人工智能进行批判的，而且他对原有的现象学进行了改造，是“德雷福斯式的海德格尔与梅洛-庞蒂现象学”。在作者看来，人工智能的哲学假设是理性主义，是其哲学原则的极致演绎和实践化，人工智能的发展可能会面临传统理性主义与海德格尔—梅洛-庞蒂现象学之间的取舍。关于批判是否有效的问题，作者持正面态度，认为德雷福斯的批判到今天为止依然有效，他揭示出了束缚人工智能发展的哲学假设，这是至关重要的。[^(\[26\])](#chapter001.html#m26)


    王颖吉的论文《作为形而上学遗产的人工智能——休伯特·德雷福斯对人工智能的现象学批判》重温了德雷福斯关于人工智能的重要见解，论述了德雷福斯基于存在论现象学对经典人工智能的批判。作者汲取了海德格尔与梅洛-庞蒂现象学的重要观念，认为智能的实质是情境化和具身化的心智，指出未来人工智能的前景在于发展出一种去除表征、重视身体和情境且不依赖规则的智能形式。[^(\[27\])](#chapter001.html#m27)


    张昌盛的论文《人工理性批判：对德雷福斯的人工智能哲学的现象学反思》从德雷福斯关于人工智能极限的现象学分析入手，通过与塞尔的生物自然主义进行对比，作者认为德雷福斯诉诸海德格尔与梅洛-庞蒂现象学而提出的“海德格尔式人工智能”是优于表征主义式人工智能的，但不能应对认知科学的发展和生物自然主义所带来的挑战。因此，理解人工智能问题的关键是理解认知、智能和意识之间的关系，而涉及意识问题就不能不提及胡塞尔的先验现象学，德雷福斯恰恰在这一点上误解了胡塞尔。人工智能的本质是对人类认知和智能的揭示，是对意识的重新思考。[^(\[28\])](#chapter001.html#m28)


    段似膺的论文《海德格尔式人工智能及其对“意识”问题的反思——兼与何怀宏先生商榷》探讨在海德格尔式人工智能中再现“意识”的问题。作者认为，虽然海德格尔式人工智能改变了以往传统的符号表征模式，并以生物和日常世界间的交互活动为基础，但它依然会面临强人工智能遇到的困境，即人类是以身体为中介在诸多情境中直接把握意义的，人与世界打交道的方式之基础在于他的身体存在，人工智能与人类的本质区别在于身体而非意识，关键是没有依托“在世存在”的“身体—意识”。[^(\[29\])](#chapter001.html#m29)


    陶锋的论文《人工智能语言的哲学阐释》从海德格尔存在论的视角出发，探讨了人工智能语言面临的根本难题。作者认为，人工智能语言是一种技术语言，而技术语言是抽象的逻辑演算的公式，它遮蔽了存在者的现象和显现，因此人工智能永远无法实现本真的语言（诗的语言）。基于海德格尔的语言观，作者认为人工智能不会像人一样独立地获得语言，因为前者不具有生存论意义上的超越、领会和情绪，无法像人一样体会语言的本质，也没有类似于人的言谈能力。[^(\[30\])](#chapter001.html#m30)


    夏永红在《人工智能的创造性与自主性——论德雷福斯对新派人工智能的批判》一文中梳理和考察了德雷福斯对人工神经网络和具身人工智能的批判。作者认为德雷福斯已有的批判缺乏必要的理论基础和理论指引，因而流于单纯的技术评估。通过引入德雷福斯对本真性这一海德格尔哲学概念的重新阐释，作者力图从生存论层次阐明人工智能的创造性和自主性的先验条件：两者都奠基于生命的脆弱性。作者将人工智能不具有完全智能的根本原因归于它缺乏人类本身具有的自主性和创造性，缺乏一个脆弱的活生生的身体，指出人工智能研究的前景在于人工与生命的结合。[^(\[31\])](#chapter001.html#m31)


    朱清华的论文《德雷福斯与海德格尔式人工智能》考察了海德格尔式人工智能如何应对框架问题这一难题。首先，作者论述了德雷福斯对人工智能具有的四个形而上学假设的批评。其次，作者区分了海德格尔式人工智能的三个发展阶段：①基于行为的机器人学；②给上手状态编程；③虚拟的海德格尔式人工智能，并指出了海德格尔式人工智能在解决框架问题时的缺陷，认为它不足以彻底地解决框架问题。最后，作者考察了德雷福斯对人工智能批判的有效性问题，认为德雷福斯的批判关乎更为根本的问题，即人根本的思维和行动方式是否为概念性和表征性的。他认为德雷福斯的批判在哲学上是站得住脚的，海德格尔对“在世存在”的本质描述可以作为人工智能发展的一个参照系。[^(\[32\])](#chapter001.html#m32)


    李日荣的《海德格尔的时间性此在与人工智能发展的自主性难题——兼论德雷福斯人工智能批判的局限性》一文从此在的本真性和自主性的视角出发，认为德雷福斯对人工智能的批判未能看到海德格尔对人类智能本质的完整揭示，其本质介于形式与非形式之间，人工智能的正确发展方向应当是能够揭示人类智能形式与非形式化特征的融合统一，呈现二者之间的“关联领域”。[^(\[33\])](#chapter001.html#m33)


    同时，国外学界对海德格尔哲学与人工智能的讨论也具有一定热度，时间的跨度比国内学界要更大。贝斯·普雷斯顿（Beth Preston）在论文《海德格尔与人工智能》（Heidegger
    and Artificial Intelligence）中指出，海德格尔式人工智能并非将“表征”和“计算”作为核心概念，而是以社会性为本质特征，它从根本上对立于认知主义，智能的涌现在于同外在环境的交互，而非神经元的联结。[^(\[34\])](#chapter001.html#m34)卡罗斯·埃雷拉（Carlos
    Herrera）与里卡多·桑斯（Ricardo Sanz）在论文《海德格尔式AI与机器人的存在》（Heideggerian AI and the Being
    of Robots）中认为，海德格尔对人类（此在）的生存论分析并不适用于人工系统，因为海德格尔的存在论哲学否认机器人或人工智能具有与人类相同类别的存在论意义。他们对人工系统进行了海德格尔式的存在论分析，认为机器人或人工智能是一种特殊的、不同于人类和动物的存在者，是执行人类劳动的机器。对人工智能或机器人进行存在论分析是一项艰巨的挑战，作者认为海德格尔式人工智能的任务在于为制造智能机器提供智力方面的支持。[^(\[35\])](#chapter001.html#m35)查理塔（Mario
    Andrés Chalita）和塞泽拉兹（Alexander Sedzielarz）的论文《超越框架问题：海德格尔对AI的贡献》［Beyond the Frame
    Problem：What （Else） Can Heidegger Do for AI？］对海德格尔哲学是否可以作为人工智能的思想来源进行考察：如果海德格尔启发的认知科学是可能的，那么这种科学应该聚焦于存在论的差异，而不是海德格尔思想中的任何其他特征。[^(\[36\])](#chapter001.html#m36)


    我们看到，将海德格尔哲学应用于人工智能成了当前的一个研究热点，由于德雷福斯是利用海德格尔哲学批判人工智能的先驱和集大成者，因此，国内学者首先关注的是德雷福斯从存在论现象学角度对经典人工智能的批判，并在其基础上作进一步的分析和再批判，关注的侧重点包括意识问题、框架问题以及人工智能的形而上学预设等。可以说，国内学者几乎是以德雷福斯的批判为依托来展开自己的分析研究的，特别是后者在《计算机不能做什么：人工智能的极限》一书中提出的关于传统人工智能的四个假设：①生物学假设、②心理学假设、③认识论假设以及④本体论假设。[^(\[37\])](#chapter001.html#m37)这四种假设至今仍在对我们的研究产生影响。总体看来，国内学者在相关方面的研究似乎仍旧没有脱离德雷福斯，集中于对计算机的无身性（disebodied）、非情境性特征的批判，没有对海德格尔式人工智能作出具体、清晰的描述和定义。我们认为，德雷福斯的批判是否仍然有效，需要结合人工智能最新的研究成果来予以审视，并以此来判断海德格尔式人工智能的适应性，不能简单、匆忙地作出海德格尔式人工智能已经过时的结论。


    ## （三）其他学者将存在论哲学与认知科学相结合的研究状况


    ### 1.第二代认知科学研究纲领与存在论哲学的关系述评


    在对第一代研究纲领的认知主义、联结主义进行反思与批判的背景下，以“4E+S”为核心的第二代认知科学研究纲领应运而生，后者注重身体和情境在认知过程中的作用，强调主体与环境的交互作用与过程。其主要进路包括具身认知（embodied
    cognition）、延展认知（extended cognition）、生成认知（enactive cognition）、嵌入认知（embedded cognition）以及情境认知（situated
    cognition）。后四种进路实质上是具身认知的不同形式，但这四种认知理论与存在论现象学的关系并不密切，只是在关于具身认知的“身体”概念方面，国外学界进行了较为细致的研究。


    关于具身认知的研究和探讨，国内学界主要是围绕其与以计算—表征为核心的正统认知科学之间的争论展开，有的从现象学角度加以论述，有的则从认知心理学角度进行探究，但还没有人从海德格尔存在论哲学的角度介入具身认知理论。讨论“身体”概念的论文也非常少，原因可能在于海德格尔本人不太重视身体问题，在《存在与时间》和其他著作中没有对身体予以适当的哲学分析。在海德格尔看来身体只是空间性的物体，没有独特的存在论地位。相比于国内，国外学者的讨论和研究要热烈、深刻得多。埃德加·E.彼得斯（Meindert
    E.Peters）的论文《海德格尔的他者化——论〈存在与时间〉中对身体和“主体间性”的批判》（Heidegger’s Embodied Others：On
    Critiques of the Body and “Intersubjectivity” in *Being and Time*）研究了加拉格尔与雅各布森在认知科学领域提出的有关海德格尔的“主体间性”的问题，后者认为海德格尔之《存在与时间》对主体间性的研究忽视了源始的主体间性：具身性交互，作者为之进行了辩护。[^(\[38\])](#chapter001.html#m38)查尔斯·戈登（Charles
    Guignon）的论文《身体、躯体感觉和生存性感觉：一种海德格尔视角》（The Body，Bodily Feelings，and Existential Feelings：A
    Heideggerian Perspective）考察了海德格尔对身体和以身体为基础的感觉的存在论分析。[^(\[39\])](#chapter001.html#m39)阿科伊贾姆·托伊比萨纳（Akoijam
    Thoibisana）的《海德格尔论此在作为习惯体的概念》（Heidegger on the Notion of Dasein as Habited Body，2015）一文对人们认为海德格尔忽视身体的观点进行了批判，他认为海德格尔在《存在与时间》中所讲的是一种活生生的身体（lived
    body），是对此在身体的现象学理解。克里斯蒂安·乔坎（Cristian Ciocan）的《论海德格尔对此在分析中的活身》（The Question of
    the Living Body in Heidegger’s Analytic of Dasein）分析了海德格尔对此在的存在论分析忽视身体的原因和意义。[^(\[40\])](#chapter001.html#m40)经过搜索后，我们发现国外关于海德格尔存在论哲学与身体问题的研究成果主要表现为论文形式，目前尚无相关专著，且主要是分析存在论哲学语境中的“身体”概念，对认知科学哲学语境下的“身体”研究比较薄弱，并没有将存在论分析与认知科学哲学的相关身体问题予以有效的结合，这恰好给我们提供了一种新的思路。


    ### 2.海德格尔存在论现象学与认知科学的关系述评

    '
  trans: '


    语言作为人类认知的一种特殊现象，一直受到哲学家们的关注，海德格尔的存在论哲学也对语言问题展开了独特的追问。国内目前的研究状况如下。冯凯迪的硕士学位论文《试论海德格尔的语言之思——基于语言与世界之关联的考察》从语言和世界的内在关联阐释了海德格尔的语言观，并分析了世界概念以及世界和语言的关系问题；[^(\[11\])](#chapter001.html#m11)谢文静的硕士学位论文《行走在“思”与“诗”的路上——海德格尔存在论的语言学诠释》在诗、语言和存在的框架下讨论了海德格尔语言和存在的关系；[^(\[12\])](#chapter001.html#m12)张贤根的《语言：区分与道路——海德格尔语言思想研究》论述了海德格尔在批判流俗语言和技术语言的基础上实现的语言转向，以及海德格尔为保持语言的纯粹性和本真性所作的努力，即区分诗意语言与技术语言，并利用前者克服后者；[^(\[13\])](#chapter001.html#m13)杨佑文的《海德格尔的“语言转向”及其语言观》一文探讨了海德格尔的“语言转向”及其意义，区分了他前期和后期语言观的差别；[^(\[14\])](#chapter001.html#m14)张海洋的《本体论语言哲学视域中的海德格尔语言观》批判了海德格尔前后期语言观，从“语言与此在”、“语言与意识世界”和“语言与存在”三个维度来澄清海德格尔语言观的本质；[^(\[15\])](#chapter001.html#m15)王锺陵的《论海德格尔的语言观》一文分析了海德格尔关于语言的“道说”概念与老庄哲学之谓道的异同。[^(\[16\])](#chapter001.html#m16)综上，我们看到，海德格尔对语言的理解以其“存在论”思想为理论基础，把对“存在”意义的追问作为其探究语言本质的出发点，海德格尔认为人如何通过意识世界认识外在世界正是语言意义的体现。“语言是存在自身既澄明又遮蔽的到来，因此语言是存在之家，人在其中生存着。”[^(\[17\])](#chapter001.html#m17)语言的本质既体现在语言与存在的关系中，也体现在语言与人和人的世界的关系中，语言的意义既离不开存在，也离不开人和人的世界。


    ### 4.关于认知的情绪问题


    与认知科学和心理学等学科对情绪的讨论不同，海德格尔对情绪的研究进路另辟蹊径，他是从此在生存论分析的角度考察此在在世的情绪问题的，国内学术界对此的研究主要集中在“畏”和“烦”两种情绪上。刘丰的硕士学位论文《论海德格尔的“根本情绪”——畏》论述了作为本体的情绪以及情绪的基本结构；[^(\[18\])](#chapter001.html#m18)张银华的硕士学位论文《海德格尔生存论中的情绪问题研究》通过分析与阐述“烦”与“畏”这两种情绪的本质和情绪的本真含义来寻找此在（人）在生存论中的结构性因素，以获得对此在的本真性认识；[^(\[19\])](#chapter001.html#m19)孙周兴的《为什么我们需要一种低沉的情绪？——海德格尔对哲学基本情绪的存在历史分析》一文以存在论方式分析了“惊恐”“压抑”“畏惧”三种时代的基本情绪，认为它们是极为重要的，对于哲学或者思想具有根本的“调音—规定”作用；[^(\[20\])](#chapter001.html#m20)肖庆生等的论文《海德格尔哲学中的情绪本体论探究》论述了此在的基本情绪——“操心”和本真情绪——“畏”，认为海德格尔的情绪本体论是一种具有颠覆性并影响深远的思想，并且揭示了其现实启示。[^(\[21\])](#chapter001.html#m21)综上，我们看到，海德格尔将情绪理解为此在的一种源始存在方式，此在是一种情绪性的存在者，这是它的又一特征。他说道：“在现身情态中此在总已被带到它自己面前来了，它总已经发现了它自己，不是那种有所感知地发现自己摆在眼前，而是带有情绪的自己现身。”[^(\[22\])](#chapter001.html#m22)因此，此在最初在情绪之中展开其存在和世界。海德格尔认为情绪具有两个主要环节：“烦”和“畏”。此在正是借助这两种情绪来揭示、把握此在本真的存在意义，他也正是通过对“畏”和“烦”两种情绪的细致分析厘清本真存在的确切含义。我们可以看到，海德格尔的情绪分析不属于认知科学的任务和范畴。


    ## （二）关于海德格尔式人工智能的问题


    近年来，人工智能的不断发展为人类的生产和生活带来了巨大的便利，但其自身也面临着诸多问题，哲学家出于自身责任对人工智能展开了批判和分析。有的哲学家，比如德雷福斯，利用海德格尔的现象学思想对人工智能的前景进行了深刻的反思，他将现象学与人工智能的具体技术紧密地结合在了一起。国内学者以德雷福斯的理论主张为基础，对他提出的“海德格尔式人工智能”（Heideggerian
    AI）进行了进一步的反思和批判。


    徐献军是较早关注这一问题的学者，他在 2011 年发表的《国外现象学与认知科学研究述评》中介绍了海德格尔式人工智能的初步研究，指出了现象学与认知科学之间合作的可能潜力。[^(\[23\])](#chapter001.html#m23)在其
    2013 年发表的论文《海德格尔与计算机——兼论当代哲学与技术的理想关系》中，他论述了在海德格尔与计算机的联系的影响之下，计算机专家作出的一些改变，即以海德格尔哲学为基础构建新式的计算机系统的设计进路，包括威诺格拉德的存在主义设计、阿格勒的指示表征设计以及多罗西的具身交互设计。同时指出各自进路所具有的理论和实践意义。[^(\[24\])](#chapter001.html#m24)在《论德雷福斯、现象学与人工智能》一文中，作者对德雷福斯的哲学贡献作了描述，认为他的贡献主要有两部分：一是基于海德格尔的存在论现象学和梅洛-庞蒂身体现象学形成了自己的现象学哲学，二是成功地建立了现象学、计算机科学与人工智能等不同学科之间的联系。作者在对德雷福斯的思想进行分析后认为，德雷福斯的研究存在两个缺陷：一是对胡塞尔的评价有失公允，低估了胡塞尔对于人工智能和认知科学的重要程度；二是德雷福斯过于强调身体的重要性而忽视了意识。在作者看来，随着技术的进步，德雷福斯要求的人造身体可能会实现，但人和机器的本质区别不在于身体，而在于意识，使人工智能具有意识和心智，才是它成功的标志。问题在于，如果约翰·塞尔的生物自然主义是正确的，那么这种观点恰恰指出了意识、心智与身体构成的因果关系。目前看来，只有碳基构造的生命体才展现出了意识现象，人们有理由相信，身体才是产生意识和心理现象，甚至发展成智能的基础。[^(\[25\])](#chapter001.html#m25)


    在另一篇论文《德雷福斯对人工智能的批判仍然成立吗？》中，徐献军考察了德雷福斯对人工智能进行批判的哲学依据，同时力图回答在深度学习和强化学习长足发展的背景下，德雷福斯对人工智能批判的有效性问题。作者认为德雷福斯是立足于海德格尔和梅洛-庞蒂的现象学哲学对人工智能进行批判的，而且他对原有的现象学进行了改造，是“德雷福斯式的海德格尔与梅洛-庞蒂现象学”。在作者看来，人工智能的哲学假设是理性主义，是其哲学原则的极致演绎和实践化，人工智能的发展可能会面临传统理性主义与海德格尔—梅洛-庞蒂现象学之间的取舍。关于批判是否有效的问题，作者持正面态度，认为德雷福斯的批判到今天为止依然有效，他揭示出了束缚人工智能发展的哲学假设，这是至关重要的。[^(\[26\])](#chapter001.html#m26)


    王颖吉的论文《作为形而上学遗产的人工智能——休伯特·德雷福斯对人工智能的现象学批判》重温了德雷福斯关于人工智能的重要见解，论述了德雷福斯基于存在论现象学对经典人工智能的批判。作者汲取了海德格尔与梅洛-庞蒂现象学的重要观念，认为智能的实质是情境化和具身化的心智，指出未来人工智能的前景在于发展出一种去除表征、重视身体和情境且不依赖规则的智能形式。[^(\[27\])](#chapter001.html#m27)


    张昌盛的论文《人工理性批判：对德雷福斯的人工智能哲学的现象学反思》从德雷福斯关于人工智能极限的现象学分析入手，通过与塞尔的生物自然主义进行对比，作者认为德雷福斯诉诸海德格尔与梅洛-庞蒂现象学而提出的“海德格尔式人工智能”是优于表征主义式人工智能的，但不能应对认知科学的发展和生物自然主义所带来的挑战。因此，理解人工智能问题的关键是理解认知、智能和意识之间的关系，而涉及意识问题就不能不提及胡塞尔的先验现象学，德雷福斯恰恰在这一点上误解了胡塞尔。人工智能的本质是对人类认知和智能的揭示，是对意识的重新思考。[^(\[28\])](#chapter001.html#m28)


    段似膺的论文《海德格尔式人工智能及其对“意识”问题的反思——兼与何怀宏先生商榷》探讨在海德格尔式人工智能中再现“意识”的问题。作者认为，虽然海德格尔式人工智能改变了以往传统的符号表征模式，并以生物和日常世界间的交互活动为基础，但它依然会面临强人工智能遇到的困境，即人类是以身体为中介在诸多情境中直接把握意义的，人与世界打交道的方式之基础在于他的身体存在，人工智能与人类的本质区别在于身体而非意识，关键是没有依托“在世存在”的“身体—意识”。[^(\[29\])](#chapter001.html#m29)


    陶锋的论文《人工智能语言的哲学阐释》从海德格尔存在论的视角出发，探讨了人工智能语言面临的根本难题。作者认为，人工智能语言是一种技术语言，而技术语言是抽象的逻辑演算的公式，它遮蔽了存在者的现象和显现，因此人工智能永远无法实现本真的语言（诗的语言）。基于海德格尔的语言观，作者认为人工智能不会像人一样独立地获得语言，因为前者不具有生存论意义上的超越、领会和情绪，无法像人一样体会语言的本质，也没有类似于人的言谈能力。[^(\[30\])](#chapter001.html#m30)


    夏永红在《人工智能的创造性与自主性——论德雷福斯对新派人工智能的批判》一文中梳理和考察了德雷福斯对人工神经网络和具身人工智能的批判。作者认为德雷福斯已有的批判缺乏必要的理论基础和理论指引，因而流于单纯的技术评估。通过引入德雷福斯对本真性这一海德格尔哲学概念的重新阐释，作者力图从生存论层次阐明人工智能的创造性和自主性的先验条件：两者都奠基于生命的脆弱性。作者将人工智能不具有完全智能的根本原因归于它缺乏人类本身具有的自主性和创造性，缺乏一个脆弱的活生生的身体，指出人工智能研究的前景在于人工与生命的结合。[^(\[31\])](#chapter001.html#m31)


    朱清华的论文《德雷福斯与海德格尔式人工智能》考察了海德格尔式人工智能如何应对框架问题这一难题。首先，作者论述了德雷福斯对人工智能具有的四个形而上学假设的批评。其次，作者区分了海德格尔式人工智能的三个发展阶段：①基于行为的机器人学；②给上手状态编程；③虚拟的海德格尔式人工智能，并指出了海德格尔式人工智能在解决框架问题时的缺陷，认为它不足以彻底地解决框架问题。最后，作者考察了德雷福斯对人工智能批判的有效性问题，认为德雷福斯的批判关乎更为根本的问题，即人根本的思维和行动方式是否为概念性和表征性的。他认为德雷福斯的批判在哲学上是站得住脚的，海德格尔对“在世存在”的本质描述可以作为人工智能发展的一个参照系。[^(\[32\])](#chapter001.html#m32)


    李日荣的《海德格尔的时间性此在与人工智能发展的自主性难题——兼论德雷福斯人工智能批判的局限性》一文从此在的本真性和自主性的视角出发，认为德雷福斯对人工智能的批判未能看到海德格尔对人类智能本质的完整揭示，其本质介于形式与非形式之间，人工智能的正确发展方向应当是能够揭示人类智能形式与非形式化特征的融合统一，呈现二者之间的“关联领域”。[^(\[33\])](#chapter001.html#m33)


    同时，国外学界对海德格尔哲学与人工智能的讨论也具有一定热度，时间的跨度比国内学界要更大。贝斯·普雷斯顿（Beth Preston）在论文《海德格尔与人工智能》（Heidegger
    and Artificial Intelligence）中指出，海德格尔式人工智能并非将“表征”和“计算”作为核心概念，而是以社会性为本质特征，它从根本上对立于认知主义，智能的涌现在于同外在环境的交互，而非神经元的联结。[^(\[34\])](#chapter001.html#m34)卡罗斯·埃雷拉（Carlos
    Herrera）与里卡多·桑斯（Ricardo Sanz）在论文《海德格尔式 AI 与机器人的存在》（Heideggerian AI and the Being
    of Robots）中认为，海德格尔对人类（此在）的生存论分析并不适用于人工系统，因为海德格尔的存在论哲学否认机器人或人工智能具有与人类相同类别的存在论意义。他们对人工系统进行了海德格尔式的存在论分析，认为机器人或人工智能是一种特殊的、不同于人类和动物的存在者，是执行人类劳动的机器。对人工智能或机器人进行存在论分析是一项艰巨的挑战，作者认为海德格尔式人工智能的任务在于为制造智能机器提供智力方面的支持。[^(\[35\])](#chapter001.html#m35)查理塔（Mario
    Andrés Chalita）和塞泽拉兹（Alexander Sedzielarz）的论文《超越框架问题：海德格尔对 AI 的贡献》［Beyond the
    Frame Problem：What （Else） Can Heidegger Do for AI？］对海德格尔哲学是否可以作为人工智能的思想来源进行考察：如果海德格尔启发的认知科学是可能的，那么这种科学应该聚焦于存在论的差异，而不是海德格尔思想中的任何其他特征。[^(\[36\])](#chapter001.html#m36)


    我们看到，将海德格尔哲学应用于人工智能成了当前的一个研究热点，由于德雷福斯是利用海德格尔哲学批判人工智能的先驱和集大成者，因此，国内学者首先关注的是德雷福斯从存在论现象学角度对经典人工智能的批判，并在其基础上作进一步的分析和再批判，关注的侧重点包括意识问题、框架问题以及人工智能的形而上学预设等。可以说，国内学者几乎是以德雷福斯的批判为依托来展开自己的分析研究的，特别是后者在《计算机不能做什么：人工智能的极限》一书中提出的关于传统人工智能的四个假设：①生物学假设、②心理学假设、③认识论假设以及④本体论假设。[^(\[37\])](#chapter001.html#m37)这四种假设至今仍在对我们的研究产生影响。总体看来，国内学者在相关方面的研究似乎仍旧没有脱离德雷福斯，集中于对计算机的无身性（disebodied）、非情境性特征的批判，没有对海德格尔式人工智能作出具体、清晰的描述和定义。我们认为，德雷福斯的批判是否仍然有效，需要结合人工智能最新的研究成果来予以审视，并以此来判断海德格尔式人工智能的适应性，不能简单、匆忙地作出海德格尔式人工智能已经过时的结论。


    ## （三）其他学者将存在论哲学与认知科学相结合的研究状况


    ### 1.第二代认知科学研究纲领与存在论哲学的关系述评


    在对第一代研究纲领的认知主义、联结主义进行反思与批判的背景下，以“4E+S”为核心的第二代认知科学研究纲领应运而生，后者注重身体和情境在认知过程中的作用，强调主体与环境的交互作用与过程。其主要进路包括具身认知（embodied
    cognition）、延展认知（extended cognition）、生成认知（enactive cognition）、嵌入认知（embedded cognition）以及情境认知（situated
    cognition）。后四种进路实质上是具身认知的不同形式，但这四种认知理论与存在论现象学的关系并不密切，只是在关于具身认知的“身体”概念方面，国外学界进行了较为细致的研究。


    关于具身认知的研究和探讨，国内学界主要是围绕其与以计算—表征为核心的正统认知科学之间的争论展开，有的从现象学角度加以论述，有的则从认知心理学角度进行探究，但还没有人从海德格尔存在论哲学的角度介入具身认知理论。讨论“身体”概念的论文也非常少，原因可能在于海德格尔本人不太重视身体问题，在《存在与时间》和其他著作中没有对身体予以适当的哲学分析。在海德格尔看来身体只是空间性的物体，没有独特的存在论地位。相比于国内，国外学者的讨论和研究要热烈、深刻得多。埃德加·E.彼得斯（Meindert
    E.Peters）的论文《海德格尔的他者化——论〈存在与时间〉中对身体和“主体间性”的批判》（Heidegger’s Embodied Others：On
    Critiques of the Body and “Intersubjectivity” in *Being and Time*）研究了加拉格尔与雅各布森在认知科学领域提出的有关海德格尔的“主体间性”的问题，后者认为海德格尔之《存在与时间》对主体间性的研究忽视了源始的主体间性：具身性交互，作者为之进行了辩护。[^(\[38\])](#chapter001.html#m38)查尔斯·戈登（Charles
    Guignon）的论文《身体、躯体感觉和生存性感觉：一种海德格尔视角》（The Body，Bodily Feelings，and Existential Feelings：A
    Heideggerian Perspective）考察了海德格尔对身体和以身体为基础的感觉的存在论分析。[^(\[39\])](#chapter001.html#m39)阿科伊贾姆·托伊比萨纳（Akoijam
    Thoibisana）的《海德格尔论此在作为习惯体的概念》（Heidegger on the Notion of Dasein as Habited Body，2015）一文对人们认为海德格尔忽视身体的观点进行了批判，他认为海德格尔在《存在与时间》中所讲的是一种活生生的身体（lived
    body），是对此在身体的现象学理解。克里斯蒂安·乔坎（Cristian Ciocan）的《论海德格尔对此在分析中的活身》（The Question of
    the Living Body in Heidegger’s Analytic of Dasein）分析了海德格尔对此在的存在论分析忽视身体的原因和意义。[^(\[40\])](#chapter001.html#m40)经过搜索后，我们发现国外关于海德格尔存在论哲学与身体问题的研究成果主要表现为论文形式，目前尚无相关专著，且主要是分析存在论哲学语境中的“身体”概念，对认知科学哲学语境下的“身体”研究比较薄弱，并没有将存在论分析与认知科学哲学的相关身体问题予以有效的结合，这恰好给我们提供了一种新的思路。


    ### 2.海德格尔存在论现象学与认知科学的关系述评


