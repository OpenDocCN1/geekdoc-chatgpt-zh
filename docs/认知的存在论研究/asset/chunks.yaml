    # 海德格尔哲学与认知科学研究综述


    ## 国内研究现状


    近年来，欧洲大陆哲学在认知科学中的作用日益为当代西方学术界所重视，随着认知科学研究的深入发展，海德格尔哲学引起了认知科学家、人工智能学者和哲学家的广泛关注，人们开始研究海德格尔哲学对认知科学研究的反思和批判启示。然而，国内学界对这一领域的研究还做得很不够，相关论文只有刘晓力和孟伟的论文《认知科学哲学基础的转换——从笛卡儿到海德格尔》，文章认为海德格尔认知观可以为认知科学的研究提供一种新的构成性解释，并主张一种涉身—嵌入式认知科学研究纲领。[^(\[41\])](#chapter001.html#m41)兰州大学孙冠臣的论文《从表象主义到现象主义——认知语境中的“存在问题”》探讨了胡塞尔与海德格尔各自关于认知的现象主义观点，认为只有将认知彻底还原为存在、生存，才能避免主体与客体二分所造成的理论困境，进而有效应对怀疑论的挑战。[^(\[42\])](#chapter001.html#m42)北京航空航天大学韩连庆在其论文《哲学与科学的短路——德雷福斯人工智能批判的局限》中引用齐泽克的观点，认为德雷福斯主张的海德格尔式认知主义（Heideggerian
    cognitivism）将哲学化约为科学，造成“哲学与科学的短路”，从而错失哲学真正的超越论维度。[^(\[43\])](#chapter001.html#m43)孟伟与杨之林《涉身认知的外在主义解释与人工智能的未来发展》认为海德格尔的具身性理念支撑了涉身认知的外在主义解释框架，其主要是两个观念：“上手状态”与“顺应于事的视”。“上手状态”描述了人的原初认知状态，“顺应于事情的视”是一种生于情境、面向行动且不断引导行动的意识状态。[^(\[44\])](#chapter001.html#m44)刘晓力与孟伟合著的《认知科学前沿中的哲学问题》（2014）用一小节的篇幅探讨了海德格尔与认知发展的关系，介绍了海德格尔对日常认知的内在机制和外在情境的描述。[^(\[45\])](#chapter001.html#m45)这是国内为数不多谈及存在论哲学与认知科学的文献。我们看到，国内学界在这方面的研究并不系统，比较零散，停留于对某些概念的说明，缺少一种整体主义的视角。


    ## 国外研究现状


    ### 《哲学与认知科学的新方向：海德格尔与认知科学》


    相比之下，国外学界在这一研究领域则要活跃得多。在著作方面，迈克尔·惠勒（Michael Wheeler）与朱利安·基弗斯坦因（Julian Kiverstein）主编的《哲学与认知科学的新方向：海德格尔与认知科学》（*New
    Directions in Philosophy and Cognitive Science：Heidegger and Cognitive Science*）一书是国外学者将海德格尔哲学与认知科学相结合取得的成果，共包含11篇论文，论述的主题都不相同，故而对每一篇论文进行概述。


    朱利安·基弗斯坦因的论文《何为海德格尔式认知科学？》（What Is Heideggerian Cognitive Science？）主要论述了海德格尔哲学给予认知科学的启示与经验，认为海德格尔的存在论哲学，尤其是对“在世存在”的存在状态的探讨可以作为新一代认知科学研究纲领的哲学基础。作者在深入批判以笛卡尔主义为基础的第一代认知科学研究纲领，特别是以符号操作为核心的老式有效人工智能（GOFAI）的基础上，研究了海德格尔式认知科学的优势以及它在某些理论方面的不足。作者认为认知科学的海德格尔范式优于甚至可以取代笛卡尔范式，要做到这一点，需要证明当今认知科学中有比老式有效人工智能更为出色的替代选项，此外还必须证明这一新的范式不会受到框架问题的影响，并且可以使人们理解“在世存在”这一人类存在的基本方式。这篇论文相当于该书的导论，作者对后述章节的内容作了简要介绍，并以海德格尔哲学的视角解释了当今盛行的4EA（具身认知、延展认知、生成认知、嵌入认知以及情感认知）认知模式内部关于“具身性”（embodiment）与“嵌入性”（embeddedness）的争论，并且认为4EA认知科学的发展方式符合海德格尔现象学。


    休伯特·德雷福斯的论文《为什么海德格尔化的人工智能会失败，以及修复人工智能需要让人工智能更加海德格尔化》（Why Heideggerian AI Failed
    and How Fixing It would Require Making It More Heideggerian）探讨了人工智能与哲学的关系，尤其深入研究了如何以海德格尔哲学解决符号主义AI所面临的困境与难题，并研究了海德格尔式AI如何消解框架问题。在他看来，前者由于无法解决常识困境和框架问题因而是一种退化的研究方案，主张接受海德格尔对笛卡尔内在表征的批判：认知是嵌入和具身的。


    马修·拉特克里夫（Matthew Ratcliffe）的论文《不可能有此在的认知科学》（There Can Be No Cognitive Science
    of Dasein）讨论了积极的海德格尔进路在认知科学与人工智能领域内的前景，提出了“海德格尔认知科学”的哲学概念，并证明其早期哲学观点并不和自然主义相容，认为利用认知科学术语来理解“在世存在”是非常荒谬的。因为经验科学根本不能解释人类的存在方式，所以借助认知科学理解“此在”是一种拙劣的想法，海德格尔哲学至少在某些主题上并不完全适用于认知科学。


    安德里亚·雷贝格（Andrea Rehberg）的论文《海德格尔与疑难反思下的认知科学》（Heidegger and Cognitive Science-Aporetic
    Reflections）讨论了认知科学的新模式——“具身—嵌入式认知模型”，主张在利用海德格尔改进新的认知模型时不应忽视一些深层次的基础问题，例如“什么是‘此在’”。这一问题又可延伸出何为“此在”的本真与非本真状态、什么是“此在”的被抛、沉沦和事实性、什么是“此在”的决断（resoluteness）和展开（disclosedness）以及“此在”的绽-出（ek-sists）方式，最重要的是“此在”对存在的前理解等诸多问题。关于“此在”的绽-出以及相关的存在形式［在之中（being-in）、共在（being-with）和朝向存在（being-towards）等］的分析明确地表明对认知的传统解释没有考虑“此在”基本的生存状况，全部知识只有通过对“此在”的基本处境进行艰苦的抽象才有可能获得。此外，作者还重点论述了海德格尔对语言的存在论性质的反思，主张为了理解海德格尔的存在论思维，必须认识到语言在其中的关键作用，而且其本质上不包含任何单纯的工具概念性。


    迈克尔·惠勒的论文《自然化此在和其他被指控的异端》（Naturalizing Dasein and Other Alleged Heresies）的主要目的是为自己的海德格尔式认知科学进行辩护，尤其是回应拉特克里夫之前的论断：不存在关于“此在”的认知科学。前者主张海德格尔式认知科学与自然主义是不兼容的，惠勒针锋相对地指出，合理地对待认知科学的丰富多样的研究方案需要从根本上承认彻底的自然主义和人类心理现象相关。而且任何与认知科学相结合的心灵哲学与认知哲学，其形式都是自然主义的。他认为在某种程度上，一门真正的海德格尔式认知科学能够将海德格尔的哲学框架和关于心灵、智能、思维以及行动的认知科学进路的基本特征予以系统结合。作者还探讨了海德格尔的诠释学现象学框架与认知科学间的关系问题。此外，惠勒也针对德雷福斯和里特维德（Rietveld）的批评进行了辩护，重点论述了海德格尔认知科学的相关性问题。他认为我们可以通过结合海德格尔现象学来消除相关性问题，并且洞察到易受相关性影响的活动的可能性条件，以及一门由经验充分支持的认知科学，进而从机械、因果解释的角度理解现象学解释。在相关性问题上，惠勒区分了内在语境敏感性（intra-context
    sensitivity）和区间语境敏感性（inter-context-sensitivity），并针对里特维德的批判进行了有力的辩护。


    加拉格尔（Shaun Gallagher）与雅各布森（Rebecca Seté Jacobson）的论文《海德格尔与社会认知》（Heidegger and
    Social Cognition）主要讨论了海德格尔哲学与社会认知的关系问题，作者认为海德格尔对共在（being-with）的分析较当代认知科学中的标准和主导性理论能够更充分地描述社会认知，然而其同时认为海德格尔对共在的分析不够深入，这也为我们理解上手状态提供了某些启示。加拉格尔认为海德格尔对共在的存在论分析包含着基本的主体间性过程，以及由此衍生的社会认知。认为共在是“此在”原初的存在论结构，不是外在的附属物，而且与世界内其他人的存在无关，正是“此在”的共在使他人的存在具有意义。在作者看来，海德格尔对共在的存在论分析可以支持现象学对当代社会认知解释的批判。作者在整篇文章所要表达的核心论点是，海德格尔的存在论分析未能说明原初的交互主体性这一现象，他留下的是一个关于次级交互主体性和共在的贫乏概念，以及让人难以理解的本真性联系。


    玛利亚·塔里奥（Maria L.Talero）的论文《共同注意与表现力：经验调查极限的海德格尔指南》（Joint Attention and Expressivity：A
    Heideggerian Guide to the Limits of Empirical Investigation）主要讨论海德格尔的存在论现象学所确定的一种先验现象性（transphenomenality），作者认为通过理解海德格尔哲学的先验现象学维度，我们能够更好地理解诸如背叛、亲密、信任等主体间性的经验，而经验手段则无法实现这一目的。海德格尔认为经验的先验现象学维度可以利用现象学予以追溯，但这一维度具有经验方面的不确定性。作者关注的重点在于经验方法在多大程度上可以与海德格尔对主体间性体验的思考相一致，他考察了认知心理学的“共同注意”（joint
    attention）概念，并将有关共同注意的实证研究与海德格尔的观点相联系，认为海德格尔的主体间性现象学指出了对鲜活体验（lived experience）的实证研究的局限性，并揭示了将经验方法与现象学内涵予以结合所产生的潜在问题。


    海伦娜·德·普列斯特（Helena De Preester）的论文《器具与生存的空间性：海德格尔、认识科学与装有假肢的主体》（Equipment and Existential
    Spatiality：Heidegger，Cognitive Science and the Prosthetic Subject）考察了身体与技术之间的关系，并主要解决了以下问题：人类与其行动时使用的客体或人工制品究竟是什么关系？这一特殊联系的意义是什么？该联系如何可能建立？文章主要依据海德格尔在《存在与时间》中关于人类活动和活动中使用的人工制品的分析进行论述。在作者看来，海德格尔的存在论分析只是预设而没有论述身体与具身性（embodiment）这一主题。作者认为海德格尔不愿意此在的存在空间性与身体联系过于密切，身体的空间性必须从在世存在的存在论角度来理解。关于器具（equipment）与上手状态，作者认为我们不应从“纯粹事物”的不必要的性质，诸如实体性、物质性、延展性等出发考察器具。相反，器具的本质在于任何器物都从属于其整体性。我们总是首先了解器具的整体性，只有在环境中它才能显现自身。从此在与世界之原初的实践关系而言，它总是先遭遇并使用器具，上手状态比现成在手更为根本。作者主张存在的空间性与身体密切相关，并论述了海德格尔不对身体进行讨论的原因。关于在世存在的论述也明确地将身体包括在内，这使我们能够更为清晰地洞察存在的空间性的特殊本质。而且海德格尔哲学中的核心概念“使用工具”与人类的身体结构关系密切，所以我们不能忽视身体问题。身体的延展性是此在的构成。在作者看来，此在的存在与经验性、身体性存在的相互交织不仅是偶然的，而且是必要的，此在凭借工具和仪器的去远能力构成身体，而身体的具体构成对此在的空间性具有决定性作用。


    杰夫·玛帕斯（Jeff Malpas）在论文《海德格尔、空间与世界》（Heidegger，Space，and World）中对海德格尔的空间性和世界概念进行了重新解读，认为当今的认知科学对于空间性出现的方式及其在海德格尔思想中的发展关注不够，我们不能撇开空间性来谈论世界，也不能单纯基于实践行为或“因缘”（involvement）来理解世界和空间性。作者探讨了海德格尔思想中的空间与世界的出现方式，包括他在《存在与时间》中讨论空间时产生的一些问题，并概述了两种主题。首先，作者揭示了复杂的、非衍生的空间性结构；其次，他意图说明空间性与世界概念的联系方式，尤其是海德格尔本人对世界概念的澄清方式。另外，作者认为海德格尔在《存在与时间》中有关空间性的定位是有问题的，原因之一在于他难以割裂空间性观念与空间的均匀延展之间的关联，后者是笛卡尔主义的核心要素，原因之二在于空间性的定位本身也与海德格尔对身体作用的不确定有关，这导致空间性在《存在与时间》中处于完全次要的地位。在作者看来，海德格尔并未完全忽略与身体相关的问题，而是在明确这些问题的重要性的同时有意将其搁置。此外，作者深入分析了空间/空间性的主观模式和客观模式，认为空间和空间性同世界概念一样，不属于物理科学和“经验主义的形而上学”领域，而属于适当的哲学领域。


    西奥多·沙茨基（Theodore Schatzki）的论文《时间性与人类活动的因果路径》（Temporality and the Causal Approach
    to Human Activity）考察了某些关于人类活动的解释对活动的科学概念和研究的启示，这些解释以海德格尔对在世存在的分析为基础，并阐明了在世存在对于研究和理解心智（mentality）的影响。作者认为心灵研究与行为研究二者不是彼此独立的，而是专注于具体的心理或行为现象且具有众多分支的统一整体。全文分为三部分，作者在第一部分讨论了因果性和行动科学，在第二部分考察了海德格尔的存在论哲学与活动的时间性结构的关系，在第三部分讨论了在世存在与人类活动的因果进路。


    ### 《约翰·豪格兰德——被解蔽的此在》


    约瑟夫·劳斯（Joseph Rouse）主编的约翰·豪格兰德（John Haugeland）关于海德格尔研究的论文集《约翰·豪格兰德——被解蔽的此在》（*John
    Haugeland—Dasein Disclosed*）收录了大约16篇论文，它是对海德格尔观点的一种仔细的哲学解读，而不是对其文本进行评论。其内容涉及海德格尔哲学中的此在、解蔽、世界、时间性和在世存在等主要概念，他从根本上挑战了人们对海德格尔的《存在与时间》的一般解读，重新解释了海德格尔的观点及其哲学意义。论文的排序和主题与其在《存在与时间》中出现的次序大致相同。该书分为四个部分。第一部分是豪格兰德研究海德格尔的最初两篇论文，指出了海德格尔自己的哲学立场；第二部分则根据上述立场对亚里士多德、笛卡尔和康德进行批判性的重新考察；第三部分是豪格兰德关于海德格尔已经发表和未发表的论文或演讲，《阅读布兰登，阅读海德格尔》（Reading
    Brandom Reading Heidegger）和《顺其自然》（Letting Be）这两篇主要讨论《存在与时间》的第1部分，《真理与有限》（Truth
    and Finitude）主要关注《存在与时间》第2部分的前三章内容，《死亡与此在》（Death and Dasein）讨论了存在的死亡（existential
    death），《时间性》（Temporality）介绍了豪格兰德有关《存在与时间》第2部分第4章的解释；最后一部分的两篇论文虽然没有直接阐述海德格尔的主张，但是清楚地表明了豪格兰德如何看待自己关于海德格尔解释的许多主题对当代哲学所产生的广泛意义。[^(\[46\])](#chapter001.html#m46)


    ### 认知存在主义与存在论认知


    迪米特里·吉内夫（Dimitri Ginev）在其2011年的著作《认知存在主义的原则》（*The Tenets of Cognitive Existentialism*）中提出了认知存在主义，其英文名称为cognitive
    existentialism。这一概念是基于对世界的诠释学理解和客观性理解的区分，他将认知存在主义视为一种新的科学解释路径，也就是基于诠释学现象学的构成性分析。与我们所关注的问题不同，吉内夫提出这一概念的目的在于反对科学哲学中惯常的以客观主义视角解释世界，其核心是认知表征主义。他认为心智不是关于世界内诸事实之表征的存储之所，前者设计、规划着人的实践行动，具有某种驱动力。认知存在主义的意图在于避免主客分立产生的实体化心智（自柏拉图开始便认为后者是干预世界的幕后推手），认为人的思维或心智总体上已是世界中的实在，当然，该假设不是基于主客割裂来对世界作出定义。而具有全部认知能力的人，一开始便被抛入实践之中，人构建表征与图像与其客观实践交织在一起，是一种特殊的认知实践过程，他利用的也是海德格尔对于科学概念的存在论解读。


    从整体来看，吉内夫的认知存在主义在认知问题上着墨并不多，它涉及的是科学研究领域构成的诠释学和本体论方面的问题，认知存在主义的任务在于依靠诠释学的构成性分析解决科学在认知上的特殊性问题，科学研究在其自身的理解视界和文本表达的空间中不断创造着这种特殊性。20世纪90年代，罗恩·麦克拉姆洛克（Ron
    McClamrock）于1995年出版著作《存在主义论认知：世界中的计算心智》（*Existential Cognition：Computational Minds
    in the World*）是最早使用“存在论认知”这一词语的专著，全书分为四个部分，分别对应四个问题：①如何使本质上嵌入的认知与科学解释的某些一般原则相符合？②我们为什么对内在主义的现状感到不满？③认知的嵌入式进路需要注意什么？④接受嵌入式认知会是什么结果？麦克拉姆洛克在最后一章讨论了将萨特的存在主义与梅洛-庞蒂的身体现象学的洞见应用于认知科学的可能性。他反对将认知看作局限于大脑内的信息处理过程，无论是认知主义还是基于内在主义假设的反认知主义都是错误的。现象学的存在论转向将胡塞尔所定义的直接呈现于反思的意向思维同世界关联起来，将人从“意识世界”拉回了现实世界当中，打破并瓦解了笛卡尔关于心灵的错误观念，即心灵本质上是独立于世界的某种存在物。决定思维与行动内容的不再是胡塞尔所说的“先验意识”，而是由意向性、环境和世界共同组成的结构，意向对象正是我们在环境中与之互动的对象。这样一来，意向性的结构也有可能被重新解释。将复杂的思维、感知与行动结构同诸主体共有的环境结构相连接，能够减轻人们在主体“内在性”上的理解压力，毕竟，内在的“黑箱”比进入人们视域的东西要难理解得多。[^(\[47\])](#chapter001.html#m47)

