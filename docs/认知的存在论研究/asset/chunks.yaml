- raw: '具身认知可能具有的缺陷主要集中于它的激进版本，矫枉则易过正。首先，从某种程度上讲，过分强调身体的基础性，甚至构成性作用，强调身体的躯体结构、感官运动系统以及神经系统的影响有可能将认知和心智状态归为生理过程，向身体的复归可能会重蹈还原论的覆辙。其次，正如有学者指出的，激进的具身认知面临着两大难题：（1）具身认知的理论、概念和方法能否覆盖、适用于解释人的全部认知和心智活动，（2）具身认知的描述框架是否真的与经典认知科学的范式格格不入，甚至可以完全代替它。[^(\[70\])](#chapter002.html#m70)最后，夏皮罗指出，具身认知给予认知科学研究的一个重要观念就是概念化，即智能体的身体概念和属性限制、约束着对智能和认知的研究，从这种意义上说，具身认知似乎为认知科学的研究设置了一个不可逾越和突破的界限，也就是说，身体是人类认知的天然边界。然而，延展认知假设对这一界限进行了强有力的冲击，在某种程度上甚至颠覆了人们关于认知的寻常理解。基于神经生物学过程的认知现象（包括感知、记忆、决策和学习等）第一次容纳了非神经性的要素，过度的理论跨越招致了多方的批评，可以说，延展认知是对具身认知离经叛道的一个极端变种，也是“4E+S”模型中遭受攻击最多的假设。


    #### （三）延展认知：对认知边界的过度突破


    在我们看来，提出延展认知假设的背后原因在于没有关于认知概念的科学阐释，与生物学对生命的定义不同，对认知的阐明可以确定认知科学的划界标准，从而消弭认知科学家和哲学家关于认知边界以及认知科学边界的严重分歧，而延展认知引发了关于认知划界的论战，我们可以将这一论战看作认知科学领域尚未解决的理论和方法论争议的集合。根据延展认知假设，在当下的认知情境中，人类主体和外部的物理和社会环境之间构成了一个动态的耦合系统，“认知不局限在头脑中，而在这个耦合系统中”。[^(\[71\])](#chapter002.html#m71)认知过程不局限在头脑中，它延展到了世界，一部分由延展到大脑和身体之外的过程构成。批评者坚持认为，人的认知完全是一种在大脑内部的结构和过程中发生的神经现象，大脑中的认知过程可能会表现出对身体/环境结构的因果依赖，然而，接受这种因果依赖并不等于接受更为激进的构成性观点，相反，认知过程因果地依赖神经、身体和环境的现实状况并不会从根本上改变认知概念的内容，我们完全可以认为认知只发生于大脑之中。从某种角度说，延展认知假设之所以具有较大的争议，原因可能在于它提供的论证有赖于认知本质的具体理论假设，这些假设要么因为定义模糊而难以坚持，要么很可能被反对者认为论证与其所要支撑的假设同样存疑。


    延展认知及延展心智论的理论原则主要有两个：均等性原则以及耦合构成原则。反对者主要针对延展认知的这两个基本原则展开批评，并据此提出两种反对论证：①耦合—构成谬误，②认知膨胀以及认知的标志问题。亚当斯（F.Adams）与埃扎瓦（K.Aizawa）早已在他们的著作中作了翔实的反驳论证，[^(\[72\])](#chapter002.html#m72)我们在此提出一些新的看法作为补充。


    一方面，延展认知作为在脑外进行的信息辨识、加工与解释世界的活动，[^(\[73\])](#chapter002.html#m73)在我们看来，其实质在于认知过程由“具身”向“离身”的转换，是脑充当认知手段的职能从人身体上的（部分）卸载，即认知脱离人的身体展开，并借助身体之外的技术工具得以实现。延展认知的这种离身性意味着人从“认知现场”的撤离，目的在于部分地消弭认知主体对自身天然的认知器官的生物学依赖。人们在执行某些认知任务时确实会借助、利用各种非认知的工具，比如利用纸笔或计算器进行复杂的数学运算。但是，人类使用工具同外部世界的有效交互并不意味着认知和心智可以越雷池一步，可以在大脑、身体和环境之间自由穿梭，它发挥的只是一种辅助作用。认知能力的深化并不等于认知自身结构的延伸，我们需要认识到，有关延展认知的争论并不关乎某些术语和概念，即如何定义与解释认知相关的身体和环境因素。相反，重点是该假设可能对认知科学整体造成的实质影响，如果延展认知假设是正确的，那便直接动摇和质疑了认知研究的基石——颅内主义。从本质上说，延展认知关切的是身体具身与环境嵌入的事实能否被传统认知科学吸收，或是这些事实有无必要彻底地改变传统认知科学的主题和理论框架。[^(\[74\])](#chapter002.html#m74)


    另一方面，延展认知主张，人类作为有机体同身体之外的物理设备共同构成了一个动态的耦合系统，认知过程就在这一系统中涌现。这样一来，产生的问题在于应当如何看待作为载体的物理设备。在笔者看来，若要延展认知成立，则必须证明它们具有和脑同等的、无差别的认知地位，在克拉克和查尔莫斯（C&C）看来就是一种信息随时可供取用的“可通达性”（accessibility），他们正是利用这一属性来为物理设备承载的认知过程与大脑的原初认知过程具有同等地位进行辩护的，然而笔者认为，C&C忽略了可通达性背后可能具有的意识或心理基础，认知在某种意义上亦伴随着一种心理状态，而心理状态是具有意向性的，意向性则植根于意识之中（虽然存在着无意识的意向性，但与认知状态牵涉的意向性却是有意识的，否则认知过程便无法产生了），即使便携式的外部设备具有可通达性，能够与大脑连接，也不能保证自身具有意识基础。对认知加工产生积极作用只是一个满足条件，内在认知资源的可靠稳定根本上源于人的意识。C&C若要证明跨越大脑、身体和环境的耦合系统与内部资源具有同等地位，就必须证明该耦合系统具有相应的意识基础，在我们看来，如此，论证认知延展的问题就转变为论证意识能否延展的问题，如果不能证明意识的延展性，认知的延展也就无从谈起，认知延展要以意识的同一性为前提。然而，意识不具有延展的可能，因为意识就是发生于我们身上、伴随着我们的某些心理生活的一种内在的过程、状态或现象。[^(\[75\])](#chapter002.html#m75)我们认为，不考虑意识的因素而企图描述和说明认知延展是一个较为严重的缺陷，而这恰恰被延展认知假设忽略了。


    基于一种积极外在主义立场的延展认知是对第二代认知科学的过度推进和延伸，因而受到了多方面的批评。延展认知之所以会引起如此多的非议，很有可能是因为我们没有对认知概念的外延作出必要的澄清，缺少任何能够被广泛接受的科学描述，尽管人们迫切需要这一描述。认知科学是对认知现象的研究，而认知的外延决定了认知科学的划界标准，如果没有关于认知的有效说明，恐怕认知科学的实践会受到严重的误导，我们可能研究的是一个错误的对象，或者选择了一种错误的研究方式。[^(\[76\])](#chapter002.html#m76)因此，我们对延展认知的相关假设持怀疑立场，它的论证还存在着诸多漏洞，在理论上也存在问题，需要进一步澄清，比如伴随着认知状态并与之相互纠缠的情绪是否也可以延展，等等。也许随着技术的进步与发展，社会进入人机交互甚至相融的赛博格时代，人可以像今天从网上下载数据资料一样将自己头脑中的记忆、想象、思维等认知资源下载、存储到芯片中，从这种意义上看，认知甚至心智都延展了，但就目前的情况而言，延展认知只是一种假设，它并未构成一种事实，人的心智仍是内在的。


    #### （四）生成认知：对行动交互的过度侧重


    生成认知是认知科学中一条具有较大影响的研究进路，瓦雷拉、汤普森和罗施的《具身心智：认知科学和人类经验》一书使之受到了越来越多的关注。一般而言，生成认知主张认知过程不是只由大脑构成，主体和世界之间的作用和反作用才是人们的认知基础，认知是具身主体在其所处的物理世界中进行动态交互的结果。因此，生成认知的关键词是“互动”，我们之所以知晓这个世界，是因为我们以特定的方式在环境中行动着，比如同他人交流、环顾四周以及使用工具。“生成”（enactive）一词表明这种认知进路明确反对个体的内在心智对外在世界的表征，认知也不是借助表征模拟、再现世界的能力，而是基于我们内含于自然、社会情境的感官运动能力。认知与行动相互纠缠、水乳交融，认知是具身的行动，认知结构形成于经常和反复出现的感觉运动模式，与身体构造和身体动作具有深刻的连续性。[^(\[77\])](#chapter002.html#m77)近几年，生成认知又产生了新的概念内容，它将主体与世界的交互从自然物理世界延伸到了社会文化世界，比如，社会的可供性（social
    affordances）和参与式的意义建构（participatory sense-making），前者强调他人的情感表达与行动如何影响我们自身关于世界的体验，后者标示了人通过他人的参与理解世界和自身的能力。[^(\[78\])](#chapter002.html#m78)一般而言，认知的生成主义理论认为主体身体层面和社会层面的互动是相互交织的，社会文化并不与身体的互动相对立，而是在后者之上，人类不只是作为自我维持的生命体而存在，而且其自我维持活动依赖于人的社会交互。


    我们认为，相较于具身认知而言，生成认知的观点更为激进一些。后者主张认知现象存在于整个有机体的部分活动之中，而不是对表征或信息的操作，有时甚至所有的生命体，包括微生物，都会参与认知活动。它强调正是有机体的行动造就了自己的经验世界，世界在有机体的行动中向其显现。认知是作为自主体的人主动向世界敞开的结果，自主体自我维持并自我同一。在某种意义上，生成认知视域中的世界被褪去了客观、中立的外衣，加入了主体感知觉建构的成分，人的复杂、精致的感觉运动活动构成了他的经验世界。具身的行动塑造了有机体的知觉经验，知觉经验反过来又引导着有机体的行动。由此可见，生成认知关注的重心“既不是个体内部的认知机制，也不是影响认知的环境因素”，而是有机体与环境之间非线性的、动态的非因果关联。似乎在生成认知看来，身体与世界的交互活动可以为一切认知现象和认知结果提供某种解释，“所有的行动过程都是认识过程，所有的认识过程都是行动过程”。[^(\[79\])](#chapter002.html#m79)果真如此吗？我们认为不然。生成认知侧重描述的是认知的实践维度，它将认知视作一种实践形式，强调的是认知对于主体行动的有效作用与影响，因而具有某种实用主义的烙印。在我们看来，人类认知是一种具有多重维度的复杂意识现象，不可能也没有必要将所有的认知过程都归于主体与世界的互动过程。比如，人们在下棋时关注的焦点不是周围环境的特征，而是当下变幻不定的棋局，同时在脑中进行着对棋局的思考并进行模拟（高超的棋手甚至有能力作详细的路数推演）。在这种情况下，主体与周遭世界几乎没有发生互动，棋手必须将自己的注意力集中于比赛本身，甚至需要排除环境产生的干扰。


    激进的生成认知认为，基本的心智不存在任何内容，全部心智活动都是主体和世界互动的产物，不存在任何负载内容的心理表征（也就是说心智活动内容的载体是行动而非心智本身）。如果这一主张是正确的，那就意味着我们在进行下棋等排除环境影响的活动，以及进行判断、推理等思维活动时，我们的心智没有任何内容，也就是说，我们的心智是空的。这显然是有问题的，人在这种情况下需要心理表征。在前述中我们提到，认知是一种具有复杂维度的意识现象，不论是传统的表征认知观还是生成认知主张的行动认知观都侧重于描述认知现象特定的某一方面，不能相互替代。我们从不否认认知有具身性和技能性的特征，也就是把认知视为在情境中对技能的熟练运用和身体行动，也承认主体与世界交互活动的重要性。但是在我们看来，对行动的过分强调淡化了认知的心理和现象特征，激进的生成认知在某种程度上将认知理论转化为一种行动理论，极力渲染身体和行动的影响和作用无法为“认知的非身体性方面的特征提供令人信服的解释”。[^(\[80\])](#chapter002.html#m80)此外，生成认知不看重认知的内在过程，将认知视为脑、身体、世界之间的行动关联，认知活动是在身体与外部环境的交互中涌现出来的，但是对闭锁综合征的研究有力地冲击了这一主张，该研究表明，身体的损伤不是影响认知功能的根本原因，人类认知并不必然地依赖人的身体结构。此外，依靠感觉运动模式形成的认知结构能否合理描述基于抽象概念的判断、推理和决策等高阶认知过程，生成认知也并未予以说明。我们可以看到，生成认知因其激进的版本而产生了理论上的缺陷，如何克服这些问题，需要进一步研究与思考。


    #### （五）嵌入认知：心智、身体、世界的层层嵌套


    与其他几种认知进路的观点相类似，嵌入认知也重视和强调环境在认知形成中的作用，强调主体的认知过程依赖于环境的影响，认知的机制是在和环境的交互过程中产生的，智能体和环境不是彼此对立的关系，而是构成一个大的认知系统，前者内嵌于后者之中。在嵌入认知看来，人的感觉运动和认知能力不仅植根于物理环境，而且植根于包含着生物、技术和文化等的更广泛的情境之中。嵌入认知也和其他进路一样主张认知主体和环境的直接互动，因而也排斥和反对表征，认为没有必要对世界进行建模，布鲁克斯甚至断言，世界本身便是最好的模型。主体通过以工具为中介和世界的实践交互将自身的部分认知任务卸载到了环境中的载体，从而减轻大脑的负担。我们看到，在如何看待环境作用的问题上，嵌入认知持一种较为温和的立场，也就是说认知过程与环境之间是依赖性的关系，与激进的延展认知主张的构成性关联存在较大的差异，与情境认知的主张非常接近。因此，鲁伯特认为，在处理有机体和环境相互作用的关系方面，嵌入认知要比延展认知的解释策略更好一些。[^(\[81\])](#chapter002.html#m81)


    我们看到，嵌入认知是4E认知中较为明显地重视环境的进路之一，它反对认知的内在主义，强调大脑过程、身体过程和环境过程之间纷繁复杂的本质关联。人的日常经验也支持着嵌入认知的概念主张，我们应当认识到，至少有一些心理过程不是孤立地存在于大脑之中，而必须通过跨越身体和环境的机制予以解释。嵌入认知指出，身体与环境是自主运作的心理或大脑过程的一种随附性因素，这种观点是严重的误解，相反，嵌入认知代表了心理或认知过程的外在主义：一些心理过程并不完全由内部的大脑，甚至是身体过程构成，而且包含着环境过程。在这种观点中，环境过程共同构成了心理过程的一部分。[^(\[82\])](#chapter002.html#m82)只有保证大脑同身体和环境的相关性，大脑的功能才能正常运作，如今这已成为理解人类认知时普遍的背景假设，大脑可以实现心理过程并不意味着身体与环境因素不甚紧要。我们认为，嵌入认知的立场比强调身体和环境之重要性的主张要更强一些，对于认知的内在主义而言，身体和环境是大脑过程的边界条件，而嵌入认知的观点是，这些所谓的边界条件实际上是某些认知过程的一部分。我们看到，这样的主张确实是激进的，虽然不如以延展认知为代表的积极外在主义那样强烈。


    至此，我们对情境认知、具身认知、延展认知、生成认知和嵌入认知分别作了分析说明，在不同程度上发现了它们各自一些缺陷和可能面临的困境。总体看来，各个研究进路虽然有着独立的内涵，但一些立场和主张仍然十分接近甚至相吻合。比如都重视身体和环境在认知中的影响和作用，强调认知的具身性和境遇性特征；都主张以动力学的交互活动取代计算表征；都采用整体主义的解释策略，将认知主体、认知过程和环境视为一个更广泛的认知系统。这些可以说在很大程度上突破、扩展甚至取代了笛卡尔式认知科学原有的观点和立场。梅纳里认为，至少在拒斥或从根本上重构传统的认知主义方面，各个进路之间还是存在同质性的。[^(\[83\])](#chapter002.html#m83)同时，延展认知与生成认知的激进立场要求彻底取代认知主义，认知解释根本不需要心理表征，对此我们依然持谨慎态度。在笔者看来，无论主体与世界的交互多么纷繁复杂，多么积极地将外在的资源整合到认知过程当中，认知始终都产生于大脑之中，身体作为认知依赖的空间载体以一种动态、有效的方式积极地探索世界，分担了大脑的认知负担，但我们仍然需要表征。原因在于，认知主体一定具有内在的心理状态，由于外在环境的实际状态与前者会存在某种落差，因而主体需要在心智内予以再现和模拟，这就需要表征的功能。我们以为，有关人类心智和认知的描述需要丰富一些，因为人的认知活动总归充满了多样性，单一的、同质性的解释并不能合理地呈现认知现象的复杂性特征。


    “4E+S”认知模型对经典认知科学范式造成了猛烈的冲击，但认知主义依然具有强大的解释力，从某种程度上说，较弱的认知主义立场是可以被我们接受的，人的认知过程需要且应该接纳基本的表征能力。常言道，过犹不及，片面地反对表征使得我们缺失了对人类认知能力的完整刻画和描述，换言之，表征不应被驱逐出认知解释的范围。此外，“4E+S”认知理论本身并不是一个统一范式，虽然它们在反对主流认知科学的某些观点方面比较一致，比如，内在主义和方法论的个体主义，但是诸认知进路只是具有维特根斯坦所谓的“家族相似”，将“4E+S”予以整合并不容易。尽管所有的生成认知理论都赞同具身性的立场，但并非所有的具身认知都主张认知的生成性，延展认知的某些观点也与认知嵌入的立场相冲突。[^(\[84\])](#chapter002.html#m84)总之，目前的“4E+S”自身面临着亟待解决的问题，要成为一种新的范式仍然道阻且长。


    ## 第四节 对胡塞尔先验现象学的反思


    在反驳和批判笛卡尔式认知科学范式的浪潮中，现象学的思想资源日益受到人们的重视和关注，它不仅被看作新的认知研究纲领的思想来源，而且被视为一条介入认知科学研究的新路径，特别是在解决意识的“难问题”方面提供了独特的方法和视角。有学者认为，如果要转换认知科学的哲学基础，完成从心身二元的“笛卡尔剧场”向“在世存在”的“海德格尔剧场”的迁移和转变，现象学无疑是最佳的选择。认知解释的现象学进路主要是胡塞尔的意识现象学、自然化现象学和存在论现象学三种，我们在此简要论述胡塞尔的意识现象学，并试图从海德格尔的存在论现象学立场出发对其进行简要的分析。'
  fmt: '

    具身认知可能具有的缺陷主要集中于它的激进版本，矫枉则易过正。首先，从某种程度上讲，过分强调身体的基础性，甚至构成性作用，强调身体的躯体结构、感官运动系统以及神经系统的影响有可能将认知和心智状态归为生理过程，向身体的复归可能会重蹈还原论的覆辙。其次，正如有学者指出的，激进的具身认知面临着两大难题：（1）具身认知的理论、概念和方法能否覆盖、适用于解释人的全部认知和心智活动，（2）具身认知的描述框架是否真的与经典认知科学的范式格格不入，甚至可以完全代替它。[^(\[70\])](#chapter002.html#m70)最后，夏皮罗指出，具身认知给予认知科学研究的一个重要观念就是概念化，即智能体的身体概念和属性限制、约束着对智能和认知的研究，从这种意义上说，具身认知似乎为认知科学的研究设置了一个不可逾越和突破的界限，也就是说，身体是人类认知的天然边界。然而，延展认知假设对这一界限进行了强有力的冲击，在某种程度上甚至颠覆了人们关于认知的寻常理解。基于神经生物学过程的认知现象（包括感知、记忆、决策和学习等）第一次容纳了非神经性的要素，过度的理论跨越招致了多方的批评，可以说，延展认知是对具身认知离经叛道的一个极端变种，也是“4E+S”模型中遭受攻击最多的假设。


    ### （三）延展认知：对认知边界的过度突破


    在我们看来，提出延展认知假设的背后原因在于没有关于认知概念的科学阐释，与生物学对生命的定义不同，对认知的阐明可以确定认知科学的划界标准，从而消弭认知科学家和哲学家关于认知边界以及认知科学边界的严重分歧，而延展认知引发了关于认知划界的论战，我们可以将这一论战看作认知科学领域尚未解决的理论和方法论争议的集合。根据延展认知假设，在当下的认知情境中，人类主体和外部的物理和社会环境之间构成了一个动态的耦合系统，“认知不局限在头脑中，而在这个耦合系统中”。[^(\[71\])](#chapter002.html#m71)认知过程不局限在头脑中，它延展到了世界，一部分由延展到大脑和身体之外的过程构成。批评者坚持认为，人的认知完全是一种在大脑内部的结构和过程中发生的神经现象，大脑中的认知过程可能会表现出对身体/环境结构的因果依赖，然而，接受这种因果依赖并不等于接受更为激进的构成性观点，相反，认知过程因果地依赖神经、身体和环境的现实状况并不会从根本上改变认知概念的内容，我们完全可以认为认知只发生于大脑之中。从某种角度说，延展认知假设之所以具有较大的争议，原因可能在于它提供的论证有赖于认知本质的具体理论假设，这些假设要么因为定义模糊而难以坚持，要么很可能被反对者认为论证与其所要支撑的假设同样存疑。


    延展认知及延展心智论的理论原则主要有两个：均等性原则以及耦合构成原则。反对者主要针对延展认知的这两个基本原则展开批评，并据此提出两种反对论证：①耦合—构成谬误，②认知膨胀以及认知的标志问题。亚当斯（F.Adams）与埃扎瓦（K.Aizawa）早已在他们的著作中作了翔实的反驳论证，[^(\[72\])](#chapter002.html#m72)我们在此提出一些新的看法作为补充。


    一方面，延展认知作为在脑外进行的信息辨识、加工与解释世界的活动，[^(\[73\])](#chapter002.html#m73)在我们看来，其实质在于认知过程由“具身”向“离身”的转换，是脑充当认知手段的职能从人身体上的（部分）卸载，即认知脱离人的身体展开，并借助身体之外的技术工具得以实现。延展认知的这种离身性意味着人从“认知现场”的撤离，目的在于部分地消弭认知主体对自身天然的认知器官的生物学依赖。人们在执行某些认知任务时确实会借助、利用各种非认知的工具，比如利用纸笔或计算器进行复杂的数学运算。但是，人类使用工具同外部世界的有效交互并不意味着认知和心智可以越雷池一步，可以在大脑、身体和环境之间自由穿梭，它发挥的只是一种辅助作用。认知能力的深化并不等于认知自身结构的延伸，我们需要认识到，有关延展认知的争论并不关乎某些术语和概念，即如何定义与解释认知相关的身体和环境因素。相反，重点是该假设可能对认知科学整体造成的实质影响，如果延展认知假设是正确的，那便直接动摇和质疑了认知研究的基石——颅内主义。从本质上说，延展认知关切的是身体具身与环境嵌入的事实能否被传统认知科学吸收，或是这些事实有无必要彻底地改变传统认知科学的主题和理论框架。[^(\[74\])](#chapter002.html#m74)


    另一方面，延展认知主张，人类作为有机体同身体之外的物理设备共同构成了一个动态的耦合系统，认知过程就在这一系统中涌现。这样一来，产生的问题在于应当如何看待作为载体的物理设备。在笔者看来，若要延展认知成立，则必须证明它们具有和脑同等的、无差别的认知地位，在克拉克和查尔莫斯（C&C）看来就是一种信息随时可供取用的“可通达性”（accessibility），他们正是利用这一属性来为物理设备承载的认知过程与大脑的原初认知过程具有同等地位进行辩护的，然而笔者认为，C&C忽略了可通达性背后可能具有的意识或心理基础，认知在某种意义上亦伴随着一种心理状态，而心理状态是具有意向性的，意向性则植根于意识之中（虽然存在着无意识的意向性，但与认知状态牵涉的意向性却是有意识的，否则认知过程便无法产生了），即使便携式的外部设备具有可通达性，能够与大脑连接，也不能保证自身具有意识基础。对认知加工产生积极作用只是一个满足条件，内在认知资源的可靠稳定根本上源于人的意识。C&C若要证明跨越大脑、身体和环境的耦合系统与内部资源具有同等地位，就必须证明该耦合系统具有相应的意识基础，在我们看来，如此，论证认知延展的问题就转变为论证意识能否延展的问题，如果不能证明意识的延展性，认知的延展也就无从谈起，认知延展要以意识的同一性为前提。然而，意识不具有延展的可能，因为意识就是发生于我们身上、伴随着我们的某些心理生活的一种内在的过程、状态或现象。[^(\[75\])](#chapter002.html#m75)我们认为，不考虑意识的因素而企图描述和说明认知延展是一个较为严重的缺陷，而这恰恰被延展认知假设忽略了。


    基于一种积极外在主义立场的延展认知是对第二代认知科学的过度推进和延伸，因而受到了多方面的批评。延展认知之所以会引起如此多的非议，很有可能是因为我们没有对认知概念的外延作出必要的澄清，缺少任何能够被广泛接受的科学描述，尽管人们迫切需要这一描述。认知科学是对认知现象的研究，而认知的外延决定了认知科学的划界标准，如果没有关于认知的有效说明，恐怕认知科学的实践会受到严重的误导，我们可能研究的是一个错误的对象，或者选择了一种错误的研究方式。[^(\[76\])](#chapter002.html#m76)因此，我们对延展认知的相关假设持怀疑立场，它的论证还存在着诸多漏洞，在理论上也存在问题，需要进一步澄清，比如伴随着认知状态并与之相互纠缠的情绪是否也可以延展，等等。也许随着技术的进步与发展，社会进入人机交互甚至相融的赛博格时代，人可以像今天从网上下载数据资料一样将自己头脑中的记忆、想象、思维等认知资源下载、存储到芯片中，从这种意义上看，认知甚至心智都延展了，但就目前的情况而言，延展认知只是一种假设，它并未构成一种事实，人的心智仍是内在的。


    ### （四）生成认知：对行动交互的过度侧重


    生成认知是认知科学中一条具有较大影响的研究进路，瓦雷拉、汤普森和罗施的《具身心智：认知科学和人类经验》一书使之受到了越来越多的关注。一般而言，生成认知主张认知过程不是只由大脑构成，主体和世界之间的作用和反作用才是人们的认知基础，认知是具身主体在其所处的物理世界中进行动态交互的结果。因此，生成认知的关键词是“互动”，我们之所以知晓这个世界，是因为我们以特定的方式在环境中行动着，比如同他人交流、环顾四周以及使用工具。“生成”（enactive）一词表明这种认知进路明确反对个体的内在心智对外在世界的表征，认知也不是借助表征模拟、再现世界的能力，而是基于我们内含于自然、社会情境的感官运动能力。认知与行动相互纠缠、水乳交融，认知是具身的行动，认知结构形成于经常和反复出现的感觉运动模式，与身体构造和身体动作具有深刻的连续性。[^(\[77\])](#chapter002.html#m77)近几年，生成认知又产生了新的概念内容，它将主体与世界的交互从自然物理世界延伸到了社会文化世界，比如，社会的可供性（social
    affordances）和参与式的意义建构（participatory sense-making），前者强调他人的情感表达与行动如何影响我们自身关于世界的体验，后者标示了人通过他人的参与理解世界和自身的能力。[^(\[78\])](#chapter002.html#m78)一般而言，认知的生成主义理论认为主体身体层面和社会层面的互动是相互交织的，社会文化并不与身体的互动相对立，而是在后者之上，人类不只是作为自我维持的生命体而存在，而且其自我维持活动依赖于人的社会交互。


    我们认为，相较于具身认知而言，生成认知的观点更为激进一些。后者主张认知现象存在于整个有机体的部分活动之中，而不是对表征或信息的操作，有时甚至所有的生命体，包括微生物，都会参与认知活动。它强调正是有机体的行动造就了自己的经验世界，世界在有机体的行动中向其显现。认知是作为自主体的人主动向世界敞开的结果，自主体自我维持并自我同一。在某种意义上，生成认知视域中的世界被褪去了客观、中立的外衣，加入了主体感知觉建构的成分，人的复杂、精致的感觉运动活动构成了他的经验世界。具身的行动塑造了有机体的知觉经验，知觉经验反过来又引导着有机体的行动。由此可见，生成认知关注的重心“既不是个体内部的认知机制，也不是影响认知的环境因素”，而是有机体与环境之间非线性的、动态的非因果关联。似乎在生成认知看来，身体与世界的交互活动可以为一切认知现象和认知结果提供某种解释，“所有的行动过程都是认识过程，所有的认识过程都是行动过程”。[^(\[79\])](#chapter002.html#m79)果真如此吗？我们认为不然。生成认知侧重描述的是认知的实践维度，它将认知视作一种实践形式，强调的是认知对于主体行动的有效作用与影响，因而具有某种实用主义的烙印。在我们看来，人类认知是一种具有多重维度的复杂意识现象，不可能也没有必要将所有的认知过程都归于主体与世界的互动过程。比如，人们在下棋时关注的焦点不是周围环境的特征，而是当下变幻不定的棋局，同时在脑中进行着对棋局的思考并进行模拟（高超的棋手甚至有能力作详细的路数推演）。在这种情况下，主体与周遭世界几乎没有发生互动，棋手必须将自己的注意力集中于比赛本身，甚至需要排除环境产生的干扰。


    激进的生成认知认为，基本的心智不存在任何内容，全部心智活动都是主体和世界互动的产物，不存在任何负载内容的心理表征（也就是说心智活动内容的载体是行动而非心智本身）。如果这一主张是正确的，那就意味着我们在进行下棋等排除环境影响的活动，以及进行判断、推理等思维活动时，我们的心智没有任何内容，也就是说，我们的心智是空的。这显然是有问题的，人在这种情况下需要心理表征。在前述中我们提到，认知是一种具有复杂维度的意识现象，不论是传统的表征认知观还是生成认知主张的行动认知观都侧重于描述认知现象特定的某一方面，不能相互替代。我们从不否认认知有具身性和技能性的特征，也就是把认知视为在情境中对技能的熟练运用和身体行动，也承认主体与世界交互活动的重要性。但是在我们看来，对行动的过分强调淡化了认知的心理和现象特征，激进的生成认知在某种程度上将认知理论转化为一种行动理论，极力渲染身体和行动的影响和作用无法为“认知的非身体性方面的特征提供令人信服的解释”。[^(\[80\])](#chapter002.html#m80)此外，生成认知不看重认知的内在过程，将认知视为脑、身体、世界之间的行动关联，认知活动是在身体与外部环境的交互中涌现出来的，但是对闭锁综合征的研究有力地冲击了这一主张，该研究表明，身体的损伤不是影响认知功能的根本原因，人类认知并不必然地依赖人的身体结构。此外，依靠感觉运动模式形成的认知结构能否合理描述基于抽象概念的判断、推理和决策等高阶认知过程，生成认知也并未予以说明。我们可以看到，生成认知因其激进的版本而产生了理论上的缺陷，如何克服这些问题，需要进一步研究与思考。


    ### （五）嵌入认知：心智、身体、世界的层层嵌套


    与其他几种认知进路的观点相类似，嵌入认知也重视和强调环境在认知形成中的作用，强调主体的认知过程依赖于环境的影响，认知的机制是在和环境的交互过程中产生的，智能体和环境不是彼此对立的关系，而是构成一个大的认知系统，前者内嵌于后者之中。在嵌入认知看来，人的感觉运动和认知能力不仅植根于物理环境，而且植根于包含着生物、技术和文化等的更广泛的情境之中。嵌入认知也和其他进路一样主张认知主体和环境的直接互动，因而也排斥和反对表征，认为没有必要对世界进行建模，布鲁克斯甚至断言，世界本身便是最好的模型。主体通过以工具为中介和世界的实践交互将自身的部分认知任务卸载到了环境中的载体，从而减轻大脑的负担。我们看到，在如何看待环境作用的问题上，嵌入认知持一种较为温和的立场，也就是说认知过程与环境之间是依赖性的关系，与激进的延展认知主张的构成性关联存在较大的差异，与情境认知的主张非常接近。因此，鲁伯特认为，在处理有机体和环境相互作用的关系方面，嵌入认知要比延展认知的解释策略更好一些。[^(\[81\])](#chapter002.html#m81)


    我们看到，嵌入认知是4E认知中较为明显地重视环境的进路之一，它反对认知的内在主义，强调大脑过程、身体过程和环境过程之间纷繁复杂的本质关联。人的日常经验也支持着嵌入认知的概念主张，我们应当认识到，至少有一些心理过程不是孤立地存在于大脑之中，而必须通过跨越身体和环境的机制予以解释。嵌入认知指出，身体与环境是自主运作的心理或大脑过程的一种随附性因素，这种观点是严重的误解，相反，嵌入认知代表了心理或认知过程的外在主义：一些心理过程并不完全由内部的大脑，甚至是身体过程构成，而且包含着环境过程。在这种观点中，环境过程共同构成了心理过程的一部分。[^(\[82\])](#chapter002.html#m82)只有保证大脑同身体和环境的相关性，大脑的功能才能正常运作，如今这已成为理解人类认知时普遍的背景假设，大脑可以实现心理过程并不意味着身体与环境因素不甚紧要。我们认为，嵌入认知的立场比强调身体和环境之重要性的主张要更强一些，对于认知的内在主义而言，身体和环境是大脑过程的边界条件，而嵌入认知的观点是，这些所谓的边界条件实际上是某些认知过程的一部分。我们看到，这样的主张确实是激进的，虽然不如以延展认知为代表的积极外在主义那样强烈。


    至此，我们对情境认知、具身认知、延展认知、生成认知和嵌入认知分别作了分析说明，在不同程度上发现了它们各自一些缺陷和可能面临的困境。总体看来，各个研究进路虽然有着独立的内涵，但一些立场和主张仍然十分接近甚至相吻合。比如都重视身体和环境在认知中的影响和作用，强调认知的具身性和境遇性特征；都主张以动力学的交互活动取代计算表征；都采用整体主义的解释策略，将认知主体、认知过程和环境视为一个更广泛的认知系统。这些可以说在很大程度上突破、扩展甚至取代了笛卡尔式认知科学原有的观点和立场。梅纳里认为，至少在拒斥或从根本上重构传统的认知主义方面，各个进路之间还是存在同质性的。[^(\[83\])](#chapter002.html#m83)同时，延展认知与生成认知的激进立场要求彻底取代认知主义，认知解释根本不需要心理表征，对此我们依然持谨慎态度。在笔者看来，无论主体与世界的交互多么纷繁复杂，多么积极地将外在的资源整合到认知过程当中，认知始终都产生于大脑之中，身体作为认知依赖的空间载体以一种动态、有效的方式积极地探索世界，分担了大脑的认知负担，但我们仍然需要表征。原因在于，认知主体一定具有内在的心理状态，由于外在环境的实际状态与前者会存在某种落差，因而主体需要在心智内予以再现和模拟，这就需要表征的功能。我们以为，有关人类心智和认知的描述需要丰富一些，因为人的认知活动总归充满了多样性，单一的、同质性的解释并不能合理地呈现认知现象的复杂性特征。


    “4E+S”认知模型对经典认知科学范式造成了猛烈的冲击，但认知主义依然具有强大的解释力，从某种程度上说，较弱的认知主义立场是可以被我们接受的，人的认知过程需要且应该接纳基本的表征能力。常言道，过犹不及，片面地反对表征使得我们缺失了对人类认知能力的完整刻画和描述，换言之，表征不应被驱逐出认知解释的范围。此外，“4E+S”认知理论本身并不是一个统一范式，虽然它们在反对主流认知科学的某些观点方面比较一致，比如，内在主义和方法论的个体主义，但是诸认知进路只是具有维特根斯坦所谓的“家族相似”，将“4E+S”予以整合并不容易。尽管所有的生成认知理论都赞同具身性的立场，但并非所有的具身认知都主张认知的生成性，延展认知的某些观点也与认知嵌入的立场相冲突。[^(\[84\])](#chapter002.html#m84)总之，目前的“4E+S”自身面临着亟待解决的问题，要成为一种新的范式仍然道阻且长。


    ## 第四节 对胡塞尔先验现象学的反思


    在反驳和批判笛卡尔式认知科学范式的浪潮中，现象学的思想资源日益受到人们的重视和关注，它不仅被看作新的认知研究纲领的思想来源，而且被视为一条介入认知科学研究的新路径，特别是在解决意识的“难问题”方面提供了独特的方法和视角。有学者认为，如果要转换认知科学的哲学基础，完成从心身二元的“笛卡尔剧场”向“在世存在”的“海德格尔剧场”的迁移和转变，现象学无疑是最佳的选择。认知解释的现象学进路主要是胡塞尔的意识现象学、自然化现象学和存在论现象学三种，我们在此简要论述胡塞尔的意识现象学，并试图从海德格尔的存在论现象学立场出发对其进行简要的分析。

    '
  trans: '


    具身认知可能具有的缺陷主要集中于它的激进版本，矫枉则易过正。首先，从某种程度上讲，过分强调身体的基础性，甚至构成性作用，强调身体的躯体结构、感官运动系统以及神经系统的影响有可能将认知和心智状态归为生理过程，向身体的复归可能会重蹈还原论的覆辙。其次，正如有学者指出的，激进的具身认知面临着两大难题：（1）具身认知的理论、概念和方法能否覆盖、适用于解释人的全部认知和心智活动，（2）具身认知的描述框架是否真的与经典认知科学的范式格格不入，甚至可以完全代替它。[^(\[70\])](#chapter002.html#m70)最后，夏皮罗指出，具身认知给予认知科学研究的一个重要观念就是概念化，即智能体的身体概念和属性限制、约束着对智能和认知的研究，从这种意义上说，具身认知似乎为认知科学的研究设置了一个不可逾越和突破的界限，也就是说，身体是人类认知的天然边界。然而，延展认知假设对这一界限进行了强有力的冲击，在某种程度上甚至颠覆了人们关于认知的寻常理解。基于神经生物学过程的认知现象（包括感知、记忆、决策和学习等）第一次容纳了非神经性的要素，过度的理论跨越招致了多方的批评，可以说，延展认知是对具身认知离经叛道的一个极端变种，也是“4E+S”模型中遭受攻击最多的假设。


    ### （三）延展认知：对认知边界的过度突破


    在我们看来，提出延展认知假设的背后原因在于没有关于认知概念的科学阐释，与生物学对生命的定义不同，对认知的阐明可以确定认知科学的划界标准，从而消弭认知科学家和哲学家关于认知边界以及认知科学边界的严重分歧，而延展认知引发了关于认知划界的论战，我们可以将这一论战看作认知科学领域尚未解决的理论和方法论争议的集合。根据延展认知假设，在当下的认知情境中，人类主体和外部的物理和社会环境之间构成了一个动态的耦合系统，“认知不局限在头脑中，而在这个耦合系统中”。[^(\[71\])](#chapter002.html#m71)认知过程不局限在头脑中，它延展到了世界，一部分由延展到大脑和身体之外的过程构成。批评者坚持认为，人的认知完全是一种在大脑内部的结构和过程中发生的神经现象，大脑中的认知过程可能会表现出对身体/环境结构的因果依赖，然而，接受这种因果依赖并不等于接受更为激进的构成性观点，相反，认知过程因果地依赖神经、身体和环境的现实状况并不会从根本上改变认知概念的内容，我们完全可以认为认知只发生于大脑之中。从某种角度说，延展认知假设之所以具有较大的争议，原因可能在于它提供的论证有赖于认知本质的具体理论假设，这些假设要么因为定义模糊而难以坚持，要么很可能被反对者认为论证与其所要支撑的假设同样存疑。


    延展认知及延展心智论的理论原则主要有两个：均等性原则以及耦合构成原则。反对者主要针对延展认知的这两个基本原则展开批评，并据此提出两种反对论证：①耦合—构成谬误，②认知膨胀以及认知的标志问题。亚当斯（F.Adams）与埃扎瓦（K.Aizawa）早已在他们的著作中作了翔实的反驳论证，[^(\[72\])](#chapter002.html#m72)我们在此提出一些新的看法作为补充。


    一方面，延展认知作为在脑外进行的信息辨识、加工与解释世界的活动，[^(\[73\])](#chapter002.html#m73)在我们看来，其实质在于认知过程由“具身”向“离身”的转换，是脑充当认知手段的职能从人身体上的（部分）卸载，即认知脱离人的身体展开，并借助身体之外的技术工具得以实现。延展认知的这种离身性意味着人从“认知现场”的撤离，目的在于部分地消弭认知主体对自身天然的认知器官的生物学依赖。人们在执行某些认知任务时确实会借助、利用各种非认知的工具，比如利用纸笔或计算器进行复杂的数学运算。但是，人类使用工具同外部世界的有效交互并不意味着认知和心智可以越雷池一步，可以在大脑、身体和环境之间自由穿梭，它发挥的只是一种辅助作用。认知能力的深化并不等于认知自身结构的延伸，我们需要认识到，有关延展认知的争论并不关乎某些术语和概念，即如何定义与解释认知相关的身体和环境因素。相反，重点是该假设可能对认知科学整体造成的实质影响，如果延展认知假设是正确的，那便直接动摇和质疑了认知研究的基石——颅内主义。从本质上说，延展认知关切的是身体具身与环境嵌入的事实能否被传统认知科学吸收，或是这些事实有无必要彻底地改变传统认知科学的主题和理论框架。[^(\[74\])](#chapter002.html#m74)


    另一方面，延展认知主张，人类作为有机体同身体之外的物理设备共同构成了一个动态的耦合系统，认知过程就在这一系统中涌现。这样一来，产生的问题在于应当如何看待作为载体的物理设备。在笔者看来，若要延展认知成立，则必须证明它们具有和脑同等的、无差别的认知地位，在克拉克和查尔莫斯（C&C）看来就是一种信息随时可供取用的“可通达性”（accessibility），他们正是利用这一属性来为物理设备承载的认知过程与大脑的原初认知过程具有同等地位进行辩护的，然而笔者认为，C&C
    忽略了可通达性背后可能具有的意识或心理基础，认知在某种意义上亦伴随着一种心理状态，而心理状态是具有意向性的，意向性则植根于意识之中（虽然存在着无意识的意向性，但与认知状态牵涉的意向性却是有意识的，否则认知过程便无法产生了），即使便携式的外部设备具有可通达性，能够与大脑连接，也不能保证自身具有意识基础。对认知加工产生积极作用只是一个满足条件，内在认知资源的可靠稳定根本上源于人的意识。C&C
    若要证明跨越大脑、身体和环境的耦合系统与内部资源具有同等地位，就必须证明该耦合系统具有相应的意识基础，在我们看来，如此，论证认知延展的问题就转变为论证意识能否延展的问题，如果不能证明意识的延展性，认知的延展也就无从谈起，认知延展要以意识的同一性为前提。然而，意识不具有延展的可能，因为意识就是发生于我们身上、伴随着我们的某些心理生活的一种内在的过程、状态或现象。[^(\[75\])](#chapter002.html#m75)我们认为，不考虑意识的因素而企图描述和说明认知延展是一个较为严重的缺陷，而这恰恰被延展认知假设忽略了。


    基于一种积极外在主义立场的延展认知是对第二代认知科学的过度推进和延伸，因而受到了多方面的批评。延展认知之所以会引起如此多的非议，很有可能是因为我们没有对认知概念的外延作出必要的澄清，缺少任何能够被广泛接受的科学描述，尽管人们迫切需要这一描述。认知科学是对认知现象的研究，而认知的外延决定了认知科学的划界标准，如果没有关于认知的有效说明，恐怕认知科学的实践会受到严重的误导，我们可能研究的是一个错误的对象，或者选择了一种错误的研究方式。[^(\[76\])](#chapter002.html#m76)因此，我们对延展认知的相关假设持怀疑立场，它的论证还存在着诸多漏洞，在理论上也存在问题，需要进一步澄清，比如伴随着认知状态并与之相互纠缠的情绪是否也可以延展，等等。也许随着技术的进步与发展，社会进入人机交互甚至相融的赛博格时代，人可以像今天从网上下载数据资料一样将自己头脑中的记忆、想象、思维等认知资源下载、存储到芯片中，从这种意义上看，认知甚至心智都延展了，但就目前的情况而言，延展认知只是一种假设，它并未构成一种事实，人的心智仍是内在的。


    ### （四）生成认知：对行动交互的过度侧重


    生成认知是认知科学中一条具有较大影响的研究进路，瓦雷拉、汤普森和罗施的《具身心智：认知科学和人类经验》一书使之受到了越来越多的关注。一般而言，生成认知主张认知过程不是只由大脑构成，主体和世界之间的作用和反作用才是人们的认知基础，认知是具身主体在其所处的物理世界中进行动态交互的结果。因此，生成认知的关键词是“互动”，我们之所以知晓这个世界，是因为我们以特定的方式在环境中行动着，比如同他人交流、环顾四周以及使用工具。“生成”（enactive）一词表明这种认知进路明确反对个体的内在心智对外在世界的表征，认知也不是借助表征模拟、再现世界的能力，而是基于我们内含于自然、社会情境的感官运动能力。认知与行动相互纠缠、水乳交融，认知是具身的行动，认知结构形成于经常和反复出现的感觉运动模式，与身体构造和身体动作具有深刻的连续性。[^(\[77\])](#chapter002.html#m77)近几年，生成认知又产生了新的概念内容，它将主体与世界的交互从自然物理世界延伸到了社会文化世界，比如，社会的可供性（social
    affordances）和参与式的意义建构（participatory sense-making），前者强调他人的情感表达与行动如何影响我们自身关于世界的体验，后者标示了人通过他人的参与理解世界和自身的能力。[^(\[78\])](#chapter002.html#m78)一般而言，认知的生成主义理论认为主体身体层面和社会层面的互动是相互交织的，社会文化并不与身体的互动相对立，而是在后者之上，人类不只是作为自我维持的生命体而存在，而且其自我维持活动依赖于人的社会交互。


    我们认为，相较于具身认知而言，生成认知的观点更为激进一些。后者主张认知现象存在于整个有机体的部分活动之中，而不是对表征或信息的操作，有时甚至所有的生命体，包括微生物，都会参与认知活动。它强调正是有机体的行动造就了自己的经验世界，世界在有机体的行动中向其显现。认知是作为自主体的人主动向世界敞开的结果，自主体自我维持并自我同一。在某种意义上，生成认知视域中的世界被褪去了客观、中立的外衣，加入了主体感知觉建构的成分，人的复杂、精致的感觉运动活动构成了他的经验世界。具身的行动塑造了有机体的知觉经验，知觉经验反过来又引导着有机体的行动。由此可见，生成认知关注的重心“既不是个体内部的认知机制，也不是影响认知的环境因素”，而是有机体与环境之间非线性的、动态的非因果关联。似乎在生成认知看来，身体与世界的交互活动可以为一切认知现象和认知结果提供某种解释，“所有的行动过程都是认识过程，所有的认识过程都是行动过程”。[^(\[79\])](#chapter002.html#m79)果真如此吗？我们认为不然。生成认知侧重描述的是认知的实践维度，它将认知视作一种实践形式，强调的是认知对于主体行动的有效作用与影响，因而具有某种实用主义的烙印。在我们看来，人类认知是一种具有多重维度的复杂意识现象，不可能也没有必要将所有的认知过程都归于主体与世界的互动过程。比如，人们在下棋时关注的焦点不是周围环境的特征，而是当下变幻不定的棋局，同时在脑中进行着对棋局的思考并进行模拟（高超的棋手甚至有能力作详细的路数推演）。在这种情况下，主体与周遭世界几乎没有发生互动，棋手必须将自己的注意力集中于比赛本身，甚至需要排除环境产生的干扰。


    激进的生成认知认为，基本的心智不存在任何内容，全部心智活动都是主体和世界互动的产物，不存在任何负载内容的心理表征（也就是说心智活动内容的载体是行动而非心智本身）。如果这一主张是正确的，那就意味着我们在进行下棋等排除环境影响的活动，以及进行判断、推理等思维活动时，我们的心智没有任何内容，也就是说，我们的心智是空的。这显然是有问题的，人在这种情况下需要心理表征。在前述中我们提到，认知是一种具有复杂维度的意识现象，不论是传统的表征认知观还是生成认知主张的行动认知观都侧重于描述认知现象特定的某一方面，不能相互替代。我们从不否认认知有具身性和技能性的特征，也就是把认知视为在情境中对技能的熟练运用和身体行动，也承认主体与世界交互活动的重要性。但是在我们看来，对行动的过分强调淡化了认知的心理和现象特征，激进的生成认知在某种程度上将认知理论转化为一种行动理论，极力渲染身体和行动的影响和作用无法为“认知的非身体性方面的特征提供令人信服的解释”。[^(\[80\])](#chapter002.html#m80)此外，生成认知不看重认知的内在过程，将认知视为脑、身体、世界之间的行动关联，认知活动是在身体与外部环境的交互中涌现出来的，但是对闭锁综合征的研究有力地冲击了这一主张，该研究表明，身体的损伤不是影响认知功能的根本原因，人类认知并不必然地依赖人的身体结构。此外，依靠感觉运动模式形成的认知结构能否合理描述基于抽象概念的判断、推理和决策等高阶认知过程，生成认知也并未予以说明。我们可以看到，生成认知因其激进的版本而产生了理论上的缺陷，如何克服这些问题，需要进一步研究与思考。


    ### （五）嵌入认知：心智、身体、世界的层层嵌套


    与其他几种认知进路的观点相类似，嵌入认知也重视和强调环境在认知形成中的作用，强调主体的认知过程依赖于环境的影响，认知的机制是在和环境的交互过程中产生的，智能体和环境不是彼此对立的关系，而是构成一个大的认知系统，前者内嵌于后者之中。在嵌入认知看来，人的感觉运动和认知能力不仅植根于物理环境，而且植根于包含着生物、技术和文化等的更广泛的情境之中。嵌入认知也和其他进路一样主张认知主体和环境的直接互动，因而也排斥和反对表征，认为没有必要对世界进行建模，布鲁克斯甚至断言，世界本身便是最好的模型。主体通过以工具为中介和世界的实践交互将自身的部分认知任务卸载到了环境中的载体，从而减轻大脑的负担。我们看到，在如何看待环境作用的问题上，嵌入认知持一种较为温和的立场，也就是说认知过程与环境之间是依赖性的关系，与激进的延展认知主张的构成性关联存在较大的差异，与情境认知的主张非常接近。因此，鲁伯特认为，在处理有机体和环境相互作用的关系方面，嵌入认知要比延展认知的解释策略更好一些。[^(\[81\])](#chapter002.html#m81)


    我们看到，嵌入认知是 4E 认知中较为明显地重视环境的进路之一，它反对认知的内在主义，强调大脑过程、身体过程和环境过程之间纷繁复杂的本质关联。人的日常经验也支持着嵌入认知的概念主张，我们应当认识到，至少有一些心理过程不是孤立地存在于大脑之中，而必须通过跨越身体和环境的机制予以解释。嵌入认知指出，身体与环境是自主运作的心理或大脑过程的一种随附性因素，这种观点是严重的误解，相反，嵌入认知代表了心理或认知过程的外在主义：一些心理过程并不完全由内部的大脑，甚至是身体过程构成，而且包含着环境过程。在这种观点中，环境过程共同构成了心理过程的一部分。[^(\[82\])](#chapter002.html#m82)只有保证大脑同身体和环境的相关性，大脑的功能才能正常运作，如今这已成为理解人类认知时普遍的背景假设，大脑可以实现心理过程并不意味着身体与环境因素不甚紧要。我们认为，嵌入认知的立场比强调身体和环境之重要性的主张要更强一些，对于认知的内在主义而言，身体和环境是大脑过程的边界条件，而嵌入认知的观点是，这些所谓的边界条件实际上是某些认知过程的一部分。我们看到，这样的主张确实是激进的，虽然不如以延展认知为代表的积极外在主义那样强烈。


    至此，我们对情境认知、具身认知、延展认知、生成认知和嵌入认知分别作了分析说明，在不同程度上发现了它们各自一些缺陷和可能面临的困境。总体看来，各个研究进路虽然有着独立的内涵，但一些立场和主张仍然十分接近甚至相吻合。比如都重视身体和环境在认知中的影响和作用，强调认知的具身性和境遇性特征；都主张以动力学的交互活动取代计算表征；都采用整体主义的解释策略，将认知主体、认知过程和环境视为一个更广泛的认知系统。这些可以说在很大程度上突破、扩展甚至取代了笛卡尔式认知科学原有的观点和立场。梅纳里认为，至少在拒斥或从根本上重构传统的认知主义方面，各个进路之间还是存在同质性的。[^(\[83\])](#chapter002.html#m83)同时，延展认知与生成认知的激进立场要求彻底取代认知主义，认知解释根本不需要心理表征，对此我们依然持谨慎态度。在笔者看来，无论主体与世界的交互多么纷繁复杂，多么积极地将外在的资源整合到认知过程当中，认知始终都产生于大脑之中，身体作为认知依赖的空间载体以一种动态、有效的方式积极地探索世界，分担了大脑的认知负担，但我们仍然需要表征。原因在于，认知主体一定具有内在的心理状态，由于外在环境的实际状态与前者会存在某种落差，因而主体需要在心智内予以再现和模拟，这就需要表征的功能。我们以为，有关人类心智和认知的描述需要丰富一些，因为人的认知活动总归充满了多样性，单一的、同质性的解释并不能合理地呈现认知现象的复杂性特征。


    “4E+S”认知模型对经典认知科学范式造成了猛烈的冲击，但认知主义依然具有强大的解释力，从某种程度上说，较弱的认知主义立场是可以被我们接受的，人的认知过程需要且应该接纳基本的表征能力。常言道，过犹不及，片面地反对表征使得我们缺失了对人类认知能力的完整刻画和描述，换言之，表征不应被驱逐出认知解释的范围。此外，“4E+S”认知理论本身并不是一个统一范式，虽然它们在反对主流认知科学的某些观点方面比较一致，比如，内在主义和方法论的个体主义，但是诸认知进路只是具有维特根斯坦所谓的“家族相似”，将“4E+S”予以整合并不容易。尽管所有的生成认知理论都赞同具身性的立场，但并非所有的具身认知都主张认知的生成性，延展认知的某些观点也与认知嵌入的立场相冲突。[^(\[84\])](#chapter002.html#m84)总之，目前的“4E+S”自身面临着亟待解决的问题，要成为一种新的范式仍然道阻且长。


    ## 第四节 对胡塞尔先验现象学的反思


    在反驳和批判笛卡尔式认知科学范式的浪潮中，现象学的思想资源日益受到人们的重视和关注，它不仅被看作新的认知研究纲领的思想来源，而且被视为一条介入认知科学研究的新路径，特别是在解决意识的“难问题”方面提供了独特的方法和视角。有学者认为，如果要转换认知科学的哲学基础，完成从心身二元的“笛卡尔剧场”向“在世存在”的“海德格尔剧场”的迁移和转变，现象学无疑是最佳的选择。认知解释的现象学进路主要是胡塞尔的意识现象学、自然化现象学和存在论现象学三种，我们在此简要论述胡塞尔的意识现象学，并试图从海德格尔的存在论现象学立场出发对其进行简要的分析。


