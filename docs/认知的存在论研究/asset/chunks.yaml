    \n[\\[42\\]](#chapter005.html#w42) 虽然惠勒主张哲学与科学的智力联姻，但若两者的解释相冲突，比如哲学主张的一些实体、状态和过程与自然科学不一致，人们需要放弃的是哲学而非科学的解释。尤其是涉及关于存在对象的假设，科学具有解释的优先性。\n\
