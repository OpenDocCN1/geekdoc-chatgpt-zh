    惠勒的目的不在于另起炉灶，独辟蹊径，而是要对正统的认知科学（Orthodox Cognitive Science）进行基于海德格尔哲学的改造，并使二者相互联结。这与我们的目的和做法不同，存在论认知是在认知研究中汲取海德格尔存在论现象学这一思想资源的产物，它以“此在”“世界”“在世存在”为核心概念，强调“此在”是具身的、有实践意蕴的、情境性的存在者，具有身体、实践以及情境三个维度；世界不止具有空间性的维度，同时是通过实践被构造起来的指引网络；“在世存在”是人（“此在”）产生认知经验的背景或场域，它离不开人的身体，我们是以“作为身体”和“拥有身体”两种方式在世界中展开着自身。存在论认知具有三个主要命题：（1）以动态的原初上手活动取代静态的静观认知，（2）以具身的情境性认知取代无身的离身性认知，（3）由表征性认知扩展和延伸为行动与表征的叠加耦合。在我们看来，存在论认知在“此在”能否自然化以及海德格尔式人工智能尝试解决“框架问题”这两个方面可能会遭到批评，前文也作了具体讨论。这一形式的认知科学，其实质是把海德格尔对“此在”的生存论分析转变为一种科学解释。同时我们也要看到，只从海德格尔的这一分析汲取思想资源是不够的，我们有必要将诠释学与认知科学结合，作为对存在论认知的有益补充。具体原因有以下三点。首先，海德格尔的诠释学关注的是“此在”的生存，诠释学是构成“此在”生存的一部分，因此它与存在论之间具有紧密的连续性；其次，诠释学自觉或不自觉地克服了笛卡尔的主体认知模式，理解活动同时也是人与世界之间关联的深化；最后，诠释学与认知科学都在寻求关于人类认知的普遍理解或解释，二者的某些问题域相互重合（比如“他心问题”），而且在处理非形式的、具有不确定性的模糊认知活动方面，诠释学具有某种优势。这是我们在书中提出的一个新的观点。“前见”是构成人类认知与理解的重要因素，后者同时离不开当下以及历史的情境关联，人的认知根基于一种行动与解释的可能性，同时，诠释学划分的前反思性的直接理解与反思性的叙事理解使我们对人类认知有了新的认识，我们有理由相信，诠释学对认知哲学的研究而言是有所助益的。


    概言之，存在论现象学与认知科学的结合使我们看到了一种不同于以往的“海德格尔式认知科学”，惠勒基于科学主义的立场称之为具身—嵌入式认知，他自己也认为这种科学的可实现性解释同现象学的构成性解释之间不能相互还原。然而，他本人却有意或无意地违背了自己坚持的信条。严格地说，与现象学自然化的问题类似，惠勒关于海德格尔式认知科学的设想仍需要进一步商榷。相比之下，我们持较弱的立场，不主张构建类似于惠勒的“海德格尔式认知科学”，而是试图提出将海德格尔存在论现象学与认知科学进行泛化结合的存在论认知，不谋求使之成为认知研究中的一个科学范式。在我们看来，以“在世存在”这一整体性的现象学描述说明智能主体的处境，以上手活动的实践领会说明关于人的具身性知识，以“被抛”的因果机制尝试解决人工智能的“框架问题”，这些都展现出了海德格尔的存在论哲学对认知研究的影响和启示，诠释学也为我们揭示出人类认知的复杂之维，客观上阐明了认知具有的动态性与不断的自我超越性。存在论现象学需要和诠释学共同构成推动认知科学发展的新基础和新动力，这也是我们将来需要继续深入研究的方向，认知科学有可能在诠释学中寻找到新的哲学支撑。


