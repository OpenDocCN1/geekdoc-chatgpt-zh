    每個 AI都有一個模型，這個模型是個神經網絡，它有幾百


    萬到幾千億個參數。當我們用已知的經驗去訓練AI的時候，每一 個案例進去，從輸入到輸出的反饋都會把這些參數更新一遍，但 是每次更新的幅度都非常小。訓練過程中你說不清為什麼這個案
    例會讓這個參數的數值變大或者變小了那麼一點點，訓練完畢你 也說不清每個參數的意義是什麼。你使用 AI的時候，它每一次 的預測推理都是無數個參數共同參與的過程。


    第四章 用已知推理未知 215


    這正如大腦每次想問題，都是無數個神經元共同參與的過


    程。這個過程之所以說不清，只是因為有太多參數參與，而不是 因為它有什麼內在的神秘性。


    很多人抱怨 AI是個黑盒子，從輸入直接生成輸出，說不清


    中間發生了什麼。可人腦不也是個黑盒子嗎?(圖4-9)


