    康德的哲学中，他认为人类的认知能力是受到我们的先验结构限制的，我们无法通过我们的认知能力去认识世界的本质，世界的本质是超越我们的认知能力的。他提出的"物自体"
    (Ding an sich) 指的就是超越我们的感性经验和理性认识能力的真正存在，是世界的本质或实体。


    虽然我们无法直接证明世界的本质或存在超越我们的认知能力，但这种观点在哲学上是有一定的传统和逻辑依据的。比如，我们无法证明绝对的真理或存在，无法证明自由意志或神的存在，但这并不意味着它们不存在，而是因为我们的认知能力无法直接触及它们。同样地，"物自体"作为超越我们的认知能力的世界本质，虽然我们无法直接证明其存在和本质，但也不能证明其不存在。


    另外，一些哲学家和物理学家也提出了一些关于世界本质的观点，比如，量子物理学中的不确定性原理、黑洞理论中的奇点、宇宙起源等。这些理论都提出了超越我们经验和理性能力的存在和本质，从而引发了人们对于世界本质的思考和探索。


    虽然我们无法直接证明世界的本质或存在超越我们的认知能力，但是这种观点在哲学和物理学等领域中仍然存在一定的影响，也是人们持续探索和思考的方向。


