    # 第三章 置身智能，你更像你


    ## 01 决策：AI 的预测+人的判断


    人到底有什么能力是不可被 `AI`替代的?每个人都需要思考这个问题。


    前文提过的《权力与预测》这本书中有一个洞见，我认为有可能就是 `AI`和人分工的指导原则。简单说，就是双方共同做出决策，其中`AI`负责预测，人负责判断。


    要理解这一点，我们先看一个真实的案例。美国网约车公司`Uber`(优步) 一直在测试自动驾驶汽车。2018 年, `Uber`的自动驾驶汽车在亚利桑那州撞死了一个行人，引起了激烈的讨论。


    仔细分析这个事故，我们会发现，在撞击前 6 秒，`AI`已经看到了前方有一个未知物体。它没有立即做出刹车的决定，因为它判断那个物体是人的概率非常低———虽然概率并不是
    0。


    `AI`有个判断阈值，只有在前方物体是人的概率超过一定数值的情況下，它才会刹车。撞击前 6 秒，概率没有超过阈值；等到终于看清是人的时候，刹车已经晚了。


    我们把刹车决定分为「预测」和「判断」两步。`AI`的预测也许不够准，但是它已经预测出这个物体可能是一个人，它给出了不为 0 的概率。接下来的问题出在了判断上——在这个概率上应不应该踩刹车，是这个判断导致了悲剧。


    `Uber`的 `AI` 用的是阈值判断法，这可以理解，如果对前方任何一个「是人的概率不为 0」的物体，`AI`都选择刹车，它就会在路上不停地踩刹车，这车就没法开了。当然你可以认为这个阈值不合理，但是这里总需要一个判断。


    请注意，正因为现在有了 `AI`，我们才可以做这样的分析。以前发生过那么多人类司机撞人的事件，从来没有人去分析那个司机是犯了预测错误还是判断错误。但这种分析其实是完全合理的，因为两种错误性质很不一样。


    请问这位司机，你是根本没看见前方有人呢，还是已经感觉到前方物体有可能是人，但是你感觉那个可能性并不是很大，又因为赶时间，你觉得那么小的概率可以接受，就开过去了?


    你犯的到底是预测错误，还是判断错误?


    决策=预测+判断。


    预测，是告诉你发生各种结果的概率是多少；判断，是对于每一种结果，你在多大程度上愿意接受。


    关于如何基于预测的概率做决策，有本书里讲了个方法，蒂姆 · 帕 爾 默 (`Tim Palmer`) 在 `The Primacy of Doubt`( 我
    翻 译 为 《首要怀疑》)里举了个例子。假设你周末有个户外聚会，要不要为此租个帐篷防止下雨，这是你的决策。天气预报告诉你那天下雨的概率是 30%，这是预测。面对这样一个概率，下雨的损失是不是可以接受的，这是你的判断。


    通常来说，只要采取行动的代价(帐篷的租金)小于损失(下雨会给你带来的麻烦)和概率的乘积，就应该采取行动，租个帐篷防止淋雨。但是在这一节的视角下，请注意，这个「应该」，应该理解成是对你的建议。


    是否采取行动的拍板权还在你手里，因为那个损失最终是由你来承受的。`AI`不会承受损失，用公式给你提建议的人也不会承受损失。在场来宾———是英国女王也好，是你岳母也罢——淋雨这件事是大是小，不是
    `AI`所能知道的，那其实是你自己的主观判断。


    `AI`很擅长预测天气概率，但是判断一个天气状况带来的后果，需要更多具体的，也许只有你自己才知道的信息，所以做判断的应该是你，而不是 `AI`。


    `AI`时代的决策=`AI`的预测+人的判断。


    也就是说，我们应该让预测和判断脱钩。以前所有的决策都是人负责预测，人负责判断，现在则应该是 `AI`负责预测，人负责判断。(图 3-1)


    我们承认 `AI` 比人聪明，但是真正承受风险、体验后果的是人，所以最终拍板判断的必须是人。如果你是一个企业主，聘请了一位非常厉害的职业经理人做你公司的 CEO，他在所有方面的能力都超过你，那你能把决策权都交给他吗?不能。因为公司是你的，万一赔钱赔的是你的钱。同样地，`AI`再厉害，也只能让人类医生承担医疗责任，让人类警察行使执法权，让人类领导者掌握核按钮。只有人能以血肉之躯承担后果，我们只能向人问责。


    预测是客观的，判断是主观的。`AI`不能僭越人的判断，人也不应该专断`AI`的预测。`AI`与人各安其位，分工明确。


    如何实施这个分工呢?


    一个方法是，人为给`AI`设定一个自动判断门槛。比如自动驾驶汽车，我们可以规定，当`AI`预测前方物体是人的概率高于 0.01%———或者 0.00001%也行,
    反正得有个不为 0 的数值———的时候就必须踩刹车。这个判断标准，这条线，肯定不是 `AI`自己规定的，而是人事先设定的。你可以把这条线编程到 `AI`之中，但是下达那条编程指令的必须得是人，因为只有人能判断人命的价值。对`AI`来说，人命的价值是无法用客观方法估算的。


    其实我们已经在用这种判断了。以前你到商店买东西用的是现金，那个现金是真钞还是假钞，得由收银员自己预测、自己判断。现在你刷信用卡，那个信用卡是真卡还是假卡，不是由收银员决策，而是由信用卡联网系统根据算法来预测和判断的。算法会先评估这张卡是假卡的概率有多大(预测)，再看看那个概率是否高于某一條线(判断)，然后决定是否拒收。那条线不是任何
    `AI`算出来的，而是事先由某个人类组成的委员会划定的。因为线划得太低得罪客户的是人，线划得太高承担损失的也是人。


    未来我们会面对各种各样类似的事情，《权力与预测》这本书建议，这样的判断最好像评估一种新药是否可以上市一样，由一个像`FDA` 这样的机构来执行。


    另一个方法是，把判断量化成钱。


    你租了一辆车，要去一个比较远的地方，有两条路线可选。第一条路线比较直，你老老实实开车就行，但路上没什么风景。第二条路线会经过一个景区，对你来说是一种享受，但是景区里有行人，会增加出事故的概率。如果
    `AI`直接跟你说两条路出事故的概率有多大，你可能还不好判断。


    更方便的做法是，`AI`告诉你，走景区那条路，租车的保险费比走第一条路贵 1 块钱。这 1 块钱的保险费代表 `AI`对两条路风险差异的预测。


    现在判断交给你。如果你认为风景对你的重要性超过 1 块钱，那你就走景区；如果你对风景没有那么高的兴趣，你就省下 1 块钱。


    你看，`AI`无须了解你，也不可能了解你———是你在這 1 块钱和风景之间的选择，揭示了你的偏好。在经济学上，这叫作「显示性偏好」(`Revealed Preference`):
    人的很多偏好本来是说不清的，但是一跟钱挂钩就能说清了。


    预测跟判断脱钩，对人是一种赋能。


    以前如果你想去开出租车，可不是会开车就行。你得先学认路，你得知道这个城市中从任意 A 点到任意 B 点的最短路线是什么 (就是你得会预测)，才能开好出租车。现在
    `AI`接管了预测路线的事，你只要会开车就可以去开网约车了。


    有了 `AI`，人会判断就会决策。但这并不意味着决策很容易，因为判断有判断的学问。


    生活中更多的判断既不是由委员会划线也不能被量化成金钱，而是必须由个人对具体情况进行具体分析。这个结果对你来说到底有多好，或者到底有多坏，你到底能不能承受，该怎么判断呢?


    有的可能是你通过读书或者跟别人学的，比如你听说过被烧红的烙铁烫会很疼，你就会愿意以很高的代价避免被烫。但是听说不如亲历，只有真的被烫过，你才能知道有多疼。判断，有很大的主观成分。


    而判断这个能力正在变得越来越重要。美国的一个统计显示①，1960 年只有 5%的工作需要决策技能，到 2015 年已经有 30%的工作需要决策技能，而且还都是高薪岗位。


    ① `David J. Deming`, The Growing Importance of Decision-Making on the Job, working
    paper 28733, National Bureau of Economic Research, Cambridge, MA (2021).


    只有人知道自己有多疼，所以人不是机器。而判断力和随之而来的决策力，本质上是一种权力——`AI`没有权力。


    当`AI`接管了预测之后，决策权力在社会层面和公司组织层面的行使就成了一个新问题。


    有个例子。因为知道了铅对人体有害，从 1986 年开始，美国政府禁止新建筑物使用含铅的饮用水管。可是很多旧建筑物的水管都含铅，这就需要对旧水管进行改造。但是改造非常费钱费力，旧水管又不都含铅，得先把水管挖出来才能知道，那先挖谁家的呢?


    2017 年 ， 密 歇 根 大 学 的 两 个 教 授 搞 了 一 个 `AI` ， 叫 `BlueConduit`, 它能以 80% 的准确率预测哪家的水管含铅。密歇根州的弗林特市使用了这个
    `AI`。一开始都挺好，市政府安排施工队根据`AI`的预测给各个居民家换水管。


    工程这样进行了一段时间之后，有些居民不干了。他们质疑说，为什么我家邻居水管换了，我家的却没换?特别是富裕区的居民会说，为什么先去换那些贫困地区的水管，难道不是我们交的税更多吗?


    收到这些抱怨，弗林特市的市长干脆决定不听 `AI`的了，挨家挨户慢慢换。结果这样一来，决策准确率一下子从 80%降到了 15%……又过了一段时间，美国法院推出一个法案，规定换水管这个决策必须先听`AI`的预测，决策准确率才又提高回来。(图
    3-2)


    这件事的道理是，`AI`改变了决策权。没有 `AI`预测的话，只有政府能预测和判断谁家水管应该先换，决策权完全把持在政客手里；有了 `AI`预测，老百姓或者社区都可以自己判断，尤其美国的司法系统还可以直接发话，政客就不再说了算了。


    决策权到底应该属于谁呢?从道德角度应该是，谁承担决策的后果，决策权就应该属于谁。而从经济学角度来说，则是谁决策能让整个组织的效率最高，就应该属于谁。这两个角度并不一定矛盾，毕竟蛋糕做大了才好分。


    以前预测和判断不分的时候，决策权往往应该交给一线人员，因为他们直接接触关键信息，他们的预测最准确———正所谓「让听得见炮火的人指挥」。


    现在 `AI`接管了预测，人的决策就是判断。这时候可以考虑，让那些个人利益跟公司利益最相关的人决策，或者让受这个决策影响最大的人决策，或者让最能理解决策后果的人决策……这些都意味着组织的变革。


    变革还意味着以前的预测者现在要转型为判断者，或者解释者。


    比如，以前天气预报机构的职责是提高预测的准确度，现在有了 `AI`，它们的主要职责也许就变成向公众和政府机构解释预测结果。`AI`说下周有 5%的可能性会发生龙卷风，政府官员不懂这
    5%代表多大损失，也许你这个气象学家能给解释一下。未来的气象台可能更多的是提供人性化服务，比如建议老百姓明天怎么制定出行计划，而不仅仅是预报下雪概率。


    再比如，以前放射科医生最主要的任务是看图预测病情。现在 `AI`看图的能力已经超过了人类，那放射科医生就得琢磨别的服务，也许是向病人解释病情，也许放射科就不应该继续存在……


    前文讲过，把决策权交给 `AI`会让人很难受。`AI`再厉害，我们也不愿意把它奉为神灵——这一节说的正是让`AI`最好老老实实扮演助手或者祭司的角色，拍板权还是应该在人的手里。在我看来，这个分工非常合理，希望这能够带给你些许安慰。


    ## 问答


    ### ⑲ 冯焯林


    想问万 Sir, 对于 Data Science (数据科学) 以及它和`AI`的关系有什么看法?如果目前你的儿子就要选修硕士的话，你怎么建议?


    ### 万维钢


    我大概会建议他选数据科学。我想给你讲一个正在进行中的故事。


    这一波以`GPT-4`为代表的大语言模型浪潮，有一个副产品———它杀死了一门叫作「自然语言处理」 (`NLP`)的学科。


    很多大学都有`NLP`这个专业，很多大公司有专门的`NLP`研发团队。`NLP`是计算机科学、`AI`和人类语言学的交叉学科，此前一直被认为是实现通用人工智能的指望。`NLP`研究的是如何让机器理解人的语言，它的应用范围包括机器翻译、语音识别、搜索引擎、智能助手等等。这么多年来，
    `NLP`领域在无数人的努力之下，取得了很多成就。


    但是，现在那些都已经没有意义了。`GPT`用的是完全不同的解决思路———无监督学习。`Transformer`架构和 2022 年前后发生的「开悟」 「涌现」已经自动把`NLP`想要解决而未能完美解决的问题都给完美解决了。原来`AI`根本就不需要按照人类帮它寻找的语言规则去学习语言，原来机器能自动找到各种「我们知道」以及「我们不知道」的语言规律。翻译、语音识别也好，搜索引擎、智能助手也罢，都是`GPT`的原生功能。`GPT`还自动掌握了一大堆包括逻辑推理、小样本学习、自动分类等功能，还有我们没意识到的功能。


    `GPT`对比于自然语言处理, 就如同`AlphaGo Zero`对比于人类棋手总结的围棋套路。事实证明，先靠人类总结规律再教给计算机是个笨办法，是让人的思维拖累了计算机的思维。原来让计算机直接暴力破解才是最根本、最快、最好的办法。


    人类棋手还可以继续学围棋套路，毕竟围棋这个游戏本身就很有意思。可是`NLP`研发人员、教授和学生们该何去何从呢?网络社区里已经在弥漫悲观情绪。有些从业者最初的态度是否认———就如同绝症患者最初的反应一样……可是`GPT-4`一出来，局面已经非常明显了。

