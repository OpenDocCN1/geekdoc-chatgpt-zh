    升 GPT的輸出質量。


    現在很多人都會用GPT 起草電子郵件、寫報告，甚至寫文章，給


    它一篇文章，它還可以生成摘要， 回答關於這篇文章的問題。但是


    要讓GPT把這些事情真正做得漂亮，你最好自己先做一番功夫。


    GPT 是無數語料喂出來的，我們可以想象它是無數個作家的分身


    疊加而成的。如果你只是提一個一般性的要求，它就只能給你生成一 個一般性的、用在哪裡都行，但是用在哪裡都不是最恰當的內容。但 如果你能把要求細化，它就會生成適合你


    238 拐 點


