    圈才能得到特定形狀的等離子體這種複雜的、參數多的、非線性 的問題，終究只能依靠神經計算。

    所以我們得到的第一個教訓是，直覺高於邏輯。

    ![](img/index-230_1.jpg)

    如果 AI 從此大行其道，以至於神經計算在各個領域取代了形式邏輯，這對社會會有深遠的影響。關鍵是，用形式邏輯描寫的知識可以一步步寫下來，能被人理解，這就意味著它是可教學、可傳播和可推廣的。這位醫生髮明瞭一個新療法，別的醫生把他的論文找過來讀一讀，看看操作步驟，立即就可以在本地復現。這就叫學知識。

    但神經計算是難以推廣的。這個 AI 發現了一種新的抗生素，你問它是怎麼做到的?我能不能用這個 AI 的操作步驟發現一種消炎藥呢?不能，因為 AI 說不清它是怎麼發現的，這裡沒有可言說的操作步驟。你唯一的辦法就是用消炎藥的案例重新訓練一個
    AI。

    這就意味著，除了像 GPT 那樣的語言模型———它們是所謂「通用 AI」，各種 「專用 AI」都是「一事一議」，是本地的，是針對每一個具體應用專門訓練的。用美國數據訓練出來的自動駕駛
    AI 不能直接拿到中國用，用於操控這個託卡馬克裝置的 AI 不能操控另一個裝置。

    而這又意味著，世界上將會有相對少數的若干個通用 AI 和無數個專用 AI。專用 AI 為具體的任務而生，通用 AI 是具體的語料訓練出來的，它們都有不同的特性，就好像一個個生命體一樣。它們不是千篇一律的工人，它們是各有性格的工匠。

    你的確不需要問這個活兒是怎麼做的——但是你會問是誰做的。

    每個 AI 都不一樣，哪怕做的是同樣的事，因為經歷的訓練不一樣，它們的產出也會各不相同。它們會在自己的作品上簽名。

    世界將從工業複製時代重歸匠人定製時代。AI 會像傳說中的神奇中醫大夫一樣，給每個病人提供不同的治療方案，而且各有各的風格。

    而那樣一個直覺而非邏輯的世界，原本就是我們熟悉的。

