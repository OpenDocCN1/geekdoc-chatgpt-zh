    ## 問答


    問 周樹濤


    對於「怎樣才能判斷，到底是AI真有意識了，還是人產生了伊麗莎效應」這句話，萬老師能展開講講嗎?圖靈測試既然已經不能很好地確定AI是否擁有人類智能，那目前有人在研究如何判斷AI有沒有自我意識嗎?


    萬維鋼


    怎樣才能判斷AI算不算是有了人的意識，是個非常有意思的問題，也是現在沒有答案的問題。其實，到底什麼是「意識」，人的意識到底是真的還是幻覺，現在都沒有共識性的說法。


    對比之下， 「智能」則有比較客觀的標準，可以打分。以前的計算機科學家最關心的是，AI怎樣才算有了人的智能。計算機之父艾倫·圖靈 (Alan Turing)
    在1950年的一篇論文中提出了一種測試方法，就是讓人跟AI和真人分別對話,如果有超過一定比例的人無法區分哪個是AI、哪個是真人,那麼我們就可以說AI已經有了人的智能。這就是圖靈測試。


    按照這個標準，GPT已經通過了圖靈測試。它的智能大大超過了絕大多數真人，如果你能發現對面不是真人而是GPT，那很可能是因為你發現對面的智能太高了，而不是太低了。所以現在人們不太談論圖靈測試了，AI的智能超過了人，這不是我們擔心的重點。


    我們擔心的是AI會不會有「意識」。聽說有學者認為，如果我們已經認定某個AI產生了意識，就應該賦予它人權。那麼，把它斷電就是不人道的。我認為這可以理解。如果你認為

    第四章 用已知推理未知 189

    殺死一隻小狗是不人道的，你完全也應該認為殺死一個有意識的AI是不人道的。


    問題是，對於怎麼算有意識，我們並沒有很好的判斷標準。但是，我們比較清楚怎麼不算有意識。


    如果一個物體永遠只會做被動反應，它就不是有意識的。


    比如你的手機對著你唱歌，還給你播放視頻，很好用，但是你不會覺得手機有意識。這是因為手機做的每件事都是你讓它做的，它自己沒有什麼多餘的想法。


    那如果將來你買了個機器人管家，她總是無微不至地為你服務，甚至還面帶微笑，有時候看你很無聊還主動給你講笑話，你會覺得她有意識嗎?嚴格地說，這還不算有意識。這裡所謂的
    「主動」，本質上是為了取悅你。很有可能她的出廠設定就是取悅主人，也就是說，她取悅你的任何行為本質上仍然是被動的，她仍然是個工具。這跟手機到時間就用鬧鐘叫醒你沒有本質區別。


    如果有一天這個機器人管家突然不聽你指揮了，甚至突然從你家逃跑了，這能算有意識嗎?也不一定。也許機器人的出廠設定是「要儘量保護自己」。她一看你家條件太差，你還整天虐待她，她計算後判定，為了完成保護自己的設定就必須逃跑，這跟自動駕駛汽車會自動避讓障礙物似乎也沒有本質區別。


    倒是有一個場景，可能會說明AI有了意識。有個電影叫《機械姬》，描寫一個女機器人Ava(伊娃)從人類控制中逃跑的故事。可能在一個內行看來，Ava會逃跑這件事還不能說明她有意識，真正驚心動魄的是影片結尾處的一個細節。


