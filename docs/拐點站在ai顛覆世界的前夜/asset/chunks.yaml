    002 拐 點


    01


    大變局：一個新智慧形態的產生


    正 如 iPhone 在 2007 年 開 啟 了 智 能 手 機 時 代 , ChatGPT 在


    2023年開啟了人工智能時代。很榮幸我們趕上了這個歷史時


    刻。那怎麼理解這個新時代呢?要想知道 ChatGPT 究竟是什


    麼，我們必須先考慮更大的問題：AI究竟是一種什麼智能?


    ![](index-17_1.jpg)


    2020年，麻省理工學院宣佈發現了一種新的抗生素，叫


    Halicin。這是一種廣譜抗生素，能殺死那些對市面上現有的


    抗生素已經產生耐藥性的細菌，而且相當安全。


    這個幸運的發現，是用AI完成的。研究者先搞了一個由


    2000個性能已知的分子組成的訓練集，這些分子都被標記好了 是不是可以抑制細菌生長，然後被用來訓練 AI。AI自己學習 這些分子都有什麼特點，總結了一套「什麼樣的分子能抗菌」


    的規律。


    這個 AI模型訓練好之後，研究者用它一個個考察美國食


    品藥品監督管理局(Food and Drug Administration, FDA) 已 經批准的藥物和天然產品庫中的61000個分子，要求它按照3個 標準從中選擇抗生素：(1)它具備抗菌效果；(2)它看起來不像


    第一章 ChatGPT 究竟是什麼 003


    已知的抗生素；(3)它必須是無毒的。


    AI從這6萬多個分子中最後找到1個符合所有要求的分子，這


    就是 Halicin。然後研究者做實驗證明，它真的非常好使。它大 概很快就會用於臨床，造福人類。


    用傳統的研究方法，這件事是絕對做不成的———你不可能


