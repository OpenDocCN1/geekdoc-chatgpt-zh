    使用 AI 神經網絡，分為「訓練」(`training`)和「推理」(`inference`)兩部分。一個未經訓練的 AI是沒用的, 它只有搭建好的網絡結構和幾萬甚至幾千億個數值隨機設定的參數。你需要把大量的素材餵給它進行訓練。每個素材進來，網絡過一遍，各個參數的大小就會進行一遍調整。這個過程就是機器學習。等到訓練得差不多了，參數值趨於穩定，就可以把所有參數都固定下來，模型就煉製完成了。你就可以用它對各種新的局面進行推理，形成輸出。


