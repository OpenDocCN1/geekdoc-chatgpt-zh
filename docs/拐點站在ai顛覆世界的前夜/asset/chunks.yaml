    # 煉製大模型主要分四步


    煉製大模型主要分四步：架構、預訓練、微調和對齊。


    ![](index-339_1.jpg)


    ## 第一步：架構


    第一步是搭建模型的「架構」(`architecture`)。架構就是主要算法，也是這個神經網絡的幾何結構。像我們多次提到的 `Transformer`，就是
    `GPT` 模型中的關鍵架構。你可能聽說過一個用於生成圖像的 AI 叫 `Stable Diffusion`，其中的「`Diffusion`」也是一種架構。`OpenAI`
    在 2024 年 2 月推出的文字生成視頻模型 `Sora`，它的架構則是把 `Diffusion` 和 `Transformer` 結合了起來。


    架構既不神秘也不保密。有些現在最流行的大模型直接就是開源的，比如 `Meta` 的 `Llama-2` 和 `Google` 的 `Gemma`。你可以下載、在自己的計算機上運行這些模型，還可以讀一讀源代碼，完全瞭解它們的架構。開源是硅谷文化的一個光榮傳統。就算像
    `GPT-4`、`Gemini`、`Sora` 這樣的主力商業模型不開源，它們的研發者也會專門寫論文說明模型的架構，用於同行之間的交流。當然現在 `OpenAI`
    一家單獨領先，對外披露的模型信息越來越少，受到不少批評。但總體而論，現代科技公司還是非常開放的，有競爭但更有合作，沒有什麼「獨門秘籍」會被長期藏著掖著，畢竟所有研發人員屬於一個共同的社區。這就使得好想法會以極快的速度傳播。


    因為大家用的算法都差不多，所以架構的強弱主要是參數的多少。參數越多，神經網絡就越大，模型能掌握的智能就越多，但要求的算力也越強。從這個意義上說，一家 AI
    公司的實力主要取決於它擁有多少塊 `GPU`。有一位在硅谷某大廠做 AI 的高管私下表示，他並不看好 `OpenAI` 的未來，他認為 `Google`、微軟、亞馬遜、`Meta`
    這些超大公司都比 `OpenAI` 更有實力把 AI 做好———這就是基於算力的判斷。


    但我們也不能說算法不是競爭領域。`OpenAI` 的 `GPT-3` 只用了 1750 億個參數，怎麼效果比之前 `Google` 上萬億參數的模型還好呢？後來開源的
    `Llama-2` 等模型只用幾百，甚至幾十億個參數，效果竟然接近 `GPT-3.5`。現實是架構算法仍然在高速進步。以最先提出大模型能力「湧現」這個說法而成名、後來加入
    `OpenAI` 的計算機科學家 `Jason Wei` 在 `X` 上說，他現在每天都在嘗試新的算法，他總是面臨把一個已經做了一段時間的算法繼續做下去還是上新算法這樣的取捨。新算法本身不是多大的秘密，開放社區中算法的競爭更多地體現在執行力和冒險精神上。


    現在，沒有一個科學理論能告訴你為什麼這個版本的架構就比那個版本好，也沒有理論能算出，要想達到這個水平的智能，你就得需要那麼多的參數。一切都只有在現場嘗試過才知道。


    `OpenAI` 沒有開源 `GPT-4`，也從未正式公佈 `GPT-4` 的參數個數。你只能大概知道它的架構是什麼，但你暫時不知道其中有多少高妙的細節。


    ![](index-341_1.jpg)


    ## 第二步：預訓練


    第二步是「預訓練」，也就是喂語料。孩子頭腦生得再好，不學習知識也沒用。而 AI 比人強的一個重要特點就是，你給它學習材料，它真學。


    業內存在一些公共可用的語料集，任何公司都能拿來訓練自己的模型。你還可以從一些政府和公益性的網站上直接抓取信息用於訓練，比如維基百科。但正如好學生都會開小灶，優秀的模型必須能取得獨特的高水平語料。`GPT`
    的編程能力之所以強，一個特別重要的因素就是，微軟公司把旗下程序員社區 `GitHub` 網站中多年積累的、各路高手分享的程序代碼提供給了 `OpenAI`，用作訓練語料。


    我希望生活在一個所有知識對所有 AI 開放的世界裡，但我們這個現實世界的趨勢是，優質語料正在成為待價而沽的稀缺資源。2024 年年初，《紐約時報》起訴 `OpenAI`
    用他家網站上原本只提供給付費用戶的內容訓練大模型，還允許模型把內容複述給用戶閱讀，認為這是侵權。但 `OpenAI` 也有話說：並沒有法律規定不能用版權內容訓練
    AI 啊，難道學習還違法嗎？就在這個案子怎麼判還不知道的時候，2024 年 2 月，大型論壇網站 `Reddit`（紅迪網）和 `Google` 達成協議，允許
    `Google` 用它的內容訓練大模型———`Google` 為此每年要向 `Reddit` 支付 6000 萬美元①。


    所以，優質的知識有價，而且很貴。那你說既然語料如此寶貴，我們國產的大模型能不能以佔有正宗的中文語料作為競爭優勢呢？很遺憾，不能。


    一方面是不太需要。`OpenAI` 沒有公佈 `GPT-4` 的語料使用情況，但是根據報告，`GPT-3` 的訓練語料中，中文佔比只有 0.1%②。大模型並不是用中文語料回答中文問題，它可以隨便切換語言，語言只是界面，它是用語義向量而不是任何一種特定語言進行推理，它思考的是知識本身。大模型甚至可以靠一本詞典和幾千個例句現學一門語言跟你對話。我自己的使用體會是，只要
    `ChatGPT` 能準確理解你的問題，不管你用中文還是英文，它回答的質量是一致的。


    另一方面，中文資料在全球現有數據體系中所佔比重很小。中文網站的內容只佔世界互聯網的 1.4%；前文我們說到，`GPT-3` 用到的語料中，中文只佔 1%；在一個通用的大模型訓練數據集中，中文佔比也只有
    1.3%①。


    如果大模型想要對中國的歷史和文化有精深理解，它就必須專門用中文語料訓練。然而到目前為止，中國的大模型尚不完善。


    語料的知識水平很重要，但是是哪種語言寫的並不重要。截至本書定稿之日，國產大模型在中文方面還沒有表現出優勢。


    一個有意思的問題是，語料的作用是有上限的嗎？目前來說，更強的模型一定需要更多的語料，而這就要求有更多的參數，使用更大的算力。但人類的知識似乎應該是有限的。有沒有可能在達到某個程度之後，模型就不再需要更多的語料了呢？又或者說，模型的可伸縮性會從某個數量級上開始變差，以至於更多參數和語料帶來的性能提升已經配不上算力的消耗？我得到的消息是，到目前為止，那個極限還沒有達到。`OpenAI`
    2020 年的一篇論文②顯示，隨著參數的數量級增加，模型的性能就是越來越好，遠沒看到天花板。


    預訓練這一步主要拼的是算力，並不需要花費多少人力。據說包括 `OpenAI` 在內，各家大模型負責預訓練的都只需要十幾個人而已，這裡拼的還是人均 `GPT`
    數量。真正消耗人力的是下一步。


    ![](index-344_1.jpg)


    ## 第三步：微調


    第三步是對經過預訓練的模型進行「微調」。負責微調的工程師數量大約是預訓練的 10 倍。微調的目的是讓大模型說人話。


    預訓練只是讓模型學會預測下一個詞，這個單一功能對我們用處不大。我們需要模型能回答問題，能跟我們對話交流，能根據指令生成內容，能更主動地去做一些事情，這就是微調要做的事情。比如你問模型「奧巴馬是誰」，它必須先把這個提問場景轉化成一個「預測下一個詞」的場景，然後輸出「奧巴馬是第
    44 任美國總統」。這要求模型能聽得懂人話。


    微調的主要辦法是監督學習。就像大人教小孩一樣，你直接告訴他怎樣做是對的，做錯了就給糾正過來。


    這裡面有個神奇點。一位專門從事大模型微調的工程師告訴我，每一類問題，只需要訓練一次就可以！比如你教會模型回答「奧巴馬是誰」這個問題之後，不必再教它怎樣回答「泰勒·斯威夫特是誰」，它自己就能舉一反三————要是訓練次數太多反而不好①。微調階段全部的問題類型大約只有
    5 萬個，這 5 萬個問題學會了，模型就能回答任何問題。


    那把這 5 萬個問題都找出來一一訓練也不容易啊！沒錯，但這裡面有個捷徑可以走。如果你是個後來者，前面別人已經有個訓練好的大模型，比如 `GPT-3.5`，那麼你可以用
    `GPT-3.5` 幫你生成並標記各種微調問題和答案，用於訓練你自己的大模型。有些公司正是這麼做的——但是請注意，`ChatGPT` 的用戶協議中禁止用它訓練模型。


    微調到底調了什麼呢？`OpenAI` 有篇論文①猜測，預訓練已經讓模型掌握了所有知識，微調只不過是讓它學會如何把知識表達出來而已。微調前的 `GPT` 就如同一個滿腹經綸的自閉症兒童，他其實什麼都明白，只是不知道怎麼跟人交流。


    但僅僅會說人話還不行，還得說得精彩、說得好聽，才是好 AI。


    ![](index-346_1.jpg)


    ## 第四步：基於人類反饋的強化學習


    第四步叫「基於人類反饋的強化學習」(`Reinforcement Learning from Human Feedback`, `RLHF`)，目的是讓大模型的輸出內容既精彩又符合主流價值觀，也就是「對齊」。


    比如你問「奧巴馬是誰」，一個只經過微調而沒有經過 `RLHF` 的大模型可能只會簡單地告訴你「奧巴馬是第 44 任美國總統」。這個答案當然沒錯，很多人類也是這麼說話的，但是這樣的內容可能不會讓用戶滿意。我們希望模型介紹一下奧巴馬的生平，也許再說說他有什麼性格特點和喜好，我們希望模型的輸出有意思。可是怎樣才算有意思呢？這沒有一定之規，不能事先設定標準答案，得讓模型自己摸索、自己去闖，然後讓人類給反饋。這就是「強化學習」的作用：你回答得好，我給點贊；回答得不好，我給差評。


    `RLHF` 首先會在公司內部進行，一方面由工程師負責給反饋，另一方面可以用另一個模型代表人類給反饋。比如你可以用 `GPT-4` 去訓練 `GPT-5`。但真人的反饋是最重要的。


    我認為 `RLHF` 讓 `OpenAI` 有了先發優勢。你每一次跟 `ChatGPT` 對話都在幫助 `OpenAI` 積累關於用戶喜好的知識。`OpenAI`
    承諾不會把用戶輸入的內容用於訓練模型，但是你每一次接受或者拒絕 `ChatGPT` 的輸出，都在告訴 `OpenAI` 這樣輸出好不好。這就如同 `Google`
    搜索一樣。我幾乎從來都不會點擊搜索頁面上的廣告，但是我仍然在為 `Google` 做貢獻，因為我對搜索結果的點擊會幫助 `Google` 理解哪個結果是好的。這樣說來算力不是一切：也許你有無數的資源，能突然弄出一個大模型，但因為你的模型此前沒人用過，你不理解用戶喜好，它就不會好用。


    `RLHF` 的一個重要課題是對齊，也就是讓 AI 的輸出符合主流價值觀。`OpenAI` 專門成立了一個團隊，而且還把 20% 的算力都用於所謂「超級對齊」(`Superalignment`)①，以期在未來幾年出現遠超人類智能的
    AI 的情況下，確保 AI 不會製造任何危險。


    你不希望 AI 自己出去黑掉一個網站，更不希望 `ChatGPT` 教孩子怎麼自制毒品，所以對齊的確是非常重要的。但現階段 AI 的對齊似乎被主要用於確保「政治正確」———不冒犯人。對我來說
    `GPT-4` 已經被過分對齊了，比如，你給它一張有政治人物的照片，它往往會拒絕識別。現在美國最大的政治正確是「覺醒文化」(`woke`)，本來是要求避免因為種族、性別或者性取向而導致的歧視，有時候矯枉過正，變成刻意美化這些少數群體。2024
    年 2 月，`Google` 的大模型 `Gemini` 被發現把包括華盛頓在內的美國國父們都給畫成了黑人，簡直是滑天下之大稽。


    在這種情況下，有時候你可能更願意用一個未經對齊的模型。這就體現了開源模型的好處。既然模型是開源的，誰都可以改，母公司就不必承擔道德責任。`Llama-2`
    敢說一些 `GPT-4` 不敢說的話，`Stable Diffusion` 敢畫 `Midjourney` 不敢畫的圖片。另一個思路是仍然要對齊，但是刻意不搞那麼多政治正確。馬斯克的
    `X` 旗下的大模型 `Grok` 智能水平一般，但是會說一些有反叛精神的話，主打一個敢說，也算是找到了生態位。


    你感覺到沒有，微調和對齊很像是人在社會中的成長。可能你在學校裡已經學到了足夠的知識，但是一參加工作還是做不好，因為你不知道怎麼跟同事對接，怎麼和各種人交流，怎麼表現得體乃至遊刃有餘。我們都是被現實教育，不斷獲得反饋，慢慢積累經驗，逐漸自我調整和優化的。微調和對齊步驟告訴我們，就連
    AGI 也不能一下子就能什麼都會：就算知識可以快速灌輸，恰到好處的行事風格也只能慢慢打磨。


    ![](index-349_1.jpg)


    ## 模型應用與知識擴展


    經過前面 4 步，大模型就算煉製成功了，可以像 `ChatGPT` 一樣直接使用了。但你可能不滿足於只跟模型簡單對話，你希望在工作中深度使用 AI，比如讓
    AI 做你們公司的客服人員或者法律顧問。這就要求大模型掌握我們本地的知識。


    模型學習知識的最理想方式還是前面說的預訓練。這樣掌握得最牢靠，而且能融會貫通。其實很多經典或者不那麼經典的書籍，`GPT` 在預訓練階段都已經掌握了，你可以直接跟
    `ChatGPT` 對話式學習。但是預訓練對算力的要求最高，花費巨大，小公司無法承受；再者，預訓練說完成就算完成了，它的知識有個截止日期。那怎麼才能讓模型在預訓練之後學習新的知識呢？


    一個辦法是在微調階段教給模型一些本地的知識。微調的算力成本低，而且這種監督學習會對模型有更直接的影響。然而經驗表明，如果在微調的時候給模型喂太多新知識，它可能會快速忘掉之前的知識。比如，模型本來知道奧巴馬是誰，但是你在微調中讓它學了很多你們公司的員工檔案，它學著學著就可能會過度關注你們公司的事情，而忘了奧巴馬是誰。


    所以，現在更主流的做法是對模型本身不做改動，而是每次需要新知識都讓它「現學現賣」。比如你問 `ChatGPT` 一個最新的時事問題，它會先調用搜索引擎上網搜索相關的新聞，選定幾篇新聞自己讀一遍，再做個綜合判斷，然後給你輸出一個總結性的回答。你還可以把一篇長文章甚至一本書直接輸入給
    `ChatGPT`，讓它自己先讀一遍，形成理解之後回答你的問題。


    這個做法的問題在於模型的輸入是有長度限制的。`GPT-4` 的輸入最大限制是 8192 個 `tokens`（代幣），對應大約 8000 個中文字，比較長的文章都讀不完。`Gemini`
    的一大賣點是允許輸入 100 萬個 `tokens`，但對於企業級應用還是遠遠不夠。更重要的是，模型調用都是根據輸入、輸出長度計費的，如果每次使用都要給模型輸入那麼多的信息，使用成本就太高了。


    現在普遍使用的一個商業化的解決方案叫「檢索增強生成」(`Retrieval-Augmented Generation`, `RAG`)。它的做法是先把你所有的本地知識編碼成一個「向量數據庫」，等到模型要用時，先通過向量數據庫索引到所需要的具體信息，然後查找到那些信息的文本，讀取文本之後再形成理解和判斷，最後輸出給你。如果你的全部本地信息是一座圖書館，`RAG`
    方法相當於給這個圖書館編寫了一個目錄。這個目錄的編碼不是文字，而是向量———我們前面講了，大模型其實是用語義向量進行推理的。這比傳統的搜索要高級得多，因為同義詞、近義詞，甚至不同語言的詞都對應非常接近的向量，你不需要關心具體的文字表述。


    向量本質上是語義，所以更加智能。


    不光文字，現在聲音、圖像和視頻也都可以用 `RAG` 編碼。`RAG` 給大模型提供了巨大的知識擴展能力，但它畢竟仍然是基於檢索的，對知識的理解效果還是不如預訓練那樣自洽。


    韓非子有句話叫「上古競於道德，中世逐於智謀，當今爭於氣力」。我們看看大模型煉製過程中的爭奪點，是不是也有點這個意思：


    預訓練拼的是算力，相當於「爭於氣力」；

    架構和微調需要聰明的算法和精妙的干預，相當於「逐於智謀」；

    對齊需要謹慎選擇價值觀，正是「競於道德」。


    現實是，所有這些操作都沒有定型，都是各家公司積極探索和激烈競爭的領域。如果你用韓非子那句話的邏輯來判定大公司終究有優勢，算力才是根本，大力就能出奇跡，「人均
    `GPU` 數量決定一


