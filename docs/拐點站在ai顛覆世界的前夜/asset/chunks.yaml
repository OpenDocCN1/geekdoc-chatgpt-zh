    只要做一點簡單的編程，你就可以讓GPT按照固定格式輸出每 條評論的情緒值和關鍵信息，然後自動對所有正面情緒評論表示 感謝，給所有負面情緒評論回覆「我們的客服人員會幫你解決問
    題」，並且在回覆中切實列舉客戶反映的問題。


    也就是說，現在得到App完全可以讓AI負責精選和回覆讀者評 論⋯ ⋯ 但是，我們選擇不這麼做。


    我還製作了一個叫「審稿員」的GPTs。我事先設定好提示 語，從此每次寫好一篇文章就把全文輸入給它，要求它找到所 有的錯別字、重複用詞、表達不清楚和容易引起歧義的地方。
