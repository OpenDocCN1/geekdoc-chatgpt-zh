    2024年1月, OpenAI總裁格雷格·布羅克曼在X 上分享了一段經歷。他的妻子5年前一腳踩空導致骨折，從此身上開始出現各種疼痛———先是偏頭痛，又是慢性疲勞，接著是關節痛……他們看了很多醫生，骨科、神經科、腸胃科、皮膚科都看遍了，也沒治好。最近遇到了一個專門治療過敏症的醫生，把她的所有症狀彙總在一起綜合考慮，才找到了病根。原來這是一種叫作「高移動性埃勒斯-丹洛斯綜合徵」(Hypermobile
    Ehlers-Danlos syndrome, hEDS) 的遺傳性疾病。


    我關心的不是這個病，而是為什麼這個診斷整整用了5年才等到。因為醫院本質上是個頭痛醫頭、腳痛醫腳的系統。醫生都是各管一科的專才，很難全面考慮患者的問題，他們接受的訓練都是追求某個領域的深度，而犧牲了廣度。


    布羅克曼一家可以說擁有最好的醫療條件，他們都尚且如此，那普通人豈不是更難?很多時候你到醫院都不知道該看哪個科，而這個科的醫生往往不知道，也不在乎你的病情屬不屬於這個科的診療範疇。理想的治病方式應該是搞個會診，把各科醫生都請來給你一個人看，大家商量一個綜合的治療方案。可是那意味著每個醫生的工作量都得增加很多倍。


    布羅克曼的論點是，AGI可以解決這個問題。我看這就是AGI最好的應用案例。


    AGI 不需要在每個領域都超過人類最好的水平，它只要能達到人類最好的水平，就已經能做像給每個病人都來個專家會診這種現在我們根本做不到的事情。


    如果你覺得AI的智能還很有限，我要提醒你的是，人的智能本來就非常有限。GPT-4剛一出來就有人用它正確診斷了醫生沒診斷出來的病情。如果你去過邊遠地區的醫院，你會只恨那裡的醫生沒用上GPT。


    有些業內人士認為，AI必須達到像愛因斯坦創造相對論那樣的水平才能叫AGI，我認為不必如此。只要能普遍提供專家水平的智能，就已經可以深刻改變世界。


    AGI 意味著你隨時都能請教高水平專家，你可以就任何問題發起一場會診。AGI首先解決的是智能的規模化。


    如果立即就能得到高質量答案，你會問更多的問題。我現在用ChatGPT 的主要方法是，拿起手機來隨便說一通話，語音輸入，它以文字形式輸出。你會不厭其煩地詳細描述一個問題或一個觀點；然後迅速從
    ChatGPT的輸出中找到有價值的點。這比跟真人對話都方便。你不但會更願意問問題，也會更願意思考。你會對疑問和靈感非常敏感，因為它們隨時都可能發生。你的思維會變敏銳。


    就如同撓癢癢一樣。


    對學者來說，這意味著他們會有個貼身的討論夥伴。學者可以對任何問題發起調研，對任何觀點尋求反饋。這個持續的表達一反饋過程能大大強化他們的思考。有研究①表明，一對一的、互相信任的討論效果是最好的。如果愛因斯坦在世，他一定很愛跟AI聊。


    ① Itai Yanai, Martin J. Lercher, It takes two to think, Nat Biotechnol 42(2024),
    pp.18-19.


    而對老百姓來說，這意味著人人都有個忠誠的軍師。我在微博經常看到有人會說一些很愚蠢的話。我經常想，如果這幫人發帖之前先問問 ChatGPT 這話該不該說，說出來對自己的形象有好的影響還是壞的影響，他們的發言質量會高很多。那我們能不能再進一步，生活中的一言一行都先參考一下
    AI的意見呢?甚至能不能不用你問，AI自動就會跟你說話呢?


    2023年年底， 已經有公司推出了佩戴在胸前的 AI設備，它可以聽到你的話、看見你看到的東西。那我們能不能把AI和AR (增強現實)眼鏡結合，給每個人創造一個或若干個能長期陪伴身邊的虛擬助手呢?它會以真人或卡通形象一直待在你身邊，看你做事，跟你說話。


    你做的每件事，它都看在眼裡，並隨時給出建議和點評。當你感到毛躁、憤怒，做蠢事和說傻話的時候，它會設法糾正。當你展現善意、做了好事的時候，它會表示讚賞。你幹活它給你出主意，你情緒低落它給你鼓勁兒，你累了它提醒你休息，你看太多電視它要求你出去跑步——並且在旁邊給你加油。因為它的形象和個性被設計成你很喜歡的樣子，你不會反感它的指手畫腳。


    結果是，你辦錯事、說錯話的次數大大減少。每個人都變得更好。科技會把人人都變成君子———而且是中國春秋時代，孔子那個意義上的君子。


    要知道，古代的「君子」「小人」是身份標籤，而不是道德標籤。有貴族血統、有權力、有地位、從事文化活動的叫君子，從事低端體力勞動的叫小人。是孔子主張了君子的道德責任，中國社會才把「君子」「小人」作為道德評價標準。道德和身份很多時候是矛盾的。這位兄弟有修養、講情懷、志趣高雅，可是沒考上研究生，現在是個服務員，每天就盼著能多收點小費，這是君子嗎?


    AI將讓每個人都可以踏踏實實做真正的君子，因為AI將接管一切小人的工作。現在大模型的一個熱點應用是「Agent」，也 就是「代理人」，它能代表你，相當自主地去調用工具、執行任務和安排事情。當然大權必須掌握在你手裡，但是你可以把跟自己相關的各種信息都告訴AI代理，把所有不重要的事都交給它去做，而它不必事事請示你。從哪家店買什麼菜，哪天理髮，孩子生日送什麼禮物，家裡有東西壞了找誰來修，甚至工資到賬後怎麼安排，這些最好都不要問我，反正我這個人、我的日程表和賬戶就在這裡，AI代理看著辦吧！


    甚至有人想象了找對象相親的場景。有了 AI代理，你既不需要填表說明自己是個什麼人，也不必上網站一個個找人。你可以讓你的AI代理去相親社區跟其他人的 AI代理對話交流。你也不需要設定什麼相貌、學歷、收入之類的硬指標，你的AI
    代理會幫你綜合判斷。代理之間的交流會非常充分且迅速。你的代理可以同時跟很多個代理聊天，可能它1個小時就談了10000個代理，並且幫你選定了一個人———當然，談判的結果是這個人的代理也選定了你。然後你倆再親自出面。想想，你在這種情況下出場，那會有一種什麼樣的儀式感?


    但我們再想想，何必非得是相親呢?任何兩個人的交流都可以先交給 AI代理。這意味著我們在社會上接觸任何人都會是一見如故。AI代理的普及會把整個世界變成一個熟人社會。那麼人的信譽和聲望就會無比重要。


    如果阿爾特曼主張的「全民基本收入」能夠實現，你不就可以專門研究精神生活嗎?如果你能從各種日常瑣事中抽身出來，不就可以思考哲學嗎?如果你衣食無憂還愛琢磨哲學，你的一言一行都處在
    AI驅動的社會評價體系之中，你必然會講道德、講禮儀，你不就是君子嗎?


    何其幸運，我們這一代人正處在通往那個世界的拐點上。


    AI的進展速度遠遠超過了書籍出版的速度，就在本書最後定稿這段時間，我們又看到一些如果放在一年前都是難以置信的新突破。


    我們剛剛講了 DeepMind 的科學家能用AI控制核聚變等離子體的形狀，普林斯頓的一個團隊就實現了用AI提前300毫秒預測等離子體的不穩定態，從而防止核聚變中斷①。我以前是個物理學家，我10年前研究的課題就是核聚變等離子體的不穩定態，我可完全沒想到有人能這麼幹。


    這是決定性的進步。我們當初只是研究什麼樣的構型容易出不穩定態，是純科學研究，遠沒有達到實用的程度。DeepMind 那個研究是可以主動通過事先控制磁場來選一個儘可能穩定的狀態，相當於射箭。而普林斯頓這個研究則相當於開車——根據現場情況隨時調整，這樣就能一直開下去……


    ①Jaemin Seo, SangKyeun Kim, Azarakhsh Jalalvand, et al., Avoiding Fusion Plasma
    Tearing Instability with Deep Reinforcement Learning, Nature 626(2024 ), pp.746-751.


    我們剛剛講了 GPT處理數學題的困難，DeepMind就弄出來一個專門做複雜幾何題的AI, 叫 AlphaGeometry①。它不走GPT路線，但是擁有國際數學奧林匹克金牌選手的解題推理能力。


    ① Trieu H. Trinh, Yuhuai Wu, Quoc V. Le, et al., Solving Olympiad Geometry without
    Human Demonstrations, Nature 625 (2024), pp.476–482.


    我們剛剛講了 GPT有創造性思維能力的蛛絲馬跡，賓夕法尼亞大學和康奈爾大學的一項研究②就證明，GPT-4 比沃頓商學院的MBA學生更有創造力。研究者設計了一系列諸如「如何創造一個長期走路腳不累的高跟鞋」的產品和創業問題，讓GPT-4和學生各自回答，再由第三方評議，結果GPT-4的得分高於學生組。


    更厲害的是，在產生的總共40個被認為是最好的主意之中, 有35個來自GPT-4。


    這不是特例。2024年2月發表的一項研究③說的是，心理學家組織人類參與者——他們基本代表美國人的一般水平——和GPT-4 比創造性，方法是測試發散思維，結果也是GPT-4明顯勝出。


    ② Karan Girotra, Lennart Meincke, Christian Terwiesch , et al., Ideas are Dimes
    a Dozen: Large Language Models for Idea Generation in Innovation, SSRN July(2023).

    ③Kent F. Hubert, Kim N. Awa, Darya L. Zabelina, The current state of artificial
    intelligence generative language models is more creative than humans on divergent
    thinking tasks, Scientific Reports 14(2024).


    你可能會說，這些都是實驗室裡的研究而已，實際應用到底行不行呢?咱們接著看。


    瑞典的一家金融科技公司叫Klarna，它從2022 年起跟OpenAI合作，用GPT負責客服聊天業務①。短短1個月之內，GPT就在23個國家中，使用35種語言，完成了230萬次對話————佔全部客服工作量的2/3，相當於取代了
    700個人類客服人員。而且效果好：不僅消費者滿意率跟人類客服一樣，因為錯誤而導致的重複諮詢率還比人類客服低25%，平均對話時間從11 分鐘縮短到2分鐘。於是,
    Klarna宣佈裁員10%。


    但你不用太擔心被 AI完全取代。客服是個簡單業務，客服人員本來就不需要太多技能。對於複雜業務來說，最好的辦法是人帶著AI一起工作。


    哈佛大學在波士頓諮詢公司————這可是最頂尖的諮詢公司————搞了個對照研究②，使用GPT-4的顧問們比不用GPT-4的對照組多完成了12.2%的任務，而且解決任務的速度提高了25.1%，成果質量提升了40%。明尼蘇達大學的一項研究③則表明，法學院學生用上GPT-4之後，做法律分析任務的完成質量是略有提高，完成速度則是顯著提高。


    這些還只是專門做了研究、發表出來的結果，實際情況其實更激進。


    我在硅谷跟一些企業家交流，他們已經把大模型全

    '
  trans: '


    # 第六章 更大的大局觀


    大的競爭優勢。這就是為什麼阿爾特曼被稱為「創業者的尤達」，為什麼他談論 AGI 之類的事情總能領先眾人的認知。


    再比如所有人都會講的「自信」。阿爾特曼認為自信的關鍵是，你得達到「以終為始」的程度：你必須得非常相信自己能造出火箭，才能從今天開始真造火箭。可是這個自信又不能是盲目的，必須建立在現實的基礎之上。如果別人都質疑你的想法，你該怎麼辦?萬一你錯了呢?怎麼既聽取批評又獨立思考?怎麼在現實和超現實之間取得平衡?這才是修行的重點。


    阿爾特曼講的「專注」也不是什麼集中注意力、不要分心，而是專門做好最重要的事。絕大多數人只是埋頭做事，阿爾特曼要求你花很多時間思考什麼事對自己是最重要的，然後排除萬難優先做好這件事。


    還有「自驅」。一般人認為孩子不用老師、家長管，能自覺完成作業就叫自驅———其實那是大五人格中的「盡責性」。阿爾特曼講的自驅是，我做這件事是為了自己對這件事的評價，是因為我自己看得上，而不是為了讓別人看得上。


    大多數人做事再盡心盡力，也只不過是在做別人認為正確的事：大家都崇尚考研、考公，你也去考研、考公。那其實是一條通往平庸之路：你做的不是真正有意義的事情，而且你會算錯風險。你以為跟別人做同樣的事情就是低風險的，自己做不一樣的事情就是高風險的，其實這根本沒道理。


    阿爾特曼說，有了一定的社會地位和財富之後，如果你沒有一種純粹讓自己滿意的驅動力，就不可能再達到更高的水平。


    還有「冒險」。所有企業家都知道富貴險中求，阿爾特曼則要求你把「能冒險」作為一種自身素質。這包括你應該在儘可能長的時間內保持生活是廉價且靈活的，最好背個包就能搬家——這非常困難。如果你在
    Google 這樣的大公司工作了一段時間，拿到一份對普通人來說很高的工資，你會感受到生活的舒適，然後自動按照這個工資水平計劃明年全家該幹什麼——那你還談什麼創業，你身上的惰性已經佔了上風。


    那為什麼非得出來冒險呢?因為你要做一件了不起的事情。阿爾特曼認為，「做難的事情其實比做容易的事情更容易」，因為難的事情會吸引別人的興趣，人們會願意幫你。同樣是創業，你要說你們公司是做基因編輯的，大家會覺得這很有意思，會很願意支持你；你要說我要再搞一個做筆記的
    App，那沒人在乎。


    為了做難的事情，你需要有「絕對的競爭力」。這意味著你能做一些別人想模仿也模仿不好的事情，這也意味著你會非常反感平庸的東西。


    阿爾特曼講「社交網絡」也跟通常的理解不一樣。在《權力進化論 》 ( 7 Rules of Power) 這 本 書 裡 , 作 者 傑 弗 瑞 · 菲 佛
    (Jeffrey Pfeffer) 從爭奪權力的角度出發, 強調你要佔據關鍵的位置，成為節點人物；阿爾特曼則是從合作角度出發，強調好的社交網絡要讓每個人都能發揮自己的強項，大家取長補短。


    為此，建立社交網絡的最好辦法就是識別出一個人真正的特長，並且把他安排到最適合的位置上去———阿爾特曼說這會帶來 10 倍的回報。


    你體會一下這個思想境界。


    ![](img/index-380_1.jpg)


    這就解釋了為什麼阿爾特曼能有下面這五個野心。


    ### 第一，AGI


    第一個野心是 AGI。 阿爾特曼介入 AI 研究、成立 OpenAI 的初心並不是為了擁有最強的 AI，而是為了一個大得多的目的：保護人類，不要讓 Google
    那樣的壟斷公司通過掌握 AGI 技術而統治人類。所以你看阿爾特曼的言論從來都不是推銷自己公司的 GPT 有多厲害，而是號召人們對向 AGI 的過渡進行管理。


    為了做這件事，阿爾特曼還專門讀了詹姆斯·麥迪遜(James Madison) 關於美國制憲會議的筆記①, 他要借鑑美國憲法的制定過程來研究怎麼管理 AI。他的設想是讓世界各個地區都有代表參與進來，成立一個委員會———而他本人必須參加。他說：「憑什麼讓那些渾蛋決定我的命運呢?」


    ①中文版見 [美]詹姆斯·麥迪遜：《辯論》，尹宣譯，譯林出版社， 2014。


    ### 第二，用科技改變日常生活


    第二個野心是用科技改變日常生活。通過 YC 和他自己的投資，阿爾特曼參與的項目至少包括核能、長壽公司、癌症治癒、 超音速客機等，其中他投資的 Helion
    公司宣稱將來能把電力價格下降到 1 度電只要 1 美分。


    ### 第三，建立影響美國經濟的企業網絡


    第三個野心是以 YC 校友們的公司為基礎，建立一個能直接影響美國經濟，甚至拯救資本主義制度的企業網絡。這個網絡的總價值超過 1 萬億美元。


    資本主義的一個根本假設是經濟必須得增長。有增長，特別是有創新，資本主義制度才是值得的。如果世界從此以後再沒有新事物需要出來了，那就沒創新什麼事兒了。阿爾特曼想要系統性地推動科技創新，拉動經濟增長。


    ### 第四，建立憲章城市


    第四個野心是建立一個憲章城市。也許在美國，也許在其他某個地方，他想搞一個由商人和科技人員運行的、 自我管理的 全新型城市。這個城市可能會有 10 萬英畝①土地，有
    5 萬—10 萬的居民。


    阿爾特曼設想這個城市是 21 世紀的雅典，是一個精英社區，可以測試適應新技術的新管理方式，並且把主要管理職責交給 AI。比如，那裡只允許自動駕駛汽車，不允許人類開車。再如，不允許任何人從房地產中賺錢。


    如果將來世界其他地方都陷入動亂，至少這個城市還是一個樣板，能給人類保留一個希望。不過可能因為政策性的原因，這個項目目前尚未啟動。


    ①1 英畝約為 4047 平方米——編者注。


    ### 第五，全民基本收入


    阿爾特曼的第五個野心是實行「全民基本收入」( Universal Basic Income, UBI)。其實已經有人在做實驗了, 但更大的目標是在美國選一個城市，給其中的居民每人每年發一兩萬美元，讓他們不需要工作。


    這裡的關鍵在於每年一兩萬美元可能就夠用了。阿爾特曼設想，如果核聚變解決了能源問題，AI 解決了勞動工作問題，那麼基本生活成本就會變得非常便宜。乾脆把這筆錢直接發給每個人，大家生活無憂，豈不就可以專門做創造性活動嗎?


    ![](img/index-382_1.jpg)


    這些野心顯然不一定都能成功，但是我看它們都具有可以立即試一試的性質。在這個意義上，我感覺美國的企業家比政客更靠譜；畢竟企業家是真能弄出錢來，不像政客只會描繪藍圖……


    其實阿爾特曼的弟弟還真建議過他去競選總統，不過他要做的這些事不是任何一個總統在任期內能幹成的。也許社會進步的動力本來就應該在企業家而不是在總統身上。這樣的思想如果不是出自阿爾特曼，難道還能出自美國民主黨或共和黨嗎?


    世間的道理好講，行動力才是最寶貴的。阿爾特曼推崇一句名言， 「歸根結底，人們評價你的一生不是看你有多少知識，而 是 看 你 有 多 少 行 動 。 」(The
    great end of life is not knowledge,but action.)


    其實你可以學一學阿爾特曼。遇到什麼難事，想想他做的這些事，想想世界上有這樣的人，你也許會覺得那件難事其實可以達成，那麼就應該達成，所以必須達成。


    我是個整天紙上談兵的作家，但我的讀者中間，將來未必就不能出一箇中國的阿爾特曼。為什麼這個人不是你呢?


    # 跋：拐點已至


    2024 年 1 月, OpenAI 總裁格雷格·布羅克曼在 X 上分享了一段經歷。他的妻子 5 年前一腳踩空導致骨折，從此身上開始出現各種疼痛———先是偏頭痛，又是慢性疲勞，接著是關節痛……他們看了很多醫生，骨科、神經科、腸胃科、皮膚科都看遍了，也沒治好。最近遇到了一個專門治療過敏症的醫生，把她的所有症狀彙總在一起綜合考慮，才找到了病根。原來這是一種叫作「高移動性埃勒斯-丹洛斯綜合徵」(Hypermobile
    Ehlers-Danlos syndrome, hEDS) 的遺傳性疾病。


    我關心的不是這個病，而是為什麼這個診斷整整用了 5 年才等到。因為醫院本質上是個頭痛醫頭、腳痛醫腳的系統。醫生都是各管一科的專才，很難全面考慮患者的問題，他們接受的訓練都是追求某個領域的深度，而犧牲了廣度。


    布羅克曼一家可以說擁有最好的醫療條件，他們都尚且如此，那普通人豈不是更難?很多時候你到醫院都不知道該看哪個科，而這個科的醫生往往不知道，也不在乎你的病情屬不屬於這個科的診療範疇。理想的治病方式應該是搞個會診，把各科醫生都請來給你一個人看，大家商量一個綜合的治療方案。可是那意味著每個醫生的工作量都得增加很多倍。


    布羅克曼的論點是，AGI 可以解決這個問題。我看這就是 AGI 最好的應用案例。


    AGI 不需要在每個領域都超過人類最好的水平，它只要能達到人類最好的水平，就已經能做像給每個病人都來個專家會診這種現在我們根本做不到的事情。


    如果你覺得 AI 的智能還很有限，我要提醒你的是，人的智能本來就非常有限。GPT-4 剛一出來就有人用它正確診斷了醫生沒診斷出來的病情。如果你去過邊遠地區的醫院，你會只恨那裡的醫生沒用上
    GPT。


    有些業內人士認為，AI 必須達到像愛因斯坦創造相對論那樣的水平才能叫 AGI，我認為不必如此。只要能普遍提供專家水平的智能，就已經可以深刻改變世界。


    AGI 意味著你隨時都能請教高水平專家，你可以就任何問題發起一場會診。AGI 首先解決的是智能的規模化。


    如果立即就能得到高質量答案，你會問更多的問題。我現在用 ChatGPT 的主要方法是，拿起手機來隨便說一通話，語音輸入，它以文字形式輸出。你會不厭其煩地詳細描述一個問題或一個觀點；然後迅速從
    ChatGPT 的輸出中找到有價值的點。這比跟真人對話都方便。你不但會更願意問問題，也會更願意思考。你會對疑問和靈感非常敏感，因為它們隨時都可能發生。你的思維會變敏銳。


    就如同撓癢癢一樣。


    對學者來說，這意味著他們會有個貼身的討論夥伴。學者可以對任何問題發起調研，對任何觀點尋求反饋。這個持續的表達一反饋過程能大大強化他們的思考。有研究①表明，一對一的、互相信任的討論效果是最好的。如果愛因斯坦在世，他一定很愛跟
    AI 聊。


    ① Itai Yanai, Martin J. Lercher, It takes two to think, Nat Biotechnol 42(2024),
    pp.18-19.


    而對老百姓來說，這意味著人人都有個忠誠的軍師。我在微博經常看到有人會說一些很愚蠢的話。我經常想，如果這幫人發帖之前先問問 ChatGPT 這話該不該說，說出來對自己的形象有好的影響還是壞的影響，他們的發言質量會高很多。那我們能不能再進一步，生活中的一言一行都先參考一下
    AI 的意見呢?甚至能不能不用你問，AI 自動就會跟你說話呢?


    2023 年年底， 已經有公司推出了佩戴在胸前的 AI 設備，它可以聽到你的話、看見你看到的東西。那我們能不能把 AI 和 AR (增強現實)眼鏡結合，給每個人創造一個或若干個能長期陪伴身邊的虛擬助手呢?它會以真人或卡通形象一直待在你身邊，看你做事，跟你說話。


    你做的每件事，它都看在眼裡，並隨時給出建議和點評。當你感到毛躁、憤怒，做蠢事和說傻話的時候，它會設法糾正。當你展現善意、做了好事的時候，它會表示讚賞。你幹活它給你出主意，你情緒低落它給你鼓勁兒，你累了它提醒你休息，你看太多電視它要求你出去跑步——並且在旁邊給你加油。因為它的形象和個性被設計成你很喜歡的樣子，你不會反感它的指手畫腳。


    結果是，你辦錯事、說錯話的次數大大減少。每個人都變得更好。科技會把人人都變成君子———而且是中國春秋時代，孔子那個意義上的君子。


    要知道，古代的「君子」「小人」是身份標籤，而不是道德標籤。有貴族血統、有權力、有地位、從事文化活動的叫君子，從事低端體力勞動的叫小人。是孔子主張了君子的道德責任，中國社會才把「君子」「小人」作為道德評價標準。道德和身份很多時候是矛盾的。這位兄弟有修養、講情懷、志趣高雅，可是沒考上研究生，現在是個服務員，每天就盼著能多收點小費，這是君子嗎?


    AI 將讓每個人都可以踏踏實實做真正的君子，因為 AI 將接管一切小人的工作。現在大模型的一個熱點應用是「Agent」，也 就是「代理人」，它能代表你，相當自主地去調用工具、執行任務和安排事情。當然大權必須掌握在你手裡，但是你可以把跟自己相關的各種信息都告訴
    AI 代理，把所有不重要的事都交給它去做，而它不必事事請示你。從哪家店買什麼菜，哪天理髮，孩子生日送什麼禮物，家裡有東西壞了找誰來修，甚至工資到賬後怎麼安排，這些最好都不要問我，反正我這個人、我的日程表和賬戶就在這裡，AI
    代理看著辦吧！


    甚至有人想象了找對象相親的場景。有了 AI 代理，你既不需要填表說明自己是個什麼人，也不必上網站一個個找人。你可以讓你的 AI 代理去相親社區跟其他人的 AI
    代理對話交流。你也不需要設定什麼相貌、學歷、收入之類的硬指標，你的 AI 代理會幫你綜合判斷。代理之間的交流會非常充分且迅速。你的代理可以同時跟很多個代理聊天，可能它
    1 個小時就談了 10000 個代理，並且幫你選定了一個人———當然，談判的結果是這個人的代理也選定了你。然後你倆再親自出面。想想，你在這種情況下出場，那會有一種什麼樣的儀式感?


    但我們再想想，何必非得是相親呢?任何兩個人的交流都可以先交給 AI 代理。這意味著我們在社會上接觸任何人都會是一見如故。AI 代理的普及會把整個世界變成一個熟人社會。那麼人的信譽和聲望就會無比重要。


    如果阿爾特曼主張的「全民基本收入」能夠實現，你不就可以專門研究精神生活嗎?如果你能從各種日常瑣事中抽身出來，不就可以思考哲學嗎?如果你衣食無憂還愛琢磨哲學，你的一言一行都處在
    AI 驅動的社會評價體系之中，你必然會講道德、講禮儀，你不就是君子嗎?


    何其幸運，我們這一代人正處在通往那個世界的拐點上。


    AI 的進展速度遠遠超過了書籍出版的速度，就在本書最後定稿這段時間，我們又看到一些如果放在一年前都是難以置信的新突破。


    我們剛剛講了 DeepMind 的科學家能用 AI 控制核聚變等離子體的形狀，普林斯頓的一個團隊就實現了用 AI 提前 300 毫秒預測等離子體的不穩定態，從而防止核聚變中斷①。我以前是個物理學家，我
    10 年前研究的課題就是核聚變等離子體的不穩定態，我可完全沒想到有人能這麼幹。


    這是決定性的進步。我們當初只是研究什麼樣的構型容易出不穩定態，是純科學研究，遠沒有達到實用的程度。DeepMind 那個研究是可以主動通過事先控制磁場來選一個儘可能穩定的狀態，相當於射箭。而普林斯頓這個研究則相當於開車——根據現場情況隨時調整，這樣就能一直開下去……


    ①Jaemin Seo, SangKyeun Kim, Azarakhsh Jalalvand, et al., Avoiding Fusion Plasma
    Tearing Instability with Deep Reinforcement Learning, Nature 626(2024 ), pp.746-751.


    我們剛剛講了 GPT 處理數學題的困難，DeepMind 就弄出來一個專門做複雜幾何題的 AI, 叫 AlphaGeometry①。它不走 GPT 路線，但是擁有國際數學奧林匹克金牌選手的解題推理能力。


    ① Trieu H. Trinh, Yuhuai Wu, Quoc V. Le, et al., Solving Olympiad Geometry without
    Human Demonstrations, Nature 625 (2024), pp.476–482.


    我們剛剛講了 GPT 有創造性思維能力的蛛絲馬跡，賓夕法尼亞大學和康奈爾大學的一項研究②就證明，GPT-4 比沃頓商學院的 MBA 學生更有創造力。研究者設計了一系列諸如「如何創造一個長期走路腳不累的高跟鞋」的產品和創業問題，讓
    GPT-4 和學生各自回答，再由第三方評議，結果 GPT-4 的得分高於學生組。


    更厲害的是，在產生的總共 40 個被認為是最好的主意之中, 有 35 個來自 GPT-4。


    這不是特例。2024 年 2 月發表的一項研究③說的是，心理學家組織人類參與者——他們基本代表美國人的一般水平——和 GPT-4 比創造性，方法是測試發散思維，結果也是
    GPT-4 明顯勝出。


    ② Karan Girotra, Lennart Meincke, Christian Terwiesch , et al., Ideas are Dimes
    a Dozen: Large Language Models for Idea Generation in Innovation, SSRN July(2023).

    ③Kent F. Hubert, Kim N. Awa, Darya L. Zabelina, The current state of artificial
    intelligence generative language models is more creative than humans on divergent
    thinking tasks, Scientific Reports 14(2024).


    你可能會說，這些都是實驗室裡的研究而已，實際應用到底行不行呢?咱們接著看。


    瑞典的一家金融科技公司叫 Klarna，它從 2022 年起跟 OpenAI 合作，用 GPT 負責客服聊天業務①。短短 1 個月之內，GPT 就在 23
    個國家中，使用 35 種語言，完成了 230 萬次對話————佔全部客服工作量的 2/3，相當於取代了 700 個人類客服人員。而且效果好：不僅消費者滿意率跟人類客服一樣，因為錯誤而導致的重複諮詢率還比人類客服低
    25%，平均對話時間從 11 分鐘縮短到 2 分鐘。於是, Klarna 宣佈裁員 10%。


    但你不用太擔心被 AI 完全取代。客服是個簡單業務，客服人員本來就不需要太多技能。對於複雜業務來說，最好的辦法是人帶著 AI 一起工作。


    哈佛大學在波士頓諮詢公司————這可是最頂尖的諮詢公司————搞了個對照研究②，使用 GPT-4 的顧問們比不用 GPT-4 的對照組多完成了 12.2%的任務，而且解決任務的速度提高了
    25.1%，成果質量提升了 40%。明尼蘇達大學的一項研究③則表明，法學院學生用上 GPT-4 之後，做法律分析任務的完成質量是略有提高，完成速度則是顯著提高。


    這些還只是專門做了研究、發表出來的結果，實際情況其實更激進。


