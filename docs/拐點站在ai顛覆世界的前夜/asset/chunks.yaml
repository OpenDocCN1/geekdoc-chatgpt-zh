    第一個教訓是：直覺高於邏輯。


    ![](index-222_1.jpg)


    我先說一個最基本的認識。到底什麼是 AI?以我之見 ：


    AI=基於經驗+使用直覺+進行預測。


    假設你用以往的經驗數據訓練一個模型，這個模型只關心輸入


    和輸出。訓練完成之後，你再給它新的輸入，它將給你提供相當不錯 的輸出，你可以把這個動作視為預測。這就是 AI。你要問模型是怎 麼從這個輸入算出來那個輸出的，回答就是說不清，是直覺。


    210 拐 點


    在 2022年發表的一項研究①中, DeepMind的科學家做成了


    一件對物理學家有點降維打擊的事———用 AI控制受控核聚變


    裝置中的等離子體形狀。


    下圖(圖4-5)展示的裝置就是用來搞磁約束核聚變的，叫託


    卡馬克(Tokamak)。它的形狀像個麵包圈，麵包圈內部那些氣體


    就是要參與核聚變的等離子體。在外面一道一道圍著麵包圈的那


    些線圈一通電就會在麵包圈內部產生一個磁場，這個磁場將會約


    束住等離子體保持懸空狀態，讓這個氣體不要撞到牆上，也就是 麵包圈壁。


    ![](index-223_1.jpg)


    現在你的任務是通過控制那些線圈來調整那個磁場，從而讓


    等離子體生成一個理想的形狀。可是怎麼控制呢?


    ① Jonas Degrave, Federico Felici, Jonas Buchli, et al., Magnetic control of tokamak
    plasmas through deep reinforcement learning, Nature 602 (2022),pp.414-419.


