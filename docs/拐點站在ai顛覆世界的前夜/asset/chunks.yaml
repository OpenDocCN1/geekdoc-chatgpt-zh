    現在回頭看，我覺得更準確的說法還是 AI像人。AI的感知


    方法跟人的感知方法別無二致，只不過比人的範圍更廣、速度更


    快，而且可以無限升級。


    AI,比人更像人。


    這麼看來，也許啟蒙運動以來形式邏輯方法的流行，人類學


