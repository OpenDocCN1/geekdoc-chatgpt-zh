    幾年前有些互聯網大佬說，現在AI預測這麼厲害，我們可以回 到計劃經濟———這完全是錯誤的認識。計劃經濟的本質不是 預測，而是指令和控制。


    我預測明年會流行藍色服裝面料，所以我計劃今年多生產一些 藍色布匹，這不是計劃經濟。計劃經濟是，國家今年給你們工 廠分配了生產這麼多藍色布匹的任務，收購價格和收購數量都
    是固定的，你完成任務就好。前者你是主動的，後者你是被動 的。


