    要想真正理解數據就得深入到用戶中間去。百度是派人到現場去跟用戶聊，瞭解他們的日常生活是怎樣的，他們怎麼看待還款的道德。特別是潛在客戶中很多都是年輕人，他們對自己的還款能力缺乏認識，不太理解借那麼一大筆錢意味著什麼，百度得想辦法幫他們理解。哪怕同樣的硬數據，百度在服務過程中操作
    方法不同，得到的結果也會不同。


    這些都要求你跟用戶有情感溝通。這些是 AI所不能做的。


    百度內部的工作討論也需要情感， 比如數據隱私問題。根據一個人使用閱讀 App讀書的記錄來決定是否給他貸款，請問這合 理嗎?我找你借錢，就得把我在網上各種活動的數據都給你，讓你比我老婆更瞭解我，這好嗎?


    我們站在用戶角度從外邊看，肯定覺得這些互聯網商人真是唯利是圖，無所不用其極⋯ ⋯ 但是站在百度的角度看，他們也有 各種不得已。首先是法律問題。其次，如果濫用數據，將來用戶
    就不願意使用他們的產品了；可是不用數據，互聯網金融又沒法搞。


    百度也很頭疼，召開了各種會議進行道德辯論。辯論中每個 人都結合自己切身的感受，帶著情緒在討論這件事應該怎麼辦。


    辯論的結果大概是，擁有用戶數據的部門不能直接把數據交給金融部門，而是自己先做數據分析，只給金融部門一個標籤或者分數。這樣在中間搞個阻斷，來保護用戶的隱私。


    這些不是AI生成的算法，這是有情緒的人們討論出來的主意。


    ![](index-160_1.jpg)


    而情緒並不是純粹的大腦功能，情緒跟身體有很大關係。


    當你向人傳達一個難以說出口的信息的時候，你會出汗。有人表揚你的時候，你的胸口會有一種緊縮感。感到愛意的時候， 你的胃可能會翻騰。而且情緒和身體的互相影響是雙向的。你在
    剛剛走過一個搖來搖去的索道、心跳加速的情況下遇到一個異 性，那個心跳信號會讓你以為自己遇到了愛情。在飢餓狀態下逛超市會讓你購買更多的東西。人的腸道神經系統被稱為「第二大
    腦」，這使得經常情緒緊張的人也會經常肚子疼。


    我們很多時候是通過身體的反應瞭解自己的情緒的。那 AI沒有身體，它怎麼能有人的情緒呢?它怎麼能理解人的情緒呢? 它怎麼能預測人的情緒呢?至少到目前為止，情緒功能還是人的
    優勢。


    充分感知自己和他人的情緒，區分不同情感之間的微妙差別，會對你的決策有重大影響。


    ![](index-161_1.jpg)


    門檻領導力還包括抒發情緒，這也需要身體。有時候團隊需要你講幾句話來鼓舞人心或者感染氣氛，你怎麼說好呢?


    詩歌，是人類最常見的一種表達情感的方式，而詩歌具有鮮明的身體烙印。詩歌之所以是詩歌，是因為它有韻律和節奏；韻律和節奏之所以對人有效，根本上是因為人要呼吸。


    AI也能寫詩，它可以把格律做得很嚴謹，但是我們預計它很難掌握好節奏感中飽含的情緒，因為它沒有嘴和呼吸系統，它不能體會一首詩歌大聲讀出來是什麼效果。哪怕是最先進的GPT-4，作最擅長的英文詩，韻律也很蹩腳。


    只有真實的情感才能打動人，而真實的情感需要身體和聲音配合表達。你的鮮明個性需要肢體語言配合：你要想體現自信就得站直了；你要想讓人相信局面盡在掌握之中，你不但不焦慮而且很快樂，最起碼你得給個微笑。


    身體對人的影響還包括能量。如果你沒睡好，身體很疲憊，大腦再強也不能好好運轉。能量充足了，整個人的精神面貌都會 變得很積極。


    AI沒有這些。


    ![](index-161_2.jpg)


    培養人的獨特智能的另一個途徑也跟身體有關，那就是自主思考。


    人是由肉體構成的這件事，對人類智能的意義可能比我們想象的要大得多。肉體不僅僅是大腦的維護系統，人不僅僅是一臺大腦。


    從柏拉圖到啟蒙運動，再到現在很多人鼓吹的「意識上傳」，都是把人等同於大腦，忽略身體。比如電影《黑客帝國》裡，人都 被泡在液體裡，接一堆管子，身體成了電池，只有大腦是活躍的，
    照樣能在虛擬空間裡體驗完整人生。


    但是查特拉思認為，這些缸中之腦不是完整的人。 因為身體對人的作用並不僅僅是維持生存，身體還提供了情感。身體，是大腦不可缺少的一個信息來源。如果考慮到腸道神
    經，身體還是人思考過程中的關鍵一環。


    事實上，我們甚至可以說，正因為身體也會影響思想，每個人才有自己的獨立思考。


    你想想，如果人都可以被簡化為缸中之腦，大腦又可以被視為一個處理信息的獨立器官，那你就可以輕易控制每個大腦的信息輸入。這跟AI有什麼區別?哪還有什麼獨立思考可言?


    身體最根本性、哲學性的功能還不是能提供情感，而是讓人有了更多的信息輸入渠道。你的身體對外界會有各種感知，那些感知 是主觀的，是每個人都不一樣的。健康、殘疾或有疾病，胖或者
    瘦，高或者矮，感知都不一樣——正是這些不一樣，讓我們有了不一樣的思考。更何況有身體才有生活，才有成長，才有從小到大不 同的經歷，才有千變萬化的個性。


    絕對的「獨立思考」恐怕是不存在的，畢竟每個人都在從外界聯網提取信息。但是有了身體，我們至少可以「自主思考」。有了身體，就沒有任何力量能完全控制對你的信息輸入。


    查特拉思觀察，有具身智能的團隊往往在文化上更有活力，在道德問題上更深思熟慮。因為這樣的團隊有情感交流。但更重要的是，組成這樣團隊的人具有不可控性。他們不是機器，不是你設定他怎麼想他就怎麼想，他們都會自主思考。正是因為每個人的自主思考，團隊才有了不同視角，才有創造性和活力，才有生成性的發揮，才能處理複雜問題。


    ![](index-163_1.jpg)


    你知道訓練 AI最快的方法是什麼嗎?是用一個現有的AI 生成各種數據和語料，直接訓練新的 AI。這樣訓練不但速度最快，而且最準確。但是因為你沒有新鮮的語料，訓練出來的AI
    也不是新鮮的。


    那就是說，如果每個人都活得像 AI一樣，AI就沒有新訓練素材了，AI會停止進步。


    新數據是人生成的。人不是程序，人不應該按照固定規則生活。人生的使命就是要製造意外，增加信息。有些意外來自你的情感，有些來自你身體的獨特感知，有些來自你自主的思考——
    不管來自哪裡，它們一定不是來自AI給你的灌輸，一定不是來自 你對領導意圖的揣摩。


    那些你任性而為的時刻才是你真正活著的時刻。 這樣看來，AI不是取代人，而是解放了人。AI能讓我們活得更像人。人其實大有可為， 因為人是一種最複雜的東西。你去跟
    任何一個人聊，只要他跟你說人話，不打官腔，不背誦洗腦信息，你都會收穫一些意外的東西，都會發現他有獨特的視角和想法。


    當然，這一切的前提是 AI還沒有掌握人的情感。如果將來AI能夠完美復刻人的情感，我們該怎麼辦呢?


    ## 问答


    ### 问 李航


    是不是可以理解為，以後理工科領域需要的人變少了，大部分 工作由AI來完成?人文領域處理人際關係、對情緒的需求會變多 嗎?或許以後沒有文理之分，直接就是AI領域和非AI
    領域了呢?


    ### 万维钢


    先來看文科生。經過這段時間對AI的使用和觀察，我現在非常 肯定，AI在可以預見的這段時間內不但不會淘汰文科生，而且 會大大地給文科生賦能。


    在現代世界做事，其實任何人都需要一定的理工科能力，需要 有點「數字感」，包括數據處理、量化思維。比如，談論經濟 發展不調用統計數據行嗎?研究心理學不會實驗分析行嗎?哪怕
    幼兒園老師都需要掌握學生的數據。


    以前文科生不是不需要這些，是被限制了，插不上手。因為以 前擺弄數據都需要有一定的機器思維，哪怕是做個Excel 表 格、畫個統計圖，你都得稍微懂點函數、變量，你得做一些不
    太符合直覺的操作，你得記住一些「不是人話」的命令語法。


    以前的文科生被這些技能限制，就只能搞一些空對空的東西， 說一些大而無當的話，其實自己心裡都沒底。這就如同有些搞 了一輩子文史哲的老教授，因為不能讀寫英文，整天看有限的
    中文材料，有再大本事也施展不開。


    ChatGPT正在徹底改變這一切，這裡的關鍵是「自然語言編程」。以後你想畫個數據圖，擺弄什麼統計結果，包括編程搞 自動化分析，直接用人的語言說就行。所有髒活累活都不需要
    自己上手，AI幫你搞定。你只需要瞭解最簡單的原理就行。你 的任務是提供思路，AI會幫你實現。老教授也不用畏懼英文 了，現在不但翻譯質量已經接近完美，人跟ChatGPT
    對話用中 文和用英文已經沒有區別。


    所以，AI消除了文科生做事的障礙，AI解放了文科生。


    那麼對於理工科，就有點問題了。


    如果你是某個領域真正的高手和專家，又或者你的學習和適應 能力特別強，能隨時掌握新工具、進入新領域，那你在任何時 代都不用擔心職業安全，你就是時代的領路人。


    但是如果你的技能僅限於一個很狹小的領域，你在工作中本來 就是根據別人提的需求做事，你是個工具人，那你在任何時代 其實都比較脆弱，在AI時代就更危險了。


    我的建議是，任何時候都做個通才而不是專才，AI時代更是如 此———現在有了AI，學習新東西、上手做事非常非常容易， 得趕緊積極主動走出舒適區啊！


    AI帶來了驚喜：對文科生更多的是「喜」，對理工科生也許會 有很多「驚」。不過理工科生也不用太悲觀。咱這麼想，文科 生之所以喜，是因為他們根本沒看懂——他們不知道機器能做
    到這個程度有多難，他們不能體會這背後的驚心動魄。你驚是 因為你懂，你懂，你至少就有一個領先優勢——你上手AI理應 更快。不過，人家文科生還有別的技能。


    ## 06 存在智能：人類在AI時代刷存在感的方式


    隨著 GPT-4的影響越來越深，人們對 AGI的期待也越來越強了。有人說AGI將在2025年出現，有人說GPT-5就會是AGI, 甚至有 人認為 GPT-4已經是
    AGI。


    我問GPT-4，AGI跟現有的AI到底有啥不一樣? 它列了幾項，包 括獨立學習、會多個領域的知識和技能、邏輯推理和創造力等各方 面都要達到人的水平。它尤其提出，AGI應該有一定的情感理解能
    力，有一些自主意識，有長期規劃與決策的能力……(圖3-11)


    但 AGI還只是達到人的水平而已。將來在 AGI之上還會有「超級人工智能」(Super Artificial Intelligence, ASI ), 要在所
    有領域，包括科學發現和社交技能等方面都遠超人類。


    如果 AGI近在眼前，超級人工智能時代也為期不遠，人又該如何呢?


    查特拉思在《門檻》裡是這樣給AI分類的：


    1.現有的AI， 在邏輯、數學思維、 聽說讀寫這些認知方面 的功能，還沒有完全達到人的水平；

    2.AGI， 認知能力已經完美， 但是在身體和情感方面還不


    ![](index-168_1.jpg)


    相對於現有的AI，包括你，AGI應該有哪些不一樣的技能?


    ![](index-168_2.jpg)


    人工通用智能 (Artificial General Intelligence, AGI) 指的是具有與人類智能 相當的能力的人工智能系統。與現有的人工智能(例如我，基於GPT-4的ChatGPT)相
    比，AGI將具備一系列更加先進和全面的技能。這些可能包括：


    1.獨立學習：AGI將能夠像人類一樣，從零開始獨立學習各種知識和技能，而無需大 量預先編碼的數據或訓練。

    2.跨領域知識與技能：AGI能夠在多個領域(如科學、藝術、哲學等)展示出與人類相 當的知識和技能，而不僅限於特定領域。

    3.邏輯推理與創造力：AGI將具備強大的邏輯推理能力，能夠像人類一樣進行復雜的 思考、解決問題和創新。

    4.情感理解與共情：AGI將能夠理解和處理人類情感，與人類進行更為深入的情感交 流，從而更好地滿足人類需求。

    5. 自主意識與意圖：AGI將具有一定程度的自主意識和意圖，能夠在沒有人類指導的 情況下制定目標並實現目標。

    6.適應性與泛化能力：AGI將能夠迅速適應新環境和情境，對不同類型的問題和任務 具有較強的泛化能力。

    7.長期規劃與決策：AGI將能夠像人類一樣進行長期規劃和決策，考慮未來的可能性 和風險。

    8.協同與社交能力：AGI將具備較強的協同和社交能力，能夠與人類和其他AI 系統合 作，共同完成任務。


    現有的人工智能 (如我)在特定領域可能已經展示出了高水平的性能，但與AGI相 比，仍然存在很大差距。實現AGI仍然是人工智能研究領域的一個重要目標。


