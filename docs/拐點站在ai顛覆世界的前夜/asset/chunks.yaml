    # 第六章 更大的大局觀


    ## 拐點


    我認為轉換視角是一種決定性的領導力優勢。本福爾德號驅逐艦的艦長邁克爾·阿伯拉肖夫(Michael Abrashoff)上任第一天發現，吃飯的時候士兵排著隊打飯，而軍官都跟士兵分開吃。他先代入士兵視角，判斷這個局面肯定會讓士兵的士氣低落；又代入軍官視角，判斷這些軍官也不是故意的，只不過他們不懂士兵的心理而已。

    阿伯拉肖夫什麼都沒說，自己默默跟士兵一起排隊打飯。等下次吃飯的時候，軍官們都學會了。

    你能用他們的視角考慮問題，而他們只能用自己的視角考慮問題，那麼他們應該聽你的。

    有一句有意思的名言不知道是誰發明的，我很想跟美國人說一次：「你說英語是因為你只會說英語。我說英語是因為你只會說英語。咱倆不一樣。」

    那如果錯誤已經鑄成，又該怎麼辦呢?

    平庸之人的本能反應是掩蓋錯誤。才能平庸，脾氣又特別犟的人會把明知是錯誤的一件事一直幹下去，期待出現奇蹟證明自己終究是對的。等到錯誤終於掩蓋不住，這些人又直接不管了。不解釋，不承認，把責任推給別人。

    社會不會一直縱容這樣的人，總有人會把他們的錯誤抓出來。

    但傳統的糾錯方法也有問題。我們習慣一邊喊著「懲前毖後，治病救人」，一邊要求犯錯者做「觸及靈魂的檢討」，讓人家各種自我羞辱、自恨，其實除了提供情緒價值啥用沒有。

    正確的做法是把改正錯誤當成純技術性的事情操作，其實無非就是修改神經網絡而已。帕裡什提出 4 個糾錯步驟：

    1.接受責任，哪怕不完全是你的過錯，也是你的責任，接受責任才能讓你對局面有掌控權；

    2.反思，當初你的決策和執行過程到底是怎麼回事，具體哪裡出了毛病；

    3.制訂計劃，下次要做好；

    4.修復關係，你的錯誤已經給別人造成了傷害，現在你必須想辦法彌補，最起碼先給人家一個真誠的、精英水平的道歉。①

    出錯是一個機會，你終於發現你的神經網絡需要更新了。

    生理性的弱點人人都有，後天養成的壞習慣卻可能把麻煩無限放大。帕裡什的一個洞見是，我們之所以容易養成壞習慣，是因為行動和行動的後果之間存在延遲。

    比如，你今天吃多了甜食或者沒去鍛鍊，不會立即變得不健康；你忽略了家人的感受，不會立即破壞你們的關係；你沒好好工作，也不會立即就被解僱。

    壞動作沒有即時反饋，壞習慣就形成了。所以我們都應該感謝那些看見我們做錯了、能大膽到給我們指出錯誤的人，人家那是在訓練我們。

    而比沒有即時反饋更可怕的局面是，得到了錯誤的反饋。最後我們聽聽弘一法師李叔同的告誡：「人生最不幸處，是偶一失言，而禍不及；偶一失謀，而事倖成；偶一恣行，而獲小利。後乃視為故常，而恬不為意。則莫大之患，由此生矣。」②

    你說了不該說的話，結果啥事沒有；做了錯誤的決定，結果事情居然還成了；自我放縱一把，反而還小小賺了一筆。你不但毫無警覺，還受到了鼓勵，所以你的神經網絡據此就往錯誤的方向訓練。殊不知莫大的禍患就從這裡開始。

    ①萬維鋼：《精英水平的道歉》，得到 App《萬維鋼·精英日課》。

    ②李叔同：《弘一法師全集(全四冊)》，新世界出版社，2013。


    ## 03 狂人：山姆·阿爾特曼的系統性野心


    隨著 ChatGPT 和 OpenAI 的火爆, OpenAI 的 CEO 山姆·阿爾特曼也變得越來越知名。但我預計在未來幾年之內，他的影響力會比現在大得多，成為像喬布斯、馬斯克一樣的人物，甚至更偉大。

    每個企業家都想要改變世界，但大多數人能改變自己周圍的一小塊就很不錯了。如果你運氣很好、能力很強，也許最多可以改變世界的一個側面。

    喬布斯把人文藝術和科技結合起來，強化了一種設計理念，可謂是改變了世界的一點色彩。馬斯克大搞交通革命和能源革命，又要登陸火星，也許能稍微改變世界演進的方向。企業家的野心再大，也只是把自己作為一個榜樣：我認為這個事對，我先做起來，你們要是也認可就跟我一起幹，咱們能做成多少算多少。

    山姆·阿爾特曼可不是這麼想的。人們最感興趣的是阿爾特曼對 GPT 模型、對 AGI 的看法，但這些只是他打算做和正在做的事情中的一小部分。我深入研讀了一些關於阿爾特曼的報道①，讀了他的博客②，聽了一些他的講座和訪談，感覺此人野心之大，可能前無古人。

    簡單說，阿爾特曼想要系統性地改變世界。

    他不只是想在某幾個領域做一些事情，而是想徹底改變所有人的生活；他不但要進行單點突破，還要把各個突破聯繫起來，對世界做出一個協調性的、統籌性的安排。

    據我所知，阿爾特曼正在做和打算做的事情至少包括以下 5 項:

    1.實現和管理 AGI;

    2.用核能、生物科技和 AI 全面升級現代生活方式；

    3.成立一個由企業家組成的超級組織，改善資本主義經濟；

    4.建立一個「憲章城市」，測試未來的基礎設施和管理方式；

    5.給普通人提供全民基本收入。

    這些都不是普通企業家經常想的事。阿爾特曼憑什麼能做這些?

    ![](img/index-369_1.jpg)

    山姆·阿爾特曼出生於 1985 年 4 月，目前還不到 40 歲。當你第一次聽說他的各種想法的時候，可能會覺得這人是不是太狂妄了。但如果你仔細瞭解，尤其是當你知道他已經做成和正在做的一些項目的時候，你會覺得好像真的應該這麼做。

    先是 OpenAI。OpenAI 已經變更成一個營利性公司, 這讓馬斯克很不高興，因為它最初是阿爾特曼和馬斯克共同建立的一個非營利組織，這個組織的使命就是要阻止
    AI 將來奴役甚至消滅人類。

    當時他們的設想是，既然 AI 註定越來越厲害，將會擁有超過人類的智能，那與其讓 Google 那些壟斷性大公司把 AGI 做出來，還不如我們先做出來——起碼我們做事比較靠譜。OpenAI
    的初心遠不止是做一個大語言模型，提供能提高生產力之類的服務，而是為人類負責。

    而在此之前，早在 2014 年，阿爾特曼就花 3.75 億美元連續投資了一家叫 Helion 的研究受控核聚變的公司。

    這家公司宣稱將在 2024 年實現`Q >1`的淨能量輸出，並且解決所有關鍵的工程問題。你可以想想，這個手筆有多大。

    2022 年 ， 阿 爾 特 曼 以 1.8 億 美 元 投 資 了 一 家 叫 Retro Biosciences 的生物科技公司，這家公司研究的是逆轉衰老。阿爾特曼的願景是，人人都能健康地活到
    120 歲。

    阿爾特曼不但參與這些項目，還打算把這些項目結合起來。

    他還通過創投公司 Y Combinator(YC 創業營, 簡稱 YC) 參與了數不清的項目。

    這裡我會重點講講 YC 的故事，阿爾特曼在 2014 年至 2019 年間擔任 YC 的 CEO。

    根據硅谷名人馬克·安德森(Marc Andreessen) 的說法,阿爾特曼把 YC 的野心提高了 10 倍。

    ![](img/index-370_1.jpg)

    YC 是一傢什麼公司呢?這得從一般的風險投資說起。美國能有這麼多創新，一個特別重要的原因就是風險投資非常發達。只要你有一個好技術或者好想法，還有執行力，你不需要自己有錢，有人會給你投錢，並且幫你找客戶、拓展市場，希望從你發展壯大的這個過程中獲利。

    風 投 是 分 階 段 的 。 先 是 種 子 輪 ， 然 後 A 輪 、 B 輪 、 C 輪……一直到上市。當然絕大多數公司會倒在其中某一步上，但是這些公司在這個過程中可以跟很多家風投公司合作，各家風投可以只參與其中某個階段，然後在下一階段轉手，獲利退出。創業者得到了成長的助力，投資者的風險會被分攤，而且投資者會投很多家公司，只要有幾個能成功就賺了。這是一個很有美感的機制。

    YC 是硅谷大佬保羅·格雷厄姆(Paul Graham ) 和他妻子以及兩個朋友做起來的，它給風投的機制帶來了一個系統性的革新。

    YC 的思想可以稱為「孵化」或「加速」，也可以說它提供了一個「創業公司訓練營」。

    假設你創辦了一家剛起步的小公司，還沒有得到風投的關注，你不知道怎樣才能做出名堂，那麼你可以申請加入 YC 的訓練營。YC 每年搞兩次訓練營，每次有上萬家公司申請，只會錄取兩三百家。一旦被錄取，YC
    就會給你提供 12.5 萬美元的種子資金，換取你公司 7%的股份。①

    訓練營為期 3 個月， 只教你一件事———怎麼把公司做成「獨角獸」，也就是市值 10 億美元的公司。

    ①這兩個數字在不同的時期有所變化，但是大抵如此。

    3 個月後，YC 會舉辦一場路演大會，線上線下大概會有好幾千個投資人參加。你有大概 15 分鐘的時間向這些投資人解釋你的公司為什麼能發展壯大，爭取從他們那裡拿到
    A 輪融資。如果成功，你就算順利畢業了。

    12.5 萬美元換 7%的股份，意味著每家公司在接受訓練前的估值都是 180 萬美元左右；而路演日之後，這些公司的平均估值會超過 1000 萬美元。

    時至今日, YC 已經孵化出了 Airbnb(愛彼迎)、Dropbox (多寶箱)、Reddit 等大名鼎鼎的公司。

    從 YC 畢業的所有公司的總市值已經接近 1 萬億美元。

    YC 這麼厲害，首先是因為它嚴格挑選創業公司。一開始是格雷厄姆等人根據自己的經驗判斷什麼樣的公司能成，比如「投公司就是投創始人」什麼的；後來是用 AI 輔助挑選。

    其次，YC 真能教你一些東西。比如，格雷厄姆的一句格言是「製造人們想要的東西」( Make something people want ), 因為只有這樣，公司才能增長，而增長是創業公司最本質的特點。YC
    的內部標準是：一家創業公司能不能每週增長 10%。再比如，格雷厄姆非常強調節儉。他不希望創業公司有很多錢，而是希望你把每一分錢都用到刀刃上，因為只有這樣才能迫使你集中精力把事情做好。更有用的一課可能是
    YC 會教你如何用故事打動投資者，比如把自己跟一家著名的獨角獸聯繫起來。

    但 YC 最重要的強項恐怕還是校友網絡。你的公司原本默默無聞，進了 YC 一下子就成了很多家風投的關注對象；從 YC 畢業的公司發展壯大之後又會以投資人的身份回來——你們形成一個巨大的校友網絡，互相提攜。別的不說，光是隻要從
    YC 畢業就有上千家公司願意瞭解甚至試用你的產品這一點看，YC 就有巨大的價值。

    YC 利用自己的聲望和網絡，製造出了一種關於風投的規模效應。

    阿爾特曼非常理解這個效應，並且打算把它發揮到極致。

    2005 年，還是斯坦福大學大二學生的阿爾特曼創辦了一家叫 Loopt 的公司，並且以第一批學員的身份加入了 YC 創業練營。

    Loopt 一度被估值到 1.75 億美元。後來阿爾特曼大概是很喜歡 YC 的工作模式，就在 2012 年以 4300 萬美元的價格賣掉了 Loopt，自己幹脆成了
    YC 的一名創業導師。

    人們很快就發現阿爾特曼作為導師的才能。他特別善於鼓舞人心———也許用中國話叫「忽悠」———他能讓你清晰地看到自己公司的潛力。阿爾特曼被稱作「創業者的尤達」，像電影《星球大戰》裡的尤達大師一樣。你遇到困難不知道怎麼辦，找阿爾特曼聊聊，他會在三言兩語之間給你一個直指要害的建議。

    格雷厄姆對阿爾特曼極為滿意，就在 2014 年把 YC 創業營 CEO 的位置傳給了當時年僅 29 歲的阿爾特曼。阿爾特曼毫不含糊，立即著手改變 YC。

    本來公司高層的想法是，既然 YC 最大的價值在於校友網絡，那我們就應該想辦法讓學員們更愛 YC， 比如最起碼應該給他們提供更好吃的食物。但阿爾特曼認為這樣的愛可以少一點。

    阿爾特曼認為 YC 的淘汰率還不夠高。風險投資這門業務服從冪律分佈規律。根據二八定律，風投的大部分利潤來自少數幾家公司。既然如此，就應該讓那些不行的公司以更快的速度失敗，別再干擾
    YC——所以 YC 應該更冷酷無情一些！

    你看這種思維、這個底氣，也許只有年輕人才能做到。阿爾特曼的底氣還體現在，他認為有些從 YC 畢業的創始人變得狂妄自大，這對 YC 和硅谷都很不利。於是他給一些人發郵件警告說：有些公司僅僅因為是從
    YC 出來的就能保持活力，這是不對的，不好的公司最好迅速死亡。

    這就如同在革命接連取勝的情況下主動精簡組織成員，試問有多少 CEO 有這樣的意識?但在二八定律之下，這是絕對正確的。

    除此之外，阿爾特曼還在最大限度擴大 YC 的影響力。他讓 YC 做了一個無須錄取的創業學校①，提供免費的在線課程，誰都可以參加。你上這個課，YC 不會給你投資，也不拿你的股份，但是它仍然希望你能夠發展壯大⋯
    ⋯ 也許將來你會以意想不到的方式回報 YC。

    而對於圈內公司，阿爾特曼則是把 YC 這個校友網絡給加強了。有人說 YC 網絡就像個聯合國，阿爾特曼就是秘書長。他經常領導這些公司聯手做一些事情，比如研究
    AI 策略、環保問題或者美國的科技政策。

    所以阿爾特曼的策略是讓 YC 網絡更緊密。原本的情況是：一開始 YC 擁有你 7%的股份，等你畢業得到了風投公司的大筆資金，YC 的股份就被稀釋了。而阿爾特曼搞了個成長基金，叫
    YC Continuity, 專門在你畢業的時候追加投資, 讓 YC 繼續擁有你公司股份的 7%。

    這就等於搶了傳統風投公司的戲。你覺得紅杉資本對此會怎麼想?這個運作模式的極端情形是，將來但凡有一家有潛力的創業公司，YC 就會提供從搖籃到壯大全方位的支持和服務，然後這家公司還會回來反哺
    YC 培養的其他公司，這些 YC 校友會形成一個足以震動世界的網絡……難道阿爾特曼要接管一切嗎?

    ![](img/index-375_1.jpg)

    要知道，阿爾特曼早在 2016 年就已經在給美國國防部長提政策建議了，而且他認為真正的大事還不能交給政府做。

    這麼看來，OpenAI 只是阿爾特曼計劃中的一環，核能、長壽項目則是其他環節。只不過後來 OpenAI 越做越厲害，阿爾特曼就在 2018 年加入了 OpenAI
    的董事會。

    2019 年，阿爾特曼乾脆辭去了 YC 的 CEO 職位，成了 OpenAI 的 CEO⋯ ⋯ 然後就變成這幾年的傳奇了。

    而這些都只是阿爾特曼腦子裡那些宏大敘事的開始而已———別忘了，他才不到 40 歲。

    早在 2009 年，保羅·格雷厄姆就在一篇文章①中寫道，他在給創業公司提建議的時候，最喜歡引用兩個人的話：一個是喬布斯的，一個是阿爾特曼的。他說，對於設計問題，他會問：「喬布斯會怎麼做?」對於戰略和野心問題，他會問：「山姆會怎麼做?」

    格雷厄姆不見得讀過《三國演義》，但他這個句式明顯是「內事不決問張昭，外事不決問周瑜」啊！那一年山姆·阿爾特曼才 24 歲，而格雷厄姆比他大 20 歲。

    所以我感覺，如果想要做一番大事，正確的方式是年長的人向年輕的人學習，而不是年輕人向老人學習。年輕人不但距離新事物更近，而且有更大的雄心壯志。

    當然也不是所有年輕人都能如此。阿爾特曼何德何能，讓格雷厄姆那樣的大佬來把他當老師呢?

    ![](img/index-376_1.jpg)

    阿爾特曼出生於美國的一個猶太裔家庭，8 歲就得到了屬於自己的 Mac 電腦，並且開始接觸編程。他在大二時創辦的公司 Loopt 的業務是，用戶可以通過跟朋友分享所在的地理位置進行社交。請注意，那時候才
    2005 年，還沒有 iPhone。為了全力做好這家公司，阿爾特曼直接從斯坦福大學退學了。

    嚴格說來，阿爾特曼是在大約 20 歲「參加工作」的，至今已經有快 20 年切切實實的創業經驗。對比之下，如果你老老實實上完大學，又考研，又念個博士，搞不好
    30 歲都沒接觸過真正的利益得失，何談做什麼大事⋯ ⋯ 這就叫「有志不在年高」。

    阿爾特曼的行事作風異於常人，比如非常講求效率。他總是用最快的速度處理郵件和會議。如果他對你講的東西感興趣，他會全神貫注地盯著你聽你講話；如果他沒興趣，會很厭煩。這種「專注力」甚至讓人感覺他是不是有阿斯伯格綜合徵———也就是大腦有問題，但是對某些知識掌握得特別細的那種怪人————阿爾特曼否認了。他還開玩笑說，為了讓人相信他是一個正常人而非
    AI， 他要練習多去幾次廁所。

    阿爾特曼有強烈的目標感，每年都要列一份目標清單，每隔幾周看一次，想方設法把上面的幾件事都做成。為了達成目標，他會一直工作，不惜累到病倒。格雷厄姆的說法是，「阿爾特曼非常善於變強大」。

    阿爾特曼對新科技、新思想特別感興趣，不但了熟於胸而且會用在生活上。比如，他會告訴你微量的核輻射對身體有好處。

    阿爾特曼的業餘愛好包括開跑車、開飛機，以及⋯ ⋯ 為世界末日條件下的生存做好準備。他常年囤積槍支、黃金、碘化鉀、抗生素、電池、水、防毒面具和一個安全的地方————一旦美國陷入末日，他就可以飛過去。也許我們可以把這理解成企業家偏執的行動力。

    而這些還只是表面。

    2019 年，阿爾特曼寫了一篇博客①，題目就叫《如何成功》(How To Be Successful)。我建議你讀一讀這篇文章, 這實際上是阿爾特曼結合自己接觸過的眾人的經驗，對創業者提出的忠告和人生建議。

    他講了複利、專注、自信之類的話題，乍一看都像是成功學的老生常談，但仔細想想的話，這裡邊其實有東西。阿爾特曼說的不是一般意義上的個人成功，也不是一般意義上的做生意，而是一種修行，是如何在思想和行動上最大化個人潛能。

    比如「複利」，他認為不要做那種做 20 年和做 2 年沒區別的事———得有積累效應，越做越好、越做回報越高才行。那最值得積累、能帶給你最大商業競爭優勢的東西是什麼呢?阿爾特曼認為，是你對這個世界上的不同系統是怎麼組合在一起工作的長期思考。

    這大概也是阿爾特曼最不同於一般企業家的地方。他喜歡思考，他願意花很多精力去把一件事想明白，而且他認為這個是最

    ①尤其推薦 Tad Friend 的文章: Sam Altman''s Manifest Destiny。

