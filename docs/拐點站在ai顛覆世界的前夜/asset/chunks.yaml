    但一個更大的突破方向可能是機器人。人們對 AI進展的一


    個經典抱怨是，本來應該讓機器做各種家務活，我們人類擺弄琴 棋書畫———現在怎麼AI先學會了琴棋書畫，我們人類卻還在做


