    ## 問答


    問 張洋


    如果真發展到了強人工智能的程度，會不會進一步導致更多的人單身呢?在一個「完美」但不真實的伴侶與一個真實卻滿身「缺點」的人之間做選擇，該選誰?


    問 曉添才


    如果`AI`越來越能夠知冷知熱，那麼，人們對真人伴侶的需求會大大降低嗎?


    萬維鋼


    現在`AI`伴侶和`AI`保姆都還沒有出現，不過我們可以類比。


    中國古代實行一夫一妻多妾制，大戶人家都有很好的僕人和奶媽。妾肯定比妻漂亮，僕人和奶媽肯定更聽話、更順從，那麼那些人是不是對妾、對僕人產生了更多的依賴感呢?


    應該是沒有。蘇東坡能寫下「十年生死兩茫茫」，對自己妻子那是多深的感情。他的個人品德放在古代絕對算是人文主義者。可是他隨隨便便就可以把妾送人，甚至包括兩個已經懷孕的。


    實際是，妾和僕從一樣，是買來的，是在相當程度上被物化了的人，是不平等的、低人權的、低人格的人。當然古代一直都有人愛妾勝過愛妻，還有明憲宗朱見深最愛的人是比他大
    17 歲的奶孃——但這些是特例，是被主流文化所反對的。


    我們還可以把`AI`跟現代電子娛樂信息作類比。古代人沒有電視和網絡，需要真人的陪伴，可能很多人結婚就是為了找個伴；現代人一個人也可以過得很有意思，那是不是因為娛樂信息讓結婚率下降了呢?


    下面這張圖展示了 1960 年以來美國結婚率的變化情況，基本上是一路走低。(圖 3-13)


    ![](img/index-178_1.jpg)


    但是請注意，美國結婚率從 2010 年開始就穩定了。按理說這時候智能手機和網絡娛樂節目剛剛興起，人們獲得電子陪伴更容易了，為什麼結婚率沒有進一步下降呢?


    事實上，20 世紀 60 年代以來的結婚率下降，更多是因為女性工作參與率提高，經濟獨立，人格也更獨立，她們對結婚沒有那麼大的需求了，而不是因為可以找電子娛樂做陪伴。


    所以平等的、真人的陪伴應該是不可替代的。其實現在也有很多宅男號稱愛二次元動畫人物勝過愛真人，但他們未必是認真的，而且是少數。


    關鍵在於，`AI`也好，妾和僕人也好，都是可替代的。因為可買賣就可替代，可替代就可升級，有更好的隨時就能換一個。人的情感很有意思，不可替代、不能換，明明是一種束縛，反而加深了情感。


    我說不清其中的具體原理，但是歷史數據不支持人會愛`AI`勝過愛真人的推測。


