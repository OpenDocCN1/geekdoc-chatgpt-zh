    因為這個世界是有秩序的，它講理，什麼事情都不會無緣無故發生①，所以我們可以採納沃爾夫勒姆的哲學，認為世間的一切 演化和運動————不論是行星繞著恆星轉、一草一木的生長，還
    是一塊石頭從高處掉下來————都是計算。而人類為了認識世界 和預測世界，就必須通過某種更簡化、更快捷的計算，提前知道真實世界的計算結果。

    為此我們使用了兩種計算方法，一種是神經網絡，一種是形式邏輯。

    所謂形式邏輯，就是把問題變成數學問題進行推導。你寫下方程，其中每個參數都有特定的意義，每一步推演都有明確的因果關系，你非常清楚每個中間步驟為什麼要這樣做，你有一個清晰的理
    論。形式邏輯是人類智慧的偉大發明，也是啟蒙運動以來唯一正統的分析問題的方法。我們所有的科學理論都是基於形式邏輯的。對 任 何 問 題 、 任 何 操 作 ，
    能 用 形 式 邏 輯 表 述 清 楚 ， 你 才 算 是 真「懂」。形式邏輯代表「理性」。

    從最簡單的加減乘除到最複雜的計算機程序和物理學家的數值模擬，人們通常所說的「計算」都是形式邏輯的。形式邏輯要求 你嚴格按照某些規則操作，這對人腦來說其實很費力。這就是為什
    麼我們發明了計算機去代替我們執行形式邏輯的算法。

    人類原本擅長的、天生就會的計算，其實是神經計算。從大腦到身體，人體是由幾個神經網絡組成的，它們給你提供各種感 知，神經計算就是這些感知過程。你感到餓了、認出一位

    ① 當然，量子力學現象在某種意義上可以是「無緣無故」發生 的，但這不是重點，而且按照沃爾夫勒姆的觀點，可以用多世界 理論避開。

    214 拐 點

    朋友的臉、害怕蛇，這些都是大腦對一組身體或者外部信號的解 讀，解讀的過程就是神經計算。神經計算沒有可言說的規則，你 無法把它分解成若干個中間步驟，也說不清都有哪些參數——但
    你就是能感覺到，而且是快速感覺。這是跟形式邏輯截然不同的 計算路線，以至於我們平時都不會把它稱為計算。

    神經計算和形式邏輯之間有個交集，這是因為人腦也會算些簡單的數學題，但算數學題不是我們最擅長的。我們更擅長的是 用神經網絡直接感知一個複雜的東西。

    比如，當你看見一隻貓的時候，你知道那是一隻貓——這個能力看似平常，卻是幾乎無法用形式邏輯描寫的。到底是這個物體中的哪些參數讓你看出來它是一隻貓的?沒有方程。

    你只能說，因為我見過一些貓，我知道貓是什麼樣的，所以當我看見一隻貓的時候，我就知道那是一隻貓。

    ![](img/index-227_1.jpg)

    這種說不清的神經感知，正是 AI 做的事情。AI 的本質，就 是跟人腦一樣的神經計算。

    每個 AI 都有一個模型，這個模型是個神經網絡，它有幾百萬到幾千億個參數。當我們用已知的經驗去訓練 AI 的時候，每一 個案例進去，從輸入到輸出的反饋都會把這些參數更新一遍，但
    是每次更新的幅度都非常小。訓練過程中你說不清為什麼這個案 例會讓這個參數的數值變大或者變小了那麼一點點，訓練完畢你 也說不清每個參數的意義是什麼。你使用 AI
    的時候，它每一次 的預測推理都是無數個參數共同參與的過程。

    第四章 用已知推理未知 215

    這正如大腦每次想問題，都是無數個神經元共同參與的過程。這個過程之所以說不清，只是因為有太多參數參與，而不是 因為它有什麼內在的神秘性。

    很多人抱怨 AI 是個黑盒子，從輸入直接生成輸出，說不清中間發生了什麼。可人腦不也是個黑盒子嗎?(圖 4-9)

    ![](img/index-228_1.jpg)

    你開車的時候精心計算過方向盤的角度嗎?你打籃球的時候

    ![](img/index-228_2.jpg)

    會使用公式描寫出手的力度嗎?你當然沒有。這些判斷其實全是 神經網絡的感知。當你走路的時候，當你試圖用手拿東西的時 候，你都是根據說不清道不明的感覺做一個差不多的動作，這都
    是我們日用而不知的神經計算。更不用說藝術家的美感和靈感也都是如此。

    只是有些時候，神經計算會讓我們感到驚奇。 比如一個經 常抓小偷的老警察到火車站隨便掃兩眼，就知道在場誰有可能是 小偷。人們問他，你是怎麼看出來的?我怎麼就看不出來?你這個
    直覺真神奇！警察說， 「無他，但手熟爾」， 我只不過看得多 了。他的神經網絡在抓小偷方面受過很多次訓練，而你

    216 拐 點

    沒有。

    對比之下，前文講過的那個研究——麻省理工學院在 2020 年用 AI 從 6 萬多個化學分子式中找出了一種可用的抗生素，跟警察抓小偷其實沒有本質區別。AI
    只是在訓練中見多了分子式而已。

    非要說 AI 跟人腦的區別，人腦只適合拿我們在演化環境中熟

    悉的東西訓練，而 AI 的神經網絡可以用任何東西訓練——包括分子式、基因序列、磁場線圈參數等等。

    前文介紹過基辛格等人對 AI 的讚歎，他們說 AI 之所以厲害，不在於它「像人」(能做像人一樣的事情 )，而在於它不像人——它能感知人類既不能用理性認知，也感受不到的規律。我認為這是啟蒙運動以來未有之大變局。

    現在回頭看，我覺得更準確的說法還是 AI 像人。AI 的感知方法跟人的感知方法別無二致，只不過比人的範圍更廣、速度更快，而且可以無限升級。

    AI,比人更像人。

    這麼看來，也許啟蒙運動以來形式邏輯方法的流行，人類學者對「理性」的推崇，只不過是漫長的智能演化史中的一段短暫的插曲。用神經網絡直接從輸入感知輸出，才是更根本、更普遍、更厲害的智能。AI
    的出現只是讓智能迴歸了本性。

    我們意識到，形式邏輯只能用於解決簡單的、參數少的、最好是線性的問題；對於真實世界中充斥的像如何控制磁場線

