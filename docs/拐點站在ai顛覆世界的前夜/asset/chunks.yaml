    ## 03 生成: 怎樣用GPT-4編程


    `GPT-4`是個威力無比強大的 `AI`，但是絕大多數人根本沒能讓它得到充分發揮。把`ChatGPT`當作一個聊天機器人隨便玩玩，既對不起你自己的時間和金錢，也對不起
    `GPT`。如果你家有個機器貓，你會只跟它玩腦筋急轉彎嗎?


    `GPT`不是一個聊天工具，而是一個生成式 `AI`。「生成式」的意思是它會創造內容，但它能發揮到什麼程度，不是取決於它，而是取決於你。能把`GPT`用到飛起，可能會是你平生最重要的幾項技能之一。我也是一邊學一邊演練，一邊演練一邊寫稿……


    這一節我想探索下 `GPT`最厲害的一項功夫——編程。這是相對於其他家的大模型，`OpenAI`的`GPT`最強的能力。


