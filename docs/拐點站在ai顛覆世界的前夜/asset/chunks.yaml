    你覺得，我這能算是學會了《純粹理性批判》嗎?我覺得至少我可以跟人談論康德的觀點了。此外，我還可以立即驗證我的掌握情況———讓 ChatGPT 出幾道康德哲學題考我。(圖5-19)


