    AGI 自行编码设计新的 AGI`，`AGI` 迭代得越来越快，水平越来越高，这个组织的领先优势越来越大，以至于任何人想要接触最高智能都必须通过它……请问，这是一个什么组织?


    这个组织难道不就是新时代的「教会」吗?


    这就是为什么很多人呼吁，我们不应该把什么任务都交给`AI`，不能让`AI`自动管理社会。这些人建议，任何情况下，真正的决策权都应该掌握在人的手里。为了确保民主制度，投票和选举都必须由人来执行，人的言论自由不能被`AI`取代或者歪曲。


