    第五章 實戰, 讓 AI 為你所用 245


    下面這個例子出自一篇很火的論文①，我給改成了中文版。 直接問GPT：「150和250之間有多少個質數? 」它的回答明顯錯誤。它一


    上來就說有21個，然後才一個一個列舉出來……結果它總共列舉了19個質數，


    還包括一個超出範圍的251。而且它還不回頭檢查。這是典型的嘴比腦子快。


    (圖5-10)


    ![](index-258_1.jpg)


    150和250之間有多少個質數?


    ![](index-258_2.jpg)


    在150和250之間，共有21個質數。它們分別是：


    151, 157, 163, 167, 173, 179, 181, 191, 193, 197, 199, 211, 223,227,229, 233,
    239, 241,251。


    請注意，這裡包含了251，因為它也是一個質數，雖然它剛好在給定 範圍的邊界上。


    圖5-10


    但這其實可以避免！你只要說「首先列舉150和250之間所有的質數，再


