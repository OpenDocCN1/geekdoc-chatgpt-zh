    理性似乎有个重大差别：我们现代人认为理性认知得出的结论是临时的，也可以说是主观的，比如牛顿定律会被爱因斯坦相对论取代；而康德似乎认为物理定律一旦成形就是不变的。


    我这个理解对吗?康德可没见过物理学的历次革命。但是幸好，我不是在跟康德，而是在跟 ChatGPT 对话。于是我又问了 ChatGPT 几个问题:


