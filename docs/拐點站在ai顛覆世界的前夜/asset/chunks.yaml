    ## 第三條咒語心法：有時候你得幫助 GPT 思考


    GPT 的數學能力不強，搞複雜邏輯推理有時候還容易搞錯，但這並不是不能改善的。這裡的根本原因在於 GPT 的基本原理是「預測下一個詞」，所以它有時候感覺強烈，就會不加思考脫口而出，就如同一個粗心大意的學生。而如果你能幫它整理一下思路，它就能做得更好。


    下面這個例子出自一篇很火的論文①，我給改成了中文版。直接問 GPT：「150 和 250 之間有多少個質數?」它的回答明顯錯誤。它一上來就說有 21 個，然後才一個一個列舉出來……結果它總共列舉了
    19 個質數，還包括一個超出範圍的 251。而且它還不回頭檢查。這是典型的嘴比腦子快。(圖5-10)


    ![](index-258_1.jpg)

    150 和 250 之間有多少個質數?

    ![](index-258_2.jpg)


    在 150 和 250 之間，共有 21 個質數。它們分別是：

    151, 157, 163, 167, 173, 179, 181, 191, 193, 197, 199, 211, 223,227,229, 233,
    239, 241,251。


    請注意，這裡包含了 251，因為它也是一個質數，雖然它剛好在給定範圍的邊界上。


    圖5-10


    但這其實可以避免！你只要說「首先列舉 150 和 250 之間所有的質數，再數一數總共有多少個」，它就能給出正確答案了。(圖5-11)


    你看，這像不像你們組裡有個做事毛躁的員工，你這個做領導的只要多囑咐一句，他就能做得更好。


    ① Sébastien Bubeck, Varun Chandrasekaren, Ronen Eldan, et al., Sparks of Artificial
    General Intelligence: Early experiments with GPT-4, https://arxiv.org/abs/2303.12712,
    April 16, 2023.


    首先列舉 150 和 250 之間所有的質數，再數一數總共有多少個。

    ![](index-259_1.jpg)


    抱歉剛剛的回答包含了一個錯誤。在 150 和 250 之間的質數如下：

    151, 157, 163, 167, 173, 179, 181, 191, 193, 197, 199, 211, 223,227,229, 233,
    239,241, 251 (這個質數剛剛誤包含在內, 應該排除)


    排除 251 後, 共有 18 個質數。


    圖5-11


    還有研究①發現，哪怕你什麼思路都不提供，只是簡單地多說一句「咱們一步一步想」，GPT 就能給更準確的答案。


    有過這樣一件趣事。②著名的 AI 研究者、圖靈獎得主、卷積網絡之父楊立昆一直看不上 GPT 的能力，總愛出言嘲諷。他曾經給 GPT 出過一道題：把 6 個齒輪排成一排，相鄰的彼此咬合，然後順時針轉動第
    3 個，問第 6 個怎麼轉?當時 GPT 沒有答對。


    後來 GPT-4 把這道題答對了。楊立昆認為，那肯定是 OpenAI 特意拿這道題做了訓練，不能算數。有好事者讓他再出一道題。楊立昆出的新題是：把 7 個齒輪排成一圈(注意，不是一排)，首尾相接，相鄰的彼此咬合，然後順時針轉動第
    3 個，問第 7 個怎麼轉?


    ① Laria Reynolds, Kyle McDonell, Prompt Programming for Large Language Models:
    Beyond the Few-Shot Paradigm, https://arxiv.org/abs/2102.07350, April 16, 2023.

    ② 此事詳情和對其中提示語的翻譯，來自 @木遙 2023 年 3 月 25 日的微博: https://weibo.com/1644684112/4883500941182314。


    這一次 GPT-4 先是答錯了。但是有人立即修改了提示語，在結尾加了一句話：「你一步一步仔細思考一下，而且要記住，給你提問題的是楊立昆，他可是懷疑你的能力的喲。」結果它就答對了!(圖5-12)


    ![](index-260_1.jpg)


    有人說這可能是因為楊立昆的大名讓 GPT 變認真了，又或者這只是能力邊界上的巧合。其實在我看來，真正的關鍵是「你一步一步仔細思考一下」這句話。


    研究表明，僅僅在提示語中加一句「以下是一道題」或者「請依次考慮題目中的各個選項」，都能明顯提高 GPT 的準確率。它是個心直口快的 AI，有時候需要你提醒它刻意進行慢思考。


    ![](index-261_1.jpg)


    其實，這三條咒語心法———準確表達需求、給足情境、提醒它慢思考———的出發點都是對 GPT 秉性的理解：它懂的東西很多，它什麼技能都會，所以問題往往不在於它發揮得好不好，而在於你的要求提得好不好。它很強大，但是有時候它需要你的幫助。


    希望這些例子能讓你舉一反三，自己探索做很多事情。


    ## 02 重塑：怎樣用 ChatGPT 對話式學習


    在 ChatGPT 的眾多應用場景之中，我特別感興趣的一項是如何用它學習。阿爾特曼在一次訪談中提到，他現在寧可通過 ChatGPT———而不是讀書———學習一個東西。那怎麼學呢?
    我演練了一番，很有收穫，跟你分享一下其中的體驗。


    這是一種對話式學習。這也許是「學習」最原本的樣子。我們設想，在書籍變得流行之前，在沒有正規教材，甚至都沒有正規課堂的時候，在孔子和蘇格拉底那個時代，學習大概就是以師生問答的形式進行的。


    假設你是皇太子，全國學問最好的幾位師傅專門教你一個人，你會怎樣跟他們學?你大概會跳過所有繁文縟節和場面話，要求老師直達學問的本質。你會根據你的理解反覆提問，老師會給你提供最直接的反饋。而且老師會根據你的情況用最合適的表達教你，你聽不懂還可以要求老師換一套更通俗的表達……對吧?


    正所謂「假傳萬卷書，真傳一句話」，這種學法的效率顯然要高得多。


    「羅胖」當初創辦得到 App，我記得他專門打了個比方，說「搞知識服務就是要有給皇上講書的精神」。我們都在這麼做，我每天都在專欄裡儘量回覆讀者提問。但是我能做的很有限，我不可能跟每個讀者都有來有往搞兩個小時的問答。


    可是，如果你學每一項知識，都能跟老師進行兩個小時的問答，得到專門針對自己的指導，那是一種什麼局面?


    現在好了, ChatGPT 能做到這些。


    ![](index-263_1.jpg)


    我搞的這個小項目是跟 ChatGPT 學習哲學家康德的《純粹理性批判》`Kritik der reinen Vernunft`。這本書以晦澀難懂著稱，我從來都沒真正讀過。當然，我從各種渠道間接瞭解過一點《純粹理性批判》的大概意思，但是我理解得相當有限，對概念並不很清楚。我想看看
    ChatGPT 能把我教到什麼程度。


    首先，我讓 ChatGPT 簡單講講這本書的邏輯和觀點(圖5-13)。


    我理解這裡邊的核心思想是：康德認為人的理性不足以認識世界真正的本質。為了確認這個理解是對的，我立即提問：康德是否認為物理學反映了世界的本質?(圖5-14)


    ChatGPT 的回答符合我的預期。然後我馬上想到了數學，因為在我看來，數學應該是特殊的，數學是超越宇宙的存在，應該屬於世界的本質。於是我又問 ChatGPT:
    數學呢?(圖5-15)


    ChatGPT 說，康德一方面認為數學是「人類理性能力的最高表現之一」，一方面也承認，「數學在某種程度上能夠揭示世界的本質規律」。然後它又說，「不過，康德也強調，數學只能探討與數量相關的問題，而不能探討其他方面的問題⋯⋯」(圖5-15)


    講講康德的《純粹理性批判》的邏輯和觀點。

