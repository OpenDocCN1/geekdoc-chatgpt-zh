    # 拐點


    ## 02 慣性：如何控制和改寫你自己的神經網絡


    切」，我認為現在還為時過早。這些不是絕對化的流程，現在還沒有人找到大模型的最優解，這是一門必須在實踐中摸索的藝術。


    這是一本講 AI 的書，但這一節我們不談 AI，專門講講「人」。這麼多年來一個有意思的現象是，腦科學給 AI 研究提供了靈感，AI 研究也反過來給腦科學提供了思路。和
    AI 一樣，人的大腦和身體本質上也是由若干個神經網絡組成的。我發現「神經網絡的訓練和控制」這個視角對個人的成長特別有啟發，以至於我在《精英日課》專欄第 5
    季的後半部分反覆說「神經網絡」這個詞。


    這一節咱們把「仿生學」給反過來用，來個「仿 AI 學」，看看我們自身能從神經網絡的訓練和控制中學到什麼。這可不是我的獨創，近年一直都有學者或有意或無意地使用這個思路，大家發現人的行為習慣、性格特徵、情緒表現等都有神經網絡的性質。我甚至認為佛學中的「業力」，也可以理解為神經網絡。


    正好 2023 年出了本書叫 Clear Thinking (我翻譯為《清晰思考》)①，作者是一位企業家，也是個洞見輸出者，叫肖恩·帕裡什 ( Shane
    Parrish )，總結了一些科學決策和行動的方法。我們就藉助這本書的一些結論，結合神經網絡的思路，講講怎麼在日常生活中的各種小事兒，甚至你都意識不到那是一個事兒的微小環節上清晰思考，做出正確的選擇，從而日積月累，擺脫平庸陷阱。


    本書前面講了，感性大於理性。對你自己的事兒來說尤其如此，神經網絡構建了我們的本能反應，我們是感性的動物。我們會本能地、自動地做很多事情，而其中一些選擇在現代社會中就屬於錯誤。


    想要少犯錯、不平庸，非常困難，因為你是在跟自己的感性本能作對。你需要比你的一些神經網絡兇。


    一個常用的策略是暫停本能反應。最好的辦法就是使用某種儀式。


    比如我們看職業籃球運動員罰籃。他們從來都不是把球拿過來、站好了直接就投，而一定要先把球在原地不緊不慢地拍幾下———術語叫「運球」———找找感覺，完了再投。這就是暫停。場上所有隊員、場邊那麼多觀眾都得等著，因為運動員必須把心緒從剛才的激烈爭奪切換到眼前這個靜止的罰球上，要確保清晰思考。


    姚明是 NBA 罰球命中率最高的中鋒之一，退役以後有一次在酒桌上，姚明分享了自己的罰球秘訣①——從小父母就告訴他要把罰球動作固定下來。在青年隊的時候，姚明都是運
    4 下球就投，後來有一個教練對他說「運 5 下球，時間長一點」。再後來，王菲教練讓姚明把運球之後、投籃之前的那個停頓點抬高到鼻子的高度，穩定一下再投。從此一直到退役，姚明的罰球動作永遠不變。


    你得做到這個程度才行。跟普通人相比，職業球員罰籃可以說是隨便都能投中，但是他們不隨便投———只有普通人才隨便投。


    可能是受武俠言情劇的影響，老百姓總覺得越不認真、越寫意、越放縱就越能打贏的人更厲害，認為贏還不行，還得贏得不費力才能體現美感，最好昨天打一通宵麻將，今天早上來了還能贏⋯⋯這非常愚蠢，這是文藝青年的妄想。


    不費力的贏只能贏普通人，說明你愛打平庸的比賽，你贏不了高手。能豁出去，捨得投入比別人高得多的能量，才是真正的強勢。


    姚明每次罰籃之前都運球 5 下，你為什麼不能在回應別人的爭議之前深呼吸 3 次呢？停頓會讓你的形象更有力量。


    比停頓更難的是知道什麼時候停頓。我們太容易按照某種默認模式自動行動了。帕裡什認為改善行動的方法不是用意志力戰勝默認模式，而是用好的默認模式取代壞的默認模式。


    姚明並不是每次要罰籃的時候先告訴自己暫停，然後決定運球 5 下再投———他是一罰籃就自動運球 5 下。你應該在每次發言之前自動深呼吸。帕裡什說，我們不是取消慣性，我們是要好的慣性。


    我覺得你可以把自己想象成一個由若干個神經網絡組成的 AI，那麼這本質上就是神經網絡訓練的問題。主要策略有兩個。一個是對於我們身上已經有的、有些是與生俱來的不好的神經網絡，也就是我們的弱點，我們要想辦法進行控制。另一個是主動給自己訓練幾個好的神經網絡，以至於遇到相關的情況自動就能做出正確的反應。


    一個是控制，一個是改寫。


    先說後者，有點逆天改命的意思。如果考慮到人本質上就是一臺生物機器，我們要做的就是從硬件層面升級。


    簡單說，你要升級出一套強勢人格來。


    強勢就是高標準。


    帕裡什的一個高明之處是，他把一些常見的概念給精確化了，你能清晰地理解這個概念是什麼意思和怎麼用。


    比如，什麼是「標準」呢？先舉個例子。新英格蘭愛國者隊的主教練比爾·貝利奇克 (Bill Belichick) 是個特別有思想的人。他手下有個球員叫達瑞爾·雷維斯
    (Darrelle Revis)，是全明星側衛。有一次雷維斯參加訓練遲到了幾分鐘，貝利奇克沒有費口舌批評他，而是直接讓他回家了———既然遲到，就別訓練。這就是標準。


    一般人理解標準是一種管理規則，是做給別人看的。既然是規則就有例外，也許雷維斯那天在路上遇到了意外，情有可原，只要解釋清楚，別的球員也不會說什麼。


    但在帕裡什的語境下，標準不是管理規則。標準是訓練神經網絡的素材庫。垃圾進就會垃圾出，你要想訓練一個高水平神經網絡，就得確保只使用高水平素材。對雷維斯公平不公平不重要，重要的是別汙染我的訓練素材。用帕裡什的話說就是，「標準會變成習慣，習慣會變成結果」。


    如果你做的和別人一樣，你只能期望得到和別人一樣的結果。想要不同的結果就必須提高標準。


    平庸的人會因為各種原因降低標準。上一場演出觀眾爆滿，就全力以赴；這一場沒幾個觀眾，再加上已經很累了，那盡力就好——你這不僅僅是對不起觀眾，你更是對不起自己。你的神經網絡被汙染了。


    你必須確保自己交付的每一個作品都是你所能做到最好的。


    ![](img/index-356_1.jpg)


    要實行高標準，你得知道最好的是什麼樣才行。一個好辦法是使用「榜樣」。


    我們一般說榜樣都是泛指，「三人行，必有我師」，只要這個人身上有值得我們學習的地方就行。但是在帕裡什這裡，榜樣的作 用是，逼你實行高標準。


    帕裡什本人在成長過程中遇到過好幾個榜樣。有一次公司要派他去做一項工作，他在會議上談了自己對那個項目的理解，有什麼打算之類。說著說著，在場一位專家打斷了他：「我不知道你家鄉的規矩是什麼，我們這裡的規矩是，你要是不知道自己在說什麼就不要發言。」然後專家一一列舉了那個項目的要點，帕裡什當場就服了。


    程序設計大師不接受難看的代碼，溝通大師不接受未經深思熟慮的電子郵件。榜樣不是讓你追星用的，他們讓你不舒服、如芒在背才好。被大師罵是最幸運的學習經歷。


    要是身邊沒有大師能給你反饋，怎麼辦呢？帕裡什建議向各路英雄豪傑，包括歷史上的偉人學習，讓他們進入你的「私董會」，相當於一個專門針對你個人的教練團隊。他沒提
    AI，但虛擬私董會是 `ChatGPT` 特別擅長的一種角色扮演遊戲，我們現在正好可以嘗試。


    不過帕裡什對私董會有嚴格要求：入選者必須具備你想在自己身上培養的技能、態度或者性格，所以他們必須既有高成就又有高品格。而且隨著你的成長，私董會的名單也要調整。這不是鬧著玩，這是嚴肅的訓練。


    你要訓練 4 個神經網絡。


    一個是「自我認識」(`Self-knowledge`)：你得知道自己會做什麼、不會做什麼，你的長處和弱點，你能掌控和不能掌控的，你知道和不知道的。


    也就是說，你得知道自己的能力邊界在哪裡，即巴菲特愛說的「能力圈」①。你不能什麼事都想做，不要跟人玩別人擅長而你不擅長的遊戲。


    一個是「自控」(`Self-control`)：駕馭自己的情緒和弱點。一個好思路是把情緒和自己拉開距離，就好像觀察外在事物一樣對待它們。


    一個是「自信」(`Self-confidence`)：相信自己有能力，相信自己的價值。


    真正的自信必須是從把一件件事情做成中得來的。如果你曾經做成過很多事，那麼哪怕今天在場的人都輕視你，你也無所謂。如果你經常能把事情做成，你會相信下一次這個事雖然很難，但你也能做成。


    因為自信是從成事中得來的，自信的人會樂於改變自己的觀點，而不是整天就想在某個細枝末節上證明自己是對的。


    自信能讓你專注於做正確的事，而不是做正確的人。自信是面對現實的力量。


    ![](img/index-358_1.jpg)


    最後一個神經網絡更強勢，叫作「自我問責」(`Self-accountability`)。


    凱文·凱利 (Kevin Kelly) 講過一句話：「成熟的基礎是，即使事情不是你的錯，也不意味著不是你的責任。」①帕裡什也是這個意思。


    很早以前，帕裡什在一家公司參與了一個軟件開發項目，負責寫一些關鍵的代碼。當時他同時還被公司指派參加了另一個項目，要開很多會議，忙得不行。那個軟件星期天晚上就要交付，結果到星期天早上，帕裡什的代碼還沒寫好，他就趕緊來公司加班。


    一到公司，領導就劈頭蓋臉地罵了他一通：「你的代碼兩天前就應該完成了！」帕裡什說：「我這段時間這麼忙，你沒看見嗎？而且我本來打算星期五早上來做這個，結果下大雪，我坐的公交車在雪裡陷了兩個小時……」


    領導打斷他：「別再找藉口了，這就是你的錯！你今天必須幹完！」


    但是帕裡什沒有開始寫代碼。他感到了強烈的威脅，他必須捍衛自己的形象。他給領導寫了一封電子郵件，列舉了自己這一週做的所有事情：參與了多少個項目，幫助了多少人……寫得滿滿當當。


    領導立即就回復了那封郵件：「我不在乎。完成任務是你的責任，你要不行就別幹。」


    帕裡什事後想來，其實領導是對的。不是自己的錯，也是自己的責任。他所有的解釋都沒有意義，那只是抱怨而已。而抱怨都是在「對世界應該如何運轉討價還價」———你其實應該做的是接受世界的運轉。


    強人不抱怨。強人總是專注於下一步行動，看看做什麼對未來更有利。


    我覺得神經網絡是個特別好的類比，因為 AI 肯定是不會抱怨的。當然抱怨也是人的一種功能，但你要做的就是把對解決問題無效的功能暫時關閉掉。你要自動讓強勢人格主導這次行動。


    其實哪怕從審美的角度思考，你都知道怎麼做對。比如電視劇裡有一個角色整天在那兒抱怨，你可能會同情他，但是肯定不想成為他。因為你不想扮演受害者。


    帕裡什的洞見是，當你抱怨的時候，你就是一個受害者。事情沒做好就抱怨客觀環境、指責隊友、給自己找藉口、遷怒於別人⋯⋯哪怕你說的都是對的，你也是受害者。朋友會幫你開脫，家人會安慰你，但你還是受害者。


    當一次受害者不是你的錯，但可怕的是你正在把自己訓練成長期受害者。你會有無助感和無力感，乃至於絕望——這就是一種「習得性無助」。


    帕裡什說：「沒有成功人士願意與一個長期受害者共事。只有其他受害者才願意與受害者共事。」


    強人不做受害者。不管是誰的錯，這就是我的責任——我接受現實，我問下一步該怎麼辦。


    你做的每一件事，都是在訓練自己的神經網絡。好好選擇你做的事。


    當心你的思想，它們會成為語言；當心你的語言，它們會成為行動；當心你的行動，它們會成為習慣；當心你的習慣，它們會成為性格；當心你的性格，它會成為你的命運。


    這段話在英文世界廣為流傳。有人說是撒切爾夫人說的，有人說是甘地說的，還有人說是老子說的————但作為中國人，我們知道《道德經》裡沒有這段。我看有個嚴肅的調研①發現最早的一個版本出現在
    1856 年英國科爾切斯特的一家報紙上，是一個叫懷斯曼 (Mr. Wiseman) 的人對青年學生的講話。它現在的定型版本最早出現在 1977 年美國得州的一家報紙上，說是一位已故的連鎖超市創始人叫弗蘭克·奧特洛
    (Frank Outlaw) 說的。這段話不是出自名人之口或經典之中，這是民間流傳的智慧。


    但我看這段話比很多古代經典更能說清楚「修身」的意義。你從神經網絡訓練的角度思考就明白了，點點滴滴的每一個小事都是訓練素材，都在塑造你的意識，而意識跟外界的互動方式就是命運。


    這也是中國人講的「終日乾乾，夕惕若厲」「勿以惡小而為之，勿以善小而不為」更底層的原理：也許那些小事在外界並不會產生什麼嚴重的惡果，但結果並不重要，重要的是它們對你的影響。也許這一點點言行天知、地知、你知，其他任何人都不知

    道，但是它們同樣在訓練你的神經網絡，所以你為自己的身心負責，就必須把小事也都做好。


    謹言慎行不僅僅是為了道德責任，正如節食不是為了省錢，而是為了讓自己變成一個……比如更好看的人。


    當然一般人不想下那麼大的功夫。左右沒有多大價值的事，為啥不活得隨性一點？然而如果你需要承擔不平庸的責任，你想要跳出平庸陷阱，你就需要像運動員重視飲食和訓練一樣重視神經網絡的輸入和輸出。


    過去的經典雖好，卻都是些零散的格言警句，按現代標準來說實操性不強；現在硅谷生活黑客的做法是把修身方法給系統化、精確化乃至流程化，同時用科學方法反覆檢驗。


    前面講的是怎樣給自己的能力做加法，訓練幾個強勢神經網絡；現在進入的主題是做減法，怎麼少犯錯。


    ![](img/index-362_1.jpg)


    我們還是先把概念精確化。什麼叫「犯錯」呢？比如，你被某個想法吸引，認為這裡有機會，於是大膽嘗試了一下，結果失敗了。這不叫犯錯，這叫「試錯」，是一種特別光榮的行為。試錯能讓人學習，試錯體現了智慧和勇氣。正反兩方面的新信息進來都能讓神經網絡成長，不大膽刺探，哪能知道邊界在哪裡？


    又如，你在這件事上的決策程序和執行過程都沒毛病，但結果還是失敗了。這也不叫犯錯，這叫「運氣不好」。程序正義並不能完全避免失敗，但是它能讓你成功的概率大一點。我們追求的是多次博弈積累下來的系統性的勝利。


    而「犯錯」則是，如果這件事給你一個暫停鍵，你有機會清晰思考的話，知道怎麼做是對的，可是你沒有那麼做。


    你知道自己身體已經超重，不應該吃那塊蛋糕，但你還是吃了。你知道討論工作應該對事不對人，可是你沒忍住。你知道這個項目的調研工作還沒完成，有幾個關鍵信息還沒到位，但是你當時已經身心俱疲。


    你被你的弱點給拿住了。


    帕裡什把人的弱點分為兩類。


    一類是內在的弱點，是與生俱來的，可以說是生理性的，是你無法改正的本能。比如在飢餓、口渴、疲勞、睡眠不足、面臨激烈情緒波動、注意力被佔用、心理壓力很大等情況下，你會很容易犯錯，你會被認知偏誤所挾持。我看這種情況相當於神經網絡本身沒啥問題，但是運行出了問題，可能是供電不足或者有硬件失靈導致了性能下降。


    另一類是平時習慣養成的弱點，相當於是訓練出來幾個壞的神經網絡。比如，有的人被自己的權力給慣壞了，整天一衝動就瞎指揮；有的人接連幾次失敗後陷入了習得性無助，被嚇破了膽，再也不敢拿主意了；還有的人深陷信息繭房自得其樂，思想越來越狹隘。


    那怎麼避免被弱點拿住呢？指望理性是不現實的，意志力是一種有限的資源，你會越用越痛苦。除了鍛鍊強勢人格——就是用一套好的神經網絡自動運行，讓弱點沒機會發揮出來——還可以建立一個更高層面的神經網絡，讓它自動管理和控制弱點，形成不犯錯的保障。


    帕裡什列舉了五個方法。


    第一個是「預防」：如果你感覺自己的身體狀態不適合做出好的決定，那就不要做決定。


    這特別適合生理性的內在弱點。當你孤獨的時候，你可能會想吃甜點。當你難過的時候，你可能會想喝酒。那是錯誤的決定，因為甜點和酒不是愛，不能解決你缺愛的問題。


    《孫子兵法》說「主不可以怒而興師，將不可以慍而致戰」，也是說不要在受情緒影響的情況下做重要決定。


    第二個是「用規則替代決定」：不要每次都跟自己討價還價，今天鍛鍊還是不鍛鍊，要建立一條每天都鍛鍊的規則，沒有藉口。


    規則能定義你是誰。比如公司聚餐，別人給你敬酒，你很難拒絕，你會面對巨大的社會壓力——但是如果你很早就公開宣示你有一個絕對不喝酒的規則，人們會尊重這條規則。他們會說：「啊，對，他不只是不跟我們喝酒，他就是個不喝酒的人。」


    第三個是「創造摩擦力」：如果做這件事對你很難，你就不想做了——那麼如果你不打算做什麼事情，可以事先做些準備，讓這件事變難。


    少吃零食的最簡單辦法是別買零食。少看手機的最簡單辦法是把手機關機，放到別的房間去。更狠的做法是邀請朋友和同事監督你：誰看見你上班時間摸魚，你就得請誰吃飯。


    第四個是「設置暫停步驟」：不要讓決策過於順滑，主動按下暫停鍵。


    丹尼爾·卡尼曼 (Daniel Kahneman) 跟帕裡什說過一個他的個人規則：他從不在電話裡做決定。比如你給卡尼曼打電話，說老師我有個科研項目想跟你聊聊，明天下午
    3 點咱倆能不能見個面。卡尼曼老師會說，「我從不在電話裡做決定，等我想想再回復你」。


    官僚主義的步驟能減緩決策速度，但是也能減少出錯。這就如同醫生做手術和飛行員起飛之前都要過一遍清單一樣。


    第五個方法可能是最難做到的，叫「轉換視角」：主動從別人的視角看問題，你會收穫很多。


    領導發佈命令之前應該先想想，如果自己是下屬，會怎麼對待這個命令。跟人談判的時候應該想想，這個條件對對方意味著什麼。善於溝通的人總是先問別人的想法。


    個人的角度是有限的，你會有很多認知盲點。而盲點的意思是，事情就在眼前，可是你不知道自己不知道。


    ① Shane Parrish, Clear Thinking: Turning Ordinary Moments into Extraordinary Results
    (Portfolio, 2023).

    ① 《姚明的罰球秘訣》, `https://www.bilibili.com/video/BV1H7411h75U/`, 2024 年 2 月 23 日訪問。

