    如果一個數學家形象猥瑣，不講究衣著和飲食，表現出缺乏基本 生活能力，人們可能會因此而高估他的學術能力。請問這是一種 什麼心理學現象?


    這種心理學現象被稱為「智者不溫順效應」(Stereotype of the Absent-Minded Professor) , 其基礎是我們對於聰明人或專家的
    刻板印象，即他們過於專注於自己的專業領域，以至於忽略了日常 生活的常識和技能。這個刻板印象常常被用來描述教授、科學家、 藝術家等。


    在你的例子中，這個「猥瑣」的數學家的形象可能會使人們認為他 是一個「心無旁騖」的研究者，全神貫注於數學的研究，而忽略了 其他生活細節。這個刻板印象可能會導致人們高估他的學術能力，
    因為他們可能會認為，只有非常聰明的人才會如此全神貫注於他們 的專業領域，以至於忽略了其他方面的生活技能。


    然而，需要注意的是，這種刻板印象並不一定準確。一個人是否 精明、是否注重生活細節，不一定與他們的學術能力或智力有 關。此外，這種刻板印象可能會導致某些負面效果，例如對那些
    同時精通專業知識並且生活技能良好的人的不公正評價。


