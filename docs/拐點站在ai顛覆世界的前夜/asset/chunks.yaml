    你看民眾跟政府的關係是不是也很像人和AI的關係：民意就是`prompt`，政府操作就是生成，選舉就是選擇。


    那你怎麼能知道政府是不是在為老百姓做事呢?其實還是不用太擔心。


    政治學家的一個關鍵認知①是，老百姓對政府的各項政策本身確實比較無感————但是對政策變化很敏感。如果大家都支持一個政策，這個政策早就出臺了；如果大家都不支持這個政策，這個政策就出不了臺。這就意味著任何新政策差不多都是在這樣一個時機下出臺的————絕大多數人根本不關心，現在恰好明確支持的人比明確反對的人多了一點點。這些明確的支持者和反對者可能只佔有效選民的1%，但是他們起了大作用。這些人比較懂行，相當於理解`AGI`原理的專家和愛好者。因為別人都不在乎，所以這些人等於代表了民意。政客會小心地聽取這些人的意見————不聽不行，因為還有選舉。


    事實證明，政府做得好不好，老百姓還是知道的。研究表明，老百姓對政府的支持率並不怎麼受總統的花邊新聞之類小事情的影響，主要還是看經濟。圖3-8就是美國歷史上消費者情緒指數和民眾對政府支持率的變化情況。


    ① James A. Stimson, `Tides of Consent: How Public Opinion Shapes American Politics`
    ( Cambridge University Press, 2004) .


    ![](index-143_1.jpg)


    當經濟形勢變好或者變壞的時候，消費者情緒會率先變化。東西貴了還是便宜了，自己的錢夠不夠花，其實你心裡有數。但是這個情緒變化不會立即反映到政府支持率上。支持率的變化會比消費者情緒變化滯後一兩個季度————但是沒關係，支持率終將改變。


