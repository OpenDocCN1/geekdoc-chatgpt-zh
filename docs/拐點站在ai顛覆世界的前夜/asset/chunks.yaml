    # 第五章 實戰，讓 AI 為你所用


    ## 第二條咒語心法：儘量給出具體的情境


    第二條咒語心法是，儘量給出具體的情境。這個心法能大幅度提升 GPT 的輸出質量。


    現在很多人都會用 GPT 起草電子郵件、寫報告，甚至寫文章，給它一篇文章，它還可以生成摘要，回答關於這篇文章的問題。但是要讓 GPT 把這些事情真正做得漂亮，你最好自己先做一番功夫。


    GPT 是無數語料喂出來的，我們可以想象它是無數個作家的分身疊加而成的。如果你只是提一個一般性的要求，它就只能給你生成一個一般性的、用在哪裡都行，但是用在哪裡都不是最恰當的內容。但如果你能把要求細化，它就會生成適合你這個特殊情況的內容。


    舉個例子，假設你的公司要裁員 20%，你讓 GPT 寫個講話稿。


    如果只是簡單地說「公司要裁員 20%，請起草一份講話稿，通知這個消息」，它生成的就是一份可以用於任何公司的講話稿。


    (圖5-6)


    GPT 已經儘可能表現得真誠，但是你還是會覺得空洞———因為沒有針對性。


    但如果你把情境說得細一點，給 GPT 提供更具體的要求，它就會做得更好。比如，你說「你是一家出口公司的 CEO，現在公司必須裁員 20%。起草一份面對管理層的講話，激勵大家給公司想新出路、新辦法」，它生成的內容就不一樣了。(圖5-7)


    這份講話稿帶了很多情緒，鼓勵員工從幾個方面尋找解決問題的方法，在提振士氣。


    其實這個道理跟使用秘書是一樣的。只不過秘書一直在公司裡，你不說，他也瞭解公司的具體情況，他能猜到你想要什麼；而對 GPT，你必須把情況告訴它。


    讓 GPT 生成內容一定要給它提供「具體情境」`context`，包括以下 5 個方面：

    1. 誰在說;

    2. 說給誰;

    3. 在什麼場合之下；

    4. 使用什麼風格；

    5. 要達到什麼目的。


