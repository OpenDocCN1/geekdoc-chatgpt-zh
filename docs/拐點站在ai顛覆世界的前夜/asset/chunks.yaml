    這些事情對人來說也並不簡單，你需要有一定的文字功底，你需 要花時間仔細地閱讀原文，你需要做出判斷和取捨——但是現在 AI 做這些不但輕鬆，而且準確，最重要的是特別快。


    咱們再看一個高級用法。2023年4月，著名計算機科學家吳恩達 和OpenAI合作推出了一個《給開發者的 ChatGPT 提示語工程》課程 ①，重點講怎麼通過編程讓GPT批量處理文檔。假設你負責一家公司的
    客服業務，你們收到了大量的用戶評論。你希望用AI閱讀、判斷這些 評論，分門別類，並且有選擇地進行回覆———現在 GPT 已經可以做 得很好了。


    有一條用戶對某個電動牙刷的評論，我用ChatGPT給翻譯成了中 文：


    我的牙科衛生師推薦我使用電動牙刷，這就是我為什麼會購買這 款的原因。到目前為止， 它的電池壽命給我留下了深刻的印象。在初 次充電並在第一週內一直插著充電器以保養電池後，我已經拔掉了充
    電器，並在過去的3周裡每天使用它刷兩次牙，都是用的同一次充電。 但是， 牙刷頭太小了。我見過的嬰兒牙刷比這個還要大。我希望牙刷 頭能大一些，刷毛長度不同，
    以便更好地清理牙齒之間的空隙， 因 為這款牙刷做不到。總的來說，如果你能以50美元左右的價格買到這 款牙刷，那它就是一筆不錯的交易。廠家的替換刷頭相當昂貴，但你
    可以買到價格更合理的通用型刷頭。這款牙刷讓我感覺像每天都去看 牙醫一樣。我的牙齒感覺閃閃發光，非常乾淨！


    這個用戶囉裡囉唆說了一大堆，其實關鍵信息就那麼一點點。 對你來說，你想知道的是：第一，這條評論的情緒是正面的還是 負面的；第二，他說了產品的哪些優缺點。GPT非常善於提取這些
    信息。


    提示語先設定了電子商務網站用戶評論的場景，然後要求用最 多20個英文單詞總結這條評論。(圖5-61)


