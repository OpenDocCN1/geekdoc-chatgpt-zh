    既然如此，只要我們設置好讓模型每次都先思考一番再回答問題，它就能自動使用思維鏈，它就有了思考能力。


    有人分析，思維鏈很有可能是對模型進行編程訓練的一個副產品。②我們現在知道`GPT`是可以幫程序員編程的，但在還沒有接受過編程訓練的時候，它沒有思維鏈。也許編程訓練要求模型必須得從頭到尾跟蹤一個功能是如何實現的，得能把兩個比較遠的東西聯繫在一起——這樣的訓練讓模型自發地產生了思維鏈。


    ### 024 拐 點


    就在2023年2月27日，微軟公司發佈了一篇論文①，介紹了自己研發的一個新的語言模型，叫作「多模態大語言模型」( Multimodal Large Language
    Model, 簡稱`MLLM` ), 代號是 `KOSMOS-1`。


    什麼叫多模態呢? `GPT-3.5`是你只能給它輸入文字，它只會處理文字信息；`GPT-4`是多模態的，你可以給它輸入圖片、聲音和視頻。多模態的原理大概是先把一切媒體都轉化成語言，再用語言模型處理。多模態模型可以做「看圖片找規律」的智商測驗題。(圖
    1-8)


    前面那個《機器人總動員》劇照的例子就來自這篇論文，演示了看圖說話的思維鏈。論文裡還有這樣一個例子，在我看來相當驚人。(圖1-9)


    研究者給模型看一張既像鴨子又像兔子的圖，問它這是什麼。它回答說這是個鴨子。你說這不是鴨子，再猜是什麼?它說這像個兔子。你問它為什麼，它會告訴你，因為圖案中有兔子耳朵。


    這個思維過程豈不是跟人一模一樣?


    ① Shaohan Huang, Li Dong, Wenhui Wang, et al., Language Is Not All You Need:Aligning
    Perception with Language Models, Advances in Neural Information Processing Systems
    36(2023).


