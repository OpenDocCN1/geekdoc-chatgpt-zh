    ## 05 智能：直覺高於邏輯


    列寧說過這樣一句話：「有時候幾十年過去了什麼都沒發生; 有時候幾個星期就發生了幾十年的事。」(There are decades where nothing
    happens;and there are weeks where decades happen.)

    ChatGPT 發佈之後的幾個月，就是讓人有恍如隔世之感。我們被 AI 的突飛猛進給震驚了，我們的一些觀念發生了鉅變。現在經過一段時間的沉澱，我們可能對一些問題會想得更清楚一些。我覺得這一番
    AI 革命帶給我們三個教訓，同時我還有兩個展望。

    第一個教訓是：直覺高於邏輯。

    ![](img/index-222_1.jpg)

    我先說一個最基本的認識。到底什麼是 AI?以我之見 ：

    `AI=基於經驗+使用直覺+進行預測。`

    假設你用以往的經驗數據訓練一個模型，這個模型只關心輸入和輸出。訓練完成之後，你再給它新的輸入，它將給你提供相當不錯的輸出，你可以把這個動作視為預測。這就是
    AI。你要問模型是怎麼從這個輸入算出來那個輸出的，回答就是說不清，是直覺。

    210 拐 點

    在 2022 年發表的一項研究①中, DeepMind 的科學家做成了一件對物理學家有點降維打擊的事———用 AI 控制受控核聚變裝置中的等離子體形狀。

    下圖(圖 4-5)展示的裝置就是用來搞磁約束核聚變的，叫託卡馬克(Tokamak)。它的形狀像個麵包圈，麵包圈內部那些氣體就是要參與核聚變的等離子體。在外面一道一道圍著麵包圈的那
    些線圈一通電就會在麵包圈內部產生一個磁場，這個磁場將會約束住等離子體保持懸空狀態，讓這個氣體不要撞到牆上，也就是 麵包圈壁。

    ![](img/index-223_1.jpg)

    現在你的任務是通過控制那些線圈來調整那個磁場，從而讓等離子體生成一個理想的形狀。可是怎麼控制呢?

    ① Jonas Degrave, Federico Felici, Jonas Buchli, et al., Magnetic control of tokamak
    plasmas through deep reinforcement learning, Nature 602 (2022),pp.414-419.

    第四章 用已知推理未知 211

    從線圈的參數到等離子體的形狀之間，隔著十萬八千里複雜的計算。以前物理學家要麼直接做實驗，要麼從物理學基本原理 出發，老老實實做數值模擬———而這兩種方法都是給定線圈參
    數，求形狀是什麼。

    可是你真正想要的是一個指定的等離子體形狀，能不能告訴我線圈得設置什麼樣的參數才能生成這個形狀?但從參數到形狀的「正推」都那麼難，這個「逆推」就更是難上加難了。

    而 DeepMind 使用強化學習的方法，把逆推的問題給解決了。他們能讓 AI 非常精準地操控那些線圈，你想要什麼形狀就能 給你什麼形狀。(圖 4-6)這個成果非常漂亮，已經得到了真實實驗的證實。

