    ## 問答


    問 周樹濤


    對於「怎樣才能判斷，到底是 AI 真有意識了，還是人產生了伊麗莎效應」這句話，萬老師能展開講講嗎?圖靈測試既然已經不能很好地確定 AI 是否擁有人類智能，那目前有人在研究如何判斷
    AI 有沒有自我意識嗎?


    萬維鋼


    怎樣才能判斷 AI 算不算是有了人的意識，是個非常有意思的問題，也是現在沒有答案的問題。其實，到底什麼是「意識」，人的意識到底是真的還是幻覺，現在都沒有共識性的說法。


