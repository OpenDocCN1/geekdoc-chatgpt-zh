    # 第三章 置身智能，你更像你


    但是，无论 GPT 将来再怎么厉害，我认为人类解读还是需要的。因为人类解读提供的不仅仅是个内容简介，它带有解读人主观的视角。这本书就摆在这里，它到底哪个内容重要、哪个内容不重要，它的观点对在哪儿、错在哪儿，每个人都有自己的看法。你听解读往往不只是想听个内容简介，你还想知道解读人个人的东西。这种主观的东西可以好，也可以坏，但是它能有多坏就能有多好，它有巨大的发挥空间。


