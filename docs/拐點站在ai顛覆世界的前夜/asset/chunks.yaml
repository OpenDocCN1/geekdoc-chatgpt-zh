    ### 问答


    下 菜菜


    當未來AI替代我們做出最佳決定的時候，我們的生活會更有秩序、更有確定性。但永遠不犯錯誤的生活，是不是也少了一些刺激和樂趣呢?畢竟錯誤有時候帶給我們的是糟糕的結果，有時候帶來的卻是意想不到的驚喜。當我們不再有這些驚喜的時候，人類的無厘頭想法、錯誤、娛樂、幽默……是不是該在虛擬世界中釋放了呢?元宇宙是不是也會蓬勃發展?


    萬維鋼


    你說的很對，生活需要錯誤和驚喜。但是AI並沒有取消我們的錯誤和驚喜。首先，AI輸出中有隨機變量，你可以讓它專門出一些不靠譜但是很有意思的主意。再者，更重要的是，AI只是提供建議，決定權還是掌握在人的手裡。


    簡單說就是，AI可以精確地告訴你明天下不下雨——至於帶不帶傘，還是你自己判斷。我覺得這有可能成為將來AI的一種行為規範。


    人總可以不聽AI的建議堅持特立獨行，就如同《我，機器人》電影中主人公關閉汽車的自動駕駛，自己駕駛汽車連續超車一樣。


    不過，保險公司對此會有話說。不聽AI建議，可能會導致保費升高。但是，很多人會認為那是值得的。而且，AI還能算出保費應該為此升高多少。這並不是懲罰，只是為了讓系統更公平合理———畢竟不應該讓老實開車的人為你的任性買單。


    第二章 當AI進入人類社會 065


    所以，人仍然是自由的，只是人會更經常感覺到自己每個選擇背後的責任和代價。


