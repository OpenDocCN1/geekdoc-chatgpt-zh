    你就是能感覺到，而且是快速感覺。這是跟形式邏輯截然不同的 計算路線，以至於我們平時都不會把它稱為計算。


    神經計算和形式邏輯之間有個交集，這是因為人腦也會算些


    簡單的數學題，但算數學題不是我們最擅長的。我們更擅長的是 用神經網絡直接感知一個複雜的東西。


    比如，當你看見一隻貓的時候，你知道那是一隻貓——這個


