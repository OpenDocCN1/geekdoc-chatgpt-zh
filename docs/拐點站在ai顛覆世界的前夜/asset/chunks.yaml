    ## 06 力量：算力就是王道


    這一節我會繼續談這一波 AI 大潮帶給我們的教訓和展望。人类自从进入文明社会，有了书本，有了读书人，我们的价值观就一直崇尚智力而不是暴力———你有再强力量都不如我有知识。现在是时候重新审视这个认知了。

    人的肌肉力量非常有限，你就是一天吃 5 顿饭又能多长几斤肌肉?工程机械的力量可以很大很大，但是能做的事情很有限，毕竟文明需要的更多是精细而不是大力，没有谁以「我们国家有世界最大的起重机」为荣，更何况起重机的力量也有上限。对比之下，知识似乎是无穷的，你可以无上限地使用，所以崇尚知识很有道理。

    但是现在有一种力量是无上限的，它的增长速度远远超过了任何领域中知识积累的速度。这个力量就是计算机算力。

    这跟审美、道德都没关系，纯粹是力量的对比。在这个局面下，你指望知识，就不如指望算力。

    我要讲的第二个教训是，算力就是王道。

    DeepMind 有一位计算机科学家叫理查德·萨顿( Richard Sutton)，他是「强化学习」这个 AI 算法的奠基人之一。

    早在 2019 年，萨顿就在他的个人网站上贴出一篇文章，叫《苦涩的教训》(The Bitter Lesson)①。他认为, 过去 70 年的 AI 研究给我们最大的教训是，撬动算力才是最有效的方法。

    我们先看几段历史。

    1997 年, AI 下国际象棋打败了卡斯帕罗夫(Kasparov)。当时大多数研究用计算机下国际象棋的科研人员对此不是感到兴奋，而是感到失望。他们原本的想法是，把人类的国际象棋知识教给
    AI，让 AI 像人类棋手一样思考————可是没想到，一个只会大规模深度搜索、纯粹依靠计算机的蛮力的程序居然最终胜出了。

    这不是不讲理吗?从此一直都有人说，对国际象棋可以这么干，但是对围棋就不行了，因为围棋过于复杂。

    20 年后，AlphaGo 下围棋击败人类世界冠军，用的还是暴力破解。那个 AI 不仅不懂而且根本没学过什么围棋知识，可它还反过来为人类创造了一些新的围棋知识。

    在语音识别领域，20 世纪 70 年代的主流方法是把人类的语音知识————什么单词、音素、声道————教给计算机，结果最终胜出的却是根本不管那些知识，纯粹用统计方法自行发现规律的模型。

    在计算机视觉领域，科学家一开始也发明了一些知识，比如去哪里找图形的边缘、「广义圆柱体」，等等，结果那些知识啥用没有，最终解决问题的是深度学习神经网络。

    现在 GPT 语言模型更是如此。以前的研究者搞的那些知识——什么句法分析、语义分析、自然语言处理——全都沒用上，GPT 直接把海量的语料学一遍就什么都会了。

    在无穷的算力面前，人类的知识只不过是一些小聪明。

    萨顿总结了一个历史规律，分 4 步：

    1.人类研究者总想构建一些知识教给 AI；

    2.这些知识在短期内总是有用的；

    3.但是从长远看，这些人类构建的知识有个明显的天花板，会限制发展；

    4.让 AI 自行搜索和学习暴力破解方法，最终带来了突破性进展。

    算力才是王道，知识只是干扰。

    AI 的暴力破解是怎么做到的呢?前文介绍过三种最流行的神经网络算法：监督学习、无监督学习和强化学习。现在我们再把这三种「学习」方法重新审视一遍。

    监督学习是最基本的神经网络算法，它需要先把训练素材打上标签，让 AI 知道什么是对的。它的作用是「判断」，它追求的是「是不是」。

    让 AI 从一大堆分子式中判断出哪个有可能是一种新型抗生素，就是监督学习。你需要事先知道抗生素大概是什么样的，为此你需要喂给 AI 一些现成的例子用于训练。

    但是如果数据量非常大，一个一个提前标记训练素材是人力难以承受的，为此有个办法叫「自监督学习」———让 AI 自己去对照答案。比如 GPT 语言模型的训练过程中有一部分就属于自监督学习。最简单的思路是这样的：拿过来一篇文章，先把上半部分喂给模型，让模型根据上半部分预测文章的下半部分，再把真实的下半部分给它看，让它从反馈中学习。

    可以说自监督学习方法进一步解放了 AI 的生产力。2023 年 8 月，众多研究者在《自然》(Nature) 杂志上联合发表了一篇综述文章①，列举了当前 AI
    在科学发现上的一系列应用，其中自监督学习起到了很大的作用。

    图 4-10 展示了 AI 参与新药研发的过程。

    研究者先用自监督学习训练一个基本的 AI 模型，过程大概是这样的。他们手里有一大堆药物分子结构和实验结果数据，但是没有标记哪个实验结果是他们想要的药物。这时只需要把那些分子结构一个个输入
    AI 模型，让 AI 自己预测这些结构的实验结果，再跟真实实验的结果比较，让 AI 对药物结构和实验结果之间的关系...

