    ## 03 战略：AI商业的竞争趋势


    `ChatGPT` 出現僅幾個月，就誕生了成百，也許上千個 AI應用，可以說是群雄並起。


    我在 X 上追蹤各路消息，感覺現在簡直是人人都能自己搞個 AI應用：從網站到手機App、瀏覽器插件，甚至開源軟件⋯ ⋯哪怕你以前不熟悉編程開發都沒關係，因為可以讓`ChatGPT`
    替你做編程。


    在大公司層面, `OpenAI`之外, Google、微軟、`Meta`都有自己的模型。埃隆·馬斯克(Elon Musk) 本來是`OpenAI`的投資者之一，後來因為理念不合退出了，也在找人做自己的模型。`OpenAI`以外，在性能上最先達到
    `GPT-3.5`水平的模型可能是`Claude`, 是由一個叫 `Anthropic` 的小創業公司開發的——這家公司是`OpenAI` 之前的僱員獨立出來成立的。


    中國這邊也是風起雲湧，阿里、騰訊等幾家大公司也在訓練自己的模型，再加上各路小公司，號稱是「百模大戰」……


    這絕對是20世紀90年代以來，互聯網創業最熱鬧的時刻。如果有志於做一番大事，別錯過這一波機遇。


    你可能會有疑問: Google那麼強, 為什麼這次推出 `ChatGPT`的不是Google? 在 `OpenAI`已經如此厲害的情況下，中國公司還有多大機會?


    第二章 當AI進入人類社會 077


    AI確實是前所未有的變革，但是商業的邏輯並沒有變。


    如果你熟悉商業邏輯，就能想明白為什麼Google沒有率先推出`ChatGPT`。這是一次典型的顛覆式創新。


    大語言模型最關鍵的一個技術是 `Transformer` 架構，`Transformer`就是Google 發明的。Google有很深的技術積累, 自家就有不止一個語言模型。可是一直等到微軟把搜索和GPT模型結合,
    推出了 `Bing Chat`之後, Google才坐不住了, 在2023年 2 月 7 日推出了一個叫 `Bard`的競品。結果測試表現不好，導致股價大跌。


    Google 為什麼起了個大早，卻趕了個晚集呢?這其實就是克萊頓·克里斯坦森(Clayton M. Christensen ) 在《創新者的窘境》(`The
    Innovator''s Dilemma`) 裡講的一個非常典型的情況。


    我曾經跟谷歌大腦的一個工程師聊他們為什麼被 `OpenAI` 搶先，他認為Google的問題是犯了大企業病，本來就人多，又加上收購 `DeepMind` (被
    Google收購的人工智能公司), 公司扯皮的事兒太多，效率低。但是我敢說，Google之所以從一開始就沒有好好做對話式搜索這個項目，是因為對話式搜索不符合Google的利益。


    傳統搜索很容易在搜索結果中插入廣告，那些廣告收入是Google的命脈所在。對話式搜索消耗的算力是傳統搜索的10倍———這可以接受，可是廣告怎麼辦?你很難在聊天中插入廣告。Google顯然不想自己顛覆自己，它不會主動搞這種新模式；


