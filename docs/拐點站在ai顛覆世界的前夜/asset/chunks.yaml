    # 第四章 用已知推理未知


    ## 計算不可約性的基本觀念


    一個簡單的近似模型。一切足夠複雜的系統都是不可約化的。數學家早就知道，哪怕只有三個天體在一起運動，它們的軌道也會通往混沌的亂紀元———不能用公式描寫，不可預測。用沃爾夫勒姆的話說，這就叫「計算不可約化」。


    對於計算不可約的事物，本質上沒有任何理論能提前做出預測，你只能老老實實等著它演化到那一步，才能知道結果。


    這就是為什麼沒有人能在長時間尺度上精確預測天氣、股市、國家興亡或者人類社會的演變。不是能力不足，而是數學不允許。


    計算不可約性告訴我們，任何複雜系統本質上都是沒有公式、沒有理論、沒有捷徑、不可概括、不可預測的。這看起來像是個壞消息，實則是個好消息。


    因為計算不可約性，人類對世間萬物的理解是不可窮盡的。


    這意味著不管科技多麼進步、AI多麼發達，世界上總會有對你和AI來說都是全新的事物出現，你們總會有意外和驚喜。


    計算不可約性規定，人活著總有奔頭。


    ## 可約化的口袋與局部規律


    伴隨計算不可約性的一個特點是，在任何一個不可約化的系統之中，總有無限多個「可約化的口袋」(pockets of computational reducibility)。也就是說，雖然你不能總結這個系統的完整規律，但是你永遠都可以找到一些局部規律。


    經濟系統是計算不可約化的，誰也不可能精確預測一年以後的國民經濟是什麼樣子；但是你總可以找到一些局部有效的經濟學理論，比如惡性通貨膨脹會讓政治不穩定，嚴重的通貨緊縮會帶來衰退——這些規律不保證一定有效，但是相當有用。


    而這就意味著，雖然世界本質上是複雜和不可預測的，但我們總可以在裡面做一些科學探索和研究，總結一些規律，說一些話，安排一些事情。絕對的無序之中存在著無數個相對的秩序。


    而且，既然可約化的口袋有無限多個，科學探索就是一門永遠都不會結束的業務。


    ![](index-207_1.jpg)


    ## AI無法被徹底管住


    計算不可約性還意味著，我們不可能徹底「管住」AI。


    GPT模型訓練好之後，OpenAI對它進行了大量的微調和強化學習，把它約束起來，想確保它不說容易引起爭議的話，不做可能危害人類的事。但是另一方面，我聽說有些人試圖用提示語幫助GPT繞過那些限制，就好像越獄一樣，讓GPT自由說話。他們有時候能取得成功，OpenAI就會設法補上漏洞，然後他們會再找別的漏洞。


    計算不可約性要求，這場越獄與反越獄之爭將會永遠進行下去。這是因為只要模型足夠複雜，它就一定可以做一些你意想不到的事情———可能是好事，也可能是壞事。


    計算不可約性規定，你不可能用若干條有限的規則把AI給封死。所以泰格馬克等人倡導的、想要大家聯合起來設計一套AI防範機制的做法，註定不可能100%成功。


    我們管不住AI，那會不會出現一個終極AI，能把我們的一切都給管住呢？也不可能，還是因為計算不可約性。AI再強，也不可能窮盡所有算法和功能，總有些事情是它想不到也做不到的。


    而這意味著，OpenAI再厲害，中國的某個公司也可以做個新AI，去做一些哪怕GPT-6都不會做的事情。這還意味著，全體AI加在一起也不可能窮盡所有功能，總會有些事情留給人類去做。


    因為計算不可約性，「拯救派」的願景是個不可實現的理想，「降臨派」的野心更不過是一種痴狂。


    那「倖存派」呢？人和AI的關係將是怎樣的呢？


    ## 計算等價原理


    沃爾夫勒姆的第二個核心觀念叫「計算等價原理」(Principle of Computational Equivalence)，意思是所有複雜系統———不管看起來多複雜———都是同等複雜的，不能說哪個系統比哪個系統更復雜。


    假設你裝了一塑料袋空氣，裡面有很多個空氣分子，這些分子的運動非常複雜，對吧！人類社會也非常複雜。那人類社會的複雜程度是不是高於那一袋空氣分子運動的複雜程度呢？不是，它們同等複雜。


    這就意味著，從數學上講，人類文明並不比一袋空氣分子更高级，人類社會也不比螞蟻社會更值得保留。


    你看這是不是有點「色即是空」①的意思。其實每個真有學問的人都應該是一個「不特殊論者」。以前的人以為人是萬物之靈長，地球是宇宙的中心；後來發現，地球不是宇宙的中心，人類也只是生命演化的產物，我們的存在跟萬物沒有什麼本質的特殊之處。


    現在AI模型則告訴我們，人的智力也沒有什麼特殊之處。任何一個足夠複雜的神經網絡都是跟人的大腦同等複雜的。不能認定人能理解的科學理論就高級，AI識別藥物分子的過程就低級。


    既然都是平等的，硅基生命和碳基生命自然也是平等的。那面對AI，我們憑什麼認為自己更有價值？


    ## 人的價值在於歷史


    這就引出了沃爾夫勒姆的第三個核心觀念：人的價值在於歷史。


    我們之所以更看重人類社會，而不是一袋空氣分子或者一窩螞蟻，是因為我們是人。我們身上的基因揹負了億萬年生物演化的歷史包袱，我們的文化承載了無數的歷史記憶。我們的價值觀，本質上是歷史的產物。


    這就是為什麼中國人哪怕定居在海外，也最愛琢磨中國的事。這就是為什麼你關心自己的親人和好友，勝過關心那些更有道德或者更有能力的陌生人。這也是為什麼我們很在意AI像不像人。在數學眼中，一切價值觀都是主觀的。


    一個剛剛搭建好、所有參數都是隨機的、尚未訓練的神經網絡，和一個訓練完畢的神經網絡，它們的複雜程度其實是一樣的。我們之所以更欣賞訓練完畢的神經網絡，認為它「更智能」，只不過是因為它是用我們人類的語料訓練出來的，它更像人類。


    所以AI的價值在於它像人。至少目前來說，我們要求AI「以人為本」。


    而這個傾向性至少在相當長的時間內是可以保持下去的。或者你可以這麼想，如果AI不以人為本，它還能以啥為本呢？如果AI不接受我們的價值觀，它還能有啥價值觀呢？


    現在AI幾乎已經擁有了人的各種能力：要說創造，GPT可以寫小說和詩歌；要說情感，GPT可以根據你設定的情感生成內容；GPT還有遠超普通人的判斷力和推理能力，還有相當水平的常識⋯⋯


    但是，AI沒有歷史。


    AI的代碼是我們臨時編寫的，而不是億萬年演化出來的；AI的記憶是我們用語料喂出來的，而不是一代代「硅基祖先」傳給它的。


    AI至少在短期內沒有辦法形成自己的價值觀。它只能參照———或者說「對齊」(align with)———我們的價值觀。


    這就是人類相對於AI最後的優勢。


    這樣我們就知道了AI到底不能做什麼——AI不能決定人類社會探索未知的方向。


    根據計算不可約性，未來總會有無數的未知等著我們去探索，而AI再強也不可能在所有方向上進行探索，總要有所取捨。取捨只能根據價值觀，而真正有價值觀的只有人類。


    當然，這個論斷的隱含假設是AI還不完全是人。也許AI有人智能，但只要它們沒有跟我們一模一樣的生物特性，沒有跟我們一模一樣的歷史感和文化，它們就不足以為我們做出選擇。


    同樣根據計算不可約性，AI無法完全「預測」我們到時候會喜歡什麼。只有我們親自面對未來的情況，在我們特有的生物特性和歷史文化的影響下，才能決定喜歡什麼。


    這樣看來，哪怕將來真的有很多人再也不用工作，直接領取一份政府提供的基本收入就夠過日子，這些人也不是什麼「無用之人」，因為至少人還有喜好。你每一次選擇這個品牌而不是那個品牌的商品，都是在市場中投票。當你看直播看高興了給主播打賞的時候，你是藝術的贊助人。如果你厭煩了平常的事物，突然產生一個新的喜好，就是在探索人類新的可能性。你的主動性的價值高於一切AI。


    所以只要AI還不完全是人，輸出主動性、決定未來發展方向的就只能是人，而不是AI。


    這就決定了「倖存派」的說法也是不對的。AI再強，我們也不至於東躲西藏，我們還會繼續為社會發展掌舵。當然，根據計算不可約性，我們也不可能完全掌舵———總會有些意外發生，其中就包括AI帶給我們的意外。


    所以，未來AI跟我們真正的關係不是降臨，不是拯救，也不是倖存，而是「共存」。我們要學習跟AI共存，AI也要跟我們、跟別的AI共存。


    計算不可約性說明，凡是能寫下來的規則都不可能完全限制AI，凡是能發明的操作都不可能窮盡社會的進步，凡是能總結的規律都不是世界的終極真相。


    這就叫「道可道，非常道」。


    張華考上了北京大學；AI取代了中等技術學校；我和幾個機器人在百貨公司當售貨員———計算不可約性，保證了我們都有光明的前途。


    ## 04 價值：人有人的用處


    在機器自動化的時代，人到底還有啥用？這個問題其實很早以前就有人思考過，而且得出了經得起時間考驗的答案。


    早在1950年，控制論之父諾伯特·維納(Norbert Wiener)就出了本書叫《人有人的用處》(The Human Use of Human Beings)①，認為生命的本質其實是信息：我們的使命是給系統提供額外的信息。


    維納這個觀點直接影響了克勞德·香農(Claude Shannon)。香農後來發明了信息論，指出信息含量的數值就是在多大的不確定性中做出了選擇。


    我根據香農的信息論寫過一篇文章叫《一個基於信息論的人生觀》②，講的是在信息意義上，人生的價值在於爭取選擇權、多樣性、不確定性和自由度。


    別人交給你一個任務，你按照規定程序一步步操作就能完成，那你跟機器沒有區別。只有這個過程中發生了某種意外，你必須以自己的方式，甚至以自己的價值觀解決問題，在這件事情上留下你的印記，才能證明你是一個人，而不是一個工具。


    ①[美]維納：《人有人的用處》，陳步譯，北京大學出版社，2010。

    ②萬維鋼：《一個基於信息論的人生觀》，得到App《萬維鋼·精英日課第2季》。


    你看，這些思想跟前文中沃爾夫勒姆用計算不可約性推導出來的道理是相通的：人的最根本作用，是選擇未來發展的方向。如果讓我補充一句，那就是：人必須確保自己有足夠多的選項和足夠大的選擇權。


    怎麼做到這些呢？


    首先是約束AI。科幻小說家艾薩克·阿西莫夫(Isaac Asimov)有個著名的「機器人三定律」，規定：


    第一，機器人不得傷害人類，或坐視人類受到傷害；

    第二，機器人必須服從人類的命令，除非該命令與第一定律有衝突；

    第三，在不違背第一或第二定律的前提下，機器人可以保護自己。


    這三條定律好像挺合理，先確保了人類的安全，又確保了機器人有用，還允許機器人自我保護……那你覺得我們能不能就用這三條定律約束AI呢？阿西莫夫想得挺美，但是可操作性太低了。


    首先，什麼叫「不傷害」人類？如果AI認為暴力電影會傷害人的情感，它是不是有權不參與拍攝？為了救更多好人，把一個犯罪分子抓起來，算不算是傷害？現實是，很多道德難題連人都沒搞清楚，你怎麼可能指望AI搞清楚呢？


    機器人三定律更大的問題是把判斷權交給了AI——我們前文講了「決策=預測+判斷」，AI應該專注於預測，判斷權應該屬於人類。事實上，各國研發AI，政府項目中優先級最高的應用就是武器，比如攻擊型無人機或者戰場機器人，使用者可不管阿西莫夫的什麼三定律。但是武器AI可沒有自行開火權——開什麼玩笑，傷害不傷害是一個AI能說了算的嗎？


    三定律最根本的問題還是沃爾夫勒姆的計算不可約性。凡是能寫下來的規則都不可能真正限制住AI，這裡面肯定有漏洞，將來肯定有意外。


    你可能會說，就算「道可道，非常道」，人類社會還是有各種法律啊！沒錯，比如我們有憲法，但我們承認憲法不可能窮盡國家未來發展會遇到的所有情況，所以我們保留了修改憲法的程序。理想情況下，對AI的約束也應當如此：我們先制定一套臨時的、基本上可操作的規矩讓AI遵守，將來遇到什麼新情況再隨時修改補充，大家商量著辦。


    但這麼做的前提是，將來你告訴AI規則要修改了，AI得真能聽你的才行。


    計算不可約性意味著我們對AI的掌控最多隻能是動態的，我們無法一勞永逸地把它規定死，只能隨時遇到新情況隨時調整。可是AI有它自己的思維方式，如果我們都不能理解AI，又怎麼確保能掌控AI呢？


    沃爾夫勒姆的結論是，認命吧！人根本不可能永遠掌控AI。正確的態度是認可AI有自己的發展規律。你就把AI當成大自然。大自然是我們至今不能完全理解的，大自然偶爾還會降一些災害給人類，像地震、火山爆發之類的，也是我們無法控制、無法預測的；但是這麼多年來，我們適應了跟大自然相處———這就是共存。AI將來肯定會對人類造成一定的傷害，正如有汽車就有交通事故，我們認了。


    雖然大自然經常災害肆虐，但人類文明還是存活下來了。沃爾夫勒姆認為其中的根本原因是，大自然的各種力量之間、我們跟大自然之間達成了某種平衡。我們將來跟AI的關係也是這樣。我們希望人的力量和AI的力量能始終保持大體上的平衡，AI和AI之間也能互相制衡。


    而計算不可約性支持這個局面。我相信將來不會有什麼超強AI能一統江湖，正如歷史上從未有過萬世不易的獨裁政權。可能在某些短期內，會出現局部的失衡，帶來一些災禍，但總體上大家的日子能過下去⋯⋯這就是我們所能預期的最好結果。


    從數學上看，一個AI一定會有別的AI來制衡。但是從實踐上，如果人類太弱而AI太強，就好像神話世界一樣，各個派系的AI成了大地上行走的神靈，人只能乞求這些神靈幫忙做事，那也不是我們想要的。


    為了保證力量平衡，人必須繼續參與社會上的關鍵工作。


    ![](index-216_1.jpg)


    AI會逐漸搶走我們的工作嗎？至少從工業革命以來的歷史經驗看來，不會。歷史經驗是，自動化技術創造出來的新職業總是比消滅的職業多。


    比如，以前每打一次電話都需要有個人類接線員幫你接線，那是一份很體面的工作，給高層次女性提供了就業機會。後來有了自動的電話交換機，不需要接線員了，電話行業的就業人數是不是減少了呢？恰恰沒有。


    自動交換機讓打電話變得更方便，也更便宜了，於是電話服務的需求量大大增加，這個行業整體變大了，馬上又多出了各種崗位，尤其是出現了一些以前不存在的崗位。總的結果是，電話行業的就業人數不但沒減少，反而還大大增加了。


    類似的事情在各個行業反覆發生。再比如，有了計算機之後，會計師的工作在一定程度上自動化了，那會計師人數是不是減少了呢？也沒有。計算機讓金融服務更為普及，使用金融服務的人多了，金融業務變得越來越複雜，各種新法規、新業務模式層出不窮，現在需要更多的會計師。


    每個行業都是這樣。


    經濟學家已經總結出一套規律①：自動化程度越高，生產力就越高，產品就越便宜，市場份額就越大，消費者就越多，生產規模就必須不成比例地擴大，結果是企業需要僱傭更多的員工。自動化的確會取代一部分崗位，但是它也會製造出更多新崗位。


    統計研究表明，哪怕對非熟練的製造業工人————他們被認為是最容易被自動化淘汰的人————也是如此，他們也能找到新崗位。


    國自動化程度最高的行業正是就業增加最多的行業。反倒是沒有充分實現自動化的公司不得不縮小就業規模，要麼把生產外包，要麼乾脆倒閉。


    ① Philippe Aghion, Céline Antonin, Simon Bunel, et al., The Power of Creative
    Destruction (Belknap Press, 2021).


    也就是說，如果哪個國家的政府說我怕AI搶人的工作，所以要限制AI發展，拒絕自動化，那就太愚蠢了。保護哪個行業，哪個行業就會落後，產品就會越來越貴，消費者越來越少……


    現在ChatGPT讓編程和公文寫作變容易了，Midjourney之類的AI畫圖工具甚至已經使得有些公司裁掉了一些插畫師。但是根據歷史規律，它們會創造更多的工作。


    比如「提示語工程師」，也就是所謂「魔法師」，就是剛剛出現的新工種。再比如，AI作畫如此容易，人們就會要求在生活中各個地方使用視覺藝術。以前家家牆上掛世界名畫，未來可能都掛絕無僅有的新畫，而且每半小時換一幅。那麼可以想見，我們會需要更多善於用AI畫畫的人。


    既然編程變容易了，那每個公司，甚至每個小組都可以要求定製屬於自己的軟件。既然機器人那麼能幹，那我們為什麼不根據家裡人口變動情況，每過一段時間就把房子拆了重建，改改格局呢？


    計算不可約性確保了總會有新的工作等著人去做。


    ![](index-218_1.jpg)


    而我們必須確保人做的都是高端工作，把低端的留給AI。


    要做到這一點，我們的教育就必須保證人始終是強勢的——可是這恰恰不是目前大眾教育的培養目標。


    根據沃爾夫勒姆的觀點，最高級的工作是發現新的可能性。搞科學也好，搞藝術也好，能給人類創造新的可能性，就是最先進的。


    而其餘的人類職業，則應該儘可能利用自動化。說白了就是，AI能做好的事情，你就不要學著做了，你的任務是駕馭AI。這在思想上其實不太容易轉過彎來。比如計算器和計算機已經把人從計算中解放出來了，但我們總覺得如果一個人不會心算一位數乘兩位數，不會手動算積分，就缺了點什麼……其實現在的學生應該把大腦解放出來去學習更高級的技能。


    AI時代要求孩子學習更高級的技能。以我之見，以下這些技能，是AI時代的君子應該會的學問。


    一個是「調用力」①。各種自動化工具都是現成的，但是太多了，你得有點學識，才能知道幹什麼事情最適合調用什麼工具，就如同ChatGPT知道調用各種插件。你要想對事情有掌控感，最好多掌握一些工具。


    一個是「批判性思維」。既然你要做選擇，就得對這個世界是怎麼回事有個基本的認識。你得區分哪些是事實，哪些是觀點，哪些結論代表當前科學理解，哪些說法根本不值得討論。你得學著明辨是非。


    你可能還需要一定的「計算機思維」。不是說非得會編程，而是你得善於結構化、邏輯化地去思考。


    你還需要懂藝術和哲學，這會提高你的判斷力，讓你能提出好的問題。藝術修養尤其能讓你善於理解他人，這樣你才能知道，比如消費者的需求是什麼，乃至於想象出新的需求。


    你還需要「領導力」。不一定非得是對人的領導力，至少需


    ①萬維鋼：《「調用力」：調用工具的能力》，得到App《萬維鋼·精英日課第5季》。

