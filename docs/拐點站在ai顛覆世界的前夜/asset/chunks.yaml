    ChatGPT 正在演變成我們的AI助理，它對我們的解放是雙重的。


    首先，它去除了做事的障礙。其實很多人說「不會做」什麼事，並不是真不會，只是有個界面障礙。


    比如，讓你去瑞典生活，你可能說自己不知道怎麼在瑞典生活，因為你完全不懂瑞典語，甚至不懂英語——但作為一個成年人，你本來可以在任何一個地方生活乃至工作，你需要的只是打破語言這個界面。


    再比如，一位老奶奶想給孫子買個禮物，那個東西只在網上有賣，她說自己不會買———她明明懂得什麼是好東西，懂得貨比三家，怎麼能說不會買東西呢?她只是不會上網、不懂電子支付而已。


    世間有多少所謂的「不會」，其實是界面問題?


    AI助理讓所有界面迴歸到自然語言。你只要懂得事情的本質，然後會說話就行。它負責把你的意思翻譯成各個應用能理解的語言，你無須看見那些應用，你甚至無須知道那些應用都是什麼……AI助理把我們從界面背後解放了出來。


    而對平時沒有界面問題的人來說，更大的一個解放是提升效率。很多事你知道怎麼做，但是你一想到做起來很麻煩就不想做了。買東西得去超市，畫個圖還要編程，寫文章需要做調研⋯
