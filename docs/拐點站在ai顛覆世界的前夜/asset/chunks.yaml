    這就是為什麼很多人呼籲，我們不應該把什麼任務都交給`AI`，不能讓`AI`自動管理社會。這些人建議，任何情況下，真正的決策權都應該掌握在人的手裡。為了確保民主制度，投票和選舉都必須由人來執行，人的言論自由不能被`AI`取代或者歪曲。


    這也是為什麼`OpenAI`在聲明中說：「我們希望就三個關鍵問題進行全球對話：如何管理這些系統，如何公平分配它們產生的利益，以及如何公平分享使用權。」


    我們正處於歷史的大轉折點上，這絕對是啟蒙運動級別的思想和社會轉折，工業革命級別的生產和生活轉折———只是這一次轉折的速度會非常非常快。


    回頭看，轉折帶來的不一定都是好事。啟蒙運動導致過打著理性旗號的、最血腥的革命和戰爭；工業革命把農業人口大規模地變成城市人口，而那個時代的工人並不是很幸福。轉折引發過各種動亂，但是最後社會還是接受了那些變化。`AI`又會引發什麼樣的動亂?將來社會又會有什麼樣的變化?我們會怎樣接受?


    前面講的基辛格等人有個觀點很好，現在的關鍵問題，即「元問題」，是我們缺少`AI`時代的哲學。我們需要自己的笛卡爾 (`Descarts`) 和康德來解釋這一切。


    我們將在下一章看到一些答案。


    ## 問答


    ### 用戶73119051


    既然`AGI`像人的大腦一樣學習，是否可以讓`AGI`反過來訓練人的大腦呢?一個小孩從小是在人的知識環境中學習的，長大後認知也難以理解理性範圍外的東西。那人如果在`AGI`的環境中長大，會不會也能擁有超級大腦?人的大腦有極限嗎?


    ### 萬維鋼


    大腦的存儲能力是海量的，遠遠談不上觸及極限。大腦這個設備的主要瓶頸在於輸入輸出和邏輯運算的速度都太慢了。計算機用不了1秒鐘就能讀一本書，人腦再怎麼努力也不可能做到。但是我們有兩個安慰，我認為人不用太糾結於自己大腦不夠用。


    一個是，雖然知識是無限的，但觀念是有限的。只要一個人對世界大概是怎麼回事兒、自己專業領域大概的邏輯是什麼有一定的掌控感，他就可以很好地做事了。


    另一個是，`AI`是我們的朋友，可以說是第二大腦。如果你隨時都能找到正確答案，又何必非得把答案帶在身上呢?


    `AGI`反向訓練人的大腦是個好主意，事實上我們已經在使用新技術訓練大腦了。今天的人能接觸到的知識、能參與的訓練，是過去根本無法想象的，應該好好利用這些條件。


