    ![](index-35_1.jpg)


    (`Emergence`)。湧現的意思是，當一個複雜系統複雜到一定程度，就會發生超越系統元素簡單疊加的、自組織的現象。比如單個螞蟻很笨，可是蟻群非常聰明；每個消費者都是自由的，可是整個市場好像是有序的；每個神經元都是簡單的，可是大腦產生了意識⋯⋯


    萬幸的是，大語言模型也會湧現出各種意想不到的能力。2022年8月，谷歌大腦研究者發佈了一篇論文①，專門講了大型語言模型的一些湧現能力，包括小樣本學習，突然學會做加減法，突然之間能做大規模、多任務的語言理解，學會分類……而這些能力只有當模型參數超過1000億才會出現。(圖1-6)


    ![](index-36_1.jpg)


    我再強調一遍：研究者並沒有刻意給模型植入這些能力，這些能力是模型自己摸索出來的。


    就如同孩子長大往往會出乎家長的預料。


    ![](index-36_2.jpg)


    當然你得先把模型設計好才行。`Transformer`架構非常關鍵，它允許模型發現詞與詞之間的關係———不管是什麼關係，而且不怕距離遠。但是，當初發明`Transformer`的研究者可沒想到它能帶來這麼多新能力。


    ### 022 拐 點


    事後分析，湧現新能力的關鍵機制叫作「思維鏈」①(`Chain-of-Thought`)。


    簡單說，思維鏈就是當模型聽到一個東西之後，它會嘟嘟囔囔自說自話地，把自己知道的有關這個東西的各種事情一個個說出來。


    比如，你讓模型描寫一下「夏天」，它會說：「夏天是個陽光明媚的季節，人們可以去海灘游泳，可以在戶外野餐……」


    思維鏈是如何讓語言模型有了思考能力的呢?以前面提過的棒球棒問題為例，也許是這樣的。模型一聽說棒球棒，它就自己跟自己敘述了棒球棒的各個方面，其中就包括大小；那既然問題中包括「放進耳朵」，大小就是一個值得標記出來的性質；然後對耳朵也是如此⋯⋯它把兩者大小的性質拿出來對比，發現是相反的，於是判斷放不進去。


    只要思考過程可以用語言描寫，語言模型就有這個思考能力。


    再看一個實驗。(圖1-7)


    給模型看一張圖片————皮克斯電影《機器人總動員》的一張劇照，問它是哪個製片廠創造了圖中的角色。如果沒有思維鏈，模型會給出錯誤的回答。


    怎麼用思維鏈呢?可以先要求模型把圖片詳細描述一番，它說：「圖中有個機器人手裡拿了一個魔方，這張照片是從《機器人總動員》裡面來的，那個電影是皮克斯製作的⋯⋯」這時候你簡單重複它剛說的內容，再問它那個角色是哪個製片廠創造的，它就答對了。


    ① Jason Wei, Yi Tay, Rishi Bommasani, et al., Emergent Abilities of Large Language
    Models, Transactions on Machine Learning Research (2022).


