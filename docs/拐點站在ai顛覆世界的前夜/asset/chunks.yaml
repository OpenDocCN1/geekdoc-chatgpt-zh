    (圖5-6)


    GPT已經儘可能表現得真誠，但是你還是會覺得空洞———


    因為沒有針對性。


    但如果你把情境說得細一點，給GPT 提供更具體的要求，它


    就會做得更好。比如，你說「你是一家出口公司的CEO，現在公


    司必須裁員20%。起草一份面對管理層的講話，激勵大家給公司


    想新出路、新辦法」，它生成的內容就不一樣了。(圖5-7)


    這份講話稿帶了很多情緒，鼓勵員工從幾個方面尋找解決問


    題的方法，在提振士氣。


