    候，你都是根據說不清道不明的感覺做一個差不多的動作，這都 是我們日用而不知的神經計算。更不用說藝術家的美感和靈感也


    都是如此。


    只是有些時候，神經計算會讓我們感到驚奇。 比如一個經


