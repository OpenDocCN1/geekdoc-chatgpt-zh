    從線圈的參數到等離子體的形狀之間，隔著十萬八千里複雜的計算。以前物理學家要麼直接做實驗，要麼從物理學基本原理 出發，老老實實做數值模擬———而這兩種方法都是給定線圈參
    數，求形狀是什麼。

    可是你真正想要的是一個指定的等離子體形狀，能不能告訴我線圈得設置什麼樣的參數才能生成這個形狀?但從參數到形狀的「正推」都那麼難，這個「逆推」就更是難上加難了。

    而 DeepMind 使用強化學習的方法，把逆推的問題給解決了。他們能讓AI非常精準地操控那些線圈，你想要什麼形狀就能 給你什麼形狀。(圖4-6)這個成果非常漂亮，已經得到了真實實驗的證實。

