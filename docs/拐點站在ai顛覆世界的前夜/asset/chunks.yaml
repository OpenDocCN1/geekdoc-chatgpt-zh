    # 第二章 当 AI 进入人类社会


    ## 农业生产方式的改变


    直接指揮農民哪一天做什麼，等於提供了一攬子的解決方案，把所有決定都替農民做了。


    AI 還可以改變農業生產的方式。


    現在很多農產品都是在溫室裡種植的。溫室種植好處很多，但有個問題，就是容易長蟲害。那麼就有公司利用 AI，能提前一週準確預測某個溫室會不會長蟲。有了這一週時間，農民就可以提前訂購抗蟲用品。但這還只能算是一個應用解決方案。


    系統解決方案是，既然 AI 預測能力這麼強，農民就不用怕蟲害了。既然不怕蟲害，就可以種植一些原本因為怕蟲害而不敢種的農作物。還可以搞更大的溫室，因為不用擔心蟲害襲擊一大片農作物。農業的整個生產方式改變了。


    ![](img/index-77_1.jpg)


    要想讓 AI 充分發揮生產力作用，就必須用預測取代規則。現在 AI 輔助教學的技術完全可以做得很好。AI 可以根據你已有的詞彙量決定你今天應該背哪些單詞，根據你上一次數學測驗的得分決定你今天該學哪些數學知識，AI
    還能確保你每次都在自己的「學習區」學習，令學習效率最大化。但是，AI 還沒有真正改善我們的學習效率。


    第二章 當 AI 進入人類社會 063


    為啥呢?因為現在整個學校的組織仍然是按照年齡分級的。


    學校有規則。每個班都是同一個年齡段的學生，這些學生對課程內容掌握程度很不一樣，可是教學規則把他們黏在了一起，他們不得不每天聽同一個老師講同樣的內容。


    如果我們能用 AI 的邏輯重新組織教學，讓每個學生接受真正個性化的學習，讓每個老師發揮個性化的能力，學校會是什麼樣子?可能有的老師特別擅長幫助有閱讀困難的學生，有的老師特別擅長帶數學競賽，讓老師跟學生進行配對，讓
    AI 幫助老師掌握每個學生的進度，那才是系統性的改變。


    每次當你思考怎麼用 AI 的時候，都可以想想當初的電力。我們的生產、生活和社會很快就會圍繞 AI 重新設置，這一切才剛剛開始。


