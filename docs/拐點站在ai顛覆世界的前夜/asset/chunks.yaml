    對 AI 來說，你只需要關心輸入和輸出。

    AI 這種做事方法看起來很神奇，但其實這是世界上最自然的思維方式，因為這就是包括人腦在內，各種生物的感知方式。我們再來看一次前文的這張圖。(圖 4-8)

    ![](img/index-225_2.jpg)

