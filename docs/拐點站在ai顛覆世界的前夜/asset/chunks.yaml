    可是你真正想要的是一個指定的等離子體形狀，能不能告訴


    我線圈得設置什麼樣的參數才能生成這個形狀?但從參數到形狀


    的「正推」都那麼難，這個「逆推」就更是難上加難了。


    而 DeepMind 使用強化學習的方法，把逆推的問題給解決


    了。他們能讓AI非常精準地操控那些線圈，你想要什麼形狀就能 給你什麼形狀。(圖4-6)這個成果非常漂亮，已經得到了真實實


    驗的證實。


    ![](index-224_1.jpg)


    我講這麼多只是為了引用DeepMind 論文裡的一句話： 「強


    化學習方法⋯ ⋯ 將重點轉移到應該實現什麼目標上，而不是如何 實現。」(圖4-7)


    ①圖片來自 https://www.wired.com/story/deepmind-ai-nuclear-fusion/ 。 212 拐 點


    ![](index-225_1.jpg)


    這句話有多霸氣呢?它的意思是說，你只說想要什麼就好，不


    必問如何得到。


    對AI來說，你只需要關心輸入和輸出。


    AI這種做事方法看起來很神奇，但其實這是世界上最自然的思


    維方式，因為這就是包括人腦在內，各種生物的感知方式。我們再


    來看一次前文的這張圖。(圖4-8)


    ![](index-225_2.jpg)


    第四章 用已知推理未知 213


    因為這個世界是有秩序的，它講理，什麼事情都不會無緣無


