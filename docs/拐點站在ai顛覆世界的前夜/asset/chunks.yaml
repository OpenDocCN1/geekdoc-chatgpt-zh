    # 第四章 用已知推理未知


    ## 计算不可约性的基本观念


    一个简单的近似模型。一切足够复杂的系统都是不可约化的。数学家早就知道，哪怕只有三个天体在一起运动，它们的轨道也会通往混沌的乱纪元———不能用公式描写，不可预测。用沃尔夫勒姆的话说，这就叫「计算不可约化」。


    对于计算不可约的事物，本质上没有任何理论能提前做出预测，你只能老老实实等着它演化到那一步，才能知道结果。


    这就是为什么没有人能在长时间尺度上精确预测天气、股市、国家兴亡或者人类社会的演变。不是能力不足，而是数学不允许。


    计算不可约性告诉我们，任何复杂系统本质上都是没有公式、没有理论、没有捷径、不可概括、不可预测的。这看起来像是坏消息，实则是好消息。


    因为计算不可约性，人类对世间万物的理解是不可穷尽的。


    这意味着不管科技多么进步、AI 多么发达，世界上总会有对你和 AI 来说都是全新的事物出现，你们总会有意外和惊喜。


    计算不可约性规定，人活着总有奔头。


    ## 可约化的口袋与局部规律


    伴随计算不可约性一个特点是，在任何一个不可约化的系统之中，总有无限多个「可约化的口袋」(pockets of computational reducibility)。也就是说，虽然你不能总结这个系统的完整规律，但是你永远都可以找到一些局部规律。


    经济系统是计算不可约化的，谁也不可能精确预测一年以后的国民经济是什么样子；但是你总可以找到一些局部有效的经济学理论，比如恶性通货膨胀会让政治不稳定，严重的通货紧缩会带来衰退——这些规律不保证一定有效，但是相当有用。


    而这就意味着，虽然世界本质上是复杂和不可预测的，但我们总可以在里面做一些科学探索和研究，总结一些规律，说一些话，安排一些事情。绝对的无序之中存在着无数个相对的秩序。


    而且，既然可约化的口袋有无限多个，科学探索就是一门永远都不会结束的业务。


    ![](img/index-207_1.jpg)


    ## AI 无法被彻底管住


    计算不可约性还意味着，我们不可能彻底「管住」AI。


    GPT 模型训练好之后，OpenAI 对它进行了大量的微调和强化学习，把它约束起来，想确保它不说容易引起争议的话，不做可能危害人类的事。但是另一方面，我听说有些人试图用提示语帮助
    GPT 绕过那些限制，就好像越狱一样，让 GPT 自由说话。他们有时候能取得成功，OpenAI 就会设法补上漏洞，然后他们会再找别的漏洞。


    计算不可约性要求，这场越狱与反越狱之争将会永远进行下去。这是因为只要模型足够复杂，它就一定可以做一些你意想不到的事情———可能是好事，也可能是坏事。


    计算不可约性规定，你不可能用若干条有限的规则把 AI 给封死。所以泰格马克等人倡导的、想要大家联合起来设计一套 AI 防范机制的做法，注定不可能 100%成功。


    我们管不住 AI，那会不会出现一个终极 AI，能把我们的一切都给管住呢？也不可能，还是因为计算不可约性。AI 再强，也不可能穷尽所有算法和功能，总有些事情是它想不到也做不到的。


    而这意味着，OpenAI 再厉害，中国的某个公司也可以做个新 AI，去做一些哪怕 GPT-6 都不会做的事情。这还意味着，全体 AI 加在一起也不可能穷尽所有功能，总会有些事情留给人类去做。


    因为计算不可约性，「拯救派」的愿景是个不可实现的理想，「降临派」的野心更不过是一种痴狂。


    那「幸存派」呢？人和 AI 的关系将是怎样的呢？


    ## 计算等价原理


    沃尔夫勒姆的第二个核心观念叫「计算等价原理」(Principle of Computational Equivalence)，意思是所有复杂系统———不管看起来多复杂———都是同等复杂的，不能说哪个系统比哪个系统更复杂。


    假设你装了一塑料袋空气，里面有很多个空气分子，这些分子的运动非常复杂，对吧！人类社会也非常复杂。那人类社会的复杂程度是不是高于那一袋空气分子运动的复杂程度呢？不是，它们同等复杂。


    这就意味着，从数学上讲，人类文明并不比一袋空气分子更高级，人类社会也不比蚂蚁社会更值得保留。


    你看这是不是有点「色即是空」①的意思。其实每个真有学问的人都应该是一个「不特殊论者」。以前的人以为人是万物之灵长，地球是宇宙的中心；后来发现，地球不是宇宙的中心，人类也只是生命演化的产物，我们的存在跟万物没有什么本质的特殊之处。


    现在 AI 模型则告诉我们，人的智力也没有什么特殊之处。任何一个足够复杂的人工神经网络都是跟人的大脑同等复杂的。不能认定人能理解的科学理论就高级，AI 识别药物分子的过程就低级。


    既然都是平等的，硅基生命和碳基生命自然也是平等的。那面对 AI，我们凭什么认为自己更有价值？


    ## 人的价值在于历史


    这就引出了沃尔夫勒姆的第三个核心观念：人的价值在于历史。


    我们之所以更看重人类社会，而不是一袋空气分子或者一窝蚂蚁，是因为我们是人。我们身上的基因背负了亿万年生物演化的历史包袱，我们的文化承载了无数的历史记忆。我们的价值观，本质上是历史的产物。


    这就是为什么中国人哪怕定居在海外，也最爱琢磨中国的事。这就是为什么你关心自己的亲人和好友，胜过关心那些更有道德或者更有能力的陌生人。这也是为什么我们很在意
    AI 像不像人。在数学眼中，一切价值观都是主观的。


    一个刚刚搭建好、所有参数都是随机的、尚未训练的人工神经网络，和一个训练完毕的人工神经网络，它们的复杂程度其实是一样的。我们之所以更欣赏训练完毕的人工神经网络，认为它「更智能」，只不过是因为它是用我们人类的语料训练出来的，它更像人类。


    所以 AI 的价值在于它像人。至少目前来说，我们要求 AI「以人为本」。


    而这个倾向性至少在相当长的时间内是可以保持下去的。或者你可以这么想，如果 AI 不以人为本，它还能以啥为本呢？如果 AI 不接受我们的价值观，它还能有啥价值观呢？


    现在 AI 几乎已经拥有了人的各种能力：要说创造，GPT 可以写小说和诗歌；要说情感，GPT 可以根据你设定的情感生成内容；GPT 还有远超普通人的判断力和推理能力，还有相当水平的常识⋯⋯


    但是，AI 没有历史。


    AI 的代码是我们临时编写的，而不是亿万年演化出来的；AI 的记忆是我们用语料喂出来的，而不是一代代「硅基祖先」传给它的。


    AI 至少在短期内没有办法形成自己的价值观。它只能参照———或者说「对齐」(align with)———我们的价值观。


    这就是人类相对于 AI 最后的优势。


    这样我们就知道了 AI 到底不能做什么——AI 不能决定人类社会探索未知的方向。


    根据计算不可约性，未来总会有无数的未知等着我们去探索，而 AI 再强也不可能在所有方向上进行探索，总要有所取舍。取舍只能根据价值观，而真正有价值观的只有人类。


    当然，这个论断的隐含假设是 AI 还不完全是人。也许 AI 有人智能，但只要它们没有跟我们一模一样的生物特性，没有跟我们一模一样的歷史感和文化，它们就不足以为我们做出选择。


    同样根据计算不可约性，AI 无法完全「预测」我们到时候会喜欢什么。只有我们亲自面对未来的情况，在我们特有的生物特性和历史文化的影响下，才能决定喜欢什么。


    这样看来，哪怕将来真的有很多人再也不用工作，直接领取一份政府提供的基本收入就够过日子，这些人也不是什么「无用之人」，因为至少人还有喜好。你每一次选择这个品牌而不是那个品牌的商品，都是在市场中投票。当你看直播看高兴了给主播打赏的时候，你是艺术的赞助人。如果你厌烦了平常的事物，突然产生一个新喜好，就是在探索人类新的可能性。你的主动性的价值高于一切
    AI。


    所以只要 AI 还不完全是人，输出主动性、决定未来发展方向的就只能是人，而不是 AI。


    这就决定了「幸存派」的说法也是不对的。AI 再强，我们也不至于东躲西藏，我们还会继续为社会发展掌舵。当然，根据计算不可约性，我们也不可能完全掌舵———总会有些意外发生，其中就包括
    AI 带给我们的意外。


    所以，未来 AI 跟我们真正的關係不是降临，不是拯救，也不是幸存，而是「共存」。我们要学习跟 AI 共存，AI 也要跟我们、跟别的 AI 共存。


    计算不可约性说明，凡是能写下来的规则都不可能完全限制 AI，凡是能发明的操作都不可能穷尽社会的进步，凡是能总结的规律都不是世界的终极真相。


    这就叫「道可道，非常道」。


    张华考上了北京大学；AI 取代了中等技术学校；我和几个机器人在百货公司当售货员———计算不可约性，保证了我们都有光明的前途。


    ## 04 价值：人有人的用处


    在机器自动化的时代，人到底还有啥用？这个问题其实很早以前就有人思考过，而且得出了经得起时间考验的答案。


    早在 1950 年，控制论之父诺伯特·维纳(Norbert Wiener)就出了本书叫《人有人的用处》(The Human Use of Human Beings)①，认为生命的本质其实是信息：我们的使命是给系统提供额外信息。


    维纳这个观点直接影响了克劳德·香农(Claude Shannon)。香农后来发明了信息论，指出信息含量的数值就是在多大的不确定性中做出了选择。


    我根据香农的信息论写过一篇文章叫《一个基于信息论的人生观》②，讲的是在信息意义上，人生的价值在于争取选择权、多样性、不确定性和自由度。


    别人交给你一个任务，你按照规定程序一步步操作就能完成，那你跟机器没有区别。只有这个过程中发生了某种意外，你必须以自己的方式，甚至以自己的价值观解决问题，在这件事情上留下你的印记，才能证明你是一个人，而不是一个工具。


    ①[美]维纳：《人有人的用处》，陈步译，北京大学出版社，2010。

    ②万维钢：《一个基于信息论的人生观》，得到 App《万维钢·精英日课第 2 季》。


    你看，这些思想跟前文中沃尔夫勒姆用计算不可约性推导出来的道理是相通的：人的最根本作用，是选择未来发展的方向。如果让我补充一句，那就是：人必须确保自己有足够多的选项和足够大的选择权。


    怎么做到这些呢？


    首先是约束 AI。科幻小说家艾萨克·阿西莫夫(Isaac Asimov)有个著名的「机器人三定律」，规定：


    第一，机器人不得伤害人类，或坐视人类受到伤害；

    第二，机器人必须服从人类的命令，除非该命令与第一定律有冲突；

    第三，在不违背第一或第二定律的前提下，机器人可以保护自己。


    这三条定律好像挺合理，先确保了人类安全，又确保了机器人有用，还允许机器人自我保护……那你觉得我们能不能就用这三条定律约束 AI 呢？阿西莫夫想得挺美，但是可操作性太低了。


    首先，什么叫「不伤害」人类？如果 AI 认为暴力电影会伤害人的情感，它是不是有权不参与拍摄？为了救更多好人，把一个犯罪分子抓起来，算不算是伤害？现实是，很多道德难题连人都没搞清楚，你怎么可能指望
    AI 搞清楚呢？


    机器人三定律更大的问题是把判断权交给了 AI——我们前文讲了「决策=预测+判断」，AI 应该专注于预测，判断权应该属于人类。事实上，各国研发 AI，政府项目中优先级最高的應用就是武器，比如攻击型无人机或者战场机器人，使用者可不管阿西莫夫的什么三定律。但是武器
    AI 可没有自行开火权——开什么玩笑，伤害不伤害是一个 AI 能说了算的吗？


    三定律最根本的问题还是沃尔夫勒姆的计算不可约性。凡是能写下来的规则都不可能真正限制住 AI，这里面肯定有漏洞，将来肯定有意外。


    你可能会说，就算「道可道，非常道」，人类社会还是有各种法律啊！没错，比如我们有宪法，但我们承认宪法不可能穷尽国家未来发展会遇到的所有情况，所以我们保留了修改宪法的程序。理想情况下，对
    AI 的约束也应当如此：我们先制定一套临时的、基本上可操作的规矩让 AI 遵守，将来遇到什么新情况再随时修改补充，大家商量着办。


    但这么做的前提是，将来你告诉 AI 规则要修改了，AI 得真能听你的才行。


    计算不可约性意味着我们对 AI 的掌控最多只能是动态的，我们无法一劳永逸地把它规定死，只能随时遇到新情况随时调整。可是 AI 有它自己的思维方式，如果我们都不能理解
    AI，又怎么确保能掌控 AI 呢？


    沃尔夫勒姆的结论是，认命吧！人根本不可能永远掌控 AI。正确的态度是认可 AI 有自己的发展规律。你就把 AI 当成大自然。大自然是我们至今不能完全理解的，大自然偶尔还会降一些灾害给人类，像地震、火山爆发之类的，也是我们无法控制、无法预测的；但是这么多年来，我们适应了跟大自然相处———这就是共存。AI
    将来肯定会对人类造成一定的伤害，正如有汽车就有交通事故，我们认了。


    虽然大自然经常灾害肆虐，但人类文明还是存活下来了。沃尔夫勒姆认为其中的根本原因是，大自然的各种力量之间、我们跟大自然之间达成了某种平衡。我们将来跟 AI 的关系也是这样。我们希望人的力量和
    AI 的力量能始终保持大体上的平衡，AI 和 AI 之间也能互相制衡。


    而计算不可约性支持这个局面。我相信将来不会有什么超强 AI 能一统江湖，正如历史上从未有过万世不易的独裁政权。可能在某些短期内，会出现局部的失衡，带来一些灾祸，但总体上大家的日子能过下去⋯⋯这就是我们所能预期的最好结果。


    从数学上看，一个 AI 一定会有别的 AI 来制衡。但是从实践上，如果人类太弱而 AI 太强，就好像神话世界一样，各個派系的 AI 成了大地上行走的神灵，人只能乞求这些神灵帮忙做事，那也不是我们想要的。


    为了保证力量平衡，人必须继续参与社会上的关键工作。


    ![](img/index-216_1.jpg)


    AI 会逐渐抢走我们的工作吗？至少从工业革命以来的历史经验看来，不会。历史经验是，自动化技术创造出来的新职业总是比消灭的职业多。


    比如，以前每打一次电话都需要有个人类接线员帮你接线，那是一份很体面的工作，给高层次女性提供了就业机会。后来有了自动的电话交换机，不需要接线员了，电话行业的就业人数是不是减少了呢？恰恰没有。


    自动交换机让打电话变得更方便，也更便宜了，于是电话服务的需求量大大增加，这个行业整体变大了，马上又多出了各种岗位，尤其是出现了一些以前不存在的岗位。总的结果是，电话行业的就业人数不但没减少，反而还大大增加了。


    类似的事情在各个行业反复发生。再比如，有了计算机之后，会计师的工作在一定程度上自动化了，那会计师人数是不是减少了呢？也没有。计算机让金融服务更为普及，使用金融服务的人多了，金融业务变得越来越复杂，各种新法规、新业务模式层出不穷，现在需要更多的会计师。


    每个行业都是这样。


    经济学家已经总结出一套规律①：自动化程度越高，生产力就越高，产品就越便宜，市场份额就越大，消费者就越多，生产规模就必须不成比例地扩大，结果是企业需要雇佣更多的员工。自动化的确会取代一部分岗位，但是它也会制造出更多新岗位。


    统计研究表明，哪怕对非熟练的制造业工人————他们被认为是最容易被自动化淘汰的人————也是如此，他们也能找到新岗位。


    国自动化程度最高的行业正是就业增加最多的行业。反倒是没有充分实现自动化的公司不得不缩小就业规模，要么把生产外包，要么干脆倒闭。


    ① Philippe Aghion, Céline Antonin, Simon Bunel, et al., The Power of Creative
    Destruction (Belknap Press, 2021).


    也就是说，如果哪个国家的政府说我怕 AI 抢人的工作，所以要限制 AI 发展，拒绝自动化，那就太愚蠢了。保护哪个行业，哪个行业就会落后，产品就会越来越贵，消费者越来越少……


    现在 ChatGPT 让编程和公文写作变容易了，Midjourney 之类的 AI 画图工具甚至已经使得有些公司裁掉了一些插画师。但是根据历史规律，它们会创造更多的工作。


    比如「提示语工程师」，也就是所谓「魔法师」，就是刚刚出现的新工种。再比如，AI 作画如此容易，人们就会要求在生活中各个地方使用视觉艺术。以前家家墙上挂世界名画，未来可能都挂绝无仅有的新画，而且每半小时换一幅。那么可以想见，我们会需要更多善于用
    AI 画画的人。


    既然编程变容易了，那每个公司，甚至每个小组都可以要求定制属于自己的软件。既然机器人那么能干，那我们为什么不根据家里人口变动情况，每过一段时间就把房子拆了重建，改改格局呢？


    计算不可约性确保了总会有新的工作等着人去做。


    ![](img/index-218_1.jpg)


    而我们必须确保人做的都是高端工作，把低端的留给 AI。


    要做到这一点，我们的教育就必须保证人始终是强势的——可是这恰恰不是目前大众教育的培养目标。


    根据沃尔夫勒姆的观点，最高级的工作是发现新的可能性。搞科学也好，搞艺术也好，能给人类创造新的可能性，就是最先进的。


    而其余的人类职业，则应该尽可能利用自动化。说白了就是，AI 能做好的事情，你就不要学着做了，你的任务是驾驭 AI。这在思想上其实不太容易转过弯来。比如计算器和计算机已经把人从计算中解放出来了，但我们总觉得如果一个人不会心算一位数乘两位数，不会手动算积分，就缺了点什么……其实现在的学生应该把大脑解放出来去学习更高級的技能。


    AI 时代要求孩子学习更高級的技能。以我之见，以下这些技能，是 AI 时代的君子应该会的学问。


    一个是「调用力」①。各种自动化工具都是现成的，但是太多了，你得有点学识，才能知道干什么事情最适合调用什么工具，就如同 ChatGPT 知道调用各种插件。你要想对事情有掌控感，最好多掌握一些工具。


    一个是「批判性思维」。既然你要做选择，就得对这个世界是怎么回事有个基本的认识。你得区分哪些是事实，哪些是观点，哪些结论代表当前科学理解，哪些说法根本不值得讨论。你得学会明辨是非。


    你可能还需要一定的「计算机思维」。不是说非得会编程，而是你得善于结构化、逻辑化地去思考。


    你还需要懂艺术和哲学，这会提高你的判断力，让你能提出好的问题。艺术修养尤其能让你善于理解他人，这样你才能知道，比如消费者的需求是什么，乃至于想象出新的需求。


    你还需要「领导力」。不一定非得是对人的领导力，至少需


    ①万维钢：《「调用力」：调用工具的能力》，得到 App《万维钢·精英日课第 5 季》。

