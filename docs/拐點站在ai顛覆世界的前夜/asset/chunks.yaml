    此外，你還需要一定的傳播能力和說服力。你能把一個複雜想法解釋清楚嗎?你能讓人接受你的觀點嗎?你能把產品推銷出去嗎?高端工作很需要這些。

    沃爾夫勒姆有個觀點，人最核心的一個能力，是自己決定自己關心什麼、想要什麼。這是隻有你才能決定的，因為這些決定的答案來自你的歷史和你的生物結構。這也是至關重要的戰略選擇，因為如果選不好，你的路可就走岔了。

    北大考試研究院院長秦春華有個感慨。他去上海面試學生，發現他們的學習成績、藝術特長、公益事業什麼的全都一模一樣，看起來都很完美，實則沒有任何特點。最可怕的是，他問學生們希望自己將來成為什麼樣的人，很少有人能答上來。①

    其實美國的情況也差不多，同質化競爭之下，大量優等生都是「優秀的綿羊」②。

    這些人如果不「開悟」，幾乎肯定會輸給 AI。你是歷史的產物，你是現代教育系統的犧牲品，但你還可以獨立學習和思考，你能做出更好的選擇。

