    02


    重塑：怎樣用ChatGPT對話式學習


    在 ChatGPT的眾多應用場景之中，我特別感興趣的一項是如


    何用它學習。阿爾特曼在一次訪談中提到，他現在寧可通過 ChatGPT———而不是讀書———學習一個東西。那怎麼學呢? 我演練了一番，很有收穫，跟你分享一下其中的體驗。


    這是一種對話式學習。這也許是「學習」最原本的樣子。我


    們設想，在書籍變得流行之前，在沒有正規教材，甚至都沒有正


    規課堂的時候，在孔子和蘇格拉底那個時代，學習大概就是以師


