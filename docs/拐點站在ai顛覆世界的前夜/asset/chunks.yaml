    # 第五章 实战，让 AI 为你所用


    ## 第二条咒语心法：尽量给出具体的情境


    第二条咒语心法是，尽量给出具体的情境。这个心法能大幅度提升 GPT 的输出质量。


    现在很多人都会用 GPT 起草电子邮件、写报告，甚至写文章，给它一篇文章，它还可以生成摘要，回答关于这篇文章的问题。但是要让 GPT 把这些事情真正做得漂亮，你最好自己先做一番功夫。


    GPT 是无数语料喂出来的，我们可以想象它是无数个作家的分身叠加而成的。如果你只是提一个一般性的要求，它就只能给你生成一个一般性的、用在哪里都行，但是用在哪里都不是最恰当的内容。但如果你能把要求细化，它就会生成适合你这个特殊情况的内容。


    举个例子，假设你的公司要裁员 20%，你让 GPT 写个讲话稿。


    如果只是简单地说「公司要裁员 20%，请起草一份讲话稿，通知这个消息」，它生成的就是一份可以用於任何公司的讲话稿。


    (图 5-6)


    GPT 已经尽可能表现得真诚，但是你还是会觉得空洞———因为没有针对性。


    但如果你把情境说得细一点，给 GPT 提供更具体的要求，它就会做得更好。比如，你说「你是一家出口公司的 CEO，现在公司必须裁员 20%。起草一份面对管理层的讲话，激励大家给公司想新出路、新办法」，它生成的内容就不一样了。(图
    5-7)


    这份讲话稿带了很多情绪，鼓励员工从几个方面寻找解决问题的方法，在提振士气。


    其实这个道理跟使用秘书是一样的。只不过秘书一直在公司里，你不说，他也了解公司的具体情况，他能猜到你想要什么；而对 GPT，你必须把情况告诉它。


    让 GPT 生成内容一定要给它提供「具体情境」`context`，包括以下 5 个方面：

    1. 谁在说;

    2. 说给谁;

    3. 在什么场合之下；

    4. 使用什么风格；

    5. 要达到什么目的。


    ![](img/index-252_1.jpg)

