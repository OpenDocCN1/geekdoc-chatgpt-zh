    ## 02 经济：AI 让调配资源更有效


    據說因為 AI 替代而導致裁員最多的就是保險公司。這挺合理，畢竟保險業務最重要的就是做預測，而在這種數據密集的領域，AI 很擅長預測。


    以房屋保險為例，所有業務可以分成 3 個主要決策——

    1.營銷：分析潛在客戶人群，看看他們的價值有多大，能轉換成客戶的概率有多高，再決定下多大功夫去爭取；

    2.承保：根據房屋的價值和出事故的風險，計算合理的保費，要既能讓公司盈利，又能在市場上有價格競爭力；

    3.理賠：一旦房子出事，客戶索賠，要評估索賠是否合理合法，加快理賠進度。


    這些決策中的預測部分都可以交給 AI。現在有些保險公司已經把理賠給自動化了。比如，你家屋頂被冰雹砸壞了，保險公司並不需要派人去現場查看——你自己拍張照片發過來，AI
    看一眼就能給你估價，該賠多少錢直接辦理，省時省力。


    但這只是點解決方案。系統解決方案是，保險公司不僅要跟你算錢，還會干預你對房屋的保養。


    現在的保險公司看到房屋風險比較大，就提高保費。AI 化的保險公司看到風險大，會以保費為槓桿，要求客戶採取行動降低風險。


    第二章 當 AI 進入人類社會 067


    比如，美國 49%的房屋火災都是在家做飯導致的———主要是油炸這種烹飪方式。可有些家庭從來不做油炸食品，有些家庭經常搞油炸，讓這兩類家庭為火災保險交同樣的錢，就不太合理。以前保險公司不得不對他們收一樣的保費，是因為不知道誰家風險更高。


    現在保險公司可以這麼幹。問客戶可否在廚房安一個裝置，每次炸東西裝置就自動記錄下來。客戶第一反應肯定是不同意，說這涉及隱私。但 AI 預測足夠精確的話，保險公司就可以跟客戶談，如果允許裝這個裝置，保費可以降低
    25%。你覺得客戶會不會接受?


    再比如，保險公司根據 AI 預測得知，你家房子的水電管線有點老化，容易出問題。它可以主動給你提供補貼，讓你把家裡的管線修繕一下。


    目前，保險公司還不願意這麼做，因為這意味著實際保費會率先降低——保險公司更喜歡加價而不是減價。但如果 AI 足夠精確，保險公司就可以看到災害切實減少，理賠費用一定會降低，那麼它的利潤是增加的。這麼做就有雙重的好處，不但保險，而且減災。


    而這一切都只有在 AI 能把賬算得非常清楚的情況下才能實現。


    068 拐 點


    醫院急診室有個特別常見的狀況是病人胸口痛。對這種情況，醫生必須判斷是不是心臟病，是心臟病就得趕緊處置。但問題是，急診醫生並沒有很好的診斷方法。


    通常的做法是搞個正式的檢查，而心臟病檢查對患者是有害的。準確的測試需要用心導管之類，會直接給身體造成創傷；哪怕只是做個簡單的 X 光或 CT，也有輻射。


    於是，有兩個經濟學家發明了一套 AI 診斷系統，能根據患者外表的幾個症狀指標預測是否患心臟病、是否需要進一步正式檢查。


    研究表明，這套 AI 系統比急診醫生的診斷更準確。


    跟 AI 系統的診斷結果對比發現，很多不應該做有創檢查的患者被急診醫生要求去做了有創檢查——這似乎可以理解，畢竟讓患者做檢查醫院可以多收錢。AI 系統還發現，有很多應該去做檢查的病人，急診醫生卻打發他們回家了。有的患者因此錯過了治療時間，甚至導致死亡。


    這麼看來，改用 AI 診斷，不但對患者大有好處，對醫院也有好處。醫院的工作流程不需要改變，診斷時間還減少了，也沒少收錢，對吧！


    可是事實證明，醫院大多不願意採用 AI。


    醫院，是一種非常保守的機構。可能正因為有太多新技術等著醫院去採納———每採納一個新技術，都要重新培訓醫生，重新審議流程；新技術還有風險，測試時挺好的，一旦用上了，可能會有問題；新技術還會影響各部門的權力分配，產生各種連帶問題⋯
    ⋯ 所以醫院要改革是最難的，它很不願意採納新技術。


    第二章 當 AI 進入人類社會 069


    但如果醫院可以系統性地採納 AI 診斷，急診室會變成什麼樣呢?


    某人感到胸口痛，打電話到醫院。醫院 AI 通過他對症狀的描述，也許再結合他身上智能手錶的讀數，能直接預測是不是心臟病。醫生根據 AI 的報告，如果判斷這個人沒事，就讓他不用來醫院；如果判斷的確是心臟病發作而且很嚴重，就直接派救護車過去。救護車上的醫生還會攜帶能緩解心臟病的儀器，到病人家裡先採取一些手段，爭取搶救時間。


    這是對整個急診流程的改變。


    任何組織都可以被看作是決策組織。《權力與預測》這本書裡搞了一個應用 AI 的戰略方案，是從填一個表格開始。(表 2-1)


    表 2-1

    1\. `Mission`(任務)

    2\. `Decision`(決策)

    3\. `Prediction`(預測)

    4\. `Judgement`(判斷)


    表格的第一項是組織的核心任務。無論有沒有 AI，這個任務都是固定不變的。


    070 拐 點


    然後把核心任務涉及的幾個決策都列出來，標記好這些決策是由哪些部門來做的。


    再把每一項決策分成「預測」和「判斷」兩部分，列出目前都是哪些部門負責的。


    再考慮如果把預測都交給 AI，涉及的各個部門會受到什麼影響⋯ ⋯ 按照這個思路去考慮組織機構的變革。操作細節這裡就不講了，我們重點看趨勢。


    從 AI 的點解決方案過渡到系統解決方案不會用很長時間，因為點解決方案有一個驅動系統解決方案的趨勢。


    這本書裡有個特別好的例子是開餐館。假設你開了家餐館，準備食材是個有關「不確定性」的遊戲。客人只能點菜單上的菜，這給你提供了一定的方便，你只要準備特定的幾種食材就行。但客人點菜具有波動性，有一陣流行這個，有一陣流行那個，食材消耗是不確定的。以前你每週都訂購
    100 斤牛油果。有時候 100 斤太多了，沒用完得扔掉；有時候又太少，客人點了這道菜卻沒有。


    現在你用上了 AI，AI 能精確預測下週大概需要訂購多少牛油果。於是你有時候訂 30 斤，有時候訂 300 斤，減少了浪費，還保證了供應，餐館的盈利提高了。


    但是請注意，因為你的不確定性減少了，你的上游供應商出貨的不確定性反而增加了。他很喜歡你每週都訂 100 斤，現在你變來變去，他的銷售就產生了波動。他怎麼辦?只好也用上
    AI。


    第二章 當 AI 進入人類社會 071


    以前他每週固定採購 25000 斤牛油果，現在他有時候訂 5000 斤，有時候訂 50000 斤。那他的上游會怎樣? 也得用 AI 預測市場波動才行。


    因為一家企業的波動而引起整個供應鏈的大幅波動，這在供應鏈管理領域叫「牛鞭效應」(`Bullwhip Effect`)。牛鞭效應會導致庫存增加、服務水平下降、成本上升等問題。這個思想實驗告訴我們兩個道理。


    一個道理是，要用 AI，最好整個社會一起協調，大家都用 AI。另一個道理是，應用 AI 可能會在一時之間放大社會波動，我們最好小心行事。


    ![](img/index-86_1.jpg)


    怎麼減少 AI 對社會造成的震動呢?一個好辦法是先模擬。講個有意思的故事。美洲盃帆船賽是一項歷史悠久的賽事，但是參賽隊伍都很講究科技應用，他們一直在想辦法改進帆船的設計。這裡面有個很有意思的動力學規律，就是帆船設計變了，操控帆船的技術也得跟著變才行。運動員得找到操控這個新設計的最佳方法，才能知道這個設計到底好不好。


    傳統方式下，每設計出一個新型帆船，得讓運動員先嚐試用各種不同的方法駕駛它。運動員要熟練掌握一個新方法是需要時間的，好不容易掌握了，還不知道是不是最好的。也許換個設計，用另一套駕駛方法，效果會更好……可是那麼多搭配，運動員哪有時間一次次訓練新方法呢?這裡創新的瓶頸是運動員。


    072 拐 點


    2017 年，新西蘭隊跟麥肯錫諮詢公司共同發明了一個新辦法，那就是用 AI 代替運動員試駕新帆船。


    設計好一個新帆船，先用 AI 模擬運動員的操作，然後用強化學習的方法把 AI 訓練好，讓 AI 找到駕駛這種船型的最佳方法。這個速度比人類運動員可快太多了。


    當然，真正的比賽中不能讓 AI 上場。但是找到船型和操控方法的最佳組合之後，可以讓 AI 教人類運動員怎麼駕駛帆船。就這樣，運動員不用參加反覆的試驗，就學會了最佳操控方法。


    這個故事的意旨是，有什麼新方法可以先在模擬環境中演練。


    事實上，就在 2022 年，新加坡已經搞了一個「數字孿生體」(`Digital Twin`)，一比一復刻了一個虛擬新加坡。開發這套系統用了幾千萬美元。現在新加坡政府搞城市規劃，什麼動作都可以先在虛擬新加坡裡測試一下。


    比如，新加坡想用 AI 管理交通，擔心會不會對整個系統造成比較大的波動，就可以先在虛擬新加坡裡測試一下這個做法。


    現在的趨勢就是，從個別公司在個別任務上使用 AI 到系統性地使用 AI，再到整個社會圍繞 AI 展開。AI 會讓我們的社會變得更聰明。在這個過程中，企業和政府部門都有大量的工作可以做。


    第二章 當 AI 進入人類社會 073


    你的生活也會因此而改變。你能接受在家裡做個油炸丸子都會影響房屋保險嗎?你會覺得 AI 對人的干預太多嗎?


    如果 AI 的干預意味著保險費下降，生活更方便，財富更多，我想你會接受的。


    還是跟電力類比，如果將來到處都是 AI，我們就可以忘記 AI———我們只要模模糊糊地知道什麼行為好、什麼行為不好，而不必計較背後的數字。AI 會自動引導我們做出更多好的行為，也許整個社會會因此變得更好。


    074 拐 點


    ### 问答


    問 Ming、70man


    用 AI 協調和精確預測的社會，看上去像計劃經濟社會，只不過計劃做得更精確、更合理了。AI 是偏向權力集中的技術嗎?以後會不會變成「超級計劃」的社會呢?


    萬維鋼


    幾年前有些互聯網大佬說，現在 AI 預測這麼厲害，我們可以回到計劃經濟———這完全是錯誤的認識。計劃經濟的本質不是預測，而是指令和控制。


    我預測明年會流行藍色服裝面料，所以我計劃今年多生產一些藍色布匹，這不是計劃經濟。計劃經濟是，國家今年給你們工廠分配了生產這麼多藍色布匹的任務，收購價格和收購數量都是固定的，你完成任務就好。前者你是主動的，後者你是被動的。


    AI 預測是更好地面對市場的不確定性；計劃經濟卻是要消除不確定性。


    經濟學家法蘭克·奈特 (`Frank Knight`) 提出過一個關於市場不確定性的理論。市場不確定性的根本來源是人的慾望的不確定：今年喜歡紅色，明年喜歡藍色，我愛喜歡什麼就喜歡什麼，你管不了。


    市場經濟，是企業家猜測消費者喜歡什麼，甚至可以發明新的喜歡。這本質上是賭，賭錯了你會損失慘重。


    在計劃經濟中，人們放棄了「賭」，認為上面安排生產啥我就生產啥。你的確可以在相當程度上收穫安全和穩定，但是


    第二章 當 AI 進入人類社會 075


    你必須讓渡自主性，一切都得服從「上面」的安排。


    那你說「上面」會不會積極預測明年老百姓喜歡什麼，好制訂更好的計劃呢?不會的。


    經濟一定是一管就死，只有市場經濟才能讓人們的日子多姿多彩。AI 也不能改變這個道理。


    076 拐 點


    ## 03 战略：AI 商业的竞争趋势


    `ChatGPT` 出現僅幾個月，就誕生了成百，也許上千個 AI 應用，可以說是群雄並起。


    我在 X 上追蹤各路消息，感覺現在簡直是人人都能自己搞個 AI 應用：從網站到手機 App、瀏覽器插件，甚至開源軟件⋯ ⋯哪怕你以前不熟悉編程開發都沒關係，因為可以讓`ChatGPT`
    替你做編程。


    在大公司層面, `OpenAI`之外, Google、微軟、`Meta`都有自己的模型。埃隆·馬斯克(Elon Musk) 本來是`OpenAI`的投資者之一，後來因為理念不合退出了，也在找人做自己的模型。`OpenAI`以外，在性能上最先達到
    `GPT-3.5`水平的模型可能是`Claude`, 是由一個叫 `Anthropic` 的小創業公司開發的——這家公司是`OpenAI` 之前的僱員獨立出來成立的。


    中國這邊也是風起雲湧，阿里、騰訊等幾家大公司也在訓練自己的模型，再加上各路小公司，號稱是「百模大戰」……


    這絕對是 20 世紀 90 年代以來，互聯網創業最熱鬧的時刻。如果有志於做一番大事，別錯過這一波機遇。


    你可能會有疑問: Google 那麼強, 為什麼這次推出 `ChatGPT`的不是 Google? 在 `OpenAI`已經如此厲害的情況下，中國公司還有多大機會?


    第二章 當 AI 進入人類社會 077


    AI 確實是前所未有的變革，但是商業的邏輯並沒有變。


    如果你熟悉商業邏輯，就能想明白為什麼 Google 沒有率先推出`ChatGPT`。這是一次典型的顛覆式創新。


    大語言模型最關鍵的一個技術是 `Transformer` 架構，`Transformer`就是 Google 發明的。Google 有很深的技術積累, 自家就有不止一個語言模型。可是一直等到微軟把搜索和
    GPT 模型結合, 推出了 `Bing Chat`之後, Google 才坐不住了, 在 2023 年 2 月 7 日推出了一個叫 `Bard`的競品。結果測試表現不好，導致股價大跌。


    Google 為什麼起了個大早，卻趕了個晚集呢?這其實就是克萊頓·克里斯坦森(Clayton M. Christensen ) 在《創新者的窘境》(`The
    Innovator''s Dilemma`) 裡講的一個非常典型的情況。


    我曾經跟谷歌大腦的一個工程師聊他們為什麼被 `OpenAI` 搶先，他認為 Google 的問題是犯了大企業病，本來就人多，又加上收購 `DeepMind`
    (被 Google 收購的人工智能公司), 公司扯皮的事兒太多，效率低。但是我敢說，Google 之所以從一開始就沒有好好做對話式搜索這個項目，是因為對話式搜索不符合
    Google 的利益。


    傳統搜索很容易在搜索結果中插入廣告，那些廣告收入是 Google 的命脈所在。對話式搜索消耗的算力是傳統搜索的 10 倍———這可以接受，可是廣告怎麼辦?你很難在聊天中插入廣告。Google
    顯然不想自己顛覆自己，它不會主動搞這種新模式；


    078 拐 點


    而微軟則是「光腳不怕穿鞋的」。


    結果 `Bing Chat`一出來, Google 的搜索流量就顯著下降。(圖 2-2)


    ![](img/index-93_1.jpg)


    克里斯坦森說，一項技術變革哪怕再激進，只要改善的是傳統的商業模式，就不會發生顛覆式創新———只有當這項技術改善的不是傳統指標時，才會出現顛覆。


    ![](img/index-93_2.jpg)


    舉個耳熟能詳的例子。為什麼 `Netflix`(奈飛)的流媒體播放模式能顛覆 `Blockbuster`(百事達) 的錄像帶出租模式?`Blockbuster`其實看到了`Netflix`來勢洶洶,
    也找到了應對策略, ① 此圖 Y 軸座標有一定的誤導性，在感覺上放大了差異，但是仍然能說明問題。


    第二章 當 AI 進入人類社會 079


    還開發了視頻點播業務……但是，它敗給了自己。


    '
