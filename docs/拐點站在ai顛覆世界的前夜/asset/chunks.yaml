    ## 02 教育：不要再用训练AI的方法养人了


    AI時代，人的教育和成長應該是怎樣的?為什麼這次創新又是率先出現在美國?傳統的教育有沒有問題?


    AI視角之下，我們得重新考慮，什麼樣的成長才是人的成 長。


    傳統的教育是居高臨下的姿態。主動權在學校、老師和家長 這些「教育者」手裡，學生作為「教育對象」是被動的。以前我 們可以把這種教育比喻成園丁栽培植物：教育者安排好環境，澆
    水，施肥，時而選拔；教育對象根據要求成長。


    但是現在我們有個更精確的類比——那是訓練AI的方法。


    事先劃定學習範圍，把標記好什麼是對、什麼是錯的學習材 料餵給受訓練對象，然後考核訓練結果———這種教學方式，在 人工智能界叫作「監督學習」，是最基本的訓練AI模型的方法。
    這樣教出來的學生連GPT都不如。要知道， GPT 主要用的是「自 監督學習」(Self-Supervised Learning) 和「無監督學習」，它 不用你標記數據，能自己找規律，它天生設定就是能知道老師不
    知道的東西。


    但 AI不是人，至少現在還不是。我們相信每個人身上都有一 些 AI(暫時)無法替代的素質。雖然我們說不清它們是哪些東西， 但是通過跟AI對比，我們可以知道它們不是哪些東西。


    簡單說，有三個弊端，是傳統教育中有，AI身上也有，但是 人類中的創新者身上沒有的。以前你可能都不覺得它們是問題， 但是現在在 AI視角之下，這三個弊端就非常顯眼。


    第一，回報的來源是管理者的認可。這個學生是不是好學 生，由學校和老師說了算，而他們主要看學生的考試成績和聽話 程度。


    第二，高度重視錯誤。以考試為核心的教育講究「刻意練 習」和「補短板」，學生必須對自己的錯誤非常敏感才行，有錯 必改，知錯必學。


    第三，對教學範圍以外的東西、對新事物是不關心的。老師 甚至會督促學生不要分心、少看課外書，把精力都放在「學習」 上。能集中注意力是個重大優點。


    AI也有這些特點。不管用什麼訓練方法，對於是好是壞都有 一套相當客觀的標準。ChatGPT 出來之後人們都愛給它挑毛病， 對自動駕駛AI更是如此，那真是每犯一個錯都是大錯。AI
    的訓 練範圍可以很大很大，但是為了讓它少出錯，你不想餵給它垃圾 信息。


    但是我們看那些創造性人才，什麼科學家、藝術家，特別是 企業家，他們正好有三個相反的特點。


    第一， 回報不是來自上級領導的認可，不是因為滿足了什 麼標準，而是來自社會、來自消費者，有時候甚至是來自自己 的認可。這樣的認可沒有標準，也許今年的「好」明年就過時
    了。他們甚至可以自己為社會定義什麼叫「好」。


    第二，他們並不特別在乎自己做錯過什麼，不太重視短板，他們 要的是長板。做不好的項目可以不做，他們關心的是，在自己能做好 的項目上，自己是否好到了足以贏得世人認可的程度。


    第三，樂於追逐新事物。越新的東西越有可能讓他們獲得競爭優 勢。


    這樣的人大概不怕被 AI取代，因為他們走的是跟 AI不一樣的成 長路線。他們身上沒有 AI那種機械味，他們有更健全的人格。其中 最重要的一點就是自主性———他們自己判斷什麼是好、什麼是壞，
    自己決定學什麼和做什麼，想要在世界上留下自己的痕跡。他們是自 我驅動的人。


    這樣的人物與其說是被訓練出來的，不如說是被縱容出來的。學 術界對此有些新研究，我講兩點。


    一個是積極情緒的作用。


    情緒不只是一種「感覺」。現在最新的認識①是，情緒決定了大 腦當前的心理模式———不僅影響行為，而且影響認知。情緒不只決 定你對情緒事件的看法，而且影響你對其他事情的看法。


    比如，恐懼情緒會讓你高估不幸事件發生的概率。如果一 個人剛看完恐怖片，你跟他討論最近的經濟形勢如何，他會更容易認為 經濟會變差。就算他完全理解經濟形勢跟恐怖片根本沒關係，他的認知
    還是會被影響。


    以前科學家比較重視研究消極情緒，現在意識到了積極情緒的重要 性。積極情緒不僅僅是一種獎勵或者享受，還會讓你的行為和認知變得 更積極。


    再比如驕傲，一般人認為驕傲是不好的，會讓人自滿、犯錯，但驕 傲這個情緒也會讓你更願意跟別人互動，更願意分享自己的成果和經 驗，能讓人更瞭解你，有利於提高你的地位。這不是很好嗎?


    在認知方面，積極情緒最大的作用是讓我們更願意去探索陌生的、 新奇的、未知的事物。如果你很快樂、很熱情、有充分的安全感，你會 更敢於冒險，你會更有幽默感，你會更樂於助人。


    美國北卡羅來納大學的心理學教授芭芭拉·弗雷德里克森(Barbara Fredrickson) 有 個 「 拓 展 —— 構 建 理 論 」( broaden-and-build
    theory ) ①, 認為積極情緒能拓展注意力, 構建心理資源。


    當你處在消極情緒中的時候，比如受到威脅、充滿壓力，你會把自 己封閉起來，只關注眼前的威脅點。但當你處於積極情緒中，你的視野 就打開了。你會更容易發現身邊各種有意思的事情，注意到平時注意不
    到的細節。你的想象力會更活躍，你容易發現新的想法連接，激發創造 力。這就是「拓展」。


    積極情緒中的樂觀、安全感、感受到別人的支持和關愛，這些 都可以積累起來，成為心理資源。將來面對挑戰、遇到挫折和不幸 的時候，這個心理資源會讓你更勇敢、更有韌性。這就是「構
    建」。


    你的積極情緒還會影響周圍的人，別人會更願意跟你合作， 能帶來新的社會關係，這也是「構建」。


    這可能就是為什麼發達國家的研究①表明，創新型人才更多出 身於富裕家庭——他們既有餘閒，也有餘錢，從小見多識廣，不用 整天只想著考試。


    但是光有積極情緒好像也不行。有些人確實是財富自由了，家 裡有十幾套房能收租，但好像沒表現出什麼創造力。他們的注意力 確實被拓寬了，整天講究一些平常人不講究的東西，比如戴個手
    串，弄個「古玩」，吃個飯還要有一大堆規矩，等等，敏感度都用 在沒用的地方。這些人差的是什麼呢?


    是動機。這就是我要講的第二點,「動機強度」(motivational intensity)。動機強度高，意味著平白無故地、沒有任何人要求 你，你自己就非要去做一件事，而且非要做好，這是你自己對自己
    的驅動。


    積極情緒讓人把注意力拓寬，動機卻要求你把注意力收緊。


    一系列研究①表明，動機強度跟人的慾望和情緒波動有關。


    有個實驗是這樣的：研究者給一部分受試者看小貓的視頻，這能 帶來愉悅感，但是是一種低動機強度的愉悅感；另一組人看的則是美 味甜點的視頻，食物能調動人的慾望，提供高動機強度的愉悅感。


    看完視頻，受試者馬上接受認知測試。結果發現，那些看小貓視 頻的人，思路確實拓寬了，也的確更有創造性，但他們沒有強烈的動 機去做更多的思考；而那些看甜點視頻的人，會更願意為了解題去挖
    掘更多的細節。


    所以，有創造性是一回事，真願意去創造是另一回事。你光想到 一個好主意還不行，你還得有自驅力，把握這個稍縱即逝的時機，不 眠不休「爆肝」幾星期，趕緊把產品做出來上線！


    創造力和動機強度都高，才是真正的創新型人才。


    這樣看來，創新型人才的情緒最好經常在兩種模式中切換。平時 是積極模式，有個好心情，視野開闊，對新事物特別感興趣，總能發 現新機會，一邊還構建著心理資源和社會資源。但是一旦認準一個方
    向，那就要切換到高動機強度模式，把注意力和精力都聚焦在項目 上，非得完成不可。


    平時掃描新機會，找到新機會又能聚焦，這才是最理想的狀態。


    從腦神經科學的視角出發，這相當於是大腦在負責想象力和自發 性的「默認模式網絡」、負責評估信息重要性的「突顯網絡」以及負 責專注和執行的「中央執行網絡」之間快速、
    自如 地切換。這是創新型大腦的典型特徵。


    這樣的人既積極，又自由，還常常體會到積極和自由之間的 矛盾狀態。從外在看，他們情緒經常挺好，但不總是那麼好，有 時候會一驚一乍，會激動也會憤怒， 時而興高采烈，
    時而垂頭 喪氣，但絕不是一個木頭人或者工具人。


    這種一驚一乍的情緒波動，恰恰是社會地位高的特徵。研究 ①表明，同樣是女性，如果是高管，往往會經歷更多的情感和動機 之間的矛盾，總有些事她們特別想做又覺得不該做，她們又想行使
    權力又怕損害關係。基層女員工的情緒則是比較平穩的。


    快樂讓人積極，積極讓人開拓視野；寬容讓人自由， 自由讓 人自我驅動。


    要想培養出創新型人才，需要家庭和社會兩方面提供條件。


    家庭最好是富足的———至少讓孩子感覺不缺什麼東西， 日常情 緒都比較積極正面；社會則必須是寬容的，這意味著如果一個人 上頭了，認準一件事非得幹，你先別管好壞，儘量允許他折騰。


    相反，如果一切都以考試為中心，什麼都講究做「對」，講 究符合標準。這會讓學生處於動輒得咎、充滿威脅感的狀態， 始終處於壓力之下。考個95分還覺得自己不夠努力、不夠完美，
    說下次要考100分。真考了100分，又擔心下次能不能再考100 分。這樣的人視野必定是狹窄的。


    面對一個新事物，憂患者看到的是危險，快樂的人看到的是 機會。長期面臨各種考核的壓力，輕則讓人得胃潰瘍，重則讓人 產生習得性無助。


    AI式教育最大的問題是學生缺乏自主性。什麼都是別人要他 做，而不是他自己要做。機器天生就是被動的。人最不同於機器 的特點就是想要主動。從小受氣、在家和學校處處被動的人，等
    長大後真可以主動了，往往不會往正事上主動。


    孩子如此，成人也是如此。一天到晚摳摳搜搜、戰戰兢兢， 好不容易取得點成績還要保持低調，該快樂不敢快樂，永遠被人 管束，下班到點了都不敢走，真遇到機會也沒了動力，這樣的人
    能有多大出息?


    在有 AI的時代，我們要好好想想怎麼養育一個人，而不是 訓練一個人。


    創造型人才的特點是你可以養他，但是你不能控制他。早期 可以給他一定的指導，隨著成長，你要逐漸放開———自主權在 他自己手裡。要想指望他做出你意想不到的好事，就必須容忍他
    做出你意想不到的「壞」事———一些你不想讓他做，甚至原本 打算禁止他做的事。


    對 AI可以管，對人才只能「慣」。其實讓孩子自己折騰， 他也翻不了天，還會慢慢成熟起來。只有這樣你才能得到一個 完整的人。你必須遏制自己的控制慾。你只能等待。


    ### 问答


    #### 问 傑克遜


    看美味甜點視頻調動的慾望，不是種低層次的需求(生理需求) 嗎?而看小貓視頻對應的肯定比生理需求還高。為什麼相較之 下，反而低層次能調動高動機?


    #### 万维钢


    我們的大腦並不是一個非常理性的計算系統，而是一個生物系 統。正文裡講了，情緒改變的不僅僅是你對情緒事件的看法， 更是你彼時彼刻整體的認知模式，這會連帶影響你對其他事情
    的看法。


    就動機而言，關鍵影響因素大概是多巴胺。美味甜點會刺激人 的食慾，食慾調動想要吃東西的動機，這個調動過程需要用到 多巴胺。也就是說，美食視頻讓大腦產生了更多的多巴胺。而
    多巴胺一旦分泌出來，就不僅僅作用在「想吃東西」這個動機 上，它是一種通用的動機燃料，對其他事情也有促進作用。


    我還看過一個研究，性感美女的圖片能讓人在長遠利益和短期 利益之間更願意選擇短期利益。這大概就是多巴胺來了，我們 總想立刻馬上採取行動得到想要的東西。


    蒙洛迪諾(Mlodinow) 的《情緒》這本書中有個實驗。老鼠很 喜歡喝糖水，對糖水可以說是既喜歡，又想要。研究者阻斷了 老鼠大腦中的多巴胺，再把糖水放在它嘴邊強行給它舔，雖然
    它還是表現出享受的表情，還是很喜歡，但是它再也不會主動 去喝糖水了。阻斷了多巴胺，老鼠完全失去了對食物的動機— ——研究人員如果不強行餵它食物，它寧可餓死也不主動去吃
    東西。


    所以，動機本身就是一個生理需求。如果一個人太過「佛 系」，對什麼都無所謂，沒有動機，你會覺得他的生命力有 問題。如果AI突然有了動機，你會覺得它是不是要活了，你
    可能會感到威脅。


    #### 问 烏尚書


    在教育體制不變的情況下，如何平衡讓小孩自由發展和讓他 在現有體制下取得更好成績之間的矛盾呢?


    #### 万维钢


    這的確是個矛盾，但是這裡面有可操作的空間。我建議你考 慮三點。


    第一，準備考試這個活動，過了一定的線，就有邊際效益遞 減的特點。如果投入70%的精力已經可以考個80分或90分，而 就算100%全情投入也只能考85分或95分，那麼全情投入就是
    不值得，甚至可能是有害的。對考試只做有限的投入， 同時 儘量不耽誤生活中的其他追求，也許更容易考好。像有些中 學要求學生早上跑步還要捧本書，那純屬精神病。


    第二，家庭條件越好，考上好一點的大學還是差一點的大學 的區別就越不重要。


    第三，可能因為千年科舉文化的影響，很多人認為什麼好事 都是「考」出來的——考完大學考研，考完研考公， 當上公 務員也仍然時刻準備下一次考核……這是活在了扭曲的現實
    之中。真正的好東西應該是交換回來的：不要問社會能給自 己什麼，要問自己能給社會什麼。建立藐視考試、重視真本 領的心態，不但有利於成長，而且有利於考試。


    ## 03 专业：代议制民主和生成式 AI


    這一波AI浪潮的一個特點是「生成式」(generative), 也就是 「GPT」中的「G」。以前人們無論用 AI預測分子的化學性質還是下 棋打遊戲，都是讓AI完成非黑即白的任務，達成一個簡單結果。現在
    你無論用ChatGPT寫文章、編程, 還是用 Midjourney畫畫，都是在讓 AI幫你「生成」內容，收穫一片繁華景象。


