    # 第二章 当 AI 进入人类社会


    ## Blockbuster 加盟店模式与滞纳金


    `Blockbuster`是加盟店的模式。你在自己所在的城市開家店，它給你提供片源，你來運營出租業務。那你能不能猜一猜，加盟店最大的一筆收入來源是什麼?是滯納金。消費者租了錄像帶，如果沒有及時歸還，就要交一筆滯納金——滯納金佔到了加盟店總收入的
    40%。加盟店還有賣爆米花、糖果之類的收入。


    如果 `Blockbuster`學`Netflix`, 搞不收滯納金的郵寄 DVD 和流媒體點播模式，加盟店還能有收入嗎?


    這反映在公司戰略上，就導致了新舊兩種模式的權力鬥爭⋯⋯最後董事會強行命令 `Blockbuster`的高層恢復原有模式。


    你猜`Google`會不會發生類似的鬥爭?


    ## 新事物不足與商業模式顛覆


    保守派最有力的論點是新事物還不夠好。比如`iPhone`剛出來的時候有各種毛病，非常耗電，打字很不方便……可以說在生產力方面遠遠不如黑莓。正如現在 `ChatGPT`
    和 `Bing Chat` 也有各種不盡如人意之處。


    但關鍵是，`iPhone`代表了一個全新的商業模式，它給用戶提供了一種完全不同的使用手機的體驗。`Bing Chat`徹底改變了搜索這件事，哪怕現在有各種不足，只要這個方向成立，它就會越做越好。


    `iPhone`用了 4 年時間才真正影響了傳統手機的銷量。我們有理由相信，`Bing Chat`這種搜索模式，恐怕用更短的時間就會影響到`Google`。以後搜索引擎該怎麼賺錢呢?是改成收費嗎?是強行在對話中加廣告嗎?沒人知道。但我們知道，肯定要變了。


    ## AI 的先發優勢、護城河與飛輪效應


    不過 `Google`這樣的大公司搞 AI 還是有先發優勢的。用商業語言來說，要做 AI 業務，你需要達到一個「最低啟動門檻」，你需要「護城河」，你需要形成「飛輪效應」。


    AI 的啟動門檻是數據。預測需要數據，你需要先準備好達到最小有效規模的數據量。


    在沒有 AI 的時代，數據量並不是很重要。比如早期的互聯網上曾經有幾十家公司都在做搜索引擎，你感覺用哪個都差不多。那時候你不太在意搜索結果是否特別匹配你的要求，可能第
    1 頁顯示的 10 個網頁都不是你想要的，沒關係，你可以翻到第 2 頁。要想得到更精確的結果，搜索引擎必須結合 AI，但那是後話。


    可自動駕駛汽車就是另一個故事了。我們對自動駕駛汽車出錯的容忍度很低，這就要求提供自動駕駛業務的公司必須把 AI 先練好了。那就一定得事先積累很多數據才行。


    不過，如果不是做自動駕駛，現在網上的數據非常豐富，對很多創業公司來說，蒐集數據不是太大的問題。比如有一家用 AI 幫助科學家搞醫藥開發的公司叫 `BenchSci`，它就是用機器學習調研公開發表的學術論文，告訴科學家研究某一種藥物需要準備什麼樣的生物試劑，以此大大縮短研發週期。


    到目前為止，它的業務都發展得很好。但你可能會問，既然數據都是公開的，如果另一家公司也做這樣的業務，它怎麼辦呢?


    這取決於它有沒有護城河。對 AI 公司來說，最好的護城河就是從用戶的反饋中學習。


    比如 `Google`搜索。你輸入幾個關鍵詞, `Google` 謀求儘可能把你想要的那個網頁排在首頁前列，最好就是第一個結果。那 `Google` 是 如何
    決定 結果 排序 的 呢 ? 以前是使用一個排名算法 (`PageRank`)，現在則是用深度學習 AI 結合你的使用習慣，預測你最想要的結果。而這個 AI
    特別擅長從你的反饋中學習。


    你在 `Google`上的每一次點擊———點到哪個網頁、點什麼廣告，都在幫助`Google`改進它的預測模型。`Google`的搜索結果越來越準，你用著越來越得心應手，它給你的鏈接正好是你需要的，它顯示的廣告正好是你感興趣的，廣告商也非常明白這些⋯⋯這就是為什麼`Google`在搜索引擎的市場份額是難以撼動的。


    有先發優勢又有護城河，如果再趕上是一門市場不斷擴大的業務，產品能從用戶反饋中持續改進，那就等於擁有了增長飛輪。


    科技是活的東西，科技是生態的產物。歷史上曾經有很多家商業飛機製造商，現在國際上製造大型客機的主要是波音和空客兩家。它們在不停地改進，從每一次飛行事故、每一個問題中學習，就這樣積累了很多年。現在中國也在造大飛機，也許我們的確可以在某個橫截面上達到比較高的技術水平，但是我們沒有那麼多年的改進經驗，我們的正反饋飛輪還沒有搭建起來，可以想見我們會面臨很多困難。


    這就是為什麼自動駕駛的門檻那麼高，現在仍然有這麼多公司在不惜血本地投資。比如通用汽車，它在自動駕駛項目上一下子就投了 10 億美元。這是因為一旦「搶跑」成功，飛輪展開，別人就很難趕上了。現在是難得的窗口期。如果將來有一家公司的自動駕駛系統被證明是最好的，就很可能會出現像搜索引擎業務中`Google`一家獨大那樣的局面，那時誰再想突破競爭就很難辦了。


    你每一次跟`ChatGPT` 對話，都在幫助 AI 更好地理解用戶。目前看，`Google`等大公司也許可以迅速聚集起超強的算力，但是因為 `OpenAI`已經率先推出`ChatGPT`，它從用戶反饋中學到了更多，它的正反饋飛輪已經開啟，它可能會繼續保持領先。


    ![](img/index-97_1.jpg)


    中國某些公司在 AI 方面雖然有很多積累，也有應用經驗，但技術上畢竟不是最強的，那它們的機會在哪兒?這就引出了另一個商業邏輯———差異化。


    有時候只要你能越過一定的門檻，好到一定的程度，「好不好」就難以比較了。可口可樂跟百事可樂哪個好?奔馳跟寶馬哪個好?它們有不同的風格，能吸引到不同的人群。


    那我們可以設想，同樣是像 GPT 這樣的大語言模型，不同的公司也會滿足差異化的需求：


    有些公司希望效率高，能夠快速準確回答用戶問題就好；

    有些公司希望能在聊天對話中推銷產品；

    有些公司希望機器人更加人性化，能化解用戶的憤怒，能讓用戶感覺好……


    也許不同的模型會專注於不同的需求。像前面提到的`Claude`模型, 據說它在小說創作方面就比`GPT-3.5` 要好。2024 年 3 月, `Anthropic`
    推出了 `Claude 3 Opus`模型, 各方評測認為智能超過了`GPT-4`。


    最簡單的差異化是本地化。比如黑色素瘤檢測。歐洲的 AI 選用的都是歐洲人的數據，對淺色皮膚的判斷就會更準確。那麼，如果中國的某個公司專門做一個針對亞洲人的黑色素瘤檢測
    AI，就非常有價值。


    再比如，中國的交通狀況———包括信號系統、車流和行人習慣———跟美國、歐洲都很不一樣，美國公司的 AI 不可能拿到中國直接用，那麼專門訓練一箇中國自己的自動駕駛
    AI 就是必需的。


    這樣看來，`OpenAI`再厲害， 中國也需要，也容得下， 自己的大模型。


    ![](img/index-98_1.jpg)


    這一節說了幾個互相競爭的趨勢：


    AI 商業有先發優勢，但同時 AI 又是對市場現有霸主的顛覆；

    AI 因為本質上還是軟件，邊際成本幾乎為零，有勝者通吃效應，但同時 AI 又有差異化的需求。


    這是一個難得的老牌大公司和新興小公司、強者和弱者都有機會的局面。下游每天都在湧現新的 AI 應用，上游各路人馬都在訓練自己的大語言模型。目前只有幾家公司表現出先發優勢，但是我們不知道誰有真正的護城河，誰能建立確定的增長飛輪。這是一個史上罕見的「秦失其鹿，天下共逐之」的局面。


    這將是一個非常短暫的窗口期，預計很快就會有「高材疾足者先得」。


    而我感覺現在中國已經慢了半拍。此刻，`OpenAI`的`API`在中國用不了，國產大模型性能還比較差，國內的 AI 應用還沒有爆發起來，搞不好就此失了先手。


    我特別想提醒的一點是，現在中文已經不再是一個障礙了。`OpenAI` 沒有使用很多中文語料訓練，但是 `ChatGPT` 可以講很地道的中文，也許比國產大模型更地道。中國公司必須從別的方面考慮差異化……


    ## 问答


    ### 问 身鬥小民


    這一次`ChatGPT`的大火讓很多人都在反思，為什麼顛覆式創新總髮生在美國?在科技創新的道路上，我們該如何避免這樣的 事情再次發生呢?


    #### 萬維鋼


    如果你把國家想象成一個人，你會猜測他到底做對了或者做錯 了什麼，才帶來這樣的結果。但一個國家不是一個人，很多事 情不是出於意願，而是出於演化。


    中美創新的差異很多，就 GPT 這次突破而言，我覺得最主要的 因素在於文化和發展階段。


    單說一個小側面。GPT 最讓人震撼的一個能力是， 它會根據你 的描述編程。特別是`GPT-4`出來以後，可以說現在人人都可以 編程，以後編程這件事可以主要依靠自然語言完成。那為什麼
    GPT 有那麼強的編程能力呢? 因為`OpenAI`從`GitHub`網站獲取了 大 量 的 優 質 訓 練 素 材 ——— 是 微 軟 先 收 購 了 `GitHub`
    ， 又 把 `GitHub`的代碼數據交給`OpenAI`的。


    `GitHub`是個程序員社區，程序員們在上面分享代碼，互相回答 問題，圍觀高手做項目，切磋編程技藝。


    請注意，程序員們在`GitHub`上做這些事情不會獲得任何收入， 分享是自由和免費的。程序員們也沒有想什麼「我要為將來美 國擁有全世界最厲害的 AI 做貢獻」，他們只是出於興趣。


    `GitHub`不是特例。在它之前還有`GNU`, 有`Linux`這樣的自由 軟件社區，也是大家無私分享。而且這些人還特別強調「版 權」，但他們說的版權不是為了保證自己賺錢，而是為了保
    證軟件一直是自由的——你用我代碼可以，但是你必須繼承 我的版權，而我的版權是為了確保這些代碼繼續是自由的。


    這種自由文化不是從天上掉到硅谷的，它來自更早的嬉皮士 文化。


    簡單說，這些人寫程序既不僅僅是為了謀生，也不是為了什 麼建設美國，而是像畫畫和做音樂一樣，把它當作一門藝 術，一種精神追求。甚至早在 20 世紀 70 年代，就有很多程序
    員信奉「計算機是有生命的」這樣的精神信條。


    有些人搞技術更多的是享受技術本身的魅力，有些人搞技術 是謀生。那你說誰更有可能做出突破性的、意料之外的發現?


    這不全是金錢激勵的問題，也不是願不願意奉獻的問題，這 是社會發展階段的問題。


    ### 问 周毅


    `ChatGPT`在國內無法直接使用，如果長時間沒有一個同樣強大 的國產語言模型填補空白，那麼國內的 AI 元年是否就推遲了? 而按照 AI 的進化速度，會不會造成全面的落後，並且被
    AI 形 成的網絡邊緣化?會不會導致我們在 AI 的未來競爭中被全面壓 制?


    #### 萬維鋼


    `OpenAI`已經向包括印度在內的世界多數國家及地區的用戶開 放了`ChatGPT`，但是還沒有向中國內地用戶開放。這個局面 只對一些企業是好事，對中國是壞事。


    百度發佈了自家的大型語言模型，叫文心一言。截至本書出版的 時刻，它的智能水平還不如`GPT-4`。如果非得等百度做好了再用 AI， 中國的 AI 應用就會落後。挽弓當挽強，用箭當用長，我認
    為中國人民配得上最好的 AI。


    但我並不認為中國會在 AI 競爭中被全面壓制。你先看看這兩張 圖。 (圖 2-3、 圖 2-4)


    ![](img/index-102_1.jpg)


    你看看這上面有多少中國人的名字。這是一個普遍現象，硅 谷任何一個有關 AI 的會議上都有很多很多中國人，可以說當 今大模型人才的半壁江山是中國人。`GPT`出來以後，
    網上各 種流行應用也有很多是中國人做的，只不過他們就職於美國 的微軟、`Google`、`斯坦福大學`等。


    所以，如果中國在 AI 上落後，絕對不是因為中國人不行。既 然中國人很行，那我們就有理由相信，我們在 AI 上不會永遠 落後。


    ## 04 社会：被 AI「接管」后的忧患


    2023 年 2 月 24 日, `OpenAI`發佈了一則聲明, 叫《對`AGI` 及 以後的規劃》(Planning for AGI and beyond)①。`AGI`
    不是我們 現在用的這些科研、畫畫或者導航的 AI，而是「通用人工智能」， 是不但至少要有人的水平，而且什麼認知任務都可以乾的智能。


    `AGI`以往只存在於科幻小說之中。我曾經以為我們這代人有生 之年都看不到`AGI`，但`OpenAI`已經規劃好了路線圖。我聽到一些傳 聞，`AGI`有可能在
    2026 年，甚至 2025 年就會到來。


    所以這絕對是一個歷史時刻。但是請注意，`OpenAI`這份聲明是 個很特殊的文件，我們從來沒見過任何一家科技公司是這樣說自家 技術的———整個文件的重點不是吹噓，而是一種憂患意識；它憂
    患的既不是自家公司，也不是 `AGI`技術，它憂患的是人類怎麼接受 `AGI`。


    `OpenAI`說：「`AGI`有可能給每個人帶來令人難以置信的新能 力；我們可以想象一個世界，所有人都可以獲得幾乎任何認知任務 的幫助，為人類的智慧和創造力提供一個巨大的力量倍增器。」接
    下來，文件並沒有繼續說`AGI`有多厲害，而是反覆強調要「逐漸過 渡」：「讓人們、政策制定者和機構有時間瞭解 正在發生的事情，親自體驗這些系統的好處和壞處，調整我們的
    經濟，並將監管落實到位。」並且說它部署新模型會「比許多用 戶希望得更謹慎」。


    這等於是說，通往 `AGI`的技術已經具備，但是為了讓人類有 個適應過程，`OpenAI`正在刻意壓著，儘量慢點出。


    人類需要一個適應過程，這也是這一篇聲明的主題。基辛格 等人在《人工智能時代與人類未來》這本書中表達的也是這個意 思，AI 對人類有一定的危險。


    想象你有個特別厲害的助手，名叫龍傲天。他方方面面都比 你強，你連思維都跟他不在一個層面上。你常常不理解他為什麼 要那樣決定，但是事實證明他替你做的每一個決定都比你自己原
    本想的更好。久而久之，你就習慣了，你事事都依賴他。


    龍傲天的所有表現都證明，他對你是忠誠的。但是請問劉 波，你真的完全信任他嗎?


    ![](img/index-105_1.jpg)


    其實我們已經用 AI 很長時間了。像淘寶、滴滴、抖音這些互聯網平臺都有幾億甚至幾十億的用戶，用人力管理這麼多用戶是 不可能的，它們都在用 AI。給用戶推薦商品、安排外賣騎手接
    單、對擁擠時段打車進行加價，包括對不當發言刪帖，這些決定 已經要麼全部，要麼主要是 AI 做的。


    而問題隨之而來。如果是某公司的某個員工的操作傷害了你 的利益，你大可抗議，要求他負責；可如果你感到受到了傷害， 公司卻說那是 AI 做的，連我們自己都不理解，你什麼感受?


    現在 AI 的智慧是難以用人的理性解釋的。為什麼抖音向你推 薦了這條視頻?你質問抖音，抖音自己都不知道。也許抖音設定的 價值觀影響了 AI 的算法，也許抖音根本就不可能完全設定
    AI 的 價值觀。


    社會和民眾都要求對 AI 算法進行審查，可是怎麼審查?這些問 題都在探索之中。


    就在我們連簡單應用都沒想明白的同時，AI 正在各個新領域突 飛猛進。憑藉 `AlphaGo`出名的`DeepMind`已經被`Google`收購，它在過 去幾年取得了如下成就①：


    推出 `AlphaStar`，它在《星際爭霸Ⅱ》這樣一個規則複雜的、 開放式的遊戲環境中，打到了最高水平；

    推出 `AlphaFold`，它能夠預測蛋白質的形狀，改寫了領域內生 物學的研究方式；

    醫學方面， 用 AI 識別 X 射線圖片， 幫助診斷乳腺癌，對急性 腎臟損傷的診斷比主流方法提前了 48 小時，對老年人眼睛裡的老年 性黃斑變性做出了提前好幾個月的預測；

    推出兩個天氣預報模型， 一個叫 `DGMR`， 用於預測一個地區 90 分鐘內會不會下雨, 一個叫 `GraphCast`, 能預測 10 天內的天氣， 兩個模型的精確度都顯著高於現有的天氣預報；

    它還用 AI 給 `Google`的數據中心重新設計了一套冷卻系統，能 節省 30%的能源；

    …


    這些成就的最可怕之處不是 `DeepMind` 一齣手就顛覆了傳統做 法，而在於它們不是集中在某個特定領域，是大殺四方。到底還有 什麼領域是 `DeepMind`
    不能顛覆的?


    這 些 還 只 是 `DeepMind` 能 做 的 事 情 中 的 一 小 部 分 , 而 `DeepMind` 只是 `Google`的一個部門。


    AI 全面接管科研就在眼前。


    如果什麼科研項目都能交給 AI 暴力破解，那人類所謂的科學 精神、創造性，又怎麼體現呢?


    如果 AI 做出來的科研結果人類不但做不出來，而且連理解都 無法理解，我們又何以自處呢?


    ![](img/index-107_1.jpg)


    會不會被 AI 搶工作都是小事了，現在的大問題是 AI 對人類社 會的統治力———以及可能的破壞力。


    華爾街搞量化交易的公司已經在用 AI 直接做股票交易了，效果 很好。可是 AI 交易是以高頻進行的，在沒有任何人意識到之前， 就有可能形成一個湍流，乃至引發市場崩潰。這是人類交易員犯不
    出來的錯誤。


    美軍在測試中用 AI 操控戰鬥機，AI 的表現已經超過了人類飛 行員。如果你的對手用 AI，你就不得不用 AI。那如果大家都 用 AI 操控武器，乃至進行戰術級的指揮，萬一出了擦槍走火的事兒，算
    誰的呢?


    再進一步，根據現有的研究案例，我完全相信，如果我們把司法判 決權完全交給 AI，社會絕對會比現在公正。大多數人會服氣，但是有些 人輸了官司會要求一個解釋。如果
    AI 說只是我的算法判斷你再次犯罪 的概率有點高，可我也說不清具體因為啥高，你能接受嗎?


    理性人需要解釋。有解釋才有意義，有說法才有正義。如果沒有解 釋，也許……以後我們都習慣不再要求解釋。


    我們可能會把 AI 的決定當作命運的安排。


    小李說：「我沒被大學錄取。我的高考成績比小王高，可是小王被 錄取了。一定是 AI 認為我的綜合素質不夠高 ⋯ ⋯ 我不抱怨, 因為 AI 自有安排! 」


    老 李 說 ： 「 是 的 ， 孩 子 ， 繼 續 努 力 ！ 我 聽 人 說 了 ， AI 愛 笨 小 孩! 」


    你能接受這樣的社會嗎?


    AI 到底是個什麼東西?現階段，它已經不是一個普通工具，而是一 個「法寶」。你需要像修仙小說那樣，耗費巨量的資源去煉製它。


    據摩根士丹利分析①，正在訓練之中的`GPT-5`用了 25000 塊 `英偉達`最新的`GPU`(圖形處理器)。這種 `GPU` 每塊價值 1 萬美元， 這就是
    2.5 億美元了。再考慮研發、電費、喂語料的費用，這不


