    # 第三章 置身智能，你更像你


    ## 01 決策：AI的預測+人的判斷


    人到底有什麼能力是不可被 `AI`替代的?每個人都需要思考這個問題。


    前文提過的《權力與預測》這本書中有一個洞見，我認為有可能就是 `AI`和人分工的指導原則。簡單說，就是雙方共同做出決策，其中`AI`負責預測，人負責判斷。


    要理解這一點，我們先看一個真實的案例。美國網約車公司`Uber`(優步) 一直在測試自動駕駛汽車。2018年, `Uber`的自動駕駛汽車在亞利桑那州撞死了一個行人，引起了激烈的討論。


    仔細分析這個事故，我們會發現，在撞擊前6秒，`AI`已經看到了前方有一個未知物體。它沒有立即做出剎車的決定，因為它判斷那個物體是人的概率非常低———雖然概率並不是0。


    `AI`有個判斷閾值，只有在前方物體是人的概率超過一定數值的情況下，它才會剎車。撞擊前6秒，概率沒有超過閾值；等到終於看清是人的時候，剎車已經晚了。


    我們把剎車決定分為「預測」和「判斷」兩步。`AI`的預測也許不夠準，但是它已經預測出這個物體可能是一個人，它給出了不為0的概率。接下來的問題出在了判斷上——在這個概率上應不應該踩剎車，是這個判斷導致了悲劇。


    `Uber`的 `AI` 用的是閾值判斷法，這可以理解，如果對前方任何一個「是人的概率不為0」的物體，`AI`都選擇剎車，它就會在路上不停地踩剎車，這車就沒法開了。當然你可以認為這個閾值不合理，但是這裡總需要一個判斷。


    請注意，正因為現在有了 `AI`，我們才可以做這樣的分析。以前發生過那麼多人類司機撞人的事件，從來沒有人去分析那個司機是犯了預測錯誤還是判斷錯誤。但這種分析其實是完全合理的，因為兩種錯誤性質很不一樣。


    請問這位司機，你是根本沒看見前方有人呢，還是已經感覺到前方物體有可能是人，但是你感覺那個可能性並不是很大，又因為趕時間，你覺得那麼小的概率可以接受，就開過去了?


    你犯的到底是預測錯誤，還是判斷錯誤?


    決策=預測+判斷。


    預測，是告訴你發生各種結果的概率是多少；判斷，是對於每一種結果，你在多大程度上願意接受。


    關於如何基於預測的概率做決策，有本書裡講了個方法，蒂姆 · 帕 爾 默 (`Tim Palmer`) 在 `The Primacy of Doubt`( 我
    翻 譯 為 《首要懷疑》)裡舉了個例子。假設你週末有個戶外聚會，要不要為此租個帳篷防止下雨，這是你的決策。天氣預報告訴你那天下雨的概率是30%，這是預測。面對這樣一個概率，下雨的損失是不是可以接受的，這是你的判斷。


    通常來說，只要採取行動的代價(帳篷的租金)小於損失(下雨會給你帶來的麻煩)和概率的乘積，就應該採取行動，租個帳篷防止淋雨。但是在這一節的視角下，請注意，這個「應該」，應該理解成是對你的建議。


    是否採取行動的拍板權還是在你手裡，因為那個損失最終是由你來承受的。`AI`不會承受損失，用公式給你提建議的人也不會承受損失。在場來賓———是英國女王也好，是你岳母也罷——淋雨這件事是大是小，不是
    `AI`所能知道的，那其實是你自己的主觀判斷。


    `AI`很擅長預測天氣概率，但是判斷一個天氣狀況帶來的後果，需要更多具體的，也許只有你自己才知道的信息，所以做判斷的應該是你，而不是 `AI`。


    `AI`時代的決策=`AI`的預測+人的判斷。


    也就是說，我們應該讓預測和判斷脫鉤。以前所有的決策都是人負責預測，人負責判斷，現在則應該是 `AI`負責預測，人負責判斷。(圖3-1)


    我們承認 `AI` 比人聰明，但是真正承受風險、體驗後果的是人，所以最終拍板判斷的必須是人。如果你是一個企業主，聘請了一位非常厲害的職業經理人做你公司的CEO，他在所有方面的能力都超過你，那你能把決策權都交給他嗎?不能。因為公司是你的，萬一賠錢賠的是你的錢。同樣地，`AI`再厲害，也只能讓人類醫生承擔醫療責任，讓人類警察行使執法權，讓人類領導者掌握核按鈕。只有人能以血肉之軀承擔後果，我們只能向人問責。


    預測是客觀的，判斷是主觀的。`AI`不能僭越人的判斷，人也不應該專斷`AI`的預測。`AI`與人各安其位，分工明確。


    如何實施這個分工呢?


    一個方法是，人為給`AI`設定一個自動判斷門檻。比如自動駕駛汽車，我們可以規定，當`AI`預測前方物體是人的概率高於0.01%———或者0.00001%也行,
    反正得有個不為0的數值———的時候就必須踩剎車。這個判斷標準，這條線，肯定不是 `AI`自己規定的，而是人事先設定的。你可以把這條線編程到 `AI`之中，但是下達那條編程指令的必須得是人，因為只有人能判斷人命的價值。對`AI`來說，人命的價值是無法用客觀方法估算的。


    其實我們已經在用這種判斷了。以前你到商店買東西用的是現金，那個現金是真鈔還是假鈔，得由收銀員自己預測、自己判斷。現在你刷信用卡，那個信用卡是真卡還是假卡，不是由收銀員決策，而是由信用卡聯網系統根據算法來預測和判斷的。算法會先評估這張卡是假卡的概率有多大(預測)，再看看那個概率是否高於某一條線(判斷)，然後決定是否拒收。那條線不是任何
    `AI`算出來的，而是事先由某個人類組成的委員會劃定的。因為線劃得太低得罪客戶的是人，線劃得太高承擔損失的也是人。


    未來我們會面對各種各樣類似的事情，《權力與預測》這本書建議，這樣的判斷最好像評估一種新藥是否可以上市一樣，由一個像`FDA` 這樣的機構來執行。


    另一個方法是，把判斷量化成錢。


    你租了一輛車，要去一個比較遠的地方，有兩條路線可選。第一條路線比較直，你老老實實開車就行，但路上沒什麼風景。第二條路線會經過一個風景區，對你來說是一種享受，但是風景區裡有行人，會增加出事故的概率。如果
    `AI`直接跟你說兩條路出事故的概率有多大，你可能還是不好判斷。


    更方便的做法是，`AI`告訴你，走風景區那條路，租車的保險費比走第一條路貴1塊錢。這1塊錢的保險費代表 `AI`對兩條路風險差異的預測。


    現在判斷交給你。如果你認為風景對你的重要性超過1塊錢，那你就走風景區；如果你對風景沒有那麼高的興趣，你就省下1塊錢。


    你看，`AI`無須瞭解你，也不可能瞭解你———是你在這1塊錢和風景之間的選擇，揭示了你的偏好。在經濟學上，這叫作「顯示性偏好」(`Revealed Preference`):
    人的很多偏好本來是說不清的，但是一跟錢掛鉤就能說清了。


    預測跟判斷脫鉤，對人是一種賦能。


    以前如果你想去開出租車，可不是會開車就行。你得先學認路，你得知道這個城市中從任意 A 點到任意B點的最短路線是什麼 (就是你得會預測)，才能開好出租車。現在
    `AI`接管了預測路線的事，你只要會開車就可以去開網約車了。


    有了 `AI`，人會判斷就會決策。但這並不意味決策很容易，因為判斷有判斷的學問。


    生活中更多的判斷既不是由委員會劃線也不能被量化成金錢，而是必須由個人對具體情況進行具體分析。這個結果對你來說到底有多好，或者到底有多壞，你到底能不能承受，該怎麼判斷呢?


    有的可能是你通過讀書或者跟別人學的，比如你聽說過被燒紅的烙鐵燙會很疼，你就會願意以很高的代價避免被燙。但是聽說不如親歷，只有真的被燙過，你才能知道有多疼。判斷，有很大的主觀成分。


    而判斷這個能力正在變得越來越重要。美國的一個統計顯示①，1960年只有5%的工作需要決策技能，到2015年已經有30%的工作需要決策技能，而且還都是高薪崗位。


    ① `David J. Deming`, The Growing Importance of Decision-Making on the Job, working
    paper 28733, National Bureau of Economic Research, Cambridge, MA (2021).


    只有人知道自己有多疼，所以人不是機器。而判斷力和隨之而來的決策力，本質上是一種權力——`AI`沒有權力。


    當`AI`接管了預測之後，決策權力在社會層面和公司組織層面的行使就成了一個新問題。


    有個例子。因為知道了鉛對人體有害，從1986年開始，美國政府禁止新建築物使用含鉛的飲用水管。可是很多舊建築物的水管都含鉛，這就需要對舊水管進行改造。但是改造非常費錢費力，舊水管又不都含鉛，得先把水管挖出來才能知道，那先挖誰家的呢?


    2017 年 ， 密 歇 根 大 學 的 兩 個 教 授 搞 了 一 個 `AI` ， 叫 `BlueConduit`, 它能以80% 的準確率預測哪家的水管含鉛。密歇根州的弗林特市使用了這個
    `AI`。一開始都挺好，市政府安排施工隊根據`AI`的預測給各個居民家換水管。


    工程這樣進行了一段時間之後，有些居民不幹了。他們質疑說，為什麼我家鄰居水管換了，我家的卻沒換?特別是富裕區的居民會說，為什麼先去換那些貧困地區的水管，難道不是我們交的稅更多嗎?


    收到這些抱怨，弗林特市的市長乾脆決定不聽 `AI`的了，挨家挨戶慢慢換。結果這樣一來，決策準確率一下子從 80%降到了 15%……又過了一段時間，美國法院推出一個法案，規定換水管這個決策必須先聽`AI`的預測，決策準確率才又提高回來。(圖3-2)


    這件事的道理是，`AI`改變了決策權。沒有 `AI`預測的話，只有政府能預測和判斷誰家水管應該先換，決策權完全把持在政客手裡；有了 `AI`預測，老百姓或者社區都可以自己判斷，尤其美國的司法系統還可以直接發話，政客就不再說了算了。


    決策權到底應該屬於誰呢?從道德角度應該是，誰承擔決策的後果，決策權就應該屬於誰。而從經濟學角度來說，則是誰決策能讓整個組織的效率最高，就應該屬於誰。這兩個角度並不一定矛盾，畢竟蛋糕做大了才好分。


    以前預測和判斷不分的時侯，決策權往往應該交給一線人員，因為他們直接接觸關鍵信息，他們的預測最準確———正所謂「讓聽得見炮火的人指揮」。


    現在 `AI`接管了預測，人的決策就是判斷。這時候可以考慮，讓那些個人利益跟公司利益最相關的人決策，或者讓受這個決策影響最大的人決策，或者讓最能理解決策後果的人決策……這些都意味著組織的變革。


    變革還意味著以前的預測者現在要轉型為判斷者，或者解釋者。


    比如，以前天氣預報機構的職責是提高預測的準確度，現在有了 `AI`，它們的主要職責也許就變成向公眾和政府機構解釋預測結果。`AI`說下週有5%的可能性會發生龍捲風，政府官員不懂這5%代表多大損失，也許你這個氣象學家能給解釋一下。未來的氣象臺可能更多的是提供人性化服務，比如建議老百姓明天怎麼制訂出行計劃，而不僅僅是預報下雪概率。


    再比如，以前放射科醫生最主要的任務是看圖預測病情。現在 `AI`看圖的能力已經超過了人類，那放射科醫生就得琢磨別的服務，也許是向病人解釋病情，也許放射科就不應該繼續存在……


    前文講過，把決策權交給 `AI`會讓人很難受。`AI`再厲害，我們也不願意把它奉為神靈——這一節說的正是讓`AI`最好老老實實扮演助手或者祭司的角色，拍板權還是應該在人的手裡。在我看來，這個分工非常合理，希望這能夠帶給你些許安慰。


    ## 問答


    ### ⑲ 馮焯林


    想問萬Sir, 對於Data Science (數據科學) 以及它和`AI`的關係有什麼看法?如果目前你的兒子就要選修碩士的話，你怎麼建議?


    ### 萬維鋼


    我大概會建議他選數據科學。我想給你講一個正在進行中的故事。


    這一波以`GPT-4`為代表的大語言模型浪潮，有一個副產品———它殺死了一門叫作「自然語言處理」 (`NLP`)的學科。


    很多大學都有`NLP`這個專業，很多大公司有專門的`NLP`研發團隊。`NLP`是計算機科學、`AI`和人類語言學的交叉學科，此前一直被認為是實現通用人工智能的指望。`NLP`研究的是如何讓機器理解人的語言，它的應用範圍包括機器翻譯、語音識別、搜索引擎、智能助手等等。這麼多年以來，
    `NLP`領域在無數人的努力之下，取得了很多成就。


    但是，現在那些都已經沒有意義了。`GPT`用的是完全不同的解決思路———無監督學習。`Transformer`架構和2022年前後發生的「開悟」 「湧現」已經自動把`NLP`想要解決而未能完美解決的問題都給完美解決了。原來`AI`根本就不需要按照人類幫它尋找的語言規則去學習語言，原來機器能自動找到各種「我們知道」以及「我們不知道」的語言規律。翻譯、語音識別也好，搜索引擎、智能助手也罷，都是`GPT`的原生功能。`GPT`還自動掌握了一大堆包括邏輯推理、小樣本學習、自動分類等功能，還有我們沒意識到的功能。


    `GPT`對比於自然語言處理, 就如同`AlphaGo Zero`對比於人類棋手總結的圍棋套路。事實證明，先靠人類總結規律再教給計算機是個笨辦法，是讓人的思維拖累了計算機的思維。原來讓計算機直接暴力破解才是最根本、最快、最好的辦法。


    人類棋手還可以繼續學圍棋套路，畢竟圍棋這個遊戲本身就很有意思。可是`NLP`研發人員、教授和學生們該何去何從呢?網絡社區裡已經在瀰漫悲觀情緒。有些從業者最初的態度是否認———就如同絕症患者最初的反應一樣……可是`GPT-4`一出來，局面已經非常明顯了。

