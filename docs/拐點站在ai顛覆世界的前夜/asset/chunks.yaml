    ## 第一章 ChatGPT 究竟是什麼


    我聽說有人做實驗，讓一些真正的科學家和`ChatGPT`共同起草了若干份研究經費申請書，又邀請了一批真正的專家對這些申請書做評價。結果專家們發現，AI起草的申請書，想法的新穎度明顯高於人類科學家的。


    所以，如果我還在搞科研，我會把研究領域近期的論文餵給`ChatGPT`，讓它提幾個研究選題，但是我絕不會認為AI可以自行搞科研。


    ## 底牌和命門：AI能力的侷限


    我們已經知道大語言模型有「開悟」，有「湧現」，有思維鏈，所以才有現在如此神奇的各種功能。但我們還需要進一步理解`GPT`：它跟人腦到底如何對比？它有什麼限制？有沒有它不擅長的東西？


    身處歷史變局時刻，`GPT`的進展非常快。各種產品、服務、學術論文層出不窮，進步以天來計算，一個月以前的認識都可能過時了。


    不過有一個神人，他的觀點和作品並不會過時。他在《這就是`ChatGPT`》( `What Is ChatGPT Doing…and Why Does It
    Work?` )①這本書裡講的是數學原理和哲學思辨，而不是`GPT`的一般功能——數學和哲學是不會過時的。


    這個神人就是——斯蒂芬·沃爾夫勒姆 (`Stephen Wolfram`)。他不僅發明了 `Mathematica` 軟件，還做了 `WolframAlpha`
    網站，搞了一個計算語言叫 `Wolfram語言`，他甚至對整個物理學提出了全新的看法。你要讓我列舉當今世界上活著的最聰明的三個人，那其中必定有沃爾夫勒姆——而且我還不敢肯定另外兩個是誰。


    `GPT` 和目前市面上的所有 AI，本質上都是神經網絡。沃爾夫勒姆關注神經網絡已經40多年了，他早在1983年就自己編程研究過神經網絡，他最近用`GPT`做了很多研究。這本書得到了`OpenAI`的CEO
    山姆·阿爾特曼 (`Sam Altman`) 的背書，說這是他見過的對`GPT` 最好的解釋。


    事實上，沃爾夫勒姆不但講清楚了`GPT`的底牌和命門，還提出了一個可謂驚世駭俗的洞見。


    ![](index-50_1.jpg)


    我先給你演示個小案例，加深你對 `GPT` 的認識。


    我讓 `GPT-4` 做了個最簡單的計算題，純粹是我隨手打的：


    `1231×434523+323×34636`等於多少？ `GPT-4`煞有其事地算了一番，給出的結果是`546106021`。( 圖1-12)


    ![](index-50_2.jpg)


    `1231*434523+323*34636`


    ![](index-50_3.jpg)


    根據您提供的數學表達式，我們可以計算出結果如下：


    `1231*434523 = 534922713`


    `323*34636 =11183308`


    接下來，將這兩個結果相加：


    `534922713+11183308= 546106021`


    因此, `1231*434523+323*34636=546106021`。


    圖 1-12


    但是你隨便找個計算器算算，正確答案應該是`546085241`。(圖1-13)


    `(1231*434523)+(323*34636)=`


    `546085241`


    圖 1-13


    這是怎麼回事呢？`GPT-4`有強大的數學推理能力，我讓它做奧數題，它有時候都能做對，怎麼這麼簡單的計算題，它做不對呢？


    當然它也不是什麼計算都不會。你要讓它算個 `25+48`，它肯定能做對。問題是，數字特別長的計算，它就不行了。


    根本原因在於，`GPT`是個語言模型。它是用人的語言訓練出來的，它的思維很像人的大腦——而人的大腦是不太擅長算這種數學題的。讓你算，你不也得用計算器嘛！


    `GPT` 更像人腦，而不像一般的計算機程序。


    ![](index-51_1.jpg)


    在最本質上，語言模型的功能無非是對文本進行「合理的延續」，說白了就是預測下一個詞該說什麼。


    沃爾夫勒姆舉了個例子, 比如「The best thing about AI is its ability to… ( AI最棒的地方在於它具有⋯ ⋯ 的能力)」
    這句話的下一個詞是什麼？


    模型根據它所學到的文本中的概率分佈，找到5個候選詞：


    `learn`( 學習 ), `predict`( 預測 ), `make`( 製作 ), `understand`( 理解), `do`(做事)。然後，它會從中選一個詞。


    具體選哪個，模型允許輸出有一定的隨機性，可以使用「溫度」數值設定。就這麼簡單。`GPT`生成內容就是在反覆問自己：根據目前為止的這些話，下一個詞應該是什麼？


    輸出質量的好壞取決於什麼叫「應該」。你不能只考慮詞頻和語法，你必須考慮語義，尤其是要考慮在當前語境之下詞與詞的關係是什麼。`Transformer`架構幫了很大的忙，你要用到思維鏈，等
    等。


    是的，`GPT`只是在尋找下一個詞。但正如阿爾特曼所說，人難道不也只是在生存和繁衍嗎？最基本的原理很簡單，但各種神奇和美麗的事物可以從中產生。(圖1-14)


    ![](index-52_1.jpg)


    `Sam Altman @sama·3/2/23` language models just being programmed to try to predict
    the next word is true, but it''s not the dunk some people think it is.


    animals, including us, are just programmed to try to survive and reproduce, and
    yet amazingly complex and beautiful stuff comes from it.


    379 679 5,460 803K


    圖1-14


    訓練 `GPT`的最主要方法是無監督學習：給它看一段文本的前半部分，讓它預測後半部分是什麼。這樣訓練為啥就管用呢？語言模型為什麼跟人的思維很接近？為了讓`GPT`有足夠的智慧，到底需要多少個參數？應該喂多少語料？


    你可能覺得`OpenAI`已經把這些問題都搞明白了，故意對外保密——其實恰恰相反。沃爾夫勒姆非常肯定地說，這些問題現在沒有科學答案。沒人知道`GPT` 為什麼這麼好使，也沒有什麼第一性原理能告訴你模型到底需要多少參數，這一切都只是一門藝術，你只能跟著感覺走。


    阿爾特曼也說了, 問就是上天的眷顧。(圖1-15) `OpenAI` 最應該感恩的，是運氣。


    `Sam Altman @sama·5d`


    We offer no explanation as to why \[anything works except\] divine benevolence.


    290 444 3,693 706K


    圖 1-15


    ![](index-53_1.jpg)


    沃爾夫勒姆還講了 `GPT` 的一些特點，我認為其中有三個最


    ![](index-53_2.jpg)


    幸運的發現。


    第一，`GPT` 沒有讓人類教給它什麼「自然語言處理」之類的規則。所有語言特徵——語法也好，語義也罷，全是它自己發現的，說白了就是暴力破解。事實證明，讓神經網絡自己發現一切可說和不可說的語言規則，人不插手，是最好的辦法。


    第二，`GPT` 表現出強烈的「自組織」能力，也就是前文講過的「湧現」和「思維鏈」。不需要人為給它安排什麼組織，它自己就能長出各種組織來。


    第三，也許是最神奇的事情——`GPT`用同一個神經網絡架構，似乎就能解決表面上相當不同的任務！按理說，畫畫應該有個畫畫神經網絡，寫文章應該有個寫文章神經網絡，編程應該有個編程神經網絡，你得分別訓練。可是事實上，這些事情用同一個神經網絡就能做。


    這是為什麼？說不清。沃爾夫勒姆猜測，那些看似不同的任務其實都是「類似人類」的任務，它們本質上是一樣的——`GPT` 神經網絡只是捕獲了普遍的「類似人類的過程」。


    當然，這只是猜測。鑑於這些神奇功能目前都沒有合理解釋，它們應該算作重大科學發現。阿爾特曼說，如果一個東西明明不該好使但是居然好使，科學就該出場了；如果一個東西應該好使可是不好使，工程學就該出場了。(圖1-16)`GPT`到底為啥這麼好使？需要科學出場。


    ![](index-54_1.jpg)


    `Sam Altman @sama·2/21/23` science is when it works but shouldn''t,engineering
    is when it doesn''t work but should


    222 453 4,460 562K


    圖1-16


    這是 `GPT`的底牌——它只是一個語言模型；但同時，它很神奇。


    那 `GPT` 為什麼算數就不太行呢？沃爾夫勒姆講了很多，下面我用圖給你簡單概括一下。


    我們用三個集合代表世間的各種計算，對應圖1-17 中的三個圓圈。


    ![](index-55_1.jpg)


    大圈代表「一切計算」——我們可以把自然界中所有現象都理解成計算，因為底層都是物理定律。大自然中一草一木，宇宙中每個粒子的運動，都嚴格符合物理定律，都滿足某個數學公式(如果不考慮量子不確定性)，所以都可以被視為在進行某種計算。其中絕大多數計算過於複雜，以至於我們連方程都寫不全，不管是用大腦還是用計算機都不能處理，但我們知道


    那也是計算。


    大圈內部左邊這個小圈代表「神經計算」，適合神經網絡處理。我們的大腦和包括`GPT` 在內的當前的所有 AI，都在這裡。神經計算善於從經驗中發現事物的規律，但是對數學問題的處理能力有限。


    大圈內部右邊這個小圈代表「形式邏輯」，我們會的數學就在這裡。形式邏輯的特點是精確推理，不怕繁雜，永遠準確。只要你有方程、有算法，這裡就能兢兢業業地給你算出來。這是特別適合傳統計算機的領域。


    不論人腦、`GPT`還是計算機都處理不了世間的所有計算，所以兩個小圈遠遠不能覆蓋整個大圈。我們搞科學探索，就是要盡可能地擴大兩個小圈的範圍，進入大圈中未知的領地。


    人腦和`GPT` 也可以處理一部分形式邏輯，所以兩個小圈有交集；但是我們處理不了特別繁雜的計算，所以這個交集並不大。


    那有沒有可能將來 `GPT` 越來越厲害，讓左邊的小圈完全覆蓋右邊的小圈呢？那是不可能的。沃爾夫勒姆認為，語言思考的本質是在尋求規律。而規律，是對客觀世界的一種壓縮。有些東西確實有規律可以壓縮，但有些東西本質上就沒有規律，不能壓縮。


    我在《精英日課》第1季的專欄裡講過沃爾夫勒姆發明的一個遊戲，其中有個「第30號規則」，它產生的運算結果就沒有什麼可見的規律，無法提前預測。這種現象被稱為「不可約化的複雜」：你要想知道將來是什麼樣子，就只能老老實實一步步算出來，不能「概括」。


    這就是為什麼`GPT`算不好繁雜的數學題。`GPT`跟人腦一樣，總想找規律、走捷徑，可是有些數學題，除了老老實實算，沒有別的辦法。


    更致命的是，到目前為止，`GPT` 的神經網絡是純粹的「前饋」(`feedforward`) 網絡, 只會往前走, 不會回頭, 沒有循環,這就使得它連一般的數學算法都執行不好。


    這就是`GPT`的命門——它是用來思考的，不是用來執行冷酷無情的計算指令的。


    這樣看來，雖然`GPT` 比人腦知道的更多、反應更快，但作為神經網絡，它並沒有在本質上超越人腦。


    對此，沃爾夫勒姆有個洞見。


    用這麼簡單的規則組成的神經網絡就能很好地模擬人腦——至少模擬了人腦的語言系統，這說明什麼呢？老百姓可能覺得這說明`GPT` 很厲害，而沃爾夫勒姆卻認為，這說明人腦的語言系統並不厲害。


    `GPT` 證明了，語言系統是個簡單系統！


    `GPT` 能寫文章，說明在計算上，寫文章是一個比我們想象的更淺的問題。人類語言的本質和背後的思維，已經被一個神經網絡給捕捉了。


    在沃爾夫勒姆眼中，語言無非就是由各種規則組成的一個系統，其中有語法規則和語義規則。語法規則比較簡單，語義規則包羅萬象，包括像「物體可以移動」這樣的默認規則。從


    亞里士多德(`Aristotle`) 開始就一直有人想把語言中所有邏輯都列出來，但是從來沒人做到——現在`GPT`給了沃爾夫勒姆信心。


    沃爾夫勒姆覺得，`GPT`能做的，自己也能做。他打算用一種計算語言——也就是 `Wolfram語言`，取代人類語言。這麼做有兩個好處。一個是精確性，人的語言畢竟有很多模糊的地方，不適合精確計算。另一個則更厲害——`Wolfram語言`代表了對事物的「終極壓縮」，代表了世間萬物的本質⋯
    ⋯


    因為我聽說過哥德爾不完備性定理，所以我不太看好他這個雄心壯志。但是我能想到的人家肯定早就想過了，所以我沒有反對意見，我只是想告訴你這些。


    總而言之，`GPT`的底牌是：它雖然結構原理簡單，但是已經在相當程度上擁有人腦的思維。現在還沒有一個科學理論能完整解釋它為什麼能做到，但是它做到了。`GPT`的命門也是因為它太像人腦了：它不太擅長做數學計算，它不是傳統的計算機。


    這也解釋了為什麼`GPT`很擅長編程，卻不能自己執行程序：編程是語言行為，執行程序是冷酷的計算行為。


    理解了這些，我們研究怎麼調教`GPT`就有了一點理論基礎。


    但我在這裡想強調的是，`GPT` 的所謂命門其實很容易彌補。


    你給它個計算器不就行了嘛！你另外找臺計算機幫它執行程序不就行了嘛！ `OpenAI`允許用戶和第三方公司在 `ChatGPT` 上


    安裝插件，恰恰就解決了這個問題⋯ ⋯ 所以`GPT` 還是厲害。


    但是沃爾夫勒姆讓我們認識到了`GPT`的根本侷限性：神經網絡的計算範圍是有限的。我們現在知道，將來就算`AGI` 出來，也不可能跳出神經計算和形式邏輯去抓取大自然的真理——科學研究終究需要你跟大自然直接接觸，需要調用外部工具和外部信息。


    希望本節內容能讓你對 `GPT`有所祛魅。它的確是不可思議地強，但它遠遠不是萬能的。


    ## 問答


    ### 問 明道如昧


    `GPT`基於神經網絡的學習和嬰兒學語言很像，媽媽不會教嬰兒語法，他自然就學會了。而成人拿著語法書學外語，怎麼學都是半吊子。但是有一個關鍵區別：`GPT`不接觸物理世界！當媽媽跟嬰兒說蘋果的時候，嬰兒會看到、摸到、吃到蘋果，建立一系列的神經鏈接。但`GPT`只是「讀書」，就理解了蘋果「是什麼」。請問萬老師，這種不接觸實物的語言理解，到底是一種什麼理解？就像一個天生眼盲的人，對顏色建立的是怎樣的理解？


    ### 萬維鋼


    這個問題問得好。這是一個極為深刻的問題，也是當前專家正在激烈辯論的問題。`GPT`並不真的接觸物理世界，它只是通過語言去學習有關世界的知識，那它所形成的理解，有可能是完整的嗎？


    我寫過一篇文章叫《我們專欄用上了AI》①，講的是用AI畫畫的事。當時`ChatGPT`和`GPT-3.5`都還沒出來, 我對這一波AI大潮的理解還不深，所以我認為AI對現實的理解是非常有限的。我還引用了「圖靈獎」得主楊立昆(`Yann
    LeCun`)的一個說法，說「語言只承載了人類全部知識中的一小部分」，所以「語言模型不可能有接近人類水平的智能」。


    要知道，楊立昆是`GPT`最有力的反對者，他至今維持這個態度。


    可是我現在的態度有了強烈的動搖。我覺得語言模型對世界的理解可能已經足夠好了。


    而`OpenAI`的首席科學家伊利亞·蘇茨科弗(`Ilya Sutskever`)在接受一個播客的訪談①時，對楊立昆的態度給出了一個特別有力的回應。


    蘇茨科弗說，表面上看，語言模型只是從文本上了解世界，所以現在`OpenAI`給`GPT`增加了多模態能力，讓它能通過畫面、聲音和視頻瞭解世界。但是，多模態並不是必須的。他舉了個顏色的例子。在不用多模態功能的情況下，按理說，語言模型就好像是個盲人，它只是聽說過一些關於各種顏色的描述，它並不能真的理解顏色。可是什麼叫理解？


    蘇茨科弗說，語言模型僅僅通過語言訓練就已經知道「紫色更接近藍色而不是紅色」「橙色比紫色更接近紅色」這些事實。


    蘇茨科弗並沒有明確說，但我從上下文理解出，模型不是在背誦哪個文本教給它的知識，它是從眾多文本中自己摸索出了這些顏色的關係。那這叫不叫理解？


    蘇茨科弗還說，如果能直接看見顏色，你肯定能瞬間理解不同顏色是怎麼回事——但那只是學習速度更快而已。從文本中學習會比較慢，但並不見得是本質的缺陷。


