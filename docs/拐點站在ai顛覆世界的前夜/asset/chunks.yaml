    # 第三章 置身智能，你更像你


    ## 生成的专业性与提示的模糊性


    AI「畫不好」更不容易———你很難讓`Midjourney`生成一幅拙劣的畫。它是由無數專業畫家和大師的作品訓練出來的，只要一齣手就至少是專業水準。你固然可以設計這幅畫的大局，但不管你這大局的設計水平如何，AI
    總能確保畫的細節達到專業水平。


    比如下面這幅林中住宅(圖 3-7)，「咒語」要求是「`architectural illustration with retro visuals`」(建築插畫呈現復古視覺效果)，但什麼是建築插畫和復古效果?你要隨便找個畫家，他恐怕不太容易畫到下圖這個程度。


    ![](img/index-139_1.jpg)


    筆法就不用說了。單說這個佈局和視角，就比我自己想象的好太多了。這就是專業。


    這種生成有點像裝修住宅，最理性的做法是你只說一個大概的風格，讓設計師給你做具體設計。你不應該對設計做太多幹涉，因為你根本不懂。


    雖然給 AI 提要求通常來說要給具體情境，但是，要求也不要提得太過具體。如果你不太懂專業，那麼保留一定的模糊性，讓 AI 自行發揮，往往能得到更好的結果。


    ![](img/index-140_1.jpg)


    從憤世嫉俗的角度看，模糊化可能是為了委婉表達，不傷面子。比如你有個想法，如果領導說「你這個想法好」，那就有可能支持你；如果領導說「你有想法，這很好」，那就形同反對。再比如你要去做一個項目，如果領導說「你放手去做吧」，那可能只是客氣；但如果領導再加一句「總經辦是你的堅強後盾」，那就是真支持。


    但是從「提示語工程學」(`Prompt Engineering`)的角度看,模糊化創造了生成空間。


    劉晗老師在《想點大事》這本書裡有個很有意思的說法。任何一部法律中都有些意思模糊的詞語，比如《中華人民共和國公司法》第五十一條第 1 款規定，一般的公司要設立監事會，但「股東人數較少或者規模較小的有限責任公司，可以設一至二名監事，不設監事會」。那什麼叫「人數較少或者規模較小」呢?為什麼不規定一個具體的數字呢?


    劉晗說，去除模糊性「會使法律規則異常僵化，無法應對變化多端的現實生活」。在發達地區，註冊資本在 500 萬元以下的公司算小公司，而欠發達地區這就算大公司了，強行規定一個具體數字會讓法律無法操作。所以劉晗說，「法律常常不是為了妥協才故意模糊，而是為了能用才故意模糊」。①


    模糊，這個事才能辦好。日常管理也是這樣，領導交代下屬任務時，最好不要採取事無鉅細什麼都吩咐的那種「微管理」②，只在任務結束後談談感受就好③。交代任務就是 `prompt`，談感受就是做選擇。


    這裡面有個很微妙的東西。表面上看，模糊的提示語可能讓你損失了一定的控制權。但實際上，模糊是必要的，而且你並沒有真的喪失掌控權。


    ![](img/index-141_1.jpg)


    想明白這些道理，我們就能理解為什麼有些人會擔心 AI 取代人了，因為自古以來就有很多老闆擔心下屬取代他。但我們更能理解這樣的擔心不會具有任何普遍意義，正如絕大多數老闆都沒有被下屬取代。


    同樣地，在擔心 `AGI`會不會奴役人類之前，無數智者擔心的是政府會不會奴役民眾。你想想，絕大多數老百姓既不理解政府是怎麼運行的，也不理解各種經濟政策，根本就不關心政治。政府做的很多事情是高度專業化的，它如果不想讓你知道，你就算是個內行也沒用；甚至就算你知道了，發聲了，也沒有多少人在乎。當然現代化國家都有媒體監督，有言論自由，有民主選舉，可是再怎麼樣那也是代議制民主，都是政府在操縱政策。


    你看民眾跟政府的關係是不是也很像人和 AI 的關係：民意就是`prompt`，政府操作就是生成，選舉就是選擇。


    那你怎麼能知道政府是不是在為老百姓做事呢?其實還是不用太擔心。


    政治學家的一個關鍵認知①是，老百姓對政府的各項政策本身確實比較無感————但是對政策變化很敏感。如果大家都支持一個政策，這個政策早就出臺了；如果大家都不支持這個政策，這個政策就出不了臺。這就意味著任何新政策差不多都是在這樣一個時機下出臺的————絕大多數人根本不關心，現在恰好明確支持的人比明確反對的人多了一點點。這些明確的支持者和反對者可能只佔有效選民的
    1%，但是他們起了大作用。這些人比較懂行，相當於理解`AGI`原理的專家和愛好者。因為別人都不在乎，所以這些人等於代表了民意。政客會小心地聽取這些人的意見————不聽不行，因為還有選舉。


    事實證明，政府做得好不好，老百姓還是知道的。研究表明，老百姓對政府的支持率並不怎麼受總統的花邊新聞之類小事情的影響，主要還是看經濟。圖 3-8 就是美國歷史上消費者情緒指數和民眾對政府支持率的變化情況。


    ① James A. Stimson, `Tides of Consent: How Public Opinion Shapes American Politics`
    ( Cambridge University Press, 2004) .


    ![](img/index-143_1.jpg)


    當經濟形勢變好或者變壞的時候，消費者情緒會率先變化。東西貴了還是便宜了，自己的錢夠不夠花，其實你心裡有數。但是這個情緒變化不會立即反映到政府支持率上。支持率的變化會比消費者情緒變化滯後一兩個季度————但是沒關係，支持率終將改變。


    也就是說，如果你政府沒把經濟搞好，老百姓會給你一段時間，但是不會給很久。一旦支持率發生逆轉，再趕上選舉，那你這屆政府就得換人。


    政治學家克里斯托弗·萊齊恩(`Christopher Wlezien`)有個「溫度調節器」理論①特別能說明問題。他說公共意見就好像溫度調節器：老百姓不懂經濟是怎麼運行的，這就如同大多數人都不
    知道空調的運作原理是什麼，我們甚至都不知道房間最理想的溫度應該是多少度；但是，我們能感覺出現在是冷了還是熱了，我們會調節溫度。感覺太冷就開暖氣，太熱就開冷氣，這就足夠了。


    ① `Christopher Wlezien`, `The Public as Thermostat: Dynamics of Preferences for
    Spending`, American Journal of Political Science Vol. 39, No.4(Nov.1995),pp.981-1000.


    所以，借用林肯那句話，政府再厲害也「不能在長時間內糊弄所有的人」。


    古代中國沒有民主制度，但是曾經在不同的歷史時期實行過宰相負責制，皇帝只是授權和問責，不做具體行政工作。比如西漢的文景之治、北宋仁宗年間，皇帝代表民意`prompt`，官員負責生成，然後皇帝再根據結果做選擇，國家其實運行得很好。歷史上英國和日本搞虛君制也是這樣。


    現代公司中股東大會和董事長不過問公司日常事務，也是「`prompt`——生成——選擇」關係。


    讓專業的人做專業的事，而真正的老闆可以提 `prompt` 和做選擇，這不但是 AI 時代的新風尚，也是一種理想的做事模式。


    ## 04 领导技能：AI 时代的门槛领导力


    AI 時代，公司跟公司之間的差異在哪兒呢?領導力的價值如何體現?說白了，這家公司如何比別家公司更能賺錢呢?


    ![](img/index-145_1.jpg)


    2023 年, `OpenAI`把`API`流量價格降低到 1/10 之後, 幾天之內就湧現出無數個基於`GPT`的小應用。做這些應用的人很多都是業餘的，他們寫幾行程序、弄個網站、實現一個功能，就能吸引很多人來用。


    把一本書輸給 `GPT`，然後用問答的方式來學習，這樣的應用現在都已經有好幾個了，曾經最火的一個叫`ChatPDF`。它上線不到 1 周就有了 10 萬次
    PDF 上傳，10 天就有了超過 30 萬次對話。


    後來它推出每月 5 美元的付費服務，開始賺錢了。`ChatPDF`的作者只有 3000 個`X`粉絲，可是`X`上有無數人談論這個工具。


    起點都一樣，為什麼`ChatPDF` 能搶跑成功呢?創辦這個網站需要的所有工具都是現成的，它的人氣不是完全來自 AI。僅僅是因為它運氣好嗎?


    `ChatPDF` 網站的界面簡潔而友好，用戶直接就能上手。它還針對學生、工作者和一般好奇的人分別說明這個東西有什麼用。它的服務分為免費和收費兩檔，免費也很有用，收費又很便宜。它還有自己的用戶社區。(圖
    3-9)


    ![](img/index-146_1.jpg)


    對比之下，它的競爭對手，比如 `PandaGPT`，做得雖然也不錯，但是各方面的直觀性和友好度就差了那麼一點點。(圖 3-10)


    這一點點看似簡單，實則不容易做到。你必須非常理解用戶，才能提供最舒服的使用體驗。


    這一點點，也許就是 AI 時代最值錢的技能。


    現在只有像豬肉之類的通用必需品才只看質量和價格，大多數商品都得講品牌和市場定位，尤其網絡時代還得考慮跟用戶的互動。為此你需要做到兩點：


    ①原網頁是英文的，這裡是`DeepL` 插件翻譯的中文版。


    `PandaGPT. io Get Start`


    `Upload a file, ask`


    `5000+files indexed`


    `anything. 20000+questions answered`


    `Tired of reading? Let PandaGPT hand le all that for you!`


    `Powered by ChatGPT Powered by the state of the art model from OpenAl`


    ![](img/index-147_1.jpg)


    第一，你得非常理解現在的用戶想要什麼；


    第二，你得讓人認可你。


    也就是認識和被認識，理解和被理解。而這些，恰恰是 AI 所不能給的。


    尼克·查特拉思(`Nick Chatrath`) 在 `The Threshold` (我翻譯為《門檻》)一書裡提出了 AI 時代的領導力的概念，就是書名的「門檻」，意思是這種領導力就像兩個房間中間的位置——要求你把新和舊結合起來，把心靈和大腦結合起來。他在書裡討論的，正是
    AI 時代的領導力應該是什麼樣的。


    「門檻領導力」有啥不一樣呢?我們先回顧一下領導力的演變。


    最早的領導力是「英雄主義」。我是這個狼群中最能打的，所以你們都得聽我的，我說怎麼辦就怎麼辦……這是最土的領導。


    近現代以來出現了「軍隊式」的領導力。講究命令的穩定性和可靠性，做事得有章法，不能朝令夕改。這種領導力的問題在於容易出官僚主義，什麼都講制度和流程，有時候忘了初心。


    後來主流管理學倡導「機器式」的領導力。它以目標為核心，講考核、問責、任人唯賢，提倡比較扁平的組織結構，追求效率最大化。這是國內民營企業常見的領導方式。這種領導力的問題在於它可能會讓視野窄化，過於關注具體的目標，時間長了會讓人產生倦怠感，乃至喪失視野。


    前面這三種領導力可以說都是「賣豬肉思維」，比的是執行。


    新一代管理學倡導的是「價值觀和願景」。比如，「我們不是一個只知道賺錢的公司」，「我們是為客戶創造價值」……它講究「服務式領導」，組織希望員工對要做的事情達成共識，不但知道做什麼，更要知道為什麼。這種領導力的問題是，現在社會上各種價值觀是衝突的，共識難以達成。那怎麼辦呢?


    查特拉思提出的「門檻領導力」就是要充分認識事物的複雜性，能夠處理有矛盾衝突的觀念。我理解這個門檻領導力特別重視人格魅力：你的公司、你的事業，本質上是你的人格的放大；你有多大的認知，就能做多大的事；你的認知有多複雜，就能做多複雜的業務。


    這個領導力不只是上級對下級，既可以是商家對顧客，媒體對公眾，也可以是下級對上級：只要能對別人產生影響，讓人沿著你選的方向前進，都是領導力。AI 時代，每個人都需要一點門檻領導力。


    怎樣培養門檻領導力呢?查特拉思說有 4 個途徑：靜心沉思，自主思考，具身智能，增長意識。關鍵在於，這些都不是 AI 能有的智能。這一節咱們先說「靜心沉思」。


    ![](img/index-149_1.jpg)


    智商只是一個數字，並不能概括一個人所有的智能維度。現在認知心理學家把人的智能大體分成 9 類：


    1.邏輯和數學；

    2.語言;

    3.空間;

    4.欣賞大自然，瞭解生物；

    5.音樂;

    6.身體和感覺的協調；

    7.瞭解你自己；

    8.人際關係，也就是對他人的同情之瞭解；

    9.存在智能(`existential intelligence`), 也就是有關「大問題」的智力，比如我為什麼活著，什麼是愛。


    其中這個「存在智能」因為難以量化評估，它到底算不算是 一種智能，學術界覺得還不好說———但是查特拉思特意把它列在這裡，因為他認為這是很關鍵的一個商業能力。查特拉思預測，後面這
    4 種能力，AI 在短期內都無法超越人。


    尤其對商業最有用的兩方面智能，令人不會被 AI 取代，它們都要求你靜心沉思：一個是情感智能，即瞭解你自己和了解別人；一個是存在智能，咱們後面再說。


    ![](img/index-150_1.jpg)


    關於人類情感，有一家出自麻省理工學院媒體實驗室的公司叫 `Affectiva`，號稱能感知到人的情感。現在的新消息是它被一家搞眼球追蹤的公司給收購了，說是用於「道路安全產品」……看來它的應用範圍比我們想象的要窄。現實是，AI
    在情感計算上的進展十分緩慢。


    情感計算為什麼這麼難?查特拉思列舉了 4 個理由，來解釋為何 AI 在短期內既不能學會人的情感，更不能理解人的意識。


    第一，檢測情感非常困難。所謂看臉就能判斷人的情緒的「微表情」學說已經被證偽了。不同文化、不同場景下，人的情感流露可以很不一樣。人非常善於偽裝和隱藏自己的情感——這是進化給人的社交本能。你不可能搞一套編碼讓
    AI 自動識別。


    第二，人都是在實踐中學習理解別人的情感的。你從小跟朋友們摸爬滾打，你惹怒過別人，你被人惹哭過——通過這些互動反饋你才學會了情感。AI 沒有這樣的學習機會。


    第三，人的情感十分複雜。經過幾百萬年的演化，人腦的邏輯運算能力雖然一般，但是情緒運算能力絕對無比發達，是「系統 1」快速運算。我們能在複雜的環境中感受到微妙的危險，能自己給自己建構情緒，能用直覺做出難以名狀的判斷。情感會受到當前環境、人生經歷、文化智慧等多方面的影響，以至於有
    `DeepMind` 的科學家曾經對查特拉思說，這麼複雜的計算可能是 AI 算力所無法達到的。


    第四，人有一些感覺是無法用語言表達的。意識，是難以言傳的。


    哲學裡有個基本概念叫「感質」(`qualia`)，意思是某種特定物體帶給你的特定感覺。你對紅色的感覺是什麼?喝牛奶是什麼感覺?你沒有辦法向一個盲人解釋紅色，也沒有辦法用語言向一個沒喝過牛奶的人精確描述喝牛奶的體驗……那
    AI 又怎麼能知道呢?


    雖然 AI 的有些認知是人理解不了的，但是別忘了，人的有些認知也是 AI 理解不了的。既然 AI 連人最基本的感覺都無法瞭解，又怎麼能指望它做情感計算呢?


    ![](img/index-151_1.jpg)


    你必須切實理解人的情感和人生的意義，才能處理好現代社會中的各種衝突和矛盾。


    查特拉思做過 CEO，他發現客戶和投資者最常問他三類問題：


    1.認識自我和他人：你的團隊都是誰?你的客戶是誰?

    2.目的：你希望你的組織實現什麼?為什麼?

    3.倫理和價值觀：你將如何處理數據隱私之類的道德問題?


    這些都是只能由人，而不是 AI，回答的問題。就像`ChatPDF`，它把用戶分成三種類型，分別介紹這個東西對用戶有啥用；它在推動 AI 應用的普及；它有價值觀，它強調分享，最大限度保留給免費用戶的服務。`ChatPDF`的創造者的確很有商業意識，同時也很有極客精神。


    AI 當然能給你提供各種建議方案，但是像免費還是收費、要花多大成本保護用戶隱私這些充滿矛盾和悖論的問題，是你自己必須做的選擇。那些不是智力題也不是知識題，而是人格題。對公司來說，現代社會正在變成熟人社會，你需要「內聖外王」的能力。


    查特拉思提倡用靜心沉思，或者說冥想的方式，來思考這些問題。他說：「無論領導者在領導時認為自己在做什麼，他們都在揭示自己的本質。」


    你和你的員工是什麼樣的，公司就什麼樣。你們既是在探索自己是誰，也是在幫助客戶發現他們是誰……這些道理看起來都很簡單，實則比編程困難得多，也重要得多。


    自動駕駛 AI 的道德選擇必須預先由人來制定，你會怎麼制定?比如，汽車在緊急時刻是優先保護車內的人，還是車外的人?你要選擇保車內的人，社會會譴責你；你要選擇保車外的人，客戶不會買你的車。你怎麼設定才能讓大家都滿意呢?再比如，訓練
    AI 模型的數據有偏見，無形之中對某些客戶造成了歧視，你怎麼向公眾解釋?


    以前賣豬肉大家無所謂，現在哪怕是賣服裝的布料，人們都會對你的價值觀有所要求。現在, all business is show business (所有商業都是演藝業)，所有品牌競爭都是人的精神內核的較量。


    AI 只是放大了這種較量。


    `ChatGPT` 這波浪潮給了我們一個啟示：用上 AI 很容易，任何公司都能以非常便宜的價格購買 `OpenAI`的算力；但是一家有 AI 而沒有內核的公司應該被
    AI 淘汰。就如同現在很多所謂書法家，練了一輩子字，寫得確實挺好看，但是沒內容———你讓他寫個橫幅，他只會什麼「天道酬勤」「自強不息」之類的俗詞兒，他們應該被淘汰。


    ## 问答


    問 Situyg


    `ChatPDF`和得到 App 的「每天聽本書」、樊登讀書 App 等的服務不是大同小異嗎?機器助讀和人類解讀有什麼區別呢?


    萬維鋼


    我先修正一下對`ChatPDF`的評價，它現在的效果還不是很理想。我專門註冊了`ChatPDF`的付費賬號，讓它替我讀一篇 150 頁的論文，結果雖然不能說沒有幫助，但是它把很多細節都說錯了，特別是有幾個地方把原文的邏輯都搞錯了，還編造了一些內容。看來我還得自己讀。


    不過這只是時間問題。`ChatGPT`推出了插件系統，其中有一個插件就是允許訓練本地知識——肯定還是可以用的，而且會越來越準確。


