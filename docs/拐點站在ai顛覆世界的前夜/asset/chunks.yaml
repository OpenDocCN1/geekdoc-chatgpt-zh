    ## 农业生产方式的改变


    直接指揮農民哪一天做什麼，等於提供了一攬子的解決方案，把所有決定都替農民做了。


    AI還可以改變農業生產的方式。


    現在很多農產品都是在溫室裡種植的。溫室種植好處很多，但有個問題，就是容易長蟲害。那麼就有公司利用AI，能提前一週準確預測某個溫室會不會長蟲。有了這一週時間，農民就可以提前訂購抗蟲用品。但這還只能算是一個應用解決方案。


    系統解決方案是，既然 AI預測能力這麼強，農民就不用怕蟲害了。既然不怕蟲害，就可以種植一些原本因為怕蟲害而不敢種的農作物。還可以搞更大的溫室，因為不用擔心蟲害襲擊一大片農作物。農業的整個生產方式改變了。


