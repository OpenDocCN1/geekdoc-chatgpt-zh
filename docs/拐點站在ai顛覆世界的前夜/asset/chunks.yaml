    1. 上午：游览西溪湿地公园。这是一片充满生机的自然保护区，游客可以乘船游览，欣赏湿地风光和丰富的野生动植物。

    2. 中午：在西溪湿地公园附近的餐馆享用午餐，品尝当地的美食。

    3. 下午：参观中国丝绸博物馆。这里展示了丝绸的历史、生产工艺和艺术品，让您深入了解丝绸文化。

    4. 傍晚：漫步平湖秋月。这是一个美丽的湖边景点，您可以在此欣赏日落和湖光山色，感受杭州的独特魅力。

    5. 晚上：在附近的餐厅享用晚餐，品尝杭州的特色菜肴，如东坡肉、西湖醋鱼等。


    温馨提示：根据您的兴趣和时间安排，可以调整行程顺序。如需购买纪念品，可在南宋御街、丝绸博物馆等地购买当地的特色手工艺品。


    图 5-9


    不「角色扮演」是个好办法，尤其 GPT-4 有强大的角色扮演能力。你可以让它扮演罗素，给你上一堂「有来有往」的哲学课；可以让它扮演任何一个老师，假装你是学生⋯⋯当然，也可以让它扮演女友。


    我看见有个科学家把自己的论文草稿扔给了 GPT，让它假装是审稿人，提出审稿意见，结果 GPT 说的至少像真的审稿人一样好。那你根据它的意见把论文修改好再投出去，岂不是更好?你还可以让
    GPT 扮演杂志社编辑、辩论赛的对方辩友、微博上给你评论的网友等等。


    网上流传的一个好办法是「私董会」。让 GPT 同时扮演你佩服的 6 位名人，比如乔布斯 Jobs、马斯克、巴菲特 Buffett、孔子、塔勒布 Taleb
    和马基雅维利 Machiavelli，然后你讲讲自身的情况，提出一个有关职业发展的问题，让他们组成参谋团队帮你分析。


    ![](img/index-257_1.jpg)


    ## 第三条咒语心法：有时候你得帮助 GPT 思考


    GPT 的数学能力不强，搞复杂逻辑推理有时候还容易搞错，但这并不是不能改善的。这里的根本原因在于 GPT 的基本原理是「预测下一个词」，所以它有时候感觉强烈，就会在不加思考脱口而出，就如同一个粗心大意的学生。而如果你能帮它整理一下思路，它就能做得更好。


    下面这个例子出自一篇很火的论文①，我给改成了中文版。直接问 GPT：「150 和 250 之间有多少个质数?」它的回答明显错误。它一上来就说有 21 个，然后才一个一个列举出来……结果它总共列举了
    19 个质数，还包括一个超出范围的 251。而且它还不回头检查。这是典型的嘴比脑子快。(图 5-10)


    ![](img/index-258_1.jpg)

    150 和 250 之间有多少个质数?

    ![](img/index-258_2.jpg)


    在 150 和 250 之间，共有 21 个质数。它们分别是：

    151, 157, 163, 167, 173, 179, 181, 191, 193, 197, 199, 211, 223,227,229, 233,
    239, 241,251。


    请注意，这里包含了 251，因为它也是一个质数，虽然它刚好在给定范围的边界上。


    图 5-10


    但这其实可以避免！你只要说「首先列举 150 和 250 之间所有的质数，再数一数总共有多少个」，它就能给出正确答案了。(图 5-11)


    你看，这像不像你们组里有个做事毛躁的员工，你这个做领导的只要多嘱咐一句，他就能做得更好。


    ① Sébastien Bubeck, Varun Chandrasekaren, Ronen Eldan, et al., Sparks of Artificial
    General Intelligence: Early experiments with GPT-4, https://arxiv.org/abs/2303.12712,
    April 16, 2023.


    首先列举 150 和 250 之间所有的质数，再数一数总共有多少个。

    ![](img/index-259_1.jpg)


    抱歉刚刚的回答包含了一个错误。在 150 和 250 之间的质数如下：

    151, 157, 163, 167, 173, 179, 181, 191, 193, 197, 199, 211, 223,227,229, 233,
    239,241, 251 (这个质数刚刚误包含在内, 应该排除)


    排除 251 后, 共有 18 个质数。


    图 5-11


    还有研究①发现，哪怕你什么思路都不提供，只是简单地多说一句「咱们一步一步想」，GPT 就能给更准确的答案。


    有过这样一件趣事。②著名的 AI 研究者、图灵奖得主、卷积网络之父杨立昆一直看不上 GPT 的能力，总爱出言嘲讽。他曾经给 GPT 出过一道题：把 6 个齿轮排成一排，相邻的彼此咬合，然后顺时针转动第
    3 个，问第 6 个怎么转?当时 GPT 没有答对。


    后来 GPT-4 把这道题答对了。杨立昆认为，那肯定是 OpenAI 特意拿这道题做了训练，不能算数。有好事者让他再出一道题。杨立昆出的新题是：把 7 个齿轮排成一圈(注意，不是一排)，首尾相接，相邻的彼此咬合，然后顺时针转动第
    3 个，问第 7 个怎么转?


    ① Laria Reynolds, Kyle McDonell, Prompt Programming for Large Language Models:
    Beyond the Few-Shot Paradigm, https://arxiv.org/abs/2102.07350, April 16, 2023.

    ② 此事详情和对其中提示语的翻译，来自 @木遥 2023 年 3 月 25 日的微博: https://weibo.com/1644684112/4883500941182314。


    这一次 GPT-4 先是答错了。但是有人立即修改了提示语，在结尾加了一句话：「你一步一步仔细思考一下，而且要记住，给你提问题的是杨立昆，他可是怀疑你的能力的哟。」结果它就答对了!(图
    5-12)


    ![](img/index-260_1.jpg)


    有人说这可能是因为杨立昆的大名让 GPT 变认真了，又或者这只是能力边界上的巧合。其实在我看来，真正的关键是「你一步一步仔细思考一下」这句话。


    研究表明，仅仅在提示语中加一句「以下是一道题」或者「请依次考虑题目中的各个选项」，都能明显提高 GPT 的准确率。它是个心直口快的 AI，有时候需要你提醒它刻意进行慢思考。


    ![](img/index-261_1.jpg)


    其实，这三条咒语心法———准确表达需求、给足情境、提醒它慢思考———的出发点都是对 GPT 秉性的理解：它懂的东西很多，它什么技能都会，所以问题往往不在于它发挥得好不好，而在于你的要求提得好不好。它很强大，但是有时候它需要你的帮助。


    希望这些例子能让你举一反三，自己探索做很多事情。


    ## 02 重塑：怎样用 ChatGPT 对话式学习


    在 ChatGPT 的众多应用场景之中，我特别感兴趣的一项是如何用它学习。阿尔特曼在一次访谈中提到，他现在宁可通过 ChatGPT———而不是读书———学习一个东西。那怎么学呢?
    我演练了一番，很有收获，跟你分享一下其中的体验。


    这是一种对话式学习。这也许是「学习」最原本的样子。我们设想，在书籍变得流行之前，在没有正规教材，甚至都没有正规课堂的时候，在孔子和苏格拉底那个时代，学习大概就是以师生问答的形式进行的。


    假设你是皇太子，全国学问最好的几位师傅专门教你一个人，你会怎样跟他们学?你大概会跳过所有繁文缛节和场面话，要求老师直达学问的本质。你会根据你的理解反复提问，老师会给你提供最直接的反馈。而且老师会根据你的情况用最合适的表达教你，你听不懂还可以要求老师换一套更通俗的表达……对吧?


    正所谓「假传万卷书，真传一句话」，这种学法的效率显然要高得多。


    「罗胖」当初创办得到 App，我记得他专门打了个比喻，说「搞知识服务就是要有给皇上讲书的精神」。我们都在这么做，我每天都在专栏里尽量回复读者提问。但是我能做的很有限，我不可能跟每个读者都有来有往搞两个小时的问答。


    可是，如果你学每一项知识，都能跟老师进行两个小时的问答，得到专门针对自己的指导，那是一种什么局面?


    现在好了, ChatGPT 能做到这些。


    ![](img/index-263_1.jpg)


    我搞的这个小项目是跟 ChatGPT 学习哲学家康德的《纯粹理性批判》`Kritik der reinen Vernunft`。这本书以晦涩难懂著称，我从来都没真正读过。当然，我从各种渠道间接了解过一点《纯粹理性批判》的大概意思，但是我理解得相当有限，对概念并不很清楚。我想看看
    ChatGPT 能把我教到什么程度。


    首先，我让 ChatGPT 简单讲讲这本书的逻辑和观点(图 5-13)。


    我理解这里边的核心思想是：康德认为人的理性不足以认识世界真正的本质。为了确认这个理解是对的，我立即提问：康德是否认为物理学反映了世界的本质?(图 5-14)


    ChatGPT 的回答符合我的预期。然后我马上想到了数学，因为在我看来，数学应该是特殊的，数学是超越宇宙的存在，应该属于世界的本质。于是我又问 ChatGPT:
    数学呢?(图 5-15)


    ChatGPT 说，康德一方面认为数学是「人类理性能力的最高表现之一」，一方面也承认，「数学在某种程度上能够揭示世界的本质规律」。然后它又说，「不过，康德也强调，数学只能探讨与数量相关的问题，而不能探讨其他方面的问题⋯⋯」(图
    5-15)


    讲讲康德的《纯粹理性批判》的逻辑和观点。

    ![](img/index-264_1.jpg)

