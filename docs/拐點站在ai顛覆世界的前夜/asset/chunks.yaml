    `AI`?


    `AI` 可能会接管社会的道德和法律问题。


    你猜这像什么?这就像中世纪的基督教。


    ![](img/index-109_1.jpg)


    在中世纪，所有人都相信上帝和教会，有什么事不是自己判断，而是去教堂问神父。那时候，书籍都是昂贵的手抄本，普通人是不读书的，知识主要是通过跟神父的对话传承。


    是印刷术出现以后，每个人可以自己读书了，直接就能获得智慧，不用迷信教会了，这才开启了讲究理性的启蒙运动。


    启蒙运动对社会的改变是全方位的：封建等级制度、教会的崇高地位、王权，都不复存在。启蒙运动孕育了一系列政治哲学家, 像霍布斯(`Hobbes`)、洛克 (`Locke`)、卢梭(`Rousseau`)
    等。通过这些人的思考，人们才知道那个时代是怎么回事，以后的日子该怎么过。


    抛开上帝，拥抱理性，启蒙运动是给普通人赋能的时代。


    而今天我们又开启了一个新的时代。我们发现人的理性有达不到的地方，可是`AI`可以达到，`AI` 比人强。如果人人都相信`AI`, 有什么事不是自己判断, 而是打开`ChatGPT`
    问`AI`, 知识主要是通过跟 `AI`的对话学习······


    再考虑到 `AI`还可以轻易地向你推荐一些最适合你吸收的内容，对你进行定点宣传，你舒舒服服地接受了……


