    # 第五章 實戰，讓 AI為你所用


    ## 01 咒語：如何讓 ChatGPT發揮最大價值


    對於如何通過與ChatGPT對話來做一些事情，網上早已經有各種攻略和例子，想必你自己也有一番操作心得，我想重點說一些原則性的、有普遍意義的東西。


    跟計算機打交道通常需要使用特殊的語言，比如編程語言、命令腳本之類的。但是GPT作為一個語言模型AI，沒有自己的特殊語言。我們跟它互動的方式就是人類的自然語言———稱為「提示語」(Prompt)。英文也行，中文也行，你該怎麼說話就怎麼說話，不需要學習什麼專業術語。


    GPT的思維方式很像人。正如沃爾夫勒姆所言，它似乎已經全面掌握了人類語言的語法和語義，包括各種常識和邏輯關係。


    GPT還湧現出了思維鏈和小樣本學習之類的本領，已經有相當不錯的邏輯推理能力。當然，數學是它的命門，它的知識還是有限的，特別令人反感的是，它遇到明明不懂的還可能會瞎編(稱為Hallucination,幻覺)。它的優點和缺點其實都很像人腦。


    GPT可以說已經是一個自身具足的智能，但是我們跟它交流還是得講技巧和策略。現在有個專門研究怎麼跟AI交流的學問叫「提示語工程」(Prompt Engineering)。這就如同要想讓一個魔法發揮最大的效力，你得會念咒語一樣。


    但是這裡沒有任何神秘之處，因為跟誰交流都得講技巧和策略。就算你面對的是一位無所不能的大宗師，你也得把話說明白，他才知道你要幹啥。如果能順著他的脾氣說就更好了。


    接下來我會結合實際操作，介紹三條最常用的咒語心法。


    第一條咒語心法非常簡單，那就是要準確表達你的需求。


    很多時候我們根本沒想清楚自己要的是什麼。比如對ChatGPT說「給我寫首詩」，這就不是一個很好的提示語。它隨便寫一首，不是你需要的，這種操作沒什麼意義。你應該先想清楚一點，說得具體一點，比如說「以《春天》為題，寫一首七言絕句」。它寫了一首：春風輕拂綠意濃，桃花笑迎柳舞空。江水涓涓鳥語喧，萬象更新處處紅。(圖5-1)


    ![](index-246_1.jpg)


    你覺得字詞還可以，但是意境似乎比較單薄。於是你提出進一步要求：「以《春天》為題，寫一首七言絕句，要求其中不能有『春』這個字，而且要表達感慨時間過得真快，必須發奮努力的心情。」它是這樣寫的：時光荏苒柳青青，花開花落又一年。勤學篤行求自強，把握光陰勿虛度。(圖5-2)


    ![](index-247_1.jpg)


    以《春天》為題，寫一首七言絕句，要求其中不能有「春」這個字，而且要表達感慨時間過得真快，必須發奮努力的心情。


    時光荏苒柳青青，

    花開花落又一年。

    勤學篤行求自強，

    把握光陰勿虛度。


    圖5-2


    你看，這一次生成的詩是不是更有意思了！


    像這樣的對話可以來往很多輪，直到你滿意為止。這其實有點像編程，不斷反饋、不斷修正，你會樂此不疲的。


    有時候先舉幾個例子能讓GPT更清楚你到底想要什麼。如果你想讓它用某種特殊句式寫一段話，最好先給個例子。網上流傳一個操作，讓ChatGPT用「胡錫進體」寫篇文章。(圖5-3)


    這裡GPT展現了強大的小樣本學習能力，看一遍就會了。不過根據一篇2021年發佈的、特別具有前瞻性的論文①，


    ① Laria Reynolds, Kyle McDonell, Prompt Programming for Large Language Models:
    Beyond the Few-Shot Paradigm, CHI EA ''21: Extended Abstracts of the 2021 CHI
    Conference on Human Factors in Computing Systems No.314(2021),pp.1-7.


    W按照下面模板，寫篇文章：「近期互聯網上出現了，老胡也看到，知道大家很，老胡忍不住囉嗦幾句，雖然確實存在部分，但是，最後老胡呼籲。」


    近期互聯網上出現了許多關於數據隱私的爭議，老胡也看到了很多有關此事的報道，知道大家很關注數據隱私問題。


    老胡忍不住囉嗦幾句，雖然確實存在部分公司濫用用戶個人數據的情況，但是大部分公司都是在遵循相關法律法規的前提下使用數據的。最後，老胡呼籲大家在使用網絡服務時要更加謹慎，瞭解自己的數據隱私權，同時也要監督公司是否遵循數據隱私的相關規定。


    圖5-3


    有時候給例子適得其反，因為例子可能會誤導GPT。比如，我想讓GPT給孩子出幾道數學應用題，怕它不明白什麼是應用題，就先舉了個例子，「以下是一道小學數學題：小明有15個蘋果，他送給小麗7個蘋果，自己還剩下幾個蘋果?出五道類似的數學題」。(圖5-4)


    GPT出了幾道題，可跟我的例題也太像了————都是一個小孩把東西分給別的小孩，把蘋果換成了香蕉、雞蛋、鉛筆等，而且還都是減法。(圖5-4)這不是我想要的，我想要有加法、有減法，有不同故事的題目。GPT過度模仿了例題，這是一種「過度擬合」。事實上，我一開始根本就不應該舉例子，直接告訴它我的需求就好，它完全能聽懂。


    我跟它說「出五道20以內加減法數學應用題」，它就會出「花園裡有18朵花，小兔子吃掉了3朵。現在花園裡還有多少朵花?」這種題，就不是小朋友把不同的東西給不同的人這同一類故事了。(圖5-5)


    你看，這些題目就好多了。


    現實是，GPT已經非常智能，你幾乎沒必要擔心它聽不懂。你應該只在自己用直接語言無法表達清楚的情況下舉例。按照那篇論文和後來沃爾夫勒姆的觀點，所謂小樣本學習其實根本不是學習，只是喚醒了GPT原本就會的技能。


    ![](index-250_1.jpg)


    出五道20以內加減法數學應用題


    ![](index-250_2.jpg)


    1.小明有7顆糖果，媽媽又給了他5顆糖果。現在小明一共有多少顆糖果?

    2.小華在冰箱裡發現了12瓶飲料。他喝了其中的4瓶。還剩下多少瓶飲料?

