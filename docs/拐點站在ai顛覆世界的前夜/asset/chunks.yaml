    # 炼制大模型主要分四步


    炼制大模型主要分四步：架构、预训练、微调和对齐。


    ![](img/index-339_1.jpg)


    ## 第一步：架构


    第一步是搭建模型的「架构」(`architecture`)。架构就是主要算法，也是这个神经网络的几何结构。像我们多次提到的 `Transformer`，就是
    `GPT` 模型中的关键架构。你可能听说过一个用于生成图像的 AI 叫 `Stable Diffusion`，其中的「`Diffusion`」也是一种架构。`OpenAI`
    在 2024 年 2 月推出的文字生成视频模型 `Sora`，它的架构则是把 `Diffusion` 和 `Transformer` 结合了起来。


    架构既不神秘也不保密。有些现在最流行的大模型直接就是开源的，比如 `Meta` 的 `Llama-2` 和 `Google` 的 `Gemma`。你可以下载、在自己的计算机上运行这些模型，还可以读一读源代码，完全了解它们的架构。开源是硅谷文化的一个光荣传统。就算像
    `GPT-4`、`Gemini`、`Sora` 这样主力商业模型不开源，它们的研发者也会专门写论文说明模型的架构，用于同行之间的交流。当然现在 `OpenAI`
    一家单独领先，对外披露的模型信息越来越少，受到不少批评。但总体而言，现代科技公司还是非常开放的，有竞争但更有合作，没有什么「独门秘籍」会被长期藏着掖着，毕竟所有研发人员属于一个共同的社区。这就使得好想法会以极快的速度传播。


    因为大家用的算法都差不多，所以架构的强弱主要是参数的多少。参数越多，神经网络就越大，模型能掌握的智能就越多，但要求的算力也越强。从这个意义上说，一家 AI
    公司的实力主要取决于它拥有多少块 `GPU`。有一位在硅谷某大厂做 AI 的高管私下表示，他并不看好 `OpenAI` 的未来，他认为 `Google`、微软、亚马逊、`Meta`
    这些超大公司都比 `OpenAI` 更有实力把 AI 做好———这就是基于算力的判断。


    但我们也不能说算法不是竞争领域。`OpenAI` 的 `GPT-3` 只用了 1750 亿个参数，怎么效果比之前 `Google` 上万亿参数的模型还好呢？后来开源的
    `Llama-2` 等模型只用几百，甚至几十亿个参数，效果竟然接近 `GPT-3.5`。现实是架构算法仍然在高速进步。以最先提出大模型能力「涌现」这个说法而成名、后来加入
    `OpenAI` 的计算机科学家 `Jason Wei` 在 `X` 上说，他现在每天都在尝试新的算法，他总是面临把一个已经做了一段时间算法继续做下去还是上新算法这样的取舍。新算法本身不是多大的秘密，开放社区中算法的竞争更多地体现在执行力和冒险精神上。


    现在，没有一个科学理论能告诉你为什么这个版本的架构就比那个版本好，也没有理论能算出，要想达到这个水平的智能，你就得需要那么多的参数。一切都只有在现场尝试过才知道。


    `OpenAI` 没有开源 `GPT-4`，也从未正式公布 `GPT-4` 的参数个数。你只能大概知道它的架构是什么，但你暂时不知道其中有多少高妙的细节。


    ![](img/index-341_1.jpg)


    ## 第二步：预训练


    第二步是「预训练」，也就是喂语料。孩子头脑生得再好，不学习知识也没用。而 AI 比人强的一个重要特点就是，你给它学习材料，它真学。


    业内存在一些公共可用的语料集，任何公司都能拿来训练自己的模型。你还可以从一些政府和公益性的网站上直接抓取信息用于训练，比如维基百科。但正如好学生都会开小灶，优秀的模型必须能取得独特的高水平语料。`GPT`
    的编程能力之所以强，一个特别重要的因素就是，微软公司把旗下程序员社区 `GitHub` 网站中多年积累的、各路高手分享的程序代码提供给了 `OpenAI`，用作训练语料。


    我希望生活在一个所有知识对所有 AI 开放的世界里，但我们这个现实世界的趋势是，优质语料正在成为待价而沽的稀缺资源。2024 年年初，《纽约时报》起诉 `OpenAI`
    用他家网站上原本只提供给付费用户的內容训练大模型，还允许模型把内容复述给用户阅读，认为这是侵权。但 `OpenAI` 也有话说：并没有法律规定不能用版权内容训练
    AI 啊，难道学习还违法吗？就在这个案子怎么判还不知道的时候，2024 年 2 月，大型论坛网站 `Reddit`（红迪网）和 `Google` 达成协议，允许
    `Google` 用它的内容训练大模型———`Google` 为此每年要向 `Reddit` 支付 6000 万美元①。


    所以，优质的知识有价，而且很贵。那你说既然语料如此宝贵，我们国产的大模型能不能以占有正宗的中文语料作为竞争优势呢？很遗憾，不能。


    一方面是不太需要。`OpenAI` 没有公布 `GPT-4` 的语料使用情况，但是根据报告，`GPT-3` 的训练语料中，中文占比只有 0.1%②。大模型并不是用中文语料回答中文问题，它可以随便切换语言，语言只是界面，它是用语义向量而不是任何一种特定语言进行推理，它思考的是知识本身。大模型甚至可以靠一本词典和几千个例句现学一门语言跟你对话。我自己的使用体会是，只要
    `ChatGPT` 能准确理解你的问题，不管你用中文还是英文，它回答的质量是一致的。


    另一方面，中文资料在全球现有数据体系中所占比重很小。中文网站的内容只占世界互联网的 1.4%；前文我们说到，`GPT-3` 用到的语料中，中文只占 1%；在一个通用的大模型训练数据集中，中文占比也只有
    1.3%①。


    如果大模型想要对中国的历史和文化有精深理解，它就必须专门用中文语料训练。然而到目前为止，中国的大模型尚不完善。


    语料的知识水平很重要，但是是哪种语言写的并不重要。截至本书定稿之日，国产大模型在中文方面还没有表现出优势。


    一个有意思的问题是，语料的作用是有上限的吗？目前来说，更强的模型一定需要更多的语料，而这就要求有更多的参数，使用更大的算力。但人类的知识似乎应该是有限的。有没有可能在达到某个程度之后，模型就不再需要更多的语料了呢？又或者说，模型的可伸缩性会从某个数量级上开始变差，以至于更多参数和语料带来的性能提升已经配不上算力的消耗？我得到的消息是，到目前为止，那个极限还没有达到。`OpenAI`
    2020 年的一篇论文②显示，随着参数的数量级增加，模型的性能就是越来越好，远没看到天花板。


    预训练这一步主要拼的是算力，并不需要花费多少人力。据说包括 `OpenAI` 在内，各家大模型负责预训练的都只需要十几个人而已，这里拼的还是人均 `GPT`
    数量。真正消耗人力的是下一步。


    ![](img/index-344_1.jpg)


    ## 第三步：微调


    第三步是对经过预训练的模型进行「微调」。负责微调的工程师数量大约是预训练的 10 倍。微调的目的是让大模型说人话。


    预训练只是让模型学会预测下一个词，这个单一功能对我们用处不大。我们需要模型能回答问题，能跟我们对话交流，能根据指令生成内容，能更主动地去做一些事情，这就是微调要做的事情。比如你问模型「奥巴马是谁」，它必须先把这个提问场景转化成一个「预测下一个词」的场景，然后输出「奥巴马是第
    44 任美国总统」。这要求模型能听得懂人话。


    微调的主要办法是监督学习。就像大人教小孩一样，你直接告诉他怎样做是对的，做错了就给纠正过来。


    这里面有个神奇点。一位专门从事大模型微调的工程师告诉我，每一类问题，只需要训练一次就可以！比如你教会模型回答「奥巴马是谁」这个问题之后，不必再教它怎样回答「泰勒·斯威夫特是谁」，它自己就能举一反三————要是训练次数太多反而不好①。微调阶段全部的问题类型大约只有
    5 万个，这 5 万个问题学会了，模型就能回答任何问题。


    那把这 5 万个问题都找出来一一训练也不容易啊！没错，但这里面有个捷径可以走。如果你是个后来者，前面别人已经有个训练好的大模型，比如 `GPT-3.5`，那么你可以用
    `GPT-3.5` 帮你生成并标记各种微调问题和答案，用于训练你自己的大模型。有些公司正是这么做的——但是请注意，`ChatGPT` 的用户协议中禁止用它训练模型。


    微调到底调了什么呢？`OpenAI` 有篇论文①猜测，预训练已经让模型掌握了所有知识，微调只不过是让它学会如何把知识表达出来而已。微调前的 `GPT` 就如同一个满腹经纶的自闭症儿童，他其实什么都明白，只是不知道怎么跟人交流。


    但仅仅会说人话还不行，还得说得精彩、说得好听，才是好 AI。


    ![](img/index-346_1.jpg)


    ## 第四步：基于人类反馈的强化学习


    第四步叫「基于人类反馈的强化学习」(`Reinforcement Learning from Human Feedback`, `RLHF`)，目的是让大模型的输出内容既精彩又符合主流价值观，也就是「对齐」。


    比如你问「奥巴马是谁」，一个只经过微调而没有经过 `RLHF` 的大模型可能只会简单地告诉你「奥巴马是第 44 任美国总统」。这个答案当然没错，很多人类也是这么说话的，但是这样的内容可能不会让用户满意。我们希望模型介绍一下奥巴马的生平，也许再说说他有什么性格特点和喜好，我们希望模型的输出有意思。可是怎样才算有意思呢？这没有一定之规，不能事先设定标准答案，得让模型自己摸索、自己去闯，然后让人类给反馈。这就是「强化学习」的作用：你回答得好，我给点赞；回答得不好，我给差评。


    `RLHF` 首先会在公司内部进行，一方面由工程师负责给反馈，另一方面可以用另一个模型代表人类给反馈。比如你可以用 `GPT-4` 去训练 `GPT-5`。但真人的反馈是最重要的。


    我认为 `RLHF` 让 `OpenAI` 有了先发优势。你每一次跟 `ChatGPT` 对话都在帮助 `OpenAI` 累积关于用户喜好的知识。`OpenAI`
    承诺不会把用户输入的内容用于训练模型，但是你每一次接受或者拒绝 `ChatGPT` 的输出，都在告诉 `OpenAI` 这样输出好不好。这就如同 `Google`
    搜索一样。我几乎从来都不会点击搜索页面上的广告，但是我仍然在为 `Google` 做贡献，因为我对搜索结果的点击会帮助 `Google` 理解哪个结果是好的。这样说来算力不是一切：也许你有无数的资源，能突然弄出一个大模型，但因为你的模型此前没人用过，你不理解用户喜好，它就不会好用。


    `RLHF` 的一个重要课题是对齐，也就是让 AI 的输出符合主流价值观。`OpenAI` 专门成立了一个团队，而且还把 20% 的算力都用于所谓「超级对齐」(`Superalignment`)①，以期在未来几年出现远超人类智能的
    AI 的情况下，确保 AI 不会制造任何危险。


    你不希望 AI 自己出去黑掉一个网站，更不希望 `ChatGPT` 教孩子怎么自制毒品，所以对齐的确是非常重要的。但现阶段 AI 的对齐似乎被主要用于确保「政治正确」———不冒犯人。对我来说
    `GPT-4` 已经被过度对齐了，比如，你给它一张有政治人物的照片，它往往会拒绝识别。现在美国最大的政治正确是「觉醒文化」(`woke`)，本来是要求避免因为种族、性别或者性取向而导致的歧视，有时候矫枉过正，变成刻意美化这些少数群体。2024
    年 2 月，`Google` 的大模型 `Gemini` 被发现把包括华盛顿在内的美国国父们都给画成了黑人，简直是滑天下之大稽。


    在这种情况下，有时候你可能更愿意用一个未经对齐的模型。这就体现了开源模型的好处。既然模型是开源的，谁都可以改，母公司就不必承担道德责任。`Llama-2`
    敢说一些 `GPT-4` 不敢说的话，`Stable Diffusion` 敢画 `Midjourney` 不敢画的图片。另一个思路是仍然要对齐，但是刻意不搞那么多政治正确。马斯克的
    `X` 旗下大模型 `Grok` 智能水平一般，但是会说一些有反叛精神的话，主打一个敢说，也算是找到了生态位。


    你感觉到没有，微调和对齐很像是人在社会中的成长。可能你在学校里已经学到了足够的知识，但是一参加工作还是做不好，因为你不知道怎么跟同事对接，怎么和各种人交流，怎么表现得体乃至游刃有余。我们都是被现实教育，不断获得反馈，慢慢积累经验，逐渐自我调整和优化的。微调和对齐步骤告诉我们，就连
    AGI 也不能一下子就能什么都会：就算知识可以快速灌输，恰到好处的行事风格也只能慢慢打磨。


    ![](img/index-349_1.jpg)


    ## 模型应用与知识扩展


    经过前面 4 步，大模型就算炼制成功了，可以像 `ChatGPT` 一样直接使用了。但你可能不满足于只跟模型简单对话，你希望在工作中深度使用 AI，比如让
    AI 做你们公司的客服人员或者法律顾问。这就要求大模型掌握我们本地的知识。


    模型学习知识的最理想方式还是前面说的预训练。这样掌握得最牢靠，而且能融会贯通。其实很多经典或者不那么经典的书籍，`GPT` 在预训练阶段都已经掌握了，你可以直接跟
    `ChatGPT` 对话式学习。但是预训练对算力的要求最高，花费巨大，小公司无法承受；再者，预训练说完成就算完成了，它的知识有个截止日期。那怎么才能让模型在预训练之后学习新的知识呢？


    一个办法是在微调阶段教给模型一些本地的知识。微调的算力成本低，而且这种监督学习会对模型有更直接的影响。然而经验表明，如果在微调的时候给模型喂太多新知识，它可能会快速忘掉之前的知识。比如，模型本来知道奥巴马是谁，但是你在微调中让它学了很多你们公司的员工档案，它学着学着就可能会过度关注你们公司的事情，而忘了奥巴马是谁。


    所以，现在更主流的做法是对模型本身不做改动，而是每次需要新知识都让它「现学现卖」。比如你问 `ChatGPT` 一个最新的时事问题，它会先调用搜索引擎上网搜索相关的新闻，选定几篇新闻自己读一遍，再做个综合判断，然后给你输出一个总结性的回答。你还可以把一篇长文章甚至一本书直接输入给
    `ChatGPT`，让它自己先读一遍，形成理解之后回答你的问题。


    这个做法的问题在于模型的输入是有长度限制的。`GPT-4` 的输入最大限制是 8192 个 `tokens`（代币），对应大约 8000 个中文字，比较长的文章都读不完。`Gemini`
    的一大卖点是允许输入 100 万个 `tokens`，但对于企业级应用还是远远不够。更重要的是，模型调用都是根据输入、输出长度计费的，如果每次使用都要给模型输入那么多的信息，使用成本就太高了。


    现在普遍使用的一个商业化的解决方案叫「检索增强生成」(`Retrieval-Augmented Generation`, `RAG`)。它的做法是先把你所有的本地知识编码成一个「向量数据库」，等到模型要用时，先通过向量数据库索引到所需要的具体信息，然后查找到那些信息的文本，读取文本之后再形成理解和判断，最后输出给你。如果你的全部本地信息是一座图书馆，`RAG`
    方法相当于给这个图书馆编写了一个目录。这个目录的编码不是文字，而是向量———我们前面讲了，大模型其实是用语义向量进行推理的。这比传统的搜索要高级得多，因为同义词、近义词，甚至不同语言的词都对应非常接近的向量，你不需要关心具体的文字表述。


    向量本质上是语义，所以更加智能。


    不光文字，现在声音、图像和视频也都可以用 `RAG` 编码。`RAG` 给大模型提供了巨大的知识扩展能力，但它毕竟仍然是基于检索的，对知识的理解效果还不如预训练那样自洽。


    韩非子有句话叫「上古竞于道德，中世逐于智谋，当今争于气力」。我们看看大模型炼制过程中的争夺点，是不是也有点这个意思：


    预训练拼的是算力，相当于「争于气力」；

    架构和微调需要聪明的算法和精妙的干预，相当于「逐于智谋」；

    对齐需要谨慎选择价值观，正是「竞于道德」。


    现实是，所有这些操作都没有定型，都是各家公司积极探索和激烈竞争的领域。如果你用韩非子那句话的逻辑来判定大公司终究有优势，算力才是根本，大力就能出奇迹，「人均
    `GPU` 数量决定一


