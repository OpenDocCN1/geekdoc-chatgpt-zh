    ## 04 领导技能：AI时代的门槛领导力


    AI時代，公司跟公司之間的差異在哪兒呢?領導力的價值如何體現?說白了，這家公司如何比別家公司更能賺錢呢?


    ![](index-145_1.jpg)


    2023年, `OpenAI`把`API`流量價格降低到1/10之後, 幾天之內就湧現出無數個基於`GPT`的小應用。做這些應用的人很多都是業餘的，他們寫幾行程序、弄個網站、實現一個功能，就能吸引很多人來用。


    把一本書輸給 `GPT`，然後用問答的方式來學習，這樣的應用現在都已經有好幾個了，曾經最火的一個叫`ChatPDF`。它上線不到1周就有了10萬次PDF上傳，10天就有了超過30萬次對話。


    後來它推出每月5美元的付費服務，開始賺錢了。`ChatPDF`的作者只有3000個`X`粉絲，可是`X`上有無數人談論這個工具。


    起點都一樣，為什麼`ChatPDF` 能搶跑成功呢?創辦這個網站需要的所有工具都是現成的，它的人氣不是完全來自AI。僅僅是因為它運氣好嗎?


    `ChatPDF` 網站的界面簡潔而友好，用戶直接就能上手。它還針對學生、工作者和一般好奇的人分別說明這個東西有什麼用。它的服務分為免費和收費兩檔，免費也很有用，收費又很便宜。它還有自己的用戶社區。(圖3-9)


    ![](index-146_1.jpg)


    對比之下，它的競爭對手，比如 `PandaGPT`，做得雖然也不錯，但是各方面的直觀性和友好度就差了那麼一點點。(圖3-10)


    這一點點看似簡單，實則不容易做到。你必須非常理解用戶，才能提供最舒服的使用體驗。


    這一點點，也許就是 AI時代最值錢的技能。


    現在只有像豬肉之類的通用必需品才只看質量和價格，大多數商品都得講品牌和市場定位，尤其網絡時代還得考慮跟用戶的互動。為此你需要做到兩點：


    ①原網頁是英文的，這裡是`DeepL` 插件翻譯的中文版。


    `PandaGPT. io Get Start`


    `Upload a file, ask`


    `5000+files indexed`


    `anything. 20000+questions answered`


    `Tired of reading? Let PandaGPT hand le all that for you!`


    `Powered by ChatGPT Powered by the state of the art model from OpenAl`


    ![](index-147_1.jpg)


    第一，你得非常理解現在的用戶想要什麼；


    第二，你得讓人認可你。


    也就是認識和被認識，理解和被理解。而這些，恰恰是 AI 所不能給的。


    尼克·查特拉思(`Nick Chatrath`) 在 `The Threshold` (我翻譯為《門檻》)一書裡提出了 AI時代的領導力的概念，就是書名的「門檻」，意思是這種領導力就像兩個房間中間的位置——要求你把新和舊結合起來，把心靈和大腦結合起來。他在書裡討論的，正是
    AI時代的領導力應該是什麼樣的。


    「門檻領導力」有啥不一樣呢?我們先回顧一下領導力的演變。


    最早的領導力是「英雄主義」。我是這個狼群中最能打的，所以你們都得聽我的，我說怎麼辦就怎麼辦……這是最土的領導。


    近現代以來出現了「軍隊式」的領導力。講究命令的穩定性和可靠性，做事得有章法，不能朝令夕改。這種領導力的問題在於容易出官僚主義，什麼都講制度和流程，有時候忘了初心。


    後來主流管理學倡導「機器式」的領導力。它以目標為核心，講考核、問責、任人唯賢，提倡比較扁平的組織結構，追求效率最大化。這是國內民營企業常見的領導方式。這種領導力的問題在於它可能會讓視野窄化，過於關注具體的目標，時間長了會讓人產生倦怠感，乃至喪失視野。


    前面這三種領導力可以說都是「賣豬肉思維」，比的是執行。


    新一代管理學倡導的是「價值觀和願景」。比如，「我們不是一個只知道賺錢的公司」，「我們是為客戶創造價值」……它講究「服務式領導」，組織希望員工對要做的事情達成共識，不但知道做什麼，更要知道為什麼。這種領導力的問題是，現在社會上各種價值觀是衝突的，共識難以達成。那怎麼辦呢?


    查特拉思提出的「門檻領導力」就是要充分認識事物的複雜性，能夠處理有矛盾衝突的觀念。我理解這個門檻領導力特別重視人格魅力：你的公司、你的事業，本質上是你的人格的放大；你有多大的認知，就能做多大的事；你的認知有多複雜，就能做多複雜的業務。


    這個領導力不只是上級對下級，既可以是商家對顧客，媒體對公眾，也可以是下級對上級：只要能對別人產生影響，讓人沿著你選的方向前進，都是領導力。AI時代，每個人都需要一點門檻領導力。


    怎樣培養門檻領導力呢?查特拉思說有4個途徑：靜心沉思，自主思考，具身智能，增長意識。關鍵在於，這些都不是AI能有的智能。這一節咱們先說「靜心沉思」。


    ![](index-149_1.jpg)


    智商只是一個數字，並不能概括一個人所有的智能維度。現在認知心理學家把人的智能大體分成9類：


    1.邏輯和數學；

    2.語言;

    3.空間;

    4.欣賞大自然，瞭解生物；

    5.音樂;

    6.身體和感覺的協調；

    7.瞭解你自己；

    8.人際關係，也就是對他人的同情之瞭解；

    9.存在智能(`existential intelligence`), 也就是有關「大問題」的智力，比如我為什麼活著，什麼是愛。


    其中這個「存在智能」因為難以量化評估，它到底算不算是 一種智能，學術界覺得還不好說———但是查特拉思特意把它列在這裡，因為他認為這是很關鍵的一個商業能力。查特拉思預測，後面這4種能力，AI在短期內都無法超越人。


    尤其對商業最有用的兩方面智能，令人不會被 AI取代，它們都要求你靜心沉思：一個是情感智能，即瞭解你自己和了解別人；一個是存在智能，咱們後面再說。


    ![](index-150_1.jpg)


    關於人類情感，有一家出自麻省理工學院媒體實驗室的公司叫 `Affectiva`，號稱能感知到人的情感。現在的新消息是它被一家搞眼球追蹤的公司給收購了，說是用於「道路安全產品」……看來它的應用範圍比我們想象的要窄。現實是，AI在情感計算上的進展十分緩慢。


    情感計算為什麼這麼難?查特拉思列舉了4個理由，來解釋為何 AI在短期內既不能學會人的情感，更不能理解人的意識。


    第一，檢測情感非常困難。所謂看臉就能判斷人的情緒的「微表情」學說已經被證偽了。不同文化、不同場景下，人的情感流露可以很不一樣。人非常善於偽裝和隱藏自己的情感——這是進化給人的社交本能。你不可能搞一套編碼讓
    AI自動識別。


    第二，人都是在實踐中學習理解別人的情感的。你從小跟朋友們摸爬滾打，你惹怒過別人，你被人惹哭過——通過這些互動反饋你才學會了情感。AI沒有這樣的學習機會。


    第三，人的情感十分複雜。經過幾百萬年的演化，人腦的邏輯運算能力雖然一般，但是情緒運算能力絕對無比發達，是「系統1」快速運算。我們能在複雜的環境中感受到微妙的危險，能自己給自己建構情緒，能用直覺做出難以名狀的判斷。情感會受到當前環境、人生經歷、文化智慧等多方面的影響，以至於有
    `DeepMind` 的科學家曾經對查特拉思說，這麼複雜的計算可能是 AI算力所無法達到的。


    第四，人有一些感覺是無法用語言表達的。意識，是難以言傳的。


    哲學裡有個基本概念叫「感質」(`qualia`)，意思是某種特定物體帶給你的特定感覺。你對紅色的感覺是什麼?喝牛奶是什麼感覺?你沒有辦法向一個盲人解釋紅色，也沒有辦法用語言向一個沒喝過牛奶的人精確描述喝牛奶的體驗……那
    AI 又怎麼能知道呢?


    雖然 AI的有些認知是人理解不了的，但是別忘了，人的有些認知也是 AI 理解不了的。既然 AI連人最基本的感覺都無法瞭解，又怎麼能指望它做情感計算呢?


    ![](index-151_1.jpg)


    你必須切實理解人的情感和人生的意義，才能處理好現代社會中的各種衝突和矛盾。


    查特拉思做過CEO，他發現客戶和投資者最常問他三類問題：


    1.認識自我和他人：你的團隊都是誰?你的客戶是誰?

    2.目的：你希望你的組織實現什麼?為什麼?

    3.倫理和價值觀：你將如何處理數據隱私之類的道德問題?


    這些都是只能由人，而不是 AI，回答的問題。就像`ChatPDF`，它把用戶分成三種類型，分別介紹這個東西對用戶有啥用；它在推動AI應用的普及；它有價值觀，它強調分享，最大限度保留給免費用戶的服務。`ChatPDF`的創造者的確很有商業意識，同時也很有極客精神。


    AI當然能給你提供各種建議方案，但是像免費還是收費、要花多大成本保護用戶隱私這些充滿矛盾和悖論的問題，是你自己必須做的選擇。那些不是智力題也不是知識題，而是人格題。對公司來說，現代社會正在變成熟人社會，你需要「內聖外王」的能力。


    查特拉思提倡用靜心沉思，或者說冥想的方式，來思考這些問題。他說：「無論領導者在領導時認為自己在做什麼，他們都在揭示自己的本質。」


    你和你的員工是什麼樣的，公司就什麼樣。你們既是在探索自己是誰，也是在幫助客戶發現他們是誰……這些道理看起來都很簡單，實則比編程困難得多，也重要得多。


    自動駕駛AI的道德選擇必須預先由人來制定，你會怎麼制定?比如，汽車在緊急時刻是優先保護車內的人，還是車外的人?你要選擇保車內的人，社會會譴責你；你要選擇保車外的人，客戶不會買你的車。你怎麼設定才能讓大家都滿意呢?再比如，訓練AI模型的數據有偏見，無形之中對某些客戶造成了歧視，你怎麼向公眾解釋?


    以前賣豬肉大家無所謂，現在哪怕是賣服裝的布料，人們都會對你的價值觀有所要求。現在, all business is show business (所有商業都是演藝業)，所有品牌競爭都是人的精神內核的較量。


    AI只是放大了這種較量。


    `ChatGPT` 這波浪潮給了我們一個啟示：用上AI很容易，任何公司都能以非常便宜的價格購買 `OpenAI`的算力；但是一家有AI而沒有內核的公司應該被
    AI淘汰。就如同現在很多所謂書法家，練了一輩子字，寫得確實挺好看，但是沒內容———你讓他寫個橫幅，他只會什麼「天道酬勤」「自強不息」之類的俗詞兒，他們應該被淘汰。


