    ### 026 拐 點


    《荀子·勸學》中的一段話，正好可以用來描寫 AI能力的三重境界。


    第一重境界是「積土成山，風雨興焉」。參數足夠多，訓練達到一定的積累，你就可以做一些事情。比如`AlphaGo`(阿爾法圍棋)下圍棋。


    第二重境界是「積水成淵，蛟龍生焉」。模型再大到一定程度，就會湧現出一些讓人意想不到的神奇功能。比如，`AlphaGo Zero`不按人類套路下圍棋，大語言模型的思維鏈。


    第三重境界是「積善成德，而神明自得，聖心備焉」。這就是 `AGI`了，也許它產生了自我意識，甚至有了道德感……


    古往今來那麼多人讀《勸學》，也不知有幾人真按照荀子的要求去學了。但是我們現在知道，AI肯定學進去了。你給它學習材料，它是真學。


    總而言之，因為「開悟」和「湧現」，AI現在已經獲得了包括推理、類比、小樣本學習等思考能力。


    我們不得不重新思考以前對 AI做出的各種假設——什麼 AI做事全靠經驗，AI不會真的思考，AI沒有創造力……包括「AI會的都是用語言可以表達的東西」，現在我也不敢肯定了。


    如果 AI通過思維鏈能達到這樣的思考水平，那人又是怎麼思考的?我們的大腦是不是也有意無意使用了思維鏈呢?如果是這樣，人腦跟 AI 到底有什麼本質區別?


    這些問題都在呼喚全新的答案。


    ### 第一章 ChatGPT 究竟是什麼 027


    ## 问答


    ### 问 海綿寶寶


    有兩個問題請問萬Sir：


    (1)網上那些付費項目，比如得到App的付費課程，是不是不在`ChatGPT`的搜索範圍內?如果說這些付費項目相比網上其他資訊質量更高的話，是不是可以說`ChatGPT`的input
    (輸入) 其實質量不高?


    (2) 我對「`GPT-3`的知識就截至2021年」感到有點不可思議。為什麼強大如`ChatGPT`不能即時更新訓練素材?尤其是現在世界變化這麼快，不敢相信`ChatGPT`的知識還停在2021年。


    萬維鋼


    付費課程因為沒上公網，不在搜索引擎的搜索範圍之內。其實不僅是付費課程，包括淘寶商品之類的信息，現在都對搜索引擎屏蔽，所以搜索引擎的價值本來就在降低。


    但語言模型是另一個故事。2024年初， 《紐約時報》 (`The New York Times`) 對`OpenAI`發起了訴訟①, 認為`OpenAI`用該報文章訓練`GPT`，又允許`GPT`根據用戶要求複述文章內容是違法行為。截至本書定稿的時刻，這個案子還沒有結果。它的判決將會產生深遠的影響。美國目前還沒有一個關於是否可以
    使用受版權保護的語料訓練語言模型的法律規定，也沒有判例。版權法的規定是，直接把人家的內容複製過來，大段大段地輸出，那肯定不行。但訓練模型不是複製，是消化之後的轉換。`OpenAI`早就已經應邀給美國專利版權局發去了一份文件①，解釋自己對此的理解，它認為使用版權內容訓練模型是合法的。
    但是，官方目前的確還沒有一個明確的說法。


    還有一個引人注目的案子是，有人對微軟及其旗下的`GitHub`網站發起了集體訴訟②，認為`GitHub`的AI輔助編程產品`Copilot`侵犯了一些開源代碼的版權。那些程序代碼本身是開源的，分享和使用都可以，但是有版權，必須保留原作者的署名————而`Copilot`直接把一些代碼交給別的程序員使用，沒有保留原作者署名。


    類似的事情還有：一些藝術家對AI圖片生成網站發起訴訟，因為網站使用他們的作品訓練AI，但是沒給他們補償；還有別的新聞機構起訴 `OpenAI`用他們的文章做訓練。③


    這些案子都還沒有明確的判決結果，我們先觀望。但我希望結果是全都允許，因為讓AI的知識最大化有利於人類進步。


    再看第二個問題。我們必須理解，訓練一個大語言模型是非常困難的，需要消耗很多的算力，餵給它很多的語料。所以你不可能每週都訓練一遍。好不容易訓練一次，模型中幾千億個參數就固定了，法寶就煉製完成了，剩下的就是推理了。`GPT-3.5`應該是2022年煉成的,
    用的語料截至2021年, 非常合理。


    讓`GPT`處理新知識有兩個辦法。一個辦法是在原有模型的基礎上再多喂一些料, 繼續訓練。這個叫「微調」 (`fine-tune`) , 比較費時費力。


    另一個辦法是讓模型臨時「學習」新的知識，這就是 `Bing Chat`和現在網上很多調用`API`讀書的小工具所做的。這本質上不是訓練，而是小樣本學習。這個方法的缺點是能輸入的信息總量有限。


    ### 030 拐 點


    `AI`眼中沒有野生問題，都是馴化問題。一個問題之所以是野生問題，是因為你必須親身參與其中，你自身的命運被它改變，而你不知道你會不會喜歡改變之後的生活。`AI`沒有「自身命運」，
    它不參與生活。


    對`AI`來說，一切都是統計意義上的。你問`GPT`自己去上海生活會怎樣，它能給你的最好答案是「像你這樣的背景、性格，到了今日的上海，最後可能會是一個什麼情況」。如果世界上有
    50個跟你背景和性格相似的人，`GPT`說的是這50個人去了上海之後的「平均值」或者「最可能值」———其中一定會有人跟那個值有較大的偏差。甚至`AI`一開始就說錯了，因為它不可能真的瞭解你。


    這就如同你問我要不要學編程、要不要考研，對你那是野生問題，對我那也是馴化問題。我只能根據我所知的給一個儘可能好的答案，但我終究不是你。


    這就是為什麼「躬身入局」如此可貴。站在場邊評論，總是說啥都行，你可以有各種各樣的理論和道理，其中總有些是正確的。但是一旦你身處其中，那才是「如人飲水，冷暖自知」
    。


    我猜，如果某一天`AI`有了意識，它會非常想要「附身」到某個人身上，親身體驗一下人間的生活———它會有很多絕對沒想到的感受。


    所以很多智者都說人生的意義不是在於證明對錯，而是在於體驗。喜怒哀樂也好，恐懼憂患也好，我們不是站著說話不腰疼，我們在這裡親身體驗，我們承擔一切後果，我們玩的是真的。


