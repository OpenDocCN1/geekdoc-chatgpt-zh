  trans: '

    # 第三章 置身智能，你更像你


    你的安身立命之法，你钻研了十几年甚至几十年的技术，一夜 之间都没有意义了，这是何等令人难过。其实被颠覆的不仅仅 是 NLP 这一个学科，其他 AI 学科，比如机器翻译、传统的语音
    识别技术，包括贝叶斯分析学派，也都面临危机。著名语言学 家诺姆·乔姆斯基(Noam Chomsky) 在《纽约时报》发表了篇文 章抨击 ChatGPT，结果评论区全是骂他的。


    朋友们，新时代来了，很多东西都过时了。最荒诞的是 GPT 并 不是故意要淘汰那些学科的，它可能根本都没想过那些学科， 只是一次幸运的技术突变导致了这一切。毁灭你，与你何干?


    所以「赌」一门过于狭窄的技术是危险的。回到问题上来，数 据科学的应用范围更广，不仅限于 AI。就算将来 AI 接管数据分 析，你还可以用相关的知识帮助别人理解数据和根据数据做决
    策，所以也许相对更安全。


    ## 02 教育：不要再用训练 AI 的方法养人了


    AI 时代，人的教育和成长应该是怎样的?为什么这次创新又是率先出现在美国?传统的教育有没有问题?


    AI 视角之下，我们得重新考虑，什么样的成长才是人的成 长。


    传统的教育是居高临下的姿态。主动权在学校、老师和家长 这些「教育者」手里，学生作为「教育对象」是被动的。以前我 们可以把这种教育比喻成园丁栽培植物：教育者安排好环境，浇
    水，施肥，时而选拔；教育对象根据要求成长。


    但是现在我们有个更精确的类比——那是训练 AI 的方法。


    事先划定学习范围，把标记好什么是对、什么是错的学习材 料喂给受训练对象，然后考核训练结果———这种教学方式，在 人工智能界叫作「监督学习」，是最基本的训练
    AI 模型的方法。 这样教出来的学生连 GPT 都不如。要知道， GPT 主要用的是「自 监督学习」(Self-Supervised Learning) 和「无监督学习」，它
    不用你标记数据，能自己找规律，它天生设定就是能知道老师不 知道的东西。


    但 AI 不是人，至少现在还不是。我们相信每个人身上都有一 些 AI(暂时)无法替代的素质。虽然我们说不清它们是哪些东西， 但是通过跟 AI 对比，我们可以知道它们不是哪些东西。


    简单说，有三个弊端，是传统教育中有，AI 身上也有，但是 人类中的创新者身上没有的。以前你可能都不觉得它们是问题， 但是现在在 AI 视角之下，这三个弊端就非常显眼。


    第一，回报的来源是管理者的认可。这个学生是不是好学 生，由学校和老师说了算，而他们主要看学生的考试成绩和听话 程度。


    第二，高度重视错误。以考试为核心的教育讲究「刻意练 習」和「补短板」，学生必须对自己的错误非常敏感才行，有错 必改，知错必学。


    第三，对教学范围以外的东西、对新事物是不关心的。老师 甚至会督促学生不要分心、少看课外书，把精力都放在「学习」 上。能集中注意力是个重大优点。


    AI 也有这些特点。不管用什么训练方法，对于是好是坏都有 一套相当客观的标准。ChatGPT 出来之后人们都爱给它挑毛病， 对自动驾驶 AI 更是如此，那真是每犯一个错都是大错。AI
    的训 练范围可以很大很大，但是为了让它少出错，你不想喂给它垃圾 信息。


    但是我们看那些创造性人才，什么科学家、艺术家，特别是 企业家，他们正好有三个相反的特点。


    第一， 回报不是来自上级领导的认可，不是因为满足了什 么标准，而是来自社会、来自消费者，有时候甚至是来自自己 的认可。这样的认可没有标准，也许今年的「好」明年就过时
    了。他们甚至可以自己为社会定义什么叫「好」。


    第二，他们并不特别在乎自己做错过什么，不太重视短板，他们 要的是长板。做不好的项目可以不做，他们关心的是，在自己能做好 的项目上，自己是否好到了足以赢得世人认可的程度。


    第三，乐于追逐新事物。越新的东西越有可能让他们获得竞争优 势。


    这样的人大概不怕被 AI 取代，因为他们走的是跟 AI 不一样的成 长路线。他们身上没有 AI 那种机械味，他们有更健全的人格。其中 最重要的一点就是自主性———他们自己判断什么是好、什么是坏，
    自己决定学什么和做什么，想要在世界上留下自己的痕迹。他们是自 我驱动的人。


    这样的人物与其说是被训练出来的，不如说是被纵容出来的。学 术界对此有些新研究，我讲两点。


    一个是积极情绪的作用。


    情绪不只是一种「感觉」。现在最新的认识①是，情绪决定了大 脑当前的心理模式———不仅影响行为，而且影响认知。情绪不只决 定你对情绪事件的看法，而且影响你对其他事情的看法。


    比如，恐惧情绪会让你高估不幸事件发生的概率。如果一 个人刚看完恐怖片，你跟他讨论最近的经济形势如何，他会更容易认为 经济会变差。就算他完全理解经济形势跟恐怖片根本没关系，他的认知
    还是会被影响。


    以前科学家比较重视研究消极情绪，现在意识到了积极情绪的重要 性。积极情绪不仅仅是一种奖励或者享受，还会让你的行为和认知变得 更积极。


    再比如骄傲，一般人认为骄傲是不好的，会让人自满、犯错，但骄 傲这个情绪也会让你更愿意跟别人互动，更愿意分享自己的成果和经 验，能让人更了解你，有利于提高你的地位。这不是很好吗?


    在认知方面，积极情绪最大的作用是让我们更愿意去探索陌生的、 新奇的、未知的事物。如果你很快乐、很热情、有充分的安全感，你会 更敢于冒险，你会更有幽默感，你会更乐于助人。


    美国北卡罗来纳大学的心理学教授芭芭拉·弗雷德里克森(Barbara Fredrickson) 有 个 「 拓 展 —— 构 建 理 论 」( broaden-and-build
    theory ) ①, 认为积极情绪能拓展注意力, 构建心理资源。


    当你处在消极情绪中的时候，比如受到威胁、充满压力，你会把自 己封闭起来，只关注眼前的威胁点。但当你处于积极情绪中，你的视野 就打开了。你会更容易发现身边各种有意思的事情，注意到平时注意不
    到的细节。你的想象力会更活跃，你容易发现新的想法连接，激发创造 力。这就是「拓展」。


    积极情绪中的乐观、安全感、感受到别人的支持和关爱，这些 都可以积累起来，成为心理资源。将来面对挑战、遇到挫折和不幸 的时候，这个心理资源会让你更勇敢、更有韧性。这就是「构
    建」。


    你的积极情绪还会影响周围的人，别人会更愿意跟你合作， 能带来新的社会关系，这也是「构建」。


    这可能就是为什么发达国家的研究①表明，创新型人才更多出 身于富裕家庭——他们既有余闲，也有余钱，从小见多识广，不用 整天只想着考试。


    但是光有积极情绪好像也不行。有些人确实是财富自由了，家 里有十几套房能收租，但好像没表现出什么创造力。他们的注意力 确实被拓宽了，整天讲究一些平常人不讲究的东西，比如戴个手
    串，弄个「古玩」，吃个饭还要有一大堆规矩，等等，敏感度都用 在没用的地方。这些人差的是什么呢?


    是动机。这就是我要讲的第二点,「动机强度」(motivational intensity)。动机强度高，意味着平白无故地、没有任何人要求 你，你自己就非要去做一件事，而且非要做好，这是你自己对自己
    的驱动。


    积极情绪让人把注意力拓宽，动机却要求你把注意力收紧。


    一系列研究①表明，动机强度跟人的欲望和情绪波动有关。


    有个实验是这样的：研究者给一部分受试者看小猫的视频，这能 带来愉悦感，但是是一种低动机强度的愉悦感；另一组人看的则是美 味甜点的视频，食物能调动人的欲望，提供高动机强度的愉悦感。


    看完视频，受试者马上接受认知测试。结果发现，那些看小猫视 频的人，思路确实拓宽了，也的确更有创造性，但他们没有强烈的动 机去做更多的思考；而那些看甜点视频的人，会更愿意为了解题去挖
    掘更多的细节。


    所以，有创造性是一回事，真愿意去创造是另一回事。你光想到 一个好主意还不行，你还得有自驱力，把握这个稍纵即逝的时机，不 眠不休「爆肝」几星期，赶紧把产品做出上线！


    创造力和动机强度都高，才是真正的创新型人才。


    这样看来，创新型人才的情绪最好经常在两种模式中切换。平时 是积极模式，有个好心情，视野开阔，对新事物特别感兴趣，总能发 现新机会，一边还构建着心理资源和社会资源。但是一旦认准一个方
    向，那就要切换到高动机强度模式，把注意力和精力都聚焦在项目 上，非得完成不可。


    平时扫描新机会，找到新机会又能聚焦，这才是最理想的状态。


    从脑神经科学的视角出发，这相当于大脑在负责想象力和自发 性的「默认模式网络」、负责评估信息重要性的「突显网络」以及负 责专注和执行的「中央执行网络」之间快速、
    自如 地切换。这是创新型大脑的典型特征。


    这样的人既积极，又自由，还常常体会到积极和自由之间的 矛盾状态。从外在看，他们情绪经常挺好，但不总是那么好，有 时候会一惊一乍，会激动也会愤怒， 时而兴高采烈，
    时而垂头 丧气，但绝不是一个木头人或者工具人。


    这种一惊一乍的情绪波动，恰恰是社会地位高的特征。研究 ①表明，同样是女性，如果是高管，往往会经历更多的情感和动机 之间的矛盾，总有些事她们特别想做又觉得不该做，她们又想行使
    权力又怕损害关系。基层女员工的情绪则是比较平稳的。


    快乐让人积极，积极让人开拓视野；宽容让人自由， 自由让 人自我驱动。


    要想培养出创新型人才，需要家庭和社会两方面提供条件。


    家庭最好是富足的———至少让孩子感觉不缺什么东西， 日常情 绪都比较积极正面；社会则必须是宽容的，这意味着如果一个人 上头了，认准一件事非得干，你先别管好坏，尽量允许他折腾。


    相反，如果一切都以考试为中心，什么都讲究做「对」，讲 究符合标准。这会让学生处于动辄得咎、充满威胁感的状态， 始终处于压力之下。考个 95 分还觉得自己不够努力、不够完美，
    说下次要考 100 分。真考了 100 分，又担心下次能不能再考 100 分。这样的人视野必定是狭窄的。


    面对一个新事物，忧患者看到的是危险，快乐的人看到的是 机会。长期面临各种考核的压力，轻则让人得胃溃疡，重则让人 产生习得性无助。


    AI 式教育最大的问题是学生缺乏自主性。什么都是别人要他 做，而不是他自己要做。机器天生就是被动的。人最不同于机器 的特点就是想要主动。从小受气、在家和学校处处被动的人，等
    长大后真可以主动了，往往不会往正事上主动。


    孩子如此，成人也是如此。一天到晚抠抠搜搜、战战兢兢， 好不容易取得点成绩还要保持低调，该快乐不敢快乐，永远被人 管束，下班到点了都不敢走，真遇到机会也没了动力，这样的人
    能有多大出息?


    在有 AI 的时代，我们要好好想想怎么养育一个人，而不是 训练一个人。


    创造型人才的特点是可以养他，但是你不能控制他。早期 可以给他一定的指导，随着成长，你要逐渐放开———自主权在 他自己手里。要想指望他做出你意想不到的好事，就必须容忍他
    做出你意想不到的「坏」事———一些你不想让他做，甚至原本 打算禁止他做的事。


    对 AI 可以管，对人才只能「惯」。其实让孩子自己折腾， 他也翻不了天，还会慢慢成熟起来。只有这样你才能得到一个 完整的人。你必须遏制自己的控制欲。你只能等待。


    ### 问答


    #### 问 杰克逊


    看美味甜点视频调动的欲望，不是种低层次的需求(生理需求) 吗?而看小猫视频对应的肯定比生理需求还高。为什么相较之 下，反而低层次能调动高动机?


    #### 万维钢


    我们的大脑并不是一个非常理性的计算系统，而是一个生物系 统。正文里讲了，情绪改变的不仅仅是你对情绪事件的看法， 更是你彼时彼刻整体的认知模式，这会连带影响你对其他事情
    的看法。


    就动机而言，关键影响因素大概是多巴胺。美味甜点会刺激人 的食欲，食欲调动想要吃东西的动机，这个调动过程需要用到 多巴胺。也就是说，美食视频让大脑产生了更多的多巴胺。而
    多巴胺一旦分泌出来，就不仅仅作用在「想吃东西」这个动机 上，它是一种通用的动机燃料，对其他事情也有促进作用。


    我还看过一个研究，性感美女的图片能让人在长远利益和短期 利益之间更愿意选择短期利益。这大概就是多巴胺来了，我们 总想立刻马上采取行动得到想要的东西。


    蒙洛迪诺(Mlodinow) 的《情绪》这本书中有个实验。老鼠很 喜欢喝糖水，对糖水可以说是既喜欢，又想要。研究者阻断了 老鼠大脑中的多巴胺，再把糖水放在它嘴边强行给它舔，虽然
    它还是表现出享受的表情，还是很喜欢，但是它再也不会主动 去喝糖水了。阻断了多巴胺，老鼠完全失去了对食物的动机— ——研究人员如果不强行喂它食物，它宁可饿死也不主动去吃
    东西。


    所以，动机本身就是一个生理需求。如果一个人太过「佛 系」，对什么都无所谓，没有动机，你会觉得他的生命力有 问题。如果 AI 突然有了动机，你会觉得它是不是要活了，你
    可能会感到威胁。


    #### 问 烏尚書


    在教育体制不变的情况下，如何平衡让小孩自由发展和让他 在现有体制下取得更好成绩之间的矛盾呢?


    #### 万维钢


    这的确是个矛盾，但是这里面有可操作的空间。我建议你考 虑三点。


    第一，准备考试这个活动，过了一定的线，就有边际效益递 减的特点。如果投入 70%的精力已经可以考个 80 分或 90 分，而 就算 100%全情投入也只能考
    85 分或 95 分，那么全情投入就是 不值得，甚至可能是有害的。对考试只做有限的投入， 同时 尽量不耽误生活中的其他追求，也许更容易考好。像有些中 学要求学生早上跑步还要捧本书，那纯属精神病。


    第二，家庭条件越好，考上好一点的大学还是差一点的大学 的区别就越不重要。


    第三，可能因为千年科举文化的影响，很多人认为什么好事 都是「考」出来的——考完大学考研，考完研考公， 当上公 务员也仍然时刻准备下一次考核……这是活在了扭曲的现实
    之中。真正的好东西应该是交换回来的：不要问社会能给自 己什么，要问自己能给社会什么。建立藐视考试、重视真本 领的心态，不但有利于成长，而且有利于考试。


    ## 03 专业：代议制民主和生成式 AI


    这一波 AI 浪潮的一个特点是「生成式」(generative), 也就是 「GPT」中的「G」。以前人们无论用 AI 预测分子的化学性质还是下 棋打游戏，都是让
    AI 完成非黑即白的任务，达成一个简单结果。现在 你无论用 ChatGPT 写文章、编程, 还是用 Midjourney 画画，都是在让 AI 帮你「生成」内容，收获一片繁华景象。


    比如下面是一幅我用 Midjourney 画的画。(图 3-3)


    ![](img/index-135_1.jpg)


    画面中有个巨大的 UFO 悬浮在一座大金字塔附近的天空 中。那个 UFO 亮着灯，似乎有很多扇窗户，明显不是地球文明的产 物。地面是一片荒凉的大漠景色。很多人抬头看，他们三五成
    群，或站或坐，也许有几十或者上百人。


    在交稿前这幅画只有我看过，这就是我的画。你觉得我在这幅 画的创作过程中做了多大贡献呢?


    其实我的主要贡献是一句话：「UFO 在古埃及飞行。人们抬头 看。」外加几个参数。


    这叫「prompt」, 当动词当名词都可以, 表示对 AI 提(的)要 求，也可以翻译成「念咒」或者「咒语」。


    画面全都是 AI 生成的。


    但我还有别的贡献，也许是更重要的贡献。


    AI 最初生成的是下面这 4 幅画，都是古埃及壁画风格。(图 3-4)


    ![](img/index-136_1.jpg)


    我认为画得不够好，就让它重新画。当然，我这么做只需要 点击一个按钮，但这毕竟也是一个贡献。然后它又生成了 4 幅画。(图 ꣀ ц坐


    ![](img/index-137_1.jpg)


    这回我觉得有一幅不错，就让它把这幅画做出几个变体。


    ![](img/index-137_2.jpg)


    然后我选定了其中一幅，并且让它细化成了最前面展示的那 一幅。


    这个过程可以重复很多次，AI 不怕你折腾，直到你选到满意 的为止。你可以提更细的要求，指定画面中更多素材，指定绘画 风格⋯ ⋯ 但是归根结底，是 AI 在画，你只是先提要求(prompt),
    后选择。


    用 GPT 生成内容也是这个精神。这跟传统的应用软件截然不 同。用传统软件画画，画面中每一个细节都是你自己设计的，计 算机是纯粹的工具。现在 AI 则承担了几乎全部的创作工作。所
    以我们才会有一种时代变了、AI 要活了的感觉。


    当然，你提出 prompt 和做选择也是一种创造，因为这个过程 体现了你的见识和品位——一个专业科幻画家肯定比我做得好。 我们大概也可以说「念咒即创造」，「选择即创造」。


    但关键在于这个创造过程不完全属于你自己：最初是你提的 要求，最终是你做的选择，但是整个过程并不是你完成的。你有 掌控感，但是你并没有———也不需要，也不应该——完全控
    制。但是你真的很有掌控感。


    我们跟 AI 的这种「prompt 一生成一选择」关系，并不是新 的。


    ![](img/index-138_1.jpg)


    事前提要求，事后决定满意不满意，中间尽量少干涉——老 板对员工不也是这样吗?甲方对乙方不也是这样吗?都是后者在生 成，但双方共同创造了最终结果。


    老板和甲方在这个关系中的美德是尊重生成者的专业技艺。 让 AI 画 到 特 别 好 可 能 不 容 易 ， 但 我 觉 得 最 有 意 思 的 是 ， 让

