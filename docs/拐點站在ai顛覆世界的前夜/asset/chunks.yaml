    無監督學習就更厲害了，因為它根本不需要你對訓練素材進行任何預處理，你不需要告訴AI你想要什麼，直接一股腦地把素材都餵給AI就行，AI會自行發現素材中的規律。GPT之所以能學習天量的語料，就是主要使用了無監督學習的方式。


    無監督學習主要用於「生成」，它追求的是「像不像」。

    GPT 生成文章、Midjourney生成照片是生成，給幾塊甲骨文片片段讓AI幫助補全龜甲中殘缺的部分也是生成，給定一小段鹼基對讓 AI生成蛋白質結構也是生成。生成式
    AI可以做很多事情。


    強化學習則是尋求對一些指標進行優化，讓它們處於一定的範圍之內，它的作用是「控制」，它追求的是「好不好」。像下圍棋、自動駕駛，包括前文講的用AI控制核聚變等離子體構型，都是強化學習。


    這些方法的本質是用一定的輸入、輸出數據訓練一個神經網絡，再用這個神經網絡讀取新的輸入並生成輸出。在這個過程中，你眼中可以只有數據———你甚至不需要關心那些數據出自哪個學科，不需要知道它們的物理意義是什麼……


    2023 年 8 月，馬斯克展示了特斯拉最新版的自動駕駛 AI (FSD Beta v12)。①這一版的特點是，整個程序中沒有一行代碼告訴AI遇到減速帶要慢行、需要避讓自行車、交通信號燈是什麼意思———系統沒有注入任何交通規則，神經網絡自己從輸入到輸出悟出了一切。


    這些方法的細節是相當精巧的，但是跟任何學科的人類知識相比，這些絕對是非常簡單的方法。它們之所以厲害，根本的原因是算力———超強的運算速度和便宜而海量的數據存儲成就了一切。


    在算力的加持之下，2022 年底以來 GPT 的表現，給了我們第三個教訓：人是簡單的。


    GPT-3有1750億個參數。OpenAI沒有公佈, 但是網上傳說GPT-4有1.8萬億個參數。這些數字無疑非常大，但是在指數增長的算力面前，還是很有限。而就是這樣有限的模型，竟然抓住了人類幾乎所有平常的知識。


    GPT-4有人類的常識，能看懂照片，它能做包括編程和寫作在內的人能做的很多事情，它懂的比任何人都多……我認為它就是 AGI。它是一個語言模型，它是用語料訓練出來的，但是不知怎麼，它抓住了語言背後的、難以言傳的東西。它可以用語言表達一些我們人類還沒有來得及用語言表達的東西。


    AI語言、AI畫圖、AI判斷和AI控制，做的是不一樣的事情，但是基本原理是一樣的。為什麼?沃爾夫勒姆對此的洞見是，AI只是抓住了「像人」的東西。


    而這說明「人」其實是簡單的。簡單到這麼有限的算力就能把我們搞明白。「人」究竟是什麼?我們能不能借助AI對人有個突破性的新認識?


    這肯定意味著一些更大的可能性，不過我們目前所能看到的，有兩個展望。


    ![](index-238_1.jpg)


    一個是 AGI會在所有領域參與人類工作。


    當前國內外主流公司都專注於搞自己的大模型，但是對模型的應用還遠遠沒有展開。這可能是因為當前AI算力還太貴，GPT一次能記住的用戶本地信息還很有限，不容易搞高度量身定製的服務。


    不過已經有人在做這件事了。有個臨時性的辦法是把本地信息「矢量化」，就是進行某種程度的壓縮，讓GPT能多記住一些；但更根本的辦法是把GPT拿過來用本地信息微調。OpenAI已經開放了GPT-3.5，後來又在一定範圍內開放了GPT-4的微調服務。


    所以，我們會很快看到像個人助手、家庭醫生、一對一家教之類切實為你量身定製，還掌握了專業知識的 AI服務，那才是真正改變生活方式。


    ![](index-239_1.jpg)


    另一個展望是，所有科研領域都應該用 AI。


    DeepMind做的事情基本上等於手裡拿著個大規模殺傷性武器，對各個科研領域進行碾壓式的打擊。除了被廣泛報道的圍棋、電子遊戲、蛋白質摺疊、天氣預報、控制核聚變等離子體，他們還用AI幫助破解了2500年前用楔形文字寫成的文本①，還開始幫數學家證明定理②……


    還有哪個領域是DeepMind不能進的?他們不是不能進，而是暫時來不及進。DeepMind就如同孟子當初夢想的那個「王道」之師，「東面徵而西夷怨，南面徵而北狄怨」。他們殺向生物學的時候，物理學家說，你們怎麼還不過來解決我們的問題！他們殺向考古學的時候，數學家說，我們也能用上AI啊！


    請問歷史上還有哪個東西是這樣的?


    可能是因為算力還比較貴，更可能是因為大多數人還沒學會訓練 AI，現在的局面還是少數會用AI的人四處挑選科研課題做。但下一步必定是各路科研人員自己學會用AI。大殺器必定擴散。


    如果我是個理工科研究生，我現在立即馬上就要自己學著訓練一個 AI模型。趁著大多數人還不會用，這是一個能讓你在任何領域大殺四方的武器。


    世間幾乎所有力量的增長都會迅速陷入邊際效益遞減，從而變慢乃至停下來，於是都有上限。唯獨計算機算力的增長，目前似乎還沒有衰減的跡象，摩爾定律依然強勁。


    如果這個世界真有神，算力就是神。


    你要理解這個力量，擁抱這個力量，成為這個力量。


    ## 問答


    ### 問 sammi


    萬老師您好，我是名認知科學的研究生，能請您分享下如何自己學著訓練一個AI模型嗎?


    ### 萬維鋼


    自己訓練一個AI模型是非常可行的，而且有很多人都在這麼幹了。愛爾蘭的一個女高中生用一臺筆記本電腦就訓練成了AI，把它用於宮頸癌篩查，而且取得了應用價值。布魯薩德(Broussard)在《人工不智能》(Artificial
    Unintelligence)這本書裡講過一個手把手的AI實戰案例————用機器學習預測泰坦尼克號輪船上旅客的存活情況。①


    關鍵在於，現在已經有很多現成的工具供你使用。而且我們個人要的不是GPT那樣的大語言模型，如果要用那種也應該是把現成的模型拿過來，我們只需要用本地數據微調，而不是重新發明輪子。我們要訓練的是「專用AI」，也就是針對特定問題、特定數據的模型。


    我能想到的一個適合業餘選手快速學習的攻略差不多是這樣的。


    第一，你需要對「機器學習」的基本原理有個大致瞭解。


    從頭開始讀教科書就太慢了，而且不容易抓住重點，最好的辦法是看網上的視頻課程。吳恩達的Coursera網站有好幾門機器學習課，其中至少有兩個是完全入門級的，而且是免費的：


    斯坦福大學的機器學習課:

    `https://www.coursera.org/specializations/machine-learning-introduction`


    人人學AI: `https://www.coursera.org/learn/ai-for-everyone`


    第二，你需要上手完成一個小項目。


    前面說的那些課程中已經提供了項目，我估計數據和代碼都是現成的。或者你可以上網找一個現成項目，就像前面說的那個泰坦尼克旅客名單項目一樣。


    這一步純粹是為了練習和找感覺。哪怕你完全是照著人家的步驟一步步操作出來的，當你親手訓練成一個AI，看著它輸出正確結果的時候，那種欣喜可比打遊戲通關什麼的高級多了。


    在這個過程中你會體會到一些細節，比如數據的結構和格式，你得考慮，怎樣把一組數據整理成容易餵給AI的格式?你得有這個意識才行。


    第三，也是最大的難點，是你需要取得數據。


    你想做的項目可能沒有現成的數據。就算有數據，往往也是非格式化的，不能直接餵給AI。為此你必須對數據進行一些預處理，這會花很多工夫。


    第四，開始正式的訓練。


    好消息是，Google、亞馬遜和微軟現在都提供標準化的雲計算AI訓練服務，各種工具都是現成的，上傳數據後基本就能開練。Meta還提供了開源的程序包。


    當然，其中的每一步都有很多細節需要動手時才能搞清楚，你必須多搜索、多問。但是那些問題往往都有現成的答案，因為你不是一個人在戰鬥，你是加入了一個社區——世界上有很多很多人都在做這件事。


    而這也說明一定的英語能力和一定的編程基礎的重要性。你不需要精通，只需達到能用的水平，這沒有很高的門檻，但是無數的聰明人恰恰就被這兩道簡單的門檻擋在了門外。


    ### 問 你先走


    在算法、算力、數據三者之中，到底哪一個更容易成為短板?假設算法差不多，A國算力強，但數據保護比較嚴；而B國算力相對不足，但數據比較易得。誰更容易在AI競賽中領先?


    ### 萬維鋼


    目前來說，算力是最容易彌補的短板。英偉達最新的GPU買不到的話，買到差一點的也能用，而且還可以租用雲服務，這是花錢就能解決的問題。


    算法方面，一般的應用沒有問題，有大量開源的資源；但是像GPT-4這樣的頂尖應用，其中有很多細節沒有公開，是追隨者難以模仿的。決定算法強弱的根本是人才，尤其是頂尖人才在哪裡。


    數據存在一個問題，就是對很多應用來說，一國的數據難以被遷移到另一國使用，所以數據多不見得是優勢。還有一個問題是，數據再多，如果被設置了各種壁壘，這家的不讓那家用，尤其公共數據都被保密的話，那就更不行了。


