    ## 02 经济：AI让调配资源更有效


    據說因為AI替代而導致裁員最多的就是保險公司。這挺合理，畢竟保險業務最重要的就是做預測，而在這種數據密集的領域，AI很擅長預測。


    以房屋保險為例，所有業務可以分成3個主要決策——

    1.營銷：分析潛在客戶人群，看看他們的價值有多大，能轉換成客戶的概率有多高，再決定下多大功夫去爭取；

    2.承保：根據房屋的價值和出事故的風險，計算合理的保費，要既能讓公司盈利，又能在市場上有價格競爭力；

    3.理賠：一旦房子出事，客戶索賠，要評估索賠是否合理合法，加快理賠進度。


    這些決策中的預測部分都可以交給 AI。現在有些保險公司已經把理賠給自動化了。比如，你家屋頂被冰雹砸壞了，保險公司並不需要派人去現場查看——你自己拍張照片發過來，AI
    看一眼就能給你估價，該賠多少錢直接辦理，省時省力。


    但這只是點解決方案。系統解決方案是，保險公司不僅要跟你算錢，還會干預你對房屋的保養。


    現在的保險公司看到房屋風險比較大，就提高保費。AI化的保險公司看到風險大，會以保費為槓桿，要求客戶採取行動降低風險。


    第二章 當 AI進入人類社會 067


    比如，美國49%的房屋火災都是在家做飯導致的———主要是油炸這種烹飪方式。可有些家庭從來不做油炸食品，有些家庭經常搞油炸，讓這兩類家庭為火災保險交同樣的錢，就不太合理。以前保險公司不得不對他們收一樣的保費，是因為不知道誰家風險更高。


    現在保險公司可以這麼幹。問客戶可否在廚房安一個裝置，每次炸東西裝置就自動記錄下來。客戶第一反應肯定是不同意，說這涉及隱私。但 AI預測足夠精確的話，保險公司就可以跟客戶談，如果允許裝這個裝置，保費可以降低25%。你覺得客戶會不會接受?


    再比如，保險公司根據AI預測得知，你家房子的水電管線有點老化，容易出問題。它可以主動給你提供補貼，讓你把家裡的管線修繕一下。


    目前，保險公司還不願意這麼做，因為這意味著實際保費會率先降低——保險公司更喜歡加價而不是減價。但如果 AI足夠精確，保險公司就可以看到災害切實減少，理賠費用一定會降低，那麼它的利潤是增加的。這麼做就有雙重的好處，不但保險，而且減災。


    而這一切都只有在 AI能把賬算得非常清楚的情況下才能實現。


    068 拐 點


    醫院急診室有個特別常見的狀況是病人胸口痛。對這種情況，醫生必須判斷是不是心臟病，是心臟病就得趕緊處置。但問題是，急診醫生並沒有很好的診斷方法。


    通常的做法是搞個正式的檢查，而心臟病檢查對患者是有害的。準確的測試需要用心導管之類，會直接給身體造成創傷；哪怕只是做個簡單的X光或CT，也有輻射。


    於是，有兩個經濟學家發明了一套AI診斷系統，能根據患者外表的幾個症狀指標預測是否患心臟病、是否需要進一步正式檢查。


    研究表明，這套AI系統比急診醫生的診斷更準確。


    跟 AI系統的診斷結果對比發現，很多不應該做有創檢查的患者被急診醫生要求去做了有創檢查——這似乎可以理解，畢竟讓患者做檢查醫院可以多收錢。AI系統還發現，有很多應該去做檢查的病人，急診醫生卻打發他們回家了。有的患者因此錯過了治療時間，甚至導致死亡。


    這麼看來，改用AI診斷，不但對患者大有好處，對醫院也有好處。醫院的工作流程不需要改變，診斷時間還減少了，也沒少收錢，對吧！


    可是事實證明，醫院大多不願意採用 AI。


    醫院，是一種非常保守的機構。可能正因為有太多新技術等著醫院去採納———每採納一個新技術，都要重新培訓醫生，重新審議流程；新技術還有風險，測試時挺好的，一旦用上了，可能會有問題；新技術還會影響各部門的權力分配，產生各種連帶問題⋯
    ⋯ 所以醫院要改革是最難的，它很不願意採納新技術。


    第二章 當AI進入人類社會 069


    但如果醫院可以系統性地採納AI診斷，急診室會變成什麼樣呢?


    某人感到胸口痛，打電話到醫院。醫院AI通過他對症狀的描述，也許再結合他身上智能手錶的讀數，能直接預測是不是心臟病。醫生根據AI的報告，如果判斷這個人沒事，就讓他不用來醫院；如果判斷的確是心臟病發作而且很嚴重，就直接派救護車過去。救護車上的醫生還會攜帶能緩解心臟病的儀器，到病人家裡先採取一些手段，爭取搶救時間。


    這是對整個急診流程的改變。


    任何組織都可以被看作是決策組織。《權力與預測》這本書裡搞了一個應用AI的戰略方案，是從填一個表格開始。(表2-1)


    表 2-1

    1\. `Mission`(任務)

    2\. `Decision`(決策)

    3\. `Prediction`(預測)

    4\. `Judgement`(判斷)


    表格的第一項是組織的核心任務。無論有沒有 AI，這個任務都是固定不變的。


    070 拐 點


    然後把核心任務涉及的幾個決策都列出來，標記好這些決策是由哪些部門來做的。


    再把每一項決策分成「預測」和「判斷」兩部分，列出目前都是哪些部門負責的。


    再考慮如果把預測都交給 AI，涉及的各個部門會受到什麼影響⋯ ⋯ 按照這個思路去考慮組織機構的變革。操作細節這裡就不講了，我們重點看趨勢。


    從 AI的點解決方案過渡到系統解決方案不會用很長時間，因為點解決方案有一個驅動系統解決方案的趨勢。


    這本書裡有個特別好的例子是開餐館。假設你開了家餐館，準備食材是個有關「不確定性」的遊戲。客人只能點菜單上的菜，這給你提供了一定的方便，你只要準備特定的幾種食材就行。但客人點菜具有波動性，有一陣流行這個，有一陣流行那個，食材消耗是不確定的。以前你每週都訂購100斤牛油果。有時候100斤太多了，沒用完得扔掉；有時候又太少，客人點了這道菜卻沒有。


    現在你用上了 AI，AI能精確預測下週大概需要訂購多少牛油果。於是你有時候訂30斤，有時候訂300斤，減少了浪費，還保證了供應，餐館的盈利提高了。


    但是請注意，因為你的不確定性減少了，你的上游供應商出貨的不確定性反而增加了。他很喜歡你每週都訂100斤，現在你變來變去，他的銷售就產生了波動。他怎麼辦?只好也用上
    AI。


    第二章 當AI進入人類社會 071


    以前他每週固定採購25000斤牛油果，現在他有時候訂5000斤，有時候訂50000斤。那他的上游會怎樣? 也得用AI預測市場波動才行。


    因為一家企業的波動而引起整個供應鏈的大幅波動，這在供應鏈管理領域叫「牛鞭效應」(`Bullwhip Effect`)。牛鞭效應會導致庫存增加、服務水平下降、成本上升等問題。這個思想實驗告訴我們兩個道理。


    一個道理是，要用AI，最好整個社會一起協調，大家都用AI。另一個道理是，應用AI可能會在一時之間放大社會波動，我們最好小心行事。


    ![](index-86_1.jpg)


    怎麼減少 AI對社會造成的震動呢?一個好辦法是先模擬。講個有意思的故事。美洲盃帆船賽是一項歷史悠久的賽事，但是參賽隊伍都很講究科技應用，他們一直在想辦法改進帆船的設計。這裡面有個很有意思的動力學規律，就是帆船設計變了，操控帆船的技術也得跟著變才行。運動員得找到操控這個新設計的最佳方法，才能知道這個設計到底好不好。


    傳統方式下，每設計出一個新型帆船，得讓運動員先嚐試用各種不同的方法駕駛它。運動員要熟練掌握一個新方法是需要時間的，好不容易掌握了，還不知道是不是最好的。也許換個設計，用另一套駕駛方法，效果會更好……可是那麼多搭配，運動員哪有時間一次次訓練新方法呢?這裡創新的瓶頸是運動員。


    072 拐 點


    2017年，新西蘭隊跟麥肯錫諮詢公司共同發明了一個新辦法，那就是用AI代替運動員試駕新帆船。


    設計好一個新帆船，先用AI模擬運動員的操作，然後用強化學習的方法把AI訓練好，讓AI找到駕駛這種船型的最佳方法。這個速度比人類運動員可快太多了。


    當然，真正的比賽中不能讓AI上場。但是找到船型和操控方法的最佳組合之後，可以讓 AI教人類運動員怎麼駕駛帆船。就這樣，運動員不用參加反覆的試驗，就學會了最佳操控方法。


    這個故事的意旨是，有什麼新方法可以先在模擬環境中演練。


    事實上，就在2022年，新加坡已經搞了一個「數字孿生體」(`Digital Twin`)，一比一復刻了一個虛擬新加坡。開發這套系統用了幾千萬美元。現在新加坡政府搞城市規劃，什麼動作都可以先在虛擬新加坡裡測試一下。


    比如，新加坡想用 AI管理交通，擔心會不會對整個系統造成比較大的波動，就可以先在虛擬新加坡裡測試一下這個做法。


    現在的趨勢就是，從個別公司在個別任務上使用AI到系統性地使用AI，再到整個社會圍繞 AI展開。AI會讓我們的社會變得更聰明。在這個過程中，企業和政府部門都有大量的工作可以做。


