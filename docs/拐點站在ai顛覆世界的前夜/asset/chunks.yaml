    前言：人要比AI兇


    如果你不記得自己在2023年3月15 日那天的日程，我建議你


    現在就回想一下……因為若干年後，你的子孫後代可能會問你： GPT-4發佈的那一天，你在幹什麼?


    GPT-4不是「另一個」AI模型。它的某些能力讓最資深的AI專


    家也深感震驚，以至於直到現在還沒有人真的理解它為什麼這麼


    厲 害 。 它 讓 我 們 第 一 次 感 到 「 通 用 人 工 智 能 」( Artificial


    General Intelligence, AGI) 真的要來了。它也讓世人第一次切


    實感受到了 AI對人類的威脅。


    2023年是 AI元年。有些業內人士相信AGI將會在2026年左右


    實現。這意味著 AI在所有認知領域———聽說讀寫、判斷病情、


    創作藝術，甚至從事科學研究———都做得像最好的人類一樣


    好，甚至更好。我認為在某種意義上GPT-4已經是弱版的AGI，它


    掌握的醫學知識超過了所有醫學院學生，它參加律師資格考試的


    成績超過了90%的考生。這一波GPT 革命每天都有新突破，我們仍


    然在探索之中。


    其實我們早就開始探索了。早在2020年7月 30日，我在《精


    英日課》的專欄裡就介紹過一個「好到令人震驚的人工智能模


    型」①———OpenAI公司的GPT-3。


    GPT-3 的功能已經相當了得，它可以根據你的一段描述給


    ①萬維鋼，《GPT-3：一個令人震驚的人工智能模型》，得到 App 《萬維鋼·精英日課第4季》。


    2 拐 點


    你寫一段程序，可以幫你寫段文章，可以相當智能地回答你的問 題，等等，只是水平沒有那麼高。而且當時OpenAI沒有開放普通用 戶註冊，我們不能上手，感受不深。


    2022年底, OpenAI推出了對話應用 ChatGPT, 這回大家都可以


    體 驗 GPT-3 了 。 2023 年 2 月 1 日 , ChatGPT 升 級 到 收 費 的 ChatGPT


    Plus, 它背後的主力模型變成了 GPT-3.5, 繼而是 GPT-4；接著，


    ChatGPT有了插件功能，它能上網，還能讀取和處理數據；後來又 升級到有多模態功能的GPT-4V，然後是個人定製的GPTs和GPT商店,


    甚至 2024年會出來 GPT-5……如果你把AI 視為人類的敵人，這短


    短的一年多，你應該一日三驚。


    截至2023年底, ChatGPT的月活用戶數量已經超過15億,仍然供


    不應求，以至於 OpenAI不得不一度關閉了收費用戶的註冊。這是


    比包括個人電腦和智能手機在內的歷史上任何一項科技都更快的普


    及速度。


    但是包括某些行業資深人士在內，很多人都不理解 GPT到底是


    什麼。


    一個流行的錯誤認識是把它當成了一個聊天機器人。


    有人拿各種腦筋急轉彎的題目逗 ChatGPT： 「樹上 10只鳥，


    開槍打死1只鳥，樹上現在有幾隻鳥? 」ChatGPT的早期版本會老老


    實 實 地回 答 「 還 剩 下9 只 鳥」 ， 人 類說 「 哈 ！ 你還 是 不 夠 聰明 啊」。


    2023 年底的 ChatGPT已經知道「其餘的鳥由於受驚嚇很可能


    會飛走，所以樹上可能不會剩下任何鳥」，但這不重要。要知道 ChatGPT 並不是一個聊天機器人———它不是一個以陪你聊天解 悶為目的的機器人。


    前 言 3


    ChatGPT 是一個使用GPT 模型、以聊天方式為界面的信息處理工具。


    它這個界面做得如此之好，以至於人們把界面當成了主體，這就如同稱讚


    一部手機「哎呀，你這個手機真好看」。殊不知聊天只是輸入、輸出的手 段，處理信息才是目的。我們關心的是作為大腦的GPT 模型。


    你不用ChatGPT 也可以直接調取GPT模型，比如，現在已經有成百上


    千家小公司用API(應用程序編程接口)接入了GPT，讓GPT 讀取特定環境下 的文本，完成信息處理。你可以用GPT:


    編程①;


    以問答的形式學習一門知識；


    在中英文之間進行高質量翻譯；


    修改文章，或者根據你的意圖直接寫文章；


    獲得書名、 大綱、 小說劇情、廣告等文案的創意構思；


    幫你制訂購物清單、旅行建議和健身計劃；


    分析你上傳的數據文件並且畫圖；


    上網瀏覽， 調用第三方工具；


    理解並生成圖片和聲音；


    直接操控你的計算機；


    通過現場編程操控機器人；


    ……


    ① 現在普遍認為 ChatGPT的編程水平比文字處理水平高，這可能是因為 編程是一種更規範的活動。


    4 拐 點


    而 2023年這一波AI大潮中可不只出現了 OpenAI的GPT。


    Google (谷歌)、Meta(美國互聯網公司, 前身是 Facebook)、馬 斯 克 的 X ( 原 推 特 ) 等 公 司 都 有 自 家 的 大
    語 言 模 型 ， 還 有 Midjourney、Stable Diffusion等專門畫圖的模型, 年底還出現 了一波用文字直接生成視頻的模型，特別是2024年年初出來的
    Sora，震撼了世界，中國這邊則有「百模大戰」，等等。它們背 後的基本原理跟GPT是一樣的。


    很 多 人 說 這 類 技 術 叫 「 生 成 性 AI」( 中 國 的 說 法 叫


    AIGC )，但我看這個說法還是沒有抓住大圖景。這一輪AI突破的 意義不僅僅是能生成內容。


    大圖景是，AI已經開始非常嚴肅地做傳統上我們認為只有人


    能做的事情了。它們的智能正在超過我們。


    ![](index-10_1.jpg)


    隨著 AI能做的事情越來越多，有一個問題也被討論得越來


    越多——AI到底降低了人的價值還是提高了人的價值?


    這取決於你怎麼用它。


    把事情直接交給AI做，是軟弱而且危險的。比如你想給人寫


    封信，怕自己寫得不夠禮貌周到，就讓 ChatGPT 替你寫。它的 確可以寫得很好，寫成詩都可以——但是，如果讀信的人知道你 是用ChatGPT 寫的, 或者對方因為也會用
    ChatGPT, 根本懶得讀 全文，選擇讓ChatGPT 做個摘要，那你這封信還有必要走 AI這 道程序嗎?難道 AI的普及不應該讓大家更珍視坦誠相見嗎?


    前 言 5


    演員鄭伊健在一部賽車電影裡有句話叫「人要比車兇」，指的


    是人一定要比工具強勢。強勢的用法，是把 AI 當作一個助手、一 個副駕駛，你自己始終掌握控制權——AI的作用是幫你更快、更好 地做出判斷，幫你做你不屑於花時間做的事情。人要比
    AI兇。


    如果你足夠強勢，當前AI對你的作用有三個。


    第一是信息槓桿。


    想要了解任何信息都能得到答案，這件事在有搜索引擎以前是


