    你就是能感覺到，而且是快速感覺。這是跟形式邏輯截然不同的 計算路線，以至於我們平時都不會把它稱為計算。

    神經計算和形式邏輯之間有個交集，這是因為人腦也會算些簡單的數學題，但算數學題不是我們最擅長的。我們更擅長的是 用神經網絡直接感知一個複雜的東西。

    比如，當你看見一隻貓的時候，你知道那是一隻貓——這個能力看似平常，卻是幾乎無法用形式邏輯描寫的。到底是這個物體中的哪些參數讓你看出來它是一隻貓的?沒有方程。

    你只能說，因為我見過一些貓，我知道貓是什麼樣的，所以當我看見一隻貓的時候，我就知道那是一隻貓。

