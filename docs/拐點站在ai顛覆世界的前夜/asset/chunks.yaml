    # 第四章 用已知推理未知


    ## 01 演化：目前為止的 GPT 世界觀


    面對一個新事物，你一上來就覺得它很厲害，然後就到處宣揚它有多厲害，這是一個有點冒險的行為。因為可能浪潮很快就過去了，最終事實證明這東西並沒有當初你想象的那麼厲害，你就會覺得當時自己挺傻的。


    但我認為這才是對的。一見到新事物就很激動，一驚一乍，恰恰證明你心仍然會澎湃，你沒有陷入認知固化。這比看見什麼東西都用老一套的世界觀去解釋，說「這我 30 年前就搞明白了」，要強得多。要允許自己繼續長進，你就得敢於讓人說你傻。


    `GPT` 絕不是 30 年前的觀念能理解的東西。最近幾年的幾個關鍵突破已經徹底改變了神經網絡和語言模型研究的面貌。


    以我之見，2021 年以前出版的所有講`AI`的書，現在統統都過時了。


    `AI`和人腦還有本質區別嗎?語言模型到底是個什麼東西? 你先看看這張照片。(圖 4-1)


    這是計算機視覺專家安德烈·卡帕西 (`Andrej Karpathy`) 在


    ![](img/index-182_1.jpg)


    2012 年 10 月的一篇博客文章①用過的照片，當時他的論點是：要想讓`AI`能看懂這張照片，非常非常困難。


    照片裡是奧巴馬(`Obama`)和他的幾個同僚在走廊裡，有個老兄站在體重秤上稱體重———他不知道的是，奧巴馬在他身後，把腳踩在體重秤上，給他加了一點重量。周圍的人都在笑。


    `AI`要想理解這個情景的有趣之處，必須先具備一些「常識」：體重秤是幹什麼的，多一隻腳踩在體重秤上會讓讀數增加，奧巴馬是在搞惡作劇，因為現代人都希望減肥，害怕體重增加，以及奧巴馬以總統之尊開這個玩笑很有意思⋯⋯這些常識不會被系統性地列舉在哪本書裡，都是我們人類日用而不知的東西,是「隱性知識」(`tacit
    knowledge` )。


