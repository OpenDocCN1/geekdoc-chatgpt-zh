    # 第一章 ChatGPT 究竟是什麼


    `DALL·E`, 是使用跟語言模型同樣的`Transformer`技術來預測畫面中的內容的。畫面跟語言有啥區別?


    要是這麼理解的話，我認為楊立昆可能有點狹隘了。我們之前可能都狹隘了。也許天生眼盲的人對世界的理解一點都不差，他們只是有點障礙，理解得慢一些而已。


    ## 數學：AI視角下的語義和智能


    我們已經看到了 `ChatGPT`的各種性質，這一小節我想跟你說說大語言模型最底層的一個基本原理。這將是個過於簡化的討論，我不打算涉及任何細節，我們直擊一個關鍵思想。我認為它對我們人類自己的思考有重大啟發，能讓我們重新審視「智能」。


    簡單說，人類的所有所思所想，發明過的所有概念，所有「語義」，都可以用數學組織起來。而這意味著智能不是隨便排列組合的字符，智能應該有某種數學結構，不是漫無邊際的。我斗膽猜想，我們可以用研究數學———具體說是幾何學———的方法研究智能，數學也許能幫我們尋找新的智能。


    咱們從一個有點神奇的現象說起。


    ![](index-63_1.jpg)


    你可能會注意到，跟 `ChatGPT` 對話，無論用中文還是英文，得到的答案並沒有實質的不同，其內容、質量和行文風格都差不

    多。當然，如果你問的是跟中國歷史文化相關的事，比如甲骨文中某個具體的字的意思在歷史上有什麼演變，那的確應該用中文。但是對於一般的問題，比如從地球去火星怎麼走最近，你用什麼語言並不重要。


    這已經很了不起了。這說明`GPT` 面對一箇中文提問的時候，並不是使用從中文語料中學到的知識回答，它是調動從所有語料中學到的全面的知識去回答。這跟搜索引擎單純地找關鍵詞完全不同。要知道在Google上搜索個什麼問題，你輸入的是什麼語言就會得到什麼語言的頁面。


    那你說`GPT`是不是先把中文翻譯成英文，用英文思考之後，再把答案翻譯回中文的呢?通常不是。除非它需要上網搜索答案，那麼它可能傾向於使用英文搜索。如果只是自己推理，那就根本沒有翻譯這個步驟。


    事實上，不但不同語言之間不需要翻譯，`GPT`對同義詞和近義詞也不需要專門處理。不管你用什麼語言，選擇什麼詞彙，用怎樣的語氣，換個不一樣的說法也好，`GPT`
    都能相當精準地理解你的意思，生成恰當的答案。


    這是為啥呢?因為語言模型並不是用「語言」推理的——它是

    用「語義向量」來推理的。


    向量是個數學概念，你可以大致理解成座標系中指向的一個點。`GPT`以及任何語言模型，包括之前的自然語言處理算法，都要先建立一個「向量空間模型」(`Vector
    Space Model`)。這個向量空間是個多維的、理論上可以無窮維的座標系，每個詞語都被映射到這個空間中的一個點。


    關鍵在於，詞語們不是根據外形，而是根據它們的語義來被映射的。語義相近的詞，或者來自不同語言但代表同樣意思的詞，在向量空間中的位置會非常靠近。比如「汽車」「car(車)」「automobile(
    自動駕駛)」「座駕」這些詞, 在向量空間中的位置都非常接近。


    再如，「向前」和「向後」這兩個詞都屬於表示方向的範疇，所以它們在語義空間中離得也比較近，可能屬於同一片區域———它們的距離會比「蘋果」和「快樂」之間的更近。但是「向前」和「向後」的意思又恰好相反，這一點也會在向量空間中體現出來，也許這兩個詞的向量會呈現某種方向相對的結構，總之都有一定的規律。


    那你說一個詞的語義對應於向量空間中的哪個點，這是如何設定的呢?這就是語言模型的一個高明之處：你不需要設定。模型可以從大量語料學習中自行發現各個詞彙的語義的相對關係，並且給它們調整位置。`Transformer`架構的作用就是通過「自注意力機制」自動識別一段文本的模式和結構，從而捕捉到詞語之間的關係，進而調整每個詞在語義空間中的位置。隨著預訓練進行，慢慢調整到一定程度，每個詞彙的位置就大致確定了。


    無須專門指導，模型從語料中就摸索到「汽車」是用來「開」的，「蘋果」是用來「吃」的，因為經常出現在一起的詞有關係。同樣道理，只要通過對齊不同語言的平行語料庫，也就是同一個內容的翻譯版本和原版，模型就能發現不同語言中同樣的語義關係。


    說白了，在模型看來，一個詞的語義是由它和別的詞之間的關係決定的。模型並不需要學習什麼叫動詞、什麼叫名詞，什麼叫主語、謂語、賓語，但是它能自動學會像我們一樣說「人使用錘子」，而不是「人錘子用」。這個過程不但是自動的，而且是全面的：也許有很多關係並沒有被人類語言學家觀察到，但是模型捕捉到了。


    一切語義都是關係，一切關係都是數學。


    不論你輸入的提示語是哪種語言，模型只在乎其中的語義。它真正處理的是向量，所以思考過程會從神經網絡中同樣的地方走，結果當然就是一樣的。這就如同我的大部分物理專業知識是用英文學的，但是你要是問我一個物理問題，用中文還是英文對我沒什麼區別。我說不清自己是用英文還是用中文思考物理的，我就是直接思考。


    `AI`並不是用語言思考的，它是用語義思考的———它是用語言表象背後的本質思考的。


    ![](index-66_1.jpg)


    你可能會說，就算 `GPT`抓住了詞語之間的數學關係，可那些畢竟只是統計出來的數字而已，`GPT`還是沒有真正理解那些語義！對此，我有兩個反駁。


    首先，你不能說模型沒見過語義。現在高級的大語言模型都有多模態能力，可以處理聲音和圖像，比如`OpenAI` 2024年2月推出的`Sora`，能直接根據文字生成視頻。那些聲音、圖像和視頻中的元素也被模型視為語義，也被當作向量處理。視頻中的一輛車和文本中「車」這個詞，對應向量空間中同樣的位置。如果一個模型知道「車」字怎麼寫、怎麼讀，對應的物體是什麼樣的、有什麼用，你還能說它不「理解」車嗎?


    更重要的是，我認為知道詞語之間的關係就是最全面、最深刻的理解。如果一句話用中文說和用英文說意思一樣，我們完全可以說具體的語言只是表象，這句話所對應的數學結構才是本質。語言模型抓住了那個數學結構，這難道不就是最本質的理解嗎?


    現實是，人類中的語言學家並沒有抓住語言中所有的結構和關係，這就是為什麼他們怎麼也不能完全教會機器翻譯。`GPT`的翻譯效果比任何用語法規則堆砌出來的翻譯程序都好得多，說明
    `GPT`比語言學家更懂語言。


    而語言學家之所以始終沒有掌握語言，是因為他們缺少有力的手段。他們需要向`GPT`學習，藉助向量空間去理解語言。他們需要數學。


    ![](index-67_1.jpg)


    那麼我們可以開個腦洞。


    想象一個有多維度的向量空間，人類已知的每個語義都對應著這個向量空間中的一個亮點。遠遠看去，所有語義就如同滿天星鬥。


    我們的每一句話都是由若干個語義組成的，對應於向量空間中幾個亮點組成的一條曲線。那麼每個想法、每首詩、每個故事、每個計謀、每個智能，就都是由若干條曲線組成的形狀。


    有了向量空間這個工具，我們就把對智能和思想的研究變成了一種幾何學——也許可以叫「語義幾何學」或者「思想幾何學」。


    我設想，假如某個歷史典故對應著向量空間中的一個看上去比較簡單，但是很緊湊、挺好看的形狀，那麼我把這個形狀在座標系中平移一下，它的各個語義都變了，但是形狀不變，對吧?相當於一個故事的兩種講法。那我是不是可以說，這就是「類比」呢?


    再進一步，我們可不可以從形狀的角度來評估一個敘事。比如，你可以專門研究閉合的形狀和開放的形狀各自對應什麼樣的故事。成語「圍魏救趙」是個什麼形狀?愛因斯坦相對論是個什麼形狀?它們各自在語義空間中的什麼位置?所有這些問題都非常有意思。


    語義幾何學也許能解釋為什麼`GPT` 自己學會了真實世界中的一些常識。要知道語義的向量表示不可能是精確的，都會有一定

    的誤差和模糊性。模型完全可以從你教過的語義向量的邊緣自行摸索出一些你沒教過它的關係出來，它可以用數學方法填補一些空白。


    ![](index-68_1.jpg)


    我們再大膽一點。已知的語義都對應著向量空間中的亮點，那麼你可以想見，向量空間中必定還有大片大片黑暗的區域。那些區域對應著什麼呢?是人類尚未發現的語義嗎?


    這就好像元素週期表一樣。科學家剛剛做出元素週期表的

    時候，上面還有一些空白的位置，對應著理論上應該有，但是尚未被發現的元素。科學家不知道那些元素在哪裡，但是可以大致推算它們的化學性質。結果，後來科學家果然找到了那些元素！


    那我們有沒有可能借助語言模型的向量空間，去發現一些全新的語義呢?我們的語言會不會因此變得更豐富呢?


    還有，我們明確知道世間存在的一些「感覺」是人類感覺不到的。比如蝙蝠用聽超聲波的方式感知空間信息，那是一種什麼感覺?它有怎樣的語義?鯨魚的大腦中有個特別的區域是人腦所沒有的，那個區域似乎能讓鯨魚以一種人類沒有的感覺進行社交，那又是什麼語義?物理學家認為宏觀世界的「位置」「動量」這些概念並不能精確描寫量子力學中微觀粒子的運動，也許人類永遠也無法直觀感知量子世界的「語義」⋯
    ⋯ 所有這些，也許都在語義向量空間中有獨特的位置，也許都能用`AI`研究。


    又或者，就算我們難以體會新語義，如果能借助語義幾何學發現一些舊語義的新組合，不也是一種創造嗎?事實上，`GPT`已經能夠創造出看起來合理還很新穎的語言表達，比如，發明一個新詞，創造一個新成語，編一個我們從來沒聽過的新故事，畫一隻地球上沒有的動物，等等，這其實都是數學功夫。


    人類原本以為宇宙中會有無限種物質，但是元素週期表一齣來，我們意識到質子和中子只有這麼多穩定的組合，宇宙中只能有這麼多種原子。那麼語義向量空間會不會告訴我們，人類只能有這麼多種語義呢?當然，就算語義是有限多的，語義的組合也是無限的，而且不同文化背景中的人對同一個語義的體驗也不一樣，所以我們不用擔心智能被`AI`窮盡。


    智能是星辰大海，數學似乎已經給我們提供了一張地圖。


    ![](index-70_1.jpg)


    # 第二章 當 AI 進入人類社會


    ## 01 效率：把AI轉化為生產力


    很多人都觀察到了，`AI`已經被應用於很多領域，相關公司的股價都在飆升，人人都在談論它。可是反映在經濟上，`AI` 對發達國家生產力的促進還沒體現出來。前幾年人們還在談論「大停滯」——從
    20世紀90年代末到現在，美國人的實際收入水平已經停止增長。`AI`的作用到底在哪兒呢?


    《麻省理工學院斯隆管理評論》(`MIT Sloan Management Review`) 曾經在2020年做過一項調查, 發現有 59%的商業人士說自己有一個
    `AI`戰略，有57%的公司已經部署或嘗試了某種 `AI`方案——可是隻有 11%的公司，真正從`AI`中獲得了財務利益。


    說白了就是，為什麼 `AI`還沒幫我們賺到錢?其實這個現象並不是特例，這是「通用技術」正常的發展階段。


    蒸汽機、電力、半導體、互聯網，這些都是通用技術。而通用技術，都不是一上來就能創造巨大財富的。比如 1987年，經濟學家羅伯特·索洛(`Robert Solow`)
    就有個感慨, 說我們這個時代到處都能看到計算機，唯獨生產力統計裡看不見計算機。


    其實那很正常，因為通用技術剛出來不會立即改造經濟活動。`AI`也是一種「通用技術」。


    很多人認為`AI`對社會的影響將會超過電力，那我們不妨先回顧一下電力的發展。下圖展示的是電力在美國家庭和工廠的普及歷史。(圖2-1)


    ![](index-72_1.jpg)


    `Edison` 在1879年就發明了電燈, 可是過了20年，美國才只有3%的家庭用上了電。到1890年，美國工廠只有5%用上了電力。甚至到了1910年，新建的工廠還是優先採用蒸汽動力。


    這是為什麼呢?


    三個加拿大經濟學家———阿傑伊·阿格拉沃爾(`Ajay Agrawal`)、喬舒亞·甘斯(`Joshua Gans`) 和阿維·戈德法布(`Avi Goldfarb`)
    ———剛好討論過這個問題。他們在《權力與預測》(`Power and Prediction`) 這本書中提出, 我們此刻正處在人工智能的「中間時代」(`The
    Between Times`), 也就是未來已經到來,只是還沒能帶來很大效益。他們認為，通用技術要真正發揮生產力效能，需要經過三個階段。


    第一個階段叫「點解決方案」(`The Point Solution`), 是簡單的輸入端替換。


    比如，用燈泡比蠟燭方便一點，用電力做動力有時候會比蒸汽動力便宜一點，你可能會有替換的意願。你的生活方便了一點點，你的成本降低了一點，但是僅此而已。


    第二個階段叫「應用解決方案」(`The Application Solution`), 是把生產裝置也給更換了。


    以前的工廠用蒸汽做動力時，都是一根蒸汽軸連接所有機器，蒸汽一開，所有機器都開動。改用電力之後，工廠發現，如果每臺機器都有獨立的電源，那就完全可以用哪臺開哪臺，豈不是更省錢?但這並不容易，因為這意味著你必須對機器進行改造，什麼機床、鑽頭、金屬切割器、壓力機，都得根據獨立電源重新設計。這是需要時間的。


    第三個階段叫「系統解決方案」(`The System Solution`), 是整個生產方式的改變。


    蒸汽時代的廠房，因為要用到蒸汽軸，所有機器都必須佈置在中央軸附近。用上電力，你可以隨處安裝插頭，機器可以放在工廠裡任何一個位置，那麼你就可以充分利用空間，沒必要把所有機器集中在一起。這就使得「生產流水線」成為可能。這已經不是局部的改進，這要求生產方式和組織方式都得到系統性的變革。


    `AI`也會是如此。到目前為止，我們對`AI`的應用還處在點解決方案和一定程度上的應用解決方案階段，並沒達到系統解決方案階段。這就是為什麼`AI`還沒有發揮最大的作用。


    從商業角度看，`AI`，到底是什麼東西?《權力與預測》這本書認為，`AI`是一個「預測機器」。


    三位作者沒有討論像`ChatGPT` 那樣的生成性語言模型，而是專注在新藥發現、商品推薦、天氣預報那樣的預測性 `AI`應用上，而這些應用的確是商業化程度最高的。比如，你向螞蟻金服申請一筆貸款，它當場就能審批，這就是因為`AI`能根據你的記錄預測你的償還能力。


    預測是決定的前提，`AI`預測能改變人們做決定的方式。 當電力被廣泛應用以後，人們對電力的應用和電力的來源就脫鉤了。你不用關心發電廠在哪兒，你也不用管電是怎麼發的，但你的廠房可以開在任何地方。那麼我們可以設想，當`AI`
    被廣泛應用的時候，預測和決定，這兩件事也可以脫鉤：你不用管 `AI`是怎麼預測的，你直接根據預測做決定就是。


    三位作者提出，`AI`的點解決方案是用`AI`改善你現有的決定，應用解決方案是用`AI`改變你做決定的方式，系統解決方案是 `AI`促成了新的決定———你的生產模式整個變了。


    舉個例子，你在亞馬遜購物。現在，亞馬遜的`AI`會根據你的購物喜好向你推薦商品，這就是一個點解決方案。


    但亞馬遜完全可以這麼做：`AI`預測你喜歡某些商品後，亞馬遜直接把這些商品寄到你家。也許每個月甚至每週給你發來一箱商品。你打開箱子一看，每次都有驚喜：喜歡的就留下，不喜歡的就退貨。


    這種銷售方法肯定能讓你多買一些東西！畢竟把東西拿在手裡、穿在身上，跟看網頁的感覺肯定不一樣。這顯然是個好主意，你做購物決定的方式被改變了。


    事實上，亞馬遜早就把這種購物模式註冊了專利，叫作「預先發貨」(`Anticipatory Shipping`)。


    但是，這個銷售方式目前還沒有被正式實施。為啥呢?因為現有的退貨系統還不夠好。


    處理退貨仍然是個很麻煩的事情。運輸倒是挺便宜，問題在於把退回來的商品檢查一番、包裝好、重新放到貨架上，這個事兒非常費力。所以現在亞馬遜的做法是，把很多退貨收到就直接扔掉了。


    但如果將來 `AI`能接管退貨這一塊，比如用上機器人，亞馬遜就可以搞.「預先發貨」了。可能到時候商家的整個銷售方式都會改變，那就是一個系統解決方案。


    ![](index-75_1.jpg)


    `AI` 預測能改變決定方式，就能改變生活方式。


    我們在生活中很多時候根本不做決定，都是根據習慣或者規則做事。如果你感覺今天要下雨，你就決定帶傘。但如果這個地區經常下雨，可能你就會給自己定一條規則：每天上班必須帶傘。再比如，因為怕錯過航班，有些人規定自己坐飛機必須提前4個小時出發。


    這些規則只是為了防止出事，它們拉低了生活的效率。


    我們設想一下，如果天氣預報非常準，你就不必每天帶傘，你就可以把規則變成一個決定：根據天氣預報決定是否帶傘。如果 `AI`能充分考慮去機場的路上交通有多擁堵、航班會不會晚點、你到那兒的時候安檢隊伍大概有多長，給你提供一個精準預測，你就可以取消提前4個小時出發的規則。對吧?


    再進一步，我們何必還先問`AI`的預測，自己再做決定呢?乾脆直接把決定權交給 `AI`，讓 `AI`安排你帶不帶雨傘、什麼時候出發，豈不是更好?


    年輕人經常因為考慮不周而遇到麻煩。成年人為了避免麻煩給自己制定了很多規則，實則換成了另一種麻煩。有的人很幸運，身邊有人隨時提醒。而更幸運的人則根本無須操心，你們安排就好，我都行。


    到時候你會很樂意把決定權交給 `AI`。


    這就是預測取代規則。


    ![](index-76_1.jpg)


    體現在經濟上，舉個例子。農民種田最早都是看看天氣預報，自己大概估計一下什麼時候播種、什麼時候施肥、什麼時候收割。決定是自己做的，預測只是參考。


    後來天氣預報越來越準，美國的氣象公司提供了一個人性化服務，專門對農民輸出精確的預測，比如告訴農民今年播種只有 8天的窗口期，讓農民自己看著辦。氣象公司一方面根據天氣預報，一方面根據作物類型，直接通知農民最佳的播種、施肥和收割時間。


    那農民就省心了，何必自己做決定呢?直接聽氣象公司的不就行了！你看，氣象公司現在深度干預農業。


    所以農業公司 `Monsanto`(孟山都) 在 2013年收購了一家氣象公司。這樣一來，它不但給農民提供種子、教農民種田的方法，還

    '
  trans: '


    ①IlyaSutskever,TheMastermindBehind`GPT-4`andtheFutureofAI, `https://open.spotify.com/episode/2sZaVXPYuV5EjB3IFoBcsb`,
    May5, 2023.


    # 第一章 ChatGPT 究竟是什麼


    `DALL·E`, 是使用跟語言模型同樣的`Transformer`技術來預測畫面中的內容的。畫面跟語言有啥區別?


    要是這麼理解的話，我認為楊立昆可能有點狹隘了。我們之前可能都狹隘了。也許天生眼盲的人對世界的理解一點都不差，他們只是有點障礙，理解得慢一些而已。


    ## 數學：AI 視角下的語義和智能


    我們已經看到了 `ChatGPT`的各種性質，這一小節我想跟你說說大語言模型最底層的一個基本原理。這將是個過於簡化的討論，我不打算涉及任何細節，我們直擊一個關鍵思想。我認為它對我們人類自己的思考有重大啟發，能讓我們重新審視「智能」。


    簡單說，人類的所有所思所想，發明過的所有概念，所有「語義」，都可以用數學組織起來。而這意味著智能不是隨便排列組合的字符，智能應該有某種數學結構，不是漫無邊際的。我斗膽猜想，我們可以用研究數學———具體說是幾何學———的方法研究智能，數學也許能幫我們尋找新的智能。


    咱們從一個有點神奇的現象說起。


    ![](img/index-63_1.jpg)


    你可能會注意到，跟 `ChatGPT` 對話，無論用中文還是英文，得到的答案並沒有實質的不同，其內容、質量和行文風格都差不

    多。當然，如果你問的是跟中國歷史文化相關的事，比如甲骨文中某個具體的字的意思在歷史上有什麼演變，那的確應該用中文。但是對於一般的問題，比如從地球去火星怎麼走最近，你用什麼語言並不重要。


    這已經很了不起了。這說明`GPT` 面對一箇中文提問的時候，並不是使用從中文語料中學到的知識回答，它是調動從所有語料中學到的全面的知識去回答。這跟搜索引擎單純地找關鍵詞完全不同。要知道在
    Google 上搜索個什麼問題，你輸入的是什麼語言就會得到什麼語言的頁面。


    那你說`GPT`是不是先把中文翻譯成英文，用英文思考之後，再把答案翻譯回中文的呢?通常不是。除非它需要上網搜索答案，那麼它可能傾向於使用英文搜索。如果只是自己推理，那就根本沒有翻譯這個步驟。


    事實上，不但不同語言之間不需要翻譯，`GPT`對同義詞和近義詞也不需要專門處理。不管你用什麼語言，選擇什麼詞彙，用怎樣的語氣，換個不一樣的說法也好，`GPT`
    都能相當精準地理解你的意思，生成恰當的答案。


    這是為啥呢?因為語言模型並不是用「語言」推理的——它是

    用「語義向量」來推理的。


    向量是個數學概念，你可以大致理解成座標系中指向的一個點。`GPT`以及任何語言模型，包括之前的自然語言處理算法，都要先建立一個「向量空間模型」(`Vector
    Space Model`)。這個向量空間是個多維的、理論上可以無窮維的座標系，每個詞語都被映射到這個空間中的一個點。


    關鍵在於，詞語們不是根據外形，而是根據它們的語義來被映射的。語義相近的詞，或者來自不同語言但代表同樣意思的詞，在向量空間中的位置會非常靠近。比如「汽車」「car(車)」「automobile(
    自動駕駛)」「座駕」這些詞, 在向量空間中的位置都非常接近。


    再如，「向前」和「向後」這兩個詞都屬於表示方向的範疇，所以它們在語義空間中離得也比較近，可能屬於同一片區域———它們的距離會比「蘋果」和「快樂」之間的更近。但是「向前」和「向後」的意思又恰好相反，這一點也會在向量空間中體現出來，也許這兩個詞的向量會呈現某種方向相對的結構，總之都有一定的規律。


    那你說一個詞的語義對應於向量空間中的哪個點，這是如何設定的呢?這就是語言模型的一個高明之處：你不需要設定。模型可以從大量語料學習中自行發現各個詞彙的語義的相對關係，並且給它們調整位置。`Transformer`架構的作用就是通過「自注意力機制」自動識別一段文本的模式和結構，從而捕捉到詞語之間的關係，進而調整每個詞在語義空間中的位置。隨著預訓練進行，慢慢調整到一定程度，每個詞彙的位置就大致確定了。


    無須專門指導，模型從語料中就摸索到「汽車」是用來「開」的，「蘋果」是用來「吃」的，因為經常出現在一起的詞有關係。同樣道理，只要通過對齊不同語言的平行語料庫，也就是同一個內容的翻譯版本和原版，模型就能發現不同語言中同樣的語義關係。


    說白了，在模型看來，一個詞的語義是由它和別的詞之間的關係決定的。模型並不需要學習什麼叫動詞、什麼叫名詞，什麼叫主語、謂語、賓語，但是它能自動學會像我們一樣說「人使用錘子」，而不是「人錘子用」。這個過程不但是自動的，而且是全面的：也許有很多關係並沒有被人類語言學家觀察到，但是模型捕捉到了。


    一切語義都是關係，一切關係都是數學。


    不論你輸入的提示語是哪種語言，模型只在乎其中的語義。它真正處理的是向量，所以思考過程會從神經網絡中同樣的地方走，結果當然就是一樣的。這就如同我的大部分物理專業知識是用英文學的，但是你要是問我一個物理問題，用中文還是英文對我沒什麼區別。我說不清自己是用英文還是用中文思考物理的，我就是直接思考。


    `AI`並不是用語言思考的，它是用語義思考的———它是用語言表象背後的本質思考的。


    ![](img/index-66_1.jpg)


    你可能會說，就算 `GPT`抓住了詞語之間的數學關係，可那些畢竟只是統計出來的數字而已，`GPT`還是沒有真正理解那些語義！對此，我有兩個反駁。


    首先，你不能說模型沒見過語義。現在高級的大語言模型都有多模態能力，可以處理聲音和圖像，比如`OpenAI` 2024 年 2 月推出的`Sora`，能直接根據文字生成視頻。那些聲音、圖像和視頻中的元素也被模型視為語義，也被當作向量處理。視頻中的一輛車和文本中「車」這個詞，對應向量空間中同樣的位置。如果一個模型知道「車」字怎麼寫、怎麼讀，對應的物體是什麼樣的、有什麼用，你還能說它不「理解」車嗎?


    更重要的是，我認為知道詞語之間的關係就是最全面、最深刻的理解。如果一句話用中文說和用英文說意思一樣，我們完全可以說具體的語言只是表象，這句話所對應的數學結構才是本質。語言模型抓住了那個數學結構，這難道不就是最本質的理解嗎?


    現實是，人類中的語言學家並沒有抓住語言中所有的結構和關係，這就是為什麼他們怎麼也不能完全教會機器翻譯。`GPT`的翻譯效果比任何用語法規則堆砌出來的翻譯程序都好得多，說明
    `GPT`比語言學家更懂語言。


    而語言學家之所以始終沒有掌握語言，是因為他們缺少有力的手段。他們需要向`GPT`學習，藉助向量空間去理解語言。他們需要數學。


    ![](img/index-67_1.jpg)


    那麼我們可以開個腦洞。


    想象一個有多維度的向量空間，人類已知的每個語義都對應著這個向量空間中的一個亮點。遠遠看去，所有語義就如同滿天星鬥。


    我們的每一句話都是由若干個語義組成的，對應於向量空間中幾個亮點組成的一條曲線。那麼每個想法、每首詩、每個故事、每個計謀、每個智能，就都是由若干條曲線組成的形狀。


    有了向量空間這個工具，我們就把對智能和思想的研究變成了一種幾何學——也許可以叫「語義幾何學」或者「思想幾何學」。


    我設想，假如某個歷史典故對應著向量空間中的一個看上去比較簡單，但是很緊湊、挺好看的形狀，那麼我把這個形狀在座標系中平移一下，它的各個語義都變了，但是形狀不變，對吧?相當於一個故事的兩種講法。那我是不是可以說，這就是「類比」呢?


    再進一步，我們可不可以從形狀的角度來評估一個敘事。比如，你可以專門研究閉合的形狀和開放的形狀各自對應什麼樣的故事。成語「圍魏救趙」是個什麼形狀?愛因斯坦相對論是個什麼形狀?它們各自在語義空間中的什麼位置?所有這些問題都非常有意思。


    語義幾何學也許能解釋為什麼`GPT` 自己學會了真實世界中的一些常識。要知道語義的向量表示不可能是精確的，都會有一定

    的誤差和模糊性。模型完全可以從你教過的語義向量的邊緣自行摸索出一些你沒教過它的關係出來，它可以用數學方法填補一些空白。


    ![](img/index-68_1.jpg)


    我們再大膽一點。已知的語義都對應著向量空間中的亮點，那麼你可以想見，向量空間中必定還有大片大片黑暗的區域。那些區域對應著什麼呢?是人類尚未發現的語義嗎?


    這就好像元素週期表一樣。科學家剛剛做出元素週期表的

    時候，上面還有一些空白的位置，對應著理論上應該有，但是尚未被發現的元素。科學家不知道那些元素在哪裡，但是可以大致推算它們的化學性質。結果，後來科學家果然找到了那些元素！


    那我們有沒有可能借助語言模型的向量空間，去發現一些全新的語義呢?我們的語言會不會因此變得更豐富呢?


    還有，我們明確知道世間存在的一些「感覺」是人類感覺不到的。比如蝙蝠用聽超聲波的方式感知空間信息，那是一種什麼感覺?它有怎樣的語義?鯨魚的大腦中有個特別的區域是人腦所沒有的，那個區域似乎能讓鯨魚以一種人類沒有的感覺進行社交，那又是什麼語義?物理學家認為宏觀世界的「位置」「動量」這些概念並不能精確描寫量子力學中微觀粒子的運動，也許人類永遠也無法直觀感知量子世界的「語義」⋯
    ⋯ 所有這些，也許都在語義向量空間中有獨特的位置，也許都能用`AI`研究。


    又或者，就算我們難以體會新語義，如果能借助語義幾何學發現一些舊語義的新組合，不也是一種創造嗎?事實上，`GPT`已經能夠創造出看起來合理還很新穎的語言表達，比如，發明一個新詞，創造一個新成語，編一個我們從來沒聽過的新故事，畫一隻地球上沒有的動物，等等，這其實都是數學功夫。


    人類原本以為宇宙中會有無限種物質，但是元素週期表一齣來，我們意識到質子和中子只有這麼多穩定的組合，宇宙中只能有這麼多種原子。那麼語義向量空間會不會告訴我們，人類只能有這麼多種語義呢?當然，就算語義是有限多的，語義的組合也是無限的，而且不同文化背景中的人對同一個語義的體驗也不一樣，所以我們不用擔心智能被`AI`窮盡。


    智能是星辰大海，數學似乎已經給我們提供了一張地圖。


    ![](img/index-70_1.jpg)


    # 第二章 當 AI 進入人類社會


    ## 01 效率：把 AI 轉化為生產力


    很多人都觀察到了，`AI`已經被應用於很多領域，相關公司的股價都在飆升，人人都在談論它。可是反映在經濟上，`AI` 對發達國家生產力的促進還沒體現出來。前幾年人們還在談論「大停滯」——從
    20 世紀 90 年代末到現在，美國人的實際收入水平已經停止增長。`AI`的作用到底在哪兒呢?


    《麻省理工學院斯隆管理評論》(`MIT Sloan Management Review`) 曾經在 2020 年做過一項調查, 發現有 59%的商業人士說自己有一個
    `AI`戰略，有 57%的公司已經部署或嘗試了某種 `AI`方案——可是隻有 11%的公司，真正從`AI`中獲得了財務利益。


    說白了就是，為什麼 `AI`還沒幫我們賺到錢?其實這個現象並不是特例，這是「通用技術」正常的發展階段。


    蒸汽機、電力、半導體、互聯網，這些都是通用技術。而通用技術，都不是一上來就能創造巨大財富的。比如 1987 年，經濟學家羅伯特·索洛(`Robert Solow`)
    就有個感慨, 說我們這個時代到處都能看到計算機，唯獨生產力統計裡看不見計算機。


    其實那很正常，因為通用技術剛出來不會立即改造經濟活動。`AI`也是一種「通用技術」。


    很多人認為`AI`對社會的影響將會超過電力，那我們不妨先回顧一下電力的發展。下圖展示的是電力在美國家庭和工廠的普及歷史。(圖 2-1)


    ![](img/index-72_1.jpg)


    `Edison` 在 1879 年就發明了電燈, 可是過了 20 年，美國才只有 3%的家庭用上了電。到 1890 年，美國工廠只有 5%用上了電力。甚至到了
    1910 年，新建的工廠還是優先採用蒸汽動力。


    這是為什麼呢?


    三個加拿大經濟學家———阿傑伊·阿格拉沃爾(`Ajay Agrawal`)、喬舒亞·甘斯(`Joshua Gans`) 和阿維·戈德法布(`Avi Goldfarb`)
    ———剛好討論過這個問題。他們在《權力與預測》(`Power and Prediction`) 這本書中提出, 我們此刻正處在人工智能的「中間時代」(`The
    Between Times`), 也就是未來已經到來,只是還沒能帶來很大效益。他們認為，通用技術要真正發揮生產力效能，需要經過三個階段。


    第一個階段叫「點解決方案」(`The Point Solution`), 是簡單的輸入端替換。


    比如，用燈泡比蠟燭方便一點，用電力做動力有時候會比蒸汽動力便宜一點，你可能會有替換的意願。你的生活方便了一點點，你的成本降低了一點，但是僅此而已。


    第二個階段叫「應用解決方案」(`The Application Solution`), 是把生產裝置也給更換了。


    以前的工廠用蒸汽做動力時，都是一根蒸汽軸連接所有機器，蒸汽一開，所有機器都開動。改用電力之後，工廠發現，如果每臺機器都有獨立的電源，那就完全可以用哪臺開哪臺，豈不是更省錢?但這並不容易，因為這意味著你必須對機器進行改造，什麼機床、鑽頭、金屬切割器、壓力機，都得根據獨立電源重新設計。這是需要時間的。


    第三個階段叫「系統解決方案」(`The System Solution`), 是整個生產方式的改變。


    蒸汽時代的廠房，因為要用到蒸汽軸，所有機器都必須佈置在中央軸附近。用上電力，你可以隨處安裝插頭，機器可以放在工廠裡任何一個位置，那麼你就可以充分利用空間，沒必要把所有機器集中在一起。這就使得「生產流水線」成為可能。這已經不是局部的改進，這要求生產方式和組織方式都得到系統性的變革。


    `AI`也會是如此。到目前為止，我們對`AI`的應用還處在點解決方案和一定程度上的應用解決方案階段，並沒達到系統解決方案階段。這就是為什麼`AI`還沒有發揮最大的作用。


    從商業角度看，`AI`，到底是什麼東西?《權力與預測》這本書認為，`AI`是一個「預測機器」。


    三位作者沒有討論像`ChatGPT` 那樣的生成性語言模型，而是專注在新藥發現、商品推薦、天氣預報那樣的預測性 `AI`應用上，而這些應用的確是商業化程度最高的。比如，你向螞蟻金服申請一筆貸款，它當場就能審批，這就是因為`AI`能根據你的記錄預測你的償還能力。


    預測是決定的前提，`AI`預測能改變人們做決定的方式。 當電力被廣泛應用以後，人們對電力的應用和電力的來源就脫鉤了。你不用關心發電廠在哪兒，你也不用管電是怎麼發的，但你的廠房可以開在任何地方。那麼我們可以設想，當`AI`
    被廣泛應用的時候，預測和決定，這兩件事也可以脫鉤：你不用管 `AI`是怎麼預測的，你直接根據預測做決定就是。


    三位作者提出，`AI`的點解決方案是用`AI`改善你現有的決定，應用解決方案是用`AI`改變你做決定的方式，系統解決方案是 `AI`促成了新的決定———你的生產模式整個變了。


    舉個例子，你在亞馬遜購物。現在，亞馬遜的`AI`會根據你的購物喜好向你推薦商品，這就是一個點解決方案。


    但亞馬遜完全可以這麼做：`AI`預測你喜歡某些商品後，亞馬遜直接把這些商品寄到你家。也許每個月甚至每週給你發來一箱商品。你打開箱子一看，每次都有驚喜：喜歡的就留下，不喜歡的就退貨。


    這種銷售方法肯定能讓你多買一些東西！畢竟把東西拿在手裡、穿在身上，跟看網頁的感覺肯定不一樣。這顯然是個好主意，你做購物決定的方式被改變了。


    事實上，亞馬遜早就把這種購物模式註冊了專利，叫作「預先發貨」(`Anticipatory Shipping`)。


    但是，這個銷售方式目前還沒有被正式實施。為啥呢?因為現有的退貨系統還不夠好。


    處理退貨仍然是個很麻煩的事情。運輸倒是挺便宜，問題在於把退回來的商品檢查一番、包裝好、重新放到貨架上，這個事兒非常費力。所以現在亞馬遜的做法是，把很多退貨收到就直接扔掉了。


    但如果將來 `AI`能接管退貨這一塊，比如用上機器人，亞馬遜就可以搞.「預先發貨」了。可能到時候商家的整個銷售方式都會改變，那就是一個系統解決方案。


    ![](img/index-75_1.jpg)


    `AI` 預測能改變決定方式，就能改變生活方式。


    我們在生活中很多時候根本不做決定，都是根據習慣或者規則做事。如果你感覺今天要下雨，你就決定帶傘。但如果這個地區經常下雨，可能你就會給自己定一條規則：每天上班必須帶傘。再比如，因為怕錯過航班，有些人規定自己坐飛機必須提前
    4 個小時出發。


    這些規則只是為了防止出事，它們拉低了生活的效率。


    我們設想一下，如果天氣預報非常準，你就不必每天帶傘，你就可以把規則變成一個決定：根據天氣預報決定是否帶傘。如果 `AI`能充分考慮去機場的路上交通有多擁堵、航班會不會晚點、你到那兒的時候安檢隊伍大概有多長，給你提供一個精準預測，你就可以取消提前
    4 個小時出發的規則。對吧?


    再進一步，我們何必還先問`AI`的預測，自己再做決定呢?乾脆直接把決定權交給 `AI`，讓 `AI`安排你帶不帶雨傘、什麼時候出發，豈不是更好?


    年輕人經常因為考慮不周而遇到麻煩。成年人為了避免麻煩給自己制定了很多規則，實則換成了另一種麻煩。有的人很幸運，身邊有人隨時提醒。而更幸運的人則根本無須操心，你們安排就好，我都行。


    到時候你會很樂意把決定權交給 `AI`。


    這就是預測取代規則。


    ![](img/index-76_1.jpg)


    體現在經濟上，舉個例子。農民種田最早都是看看天氣預報，自己大概估計一下什麼時候播種、什麼時候施肥、什麼時候收割。決定是自己做的，預測只是參考。


    後來天氣預報越來越準，美國的氣象公司提供了一個人性化服務，專門對農民輸出精確的預測，比如告訴農民今年播種只有 8 天的窗口期，讓農民自己看著辦。氣象公司一方面根據天氣預報，一方面根據作物類型，直接通知農民最佳的播種、施肥和收割時間。


    那農民就省心了，何必自己做決定呢?直接聽氣象公司的不就行了！你看，氣象公司現在深度干預農業。


    所以農業公司 `Monsanto`(孟山都) 在 2013 年收購了一家氣象公司。這樣一來，它不但給農民提供種子、教農民種田的方法，還


    '
