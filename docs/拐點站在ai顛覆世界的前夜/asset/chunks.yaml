    話中加廣告嗎?沒人知道。但我們知道，肯定要變了。


    080 拐 點


    不過 Google這樣的大公司搞AI還是有先發優勢的。用商業語


    言來說，要做AI業務，你需要達到一個「最低啟動門檻」，你需


