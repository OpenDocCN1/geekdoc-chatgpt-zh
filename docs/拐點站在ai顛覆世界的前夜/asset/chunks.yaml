    前面讲的基辛格等人有个观点很好，现在的关键问题，即「元问题」，是我们缺少`AI`时代的哲学。我们需要自己的笛卡尔 (`Descarts`) 和康德来解释这一切。


    我们将在下一章看到一些答案。


    ## 问答


    ### 用户 73119051


    既然`AGI`像人的大脑一样学习，是否可以让`AGI`反过来训练人的大脑呢?一个小孩从小是在人的知识环境中学习的，长大后认知也难以理解理性范围外的东西。那人如果在`AGI`的环境中长大，会不会也能拥有超级大脑?人的大脑有极限吗?


    ### 万维钢


    大脑的存储能力是海量的，远远谈不上触及极限。大脑这个设备的主要瓶颈在于输入输出和逻辑运算的速度都太慢了。计算机用不了 1 秒钟就能读一本书，人脑再怎么努力也不可能做到。但是我们有两个安慰，我认为人不用太纠结于自己大脑不够用。


    一个是，虽然知识是无限的，但观念是有限的。只要一个人对世界大概是怎么回事儿、自己专业领域大概的逻辑是什么有一定的掌控感，他就可以很好地做事了。


    另一个是，`AI`是我们的朋友，可以说是第二大脑。如果你随时都能找到正确答案，又何必非得把答案带在身上呢?


    `AGI`反向训练人的大脑是个好主意，事实上我们已经在使用新技术训练大脑了。今天的人能接触到的知识、能参与的训练，是过去根本无法想象的，应该好好利用这些条件。


