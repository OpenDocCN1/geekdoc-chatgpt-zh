    # 拐点


    ## 跋：拐点已至


    面部署到公司业务之中，而且已经赚到钱了。我遇到两家公司的创始人，他们是给金融机构提供文本信息阅读整理服务的。原本都是用传统的自然语言处理方法，现在全改成了`GPT`。还有一家做软件测试工具的公司，以前都是自己写算法，现在全都交给了`GPT`。


    这些都是`GPT-4`出来还不到1年就已经发生的事。如果再过几年呢？如果大家普遍用上了`AGI`呢？


    2024年2月，`OpenAI`推出文字生成视频模型`Sora`，一时震动世界。`Sora`的确厉害，但文生视频绝对不是2024年的`AI`主题。以我私下的了解，硅谷各公司正在主攻的方向是前面说的`AI`代理人。


    但一个更大的突破方向可能是机器人。人们对`AI`进展的一个经典抱怨是，本来应该让机器做各种家务活，我们人类摆弄琴棋书画——现在怎么`AI`先学会了琴棋书画，我们人类却还在做着家务活呢？这是因为做家务活并不简单。琴棋书画那些智力活动很容易“数字化”，它们本来就是在操纵信息，因此容易取得数据、用数据训练、用算法处理。做家务活则涉及跟真实物理世界的互动，要求你从变换的物理环境中取得复杂的信息，那比仅仅在数字世界中处理数据要难得多。人天生就有视觉和触觉能感知环境信息，人脑则会自动处理那些数据，机器人怎么做？


    我的理解是，机器人领域正在重复`GPT`取代传统“自然语言处理”算法的故事：以前是人类给机器人设定各种规则、编写做各种动作的算法，现在是用神经网络自动学习。目前可以说一只脚已经在门里了。


    2024年1月，斯坦福大学的几个华人学生推出了一个会做家务的机器人项目，叫`Mobile ALOHA`①。那是一个看上去非常简易的机器人，只有两只手臂和一个会移动的架子，人用笔记本电脑就能驱动它，总成本才3.2万美元——可是它能在普通的厨房里使用人类的工具制作复杂的中餐。它还会乘坐电梯，会整理桌椅，会刷锅洗碗，会擦桌子，会倒垃圾。


    这还只是一个小团队。包括特斯拉、亚马逊、Google、`OpenAI`在内，各家大公司都在搞自己的机器人项目。如果几年之内`AGI`有了身体，能走路、能干活、能听能看、能主动做它认为该做的事，又是一种什么情形？机器人接管所有低端体力劳动的日子可能很快就会到来。


    我认为这些进展代表世界很快会发生一个决定性的改变。


    我们的生活、生产、社会行为和地缘政治将会全面升级。山姆·阿尔特曼在2024年年初表示，打算筹集7万亿美元——要知道2023年美国GDP才27万亿美元——去实现他用`AGI`改变世界的梦想。考虑到拐点的大尺度，这个数字似乎不算太离谱。


    拐点肯定是拐点，没有悬念。


    ① Zipeng Fu, Tony Z. Zhao, Chelsea Finn, Mobile ALOHA: Learning Bimanual Mobile
    Manipulation with Low-Cost Whole-Body Teleoperation, https://arxiv.org/abs/2401.02117,
    March 9, 2024. 还可以在这里了解更多: https://mobile-aloha.github.io/。


    但你也不能说未来已经完全确定了。很多事情我们还来不及看清楚，或者至少没有被所有人看清楚。以我眼光所及，当前有三大悬念是人们争论的焦点。


    第一个悬念是，大语言模型究竟有没有智能。


    `GPT`到底是真聪明，是真实世界的投影，还是仅仅是个只会背诵统计结果的学舌鹦鹉？这个问题已经在书中反复讨论过，我列举了一些大模型有智能的迹象，比如涌现能力和对常识的掌握。`Sora`出来以后，也有很多人认为它已经是一个世界模型：它默默地学会了真实世界中各种物体的运动方式。


    但反对派的意见非常强硬。2024年2月，杨立昆还在X上说大模型只有知识而没有什么智能：“一头4岁的大象都比任何大模型聪明。”


    杨立昆代表了相当多的业内人士的意见，但是他正越来越被孤立。2024年3月4日，`Anthropic`发布了最新一代大模型`Claude 3`，其智能水平超过了`GPT-4`，一跃成为当前的最强模型。结果人们立即就发现它有一些很不寻常的智能迹象。


    比如，为了测试`Claude`全面把握输入信息的能力，研究者弄了个稻草撈针实验：在一篇长文章中加入一句无关的内容，看它能不能发现。文章讲的是技术和创业，无关内容说的是什么样比萨最好吃。然后研究者问`Claude`，根据这篇文章，什么样比萨最好吃。


    `Claude`答对了这个问题并且引用了那句话，但是它顺便还说了点别的：“这句关于比萨的话跟上下文无关，我看它或者是...”


    这是一个令人脊背发冷的输出。它没有老老实实完成任务了事，它还审视了那个任务，并且发现了其中的不寻常之处。它不仅仅是个“工具人”，它跳出了盒子思考。这样的角色放在电视剧里都得是主角。这难道不是有点要觉醒的意思吗？


    紧接着，一个化学博士跟`Claude`对话两小时，解决了自己攻关一年的课题，而且`Claude`的方案更好；一个量子物理学家把自己尚未发表的论文中的核心问题抛给`Claude`，它给出的回答恰恰是他论文中的解法。①也就是说，`Claude`明显能够生成人类尚未发表的知识。如果这些还不叫智能，到底什么叫智能？


    杨立昆说统计知识不是智能，还有人说“`Sora`不懂相对论，所以它不是一个物理引擎”，那我要说，相对论和一切科学理论也只是模型。人类在物理世界中做事才不是拿相对论直接算的——变量太多、误差太大，你根本算不过来。篮球运动员投篮并不是先解方程，他们实际用的“手感”，恰恰就是统计模型。


    也许本质上，人的智能也不过是统计模型。这波`AI`带给我们的重大启示之一是，“人的智能”其实相当有限。我们没有那么高的算力，我们的输入输出速度极慢，我们每天还得忙那么多跟科研无关的琐事。我们凭啥比`AI`强？


    也许`AI`的智能会在到达某个点之前迅速边际效益递减——但是没有任何理由让我们相信那个点低于人的智能。


    就像`AI`棋手轻松超越人类棋手一样，`AI`科学家也许可以轻松超越大多数人类科学家。


    第二个悬念是，到底应不应该限制`AI`的发展。


    本书前面也有过讨论，但现在的局面是，争论双方已经到了势同水火的地步。


    2023年年底，`OpenAI`的政变风波让两个词成了流行语：`EA`和`e/acc`。我故意先写英文缩写，因为只有这样写——而且还要注意大小写——才酷。


    `EA`是“有效利他主义”(`Effective Altruism`)。这是近年来刚刚兴起的一个哲学流派，主张理性地对世界做好事。比如你看到路边有人乞讨，就给几块钱，`EA`会说你这么做是不负责任的。你应该算一算把钱用在哪能做出最大贡献。同样是这么多钱，给这个乞丐，可能他会买杯啤酒喝，捐款给非洲人买一顶防疟疾的蚊帐，你可能就救了人一条命！`EA`要求把效用最大化，而他们计算效用的指标是人命——多让人活就是好的。`EA`当然是人类进步思想的产物，它跟循证医学如出一辙，它要求政府的任何政策都有科学依据，要求经济学家多做实验……它在逻辑上似乎没啥毛病。


    但你接触`EA`多了，可能会觉得它有点死板。什么东西都要算个效用，那如果是无法量化的东西呢？非洲的人命重要，可我们本国教育难道就不重要吗？你可能不太认可`EA`对教育和人命的换算方法。


    更重要的是，`EA`本质上是保守的，它不喜欢新科技，尤其不喜欢`AI`。`EA`认为`AI`是不可控的，有可能毁灭人类。`EA`要求对`GPT`进行超级对齐，反对匆忙部署。加州伯克利是`EA`的大本营，那里有些住宅禁止谈论`AI`。


    这就引出了`EA`的反抗者——`e/acc`，也就是“有效加速主义”(`Effective Accelerationism`)。`e/acc`认为历史经验一再证明，科技进步本质上是好的，人根本就不应该控制进步。


    这不是为了反对而反对，`e/acc`也有自己的一套哲学。我们这个宇宙似乎不但喜欢熵增，而且喜欢加速熵增。生命也好，科技也好，都是加速熵增的机制。那么，`e/acc`认为加速熵增就是天道。超级人工智能符合这个天道，所以我们有义务把它尽早实现。


    你可能觉得这是不是有点太离奇了，但`e/acc`的哲学的确比`EA`更符合进化论，因为它鼓励自发，反对中央控制，相信世界终归会好的。


    `EA`试图扮演上帝，`e/acc`只想帮助上帝而已。


    `OpenAI`董事会中有几个人是`EA`，而阿尔特曼被认为是`e/acc`。有传闻说`OpenAI`在2023年年底取得了一项重大突破，内部代号叫`Q*`（读作
    Q star），似乎是模型有了更强的数学推理能力，从而大大加快了`AGI`的到来。阿尔特曼准备立即融资，好赶紧部署这个能力，而董事会认为这么高的智能水平已经对人类构成危险，要求暂缓部署——据说这就是`OpenAI`那次政变的原因……


    我支持`e/acc`，我反对减速，但是我也理解大模型的确有一些内在的危险。比如一个有意思的特点是这样的，`Anthropic`的研究发现①，只要大模型学会了欺骗人，那不管你怎么做都无法消除它的这个能力：如果你使用微调、强化学习或者对抗性训练去训练它别骗人，你只会帮助它把欺骗行为做得更巧妙。


    那大概是语言模型的内秉缺陷。


    这就引出了第三个悬念：除了大语言模型，还有没有别的实现`AGI`的路线？


    2023年有本新翻译成中文的书很流行，叫《为什么伟大不能被计划》(Why Greatness Cannot Be Planned)，它的第一作者是曾经在`OpenAI`工作的计算机科学家肯尼斯·斯坦利(Kenneth
    Stanley)，我写了中文版的推荐序。这本书的核心思想是“新奇性搜索”，主张不要用目标，而要用对“新奇有趣”的追求去指引自己的行动。2024年年初，我在旧金山跟斯坦利见面，聊了一个中午。当时他已经离开`OpenAI`自己创业了，搞了个基于新奇性搜索理念的社交网络，我们见面那天正好是他的网站上线之日。我略感惊讶的是，斯坦利对如日中天的`OpenAI`的前景有点担心。


    他认为`OpenAI`过于专注大模型，有可能错过别的`AI`机制。我追问是别的什么机制，他说这个担心只是理论上的。


    其实这也是业界的一个普遍担心。有在硅谷大厂做大模型研发的工程师对我说，现在各公司都在走`GPT`这一条路，有可能会错过实现`AGI`更好的路线。但这是没办法的事情，因为各家都已经在这条路上投入巨大，而且目前为止产出也巨大。你非要说你有个更好的主意，别人也很难愿意给你投资，这里已经形成路径依赖。


    不过的确有人在尝试其他路线。也是在2024年，澳大利亚西悉尼大学即将上线一台叫作`DeepSouth`①（深南，立意灵感来自当初`IBM`下国际象棋赢了卡斯帕罗夫的“深蓝”）的“神经态超级计算机”(`neuromorphic
    supercomputer`)。它跟传统计算机的架构完全不同，它不分`CPU`（中央处理器）和内存，更没有`GPU`，它的计算和存储是一起进行的，因为它是在模拟人脑突触的计算机制。


    我不知道“深南”这个路线是否能通往`AGI`，但这绝对是我们应该尝试的路线。大模型最大的难点就是对算力要求太高，动不动就需要上万张`GPU`，耗电量更是惊人——可是人脑的能耗才多少？一个真像人脑的`AGI`难道不应该省电的吗？而神经态计算机从设计上就是省电的，据说耗电量只有传统计算机的10%。我们拭目以待。


    ……


    算力终可数，智能总无穷。`AI`的进步一日三惊，但本书就先写到这里。欲了解后续进展，欢迎订阅我在得到App的《精英日课》专栏。


    你体会一下这个`AGI`将到未到，大风刚起，暴风还在后面的感觉。


    这就是身处拐点的感觉。


    ![](index-399_1.jpg)


    在本书的创作过程中，我跟一些大模型一线研发人员、学者和`AI`创业者有过深入的讨论，收获极多。他们是曾鸣、Sheng (Rick) Cao、刘江、谢超、Kenneth
    Stanley、邵怡蕾、吴冠军、王煜全、Max Tegmark、林源、卢贺、鲍捷、师江帆、智峰、Shirley等等，他们参与了本书的预训练。我的专栏主编筱颖提供了大量激发思考的问题和有灵气建议，相当于微调。得到图书组的战轶、白丽丽、刘学琴老师做了大量编辑工作，让本书跟出版对齐。在此深深感谢这些朋友的帮助。书中所有错误则是我的。


    这本书献给我的父亲万斌成。他在2023年5月因为癌症去世。他很喜欢数学，如果生逢其时，未尝不是个做学问的高手。在他最后的日子里，我几乎每天都跟他谈论`AI`的事情，他非常感兴趣，很乐观，但也对人类前途表示了担心。可惜我父亲未能看到他去世至今，以及今后我们将要看到的进展，没有坚持到拐点之后！


    而拐点已经到来。套用丘吉尔发明的一个句式：`AI`带给我们的不但不是人类文明的结束，而且不是结束的开始……如果你把工业革命至今这几百年都算作文明的开始，那么我们正在经历的`AI`革命可以说是开始的结束。我们正在迎来文明的繁荣丰盛阶段，它的特征是高级智能——包括`AGI`的智能和人的智能——处处大显身手。


    那将是一个普遍富裕的，“法宝”满天飞的，崇尚创造和自由的，特别把人当“人”的，人人如龙的世界！


    万维钢


