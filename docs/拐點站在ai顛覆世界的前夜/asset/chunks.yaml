    維森鮑姆只是用了一些最簡單的語言處理，伊麗莎根本談不上是 AI，但是他做得很巧妙。伊麗莎會尋找用戶輸入的話中間的關 鍵詞，做出特定反應。比如你說「我最近有點抑鬱」，它馬上就會說
