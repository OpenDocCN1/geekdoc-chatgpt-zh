    ## 前言：人要比AI兇


    如果你不記得自己在2023年3月15 日那天的日程，我建議你現在就回想一下……因為若干年後，你的子孫後代可能會問你： `GPT-4`發佈的那一天，你在幹什麼?


    `GPT-4`不是「另一個」AI模型。它的某些能力讓最資深的AI專家也深感震驚，以至於直到現在還沒有人真的理解它為什麼這麼厲害。它讓我們第一次感到「通用人工智慧」(
    Artificial General Intelligence, `AGI`) 真的要來了。它也讓世人第一次切實感受到了 AI對人類的威脅。


    2023年是 AI元年。有些業內人士相信`AGI`將會在2026年左右實現。這意味著 AI在所有認知領域———聽說讀寫、判斷病情、創作藝術，甚至從事科學研究———都做得像最好的人類一樣好，甚至更好。我認為在某種意義上`GPT-4`已經是弱版的`AGI`，它掌握的醫學知識超過了所有醫學院學生，它參加律師資格考試的成績超過了90%的考生。這一波`GPT`
    革命每天都有新突破，我們仍然在探索之中。


    其實我們早就開始探索了。早在2020年7月 30日，我在《精英日課》的專欄裡就介紹過一個「好到令人震驚的人工智能模型」①———`OpenAI`公司的`GPT-3`。


    `GPT-3` 的功能已經相當了得，它可以根據你的一段描述給你寫一段程序，可以幫你寫段文章，可以相當智能地回答你的問題，等等，只是水平沒有那麼高。而且當時`OpenAI`沒有開放普通用戶註冊，我們不能上手，感受不深。


    ①萬維鋼，《`GPT-3`：一個令人震驚的人工智能模型》，得到 App 《萬維鋼·精英日課第4季》。


    2 拐 點


    2022年底, `OpenAI`推出了對話應用 `ChatGPT`, 這回大家都可以體驗 `GPT-3` 了 。 2023 年 2 月 1 日 , `ChatGPT`
    升級到收費的 `ChatGPT Plus`, 它背後的主力模型變成了 `GPT-3.5`, 繼而是 `GPT-4`；接著，`ChatGPT`有了插件功能，它能上網，還能讀取和處理數據；後來又升級到有多模態功能的`GPT-4V`，然後是個人定製的`GPTs`和`GPT`商店,
    甚至 2024年會出來 `GPT-5`……如果你把AI 視為人類的敵人，這短短的一年多，你應該一日三驚。


    截至2023年底, `ChatGPT`的月活用戶數量已經超過15億,仍然供不應求，以至於 `OpenAI`不得不一度關閉了收費用戶的註冊。這是比包括個人電腦和智能手機在內的歷史上任何一項科技都更快的普及速度。


    但是包括某些行業資深人士在內，很多人都不理解 `GPT`到底是什麼。


    一個流行的錯誤認識是把它當成了一個聊天機器人。


    有人拿各種腦筋急轉彎的題目逗 `ChatGPT`： 「樹上 10只鳥，開槍打死1只鳥，樹上現在有幾隻鳥? 」`ChatGPT`的早期版本會老老實實地回答 「
    還 剩 下9 只 鳥」 ， 人類說 「 哈 ！ 你還 是 不 夠 聰明 啊」。


    2023 年底的 `ChatGPT`已經知道「其餘的鳥由於受驚嚇很可能 會飛走，所以樹上可能不會剩下任何鳥」，但這不重要。要知道 `ChatGPT` 並不是一個聊天機器人———它不是一個以陪你聊天解悶為目的的機器人。


    前 言 3


    `ChatGPT` 是一個使用`GPT` 模型、以聊天方式為界面的信息處理工具。


    它這個界面做得如此之好，以至於人們把界面當成了主體，這就如同稱讚一部手機「哎呀，你這個手機真好看」。殊不知聊天只是輸入、輸出的手段，處理信息才是目的。我們關心的是作為大腦的`GPT`
    模型。


    你不用`ChatGPT` 也可以直接調取`GPT`模型，比如，現在已經有成百上千家小公司用`API`(應用程序編程接口)接入了`GPT`，讓`GPT` 讀取特定環境下的文本，完成信息處理。你可以用`GPT`:


    編程①;


    以問答的形式學習一門知識；


    在中英文之間進行高質量翻譯；


    修改文章，或者根據你的意圖直接寫文章；


    獲得書名、 大綱、 小說劇情、廣告等文案的創意構思；


    幫你制訂購物清單、旅行建議和健身計劃；


    分析你上傳的數據文件並且畫圖；


    上網瀏覽， 調用第三方工具；


    理解並生成圖片和聲音；


    直接操控你的計算機；


    通過現場編程操控機器人；


    ……


    ① 現在普遍認為 `ChatGPT`的編程水平比文字處理水平高，這可能是因為編程是一種更規範的活動。


    4 拐 點


    而 2023年這一波AI大潮中可不只出現了 `OpenAI`的`GPT`。


    `Google` (谷歌)、`Meta`(美國互聯網公司, 前身是 Facebook)、馬斯克的 `X` ( 原 推 特 ) 等 公司 都有 自 家 的 大
    語 言 模 型 ， 還 有 `Midjourney`、`Stable Diffusion`等專門畫圖的模型, 年底還出現了一波用文字直接生成視頻的模型，特別是2024年年初出來的
    `Sora`，震撼了世界，中國這邊則有「百模大戰」，等等。它們背後的基本原理跟`GPT`是一樣的。


    很多人說這類技術叫 「 生成性 AI」( 中國 的 說 法 叫 `AIGC` )，但我看這個說法還是沒有抓住大圖景。這一輪AI突破的意義不僅僅是能生成內容。


    大圖景是，AI已經開始非常嚴肅地做傳統上我們認為只有人能做的事情了。它們的智能正在超過我們。


    ![](index-10_1.jpg)


    隨著 AI能做的事情越來越多，有一個問題也被討論得越來越多——AI到底降低了人的價值還是提高了人的價值?


    這取決於你怎麼用它。


    把事情直接交給AI做，是軟弱而且危險的。比如你想給人寫封信，怕自己寫得不夠禮貌周到，就讓 `ChatGPT` 替你寫。它的確可以寫得很好，寫成詩都可以——但是，如果讀信的人知道你是用`ChatGPT`
    寫的, 或者對方因為也會用 `ChatGPT`, 根本懶得讀全文，選擇讓`ChatGPT` 做個摘要，那你這封信還有必要走 AI這道程序嗎?難道 AI的普及不應該讓大家更珍視坦誠相見嗎?


    前 言 5


    演員鄭伊健在一部賽車電影裡有句話叫「人要比車兇」，指的是人一定要比工具強勢。強勢的用法，是把 AI 當作一個助手、一個副駕駛，你自己始終掌握控制權——AI的作用是幫你更快、更好地做出判斷，幫你做你不屑於花時間做的事情。人要比
    AI兇。


    如果你足夠強勢，當前AI對你的作用有三個。


    第一是信息槓桿。


    想要了解任何信息都能得到答案，這件事在有搜索引擎以前是不可能的，在有搜索引擎、沒有`GPT` 之前是費時費力的。而現在你可以在幾秒鐘之內完成。


    當然 AI返回的結果不一定準確，它經常犯錯，關鍵信息還是得你親自查看一下原始文檔。但我這裡要說的是，「快」，就不一樣。當你的每一個問題都能立即得到答案，你的思考方式會換擋。你會進入追問模式，你會更容易沿著某個方向深入追蹤下去。


    第二是讓你發現自己究竟想要什麼。


    科技播客主 `Tinyfool`(郝培強) 在一個訪談中①描繪了這麼一個場景。假如你想買房， 問AI哪兒有便宜房子，AI反饋一些結果，你一看距離公司太遠了，意識到你想要的不只是便宜。於是你又讓
    AI在一定區域內尋找便宜房子，AI 又反饋一些結果，你又想到面積和學區⋯ ⋯


    一開始你並沒想那麼多，是跟AI的對話讓你想清楚自己到底想要什麼。這完全不平凡，因為我們做很多事情之前是不知道自己想幹啥的——我們都是在外界反饋中發現自我的。


    ①`Tinyfool`: 《 `ChatGPT` 會 如 何 改 變 我 們 的 生 活 ? 》 , 不 明 白 播 客 ,https://www.bumingbai.net/2023/02/ep-037-tinyfool-text/,
    2023 年 3 月 3 日 訪問。


    6 拐 點


    第三是幫你形成自己的觀點和決策。


    很多人覺得可以用AI寫報告，可是如果報告裡沒有你自己的東西，它有什麼意義呢?而如果報告裡只有你自己的東西，AI 有什麼意義呢?AI的意義是幫助你生成更有自身特色的報告。


    主動權必須在你手裡。是你輸出主動，但是你的主動需要AI幫你發現。


    通過幫你獲得新知、發現自我，AI能讓你更像「你」。


    它提供信息，你做出取捨。它提供創意，你選擇方案。它提供參考意見，你拍板決策。


    你藉助AI完成的這份作品的價值不在於信息量足，更不在於語法正確，而在於它體現了你的風格、你的視角、你的洞見、你選定的方向、你做出的判斷、你願意為此承擔的責任。


    如果學生的作業都能體現這樣的個人特色，學校何必禁止`ChatGPT` 呢?


    ![](index-12_1.jpg)


    這絕對是 20世紀 90代那波互聯網大潮以來最熱鬧的時刻。如果 你有志於做一番大事，成為駕馭強大工具的人，怎樣才能不錯過這一波機遇?


    我是個科學作家。在得到App的年度專欄《精英日課》第5季中，我以專題連載的形式全程跟蹤了這一波 AI大潮。我調研了最新的研究結果，學習和比較了當今最厲害的幾個頭腦對


    前 言 7


    AI的認識，特別是上手做了很多實操。我甚至把家搬到了 AI革命的中心———舊金山灣區，我面對面採訪了很多位一線AI 研發者和AI應用創業者。這本小書是我寫給你的報告和感悟。
    我會在書裡探討幾個大問題：


    ·我們該怎麼理解這個 AI大時代的哲學?AI作為一個新的智慧形態， 它的能力邊界、它的底牌和命門， 究竟是什麼?


    大語言模型的智能為什麼是出乎意料的?它的原理對我們有什麼啟示?


    當 AI滲透進經濟活動，會如何提升生產力?路徑和邏輯又是什麼?


    當 AI干預了道德， 甚至法律，我們的社會將會變成什麼樣子?


    AI還在以更快的速度迭代， 面對這個局面，教育應該怎麼辦?公司應該怎麼辦?人應該怎麼辦?


    如果 `AGI`和超級人工智能也有了人的意識和情緒， 人應該放棄這些能力和價值嗎?


    我還會跟你分享實操經驗，比如如何使用 `GPT`進行對話式學習、編程，怎樣讓它成為你的助理， 以及跟它溝通的「咒語」心法。


    隨著模型不斷升級，講 AI的書都面臨很快過時的風險——但我希望這本書不會， 因為本書講的是原理、心法、經濟學、 教育和哲學這些更基本的東西。這些學問讓你面對再大的不確定性也能篤定地堅守更高的原則。咱們後面慢慢講。


    8 拐 點


    但我最先想對你說的是，AI的作用應該是放大你，而不是取代你。當你看完這本書，再次使用`ChatGPT`的時候，可以試試這個 「一放一收」的套路：


    放，是讓思緒在海量的信息裡自由飛翔， 尋找洞見；


    ·收，是找到自我， 決定方向， 掌控輸出。


    越是 AI時代，公共的信息就越不值錢。現在個人搞一個外部信息保存系統已經意義不大了，一切唾手可得，整個互聯網就是你的硬盤，人類所有的知識就是你的第二大腦。


    你真正需要保存的是自己每天冒出的新想法，是你對信息的主觀整理和解讀。


    一切落實到自己。


    永遠假定別人也會用`ChatGPT`。


    ![](index-14_1.jpg)


    這波 `GPT` 大潮跟我們這一代人經歷的所有科技進步比有個特別不一樣的地方。像5G、元宇宙、區塊鏈那些東西都是越不懂的人越一驚一乍，懂的人都覺得其實沒啥了不起。可是對於
    `GPT`, 恰恰是不懂的人還在「正常化偏誤」( normalcy bias)之中， 以為 AI 的能力不過如此，越懂的人卻越是暗暗心驚。


    孤陋寡聞的人不知道AI，認知固化的人忽視AI，膚淺的人害怕 AI, 熱情的人歡呼 AI……我們率先使用 AI、探索 AI、試圖理解 AI。希望這本書讓你直通最高水平。


    你不會在 AI面前失去自我。你不但應該，而且必須，而且可以,以「我」為主, 使用AI。


    ![](index-16_1.jpg)


    ## 第一章 ChatGPT 究竟是什麼


    ### 01 大變局：一個新智慧形態的產生


    正 如 `iPhone` 在 2007 年 開 啟 了 智 能 手 機 時 代 , `ChatGPT` 在2023年開啟了人工智能時代。很榮幸我們趕上了這個歷史時刻。那怎麼理解這個新時代呢?要想知道
    `ChatGPT` 究竟是什麼，我們必須先考慮更大的問題：AI究竟是一種什麼智能?


    ![](index-17_1.jpg)


    2020年，麻省理工學院宣佈發現了一種新的抗生素，叫`Halicin`。這是一種廣譜抗生素，能殺死那些對市面上現有的抗生素已經產生耐藥性的細菌，而且相當安全。


    這個幸運的發現，是用AI完成的。研究者先搞了一個由2000個性能已知的分子組成的訓練集，這些分子都被標記好了是不是可以抑制細菌生長，然後被用來訓練 AI。AI自己學習這些分子都有什麼特點，總結了一套「什麼樣的分子能抗菌」的規律。


    這個 AI模型訓練好之後，研究者用它一個個考察美國食品藥品監督管理局(`Food and Drug Administration`, `FDA`) 已經批准的藥物和天然產品庫中的61000個分子，要求它按照3個標準從中選擇抗生素：(1)它具備抗菌效果；(2)它看起來不像已知的抗生素；(3)它必須是無毒的。


    第一章 `ChatGPT` 究竟是什麼 003


    AI從這6萬多個分子中最後找到1個符合所有要求的分子，這就是 `Halicin`。然後研究者做實驗證明，它真的非常好使。它大概很快就會用於臨床，造福人類。


    用傳統的研究方法，這件事是絕對做不成的———你不可能一個個測試61000個分子，那成本太高了。而AI把它變成一個看起來很簡單的計算問題。這只是當代 AI眾多的應用案例中的一個，它很幸運，但是它並不特殊。


    我之所以先講這個例子，是因為它帶給我們一個清晰的認知震撼——`Halicin`可以作為抗生素的化學特徵是人類科學家所不理解的。


    關於什麼樣的分子可以做抗生素，科學家以前是有些說法的，比如原子量和化學鍵應該具有某些特徵。可是，AI這個發現用的不是那些特徵。AI在用那2000個分子做訓練的過程中找到了一些不為科學家所知的特徵，然後用那些特徵發現了新的抗生素。


    那些是什麼特徵呢?不知道。整個訓練模型只是一大堆———也許幾萬或者幾百萬個———參數，人類無法從那些參數中讀出理論。


    這可不是特例。`AlphaGo Zero`(人工智能圍棋軟件) 完全不用人類棋手的棋譜，通過自己跟自己對弈學會下國際象棋和圍棋，然後輕鬆就能打敗人類。它經常走出一些人類棋手感到匪夷所思、沒有考慮過的走法。比如在國際象棋裡，它看似很隨便就可以放棄皇后這樣的重要棋子⋯
    ⋯ 有時候你事後能想明白它為啥那樣走，有時候你想不明白。


    004 拐 點


    這個關鍵在於，AI的思路，不同於人類的理性套路。


    也就是說，當代AI的最厲害之處並不在於自動化，更不在於它像人一樣思考，而在於它不像人———它能找到人類理解範圍之外的解決方案。我後面會論證，其實AI這個思維方式恰恰就是人的感性思維，在這個意義上你也可以說AI很像人——但是現在，請你先記住這個無法讓人理解的、「不像人」的感覺。


    在中國人人皆知的亨利·基辛格 (Henry Kissinger), 剛剛在2023年，100歲上去世了。他生前最後一本書講的不是國際政治,而是AI, 是他與`Google`前CEO埃裡克·施密特(
    Eric Schmidt)、麻省理工學院蘇世民計算機學院院長丹尼爾·胡滕洛赫爾 ( Daniel Huttenlocher) 合著的《人工智能時代與人類未來》(The
    Age of AI And Our Human Future )。他們提出了一個觀點：


    從人的智能到人工智能之變，不但比信息革命重要，而且比工業革命重要———這是啟蒙運動級別的大事件。


    ![](index-19_1.jpg)


    這不是汽車取代馬的發明，也不僅僅是時代的進步。這是哲學上的跨越。

