  trans: '


    # 第一章 ChatGPT 究竟是什麼


    人類從古希臘、古羅馬時代就在追求「理性」。到了啟蒙運動時期，人們更是設想世界應該是由一些像牛頓定律這樣的明確規則構建的。康德(`Kant`)以後的人們甚至想把道德也給規則化了。我們設想世界的規律應該像法律條文一樣，可以被一條條寫下來。科學家一直都在把萬事萬物分門別類，劃分成各個學科，各自總結自己的規律，打算最好能把所有知識編寫進一本百科全書。


    然而進入 20 世紀，哲學家路德維希·維特根斯坦(`Ludwig Wittgenstein`)提出了一個新的觀點。他認為這種按學科分類、寫條文的做法根本不可能窮盡所有知識。事物之間總有些相似性是模糊的、不明確的、難以用語言說明的。想要「丁是丁，卯是卯」，全都理性化，根本做不到。


    現在 AI 找到的，恰恰就是一些難以被人理解、不能用明確的規則定義而且根本無法言說的規律。這是柏拉圖(`Plato`)理性的失敗，是維特根斯坦的勝利。


    其實不用 AI 你也能想明白這個道理。比如，什麼是「貓」?你很難精確定義貓到底是什麼東西，但是當你看到一隻貓的時候，你知道那是貓。這種認知不同於啟蒙運動以來人們追求的規則式的理性，但你可以說這是一種「感覺」——一種難以明說、無法告訴另一個人，但是你自己能清楚感受的感覺。我們對貓的認識很大程度上是感性的。


    而現在 AI 有這種感覺。當然，人一直都有這種感覺，這本來沒什麼，康德也承認感性認知是不可缺的。問題是，AI 通過這樣的感覺，已經認識到了一些人類無法理解的規律。哲學家原本認為只有理性認知才能掌握世界的普遍規律。


    AI 感受到了人類既不能用理性認知，也感受不到的規律，而且它可以用這個規律做事。


    人類已經不是世界規律唯一的發現者和感知者。


    你說這是不是啟蒙運動以來未有之大變局?


    ## 拐點


    有些人把 AI 當作一種「超級智能」，彷彿神靈一般，認為 AI 能把人類如何如何———這種討論沒什麼意義。如果神靈都已經降臨人間了，我們還在這兒聊什麼?不要高推聖境。


    當前一切主流 AI 模型，都是通過機器學習(`Machine Learning`)訓練的神經網絡系統。


    這很不平凡。你要知道，20 世紀 80 年代以前，科學家還在嘗試用啟蒙運動理性的思路，把解決問題的規則輸入給計算機執行。人們發明了「自然語言處理」(`Natural
    Language Processing`, `NLP`)、機器翻譯、詞法分析、語音識別等技術去模擬人腦的理性思維，結果那條路越走越難———規則太多了，根本弄不過來。另有一些科學家發明了神經網絡算法，模擬人腦的感知能力，`GPT`是這條路的產物。現在根本不用告訴
    AI 任何語言規則，我們把整個學習過程都委託給機器——有什麼規律你自己領悟去吧。


    這個思路受到了人腦神經網絡的啟發，但是結構並不完全一樣。AI 神經網絡分為輸入層、很多箇中間層和輸出層，其實比人腦要簡單。


    使用 AI 神經網絡，分為「訓練」(`training`)和「推理」(`inference`)兩部分。一個未經訓練的 AI 是沒用的, 它只有搭建好的網絡結構和幾萬甚至幾千億個數值隨機設定的參數。你需要把大量的素材餵給它進行訓練。每個素材進來，網絡過一遍，各個參數的大小就會進行一遍調整。這個過程就是機器學習。等到訓練得差不多了，參數值趨於穩定，就可以把所有參數都固定下來，模型就煉製完成了。你就可以用它對各種新的局面進行推理，形成輸出。


    比如, `ChatGPT`曾經用過的一個語言模型版本是`GPT-3.5`,它大約是 2021 年至 2022 年之間訓練完成的，它的參數和知識固定在訓練完成的那一天。此後我們每一次使用`ChatGPT`，都只是在用這個模型推理，而並沒有改變它。


    `GPT-3.5`有超過 1000 億個參數, 之後的`GPT-4`、未來`GPT-5`的參數要更多，AI 模型參數的增長速度已經超出了摩爾定律。搞神經網絡非常消耗算力。


    ![](img/index-22_1.jpg)


    現在有 3 種最流行的神經網絡算法，「監督學習」(`Supervised Learning`)、「無監督學習」(`Unsupervised Learning`)和「強化學習」(`Reinforcement
    Learning`)。


    前面那個發現新抗生素的 AI 就是監督學習的典型例子。在給出有 2000 個分子的訓練數據集前，你必須提前標記好其中哪些分子有抗菌效果，哪些沒有，才能讓神經網絡在訓練過程中有的放矢。圖像識別也是監督學習，你得先花費大量人工把每一張訓練圖裡都有什麼內容標記好，再餵給
    AI 訓練。


    如果要學習的數據量特別大，根本標記不過來，就需要無監督學習———你不用標記每個數據是什麼，AI 看得多了會自動發現其中的規律和聯繫。


    比如，淘寶給你推薦商品的算法就是無監督學習。AI 不關心你買什麼樣的商品，它只是發現買了你買的那些商品的顧客也會買別的什麼商品。


    強化學習是在動態的環境中，事先並不設定什麼樣的動作是對的，但 AI 每執行一步都要獲得或正或負的反饋。比如`AlphaGo Zero`下棋，它每走一步棋都要評估這步棋是提高了比賽的勝率，還是降低了勝率，也就是通過獲得即時的獎勵或懲罰，來不斷調整自己。


    自動駕駛也是強化學習。AI 不是靜態地看很多汽車駕駛錄像，它是直接上手，在即時環境中自己做動作，直接考察自己的每個動作會導致什麼結果，獲得及時的反饋。


    我打個簡單的比方：

    ·監督學習就好像是學校里老師對學生的教學，對錯分明，有標準答案，但可以不給學生講是什麼原理；

    無監督學習就好像一個學者，他自己調研了大量的內容，看多了就會了；

    ·強化學習則是小孩學走路或者訓練運動員，某個動作帶來的結果好不好立即就知道。


    ![](img/index-23_1.jpg)


    機器翻譯本來是典型的監督學習。比如你要做英譯中，就把英文原文和中文翻譯一起輸入神經網絡，讓它學習其中的對應關係。但是這種學法太慢了，畢竟很多英文作品沒有翻譯版。後來有人發明了一個特別高級的辦法，叫「平行語料庫」(`Parallel
    Corpora`)。


    先用對照翻譯版進行一段時間的監督學習作為「預訓練」(`pre-training`)。等模型差不多找到感覺之後，你就可以把一大堆同一個主題的資料———不管英文還是中文，不管文章還是書籍，還不需要互相是翻譯關係———都直接扔給機器，讓它自學。


    這一步就是無監督學習了。AI 進行一段沉浸式的學習，就能猜出來哪段英文應該對應哪段中文。這樣訓練不是那麼精確，但是因為可用的數據量很大，所以訓練效果很好。


    像這種處理自然語言的 AI 現在都用上了一個新技術，叫`Transformer`架構。它的作用是讓模型更好地發現詞語跟詞語之間的關係，而且允許改變前後順序。比如「貓」和「喜歡」是主語跟謂語的關係，「貓」和「玩具」則是兩個名詞之間的「使用」關係———AI
    都可以自行發現。


    還有一種流行技術叫「生成性神經網絡」(`Generative Neural Networks`), 特點是能根據輸入的信息生成一個東西, 比如一幅畫、一篇文章或者一首詩。生成性神經網絡的訓練方法是用兩個具有互補學習目標的網絡相互對抗：一個叫生成器，負責生成內容；一個叫判別器，負責判斷內容的質量。二者隨著訓練互相提高。


    `GPT`的全稱是`Generative Pre-Trained Transformer`(生成式預訓練變換器)，就是基於`Transformer`架構的、經過預訓練的、生成性的模型。


    ![](img/index-24_1.jpg)


    當前所有 AI 都是大數據訓練的結果，它們的知識原則上取決於訓練素材的質量和數量。但是，因為現在有各種高級的算法，AI 已經非常智能了，不僅能預測一個詞彙出現的頻率，更能把握詞與詞之間的關係，有相當不錯的判斷力。


    但是，AI 最不可思議的優勢是，它能發現人的理性無法理解的規律，並且據此做出判斷。


    AI 基本上就是一個黑盒子，吞食一大堆材料之後突然說「我會了」。你一測試發現，它真的很會，可是你不知道它會的究竟是什麼。


    因為神經網絡本質上只是一大堆參數，而我們不能直接從那些參數上看出意義來。這個不可理解性可以說是 AI 的本質特徵。事實是，連`OpenAI`的研究者也搞不清`GPT`為什麼這麼好用。


    我們正在目睹一個新智慧形態的覺醒。


    ### 問答


    #### 問 自然叢林


    我的孩子正上初中，以後打算從事人工智能行業，請問他現在重點應當學好哪些學科?


    萬維鋼


    ![](img/index-26_1.jpg)


    人工智能行業選人很看重大學專業。一般需要計算機科學、統計學、數據處理、計算機圖形等方面的人才，有的大學直接就有 AI 專業。對大學生來說，最好是以其中的一門為主專業，再輔修一個像認知科學、腦科學、心理學、哲學之類的專業，那簡直就是定製的
    AI 人才。


    對初中生來說，一方面是確保自己能考進一所提供這些專業的好大學，另一方面應該提前做些準備。最重要的就是數學。大腦中有過硬的數學肌肉，才能迅速理解和掌握各種抽象概念，比如程序的邏輯結構。其次是廣泛閱讀，對世界是怎麼回事有個合格的瞭解。


    有了`ChatGPT`，學外語和編程現在處於很微妙的境地。一方面，AI 幾乎已經消除了外語障礙，還可以幫人編程。我相信您的孩子長大以後，人們會普遍使用自然語言編程。另一方面，學習外語和編程並不僅僅是為了這些技能本身，也是對大腦的開拓。但好消息是，AI
    讓外語和編程學習都變容易了，現在是事半功倍，那何樂不為呢?


    反過來說，像書法、音樂那些流行的課外項目，費時費力費錢，相對別的項目來說，性價比會越來越低。如果不是孩子真有興趣，應該放棄。


    #### 回 Charles


    移動網絡的興起讓`Google`和百度的市場空間變小了，`ChatGPT`的興起會不會改變人們獲取信息的來源，從而改變商業機構的推廣手段呢?


    萬維鋼


    像`ChatGPT`和`Bing Chat`(必應)這種對話模式的信息處理方式, 已經對`Google`搜索產生了強烈威脅。`Bing Chat`出來以後，`Google`的股價應聲而落，搜索流量也下降了。


    搜索廣告收入是`Google`的命脈所在。在搜索頁面上加廣告是比較自然的，反正你的眼睛也要把整個頁面的結果都過一遍，順帶看幾個廣告沒啥不方便。但如果要在聊天中插播廣告，那就太影響使用體驗了。前者如同在電視劇播出之前看段廣告，後者如同把電視劇劇情用廣告給改編了。


    `Bing Chat`出來以後, `Google`迅速推出了自己的聊天機器人`Bard`。這還沒插廣告呢，僅僅是因為`Bard`在回覆中說錯了一個有關韋布空間望遠鏡的事實，就引起了人們強烈的不滿。可見，人們對聊天體驗的要求是很高的。


    我用`Bing Chat`這段時間以來，曾經遇到過幾次，它把廣告插入到對話框外層。這可能是個辦法，但是效果有待檢驗。


    目前來說，不論`Google`還是微軟，都還沒有找到很好的插入廣告的解決方案。


    現在市面上已經有若干個新型搜索引擎，以不帶廣告為賣點。也許搜索引擎下一步的出路是讓用戶付費訂閱無廣告的搜索服務。


    值得一提的是，基於`GPT`的搜索對算力的要求是傳統搜索的 10 倍以上。我們平時總愛說軟件服務的邊際成本是零——其實不絕對是零，它需要很大的算力、很多的芯片和服務器，尤其現在
    AI 芯片那麼貴。這個成本也是一個考慮。


    我們可以想見，現在`Google`感到很難受。


    ## 02 「開悟」和「湧現」：AI 能力的三個境界


    現在最流行的幾個生成式 AI, 包括`ChatGPT` 和畫畫的 AI, 背後都是「大語言模型」(`Large Language Models`, `LLM`),
    也就是用海量的語料訓練出來的大模型。這也是通往`AGI`的技術路線。大語言模型為什麼這麼厲害?


    我先舉個例子。我問`ChatGPT`：棒球棒能被藏進人的耳朵裡嗎?它說不能，因為人的耳朵是非常小的，棒球棒的大小和形狀超出了耳朵所能容納的範圍⋯ ⋯ 很有條理。(圖
    1-1)


    我又問它：為什麼金箍棒能被藏進孫悟空的耳朵裡?它回答說，因為那是虛構的故事，金箍棒的形狀和大小可以隨意改變……( 圖 1-2)


    ![](img/index-29_1.jpg)


    為什麼金箍棒能被藏進孫悟空的耳朵裡?


    金箍棒是《西遊記》中孫悟空所使用的武器，它的形狀和大小可以隨意改變，甚至能夠縮小到可以被藏在孫悟空的耳朵裡。


    然而，這只是一個虛構的故事情節，不具備現實可行性。在現實中，任何物體都有一定的大小和形狀，無法無限制地縮小或擴大，而人的耳朵內部也有固定的大小和結構，不能容納大的物體。


    因此，孫悟空將金箍棒藏進耳朵裡這一情節是一個神話和傳說中的故事，不應該被看作是現實世界中的真實情況。


    圖 1-2


    仔細想想，這兩個回答非常了不起。很多人說語言模型都只是基於經驗，只能根據詞彙之間的相關性輸出答案，根本沒有思考能力，但是從這兩個回答來看，`ChatGPT`
    是有思考能力的。


    誰會寫一篇文章討論棒球棒能否被藏進人的耳朵裡呢?`ChatGPT`之所以能給出答案，肯定不是因為它之前看過這樣的議論，而是因為它能進行一定的推理。它考慮了並且知道棒球棒和耳朵的相對大小，它還知道金箍棒和孫悟空是虛構的。


    ![](img/index-30_1.jpg)


    它的這些思維是怎麼來的呢?


    你可能沒想到，這些能力，並不是研發人員設計出來的。


    研發人員並沒有要求大語言模型去了解每種物體的大小，也沒有設定讓它知道哪些內容是虛構的。像這樣的規則是列舉不完的，那是一條死衚衕。


    `ChatGPT` 背後的語言模型，每個版本的`GPT`，都是完全通過自學摸到了這些思考能力，以及別的能力——你列舉都列舉不出來的能力。連開發者都說不清楚它到底具備多少種能力。


    語言模型之所以有這樣的神奇能力，主要是因為它足夠大。


    ![](img/index-31_1.jpg)


    `GPT-3`有 1750 億個參數。`Meta`發佈的新語言模型 `Llama`,有 650 億個參數。`Google` 在 2022 年 4 月推出了一個語言模型叫`PaLM`,
    有 5400 億個參數。之前`Google` 還出過有 1.6 萬億個參數的語言模型。


    `OpenAI`沒有公佈`GPT-4`的參數個數，但是據 CEO 山姆·阿爾特曼(`Sam Altman`)說, `GPT-4` 的參數並不比`GPT-3`多很多;
    而大家猜測, `GPT-5`的參數將會是`GPT-3`的 100 倍。


    這是只有在今天才能做到的事情。以前不要說算力，光是存儲訓練模型的語料的花費都是天文數字。1981 年，1GB 的存儲成本是 10 萬美元，1990 年下降到
    9000 美元，而現在也就幾分錢。你要說今天的 AI 科學跟過去相比有什麼進步，計算機硬件條件是最大的進步。


    今天我們做的是「大」模型。


    大就是不一樣。


    當然，語言模型有很多高妙的設計，特別是我一再提到的`Transformer`就是一個最關鍵的架構技術，但主要區別還是在於「大」。當你的模型足夠大，用於訓練的語料足夠多，訓練的時間足夠長，就會發生一些神奇的現象。


    2021 年，`OpenAI`的幾個研究者在訓練神經網絡的過程中有一個意外發現。


    關於這個發現，我給你打個比方。假設你在教一個學生即興演講。他什麼都不會，所以你找了很多現成的素材讓他模仿。在訓練初期，他連這些素材都模仿不好，磕磕巴巴說不成句子。隨著訓練加深，他可以很好地模仿現有的演講了，很少犯錯誤。可是如果你給他出個沒練過的題目，他還是說不好。於是你就讓他繼續練。


    就這樣練啊練，突然有一天，你驚奇地發現，他會即興演講了！給他什麼題目，他都能現編現講，發揮得很好！


    說回到模型，模仿演講就相當於模型的訓練，即興演講就相當於模型的生成性發揮。這個過程就是圖 1-3。


    黑色曲線代表訓練，綠色曲線代表生成性發揮。訓練到 1 千步乃至 1 萬步，模型對訓練題的表現已經非常好了，但是對生成性題目幾乎沒能力處理。練到 10 萬步，模型做訓練題的成績已經很完美，對生成性題目也開始有表現了。練到
    100 萬步，模型對生成性題目居然達到了接近 100%的精確度。


    ![](img/index-33_1.jpg)


    這就是量變產生質變。研究者把這個現象稱為「開悟」(`Grokking`)。


    「開悟」，到底是發生了什麼呢?


    先別急，我再舉個例子。`ChatGPT` 有個很關鍵的能力叫作「小樣本學習」(`Few-Shot Learning`), 就是你給它一兩個例子,它就能學會你的意思，並且提供相似的輸出。


    比如我讓 `ChatGPT` 模仿我給出的例題，再出幾道小學數學題。我的例題是：小明有 3 個蘋果，媽媽又給他 2 個蘋果，現在他有幾個蘋果?`ChatGPT`
    馬上就出了 5 道題，全是這個風格，


    比如：小李有 5 支筆，他送出了 3 支筆，還剩下幾支筆?(圖 1-4)


    給一個小學生出幾道數學題，模仿下面這個例子：小明有 3 個蘋果，媽媽又給他 2 個蘋果，現在他有幾個蘋果?


