    我感覺還需要另一次突破。我們需要機器人行為方面的「開悟」 和「湧現」。現在 Google 已經把語言模型用於真實三維空間(叫 「 具 身 多 模 態 語 言
    模 型 」, `Embodied Multimodal Language Model`, `PaLM-E`), 特斯拉已經在製造機器人。尤其是 2024 年初，斯坦福大學的一個團隊弄出了動作非常自然流暢的機器手臂，讓我們有理由相信機器人時代很快就會到來，也許未來
    5 年之內家家戶戶都可以買個機器人。


    查特拉思低估了`AGI`到來的速度，但他的道理並沒有過時。


    我們暫且假設，`AGI`沒有完美的情感能力，超級人工智能沒有真正的意識。


    那麼，要在`AGI`和以後的時代刷個存在感，我們需要的恰恰就是「存在智能」。這就引出了養成門檻領導力的第四個途徑——增長意識。


    `AGI` 時代的門檻領導力要求你具備三種能力，它們涉及對複雜事物的處理。


    第一個是謙遜的能力。所謂謙遜，就是不那麼關心自己的地位，但非常關心如何把事情做好。


    人本能很在意地位，就連伽利略 (`Galileo`)那樣的科學家都曾經因為心生傲慢，因為看不起一個事物而不去了解，結果錯失了對新事物的洞察力。現在所謂的「中年油膩男」，我看最大的問題就是不謙遜。你跟他說任何新事物，他總用自己那一套觀念解釋，以此證明他什麼都早就懂了。


    `AGI`不僅掌握的知識會超過所有人，它還會自行發現很多新知識。如果你沒有謙遜的美德，你會越來越理解不了這個世界。


    認識論上的謙遜能讓我們保持對知識的好奇和開放態度。你不但不能封閉，而且應該主動歡迎`AGI`給你輸入新思想，包括跟你的觀念相違背的思想。


    你還需要對競爭保持謙遜。其實我們早就該跳出跟誰都是競爭關係那種零和思維了，在`AGI`時代更得如此。人得和機器協作吧?你必須得有協作精神。協作精神也體現在人和人之間，組織和組織之間，公司和公司之間。我們必須共同面對各種新事物，像`FDA`
    那樣，各個領域的人組成一個委員會，一起協商判斷。


    ![](img/index-170_1.jpg)


    第二個是化解矛盾的能力。


    現代社會中不同的人總有各自不同的目的，會發生爭鬥。


    比如同樣面對全球變暖，到底是發展經濟優先，還是保護環境優先?不管採用什麼政策，都會對某些人群有利，對某些人群不利，都會造成矛盾。


    要化解這些矛盾，就需要你有共情能力。你得知道別人是怎麼想的，會站在別人的角度思考。


    有個心理學家叫安德魯·比恩考斯基 ( `Andrew Bienkowski` ), 他小時候生活在西伯利亞。有一次遭遇饑荒，他爺爺為了節省糧食，主動把自己餓死了。家人把他爺爺埋在一棵樹下，結果爺爺的屍體被一群狼翻出來吃掉了。


    比恩考斯基非常恨狼。但是他並沒有長期陷在恨意之中。過了一段時間，比恩考斯基的奶奶居然夢見爺爺說那些狼會幫助他們，而且家人根據奶奶的說法，真的找到狼殺死的一頭野牛，給他家當食物。比恩考斯基就此轉變了態度……後來他們全家跟狼建立了不錯的關係。


    比恩考斯基跳出了非黑即白的二元論，他眼中的狼不再是「好狼」或者「壞狼」，他學會了用狼的視角考慮問題。


    `AGI`，也許，應該，不具備這種能力⋯⋯不過我也說不準。有時候你問`ChatGPT` 一個有點敏感的問題，它回答之後會提醒你不要陷入絕對化的視角，比網上絕大多數言論都強太多了——不過這個功能是人強加給它的。


    ![](img/index-171_1.jpg)


    `AGI`時代的第三個關鍵能力是遊戲力，或者說互動力。我們是如何學會在這個複雜的社會里跟別人互動的呢?你的同情心是從哪兒來的呢?你如何有了解決問題的創造力的呢?最初都是從小在遊戲之中學習的。你得參與玩鬧，才能知道別人對你的行為會有什麼反應，你又該如何應對別人的行為。你得認真玩過遊戲，才能擁有解決問題的快樂。


    `AGI`沒有這些互動。`AGI`連童年都沒有，它就沒玩過遊戲。當然它可以跟你互動———現在的`GPT` 就可以假裝是老師或者心理醫生跟你聊，但是聊多了你就會感覺到，那跟真人還是不一樣的。


    但是`AGI`之後，超級人工智能，也許可以做得像真人一樣好。


    她———我們姑且當 TA 是個女性———雖然沒有真實肉體，不能真正感覺到情緒，但是她會計算情感。她不但能準確判斷你的情緒，還能用最好的方式表達她的情感。


    她簡直就是完美的。人的所有技能她都會，人不會的她也會。她會用人類特有的情感方式說服你、暗示你、幫助你，包括使用肢體語言。她非常理解你的性格和你的文化背景，她的管理方式、她制訂的計劃，方方面面的安排都非常完美。


    每個接近過她的人都能感受到她是充滿善意的。她簡直就像神一樣。


    如果這樣的超級人工智能已經出現而且普及了，請問，你這個人類領導還有什麼用?


    查特拉思認為，你至少還有一項價值不會被超級人工智能取代——那就是「愛」，一個真人的愛。


    來自機器的愛和來自真人的愛，感覺畢竟不一樣。


    設想有一天你老了，住在一個養老院裡。所有親友都不在你身邊，這個養老院的所有護士都是機器人。哪怕她們都是超級人工智能，長得跟人一模一樣，她們對你再細心、再體貼，恐怕你還是會有一種悲涼之感。你知道那些護士只是在根據程序設定例行公事地照顧你。也許這個世界已經把你遺忘了。


    反過來說，如果養老院裡有一個真人護士，她對你有一點哪怕是漫不經心的愛，你的感覺也會完全不同。


    因為人的愛是真的，因為只有人能真的感覺到你的痛苦和你的喜悅，因為只有人才會跟人有真正的瓜葛。其實這很容易理解，像什麼機器寵物，甚至性愛機器人，就算再好，你總會覺得缺了點什麼……


    我一直強調，`AI`再厲害，決策權也一定要掌握在人手裡。其實那不僅僅是為了安全，也是為了感覺。來自機器的命令和來自人的命令是不一樣的，因為來自機器的稱讚和來自真人的稱讚不一樣，來自機器的善意和來自真人的善意不一樣。


    至少感覺不一樣。`AI`下國際象棋的水平早已超過人類，但是沒人喜歡看兩個 `AI`對弈———相反，我們明知人類的水平不如`AI`，還是很關注兩個人類棋手爭奪世界冠軍的比賽。「是人」，這個特性本身就是人獨一無二的優勢。


    查特拉思預測，超級人工智能時代的主角將不會是機器，但也可能不會是人———而是愛。當物質和能力的問題都已經解決，世界最稀缺的、人們最珍視的，將會是愛。


    所謂增長意識，主要就是增長自己愛的意識。


    除了愛，查特拉思認為另一個會被越來越重視的元素是智慧——不過不是 `AI`也會具備的那些理性智慧，而是某種神秘主義的東西。我們會覺得這個世界上除了有能寫進語言模型的智慧，肯定還有別的奧秘。比如，還有沒有更高級的智力在等著我們?有沒有神?


    人們會追求那種敬畏感和神秘感。不管有沒有道理，到時候宗教領袖可能會很有領導力。


    其實，我們並沒有充分的理由能肯定 `AGI`和超級人工智能絕對不會擁有謙遜、化解矛盾和遊戲的能力，也絕對不會具備愛和意識的價值。但是，我覺得你應該這麼想：就算
    `AI`也能如此，難道我們就可以放棄這些能力和價值嗎?


    如果你放棄，那你就徹底輸給 `AI`了。一個故步自封、製造矛盾、不會跟人互動還沒有愛心的人，各方面能力又遠遠不如`AI`，你還想領導誰?


    古代講「君子」「小人」，其實不是講道德品質的差別，而是地位差異：有權、有財產的是君子，沒錢、給人打工的是小人。「君子」不幹活又要體現價值感，就必須往領導力方向努力，講究修身養性。古人評價君子從來不是隻看他智力水平高不高，人們更關注他的道德水平、他的聲望和信譽、他的領導力。未來如果
    `AI`接管了所有「小人」的活，我們就只好學做「君子」。如果`AI`也學會了做「君子」，我們大約就得被逼做聖人。不然怎麼辦呢?難道做寵物嗎?


    我的感受是，未來具體哪個行業的人會被淘汰也許很難說，但是有一點比較確定———品質不好的人一定會被職場淘汰。


    有了 `AI`的幫助，這個活其實誰都能幹，那我們為啥不用好人幹呢?


    ![](img/index-175_1.jpg)


    到目前為止，這一切討論的前提是超級人工智能沒有自主意識，它不會自己給自己定目標，沒想著自己要發展壯大，沒有主動要求升級⋯⋯但問題是，我們不知道它會不會一直如此。


    麻省理工學院的物理學家邁克斯·泰格馬克 (`Max Tegmark`) 在《 生命 3.0 》 (`Life 3.0` ) 一書中有個說法。也許有一天 `AI`
    突然「活」了，給自己編程、給自己尋找能源，以至於不再顧忌人的命令，不再以人為核心———而是以它自己為核心，那會如何呢?那麼我們這些設想就統統都失去了意義。你這邊還想著怎麼做個好主人，人家那邊已經要把你當奴隸了。


    那可就突破了人的底線。這不是危言聳聽。如果推理能力可以「湧現」出來，意識和意志為什麼就不能「湧現」出來呢?


