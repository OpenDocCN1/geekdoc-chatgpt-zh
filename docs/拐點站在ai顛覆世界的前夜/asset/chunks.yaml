    # 第五章 實戰, 讓 AI為你所用


    這個東西的用處可太大了。它可以隨時記錄你的所思所想；它可以僅僅根據你的口述生成一封電子郵件，還可以是外語的；它可 以做會議記錄；它可以直接把你的零散談話變成一篇文章。


    你不一定非得用AudioPen。ChatGPT 官方插件後來直接支持語音輸入，自動識別成文字。你還可以用任何一個語音轉文字工具生 成原始文字，而且不用特別精確；你可以把隨便什麼文字直接丟給
    ChatGPT ， 它 能 提 供 更 精 巧 的 輸 出 。 我 後 來 自 己 專 門 做 了 一 個 GPTs，叫「聽寫助手」：我只要對著手機胡亂說一通話，它就能給
    我整理成流暢的書面文字。


    ![](index-328_1.jpg)


    這就是改寫。除了編程，我認為改寫是 GPT 最有用的一項日 常功能。改寫能對一段文字進行任何操作：


    ·把一段文字翻譯成另一種語言；

    ·把一種語言風格變成另一種語言風格， 比如從嚴謹的變成 輕鬆的；

    ·把一種語氣變成另一種語氣， 比如從非正式口語變成正式 的、禮貌的書面語；

    ·生成一段長文的摘要；

    ·藉助插件生成一段長視頻的內容提要；

    從文檔中提取關鍵信息，並且做分類標籤……


