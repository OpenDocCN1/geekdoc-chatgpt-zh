    ## 问 边鱼


    马斯克高度评价微信，说它什么都可以做；我还看到有知名投资人说微信的体验和商业开发能力远胜 FaceBook (脸书)。我没有体验过 FaceBook，请教万老师怎么评价两者呢?张小龙是不是就掌握了文中所说的那种独特能力呢?


    ### 万维钢


    张小龙无疑是个产品体验和商业开发的天才，但微信有今天这样的地位绝对不只是因为这个产品做得好、功能全，更多的是因为中国发展的历史机遇和中国用户的文化习惯。


    在智能手机渐渐普及的那个当口，中国打电话按分钟收费，发短信每条 1 毛钱，很多用户没有电子邮件地址，没有电脑，甚至家里都没有固定电话。微信一出来，这些问题都解决了，大家当然欢迎。再加上后来的微信支付功能，可以说是微信把中国拉进了信息时代。


    但是智能手机普及的时候，美国已经在信息时代了。家家、人人有电话，电话费包月，打电话找不着人就语音留言是社会习俗，短信免费，成年人都有信用卡，工作交流都是电子邮件。
    在这种环境中，人们没有很强的动力去安装一个聊天工具。


    马斯克说微信「什么都可以做」，其实功能性的事情 AI 很擅长。这件事的真正启发是，搞产品一定要考虑当前环境和用户习惯。这是人而不是 AI 的能力。


    ## 05 独特智能：人类的具身智能与自主思考


    GPT-4 来得比我们想象得快，能力也比我们想象得强。它是多模态的，可以处理图像和声音；它能根据随便写在一张餐巾纸上的需求给你编程创造一个网站；它的各种生成能力都大大增强了。


    可能让人印象最深刻的，是 GPT-4 参加人类主流考试的水平。它在 BAR (美国律师执照统考)上的得分超过了 90%的考生；它在 美国 生 物 奥 林 匹
    克 竞 赛 的 得 分 超 过 了 99%的 考 生 ； 它 在 GRE(留学研究生入学考试)语文上取得了接近满分的成绩。它的数学成绩还没有达到最优，但是我给它测试了几道奥数题，它答对了。


    GPT-4 这些成绩要申请美国名校的研究生，绰绰有余。


    而且它还在以更快的速度迭代。也许 GPT-5 很快就能出来, 过两年就是 AGI。


    面对这个局面，教育应该怎么办?人应该怎么办?现在整个社会必须重新思考这些问题。


    查特拉思在《门槛》这本书中提出，人相对 AI 有个绝对的优势，也是 AI 至少在短期内赶不上的，那就是人更理解人。


    AI 再厉害也得听人指挥，最终做决策的必须是人，用中国话说这叫「底线思维」；一切生产、一切科研都是为了人。人的需求必须是各项事业的出发点和落脚点，所以理解人永远都是最重要的智能。


    而 AI 不可能比人更理解人。AI 再厉害也没有肉体，它不是碳基生物，它没有人的感知能力。


    AI 时代，在逻辑运算、听说读写那些一般认知项目上，我们已经输了。我们要发挥长板优势，就必须让自己更像人，而不是更像 AI。


    AI 时代的商业要求你认识自己、认识你的团队、认识你的客户，要求你有情感智能和存在智能。查特拉思提出培养这两种智能的 4 个途径，前文说了「静心沉思」，这里我接着讲「具身智能」和「自主思考」。


    ![](img/index-158_1.jpg)


    具身智能，是通过身体去体察自己和别人的情感。


    2018 年，查特拉思跟百度金融服务事业群组有过一段合作。这个部门后来搞了个产品叫度小满金融。像这种互联网金融业务是怎么来的呢?


    中国有经济活动的人口总共是 9 亿，这 9 亿人中有 5.5 亿人在中央银行没有信用记录，这使得他们没有办法获得贷款。但是生活中，人总会有个临时借点钱的需求，没有信用记录就只能跟亲戚朋友借，总是不如向机构借方便——互联网金融就是要解决这个问题。


    互联网公司的优势在于，它可以通过你在网上活动的记录判断你的信用。比如蚂蚁金服有你的淘宝购物数据，那些数据能预测你有没有还款能力。


    百度的数据则是体现在百度地图、百度应用商店、百度阅读等应用中。百度知道你平时都读什么书、有怎样的学习习惯、下 载了哪些应用程序，百度对你有个画像。


    读书跟会不会还钱有关系吗?有关系。百度搞了些小范围实验，对申请贷款的人分组做 A/B 测试，根据实验结果中的还款情况，结合百度的数据，就可以训练一个 AI，预测符合哪些特征的人会还款。这样就可以给每个用户一个信用评分。


    可这一切都是 AI 啊，人的能力在哪里?请注意，数据分析并不都是纸面上得来的知识。


    要想真正理解数据就得深入到用户中间去。百度是派人到现场去跟用户聊，了解他们的日常生活是怎样的，他们怎么看待还款的道德。特别是潜在客户中很多都是年轻人，他们对自己的还款能力缺乏认识，不太理解借那么一大笔钱意味着什么，百度得想办法帮他们理解。哪怕同样的硬数据，百度在服务过程中操作方法不同，得到的结果也会不同。


    这些都要求你跟用户有情感沟通。这些是 AI 所不能做的。


    百度内部的工作讨论也需要情感， 比如数据隐私问题。根据一个人使用阅读 App 读书的记录来决定是否给他贷款，请问这合理吗?我找你借钱，就得把我在网上各种活动的數據都给你，让你比我老婆更了解我，这好吗?


    我们站在用户角度从外边看，肯定觉得这些互联网商人真是唯利是图，无所不用其极⋯ ⋯ 但是站在百度的角度看，他们也有各种不得已。首先是法律问题。其次，如果滥用数据，将来用户就不愿意使用他们的产品了；可是不用数据，互联网金融又没法搞。


    百度也很头疼，召开了各种会议进行道德辩论。辩论中每个人都结合自己切身的感受，带着情绪在讨论这件事应该怎么办。


    辩论的结果大概是，拥有用户数据的部门不能直接把数据交给金融部门，而是自己先做数据分析，只给金融部门一个标签或者分数。这样在中间搞个阻断，来保护用户的隐私。


    这些不是 AI 生成的算法，这是有情绪的人们讨论出来的主意。


    ![](img/index-160_1.jpg)


    而情绪并不是纯粹的大脑功能，情绪跟身体有很大关系。


    当你向人传达一个难以说出口的信息的时候，你会出汗。有人表扬你的時候，你的胸口会有一種緊縮感。感到爱意的时候，你的胃可能会翻腾。而且情绪和身体的互相影响是双向的。你在刚刚走过一个摇来摇去的索道、心跳加速的情况下遇到一个异性，那个心跳信号会让你以为自己遇到了爱情。在饥饿状态下逛超市会让你购买更多的东西。人的肠道神经系统被称为「第二大脑」，这使得经常情绪紧张的人也会经常肚子疼。


    我们很多时候是通过身体的反应了解自己的情绪的。那 AI 没有身体，它怎么能有人的情绪呢?它怎么能理解人的情绪呢? 它怎么能预测人的情绪呢?至少到目前为止，情绪功能还是人的优势。


    充分感知自己和他人的情绪，区分不同情感之间的微妙差别，会对你的决策有重大影响。


    ![](img/index-161_1.jpg)


    门槛领导力还包括抒发情绪，这也需要身体。有时候团队需要你讲几句话来鼓舞人心或者感染气氛，你怎么说好呢?


    诗歌，是人类最常见的一种表达情感的方式，而诗歌具有鲜明的身体烙印。诗歌之所以是诗歌，是因为它有韵律和节奏；韵律和节奏之所以对人有效，根本上是因为人要呼吸。


    AI 也能写诗，它可以把格律做得很严谨，但是我们预计它很难掌握好节奏感中饱含的情绪，因为它没有嘴和呼吸系统，它不能体会一首诗歌大声读出来是什么效果。哪怕是最先进的
    GPT-4，作最擅长的英文诗，韵律也很蹩脚。


    只有真实的情感才能打动人，而真实的情感需要身体和声音配合表达。你的鲜明个性需要肢体语言配合：你要想体现自信就得站直了；你要想让人相信局面尽在掌握之中，你不但不焦虑而且很快乐，最起码你得给个微笑。


    身体对人的影响还包括能量。如果你没睡好，身体很疲惫，大脑再强也不能好好运转。能量充足了，整个人的精神面貌都会变得很积极。


    AI 没有这些。


    ![](img/index-161_2.jpg)


    培养人的独特智能的另一个途径也跟身体有关，那就是自主思考。


    人是由肉体构成的这件事，对人类智能的意义可能比我们想象的要大得多。肉体不仅仅是大脑的维护系统，人不仅仅是一台大脑。


    从柏拉图到启蒙运动，再到现在很多人鼓吹的「意识上传」，都是把人等同于大脑，忽略身体。比如电影《黑客帝国》里，人都被泡在液体里，接一堆管子，身体成了电池，只有大脑是活跃的，照样能在虚拟空间里体验完整人生。


    但是查特拉思认为，这些缸中之脑不是完整的人。 因为身体对人的作用并不仅仅是维持生存，身体还提供了情感。身体，是大脑不可缺少的一个信息来源。如果考虑到肠道神经，身体还是人思考过程中的关键一环。


    事实上，我们甚至可以说，正因为身体也会影响思想，每个人才有自己的独立思考。


    你想想，如果人都可以被简化为缸中之脑，大脑又可以被视为一个处理信息的独立器官，那你就可以轻易控制每个大脑的信息输入。这跟 AI 有什么区别?哪还有什么独立思考可言?


    身体最根本性、哲学性的功能还不是能提供情感，而是让人有了更多的信息输入渠道。你的身体对外界会有各种感知，那些感知是主观的，是每个人都不一样的。健康、残疾或有疾病，胖或者瘦，高或者矮，感知都不一样——正是这些不一样，让我们有了不一样的思考。更何况有身体才有生活，才有成长，才有从小到大不同的经历，才有千变万化的个性。


    绝对的「独立思考」恐怕是不存在的，毕竟每个人都在从外界联网提取信息。但是有了身体，我们至少可以「自主思考」。有了身体，就没有任何力量能完全控制对你的信息输入。


    查特拉思观察，有具身智能的团队往往在文化上更有活力，在道德问题上更深思熟虑。因为这样的团队有情感交流。但更重要的是，组成这样团队的人具有不可控性。他们不是机器，不是你设定他怎么想他就怎么想，他们都会自主思考。正是因为每个人的自主思考，团队才有了不同视角，才有创造性和活力，才有生成性的发挥，才能处理复杂问题。


    ![](img/index-163_1.jpg)


    你知道训练 AI 最快的方法是什么吗?是用一个现有的 AI 生成各种数据和语料，直接训练新的 AI。这样训练不但速度最快，而且最准确。但是因为你没有新鲜的语料，训练出来的
    AI 也不是新鲜的。


    那就是说，如果每个人都活得像 AI 一样，AI 就没有新训练素材了，AI 会停止进步。


    新数据是人生成的。人不是程序，人不应该按照固定规则生活。人生的使命就是要制造意外，增加信息。有些意外来自你的情感，有些来自你身体的独特感知，有些来自你自主的思考——
    不管来自哪里，它们一定不是来自 AI 给你的灌输，一定不是来自你对领导意图的揣摩。


    那些你任性而为的时刻才是你真正活着的时刻。 这样看来，AI 不是取代人，而是解放了人。AI 能让我们活得更像人。人其实大有可为， 因为人是一种最复杂的东西。你去跟任何一个人聊，只要他跟你说人话，不打官腔，不背诵洗脑信息，你都会收获一些意外的东西，都会发现他有独特的视角和想法。


    当然，这一切的前提是 AI 还没有掌握人的情感。如果将来 AI 能够完美复刻人的情感，我们该怎么办呢?


    ## 问答


    ### 问 李航


    是不是可以理解为，以后理工科领域需要的人变少了，大部分工作由 AI 来完成?人文领域处理人际关系、对情绪的需求会变多吗?或许以后没有文理之分，直接就是 AI
    领域和非 AI 领域了呢?


    ### 万维钢


    先来看文科生。经过这段时间对 AI 的使用和观察，我现在非常肯定，AI 在可以预见的这段时间内不但不会淘汰文科生，而且会大大地给文科生赋能。


    在现代世界做事，其实任何人都需要一定的理工科能力，需要有点「数字感」，包括数据处理、量化思维。比如，谈论经济发展不调用统计数据行吗?研究心理学不会实验分析行吗?哪怕幼儿园老师都需要掌握学生的數據。


    以前文科生不是不需要这些，是被限制了，插不上手。因为以前摆弄数据都需要有一定的机器思维，哪怕是做个 Excel 表格、画个统计图，你都得稍微懂点函数、变量，你得做一些不太符合直觉的操作，你得记住一些「不是人话」的命令语法。


    以前的文科生被这些技能限制，就只能搞一些空对空的东西，说一些大而无当的话，其实自己心里都没底。这就如同有些搞了一辈子文史哲的老教授，因为不能读写英文，整天看有限的中文材料，有再大本事也施展不开。


    ChatGPT 正在彻底改变这一切，这里的关键是「自然语言编程」。以后你想画个数据图，摆弄什么统计结果，包括编程搞自动化分析，直接用人的语言说就行。所有脏活累活都不需要自己上手，AI
    帮你搞定。你只需要了解最简单的原理就行。你的任务是提供思路，AI 会帮你实现。老教授也不用畏惧英文了，现在不但翻译质量已经接近完美，人跟 ChatGPT 对话用中文和用英文已经没有区别。


    所以，AI 消除了文科生做事的障碍，AI 解放了文科生。


    那么对于理工科，就有点问题了。


    如果你是某个领域真正的高手和专家，又或者你的学习和适应能力特别强，能随时掌握新工具、进入新领域，那你在任何时代都不用担心职业安全，你就是时代的领路人。


    但是如果你的技能仅限于一个很狭小的领域，你在工作中本来就是根据别人提的需求做事，你是个工具人，那你在任何时代其实都比较脆弱，在 AI 时代就更危险了。


    我的建议是，任何时候都做个通才而不是专才，AI 时代更是如此———现在有了 AI，学习新东西、上手做事非常非常容易，得赶紧积极主动走出舒适区啊！


    AI 带来了惊喜：对文科生更多的是「喜」，对理工科生也许会有很多「惊」。不过理工科生也不用太悲观。咱这么想，文科生之所以喜，是因为他们根本没看懂——他们不知道机器能做到这个程度有多难，他们不能体会这背后的惊心动魄。你惊是因为你懂，你懂，你至少就有一個领先优势——你上手
    AI 理应更快。不过，人家文科生还有别的技能。


    ## 06 存在智能：人类在 AI 时代刷存在感的方式


    随着 GPT-4 的影响越来越深，人们对 AGI 的期待也越来越强了。有人说 AGI 将在 2025 年出现，有人说 GPT-5 就会是 AGI, 甚至有人认为
    GPT-4 已经是 AGI。


    我问 GPT-4，AGI 跟现有的 AI 到底有啥不一样? 它列了几项，包括独立学习、会多个领域的知识和技能、逻辑推理和创造力等各方面都要达到人的水平。它尤其提出，AGI
    应该有一定的情感理解能力，有一些自主意识，有长期规划与决策的能力……(图 3-11)


    但 AGI 还只是达到人的水平而已。将来在 AGI 之上还会有「超级人工智能」(Super Artificial Intelligence, ASI ),
    要在所有领域，包括科学发现和社交技能等方面都远超人类。


    如果 AGI 近在眼前，超级人工智能时代也为期不远，人又该如何呢?


    查特拉思在《门槛》里是这样给 AI 分类的：


    1.现有的 AI， 在逻辑、数学思维、 听说读写这些认知方面的功能，还没有完全达到人的水平；

    2.AGI， 認知能力已经完美， 但是在身体和情感方面还不


    ![](img/index-168_1.jpg)


    相对于现有的 AI，包括你，AGI 应该有哪些不一样的技能?


    ![](img/index-168_2.jpg)


    人工通用智能 (Artificial General Intelligence, AGI) 指的是具有与人类智能相当的能力的人工智能系统。与现有的人工智能(例如我，基于
    GPT-4 的 ChatGPT)相比，AGI 将具备一系列更加先进和全面的技能。这些可能包括：


    1.独立学习：AGI 将能够像人类一样，从零开始独立学习各种知识和技能，而无需大量预先编码的数据或训练。

    2.跨领域知识与技能：AGI 能够在多个领域(如科学、艺术、哲学等)展示出与人类相当的知识和技能，而不仅限于特定领域。

    3.逻辑推理与创造力：AGI 将具备强大的逻辑推理能力，能够像人类一样进行复杂的思考、解决问题和创新。

    4.情感理解与共情：AGI 将能够理解和处理人类情感，与人类进行更为深入的情感交流，从而更好地满足人类需求。

    5. 自主意识与意图：AGI 将具有一定程度的自主意识和意图，能够在没有人类指导的情况下制定目标并实现目标。

    6.适应性与泛化能力：AGI 将能够迅速适应新环境和情境，对不同类型的问题和任务具有较强的泛化能力。

    7.长期规划与决策：AGI 将能够像人类一样进行长期规划和决策，考虑未来的可能性和风险。

    8.协同与社交能力：AGI 将具备较强的协同和社交能力，能够与人类和其他 AI 系统合作，共同完成任务。


    现有的人工智能 (如我)在特定领域可能已经展示出了高水平的性能，但与 AGI 相比，仍然存在很大差距。实现 AGI 仍然是人工智能研究领域的一个重要目标。


    图 3-11


    如人；

    3.超级人工智能， 情感能力也达到完美， 但是终究没有人的意识。


    《门槛》是 2023 年 2 月份出版的，查特拉思当时显然没想到 GPT 有这么厉害；书里采访的几个专家也都说 AGI 还远得很，还需要进一步的理论突破……


    现在我们看，大语言模型在 2022 年前后的「开悟」和「涌现」，就是那个谁都没想到的突破。这个突破大大加速了 AGI 的到来。其实在我看来，GPT-4 已经非常接近
    AGI 了，请问有几个人敢说自己在某个领域比它聪明?


    但是要把 AGI 用于机器人，让机器人像人一样做事和互动，


