    第三层，理性，是超越感性经验和知性认识，直指事物本质和普遍规律的东西，包括物理定律。理性是客观的，每个人用理性应该得到同样的结论；


    第四层，物自体，是世界真正的本质，是人类理性也许无法全面认识的。


    所谓纯粹理性批判，就是说理性认识有局限性，人不能真的认识世界的本质，这给人的认知找到了边界。


