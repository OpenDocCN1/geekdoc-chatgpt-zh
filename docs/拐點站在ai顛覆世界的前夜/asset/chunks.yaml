    Language Processing`, `NLP`)、機器翻譯、詞法分析、語音識別等技術去模擬人腦的理性思維，結果那條路越走越難———規則太多了，根本弄不過來。另有一些科學家發明了神經網絡算法，模擬人腦的感知能力，`GPT`是這條路的產物。現在根本不用告訴
