    ## 01 煉丹：大語言模型是怎樣煉製的


    這一輪 AI大潮主要是由以 GPT 為代表的「大語言模型」所推 動的。它就如同一種法寶，需要耗費大量的人力物力和時間資源去 煉製。一旦煉製成功，它就會有種種神奇的能力。本書中多次講到
