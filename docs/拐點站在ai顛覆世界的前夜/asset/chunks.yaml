    ## 第一章 ChatGPT 究竟是什麼


    我聽說有人做實驗，讓一些真正的科學家和`ChatGPT`共同起草了若干份研究經費申請書，又邀請了一批真正的專家對這些申請書做評價。結果專家們發現，AI 起草的申請書，想法的新穎度明顯高於人類科學家的。


    所以，如果我還在搞科研，我會把研究領域近期的論文餵給`ChatGPT`，讓它提幾個研究選題，但是我絕不會認為 AI 可以自行搞科研。


    ## 底牌和命門：AI 能力的侷限


    我們已經知道大語言模型有「開悟」，有「湧現」，有思維鏈，所以才有現在如此神奇的各種功能。但我們還需要進一步理解`GPT`：它跟人腦到底如何對比？它有什麼限制？有沒有它不擅長的東西？


    身處歷史變局時刻，`GPT`的進展非常快。各種產品、服務、學術論文層出不窮，進步以天來計算，一個月以前的認識都可能過時了。


    不過有一個神人，他的觀點和作品並不會過時。他在《這就是`ChatGPT`》( `What Is ChatGPT Doing…and Why Does It
    Work?` )①這本書裡講的是數學原理和哲學思辨，而不是`GPT`的一般功能——數學和哲學是不會過時的。


    這個神人就是——斯蒂芬·沃爾夫勒姆 (`Stephen Wolfram`)。他不僅發明了 `Mathematica` 軟件，還做了 `WolframAlpha`
    網站，搞了一個計算語言叫 `Wolfram 語言`，他甚至對整個物理學提出了全新的看法。你要讓我列舉當今世界上活著的最聰明的三個人，那其中必定有沃爾夫勒姆——而且我還不敢肯定另外兩個是誰。


    `GPT` 和目前市面上的所有 AI，本質上都是神經網絡。沃爾夫勒姆關注神經網絡已經 40 多年了，他早在 1983 年就自己編程研究過神經網絡，他最近用`GPT`做了很多研究。這本書得到了`OpenAI`的
    CEO 山姆·阿爾特曼 (`Sam Altman`) 的背書，說這是他見過的對`GPT` 最好的解釋。


