    問 艾菲爾上的鐵塔夢


    萬 sir 可以分析一下馬斯克等人呼籲暫停開發更強 AI 的深層原因 嗎?


    萬維鋼


    2023 年年底，在華東師範大學舉辦的一次活動中，我跟前文多 次提到的物理學家邁克斯·泰格馬克有過一次直接對話。他和 馬斯克等人共同倡議暫時停訓大模型。當時我問泰格馬克能不
    能設想一個場景，在最壞的情況下，AI 會做什麼壞事?泰格馬克 給了我兩個場景。一個是不法之徒在 AI 的幫助下製造出了化學 武器； 一個是 AI「活了」，
    失控了， 開始自行做一些違揹人 類意願，乃至於傷害人類的事情。他的擔心很有道理。


    現在已經有人可以在自家電腦上運行一個小尺度的、開源的語 言模型，功能還相當不錯。這樣的模型不會受到任何審查，你 原則上可以讓它輸出任何內容，其中就包括如何製造某種武
    器。如果人人都有這樣的助手，那可能就好像人人有槍一樣， 確實比較危險。事實上， 已經有很多人在使用開源畫圖模型 Stable Diffusion 創作色情內容。


    但是要想要 GPT-4 那樣強大的功能，乃至於 AGI，那就必須使 用超大規模模型，藉助超大規模的算力。而這種水平的 AI 應 用大概會是「中心化」的，必須由某個公司運營。既然是中
    心化的就容易監管，只要把 OpenAl、Google 這樣的大公司看 住就可以。這就跟傳統媒體差不多，理論上電視臺和報社都 有作惡能力，但是因為我們可以監管它們，我們並不是很擔
    心。


    泰格馬克和馬斯克等人更擔心的是，GPT 可能會變成真的 AGI，乃至於「活了」，有了意識和自主性， 以至於連母公 司 OpenAI 都控制不了它。


    這個擔心是合理的。正如前文講過，GPT-4 已經有了一些比較 可疑的行為。當然 OpenAI 會在把模型推向大眾之前對它做各 種安全測試，包括聘請外部團隊去故意引導模型搞破壞，試
    探它的能力和野心……但是你永遠都不能從理論上確保模型 不會先假裝老實通過測試，面對大眾之後再現出原形。


    網上流傳一個梗。阿爾特曼每次外出都揹著一個揹包，跟他 形影不離。有人就猜測，那個包裡面是不是有個就像美國總 統的核按鈕一樣的裝置?一旦 AI 失控， 阿爾特曼就可以遠程
    啟動毀滅程序。


    當然我認為這是一個玩笑，但這是一個非常嚴肅的玩笑。馬 斯克等人的意思是，這不僅僅是一個立法問題，也是一個技 術問題。我們必須坐下來一起想，怎麼判斷 AI 是不是已經失
    控了?如何設定限制讓它不失控?一旦失控了怎麼辦……這些 都是光說不行，需要真實去研究的問題。事實上，泰格馬克 等人正在進行這樣的研究，並且已經提出了一些方案。


