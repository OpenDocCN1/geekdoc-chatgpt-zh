    图 4-10


    无监督学习就更厉害了，因为它根本不需要你对训练素材进行任何预处理，你不需要告诉 AI 你想要什么，直接一股脑地把素材都喂给 AI 就行，AI 会自行发现素材中的规律。GPT
    之所以能学习天量的语料，就是主要使用了无监督学习的方式。


    无监督学习主要用于「生成」，它追求的是「像不像」。

    GPT 生成文章、Midjourney 生成照片是生成，给几块甲骨文片片段让 AI 帮助补全龟甲中残缺的部分也是生成，给定一小段碱基对让 AI 生成蛋白质结构也是生成。生成式
    AI 可以做很多事情。


    强化学习则是寻求对一些指标进行优化，让它们处于一定的范围之内，它的作用是「控制」，它追求的是「好不好」。像下围棋、自动驾驶，包括前文讲的用 AI 控制核聚变等离子体构型，都是强化学习。


    这些方法的本质是用一定的输入、输出数据训练一个神经网络，再用这个神经网络读取新的输入并生成输出。在这个过程中，你眼中可以只有数据———你甚至不需要关心那些数据出自哪个学科，不需要知道它们的物理意义是什么……


    2023 年 8 月，马斯克展示了特斯拉最新版的自动驾驶 AI (FSD Beta v12)。①这一版的特点是，整个程序中没有一行代码告诉 AI 遇到减速带要慢行、需要避让自行车、交通信号灯是什么意思———系统没有注入任何交通规则，神经网络自己从输入到输出悟出了一切。


    这些方法的细节是相当精巧的，但是跟任何学科的人类知识相比，这些绝对是非常简单的方法。它们之所以厉害，根本的原因是算力———超强的运算速度和便宜而海量的数据存储成就了一切。


    在算力的加持之下，2022 年底以来 GPT 的表现，给了我们第三个教训：人是简单的。


    GPT-3 有 1750 亿个参数。OpenAI 没有公布, 但是网上传说 GPT-4 有 1.8 万亿个参数。这些数字无疑非常大，但是在指数增长的算力面前，还是很有限。而就是这样有限的模型，竟然抓住了人类几乎所有平常的知识。


    GPT-4 有人类的常识，能看懂照片，它能做包括编程和写作在内的人能做的很多事情，它懂的比任何人都多……我认为它就是 AGI。它是一个语言模型，它是用语料训练出来的，但是不知怎么，它抓住了语言背后的、难以言传的东西。它可以用语言表达一些我们人类还没有来得及用语言表达的东西。


    AI 语言、AI 画图、AI 判断和 AI 控制，做的是不一样的事情，但是基本原理是一样的。为什么?沃尔夫勒姆对此的洞见是，AI 只是抓住了「像人」的东西。


    而这说明「人」其实是简单的。简单到这么有限的算力就能把我们搞明白。「人」究竟是什么?我们能不能借助 AI 对人有个突破性的新认识?


    这肯定意味着一些更大的可能性，不过我们目前所能看到的，有两个展望。


    ![](img/index-238_1.jpg)


    一个是 AGI 会在所有领域参与人类工作。


    当前国内外主流公司都专注于搞自己的大模型，但是对模型的应用还远远没有展开。这可能是因为当前 AI 算力还太贵，GPT 一次能记住的用户本地信息还很有限，不容易搞高度量身定制的服务。


    不过已经有人在做这件事了。有个临时性的办法是把本地信息「矢量化」，就是进行某种程度的压缩，让 GPT 能多记住一些；但更根本的办法是把 GPT 拿过来用本地信息微调。OpenAI
    已经开放了 GPT-3.5，后来又在一定范围内开放了 GPT-4 的微调服务。


    所以，我们会很快看到像个人助手、家庭医生、一对一家教之类切实为你量身定制，还掌握了专业知识的 AI 服务，那才是真正改变生活方式。


    ![](img/index-239_1.jpg)


    另一个展望是，所有科研领域都应该用 AI。


    DeepMind 做的事情基本上等于手里拿着个大规模杀伤性武器，对各个科研领域进行碾压式的打击。除了被广泛报道的围棋、电子游戏、蛋白质折叠、天气预报、控制核聚变等离子体，他们还用
    AI 帮助破解了 2500 年前用楔形文字写成的文本①，还开始帮数学家证明定理②……


    还有哪个领域是 DeepMind 不能进的?他们不是不能进，而是暂时来不及进。DeepMind 就如同孟子当初梦想的那个「王道」之师，「东面征而西夷怨，南面征而北狄怨」。他们杀向生物学的时候，物理学家说，你们怎么还不过来解决我们的问题！他们杀向考古学的时候，数学家说，我们也能用上
    AI 啊！


    请问历史上还有哪个东西是这样的?


    可能是因为算力还比较贵，更可能是因为大多数人还没学会训练 AI，现在的局面还是少数会用 AI 的人四处挑选科研课题做。但下一步必定是各路科研人员自己学会用
    AI。大杀器必定扩散。


    如果我是個理工科研究生，我现在立即马上就要自己学着训练一个 AI 模型。趁着大多数人还不会用，这是一个能让你在任何领域大杀四方的武器。


    世间几乎所有力量的增长都会迅速陷入边际效益递减，从而变慢乃至停下来，于是都有上限。唯独计算机算力的增长，目前似乎还没有衰减的迹象，摩尔定律依然强劲。


    如果这个世界真有神，算力就是神。


    你要理解这个力量，拥抱这个力量，成为这个力量。


    ## 问答


    ### 问 sammi


    万老师您好，我是名认知科学的研究生，能请您分享下如何自己学着训练一个 AI 模型吗?


    ### 万维钢


    自己训练一个 AI 模型是非常可行的，而且有很多人都在这么干了。爱尔兰的一个女高中生用一台笔记本电脑就训练成了 AI，把它用于宫颈癌筛查，而且取得了应用价值。布鲁萨德(Broussard)在《人工不智能》(Artificial
    Unintelligence)这本书里讲过一个手把手的 AI 实战案例————用机器学习预测泰坦尼克号轮船上旅客的存活情况。①


    关键在于，现在已经有很多现成的工具供你使用。而且我们个人要的不是 GPT 那样的大语言模型，如果要用那种也应该是把现成的模型拿过来，我们只需要用本地数据微调，而不是重新发明轮子。我们要训练的是「专用
    AI」，也就是针对特定问题、特定数据的模型。


    我能想到一个适合业余选手快速学习的攻略差不多是这样的。


    第一，你需要对「机器学习」的基本原理有个大致了解。


    从头开始读教科书就太慢了，而且不容易抓住重点，最好的办法是看网上的视频课程。吴恩达的 Coursera 网站有好几门机器学习课，其中至少有两个是完全入门级的，而且是免费的：


    斯坦福大学的机器学习课:

    `https://www.coursera.org/specializations/machine-learning-introduction`


    人人学 AI: `https://www.coursera.org/learn/ai-for-everyone`


    第二，你需要上手完成一个小项目。


    前面说的那些课程中已经提供了项目，我估计数据和代码都是现成的。或者你可以上网找一个现成项目，就像前面说的那个泰坦尼克旅客名单项目一样。


    这一步纯粹是为了练习和找感觉。哪怕你完全是照着人家的步骤一步步操作出来的，当你亲手训练成一个 AI，看着它输出正确结果的时候，那种欣喜可比打游戏通关什么的高级多了。


    在这个过程中你会体会到一些细节，比如数据的结构和格式，你得考虑，怎样把一组数据整理成容易喂给 AI 的格式?你得有这个意识才行。


    第三，也是最大的难点，是你需要取得数据。


    你想做的项目可能没有现成的数据。就算有数据，往往也是非格式化的，不能直接喂给 AI。为此你必须对数据进行一些预处理，这会花很多工夫。


    第四，开始正式的训练。


    好消息是，Google、亚马逊和微软现在都提供标准化的云计算 AI 训练服务，各种工具都是现成的，上传数据后基本就能开练。Meta 还提供了开源的程序包。


    当然，其中的每一步都有很多细节需要动手时才能搞清楚，你必须多搜索、多问。但是那些问题往往都有现成的答案，因为你不是一个人在战斗，你是加入了一个社区——世界上有很多很多人都在做这件事。


    而这也说明一定的英语能力和一定的编程基础的重要性。你不需要精通，只需达到能用的水平，这没有很高的门槛，但是无数的聪明人恰恰就被这两道简单的门槛挡在了门外。


    ### 问 你先走


    在算法、算力、数据三者之中，到底哪一个更容易成为短板?假设算法差不多，A 国算力强，但数据保护比较严；而 B 国算力相对不足，但数据比较易得。谁更容易在 AI
    竞赛中领先?


    ### 万维钢


    目前来说，算力是最容易弥补的短板。英伟达最新的 GPU 买不到的话，买到差一点的也能用，而且还可以租用云服务，这是花钱就能解决的问题。


    算法方面，一般的应用没有问题，有大量开源的资源；但是像 GPT-4 这样的顶尖应用，其中有很多细节没有公开，是追随者难以模仿的。决定算法强弱的根本是人才，尤其是顶尖人才在哪里。


    数据存在一个问题，就是对很多应用来说，一国的数据难以被迁移到另一国使用，所以数据多不见得是优势。还有一个问题是，数据再多，如果被设置了各种壁垒，这家的不让那家用，尤其公共数据都被保密的话，那就更不行了。


    ![](img/index-244_1.jpg)


    # 第五章 实战，让 AI 为你所用


    ## 01 咒语：如何让 ChatGPT 发挥最大价值


    对于如何通过与 ChatGPT 对话来做一些事情，网上早已经有各种攻略和例子，想必你自己也有一番操作心得，我想重点说一些原则性的、有普遍意义的东西。


    跟计算机打交道通常需要使用特殊的语言，比如编程语言、命令脚本之类的。但是 GPT 作为一个语言模型 AI，没有自己的特殊语言。我们跟它互动的方式就是人类的自然语言———称为「提示语」(Prompt)。英文也行，中文也行，你该怎么说话就怎么说话，不需要学习什么专业术语。


    GPT 的思维方式很像人。正如沃尔夫勒姆所言，它似乎已经全面掌握了人类语言的语法和语义，包括各种常识和逻辑关系。


    GPT 还涌现出了思维链和小样本学习之类的本领，已经有相当不错的逻辑推理能力。当然，数学是它的命门，它的知识还是有限的，特别令人反感的是，它遇到明明不懂的还可能会瞎编(称为
    Hallucination,幻觉)。它的优点和缺点其实都很像人脑。


    GPT 可以说已经是一个自身具足的智能，但是我们跟它交流还是得讲技巧和策略。现在有个专门研究怎么跟 AI 交流的学问叫「提示语工程」(Prompt Engineering)。这就如同要想让一个魔法发挥最大的效力，你得会念咒语一样。


    但是这里没有任何神秘之处，因为跟谁交流都得讲技巧和策略。就算你面对的是一位无所不能的大宗师，你也得把话说明白，他才知道你要干啥。如果能顺着他的脾气说就更好了。


    接下来我会结合实际操作，介绍三条最常用的咒语心法。


    第一条咒语心法非常简单，那就是要准确表达你的需求。


    很多时候我们根本没想清楚自己要的是什么。比如对 ChatGPT 说「给我写首诗」，这就不是一个很好的提示语。它随便写一首，不是你需要的，这种操作没什么意义。你应该先想清楚一点，说得具体一点，比如说「以《春天》为题，写一首七言绝句」。它写了一首：春风轻拂绿意浓，桃花笑迎柳舞空。江水涓涓鸟语喧，万象更新处处红。(图
    5-1)


    ![](img/index-246_1.jpg)


    你觉得字词还可以，但是意境似乎比较单薄。于是你提出进一步要求：「以《春天》为题，写一首七言绝句，要求其中不能有『春』这个字，而且要表达感慨时间过得真快，必须发奋努力的心情。」它是这样写的：时光荏苒柳青青，花开花落又一年。勤学笃行求自强，把握光阴勿虚度。(图
    5-2)


    ![](img/index-247_1.jpg)


    以《春天》为题，写一首七言绝句，要求其中不能有「春」这个字，而且要表达感慨时间过得真快，必须发奋努力的心情。


    时光荏苒柳青青，

    花开花落又一年。

    勤学笃行求自强，

    把握光阴勿虚度。


    图 5-2


    你看，这一次生成的诗是不是更有意思了！


    像这样的对话可以来往很多轮，直到你满意为止。这其实有点像编程，不断反馈、不断修正，你会乐此不疲的。


    有时候先举几个例子能让 GPT 更清楚你到底想要什么。如果你想让它用某种特殊句式写一段话，最好先给个例子。网上流传一个操作，让 ChatGPT 用「胡锡进体」写篇文章。(图
    5-3)


    这里 GPT 展现了强大的小样本学习能力，看一遍就会了。不过根据一篇 2021 年发布的、特别具有前瞻性的论文①，


    ① Laria Reynolds, Kyle McDonell, Prompt Programming for Large Language Models:
    Beyond the Few-Shot Paradigm, CHI EA ''21: Extended Abstracts of the 2021 CHI
    Conference on Human Factors in Computing Systems No.314(2021),pp.1-7.


    W 按照下面模板，写篇文章：「近期互联网上出现了，老胡也看到，知道大家很，老胡忍不住啰嗦几句，虽然确实存在部分，但是，最后老胡呼吁。」


    近期互联网上出现了许多关于数据隐私的争议，老胡也看到了很多有关此事的报道，知道大家很关注数据隐私问题。


    老胡忍不住啰嗦几句，虽然确实存在部分公司滥用用户个人数据的情况，但是大部分公司都是在遵循相关法律法规的前提下使用数据的。最后，老胡呼吁大家在使用网络服务时要更加谨慎，了解自己的数据隐私权，同时也要监督公司是否遵循数据隐私的相关规定。


    图 5-3


    有时候给例子适得其反，因为例子可能会误导 GPT。比如，我想让 GPT 给孩子出几道数学应用题，怕它不明白什么是应用题，就先举了个例子，「以下是一道小学数学题：小明有
    15 个苹果，他送给小丽 7 个苹果，自己还剩下几个苹果?出五道类似的数学题」。(图 5-4)


    GPT 出了几道题，可跟我的例题也太像了————都是一个小孩把东西分给别的小孩，把苹果换成了香蕉、鸡蛋、铅笔等，而且还都是减法。(图 5-4)这不是我想要的，我想要有加法、有减法，有不同故事的题目。GPT
    过度模仿了例题，这是一种「过度拟合」。事实上，我一开始根本就不应该举例子，直接告诉它我的需求就好，它完全能听懂。


    我跟它说「出五道 20 以内加减法数学应用题」，它就会出「花园里有 18 朵花，小兔子吃掉了 3 朵。现在花园里还有多少朵花?」这种题，就不是小朋友把不同的东西给不同的人这同一类故事了。(图
    5-5)


    你看，这些题目就好多了。


    现实是，GPT 已经非常智能，你几乎没必要担心它听不懂。你应该只在自己用直接语言无法表达清楚的情况下举例。按照那篇论文和后来沃尔夫勒姆的观点，所谓小样本学习其实根本不是学习，只是唤醒了
    GPT 原本就会的技能。


    ![](img/index-250_1.jpg)


    出五道 20 以内加减法数学应用题


    ![](img/index-250_2.jpg)


    1.小明有 7 颗糖果，妈妈又给了他 5 颗糖果。现在小明一共有多少颗糖果?

    2.小华在冰箱里发现了 12 瓶饮料。他喝了其中的 4 瓶。还剩下多少瓶饮料?

    3.班里有 15 个男生和 5 个女生。班上一共有多少名学生?

    4.花园里有 18 朵花，小兔子吃掉了 3 朵。现在花园里还有多少朵花?

    5.爸爸给小红买了 10 本书，小红已经读完了 6 本。她还剩下多少本书要读?


    图 5-5

    '
