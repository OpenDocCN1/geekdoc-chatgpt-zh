    Google的新AI模型PaLM 2和OpenAI的GPT-4有很多相似的功能,但它們之 間也存在一些關鍵的差異。


    1\. 語言理解和生成：PaLM2在超過100種語言上進行了訓練，不僅能夠字 面翻譯，還能應用可能的上下文並理解成語、詩歌和謎語，提供更準確 的翻譯¹。而GPT-4在創造性方面有所提升，包括音樂、劇本、技術寫
    作，甚至「學習用戶的寫作風格」。GPT-4還能處理高達25000個單詞的 用戶文本，與網頁上的文本進行交互，這對創作長篇內容和進行「擴展 對話」有幫助²。


    2.邏輯推理：PaLM2增加了邏輯推理能力，它已經在數學表達式和科學期 刊上接受了訓練，現在可以解決高級的邏輯問題，甚至可以解釋步驟並 提供圖表³。


    3.編程能力：PaLM2在超過20種編程語言上接受了訓練，包括一些更專業 的語言，如Prolog和Fortran，因此它可以為更多的用戶編寫和調試代 碼。它甚至可以提供多種語言的文檔，解釋它所做的事情⁴。而GPT-4的
    用戶已經用它做了一些驚人的事情，包括髮明新的語言，詳細描述如何逃 入現實世界，從零開始為應用程序製作複雜的動畫，甚至是使用HTML和 JavaScript
    在一分鐘內創建Pong的工作版本5。


    4.視覺輸入：GPT-4現在可以接收圖像作為交互的基礎。在GPT-4網站上 提供的示例中，聊天機器人被給予幾種烘焙原料的圖片，然後被問及可 以用它們做什麼⁶
    。目前尚不清楚PaLM2是否具有類似的視覺輸入能力。 5\. 安全性: OpenAl表示, GPT-4比前一代安全得多。在OpenAl 自己的內 部測試中，它reportedly可以生成40%更多的事實響應，同時對「對禁止
    內容的請求做出回應」的可能性降低了82%⁷ 。PaLM2的安全性特性在此 未被明確提及。


