    因為這個世界是有秩序的，它講理，什麼事情都不會無緣無故發生①，所以我們可以採納沃爾夫勒姆的哲學，認為世間的一切 演化和運動————不論是行星繞著恆星轉、一草一木的生長，還
    是一塊石頭從高處掉下來————都是計算。而人類為了認識世界 和預測世界，就必須通過某種更簡化、更快捷的計算，提前知道真實世界的計算結果。

    為此我們使用了兩種計算方法，一種是神經網絡，一種是形式邏輯。

    所謂形式邏輯，就是把問題變成數學問題進行推導。你寫下方程，其中每個參數都有特定的意義，每一步推演都有明確的因果關系，你非常清楚每個中間步驟為什麼要這樣做，你有一個清晰的理
    論。形式邏輯是人類智慧的偉大發明，也是啟蒙運動以來唯一正統的分析問題的方法。我們所有的科學理論都是基於形式邏輯的。對 任 何 問 題 、 任 何 操 作 ，
    能 用 形 式 邏 輯 表 述 清 楚 ， 你 才 算 是 真「懂」。形式邏輯代表「理性」。

    從最簡單的加減乘除到最複雜的計算機程序和物理學家的數值模擬，人們通常所說的「計算」都是形式邏輯的。形式邏輯要求 你嚴格按照某些規則操作，這對人腦來說其實很費力。這就是為什
    麼我們發明了計算機去代替我們執行形式邏輯的算法。

    人類原本擅長的、天生就會的計算，其實是神經計算。從大腦到身體，人體是由幾個神經網絡組成的，它們給你提供各種感 知，神經計算就是這些感知過程。你感到餓了、認出一位

    ① 當然，量子力學現象在某種意義上可以是「無緣無故」發生 的，但這不是重點，而且按照沃爾夫勒姆的觀點，可以用多世界 理論避開。

