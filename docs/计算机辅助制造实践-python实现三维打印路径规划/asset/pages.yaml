    如对以上最优解 (180°, 130°), 我们可以推断, (180°, 310°) 也必然是问题的最优解。我们可以通过缩小α和β的取值范围来减少最优解数量,
    如让其在 [0, π/2] 内取值; 但这样会带来另一个问题, 如果问题最优解恰在定义域边界上取到, 那么粒子群在进化、变异过程中就可能“处处碰壁”, 不利于最优解确定,
    这也正是我们将α, β的定义域设置为 [0, 2π] 的原因。以上测试中, 对包含 12 个面片的 STL 模型, 当种群数量为 70 时, 每次迭代时间约为
