    # 本章小结


    在本章，我们介绍并实现了基于拓扑模型的切片轮廓计算方法，它的功能相当于第 5 章介绍的截交算法和第 6 章介绍的拼接算法的总和，能够一步到位地从 STL 模型获取切片轮廓数据。为此，我们首先介绍了立体几何中顶点、棱边以及面的拓扑关系表示方法，包括从顶点索引到面，从面索引到顶点和半边，从半边索引到顶点、面以及对边。在此基础上，我们主要运用字典结构对输入的
    STL 模型进行了拓扑重建，同时消除了模型中的冗余顶点。对于得到的拓扑模型，我们首先使用扫描平面框架快速获取指定层高上和截平面相交的所有三角面片。然后从中挑选了一个种子面片，并从这个种子面片出发，根据模型中点、线、面的拓扑关系，不断追踪、截交目标轮廓，最终得到封闭轮廓。最后，我们对本章介绍的拓扑切片方法和基于第
    5、第 6 章的组合切片方法进行了测试比较，结果表明，模型中面片数量越多，切面层厚越小，拓扑切片的优势越明显。


