    # 10.2.3 切片支撑点计算


    通过上一小节的介绍，我们已经能够计算给定三维模型和其网格竖线的交点，如图 10.6 所示，只要校验这些交点序号的奇偶属性，就能提取到用于支撑模型上悬臂结构的支撑线段。那如何将这些线段转化为实际可用的支撑及支撑路径呢？一种直观的思路是让打印材料在竖直方向上直接沿着支撑线段生长，以得到一系列细长的支撑柱子，但考虑到这些细长柱子在打印过程中极易倒塌，因此这种思路意义不大。支撑本身应该具备一定的自支撑性，如图
    10.5 所示，在水平面上，支撑路径的填充形式可为上下层平行交叉填充或轮廓加平行填充。如何将沿竖直方向的支撑线段转化为水平面上的支撑填充区域呢？考虑到三维打印的基本特征是通过切片的形式将三维模型转化为平面上的二维轮廓，因此，针对这里的竖直支撑线段，我们也可以尝试使用切片的形式将其转化为平面区域。


