    对以上 VtkAdaptor 类,我们在其__init__函数中通过相应的 VTK 类创建了 renderer、window 以及 interactor 属性。因此,在实际应用中,我们只需创建
    VtkAdaptor 类的对象,并调用 display 函数,就可方便地构建 VTK 显示场景。如果我们需要改变场景背景颜色,只需调用 setBackgroundColor
    函数即可。


    在 VtkAdaptor 类中,我们封装了若干个几何实体绘制函数,包括 drawAxes、drawActor、drawPdSrc 以及 drawStlModel
    函数。其中函数 drawAxes 的作用是在场景中绘制坐标轴,坐标轴的长度、箭头大小等都可通过该函数参数设置。函数 drawActor 的作用是绘制 vtkActor
    类型的对象,在调用这个函数时,须确保在此之前已经通过数据源、映射器创建了 vtkActor 对象。和 drawActor 相比,drawPdSrc 函数可更加方便地对数据源直接进行绘制,其参数是
    PolyData 类型的 source,如通过 vtkCubeSource、vtkConeSource 以及 vtkSTLReader 等类型创建的对象。函数
    drawStlModel 对 drawPdSrc 进行了进一步封装,可直接通过输入 STL 文件路径绘制 STL 模型。


    此外,我们还结合在第 2 章中创建的几个几何实体类,封装了 drawPoint、drawSegment 以及 drawPolyline 函数。其中函数 drawPoint
    的输入参数为 Point3D 对象,可在场景中绘制一个点,点的大小可通过 radius 参数设置,默认值为 2.0。函数 drawSegment 的作用是绘制线段,输入参数为
    Segment 对象。函数 drawPolyline 的作用是绘制多段线,输入参数为 Polyline 对象。


    以上 draw 函数的返回值都是在场景中被绘制的 vtkActor 对象。我们可以在外部代码中保存这些返回的 vtkActor 对象,这样就可以在必要的时候改变对象属性或通过
