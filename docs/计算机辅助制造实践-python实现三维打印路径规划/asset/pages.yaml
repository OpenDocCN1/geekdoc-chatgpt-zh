  md: '# # 第 7 章 基于拓扑模型的切片轮廓计算


    # ## 引言


    本章我们打算重新思考针对 STL 模型的切片轮廓计算问题。在前面几章中，我们都是直接从 STL 模型出发，先进行截交计算，得到离散线段，然后再对这些散乱线段进行拼接，得到表示打印区域边界的封闭轮廓。在这一过程中，尽管我们提出了若干优化算法，但我们并没有对
    STL 模型进行任何预处理或优化——当然我们曾在扫描平面法的截交操作中对模型中的面片进行排序。事实上尽管在原生的 STL 模型中没有表现出来，但模型中顶点与面片、边与面片、边与边、面片与面片之间是存在一定的几何拓扑关系的，比如由一个顶点可以找到共用它的若干面片，由一个面片可以找到共用同一边的相邻面片等。这一章我们要做的就是首先对输入的
    STL 模型进行预处理，重建模型中点、线、面的几何拓扑关系，并在此基础上重新考虑切片轮廓计算问题。


    # ## 7.1 STL 模型存在的问题


    回顾一下图 4.1，我们可以发现，在传统的 STL 文件中，保存的是以三角面片为单元、面片顶点坐标为基础的非常原始的几何数据，其中两点组成一边，三点组成一面。它的一个显著特征是各个面片都是被无序保存的，正是为了应付这个特征，我们在前面几章费了不少心机。如果我们观察稍微再仔细点，就会发现在
    STL 文件中，各个面片中的各个顶点都是被独立保存的，这直接导致了 STL 模型的顶点冗余问题。


    顶点冗余是 STL 模型经常被诟病的问题之一。如图 7.1 所示，图中的四棱锥拥有 5 个顶点，理论上，用 5 个顶点就足以表示这个模型。但如果用 STL
    模型来表示这个四棱锥的话，那么至少需要 6 个三角面片，其中每个三角面片包含 3 个独立顶点，共需 18 个独立顶点，每个坐标位置至少有 3～4 个顶点重合。信息量没有丝毫增加，顶点数却增加了若干倍，这直接导致了
    STL 模型在保存时占用磁盘或内存空间的增长，这也正是 STL 模型顶点冗余的原因。


    下面我们从理论上分析一下 STL 模型中冗余的顶点个数。由欧拉定理可知，对任意简单多面体，它的定点数 V、面片数 F 和棱边数 E 满足如下公式：


    ```

    V + F - E = 2  (7-1)

    ```


    对于 STL 模型，每个面都是三角形，因此，每个面包含 3 条边，而每条边又被 2 个面共用，因此有'
