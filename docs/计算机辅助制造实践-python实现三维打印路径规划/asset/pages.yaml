  md: '将已经得到的切片数据保存到一个指定的文件中，方便后期使用。


    我们可以像在 Polyline 模块中定义的读写多段线函数一样，去自定义一种文件格式，用来保存切片数据，这其实并不困难。或者我们也可以考虑使用一种现有通用的文件格式，比如
    SLC (SLiCe)。


    和 STL 一样，SLC 文件格式同样由 3D systems 制定，如果说 STL 是三维打印模型文件格式的标准，那么 SLC 就是三维打印中切片数据文件格式的标准。SLC
    文件使用 2.5 维的轮廓线表示 CAD 模型，它有层的概念，层高随着 Z 方向增长，其中每层截面由内、外边界轮廓多边形组成。


    # 4.6.1 SLC 文件解析


    SLC 文件由文本和二进制混合编码而成，包含 4 个部分：头文件（Header Section）、预留区（Reserved Section）、采样表（Sampling
    Table Section）以及轮廓数据区（Contour Data Section），如图 4.11 所示。其中头文件包含一系列 ASCII 文本键值对，指示了当前文件的全局信息，如
    SLC 版本号（-SLCVER）、长度单位（-UNIT）、生成软件（-PACKAGE）、模型包络（-EXTENTS）等信息。头文件最大大小不能超过 2048
    个字节，结束标识为 0x0d（回车）、0x0a（换行）、0x1a（Ctrl+Z）三个字符。预留区包含 256 个字节，是为将来扩展使用的预留空间，目前在这个区域内不定义任何东西，默认每个字节值为
    0。


    采样表由若干通道组成，开头第 1 个字节指示了通道数量，最大值为 255。每个通道有 4 个字段，每个字段占 4 字节，共 16 个字节，分别为切片起始高度（float）、切片厚度（float）、线宽补偿（float）以及最后的保留字段。


    在实际三维打印中，如果我们采用均匀层高去切片，那么只需在采样表中保存一个通道即可（17 个字节）。对于那些有非均匀层高切片需求的场景，我们可以设置多个通道，每个通道设置不同的切片厚度，但至多设置
    255 种不同切片厚度。


    轮廓数据区是 SLC 文件的核心部分，用于保存多边形轮廓的坐标信息。如图 4.11 所示，该区域按层的形式组织轮廓。每层数据从当前层 z 值开始（4 字节，float），随后是当前层轮廓数量（4
    字节，uint，整型）。紧接着是第 1 个轮廓顶点数（4 字节，uint）和 gap 数（4 字节，uint），然后是第 1 个轮廓 X、Y 坐标列表，其中每个坐标（如
    x 值）占 4 个字节，为 float 类型，X、Y 坐标总是成对出现。如果当前层还有第 2 个轮廓，那么后面接的是第 2 个轮廓的顶点数、gap 数以及坐标列表。以此类推，直至罗列完当前层所有轮廓。在这之后，再接下一层轮廓数据，以此类推。该区域结尾处有
    8 个字节，前 4 个字节用于标识当前模型的最高点 z 坐标，后 4 个字节固定为 0xFFFFFFFF 值，标识轮廓数据区到此结束，同时也标识整个文件到此结束。


    以上我们提到了 gap，对某一轮廓，如果轮廓上某个位置存在两相邻点重合的情况，则定义这个位置为 gap，gap 可以看作是轮廓线在此出现了断裂（沟）。


    本书介绍的轮廓线均为封闭轮廓线，因此该字段值总为 0。'
