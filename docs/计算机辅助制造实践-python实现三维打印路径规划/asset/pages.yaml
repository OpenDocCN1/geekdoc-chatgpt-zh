    类中的 appendSegment 函数，这个函数在本书第 2 章已有介绍，作用是将一条线段拼接到当前多段线上，如果拼接成功，则返回 True，否则返回 False，拼接成功的前提是线段的一对端点和多边形的一对端点（起点和终点）中存在一对点重合。


    需要强调的是，这里对两点重合判断用到的是 Point3D 中的 isCoincide 函数，判断原则是如果两点距离小于一个设定的极小值，则认为两点重合，而非两点坐标完全一致。这是因为计算得到的坐标值可能存在截断误差，即便理论上重合，实际上坐标也不可能完全一致，这一点需要引起注意。


    函数 linkSegs_brutal 虽然总是能够返回正确的结果，但其时间复杂度为 O(n²)，呈 n 的平方量级，其中 n 为当前层上需要拼接的线段条数。显然，对于那些非常细致、包含上百万面片的
    STL 模型，n 值可能极大，这个函数的执行时间也就可能很长。大自然的规律总是简单、美丽、和谐的！


    对于线段拼接问题，必然也存在计算效率更高的算法，我们将在后续章节介绍线段拼接的优化算法。'
