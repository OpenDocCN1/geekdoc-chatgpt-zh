    STL 模型。扫描平面的一个重要特性是它维护了一个与其相交的三角面片列表，即模型中所有最高点高于（或等于）且最低点低于（或等于）扫描平面的三角面片将被存入这个列表。当扫描平面在
    Z 轴上移动时，其三角面片列表中的面片将动态增减。在建立了扫描平面的概念后，STL 模型截交问题可以转化为扫描平面和其自身三角面片列表中保存的面片求交的问题，这样就可以避免遍历
