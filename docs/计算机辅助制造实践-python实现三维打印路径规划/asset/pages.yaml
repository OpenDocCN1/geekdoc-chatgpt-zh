    在本章前面几节中，我们创建了点、线、面等几何实体类，并在类中实现了一些功能简单的函数，这一节我们将侧重讲解若干几何算法，如距离、求交计算等，我们会创建一些全局函数，并将这些函数写在
    GeomAlgo.py 文件中。GeomAlgo( geometry algorithm )模块将是今后我们收藏各种有意思的几何算法的主要场所。


    # 2.5.1 实体距离


    我们在这里求解的实体距离包括点线距离、点面距离、线线距离和线面距离，点点距离已经包含在 Point3D 类中。


    +   1.点线距离


    对空间中已知的任意一点 Q 和直线 l(P, V)，其中 P 为 l 经过的点，V 为 1 单位方向向量，如图 2.7( a )所示。记点 Q 在直线 l
    上的投影为 R，设 P、R 两点距离为 t，则向量 PR = V · t。在三角形 QPR 中，向量 QR = QP + PR，即 QR = QP + V
    · t。又因为 QR ⊥ V，所以两向量点乘为 0，即


    $$(QP + V \cdot t) \cdot V = 0$$ (2-18)


    得


    $$t = - \frac{QP \cdot V}{V^2} = PQ \cdot V$$ (2-19)


    即 t 值为 PQ 和 V 两向量点乘结果。投影点 R = P + V · t，QR 的长度即为点 Q 到直线 l 的距离。'
