  md: '若干内边界，按照我们之前在第 4 章中的约定，外边界轮廓方向为逆时针，内边界轮廓方向为顺时针。图中 b1 同样表示一个曲线序列，它保存了对 b0 中的各轮廓进行等距偏置得到偏置曲线，这里等距偏置的意思是
    b1 上的任意一点到 b0 的距离为一固定常数，而这个常数就是偏置距离。如果两条曲线为等距偏置关系，那么我们可以认为这两条曲线是“平行”的，这也正是我们称偏置路径为轮廓平行路径的原因。等距偏置事实上是三维打印的一个工艺需求，比如在熔融沉积（Fused
    Deposition Modeling，FDM）三维打印中，从喷头挤出来的丝宽是不变的，从理论上来说，要把这些宽度不变的丝材无缝地平铺在打印区域内，就必须用到等距偏置。同理，图中
    b2 为对 b1 等距偏置得到的曲线序列，b3 为对 b2 等距偏置得到的曲线序列等。我们发现，在连续偏置过程中，bk (k = 1, 2, 3···) 在某些情况下可能会分裂成两条或多条曲线（如图中
    b3），因此，bk 中曲线的数量总是会越来越多，但由它包围的平面范围会逐渐缩小，并最终收敛于一点（或多点），从而填充整个打印区域。


    方向平行行填充路径（以下简称平行行填充路径或平行路径）实质上就是平面上的一系列平行线段，如图 8.1(b) 所示。相对于轮廓路径，平行路径的生成原理相对直观、简单。如果不计时间成本，我们只需事先在平面上指定一个方向，并根据这个方向在打印区域范围内生成一系列等距平行线，然后计算这些平行线和边界轮廓交点，得到位于轮廓内部的线段，最后通过合适的方式连接这些线段，获得平行路径。这个过程其实和在
    CAD 软件里做的线段区域裁剪操作类似。如果我们再稍微思考一下，还会发现：如果表示打印区域的轮廓为凸多边形，那么每条直线最终都将被轮廓截成一段线段；但轮廓若为凹多边形，那么就可能存在一些直线被轮廓截成两段或多段线段，具体线段数量不仅和轮廓形状有关，还和直线的方向有关，轮廓形状不能调整，而直线方向能够调整。我们把事先指定的直线方向称为平行路径的参考方向，参考方向是平行路径生成过程中的重要参数，它关系到最终得到的线段数量、线段平均长度以及打印过程中打印机喷头需要被抬起的次数，显然，每条线段的平均长度越大，喷头被抬起的次数越少，打印效率就越高。


    在实际三维打印中，对每层轮廓区域，大多时候我们并不会单独地去填充轮廓路径或平行路径，而是去填充由两种路径混合而成的组合路径。如图 8.2 所示，我们一般会在打印区域的边缘处填充轮廓路径（图中填充了
    3 层轮廓路径），这样做的原因是轮廓路径能


