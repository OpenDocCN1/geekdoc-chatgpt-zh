    n = int(H/h) + 1 (11-5)


    式中 H 为端面厚度,h 为切片厚度,int 为取整符号。基于此，在遍历过程中，如图 11.5 所示，对于当前相邻层切片轮廓 \( c_i, c_{i+1}
