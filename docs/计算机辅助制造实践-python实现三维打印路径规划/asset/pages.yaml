    # 2.1.2 向量


    在计算几何中,向量是反映两点之间的一种关系量。虽然向量和点都由坐标表示,但两者有所不同,点有位置的概念,而向量没有位置,只有方向和长度(模)的概念。向量在空间中经任意平移后,它所表示的几何意义不变,因此我们可以认为向量来自无穷远处。和点一样,向量同样可以用齐次坐标表示,在定义一个三维向量的齐次坐标(dx,
    dy, dz, dw)时,我们规定 dw = 0,即(dx, dy, dz, 0)。


    向量可以看成是空间中一个点 P1(x1, y1, z1, 1)到另一个点 P2(x2, y2, z2, 1)的增量部分,如果用 V 表示这个增量,那么 V
    的坐标为(x2-x1, y2-y1, z2-z1, 0)。对向量和点,我们可以定义加号、减号操作符(‘+’, ‘-‘),使得:


    +   V = P_2 - P_1 (2-1)

    +   P_2 = P_1 + V (2-2)

    +   P_1 = P_2 - V (2-3)


    以上公式(2-1)表示一个向量可以通过两个点相减得到,向量的指向是从 P1指向 P2;公式(2-2)和公式(2-3)表示一个点可由另一个点加上(或减去)一个向量得到,即一个点可以通过另一个点平移得到。


    # 2.1.3 矩阵


    在计算几何中,矩阵是反映点和点、向量和向量以及点和向量之间的复杂关系量。在本书中,我们将点看作是一个 1 行 4 列的矩阵,对点的几何变换可由该点右乘一个矩阵得到,向量亦然。在齐次坐标下,一个矩阵将包含
    4 行 4 列共 16 个元素,如图 2.2 所示,这 16 个元素又可分为 3 个子区域,其中左上角的 9 个元素(a00 ~ a22)用于旋转变换,下方
    3 个元素(a30, a31, a32)用于平移变换,对角线 3 个元素(a00, a11, a22)用于缩放变换。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_30_0.png)


    图 2.2 四阶矩阵中各子区域对应的不同变换功能


    我们先来看一下平移矩阵。设平移矩阵为 M1, 构造 M1 只需对矩阵下方的 a30, a31, a32'
