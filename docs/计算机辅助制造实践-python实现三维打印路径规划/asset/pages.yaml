    # 5.3.3 算法流程及实现


    之前我们已经大致了解了层高匹配法的基本原理，其本质就是以 STL 模型中的三角面片为主导，去匹配层高列表中的层高，然后再对每个三角面片和它包含的层高求交。显然，层高匹配法可以规避一些不必要的面片和截平面的相交计算，因此从理论上来说，它可以提高截交计算的效率。


    图 5.7 给出了基于层高匹配法的 STL 模型截交流程。就像我们在上一节介绍的扫描平面法一样，该流程输入依然是 STL 模型和切片厚度，输出为以 Layer
    对象列表组织的截交线段。该流程首先根据模型最低点、最高点和切片厚度生成具有均匀层高特征的层高列表，以及用于保存中间变量的字典 layerDic。注意，这里的字典
