    理论上，我们只要调用 GeomAlgo 模块中的 intersect 函数去计算直线（Line）和线段（Segment）的交点即可。但当线段端点恰好落在直线上时，由于浮点运算中截断误差的存在，intersect
    函数可能无法返回正确的结果，在最差的情况下，intersect 函数可能返回 None，即直线和线段在本应相交的情况下却返回不相交的错误结果。在某些场合下，这样的求交结果可能无足轻重；但是在求平面区域填充线的应用中，如图
    9.1，某处交点的有无将直接改变当前 y 线上所有交点的奇偶属性，这对填充结果的影响是巨大的。为了避免截断误差的影响，增强算法的稳定性，这里我们首先判断线段两端点是否落在直线上，当直线是一条和
    X 轴平行的 y 线时，这样的判断变得非常简单，我们只需判断线段端点的 y 值是否和 y 线的 y 值相等即可。如果线段端点没在直线上，我们再调用 GeomAlgo
    模块的 intersect 函数求取直线和线段交点。


    在获取了当前扫描线维护的线段和指定 y 线的所有交点之后，我们首先对交点列表按 X 坐标进行了升序排序，排序的目的是方便我们后续直接从交点列表中提取填充线。此外，我们还执行了一步看似奇怪的操作：通过检查相邻交点间的距离平方是否为
    0，删除交点列表中所有有重合的交点对。在下一小节，我们将解释这么做的原因。


    需要说明的是，我们在以上 intersect 函数中删除的重合交点对不会对填充结果的正确性造成影响。如图 9.3 所示，这里的重合交点对只可能存在以下两种情形：一是交点两边的线段都在
    y 线下方（图中 P1, P2），二是交点两边的线段都在 y 线上方（图中 P3, P4），无论哪种情况，因为两边线段都和 y 线相交，因此最终会计算得到两个重合的交点。在图
    9.3 中，按照填充线的提取规则，我们最终将得到 P0 P1, P2 P3, P4 P5 三条有效填充线段。考虑到 P1, P2 重合，P3, P4 也重合，而且所有交点都在同一条直线上，因此我们可以移除
    P1, P2 和 P3, P4 两组点对，得到和原来 3 条填充线等价的 P0 P5 填充线。根据以上分析，删除重合的交点对对最终填充结果的正确性不产生影响，而且可以减少输出的填充线数量。


