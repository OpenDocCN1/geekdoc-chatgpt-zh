    # 7.3 STL 拓扑模型重建


    在上一节中,我们分析了顶点、棱边(半边)以及面片之间的几何拓扑关系,并在此基础上分别建立了 TVertex、TEdge、TFace 拓扑数据结构,在这些类中,我们着重封装了一些和截交计算相关的函数。在建立这些类之前,我们做了一个非常重要的假设,我们假设模型中不存在冗余顶点。这个假设和事实显然是不符的,因为在
    STL 模型中确实存在大量的冗余顶点,而且借助欧拉定理,我们分析出每个顶点平均被重复保存了 6 次。现在,我们可以利用 TVertex、TEdge、TFace
    这 3 类对 STL 模型进行拓扑重建,以消除冗余顶点,建立顶点、面片、半边之间相互关联的几何拓扑关系。拓扑重建的最终目标是从当前任一一顶点、半边或面片出发,能够快速索引引与之相邻的其他顶点、半边或面片,继而可以迭代索引到整个模型中任意的顶点、半边或面片。


    # 7.3.1 冗余顶点消除


    对 STL 模型进行拓扑重建的第一步或第一个难点是消除模型中的冗余顶点。对输入的 STL 模型,我们可以从每个独立的三角面片中收集顶点坐标,并把这些顶点全部保存到一个顶点列表(数组)中。根据欧拉定理,我们知道,顶点列表中大概有六分之五的元素冗余,具有相同坐标的顶点被不断重复保存,只有其中六分之一的顶点是我们真正需要的。如果我们将这个问题进一步抽象,那么对它更为普通描述将是:对一个可能保存了相同元素的列表,如何以最快的速度得到它的
    unique 列表。这里 unique 列表的意思是列表中的元素各不相同。


    解决这个问题一个非常直观的思路就是对列表中的元素进行排序。如图 7.7 所示,排序完成后,在列表中,具有相同值的元素被排在相邻的位置上。此时,我们可以从列表的第一个元素开始,逐个比较相邻元素对的值是否相等,如果相等,则移除其中一个元素,直至列表末尾。按照这个思路,我们可以在
    O(nlog(n)) 时间内完成对列表中冗余元素的清理,其中 n 为初始列表中的元素个数,这个时间复杂度主要由排序算法决定的,因为后面元素移除过程相对简单,它的时间复杂度为
    O(n)。


    对冗余顶点消除问题,同样,我们也可以先对得到的顶点列表进行字典序排序,然后逐个移除列表中相同的相邻顶点,最后得到一个 unique 的顶点列表,这其实并不太难实现。但是在得到这样一个毫无冗余的顶点列表之后,我们要实现的模型拓扑重建问题似乎会变得更加困难,因为以上消除冗余顶点过程会完全打乱顶点顺序,我们很难据此回溯哪个顶点属于哪个面片,哪条棱边。在拓扑重建这样一个背景下,消除冗余顶点的最佳时机应是在我们还能理清一个三角面片内面、边、顶点三者关系的时候,这样我们至少能很'
