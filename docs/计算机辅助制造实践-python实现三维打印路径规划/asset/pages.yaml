  md: "一个真正优秀的线段拼接算法首先应该能够得到正确的拼接结果，且算法本身具有较强的鲁棒性，能够适应各类复杂输入；其次，这个拼接算法还应该具备较高的执行效率，能够在较短的时间内完成拼接，至少能和之前介绍的优化截交算法在运行时间上持平。在认识到暴力拼接法存在的问题后，我们在本章将介绍两种针对线段拼接问题的优化算法，一种是基于点坐标字典序排序的拼接算法，另一种是基于字典查询法的拼接算法。虽然这两种算法表面上都和“字典”有关，但它们在原理上大不相同。尽管如此，这两种算法都用到了一种用于存储点（或线段）的数据结构。\n\
    \n# 6.2 链接点数据结构\n\n在 STL 模型截交阶段，在某一截平面上，我们已经得到了一系列截交线段。初始情况下，这些截交线段直接以我们最初建立的\
    \ Segment 数据结构（参考代码 2-8）保存两端点坐标。但 Segment 结构太过简单、基础，仅仅依靠 Segment 结构，我们发现很难对线段拼接算法做出进一步优化。\n\
    \n线段拼接问题的本质就是寻找目标点附近和目标点重合的线段端点，因此解决线段优化拼接问题的方向应该是构建各线段端点之间的临近关系。而线段端点临近关系的构建依赖于设计精巧的数据结构。为此，我们在这里介绍一种介于点和线段之间的新型数据结构，我们既可以用这种结构保存一个点，也可以用这种结构保存一条线段。我们把这种数据结构命名为\
    \ LinkPoint（链接点），顾名思义，它本质上还是表示一个点。LinkPoint 的具体定义如下（写在 LinkPoint.py 文件中）：\n\n\
    ```\nfrom GeomBase import Point3D\nclass LinkPoint():\n    def __init__(self,\
    \ pnt3d, digits = 7):\n        self.x = round(pnt3d.x, digits)\n        self.y\
    \ = round(pnt3d.y, digits)\n        self.z = round(pnt3d.z, digits)\n        self.other\
    \ = None\n        self.used = False\n        self.index = 0\n    def __str__(self):\n\
    \        return 'LinkPoint: used: %s\\nself (%s, %s, %s)\\nother (%s, %s, %s)\\\
    nlinked to: %s\\'' % (self.used, self.x, self.y, self.z, self.other.x, self.other.y,\
    \ self.other.z, self.other.index)\n    def toPoint3D(self):\n        return Point3D(self.x,\
    \ self.y, self.z)\n```\n\n由以上类的定义可知，LinkPoint 仍然表示一个点，拥有 X、Y、Z 坐标。在 LinkPoint\
    \ 的初始化函数中，我们使用一个 Point3D 的对象来给 x、y、z 坐标赋值，并通过 digits 变量和 Python 的 round 函数来控制连接点坐标的小数位数。这里我们设置的\
    \ digits 为 7，即通过"
