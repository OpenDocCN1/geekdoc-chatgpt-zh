    在 PrintParams 类中, 对 startCode 和 endCode 两个属性, 这里我们并未真正对它们进行赋值(G 代码中, 英文分号表示注释),
    对这两个属性的赋值需要参考具体使用的打印机说明书。同理, 对 nozzleSize 和 filamentSize 两个属性, 尽管在这里我们给出了它们的常规取值,
    但在具体使用时也要结合实际使用的喷头和丝材等情况。


    最后, 需要强调的是, 在表 11.1 或 PrintParams 类中, 我们给出的三维打印工艺参数仅仅是目前模型切片, 端面识别, 路径生成, 支撑生成等过程所需要的部分参数。现有的这些工艺参数当然可以被进一步拆分,
    就像我们之前将路径间距 (sflnvl) 拆分成喷头尺寸 (nozzleSize) 和填充率 (sFRate) 一样, 或者将打印速度 (g1Speed)
    拆分为外壳打印速度、内部填充速度、支撑打印速度等, 拆分的目的是对三维打印路径生成过程进行更精确的控制。此外, 根据实际需求, 我们还可以添加新的工艺参数,
    如对模型进行轻量化抽壳操作所需的壁厚参数、对切片轮廓进行简化(减少轮廓顶点数)所需的误差参数等。


    # 11.2.2 切片路径生成


    在上一小节, 我们对三维打印路径规划所需的工艺参数进行了汇总, 得到了一个打印工艺参数类 PrintParams。在此基础上, 在这一小节, 我们将对包括模型切片,
    端面识别, 路径生成, 支撑生成等过程涉及的函数进行组织, 封装一个用于三维打印路径生成的综合函数 genAllPaths, 该函数核心步骤如下：


    +   (1) 对三维模型进行切片(slice_topo 或 slice_combine);

    +   (2) 识别端面切片, 并对切片轮廓进行疏密分区(idEndLayers);

    +   (3) 对各切片生成轮廓填充路径(genCpPath);

    +   (4) 对各切片生成密实填充路径(genDpPath);

    +   (5) 对各切片生成稀疏填充路径(genDpPath);

    +   (6) 如有必要, 生成支撑路径(genSptPath)。


    根据以上步骤, 下面我们在 GenNcCode 模块中给出 genAllPaths 函数的具体实现代码:


    | GenNcCode.py | 封装模型切片、端面识别、路径生成、支撑生成等函数, 生成打印路径 | 11 - 9 |

    |---|---|---|

    | 1 | ...... | # 导入相关库,忽略其他代码 |

    | 2 | def genAllPaths(pp : PrintParams) : | # 定义路径生成函数 |

    | 3 | sflnvl = pp.nozzleSize / pp.sFRate | # 计算工件内稀疏平行填充间距 |

    | 4 | sptSflnvl = pp.nozzleSize / pp.sptSFRate | # 计算支撑部分平行填充间距 |

    | 5 | layers = slice_topo(pp.stlModel, pp.layerThk) | # 1.对模型切片,得到切片序列 |

    | 6 | idEndLayers(layers, pp.shellThk, int(pp.endThk / pp.layerThk) + 1) | # 2.端面识别,疏密分区
    |

    | 7 | for i, layer in enumerate(layers) : | # 遍历切片生成路径 |

    | 8 | layer.cpPaths, layer.ffPaths, layer.sfPaths = [], [], [] | # 定义轮廓、密实、稀疏填充路径
    |

    | 9 | layer.cpPaths = genCpPath(layer.contours, pp.nozzleSize, pp.shellThk) |
    # 3.生成轮廓路径 |

    | 10 | delta = 0 if i % 2 == 0 else math.pi / 2 | # 平行路径上、下层交叉填充 |

    | 11 | if len(layer.ffContours) > 0 : | # 4.生成密实填充路径 |'
  merge: -1
