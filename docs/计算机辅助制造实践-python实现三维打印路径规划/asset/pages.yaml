    # 图 8.13 同一轮廓组合应用不同填充规则得到的填充结果


    在 Clipper 库中，输入的轮廓按其作用可被分为两个类别，一类是 subject，另一类是 clip。下面我们结合四种布尔操作（参见图 8.13）对 subject
    和 clip 轮廓的作用分别进行讨论。


    (1) 在两组轮廓的求交操作中，clip 轮廓相当于裁剪窗口，任何位于窗口外的 subject 轮廓都将被裁剪并舍弃，而位于窗口内的 subject 轮廓将被裁剪并保留，形成输出轮廓。对两组封闭轮廓来说，求交的结果就是两组轮廓同时覆盖到的平面区域，因此此时
    subject 和 clip 是等价可交换的；但对于一组闭合轮廓和一组非闭合轮廓来说，只能由封闭轮廓作为 clip，非封闭轮廓作为 subject。


    (2) 在两组轮廓的求并操作中，subject 和 clip 轮廓是等价的。求并操作的结果是两组轮廓覆盖区域的和区域。


    (3) 在两组轮廓的求差操作中，如果用代数减法来类比，subject 轮廓充当被减数的作用，clip 充当减数作用，即 subject - clip，因此，最终的输出区域相当于从
    subject 区域中扣除 clip 区域的剩余区域。


    (4) 在两组轮廓的异或操作中，subject 和 clip 轮廓也是等价的。异或操作的结果是输出两组区域并区域中扣除交区域的剩余区域。


    接下来我们再来看一下 Clipper 库的接口类和函数。在我们定义的 Polyline 类中，顶点类型是 Point3D，且 Point3D 中点坐标的数据类型是浮点型。但是在
    Clipper 库中，Path 顶点（C++中为 IntPoint 类，Python 中为 Point 类）坐标的数据类型是整型。这看起来有点不可思议，其实却是
    Clipper 库的作者有意为之。事实上类似的问题我们在前面几章也遇到过，浮点型在运算过程中会不可避免地出现截断误差，而这些截断误差对于判断一个几'
