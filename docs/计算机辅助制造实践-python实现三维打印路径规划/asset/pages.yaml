    sort 的 key 参数指定比较指标即可，因此正确的排序写法是：


    ```

    triangles.sort( key = lambda t : t.zMinPnt( ).z, reverse = Flase )

    ```


    在以上代码中，我们采用了 Python 的 lambda 表达式（即函数式表达式），首先使用 zMinPnt 函数来获取三角形对象的最低点（参见 Triangle
    类），然后再从该最低点获取 z 坐标作为比较指标。默认情况下，Python 的 sort 以升序排序，即 reverse 参数默认值为 False；如果我们需要按降序排序，只需指定
    reverse 参数值为 True 即可。尽管相对于 C、C++、C# 等语言，Python 天生不足，存在执行效率不高的问题，但就算法本身而言，其内置 sort
    算法的时间复杂度不会超过 O( nlogn )，而且是稳定可靠、上手可用的。


