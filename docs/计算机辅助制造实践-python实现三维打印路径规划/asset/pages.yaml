  md: '乘以指定的放大系数,否则我们将无法得到正确的偏置结果。


    # 8.5 轮廓路径生成与连接


    根据之前介绍可知,轮廓平行填充路径就是对表示打印区域的边界轮廓连续偏置若干次后连接得到的路径,因此我们在这一节需要完成两个任务,一是根据三维打印的工艺特点生成连续偏置曲线,二是连接这些偏置曲线,得到一条(或若干条)可以遍历这些偏置曲线的打印路径。


    # 8.5.1 连续偏置曲线生成


    对某一指定层高上表示打印区域边界的一组轮廓,为了保证工件能够获得较高的表面质量,根据三维打印工艺需求,我们需要对这组轮廓连续向内偏置一定次数,以生成能够覆盖打印区域边缘的具有均匀厚度的填充带。以
    FDM 工艺为例,如果设填充带厚度为 W,打印机喷头直径为 Ω,那么我们大致需要对边界轮廓连续偏置 W/Ω 次(取整)。在这一过程中,我们需要关注并解决以下几个问题。


    首先是连续偏置中每次偏置距离的取值问题。根据以上设定,打印机喷头直径为 Ω,即每次从喷头挤出的热熔丝材的宽度为 Ω,如图 8.22 所示,为了保证打印模型在尺寸上恰好等于设计模型,不至于放大或缩小,首次偏置距离应设置为
    Ω/2,即喷头半径尺寸。随后,为了实现相邻偏置路径之间的无缝填充,其他偏置距离应设置为 Ω。理论上,第 1 次填充后,填充带宽度为 Ω;第 n 次填充后,填充带宽度为
    nΩ。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_183_0.png)


    图 8.22 工艺限制下的连续偏置距离取值


    其次,在连续偏置过程中,我们需要合理选择偏置主体。原则上,为了确保喷头沿着相邻偏置路径填充后丝材边缘恰好靠在一起,不至于重叠或留下缝隙,我们应该基于当前偏置曲线生成下一条偏置曲线,即图
    8.22 中 b1 曲线基于打印区域边界轮廓( b0 )偏置 Ω/2 生成,b2 曲线基于 b1 曲线偏置 Ω 生成,b3 曲线基于 b2 曲线偏置 Ω 生成,以此类推,b1
    曲线基于 bk-1 曲线偏置 Ω 生成。需要说明的是,以上 b1( i 为非负整数)曲线可能由一条或多条曲线组成,b1 称为第 i 级偏置曲线,它是由第 i
    级偏置得到的偏置曲线。但是,采用这种连续偏置策略可能存在以下两个缺陷：'
  merge: -1
  img_proc: true
- pgno: 184
  md: '一是偏置顶点数量的无谓递增。如图 8.23 所示，对于 b0 轮廓上的劣角顶点，在偏置过程中如果我们采用矩形衔接(Square)的方式，那么在 b1
    曲线的对应位置上将生成 2 个劣角顶点；在对 b1 进一步偏置得到的 b2 曲线上，在相应位置上将生成 4 个劣角顶点……以此类推，在对劣角顶点的连续偏置过程中，在局部区域，偏置曲线顶点数量相对于上一条曲线会成倍增加，而这种顶点数量的增加对偏置轮廓精度的提升是没有意义的，反而会增加后续运算时间。如果采用圆弧衔接(Round)的方式，那么偏置曲线上劣角顶点的数量将会呈爆炸式增长。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_184_0.png)


    图 8.23 连续偏置中劣角顶点数量快速增长


    二是偏置轮廓精度的下降。这点是我们在实践过程中发现的，尽管 Clipper 布尔偏置算法很强大，但它还是无法生成完美的偏置曲线。在由 Clipper 生成的偏置曲线上，可能保留了一些轮廓裁剪的印记，导致偏置曲线在局部区域的微小扰动(如局部微小尖角)。但从几何上考虑，这种扰动本身在当前偏置曲线上不会造成什么影响，但是在对当前偏置曲线的连续偏置过程中，这种扰动就可能会被逐渐放大，直至影响偏置轮廓精度。当然我们可以在扰动首次产生时对轮廓进行修复，但对扰动的识别和消除并不那么容易。


    为了弥补以上两个缺陷，这里我们选择以边界轮廓为主体，对其进行多次偏置以生成连续偏置曲线。即在图 8.22 中，每次偏置都是以 b0 为原始曲线，如 b1 曲线是对
    b0 曲线偏置 Ω/2 距离得到的偏置曲线，b2 曲线是对 b0 曲线偏置 3Ω/2 距离得到的偏置曲线……以此类推，bk 曲线是对 b0 曲线偏置(2k-1)
    Ω/2 距离得到的偏置曲线。采用这种连续偏置策略其实是一种妥协，它的缺陷是所有偏置曲线只跟随边界轮廓 b0 的形状，相邻偏置线之间形状关联性较小，这样，当喷头沿着相邻偏置线打印后，可能在部分区域留下相互重叠或存在缝隙的丝材。


    最后，我们需要确定轮廓上劣角顶点在偏置过程中的衔接问题。根据我们在上一节的介绍，Clipper 库提供了 3 种劣内角衔接方式，如图 8.16，它们分别是：圆弧衔接、矩形衔接和斜角衔接。其中圆弧衔接得到的偏置轮廓精度最高，矩形衔接精度次之，斜角衔接精度最差；但圆弧衔接得到的偏置曲线顶点数最多，矩形和斜角衔接顶点数次之。这
    3 种衔接方式各有优缺点，很难取舍，特别是圆弧衔接和矩形衔接两种方式，为了保证路径生成的灵活性，我们在生成偏置路径时，将这 3 种方式都作为可选衔接方式。但默认情况下，我们推荐使用矩形衔接方式。


    解决了以上几个问题后，接下来我们将应用 ClipperAdaptor 类生成指定打印区域边界轮廓的连续偏置曲线。我们把这部分功能封装在 GenCpPath
    类中( 对应 GenCpPath.py 文'
  merge: -1
  img_proc: true
- pgno: 185
  md: '件)，类名为 generate contour – parallel toolpath 的缩写，意思是生成轮廓平行路径。GenCpPath 类中连续偏置曲线生成部分的实现代码如下：


    | GenCpPath.py | 偏置路径生成与连接:连续偏置路径生成 (offset) | 8-7 |

    |---|---|---|

    | 1 | ...... | # 导入相关库 |

    | 2 | class GenCpPath: | # 定义 GenCpPath 类 |

    | 3 | def __init__( self , boundaries , interval , shellThk ) : | # 输入：轮廓、偏置距离、填充带宽
    |

    | 4 | self.boundaries = boundaries | # 打印区域边界轮廓 |

    | 5 | self.interval = interval | # 工艺参数：偏置距离(喷头直径) |

    | 6 | self.shellThk = shellThk | # 工艺参数：填充带宽(外壳厚度) |

    | 7 | self.arcTolerance = 0.005 | # 工艺参数：圆弧精度 |

    | 8 | self.jointType = JT_SQUARE | # 工艺参数：衔接类型 |

    | 9 | self.offsetPolys = [] | # 临时存储的中间偏置曲线列表 |

    | 10 | self.paths = [] | # 最终输出的轮廓平行路径列表 |

    | 11 | self.offset() | # 调用连续偏置路径生成函数 |

    | 12 | self.linkLocalOffsets() | # 调用路径连接函数 |

    | 13 | def offset( self ) : | # 定义连续偏置路径生成函数 |

    | 14 | ca = ClipperAdaptor() | # 定义 Clipper 适配器对象 |

    | 15 | ca.arcTolerance = self.arcTolerance | # 设置圆弧精度(使用圆弧衔接) |

    | 16 | delta = self.interval / 2 | # 首次偏置距离 |

    | 17 | polys = ca.offset( self.boundaries , -delta , self.jointType ) | |

    | 18 | self.offsetPolys.append( polys ) | # 偏置曲线存放在 offsetPolys 中 |

    | 19 | while math.fabs( delta ) < self.shellThk : | # 循环直至偏置距离大于填充带宽 |

    | 20 | delta += self.interval | |

    | 21 | polys = ca.offset( self.boundaries , -delta , self.jointType ) | |

    | 22 | if polys is None or len( polys ) == 0: break | # 已到偏置区域中心，则退出 |

    | 23 | self.offsetPolys.append( polys ) | |

    | 24 | def linkLocalOffsets( self ) : pass | # 定义路径连接函数 |


    我们来看一下以上代码。在 GenCpPath 类的初始化函数中，我们输入的是表示打印区域的边界轮廓 boundaries、偏置距离 interval 和填充带宽
    shellThk 三个参数，其中偏置距离就是喷头直径，填充带宽类似于打印后模型的表皮或外壳厚度，这两个参数是和三维打印工艺直接相关的参数，即工艺参数。除此之外，在
    GenCpPath 类中，我们还定义了圆弧精度和劣角顶点衔接类型两个工艺参数，默认情况下，圆弧精度为 0.005 毫米，劣角顶点采用矩形方式衔接。事实上，我们在
    ClipperAdaptor 类中已经定义过两个同名参数( 属性 )，尽管它们的默认值一致，但在类中定义这两个参数单纯是出于几何上的考虑，而在 GenCpPath
    类中定义这两个参数是出于工艺上的考虑，两者的层次不同。


    我们在 GenCpPath 类中定义了两个函数，Offset 和 LinkLocalOffsets，分别用于连续偏置路径的生成和连接，但在这一小节我们只实现了
    Offset 函数，LinkLocalOffsets 函数将在下一小节实现。在 offset 函数中，我们首先定义了一个 ClipperAdaptor 类的对象
    ca，随后设置了 ca 的圆弧精度为指定值，这一步操作事实上仅当劣角顶点衔接类型为圆弧衔接时才有效。然后我'
