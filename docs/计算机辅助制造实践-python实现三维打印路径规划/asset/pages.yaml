- pgno: 62
  md: '此外，如果对 VTK 足够熟悉，还可以根据 VTK 组件自定义一些数据源。


    在获得数据源后，我们可以像在 Hello VTK.py 中的代码一样，直接将数据源连接到映射器（mapper）对象上，代码如下：


    | | 映射器和数据源连接 | 3-3 |

    |---|---|---|

    | 1 | mapper = vtk.vtkPolyDataMapper() | # 创建 mapper 对象 |

    | 2 | mapper.SetInputConnection(stlReader.GetOutputPort()) | # mapper 和 source
    连接 |


    或许在此之前我们还想对数据源进行进一步处理，这时我们就可以将数据源连接到一个过滤器（filter）对象上。


    比如对以上提到的 STL 模型，如果我们想从中提取模型的包络矩形边框，就可以将模型数据源连接到一个 vtkOutlineFilter 的对象上，代码如下：


    | | 过滤器和数据源连接，映射器和过滤器连接 | 3-4 |

    |---|---|---|

    | 1 | outlineFilter = vtk.vtkOutlineFilter() | # 创建 filter 对象 |

    | 2 | outlineFilter.SetInputConnection(stlReader.GetOutputPort()) | # filter 和
    source 连接 |

    | 3 | mapper = vtk.vtkPolyDataMapper() | # 创建 mapper 对象 |

    | 4 | mapper.SetInputConnection(outLineFilter.GetOutputPort()) | # mapper 和 filter
    连接 |


    在以上两个代码中，source 对象通过 GetOutputPort 获取端口后和 mapper 或 filter 对象连接，mapper 或 filter
    通过 SetInputConnection 函数设置连接端口。


    类似的，filter 对象也通过 GetOutputPort 获得端口后和 mapper 对象连接。这里的端口可以理解为实际对象的一个句柄或引用（指针），因为几何对象可能包含大量数据（比如一个
    STL 模型可能包含几十兆甚至上百兆数据），在对象流转过程中如果直接传递对象本身，将消耗大量的时间和内存空间，采用端口传递可以避免这样的问题。


    映射器的作用是将数据对象映射成图像对象，在以上代码中，我们使用了 vtkPolyDataMapper 映射器，这是为了和 STL 模型数据源相匹配，在 VTK
    中，PolyData 一般表示由点、线、三角形、多边形等组成的离散几何拓扑结构，此外，VTK 中还有 vtkGraphMapper、vtkImageMapper
    等映射器类。


    在获得映射器对象后，我们可以进一步创建演员（actor）对象，代码如下：


    | | 演员和映射器连接 | 3-5 |

    |---|---|---|

    | 1 | actor = vtk.vtkActor() | # 创建 actor 对象 |

    | 2 | actor.SetMapper(mapper) | # actor 和 mapper 连接 |


    演员对象是场景中显示的几何实体，它和映射器对象关联较为简单，只需调用 SetMapper 函数即可。vtkActor 类中有一个 GetProperty 函数，可以返回
    vtkProperty 类型的对象。


    通过这个对象，我们可以修改 actor 在场景中的外观属性，如实体绘制形式（points、wireframe、surface）、颜色、环境光、散色光、透明度、材料、纹理、边线颜色、顶点颜色、边线线宽等，参考代码如下：'
