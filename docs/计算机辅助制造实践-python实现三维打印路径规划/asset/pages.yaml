- pgno: 285
  md: '这种粒子是普通粒子的伴随粒子，和普通粒子存在一一对应的关系，数量与普通粒子相当；第三种是全局极值粒子 GP，这种粒子全局只有一个。根据粒子群算法基本原理，每个普通粒子
    Pi 都有向对应的个体极值粒子 LPi 以及全局极值粒子 GP 靠近的趋势。在取消了粒子速度项，仅保留粒子位置项的情况下，我们可以使用下式来描述普通粒子向个体极值粒子和全局极值粒子的靠近趋势：


    $P_i(t + 1) = p \cdot P_i(t) + q \cdot L P_i(t) + r \cdot GP$


    式中，i 为粒子序号，t 为迭代次数，p、q、r 为各粒子权重系数，取值范围为 [0, 1] 随机数，且满足：


    $p + q + r = 1$


    其中，p 为粒子的惯性系数，是粒子实现自我价值的体现，q、r 分别为粒子向个体极值和全局极值进化的学习因子。p、q、r 具体可由下式计算：


    $$\begin{cases} p = \frac{r_1}{r_1 + w_L \cdot r_2 + w_G \cdot r_3} \\ q = \frac{w_L
    \cdot r_2}{r_1 + w_L \cdot r_2 + w_G \cdot r_3} \\ r = \frac{w_G \cdot r_3}{r_1
    + w_L \cdot r_2 + w_G \cdot r_3} \end{cases}$$


    式中，r1、r2、r3 为三个随机数，取值范围一致；wL、wG 也是两个随机数（权重系数），取值范围均为 [0, +\infty)，用来调节个体极值和全局极值的相对重要性。注意，式
    (10-11) 和式 (10-13) 涉及双重嵌套随机权重，总体而言，式 (10-11) 中 p、q、r 三个权重系数的相对关系是由 wL、wG 两个权重系数决定的，它们之间的比例关系为
    p : q : r = 1 : wL : wG。


    我们来看一下式 (10-11) 的几何和进化意义。如图 10.25 所示，如果新的粒子 Pi(t+1) 由式 (10-11) 计算得到，且满足式 (10-12)，那么在转角坐标系平面上，Pi(t+1)
    必然落在由 Pi(t)、LPi(t)、GP 三点确定的三角形内（包括边界）。这点非常有意义，预示着如果 Pi(t)、LPi(t)、GP 三个粒子都在正方形定义域内，那么新粒子
    Pi(t+1) 也必然落在定义域内，即在迭代过程中，粒子总是合法、安全的。从进化的角度来说，如图 10.25 所示，相较于 Pi(t)，新的粒子 Pi(t+1)
    确实是朝着个体极值和全局极值靠近的。根据以上分析，无论是从几何角度还是进化角度，式 (10-11) 都是有意义的。


    尽管如此，式 (10-11) 仍然有一定的局限性。从几何上来说，如图 10.25 所示，一方面，我们希望新的粒子 Pi(t+1) 被控制在由 Pi(t)、LPi(t)、GP
    三点确定的三角形内，以保证粒子在迭代过程中不越界；另一方面，我们可能又希望这种控制规律最好不要一成不变，以免每轮迭代中粒子都无法“跳”出上述三角形，造成陷入局部最优而无法自拔的情形。在这种情况下，我们不妨借鉴一下遗传算法中基因变异的概念，给定一定概率，让粒子发生变异。从进化的角度来说，变异的作用是制造多样性基因。


    那如何控制粒子的变异位置，以保证变异后粒子仍在定义域内，且在 Pi(t)、LPi(t)、GP 三点确定的三角形外呢？我们发现，如果要严格控制变异后的粒子落在上述三角形'
