- pgno: 93
  md: '# 第 5 章 STL 模型截交计算优化


    # 引言


    在上一章中,我们将主要精力放在对 STL 模型切片流程的详细介绍上,输出了包含一系列封闭轮廓的切片数据。针对一些关键步骤,如 STL 模型截交和截交线段拼接,均使用了暴力算法。暴力算法虽然直观、简单,易于实现且具有良好的稳定性,但算法执行效率低。当模型包含极少面片或切片层数不多时,暴力截交法勉强能够胜任;但当模型包含数万、数十万甚至上百万个面片时,暴力法耗费的时间将呈平方量级增长,这在实践中往往是难以忍受的。在本章中,我们将针对
    STL 模型截交这一问题进行深入研究,设计两种优化算法,力求降低截交运算量。


    # 5.1 暴力截交存在的问题


    STL 模型截交的本质就是用一系列层高已知的平行平面和 STL 模型求交,计算并保存得到的截交线段以备后续使用。在使用暴力截交算法时,对每张截平面,我们会遍历整个
    STL 模型中的所有三角面片,调用我们之前在 GeomAlgo 模块中已经实现了的平面和三角面片的基础求交函数( intersectTriangleZPlane
    )计算截交线段。如果 STL 模型中有 100 万个三角面片,那么一张截平面一次截交就要调用 100 万次求交函数。为了加深读者的直观感受,我们用之前写的
    Python 代码进行了实际测试,测试用主机 CPU 型号为 intel Core i7-8700 @ 3.20GHz,内存大小为 24GB。对于一个拥有约
    45000 个三角面片的 STL 模型,在切片厚度为 0.1 毫米,切片层数为 2202 层的情况下,使用暴力法消耗的截交运算总时间约为 107 秒钟。在三维打印中,拥有
    4 万多面片的 STL 模型不算大,而对于面片规模更大的模型,使用暴力法无疑将消耗更多的时间。


    然而,在使用暴力法截交的过程中,大部分求交计算可能都是无用的。对于某一指定高度的截平面,它和模型中多数三角面片的相对位置决定了它们之间根本就不可能相交,如图
