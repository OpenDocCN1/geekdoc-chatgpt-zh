    # 图 9.14 投影配对上下层线段失败案例


    我们将遭遇的第二个问题是和当前填充线段配对连接的线段可能不存在。假设我们已经很好地解决了以上第一个问题，现在我们去连接图 9.13 左下方局部区域内的填充线段。我们从
    I 点连入，可以轻松地将 IJ、KL、MN、OP、QR 这 5 条线段以 zig-zag 的方式串在一起；但是，当连到 R 点时，我们发现自己陷入了僵局：QR
    的下一条线段是哪个？从表面上看，QR 的下一条线段应该是 UV，但是如果我们去连接图 9.13 右下方局部区域内的填充线段，我们会发现，UV 同时可能又是
    ST 的下一条线段。一条线段同时和两条线段配对，这样的逻辑似乎有点混乱！此时，我们定义 QR 和 ST 的下一条线段都不存在，即对局部区域内填充线段的连接到此为止。这样定义的后果是我们无法将整个填充区域内的所有线段连成一体，但除此之外，我们没有更好的办法。


    对形状完全相同的两个多边形区域，我们可以将图 9.12 中的填充线连成一体，却无论如何都无法将图 9.13 中的填充线连成一体，这到底是为什么呢？如果我们稍微观察图
    9.12 和图 9.13 两图中两多边形内部的填充线段，同时结合扫描线原理，就会发现：在图 9.12 中，一条扫描线上只存在一条填充线段；而在图 9.13
    中，一条扫描线上可能存在若干条填充线段。对前一种情况，我们可以形象地称扫描线被多边形轮廓切割成了一段；对后一种情况，我们称扫描线被多边形轮廓切割成了多段。不难想象，在图
    9.13 中，如果我们把位于同一扫描线上的线段间的缝隙（位于区域外部）补全，那么我们照样可以轻松地将所有线段以 zig-zag 的形式连成一体。


    由此可见，一个封闭区域内部的所有填充线能否连成一体和该区域内扫描线被切割得到的段数有关。如果这个区域内所有扫描线均被切割成一段，那么得到的所有填充线'
