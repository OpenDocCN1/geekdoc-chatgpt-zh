    lp6] 】。其中（x0，y0）是由 1 号点和 6 号点的共同坐标所组成的元组，它是字典中的键；lp1 和 lp6 分别为 1 号和 6 号链接点，[lp1,
    lp6] 为保存了两链接点的列表，它是字典中的值。以上字典只有 1 个元素，如果该字典保存了多个元素，我们可以通过坐标（x0, y0）查询得到列表 [lp1,
    lp6]。从字典中通过键来查询值的速度是非常快的，查询的时间复杂度为 O (log(n))，其中 n 为字典中的元素总数。


    需要说明的是，这里我们使用了二维坐标作为字典的键，这是因为在面向三维打印的截交线拼接问题中，线段都是落在同一高度的 XY 平面上的，即线段端点的 Z 坐标总是相等，因此我们可以直接省略掉点的
    Z 坐标，这完全不影响字典的查询结果，反而会加快查询速度。在其他应用背景下，如果线段端点可能落在不同高度，那么我们也可以把 z 坐标放上去，共同作为字典的键。


    回到刚才的问题，现在我们结合 { (x1, y1) : [lp1, lp6] } 字典来分析一下如何从 1 号点定位到 6 号点。从 0 号点开始，根据 0
    号点的 other 我们能立刻定位到 1 号点，然后我们可以把 1 号点的 X 和 Y 坐标提取出来，构成 (x, y) 元组；根据这个元组我们可以从字典中查询得到对应的
    [lp1, lp6] 列表，但这个列表中的两个元素是无序存储的；接下来我们可以通过比对 1 号点和 [lp1, lp6] 中元素的指针地址（Python 中为
    id）来找出 6 号点。通过以上步骤，我们成功从 1 号点定位到 6 号点。


    同理，假设现在字典中有两个元素，变成 { (x1, y1) : [lp1, lp6] , (x2, y2) : [lp7, lp2] } ，此时我们可以通过
    0 号点开始依次找到 1 号点、6 号点、7 号点、2 号点和 3 号点。如果我们把平面上所有重合点都按照以上形式放到字典中，我们就可以非常快速地将一条条轮廓线找出来。那么，剩下的问题就是如何构建字典了。


    对平面上的 M 条散乱线段 segs，将其转化为字典 dic 存储的步骤如下：


    +   (1) 遍历列表 segs，从 segs 中取出当前线段，记为 seg。

    +   (2) 根据 seg 构建两个链接点 lp1 和 lp2，并对两点中的 other 属性相互赋值。

    +   (3) 将 lp1 添加到 dic 中以元组 (lp1.x, lp1.y) 为键的点列表中。

    +   (4) 将 lp2 添加到 dic 中以元组 (lp2.x, lp2.y) 为键的点列表中。

    +   (5) 跳至步骤 (1)，直至遍历结束。'
