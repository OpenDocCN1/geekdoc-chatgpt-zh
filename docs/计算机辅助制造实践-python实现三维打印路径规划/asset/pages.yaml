- pgno: 114
  md: '# 6.3 字典序排序法拼接优化


    在现实生活中，我们可能经常需要处理那些包含大量同类型元素的优化问题，针对这些问题，暴力遍历所有元素可能消耗大量的运算时间，不太可取。先对这些元素进行排序可能会是一个不错的选择，这也许会激发我们进一步解决问题的灵感。我们在前面章节处理
    STL 模型截交问题时已经做过这样的尝试，通过对三角面片最低点进行排序，实现了扫描平面快速截交算法，取得了非常不错的效果。在处理同一平面上大量截交线段的拼接问题时，我们也可以先对这些线段进行排序。更进一步，当我们把线段转化为
    LinkPoint 对象后，我们可以考虑先对这些链接点进行排序。但是点不能像实数一样进行大小比较，那么该如何对它们进行排序呢？


    # 6.3.1 点的字典序


    我们从小就学会了查字典，这的确是一项非常有用的技能。尽管有了电脑之后我们可能很少使用字典，但这项技能也不会丢失。以前，当我们碰到一个不熟悉的英语单词时，我们会去找一本厚厚的英文字典，并根据这个单词中的字母排列情况定位这个单词，最终得到释义。那么，为什么查字典能够这么方便和高效？事实上，这和单词在字典中的排列顺序有关。


    在字典中，所有的单词都是按一种被称为“字典序”的顺序排列的。如果单词中只有一个字母，那么这些单词将按照 a~z 的顺序排列，比如 a 在 b 的前面（记为
    a < b），b 在 c 的前面（记为 b < c）等。如果单词由一个或两个字母组成，那么这些单词先按照第一个字母排序，如果第一个字母相同，则继续按照第二个字母排序，比如
    ab < b，ab < ba，ab < ac 等。同理，如果单词由一个、两个或三个字母组成，那么这些单词先按照第一个字母排序，如果第一个字母相同，则按照第二个字母排序，如果第二个字母也相等，则按照第三个字母排序，比如
    abc < bc，a < bcd，abc < acd 等。以此类推，我们可以按照这种规则对字典中所有的单词进行排序，每个单词也总能在字典中找到一个合适的位置。


    那么，我们可否按照字典序对三维空间中的点集进行排序呢？我们可以把点的坐标数值转化为字符串，然后对字符串进行排序。比如对点 P1 (1.1, 2.2, 3.4)
    和 P2 (1.1, 3.4, 4.5)，我们可以将两个点的坐标分别格式化为 “112234” 和 “113445” 字符串，然后对两个字符串按 ASCII
    码顺序的字典序排序，最终可以得到 P1 < P2。但这样做没有任何几何意义。而且，如果按照这种方法排序，点坐标值的波动对排序结果影响极大。比如 P2 坐标变为
    (1.10, 3.4, 4.5)，这样的变化根本不会改变 P2 的几何意义，但此时排序的结果将变为 P2 < P1，这是不应该发生的。


    事实上，我们不必照搬针对字符串的字典序排序方法，但我们可以做一些小小的改动，将一个点在一个方向上的坐标值看成是一个字符。对任意两个点 P1(x1, y1,
    z1) 和 P2(x2, y2, z2)，我们可以首先比较两个点的 X 坐标：如果 x1 < x2，那么 P1 < P2。但是如果 x1 = x2，我们再比较两个点的
    Y 坐标：如果 y1 < y2，那么 P1 < P2。但是如果 y1 = y2，我们再比较两个点的 Z 坐标：如果 z1 < z2，那么 P1 < P2。通过这种比较方式，即便
    P1、P2 坐标发生'
