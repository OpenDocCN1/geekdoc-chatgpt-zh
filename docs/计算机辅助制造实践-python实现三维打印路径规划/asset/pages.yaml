    $E = \frac{3}{2}F$ (7-2)


    如果觉得式(7-2)不好理解，我们不妨大胆发挥想象，将一条边拆成两个半边，其中一个半边属于一个三角形，另外一个半边属于另一个三角形，这样半边总数必然是 3F；然后我们再考虑将两个半边合并成一条边，这样就可以得到总边数为
    1.5F。如果我们记 STL 模型中实际的顶点数为 Vact，那么显然


    $V_{act} = 3F$ (7-3)


    根据式(7-1)和(7-2)可得


    $V = 2 + \frac{1}{2}F$ (7-4)


    式(7-4)中的 V 表示理论所需的顶点数。进而我们可得：


    $\frac{V_{act}}{V} = \frac{6F}{4 + F}$ (7-5)


    由式(7-5)可知，当 F = 6 时，Vact / V = 3.6，这就是图 7.1 中模型的情况。对一般情况，当面片数 F 远大于 4 时，此时分母中的常数
    4 可以忽略不计，那么 STL 模型中实际顶点数是理论上所需顶点数的 6 倍。这意味着什么？意味着 10MB 的模型数据，如果保存成 STL 格式，可能需要
    60MB 的存储空间。


    除了顶点冗余问题外，STL 模型的另一个问题是模型中面片与面片、面片与棱边、棱边与顶点等各几何元素之间的“相邻”关系是不明确的。具有相同坐标的顶点平均被保存了
    6 次，每个顶点隶属于不同的三角面片、不同的棱边。面片与面片之间相互独立，信息通道完全被隔绝，我们没有办法从当前面片快速定位到与之相邻的面片，除非我们进行遍历搜索，但那样做将消耗大量的时间。


    我们不妨发挥想象，假设现在我们可以从当前面片查询相邻面片，我们能做什么？也'
