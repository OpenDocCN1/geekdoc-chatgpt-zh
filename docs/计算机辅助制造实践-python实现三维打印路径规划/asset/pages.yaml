  md: '# 第 6 章 截交线段拼接计算优化


    # 引言


    针对三维打印路径规划中涉及的算法优化问题，我们在上一章已经做了非常不错的尝试，成功设计并实现了两种原理截然不同的截交优化算法，得到了令人鼓舞的结果。这一章，我们将在上一章工作的基础上，对得到的无序离散截交线段进行拼接，生成一系列封闭的轮廓线。事实上，关于截交线段拼接的问题我们在第
    4 章已经有所阐述，并在那时提出了一种暴力拼接法，显然，暴力法不是我们想要的。在这一章，我们将对离散线段的拼接问题展开进一步探索和研究，设计两种优化拼接算法，希望能够大幅提高线段拼接效率。


    # 6.1 暴力拼接存在的问题


    我们先来回忆一下截交线段的拼接问题。当我们用一张平面和一个 STL 模型做相交计算时，由于三角面片在 STL 模型中存储的无序性，最终落在该平面上的截交线段序列也必然是散乱无序的。我们不能直接拿线段序列中的第
    1 号线段和第 2 号线段进行拼接，因为这两条线段在平面上可能不相邻，甚至不在同一个轮廓中(参见图 4.6)。


    截交线段的拼接问题可以抽象为:对同一平面上 N 条散乱无序的线段序列,将其首尾相连成 M 条多段线。显然这里 M ≤ N,如果 M = 1,则所有 N 条线段都将拼接到同一条多段线上;如果
    M = N,则 N 条线段中不存在首尾重合的两条线段。对三维打印这一具体应用来说,最终拼接得到的多段线应该还需满足首尾相接的要求,即它们应该是闭合的。


    对以上拼接问题,最为简单而且容易实现的方法当然是暴力拼接法。我们已在第 4 章对该方法有过介绍,它的基本原理是:对于当前拼接过程中的多段线,遍历线段序列,搜索能和当前多段线端点(起点或终点)重合的那条线段,如果能够找到线段,我们只需将该线段拼接到多段线上;如果找不到线段,则对当前多段线来说,拼接过程结束。


    暴力拼接法之所以暴力,是因为它在最优的情况下,仍需要经历 n(n+1)/2 次搜索和坐标比对,其中 n 为线段序列中的线段数量,即暴力截交法的时间复杂度为
    O(n²)。在我们实际测试例中,对如图 5.8 所示的 monk 模型(面片数为 336974),当切片层厚为 0.2 毫米、切片层数为 877 层时,使用扫描平面法所需的截交时间约为
    21 秒钟(参见表 5.1),得到的各层截交线段总数为 866540 条,平均每层线段数约 988 条。对这些层上的截交线段,使用暴力法进行线段拼接的总时间约为
    975 秒钟,超过 16 分钟,平均每层拼接时间超 1.1 秒钟。暴力拼接所需的时间和截交所需的时间极不对等,对同一模型,如果层厚更加细密,层数更多,那么拼接时间将更长。'
