- pgno: 252
  md: '里轮廓路径可以少用甚至不用。如图 10.5(a) 所示,对相邻上下两层切片,我们可以设置其填充角度差为 0 度或 90 度。当填充角度差为 90 度(交叉填充)时,上下两层填充材料可以形成编织效果,支撑不易倒塌。但需要注意的是,当填充角度差为
    0 度(同向填充)时,如图 10.5(b) 和 10.5(c) 所示,我们有必要在平行路径外围添加若干圈轮廓路径以加固支撑,否则支撑容易倒塌。相对于 STL
    模型部分的填充路径,支撑部分的填充路径可以设置得更为稀疏,这样做一方面可以节省打印材料和打印时间,另一方面也可降低支撑强度,使其更容易从工作台或模型上剥离。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_252_0.png)


    以上我们简单介绍了针对三维打印的支撑生成过程,包括模型上悬臂结构及危险面片的识别、支撑空间区域确定以及支撑填充路径生成等。为识别模型上的悬臂特征,我们定义了一个重要的判定危险面片的临界角度
    $\theta_0$。当模型上面片和水平面夹角大于 $\theta_0$ 时,认为该面片是安全面片,无需添加支撑,反之认为该面片为危险面片,需要添加支撑。事实上,真正的三维打印模型支撑生成过程远比上述过程复杂,下面我们首先介绍支撑空间区域的识别方法。


    # 10.2 支撑区域识别


    在上一小节中,我们尝试以一种让人容易理解的方式解释了三维模型上支撑区域的识别方法,即首先遍历找出模型上所有危险面片,然后合并相邻危险面片,最后对合并面片竖直投影得到需要添加支撑的空间区域。这种方法虽然原理简单,但实施难度极大,如设计面片合并算法、面片投影算法等都可能需要耗费较大精力。


    本节我们将介绍一种更容易实施的三维模型支撑区域生成方法,这种方法的核心思想可以描述为:使用一条沿着竖直方向(即沿 Z 方向)的直线去截交三维模型及其底面(指过模型最低点的一张水平面),如图
    10.6 所示,并对得到的交点沿直线方向从下到上排序;非常直观地,位于偶数和奇数序号交点之间的线段可以看作是模型在此处需要添加的支撑(图中 0 到 1 号点之间的线段,2
    到 3 号点之间的线段),我们不妨称这种线段为支撑线段。基于这种思想,理论上,我们只要在模型所在的空间范围内无限增加截交直线数量,就可以找出模型上的所有支撑线段,从而准确地确定模型上需要添加支撑的空间区域。在实际操作中,无限增加截交直线的数量是不可能的,但我们可以采用离散思想,在模型所在的
    XY 平面范围内生成均匀网格,并在网格节点处布置竖直截交直线,这样我们就可以通过控制平面网格尺寸的方式控制截交直线的密度,从而控制支撑区域的精度。以下'
