    0 时，我们很容易理解轮廓上的局部最高点或最低点就是峰值；但当扫描线倾角非 0 时，局部最高点和最低点应从扫描线的法线方向考虑和计算，如图 9.19 所示。从这个角度来说，我们发现式(9-12)也同样适用于扫描线倾角非
    0 的情况。综上所述，在填充倾角非 0 的情况下，对区域轮廓上的任意一点 $P_k$，如果它同时满足式(9-9)和式(9-12)，则 $P_k$ 为凹峰点。


    那我们如何根据凹峰点切分多连通区域呢？基于以上讨论，我们只要遍历区域轮廓上的所有顶点，就能从中找出所有凹峰点，然后我们可以根据这些凹峰点构造切分直线。如图
    9.20 所示，对图中给定的多连通区域和填充方向，我们可以找出 3 个凹峰点，分别记为 $P_1, P_2, P_3$，并记 $l_1, l_2, l_3$
    为分别对这三个点的切分直线。在图 9.20 中，我们发现，过每个凹峰点的切分直线不能太长，否则会对原多连通区域带来一些不必要的分区。'
