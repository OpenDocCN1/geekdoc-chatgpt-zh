    16 | con.write(line)       # 发送一行代码

    17 | readToOk(con)         # 读取串口直至"ok"

    18 | codeFile.close()      # 关闭文件

    19 | con.close()           # 关闭串口连接

    ```


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_317_0.png)


    # 图附 1.2 上位机控制程序基本流程


    在以上代码中，我们首先导入了一个名为 serial 的串口库。这是一个第三方库，如果没有安装过，我们需要使用“pip install pyserial”命令进行安装。在
    main 函数中，我们首先创建了一个串口连接对象 con。在连接串口之前，我们需要确保三维打印机已连接至上位机电脑，建立连接之后的串口号可以在 Windows
    系统的设备管理器中查看（如果用的是 Windows 系统）。这里我们在程序中设置的串口号为“COM3”，波特率为 115200。对 Marlin 固件，三维打印机控制器一旦和上位机建立串口连接，就会向上位机发送控制器的自身信息，如设备信息、固件版本、制造商信息等，最后以“ok”结尾。因此在建立串口连接后，我们有必要循环读取串口，直至“ok”。为此，我们专门写了一个
    readToOk 函数，它的作用就是循环读取串口，直到读到“ok”字符串。


    接下来我们对串口写了“G28\n"指令，强制打印机回零。注意，在“G28”后面必须加上‘\n’字符，否则打印机将不会执行回零操作。每次向打印机发送以‘\n’结尾的指令后，我们都需要调用
    readToOk 函数，以确保串口返回“ok”。随后我们指定并打开 G 代码文件，循环读取文件中每行代码并将每行代码通过串口发送给打印机，同时读取串口返回，直至
    G 代码文件末尾。最后关闭文件，关闭串口连接，打印完成。'
