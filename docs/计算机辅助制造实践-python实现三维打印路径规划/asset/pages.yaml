  md: "```\ndef genRawSptRegions( self, pts ):\n    rects = []\n    for pt in pts:\n\
    \        rects.append( self.pointToRect( pt, 1.1 * self.gridSize, 1.1 * self.gridSize\
    \ ) )\n    clipper, ca = Pyclipper(), ClipperAdaptor()\n    clipper.AddPaths(\
    \ ca.toPaths( rects ), PT_SUBJECT )\n    sln = clipper.Execute( CT_UNION, PFT_POSITIVE\
    \ )\n    return ca.toPolys( sln, pts[ 0 ].z )\n\ndef pointToRect( self, pt, lx,\
    \ ly ):\n    vx, vy = Vector3D( lx/2, 0 ), Vector3D( 0, ly/2 )\n    rect = Polyline()\n\
    \    rect.addPoint( pt - vx - vy )\n    rect.addPoint( pt + vx - vy )\n    rect.addPoint(\
    \ pt + vx + vy )\n    rect.addPoint( pt - vx + vy )\n    rect.addPoint( pt - vx\
    \ - vy )\n    return rect\n```\n\n![](img/c3ab49ac4eb80e7a0a66462a29869ca2_266_0.png)\n\
    \n图 10.16 切片支撑点生成平面支撑区域原理\n\n在以上代码中，我们定义并实现了两个函数，genRawSptRegions 和 pointToRect。其中后者是前者的依赖函数，它的作用是在\
    \ XY 平面上以给定点为中心生成一个轴平行矩形，在它的三个输入参数中，pt 为给定点，lx 和 ly 分别用于指定矩形在 X 和 Y 方向上的边长。为了配合\
    \ Clipper 库的数据结构，在 pointToRect 函数中，我们将矩形定义为一个拥有 5 个顶点且首尾点重合的多段线( Polyline )，各个顶点呈逆时针分布。\n\
    \n我们再来看一下 genRawSptRegions 函数。它的输入为 pts，即切片支撑点序列，该数据具体可通过调用 calcLayerSptPoints\
    \ 函数获取；输出为当前截平面上的( 初始 )支撑区域。借助 Clipper 库，我们发现，该函数的实现过程非常简单！首先根据输入的 pts 生成平面矩形序列\
    \ rects，然后通过 Clipper 库对 rects 序列进行布尔并运算，最终返回表示支撑区域的"
