    # 10.2.1 模型投影网格生成


    在 XY 平面上的模型投影网格生成是整个三维打印支撑生成流程的首要步骤，相对来说，这也是最简单的步骤。对任意一个给定的三维 STL 模型，我们可以调用之前已经实现的
    getBounds 函数（参见 StlModel 模块代码）轻松获取模型在 X、Y 两个方向上的极限坐标 x_min、x_max 以及 y_min、y_max。根据这些数值，在
    XY 平面上，我们可以构建模型的轴平行包络矩形，如图 10.7 所示，注意，这里轴平行是指矩形的各条边分别和坐标轴轴平行。


    接下来我们就可以对包络矩形进行网格划分。简单起见，我们不妨预设网格形状为正方形，且其边长为 a。网格划分完成后，我们希望所有网格恰好能够覆盖整个包络矩形，不多也不少。这里我们记包络矩形在
    X 方向的边长为 L_x，在 Y 方向的边长为 L_y，考虑到实际上我们很难保证 L_x 和 L_y 恰好都是 a 的倍数，为了达到上述目标，有必要对网格边长进行微调。具体地，在
    X 方向上，以网格预设边长 a 为基础，可得调整后边长（记为 a_x）为：


    $$a_x = \frac{L_x}{\text{int}(L_x/a) + 1}$$ (10-1)


    式中，int 为取整符号，如 int(7.6) = 7, int(8.1) = 8，即截取实数的整数部分；分母加 1 的目的是保证得到的边长 a_x 小于预设边长
    a。同理，在 Y 方向上，调整后边长（记为 a_y）为：


    $$a_y = \frac{L_y}{\text{int}(L_y/a) + 1}$$ (10-2)


    结合 x_min、x_max、y_min、y_max 及调整网格边长后得到的 a_x、a_y，我们可以计算图 10.7 中各网格节点坐标。非常简单地，如在
    X 方向上，各节点 x 坐标依次为：x_min、x_min + a_x、x_min + 2a_x, …,'
