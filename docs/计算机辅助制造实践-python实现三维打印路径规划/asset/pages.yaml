    p.other 找不到序号相邻的重合点时退出,这种退出是不正常的退出,此时得到的多段线是非封闭的,这并不是我们想要的。出现这种情况的原因可能有两个:一是输入的
    STL 模型本来就是非封闭的(有孔洞);二是 STL 模型中相邻面片间的缝隙过大,这些其实都是模型本身的问题。如果是因为第 2 个原因,我们可以首先收集这些非封闭的多段线,然后通过适当降低点的重合误差对这些多段线进行进一步拼接,因为这样的多段线数量必然不多,因此后期可直接使用暴力法进行拼接。


