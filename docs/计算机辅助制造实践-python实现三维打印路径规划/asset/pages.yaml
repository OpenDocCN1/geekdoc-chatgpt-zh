    # 9.5.3 顶点切线角度确定


    对连续可导轮廓上的某一点来说,它的切线方向固定,切线角度必然是一固定数值;但对离散轮廓上的某一顶点来说,它的切线角度是什么呢?


    如图 9.26 所示,对 XY 平面任意离散轮廓上的一个顶点 P,如果某一直线 l 经过顶点 P 但并不“穿过”由 3 点组成的局部轮廓 OPQ,那么我们定义直线
    l 为离散轮廓顶点 P 的切线,并且定义此时直线 l 和坐标系 X 轴正向的夹角为切线角度。


    根据以上定义,我们可以推断,首先,离散顶点的切线存在与否和顶点本身的凹凸属性无关,凹顶点可以有切线,凸顶点同样也可以有切线。其次,当直线 l 和 X 轴夹角在一定范围内变动时,l
    都可能是该顶点的切线,因此,离散顶点的切线角度表示的事实上是一个角度范围,我们记这个角度范围为 $\Psi$。


    如图 9.26 所示,我们记顶点 P 两邻边方向向量分别为 $v_1$ 和 $v_2$, 直线 l 的方向向量为 $v$, 又记 $v_1, v_2, v$
    和 X 轴正向的夹角分别为 $\alpha, \beta, \phi$。考虑到 $v_1, v_2$ 可能指向坐标系 4 个象限中'
