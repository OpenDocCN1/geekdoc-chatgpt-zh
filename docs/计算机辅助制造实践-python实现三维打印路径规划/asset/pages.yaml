  md: '理论上，对输入的三维模型，我们可以根据法向朝向判断一个面片是否落在端面上，但这样的判断对端面填充是毫无意义的，因为在切片过程中，模型上的端面信息无法传递到切片片数据。通过前面几章的介绍，我们已经能够对任意模型进行切片，生成一系列切片，下面我们不妨抛开模型本身，直接从已有切片数据出发，识别切片上的端面。


    # 11.1.1 端面密实填充区域提取


    我们首先来看下端面的识别。如图 11.2 所示，对任意封闭轮廓 c1、c2、c1、c2 分别位于相邻的第 i、i+1 层切片上（方便起见，在下面的叙述中，我们不打算对轮廓和切片层两个概念进行严格区分，即用轮廓表示切片层），图中阴影区域就是暴露在模型外需要被封闭填充的下端面。我们不妨记上述阴影区域轮廓为
    d，根据平面区域的布尔运算原理（参见图 8.14），很简单，我们只需对轮廓 c2 和 c1 做布尔差运算，即让 c2 减去 c1，就可得到轮廓 d，即


    d = c2 - c1 (11-1)


    需要说明的是，轮廓 c1、c2 并非位于同一平面上，在对两轮廓做布尔差运算时，需要忽略轮廓上点的 z 坐标；而对得到的差轮廓 d，需要对其 z 坐标进行取舍，使其落在
    c2 所在的平面上。进一步地，如果我们对轮廓 c1 和 c2 求交，或者让轮廓 c2 减去 d，就可求得 c1、c2 位于模型内部的重叠部分，即 d 关于
    c2 的互补轮廓，我们不妨记这部分轮廓为 d̄。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_297_0.png)


    如图 11.2 所示，通过布尔运算，我们将上层切片轮廓 c2 围成的区域分成了两个部分，一个为 d，另一个为 d̄。其中 d 就是模型下端面，必须进行密实填充；而对于
    d̄，为了节省材料，同时节约打印时间，可以进行稀疏填充。


    尽管如此，我们忽略了两个重要因素。其中第一个因素和填充路径形式有关。为了保证模型表面精度和整体打印效率，我们一般会在打印区域外围使用轮廓填充路径，而在区域内部使用平行填充路径。考虑到以上得到的两个区域
    d、d̄ 同属 c2，为了避免在工件表面出现轮廓拼接印记，在生成路径时，它们应该共用轮廓 c2 的偏置曲线作为轮廓填充路径。第二个因素和密实填充部分打印强度有关。如图
    11.2 所示，以上 d、d̄ 两个区域划分最不合理的地方在于没有为 d 留出一定的过渡区域，恰好在 d、d̄ 边界进行疏密填充切换并不十分理想，只会降低模型下端面强度，削弱其对上方材料的支撑作用。较为理想的密实填充边界应向
    d̄ 区域延伸一定的距离。'
