    \) 等 n 个切片层上的下端面密实填充区域。


    根据以上讨论，下面我们直接给出针对一个三维模型所有切片层的下端面密实填充区域分区函数。我们仍然将这个函数写在 IdEndLayers 模块中，函数名为 splitFfRegions，具体实现代码如下：


    | IdEndLayers.py | 定义所有切片层下端面密实填充区域寻找函数 | 11 - 4 |

    |---|---|---|

    | 1 ...... | | # 导入相关库,忽略其他代码 |

    | 2 def splitFfRegions(layers , shellThk , endLayerNum) : | | # 定义切片密实填充区分区函数
    |

    | 3 layers.insert(0, Layer(0)) | | # 在 0 层切片前插入一个空切片 |

    | 4 i, j = 0, 1 | | # 层序号,j > i,相邻层 |

    | 5 while True: | | # 第一重循环,遍历所有切片 |

    | 6 if j > len(layers) - 1: | | # 第一重循环退出条件 |

    | 7 break | | |

    | 8 while pickFfRegions(layers[i], layers[j], shellThk): | | # 第二重循环,建立端面厚度 |

    | 9 j = j + 1 | | |

    | 10 if j > len(layers) - 1 or j - i > endLayerNum: | | # 第二重循环到达 endLayerNum
    |

    | 11 break | | |

    | 12 i = i + 1 if j - i == 1 else j - 1 | | # 计算下一个需要遍历的 i |

    | 13 j = i + 1 | | # 计算下一个需要遍历的 j |

    | 14 del layers[0] | | # 删除之前插入的空切片层 |


    我们首先来看 splitFfRegions 函数的 3 个输入参数。其中 layers 为切片序列，该参数可对指定三维模型根据本书前几章介绍的切片方法进行切片得到；对
    shellThk，我们在上一小节已经给出解释，表示每层切片上的轮廓路径填充带宽，该参数将被输入 pickFfRegions 函数中；endLayerNum
    表示密实填充的端面切片层数，即公式（11-5）中的变量 n。


    在 pickFfRegions 函数的基础上,splitFfRegions 函数的实现流程变得非常简洁,主要包含两重循环。其中第一重循环的作用是从第 0,1
    层切片开始,调用 pickFfRegions 函数从下往上逐渐遍历切片序列 layers 中的所有相邻切片对。一旦在某层切片上发现端面,则开启第二重循环。第二重循环的作用是根据指定的端面切片层数
    endLayerNum 建立端面厚度,它有两个循环结束条件。其中第一个条件是在调用 pickFfRegions 函数时,如果发现 \( c_i \) 和 \(
    c_j \) 轮廓不存在下端面,此时第二重循环提前结束;第二个条件是循环到达指定的端面切'
