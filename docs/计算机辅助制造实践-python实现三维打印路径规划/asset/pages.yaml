- pgno: 221
  md: '段可以简单地以 zig-zag 的形式被连成一体，我们定义这种区域为“单连通”区域，对应的多边形为“单连通”多边形；如果这个区域内所有扫描线中存在一些扫描线被切割成多段，那么得到的填充线段将无法被连成一体，我们定义这种区域为“多连通”区域，对应的多边形为“多连通”多边形。


    试想，在生成填充线之前，我们能否将输入的多边形区域进行分区，使得得到的每个独立的子区域为单连通区域？如果这个想法可行，那我们就可以顺理成章地解决上下层填充线段的识别配对难题（即上文提出的第一个问题）。而对每个子区域内生成的连接路径，我们可以站在一个更为广阔的全局的角度对它们进行优化连接。下面我们不妨实践一下这个想法，尝试对填充区域进行分区操作。


    # 9.3.2 填充区域分区原理


    让我们结合扫描线法原理再来看一下单连通区域和多连通区域的定义。如果一个多边形区域在每个扫描高度上都只有一条填充线段，那么我们称这个区域为单连通区域；如果一个多边形区域在某个扫描高度上存在多条填充线段，那么我们称这个区域为多连通区域。根据以上定义，单连通区域和多连通区域都是相对填充方向（即扫描线方向）而言的，如果改变填充方向，同一多边形区域可能在单连通区域和多连通区域间相互切换（如图
    9.12 和图 9.13）。我们在这一小节的目标就是在指定填充方向的前提下，对输入多边形区域进行分区，使得得到的所有子多边形相对于填充方向都为单连通区域。


    在实现这个目标之前，我们有必要先探索一下区域连通特性（单连通或多连通）的判别条件。首先，根据以上连通区域的定义，我们当然可以对已经生成的填充线段进行分析，比如统计同一扫描线上的填充线段数量，从中得出当前区域的连通特性。这当然是对的，但对我们要解决的区域分区问题似乎没有太大帮助。我们知道，定义区域连通特性涉及一个关键指标，即扫描线上线段的数量，或者说是扫描线被区域轮廓切割得到的线段数量。下面我们从动态平移扫描线的视角来看一下“切割”问题。


    如图 9.15 所示，我们先降低难度，不妨假设填充线倾角为 0，对图中简单凹多边形多连通区域，在直线 l1 位置时，扫描线和区域轮廓有 2 个交点，被轮廓切割得到一段填充线；在直线
    l 位置时，扫描线和区域轮廓有 4 个交点，被轮廓切割得到两段填充线。在扫描线从 l1 位置逐渐上移到 l1 位置的过程中，我们可以预测，扫描线将在某一时刻和轮廓凹陷处开始相交，在临界状态下，扫描线和区域轮廓有
    3 个交点。如果我们记得界位置为直线 l，当扫描线在 l 位置时，恰好可以将原多边形区域切分成 3 个子区域。而且，在这 3 个子区域内，在每个扫描高度上，都只有一条填充线段，因此这
    3 个子区域都是单连通区域。对如图 9.15 所示的简单多连通区域，我们可以得出结论，直线 l 可以将其切分为 3 个单连通区域。我们称直线 l 为切分直线。


    进一步地，在图 9.15 中，如果我们将位于直线 l 上的扫描线向上平移（如移动到 l1 位置），此时扫描线仍可将原区域切分为 3 个子区域，其中上方 2
    个子区域为单连通区域，但下方一个子区域为多连通区域。反之，如果我们将位于直线 l 上的扫描线向下平移（如移动到 l2 位置），此时扫描线将原区域切分成 2
    个子区域，其中上方子区域为多连通区域，下方子区域为单连通区域。由此可见，切分直线 l 的位置并非偶然，随意对其进行向上或向'
