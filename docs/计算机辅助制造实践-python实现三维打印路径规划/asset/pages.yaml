- pgno: 296
  md: '# # 第 11 章 端面封闭与代码生成


    # ## 引言


    这一章我们将解决三维打印路径生成的最后两个问题。首先是三维模型上、下端面的封闭问题，这是一个极易被忽视的问题。在对模型内部进行填充时，为了节省打印材料和时间，我们通常会设置相对较大的填充间距；但对模型的上下端面及其附近切片层，为了保证模型表面的封闭性，我们必须设置较小的填充间距进行密实填充。为此，我们必须解决模型上下端面的识别问题。在此基础上，我们将汇总本书各章节涉及的路径规划算法，包括模型切片、端面识别、轮廓填充路径生成、平行填充路径生成、支撑路径生成等，结合相应打印工艺参数，封装一个专门用于三维打印综合路径生成和后处理的模块，最终生成可被三维打印机识别的
    NC 代码。


    # ## 11.1 端面识别与切片分区


    三维打印分层叠加制造的工艺特点决定了在垂直于模型生长方向的平面上，将出现一系列端面，其中最典型的就是模型的上端面和下端面。以圆柱体模型为例，如图 11.1(a)，如果圆柱轴线平行于坐标系
    Z 轴，那么圆柱的底面就是端面，其中下底面就是下端面，上底面就是上端面。显然，我们需要在三维打印中对端面及其附近进行密实填充，以封闭模型。从填充路径生成的角度来说，对模型端面切片，我们必须设置较小的路径间距（事实上恰为喷头直径），以保证填充后路径之间无间隙。考虑到我们已经在本书第
    8、第 9 章对填充路径的生成方法进行了详细介绍，因此只要合理设置填充参数，对端面进行密实填充是容易实现的。问题是如何识别模型上的端面，特别是对于那些较为复杂的模型，如图
    11.1(b)。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_296_0.png)


    图 11.1 三维模型上的上端面和下端面'
