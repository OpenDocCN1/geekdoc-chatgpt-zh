- pgno: 6
  md: '计算，消耗大量计算资源，这对 Python 语言来说，似乎是一个巨大的挑战。


    但是我们毅然决然地选择了 Python! 这其实是出于两个方面的考虑：一方面，如上所述，Python 语法简单、易于上手，因此我们不必要求读者具备编程基础，大部分读者只要掌握基础数学和机械知识即可读懂此书；另一方面，Python
    接近伪代码的语言风格可以方便我们以非常直观的方式展示路径规划算法原理和流程，同时这种展示方式是直接可执行的，所见即所得。


    值得一提的是，为了提升使用 Python 实现的路径规划算法效率，我们在算法本身的效率优化上下了不少功夫，以保证大部分路径规划算法能在可接受的时间内（如几秒钟）执行完成，这其实是对算法优化的一种反向促进。尽管如此，我们仍然建议那些有编程基础的读者使用
    C、C++等效率更高的编程语言重构本书涉及的相关算法。


    本书章节内容安排如下：第 1、第 2、第 3 章为基础章节，其中第 1 章介绍 Python 语法和开发环境，第 2 章介绍如何搭建一个基础计算几何库，第
    3 章介绍如何使用 VTK 库显示三维几何实体。第 4、第 5、第 6、第 7 章主要介绍三维打印切片算法，其中第 4 章介绍切片基本概念和基础算法，第 5
    章介绍两种平面和三维模型的优化截交算法，第 6 章介绍两种截交线段的优化拼接算法，第 7 章介绍基于拓扑模型的三维模型切片算法，从逻辑上来说，第 5 章加第
    6 章内容和第 7 章平行。第 8、第 9 章主要介绍三维打印路径生成方法，其中第 8 章介绍轮廓平行路径生成方法，第 9 章介绍方向平行路径生成方法。第
    10 章主要介绍模型支撑区域生成与支撑路径规划方法，同时以支撑量为目标，介绍粒子群优化算法。第 11 章主要介绍切片端面识别和打印代码生成方法，本书最终输出打印代码。


    在本书的示例代码中，我们使用了 3 个第三方 Python 库。一是 VTK 库，这是一个强大的计算机图形可视化开源库，它的底层使用 C++编写，提供 Python
    调用接口，我们在书中用它来显示三维模型和生成的路径。二是 Clipper 库，这是一个用于平面几何图形的布尔运算开源库，同时提供曲线偏置功能，它的底层同样使用
    C++编写，也提供 Python 调用接口，我们在书中用它来裁剪和偏置多边形轮廓。三是 pyserial 库，这是一个 Python 调用系统串口、读写串口的库，我们用它来向三维打印机发送打印代码，实现打印机控制。在此，我们对这三个库的作者表示感谢！


    本书在写作过程中得到了谢礼礼女士的理解和支持，在此表示感谢！本书在筹备和写作过程中也得到了浙江大学机械工程学院王庆九、贺永、沈洪珠、姚鑫骅、吴森洋等老师的大力支持、悉心指导和无私帮助，在此表示感谢！本书的基础研究工作得到了国家自然科学基金项目（编号
    51605427）和浙江省基础公益研究计划项目（编号 LGG19E050027）的资助，在此表示感谢！本书得以出版，尤其感谢浙江大学机械工程学院的资助！


    由于作者水平有限，书中难免存在错误和遗漏，欢迎读者批评指正。


    著 者 2020 年 8 月'
