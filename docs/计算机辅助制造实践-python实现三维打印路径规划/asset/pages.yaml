    # FDM 三维打印机控制方法


    为了更加直观地测试根据本书算法生成的三维打印 NC 代码，在这个附录里，我们将介绍基于 Marlin 固件的 FDM 三维打印机串口控制方法，使用的编程语言仍然为
    Python，首先我们介绍 Marlin 固件。


    Marlin 固件是一种 FDM 三维打印的开源固件。这里固件是指三维打印机控制器的嵌入式软件，其作用是解释并执行上位机发来的 NC 指令。相比于其他三维打印机固件，Marlin
    最为健全和强大。它的功能包括：控制板驱动、NC 代码解析、插补运算、多轴步进运动控制、热床及喷头温度控制、SD 卡读写、LCD 显示等。表附 1.1 列出了
    Marlin 固件常用的 G 代码及 M 代码功能。


    # 表附 1.1 Marlin 固件常用 G 代码和 M 代码功能


    | 代码 | 功能 | 备注 |

    |---|---|---|

    | G0 | 等同 G1, 直线插补 | |

    | G1 | 直线插补 | G1 X10 Y10 Z10 E1.0 F100 |

    | G2, G3 | 圆弧插补 | |

    | G4 | 暂停 | G4 S<seconds> or P<milliseconds> |

    | G28 | 各轴回零 | |

    | G29 | 工作台面水平度补偿 | 在工作台面不平整时需要用到该指令 |

    | G90, G91 | 使用绝对、相对坐标系 | 默认使用绝对坐标系 |

    | G92 | 将当前位置设为给定值 | G92 Z0E0, 即可把当前位置强制设置为零点 |

    | M0, M1 | 无条件停止 | |

    | M17 | 使能(锁死)所有步进电机 | |

    | M104 | 设置挤出头温度 | 3D 打印喷头温度 |

    | M105 | 读取当前温度 | |

    | M106, M107 | 开启, 关闭风扇 | |

    | M140 | 设置热床温度 | 3D 打印工作台面温度 |


    下面我们介绍三维打印机和上位机的通信原理。三维打印机控制器通过串口( 一般'
  merge: -1
