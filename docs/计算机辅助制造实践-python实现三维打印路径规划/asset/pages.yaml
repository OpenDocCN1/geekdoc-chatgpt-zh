    # 9.1.2 填充线交点计算


    在建立了扫描线数据结构后，接下来我们考虑构建扫描线算法流程。可以想像，扫描线法应该包含两个关键步骤，一是根据线段最低点的 Y 坐标对线段序列进行排序，二是当'
