    | 4 | def linkToParent( self, child ): | # 定义连接直系子曲线至直系父曲线函数 |

    | 5 | parent = child.parent | |

    | 6 | pt = child.startPoint() | # 获取直系子曲线起点 pt |

    | 7 | dMin, iAtdMin = float( ''inf'' ), 0 | # 使用 float( ''inf'' )获取浮点数最大值 |

    | 8 | for i in range( parent.count() ): | # 寻找直系父曲线上到 pt 最近的点 |

    | 9 | d = pt.distanceSquare( parent.point( i ) ) | |

    | 10 | if d < dMin: | |

