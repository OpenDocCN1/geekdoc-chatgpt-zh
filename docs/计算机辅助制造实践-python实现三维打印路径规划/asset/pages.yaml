- pgno: 134
  md: '许我们可以用它来切片。首先，我们可以从任意一个面片出发，求取该面片和截平面的交线。然后我们查询该面片的相邻面片，并求取相邻面片和截平面的交线。接下来我们再去查询相邻面片的相邻面片，然后求交。依此不断迭代，直至所有面片被用完。在这一过程中，从相邻面片求得的截交线段也必然是相邻、相接的，因此在截交过程中我们就可以直接对交线依次进行拼接，整个截交和拼接过程将融为一体。如果我们把第一个面片称为“种子”，求取切片轮廓的过程类似于种子不断“追踪”相邻面片的过程，这将非常容易。


    当然，以上设想都是建立在构建了 STL 模型中面片、棱边、顶点之间的相邻关系的基础上。在本书中，我们把空间多面体中面片、棱边、顶点这些几何实体之间的相邻、关联、包含、索引等关系统称为“拓扑关系”。一旦我们构建了
    STL 模型的拓扑关系，我们就可以剔除模型中的冗余顶点，切片轮廓的计算也将变得非常简单，可以一步到位地实现。那么，我们又该如何高效地构建 STL 模型的拓扑关系呢？在解决这个问题之前，我们先来看一下针对
    STL 模型面片、棱边、顶点的拓扑关系表示方法。


    # 7.2 拓扑关系表示


    一个 STL 模型包含一系列散乱无序的三角面片，其中每个三角面片又包含 1 个面、3 个顶点、3 条棱边。STL 模型中，顶点和面、边，面和顶点、边，边和顶点、面之间都应存在从属或包含的关系。这一节我们要做的就是整理顶点、边和面之间的拓扑关系，并在此基础上，建立相应的数据结构。


    # 7.2.1 顶点拓扑结构


    在 STL 模型中，每个三角面片都有独立的顶点，这导致即便是坐标相同的顶点，它们也各自拥有不同的顶点对象。这对于我们要建立的顶点拓扑关系显然不是一件好事。理想情况下，每个顶点位置上应该只有一个顶点对象，即我们先假设顶点不存在冗余的情况。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_134_0.png)


    图 7.2 顶点拓扑结构


    对这个顶点，如图 7.2 所示，首先，它应该拥有 X、Y、Z 三个方向的坐标，以指示它所在'
