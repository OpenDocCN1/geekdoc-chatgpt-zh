  md: '的使用方法也很简单,下面我们给出偏置示例代码(写在 Test_clipperOffset.py 文件中)：


    | Test_clipperOffset.py | Python 版的 Clipper 库轮廓偏置测试 | 8 - 5 |

    |---|---|---|

    | 1 | from pyclipper import * | # 定义 Pyclipper 对象 clipper |

    | 2 | outerPoly = [ (0,0) , (100,0) , (100,100) , (0,100)] | # 外轮廓,逆时针 |

    | 3 | innerPoly = [ (30,30) , (30, 70) , (70,70) , (70,30)] | # 内轮廓,顺时针 |

    | 4 | pco = PyclipperOffset() | # 创建 PyClipperOffset 对象 pco |

    | 5 | pco.AddPath(outerPoly, JT_ROUND, ET_CLOSEDPOLYGON) | # 添加外轮廓 |

    | 6 | pco.AddPath(innerPoly, JT_ROUND, ET_CLOSEDPOLYGON) | # 添加内轮廓 |

    | 7 | sln = pco.Execute( -7) | # 执行内偏置,距离为-7,返回结果 sln |


    在以上代码中,我们首先创建了一个“回”字形轮廓,包括外轮廓 outerPoly 和内轮廓 innerPoly,这两个轮廓都是二维元组的列表。


    然后我们将这两个轮廓通过 PyClipperOffset 类的 AddPath 函数分别加入 pco,并在参数中设置偏置线段衔接类型为 JT_ROUND,即圆弧衔接,轮廓端点类型为
    ET_CLOSEDPOLYGON,即封闭多边形。


    最后我们调用 Execute 函数生成偏置结果 sln,它的格式和我们之前在代码 8-3 中所得结果的格式完全一致,因此我们可以使用相同的方法来显示 sln
    中的轮廓(如图 8.19)。


    在 Execute 函数中,我们设置的偏置距离为-7,负号表示对逆时针轮廓向内偏置,对顺时针轮廓向外偏置;如果偏置距离为正,则对逆时针轮廓执行向外偏置,顺时针轮廓执行向内偏置。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_179_0.png)


    图 8.19 Clipper 偏置对回形轮廓偏置示例


    在实际使用 PyClipperOffset 类时,我们必须十分注意输入轮廓的方向。在我们还能认清各个轮廓的方向时,保证外轮廓方向为逆时针,内轮廓方向为顺时针。如果我们不能保证上述方向,至少保证逻辑上表示区域内、外边界的轮廓方向相反,否则我们将得不到正确的偏置结果。这是因为
    Clipper 库的偏置源代码中,Clipper 会判断最外层的轮廓方向,如果最外层轮廓是逆时针,则不调整其他轮廓方向;如果最外层轮廓是顺时针,则会对所有轮廓进行取反处理。'
