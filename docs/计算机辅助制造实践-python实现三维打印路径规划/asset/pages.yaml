    # 8.5.3 偏置路径连接


    对连续偏置曲线 offsetPolyses,当三维打印机喷头沿着当前偏置曲线走完一周后,需要跳到另一条偏置曲线上,此时,我们就需要考虑如何连接这些偏置曲线。那么,我们是否可以依据
    offsetPolyses 中各曲线的序号直接连接所有曲线,并将得到的曲线作为驱动打印机喷头运动的路径呢? 这当然是可以的,但通过这种方式得到的路径可能不是最优的。


    原因主要来自两个方面,一是各偏置曲线上的起点位置不定,二是同一级偏置曲线可能相距甚远。使用 Clipper 库中的布尔偏置工具得到的偏置曲线起点(终点)位置是没有规律可循的,它可能在曲线左侧,也可能在曲线右侧。对两条需要被连在一起的相邻级别的偏置曲线,连接第一条曲线终点和第二条曲线起点的直线段可能特别长,甚至跨越整个轮廓区域,如图
    8.27 所示。而对于两条在同一偏置级别上的曲线,即便我们可以调整它们各自的起点、终点位置,最终得到的连线线段仍然可能非常长。对实际三维打印过程来说,较长的路径连接线段意味着较长的喷头移动时间,而在这段时间内喷头只空走不出丝,这对整个打印过程来说是徒劳的,只会延长打印时间,因此在规划路径时我们应该尽量减少喷头空走的时间,降低路径之间连接、跳转线段的长度。显然,采用以上直接按照序号连接偏置曲线的策略无法得到最短的打印路径。


