    # 图 10.27 测试立方体模型


    在以上测试代码中，我们做了如下几件事情：首先读取立方体模型，然后调用粒子群优化函数 pso 对模型支撑量进行优化，得到了最优粒子（best），并依照此转角对模型进行旋转，得到优化模型（optModel）；随后对优化模型切片，其结果输入
    findSptRegion 函数生成了支撑区域切片轮廓；最后对模型本身、模型切片、支撑切片进行显示。


    我们先来看一下 pso 函数的参数设置。对业务相关部分参数，考虑到测试立方体边长为 150 毫米，为了节省粒子群算法计算量，我们设置的模型底面投影网格尺寸（gridSize）为
    10 毫米，该设置最终可生成约 200 个规模的细分网格（参见图 10.6 和 10.7）；此外，设置的危险面片临界角为 60 度，对测试立方体，初始状态下，如图
    10.27，它的三个下表面均为危险面，需要添加支撑。对粒子群算法本身相关的 5 个参数，我们设置的粒子种群数量（popu）为 70，迭代次数（iter）为
    1000，粒子变异概率（prob）为 0.01，即一个粒子在一次迭代中有 1% 的概率发生变异，个体极值和全局极值在进化中的权重系数（wL、wG）均为 4，即对式（10-11），p
    : q : r = 1 : 4 : 4。需要说明的是，这里设置了较大的迭代次数，因为我们希望在算法最大迭代次数到来前能够找到问题的全局最优解。


    对切片函数 slice_topo，我们设定的切片层高为 2.5 毫米，这样的层高设置完全是为了让显示更加清晰。对 findSptRegion 函数中的 gridSize
    参数，我们设置的值为 2 毫米。


    需要说明的是，pso 和 findSptRegion 两个函数都涉及 gridSize 参数，两者的意义是一样的，都是模型投影网格尺寸，都和 FindSptRegion
    类中支撑线段的计算量直接相关，但由于应用背景不一样，我们设置了不同的值。在 pso 函数中，由于有多个粒子，且执行多次迭代，每个粒子每次迭代都会调用 FindSptRegion
    类中相关函数，计算量比较大，因为我们设置了较大的 gridSize 值以降低计算量；相对来说，findSptRegion 函数只会被调用一次，计算量不大，因此我们对它设置了较小的
    gridSize 值。


    图 10.28 给出了以上代码多次运行的部分结果统计，其中横坐标为迭代次数，纵坐标为粒子适应度（即支撑量）。可以看到，对如图 10.27 所示的立方体模型，粒子群算法具有立竿见影的优化效果！图
    10.29 显示了优化前后模型摆放角度和所需支撑量的情况。在我们的测试中，粒子群算法最少迭代 15 次就能找到问题的全局最优解，并将支撑体积从百万立方毫米级别降到
    0，这对实际三维打印中减少支撑材料是极有意义的。'
