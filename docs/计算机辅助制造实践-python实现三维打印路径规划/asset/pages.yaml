  md: 'sfRate，该参数表示工件内部稀疏填充区域平行路径的填充率，取值为大于 0 且小于等于 1，它和喷头尺寸( nozzleSize) 一起可用于计算稀疏平行填充间距(
    sfInvl)，计算公式为：

    sfInvl = nozzleSize/sfRate


    得到的 sfInvl 可作为参数输入 genDpPath 函数计算稀疏平行填充路径。同理，sptSfRate 表示支撑部分平行填充路径填充率，可用于计算支撑部分平行行填充间距。相对于直接给出平行路径填充间距的具体数值，用填充率显得更直观，且对用户更友好。


    此外，在表 11.1 中，根据三维打印的实际需求，我们额外添加了一些参数。如 sptOn，这是一个开关量，表示是否需要生成支撑路径。又如 nozzleSize、filamentSize，分别表示
    FDM 打印机喷头直径尺寸和丝材直径尺寸，其中 nozzleSize 可用于计算路径间距，而 nozzleSize 和 filamentSize 一起可用于计算挤丝电机的转动量。参数
    g0Speed 和 g1Speed，分别表示快速进给(不出丝)和打印进给(出丝)速度，单位一般为 mm/min (视具体打印机而定)，它们和路径曲线形状无关，但和
    NC 代码中各轴进给速度有关。参数 startCode 和 endCode 用于指定 NC 代码中的开始代码和结束代码，在开始代码中，我们可以写入各轴回零、坐标系统选择、打印温度设置、风扇设置等代码；而在结束代码中，我们可以写入程序结束、打印机重置等代码。


    为了更好地组织、管理表 11.1 中所有的工艺参数，我们专门创建了一个 PrintParams 类。我们把这个类写在一个新建的 GenNcCode 模块中，该模块后续将用于存放和
    NC 代码生成相关的程序代码。PrintParams 类的具体实现如下：


    | GenNcCode.py | NC 代码生成模块，定义打印工艺参数类 | 11 - 8 |

    |---|---|---|

    | 1 | ...... | # 导入相关库 |

    | 2 | class PrintParams: | # 定义打印工艺参数类 |

    | 3 | def __init__( self, stlModel ): | # 类的初始化函数 |

    | 4 | self.stlModel = stlModel | # STL 模型 |

    | 5 | self.layerThk, self.shellThk , self.endThk = 0.2, 2.0, 2.0 | # 切片，外壳，端面厚度
    |

    | 6 | self.sfRate, self.fillAngle = 0.2, 0.0 | # 工件内稀疏填充率、填充角度 |

    | 7 | self.sptOn = False | # 是否使用支撑，默认为否 |

    | 8 | self.sptCrAngle = degToRad( 60.0 ) | # 危险面片临界角度 |

    | 9 | self.sptGridSize = 2.0 | # 支撑网格尺寸 |

    | 10 | self.sptSfRate, self.sptFillAngle = 0.15, 0.0 | # 支撑填充率，填充角度 |

    | 11 | self.sptFillType = SptFillType.cross | # 支撑填充类型，默认交叉填充 |

    | 12 | self.sptXyGap = 1.0 | # 支撑到模型横向间距 |

    | 13 | self.g0Speed, self.g1Speed = 5000, 1000 | # G0, G1 速度 |

    | 14 | self.startCode = " ; Start code...\n" | # 起始代码 |

    | 15 | self.endCode = " ; End code...\n" | # 结束代码 |

    | 16 | self.nozzleSize, self.filamentSize = 0.5, 1.75 | # 喷头、丝材直径尺寸 |


    PrintParams 类的属性完全根据表 11.1 定义。它的初始化函数仅包含 1 个输入参数，即 stlModel。对于类中大部分属性，我们都给出了相应默认值，如默认
    layerThk、shellThk、endThk 分别为 0.2 毫米、2.0 毫米、3.0 毫米，默认 sfRate 为 0.2，即工件内部稀疏填充率为'
