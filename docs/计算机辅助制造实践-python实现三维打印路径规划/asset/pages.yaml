- pgno: 84
  md: '我们先来分析一下多边形的包含层次。结合图 4.8 和图 4.9，如果一个多边形位于最外层（即第 0 层），那么这个多边形是填充区域的外边界，其方向应为逆时针，如图中
    1 号和 5 号多边形；如果一个多边形处于第 1 层（即第 0 层内部），那么这个多边形是填充区域的内边界，其方向应为顺时针，如图中 2 号和 3 号多边形；如果一个多边形处于第
    2 层，那么这个多边形又将是填充区域的外边界，其方向应为逆时针，如图中 4 号多边形……以此类推，我们不难归纳出：如果一个多边形处在偶数层上，那么它为外边界，方向为逆时针；反之如果处在奇数层上，那么它为内边界，方向为顺时针。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_84_0.png)


    对于两个多边形 A 和 B，如果 B 位于 A 内部，那么我们称 B 为 A 的子多边形，A 为 B 的父多边形。在图 4.9 中，1 号和 5 号多边形均有
    0 个父多边形，2 号和 3 号多边形均有 1 个父多边形，4 号多边形有 2 个父多边形。


    由此我们可以归纳：如果一个多边形有偶数个父多边形，那么这个多边形为区域外边界，方向应为逆时针；反之如果一个多边形有奇数个父多边形，那么这个多边形为区域内边界，方向应为顺时针。


    经过以上分析，我们已经把求解问题的方法向我们熟悉的方向引导。在本书第 2 章中，我们已经给出了点和多边形关系的判断方法，并将其封装在 GeomAlgo 模块的
    pointInPolygon 函数中。


    基于以上分析，对于多边形集合中的任意多边形 A，我们可以取该多边形上的任意一（顶）点 P，判断 P 和剩余多边形的关系：如果 P 在偶数个多边形内部，那么多边形
    A 为外边界，方向应为逆时针；反之如果 P 在奇数个多边形内部，那么多边形 A 为内边界，方向应为顺时针。


    根据以上思路，我们只要写一个简单的循环，就能判断一个多边形的方向，写两个循环，就能判断同一平面上所有多边形的方向。


    我们把调整多边形方向的函数写在 GeomAlgo 模块中，函数名为 adjustPolygonDirs，输入为 Layer 中的多边形轮廓列表，具体实现代码如下：'
