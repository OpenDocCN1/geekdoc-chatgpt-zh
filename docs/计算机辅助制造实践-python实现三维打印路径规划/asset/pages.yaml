    \ ) )\n        f.write( bytes( [ 0x0d, 0x0a, 0x1a ] ) )\n        f.write( bytes(\
    \ [ 0x00 ] * 256 ) )\n        f.write( struct.pack( 'b', 1 ) )\n        f.write(\
