    # 图 4.2 平面截 STL 模型获取封闭交线


    在以上步骤中，STL 模型切片是至关重要的一步。这个问题可以描述为：用一张平面去截一个 STL 模型，计算该平面和模型之间的封闭交线。考虑到 STL 模型是由一系列离散的三角面片组成，因此计算平面和模型的交线首先需要计算平面和三角面片的交线(线段)，然后将这些交线段依次首尾相连成封闭交线即可。这一节的主要任务就是对给定坐标的空间三角形和平面，求取它们之间的交线。


    如图 4.3 所示，我们不妨记空间中任意一三角形为 ABC，平面为α( P，N)，其中 P 为平面经过的一点，N 为平面法向量。△ABC 由 3 条边包围而成，分别为线段
    AB、AC 和 BC。在第 2 章中，我们已经推导了空间线段和空间平面的求交计算方法，并在 GeomAlgo.py 中给出了 intersectSegmentPlane
    函数，结合这个函数，首先我们可以分别计算线段 AB、BC、AC 和平面α的交点，然后从中选择合适的两点所连成的线段作为△ABC 和平面α的交线。如图 4.4
    所示，线段 AB、BC、AC 和平面α之间可能存在 3 个，2 个或 0 个交点。需要说明的是，在 intersectSegmentPlane 函数中，如果线段和平面平行(或重合)，我们认为线段和平面不存在交点。


    类似地，对于三角形和平面，如果它们平行(或重合)，则认为它们不相交；此外，如果三角形和平面交于三角形一个顶点，也认为它们不相交。在此基础上，我们再来讨论△ABC
    和平面α的交点个数问题：


    +   - (1) 如果交点个数为 3 个，那么其中必然有 2 个交点是三角形的同一顶点，这种情况下取 3 点中不重合的 2 个点作为交线两端点即可。

    +   - (2) 如果交点个数为 2 个，则进一步判断这 2 个交点是否重合，如果不重合则取这 2 个点作为交线两端点，否则△ABC 和平面α无交线。

    +   - (3) 如果交点个数为 0 个，则△ABC 和平面α无交线。'
