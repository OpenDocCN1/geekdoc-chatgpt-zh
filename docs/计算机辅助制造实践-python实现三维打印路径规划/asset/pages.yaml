    faces 尺寸不会太大，因此我们不必太在意 findSeedFace 函数的执行效率。


    最后，我们来看一下 findNextFace 函数，这是我们在 TopoSlicer 类中重点实现的函数，它的功能是根据当前面片寻找下一个目标邻面。但这个函数的输入并非当前面片，而是当前面片和截平面相交后得到的交点所在的半边和顶点，即
    edges 和 node。然后我们按照以上介绍的原理对 edges 和 node 进行分类讨论，包括交点均在半边上以及交点分别落在半边和顶点上两种情况，从而找出目标邻面。


    针对第二种情况，当目标邻面和当前面片通过 node 相连时，如图 7.14（b），我们调用了 TEdge 的 intersect 函数对 node 中存储的所有面片（node.faces，当前面片除外）进行遍历求交，那这里为什么要去执行费时的求交操作而不直接判断面片最低点
    zMin、最高点 zMax 和截平面高度 z 的关系呢？其实我们已经考虑到了这一点，但是，zMin <= z 且 zMax >= z 是面片和截平面相交的必要非充分条件，因为当面片的一个顶点落在截平面上时，我们认定它们是不相交的。所以，这里我们不得不调用
    intersect 函数，确保万无一失。在 intersect 函数中，我们使用了 node 的 z 坐标作为当前截平面的高度，这是因为在这种情况下，截平面的高度确实恰好等于
    node 的 z 坐标，这样做的好处是可以为 findNextFace 函数节省一个必要的截平面高度的输入参数。


    # 7.4.3 切片轮廓创建


    通过以上讨论，针对一个拓扑模型，现在我们可以以较快的速度找出一个种子面片，我们也可以从这个种子面片出发，连续不断地找出当前面片的下一个面片，这些都已经不再是泛泛而谈。对于我们要实现的拓扑模型切片的目标来说，现在缺的似乎只是一个合理的流程。我们在这一小节的任务就是组织整理基于拓扑模型的切片轮廓创建流程，同时给出
    TopoSlicer 类的剩余代码。


    我们先来看一下切片轮廓的创建流程，如图 7.15 所示。这个流程的输入为当前截平面高度 z 和面片列表 faces，输出为包含了当前层片切片轮廓信息的 layer，其中
    faces 为拓扑模型中仅和当前截平面相交的面片，这些面片可由扫描平面法获得。


    对输入的高度 z 和面片 faces，我们首先需要创建供收集切片轮廓用的 Layer 对象 layer。此外，我们还有必要对 faces 进行数据清洗，即将
    faces 中每个面片的 used 属性值置为 False。这一步看起来微不足道，极有可能被忽略，但是它却非常重要，甚至可以说是切片轮廓创建失败的关键。这是因为在对拓扑模型的切片过程中，有些时候，切片层高值可能小于某些三角面片在
    z 方向上的高度，在这种情况下，这些面片就可能被不同高度的截平面多次切到。如果在上一轮切片过程中，我们已经标记了这些面片的 used 为 True，而在这一轮切片开始前没有将
    used 重置为 False，那么在这一轮切片过程中，我们很有可能找'
