    \ pt 的距离，从中找出一个距离取到最小值 dMin 和 dMin 时的直系父曲线点序 iAtDMin。注意，当我们需要从一堆数中寻找一个最小值(最大值)，取到时首先需要初始化一个最小值(最大值)变量，最方便的初始化方式就是设置这个变量的值为实数所能取到的最大值(最小值)。接下来我们要逐一将直系父曲线、直系子曲线上的点按照一定的顺序添加到新建曲线(\
