    # 10.4.2 适应度函数建立


    我们知道，在控制其他变量一致的情况下，模型上的支撑量只和模型的摆放角度有关，而与模型的摆放位置无关。从几何上说，一个模型的摆放角度可由该模型绕坐标系 X 轴、Y
    轴和 Z 轴的旋转角度来定义。这里的坐标系可以是世界坐标系，也可以是在模型上建立的某个局部坐标系。考虑到模型平移支撑量的不变性，这里我们不再定义其他坐标系，就以世界坐标系的各坐标轴为转轴去旋转模型。


    进一步分析，如果模型是沿着坐标系 Z 轴方向进行打印的话，那么绕 Z 轴对模型进行旋转并不会改变模型上的支撑空间形状和支撑量，而只会改变支撑位置，这是因为模型绕
    Z 轴旋转时模型上各个面片相对于 XY 平面的倾角事实上并未发生改变。综上我们可以得出：模型上的支撑量只和模型绕 X 轴和 Y 轴的旋转角度有关。


    要获得模型在不同摆放角度下的支撑量，首先我们需要对模型按指定角度进行旋转变换并获取其在旋转后的坐标。我们不妨记模型绕坐标系 X 轴的旋转角为 α，绕 Y 轴的旋转角为
    β，α、β 的定义域均为 [0, 2π]，初始状态下（即模型刚被加载时），α = 0，β = 0。根据式 (2-6) 和 (2-7)，我们可以分别构建绕 X、Y
    两轴旋转的两个旋转矩阵 M_rx(α)、M_ry(β))。对任意三角面片上的一个顶点 P 及法向量 N，我们可以根据下式对其进行旋转变换：


    P'' = P * M_rx(α) * M_ry(β) (10-7)


    N'' = N * M_rx(α) * M_ry(β) (10-8)


    式中，P'' 和 N'' 为更新后的面片顶点和法向量。根据式 (10-7) 和 (10-8)，我们可以遍历 STL 模型中每个面片的顶点和法向量，完成对模型的旋转和坐标更新。


    必须强调的是，由于矩阵乘法不存在交换律，因此不能随意更改旋转次序。下面我们直接在之前已经创建的 StlModel 类中添加旋转变换函数，具体代码如下：


    | StlModel.py | 在 StlModel 类中添加旋转变换函数 | 10 - 12 |

    |---|---|---|

    | ...... | # 导入相关库，忽略其他代码 | |

    | class StlModel: | # 忽略类中其他代码 | |

    | ...... | | |

    | def multiplied( self, m ): | # 根据矩阵进行几何变换 | |

    | model = StlModel() | # 新建一个模型 | |

    | for t in self.triangles: | # 遍历每个面片 | |

    | triangle = Triangle(t.A * m, t.B * m, t.C * m, t.N * m) | # 对顶点及法矢作用矩阵 | |

    | model.triangles.append( triangle ) | | |

    | return model | # 返回模型 | |'
