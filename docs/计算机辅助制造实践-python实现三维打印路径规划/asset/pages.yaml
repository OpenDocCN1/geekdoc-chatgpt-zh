  md: '种填充规则,其中前缀 PFT 是 Polygon Fill Type 的缩写,即填充类型。如果不指定,默认情况下, Execute 函数将采用奇偶填充规则。


    这里有几点需要说明的是,首先,Clipper 库中的轮廓是 Path,Path 是由二维 Point 组成的列表。在 Clipper 中,Point 结构事实上是二维元组,因此,在以上代码中,我们是通过二维元组和列表对
    subject 和 clip 轮廓赋值的。Clipper 库执行布尔运算后可能返回多条轮廓,其中每条轮廓也是二维元组的列表,多条轮廓即返回多个列表。为了显示最终返回的轮廓,我们定义了
    tuplesToPoly 函数,可以非常方便地将二维元组列表转化为 Polyline 对象,我们之前已经实现了在 VTK 中显示 Polyline 的方法。


    其次,Clipper 对闭合 Path 的定义和我们对 Polyline 闭合的定义有所差别。和 Polyline 不同的是,在 Clipper 中,闭合轮廓并不是通过起点和终点坐标重合实现的,而是通过另外方式标识的。因此在以上代码中,我们创建的
    subject 和 clip 轮廓都是非闭合的,当我们调用函数 AddPath 将其加入 clipper 时,我们通过设置第 3 个参数值为 True 告知
    clipper 这些轮廓都是封闭的。对布尔运算返回的轮廓,如果我们需要通过将其转化为 Polyline 并在 VTK 中显示,原则上我们要强行设置轮廓闭合,这也是我们在
    tuplesToPoly 函数中对得到的轮廓添加轮廓起点的原因。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_175_0.png)


    至此,我们对 Clipper 库的介绍已经接近尾声。最后需要说明的是,Clipper 中的各种裁剪算法的时间复杂度接近线性,执行速度非常快,且非常稳定。对
    Clipper 库实现原理感兴趣的读者建议阅读一下相关文献,特别是 Vatti 在 1992 年发表的 A generic solution to polygon
    clipping 论文,或者尝试阅读一下 Clipper 库的源代码(建议阅读其 C++源码)。而对 Clipper 库应用感兴趣的读者可以再去阅读一下官方说明文档,多尝试一些测试案例,做一些有意思的实际应用。注意,这一小节的内容是为下一小节服务的,在下一小节,我们将介绍基于布尔运算的轮廓偏置原理。


    # 8.3.2 布尔偏置原理


    我们在本章 8.2 节介绍了两种基本的初始偏置轮廓生成方法,线段平移法和角平分线法。我们发现,无论使用哪种方法,在偏置过程中都会难免产生自相交环,而且,这些自相交环通过常规方法很难消除。幸运的是,Clipper
    库为我们提供了一种基于布尔运算的平面曲线的偏置方法(以下简称为布尔偏置),可以非常高效、稳定地帮助我们生成平面偏置曲线,消除轮廓上各种各样的非法自相交问题。下面我们尝试解释一下这种偏置方法的实现原理。注意,这一部分的内容完全基于作者对
    Clipper 源代码的解读。


    Clipper 库中布尔偏置的初始偏置曲线也是通过线段平移的方法生成的,但相邻偏置'
