    +   1. 在三维打印中，为什么需要对模型端面上的切片进行识别？

    +   2. 如何判断某一层切片上是否存在上端面或下端面？

    +   3. 探究模型上端面和支撑的关系。能否利用端面为模型添加支撑？

    +   4. 在代码 11-4 中，简述在首层切片之前插入一层空切片的作用。

    +   5. 简述在 FDM 三维打印的工艺参数中，startCode 和 endCode 的作用。

    +   6. 说明代码 11-10 存在的问题，如何改进？'
