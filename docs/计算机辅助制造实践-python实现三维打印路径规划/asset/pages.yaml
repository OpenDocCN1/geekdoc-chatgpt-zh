    ```


    如果 V 和 N 垂直，分母为 0，此时直线和平面平行，无交点；否则，根据计算出的 t 值可确定交点坐标。


    针对射线和平面求交以及线段和平面求交问题，我们可以借鉴处理上述线线求交的方法，先计算射线或线段所在直线和平面的 t 值以及交点坐标，然后对 t 的取值进行判断，从而确定交点是否在射线或线段上。


    # 2.5.3 点和多边形关系


    简单起见，我们在这里将点和多边形限定在 XY 平面上。点和多边形的关系包括点在多边形内、点在多边形上以及点在多边形外 3 种情形。这是一个大家都非常熟悉的平面几何问题，如果不考虑点落在多边形上的情形，那么我们都知道这个问题可用构造射线的方法解决，即从该点向无穷远处作一条射线，计算射线和多边形的穿过次数，如图
    2.13 所示，如果穿过次数为奇数，那么该点落在多边形内；如果穿过次数为偶数，那么该点落在多边形外。尽管如此，这个方法实现起来并非容易。


    结合以上介绍的关于射线和线段的求交方法，我们可以让射线和多边形中的所有线'
