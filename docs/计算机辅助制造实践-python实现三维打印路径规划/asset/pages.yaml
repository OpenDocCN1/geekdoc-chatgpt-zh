  md: '到一个三维打印 NC 代码生成模块，用于生成可被实际三维打印机识别和打印的 NC 代码。


    需要指出的是，在计算机辅助制造或路径规划中，“路径”是相对于工件模型和工艺参数的几何概念，通常指计算机内存中生成的或存储的曲线（或多段线）数组；而 NC 代码具有设备属性，它是相对于具体数控设备而言的，如数控机床、三维打印机等，数控设备通过读取、解析
    NC 代码控制各进给轴运动、I/O 执行相应操作。从曲线路径到 NC 代码的转化过程一般叫作后置处理。后置处理需要考虑目标设备特性，对相同路径，针对不同目标的设备可能生成不同的
    NC 代码。


    因此，从内容上来说，这一节我们首先要做的是生成路径，然后针对某种具体三维打印机对路径进行后置处理，生成 NC 代码。这里我们以当下市面上极为常见的 FDM
    三维打印机为例讲解 NC 代码（通常就是 G 代码）的生成过程。下面我们首先来对三维打印路径生成涉及的重要工艺参数做一个汇总。


    # 11.2.1 工艺参数汇总


    常规的三维打印路径规划涉及的具体流程包括：三维模型切片、端面识别（含切片疏密分区）、轮廓填充路径生成、平行填充路径生成、支撑路径生成，我们封装的与之对应的函数包括：slice_topo（或
    slice_combine）、idEndlayer、genCpPath、genDpPath、genSptPath。因此，原则上，只要我们提取、汇总这些函数的各个输入参数，就能大致构建三维打印路径规划的工艺参数表，如表
    11.1 所示。


    表 11.1 FDM 三维打印工艺参数表


    | 序号 | 参数名 | 数据类型 | 相关函数 | 描述 |

    |---|---|---|---|---|

    | 1 | stlModel | StlModel | slice_topo、slice_combine | STL 模型 |

    | 2 | layerThk | float | | 切片厚度 |

    | 3 | shellThk | float | idEndlayer | 外壳厚度(轮廓路径填充宽度) |

    | 4 | endThk | float | | 端面厚度，用于计算端面切片层数 |

    | 5 | sfRate | float | genDpPath | 平行路径稀疏填充率 |

    | 6 | fillAngle | float | | 平行路径填充角度 |

    | 7 | sptOn | bool | genSptPath | 是否使用支撑 |

    | 8 | sptSfRate | float | | 支撑部分平行路径填充率 |

    | 9 | sptGridSize | float | | 模型投影底面网格尺寸 |

    | 10 | sptCrAngle | float | | 危险面片临界角度 |

    | 11 | sptFillType | 枚举 | | 支撑填充类型，交叉或同向 |

    | 12 | sptFillAngle | float | | 支撑部分平行路径填充角度 |

    | 13 | sptXyGap | float | | 支撑到路径横向间距 |

    | 14 | nozzleSize | float | genCpPath,genDpPath、genSptPath | FDM 打印机喷头尺寸(直径) |

    | 15 | filamentSize | float | | FDM 打印丝材尺寸(直径) |

    | 16 | g0Speed | int | | G0 速度，即空走速度，不出丝 |

    | 17 | g1Speed | int | | G1 速度，即打印速度，出丝 |

    | 18 | startCode | 字符串 | | 起始代码，和具体打印机相关 |

    | 19 | endCode | 字符串 | | 结束代码，和具体打印机相关 |


