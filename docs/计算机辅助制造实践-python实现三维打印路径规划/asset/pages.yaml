    # 8.2.2 基于角平分线的偏置


    在上一小节，我们粗略介绍了基于线段平移的多边形偏置方法，包括单一线段偏置计算方法和相邻偏置线段修补策略，同时，我们还介绍了局部和全局自相交环的概念。在这一小节，我们将继续介绍基于角平分线的偏置方法。相对于线段平移偏置，使用角平分线偏置更容易获取初始偏置轮廓。


    在开始介绍之前，我们不妨重新去看一下图 8.5，无论是哪种情况，图中两偏置线段（或延长线）之间的交点 Q 到直线 P₁,P₂,P₃ 的距离均等于偏置距离，据此，我们不难判断交点
    Q 位于 ⌒P₁P₂P₃ 的角平分线上。之前我们都是以线段为单位来思考偏置问题，下面我们不妨从点的角度出发来考虑偏置问题。如果我们把点 Q 称为原始多边形上顶点
    P₂ 对应的偏置点的话，那么不难想象，只要我们依次连接多边形上的所有偏置点，就能直接得到一条初始偏置轮廓，这样确实能为我们节省对偏置线的修补和裁剪工作时间。


    首先我们来看一下偏置点的计算问题。这里我们还是以逆时针多边形的向内偏置为例进行说明。对原始轮廓上的 3 个连续点 P₁、P₂、P₃，我们首先需要计算过 P₂
    的角平分线，因为 P₂ 坐标为已知量，因此我们只需计算角平分线的方向即可。这其实很简单，我们只需分别计算 P₂P₁、P₂P₃ 的单位位向量（记为 v₁、v₂），然后将其相加就可得到角平分线的方向向量（也是单位向量，记为
    v），如下代码：


    | | 偏置点计算方法 | 8 - 2 |

    |---|---|---|

    | 1 | v1 = P2.pointTo(P1).normalized() | # v1 为 P2P1 方向 |

    | 2 | v2 = P2.pointTo(P3).normalized() | # v2 为 P2P3 方向 |

    | 3 | v = (v1 + v2).normalized() | # v 为角 P1P2P3 角平分的方向向量 |


    但是由上述代码计算得到的向量 v 还不能直接被用来计算偏置点。因为两个向量相加得到的和向量总是指向由这两个向量所夹的优角区域，向量 v 也不例外。也就是说，由以上代码求得的向量
    v 的正反方向可能是错的。如图 8.9(a) 所示，当 P₁、P₂、P₃ 所夹内角为优角时，v 的方向是对的；但当 3 点所夹内角为劣角时，v 的方向就是错的，如图
    8.9(b)'
