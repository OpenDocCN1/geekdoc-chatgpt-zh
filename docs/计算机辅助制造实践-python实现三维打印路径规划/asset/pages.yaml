    getOrthoVector2D 函数代码可知,它返回的法向量的左右侧方向是不确定的,因此我们必须对以上代码中的法向量 n 做进一步处理。


    那我们该如何确保 XY 平面上的向量 n 在线段 P1,P2的左侧呢? 其实这很简单,我们只需对 n 和 P1,P2的方向向量(即 v) 进行叉乘(注意,n
