    事实上，我们在这一节得到的 genNcCode 函数的重要价值不仅仅是相对于 GenNcCode 模块而言的，它也是本书所有工作，所有理论、算法，所有模块、类、函数，所有尝试、实践、测试的最终结果与出口。将万千行代码汇聚成一行代码，这正是我们在本书解决三维打印路径规划中所做的事情。


    # 本章小结


    在这一章，我们主要完成了两个任务。一是对模型切片上的端面识别问题展开了研究。为了封闭三维打印后得到的工作，我们有必要对模型上的端面进行识别，并对端面区域进行密实填充。同时为了节省打印材料和时间，对除端面外的其他区域，我们可以进行稀疏填充。为此，我们提出了一种基于平面轮廓布尔运算和偏置运算的端面切片识别方法，并在此基础上，将各层切片分成密实填充区、稀疏填充区和轮廓填充区
    3 种区域。这部分工作是对三维打印路径规划的进一步补充和完善，我们封装了一个 IdEndLayers 模块。


    我们完成的第二个任务是封装一个三维打印 NC 代码生成模块 GenNcCode。通过对本书各章节已得到的模型切片、端面识别、路径生成、支撑生成等相关函数输入参数的梳理，我们建立了三维打印工艺参数表。在此基础上，通过对相关函数的合理组织，我们构建了一个综合打印路径生成函数。结合当下常用的
    FDM 三维打印机及其 NC 代码格式，我们封装了一个后处理函数，可将路径转化为三维打印机能够识别的 NC 代码。使用 GenNcCode 模块中的 genNcCode
    函数，针对指定三维模型和工艺参数，我们可以生成相应的 NC 代码。


