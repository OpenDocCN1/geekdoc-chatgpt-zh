  md: '扫描线平移时对其中维护的线段进行增删。以上所说的线段全部来自输入多边形的边。

    参考扫描平面法算法框架，下面我们在 GenHatch 模块中实现一个 calcHatchPoints 函数，其中前缀 calc 为 calculate 的缩写，意为计算。这个函数的作用是使用扫描线法计算多边形序列和平行线序列的所有交点,它的具体实现代码如下：


    | GenHatch.py | GenHatch 模块，calcHatchPoints 函数实现，用于计算平行线和多边形交点 | 9 - 2 |

    |---|---|---|

    | 1 | ...... | # 导入相关库,省略其他代码 |

    | 2 | def calcHatchPoints( polygons, ys ): | # 输入多边形和扫描高度 ys |

    | 3 | segs = [] | # 存放多边形边的线段列表 |

    | 4 | for poly in polygons: | # 遍历多边形,收集所有线段 |

    | 5 | for i in range( poly.count() - 1 ): | |

    | 6 | seg = Segment( poly.point( i ), poly.point( i + 1 ) ) # 根据多边形相邻顶点创建线段 |
    |

    | 7 | seg.yMin = min( seg.A.y, seg.B.y ) | # 计算并保存线段最低点 y 值 yMin |

    | 8 | seg.yMax = max( seg.A.y, seg.B.y ) | # 计算并保存线段最高点 y 值 yMax |

    | 9 | segs.append( seg ) | |

    | 10 | segs.sort( key=lambda s: s.yMin ) | # 根据最低点 y 值对线段升序排序 |

    | 11 | k, sweep = 0, SweepLine() | # 创建扫描线对象 |

    | 12 | ipses = [] | # 交点列表 |

    | 13 | for y in ys: | # 遍历扫描线高度 |

    | 14 | for i in range( len( sweep.segs ) - 1, -1, -1 ): | # 移除不再和扫描线相交的线段 |

    | 15 | if sweep.segs[ i ].yMax < y: | |

    | 16 | del sweep.segs[ i ] | |

    | 17 | for i in range( k, len( segs ) ): | # 从 segs 添加和扫描线相交的线段 |

    | 18 | if segs[ i ].yMin < y and segs[ i ].yMax >= y: | # 将满足最低点小于 y ,最高点大于 |

    | 19 | sweep.segs.append( segs[ i ] ) | # 等于 y 的线段添加至扫描线 |

    | 20 | elif segs[ i ].yMin >= y: | # 直到线段最低点大于等于 y 值, |

    | 21 | k = i | # 停止添加线段,并记录 k 值 |

    | 22 | break | |

    | 23 | if len( sweep.segs ) > 0: | # 如果扫描线中线段数量不为 0, |

    | 24 | ips = sweep.intersect( y ) | # 则调用 SweepLine 的 intersect |

    | 25 | ipses.append( ips ) | # 函数计算扫描线和线段交点 |

    | 26 | return ipses | # 返回得到的二维交点列表 |


    以上 calcHatchPoints 函数的输入包含两个参数,第一个参数是多边形列表 polygons,第二个参数是扫描高度列表 ys。根据填充线的提取原理可知,对这个函数而言,事实上多边形的方向是无关紧要的,并不一定要求满足“外逆内顺”的条件。


    在 calcHatchPoints 函数中,我们首先收集了所有多边形的边,并使用 Python 动态属性特性为 Segment 类的对象临时增加了 yMin
    和 yMax 两个属性,分别用于存储当前线段在 Y 轴方向上的最低点和最高点。根据每条线段 yMin 值,我们首先对线段列表 segs 进行了从低到高排序。对当前扫描高度
    y,我们首先从扫描线中移除已经不再和扫描线相交的线段,即那些 yMax 值小于 y 的线段。在完成了这一步后,我们又从 segs 中向扫描线添加和'
  merge: -1
