  md: '# # 第 1 章 Python 简介


    # ## 1.1 Python 语言概述


    Python 的创始人为 Guido van Rossum，见图 1.1。1989 年圣诞节期间，在荷兰的阿姆斯特丹，Guido 为了打发圣诞的无聊时间，决心开发一种新的解释型脚本语言，作为
    ABC 语言的继承。ABC 是 Guido 参与开发的以教学为目的的编程语言，目标是“让用户感觉更好”，容易阅读、使用和学习，激发人们学习编程的兴趣；遗憾的是，由于自身缺陷，ABC
    语言最终没有流行起来。


    Guido 将新开发的语言命名为 Python，这纯粹是因为他是一部名为 Monty Python’s Flying Circus 的电视剧的忠实粉丝。他希望
    Python 语言能够实现他的理念，成为一种介于 C 语言和 Shell 之间，功能全面、易学易用、拓展性强的语言。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_11_0.png)


    图 1.1 Python 创始人 Guido van Rossum(图片来自网络)


    最初的 Python 完全由 Guido 本人开发，1991 年，第一个 Python 解释器诞生。它用 C 语言实现，并能调用 C 库。Python 从一创建就已具备了类（class）、函数（function）、异常处理（exception），包含表（list）和词典（dictionary）在内的核心数据类型，以及模块（module）为基础的拓展系统。


    Python 将许多机器层面上的细节隐藏，交给解释器处理。Python 程序员可以花更多的时间用于思考程序的逻辑，而不是具体的实现细节。这一特征吸引了广大的程序员，Python开始流行。早期的
    Python Logo 如图 1.2 所示。'
