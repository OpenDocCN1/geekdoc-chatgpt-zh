    \ VtkAdaptor:\n    def __init__( self, bgClr = ( 0.95, 0.95, 0.95 ) ):   # 适配器初始化函数\n\
    \        self.renderer = vtk.vtkRenderer()\n        self.renderer.SetBackground(\
    \ bgClr )\n        self.window = vtk.vtkRenderWindow()\n        self.window.AddRenderer(\
    \ self.renderer )\n        self.window.SetSize( 1000, 1000 )\n        self.interactor\
    \ = vtk.vtkRenderWindowInteractor()\n        self.interactor.SetRenderWindow(\
    \ self.window )\n        self.interactor.SetInteractorStyle( vtk.vtkInteractorStyleTrackballCamera()\
    \ )\n        self.interactor.Initialize()\n    def display( self ):          \
    \                        # 显示函数\n        self.interactor.Start()\n    def setBackgroundColor(\
    \ self, r, g, b ):              # 设置 VTK 场景背景色函数\n        return self.renderer.SetBackground(\
    \ r, g, b )\n    def drawAxes( self, length = 100.0, shaftType = 0, cylinderRadius\
    \ = 0.01, coneRadius = 0.2 ):\n        axes = vtk.vtkAxesActor()             \
    \            # 绘制坐标轴\n        axes.SetTotalLength( length, length, length )\n\
    \        axes.SetShaftType( shaftType )\n        axes.SetCylinderRadius( cylinderRadius\
    \ )\n        axes.SetConeRadius( coneRadius )\n        axes.SetAxisLabels( 0 )\n\
    \        self.renderer.AddActor( axes )\n        return axes\n    def drawActor(\
    \ self, actor ):                          # 绘制 actor 对象\n        self.renderer.AddActor(\
    \ actor )\n        return actor\n    def drawPdSrc( self, pdSrc ):           \
    \               # 绘制 PolyData 类型的 source\n        mapper = vtk.vtkPolyDataMapper()\n\
    \        mapper.SetInputConnection( pdSrc.GetOutputPort() )\n        actor = vtk.vtkActor()\n\
    \        actor.SetMapper( mapper )\n        return self.drawActor( actor )\n \
