    # 10.2.2 模型支撑点计算


    我们得到了针对任意输入 STL 模型的平面投影网格，如图 10.6 所示。接下来我们要在各个网格节点处布置沿竖直方向的直线，依次计算这些直线和模型的交点，并将交点信息存入如图
    10.8 所示的字典结构中，方便后续提取、识别支撑线段。在这一过程中，我们需要解决的核心问题是计算竖线序列和 STL 模型的交点，即计算竖线序列和三角面片序列的交点。


    首先,我们需要解决单条竖线和三角面片求交问题。这是一个简单的几何问题。在前面工作的基础上,我们可以借助一些现成的模块或函数来解决这个问题。在本书第 2 章中,我们已经实现了直线和平面的求交算法（参见
    GeomAlgo 模块中的 intersect 函数）。显然,竖线和三角面片的求交问题是直线和平面求交问题的子问题,因此,理论上,我们只需在现有 intersect
    函数的基础上附加一些限制条件,就能解决竖线和三角面片的求交问题。比如我们可以将竖线作为普通直线、三角面片作为普通平面代入 intersect 函数计算交点,然后判断该交点是否在三角面片内,如果交点在面片内,则竖线和面片相交,此时返回交点,否则竖线和面片不相交。但其实我们也可以反过来思考这个问题,即首先对线面判交,然后再计算交点。要判断空间中任意一条直线和一个三角面片是否相交其实不太容易,但如果这条直线是沿竖直方向的直线,那么它们之间的判交就变得相对简单。在这种情况下,我们只需在
    XY 平面上检查竖线投影点是否落在三角面片的投影内即可。如图 10.9 所示,考虑到这里的竖直线是过网格节点的竖直线,因此我们只需判断网格节点是否落在三角面片的投影内。


    若记其中一个网格节点为 P,对应坐标为 (x, y),空间三角形三个顶点在水平面投影分别为 A、B、C,对应坐标分别为 (xa, ya)、(xb, yb)、(xc,
    yc),要判断点 P 是否落在三角形 ABC 内,我们当然可以应用 GeomAlgo 模块中的 PointInPolygon 函数,但这样做相对比较繁琐。这里我们尝试用一种较为简单的办法来判断任意点
    P 和三角形 ABC 的包含关系。如图 10.10 所示,我们发现:当点 P 在三角形 ABC 内部或边上时,小三角形 PAB、PBC、PAC 的面积之和恰好等于三角形
    ABC 面积;而当点 P 在三角形 ABC 外部时,三个小三角形的面积之和必然大于三角形 ABC 面积。根据以上原理,我们只需分别计算各三角形面积即'
