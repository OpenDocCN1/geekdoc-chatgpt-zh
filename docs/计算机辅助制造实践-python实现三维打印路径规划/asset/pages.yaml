    # 本章小结


    在这一章，我们继续研究了三维打印路径规划中的截交线段拼接问题。由于 STL 模型中三角面片存储的无序性，由此生成的截交线段在平面上也是散乱分布的。针对这一问题，在第
    4 章，我们曾提出了一种线段的暴力拼接算法，但这种方法性能太差，不能胜任实际应用场合。为此，我们在本章提出了另两种线段拼接算法，一种是字典序排序拼接法，另一种是字典查询拼接法。虽然两种方法都和字典有关，但内在拼接原理大不相同。前者依赖对线段端点进行字典序排序，从点的序号中找出相邻的重合点；后者以线段端点坐标为键建立字典结构，从字典的键值对中查询重合点。这两种方法唯一的相同点就是它们都依赖链接点这一数据结构。理论分析和测试结果都表明，本章介绍的两种拼接算法具有线性的运行时间，它们的性能要远远优于暴力拼接法。就两种算法本身而言，字典查询法的性能比字典序排序法的性能更胜一筹。


    # 思考题


    +   1. 为什么 LinkPoint 数据结构既能表示一个点，又能表示一条线段？

