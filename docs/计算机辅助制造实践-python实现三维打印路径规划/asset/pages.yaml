    # ## 9.4 平行路径生成与连接


    在上一节，我们用了大量的篇幅介绍了填充区域分区的原理和方法，创建并实现了一个专门用于将平面多连通区域切分为若干单连通区域的模块。需要再次强调的是，对填充区域进行分区的目的是更方便地连接区域内的填充线。本节我们将重点介绍平行填充路径的生成与连接问题。


    在解决了填充线的生成和填充区域的分区问题之后，我们发现，平行路径的生成与连接问题已经变得非常简单，我们只需在路径的生成流程上做一些控制即可，其主要步骤如下：


    +   - (1) 输入表示待填充区域的平面多边形序列、填充间距及填充角度。

    +   - (2) 根据填充角度对多边形序列进行顺时针旋转，得到新多边形序列。

    +   - (3) 对新多边形序列进行分区，生成一系列单连通区域。

    +   - (4) 根据填充间距在各个单连通区域内生成填充线。

    +   - (5) 将各个单连通区域内的填充线段根据 zig-zag 的连接方式连成一体。

    +   - (6) 根据填充角度对得到的每条连接路径做逆时针旋转，生成平行路径。

    +   - (7) 输出平行路径序列。


    考虑到以上各个步骤涉及的关键算法我们在前几节都已经解决，并且得到了相应的函数，如 splitRegion，genHatches 等，下面我们直接给出平行路径生成与连接的实现代码。


    我们把这部分代码放在一个新建的 GenDpPath 类中（对应 GenDpPath.py 文件），类名为“generate direction–parallel
    toolpath”的缩写，意思是生成方向平行路径，它的具体实现如下：


    | GenDpPath.py | 方向平行填充路径生成与连接 | 9-12 |

