    由以上代码可知，尽管我们之前花了大量的篇幅介绍 Clipper 库，但它实际使用起来却非常简单，这得益于 Angus Johnson 对 Clipper 库的良好封装。在导入相关库后，我们只需几行代码就可完成对平面轮廓的布尔操作：首先创建
    clipper 对象，然后通过 AddPath 添加轮廓，并告知轮廓类型是 PT_SUBJECT 还是 PT_CLIP（前缀 PT 是 Polygon Type
    的缩写，即多边形类型），最后通过调用 Execute 函数获取布尔操作结果。以上代码中我们进行的布尔运算类型为 CT_UNION（并），当然我们也可以尝试在
    Execute 函数中输入 CT_INTERSECTION（交）、CT_DIFFERENCE（差）或 CT_XOR（异或）执行其他类型的布尔操作（几种运算结果如图
    8.14 所示），这里前缀 CT 是 Clip Type 的缩写，即裁剪类型。以上 Execute 函数的第二、第三个参数的作用分别是指定 subject
    和 clip 轮廓的填充类型，包括 PFT_EVENODD、PFT_NONZERO、PFT_NEGTIVE、PFT_POSITIVE，分别对应我们之前介绍的四'
