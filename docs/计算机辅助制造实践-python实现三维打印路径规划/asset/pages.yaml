    intersectTriangleZPlane 中的预处理筛选过程，但其实这是两个层面的事情，这里所说的减少求交次数是在求交函数之外减少求交次数。那么问题是如何预知哪些面片位于载平面附近呢？这一节我们将使用扫描平面（sweep
