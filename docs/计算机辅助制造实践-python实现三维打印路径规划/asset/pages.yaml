    f1，半边 e2 属于面片 f2。这样我们就可以建立半边的拓扑结构：一条半边应该有两个顶点的引用，而且它还应该有一个面片引用，用于保存它所从属的三角面片。此外，大多数情况下，半边总是成对出现的，在半边中，应该还有一个半边引用，用于保存和它分享同一棱边的另外一条半边，即对边。但是，需要注意的是，半边也不总是成对出现的，比如在未封闭
