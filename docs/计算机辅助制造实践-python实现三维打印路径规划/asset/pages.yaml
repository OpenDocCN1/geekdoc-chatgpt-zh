  md: '# 第 9 章 方向平行填充路径生成


    # 引言


    对每层打印区域，三维打印有两种常用的填充方式，一种是轮廓填充，另一种是平行填充。为了兼顾打印精度和效率，在大多时候，我们会混合使用这两种填充方式，即在打印区域边缘处使用轮廓填充以保证轮廓精度，而在其内部使用平行填充以保证填充效率。在上一章中，我们已经对轮廓路径的生成方法做了详细介绍，其核心是平面曲线的偏置算法。在这一章，对一指定区域，我们的任务是在其内部生成平行路径，其核心是平面区域的平行线填充算法，即用一组具有一定倾斜角度的等距平行线去截交区域边界，计算并统计落在区域内部的有效线段。在此基础上，我们只要合理连接这些线段，就能得到平行路径。首先我们来看一下针对平面区域的通用平行填充线计算方法。


    # 9.1 扫描线法填充线生成


    对任一给定的可能包含若干外边界(逆时针)和内边界(顺时针)的平面多边形打印区域，如图 9.1 所示，在该区域内生成平行填充线的原理其实非常简单，步骤如下：


    +   (1) 生成一组指定倾角且能够覆盖整个区域的平行直线序列；

    +   (2) 遍历其中每条直线，计算当前直线和区域的交点；

    +   (3) 根据交点在直线上的奇偶顺序提取填充线段并输出。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_202_0.png)


    图 9.1 平面区域内平行填充线生成原理'
  merge: -1
  img_proc: true
- pgno: 203
  md: '步骤（3）中，在每条直线上，如果交点序号从 0 开始计数，那么从偶数到奇数序号交点连成的线段将落在区域内部，即这些线段是有效的填充线段。


    以上步骤的核心是平行线序列和多边形序列的求交计算。如果不计时间成本，直接采用容易实现的暴力方法求交，则直线和线段的总求交次数将达 m · n，其中 m 为平行线序列中的平行线数量，n
    为多边形序列包含的总顶点数（或总边数）。考虑到我们可能需要为数以千计的切片层生成平行填充路径，以上暴力法显然不是一个很好的选择。那我们该如何减少求交次数呢？


    细心的读者可能已经有所察觉，平行线和多边形的求交问题和我们之前在第 5 章介绍的 STL 模型的截交问题十分相似，而在第 5 章中，我们使用了扫描平面（sweep
    plane）法来加快截交计算的速度。那么这里我们是否可以仿照扫描平面法的框架，设计并实现一种用于平面平行线和多边形间的快速求交算法？答案是肯定的。但在平面上，扫描平面将退化为一条直线，因此我们称这种算法为扫描线（sweep
    line）法。


    # 9.1.1 扫描线数据结构


    使用扫描平面法对 STL 模型进行快速截交包含以下三个要点：一是扫描平面数据结构建立，二是对 STL 模型中的三角面片按照面片最低点的 Z 坐标从小到大进行排序，三是当扫描平面移动时剔除不再与之相交的面片，同时从
    STL 模型中添加新的与之相交的面片。扫描平面法的效率非常高，原因在于它采用了排序和增量的方式维护面片数据。


    在扫描平面法中，扫描平面始终是一张和空间坐标系 Z 轴垂直的平面，这是因为只有在这种情况下，STL 模型中的各个三角面片相对于扫描平面法向的最低点最容易求取，只需直接比较面片顶点的
    Z 坐标即可。如果扫描平面和 Z 轴不垂直，如图 9.2 所示，那我们需要把三角面片各顶点投影到扫描平面的法向上，并在法向上找出顶点投影的最低点。这无疑会增加扫描平面法的实施难度，而且，如果那样，扫描平面法将变得更加难以理解。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_203_0.png)


    图 9.2 扫描平面不和 Z 轴垂直的情况


    让我们把目光转回到针对平面(指 XY 平面)平行线和多边形的交点计算上来。如上所述，为了降低问题难度，我们不妨首先假设平行线相对于 X 轴的角度为 0，即这些平行线'
