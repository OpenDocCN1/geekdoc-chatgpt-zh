    10.6，如果我们将支撑线段总长度乘上单元网格的面积，就可以近似算出支撑空间体积(类似于微积分中体积微元的累加或积分)，其精度和投影网格的精细程度有关，显然，网格尺寸越小，数量越多，得到的支撑空间体积越精确。


