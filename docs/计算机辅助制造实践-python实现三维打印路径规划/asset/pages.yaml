    # 3.4 VTK 适配器的构建


    在前面几节中，我们发现，如果我们要显示一个几何实体，总是要写很多和 VTK 相关的代码，以构建 VTK 显示环境。这个过程非常繁琐，容易出错但又不得不做。这一节我们拟用面向对象编程的方法和原则，对
    VTK 的部分功能做进一步封装，得到一个适合我们的简洁易用的适配器( adaptor )类。


    我们将这个类写在 VtkAdaptor.py 文件中，类名为 VtkAdaptor，详细代码如下：'
