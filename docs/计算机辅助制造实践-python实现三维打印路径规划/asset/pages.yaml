    我们发现，LinkPoint 其实已经具备了线段两端点信息，因此，它也可以用来表示一条线段。这也就是 LinkPoint 既是一个点，又是一条线段的原因。由图
    6.1 及以上代码可知，当我们将一条普通线段转化成链接点保存时，将得到两个不同的链接点和两条完全重合的线段。


    在 LinkPoint 类中，我们还定义了 used 和 index 两个属性。其中 used 属性为布尔型变量，默认值为 False，表示当前链接点在线段拼接过程中是否已经被使用过，显然，如果一个点已经被使用过，它就不应该被使用第二次，否则得到的拼接轮廓将产生拓扑错误。如果我们已经将众多链接点放到了一个列表中，那么
    index 属性就可以用来表示当前点在列表中的序号。一般情况下，在用列表存储数组元素时，我们可以通过列表和已知元素序号很快查询到对应元素。但是当我们只有元素本身时，却很难定位它在列表中的序号（只能通过遍历比对）。借助元素中保存的
    index 属性，我们便能很快定位元素，并找出和它具有相邻序号的其他元素。


    现在，我们已经有了一个 LinkPoint 数据结构，它不太对称，既表示点，又表示线段。它的这些特性，包括 used 和 index 属性，对于我们将要解决的线段优化拼接问题都是至关重要的。下面我们将使用
    LinkPoint 构建一个基于字典序排序的线段优化拼接算法。'
