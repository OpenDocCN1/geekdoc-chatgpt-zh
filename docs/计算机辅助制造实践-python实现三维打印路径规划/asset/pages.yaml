- pgno: 258
  md: '以上我们在 FindSptRegion 类中添加了两个函数，pointInTriangle 和 area，顾名思义，前者的作用是在平面上检测一个点是否落在三角形内，后者是前者的依赖函数，用于计算由给定三个顶点围成的三角形面积。我们主要来看一下
    pointInTriangle 函数，它有 3 个参数，其中 pt 和 tri 分别为待检测点和三角形，第三个参数 err 为检测误差，这里我们给它设置的默认值为
    1.0×10^-7，必须强调的是，这个参数对函数成败至关重要。在以上代码中，我们将 err 参数用在大三角形面积(S)与小三角形面积和(S1 + S2 +
    S3)的比较上，由于面积计算中数值误差的存在，两者实际上很难恰好相等(即便点在三角形内部时)。有兴趣的读者不妨尝试将 err 值设置为 0，看函数是否还能返回正确结果。进一步地，有兴趣的读者还可分析误差
    err 对整个模型支撑点计算的影响(实际上，我们会发现，当 err 不为 0 时，计算结果是偏安全的)。


    我们回到竖线和三角面片的求交问题。根据以上讨论，现在我们可以对指定竖线和三角面片进行判交。如果竖线和面片相交，则进一步调用上述 GeomAlgo 模块中的
    intersect 函数求取它们的交点；如果不相交，则返回空。在处理竖线和面片的求交问题时，我们推荐使用上述方法，即先判交、再求交，而不是直接求交，通过以下介绍我们会发现，我们是有意这样设计的，目的是减少求交计算量。


    现在我们已经解决了单条竖线和单个面片的求交问题，接下来我们要解决的是过网格节点的竖线序列和 STL 模型中的三角面片序列的求交问题，我们需要找出竖线和面片两序列之间的所有交点。显然，如果不计时间成本，这个问题非常简单，我们可以采用暴力方法进行两两遍历求交，其时间复杂度为
    O(m · n)，其中 m 为平面网格节点数，n 为 STL 模型中的三角面片个数。在本书中，我们尽可能避免使用暴力法去解决碰到的问题，这里我们可以结合问题本身特点，对求交算法进行优化。


    在解决竖线序列和面片序列的求交问题时，一般先人为主的思路是将竖线作为主体去和面片序列求交，但这种思路很难发挥竖线的网格特性，算法优化空间不大。如果我们换个角度思考，将三角面片作为主体去和竖线序列求交，那情况可能会有不同。下面我们就尝试遵循这种思路对网格竖线和面片序列的求交算法进行优化。


    根据以上思路，首先，我们得从面片序列中任意取出一个三角面片(记为 W)；对该三角形，我们可以遍历平面网格，并根据以上介绍的面积比较法找出所有落在三角形 W
    投影内的节点；然后我们就可以根据这些节点构造竖线，最后求出所有和三角形 W 相关的交点。理论上，只要遍历整个面片序列，就能求出所有交点。我们发现，使用这种方法，针对一个三角形，先通过判交筛选出有效网格节点，然后仅对有效节点上的竖线求交，可以减少不少求交次数，提高求交效率，我们将求交范围限定在了当前三角面片的投影范围内，具体求交次数和网格密度以及面片投影面积大小有关。


    通过上述方法，尽管我们能够切实降低求交次数，但却无法减少判交次数，需要判交的总次数仍为 m · n。事实上，我们可以对上述方法进一步优化，充分发挥网格特性，减少判交次数。如图
