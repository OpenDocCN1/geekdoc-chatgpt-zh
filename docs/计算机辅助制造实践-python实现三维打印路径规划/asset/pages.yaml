  md: '# # 序


    以新一代信息技术与制造业深度融合为特征的智能制造正在全球引发新一轮工业革命。


    “工欲善其事，必先利其器。器欲尽其能，必先得其法。”在“人工智能+制造技术”的时代来临之际，我们首先需要掌握人工智能的理论方法和编程工具，并将其应用于先进制造技术中。


    本书是“人工智能+制造技术”系列丛书中的一本实战性书籍，读者可以从人工智能编程语言 Python 入手，对计算机辅助制造中三维路径规划进行实践，并应用于三维打印实战中，使读者在掌握了计算机辅助制造知识的同时，也学会了
    Python 编程。


    Python 是人工智能首选的编程语言，也是数据科学和机器学习领域最受欢迎的语言，它也被用于 Web 开发和后端编程，并逐渐应用于移动应用开发领域，甚至已经开始步入嵌入式系统领域。Python
    很容易上手学习，而且第三方库极为丰富，这两种特性对于想要在智能制造领域有所作为的人来说是很有吸引力的。


    广义上的计算机辅助制造（CAM）可以包括使用计算机应用程序为工装设计、计算机辅助设计（CAD）模型准备、计算机数控（CNC）编程、坐标测量机（CMM）检测编程、模拟仿真或后处理定义制造计划，然后在一个生产环境中执行该计划。


    在 CAM 中，根据计算机三维模型创建工具（刀具）的三维路径规划是其重要的核心技术，初学者一般“只知其然，而不知其所以然”，这就为进一步掌握和开发 CAM
    系统带来了困难。而现有学习 CAM 的书籍和资料很少有涉及三维路径规划生成的编程方法介绍，更少有指导 CAM 路径生成实践的教程。


    作者的初衷是设计一套实践教程能够使读者融会贯通计算机辅助制造、Python 编程语言、三维打印这三种智能制造必备的知识，通过本书的学习可以为掌握“人工智能+制造技术”打下扎实的理论和实践基础。


    本书是作者多年从事智能制造技术教学与研究工作的总结，也是作者探索新工科教学实践改革的一个尝试，希望通过人工智能与制造技术交叉融合的实践，能够为国家培养更多的智能制造人才。


    浙江大学制造技术及装备自动化研究所所长、教授 傅建中 2021 年 1 月'
