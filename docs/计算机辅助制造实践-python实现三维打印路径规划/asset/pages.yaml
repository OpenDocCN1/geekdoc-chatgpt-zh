  md: '所示，在这种情况下，我们需要对 v 进行取反操作。那如何判断 P1、P2、P3 所夹内角的优劣性呢？事实上这个问题在上一小节已经涉及（参见图 8.5），但当时我们选择了忽略。这个问题其实也很容易，我们只需对向量
    v1、v2 进行叉乘，如果得到的向量指向 z 轴负向，则 P1、P2、P3 所夹内角为优角，反之则 3 点所夹内角为劣角。根据以上分析，对向量 v 进行方向调整的代码如下：


    ```

    4 If v1.crossProduct(v2).dz > 0      # 如果 v1、v2 叉乘向量指向 Z 轴正向

    5     v.reverse()                   # 则对它们的和向量方向取反

    ```


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_169_0.png)


    # 图 8.9 角平分线上偏置点计算方法


    下面我们需要确定偏置点到 P2 的距离。如图 8.9(a) 所示，我们不妨记偏置点为 Q，Q 在 P1P2 上的投影为 D，则在三角形 QDP2 中，QD
    长度为已知量（即给定的偏置距离），我们只需知道 ∠QP2D 的角度（记为 0，即 theta），便可算出斜边 P2Q 的长度（记为 L）。在此基础上，我们可以得到偏置点
    Q 的坐标。需要说明的是，尽管以上推导是针对图 8.9(a) 所示的优角情况做出的，但同样适用于图 8.9(b) 所示的劣角情况。综上，计算偏置点的具体代码如下：


    ```

    6 theta = v1.getAngle( v2 ) / 2      # 三角形 QDP2 内角 QP2D 角度

    7 L = d / math.sin( theta )          # 三角形 QDP2 内斜边 P2Q 长度

    8 Q = P2 + v.amplified( L )          # 偏置点 Q 坐标

    ```


    现在，按照以上步骤，我们可以计算一个给定多边形任意顶点的偏置点，如果我们把这些偏置点有序地连接起来，就可以得到原始多边形的初始偏置多边形。之所以称其为初始，是因为在这个偏置多边形上，仍然会存在各种各样的问题，包括我们之前介绍过的局部自相交环和全局自相交环。因为生成偏置线的方法不同，因此识别和消除局部自相交环的方法也可能和上一小节介绍的方法有差异。但识别和消除全局自相交环的方法是类似的，因此在这一小节我们不复赘述。


    我们首先来看一下初始偏置多边形上局部自相交环的识别问题。这个问题的解决方案总结归纳起来可分为两种：一是根据偏置点位置识别，二是根据偏置线方向识别。我们先来看一下前者，如图
    8.10 所示，对图中的原始轮廓，当偏置距离较大时，将会在偏置轮廓上出现一个局部自相交环。对偏置点 Q1 ~ Q4，Q1 和 Q4 到原始轮廓的距离大于给定的偏置距离，因此它们是合法的偏置点；但
    Q2 和 Q3 到原始轮廓的距离小于给定的偏置距离，因此'
