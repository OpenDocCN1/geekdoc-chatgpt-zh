    # 6.4 字典查询法拼接优化


    我们在上一节实现了一种基于字典序排序的截交线段优化拼接算法,其核心是依赖 LinkPoint 数据结构和点的字典序排序结果寻找线段之间的邻近关系,它的理论时间复杂度为
    O( nlog(n) ),其中 n 为截交线段数量。这一节我们将另辟蹊径,介绍一种在原理上完全不同的线段拼接算法。这种算法的基础依然是 LinkPoint
    数据结构,它的本质仍然是构建和寻找线段之间的临近关系,只是这次我们会把所有转化得到的链接点放在一个字典对象中,依赖编程语言内置字典类的快速查询功能定位邻近点的信息。注意,虽然本节方法和上节方法中都带“字典”字眼,但两者是完全不同的概念,一个是指字典序,一个是指字典类。


    # 6.4.1 查询法拼接原理


    对平面上的 M 条散乱截交线段,根据上一节介绍,我们可以把它们逐一拆分成一对对相互关联的链接点序列,这里,我们不再考虑对这些点进行任何排序操作,而是让它们以最自然的状态排布在平面上,如图
    6.5 所示。此时,在图中可见,任意两个重合点的序号不再相邻,它们的差值不再为 1,而是一个随机数。显然,在这种情况下,上一节介绍的基于字典序的线段拼接方法将失效。


    让我们把目光聚焦到图 6.5 中的 1 号和 4 号线段上,在图中,这两条线段是相邻相接的,它们的端点分别为 0 号、1 号和 6 号、7 号链接点,其中
