  md: '这层关系，我们从当前面片查询与之相邻的面片就会比较费劲，我们不得不通过顶点的拓扑关系来筛选，即从顶点的 faces 属性中遍历寻找相邻面片。


    对 STL 模型进行拓扑重建的第二个难点在于构建成对半边之间的拓扑关系。在拓扑模型中，大多时候，半边总是成对出现的，它们虽然分享了两个相邻三角面片的公共顶点，却各自属于不同的面片。想要构建成对半边之间的拓扑关系，我们首先得把所有的成对半边找出来。这个问题其实又有点类似于我们在上一小节介绍的冗余顶点的消除问题，不过相对来说，这个问题稍微难一点，因为一条半边有两个顶点，而且这两个顶点是无序的。对任意一条半边，我们可以对它的顶点按字典序排序，然后把较小的点坐标放在前面，较大的点坐标放在后面，共同组成一个
    6 维坐标。


    我们在定义 TEdge 类的时候已经做好了准备，其中的 toTuple 函数正是为此准备的。对任意两条对边，如果它们的 6 维坐标一致，那么它们就是一组对边，反之则不是。


    | 键: 半边6维坐标 | 值: 列表 [ TEdge ] |

    |---|---|

    | \(X_0, Y_0, Z_0, U_0, V_0, W_0\) | [ edge 0, edge 1 ] |

    | \(X_1, Y_1, Z_1, U_1, V_1, W_1\) | [ edge 2, edge 3 ] |

    | ... | ... |

    | \(X_k, Y_k, Z_k, U_k, V_k, W_k\) | [ edge p, edge q ] |


    图 7.10 半边字典 egDic 键值结构


    据上所述，我们需要建立一个半边字典，我们不妨记这个字典为 egDic，其中前缀 eg 为 edge(边)的缩写，字典的键为半边的 6 维坐标，值为半边列表，如图
    7.10 所示。大多数情况下，字典的值列表中应包含两个元素，即半边应成对出现，不过也不排除因 STL 模型未封闭或缺陷导致的半边单个出现的情况。


    对于 STL 模型中任意三角面片 ABC，在得到它的半边 \(e_1, e_2, e_3\) 之后，我们可以分别检查 \(e_1, e_2, e_3\) 的
    6 维坐标是否在 egDic 中。以半边 \(e_1\) 为例说明，如果 \(e_1\) 的 6 维坐标不在 egDic 中，则以 \(e_1\) 的 6
    维坐标和包含 \(e_1\) 一个元素的半边列表为键值对加入字典 egDic 中；反之，如果 \(e_1\) 的 6 维坐标已经在 egDic 中，则直接将
    \(e_1\) 添加至它的 6 维坐标对应的半边列表中。对半边 \(e_2\) 和 \(e_3\)，我们可以按照相同的方法处理。当我们遍历完 STL 模型中的所有三角面片，对得到的半边字典
    egDic，我们可以遍历字典中的每个值，即每个列表，将列表中的 0 号半边的对边(即 TEdge 的 OE 属性)设置为 1 号半边，并将 1 号半边的对边设置为
    0 号半边。当然，如果列表中只有一个元素，即一条半边，我们不做任何处理，这表明模型在此处未封闭。'
