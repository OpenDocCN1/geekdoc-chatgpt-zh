- pgno: 211
  md: "代码如下：\n\n```\n...... # 导入相关库，省略其他代码\ndef genSweepHatches(polygons, interval,\
    \ angle): # 定义均匀填充线生成函数\n    mt = Matrix3D.createRotateMatrix('Z', -angle) # 旋转矩阵,\
    \ matrix to, 去\n    mb = Matrix3D.createRotateMatrix('Z', angle) # 旋转矩阵, matrix\
    \ back, 回\n    rotPolys = [] # 存储旋转后多边形\n    for poly in polygons: # 遍历，旋转多边形，作用\
    \ mt\n        rotPolys.append( poly.multiplied(mt) )\n    yMin, yMax = float('inf'),\
    \ float('-inf') # 获取旋转后多边形最低和最高值\n    for poly in rotPolys:\n        for pt in\
    \ poly.points:\n            yMin, yMax = min(yMin, pt.y), max(yMax, pt.y)\n  \
    \  ys = [] # 存储扫描线高度\n    y = yMin + interval # 起始高度\n    while y < yMax: # 根据输入间距生成高度列表\
    \ ys\n        ys.append(y)\n        y += interval\n    segs = genHatches(rotPolys,\
    \ ys) # 对旋转多边形生成填充线段\n    for seg in segs: # 遍历，旋转填充线段，作用 mb\n        seg.multiply(mb)\n\
    \    return segs # 最后返回回旋转后的填充线列表\ndef genHatches(polygons, ys): # 填充线生成函数，不涉及旋转\n\
    \    segs = []\n    ipses = calcHatchPoints(polygons, ys) # 生成填充线交点，二维列表\n   \
    \ for ips in ipses: # 根据填充线奇偶提取原则从交点\n        for i in range(0, len(ips), 2):\
    \ # 列表中提取填充线\n            seg = Segment(ips[i], ips[i+1])\n            segs.append(seg)\n\
    \    return segs # 返回填充线段，一维列表\n```\n\n以上 genSweepHatches 函数有 3 个输入参数，其中 polygons\
    \ 就是需要被填充的多边形，interval 是填充间距，angle 是填充线相对于平面坐标系 X 轴的倾角。因为是均匀填充，因此所有相邻填充线间的间距相等。在这个函数中，我们首先创建了两个旋转矩阵变量：mt\
    \ 和 mb，其中 mt 用于将几何实体顺时针旋转指定角度，而 mb 用于将几何实体逆时针旋转指定角度。开始时，我们对输入多边形列表中的每个多边形作用矩阵\
    \ mt，得到旋转多边形列表。在生成均匀的扫描线高度列表 ys 后，我们通过调用 genHatches 子函数生成了相对于旋转后多边形的填充线。最后，我们对这些填充线作用矩阵\
    \ mb，得到目标多边形的填充线。\n\n以上 genHatches 函数的作用是根据输入多边形和扫描高度列表生成填充线段列表。其核心是调用 calcHatchPoints\
    \ 生成多边形和平行线的交点列表，然后根据填充线奇偶提取原则将交点列表转化为填充线列表。我们可以看到，这里 genHatches 函数和"
