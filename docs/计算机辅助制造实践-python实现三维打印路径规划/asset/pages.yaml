  md: '径,可以平行路径填充为主。在图 10.5 中,我们给出了支撑填充路径的主要形式,即区域内部以平行路径填充,在区域边界,填充一圈(或几圈)轮廓路径。这里在支撑区域周围填充轮廓路径的目的是在一定程度上加固支撑强度,避免支撑材料在高度增长的时候倒塌,特别是当支撑区域内部的上下层的填充角度保持不变时,如图
    10.5(c)。相对于模型部分的填充路径,支撑部分平行路径之间的间距可以设置得更大,这样有利于后期我们将支撑从模型上剥离。


    # 10.3.1 平行填充扩展


    在本书第 9 章,我们封装了一个名为 GenDpPath 的类(对应接口函数为 genDpPath),用于生成指定平面区域内的平行填充路径(包括平行行线之间的连接)。那在这里,这个类能否直接为我们所用,用于生成支撑区域内的平行填充路径呢?
    很遗憾,答案是否定的!


    在第 9 章封装 GenDpPath 类时,我们默认了两个条件:一是模型切片上下层之间呈正交(或一定的角度差)填充,以形成上下层之间的编织效果,提升打印强度;二是同一层切片上填充间距不大,实际打印过程中上层打印材料在下层填充缝隙间会稍有下陷变形,如图
    10.20(a),但不至于影响整体打印效果。在这两个默认条件下,我们在设计 GenDpPath 类时并没有过多地考虑上下层平行线(路径)之间的对齐问题。理想情况下,隔层,如图
    10.20(c)或相邻层,如图 10.20(d)平行填充线最好能够对齐,特别是对于支撑部分填充路径来说。考虑支撑填充路径间距大,且可能采用同向填充策略,此时如果上下层填充线不对齐,则在实际打印过程中将因上层材料无法依附而导致打印失败,如图
    10.20(b)。根据以上分析,如果我们仍然希望使用 GenDpPath 类来生成支撑填充路径,那么我们需要对 GenDpPath 类做一些维护和升级工作。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_273_0.png)


    图 10.20 上下层材料交叉和对齐填充关系


    让我们首先来回顾一下 GenDpPath 类的实现。我们知道,在 GenDpPath 类的核心流程控制函数 generate 中(参见代码 9-12),我们是用
    ys 这个变量来控制当前切片层上的平行线位置和间距的,ys 本身是一个实数序列。在 generate 函数中,对每个切片层,我们都会根据当前层填充区域的轮廓包络生成一个独立的
    ys,这是导致如图 10.20(a) 和 10.20(b)所示的上下层平行路径间无法对齐的根本原因。要想达到上下层路径对齐的目标,只需在 generate
    函数中对所有切片层使用一个唯一的 ys 即可,而这个唯一的 ys 可以根据三维模型的极限坐标生成。根据这一原理,在 generate 函数的基础上,我们在
    GenDpPath 类中又添加了一个功能相似的函数,并为其取名为 generateEx(其中 Ex 为 extend 缩写,表明两个函数之间的扩展关系),它的具体实现如下:'
