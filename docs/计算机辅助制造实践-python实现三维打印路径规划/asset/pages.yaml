  md: '为 \(a_x\)。同理, 在 Y 方向上, 通过分析节点 A、C 上的支撑点影响范围, 我们可以认定矩形的高度尺寸为 \(a_y\)。根据以上假设及分析,
    我们知道, 一个支撑点的影响范围为一中心在该点的轴平行矩形, 且矩形的在 X、Y 方向上的边长分别为 \(a_x, a_y\)。


    下面我们解释为什么将支撑点的影响范围设定为矩形。首先, 这是一种偏安全的设定。我们知道, 对三维模型支撑生成来说, 如果在需要添加支撑的地方没有添加支撑可能导致打印过程中模型坍塌,
    但如果在某些不需要添加支撑的地方添加了冗余支撑, 则并不会对打印过程带来不良影响。因此, 对支撑点的影响范围设定来说, 即便矩形内某些新支撑点对应的三角面片是安全面片,
    我们也能接受这样的结果。其次, 矩形设定更易于相邻区域融合。如图 10.15 所示, 不失一般性, 其实我们也可以将支撑点的影响范围设定为圆形。但是, 在对相邻支撑点的影响范围进行融合时,
    我们发现, 两个圆形之间容易留下缝隙, 为了覆盖这些间隙, 我们不得不将圆的直径设置得很大, 但这样会带来更多不必要的冗余支撑。而如果使用矩形设定, 我们能够以较小的尺寸实现相邻支撑点影响范围的无缝融合。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_265_0.png)


    图 10.15 切片支撑点影响范围圆形和矩形设定优劣对比


    使用支撑点影响范围的矩形假设, 让我们回过头来看一下截平面上切片支撑点到支撑区域的转化问题。如图 10.16 所示, 对平面上的一系列支撑点, 首先生成各个支撑点的影响范围矩形,
    每个矩形的长宽尺寸分别为 \(a_x\) 和 \(a_y\)。然后我们需要对各个孤立的矩形区域进行“融合”操作, 生成一个(或多个)支撑区域。那如何融合矩形区域呢?
    很简单, 布尔运算! 我们发现, 矩形区域的融合问题就是求这些区域的布尔并运算(参见图 8.14)。而关于布尔运算, 我们在本书第 8 章已经介绍了一个非常强大的库——Clipper,
    而且, 我们还构建了 Clipper 库的适配器类 ClipperAdaptor, 方便我们交换不同的多边形数据。因此, 这里原则上只要我们将上述各个孤立矩形输入
    Clipper 库中的布尔并运算函数, 就能输出我们在这一小节开头所要求的支撑区域。下面我们在 FindSptRegion 类中添加支撑点到支撑区域的转化函数,
    函数名为 genRawSptRegion, 具体实现如下：


    | FindSptRegion.py | 寻找支撑区域类:在截平面上将切片支撑点转化为初始支撑区域 | 10 - 6 |

    |---|---|---|

    | 1 | ...... | # 导入相关库 |

    | 2 | class FindSptRegion: | |

    | 3 | ...... | # 忽略类中其他代码 |'
