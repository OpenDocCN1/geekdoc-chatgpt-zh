- pgno: 147
  md: '进一步地，我们可以顺藤摸瓜，不停追踪邻近面片，从而找出拓扑模型中和截平面相交的所有面片。在对以上面片的追踪过程中，由相邻、相接面片求得的截交线段也必然是相邻、相接的，也就是说，这些截交线段是天然有序的，而非非散乱无序，这样就可以省去线段拼接环节。


    以上我们对拓扑模型切片过程的描述仅仅浮于表面，即便是我们已经得到了拓扑模型，对它的切片也并非真的只是寻找相邻面片而已，在这一过程中，我们还需要解决若干关键问题。而我们需要解决的第一个问题就是寻找“种子”面片，即寻找和截平面相交的第一个面片。


    # 7.4.1 种子面片寻找


    我们不妨设当前的截平面高度为 z。这里截平面依然为一张平行于坐标系 XY 平面的平面，可在 z 方向上根据需要平移。我们现在需要做的就是在拓扑模型中寻找一个面片，即种子面片，使其满足和截平面相交的条件。这一步是对拓扑模型进行切片的关键，因为如果没有第一个面片，我们将无法追踪随后的相邻面片。


    如果我们不计时间成本，那么直接在拓扑模型中寻找一个种子面片并非难事。我们只需遍历拓扑模型中的所有面片，检查当前面片是否和截平面相交，如果相交，则设该面片为种子面片，并退出遍历循环。如果这样做，在以上遍历过程中，我们也并不会真的去求每个面片和截平面的截交线，因为这样可能会消耗大量的计算时间；我们只需判断每个片面的最低点和最高点组成的范围
    [ z Min, z Max ] 是否包含截平面的高度 z 值，如果包含，说明当前面片可能和截平面相交。


    假如我们通过以上方法找到了第一个种子面片，并且根据这个种子，我们陆续找出了一圈连续相邻的面片，根据这些面片我们也求得了一条封闭轮廓。可是，当一个截平面去截交模型时，它们之间可能存在不止一条封闭轮廓。因此，我们有必要去寻找第二个种子面片。为此，我们不得不又去遍历一遍拓扑模型中的所有面片。当然，为了不至于重复找到之前被使用过的面片，当一个面片被使用过后，我们必须设置它的
    used 属性（即 TFace 类中的 used 属性）为 True。这里一个面片被使用过的意思是它和截平面的交线段已经被添加至轮廓。根据第二个种子面片，在得到第二条截交轮廓线之后，我们还需接着在拓扑模型中寻找第三个种子面片、第四个种子面片……直到模型中所有可能和截平面相交的面片的
    used 属性均被设置为 True，即找不到种子为止。


    在第 6 章中，我们曾做过这样的统计，对于一个大约包含 33 万个三角面片的 STL 模型（参见图 5.8 中的 monk 模型）来说，在切片后，平均每层得到的截交线段条数约为
    988 条，即在每个切片层上，每张截平面平均约和 1000 个三角面片相交。针对这个例子，如果按照以上方法直接在拓扑模型中寻找种子面片，那么每次为了这 1000
    个有效的面片，我们就不得不去遍历 33 万个面片，每次都多做了 330 倍的无用功。由此可见，直接从拓扑模型中寻找种子面片并不是一种最优的方式。我们应该努力去避免对整个拓扑模型的所有面片进行遍历。


    针对种子面片的寻找问题，为了加快寻找速度，避免做太多无用功，我们可以采取一种“分而治之”的方式。通过以上分析，我们注意到，在每层切片上，截平面仅和有限个三'
