    图 1.2 Guido 兄弟设计的早期 Python logo (图片来自网络)


    经过近 30 年的发展，Python 逐渐完善，拥有众多优点，包括：


    +   1. 简单易学


    Python 崇尚优美、清晰、简洁，是一种代表简单主义思想的语言，拥有极其简单的语法，即便是没有任何编程基础的人，也非常容易上手；且 Python 适合阅读，就像是在读英语一样。


    +   2. 免费开源


    Python 是 FLOSS( 自由/开放源码软件 )之一，用户可以自由地发布这个软件的拷贝、阅读它的源代码、对它做改动、把它的一部分用于新的自由软件中。


    +   3. 丰富的库


    Python 类库非常全面，对大多数功能一般都有现成的类库可以使用；如果一个功能比较特殊，标准库没有提供相应的支持，那么，很大概率也会有相应的开源项目提供了类似的功能。


    +   4. 可移植性


    同一份 Python 代码，无需大的修改，便可运行在众多平台上，包括 Linux、Windows、FreeBSD、Macintosh、Solaris、OS/2、Amiga、Windows
    CE 甚至还有 PocketPC、Symbian 以及 Google 的 Android 平台。


    Python 有许多优点，但它仍是一门发展中的语言，目前也存在一些缺点，如运行速度慢、多处理器支持差、高低版本不兼容等。特别是高低版本不兼容的问题，Python
    2.0 和 3.0 两个版本平行发展，往往会让用户在选择时莫衷一是。至于运行速度慢问题，随着计算机硬件的不断升级，对用户的困扰逐渐减少。


    Python 的优点使得它在很多领域有了应用。如云计算开发 ( OpenStack )、Web 开发 ( Django )、科学运算 ( NumPy、SciPy、Matplotlib
    )、人工智能等。特别是人工智能领域，随着 AI 再次兴起，Python 从众多编程语言中脱颖而出，成为人工智能的标准语言。


    简单易学是本书选择 Python 作为编程语言的主要原因。“ Life is shore，use P ython ！”


