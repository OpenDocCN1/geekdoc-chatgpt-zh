  md: '# # 第 3 几何可视化平台搭建


    # ## 引言


    在上一章计算几何库实现过程中，大家可能会有这样的体会：我甚至都看不到那些几何实体，怎么验证结果是对是错？到现在为止，我们还缺乏对这些类或算法结果的直观感受，缺乏一个可以对点、线、面等实体类进行实时显示的工具。这一章的任务就是引导大家如何用
    Python 语言，结合 VTK（visullization toolkits），搭建一个几何实体的可视化平台。


    # ## 3.1 VTK 概述


    VTK 是一个开源、跨平台、支持并行处理的免费软件系统，主要用于计算机图形学、建模、图像处理、体素渲染以及科学可视化。VTK 最早由 GE 研发部的三位研究人员（Will
    Schroeder、Ken Martin、Bill Lorensen）在闲暇时间合作开发完成。一经发布，VTK 很快便建立了用户社区，并迅速在学术研究和商业应用领域得到重用。目前，VTK
    由 Kitware 公司维护升级。


    VTK 是在三维图形库 OpenGL 的基础上采用面向对象的设计方法发展起来的，其内核使用 C++构建，包含大约 250000 行代码、2000 多个类。这些类的相互继承关系或类中函数的官方说明文档可在
    https://vtk.org/doc/nightly/html/index.html 在线查看，该文档以 C++语言的形式对类或函数进行说明。此外，VTK
    还包含几个转换接口，具有良好的可移植性，可以通过 Java、Python、Tcl/Tk、C#等其他编程语言自由地使用。


    尽管 Kitware 已经出版了 _VTK User''s Guide_ 和 _Visualization Toolkit_ 两本有关 VTK 的著作，但目前在国内仍然很难找到
    VTK 的系统性中文学习书籍或资料，只有一些较为零碎的学习资料可在国内相关论坛或博客中找到。本书的定位不是关于 VTK 的系统性学习资料，而是 VTK 的启蒙学习，对计算机图形学研究或应用有兴趣的读者可进一步阅读
    VTK 的 C++源码或官方英文原著。


    VTK 是一个功能丰富的庞大的软件系统，但在 Python 下，VTK 的安装非常简单，无需编译、配置等繁琐的工作，我们只需在 Windows 的命令窗口输入“pip
    install VTK”命令即可安装，安装完成后可直接使用。目前，VTK 最新版本的版本号为 8.1.2，安装完成后大小约 80MB。


