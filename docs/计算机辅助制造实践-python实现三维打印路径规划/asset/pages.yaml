  md: '取到最近距离的两个点。首先我们需要明确的一点是两条多段线的最近距离不一定就在两个顶点处取到，它也有可能在两条边线段上取到，而后一种情况涵盖了前一种情况，如图
    8.31 所示。如果不计时间成本，那么这个问题很容易解决，我们只需构造一个双重循环，分别遍历两条曲线中的所有边，两两计算线段之间的距离，从中找出最小距离及取到最小距离时的边序号即可。显然，这种方法的时间复杂度为
    O( mn )，其中 m、n 分别为两条多段线的边数，这是一种平方量级的时间复杂度。考虑到在偏置曲线连接过程中( 特别是还有很多切片层)我们需要进行密集的多段线最近距离计算，因此，这种方法不太可取。


    在实际应用背景中,既然快速、精确地计算两偏置曲线的最近点这么困难,我们不妨退两步。理论上,两多段线的最近距离在两边线段上取到,但如果真的那么做,在每一次边对距离单元的计算中,我们需要讨论多种情况,如一条线段的端点投影是否落在另一条线段上,如果是,那么我们可能需要在该投影处将线段一分为二,并以此点作为连接点,这将会使单元计算和连接问题本身变得非常繁琐而费时。方便起见,我们首先直接在两多段线的顶点处取最近点。通过这种方法得到的最近距离和真实的最近距离偏差不会太大。接着,我们直接在其中一条多段线上人为指定一个点为最近点(
    方便起见,指定起点),这样做可为我们节省一重循环,我们只要根据这个点在另一条多段线上遍历寻找它的最近点即可。尽管如此,注意,这里的第二重循环是必不可少的,否则如果随便指定第二条多段线上的最近点,可能会出现连接线段穿越轮廓区域的风险。通过这两步的妥协,我们可以将最近点的求取过程降到线性时间复杂度。


    在解决了任意两条曲线“最近点”的求取问题之后,下面我们给出 GenCpPath 类的剩余部分,包括 linkToParent 和 linkLocalOffsets
    两个函数,其中 linkToParent 是 linkLocalOffsets 的依赖函数,linkLocalOffsets 的功能是将局部连续偏置曲线连成一体。两个函数的具体实现代码如下:


