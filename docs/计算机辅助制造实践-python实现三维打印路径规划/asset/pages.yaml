    Clipper。为了克服多边形轮廓数据格式的兼容性问题，我们构建了一个 Clipper 库的适配器。在此基础上，我们首先生成了边界轮廓的连续偏置曲线，然后通过识别各条偏置曲线之间的包含关系，将处于内部的直系子曲线逐条连接到直系父曲线上，从而得到若干连成一体的路径曲线，这些路径曲线就是我们所求的轮廓填充路径。我们将生成轮廓路径的流程和功能封装成一个
