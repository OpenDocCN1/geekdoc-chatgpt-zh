- pgno: 52
  md: '段求交，获取交点个数，进而统计穿过次数。但仅仅这样是不够的，因为交点个数并不等价于穿过次数，如果射线在线段端点处相交，同一位置的交点将被统计 2 次。这在某些情况下是对的，如图
    2.14 中的情况 1 和情况 2；但在另一些情况下是错的，如图 2.14 中的情况 5。为了避免上述情况的发生，我们在设计算法时，将射线和多边形的求交问题分成两部分：一是射线和不含两端点的线段求交，二是射线和多边形顶点求交。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_52_0.png)


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_52_1.png)


    我们需要重新思考射线和线段（不含两端点）的求交方法。但我们还是会参照两直线求交的方法，首先计算出参数 t1、t2，其中 t1 对应射线，t2 对应线段。如果
    t1 = 0，表明交点落在射线起点，此时可以马上判定点在多边形上，无需进一步计算。如果 t1 > 0 且 0 < t2 < L，其中 L 为线段长度，那么射线和线段（不含两端点）相交，此时射线穿过多边形的次数加
    1。


    接下来我们要考虑射线恰好穿过多边形顶点处的情形。这个问题比上一个问题复杂一点，需要判断顶点两边线段的走势。如果两边在射线同一侧，那么可以认为穿过次数为 0（或
    2），如图 2.14 中的情况 1 和情况 2；如果两边分别在射线两侧，那么认为穿过次数为 1，如图 2.14 中的情况 5；但是如果两边中有一边和射线重合，如图
    2.14 中的情况 3 和情况 4，则需进一步判断下一条边的位置，这样会让问题处理起来非常棘手。


    我们可以退一步思考，首先统计所有顶点位于射线上的线段，如果某条线段和射线重合，则认为该线段两端点都不在射线上。然后对这些线段进行配对，如图 2.15 所示，我们可以不必理会它们之间的相对位置，直接对一条位于射线一侧的线段和一条位于射线另一侧的线段进行配对，配对成功后穿过次数加
    1。对那些位于射线同一侧的线段对，认为穿过次数为 0，或者认为穿过次数为 2，但这对最终穿过次数的奇偶性不会造成影响。'
