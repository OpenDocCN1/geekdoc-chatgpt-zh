  md: '核心切片函数，它在类的初始化函数中被触发启动，不过我们在这里只对 slice 函数进行了声明，并未具体实现。


    此外，我们在 TopoSlicer 类中实现了两个函数，分别是 findSeedFace 和 findNextFace。其中前者的功能是在扫描平面法的框架下，在和当前截平面相交的三角面片（即参数
