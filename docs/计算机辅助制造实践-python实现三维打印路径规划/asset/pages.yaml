- pgno: 174
  md: '何事件是否发生有时起着决定性作用，如线段是否相交、点是否在多边形内部等。采用整型数据运算从某种程度上来说可以规避因截断误差带来的误判风险，事实也证明在
    Clipper 中运用整型点能够提升算法的稳定性和鲁棒性。


    在 Python 环境下，如果我们使用命令行的方式安装 Clipper 库，那么库中最为核心的类是 Pyclipper 类。它封装了几个关键接口函数 AddPath/AddPaths、Execute/Execute2，其中
    AddPaths 是 AddPath 函数的复数形式，用于一次性添加多条轮廓，Execute2 是 Execute 的重载函数，它们的功能相同但输出轮廓的组织形式有所差异。下面我们结合具体实例来看一下
    Pyclipper 类的使用方法，我们把测试代码写在 Test_clipper.py 文件中。


    | Test_clipper.py | Python 版的 Clipper 库布尔运算测试 | 8 - 3 |

    |---|---|---|

    | 1 | from pyclipper import * | # 导入 pyclipper 模块 |

    | 2 | from VtkAdaptor import * | # 导入可视化模块 |

    | 3 | def tuplesToPoly( tuples ): | # 定义将元组序列转化为 Polyline 函数 |

    | 4 | poly = Polyline() | |

    | 5 | for pt in tuples: | |

    | 6 | poly.addPoint(Point3D( pt[0], pt[1], 0 )) | # 多边形 z 坐标始终为 0 |

    | 7 | poly.addPoint( poly.startPoint() ) | |

    | 8 | return poly | |

    | 9 | if __name__ == ''__main__'': | # 测试 main 函数入口 |

    | 10 | subject = [ (0,0), (100,0), (100,70), (0,70) ] | # 创建 subject 轮廓 subject，正方形
    |

    | 11 | clip = [ (30,50), (70,50), (70,100), (30,100) ] | # 创建 clip 轮廓，长方形 |

    | 12 | clipper = Pyclipper() | # 定义 Pyclipper 对象 clipper |

    | 13 | clipper.AddPath( subject, PT_SUBJECT, True ) | # 向 clipper 添加 subject 轮廓
    |

    | 14 | clipper.AddPath( clip, PT_CLIP, True ) | # 向 clipper 添加 clip 轮廓 |

