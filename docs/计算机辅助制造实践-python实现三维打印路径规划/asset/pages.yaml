    lp1 < lp2,则返回 -1 ; 如果 lp1 = lp2,则返回 0 ; 如果 lp1 > lp2,则返回 1 。为了方便记忆，我们可以把 lp1 和
    lp2 当作两个实数，显然如果 lp1 < lp2,则 lp1-lp2 < 0 ,即结果为负( -1 ) ; 而如果 lp1 > lp2,则 lp1-lp2
