- pgno: 5
  md: '# 前 言


    计算机辅助制造（computer-aided manufacturing，CAM）是一门制造工程技术和计算机技术紧密结合、相互渗透而发展起来的综合性学科，是计算机辅助设计（computer-aided
    design，CAD）的后道工序，是国民经济及国防军工的基础支撑技术，其发展水平直接体现了一个国家制造业的现代化水平。广义的计算机辅助制造是指利用计算机手段完成产品从原材料到成品的整个生产制造过程；而在学术界，计算机辅助制造一般特指刀具路径规划，即输入零件和工艺信息，输出刀具运动轨迹和相应数控程序（如
    G 代码）。中国是一个制造业大国，相应的，中国也是一个 CAM 技术需求和应用大国。


    目前，国内 CAM 技术的发展尚处于起步阶段。常用的 CAM 软件大都从国外引进，如 PowerMILL、Cinatron、MasterCAM、UG、CATIA
    等，这些软件功能强大、性能稳定，但价格昂贵，且核心技术受制于人。值得庆幸的是，近年来，国内也涌现了一批优秀的国产 CAM 软件，但由于种种原因，这些软件尚未普及，用户接受程度不高。


    高校是培养计算机辅助制造应用和研发方面人才的摇篮。目前，国内各大高校的机械类专业都已将计算机辅助制造课程纳入培养计划，将其设置为专业必修或选修课程。课程体系及配套教材大致涵盖计算机辅助制造基础概念讲解、机械零件建模、CAM
    软件应用、数控工艺与加工实践等内容，但极少涉及 CAM 路径规划算法实现层面的内容。当前国内高校在计算机辅助制造教学方面的不足之处在于过分侧重职业技能培训，无法满足国内对机械人才、特别是
    CAM 软件研发方面人才的培养需求。


    本书的定位是计算机辅助制造底层算法的设计、开发、应用及实践。面向的读者为计算机辅助制造从业人员，尤其面向高校机械类专业老师、高年级本科生或研究生。本书试图引导读者运用所学的代数、几何等数学理论，以及机械制造、数控、计算机编程等技术，针对数控车床、数控铣床、三维打印机、工业机器人等对象，研究刀具路径规划关键算法，独立开发一套小型实用的
    CAM 系统，最后在数控设备上对 CAM 系统及生成的路径进行加工验证。为方便读者理解、学习和实践，本书以三维打印这一当下时髦的数控设备为例，针对三维打印路径规划流程，从切片生成、路径生成、支撑生成到代码生成等环节，提出了一系列通用、简洁、高效、易于理解和实现的
    CAM 算法。


    本书的特色之一是选用 Python 作为路径规划算法的编程实现语言。这在本书写作之初其实是一个相当艰难的抉择。一方面，Python 语言本身具有语法简单、容易上手、免费开源等特点，随着云计算、网络爬虫、人工智能等技术发展，Python
    这门小众语言摇身一变，成为众多编程语言中的“网红”，近年来异常火爆。另一方面，Python 语言又经常被人诟病运行速度慢，这是 Python 与生俱来的缺陷，主要是由它的动态性和多功能性决定的。CAM
    路径规划是一项计算密集型任务，需要处理大量的矩阵相乘、几何求交、搜索查询等'
