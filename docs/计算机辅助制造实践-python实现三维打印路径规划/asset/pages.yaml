- pgno: 207
  md: '扫描线相交的线段，即那些 yMin 值小于 y 且 yMax 大于等于 y 的线段；在这个过程中，如果当前线段的 yMin 大于等于 y 值，则停止向扫描线添加线段，同时记录当前线段在
    segs 列表中的序号 k。我们发现，k 是扫描线法高效的关键所在，如果没有这个变量，对每个扫描高度，我们不得不从线段列表 segs 的首个元素开始遍历，这样对
    segs 的排序就显得毫无意义。最后，我们使用 SweepLine 类的 intersect 函数计算扫描线中线段和扫描线的所有交点，并将这些交点保存到 ipses
    中。函数的返回为 ipses，注意，这是一个二维列表，其中第一个维度表示扫描高度序号，第二个维度表示某一扫描高度上的所有交点。


    让我们再来看一下 calcHatchPoints 函数中的向扫描线添加新线段的条件。在代码中，对某一扫描高度 y，我们仅将满足 yMin < y 且 yMax
    >= y 条件（记为条件 1）的线段添加至扫描线，即小于时等号取不到，大于时等号能取到。那为什么条件不是 yMin <= y 且 yMax >= y（记为条件
    2），小于大于同时取到等号呢？这样似乎更加合理。


    如果使用条件 2，只要某线段落在 y 线上，那么我们就将该线段添加至扫描线，包括线段上端点落在 y 线上、下端点落在 y 线上、中间被 y 线穿过以及上下两端点都落在
    y 线上（即线段和 y 线重合）4 种情况，如图 9.4 所示。从某种意义上来说，应用条件 2 是合情合理的，它会收集所有和当前 y 线相交的线段。但是，当
    y 线经过线段端点时，由于线段的连续性，重合的端点将被收集两次，这无疑会增加后续根据交点奇偶属性来提取填充线的难度。类似于我们对图 9.3 的解释，条件 2
    并不会影响图 9.4 中 P1、P2、P3、P4、P5、P6 以及 P7、P8 这 4 组点对在提取填充线时的结果，即便我们保留这些点对，最终也能提取到几何上正确的填充线，因为在这些点上，y
    线并未真正“穿过”轮廓。但是，条件 2 会影响图中 P9、P10 在提取填充线时的结果，如果不加处理，我们将提取到位于多边形区域外的填充线（即线段 P10
    P11），这显然是错误的。有一点需要说明的是，如果线段和直线重合，我们认为它们不相交，这也是为什么图 9.4 中在 P5、P6、P7、P8 处只有一个点的原因。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_207_0.png)


    图 9.4 根据条件 2 获得的扫描线上的交点


    如果执意要使用条件 2，我们当然可以采取一定的措施进行补救，比如对以上 P9、P10 点对进行合并操作。但这又将带来一个新的问题，我们应该满足什么条件才能合并重合交点对？如果随意合并点对（如
    P1、P2），也将导致后续填充线提取出错。我们可以想象，合并的条件和 y 线是否穿过轮廓有关。要判断 y 线是否穿过轮廓，我们不得不去判断重合交点对两侧的线段和
    y 线的相对位置，只有它们在 y 线不同侧时，我们才能认为 y 线穿过轮廓，进而才能去合并相应交点对。做出这些判断需要相应数据结构的支撑。我们已经'
