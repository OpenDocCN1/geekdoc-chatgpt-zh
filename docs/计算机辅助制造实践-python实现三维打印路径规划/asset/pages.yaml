  md: "我们将以上步骤封装成了一个 createLpDic 函数，我们将该函数写在 LinkSegs_dlook 类中，对应的文件为 LinkSegs_dlook.py。从类的名字就可以看出来，LinkSegs_dlook\
    \ 是一个和 LinkSegs_dorder 类相互平行的类，它们的初始化函数、属性以及类结构也完全一致。LinkSegs_dlook 类的功能是实现基于字典查询法的截交线段优化拼接，后缀\
    \ dlook 也是我们创造的一个词，表示 dictionary look up，即字典查询的意思。这里我们主要来看一下类中的 createLpDic 函数，它的具体实现代码如下：\n\
    \n```\n# 导入必要库\nclass LinkSegs_dlook :\n    # 类定义\n    def __init__( self, segs\
    \ ):\n        # 初始化函数，输入线段列表 segs\n        self.segs = segs\n        # 保存线段列表\n\
    \        self.contours = []\n        # 保存封闭轮廓\n        self.polys = []\n     \
    \   # 保存非封闭轮廓\n        self.link()\n        # 调用拼接函数\n    def link( self ) : pass\n\
    \        # 字典查询法拼接函数，略\n    def createLpDic( self ) :\n        # 构建字典函数\n    \
    \    dic = {}\n        # 字典初始化\n        for seg in self.segs:\n            # 遍历\
    \ segs\n            lp1, lp2 = LinkPoint( seg.A ) , LinkPoint( seg.B )\n     \
    \       # 构建两个 LinkPoint 数据点\n            lp1.other, lp2.other = lp2, lp1\n  \
    \          # 点的 other 属性相互赋值\n            if ( lp1.x, lp1.y ) not in dic.keys()\
    \ :\n                # 判断 lp1 坐标是否在字典的键中\n                dic[ ( lp1.x, lp1.y\
    \ ) ] = []\n                # 如果不在则对该键新建列表\n                dic[ ( lp1.x, lp1.y\
    \ ) ].append( lp1 )\n                # 对该键对应的列表添加 lp1\n            if ( lp2.x,\
    \ lp2.y ) not in dic.keys() :\n                # 对 lp2 执行相同的操作\n             \
    \   dic[ ( lp2.x, lp2.y ) ] = []\n                dic[ ( lp2.x, lp2.y ) ].append(\
    \ lp2 )\n        return dic\n        # 返回字典\n```\n\n在以上用于构建字典的 createLpDic 函数中，对于每条线段\
    \ seg，在得到链接点 lp1 和 lp2 后，我们首先判断元组 ( lp1.x, lp1.y ) 是否在字典的 keys 中，如果不在，则在字典中添加一对新的元组和列表，然后再将\
    \ lp1 添加到键 ( lp1.x, lp1.y ) 对应的列表中。然后我们对点 lp2 也执行完全相同的操作。对 createLpDic 函数返回的字典，在正常情况下，如果输入的线段数为\
    \ M，则字典中键的个数也为 M，每个键对应的列表存放两个链接点。\n\n现在我们已经把平面上所有截交线段都转化成了 LinkPoint 数据点，并把这些点以重合坐标为键逐个存放到字典中。我们只要遵循以上介绍的原理，应该能够非常轻松地完成对所有截交线段进行拼接，事实也的确如此，我们将在下一小节给出这种线段拼接方法的流程和实现代码。值得一提的是，由于单点的字典查询时间复杂度为\
    \ O( log( n ) )，因此整个拼接过程的时间复杂度为 O( nlog( n ) )，其中 n 为线段条数。因为当中不涉及排序算法，因此它的时间复杂度是确定的，不存在最差或最好的情况。"
