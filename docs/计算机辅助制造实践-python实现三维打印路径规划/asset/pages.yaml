- pgno: 316
  md: '是 USB 转串口）和上位机电脑相连，接线原理如图附 1.1 所示。由于控制器上用于暂存 G 代码的寄存器容量有限（一般为几百个字节，通常仅能保存若干条指令），因此不能一次性向控制器发送大量指令。上位机向控制器发送一条指令后，必须等待控制器
    CPU 从寄存器读取并执行该指令后，才能继续发送下一条指令。对 Marlin 固件，上位机发送的每条指令必须以 ''\n'' 字符结尾，如“G1 X20 Y20
    E1.3\n”；待下位机读取该指令后，会向上位机返回“ok”字符串；上位机接收到“ok”后可继续向控制器发送下一条指令。即在指令发送过程中，''\n'' 和“ok”的数量必须保持一致。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_316_0.png)


    基于 Marlin 固件的 FDM 三维打印机上位机控制流程如图附 1.2 所示。下面我们给出相应上位机控制代码(Python 实现,写在 TestPrint
    模块中)，它的核心功能是读取 G 代码文件,并逐行向下位机发送控制指令,直至文件末尾,以实现指定 G 代码文件的三维打印。具体实现代码如下：


    | TestPrint.py | 打印机控制模块,向三维打印机运行发送 G 代码文件中的指令代码 | A1 - 1 |

    |---|---|---|

    | 1 | import serial | # 导入串口模块 |

    | 2 | def readToOk(con) : | # 循环读取串口内容,直至"ok" |

    | 3 | while True: | |

    | 4 | recvTxt = con.readline() | # 读取串口 |

    | 5 | print( recvTxt ) | # 打印串口返回内容 |

    | 6 | if "ok" in recvTxt: | # 如果读到"ok",则退出循环 |

    | 7 | break | |

    | 8 | if __name__ == ''__main__'': | # main 函数 |

    | 9 | con = serial.Serial( "COM3" , 115200) | # 指定串口号和波特率,建立串口连接 |

    | 10 | readToOk( con ) | # 读取串口函数直至"ok" |

    | 11 | con.write( "G28\n" ) | # 初始化,回零,必须做 |

    | 12 | readToOk( con ) | # 读取串口直至"ok" |

    | 13 | codePath = " E:\\model.gcode" | # 指定 G 代码文件路径 |

    | 14 | codeFile = open( codePath ,'' r'' ) | # 打开代码文件 |

    | 15 | for line in codeFile.readlines() : | # 遍历逐行发送代码 |'
