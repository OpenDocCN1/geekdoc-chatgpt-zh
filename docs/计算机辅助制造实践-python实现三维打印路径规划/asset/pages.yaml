    vtkProp 类中的方法。vtkProp3D 类主要负责实体在场景中几何层面的工作，封装了包括设置/获取实体位置（Set/GetPosition）、设置/获取实体缩放比例（Set/GetScale）、旋转实体（RotateX/Y/Z）以及获取实体包络（GetBounds）等功能函数。vtkActor
    类是我们在编写代码时接触最多且直接使用的类，主要负责实体在场景中显示层面的工作，如 Set/GetProperty 以及 Set/GetTexture 等函数。在图
    3.6 中，我们看到 vtkProp 还有一个 vtkActor2D 的子类，这个类是 vtkActor 的平行类，两个类的区别在于 vtkActor 负责三维实体绘制，而
