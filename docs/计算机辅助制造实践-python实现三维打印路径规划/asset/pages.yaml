- pgno: 241
  md: '以上 findOptFeedDir 函数的输入参数包括 polygons、digit 以及 adjustPolyDirs，这 3 个参数各自代表的含义我们在上面都已经做过解释，在默认情况下，我们设定
    digit 为 0，即角度精度为 1 度，adjustPolyDirs 为 False，即无需调整输入多边形方向。在 findOptFeedDir 函数中，我们首先做了一些数据准备工作，包括调用_findAnglePairs
    函数生成多边形上所有凹顶点角度对列表 anglePairs，以及调用_initAngleTable 函数获取初始扫描角度表 angleTable。随后是函数主体，根据角度对中两角度的取值情况分
    3 种情况讨论，这里我们以第 1 种情况为例说明，第 2 及第 3 种情况类似。


    在第 1 种情况下，b <= 180，即 a < b <= 180，根据上一小节的讨论结果，此时切线角度的取值范围为 [a, b]，我们需要做的就是对 [a,
    b] 范围内的各个扫描角度对应的交点个数加 1。在代码中，我们对切线角度范围 [a, b] 进行了压缩，使其变成 [a+delta, b-delta]，其中
    delta 为角度表中角度增量（或称为角度精度、角度分辨率），这其实是一种偏保守或偏安全的做法，确保在此区间的角度值对应的直线都是相应顶点的切线。


    在代码中，我们使用了不少次 round 函数进行四舍五入，确保计算得到的小数位数可控且为指定值，这样做的目的是保证根据角度值查询角度表（字典）angleTable
    时不会出现找不到键值的情况。


    在讨论完 3 种情况后，角度表 angleTable 中每个角度对应的交点个数都应被赋值，函数返回。理论上，我们只要遍历返回的角度表，就能从中找出交点个数最少对应的角度值。至此，我们已经实现了最少跳刀填充方向优化，对任意输入的多边形区域和角度精度，我们都能够使用
    findOptFeedDir 函数找出针对这些多边形的最少跳刀填充角度。我们只要将这些角度中的任意一个角度输入上一节得到的 genDpPath 函数（参见代码
    9-12），就能生成最少跳刀填充路径。


    最后，需要指出的是，我们可以通过事先移除输入多边形上冗余精度点的方式进一步对 findOptFeedDir 模块进行优化。如图 9.28 所示，对多边形上的
    3 个连续顶点 P_{k-1}、P_k 和 P_{k+1}，如果 P_k 到线段 P_{k-1}P_{k+1} 的距离 d_k 小于一个极小的正实数 \varepsilon，那么我们定义
    P_k 是一个冗余精度点。根据以上定义，多边形上的平角点显然是一个冗余精度点。


    此外，只要 d_k 足够小，删除 P_k 并不会对原多边形轮廓造成什么影响，反而可以减少轮廓上的细微扰动，使多边形变得更加简洁。对 findOptFeedDir
    模块来说，删除冗余精度的凹顶点是非常有意义的，可以减少代码 9-14 中需要计算的角度对，提升结果的实用性和可靠性。对本章及上一章涉及的相关路径规划算法，删除多边形上的冗余精度点都是非常有意义的。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_241_0.png)'
