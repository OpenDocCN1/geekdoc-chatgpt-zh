- pgno: 208
  md: '将所有可能和 y 线相交的线段全部分收集到了扫描线中，只有在前期准备数据时根据多边形边的相邻关系建立各条线段的链接结构，即在每条线段中存放与之相邻的上一条线段和下一条线段的引用。这无疑会增加
    calcHatchPoints 函数的实现的复杂程度。有兴趣的读者可使用条件 2 判断是否应该将线段添加至扫描线，并对函数的其他部分做出修补。


    在代码 9-2 中，我们使用的是条件 1，即当线段满足 yMin < y 且 yMax ≥ y 时，才将其添加至扫描线。首先，使用这个条件会自然排除那些和
    y 线重合的线段。其次，如图 9.5 所示，同样对那些端点落在 y 线上的线段，使用条件 1 会为扫描线筛出那些位于 y 线下方的线段，即图中线段 s1 ~
    s5；排除那些位于 y 线上方的线段，即图中线段 s7 ~ s11。在这种情况下，我们可以得到初始交点序列 P0 ~ P7。比较图 9.4 和图 9.5，在图
    9.5 的 P5 处，我们自然而然地仅生成了一个符合正确填充逻辑的交点，这在使用条件 2 时是难以想象的。但是使用条件 1，我们还是生成了一些重合的交点对，如图
    9.5 中的 P1, P2，但是这并不会对填充结果的正确性造成影响。而且，考虑到我们使用了 SweepLine 的 intersect 函数计算 y 线和线段的交点，这个函数会从初始得到的交点序列中删除重合的交点对，因此我们最终将得到
    P0, P3, P4, P5, P6, P7 这 6 个交点，生成 P0P3, P4P5, P6P7 这 3 条填充线段。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_208_0.png)


    以上我们见证了一个看起来毫不起眼的等号对算法结果产生的巨大影响，这从一个侧面督促我们以后在设计判断条件时需要深思熟虑，哪怕这个条件看起来非常简单。通过这一小节的介绍，我们实现了一个
    calcHatchPoints 函数，可以高效地为输入多边形和扫描高度序列计算填充线的交点。这个函数不接受角度参数，它只能用来生成和 X 轴平行的填充线，显然这是无法满足实际三维打印对平行填充路径的要求的。在下一小节，我们将在以上函数的基础上进一步介绍填充线方向的调整方法。


    # 9.1.3 填充线方向调整


    通过上一小节介绍，我们已经能够为指定的多边形和扫描高度序列生成一系列交点，根据填充线的奇偶提取原则，我们可以非常方便地将这些交点转化为填充线。但是目前，我们只能为多边形生成和
    X 轴平行的填充线，即在图 9.1 中，填充线的倾角 θ 只能为 0，这对三维打印应用来说是不够的。在三维打印中，如图 9.6 所示，我们一般要求上下层切片间的平行填充路径能够呈一定的角度（如
    90 度），在上下层材料之间形成相互交错的编织效果，以增加层间强度，这是三维打印的工艺特点。我们在本书的任务就是为输入多边形'
