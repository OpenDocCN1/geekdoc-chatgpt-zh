    fitness 函数涉及的计算量仍然是相当可观的。它的主要计算量消耗在对模型的旋转变换和对 calcModelSptPoints 函数的调用中，因为这两处地方都需要对模型中的所有面片进行遍历，而这些遍历似乎是不可避免的。有兴趣的读者不妨对
    fitness 函数展开进一步探索和研究，以期降低其计算量，或者重新寻找能够评价支撑量且更简易的指标。


    以上我们给出了指定模型在指定转角（α，β）下的支撑空间体积计算函数 fitness。根据我们之前的描述，在我们要构建的粒子群算法中，（α，β）就是粒子的位置，支撑空间体积
    V_s 就是粒子的适应度，而 fitness 就是粒子的适应度函数。但是，我们始终没有给出关于粒子速度的定义，事实上，在这里我们并不打算去定义粒子的速度项。这是因为我们在后面将对传统的粒子群算法进行改造，而在改造的粒子群算法中，速度项是不需要的。


    # 10.4.3 粒子定义


    通过以上两个小节的介绍，我们对粒子群算法的基本概念和实现步骤有了初步了解，同时结合优化模型摆放角度以减少支撑量这一实际应用场景，我们对粒子的位置和适应'
