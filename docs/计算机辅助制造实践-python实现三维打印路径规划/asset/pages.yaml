- pgno: 210
  md: 'line) 和线段( Segment )的旋转问题。


    在计算几何中，对实体的几何变换一般是通过矩阵来实现的，旋转变换当然也不例外。在 GeomBase 模块中，我们已经为 Matrix3D 类定义了一个 createRotateMatrix
    函数，对这个函数，我们只需输入旋转轴和旋转角度，就可创建一个旋转矩阵，如下：


    | 1 | m = Matrix3D.createRotateMatrix(''Z'', math.pi/2) | # 创建建 Z 轴逆时针旋转 pi/2
    的矩阵 |


    在此基础上，我们为 Polyline 类做的扩展如下：


    | Polyline.py | 多段线类，增加 multiply 和 multiplied 两个函数，以变换多边形 | 9 - 3 |

    |---|---|---|

    | 1 | ...... | # 导入相关库 |

    | 2 | class Polyline： | |

    | 3 | ...... | # 省略 Polyline 中其他函数 |

    | 4 | def multiply(self, m) : | # 对对象本身变换，作用一个矩阵 m |

    | 5 | for pt in self.points: | |

    | 6 | pt.multiply(m) | |

    | 7 | def multiplied(self, m) : | # 作用矩阵 m，产生一个新的多段线对象 |

    | 8 | poly = Polyline() | |

    | 9 | for pt in self.points: | |

    | 10 | poly.addPoint(pt * m) | |

    | 11 | return poly |


    对 Segment 类，我们做的扩展如下：


    | Segment.py | 线段类，增加 multiply 和 multiplied 两个函数，以变换线段 | 9 - 4 |

    |---|---|---|

    | 1 | ...... | # 导入相关库 |

    | 2 | class Segment： | |

    | 3 | ...... | # 省略 Polyline 中其他函数 |

    | 4 | def multiply(self, m) : | # 对对象本身变换，作用一个矩阵 m |

    | 5 | self.A = self.A.multiplied(m) | |

    | 6 | self.B = self.B.multiplied(m) | |

    | 7 | def multiplied(self, m) : | # 作用矩阵 m，产生一个新的线段对象 |

    | 8 | seg = Segment(self.A, self.B) | |

    | 9 | seg.multiply(m) | |

    | 10 | return seg |


    在以上 Polyline 和 Segment 两个类中，multiply 和 multiplied 两个函数都表示对当前对象作用一个矩阵，我们可以从代码中看出，它们的区别是前者矩阵作用后对象本身发生变化，后者矩阵作用后对象本身不变，但会返回一个新的对象。有了这些新增函数，遵循以上生成非零倾角填充线的第二种思路。


    下面我们考虑在 GenHatch 模块中实现一个为输入多边形生成任意指定倾角填充线的函数，我们把这个函数命名为 genSweepHatches，意思是生成间距均匀的填充线，它的具体'
