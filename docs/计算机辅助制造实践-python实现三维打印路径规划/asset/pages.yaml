    +   2. 尝试设计一种新的面片数据存储格式，以减小面片模型存储容量，同时能够保存模型拓扑信息。

    +   3. 在棱边的拓扑结构中，为什么将一条棱边拆分成两条半边？

    +   4. 在 TFace 类中，为什么需要重新实现一遍平面和三角面片的求交函数？

    +   5. 至少用两种方法，快速去除 STL 模型上的冗余顶点。

    +   6. 设计一种算法，去除平面多边形上的重复顶点。

    +   7. 如何寻找并建立两条来自不同三角形的对边索引？'
