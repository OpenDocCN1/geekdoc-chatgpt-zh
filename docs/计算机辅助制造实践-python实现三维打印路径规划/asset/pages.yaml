  md: "局接口函数 genDpPathEx。该函数包含 5 个输入参数，其中 polygons 表示打印区域的多边形轮廓序列，interval 表示平行路径间距，angle\
    \ 表示填充角度，ys 表示平行线位置和间距的序列，center 表示旋转中心点，ys 和 center 的默认值同样都为 None。这 5 个参数中的 interval\
    \ 和 ys 两个参数是有点重复的，这其实是无奈之举，因为 genDpPathEx 函数需要和 genDpPath 函数兼容。在调用 genDpPathEx\
    \ 函数时，如果指定了 ys 参数，那么 interval 参数将不起作用，此时可对 interval 设置任意值（比如 0）。\n\n# 10.3.2 支撑路径生成实现\n\
    \n在完成 GenDpPath 模块的扩展和升级之后，基于该模块，下面我们直接给出针对支撑区域的填充路径生成代码。我们把这部分代码写在 GenSptPath\
    \ 模块中，包括一个全局函数 genSptPath 和一个枚举类 SptPathType，具体实现如下：\n\n```\n```python\n# 导入相关库\n\
    class SptFillType( Enum ):\n    # 填充路径形式枚举类\n    line = 1    # 平行同向填充\n    cross\
    \ = 2   # 平行交叉填充\n# 定义支撑路径生成函数\ndef genSptPath(stlModel, layers, pathInvl, gridSize,\
    \ crAngle, fillType, fillAngle = 0, xyGap = 1):\n    findSptRegion(stlModel, layers,\
    \ gridSize, crAngle, xyGap)    # 生成支撑区域\n    xMin, xMax, yMin, yMax, zMin, zMax\
    \ = stlModel.getBounds()    # 计算模型在各个方向极限\n    center = Point3D((xMin + xMax)/2,\
    \ (yMin + yMax)/2)    # 模型在平面上中心点\n    corner = Point3D(xMax, yMax)    # 模型包络在平面上角点\n\
    \    radius = center.distance(corner)    # 计算模型外接圆柱半径\n    ys, y = [], center.y\
    \ - radius\n    while y <= center.y + radius:    # 生成实数序列 ys\n        y += pathInvl\n\
    \        ys.append(y)\n    for i, layer in enumerate(layers):    # 遍历每层切片\n  \
    \      angle = fillAngle    # 填充角度\n        if fillType == SptFillType.cross and\
    \ i % 2 == 1:    # 如果是平行交叉填充，\n            angle = fillAngle + math.pi/2    #\
    \ 计算交叉填充角度\n        layer.sptDpPaths = genDpPathEx(layer.sptContours, 0, angle,\
    \ ys, center)    # 平行填充路径\n        layer.sptCpPaths = layer.sptContours    # 外周轮廓路径\n\
    ```\n```\n\n我们首先来看一下 SptFillType 这个枚举类。它枚举了目前我们能够实现的两种支撑路径形式，一种为 line，表示上下切片层的平行线同向填充，如图\
    \ 10.5（c）；另一种为 cross，表示上下切片层的平行线交叉填充，如图 10.5（a）。\n\n下面我们再来看下 genSptPath 函数，该函数共有\
    \ 8 个输入参数，其中 stlModel 表示三维模型，layers 为对应的切片数据，pathInvl 为相邻平行路径之间的间距，gridSize 为\
    \ XY 平面上的预设网格尺寸，crAngle 为危险面片临界角，fillType 为 SptFillType 枚举类型的支撑"
