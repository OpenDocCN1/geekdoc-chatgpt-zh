    | 9 paths = [ ] | | # 定义路径序列 |

    | 10 for poly in self.splitPolys: | | # 对每个单连通区域生成路径 |

    | 11 segs = genHatches( [ poly ], ys ) | | # 生成平行填充线段 |

    | 12 if len( segs ) > 0: | | |

    | 13 path = self.linkLocalHatches( segs ) | | # 连接单连通区域内填充线段 |

    | 14 paths.append( path ) | | |

    | 15 return GeomAlgo.rotatePolygons( paths, self.angle, center ) | | # 反向旋转并返回路径
    |

    | 16 def genDpPathEx( polygons, interval, angle, ys = None, center = None ): #
    generateEx 接口函数 | | |

    | 17 return GenDpPath( polygons, interval, angle ).generateEx( ys, center ) |
    | |


    我们可以结合 generate 函数的实现代码来看以上 generateEx 函数的实现代码。generateEx 函数有两个输入参数, 分别为 ys 和
    center。其中 ys 就是我们之前说的用来控制当前切片层上平行线位置和间距的实数序列, 该参数由外部生成和输入, 可确保对所有切片来说, ys 是唯一的。第二个参数
    center 表示旋转中心点, 下面我们着重分析一下在 generateEx 函数中设置旋转中心点的原因。


    我们知道, 在 generate 函数中, 为了适应平行路径不同填充角度的需求, 我们根据相对运动的原理需要对表示打印区域的多边形轮廓进行旋转, 在完成填充路径计算后再将路径旋转相反的角度,
    如图 9.7 所示。在 generate 函数中, 因为 ys 根据旋转后的多边形轮廓产生, 因此理论上 ys 对应的平行线总能覆盖旋转后的多边形区域, 且旋转中心点是可以任意选择的(简单起见,
    在 generate 函数中, 我们选择了平面坐标系原点为旋转中心点)。但是对 generateEx 函数来说, 因为 ys 在多边形轮廓旋转之前已经生成,
    理论上, ys 对应的平行线和旋转后的多边形并无关系, 为了达到填充的目的, 我们有必要通过外部措施来保证 ys 对应的平行线能够覆盖旋转后的多边形区域,
    而且是所有切片层上的旋转多边形区域。我们采取的外部措施包括两点: 一是根据模型沿 Z 方向的外接圆柱来生成 ys(类似原理图可参见图 9.9), 二是以外接圆柱轴线沿
    Z 轴投影点为旋转中心点。通过这两个措施, 在任意切片层上, 无论多边形轮廓如何旋转, 我们总能保证 ys 对应的平行线能够覆盖多边形区域。


    我们可以看到, generateEx 函数中的 ys 和 center 参数都有默认值, 而且它们的默认值都为 None, 这样做完全是为了“向下兼容”,
    即如果不对 generateEx 输入任何参数, 那么 generateEx 函数就将退化为 generate 函数, 即此时两者功能完全一致。


    类似于 generate 函数, 在 GenDpPath 模块中, 我们也为 generateEx 写了一个对应的全'
