  md: '现还原了如图 7.15 所示的切片轮廓创建流程。需要说明的是，在这个函数中，对得到的截交线段，我们通过 Polyline 类的 appendSegment
    函数将其添加到当前轮廓中。在每一步循环中，尽管我们知道得到的截交线段必然是可以被直接添加到当前轮廓上的，但是我们不太确定的是，它到底是和当前轮廓的头部还是尾部相接。从理论上分析，对于一条新建的空轮廓，在对其添加第
    1 条截交线段时我们可以不在意它的方向，但在添加第 2 条线段时，我们就必须要考虑一下它的走向。如果第 2 条线段是被拼接在了轮廓尾部，那么由追踪截交的原理可知，以后每条线段都将被拼接在轮廓尾部；而如果第
    2 条线段被拼接在了轮廓头部，那么以后每条线段也都将被拼接在轮廓头部。


    事实上，我们是不希望线段被拼接到轮廓头部的，因为对于大部分编程语言的动态数组来说，在数组头部插入一个数据的效率要低于在尾部添加一个数据的效率。在以上代码中，我们选择了一种方式，直接调用了
    appendSegment 函数，让这个函数去判断到底应该将线段拼接到轮廓的头部还是尾部。有兴趣的读者可在这里做进一步优化，在合适的时候调整当前轮廓方向。


    尽管我们在这里选择了这样的方式，但为了截交线段能尽量被拼接到轮廓尾部，我们在前面曾理过一些伎俩，比如在代码 7-6 的 findNextFace 函数中，对于截交线段两交点都落在面片半边的情况，我们有意先检查半边
    e1 的邻面（第 20 行代码），后检查 e0 的邻面，这是因为截交计算返回的线段是从 e0 指向 e1 的（参考 TFace 的 intersect 函数），先检查半边
    e1 显然是一种顺着轮廓生长方向的策略。


    接下来我们再来看一下 TopoSlicer 类的 slice 函数，这个函数是完成切片轮廓的主函数，当然，它的核心功能已经被拆分成了几个子函数。我们在 slice
    函数中做的主要任务就是构建了一个扫描平面法的框架，包括首先对模型中的所有面片按照最低点从低到高排序，在每一层高上，首先移除扫描平面上不再与之相交的面片，然后再添加新的面片。对每一层扫描平面中的面片，我们调用了
    createLayerContour 函数生成当前层切片轮廓，然后把这些数据添加至切片列表 layers 中。以上就是 slice 函数的全部。


    最后，还是像以前一样，我们需要在和切片计算相关的全局函数模块 SliceAlgo 中添加一个 TopoSlicer 类的接口函数 slice_topo，它的输入为常规的
    STL 模型，输出为包含所有切片轮廓信息的切片列表。这个函数的实现代码如下：


    | SliceAlgo.py | slice_topo:添加基于拓扑模型的切片算法 | 7-8 |

    |---|---|---|

    | 1 | from TopoSlicer import * | # 导入 TopoSlicer 模块 |

    | ..... | | # 忽略 SliceAlgo 其他导入模块及代码 |

    | 3 | def slice_topo(stlModel, layerThk): | # 定义函数 |

    | 4 | return TopoSlicer(stlModel, layerThk).layers | # 返回切片列表 |


    至此，我们已经得到了 TopoSlicer 类的完整代码，同时也完成了对 TopoSlicer 模块的构建。现在我们希望能够用一些 STL 模型对这个 TopoSlicer
    类进行测试，看一下它的运行稳定性和效率，同时和前几章完成的截交、拼接算法进行对比。需要说明的是，我们选择在第 7 章介绍基于拓扑模型的切片算法，并不代表这种算法就比之前几章的算法优秀。'
