    # 9.3 填充区域分区


    在前面两节，我们使用了两种方法分别生成了给定平面区域的填充线，一种是我们实现的扫描线法生成填充线，另一种是运用现成的 Clipper 库通过裁剪的方式生成填充线。我们知道，由于
    Clipper 库内核使用 C++编写，因此上文中的 genClipHatches 函数相比于 genSweepHatches 函数在运行速度上具有先天优势(经简单测试，前者比后者效率高一倍左右)，但这种优势是相对的，后者可以通过更换编程语言来弥补不足。并且后者相对于前者更为实用，其中最重要的特征就是后者生成的填充线在平面上的分布是完全可控的，这有利于填充路径连接。我们在这一节将基于扫描线法生成的填充线展开进一步研究，最终目标是将得到的离散填充线段连成一体，形成平行路径。


    # 9.3.1 填充线连接概述


    我们先来看一下平行填充线连接的最简单情形。如图 9.11(a)所示，针对某一矩形区域，假设我们已经用扫描线法在其内部生成了一组平行填充线段，现在要将这些线段连成一体，使得到的多段线满足三维打印工艺需求或打印效率需求。我们当然不可能天马行空地随意去连接这些线段，一般而言，我们会采用
    zig-zag, 之字形，图 9.11(b) ) 或单向，图 9.11(c)这两种形式去有序地连接填充线段。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_218_0.png)'
  merge: -1
  img_proc: true
- pgno: 219
  md: '我们知道，在使用扫描线法生成填充线段时，如果我们认为每条线段的方向是从起点指向终点的话，那么所有填充线段的方向都是一致的。如图 9.11 所示，zig-zag
    连接的特点是在两条相邻平行线段的同侧点（同为起点或同为终点）处连接这两条线段，单向连接的特点是在两条相邻平行线段的异侧点（一个为起点、一个为终点）处连接这两条线段。显然，相比较而言，zig-zag
    路径长度较短，加工效率较高；而单向路径长度较长，加工效率较低。由于刀具进给和主轴旋转的共同作用，常规的铣削加工工艺一般可分为顺铣和逆铣。显然，zig-zag
    路径既包含顺铣过程，又包含逆铣过程；而单向路径只包含其中一种铣削过程。对机加工路径规划而言，对那些表面制造精度要求较高的零件，我们一般会采用单向连接策略。但三维打印工艺不存在顺铣和逆铣的区别，因此，为保证打印效率，在三维打印中，对平行行填充线，我们一般会选用
    zig-zag 这种路径连接方式。


    对图 9.11(a) 中的填充线段，我们可以使用 zig-zag 连接方式毫不费力地将所有线段连成一体。现在我们调整一下填充区域形状，如图 9.12 所示，对图中花瓶形状的多边形，我们发现，当填充角度为
    0 度时，我们仍然可以非常轻松地将所有填充线段连成一体。但如果我们将原多边形顺时针旋转 90 度，而保持填充角度为 0 度不变，如图 9.13 所示，此时，我们发现已经无法像之前一样轻松地将所有填充线段连成一体。在连接这些线段时，我们将遭遇以下两个问题。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_219_0.png)


    # 图 9.12 多边形区域内 zig-zag 连成一体的填充线


    首先是平面上上下层填充线段的识别配对问题。如果我们调用 genSweepHatches 生成填充线段，如图 9.13 所示，那么图中上方局部区域内的 4 条填充线段在函数返回结果中的排列顺序是：AB、CD、EF、GH。假如在某一时刻，我们已经通过
    zig-zag 方式连接了 AB 线段，现在我们要从 B 点连接到下一条填充线段。由图 9.13 可知，从 zig-zag 连接逻辑上来说，AB 的下一条线段应该是
    EF；这和填充线段列表中线段的顺序是违背的，因为在列表中，AB 的下一条线段是 CD。这样，我们就有必要根据当前线段 AB 从填充线段列表中搜索并识别符合
    zig-zag 连接逻辑的下一条线段，这就是我们需要解决的第一个问题。


    产生上述问题的根本原因是上下层扫描高度上都存在至少大于一条填充线段。虽然看起来简单，但解决这个问题时却极容易出错，特别是当多边形轮廓形状比较复杂时，因为我们很难制定正确、完备的识别标准。一个很容易想到的识别条件是下一条线段所在的直线和当前线段所在的直线的间距是给定的填充间距值。这当然是对的，但这只是其中一个基础条件。另一个较为直观的识别条件可能是下一条线段的投影落在当前线段'
