- pgno: 176
  md: '线段之间的修补策略有所不同。这里我们还是以逆时针轮廓的向内偏置为例进行说明，如图 8.15 所示，对原始封闭轮廓上的连续顶点 P1 ~ P5，我们可以按照上一节介绍的线段平移方法首先生成各条原始线段的偏置线段，如
    P1 P2 的偏置线段为 Q1 Q2、P2 P3 的偏置线段为 S2 S3、P3 P4 的偏置线段为 T3 T4 等。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_176_0.png)


    当原始轮廓上 3 个连续顶点所夹内角为优角（小于 180 度）时，如图 8.15 所示的顶点 P2，在上一节，我们采取的策略是对相应偏置线段（Q1 Q2 和
    S2 S3）在交点处进行修剪后连接，见图 8.5(a)；对这种情况，Clipper 中布尔偏置采取的策略是直接连接 Q2 P2 和 P2 S2，生成 Q1
    Q2 P2 S2 S3 这一段带有自缠绕效果的连续偏置轮廓，这样我们将在 P2 附近得到一个自相交环。同理，对顶点 P3、P5、P1，我们也可以得到自缠绕连续偏置轮廓，同时也将在顶点附近得到自相交环。有了
    Clipper 库中的各种布尔操作，我们可以暂时不必理会这些自相交环。


    当原始轮廓上 3 个连续顶点所夹的内角为劣角（大于 180 度）时，如图 8.15 中的顶点 P4，Clipper 中布尔偏置采用了三种策略来衔接相邻偏置线段间的缝隙：圆弧衔接、矩形衔接和斜角衔接，分别对应
    Clipper 库中的 JT_ROUND、JT_SQUARE 和 JT_MITER 三个枚举标识量，其中前缀 JT 是 Joint Type 的缩写，表示衔接类型。


    圆弧衔接(JT_ROUND)我们在之前的图 8.5(b) 和图 8.15 中都有所展示，即理论上，用一段圆心位于顶点、半径和给定偏置距离相等的圆弧去弥补两相邻偏置线段的缝隙，使得圆弧和偏置线段在连接处恰好相切，如图
    8.16(a) 所示，注意，满足以上条件的圆弧在几何上是唯一的。但在实际操作中，如果我们真的用圆弧曲线（二次曲线）去衔接偏置线段，一方面将导致返回多段线内部数据格式的不统一（包含直线段和圆弧两种格式），这将给我们后续三维打印路径的生成带来无尽的麻烦；另一方面目前
    Clipper 库也无法处理圆弧曲线的裁剪问题。所以在实际操作中，我们一般会对圆弧进行离散，即用一系列微小连续的弦来逼近圆弧，事实上，Clipper 中布尔偏置也是这么做的。具体操作时，如果对轮廓精度要求不高，则减少对圆心角的细分份数；如果精度要求较高，则减小圆心角细分角度。


    矩形衔接(JT_SQUARE)是用一段和上述圆弧相切且和轮廓顶点角平分线垂直的直线'
