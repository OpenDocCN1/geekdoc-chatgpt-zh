- pgno: 311
  md: '在 NC 代码中，我们一般使用 G0 和 G1 两个指令来跟踪、描绘打印路径。其中 G0 为快速定位指令，可控制打印喷头从一个点快速移动到另一点，其间喷头不出丝，通常被用于两段打印路径之间的衔接。在实际使用中，我们需要在
    G0 指令后面添加速度指令（F 字段）和终点坐标指令（X、Y、Z 字段），移动的起点就是当前所处点。G1 为直线插补指令，可控制打印喷头从一个点沿直线轨迹移动到另一点，其间喷头出丝。和
    G0 一样，在实际使用中，我们也需要在 G1 指令后面添加 F、X、Y、Z 的具体数值；此外，为了控制喷头出丝，我们还需要为其添加进丝指令（E 字段，表示进丝长度）。


    需要说明的是，G0 和 G1 都是模态指令（续效指令），即在 G0 或 G1 引导的代码中，如果当前行代码中的某个字段相对于上一行代码相同字段的数值未发生改变，那么我们可以在当前行代码中省略这个字段，如对以下两行代码：


    | 1 | G1 F1000 X10 Y20 Z30 E40; (10, 20, 30) |

    | 2 | G1 F1000 X30 Y40 Z30 E50; (30, 40, 30) |


    我们可以将其简写为：


    | 1 | G1 F1000 X10 Y20 Z30 E40; (10, 20, 30) |

    | 2 | G1 X30 Y40 E50; (30, 40, 30) |


    我们甚至可以省略第二行中的"G1"。注意，在 G 代码中，我们使用英文分号“；”进行代码注释。


    对于表 11.2 中的 G90 和 G91，G90 表示绝对编程，G91 表示增量（相对）编程。它们的区别主要体现在 G0 和 G1 上。如对以上两行代码，涉及的
    X、Y、Z 坐标分别为（10, 20, 30）和（30, 40, 30）。如果采用绝对编程，那么（10, 20, 30）和（30, 40, 30）就是执行两段代码后的终点坐标；但如果采用增量编程，那么终点坐标分别为（10,
    20, 30）和（40, 60, 60）[假设（10, 20, 30）本身等于绝对坐标]。在 FDM 三维打印中，我们一般使用绝对坐标编程，即使用 G90
    指令。


    显然，G 代码中的 X、Y、Z 坐标数值是可以直接从路径曲线中提取得到的，那进丝指令 E 的数值又该如何得到呢？在 FDM 三维打印中，打印丝材在打印喷头的加热和进丝电机的挤压作用下，从喷头挤出，如图
    11.9 所示。通常情况下，喷头直径小于丝材直径，即从喷头前进去的丝材长度要小于从喷头挤出来的丝材长度，它们之间的具体关系如下：


    $$ \frac{L_{in}}{L_{out}} = \left( \frac{nozzleSize}{filamentSize} \right)^2 $$
    (11-7)


    式中，L_{in} 为进丝长度，L_{out} 为出丝长度。在知道出丝长度的情况下，根据式 (11-7)，我们可以计算相应的进丝长度。而在 FDM 三维打印中，喷头喷出的丝材长度等于由
    G1 指定和累加的路径总长度，因此，在已知打印路径的前提下，我们可以计算得到相应的出丝长度。综上所述，只要对路径长度进行累加，同时结合式 (11-7) 对长度进行转换，我们就可以对
    G 代码中的进丝量 E 进行赋值。


    在以上对 G 代码介绍的基础上，下面我们给出从打印路径到 NC 代码转化的后处理函数。首先给出将一条路径曲线“翻译”成 G 代码的函数，函数名为 pathToCode，它的具体实'
  merge: -1
  img_proc: true
- pgno: 312
  md: '![](img/c3ab49ac4eb80e7a0a66462a29869ca2_312_0.png)


    图 11.9 FDM 三维打印喷头进出丝示意


    现如下：


    | GenNcCode.py | 将一条路径曲线(多段线)转化为 NC 代码 | 11 - 10 |

    |---|---|---|

    | 1 | ...... | # 导入相关库,忽略其他代码 |

    | 2 | def pathToCode(path, pp, e, nf2): | # 定义路径到 NC 代码转化函数 |

    | 3 | code = "" | # 定义文本变量 code |

    | 4 | for i, p in enumerate(path.points): | # 遍历多段线路径中所有顶点 |

    | 5 | if i == 0: | # 使用 G0 快速跳至路径起点 |

    | 6 | code += "G0 F%xd X%.3f Y%.3f Z%.3f\\n" % (pp.g0Speed, p.x, p.y, p.z) | |

    | 7 | else: | # 使用 G1 打印路径上的其他点 |

    | 8 | e += p.distance(path.points[i-1]) * nf2 | # 累加得到 e 值,即进丝量 |

    | 9 | code += "G1 F%xd X%.3f Y%.3f E%.3f\\n" % (pp.g1Speed, p.x, p.y, e) | |

    | 10 | return code | # 返回代码文本 |


    以上 pathToCode 函数的实现其实非常直观,其核心功能就是将路径上各顶点坐标按 G 代码标准格式化为字符串。它包含 4 个输入参数,其中 path
    就是 Polyline 类型的多段线,pp 为 PrintParams 类型的打印参数,e 为累计进丝长度,nf2 为喷头尺寸( nozzleSize )和丝材尺寸(
    filamentSize )比值的平方,参见式( 11–7 )。考虑到 genAllPaths 函数可能生成多条路径,在将这些路径转化为 NC 代码时,我们可能需要多次调用
    pathToCode 函数,此时参数 e 可以贯穿这些调用,得到累加进丝长度。至于参数 nf2,我们将其作为输入参数而不是在 pathToCode 函数中直接计算纯粹是出于降低计算量的考虑。


    在 pathToCode 函数中,对于路径起点,我们使用了 G0 指令,让打印喷头以速度 g0Speed 快速移动至该点,且移动过程中喷头不出丝。对于 FDM
    三维打印,在同一层切片上,当喷头从一点平移至另一点时,考虑到平移过程中无障碍物,因此无需设置安全平移高度;当喷头完成一层打印,向上移动一层时,由于喷头 Z
    向高度提升,也不会碰到障碍物,因此也无需设置安全移动高度。综上两种情况,在路径起点,我们只要让喷头从上一条路径终点直接以 G0 移动至当前路径起点即可。对于路径上的其他点,我们使用了
    G1 指令,让喷头以速度 g1Speed 从前一点沿直线移动至相应点,且移动过程中喷头出丝,出丝增量根据路径上当前点到前一点的距离及 nf2 计算得到。'
  merge: -1
  img_proc: true
- pgno: 313
  md: '函数 pathToCode 的返回为指定路径的 NC 代码文本。使用 pathToCode 函数，我们可以获取由 genAllPaths 函数生成的所有路径的所有
    NC 代码。只要将所有 NC 代码进行累加，就能最终生成 NC 代码。根据这个思路，下面我们在 GenNcCode 模块中给出打印路径的后处理函数，函数名为
    postProcess，具体实现如下：


    | | | |

    |---|---|---|

    | GenNcCode.py | NC 代码生成模块,定义打印参数类 | 11 - 11 |

    | 1 | ...... | # 导入相关库,忽略其他代码 |

    | 2 | def postProcess(layers, pp): | # 三维打印路径后处理函数 |

    | 3 | code, e = pp.startCode, 0 | # 定义代码文本 code 和进步量 e |

    | 4 | nf2 = ( pp.nozzleSize / pp.filamentSize ) * * 2 | # 计算喷头和丝材尺寸比值平方 |

    | 5 | for i, layer in enumerate(layers): | # 遍历每层切片中的 5 种路径 |

    | 6 | code += " ; Layer %d\n " % i | # 在代码中标识当前层号 |

    | 7 | for path in layer.sptCpPaths: code += pathToCode(path, pp, e, nf2) | # 支撑轮廓路径代码
    |

    | 8 | for path in layer.sptDpPaths: code += pathToCode(path, pp, e, nf2) | # 支撑填充路径代码
    |

    | 9 | for path in layer.cpPaths: code += pathToCode(path, pp, e, nf2) | # 轮廓路径代码
    |

    | 10 | for path in layer.ffPaths: code += pathToCode(path, pp, e, nf2) | # 密实填充路径代码
    |

    | 11 | for path in layer.sfPaths: code += pathToCode(path, pp, e, nf2) | # 稀疏填充路径代码
    |

    | 12 | return code + pp.endCode | # 返回 NC 代码 |

    | 13 | def genNcCode( pp : PrintParams) : | # 定义 NC 代码生成函数 |

    | 14 | layers = genAllPaths(pp) | # 生成打印路径 |

    | 15 | return postProcess(layers, pp) | # 打印路径后处理,生成 NC 代码 |


    在实现 pathToCode 函数的基础上，以上 postProcess 函数的实现已变得非常简单。它的输入为切片序列 layers 和打印参数 pp，注意，postProcess
    函数的调用应在 genAllPaths 函数调用之后，因此这里的 layers 中已包含打印路径。每层切片上至多有 5 种路径，即工件部分的轮廓路径 cpPaths、密实填充路径
    ffPaths、稀疏填充路径 sfPaths，以及支撑部分的轮廓路径 sptCpPaths 和填充路径 sptDpPaths，针对这些路径，我们分别调用 pathToCode
    函数生成了相应的代码。在每层切片路径打印顺序的安排上，我们采用了“先支撑后工件，由外至内”的策略，即先打印支撑部分，后打印工件部分，对每个部分，先打印外围轮廓路径，后打印内部填充路径。


    需要说明的是，这里为简单起见，对每种路径中的每条独立路径，我们直接根据它在列表中的序号和相邻路径进行了连接。事实上，在某一层切片上，为了得到最短的总路径（即最短应走路径），我们可以把以上
    5 种路径的连接题当作一个旅行商问题（TSP，参见图 8.32）。但这无疑会增加路径连接的难度，有兴趣的读者不妨去尝试解决这个问题。


    在 postProcess 函数中，对累加得到的 NC 代码，我们在其开头添加了来自打印参数 pp 的起始代码 startCode，并在结尾添加了结束代码
    endCode。在实际应用中，如果有需求，我们只需修改 pp 中的相应参数即可。此外，值得一提的是，为了标记 NC 代码中的切片层信息，我们在每层开头以注释的形式添加了层序号。同理，事实上，我们也可以在每层切片的种种路径前添加相应的注释文本，方便后续查看。


    在以上代码的最后，我们定义了一个 GenNcCode 模块的同名接口函数 genNcCode，它'
