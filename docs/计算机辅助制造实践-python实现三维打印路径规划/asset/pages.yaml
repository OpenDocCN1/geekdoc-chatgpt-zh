    对比图 10.18( a)、图 10.18( b)及图 10.18( c),当控制其他参数不变时,只有 crAngle 参数变化时,我们看到,临界角度值设置得越大,最终得到的支撑区域面积越大。这是符合我们的常规认识的,危险面片的定义是小于临界角的面片,当临界角值越大,意味着模型上将有越多的面片被判定为危险面片,需要添加支撑的范围自然就会变大。


    对比图 10.18( a)和图 10.18( d),当控制其他参数不变,只变化 gridSize 参数时,我们看到,网格尺寸越小,生成支撑区域的边界线就越精细,显然这对提高支撑区域的精度是有意义的,但前提是增加了计算量。我们可以估计,当我们将
    gridSize 值从 2 毫米减小到 1 毫米时,网格节点数增加了 4 倍,后续相应的求交计算量必然也成倍增加。考虑到我们允许打印时冗余支撑的存在,而且错误的支撑区域可以通过轮廓偏置和布尔运算的方式被修正,因此,在实际计算中,为了保证支撑区域生成的效率,我们建议不宜将
    gridSize 值设置得过小。


    在图 10.18( e),我们设置 xyGap 值为 2,此时支撑轮廓和模型轮廓之间的间距被拉大,这有利于后期将打印好的支撑材料从模型上脱离。但 xyGap
    值不能过大,否则模型将处于欠支撑状态,不利于悬臂结构成型。xyGap 的具体值和打印材料的属性有关,应该从大量的工艺试验中总结得出。


