    findOptFeedDir 的计算结果，因此，对输入轮廓，在进行路径生成计算之前，我们有必要去除这些冗余点。


    # 本章小结


    在本章中，我们主要解决了三维打印平行路径的生成问题。平行路径本质上是一系列平面平行填充线段，我们使用了两种方法生成这些平行填充线段，一是扫描线法，二是基于
    Clipper 库的裁剪方法。考虑到裁剪法得到的平行填充线可能存在顺序混乱的问题，在本章中，我们采用的是扫描线法生成平行填充线。对得到的填充线进行连接并生成路径时，需要对填充区域进行分区，针对这个问题，我们提出了一种基于轮廓凹峰点的区域分区方法，在每个分区内，所有平行填充线都可以被首尾相连成单一路径。最后，我们从减少平行路径上跳刀次数的角度，对平行路径进行了优化。结合本章介绍的平行路径和上一章介绍的轮廓路径，我们就可以在每层切片轮廓内部生成完整的填充路径。'
