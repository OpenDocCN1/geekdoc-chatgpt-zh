    在后面的代码中，我们又分别创建了 renderer、window 以及 interactor 对象。我们可以对照一个典型的 Windows 窗口应用程序来理解这
    3 个对象。首先是 window 对象，这个对象就是程序的窗口界面，我们可以使用 SetSize 函数设置窗口的尺寸。然后是 renderer 对象，这个对象对应窗口中被渲染的视图，我们可以使用
    AddActor 函数将几何实体的 actor 对象添加到视图中显示，也可以使用 SetBackground 函数设置视图背景颜色。最后是 interactor
    对象，其实在每个 Windows 窗口应用程序的背后，都运行着一个消息循环，用于程序与外部或内部的交互，这里的 interactor 对象就对应类似的消息处理机制。以上
    3 个对象相互作用，共同构成了 VTK 程序窗口显示场景。对 interactor 对象，我们在其 SetInteractorStyle 函数中设置了“轨迹球相机”的交互方式，即相机始终在一个轨迹球上移动；当然，我们也可以在这个函数中设置其他交互方式。


    如果我们需要显示 2 个或多个实体，只需按以上代码中 source、mapper、actor 的创建流程分别再写几行代码，然后将相应 actor 对象加入
    renderer 对象即可。在 VTK 中，除了 vtkCubeSource 外，我们还可以使用 vtkConeSource、vtkCylinderSource、vtkLineSource
    等类创建圆锥、圆柱、直线等对象；此外，我们还可以用 vtkTextSource 创建文本对象，有兴趣的读者不妨尝试使用这个类在视图中显示“Hello VTK”字符，如图
