- pgno: 148
  md: '角面片相交，因此，我们事先可以把与当前截平面可能相交的三角面片全部找出来，然后在这些面片中寻找种子面片。这样，针对 monk 模型，我们就可以把搜索范围从
    33 万个面片减少到 1000 个左右，这绝对是一个不小的进步，而且，这最终会体现在寻找种子面片的运行效率上。那么我们又该怎样去寻找和当前截平面相交的所有三角面片呢？而且这个过程要求效率高，并要避免遍历，不然还不如直接从拓扑模型中寻找种子面片。


    其实我们在第 5 章中介绍过一种方法来处理这个问题，就是扫描平面法。它的基本思路是：首先对模型中的面片按照最低点从低到高排序，然后构造一张扫描平面按切片层高从低到高扫描（参照图
    5.3）。每到一处层高，我们首先从扫描平面中移除已经不再与之相交的三角面片，然后再添加新的与之相交的三角面片。通过这种方式，扫描平面总是维护着模型中与之相交的所有面片。扫描平面法采用排序和增量的方式维护面片数据，它的执行效率非常高，这点我们已经在第
    5 章中有所见证。


    在这里，我们可以仿照之前的扫描平面法截交流程，如图 7.12 所示，首先根据输入的切片厚度生成层高数据列表 zs，然后让扫描平面沿着 zs 中的层高值从下往上扫描。在每一层高处，扫描平面将收集和维护与之相交的所有三角面片，然后我们可以从这些三角面片中寻找第一个种子面片、第二个种子面片、第三个种子面片……直至这些面片的
    used 属性均被设置为 True，从而找出当前层高处的所有载交轮廓线。通过这种方式，我们可以对拓扑模型中的面片实现“分治”，从而提高种子面片的搜索效率。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_148_0.png)


    # 图 7.12 扫描平面法分治面片加速种子面片寻找原理


    注意，我们在这里用的扫描平面法是一个大的框架，是一种面向全局的方法，即它面向的是整个模型高度上所有连续的切片层高，而不是单单针对某一层高。切片层数越多，它的优势越明显。如果仅仅是求取某一层高上的切片轮廓，扫描平面法是没有太多优势的，因为它还要准备数据、对面片进行排序等，这都将消耗一定的时间。我们在这里考虑的正是面向整个模型的切片，在每一切片层上都得寻找种子面片，因此是可以发挥扫描平面法的优势的。'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# 7.4.2 目标邻面寻找


    在扫描平面法这一大框架下，在某一特定层高上，我们可以以比较快的速度收集和当前扫描平面(或叫截平面)相交的所有三角面片，我们不妨记这些面片为 faces。注意，这里
    faces 为一存放 TFace 类型数据的列表，而且它里面包含的面片数量远远小于整个模型的面片数量，甚至可以忽略不计。我们在这一小节的以下讨论将针对 faces
    展开。


    因为 faces 中的面片数量不大，因此我们可以直接对 faces 进行遍历，在里面寻找从未被使用过(即 used 属性为 False)的面片作为种子，并将种子面片作为当前面片。此时，我们不必急于寻找和当前面片相邻的面片，因为它至少少和
    6 个面片相邻，包括 3 个共用棱边的面片和 3 个以上共用顶点的面片，搜索范围仍然有点大。我们需要做的是缩小搜索范围，定位当前截平面具体和当前面片的哪些半边或顶点相交。假设它们的交点在两条半边上，那么我们只需根据其中一条半边索引它的对边，进而索引对边所在的面片，即可找到目标邻面。这里的目标邻面指的是必然会和截平面相交的当前面片的相邻面片。


    幸运的是，这里我们至少不用为求交问题而发愁，因为我们在 TFace 类中封装了一个 intersect 函数，它的功能就是对高度为 z 的截平面和拓扑面片进行求交，并且能够同时返回截交线段和交点所在的半边或顶点。方便起见，我们不妨记交点所在的半边为
    edges，顶点为 node。如果我们回顾一下 intersect 的实现代码，我们会发现，这里 edges 为一存放 TEdge 类型数据的列表，它可能包含两个或一个元素。当
    edges 包含两个元素时，node 必为 None，此时截平面和面片交线的两个端点均落在半边上；而当 edges 包含一个元素时，node 不为 None，此时截交线段的两个端点分别落在半边和顶点上。在这两种情况下，目标邻面的寻找策略完全不同，我们必须分开讨论。


    我们先来看一下 intersect 函数返回的第一种情况，即 node 必为 None。此时截交线段的两个端点分别落在当前面片的两条半边上，如图 7.13
    所示，我们可以从 edges 中取出这两条半边，并记 $e_0 = edges[0]$, $e_1 = edges[1]$。


    ![](img/c3ab49ac4eb80e7a0a66462a29869ca2_149_0.png)


    此时目标邻面必然在 $e_0$ 对边所在的面或 $e_1$ 对边所在的面当中，即 $e_0.OE.F$ 或 $e_1.OE.F$。我们可以在这两个邻面中任选一个面作为目标邻面，但前提必须是邻面没有被使用过。因此如果
    $e_0.OE.F.used$ 为 False，我们就选 $e_0.OE.F$ 作为目标邻面；而如果 $e_0.OE.F.used$ 为 True 且 $e_1.OE.F.used$
    为 False，我们就选 $e_1.OE.F$ 为目标邻面。当然，如果 $e_0.OE.F.used$ 和'
