    需要说明的是，面向 Python 的 Clipper 库包含两个版本的裁剪执行函数，一个是 Execute，另一个是 Execute2，这两个函数的功能相似，主要区别在于对输出结果的组织。前者输出的是表示裁剪结果多边形（多段线）的线性列表，而后者输出的是带有父子节点结构的裁剪结果。对这里需要处理的开放线段裁剪问题，我们必须调用
    Execute2 函数，否则我们将无法得到裁剪结果。有意向对 Execute2 函数实现细节或返回结果的数据结构进一步了解的读者，可再去查看 Clipper
    库的相关文档。


    回到代码 9-6，在得到 Execute2 的结果 sln 后，我们需要从中将裁剪得到的线段提取出来，方法是遍历 sln 的子节点（Childs）。每个子节点包含一个
    Path 类型的轮廓（Contour），这些轮廓就是我们要求的填充线段。我们需要做的就是将 sln 的子节点轮廓转化为 Polyline 对象，然后再将 Polyline
    对象转化为 Segment 对象并保存到填充线段列表中。至此，我们实现了 clipHatches 的后半部分代码，即通过 Clipper 库裁剪得到了一系列填充线段。


