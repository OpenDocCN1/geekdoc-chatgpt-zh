    Point3D 对象、一个 Polyline 对象以及一个 STL 模型。注意到在以上 drawPoint 函数后，我们直接在同一行调用了 GetProperty
    和 SetColor 两个函数设置点的颜色，这正是应用了 VtkAdaptor 类在设计时考虑将 draw 函数的返回值设置为 vtkActor 对象的巧妙之处。最后需要强调的是，VtkAdaptor
    类是一个可以不断扩展的类，我们在这里给出的只是适应当前需求的代码。如果后面需求增加，我们可以给 VtkAdaptor 类增加相关属性或函数。


