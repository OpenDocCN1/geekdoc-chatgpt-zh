    在实际应用中，对一个点的几何变换往往是包含平移、缩放、旋转中一个或多个的复合操作，这时，我们就要按照操作的顺序依次对点右乘相应矩阵，而且右乘的次序不能随意调换，否则会影响几何变换结果。如公式(2-10)，我们首先对点
    P 绕 Z 轴旋转 θ1角度，然后再对得到的更新点绕 Y 轴旋转 θ2角度，随后分别对得到的更新点平移和缩放，最后得到 P''。


    P'' = P · M_n(θ1) · M_n(θ2) · M_t · M_s (2-10)


