    ## III. Intelligent Interviewing


    Currently, there are various AI products and services related to interviewing
    on the market. However, experienced interviewers know that evaluating interview
    effectiveness solely through keywords is far from sufficient. In terms of image
    analysis and speech analysis, although `AI facial expression analysis` and `AI
    voice analysis` functions can provide certain assistance to interviewers, interviewers
    still need to spend time watching videos one by one to evaluate candidates. Therefore,
    such products offer limited help in improving interview efficiency.


    Now, more technically mature AI interview products have appeared on the market.
    They can perform complete semantic analysis on the content of candidates'' answers
    and predict their competency. These products use more complex AI algorithms to
    conduct multi-dimensional deep analysis on the content of candidates'' answers,
    as well as their expressions, voices, and demeanor during the answering process.
    They can quickly screen out qualified candidates, and interviewers only need to
    select the most suitable ones from the candidates recommended by the AI product.
    Although this technology has not yet fully realized fully automated AI analysis
    and evaluation of interview effectiveness, it can already significantly improve
    the efficiency of the interview process.


    The most cutting-edge products currently on the market can achieve AI-automated
    structured interviews and even tell recruitment specialists whether to hire a
    candidate. Such products are very suitable for enterprises conducting large-scale
    recruitment activities, such as centralized recruitment and campus recruitment
    with high interview volumes, helping enterprises save significant recruitment
    costs and time.


    According to research in Industrial-Organizational Psychology, in evaluating candidates,
    Structured Interviews (`SI`) can yield more valid results than unstructured interviews.
    A structured interview involves having candidates answer a series of fixed questions
    during the interview process. Therefore, AI algorithms are mainly applied to structured
    interviews. Below is a case of a structured interview.


    > Please tell us about a work situation where you were not the formal leader but
    played a leadership role. Please provide:

    >

    > ● Detailed information about the context of the situation;

    > ● The actions you took in response to the situation;

    > ● The results of the actions.


    According to Social Signal Processing (`SSP`) theory, people often judge personality
    traits by observing and understanding the other party''s behavioral signals, and
    the interview process is no exception. Interviewers assess candidates'' personalities
    by observing and understanding their behavioral signals. These signals include
    the content of verbal expressions, facial expressions, gaze direction, and other
    body movements (as shown in Table 2-1). Researchers have proven the feasibility
    of using AI technology to assess candidates'' personalities during interviews
    through experiments; this technology is defined as Automatic Personality Recognition
    (`APR`).


    **Table 2-1　Linguistic Features to Be Extracted in Interviews**


    ![](img/table_image_62_0.jpg)


    Before building algorithms, HR practitioners need to annotate data, that is, manually
    evaluate candidates'' performance during the interview process. There are three
    evaluation methods: Behaviorally-Anchored Rating Scales (`BARS`), personality
    assessment based on first impressions, and overall hireability quantification.
    The operational steps for BARS are: first, collect Critical Incidents (`CIs`)
    that can be labeled as effective or ineffective job behaviors; then, edit the
    collected critical incidents into a uniform format and extract performance categories;
    subsequently, obtain suitable critical incidents and their corresponding performance
    categories through a series of cleaning and screening processes—usually requiring
    multiple annotators to label performance categories separately to ensure assessment
    accuracy; finally, review the critical incidents and performance categories to
    generate the final evaluation scales. BARS can complete the assessment of job-related
    knowledge and skills in interviews.


    The personality assessment based on first impressions uses a `7 Point Likert Scale`
    for quantifying each personality dimension, where 1 represents "Strongly Disagree,"
    2 "Disagree," 3 "Slightly Disagree," 4 "Neutral," 5 "Slightly Agree," 6 "Agree,"
    and 7 "Strongly Agree." Finally, the assessor makes an overall hireability assessment
    based on the BARS results and personality assessment results. It should be noted
    that each assessor needs to conduct a full set of assessments for each candidate''s
    performance in every structured interview. If there are 10 candidates and 5 structured
    interview questions, each assessor needs to complete 50 sets of assessments.


    Interview video analysis at the technical level comprises three parts: image data
    processing, speech data processing, and linguistic content data processing. Recruitment
    specialists can use software such as `OpenCV`, `Dlib`, and `OpenFace` to perform
    feature extraction on image data. Extracted features include head pose, eye gaze
    direction, and facial expressions based on facial landmarks. Speech features include
    speech rate, pitch, and pauses, which can be implemented using tools and methods
    like `pyAudioAnalysis` and `GeMAPS`. Linguistic content features can be extracted
    by converting speech to text via `ASR` technology, and then extracting linguistic
    features through `NLP`.


    After feature extraction, HR practitioners need to build core models. They can
    choose either traditional machine learning models or deep neural network models.
    Traditional machine learning models are relatively simple; deep neural network
    models can achieve end-to-end learning and have stronger model capabilities. An
    important factor influencing model architecture is the model''s output results.
    Currently, there are two main types of output: one outputs the candidate''s personality
    assessment results, and the other outputs the assessment result of whether to
    hire the candidate.


    For most small and medium-sized companies, fully possessing the aforementioned
    technical capabilities is no easy task. However, the good news is that corresponding
    products and services have emerged on the market. The AI interview system developed
    by `Hirevue` is being used by an increasing number of companies. Candidates record
    interview videos as required and upload them to the platform for evaluation and
    scoring. `Hirevue` can score and rank candidates based on tone, vocabulary usage,
    and even eye contact. The system also has an interesting feature: online tests
    can quickly assess candidates. If a candidate applies for a technical job, the
    system can include a quick coding test to test the candidate''s ability in programming
    languages relevant to the position. The system automatically scores candidates
    upon question submission and places them on a dashboard, so recruiters know which
    candidates to prioritize.


    ## IV. Intelligent Onboarding


    The following three technologies help enterprises automate the process of new
    hires completing onboarding procedures.


    #### 1. OCR Technology


    `OCR` technology refers to the technology of converting text from various bills,
    newspapers, books, manuscripts, and other printed materials into image information
    through optical input methods such as scanning, and then converting the image
    information into computer-inputtable information using text recognition technology.
    The application of this technology is relatively widespread and mature, but it
    was rarely applied in the field of Human Resources in the past. It was not until
    2016 that `OCR` technology began to be gradually applied to the HR field. When
    conducting background checks on new employees, recruitment specialists can have
    them upload information such as diplomas and ID cards to the system in advance,
    use `OCR` technology to recognize the information, and simultaneously connect
    to third-party credit platforms (such as the China Higher Education Student Information
    and Career Center, etc.), thus quickly completing the verification of new employees''
    identity information.


    #### 2. Facial Recognition Technology


    Facial recognition technology was initially applied in corporate administration
    departments, mainly used for access control and internal shopping. Later, it was
    also used in the process of handling new employee onboarding procedures. For example,
    after receiving the offer letter from the company, new employees can directly
    obtain a QR code sent by the company''s backend through facial recognition technology
    to make an advance appointment for reporting.


    #### 3. Appointment System——End-to-End Automation


    While sending appointment codes to new employees who have scheduled their reporting,
    recruitment specialists can also push company news and onboarding guides to them.
    After new employees arrive at the company and present their appointment codes,
    they can proceed directly to the onboarding processing location according to the
    onboarding guide. In addition, since onboarding work is often conducted in batches,
    to facilitate management, new employees'' appointment codes have been matched
    with seat numbers. "Onboarding Welcome Packs" are also placed on the seats, including
    the new employee''s computer, office supplies, documents to be signed, stationery,
    etc. This technology can shorten the onboarding procedures, which originally took
    half a day or even a whole day, to less than an hour. The appointment system connects
    the link between candidates, the feedback system, and the onboarding system, enabling
    not only end-to-end automation but also significantly improving new employees''
    favorability toward the company.


    The advantages of automated onboarding are reducing labor costs, improving processing
    efficiency, and ensuring the standardization and normalization of the onboarding
    process. Currently, there are two main methods for automated onboarding: mobile
    onboarding anytime, anywhere, and self-service kiosk onboarding. The specific
    operational steps for mobile onboarding and kiosk onboarding are as follows.


    #### (1) Mobile Onboarding Anytime, Anywhere


    **Step 1: Receive Offer Letter.** When the candidate receives the offer letter
    and clicks to accept, the system automatically pops up the onboarding guidelines
    and the "Onboarding Registration Form" filling page.


    **Step 2: Fill in Information.** The candidate fills in the "Onboarding Registration
    Form" and submits it.


    **Step 3: Upload Documents.** The candidate uploads electronic versions of required
    onboarding documents, such as ID card or passport, degree certificates, professional
    title certificates, bank card, and photos for badge making, etc.


    > **Note:** The above three steps should be completed before onboarding, accompanied
    by the recruitment specialist''s online background check (such as linking to the
    public security system, credit system, China Higher Education Student Information
    and Career Center, or third-party professional background check platforms).


    **Step 4: Electronically Sign Documents.** On the day of onboarding, the candidate
    views the labor contract, non-disclosure agreement, non-compete agreement, confirmation
    letter, etc., via mobile terminal, and signs the relevant contracts and agreements
    online through electronic signatures.


    #### (2) Self-Service Kiosk Onboarding


    **Step 1: Receive Offer Letter.** When the candidate receives the offer letter
    and clicks to accept, the system automatically pops up the onboarding guidelines
    and the "Onboarding Registration Form" filling page.


    **Step 2: Fill in Information.** The candidate fills in the "Onboarding Registration
    Form" and submits it.


    > **Note:** The above two steps are completed on the mobile terminal (mobile phone)
    before onboarding.


    **Step 3: Onboarding Verification.** On the day of onboarding, the candidate brings
    the required onboarding documents as prompted by the offer letter to the company''s
    self-service intelligent touch screen (`kiosk`), swipes their ID card for facial
    recognition, and performs identity verification (the backend synchronously connects
    to the public security system, credit system, China Higher Education Student Information
    and Career Center, or third-party professional background check platforms). After
    verification passes, the system issues onboarding guidelines to the candidate.


    **Step 4: Confirm Information.** The candidate confirms the "Onboarding Registration
    Form" on the `kiosk`.


    **Step 5: Electronically Sign Documents.** Sign the labor contract, non-disclosure
    agreement, non-compete agreement, and confirmation letter, etc. The candidate
    can view them on the `kiosk` and perform electronic signatures at the bottom right
    of each page and a final signature (in this step, the backend integrates electronic
    signature technology).


    **Step 6: Submit Documents.** Scan and upload the required onboarding documents
    (such as ID card or passport, degree certificates, professional title certificates,
    bank card, and photos for badge making, etc.) directly for archiving (in this
    step, the backend integrates `OCR` technology).


    **Step 7: Produce Badge.** Automatically produce work badges, meal cards, access
    cards, etc., automatically obtain corresponding employee numbers, departments,
    etc. Badges are double-sided printed and can be in color. At this point, the onboarding
    procedures are complete.


    Below, based on the sharing by Cao Xing, former Senior Product Expert at Alibaba,
    at the DHR Conference on October 16, 2020, we introduce Alibaba''s onboarding
    case.


    #### 1. Matter——Digital Transformation of Onboarding and Offboarding Processes


    From independent HR systems to splitting and reconstructing them into a data-driven
    digital platform, and then exploring intelligent modes such as automated background
    checks, offer recommendation values, electronic signatures, and certificate `OCR`,
    Alibaba''s onboarding and offboarding systems have undergone the following transformation
    path.


    Take the reasonable issuance of offer letters as an example.


    First, realize the structuring of the offer letter. For Alibaba, the most difficult
    part is not designing the company''s salary or structuring benefits, but structuring
    equity. Alibaba has many subsidiaries with different listing situations. Therefore,
    its equity structure is very complex. Only after pulling through equity data by
    technical means and aggregating the candidate''s salary, benefits, and stocks
    can the candidate''s total compensation be calculated.


    Second, benchmarking. Alibaba needs to consider the salary growth rate at the
    candidate''s original company, while also considering competitors'' situations.
    Alibaba''s offer letter compensation designs are completed by consulting firms
    according to industry rules, but sometimes consulting firms'' data is not timely,
    accurate, or granular enough. So, how to collect data independently without relying
    on consulting firms is a problem Alibaba needs to think about.


    Finally, consider internal equity. Alibaba also needs to combine the candidate''s
    interview performance, consider the ranking of the same level and the proportion
    above the mean, and reasonably offer a competitive salary.


    #### 2. People——Employee Digitalization


    Alibaba is also exploring how to precipitate data from various angles to comprehensively,
    objectively, three-dimensionally, and vividly evaluate a person. When evaluating
    a person, employees and managers must be distinguished. For example, when evaluating
    a manager, tags are used to depict their management experience, management contribution,
    and contribution to the team; these all need to be precipitated through various
    scenarios.


    After precipitating a lot of process data, employees can be evaluated in both
    structured and unstructured ways, comprehensively judging a person from dimensions
    such as ability, traits, potential, values, and internal social relationships.


    After precipitating employee tags, how to use them?


    In recruitment scenarios, advantages and disadvantages can be extracted from resume
    information, unstructured interview evaluations, and structured interview data.
    Resume screening is conducted through data integration and resume matching models.
    When interviewers view resumes, they can quickly judge whether a candidate is
    suitable for the position just through tag empowerment.


    In training scenarios, talent portraits can be formed based on data such as characteristics
    of internal trainees and characteristics of participants in similar courses. Tags
    are used through crowd selection methods to improve the precision and effectiveness
    of training.


    ## Section 3　Artificial Intelligence and Talent Profiling


    ### I. Concept of Talent Profiling


    Talent profiling refers to defining and describing the characteristics of talents
    who can competently perform a position, based on job requirements. It consists
    of job responsibilities and requirements (explicit information) as well as potential
    and extensions (implicit information). Talent profiling is a common language created
    by the HR department and business departments, and is a virtual portrait derived
    by HR practitioners based on a deep understanding of data.


    #### 1. Explicit and Implicit Information in Talent Profiling


    The explicit and implicit information in talent profiling is shown in Figure 2-8,
    with specific contents as follows.


    ![](img/image_69_0_m.jpg)


    **Figure 2-8　Explicit and Implicit Information in Talent Profiling**


    **Explicit Information**


    Explicit information can be directly extracted from systems or reports, generally
    referring to the following structured data:


    ◇ Personal Information: Gender, age, ethnicity, place of origin, political status,
    city of residence, marital status, fertility status, family background, etc.;

    ◇ Educational Information: Graduating institution, major, degree, academic qualifications,
    whether unified recruitment, etc.;

    ◇ Work Experience: Company, department, position, tenure, project experience,
    roles held, awards, patents, etc.;

    ◇ Work Performance: Performance, promotion, salary adjustment, transfer, rewards
    and punishments, etc.;

    ◇ Communication and Collaboration: Email frequency, Instant Messaging (`IM`) frequency,
    meeting frequency, number of posts and comments, number of likes, etc.;

    ◇ Overtime and Attendance: Clock-in time, overtime, leave, business trips, etc.


    **Implicit Information**


    Implicit information refers to the characteristics below the horizontal plane
    in Figure 2-8, mostly unstructured data as follows, which need to be derived through
    assessment or big data technology processing:


    ◇ Professional Competencies: Communication skills, expression skills, summarization
    skills, document writing skills, innovation skills, learning skills, design skills,
    operation skills, logical skills, etc.;

    ◇ Competencies: Leadership, strategic thinking, team management, planning management,
    customer orientation, etc.;

    ◇ Self-Cognition: Self-observation, self-evaluation, values (including life values,
    career values), etc.;

    ◇ Personality Traits: Emotional stability, extraversion, openness, agreeableness,
    conscientiousness, etc.


    #### 2. Key Talent Profiling


    Key talent profiling in enterprises includes the following parts.


    **Personal Basic Information**


    Personal basic information includes gender, age, tenure, education, region, etc.


    **Work-Related Information**


    Work-related information includes position, job sequence, title, job grade, performance,
    evaluation, training, etc.


    **Comprehensive Competency Manifestation**


    The comprehensive competency of key talents is reflected in the following aspects.


    ◇ Promotion speed, comparable with ordinary employees.

    ◇ Key talents'' performance in cross-domain capabilities, such as professional
    background changes in learning experience, and position changes and industry changes
    in work experience.

    ◇ Performance and evaluation.

    ◇ Potential index.

    ◇ Position in the Talent Nine-Box Grid.


    ### II. Which Positions Are Suitable for Talent Profiling


    Not all positions require talent profiling. Positions suitable for talent profiling
    are as follows.


    ● Key core positions, such as team leaders, technical leads, etc.

    ● Highly specialized positions, such as database development engineers, `JAVA`
    programmers.

    ● Positions with many incumbents in the same role that have a significant impact
    on corporate performance, such as product managers.

    ● Positions for which the enterprise recruits in batches, such as management trainees,
    etc.


    ### III. Application Scenarios of Talent Profiling


    Talent profiling is mostly used in the selection, utilization, development, and
    retention of core talents in enterprises. Specific application scenarios of talent
    profiling are as follows.


    1. **Talent Selection.** When issues arise such as the speed of talent supply
    failing to keep up with business development speed, heavy reliance on external
    talent supply, poor performance in certain positions, bloated talent teams in
    urgent need of optimization, and severe loss of key talents, enterprises need
    to conduct talent profiling.

    2. **Talent Utilization.** When issues arise such as person-job mismatch, unscientific
    team member allocation, and the need to employ new types of employees during transformation
    phases, enterprises need to conduct talent profiling.

    3. **Talent Development.** When collecting and analyzing training needs, scanning
    and assessing current leadership status, and evaluating training effects, enterprises
    can conduct talent profiling.

    4. **Talent Motivation.** When issues arise such as outstanding talents being
    unable to fully exert their abilities and subjective initiative, enterprises can
    conduct talent profiling.

    5. **Talent Allocation.** Through analysis of the matching degree between positions
    and talents, talent profiling can achieve optimal allocation of talents and positions,
    effectively reducing employment costs and improving work efficiency.


    ### IV. Steps of Talent Profiling


    The operational steps of talent profiling are as follows.


    **Step 1: Data Collection.**


    Data to be collected (core elements) includes employees'' basic information, work
    experience, educational background, work performance, communication and collaboration
    status, overtime and attendance frequency, evaluation feedback, personality traits,
    professional skills, competencies, self-cognition, and values, etc.


    Collection channels include talent archives, recruitment requisition forms, job
    descriptions, and talent samples (talent samples of target objects).


    Data collection methods include retrieval, research, interviews, Critical Incident
    Technique, etc.


    **Step 2: Integration and Classification.** Classify according to eight elements
    (work pressure, promotion and rotation, talent development, training and learning,
    compensation and performance, cultural atmosphere, external hotspots, office environment),
    integrate and summarize by similarity, etc.


    **Step 3: Data Refinement.** Remove the coarse and retain the fine, refine typical
    characteristics with commonality.


    **Step 4: Profile Construction.** Sort by priority, improve the profile, and simultaneously
    add language descriptions, such as scenario descriptions, to achieve digitization
    and tagging.


    **Step 5: Verification and Testing.** Continuously verify and correct during the
    recruitment process, maintain timely updates and vitality of the talent profile,
    etc.


    ### V. AI-Driven Talent Profiling


    With the development of artificial intelligence and big data technologies, data
    collection, mining, cleaning, and processing have become easier, and models and
    algorithms are increasingly widely applied in HR scenarios such as selection,
    utilization, development, and retention.


    As mentioned above, talent profiling can be divided into eight elements: work
    pressure, promotion and rotation, talent development, training and learning, compensation
    and performance, cultural atmosphere, external hotspots, and office environment.
    These elements run through the entire process of an employee''s career. These
    eight elements and their sub-items are shown in Figure 2-9.


    #### 1. Work Pressure


    Employees'' work pressure mainly comes from work, mostly arising from competitive
    relationships among colleagues, excessive workload, and excessive work responsibility.
    Pressure is both a positive, powerful driving force and a negative factor affecting
    employees'' work performance and occupational health. Sub-items of work pressure
    generally include superior-subordinate relationships, colleague relationships,
    competitive behaviors, responsibility changes, overtime frequency, meeting frequency,
    leisure time, etc.


    #### 2. Promotion and Rotation


    In most Internet companies, professional promotions are generally conducted twice
    a year, namely spring promotion and autumn promotion. Rotation is mainly a mechanism
    for cultivating high-potential cadres. Sub-items of promotion and rotation generally
    include speed, frequency, failure rate, efficiency, behavior, feedback, etc.


    #### 3. Talent Development


    Sub-items of talent development generally include work experience, personal skills,
    career planning, development potential, etc.


    #### 4. Training and Learning


    Sub-items of training and learning generally include learning plans, learning
    participation, learning feedback, learning recommendations, etc.


    ![](img/cutq_74_8350_l.jpg)


    **Figure 2-9　Eight Elements of Talent Profiling and Their Sub-items**


    #### 5. Compensation and Performance


    Sub-items of compensation and performance generally include work goals, agile
    communication, assessment, evaluation feedback, appraisal, salary adjustment,
    bonuses, compensation and benefits, etc.


    #### 6. Cultural Atmosphere


    Sub-items of cultural atmosphere generally include community, satisfaction, engagement,
    etc.


    #### 7. External Hotspots


    Sub-items of external hotspots generally include market conditions, competitor
    dynamics, entrepreneurial opportunities, investment heat, etc.


    #### 8. Office Environment


    Sub-items of office environment generally include environment adjustment, facial
    recognition access, fitness facilities, dining environment, etc.


    The essence of talent profiling is to abstract and model each person''s attribute
    tag system from massive personnel data. In terms of technical architecture, the
    talent profiling system includes multiple functional modules: data collection,
    feature calculation, feature library maintenance, machine learning models, application
    interfaces, and profiling applications. The construction of the employee tag system
    should be completed in layers and batches, and can be classified according to
    the above eight elements and multiple sub-items.


    The data for these eight elements and multiple sub-items come respectively from
    the enterprise''s internal systems (such as HR''s "onboarding, offboarding, promotion,
    demotion, transfer, selection, utilization, development, retention, resignation"
    + financial system + operation system), as well as external markets and research
    institutions. After cleaning and processing, these data are stored in big data
    warehouses such as `Hadoop`, `Spark`, or `HBase`.


    Commonly used algorithm models include `Logistic Regression`, `Linear Regression`,
    `Deep Learning`, `Tree-based Ensemble Learning`, `Matrix Factorization`, etc.,
    which are often used in combination in the practical application of talent profiling.


    Visualization presents results to users in the form of dashboards or boards for
    user judgment and decision-making reference.

