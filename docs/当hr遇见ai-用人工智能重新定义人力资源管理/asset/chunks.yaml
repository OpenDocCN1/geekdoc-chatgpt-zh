- raw: "### 一、我国人力资源管理的发展速度越来越快\n\n改革开放40多年来，我国人力资源管理发生了翻天覆地的变化。\n\n在改革开放早期，我们处在人力资源管理的“人事时代”，还不是纯粹的人力资源管理。1983年，中国人民大学与当时的国家劳动人事部成立了劳动人事学院。1992年，欧美企业特别是美资企业带着很多先进的管理理念在我国建立了分公司或办事处。与此同时，老一辈的人力资源从业者把人力资源的概念、理论介绍到国内，并提出了“六大模块”的概念。\n\
    \n1993年，我国颁布了《中华人民共和国公司法》。1995年，我国又施行了《中华人民共和国劳动法》。直到1993年，中国人民大学劳动人事学院才有了人力资源专业。\n\
    \n1997年底，人力资源管理领域的大师戴维·尤里奇出版了一本书，他在书中为人力资源管理工作画了四个象限，以此支撑战略人力资源的理念。后来的研究者从战略人力资源引申出了所谓的“三支柱理论”，三支柱是对四象限的重新分配。现在，人力资源管理已经从“六大模块”变成了“三支柱”。同时，我国的一些知名企业如华为、百度、阿里巴巴、腾讯、联想也已经有了一些不错的人力资源管理实践。\n\
    \n### 二、人力资源管理的智能时代即将到来\n\n随着大数据、云计算等新技术的快速发展与应用，我认为人力资源管理的智能时代即将到来。\n\n第一，新技术的不断出现。由于新技术的驱动，我们已经进入了数字化的时代。\n\
    \n第二，海量数据的产生。数字化带来的后果就是产生了海量的数据，除了结构化数据，很多非结构化数据通过技术手段（如数据的交互、存储、调用、清洗加工等）也被改变成了结构化数据。\n\
    \n第三，新冠肺炎疫情的出现。虽然疫情给人们的生活和工作带来了巨大的冲击，但是换个角度看，它也在一定程度上加快了数字化转型的步伐。\n\n第四，一大批优秀的数字化企业开始成长壮大。我国有很多像百度、阿里巴巴、腾讯这样的优秀企业，它们正在引领时代进步，把数据实践变得更加智能。\n\
    \n### 三、人力资源的智能化管理能解决CEO们关注的核心问题\n\n人力资源的智能化管理能解决哪些问题呢？我认为，它能解决CEO们做梦都想解决的以下问题：\n\
    \n1.解决好适配的问题，最好的人，最适配的人，是否穷举了？\n\n2.培养谁，如何培养，谁是最有潜力的人，谁能领军？\n\n3.谁的贡献意愿强，谁会陪伴企业共同成长，谁会走，谁会留？\n\
    \n4.谁的贡献大，谁的价值高？\n\n5.哪个组织的创新能力强，哪个组织更有战斗力？\n\n6.哪个组织的发展比较稳定，哪个组织的运营风险高？\n\n7.哪个组织的企业文化好，哪个群体能够出英雄？\n\
    \n8.企业战略是否落地，员工是否认同？\n\n针对以上问题，过去企业管理者或人力资源管理者只能依靠观察或者以心理学为基础设计调查问卷寻求答案。但是，被调查者的回答往往是经过加工的，其真实性必然会受到一定的影响。\n\
    \n智能时代的人力资源管理则能够解决上述问题，因为数据和算法会告诉你答案。\n\n### 四、智能时代的人力资源管理会加入越来越多的科学元素\n\n在人力资源管理的智能时代，人工智能让人力资源管理融入了更多的科学元素，以数据科学为基础对服务进行判断。\n\
    \n智能时代把科学管理和人性管理有机地结合了起来，今后高校的人力资源管理专业完全可以被归为理科或新文科，“新”就是加入了数据和智能化的内容。\n\n我曾和一位心理学家聊起如何让HR从业者拿到更高的工资，如何让人力资源专业有更高的含金量。他说过去心理学领域也曾面临这样的窘境，大家都觉得学心理学没什么技术含量，但现在社会已对其彻底改变了认知。我认为，从现在开始，各大院校对人力资源管理专业的教学也要加入数据元素和科学元素。这样坚持10年、20年，人力资源管理专业的门槛和含金量才会更高，人力资源从业者才能够挣到更高的工资，人力资源管理才能成为一个备受尊重的职业，这也是我一直在倡导的。\n\
    \n未来，在人才、组织、思想的三要素中，人力资源管理数据中台会起到越来越重要的作用。COE（专家中心）一定会被大数据赋能或提升，HRBP（人力资源业务伙伴）也会变得越来越强大。“数据中台+HRBP”的模式将成为人力资源管理的发展趋势。只有做好数据资源管理，HRBP才能拥有更有力的“武器”，才提升企业发展的战略协同性。因此，人力资源管理从业者需要提升自身的智能思维和数据化能力。\n\
    \n让我们共同走进人力资源智能管理的新时代吧。\n\n刘辉  \n\n青贝克公司（KMC）创始人兼首席执行官  \n\n中国人力资源开发研究会副会长、智能分会会长\
    \  \n\n前百度公司人力资源和行政管理高级副总裁  \n\n前摩托罗拉公司全球人力资源副总裁\n\n# [序言二　人才管理工作将走向智能化的新时代](../Text/contents.xhtml#z_5)\n\
    \n随着大数据、云计算、区块链等新技术的迅猛发展，人才管理工作下一步将走向何方？我的判断是它将走向智能化。从人才描述到人才预测，再到人才决策的全链条，都离不开数据的应用，那将是一个与今天人才管理工作迥然相异的新景观。\n\
    \n请看以下三组数据：一是2018年我国共有94万台机器人，占全球机器人总量的26.9%；二是到2019年2月，我国共有745家从事人工智能研发工作的企业，已占世界人工智能企业总数（3\
    \ 438家）的21.67%，仅次于排名第一的美国（美国有1 446家人工智能企业，占比为42.06%）；三是据我国教育部门测算，我国人工智能专业的人才缺口超过500万，国内供求比高达1:10，社会对人工智能人才的需求正在急剧上升。\n\
    \n以上数据足以证明，人工智能将在我国企业信息化建设的过程中扮演重要角色，它也将对人才管理工作产生重大而深远的影响。换言之，人才管理工作将走向“人+智能化”的阶段。未来，从事人才管理工作的不仅有人，还会有人工智能产品、机器人的参与。各种与人才有关的软件、算法、模型会大量涌现，人才管理工作将更加精准、快捷、高效。\n\
    \n当前，人才管理工作者最需要做哪些工作呢？\n\n首先，掌握大数据思维，从思维方式上适应这个新时代。\n\n大数据思维有四个特征：一是定量，认为一切皆可测量，可描述；二是相关，认为一切皆可连接、可相知；三是实验，认为一切皆可尝试、可开拓；四是预测，认为一切皆可预测。\n\
    \n其次，提前认识到智能化时代对我们提出的人才素质新要求。\n\n有国外学者指出，进入智能化时代后，人才管理工作者需要具备的素质有以下五条：一是高度适应VUCA（易变性、不确定性、复杂性、模糊性）时代的新环境，能使自己的情绪不受环境变化的影响；二是能够高效处理信息；三是能够以跨界思维实现持续创新；四是具备以客户为中心的思维；五是具有学习敏锐度，能够保持对应知、应学内容的敏感性，以及反应的敏捷性。\n\
    \n有学者指出，未来在人才管理工作领域将会有机器人及人工智能产品的介入。那么，与机器人相比，谁更聪明？谁更能干呢？\n\n我可以负责任地告诉你：\n\n（1）在工作快捷性和准确性方面，你肯定不如机器人；\n\
    \n（2）在工作质量上，机器人很容易超越你；\n\n（3）在情感、抱负、想象力等方面，你比机器人有优势；\n\n（4）机器人能够发现你发现不了的问题；\n\n\
    （5）机器人能够完成你完成不了的任务；\n\n（6）你需要得到机器人的帮助，同机器人一起工作。\n\n总之，希望你不要成为被机器人替代的人。\n\n可见，在逻辑思维、知识记忆与信息搜索、思维的快捷性等方面，人类不如机器人；但是在想象力、同情心、意志力等方面，人类优胜于机器人。所以，如果未来人能够与机器人一起上班、协同工作，往往会产生更好的效果。\n\
    \n智能化不仅反映在机器人的工作能力上，而且表现在更为广泛的范畴上。我的一位“海归”朋友能够利用网络爬虫技术，帮助任何一个区域的管理者快速绘制出那里的人才需求地图。另一位供职于著名网络公司的朋友则能够制造“数据孪生公司”，利用这个虚拟的公司探索该公司人才结构的优化之路。现在，有的组织已经开始利用大数据预测人才、规划人才，加强本组织的人才队伍建设。\n\
    \n今天的人才管理工作者应该明白，未来，从人才发现到人才配置、使用、培养、评价、激励、流动等人才管理工作的各个环节都会发生变化。到那时，人才发现的时空压缩、人才培养的个性凸显、人才考核的及时与前置、人才流动方式的变化与通畅，都将使今天的我们惊讶不已。\n\
    \n大河奔腾不息，未来已经到来。让我们张开双臂，迎接智能化人才新时代的到来！\n\n王通讯  \n\n原中国人事科学研究院院长兼人事与人才研究所所长  \n\
    \n上海交通大学兼职教授  \n\n首都经济贸易大学博士生导师  \n\n中国人才研究会副会长、秘书长\n\n# [第一章　人工智能在人力资源中的应用场景](../Text/contents.xhtml#z_6)\n\
    \n1956年夏，麦卡锡、明斯基等科学家在美国达特茅斯学院开会研讨“如何用机器模拟人的智能”时首次提出了“人工智能”（Artificial Intelligence，AI）的概念。\n\
    \n人工智能是研发、模拟和扩展人类智能的新科学。科学家们研究人工智能的目的是促使智能机器会听（如语音识别、机器翻译等）、会看（如图像识别、文字识别等）、会说（如语音合成、人机对话等）、会思考（如人机对弈、定理证明等）、会学习（如机器学习等）、会行动（如自动驾驶汽车等）。\n\
    \n人工智能的概念自提出至今已有60多年，从起步、反思到应用、低迷，再到如今的蓬勃发展已经历了几个阶段。曾有人戏称，人工智能就像一列火车，你苦苦期盼它的到来，它终于来了却呼啸而过，把你抛在了身后。虽然这是一种笑谈，但也反映了人工智能技术发展的速度之快。\n\
    \n目前，人工智能技术已被人们广泛应用于工作与生活的各个领域。2016年，人工智能技术在人力资源领域的应用推动了人力资源的发展，并重塑了人力资源管理。\n\n\
    ## [第一节　人工智能的应用场景与挑战](../Text/contents.xhtml#b_5)\n\n人工智能是一门融合了计算机科学、统计学、脑神经学和社会科学的综合性前沿学科。科学家们研究、开发它的目标是希望机器能够拥有像人一样的智力和能力，可以替代人类具备识别、认知、分类和决策等多种功能。随着智能家电、可穿戴设备、智能机器人等的出现和普及，人工智能技术已经进入人们工作、学习和生活的多个领域。那么，目前人工智能技术具体应用在哪些细分领域呢？\n\
    \n### [一、应用场景](../Text/contents.xhtml#c_6)\n\n人工智能技术应用的细分领域包括深度学习、计算机视觉、智能机器人、语音识别、自然语言处理、用户画像等。\n\
    \n1.深度学习\n\n（1）深度学习的概念\n\n深度学习（deep learning）是人工智能领域机器学习的一个重要应用分支，是一种以人工神经网络为架构，对数据进行表征学习的算法。至今已有数种深度学习框架，如卷积神经网络、递归神经网络和深度置信网络等，它们被应用于计算机视觉、语音识别、自然语言处理、音频识别与生物信息学等领域并获取了极好的效果。\n\
    \n（2）深度学习的典型应用场景\n\n说到深度学习，大家第一个想到的肯定是阿尔法狗（AlphaGo），它通过一次又一次的学习、更新算法，在“人机大战”中打败了围棋大师李世石。百度的机器人“小度”多次参加最强大脑的“人机大战”并取得胜利，这也是深度学习在日常生活中的应用。深度学习技术也有助于企业进行人才发展分析和辅助决策。\n\
    \n2.计算机视觉\n\n（1）计算机视觉的概念\n\n人工智能技术最核心的功能在于它实现了对环境的感知并完成了反馈输出。人类可以通过视觉、听觉、嗅觉、味觉和触觉从环境中获取信息，其中视觉是最主要的方式。计算机视觉（computer\
    \ vision）是指用摄像机、计算机和其他相关设备模拟生物视觉，通过对采集的图片或视频进行处理以获得相应场景的信息，并进一步做图形处理，从图像中识别物体、场景的能力。计算机视觉在识别方面的主要任务包括分类、定位、检测、分割和跟踪等。\n\
    \n（2）计算机视觉的典型应用场景\n\n计算机视觉主要用于图像识别，其中包括被用来提高对疾病的预测、诊断和治疗的医疗成像分析，被用于自动识别照片中人物的（如刷脸支付）人脸识别技术，高速公路上的ETC车牌识别，基于计算机视觉的无人驾驶感知系统（如无人车），以及安防和监控领域。计算机视觉在人力资源管理领域的常见应用包括刷脸办理入职、刷脸考勤、刷脸培训签到等。\n\
    \n3.智能机器人\n\n（1）智能机器人的概念\n\n智能机器人具有相当发达的“大脑”，其中发挥作用的是中央处理器。智能机器人具备各种内部信息传感器和外部信息传感器，可以模拟视觉、听觉、触觉和嗅觉。除此之外，智能机器人还拥有效应器，其主要作用是观察周边环境。智能机器人至少具备三个要素，即感觉要素、反映要素和思考要素。\n\
    \n（2）智能机器人的典型应用场景\n\n智能机器人被应用于很多领域和场景中，如扫地机器人、陪伴机器人、客服机器人、问答系统机器人、机器翻译、对话系统机器人等。智能穿戴设备、智能家电、智能出行或无人机设备依据的也是类似的原理。复杂的智能机器人如机械手臂和快递分拣机器人可以应用在更加开放的环境中。智能机器人在人力资源领域的常见应用就是客服对话机器人、访客接待机器人、培训机器人等。\n\
    \n4.语音识别\n\n（1）语音识别的概念\n\n语音识别是一项让机器把语音信号转变为相应的文本或命令的高科技技术。通俗地说，就是机器把语音转化为文字，并对其进行识别、认知和处理。\n\
    \n（2）语音识别的典型应用场景\n\n语音识别主要应用在工业、家电、汽车、医疗、家庭服务、消费类电子产品等各个领域。\n\n2010年之后，由于深度学习的广泛应用，语音识别的准确率得到了大幅提升，Siri、Voice\
    \ Search和Echo等可以实现不同语言间的交流；你对着手机说一段话，智能助手就可以帮助你完成一些任务。国内的语音识别产品包括百度语音、科大讯飞、渡鸦等。语音识别在人力资源管理领域的常见应用就是共享服务中心的客服小秘、招聘小秘、培训助手、虚拟个人助理等。\n\
    \n5.自然语言处理\n\n（1）自然语言处理的概念\n\n自然语言处理（Natural Language Processing，NLP）将有助于实现目标的各种技术（如计算机科学、人工智能、语言学、人类或自然语言等）进行融合，实现了人机之间的自然语言通信。简单地讲，它就相当于机器语言和人类语言的翻译。在人工智能出现之前，机器能够自动处理少量的结构化数据。随着网络的普及，人类进入了信息时代，机器需要处理的数据越来越多，而网络中存在的大量文本、图片、视频往往都属于非结构化数据，其中文本的数量又是最多的，且绝大部分属于自然语言。由于计算机无法直接处理基于自然语言的文本数据，为了能够分析和利用这些文本信息，就需要用到NLP技术。\n\
    \n（2）自然语言处理的典型应用场景\n\n自然语言处理的应用领域比较广泛，如信息提取、智能问答、机器翻译、文本挖掘、舆论分析、情感分析、语音识别和生成、信息过滤、信息检索、知识图谱等。自然语言处理在人力资源管理领域中的常见应用就是客服对话机器人、舆情分析、组织CT（业绩诊断系统）、人才CT等。\n\
    \n6.用户画像\n\n（1）用户画像的概念\n\n用户画像又称用户角色，是勾画目标用户、联系用户诉求与设计方向的有效工具。在实际操作过程中，用户画像往往会以最为浅显的语言将用户的属性、行为与期待连接起来。作为实际用户的虚拟代表，用户画像并不是脱离产品和市场构建出来的。用户画像需要有代表性，能代表产品的主要受众。\n\
    \n（2）用户画像的典型应用场景\n\n用户画像最早应用于电商领域，其核心工作就是为用户打标签。标签通常是人为规定的高度精练的特征标识，如年龄、性别、地域、兴趣等。利用这些标签将用户形象具体化，从而精准发现潜在用户，并为用户提供有针对性的服务。\n\
    \n用户画像在人力资源管理领域的应用就是人才画像。基于大数据分析这项技术，企业可以将用户画像的结果用于描述用户的特征，分析用户的喜好。同时，用户画像的结果还可以用于企业对关键人才的选、用、育、留等环节，如进行精准培训、分析外部市场的薪酬水平、优化人才招募或配置等。\n\
    \n### [二、人工智能面临的挑战](../Text/contents.xhtml#c_7)\n\n当前，人工智能的研发成果仍然属于弱人工智能而非强人工智能。所谓强人工智能，就是通用人工智能（Artificial\
    \ General Intelligence，AGI），其具备类似人类的学习、认知和推理等方面的能力，拥有自我意识和思想，能够独立决策。弱人工智能（Artificial\
    \ Narrow Intelligence，ANI）则只能完成特定的、有限的任务，如完成图像识别、语音识别和机器翻译等任务。弱人工智能并不具备真正意义上的思考能力，本质上还是人类的操作工具。\n\
    \n人工智能面临着如下诸多挑战。\n\n1.未来，人工智能需要更加注重图像识别的效果与体验。\n\n2.在会场等嘈杂的环境中，噪声对语音识别的质量仍有影响。因此，长尾识别技术有待优化。\n\
    \n3.智能机器人对语意的理解能力仍欠缺，无法识别和认知不规范的口语；机器人的知识库也需要持续更新和丰富。\n\n4.用户画像如何打通人力资源数据与业务运营数据之间的关联仍是难题，管理风险预警、组织效能、组织仿真等越来越值得探索。\n\
    \n5.基于机器学习的预测算法，训练数据的数量不够多、质量也不够高，训练样本不具备代表性、无关特征较多，训练数据过拟合/欠拟合等都是影响因素。\n\n6.决策系统面临两个挑战。第一个是不通用，即学习知识的不可迁移性，如用一个方法学习下象棋，就不能直接将其迁移到下围棋上；第二个是需要利用大量数据进行有效的模拟和训练。因此，人力资源领域的决策系统智能化水平有限，现阶段仍然需要依靠人的智慧。\n\
    \n## [第二节　人工智能重塑人力资源](../Text/contents.xhtml#b_8)\n\n人工智能对人力资源管理的各个模块产生了一定的影响，一方面，标准化、程序化、重复性高的工作将逐步被“机器人”全部或部分代劳；另一方面，人工智能与传统的人力资源管理模式相互碰撞，为人力资源从业者带来了正向的激励，在改善用户体验及趋势预测、辅助决策等方面大大提升了从业者的业务水平。人工智能在人力资源领域的运用对人力资源从业者也提出了更高的要求，人力资源从业者不仅要使出浑身解数为企业引入数字化技术方面的人才，而且自己要跟上前沿技术的发展脚步，认真学习并尝试应用这一技术。\n\
    \n### [一、人力资源数字化的定义](../Text/contents.xhtml#c_9)\n\n目前，大部分传统企业仍处在向数字化转型的阶段。数字化转型是指组织利用最新的数字化技术驱动商业模式创新和商业生态系统重构，目的是实现业务的转型、创新和增长。数字化技术包括我们常说的“ABCD”，其中A是指人工智能（AI）、B是指区块链（Block\
    \ Chain）、C是指云计算（Cloud）、D是指大数据（Big Data），还包括物联网（The Internet of Things，IoT）、增强现实技术（Augmented\
    \ Reality，AR）、虚拟现实技术（Virtual Reality，VR）、机器人流程自动化（Robotic Process Automation，RPA）、3D打印等，如图1-1所示。\n\
    \n![](Images/cutq_27_0114_l.jpg)\n\n图1-1　数字化技术的具体体现"
  fmt: "\n# 一、我国人力资源管理的发展速度越来越快\n\n改革开放40多年来，我国人力资源管理发生了翻天覆地的变化。\n\n在改革开放早期，我们处在人力资源管理的“人事时代”，还不是纯粹的人力资源管理。1983年，中国人民大学与当时的国家劳动人事部成立了劳动人事学院。1992年，欧美企业特别是美资企业带着很多先进的管理理念在我国建立了分公司或办事处。与此同时，老一辈的人力资源从业者把人力资源的概念、理论介绍到国内，并提出了“六大模块”的概念。\n\
    \n1993年，我国颁布了《中华人民共和国公司法》。1995年，我国又施行了《中华人民共和国劳动法》。直到1993年，中国人民大学劳动人事学院才有了人力资源专业。\n\
    \n1997年底，人力资源管理领域的大师戴维·尤里奇出版了一本书，他在书中为人力资源管理工作画了四个象限，以此支撑战略人力资源的理念。后来的研究者从战略人力资源引申出了所谓的“三支柱理论”，三支柱是对四象限的重新分配。现在，人力资源管理已经从“六大模块”变成了“三支柱”。同时，我国的一些知名企业如华为、百度、阿里巴巴、腾讯、联想也已经有了一些不错的人力资源管理实践。\n\
    \n## 二、人力资源管理的智能时代即将到来\n\n随着大数据、云计算等新技术的快速发展与应用，我认为人力资源管理的智能时代即将到来。\n\n第一，新技术的不断出现。由于新技术的驱动，我们已经进入了数字化的时代。\n\
    \n第二，海量数据的产生。数字化带来的后果就是产生了海量的数据，除了结构化数据，很多非结构化数据通过技术手段（如数据的交互、存储、调用、清洗加工等）也被改变成了结构化数据。\n\
    \n第三，新冠肺炎疫情的出现。虽然疫情给人们的生活和工作带来了巨大的冲击，但是换个角度看，它也在一定程度上加快了数字化转型的步伐。\n\n第四，一大批优秀的数字化企业开始成长壮大。我国有很多像百度、阿里巴巴、腾讯这样的优秀企业，它们正在引领时代进步，把数据实践变得更加智能。\n\
    \n## 三、人力资源的智能化管理能解决CEO们关注的核心问题\n\n人力资源的智能化管理能解决哪些问题呢？我认为，它能解决CEO们做梦都想解决的以下问题：\n\
    \n1. 解决好适配的问题，最好的人，最适配的人，是否穷举了？\n2. 培养谁，如何培养，谁是最有潜力的人，谁能领军？\n3. 谁的贡献意愿强，谁会陪伴企业共同成长，谁会走，谁会留？\n\
    4. 谁的贡献大，谁的价值高？\n5. 哪个组织的创新能力强，哪个组织更有战斗力？\n6. 哪个组织的发展比较稳定，哪个组织的运营风险高？\n7. 哪个组织的企业文化好，哪个群体能够出英雄？\n\
    8. 企业战略是否落地，员工是否认同？\n\n针对以上问题，过去企业管理者或人力资源管理者只能依靠观察或者以心理学为基础设计调查问卷寻求答案。但是，被调查者的回答往往是经过加工的，其真实性必然会受到一定的影响。\n\
    \n智能时代的人力资源管理则能够解决上述问题，因为数据和算法会告诉你答案。\n\n## 四、智能时代的人力资源管理会加入越来越多的科学元素\n\n在人力资源管理的智能时代，人工智能让人力资源管理融入了更多的科学元素，以数据科学为基础对服务进行判断。\n\
    \n智能时代把科学管理和人性管理有机地结合了起来，今后高校的人力资源管理专业完全可以被归为理科或新文科，“新”就是加入了数据和智能化的内容。\n\n我曾和一位心理学家聊起如何让`HR`从业者拿到更高的工资，如何让人力资源专业有更高的含金量。他说过去心理学领域也曾面临这样的窘境，大家都觉得学心理学没什么技术含量，但现在社会已对其彻底改变了认知。我认为，从现在开始，各大院校对人力资源管理专业的教学也要加入数据元素和科学元素。这样坚持10年、20年，人力资源管理专业的门槛和含金量才会更高，人力资源从业者才能够挣到更高的工资，人力资源管理才能成为一个备受尊重的职业，这也是我一直在倡导的。\n\
    \n未来，在人才、组织、思想的三要素中，人力资源管理数据中台会起到越来越重要的作用。`COE`（专家中心）一定会被大数据赋能或提升，`HRBP`（人力资源业务伙伴）也会变得越来越强大。“数据中台+`HRBP`”的模式将成为人力资源管理的发展趋势。只有做好数据资源管理，`HRBP`才能拥有更有力的“武器”，才提升企业发展的战略协同性。因此，人力资源管理从业者需要提升自身的智能思维和数据化能力。\n\
    \n让我们共同走进人力资源智能管理的新时代吧。\n\n刘辉  \n青贝克公司（KMC）创始人兼首席执行官  \n中国人力资源开发研究会副会长、智能分会会长\
    \  \n前百度公司人力资源和行政管理高级副总裁  \n前摩托罗拉公司全球人力资源副总裁\n\n# 序言二　人才管理工作将走向智能化的新时代\n\n随着大数据、云计算、区块链等新技术的迅猛发展，人才管理工作下一步将走向何方？我的判断是它将走向智能化。从人才描述到人才预测，再到人才决策的全链条，都离不开数据的应用，那将是一个与今天人才管理工作迥然相异的新景观。\n\
    \n请看以下三组数据：\n- 一是2018年我国共有94万台机器人，占全球机器人总量的26.9%；\n- 二是到2019年2月，我国共有745家从事人工智能研发工作的企业，已占世界人工智能企业总数（3\
    \ 438家）的21.67%，仅次于排名第一的美国（美国有1 446家人工智能企业，占比为42.06%）；\n- 三是据我国教育部门测算，我国人工智能专业的人才缺口超过500万，国内供求比高达1:10，社会对人工智能人才的需求正在急剧上升。\n\
    \n以上数据足以证明，人工智能将在我国企业信息化建设的过程中扮演重要角色，它也将对人才管理工作产生重大而深远的影响。换言之，人才管理工作将走向“人+智能化”的阶段。未来，从事人才管理工作的不仅有人，还会有人工智能产品、机器人的参与。各种与人才有关的软件、算法、模型会大量涌现，人才管理工作将更加精准、快捷、高效。\n\
    \n当前，人才管理工作者最需要做哪些工作呢？\n\n## 首先，掌握大数据思维，从思维方式上适应这个新时代\n\n大数据思维有四个特征：\n- 一是定量，认为一切皆可测量，可描述；\n\
    - 二是相关，认为一切皆可连接、可相知；\n- 三是实验，认为一切皆可尝试、可开拓；\n- 四是预测，认为一切皆可预测。\n\n## 其次，提前认识到智能化时代对我们提出的人才素质新要求\n\
    \n有国外学者指出，进入智能化时代后，人才管理工作者需要具备的素质有以下五条：\n- 一是高度适应`VUCA`（易变性、不确定性、复杂性、模糊性）时代的新环境，能使自己的情绪不受环境变化的影响；\n\
    - 二是能够高效处理信息；\n- 三是能够以跨界思维实现持续创新；\n- 四是具备以客户为中心的思维；\n- 五是具有学习敏锐度，能够保持对应知、应学内容的敏感性，以及反应的敏捷性。\n\
    \n有学者指出，未来在人才管理工作领域将会有机器人及人工智能产品的介入。那么，与机器人相比，谁更聪明？谁更能干呢？\n\n我可以负责任地告诉你：\n1. 在工作快捷性和准确性方面，你肯定不如机器人；\n\
    2. 在工作质量上，机器人很容易超越你；\n3. 在情感、抱负、想象力等方面，你比机器人有优势；\n4. 机器人能够发现你发现不了的问题；\n5. 机器人能够完成你完成不了的任务；\n\
    6. 你需要得到机器人的帮助，同机器人一起工作。\n\n总之，希望你不要成为被机器人替代的人。\n\n可见，在逻辑思维、知识记忆与信息搜索、思维的快捷性等方面，人类不如机器人；但是在想象力、同情心、意志力等方面，人类优胜于机器人。所以，如果未来人能够与机器人一起上班、协同工作，往往会产生更好的效果。\n\
    \n智能化不仅反映在机器人的工作能力上，而且表现在更为广泛的范畴上。我的一位“海归”朋友能够利用网络爬虫技术，帮助任何一个区域的管理者快速绘制出那里的人才需求地图。另一位供职于著名网络公司的朋友则能够制造“数据孪生公司”，利用这个虚拟的公司探索该公司人才结构的优化之路。现在，有的组织已经开始利用大数据预测人才、规划人才，加强本组织的人才队伍建设。\n\
    \n今天的人才管理工作者应该明白，未来，从人才发现到人才配置、使用、培养、评价、激励、流动等人才管理工作的各个环节都会发生变化。到那时，人才发现的时空压缩、人才培养的个性凸显、人才考核的及时与前置、人才流动方式的变化与通畅，都将使今天的我们惊讶不已。\n\
    \n大河奔腾不息，未来已经到来。让我们张开双臂，迎接智能化人才新时代的到来！\n\n王通讯  \n原中国人事科学研究院院长兼人事与人才研究所所长  \n上海交通大学兼职教授\
    \  \n首都经济贸易大学博士生导师  \n中国人才研究会副会长、秘书长\n\n# 第一章　人工智能在人力资源中的应用场景\n\n1956年夏，麦卡锡、明斯基等科学家在美国达特茅斯学院开会研讨“如何用机器模拟人的智能”时首次提出了“人工智能”（`Artificial\
    \ Intelligence`，`AI`）的概念。\n\n人工智能是研发、模拟和扩展人类智能的新科学。科学家们研究人工智能的目的是促使智能机器会听（如语音识别、机器翻译等）、会看（如图像识别、文字识别等）、会说（如语音合成、人机对话等）、会思考（如人机对弈、定理证明等）、会学习（如机器学习等）、会行动（如自动驾驶汽车等）。\n\
    \n人工智能的概念自提出至今已有60多年，从起步、反思到应用、低迷，再到如今的蓬勃发展已经历了几个阶段。曾有人戏称，人工智能就像一列火车，你苦苦期盼它的到来，它终于来了却呼啸而过，把你抛在了身后。虽然这是一种笑谈，但也反映了人工智能技术发展的速度之快。\n\
    \n目前，人工智能技术已被人们广泛应用于工作与生活的各个领域。2016年，人工智能技术在人力资源领域的应用推动了人力资源的发展，并重塑了人力资源管理。\n\n\
    ## 第一节　人工智能的应用场景与挑战\n\n人工智能是一门融合了计算机科学、统计学、脑神经学和社会科学的综合性前沿学科。科学家们研究、开发它的目标是希望机器能够拥有像人一样的智力和能力，可以替代人类具备识别、认知、分类和决策等多种功能。随着智能家电、可穿戴设备、智能机器人等的出现和普及，人工智能技术已经进入人们工作、学习和生活的多个领域。那么，目前人工智能技术具体应用在哪些细分领域呢？\n\
    \n### 一、应用场景\n\n人工智能技术应用的细分领域包括深度学习、计算机视觉、智能机器人、语音识别、自然语言处理、用户画像等。\n\n#### 1.\
    \ 深度学习\n\n##### (1) 深度学习的概念\n\n深度学习（`deep learning`）是人工智能领域机器学习的一个重要应用分支，是一种以人工神经网络为架构，对数据进行表征学习的算法。至今已有数种深度学习框架，如卷积神经网络、递归神经网络和深度置信网络等，它们被应用于计算机视觉、语音识别、自然语言处理、音频识别与生物信息学等领域并获取了极好的效果。\n\
    \n##### (2) 深度学习的典型应用场景\n\n说到深度学习，大家第一个想到的肯定是`AlphaGo`，它通过一次又一次的学习、更新算法，在“人机大战”中打败了围棋大师李世石。百度的机器人“`小度`”多次参加最强大脑的“人机大战”并取得胜利，这也是深度学习在日常生活中的应用。深度学习技术也有助于企业进行人才发展分析和辅助决策。\n\
    \n#### 2. 计算机视觉\n\n##### (1) 计算机视觉的概念\n\n人工智能技术最核心的功能在于它实现了对环境的感知并完成了反馈输出。人类可以通过视觉、听觉、嗅觉、味觉和触觉从环境中获取信息，其中视觉是最主要的方式。计算机视觉（`computer\
    \ vision`）是指用摄像机、计算机和其他相关设备模拟生物视觉，通过对采集的图片或视频进行处理以获得相应场景的信息，并进一步做图形处理，从图像中识别物体、场景的能力。计算机视觉在识别方面的主要任务包括分类、定位、检测、分割和跟踪等。\n\
    \n##### (2) 计算机视觉的典型应用场景\n\n计算机视觉主要用于图像识别，其中包括被用来提高对疾病的预测、诊断和治疗的医疗成像分析，被用于自动识别照片中人物的（如刷脸支付）人脸识别技术，高速公路上的`ETC`车牌识别，基于计算机视觉的无人驾驶感知系统（如无人车），以及安防和监控领域。计算机视觉在人力资源管理领域的常见应用包括刷脸办理入职、刷脸考勤、刷脸培训签到等。\n\
    \n#### 3. 智能机器人\n\n##### (1) 智能机器人的概念\n\n智能机器人具有相当发达的“大脑”，其中发挥作用的是中央处理器。智能机器人具备各种内部信息传感器和外部信息传感器，可以模拟视觉、听觉、触觉和嗅觉。除此之外，智能机器人还拥有效应器，其主要作用是观察周边环境。智能机器人至少具备三个要素，即感觉要素、反映要素和思考要素。\n\
    \n##### (2) 智能机器人的典型应用场景\n\n智能机器人被应用于很多领域和场景中，如扫地机器人、陪伴机器人、客服机器人、问答系统机器人、机器翻译、对话系统机器人等。智能穿戴设备、智能家电、智能出行或无人机设备依据的也是类似的原理。复杂的智能机器人如机械手臂和快递分拣机器人可以应用在更加开放的环境中。智能机器人在人力资源领域的常见应用就是客服对话机器人、访客接待机器人、培训机器人等。\n\
    \n#### 4. 语音识别\n\n##### (1) 语音识别的概念\n\n语音识别是一项让机器把语音信号转变为相应的文本或命令的高科技技术。通俗地说，就是机器把语音转化为文字，并对其进行识别、认知和处理。\n\
    \n##### (2) 语音识别的典型应用场景\n\n语音识别主要应用在工业、家电、汽车、医疗、家庭服务、消费类电子产品等各个领域。\n\n2010年之后，由于深度学习的广泛应用，语音识别的准确率得到了大幅提升，`Siri`、`Voice\
    \ Search`和`Echo`等可以实现不同语言间的交流；你对着手机说一段话，智能助手就可以帮助你完成一些任务。国内的语音识别产品包括`百度语音`、`科大讯飞`、`渡鸦`等。语音识别在人力资源管理领域的常见应用就是共享服务中心的客服小秘、招聘小秘、培训助手、虚拟个人助理等。\n\
    \n#### 5. 自然语言处理\n\n##### (1) 自然语言处理的概念\n\n自然语言处理（`Natural Language Processing`，`NLP`）将有助于实现目标的各种技术（如计算机科学、人工智能、语言学、人类或自然语言等）进行融合，实现了人机之间的自然语言通信。简单地讲，它就相当于机器语言和人类语言的翻译。在人工智能出现之前，机器能够自动处理少量的结构化数据。随着网络的普及，人类进入了信息时代，机器需要处理的数据越来越多，而网络中存在的大量文本、图片、视频往往都属于非结构化数据，其中文本的数量又是最多的，且绝大部分属于自然语言。由于计算机无法直接处理基于自然语言的文本数据，为了能够分析和利用这些文本信息，就需要用到`NLP`技术。\n\
    \n##### (2) 自然语言处理的典型应用场景\n\n自然语言处理的应用领域比较广泛，如信息提取、智能问答、机器翻译、文本挖掘、舆论分析、情感分析、语音识别和生成、信息过滤、信息检索、知识图谱等。自然语言处理在人力资源管理领域中的常见应用就是客服对话机器人、舆情分析、组织`CT`（业绩诊断系统）、人才`CT`等。\n\
    \n#### 6. 用户画像\n\n##### (1) 用户画像的概念\n\n用户画像又称用户角色，是勾画目标用户、联系用户诉求与设计方向的有效工具。在实际操作过程中，用户画像往往会以最为浅显的语言将用户的属性、行为与期待连接起来。作为实际用户的虚拟代表，用户画像并不是脱离产品和市场构建出来的。用户画像需要有代表性，能代表产品的主要受众。\n\
    \n##### (2) 用户画像的典型应用场景\n\n用户画像最早应用于电商领域，其核心工作就是为用户打标签。标签通常是人为规定的高度精练的特征标识，如年龄、性别、地域、兴趣等。利用这些标签将用户形象具体化，从而精准发现潜在用户，并为用户提供有针对性的服务。\n\
    \n用户画像在人力资源管理领域的应用就是人才画像。基于大数据分析这项技术，企业可以将用户画像的结果用于描述用户的特征，分析用户的喜好。同时，用户画像的结果还可以用于企业对关键人才的选、用、育、留等环节，如进行精准培训、分析外部市场的薪酬水平、优化人才招募或配置等。\n\
    \n### 二、人工智能面临的挑战\n\n当前，人工智能的研发成果仍然属于弱人工智能而非强人工智能。所谓强人工智能，就是通用人工智能（`Artificial\
    \ General Intelligence`，`AGI`），其具备类似人类的学习、认知和推理等方面的能力，拥有自我意识和思想，能够独立决策。弱人工智能（`Artificial\
    \ Narrow Intelligence`，`ANI`）则只能完成特定的、有限的任务，如完成图像识别、语音识别和机器翻译等任务。弱人工智能并不具备真正意义上的思考能力，本质上还是人类的操作工具。\n\
    \n人工智能面临着如下诸多挑战。\n\n1. 未来，人工智能需要更加注重图像识别的效果与体验。\n2. 在会场等嘈杂的环境中，噪声对语音识别的质量仍有影响。因此，长尾识别技术有待优化。\n\
    3. 智能机器人对语意的理解能力仍欠缺，无法识别和认知不规范的口语；机器人的知识库也需要持续更新和丰富。\n4. 用户画像如何打通人力资源数据与业务运营数据之间的关联仍是难题，管理风险预警、组织效能、组织仿真等越来越值得探索。\n\
    5. 基于机器学习的预测算法，训练数据的数量不够多、质量也不够高，训练样本不具备代表性、无关特征较多，训练数据过拟合/欠拟合等都是影响因素。\n6. 决策系统面临两个挑战。第一个是不通用，即学习知识的不可迁移性，如用一个方法学习下象棋，就不能直接将其迁移到下围棋上；第二个是需要利用大量数据进行有效的模拟和训练。因此，人力资源领域的决策系统智能化水平有限，现阶段仍然需要依靠人的智慧。\n\
    \n## 第二节　人工智能重塑人力资源\n\n人工智能对人力资源管理的各个模块产生了一定的影响，一方面，标准化、程序化、重复性高的工作将逐步被“机器人”全部或部分代劳；另一方面，人工智能与传统的人力资源管理模式相互碰撞，为人力资源从业者带来了正向的激励，在改善用户体验及趋势预测、辅助决策等方面大大提升了从业者的业务水平。人工智能在人力资源领域的运用对人力资源从业者也提出了更高的要求，人力资源从业者不仅要使出浑身解数为企业引入数字化技术方面的人才，而且自己要跟上前沿技术的发展脚步，认真学习并尝试应用这一技术。\n\
    \n### 一、人力资源数字化的定义\n\n目前，大部分传统企业仍处在向数字化转型的阶段。数字化转型是指组织利用最新的数字化技术驱动商业模式创新和商业生态系统重构，目的是实现业务的转型、创新和增长。数字化技术包括我们常说的“`ABCD`”，其中`A`是指人工智能（`AI`）、`B`是指区块链（`Block\
    \ Chain`）、`C`是指云计算（`Cloud`）、`D`是指大数据（`Big Data`），还包括物联网（`The Internet of Things`，`IoT`）、增强现实技术（`Augmented\
    \ Reality`，`AR`）、虚拟现实技术（`Virtual Reality`，`VR`）、机器人流程自动化（`Robotic Process Automation`，`RPA`）、3D打印等，如图1-1所示。\n\
    \n![](Images/cutq_27_0114_l.jpg)\n\n图1-1　数字化技术的具体体现\n"
  trans: "\n# I. The Development Speed of Human Resource Management in China is Accelerating\n\
    \nOver the past 40-plus years of reform and opening up, China's human resource\
    \ management has undergone earth-shaking changes.\n\nIn the early stages of reform\
    \ and opening up, we were in the \"Personnel Administration Era\" of human resource\
    \ management, not yet pure human resource management. In 1983, Renmin University\
    \ of China and the then Ministry of Labor and Personnel established the School\
    \ of Labor and Personnel. In 1992, European and American enterprises, particularly\
    \ US-funded enterprises, brought many advanced management concepts to establish\
    \ branches or representative offices in China. At the same time, the older generation\
    \ of HR practitioners introduced HR concepts and theories to China and proposed\
    \ the concept of the \"Six Major Modules.\"\n\nIn 1993, China promulgated the\
    \ *Company Law of the People's Republic of China*. In 1995, China implemented\
    \ the *Labor Law of the People's Republic of China*. It was not until 1993 that\
    \ the School of Labor and Personnel at Renmin University of China established\
    \ a major in Human Resources.\n\nIn late 1997, Dave Ulrich, a master in the field\
    \ of human resource management, published a book in which he mapped four quadrants\
    \ for HR work to support the concept of Strategic Human Resources. Later researchers\
    \ derived the so-called \"Three Pillars Theory\" from Strategic Human Resources;\
    \ the Three Pillars are a reallocation of the Four Quadrants. Now, human resource\
    \ management has evolved from the \"Six Major Modules\" to the \"Three Pillars.\"\
    \ Simultaneously, some of China's well-known enterprises such as Huawei, Baidu,\
    \ Alibaba, Tencent, and Lenovo have also developed some excellent HR management\
    \ practices.\n\n## II. The Intelligent Era of Human Resource Management is Approaching\n\
    \nWith the rapid development and application of new technologies such as big data\
    \ and cloud computing, I believe the intelligent era of human resource management\
    \ is approaching.\n\nFirst, the continuous emergence of new technologies. Driven\
    \ by new technologies, we have entered the digital age.\n\nSecond, the generation\
    \ of massive data. The consequence of digitalization is the production of massive\
    \ amounts of data. Besides structured data, a lot of unstructured data has also\
    \ been transformed into structured data through technical means (such as data\
    \ interaction, storage, retrieval, cleaning, and processing).\n\nThird, the emergence\
    \ of the COVID-19 pandemic. Although the pandemic has brought tremendous impact\
    \ on people's lives and work, from another perspective, it has also accelerated\
    \ the pace of digital transformation to a certain extent.\n\nFourth, a large batch\
    \ of excellent digital enterprises have begun to grow and strengthen. China has\
    \ many outstanding enterprises like Baidu, Alibaba, and Tencent; they are leading\
    \ the progress of the times, making data practices more intelligent.\n\n## III.\
    \ Intelligent HR Management Can Solve the Core Issues CEOs Care About\n\nWhat\
    \ problems can intelligent HR management solve? I believe it can solve the following\
    \ problems that CEOs dream of solving:\n\n1.  Solve the fit issue: The best people,\
    \ the most fitting people—have they been exhaustively searched for?\n2.  Who to\
    \ cultivate, how to cultivate, who has the most potential, who can lead?\n3. \
    \ Who has a strong willingness to contribute, who will grow with the company,\
    \ who will leave, who will stay?\n4.  Who contributes the most, who has the highest\
    \ value?\n5.  Which organization has the strongest innovation capability, which\
    \ organization has more combat effectiveness?\n6.  Which organization develops\
    \ more steadily, which organization has higher operational risks?\n7.  Which organization\
    \ has a better corporate culture, which group can produce heroes?\n8.  Has the\
    \ corporate strategy been implemented, do employees identify with it?\n\nRegarding\
    \ the above problems, in the past, enterprise managers or HR managers could only\
    \ rely on observation or design questionnaires based on psychology to seek answers.\
    \ However, respondents' answers are often processed, and their authenticity is\
    \ inevitably affected to a certain extent.\n\nIntelligent-era HR management can\
    \ solve the aforementioned problems because data and algorithms will tell you\
    \ the answers.\n\n## IV. HR Management in the Intelligent Era Will Incorporate\
    \ Increasing Scientific Elements\n\nIn the intelligent era of HR management, artificial\
    \ intelligence allows HR management to integrate more scientific elements, judging\
    \ services based on data science.\n\nThe intelligent era organically combines\
    \ scientific management and humanistic management. In the future, university HR\
    \ management majors can completely be classified as sciences or \"New Liberal\
    \ Arts\"; the \"New\" refers to the addition of data and intelligent content.\n\
    \nI once discussed with a psychologist how to enable HR practitioners to earn\
    \ higher salaries and how to increase the value of the HR major. He said the field\
    \ of psychology once faced a similar predicament; everyone felt studying psychology\
    \ had no technical content, but now society has completely changed its perception.\
    \ I believe, starting now, major universities must add data elements and scientific\
    \ elements to the teaching of HR management majors. Persisting in this for 10\
    \ or 20 years will raise the threshold and value of the HR major, allow HR practitioners\
    \ to earn higher salaries, and make HR a highly respected profession—this is what\
    \ I have always advocated.\n\nIn the future, among the three elements of talent,\
    \ organization, and ideology, the HR data middle platform will play an increasingly\
    \ important role. The *COE* (Center of Expertise) will certainly be empowered\
    \ or upgraded by big data, and *HRBP* (Human Resource Business Partner) will become\
    \ increasingly powerful. The \"Data Middle Platform + HRBP\" model will become\
    \ the development trend of HR management. Only by doing a good job in data resource\
    \ management can HRBP have more powerful \"weapons\" and enhance the strategic\
    \ synergy of enterprise development. Therefore, HR practitioners need to enhance\
    \ their own intelligent.\n\nScholars have pointed out that in the future, robots\
    \ and AI products will intervene in the field of talent management. Then, compared\
    \ with robots, who is smarter? Who is more capable?\n\nI can responsibly tell\
    \ you:\n1.  In terms of work speed and accuracy, you are definitely no match for\
    \ robots.\n2.  In terms of work quality, robots can easily surpass you.\n3.  In\
    \ terms of emotion, aspiration, imagination, and other aspects, you have advantages\
    \ over robots.\n4.  Robots can discover problems you cannot discover.\n5.  Robots\
    \ can complete tasks you cannot complete.\n6.  You need to get help from robots\
    \ and work together with them.\n\nIn short, I hope you do not become the person\
    \ replaced by robots.\n\nIt is visible that in logical thinking, knowledge memory\
    \ and information retrieval, thinking speed, and other aspects, humans are inferior\
    \ to robots; but in imagination, empathy, willpower, and other aspects, humans\
    \ are superior to robots. Therefore, if humans can work alongside robots and collaborate\
    \ in the future, it will often produce better results.\n\nIntelligence is reflected\
    \ not only in the working ability of robots but also in a broader range. A \"\
    returnee\" friend of mine can use web crawler technology to help managers in any\
    \ region quickly draw a talent demand map there. Another friend working at a famous\
    \ internet company can create a \"Digital Twin Company,\" using this virtual company\
    \ to explore the optimization path of the company's talent structure. Now, some\
    \ organizations have begun to use big data to predict talent, plan talent, and\
    \ strengthen their own talent team building.\n\nToday's talent management workers\
    \ should understand that in the future, every link of talent management work—from\
    \ talent discovery to talent allocation, utilization, cultivation, evaluation,\
    \ incentive, and flow—will change. At that time, the compression of time and space\
    \ in talent discovery, the prominence of personalization in talent cultivation,\
    \ the timeliness and front-loading of talent assessment, and the changes and smoothness\
    \ in talent flow methods will all surprise us today.\n\nThe great river flows\
    \ ceaselessly; the future has arrived. Let us open our arms and welcome the arrival\
    \ of the new era of intelligent talent!\n\nWang Tongxun  \nFormer President of\
    \ the Chinese Academy of Personnel Science and Director of the Institute of Personnel\
    \ and Talent  \nAdjunct Professor at Shanghai Jiao Tong University  \nDoctoral\
    \ Supervisor at Capital University of Economics and Business  \nVice President\
    \ and Secretary-General of China Talent Research Society\n\n# Chapter 1: Application\
    \ Scenarios of Artificial Intelligence in Human Resources\n\nIn the summer of\
    \ 1956, scientists including McCarthy and Minsky met at Dartmouth College in the\
    \ US to discuss \"how to use machines to simulate human intelligence\" and proposed\
    \ the concept of \"Artificial Intelligence\" (*AI*) for the first time.\n\nArtificial\
    \ intelligence is a new science that researches, simulates, and extends human\
    \ intelligence. The purpose of scientists researching AI is to enable intelligent\
    \ machines to hear (e.g., speech recognition, machine translation), see (e.g.,\
    \ image recognition, text recognition), speak (e.g., speech synthesis, human-computer\
    \ dialogue), think (e.g., human-computer chess, theorem proving), learn (e.g.,\
    \ machine learning), and act (e.g., autonomous driving vehicles).\n\nSince the\
    \ concept of AI was proposed more than 60 years ago, it has gone through several\
    \ stages: from inception, reflection, to application, depression, and now vigorous\
    \ development. Someone once jokingly said that AI is like a train; you eagerly\
    \ await its arrival, it finally comes but whizzes past, leaving you behind. Although\
    \ this is a joke, it also reflects the speed of AI technology development.\n\n\
    Currently, AI technology has been widely applied in various fields of work and\
    \ life. In 2016, the application of AI technology in the field of human resources\
    \ promoted the development of HR and reshaped HR management.\n\n## Section 1:\
    \ Application Scenarios and Challenges of Artificial Intelligence\n\nArtificial\
    \ intelligence is a comprehensive frontier discipline integrating computer science,\
    \ statistics, brain neuroscience, and social sciences. The goal of scientists\
    \ researching and developing it is to enable machines to possess human-like intelligence\
    \ and capabilities, replacing humans in functions such as recognition, cognition,\
    \ classification, and decision-making. With the emergence and popularization of\
    \ smart home appliances, wearable devices, and intelligent robots, AI technology\
    \ has entered multiple fields of people's work, study, and life. So, in which\
    \ specific subdivided fields is AI technology currently applied?\n\n### 1. Application\
    \ Scenarios\n\nThe subdivided application fields of AI technology include deep\
    \ learning, computer vision, intelligent robots, speech recognition, natural language\
    \ processing, user profiling, etc.\n\n#### 1. Deep Learning\n\n##### (1) Concept\
    \ of Deep Learning\n\nDeep learning is an important application branch of machine\
    \ learning in the field of AI. It is an algorithm that uses artificial neural\
    \ networks as architecture for representation learning of data. To date, there\
    \ are several deep learning frameworks, such as Convolutional Neural Networks\
    \ (CNN), Recurrent Neural Networks (RNN), and Deep Belief Networks (DBN). They\
    \ have been applied in fields such as computer vision, speech recognition, natural\
    \ language processing, audio recognition, and bioinformatics, achieving excellent\
    \ results.\n\n##### (2) Typical Application Scenarios of Deep Learning\n\nWhen\
    \ it comes to deep learning, the first thing everyone thinks of is *AlphaGo*.\
    \ Through repeated learning and algorithm updates, it defeated Go master Lee Sedol\
    \ in the \"Human-Machine Battle.\" Baidu's robot \"Xiaodu\" has participated in\
    \ \"The Brain\" (Strongest Brain) \"Human-Machine Battles\" many times and won,\
    \ which is also an application of deep learning in daily life. Deep learning technology\
    \ also helps enterprises conduct talent development analysis and assist decision-making.\n\
    \n#### 2. Computer Vision\n\n##### (1) Concept of Computer Vision\n\nThe core\
    \ function of AI technology lies in its realization of environmental perception\
    \ and feedback output. Humans obtain information from the environment through\
    \ vision, hearing, smell, taste, and touch, with vision being the primary way.\
    \ Computer Vision refers to the use of cameras, computers, and other related equipment\
    \ to simulate biological vision, process collected images or videos to obtain\
    \ information about corresponding scenes, and further perform graphic processing\
    \ to identify objects and scenes from images. The main tasks of computer vision\
    \ in recognition include classification, localization, detection, segmentation,\
    \ and tracking.\n\n##### (2) Typical Application Scenarios of Computer Vision\n\
    \nComputer vision is mainly used for image recognition, including medical imaging\
    \ analysis used to improve disease prediction, diagnosis, and treatment; facial\
    \ recognition technology used to automatically identify people in photos (e.g.,\
    \ face payment); *ETC* license plate recognition on highways; autonomous driving\
    \ perception systems based on computer vision (e.g., driverless cars); and security\
    \ and surveillance fields. Common applications of computer vision in HR management\
    \ include facial recognition for onboarding, attendance, and training sign-in.\n\
    \n#### 3. Intelligent Robots\n\n##### (1) Concept of Intelligent Robots\n\nIntelligent\
    \ robots possess a fairly developed \"brain,\" where the central processor plays\
    \ the key role. Intelligent robots are equipped with various internal and external\
    \ sensors, capable of simulating vision, hearing, touch, and smell. In addition,\
    \ intelligent robots have effectors, whose main function is to observe the surrounding\
    \ environment. Intelligent robots possess at least three elements: sensory elements,\
    \ reflection elements, and thinking elements.\n\n##### (2) Typical Application\
    \ Scenarios of Intelligent Robots\n\nIntelligent robots are applied in many fields\
    \ and scenarios, such as sweeping robots, companion robots, customer service robots,\
    \ Q&A system robots, machine translation, dialogue system robots, etc. Smart wearable\
    \ devices, smart home appliances, smart travel, or drone devices operate on similar\
    \ principles. Complex intelligent robots such as robotic arms and express sorting\
    \ robots can be applied in more open environments. Common applications of intelligent\
    \ robots in the HR field are customer service dialogue robots, visitor reception\
    \ robots, and training robots.\n\n#### 4. Speech Recognition\n\n##### (1) Concept\
    \ of Speech Recognition\n\nSpeech recognition is a high-tech technology that enables\
    \ machines to convert speech signals into corresponding text or commands. Simply\
    \ put, it is the machine converting speech into text and recognizing, cognizing,\
    \ and processing it.\n\n##### (2) Typical Application Scenarios of Speech Recognition\n\
    \nSpeech recognition is mainly applied in various fields such as industry, home\
    \ appliances, automobiles, medical care, home services, and consumer electronics.\n\
    \nAfter 2010, due to the widespread application of deep learning, the accuracy\
    \ of speech recognition has been greatly improved. *Siri*, *Voice Search*, and\
    \ *Echo* can realize communication between different languages; you speak a paragraph\
    \ to your phone, and the intelligent assistant can help you complete some tasks.\
    \ Domestic speech recognition products include *Baidu Speech*, *iFlytek*, *Raven*,\
    \ etc. Common applications of speech recognition in HR management are customer\
    \ service assistants in shared service centers, recruitment assistants, training\
    \ assistants, and virtual personal assistants.\n\n#### 5. Natural Language Processing\n\
    \n##### (1) Concept of Natural Language Processing\n\nNatural Language Processing\
    \ (*NLP*) integrates various technologies (such as computer science, AI, linguistics,\
    \ human or natural languages) that help achieve the goal, realizing natural language\
    \ communication between humans and machines. Simply put, it is equivalent to translation\
    \ between machine language and human language. Before the advent of AI, machines\
    \ could automatically process a small amount of structured data. With the popularization\
    \ of the network, humans entered the information age, and the data machines needed\
    \ to process increased. A large amount of text, images, and videos on the network\
    \ often belong to unstructured data, among which the largest quantity is text,\
    \ and the vast majority belongs to natural language. Since computers cannot directly\
    \ process text data based on natural language, *NLP* technology is needed to analyze\
    \ and utilize this text information.\n\n##### (2) Typical Application Scenarios\
    \ of Natural Language Processing\n\nThe application fields of NLP are relatively\
    \ wide, such as information extraction, intelligent Q&A, machine translation,\
    \ text mining, public opinion analysis, sentiment analysis, speech recognition\
    \ and generation, information filtering, information retrieval, knowledge graphs,\
    \ etc. Common applications of NLP in HR management are customer service dialogue\
    \ robots, public opinion analysis, Organizational *CT* (Performance Diagnosis\
    \ System), and Talent *CT*.\n\n#### 6. User Profiling\n\n##### (1) Concept of\
    \ User Profiling\n\nUser profiling, also known as user persona, is an effective\
    \ tool for outlining target users, connecting user needs with design direction.\
    \ In actual operation, user profiling often connects user attributes, behaviors,\
    \ and expectations in the most straightforward language. As a virtual representative\
    \ of actual users, user profiling is not constructed detached from products and\
    \ markets. User profiling needs to be representative, representing the main audience\
    \ of the product.\n\n##### (2) Typical Application Scenarios of User Profiling\n\
    \nUser profiling was first applied in the e-commerce field. Its core work is to\
    \ tag users. Tags are usually highly refined feature identifiers defined by humans,\
    \ such as age, gender, region, interests, etc. Using these tags to concretize\
    \ user images, thereby accurately discovering potential users and providing targeted\
    \ services for users.\n\nThe application of user profiling in HR management is\
    \ talent profiling. Based on big data analysis technology, enterprises can use\
    \ user profiling results to describe user characteristics and analyze user preferences.\
    \ At the same time, user profiling results can also be used in the selection,\
    \ utilization, cultivation, and retention of key talents, such as precision training,\
    \ analysis of external market salary levels, optimization of talent recruitment\
    \ or allocation, etc.\n\n### 2. Challenges Faced by Artificial Intelligence\n\n\
    Currently, AI R&D results still belong to Weak AI rather than Strong AI. So-called\
    \ Strong AI refers to Artificial General Intelligence (*AGI*), which possesses\
    \ human-like learning, cognition, and reasoning capabilities, has self-awareness\
    \ and thought, and can make independent decisions. Weak AI (*ANI*) can only complete\
    \ specific, limited tasks, such as image recognition, speech recognition, and\
    \ machine translation. Weak AI does not possess true thinking capabilities; essentially,\
    \ it is still a human-operated tool.\n\nAI faces the following numerous challenges.\n\
    \n1.  In the future, AI needs to pay more attention to the effect and experience\
    \ of image recognition.\n2.  In noisy environments such as conference venues,\
    \ noise still affects the quality of speech recognition. Therefore, long-tail\
    \ recognition technology needs optimization.\n3.  Intelligent robots' semantic\
    \ understanding ability is still insufficient, unable to recognize and cognize\
    \ irregular colloquialisms; robots' knowledge bases also need continuous updating\
    \ and enrichment.\n4.  How user profiling connects the correlation between HR\
    \ data and business operation data remains a difficult problem; management risk\
    \ warning, organizational effectiveness, organizational simulation, etc., are\
    \ increasingly worth exploring.\n5.  Prediction algorithms based on machine learning\
    \ face influencing factors such as insufficient quantity and quality of training\
    \ data, unrepresentative training samples, too many irrelevant features, overfitting/underfitting\
    \ of training data, etc.\n6.  Decision systems face two challenges. The first\
    \ is non-generalizability, i.e., the non-transferability of learned knowledge,\
    \ such as using a method to learn chess but not being able to directly transfer\
    \ it to Go; the second is the need to use large amounts of data for effective\
    \ simulation and training. Therefore, the intelligence level of decision systems\
    \ in the HR field is limited, and they still need to rely on human wisdom at this\
    \ stage.\n\n## Section 2: Artificial Intelligence Reshapes Human Resources\n\n\
    AI has had a certain impact on various modules of HR management. On the one hand,\
    \ standardized, procedural, and highly repetitive work will gradually be fully\
    \ or partially handled by \"robots\"; on the other hand, the collision between\
    \ AI and traditional HR management models has brought positive incentives to HR\
    \ practitioners, greatly improving their business level in improving user experience,\
    \ trend prediction, and decision support. The application of AI in the HR field\
    \ also puts forward higher requirements for HR practitioners. HR practitioners\
    \ must not only use all their skills to introduce talents in digital technology\
    \ for the enterprise but also keep up with the development of cutting-edge technologies,\
    \ study seriously, and try to apply this technology.\n\n### 1. Definition of HR\
    \ Digitalization\n\nCurrently, most traditional enterprises are still in the stage\
    \ of transforming to digitalization. Digital transformation refers to organizations\
    \ using the latest digital technologies to drive business model innovation and\
    \ business ecosystem reconstruction, aiming to achieve business transformation,\
    \ innovation, and growth. Digital technologies include the commonly mentioned\
    \ \"*ABCD*,\" where *A* stands for Artificial Intelligence (*AI*), *B* for Blockchain\
    \ (*Block Chain*), *C* for Cloud Computing (*Cloud*), *D* for Big Data (*Big Data*),\
    \ as well as the Internet of Things (*IoT*), Augmented Reality (*AR*), Virtual\
    \ Reality (*VR*), Robotic Process Automation (*RPA*), 3D Printing, etc., as shown\
    \ in Figure 1-1.\n\n![](img/cutq_27_0114_l.jpg)\n\nFigure 1-1 Specific Manifestations\
    \ of Digital Technologies\n\n"
