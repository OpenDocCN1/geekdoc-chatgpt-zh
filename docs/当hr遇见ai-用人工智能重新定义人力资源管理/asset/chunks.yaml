- raw: '百度人才智库是一套智能化的人才管理系统，基于海量数据，通过精准的机器学习和算法提供完整的智能化人才管理解决方案，主要作用于人才、组织和文化三大方面，包含“智·风控”“智·留辞”“智·文化”“智·选才”“智·组织”和“智·人物”六个功能模块，如图7-12所示。


    在人才方面，百度人才智库能够极大地提升招聘工作效率，科学识别优秀管理者与人才潜力，预判员工离职倾向和离职后影响，并为有针对性的人才获取、培养与保留提供智能支持。在组织方面，百度人才智库能通过分析部门活力和人才结构，科学评估组织稳定性，揭示组织间人才流动规律，为组织优化调整、高效人才激励与促进人才流动提供智能化支持。在文化方面，百度人才智库能及时呈现组织内外部的舆情热点，智能分析外部人才市场状况，为管理者提升公司口碑，提振员工士气，为公司预先进行人才储备提供智能支持。百度人才智库真正实现了数据驱动，辅助高管层决策判断，让百度在人才流动迅速且争夺激烈的高科技行业中保持了强劲的行业竞争力。


    ![](Images/cutq_204_47161_l.jpg)


    图7-12　百度人才智库产品功能


    □ 赋能管理者


    在数字化时代，员工越来越不容易“被管理”，他们更趋向于个性化和自我发展，团队管理者也面临着极大的挑战。在实际工作中，借助于智能化工作台的管理效率将会提升30%~50%。以中国民生银行的新一代人力资源数字化平台“人力盒子”为例，民生银行运用这一“魔盒”的团队视图、人力资本分析、人力运营、服务窗口等功能，完成了为经营管理层、团队管理者、HR条线管理者以及普通员工的全面赋能，实现了组织价值、人才价值、人才供应链和人力基础管理的提升，如图7-13所示。


    随着数字化技术的不断突破，银行业进入了竞争时代，各家银行的人力资源管理工作需要快速应对人才颠覆、业务颠覆、体验颠覆等诸多挑战。在这样的形势下，民生银行人力资源部以客户为中心，利用数字化技术手段参与总部变革转型的前瞻性布局，帮助高管层洞察环境、洞察对手、洞察自己、洞察人才、洞察未来。


    ![](Images/image_205_0_l.jpg)


    图7-13　“人力盒子”产品功能


    民生银行人力资源部应用人力资本分析模型，以“用户中心、价值牵引、模型支撑”为原则构建人力资本分析平台，面向经营管理层、人力资源条线、各级管理者搭载管理驾驶舱，延展形成了“总行部门眼”“分行部门眼”“支行眼”等多维应用场景，提供“基本面”“人力资本DNA”“部门画像”“人才画像”等人力资本分析看板、自动化报表、团队及员工分析报告等，成为分析人力资本信息、探寻人力资本问题的量化管理线上入口，实现了“数据可视、管理可见、人才可搜”的智能化人力资本管理。民生银行人力资源部还探索“敏捷组织”的管理模式，实施跨部门、跨条线的无间隔项目制协同，搭建“三位一体”的员工工作记录体系，并配套管理制度、规则和政策，确保这些制度随着需求的变化而同步升级，进一步改进绩效文化，激发企业活力和推动文化变革，真正赋能管理者。


    □ 赋能业务


    数智化是业务发展的加速器。数智化、数字化与智能化的集成也可以理解为“数字化+智能化”，是在数字化基础上的更高阶段。数智化阶段的底层逻辑如下：产生链接：人、财、物、事的互联，如人机互联、人人互联、机机互联、人事互联、事事互联、机事互联、人财互联、人物互联、财物互联、物事互联、财事互联、知识互联等；沉淀数据：通过上述人、财、物、事的互联互通，使原始数据自然留痕、客观有效，包含了一切结构化数据与非结构化数据，为后续数据清洗、加工、存储、数据分析打下了良好的基础；数据智能：机器学习与大数据技术让数据分析更加逼真、清晰与智能，模型、算法与算力是其中最关键的三要素。


    我国互联网企业的数智化发展水平相对较高、范围比较全面、技术相对成熟，因此业务发展得也较快。但从整体上看，传统行业的数智化水平仍处于初级阶段，尽管过去多年来各家企业都在关注数字化转型，但转型紧迫感、举措执行力并不强，转型路径也不清晰，更缺少数字化的人才。


    调研发现，在企业管理的十多个模块上，不同的企业在数智化应用上都进行了有效探索。例如，约有21%的企业在战略管理领域开始了数智化应用；约有34.5%的企业在人力资源领域开始了数智化应用；约有27.7%的企业在财务管理领域开始了数智化应用；行政管理、供应链管理、质量管理、产品研发等领域的数智化应用的具体占比如图7-14所示。


    虽然各行各业中有约20%的企业分别在企业管理的不同模块上开始探索数智化应用，但整体规模尚处于初级阶段，未来还有较长的路要走。这与人工智能及大数据技术在企业的应用实践尚处于探索阶段或微应用阶段也有关系，与认知水平、人才短缺等其他因素都有关联。其中，涉及“人力资源”管理模块的调研发现，人力资源管理进入数智化阶段、处于信息化阶段、尚未进入信息化阶段的企业分别占比约三分之一，详细描述如下：


    ●约34.5%的企业在人力资源管理在不同程度上进入数智化阶段，远高于其他管理模块；


    ![](Images/cutq_207_54161_l.jpg)


    如图7-14人力资源各职能模块数智化所处阶段


    ●约33.1%的企业在人力资源管理数智化程度上非常落后，分别处于线下作业或线上化阶段，多数为传统企业，深层原因有待进一步挖掘；


    ●约32.4%的企业处于人力资源管理信息化阶段，他们是数字化转型的有生力量。


    这些数据说明在人力资源管理数智化方向上，一是企业在认知层面尚需学习与提升，在实践层面还有更长的路要走；二是更多的人已开始认识到数字化转型的重要性与迫切性，并已开始行动；三是人力资源可以先进行数字化转型，做好组织保障、人才储备和文化氛围打造工作，赋能业务转型与快速发展。


    ### [四、二支柱](../Text/contents.xhtml#c_90)


    在人工智能和大数据时代，企业发展与组织形态千差万别，人力资源管理者就需要随着组织发展的变化而不断迭代。为了适应业务的变化与要求，有些企业已逐步将三支柱过渡到了二支柱，即前端仍然是HRBP，响应与处理员工的各种诉求，后端HRCOE与HRSSC紧密协作，共同为HRBP提供解决方案。二支柱也称“板凳模型”，如图7-15所示。


    ![](Images/cutq_208_0130_m.jpg)


    图7-15　二支柱模型示意图


    二支柱适合业务发展快速、创新型的组织，这就要求企业的人力资源数字化建设要达到一定的程度，一个平台、一个手机就能应对各种问题、处理所有事务。


    ### [五、四支柱](../Text/contents.xhtml#c_91)


    四支柱是指在三支柱的基础上多了一个支柱，即项目管理办公室或项目管理部（Project Management-4Office，PMO）或人力分析（People
    Analytics，PA）。四支柱模型示意图如图7-16所示。


    ![](Images/cutq_209_6526_m.jpg)


    图7-16　四支柱模型示意图


    流程驱动的企业包含的项目多，如人才标准、人才选拔、人才盘点、组织扫描等，在推进项目的过程中会产生各种难题，这时就需要PMO负责协调整合、推进项目的有效执行与落地。PMO是提高组织管理成熟度的核心部门。


    数据驱动的企业会专设PA这一部门，它被视为“HR的未来工作”。未来，人力分析不仅是人力资源工作的一部分，而且将成为整个企业开展组织分析的关键部分。企业设立PA部门的典型代表就是谷歌公司的“氧气项目”和百度公司的“人才智库”。


    无论是三支柱，还是二支柱、四支柱，它们都是为了实现人力资源战略及业务转型与发展，尤其是二支柱，它是AI、大数据技术驱动下的必然结果。


    ## [第二节　人工智能如何驱动共享服务中心](../Text/contents.xhtml#b_92)


    人工智能在人力资源共享服务中心（HRSSC）中的应用已经很普遍了，因为百度公司的实践比较早，所以下面以百度公司为例，讲一讲人工智能在HRSSC中的各类新技术与新实践。


    ### [一、业务背景](../Text/contents.xhtml#c_93)


    百度在2010年前后运行了SDC、HRCOE、HRBP“三驾马车”，其中共享交付平台（Service Delivery Center，SDC）的发展经历了从1.0到3.0的阶段。百度将3.0阶段称为“Smart
    HR”阶段，该阶段旨在通过更具交互性的系统，利用大数据预测、控制和分析功能管理组织变革和人才发展，其重点关注的是效率和管控。百度从2014年起便在这一阶段“发力”。到了2017年，百度已着手从“Smart
    HR”阶段转向“Intelligent HR”阶段，也就是迈向了3.5甚至4.0阶段。在这个转型期，为了追求更佳的员工体验、组织活力和文化赋能，百度摈弃了传统的流程，而是选择了数字化转型的流程，如图7-17所示。


    ![](Images/cutq_210_14314_l.jpg)


    图7-17　百度人力资源管理工作中应用人工智能的领域


    ### [二、新技术的应用](../Text/contents.xhtml#c_94)


    1.招聘领域——智能简历职位匹配


    业务驱动与技术导向改变了招聘的工作方式，百度的人力资源管理者非常注重人工智能在招聘领域的应用及其带来的效率提升。通过对人才简历库的自然语言处理（NLP）及机器学习进行算法与模型搭建，解决了简历与职位说明书智能化匹配的难题。如下两款工具将帮助人力资源部的招聘专员提升运营效率。


    （1）众里寻他。这是百度为招聘团队打造的简历智能筛选系统。该系统通过识别招聘团队发出的职位说明书，精准匹配人才库中符合要求的简历。这里说的“精准匹配”并不是字面上的匹配，而是结合了潜在候选人的相关背景、工作经历、项目经历等方面进行综合考量，进行大数据算法分析与“匹配”。优化筛选简历的过程可以让招聘团队更加专注地考量候选人，将更多的精力放在面试环节中。


    （2）沧海拾遗。这是百度为候选人打造的职位匹配系统，可以帮助他们提高应聘效率。该系统会在候选人搜索职位时，根据他们的简历，主动向其推荐适合的工作，减少候选人浏览职位说明书的时间，防止他们错过适合自己的职位。


    2.入职流程——各项技术相结合实现自动化


    （1）OCR技术


    OCR技术是指通过扫描等光学输入方式将各种证件、票据、报刊、书籍、文稿等印刷品的文字转化为图像信息，再利用文字识别技术将图像信息转化为可以输入计算机的信息的技术。近两年，这一技术被逐渐应用到了人力资源领域，企业可以将其与入职办理流程中新员工身份相关信息的验证相结合。在新员工入职前，企业可以要求新员工将学历证书、资格证书、身份证件、银行卡等复印件上传至系统中，利用OCR技术对信息进行识别，同时对接第三方征信平台如学信网，员工的学历信息验证工作即可快速完成。


    （2）刷脸技术


    百度的刷脸技术比较成熟，公司内部应用场景比较多的是门禁刷脸、会议签到、内部购物等。当然，刷脸技术还会应用到其他场景中，如自助打印证明，员工刷工卡或刷脸都可以完成。再如，在新员工办理入职手续的过程中，刷脸技术与访客系统既可用于新员工提前预约报到，也可以提升新员工的入职体验与办理效率。


    （3）预约系统——端到端的自动化


    预约报到的新员工会得到相应的后台预约码，百度在向其发送预约码的同时，还可以向其推送入职指南、公司新闻动态。员工到达公司后出示预约码便可以根据入职指南，直接到达办理相关手续的地点。另外，由于新员工入职工作往往是集中进行的，为了便于管理，新员工的预约码已经与办理入职手续的会场的座位号相匹配，同时座位上会放置“入职大礼包”，包括新员工的电脑、办公用品、需要签署的文件等，方便新员工查找。


    这一系列的工作打通了候选人与反馈系统、入职系统的连接，实现了端到端的自动化，新员工对公司的好感度也得到了极大的提升。


    3.在线学习系统——AI赋能


    （1）百度学堂的新产品——灵听


    培训专员的痛点之一就是要为一些重复性的简单工作付出大量的时间和精力，如给视频课程加字幕。培训视频加字幕的目的是使学员在学习的过程中更准确、快速地理解课程内容。但是，加字幕这件事的背后却需要培训专员付出很多的时间和精力。培训专员首先要记录讲师讲述的文字，然后纠错复查，再按照视频制作要求分行，最后才能请视频制作者合成字幕与视频。整个过程需要数个工种配合，花费数个工作日的时间。为了解决这个问题，百度利用AI技术制作了灵听平台，培训专员将任意一段视频上传到灵听平台后，系统就能够根据语音自动识别出字幕，并直接添加到视频上，培训专员仅需对个别识别不准之处稍加修改，即可获得一段添加好字幕的视频。一个人仅花费几分钟即可完成以前由数人花费数天才能完成的工作。


    （2）百度听清


    演讲者说话的同时，百度利用语音识别与翻译技术就可以实时打出中英文字幕，这个名为“百度听清”的技术已经应用到了百度内部的直播平台上。


    ### [三、大数据的应用与思考](../Text/contents.xhtml#c_95)


    1.大数据的“底线”。涉及个人隐私的内容，如邮件内容、私人交流内容等绝不可以用于个性分析。


    2.大数据的基础。首先，人力资源部各个模块的数据应该是“互通的”，而不是各自为战。整合人力资源数据是进行大数据分析的第一步。其次，要与其他部门如财务部、销售部的数据做好“联通”。


    3.数据安全问题的处理。数据安全是每家企业都必须面对和处理的问题，其关键在于分工。负责画体系界面、打通数据等工作的人员应当共同商讨做出界定，确定访问级别及其权限。


    4.新技术的本质依然是大数据。刷脸、语音识别等新技术仅仅是一种手段、工具或平台，在起步阶段，其背后依然是大数据在驱动。因此，这些技术的进步归根结底还是有赖于大数据的沉淀、整理和迭代。


    ## [第三节　人工智能如何赋能HRCOE](../Text/contents.xhtml#b_96)


    本节我们同样通过对“百度人才智库（TIC）”案例的介绍，看一看人工智能是如何赋能HRCOE的。


    百度以更加量化、客观的手段，从人才、组织和文化三个方面践行“让优秀人才脱颖而出”的人才管理理念。百度人才智库包含“智·管理”“智·选才”和“智·人物”等六个功能模块，具体如图7-18所示。


    ●人才方面。TIC能够极大地提升招聘工作效率，高效识别优秀管理者与高潜人才，预判员工离职倾向和离职后的影响，并为人才获取、培养与保留提供智能支持。


    ●组织方面。TIC能通过分析部门活力、人才结构，科学评估组织的稳定性，揭示组织间人才流动的规律，为组织优化调整、高效激励人才与促进人才流动提供智能支持。


    ●文化方面。TIC能及时呈现组织内外部的舆情热点，分析外部人才市场状况，提升企业口碑，提振员工士气，为企业进行人才储备提供智能支持。


    ![](Images/cutq_215_24109_l.jpg)


    图7-18　百度人才智库对应用场景的支持


    ### [一、组织人才管理风险指数](../Text/contents.xhtml#c_97)


    在面对新的形势和新的业务挑战时，企业怎样才能从大批管理者中提拔出能够胜任高风险岗位的管理者呢？TIC提出了人才管理风险指数这一概念。通过该指数，企业可以及时识别管理者在各个时期面临的管理复杂性和困难程度，并比较不同管理者在职业生涯中面临的风险变化。例如，某些管理者只胜任特定的领域，一旦转换到其他领域，其职业发展曲线就会呈现大幅波动。有能力的管理者则可以在相对较短的时间内让动荡的曲线趋于平缓。人才管理风险指数为企业提拔、任命领导者提供了有说服力的客观依据。


    ### [二、人员、人才和人物](../Text/contents.xhtml#c_98)


    过去，企业注重的是“人员”，如早期的福特公司等制造业企业，强调人员的组织纪律性；现在，高科技企业注重的是“人才”，强调人才的一技之长和团队组织协作能力；未来，企业注重的将是“人物”，需要人物具备卓越的领导力及创新力。


    如何挖掘和寻找“人物”是人力资源部面临的重大挑战。TIC从公司员工的核心地位、业务桥梁、开放交流、组织框架和广泛合作五个维度打造量化模型，以业务往来邮件、在公司平台上编写程序等客观真实的数据和文本为依据，对员工进行打分。


    这就给每位员工建立了成长的“电子档案”，通过计算员工的业务核心度指数，判断其成为“人物”的可能性，并且能够发现员工在这五个维度的优劣势，进而给予其适当的任命或有针对性的培训。需要指出的是，TIC深知隐私保护对大数据分析的重要性，任何由TIC使用的数据都会受到严格审批、加密与管理，以确保不被用于其他用途。


    ### [三、人才动向预测](../Text/contents.xhtml#c_99)


    通过收集企业内外部的数据，包括来自社交媒体和互联网的舆论信息与文本，TIC建立了包含经济、职业发展和个人家庭原因等数百个动态特征的90天离职预测模型，预测准确度达到了90%以上。例如，在2015年百度进行的一项离职预测中，TIC分析出了离职指数最高的前30名员工，3个月内其中29人向人力资源部提出了离职申请。TIC还能计算出员工的离职影响力有多大，并分析出员工离职的各项原因。如果离职指数高的员工属于稀缺性人才，且离职原因在公司的可控范围内，百度就能够及时进行干预，采取适当的挽留手段。


    # [第八章　建设智慧HR平台，助力业务转型](../Text/contents.xhtml#z_13)


    在VUCA时代，组织对人力资源管理工作提出了很高的要求，同时对人力资源系统平台也提出了明确的诉求，主要体现在如下几个方面。


    ●打通系统与数据孤岛。打通“入离升降调、选用预留管”环节，实现流程的端到端连通、系统上下游贯通、数据高效流通。


    ●建立与用好人才库。建立全球人才库，形成人才地图，实现人才的全生命周期管理。


    ●统一人力资源系统平台。搭建统一的平台，划归统一的入口，设定不同的权限，为员工、管理者、HRBP提供丰富、好用的工具，实现自助服务，提升工作效率与用户体验。


    ●数据驱动。建成可供HRBP、管理者使用的仪表盘、看板、人才大屏等，通过人才画像、组织扫描实现流程的智能化、决策的智能化和数据预警。


    ●员工体验。实现入职、在职、离职三位一体的闭环管理，提供全场景服务，提升员工敬业度。


    ## [第一节　四化模型与人力资源数智化的迭代路径](../Text/contents.xhtml#b_100)


    在过去的几十年中，人力资源管理工作可以划分为四个阶段，如图8-1所示。在此过程中，人力资源信息化也随着技术的不断迭代在向前发展着，同样经历了四个阶段，如图8-2所示。


    ![](Images/cutq_219_38746_l.jpg)


    图8-1　人力资源管理的四个发展阶段


    读者可以参考四化模型，对照各自企业人力资源管理工作发展的不同阶段，思考数字化蓝图，寻找数字化快速迭代路径，不断探索与突破，助力业务发展与转型。


    ![](Images/image_220_0_l.jpg)


    图8-2　人力资源信息化的“四化模型”


    ### [一、1.0阶段：线上化](../Text/contents.xhtml#c_101)'
  fmt: '

    百度人才智库是一套智能化的人才管理系统，基于海量数据，通过精准的机器学习和算法提供完整的智能化人才管理解决方案，主要作用于人才、组织和文化三大方面，包含“智·风控”“智·留辞”“智·文化”“智·选才”“智·组织”和“智·人物”六个功能模块，如图7-12所示。


    在人才方面，百度人才智库能够极大地提升招聘工作效率，科学识别优秀管理者与人才潜力，预判员工离职倾向和离职后影响，并为有针对性的人才获取、培养与保留提供智能支持。在组织方面，百度人才智库能通过分析部门活力和人才结构，科学评估组织稳定性，揭示组织间人才流动规律，为组织优化调整、高效人才激励与促进人才流动提供智能化支持。在文化方面，百度人才智库能及时呈现组织内外部的舆情热点，智能分析外部人才市场状况，为管理者提升公司口碑，提振员工士气，为公司预先进行人才储备提供智能支持。百度人才智库真正实现了数据驱动，辅助高管层决策判断，让百度在人才流动迅速且争夺激烈的高科技行业中保持了强劲的行业竞争力。


    ![](Images/cutq_204_47161_l.jpg)


    图7-12　百度人才智库产品功能


    ### 赋能管理者


    在数字化时代，员工越来越不容易“被管理”，他们更趋向于个性化和自我发展，团队管理者也面临着极大的挑战。在实际工作中，借助于智能化工作台的管理效率将会提升30%~50%。以中国民生银行的新一代人力资源数字化平台“人力盒子”为例，民生银行运用这一“魔盒”的团队视图、人力资本分析、人力运营、服务窗口等功能，完成了为经营管理层、团队管理者、`HR`条线管理者以及普通员工的全面赋能，实现了组织价值、人才价值、人才供应链和人力基础管理的提升，如图7-13所示。


    随着数字化技术的不断突破，银行业进入了竞争时代，各家银行的人力资源管理工作需要快速应对人才颠覆、业务颠覆、体验颠覆等诸多挑战。在这样的形势下，民生银行人力资源部以客户为中心，利用数字化技术手段参与总部变革转型的前瞻性布局，帮助高管层洞察环境、洞察对手、洞察自己、洞察人才、洞察未来。


    ![](Images/image_205_0_l.jpg)


    图7-13　“人力盒子”产品功能


    民生银行人力资源部应用人力资本分析模型，以“用户中心、价值牵引、模型支撑”为原则构建人力资本分析平台，面向经营管理层、人力资源条线、各级管理者搭载管理驾驶舱，延展形成了“总行部门眼”“分行部门眼”“支行眼”等多维应用场景，提供“基本面”“人力资本DNA”“部门画像”“人才画像”等人力资本分析看板、自动化报表、团队及员工分析报告等，成为分析人力资本信息、探寻人力资本问题的量化管理线上入口，实现了“数据可视、管理可见、人才可搜”的智能化人力资本管理。民生银行人力资源部还探索“敏捷组织”的管理模式，实施跨部门、跨条线的无间隔项目制协同，搭建“三位一体”的员工工作记录体系，并配套管理制度、规则和政策，确保这些制度随着需求的变化而同步升级，进一步改进绩效文化，激发企业活力和推动文化变革，真正赋能管理者。


    ### 赋能业务


    数智化是业务发展的加速器。数智化、数字化与智能化的集成也可以理解为“数字化+智能化”，是在数字化基础上的更高阶段。数智化阶段的底层逻辑如下：产生链接：人、财、物、事的互联，如人机互联、人人互联、机机互联、人事互联、事事互联、机事互联、人财互联、人物互联、财物互联、物事互联、财事互联、知识互联等；沉淀数据：通过上述人、财、物、事的互联互通，使原始数据自然留痕、客观有效，包含了一切结构化数据与非结构化数据，为后续数据清洗、加工、存储、数据分析打下了良好的基础；数据智能：机器学习与大数据技术让数据分析更加逼真、清晰与智能，模型、算法与算力是其中最关键的三要素。


    我国互联网企业的数智化发展水平相对较高、范围比较全面、技术相对成熟，因此业务发展得也较快。但从整体上看，传统行业的数智化水平仍处于初级阶段，尽管过去多年来各家企业都在关注数字化转型，但转型紧迫感、举措执行力并不强，转型路径也不清晰，更缺少数字化的人才。


    调研发现，在企业管理的十多个模块上，不同的企业在数智化应用上都进行了有效探索。例如，约有21%的企业在战略管理领域开始了数智化应用；约有34.5%的企业在人力资源领域开始了数智化应用；约有27.7%的企业在财务管理领域开始了数智化应用；行政管理、供应链管理、质量管理、产品研发等领域的数智化应用的具体占比如图7-14所示。


    虽然各行各业中有约20%的企业分别在企业管理的不同模块上开始探索数智化应用，但整体规模尚处于初级阶段，未来还有较长的路要走。这与人工智能及大数据技术在企业的应用实践尚处于探索阶段或微应用阶段也有关系，与认知水平、人才短缺等其他因素都有关联。其中，涉及“人力资源”管理模块的调研发现，人力资源管理进入数智化阶段、处于信息化阶段、尚未进入信息化阶段的企业分别占比约三分之一，详细描述如下：


    - 约34.5%的企业在人力资源管理在不同程度上进入数智化阶段，远高于其他管理模块；


    ![](Images/cutq_207_54161_l.jpg)


    如图7-14人力资源各职能模块数智化所处阶段


    - 约33.1%的企业在人力资源管理数智化程度上非常落后，分别处于线下作业或线上化阶段，多数为传统企业，深层原因有待进一步挖掘；

    - 约32.4%的企业处于人力资源管理信息化阶段，他们是数字化转型的有生力量。


    这些数据说明在人力资源管理数智化方向上，一是企业在认知层面尚需学习与提升，在实践层面还有更长的路要走；二是更多的人已开始认识到数字化转型的重要性与迫切性，并已开始行动；三是人力资源可以先进行数字化转型，做好组织保障、人才储备和文化氛围打造工作，赋能业务转型与快速发展。


    ### [四、二支柱](../Text/contents.xhtml#c_90)


    在人工智能和大数据时代，企业发展与组织形态千差万别，人力资源管理者就需要随着组织发展的变化而不断迭代。为了适应业务的变化与要求，有些企业已逐步将三支柱过渡到了二支柱，即前端仍然是`HRBP`，响应与处理员工的各种诉求，后端`HRCOE`与`HRSSC`紧密协作，共同为`HRBP`提供解决方案。二支柱也称“板凳模型”，如图7-15所示。


    ![](Images/cutq_208_0130_m.jpg)


    图7-15　二支柱模型示意图


    二支柱适合业务发展快速、创新型的组织，这就要求企业的人力资源数字化建设要达到一定的程度，一个平台、一个手机就能应对各种问题、处理所有事务。


    ### [五、四支柱](../Text/contents.xhtml#c_91)


    四支柱是指在三支柱的基础上多了一个支柱，即项目管理办公室或项目管理部（Project Management-4Office，`PMO`）或人力分析（People
    Analytics，`PA`）。四支柱模型示意图如图7-16所示。


    ![](Images/cutq_209_6526_m.jpg)


    图7-16　四支柱模型示意图


    流程驱动的企业包含的项目多，如人才标准、人才选拔、人才盘点、组织扫描等，在推进项目的过程中会产生各种难题，这时就需要`PMO`负责协调整合、推进项目的有效执行与落地。`PMO`是提高组织管理成熟度的核心部门。


    数据驱动的企业会专设`PA`这一部门，它被视为“HR的未来工作”。未来，人力分析不仅是人力资源工作的一部分，而且将成为整个企业开展组织分析的关键部分。企业设立`PA`部门的典型代表就是谷歌公司的“氧气项目”和百度公司的“人才智库”。


    无论是三支柱，还是二支柱、四支柱，它们都是为了实现人力资源战略及业务转型与发展，尤其是二支柱，它是`AI`、大数据技术驱动下的必然结果。


    ## [第二节　人工智能如何驱动共享服务中心](../Text/contents.xhtml#b_92)


    人工智能在人力资源共享服务中心（`HRSSC`）中的应用已经很普遍了，因为百度公司的实践比较早，所以下面以百度公司为例，讲一讲人工智能在`HRSSC`中的各类新技术与新实践。


    ### [一、业务背景](../Text/contents.xhtml#c_93)


    百度在2010年前后运行了`SDC`、`HRCOE`、`HRBP`“三驾马车”，其中共享交付平台（Service Delivery Center，`SDC`）的发展经历了从1.0到3.0的阶段。百度将3.0阶段称为“`Smart
    HR`”阶段，该阶段旨在通过更具交互性的系统，利用大数据预测、控制和分析功能管理组织变革和人才发展，其重点关注的是效率和管控。百度从2014年起便在这一阶段“发力”。到了2017年，百度已着手从“`Smart
    HR`”阶段转向“`Intelligent HR`”阶段，也就是迈向了3.5甚至4.0阶段。在这个转型期，为了追求更佳的员工体验、组织活力和文化赋能，百度摈弃了传统的流程，而是选择了数字化转型的流程，如图7-17所示。


    ![](Images/cutq_210_14314_l.jpg)


    图7-17　百度人力资源管理工作中应用人工智能的领域


    ### [二、新技术的应用](../Text/contents.xhtml#c_94)


    #### 1. 招聘领域——智能简历职位匹配


    业务驱动与技术导向改变了招聘的工作方式，百度的人力资源管理者非常注重人工智能在招聘领域的应用及其带来的效率提升。通过对人才简历库的自然语言处理（`NLP`）及机器学习进行算法与模型搭建，解决了简历与职位说明书智能化匹配的难题。如下两款工具将帮助人力资源部的招聘专员提升运营效率。


    ##### (1) 众里寻他


    这是百度为招聘团队打造的简历智能筛选系统。该系统通过识别招聘团队发出的职位说明书，精准匹配人才库中符合要求的简历。这里说的“精准匹配”并不是字面上的匹配，而是结合了潜在候选人的相关背景、工作经历、项目经历等方面进行综合考量，进行大数据算法分析与“匹配”。优化筛选简历的过程可以让招聘团队更加专注地考量候选人，将更多的精力放在面试环节中。


    ##### (2) 沧海拾遗


    这是百度为候选人打造的职位匹配系统，可以帮助他们提高应聘效率。该系统会在候选人搜索职位时，根据他们的简历，主动向其推荐适合的工作，减少候选人浏览职位说明书的时间，防止他们错过适合自己的职位。


    #### 2. 入职流程——各项技术相结合实现自动化


    ##### (1) OCR技术


    `OCR`技术是指通过扫描等光学输入方式将各种证件、票据、报刊、书籍、文稿等印刷品的文字转化为图像信息，再利用文字识别技术将图像信息转化为可以输入计算机的信息的技术。近两年，这一技术被逐渐应用到了人力资源领域，企业可以将其与入职办理流程中新员工身份相关信息的验证相结合。在新员工入职前，企业可以要求新员工将学历证书、资格证书、身份证件、银行卡等复印件上传至系统中，利用`OCR`技术对信息进行识别，同时对接第三方征信平台如学信网，员工的学历信息验证工作即可快速完成。


    ##### (2) 刷脸技术


    百度的刷脸技术比较成熟，公司内部应用场景比较多的是门禁刷脸、会议签到、内部购物等。当然，刷脸技术还会应用到其他场景中，如自助打印证明，员工刷工卡或刷脸都可以完成。再如，在新员工办理入职手续的过程中，刷脸技术与访客系统既可用于新员工提前预约报到，也可以提升新员工的入职体验与办理效率。


    ##### (3) 预约系统——端到端的自动化


    预约报到的新员工会得到相应的后台预约码，百度在向其发送预约码的同时，还可以向其推送入职指南、公司新闻动态。员工到达公司后出示预约码便可以根据入职指南，直接到达办理相关手续的地点。另外，由于新员工入职工作往往是集中进行的，为了便于管理，新员工的预约码已经与办理入职手续的会场的座位号相匹配，同时座位上会放置“入职大礼包”，包括新员工的电脑、办公用品、需要签署的文件等，方便新员工查找。


    这一系列的工作打通了候选人与反馈系统、入职系统的连接，实现了端到端的自动化，新员工对公司的好感度也得到了极大的提升。


    #### 3. 在线学习系统——AI赋能


    ##### (1) 百度学堂的新产品——灵听


    培训专员的痛点之一就是要为一些重复性的简单工作付出大量的时间和精力，如给视频课程加字幕。培训视频加字幕的目的是使学员在学习的过程中更准确、快速地理解课程内容。但是，加字幕这件事的背后却需要培训专员付出很多的时间和精力。培训专员首先要记录讲师讲述的文字，然后纠错复查，再按照视频制作要求分行，最后才能请视频制作者合成字幕与视频。整个过程需要数个工种配合，花费数个工作日的时间。为了解决这个问题，百度利用`AI`技术制作了灵听平台，培训专员将任意一段视频上传到灵听平台后，系统就能够根据语音自动识别出字幕，并直接添加到视频上，培训专员仅需对个别识别不准之处稍加修改，即可获得一段添加好字幕的视频。一个人仅花费几分钟即可完成以前由数人花费数天才能完成的工作。


    ##### (2) 百度听清


    演讲者说话的同时，百度利用语音识别与翻译技术就可以实时打出中英文字幕，这个名为“百度听清”的技术已经应用到了百度内部的直播平台上。


    ### [三、大数据的应用与思考](../Text/contents.xhtml#c_95)


    #### 1. 大数据的“底线”


    涉及个人隐私的内容，如邮件内容、私人交流内容等绝不可以用于个性分析。


    #### 2. 大数据的基础


    首先，人力资源部各个模块的数据应该是“互通的”，而不是各自为战。整合人力资源数据是进行大数据分析的第一步。其次，要与其他部门如财务部、销售部的数据做好“联通”。


    #### 3. 数据安全问题的处理


    数据安全是每家企业都必须面对和处理的问题，其关键在于分工。负责画体系界面、打通数据等工作的人员应当共同商讨做出界定，确定访问级别及其权限。


    #### 4. 新技术的本质依然是大数据


    刷脸、语音识别等新技术仅仅是一种手段、工具或平台，在起步阶段，其背后依然是大数据在驱动。因此，这些技术的进步归根结底还是有赖于大数据的沉淀、整理和迭代。


    ## [第三节　人工智能如何赋能HRCOE](../Text/contents.xhtml#b_96)


    本节我们同样通过对“百度人才智库（`TIC`）”案例的介绍，看一看人工智能是如何赋能`HRCOE`的。


    百度以更加量化、客观的手段，从人才、组织和文化三个方面践行“让优秀人才脱颖而出”的人才管理理念。百度人才智库包含“智·管理”“智·选才”和“智·人物”等六个功能模块，具体如图7-18所示。


    - 人才方面。`TIC`能够极大地提升招聘工作效率，高效识别优秀管理者与高潜人才，预判员工离职倾向和离职后的影响，并为人才获取、培养与保留提供智能支持。

    - 组织方面。`TIC`能通过分析部门活力、人才结构，科学评估组织的稳定性，揭示组织间人才流动的规律，为组织优化调整、高效激励人才与促进人才流动提供智能支持。

    - 文化方面。`TIC`能及时呈现组织内外部的舆情热点，分析外部人才市场状况，提升企业口碑，提振员工士气，为企业进行人才储备提供智能支持。


    ![](Images/cutq_215_24109_l.jpg)


    图7-18　百度人才智库对应用场景的支持


    ### [一、组织人才管理风险指数](../Text/contents.xhtml#c_97)


    在面对新的形势和新的业务挑战时，企业怎样才能从大批管理者中提拔出能够胜任高风险岗位的管理者呢？`TIC`提出了人才管理风险指数这一概念。通过该指数，企业可以及时识别管理者在各个时期面临的管理复杂性和困难程度，并比较不同管理者在职业生涯中面临的风险变化。例如，某些管理者只胜任特定的领域，一旦转换到其他领域，其职业发展曲线就会呈现大幅波动。有能力的管理者则可以在相对较短的时间内让动荡的曲线趋于平缓。人才管理风险指数为企业提拔、任命领导者提供了有说服力的客观依据。


    ### [二、人员、人才和人物](../Text/contents.xhtml#c_98)


    过去，企业注重的是“人员”，如早期的福特公司等制造业企业，强调人员的组织纪律性；现在，高科技企业注重的是“人才”，强调人才的一技之长和团队组织协作能力；未来，企业注重的将是“人物”，需要人物具备卓越的领导力及创新力。


    如何挖掘和寻找“人物”是人力资源部面临的重大挑战。`TIC`从公司员工的核心地位、业务桥梁、开放交流、组织框架和广泛合作五个维度打造量化模型，以业务往来邮件、在公司平台上编写程序等客观真实的数据和文本为依据，对员工进行打分。


    这就给每位员工建立了成长的“电子档案”，通过计算员工的业务核心度指数，判断其成为“人物”的可能性，并且能够发现员工在这五个维度的优劣势，进而给予其适当的任命或有针对性的培训。需要指出的是，`TIC`深知隐私保护对大数据分析的重要性，任何由`TIC`使用的数据都会受到严格审批、加密与管理，以确保不被用于其他用途。


    ### [三、人才动向预测](../Text/contents.xhtml#c_99)


    通过收集企业内外部的数据，包括来自社交媒体和互联网的舆论信息与文本，`TIC`建立了包含经济、职业发展和个人家庭原因等数百个动态特征的90天离职预测模型，预测准确度达到了90%以上。例如，在2015年百度进行的一项离职预测中，`TIC`分析出了离职指数最高的前30名员工，3个月内其中29人向人力资源部提出了离职申请。`TIC`还能计算出员工的离职影响力有多大，并分析出员工离职的各项原因。如果离职指数高的员工属于稀缺性人才，且离职原因在公司的可控范围内，百度就能够及时进行干预，采取适当的挽留手段。


    # [第八章　建设智慧HR平台，助力业务转型](../Text/contents.xhtml#z_13)


    在`VUCA`时代，组织对人力资源管理工作提出了很高的要求，同时对人力资源系统平台也提出了明确的诉求，主要体现在如下几个方面。


    - 打通系统与数据孤岛。打通“入离升降调、选用预留管”环节，实现流程的端到端连通、系统上下游贯通、数据高效流通。

    - 建立与用好人才库。建立全球人才库，形成人才地图，实现人才的全生命周期管理。

    - 统一人力资源系统平台。搭建统一的平台，划归统一的入口，设定不同的权限，为员工、管理者、`HRBP`提供丰富、好用的工具，实现自助服务，提升工作效率与用户体验。

    - 数据驱动。建成可供`HRBP`、管理者使用的仪表盘、看板、人才大屏等，通过人才画像、组织扫描实现流程的智能化、决策的智能化和数据预警。

    - 员工体验。实现入职、在职、离职三位一体的闭环管理，提供全场景服务，提升员工敬业度。


    ## [第一节　四化模型与人力资源数智化的迭代路径](../Text/contents.xhtml#b_100)


    在过去的几十年中，人力资源管理工作可以划分为四个阶段，如图8-1所示。在此过程中，人力资源信息化也随着技术的不断迭代在向前发展着，同样经历了四个阶段，如图8-2所示。


    ![](Images/cutq_219_38746_l.jpg)


    图8-1　人力资源管理的四个发展阶段


    读者可以参考四化模型，对照各自企业人力资源管理工作发展的不同阶段，思考数字化蓝图，寻找数字化快速迭代路径，不断探索与突破，助力业务发展与转型。


    ![](Images/image_220_0_l.jpg)


    图8-2　人力资源信息化的“四化模型”


    ### [一、1.0阶段：线上化](../Text/contents.xhtml#c_101)

