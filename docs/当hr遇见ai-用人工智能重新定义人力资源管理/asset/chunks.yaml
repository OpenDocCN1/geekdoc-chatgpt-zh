- raw: 'K即知识（Knowledge），是指员工在某一特定领域拥有的事实型与经验型信息（如专业知识、教育经历、工作经历、项目经历、培训经历等）。知识的特点是容易识别、便于培训。在这方面，HR从业者重点考察与衡量候选人是否具备岗位必备知识，解决的是候选人“能不能胜任”的问题。


    S即技能（Skill），是指员工结构化地运用知识完成某项具体工作的能力，也就是员工对某一特定领域所需技术与知识的掌握情况（如表达能力、组织能力、决策能力、学习能力等）。技能的特点是易识别、易培训。在这方面，HR从业者重点考察与衡量候选人是否具备基本技巧，解决的是候选人“行不行”的问题。


    A即能力（Ability），是指员工完成某一领域工作或某一个项目所需具备的综合素质，包括心智模式、认知水平、工作态度、行为模式、互动模式、自我形象（如能力评估、OKR考核、绩效考核、领导力考核、360度考核评价等）。在这方面，HR从业者重点考察与衡量候选人是否具备岗位要求的能力，解决的是候选人“好不好”“如何干”的问题。


    M即动机（Motivation），是指一个人内在的自然而持续的想法和偏好。动机能够驱动、引导和决定个人行动（如价值观、满意度、敬业度等）。动机的特点是难识别、难培训。在这方面，HR从业者重点考察与衡量候选人的潜力及态度，解决的是候选人“愿不愿干”“干多久”的问题。


    由此可见，“冰山”水平面以上的信息是结构化数据，相对容易收集，便于统计与分析；而“冰山”水平面以下的信息大部分是非结构化数据，相对而言不便收集。HR从业者需要利用AI技术、大数据技术、算法模型等对水平面以下的信息进行多维度分析、洞察与呈现，为业务管理的决策工作提供辅助判断。


    ### [二、KSAM指标的模型](../Text/contents.xhtml#c_20)


    传统的招聘漏斗模型体现在多（数量）、快（时间）、好（质量）、省（成本）四个方面，即在较短的时间内，利用较少的成本，招聘到足够多的优秀人才（如图2-2所示）。即使在AI和大数据时代，这也是衡量招聘专员工作绩效的基础指标。


    ![](Images/cutq_47_48483_l.jpg)


    图2-2　传统的招聘漏斗模型


    企业管理者可以从招聘工作过程和招聘工作结果两个方面评估招聘工作的效率。


    1.招聘工作过程的效率评估


    招聘工作过程效率评估的指标包括时间和成本两个方面。


    （1）时间效率评估


    时间效率评估工作可以根据以下两个数据指标完成。


    招聘周期是指岗位提出人员需求之日到新员工入职报到之日之间的天数。


    平均招聘周期是指岗位提出人员需求之日到新员工入职报到之日之间的天数的平均值。


    （2）成本效率评估


    成本效率评估可以采用以下三个公式完成。


    人均招聘成本=总招聘成本/三个月后转正员工的数量


    录用比率=录用总人数/应聘总人数×100%


    上岗比率=三个月后转正员工的数量/应聘总人数×100%


    （注：假设新员工的试用期为三个月）


    2.招聘工作结果的效率评估


    （1）招聘专员要在规定的时间内找到与岗位匹配的人才，并使其到岗长期稳定工作。因此，企业管理者可通过以下几个指标评估招聘工作结果的效率。


    招聘计划完成率=报到签约人数/计划所需人数×100%


    新员工报到率=报到签约人数/录取人数×100%


    新员工保留率=三个月后转正员工的数量/报到签约人数×100%


    （2）招聘质量是考核招聘专员工作业绩的重要指标之一，企业管理者常常通过用人部门对新员工的满意度评分来评价招聘质量。一般来说，人力资源部会在招聘工作结束后对用人部门提出以下几个问题。


    ①您对招聘专员提供的招聘服务的满意度评分分值为\_\_\_\_（1~10分）


    ②您对招聘专员提供候选人的速度的满意度评分分值为\_\_\_\_（1~10分）


    ③您对招聘专员提供候选人的质量的满意度评分分值为\_\_\_\_（1~10分）


    ④您对招聘专员提供候选人的数量的满意度评分分值为\_\_\_\_（1~10分）


    ⑤欢迎您对我们的服务提出宝贵建议（若有请填写）\_\_\_\_


    ### [三、应对挑战](../Text/contents.xhtml#c_21)


    在充满不确定性和复杂性的VUCA时代，企业为了在市场竞争中取得领先优势，会相应地提高用人标准。与此同时，用工环境与人才市场也在发生变化，这就对招聘工作提出了新的挑战。


    HR从业者的首要工作是夯实基础指标，丰富与应用多（数量）、快（时间）、好（质量）、省（成本）的招聘效率指标模型。


    随着人工智能技术在招聘工作中的广泛应用，招聘效率的衡量指标也需要及时迭代，从“多”“快”“好”“省”效率指标向“价值输出”层面迭代（如图2-3所示）。影响“价值输出”的因素包括有吸引力的雇主品牌、高质量的人才库、人才效力提升、具有竞争性的薪酬体系、员工敬业度、业界标杆、优秀的领导者与人才梯队、培训效益、文化促进、留才指数、降低替代成本等。突破“价值”的过程中，还要进行各类风险管控，如招聘风险控制、人才风险控制、文化与软环境风险管理、法务风险规避、绩效行为反馈风险、培训过程风险控制、离职风险管理等。


    同时，HR从业者要重视提升员工终身价值（Employee Lifetime Value，ELV），避免用人风险，提高人才的投资回报率（ROI），进而提升组织效能。


    ![](Images/cutq_50_0584_l.jpg)


    图2-3　人工智能时代的招聘指标模型


    1.避免用人风险


    在招聘过程中，HR从业者要注意防范用人风险，避免发生劳动争议。在AI时代，大数据技术可以通过建立风险控制模型、开展算法分析，在以下几个方面进行机器学习与训练，提出用人建议与风险提示，帮助HR从业者规避相关的招聘风险：


    ①候选人简历造假；


    ②员工跳槽导致的不良竞争；


    ③企业文化、价值观匹配程度。


    2.提升员工终身价值


    过去，企业管理者常常通过用人部门对招聘工作的满意度评分来评价招聘工作的质量。现在，随着企业纷纷将人力资源管理转向人才运营管理（如谷歌、微软、苹果、爱彼迎、网飞、百度、阿里巴巴、腾讯、华为等企业），HR从业者承担了更重要的责任，就是要站在企业的角度评价招聘工作的质量。这时，企业就需要引入一个新概念——员工终身价值，企业管理者需要据此评价招聘工作的质量。


    企业的财务部门会计算客户的终身价值（Customer Lifetime Value，CLV），衡量他们的营销获客与销售工作的产出价值与生产力。同样，招聘高水平的员工与企业的收入也是有直接关系的，员工终身价值就是用来衡量员工对企业收入增长的贡献程度的重要指标。


    高水平员工创造的价值与普通员工创造的价值是千差万别的。有研究资料显示，企业聘用一位领军人才可以收获几十倍甚至上百倍的生产效率的回报；同时，他还具备光环效应，不仅能够吸引优秀的外部人才，而且会对企业内部表现不佳的员工产生积极的影响。


    3.提高人才的投资回报率


    有研究发现，高水平的候选人入职后的员工终身价值也很高，企业因此获得了较高的人才投资回报率。图2-4就很好地诠释了这一点，横坐标是司龄，纵坐标是工作效能，张三是一个具备平均水平的候选人，入职后的员工终身价值表现曲线为虚线；李四是一个具备较高水平的候选人，入职后的员工终身价值表现曲线为实线，从图中数据可以看出李四的个人效能明显优于张三，而且随着企业的发展，李四的投资回报率更高（虚线与实线围成的区域就是两人的投资回报率之差）。由此可见，员工终身价值与企业的投资回报率呈正相关关系。


    ![](Images/cutq_52_13410_l.jpg)


    图2-4　两位员工的终身价值表现曲线


    ## [第二节　人工智能与招聘新玩法](../Text/contents.xhtml#b_22)


    ### [一、人工智能重塑招聘流程](../Text/contents.xhtml#c_23)


    进入数字化新时代后，招聘工作将迎来深刻的变革，人工智能技术将重塑人才招聘的流程。


    招聘是企业寻找和筛选符合空缺岗位需求的候选人的工作。根据2017年德勤的调查报告，83%的管理人员认为人才招聘工作重要或者非常重要。乔布斯（Jobs）曾说过：“苹果公司为了招聘到全世界最优秀的人才付出了非凡的努力。”


    美国学者布劳夫（Breagh）等人将招聘流程分为五个步骤：第一步是确定招聘目标，包括招聘岗位的数量和每个岗位对应的任职要求，如教育背景、专业技能等；第二步是确定招聘策略，明确要招聘何种类型和特征的员工以及相关预算，确定通过何种渠道和方法获取候选人的信息；第三步是完成招聘活动，包括确认参与招聘工作的人员，通过浏览简历和面试获取候选人的信息；第四步是绘制候选人的画像，包括候选人的学历、工作年限、对企业文化的认同度、对未来工作的期望等；第五步是完成招聘决策并输出招聘结果。


    在实际招聘工作中，大量的事务性工作集中在初筛简历和精选候选人环节，在传统的招聘过程中，这些工作主要由招聘专员手工完成。招聘专员需要耗费大量的时间筛选候选人，然后联系通过初筛的候选人并确认后续面试。这一过程看似简单，实际上对招聘工作的结果颇有影响。首先，这一环节会消耗招聘专员的大量时间，在理论上，时间成本会随着简历数量的增加而实现线性增加；其次，招聘专员的个人喜好会对筛选结果产生影响，如简历内容的条理性和简历的排版风格等都有可能影响招聘专员的判断；最后，对某些专业岗位任职人员的招聘存在明显的矛盾，专业岗位的管理人员如中高层管理者无法投入大量时间初选简历，而人力资源部的招聘专员并不具备筛选特定专业领域候选人的能力，这一矛盾的后果就是企业会错失合格的候选人，使不合格的候选人进入面试环节甚至通过面试，这将对企业经营带来一系列的损失。


    现有的AI技术可以从多个方面优化招聘流程。例如，光符识别技术（Optical Character Recognition，OCR）可以从简历、证书等纸质文件或图片中识别并输出文本内容，从而帮助招聘专员轻松获取候选人信息；申请人的电子简历或者经过OCR获取的数据可以通过NLP算法提炼重要信息。另外，计算机视觉算法也可用于视频面试，招聘专员通过分析候选人回答问题的内容、面部表情和肢体语言等评估候选人。


    ### [二、智能筛选简历](../Text/contents.xhtml#c_24)


    招聘专员不仅要帮助企业引进符合专业要求的人才，而且在面试过程中要考虑企业文化、组织氛围与候选人是否契合。


    在人力资源管理六大模块中，招聘是技术含量比较高、专业难度比较大的工作。招聘专员由于自身的知识水平及认知能力有限，在寻找和筛选候选人时总会存在一些偏差。人工智能技术则可以纠正这些偏差，因为它拥有更加丰富的知识储备和更加完善的认知能力，同时，它具有自动化的特点，可以自动开启招聘功能，自动寻找与匹配候选人，实现自动识别和判断、自动跟踪、自动评估和分析等。


    百度公司利用大数据技术开发了相应的算法，对简历进行智能筛选和推荐。百度公司采用了“双推”机制（如图2-5所示），一方面把简历精准地推送给招聘专员，另一方面将正在招聘的热点和稀缺岗位定点推送给潜在的候选人，实现“逆向”推送。“逆向”推送对人工智能技术的要求更高，其难点主要在于算法。这一算法无法仅仅通过程序实现，而是需要不断地迭代、优化。其背后是相应的模型，这些模型会针对不同的岗位而搭建。


    ![](Images/cutq_55_20104_l.jpg)


    图2-5　百度公司的“双推”机制


    企业搭建模型的前提是拥有一定的数据量，否则模型的准确度和优化程度都会受到影响。当然，模型本身也需要通过数据来不断优化。在数据收集方面，人工智能引擎可以自动扫描候选人资料，将其与可用的空缺职位进行匹配。除了候选人的数据，企业还需要收集岗位信息、市场热度、行业热度、地理位置、候选人流动的地理范围与区域等信息，如北京的IT行业候选人主要存在于中关村区域。与过去的模糊搜索和匹配相比，现在的搜索精准度有了较大的提升。人工智能引擎能在短时间内扫描大量的求职者资料，算法在保证准确性的同时还加快了简历筛选与录用决策的速度。


    腾讯公司HR从业者用打造互联网产品的方式为来自业务部门的面试官提供了招聘工具。当业务部门提出用人需求时，人力资源部首先会在公司内选择三位以上的优质员工，之后建模、扫描，分析这些员工成功的因素，如逻辑思维能力强、对数字敏感、善于学习等，然后对这些成功因素进行倒推并落实到行为上，再根据行为设计面试问题，最后在问题后附上几个答案选项并给出分值。


    过去，阿里巴巴公司大部分的招聘工作是由HR从业者完成的，HR从业者提前安排好面试工作，团队领导者不需要自己查找简历。现在，阿里巴巴公司的招聘工作主要由团队领导者负责，他们需要自主完成与招聘相关的工作。基于这样的管理理念，人力资源部提供了基于移动端的“一站式招聘工作台”，团队领导者可以在移动端完成从职位发布、简历推荐及评估、面试及反馈到录取通知书审批等一系列工作。其中，智能推荐简历功能对团队领导者的帮助非常大，它可以自动收集来自所有渠道的简历，自动淘汰不符合要求的简历，并通过能力、潜力、意愿和职位四个维度的综合得分自动推荐优秀人才，从而大幅提高了企业的招聘效率。


    企业采用AI技术筛选简历的过程主要分为两步，首先明确候选人的简历和岗位描述的匹配度，然后根据匹配度对候选人的简历进行分类。


    我们通过以下案例说明算法层面需要解决的问题。假设，某公司需要招聘一名算法工程师，岗位要求与候选人工作经历如图2-6所示。


    A和B两名候选人在简历中提供的工作经历分别如下。


    候选人A：我在大学阶段参加了创新团队并担任队长。我和队友一起把GBRT模型用于预测股票价格变化，其中我的主要工作是负责模型开发。开发语言为Python。


    候选人B：利用微博的文本数据、微博的平台特征和虚假信息的传播机制，我使用数据挖掘技术和自然语言处理技术开发了微博内容可信度评估的算法。开发语言为Python。


    以上四项岗位要求中包括三项技能要求：分别是Python开发、机器学习和大规模数据处理，其余一项岗位要求就是素质能力要求，即沟通能力和团队合作精神。


    ![](Images/cutq_57_28267_l.jpg)


    图2-6　候选人A和B与岗位需求相匹配的内容


    这样的岗位需求在招聘启事中非常常见。但是，严格地说，以上技能要求只属于一个技能类别。例如，有多种不同的技能能够匹配机器学习的技能要求，即使岗位需求缩小到NLP领域也是如此。同时，在候选人具备多项技能的情况下，面试官需要权衡候选人所有的能力并计算综合得分才能做出选择。


    针对上述问题，百度人才智库开发的深度学习算法模型已经实现以下功能。


    ①对描述岗位需求或求职者工作经验的长句子，算法模型能够获得句子的向量表示，并计算出各个词语的重要性；


    ②算法模型能够计算出不同需求或经验之间的相对重要性；


    ③算法模型能够计算一个需求和不同经验之间的相关性。


    算法模型由三个部分构成，分别是词级表征学习、多层能力感知表征学习和人岗匹配度计算，如图2-7所示。


    ![](Images/cutq_58_33567_l.jpg)


    图2-7　算法模型示意图


    词级表征学习使用的是双向长短记忆神经网络，即通过字嵌入（word embedding）技术完成对岗位需求和候选人经验的字级别的表征学习。这一阶段输入的是描述岗位需求的文本数据和反映候选人经验的文本数据，这两类文本经过模型学习之后分别输出特征表示的向量矩阵。


    多层能力感知表征学习通过多层注意力机制让与“能力”紧密相关的字获得了更高的权重，实现“能力感知”。因此，算法模型能够从文本的语言理解中提炼出更高层次的岗位需求和候选人经验的特征，然后分别输出表征矩阵。


    人岗匹配度计算则是将表征矩阵作为输入，计算岗位需求和候选人经验的匹配度，然后输出计算结果。


    与之对应的算法能力体现在以下三个层面。


    （1）词的层面。句中的关键词组和短语不仅被区分出来，而且被标注了不同的权重。


    例如，精通C、Python、R等程序设计语言，熟悉Hadoop、Hive、Hbase等。这个句子中与技能相关的重要词组都被识别出来了，包括C、Python、R、程序设计和Hadoop、Hive、Hbase。而且，C、Python、R比Hadoop、Hive、Hbase有更高的权重，与二者关联的词语分别是精通和熟悉，精通代表着候选人有更高的技能。


    （2）技能层面，主要是评估不同技能的重要性。技能的重要性反映的是技能的稀缺性，候选人具备的技能越重要，这个群体就越稀缺。


    （3）匹配层面，也就是实现岗位要求和候选人能力经验的匹配。在这个层面，算法需要判断从候选人简历中识别的关键技能词组能否匹配特定的岗位需求。


    例如，岗位要求：热爱并了解互联网，了解、熟悉SNS、论坛、微博等形态媒体的特性；候选人经验：除了上述产品外，还曾独立设计五款以上小型产品，包括订餐App、微信公众平台开发者版、星座App、评课系统、任务管理软件等并参与产品的开发及UI的设计工作。


    其中，算法识别出了订餐App、微信公众平台和星座App等与互联网相关的内容，而且算法给微信公众平台赋予了更高的权重，因为微信作为我国最重要的社交网络软件（SNS）与岗位要求中的“熟悉SNS”相匹配。


    综上所述，模型利用深度学习端到端的算法计算了简历内容和岗位需求内容的匹配度，该模型在大型科技公司提供的真实数据集上表现良好。


    ### [三、面试机器人](../Text/contents.xhtml#c_25)


    联合利华公司在优化招聘过程时使用了一整套AI系统。首先，求职者受邀完成一系列在线游戏。这些游戏的设计目的是基于心理学和认知神经学的原理，帮助面试官收集与求职者的行为、性格、品质相关的数据。然后，通过首轮筛选的求职者会被邀请参加完全由AI驱动的在线面试，AI面试官会向求职者提出一些结构化问题，并对求职者的情绪状态、答案的真实性和是否符合岗位要求等做出评估。最后，合格的求职者会得到智能聊天机器人的协助，智能聊天机器人会回答求职者的问题并安排现场面试。


    联合利华通过这种方式把平均招聘时间从4个月缩短到了4周，并且使招聘专员在一个求职者身上花费的平均时间缩减了75%。与此同时，联合利华校园招聘的大学覆盖数量从800多所增加到了2
    600多所。而且，对25 000名候选人的调查显示，其候选人满意度高达82%，远远超过了其他企业。


    AI算法正在越来越多地应用到面试视频分析工作中，它可以大幅提升面试效率、降低人为观点的偏见，为HR管理者制定决策提供支持。


    AI算法对视频文件的分析处理分为图像和语音两个部分。对图像部分的处理包括对候选人表情、姿态和动作的识别与特征提取。对语音部分的处理分为两个部分：一部分是候选人在面试交流过程中的语言表达内容，自动语音识别（Automatic
    Speech Recognition，ASR）技术可以将语音转化为文字，再通过自然语言分析算法对文字内容进行分析；另一部分是对候选人语音特征的分析，包括语速、停顿和声调等。'
  fmt: "\n## 第一节 KSAM模型\n\n**K即知识（Knowledge）**，是指员工在某一特定领域拥有的事实型与经验型信息（如专业知识、教育经历、工作经历、项目经历、培训经历等）。知识的特点是容易识别、便于培训。在这方面，`HR`从业者重点考察与衡量候选人是否具备岗位必备知识，解决的是候选人“能不能胜任”的问题。\n\
    \n**S即技能（Skill）**，是指员工结构化地运用知识完成某项具体工作的能力，也就是员工对某一特定领域所需技术与知识的掌握情况（如表达能力、组织能力、决策能力、学习能力等）。技能的特点是易识别、易培训。在这方面，`HR`从业者重点考察与衡量候选人是否具备基本技巧，解决的是候选人“行不行”的问题。\n\
    \n**A即能力（Ability）**，是指员工完成某一领域工作或某一个项目所需具备的综合素质，包括心智模式、认知水平、工作态度、行为模式、互动模式、自我形象（如能力评估、`OKR`考核、绩效考核、领导力考核、`360`度考核评价等）。在这方面，`HR`从业者重点考察与衡量候选人是否具备岗位要求的能力，解决的是候选人“好不好”“如何干”的问题。\n\
    \n**M即动机（Motivation）**，是指一个人内在的自然而持续的想法和偏好。动机能够驱动、引导和决定个人行动（如价值观、满意度、敬业度等）。动机的特点是难识别、难培训。在这方面，`HR`从业者重点考察与衡量候选人的潜力及态度，解决的是候选人“愿不愿干”“干多久”的问题。\n\
    \n由此可见，“冰山”水平面以上的信息是结构化数据，相对容易收集，便于统计与分析；而“冰山”水平面以下的信息大部分是非结构化数据，相对而言不便收集。`HR`从业者需要利用`AI`技术、大数据技术、算法模型等对水平面以下的信息进行多维度分析、洞察与呈现，为业务管理的决策工作提供辅助判断。\n\
    \n### 二、KSAM指标的模型\n\n传统的招聘漏斗模型体现在多（数量）、快（时间）、好（质量）、省（成本）四个方面，即在较短的时间内，利用较少的成本，招聘到足够多的优秀人才（如图2-2所示）。即使在`AI`和大数据时代，这也是衡量招聘专员工作绩效的基础指标。\n\
    \n![](Images/cutq_47_48483_l.jpg)\n\n图2-2　传统的招聘漏斗模型\n\n企业管理者可以从招聘工作过程和招聘工作结果两个方面评估招聘工作的效率。\n\
    \n#### 1. 招聘工作过程的效率评估\n\n招聘工作过程效率评估的指标包括时间和成本两个方面。\n\n##### （1）时间效率评估\n\n时间效率评估工作可以根据以下两个数据指标完成。\n\
    \n- **招聘周期**：是指岗位提出人员需求之日到新员工入职报到之日之间的天数。\n- **平均招聘周期**：是指岗位提出人员需求之日到新员工入职报到之日之间的天数的平均值。\n\
    \n##### （2）成本效率评估\n\n成本效率评估可以采用以下三个公式完成。\n\n- `人均招聘成本 = 总招聘成本 / 三个月后转正员工的数量`\n\
    - `录用比率 = 录用总人数 / 应聘总人数 × 100%`\n- `上岗比率 = 三个月后转正员工的数量 / 应聘总人数 × 100%`\n\n> （注：假设新员工的试用期为三个月）\n\
    \n#### 2. 招聘工作结果的效率评估\n\n##### （1）招聘专员要在规定的时间内找到与岗位匹配的人才，并使其到岗长期稳定工作。因此，企业管理者可通过以下几个指标评估招聘工作结果的效率。\n\
    \n- `招聘计划完成率 = 报到签约人数 / 计划所需人数 × 100%`\n- `新员工报到率 = 报到签约人数 / 录取人数 × 100%`\n- `新员工保留率\
    \ = 三个月后转正员工的数量 / 报到签约人数 × 100%`\n\n##### （2）招聘质量是考核招聘专员工作业绩的重要指标之一，企业管理者常常通过用人部门对新员工的满意度评分来评价招聘质量。一般来说，人力资源部会在招聘工作结束后对用人部门提出以下几个问题。\n\
    \n1. 您对招聘专员提供的招聘服务的满意度评分分值为\\_\\_\\_\\_（1~10分）\n2. 您对招聘专员提供候选人的速度的满意度评分分值为\\_\\\
    _\\_\\_（1~10分）\n3. 您对招聘专员提供候选人的质量的满意度评分分值为\\_\\_\\_\\_（1~10分）\n4. 您对招聘专员提供候选人的数量的满意度评分分值为\\\
    _\\_\\_\\_（1~10分）\n5. 欢迎您对我们的服务提出宝贵建议（若有请填写）\\_\\_\\_\\_\n\n### 三、应对挑战\n\n在充满不确定性和复杂性的`VUCA`时代，企业为了在市场竞争中取得领先优势，会相应地提高用人标准。与此同时，用工环境与人才市场也在发生变化，这就对招聘工作提出了新的挑战。\n\
    \n`HR`从业者的首要工作是夯实基础指标，丰富与应用多（数量）、快（时间）、好（质量）、省（成本）的招聘效率指标模型。\n\n随着人工智能技术在招聘工作中的广泛应用，招聘效率的衡量指标也需要及时迭代，从“多”“快”“好”“省”效率指标向“价值输出”层面迭代（如图2-3所示）。影响“价值输出”的因素包括有吸引力的雇主品牌、高质量的人才库、人才效力提升、具有竞争性的薪酬体系、员工敬业度、业界标杆、优秀的领导者与人才梯队、培训效益、文化促进、留才指数、降低替代成本等。突破“价值”的过程中，还要进行各类风险管控，如招聘风险控制、人才风险控制、文化与软环境风险管理、法务风险规避、绩效行为反馈风险、培训过程风险控制、离职风险管理等。\n\
    \n同时，`HR`从业者要重视提升员工终身价值（`Employee Lifetime Value`，`ELV`），避免用人风险，提高人才的投资回报率（`ROI`），进而提升组织效能。\n\
    \n![](Images/cutq_50_0584_l.jpg)\n\n图2-3　人工智能时代的招聘指标模型\n\n#### 1. 避免用人风险\n\n在招聘过程中，`HR`从业者要注意防范用人风险，避免发生劳动争议。在`AI`时代，大数据技术可以通过建立风险控制模型、开展算法分析，在以下几个方面进行机器学习与训练，提出用人建议与风险提示，帮助`HR`从业者规避相关的招聘风险：\n\
    \n1. 候选人简历造假；\n2. 员工跳槽导致的不良竞争；\n3. 企业文化、价值观匹配程度。\n\n#### 2. 提升员工终身价值\n\n过去，企业管理者常常通过用人部门对招聘工作的满意度评分来评价招聘工作的质量。现在，随着企业纷纷将人力资源管理转向人才运营管理（如谷歌、微软、苹果、爱彼迎、网飞、百度、阿里巴巴、腾讯、华为等企业），`HR`从业者承担了更重要的责任，就是要站在企业的角度评价招聘工作的质量。这时，企业就需要引入一个新概念——员工终身价值，企业管理者需要据此评价招聘工作的质量。\n\
    \n企业的财务部门会计算客户的终身价值（`Customer Lifetime Value`，`CLV`），衡量他们的营销获客与销售工作的产出价值与生产力。同样，招聘高水平的员工与企业的收入也是有直接关系的，员工终身价值就是用来衡量员工对企业收入增长的贡献程度的重要指标。\n\
    \n高水平员工创造的价值与普通员工创造的价值是千差万别的。有研究资料显示，企业聘用一位领军人才可以收获几十倍甚至上百倍的生产效率的回报；同时，他还具备光环效应，不仅能够吸引优秀的外部人才，而且会对企业内部表现不佳的员工产生积极的影响。\n\
    \n#### 3. 提高人才的投资回报率\n\n有研究发现，高水平的候选人入职后的员工终身价值也很高，企业因此获得了较高的人才投资回报率。图2-4就很好地诠释了这一点，横坐标是司龄，纵坐标是工作效能，张三是一个具备平均水平的候选人，入职后的员工终身价值表现曲线为虚线；李四是一个具备较高水平的候选人，入职后的员工终身价值表现曲线为实线，从图中数据可以看出李四的个人效能明显优于张三，而且随着企业的发展，李四的投资回报率更高（虚线与实线围成的区域就是两人的投资回报率之差）。由此可见，员工终身价值与企业的投资回报率呈正相关关系。\n\
    \n![](Images/cutq_52_13410_l.jpg)\n\n图2-4　两位员工的终身价值表现曲线\n\n## 第二节 人工智能与招聘新玩法\n\
    \n### 一、人工智能重塑招聘流程\n\n进入数字化新时代后，招聘工作将迎来深刻的变革，人工智能技术将重塑人才招聘的流程。\n\n招聘是企业寻找和筛选符合空缺岗位需求的候选人的工作。根据2017年德勤的调查报告，83%的管理人员认为人才招聘工作重要或者非常重要。乔布斯（`Jobs`）曾说过：“苹果公司为了招聘到全世界最优秀的人才付出了非凡的努力。”\n\
    \n美国学者布劳夫（`Breagh`）等人将招聘流程分为五个步骤：\n\n1. 确定招聘目标，包括招聘岗位的数量和每个岗位对应的任职要求，如教育背景、专业技能等；\n\
    2. 确定招聘策略，明确要招聘何种类型和特征的员工以及相关预算，确定通过何种渠道和方法获取候选人的信息；\n3. 完成招聘活动，包括确认参与招聘工作的人员，通过浏览简历和面试获取候选人的信息；\n\
    4. 绘制候选人的画像，包括候选人的学历、工作年限、对企业文化的认同度、对未来工作的期望等；\n5. 完成招聘决策并输出招聘结果。\n\n在实际招聘工作中，大量的事务性工作集中在初筛简历和精选候选人环节，在传统的招聘过程中，这些工作主要由招聘专员手工完成。招聘专员需要耗费大量的时间筛选候选人，然后联系通过初筛的候选人并确认后续面试。这一过程看似简单，实际上对招聘工作的结果颇有影响。首先，这一环节会消耗招聘专员的大量时间，在理论上，时间成本会随着简历数量的增加而实现线性增加；其次，招聘专员的个人喜好会对筛选结果产生影响，如简历内容的条理性和简历的排版风格等都有可能影响招聘专员的判断；最后，对某些专业岗位任职人员的招聘存在明显的矛盾，专业岗位的管理人员如中高层管理者无法投入大量时间初选简历，而人力资源部的招聘专员并不具备筛选特定专业领域候选人的能力，这一矛盾的后果就是企业会错失合格的候选人，使不合格的候选人进入面试环节甚至通过面试，这将对企业经营带来一系列的损失。\n\
    \n现有的`AI`技术可以从多个方面优化招聘流程。例如，光符识别技术（`Optical Character Recognition`，`OCR`）可以从简历、证书等纸质文件或图片中识别并输出文本内容，从而帮助招聘专员轻松获取候选人信息；申请人的电子简历或者经过`OCR`获取的数据可以通过`NLP`算法提炼重要信息。另外，计算机视觉算法也可用于视频面试，招聘专员通过分析候选人回答问题的内容、面部表情和肢体语言等评估候选人。\n\
    \n### 二、智能筛选简历\n\n招聘专员不仅要帮助企业引进符合专业要求的人才，而且在面试过程中要考虑企业文化、组织氛围与候选人是否契合。\n\n在人力资源管理六大模块中，招聘是技术含量比较高、专业难度比较大的工作。招聘专员由于自身的知识水平及认知能力有限，在寻找和筛选候选人时总会存在一些偏差。人工智能技术则可以纠正这些偏差，因为它拥有更加丰富的知识储备和更加完善的认知能力，同时，它具有自动化的特点，可以自动开启招聘功能，自动寻找与匹配候选人，实现自动识别和判断、自动跟踪、自动评估和分析等。\n\
    \n百度公司利用大数据技术开发了相应的算法，对简历进行智能筛选和推荐。百度公司采用了“双推”机制（如图2-5所示），一方面把简历精准地推送给招聘专员，另一方面将正在招聘的热点和稀缺岗位定点推送给潜在的候选人，实现“逆向”推送。“逆向”推送对人工智能技术的要求更高，其难点主要在于算法。这一算法无法仅仅通过程序实现，而是需要不断地迭代、优化。其背后是相应的模型，这些模型会针对不同的岗位而搭建。\n\
    \n![](Images/cutq_55_20104_l.jpg)\n\n图2-5　百度公司的“双推”机制\n\n企业搭建模型的前提是拥有一定的数据量，否则模型的准确度和优化程度都会受到影响。当然，模型本身也需要通过数据来不断优化。在数据收集方面，人工智能引擎可以自动扫描候选人资料，将其与可用的空缺职位进行匹配。除了候选人的数据，企业还需要收集岗位信息、市场热度、行业热度、地理位置、候选人流动的地理范围与区域等信息，如北京的`IT`行业候选人主要存在于中关村区域。与过去的模糊搜索和匹配相比，现在的搜索精准度有了较大的提升。人工智能引擎能在短时间内扫描大量的求职者资料，算法在保证准确性的同时还加快了简历筛选与录用决策的速度。\n\
    \n腾讯公司`HR`从业者用打造互联网产品的方式为来自业务部门的面试官提供了招聘工具。当业务部门提出用人需求时，人力资源部首先会在公司内选择三位以上的优质员工，之后建模、扫描，分析这些员工成功的因素，如逻辑思维能力强、对数字敏感、善于学习等，然后对这些成功因素进行倒推并落实到行为上，再根据行为设计面试问题，最后在问题后附上几个答案选项并给出分值。\n\
    \n过去，阿里巴巴公司大部分的招聘工作是由`HR`从业者完成的，`HR`从业者提前安排好面试工作，团队领导者不需要自己查找简历。现在，阿里巴巴公司的招聘工作主要由团队领导者负责，他们需要自主完成与招聘相关的工作。基于这样的管理理念，人力资源部提供了基于移动端的“一站式招聘工作台”，团队领导者可以在移动端完成从职位发布、简历推荐及评估、面试及反馈到录取通知书审批等一系列工作。其中，智能推荐简历功能对团队领导者的帮助非常大，它可以自动收集来自所有渠道的简历，自动淘汰不符合要求的简历，并通过能力、潜力、意愿和职位四个维度的综合得分自动推荐优秀人才，从而大幅提高了企业的招聘效率。\n\
    \n企业采用`AI`技术筛选简历的过程主要分为两步，首先明确候选人的简历和岗位描述的匹配度，然后根据匹配度对候选人的简历进行分类。\n\n我们通过以下案例说明算法层面需要解决的问题。假设，某公司需要招聘一名算法工程师，岗位要求与候选人工作经历如图2-6所示。\n\
    \nA和B两名候选人在简历中提供的工作经历分别如下。\n\n- **候选人A**：我在大学阶段参加了创新团队并担任队长。我和队友一起把`GBRT`模型用于预测股票价格变化，其中我的主要工作是负责模型开发。开发语言为`Python`。\n\
    - **候选人B**：利用微博的文本数据、微博的平台特征和虚假信息的传播机制，我使用数据挖掘技术和自然语言处理技术开发了微博内容可信度评估的算法。开发语言为`Python`。\n\
    \n以上四项岗位要求中包括三项技能要求：分别是`Python`开发、机器学习和大规模数据处理，其余一项岗位要求就是素质能力要求，即沟通能力和团队合作精神。\n\
    \n![](Images/cutq_57_28267_l.jpg)\n\n图2-6　候选人A和B与岗位需求相匹配的内容\n\n这样的岗位需求在招聘启事中非常常见。但是，严格地说，以上技能要求只属于一个技能类别。例如，有多种不同的技能能够匹配机器学习的技能要求，即使岗位需求缩小到`NLP`领域也是如此。同时，在候选人具备多项技能的情况下，面试官需要权衡候选人所有的能力并计算综合得分才能做出选择。\n\
    \n针对上述问题，百度人才智库开发的深度学习算法模型已经实现以下功能。\n\n1. 对描述岗位需求或求职者工作经验的长句子，算法模型能够获得句子的向量表示，并计算出各个词语的重要性；\n\
    2. 算法模型能够计算出不同需求或经验之间的相对重要性；\n3. 算法模型能够计算一个需求和不同经验之间的相关性。\n\n算法模型由三个部分构成，分别是词级表征学习、多层能力感知表征学习和人岗匹配度计算，如图2-7所示。\n\
    \n![](Images/cutq_58_33567_l.jpg)\n\n图2-7　算法模型示意图\n\n#### 词级表征学习\n\n词级表征学习使用的是双向长短记忆神经网络，即通过字嵌入（`word\
    \ embedding`）技术完成对岗位需求和候选人经验的字级别的表征学习。这一阶段输入的是描述岗位需求的文本数据和反映候选人经验的文本数据，这两类文本经过模型学习之后分别输出特征表示的向量矩阵。\n\
    \n#### 多层能力感知表征学习\n\n多层能力感知表征学习通过多层注意力机制让与“能力”紧密相关的字获得了更高的权重，实现“能力感知”。因此，算法模型能够从文本的语言理解中提炼出更高层次的岗位需求和候选人经验的特征，然后分别输出表征矩阵。\n\
    \n#### 人岗匹配度计算\n\n人岗匹配度计算则是将表征矩阵作为输入，计算岗位需求和候选人经验的匹配度，然后输出计算结果。\n\n与之对应的算法能力体现在以下三个层面。\n\
    \n##### （1）词的层面\n\n句中的关键词组和短语不仅被区分出来，而且被标注了不同的权重。\n\n例如，`精通C、Python、R等程序设计语言，熟悉Hadoop、Hive、Hbase等`。这个句子中与技能相关的重要词组都被识别出来了，包括`C`、`Python`、`R`、`程序设计`和`Hadoop`、`Hive`、`Hbase`。而且，`C`、`Python`、`R`比`Hadoop`、`Hive`、`Hbase`有更高的权重，与二者关联的词语分别是`精通`和`熟悉`，`精通`代表着候选人有更高的技能。\n\
    \n##### （2）技能层面\n\n主要是评估不同技能的重要性。技能的重要性反映的是技能的稀缺性，候选人具备的技能越重要，这个群体就越稀缺。\n\n#####\
    \ （3）匹配层面\n\n也就是实现岗位要求和候选人能力经验的匹配。在这个层面，算法需要判断从候选人简历中识别的关键技能词组能否匹配特定的岗位需求。\n\n\
    例如，岗位要求：`热爱并了解互联网，了解、熟悉SNS、论坛、微博等形态媒体的特性`；候选人经验：`除了上述产品外，还曾独立设计五款以上小型产品，包括订餐App、微信公众平台开发者版、星座App、评课系统、任务管理软件等并参与产品的开发及UI的设计工作`。\n\
    \n其中，算法识别出了`订餐App`、`微信公众平台`和`星座App`等与互联网相关的内容，而且算法给`微信公众平台`赋予了更高的权重，因为微信作为我国最重要的社交网络软件（`SNS`）与岗位要求中的“熟悉`SNS`”相匹配。\n\
    \n综上所述，模型利用深度学习端到端的算法计算了简历内容和岗位需求内容的匹配度，该模型在大型科技公司提供的真实数据集上表现良好。\n\n### 三、面试机器人\n\
    \n联合利华公司在优化招聘过程时使用了一整套`AI`系统。首先，求职者受邀完成一系列在线游戏。这些游戏的设计目的是基于心理学和认知神经学的原理，帮助面试官收集与求职者的行为、性格、品质相关的数据。然后，通过首轮筛选的求职者会被邀请参加完全由`AI`驱动的在线面试，`AI`面试官会向求职者提出一些结构化问题，并对求职者的情绪状态、答案的真实性和是否符合岗位要求等做出评估。最后，合格的求职者会得到智能聊天机器人的协助，智能聊天机器人会回答求职者的问题并安排现场面试。\n\
    \n联合利华通过这种方式把平均招聘时间从4个月缩短到了4周，并且使招聘专员在一个求职者身上花费的平均时间缩减了75%。与此同时，联合利华校园招聘的大学覆盖数量从800多所增加到了2600多所。而且，对25000名候选人的调查显示，其候选人满意度高达82%，远远超过了其他企业。\n\
    \n`AI`算法正在越来越多地应用到面试视频分析工作中，它可以大幅提升面试效率、降低人为观点的偏见，为`HR`管理者制定决策提供支持。\n\n`AI`算法对视频文件的分析处理分为图像和语音两个部分。\n\
    \n- **对图像部分的处理**：包括对候选人表情、姿态和动作的识别与特征提取。\n- **对语音部分的处理**：分为两个部分：\n  1. 候选人在面试交流过程中的语言表达内容，自动语音识别（`Automatic\
    \ Speech Recognition`，`ASR`）技术可以将语音转化为文字，再通过自然语言分析算法对文字内容进行分析；\n  2. 对候选人语音特征的分析，包括语速、停顿和声调等。\n"
  trans: "\n\n## Section 1: The KSAM Model\n\n**K stands for Knowledge**, referring\
    \ to the factual and experiential information an employee possesses in a specific\
    \ field (e.g., professional knowledge, educational background, work experience,\
    \ project experience, training experience, etc.). Knowledge is characterized by\
    \ being easy to identify and easy to train. In this regard, `HR` practitioners\
    \ focus on assessing and measuring whether candidates possess the essential knowledge\
    \ required for the position, addressing the question of whether the candidate\
    \ \"can do the job.\"\n\n**S stands for Skill**, referring to the employee's ability\
    \ to structurally apply knowledge to complete a specific task, i.e., the employee's\
    \ mastery of the techniques and knowledge required in a specific field (e.g.,\
    \ communication skills, organizational skills, decision-making skills, learning\
    \ skills, etc.). Skills are characterized by being easy to identify and easy to\
    \ train. In this regard, `HR` practitioners focus on assessing and measuring whether\
    \ candidates possess basic techniques, addressing the question of \"can they do\
    \ it well.\"\n\n**A stands for Ability**, referring to the comprehensive qualities\
    \ an employee needs to complete work in a certain field or a specific project,\
    \ including mindset, cognitive level, work attitude, behavior patterns, interaction\
    \ patterns, and self-image (e.g., competency assessment, `OKR` appraisal, performance\
    \ appraisal, leadership assessment, `360`-degree assessment, etc.). In this regard,\
    \ `HR` practitioners focus on assessing and measuring whether candidates possess\
    \ the abilities required by the position, addressing the questions of \"how good\
    \ are they\" and \"how will they do it.\"\n\n**M stands for Motivation**, referring\
    \ to a person's intrinsic, natural, and sustained thoughts and preferences. Motivation\
    \ drives, directs, and determines individual behavior (e.g., values, satisfaction,\
    \ engagement, etc.). Motivation is characterized by being difficult to identify\
    \ and difficult to train. In this regard, `HR` practitioners focus on assessing\
    \ and measuring candidates' potential and attitude, addressing the questions of\
    \ \"are they willing to do it\" and \"how long will they stay.\"\n\nThus, the\
    \ information above the \"iceberg\" waterline is structured data, relatively easy\
    \ to collect, and convenient for statistics and analysis; while the information\
    \ below the \"iceberg\" waterline is mostly unstructured data, relatively inconvenient\
    \ to collect. `HR` practitioners need to utilize `AI` technology, big data technology,\
    \ algorithm models, etc., to conduct multi-dimensional analysis, insight, and\
    \ presentation of the information below the waterline, providing auxiliary judgment\
    \ for business management decision-making.\n\n### 2. KSAM Indicator Model\n\n\
    The traditional recruitment funnel model is reflected in four aspects: quantity\
    \ (multiple), speed (time), quality (good), and cost (save), i.e., recruiting\
    \ a sufficient number of excellent talents in a short time with less cost (as\
    \ shown in Figure 2-2). Even in the era of `AI` and big data, this remains the\
    \ basic indicator for measuring the work performance of recruitment specialists.\n\
    \n![](img/cutq_47_48483_l.jpg)\n\nFigure 2-2　Traditional Recruitment Funnel Model\n\
    \nEnterprise managers can evaluate the efficiency of recruitment work from two\
    \ aspects: the recruitment process and the recruitment results.\n\n#### 1. Efficiency\
    \ Evaluation of the Recruitment Process\n\nThe indicators for evaluating the efficiency\
    \ of the recruitment process include two aspects: time and cost.\n\n##### (1)\
    \ Time Efficiency Evaluation\n\nTime efficiency evaluation can be completed based\
    \ on the following two data indicators.\n\n- **Recruitment Cycle**: Refers to\
    \ the number of days between the date a position requests manpower and the date\
    \ the new employee reports for duty.\n- **Average Recruitment Cycle**: Refers\
    \ to the average value of the number of days between the date a position requests\
    \ manpower and the date the new employee reports for duty.\n\n##### (2) Cost Efficiency\
    \ Evaluation\n\nCost efficiency evaluation can be completed using the following\
    \ three formulas.\n\n- `Cost per Hire = Total Recruitment Cost / Number of Employees\
    \ Confirmed After Three Months`\n- `Offer Ratio = Total Number of Hires / Total\
    \ Number of Applicants × 100%`\n- `Onboarding Ratio = Number of Employees Confirmed\
    \ After Three Months / Total Number of Applicants × 100%`\n\n> (Note: Assuming\
    \ the probation period for new employees is three months)\n\n#### 2. Efficiency\
    \ Evaluation of Recruitment Results\n\n##### (1) Recruitment specialists must\
    \ find talents matching the position within the specified time and ensure they\
    \ stay on the job long-term and stably. Therefore, enterprise managers can evaluate\
    \ the efficiency of recruitment results through the following indicators.\n\n\
    - `Recruitment Plan Completion Rate = Number of Signed Onboarders / Planned Required\
    \ Number × 100%`\n- `New Employee Onboarding Rate = Number of Signed Onboarders\
    \ / Number of Hires × 100%`\n- `New Employee Retention Rate = Number of Employees\
    \ Confirmed After Three Months / Number of Signed Onboarders × 100%`\n\n#####\
    \ (2) Recruitment quality is one of the important indicators for assessing the\
    \ performance of recruitment specialists. Enterprise managers often evaluate recruitment\
    \ quality through the satisfaction scores of the hiring departments regarding\
    \ new employees. Generally, the Human Resources Department will ask the hiring\
    \ departments the following questions after the recruitment work ends.\n\n1. Your\
    \ satisfaction score for the recruitment services provided by the recruitment\
    \ specialist is ______ (1~10 points)\n2. Your satisfaction score for the speed\
    \ of candidates provided by the recruitment specialist is ______ (1~10 points)\n\
    3. Your satisfaction score for the quality of candidates provided by the recruitment\
    \ specialist is ______ (1~10 points)\n4. Your satisfaction score for the quantity\
    \ of candidates provided by the recruitment specialist is ______ (1~10 points)\n\
    5. Welcome your valuable suggestions on our services (please fill in if any) ______\n\
    \n### 3. Addressing Challenges\n\nIn the `VUCA` era full of uncertainty and complexity,\
    \ enterprises raise their hiring standards to gain a leading advantage in market\
    \ competition. At the same time, the employment environment and talent market\
    \ are also changing, posing new challenges to recruitment work.\n\nThe primary\
    \ task of `HR` practitioners is to consolidate basic indicators and enrich and\
    \ apply the recruitment efficiency indicator model of \"quantity, speed, quality,\
    \ and cost.\"\n\nWith the widespread application of artificial intelligence technology\
    \ in recruitment work, the measurement indicators of recruitment efficiency also\
    \ need to iterate in a timely manner, evolving from the \"quantity, speed, quality,\
    \ cost\" efficiency indicators to the level of \"value output\" (as shown in Figure\
    \ 2-3). Factors influencing \"value output\" include an attractive employer brand,\
    \ a high-quality talent pool, talent effectiveness improvement, a competitive\
    \ compensation system, employee engagement, industry benchmarks, excellent leaders\
    \ and talent echelons, training benefits, culture promotion, retention index,\
    \ reduction of replacement costs, etc. In the process of breaking through \"value,\"\
    \ various risk controls must also be carried out, such as recruitment risk control,\
    \ talent risk control, culture and soft environment risk management, legal risk\
    \ avoidance, performance behavior feedback risk, training process risk control,\
    \ turnover risk management, etc.\n\nAt the same time, `HR` practitioners must\
    \ attach importance to enhancing Employee Lifetime Value (`ELV`), avoiding employment\
    \ risks, improving the Return on Investment (`ROI`) of talent, and thereby enhancing\
    \ organizational effectiveness.\n\n![](img/cutq_50_0584_l.jpg)\n\nFigure 2-3　Recruitment\
    \ Indicator Model in the AI Era\n\n#### 1. Avoiding Employment Risks\n\nDuring\
    \ the recruitment process, `HR` practitioners must pay attention to preventing\
    \ employment risks and avoiding labor disputes. In the `AI` era, big data technology\
    \ can establish risk control models and conduct algorithm analysis to perform\
    \ machine learning and training in the following aspects, providing employment\
    \ suggestions and risk warnings to help `HR` practitioners avoid relevant recruitment\
    \ risks:\n\n1. Candidate resume fraud;\n2. Unhealthy competition caused by employee\
    \ job-hopping;\n3. Degree of match with corporate culture and values.\n\n####\
    \ 2. Enhancing Employee Lifetime Value\n\nIn the past, enterprise managers often\
    \ evaluated the quality of recruitment work through the satisfaction scores of\
    \ hiring departments. Now, as enterprises shift from human resource management\
    \ to talent operations management (e.g., Google, Microsoft, Apple, Airbnb, Netflix,\
    \ Baidu, Alibaba, Tencent, Huawei, etc.), `HR` practitioners bear a more important\
    \ responsibility: to evaluate the quality of recruitment work from the enterprise's\
    \ perspective. At this point, the enterprise needs to introduce a new concept—Employee\
    \ Lifetime Value (`ELV`), based on which enterprise managers evaluate the quality\
    \ of recruitment work.\n\nThe finance department of an enterprise calculates Customer\
    \ Lifetime Value (`CLV`) to measure the output value and productivity of their\
    \ marketing acquisition and sales work. Similarly, recruiting high-level employees\
    \ is directly related to the enterprise's revenue. Employee Lifetime Value is\
    \ an important indicator to measure the degree of an employee's contribution to\
    \ the enterprise's revenue growth.\n\nThe value created by high-level employees\
    \ differs vastly from that created by ordinary employees. Research data shows\
    \ that hiring a leading talent can yield a return of dozens or even hundreds of\
    \ times in production efficiency; simultaneously, they possess a halo effect,\
    \ not only attracting excellent external talents but also having a positive impact\
    \ on underperforming internal employees.\n\n#### 3. Improving Talent Return on\
    \ Investment\n\nResearch has found that high-level candidates have high Employee\
    \ Lifetime Value after onboarding, resulting in a higher Return on Investment\
    \ (`ROI`) for the enterprise. Figure 2-4 illustrates this well: the horizontal\
    \ axis represents tenure, and the vertical axis represents work effectiveness.\
    \ Zhang San is an average candidate, with a dashed line representing his ELV curve\
    \ after onboarding; Li Si is a high-level candidate, with a solid line representing\
    \ his ELV curve. The data in the figure shows that Li Si's personal effectiveness\
    \ is significantly better than Zhang San's, and as the enterprise develops, Li\
    \ Si's ROI is higher (the area enclosed by the dashed and solid lines represents\
    \ the difference in ROI between the two). This shows that Employee Lifetime Value\
    \ has a positive correlation with the enterprise's ROI.\n\n![](img/cutq_52_13410_l.jpg)\n\
    \nFigure 2-4　Lifetime Value Performance Curves of Two Employees\n\n## Section\
    \ 2: AI and New Recruitment Practices\n\n### 1. AI Reshaping the Recruitment Process\n\
    \nEntering the new digital era, recruitment work will usher in profound changes,\
    \ and AI technology will reshape the talent recruitment process.\n\nRecruitment\
    \ is the work of enterprises finding and screening candidates who meet the needs\
    \ of vacant positions. According to Deloitte's 2017 survey report, 83% of managers\
    \ believe talent acquisition is important or very important. Steve Jobs once said:\
    \ \"Apple has made extraordinary efforts to recruit the best talent in the world.\"\
    \n\nAmerican scholar Breagh et al. divided the recruitment process into five steps:\n\
    \n1. Determine recruitment goals, including the number of recruitment positions\
    \ and the job requirements for each position, such as educational background,\
    \ professional skills, etc.;\n2. Determine recruitment strategies, clarify the\
    \ type and characteristics of employees to be recruited and the relevant budget,\
    \ and determine through which channels and methods to obtain candidate information;\n\
    3. Carry out recruitment activities, including confirming personnel participating\
    \ in the recruitment work, and obtaining candidate information through resume\
    \ screening and interviews;\n4. Draw candidate profiles, including candidates'\
    \ education, years of work experience, identification with corporate culture,\
    \ expectations for future work, etc.;\n5. Make recruitment decisions and output\
    \ recruitment results.\n\nIn actual recruitment work, a large amount of transactional\
    \ work is concentrated in the initial resume screening and candidate selection\
    \ stages. In the traditional recruitment process, these tasks are mainly completed\
    \ manually by recruitment specialists. Recruitment specialists need to spend a\
    \ lot of time screening candidates, then contacting those who pass the initial\
    \ screening and confirming subsequent interviews. This process seems simple but\
    \ has a significant impact on recruitment results. First, this stage consumes\
    \ a large amount of the recruitment specialist's time; theoretically, time cost\
    \ increases linearly with the number of resumes. Second, the recruitment specialist's\
    \ personal preferences affect the screening results, such as the organization\
    \ of resume content and the layout style of the resume, which may influence the\
    \ specialist's judgment. Finally, there is an obvious contradiction in recruiting\
    \ for certain professional positions: professional department managers (e.g.,\
    \ middle and senior managers) cannot invest a lot of time in initial resume screening,\
    \ while `HR` recruitment specialists lack the ability to screen candidates in\
    \ specific professional fields. The consequence of this contradiction is that\
    \ the enterprise misses qualified candidates and allows unqualified candidates\
    \ to enter the interview stage or even pass it, bringing a series of losses to\
    \ enterprise operations.\n\nExisting `AI` technology can optimize the recruitment\
    \ process from multiple aspects. For example, Optical Character Recognition (`OCR`)\
    \ technology can recognize and output text content from paper documents or images\
    \ such as resumes and certificates, helping recruitment specialists easily obtain\
    \ candidate information; applicants' electronic resumes or data obtained through\
    \ `OCR` can have important information extracted via `NLP` algorithms. In addition,\
    \ computer vision algorithms can also be used for video interviews, where recruitment\
    \ specialists assess candidates by analyzing their answers, facial expressions,\
    \ and body language.\n\n### 2. Intelligent Resume Screening\n\nRecruitment specialists\
    \ not only need to help enterprises introduce talents meeting professional requirements\
    \ but also need to consider the fit between corporate culture, organizational\
    \ atmosphere, and candidates during the interview process.\n\nAmong the six major\
    \ modules of human resource management, recruitment is a job with relatively high\
    \ technical content and professional difficulty. Due to their own limited knowledge\
    \ level and cognitive ability, recruitment specialists always have some deviations\
    \ when searching and screening candidates. AI technology can correct these deviations\
    \ because it possesses richer knowledge reserves and more complete cognitive capabilities;\
    \ simultaneously, it features automation, enabling automatic activation of recruitment\
    \ functions, automatic search and matching of candidates, and automatic identification,\
    \ judgment, tracking, evaluation, and analysis.\n\nBaidu used big data technology\
    \ to develop corresponding algorithms for intelligent resume screening and recommendation.\
    \ Baidu adopted a \"Dual Push\" mechanism (as shown in Figure 2-5): on one hand,\
    \ pushing resumes precisely to recruitment specialists; on the other hand, pushing\
    \ hot and scarce positions currently recruiting to potential candidates in a targeted\
    \ manner, achieving \"reverse\" push. \"Reverse\" push places higher demands on\
    \ AI technology, with the difficulty mainly lying in the algorithm. This algorithm\
    \ cannot be implemented merely through programs but requires continuous iteration\
    \ and optimization. Behind it are corresponding models built for different positions.\n\
    \n![](img/cutq_55_20104_l.jpg)\n\nFigure 2-5　Baidu's \"Dual Push\" Mechanism\n\
    \nThe prerequisite for enterprises to build models is having a certain amount\
    \ of data; otherwise, the accuracy and optimization degree of the model will be\
    \ affected. Of course, the model itself also needs to be continuously optimized\
    \ through data. In terms of data collection, the AI engine can automatically scan\
    \ candidate profiles and match them with available vacancies. Besides candidate\
    \ data, enterprises also need to collect job information, market heat, industry\
    \ heat, geographic location, candidate mobility geographic range and areas, etc.,\
    \ e.g., `IT` industry candidates in Beijing mainly exist in the Zhongguancun area.\
    \ Compared with past fuzzy search and matching, current search accuracy has greatly\
    \ improved. The AI engine can scan a large amount of job seeker data in a short\
    \ time, and the algorithm accelerates the speed of resume screening and hiring\
    \ decisions while ensuring accuracy.\n\nTencent `HR` practitioners used the method\
    \ of building internet products to provide recruitment tools for interviewers\
    \ from business departments. When a business department proposes a hiring need,\
    \ the HR department first selects three or more high-quality employees within\
    \ the company, then models, scans, and analyzes the success factors of these employees,\
    \ such as strong logical thinking, sensitivity to numbers, good at learning, etc.\
    \ Then it reversely deduces these success factors and implements them into behaviors,\
    \ designs interview questions based on behaviors, and finally attaches several\
    \ answer options and scores to the questions.\n\nIn the past, most of Alibaba's\
    \ recruitment work was done by `HR` practitioners, who arranged interviews in\
    \ advance, and team leaders did not need to search for resumes themselves. Now,\
    \ Alibaba's recruitment work is mainly the responsibility of team leaders, who\
    \ need to independently complete recruitment-related work. Based on this management\
    \ philosophy, the HR department provided a mobile \"One-stop Recruitment Workbench,\"\
    \ allowing team leaders to complete a series of tasks from job posting, resume\
    \ recommendation and evaluation, interview and feedback, to offer letter approval\
    \ on mobile devices. Among them, the intelligent resume recommendation function\
    \ helps team leaders tremendously; it can automatically collect resumes from all\
    \ channels, automatically eliminate unqualified resumes, and automatically recommend\
    \ outstanding talents based on comprehensive scores across four dimensions: ability,\
    \ potential, willingness, and position, thereby greatly improving the enterprise's\
    \ recruitment efficiency.\n\nThe process of enterprises using `AI` technology\
    \ to screen resumes is mainly divided into two steps: first, clarify the matching\
    \ degree between the candidate's resume and the job description; second, classify\
    \ the candidate's resume based on the matching degree.\n\nWe illustrate the problems\
    \ that need to be solved at the algorithm level through the following case. Suppose\
    \ a company needs to recruit an Algorithm Engineer, with job requirements and\
    \ candidate work experience as shown in Figure 2-6.\n\nThe work experience provided\
    \ by candidates A and B in their resumes is as follows.\n\n- **Candidate A**:\
    \ During university, I participated in an innovation team and served as the team\
    \ leader. My teammates and I applied the `GBRT` model to predict stock price changes,\
    \ where my main responsibility was model development. The development language\
    \ was `Python`.\n- **Candidate B**: Using Weibo text data, Weibo platform features,\
    \ and the dissemination mechanism of fake information, I used data mining technology\
    \ and natural language processing technology to develop an algorithm for Weibo\
    \ content credibility assessment. The development language was `Python`.\n\nThe\
    \ above four job requirements include three skill requirements: `Python` development,\
    \ Machine Learning, and Large-scale Data Processing; the remaining one is a competency\
    \ requirement, i.e., Communication Skills and Teamwork Spirit.\n\n![](img/cutq_57_28267_l.jpg)\n\
    \nFigure 2-6　Matching Content of Candidates A and B with Job Requirements\n\n\
    Such job requirements are very common in recruitment announcements. However, strictly\
    \ speaking, the above skill requirements belong to only one skill category. For\
    \ example, many different skills can match the Machine Learning skill requirement,\
    \ even if the job requirement is narrowed down to the `NLP` field. Meanwhile,\
    \ when candidates possess multiple skills, interviewers need to weigh all the\
    \ candidate's abilities and calculate a comprehensive score to make a choice.\n\
    \nAddressing the above issues, the deep learning algorithm model developed by\
    \ Baidu Talent Think Tank has achieved the following functions.\n\n1. For long\
    \ sentences describing job requirements or job seeker work experience, the algorithm\
    \ model can obtain the vector representation of the sentence and calculate the\
    \ importance of each word;\n2. The algorithm model can calculate the relative\
    \ importance between different requirements or experiences;\n3. The algorithm\
    \ model can calculate the correlation between a requirement and different experiences.\n\
    \nThe algorithm model consists of three parts: Word-level Representation Learning,\
    \ Multi-layer Ability-aware Representation Learning, and Person-Job Fit Calculation,\
    \ as shown in Figure 2-7.\n\n![](img/cutq_58_33567_l.jpg)\n\nFigure 2-7　Schematic\
    \ Diagram of the Algorithm Model\n\n#### Word-level Representation Learning\n\n\
    Word-level Representation Learning uses a Bidirectional Long Short-Term Memory\
    \ Neural Network (Bi-LSTM), i.e., completing character-level representation learning\
    \ of job requirements and candidate experience through Character Embedding (`word\
    \ embedding`) technology. The input at this stage is text data describing job\
    \ requirements and text data reflecting candidate experience. After model learning,\
    \ these two types of text output feature-representing vector matrices respectively.\n\
    \n#### Multi-layer Ability-aware Representation Learning\n\nMulti-layer Ability-aware\
    \ Representation Learning enables characters closely related to \"Ability\" to\
    \ obtain higher weights through a Multi-layer Attention Mechanism, achieving \"\
    Ability Perception.\" Therefore, the algorithm model can extract higher-level\
    \ features of job requirements and candidate experience from linguistic understanding\
    \ of the text, and output representation matrices respectively.\n\n#### Person-Job\
    \ Fit Calculation\n\nPerson-Job Fit Calculation takes the representation matrices\
    \ as input, calculates the matching degree between job requirements and candidate\
    \ experience, and outputs the calculation results.\n\nThe corresponding algorithm\
    \ capabilities are reflected in the following three levels.\n\n##### (1) Word\
    \ Level\n\nKey phrases and phrases in the sentence are not only distinguished\
    \ but also annotated with different weights.\n\nFor example, `Proficient in C,\
    \ Python, R and other programming languages, familiar with Hadoop, Hive, Hbase,\
    \ etc.` In this sentence, important phrases related to skills are all identified,\
    \ including `C`, `Python`, `R`, `Programming`, and `Hadoop`, `Hive`, `Hbase`.\
    \ Moreover, `C`, `Python`, `R` have higher weights than `Hadoop`, `Hive`, `Hbase`.\
    \ The words associated with the two groups are `Proficient` and `Familiar` respectively;\
    \ `Proficient` represents that the candidate has higher skills.\n\n##### (2) Skill\
    \ Level\n\nMainly assesses the importance of different skills. The importance\
    \ of skills reflects the scarcity of skills; the more important the skills a candidate\
    \ possesses, the scarcer this group is.\n\n##### (3) Matching Level\n\nThat is,\
    \ achieving the matching of job requirements and candidate abilities and experience.\
    \ At this level, the algorithm needs to judge whether the key skill phrases identified\
    \ from the candidate's resume can match specific job requirements.\n\nFor example,\
    \ Job Requirement: `Passionate about and understand the Internet, understand and\
    \ are familiar with characteristics of media forms such as SNS, Forums, Weibo,\
    \ etc.`; Candidate Experience: `In addition to the above products, has independently\
    \ designed more than five small products, including Food Ordering App, WeChat\
    \ Public Platform Developer Version, Constellation App, Course Evaluation System,\
    \ Task Management Software, etc., and participated in product development and\
    \ UI design work.`\n\nAmong them, the algorithm identified content related to\
    \ the Internet such as `Food Ordering App`, `WeChat Public Platform`, and `Constellation\
    \ App`, and the algorithm assigned a higher weight to `WeChat Public Platform`\
    \ because WeChat, as the most important Social Networking Service (`SNS`) software\
    \ in China, matches the \"Familiar with `SNS`\" in the job requirements.\n\nIn\
    \ summary, the model uses deep learning end-to-end algorithms to calculate the\
    \ matching degree between resume content and job requirement content, and the\
    \ model performs well on real datasets provided by large technology companies.\n\
    \n### 3. Interview Robots\n\nUnilever used a complete set of `AI` systems when\
    \ optimizing its recruitment process. First, job seekers are invited to complete\
    \ a series of online games. These games are designed based on principles of psychology\
    \ and cognitive neuroscience to help interviewers collect data related to job\
    \ seekers' behavior, personality, and qualities. Then, job seekers who pass the\
    \ first round of screening are invited to participate in a fully `AI`-driven online\
    \ interview. The `AI` interviewer asks structured questions and evaluates the\
    \ job seeker's emotional state, authenticity of answers, and fit with job requirements.\
    \ Finally, qualified job seekers receive assistance from an intelligent chatbot,\
    \ which answers their questions and arranges on-site interviews.\n\nThrough this\
    \ method, Unilever shortened the average recruitment time from 4 months to 4 weeks\
    \ and reduced the average time recruitment specialists spent on a job seeker by\
    \ 75%. At the same time, the number of universities covered by Unilever's campus\
    \ recruitment increased from over 800 to over 2,600. Moreover, a survey of 25,000\
    \ candidates showed a candidate satisfaction rate as high as 82%, far exceeding\
    \ other enterprises.\n\n`AI` algorithms are increasingly being applied to interview\
    \ video analysis, which can significantly improve interview efficiency, reduce\
    \ human subjective bias, and provide support for `HR` managers' decision-making.\n\
    \n`AI` algorithm analysis and processing of video files are divided into two parts:\
    \ image and audio.\n\n- **Image Processing**: Includes recognition and feature\
    \ extraction of candidate expressions, postures, and movements.\n- **Audio Processing**:\
    \ Divided into two parts:\n  1. The verbal content expressed by the candidate\
    \ during the interview communication. Automatic Speech Recognition (`ASR`) technology\
    \ can convert speech into text, and then Natural Language Analysis algorithms\
    \ analyze the text content.\n  2. Analysis of candidate voice characteristics,\
    \ including speech rate, pauses, and intonation.\n\n"
