    # Product Thinking


    Product thinking is a comprehensive problem-solving mindset, a process of productizing
    problem solutions.


    Product thinking in Human Resource Management refers to HR practitioners, when
    designing and implementing solutions for selection, utilization, development,
    and retention, deeply excavating user needs, focusing on user experience and scenario-based
    design, rapidly iterating, continuously operating and optimizing, and meeting
    compliance requirements.


    ## Characteristics of Product Thinking


    - **User Thinking**: Treat employees as users, giving them a sense of participation;

    - **Pain Point Thinking**: Identify users'' real needs, especially helping them
    establish needs when conducting training work;

    - **Mobile Thinking**: Combine HR practitioners'' work with mobile tools;

    - **Scenario Thinking**: Keenly insight into users'' core needs, scenarize management
    practices, and create experiential products;

    - **Iterative Thinking**: Product implementation is modular, component-based,
    and microservice-oriented, achieving small steps, fast runs, and agile development;

    - **Data Thinking**: Speak with data, empower with data;

    - **Ecosystem Thinking**: Build a "small closed-loop" ecosystem to help employees
    achieve self-regulation;

    - **Operational Thinking**: Spread the brand, provide continuous service.


    ## Typical Cases


    ### Baidu Lingting: AI Empowers Learning Scenarios


    Baidu records a large number of video and audio courses every year. The usual
    practice was to edit and upload them directly to the platform for employee learning.
    However, some users prefer learning by reading text. If manual subtitle editing
    or audio-to-text conversion were used, it would consume a vast amount of user
    time. After extensive interviews, research, data analysis, and multiple rounds
    of iterative design, Baidu developed an AI product—Baidu Lingting. It enables
    automatic subtitling for videos and audio-to-text conversion. If some conversions
    are not accurate enough, employees can make simple adjustments along the timeline.


    ### Alibaba: Overseas HRSSC Iteration and Optimization


    With the acceleration of internationalization, the proportion of Alibaba''s overseas
    employees is increasing. Alibaba conducted iterative optimization of its overseas
    HRSSC. To ensure flexible configuration, Alibaba''s EHR team modeled the work
    and affair management of the HRSSC domain, redefined processes and handling nodes,
    and set flow rules to ensure data security. Alibaba''s HRSSC connects multiple
    systems including IT, Core HR, Commercial Insurance, and Payroll. Based on factors
    such as overseas employees'' location benefits, level, department, and country,
    it matches a personalized application list for each employee. Overseas employees
    can track processing progress in real-time, experiencing a one-stop HR service
    system.


    ### Tencent Anju Plan: Solving Housing Pain Points to Retain Talent


    Tencent''s HR department conducted an analysis in 2012: the turnover rate of new
    employees who had been with the company for three years was three times that of
    ordinary employees. Through deep excavation, HR practitioners discovered the core
    reason for employee resignation was housing difficulty. Consequently, Tencent
    launched the "Anju Plan," where the company set up a fund to provide interest-free
    loans to eligible employees. Since then, the employee turnover rate has dropped
    significantly.


    # Process Intelligence


    In the informatization era, enterprises built many information systems at different
    development stages. HR practitioners helped enterprises achieve rapid business
    development and replication by solidifying business processes. Today, with the
    advent of the digital era, business scale continues to expand, and organizations
    continue to fission. Enterprises have increasingly higher requirements for HR
    management systems: not only to achieve full digitalization of "entry, exit, promotion,
    demotion, transfer, selection, utilization, planning, reservation, and management"
    but also to achieve all-round improvement of employee experience. Therefore, the
    issues of process reengineering and process operation management have become increasingly
    prominent.


    Process intelligence refers to the process of data recording, processing, and
    analysis in human resource management, facilitating the HR management team to
    use HR data more efficiently and conveniently. Key technologies of process intelligence
    mainly include OCR image recognition, speech recognition, text parsing, computer
    vision, etc. Among them, OCR technology can assist HR practitioners in intelligent
    expense reimbursement; speech recognition technology can assist in recording meetings;
    text parsing can realize automated resume parsing; computer vision can assist
    HR practitioners in identity verification functions such as facial recognition
    attendance. These can improve the efficiency of human resource management and
    employee work efficiency, freeing the HR team from tedious administrative affairs,
    allowing HR practitioners to devote time and energy to more important, more creative
    tasks.


    ## HRSSC Self-Service "Three-Step" Practice


    The following takes HRSSC self-service as an example to illustrate how enterprises
    achieve process intelligence.


    To achieve a one-stop, efficient service experience, HRSSC needs to vigorously
    promote the online, automated, and intelligent transformation of self-service.
    This goal can be achieved through a "three-step" approach:


    1. **Build a Knowledge Base**: Sort and archive mechanisms, knowledge points,
    and encountered issues from various HR modules, making them structured and tagged
    for employees to retrieve and view at any time; simultaneously update and enrich
    the knowledge base regularly.

    2. **Develop Intelligent Customer Service Assistant**: Realize functions such
    as wizard-style Q&A, assisted Q&A, proactive suggestions, and personalized recommendations.

    3. **Create a "Virtual Assistant"**: The "Virtual Assistant" can interact with
    employees through dialogue like a real person, realizing 7×24-hour all-weather
    service. This step applies technologies such as Natural Language Processing (NLP),
    Deep Learning, Big Data Analysis, and Robotic Process Automation (RPA).


    Baidu HRSSC''s service robot self-service efficiency reaches over 70%, not only
    realizing the automation and intelligence of customer service processes, ensuring
    the coherence and high quality of replies, but also greatly improving employee
    experience and user satisfaction.


    ![](img/cutq_192_52403_l.jpg)

    *Figure 7-6 HRSSC Service Self-Service Efficiency Model*


    # HRCOE+AI


    The AI-empowered HRCOE has obvious competitive advantages in the following aspects.


    ## Talent Profiling


    Research finds that the core pain points of human resource management lie in talent
    development direction. For example, talent profiling accounts for approx. 55%,
    recruitment module approx. 62%, talent cultivation and development module approx.
    59%, HR planning module approx. 57%, and labor efficiency evaluation module approx.
    57%. Simultaneously, organizational innovation approx. 43%, organizational strategy
    approx. 42%, and engagement insight approx. 41% have become prominent pain points.
    Enterprise leadership approx. 33%, organizational stability approx. 32%, and organizational
    culture approx. 30% follow closely, gradually becoming "stumbling blocks" for
    enterprise transformation and development. The bar chart of core pain points in
    HR management is shown in Figure 7-7.


    ![](img/cutq_193_0369_l.jpg)

    *Figure 7-7 Core Pain Points of Human Resource Management*


    Ping An HR-X, combining enterprise talent data, innovatively designed Job Profiles
    and Employee (Cadre) Profiles using AI and big data technologies. Through intelligent
    tag setting, it precipitates full-time, full-view, and full-volume data to assist
    in selection and appointment decisions. The HR-X team utilizes big data and intelligent
    models to establish a set of panoramic profiles for employees in the most comprehensive
    and scientific way, such as performance profiles, skill profiles, willingness
    and personality profiles, compensation profiles, achievement and team profiles,
    etc. It matches personnel with job requirements through intelligent models, combined
    with AI interview assessment, connecting multiple HR management scenarios such
    as recruitment, performance, training, and compensation, making team management
    more precise, comprehensive, and efficient.


    In cadre profiling, rich tags and intelligent models will be applied in multiple
    scenarios such as identifying, evaluating, employing people, and team building:


    - **Integrate Personnel Information**: One-stop integration of performance, work
    experience, assessment, and other information, leveraging aggregation effects;

    - **Dynamic Comparison for All Staff**: Compare team performance and work performance,
    making dynamic trends clear at a glance;

    - **Precise Job Requirements**: Applied in internal recommendation, AI interview,
    performance suggestions, training management, and other scenarios;

    - **Precise Person-Job Fit**: Precisely match personnel with positions, making
    promotion and salary adjustment no longer difficult;

    - **Social Circle Analysis**: Display multi-dimensional relationships such as
    alumni and former colleagues, strengthening risk control over personnel;

    - **Tag Search**: Make talent allocation more convenient, easily gathering professional
    talents and industry elites;

    - **Intelligent Training**: Able to intelligently recommend courses based on users''
    strengths and weaknesses, improving employee capabilities in a targeted manner;

    - **Poor Performance Early Warning**: Detect performance shortcomings early, take
    measures early, improve employee performance, and ensure team combat effectiveness;

    - **Resignation Early Warning**: Capture abnormal employee behaviors in time,
    prompt resignation characteristics.


    Deep application of talent profiling can realize "recommending positions for people,"
    "finding people with models," "finding people with people," and "finding people
    from organizational needs." These more flexible profiling applications can help
    organizations find talents with extremely high matching degrees to the team.


    ## Organizational Scanning


    Enterprise managers need the HR department to promptly inform them via system
    reminders or dashboard displays: what are the changes in organizational structure,
    where is the talent map distributed, how to deploy troops, where are the key talents
    we need, which employees have the most potential, which talents are the "load-bearing
    walls" of the organization, which are generals, which are commanders, etc. Only
    by solving the following "Four Dimensions" can we truly realize the development
    of organizational strategy driven by talent.


    - **Accelerate business progress brought by new technology application (Speed)**

    - **Extend data analysis scenarios of points, lines, surfaces, and bodies (Breadth)**

    - **Discover things traditional data analysis cannot insight (Depth)**

    - **Promote full release of organizational effectiveness, driving continuous improvement
    of enterprise performance (Height)**


    At the current stage, enterprises are gradually transitioning from the digitalization
    stage to the digital-intelligence stage. In the transformation process, strategy
    execution and organizational construction remain key factors. For an enterprise
    to gain an advantage in industry competition, using AI to insight into the organization,
    discover talents, and drive organizational performance growth is key. Research
    finds that about 70% of enterprises in China have started the digital-intelligence
    process, gradually forming a trend. The specific situation is: about 36.49% of
    enterprises are in the initial exploration and application stage; about 24.32%
    have entered the partial module promotion and application stage; about 8.11% have
    entered the full module system comprehensive implementation stage, as shown in
    Figure 7-8.


    ![](img/cutq_195_7398_l.jpg)

    *Figure 7-8 Current Status of Digital-Intelligence Application in Chinese Enterprises*


    Enterprises use AI and big data technology to conduct all-round scanning of the
    organization, matching the organization with strategy, building a scientific organizational
    structure, focusing on real performance improvement situations, and making data
    truly play its value through data collection, collation, modeling, analysis, and
    application, empowering enterprise digital-intelligence construction. Organizational
    scanning can be conducted from two levels: organizational management and performance
    incentive mechanism.


    ### Organizational Management


    Organizational management includes organizational structure design, job system
    design, and process control. The core goal of organizational management is to
    improve organizational effectiveness. Organizations hope to become more agile
    and efficient, output more value, obtain higher profits, and achieve sustainable
    development. Organizational effectiveness can be divided into management effectiveness,
    employee effectiveness, and organizational vitality. For HR, management effectiveness
    mainly looks at organizational process optimization. Enterprise managers can judge
    whether management span, approval nodes, etc., are reasonable through Organizational
    Computed Tomography (CT). Too high or too low will affect organizational health.


    For example, JD.com''s "8150" principle: "1" refers to each manager; "8" means
    JD requires each manager to have no fewer than 8 direct reports; if fewer than
    8, middle management layers must be reduced. Only when direct reports exceed 15
    does JD allow adding a manager at the same management level; "50" means the number
    of frontline employees of the same trade managed by each manager cannot be less
    than 50. Only when exceeding 50 can a second team manager be considered. The core
    of the "8150" principle is to ensure organizational flatness and guarantee organizational
    effectiveness.


    Another example is Baidu''s "2+2" principle for core HR process approval: two
    levels of business department heads approve business rationality, and two levels
    of HRBPs are responsible for policy control. This ensures both efficiency and
    risk avoidance. The organizational scanning tool built by AI models can detect
    situations in the system that do not comply with the "8150" or "2+2" principles
    at any time. The early warning system notifies managers and HRBPs. Managers and
    HRBPs can choose two buttons: one is "Accept," the system will automatically correct
    according to rules; the other is "Manual Intervention," the system prompts a maximum
    one-month manual processing time limit, which must be completed by the date, otherwise
    the system will automatically process. With continuous business development and
    changing management scenarios, the organizational scanning model will also continuously
    iterate and optimize to ensure sustained growth of organizational effectiveness.


    ### Performance Incentive Mechanism


    The performance incentive mechanism includes performance management, compensation
    and benefits, long-term incentives, etc. AI has reshaped these processes. Employees''
    work performance and behavioral data are compliantly integrated into the database.
    HR practitioners analyze and process these performances and data, establishing
    rating models to feed back employee work performance assessment results to each
    employee online. For certain deficiencies, the organizational scanning tool also
    gives targeted suggestions. The organizational scanning tool can also give suggestions
    on the application of employee performance results, identifying different hygiene
    factor types and motivation factor types for each employee based on their historical
    data, thereby matching dozens of solutions, truly realizing "one person, one face"
    in performance incentive allocation, fully stimulating employees'' work enthusiasm.
    Even the organizational scanning tool can be used to predict employee performance,
    providing decision-making basis for managers to deploy troops.


    ## Early Warning and Prediction


    The HR management system must reflect the enterprise''s HR business needs and
    drive business development forward. Intelligent products for early warning and
    prediction are the same. The following takes Baidu''s HR management system as
    an example.


    ### Baidu''s Talent Philosophy


    Baidu''s talent philosophy is "Recruit the best people, give the largest space,
    look at the final results, let outstanding talents stand out," as shown in Figure
    7-9.


    ![](img/cutq_197_20381_l.jpg)

    *Figure 7-9 Baidu''s Talent Philosophy*


    **Recruit the best people**. The best people possess three characteristics. First,
    match Baidu''s advocated culture of "Simple and Reliable." When a person matches
    the company culture very well, internal communication and running-in costs will
    be greatly reduced. Second, excellent learning ability, which is very important
    for internet companies. The market environment and competitive landscape the enterprise
    faces change drastically every day. The enterprise uses a person not only for
    their experience advantage but more for their ability to quickly recognize, understand,
    and respond to future new environments. Third, competence for the current job
    and position requirements, which is the most basic requirement. The company needs
    to create an organization that is forever enterprising and self-driven. Self-driven
    people are not only willing to learn but can also learn quickly and continuously
    improve themselves.


    **Give the largest space**. The space mentioned here is not only a comfortable
    office environment but more importantly giving employees a sense of mission, ideals,
    and technical balance. Baidu''s largest space is cutting-edge core technology.


    **Look at the final results**. Baidu is a result-oriented company. Regardless
    of employee seniority or tenure, everything speaks by results. Baidu emphasizes
    a differentiated culture.


    **Let outstanding talents stand out**. In 2012, Baidu successively introduced
    multiple talent incentive policies and mechanisms, once again stimulating the
    self-drive and differentiation of Baidu talents. Through the "up or out" two internal
    lists (potential stocks and elimination list), junior position promotion of two
    levels in three years, cultural 360-degree assessment, setting up special outstanding
    performance awards, and other differentiated management methods, talents stand
    out.


    Correspondingly, when designing business architecture and product architecture,
    enterprise managers must fully consider HR business needs and management requirements,
    sort out processes, clarify responsibilities, build a good foundation, connect
    systems, pull through data, improve experience, and combine the latest cutting-edge
    technologies (such as AI, blockchain, cloud computing, big data, IoT, mobile,
    3D printing) to create digital-intelligence products, providing empowerment tools
    for decision-makers, managers, employees, and HR professional users, supporting
    business digital transformation. For example, in recruitment strategy, choosing
    "recruit the best/most suitable people," product design needs to consider full
    lifecycle recruitment management, unified talent pool, intelligent mutual recommendation
    of people and positions, interview/written test robots, intelligent onboarding/customer
    service, intelligent analysis dashboards, etc.; in "operation management" requiring
    full-process digitalization, product design points are unmanned one-stop service,
    flexible scheduling, non-inductive attendance, full-process digitalization of
    entry/exit/promotion/demotion/transfer, organizational CT, talent CT, talent panoramic
    profiles, etc.; in "talent learning and development," focusing on employee learning
    and growth in work, design points are digital self-service training, learning
    growth maps integrated into work, AR, VR, Mixed Reality (MR), gamification, personalized
    recommendation, one person one face, knowledge graph, panoramic dashboards, etc.;
    in "talent retention," focusing on letting outstanding talents stand out, design
    points are talent mobility early warning, organizational vitality analysis, talent
    health early warning, compensation incentive one-stop workbench, public opinion
    analysis and early warning, etc., as shown in Figure 7-10.


    ![](img/cutq_199_265_l.jpg)

    *Figure 7-10 HR Digital-Intelligence Scenarios*


    ## Decision Intelligence


    Decision intelligence in HR management assists the HR management team in making
    better decisions, discovering and analyzing problems from a data perspective,
    and providing quantitative references. Key technologies include Natural Language
    Processing, Knowledge Graph, Organizational Network Analysis, etc. Among them,
    NLP can realize intelligent person-job matching; Knowledge Graph related technologies
    can combine deep learning algorithms to predict employee turnover and performance;
    Organizational Network Analysis can quantitatively conduct leadership assessment.
    These intelligent decisions were difficult to achieve before the emergence of
    HR digital-intelligence. Now, based on these technologies, HR digital-intelligence
    can improve decision-making efficiency and accuracy, and provide quantitative
    analysis support.


    Of course, when using big data technology and thinking to conduct early warning,
    prediction, and analysis on HR management''s small data, decisions are not made
    directly based on correlation relationships. Instead, after comprehensive modeling
    and correlation analysis of all data and factors (not only HR domain data or factors,
    but also finance, operation, office OA, IT, external environment, and other data
    or factors), an index distribution is derived. Based on the index interval, corresponding
    probability judgments are derived for reference by managers and HRBPs in decision-making.


    Survey research finds that about 75% of enterprises nationwide have carried out
    HR management digital-intelligence operation activities, among which the execution
    degree of digital-intelligence transformation of HR management processes is the
    highest, accounting for about 60.81%. Digital-intelligence of HR management processes
    exempts enterprises from tedious bottom-up, layer-by-layer approval management
    actions, simplifies office processes, gives employees a more intelligent office
    environment, improves employee work satisfaction, and helps employees spend more
    time and energy on creating more value for the enterprise, as shown in Figure
    7-11.


    The execution of HR management decision digital-intelligence has also reached
    about 20%, possessing a late-mover advantage. Realizing management decision digital-intelligence
    based on data-driven intelligent results is a necessary path for enterprise HR
    digital-intelligence development. Enterprises can use AI to build a platform without
    organizational boundaries, connect data resources of all parties on the platform,
    and through resource aggregation and continuous innovation, continuously provide
    deep scientific management insights for the enterprise, continuously optimize
    management decisions, and thereby improve the enterprise''s core competitiveness.
    Currently, management decision digital-intelligence has realized humans making
    judgments based on machine results and taking management actions. In this complex
    process, enterprises will inevitably face many problems and challenges. For example,
    human-machine collaboration and symbiosis issues, human trust in machines and
    machine-generated results, interpretability of data-driven results, etc. In the
    process of solving the above problems, enterprises can also achieve more humanized
    HR management digital-intelligence and create a healthier enterprise environment.


    ![](img/cutq_201_33191_l.jpg)

    *Figure 7-11 Work Carried Out by Enterprises in HR Digital-Intelligence Operations*


    # HRBP+AI


    The AI-empowered HRBP has obvious competitive advantages in the following aspects.


    ## One Chart in Hand: AI Executive Empowers HRBP


    HRBPs utilize visualization tools—dashboards and boards—armed with AI and big
    data technologies, realizing "one chart in hand, panoramic view of talents, and
    digital-intelligence operation of HR," able to "view organization, view talents,
    view mobility, view labor efficiency, view costs" anytime, anywhere.


    NetDragon Websoft is one of the earlier companies to apply AI in the HR field.
    To improve management effectiveness, NetDragon introduced an "AI Executive" mechanism
    to empower HRBPs. The division of labor between "AI Executive" and HRBP in actual
    work is as follows: "AI Executive" is mainly responsible for automatically approving
    processes that comply with rules based on company-level management rules, and
    penalizing behaviors that violate rules; HRBPs focus on the parts of management
    that need to reflect "humanity and humanism," while using mechanisms to correct
    unreasonable rules, phenomena, and behaviors to form a virtuous cycle. So, how
    does "AI Executive" empower HRBPs?


    First, it frees HRBPs from procedural, repetitive work, allowing them to focus
    energy on more important work, such as culture building, experience enhancement,
    and organizational empowerment. "AI Executive" can realize automatic approval.
    Take leave as an example: generally, employee leave requires superior approval;
    now they only need to submit to "AI Executive," and if the leave reason complies
    with regulations, it can be automatically approved. "AI Executive" will notify
    the employee''s superior of the leave situation. For promotion applications with
    clear threshold requirements, "AI Executive" can conduct a round of approval first;
    for personnel transfers with clear basic rules, "AI Executive" can also make judgments
    in advance. "AI Executive" can also issue work tasks, supervise, punish, warn,
    and praise employees in the identity of an enterprise manager. "AI Executive"
    can see the completion status of various company documents and push some data
    to managers to prompt organizational and business problems.


    Second, the data and behaviors recorded by "AI Executive" provide a basis for
    HRBPs'' personalized management. Take promotion assessment as an example: the
    company has two promotion seasons every year. Previously, HRBPs communicated with
    business superiors, sorted out department personnel situations, and recommended
    promotion candidates; now "AI Executive" recommends whether to apply for promotion
    to managers based on current performance data, historical performance data, tenure,
    and the gap between current salary and the current salary framework of existing
    department personnel. "AI Executive" also directly generates several reports,
    summarizing a recommendation model based on recommended scores. When HRBPs get
    this data, they can directly communicate with business departments. "AI Executive"
    can also help HRBPs conduct talent inventory, making relatively clear inventory
    based on absolute data such as performance level, management behavior assessment
    data, 360-feedback data, and various learning data. In the past, the company needed
    to manually collect evaluation reports from different dimensions; now multi-dimensional
    data capture can be done by machines, and the system automatically generates opinions
    and reports of corresponding templates.


    ## Empowering Organizations


    Baidu''s AI Brain advocates "Open Empowerment," Alibaba emphasizes "Empowering
    Merchants and SMEs," Tencent''s view is "Connect Everything, Empower People,"
    JD.com wants "Retail Empowerment," Xiaomi wants Smart Manufacturing to "Empower
    Everything," Huawei wants "Digital Empowerment"… These large enterprises tirelessly
    emphasize the power of empowerment. So what is the definition of empowerment?
    "Empowerment" originally stems from "empower" in management science, used in conjunction
    with authorization. It is now mostly understood as "empowering energy or empowering
    capabilities." Extended to the enterprise interior, it means the enterprise releases
    power from top to bottom, especially the right of employees to work autonomously,
    driving organizational flatness through decentralization, and maximizing the release
    of individual talent and potential. Future organizations must have operations
    that transcend tradition, able to react more quickly to complex and changing external
    environments, and able to continuously stimulate the intrinsic motivation of elite
    employees and continuously empower them in work.


    The enterprise''s decision-making layer (CXO) represents the company. Empowering
    the organization means providing insights to the decision-making layer. Political
    Commissars or HRBPs also need suitable tools to escort the organization. Baidu
    Talent Think Tank illustrates how HRBPs use AI and big data technologies to empower
    the organization and empower the executive layer.


