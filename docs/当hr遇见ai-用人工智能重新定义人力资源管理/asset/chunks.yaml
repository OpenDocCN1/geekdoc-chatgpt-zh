    Baidu Talent Intelligence Center (TIC) is an intelligent talent management system.
    Based on massive data, it provides a complete intelligent talent management solution
    through precise machine learning and algorithms. It primarily acts on three major
    aspects: talent, organization, and culture. It contains six functional modules:
    "Smart Risk Control," "Smart Retention & Resignation," "Smart Culture," "Smart
    Talent Selection," "Smart Organization," and "Smart People," as shown in Figure
    7-12.


    In terms of talent, the Baidu Talent Intelligence Center can greatly improve recruitment
    efficiency, scientifically identify outstanding managers and talent potential,
    predict employee resignation tendencies and post-resignation impact, and provide
    intelligent support for targeted talent acquisition, development, and retention.
    In terms of organization, it can scientifically assess organizational stability
    by analyzing departmental vitality and talent structure, reveal talent flow patterns
    between organizations, and provide intelligent support for organizational optimization
    and adjustment, efficient talent incentives, and talent flow promotion. In terms
    of culture, it can promptly present internal and external public opinion hotspots,
    intelligently analyze external talent market conditions, provide intelligent support
    for managers to enhance corporate reputation, boost employee morale, and conduct
    talent reserves in advance. The Baidu Talent Intelligence Center truly realizes
    data-driven decision-making, assists executive judgment, and enables Baidu to
    maintain strong industry competitiveness in the high-tech industry where talent
    flows rapidly and competition is fierce.


    ![](img/cutq_204_47161_l.jpg)


    Figure 7-12 Baidu Talent Intelligence Center Product Functions


    ### Empowering Managers


    In the digital era, employees are increasingly difficult to "manage"; they tend
    more toward personalization and self-development, and team managers face tremendous
    challenges. In actual work, management efficiency will increase by 30%–50% with
    the aid of an intelligent workbench. Taking China Minsheng Bank''s new-generation
    HR digital platform "HR Box" as an example, Minsheng Bank utilized the team view,
    human capital analysis, HR operations, service window, and other functions of
    this "magic box" to achieve comprehensive empowerment for the management team,
    team managers, `HR` line managers, and general employees. It realized the enhancement
    of organizational value, talent value, talent supply chain, and basic HR management,
    as shown in Figure 7-13.


    With continuous breakthroughs in digital technology, the banking industry has
    entered an era of competition. The HR management of various banks needs to respond
    rapidly to numerous challenges such as talent disruption, business disruption,
    and experience disruption. Under such circumstances, Minsheng Bank''s HR Department,
    centered on the customer, used digital technical means to participate in the forward-looking
    layout of the headquarters'' transformation, helping the executive team gain insights
    into the environment, competitors, themselves, talent, and the future.


    ![](img/image_205_0_l.jpg)


    Figure 7-13 "HR Box" Product Functions


    Minsheng Bank''s HR Department applied the human capital analysis model, adhering
    to the principles of "user-centric, value-driven, model-supported" to build a
    human capital analysis platform. It built management cockpits for the management
    team, HR lines, and managers at all levels, extending to form multi-dimensional
    application scenarios such as "Head Office Department View," "Branch Department
    View," and "Sub-branch View." It provides human capital analysis dashboards, automated
    reports, team and employee analysis reports such as "Fundamentals," "Human Capital
    DNA," "Department Portrait," and "Talent Portrait," becoming the quantitative
    management online entry point for analyzing human capital information and exploring
    human capital issues, realizing intelligent human capital management where "data
    is visible, management is visible, talent is searchable." Minsheng Bank''s HR
    Department also explored the "agile organization" management model, implementing
    cross-departmental and cross-line seamless project-based collaboration, building
    a "trinity" employee work recording system, and matching management systems, rules,
    and policies to ensure these systems upgrade synchronously with changing needs,
    further improving performance culture, stimulating corporate vitality, and driving
    cultural transformation, truly empowering managers.


    ### Empowering Business


    Digital intelligence is an accelerator for business development. The integration
    of digital intelligence, digitalization, and intelligence can also be understood
    as "Digitalization + Intelligence," a higher stage based on digitalization. The
    underlying logic of the digital intelligence stage is as follows: **Generate Connections**:
    Interconnection of people, finance, materials, and affairs, such as human-machine,
    human-human, machine-machine, human-affair, affair-affair, machine-affair, human-finance,
    human-material, finance-material, material-affair, finance-affair, knowledge interconnection,
    etc.; **Precipitate Data**: Through the above interconnection of people, finance,
    materials, and affairs, raw data naturally leaves traces, is objective and effective,
    containing all structured and unstructured data, laying a good foundation for
    subsequent data cleaning, processing, storage, and analysis; **Data Intelligence**:
    Machine learning and big data technology make data analysis more realistic, clear,
    and intelligent. Models, algorithms, and computing power are the three most critical
    elements.


    The level of digital intelligence development in Chinese internet companies is
    relatively high, the scope is relatively comprehensive, and the technology is
    relatively mature; therefore, business development is also faster. However, overall,
    the level of digital intelligence in traditional industries is still in the initial
    stage. Although enterprises have been paying attention to digital transformation
    over the past many years, the sense of urgency for transformation and the execution
    of measures are not strong, the transformation path is not clear, and there is
    a greater lack of digital talent.


    Research found that across more than a dozen modules of enterprise management,
    different enterprises have conducted effective explorations in digital intelligence
    applications. For example, about 21% of enterprises have started digital intelligence
    applications in strategic management; about 34.5% in human resources; about 27.7%
    in financial management; specific proportions for administrative management, supply
    chain management, quality management, product R&D, and other fields are shown
    in Figure 7-14.


    Although about 20% of enterprises in various industries have begun to explore
    digital intelligence applications in different modules of enterprise management,
    the overall scale is still in the initial stage, and there is a long way to go
    in the future. This is related to the fact that the application practice of AI
    and big data technology in enterprises is still in the exploration or micro-application
    stage, and is also related to other factors such as cognitive level and talent
    shortage. Among them, the research involving the "Human Resources" management
    module found that enterprises entering the digital intelligence stage, in the
    informatization stage, and not yet in the informatization stage in HR management
    each account for about one-third, described in detail as follows:


    - About 34.5% of enterprises have entered the digital intelligence stage in HR
    management to varying degrees, far higher than other management modules;


    ![](img/cutq_207_54161_l.jpg)


    As shown in Figure 7-14 Stages of Digital Intelligence in HR Functional Modules


    - About 33.1% of enterprises are very backward in the degree of HR management
    digital intelligence, respectively in offline operation or online stages, mostly
    traditional enterprises, the deep reasons need further exploration;

    - About 32.4% of enterprises are in the HR management informatization stage; they
    are the main force of digital transformation.


    These data indicate that in the direction of HR management digital intelligence:
    first, enterprises still need to learn and improve at the cognitive level, and
    there is a longer way to go at the practical level; second, more people have begun
    to recognize the importance and urgency of digital transformation and have taken
    action; third, HR can take the lead in digital transformation, do a good job in
    organizational guarantee, talent reserve, and cultural atmosphere building, empowering
    business transformation and rapid development.


    ### IV. Two Pillars


    In the era of AI and big data, enterprise development and organizational forms
    vary widely, and HR managers need to continuously iterate with changes in organizational
    development. To adapt to business changes and requirements, some enterprises have
    gradually transitioned from three pillars to two pillars, i.e., the front end
    remains `HRBP`, responding to and handling various employee demands, while the
    back end `HRCOE` and `HRSSC` collaborate closely to jointly provide solutions
    for `HRBP`. The two pillars are also called the "Bench Model," as shown in Figure
    7-15.


    ![](img/cutq_208_0130_m.jpg)


    Figure 7-15 Schematic Diagram of Two-Pillar Model


    The two pillars are suitable for organizations with rapid business development
    and innovation, which requires the enterprise''s HR digital construction to reach
    a certain level—one platform, one mobile phone can handle various problems and
    process all affairs.


    ### V. Four Pillars


    The four pillars refer to an additional pillar on the basis of the three pillars,
    namely the Project Management Office (Project Management-4Office, `PMO`) or People
    Analytics (`PA`). The schematic diagram of the four-pillar model is shown in Figure
    7-16.


    ![](img/cutq_209_6526_m.jpg)


    Figure 7-16 Schematic Diagram of Four-Pillar Model


    Process-driven enterprises contain many projects, such as talent standards, talent
    selection, talent inventory, organizational scanning, etc. Various problems arise
    during project promotion, at which point the `PMO` is needed to coordinate, integrate,
    and promote effective project execution and implementation. The `PMO` is the core
    department for improving organizational management maturity.


    Data-driven enterprises will set up a dedicated `PA` department, which is regarded
    as the "Future of HR Work." In the future, people analytics will not only be part
    of HR work but will become a key part of the entire enterprise''s organizational
    analysis. Typical representatives of enterprises setting up `PA` departments are
    Google''s "Project Oxygen" and Baidu''s "Talent Intelligence Center."


    Whether three pillars, two pillars, or four pillars, they are all aimed at realizing
    HR strategy and business transformation and development, especially the two pillars,
    which are the inevitable result driven by `AI` and big data technology.


    ## Section 2: How AI Drives Shared Service Centers


    The application of AI in HR Shared Service Centers (`HRSSC`) is already very common.
    Since Baidu''s practice started relatively early, the following takes Baidu as
    an example to discuss various new technologies and practices of AI in `HRSSC`.


    ### I. Business Background


    Around 2010, Baidu operated the "three-horse carriage" of `SDC`, `HRCOE`, `HRBP`,
    among which the Shared Delivery Center (Service Delivery Center, `SDC`) went through
    stages from 1.0 to 3.0. Baidu calls the 3.0 stage the "`Smart HR`" stage. This
    stage aims to manage organizational change and talent development using more interactive
    systems, utilizing big data prediction, control, and analysis functions, with
    a focus on efficiency and control. Baidu started "exerting efforts" in this stage
    from 2014. By 2017, Baidu had begun transitioning from the "`Smart HR`" stage
    to the "`Intelligent HR`" stage, i.e., moving towards stages 3.5 or even 4.0.
    During this transition period, in pursuit of better employee experience, organizational
    vitality, and cultural empowerment, Baidu abandoned traditional processes and
    chose digital transformation processes, as shown in Figure 7-17.


    ![](img/cutq_210_14314_l.jpg)


    Figure 7-17 Areas of AI Application in Baidu''s HR Management Work


    ### II. Application of New Technologies


    #### 1. Recruitment Field — Intelligent Resume-Job Matching


    Business-driven and technology-oriented approaches have changed the way recruitment
    works. Baidu''s HR managers attach great importance to the application of AI in
    the recruitment field and the efficiency improvements it brings. Through Natural
    Language Processing (`NLP`) and machine learning on the talent resume database,
    building algorithms and models, they solved the difficult problem of intelligent
    matching between resumes and job descriptions. The following two tools will help
    HR recruitment specialists improve operational efficiency.


    ##### (1) Searching for Him in the Crowd (Zhong Li Xun Ta)


    This is an intelligent resume screening system built by Baidu for the recruitment
    team. The system identifies job descriptions issued by the recruitment team and
    precisely matches resumes in the talent pool that meet the requirements. The "precise
    matching" here is not literal matching, but a comprehensive consideration combining
    the potential candidate''s relevant background, work experience, project experience,
    etc., conducting big data algorithm analysis and "matching." Optimizing the resume
    screening process allows the recruitment team to focus more on evaluating candidates
    and put more energy into the interview process.


    ##### (2) Retrieving Lost Treasures from the Vast Sea (Cang Hai Shi Yi)


    This is a job matching system built by Baidu for candidates to help them improve
    application efficiency. When candidates search for jobs, the system proactively
    recommends suitable jobs based on their resumes, reducing the time candidates
    spend browsing job descriptions and preventing them from missing suitable positions.


    #### 2. Onboarding Process — Automation Achieved Through Combination of Technologies


    ##### (1) OCR Technology


    `OCR` technology refers to the technology of converting text from various certificates,
    bills, newspapers, books, manuscripts, and other printed materials into image
    information through optical input methods such as scanning, and then converting
    the image information into computer-inputtable information using text recognition
    technology. In the past two years, this technology has been gradually applied
    to the HR field. Enterprises can combine it with the verification of new employees''
    identity-related information in the onboarding process. Before new employees join,
    the enterprise can require them to upload copies of degree certificates, qualification
    certificates, ID cards, bank cards, etc., to the system, use `OCR` technology
    to recognize the information, and simultaneously connect to third-party credit
    platforms such as the China Higher Education Student Information and Career Center
    (CHESICC), so that the verification of employees'' educational information can
    be completed quickly.


    ##### (2) Facial Recognition Technology


    Baidu''s facial recognition technology is relatively mature. Internal application
    scenarios include access control facial recognition, meeting check-in, internal
    shopping, etc. Of course, facial recognition technology is also applied to other
    scenarios, such as self-service certificate printing, where employees can swipe
    their work card or use facial recognition. Another example: in the process of
    new employees handling entry procedures, facial recognition technology combined
    with the visitor system can not only be used for new employees to make advance
    appointments for reporting but also enhance the new employees'' onboarding experience
    and processing efficiency.


    ##### (3) Appointment System — End-to-End Automation


    New employees with appointments will receive corresponding backend appointment
    codes. While sending the appointment code, Baidu can also push onboarding guides
    and company news updates. After arriving at the company, employees can present
    the appointment code and go directly to the location for handling relevant procedures
    according to the onboarding guide. In addition, since new employee onboarding
    work is often concentrated, for ease of management, the new employees'' appointment
    codes have been matched with the seat numbers at the venue for handling entry
    procedures, and an "Onboarding Gift Pack" is placed on the seat, including the
    new employee''s computer, office supplies, documents to be signed, etc., facilitating
    the new employee''s search.


    This series of work connects candidates with the feedback system and the onboarding
    system, realizing end-to-end automation, and the new employees'' favorability
    towards the company has been greatly improved.


    #### 3. Online Learning System — AI Empowerment


    ##### (1) Baidu Academy''s New Product — Lingting


    One of the pain points of training specialists is spending a lot of time and energy
    on some repetitive simple tasks, such as adding subtitles to video courses. The
    purpose of adding subtitles to training videos is to enable students to understand
    the course content more accurately and quickly during the learning process. However,
    behind the task of adding subtitles, training specialists need to invest a lot
    of time and energy. Training specialists first need to record the text spoken
    by the lecturer, then proofread and correct errors, then format lines according
    to video production requirements, and finally ask video producers to synthesize
    subtitles with the video. The whole process requires coordination of several trades
    and takes several working days. To solve this problem, Baidu used `AI` technology
    to create the Lingting platform. After the training specialist uploads any video
    to the Lingting platform, the system can automatically recognize subtitles based
    on speech and add them directly to the video. The training specialist only needs
    to slightly modify individual inaccurately recognized parts to obtain a video
    with subtitles added. One person spending only a few minutes can complete work
    that previously took several people several days.


    ##### (2) Baidu Tingqing


    While the speaker is talking, Baidu can output Chinese and English subtitles in
    real-time using speech recognition and translation technology. This technology,
    named "Baidu Tingqing," has been applied to Baidu''s internal live streaming platform.


    ### III. Application and Thinking of Big Data


    #### 1. The "Bottom Line" of Big Data


    Content involving personal privacy, such as email content, private communication
    content, etc., must absolutely not be used for personality analysis.


    #### 2. The Foundation of Big Data


    First, data from various modules of the HR department should be "interconnected,"
    not fighting alone. Integrating HR data is the first step in big data analysis.
    Second, we must do a good job of "connecting" with data from other departments
    such as finance and sales.


    #### 3. Handling Data Security Issues


    Data security is a problem every enterprise must face and handle. The key lies
    in division of labor. Personnel responsible for drawing system interfaces, connecting
    data, etc., should jointly discuss and define boundaries, determining access levels
    and their permissions.


    #### 4. The Essence of New Technologies Is Still Big Data


    New technologies such as facial recognition and speech recognition are merely
    means, tools, or platforms. In the initial stage, big data is still driving behind
    them. Therefore, the progress of these technologies ultimately relies on the precipitation,
    sorting, and iteration of big data.


    ## Section 3: How AI Empowers HRCOE


    In this section, we also look at how AI empowers `HRCOE` through the introduction
    of the "Baidu Talent Intelligence Center (`TIC`)" case.


    Baidu practices the talent management philosophy of "letting outstanding talent
    stand out" from the three aspects of talent, organization, and culture with more
    quantitative and objective means. The Baidu Talent Intelligence Center contains
    six functional modules: "Smart Management," "Smart Talent Selection," and "Smart
    People," etc., specifically as shown in Figure 7-18.


    - Talent aspect. `TIC` can greatly improve recruitment efficiency, efficiently
    identify outstanding managers and high-potential talents, predict employee resignation
    tendencies and the impact of resignation, and provide intelligent support for
    talent acquisition, development, and retention.

    - Organization aspect. `TIC` can scientifically assess organizational stability
    by analyzing departmental vitality and talent structure, reveal the laws of talent
    flow between organizations, and provide intelligent support for organizational
    optimization and adjustment, efficient talent incentives, and talent flow promotion.

    - Culture aspect. `TIC` can promptly present internal and external public opinion
    hotspots, analyze external talent market conditions, enhance corporate reputation,
    boost employee morale, and provide intelligent support for enterprises to conduct
    talent reserves.


    ![](img/cutq_215_24109_l.jpg)


    Figure 7-18 Baidu Talent Intelligence Center''s Support for Application Scenarios


    ### I. Organizational Talent Management Risk Index


    When facing new situations and new business challenges, how can an enterprise
    promote managers capable of handling high-risk positions from a large pool of
    managers? `TIC` proposed the concept of the Talent Management Risk Index. Through
    this index, enterprises can promptly identify the management complexity and difficulty
    faced by managers in various periods and compare the risk changes faced by different
    managers in their careers. For example, some managers are only competent in specific
    fields; once switched to other fields, their career development curves will show
    large fluctuations. Capable managers can smooth out turbulent curves in a relatively
    short time. The Talent Management Risk Index provides a convincing objective basis
    for enterprises to promote and appoint leaders.


    ### II. Personnel, Talent, and Figures (Key People)


    In the past, enterprises focused on "personnel," such as early manufacturing companies
    like Ford, emphasizing personnel''s organizational discipline; now, high-tech
    enterprises focus on "talent," emphasizing talent''s specialized skills and team
    collaboration abilities; in the future, enterprises will focus on "figures" (key
    people), requiring figures to possess outstanding leadership and innovation.


    How to tap and find "figures" is a major challenge for HR departments. `TIC` builds
    a quantitative model from five dimensions: core position in the company, business
    bridge, open communication, organizational framework, and extensive cooperation.
    Based on objective and real data and texts such as business emails and code written
    on the company platform, it scores employees.


    This establishes a growth "electronic file" for each employee. By calculating
    the employee''s business centrality index, it judges the possibility of them becoming
    a "figure," and can discover the employee''s strengths and weaknesses in these
    five dimensions, thereby giving appropriate appointments or targeted training.
    It should be noted that `TIC` deeply understands the importance of privacy protection
    for big data analysis. Any data used by `TIC` will undergo strict approval, encryption,
    and management to ensure it is not used for other purposes.


    ### III. Talent Trend Prediction


    By collecting internal and external enterprise data, including public opinion
    information and texts from social media and the internet, `TIC` established a
    90-day resignation prediction model containing hundreds of dynamic features including
    economy, career development, and personal family reasons, with a prediction accuracy
    of over 90%. For example, in a resignation prediction conducted by Baidu in 2015,
    `TIC` analyzed the top 30 employees with the highest resignation index. Within
    3 months, 29 of them submitted resignation applications to the HR department.
    `TIC` can also calculate how great an employee''s resignation influence is and
    analyze the various reasons for resignation. If an employee with a high resignation
    index is a scarce talent and the resignation reason is within the company''s controllable
    range, Baidu can intervene in a timely manner and take appropriate retention measures.


    # Chapter 8: Building a Smart HR Platform to Assist Business Transformation


    In the `VUCA` era, organizations have put forward very high requirements for HR
    management work, and have also put forward clear demands for HR system platforms,
    mainly reflected in the following aspects.


    - Break through system and data silos. Connect the "entry, exit, promotion, demotion,
    transfer, selection, use, cultivation, reserve, management" links, realize end-to-end
    connection of processes, upstream and downstream connection of systems, and efficient
    flow of data.

    - Establish and make good use of talent pools. Establish a global talent pool,
    form a talent map, and realize full life cycle management of talent.

    - Unify the HR system platform. Build a unified platform,归属 a unified entry, set
    different permissions, provide rich and easy-to-use tools for employees, managers,
    and `HRBP`, realize self-service, and improve work efficiency and user experience.

    - Data-driven. Build dashboards, boards, talent screens, etc., available for `HRBP`
    and managers, realize process intelligence, decision intelligence, and data early
    warning through talent portraits and organizational scanning.

    - Employee experience. Realize closed-loop management of the trinity of entry,
    on-the-job, and exit, provide full-scenario services, and enhance employee engagement.


    ## Section 1: Four-Stage Model and Iteration Path of HR Digital Intelligence


    In the past few decades, HR management work can be divided into four stages, as
    shown in Figure 8-1. In this process, HR informatization has also been developing
    forward with the continuous iteration of technology, also experiencing four stages,
    as shown in Figure 8-2.


    ![](img/cutq_219_38746_l.jpg)


    Figure 8-1 Four Development Stages of HR Management


    Readers can refer to the Four-Stage Model, contrast the different stages of their
    own enterprise''s HR management work development, think about the digital blueprint,
    find the path for rapid digital iteration, continuously explore and break through,
    and assist business development and transformation.


    ![](img/image_220_0_l.jpg)


    Figure 8-2 HR Informatization "Four-Stage Model"


