- raw: '产品思维是一种解决问题的综合思维，是把问题解决方案产品化的过程。


    人力资源管理的产品思维就是HR从业者在设计及实施选、用、育、留等解决方案时，深入挖掘用户需求，关注用户体验及场景化设计，快速迭代，持续不断地运营及优化，满足合规的要求。


    人力资源产品思维的特点如下：


    ●用户思维：把员工当成用户，让员工有参与感；


    ●痛点思维：找到用户真正的需求，尤其是在开展培训工作时帮他们建立需求；


    ●移动思维：将HR从业者的工作和移动工具相结合；


    ●场景思维：敏锐洞察用户的核心需求，将管理实践场景化，创造体验式的产品；


    ●迭代思维：产品实现模块化、组件化、微服务化，做到小步快跑、敏捷开发；


    ●数据思维：用数据说话、用数据赋能；


    ●生态思维：搭建一个“小闭环”生态体系，帮助员工实现自我调节；


    ●运营思维：传播品牌，提供持续服务。


    百度每年会录制大量的视频及音频课程，往常的做法是编辑后直接上传到平台，供员工学习。但是，部分用户习惯于看文字学习，如果用人工编辑字幕或音频转文字，就会耗费用户大量的时间。百度经过大量访谈、调研与数据分析，以及多轮迭代设计，开发出了一款AI产品——百度灵听。它可以实现视频自动加字幕及音频转文字等功能，如果部分转化不够准确，员工还可以按时间轴作简单调整。


    随着国际化进程的加快，阿里巴巴公司海外员工的比重越来越高，阿里巴巴公司进行了海外版HRSSC的迭代优化。为了保证灵活配置，阿里EHR团队对HRSSC领域的工作和事务管理进行了建模，重新定义流程及办理节点，设置了流转规则，以确保数据安全。阿里的HRSSC打通了IT、核心人事、商保、Payroll等多个系统，根据海外员工所在地福利、层级、部门、国家等因素，为每个员工适配个性化申请单列表，海外员工可实时追踪办理进度，体验一站式HR服务体系。


    腾讯公司的人力资源部在2012年做过一个分析：进入公司满三年的新员工的流失率是普通员工的三倍。经过深入挖掘，HR从业者发现员工离职的核心原因是住房困难。于是，腾讯推出了“安居计划”，即公司拿出一笔基金，免息提供给符合条件的员工。从此，员工流失率大幅下降。


    □ 流程智能


    在信息化时代，企业在不同的发展阶段构建了很多信息系统，HR从业者通过固化业务流程帮助企业实现了业务的快速发展与复制。如今随着数字化时代的到来，业务规模不断扩张、组织不断发生裂变，企业对人力资源管理系统的要求越来越高，不仅要实现“入离升降调、选用预留管”的全面数字化，还要实现员工体验的全方位提升。因此，流程再造与流程运营管理的问题也日渐突显。


    流程的智能化是指人力资源管理的数据记录、处理和分析的过程，便于人力资源管理团队更高效、便捷地使用人力资源数据。流程智能化的主要技术包含OCR图像识别、语音识别、文本解析、计算机视觉等。其中，OCR技术可以协助HR从业者进行智能报销，语音识别技术可以协助记录会议，文本解析可以实现自动化简历解析，计算机视觉可以协助HR从业者开展刷脸考勤等身份验证功能。这些都可以提高人力管理的效率和员工工作的效率，将人力资源团队从繁杂的行政性事务中解脱出来，让HR从业者把时间和精力用在更重要、更有创造力的事情上。


    下面以HRSSC自助服务为例说明企业如何实现流程智能化，如图7-6所示。


    HRSSC要实现一站式、高效的服务体验，需要大力推进自助服务的在线化、自动化、智能化。这个目标可以通过“三步走”来实现。第一步，创建知识库：将人力资源各个模块的机制规范、知识要点、遇到的问题等进行梳理归档，做到结构化、标签化，可供员工随时检索、查看；同时定期更新、丰富知识库。第二步，开发智能客服助手，实现向导式问答、辅助问答、主动建议、个性化推荐等功能。第三步，打造“虚拟助手”，“虚拟助手”就像真人一样可以与员工对话交互，实现7×24小时全天候服务，这一步就应用到了自然语言处理、深度学习、大数据分析、机器人流程自动化（RPA）技术等。百度HRSSC的服务机器人自助效率可达70%以上，不仅实现了客服流程的自动化、智能化，保障了回复的连贯性和高质量，而且极大地提升了员工体验和用户满意度。


    ![](Images/cutq_192_52403_l.jpg)


    图7-6　HRSSC服务自助效率模型


    2.HRCOE+AI


    经过AI赋能的HRCOE，在如下方面具有明显的竞争优势。


    □ 人才画像


    调研发现，人力资源管理的核心痛点是在人才发展方向上。例如，人才画像约占55%、招聘模块约占62%、人才培养与发展模块约占59%、人力资源规划模块约占57%、人效评估模块约占57%。同时，组织创新约占43%、组织战略约占42%、敬业度洞察约占41%，已成为突出痛点。企业领导力约占33%、组织稳定性约占32%、组织文化约占30%，紧随其后也逐步成为企业转型与发展的“拦路虎”。人力资源管理的核心痛点柱状图如图7-7所示。


    ![](Images/cutq_193_0369_l.jpg)


    图7-7　人力资源管理的核心痛点


    平安HR-X结合企业人才数据，利用人工智能及大数据等技术创新性地设计了岗位画像、员工（干部）画像，通过智能化标签设置，沉淀全时、全貌、全量数据，辅助制定选人用人决策。HR-X团队利用大数据、智慧模型，以最全面、科学的方法为员工建立了一套全景档案，如绩效画像、技能画像、意愿和性格画像、薪酬画像、业绩和团队画像等，并通过智能模型匹配人员与岗位需求，结合AI面试测评，打通了招聘、绩效、培训、薪酬等多个人力资源管理场景，让团队管理更加精准、全面、高效。


    在干部画像中，丰富的标签与智能模型将会运用在识人、评人、用人、队伍建设等多个场景中：


    ●集成人员信息——一步到位集成绩效、工作经历、测评等信息，发挥聚合效应；


    ●全员动态对比——对比团队绩效、工作表现，使动态趋势一目了然；


    ●精准岗位需求——应用于内部推荐、AI面试、绩效建议、培训管理等各种场景；


    ●精准人岗匹配——精准开展人员与岗位匹配，让晋升、调薪不再困难；


    ●关系圈分析——展现校友、前同事等多维关系，加强了对人员的风险管控；


    ●标签搜索——让人才调配更加方便，轻松集合专业人才和行业精英；


    ●智能培训——能够根据用户的长短板进行智能推课，有针对性地提升员工能力；


    ●绩差预警——及早发现业绩短板，及早采取措施，提升员工绩效，确保团队战斗力；


    ●离职预警——及时捕捉员工异常行为，提示离职特征。


    深度运用人才画像可以实现“以人荐岗”“以模型找人”“以人找人”“从组织需求出发找人”，这些更灵活的画像应用玩法可以帮助组织寻找与团队有极高匹配度的人才。


    □ 组织扫描


    企业管理者需要人力资源部通过系统提醒或看板展示及时告知，组织架构的变化有哪些，人才地图分布在哪里，如何排兵布阵，我们需要的关键人才在哪里，哪些员工最有潜力，哪些人才是组织中的“承重墙”，哪些是将才，哪些是帅才，等等。只有解决了如下“四度”，才能真正实现以人才驱动组织战略的发展。


    ●加速新技术应用带来的业务进步（速度）


    ●扩展数据分析的点、线、面、体场景（广度）


    ●发现传统数据分析洞察不了的事情（深度）


    ●促进组织效能得到充分发挥，带动企业绩效不断提升（高度）


    在当前阶段，企业逐步由数字化阶段向数智化阶段过渡，在转型的过程中，战略执行与组织建设仍是关键因素。企业要想在行业竞争中取得优势，通过AI洞察组织、发现人才、驱动组织绩效增长才是关键。有调研发现，我国有约70%的企业已经开始了数智化进程，并逐渐形成趋势，具体情况是：约36.49%的企业已处在开始探索应用阶段；约24.32%的企业开始进入部分模块推广应用阶段；约8.11%的企业开始进入全模块系统全面落地阶段，如图7-8所示。


    ![](Images/cutq_195_7398_l.jpg)


    图7-8　我国企业数智化应用现状


    企业利用AI与大数据技术对组织进行全方位扫描，使组织与战略相匹配，搭建科学的组织架构，关注真实的绩效改善情况，通过数据的收集、整理、建模、分析、应用使数据真正发挥价值，赋能企业数智化建设。组织扫描可以从组织管理和绩效激励机制两个层面进行。


    组织管理包含组织结构设计、岗位体系设计、流程管控。组织管理的核心目标是组织效能提升。组织希望变得更加敏捷高效，能够输出更多的价值，获得更高的利润，并实现可持续发展。组织效能可以分为管理效能、员工效能与组织活力。对人力资源而言，管理效能主要是看组织流程优化，企业管理者可以通过组织计算机断层扫描（Computed
    Tomography，CT）判断管理幅度、审批节点等是否合理，过高或过低都会影响组织健康度。例如，京东的“8150”原则，“1”是指每个管理者，“8”是指京东要求每个管理者直接汇报的下属不得低于8个人，如果不到8个人，就要减少中间层级的管理者；只有向一个管理者直接汇报的下属超过15人时，京东才允许在同一个管理层级增加一个管理者；“50”则是指每个管理者管理的同一工种的基层员工不能低于50个人，只有超过50个人时，才可以考虑设立第二个团队管理者。“8150”原则的核心是保证组织扁平化，确保组织效能。再如，百度核心人事流程审批的“2+2”原则，也就是两级业务部门主管审批业务合理性，两级HRBP负责政策把关，这样做既确保了高效，又避免了风险。通过AI搭建模型而建立的组织扫描工具，可以随时发现系统中不符合“8150”“2+2”原则的情况，然后预警信息系统会通知到管理者与HRBP。管理者与HRBP可以选择两个按钮：一个按钮是“接受”，系统会自动按照规则校正处理；另一个按钮是“人工干预”，系统会提示给出原则上最长一个月的人工处理时间，必须在日期内完成，否则系统将会自动做出处理。随着业务的不断发展，管理场景的不断变化，组织扫描的模型也会不断迭代优化，以确保组织效能持续增长。


    绩效激励机制包含绩效管理、薪酬福利、中长期激励等，AI重塑了这些流程，员工的工作表现与行为数据被合规地整合到数据库中。HR从业者对这些表现与数据进行分析处理，通过建立评级模型将员工工作表现的评估结果通过在线的方式反馈给每位员工。对某些不足之处，组织扫描工具还会给出有针对性的建议。组织扫描工具也可以给出员工绩效结果应用的建议，针对每个员工的历史数据甄别各自不同的保健因素类型和激励因素类型，从而匹配几十种方案，真正实现了绩效激励配比的“千人千面”，充分激发了员工的工作热情。甚至，组织扫描工具还可以用于预测员工绩效，给管理者排兵布阵提供决策依据。


    □ 预警预测


    人力资源管理系统要能够反映企业的人力资源业务需求，并驱动业务向前发展，预警预测的智能化产品也是一样。下面以百度的人力资源管理系统为例进行说明。


    百度的人才观是“招最好的人，给最大的空间，看最后的结果，让优秀人才脱颖而出”，如图7-9所示。


    ![](Images/cutq_197_20381_l.jpg)


    图7-9　百度人才观


    招最好的人。最好的人具备以下三个特点。第一，跟百度崇尚的“简单可依赖”文化相匹配。当这个人跟公司的文化非常匹配时，公司的内部沟通成本、磨合成本就会大幅降低。第二，优秀的学习能力，这对互联网企业来说非常重要。企业每天面临的市场环境、竞争对手格局都会发生天翻地覆的变化，企业使用一个人，用的不仅是他经验上的优势，更是他对未来新环境的快速认知、理解和应对的能力。第三，胜任本职工作和岗位要求，这是最基本的要求。公司需要营造一个永远不断上进和自驱的组织，自驱的人不仅愿意学习，而且能够快速学习、不断提升自己。


    给最大的空间。这里所说的空间不仅是舒适的办公环境，更重要的是给员工一种使命感、理想和技术平衡。百度最大的空间是前沿的核心技术。


    看最后的结果。百度是一家以结果为导向的公司，不论员工的资历、年限如何，一律以结果说话。百度强调的就是差异化的文化。


    让优秀人才脱颖而出。2012年百度陆续出台了多项人才激励政策和机制，再次焕发了百度人才的自驱力和差异化，通过“up or out”两张内部名单（潜力股及淘汰名单）、初级岗位三年升二级、文化360度考核、设置专门的绩优奖等差异化的管理方式，让人才脱颖而出。


    相应地，在设计业务架构、产品架构时，企业管理者要充分考虑人力资源的业务需求与管理要求，梳理流程、厘清权责、建好基座、联通系统、拉通数据、提升体验，结合最新前沿技术（如人工智能、区块链、云计算、大数据、物联网、移动化、3D打印）打造数智化产品，为决策者、管理者、员工与人力资源专业用户提供赋能工具，支持业务数字化转型。例如，企业在招聘策略上选择“招最好/最合适的人”，在做产品设计时，需要考虑的要素是招聘的全周期管理、统一的人才库、人岗智能互相推荐、面试/笔试机器人、智能入职/客服、智能分析看板等；在考虑“运营管理”方面要求全程数字化，产品设计要点是无人值守一站式服务、灵活排班、无感考勤、入离升降调全程数字化、组织CT、人才CT、人才全景档案等；在“人才学习与发展”方面，注重员工在工作中的学习与成长，设计要点是数字化的自助培训、融入工作的学习成长地图、AR、VR、混合现实（Mixed
    Reality，MR）、游戏化、个性化推荐、千人千面、知识图谱、全景看板等；在“人才保留”方面，注重让优秀人才脱颖而出，设计要点是人才异动情况预警、组织活力分析、人才健康度预警、薪酬激励一站式工作台、舆情分析与预警等，如图7-10所示。


    ![](Images/cutq_199_265_l.jpg)


    图7-10　人力资源数智化场景


    □ 决策智能化


    人力资源管理的决策智能化则是协助人力资源管理团队做出更好的决策，从数据的角度发现和分析问题，并提供定量的参考。主要技术包含自然语言处理、知识图谱、组织网络分析等。其中，自然语言处理可以实现智能人岗匹配，知识图谱相关技术可以结合深度学习算法对员工的离职和绩效进行预测，组织网络分析则可以定量地进行领导力评估。这些智能化决策在人力资源数智化出现之前是难以实现的。现在基于这些技术，人力资源数智化可以提高决策的效率和准确性，并提供定量的分析支持。


    当然，利用大数据技术与思维方式对人力资源管理的小数据进行预警预测分析时，并不是在相关关系的基础上直接做出决策，而是综合所有数据、因素（不仅是人力资源领域的数据或因素，还包括财务、经营、办公OA、IT、外部环境等数据或因素）进行建模、相关性分析之后得出指数分布，根据指数区间得出相应的可能性判断，供管理者与HRBP决策时参考。


    有调查研究发现，全国有约75%的企业已开展人力资源管理数智化运营活动，其中对人力资源管理流程进行数智化转型的执行程度最高，占比约为60.81%。人力资源管理流程的数智化使得企业免去了自下而上、层层审批的烦琐管理动作，简化了办公流程，使员工拥有更加智能的办公环境，提高了员工的工作满意度，有助于员工将更多的时间与精力花在为企业创造更多的价值上，如图7-11所示。


    人力资源管理决策数智化的执行也达到了约20%，具备后发优势。基于数据驱动的智能结果实现管理决策数智化是企业进行人力资源数智化发展的必经之路，企业可以利用人工智能构建无组织边界的平台，打通平台上各方的数据资源，通过资源汇聚与持续创新，不断为企业提供深度科学的管理洞察，持续优化管理决策，进而提高企业的核心竞争力。目前，管理决策的数智化已经实现了人根据机器结果进行判断并做出管理动作。在这个复杂的过程中，企业必然会面临许多问题与挑战。例如，人机协作与人机共生的问题，人对机器以及机器产生的结果的信任问题，数据驱动结果的可解释性问题，等等。在解决以上问题的过程中，企业也可以实现更加人性化的人力资源管理数智化，创建更健康的企业环境。


    ![](Images/cutq_201_33191_l.jpg)


    图7-11　企业在人力资源数智化运营中已开展的工作


    3.HRBP+AI


    经过AI赋能的HRBP，在如下方面具有明显的竞争优势。


    □ 一图在手


    HRBP利用人工智能、大数据技术武装的可视化工具——仪表盘与看板，实现了一图在手、人才全景尽在掌握及人力资源数字化运营，可以做到随时随地“看组织、看人才、看异动、看人效、看成本”。


    网龙网络公司是将AI应用在人力资源领域较早的公司之一。为了提升管理效能，网龙网络引入了“AI高管”机制来赋能HRBP。“AI高管”与HRBP在实际工作中的分工如下：“AI高管”主要负责基于公司层面的管理规则，自动审批符合规则的流程，处罚不符合规则的行为；HRBP则专注在管理中需要体现“人性和人文”的部分，同时利用机制对不合理的规则、现象、行为进行纠偏以形成良性循环。那么，“AI高管”如何为HRBP赋能呢？


    首先，让HRBP从程序化、重复性的工作中解放出来，把精力用于更重要的工作，如文化建设、体验感提升、赋能组织等。“AI高管”可以实现自动审批。以请假为例，一般员工请假需要上级审批，现在只需提交给“AI高管”，只要请假理由符合规定就可以自动审批，“AI高管”会发给员工的上级领导告知员工的请假情况。对于有清晰门槛要求的晋升提报，“AI高管”可以先进行一轮审批；对于有明确基本规则的人事岗位异动，“AI高管”也可以预先做出判断。“AI高管”还可以以企业管理者的身份对员工进行工作任务下达及督办、惩罚、警告、表扬等。“AI高管”可以看到公司各类单据的完成情况，并把一些数据推送给管理者以提示其组织、业务存在的问题。


    其次，“AI高管”记录的数据和行为为HRBP提供了个性化管理的依据。以晋升考核为例，公司每年有两个晋升季，以前是HRBP与业务上级进行沟通，梳理部门人员的情况，推荐晋升人员；现在则是“AI高管”基于部门现有人员在现有绩效数据、历史绩效数据、任职时间以及目前薪酬与当前薪酬框架的差距，向管理者推荐是否提报晋升。“AI高管”也会直接生成若干报表，基于推荐的分数总结一个推荐模型，当HRBP拿到这些数据时，就可以直接和业务部门沟通了。“AI高管”还可以帮助HRBP进行人才盘点，基于绝对数据如绩效水平、管理行为测评数据、360反馈数据以及各种学习类数据等做出相对明确的盘点。以往，公司需要通过人工收集不同维度的评价报告，现在通过机器即可进行多维度的数据抓取，系统自动生成相应模板的意见和报告。


    □ 赋能组织


    百度推出AI大脑要“开放赋能”，阿里巴巴强调要“赋能商家、中小企业”，腾讯的观点是“连接一切，赋能于人”，京东要“零售赋能”，小米要智造“赋能万物”，华为要“数字化赋能”……这些大企业都在不厌其烦地强调赋能的力量，那么赋能的定义是什么呢？“赋能”最初源于管理学中“empower”，是和授权联系在一起使用的，现多被人们理解为“赋予能量或赋予能力”。延伸到企业内部就是企业由上而下地释放权力，尤其是员工自主工作的权力，通过去中心化的方式驱动企业组织扁平化，最大限度地发挥个人才智和潜能。未来的组织必须有超越传统的运作方式，对外能够对复杂多变的外部环境做出更快速的反应，对内能够不断激发精英员工的内在动力并在工作中持续为他们赋能。


    企业的决策层（CXO）就代表了公司，赋能组织就是为决策层提供洞见。政委或HRBP们也需要有合适的工具为组织保驾护航。百度人才智库就说明了HRBP如何利用人工智能与大数据技术赋能组织、赋能高管层。'
