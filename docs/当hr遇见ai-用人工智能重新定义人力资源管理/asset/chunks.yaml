    ## 二、选才


    - 智能解析：简历解析和推荐、人岗智能匹配

    - 智慧识人：外部人才识别推荐、趋势分析

    - 智享推荐：优秀面试官推荐、面试评分


    人工智能技术简化了面试官筛选候选人的流程，减少了招聘面试的时间，提升了候选人的面试体验。


    面试前，AI聊天机器人和虚拟界面可以对候选人进行初步筛选，以评估其能力素质、相关经验、工作技能或文化匹配度等。这就意味着，人工智能可以帮助面试官提高面试的成功率。


    那么，企业该如何通过人工智能与机器学习技术实现上述结果呢？


    首先，通过高潜人才画像提取高潜人才的特征，进而得到不同序列的人才画像。在提取过程中要用到的技术包括求职信息与岗位信息自动匹配、全库智能搜索、智能评估、双向推荐等，整个过程全程无需人工参与，这一技术有效地盘活了企业人才库中的数据。


    其次，在人才招聘环节，招聘专员通过大数据挖掘技术对全网简历进行智能搜索与推荐，大大提升了招聘工作的效率。


    最后，招聘专员利用大数据的搜索、分析功能开展包括简历更新、人才推荐等在内的招聘服务。


    具体来说，大数据在招聘领域的应用场景如下。


    #### 1. 简历双向自动推荐


    在传统的招聘过程中，求职者往往会在网络上海量投递自己的简历，企业的HR从业者或用人部门利用招聘系统也在进行海量筛选，这样的操作方式效率低下，且浪费资源。那么，有了大数据之后，企业可以采用职位、简历的双向匹配推荐算法，提取职位与简历的相关属性，并赋予相关属性权重来实现简历双向自动推荐。例如，在求职者的简历中，关键信息包括求职意向、工作经验、技能、学校、学历、专业、爱好等；在用人单位发布的岗位描述里，包括对求职者的要求，如毕业学校最好是985或211类院校、学历是本科以上、专业是与计算机相关的专业、工作经验是5年以上、熟练掌握Java和SpringBoot等。大数据通过抽取求职者的简历信息及用人单位的岗位描述信息，进行模型匹配与特征分析，把合适的简历推荐给用人单位，或者把匹配度较高的岗位信息推荐给求职者，从而实现简历双向自动推荐，极大地提升了招聘工作的效率与人岗匹配的精确度。


    #### 2. 明暗双线智能招聘系统


    过去，人力资源管理系统通常以招聘业务与招聘流程为主。进入数字化时代后，人力资源管理系统则要求以业务为导向，系统设置需要符合业务部门的诉求。因此，明暗双线智能招聘系统应运而生：就是以面试流程为主线，以招聘流程为次线，打造智能化、移动化的“人人都是面试经理”的新招聘系统。


    #### 3. 移动语音面评助手


    面试结束后，面试官利用语音识别技术，以语音或文字的形式填写面试评价。当然，在面试过程中，如果系统能够全程记录面试双方的对话过程（经求职者同意后），就可以为企业的大数据分析工作提供丰富的语音与文字资料。


    #### 4. 智能客服助手


    无论是校园招聘还是社会招聘，在候选人关注的问题中，有80%的问题是重复的。因此，企业有必要开发一个类似于“对话机器人”的智能客服助手，由智能客服助手回答这些共性的问题，它们可以7×24小时提供服务，而且答复更标准，态度更友好。当问题比较复杂、需要专业人员处理时，人工智能技术还可以通过调用沟通工具、组织会议等形式，帮助提问者了解在何时、向何人寻求帮助。


    ## 三、育才


    - 千人千面：智能推荐课程、员工学习地图

    - 即需即用：教练角色匹配内容，加速问题解决与提效

    - 个性化阅读：智能解析内容和推荐阅读


    过去，企业开展培训工作的思路与做法是人力资源部制订培训计划，员工获得工作中需要用到的知识和技能并实现快速成长，提高企业的整体竞争力。


    进入人工智能时代后，企业利用前沿技术（如AI、大数据、AR/VR等）构建起来的智能学习平台为员工提供了全方位的智能学习生态圈。员工在学习或工作中的经历，如曾经读过哪些文章、学过哪些课程、点击过哪些地方等都会被记录下来并分析。培训专员通过后台模型计算，根据员工诉求或岗位能力要求，可以找出对员工真正有用的资源。通过建立标签体系，培训课程或培训内容将被标注上学员角色、工作能力、工作场景、业务流程等标签，培训专员结合学员阅读或选课的偏好建模、特征提取、算力优化及深度分析后，就可以根据标签主动将内容推送给学员，实现人员、岗位、能力、知识的自动匹配，让培训真正做到千人千面。


    其他应用场景还包括以下方面：员工根据工作内容、现有技能、发展计划和未来目标制订个性化的学习计划；根据员工的操作水平，灵活分配拓展任务和跨职能项目；基于个别员工的需求进行培训内容匹配和推荐；智能对话机器人可对常见的培训或学习问题进行实时回复，所有员工都可以提出问题并快速收到回复。


    所谓智能推荐课程，也就是根据学员选课记录或阅读喜好向学员推荐他们可能感兴趣的课程；发现学员曾关注哪些专家，从而向他们推荐与专家相关的课程；向不同序列、不同职级的学员推送不同的课程内容。智能推荐课程的形式如图1-6和图1-7所示。


