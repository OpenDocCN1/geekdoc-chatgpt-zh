- raw: '人力资源数字化（Digital HR）就是利用数字化技术驱动组织、人才、文化（Organization、Talent、Culture，OTC）和领导力（Leadership）的创新与迭代，从人力资源的角度帮助业务部门实现业绩的快速增长。数字化技术将重新定义人力资源管理，将企业打造成智慧HR（intelligent
    HR，iHR）平台。数字化技术对企业的影响体现在以下几个方面，如图1-2所示。


    ![](Images/cutq_28_17993_l.jpg)


    图1-2　数字化技术对企业的影响


    ●组织将更加灵动、高效、相互连接；


    ●人才将实现跨界融合，人才种类将变得多种多样，特殊人才将会层出不穷；


    ●文化将更加敏捷、开放、包容；


    ●流程将实现端到端的连通，同时人工智能的应用将使流程更加智能化；


    ●利用数字化技术连通系统，实现自然埋点并沉淀数据；


    ●数据可以辅助管理者做出判断，让决策更加智能；


    ●用户体验将分为四个层次，即可用、有用、易用、好用，这四个层次的感受是逐步提升的。


    在数字化技术的驱动下，流程是闭环、简洁、高效、端到端的，数据是互通的，用户体验是极致的，管理实践是集成在流程中的，思想是迭代在智库中的，业务是被赋能与驱动的。


    ### [二、人工智能对人力资源管理的重塑](../Text/contents.xhtml#c_10)


    人工智能就像助推器或催化剂，能有效加速人力资源管理模式的迭代。过去，虽然没有人工智能的助力，但是人力资源管理模式一直在不断地发展和迭代。如今，随着“ABCD”（即人工智能、区块链、云计算、大数据）的宣传与普及，具备移动化、社交化、智能化、机器学习等特点的人工智能技术能够帮助企业更快速地提高效能和更有效地提升用户体验。


    现在，一些优秀的头部企业开始由战略人力资源管理阶段进入人力资本管理阶段，追求人才与企业的可持续发展及投资回报率（RoI）的最大化。与之配套，企业需要建设智慧HR平台，只有这样才能支撑起由灵动的网状组织、敏捷文化、特殊人才等构成的企业生态体系。


    在过去相对稳定的业态环境里，管理者依靠丰富的经验就可以推断企业的发展趋势且准确率颇高。但是，现在的市场变化加速、经营环境日趋复杂，管理者仅凭经验已无法准确预测市场前景，因此数据分析结果逐渐成了管理者制定决策的依据。在人工智能时代，企业人力资源从业者可以借助各种数字设备将信息聚集起来，建立一套算法模型将有效的信息提取出来，经过运算分析后获得更加精准的人力配置建议，从而指导企业管理者扩大或调整生产规模。


    虽然人力资源管理领域应用人工智能技术的时间不长，但随着数据量的几何式递增、算法模型的日益精进、算力的跨越式提升，人工智能技术可以让人力资源从业者的工作变得更加省时、便捷，也能够促进企业大幅提升经营效益和效率。


    ### [三、人工智能对人力资源管理的价值](../Text/contents.xhtml#c_11)


    这是一个多变、不确定、未知的时代，面对复杂的市场环境，企业不仅需要强大的、能够进行实时分析的后台作为支撑，而且要适应市场变化，改善管理方式，吸引优秀人才，共同创造更大的价值。


    人工智能对人力资源管理的价值主要体现在“四度”上，即速度、广度、深度和高度。


    1.速度：加速新技术应用，推动业务发展


    人工智能技术可以应用于人力资源管理的各个环节，从而提升人力资源的运营效率。例如，人脸识别技术（扫描视网膜和面部）验证的结果是独一无二的、无法复制的，可以有效防止“代打卡”现象；利用大数据技术（如模型+算法）对求职者进行画像，对求职者的求职意愿、工作经历、毕业院校、专业技能和职场信用等信息进行定性或定量分析，可以得出企业对求职者的关注维度；通过对职位与候选人的智能评估和精确匹配，可以更加高效地筛选简历，提升人才招聘工作的质量；通过增强现实技术（AR）和虚拟现实技术（VR），企业可以轻松利用数字化场景为员工提供培训，员工能更加直观地体验工作流程及工作环境。


    2.广度：扩展数据分析的“点、线、面、体”场景


    随着人工智能技术在数据挖掘、数据分析、数据治理等方面的不断迭代，其从“点、线、面、体”四个维度也对业务产生了作用。所谓点，就是以问题为导向抓住数据分析的发力点；所谓线，就是以业务场景为线索挖掘数据分析的深层原因；所谓面，就是以数据生命周期为核心提升数据分析的洞察力与持续性；所谓体，就是以数据架构为核心搭建数据分析的三大体系（数据体系、指标体系、标签体系）。人工智能和大数据技术在人力资源管理领域的应用，经历了从用数据说话、数据决策、数据运营到数据创新的四个阶段，实现了“点、线结合”和“面、体管控”。


    3.深度：发现了传统数据分析工作洞察不了的事情


    企业管理者利用人工智能技术，可以随时随地了解员工的需求，并根据员工需求的不断变化，设计和实施满足员工需求的流程。例如，人工智能技术可以挖掘员工绩效考核、员工访谈等数据，开展员工离职预测分析，通过及时洞察员工需求来降低优秀员工流失率；企业使用聊天机器人可以节省运营成本和时间，提升智能客服的运营效率，从而提升用户体验。


    4.高度：发挥组织效能，提升企业绩效水平


    随着科技的进步，移动互联网的产生和人工智能技术的应用在很大程度上改变了人与人、人与机器、机器与机器、人与事、人与财、事与事、事与财等之间的关系，也改变了信息流转的渠道。从前的上传下达已不能满足信息传递的需要，信息流已经开始向数字化方向发展。由于外部环境已经发生改变，企业与客户之间、企业与合作伙伴之间共生了新的价值，原有的组织模式已经不再适用，企业必须打造新的组织模式。数字化技术带来的变化重新定义了组织管理。在这些变化中，企业与员工都会面临一些挑战。由于信息与数据高度交互，企业要利用新技术提升组织能力和绩效水平，员工要增强自主创新能力，需要时刻保持高效与敏捷来应对变化。


    图1-3展示的是“数据+场景”的“双轮驱动”。人工智能技术可以帮助人力资源从业者采集、加工、清理各种数据，通过模型、算法和算力，结合管理场景（包括运营体检报告、管理风险预警、选用育留趋势预测、决策支持智库、政策执行监察与修正等）为决策者（CXO）、管理者、员工或人力资源从业者提供分析报告、辅助判断和决策支持。


    ![](Images/cutq_32_4233_l.jpg)


    图1-3　“数据+场景”的“双轮驱动”


    未来，技术进步的速度会越来越快，人工智能技术在人力资源管理领域的应用也会越来越多，这将推动人力资源管理效率、组织效能及用户体验得到更大幅度的提升。


    ## [第三节　人工智能在人力资源管理中的具体应用场景](../Text/contents.xhtml#b_12)


    ### [一、人才生命周期](../Text/contents.xhtml#c_13)


    人工智能在人力资源管理领域的应用涵盖了整个人才生命周期，具体包括入职管理（如品牌宣传、人力成本预测、人才雷达、机器人面试、资料准备前置化等）、在职管理（如智能客服、自助平台、数字化共享服务、目标管理、AR/VR培训、游戏化学习、敏捷绩效、活力曲线、组织健康度、员工满意度、人才360画像、舆情分析、管理风险、一体化激励中心、关怀福利商城、人才保留预警、人才迁徙等）、离职管理（如离职关怀、离职校友会、微信群、回流等）三个部分，每个部分又分为若干个环节。人才生命周期及重要场景如图1-4所示。


    ![](Images/cutq_33_49433_l.jpg)


    图1-4　人才生命周期及重要场景


    人工智能在人力资源领域的选、育、用、留四大模块有如图1-5所示的应用场景。


    ![](Images/cutq_34_58632_l.jpg)


    图1-5　人工智能在选、育、用、留四大模块的应用场景


    ### [二、选才](../Text/contents.xhtml#c_14)


    ●智能解析：简历解析和推荐、人岗智能匹配


    ●智慧识人：外部人才识别推荐、趋势分析


    ●智享推荐：优秀面试官推荐、面试评分


    人工智能技术简化了面试官筛选候选人的流程，减少了招聘面试的时间，提升了候选人的面试体验。


    面试前，AI聊天机器人和虚拟界面可以对候选人进行初步筛选，以评估其能力素质、相关经验、工作技能或文化匹配度等。这就意味着，人工智能可以帮助面试官提高面试的成功率。


    那么，企业该如何通过人工智能与机器学习技术实现上述结果呢？


    首先，通过高潜人才画像提取高潜人才的特征，进而得到不同序列的人才画像。在提取过程中要用到的技术包括求职信息与岗位信息自动匹配、全库智能搜索、智能评估、双向推荐等，整个过程全程无需人工参与，这一技术有效地盘活了企业人才库中的数据。


    其次，在人才招聘环节，招聘专员通过大数据挖掘技术对全网简历进行智能搜索与推荐，大大提升了招聘工作的效率。


    最后，招聘专员利用大数据的搜索、分析功能开展包括简历更新、人才推荐等在内的招聘服务。


    具体来说，大数据在招聘领域的应用场景如下。


    1.简历双向自动推荐


    在传统的招聘过程中，求职者往往会在网络上海量投递自己的简历，企业的HR从业者或用人部门利用招聘系统也在进行海量筛选，这样的操作方式效率低下，且浪费资源。那么，有了大数据之后，企业可以采用职位、简历的双向匹配推荐算法，提取职位与简历的相关属性，并赋予相关属性权重来实现简历双向自动推荐。例如，在求职者的简历中，关键信息包括求职意向、工作经验、技能、学校、学历、专业、爱好等；在用人单位发布的岗位描述里，包括对求职者的要求，如毕业学校最好是985或211类院校、学历是本科以上、专业是与计算机相关的专业、工作经验是5年以上、熟练掌握Java和SpringBoot等。大数据通过抽取求职者的简历信息及用人单位的岗位描述信息，进行模型匹配与特征分析，把合适的简历推荐给用人单位，或者把匹配度较高的岗位信息推荐给求职者，从而实现简历双向自动推荐，极大地提升了招聘工作的效率与人岗匹配的精确度。


    2.明暗双线智能招聘系统


    过去，人力资源管理系统通常以招聘业务与招聘流程为主。进入数字化时代后，人力资源管理系统则要求以业务为导向，系统设置需要符合业务部门的诉求。因此，明暗双线智能招聘系统应运而生：就是以面试流程为主线，以招聘流程为次线，打造智能化、移动化的“人人都是面试经理”的新招聘系统。


    3.移动语音面评助手


    面试结束后，面试官利用语音识别技术，以语音或文字的形式填写面试评价。当然，在面试过程中，如果系统能够全程记录面试双方的对话过程（经求职者同意后），就可以为企业的大数据分析工作提供丰富的语音与文字资料。


    4.智能客服助手


    无论是校园招聘还是社会招聘，在候选人关注的问题中，有80%的问题是重复的。因此，企业有必要开发一个类似于“对话机器人”的智能客服助手，由智能客服助手回答这些共性的问题，它们可以7×24小时提供服务，而且答复更标准，态度更友好。当问题比较复杂、需要专业人员处理时，人工智能技术还可以通过调用沟通工具、组织会议等形式，帮助提问者了解在何时、向何人寻求帮助。


    ### [三、育才](../Text/contents.xhtml#c_15)


    ●千人千面：智能推荐课程、员工学习地图


    ●即需即用：教练角色匹配内容，加速问题解决与提效


    ●个性化阅读：智能解析内容和推荐阅读


    过去，企业开展培训工作的思路与做法是人力资源部制订培训计划，员工获得工作中需要用到的知识和技能并实现快速成长，提高企业的整体竞争力。


    进入人工智能时代后，企业利用前沿技术（如AI、大数据、AR/VR等）构建起来的智能学习平台为员工提供了全方位的智能学习生态圈。员工在学习或工作中的经历，如曾经读过哪些文章、学过哪些课程、点击过哪些地方等都会被记录下来并分析。培训专员通过后台模型计算，根据员工诉求或岗位能力要求，可以找出对员工真正有用的资源。通过建立标签体系，培训课程或培训内容将被标注上学员角色、工作能力、工作场景、业务流程等标签，培训专员结合学员阅读或选课的偏好建模、特征提取、算力优化及深度分析后，就可以根据标签主动将内容推送给学员，实现人员、岗位、能力、知识的自动匹配，让培训真正做到千人千面。


    其他应用场景还包括以下方面：员工根据工作内容、现有技能、发展计划和未来目标制订个性化的学习计划；根据员工的操作水平，灵活分配拓展任务和跨职能项目；基于个别员工的需求进行培训内容匹配和推荐；智能对话机器人可对常见的培训或学习问题进行实时回复，所有员工都可以提出问题并快速收到回复。


    所谓智能推荐课程，也就是根据学员选课记录或阅读喜好向学员推荐他们可能感兴趣的课程；发现学员曾关注哪些专家，从而向他们推荐与专家相关的课程；向不同序列、不同职级的学员推送不同的课程内容。智能推荐课程的形式如图1-6和图1-7所示。


    ![](Images/image_38_0_m.jpg)


    图1-6　推荐课程示例


    ![](Images/image_38_1_m.jpg)


    图1-7　精彩专题推荐示例


    ### [四、用才](../Text/contents.xhtml#c_16)


    ●360度洞察：内外部人才画像、高潜人才识别


    ●敏捷绩效：随时沟通反馈、开展绩效预测


    ●神经网络：洞悉组织活力与组织健康度


    ●管理实践：按专题辅助高层管理决策


    ●行业洞察：对标竞品公司，打造业界标杆


    企业管理者怎样才能精准地知道谁是你想要的人才，人才画像就是一种很好的方法。


    何为人才画像？人才画像是由显性的职位描述和隐性的潜在特质组成的。通俗地讲，人才画像就是你能够像画家画人物一样把人才特征描述出来；描述的准确程度取决于你对信息的掌握与挖掘程度。随着技术水平的进步，人才画像可分为三个阶段：在初级阶段，人才画像只是画出了模糊轮廓，就像手机的100万~200万像素；在中级阶段，人才画像相对清晰了，可以达到800万~1
    000万像素；到了高级阶段，人才画像的效果已经非常逼真，相当于达到了5 000万像素。


    人才画像多用在企业关键人才的选、用、育、留等环节，主要目的是有效吸引与使用关键人才。具体来说，人才画像的框架与应用场景如图1-8所示。


    ![](Images/cutq_40_24749_l.jpg)


    图1-8　人才画像的框架与应用场景


    在人才的选、用、育、留等环节，人才画像可以解决以下问题。


    ◇人才选拔：如果人才供应速度难以与企业发展速度相匹配，管理者到底是依赖外部人才招聘，还是依靠企业内部培养？为什么部分岗位的胜任率很低？如果存在人才队伍臃肿的现象，怎样优化效果更好？如何解决关键人才流失、核心岗位后继无人等问题？


    ◇人才任用：如何科学地解决人岗不匹配问题和团队组建问题？如何解决转型阶段核心人才配置问题？


    ◇人才培养：怎样利用新技术培养人才？如何将人才培养成领军人物？培养人才时，是着重发挥他们的长板优势还是重点提升短板？


    ◇人才激励：如何让核心人才充分发挥自身能力与主观能动性？如何减少核心人才的流失？企业有哪些员工激励措施？


    ◇组织发展：针对组织变化，该如何预警？怎样衡量团队健康度？如何衡量组织活力？如何促进团队协作与提升团队敬业度？


    绘制人才画像的工作需要将大量的员工数据作为基础，随着信息化、数字化、智能化的深入，数据量会越来越多，人才画像的“清晰度”也会越来越高。


    ### [五、留才](../Text/contents.xhtml#c_17)


    ●离职预测：风险管控、人才动态调配


    ●智能关怀：给予关怀、祝福提醒


    ●舆情监测：内外部舆情关注、品牌预警、文化迭代


    离职管理是企业对人才的选、用、育、留四个环节的最后一环。大数据在“留才”方面的应用主要体现在离职预测、智能关怀、舆情监测等方面。


    人才是企业可持续发展的动力，留住人才对任何企业来说都非常重要。利用大数据技术、模型与算法预测员工未来的离职意向，实现留才已逐步成为企业的重点工作。在系统健全、数据拉通的情况下，首先可以对数据进行要素分析，分为个体因素（如年龄、性别、级别、绩效、薪酬、福利、工作内容、技能、个人职业发展等）、组织因素（如企业文化、组织氛围、工作压力、上下级关系、管理幅度、满意度等）以及外部因素（如外部市场工作机会、外部薪酬水平、创业环境、市场热度等），再将所有因素归纳提炼为八个维度指标，如办公环境、工作压力、晋升轮岗、培训学习、职业发展、薪酬绩效、文化氛围及外部热点，通过建立多元回归模型找出各个因素的相关性，厘清正、负相关因素影响，经过模拟与验证，就能够尽早预测员工离职可能性的概率，从而提示企业主管或HR从业者及时采取相应的措施降低员工离职风险，保障企业的正常运作。


    # [第二章　人工智能在选才环节的应用](../Text/contents.xhtml#z_7)


    招聘是企业人力资源管理工作中重要的一环，决定了“谁能来”“能不能干”“如何干”“干多久”的问题。在数字化转型的新时代，人工智能等新技术可以在招聘工作领域发挥更大的价值。


    随着人才流动速度的加快和专业分工的细化，每个人的职业发展道路都存在更大的不确定性。人才并不会把公司内部升迁作为自身职业发展的唯一路径，他们往往会把目光投向公司之外。同时，公司在人才获取的“质”与“量”方面都面临着更大的挑战。在招聘和选择新员工的过程中，公司通常会收集和记录大量的信息，这些信息可以被人力资源分析专家利用。例如，人力资源分析师能够通过在招聘过程中收集的数据预测候选人未来的业绩。


    所有对招聘的研究或实践都在探索企业选拔候选人的最优方式，特别是采用数据驱动的智能招聘。在这方面，可靠性和有效性都很重要。所谓可靠性是指在招聘过程中对候选人进行筛选的方法的可靠性，管理者希望这种方法尽可能客观且一视同仁。但是，人们对彼此的判断非常容易产生偏见，如面试过程中出现的“光晕”效应，即面试官因为候选人的一个突出特征而影响到他对候选人其他特征的判断。有效性是指该方法能否帮助面试官准确筛选出符合特定工作岗位要求的人，包括区分表现良好和表现不佳的候选人，区分想要留下来和加入后不久就将离开的人。


    ## [第一节　KSAM模型](../Text/contents.xhtml#b_18)


    ### [一、KSAM模型的概念](../Text/contents.xhtml#c_19)


    KSAM模型是基于著名的冰山模型演变而来的（如图2-1所示）。在冰山模型中，水平线之上的部分是表象，人们可以通过简单接触、观察与分析识别表象；而水平线以下“深藏不露”的部分是本质，冰山以下的部分越深入“海底”就越不容易被评估与测量，人们必须通过系统手段进行分析才能识别。主导人的行为是“冰山之下”的部分，而且层次越深，影响效果就越明显。因此，HR从业者在进行大数据分析业务建模时，要充分考虑并提取冰山模型各部分的特征，结合应用场景进行岗位和员工特征剖析，真正做到人岗匹配。


