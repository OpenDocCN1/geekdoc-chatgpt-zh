    ### [二、人工智能驱动人才发展](../Text/contents.xhtml#c_57)


    随着人工智能和大数据技术的发展，机器学习（Machine Learning，ML）对人才发展的算法分析可以为企业的人才识别、人才培养和人才保留提供参考依据，同时也可以推动企业对人才发展工作的投入。


    人才发展的核心是以人才盘点为基础，做好人才选拔和人才培养工作。人才盘点的工作非常繁杂，人工智能可以根据员工绩效、能力、潜力的评估结果迅速提供企业需要的高潜人才分布情况（九宫格或16宫格），从而使管理者清楚地知道需要招聘哪些人才，需要保留哪些人才，需要培养哪些人才，需要淘汰哪些人员。人才招聘工作也可以利用人工智能技术完成。人工智能技术可以帮助招聘专员更好地识别人才，实现人岗精准匹配，节省招聘时间；可以识别并解析不同格式的电子简历、纸质简历甚至图片，将其转化为统一的简历格式并存入企业人才库；对简历进行分析，结合简历的特征和文字内容抽取其中的关键性信息；通过建立数据库的方式使简历结构化、模型化，从而精准快速地把简历推送给面试官。人工智能技术的应用可以将HR从业者从以往繁杂的工作中解脱出来，使面试官能够将更多的精力放在与候选人进行深入交流、识别候选人是否与企业文化及价值观相匹配上。


    在人才培养方面，企业也可以利用人工智能技术将员工的岗位、技能、个人发展计划（Individual Development Plan，IDP）等数据与学习地图进行匹配，推荐个性化的学习课程。在人才培养的过程中，员工试用期转正评估、晋升答辩、轮岗评测、年度总结述职等工作都可以通过人工智能技术来完成。这样做不仅节省了管理者的时间，更重要的是人工智能能够更客观、更公正地给出评估结果。人工智能技术还将改变培训模式，不仅能够为员工提供沉浸式的培训体验，而且能够结合员工兴趣、爱好及潜能为其推荐个性化课程，形成员工定制化学习地图，为员工在企业中的学习发展提供方向。更有趣的是人工智能技术能够将培训游戏化，通过盲盒设计等方式增强课程的吸引力，提升员工的学习兴趣。


    由此可见，个性化、碎片化、社交化、场景化、游戏化将是未来培训工作的主流趋势。


    人工智能在人才发展中的应用主要有以下几个方面。


    1.AI赋能。通过探索AI的应用能力，提升HR从业者的智能统计分析、数据洞察、数据决策能力，为企业人力资源管理的选、用、育、留、管这五个环节赋能。


    2.人才管理。基于人力资源知识图谱构建员工标签库，建立人才画像体系，通过人才发现、人才识别、团队分析和发展路径等功能，协助企业管理者和HR从业者高效发现核心人才。


    3.知识推荐。基于AI和知识图谱的技术，整合企业内外部的学习资源，加快知识的智能化沉淀，优化知识领域的个性化推荐，为企业的人才技能培养工作提供智能化方案。


    4.行业分析。在积累内部数据的基础上广泛获取外部市场调研数据，结合企业的招聘信息为内部人才流向、外部人才发展趋势等提供决策支持，丰富企业内外部的人才储备情况，提升招聘工作的质量和效率。


    5.团队管理。利用能力、目标、效能刻画组织和团队，并基于人才画像支持HR从业者自定义群体和分析固定群体，跟踪、分析群体指标变化情况和群体差异，为HRBP和管理者提升组织能力提供支持。


    6.用户体验。提升入、离、升、降、调等工作的效率，改善全体员工在人力资源服务方面的体验。


    ### [三、衡量人力资本投资回报率](../Text/contents.xhtml#c_58)


    人力资本投资回报率（Human capital investment rate of return）是指通过对企业的收入、利润、人力成本等相关因素的量化分析，计算企业在人力资本上每投入1元所获得的回报。这是一项衡量人力资源有效性的核心指标。


    计算公式：人力资本投资回报率=企业净利润/人力成本总额×100%。


    （1）净利润=利润总额–所得税费用


    ■利润总额=营业利润+营业外收入–营业外支出


    营业利润=营业收入–营业成本–税金及附加–销售费用–管理费用–研发费用–财务费用–资产减值损失+其他收益+投资收益（损失用“–”）+公允价值变动收益（损失用“–”）+资产处置收益（损失用“–”）


    ■所得税费用=利润总额×所得税税率


    （2）人力成本总额=员工工资总额+单位缴纳的社会保险费+员工福利费+员工教育费+劳动保护费+员工住房费用（单位负担的住房公积金）+其他人工成本费用（如发放的伙食补助、交通补助、手机通信费等）


    人力资本投资回报率是综合反映收入和成本因素的关键指标。企业可以通过降低销售成本、提高利润率、提高资产利用效率等方式提高投资回报率。激励机制也是企业利用人力资本取得投资回报的重要路径，具体形式包括薪酬方式、福利方式、工作环境、提供学习机会、提供股权方式等内容。该指标既反映了企业生产力和费用控制情况，也反映了组织的效率、企业战略的有效性以及企业目标的实现情况。


    随着技术的快速发展和数字化转型的加速，企业需要大量收集与人才发展项目相关的数据，并将其与组织的各项业务和相关成果联系起来。由于人才发展项目会影响到人员管理的各项参数，大型企业通常会使用以下指标来衡量人才发展项目的效果。


    ●员工敬业度


    ●员工保留


    ●提升生产力或降低成本的幅度


    ●客户满意度


    ●人才管道深度、领导绩效水平


    ●创新能力


    ●团队合作精神


    上述指标与人力资本投资回报率具有强相关性。


    西尔斯（Sears）通过“情绪环”测量了零售店员工敬业度对商店绩效的影响。“情绪环”捕捉到员工的情绪如何在一天中发生变化，并影响了客户互动和体验。它处理了100万个数据点，发现心情好的员工会带来更好的客户体验，从而提高了销售额。接下来，西尔斯正在确定与员工“好心情”相关的因素，并将重点放在了提高商店绩效的因素上。


    康尼格拉（ConAgra）使用人力资源分析软件预测哪些关键员工最有可能离开公司及其原因。该公司管理者挖掘出了超过200个可能导致员工离职的因素，从而为员工保留工作提供了数据参考依据。


    施乐（Xerox）公司通过研究呼叫中心员工的流失率，发现家庭住址和工作地之间的距离与员工敬业度及员工保留密切相关。通过综合使用这些参数，施乐公司将员工的流失率从50%降到了30%。


    麻省理工学院（MIT）的人类动力学实验室使用专门的电子“徽章”，记录了员工日常生活中关于正式和非正式对话的各种信息，包括对话长度、人员的语气和手势、这些人说了多少、听了多少、打断了多少及他们表现出的同理心和外向性的程度等。研究发现，实验室利用电子“徽章”收集到的数据，通过建模分析就可以预测哪些团队将赢得“黑客马拉松”比赛的胜利。


    《哈佛商业评论》研究表明，员工敬业度每提高5%，将推动客户满意度提高1.3%，从而使企业收入提高0.5%。人力资本投资回报率也有正相关的变化。


    未来，随着组织利用数据洞察实现自身业务价值提升情况的增加，“数据智能”在人力资本管理中的应用也会越来越多。


    ### [四、人才盘点实施方法](../Text/contents.xhtml#c_59)


    企业进行人才盘点的目的是挖掘高素质、高潜力人才，识别组织对不同类型人才的需求，增加企业人才的储备量。通俗地讲，人才盘点工作就是企业使人与岗位实现最优匹配。


    人才盘点是组织发展和人才管理的基础性工作，不仅需要汇总常规信息，而且要从人岗匹配、职能配比、胜任特征、绩效趋势等维度进行综合分析，全面和科学地了解组织的人才现状，建立人才供应的长效机制。


    1.人才盘点要解决的问题


    （1）人才盘点工作不只是针对人才的，其实人才盘点工作的起点是对组织的盘点，所以管理者要确保现有人才能够支撑企业的业务战略。因此，管理者首先要明确“基于企业未来的战略目标，究竟需要怎样的组织架构、如何设计岗位、如何分配职责”等，然后才可以考虑相应的人才问题。


    （2）了解人才现状。通过人才盘点工作，管理者可以明确组织架构和人才需求，掌握组织当前的人才现状，发现人才需求和人才现状之间的差距。


    （3）识别高潜人才是人才盘点工作的核心内容之一，它是企业人才梯队建设的基础，能为企业的人才培养工作提供明确的方向。


    2.人才盘点的应用场景


    （1）人才潜力分析。根据人才盘点的结果，管理者可以清晰地了解组织内部的人才分布状况，从而采取更具针对性和有效性的管理措施。


    （2）招聘配置规划。根据人才盘点的结果，管理者可以明确各类人才的优势和劣势，通过高潜人才的聚合分析和离群分析梳理高潜人才的共性，为人才招聘和岗位调配等提供有力的支持。


    （3）职业生涯规划。根据人才盘点的结果，管理者可以帮助员工了解自身的优势和劣势，对自己进行准确定位，明确规划自己的职业生涯。


    （4）员工培训开发。根据人才盘点的结果，管理者可以了解每一个员工的胜任能力和绩效表现，为其设计更具针对性的培训内容。


    3.人才盘点的实现路径


    （1）实时采集人力资源管理数据，依托最新的、有效的数据对人才现状进行统计和分析，如效能分析、结构分析、数量分析等。


    （2）通过九宫格模型对组织内部的人才进行盘点，实时掌握人才在胜任能力和绩效两个维度的表现，并采取有针对性的管理措施。


    （3）综合分析人才画像、岗位画像和人才盘点结果，并利用AI技术对人岗进行智能匹配，充分激活人才资源。


    ## [第二节　游戏化学习的促进](../Text/contents.xhtml#b_60)


    以百度培训学院游戏化学习项目为例来描述数字化时代如何应对培训的挑战。（本节内容节选自时任百度培训经理陈媛的分享）


    在百度公司，培训学院会为“90后”员工提供一个名为Just for me和Just in time的培训，百度公司认为Contact is more important
    than content（连接比内容更重要），也就是在不缺乏信息的情况下，分析企业和员工之间缺少的是什么？可能是一个场景或一个社交化的区域，让员工自动自发地参加培训项目。在这个过程中，培训专员就会发现培训工作存在的一些问题，接下来需要如何解决。


    培训专员要先复盘，分析与新员工相关的培训有哪些，公司现在拥有哪些资源。目前，百度公司有两个培训资源，一个是新员工的“应知应会指南”，另一个是新员工的职业化培养，也就是告诉新员工如何顺利成长为职业化的“百度人”。


    1.新员工应知应会的游戏化实践（第1个月）


    每家公司都会有新员工的“应知应会指南”，它既可能是一个几千字的Word文档，也可能是由HR从业者讲解的几页的PPT文件。“应知应会指南”会告诉新员工，你加入新公司后，未来你需要联系的部门有哪些，联系方式是什么，以及公司常用的办公软件是哪些。但是，新员工真的会认真读完几千字的Word文档吗？大多数人是不会全部看完的，尤其是“90后”员工，相对于枯燥的文稿，他们更喜欢游戏化的、社交化的体验。


    （1）“应知应会”游戏化设计思路


    新员工入职六个月内所需的资料共有五个篇章，分别是入职篇、学习篇、工作篇、关怀篇、成长篇。百度公司以游戏的形式将如此丰富的内容灌输给新员工，这个游戏非常像冒险岛闯关。当新员工从第一关玩到第五关的时候，就意味着他已经将五个篇章的所有内容都看了一遍。实践证明，以游戏闯关的形式让员工了解应知应会的内容和员工手册是一种很好的方式。百度公司新员工应知应会设计思路如图4-1所示。


    ![](Images/cutq_129_29475_l.jpg)


    图4-1　新员工应知应会设计思路


    （2）“应知应会”游戏化示例


    图4-2就是百度公司“新员工应知应会”的小游戏。在这个小游戏中，新员工可以跳上跳下、做积分、闯关、收集星星、收集钥匙，最后还会得到一个神秘大奖，同时轻松掌握89个知识点。


    ![](Images/cutq_130_35238_l.jpg)


    图4-2　“新员工应知应会”小游戏的界面


    2.新员工职业化培养（0—6个月）的游戏化探索实践


    游戏化实践是百度公司新员工入职六个月内职业化培养的游戏化方案。百度公司将新员工培养分为四个时期，分别是蜜月期、定位期、崛起期和成熟期，如表4-2所示。


    表4-2　新员工培养的四个时期及其培养内容


    ![](Images/cutq_131_41557_l.jpg)


    在蜜月期，公司要灌输给新员工的是公司的文化和组织架构等。


    在定位期，公司输出给新员工的是基础软技能，如时间管理、会议管理、撰写文案的技巧等。


    在崛起期，公司会给新员工提供一些进阶通用的课程，如问题分析与解决能力、执行力、职业规划技能等。


    到了成熟期，公司会为新员工设计一些非职权影响力、跨部门沟通的课程。


    百度公司会把所有的课程体系都放到在线学习平台上。此时，培训专员就会发现一个问题，把课程放到平台并不代表员工看了、学了，所以培训专员要激励员工在三个月内不断学习、完成课程。这对培训专员来说就是一个挑战，为了克服这个困难，培训学院为游戏化学习平台设计了三套机制，分别是学习机制、社交机制、激励机制，每套机制又有三种功能，这九种功能组成了游戏化学习平台（如图4-3所示）。学习机制里的三种功能是学习地图、学习任务、学习资源。社交机制里的三种功能是项目中心、学习社区、社区商店。激励机制里的三种功能是成就勋章、学习排行、财富排行。下面详细介绍各个功能模块。


    ![](Images/cutq_132_54970_l.jpg)


    图4-3　三套机制：学习、社交、激励


    （1）学习机制


    学习机制里包含了如下三种功能。


    ①学习地图：百度公司针对新员工加入公司时的心理变化专门设计了“S”形的学习地图（如图4-4所示）。例如，在第一阶段即蜜月期，“S”会呈现一个下沉的状态，因为新员工刚加入公司的时候，他会感到特别开心、特别兴奋，但很快他就会发现自己周围所有的东西都是陌生的，因此他会产生一些沉闷感。


    ![](Images/cutq_133_1758_l.jpg)


    图4-4　百度公司的“S”形学习地图


    到了第二阶段即定位期，新员工开始慢慢寻找自己在组织中的定位，一旦明确了定位后，他就会迅速进入上升期，也就是第三阶段即崛起期，在这个时期，他开始爬坡上升，最后达到一个巅峰，也就是到达了第四阶段即成熟期。所以，图4-4呈现的“S”形学习地图完全是按照员工的心理状态及能力表现来绘制的。百度公司绘制这个地图的目的就是让新员工一级一级地学习，一级一级地提升。


    ②学习任务：在游戏化实践的过程中，每当开始一个学习任务时，新员工都会看到一个弹窗，上面写着：你完成这个任务后，你将会获得什么样的技能，掌握什么样的知识，以及了解到公司有哪些文化价值观体现在这门课中；同时会告诉你，你学完这门课能获得多少个水晶、多少个硬币、多少奖励。


    ③学习资源。百度公司的培训专员在处理学习资源时，做的第一件事就是将原来45分钟的课程全部按知识点拆分成只有10分钟的课程，这种细分的学习形式充分满足了员工碎片化学习的需求。


    （2）社交机制


    社交机制里也设计了三种功能。


    ①项目中心：在项目中心里员工会看到两个小岛，第一个岛叫做新兵岛，公司的应知应会课程都在这个岛上；第二个岛叫做职业化之旅的岛，上面包含各种专业课程。


    ②学习社区：学习社区是跳出岛屿之后的一个大平台，这个社区中有广播、有排名，员工的学习分数等级全部在社区中展示出来，方便员工进行对比和交流。


    ③社区商店：此功能用到了学习金币的概念，也就是说在学习或做任务的过程中，员工可以得到相应的积分，将积分兑换成金币后可以到社区商店里选购物品。


    （3）激励机制


    激励机制也设计了三种功能。


    ①成就勋章：员工每完成一个岛屿的课程就会得到一个成就勋章。


    ②学习排行：学习排行是实时更新的，如员工现在的金币是多少，在学习中用了多长时间，在学习中答对了多少道题，都会在排行榜中不断更新。


    ③财富排行。员工赚到的钱也有排行，目的是鼓励大家持续学习、不断进步。


    学习可以是精彩有趣的，学习中的你也可以是快乐的，这一切都可以由游戏化学习来改变。


    # [第五章　人工智能在留才环节的应用](../Text/contents.xhtml#z_10)


    ## [第一节　离职预测](../Text/contents.xhtml#b_61)


    目前市场上有一种工具叫“人才流失预警”，该工具可以掌握员工离职动向，它是由第三方平台提供的。员工只要在求职网站上更新简历，其行为就会被第三方平台记录在案。若企业购买了该平台的服务，隔天就会收到预警提醒。但是，该工具有侵犯个人隐私的嫌疑，其合规性已受到广泛质疑。


    那么，有没有一种科学、合规的数据分析方法可以帮助企业管理者预测员工的离职倾向，达到掌握员工动向、降低用人成本的目的呢？


    数据分析分为描述性分析、相关性分析和回归性分析三种。离职预测属于回归性分析，对数据的数量、质量、维度、周期都有相应的要求。数量代表数据的大小，数据越多，其分析结果的价值就越大；质量代表数据的准确度；维度包含在数据分析的场景里，不同的场景、不同的主题需要使用不同的分析方法，以便达到最佳效果；周期是指数据的刷新频率，如企业一年开展一次绩效考核，则数据刷新频率为一年一个周期，大数据分析与模型验证一般需要三个周期的历史数据，同时再经历一个实时周期进行试运行与优化，方可达到正式上线的标准。


    数据工程师可以利用大数据挖掘技术对员工的相关信息进行建模与分析，一旦发现有离职倾向的员工，可提前告知主管或HRBP该员工离职的概率，让主管或HRBP在员工离职之前采取行动，或者通过调薪、调岗的方式挽留员工，或者提前补充人力。


    HR从业者做离职预测时可以从薪酬福利、晋升轮岗、办公环境、工作压力、培训学习、绩效与发展、文化氛围、外部热点八大要素出发。其中，每个要素又有若干细分项。例如，薪酬福利可分为付出/收入满意度、公司内部公平性满意度、行业内薪酬竞争力满意度等，晋升轮岗包括晋升机会、晋升频次、异动机会等，绩效与发展包括绩效等级、评价、分布情况、个性与工作符合度、工作成就感等，工作压力包括上下级关系、同事关系、企业归属感等，办公环境包括办公设备、工作环境及危险性、工作时间、工作地距离等。HR从业者对这些要素进行业务建模以及大数据建模、多元回归、相关性分析，得出“能力&绩效与员工离职风险”的三维示意图，如图5-1所示。


    ![](Images/cutq_138_12283_l.jpg)


    图5-1　能力&绩效与员工离职风险的三维示意图


    横轴代表员工能力的强弱，纵轴代表员工绩效水平的高低，黑色圆圈代表风险度高、深灰色圆圈代表风险度中、浅灰色圆圈代表风险度低。


