    \n### 第八章 建设智慧HR平台，助力业务转型\n- [第一节 四化模型与人力资源数智化的迭代路径](../Text/chapter11.xhtml#sigil_toc_id_100)\n\
    \  - [一、1.0阶段：线上化](../Text/chapter11.xhtml#sigil_toc_id_101)\n  - [二、2.0阶段：信息化](../Text/chapter11.xhtml#sigil_toc_id_102)\n\
    \  - [三、3.0阶段：数字化](../Text/chapter11.xhtml#sigil_toc_id_103)\n  - [四、4.0阶段：智慧化（智慧HR）](../Text/chapter11.xhtml#sigil_toc_id_104)\n\
