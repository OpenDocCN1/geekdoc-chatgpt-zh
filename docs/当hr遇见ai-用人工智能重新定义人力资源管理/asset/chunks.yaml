- raw: '人事管理阶段的特征主要是行政职能，关键词是“办手续”。在这个阶段，人事部主要处理日常事务，其中大多是琐碎事务。工作内容包括办理入职、日常考勤、工资发放、办理离职、开证明等。


    处于人事管理阶段的企业对信息技术的要求是实现人事服务的线上化，这就是人力资源信息化的初级阶段：1.0线上化阶段（MIS）。管理信息系统（Management
    Information System，MIS）就是将人力资源各个模块从线下搬到了线上。这个阶段的工作主要是满足人事服务的线上处理需求，如提供算薪、缴纳社保公积金、入离调转等基础服务，核心是实现薪酬的自动计算，关键词是“数清人、发对薪、算总包”。数清人即通过报表准确地统计出公司员工的基本构成与分布情况；发对薪即通过系统正确地计算并发出工资、奖金；算总包即能够统计出集团总部、各事业部及分公司的人员编制预算与人力成本。


    ### [二、2.0阶段：信息化](../Text/contents.xhtml#c_102)


    人力资源管理阶段的主要特征是强调以“工作”为核心，关键词是“六大模块”，该阶段更看重如何通过六大模块使员工能够胜任岗位要求并高效地完成工作。六大模块是指人力资源规划、招聘、培训、薪酬、绩效、员工关系，各个模块之间是相互独立的。1993年，中国人民大学劳动人事学院率先将人事管理专业改为人力资源管理专业。从那时起，中国企业也开始从人事管理转向人力资源管理。1997年，戴维·尤里奇提出了三支柱模型，即HRBP、HRCOE、HRSSC。由此推动中国人力资源管理经历了一个快速发展、创新与变革的时期，三支柱也随着时代发展及技术驱动不断地演变与发展着。


    处于人力资源管理阶段的企业对信息技术的要求是实现人力资源管理的信息化，即大家常说的eHR，这个阶段的关键词是“流程、合规、效率”，此阶段人力资源的主要业务流程就是十个字：入离升降调、选用育留管。人力资源信息化就是要从人力资源管理的全生命周期出发，进行业务流程梳理与诊断、流程再造设计与优化，链接与集成人力资源业务活动中的各种信息，实现人力资源内外部信息的共享和有效利用，各个模块要互联互通，流程与系统要实现端到端打通，确保业务流程合规，提升整体运营效率，满足管理诉求。


    在此阶段，HRSSC开始利用系统提升服务效率，如很多头部企业利用技术手段升级改造了HRSSC，打造了一站式服务平台，目标是简化流程、提升效率。


    ### [三、3.0阶段：数字化](../Text/contents.xhtml#c_103)


    战略人力资源管理阶段的特征是人力资源部逐渐成为业务部门的战略合作伙伴，其目标是支撑企业战略目标的实现，关键词是“三支柱”，HRBP、HRCOE、HRSSC都要围绕组织、人才、文化来支撑企业战略，实现业绩增长，如图8-3和图8-4所示。在此阶段，人力资源副总裁（HRVP）等角色开始出现，并进入企业核心管理层，使人力资源管理工作对业务产生了一定的影响。


    ![](Images/cutq_222_49282_l.jpg)


    图8-3　三支柱模型


    处于战略人力资源管理阶段的企业对信息技术的要求是实现人力资源的数字化（DHR）转型，关键词是“组织效能、用户体验”。该阶段对人力资源部的要求是明确数字化思维与认知。


    数字化转型是利用数字化技术和能力驱动组织商业模式创新及商业生态系统重构的途径与方法，目的是实现业务的转型、创新与增长。数字化转型的核心是业务转型，技术是数字化转型的基石，简言之，数字化转型就是企业利用技术彻底改变经营业绩。


    ![](Images/cutq_223_56564_m.jpg)


    图8-4　三支柱支撑企业的业务战略


    人力资源数字化就是利用数字化技术和能力重塑组织、人才与文化，促使企业业务实现快速增长，如图8-5所示。


    ![](Images/cutq_223_10793_l.jpg)


    图8-5　人力资源的数字化转型


    人力资源数字化可以从流程、系统、数据及用户体验四个层面来支撑组织、人才及文化。首先，流程需要合规高效、权责清晰；系统需要做到互联互通，兼具数据化、场景化、智能化；数据需要整合信息、分层呈现，从而达到预警预测、辅助决策的效果；用户体验则需要贯穿整个人力资源管理的生命周期，在设计流程、打造系统的同时将其融入其中。


    随着大数据时代的到来，不确定性因素逐渐增多，企业面临着更为复杂的挑战，这就要求人力资源部能提供全方位的服务。例如，利用数字化技术重塑人力资源业务流程，构建一个全感知、全链接、全场景、全智能的数字平台；通过大数据分析进行预测预警、辅助决策，助力人力资源转型，加速业务发展。人力资源数字化是信息化的加速升级，将数字化的信息进行整合加工，通过多维分析、主题分析、预测分析为企业决策提供有效的数据支撑。数字化阶段的特点是移动化、智能化、大数据、云服务（如图8-6所示），目的是提高用户体验、全面提升组织效能。


    ![](Images/cutq_224_21112_l.jpg)


    图8-6　数字化HR平台架构


    数字化（DHR）阶段加速了三支柱的发展和系统落地，AI微应用开始在各种场景中实施，如一站式服务平台、机器人客服、简历职位智能双推、智能背景调查、机器人面试、合同电子签、AR培训、自助服务、人才画像、智慧大屏等。当然，每家企业的基因及发展历程不同，无论如何重塑三支柱，目的都是帮助企业实现业务的战略目标。


    ### [四、4.0阶段：智慧化（智慧HR）](../Text/contents.xhtml#c_104)


    人力资本管理阶段的特征是把人才当作资本来管理，目标是实现企业发展过程中持续的人才供应，人才管理与组织能力已经成为企业的核心竞争优势，此阶段的关键词是“生态”。通常来讲，处于此阶段的企业已基本具备三条曲线的业务发展路径：第一条曲线是企业成熟业务，确保现金流；第二条曲线是企业发展中业务（即成长业务），产品或服务具备随时升级的潜力；第三条曲线是未来业务，探索未来趋势，使企业处于抢跑位置。这三条曲线的组织、人才、文化战略也是不同的，如表8-1所示。与此同时，人力资源领域专家们的观点也在发生变化：戴维·尤里奇将人力资源胜任力从六脉神剑（2007年）不断迭代为九大角色模型（2016年），拉姆·查兰也从“分拆人力资源部”（2014年）转向“C3模型”（CEO、CFO、CHRO）（2019年）。中国企业的快速发展同样迫使中国的人力资源管理不断突破、不断进化。2017年可以被看作是中国人力资源管理实践的元年和分水岭，2017年之前中国人力资源学者看国外、学国外，2017年之后转向观察、学习国内头部企业的人力资源管理实践，尤其是向头部互联网企业学习。


    表8-1　企业三条曲线的业务发展路径


    ![](Images/table_image_226_0.jpg)


    此阶段的人力资源管理也开始进入智慧HR（iHR）阶段，智慧HR是数字化的高级阶段，关键词是“智库”。如果说信息化、数字化解决的是“点、线、面”的问题，那么随着大数据与人工智能的深入应用，智慧HR考虑的则是“体”的问题，它可以使“入离升降调、选用育留管”的各个环节具备灵敏感知能力、自适应学习能力和预测判断能力，同时将各场景下的管理实践通过“神经网络”触达并输送到大脑中枢，结合管理实践给出行动建议，最终形成智库。业务生产数据，数据驱动业务，二者不断迭代、循环上升。本阶段的特征是网状组织，目的是建立生态型组织，并可持续地支持企业多条曲线良性循环发展。


    智慧HR提供了类似中后台能力的平台，如图8-7所示，集成了人力资源业务中台与数据中台，以小快灵、敏捷的小团队应对各种不确定性，通过神经网络洞察秋毫，发挥生态效能，赢得连续优势。


    当然，每家企业的发展阶段不同，信息化程度也会有所不同。那么，人力资源的数字化转型能否在较短的时间内实现从线上化到信息化，再到数字化，最后实现智慧化的快速迭代升级呢？答案是肯定的，因为路径是清晰的。智慧HR平台可以通过两条连续的曲线实现穿越式敏捷迭代：第一条曲线是从“填坑”到“赋能”的穿越迭代，第二条曲线是从“赋能”到“引领”的穿越迭代，如图8-8所示。


    ![](Images/cutq_227_29401_l.jpg)


    图8-7　智慧HR平台


    ![](Images/cutq_227_39887_l.jpg)


    图8-8　智慧HR平台的穿越式敏捷迭代


    ## [第二节　大数据分析成熟度模型](../Text/contents.xhtml#b_105)


    ### [一、Bersin人才分析成熟度模型](../Text/contents.xhtml#c_106)


    人力资源研究公司Bersin & Associate（现属于德勤公司）于2012年推出的人才分析成熟度模型分为四级（如图8-9所示），各级含义如下。


    ![](Images/cutq_228_4678_l.jpg)


    图8-9　人才分析成熟度模型分级示意图


    1.I级：应需分析


    本层级是基础报表，是衡量服务效率和合规性的运营性报表，典型的应用如下：


    （1）建立统一的数据字典：有统一的文档，明确数据源头、获取方式、定义、计算的细节等；


    （2）建立红、黄、绿可视化仪表盘：报表展现了人员构成与基本结构。


    2.II级：主动分析


    本层级是高级报表，是服务于决策、多维分析和仪表盘的操作性报告，典型的应用如下：


    （1）改善多样性常规监测：建立常规监测体系，从招聘、识别、选拔、任用、晋升、激励、保留、流失等方面衡量企业的人才构成是否足够多样；


    （2）建立标准，积累趋势数据：通过对比分析（如员工保留率、员工尽职调查、人员向上流动性等均低于标准值，则说明企业处于低迷状态）说服管理者增加投资；


    （3）为管理者建立红、黄、绿绩效管理数据，用于动态比较本团队和类似水平团队的绩效等。


    3.III级：策略分析


    本层级特指分析服务，用于人群细分、统计分析、分析维度，目的是了解原因并提供可行的解决方案。典型的应用如下：


    （1）高潜力候选人分析：用一套算法就可以预测哪些候选人在入职后将有高绩效潜力；


    （2）高绩效员工价值量化：主管可以看到诸如“A”比“B”强N倍的数字，帮助主管预测谁将会成为人才；


    （3）鼓励协作的工作场所设计；


    （4）构建数据的可视化能力，用业务语言阐述分析结论；


    （5）为销售团队建立高绩效候选人识别模型；


    （6）用量化数据衡量经理人管理人才的能力，包括驱动、激励、改善绩效、保留等。把对经理人管理能力的考评融合、量化成为一个指数。


    4.IV级：预测分析


    本层级将开发预测模型、场景规划、风险分析与规避、战略规划相结合。典型的应用如下：


    （1）支持组织结构设计，用可视化方法观测管理幅度、人才流动模式，考量人才向上晋升或左右流动是否灵活；


    （2）支持人员编制预算，分析内部人才迁徙，洞察外部劳动力市场；


    （3）从岗位职能、项目、技能、特殊专业知识等方面，面向企业的未来业务远景制定规划，结合全球经济态势进行分析，对企业未来的人才缺口做好储备；


    （4）百度的智留辞，这是百度公司针对关键人才保留设计的离职预测模型。


    ### [二、DIKW金字塔模型](../Text/contents.xhtml#c_107)


    在信息管理、信息系统和知识管理学科中，最基本的模型就是数据信息知识智慧模型（Data-Information-Knowledge-Wisdom，DIKW）。DIKW模型是金字塔式结构，如图8-10所示。这一模型既体现了数据（Data）、信息（Information）、知识（Knowledge）和智慧（Wisdom）之间的关系，还展现了数据是如何一步步转化为信息、知识，乃至智慧的。


    ![](Images/cutq_231_52941_l.jpg)


    图8-10　DIKW模型的金字塔结构


    金字塔模型的底座最大，这一层是数据。数据（Data）在拉丁文中的原意是事实和已知。数据是一种原始的记录，没有经过加工和解释，反映了事物的客观状态，数据之间是分散和孤立的。


    对数据进行系统组织、整理和分析之后得到信息。信息具有明确的目的性和使用性，能够回答“谁（who）”“什么（what）”“地点（where）”和“时间（when）”等问题。信息是数据上面的一层，来源于数据并高于数据，信息把特定的、孤立的数据联系了起来，数据和信息都是客观存在的。


    在DIKW金字塔模型中，数据和信息的上层是知识。知识体现了信息的本质、原则和经验，能够指导任务的执行与管理，进行决策并解决问题。从数据到信息再到知识的过程，是数据不断变得有序、不断得到验证，并最终揭示固有规律的过程。


    智慧是DIKW金字塔模型的最高一层。智慧是在知识的基础上形成的对事物的深刻认识和远见，体现为一种卓越的判断力，人们由此采取策略和行为。智慧是人类区别于其他生物和人工智能的重要特征（至少目前是如此）。知识和智慧都包含了智能的主观意识。


    ### [三、DIKWA模型](../Text/contents.xhtml#c_108)


    在人工智能、大数据时代，人们首先要改变的是对新事物的认知，只有与时俱进、迭代升级才能跟上时代，与业务同频。因此，人们重新学习了DIKW金字塔模型，并在前辈的基础上，微创新迭代为DIKWA应用模型，如图8-11所示。该模型形成了闭环，用于指导并驱动人力资源大数据的应用发展。


    ![](Images/cutq_232_025_l.jpg)


    图8-11　DIKWA应用模型


    DIKWA模型与5W2H完美结合，诠释了人力资源大数据的应用之路，即整合信息、分析预测、做出判断、采取行动。


    ●Data即数据，在拉丁文中的原意是事实和已知。数据是一种原始的记录，没有经过加工和解释，反映了事物的客观状态，数据之间是分散和孤立的，描述的是客观事实。表8-2是某公司员工张三的基本数据示例。


    表8-2　某公司员工张三的基本数据


    ![](Images/table_image_233_0.jpg)


    ●Information即信息，把特定的、孤立的数据进行加工、整理之后得到信息，数据和信息都是客观存在的。信息具有明确的目的性和使用性，能够回答“谁（who）”“什么（what）”“地点（where）”和“时间（when）”等问题。表8-3是某公司员工张三的绩效与奖金信息示例。


    表8-3　某公司员工张三的绩效与奖金信息


    ![](Images/table_image_233_1.jpg)


    ●Knowledge即知识。知识是对信息的提炼和归纳，体现了信息的本质、原则和经验，能够指导人们执行与管理任务，并进行决策和解决问题。通过数据挖掘，从数据中发现隐藏的趋势和不同寻常的关联规则就属于知识层面。从数据到信息再到知识的过程，是数据不断变得有序、不断得到验证，并最终揭示固有规律的过程。这一步主要回答“如何（How）”的问题。图8-12是进行人力资源各个模块相关性分析的示例。


    ![](Images/cutq_234_12344_l.jpg)


    图8-12　进行人力资源各个模块的相关性分析


    ●Wisdom即智慧。智慧是在知识的基础上形成的对事物的深刻认识和洞察，体现为卓越的判断力，人们由此制定策略和建议方案。知识和智慧都包含了智能的主观意识。人们通过数据挖掘、相关分析得到隐含的各种趋势，如离职预测、发展潜力、管理风险等。这一步主要回答“为什么（why）”的问题。图8-13是盘点绩效与能力的九宫格示例。


    ●Action即行动。在智慧洞察的基础上，人们得到了几个解决方案，至于哪个方案更有效果，人们需要根据当时的情景做出决策，并采取正确的行动。当然，行动之后还要复盘，分析执行效果，并反馈到系统建设数据埋点，从而形成闭环。这一步回答的是“多少（How
    much）”的问题。


    表8-4是离职预测人才保留的示例表，HR从业者可根据智慧洞察采取有效行动。


    ![](Images/cutq_235_21439_m.jpg)


    图8-13　盘点绩效与能力的九宫格示意图


    表8-4　离职预测人才保留的示例表


    ![](Images/table_image_235_0.jpg)


    ### [四、大数据分析的四个层次](../Text/contents.xhtml#c_109)


    第一个层次是描述性分析。在这个层次要解决“发生了什么”这个问题，也就是对客观事实进行描述，分析结果要能够回答“谁（who）”“什么（what）”“地点（where）”和“时间（when）”这几个问题。对应的是DIKWA模型中的数据和信息层。


    【延伸】大部分企业的人力资源分析报表都停留在这一层，这就是企业管理者总是对HR从业者的工作感到不满意的原因：HR从业者告诉管理者的都是后者已知的事实。


    第二个层次是诊断性分析。在这个层次要解决“为什么会发生”这个问题。对应的是DIKWA模型中的知识层。


    【延伸】此时业务部门的管理者开始关注HR从业者的意见，因为后者可以帮助业务部门厘清事情之间的关系。


    第三个层次是预测性分析。在这个层次要解决“什么可能会发生”这个问题，HR从业者运用统计、建模和数据挖掘等技巧，通过分析现有数据和历史数据发现规律并预测未来。分析的结果要能够回答“如何（How）”“为什么（Why）”这两个问题。对应的是DIKWA模型中的智慧层。


    【延伸】到了这个层次，业务部门的管理者已经离不开人力资源部的支持了。


    第四个层次是处方性分析。在这个层次要解决“该做些什么”这个问题。HR从业者将在描述性分析和预测性分析两个层次积累的经验，用于为业务部门提供建议和解决问题的方案。在这个分析过程中，HR从业者需要考虑问题的背景、商业规则、计算机建模和算法等。对应的是DIKWA模型中的行动层。


    【延伸】从此，人力资源部与业务部门真正形成了伙伴关系。


    以上四个层次的分析逻辑清晰、层层递进，如图8-14所示。在此之后，HR从业者就可以对企业管理者的决策和行动提供有力的支撑了。


    ![](Images/cutq_237_27229_l.jpg)


    图8-14　大数据分析的四个层次


    ### [五、人力资源大数据预测的三个应用层面](../Text/contents.xhtml#c_110)


    我们在医院体检时就会发现，虽然化验血常规和做核磁这两种检查的形式不一样，但目的都是一样的，就是找出潜在的“病因”，请医生对症下药。人力资源管理者要用大数据技术找出“病因”，为企业管理者提供解决方案，这个工作有以下三个应用层面。


    第一个层面，HRBP相当于医生，拿到大数据预测报告后结合自己对员工的了解开出“处方”。


    第二个层面，建立员工标签体系，分为官方标签（HR专员、HR主管赋予的标签、获得的奖惩）、民间标签（互评）和隐形标签（大数据分析行为得到的结果）。大数据技术与标签体系相结合，直接为HRBP输出建议报告，即“处方”。


    第三个层面，建立神经网络体系，利用人工智能技术在合规合理的范围内建立人才数据分析模型及决策支持系统，直接开出“处方”（此时系统平台建设已经到了智慧HR阶段，已形成人才智库）。'
  fmt: "\n## 第一节 人力资源管理发展阶段\n\n### 一、1.0阶段：线上化（MIS）\n\n人事管理阶段的特征主要是行政职能，关键词是“办手续”。在这个阶段，人事部主要处理日常事务，其中大多是琐碎事务。工作内容包括办理入职、日常考勤、工资发放、办理离职、开证明等。\n\
    \n处于人事管理阶段的企业对信息技术的要求是实现人事服务的线上化，这就是人力资源信息化的初级阶段：1.0线上化阶段（MIS）。管理信息系统（Management\
    \ Information System，MIS）就是将人力资源各个模块从线下搬到了线上。这个阶段的工作主要是满足人事服务的线上处理需求，如提供算薪、缴纳社保公积金、入离调转等基础服务，核心是实现薪酬的自动计算，关键词是“数清人、发对薪、算总包”。数清人即通过报表准确地统计出公司员工的基本构成与分布情况；发对薪即通过系统正确地计算并发出工资、奖金；算总包即能够统计出集团总部、各事业部及分公司的人员编制预算与人力成本。\n\
    \n### 二、2.0阶段：信息化\n\n人力资源管理阶段的主要特征是强调以“工作”为核心，关键词是“六大模块”，该阶段更看重如何通过六大模块使员工能够胜任岗位要求并高效地完成工作。六大模块是指人力资源规划、招聘、培训、薪酬、绩效、员工关系，各个模块之间是相互独立的。1993年，中国人民大学劳动人事学院率先将人事管理专业改为人力资源管理专业。从那时起，中国企业也开始从人事管理转向人力资源管理。1997年，戴维·尤里奇提出了三支柱模型，即HRBP、HRCOE、HRSSC。由此推动中国人力资源管理经历了一个快速发展、创新与变革的时期，三支柱也随着时代发展及技术驱动不断地演变与发展着。\n\
    \n处于人力资源管理阶段的企业对信息技术的要求是实现人力资源管理的信息化，即大家常说的eHR，这个阶段的关键词是“流程、合规、效率”，此阶段人力资源的主要业务流程就是十个字：入离升降调、选用育留管。人力资源信息化就是要从人力资源管理的全生命周期出发，进行业务流程梳理与诊断、流程再造设计与优化，链接与集成人力资源业务活动中的各种信息，实现人力资源内外部信息的共享和有效利用，各个模块要互联互通，流程与系统要实现端到端打通，确保业务流程合规，提升整体运营效率，满足管理诉求。\n\
    \n在此阶段，HRSSC开始利用系统提升服务效率，如很多头部企业利用技术手段升级改造了HRSSC，打造了一站式服务平台，目标是简化流程、提升效率。\n\n\
    ### 三、3.0阶段：数字化\n\n战略人力资源管理阶段的特征是人力资源部逐渐成为业务部门的战略合作伙伴，其目标是支撑企业战略目标的实现，关键词是“三支柱”，HRBP、HRCOE、HRSSC都要围绕组织、人才、文化来支撑企业战略，实现业绩增长。在此阶段，人力资源副总裁（HRVP）等角色开始出现，并进入企业核心管理层，使人力资源管理工作对业务产生了一定的影响。\n\
    \n![](Images/cutq_222_49282_l.jpg)\n\n图8-3　三支柱模型\n\n处于战略人力资源管理阶段的企业对信息技术的要求是实现人力资源的数字化（DHR）转型，关键词是“组织效能、用户体验”。该阶段对人力资源部的要求是明确数字化思维与认知。\n\
    \n数字化转型是利用数字化技术和能力驱动组织商业模式创新及商业生态系统重构的途径与方法，目的是实现业务的转型、创新与增长。数字化转型的核心是业务转型，技术是数字化转型的基石，简言之，数字化转型就是企业利用技术彻底改变经营业绩。\n\
    \n![](Images/cutq_223_56564_m.jpg)\n\n图8-4　三支柱支撑企业的业务战略\n\n人力资源数字化就是利用数字化技术和能力重塑组织、人才与文化，促使企业业务实现快速增长。\n\
    \n![](Images/cutq_223_10793_l.jpg)\n\n图8-5　人力资源的数字化转型\n\n人力资源数字化可以从流程、系统、数据及用户体验四个层面来支撑组织、人才及文化。首先，流程需要合规高效、权责清晰；系统需要做到互联互通，兼具数据化、场景化、智能化；数据需要整合信息、分层呈现，从而达到预警预测、辅助决策的效果；用户体验则需要贯穿整个人力资源管理的生命周期，在设计流程、打造系统的同时将其融入其中。\n\
    \n随着大数据时代的到来，不确定性因素逐渐增多，企业面临着更为复杂的挑战，这就要求人力资源部能提供全方位的服务。例如，利用数字化技术重塑人力资源业务流程，构建一个全感知、全链接、全场景、全智能的数字平台；通过大数据分析进行预测预警、辅助决策，助力人力资源转型，加速业务发展。人力资源数字化是信息化的加速升级，将数字化的信息进行整合加工，通过多维分析、主题分析、预测分析为企业决策提供有效的数据支撑。数字化阶段的特点是移动化、智能化、大数据、云服务，目的是提高用户体验、全面提升组织效能。\n\
    \n![](Images/cutq_224_21112_l.jpg)\n\n图8-6　数字化HR平台架构\n\n数字化（DHR）阶段加速了三支柱的发展和系统落地，AI微应用开始在各种场景中实施，如一站式服务平台、机器人客服、简历职位智能双推、智能背景调查、机器人面试、合同电子签、AR培训、自助服务、人才画像、智慧大屏等。当然，每家企业的基因及发展历程不同，无论如何重塑三支柱，目的都是帮助企业实现业务的战略目标。\n\
    \n### 四、4.0阶段：智慧化（智慧HR）\n\n人力资本管理阶段的特征是把人才当作资本来管理，目标是实现企业发展过程中持续的人才供应，人才管理与组织能力已经成为企业的核心竞争优势，此阶段的关键词是“生态”。通常来讲，处于此阶段的企业已基本具备三条曲线的业务发展路径：第一条曲线是企业成熟业务，确保现金流；第二条曲线是企业发展中业务（即成长业务），产品或服务具备随时升级的潜力；第三条曲线是未来业务，探索未来趋势，使企业处于抢跑位置。这三条曲线的组织、人才、文化战略也是不同的。\n\
    \n表8-1　企业三条曲线的业务发展路径\n\n![](Images/table_image_226_0.jpg)\n\n与此同时，人力资源领域专家们的观点也在发生变化：戴维·尤里奇将人力资源胜任力从六脉神剑（2007年）不断迭代为九大角色模型（2016年），拉姆·查兰也从“分拆人力资源部”（2014年）转向“C3模型”（CEO、CFO、CHRO）（2019年）。中国企业的快速发展同样迫使中国的人力资源管理不断突破、不断进化。2017年可以被看作是中国人力资源管理实践的元年和分水岭，2017年之前中国人力资源学者看国外、学国外，2017年之后转向观察、学习国内头部企业的人力资源管理实践，尤其是向头部互联网企业学习。\n\
    \n此阶段的人力资源管理也开始进入智慧HR（iHR）阶段，智慧HR是数字化的高级阶段，关键词是“智库”。如果说信息化、数字化解决的是“点、线、面”的问题，那么随着大数据与人工智能的深入应用，智慧HR考虑的则是“体”的问题，它可以使“入离升降调、选用育留管”的各个环节具备灵敏感知能力、自适应学习能力和预测判断能力，同时将各场景下的管理实践通过“神经网络”触达并输送到大脑中枢，结合管理实践给出行动建议，最终形成智库。业务生产数据，数据驱动业务，二者不断迭代、循环上升。本阶段的特征是网状组织，目的是建立生态型组织，并可持续地支持企业多条曲线良性循环发展。\n\
    \n智慧HR提供了类似中后台能力的平台，集成了人力资源业务中台与数据中台，以小快灵、敏捷的小团队应对各种不确定性，通过神经网络洞察秋毫，发挥生态效能，赢得连续优势。\n\
    \n![](Images/cutq_227_29401_l.jpg)\n\n图8-7　智慧HR平台\n\n当然，每家企业的发展阶段不同，信息化程度也会有所不同。那么，人力资源的数字化转型能否在较短的时间内实现从线上化到信息化，再到数字化，最后实现智慧化的快速迭代升级呢？答案是肯定的，因为路径是清晰的。智慧HR平台可以通过两条连续的曲线实现穿越式敏捷迭代：第一条曲线是从“填坑”到“赋能”的穿越迭代，第二条曲线是从“赋能”到“引领”的穿越迭代。\n\
    \n![](Images/cutq_227_39887_l.jpg)\n\n图8-8　智慧HR平台的穿越式敏捷迭代\n\n## 第二节 大数据分析成熟度模型\n\
    \n### 一、Bersin人才分析成熟度模型\n\n人力资源研究公司Bersin & Associate（现属于德勤公司）于2012年推出的人才分析成熟度模型分为四级，各级含义如下。\n\
    \n![](Images/cutq_228_4678_l.jpg)\n\n图8-9　人才分析成熟度模型分级示意图\n\n1. **I级：应需分析**\n\n\
    \   本层级是基础报表，是衡量服务效率和合规性的运营性报表，典型的应用如下：\n   - （1）建立统一的数据字典：有统一的文档，明确数据源头、获取方式、定义、计算的细节等；\n\
    \   - （2）建立红、黄、绿可视化仪表盘：报表展现了人员构成与基本结构。\n\n2. **II级：主动分析**\n\n   本层级是高级报表，是服务于决策、多维分析和仪表盘的操作性报告，典型的应用如下：\n\
    \   - （1）改善多样性常规监测：建立常规监测体系，从招聘、识别、选拔、任用、晋升、激励、保留、流失等方面衡量企业的人才构成是否足够多样；\n   -\
    \ （2）建立标准，积累趋势数据：通过对比分析（如员工保留率、员工尽职调查、人员向上流动性等均低于标准值，则说明企业处于低迷状态）说服管理者增加投资；\n\
    \   - （3）为管理者建立红、黄、绿绩效管理数据，用于动态比较本团队和类似水平团队的绩效等。\n\n3. **III级：策略分析**\n\n   本层级特指分析服务，用于人群细分、统计分析、分析维度，目的是了解原因并提供可行的解决方案。典型的应用如下：\n\
    \   - （1）高潜力候选人分析：用一套算法就可以预测哪些候选人在入职后将有高绩效潜力；\n   - （2）高绩效员工价值量化：主管可以看到诸如“A”比“B”强N倍的数字，帮助主管预测谁将会成为人才；\n\
    \   - （3）鼓励协作的工作场所设计；\n   - （4）构建数据的可视化能力，用业务语言阐述分析结论；\n   - （5）为销售团队建立高绩效候选人识别模型；\n\
    \   - （6）用量化数据衡量经理人管理人才的能力，包括驱动、激励、改善绩效、保留等。把对经理人管理能力的考评融合、量化成为一个指数。\n\n4. **IV级：预测分析**\n\
    \n   本层级将开发预测模型、场景规划、风险分析与规避、战略规划相结合。典型的应用如下：\n   - （1）支持组织结构设计，用可视化方法观测管理幅度、人才流动模式，考量人才向上晋升或左右流动是否灵活；\n\
    \   - （2）支持人员编制预算，分析内部人才迁徙，洞察外部劳动力市场；\n   - （3）从岗位职能、项目、技能、特殊专业知识等方面，面向企业的未来业务远景制定规划，结合全球经济态势进行分析，对企业未来的人才缺口做好储备；\n\
    \   - （4）百度的智留辞，这是百度公司针对关键人才保留设计的离职预测模型。\n\n### 二、DIKW金字塔模型\n\n在信息管理、信息系统和知识管理学科中，最基本的模型就是数据信息知识智慧模型（Data-Information-Knowledge-Wisdom，DIKW）。DIKW模型是金字塔式结构。这一模型既体现了数据（Data）、信息（Information）、知识（Knowledge）和智慧（Wisdom）之间的关系，还展现了数据是如何一步步转化为信息、知识，乃至智慧的。\n\
    \n![](Images/cutq_231_52941_l.jpg)\n\n图8-10　DIKW模型的金字塔结构\n\n金字塔模型的底座最大，这一层是数据。数据（Data）在拉丁文中的原意是事实和已知。数据是一种原始的记录，没有经过加工和解释，反映了事物的客观状态，数据之间是分散和孤立的。\n\
    \n对数据进行系统组织、整理和分析之后得到信息。信息具有明确的目的性和使用性，能够回答“谁（who）”“什么（what）”“地点（where）”和“时间（when）”等问题。信息是数据上面的一层，来源于数据并高于数据，信息把特定的、孤立的数据联系了起来，数据和信息都是客观存在的。\n\
    \n在DIKW金字塔模型中，数据和信息的上层是知识。知识体现了信息的本质、原则和经验，能够指导任务的执行与管理，进行决策并解决问题。从数据到信息再到知识的过程，是数据不断变得有序、不断得到验证，并最终揭示固有规律的过程。\n\
    \n智慧是DIKW金字塔模型的最高一层。智慧是在知识的基础上形成的对事物的深刻认识和远见，体现为一种卓越的判断力，人们由此采取策略和行为。智慧是人类区别于其他生物和人工智能的重要特征（至少目前是如此）。知识和智慧都包含了智能的主观意识。\n\
    \n### 三、DIKWA模型\n\n在人工智能、大数据时代，人们首先要改变的是对新事物的认知，只有与时俱进、迭代升级才能跟上时代，与业务同频。因此，人们重新学习了DIKW金字塔模型，并在前辈的基础上，微创新迭代为DIKWA应用模型。该模型形成了闭环，用于指导并驱动人力资源大数据的应用发展。\n\
    \n![](Images/cutq_232_025_l.jpg)\n\n图8-11　DIKWA应用模型\n\nDIKWA模型与5W2H完美结合，诠释了人力资源大数据的应用之路，即整合信息、分析预测、做出判断、采取行动。\n\
    \n- **Data即数据**，在拉丁文中的原意是事实和已知。数据是一种原始的记录，没有经过加工和解释，反映了事物的客观状态，数据之间是分散和孤立的，描述的是客观事实。\n\
    \n  表8-2　某公司员工张三的基本数据\n\n  ![](Images/table_image_233_0.jpg)\n\n- **Information即信息**，把特定的、孤立的数据进行加工、整理之后得到信息，数据和信息都是客观存在的。信息具有明确的目的性和使用性，能够回答“谁（who）”“什么（what）”“地点（where）”和“时间（when）”等问题。\n\
    \n  表8-3　某公司员工张三的绩效与奖金信息\n\n  ![](Images/table_image_233_1.jpg)\n\n- **Knowledge即知识**。知识是对信息的提炼和归纳，体现了信息的本质、原则和经验，能够指导人们执行与管理任务，并进行决策和解决问题。通过数据挖掘，从数据中发现隐藏的趋势和不同寻常的关联规则就属于知识层面。从数据到信息再到知识的过程，是数据不断变得有序、不断得到验证，并最终揭示固有规律的过程。这一步主要回答“如何（How）”的问题。\n\
    \n  ![](Images/cutq_234_12344_l.jpg)\n\n  图8-12　进行人力资源各个模块的相关性分析\n\n- **Wisdom即智慧**。智慧是在知识的基础上形成的对事物的深刻认识和洞察，体现为卓越的判断力，人们由此制定策略和建议方案。知识和智慧都包含了智能的主观意识。人们通过数据挖掘、相关分析得到隐含的各种趋势，如离职预测、发展潜力、管理风险等。这一步主要回答“为什么（why）”的问题。\n\
    \n  ![](Images/cutq_235_21439_m.jpg)\n\n  图8-13　盘点绩效与能力的九宫格示意图\n\n- **Action即行动**。在智慧洞察的基础上，人们得到了几个解决方案，至于哪个方案更有效果，人们需要根据当时的情景做出决策，并采取正确的行动。当然，行动之后还要复盘，分析执行效果，并反馈到系统建设数据埋点，从而形成闭环。这一步回答的是“多少（How\
    \ much）”的问题。\n\n  表8-4　离职预测人才保留的示例表\n\n  ![](Images/table_image_235_0.jpg)\n\n\
    ### 四、大数据分析的四个层次\n\n**第一个层次是描述性分析。** 在这个层次要解决“发生了什么”这个问题，也就是对客观事实进行描述，分析结果要能够回答“谁（who）”“什么（what）”“地点（where）”和“时间（when）”这几个问题。对应的是DIKWA模型中的数据和信息层。\n\
    \n> **【延伸】** 大部分企业的人力资源分析报表都停留在这一层，这就是企业管理者总是对HR从业者的工作感到不满意的原因：HR从业者告诉管理者的都是后者已知的事实。\n\
    \n**第二个层次是诊断性分析。** 在这个层次要解决“为什么会发生”这个问题。对应的是DIKWA模型中的知识层。\n\n> **【延伸】** 此时业务部门的管理者开始关注HR从业者的意见，因为后者可以帮助业务部门厘清事情之间的关系。\n\
    \n**第三个层次是预测性分析。** 在这个层次要解决“什么可能会发生”这个问题，HR从业者运用统计、建模和数据挖掘等技巧，通过分析现有数据和历史数据发现规律并预测未来。分析的结果要能够回答“如何（How）”“为什么（Why）”这两个问题。对应的是DIKWA模型中的智慧层。\n\
    \n> **【延伸】** 到了这个层次，业务部门的管理者已经离不开人力资源部的支持了。\n\n**第四个层次是处方性分析。** 在这个层次要解决“该做些什么”这个问题。HR从业者将在描述性分析和预测性分析两个层次积累的经验，用于为业务部门提供建议和解决问题的方案。在这个分析过程中，HR从业者需要考虑问题的背景、商业规则、计算机建模和算法等。对应的是DIKWA模型中的行动层。\n\
    \n> **【延伸】** 从此，人力资源部与业务部门真正形成了伙伴关系。\n\n以上四个层次的分析逻辑清晰、层层递进。\n\n![](Images/cutq_237_27229_l.jpg)\n\
    \n图8-14　大数据分析的四个层次\n\n### 五、人力资源大数据预测的三个应用层面\n\n我们在医院体检时就会发现，虽然化验血常规和做核磁这两种检查的形式不一样，但目的都是一样的，就是找出潜在的“病因”，请医生对症下药。人力资源管理者要用大数据技术找出“病因”，为企业管理者提供解决方案，这个工作有以下三个应用层面。\n\
    \n1. **第一个层面**，HRBP相当于医生，拿到大数据预测报告后结合自己对员工的了解开出“处方”。\n2. **第二个层面**，建立员工标签体系，分为官方标签（HR专员、HR主管赋予的标签、获得的奖惩）、民间标签（互评）和隐形标签（大数据分析行为得到的结果）。大数据技术与标签体系相结合，直接为HRBP输出建议报告，即“处方”。\n\
    3. **第三个层面**，建立神经网络体系，利用人工智能技术在合规合理的范围内建立人才数据分析模型及决策支持系统，直接开出“处方”（此时系统平台建设已经到了智慧HR阶段，已形成人才智库）。\n"
  trans: "\n\n## Section 1 Stages of Human Resource Management Development\n\n###\
    \ 1. Stage 1.0: Online (MIS)\n\nThe Personnel Management Stage is characterized\
    \ primarily by administrative functions, with the keyword being \"processing procedures.\"\
    \ In this stage, the Personnel Department mainly handles daily affairs, most of\
    \ which are trivial tasks. The work content includes onboarding processing, daily\
    \ attendance, salary disbursement, offboarding processing, certificate issuance,\
    \ etc.\n\nEnterprises in the Personnel Management Stage require information technology\
    \ to realize the onlineization of personnel services. This is the primary stage\
    \ of HR informatization: Stage 1.0 Online (MIS). The Management Information System\
    \ (MIS) moves various HR modules from offline to online. The work in this stage\
    \ mainly meets the needs for online processing of personnel services, such as\
    \ providing basic services like payroll calculation, social security and provident\
    \ fund payment, onboarding/offboarding/transfer/promotion, etc. The core is to\
    \ achieve automatic payroll calculation, with the keywords being \"accurate headcount,\
    \ correct payroll, total package calculation.\" Accurate headcount means accurately\
    \ counting the company's basic employee composition and distribution through reports;\
    \ correct payroll means correctly calculating and disbursing wages and bonuses\
    \ through the system; total package calculation means being able to tally the\
    \ headcount budget and labor costs for the group headquarters, various business\
    \ units, and subsidiaries.\n\n### 2. Stage 2.0: Informatization\n\nThe Human Resource\
    \ Management Stage is characterized by an emphasis on being \"job-centric,\" with\
    \ the keyword being \"Six Modules.\" This stage focuses more on how to enable\
    \ employees to be competent for their positions and complete work efficiently\
    \ through the Six Modules. The Six Modules refer to HR Planning, Recruitment,\
    \ Training, Compensation, Performance, and Employee Relations; each module is\
    \ relatively independent. In 1993, the School of Labor and Human Resources at\
    \ Renmin University of China took the lead in changing the Personnel Management\
    \ major to Human Resource Management. Since then, Chinese enterprises have also\
    \ begun to shift from personnel management to human resource management. In 1997,\
    \ Dave Ulrich proposed the Three-Pillar Model, namely HRBP, HRCOE, and HRSSC.\
    \ This propelled Chinese HR management into a period of rapid development, innovation,\
    \ and transformation. The Three Pillars have also continued to evolve and develop\
    \ with the times and technological drivers.\n\nEnterprises in the Human Resource\
    \ Management Stage require information technology to realize the informatization\
    \ of HR management, commonly known as eHR. The keywords for this stage are \"\
    Process, Compliance, Efficiency.\" The main HR business processes in this stage\
    \ can be summarized in ten Chinese characters: \"Entry, Exit, Promotion, Demotion,\
    \ Transfer; Select, Use, Develop, Retain, Manage.\" HR informatization starts\
    \ from the full lifecycle of HR management, conducting business process review\
    \ and diagnosis, process redesign and optimization, linking and integrating various\
    \ information in HR business activities, realizing the sharing and effective utilization\
    \ of internal and external HR information. Modules must be interconnected, processes\
    \ and systems must achieve end-to-end connectivity, ensuring business process\
    \ compliance and improving overall operational efficiency to meet management demands.\n\
    \nIn this stage, HRSSC begins to utilize systems to improve service efficiency.\
    \ For example, many leading enterprises have used technical means to upgrade and\
    \ transform HRSSC, building a one-stop service platform with the goal of simplifying\
    \ processes and improving efficiency.\n\n### 3. Stage 3.0: Digitalization\n\n\
    The Strategic Human Resource Management Stage is characterized by the HR department\
    \ gradually becoming a strategic partner to business units. Its goal is to support\
    \ the realization of corporate strategic objectives, with the keyword being \"\
    Three Pillars.\" HRBP, HRCOE, and HRSSC must all revolve around Organization,\
    \ Talent, and Culture to support corporate strategy and achieve performance growth.\
    \ In this stage, roles such as HR Vice President (HRVP) begin to appear and enter\
    \ the core management of the enterprise, enabling HR management work to have a\
    \ certain impact on the business.\n\n![](img/cutq_222_49282_l.jpg)\n\nFigure 8-3\
    \ Three-Pillar Model\n\nEnterprises in the Strategic Human Resource Management\
    \ Stage require information technology to realize the digital transformation of\
    \ HR (DHR), with the keywords being \"Organizational Effectiveness, User Experience.\"\
    \ This stage requires the HR department to establish a clear digital mindset and\
    \ cognition.\n\nDigital transformation is the approach and method of utilizing\
    \ digital technologies and capabilities to drive organizational business model\
    \ innovation and business ecosystem reconstruction. The purpose is to achieve\
    \ business transformation, innovation, and growth. The core of digital transformation\
    \ is business transformation; technology is the cornerstone. Simply put, digital\
    \ transformation is the enterprise's use of technology to fundamentally change\
    \ business performance.\n\n![](img/cutq_223_56564_m.jpg)\n\nFigure 8-4 Three Pillars\
    \ Supporting Corporate Business Strategy\n\nHR Digitalization is the use of digital\
    \ technologies and capabilities to reshape Organization, Talent, and Culture,\
    \ driving rapid growth in corporate business.\n\n![](img/cutq_223_10793_l.jpg)\n\
    \nFigure 8-5 HR Digital Transformation\n\nHR Digitalization can support Organization,\
    \ Talent, and Culture from four levels: Process, System, Data, and User Experience.\
    \ First, processes need to be compliant, efficient, with clear authority and responsibility;\
    \ systems need to be interconnected, possessing data-driven, scenario-based, and\
    \ intelligent characteristics; data needs to integrate information and present\
    \ it in layers, thereby achieving early warning, prediction, and decision support\
    \ effects; user experience needs to run through the entire HR management lifecycle,\
    \ integrating it into the design of processes and the building of systems.\n\n\
    With the advent of the Big Data era, uncertainty factors have gradually increased,\
    \ and enterprises face more complex challenges. This requires the HR department\
    \ to provide comprehensive services. For example, using digital technologies to\
    \ reshape HR business processes and build a digital platform that is fully perceptive,\
    \ fully connected, fully scenario-based, and fully intelligent; conducting predictive\
    \ early warning and decision support through big data analysis to assist HR transformation\
    \ and accelerate business development. HR Digitalization is an accelerated upgrade\
    \ of Informatization, integrating and processing digital information, providing\
    \ effective data support for corporate decision-making through multi-dimensional\
    \ analysis, thematic analysis, and predictive analysis. The characteristics of\
    \ the Digitalization stage are Mobility, Intelligence, Big Data, and Cloud Services,\
    \ aiming to improve user experience and comprehensively enhance organizational\
    \ effectiveness.\n\n![](img/cutq_224_21112_l.jpg)\n\nFigure 8-6 Digital HR Platform\
    \ Architecture\n\nThe Digitalization (DHR) stage accelerated the development and\
    \ system implementation of the Three Pillars. AI micro-applications began to be\
    \ implemented in various scenarios, such as one-stop service platforms, robot\
    \ customer service, intelligent dual recommendation for resumes and positions,\
    \ intelligent background checks, robot interviews, electronic contract signing,\
    \ AR training, self-service, talent profiling, intelligent dashboards, etc. Of\
    \ course, every enterprise has different genes and development histories; no matter\
    \ how the Three Pillars are reshaped, the purpose is to help the enterprise achieve\
    \ its strategic business goals.\n\n### 4. Stage 4.0: Intelligentization (Intelligent\
    \ HR / iHR)\n\nThe Human Capital Management Stage is characterized by managing\
    \ talent as capital. The goal is to achieve sustainable talent supply during enterprise\
    \ development. Talent management and organizational capabilities have become the\
    \ core competitive advantages of the enterprise. The keyword for this stage is\
    \ \"Ecosystem.\" Generally speaking, enterprises in this stage have basically\
    \ developed a three-curve business development path: The first curve is the mature\
    \ business, ensuring cash flow; the second curve is the developing business (growth\
    \ business), where products or services have the potential for upgrades at any\
    \ time; the third curve is the future business, exploring future trends to keep\
    \ the enterprise in a leading position. The organizational, talent, and cultural\
    \ strategies for these three curves are also different.\n\nTable 8-1 Three-Curve\
    \ Business Development Path of Enterprises\n\n![](img/table_image_226_0.jpg)\n\
    \nAt the same time, the views of HR domain experts are also changing: Dave Ulrich\
    \ iterated HR competencies from the \"Six Meridians Sword\" (2007) to the \"Nine\
    \ Roles Model\" (2016); Ram Charan shifted from \"Splitting the HR Department\"\
    \ (2014) to the \"C3 Model\" (CEO, CFO, CHRO) (2019). The rapid development of\
    \ Chinese enterprises has equally forced Chinese HR management to continuously\
    \ break through and evolve. 2017 can be regarded as the inaugural year and watershed\
    \ for Chinese HR management practice. Before 2017, Chinese HR scholars looked\
    \ abroad and learned from abroad; after 2017, they turned to observing and learning\
    \ from the HR management practices of domestic leading enterprises, especially\
    \ leading Internet companies.\n\nHR management in this stage has also entered\
    \ the Intelligent HR (iHR) phase. Intelligent HR is the advanced stage of Digitalization,\
    \ with the keyword being \"Think Tank.\" If Informatization and Digitalization\
    \ solve \"Point, Line, Plane\" problems, then with the deep application of Big\
    \ Data and Artificial Intelligence, Intelligent HR considers the \"Body\" problem.\
    \ It enables every link of \"Entry, Exit, Promotion, Demotion, Transfer; Select,\
    \ Use, Develop, Retain, Manage\" to possess sensitive perception capabilities,\
    \ adaptive learning capabilities, and predictive judgment capabilities. Simultaneously,\
    \ it delivers management practices from various scenarios to the brain center\
    \ through \"Neural Networks,\" combines them with management practices to give\
    \ action recommendations, and ultimately forms a Think Tank. Business generates\
    \ data, data drives business; the two continuously iterate and spiral upward.\
    \ The characteristic of this stage is a Networked Organization, aiming to build\
    \ an Ecosystem Organization and sustainably support the virtuous cycle development\
    \ of multiple corporate curves.\n\nIntelligent HR provides a platform with middle-office-like\
    \ capabilities, integrating the HR Business Middle Office and Data Middle Office.\
    \ It uses small, fast, agile teams to respond to various uncertainties, gains\
    \ insights through neural networks, exerts ecosystem effectiveness, and wins continuous\
    \ advantages.\n\n![](img/cutq_227_29401_l.jpg)\n\nFigure 8-7 Intelligent HR Platform\n\
    \nOf course, every enterprise is at a different development stage, and the degree\
    \ of informatization varies. So, can HR digital transformation achieve rapid iterative\
    \ upgrades from Online to Informatization, then to Digitalization, and finally\
    \ to Intelligentization in a short time? The answer is yes, because the path is\
    \ clear. The Intelligent HR platform can achieve cross-era agile iteration through\
    \ two continuous curves: The first curve is the cross-iteration from \"Pit Filling\"\
    \ to \"Empowerment\"; the second curve is the cross-iteration from \"Empowerment\"\
    \ to \"Leadership.\"\n\n![](img/cutq_227_39887_l.jpg)\n\nFigure 8-8 Cross-Era\
    \ Agile Iteration of Intelligent HR Platform\n\n## Section 2 Big Data Analysis\
    \ Maturity Models\n\n### 1. Bersin Talent Analytics Maturity Model\n\nThe Talent\
    \ Analytics Maturity Model launched by HR research firm Bersin & Associates (now\
    \ part of Deloitte) in 2012 is divided into four levels, with the meanings of\
    \ each level as follows.\n\n![](img/cutq_228_4678_l.jpg)\n\nFigure 8-9 Schematic\
    \ Diagram of Talent Analytics Maturity Model Levels\n\n1. **Level I: Reactive\
    \ Analysis**\n\n   This level is Basic Reporting, which are operational reports\
    \ measuring service efficiency and compliance. Typical applications include:\n\
    \   - (1) Establishing a Unified Data Dictionary: Having unified documentation\
    \ clarifying data sources, acquisition methods, definitions, calculation details,\
    \ etc.;\n   - (2) Establishing Red/Yellow/Green Visualization Dashboards: Reports\
    \ display personnel composition and basic structure.\n\n2. **Level II: Proactive\
    \ Analysis**\n\n   This level is Advanced Reporting, which are operational reports\
    \ serving decision-making, multi-dimensional analysis, and dashboards. Typical\
    \ applications include:\n   - (1) Improving Diversity Routine Monitoring: Establishing\
    \ a routine monitoring system to measure whether the enterprise's talent composition\
    \ is sufficiently diverse from aspects such as recruitment, identification, selection,\
    \ appointment, promotion, incentive, retention, and turnover;\n   - (2) Establishing\
    \ Standards and Accumulating Trend Data: Persuading management to increase investment\
    \ through comparative analysis (e.g., if employee retention rate, employee due\
    \ diligence, upward mobility, etc., are all below standard values, it indicates\
    \ the enterprise is in a slump);\n   - (3) Establishing Red/Yellow/Green Performance\
    \ Management Data for Managers, used for dynamic comparison of the performance\
    \ of their own team and similar-level teams.\n\n3. **Level III: Strategic Analysis**\n\
    \n   This level specifically refers to Analysis Services, used for population\
    \ segmentation, statistical analysis, and analytical dimensions. The purpose is\
    \ to understand causes and provide actionable solutions. Typical applications\
    \ include:\n   - (1) High-Potential Candidate Analysis: An algorithm can predict\
    \ which candidates will have high-performance potential after joining;\n   - (2)\
    \ Quantification of High-Performer Value: Managers can see figures like \"A is\
    \ N times stronger than B,\" helping managers predict who will become talent;\n\
    \   - (3) Workplace Design Encouraging Collaboration;\n   - (4) Building Data\
    \ Visualization Capabilities, articulating analytical conclusions in business\
    \ language;\n   - (5) Establishing High-Performer Identification Models for Sales\
    \ Teams;\n   - (6) Using Quantified Data to Measure Managers' Talent Management\
    \ Capabilities, including driving, motivating, improving performance, retention,\
    \ etc. Integrating and quantifying the evaluation of managers' management capabilities\
    \ into an index.\n\n4. **Level IV: Predictive Analysis**\n\n   This level combines\
    \ the development of predictive models, scenario planning, risk analysis and avoidance,\
    \ and strategic planning. Typical applications include:\n   - (1) Supporting Organizational\
    \ Structure Design, using visualization methods to observe Span of Control and\
    \ Talent Flow Patterns, assessing whether talent promotion or lateral movement\
    \ is flexible;\n   - (2) Supporting Headcount Budgeting, analyzing internal talent\
    \ migration, and gaining insights into the external labor market;\n   - (3) Planning\
    \ for the enterprise's future business prospects from aspects such as Job Functions,\
    \ Projects, Skills, and Specialized Expertise, combining global economic trends\
    \ for analysis, and reserving talent for future enterprise talent gaps;\n   -\
    \ (4) Baidu's \"Zhi Liu Ci\" (Smart Retention/Resignation Prediction), a resignation\
    \ prediction model designed by Baidu for key talent retention.\n\n### 2. DIKW\
    \ Pyramid Model\n\nIn the disciplines of Information Management, Information Systems,\
    \ and Knowledge Management, the most fundamental model is the Data-Information-Knowledge-Wisdom\
    \ (DIKW) Model. The DIKW Model is a pyramid structure. This model not only reflects\
    \ the relationship between Data, Information, Knowledge, and Wisdom but also demonstrates\
    \ how data is transformed step by step into Information, Knowledge, and even Wisdom.\n\
    \n![](img/cutq_231_52941_l.jpg)\n\nFigure 8-10 Pyramid Structure of DIKW Model\n\
    \nThe base of the pyramid is the largest; this layer is Data. Data (Data) in Latin\
    \ originally means facts and givens. Data is a raw record, unprocessed and uninterpreted,\
    \ reflecting the objective state of things. Data points are discrete and isolated.\n\
    \nInformation is obtained after systematic organization, collation, and analysis\
    \ of data. Information has clear purposefulness and usability, capable of answering\
    \ questions such as \"Who,\" \"What,\" \"Where,\" and \"When.\" Information is\
    \ a layer above Data, originating from Data but higher than Data. Information\
    \ connects specific, isolated data points. Both Data and Information exist objectively.\n\
    \nIn the DIKW Pyramid Model, the layer above Data and Information is Knowledge.\
    \ Knowledge embodies the essence, principles, and experience of Information. It\
    \ can guide task execution and management, decision-making, and problem-solving.\
    \ The process from Data to Information to Knowledge is a process of Data becoming\
    \ increasingly ordered, continuously verified, and ultimately revealing inherent\
    \ laws.\n\nWisdom is the highest layer of the DIKW Pyramid Model. Wisdom is a\
    \ profound understanding and foresight of things formed on the basis of Knowledge,\
    \ manifested as exceptional judgment. People thereby adopt strategies and behaviors.\
    \ Wisdom is an important characteristic distinguishing humans from other organisms\
    \ and Artificial Intelligence (at least for now). Both Knowledge and Wisdom contain\
    \ the subjective consciousness of Intelligence.\n\n### 3. DIKWA Model\n\nIn the\
    \ era of Artificial Intelligence and Big Data, the first thing people must change\
    \ is their cognition of new things. Only by keeping pace with the times and iterating\
    \ upgrades can they keep up with the era and resonate with business. Therefore,\
    \ people re-learned the DIKW Pyramid Model and, on the basis of predecessors,\
    \ micro-innovated and iterated it into the DIKWA Application Model. This model\
    \ forms a closed loop, used to guide and drive the application development of\
    \ HR Big Data.\n\n![](img/cutq_232_025_l.jpg)\n\nFigure 8-11 DIKWA Application\
    \ Model\n\nThe DIKWA Model combines perfectly with 5W2H, interpreting the application\
    \ path of HR Big Data: Integrate Information, Analyze and Predict, Make Judgments,\
    \ Take Action.\n\n- **Data (Data)**: In Latin, the original meaning is facts and\
    \ givens. Data is a raw record, unprocessed and uninterpreted, reflecting the\
    \ objective state of things. Data points are discrete and isolated, describing\
    \ objective facts.\n\n  Table 8-2 Basic Data of Employee Zhang San of a Company\n\
    \n  ![](img/table_image_233_0.jpg)\n\n- **Information (Information)**: Information\
    \ is obtained after processing and collating specific, isolated data. Both Data\
    \ and Information exist objectively. Information has clear purposefulness and\
    \ usability, capable of answering \"Who,\" \"What,\" \"Where,\" and \"When.\"\n\
    \n  Table 8-3 Performance and Bonus Information of Employee Zhang San of a Company\n\
    \n  ![](img/table_image_233_1.jpg)\n\n- **Knowledge (Knowledge)**: Knowledge is\
    \ the refinement and induction of Information. It embodies the essence, principles,\
    \ and experience of Information. It can guide people to execute and manage tasks,\
    \ and make decisions and solve problems. Discovering hidden trends and unusual\
    \ association rules from data through Data Mining belongs to the Knowledge level.\
    \ The process from Data to Information to Knowledge is a process of Data becoming\
    \ increasingly ordered, continuously verified, and ultimately revealing inherent\
    \ laws. This step mainly answers \"How.\"\n\n  ![](img/cutq_234_12344_l.jpg)\n\
    \n  Figure 8-12 Correlation Analysis of Various HR Modules\n\n- **Wisdom (Wisdom)**:\
    \ Wisdom is a profound understanding and insight into things formed on the basis\
    \ of Knowledge. It is manifested as exceptional judgment. People thereby formulate\
    \ strategies and recommendations. Both Knowledge and Wisdom contain the subjective\
    \ consciousness of Intelligence. People obtain various implicit trends through\
    \ Data Mining and Correlation Analysis, such as Turnover Prediction, Development\
    \ Potential, Management Risks, etc. This step mainly answers \"Why.\"\n\n  ![](img/cutq_235_21439_m.jpg)\n\
    \n  Figure 8-13 Schematic Diagram of 9-Box Grid for Performance and Capability\
    \ Review\n\n- **Action (Action)**: Based on Wisdom Insights, people obtain several\
    \ solutions. As to which solution is more effective, people need to make decisions\
    \ based on the situation at the time and take correct actions. Of course, after\
    \ the action, a review is still needed to analyze the execution effect and feed\
    \ it back to system construction data tracking points, thereby forming a closed\
    \ loop. This step answers \"How Much.\"\n\n  Table 8-4 Example Table of Talent\
    \ Retention Based on Turnover Prediction\n\n  ![](img/table_image_235_0.jpg)\n\
    \n### 4. Four Levels of Big Data Analysis\n\n**The First Level is Descriptive\
    \ Analysis.** At this level, the problem to be solved is \"What Happened,\" i.e.,\
    \ describing objective facts. The analysis results must be able to answer \"Who,\"\
    \ \"What,\" \"Where,\" and \"When.\" This corresponds to the Data and Information\
    \ layers in the DIKWA Model.\n\n> **[Extension]** Most enterprises' HR Analysis\
    \ Reports stay at this level. This is the reason why enterprise managers are often\
    \ dissatisfied with HR practitioners' work: HR practitioners tell managers facts\
    \ that the latter already know.\n\n**The Second Level is Diagnostic Analysis.**\
    \ At this level, the problem to be solved is \"Why Did It Happen.\" This corresponds\
    \ to the Knowledge Layer in the DIKWA Model.\n\n> **[Extension]** At this point,\
    \ Business Department Managers begin to pay attention to HR Practitioners' opinions\
    \ because the latter can help the Business Department clarify the relationships\
    \ between things.\n\n**The Third Level is Predictive Analysis.** At this level,\
    \ the problem to be solved is \"What Will Happen.\" HR Practitioners use techniques\
    \ such as Statistics, Modeling, and Data Mining to discover patterns through analysis\
    \ of current and historical data and predict the future. The analysis results\
    \ must be able to answer \"How\" and \"Why.\" This corresponds to the Wisdom Layer\
    \ in the DIKWA Model.\n\n> **[Extension]** At this level, Business Department\
    \ Managers can no longer do without the support of the HR Department.\n\n**The\
    \ Fourth Level is Prescriptive Analysis.** At this level, the problem to be solved\
    \ is \"What Should We Do.\" HR Practitioners will use the experience accumulated\
    \ at the Descriptive Analysis and Predictive Analysis levels to provide suggestions\
    \ and problem-solving solutions for Business Departments. In this analysis process,\
    \ HR Practitioners need to consider the Context of the Problem, Business Rules,\
    \ Computer Modeling, and Algorithms. This corresponds to the Action Layer in the\
    \ DIKWA Model.\n\n> **[Extension]** From then on, the HR Department and Business\
    \ Departments truly form a Partnership.\n\nThe analysis logic of the above four\
    \ levels is clear and progressive.\n\n![](img/cutq_237_27229_l.jpg)\n\nFigure\
    \ 8-14 Four Levels of Big Data Analysis\n\n### 5. Three Application Levels of\
    \ HR Big Data Prediction\n\nWe discover during hospital physical examinations\
    \ that although the two examination forms of Blood Routine and MRI are different,\
    \ their purposes are the same: to find potential \"Causes,\" and ask the doctor\
    \ to prescribe the right medicine. HR Managers must use Big Data Technology to\
    \ find the \"Causes\" and provide solutions for Enterprise Managers. This work\
    \ has the following three application levels.\n\n1. **The First Level**: HRBP\
    \ acts as the Doctor. After receiving the Big Data Prediction Report, they combine\
    \ it with their own understanding of the employee to issue a \"Prescription.\"\
    \n2. **The Second Level**: Establish an Employee Tag System, divided into Official\
    \ Tags (tags given by HR Specialists/Supervisors, rewards/punishments received),\
    \ Folk Tags (Peer Reviews), and Hidden Tags (results obtained from Big Data Analysis\
    \ of Behavior). The combination of Big Data Technology and the Tag System directly\
    \ outputs Recommendation Reports for HRBP, i.e., \"Prescriptions.\"\n3. **The\
    \ Third Level**: Establish a Neural Network System. Use Artificial Intelligence\
    \ Technology to build Talent Data Analysis Models and Decision Support Systems\
    \ within a Compliant and Reasonable Scope, directly issuing \"Prescriptions\"\
    \ (At this point, the System Platform construction has reached the Intelligent\
    \ HR Stage, having formed a Talent Think Tank).\n\n"
