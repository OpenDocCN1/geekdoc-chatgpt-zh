    ## [第四节　区块链在招聘环节的应用](../Text/contents.xhtml#b_33)


    从2008年开始，区块链技术逐渐被人们了解。区块链技术的发明人自称“中本聪”，其真实身份至今仍然是一个谜。区块链是一个分布式的共享账本和数据库，具有去中心化、不可篡改、全程留痕、可以追溯、集体维护、公开透明等特点。区块链的账本记录和数据库并不由单一主体控制，信息存储在每个区块链参与主体的计算机中。


    顾名思义，区块链是由一系列的“区块”构成的。每一个区块包括记录的数据、该区块的哈希值和前一个区块的哈希值。一旦一个区块在区块链上完成了上链，这个区块就不可更改了。根据区块链数据的隐私要求，区块链可以分为公有链、私有链和联盟链三类。公有链对所有人开放，所有用户都能访问和查看，比特币就是典型的公有链。私有链只对单独的主体开放，因此私有链可以提供更好的隐私保护和交易速度。私有链通常会在一个组织内部使用。联盟链处于公有链和私有链之间，对符合要求的特定主体开放。联盟链可以由多个机构共同管理，每个机构运行一个或多个节点，联盟链可以提供更加复杂的权限设置和管理。


    区块链技术在招聘环节中有着诸多的应用场景，具体内容如下。


    ### [一、招聘面试与简历筛选](../Text/contents.xhtml#c_34)


    据调查，超过50%的企业在申请人的简历中曾发现过虚假信息。在区块链技术发明之前，这一问题通常只能通过耗时且成本高昂的背景调查来解决。现在，区块链的信用机制、不可篡改性和可追溯的能力可以针对上述问题提供完美的解决方案，申请人的工作经历、教育背景和职业资质等信息上链之后，可以极大地降低背景调查的难度与成本，企业也不用通过第三方机构即可实现快速查询和验证。区块链甚至具备替代传统简历的潜力，申请人的学历、工作经验和培训证书等数据都能通过权威机构审核并上链来获得公信力。例如，2018年麻省理工学院（MIT）已经为学生提供了基于区块链技术的电子文凭，在此之后的MIT毕业生在求职过程中的学历认证工作就变得更加的安全和快捷，并且彻底消除了伪造MIT文凭的可能性。现在，越来越多的大学认识到这一方法的优势，在提供纸质文凭的同时，也为毕业生提供了基于区块链的电子文凭。


    同理，求职者与工作经历相关的数据也可以在雇主验证之后上链保存，进而保证所有上链信息的真实性。更重要的是，区块链可以提供颗粒度更细的、包括正面和负面的求职者信息，包括求职者晋升或降职的经历、技能水平和获得的奖项荣誉等，可以帮助面试官更加全面地了解求职者。


    ### [二、HR流程优化](../Text/contents.xhtml#c_35)


    区块链技术能够彻底改变和改进招聘经理的许多日常事务流程。可优化的流程如下。


    1.工资管理


    区块链有助于彻底改变工资管理的方式。区块链技术可以降低人为错误出现的概率，同时这个过程的自动化也会提升工作效率、节省工作时间。企业可以利用区块链技术跟踪与工资管理相关的考勤、加班和出差信息，而且能够进行福利管理。


    2.智能合约


    未来，基于区块链的智能合约将会逐渐替代纸质合同。智能合约定义了交易条款，明确了违背交易条款而产生的处罚性后果。因为区块链上的智能合约本质上就是一段代码，代码中的条件语句被用来设计在特定条件下执行的合约内容。智能合约可以应用于人力资源管理工作的多个场景。在灵活用工方面，当员工完成合约规定的工作内容或工作时间后，区块链就可以自动给员工发放薪酬；在入职方面，当员工完成了背景调查并提交了符合合约规定的文件后，他们就可以获得访问企业系统的权限；在个税和社保方面，智能合约可以根据政策法规及员工薪酬批量化的完成情况计算缴纳个税和社保的金额。


    大型科技公司会利用自身的技术优势在公司内部应用区块链技术，市场上也有越来越多的公司能够提供区块链产品和服务。Aworker公司构建了区块链平台服务于招聘工作；Indorse是利用区块链技术构建的IT专业人员网络，主要提供IT专业技能的测试、评估和认证。在灵活用工方面，ChronoBank为自由职业者和用工方提供了一个基于区块链技术的短期工作招聘平台，该平台上既没有监管人也没有传统的金融系统，自由职业者可以在平台上完成工作。ChronoBank开发了智能合约平台LaborX。雇主通过LaborX发布用工需求和工作信息，自由职业者可以在任何时间、任何地点通过该平台找工作。目前的工作内容主要是短期工作类型，包括建筑、清洁、运输和电子商务等。LaborX平台只收取1%的费用，远低于传统职业中介机构的收费标准。ChronoBank提供了一个新的灵活用工的商业模式，可以通过成本更低、速度更快的方式匹配自由职业者和用工需求；同时，这种模式在税收、社保和用工安全方面也带来了新的挑战。


    # [第三章　人工智能在用才环节的应用](../Text/contents.xhtml#z_8)


    ## [第一节　人员编制与人力成本预算的常用方法](../Text/contents.xhtml#b_36)


    人力资源规划中的一项重要工作就是人员编制与人力成本预算。人员编制的英文是Headcount，简称HC，外企常说HC管理，国企则说人员编制。人员编制是指企业的人员配置计划，是企业根据自身业务发展情况及组织结构与组织能力等调整人员增减计划的工作。简单地说，人员编制就是编制人员预算和人员招聘计划等。


    人员编制与人力成本预算往往是管理者的工作难点，他们要考虑企业共需要多少人？每条业务线、每个岗位、每个级别分别需要多少人？每个部门需要多少人？当企业规模小的时候，管理者可以亲自管理这些工作，但随着团队规模越来越大，管理者就需要依靠机制、体系与方法了。


    HR从业者需要利用大数据挖掘技术搜索、收集、调用内/外部信息（如企业当前经营数据、历史经营数据、政策调整内容等），在对这些信息进行加工处理与建模分析后建立模拟计算器，模拟各条业务线、产品线可能发生的人员成本波动、绩效变动及人员流动的情景，综合分析得出现有组织内部人力使用情况和人力成本报告，并对其合理性进行评估。HR从业者可以根据评估结果对企业未来的人员编制和人力成本做出预测及调整建议，供企业管理层参考。


    ### [一、预算编制的步骤](../Text/contents.xhtml#c_37)


    一般情况下，预算编制工作有六个步骤，即目标预测、中长期规划、年度业务计划、预算编制、跟踪分析和绩效考核，如图3-1所示，这六个步骤与目标紧密联系、协调一致。


    ![](Images/cutq_82_3566_m.jpg)


    图3-1　预算编制的步骤


    1.目标预测，即进行短、中、长期的市场和投资需求预测，目的是设定目标和及时调整目标。目标预测的原则是远粗近细，也就是说，在设定长期目标时可以粗放一些，在设定短期目标时则要细致、准确一些。年度预测要落实到具体产品和业务上。


    2.中长期规划，即企业层面的中长期的综合业务规划，包括战略规划、市场规划、业务/产品规划、IT规划、人力资源规划等，这些规划用于指导业务部门明确工作重点及方向。


    3.年度业务计划，即企业各级管理层为下级单位设定分解后的业务目标，各级业务单位根据目标制订业务计划、提出投资需求。


    4.预算编制，即根据设定的目标及详细的工作计划预测完成这些目标、计划所需要的HC资源（含不同的产品线、不同的业务线、不同的岗位、不同的级别、不同的地域等）和人工成本，编制年度预算。


    5.跟踪分析，客观、准确、及时地记录企业发生的业务活动，将实际发生的核算与预算进行差异化分析（如典型的Curve分析），关注“例外”事项的管理，同时将结果汇报给相应的管理层。


    6.绩效考核，根据目标完成情况和企业的激励制度进行业绩评估，奖励那些完成或超额完成目标的业务人员和管理层。


    ### [二、预算编制的周期](../Text/contents.xhtml#c_38)


    在实际操作过程中，预算编制是按照财年进行的，90%左右的企业按照自然年度（从1月1日到12月31日为一个财年）编制预算，少数企业是将4月1日到次年3月31日作为一个财年来编制预算。无论采用哪种方式，HC预算编制的重要工作就是做好人才供需规划与人力成本预算。


    图3-2是以自然年度为财年进行预算编制的。企业将年度预算细分为月度预算与季度预算。第一季度末进行3+9预算调整，第二季度末进行6+6预算调整，第三季度末进行9+3预算调整，第四季度进行全年收尾预算核查，同时开始制作明年的预算。这一轮循环以分期递进预算控制的形式进行精细化管理，确保年度预算目标的实现。


    ![](Images/cutq_83_41660_l.jpg)


    图3-2　以自然年度为财年进行预算编制


    以某公司的年度预算为例，人力成本预算的计算方式如下。首先，人力成本预算需要用到以下公式：


    √YTQ（Year to Q，年初到季度末）=Q1至当前Q的累计值；


    √人力成本预估占比=人力成本预估/人力成本预算×100%


    √（YTQ）人力成本预估占比=（YTQ）人力成本预估/（YTQ）人力成本预算×100%


    （注：95%是风险警戒线；若≥95%，则以红色显示预警）


    √（全年）人力成本预估占比=（YTQ）人力成本预估/（全年）人力成本预算×100%


    最后，人力成本预算的结果可通过表3-1表示。


    表3-1中的数据来源于该公司的人力资源部和财务部。以该公司智行事业部2019年第四季度（Q4）预算为例，因为第四季度也是处于年末，所以第四季度的YTQ人力成本预算等同于2019年的年度人力成本预算，都是34,507,084.12元。


    季度人力成本预估占比=季度人力成本预估/季度人力成本预算×100%


    \=3,153,797.33/5,459,798.14×100%


    \=57.76%


    （YTQ）人力成本预估占比=（YTQ）人力成本预估/（YTQ）人力成本预算×100%


    \=32,201,083.31/34,507,084.12×100%


    \=93.32%


    （全年）人力成本预估占比=（YTQ）人力成本预估/（全年）人力成本预算×100%


    \=32,201,083.31/34,507,084.12×100%


    \=93.32%


    表3-1　某公司的人力成本预算结果


    ![](Images/table_image_85_0.jpg)


    以上均未超出风险警戒线95%，成本支出在合理范围内，系统显示正常。


    ### [三、预算编制的模式](../Text/contents.xhtml#c_39)


    预算编制通常有以下三种模式。


    1.自上而下的模式


    有些企业在编制预算时采取的是自上而下的模式，即由上级制定关键财务指标。例如，集团给子公司制定要完成的收入额、利润率指标，子公司自行分解预算指标；集团制定总额指标，不干涉子公司的月度预算、分产品预算。华为公司有着比较完善的IT系统，打通了财务部门与业务部门的联系（所谓业财一体化平台），所以华为采取的就是自上而下的预算编制方式。自上而下模式的优点是效率高。


    2.自下而上的模式


    有些企业在编制预算时采取的是自下而上的模式，因为基层员工最了解自己的工作情况，据实填报可以让预算更加务实、更接地气。这里需要注意的是下级对自己工作的评估与上级对下级的期望未必一致。如果上级看到下级的预算后总在加码，下级便会在上报预算时给自己留出更多的空间，降低自己的考核压力。为了避免出现这种情况，企业在采取自下而上模式时的常用做法是调低产出值（即压低收入、利润和回款），调高支出值（即增加费用、采购等支出）。自下而上模式的优点是更加务实、执行性强。


    3.上下结合的模式


    由于自下而上模式和自上而下模式的预算编制模式各有利弊，因此大部分企业采取的是上下结合的模式。


    （1）下达目标。企业董事会或经理办公会根据企业发展战略和预算期经济形势，在决策的基础上提出下一年度的企业财务预算目标，包括销售目标、成本费用目标、利润目标和现金流量目标，并确定财务预算编制的政策，由预算管理层下达至各部门。


    （2）编制上报。各部门按照预算管理层下达的财务预算目标和政策，结合自身实际情况及预算的执行条件，提出本部门详细的财务预算方案并上报至企业财务管理部门。


    （3）审查平衡。企业财务管理部门对各部门上报的财务预算方案进行审查、汇总，提出专业性的建议。在审查、平衡的过程中，预算管理层应当进行充分协调，对发现的问题提出初步的调整意见，并反馈给各有关部门予以修正。


    （4）审议批准。企业财务管理部门在各部门修正、调整的基础上，编制企业财务预算方案，报预算管理层讨论。对不符合企业发展战略或财务预算目标的事项，预算管理层应当责成有关部门进一步修订、调整。在讨论、调整的基础上，企业财务管理部门正式编制企业年度财务预算草案，提交董事会或总经办审议批准。


    （5）下达执行。企业财务管理部门将董事会或总经办审批通过的年度总预算分解成一系列的指标，由预算管理层逐级下达至各部门执行。


    ### [四、预算编制的方法](../Text/contents.xhtml#c_40)


    企业确定各级岗位人员数量及编制人力成本预算的方法有很多种，不同的方法在复杂程度、准确程度、时间与成本等方面各有优劣势，也都有其适用的条件。在实际工作中，企业会综合运用多种方法进行测算与修正。下面概述企业常用的十种预算编制方法。


    1.预算控制法。通过人力成本预算控制在岗人数，而不是对某一部门的某一岗位的具体人数做硬性规定，这是企业常用的定编方法。部门负责人对本部门的业务目标、岗位设置和员工人数负责，在得到上级批准的预算范围内，可自行决定各岗位的具体人数。


    如果将人力成本预算与业务结果挂钩，则可进一步增强人员数量控制的弹性和满足业务发展需要的有效性。


    人数定额的计算公式如下：


    人数定额=人力成本总额（业务量×x%）/单位人力成本


    2.业务数据分析法。根据企业的历史业务数据和战略目标，确定企业未来一段时期的岗位人数。这里的业务数据包括销售收入、利润、市场占有率、人力成本等。业务数据分析法的具体应用如下：


    （1）HR从业者将企业的历史业务数据如销售收入、人力成本、毛利润等与战略目标进行比对，确定企业短期、中期、长期的员工编制人数；


    （2）将员工人数与历史业务数据进行回归分析，根据企业的短期、中期、长期战略目标确定相应的编制范围，再根据企业短期、中期、长期战略目标的数据确定人员编制。


    3.劳动效率测算法是指根据生产任务和员工的工作效率及出勤等因素计算岗位人数配备的方法，也是指根据工作量和劳动定额计算员工人数配置的方法。实行劳动定额的人员、以手工操作为主的岗位都适用这种方法，具体分为根据生产任务总量定额和根据时间定额测算两种方法，两个公式分别如下。


    人数定额=生产任务总量/（员工劳动定额×出勤率）


    人数定额=生产任务×时间定额/（工作时间×出勤率）


    4.业务流程分析法，即根据企业总的业务目标、岗位工作量、业务流程衔接确定各岗位编制人员比例：


    （1）根据企业总的业务目标确定单位时间流程中的总工作量，从而确定各岗位人员编制；


    （2）根据岗位工作量确定各个岗位单个员工的单位时间工作量，如单位时间生产的产品数量、单位时间处理的业务数量等，从而确定各岗位人员编制；


    （3）根据业务流程衔接，结合上一步骤的分析结果，确定各岗位编制人员比例。


    5.管理层/专家访谈法。通过管理层访谈，HR从业者可以获得以下信息：员工的工作量是否饱满、流程是否合理，以及员工编制调整的建议；预测员工在一段时间之后的流向是晋升（本部门内或跨部门晋升）还是调动、轮岗、离职等，统计各部门一段时间之后的员工数量。


    通过专家访谈，HR从业者可以获取以下信息：在国内所属行业企业和国外所属行业企业中，各种岗位类型人员的结构信息，包括管理层级和管理幅度等。


    6.人员结构比例确定法，即按照员工总数或某类员工数量的一定比例确定定编人数，如职能管理人员数量占比、业务管理人员数量占比、一般专业人员数量占比、产品研发人数量占比、销售人员数量占比等。


    7.标杆/同业比较法。参考标杆企业或同行业的其他企业里，某岗位人员与其他人员在编制上的比例，并保持这种比例关系的相对稳定。本方法更适合制定辅助类和支持性岗位的人员编制。企业采用这种方法时需要注意，应广泛收集同行企业的人员编制数据，保证将一定的调查数据作为分析依据，否则结果不一定准确。


    8.趋势预测法。综合分析历年的招聘情况（如招聘员工总量、地域分布、业务或产品线分布、层级分布、组织发展形态、晋升速度、管理幅度、员工离职率等），做出线性预测分析，得出企业用工总量是处于平稳发展状态、曲线发展状态还是爆发式发展状态的结论。通常来说，至少要有三年的完整数据才能够对比并做出预测分析，同时还要兼顾业务突发事件分析（如产品线的关停并转）、市场热点分析（如创业潮、新兴业务、颠覆性创新等）。


    9.成本控制法，即根据企业的人力成本总预算倒推计算招聘人员数量。人力成本包括人力资源的获取成本、开发成本、使用成本、保障成本和退出（离职）成本等。其中，人力资源获取成本中的招聘费用、录取费用、安置费用以及人力资源开发成本、人力资源使用成本、人力资源保障成本和人力资源退出成本中的离职补偿成本等都属于显性成本。相对地，隐性成本是指通过对其他成本的影响来增加组织运营成本的成本，如员工休病假或事假的缺勤成本、招聘筛选的机会成本、甄选错误造成的低效成本、未通过试用期人员离职造成的补充成本、离职前的低效成本、离职后的岗位空缺成本、低效的企业文化成本、流程不合理或审批链过长的效率成本等。在实际操作过程中，通常企业对显性成本的估算会多一些，如工资、五险一金、商业保险、奖金、调薪、福利费用、培训费用、招聘费用、离职补偿费等，从总预算分摊到各事业部、各个部门的预算，再倒推各个部门、各个层级能招聘多少人，从而预估总的招聘员工数量。当然，HR从业者利用大数据挖掘技术开展对隐性成本的分析，可以使人力成本预算制定得更加科学。目前，企业常用的做法是将显性成本乘以一个系数，得到人力资源总成本。


    10.双控模式法。由于趋势预测法与成本控制法各有利弊，企业可以将这两种方法结合起来使用，即形成双控模式，既控制了人员编制，又控制了人力成本。目前更精准的方式是HR从业者利用大数据挖掘技术实时分析显性成本和隐性成本，通过对组织结构、人员配比、人力成本、升降调转、绩效管理、离职管理等相关信息进行加工处理与建模分析，同时结合对外部数据的多维度分析，模拟可能发生的各种变化情景，对其合理性与风险进行评估，得出人才供需综合分析报告。


    总之，无论HR从业者采用什么方法，都需要有理有据地说服上级领导、用人部门和预算管理部门。


    ## [第二节　人力成本结构性预测、合理性判断](../Text/contents.xhtml#b_41)'
  fmt: "\n“数据+模型+可视化”是企业需要得到的预测性结果，如图2-10所示。当然，在不同的业务场景（如招聘、人才盘点、培训、离职等）下，算法模型也会有所不同。足够多的数据，加上精准的模型，再配合业务场景，HR从业者将有可能得到足够清晰的人才画像，这也是大数据的魅力所在。\n\
    \n![](`Images/cutq_75_18646_l.jpg`)\n\n图2-10　预测性结果的“公式”\n\n## 第四节　区块链在招聘环节的应用\n\
    \n从2008年开始，区块链技术逐渐被人们了解。区块链技术的发明人自称“中本聪”，其真实身份至今仍然是一个谜。区块链是一个分布式的共享账本和数据库，具有去中心化、不可篡改、全程留痕、可以追溯、集体维护、公开透明等特点。区块链的账本记录和数据库并不由单一主体控制，信息存储在每个区块链参与主体的计算机中。\n\
    \n顾名思义，区块链是由一系列的“区块”构成的。每一个区块包括记录的数据、该区块的哈希值和前一个区块的哈希值。一旦一个区块在区块链上完成了上链，这个区块就不可更改了。根据区块链数据的隐私要求，区块链可以分为公有链、私有链和联盟链三类。公有链对所有人开放，所有用户都能访问和查看，比特币就是典型的公有链。私有链只对单独的主体开放，因此私有链可以提供更好的隐私保护和交易速度。私有链通常会在一个组织内部使用。联盟链处于公有链和私有链之间，对符合要求的特定主体开放。联盟链可以由多个机构共同管理，每个机构运行一个或多个节点，联盟链可以提供更加复杂的权限设置和管理。\n\
    \n区块链技术在招聘环节中有着诸多的应用场景，具体内容如下。\n\n### 一、招聘面试与简历筛选\n\n据调查，超过50%的企业在申请人的简历中曾发现过虚假信息。在区块链技术发明之前，这一问题通常只能通过耗时且成本高昂的背景调查来解决。现在，区块链的信用机制、不可篡改性和可追溯的能力可以针对上述问题提供完美的解决方案，申请人的工作经历、教育背景和职业资质等信息上链之后，可以极大地降低背景调查的难度与成本，企业也不用通过第三方机构即可实现快速查询和验证。区块链甚至具备替代传统简历的潜力，申请人的学历、工作经验和培训证书等数据都能通过权威机构审核并上链来获得公信力。例如，2018年麻省理工学院（MIT）已经为学生提供了基于区块链技术的电子文凭，在此之后的MIT毕业生在求职过程中的学历认证工作就变得更加的安全和快捷，并且彻底消除了伪造MIT文凭的可能性。现在，越来越多的大学认识到这一方法的优势，在提供纸质文凭的同时，也为毕业生提供了基于区块链的电子文凭。\n\
    \n同理，求职者与工作经历相关的数据也可以在雇主验证之后上链保存，进而保证所有上链信息的真实性。更重要的是，区块链可以提供颗粒度更细的、包括正面和负面的求职者信息，包括求职者晋升或降职的经历、技能水平和获得的奖项荣誉等，可以帮助面试官更加全面地了解求职者。\n\
    \n### 二、HR流程优化\n\n区块链技术能够彻底改变和改进招聘经理的许多日常事务流程。可优化的流程如下。\n\n#### 1. 工资管理\n\n区块链有助于彻底改变工资管理的方式。区块链技术可以降低人为错误出现的概率，同时这个过程的自动化也会提升工作效率、节省工作时间。企业可以利用区块链技术跟踪与工资管理相关的考勤、加班和出差信息，而且能够进行福利管理。\n\
    \n#### 2. 智能合约\n\n未来，基于区块链的智能合约将会逐渐替代纸质合同。智能合约定义了交易条款，明确了违背交易条款而产生的处罚性后果。因为区块链上的智能合约本质上就是一段代码，代码中的条件语句被用来设计在特定条件下执行的合约内容。智能合约可以应用于人力资源管理工作的多个场景。在灵活用工方面，当员工完成合约规定的工作内容或工作时间后，区块链就可以自动给员工发放薪酬；在入职方面，当员工完成了背景调查并提交了符合合约规定的文件后，他们就可以获得访问企业系统的权限；在个税和社保方面，智能合约可以根据政策法规及员工薪酬批量化的完成情况计算缴纳个税和社保的金额。\n\
    \n大型科技公司会利用自身的技术优势在公司内部应用区块链技术，市场上也有越来越多的公司能够提供区块链产品和服务。Aworker公司构建了区块链平台服务于招聘工作；Indorse是利用区块链技术构建的IT专业人员网络，主要提供IT专业技能的测试、评估和认证。在灵活用工方面，ChronoBank为自由职业者和用工方提供了一个基于区块链技术的短期工作招聘平台，该平台上既没有监管人也没有传统的金融系统，自由职业者可以在平台上完成工作。ChronoBank开发了智能合约平台LaborX。雇主通过LaborX发布用工需求和工作信息，自由职业者可以在任何时间、任何地点通过该平台找工作。目前的工作内容主要是短期工作类型，包括建筑、清洁、运输和电子商务等。LaborX平台只收取1%的费用，远低于传统职业中介机构的收费标准。ChronoBank提供了一个新的灵活用工的商业模式，可以通过成本更低、速度更快的方式匹配自由职业者和用工需求；同时，这种模式在税收、社保和用工安全方面也带来了新的挑战。\n\
    \n# 第三章　人工智能在用才环节的应用\n\n## 第一节　人员编制与人力成本预算的常用方法\n\n人力资源规划中的一项重要工作就是人员编制与人力成本预算。人员编制的英文是Headcount，简称HC，外企常说HC管理，国企则说人员编制。人员编制是指企业的人员配置计划，是企业根据自身业务发展情况及组织结构与组织能力等调整人员增减计划的工作。简单地说，人员编制就是编制人员预算和人员招聘计划等。\n\
    \n人员编制与人力成本预算往往是管理者的工作难点，他们要考虑企业共需要多少人？每条业务线、每个岗位、每个级别分别需要多少人？每个部门需要多少人？当企业规模小的时候，管理者可以亲自管理这些工作，但随着团队规模越来越大，管理者就需要依靠机制、体系与方法了。\n\
    \nHR从业者需要利用大数据挖掘技术搜索、收集、调用内/外部信息（如企业当前经营数据、历史经营数据、政策调整内容等），在对这些信息进行加工处理与建模分析后建立模拟计算器，模拟各条业务线、产品线可能发生的人员成本波动、绩效变动及人员流动的情景，综合分析得出现有组织内部人力使用情况和人力成本报告，并对其合理性进行评估。HR从业者可以根据评估结果对企业未来的人员编制和人力成本做出预测及调整建议，供企业管理层参考。\n\
    \n### 一、预算编制的步骤\n\n一般情况下，预算编制工作有六个步骤，即目标预测、中长期规划、年度业务计划、预算编制、跟踪分析和绩效考核，如图3-1所示，这六个步骤与目标紧密联系、协调一致。\n\
    \n![](`Images/cutq_82_3566_m.jpg`)\n\n图3-1　预算编制的步骤\n\n1. 目标预测，即进行短、中、长期的市场和投资需求预测，目的是设定目标和及时调整目标。目标预测的原则是远粗近细，也就是说，在设定长期目标时可以粗放一些，在设定短期目标时则要细致、准确一些。年度预测要落实到具体产品和业务上。\n\
    2. 中长期规划，即企业层面的中长期的综合业务规划，包括战略规划、市场规划、业务/产品规划、IT规划、人力资源规划等，这些规划用于指导业务部门明确工作重点及方向。\n\
    3. 年度业务计划，即企业各级管理层为下级单位设定分解后的业务目标，各级业务单位根据目标制订业务计划、提出投资需求。\n4. 预算编制，即根据设定的目标及详细的工作计划预测完成这些目标、计划所需要的HC资源（含不同的产品线、不同的业务线、不同的岗位、不同的级别、不同的地域等）和人工成本，编制年度预算。\n\
    5. 跟踪分析，客观、准确、及时地记录企业发生的业务活动，将实际发生的核算与预算进行差异化分析（如典型的Curve分析），关注“例外”事项的管理，同时将结果汇报给相应的管理层。\n\
    6. 绩效考核，根据目标完成情况和企业的激励制度进行业绩评估，奖励那些完成或超额完成目标的业务人员和管理层。\n\n### 二、预算编制的周期\n\n在实际操作过程中，预算编制是按照财年进行的，90%左右的企业按照自然年度（从1月1日到12月31日为一个财年）编制预算，少数企业是将4月1日到次年3月31日作为一个财年来编制预算。无论采用哪种方式，HC预算编制的重要工作就是做好人才供需规划与人力成本预算。\n\
    \n图3-2是以自然年度为财年进行预算编制的。企业将年度预算细分为月度预算与季度预算。第一季度末进行3+9预算调整，第二季度末进行6+6预算调整，第三季度末进行9+3预算调整，第四季度进行全年收尾预算核查，同时开始制作明年的预算。这一轮循环以分期递进预算控制的形式进行精细化管理，确保年度预算目标的实现。\n\
    \n![](`Images/cutq_83_41660_l.jpg`)\n\n图3-2　以自然年度为财年进行预算编制\n\n以某公司的年度预算为例，人力成本预算的计算方式如下。首先，人力成本预算需要用到以下公式：\n\
    \n`√YTQ（Year to Q，年初到季度末）=Q1至当前Q的累计值；`\n\n`√人力成本预估占比=人力成本预估/人力成本预算×100%`\n\n`√（YTQ）人力成本预估占比=（YTQ）人力成本预估/（YTQ）人力成本预算×100%`\n\
    \n`√（全年）人力成本预估占比=（YTQ）人力成本预估/（全年）人力成本预算×100%`\n\n（注：95%是风险警戒线；若≥95%，则以红色显示预警）\n\
    \n最后，人力成本预算的结果可通过表3-1表示。\n\n表3-1中的数据来源于该公司的人力资源部和财务部。以该公司智行事业部2019年第四季度（Q4）预算为例，因为第四季度也是处于年末，所以第四季度的YTQ人力成本预算等同于2019年的年度人力成本预算，都是34,507,084.12元。\n\
    \n```\n季度人力成本预估占比=季度人力成本预估/季度人力成本预算×100%\n=3,153,797.33/5,459,798.14×100%\n=57.76%\n\
    \n（YTQ）人力成本预估占比=（YTQ）人力成本预估/（YTQ）人力成本预算×100%\n=32,201,083.31/34,507,084.12×100%\n\
    =93.32%\n\n（全年）人力成本预估占比=（YTQ）人力成本预估/（全年）人力成本预算×100%\n=32,201,083.31/34,507,084.12×100%\n\
    =93.32%\n```\n\n以上均未超出风险警戒线95%，成本支出在合理范围内，系统显示正常。\n\n### 三、预算编制的模式\n\n预算编制通常有以下三种模式。\n\
    \n1. **自上而下的模式**\n\n   有些企业在编制预算时采取的是自上而下的模式，即由上级制定关键财务指标。例如，集团给子公司制定要完成的收入额、利润率指标，子公司自行分解预算指标；集团制定总额指标，不干涉子公司的月度预算、分产品预算。华为公司有着比较完善的IT系统，打通了财务部门与业务部门的联系（所谓业财一体化平台），所以华为采取的就是自上而下的预算编制方式。自上而下模式的优点是效率高。\n\
    \n2. **自下而上的模式**\n\n   有些企业在编制预算时采取的是自下而上的模式，因为基层员工最了解自己的工作情况，据实填报可以让预算更加务实、更接地气。这里需要注意的是下级对自己工作的评估与上级对下级的期望未必一致。如果上级看到下级的预算后总在加码，下级便会在上报预算时给自己留出更多的空间，降低自己的考核压力。为了避免出现这种情况，企业在采取自下而上模式时的常用做法是调低产出值（即压低收入、利润和回款），调高支出值（即增加费用、采购等支出）。自下而上模式的优点是更加务实、执行性强。\n\
    \n3. **上下结合的模式**\n\n   由于自下而上模式和自上而下模式的预算编制模式各有利弊，因此大部分企业采取的是上下结合的模式。\n\n   (1)\
    \ 下达目标。企业董事会或经理办公会根据企业发展战略和预算期经济形势，在决策的基础上提出下一年度的企业财务预算目标，包括销售目标、成本费用目标、利润目标和现金流量目标，并确定财务预算编制的政策，由预算管理层下达至各部门。\n\
    \n   (2) 编制上报。各部门按照预算管理层下达的财务预算目标和政策，结合自身实际情况及预算的执行条件，提出本部门详细的财务预算方案并上报至企业财务管理部门。\n\
    \n   (3) 审查平衡。企业财务管理部门对各部门上报的财务预算方案进行审查、汇总，提出专业性的建议。在审查、平衡的过程中，预算管理层应当进行充分协调，对发现的问题提出初步的调整意见，并反馈给各有关部门予以修正。\n\
    \n   (4) 审议批准。企业财务管理部门在各部门修正、调整的基础上，编制企业财务预算方案，报预算管理层讨论。对不符合企业发展战略或财务预算目标的事项，预算管理层应当责成有关部门进一步修订、调整。在讨论、调整的基础上，企业财务管理部门正式编制企业年度财务预算草案，提交董事会或总经办审议批准。\n\
    \n   (5) 下达执行。企业财务管理部门将董事会或总经办审批通过的年度总预算分解成一系列的指标，由预算管理层逐级下达至各部门执行。\n\n### 四、预算编制的方法\n\
    \n企业确定各级岗位人员数量及编制人力成本预算的方法有很多种，不同的方法在复杂程度、准确程度、时间与成本等方面各有优劣势，也都有其适用的条件。在实际工作中，企业会综合运用多种方法进行测算与修正。下面概述企业常用的十种预算编制方法。\n\
    \n1. **预算控制法**。通过人力成本预算控制在岗人数，而不是对某一部门的某一岗位的具体人数做硬性规定，这是企业常用的定编方法。部门负责人对本部门的业务目标、岗位设置和员工人数负责，在得到上级批准的预算范围内，可自行决定各岗位的具体人数。\n\
    \n   如果将人力成本预算与业务结果挂钩，则可进一步增强人员数量控制的弹性和满足业务发展需要的有效性。\n\n   人数定额的计算公式如下：\n\n  \
    \ `人数定额=人力成本总额（业务量×x%）/单位人力成本`\n\n2. **业务数据分析法**。根据企业的历史业务数据和战略目标，确定企业未来一段时期的岗位人数。这里的业务数据包括销售收入、利润、市场占有率、人力成本等。业务数据分析法的具体应用如下：\n\
    \n   (1) HR从业者将企业的历史业务数据如销售收入、人力成本、毛利润等与战略目标进行比对，确定企业短期、中期、长期的员工编制人数；\n\n   (2)\
    \ 将员工人数与历史业务数据进行回归分析，根据企业的短期、中期、长期战略目标确定相应的编制范围，再根据企业短期、中期、长期战略目标的数据确定人员编制。\n\n\
    3. **劳动效率测算法**是指根据生产任务和员工的工作效率及出勤等因素计算岗位人数配备的方法，也是指根据工作量和劳动定额计算员工人数配置的方法。实行劳动定额的人员、以手工操作为主的岗位都适用这种方法，具体分为根据生产任务总量定额和根据时间定额测算两种方法，两个公式分别如下。\n\
    \n   `人数定额=生产任务总量/（员工劳动定额×出勤率）`\n\n   `人数定额=生产任务×时间定额/（工作时间×出勤率）`\n\n4. **业务流程分析法**，即根据企业总的业务目标、岗位工作量、业务流程衔接确定各岗位编制人员比例：\n\
    \n   (1) 根据企业总的业务目标确定单位时间流程中的总工作量，从而确定各岗位人员编制；\n\n   (2) 根据岗位工作量确定各个岗位单个员工的单位时间工作量，如单位时间生产的产品数量、单位时间处理的业务数量等，从而确定各岗位人员编制；\n\
    \n   (3) 根据业务流程衔接，结合上一步骤的分析结果，确定各岗位编制人员比例。\n\n5. **管理层/专家访谈法**。通过管理层访谈，HR从业者可以获得以下信息：员工的工作量是否饱满、流程是否合理，以及员工编制调整的建议；预测员工在一段时间之后的流向是晋升（本部门内或跨部门晋升）还是调动、轮岗、离职等，统计各部门一段时间之后的员工数量。\n\
    \n   通过专家访谈，HR从业者可以获取以下信息：在国内所属行业企业和国外所属行业企业中，各种岗位类型人员的结构信息，包括管理层级和管理幅度等。\n\n\
    6. **人员结构比例确定法**，即按照员工总数或某类员工数量的一定比例确定定编人数，如职能管理人员数量占比、业务管理人员数量占比、一般专业人员数量占比、产品研发人数量占比、销售人员数量占比等。\n\
    \n7. **标杆/同业比较法**。参考标杆企业或同行业的其他企业里，某岗位人员与其他人员在编制上的比例，并保持这种比例关系的相对稳定。本方法更适合制定辅助类和支持性岗位的人员编制。企业采用这种方法时需要注意，应广泛收集同行企业的人员编制数据，保证将一定的调查数据作为分析依据，否则结果不一定准确。\n\
    \n8. **趋势预测法**。综合分析历年的招聘情况（如招聘员工总量、地域分布、业务或产品线分布、层级分布、组织发展形态、晋升速度、管理幅度、员工离职率等），做出线性预测分析，得出企业用工总量是处于平稳发展状态、曲线发展状态还是爆发式发展状态的结论。通常来说，至少要有三年的完整数据才能够对比并做出预测分析，同时还要兼顾业务突发事件分析（如产品线的关停并转）、市场热点分析（如创业潮、新兴业务、颠覆性创新等）。\n\
    \n9. **成本控制法**，即根据企业的人力成本总预算倒推计算招聘人员数量。人力成本包括人力资源的获取成本、开发成本、使用成本、保障成本和退出（离职）成本等。其中，人力资源获取成本中的招聘费用、录取费用、安置费用以及人力资源开发成本、人力资源使用成本、人力资源保障成本和人力资源退出成本中的离职补偿成本等都属于显性成本。相对地，隐性成本是指通过对其他成本的影响来增加组织运营成本的成本，如员工休病假或事假的缺勤成本、招聘筛选的机会成本、甄选错误造成的低效成本、未通过试用期人员离职造成的补充成本、离职前的低效成本、离职后的岗位空缺成本、低效的企业文化成本、流程不合理或审批链过长的效率成本等。在实际操作过程中，通常企业对显性成本的估算会多一些，如工资、五险一金、商业保险、奖金、调薪、福利费用、培训费用、招聘费用、离职补偿费等，从总预算分摊到各事业部、各个部门的预算，再倒推各个部门、各个层级能招聘多少人，从而预估总的招聘员工数量。当然，HR从业者利用大数据挖掘技术开展对隐性成本的分析，可以使人力成本预算制定得更加科学。目前，企业常用的做法是将显性成本乘以一个系数，得到人力资源总成本。\n\
    \n10. **双控模式法**。由于趋势预测法与成本控制法各有利弊，企业可以将这两种方法结合起来使用，即形成双控模式，既控制了人员编制，又控制了人力成本。目前更精准的方式是HR从业者利用大数据挖掘技术实时分析显性成本和隐性成本，通过对组织结构、人员配比、人力成本、升降调转、绩效管理、离职管理等相关信息进行加工处理与建模分析，同时结合对外部数据的多维度分析，模拟可能发生的各种变化情景，对其合理性与风险进行评估，得出人才供需综合分析报告。\n\
    \n总之，无论HR从业者采用什么方法，都需要有理有据地说服上级领导、用人部门和预算管理部门。\n\n## 第二节　人力成本结构性预测、合理性判断\n"
  trans: "\n\"Data + Model + Visualization\" is the predictive result that enterprises\
    \ need to obtain, as shown in Figure 2-10. Of course, algorithmic models will\
    \ differ across different business scenarios (such as recruitment, talent inventory,\
    \ training, turnover, etc.). Sufficient data, combined with precise models and\
    \ business scenarios, will enable HR practitioners to obtain sufficiently clear\
    \ talent portraits—this is the charm of big data.\n\n![](img/cutq_75_18646_l.jpg`)\n\
    \nFigure 2-10　The \"Formula\" for Predictive Results\n\n## Section 4　Application\
    \ of Blockchain in the Recruitment Process\n\nSince 2008, blockchain technology\
    \ has gradually become known to the public. The inventor of blockchain technology\
    \ calls himself \"Satoshi Nakamoto,\" whose true identity remains a mystery to\
    \ this day. Blockchain is a distributed shared ledger and database, characterized\
    \ by decentralization, immutability, full traceability, traceability, collective\
    \ maintenance, and openness and transparency. The blockchain's ledger records\
    \ and database are not controlled by a single entity; information is stored on\
    \ the computers of every participating entity in the blockchain.\n\nAs the name\
    \ suggests, a blockchain consists of a series of \"blocks.\" Each block includes\
    \ recorded data, the hash value of that block, and the hash value of the previous\
    \ block. Once a block is added to the blockchain, it cannot be altered. Based\
    \ on the privacy requirements of blockchain data, blockchains can be categorized\
    \ into three types: public chains, private chains, and consortium chains. Public\
    \ chains are open to everyone; all users can access and view them. Bitcoin is\
    \ a typical public chain. Private chains are open only to a single entity; therefore,\
    \ private chains can provide better privacy protection and transaction speed.\
    \ Private chains are typically used internally within an organization. Consortium\
    \ chains lie between public and private chains, open to specific qualified entities.\
    \ Consortium chains can be jointly managed by multiple institutions, each running\
    \ one or more nodes, and can provide more complex permission settings and management.\n\
    \nBlockchain technology has numerous application scenarios in the recruitment\
    \ process, detailed as follows.\n\n### 1. Recruitment Interviews and Resume Screening\n\
    \nAccording to surveys, over 50% of enterprises have discovered false information\
    \ in applicants' resumes. Before the invention of blockchain technology, this\
    \ problem could usually only be solved through time-consuming and costly background\
    \ checks. Now, blockchain's credit mechanism, immutability, and traceability can\
    \ provide a perfect solution to the above issues. Once applicants' work experience,\
    \ educational background, and professional qualifications are on-chain, the difficulty\
    \ and cost of background checks can be greatly reduced, and enterprises can achieve\
    \ rapid query and verification without third-party agencies. Blockchain even has\
    \ the potential to replace traditional resumes. Data such as applicants' degrees,\
    \ work experience, and training certificates can gain credibility through authoritative\
    \ institutional review and on-chain recording. For example, in 2018, the Massachusetts\
    \ Institute of Technology (MIT) began providing blockchain-based digital diplomas\
    \ to students. Since then, the degree verification process for MIT graduates during\
    \ job hunting has become more secure and efficient, completely eliminating the\
    \ possibility of forging MIT diplomas. Now, an increasing number of universities\
    \ recognize the advantages of this method; while providing paper diplomas, they\
    \ also offer blockchain-based digital diplomas to graduates.\n\nSimilarly, job\
    \ seekers' work-experience-related data can also be stored on-chain after employer\
    \ verification, thereby guaranteeing the authenticity of all on-chain information.\
    \ More importantly, blockchain can provide finer-grained job seeker information,\
    \ including both positive and negative aspects, such as promotion or demotion\
    \ history, skill levels, and awards and honors received, helping interviewers\
    \ gain a more comprehensive understanding of candidates.\n\n### 2. HR Process\
    \ Optimization\n\nBlockchain technology can radically transform and improve many\
    \ of the daily transactional processes of recruitment managers. Optimizable processes\
    \ include the following.\n\n#### 1. Payroll Management\n\nBlockchain helps revolutionize\
    \ the way payroll is managed. Blockchain technology can reduce the probability\
    \ of human error, while the automation of this process also improves work efficiency\
    \ and saves time. Enterprises can use blockchain technology to track attendance,\
    \ overtime, and business travel information related to payroll management, and\
    \ also manage benefits.\n\n#### 2. Smart Contracts\n\nIn the future, blockchain-based\
    \ smart contracts will gradually replace paper contracts. Smart contracts define\
    \ transaction terms and specify the punitive consequences of violating those terms.\
    \ Because smart contracts on the blockchain are essentially a piece of code, conditional\
    \ statements in the code are used to design contract content that executes under\
    \ specific conditions. Smart contracts can be applied to multiple scenarios in\
    \ human resource management. In flexible employment, when employees complete the\
    \ work content or hours stipulated in the contract, the blockchain can automatically\
    \ disburse wages to employees; in onboarding, when employees complete background\
    \ checks and submit documents meeting contract requirements, they can gain access\
    \ to enterprise systems; in individual tax and social security, smart contracts\
    \ can batch-calculate and pay the amounts of individual tax and social security\
    \ based on policies, regulations, and employee compensation.\n\nLarge technology\
    \ companies leverage their own technical advantages to apply blockchain technology\
    \ internally, and there are increasingly more companies in the market providing\
    \ blockchain products and services. Aworker has built a blockchain platform serving\
    \ recruitment; Indorse is a network for IT professionals built using blockchain\
    \ technology, mainly providing testing, assessment, and certification of IT professional\
    \ skills. In flexible employment, ChronoBank provides a blockchain-based short-term\
    \ job recruitment platform for freelancers and employers. The platform has neither\
    \ regulators nor traditional financial systems; freelancers can complete work\
    \ on the platform. ChronoBank developed the smart contract platform LaborX. Employers\
    \ post labor demands and job information through LaborX, and freelancers can find\
    \ jobs anytime, anywhere via the platform. Current work content is mainly short-term\
    \ types, including construction, cleaning, transportation, and e-commerce. The\
    \ LaborX platform charges only a 1% fee, far lower than traditional employment\
    \ agencies. ChronoBank provides a new flexible employment business model that\
    \ can match freelancers and labor demands at lower cost and higher speed; simultaneously,\
    \ this model brings new challenges in taxation, social security, and employment\
    \ safety.\n\n# Chapter 3　Application of Artificial Intelligence in the Talent\
    \ Utilization Phase\n\n## Section 1　Common Methods for Headcount Planning and\
    \ Labor Cost Budgeting\n\nAn important task in human resource planning is headcount\
    \ planning and labor cost budgeting. The English term for headcount planning is\
    \ Headcount, abbreviated as HC. Foreign enterprises often refer to HC management,\
    \ while state-owned enterprises refer to headcount planning. Headcount planning\
    \ refers to an enterprise's personnel allocation plan—the work of adjusting personnel\
    \ increase/decrease plans based on the enterprise's business development, organizational\
    \ structure, and organizational capabilities. Simply put, headcount planning involves\
    \ preparing personnel budgets and recruitment plans.\n\nHeadcount planning and\
    \ labor cost budgeting are often difficult points for managers. They must consider:\
    \ How many people does the enterprise need in total? How many are needed for each\
    \ business line, each position, each level? How many for each department? When\
    \ the enterprise is small, managers can handle these tasks personally, but as\
    \ the team grows larger, managers need to rely on mechanisms, systems, and methods.\n\
    \nHR practitioners need to use big data mining technology to search, collect,\
    \ and retrieve internal/external information (such as current enterprise operating\
    \ data, historical operating data, policy adjustments, etc.). After processing,\
    \ modeling, and analyzing this information to build simulation calculators, they\
    \ simulate scenarios of potential personnel cost fluctuations, performance changes,\
    \ and personnel turnover for each business line and product line. Through comprehensive\
    \ analysis, they derive reports on current internal human resource utilization\
    \ and labor costs, and evaluate their rationality. Based on the evaluation results,\
    \ HR practitioners can make predictions and adjustment recommendations for the\
    \ enterprise's future headcount planning and labor costs for management reference.\n\
    \n### 1. Steps in Budget Preparation\n\nGenerally, budget preparation involves\
    \ six steps: target forecasting, medium-to-long-term planning, annual business\
    \ planning, budget preparation, tracking analysis, and performance evaluation,\
    \ as shown in Figure 3-1. These six steps are closely linked to the objectives\
    \ and coordinated consistently.\n\n![](img/cutq_82_3566_m.jpg`)\n\nFigure 3-1　Steps\
    \ in Budget Preparation\n\n1. **Target Forecasting**: Conducting short-, medium-,\
    \ and long-term market and investment demand forecasting, aiming to set targets\
    \ and adjust them in a timely manner. The principle of target forecasting is \"\
    rough for the long term, detailed for the near term\"—meaning long-term targets\
    \ can be rougher, while short-term targets must be detailed and accurate. Annual\
    \ forecasting must be implemented down to specific products and businesses.\n\
    2. **Medium-to-Long-Term Planning**: Comprehensive business planning at the enterprise\
    \ level for the medium to long term, including strategic planning, market planning,\
    \ business/product planning, IT planning, human resource planning, etc. These\
    \ plans guide business units in clarifying work priorities and directions.\n3.\
    \ **Annual Business Plan**: Enterprise management at all levels sets decomposed\
    \ business targets for subordinate units; each business unit formulates business\
    \ plans and proposes investment needs based on targets.\n4. **Budget Preparation**:\
    \ Predicting the HC resources (including different product lines, business lines,\
    \ positions, levels, regions, etc.) and labor costs required to achieve set targets\
    \ and detailed work plans, and preparing the annual budget.\n5. **Tracking Analysis**:\
    \ Objectively, accurately, and timely recording enterprise business activities,\
    \ conducting variance analysis between actual accounting and budget (e.g., typical\
    \ Curve analysis), focusing on \"exception\" management, and reporting results\
    \ to the corresponding management levels.\n6. **Performance Evaluation**: Conducting\
    \ performance assessment based on target completion and the enterprise's incentive\
    \ system, rewarding business personnel and management who meet or exceed targets.\n\
    \n### 2. Budget Preparation Cycle\n\nIn practice, budget preparation follows the\
    \ fiscal year. About 90% of enterprises prepare budgets according to the calendar\
    \ year (January 1 to December 31 as a fiscal year), while a few enterprises use\
    \ April 1 to March 31 of the following year as the fiscal year. Regardless of\
    \ the method, the key work of HC budget preparation is to do a good job in talent\
    \ supply-demand planning and labor cost budgeting.\n\nFigure 3-2 shows budget\
    \ preparation based on the calendar year as the fiscal year. The enterprise breaks\
    \ down the annual budget into monthly and quarterly budgets. A 3+9 budget adjustment\
    \ is made at the end of Q1, a 6+6 adjustment at the end of Q2, a 9+3 adjustment\
    \ at the end of Q3, and a year-end budget review at Q4, while simultaneously starting\
    \ next year's budget preparation. This cycle proceeds in a phased, progressive\
    \ budget control manner for refined management, ensuring the achievement of annual\
    \ budget targets.\n\n![](img/cutq_83_41660_l.jpg`)\n\nFigure 3-2　Budget Preparation\
    \ Based on Calendar Year as Fiscal Year\n\nTaking a company's annual budget as\
    \ an example, the calculation method for labor cost budgeting is as follows. First,\
    \ the labor cost budget requires the following formulas:\n\n`√YTD (Year to Date,\
    \ or Year to Quarter-end) = Cumulative value from Q1 to current Q;`\n\n`√Estimated\
    \ Labor Cost Ratio = Estimated Labor Cost / Budgeted Labor Cost × 100%`\n\n`√(YTD)\
    \ Estimated Labor Cost Ratio = (YTD) Estimated Labor Cost / (YTD) Budgeted Labor\
    \ Cost × 100%`\n\n`√(Full Year) Estimated Labor Cost Ratio = (YTD) Estimated Labor\
    \ Cost / (Full Year) Budgeted Labor Cost × 100%`\n\n(Note: 95% is the risk warning\
    \ line; if ≥ 95%, display a red warning)\n\nFinally, the labor cost budget results\
    \ can be represented by Table 3-1.\n\nData in Table 3-1 comes from the company's\
    \ HR and Finance departments. Taking the company's ZhiXing Business Unit's Q4\
    \ 2019 budget as an example, since Q4 is at year-end, the YTD labor cost budget\
    \ for Q4 equals the 2019 annual labor cost budget, both being 34,507,084.12 yuan.\n\
    \n```\nQuarterly Estimated Labor Cost Ratio = Quarterly Estimated Labor Cost /\
    \ Quarterly Budgeted Labor Cost × 100%\n= 3,153,797.33 / 5,459,798.14 × 100%\n\
    = 57.76%\n\n(YTD) Estimated Labor Cost Ratio = (YTD) Estimated Labor Cost / (YTD)\
    \ Budgeted Labor Cost × 100%\n= 32,201,083.31 / 34,507,084.12 × 100%\n= 93.32%\n\
    \n(Full Year) Estimated Labor Cost Ratio = (YTD) Estimated Labor Cost / (Full\
    \ Year) Budgeted Labor Cost × 100%\n= 32,201,083.31 / 34,507,084.12 × 100%\n=\
    \ 93.32%\n```\n\nNone of the above exceeded the 95% risk warning line; cost expenditure\
    \ was within a reasonable range, and the system displayed normal status.\n\n###\
    \ 3. Budget Preparation Modes\n\nThere are usually three modes of budget preparation.\n\
    \n1. **Top-Down Mode**\n\n   Some enterprises adopt a top-down mode for budget\
    \ preparation, where superiors set key financial indicators. For example, the\
    \ group sets revenue and profit margin targets for subsidiaries, which then decompose\
    \ budget indicators themselves; the group sets total amount indicators without\
    \ interfering with subsidiaries' monthly or product-specific budgets. Huawei has\
    \ a relatively complete IT system connecting finance and business departments\
    \ (the so-called Business-Finance Integration Platform), so it adopts the top-down\
    \ budget preparation method. The advantage of the top-down mode is high efficiency.\n\
    \n2. **Bottom-Up Mode**\n\n   Some enterprises adopt a bottom-up mode because\
    \ frontline employees understand their work situations best; factual reporting\
    \ makes the budget more practical and grounded. It should be noted that subordinates'\
    \ self-assessment of their work may not align with superiors' expectations. If\
    \ superiors constantly raise the bar after seeing subordinates' budgets, subordinates\
    \ will leave more buffer in their reported budgets to reduce assessment pressure.\
    \ To avoid this, a common practice when adopting the bottom-up mode is to lower\
    \ output values (i.e., suppress revenue, profit, and collection) and increase\
    \ expenditure values (i.e., increase expenses, procurement, etc.). The advantage\
    \ of the bottom-up mode is that it is more practical and has strong executability.\n\
    \n3. **Combined Top-Down and Bottom-Up Mode**\n\n   Since both bottom-up and top-down\
    \ modes have pros and cons, most enterprises adopt a combined mode.\n\n   (1)\
    \ **Target Setting**: The board of directors or the general manager's office proposes\
    \ the next year's enterprise financial budget targets based on corporate development\
    \ strategy and the budget period's economic situation, including sales targets,\
    \ cost/expense targets, profit targets, and cash flow targets, and determines\
    \ financial budget preparation policies, which are issued to departments by the\
    \ budget management level.\n\n   (2) **Preparation and Submission**: Departments\
    \ prepare detailed financial budget proposals based on the targets and policies\
    \ issued by the budget management level, combined with their actual situations\
    \ and execution conditions, and submit them to the enterprise's financial management\
    \ department.\n\n   (3) **Review and Balancing**: The financial management department\
    \ reviews, consolidates, and provides professional suggestions on the submitted\
    \ proposals. During review and balancing, the budget management level should fully\
    \ coordinate, propose preliminary adjustment opinions on discovered issues, and\
    \ feed them back to relevant departments for correction.\n\n   (4) **Deliberation\
    \ and Approval**: The financial management department prepares the enterprise\
    \ financial budget proposal based on departmental corrections and adjustments,\
    \ and submits it to the budget management level for discussion. For items not\
    \ conforming to corporate strategy or financial targets, the budget management\
    \ level should order relevant departments to further revise and adjust. Based\
    \ on discussion and adjustment, the financial management department formally prepares\
    \ the annual financial budget draft and submits it to the board or general manager's\
    \ office for approval.\n\n   (5) **Issuance and Execution**: The financial management\
    \ department decomposes the approved annual total budget into a series of indicators,\
    \ which are issued level by level to departments for execution by the budget management\
    \ level.\n\n### 4. Budget Preparation Methods\n\nThere are many methods for enterprises\
    \ to determine the number of personnel for each position/level and prepare labor\
    \ cost budgets. Different methods have their own pros and cons in terms of complexity,\
    \ accuracy, time, and cost, and all have their applicable conditions. In actual\
    \ work, enterprises comprehensively use multiple methods for calculation and correction.\
    \ Below is an overview of ten commonly used budget preparation methods.\n\n1.\
    \ **Budget Control Method**. Controlling headcount through labor cost budgeting\
    \ rather than rigidly stipulating the specific number of people for a certain\
    \ position in a certain department—this is a common headcount determination method\
    \ used by enterprises. Department heads are responsible for their department's\
    \ business targets, position setup, and employee numbers. Within the approved\
    \ budget range, they can independently decide the specific headcount for each\
    \ position.\n\n   If the labor cost budget is linked to business results, it can\
    \ further enhance the flexibility of headcount control and the effectiveness of\
    \ meeting business development needs.\n\n   The formula for headcount quota calculation\
    \ is as follows:\n\n   `Headcount Quota = Total Labor Cost Budget (Business Volume\
    \ × x%) / Unit Labor Cost`\n\n2. **Business Data Analysis Method**. Determining\
    \ the enterprise's position headcount for a future period based on historical\
    \ business data and strategic goals. Business data here includes sales revenue,\
    \ profit, market share, labor cost, etc. Specific applications are as follows:\n\
    \n   (1) HR practitioners compare historical business data such as sales revenue,\
    \ labor cost, and gross profit with strategic goals to determine short-, medium-,\
    \ and long-term employee headcount;\n\n   (2) Conduct regression analysis of employee\
    \ headcount against historical business data, determine the corresponding headcount\
    \ range based on short-, medium-, and long-term strategic goals, and then determine\
    \ specific headcount based on the data of those strategic goals.\n\n3. **Labor\
    \ Efficiency Calculation Method** refers to the method of calculating position\
    \ staffing based on production tasks, employee work efficiency, attendance, and\
    \ other factors. It also refers to calculating employee staffing based on workload\
    \ and labor quotas. It applies to personnel implementing labor quotas and positions\
    \ dominated by manual operations. It is specifically divided into two methods:\
    \ quota based on total production task and calculation based on time quota. The\
    \ two formulas are as follows.\n\n   `Headcount Quota = Total Production Task\
    \ / (Employee Labor Quota × Attendance Rate)`\n\n   `Headcount Quota = Production\
    \ Task × Time Quota / (Working Hours × Attendance Rate)`\n\n4. **Business Process\
    \ Analysis Method**, i.e., determining the staffing ratio of each position based\
    \ on the enterprise's overall business targets, position workload, and business\
    \ process connectivity:\n\n   (1) Determine the total workload in the unit time\
    \ process based on the overall business target, thereby determining the headcount\
    \ for each position;\n\n   (2) Determine the unit time workload of a single employee\
    \ in each position based on position workload, such as the number of products\
    \ produced per unit time, the number of business transactions processed per unit\
    \ time, etc., thereby determining the headcount for each position;\n\n   (3) Based\
    \ on business process connectivity, combined with the analysis results of the\
    \ previous step, determine the staffing ratio of each position.\n\n5. **Management/Expert\
    \ Interview Method**. Through management interviews, HR practitioners can obtain\
    \ the following information: whether employee workload is saturated, whether processes\
    \ are reasonable, and suggestions for headcount adjustment; predict employee flow\
    \ direction after a period—promotion (within department or cross-department),\
    \ transfer, rotation, resignation, etc.—and count the number of employees in each\
    \ department after a period.\n\n   Through expert interviews, HR practitioners\
    \ can obtain the following information: personnel structure information for various\
    \ position types in domestic and foreign industry enterprises, including management\
    \ hierarchy and span of control.\n\n6. **Personnel Structure Ratio Determination\
    \ Method**, i.e., determining the approved headcount based on a certain percentage\
    \ of the total number of employees or a certain category of employees, such as\
    \ the proportion of functional management personnel, business management personnel,\
    \ general professional personnel, product R&D personnel, sales personnel, etc.\n\
    \n7. **Benchmarking/Peer Comparison Method**. Referring to the ratio of a certain\
    \ position's personnel to other personnel in the staffing of benchmark enterprises\
    \ or other enterprises in the same industry, and maintaining the relative stability\
    \ of this ratio relationship. This method is more suitable for determining the\
    \ staffing of auxiliary and support positions. Enterprises using this method should\
    \ note that they should widely collect peer enterprise staffing data to ensure\
    \ a certain amount of survey data as the basis for analysis; otherwise, the results\
    \ may not be accurate.\n\n8. **Trend Forecasting Method**. Comprehensively analyzing\
    \ recruitment situations over the years (such as total recruitment volume, regional\
    \ distribution, business/product line distribution, level distribution, organizational\
    \ development form, promotion speed, management span, employee turnover rate,\
    \ etc.), making linear predictive analysis, and concluding whether the enterprise's\
    \ total labor demand is in a stable development state, curve development state,\
    \ or explosive development state. Usually, at least three years of complete data\
    \ are required for comparative predictive analysis, while also taking into account\
    \ sudden business event analysis (such as product line shutdown/merger/transformation),\
    \ market hotspot analysis (such as entrepreneurship waves, emerging businesses,\
    \ disruptive innovations, etc.).\n\n9. **Cost Control Method**, i.e., reversely\
    \ calculating the number of recruitment personnel based on the enterprise's total\
    \ labor cost budget. Labor costs include acquisition costs, development costs,\
    \ usage costs, security costs, and exit (resignation) costs of human resources.\
    \ Among them, recruitment fees, hiring fees, placement fees in acquisition costs,\
    \ development costs, usage costs, security costs, and severance compensation in\
    \ exit costs are all explicit costs. Relatively, implicit costs refer to costs\
    \ that increase organizational operating costs by affecting other costs, such\
    \ as absenteeism costs due to sick or personal leave, opportunity costs of recruitment\
    \ screening, low-efficiency costs due to selection errors, replacement costs due\
    \ to personnel failing probation, pre-resignation low-efficiency costs, post-resignation\
    \ vacancy costs, low-efficiency corporate culture costs, efficiency costs due\
    \ to unreasonable processes or long approval chains, etc. In actual operation,\
    \ enterprises usually estimate explicit costs more, such as wages, social insurance\
    \ and housing fund, commercial insurance, bonuses, salary adjustments, welfare\
    \ expenses, training expenses, recruitment expenses, severance compensation, etc.,\
    \ allocating them from the total budget to each business unit and department budget,\
    \ and then reversely calculating how many people each department and level can\
    \ recruit, thereby estimating the total number of recruits. Of course, HR practitioners\
    \ using big data mining technology to analyze implicit costs can make labor cost\
    \ budgeting more scientific. Currently, the common practice is to multiply explicit\
    \ costs by a coefficient to obtain the total human resource cost.\n\n10. **Dual-Control\
    \ Mode Method**. Since the trend forecasting method and cost control method each\
    \ have pros and cons, enterprises can combine these two methods, forming a dual-control\
    \ mode that controls both headcount and labor cost. The more accurate current\
    \ approach is for HR practitioners to use big data mining technology to analyze\
    \ explicit and implicit costs in real-time, process and model information related\
    \ to organizational structure, personnel allocation, labor costs, promotion/demotion/transfer,\
    \ performance management, resignation management, etc., combined with multi-dimensional\
    \ analysis of external data, simulate various possible change scenarios, evaluate\
    \ their rationality and risks, and produce a comprehensive talent supply-demand\
    \ analysis report.\n\nIn summary, whatever method HR practitioners adopt, they\
    \ must be able to convince superiors, user departments, and budget management\
    \ departments with sound reasoning and evidence.\n\n## Section 2　Structural Forecasting\
    \ and Rationality Judgment of Labor Costs\n\n"
