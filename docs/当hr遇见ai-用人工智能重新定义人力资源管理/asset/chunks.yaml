- raw: '研究组织的人员结构分布与组织形态，对人力成本的预算编制工作有一定的积极作用。


    ### [一、人才结构演变规律](../Text/contents.xhtml#c_42)


    人才结构包括四种常见模型，即花瓶模型人才结构、钻石模型人才结构、橄榄模型人才结构和球形模型人才结构，如图3-3所示。


    ![](Images/cutq_91_1346_l.jpg)


    图3-3　人才结构的四种模型


    不同组织业态下的人才结构模型不同，如何进化迭代才能使人才符合企业发展与变化的需要呢？企业可以采用Curve分析、预算模拟器等方法。


    ### [二、Curve分析](../Text/contents.xhtml#c_43)


    Curve分析是近几年兴起的一种数据分析方法，最早可以追溯到海氏评估法（Hay Guide Chart）里岗位的“形状构成”评估应用。海氏评估法又叫“指导图表——形状构成法”，是美国工资设计专家艾德华·海（Edward
    Hay）于1951年研究并开发出来，它有效地解决了不同职能部门的不同职务之间相对价值的相互比较和量化的难题。海氏评估法的实质是一种评分法，根据这个系统，所有职务包含的最主要的付酬因素有三种，即知识技能水平、解决问题的能力和承担的职务责任。这三大因素又包括多个二级因素和相应的评分体系。不同因素之间的重要性可以通过权重进行调节，以便适用于不同的组织。海氏评估法认为，一个岗位能够存在的理由是因为岗位任职者必须要承担一定的责任，具备一定的知识技能，产生一定的产出。具备一定知识和技能的员工通过什么方式取得产出呢？那就是通过在岗位中解决其面对的问题，即承担“职务责任”、投入“知识和技能”、最终“解决问题”。海氏评估法按照以上三个要素及相应的标准对岗位进行评估打分，得出每个岗位的评估分，即岗位评估分=知识和技能得分+解决问题得分+职务责任得分。其中，知识和技能得分、职务责任得分与最后得分都是绝对分，而解决问题得分是相对分（百分值），只有调整为最后得分才是绝对分。HR从业者在利用海氏评估法评估三种主要付酬因素的不同分数时，还必须考虑各岗位的“形状构成”，以确定该因素的权重，据此计算出各岗位相对价值的总分，完成岗位评估活动。所谓职务的“形状”主要取决于知识和技能与解决问题的能力这两个因素相对于职务责任这一因素的影响力的对比与分配。


    多年来，业内对Curve分析并没有给出合适的中文译名，本书将Curve分析译成腰线分析，并做出以下定义：腰线分析是指针对某一类数据以类似正态分布的形式划分“等级”，通过权重调高或调低“等级”使数据在一定的合理范围内以适用于不同的组织，即通过调节腰线的位置和腰的宽度模拟组织排兵布阵是否符合管理要求，从而达到管理的目的。


    下面以ABC公司某专业序列（P序列）人数说明Curve分析对人才结构的影响。


    某年，ABC公司的员工人数数据及职级的分布如表3-2所示，Curve分析图如图3-4所示。


    表3-2　ABC公司的员工人数统计表


    ![](Images/table_image_93_0.jpg)![](Images/cutq_94_2046_l.jpg)


    图3-4　ABC公司员工人数的Curve分析图


    从图3-4中可以发现，HR从业者需要调整该公司的人员结构，其中只调整相应层级的人员分布即可，即调整腰线的位置或宽度来改变形状。这就需要HR从业者采取以下科学的人力资源管理机制与管理动作。


    （1）招聘。通过开展校园招聘的方式解决P3层级人员不足的问题，同时布局未来2~3年的企业人才结构与竞争力。其他层级的人员不足问题可以通过开展社会招聘的方式来解决。


    （2）晋升。通过控制内部晋升比例调节各个层级人员的结构分布。


    （3）岗位调动。内部的岗位调动也可以起到调节各个层级人员分布的作用。尤其是组织调整，能够直接影响企业的人才结构。


    （4）离职。员工主动离职和被动离职都可以对企业的人才结构起到一定的微调作用。


    在规划人才总量的时候，有些公司是单控，只控制人员编制或人力成本；有些公司是双控，既控制人员编制又控制人力成本。模型相对比较复杂一些，不仅需要考虑Curve结构，而且需要考虑地域、学校、学历、年龄、司龄、技能、绩效、薪酬分位等因素。HR从业者可以通过大数据模型与算法，充分利用历史数据，结合不同的应用场景，做好预警预测，助力管理者制定决策。


    ### [三、预算模拟器](../Text/contents.xhtml#c_44)


    预算模拟器的设计逻辑就是模拟测算部门内不同层级、不同人数占用的人力成本，从而达到粗略编制预算的目的。


    预算模拟器也可以用于招聘工作。企业用户使用预算模拟器可以计算出是用100万元招聘一位P8级的高级专家，还是用同样的成本招聘四个P6级程序员，或是计算在规定的预算费用内每个级别可以招聘多少人等。


    预算编制工作通常采取与自己比、与同行比等方式。当然，人力成本的增长幅度不能高于收入增长和利润增长的幅度，否则就是做无用功。要想让本企业的员工收入高于同行业企业的平均收入，使员工收入具备行业竞争力，提升员工的幸福感，企业就需要创造可持续发展的利润。人力成本与利润这二者是矛盾的，只有在某个点上保持相对平衡，企业才能向上发展并进展顺利，员工收入才能更好。


    计算人力成本时有三个著名的黄金不等式，分别如下。


    1.人力成本增长率<利润增长率


    人力成本增长率=人力成本增长额/上期人力成本×100%


    其中，人力成本增长额=本期人力成本–上期人力成本，人力成本增长率越高，说明企业花在人力成本上的费用就越多；反之，说明企业花在人力成本上的费用就越少。


    利润增长率=利润增长额/上期利润总额×100%


    其中，利润增长额=本期利润总额–上期利润总额，利润率越高，说明企业的利润越多，企业的赢利能力越强；反之，就说明企业的赢利能力越弱。


    当利润增长率等于人力成本增长率时，企业的人力成本与利润在理论模型上维持一个相对平衡点；当利润增长率大于人力成本增长率时，企业呈现一个向上的良性发展趋势，理论上员工的收入应该更高（如图3-5所示）。


    ![](Images/cutq_96_26652_l.jpg)


    图3-5　人力成本增长率与利润增长率的关系图


    2.总人力成本占比<利润预警线


    人力成本占比=人力成本总额/同期总成本×100%


    人力成本占收比=人力成本合计/收入合计×100%


    企业管理者都有自己的利润心理底线，也就是利润预警线。只有人力成本占比低于利润预警值时，企业才能不断发展。


    3.人力成本增长率<收入增长率


    收入增长率=收入增长额/上期收入×100%


    其中，收入增长额=本期收入–上期收入，收入增长率越高，就说明企业的赢利能力越强；反之，就说明企业的赢利能力越弱。


    ## [第三节　人效关键指标与影响因素](../Text/contents.xhtml#b_45)


    人效有如下两种定义。


    第一，人效是人力资源有效性（HR Effectiveness）的简称，是指人力资源管理达成目标的程度。


    第二，人效是人力资源效能（HR Efficiency）的简称，它反映人的投入产出比。从本质上看，人效要反映出人力资源系统的有效性。具体来说，就是要计算出不同人力的投入是否产出了相应的效果。简单地说，财务或市场结果除以人力单位，就是人效指标。这是最硬性的指标，也最能彰显人力资源部职能的价值。


    人工智能技术应用到人力资源领域后，将重塑人力资源的业务流程与管理模式，为大幅提升人效提供了技术保障与平台支撑。


    ### [一、关键影响因素](../Text/contents.xhtml#c_46)


    影响人效指标的因素主要分为外部因素和内部因素两类，具体内容分别如下。


    1.外部因素


    （1）经济发展与环境影响，如数字化转型等。


    （2）前沿技术影响，如5G技术、数字化技术、AIoT、智能制造等。


    （3）劳动力市场供给影响，如灵活用工等新型用工形式。


    （4）行业人才，如AI人才、算法工程师、数据挖掘工程师等的流动情况。


    2.内部因素


    （1）供需关系：业务需求与人员关系


    企业管理者通过观察需求侧与供给侧变化的趋势，了解现有人员配置情况，有针对性地调整策略。例如，某公司的人员变化幅度普遍小于业务变化幅度（即人员供不应求），说明该公司的人才策略较为稳健和谨慎，管理者可考虑通过加快调控人才结构与分布、提升人员效能的方式实现公司的业务目标。相反，如果某公司的人员变化幅度大于业务变化幅度（即人员供过于求），一般来说这种状态存在于开拓性、创新性、前沿性的技术研发部门。


    （2）人员盘点与运营情况，包括数量、结构、质量等情况及改善目标


    HR从业者可通过如下五个维度分析与洞察人才队伍存在的问题，从而制定改进策略：


    ①对员工结构的分析，如性别、年龄、司龄、学历、地域等；


    ②对员工价值的分析，如职级、绩效、关键岗位等；


    ③对员工行为的分析，如敬业度、满意度、风险度等；


    ④对员工能力的分析，如通用能力、专业能力、领导力、潜力等；


    ⑤员工大数据分析，如人才画像、标签等。


    （3）人员流动情况及预测


    通过大数据分析建立员工离职预测模型，该模型主要用于预测员工流失情况并提出预警，结合“企业内部人才继任表”协助HR从业者提前进行干预。


    通过大数据分析建立人才迁徙地图，该地图可以帮助HR从业者及时掌握企业内外部人才的动态，为入、离、升、降、调的管理工作提供数据分析与决策参考。


    （4）人效竞争力


    企业的人效竞争力主要体现在“人才流量表”“人才损益表”和“人才资产负债表”这三张表上。


    （5）组织调整变化


    在企业发展的不同阶段或不同的历史时期，随着企业经营战略的变化，组织也会随之做出调整，组织的变化就会带来人才排兵布阵的变化，从而影响到人员效率与效能的变化。


    ### [二、人效关键指标](../Text/contents.xhtml#c_47)


    1.人力费用率指标


    人力费用率是指人力成本在组织总销售额或总运营成本中所占的比例。人力费用率的指标越高，说明组织的人力成本越高，也就意味着人效可能越不占优势。常用的指标公式如下：


    人力费用率=总人力成本/总销售额（或总产值）×100%


    人力费用率=总人力成本/总运营成本×100%


    2.人力资本效率指标


    人力资本效率反映了每一位员工创造的价值。常用的指标公式如下：


    人均销售额=组织总销售额/员工人数


    人均产值=组织总产值/员工人数


    人均利润=组织净利润/员工人数


    3.人力资本投资回报率指标


    人力资本投资回报率反映了在人力资源方面投入的每一笔费用会给企业带来多大的产出。常用的指标公式如下：


    元产值=组织总产值/总人力成本


    人力资本投资回报率=组织净利润/总人力成本×100%


    4.增长率指标（也叫黄金不等式）


    增长率是指通过对人力指标的增长情况设置一定的目标（阈值），控制人力成本不能超过这个阈值的范围，从而确保人效的质量。企业在使用这类指标的时候，通常会用到如下“黄金不等式”：


    总人力成本占比<利润预警线


    人力成本增长率<利润增长率


    人力成本增长率<收入增长率


    ## [第四节　敏捷绩效与薪酬福利](../Text/contents.xhtml#b_48)


    ### [一、目标与绩效管理的方式](../Text/contents.xhtml#c_49)


    目标管理方法（Management by Objectives，MBO）是管理者利用目标管理下级的方法，如图3-6所示。当组织的高层管理者确定了组织目标后，HR从业者必须对其进行有效分解，将组织的整体目标细分成各个部门和每个人的分目标，管理者根据分目标的完成情况对下级进行考核、评价和奖惩。


    ![](Images/cutq_101_44465_l.jpg)


    图3-6　目标管理方法（MBO）示意图


    目标与关键成果法（Objectives and Key Results，OKR）是一套明确目标并跟踪其完成情况的管理工具和方法。


    关键绩效指标（Key Performance Indicator，KPI）是一种目标式量化管理指标，就是把企业的战略目标分解为可操作的工作目标，它是企业绩效管理的基础。


    平衡计分卡（Balanced Score Card，BSC）是由哈佛商学院发明的一种绩效管理和绩效考核工具。


    上述几种工具适用于哪些应用场景呢？一般来说，考核初级员工时，企业适合采用MBO工具；考核管理层时，企业适合采用BSC管理工具。大部分企业适合使用KPI工具。OKR适用于从0到1的探索型工作，它可以探索各种可能性，寻求更优的解决方案，典型的场景如产品研发、广告公关策划、项目主导型企业等。这些岗位的工作大多需要更好的创意、更多的创新。


    ### [二、敏捷绩效](../Text/contents.xhtml#c_50)


    1.去KPI与正态分布


    绩效管理对企业来说至关重要，它是整个企业价值输出的导向。进入移动互联网时代后，OKR、人单合一、阿米巴等开始流行。许多企业放弃了强制分布和末位淘汰，纷纷开始转向敏捷绩效，员工与主管可以随时随地通过移动App修改目标、反馈意见，当然也可以征求其他专家或项目经理的反馈意见，而且绩效的产出结果不与晋升、调薪直接挂钩。这种方式极大地增强了员工与主管的沟通效果，可以帮助员工及时调整个人发展方向，实现快速成长。当然，有些东西是不可量化的，如工作激情与创新动力等，这就需要HR从业者平时多关注员工的工作状况、代码生产情况、行为表现、团队合作情况、沟通交流情况等，利用大数据及NLP技术建模，开展定量与定性的综合分析，明确哪些因素可以最大化地提高员工的业绩，从而达到提升组织效能的目的。


    英特尔公司和谷歌公司较早使用了OKR，埃森哲、Adobe、微软、戴尔、通用电气、IBM等公司已经开始推行敏捷绩效，百度公司也于2019年初开始全面推行OKR。


    2.敏捷沟通


    敏捷是一种哲学、一种文化和一组管理实践。敏捷正在彻底改变着人力资源管理领域。


    就人力资源管理工作而言，坐在会议室里参加冗长的会议并不总是正确的解决方案，HR从业者需要与业务部门共同开发解决方案。乔什·伯辛（Josh Bersin）给出了HR从业者与业务部门共创解决方案的敏捷模型，如图3-7所示。


    ![](Images/cutq_103_5552_l.jpg)


    图3-7　HR从业者与业务部门共创解决方案的敏捷模型


    人力资源部与业务部门共创解决方案，这代表了一种趋势。


    过去的做法是顶层设计解决方案，自上而下地完成。公司COE（专家中心）根据人力资源战略推导并设计相关项目，交付给各个事业部或业务单元落地执行，HRBP（人力资源业务伙伴）在全平台推动变革。与此同时，HRBP监督并处理各地的一致性问题。每隔几年整个项目就要重新修订一次。这个过程经历了瀑布法、COE驱动、统一协调、平台设计、变革管理、实施，唯独缺少了测试验证环节。


    新的敏捷方法是从源头出发设计解决方案，自下而上地完成。从源头识别问题、组织跨职能团队投入行动、共创解决方案，到现场测试与迭代、必要时嵌入平台、关注成功并快速迭代。这种做法的特点是与客户一起快速设计、在平台上开发、多个团队参与、聚焦成功。


    绩效管理被敏捷迭代的典型特征就是绩效沟通与反馈的频次大大提升。很多企业纷纷开发移动端，以移动端对话的形式随时随地与部门经理跟进项目的进展情况。同时，部门经理也会及时反馈员工的优点与不足，以便员工提升个人能力。这些情况会自动形成摘要并记录在系统后台，为下一步开展大数据分析奠定数据基础。


    3.员工敬业度和绩效管理


    据某科技媒体报道，亚马逊公司使用人工智能系统判断仓储物流中心员工的工作效率，如果员工的工作效率累计积分达不到标准，该系统就会发出警告甚至解雇的指令。该系统上线后，亚马逊公司仓储物流中心有数百名员工被解雇。


    亚马逊将AI系统作为了人力资源管理系统的前置数据采集和处理系统。AI系统先对工作场地的监控视频画面进行分析和处理，识别出员工身份ID和相应的行为状态，再把结果作为结构化数据进行输出。这一数据结果可以被用于不同的业务场景中，如用于提高工作场地的安全性，用于对员工的生产效率进行管理。亚马逊公司的AI系统通过识别员工是否在工作时间处于“摸鱼”状态而计算出员工的“偷懒时间”。AI系统可以实时将员工工作行为的状态进行数据化处理，其输出的结构化数据可以作为下游绩效管理系统的输入，为管理行为提供决策建议和数据基础。该决策过程无需人类参与，完全形成业务闭环。


    AI系统的“监工”功能在降低企业管理成本和提升员工效率方面的作用显而易见，AI系统可以准确计算每位员工每个小时完成的打包数量、每位员工的工作时间。但是，亚马逊允许AI系统直接解雇员工这一举动在道德层面也引起了社会上的巨大争议。据说亚马逊最近关闭了这款人工智能，并进行了迭代优化。


    亚马逊的案例是在人工智能时代人才管理变革的一个缩影，人工智能在帮助我们解决问题的同时也会带来新的问题。算法可以使竞争环境变得更加公平并能够提高员工敬业度，但我们在使用这些人工智能系统时，也需要警惕因此带来的弊端。网约车和外卖送餐服务让我们的生活变得更加便捷，我们只需要在手机上进行简单操作就可以享受到相应的服务，这些服务最终由网约车司机和外卖骑手完成。司机和骑手通过平台获取报酬，他们却不是平台公司的员工。司机和骑手无法自由管控自己的时间，因为平台对他们的绩效评估是通过算法进行计算并反映到报酬上的，评估标准包括日单量、客单价和用户反馈等。这些司机和骑手被一套复杂的人工智能算法系统管理着，却无法对这套系统施加影响。这是比亚马逊案例更加复杂和激进的情况。在可以预见的未来，越来越多的公司会在人才管理中引入人工智能算法，包括绩效分数评估、员工敬业度分析和管理序列推荐等。当然，完全用人工智能算法管理人并不是一个好主意。企业管理者需要采用更好的方法培训员工，也需要引入更好的技术帮助中层管理者理解如何支持员工并提升员工的绩效。


    员工敬业度是人才管理工作中最核心的部分，因为这直接关系到员工为企业创造了多少价值。有各种研究将员工敬业度水平与创新、安全、质量、收入、股东价值、客户满意度、保留率等方面联系起来。这些关联指标会因为行业和企业的不同而有所区别。但是，这些指标一旦设定完成，人工智能技术就可以把这些指标结果输出到仪表盘，并尽可能实时显示特定业务的关联并对关联度进行量化。例如，餐饮服务公司可能会比制造公司更清晰地看到员工敬业度和用户满意度的相关性。因为管理者对员工敬业度会产生巨大的影响，所以该系统可以在建议管理者提升员工敬业度的同时对管理者的管理水平进行评估。有研究发现，管理者与员工的沟通时间及频率和管理者的团队规模都会影响员工的敬业度。人工智能应用程序可以帮助管理者与团队成员进行定期讨论，并且关注员工敬业度水平的实时变化情况。从实践角度而言，提升员工敬业度的过程就是发现和认可员工的贡献并鼓励员工在工作中全力投入的过程。显然，仅仅依靠人工智能技术并不能完全实现这个过程。但通过让管理者拥有更好、更及时的信息，系统可以指导他们与团队成员建立更好的关系。'
  fmt: "\n研究组织的人员结构分布与组织形态，对人力成本的预算编制工作有一定的积极作用。\n\n## 一、人才结构演变规律\n\n人才结构包括四种常见模型，即`花瓶模型人才结构`、`钻石模型人才结构`、`橄榄模型人才结构`和`球形模型人才结构`，如图3-3所示。\n\
    \n![](Images/cutq_91_1346_l.jpg)\n\n图3-3　人才结构的四种模型\n\n不同组织业态下的人才结构模型不同，如何进化迭代才能使人才符合企业发展与变化的需要呢？企业可以采用`Curve分析`、`预算模拟器`等方法。\n\
    \n## 二、Curve分析\n\n`Curve分析`是近几年兴起的一种数据分析方法，最早可以追溯到`Hay Guide Chart`里岗位的“形状构成”评估应用。海氏评估法又叫“指导图表——形状构成法”，是美国工资设计专家艾德华·海于1951年研究并开发出来，它有效地解决了不同职能部门的不同职务之间相对价值的相互比较和量化的难题。海氏评估法的实质是一种评分法，根据这个系统，所有职务包含的最主要的付酬因素有三种，即知识技能水平、解决问题的能力和承担的职务责任。这三大因素又包括多个二级因素和相应的评分体系。不同因素之间的重要性可以通过权重进行调节，以便适用于不同的组织。海氏评估法认为，一个岗位能够存在的理由是因为岗位任职者必须要承担一定的责任，具备一定的知识技能，产生一定的产出。具备一定知识和技能的员工通过什么方式取得产出呢？那就是通过在岗位中解决其面对的问题，即承担“职务责任”、投入“知识和技能”、最终“解决问题”。海氏评估法按照以上三个要素及相应的标准对岗位进行评估打分，得出每个岗位的评估分，即`岗位评估分=知识和技能得分+解决问题得分+职务责任得分`。其中，知识和技能得分、职务责任得分与最后得分都是绝对分，而解决问题得分是相对分（百分值），只有调整为最后得分才是绝对分。HR从业者在利用海氏评估法评估三种主要付酬因素的不同分数时，还必须考虑各岗位的“形状构成”，以确定该因素的权重，据此计算出各岗位相对价值的总分，完成岗位评估活动。所谓职务的“形状”主要取决于知识和技能与解决问题的能力这两个因素相对于职务责任这一因素的影响力的对比与分配。\n\
    \n多年来，业内对`Curve分析`并没有给出合适的中文译名，本书将`Curve分析`译成`腰线分析`，并做出以下定义：`腰线分析`是指针对某一类数据以类似正态分布的形式划分“等级”，通过权重调高或调低“等级”使数据在一定的合理范围内以适用于不同的组织，即通过调节腰线的位置和腰的宽度模拟组织排兵布阵是否符合管理要求，从而达到管理的目的。\n\
    \n下面以ABC公司某专业序列（`P序列`）人数说明`Curve分析`对人才结构的影响。\n\n某年，ABC公司的员工人数数据及职级的分布如表3-2所示，`Curve分析`图如图3-4所示。\n\
    \n表3-2　ABC公司的员工人数统计表\n\n![](Images/table_image_93_0.jpg)\n![](Images/cutq_94_2046_l.jpg)\n\
    \n图3-4　ABC公司员工人数的`Curve分析`图\n\n从图3-4中可以发现，HR从业者需要调整该公司的人员结构，其中只调整相应层级的人员分布即可，即调整腰线的位置或宽度来改变形状。这就需要HR从业者采取以下科学的人力资源管理机制与管理动作。\n\
    \n1. **招聘**。通过开展校园招聘的方式解决`P3`层级人员不足的问题，同时布局未来2~3年的企业人才结构与竞争力。其他层级的人员不足问题可以通过开展社会招聘的方式来解决。\n\
    2. **晋升**。通过控制内部晋升比例调节各个层级人员的结构分布。\n3. **岗位调动**。内部的岗位调动也可以起到调节各个层级人员分布的作用。尤其是组织调整，能够直接影响企业的人才结构。\n\
    4. **离职**。员工主动离职和被动离职都可以对企业的人才结构起到一定的微调作用。\n\n在规划人才总量的时候，有些公司是单控，只控制人员编制或人力成本；有些公司是双控，既控制人员编制又控制人力成本。模型相对比较复杂一些，不仅需要考虑`Curve`结构，而且需要考虑地域、学校、学历、年龄、司龄、技能、绩效、薪酬分位等因素。HR从业者可以通过大数据模型与算法，充分利用历史数据，结合不同的应用场景，做好预警预测，助力管理者制定决策。\n\
    \n## 三、预算模拟器\n\n`预算模拟器`的设计逻辑就是模拟测算部门内不同层级、不同人数占用的人力成本，从而达到粗略编制预算的目的。\n\n`预算模拟器`也可以用于招聘工作。企业用户使用`预算模拟器`可以计算出是用100万元招聘一位`P8`级的高级专家，还是用同样的成本招聘四个`P6`级程序员，或是计算在规定的预算费用内每个级别可以招聘多少人等。\n\
    \n预算编制工作通常采取与自己比、与同行比等方式。当然，人力成本的增长幅度不能高于收入增长和利润增长的幅度，否则就是做无用功。要想让本企业的员工收入高于同行业企业的平均收入，使员工收入具备行业竞争力，提升员工的幸福感，企业就需要创造可持续发展的利润。人力成本与利润这二者是矛盾的，只有在某个点上保持相对平衡，企业才能向上发展并进展顺利，员工收入才能更好。\n\
    \n计算人力成本时有三个著名的黄金不等式，分别如下。\n\n```\n1. 人力成本增长率 < 利润增长率\n人力成本增长率 = 人力成本增长额 / 上期人力成本\
    \ × 100%\n其中，人力成本增长额 = 本期人力成本 – 上期人力成本\n\n利润增长率 = 利润增长额 / 上期利润总额 × 100%\n其中，利润增长额\
    \ = 本期利润总额 – 上期利润总额\n```\n\n![](Images/cutq_96_26652_l.jpg)\n\n图3-5　人力成本增长率与利润增长率的关系图\n\
    \n```\n2. 总人力成本占比 < 利润预警线\n人力成本占比 = 人力成本总额 / 同期总成本 × 100%\n人力成本占收比 = 人力成本合计 /\
    \ 收入合计 × 100%\n```\n\n```\n3. 人力成本增长率 < 收入增长率\n收入增长率 = 收入增长额 / 上期收入 × 100%\n其中，收入增长额\
    \ = 本期收入 – 上期收入\n```\n\n## 第三节 人效关键指标与影响因素\n\n人效有如下两种定义。\n\n第一，人效是人力资源有效性（`HR\
    \ Effectiveness`）的简称，是指人力资源管理达成目标的程度。\n\n第二，人效是人力资源效能（`HR Efficiency`）的简称，它反映人的投入产出比。从本质上看，人效要反映出人力资源系统的有效性。具体来说，就是要计算出不同人力的投入是否产出了相应的效果。简单地说，财务或市场结果除以人力单位，就是人效指标。这是最硬性的指标，也最能彰显人力资源部职能的价值。\n\
    \n人工智能技术应用到人力资源领域后，将重塑人力资源的业务流程与管理模式，为大幅提升人效提供了技术保障与平台支撑。\n\n### 一、关键影响因素\n\n\
    影响人效指标的因素主要分为外部因素和内部因素两类，具体内容分别如下。\n\n**1. 外部因素**\n\n- （1）经济发展与环境影响，如数字化转型等。\n\
    - （2）前沿技术影响，如`5G`技术、数字化技术、`AIoT`、智能制造等。\n- （3）劳动力市场供给影响，如灵活用工等新型用工形式。\n- （4）行业人才，如`AI`人才、算法工程师、数据挖掘工程师等的流动情况。\n\
    \n**2. 内部因素**\n\n- （1）供需关系：业务需求与人员关系\n  \n  企业管理者通过观察需求侧与供给侧变化的趋势，了解现有人员配置情况，有针对性地调整策略。例如，某公司的人员变化幅度普遍小于业务变化幅度（即人员供不应求），说明该公司的人才策略较为稳健和谨慎，管理者可考虑通过加快调控人才结构与分布、提升人员效能的方式实现公司的业务目标。相反，如果某公司的人员变化幅度大于业务变化幅度（即人员供过于求），一般来说这种状态存在于开拓性、创新性、前沿性的技术研发部门。\n\
    \n- （2）人员盘点与运营情况，包括数量、结构、质量等情况及改善目标\n  \n  HR从业者可通过如下五个维度分析与洞察人才队伍存在的问题，从而制定改进策略：\n\
    \  - ① 对员工结构的分析，如性别、年龄、司龄、学历、地域等；\n  - ② 对员工价值的分析，如职级、绩效、关键岗位等；\n  - ③ 对员工行为的分析，如敬业度、满意度、风险度等；\n\
    \  - ④ 对员工能力的分析，如通用能力、专业能力、领导力、潜力等；\n  - ⑤ 员工大数据分析，如人才画像、标签等。\n\n- （3）人员流动情况及预测\n\
    \  \n  通过大数据分析建立员工离职预测模型，该模型主要用于预测员工流失情况并提出预警，结合“企业内部人才继任表”协助HR从业者提前进行干预。\n  \n\
    \  通过大数据分析建立人才迁徙地图，该地图可以帮助HR从业者及时掌握企业内外部人才的动态，为入、离、升、降、调的管理工作提供数据分析与决策参考。\n\n\
    - （4）人效竞争力\n  \n  企业的人效竞争力主要体现在“人才流量表”“人才损益表”和“人才资产负债表”这三张表上。\n\n- （5）组织调整变化\n\
    \  \n  在企业发展的不同阶段或不同的历史时期，随着企业经营战略的变化，组织也会随之做出调整，组织的变化就会带来人才排兵布阵的变化，从而影响到人员效率与效能的变化。\n\
    \n### 二、人效关键指标\n\n**1. 人力费用率指标**\n\n人力费用率是指人力成本在组织总销售额或总运营成本中所占的比例。人力费用率的指标越高，说明组织的人力成本越高，也就意味着人效可能越不占优势。常用的指标公式如下：\n\
    \n```\n人力费用率 = 总人力成本 / 总销售额（或总产值） × 100%\n人力费用率 = 总人力成本 / 总运营成本 × 100%\n```\n\n\
    **2. 人力资本效率指标**\n\n人力资本效率反映了每一位员工创造的价值。常用的指标公式如下：\n\n```\n人均销售额 = 组织总销售额 / 员工人数\n\
    人均产值 = 组织总产值 / 员工人数\n人均利润 = 组织净利润 / 员工人数\n```\n\n**3. 人力资本投资回报率指标**\n\n人力资本投资回报率反映了在人力资源方面投入的每一笔费用会给企业带来多大的产出。常用的指标公式如下：\n\
    \n```\n元产值 = 组织总产值 / 总人力成本\n人力资本投资回报率 = 组织净利润 / 总人力成本 × 100%\n```\n\n**4. 增长率指标（也叫黄金不等式）**\n\
    \n增长率是指通过对人力指标的增长情况设置一定的目标（阈值），控制人力成本不能超过这个阈值的范围，从而确保人效的质量。企业在使用这类指标的时候，通常会用到如下“黄金不等式”：\n\
    \n```\n总人力成本占比 < 利润预警线\n人力成本增长率 < 利润增长率\n人力成本增长率 < 收入增长率\n```\n\n## 第四节 敏捷绩效与薪酬福利\n\
    \n### 一、目标与绩效管理的方式\n\n目标管理方法（`Management by Objectives`，`MBO`）是管理者利用目标管理下级的方法，如图3-6所示。当组织的高层管理者确定了组织目标后，HR从业者必须对其进行有效分解，将组织的整体目标细分成各个部门和每个人的分目标，管理者根据分目标的完成情况对下级进行考核、评价和奖惩。\n\
    \n![](Images/cutq_101_44465_l.jpg)\n\n图3-6　目标管理方法（`MBO`）示意图\n\n目标与关键成果法（`Objectives\
    \ and Key Results`，`OKR`）是一套明确目标并跟踪其完成情况的管理工具和方法。\n\n关键绩效指标（`Key Performance Indicator`，`KPI`）是一种目标式量化管理指标，就是把企业的战略目标分解为可操作的工作目标，它是企业绩效管理的基础。\n\
    \n平衡计分卡（`Balanced Score Card`，`BSC`）是由哈佛商学院发明的一种绩效管理和绩效考核工具。\n\n上述几种工具适用于哪些应用场景呢？一般来说，考核初级员工时，企业适合采用`MBO`工具；考核管理层时，企业适合采用`BSC`管理工具。大部分企业适合使用`KPI`工具。`OKR`适用于从0到1的探索型工作，它可以探索各种可能性，寻求更优的解决方案，典型的场景如产品研发、广告公关策划、项目主导型企业等。这些岗位的工作大多需要更好的创意、更多的创新。\n\
    \n### 二、敏捷绩效\n\n#### 1. 去KPI与正态分布\n\n绩效管理对企业来说至关重要，它是整个企业价值输出的导向。进入移动互联网时代后，`OKR`、人单合一、阿米巴等开始流行。许多企业放弃了强制分布和末位淘汰，纷纷开始转向敏捷绩效，员工与主管可以随时随地通过移动App修改目标、反馈意见，当然也可以征求其他专家或项目经理的反馈意见，而且绩效的产出结果不与晋升、调薪直接挂钩。这种方式极大地增强了员工与主管的沟通效果，可以帮助员工及时调整个人发展方向，实现快速成长。当然，有些东西是不可量化的，如工作激情与创新动力等，这就需要HR从业者平时多关注员工的工作状况、代码生产情况、行为表现、团队合作情况、沟通交流情况等，利用大数据及`NLP`技术建模，开展定量与定性的综合分析，明确哪些因素可以最大化地提高员工的业绩，从而达到提升组织效能的目的。\n\
    \n英特尔公司和谷歌公司较早使用了`OKR`，埃森哲、Adobe、微软、戴尔、通用电气、IBM等公司已经开始推行敏捷绩效，百度公司也于2019年初开始全面推行`OKR`。\n\
    \n#### 2. 敏捷沟通\n\n敏捷是一种哲学、一种文化和一组管理实践。敏捷正在彻底改变着人力资源管理领域。\n\n就人力资源管理工作而言，坐在会议室里参加冗长的会议并不总是正确的解决方案，HR从业者需要与业务部门共同开发解决方案。乔什·伯辛给出了HR从业者与业务部门共创解决方案的敏捷模型，如图3-7所示。\n\
    \n![](Images/cutq_103_5552_l.jpg)\n\n图3-7　HR从业者与业务部门共创解决方案的敏捷模型\n\n人力资源部与业务部门共创解决方案，这代表了一种趋势。\n\
    \n过去的做法是顶层设计解决方案，自上而下地完成。公司`COE`（专家中心）根据人力资源战略推导并设计相关项目，交付给各个事业部或业务单元落地执行，`HRBP`（人力资源业务伙伴）在全平台推动变革。与此同时，`HRBP`监督并处理各地的一致性问题。每隔几年整个项目就要重新修订一次。这个过程经历了瀑布法、`COE`驱动、统一协调、平台设计、变革管理、实施，唯独缺少了测试验证环节。\n\
    \n新的敏捷方法是从源头出发设计解决方案，自下而上地完成。从源头识别问题、组织跨职能团队投入行动、共创解决方案，到现场测试与迭代、必要时嵌入平台、关注成功并快速迭代。这种做法的特点是与客户一起快速设计、在平台上开发、多个团队参与、聚焦成功。\n\
    \n绩效管理被敏捷迭代的典型特征就是绩效沟通与反馈的频次大大提升。很多企业纷纷开发移动端，以移动端对话的形式随时随地与部门经理跟进项目的进展情况。同时，部门经理也会及时反馈员工的优点与不足，以便员工提升个人能力。这些情况会自动形成摘要并记录在系统后台，为下一步开展大数据分析奠定数据基础。\n\
    \n#### 3. 员工敬业度和绩效管理\n\n据某科技媒体报道，亚马逊公司使用人工智能系统判断仓储物流中心员工的工作效率，如果员工的工作效率累计积分达不到标准，该系统就会发出警告甚至解雇的指令。该系统上线后，亚马逊公司仓储物流中心有数百名员工被解雇。\n\
    \n亚马逊将`AI`系统作为了人力资源管理系统的前置数据采集和处理系统。`AI`系统先对工作场地的监控视频画面进行分析和处理，识别出员工身份`ID`和相应的行为状态，再把结果作为结构化数据进行输出。这一数据结果可以被用于不同的业务场景中，如用于提高工作场地的安全性，用于对员工的生产效率进行管理。亚马逊公司的`AI`系统通过识别员工是否在工作时间处于“摸鱼”状态而计算出员工的“偷懒时间”。`AI`系统可以实时将员工工作行为的状态进行数据化处理，其输出的结构化数据可以作为下游绩效管理系统的输入，为管理行为提供决策建议和数据基础。该决策过程无需人类参与，完全形成业务闭环。\n\
    \n`AI`系统的“监工”功能在降低企业管理成本和提升员工效率方面的作用显而易见，`AI`系统可以准确计算每位员工每个小时完成的打包数量、每位员工的工作时间。但是，亚马逊允许`AI`系统直接解雇员工这一举动在道德层面也引起了社会上的巨大争议。据说亚马逊最近关闭了这款人工智能，并进行了迭代优化。\n\
    \n亚马逊的案例是在人工智能时代人才管理变革的一个缩影，人工智能在帮助我们解决问题的同时也会带来新的问题。算法可以使竞争环境变得更加公平并能够提高员工敬业度，但我们在使用这些人工智能系统时，也需要警惕因此带来的弊端。网约车和外卖送餐服务让我们的生活变得更加便捷，我们只需要在手机上进行简单操作就可以享受到相应的服务，这些服务最终由网约车司机和外卖骑手完成。司机和骑手通过平台获取报酬，他们却不是平台公司的员工。司机和骑手无法自由管控自己的时间，因为平台对他们的绩效评估是通过算法进行计算并反映到报酬上的，评估标准包括日单量、客单价和用户反馈等。这些司机和骑手被一套复杂的人工智能算法系统管理着，却无法对这套系统施加影响。这是比亚马逊案例更加复杂和激进的情况。在可以预见的未来，越来越多的公司会在人才管理中引入人工智能算法，包括绩效分数评估、员工敬业度分析和管理序列推荐等。当然，完全用人工智能算法管理人并不是一个好主意。企业管理者需要采用更好的方法培训员工，也需要引入更好的技术帮助中层管理者理解如何支持员工并提升员工的绩效。\n\
    \n员工敬业度是人才管理工作中最核心的部分，因为这直接关系到员工为企业创造了多少价值。有各种研究将员工敬业度水平与创新、安全、质量、收入、股东价值、客户满意度、保留率等方面联系起来。这些关联指标会因为行业和企业的不同而有所区别。但是，这些指标一旦设定完成，人工智能技术就可以把这些指标结果输出到仪表盘，并尽可能实时显示特定业务的关联并对关联度进行量化。例如，餐饮服务公司可能会比制造公司更清晰地看到员工敬业度和用户满意度的相关性。因为管理者对员工敬业度会产生巨大的影响，所以该系统可以在建议管理者提升员工敬业度的同时对管理者的管理水平进行评估。有研究发现，管理者与员工的沟通时间及频率和管理者的团队规模都会影响员工的敬业度。人工智能应用程序可以帮助管理者与团队成员进行定期讨论，并且关注员工敬业度水平的实时变化情况。从实践角度而言，提升员工敬业度的过程就是发现和认可员工的贡献并鼓励员工在工作中全力投入的过程。显然，仅仅依靠人工智能技术并不能完全实现这个过程。但通过让管理者拥有更好、更及时的信息，系统可以指导他们与团队成员建立更好的关系。\n"
  trans: "\nThe personnel structure distribution and organizational form of a research\
    \ organization play a positive role in the budget preparation of human costs.\n\
    \n## I. Laws of Talent Structure Evolution\n\nTalent structures include four common\
    \ models: the `Vase Model Talent Structure`, `Diamond Model Talent Structure`,\
    \ `Olive Model Talent Structure`, and `Sphere Model Talent Structure`, as shown\
    \ in Figure 3-3.\n\n![](img/cutq_91_1346_l.jpg)\n\nFigure 3-3 Four Models of Talent\
    \ Structure\n\nTalent structure models vary under different organizational business\
    \ models. How can they evolve and iterate to ensure talent meets the needs of\
    \ enterprise development and change? Enterprises can adopt methods such as `Curve\
    \ Analysis` and `Budget Simulator`.\n\n## II. Curve Analysis\n\n`Curve Analysis`\
    \ is a data analysis method that has emerged in recent years. It can be traced\
    \ back to the \"Shape Configuration\" evaluation application for positions in\
    \ the `Hay Guide Chart`. The Hay Evaluation Method, also known as the \"Guide\
    \ Chart–Profile Method,\" was researched and developed by U.S. compensation design\
    \ expert Edward N. Hay in 1951. It effectively solved the difficulty of mutual\
    \ comparison and quantification of relative value between different positions\
    \ across different functional departments. The essence of the Hay Evaluation Method\
    \ is a scoring method. According to this system, the three main compensable factors\
    \ contained in all positions are: Knowledge/Skill Level, Problem-Solving Ability,\
    \ and Accountability. These three major factors include multiple sub-factors and\
    \ corresponding scoring systems. The importance of different factors can be adjusted\
    \ via weights to suit different organizations. The Hay Evaluation Method posits\
    \ that a position exists because the incumbent must assume certain responsibilities,\
    \ possess certain knowledge and skills, and produce certain outputs. How do employees\
    \ with certain knowledge and skills obtain outputs? By solving problems faced\
    \ in the position—i.e., assuming \"Accountability,\" applying \"Knowledge and\
    \ Skills,\" and ultimately \"Solving Problems.\" The Hay Evaluation Method evaluates\
    \ and scores positions based on the above three elements and corresponding standards\
    \ to derive the evaluation score for each position: `Position Evaluation Score\
    \ = Knowledge/Skill Score + Problem-Solving Score + Accountability Score`. Among\
    \ these, the Knowledge/Skill Score, Accountability Score, and the Final Score\
    \ are absolute scores, while the Problem-Solving Score is a relative score (percentage),\
    \ becoming an absolute score only when adjusted to the final score. When HR practitioners\
    \ use the Hay Evaluation Method to evaluate different scores for the three main\
    \ compensable factors, they must also consider the \"Shape Configuration\" of\
    \ each position to determine the weight of that factor, thereby calculating the\
    \ total score of the relative value of each position and completing the position\
    \ evaluation activity. The so-called \"Shape\" of a position mainly depends on\
    \ the comparison and distribution of the influence of Knowledge/Skills and Problem-Solving\
    \ Ability relative to Accountability.\n\nFor many years, the industry has not\
    \ provided a suitable Chinese translation for `Curve Analysis`. This book translates\
    \ `Curve Analysis` as `Waistline Analysis` and defines it as follows: `Waistline\
    \ Analysis` refers to dividing a certain category of data into \"grades\" in a\
    \ form similar to a normal distribution, raising or lowering \"grades\" through\
    \ weight adjustments so that the data falls within a certain reasonable range\
    \ to suit different organizations. That is, by adjusting the position of the waistline\
    \ and the width of the waist to simulate whether the organization's troop deployment\
    \ meets management requirements, thereby achieving management objectives.\n\n\
    Below, the impact of `Curve Analysis` on talent structure is illustrated using\
    \ the headcount data of a specific professional sequence (`P Sequence`) at Company\
    \ ABC.\n\nIn a certain year, Company ABC's employee headcount data and grade distribution\
    \ are shown in Table 3-2, and the `Curve Analysis` chart is shown in Figure 3-4.\n\
    \nTable 3-2 Company ABC Employee Headcount Statistics Table\n\n![](img/table_image_93_0.jpg)\n\
    ![](img/cutq_94_2046_l.jpg)\n\nFigure 3-4 `Curve Analysis` Chart of Company ABC\
    \ Employee Headcount\n\nFrom Figure 3-4, it can be found that HR practitioners\
    \ need to adjust the company's personnel structure, simply by adjusting the personnel\
    \ distribution at the corresponding levels—i.e., adjusting the position or width\
    \ of the waistline to change the shape. This requires HR practitioners to adopt\
    \ the following scientific human resource management mechanisms and actions.\n\
    \n1. **Recruitment**. Solve the shortage of `P3` level personnel through campus\
    \ recruitment, while laying out the enterprise talent structure and competitiveness\
    \ for the next 2–3 years. Shortages at other levels can be addressed through social\
    \ recruitment.\n2. **Promotion**. Adjust the structural distribution of personnel\
    \ at various levels by controlling internal promotion ratios.\n3. **Job Rotation**.\
    \ Internal job rotation can also play a role in regulating personnel distribution\
    \ at various levels. Organizational restructuring, in particular, can directly\
    \ impact the enterprise's talent structure.\n4. **Turnover**. Both voluntary and\
    \ involuntary turnover can play a certain fine-tuning role in the enterprise's\
    \ talent structure.\n\nWhen planning total talent volume, some companies implement\
    \ single control (controlling only headcount or human cost), while others implement\
    \ dual control (controlling both headcount and human cost). The model is relatively\
    \ complex, requiring consideration not only of the `Curve` structure but also\
    \ factors such as region, school, education, age, tenure, skills, performance,\
    \ and compensation percentiles. HR practitioners can leverage big data models\
    \ and algorithms, fully utilize historical data, combine different application\
    \ scenarios, perform early warning and prediction, and assist managers in decision-making.\n\
    \n## III. Budget Simulator\n\nThe design logic of the `Budget Simulator` is to\
    \ simulate and calculate the human costs occupied by different levels and headcounts\
    \ within a department, thereby achieving the purpose of rough budget preparation.\n\
    \nThe `Budget Simulator` can also be used for recruitment work. Enterprise users\
    \ can use the `Budget Simulator` to calculate whether to hire one `P8` senior\
    \ expert for 1 million yuan, or four `P6` programmers for the same cost, or calculate\
    \ how many people can be hired at each level within the specified budget.\n\n\
    Budget preparation usually adopts methods such as year-on-year comparison and\
    \ peer benchmarking. Of course, the growth rate of human costs cannot exceed the\
    \ growth rates of revenue and profit; otherwise, it is futile. To make the company's\
    \ employee income higher than the industry average, giving employee income industry\
    \ competitiveness and enhancing employee happiness, the enterprise needs to create\
    \ sustainable profits. Human cost and profit are contradictory; only by maintaining\
    \ a relative balance at a certain point can the enterprise develop upward smoothly,\
    \ and employee income can be better.\n\nThere are three famous \"Golden Inequalities\"\
    \ for calculating human costs, as follows.\n\n```\n1. Human Cost Growth Rate <\
    \ Profit Growth Rate\nHuman Cost Growth Rate = Human Cost Increase / Previous\
    \ Period Human Cost × 100%\nWhere, Human Cost Increase = Current Period Human\
    \ Cost – Previous Period Human Cost\n\nProfit Growth Rate = Profit Increase /\
    \ Previous Period Total Profit × 100%\nWhere, Profit Increase = Current Period\
    \ Total Profit – Previous Period Total Profit\n```\n\n![](img/cutq_96_26652_l.jpg)\n\
    \nFigure 3-5 Relationship Chart between Human Cost Growth Rate and Profit Growth\
    \ Rate\n\n```\n2. Total Human Cost Ratio < Profit Warning Line\nHuman Cost Ratio\
    \ = Total Human Cost / Total Cost for Same Period × 100%\nHuman Cost to Revenue\
    \ Ratio = Total Human Cost / Total Revenue × 100%\n```\n\n```\n3. Human Cost Growth\
    \ Rate < Revenue Growth Rate\nRevenue Growth Rate = Revenue Increase / Previous\
    \ Period Revenue × 100%\nWhere, Revenue Increase = Current Period Revenue – Previous\
    \ Period Revenue\n```\n\n## Section 3 Key Indicators and Influencing Factors of\
    \ Human Efficiency\n\nHuman efficiency (Ren Xiao) has the following two definitions.\n\
    \nFirst, human efficiency stands for **HR Effectiveness**, referring to the degree\
    \ to which human resource management achieves its goals.\n\nSecond, human efficiency\
    \ stands for **HR Efficiency**, reflecting the input-output ratio of people. Essentially,\
    \ human efficiency must reflect the effectiveness of the human resource system.\
    \ Specifically, it calculates whether different human inputs have produced corresponding\
    \ effects. Simply put, financial or market results divided by human units equals\
    \ the human efficiency indicator. This is the most hard-line indicator and best\
    \ demonstrates the value of the HR function.\n\nWith the application of AI technology\
    \ in the HR field, HR business processes and management models will be reshaped,\
    \ providing technical guarantees and platform support for significantly improving\
    \ human efficiency.\n\n### I. Key Influencing Factors\n\nFactors influencing human\
    \ efficiency indicators are mainly divided into two categories: external factors\
    \ and internal factors, detailed as follows.\n\n**1. External Factors**\n\n- (1)\
    \ Economic development and environmental impact, such as digital transformation,\
    \ etc.\n- (2) Frontier technology impact, such as `5G` technology, digital technology,\
    \ `AIoT`, intelligent manufacturing, etc.\n- (3) Labor market supply impact, such\
    \ as new employment forms like flexible employment.\n- (4) Industry talent, such\
    \ as the mobility of `AI` talent, algorithm engineers, data mining engineers,\
    \ etc.\n\n**2. Internal Factors**\n\n- (1) Supply-Demand Relationship: Business\
    \ Demand vs. Personnel Relationship\n  \n  By observing the changing trends of\
    \ the demand side and supply side, managers understand the current personnel allocation\
    \ situation and adjust strategies in a targeted manner. For example, if a company's\
    \ personnel change amplitude is generally smaller than its business change amplitude\
    \ (i.e., talent supply falls short of demand), it indicates the company's talent\
    \ strategy is relatively steady and prudent. Managers may consider achieving business\
    \ goals by accelerating the regulation of talent structure and distribution and\
    \ improving personnel efficiency. Conversely, if a company's personnel change\
    \ amplitude is greater than its business change amplitude (i.e., talent supply\
    \ exceeds demand), this state generally exists in pioneering, innovative, and\
    \ frontier technology R&D departments.\n\n- (2) Personnel Inventory and Operation\
    \ Status, including Quantity, Structure, Quality, etc., and Improvement Goals\n\
    \  \n  HR practitioners can analyze and gain insights into problems existing in\
    \ the talent team through the following five dimensions, thereby formulating improvement\
    \ strategies:\n  - ① Analysis of employee structure, such as gender, age, tenure,\
    \ education, region, etc.;\n  - ② Analysis of employee value, such as grade, performance,\
    \ key positions, etc.;\n  - ③ Analysis of employee behavior, such as engagement,\
    \ satisfaction, risk, etc.;\n  - ④ Analysis of employee capability, such as general\
    \ ability, professional ability, leadership, potential, etc.;\n  - ⑤ Employee\
    \ big data analysis, such as talent portraits, tags, etc.\n\n- (3) Personnel Mobility\
    \ Status and Prediction\n  \n  Establish an employee turnover prediction model\
    \ through big data analysis. This model is mainly used to predict employee attrition\
    \ and provide early warnings, combined with the \"Internal Talent Succession Table\"\
    \ to assist HR practitioners in early intervention.\n  \n  Establish a talent\
    \ migration map through big data analysis. This map helps HR practitioners timely\
    \ grasp internal and external talent dynamics, providing data analysis and decision-making\
    \ reference for the management of hiring, separation, promotion, demotion, and\
    \ transfer.\n\n- (4) Human Efficiency Competitiveness\n  \n  An enterprise's human\
    \ efficiency competitiveness is mainly reflected in three tables: \"Talent Flow\
    \ Statement,\" \"Talent Profit and Loss Statement,\" and \"Talent Balance Sheet.\"\
    \n\n- (5) Organizational Adjustment and Changes\n  \n  At different stages of\
    \ enterprise development or different historical periods, as the business strategy\
    \ changes, the organization will adjust accordingly. Organizational changes bring\
    \ about changes in talent deployment, thereby affecting changes in personnel efficiency\
    \ and effectiveness.\n\n### II. Key Indicators of Human Efficiency\n\n**1. Human\
    \ Cost Ratio Indicators**\n\nThe human cost ratio refers to the proportion of\
    \ human costs in the organization's total sales or total operating costs. The\
    \ higher the human cost ratio indicator, the higher the organization's human costs,\
    \ meaning human efficiency may be less advantageous. Common indicator formulas\
    \ are as follows:\n\n```\nHuman Cost Ratio = Total Human Cost / Total Sales (or\
    \ Total Output Value) × 100%\nHuman Cost Ratio = Total Human Cost / Total Operating\
    \ Cost × 100%\n```\n\n**2. Human Capital Efficiency Indicators**\n\nHuman capital\
    \ efficiency reflects the value created by each employee. Common indicator formulas\
    \ are as follows:\n\n```\nRevenue per Employee = Organization Total Sales / Number\
    \ of Employees\nOutput Value per Employee = Organization Total Output Value /\
    \ Number of Employees\nProfit per Employee = Organization Net Profit / Number\
    \ of Employees\n```\n\n**3. Human Capital ROI Indicators**\n\nHuman capital ROI\
    \ reflects how much output each expense invested in human resources brings to\
    \ the enterprise. Common indicator formulas are as follows:\n\n```\nOutput Value\
    \ per Yuan = Organization Total Output Value / Total Human Cost\nHuman Capital\
    \ ROI = Organization Net Profit / Total Human Cost × 100%\n```\n\n**4. Growth\
    \ Rate Indicators (Also Called Golden Inequalities)**\n\nGrowth rate refers to\
    \ setting certain targets (thresholds) for the growth of human indicators, controlling\
    \ human costs not to exceed this threshold range, thereby ensuring the quality\
    \ of human efficiency. When enterprises use this type of indicator, they usually\
    \ use the following \"Golden Inequalities\":\n\n```\nTotal Human Cost Ratio <\
    \ Profit Warning Line\nHuman Cost Growth Rate < Profit Growth Rate\nHuman Cost\
    \ Growth Rate < Revenue Growth Rate\n```\n\n## Section 4 Agile Performance and\
    \ Compensation & Benefits\n\n### I. Methods of Goal and Performance Management\n\
    \nManagement by Objectives (`MBO`) is a method where managers manage subordinates\
    \ through objectives, as shown in Figure 3-6. After top management determines\
    \ organizational goals, HR practitioners must effectively decompose them, breaking\
    \ down the overall organizational goals into sub-goals for each department and\
    \ individual. Managers then assess, evaluate, and reward or punish subordinates\
    \ based on the completion of these sub-goals.\n\n![](img/cutq_101_44465_l.jpg)\n\
    \nFigure 3-6 Schematic Diagram of Management by Objectives (`MBO`)\n\nObjectives\
    \ and Key Results (`OKR`) is a management tool and method for defining objectives\
    \ and tracking their completion.\n\nKey Performance Indicators (`KPI`) are goal-oriented\
    \ quantitative management indicators. They decompose the enterprise's strategic\
    \ goals into operable work goals and are the foundation of enterprise performance\
    \ management.\n\nBalanced Scorecard (`BSC`) is a performance management and appraisal\
    \ tool invented by Harvard Business School.\n\nWhat application scenarios are\
    \ the above tools suitable for? Generally, when assessing junior employees, enterprises\
    \ are suitable to use the `MBO` tool; when assessing management, enterprises are\
    \ suitable to use the `BSC` management tool. Most enterprises are suitable to\
    \ use the `KPI` tool. `OKR` is suitable for exploratory work from 0 to 1; it can\
    \ explore various possibilities and seek better solutions. Typical scenarios include\
    \ product R&D, advertising/PR planning, project-driven enterprises, etc. These\
    \ positions mostly require better creativity and more innovation.\n\n### II. Agile\
    \ Performance\n\n#### 1. De-KPI and Normal Distribution\n\nPerformance management\
    \ is crucial for enterprises; it is the orientation of the entire enterprise's\
    \ value output. After entering the mobile Internet era, `OKR`, \"Integration of\
    \ People and Tasks\" (Ren Dan He Yi), Amoeba Management, etc., began to prevail.\
    \ Many enterprises abandoned forced distribution and rank-and-yank (forced ranking),\
    \ turning to agile performance. Employees and managers can modify goals and provide\
    \ feedback anytime, anywhere via mobile Apps; they can also solicit feedback from\
    \ other experts or project managers. Moreover, performance output results are\
    \ not directly linked to promotion or salary adjustment. This approach greatly\
    \ enhances communication effectiveness between employees and managers, helps employees\
    \ adjust personal development directions in time, and achieve rapid growth. Of\
    \ course, some things are unquantifiable, such as work passion and innovation\
    \ drive. This requires HR practitioners to pay more attention to employees' work\
    \ status, code production, behavior performance, teamwork, and communication on\
    \ a daily basis, using big data and `NLP` technology for modeling, conducting\
    \ quantitative and qualitative comprehensive analysis, clarifying which factors\
    \ can maximize employee performance, thereby achieving the goal of improving organizational\
    \ effectiveness.\n\nIntel and Google adopted `OKR` earlier. Accenture, Adobe,\
    \ Microsoft, Dell, General Electric, IBM, and other companies have begun to promote\
    \ agile performance. Baidu also started comprehensively promoting `OKR` in early\
    \ 2019.\n\n#### 2. Agile Communication\n\nAgile is a philosophy, a culture, and\
    \ a set of management practices. Agile is radically changing the field of human\
    \ resource management.\n\nRegarding HR management work, sitting in a meeting room\
    \ for lengthy meetings is not always the right solution. HR practitioners need\
    \ to co-develop solutions with business departments. Josh Bersin provided an agile\
    \ model for HR practitioners and business departments to co-create solutions,\
    \ as shown in Figure 3-7.\n\n![](img/cutq_103_5552_l.jpg)\n\nFigure 3-7 Agile\
    \ Model for HR Practitioners and Business Departments Co-creating Solutions\n\n\
    HR co-creating solutions with business departments represents a trend.\n\nThe\
    \ past approach was top-down design, completed from top to bottom. The company's\
    \ `COE` (Center of Expertise) derived and designed relevant projects based on\
    \ HR strategy, delivered them to various business units or divisions for implementation,\
    \ and `HRBP` (Human Resource Business Partner) drove change across the platform.\
    \ Meanwhile, `HRBP` supervised and handled consistency issues across regions.\
    \ The entire project would be revised every few years. This process went through\
    \ Waterfall, `COE`-driven, unified coordination, platform design, change management,\
    \ implementation—uniquely lacking a test and verification phase.\n\nThe new agile\
    \ method designs solutions from the source, completed from bottom to top. From\
    \ identifying problems at the source, organizing cross-functional teams to take\
    \ action, co-creating solutions, to field testing and iteration, embedding into\
    \ the platform when necessary, focusing on success and rapid iteration. The characteristics\
    \ of this approach are rapid design with customers, development on the platform,\
    \ participation of multiple teams, and focus on success.\n\nThe typical feature\
    \ of performance management being iterated by agile is the greatly increased frequency\
    \ of performance communication and feedback. Many enterprises have developed mobile\
    \ terminals to follow up on project progress with department managers anytime,\
    \ anywhere in the form of mobile conversations. At the same time, department managers\
    \ promptly feedback employees' strengths and weaknesses to help them improve personal\
    \ capabilities. These situations automatically form summaries and are recorded\
    \ in the system backend, laying a data foundation for the next step of big data\
    \ analysis.\n\n#### 3. Employee Engagement and Performance Management\n\nAccording\
    \ to a tech media report, Amazon uses an AI system to judge the work efficiency\
    \ of employees in warehousing and logistics centers. If an employee's cumulative\
    \ efficiency score fails to meet the standard, the system issues a warning or\
    \ even a termination command. After the system went online, hundreds of employees\
    \ in Amazon's warehousing and logistics centers were fired.\n\nAmazon used the\
    \ `AI` system as a front-end data collection and processing system for the HR\
    \ management system. The `AI` system first analyzes and processes surveillance\
    \ video footage from the workplace, identifying employee `ID`s and corresponding\
    \ behavioral states, then outputs the results as structured data. This data result\
    \ can be used in different business scenarios, such as improving workplace safety\
    \ and managing employee production efficiency. Amazon's `AI` system calculates\
    \ employees' \"slack time\" by identifying whether employees are in a \"slacking\
    \ off\" state during work hours. The `AI` system can process employee work behavior\
    \ status into data in real-time; its output structured data can serve as input\
    \ for downstream performance management systems, providing decision suggestions\
    \ and data basis for management behaviors. This decision process requires no human\
    \ involvement, forming a complete business closed loop.\n\nThe \"foreman\" function\
    \ of the `AI` system has an obvious effect on reducing enterprise management costs\
    \ and improving employee efficiency. The `AI` system can accurately calculate\
    \ the number of packages each employee completes per hour and each employee's\
    \ working hours. However, Amazon allowing the `AI` system to directly fire employees\
    \ sparked huge social controversy on a moral level. It is said that Amazon recently\
    \ shut down this AI and conducted iterative optimization.\n\nAmazon's case is\
    \ a microcosm of talent management transformation in the AI era. While AI helps\
    \ us solve problems, it also brings new problems. Algorithms can make the competitive\
    \ environment fairer and improve employee engagement, but we must also be vigilant\
    \ about the drawbacks brought by these AI systems. Ride-hailing and food delivery\
    \ services make our lives more convenient; we only need simple operations on our\
    \ phones to enjoy services, ultimately completed by drivers and couriers. Drivers\
    \ and couriers earn remuneration through the platform, yet they are not employees\
    \ of the platform company. Drivers and couriers cannot freely control their time\
    \ because the platform evaluates their performance through algorithms reflected\
    \ in remuneration. Evaluation criteria include daily order volume, average order\
    \ value, and user feedback. These drivers and couriers are managed by a complex\
    \ AI algorithm system but cannot influence this system. This is a more complex\
    \ and radical situation than the Amazon case. In the foreseeable future, more\
    \ and more companies will introduce AI algorithms in talent management, including\
    \ performance scoring, employee engagement analysis, and management sequence recommendation.\
    \ Of course, managing people entirely with AI algorithms is not a good idea. Enterprise\
    \ managers need better methods to train employees and introduce better technologies\
    \ to help middle managers understand how to support employees and improve their\
    \ performance.\n\nEmployee engagement is the most core part of talent management\
    \ because it directly relates to how much value employees create for the enterprise.\
    \ Various studies link employee engagement levels to innovation, safety, quality,\
    \ revenue, shareholder value, customer satisfaction, retention, etc. These correlation\
    \ indicators vary by industry and enterprise. However, once these indicators are\
    \ set, AI technology can output these indicator results to dashboards and display\
    \ specific business correlations and quantify correlation degrees in real-time\
    \ as much as possible. For example, a catering service company may see the correlation\
    \ between employee engagement and user satisfaction more clearly than a manufacturing\
    \ company. Because managers have a huge impact on employee engagement, the system\
    \ can evaluate management levels while suggesting managers improve employee engagement.\
    \ Research finds that managers' communication time and frequency with employees\
    \ and managers' team size affect employee engagement. AI applications can help\
    \ managers conduct regular discussions with team members and pay attention to\
    \ real-time changes in employee engagement levels. From a practical perspective,\
    \ the process of improving employee engagement is the process of discovering and\
    \ recognizing employee contributions and encouraging employees to fully invest\
    \ in their work. Obviously, relying solely on AI technology cannot fully achieve\
    \ this process. But by giving managers better, more timely information, the system\
    \ can guide them to build better relationships with team members.\n\n"
