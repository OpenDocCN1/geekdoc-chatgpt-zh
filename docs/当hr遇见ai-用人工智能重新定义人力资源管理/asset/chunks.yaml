    \ [参考文献](../Text/chapter13.xhtml#p_15) \n\n# [内容提要](../Text/contents.xhtml#z_3)\n\
    \n随着人工智能在人力资源领域的应用，人力资源管理工作逐渐呈现出移动化、数字化、智能化等特点，很多重复性、标准化的工作已由人工智能或机器人完成。人工智能与大数据技术极大地提升了人力资源工作的效率和用户体验，改变了人力资源从业者传统的工作方式，为企业管理者做出经营性决策提供了有效的建议。\n\
    \n人工智能（Artificial Intelligence，AI）是研发、模拟和扩展人类智能的新科学。本书作者多年来在知名企业从事人力资源与数字化的研究和实践工作，积累了丰富的实战经验，他在书中概述了人工智能在人力资源管理工作中的应用场景，详述了人工智能在招聘与入职、人力成本预算、人才发展、员工离职预测、组织分析、敏捷绩效与薪酬福利等细分领域的使用技巧，以及百度公司、阿里巴巴公司和腾讯公司等的实际操作案例。\n\
    \n本书适合企业管理者、人力资源从业者、企业数字化项目负责人、企业数字系统负责人和对人工智能、机器学习等感兴趣的读者阅读。\n\n# [序言一　我国人力资源管理的智能时代已经来临](../Text/contents.xhtml#z_4)"
