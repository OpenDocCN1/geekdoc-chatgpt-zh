    ## 第一节 组织形态的演变与进化


    ![图6-2　网状组织在不同的发展阶段呈现的不同形态](Images/cutq_156_7373_l.jpg)


    在演变与进化的过程中，组织具有如下特点。


    1. **组织结构的扁平化**。在信息技术、网络技术及数字化技术的影响与推动下，企业可以在同一层面传递和共享信息，而不必自上而下地层层传达或自下而上地逐级汇报。在企业信息网络平台（数据平台）上，传统的企业员工之间的纵向关系变成了纵横交错的平等关系。企业管理者的信息沟通能力和管理跨度已成倍、甚至数十倍地增长，从而大大缩减了组织结构的层级，使其变得更加扁平化。


    扁平化的组织结构改变了原来科层制组织结构中企业上下级之间、部门与部门之间以及组织与外部之间的连接方式，它具有高效灵活、快速反应的优点，其最大的特点就是等级型组织与机动的项目小组并存，具有不同专业知识与经验的人分散在结构复杂的组织形式中，能够加速知识与经验的运转，提高组织的整体绩效。


    2. **组织关系的网络化**。随着企业对人力资源管理信息系统、企业办公系统、沟通交流工具、`ERP`/`CRM`、`AI`/`BI`、数字化技术运用的进一步加强，传统职能管理部门中大部分的重复性、例行性工作由系统软件或机器人完成，职能部门的任务只是制定和修改控制程序、处理特殊事件等。职能部门员工的工作方式不再是传统的按照等级下达命令，而是共同协商、相互协作。在企业内部网络平台的帮助下，员工之间的纵向分工不断减少，而横向分工和协作在不断加强。企业以管控（行政命令）为核心的组织关系逐渐变成了相对平等和自主、富于创新与协作的网络关系。组织关系网络化的最大益处就是减少了企业决策与行动之间的延迟，加速了员工对市场和竞争动态变化的反应，使组织能力变得更具弹性与韧性，反应更加灵敏。


    3. **组织规模的小型化**。在移动互联网时代，小公司的灵活性和创新性明显强于大公司。组织规模的小型化并不是指其产值或市场的缩小，而是指人员规模和组织机构的缩小。面对激烈的市场竞争，许多大公司正通过分拆、剥离、流程再造、数字化转型、业务外包或建立战略联盟等方式使自己的经营实体逐渐变得小型化，从而达到降本增效、提高组织应变能力、提升竞争力的目的。


    随着企业的组织管理方式从人才等级制度逐渐转向协作网络团队，人力资源部需要一套新的工具来了解团队动态，管理者也需要采取新的策略来激励、协调和调整团队网络，从而共享信息、协同工作。


    近年来，随着劳动力越来越分散，灵活用工的形式越来越丰富，很多人在组织形态之外以个体讲师、咨询师、自由创作者、网络直播者的身份就业，这些工作者彼此之间形成了新的联盟和合作，共同为业务发展赋能。


    ## [第二节　组织与组织网络分析](../Text/contents.xhtml#b_75)


    传统的人力资源研究和应用实践通常聚焦于个体员工、岗位，以及员工和岗位之间的相互关系。例如，企业对员工的绩效预测和自动离职的预测都是基于员工自身属性展开的。关注员工自身属性和相关属性的方法在很多人力资源管理的应用场景中是行之有效的，但是这一方法并不能在组织层面提供更多的信息和深入的洞察。例如，依据传统的人力资源管理方法，如果人力资源部要评估员工的沟通满意度，就会让员工填写调查问卷。调查问卷的内容包括与沟通相关的问题，如果员工对问题的反馈是正向的，人力资源部就认为组织内部的沟通是顺畅的，对员工沟通状态的调查就可以圆满结束了。但是，这种传统的调研和分析方法能够反映问题的全貌吗？例如，两名员工的沟通频率类似，其中一个人的沟通对象在部门内部，而另一个人的沟通对象既有部门内部成员也有部门以外的成员，那么这种沟通状态在组织层面就是不同的行为模式。类似的问题还有很多，如上班时间段内和下班时间段内的沟通占比分别是多少？不同员工的平均反馈时间是多少？总而言之，传统的人力资源管理方法已无法支撑组织层面的、基于详细数据的、可量化的分析。


    进入21世纪后，随着社交网络的兴起，专家们对社交网络进行了大量的研究，推动了社交网络分析（`SNA`）技术的逐步成熟。早在2005年，朱利安尼（Giuliani）和贝尔（Bell）就利用`SNA`方法研究了智利葡萄酒行业的组织网络中信息传递和知识分享的规律。在此之后，一系列研究应用`SNA`方法分析组织内部的沟通协作和信息传递、部门之间的沟通对绩效的影响，以及分析组织内部的决策模式。


    这些研究成果反映了`SNA`在人力资源组织层面分析的优势：`SNA`提供了一套对组织状态、行为及驱动原因进行分析和研究的框架。`SNA`在人力资源管理领域的应用正在成为新趋势，以组织为研究对象的社交网络分析被定义为组织网络分析（`ONA`）。德勤公司从人力资本的角度对`ONA`进行了定义：`ONA`是对组织内部信息传递、沟通协调和决策形成进行分析与可视化的结构化方法。


    接下来，我们通过一个简化的案例帮助读者对`ONA`与传统人力资源方法的差别产生感性的认识。图6-3是传统的组织架构，图中每个字母代表一名公司的员工。组织架构图描述了公司内部管理的层级关系，在信息化程度更完善的情况下会关联员工的个人信息和岗位信息。但是，传统的组织架构图只是对企业的组织架构静态和抽象的描述，它并不能反映实际工作中员工之间的沟通协作情况。实际工作中沟通协作存在的重要特征无法通过传统的组织架构图进行表现，首先，员工之间存在部门内部和跨部门的沟通协作，而并非图6-3中描述的只有员工和直接领导之间的沟通；其次，员工之间沟通协作的状态是一个动态变化的过程，这一过程会反映关于组织效能的重要信息。例如，图6-4是在特定时间段内，企业员工之间实际的沟通协作情况，相比于图6-3的组织架构图，图6-4是一个更为复杂的网络结构。


    ![图6-3　传统的组织架构示意图](Images/cutq_159_17407_m.jpg)


    ![图6-4　实际上更为复杂的组织网络结构图](Images/cutq_160_28483_m.jpg)


    ### [一、组织分析的相关名词](../Text/contents.xhtml#c_76)


    组织形态可以使用图结构进行表示。在数学中，图（graph）是图论的主要研究对象，图由顶点和连接顶点的边构成。顶点称为`Vertex`，由`V`表示；边称为`Edge`，由`E`表示。因此，在数学上图表示为：`G=(V,
    E)`。然而在实际应用场景中，图被称为网络，即`Network`；相应的顶点`Vertex`称为节点，即`Node`，边被称为关系，即`Link`。


    节点之间的连接分为有向连接和无向连接，有向连接包括单向的有向连接和双向的有向连接。例如，员工A和员工B进行了交谈，可以表示为A和B之间的无向连接；员工C给员工D发邮件，但员工D没有回复，可以表示为从C指向D的单向有向连接；员工E和员工F之间有邮件往来，可以表示为E和F之间的双向有向连接。因此，我们也可以把无向连接当作对称的双向有向连接。


    1. **`度`**


    节点的`度`（Degree）被定义为与该节点相连的边的数目。在有向图中，所有指向某节点的边的数量都叫作该节点的`入度`，所有从该节点出发指向其他节点的边的数量都叫作该节点的`出度`。网络平均度反映了网络的疏密程度，而通过度分布则可以刻画不同节点的重要性。在有向图中，顶点的度分为`出度`（out
    degree）和`入度`（in-degree）。`出度`是指从该顶点指向其他顶点的连接数量；`入度`是指向该顶点连接的数量。


    2. **`网络密度`**


    `网络密度`（Density）可以用于刻画节点间相互连边的密集程度，是网络中实际存在边数与可容纳边数上限的比值。例如，5个节点的网络最多可以有10个连接，因此一个拥有5个节点和6个连接的网络的密度为`6/10=0.6`，如图6-5所示。


    ![左：5个节点最多会有10个可能的连接；右：实际上有6个连接的网络](Images/cutq_161_35465_m.jpg)


    图6-5　网络密度示意图


    3. **`聚类系数`**


    `聚类系数`（Clustering Coefficient）主要用于描述网络中与同一节点相连的节点间也互为相邻节点的程度。


    4. **`接近中心度`**


    `接近中心度`（closeness）是指图中某节点到其他节点的最短路径的平均长度。


    5. **`介数`**


    `介数`（Betweeness）是指图中某节点承载整个图所有最短路径的数量，通常用来评价节点的重要程度。


    6. **`子图`**


    有图`G''=(V'', E'')`和图`G=(V, E)`，如果顶点集`V''`是`V`的子集，而且边集`E''`是`E`的子集，则图`G''`是图`G`的子集。


    7. **`结构洞`**


    `结构洞`（structure hole）在图中类似于桥梁，起到连接节点的作用，如果把它从网络中删除就会导致网络分裂为多个子网络。


    组织网络分析可以通过图数据库`Neo4j`和`Python`库`networkX`等实现，并进一步实现网络的可视化。与社交网络分析相关的图数据学习理论、方法和应用仍在快速发展中，如和深度学习相结合的图神经网络等，有兴趣的读者可以查阅相关文献。


    ### [二、组织网络分析的应用](../Text/contents.xhtml#c_77)


    传统的人力资源分析工具能够提供正式的、显性的和静态的信息，如组织结构图、沟通调查问卷等；而`ONA`可以发现非正式的、隐性的和实时动态的信息。企业作为一个社会组织，其组织形态和特征天然地符合社交网络的定义。HR从业者需要对员工的价值进行重新定义：员工的价值应该等于员工的人力资本与社会资本之和，人力资本反映的是员工的个人能力，而社会资本反映的是员工在组织网络中的连接性。员工的人力资本包括员工满足岗位要求的技能和能力，员工的社会资本包括和其他员工形成连接并产生影响，以及在组织网络中传递信息和知识的能力。长期以来，传统的人力资源管理方法难以对员工的社会价值进行评估和量化。随着`SNA`技术的成熟，人力资源部终于可以对员工的社会资本进行量化计算了。员工价值的计算公式如图6-6所示。


    ![图6-6　重新定义员工价值](Images/cutq_163_56570_l.jpg)


    `ONA`可以帮助HR从业者完成以下工作：


    - 对组织的非正式网络进行可视化展示；

    - 明确组织中沟通协作的状态；

    - 了解领导力的实现方式和关键节点。


    上述工作可以帮助HR从业者回答传统的人才分析难以回答的问题：哪些员工具有更强的影响力，哪些员工的离职会对组织的沟通协作带来严重的影响，新员工是否已经融入团队，管理者的领导力如何实现、如何评估，等等。


    通过计算网络中不同节点的介数中心度（betweenness centrality）可以快速计算每个员工在组织网络中的影响力并识别网络中具有影响力的关键节点，以及这些关键节点可以对哪些节点产生直接影响。图6-7中圈注的员工是网络中的`结构洞`，即组织中的关键节点。识别出关键节点的员工，组织一方面可以通过这些员工推动业务转型和组织变革，另一方面也利于制订继任者计划。事实上，起到领导作用的非管理岗位的员工应该被纳入继任者计划中，同时，组织需要控制由于关键节点员工离职而为整个网络带来的风险。


    ![图6-7　组织网络中的关键节点](Images/cutq_164_1371_m.jpg)


    ## [第三节　组织网络分析案例介绍](../Text/contents.xhtml#b_78)


    ### [一、百度公司的组织网络分析](../Text/contents.xhtml#c_79)


    百度人才智库（`TIC`）通过分析部门活力和人才结构，科学评估组织的稳定性，揭示组织间人才流动的规律，为组织优化调整、高效激励人才与促进人才合理流动提供了智能化支持。以人才圈雷达为例，人才圈反映的是找工作也需要“门当户对”。例如，`TIC`通过挖掘数据发现，美国在线（`AOL`）招聘的编程人员和媒体人才会呈现出截然不同的层次特点。`AOL`的程序员大多来自普通的IT公司，几乎没有从谷歌、Facebook这种一线公司走出来的员工。`AOL`的媒体人才则来自相对更高端的职场圈，如《华尔街日报》《金融时报》等。通过构建这样的社交职业生涯网络，以及对数百万份人才档案和招聘广告进行智能建模，`TIC`可以预测特定行业和市场圈层的招聘热点，让人力资源部能针对大趋势做好准备和调整。


    ### [二、阿里巴巴公司的组织网络分析](../Text/contents.xhtml#c_80)


    阿里巴巴公司利用组织网络分析法，结合调研数据分析结果，可以发现常规组织发现不了的问题。例如，一个组织里有哪些明星人物或边缘人物？这个层级的人是否具有较大的影响力，能否驱动团队？不同角色、不同层级的员工在组织中是否发挥了纽带作用？员工在公司工作的时间越长，其影响力是否就越大？这些问题的答案都可以通过数据去发现。


    从电商的角度看，新零售的核心是重构人、货、场。其实，人力资源领域也有人、货、场，如图6-8所示。


    ![图6-8　精准运营——人、货、场匹配推荐](Images/cutq_165_6594_m.jpg)


    “人”是了解人才画像，“货”包含HR从业者提供的课程、服务、资源等，“场”是思考在何种场景下进行推荐和匹配。以会议室的预定和释放为例，如何通过员工工位的位置及会议室当前是否无人进行双向匹配，让此刻没有订到会议室的员工还有机会抢到闲置且离他最近的会议室，这些都可以通过场的角度和人的连接来实现。


    ## [第四节　组织氛围与舆情分析](../Text/contents.xhtml#b_81)


    ### [一、组织氛围概况](../Text/contents.xhtml#c_82)


    组织氛围是指员工在特定环境下工作的感觉，是工作场所的氛围，包括影响个人和群体行为模式的规范、价值观、期望、政策和流程等。简言之，组织氛围就是人们对在某一组织工作的感觉，是在员工的不断交流和互动中逐渐形成的，并对员工的各方面产生一定的影响，是决定员工努力程度的主要因素。


    组织氛围与组织的价值观和经营理念有直接的关系，与组织领导者的个性也有直接的关系。也就是说，组织领导者对组织氛围有直接的影响甚至起决定作用。例如，一个性格外向、开朗的领导者可能比较善于调节组织内部的气氛，他愿意花时间与下属沟通，经常组织一些集体活动，组织内部的气氛就会比较轻松；如果一个组织的领导者性格内向、习惯于独立思考，他在组织氛围的营造方面就会缺乏主动性，并且可能会让下属比较惧怕他。


    组织氛围是组织文化的重要组成部分之一，也是组织文化建设的重要内容。组织领导者需要把营造组织氛围当作其重要的工作职责，因为良好的组织氛围能够激发组织成员的工作积极性和创造力。


    ### [二、组织氛围模型与诊断](../Text/contents.xhtml#c_83)


    通过大量研究发现，组织氛围会影响员工的心理和行为（如工作投入度、敬业度、组织承诺、创新行为等），并通过影响员工的工作态度进一步影响工作绩效。组织内部的支持性氛围会促进组织成员的合作学习，进而影响知识分享的广度和深度。


    消极的组织氛围表现在以下方面：


    - 员工忽视流程、规范；

    - 在开会发言、讨论问题时，员工表现沉闷，不愿意积极发言，只是被动地接受安排；

    - 团队成员之间的交流很少，员工很难获得帮助，员工之间存在恶性竞争；

    - 上下级沟通交流不畅，同事关系剑拔弩张；

    - 员工对待工作拖拖拉拉、没有干劲；

    - 组织氛围消极的团队经常处于内耗、争执和埋怨中，员工的敬业度很低，不能产生良好的组织绩效。


    积极的组织氛围表现在以下方面：


    - 员工认真履行流程、严格遵守规范；

    - 在开会发言、讨论问题时，员工乐于主动说出自己的想法；

    - 在团队协作中，员工之间可以做到相互帮助、彼此交流顺畅；

    - 上下级之间沟通交流顺畅，同事关系健康有度；

    - 员工积极对待工作，并认真落实各项工作安排。


    在组织氛围积极的团队中，员工的敬业度高，能够产生良好的组织绩效。


    在做组织氛围诊断的大数据建模与分析时，HR从业者需要为诊断调研选择影响因子模型。不同模型的维度（结构）不同，因子颗粒度也不同。例如，员工满意度模型可以包含六大维度的38个因子，如`MVVS`、工作状况、学习与发展、薪酬福利、人际关系、环境场所等，每个维度又包含若干影响因子，具体如下：


    - `MVVS`：使命（`M`）、愿景（`V`）、价值观（`V`）、战略（`S`）、政策、机制、流程等；

    - 工作状况：职责任务、目标绩效、辅导反馈、升降调转、人岗匹配、能力潜力等；

    - 学习与发展：培训计划、工作关联、实践反馈、职业规划、内外部机会等；

    - 薪酬福利：薪酬、奖金、福利、中长期激励、荣誉认可、俱乐部等；

    - 人际关系：公司高管、跨级主管、直接主管、同级同事、工作压力、团队氛围等；

    - 环境场所：工作场所、设施装备、安全健康、生活平衡、公司品牌、行业竞争等。


    通过开展大数据相关性的分析，员工满意度模型能对员工产生各种外在支持。员工满意度模型关注的是员工可以感受到的并对敬业度有重大影响的因素。敬业度调研及其成果不仅可以作为研究员工状态与感知的依据，而且能成为组织诊断的工具。


    员工满意度模型示意图如图6-9所示。


    ![图6-9　员工满意度模型示意图](Images/cutq_169_154_l.jpg)


    员工敬业度主要关注员工对组织的认知与情感、行动的投入。它可以提炼总结出六大维度，包括“贡献”“满意”“投入”“留任”“信心”和“推荐”。这六大维度的基本定义如下：


    - **贡献**：员工在本岗位上做出的成绩；

    - **满意**：员工以客户为中心的行为可以提升客户满意度；

    - **投入**：员工乐于努力工作，提升企业的人均产出；

    - **留任**：员工乐于在企业长期工作，企业能够实现保留员工的目的；

    - **信心**：员工看好企业的未来发展，团队整体氛围积极向上；

    - **推荐**：员工愿意主动向他人推荐本企业，企业能够实现人才增长的目的。


    员工敬业度模型如图6-10所示。


    ![图6-10　员工敬业度模型示意图](Images/cutq_170_27542_l.jpg)


    净推荐值（`NPS`），亦可称口碑，是指计量某个客户将会向其他人推荐某个企业或服务的可能性的指数。净推荐值也可作为一种调查工具，HR从业者利用它向客户提问，如是否愿意向朋友及同事推荐该企业（如果愿意，提出理由）。根据回复，客户被分为“推荐者”“被动者”和“贬损者”三类。用“推荐者”的百分数减去“贬损者”的百分数，就得出了净推荐值的最后得分。


    ```

    NPS = (推荐者数/总样本数)×100% - (贬损者数/总样本数)×100%

    ```


    - **推荐者**（得分在9~10分）：是具有狂热忠诚度的人，他们会继续购买本企业的产品或服务并引荐给其他人。

    - **被动者**（得分在7~8分）：总体满意但并不狂热，有可能会考虑其他竞争对手的产品。

    - **贬损者**（得分在0~6分）：对本企业不满意或者对本企业没有忠诚度。


    `NPS`公式的计算逻辑是推荐者会继续购买本企业产品或服务，批评者则会破坏本企业的口碑。


    `NPS`是最流行的客户忠诚度分析指标，重点分析客户忠诚度如何影响企业成长。通过密切跟踪净推荐值，企业可以让自己变得更加优秀。

