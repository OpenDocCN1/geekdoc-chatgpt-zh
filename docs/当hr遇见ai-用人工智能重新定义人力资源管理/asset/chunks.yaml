    ## 四、用才


    - 360度洞察：内外部人才画像、高潜人才识别

    - 敏捷绩效：随时沟通反馈、开展绩效预测

    - 神经网络：洞悉组织活力与组织健康度

    - 管理实践：按专题辅助高层管理决策

    - 行业洞察：对标竞品公司，打造业界标杆


    企业管理者怎样才能精准地知道谁是你想要的人才，人才画像就是一种很好的方法。


    何为人才画像？人才画像是由显性的职位描述和隐性的潜在特质组成的。通俗地讲，人才画像就是你能够像画家画人物一样把人才特征描述出来；描述的准确程度取决于你对信息的掌握与挖掘程度。随着技术水平的进步，人才画像可分为三个阶段：在初级阶段，人才画像只是画出了模糊轮廓，就像手机的100万~200万像素；在中级阶段，人才画像相对清晰了，可以达到800万~1
    000万像素；到了高级阶段，人才画像的效果已经非常逼真，相当于达到了5 000万像素。


    人才画像多用在企业关键人才的选、用、育、留等环节，主要目的是有效吸引与使用关键人才。具体来说，人才画像的框架与应用场景如图1-8所示。


    ![](Images/cutq_40_24749_l.jpg)


    图1-8　人才画像的框架与应用场景


    在人才的选、用、育、留等环节，人才画像可以解决以下问题。


    - **人才选拔**：如果人才供应速度难以与企业发展速度相匹配，管理者到底是依赖外部人才招聘，还是依靠企业内部培养？为什么部分岗位的胜任率很低？如果存在人才队伍臃肿的现象，怎样优化效果更好？如何解决关键人才流失、核心岗位后继无人等问题？

    - **人才任用**：如何科学地解决人岗不匹配问题和团队组建问题？如何解决转型阶段核心人才配置问题？

    - **人才培养**：怎样利用新技术培养人才？如何将人才培养成领军人物？培养人才时，是着重发挥他们的长板优势还是重点提升短板？

    - **人才激励**：如何让核心人才充分发挥自身能力与主观能动性？如何减少核心人才的流失？企业有哪些员工激励措施？

    - **组织发展**：针对组织变化，该如何预警？怎样衡量团队健康度？如何衡量组织活力？如何促进团队协作与提升团队敬业度？


    绘制人才画像的工作需要将大量的员工数据作为基础，随着信息化、数字化、智能化的深入，数据量会越来越多，人才画像的“清晰度”也会越来越高。


    ## 五、留才


    - 离职预测：风险管控、人才动态调配

    - 智能关怀：给予关怀、祝福提醒

    - 舆情监测：内外部舆情关注、品牌预警、文化迭代


    离职管理是企业对人才的选、用、育、留四个环节的最后一环。大数据在“留才”方面的应用主要体现在离职预测、智能关怀、舆情监测等方面。


    人才是企业可持续发展的动力，留住人才对任何企业来说都非常重要。利用大数据技术、模型与算法预测员工未来的离职意向，实现留才已逐步成为企业的重点工作。在系统健全、数据拉通的情况下，首先可以对数据进行要素分析，分为个体因素（如年龄、性别、级别、绩效、薪酬、福利、工作内容、技能、个人职业发展等）、组织因素（如企业文化、组织氛围、工作压力、上下级关系、管理幅度、满意度等）以及外部因素（如外部市场工作机会、外部薪酬水平、创业环境、市场热度等），再将所有因素归纳提炼为八个维度指标，如办公环境、工作压力、晋升轮岗、培训学习、职业发展、薪酬绩效、文化氛围及外部热点，通过建立多元回归模型找出各个因素的相关性，厘清正、负相关因素影响，经过模拟与验证，就能够尽早预测员工离职可能性的概率，从而提示企业主管或HR从业者及时采取相应的措施降低员工离职风险，保障企业的正常运作。


    # 第二章　人工智能在选才环节的应用


    招聘是企业人力资源管理工作中重要的一环，决定了“谁能来”“能不能干”“如何干”“干多久”的问题。在数字化转型的新时代，人工智能等新技术可以在招聘工作领域发挥更大的价值。


    随着人才流动速度的加快和专业分工的细化，每个人的职业发展道路都存在更大的不确定性。人才并不会把公司内部升迁作为自身职业发展的唯一路径，他们往往会把目光投向公司之外。同时，公司在人才获取的“质”与“量”方面都面临着更大的挑战。在招聘和选择新员工的过程中，公司通常会收集和记录大量的信息，这些信息可以被人力资源分析专家利用。例如，人力资源分析师能够通过在招聘过程中收集的数据预测候选人未来的业绩。


    所有对招聘的研究或实践都在探索企业选拔候选人的最优方式，特别是采用数据驱动的智能招聘。在这方面，可靠性和有效性都很重要。所谓可靠性是指在招聘过程中对候选人进行筛选的方法的可靠性，管理者希望这种方法尽可能客观且一视同仁。但是，人们对彼此的判断非常容易产生偏见，如面试过程中出现的“光晕”效应，即面试官因为候选人的一个突出特征而影响到他对候选人其他特征的判断。有效性是指该方法能否帮助面试官准确筛选出符合特定工作岗位要求的人，包括区分表现良好和表现不佳的候选人，区分想要留下来和加入后不久就将离开的人。


    ## 第一节　KSAM模型


    ### 一、KSAM模型的概念


    KSAM模型是基于著名的冰山模型演变而来的（如图2-1所示）。在冰山模型中，水平线之上的部分是表象，人们可以通过简单接触、观察与分析识别表象；而水平线以下“深藏不露”的部分是本质，冰山以下的部分越深入“海底”就越不容易被评估与测量，人们必须通过系统手段进行分析才能识别。主导人的行为是“冰山之下”的部分，而且层次越深，影响效果就越明显。因此，HR从业者在进行大数据分析业务建模时，要充分考虑并提取冰山模型各部分的特征，结合应用场景进行岗位和员工特征剖析，真正做到人岗匹配。


