    ![](Images/table_image_139_0.jpg)


    A先生的离职风险指数最高，为0.88。同时，A先生又是高绩效、高胜任力人才。因此，他属于需要保留的人才。他在人才库中的标签是重点保留人才，因此HR从业者可以采取扩大职责范围等方式，让A先生的工作更具挑战性。同时，HR从业者可以选择适当的时机，将A先生轮岗到其他岗位，由其继任人选张三接替。这样在保留人才的同时，降低了企业的用人风险。


    B先生的离职风险指数较高，为0.83。同时，B先生又是高绩效、高胜任力人才。因此，他也属于需要保留的人才。B先生在人才库中的标签也是重点保留人才，但是暂时无继任人选。这时HR从业者只能采取激励措施，在保留B先生的同时，积极从内外部人才库中寻找后备人选，尽量降低企业的用人风险。


    C女士的离职风险指数较高，为0.75，C女士是高绩效人才，但其在人才库中的标签不是重点保留人才。同时，C女士有继任人选李四。因此，HR从业者可以选择适当的时机，由李四接替C女士，对C女士另有任用，以此措施降低企业的用人风险。


    ### [二、人才保留预警](../Text/contents.xhtml#c_63)


    企业管理者可以通过风险指数与保留标签来预警并提示哪些人才值得保留。如表5-1所示，尽管A先生与B先生的离职风险都很高，但由于他们是重点保留人才，企业也愿意采取各种措施留住他们。


    当然，表5-1所示的只是若干管理场景中的一小部分。在实际工作中，场景会更为复杂多样，HR从业者可采取的措施也会更加灵活多变。


    以唐僧的四个徒弟为例，哪类员工才是团队需要重点保留的人才呢？如图5-2所示，横轴代表员工的敬业度，纵轴代表能力，两个维度形成四个象限。唐僧的四个徒弟代表了团队成员的三种类型。


    ![](Images/cutq_141_21220_m.jpg)


    图5-2　能力与敬业度四象限关系图


    HR从业者通过工具预测到了每种类型员工的离职风险指数之后，可针对每种类型员工采取如下不同的保留措施与管理方式：


    （1）对待悟空型（能力强、敬业度高的员工），需要为其描绘清晰的远景目标，给予其充足的信任和授权；


    （2）对待八戒型（能力较强、敬业度较低的员工），需要多鼓励他，使其发挥作用，同时画好红线；


    （3）对待沙僧/白龙马型（能力弱、敬业度较高的员工），需要对其开展技能培训，让其快速成长。


    ### [三、组织与人才动态调配](../Text/contents.xhtml#c_64)


    随着技术的发展，企业可以利用人工智能与大数据技术，对组织的人才结构和布局进行更加智能、全面的分析，对组织配置的不合理性与失调的地方进行调整，形成一个多维的最佳组合，以提高团队的整体效率。


    有一种简便的方法可以快速诊断组织配置是否合理，那就是通过管理幅度和管理层级来调配组织规模，使其符合业务发展的要求。管理幅度是指一个人直接管理的下属人员数量。管理层级是指组织纵向划分的管理层次的数量；管理层级与组织规模成正比，组织规模越大，成员越多，其层级就越多。在组织规模相对稳定的前提下，管理层级与管理幅度成反比：主管直接管理的下属越多，管理层级就越少；相反，管理幅度越小，管理层级就会越多。


    大数据分析研究表明，管理幅度为7~12人是最科学的组织架构。在被管理对象数量（全体员工）相对稳定的情况下，管理幅度越宽，需要设置的管理层级就越少；相反，管理幅度越窄，需要设置的管理层级就越多。假设每层管理幅度都是8人，一个员工数量为3万人左右的企业，管理层级只需要6层就足够了（即从最底层员工到CEO之间的层级）；如果企业员工数量有将近30万人，7层架构也足矣支撑，如图5-3所示。


    ![](Images/cutq_142_32917_m.jpg)


    图5-3　管理幅度与组织规模示意图


    京东集团有个著名的“8150”原则。


    （1）设置机构要满足一定数量的管理幅度要求。一般情况下，管理人员含实线和虚线下属的管理幅度不低于8人，仅在实线下属多于15人时才能设置平级或下级部门。


    （2）对于业务相对单一（如分拣、包装、配送、客服等）的基层部门，其管理者的管理幅度应较大，在满足管理幅度不低于8人的情况下，仅在实线下属多于50人时才能设置平级或下级部门，或设置副职（限京东物流区域）。


    也就是说，公司要求向每个管理者直接汇报的下属不得低于8个人；如果不到8个人，就减少中间层级的管理者。只有向一个人直接汇报的下属超过15人时，公司才允许在同一个管理层级上再增加一个管理者。


    “8150”中的“50”是指同一工种的基层员工，要求管理的人员不能低于50个人，只有超过50个人时才可以考虑设立第二个团队领导。如打包员，如果一个班次的打包人员不超过50个人，就只允许设立一个打包主管。如果50名打包人员分设成五个小组，设立了五个团队领导，这将是个“灾难”。所以，50就是为了基层管理者管理基层员工的。


    “8150”原则的核心是保证组织扁平化。京东正是坚持了“8150”原则，才能保证CEO和几十万名员工之间只隔了5层管理者。


    百度通过大数据分析建模，动态扫描组织名称变化、团队规模变化、管理幅度变化、管理层级变化、高阶人才异动情况、团队离职率等情况，进行组织健康度与关键人才的风险指数分析，并提供准实时预警，从而达到确保组织灵活、高效配置、上下同欲的目的。例如，当管理幅度小于5人时，系统就会给相应的OD负责人发送邮件，OD负责人就会与HRBP共同分析团队配置的合理性；当某业务线管理层级大于5时，系统也会发出预警，OD负责人会检查组织配置的合理性与恰当性。当系统监测到关键人才的离职风险度或管理风险度超过一定的阈值时，HR从业者也会收到通知，采取轮岗、继任、激励等一系列措施降低风险或避免发生更大的损失，促进组织的良性循环。


    ## [第二节　智能关怀](../Text/contents.xhtml#b_65)


    要想充分发挥人才的价值，企业必须构建一个员工关怀的文化和环境。这就意味着，企业需要为这项工作分配一定的资金和资源，同时将员工健康、安全和幸福方面的投资与企业的经营业绩联系起来。


    虽然一些公司管理者仍然认为员工关怀计划只是提供给员工的额外福利，但是有些公司已经把员工关怀计划当作了公司战略业务的一部分。这些公司也被称为“最佳雇主”，它们的成功已经证实了员工士气、精神状态、健康、安全和公司盈利状态之间不仅存在相关性，而且存在因果关系。


    人工智能时代的员工关怀，在企业层面是为了增强组织的吸引力，在员工层面则是为了打造有温度的职场环境。企业通过对员工生命周期的跟踪、管理和关怀，与企业的“选、用、育、留”人才管理政策直接挂钩，充分发挥了员工的主观能动性与HR从业者的战略价值。


    ### [一、关联职业生涯事件触发关怀](../Text/contents.xhtml#c_66)


    过去，企业只要支付一定的薪酬就能留住员工；现在，企业要不断地给予员工一定的关爱，关心他们的物质需求和精神诉求，才能提升他们的归属感，减少人员流失。围绕员工入职、在职、离职三位一体的全生命周期，HR从业者通过“四化”提升员工职场体验，即体验场景化、互动社交化、行为积分化、反馈实时化。


    在员工的职业生命周期内，典型的智能关怀场景如图5-4所示。


    ![](Images/cutq_145_42118_l.jpg)


    图5-4　智能关怀的场景


    （1）入职前员工可享受免费体检，员工在入职报到时会收到大礼包。


    （2）新员工有文化导师、专业导师的引领，可快速适应环境、融入团队。


    （3）试用期内有90~180天的新员工游戏化培训之旅，边学习、边打怪、边积分。在此过程中，新员工们熟悉了文化，提升了专业，领到了奖品。


    （4）企业为员工送上生日祝福、司龄周年祝福。


    （5）组织各种节日活动，如年会活动、三八女神节、五四青年节、六一儿童嘉年华、母亲节参观活动、父亲节书信活动、中秋节礼品、春节礼品等。


    （6）企业为员工婚、丧、嫁、娶、生小孩等特殊时期发放礼金。


    （7）企业提供温馨的办公环境、免费的食堂和茶水间。


    （8）员工如在晚上9点后下班可报销打车费。


    （9）体检生病有保障，租房买房有优惠。


    （10）父母生日有礼金，体检住院管报销。


    ### [二、祝福提醒](../Text/contents.xhtml#c_67)


    随着大量“90后”“00后”年轻人涌入职场，他们更加关注工作的价值和体验，要求企业在职场环境的打造方面要更有温度、更具创造性。因此，通过人工智能、数字化技术实现员工关键时刻的祝福提醒，已成为HR从业者发挥价值的必备技能。


    智能关怀是指基于员工画像，HR从业者为员工提供个性化、智能化的关怀体验。HR从业者可以根据员工的工作方向、学习内容、职业规划、兴趣爱好、日常习惯、社交、消费等进行大数据分析建模，为员工打上相关的“标签”，在员工“工作、生活、学习、发展”的不同时刻触发“机制”，提供个性化的“员工关怀”。“机制”的背后就是基于人工智能、大数据技术的一站式智能关怀服务系统。


    相关“机制”如下。


    （1）员工祝福。在员工生日当天的一早，系统会通过邮件、移动端IM向员工发送生日祝福卡；同时系统也会给该员工的直接主管发送提醒，告知当天有下属过生日，提醒主管表达“关怀”。生日祝福卡上有专属的二维码，员工可以去公司礼品店扫描二维码换取生日礼物，或者去自提柜扫码/刷脸自助领取。


    （2）司龄祝福。在员工司龄满周年的当天一早，系统会通过邮件、移动端IM向员工发送司龄周年祝福卡，感谢员工的贡献与陪伴。每个周年祝福卡的内容不同，卡片的颜色与设计风格也不一样，这样可以让员工每年都有惊喜。同时，公司会发放周年纪念品及司龄徽章，员工可以去礼品店或自提柜刷脸领取。例如，阿里巴巴将员工入职一年称为“一年香”，表达的是认同；满三年称为“三年醉”，意味着成人；满五年称为“五年陈”，意义是传承，团队还会在不同的时点举办特别的纪念仪式。百度的小度熊上会自带徽章，阿拉伯数字代表周年，用白色、灰色、银色、蓝色、金色分别代表员工加入公司的不同阶段，五年发放银熊，十年发放金熊；员工入职十年时，公司会举办特别的仪式，CEO会亲自为其颁奖来表达认可，让员工收获满满的荣誉感。当然，该员工的直接主管在当天也会收到提醒。


    （3）HR从业者会根据场景不同，设计不同的内容与形式通知员工转正、晋升、绩效反馈、评价反馈等结果，让员工感受到认可和鼓励，在今后的工作中发挥更大的能量。


    （4）离职关怀也很重要。入离职流程都是自动化的，如果离职交接内容很多，系统就会通过后台自动校验相关事项，不需要员工问来问去；同时，员工可以在一站式服务大厅里办理需要线下处理的事项（如缴还电脑、工卡等），不需要跑来跑去。离职手续办理完毕后，公司还会发放一套明信片，以示纪念；同时系统会向员工发放离职卡片提示转移档案、社保、户口、党团关系等的注意事项。每逢三大节日（中秋节、春节、司庆日），系统会自动给已离职人员预留的手机发送祝福短信，表达感恩之情。


    上述关怀机制既可以降低员工离职率、吸引离职员工回流，也可以提升员工满意度、敬业度。做好离职管理工作，有助于企业在业内树立良好的品牌形象，吸引更多优秀的人才。


    ### [三、关怀福利商城](../Text/contents.xhtml#c_68)


    员工福利作为薪酬福利系统的一个重要组成部分，在很大程度上已经成为企业吸引和留住优秀人才、激发和调动员工积极性的一项管理措施。过去那种普惠型的福利已不能满足员工的个性化需求，甚至有可能会降低员工的工作积极性。因此，企业应实行弹性福利制度，建立员工智能福利系统，提高员工的忠诚度与敬业度，使企业和员工达到双赢。


    人工智能时代的弹性福利系统集成了用户画像、语音识别、个性化推荐等技术，通过识别员工的个性化需求，实现福利场景化、关怀多样化，为员工提供全方位、个性化的自由组合与选择，实现员工体验全覆盖、生活娱乐一站式的目标。


    弹性福利商城通常包含如下内容。


    针对企业：


    （1）企业有专属账号管理，先消费后结算，合理分配预算，灵活组合科目；


    （2）集成供应商资源，企业可一站式配置个性化福利组合；


    （3）汇聚各类优质品牌资源，为企业提供全方位、个性化的节日礼品选择；


    （4）专属员工服务后台，HR高效统筹管理。


    针对员工：


    （1）员工有独立账号，不同级别的员工有不同的积分，员工可消费、可兑换；


    （2）自主选择弹性福利（如保险、体检、礼品、补贴等），同时覆盖家人；


    （3）可享受个人采购无法获得的团队优惠；


    （4）可使用平台账户积分或个人账户在线支付；


    （5）功能包括积分发放、福利明细、福利兑换、福利汇总。


    度生活—弹性福利平台如图5-5所示。度生活是百度为员工提供生活和工作便利的产品，有PC端与移动端两种，主打移动端，通过不同的“频道”（生活频道如社团汇、生活站、挂号通、安居坊、跳蚤街、度优惠、健康园、易出行等，工作频道如速查询、问HR、要盖章等）使员工能够随时随地享受到公司的福利。


    ![](Images/image_149_0_m.jpg)


    图5-5　度生活—弹性福利平台


    各个频道的功能简述如下：


    ①社团汇：集合篮球队、足球队、羽毛球队、乒乓球队、游泳队、瑜伽社、舞蹈队、歌唱社、读书社、爬山、跑步、户外、动漫、表演等；


    ②生活站：吃、喝、玩、乐的集合地；


    ③健康园：基础保险+补充医疗保险、体检项目组合、健康空间、健康课程等；


    ④挂号通：与机构合作解决员工挂号难题；


    ⑤易出行：集成了机票、酒店、火车、打车平台，方便员工出差、旅游等；


    ⑥安居坊：为员工提供靠谱的房源；


    ⑦跳蚤街：即二手交易市场，便于员工重新利用闲置物品；


    ⑧度优惠：提供各种折扣优惠信息；


    ⑨易会签：进行会议室预定、视频会议、签到打卡、会议记录等会议管理。


    ## [第三节　舆情监测](../Text/contents.xhtml#b_69)


    所谓舆情监测，就是企业数字系统从业人员利用中文分词技术、自然语言处理技术、中文信息处理技术，对舆情信息进行过滤、去重、相似性聚类、提取摘要、自动聚类等，建立一个舆情监测系统；在合规的前提下，利用爬虫技术，根据预定的监控关键词扫描重点媒体、论坛、博客、微博等网站里的舆情信息，并对敏感信息及时发出预警，在第一时间将预警信息通过邮件、电话、手机短信等方式通知到相关方。


    ### [一、内外部舆情关注](../Text/contents.xhtml#c_70)


    很多企业在内网开设了匿名区，员工们可以在此畅所欲言。内部的舆情分析结果主要用于两个方面：将与业务相关的建议推荐给相关部门参考；将劳动关系纠纷、招聘、文化宣导、品牌宣传等舆情风险预警交给人力资源部处理。据调查，在企业内网中员工讨论最多的是薪酬福利、工作压力、文化氛围、外部机会、个人发展、培训学习。针对这些高频词，HR从业者需要采取必要的宣传手段，如组织开展薪酬政策说明会、文化宣讲会，举办团建、培训等活动缓解员工压力。


    ### [二、品牌预警](../Text/contents.xhtml#c_71)


    在人力资源管理工作中，品牌预警主要用于招人与留人环节。在政策法规允许的情况下，HR从业者可利用大数据技术对网络公开资料（如微博、论坛等社交媒体和新闻站点、专业论坛等）中涉及本企业的信息（包括正面的、负面的、中性的信息）进行实时监测、数据采集及数据加工，通过建模与算法综合分析明确企业能承受的风险底线，一旦超出则立即报警，根据预案及时进行处理，避免发生舆情危机，保护好企业的品牌与形象。


    ### [三、文化迭代](../Text/contents.xhtml#c_72)


    人工智能技术能够依据对员工的文化活动参与度和文化氛围融入度的调查结果，结合几大职场因素（组织、个人、环境因素等）对人员的背景、特征进行大数据分析，构建不同维度的结构化人才保留和激励指标。这一措施对降低员工离职率非常有效。同时，利用人工智能技术开发的机器人助理能够24小时不间断地解决员工在日常工作和生活中遇到的各种问题。尤其是在对员工文化活动的参与度等数据进行剖析后，管理者能够更清楚地知道每位员工关注什么、厌恶什么，更清楚地知道组织需要如何引导文化的走向。


    ### [四、人才迁徙](../Text/contents.xhtml#c_73)


    企业可通过大数据分析建立员工离职预测模型。该模型主要用于预测员工流失情况并及时提出预警，结合“企业内部人才继任表”协助HR从业者进行提前干预。


    企业可通过大数据分析建立人才迁徙地图。该地图可以帮助HR从业者及时掌握企业内外部人才的动态，为入、离、升、降、调的管理工作提供数据分析与决策参考。


    # [第六章　组织分析与组织画像](../Text/contents.xhtml#z_11)


    在组织层面，无论是金字塔型组织、矩阵式组织，还是纺锤形组织、网状组织，企业高层管理者对组织的要求都是组织灵活、结构优化、配置敏捷、协作高效。


    在人才层面，企业管理者需要思考如何利用大数据技术识别和判断哪些是核心员工，哪些是骨干员工，哪些是领军人物。


    在文化层面，企业管理者对文化的要求是敏捷创新、上下同欲并赋能组织。


    基于上述三个层面的需求，人力资源数字化可以在流程、系统、数据及用户体验四个维度支撑组织架构、人才及企业文化。首先，流程需要合规高效、权责清晰；其次，系统需要做到互联互通，兼具数据化、场景化、智能化；再次，数据需要整合信息，做到细致分析，从而达到辅助决策的目的；最后，用户体验需要贯穿于人力资源管理的整个生命周期中。


    ## [第一节　组织形态与特点](../Text/contents.xhtml#b_74)


    组织形态是由组织中纵向的等级关系及其沟通关系、横向的分工协作关系及其沟通关系形成的一种无形的、相对稳定的企业构架。它反映了组织成员之间的分工协作关系，体现了分工和协作框架。简单地说，企业的组织形态就是企业的组织形式、存在状态和运行机制。


    随着时代和内外部环境的变化，组织形态也在不断地演变，从直线型、直线职能型变成了事业部型、网状，如图6-1所示。


    ![](Images/cutq_155_5980_l.jpg)


    图6-1　组织形态的演变历程


    三种组织形态的特点是层级分明、角色清晰、专业化程度高、管控力度强。网状组织的特点则是灵活、有韧性、对环境变化的反应迅速、创新性强。


    网状组织也有不同的形态，它在企业的不同发展阶段会出现如图6-2所示的变化。'
  fmt: '

    随着各行各业的快速发展，人才的流动性越来越强，由此带来的企业留人的成本也越来越高。


    员工离职带来的风险通常有如下几类。


    1. 关键技术或商业秘密泄露，企业遭受重大损失。

    2. 客户资料泄露，造成关键客户流失。

    3. 关键岗位空缺，无继任人选，关键工作无法正常运转。

    4. 关键人才带着团队集体跳槽，使本企业的部分工作停滞。

    5. 造成企业人心动荡，削减组织的向心力、凝聚力。


    对HR从业者来讲，利用AI模型算法进行的离职风险分析可以马上捕捉员工变化并迅速做出反应，达到预警预测的目的。


    结合图5-1，HR从业者针对不同员工的表现，可采取的行动如表5-1所示。


    表5-1　离职风险与HR行动建议


    ![](Images/table_image_139_0.jpg)


    A先生的离职风险指数最高，为0.88。同时，A先生又是高绩效、高胜任力人才。因此，他属于需要保留的人才。他在人才库中的标签是重点保留人才，因此HR从业者可以采取扩大职责范围等方式，让A先生的工作更具挑战性。同时，HR从业者可以选择适当的时机，将A先生轮岗到其他岗位，由其继任人选张三接替。这样在保留人才的同时，降低了企业的用人风险。


    B先生的离职风险指数较高，为0.83。同时，B先生又是高绩效、高胜任力人才。因此，他也属于需要保留的人才。B先生在人才库中的标签也是重点保留人才，但是暂时无继任人选。这时HR从业者只能采取激励措施，在保留B先生的同时，积极从内外部人才库中寻找后备人选，尽量降低企业的用人风险。


    C女士的离职风险指数较高，为0.75，C女士是高绩效人才，但其在人才库中的标签不是重点保留人才。同时，C女士有继任人选李四。因此，HR从业者可以选择适当的时机，由李四接替C女士，对C女士另有任用，以此措施降低企业的用人风险。


    ## 二、人才保留预警


    企业管理者可以通过风险指数与保留标签来预警并提示哪些人才值得保留。如表5-1所示，尽管A先生与B先生的离职风险都很高，但由于他们是重点保留人才，企业也愿意采取各种措施留住他们。


    当然，表5-1所示的只是若干管理场景中的一小部分。在实际工作中，场景会更为复杂多样，HR从业者可采取的措施也会更加灵活多变。


    以唐僧的四个徒弟为例，哪类员工才是团队需要重点保留的人才呢？如图5-2所示，横轴代表员工的敬业度，纵轴代表能力，两个维度形成四个象限。唐僧的四个徒弟代表了团队成员的三种类型。


    ![](Images/cutq_141_21220_m.jpg)


    图5-2　能力与敬业度四象限关系图


    HR从业者通过工具预测到了每种类型员工的离职风险指数之后，可针对每种类型员工采取如下不同的保留措施与管理方式：


    1. 对待悟空型（能力强、敬业度高的员工），需要为其描绘清晰的远景目标，给予其充足的信任和授权；

    2. 对待八戒型（能力较强、敬业度较低的员工），需要多鼓励他，使其发挥作用，同时画好红线；

    3. 对待沙僧/白龙马型（能力弱、敬业度较高的员工），需要对其开展技能培训，让其快速成长。


    ## 三、组织与人才动态调配


    随着技术的发展，企业可以利用人工智能与大数据技术，对组织的人才结构和布局进行更加智能、全面的分析，对组织配置的不合理性与失调的地方进行调整，形成一个多维的最佳组合，以提高团队的整体效率。


    有一种简便的方法可以快速诊断组织配置是否合理，那就是通过管理幅度和管理层级来调配组织规模，使其符合业务发展的要求。管理幅度是指一个人直接管理的下属人员数量。管理层级是指组织纵向划分的管理层次的数量；管理层级与组织规模成正比，组织规模越大，成员越多，其层级就越多。在组织规模相对稳定的前提下，管理层级与管理幅度成反比：主管直接管理的下属越多，管理层级就越少；相反，管理幅度越小，管理层级就会越多。


    大数据分析研究表明，管理幅度为7~12人是最科学的组织架构。在被管理对象数量（全体员工）相对稳定的情况下，管理幅度越宽，需要设置的管理层级就越少；相反，管理幅度越窄，需要设置的管理层级就越多。假设每层管理幅度都是8人，一个员工数量为3万人左右的企业，管理层级只需要6层就足够了（即从最底层员工到CEO之间的层级）；如果企业员工数量有将近30万人，7层架构也足矣支撑，如图5-3所示。


    ![](Images/cutq_142_32917_m.jpg)


    图5-3　管理幅度与组织规模示意图


    京东集团有个著名的“8150”原则。


    1. 设置机构要满足一定数量的管理幅度要求。一般情况下，管理人员含实线和虚线下属的管理幅度不低于8人，仅在实线下属多于15人时才能设置平级或下级部门。

    2. 对于业务相对单一（如分拣、包装、配送、客服等）的基层部门，其管理者的管理幅度应较大，在满足管理幅度不低于8人的情况下，仅在实线下属多于50人时才能设置平级或下级部门，或设置副职（限京东物流区域）。


    也就是说，公司要求向每个管理者直接汇报的下属不得低于8个人；如果不到8个人，就减少中间层级的管理者。只有向一个人直接汇报的下属超过15人时，公司才允许在同一个管理层级上再增加一个管理者。


    “8150”中的“50”是指同一工种的基层员工，要求管理的人员不能低于50个人，只有超过50个人时才可以考虑设立第二个团队领导。如打包员，如果一个班次的打包人员不超过50个人，就只允许设立一个打包主管。如果50名打包人员分设成五个小组，设立了五个团队领导，这将是个“灾难”。所以，50就是为了基层管理者管理基层员工的。


    “8150”原则的核心是保证组织扁平化。京东正是坚持了“8150”原则，才能保证CEO和几十万名员工之间只隔了5层管理者。


    百度通过大数据分析建模，动态扫描组织名称变化、团队规模变化、管理幅度变化、管理层级变化、高阶人才异动情况、团队离职率等情况，进行组织健康度与关键人才的风险指数分析，并提供准实时预警，从而达到确保组织灵活、高效配置、上下同欲的目的。例如，当管理幅度小于5人时，系统就会给相应的OD负责人发送邮件，OD负责人就会与HRBP共同分析团队配置的合理性；当某业务线管理层级大于5时，系统也会发出预警，OD负责人会检查组织配置的合理性与恰当性。当系统监测到关键人才的离职风险度或管理风险度超过一定的阈值时，HR从业者也会收到通知，采取轮岗、继任、激励等一系列措施降低风险或避免发生更大的损失，促进组织的良性循环。


    ## 第二节　智能关怀


    要想充分发挥人才的价值，企业必须构建一个员工关怀的文化和环境。这就意味着，企业需要为这项工作分配一定的资金和资源，同时将员工健康、安全和幸福方面的投资与企业的经营业绩联系起来。


    虽然一些公司管理者仍然认为员工关怀计划只是提供给员工的额外福利，但是有些公司已经把员工关怀计划当作了公司战略业务的一部分。这些公司也被称为“最佳雇主”，它们的成功已经证实了员工士气、精神状态、健康、安全和公司盈利状态之间不仅存在相关性，而且存在因果关系。


    人工智能时代的员工关怀，在企业层面是为了增强组织的吸引力，在员工层面则是为了打造有温度的职场环境。企业通过对员工生命周期的跟踪、管理和关怀，与企业的“选、用、育、留”人才管理政策直接挂钩，充分发挥了员工的主观能动性与HR从业者的战略价值。


    ### 一、关联职业生涯事件触发关怀


    过去，企业只要支付一定的薪酬就能留住员工；现在，企业要不断地给予员工一定的关爱，关心他们的物质需求和精神诉求，才能提升他们的归属感，减少人员流失。围绕员工入职、在职、离职三位一体的全生命周期，HR从业者通过“四化”提升员工职场体验，即体验场景化、互动社交化、行为积分化、反馈实时化。


    在员工的职业生命周期内，典型的智能关怀场景如图5-4所示。


    ![](Images/cutq_145_42118_l.jpg)


    图5-4　智能关怀的场景


    1. 入职前员工可享受免费体检，员工在入职报到时会收到大礼包。

    2. 新员工有文化导师、专业导师的引领，可快速适应环境、融入团队。

    3. 试用期内有90~180天的新员工游戏化培训之旅，边学习、边打怪、边积分。在此过程中，新员工们熟悉了文化，提升了专业，领到了奖品。

    4. 企业为员工送上生日祝福、司龄周年祝福。

    5. 组织各种节日活动，如年会活动、三八女神节、五四青年节、六一儿童嘉年华、母亲节参观活动、父亲节书信活动、中秋节礼品、春节礼品等。

    6. 企业为员工婚、丧、嫁、娶、生小孩等特殊时期发放礼金。

    7. 企业提供温馨的办公环境、免费的食堂和茶水间。

    8. 员工如在晚上9点后下班可报销打车费。

    9. 体检生病有保障，租房买房有优惠。

    10. 父母生日有礼金，体检住院管报销。


    ### 二、祝福提醒


    随着大量“90后”“00后”年轻人涌入职场，他们更加关注工作的价值和体验，要求企业在职场环境的打造方面要更有温度、更具创造性。因此，通过人工智能、数字化技术实现员工关键时刻的祝福提醒，已成为HR从业者发挥价值的必备技能。


    智能关怀是指基于员工画像，HR从业者为员工提供个性化、智能化的关怀体验。HR从业者可以根据员工的工作方向、学习内容、职业规划、兴趣爱好、日常习惯、社交、消费等进行大数据分析建模，为员工打上相关的“标签”，在员工“工作、生活、学习、发展”的不同时刻触发“机制”，提供个性化的“员工关怀”。“机制”的背后就是基于人工智能、大数据技术的一站式智能关怀服务系统。


    相关“机制”如下。


    1. **员工祝福**。在员工生日当天的一早，系统会通过邮件、移动端IM向员工发送生日祝福卡；同时系统也会给该员工的直接主管发送提醒，告知当天有下属过生日，提醒主管表达“关怀”。生日祝福卡上有专属的二维码，员工可以去公司礼品店扫描二维码换取生日礼物，或者去自提柜扫码/刷脸自助领取。

    2. **司龄祝福**。在员工司龄满周年的当天一早，系统会通过邮件、移动端IM向员工发送司龄周年祝福卡，感谢员工的贡献与陪伴。每个周年祝福卡的内容不同，卡片的颜色与设计风格也不一样，这样可以让员工每年都有惊喜。同时，公司会发放周年纪念品及司龄徽章，员工可以去礼品店或自提柜刷脸领取。例如，阿里巴巴将员工入职一年称为“一年香”，表达的是认同；满三年称为“三年醉”，意味着成人；满五年称为“五年陈”，意义是传承，团队还会在不同的时点举办特别的纪念仪式。百度的小度熊上会自带徽章，阿拉伯数字代表周年，用白色、灰色、银色、蓝色、金色分别代表员工加入公司的不同阶段，五年发放银熊，十年发放金熊；员工入职十年时，公司会举办特别的仪式，CEO会亲自为其颁奖来表达认可，让员工收获满满的荣誉感。当然，该员工的直接主管在当天也会收到提醒。

    3. HR从业者会根据场景不同，设计不同的内容与形式通知员工转正、晋升、绩效反馈、评价反馈等结果，让员工感受到认可和鼓励，在今后的工作中发挥更大的能量。

    4. **离职关怀**也很重要。入离职流程都是自动化的，如果离职交接内容很多，系统就会通过后台自动校验相关事项，不需要员工问来问去；同时，员工可以在一站式服务大厅里办理需要线下处理的事项（如缴还电脑、工卡等），不需要跑来跑去。离职手续办理完毕后，公司还会发放一套明信片，以示纪念；同时系统会向员工发放离职卡片提示转移档案、社保、户口、党团关系等的注意事项。每逢三大节日（中秋节、春节、司庆日），系统会自动给已离职人员预留的手机发送祝福短信，表达感恩之情。


    上述关怀机制既可以降低员工离职率、吸引离职员工回流，也可以提升员工满意度、敬业度。做好离职管理工作，有助于企业在业内树立良好的品牌形象，吸引更多优秀的人才。


    ### 三、关怀福利商城


    员工福利作为薪酬福利系统的一个重要组成部分，在很大程度上已经成为企业吸引和留住优秀人才、激发和调动员工积极性的一项管理措施。过去那种普惠型的福利已不能满足员工的个性化需求，甚至有可能会降低员工的工作积极性。因此，企业应实行弹性福利制度，建立员工智能福利系统，提高员工的忠诚度与敬业度，使企业和员工达到双赢。


    人工智能时代的弹性福利系统集成了用户画像、语音识别、个性化推荐等技术，通过识别员工的个性化需求，实现福利场景化、关怀多样化，为员工提供全方位、个性化的自由组合与选择，实现员工体验全覆盖、生活娱乐一站式的目标。


    弹性福利商城通常包含如下内容。


    **针对企业：**


    1. 企业有专属账号管理，先消费后结算，合理分配预算，灵活组合科目；

    2. 集成供应商资源，企业可一站式配置个性化福利组合；

    3. 汇聚各类优质品牌资源，为企业提供全方位、个性化的节日礼品选择；

    4. 专属员工服务后台，HR高效统筹管理。


    **针对员工：**


    1. 员工有独立账号，不同级别的员工有不同的积分，员工可消费、可兑换；

    2. 自主选择弹性福利（如保险、体检、礼品、补贴等），同时覆盖家人；

    3. 可享受个人采购无法获得的团队优惠；

    4. 可使用平台账户积分或个人账户在线支付；

    5. 功能包括积分发放、福利明细、福利兑换、福利汇总。


    度生活—弹性福利平台如图5-5所示。度生活是百度为员工提供生活和工作便利的产品，有PC端与移动端两种，主打移动端，通过不同的“频道”（生活频道如社团汇、生活站、挂号通、安居坊、跳蚤街、度优惠、健康园、易出行等，工作频道如速查询、问HR、要盖章等）使员工能够随时随地享受到公司的福利。


    ![](Images/image_149_0_m.jpg)


    图5-5　度生活—弹性福利平台


    各个频道的功能简述如下：


    1. **社团汇**：集合篮球队、足球队、羽毛球队、乒乓球队、游泳队、瑜伽社、舞蹈队、歌唱社、读书社、爬山、跑步、户外、动漫、表演等；

    2. **生活站**：吃、喝、玩、乐的集合地；

    3. **健康园**：基础保险+补充医疗保险、体检项目组合、健康空间、健康课程等；

    4. **挂号通**：与机构合作解决员工挂号难题；

    5. **易出行**：集成了机票、酒店、火车、打车平台，方便员工出差、旅游等；

    6. **安居坊**：为员工提供靠谱的房源；

    7. **跳蚤街**：即二手交易市场，便于员工重新利用闲置物品；

    8. **度优惠**：提供各种折扣优惠信息；

    9. **易会签**：进行会议室预定、视频会议、签到打卡、会议记录等会议管理。


    ## 第三节　舆情监测


    所谓舆情监测，就是企业数字系统从业人员利用中文分词技术、自然语言处理技术、中文信息处理技术，对舆情信息进行过滤、去重、相似性聚类、提取摘要、自动聚类等，建立一个舆情监测系统；在合规的前提下，利用爬虫技术，根据预定的监控关键词扫描重点媒体、论坛、博客、微博等网站里的舆情信息，并对敏感信息及时发出预警，在第一时间将预警信息通过邮件、电话、手机短信等方式通知到相关方。


    ### 一、内外部舆情关注


    很多企业在内网开设了匿名区，员工们可以在此畅所欲言。内部的舆情分析结果主要用于两个方面：将与业务相关的建议推荐给相关部门参考；将劳动关系纠纷、招聘、文化宣导、品牌宣传等舆情风险预警交给人力资源部处理。据调查，在企业内网中员工讨论最多的是薪酬福利、工作压力、文化氛围、外部机会、个人发展、培训学习。针对这些高频词，HR从业者需要采取必要的宣传手段，如组织开展薪酬政策说明会、文化宣讲会，举办团建、培训等活动缓解员工压力。


    ### 二、品牌预警


    在人力资源管理工作中，品牌预警主要用于招人与留人环节。在政策法规允许的情况下，HR从业者可利用大数据技术对网络公开资料（如微博、论坛等社交媒体和新闻站点、专业论坛等）中涉及本企业的信息（包括正面的、负面的、中性的信息）进行实时监测、数据采集及数据加工，通过建模与算法综合分析明确企业能承受的风险底线，一旦超出则立即报警，根据预案及时进行处理，避免发生舆情危机，保护好企业的品牌与形象。


    ### 三、文化迭代


    人工智能技术能够依据对员工的文化活动参与度和文化氛围融入度的调查结果，结合几大职场因素（组织、个人、环境因素等）对人员的背景、特征进行大数据分析，构建不同维度的结构化人才保留和激励指标。这一措施对降低员工离职率非常有效。同时，利用人工智能技术开发的机器人助理能够24小时不间断地解决员工在日常工作和生活中遇到的各种问题。尤其是在对员工文化活动的参与度等数据进行剖析后，管理者能够更清楚地知道每位员工关注什么、厌恶什么，更清楚地知道组织需要如何引导文化的走向。


    ### 四、人才迁徙


    企业可通过大数据分析建立员工离职预测模型。该模型主要用于预测员工流失情况并及时提出预警，结合“企业内部人才继任表”协助HR从业者进行提前干预。


    企业可通过大数据分析建立人才迁徙地图。该地图可以帮助HR从业者及时掌握企业内外部人才的动态，为入、离、升、降、调的管理工作提供数据分析与决策参考。


    # 第六章　组织分析与组织画像


    在组织层面，无论是金字塔型组织、矩阵式组织，还是纺锤形组织、网状组织，企业高层管理者对组织的要求都是组织灵活、结构优化、配置敏捷、协作高效。


    在人才层面，企业管理者需要思考如何利用大数据技术识别和判断哪些是核心员工，哪些是骨干员工，哪些是领军人物。


    在文化层面，企业管理者对文化的要求是敏捷创新、上下同欲并赋能组织。


    基于上述三个层面的需求，人力资源数字化可以在流程、系统、数据及用户体验四个维度支撑组织架构、人才及企业文化。首先，流程需要合规高效、权责清晰；其次，系统需要做到互联互通，兼具数据化、场景化、智能化；再次，数据需要整合信息，做到细致分析，从而达到辅助决策的目的；最后，用户体验需要贯穿于人力资源管理的整个生命周期中。


    ## 第一节　组织形态与特点


    组织形态是由组织中纵向的等级关系及其沟通关系、横向的分工协作关系及其沟通关系形成的一种无形的、相对稳定的企业构架。它反映了组织成员之间的分工协作关系，体现了分工和协作框架。简单地说，企业的组织形态就是企业的组织形式、存在状态和运行机制。


    随着时代和内外部环境的变化，组织形态也在不断地演变，从直线型、直线职能型变成了事业部型、网状，如图6-1所示。


    ![](Images/cutq_155_5980_l.jpg)


    图6-1　组织形态的演变历程


    三种组织形态的特点是层级分明、角色清晰、专业化程度高、管控力度强。网状组织的特点则是灵活、有韧性、对环境变化的反应迅速、创新性强。


    网状组织也有不同的形态，它在企业的不同发展阶段会出现如图6-2所示的变化。

