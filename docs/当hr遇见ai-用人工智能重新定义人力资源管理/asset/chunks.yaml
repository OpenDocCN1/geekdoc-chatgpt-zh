- raw: '人力资本指数（Human Capital Index，HCI）是计算人力资本和股东价值相关性的指数。如果企业的人力资本管理得好，股东回报率也会相应较高。通过对大量行业数据进行研究，运用一系列的多次回归分析，结果证明，人力资本投入指数与股东收益成正比。HCI值的范围为0~100，数值越大，表明企业的人力资本管理状况越理想，股东的收益就越大。


    HR从业者要通过NPS、HCI等多种调研分析工具，研究人力资本的投入与股东回报的关系，从而采取有效措施进行改进与完善。华信惠悦公司研究发现，优秀的人力资源管理等同于良好的股东价值；健全的人力资本管理（明确规范的奖惩制度与权责划分、选聘与保留人才的能力以及平等而有弹性的工作环境等）可以使员工的敬业度变得更高。总之，完善的人力资源管理制度及高效的人力资源管理功能与企业获得丰厚的回报是正相关的关系。


    ## [第五节　组织健康度](../Text/contents.xhtml#b_84)


    如果把一匙污水倒进一桶酒中，你得到的将是一桶污水。团队系统非常脆弱，很容易被侵害。每个团队都有自己的健康程度和情绪能量，一个团队的健康程度往往影响着团队绩效和团队发展。


    团队健康度是指在一定周期内，团队的工作安排、员工工作的积极性、团队贡献能力、员工留任意愿等因素综合叠加而形成的一个相对的状态。通过大量的数据分析，专家发现，团队健康度与绩效水平是正相关的关系，团队健康度可以成为预测团队实现高绩效、高利润的先导指标。


    大部分企业在组织健康度方面存在核心人才与关键岗位空缺，衡量数据全面性与客观性不足，难以评估员工离职对团队造成的冲击，缺乏团队健康度的可视化展示与智能建议等问题。


    对HRBP来说，他缺少关键岗位盘点与关键人才流失预警及监控团队健康状况的智能平台。


    对管理者来说，他缺少一个交互式智能助手，使团队的关键信息可以展示在智能可视化界面上。管理者希望可以随时查看团队状况，保证团队的状态在合理范围之内，员工工作状态饱满、协作高效、创新力良好，团队运营状态正常等。


    HRBP和管理者目前获取的与团队健康度相关的信息维度还不够丰富，数据质量不高，智能化程度不高。这就要求HR从业者建立一套模型，以终为始，分析研究HRBP和管理者需要哪些数据，从而在系统建设上适当埋点、自然收集。


    本节将给出一个团队健康度模型，为HRBP、管理者提供一个团队健康度的可视化诊断工具。团队健康度模型具备团队健康度预警功能，可以协助管理者更加客观、及时地做出决策，确保团队健康度能够满足团队的良性发展需要。


    那么，哪些维度会影响团队健康度呢？我们总结为如下十大维度。


    ■发展方向：向员工传递清晰明确的、简单直接的、强有力的使命与愿景，让员工了解组织的发展方向、如何实现目标及其对员工的意义，达到“上下同欲”的目的。


    ■文化和氛围：在企业内部上下宣导并践行一套深入人心的价值观，在日常行为中体现出来，并在试用期考核、绩效考核、360度考核评价中进行检验。


    ■团队状态：即团队工作安排的情况，具体指团队业务、团队目标、团队结构、团队地位、团队氛围、团队能力、团队绩效等方面的特点。


    ■贡献意愿：指团队成员有多大的驱动力留在团队中，并愿意为团队的发展目标贡献自己的知识与技能。


    ■贡献积极性：指团队员工在个人薪酬、发展空间、团队氛围等因素的影响下是否主动自觉工作。


    ■战功：指员工给企业带来的贡献的大小与贡献的稀缺性，可从日常工作行为、工作绩效等维度进行衡量。


    ■武功：指员工的专业技能、通用才能与工作潜能等，它直接影响员工工作的质量和效率，可以用来评判员工是否具备胜任某一岗位的能力，是否可以作为潜在人才培养。


    ■动力：培养员工的忠诚度与热忱，提倡员工源源不断地创新，鼓励员工尽力追求最佳绩效。


    ■离职预测：预测员工离职或转岗的可能性，管理者可提前采取措施维持团队状态。


    ■替代成本：指员工离职后，企业从招聘新员工到新员工顺利上岗所需要的成本，其包括时间成本、人力成本、经济成本、管理成本等。替代成本与员工的优秀程度、稀缺程度成正比。


    团队健康度平台的主要构成内容如下。


    （1）描述员工或关键人才的状态


    ■战功情况


    ■武功状态


    ■贡献意愿评级


    ■离职风险度


    ■替代成本评级


    ■动力指数


    （2）描述团队情况


    ■团队结构（排兵布阵）


    ■团队业务属性


    ■团队健康度评级


    ■团队健康度预警


    ■团队健康优化建议


    （3）描述组织情况


    ■组织气氛指数


    ■文化价值观评级


    ■目标达成指数


    ## [第六节　组织效能](../Text/contents.xhtml#b_85)


    组织效能是指组织实现既定目标的程度。这些目标既可以是特定的产出（生产率或服务质量）、设定的效率目标，也可以是内部流程的协调程度，以及获得、创造竞争优势所需资源的程度。组织效能主要体现在能力、效率、质量和效益四个方面。组织效能的影响因素主要有两个，即外部环境（如政治、法律法规、科技、行业等）和内部环境（如组织架构、业务流程、管理机制、员工能力、企业文化、数字化水平等）。


    那么，如何衡量组织效能呢？这就需要HR从业者从多个角度判断组织是否达到了它设定的目标，以及它的全部潜力。HR从业者根据既定目标和KPI创建一个更为详细的效能计分卡与系统的评估方法，可以用来定期评估和跟踪组织的实际有效性，以及发现改进的方向。要想提升组织效能，HR从业者就必须善于利用大数据技术收集信息、建模分析，对企业现有的组织效能进行全面、深入、准确的评估，看清企业当前的效能现状，厘清优势和不足，预测未来趋势，为决策判断提供辅助依据。


    下面从四个维度进行业务建模、大数据建模，并且说明如何衡量组织效能、团队效能。


    （1）团队目标


    ■明确团队目标


    ●判断团队目标是否明确、清晰；


    ●确定团队周报（过程管理）填写比例、月报季报（项目管理）完成程度；


    ●明确团队工作、业务发展方向的清晰程度。


    ■认可团队目标


    ●团队成员对团队目标的认可度、一致性；


    ●团队成员了解团队目标的清晰度；


    ●团队成员分配工作角色的合理性；


    ●团队成员兼岗角色占比、重复角色占比。


    ■有效工作成果


    ●目标达成情况、业绩完成情况，同比、环比增长率；


    ●客户满意度和认可度；


    ●团队成员的专利申请情况和获奖情况；


    ●团队创新型项目情况；


    ●团队多元、敏捷工作机制情况。


    （2）团队能力


    ■专业能力


    ●团队业务敏锐度、业务互信度；


    ●团队成员的专业能力（如产品规划、方案设计、项目管理）是否满足管理者的期望；


    ●团队创新能力、适应变化能力；


    ●团队前沿技术的掌握能力，评估未来三年的市场紧缺度。


    ■学习能力


    ●团队学习能力与反思能力；


    ●对新技术、新趋势的接纳能力。


    （3）团队健康度


    ■团队健康度的衡量维度参考上节内容。


    （4）组织活力


    ■沟通与协作


    ●团队内部沟通与协作顺畅指数；


    ●跨团队沟通与协作顺畅指数；


    ●团队成员互信度。


    ■活力指数


    ●关键人才流动率；


    ●关键人才流失率；


    ●关键人才晋升成功率；


    ●高绩效员工留任率；


    ●后备人才准备度。


    当然，企业会在不同的发展阶段表现出不同的状态，相应的组织效能影响维度与指标也会有所差异。即使在企业内部，不同的业务形态处于不同的发展曲线上（如第一曲线、第二曲线、第三曲线）也会有很多差异。随着企业的发展，数据积累会越来越多、越来越丰富，组织效能的洞察就会越来越接近事实。


    一般情况下，随着数据积累程度的加大，HR从业者可以利用以下三种措施评估组织效能。


    ■监控。当数据以结构化信息为主时，HR从业者可以通过数据化的方式及时监测经营、运营、组织与人力资源管理方面的效能状况。


    ■诊断。当数据量积累到一定程度时，HR从业者可以根据战略目标设置每一个指标的正常区域和警戒区域，一旦出现问题可以进行预警并作针对性处理。


    ■洞察。在长期积累数据后，HR从业者会发现大量有价值的非结构化数据。通过分析对比，HR从业者能从数据中发现很多组织效能方面的隐形问题，从而找出驱动因素，并进行有针对性的提升和整体联动。


    # [第七章　人工智能时代的三支柱模型](../Text/contents.xhtml#z_12)


    ## [第一节　人工智能时代三支柱的变化和作用](../Text/contents.xhtml#b_86)


    ### [一、人力资源转型](../Text/contents.xhtml#c_87)


    企业为什么要进行人力资源转型呢？因为HRBP（人力资源战略伙伴）的事务性工作占据了他们过多的时间与精力，而他们投入在成为战略伙伴、开展内部客户咨询的时间和精力远远不够，创造的业务方面价值远低于企业管理者的预期。


    根据调研报告分析（如图7-1所示），大部分企业人力资源管理的现状是：HR从业者将大部分精力放在了人事服务等基础性工作上，该部分时间约占HR从业者全部工作时间的65%；对业务影响力最大的部分即具有战略性的人力资源规划活动仅占约10%；发挥人力资源最大价值的部分即客户服务、内部咨询只占约25%。


    ![](Images/cutq_181_56733_l.jpg)


    图7-1　人力资源管理工作内容占比的调研报告示意图


    人力资源战略伙伴角色的作用如此重要，HR从业者却没有更多的时间投入该项工作中，这是战略伙伴角色有效性低的主要原因。要解决这一问题，企业就需要进行人力资源转型。


    人力资源转型的目标是将人力资源管理中成本较高、职能重复、事务性繁多的架构，转向事务性、专业性、战略性强的组织架构。也就是说，在保证人事服务准确、有效的前提下，通过职责梳理、重构与技术手段将人事服务工作量和人员投入减少到20%，将战略性人力资源规划的投入提升到20%，将客户服务与内部咨询的投入加强到60%，以提升HRBP的专业度与价值。


    企业对人力资源部的重视度与其发展速度成正相关。处于快速发展阶段的企业中有超过60%的管理者认为人力资源部是资源管理中心和人力资本中心，具备不可或缺的战略职能，HRBP可以发挥很大的价值。人力资源三支柱的出现将会加速人力资源转型，凸显人力资源的价值。


    ### [二、三支柱](../Text/contents.xhtml#c_88)


    1.传统三支柱


    人力资源三支柱模型的概念是由戴维·尤里奇在1997年提出的，即人力资源专家中心、人力资源业务伙伴和人力资源共享服务中心。三支柱的具体工作及其相互关系如图7-2所示。


    人力资源专家中心（HR Centre of Excellence或Center of Expertise，HRCOE），是指精通某一领域的人力资源专家，主要为业务部门提供人力资源方面的专业咨询与解决方案。在企业内部，HRCOE通常包含薪酬福利（C&B）、组织发展（OD）、人才发展（TD）、学习发展（LD）、组织文化（OC）、招聘（政策与机制部分）、系统（HRIS）等职能。


    ![](Images/cutq_183_6429_l.jpg)


    图7-2　HR三支柱的具体工作及其相互关系


    HRCOE如同企业开展人力资源管理的方向盘、红绿灯、加油站。


    ■方向盘。HRCOE作为人力资源领域的专家与设计者，主要负责运用专业知识提升HR从业者的专业能力，制定人力资源管理的政策、机制、流程，并持续改进其有效性。


    ■红绿灯。HRCOE作为管控者，主要负责控制人力资源政策、机制、流程的合规性，控制企业的用工风险。


    ■加油站。HRCOE作为技术专家，设计业务解决方案、模板与工具，对HRBP、HRSSC、业务管理者提供人力资源领域的技术支持，指导他们开展人力资源管理的相关活动。


    人力资源业务伙伴（HR Business Partner，HRBP）是人力资源部与各业务部门主管、经理沟通的桥梁。HRBP既要熟悉人力资源部的各项职能，又要了解业务部门的需求；既能帮助业务部门更好地维护员工关系，也要处理业务部门经常出现的较为简单的与人力资源管理有关的问题，还要协助业务部门主管、经理更好地使用各种人力资源管理制度和工具。


    HRBP是HR部门里最贴近业务部门的岗位。企业会根据HRBP与正式员工的服务配比配置HRBP的数量。在不同的组织中，人力资源部对业务部门的支持程度和业务的复杂度不同，HRBP的服务配比也存在差异。在人力资源管理活动中，HRBP主要扮演如下几个角色：


    ●战略伙伴：在组织和人才战略、核心价值观传承方面推动战略执行；


    ●解决方案集成者：集成HRCOE的设计，成为业务导向的解决方；


    ●HR管理流程执行者：推行HR管理流程，支持人员管理决策；


    ●变革推动者：扮演变革催化剂的角色；


    ●关系管理者：有效管理员工关系。


    人力资源共享服务中心（HR Shared Service Center，HRSSC）负责统一处理企业中各业务部门与人力资源管理有关的所有基础性、事务性工作，如薪酬福利核算与发放、社会保险管理、人事档案管理、人事信息服务管理、劳动合同管理、员工招聘、新员工培训、员工投诉与建议处理、咨询服务等。


    HRSSC是人力资源标准服务的提供者，负责确保服务交付的一致性，为企业和员工提供标准化、流程化的服务，使HR主管和HR专员从繁杂的事务性工作中释放出来，提升人力资源部的整体服务效率。HRSSC通常扮演如下几个角色：


    ●员工自助中心：支持员工和管理者发起的服务需求；


    ●HR流程事务处理中心：支持由HRCOE发起的主流程的行政事务部分（如发薪、招聘、培训事务）；


    ●HRSSC运营管理中心：提供质量、内控、数据、技术（包括自助服务）和供应商管理支持。


    2.三支柱案例分享：腾讯HRSDC升级之路


    （1）撬动腾讯SSC向SDC升级的核心要素


    经过五年多的探索，腾讯公司的人力资源共享服务中心已经变成人力资源共享交互中心（Shared Delivery Center，SDC）。这样的转变符合时代的变化及行业背景的更迭，最主要的是腾讯公司人力资源共享服务中心发现业务部门对他们和人力资源部的需求已经开始发生变化。


    首先，业务需求已经从早期稳定性的需求变成多变性的需求，业务部门对人力资源管理强调的多是弹性化。


    其次，员工的个性化与自我管理的新需求，需要人力资源共享服务中心研究人性、管理人心。回归人性，并朝着管理人心的方向转化，这才是人力资源管理的根本。


    再次，信息和智能时代的变化。员工对工具的使用开始出现从PC桌面端到多端的变化。


    最后，人力资源部的前端战略能够与公司的战略相匹配，同时，人力资源部能够支持多端的生命发展周期和业务发展周期。


    例如，腾讯公司有广泛的业务线。北京公司的员工多是从事网络媒体及视频工作的，深圳公司的员工从事的工作与游戏相关。在多种业务状态和业务模式下，人力资源部如何才能适应业务部门的需求，快速地、一站式地提供解决方案就是腾讯SDC模式诞生的主要原因，公司希望SDC能够站在连接HRCOE及整个运营中心的角度做好支撑工作。


    （2）腾讯SDC与传统SSC的区别


    如果HRSSC是1.0，那么腾讯的SDC就是2.0。SDC从被动等待、承接事物的状态，发展到能主动发起交付式需求、主动递交服务，以交付标准和交付诉求去实现需求。因此，SDC更多的是连接好HRCOE和HRBP的需求，如图7-3所示。


    ![](Images/cutq_186_18776_l.jpg)


    图7-3　SDC要连接HRCOE和HRBP的需求


    在一些企业中，很多HRCOE很难往上浮，HRBP很难往下沉，HRSSC的工作被混淆在一起。如果不能把这部分工作做到集约化、模块化，HRCOE将很难发挥“公司大脑”的作用，无法判断公司在今后的战略发展上，人力资源管理者应该做出什么样的战略布局。同样，如果不能很好地集约到后台，各个业务线上的HRBP也很难快速、积极地影响不同的业务群体，因为HRBP没有足够的力量看到业务部门更深层的地方。所以，SDC要能够在这几个方面建立人力资源解决方案的中心。这是腾讯公司目前正在做的事情。


    （3）SDC未来的发展方向与挑战


    腾讯公司的SDC将成为能够为员工提供稳定、可靠、被依赖的人力资源服务的HR一体化交付平台。为了实现这一愿景，腾讯公司也面临着很多挑战。例如，真正能够从事SDC的人在哪里，如何量化SDC对公司的组织效能，怎样做才能事半功倍。


    ### [三、重塑三支柱](../Text/contents.xhtml#c_89)


    随着人工智能技术和大数据分析不断应用到人力资源管理的各个领域里，这种影响将会重塑人力资源三支柱，从而加速“组织、人才、文化”的迭代与进化。那么，重塑之后的三支柱都有哪些不同呢？其具体变化的内容及其相互关系如图7-4所示。


    ![](Images/cutq_187_29387_l.jpg)


    图7-4　重塑后的HR三支柱+AI


    1.HRSSC+AI


    经过AI赋能的HRSSC，在如下方面具有明显的竞争优势。


    □ 员工体验


    重塑后的HR三支柱在员工体验层面有了很大的提升。


    员工体验是指员工在企业内部遇到的、感受到的、听到的好或坏的事情的集合，包含员工入职前后、在职期间、离职前后这样一个完整的生命周期。在入职、在职、离职的各个阶段，员工也会经历憧憬期、蜜月期、迷茫期、崛起期、成熟期、衰减期、躁动期、念想期等，如图7-5所示。


    ![](Images/cutq_188_35430_l.jpg)


    图7-5　员工体验与员工生命周期


    例如，在入职前，候选人处于憧憬期，这时人力资源从业者要从“如何吸引”候选人快速“加入”出发，通过输出雇主品牌形象，让信息高效地传达至候选人，或借助智能客服机器人与候选人进行沟通，提前向候选人推送公司宣传材料，加深其对公司的了解。在入职中，人力资源从业者可以通过数字签、光学字符识别（Optical
    Character Recognition，OCR）、机器人流程自动化（Robotic Process Automation，RPA）等技术实现极速入职，改善员工的入职体验。入职后，通过无感考勤，员工可以轻松解决上下班时打不上卡的尴尬。离职时，公司会向员工赠送明信片，让员工在离职后对公司心怀念想。


    什么是无感考勤呢？过去，考勤大多采用刷卡考勤、指纹考勤、刷脸考勤、移动考勤等方式，而在数智化时代，人力资源部可部署三现（现场、现物、现实）数据采集设备，如高清摄像头、巡检机器人、近场通信（Near
    Field Communication，NFC）设备等，员工只要进入办公区域即可自动识别，无需“打卡”的动作。当然，公司要与员工签署知情许可与使用保密协议书。


    □ 设计思维


    人力资源领域的产品设计需要贯穿员工入职、在职、离职的全生命周期，以关爱员工的需求为出发点思考与解决问题，改善流程，激发员工的热情与自驱力。例如，百度将徽章与卡通度熊设计在一起，员工每到司龄周年都会收到带有数字的小度熊，数字代表员工工作的年限，工作满5年或10年还有长期服务奖；同时，在员工生日当天，公司也会发放有特别意义的小度熊，这些五颜六色的小度熊在工位上排成一排，极大地增强了员工的自豪感、归属感，以及与公司一起成长的成就感。


    人力资源部的工作是由一个个细节堆积出来的，HR从业者要善于运用设计思维改善员工体验，营造小温馨实现大体验。


    □ 产品思维'
  fmt: "\n人力资本指数（`Human Capital Index`，`HCI`）是计算人力资本和股东价值相关性的指数。如果企业的人力资本管理得好，股东回报率也会相应较高。通过对大量行业数据进行研究，运用一系列的多次回归分析，结果证明，人力资本投入指数与股东收益成正比。`HCI`值的范围为0~100，数值越大，表明企业的人力资本管理状况越理想，股东的收益就越大。\n\
    \n`HR`从业者要通过`NPS`、`HCI`等多种调研分析工具，研究人力资本的投入与股东回报的关系，从而采取有效措施进行改进与完善。华信惠悦公司研究发现，优秀的人力资源管理等同于良好的股东价值；健全的人力资本管理（明确规范的奖惩制度与权责划分、选聘与保留人才的能力以及平等而有弹性的工作环境等）可以使员工的敬业度变得更高。总之，完善的人力资源管理制度及高效的人力资源管理功能与企业获得丰厚的回报是正相关的关系。\n\
    \n## [第五节 组织健康度](../Text/contents.xhtml#b_84)\n\n如果把一匙污水倒进一桶酒中，你得到的将是一桶污水。团队系统非常脆弱，很容易被侵害。每个团队都有自己的健康程度和情绪能量，一个团队的健康程度往往影响着团队绩效和团队发展。\n\
    \n团队健康度是指在一定周期内，团队的工作安排、员工工作的积极性、团队贡献能力、员工留任意愿等因素综合叠加而形成的一个相对的状态。通过大量的数据分析，专家发现，团队健康度与绩效水平是正相关的关系，团队健康度可以成为预测团队实现高绩效、高利润的先导指标。\n\
    \n大部分企业在组织健康度方面存在核心人才与关键岗位空缺，衡量数据全面性与客观性不足，难以评估员工离职对团队造成的冲击，缺乏团队健康度的可视化展示与智能建议等问题。\n\
    \n对`HRBP`来说，他缺少关键岗位盘点与关键人才流失预警及监控团队健康状况的智能平台。\n\n对管理者来说，他缺少一个交互式智能助手，使团队的关键信息可以展示在智能可视化界面上。管理者希望可以随时查看团队状况，保证团队的状态在合理范围之内，员工工作状态饱满、协作高效、创新力良好，团队运营状态正常等。\n\
    \n`HRBP`和管理者目前获取的与团队健康度相关的信息维度还不够丰富，数据质量不高，智能化程度不高。这就要求`HR`从业者建立一套模型，以终为始，分析研究`HRBP`和管理者需要哪些数据，从而在系统建设上适当埋点、自然收集。\n\
    \n本节将给出一个团队健康度模型，为`HRBP`、管理者提供一个团队健康度的可视化诊断工具。团队健康度模型具备团队健康度预警功能，可以协助管理者更加客观、及时地做出决策，确保团队健康度能够满足团队的良性发展需要。\n\
    \n那么，哪些维度会影响团队健康度呢？我们总结为如下十大维度。\n\n- **发展方向**：向员工传递清晰明确的、简单直接的、强有力的使命与愿景，让员工了解组织的发展方向、如何实现目标及其对员工的意义，达到“上下同欲”的目的。\n\
    - **文化和氛围**：在企业内部上下宣导并践行一套深入人心的价值观，在日常行为中体现出来，并在试用期考核、绩效考核、360度考核评价中进行检验。\n- **团队状态**：即团队工作安排的情况，具体指团队业务、团队目标、团队结构、团队地位、团队氛围、团队能力、团队绩效等方面的特点。\n\
    - **贡献意愿**：指团队成员有多大的驱动力留在团队中，并愿意为团队的发展目标贡献自己的知识与技能。\n- **贡献积极性**：指团队员工在个人薪酬、发展空间、团队氛围等因素的影响下是否主动自觉工作。\n\
    - **战功**：指员工给企业带来的贡献的大小与贡献的稀缺性，可从日常工作行为、工作绩效等维度进行衡量。\n- **武功**：指员工的专业技能、通用才能与工作潜能等，它直接影响员工工作的质量和效率，可以用来评判员工是否具备胜任某一岗位的能力，是否可以作为潜在人才培养。\n\
    - **动力**：培养员工的忠诚度与热忱，提倡员工源源不断地创新，鼓励员工尽力追求最佳绩效。\n- **离职预测**：预测员工离职或转岗的可能性，管理者可提前采取措施维持团队状态。\n\
    - **替代成本**：指员工离职后，企业从招聘新员工到新员工顺利上岗所需要的成本，其包括时间成本、人力成本、经济成本、管理成本等。替代成本与员工的优秀程度、稀缺程度成正比。\n\
    \n团队健康度平台的主要构成内容如下。\n\n1. **描述员工或关键人才的状态**\n   - 战功情况\n   - 武功状态\n   - 贡献意愿评级\n\
    \   - 离职风险度\n   - 替代成本评级\n   - 动力指数\n2. **描述团队情况**\n   - 团队结构（排兵布阵）\n   - 团队业务属性\n\
    \   - 团队健康度评级\n   - 团队健康度预警\n   - 团队健康优化建议\n3. **描述组织情况**\n   - 组织气氛指数\n   - 文化价值观评级\n\
    \   - 目标达成指数\n\n## [第六节 组织效能](../Text/contents.xhtml#b_85)\n\n组织效能是指组织实现既定目标的程度。这些目标既可以是特定的产出（生产率或服务质量）、设定的效率目标，也可以是内部流程的协调程度，以及获得、创造竞争优势所需资源的程度。组织效能主要体现在能力、效率、质量和效益四个方面。组织效能的影响因素主要有两个，即外部环境（如政治、法律法规、科技、行业等）和内部环境（如组织架构、业务流程、管理机制、员工能力、企业文化、数字化水平等）。\n\
    \n那么，如何衡量组织效能呢？这就需要`HR`从业者从多个角度判断组织是否达到了它设定的目标，以及它的全部潜力。`HR`从业者根据既定目标和`KPI`创建一个更为详细的效能计分卡与系统的评估方法，可以用来定期评估和跟踪组织的实际有效性，以及发现改进的方向。要想提升组织效能，`HR`从业者就必须善于利用大数据技术收集信息、建模分析，对企业现有的组织效能进行全面、深入、准确的评估，看清企业当前的效能现状，厘清优势和不足，预测未来趋势，为决策判断提供辅助依据。\n\
    \n下面从四个维度进行业务建模、大数据建模，并且说明如何衡量组织效能、团队效能。\n\n1. **团队目标**\n   - **明确团队目标**\n   \
    \  - 判断团队目标是否明确、清晰；\n     - 确定团队周报（过程管理）填写比例、月报季报（项目管理）完成程度；\n     - 明确团队工作、业务发展方向的清晰程度。\n\
    \   - **认可团队目标**\n     - 团队成员对团队目标的认可度、一致性；\n     - 团队成员了解团队目标的清晰度；\n     - 团队成员分配工作角色的合理性；\n\
    \     - 团队成员兼岗角色占比、重复角色占比。\n   - **有效工作成果**\n     - 目标达成情况、业绩完成情况，同比、环比增长率；\n\
    \     - 客户满意度和认可度；\n     - 团队成员的专利申请情况和获奖情况；\n     - 团队创新型项目情况；\n     - 团队多元、敏捷工作机制情况。\n\
    2. **团队能力**\n   - **专业能力**\n     - 团队业务敏锐度、业务互信度；\n     - 团队成员的专业能力（如产品规划、方案设计、项目管理）是否满足管理者的期望；\n\
    \     - 团队创新能力、适应变化能力；\n     - 团队前沿技术的掌握能力，评估未来三年的市场紧缺度。\n   - **学习能力**\n    \
    \ - 团队学习能力与反思能力；\n     - 对新技术、新趋势的接纳能力。\n3. **团队健康度**\n   - 团队健康度的衡量维度参考上节内容。\n\
    4. **组织活力**\n   - **沟通与协作**\n     - 团队内部沟通与协作顺畅指数；\n     - 跨团队沟通与协作顺畅指数；\n   \
    \  - 团队成员互信度。\n   - **活力指数**\n     - 关键人才流动率；\n     - 关键人才流失率；\n     - 关键人才晋升成功率；\n\
    \     - 高绩效员工留任率；\n     - 后备人才准备度。\n\n当然，企业会在不同的发展阶段表现出不同的状态，相应的组织效能影响维度与指标也会有所差异。即使在企业内部，不同的业务形态处于不同的发展曲线上（如第一曲线、第二曲线、第三曲线）也会有很多差异。随着企业的发展，数据积累会越来越多、越来越丰富，组织效能的洞察就会越来越接近事实。\n\
    \n一般情况下，随着数据积累程度的加大，`HR`从业者可以利用以下三种措施评估组织效能。\n\n- **监控**。当数据以结构化信息为主时，`HR`从业者可以通过数据化的方式及时监测经营、运营、组织与人力资源管理方面的效能状况。\n\
    - **诊断**。当数据量积累到一定程度时，`HR`从业者可以根据战略目标设置每一个指标的正常区域和警戒区域，一旦出现问题可以进行预警并作针对性处理。\n\
    - **洞察**。在长期积累数据后，`HR`从业者会发现大量有价值的非结构化数据。通过分析对比，`HR`从业者能从数据中发现很多组织效能方面的隐形问题，从而找出驱动因素，并进行有针对性的提升和整体联动。\n\
    \n# [第七章 人工智能时代的三支柱模型](../Text/contents.xhtml#z_12)\n\n## [第一节 人工智能时代三支柱的变化和作用](../Text/contents.xhtml#b_86)\n\
    \n### [一、人力资源转型](../Text/contents.xhtml#c_87)\n\n企业为什么要进行人力资源转型呢？因为`HRBP`（人力资源战略伙伴）的事务性工作占据了他们过多的时间与精力，而他们投入在成为战略伙伴、开展内部客户咨询的时间和精力远远不够，创造的业务方面价值远低于企业管理者的预期。\n\
    \n根据调研报告分析（如图7-1所示），大部分企业人力资源管理的现状是：`HR`从业者将大部分精力放在了人事服务等基础性工作上，该部分时间约占`HR`从业者全部工作时间的65%；对业务影响力最大的部分即具有战略性的人力资源规划活动仅占约10%；发挥人力资源最大价值的部分即客户服务、内部咨询只占约25%。\n\
    \n![](Images/cutq_181_56733_l.jpg)\n\n图7-1 人力资源管理工作内容占比的调研报告示意图\n\n人力资源战略伙伴角色的作用如此重要，`HR`从业者却没有更多的时间投入该项工作中，这是战略伙伴角色有效性低的主要原因。要解决这一问题，企业就需要进行人力资源转型。\n\
    \n人力资源转型的目标是将人力资源管理中成本较高、职能重复、事务性繁多的架构，转向事务性、专业性、战略性强的组织架构。也就是说，在保证人事服务准确、有效的前提下，通过职责梳理、重构与技术手段将人事服务工作量和人员投入减少到20%，将战略性人力资源规划的投入提升到20%，将客户服务与内部咨询的投入加强到60%，以提升`HRBP`的专业度与价值。\n\
    \n企业对人力资源部的重视度与其发展速度成正相关。处于快速发展阶段的企业中有超过60%的管理者认为人力资源部是资源管理中心和人力资本中心，具备不可或缺的战略职能，`HRBP`可以发挥很大的价值。人力资源三支柱的出现将会加速人力资源转型，凸显人力资源的价值。\n\
    \n### [二、三支柱](../Text/contents.xhtml#c_88)\n\n#### 1. 传统三支柱\n\n人力资源三支柱模型的概念是由戴维·尤里奇在1997年提出的，即人力资源专家中心、人力资源业务伙伴和人力资源共享服务中心。三支柱的具体工作及其相互关系如图7-2所示。\n\
    \n人力资源专家中心（`HR Centre of Excellence`或`Center of Expertise`，`HRCOE`），是指精通某一领域的人力资源专家，主要为业务部门提供人力资源方面的专业咨询与解决方案。在企业内部，`HRCOE`通常包含薪酬福利（`C&B`）、组织发展（`OD`）、人才发展（`TD`）、学习发展（`LD`）、组织文化（`OC`）、招聘（政策与机制部分）、系统（`HRIS`）等职能。\n\
    \n![](Images/cutq_183_6429_l.jpg)\n\n图7-2 HR三支柱的具体工作及其相互关系\n\n`HRCOE`如同企业开展人力资源管理的方向盘、红绿灯、加油站。\n\
    \n- **方向盘**。`HRCOE`作为人力资源领域的专家与设计者，主要负责运用专业知识提升`HR`从业者的专业能力，制定人力资源管理的政策、机制、流程，并持续改进其有效性。\n\
    - **红绿灯**。`HRCOE`作为管控者，主要负责控制人力资源政策、机制、流程的合规性，控制企业的用工风险。\n- **加油站**。`HRCOE`作为技术专家，设计业务解决方案、模板与工具，对`HRBP`、`HRSSC`、业务管理者提供人力资源领域的技术支持，指导他们开展人力资源管理的相关活动。\n\
    \n人力资源业务伙伴（`HR Business Partner`，`HRBP`）是人力资源部与各业务部门主管、经理沟通的桥梁。`HRBP`既要熟悉人力资源部的各项职能，又要了解业务部门的需求；既能帮助业务部门更好地维护员工关系，也要处理业务部门经常出现的较为简单的与人力资源管理有关的问题，还要协助业务部门主管、经理更好地使用各种人力资源管理制度和工具。\n\
    \n`HRBP`是`HR`部门里最贴近业务部门的岗位。企业会根据`HRBP`与正式员工的服务配比配置`HRBP`的数量。在不同的组织中，人力资源部对业务部门的支持程度和业务的复杂度不同，`HRBP`的服务配比也存在差异。在人力资源管理活动中，`HRBP`主要扮演如下几个角色：\n\
    \n- **战略伙伴**：在组织和人才战略、核心价值观传承方面推动战略执行；\n- **解决方案集成者**：集成`HRCOE`的设计，成为业务导向的解决方案；\n\
    - **HR管理流程执行者**：推行`HR`管理流程，支持人员管理决策；\n- **变革推动者**：扮演变革催化剂的角色；\n- **关系管理者**：有效管理员工关系。\n\
    \n人力资源共享服务中心（`HR Shared Service Center`，`HRSSC`）负责统一处理企业中各业务部门与人力资源管理有关的所有基础性、事务性工作，如薪酬福利核算与发放、社会保险管理、人事档案管理、人事信息服务管理、劳动合同管理、员工招聘、新员工培训、员工投诉与建议处理、咨询服务等。\n\
    \n`HRSSC`是人力资源标准服务的提供者，负责确保服务交付的一致性，为企业和员工提供标准化、流程化的服务，使`HR`主管和`HR`专员从繁杂的事务性工作中释放出来，提升人力资源部的整体服务效率。`HRSSC`通常扮演如下几个角色：\n\
    \n- **员工自助中心**：支持员工和管理者发起的服务需求；\n- **HR流程事务处理中心**：支持由`HRCOE`发起的主流程的行政事务部分（如发薪、招聘、培训事务）；\n\
    - **HRSSC运营管理中心**：提供质量、内控、数据、技术（包括自助服务）和供应商管理支持。\n\n#### 2. 三支柱案例分享：腾讯`HRSDC`升级之路\n\
    \n##### (1) 撬动腾讯`SSC`向`SDC`升级的核心要素\n\n经过五年多的探索，腾讯公司的人力资源共享服务中心已经变成人力资源共享交互中心（`Shared\
    \ Delivery Center`，`SDC`）。这样的转变符合时代的变化及行业背景的更迭，最主要的是腾讯公司人力资源共享服务中心发现业务部门对他们和人力资源部的需求已经开始发生变化。\n\
    \n首先，业务需求已经从早期稳定性的需求变成多变性的需求，业务部门对人力资源管理强调的多是弹性化。\n\n其次，员工的个性化与自我管理的新需求，需要人力资源共享服务中心研究人性、管理人心。回归人性，并朝着管理人心的方向转化，这才是人力资源管理的根本。\n\
    \n再次，信息和智能时代的变化。员工对工具的使用开始出现从`PC`桌面端到多端的变化。\n\n最后，人力资源部的前端战略能够与公司的战略相匹配，同时，人力资源部能够支持多端的生命发展周期和业务发展周期。\n\
    \n例如，腾讯公司有广泛的业务线。北京公司的员工多是从事网络媒体及视频工作的，深圳公司的员工从事的工作与游戏相关。在多种业务状态和业务模式下，人力资源部如何才能适应业务部门的需求，快速地、一站式地提供解决方案就是腾讯`SDC`模式诞生的主要原因，公司希望`SDC`能够站在连接`HRCOE`及整个运营中心的角度做好支撑工作。\n\
    \n##### (2) 腾讯`SDC`与传统`SSC`的区别\n\n如果`HRSSC`是1.0，那么腾讯的`SDC`就是2.0。`SDC`从被动等待、承接事物的状态，发展到能主动发起交付式需求、主动递交服务，以交付标准和交付诉求去实现需求。因此，`SDC`更多的是连接好`HRCOE`和`HRBP`的需求，如图7-3所示。\n\
    \n![](Images/cutq_186_18776_l.jpg)\n\n图7-3 SDC要连接HRCOE和HRBP的需求\n\n在一些企业中，很多`HRCOE`很难往上浮，`HRBP`很难往下沉，`HRSSC`的工作被混淆在一起。如果不能把这部分工作做到集约化、模块化，`HRCOE`将很难发挥“公司大脑”的作用，无法判断公司在今后的战略发展上，人力资源管理者应该做出什么样的战略布局。同样，如果不能很好地集约到后台，各个业务线上的`HRBP`也很难快速、积极地影响不同的业务群体，因为`HRBP`没有足够的力量看到业务部门更深层的地方。所以，`SDC`要能够在这几个方面建立人力资源解决方案的中心。这是腾讯公司目前正在做的事情。\n\
    \n##### (3) `SDC`未来的发展方向与挑战\n\n腾讯公司的`SDC`将成为能够为员工提供稳定、可靠、被依赖的人力资源服务的`HR`一体化交付平台。为了实现这一愿景，腾讯公司也面临着很多挑战。例如，真正能够从事`SDC`的人在哪里，如何量化`SDC`对公司的组织效能，怎样做才能事半功倍。\n\
    \n### [三、重塑三支柱](../Text/contents.xhtml#c_89)\n\n随着人工智能技术和大数据分析不断应用到人力资源管理的各个领域里，这种影响将会重塑人力资源三支柱，从而加速“组织、人才、文化”的迭代与进化。那么，重塑之后的三支柱都有哪些不同呢？其具体变化的内容及其相互关系如图7-4所示。\n\
    \n![](Images/cutq_187_29387_l.jpg)\n\n图7-4 重塑后的HR三支柱+`AI`\n\n#### 1. `HRSSC`+`AI`\n\
    \n经过`AI`赋能的`HRSSC`，在如下方面具有明显的竞争优势。\n\n##### 员工体验\n\n重塑后的`HR`三支柱在员工体验层面有了很大的提升。\n\
    \n员工体验是指员工在企业内部遇到的、感受到的、听到的好或坏的事情的集合，包含员工入职前后、在职期间、离职前后这样一个完整的生命周期。在入职、在职、离职的各个阶段，员工也会经历憧憬期、蜜月期、迷茫期、崛起期、成熟期、衰减期、躁动期、念想期等，如图7-5所示。\n\
    \n![](Images/cutq_188_35430_l.jpg)\n\n图7-5 员工体验与员工生命周期\n\n例如，在入职前，候选人处于憧憬期，这时人力资源从业者要从“如何吸引”候选人快速“加入”出发，通过输出雇主品牌形象，让信息高效地传达至候选人，或借助智能客服机器人与候选人进行沟通，提前向候选人推送公司宣传材料，加深其对公司的了解。在入职中，人力资源从业者可以通过数字签、光学字符识别（`Optical\
    \ Character Recognition`，`OCR`）、机器人流程自动化（`Robotic Process Automation`，`RPA`）等技术实现极速入职，改善员工的入职体验。入职后，通过无感考勤，员工可以轻松解决上下班时打不上卡的尴尬。离职时，公司会向员工赠送明信片，让员工在离职后对公司心怀念想。\n\
    \n什么是无感考勤呢？过去，考勤大多采用刷卡考勤、指纹考勤、刷脸考勤、移动考勤等方式，而在数智化时代，人力资源部可部署三现（现场、现物、现实）数据采集设备，如高清摄像头、巡检机器人、近场通信（`Near\
    \ Field Communication`，`NFC`）设备等，员工只要进入办公区域即可自动识别，无需“打卡”的动作。当然，公司要与员工签署知情许可与使用保密协议书。\n\
    \n##### 设计思维\n\n人力资源领域的产品设计需要贯穿员工入职、在职、离职的全生命周期，以关爱员工的需求为出发点思考与解决问题，改善流程，激发员工的热情与自驱力。例如，百度将徽章与卡通度熊设计在一起，员工每到司龄周年都会收到带有数字的小度熊，数字代表员工工作的年限，工作满5年或10年还有长期服务奖；同时，在员工生日当天，公司也会发放有特别意义的小度熊，这些五颜六色的小度熊在工位上排成一排，极大地增强了员工的自豪感、归属感，以及与公司一起成长的成就感。\n\
    \n人力资源部的工作是由一个个细节堆积出来的，`HR`从业者要善于运用设计思维改善员工体验，营造小温馨实现大体验。\n\n##### 产品思维\n"
  trans: "\nThe Human Capital Index (`HCI`) is an index that calculates the correlation\
    \ between human capital and shareholder value. If an enterprise manages its human\
    \ capital well, the shareholder return rate will also be correspondingly higher.\
    \ Through research on a large amount of industry data, using a series of multiple\
    \ regression analyses, it has been proven that the human capital investment index\
    \ is directly proportional to shareholder returns. The `HCI` value ranges from\
    \ 0 to 100; the higher the value, the better the enterprise's human capital management\
    \ status, and the greater the shareholder returns.\n\n`HR` practitioners must\
    \ use various research and analysis tools such as `NPS` and `HCI` to study the\
    \ relationship between human capital investment and shareholder returns, thereby\
    \ taking effective measures for improvement and optimization. Huaxin Huiyue's\
    \ research found that excellent human resource management equates to good shareholder\
    \ value; sound human capital management (clear and standardized reward/punishment\
    \ systems and authority/responsibility divisions, capability to select and retain\
    \ talent, and an equal yet flexible work environment, etc.) can make employee\
    \ engagement higher. In short, a sound HR management system and efficient HR management\
    \ functions have a positive correlation with the enterprise obtaining substantial\
    \ returns.\n\n## Section 5 Organizational Health\n\nIf you pour a spoonful of\
    \ sewage into a bucket of wine, you get a bucket of sewage. Team systems are very\
    \ fragile and easily harmed. Every team has its own health level and emotional\
    \ energy, and a team's health level often affects team performance and team development.\n\
    \nTeam health refers to a relative state formed by the comprehensive superposition\
    \ of factors such as team work arrangements, employee work enthusiasm, team contribution\
    \ capability, and employee retention willingness within a certain period. Through\
    \ extensive data analysis, experts have found that team health is positively correlated\
    \ with performance levels, and team health can become a leading indicator for\
    \ predicting high team performance and high profits.\n\nMost enterprises face\
    \ the following issues in organizational health: vacancies in core talent and\
    \ key positions; insufficient comprehensiveness and objectivity of measurement\
    \ data; difficulty in assessing the impact of employee turnover on the team; lack\
    \ of visual display and intelligent recommendations for team health.\n\nFor `HRBP`,\
    \ they lack an intelligent platform for key position inventory, key talent loss\
    \ early warning, and monitoring team health status.\n\nFor managers, they lack\
    \ an interactive intelligent assistant to display key team information on an intelligent\
    \ visual interface. Managers hope to check team status at any time, ensure the\
    \ team status is within a reasonable range, employees are fully engaged, collaboration\
    \ is efficient, innovation capability is good, and team operations are normal.\n\
    \nCurrently, the information dimensions related to team health obtained by `HRBP`\
    \ and managers are not rich enough, data quality is not high, and the level of\
    \ intelligence is not high. This requires HR practitioners to establish a model,\
    \ beginning with the end in mind, to analyze and research what data `HRBP` and\
    \ managers need, so as to appropriately bury tracking points in system construction\
    \ for natural collection.\n\nThis section will provide a team health model, offering\
    \ a visual diagnostic tool for team health for `HRBP` and managers. The team health\
    \ model possesses a team health early warning function, which can assist managers\
    \ in making more objective and timely decisions, ensuring that team health meets\
    \ the needs of the team's healthy development.\n\nSo, which dimensions affect\
    \ team health? We summarize them into the following ten major dimensions.\n\n\
    - **Development Direction**: Convey a clear, simple, direct, and powerful mission\
    \ and vision to employees, letting them understand the organization's development\
    \ direction, how to achieve goals, and their significance to employees, achieving\
    \ the purpose of \"shared vision\" (united in purpose).\n- **Culture and Atmosphere**:\
    \ Advocate and practice a set of deeply ingrained values throughout the enterprise,\
    \ reflected in daily behaviors, and tested in probationary assessments, performance\
    \ appraisals, and 360-degree evaluations.\n- **Team Status**: Refers to the situation\
    \ of team work arrangements, specifically the characteristics of team business,\
    \ team goals, team structure, team status, team atmosphere, team capability, team\
    \ performance, and other aspects.\n- **Contribution Willingness**: Refers to how\
    \ much drive team members have to stay in the team and are willing to contribute\
    \ their knowledge and skills to the team's development goals.\n- **Contribution\
    \ Enthusiasm**: Refers to whether team employees work proactively and consciously\
    \ under the influence of factors such as personal compensation, development space,\
    \ and team atmosphere.\n- **Merits (Strategic Achievements)**: Refers to the magnitude\
    \ and scarcity of the contributions employees bring to the enterprise, which can\
    \ be measured from dimensions such as daily work behaviors and work performance.\n\
    - **Capabilities (Professional Skills)**: Refers to employees' professional skills,\
    \ general talents, and work potential. It directly affects the quality and efficiency\
    \ of employees' work and can be used to judge whether an employee has the competence\
    \ for a certain position and whether they can be cultivated as potential talent.\n\
    - **Drive**: Cultivate employee loyalty and passion, advocate continuous innovation,\
    \ and encourage employees to strive for optimal performance.\n- **Turnover Prediction**:\
    \ Predict the possibility of employee resignation or transfer, allowing managers\
    \ to take measures in advance to maintain team status.\n- **Replacement Cost**:\
    \ Refers to the cost required by the enterprise from recruiting a new employee\
    \ to the new employee successfully assuming the post after an employee leaves.\
    \ It includes time cost, labor cost, economic cost, management cost, etc. Replacement\
    \ cost is directly proportional to the employee's excellence and scarcity.\n\n\
    The main components of the team health platform are as follows.\n\n1. **Describe\
    \ Employee or Key Talent Status**\n   - Merits Situation\n   - Capabilities Status\n\
    \   - Contribution Willingness Rating\n   - Turnover Risk Level\n   - Replacement\
    \ Cost Rating\n   - Drive Index\n2. **Describe Team Situation**\n   - Team Structure\
    \ (Strategic Arrangement/Troop Deployment)\n   - Team Business Attributes\n  \
    \ - Team Health Rating\n   - Team Health Early Warning\n   - Team Health Optimization\
    \ Suggestions\n3. **Describe Organizational Situation**\n   - Organizational Atmosphere\
    \ Index\n   - Cultural Values Rating\n   - Goal Achievement Index\n\n## Section\
    \ 6 Organizational Effectiveness\n\nOrganizational effectiveness refers to the\
    \ degree to which an organization achieves its established goals. These goals\
    \ can be specific outputs (productivity or service quality), set efficiency targets,\
    \ the degree of coordination of internal processes, and the degree of acquisition\
    \ and creation of resources required for competitive advantage. Organizational\
    \ effectiveness is mainly reflected in four aspects: capability, efficiency, quality,\
    \ and benefits. The main influencing factors of organizational effectiveness are\
    \ two: external environment (such as politics, laws and regulations, technology,\
    \ industry, etc.) and internal environment (such as organizational structure,\
    \ business processes, management mechanisms, employee capabilities, corporate\
    \ culture, digitalization level, etc.).\n\nSo, how to measure organizational effectiveness?\
    \ This requires `HR` practitioners to judge from multiple angles whether the organization\
    \ has achieved its set goals and its full potential. `HR` practitioners create\
    \ a more detailed effectiveness scorecard and systematic evaluation method based\
    \ on established goals and `KPIs`, which can be used to regularly evaluate and\
    \ track the organization's actual effectiveness and discover directions for improvement.\
    \ To improve organizational effectiveness, `HR` practitioners must be good at\
    \ using big data technology to collect information, build models, and analyze,\
    \ conducting a comprehensive, in-depth, and accurate assessment of the enterprise's\
    \ existing organizational effectiveness, clearly seeing the current effectiveness\
    \ status, clarifying strengths and weaknesses, predicting future trends, and providing\
    \ supporting basis for decision-making.\n\nBelow, business modeling and big data\
    \ modeling are conducted from four dimensions, and how to measure organizational\
    \ effectiveness and team effectiveness is explained.\n\n1. **Team Goals**\n  \
    \ - **Clarify Team Goals**\n     - Judge whether team goals are clear and explicit;\n\
    \     - Determine the completion rate of team weekly reports (process management)\
    \ and the completion degree of monthly/quarterly reports (project management);\n\
    \     - Clarify the clarity of team work and business development direction.\n\
    \   - **Recognize Team Goals**\n     - Team members' recognition and consistency\
    \ regarding team goals;\n     - Team members' clarity in understanding team goals;\n\
    \     - Rationality of work role allocation among team members;\n     - Proportion\
    \ of concurrent roles and duplicate roles among team members.\n   - **Effective\
    \ Work Results**\n     - Goal achievement status, performance completion status,\
    \ year-on-year and month-on-month growth rates;\n     - Customer satisfaction\
    \ and recognition;\n     - Team members' patent applications and awards;\n   \
    \  - Team innovative project situations;\n     - Team diverse and agile working\
    \ mechanisms.\n2. **Team Capability**\n   - **Professional Capability**\n    \
    \ - Team business acumen and business mutual trust;\n     - Whether team members'\
    \ professional capabilities (such as product planning, solution design, project\
    \ management) meet managers' expectations;\n     - Team innovation capability\
    \ and adaptability to change;\n     - Team's mastery of cutting-edge technologies,\
    \ assessing market scarcity for the next three years.\n   - **Learning Capability**\n\
    \     - Team learning and reflection capabilities;\n     - Ability to accept new\
    \ technologies and trends.\n3. **Team Health**\n   - Measurement dimensions for\
    \ team health refer to the previous section.\n4. **Organizational Vitality**\n\
    \   - **Communication and Collaboration**\n     - Internal team communication\
    \ and collaboration smoothness index;\n     - Cross-team communication and collaboration\
    \ smoothness index;\n     - Team members' mutual trust.\n   - **Vitality Index**\n\
    \     - Key talent mobility rate;\n     - Key talent turnover rate;\n     - Key\
    \ talent promotion success rate;\n     - High-performer retention rate;\n    \
    \ - Successor readiness.\n\nOf course, enterprises exhibit different states at\
    \ different development stages, and the corresponding influencing dimensions and\
    \ indicators of organizational effectiveness will also differ. Even within an\
    \ enterprise, different business forms are on different development curves (such\
    \ as the first curve, second curve, third curve) and will have many differences.\
    \ As the enterprise develops, data accumulation will become more and more abundant,\
    \ and insights into organizational effectiveness will become closer to the truth.\n\
    \nGenerally speaking, as the degree of data accumulation increases, `HR` practitioners\
    \ can use the following three measures to evaluate organizational effectiveness.\n\
    \n- **Monitor**. When data is mainly structured information, `HR` practitioners\
    \ can monitor the effectiveness status of operations, management, organization,\
    \ and human resources in a timely manner through data-driven methods.\n- **Diagnose**.\
    \ When data accumulates to a certain extent, `HR` practitioners can set normal\
    \ ranges and warning zones for each indicator based on strategic goals. Once problems\
    \ arise, early warnings can be issued and targeted handling can be performed.\n\
    - **Insight**. After long-term data accumulation, `HR` practitioners will discover\
    \ a large amount of valuable unstructured data. Through analysis and comparison,\
    \ `HR` practitioners can discover many hidden problems in organizational effectiveness\
    \ from the data, thereby identifying driving factors and conducting targeted improvements\
    \ and overall linkage.\n\n# Chapter 7 The Three-Pillar Model in the AI Era\n\n\
    ## Section 1 Changes and Roles of the Three Pillars in the AI Era\n\n### 1. HR\
    \ Transformation\n\nWhy do enterprises need HR transformation? Because `HRBP`\
    \ (Human Resource Business Partner) transactional work occupies too much of their\
    \ time and energy, while the time and energy they invest in becoming strategic\
    \ partners and conducting internal client consulting is far from enough, and the\
    \ business value created is far lower than management's expectations.\n\nAccording\
    \ to research report analysis (as shown in Figure 7-1), the current status of\
    \ HR management in most enterprises is: `HR` practitioners put most of their energy\
    \ into basic work such as personnel services, which accounts for about 65% of\
    \ `HR` practitioners' total working time; the part with the greatest impact on\
    \ business, i.e., strategic HR planning activities, accounts for only about 10%;\
    \ the part that exerts the maximum value of HR, i.e., customer service and internal\
    \ consulting, accounts for only about 25%.\n\n![](img/cutq_181_56733_l.jpg)\n\n\
    Figure 7-1 Schematic Diagram of Research Report on Proportion of HR Management\
    \ Work Content\n\nThe role of the HR Business Partner is so important, yet `HR`\
    \ practitioners do not have more time to invest in this work. This is the main\
    \ reason for the low effectiveness of the strategic partner role. To solve this\
    \ problem, enterprises need to carry out HR transformation.\n\nThe goal of HR\
    \ transformation is to transform the architecture of HR management—which has high\
    \ costs, functional redundancy, and excessive transactional work—into an organizational\
    \ architecture that is transactional, professional, and strategic. That is, on\
    \ the premise of ensuring accurate and effective personnel services, through responsibility\
    \ clarification, restructuring, and technical means, reduce the workload and personnel\
    \ input of personnel services to 20%, increase the investment in strategic HR\
    \ planning to 20%, and strengthen the investment in customer service and internal\
    \ consulting to 60%, to enhance the professionalism and value of `HRBP`.\n\nThe\
    \ enterprise's attention to the HR department is positively correlated with its\
    \ development speed. In enterprises in the rapid development stage, over 60% of\
    \ managers believe that the HR department is a resource management center and\
    \ a human capital center, possessing indispensable strategic functions, and `HRBP`\
    \ can exert great value. The emergence of the HR Three Pillars will accelerate\
    \ HR transformation and highlight the value of HR.\n\n### 2. The Three Pillars\n\
    \n#### 1. Traditional Three Pillars\n\nThe concept of the HR Three Pillars model\
    \ was proposed by Dave Ulrich in 1997, namely the HR Center of Expertise (HR COE),\
    \ HR Business Partner (HRBP), and HR Shared Service Center (HRSSC). The specific\
    \ work of the Three Pillars and their mutual relationships are shown in Figure\
    \ 7-2.\n\nThe HR Center of Expertise (`HR COE`) refers to HR experts proficient\
    \ in a certain field, mainly providing professional HR consulting and solutions\
    \ to business departments. Within the enterprise, `HR COE` usually includes functions\
    \ such as Compensation & Benefits (`C&B`), Organization Development (`OD`), Talent\
    \ Development (`TD`), Learning & Development (`LD`), Organizational Culture (`OC`),\
    \ Recruitment (policy and mechanism part), and Systems (`HRIS`).\n\n![](img/cutq_183_6429_l.jpg)\n\
    \nFigure 7-2 Specific Work of HR Three Pillars and Their Mutual Relationships\n\
    \n`HR COE` acts as the steering wheel, traffic light, and gas station for the\
    \ enterprise's HR management.\n\n- **Steering Wheel**. As experts and designers\
    \ in the HR field, `HR COE` is mainly responsible for using professional knowledge\
    \ to enhance the professional capabilities of `HR` practitioners, formulating\
    \ HR management policies, mechanisms, and processes, and continuously improving\
    \ their effectiveness.\n- **Traffic Light**. As a controller, `HR COE` is mainly\
    \ responsible for controlling the compliance of HR policies, mechanisms, and processes,\
    \ and controlling the enterprise's employment risks.\n- **Gas Station**. As a\
    \ technical expert, `HR COE` designs business solutions, templates, and tools,\
    \ providing HR technical support to `HRBP`, `HRSSC`, and business managers, guiding\
    \ them in carrying out HR management activities.\n\nThe HR Business Partner (`HRBP`)\
    \ is the bridge for communication between the HR department and heads/managers\
    \ of various business departments. `HRBP` must be familiar with the various functions\
    \ of the HR department and understand the needs of business departments; they\
    \ must help business departments better maintain employee relations, handle simpler\
    \ HR-related issues that frequently appear in business departments, and assist\
    \ business department heads/managers in better using various HR management systems\
    \ and tools.\n\n`HRBP` is the position in the HR department closest to business\
    \ departments. Enterprises configure the number of `HRBP` based on the service\
    \ ratio of `HRBP` to formal employees. In different organizations, the degree\
    \ of support from the HR department to business departments and the complexity\
    \ of business differ, so the `HRBP` service ratio also varies. In HR management\
    \ activities, `HRBP` mainly plays the following roles:\n\n- **Strategic Partner**:\
    \ Drive strategy execution in organizational and talent strategy, core value inheritance;\n\
    - **Solution Integrator**: Integrate `HR COE` designs to become business-oriented\
    \ solutions;\n- **HR Process Executor**: Promote HR management processes, support\
    \ personnel management decisions;\n- **Change Agent**: Play the role of a change\
    \ catalyst;\n- **Relationship Manager**: Effectively manage employee relations.\n\
    \nThe HR Shared Service Center (`HRSSC`) is responsible for uniformly handling\
    \ all basic and transactional work related to HR management from various business\
    \ departments within the enterprise, such as compensation and benefits calculation\
    \ and disbursement, social insurance management, personnel file management, personnel\
    \ information service management, labor contract management, employee recruitment,\
    \ new employee training, employee complaint and suggestion handling, consulting\
    \ services, etc.\n\n`HRSSC` is the provider of standard HR services, responsible\
    \ for ensuring consistency in service delivery, providing standardized and process-oriented\
    \ services to the enterprise and employees, releasing HR managers and specialists\
    \ from complicated transactional work, and improving the overall service efficiency\
    \ of the HR department. `HRSSC` usually plays the following roles:\n\n- **Employee\
    \ Self-Service Center**: Support service requests initiated by employees and managers;\n\
    - **HR Process Transaction Center**: Support the administrative transaction parts\
    \ of main processes initiated by `HR COE` (such as payroll, recruitment, training\
    \ administration);\n- **HRSSC Operations Management Center**: Provide quality,\
    \ internal control, data, technology (including self-service), and vendor management\
    \ support.\n\n#### 2. Three Pillars Case Sharing: Tencent `HRSDC` Upgrade Path\n\
    \n##### (1) Core Elements Leveraging Tencent `SSC` Upgrade to `SDC`\n\nAfter more\
    \ than five years of exploration, Tencent's HR Shared Service Center has transformed\
    \ into the HR Shared Delivery Center (`SDC`). This change conforms to the changes\
    \ of the times and the iteration of industry background. Most importantly, Tencent's\
    \ HR Shared Service Center discovered that the business departments' demands on\
    \ them and the HR department had begun to change.\n\nFirst, business needs have\
    \ changed from early stability demands to variability demands, with business departments\
    \ emphasizing flexibility in HR management.\n\nSecond, employees' new needs for\
    \ personalization and self-management require the HR Shared Service Center to\
    \ study human nature and manage hearts. Returning to human nature and transforming\
    \ towards the direction of managing hearts is the foundation of HR management.\n\
    \nThird, changes in the information and intelligence era. Employees' use of tools\
    \ has begun to change from `PC` desktop to multi-terminal.\n\nFourth, the HR department's\
    \ front-end strategy can match the company's strategy, and at the same time, the\
    \ HR department can support multi-terminal life development cycles and business\
    \ development cycles.\n\nFor example, Tencent has extensive business lines. Beijing\
    \ company employees mostly engage in online media and video work, while Shenzhen\
    \ company employees engage in game-related work. Under multiple business states\
    \ and models, how the HR department can adapt to business department needs and\
    \ quickly provide one-stop solutions is the main reason for the birth of Tencent's\
    \ `SDC` model. The company hopes `SDC` can do a good job in support from the perspective\
    \ of connecting `HR COE` and the entire operations center.\n\n##### (2) Differences\
    \ Between Tencent `SDC` and Traditional `SSC`\n\nIf `HRSSC` is 1.0, then Tencent's\
    \ `SDC` is 2.0. `SDC` has developed from a state of passively waiting and undertaking\
    \ matters to being able to proactively initiate delivery-oriented demands and\
    \ proactively deliver services, realizing needs through delivery standards and\
    \ delivery appeals. Therefore, `SDC` is more about connecting the needs of `HR\
    \ COE` and `HRBP`, as shown in Figure 7-3.\n\n![](img/cutq_186_18776_l.jpg)\n\n\
    Figure 7-3 SDC Connecting HR COE and HRBP Needs\n\nIn some enterprises, many `HR\
    \ COE` find it hard to float up, `HRBP` finds it hard to sink down, and `HRSSC`\
    \ work gets mixed up. If this part of the work cannot be made intensive and modular,\
    \ `HR COE` will find it hard to play the role of the \"corporate brain\" and cannot\
    \ judge what strategic layout HR managers should make for the company's future\
    \ strategic development. Similarly, if it cannot be well centralized to the back\
    \ end, `HRBP` on various business lines will find it hard to quickly and actively\
    \ influence different business groups, because `HRBP` lacks the strength to see\
    \ deeper into business departments. So, `SDC` must be able to establish an HR\
    \ Solution Center in these aspects. This is what Tencent is currently doing.\n\
    \n##### (3) Future Development Direction and Challenges of `SDC`\n\nTencent's\
    \ `SDC` will become an integrated HR delivery platform that can provide stable,\
    \ reliable, and trusted HR services to employees. To achieve this vision, Tencent\
    \ also faces many challenges. For example, where are the people who can truly\
    \ do `SDC` work, how to quantify `SDC`'s contribution to the company's organizational\
    \ effectiveness, and how to achieve twice the result with half the effort.\n\n\
    ### 3. Reshaping the Three Pillars\n\nWith the continuous application of AI technology\
    \ and big data analysis in various fields of HR management, this influence will\
    \ reshape the HR Three Pillars, thereby accelerating the iteration and evolution\
    \ of \"Organization, Talent, Culture\". So, what are the differences in the reshaped\
    \ Three Pillars? The specific changes and their mutual relationships are shown\
    \ in Figure 7-4.\n\n![](img/cutq_187_29387_l.jpg)\n\nFigure 7-4 Reshaped HR Three\
    \ Pillars + `AI`\n\n#### 1. `HRSSC` + `AI`\n\nThe `AI`-empowered `HRSSC` has obvious\
    \ competitive advantages in the following aspects.\n\n##### Employee Experience\n\
    \nThe reshaped HR Three Pillars have significantly improved in terms of employee\
    \ experience.\n\nEmployee experience refers to the collection of good or bad things\
    \ encountered, felt, and heard by employees within the enterprise, covering a\
    \ complete life cycle before entry, during employment, and before/after departure.\
    \ During the entry, employment, and departure stages, employees will also experience\
    \ the aspiration phase, honeymoon phase, confusion phase, rising phase, maturity\
    \ phase, decline phase, restlessness phase, and nostalgia phase, as shown in Figure\
    \ 7-5.\n\n![](img/cutq_188_35430_l.jpg)\n\nFigure 7-5 Employee Experience and\
    \ Employee Life Cycle\n\nFor example, before entry, candidates are in the aspiration\
    \ phase. At this time, HR practitioners should start from \"how to attract\" candidates\
    \ to quickly \"join\", by outputting the employer brand image, allowing information\
    \ to be efficiently conveyed to candidates, or communicating with candidates through\
    \ intelligent customer service bots, pushing company promotional materials to\
    \ candidates in advance to deepen their understanding of the company. During entry,\
    \ HR practitioners can achieve instant onboarding through digital signatures,\
    \ Optical Character Recognition (`OCR`), Robotic Process Automation (`RPA`), and\
    \ other technologies, improving the onboarding experience. After entry, through\
    \ seamless attendance, employees can easily solve the embarrassment of failing\
    \ to clock in/out. Upon departure, the company gives postcards to employees, letting\
    \ them miss the company after leaving.\n\nWhat is seamless attendance? In the\
    \ past, attendance mostly used card swiping, fingerprint, facial recognition,\
    \ mobile attendance, and other methods. In the digital-intelligent era, the HR\
    \ department can deploy \"Three Reals\" (On-site, Actual Object, Actual Situation)\
    \ data collection devices, such as HD cameras, inspection robots, Near Field Communication\
    \ (`NFC`) devices, etc. Employees only need to enter the office area to be automatically\
    \ identified, without the action of \"clocking in\". Of course, the company must\
    \ sign an informed consent and confidentiality agreement with employees.\n\n#####\
    \ Design Thinking\n\nProduct design in the HR field needs to run through the full\
    \ life cycle of employee entry, employment, and departure, thinking and solving\
    \ problems from the starting point of caring for employee needs, improving processes,\
    \ and stimulating employee enthusiasm and self-drive. For example, Baidu designed\
    \ badges together with the cartoon \"Du Xiaoxiong\" (Degree Bear). Employees receive\
    \ a Degree Bear with a number on every work anniversary; the number represents\
    \ the years the employee has worked. There are also long service awards for 5\
    \ or 10 years. At the same time, on the employee's birthday, the company also\
    \ distributes Degree Bears with special significance. These colorful Degree Bears\
    \ lined up on the workstation greatly enhance the employee's pride, sense of belonging,\
    \ and sense of achievement in growing with the company.\n\nHR department work\
    \ is piled up from details. `HR` practitioners must be good at using design thinking\
    \ to improve employee experience, creating a great experience through little touches.\n\
    \n##### Product Thinking\n"
