- raw: "将这三个层面的应用概括起来，就是HR从业者可以在人力资源规划、招聘、员工学习与发展、绩效管理、薪酬与激励体系、员工福利与服务等方面，有效运用大数据思维与技术展开探索和实践；通过数据挖掘与建模分析，预测未来趋势，为人力资源决策提供辅助支持，有效体现大数据的价值。\n\
    \n进入大数据时代后，人们的思维方式也发生了根本性的变化。例如，过去，我们收集数据的形式都是采样，而现在，大数据选用的是全量数据：过去，采样时要求个体数据很精确，而现在，大数据可以接受混杂性，因为它更关注的是有效性；过去，数据分析的方式是事先提出一个因果假设，然后收集数据、通过分析来验证假设，而现在，大数据讲求的是从大量数据中找出相关关系。\n\
    \n客观地说，到今天为止，大数据的处理和分析技术仍处于“盲人摸象”的阶段。你可能摸到的是“腿”，他可能描述的是“鼻子”，虽然结果正确但都是局部，而不是全貌。随着大数据技术的不断进步和越来越多的活而全的数据源出现，人们探索到的内容将无限接近事实与真相。人们越能获得更深邃的智慧与洞察，就越能体现大数据真正的价值。\n\
    \n## [第三节　大数据指标体系与标签体系](../Text/contents.xhtml#b_111)\n\n### [一、数据在人力资源数据化管理中的五个作用](../Text/contents.xhtml#c_112)\n\
    \n人力资源数据化管理的核心是利用数据。数据化管理并非只是以数据体现结果，而是充分提高数据的利用率，让数据在监控、预测、预警等各个方面展示作用。具体来说，在人力资源数据化管理中，数据具备以下五个作用。\n\
    \n1.描述组织人力资源状态、组织和个人工作情况\n\n描述性数据在人力资源工作中的应用最为广泛，主要用来描述组织的人力资源状态、组织和个人的工作情况。它是对现实情况的一种客观描述，通过将实际数据与理论数据或多个实际数据进行对比，可对工作产生一定的指导意义。在HR从业者的各种总结汇报中，描述性数据占绝大部分，更有甚者会全部采用描述性数据。描述性数据一般采用绝对数值、平均值、百分比等，如企业员工总数、部门人员分布、员工结构情况、薪酬发放情况、招聘人数及分布、培训场次、培训人数、培训费用等。\n\
    \n2.体现组织和个人绩效情况\n\nHR从业者通过对比实际绩效与期待绩效的差距，实现绩效的持续性改进，提高组织和个人绩效。这一类数据多以百分比的形式出现，也会采用平均值、绝对数值的形式，如招聘完成率、平均培训学时、员工离职率、平均招聘周期等。\n\
    \n3.让数据发挥监测预警作用，及时改进工作\n\n让数据发挥作用，不仅是指利用数据反映过去和现在的工作情况，而且需要让数据发挥监测和预警作用，及时发现达到临界值的数据，促使人们及时调整工作。例如，数据可以监测费用的支出情况，让管理者随时调整开支；数据可以预测员工离职情况，让管理者随时调整用工对策，从内部查找原因，从外部寻找人才。\n\
    \n4.让数据的预测作用发挥出最佳效果\n\n数据预测是指通过对数据的分析、归纳，找出数据的规律性或关联性，为工作和决策提供有力的支持。人力资源管理工作中积累的数据越多，管理者就越有可能得到准确的预测。例如，为了达到明年的目标产值，管理者通过汇总历年生产车间的产值和员工人数，就可以预测出车间需要的员工人数；在数据足够丰富、多元的情况下，管理者可以通过绩效、考勤、日常工作表现等数据预测出员工的离职情况。\n\
    \n5.让数据体现效能效益\n\n企业人力资源管理工作的成效最终将落在人力成本的投入产出比上，这就需要人力资源部和财务部的三表连接，用于分析人均销售额、人均利润额、人事费用率、人工成本利润率等。与主观性、经验性的判断相比，数据化的结果可以让人力资源管理工作更加准确、清晰。\n\
    \n人力资源数据化管理就是管理者要综合使用多种数据，从个人数据到组织数据，从过去数据到未来预测，从静态数据到动态数据，等等。管理者可以按照不同周期检验人力资源数据化管理的工作成果，但必须随时关注数据动态，一旦发现问题就要及时纠正，要让数据真正参与到管理决策工作中来。\n\
    \n### [二、人力资源大数据的How](../Text/contents.xhtml#c_113)\n\n人力资源大数据可分为系统层、数据层、分析层、展示层（可视化层），如图8-15所示。\n\
    \n![](Images/cutq_241_42323_l.jpg)\n\n图8-15　人力资源大数据的四个层级\n\n1.系统层\n\n系统层是基础，是“入离升降调、选用育留管”的基础建设，如图8-16所示；也可以理解成数据收集层，数据埋点、信息收集、流程优化、系统迭代等都在该层实现。这就要求各个系统是互联互通的，数据是动态的端到端流转。事实上，百度除了Core\
    \ HR之外，还外挂了几十个自己开发的系统。这些系统之间怎么实现互联互通，数据怎样自动流转并确保是唯一的数据源，都是百度目前要解决的课题。同时，人力资源大数据平台还需要与相关的业务系统打通连接并进行数据交换；否则，这个平台上就只有人力资源管理数据，数据既不够完整，也无法帮助企业产生更大的效能，充其量就是做个参考而已。当然，目前很多公司的内部数据交流还是存在壁垒的，只有打破这些壁垒才能真正做到大数据分析。\n\
    \n![](Images/cutq_242_54771_l.jpg)\n\n图8-16　人力资源大数据平台的系统层\n\n2.数据层\n\n数据层包含对数据的清理、处理、提取、存储、标签化等。该层处理的数据既包含结构化数据，也包含大量的非结构化数据，如图8-17所示。\n\
    \n在数据加工的过程中，管理者会发现缺少了很多数据，这就需要反刍到系统完善优化上，一旦发现哪里需要埋点收集数据，就要该补的补、该建设的建设。所以，系统层与数据层是相辅相成的关系，系统沉淀数据，数据反刍系统迭代，两者螺旋上升、互相促进。\n\
    \n![](Images/cutq_243_1973_l.jpg)\n\n图8-17　人力资源大数据平台的数据层\n\n3.分析层\n\n分析层包含主题分析、自定义分析等，指标体系建设、模型建设也在此阶段完成。根据过去的数据，通过分析建模和机器学习，HR从业者就可以找出其中的关联关系，而不是像过去一样先假设再印证。HR从业者通过及时观察、分析今天的数据，及时调整模型，让数据真正发挥预测、预警的功能，为管理者制定决策提供可信的依据。\n\
    \n“才报”系统由人才管理、运营管理、组织效能、文化活力、舆情分析五大维度的200多个指标组成，涵盖了人和组织的分析维度及所有人力资源职能的衡量维度，如图8-18所示。其中，人才管理和运营管理的指标更多是涉及人力资源职能的分解，文化活力与舆情分析的指标则是利用大数据技术分析员工在工作、学习、生活、发展等层面的影响因素，组织效能则会通过一些组织发展工具提取不同业务团队的有关组织目标。\n\
    \n![](Images/cutq_244_10470_l.jpg)\n\n图8-18　“才报”系统的组成示例\n\n4.展示层（可视化层）\n\n本层主要为管理者（CXO、经理）、HR管理者（HRBP、HRCOE）提供给各种分析报表（如定制报表、组件化分析报表、基础报表）、用户画像（如人才画像、组织画像）、报告建议（如体检报告、诊断报告、辅助判断）等。例如，红绿灯仪表盘包括核心人才离职率、关键人才占比等；又如，通过播放器的形式动态展示调入调出、升降调转等图表。人才迁徙图可以展示人才的来源、人才的发展、人才的流失等场景。在人才发展层面还可以看到个人全景图，HR从业者可以对人才进行比较，分析每个人的特点和每个人完成绩效指标的情况。数据的预测功能包括关键人才的离职预测、核心人才的风险度预测、高绩效的趋势预测、团队健康度的评估与组织活力的趋势预警、团队协作趋势、舆情监控等，并能输出诊断报告。这些功能同时支持数据下钻，并能导出数据或可视化图形，用于二次加工与分析判断等。\n\
    \n### [三、人力资源大数据产品的发展变革](../Text/contents.xhtml#c_114)\n\n人力资源大数据产品已经历以下四个时代，如图8-19所示。\n\
    \n1.PC时代。基本采用商用套装软件，使用的是套装标准报表。\n\n2.PC互联网时代。标准报表也可以定制化，以满足业务多维度分析的要求。\n\n3.移动互联网时代。开始使用大数据技术分析、预测业务发展趋势，同时报表的可视化结果越来越有效，越来越能反映企业的业务发展现状与未来趋势。\n\
    \n4.AI时代。进入人工智能时代之后，用户画像、对话机器人、语音与图像识别等技术纷纷应用于人力资源管理领域，助力企业的业务发展实现更大跨越。\n\n![](Images/cutq_245_19835_l.jpg)\n\
    \n图8-19　人力资源大数据产品的发展变革\n\n数据主要服务于四类角色，一是高管，二是经理，三是员工，四是HR从业者，如图8-20所示。高管可以做到一图在手，人才信息尽在掌握；一表在手，使数据分析结果为决策建议提供参考。经理在业务一线无需投入太多的精力关注人员的日常管理工作，系统可以提供及时的服务，让流程、审批化繁为简。员工可以实现工作、学习、文化、生活四位一体，随时随地开展碎片化、游戏化学习，获得周到、温馨、便捷、有效的共享服务。HR从业者可以建立统一的工具知识库，打造有战斗力、创新性强的人力资源管理团队。\n\
    \n![](Images/cutq_246_25461_l.jpg)\n\n图8-20　数据服务的四类角色\n\n## [第四节　智慧HR平台架构](../Text/contents.xhtml#b_115)\n\
    \n### [一、智慧HR平台](../Text/contents.xhtml#c_116)\n\n人工智能技术对人力资源工作的最大贡献将是打造智慧HR平台。智慧HR平台一旦建成并付诸实施后，人力资源三支柱可能只剩下两支柱：其一是HRBP，他们与业务部门“并肩作战”；其二是HRCOE与HRSSC合二为一，形成强大的解决方案中心与服务保障中心，全方位支持员工、经理、管理层、HRBP等的工作。\n\
    \n智慧HR平台将融合所有人力资源专家与高级管理者的管理实践案例，通过建模与机器学习，逐步形成一个可调用的智慧知识库，替代初级的HRCOE，并帮助专家型的HRCOE、HRBP和管理者进行基础分析与判断。\n\
    \nHRBP将深入一线，借助各种人工智能设备采集信息，如利用语音识别技术整理谈话内容，并将信息反馈给智慧HR平台。该平台对已有信息进行运算加工后，再将分析后的信息反馈给HRBP，为HRBP采取后续行动提供依据。以作战部队的战术安排举例说明，通常前线作战时，由三个人组成一个小组，在这三个人中，有一个非常强的通信与分析专家（即HRCOE），随时与后台保持联系；另一个是武器和战斗专家（即HRBP），熟悉各种武器及战况；最后一个是救生救援和后勤保障专家（即HRSSC）。这个小组空降到目的地之后，将调用无人机进行实地侦察或现场摸排，通信专家把现场的所有情况及临时判断信息传回后台，呼叫后台发射一枚导弹除掉山头的据点，或呼叫后台空投合适的武器装备。这就要求该作战部队的后台分析与指挥系统非常强大。智慧HR平台就是这个“后台”。智慧HR平台可以让听得见炮火的人的指挥更加有效，如图8-21所示。\n\
    \n![](Images/cutq_248_32900_l.jpg)\n\n图8-21　智慧HR平台的作用\n\n要想实现以上愿景，智慧HR平台就必须有强大的数字化技术作为支撑，同时企业移动化的整体水平需要达到一定的程度。目前，最大的困难还是数据，首先是数据量远远不够，而人工智能只有借助足够多的数据才能发挥威力；其次，数据须来源于各种设备的无感知采集，这部分的难点还是挺多的；最后，如何让数据发挥作用和价值，也是人力资源管理者下一步的重点工作。\n\
    \n这是一个多变、不确定、未知的时代，面对复杂的场景，智慧HR平台不仅需要有强大的实时分析后台作为支撑，人力资源管理者也要不断进步、适应变化，与时代同行，创造出更大的价值。\n\
    \n### [二、智慧HR平台实现路径解码](../Text/contents.xhtml#c_117)\n\n1.智慧HR平台的整体规划与实现路径\n\n\
    人力资源业务战略规划一般由企业的使命（Mission）、愿景（Vision）、价值观（Values），即通常所说的MVV推导而来，再经过对组织、人才、文化三个方面的布局，落实各自的组织项目、人才项目及文化项目，完成从组织头部到腰部再到腿部的全面贯通。人力资源数字化规划需要在企业政策、制度、规范的指引下，整体把控流程、系统、数据，并实现客户价值，从而助力人力资源战略目标的实现。\n\
    \n很多企业的人力资源部也有自己的使命、愿景、价值观，根据MVV可以推导出人力资源战略（Strategy），同时人力资源战略也会承接企业战略。人力资源战略由两部分组成：一是从企业战略分解而来的战略；二是由人力资源部的MVV推导而来的战略，主要内容涵盖了组织、人才、文化、领导力和系统五大方向。人力资源战略还可以推导出人力资源的政策、机制和规范。\n\
    \n流程、系统、数据、体验是人力资源数字化、智能化的四大维度，四者互相关联、缺一不可。流程梳理包括“入离升降调”，系统建设辐射“选用育留管”。有了流程和系统，再上层就是数据平台沉淀的数据，包括数据模型、指标体系、管理场景，从而形成人才画像、组织画像、分析诊断、预警预测、辅助判断。\n\
    \n智慧HR平台的客户是决策层、经理层、员工、HR从业者，最后是确立核心目标，即实现人力资源数智化。赋能管理者、提升用户体验也是智慧HR平台的价值所在。\n\
    \n实现人力资源“四化”的完整路径，如图8-22所示。\n\n![](Images/cutq_250_45785_l.jpg)\n\n图8-22　实现人力资源“四化”的路径\n\
    \n2.自主研发DHR平台的挑战和破局\n\n企业是否需要自主研发DHR平台一直是个颇受争议的话题。随着业务的扩展及未来产业的开拓，企业朝着集团化、全球化、多业态的方向发展，扩大自主研发的力量已成为必然，如图8-23所示。\n\
    \n![](Images/cutq_250_51608_l.jpg)\n\n图8-23　自主研发DHR平台的挑战\n\n企业在DHR的自主研发方面，应摸清变与不变的关系，把握不变的底层逻辑，在可变的层面做好探索，如图8-24所示。在系统自主研发的尝试过程中，各个系统之间容易形成“数据孤岛”。要想避免出现“烟囱建设”，企业可在顶层设计阶段提前进行数据集成平台的规划，并有意识地进行公共服务的提炼，在代码层面不断沉淀可复用组件，并搭载智能门户入口、数据治理机制和安全管理机制，从底层架构层面消除“烟囱”，形成一个个敏捷高效的微服务、轻应用。\n\
    \n![](Images/cutq_251_57724_l.jpg)\n\n图8-24　DHR平台自研的破局\n\n3.数字化人才的画像\n\n数字战略，人才先行。那么，在人力资源数字化转型的进程中，具有哪些特质的数字化人才才是推动企业DHR平台建设的加速引擎呢？数字化人才的核心技能是同时掌握技术和业务，并兼具数据分析、用户体验和产品思维等能力，如图8-25所示。\n\
    \n![](Images/cutq_252_2421_m.jpg)\n\n图8-25　数字化人才的画像\n\n# [致谢](../Text/contents.xhtml#z_14)\n\
    \n本书的写作历时将近三年，虽然利用假期时间码字异常辛苦，但是我非常想把这本书写出来。因为这本书既是我对过去的工作实践进行的梳理与沉淀，也是我对HR数智化的未来方向与实现路径的思考。如果这本书能给同仁们带来一点点帮助与启发，我就感到非常欣慰了。\n\
    \n在这本书写作的过程中，老师们、朋友们的鼓励与帮助，以及家人的支持让我可以坚持下来。\n\n首先，我要感谢百度公司以及曾经一起战斗的同事们。在百度八年半的时光里，我们一起经历了线上化、信息化、数字化、智慧化四个阶段，不断探索前沿与应用新技术。2014年，我们开始探索大数据技术在人力资源领域的应用；2016年，我们开始探索人工智能在人力资源领域的应用；2017年，我们提炼形成了“四化模型”。在不同的时期，我们打造了很多的经典产品。在此过程中，百度公司的领导、同事都给予了很多无私的指导、帮助与支持，当然还有批评。这都让我受益匪浅，并激励我在数智化的道路上不断成长与进步。在此感谢刘辉、郑绍辉、伍晖、刘建利、樊效、崔芳、徐涓涓、杨洋、何义情、尹亚林、田雅琳、赵宇红、王海波、刘波、王贝、海学森、王文钰、代玲玲、岳莹、任君欣、刘长江、梁硕、谢庚曦、孙一丁等！还有百度公司的新领导、新同事对我的无私关怀与支持，鼓励我继续砥砺前行，感谢崔姗姗、胡曲、肖美阳、许湛冰、张晓晨、孙英丽、石鹤、杜伟等。当然，尤其要感谢的是百度人才智库的熊辉教授、祝恒书博士，在智能化创新研讨与实践中给了我不少的指导、火花与脑力激荡，使我在思想上不断迭代与进化。在此我还要隆重感谢曾一起战斗的合作部门的领导与战友们：李震宇、李涛、陈尚义、顾延、宫雪峰、陈立艳、涂洁、冯俊辉、刘海清、杨鹤、刘勇、张晓亮、贾彦萍、李虹、杨双华、程飞、郭琦、张琦、刘蔚、周雁晨、韩志刚等，谢谢你们！\n\
    \n其次，我要感谢滴滴出行的领导柳青、王艳萍、蔡晓鸥、李淼等对我的充分信任与无私支持，让我操刀规划滴滴版“四化模型”并取得第一阶段的胜利。滴滴出行的工作经历让我继续夯实了业务架构、产品架构、数据架构和技术架构，同时在国际化、产品化、商业化方面积累并沉淀了更多的思考与方法，感谢HR与EP的伙伴们，你们是我永远的朋友。\n\
    \n再次，我要感谢中国人力资源开发研究会智能分会“五人谈”的老师们：刘辉会长、彭剑锋教授、熊辉教授、李直秘书长、祝恒书博士与主持人李蔚，与智者为伍，让我迎接挑战、加速前行。\n\
    \n我还要感谢一下原中国人事科学研究院院长兼人事与人才研究所所长王通讯教授，他在百忙之中不仅为本书写序，而且平时对我不时指导、不吝赐教。我还要感谢“王通讯人才工作室”的特聘专家蒋北麒、胡明、王爱敏、黄秋钧，还有天津大学的潘静洲副教授、国防科技大学的王涛副教授，我们经常在电话里探讨数字化、智能化，你们是我的良师益友，坚定了我在数智化之路上不断探索的信心。\n\
    \n最后，我要感谢从事人力资源数智化并始终在坚守的伙伴们，尤其是DHR公会里的朋友们：申刚正、张东超、李想、李强、彭亦周、彭传军、曹星、江莹、张伟峰等，我们像家人一样，一起交流、互相分享、共同提高，让人力资源数智化的未来之路不再孤单，并充满无限想象。\n\
    \n王崇良  \n\n2021年8月\n\n# [参考文献](../Text/contents.xhtml#z_15)\n\n1.王爱敏，王崇良，黄秋钧。人力资源大数据应用实践-模型、技术、应用场景。北京：清华大学出版社，2017.\n\
    \n2.熊辉，祝恒书。百度人才智库-大数据智能化人才管理.\n\n3.彭剑锋。人力资源管理概论（第三版）。上海：复旦大学出版社，2018.\n\n4.彭剑锋，张建国。经营者思维—赢在战略人力资源管理。北京：中国人民大学出版社，2019.\n\
    \n5.陈春花，朱丽。协同：数字化时代组织效率的本质。北京：机械工业出版社，2019.\n\n6.吉恩·保罗·艾森，杰西·S.哈里奥特著。胡明，邱黎源，徐建军译。人力资源管理大数据：改变你吸引、猎取、培养和留住人才的方式，北京：机械工业出版社，2017.\n\
    \n7.戴维·尤里奇著。孙冰，范海鸿译。赢在组织：从人才争夺到组织发展.北京：机械工业出版社，2019."
  fmt: "\n将这三个层面的应用概括起来，就是`HR从业者`可以在人力资源规划、招聘、员工学习与发展、绩效管理、薪酬与激励体系、员工福利与服务等方面，有效运用大数据思维与技术展开探索和实践；通过数据挖掘与建模分析，预测未来趋势，为人力资源决策提供辅助支持，有效体现大数据的价值。\n\
    \n进入大数据时代后，人们的思维方式也发生了根本性的变化。例如，过去我们收集数据的形式都是采样，而现在大数据选用的是全量数据；过去采样时要求个体数据很精确，而现在大数据可以接受混杂性，因为它更关注的是有效性；过去数据分析的方式是事先提出一个因果假设，然后收集数据、通过分析来验证假设，而现在大数据讲求的是从大量数据中找出相关关系。\n\
    \n客观地说，到今天为止，大数据的处理和分析技术仍处于“盲人摸象”的阶段。你可能摸到的是“腿”，他可能描述的是“鼻子”，虽然结果正确但都是局部，而不是全貌。随着大数据技术的不断进步和越来越多的活而全的数据源出现，人们探索到的内容将无限接近事实与真相。人们越能获得更深邃的智慧与洞察，就越能体现大数据真正的价值。\n\
    \n## [第三节　大数据指标体系与标签体系](../Text/contents.xhtml#b_111)\n\n### [一、数据在人力资源数据化管理中的五个作用](../Text/contents.xhtml#c_112)\n\
    \n人力资源数据化管理的核心是利用数据。数据化管理并非只是以数据体现结果，而是充分提高数据的利用率，让数据在监控、预测、预警等各个方面展示作用。具体来说，在人力资源数据化管理中，数据具备以下五个作用。\n\
    \n1. **描述组织人力资源状态、组织和个人工作情况**\n\n   描述性数据在人力资源工作中的应用最为广泛，主要用来描述组织的人力资源状态、组织和个人的工作情况。它是对现实情况的一种客观描述，通过将实际数据与理论数据或多个实际数据进行对比，可对工作产生一定的指导意义。在`HR从业者`的各种总结汇报中，描述性数据占绝大部分，更有甚者会全部采用描述性数据。描述性数据一般采用绝对数值、平均值、百分比等，如企业员工总数、部门人员分布、员工结构情况、薪酬发放情况、招聘人数及分布、培训场次、培训人数、培训费用等。\n\
    \n2. **体现组织和个人绩效情况**\n\n   `HR从业者`通过对比实际绩效与期待绩效的差距，实现绩效的持续性改进，提高组织和个人绩效。这一类数据多以百分比的形式出现，也会采用平均值、绝对数值的形式，如招聘完成率、平均培训学时、员工离职率、平均招聘周期等。\n\
    \n3. **让数据发挥监测预警作用，及时改进工作**\n\n   让数据发挥作用，不仅是指利用数据反映过去和现在的工作情况，而且需要让数据发挥监测和预警作用，及时发现达到临界值的数据，促使人们及时调整工作。例如，数据可以监测费用的支出情况，让管理者随时调整开支；数据可以预测员工离职情况，让管理者随时调整用工对策，从内部查找原因，从外部寻找人才。\n\
    \n4. **让数据的预测作用发挥出最佳效果**\n\n   数据预测是指通过对数据的分析、归纳，找出数据的规律性或关联性，为工作和决策提供有力的支持。人力资源管理工作中积累的数据越多，管理者就越有可能得到准确的预测。例如，为了达到明年的目标产值，管理者通过汇总历年生产车间的产值和员工人数，就可以预测出车间需要的员工人数；在数据足够丰富、多元的情况下，管理者可以通过绩效、考勤、日常工作表现等数据预测出员工的离职情况。\n\
    \n5. **让数据体现效能效益**\n\n   企业人力资源管理工作的成效最终将落在人力成本的投入产出比上，这就需要人力资源部和财务部的三表连接，用于分析人均销售额、人均利润额、人事费用率、人工成本利润率等。与主观性、经验性的判断相比，数据化的结果可以让人力资源管理工作更加准确、清晰。\n\
    \n人力资源数据化管理就是管理者要综合使用多种数据，从个人数据到组织数据，从过去数据到未来预测，从静态数据到动态数据，等等。管理者可以按照不同周期检验人力资源数据化管理的工作成果，但必须随时关注数据动态，一旦发现问题就要及时纠正，要让数据真正参与到管理决策工作中来。\n\
    \n### [二、人力资源大数据的How](../Text/contents.xhtml#c_113)\n\n人力资源大数据可分为系统层、数据层、分析层、展示层（可视化层），如图8-15所示。\n\
    \n![](Images/cutq_241_42323_l.jpg)\n\n图8-15　人力资源大数据的四个层级\n\n#### 1. 系统层\n\n系统层是基础，是“入离升降调、选用育留管”的基础建设，如图8-16所示；也可以理解成数据收集层，`数据埋点`、信息收集、流程优化、系统迭代等都在该层实现。这就要求各个系统是互联互通的，数据是动态的`端到端`流转。事实上，百度除了`Core\
    \ HR`之外，还外挂了几十个自己开发的系统。这些系统之间怎么实现互联互通，数据怎样自动流转并确保是唯一的数据源，都是百度目前要解决的课题。同时，人力资源大数据平台还需要与相关的业务系统打通连接并进行数据交换；否则，这个平台上就只有人力资源管理数据，数据既不够完整，也无法帮助企业产生更大的效能，充其量就是做个参考而已。当然，目前很多公司的内部数据交流还是存在壁垒的，只有打破这些壁垒才能真正做到大数据分析。\n\
    \n![](Images/cutq_242_54771_l.jpg)\n\n图8-16　人力资源大数据平台的系统层\n\n#### 2. 数据层\n\n数据层包含对数据的清理、处理、提取、存储、标签化等。该层处理的数据既包含结构化数据，也包含大量的非结构化数据，如图8-17所示。\n\
    \n在数据加工的过程中，管理者会发现缺少了很多数据，这就需要反刍到系统完善优化上，一旦发现哪里需要`数据埋点`收集数据，就要该补的补、该建设的建设。所以，系统层与数据层是相辅相成的关系，系统沉淀数据，数据反刍系统迭代，两者螺旋上升、互相促进。\n\
    \n![](Images/cutq_243_1973_l.jpg)\n\n图8-17　人力资源大数据平台的数据层\n\n#### 3. 分析层\n\n分析层包含主题分析、自定义分析等，指标体系建设、模型建设也在此阶段完成。根据过去的数据，通过分析建模和机器学习，`HR从业者`就可以找出其中的关联关系，而不是像过去一样先假设再印证。`HR从业者`通过及时观察、分析今天的数据，及时调整模型，让数据真正发挥预测、预警的功能，为管理者制定决策提供可信的依据。\n\
    \n“`才报`”系统由人才管理、运营管理、组织效能、文化活力、舆情分析五大维度的200多个指标组成，涵盖了人和组织的分析维度及所有人力资源职能的衡量维度，如图8-18所示。其中，人才管理和运营管理的指标更多是涉及人力资源职能的分解，文化活力与舆情分析的指标则是利用大数据技术分析员工在工作、学习、生活、发展等层面的影响因素，组织效能则会通过一些组织发展工具提取不同业务团队的有关组织目标。\n\
    \n![](Images/cutq_244_10470_l.jpg)\n\n图8-18　“`才报`”系统的组成示例\n\n#### 4. 展示层（可视化层）\n\
    \n本层主要为管理者（`CXO`、经理）、`HR`管理者（`HRBP`、`HRCOE`）提供各种分析报表（如定制报表、组件化分析报表、基础报表）、用户画像（如人才画像、组织画像）、报告建议（如体检报告、诊断报告、辅助判断）等。例如，红绿灯仪表盘包括核心人才离职率、关键人才占比等；又如，通过播放器的形式动态展示调入调出、升降调转等图表。人才迁徙图可以展示人才的来源、人才的发展、人才的流失等场景。在人才发展层面还可以看到个人全景图，`HR从业者`可以对人才进行比较，分析每个人的特点和每个人完成绩效指标的情况。数据的预测功能包括关键人才的离职预测、核心人才的风险度预测、高绩效的趋势预测、团队健康度的评估与组织活力的趋势预警、团队协作趋势、舆情监控等，并能输出诊断报告。这些功能同时支持数据下钻，并能导出数据或可视化图形，用于二次加工与分析判断等。\n\
    \n### [三、人力资源大数据产品的发展变革](../Text/contents.xhtml#c_114)\n\n人力资源大数据产品已经历以下四个时代，如图8-19所示。\n\
    \n1. `PC`时代。基本采用商用套装软件，使用的是套装标准报表。\n2. `PC`互联网时代。标准报表也可以定制化，以满足业务多维度分析的要求。\n3.\
    \ 移动互联网时代。开始使用大数据技术分析、预测业务发展趋势，同时报表的可视化结果越来越有效，越来越能反映企业的业务发展现状与未来趋势。\n4. `AI`时代。进入人工智能时代之后，用户画像、对话机器人、语音与图像识别等技术纷纷应用于人力资源管理领域，助力企业的业务发展实现更大跨越。\n\
    \n![](Images/cutq_245_19835_l.jpg)\n\n图8-19　人力资源大数据产品的发展变革\n\n数据主要服务于四类角色，一是高管，二是经理，三是员工，四是`HR从业者`，如图8-20所示。高管可以做到一图在手，人才信息尽在掌握；一表在手，使数据分析结果为决策建议提供参考。经理在业务一线无需投入太多的精力关注人员的日常管理工作，系统可以提供及时的服务，让流程、审批化繁为简。员工可以实现工作、学习、文化、生活四位一体，随时随地开展碎片化、游戏化学习，获得周到、温馨、便捷、有效的共享服务。`HR从业者`可以建立统一的工具知识库，打造有战斗力、创新性强的人力资源管理团队。\n\
    \n![](Images/cutq_246_25461_l.jpg)\n\n图8-20　数据服务的四类角色\n\n## [第四节　智慧HR平台架构](../Text/contents.xhtml#b_115)\n\
    \n### [一、智慧HR平台](../Text/contents.xhtml#c_116)\n\n人工智能技术对人力资源工作的最大贡献将是打造智慧HR平台。智慧HR平台一旦建成并付诸实施后，人力资源三支柱可能只剩下两支柱：其一是`HRBP`，他们与业务部门“并肩作战”；其二是`HRCOE`与`HRSSC`合二为一，形成强大的解决方案中心与服务保障中心，全方位支持员工、经理、管理层、`HRBP`等的工作。\n\
    \n智慧HR平台将融合所有人力资源专家与高级管理者的管理实践案例，通过建模与机器学习，逐步形成一个可调用的智慧知识库，替代初级的`HRCOE`，并帮助专家型的`HRCOE`、`HRBP`和管理者进行基础分析与判断。\n\
    \n`HRBP`将深入一线，借助各种人工智能设备采集信息，如利用语音识别技术整理谈话内容，并将信息反馈给智慧HR平台。该平台对已有信息进行运算加工后，再将分析后的信息反馈给`HRBP`，为`HRBP`采取后续行动提供依据。以作战部队的战术安排举例说明，通常前线作战时，由三个人组成一个小组，在这三个人中，有一个非常强的通信与分析专家（即`HRCOE`），随时与后台保持联系；另一个是武器和战斗专家（即`HRBP`），熟悉各种武器及战况；最后一个是救生救援和后勤保障专家（即`HRSSC`）。这个小组空降到目的地之后，将调用无人机进行实地侦察或现场摸排，通信专家把现场的所有情况及临时判断信息传回后台，呼叫后台发射一枚导弹除掉山头的据点，或呼叫后台空投合适的武器装备。这就要求该作战部队的后台分析与指挥系统非常强大。智慧HR平台就是这个“后台”。智慧HR平台可以让听得见炮火的人的指挥更加有效，如图8-21所示。\n\
    \n![](Images/cutq_248_32900_l.jpg)\n\n图8-21　智慧HR平台的作用\n\n要想实现以上愿景，智慧HR平台就必须有强大的数字化技术作为支撑，同时企业移动化的整体水平需要达到一定的程度。目前，最大的困难还是数据，首先是数据量远远不够，而人工智能只有借助足够多的数据才能发挥威力；其次，数据须来源于各种设备的`无感知采集`，这部分的难点还是挺多的；最后，如何让数据发挥作用和价值，也是人力资源管理者下一步的重点工作。\n\
    \n这是一个多变、不确定、未知的时代，面对复杂的场景，智慧HR平台不仅需要有强大的实时分析后台作为支撑，人力资源管理者也要不断进步、适应变化，与时代同行，创造出更大的价值。\n\
    \n### [二、智慧HR平台实现路径解码](../Text/contents.xhtml#c_117)\n\n#### 1. 智慧HR平台的整体规划与实现路径\n\
    \n人力资源业务战略规划一般由企业的使命（Mission）、愿景（Vision）、价值观（Values），即通常所说的`MVV`推导而来，再经过对组织、人才、文化三个方面的布局，落实各自的组织项目、人才项目及文化项目，完成从组织头部到腰部再到腿部的全面贯通。人力资源数字化规划需要在企业政策、制度、规范的指引下，整体把控流程、系统、数据，并实现客户价值，从而助力人力资源战略目标的实现。\n\
    \n很多企业的人力资源部也有自己的使命、愿景、价值观，根据`MVV`可以推导出人力资源战略（Strategy），同时人力资源战略也会承接企业战略。人力资源战略由两部分组成：一是从企业战略分解而来的战略；二是由人力资源部的`MVV`推导而来的战略，主要内容涵盖了组织、人才、文化、领导力和系统五大方向。人力资源战略还可以推导出人力资源的政策、机制和规范。\n\
    \n流程、系统、数据、体验是人力资源数字化、智能化的四大维度，四者互相关联、缺一不可。流程梳理包括“入离升降调”，系统建设辐射“选用育留管”。有了流程和系统，再上层就是数据平台沉淀的数据，包括数据模型、指标体系、管理场景，从而形成人才画像、组织画像、分析诊断、预警预测、辅助判断。\n\
    \n智慧HR平台的客户是决策层、经理层、员工、`HR从业者`，最后是确立核心目标，即实现人力资源数智化。赋能管理者、提升用户体验也是智慧HR平台的价值所在。\n\
    \n实现人力资源“四化”的完整路径，如图8-22所示。\n\n![](Images/cutq_250_45785_l.jpg)\n\n图8-22　实现人力资源“四化”的路径\n\
    \n#### 2. 自主研发`DHR平台`的挑战和破局\n\n企业是否需要自主研发`DHR平台`一直是个颇受争议的话题。随着业务的扩展及未来产业的开拓，企业朝着集团化、全球化、多业态的方向发展，扩大自主研发的力量已成为必然，如图8-23所示。\n\
    \n![](Images/cutq_250_51608_l.jpg)\n\n图8-23　自主研发`DHR平台`的挑战\n\n企业在`DHR`的自主研发方面，应摸清变与不变的关系，把握不变的底层逻辑，在可变的层面做好探索，如图8-24所示。在系统自主研发的尝试过程中，各个系统之间容易形成“`数据孤岛`”。要想避免出现“烟囱建设”，企业可在顶层设计阶段提前进行数据集成平台的规划，并有意识地进行公共服务的提炼，在代码层面不断沉淀可复用组件，并搭载智能门户入口、数据治理机制和安全管理机制，从底层架构层面消除“烟囱”，形成一个个敏捷高效的`微服务`、`轻应用`。\n\
    \n![](Images/cutq_251_57724_l.jpg)\n\n图8-24　`DHR平台`自研的破局\n\n#### 3. 数字化人才的画像\n\
    \n数字战略，人才先行。那么，在人力资源数字化转型的进程中，具有哪些特质的数字化人才才是推动企业`DHR平台`建设的加速引擎呢？数字化人才的核心技能是同时掌握技术和业务，并兼具数据分析、用户体验和产品思维等能力，如图8-25所示。\n\
    \n![](Images/cutq_252_2421_m.jpg)\n\n图8-25　数字化人才的画像\n\n# [致谢](../Text/contents.xhtml#z_14)\n\
    \n本书的写作历时将近三年，虽然利用假期时间码字异常辛苦，但是我非常想把这本书写出来。因为这本书既是我对过去的工作实践进行的梳理与沉淀，也是我对HR数智化的未来方向与实现路径的思考。如果这本书能给同仁们带来一点点帮助与启发，我就感到非常欣慰了。\n\
    \n在这本书写作的过程中，老师们、朋友们的鼓励与帮助，以及家人的支持让我可以坚持下来。\n\n首先，我要感谢百度公司以及曾经一起战斗的同事们。在百度八年半的时光里，我们一起经历了线上化、信息化、数字化、智慧化四个阶段，不断探索前沿与应用新技术。2014年，我们开始探索大数据技术在人力资源领域的应用；2016年，我们开始探索人工智能在人力资源领域的应用；2017年，我们提炼形成了“`四化模型`”。在不同的时期，我们打造了很多的经典产品。在此过程中，百度公司的领导、同事都给予了很多无私的指导、帮助与支持，当然还有批评。这都让我受益匪浅，并激励我在数智化的道路上不断成长与进步。在此感谢刘辉、郑绍辉、伍晖、刘建利、樊效、崔芳、徐涓涓、杨洋、何义情、尹亚林、田雅琳、赵宇红、王海波、刘波、王贝、海学森、王文钰、代玲玲、岳莹、任君欣、刘长江、梁硕、谢庚曦、孙一丁等！还有百度公司的新领导、新同事对我的无私关怀与支持，鼓励我继续砥砺前行，感谢崔姗姗、胡曲、肖美阳、许湛冰、张晓晨、孙英丽、石鹤、杜伟等。当然，尤其要感谢的是百度人才智库的熊辉教授、祝恒书博士，在智能化创新研讨与实践中给了我不少的指导、火花与脑力激荡，使我在思想上不断迭代与进化。在此我还要隆重感谢曾一起战斗的合作部门的领导与战友们：李震宇、李涛、陈尚义、顾延、宫雪峰、陈立艳、涂洁、冯俊辉、刘海清、杨鹤、刘勇、张晓亮、贾彦萍、李虹、杨双华、程飞、郭琦、张琦、刘蔚、周雁晨、韩志刚等，谢谢你们！\n\
    \n其次，我要感谢滴滴出行的领导柳青、王艳萍、蔡晓鸥、李淼等对我的充分信任与无私支持，让我操刀规划滴滴版“`四化模型`”并取得第一阶段的胜利。滴滴出行的工作经历让我继续夯实了业务架构、产品架构、数据架构和技术架构，同时在国际化、产品化、商业化方面积累并沉淀了更多的思考与方法，感谢HR与EP的伙伴们，你们是我永远的朋友。\n\
    \n再次，我要感谢中国人力资源开发研究会智能分会“五人谈”的老师们：刘辉会长、彭剑锋教授、熊辉教授、李直秘书长、祝恒书博士与主持人李蔚，与智者为伍，让我迎接挑战、加速前行。\n\
    \n我还要感谢一下原中国人事科学研究院院长兼人事与人才研究所所长王通讯教授，他在百忙之中不仅为本书写序，而且平时对我不时指导、不吝赐教。我还要感谢“王通讯人才工作室”的特聘专家蒋北麒、胡明、王爱敏、黄秋钧，还有天津大学的潘静洲副教授、国防科技大学的王涛副教授，我们经常在电话里探讨数字化、智能化，你们是我的良师益友，坚定了我在数智化之路上不断探索的信心。\n\
    \n最后，我要感谢从事人力资源数智化并始终在坚守的伙伴们，尤其是`DHR`公会里的朋友们：申刚正、张东超、李想、李强、彭亦周、彭传军、曹星、江莹、张伟峰等，我们像家人一样，一起交流、互相分享、共同提高，让人力资源数智化的未来之路不再孤单，并充满无限想象。\n\
    \n王崇良  \n\n2021年8月\n\n# [参考文献](../Text/contents.xhtml#z_15)\n\n1. 王爱敏，王崇良，黄秋钧。人力资源大数据应用实践-模型、技术、应用场景。北京：清华大学出版社，2017.\n\
    2. 熊辉，祝恒书。百度人才智库-大数据智能化人才管理.\n3. 彭剑锋。人力资源管理概论（第三版）。上海：复旦大学出版社，2018.\n4. 彭剑锋，张建国。经营者思维—赢在战略人力资源管理。北京：中国人民大学出版社，2019.\n\
    5. 陈春花，朱丽。协同：数字化时代组织效率的本质。北京：机械工业出版社，2019.\n6. 吉恩·保罗·艾森，杰西·S.哈里奥特著。胡明，邱黎源，徐建军译。人力资源管理大数据：改变你吸引、猎取、培养和留住人才的方式，北京：机械工业出版社，2017.\n\
    7. 戴维·尤里奇著。孙冰，范海鸿译。赢在组织：从人才争夺到组织发展.北京：机械工业出版社，2019.\n"
  trans: "\nSummarizing the application across these three levels means that `HR practitioners`\
    \ can effectively explore and practice the application of big data thinking and\
    \ technology in human resource planning, recruitment, employee learning and development,\
    \ performance management, compensation and incentive systems, employee benefits\
    \ and services, etc.; through data mining and modeling analysis, they can predict\
    \ future trends, provide auxiliary support for HR decision-making, and effectively\
    \ reflect the value of big data.\n\nUpon entering the big data era, people's thinking\
    \ patterns have also undergone fundamental changes. For example, in the past,\
    \ data collection took the form of sampling, whereas now big data uses full-volume\
    \ data; in the past, sampling required precise individual data, whereas now big\
    \ data can accept messiness because it focuses more on validity; in the past,\
    \ data analysis involved proposing a causal hypothesis first, then collecting\
    \ data and verifying the hypothesis through analysis, whereas now big data seeks\
    \ to discover correlations from massive amounts of data.\n\nObjectively speaking,\
    \ to this day, big data processing and analysis technology remains in the \"blind\
    \ men feeling an elephant\" stage. You might touch the \"leg,\" while he describes\
    \ the \"trunk\"; although the results are correct, they are all partial, not the\
    \ full picture. With the continuous advancement of big data technology and the\
    \ emergence of more and more living, complete data sources, the content explored\
    \ by people will infinitely approach facts and truth. The more people can obtain\
    \ deeper wisdom and insights, the more they can reflect the true value of big\
    \ data.\n\n## Section 3: Big Data Indicator System and Tag System\n\n### 1. Five\
    \ Roles of Data in Data-Driven HR Management\n\nThe core of data-driven HR management\
    \ lies in the utilization of data. Data-driven management is not merely about\
    \ reflecting results with data, but about fully improving data utilization rates,\
    \ allowing data to demonstrate its role in monitoring, prediction, early warning,\
    \ and other aspects. Specifically, in data-driven HR management, data serves the\
    \ following five roles.\n\n1. **Describe organizational HR status, organizational\
    \ and individual work situations**\n\n   Descriptive data is most widely used\
    \ in HR work, primarily to describe the organization's HR status, organizational\
    \ and individual work situations. It is an objective description of the actual\
    \ situation. By comparing actual data with theoretical data or comparing multiple\
    \ sets of actual data, it can provide certain guidance for work. In various summaries\
    \ and reports by `HR practitioners`, descriptive data accounts for the vast majority;\
    \ some even use descriptive data exclusively. Descriptive data generally uses\
    \ absolute values, averages, percentages, etc., such as total number of employees,\
    \ departmental personnel distribution, employee structure, salary disbursement,\
    \ recruitment numbers and distribution, training sessions, training participants,\
    \ training costs, etc.\n\n2. **Reflect organizational and individual performance\
    \ situations**\n\n   `HR practitioners` achieve continuous performance improvement\
    \ and enhance organizational and individual performance by comparing the gap between\
    \ actual performance and expected performance. This type of data often appears\
    \ in the form of percentages, but also uses averages and absolute values, such\
    \ as recruitment completion rate, average training hours, employee turnover rate,\
    \ average recruitment cycle, etc.\n\n3. **Enable data to play a monitoring and\
    \ early warning role, and improve work in a timely manner**\n\n   Enabling data\
    \ to function refers not only to using data to reflect past and present work situations\
    \ but also to leveraging its monitoring and early warning capabilities to promptly\
    \ identify data reaching critical thresholds, prompting timely work adjustments.\
    \ For example, data can monitor expense expenditures, allowing managers to adjust\
    \ spending at any time; data can predict employee turnover, allowing managers\
    \ to adjust employment strategies, find reasons internally, and seek talent externally.\n\
    \n4. **Maximize the predictive effect of data**\n\n   Data prediction refers to\
    \ analyzing and inducting data to find patterns or correlations, providing strong\
    \ support for work and decision-making. The more data accumulated in HR management,\
    \ the more likely managers are to obtain accurate predictions. For example, to\
    \ achieve next year's target output, managers can predict the number of employees\
    \ needed in the workshop by summarizing historical output and employee numbers;\
    \ with sufficiently rich and diverse data, managers can predict employee turnover\
    \ through performance, attendance, daily work performance, and other data.\n\n\
    5. **Enable data to reflect efficiency and effectiveness**\n\n   The ultimate\
    \ effectiveness of enterprise HR management falls on the input-output ratio of\
    \ human costs. This requires the connection of the \"three statements\" (financial\
    \ statements) between the HR and Finance departments to analyze revenue per capita,\
    \ profit per capita, personnel expense ratio, labor cost profit ratio, etc. Compared\
    \ with subjective and experience-based judgments, data-driven results can make\
    \ HR management more accurate and clear.\n\nData-driven HR management requires\
    \ managers to comprehensively use multiple types of data, from individual data\
    \ to organizational data, from past data to future predictions, from static data\
    \ to dynamic data, and so on. Managers can test the results of data-driven HR\
    \ management according to different cycles, but must pay attention to data dynamics\
    \ at all times; once problems are discovered, they must be corrected in time,\
    \ truly allowing data to participate in management decision-making.\n\n### 2.\
    \ The \"How\" of HR Big Data\n\nHR big data can be divided into the System Layer,\
    \ Data Layer, Analysis Layer, and Presentation Layer (Visualization Layer), as\
    \ shown in Figure 8-15.\n\n![](img/cutq_241_42323_l.jpg)\n\nFigure 8-15 Four Levels\
    \ of HR Big Data\n\n#### 1. System Layer\n\nThe system layer is the foundation,\
    \ the infrastructure for \"Entry, Exit, Promotion, Demotion, Transfer, Selection,\
    \ Utilization, Development, Retention, Management\" (HR lifecycle), as shown in\
    \ Figure 8-16; it can also be understood as the data collection layer. `Data tagging`\
    \ (tracking), information collection, process optimization, system iteration,\
    \ etc., are all realized at this layer. This requires all systems to be interconnected,\
    \ with data flowing dynamically `end-to-end`. In fact, besides `Core HR`, Baidu\
    \ has dozens of self-developed external systems. How to achieve interconnection\
    \ between these systems, how to automate data flow and ensure a single source\
    \ of truth are current challenges for Baidu. At the same time, the HR big data\
    \ platform needs to connect with relevant business systems for data exchange;\
    \ otherwise, the platform would only have HR management data, which would be neither\
    \ complete enough nor able to help the enterprise generate greater effectiveness,\
    \ serving at best as a reference. Of course, many companies currently have internal\
    \ data silos; only by breaking these barriers can true big data analysis be achieved.\n\
    \n![](img/cutq_242_54771_l.jpg)\n\nFigure 8-16 System Layer of HR Big Data Platform\n\
    \n#### 2. Data Layer\n\nThe data layer includes data cleaning, processing, extraction,\
    \ storage, tagging, etc. The data processed at this layer includes both structured\
    \ data and a large amount of unstructured data, as shown in Figure 8-17.\n\nDuring\
    \ data processing, managers will discover many missing data points, which requires\
    \ feeding back to system improvement and optimization. Once a need for `data tagging`\
    \ to collect data is identified, it must be supplemented or built accordingly.\
    \ Therefore, the system layer and data layer are mutually complementary: the system\
    \ precipitates data, and data feeds back into system iteration, spiraling upward\
    \ and promoting each other.\n\n![](img/cutq_243_1973_l.jpg)\n\nFigure 8-17 Data\
    \ Layer of HR Big Data Platform\n\n#### 3. Analysis Layer\n\nThe analysis layer\
    \ includes thematic analysis, self-service analysis, etc. Indicator system construction\
    \ and model construction are also completed at this stage. Based on past data,\
    \ through analytical modeling and machine learning, `HR practitioners` can discover\
    \ correlations, rather than hypothesizing first and verifying later as in the\
    \ past. By observing and analyzing today's data in a timely manner and adjusting\
    \ models promptly, `HR practitioners` can enable data to truly play its predictive\
    \ and early warning functions, providing a reliable basis for management decision-making.\n\
    \nThe \"`Talent Report`\" system consists of over 200 indicators across five dimensions:\
    \ Talent Management, Operational Management, Organizational Effectiveness, Cultural\
    \ Vitality, and Public Opinion Analysis. It covers analysis dimensions for people\
    \ and organizations and measurement dimensions for all HR functions, as shown\
    \ in Figure 8-18. Among them, indicators for Talent Management and Operational\
    \ Management mainly involve the decomposition of HR functions; indicators for\
    \ Cultural Vitality and Public Opinion Analysis utilize big data technology to\
    \ analyze influencing factors on employees in work, learning, life, and development;\
    \ Organizational Effectiveness extracts relevant organizational goals of different\
    \ business teams through organizational development tools.\n\n![](img/cutq_244_10470_l.jpg)\n\
    \nFigure 8-18 Example Composition of the \"`Talent Report`\" System\n\n#### 4.\
    \ Presentation Layer (Visualization Layer)\n\nThis layer mainly provides various\
    \ analytical reports (such as customized reports, component-based analytical reports,\
    \ basic reports), user portraits (such as talent portraits, organizational portraits),\
    \ and report recommendations (such as health check reports, diagnostic reports,\
    \ auxiliary judgments) for managers (`CXO`, Managers), HR managers (`HRBP`, `HRCOE`),\
    \ etc. For example, the traffic light dashboard includes core talent turnover\
    \ rate, key talent ratio, etc.; another example is dynamically displaying charts\
    \ of transfers, promotions/demotions, rotations, etc., in a player format. Talent\
    \ migration maps can display scenarios such as talent sources, talent development,\
    \ and talent loss. In terms of talent development, a personal panoramic view can\
    \ be seen, allowing `HR practitioners` to compare talents and analyze each individual's\
    \ characteristics and completion of performance indicators. Data prediction functions\
    \ include key talent turnover prediction, core talent risk prediction, high-performance\
    \ trend prediction, team health assessment and organizational vitality trend early\
    \ warning, team collaboration trends, public opinion monitoring, etc., and can\
    \ output diagnostic reports. These functions simultaneously support data drill-down\
    \ and can export data or visualization graphics for secondary processing, analysis,\
    \ and judgment.\n\n### 3. Evolution of HR Big Data Products\n\nHR big data products\
    \ have gone through the following four eras, as shown in Figure 8-19.\n\n1. `PC`\
    \ Era. Primarily used commercial off-the-shelf software suites, utilizing standard\
    \ suite reports.\n2. `PC` Internet Era. Standard reports could be customized to\
    \ meet multi-dimensional business analysis requirements.\n3. Mobile Internet Era.\
    \ Began using big data technology to analyze and predict business development\
    \ trends; simultaneously, report visualization results became increasingly effective,\
    \ increasingly reflecting the enterprise's current business status and future\
    \ trends.\n4. `AI` Era. Upon entering the AI era, technologies such as user portraits,\
    \ chatbots, voice and image recognition have been applied to the HR management\
    \ field, helping enterprises achieve greater leaps in business development.\n\n\
    ![](img/cutq_245_19835_l.jpg)\n\nFigure 8-19 Evolution of HR Big Data Products\n\
    \nData mainly serves four roles: executives, managers, employees, and `HR practitioners`,\
    \ as shown in Figure 8-20. Executives can have \"talent information at their fingertips\
    \ with one chart\" and \"decision references with one report.\" Managers on the\
    \ business frontline do not need to invest excessive energy in daily personnel\
    \ management; the system can provide timely services, simplifying processes and\
    \ approvals. Employees can achieve integration of work, learning, culture, and\
    \ life, conducting fragmented, gamified learning anytime, anywhere, and obtaining\
    \ thoughtful, warm, convenient, and effective shared services. `HR practitioners`\
    \ can establish a unified tool knowledge base, building a combative, highly innovative\
    \ HR management team.\n\n![](img/cutq_246_25461_l.jpg)\n\nFigure 8-20 Four Roles\
    \ Served by Data\n\n## Section 4: Smart HR Platform Architecture\n\n### 1. Smart\
    \ HR Platform\n\nThe greatest contribution of AI technology to HR work will be\
    \ the creation of a Smart HR Platform. Once the Smart HR Platform is built and\
    \ implemented, the HR Three Pillars may be reduced to Two Pillars: one is `HRBP`,\
    \ who \"fight shoulder to shoulder\" with business departments; the other is the\
    \ merger of `HRCOE` and `HRSSC` into a powerful Solution Center and Service Guarantee\
    \ Center, comprehensively supporting the work of employees, managers, management,\
    \ `HRBP`, etc.\n\nThe Smart HR Platform will integrate the management practice\
    \ cases of all HR experts and senior managers, gradually forming an callable wisdom\
    \ knowledge base through modeling and machine learning, replacing junior `HRCOE`,\
    \ and assisting expert `HRCOE`, `HRBP`, and managers in basic analysis and judgment.\n\
    \n`HRBP` will go deep into the frontline, using various AI devices to collect\
    \ information, such as organizing conversation content using voice recognition\
    \ technology, and feeding information back to the Smart HR Platform. The platform\
    \ processes and computes existing information, then feeds back analyzed information\
    \ to `HRBP`, providing a basis for subsequent actions. To illustrate with a tactical\
    \ arrangement of a combat unit: usually, during frontline combat, a team of three\
    \ is formed. Among them, there is a very strong communication and analysis expert\
    \ (i.e., `HRCOE`), maintaining constant contact with the rear; another is a weapons\
    \ and combat expert (i.e., `HRBP`), familiar with various weapons and battle situations;\
    \ the last is a rescue and logistics support expert (i.e., `HRSSC`). After this\
    \ team air-drops into the destination, they will call drones for on-site reconnaissance\
    \ or scouting. The communication expert transmits all on-site situations and temporary\
    \ judgments back to the rear, calling for a missile strike to eliminate a stronghold\
    \ on the hilltop, or calling for an airdrop of suitable weapons and equipment.\
    \ This requires the unit's rear analysis and command system to be very powerful.\
    \ The Smart HR Platform is this \"rear.\" The Smart HR Platform can make the command\
    \ of those \"who can hear the gunfire\" more effective, as shown in Figure 8-21.\n\
    \n![](img/cutq_248_32900_l.jpg)\n\nFigure 8-21 Role of the Smart HR Platform\n\
    \nTo realize the above vision, the Smart HR Platform must have strong digital\
    \ technology as support, and the enterprise's overall mobility level needs to\
    \ reach a certain degree. Currently, the biggest difficulty is still data: first,\
    \ the data volume is far from enough, and AI can only exert its power with sufficient\
    \ data; second, data must come from `imperceptible collection` by various devices,\
    \ which has many difficulties; finally, how to make data work and create value\
    \ is also the key focus for HR managers in the next step.\n\nThis is an era of\
    \ change, uncertainty, and the unknown. Facing complex scenarios, the Smart HR\
    \ Platform not only needs a powerful real-time analysis backend as support, but\
    \ HR managers must also continuously improve, adapt to changes, keep pace with\
    \ the times, and create greater value.\n\n### 2. Decoding the Implementation Path\
    \ of the Smart HR Platform\n\n#### 1. Overall Planning and Implementation Path\
    \ of the Smart HR Platform\n\nEnterprise HR business strategic planning is generally\
    \ derived from the corporate Mission, Vision, Values (`MVV`), and then through\
    \ the layout of three aspects: Organization, Talent, Culture, implementing respective\
    \ organizational projects, talent projects, and cultural projects, achieving full\
    \ penetration from the organizational head to the waist to the legs. HR digital\
    \ planning needs to holistically control processes, systems, and data under the\
    \ guidance of corporate policies, systems, and norms, and realize customer value,\
    \ thereby assisting the achievement of HR strategic goals.\n\nMany corporate HR\
    \ departments also have their own Mission, Vision, Values. Based on `MVV`, the\
    \ HR Strategy can be derived, which also undertakes the corporate strategy. HR\
    \ Strategy consists of two parts: one is the strategy decomposed from corporate\
    \ strategy; the other is the strategy derived from the HR department's `MVV`,\
    \ mainly covering five directions: Organization, Talent, Culture, Leadership,\
    \ and Systems. HR Strategy can further derive HR policies, mechanisms, and norms.\n\
    \nProcess, System, Data, Experience are the four dimensions of HR digitalization\
    \ and intelligence, interrelated and indispensable. Process sorting covers \"\
    Entry, Exit, Promotion, Demotion, Transfer\"; system construction radiates \"\
    Selection, Utilization, Development, Retention, Management\". With processes and\
    \ systems, the next layer is the data precipitated by the data platform, including\
    \ data models, indicator systems, management scenarios, thereby forming talent\
    \ portraits, organizational portraits, analytical diagnosis, early warning prediction,\
    \ and auxiliary judgment.\n\nThe customers of the Smart HR Platform are the decision-making\
    \ layer, management layer, employees, and `HR practitioners`, and finally the\
    \ core goal is established: realizing HR digital-intelligence. Empowering managers\
    \ and enhancing user experience are also the value of the Smart HR Platform.\n\
    \nThe complete path to realizing the HR \"Four Modernizations\" (Standardization,\
    \ Digitalization, Intelligence, Platformization/Productization) is shown in Figure\
    \ 8-22.\n\n![](img/cutq_250_45785_l.jpg)\n\nFigure 8-22 Path to Realizing HR \"\
    Four Modernizations\"\n\n#### 2. Challenges and Breakthroughs of Self-Developed\
    \ `DHR Platform`\n\nWhether enterprises need to self-develop a `DHR Platform`\
    \ has always been a controversial topic. With business expansion and future industry\
    \ development, enterprises are developing towards groupization, globalization,\
    \ and multi-business forms; expanding self-developed R&D strength has become inevitable,\
    \ as shown in Figure 8-23.\n\n![](img/cutq_250_51608_l.jpg)\n\nFigure 8-23 Challenges\
    \ of Self-Developing `DHR Platform`\n\nIn the self-development of `DHR`, enterprises\
    \ should understand the relationship between change and constancy, grasp the invariable\
    \ underlying logic, and explore well on the variable level, as shown in Figure\
    \ 8-24. During system self-development attempts, \"data silos\" easily form between\
    \ systems. To avoid \"chimney building\" (stovepipe systems), enterprises can\
    \ plan the data integration platform in advance at the top-level design stage,\
    \ consciously refine common services, continuously precipitate reusable components\
    \ at the code level, and equip intelligent portal entrances, data governance mechanisms,\
    \ and security management mechanisms, eliminating \"chimneys\" from the bottom-layer\
    \ architecture to form agile and efficient `microservices` and `lightweight applications`.\n\
    \n![](img/cutq_251_57724_l.jpg)\n\nFigure 8-24 Breakthrough for `DHR Platform`\
    \ Self-Development\n\n#### 3. Portrait of Digital Talent\n\nDigital strategy,\
    \ talent first. So, in the process of HR digital transformation, what kind of\
    \ digital talent with what traits serves as the acceleration engine for promoting\
    \ enterprise `DHR Platform` construction? The core skill of digital talent is\
    \ mastering both technology and business simultaneously, while possessing capabilities\
    \ in data analysis, user experience, and product thinking, as shown in Figure\
    \ 8-25.\n\n![](img/cutq_252_2421_m.jpg)\n\nFigure 8-25 Portrait of Digital Talent\n\
    \n# Acknowledgements\n\nThe writing of this book took nearly three years. Although\
    \ coding during holidays was exceptionally hard, I really wanted to write this\
    \ book. Because this book is both a review and precipitation of my past work practices,\
    \ and my thoughts on the future direction and implementation path of HR Digital-Intelligence.\
    \ If this book can bring a little help and inspiration to colleagues, I will feel\
    \ very gratified.\n\nDuring the writing process, the encouragement and help from\
    \ teachers and friends, as well as the support from my family, allowed me to persevere.\n\
    \nFirst, I want to thank Baidu and my former comrades-in-arms. In the eight and\
    \ a half years at Baidu, we experienced four stages together: online, informatization,\
    \ digitalization, and intelligence, continuously exploring frontiers and applying\
    \ new technologies. In 2014, we began exploring the application of big data technology\
    \ in the HR field; in 2016, we began exploring the application of AI in the HR\
    \ field; in 2017, we refined and formed the \"`Four Modernizations Model`\". During\
    \ different periods, we created many classic products. In this process, Baidu's\
    \ leaders and colleagues gave a lot of selfless guidance, help, and support, as\
    \ well as criticism. All of these benefited me greatly and motivated me to continuously\
    \ grow and progress on the path of digital-intelligence. Here I thank Liu Hui,\
    \ Zheng Shaohui, Wu Hui, Liu Jianli, Fan Xiao, Cui Fang, Xu Juanjuan, Yang Yang,\
    \ He Yiqing, Yin Yalin, Tian Yalin, Zhao Yuhong, Wang Haibo, Liu Bo, Wang Bei,\
    \ Hai Xuesen, Wang Wenyu, Dai Lingling, Yue Ying, Ren Junxin, Liu Changjiang,\
    \ Liang Shuo, Xie Gengxi, Sun Yiding, etc.! Also, the new leaders and colleagues\
    \ at Baidu for their selfless care and support, encouraging me to continue forging\
    \ ahead, thank Cui Shanshan, Hu Qu, Xiao Meiyang, Xu Zhanbing, Zhang Xiaochen,\
    \ Sun Yingli, Shi He, Du Wei, etc. Of course, special thanks to Professor Xiong\
    \ Hui and Dr. Zhu Hengshu of Baidu Talent Think Tank, who gave me a lot of guidance,\
    \ sparks, and brainstorming in intelligent innovation research and practice, allowing\
    \ me to continuously iterate and evolve in thought. Here I also want to solemnly\
    \ thank the leaders and comrades of the cooperating departments who fought alongside\
    \ me: Li Zhenyu, Li Tao, Chen Shangyi, Gu Yan, Gong Xuefeng, Chen Liyan, Tu Jie,\
    \ Feng Junhui, Liu Haiqing, Yang He, Liu Yong, Zhang Xiaoliang, Jia Yanping, Li\
    \ Hong, Yang Shuanghua, Cheng Fei, Guo Qi, Zhang Qi, Liu Wei, Zhou Yanchen, Han\
    \ Zhigang, etc., thank you all!\n\nSecond, I want to thank the leaders of DiDi\
    \ Chuxing: Liu Qing, Wang Yanping, Cai Xiaou, Li Miao, etc., for their full trust\
    \ and selfless support, allowing me to plan the DiDi version of the \"`Four Modernizations\
    \ Model`\" and achieve the first phase of victory. The work experience at DiDi\
    \ Chuxing allowed me to continue to consolidate business architecture, product\
    \ architecture, data architecture, and technical architecture, while accumulating\
    \ and precipitating more thoughts and methods in internationalization, productization,\
    \ and commercialization. Thanks to the partners in HR and EP, you are my forever\
    \ friends.\n\nThird, I want to thank the teachers of the \"Five-Person Talk\"\
    \ of the Intelligent Branch of the China Human Resource Development Research Association:\
    \ President Liu Hui, Professor Peng Jianfeng, Professor Xiong Hui, Secretary General\
    \ Li Zhi, Dr. Zhu Hengshu, and host Li Wei. Walking with the wise, I meet challenges\
    \ and accelerate forward.\n\nI also want to thank Professor Wang Tongxun, former\
    \ President of the Chinese Academy of Personnel Science and Director of the Institute\
    \ of Personnel and Talent. In his busy schedule, he not only wrote the preface\
    \ for this book but also often guided me and gave me teachings. I also want to\
    \ thank the special experts of the \"Wang Tongxun Talent Studio\": Jiang Beiqi,\
    \ Hu Ming, Wang Aimin, Huang Qiujun, as well as Associate Professor Pan Jingzhou\
    \ of Tianjin University and Associate Professor Wang Tao of the National University\
    \ of Defense Technology. We often discussed digitalization and intelligence on\
    \ the phone; you are my good teachers and friends, firming my confidence in continuous\
    \ exploration on the path of digital-intelligence.\n\nFinally, I want to thank\
    \ the partners who are engaged in HR digital-intelligence and always persist,\
    \ especially friends in the `DHR` Guild: Shen Gangzheng, Zhang Dongchao, Li Xiang,\
    \ Li Qiang, Peng Yizhou, Peng Chuanjun, Cao Xing, Jiang Ying, Zhang Weifeng, etc.\
    \ We are like family, communicating, sharing, and improving together, making the\
    \ future road of HR digital-intelligence no longer lonely and full of infinite\
    \ imagination.\n\nWang Chongliang\n\nAugust 2021\n\n# References\n\n1. Wang Aimin,\
    \ Wang Chongliang, Huang Qiujun. *Practice of HR Big Data Application - Models,\
    \ Technologies, Application Scenarios*. Beijing: Tsinghua University Press, 2017.\n\
    2. Xiong Hui, Zhu Hengshu. *Baidu Talent Think Tank - Big Data Intelligent Talent\
    \ Management*.\n3. Peng Jianfeng. *Introduction to Human Resource Management (3rd\
    \ Edition)*. Shanghai: Fudan University Press, 2018.\n4. Peng Jianfeng, Zhang\
    \ Jianguo. *Operator Thinking - Winning in Strategic Human Resource Management*.\
    \ Beijing: China Renmin University Press, 2019.\n5. Chen Chunhua, Zhu Li. *Collaboration:\
    \ The Essence of Organizational Efficiency in the Digital Age*. Beijing: China\
    \ Machine Press, 2019.\n6. Gene Paul Eisen, Jesse S. Harriott. Translated by Hu\
