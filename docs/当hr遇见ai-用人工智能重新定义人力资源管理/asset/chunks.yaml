    # Analysis of Employee Engagement with AI Can Extend to Employee Performance Management


    A key issue in employee performance management is how to set benchmarks for performance
    evaluation, including external and internal benchmarks. External benchmarks include
    where the company''s employee performance levels stand in the industry, how they
    differ from competitors, and whether the company has unique methods for improving
    employee performance or merely imitates others'' strategies. Internal benchmarks
    include the core factors that distinguish high-performing employees from others;
    managers can easily pick out high performers, but not all managers can clearly
    articulate the selection criteria; whether the selection process can be quantified,
    proceduralized, and kept objective. In most companies, the performance management
    process is unrelated to expected outcomes; performance management systems can
    track employee performance but are lackluster in helping employees improve their
    performance levels. AI technology can help managers improve this process and support
    them at critical moments. For example, a company expects managers to provide timely
    feedback and coaching on employee performance, but in implementation, this is
    undoubtedly affected by managers'' schedules and work styles, bringing certain
    pressure to managers. AI technology can help managers promptly notice abnormal
    employee performance so they do not miss opportunities to provide feedback and
    coaching.


    More importantly, AI technology can use historical and real-time data to predict
    employee performance. The characteristics of a high-performing employee can be
    used to build a profile for a specific position, which can be used in the organization''s
    recruitment and screening processes. Many companies also measure employee job
    satisfaction through regular organizational surveys. All this data can be correlated
    with employee performance data.


    Analyzing employee performance data is closely related to other HR scenarios,
    such as employee training, career planning, and talent retention. A significant
    decline in an employee''s performance level in a specific department or position
    may be related to the employee''s ability, or it may be due to insufficient staff
    in the same department, or because the employee lacks specific skills training.
    Managers can also judge whether an employee meets the promotion requirements for
    a specific position based on their past experience, skills, and performance.


    A large chain service company, after experiencing severe customer churn, hoped
    to turn the situation around by improving employee performance levels. With the
    help of a consulting firm, they restructured the employee performance management
    process, linking employee performance evaluation results to relevant business
    outcomes. These business outcomes were identified as the number of customers,
    customer satisfaction, and employee satisfaction for each operating chain store.
    Then, employee indicators directly affecting these business outcomes were determined,
    such as job fit, teamwork, senior leadership ability, communication skills, compensation
    level, career development direction, customer focus, etc. The scores of these
    factors were mapped to relevant business outcomes and analyzed using algorithms.
    Finally, the business drivers with the greatest impact on business outcomes were
    screened out and visualized, categorized into several levels: observation, maintenance,
    improvement, and focus. Based on these categories, the performance appraisal weights
    for each store manager were designed. Within a year after the completion of this
    reform, the chain service company''s customer satisfaction increased by more than
    20%, while the employee turnover rate decreased by more than 10%.


    ## Three, Intelligent Compensation Data Analysis Platform


    Reference link: `../Text/contents.xhtml#c_51`


    In the current increasingly fierce talent competition, how to retain key talents
    has become a huge challenge for enterprises. In some industries, the average tenure
    of employees in a company has even fallen below two years. An important strategy
    for enterprises to recruit and retain key talents is to provide competitive compensation
    and incentive packages. HR data analytics can provide technical support for managers''
    compensation decisions.


    ### 1. Intelligent Compensation Data Analysis Platform


    The module accounting for the largest proportion in HR data analytics is compensation.
    When HR practitioners handle compensation module data, they must first conduct
    salary data analysis (e.g., calculation methods, composition analysis, salary
    expenditure, budget analysis), and then conduct compensation policy data analysis.
    Specifically, HR practitioners have the following main analysis activities:


    - Human capital investment analysis

    - Labor cost analysis

    - Per capita efficiency analysis

    - Personnel incentive analysis

    - External benchmarking and competitor analysis

    - Compensation policy data analysis

    - Budget analysis


    How to conduct effective analysis? HR practitioners need to build a compensation
    management data analysis platform, as shown in Figure 3-8. The construction method
    is similar to an HR big data platform or relies on an HR big data platform.


    ![](img/cutq_109_4696_l.jpg)


    Figure 3-8 Compensation Management Data Analysis Platform


    The compensation management data analysis platform can be divided into the system
    layer, big data support layer, AI technology application layer, and visualization
    layer.


    #### System Layer

    Enterprises can fully utilize informatization, digitalization, AI, and other technologies
    to build relevant systems or Apps to collect and precipitate data. These data
    are divided into internal data and external data. Internal data includes data
    from organization, position, compensation, attendance, entry/exit/promotion/demotion/transfer,
    selection/use/development/retention/management, OA, portal forums, access control,
    facial recognition, finance, operations, and other systems; external data includes
    external market analysis data, industry data, competitor company data, compensation
    survey report data, etc.


    #### Big Data Support Layer

    Through data collation, cleaning, and processing, information is classified and
    archived, stored in a data warehouse for subsequent big data analysis activities
    related to compensation.


    #### AI Technology Application Layer

    Utilize AI computing power to carry out activities such as building big data algorithm
    models, machine learning, data training, scenario analysis, and thematic analysis.


    #### Visualization Layer

    Also known as the display layer or dashboard layer, it mainly provides various
    dashboard products and early warning predictions for enterprise managers, HRBPs,
    and HR COEs, providing intelligent reference for operational analysis and management
    decisions, such as intelligent payroll calculation, intelligent attendance, compensation
    pricing, monitoring and early warning platform (total wage approaching or exceeding
    budget warning line, abnormal monthly wage fluctuation warning, excessive incentive
    analysis warning, etc.).


    By using AI technology, enterprises can not only analyze and process employee
    information quickly and effectively but also leverage the advantages of "Internet
    + Big Data" to deeply mine market compensation survey data and formulate compensation
    management plans suitable for the enterprise through algorithm models. At the
    same time, AI technology can help enterprises monitor market conditions in real-time,
    control compensation costs, predict enterprise development trends, and provide
    a reliable basis for compensation management decisions by top managers and HR
    practitioners.


    ### 2. Salary-Skill Neural Network Model


    Job skill value, as an important economic indicator in the labor market, can not
    only assist managers in conducting individual competency assessments but also
    help enterprises improve salary structures to attract and retain talent. So, can
    AI technology "refine" the assessment of job skill value?


    A latest research achievement in the field of "AI + Talent Management" was published
    in *Nature Communications*, a sub-journal of the international top journal *Nature*.
    This study used a data-driven method for the first time to explore the important
    issue of the relationship between salary and job skill value assessment through
    machine learning technology, which has significant value in multiple fields such
    as the rationality and fairness design of social labor value distribution mechanisms,
    social labor security, intelligent recruitment and precise employment, and personalized
    vocational education. The following is an excerpt from the paper.


    The main basis for companies setting compensation is the value created by employees
    for the company. HR management practice experience tells us that the amount of
    value created by employees is closely related to factors such as employee skill
    level, engagement, and cultural identity. Especially for positions requiring professional
    skills, employee skill level plays a crucial role, such as engineers, doctors,
    and lawyers. However, for a long time, we have lacked methods and tools for quantitative
    analysis of factors affecting the value created by employees. Therefore, companies
    usually can only use result-based methods to evaluate the value created by employees.
    For example, companies evaluate the value created by employees on a quarterly
    or annual cycle, and then adjust the compensation structure. This method has serious
    defects. The first is lag. If an employee''s value creation for the company cannot
    meet the company''s requirements due to skill level, engagement, and other issues,
    the company can only discover this at the end of an evaluation cycle, but the
    loss caused to the company has already formed, and the company cannot control
    this risk in advance or during the process. The second is ambiguity. Due to the
    lack of systematic quantitative analysis of factors affecting employee value creation,
    companies cannot adopt precise methods to optimize and improve employees'' ability
    and level of value creation.


    The good news is that the latest AI research has built a bridge between compensation
    and job skill value assessment. Researchers from Baidu Talent Intelligence Institute,
    Chinese Academy of Sciences, Beihang University, University of Science and Technology
    of China, and Rutgers University collaborated to construct a Salary-Skill Composition
    Network (SSCN) with a collaborative structure. This model aims to establish a
    quantitative relationship between job skill proficiency and job salary, and can
    analyze the impact of skill value on job salary as an independent variable. By
    analyzing skill requirements and compensation data from a large amount of recruitment
    information, the model completed two tasks: realizing skill value assessment and
    salary prediction. In terms of skill value assessment, the model can achieve fine-grained
    skill value assessment based on work scenarios and job scenarios. In terms of
    salary prediction, the SSCN model surpassed SVM, LR, GBDT, and a series of other
    deep neural network models, achieving new SOTA accuracy. This research achievement
    provides new methods and algorithm models for data-driven quantitative compensation
    research.


    Currently, the relevant algorithms of this research have been implemented in Baidu
    Intelligent Recruitment related products. It can help intelligent recruitment
    systems objectively and scientifically conduct resume evaluation and person-job
    matching. In addition to internal applications, Baidu Intelligent Recruitment
    System provides intelligent recruitment solutions to the outside world through
    Baidu Brain, combining AI computing power with suitable algorithm models to provide
    enterprises with more efficient intelligent recruitment services, freeing recruitment
    specialists from massive resume screening and tedious communication, helping enterprises
    save recruitment costs, and playing a significant role in promoting the intelligent
    and digital development of enterprise recruitment.


    ## Four, Compensation Intelligent Assistant


    Reference link: `../Text/contents.xhtml#c_52`


    The Compensation Intelligent Assistant refers to enterprises using AI, machine
    learning, and big data algorithm models to build a compensation big data analysis
    platform, using market data and user self-service data to help HR institutions,
    HR practitioners, or enterprise managers comprehensively and in real-time understand
    market position supply and demand situations and salary trends, assisting in judgment
    and decision-making to achieve the goal of knowing oneself and the enemy and maintaining
    competitive advantages.


    The Compensation Intelligent Assistant is mainly applied in the following three
    scenarios.


    ### 1. Market Position Prediction

    The Compensation Intelligent Assistant can help enterprise managers understand
    the supply and demand situation of a certain position in the market, thereby deciding
    the enterprise''s recruitment strategy, and can output "Comprehensive Market Position
    Analysis Report," "Market Position Industry Analysis Report," etc.


    ### 2. Compensation Simulator

    After individual users upload their own salaries, they can know the ranking of
    their salary level in the external market. Enterprise users can input corresponding
    internal data information of their enterprise according to the template and upload
    it to the simulator platform for benchmarking with market data, thereby obtaining
    relevant compensation reports.


    ### 3. Offer Letter Simulator

    Enterprise users using the Offer Letter Simulator can calculate whether to recruit
    one P8-level senior expert with 1 million yuan or four P6-level programmers; or
    calculate how many people can be recruited at each level within a specified budget.
    If the enterprise''s recruitment specialists are not familiar with the market
    compensation situation of the industry, they can upload the intended recruitment
    positions and estimated salaries on the Offer Letter Simulator to benchmark against
    the external market and understand whether the enterprise''s compensation structure
    has external competitiveness.


    ## Five, Benefit Profiling


    Reference link: `../Text/contents.xhtml#c_53`


    With the continuous changes in the global economy, employment environment, corporate
    talent structure, and the diversified development of talent demands, employee
    benefits, as an important part of the enterprise''s total compensation strategy,
    employer brand building, and talent incentives, have become an important factor
    and key strategy for enterprise talent attraction, motivation, and retention.
    Therefore, enterprise managers have begun to pay attention to how to distribute
    employee benefits to give employees a greater sense of belonging.


    ### 1. Employee Benefit Plans

    Employee benefit plans refer to a package of plans provided by enterprises to
    employees for non-wage income. Employee benefit plans generally include the following
    categories:


    - **Statutory Plans**: Refers to the social security system mandated by national
    legislation, including basic pension insurance, medical insurance, unemployment
    insurance, work injury insurance, etc.;

    - **Voluntary Plans**: Mainly include supplementary pension insurance for employees,
    life insurance, health insurance, accident insurance, physical examinations, children''s
    insurance, spouse insurance, parents'' insurance, etc.;

    - **Employee Assistance Programs (EAP)**: Refers to Employee Assistance Programs
    (EAP), psychological counseling, etc.;

    - **Life Support**: Including festival gifts, birthday cash, wedding/funeral gifts,
    anniversary gifts, allowances, etc.;

    - **Work-Life Balance**: Including establishing various clubs, organizing various
    collective activities, establishing nursing rooms and sleep rooms, etc.


    ### 2. Development Path of Employee Benefit Platforms in the Digital Age


    #### (1) Traditional Fixed Model

    Employee benefits are mainly based on one-way gift distribution. Enterprises need
    to arrange special departments to be responsible or multiple departments to coordinate.
    From design to bidding and procurement, to distribution, this work consumes a
    lot of enterprise manpower, material, and financial resources. Since the traditional
    benefit distribution method is a unified plan and unified procurement, employees
    have very limited choices. Although the enterprise invests high costs, employee
    satisfaction is not high.


    #### (2) Flexible Plan Model

    The flexible plan model refers to employees choosing a set of benefit plans they
    need from the benefit project menu provided by the enterprise. Specifically, the
    enterprise establishes a benefit platform, listing various benefits, insurance,
    and gifts. Employees of different levels are allocated a certain amount of fixed
    points (monetary value), and employees can freely combine and purchase according
    to their needs. Employees can clearly see benefit products through a visual interface,
    and can add or subtract points to achieve the most suitable combination for themselves.
    This model greatly reduces the enterprise''s labor costs while significantly improving
    employee satisfaction.


    #### (3) Digital Community Model

    On the basis of the flexible plan model, enterprises have added gamification elements,
    and at the same time use digital technology to depict employee benefit profiles.
    Through employee profile modeling, combined with the employee life cycle to build
    scenario-based benefits, and constantly paying attention to social environment
    change trends, predicting employee needs according to trends, further optimizing
    employee profiles, and recommending different categories of benefit products to
    employees. This model can greatly enhance employee experience and satisfaction
    while ensuring that the enterprise''s total labor cost remains unchanged.


    Of course, enterprises can conduct data tracking and big data modeling and analysis
    on different employees, different channels, and different goods, and use the analysis
    reports as a basis for guiding benefit design or decision-making, providing employees
    with personalized and intelligent care.


    ## Six, Emotion Recognition Assists Care


    Reference link: `../Text/contents.xhtml#c_54`


    AI can help people accomplish things they want to do but lack the ability to do,
    such as the "Dialogue Emotion Recognition" App from Baidu Brain. Natural Language
    Processing (NLP) technology can automatically detect emotional features contained
    in users'' daily dialogue texts, helping enterprises more comprehensively grasp
    product usage experience, monitor customer service work quality, etc. The "Dialogue
    Emotion Recognition" App has the following functions.


    ### 1. Fine-grained Dialogue Text Emotion Recognition

    In dialogue scenarios, the "Dialogue Emotion Recognition" App can identify user
    emotions implied behind the texts of both parties. Primary emotions are divided
    into three types: positive, neutral, and negative. Positive emotions are subdivided
    into liking, joy, and gratitude. Negative emotions are subdivided into complaint,
    anger, disgust, fear, and sadness.


    ### 2. Negative Emotion Reference Reply Scripts

    For negative emotions recognized by the machine, the "Dialogue Emotion Recognition"
    App can provide targeted reference reply scripts combined with contextual context,
    helping the applicant soothe the customer''s negative emotions at the first time.


    Application scenarios of emotion recognition and analysis include customer quality
    inspection and monitoring, dialogue robots, etc.


    - **Customer Quality Inspection and Monitoring**: Can identify customer emotions
    during customer service consultations. For example, if customer dissatisfaction
    is detected, it triggers manual customer service intervention in time. In manual
    customer service scenarios, customer quality inspection and monitoring can be
    used to monitor the service attitude of customer service personnel, and can also
    identify and analyze employee emotions.

    - **Dialogue Robots**: Can identify user emotions during the chat process, helping
    manual customer service choose reply texts that can better soothe user emotions.


    The "Dialogue Emotion Recognition" App can store the dialogues between customer
    service personnel and customers, conduct data analysis on semantics, voice frequency,
    speech rate, intonation, rhythm, pitch, fundamental frequency, amplitude, spectrum,
    etc., extract emotional feature parameters; label emotions such as joy, anger,
    sorrow, and joy; conduct analysis and research through machine learning, NLP (Natural
    Language Processing), NB-SVM (Naive Bayes Support Vector Machine) and other algorithm
    models, and finally form the "Dialogue Emotion Recognition" system.


    Since most of the information received by customer service personnel are complaints,
    this negative energy-filled information will bring some negative effects to employee
    emotions. HR practitioners can use the "Dialogue Emotion Recognition" App to understand
    employee status in time, listen to employee feelings, and provide some care to
    customer service personnel according to relevant prompts, reduce or eliminate
    employees'' psychological burden, and help enterprises improve employee job satisfaction,
    performance levels, and attendance rates.


    The HR Assistant Robot launched by Zhujian Intelligence can perceive the human
    heart. Managers can timely help employees relieve mood and release pressure through
    machine perception plus real human care. Emotion perception and warning prompts
    are all based on natural language understanding and intent recognition, recognized
    through image, voice, and text. Through natural language interaction and natural
    language understanding technology, the HR dialogue robot can not only conduct
    Q&A with employees but also identify employee intentions in multi-round dialogues,
    helping HR practitioners collect employees'' more real thoughts. At the same time,
    based on text and sentiment analysis of interaction data, it can quickly understand
    employee needs and evaluations, thereby providing data basis for the HR department
    to formulate employee benefits or carry out employee training and other measures.
    The HR Assistant Robot can take over the heavy burden on HR practitioners'' shoulders
    and "solve worries and difficulties" for employees. When employees encounter difficulties
    at work, feel stressed and have nowhere to vent, the HR Assistant Robot can issue
    early warnings in time before HR practitioners notice, request expert intervention,
    and provide timely guidance to avoid further deterioration of employee emotions.


    # Chapter 4 Application of AI in Talent Development


    Reference link: `../Text/contents.xhtml#z_9`


    ## Section 1 Learning and Talent Development in the Digital Intelligence Era


    Reference link: `../Text/contents.xhtml#b_55`


    In the VUCA era, enterprises in the digital transformation stage urgently need
    to absorb various talents to enhance their competitiveness, especially talents
    proficient in digital technologies (such as ABCD, IoT, AR, VR, etc.). AI and big
    data technology connect individual competency assessment and course recommendation,
    forming a learning map to assist employee growth. In the future, the trend of
    enterprise talent development is to strengthen mobile learning, gamified learning,
    and social learning, connecting talent development with courses and scenarios
    to achieve education through entertainment.


    ### One, Shift Learning Mindset to Learner-Centered


    Reference link: `../Text/contents.xhtml#c_56`


    Statistics show that global enterprises spend more than 350 billion USD annually
    on employee development and training. Even so, the results achieved by traditional
    offline course training and e-learning online training methods are unsatisfactory.
    According to research by Dave Ulrich, professor at the University of Michigan,
    in leadership course training, only 20%~30% of ideas and concepts are converted
    into practice. However, as AI technology is more widely applied in training and
    employee development scenarios, this problem has undergone positive changes. First,
    the learning process becomes more personalized and customized; second, AI technology
    can provide 24x7, one-on-one assistance to learners; third, AI technology combined
    with other technologies, such as virtual reality technology, can provide immersive
    learning methods, making the training process as close to real work scenarios
    as possible; finally, AI technology can make the training process fully digitalized
    and provide real-time evaluation feedback and optimization.


    IBM used AI technology to develop a personalized learning platform called "Your
    Learning," with an average of 98% of employees learning on this platform every
    quarter. IBM employees complete an average of 60 hours of learning per person
    per year on this platform. The platform provides employees with the most popular
    course navigation, targeted course arrangements, and skills training for scarce
    positions (usually also meaning higher salary levels). During the learning process,
    employees receive 24x7 assistance from chatbots, and the platform collects progress,
    results, and behavioral data during employee learning. IBM HR discovered the correlation
    between employee learning intensity and engagement through analyzing these data,
    and confirmed that learning is positively correlated with performance; employees
    with stronger learning willingness and larger learning volume have better overall
    performance. More importantly, the course completion rate recommended to employees
    by IBM through this platform has always been very high, which aligns the overall
    skill level of employees with the company''s strategic direction.


    This customization may be more challenging for training content design and delivery.
    Can employees themselves contribute and share learning content? Usually, training
    content is created by the HR training department, but user-generated training
    (or informal learning) is becoming increasingly popular. LinkedIn created a user
    platform called LearnIn, which provides users with learning content that matches
    their personal identities. Some learning is mandatory, some is self-driven. Compared
    with traditional HR training, LinkedIn reformed from the user''s perspective and
    helped users obtain the best possible learning experience. The Accenture Skills
    and Employment Trends Survey found that new training methods are very popular,
    including mobile delivery, social media, massive open online courses, and gamification.
    These new training delivery models are both cost-effective and meet learners''
    needs, while employees will no longer be forced to accept unnecessary training.
    This training model is not only designed based on employee preferences or interests
    but also based on the precipitation of learning content and work experience, which
    will bring better performance and long-term career success to employees.


    Taking a high-tech company M tracking training effect as an example. In 2017,
    Company M recruited 300 software engineers with 3-4 years of work experience.
    Two months after entry, 150 engineers signed up for a two-week training program
    YEP. Among them, only 140 engineers fully participated in this training program,
    completed all tasks, and participated in project practice and assessment in subsequent
    work. One year after participating in the YEP program, 80 of these 140 engineers
    were promoted to a higher level. Among the 160 people (including 10 who did not
    complete) who joined at the same time but did not participate in the YEP program,
    only 55 were promoted. Table 4-1 is the effect statistics table related to this
    training.


    **Table 4-1 Effect Statistics Table Related to YEP Training**


    ![](img/table_image_121_0.jpg)


    Below, let''s use the Bayesian Theorem to look at the predictive effect of the
