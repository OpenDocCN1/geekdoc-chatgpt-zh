    # 人力资源数字化（Digital HR）


    人力资源数字化（Digital HR）就是利用数字化技术驱动组织、人才、文化（Organization、Talent、Culture，OTC）和领导力（Leadership）的创新与迭代，从人力资源的角度帮助业务部门实现业绩的快速增长。数字化技术将重新定义人力资源管理，将企业打造成智慧HR（intelligent
    HR，iHR）平台。数字化技术对企业的影响体现在以下几个方面，如图1-2所示。


    ![](Images/cutq_28_17993_l.jpg)


    图1-2　数字化技术对企业的影响


    - 组织将更加灵动、高效、相互连接；

    - 人才将实现跨界融合，人才种类将变得多种多样，特殊人才将会层出不穷；

    - 文化将更加敏捷、开放、包容；

    - 流程将实现端到端的连通，同时人工智能的应用将使流程更加智能化；

    - 利用数字化技术连通系统，实现自然埋点并沉淀数据；

    - 数据可以辅助管理者做出判断，让决策更加智能；

    - 用户体验将分为四个层次，即可用、有用、易用、好用，这四个层次的感受是逐步提升的。


    在数字化技术的驱动下，流程是闭环、简洁、高效、端到端的，数据是互通的，用户体验是极致的，管理实践是集成在流程中的，思想是迭代在智库中的，业务是被赋能与驱动的。


    ## 二、人工智能对人力资源管理的重塑


    人工智能就像助推器或催化剂，能有效加速人力资源管理模式的迭代。过去，虽然没有人工智能的助力，但是人力资源管理模式一直在不断地发展和迭代。如今，随着“ABCD”（即人工智能、区块链、云计算、大数据）的宣传与普及，具备移动化、社交化、智能化、机器学习等特点的人工智能技术能够帮助企业更快速地提高效能和更有效地提升用户体验。


    现在，一些优秀的头部企业开始由战略人力资源管理阶段进入人力资本管理阶段，追求人才与企业的可持续发展及投资回报率（RoI）的最大化。与之配套，企业需要建设智慧HR平台，只有这样才能支撑起由灵动的网状组织、敏捷文化、特殊人才等构成的企业生态体系。


    在过去相对稳定的业态环境里，管理者依靠丰富的经验就可以推断企业的发展趋势且准确率颇高。但是，现在的市场变化加速、经营环境日趋复杂，管理者仅凭经验已无法准确预测市场前景，因此数据分析结果逐渐成了管理者制定决策的依据。在人工智能时代，企业人力资源从业者可以借助各种数字设备将信息聚集起来，建立一套算法模型将有效的信息提取出来，经过运算分析后获得更加精准的人力配置建议，从而指导企业管理者扩大或调整生产规模。


    虽然人力资源管理领域应用人工智能技术的时间不长，但随着数据量的几何式递增、算法模型的日益精进、算力的跨越式提升，人工智能技术可以让人力资源从业者的工作变得更加省时、便捷，也能够促进企业大幅提升经营效益和效率。


    ## 三、人工智能对人力资源管理的价值


    这是一个多变、不确定、未知的时代，面对复杂的市场环境，企业不仅需要强大的、能够进行实时分析的后台作为支撑，而且要适应市场变化，改善管理方式，吸引优秀人才，共同创造更大的价值。


    人工智能对人力资源管理的价值主要体现在“四度”上，即速度、广度、深度和高度。


    ### 1. 速度：加速新技术应用，推动业务发展


    人工智能技术可以应用于人力资源管理的各个环节，从而提升人力资源的运营效率。例如，人脸识别技术（扫描视网膜和面部）验证的结果是独一无二的、无法复制的，可以有效防止“代打卡”现象；利用大数据技术（如模型+算法）对求职者进行画像，对求职者的求职意愿、工作经历、毕业院校、专业技能和职场信用等信息进行定性或定量分析，可以得出企业对求职者的关注维度；通过对职位与候选人的智能评估和精确匹配，可以更加高效地筛选简历，提升人才招聘工作的质量；通过增强现实技术（AR）和虚拟现实技术（VR），企业可以轻松利用数字化场景为员工提供培训，员工能更加直观地体验工作流程及工作环境。


    ### 2. 广度：扩展数据分析的“点、线、面、体”场景


    随着人工智能技术在数据挖掘、数据分析、数据治理等方面的不断迭代，其从“点、线、面、体”四个维度也对业务产生了作用。所谓点，就是以问题为导向抓住数据分析的发力点；所谓线，就是以业务场景为线索挖掘数据分析的深层原因；所谓面，就是以数据生命周期为核心提升数据分析的洞察力与持续性；所谓体，就是以数据架构为核心搭建数据分析的三大体系（数据体系、指标体系、标签体系）。人工智能和大数据技术在人力资源管理领域的应用，经历了从用数据说话、数据决策、数据运营到数据创新的四个阶段，实现了“点、线结合”和“面、体管控”。


    ### 3. 深度：发现了传统数据分析工作洞察不了的事情


    企业管理者利用人工智能技术，可以随时随地了解员工的需求，并根据员工需求的不断变化，设计和实施满足员工需求的流程。例如，人工智能技术可以挖掘员工绩效考核、员工访谈等数据，开展员工离职预测分析，通过及时洞察员工需求来降低优秀员工流失率；企业使用聊天机器人可以节省运营成本和时间，提升智能客服的运营效率，从而提升用户体验。


    ### 4. 高度：发挥组织效能，提升企业绩效水平


    随着科技的进步，移动互联网的产生和人工智能技术的应用在很大程度上改变了人与人、人与机器、机器与机器、人与事、人与财、事与事、事与财等之间的关系，也改变了信息流转的渠道。从前的上传下达已不能满足信息传递的需要，信息流已经开始向数字化方向发展。由于外部环境已经发生改变，企业与客户之间、企业与合作伙伴之间共生了新的价值，原有的组织模式已经不再适用，企业必须打造新的组织模式。数字化技术带来的变化重新定义了组织管理。在这些变化中，企业与员工都会面临一些挑战。由于信息与数据高度交互，企业要利用新技术提升组织能力和绩效水平，员工要增强自主创新能力，需要时刻保持高效与敏捷来应对变化。


    图1-3展示的是“数据+场景”的“双轮驱动”。人工智能技术可以帮助人力资源从业者采集、加工、清理各种数据，通过模型、算法和算力，结合管理场景（包括运营体检报告、管理风险预警、选用育留趋势预测、决策支持智库、政策执行监察与修正等）为决策者（CXO）、管理者、员工或人力资源从业者提供分析报告、辅助判断和决策支持。


    ![](Images/cutq_32_4233_l.jpg)


    图1-3　“数据+场景”的“双轮驱动”


    未来，技术进步的速度会越来越快，人工智能技术在人力资源管理领域的应用也会越来越多，这将推动人力资源管理效率、组织效能及用户体验得到更大幅度的提升。


    # 第三节　人工智能在人力资源管理中的具体应用场景


