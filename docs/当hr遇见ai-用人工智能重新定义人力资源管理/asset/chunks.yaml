    time for Li Si to replace Ms. C, reassigning Ms. C elsewhere, thereby reducing
    the enterprise''s employment risk.


    ## II. Talent Retention Early Warning


    Enterprise managers can use risk indices and retention tags to warn and prompt
    which talents are worth retaining. As shown in Table 5-1, although both Mr. A
    and Mr. B have very high turnover risks, because they are key retention talents,
    the enterprise is willing to take various measures to keep them.


    Of course, Table 5-1 shows only a small part of several management scenarios.
    In actual work, scenarios will be more complex and diverse, and the measures HR
    practitioners can take will be more flexible and varied.


    Take the four disciples of Tang Sanzang as an example: which type of employee
    is the talent the team needs to focus on retaining? As shown in Figure 5-2, the
    horizontal axis represents employee engagement, and the vertical axis represents
    capability. The two dimensions form four quadrants. The four disciples represent
    three types of team members.


    ![](img/cutq_141_21220_m.jpg)


    **Figure 5-2 Four-Quadrant Relationship Diagram of Capability and Engagement**


    After HR practitioners predict the turnover risk index for each type of employee
    through tools, they can adopt the following different retention measures and management
    styles for each type:


    1.  **For the "Wukong Type" (high capability, high engagement):** Need to paint
    a clear long-term vision, grant full trust and authorization.

    2.  **For the "Bajie Type" (relatively high capability, low engagement):** Need
    to offer more encouragement to leverage their value, while drawing clear "red
    lines" (boundaries).

    3.  **For the "Wujing/White Dragon Horse Type" (low capability, relatively high
    engagement):** Need to conduct skills training to enable rapid growth.


    ## III. Dynamic Allocation of Organization and Talent


    With technological development, enterprises can utilize Artificial Intelligence
    and Big Data technology to conduct more intelligent and comprehensive analyses
    of organizational talent structure and layout, adjust irrationalities and imbalances
    in organizational configuration, and form a multi-dimensional optimal combination
    to improve overall team efficiency.


    There is a simple method to quickly diagnose whether organizational configuration
    is reasonable: that is, to allocate organizational scale through **span of control**
    and **management levels** to meet business development requirements. Span of control
    refers to the number of subordinates directly managed by one person. Management
    levels refer to the number of management tiers divided vertically in the organization;
    management levels are directly proportional to organizational scale—the larger
    the scale and the more members, the more levels. Given a relatively stable organizational
    scale, management levels are inversely proportional to span of control: the more
    subordinates a manager directly manages, the fewer the management levels; conversely,
    the narrower the span of control, the more management levels.


    Big data analysis research indicates that a span of control of 7–12 people is
    the most scientific organizational architecture. With a relatively stable number
    of managed objects (all employees), the wider the span of control, the fewer management
    levels needed; conversely, the narrower the span of control, the more management
    levels needed. Assuming a span of control of 8 people at every level, an enterprise
    with approx. 30,000 employees only needs 6 management levels (i.e., tiers from
    bottom-level employee to CEO); if the enterprise has nearly 300,000 employees,
    a 7-level architecture is sufficient, as shown in Figure 5-3.


    ![](img/cutq_142_32917_m.jpg)


    **Figure 5-3 Schematic Diagram of Span of Control and Organizational Scale**


    JD.com Group has a famous **"8150" Principle**.


    1.  Organizational setup must meet certain span of control requirements. Generally,
    the span of control for managers (including solid-line and dotted-line reports)
    should not be fewer than 8 people. A peer-level or subordinate department can
    only be established when solid-line reports exceed 15 people.

    2.  For grassroots departments with relatively single business functions (e.g.,
    sorting, packaging, delivery, customer service), the manager''s span of control
    should be larger. On the premise of meeting a span of control of no fewer than
    8 people, a peer-level or subordinate department, or a deputy position (limited
    to JD Logistics regions), can only be established when solid-line reports exceed
    50 people.


    That is, the company requires every manager to have no fewer than 8 direct reports;
    if fewer than 8, middle-level managers should be reduced. Only when direct reports
    exceed 15 people does the company allow adding another manager at the same management
    level.


    The "50" in "8150" refers to grassroots employees of the same trade. It requires
    the managed headcount to be no fewer than 50 people; only when exceeding 50 can
    a second team leader be considered. For example, packers: if the number of packers
    in a shift does not exceed 50, only one packing supervisor is allowed. If 50 packers
    are divided into five groups with five team leaders, it would be a "disaster."
    So, 50 is the baseline for grassroots managers managing grassroots employees.


    The core of the "8150" principle is to ensure a **flat organization**. It is precisely
    because JD insisted on the "8150" principle that it ensures only 5 layers of management
    exist between the CEO and hundreds of thousands of employees.


    Baidu uses big data analysis modeling to dynamically scan changes in organizational
    names, team sizes, spans of control, management levels, movements of senior talent,
    team turnover rates, etc., conducting organizational health and key talent risk
    index analysis, and providing near-real-time early warnings, thereby ensuring
    flexible, efficient organizational configuration and alignment of goals. For example,
    when the span of control is less than 5 people, the system sends an email to the
    relevant OD (Organization Development) owner, who then analyzes the rationality
    of team configuration with the HRBP (Human Resource Business Partner); when a
    business line''s management levels exceed 5, the system also issues a warning,
    and the OD owner checks the rationality and appropriateness of the organizational
    configuration. When the system detects that a key talent''s turnover risk or management
    risk exceeds a certain threshold, HR practitioners also receive notifications
    and take a series of measures such as job rotation, succession planning, and incentives
    to reduce risk or avoid greater losses, promoting a virtuous cycle for the organization.


    # Section 2: Intelligent Care


    To fully unleash the value of talent, enterprises must build a culture and environment
    of employee care. This means the enterprise needs to allocate certain funds and
    resources for this work, while linking investments in employee health, safety,
    and well-being to business performance.


    Although some company managers still believe that employee care programs are merely
    extra benefits provided to employees, some companies have integrated employee
    care programs into their strategic business. These companies are known as **"Best
    Employers,"** and their success has proven that there is not only a correlation
    but a **causal relationship** between employee morale, mental state, health, safety,
    and company profitability.


    Employee care in the AI era aims to enhance organizational attractiveness at the
    enterprise level and create a warm workplace environment at the employee level.
    By tracking, managing, and caring for the employee lifecycle, enterprises directly
    link with the "Select, Use, Develop, Retain" talent management policies, fully
    leveraging the subjective initiative of employees and the strategic value of HR
    practitioners.


    ### I. Care Triggered by Career Events


    In the past, enterprises could retain employees simply by paying salaries; now,
    enterprises must continuously show care, addressing both material needs and spiritual
    appeals, to enhance their sense of belonging and reduce turnover. Around the integrated
    full lifecycle of **onboarding, in-service, and offboarding**, HR practitioners
    enhance the employee workplace experience through **"Four Modernizations"**: scenario-based
    experience, socialized interaction, gamified behavior (points-based), and real-time
    feedback.


    Typical intelligent care scenarios within the employee career lifecycle are shown
    in Figure 5-4.


    ![](img/cutq_145_42118_l.jpg)


    **Figure 5-4 Intelligent Care Scenarios**


    1.  **Pre-onboarding:** Employees enjoy free physical exams; receive a welcome
    gift pack upon reporting for duty.

    2.  **Onboarding:** New hires are guided by culture mentors and professional mentors
    to quickly adapt to the environment and integrate into the team.

    3.  **Probation Period:** A 90–180 day gamified training journey for new hires:
    learning, "fighting monsters," and earning points. During this process, new hires
    familiarize themselves with the culture, improve professional skills, and win
    prizes.

    4.  **Milestones:** The enterprise sends birthday wishes and work anniversary
    wishes.

    5.  **Festival Activities:** Organizing various events such as annual galas, Women''s
    Day (March 8), Youth Day (May 4), Children''s Day Carnival (June 1), Mother''s
    Day visits, Father''s Day letter writing, Mid-Autumn gifts, Spring Festival gifts,
    etc.

    6.  **Life Events:** The enterprise issues gift money for marriage, funerals,
    childbirth, and other special periods.

    7.  **Work Environment:** Providing a cozy office environment, free canteen, and
    pantry.

    8.  **Overtime Support:** Employees working past 9 PM can claim taxi fare reimbursement.

    9.  **Health & Housing:** Medical checkups and illness covered; discounts on renting
    and buying homes.

    10. **Family Care:** Gifts for parents'' birthdays; medical checkup and hospitalization
    expenses reimbursed.


    ### II. Blessing Reminders


    With large numbers of "post-90s" and "post-00s" young people entering the workplace,
    they pay more attention to the value and experience of work, requiring enterprises
    to be warmer and more creative in shaping the workplace environment. Therefore,
    using AI and digital technology to achieve blessing reminders at key moments for
    employees has become a must-have skill for HR practitioners to demonstrate value.


    **Intelligent Care** refers to HR practitioners providing personalized, intelligent
    care experiences based on employee portraits. HR practitioners can conduct big
    data analysis and modeling based on employees'' work direction, learning content,
    career planning, hobbies, daily habits, social interactions, consumption, etc.,
    tagging employees with relevant "labels," triggering "mechanisms" at different
    moments of "work, life, learning, development," and providing personalized "employee
    care." Behind the "mechanism" is a one-stop intelligent care service system based
    on AI and big data technology.


    Relevant "mechanisms" are as follows:


    1.  **Employee Blessings.** Early on the employee''s birthday, the system sends
    a birthday blessing card via email and mobile IM; simultaneously, the system sends
    a reminder to the employee''s direct manager, informing them of the subordinate''s
    birthday and prompting the manager to express "care." The blessing card has an
    exclusive QR code; employees can scan it at the company gift shop to redeem a
    birthday gift, or scan/face-scan at a self-service locker for self-pickup.

    2.  **Work Anniversary Blessings.** Early on the work anniversary, the system
    sends an anniversary blessing card via email and mobile IM, thanking the employee
    for their contribution and companionship. Each anniversary card has different
    content, colors, and design styles, giving employees a surprise every year. Meanwhile,
    the company issues anniversary souvenirs and tenure badges, which employees can
    collect at the gift shop or self-service locker via face scan. For example, Alibaba
    calls the 1st year "One Year Fragrance" (recognition), the 3rd year "Three Years
    Intoxication" (maturity), and the 5th year "Five Years Aged" (inheritance), holding
    special commemorative ceremonies at different milestones. Baidu''s Xiaodu Xiong
    (smart speaker) comes with badges; Arabic numerals represent years, with white,
    grey, silver, blue, and gold representing different stages—silver bear at 5 years,
    gold bear at 10 years. At the 10-year mark, the company holds a special ceremony
    where the CEO personally presents the award to express recognition, giving the
    employee a full sense of honor. Naturally, the direct manager also receives a
    reminder that day.

    3.  HR practitioners design different content and forms to notify employees of
    confirmation, promotion, performance feedback, evaluation feedback, and other
    results according to different scenarios, making employees feel recognized and
    encouraged to exert greater energy in future work.

    4.  **Offboarding Care** is also important. Onboarding and offboarding processes
    are automated; if there are many handover items, the system automatically verifies
    related matters in the background, eliminating the need for employees to ask around;
    simultaneously, employees can handle items requiring offline processing (e.g.,
    returning laptops, badges) at a one-stop service hall without running around.
    After offboarding procedures are completed, the company issues a set of postcards
    as a memento; simultaneously, the system sends an offboarding card prompting precautions
    for transferring files, social security, household registration, party/league
    membership, etc. On three major holidays (Mid-Autumn, Spring Festival, Company
    Anniversary), the system automatically sends blessing SMS messages to the reserved
    mobile numbers of former employees, expressing gratitude.


    The above care mechanisms can not only reduce turnover rates and attract boomerang
    employees but also improve employee satisfaction and engagement. Doing a good
    job in offboarding management helps the enterprise establish a good brand image
    in the industry and attract more outstanding talents.


    ### III. Care & Welfare Mall


    As an important component of the compensation and benefits system, employee benefits
    have largely become a management measure for enterprises to attract and retain
    outstanding talents, stimulate and mobilize employee enthusiasm. The old "universal
    benefits" model can no longer meet employees'' personalized needs and may even
    reduce work enthusiasm. Therefore, enterprises should implement a **flexible benefits
    system**, establish an intelligent employee welfare system, enhance employee loyalty
    and engagement, and achieve a win-win for both enterprise and employees.


    The flexible benefits system in the AI era integrates technologies such as user
    profiling, voice recognition, and personalized recommendation. By identifying
    employees'' personalized needs, it realizes scenario-based benefits and diversified
    care, providing employees with comprehensive, personalized free combination and
    selection, achieving the goals of full coverage of employee experience and one-stop
    life and entertainment.


    The flexible benefits mall usually includes the following:


    **For the Enterprise:**


    1.  Exclusive account management: consume first, settle later; reasonable budget
    allocation; flexible subject combination.

    2.  Integrated supplier resources: one-stop configuration of personalized benefit
    combinations.

    3.  Aggregation of high-quality brand resources: providing comprehensive, personalized
    holiday gift selections.

    4.  Exclusive employee service backend: efficient overall management for HR.


    **For the Employee:**


    1.  Independent accounts: employees at different levels have different points;
    points can be spent or redeemed.

    2.  Autonomous selection of flexible benefits (e.g., insurance, checkups, gifts,
    subsidies), covering family members simultaneously.

    3.  Enjoy group discounts unavailable for individual purchases.

    4.  Pay online using platform account points or personal accounts.

    5.  Functions include points issuance, benefit details, benefit redemption, benefit
    summary.


    **Dulife – Flexible Benefits Platform** is shown in Figure 5-5. Dulife is a product
    provided by Baidu for employee life and work convenience, available on PC and
    mobile (mobile-first). Through different "Channels" (Life Channels: Club Hub,
    Life Station, Registration Pass, Anju Fang, Flea Street, Du Discounts, Health
    Garden, Easy Travel; Work Channels: Quick Query, Ask HR, Need Stamp), employees
    can enjoy company benefits anytime, anywhere.


    ![](img/image_149_0_m.jpg)


    **Figure 5-5 Dulife – Flexible Benefits Platform**


    Brief functions of each channel:


    1.  **Club Hub:** Aggregates basketball, football, badminton, table tennis, swimming,
    yoga, dance, singing, reading, hiking, running, outdoor, anime, performance clubs,
    etc.

    2.  **Life Station:** Aggregation of eating, drinking, playing, and fun.

    3.  **Health Garden:** Basic insurance + supplementary medical insurance, checkup
    package combinations, health space, health courses, etc.

    4.  **Registration Pass:** Cooperates with institutions to solve employees'' registration
    difficulties.

    5.  **Easy Travel:** Integrates flights, hotels, trains, ride-hailing platforms,
    facilitating business trips and travel.

    6.  **Anju Fang:** Provides reliable housing sources for employees.

    7.  **Flea Street:** Second-hand trading market, facilitating reuse of idle items.

    8.  **Du Discounts:** Provides various discount information.

    9.  **Easy Meeting:** Meeting room booking, video conferencing, check-in, meeting
    minutes, and other meeting management.


    # Section 3: Public Opinion Monitoring


    So-called public opinion monitoring refers to enterprise digital system practitioners
    using Chinese word segmentation technology, natural language processing technology,
    and Chinese information processing technology to filter, deduplicate, similarity
    cluster, extract summaries, and auto-cluster public opinion information, establishing
    a public opinion monitoring system; under the premise of compliance, using crawler
    technology to scan public opinion information in key media, forums, blogs, Weibo,
    and other websites based on preset monitoring keywords, and issuing timely warnings
    for sensitive information, notifying relevant parties via email, phone, SMS, etc.,
    at the first moment.


    ### I. Internal & External Public Opinion Focus


    Many enterprises have opened anonymous sections on their intranets where employees
    can speak freely. Internal public opinion analysis results are mainly used for
    two aspects: recommending business-related suggestions to relevant departments
    for reference; handing over public opinion risks regarding labor disputes, recruitment,
    culture promotion, and brand publicity to the HR department for handling. Surveys
    show that the most discussed topics on corporate intranets are compensation &
    benefits, work pressure, cultural atmosphere, external opportunities, personal
    development, and training & learning. For these high-frequency keywords, HR practitioners
    need to take necessary publicity measures, such as organizing compensation policy
    briefings, culture promotion sessions, and team building/training activities to
    relieve employee pressure.


    ### II. Brand Early Warning


    In HR management, brand early warning is mainly used in recruitment and retention.
    Within the bounds of policies and regulations, HR practitioners can use big data
    technology to conduct real-time monitoring, data collection, and data processing
    on information related to the enterprise (including positive, negative, and neutral
    information) in publicly available online data (such as Weibo, forums, social
    media, news sites, professional forums, etc.). Through modeling and algorithmic
    comprehensive analysis, they define the enterprise''s risk bottom line; once exceeded,
    an immediate alarm is triggered, and timely handling is carried out according
    to the contingency plan to avoid public opinion crises and protect the corporate
    brand and image.


    ### III. Culture Iteration


    AI technology can, based on survey results of employee participation in cultural
    activities and integration into the cultural atmosphere, combined with major workplace
    factors (organization, individual, environment, etc.), conduct big data analysis
    on personnel backgrounds and characteristics, and construct structured talent
    retention and incentive indicators across different dimensions. This measure is
    very effective in reducing employee turnover. Simultaneously, robot assistants
    developed using AI technology can solve various problems employees encounter in
    daily work and life 24/7. Especially after analyzing data on employee participation
    in cultural activities, managers can more clearly know what each employee cares
    about and dislikes, and more clearly know how the organization should guide the
    cultural direction.


    ### IV. Talent Migration


    Enterprises can establish an **employee turnover prediction model** through big
    data analysis. This model is mainly used to predict employee attrition and issue
    timely warnings, assisting HR practitioners in early intervention in conjunction
    with the "Internal Talent Succession Table."


    Enterprises can establish a **Talent Migration Map** through big data analysis.
    This map helps HR practitioners timely grasp the dynamics of internal and external
    talents, providing data analysis and decision-making reference for the management
    of entry, exit, promotion, demotion, and transfer.


    # Chapter 6: Organizational Analysis and Organizational Portrait


    At the organizational level, whether it is a pyramid organization, matrix organization,
    spindle organization, or network organization, the requirements of top management
    for the organization are always: organizational flexibility, structural optimization,
    agile configuration, and efficient collaboration.


    At the talent level, managers need to think about how to use big data technology
    to identify and judge who are core employees, who are backbone employees, and
    who are leaders.


    At the cultural level, the requirements of managers for culture are: agile innovation,
    unity of purpose (shared goals), and empowering the organization.


    Based on the needs of the above three levels, HR digitalization can support organizational
    architecture, talent, and corporate culture in four dimensions: process, system,
    data, and user experience. First, processes need to be compliant, efficient, with
    clear responsibilities and authorities; second, systems need to be interconnected,
    combining datafication, scenarization, and intelligence; third, data needs to
    integrate information and conduct detailed analysis to achieve the purpose of
    decision support; finally, user experience needs to run through the entire lifecycle
    of HR management.


    ## Section 1: Organizational Forms and Characteristics


    Organizational form is an invisible, relatively stable enterprise architecture
    formed by the vertical hierarchical relationships and their communication relationships,
    and the horizontal division of labor, collaboration relationships, and their communication
    relationships within the organization. It reflects the division of labor and collaboration
    relationships among organizational members and embodies the framework of division
    of labor and collaboration. Simply put, an enterprise''s organizational form is
    its organizational format, state of existence, and operating mechanism.


    With changes in the era and internal/external environments, organizational forms
    continue to evolve, from line, line-and-staff, to divisional, network, as shown
    in Figure 6-1.


    ![](img/cutq_155_5980_l.jpg)


    **Figure 6-1 Evolution History of Organizational Forms**


    The characteristics of the three traditional organizational forms are: clear hierarchy,
    clear roles, high specialization, strong control. The characteristics of the network
    organization are: flexibility, resilience, rapid response to environmental changes,
    strong innovation.


    Network organizations also have different forms; they will show changes as shown
    in Figure 6-2 at different stages of enterprise development.


