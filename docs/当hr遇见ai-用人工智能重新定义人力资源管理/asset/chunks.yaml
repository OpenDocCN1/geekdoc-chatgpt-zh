- raw: '目前市场上有多种与面试相关的AI产品和服务，但是，有经验的面试官知道仅仅通过关键词评估面试效果是远远不够的。在图像分析和语音分析方面，虽然AI表情分析和AI语音分析功能可以为面试官提供一定的辅助，但面试官仍然需要耗费时间逐一观看视频，从而评估候选人。因此，这类产品对提升面试效率的帮助有限。


    现在，市场上出现了技术更加成熟的AI面试产品，它可以对候选人回答问题的内容进行完整的语义分析并预测候选人的胜任力。这些产品使用更加复杂的AI算法对候选人回答的内容及其回答问题时的表情、声音和仪表进行多维度的深度分析，可以快速筛选出合格的候选人，面试官只需要在AI产品推荐的候选人中挑选最合适的人即可。虽然这一技术还没有完全实现AI自动化分析和评估面试效果，但是已经可以大幅提升面试流程的效率了。


    当前市场上最前沿的产品可以实现AI自主完成结构化面试，甚至可以告诉招聘专员是否录用候选人。此类产品非常适合企业开展大规模招聘活动，如面试量大的集中招聘和校园招聘，可以帮助企业节省大量的招聘成本和时间。


    根据工业组织心理学的研究，在评估候选人方面，结构化面试（Structure Interview,SI）可以比非结构化面试产生更有效的结果。结构化面试就是让候选人在面试过程中回答一系列固定的问题。因此，AI算法主要应用于结构化面试。下面是一个结构化面试的案例。


    请告诉我们您不是正式领导但扮演了领导角色的工作情况。请提供：


    ●有关情况背景的详细信息；


    ●您针对这种情况做出的行为；


    ●行为的结果。


    根据社交信号处理（Social Signal Processing，SSP）理论，人们往往会通过观察和理解对方的行为信号来判断其性格特征，在面试过程中也是如此。面试官通过观察和理解候选人的行为信号对候选人进行性格评估，这些行为信号包括语言表达的内容、面部表情、凝视方向和其他肢体动作等（如表2-1所示）。研究者已经通过实验证实了在面试过程中利用AI技术对候选人进行性格评估的可行性，这一技术被定义为自动性格识别（Automatic
    Personality Recognition，APR）。


    表2-1　面试中需要提取的语言特征


    ![](Images/table_image_62_0.jpg)


    在开始构建算法之前，HR从业者需要对数据进行标注，即通过人工的方式对候选人在面试过程中的表现进行评估。评估方式分为三种，分别是行为尺度量化评估（Behaviorally-anchored
    Rating Scale,BARS）、基于第一印象的性格评估和整体可录用性量化。行为尺度量化评估的操作步骤是，首先收集能够标注为有效工作和无效工作的关键事件（Critical
    Incidents,CIs）；然后将收集到的关键事件编辑为相同的格式并提取绩效类别；之后通过一系列的清洗和筛选得到合适的关键事件及与之相对应的绩效类别，通常需要多人分别标注绩效类别，以保证评估的准确性；最后，审查关键事件和绩效类别，生成最终的评估等级。行为尺度量化评估可以完成在面试中与岗位相关的知识和技能评估。


    基于第一印象的性格评估对每个性格维度的量化评估都采用了7点式李克特量表（7 Point Likert Scale），即1代表完全不同意、2代表不同意、3代表有些不同意、4代表中立、5代表有些同意、6代表同意、7代表完全同意。最后，评估人员根据行为尺度量化评估结果和性格评估结果做出整体可录用性评估结果。需要注意的是，每个评估人员需要对候选人在每一个结构化面试中的表现进行一整套评估，如果有10个候选人和5个结构化面试问题，每个评估人员就需要完成50套评估。


    面试视频分析在技术层面包括图像数据处理、语音数据处理和语言内容数据处理三个部分。招聘专员可以使用OpenCV、Dlib和OpenFace等软件完成图像数据的特征提取工作，提取的特征包括头部的姿态、眼睛凝视的方向、基于人脸特征点（facial
    landmark）的面部表情。语音特征包括语速、音调和停顿等，招聘专员可以通过pyAudioAnalysis和GeMAPS等工具与方法实现。语言内容的特征可通过ASR技术将语言转化为文字，然后通过NLP提取语言特征。


    提取特征后，HR从业者就要构建核心模型，既可以选择传统的机器学习模型，也可以选择深度神经网络模型。传统的机器学习模型相对简单；深度神经网络模型可以实现端到端的学习且模型的能力更强。影响模型架构的重要因素是模型的结果输出，当前主要有两类结果输出，一类是输出候选人的性格评估结果，另一类是输出是否录用候选人的评估结果。


    对于大多数中小公司而言，完全具备上述技术能力并非易事。不过，好消息是市场上已经出现了相应的产品和服务，Hirevue公司开发的AI面试系统正在被越来越多的公司使用。候选人按照要求录制面试视频，然后上传到平台进行评估和打分。Hirevue可以通过语气、词汇使用甚至眼神交流对候选人进行打分和排序。该系统还有一个有趣的功能，那就是线上测试可以对候选人进行快速评估。如果候选人申请技术工作，系统可以加入一个快速编码测试，考验候选人与该职位相关的编程语言的能力。该系统在提交问题时会自动给候选人打分，并将他们放在仪表板中，这样招聘人员就能知道应该优先考虑哪些候选人了。


    ### [四、智能入职](../Text/contents.xhtml#c_26)


    以下三项技术帮助企业实现了新员工办理入职手续的自动化。


    1.OCR技术


    OCR技术是指通过扫描等光学输入方式将各种票据、报刊、书籍、文稿等印刷品的文字转化为图像信息，再利用文字识别技术将图像信息转化为可以输入计算机的信息技术。这一技术的应用已较为广泛和成熟，但过去较少应用于人力资源领域。直到2016年，OCR技术才开始被逐渐应用到人力资源领域。在对新员工进行背景调查时，招聘专员可以让其将学历证书、身份证等信息提前上传至系统，利用OCR技术对信息进行识别，同时对接第三方征信平台（如学信网等），新员工的身份信息验证工作即可快速完成。


    2.刷脸技术


    刷脸技术最初应用于企业的行政部门，主要用于门禁刷脸和内部购物。后来，在办理新员工入职手续的过程中也会用到刷脸技术。例如，新员工在收到公司发出的录取通知书后，可以直接通过刷脸技术获得公司后台发来的二维码，用于提前预约报到。


    3.预约系统——端到端的自动化


    招聘专员在给预约报到的新员工发送预约码的同时，还可以向其推送公司的公共新闻和入职指南。新员工到达公司并出示预约码后，即可根据入职指南直接前往入职手续的办理地点。另外，由于入职工作往往是批量进行的，为了便于管理，新员工的预约码已经与座位号相匹配。座位上也会放置“入职大礼包”，包括新员工的电脑、办公用品、需要签署的文件、办公文具等。这一技术能让原本需要半天甚至一天的时间才能完成的入职手续缩短至不到一个小时。预约系统打通了候选人与反馈系统、入职系统的关联，既可以实现端到端的自动化，还可以大幅提升新员工对公司的好感度。


    入职办理自动化的优势是降低人工成本、提高办事效率，同时确保入职流程的标准化和规范化。目前，入职办理自动化主要有两种方式：随时随地移动端办理入职、智能终端办理入职。随时随地移动端办理入职和智能终端办理入职的具体操作步骤分别如下。


    （1）随时随地移动端办理入职


    第一步，接收录取通知书。候选人在收到录取通知书时点击同意接收，系统就会自动弹出入职办理须知及“入职登记表”填写页面。


    第二步，填写资料。候选人填写“入职登记表”并提交。


    第三步，上传资料。候选人上传入职所需资料的电子版，如身份证或护照、学历学位证书、职称证书、银行卡及制作证件使用的照片等。


    注意，以上三步应在入职前完成，同时伴随着招聘专员的在线背景调查（如链接公安系统、征信系统、学信网或第三方背调专业机构平台）完成。


    第四步，电子签署资料。在入职报到的当天，候选人通过移动端查看劳动合同、保密协议、竞业协议、确认函等，并在线通过电子签章签署相关合同和协议。


    （2）智能终端办理入职


    第一步，接收录取通知书。候选人在收到录取通知书时点击同意接收，系统会自动弹出入职办理须知及“入职登记表”填写页面。


    第二步，填写资料。候选人填写“入职登记表”并提交。


    注意，以上两步于入职前在移动端（手机端）完成。


    第三步，入职验证。在入职报到的当天，候选人根据录取通知书的提示，带上所需的入职资料，来到公司自助智能触摸屏（koisk）前，刷身份证进行人脸识别，进行人证比对核验（后台会同步公安系统、征信系统、学信网或第三方背调专业机构平台）。核验通过后，系统会向候选人发布入职办理须知。


    第四步，资料确认。候选人在koisk上确认“入职登记表”。


    第五步，电子签署资料。签订劳动合同、保密协议、竞业协议及确认函等，候选人可以通过koisk查看并在每页右下角进行电子签名及最后的签字（在此步骤中，后台接入了电子签技术）。


    第六步，提交资料。将所需的入职资料（如身份证或护照、学历学位证书、职称证书、银行卡及制作证件使用的照片等）直接扫描上传、归档（在此步骤中，后台接入了OCR技术）。


    第七步，制作工卡。自动制作工卡、饭卡、门禁卡等，自动获取对应工号、部门等，工卡双面打印且可以是彩色的。至此，入职办理手续完成。


    下面根据前阿里巴巴公司资深产品专家曹星于2020年10月16日在DHR大会上的分享，介绍阿里巴巴公司的入职案例。


    1.事——入离职流程数字化改造


    从各自独立的HR系统到拆分重构成为由数据驱动的数字化平台，再到自动背景调查、录取建议值、电子签章、证件OCR等智能化模式的摸索，阿里巴巴公司的入离职系统经历了如下改造路径。


    以合理发放录取通知书为例。


    首先，实现录取通知书的结构化。对阿里巴巴公司而言，最难的不是设计公司的工资、实现福利的结构化，而是实现股权结构化。阿里巴巴公司的子公司众多，上市情况各不相同。因此，它的股权结构十分复杂，把股权数据通过技术手段拉通后，把候选人的工资、福利、股票等汇总起来，才能计算出这个候选人的总收入。


    其次，是对标。阿里巴巴公司要考虑到他原来公司薪资的涨幅，同时还要考虑竞争对手的情况。阿里巴巴公司的录取通知书背后的薪酬设计都是按照行业规则由咨询公司完成的，但有时咨询公司的数据不够及时、准确和细致，那么，如何自己收集数据，而不依赖于咨询公司，这是阿里巴巴公司需要思考的问题。


    最后，考虑内部公平性的问题。阿里巴巴公司还需要结合候选人的面试表现，考虑相同层级的排名及超均值比例，合理地给他提供有竞争力的薪资。


    2.人——员工数字化


    阿里巴巴公司也在探索如何沉淀各个角度的数据，从而全面、客观、立体、鲜活地评价一个人。在评价一个人时，要把员工和管理者区分开。例如，评价管理者，通过标签刻画他的管理经验如何，管理贡献如何，对团队的贡献是什么，这些都需要通过各种场景去沉淀标签。


    在沉淀了很多过程数据后，就可以对员工进行结构化和非结构化的评估了，从能力、特质、潜力、价值观和内部社会关系等维度综合评判一个人。


    沉淀了员工的标签后，该如何使用呢？


    在招聘场景中，可以通过简历信息、非结构化面试评价、结构化的面试数据提炼出他的优势和劣势，通过数据整合及简历匹配模型进行简历筛选。当面试官查看简历时，仅通过标签赋能就可以快速判断这个候选人是否适合该岗位。


    在培训场景中，可以根据内部培训人员的特征、类似课程参与人员的特点等数据形成人才画像，通过人群圈选的方式使用标签，提高培训的精准度和有效性。


    ## [第三节　人工智能与人才画像](../Text/contents.xhtml#b_27)


    ### [一、人才画像的概念](../Text/contents.xhtml#c_28)


    人才画像是指以岗位要求为基准，定义和描述能够胜任该岗位的人才特征。它由岗位职责和要求（显性信息）与潜质和外延（隐性信息）共同组成。人才画像是人力资源部和业务部门创建的共同语言，是HR从业者在深刻理解数据的基础上得出的虚拟人像。


    1.人才画像中的显性信息和隐性信息


    人才画像中的显性信息和隐性信息如图2-8所示，具体内容分别如下。


    ![](Images/image_69_0_m.jpg)


    图2-8　人才画像中的显性信息和隐性信息


    （1）显性信息


    显性信息可以从系统或报表中直接提取，一般是指以下结构化数据：


    ◇个人信息：性别、年龄、民族、籍贯、政治面貌、所在城市、婚姻状态、生育情况、家庭背景等；


    ◇学历信息：毕业院校、专业、学历、学位、是否统招等；


    ◇工作经历：任职公司、部门、岗位、任职年限、项目经验、担任角色、获奖、专利等；


    ◇工作表现：绩效、晋升、调薪、调动、奖惩等；


    ◇沟通协作：邮件频率、即时通信（IM）频率、会议频率、发帖评论次数、点赞次数等；


    ◇加班出勤：打卡时间、加班、请假、出差等。


    （2）隐性信息


    隐性信息是指图2-8中水平面以下的特征，多为如下非结构化数据，需要通过测评或大数据技术处理得出：


    ◇专业能力：沟通能力、表达能力、总结能力、文档写作能力、创新能力、学习能力、设计能力、运营能力、逻辑能力等；


    ◇胜任能力：领导力、战略思维能力、团队管理能力、计划管理能力、客户导向能力等；


    ◇自我认知：自我观察、自我评价、价值观（包含人生价值观、职业价值观）等；


    ◇人格特质：情绪稳定性、外向性、开放性、随和性、谨慎性等。


    2.关键人才画像


    企业中的关键人才画像包括以下几个部分。


    （1）个人基本信息


    个人基本信息包括性别、年龄、司龄、学历、地域等。


    （2）与工作相关的信息


    与工作相关的信息包括职位、岗位序列、职务、职级、绩效、评价、培训等。


    （3）综合能力体现


    关键人才的综合能力体现在以下几个方面。


    ◇晋升速度，可与普通员工进行比较。


    ◇关键人才在跨领域能力方面的表现，如学习经历中的专业背景变化，工作经历中的职位变化和行业变化。


    ◇绩效与评价。


    ◇潜力指数。


    ◇在人才九宫格中的位置。


    ### [二、哪些岗位适合做人才画像](../Text/contents.xhtml#c_29)


    不是所有岗位都需要进行人才画像，适合做人才画像的岗位如下。


    ●关键核心岗位，如团队领导者、技术负责人等。


    ●专业性强的岗位，如数据库开发工程师、JAVA程序员。


    ●在同一职位中有很多任职者，且对企业业绩影响比较大的岗位，如产品经理。


    ●企业批量招聘的岗位，如管培生等。


    ### [三、人才画像的应用场景](../Text/contents.xhtml#c_30)


    人才画像多用于企业对核心人才的选、用、育、留等环节。人才画像的具体应用场景如下。


    1.人才选拔。在出现人才供应的速度难以跟上业务发展的速度、严重依赖外部人才供给、部分岗位的业绩不佳、人才队伍臃肿亟待优化、关键人才流失严重等问题时，企业需要进行人才画像。


    2.人才任用。在出现人岗不匹配、团队成员配置不科学、转型阶段需要任用新类型的员工等问题时，企业需要进行人才画像。


    3.人才培养。在收集与分析培训需求、扫描与评估领导力现状、评估培训效果时，企业可以进行人才画像。


    4.人才激励。在出现优秀人才无法充分发挥能力与主观能动性等问题时，企业可以进行人才画像。


    5.人才配置。通过岗位和人才的匹配度分析，人才画像可以让人才和岗位实现最佳配置，有效降低用人成本、提高工作效率。


    ### [四、人才画像的步骤](../Text/contents.xhtml#c_31)


    人才画像的操作步骤如下。


    第一步，采集数据。


    需要采集的数据（核心要素）包括员工的基本信息、工作经历、教育背景、工作表现、沟通协作情况、加班出勤频率、评价反馈意见、人格特质、专业技能、胜任能力、自我认知和价值观等。


    采集渠道包括人才档案、招聘需求表、岗位说明书和人才样本（目标对象的人才样本）。


    采集数据的方法包括检索、调研、访谈、关键事件法等。


    第二步，整合归类。根据八个要素（工作压力、晋升轮岗、人才发展、培训学习、薪酬绩效、文化氛围、外部热点、办公环境）进行分类，按相近性整合归纳等。


    第三步，提炼数据。去粗取精，提炼具有共性的典型特征。


    第四步，构建画像。按优先级进行排序，完善画像，同时加入语言描述，如场景描述，做到数字化、标签化。


    第五步，验证测试。在招聘的过程中不断验证、不断修正，保持人才画像的及时更新和生命力等。


    ### [五、人工智能驱动的人才画像](../Text/contents.xhtml#c_32)


    随着人工智能、大数据技术的发展，数据采集、挖掘、清洗与加工工作变得更加轻松了，模型、算法被越来越广泛地应用于人力资源的选、用、育、留等场景中。


    上文提到，人才画像可以分为八个要素，即工作压力、晋升轮岗、人才发展、培训学习、薪酬绩效、文化氛围、外部热点、办公环境，这些要素贯穿了员工职业生涯的全过程。这八个要素及其细分项如图2-9所示。


    1.工作压力。员工的工作压力主要来自于工作中，大多因同事之间的竞争关系、工作任务过重、工作责任过大而产生。压力既是一种正向的、强大的推动力，也是一个影响员工工作绩效和职业健康的消极因素。工作压力的细分项一般包括上下级关系、同事关系、竞争行为、职责变换、加班频次、会议频次、休闲时间等。


    2.晋升轮岗。在大部分互联网企业中，一般一年进行两次专业晋升，分别是春季晋升与秋季晋升。轮岗主要是针对高潜干部培养的机制。晋升轮岗的细分项一般包括速度、频次、失败率、效率、行为、反馈等。


    3.人才发展。人才发展的细分项一般包括工作经历、个人技能、职业规划、发展潜力等。


    4.培训学习。培训学习的细分项一般包括学习计划、学习参与、学习反馈、学习推荐等。


    ![](Images/cutq_74_8350_l.jpg)


    图2-9　人才画像的八个要素及其细分项


    5.薪酬绩效。薪酬绩效的细分项一般包括工作目标、敏捷沟通、考核、评估反馈、评价、调薪、奖金、薪酬福利等。


    6.文化氛围。文化氛围的细分项一般包括社区、满意度、敬业度等。


    7.外部热点。外部热点的细分项一般包括市场行情、竞品动态、创业机会、投资热度等。


    8.办公环境。办公环境的细分项一般包括环境调整、刷脸进出、健身设施、餐饮环境等。


    人才画像的本质是从海量的人员数据中抽象建模出每个人的属性标签体系。在技术架构上，人才画像系统包括多个功能模块，分别是数据收集、特征计算、特征库维护、机器学习模型、应用接口和画像应用。员工标签体系的构建应该分层次、分批次完成，可以根据以上八个要素和多个细分项进行分类。


    这八个要素和多个细分项的数据分别来自企业的内部系统（如人力资源的“入离升降调、选用育留辞”+财务系统+经营系统），以及外部市场与调查机构。这些数据经过清洗与加工，存储在Hadoop、Spark或HBase等大数据仓库中。


    常用的算法模型有逻辑回归、线性回归、深度学习类、基于树的集成学习类、因子分解类等，在人才画像的实际应用过程中经常会组合使用。


    可视化是将结果以仪表盘或看板的形式展示给用户，供用户判断与决策参考。'
  fmt: '

    ## 三、智能面试


    目前市场上有多种与面试相关的AI产品和服务，但是，有经验的面试官知道仅仅通过关键词评估面试效果是远远不够的。在图像分析和语音分析方面，虽然`AI表情分析`和`AI语音分析`功能可以为面试官提供一定的辅助，但面试官仍然需要耗费时间逐一观看视频，从而评估候选人。因此，这类产品对提升面试效率的帮助有限。


    现在，市场上出现了技术更加成熟的AI面试产品，它可以对候选人回答问题的内容进行完整的语义分析并预测候选人的胜任力。这些产品使用更加复杂的AI算法对候选人回答的内容及其回答问题时的表情、声音和仪表进行多维度的深度分析，可以快速筛选出合格的候选人，面试官只需要在AI产品推荐的候选人中挑选最合适的人即可。虽然这一技术还没有完全实现AI自动化分析和评估面试效果，但是已经可以大幅提升面试流程的效率了。


    当前市场上最前沿的产品可以实现AI自主完成结构化面试，甚至可以告诉招聘专员是否录用候选人。此类产品非常适合企业开展大规模招聘活动，如面试量大的集中招聘和校园招聘，可以帮助企业节省大量的招聘成本和时间。


    根据工业组织心理学的研究，在评估候选人方面，结构化面试（`Structure Interview`，`SI`）可以比非结构化面试产生更有效的结果。结构化面试就是让候选人在面试过程中回答一系列固定的问题。因此，AI算法主要应用于结构化面试。下面是一个结构化面试的案例。


    > 请告诉我们您不是正式领导但扮演了领导角色的工作情况。请提供：

    >

    > ● 有关情况背景的详细信息；

    > ● 您针对这种情况做出的行为；

    > ● 行为的结果。


    根据社交信号处理（`Social Signal Processing`，`SSP`）理论，人们往往会通过观察和理解对方的行为信号来判断其性格特征，在面试过程中也是如此。面试官通过观察和理解候选人的行为信号对候选人进行性格评估，这些行为信号包括语言表达的内容、面部表情、凝视方向和其他肢体动作等（如表2-1所示）。研究者已经通过实验证实了在面试过程中利用AI技术对候选人进行性格评估的可行性，这一技术被定义为自动性格识别（`Automatic
    Personality Recognition`，`APR`）。


    **表2-1　面试中需要提取的语言特征**


    ![](Images/table_image_62_0.jpg)


    在开始构建算法之前，HR从业者需要对数据进行标注，即通过人工的方式对候选人在面试过程中的表现进行评估。评估方式分为三种，分别是行为尺度量化评估（`Behaviorally-anchored
    Rating Scale`，`BARS`）、基于第一印象的性格评估和整体可录用性量化。行为尺度量化评估的操作步骤是，首先收集能够标注为有效工作和无效工作的关键事件（`Critical
    Incidents`，`CIs`）；然后将收集到的关键事件编辑为相同的格式并提取绩效类别；之后通过一系列的清洗和筛选得到合适的关键事件及与之相对应的绩效类别，通常需要多人分别标注绩效类别，以保证评估的准确性；最后，审查关键事件和绩效类别，生成最终的评估等级。行为尺度量化评估可以完成在面试中与岗位相关的知识和技能评估。


    基于第一印象的性格评估对每个性格维度的量化评估都采用了`7 Point Likert Scale`，即1代表完全不同意、2代表不同意、3代表有些不同意、4代表中立、5代表有些同意、6代表同意、7代表完全同意。最后，评估人员根据行为尺度量化评估结果和性格评估结果做出整体可录用性评估结果。需要注意的是，每个评估人员需要对候选人在每一个结构化面试中的表现进行一整套评估，如果有10个候选人和5个结构化面试问题，每个评估人员就需要完成50套评估。


    面试视频分析在技术层面包括图像数据处理、语音数据处理和语言内容数据处理三个部分。招聘专员可以使用`OpenCV`、`Dlib`和`OpenFace`等软件完成图像数据的特征提取工作，提取的特征包括头部的姿态、眼睛凝视的方向、基于人脸特征点（`facial
    landmark`）的面部表情。语音特征包括语速、音调和停顿等，招聘专员可以通过`pyAudioAnalysis`和`GeMAPS`等工具与方法实现。语言内容的特征可通过`ASR`技术将语言转化为文字，然后通过`NLP`提取语言特征。


    提取特征后，HR从业者就要构建核心模型，既可以选择传统的机器学习模型，也可以选择深度神经网络模型。传统的机器学习模型相对简单；深度神经网络模型可以实现端到端的学习且模型的能力更强。影响模型架构的重要因素是模型的结果输出，当前主要有两类结果输出，一类是输出候选人的性格评估结果，另一类是输出是否录用候选人的评估结果。


    对于大多数中小公司而言，完全具备上述技术能力并非易事。不过，好消息是市场上已经出现了相应的产品和服务，`Hirevue`公司开发的AI面试系统正在被越来越多的公司使用。候选人按照要求录制面试视频，然后上传到平台进行评估和打分。`Hirevue`可以通过语气、词汇使用甚至眼神交流对候选人进行打分和排序。该系统还有一个有趣的功能，那就是线上测试可以对候选人进行快速评估。如果候选人申请技术工作，系统可以加入一个快速编码测试，考验候选人与该职位相关的编程语言的能力。该系统在提交问题时会自动给候选人打分，并将他们放在仪表板中，这样招聘人员就能知道应该优先考虑哪些候选人了。


    ## 四、智能入职


    以下三项技术帮助企业实现了新员工办理入职手续的自动化。


    #### 1. OCR技术


    `OCR`技术是指通过扫描等光学输入方式将各种票据、报刊、书籍、文稿等印刷品的文字转化为图像信息，再利用文字识别技术将图像信息转化为可以输入计算机的信息技术。这一技术的应用已较为广泛和成熟，但过去较少应用于人力资源领域。直到2016年，`OCR`技术才开始被逐渐应用到人力资源领域。在对新员工进行背景调查时，招聘专员可以让其将学历证书、身份证等信息提前上传至系统，利用`OCR`技术对信息进行识别，同时对接第三方征信平台（如学信网等），新员工的身份信息验证工作即可快速完成。


    #### 2. 刷脸技术


    刷脸技术最初应用于企业的行政部门，主要用于门禁刷脸和内部购物。后来，在办理新员工入职手续的过程中也会用到刷脸技术。例如，新员工在收到公司发出的录取通知书后，可以直接通过刷脸技术获得公司后台发来的二维码，用于提前预约报到。


    #### 3. 预约系统——端到端的自动化


    招聘专员在给预约报到的新员工发送预约码的同时，还可以向其推送公司的公共新闻和入职指南。新员工到达公司并出示预约码后，即可根据入职指南直接前往入职手续的办理地点。另外，由于入职工作往往是批量进行的，为了便于管理，新员工的预约码已经与座位号相匹配。座位上也会放置“入职大礼包”，包括新员工的电脑、办公用品、需要签署的文件、办公文具等。这一技术能让原本需要半天甚至一天的时间才能完成的入职手续缩短至不到一个小时。预约系统打通了候选人与反馈系统、入职系统的关联，既可以实现端到端的自动化，还可以大幅提升新员工对公司的好感度。


    入职办理自动化的优势是降低人工成本、提高办事效率，同时确保入职流程的标准化和规范化。目前，入职办理自动化主要有两种方式：随时随地移动端办理入职、智能终端办理入职。随时随地移动端办理入职和智能终端办理入职的具体操作步骤分别如下。


    #### (1) 随时随地移动端办理入职


    **第一步，接收录取通知书。** 候选人在收到录取通知书时点击同意接收，系统就会自动弹出入职办理须知及“入职登记表”填写页面。


    **第二步，填写资料。** 候选人填写“入职登记表”并提交。


    **第三步，上传资料。** 候选人上传入职所需资料的电子版，如身份证或护照、学历学位证书、职称证书、银行卡及制作证件使用的照片等。


    > **注意：** 以上三步应在入职前完成，同时伴随着招聘专员的在线背景调查（如链接公安系统、征信系统、学信网或第三方背调专业机构平台）完成。


    **第四步，电子签署资料。** 在入职报到的当天，候选人通过移动端查看劳动合同、保密协议、竞业协议、确认函等，并在线通过电子签章签署相关合同和协议。


    #### (2) 智能终端办理入职


    **第一步，接收录取通知书。** 候选人在收到录取通知书时点击同意接收，系统会自动弹出入职办理须知及“入职登记表”填写页面。


    **第二步，填写资料。** 候选人填写“入职登记表”并提交。


    > **注意：** 以上两步于入职前在移动端（手机端）完成。


    **第三步，入职验证。** 在入职报到的当天，候选人根据录取通知书的提示，带上所需的入职资料，来到公司自助智能触摸屏（`koisk`）前，刷身份证进行人脸识别，进行人证比对核验（后台会同步公安系统、征信系统、学信网或第三方背调专业机构平台）。核验通过后，系统会向候选人发布入职办理须知。


    **第四步，资料确认。** 候选人在`koisk`上确认“入职登记表”。


    **第五步，电子签署资料。** 签订劳动合同、保密协议、竞业协议及确认函等，候选人可以通过`koisk`查看并在每页右下角进行电子签名及最后的签字（在此步骤中，后台接入了电子签技术）。


    **第六步，提交资料。** 将所需的入职资料（如身份证或护照、学历学位证书、职称证书、银行卡及制作证件使用的照片等）直接扫描上传、归档（在此步骤中，后台接入了`OCR`技术）。


    **第七步，制作工卡。** 自动制作工卡、饭卡、门禁卡等，自动获取对应工号、部门等，工卡双面打印且可以是彩色的。至此，入职办理手续完成。


    下面根据前阿里巴巴公司资深产品专家曹星于2020年10月16日在DHR大会上的分享，介绍阿里巴巴公司的入职案例。


    #### 1. 事——入离职流程数字化改造


    从各自独立的HR系统到拆分重构成为由数据驱动的数字化平台，再到自动背景调查、录取建议值、电子签章、证件`OCR`等智能化模式的摸索，阿里巴巴公司的入离职系统经历了如下改造路径。


    以合理发放录取通知书为例。


    首先，实现录取通知书的结构化。对阿里巴巴公司而言，最难的不是设计公司的工资、实现福利的结构化，而是实现股权结构化。阿里巴巴公司的子公司众多，上市情况各不相同。因此，它的股权结构十分复杂，把股权数据通过技术手段拉通后，把候选人的工资、福利、股票等汇总起来，才能计算出这个候选人的总收入。


    其次，是对标。阿里巴巴公司要考虑到他原来公司薪资的涨幅，同时还要考虑竞争对手的情况。阿里巴巴公司的录取通知书背后的薪酬设计都是按照行业规则由咨询公司完成的，但有时咨询公司的数据不够及时、准确和细致，那么，如何自己收集数据，而不依赖于咨询公司，这是阿里巴巴公司需要思考的问题。


    最后，考虑内部公平性的问题。阿里巴巴公司还需要结合候选人的面试表现，考虑相同层级的排名及超均值比例，合理地给他提供有竞争力的薪资。


    #### 2. 人——员工数字化


    阿里巴巴公司也在探索如何沉淀各个角度的数据，从而全面、客观、立体、鲜活地评价一个人。在评价一个人时，要把员工和管理者区分开。例如，评价管理者，通过标签刻画他的管理经验如何，管理贡献如何，对团队的贡献是什么，这些都需要通过各种场景去沉淀标签。


    在沉淀了很多过程数据后，就可以对员工进行结构化和非结构化的评估了，从能力、特质、潜力、价值观和内部社会关系等维度综合评判一个人。


    沉淀了员工的标签后，该如何使用呢？


    在招聘场景中，可以通过简历信息、非结构化面试评价、结构化的面试数据提炼出他的优势和劣势，通过数据整合及简历匹配模型进行简历筛选。当面试官查看简历时，仅通过标签赋能就可以快速判断这个候选人是否适合该岗位。


    在培训场景中，可以根据内部培训人员的特征、类似课程参与人员的特点等数据形成人才画像，通过人群圈选的方式使用标签，提高培训的精准度和有效性。


    ## 第三节　人工智能与人才画像


    ### 一、人才画像的概念


    人才画像是指以岗位要求为基准，定义和描述能够胜任该岗位的人才特征。它由岗位职责和要求（显性信息）与潜质和外延（隐性信息）共同组成。人才画像是人力资源部和业务部门创建的共同语言，是HR从业者在深刻理解数据的基础上得出的虚拟人像。


    #### 1. 人才画像中的显性信息和隐性信息


    人才画像中的显性信息和隐性信息如图2-8所示，具体内容分别如下。


    ![](Images/image_69_0_m.jpg)


    **图2-8　人才画像中的显性信息和隐性信息**


    **显性信息**


    显性信息可以从系统或报表中直接提取，一般是指以下结构化数据：


    ◇ 个人信息：性别、年龄、民族、籍贯、政治面貌、所在城市、婚姻状态、生育情况、家庭背景等；

    ◇ 学历信息：毕业院校、专业、学历、学位、是否统招等；

    ◇ 工作经历：任职公司、部门、岗位、任职年限、项目经验、担任角色、获奖、专利等；

    ◇ 工作表现：绩效、晋升、调薪、调动、奖惩等；

    ◇ 沟通协作：邮件频率、即时通信（`IM`）频率、会议频率、发帖评论次数、点赞次数等；

    ◇ 加班出勤：打卡时间、加班、请假、出差等。


    **隐性信息**


    隐性信息是指图2-8中水平面以下的特征，多为如下非结构化数据，需要通过测评或大数据技术处理得出：


    ◇ 专业能力：沟通能力、表达能力、总结能力、文档写作能力、创新能力、学习能力、设计能力、运营能力、逻辑能力等；

    ◇ 胜任能力：领导力、战略思维能力、团队管理能力、计划管理能力、客户导向能力等；

    ◇ 自我认知：自我观察、自我评价、价值观（包含人生价值观、职业价值观）等；

    ◇ 人格特质：情绪稳定性、外向性、开放性、随和性、谨慎性等。


    #### 2. 关键人才画像


    企业中的关键人才画像包括以下几个部分。


    **个人基本信息**


    个人基本信息包括性别、年龄、司龄、学历、地域等。


    **与工作相关的信息**


    与工作相关的信息包括职位、岗位序列、职务、职级、绩效、评价、培训等。


    **综合能力体现**


    关键人才的综合能力体现在以下几个方面。


    ◇ 晋升速度，可与普通员工进行比较。

    ◇ 关键人才在跨领域能力方面的表现，如学习经历中的专业背景变化，工作经历中的职位变化和行业变化。

    ◇ 绩效与评价。

    ◇ 潜力指数。

    ◇ 在人才九宫格中的位置。


    ### 二、哪些岗位适合做人才画像


    不是所有岗位都需要进行人才画像，适合做人才画像的岗位如下。


    ● 关键核心岗位，如团队领导者、技术负责人等。

    ● 专业性强的岗位，如数据库开发工程师、`JAVA`程序员。

    ● 在同一职位中有很多任职者，且对企业业绩影响比较大的岗位，如产品经理。

    ● 企业批量招聘的岗位，如管培生等。


    ### 三、人才画像的应用场景


    人才画像多用于企业对核心人才的选、用、育、留等环节。人才画像的具体应用场景如下。


    1. **人才选拔。** 在出现人才供应的速度难以跟上业务发展的速度、严重依赖外部人才供给、部分岗位的业绩不佳、人才队伍臃肿亟待优化、关键人才流失严重等问题时，企业需要进行人才画像。

    2. **人才任用。** 在出现人岗不匹配、团队成员配置不科学、转型阶段需要任用新类型的员工等问题时，企业需要进行人才画像。

    3. **人才培养。** 在收集与分析培训需求、扫描与评估领导力现状、评估培训效果时，企业可以进行人才画像。

    4. **人才激励。** 在出现优秀人才无法充分发挥能力与主观能动性等问题时，企业可以进行人才画像。

    5. **人才配置。** 通过岗位和人才的匹配度分析，人才画像可以让人才和岗位实现最佳配置，有效降低用人成本、提高工作效率。


    ### 四、人才画像的步骤


    人才画像的操作步骤如下。


    **第一步，采集数据。**


    需要采集的数据（核心要素）包括员工的基本信息、工作经历、教育背景、工作表现、沟通协作情况、加班出勤频率、评价反馈意见、人格特质、专业技能、胜任能力、自我认知和价值观等。


    采集渠道包括人才档案、招聘需求表、岗位说明书和人才样本（目标对象的人才样本）。


    采集数据的方法包括检索、调研、访谈、关键事件法等。


    **第二步，整合归类。** 根据八个要素（工作压力、晋升轮岗、人才发展、培训学习、薪酬绩效、文化氛围、外部热点、办公环境）进行分类，按相近性整合归纳等。


    **第三步，提炼数据。** 去粗取精，提炼具有共性的典型特征。


    **第四步，构建画像。** 按优先级进行排序，完善画像，同时加入语言描述，如场景描述，做到数字化、标签化。


    **第五步，验证测试。** 在招聘的过程中不断验证、不断修正，保持人才画像的及时更新和生命力等。


    ### 五、人工智能驱动的人才画像


    随着人工智能、大数据技术的发展，数据采集、挖掘、清洗与加工工作变得更加轻松了，模型、算法被越来越广泛地应用于人力资源的选、用、育、留等场景中。


    上文提到，人才画像可以分为八个要素，即工作压力、晋升轮岗、人才发展、培训学习、薪酬绩效、文化氛围、外部热点、办公环境，这些要素贯穿了员工职业生涯的全过程。这八个要素及其细分项如图2-9所示。


    #### 1. 工作压力


    员工的工作压力主要来自于工作中，大多因同事之间的竞争关系、工作任务过重、工作责任过大而产生。压力既是一种正向的、强大的推动力，也是一个影响员工工作绩效和职业健康的消极因素。工作压力的细分项一般包括上下级关系、同事关系、竞争行为、职责变换、加班频次、会议频次、休闲时间等。


    #### 2. 晋升轮岗


    在大部分互联网企业中，一般一年进行两次专业晋升，分别是春季晋升与秋季晋升。轮岗主要是针对高潜干部培养的机制。晋升轮岗的细分项一般包括速度、频次、失败率、效率、行为、反馈等。


    #### 3. 人才发展


    人才发展的细分项一般包括工作经历、个人技能、职业规划、发展潜力等。


    #### 4. 培训学习


    培训学习的细分项一般包括学习计划、学习参与、学习反馈、学习推荐等。


    ![](Images/cutq_74_8350_l.jpg)


    **图2-9　人才画像的八个要素及其细分项**


    #### 5. 薪酬绩效


    薪酬绩效的细分项一般包括工作目标、敏捷沟通、考核、评估反馈、评价、调薪、奖金、薪酬福利等。


    #### 6. 文化氛围


    文化氛围的细分项一般包括社区、满意度、敬业度等。


    #### 7. 外部热点


    外部热点的细分项一般包括市场行情、竞品动态、创业机会、投资热度等。


    #### 8. 办公环境


    办公环境的细分项一般包括环境调整、刷脸进出、健身设施、餐饮环境等。


    人才画像的本质是从海量的人员数据中抽象建模出每个人的属性标签体系。在技术架构上，人才画像系统包括多个功能模块，分别是数据收集、特征计算、特征库维护、机器学习模型、应用接口和画像应用。员工标签体系的构建应该分层次、分批次完成，可以根据以上八个要素和多个细分项进行分类。


    这八个要素和多个细分项的数据分别来自企业的内部系统（如人力资源的“入离升降调、选用育留辞”+财务系统+经营系统），以及外部市场与调查机构。这些数据经过清洗与加工，存储在`Hadoop`、`Spark`或`HBase`等大数据仓库中。


    常用的算法模型有`逻辑回归`、`线性回归`、`深度学习`、`基于树的集成学习`、`因子分解`等，在人才画像的实际应用过程中经常会组合使用。


    可视化是将结果以仪表盘或看板的形式展示给用户，供用户判断与决策参考。

