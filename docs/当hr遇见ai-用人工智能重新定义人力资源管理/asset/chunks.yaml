    # 人工智能对员工敬业度的分析可以扩展到员工绩效管理领域


    员工绩效管理中的一个关键问题是如何设定绩效评估的参考标准，包括外部标准和内部标准。外部标准包括本公司员工的绩效水平在所在行业中处于什么位置，和竞争对手相比有何不同，公司在提升员工绩效方面是否有独到的方法或者只是模仿别人的策略。内部标准包括高绩效员工优于其他员工的核心因素是什么；管理者可以轻松挑选出高绩效员工，但不是所有管理者都能清晰地说出挑选的标准；能否将挑选过程进行量化和流程化并保持客观性。在大多数公司中，绩效管理的过程与预期的结果无关，绩效管理系统可以跟踪员工的绩效，但在帮助员工提升绩效水平方面的作用却乏善可陈。人工智能技术可以帮助管理者改进这个流程，在关键时刻支持管理者。例如，公司希望管理者对员工表现进行及时反馈和指导，但在实施过程中，这无疑会受到管理者时间安排和工作风格的影响，并为管理者带来一定的压力。人工智能技术可以帮助管理者及时注意到员工的异常表现，这样他们就不会错过向员工提供反馈和指导的机会。


    更重要的是，人工智能技术可以利用历史数据和实时数据预测员工的业绩。一个高绩效员工的特征可以用来为一个特定的岗位建立画像，这个画像可以用于组织的员工招聘和筛选流程。许多公司还会通过定期的组织调查衡量员工的工作满意度。这些数据都可以与员工绩效数据相关联。


    对员工绩效数据进行分析与其他人力资源场景密切相关，如员工培训、职业生涯规划和人才保留等。员工在特定部门或岗位上的绩效水平明显下降既可能与员工的能力有关，也可能是由于同一部门的员工数量不足，还有可能因为员工缺少特定的技能培训。管理者还可以根据员工过去的经验、技能和表现判断其是否满足特定职位的晋升要求。


    一家大型连锁服务公司在经历了严重的客户流失之后，希望通过提升员工绩效水平来扭转局面。在咨询机构的帮助下，他们重构了员工绩效管理流程，将员工的绩效评估结果与相关的业务结果联系起来。这些业务结果被确定为每个运营连锁商店的客户数量、客户满意度和员工满意度，然后确定直接影响这些业务结果的员工指标，如岗位匹配度、团队合作情况、高级领导能力、沟通能力、薪酬水平、职业发展方向、客户关注度等。这些因素的得分被映射到相关业务结果上，并利用算法进行分析。最终筛选出并可视化那些对业务结果影响最大的业务驱动因素，这些因素按照观察、维护、提升和聚焦等几个等级进行分类。根据这些分类对每个店面的经理的绩效考核权重进行设计。在这项改革完成后的一年时间内，该连锁服务公司的客户满意度提升了20%以上，与此同时员工流失率下降了10%以上。


    ## 三、智慧薪酬数据分析平台


    参考链接：`../Text/contents.xhtml#c_51`


    在人才竞争越来越激烈的当下，如何留住关键人才已成为企业面临的一个巨大挑战。在某些行业中，员工在一家公司的平均工作时间甚至已经低于两年。企业招聘和留住关键人才的一个重要策略就是提供有竞争力的薪酬和激励方案。人力资源数据分析可以为管理者制定薪酬决策提供技术支持。


    ### 1. 智慧薪酬数据分析平台


    在人力资源数据分析中占比最大的模块就是薪酬。HR从业者在处理薪酬模块的数据时，要先进行工资数据分析（如计算方法、构成分析、工资支出、预算分析），再进行薪酬政策的数据分析。具体来讲，HR从业者有如下主要分析活动：


    - 人力投入分析

    - 人工成本分析

    - 人均效能分析

    - 人员激励分析

    - 外部对标与竞品分析

    - 薪酬政策数据分析

    - 预算分析


    如何才能进行有效的分析呢？HR从业者需要搭建一个薪酬管理数据分析平台，如图3-8所示。搭建方法类似于人力资源大数据平台或依托人力资源大数据平台。


    ![](Images/cutq_109_4696_l.jpg)


    图3-8 薪酬管理数据分析平台


    薪酬管理数据分析平台可以分为系统层、大数据支持层、AI技术应用层和可视化层。


    #### 系统层

    企业可充分利用信息化、数字化、人工智能等技术建设相关系统或App，收集与沉淀数据。这些数据分为内部数据与外部数据两种。内部数据包括来自于组织、岗位、薪酬、考勤、入离升降调、选用育留管、OA、门户论坛、门禁、刷脸、财务、运营等系统的数据；外部数据包括来自于外部市场的分析数据、行业数据、竞品公司的数据、薪酬调研报告的数据等。


    #### 大数据支持层

    通过数据整理、清洗、加工，对信息进行分类、归档，存储于数据仓库中，以便后续用于与薪酬相关的大数据分析活动。


    #### AI技术应用层

    运用AI的计算能力开展构建大数据算法模型、机器学习、数据训练、场景分析、主题分析等活动。


    #### 可视化层

    也称展示层、看板层，它主要为企业管理者、HRBP、HRCOE提供各类看板产品和预警预测，为运营分析及管理判断提供智能参考，如智慧算薪、智慧考勤、薪酬定价、监控预警平台（工资总额接近或超过预算警戒线、工资月度变动异常预警、激励过度分析预警等）。


    企业运用人工智能技术不仅能够快速且有效地分析、处理员工信息，而且可以利用“互联网+大数据”的优势，深入挖掘市场的薪酬调查数据，通过算法模型制定适合企业的薪酬管理方案。同时，人工智能技术可以帮助企业实时监控市场行情，控制薪酬成本，预测企业发展趋势，为企业高层管理者及HR从业者的薪酬管理决策提供可靠的依据。


    ### 2. 薪资-技能神经网络模型


    工作技能价值作为劳动力市场中重要的经济学指标，它不仅可以辅助管理者开展个人能力评估工作，而且可以帮助企业改善薪资结构，吸引和保留人才。那么，人工智能技术能否对工作技能价值评估进行“精加工”呢？


    一篇“AI+人才管理”领域的最新研究成果登上了国际顶级刊物《自然》的子刊《自然·通信》。该研究首次使用了数据驱动的方法，通过机器学习技术探索了薪资与工作技能价值评估的关系这一重要问题，对社会劳动价值分配机制的合理性和公平性设计、社会劳动力保障、智能招聘和精准就业、个性化职业教育等多个领域均有重要价值。以下为该篇论文的内容节选。


    公司对薪酬设定的主要依据是员工为公司创造的价值，人力资源管理实践带给我们的经验是员工创造价值的多少与员工的技能水平、敬业度和文化认同等因素有着密切的联系。特别是对需要专业技能的岗位来说，员工的技能水平起着至关重要的作用，如工程师、医生和律师等。但是长期以来，我们一直缺少对影响员工创造价值的因素进行量化分析的方法和工具。因此，公司通常只能采用基于结果的方法对员工创造的价值进行评估。例如，公司以季度或年度为周期评估员工创造的价值，进而对薪酬结构进行调整。这种方法有着严重的缺陷。首先是滞后性。如果一名员工因为技能水平和敬业度等方面的问题，其为公司创造的价值已不能达到公司的要求，公司只有在一个评估周期结束后才能发现这一点，但是他为公司造成的损失已经形成，公司无法提前或者在发生的过程中控制这种风险。其次是模糊性。因为对影响员工创造价值的因素缺少系统性的量化分析，公司无法采取精准的方法优化和提升员工创造价值的能力与水平。


    好消息是人工智能的最新研究架起了薪酬与工作技能价值评估之间的桥梁。百度人才智库、中国科学院、北京航空航天大学、中国科学技术大学和美国罗格斯大学的研究人员合作构建了一种具有协同结构的薪资–技能神经网络模型（`Salary-Skill
    Composition Network`，`SSCN`）。这一模型旨在建立工作技能熟练程度与工作薪资之间的量化关系，并且可以将技能价值作为独立变量，分析其对工作薪资的影响。模型通过分析大量招聘信息中的技能要求和薪酬数据，完成了两项任务：实现技能的价值评估和薪酬预测。在技能价值评估方面，模型可以基于工作场景和岗位场景实现细颗粒度的技能价值评估。在薪酬预测方面，`SSCN`模型超过了`SVM`、`LR`、`GBDT`和其他一系列深度神经网络模型实现了新的`SOTA`精度。这一研究成果为数据驱动的量化薪酬研究提供了新的方法和算法模型。


    目前，该项研究的相关算法已经在百度智能招聘的相关产品中落地，它可以助力智能招聘系统客观、科学地进行简历评估和人岗匹配。除了内部应用外，百度智能招聘系统通过百度大脑对外提供了智能招聘解决方案，将AI算力与合适的算法模型相结合，为企业提供了更加高效的智能化招聘服务，把招聘专员从海量简历筛选和琐碎的沟通中解放出来，帮助企业节省招聘成本，在企业招聘的智能化、数字化发展方面起到了很大的推进作用。


    ## 四、薪酬智能小助手


    参考链接：`../Text/contents.xhtml#c_52`


    薪酬智能小助手是指企业利用人工智能、机器学习、大数据算法模型构建薪酬大数据分析平台，使用市场数据及用户自助数据，帮助人力资源机构、人力资源从业者或企业管理者全面、实时了解市场职位供需情况及工资行情，辅助进行判断与决策，达到知己知彼、保持竞争优势的目的。


    薪酬智能小助手主要应用于如下三个场景。


    ### 1. 市场职位预测

    薪酬智能小助手可以帮助企业管理者了解某一职位在市场中的供需情况，从而决定企业的招聘策略，可以输出“市场职位全面分析报告”“市场职位行业分析报告”等。


    ### 2. 薪酬模拟器

    个人用户上传自己的薪资后就可以知道自己的薪资水平在外部市场上的排名。企业用户则可以根据模板输入本企业相应的内部数据信息，并上传到模拟器平台，与市场数据进行对标，从而得到相关薪酬报告。


    ### 3. 录取通知书模拟器

    企业用户使用录取通知书模拟器，可以计算出是用100万元招聘一个P8级的高级专家，还是招聘四个P6级程序员；或者计算在规定的预算费用内每个级别可以招聘多少人。如果企业的招聘专员不太熟悉本行业的市场薪酬情况，就可以在录取通知书模拟器上传拟招聘的岗位与预估薪资，从而对标外部市场，了解本企业的薪酬结构是否具有外部竞争力。


    ## 五、福利画像


    参考链接：`../Text/contents.xhtml#c_53`


    随着全球经济、就业环境、企业人才结构的持续变化与人才需求的多元化发展，员工福利作为企业全面薪酬策略、雇主品牌建设、人才激励的重要组成部分，已经成为企业人才吸引、人才激励与人才保留的重要因素和关键策略。因此，企业管理者开始关注如何发放员工福利才会让员工更有归属感。


    ### 1. 员工福利计划

    员工福利计划是指企业为员工提供的非工资收入的一揽子计划。员工福利计划一般包括以下几类：


    - **法定计划**：指国家立法强制实施的社会保障制度，包括基本养老保险、医疗保险、失业保险、工伤保险等；

    - **自主计划**：主要包括员工补充养老保险、人寿保险、健康保险、意外保险、体检、子女保险、配偶保险、父母保险等；

    - **员工协助方案**：指员工帮助计划（`EAP`）、心理咨询等；

    - **生活支持**：包括年节礼金、生日金、婚丧嫁娶礼金、周年纪念、津贴等；

    - **工作生活平衡**：包括设立各类俱乐部、组织各类集体活动、建立母婴室及睡眠室等。


    ### 2. 数字化时代的员工福利平台发展路径


    #### (1) 传统固定模式

    员工福利以单向礼品发放为主，企业需要安排专门的部门负责或多个部门进行协调，从设计方案到竞标采购，再到发放，这一工作对企业的人力、物力、财力的消耗很大。由于传统的福利发放方式是统一方案、统一采购，员工的选择权非常有限，虽然企业投入的成本很高，但是员工的满意度并不高。


    #### (2) 弹性计划模式

    弹性计划模式是指员工可以从企业提供的福利项目菜单中选择其需要的一套福利方案。具体来说，就是企业建立福利平台，将各项福利、保险、礼品上架，不同级别的员工配有一定的固定积分（币值），员工可以根据自己的需求任意搭配购买。员工可以通过可视化界面清楚地看到福利产品，同时可以加减积分，实现最适合自己的搭配组合。这种模式很好地降低了企业的人力成本，同时极大地提高了员工的满意度。


    #### (3) 数字社区模式

    在弹性计划模式的基础上，企业增加了游戏化的元素，同时利用数字化技术描绘员工福利画像，通过员工画像建模，结合员工生命周期构建场景化福利，并时刻关注社会环境变化趋势，根据趋势预测员工需求，进一步优化员工画像，为员工推荐不同类别的福利产品。这种模式可以在保证企业人力总成本不变的情况下，大大提升员工体验和员工满意度。


    当然，企业可以对不同员工、不同渠道、不同货品进行数据追踪及大数据建模与分析，将分析报告作为指导福利设计或制定决策的依据，为员工提供个性化、智能化的关怀。


    ## 六、情绪识别助力关怀


    参考链接：`../Text/contents.xhtml#c_54`


    人工智能可以帮助人们完成其想做但能力达不到的事情，如百度大脑的“对话情绪识别”App。自然语言处理技术可以自动检测用户日常对话文本中蕴含的情绪特征，帮助企业更全面地把握产品使用体验、监控客户服务工作质量等。“对话情绪识别”App具备如下功能。


    ### 1. 精细化的对话文本情绪识别

    在对话场景中，“对话情绪识别”App可以识别对话双方文本背后蕴含的用户情绪，一级情绪分为正向、中性、负向三种，正向情绪细分为喜爱、愉快、感谢三种，负向情绪细分为抱怨、愤怒、厌恶、恐惧、悲伤五种。


    ### 2. 负向情绪参考回复话术

    针对机器识别到的负向情绪，“对话情绪识别”App可以结合上下文语境给出有针对性的参考回复话术，帮助应用方第一时间安抚客户的负向情绪。


    情绪识别与分析的应用场景包括客户质检与监控、对话机器人等。


    - **客户质检与监控**：可以识别客户在客服咨询中的情绪，如检测出客户已有不满情绪，则及时触发人工客服介入；在人工客服场景下，客户质检与监控既可用于监控客服人员的服务态度，也可对员工的情绪进行识别与分析。

    - **对话机器人**：可以识别用户在聊天过程中的情绪，帮助人工客服选择更能舒缓用户情绪的回复文本。


    “对话情绪识别”App可以将客服人员与客户的对话储存下来，对语义、语频、语速、语调、音律、音调、基音、振幅、频谱等进行数据化分析，提取情感特征参数；对喜怒哀乐等情绪进行标签化处理；通过机器学习、`NLP`（自然语言处理）、`NB-SVM`（朴素贝叶斯支持向量机）等算法模型进行分析研究，最终形成“对话情绪识别”系统。


    由于客服人员收到的大部分信息都是投诉，这些充满负能量的信息会给员工情绪带来一些负面影响。HR从业者可以通过“对话情绪识别”App及时了解员工的状态，倾听员工的感受，并根据相关提示向客服人员提供一些关怀，减轻或消除员工的心理负担，帮助企业提高员工的工作满意度、绩效水平和在岗率。


    竹间智能公司推出的HR助理机器人就可以感知人心，管理者通过机器感知加上真人关怀，能够及时帮助员工舒缓心情、释放压力。情绪的感知、预警的提示都是在自然语言理解及意图识别的基础上，通过图像、声音与文字识别出来的。通过自然语言交互和自然语言理解技术，HR对话机器人不仅能和员工进行一问一答，还能在多轮对话中识别员工意图，帮助人力资源从业者收集员工较为真实的想法，同时基于交互数据的文本和情感分析，快速了解员工的需求和评价，从而为人力资源部制定员工福利或开展员工培训等一系列举措提供数据依据。HR助理机器人能够接过人力资源从业者肩上的重担，为员工“排忧解难”。当员工在工作中遇到难题，倍感压力又无处排解时，HR助理机器人可在HR从业者察觉之前及时提出预警，请求专家介入，及时疏导，避免员工情绪进一步恶化。


    # 第四章 人工智能在育才环节的应用


    参考链接：`../Text/contents.xhtml#z_9`


    ## 第一节 数智化下的学习与人才发展


    参考链接：`../Text/contents.xhtml#b_55`


    在VUCA时代，处于数字化转型阶段的企业急需吸纳各类人才提升自身的竞争力，尤其是通晓数字化技术（如`ABCD`、`IoT`、`AR`、`VR`等）的人才。人工智能与大数据技术将个人能力评估和课程推荐连接起来，形成了学习地图，用于助力员工成长。未来，企业人才培养的趋势是加强移动化学习、游戏化学习、社交化学习，将人才培养与课程、场景连接起来，做到寓教于乐。


    ### 一、以个人为中心转变学习思维


    参考链接：`../Text/contents.xhtml#c_56`


    据统计，全球企业每年在员工发展和培训上的支出已超过3 500亿美元。即便如此，传统的线下课程培训和e-learning的在线培训方式取得的结果也是差强人意。根据密歇根大学（`University
    of Michigan`）教授戴维·尤里奇（`Dave Ulrich`）的研究，在领导力课程的培训中，只有20%~30%的思想和观念会转化为实践。不过，随着AI技术更加广泛地应用于在培训和员工发展场景中，这一问题已经发生了积极的变化。首先，学习过程变得更加个性化和定制化；其次，AI技术可以对学习者进行24×7、一对一的帮助；再次，AI技术与其他技术相结合，如虚拟现实技术可以提供沉浸式学习方式，让培训过程尽可能接近真实的工作场景；最后，AI技术可以使培训过程完全数字化，并提供实时的评估反馈和优化。


    IBM公司利用AI技术开发了一个名为“Your Learning”（你的学习）的个性化学习平台，平均每季度有98%的员工在这个平台上学习。IBM的员工平均每人每年在这个平台上完成60个小时的学习。平台为员工提供了最受欢迎的课程导航、有针对性的课程安排及紧缺岗位（通常也意味着更高薪酬水平）的技能培训。员工在学习的过程中会得到聊天机器人24×7的帮助，同时平台会在员工学习过程中收集进度、成果和行为数据。IBM人力资源部通过分析这些数据发现了员工的学习强度与其敬业度的相关性，同时确认了学习和业绩成正相关，学习意愿更强、学习量更大的员工的整体绩效会更好。更重要的是，IBM通过这个平台推荐给员工的课程完成度一直很高，这让员工的整体技能水平与公司的战略方向相吻合。


    这种定制化对于培训内容的设计和交付可能更具挑战性，是否可以让员工本人贡献和共享学习内容呢？通常而言，培训内容是由HR培训部门创建的，但是用户生成的培训（或非正式学习）正在变得越来越流行。领英公司创建了一个名为LearnIn的用户平台，它为用户提供了符合他们个人身份的学习内容。有些学习是规定性的，有些则是自我驱动的。与传统的人力资源培训相比，领英从用户的视角进行了改革，并帮助用户获得了尽可能好的学习体验。埃森哲技能和就业趋势调查发现，培训的新方法非常受欢迎，包括移动交付、社交媒体、大规模开放在线课程和游戏化。这些新型的培训交付模式既经济有效，又能满足学习者的需求，同时员工将不再被迫接受不必要的培训。这种培训模式不仅基于员工喜好或兴趣设计，而且基于学习内容的沉淀和工作经验设计，将会为员工带来更好的绩效表现和长期的职业成功。


    以某高科技公司M跟踪培训效果为例。2017年，M公司招聘了300名具有3~4年工作经验的软件工程师。入职两个月后，150名工程师报名参加为期两周的培训项目YEP。其中，只有140名工程师全程参加了这个培训项目，完成了各项任务，并在后续工作中参与了项目实践与测评。在参加YEP项目一年后，这140名工程师中有80人晋升到了更高的一个级别。同期入职但未参加YEP项目的160人（含未完成的10人）中仅有55人获得了晋升。表4-1是与此次培训有关的效果统计表。


    **表4-1 与YEP培训有关的效果统计表**


    ![](Images/table_image_121_0.jpg)


    下面利用贝叶斯定理（`Bayesian`）看看培训项目的预测效果。


    ```

    公式：培训项目的预测效果 = (培训后晋升的概率) / (未经培训而获得晋升的概率) × 100%


    其中

    培训后晋升的概率(P) = (培训后晋升的概率) / (参加培训后未晋升的概率(1-p)) × 100%

    ```

