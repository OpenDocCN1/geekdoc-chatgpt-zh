    \ prompt\n\n![](img/adbb1fa212f01937738ab767fb2f8fae_14_0.png)\n\nDeepSeek让人与AI对话更加简单，提示词让对话质量提升立竿见影，适合所有层级使用者快速上手。\n\
    \nDeepSeek的深度思考模式基于DeepSeek R1模型，是一种推理模型。相比较于传统的生成模型，使用DeepSeek R1模型时的提示词技巧有较大的变化。\n\
    \n## DeepSeek提示词技巧\n\n清晰的表达！\n\n把AI当人看！\n\n## 1.DeepSeek提示词技巧-真诚+直接\n\n## 传统\n\
