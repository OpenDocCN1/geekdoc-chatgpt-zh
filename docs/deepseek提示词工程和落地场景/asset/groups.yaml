    \n## 3.DeepSeek提示词技巧-说人话\n\n适合场景：科研，了解新事物\n\n为了避免DeepSeek的回答过于官方、专业，可以尝试这三个字 “说人话”\n\
    \n你问：什么是 “波粒二象性”， DeepSeek大概率会给出专业且看不懂的回答，和百度百科差不多。但如果给ta一句 “说人话”， ta就会生动形象的做一些举例\n\
    \n## 说人话\n\n波粒二象性是量子力学中的核心概念，指微观粒子（如光子、电子等）同时表现出波动性和粒子性的现象。\n以下是其关键要点：\n\n- 1.\
    \ 历史背景\n  - 粒子说 vs 波动说\n    - 牛顿曾提出光的“微粒说”，认为光由微小粒子组成。\n    - 惠更斯等人则认为光是波动（类似水波）。\n\
    \    - 19世纪，杨氏双缝实验等证实了光的波动性（干涉、衍射）。\n  - 爱因斯坦的光量子假说（1905）\n    解释光电效应时提出光由“光子”（粒子）组成，重新引入粒子性。\n\
    \  - 德布罗意物质波理论（1924）\n    提出所有物质粒子（如电子）都具有波动性，波长由动量决定（λ = h/p）。\n\n好的！用大白话解释：\n\
    \n波粒二象性就是说：\n微观世界的小东西（比如光、电子）有时候像小球，有时候像水波，具体像啥，取决于你咋看着它。\n\n- 举个栗子\U0001F356\
