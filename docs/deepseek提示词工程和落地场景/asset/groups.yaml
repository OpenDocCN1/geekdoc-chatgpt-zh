    \n## DeepSeek (真诚是必杀技)\n\n帮我把这份报告包装一下，我要写成周报给老板看，老板很看重数据。\n\n![](img/adbb1fa212f01937738ab767fb2f8fae_16_1.png)\n\
    \n## 2.DeepSeek提示词技巧-通用公式\n\n我要（做）**，要给**用，希望达到**效果，但担心**问题\n\n例如：我要做一个从北京到日本的旅游攻略，要给爸妈用，希望让他们在日本开心的玩20天，但我担心他们玩的累，腿和腰不太好\n\
    \n我要做一个从北京到日本的旅游攻略，要给爸妈用，希望让他们在日本开心的玩20天，但担心他们玩的累，腿和腰不太好。\n\n## √ 先抓住总原则\n\n##\
    \ √ 全面非常考虑o(▼_▼)d\n\n最后，行程的节奏要慢，避免频繁更换城市。比如东京5天，京都5天，大阪4天，箱根2天，奈良和广岛各1天。这样每个地方停留时间较长，减少搬运行李和赶路的压力。同时，城市之间用新干线连接，节省时间。\n\
    \n需要检查每个城市的景点是否适合父母，比如奈良公园虽然可以喂鹿，但公园较大，可能需要租用轮椅或者选择近距离的观景点。广岛的宫岛海上神社可能需要注意潮汐时间，避免走太多路。\n\
