    \ [J]。新闻界，2017 (5)：86-93；刘梦逸。融媒体环境下虚假新闻的危害及对策探析 [J]。新闻研究导刊，2020，11 (12)：59-60；彭兰。假象、算法囚徒与权利让渡：数据与算法时代的新风险\
    \ [J]。西北师大学报（社会科学版），2018，55 (5)：20-29。\n② 格雷．苏里．销声匿迹：数字化工作的真正未来 [M]。左安浦，译。上海：上海人民出版社，2020：吴鼎钧，胡菊。数字劳动的时间观测：论互联网平台的资本运作逻辑\
    \ [J]。福建师范大学学报（哲学社会科学版），2021 (1)：115-122，171；许向东，郭萌萌。智媒时代的新闻生产：自动化新闻的实践与思考 [J]。国际新闻界，2017\
    \ (5)：29-41。\n\n这些批评从多个层面直击智能技术对当下社会情境所带来的激烈冲击，具有深刻的媒介产业理解和社会洞见。然而，当我们试着换一种角度，把智能技术融入社会、群体和个人之间关系的一般理论之中考察时，则又面对被忽视的关键点：智能媒体的自主性和支配性不但体现在社会性的后果层面，而且体现在媒介网络和媒介系统的具体微观运作中，“人”也早已成为与媒介技术和媒介物相互关联的部分。在这些媒介网络中，人的主体性地位至少已经开始部分地消融。那么，这种消融是否可以通过人对主体性的进一步或者重新伸张来挽救？\n\
    \n这一章主要循着基特勒“媒介网络”的路径来考察智能技术的大规模应用与人的存在境况的问题。现有研究已经较为充分地从宏观社会后果的角度描绘了智能媒体的支配性，因此这里主要立足智能媒体平台，尤其是智能新闻资讯平台的微观生产角度，来呈现媒介技术与人之间的网络关系。的确，智能技术的大规模应用部分消融了人的部分主体性，人本身的处境也延续了机械媒体出现之后的境遇：在一定程度上人变成了“机器话语处理的配件和工具的主体”①。但正如海德格尔在其著名的《对技术的追问》中所提到的，危险之处存在着解决的机会②。如果将基特勒的思想融汇起来看，而不是简单摘取其具有典型技术决定论的句子，那么媒介网络路径本身蕴含着一种基于媒介关系本体论的解决路径。\n\
    \n具体说来，我们将通过媒介与传播物质性理论的视野来分析智能技术，并讨论智能技术的广泛应用所带来的“人的境况”问题的多义性和多层次性。在方法上，我们主要通过综合诠释学和质性研究方法来探索智能算法主导的平台媒介网络的运作状况，以及媒介技术物（一般意义上的客体）和人（一般意义上的主体）在这个运作过程中所组成的网络关系。质性方法的研究过程则包括三个部分。首先，从\
    \ 2011 年对新浪微博平台研究开始，我们对包括即时通信、电子商务和新闻聚类分发平台在内的各类平台的技术开发与运营的系统状况进行了长期观察与追踪，关注平台运行中的技术平台、开发人员、平台运营人员与政策监管、ICT\
    \ 基础设施、用户群体之间的互动与变化，通过这种长时段的观察与追踪，建立起了对平台技术开发与运营的演进状况的初步了解。其次，我们在 2016 年以后着重关注新闻聚合类平台（如头条）、大型融媒体平台（包括光明网、人民网、凤凰网、澎湃等复合在线媒介平台）等新闻资讯平台，以及微信公众号、短视频平台的智能推送系统等重要智能技术系统的开发与运营状况，对企业技术开发人员、运营人员、用户群体进行了包括深度访谈、非参与式观察等多重方式在内的调查，以深入了解智能技术平台的开发与运营的基本状况，以及这些媒介技术平台与用户、监管机构、媒体机构、第三方劳务机构和外包机构之间的互动关系。最后，在上述前两项工作的基础上，对门户网站、社交网络到智能媒体的发展过程进行复原和追踪，随后采用数字诠释学而非单纯的数据分析方法对所获得的量化和质化数据进行整体性诠释。\n\
    \n### 二、人与物：智能媒体平台的媒介网络\n\n从媒介网络的角度来看，智能算法平台是基特勒所称的“计算机科学”在互联网时代的升级版本。在“计算机科学”阶段，冯·诺伊曼（John\
    \ von Neumann）构架意义上的寄存器、总线和随机访问存储器（RAM）构成了一个循环的反馈回路。“在结构上，存储在寄存器中的比特（bits）执行逻辑操作和算术运算，多条总线传送命令、数据和地址，而随机访问存储器（RAM）则为命令、地址和数据提供存储场所。”①\
    \ 命令、地址和数据是媒介网络的基础本体论特征处理、传输和存储在计算机科学时代的体现。在这个意义上，智能媒体网络平台实际上是一种经由互联网而扩大了的计算机体系。平台计算系统形成了复杂的、软件和硬件相互嵌合的技术物质体系。②\
    \ 经典的平台计算系统构架包括接入与界面（access and interface）、处理引擎（process engine）、存储系统和资源虚拟化系统（resource\
    \ virtualization）四个层次。对于大型平台来说，每个层次都涉及数量庞大的计算机/服务器群组。例如最早推出这种大型智能平台构架的谷歌，其在全球各地21个数据中心的服务器群组所安放的服务器数量虽然一直没有明确的正式数据，但是一般都估计已达到200万台以上。国内大型智能媒体平台虽然在计算数量级上无法与谷歌相比，但是复杂程度却远超\
    \ Web1.0 和 Web 2.0 时代的各类网站。例如，新浪微博在 2012 年的服务器数量就已经超过了 1000 台（访谈 Z1①），而当下头条平台的服务器也远远超过了\
    \ 5万台（访谈 Z3）。然而，这些复杂的体系并没有脱离基特勒所提出的“在硅晶体物理学和冯·诺伊曼架构的双重条件下②”的计算机体系，大型平台的运行基础仍然是基于地址、命令和数据的“寻址、处理和存储”的媒介网络③。\n\
    \n智能媒体平台最大的变化在于，在处理、传输和存储的三个环节都增加了人工智能。④就当下阶段来说，人工智能主要通过“深度神经网络”（deep neural networks）的多层次建模来实现“深度机器学习”（deep\
    \ machine learning），从而实现具有一定智能的自动化处理，例如新闻智能生产与分发、人脸识别、图像识别、智能导航和设计自动优化等。这种构架以简化的方式描述，相当于在存储部分加入“数据智能化管理”的并行系统（例如常见的\
    \ Hadoop HDFS，HBase 数据管理系统），在处理部分加入人适配智能“计算框架”的并行系统（例如 Map Reduce, Spark, Spark\
    \ Stream 等），以及在传输部分加入“智能挖掘与分发”系统（例如 DeepMind, GraphX 等）。从总体上来看，当下的智能媒体平台依然延续了技术媒介网络的总体特征。\n\
    \n从媒介网络视角来审视智能媒体平台，还可以发现智能媒体平台的另一个重要特征，即人或者人工在这个网络中与媒介物质性平台中所形成的网络关系。由于目前广泛应用的人工智能仍然是面向特定应用场景的“弱人工智能”（artificial\
    \ narrow intelligence，ANI）而非具有类似人类智能的“强人工智能”或者“通用人工智能”（artificial general intelligence，AGI），因而，在很大程度上，当下智能媒体平台人工智能开发的应用需要大量的“人工”参与和干预。例如，中国科学院自动化研究所的谭铁牛按照人工智能开发的简化过程，提出需要“人工设计深度神经网络模型、人工设定应用场景、人工采集和标注大量训练数据、用户需要人工适配智能系统”①。因此，人工在当下智能平台的新闻生产中仍然发挥着重要作用。\n\
    \n在人工干预的诸多环境中，人工采集和数据标注是相对最受关注的人工干预环节。从 2018 年开始，人工智能背后的“隐形工作”开始浮出水面②，受到媒体和公众的较多关注。其中，数据标注工作由于工作时间长、任务单调、媒体报道较多而备受关注。由于当下主流的人工智能开发工具“深度神经网络”需要在建立神经网络模型之后，通过大量输入详细标注后的标准数据来进行“学习”，才能建立处理未标注的同类数据的“智能”能力，因此数据标注工作对于当下的人工智能来说必不可少。例如，2016\
    \ 年击败世界围棋冠军、韩国棋手李世石的人工智能机器人“阿尔法围棋”（AlphaGo，又译作阿尔法狗），是谷歌旗下的深度思维（DeepMind）公司基于深度神经网络制造的围棋机器人。在建立模型之后，深度思维团队根据现存围棋图谱输入超过\
    \ 3000 万步的棋谱数据（等同于标注后的标准数据）来训练模型，并且在这个过程中进行了多次调校，最后才在 2016 年形成具有高度智能棋力的人工智能。\n\
    \n① 谭铁牛. 人工智能的创新发展与社会影响 [J]. 中国人大, 2019 (3): 36 - 43.  \n② 格雷. 苏里. 销声匿迹: 数字化工作的真正未来\
    \ [M]. 左安浦, 译. 上海: 上海人民出版社, 2020; 陈劲. 人工智能背后的人工: 教会机器人学习工作, 然后被机器人取代? [J]. 南方人物周刊,\
    \ 2019 (5): 36 - 43.\n\n然而，阿尔法围棋的输入数据是非常标准化的棋谱数据，总体上舍去了非常繁琐的“标注”工作。但是，对于需要文字、图像和视频处理的早期深度神经网络模型来说，大量的数据标注不可避免。在当下，数据标注已经成为一个规模较大的行业，出现了大量的数据标注公司，甚至已经有百度众测、京东众智、阿里众包等和数据标注有关的众包平台，一些资源网站如\
    \ GitHub 也有很多标注好的文字、图像和视频处理的通用数据集可以通过免费下载或者付费获取的方式来获得。不过，如果一个人工智能产品想要获得超出同类产品的智能化程度，那么额外附加的标注必不可少。对于头条等早期智能媒体的开拓者来说，绝大多数的数据标注都需要自己或者通过外包服务的方式来完成。\n\
    \n以兼含图片与视频、以文字为主的新闻文章为例，数据标注的典型流程包括数据搜集（用网络爬虫爬取或者用新闻文章数据库获取）、数据清洗（去除不必要信息以符合信息格式要求）、数据标注（按照要求对文章内容进行标注）、汇总成数据集等步骤。每一个步骤都涉及大量的人工工作，但是其中数据标注步骤对人工依赖最重。典型的标注工作包括标注能够体现文章内容的关键词、关键词的类属以及从上下文理解这些关键词的准确意思，对于图片和视频则至少需要标注图片和视频的主要内容的关键词。按照具体需要，标注工作还可能更加细节化，比如为了方便算法对文章进行情感分析和判断，标注时需要对依据文章的上下文、涉及情感和价值判断的关键词进行情感赋值标注、语义差异标注等额外标注。精细化的图片标注需要对图片内容仔细分区标注，最细致的视频标注甚至需要一帧帧标注视频内容的细节特征。同时，为了提高准确性，每一篇需要被标注的文章最好能被不同的数据标注员重复标注以形成对照。对于头条这样的新闻与信息聚合网站来说，大多数的信息要么来源于合作的新闻媒体，要么来自自媒体的用户自产信息。相对来说，数据搜集的难度不高，但是其他的流程步骤则不能省略，甚至因为追求更高的算法智能，头条的数据标注要求比很多其他平台要精细很多。\n\
    \n由于标注工作需要高度的分析和判断能力，因此目前虽然很多数据标注公司或者智能媒体平台已经开发出具有一定智能的自动数据标注工具，但是总体上这个行业仍然非常依赖人工介入。同时，标注工作也是持续的。以头条等新闻信息平台为例，为了优化算法、应对层出不穷的新语汇和旧词新用等状况、适应新政策和新法规等，平台需要持续对大量的图文进行标注。一位前头条计算工程师在\
    \ 2018 年的访谈中提到：\n\n我去头条的时候（2014 年），算法（已经）修改过很多轮了。因为每一次大一点的修改都会调整算法的很多方面，修改以后，一些以前不是很重要的方面就变得重要了，所以每次修改都会加入很多新的标注数据……有一段时间我们要提高图片识别的问题，于是找了外包公司重新标注了很多图片，我们小组在这上面前前后后花了快有半年的时间，最后效果还算可以……我走之前（2018\
    \ 年年初），算法已经比较稳定，但是（数据标注）工作量还是很大。要提高算法的准确性，标注其实是越来越多的。（Z3）\n"
  mdcn: "\n了既包含人也包含非人的行动体，通过与行动之间进行财产交换，人与非人共同构成了行动的共同体。在这个过程中，工业赋予非人在行动体聚合中彼此关联的可能性，这种聚合被人们称为机器或者机器人（automaton），其具有某种自主性并且遵循特定的能够被工具或者计算程序进行测量的规则。工业化社会到来之后，组织中原本由人组成的部分子程序被非人所代替，机器、工厂、工业和机器人便产生了。一开始非人加入组织而且扮演着顺从的仆人角色，然而随着工业化进程的不断发展，巨机器中对人的管理逐渐转移给非人，技术引入通过权力网络学习到大规模管理。在这种结构中，人与非人都共同为技术系统的有序运行而服务，人类不再具有自立的人格，更不能积极发挥职能作用，而只能成为一种消极被动、无目的的、服从机器操控的动物。①\n\
    \n① 芒福德. 刘易斯·芒福德著作精萃 [M]. 宋俊岭，宋一然译. 北京：中国建筑工业出版社，2010：346.\n② KITTLER F. BANZ\
    \ S. Platz der Luftbrücke: Ein Gespräch [M]. Cologne: Oktagon, 1996：21.\n③ 海德格尔.\
    \ 演讲与论文集 [M]. 孙周兴，译. 北京：生活·读书·新知三联书店，2005：12.\n\n很多人也在孤立地理解基特勒中期的“后人类主义”视角，认为至少从表面上看起来，在基特勒以技术媒介为主体的媒介网络中，人更多的是信息和媒介的传送、记录和保管者，是一种“机器话语处理的配件和工具的主体”。在这个意义上，基特勒比他自己所承担的“将海德格尔的技术概念转移给了媒介”②其实还更进一步，他将技术对人的“促逼”作用推向了极致。③\
    \ 但是实际上，基特勒对于媒介的网络关系主体性的阐述要复杂得多。基特勒本人的确主张，技术媒介的本体论特征即是基于处理、传输和存储数据和信息的网络，无论是书写、印刷，还是打字机、留声机和电脑，这些技术媒介都使得信息、话语和语言在空间得以处理、传输和存储。而在现代技术媒介条件下，技术媒介的强大的自主性将人变成了机器话语处理的配件和工具。但是，一方面，基特勒强调，技术媒介从来不是单独的媒介，而是由诸多媒介形成的网络。例如，“图书馆是被称为书的存储媒介的存储媒介”①。扩大来说，就“被称为书的存储媒介”来说，古登堡式印刷机、书、运输售卖系统、书箱、家庭书架或图书馆（甚至是制造这些技术媒介的其他技术媒介和工具），共同组成了一个技术媒介网络。在此基础上，小到雅克·拉康授课时由录音机、耳机以及打字机组成的课程记录媒介网络②，大到一个国家阶段性的总体话语网络③，都在模拟媒介网络的基础上得以形成。从基特勒的媒介网络主体视角进行分析，人的绝对主体地位如果不是从来都未曾存在的话，那么至少在机械媒体时代已经大部分消融。另一方面，基特勒毕竟是深受海德格尔影响的媒介理论家，这种后人类主义的叙事视角并不能完全掩盖他的海德格尔式的关系本体论视野，一种基于“共在”的视角。如果统合基特勒前后期尤其是后期“文化技术”的学术思想来看，那么媒介技术本身显然不是唯一的决定因素：技术需要在与人组成的媒介网络之中才能发挥作用。\n\
    \n① KITTLER F. Towards an ontology of media [J]. Theory, culture & society, 2009,\
    \ 26 (2-3): 23-31.\n② KITTLER F. Draculas Vermächtnis; Technische Schriften [M].\
    \ Leipzig: Reclam, 1993: 1-57.\n③ KITTLER F. Discourse networks 1800/1900 [M].\
    \ Stanford, CA: Stanford University Press, 1990.\n\n然而，无论如何，部分基于巨机器理论以及基特勒中期理论的阐述在一定程度上给予人们“数字媒介”的主体性正在全面侵蚀人的主体性的错觉。鉴于此，之后的众多的媒介与传播理论家从多个角度对其进行了补充。那么下文就简述德国媒介理论从“媒介性”\
    \ / “中介性”角度对于传播物质性的重构，并基于这种重构来补充论述智能新闻平台在用户使用与消费层面的关系主体性问题。\n\n## 第三节 智能媒介网络与人的境况\n\
    \n基于大数据与人工智能的智能技术的广泛应用正在全面重塑和再造新闻与资讯的生产、分发、用户互动与评价等全部流程环节，并对当下的媒介状况与社会生存情境产生复杂而深刻的影响。智能技术的推广和运用多处于对新技术的监管相对宽松的情况下，主要经由技术演进的自主推动，或经由用户对新技术的自发或被动员起的需求驱动而急速发展，并未经过广泛而长期的讨论和论证，因此也造成智能技术迅速切入原有的媒介系统，并逐渐形成占据媒介系统主导地位的局面，引发学界众多的讨论与担忧。在第二节对人与技术的关系进行系统讨论的基础上，本节主要聚焦由处理、传输和存储等三个环节所组成的智能媒体时代新闻生产的宏观流程，从基特勒所提出的“媒介网络”的视角出发，将智能新闻生产中的人与技术因素——除了编辑记者等传统的新闻生产者外，还包括数据存储系统等硬件设施和打标签的“隐形工作者”、内容审核人等——都共同纳入考量范畴，更加系统而深入地探索智能新闻生产背后的人与智能技术之间的关系，从而拓宽我们对新闻生产与媒介网络的认识。\n\
    \n### 一、消融的主体性？智能媒体中的人与机器\n\n在技术高速发展的时代，社会媒介系统的结构与权力关系也发生了激烈的变化，并同时在迅速改变着社会结构、社会权力构架和利益分享分配机制，这引致学界和媒体深刻的忧虑和大量的批评。其中，一般伦理学取向的研究对于智能技术在新闻的自动化生产、信息的智能化核查与分类、用户“定制化”推送、评价自动化与“算术化”等多重层面所造成的潜在或者显在的广泛伦理问题进行揭示和批评，例如对虚假新闻、商品化新闻、信息泄露、个体与群体权利侵犯、社会极化加剧、自动评价偏差等问题的批评①；而政治经济学取向的研究则追问智能技术所带来的资本对媒介的控制、数字劳动的不平等性、数字鸿沟的扩大与社会分化的加剧等议题②。上述两种分析路径初看起来存在着巨大的区别，但其实二者都共享同一种视角：智能技术的广泛应用呈现出较高的自主性和支配性，从而在社会后果层面危及人类的主体性地位。因此，智能技术的下一步运用，需要时刻从“以人为本”的主流价值观出发，对技术的自主性和支配性需要即刻加以众多的限制，以免引发更多的问题。\n\
    \n① 陈曦。机器新闻写作的现实困境及对策研究 [D/OL]。长沙：湖南师范大学，2018 [2023-02-18]。https://kns.cnki.net/KCMS/detail/detail.aspx?\
    \ dbname = CMFD201901&filename = 1018164221.nh; 韩鸿，彭璟。论智媒时代社交媒体的社会责任。对2016年美国大选中Facebook假新闻事件的反思\
    \ [J]。新闻界，2017 (5)：86-93；刘梦逸。融媒体环境下虚假新闻的危害及对策探析 [J]。新闻研究导刊，2020，11 (12)：59-60；彭兰。假象、算法囚徒与权利让渡：数据与算法时代的新风险\
    \ [J]。西北师大学报（社会科学版），2018，55 (5)：20-29。\n② 格雷．苏里．销声匿迹：数字化工作的真正未来 [M]。左安浦，译。上海：上海人民出版社，2020：吴鼎钧，胡菊。数字劳动的时间观测：论互联网平台的资本运作逻辑\
    \ [J]。福建师范大学学报（哲学社会科学版），2021 (1)：115-122，171；许向东，郭萌萌。智媒时代的新闻生产：自动化新闻的实践与思考 [J]。国际新闻界，2017\
    \ (5)：29-41。\n\n这些批评从多个层面直击智能技术对当下社会情境所带来的激烈冲击，具有深刻的媒介产业理解和社会洞见。然而，当我们试着换一种角度，把智能技术融入社会、群体和个人之间关系的一般理论之中考察时，则又面对被忽视的关键点：智能媒体的自主性和支配性不但体现在社会性的后果层面，而且体现在媒介网络和媒介系统的具体微观运作中，“人”也早已成为与媒介技术和媒介物相互关联的部分。在这些媒介网络中，人的主体性地位至少已经开始部分地消融。那么，这种消融是否可以通过人对主体性的进一步或者重新伸张来挽救？\n\
    \n这一章主要循着基特勒“媒介网络”的路径来考察智能技术的大规模应用与人的存在境况的问题。现有研究已经较为充分地从宏观社会后果的角度描绘了智能媒体的支配性，因此这里主要立足智能媒体平台，尤其是智能新闻资讯平台的微观生产角度，来呈现媒介技术与人之间的网络关系。的确，智能技术的大规模应用部分消融了人的部分主体性，人本身的处境也延续了机械媒体出现之后的境遇：在一定程度上人变成了“机器话语处理的配件和工具的主体”①。但正如海德格尔在其著名的《对技术的追问》中所提到的，危险之处存在着解决的机会②。如果将基特勒的思想融汇起来看，而不是简单摘取其具有典型技术决定论的句子，那么媒介网络路径本身蕴含着一种基于媒介关系本体论的解决路径。\n\
    \n具体说来，我们将通过媒介与传播物质性理论的视野来分析智能技术，并讨论智能技术的广泛应用所带来的“人的境况”问题的多义性和多层次性。在方法上，我们主要通过综合诠释学和质性研究方法来探索智能算法主导的平台媒介网络的运作状况，以及媒介技术物（一般意义上的客体）和人（一般意义上的主体）在这个运作过程中所组成的网络关系。质性方法的研究过程则包括三个部分。首先，从\
    \ 2011 年对新浪微博平台研究开始，我们对包括即时通信、电子商务和新闻聚类分发平台在内的各类平台的技术开发与运营的系统状况进行了长期观察与追踪，关注平台运行中的技术平台、开发人员、平台运营人员与政策监管、ICT\
    \ 基础设施、用户群体之间的互动与变化，通过这种长时段的观察与追踪，建立起了对平台技术开发与运营的演进状况的初步了解。其次，我们在 2016 年以后着重关注新闻聚合类平台（如头条）、大型融媒体平台（包括光明网、人民网、凤凰网、澎湃等复合在线媒介平台）等新闻资讯平台，以及微信公众号、短视频平台的智能推送系统等重要智能技术系统的开发与运营状况，对企业技术开发人员、运营人员、用户群体进行了包括深度访谈、非参与式观察等多重方式在内的调查，以深入了解智能技术平台的开发与运营的基本状况，以及这些媒介技术平台与用户、监管机构、媒体机构、第三方劳务机构和外包机构之间的互动关系。最后，在上述前两项工作的基础上，对门户网站、社交网络到智能媒体的发展过程进行复原和追踪，随后采用数字诠释学而非单纯的数据分析方法对所获得的量化和质化数据进行整体性诠释。\n\
    \n### 二、人与物：智能媒体平台的媒介网络\n\n从媒介网络的角度来看，智能算法平台是基特勒所称的“计算机科学”在互联网时代的升级版本。在“计算机科学”阶段，冯·诺伊曼（John\
    \ von Neumann）构架意义上的寄存器、总线和随机访问存储器（RAM）构成了一个循环的反馈回路。“在结构上，存储在寄存器中的比特（bits）执行逻辑操作和算术运算，多条总线传送命令、数据和地址，而随机访问存储器（RAM）则为命令、地址和数据提供存储场所。”①\
    \ 命令、地址和数据是媒介网络的基础本体论特征处理、传输和存储在计算机科学时代的体现。在这个意义上，智能媒体网络平台实际上是一种经由互联网而扩大了的计算机体系。平台计算系统形成了复杂的、软件和硬件相互嵌合的技术物质体系。②\
    \ 经典的平台计算系统构架包括接入与界面（access and interface）、处理引擎（process engine）、存储系统和资源虚拟化系统（resource\
    \ virtualization）四个层次。对于大型平台来说，每个层次都涉及数量庞大的计算机/服务器群组。例如最早推出这种大型智能平台构架的谷歌，其在全球各地21个数据中心的服务器群组所安放的服务器数量虽然一直没有明确的正式数据，但是一般都估计已达到200万台以上。国内大型智能媒体平台虽然在计算数量级上无法与谷歌相比，但是复杂程度却远超\
    \ Web1.0 和 Web 2.0 时代的各类网站。例如，新浪微博在 2012 年的服务器数量就已经超过了 1000 台（访谈 Z1①），而当下头条平台的服务器也远远超过了\
    \ 5万台（访谈 Z3）。然而，这些复杂的体系并没有脱离基特勒所提出的“在硅晶体物理学和冯·诺伊曼架构的双重条件下②”的计算机体系，大型平台的运行基础仍然是基于地址、命令和数据的“寻址、处理和存储”的媒介网络③。\n\
    \n智能媒体平台最大的变化在于，在处理、传输和存储的三个环节都增加了人工智能。④就当下阶段来说，人工智能主要通过“深度神经网络”（deep neural networks）的多层次建模来实现“深度机器学习”（deep\
    \ machine learning），从而实现具有一定智能的自动化处理，例如新闻智能生产与分发、人脸识别、图像识别、智能导航和设计自动优化等。这种构架以简化的方式描述，相当于在存储部分加入“数据智能化管理”的并行系统（例如常见的\
    \ Hadoop HDFS，HBase 数据管理系统），在处理部分加入人适配智能“计算框架”的并行系统（例如 Map Reduce, Spark, Spark\
    \ Stream 等），以及在传输部分加入“智能挖掘与分发”系统（例如 DeepMind, GraphX 等）。从总体上来看，当下的智能媒体平台依然延续了技术媒介网络的总体特征。\n\
    \n从媒介网络视角来审视智能媒体平台，还可以发现智能媒体平台的另一个重要特征，即人或者人工在这个网络中与媒介物质性平台中所形成的网络关系。由于目前广泛应用的人工智能仍然是面向特定应用场景的“弱人工智能”（artificial\
    \ narrow intelligence，ANI）而非具有类似人类智能的“强人工智能”或者“通用人工智能”（artificial general intelligence，AGI），因而，在很大程度上，当下智能媒体平台人工智能开发的应用需要大量的“人工”参与和干预。例如，中国科学院自动化研究所的谭铁牛按照人工智能开发的简化过程，提出需要“人工设计深度神经网络模型、人工设定应用场景、人工采集和标注大量训练数据、用户需要人工适配智能系统”①。因此，人工在当下智能平台的新闻生产中仍然发挥着重要作用。\n\
    \n在人工干预的诸多环境中，人工采集和数据标注是相对最受关注的人工干预环节。从 2018 年开始，人工智能背后的“隐形工作”开始浮出水面②，受到媒体和公众的较多关注。其中，数据标注工作由于工作时间长、任务单调、媒体报道较多而备受关注。由于当下主流的人工智能开发工具“深度神经网络”需要在建立神经网络模型之后，通过大量输入详细标注后的标准数据来进行“学习”，才能建立处理未标注的同类数据的“智能”能力，因此数据标注工作对于当下的人工智能来说必不可少。例如，2016\
    \ 年击败世界围棋冠军、韩国棋手李世石的人工智能机器人“阿尔法围棋”（AlphaGo，又译作阿尔法狗），是谷歌旗下的深度思维（DeepMind）公司基于深度神经网络制造的围棋机器人。在建立模型之后，深度思维团队根据现存围棋图谱输入超过\
    \ 3000 万步的棋谱数据（等同于标注后的标准数据）来训练模型，并且在这个过程中进行了多次调校，最后才在 2016 年形成具有高度智能棋力的人工智能。\n\
    \n① 谭铁牛. 人工智能的创新发展与社会影响 [J]. 中国人大, 2019 (3): 36 - 43.  \n② 格雷. 苏里. 销声匿迹: 数字化工作的真正未来\
    \ [M]. 左安浦, 译. 上海: 上海人民出版社, 2020; 陈劲. 人工智能背后的人工: 教会机器人学习工作, 然后被机器人取代? [J]. 南方人物周刊,\
    \ 2019 (5): 36 - 43.\n\n然而，阿尔法围棋的输入数据是非常标准化的棋谱数据，总体上舍去了非常繁琐的“标注”工作。但是，对于需要文字、图像和视频处理的早期深度神经网络模型来说，大量的数据标注不可避免。在当下，数据标注已经成为一个规模较大的行业，出现了大量的数据标注公司，甚至已经有百度众测、京东众智、阿里众包等和数据标注有关的众包平台，一些资源网站如\
    \ GitHub 也有很多标注好的文字、图像和视频处理的通用数据集可以通过免费下载或者付费获取的方式来获得。不过，如果一个人工智能产品想要获得超出同类产品的智能化程度，那么额外附加的标注必不可少。对于头条等早期智能媒体的开拓者来说，绝大多数的数据标注都需要自己或者通过外包服务的方式来完成。\n\
    \n以兼含图片与视频、以文字为主的新闻文章为例，数据标注的典型流程包括数据搜集（用网络爬虫爬取或者用新闻文章数据库获取）、数据清洗（去除不必要信息以符合信息格式要求）、数据标注（按照要求对文章内容进行标注）、汇总成数据集等步骤。每一个步骤都涉及大量的人工工作，但是其中数据标注步骤对人工依赖最重。典型的标注工作包括标注能够体现文章内容的关键词、关键词的类属以及从上下文理解这些关键词的准确意思，对于图片和视频则至少需要标注图片和视频的主要内容的关键词。按照具体需要，标注工作还可能更加细节化，比如为了方便算法对文章进行情感分析和判断，标注时需要对依据文章的上下文、涉及情感和价值判断的关键词进行情感赋值标注、语义差异标注等额外标注。精细化的图片标注需要对图片内容仔细分区标注，最细致的视频标注甚至需要一帧帧标注视频内容的细节特征。同时，为了提高准确性，每一篇需要被标注的文章最好能被不同的数据标注员重复标注以形成对照。对于头条这样的新闻与信息聚合网站来说，大多数的信息要么来源于合作的新闻媒体，要么来自自媒体的用户自产信息。相对来说，数据搜集的难度不高，但是其他的流程步骤则不能省略，甚至因为追求更高的算法智能，头条的数据标注要求比很多其他平台要精细很多。\n\
    \n由于标注工作需要高度的分析和判断能力，因此目前虽然很多数据标注公司或者智能媒体平台已经开发出具有一定智能的自动数据标注工具，但是总体上这个行业仍然非常依赖人工介入。同时，标注工作也是持续的。以头条等新闻信息平台为例，为了优化算法、应对层出不穷的新语汇和旧词新用等状况、适应新政策和新法规等，平台需要持续对大量的图文进行标注。一位前头条计算工程师在\
    \ 2018 年的访谈中提到：\n\n我去头条的时候（2014 年），算法（已经）修改过很多轮了。因为每一次大一点的修改都会调整算法的很多方面，修改以后，一些以前不是很重要的方面就变得重要了，所以每次修改都会加入很多新的标注数据……有一段时间我们要提高图片识别的问题，于是找了外包公司重新标注了很多图片，我们小组在这上面前前后后花了快有半年的时间，最后效果还算可以……我走之前（2018\
    \ 年年初），算法已经比较稳定，但是（数据标注）工作量还是很大。要提高算法的准确性，标注其实是越来越多的。（Z3）\n"
