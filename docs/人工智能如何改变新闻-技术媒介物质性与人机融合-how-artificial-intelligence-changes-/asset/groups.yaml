    容的生产者和新闻的“把关人”。在新闻价值层面，人与技术在新闻生产的效率方面有共同的追求，人对新闻的多维度价值期望又与技术纯粹的效率至上和数字理性存在一定张力。总的来说，人与算法共同创建和遵守了一套实践规则，并不断相互规训和适应。技术不再（也可能从未）仅仅作为人的辅助性角色而存在，而是逐渐走向新闻生产的核心地带，而人从台前走向“幕后”，并在一定程度上遮蔽了人的社会结构和权力关系等因素，营造出算法驱动新闻业发展的表象。


    人与算法技术的合作越是深入，我们就应该越是认真地思考两者的关系。从新闻生产实践的流程来看，人与算法不是静态的、机械的结合，而是一种彼此不断适应、相互调整、共同发展的互动关系，两者为了新闻生产更高效、更符合预期而共同努力。一方面，这其中不可避免地产生隐形工人和算法黑箱等现象，进而引发权力的不平等关系、新闻生产的不透明以及伦理问题等，但若就此认为以上问题是由于技术引起的、可以通过改进技术而解决问题，也是片面的、乐观的理想主义观点。另一方面，正是人与技术的这种关系塑造了当前开放的、动态的“人机联姻”新闻生产新格局——相比于传统新闻编辑室内部结构稳定、权利明晰的新闻生产模式——而不是独立的人或算法。或者说，当前的新闻生产实践只有在人与算法的互动中才得以实现。两者的关系成为理解新闻生产的关键要素之一，同样，也应立足于人和算法技术之间的关系来重新思考数字时代的新闻价值。


    从本体论层面看，无论是人类中心主义还是技术决定论，在人与技术二元对立的基础上针对当前新闻生产实践的解读都存在片面性。实践证明，算法主导新闻业只是表象，尽管悲观主义认为算法对人的“规训”使得人的能动性受到限制，但正是这个过程让新闻从业者的核心能力和不可替代性得以体现，且让与从业者相关的社会问题进一步突出。基于此，或许基'
