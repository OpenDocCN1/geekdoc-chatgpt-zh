    乔治·康吉莱姆（Georges Canguilhem）首次提出“一般器官学”（general organology）的概念，否定了笛卡尔将人与机器等同和对立的观点，认为二者是一个同一的整体。他回应了卡普和勒鲁瓦-古汉（Andre
    Leroi-Gourhan）等的主张，认为技术对象（即器官的投射）是根据器官的形态和功能而建立的，是器官的延伸和解放。① 在康吉莱姆的基础上，技术哲学家贝尔纳·斯蒂格勒（Bernard
    Stiegler）将器官学研究划分为身心器官、社会器官（如社会机构）和技术器官三类②，并进一步阐明三种器官系统相互交织的关系，但最终的变化都因技术器官而定，进而强调了技术对周遭的关联环境（associated
    milieu）的重要作用。技术时刻都在加速变迁，“在演化论中，技术与环境直接相连。演化的过程是适应（adaptation）和采纳（adoption）的辩证运动……器官学不只是对人机关系的系统研究，也应研究文化和技术如何相互作用”③。与之类似，吉尔伯特·西蒙农（Gilbert
    Simondon）也通过“机器学”（mechanology）来消解工业社会以来的异化问题，以及技术与文化之对立。他所强调的“内部共振”呼应了后来在控制论中所讨论的核心问题——反馈，进而阐明在自动化的工业时代之后，自动化机器的关联环境取代了工具时代的关联环境，人们已经失去了为自己提供工具的能力，机器成为工具的持有者。但这并不意味着机器彻底取代了人工，人或者是为机器服务，或者是组合机器，人和技术物的关系也发生了根本变化。因此，在人与机器所构成的这样一个“座驾”（Gestell）系统中，需要通过反馈机制，通过将人与机器进行充分的关联来解决异化问题。立足于有机论思想的器官学说摒弃了传统唯物主义科学中将精神与物质对立起来的看法，“相反，它一直在找机会让精神运行自由，而不造成灵魂的异化。技术是精神的产物”①。


    西蒙农将人与机器、技术与文化和异化的问题引向了一种控制论的解决思路，这种新的思路也结束了机械论与生机论之间长久的对立，通过信息过程的展开来进行递归形式系统的推理，从而在根本上也否定了将生物形式与机器等同起来的错误观念。从广义上来说，关于部件组织的科学——控制论，其中与部件相关的概念也可以追溯到器官学研究。②
    20 世纪，随着控制论机器特别是图灵机的发明，机器不再是笛卡尔意义上的机制，也不是生物，“而是一种有机形式实现的机械存在”③，反馈能在其中形成新的人机关系。维纳在系统论中再次强调了技术的关键问题是“信息反馈”。控制论指的是在动物和机器中控制与通信的科学。从方法论上，维纳将机器与有机体这两种完全不同的对象放在同一概念体系中，用信息、通信、控制和反馈来阐释生命和心理现象，实现了无机与有机的统一，将构成有机体的局部作为整体来考虑。因此，从有机体的递归性特征来看，


    有机体越成为真正的有机体，它的组织水平越不断增加，因此它成为熵不断增加、混乱不断增加、差别不断消失这个总潮流的过程，这就称为稳态。……不变的只是模式，这才是生命的本质……模式就是消息，它也可以作为消息来传递。④


    而随着工业化与技术的进一步发展，人与机器之间的交流与合作更加深入，控制论也试图解决人和机器的通信特点之间的相互冲击，试图确定机器未来的发展趋势以及可能给人类社会带来的影响。①
    特别是计算机被发明之后，信息的反馈逐渐成为连接人与机器整个系统的中心。不管是马克思所强调的技术需要统一，还是在计算机与人构成的自动系统中需要由中央控制系统（例如逻辑装置和数学装置）来调节比较复杂的选择过程和反馈操作，都需要人与其器官的延伸——机器相互协调，遵循统一调度。哪怕这个系统中存在大量带有感官性质的仪器，但是这些仪器由于精密复杂需要由人手操控，作为一个系统整体的一部分而言，仍然需要遵循中央系统的调配。“整个控制装置相当于一个具有感官器官、效应器管和本体感受器的完整动物，而不是相当于一个独立的脑……其经验和有效性要取决于我们对之参与的程度。”②
    从递归的结果上看，由于有机系统的复杂性，机器无法判断所有偶然情况，因此“机器最大的弱点——正是整个弱点使我们远不至于被它统治——就是它还计算不出表征人事变化幅度甚大的概率性”③。


    控制论的观点也回应了第二章基特勒的媒介网络概念，也进一步从信息的角度阐明了人际融合的重要机制，即通过反馈来实现“减熵”，从而减少有机体系统的无序状态，实现有机体与无机体、人与机器的高效协调。在人与机器协调和融合的过程中，人的作用是不能被忽略和完全替代的，系统是否能够有效运行，也取决于人与机器之间的协调。


    ## 第三节 追问的实现：对智能新闻生产的微观考察


    上述两部分所涉及的研究展现了学界在不同时期、不同层面、不同维度对于人与技术关系的探讨，并且将这种思考浸入新闻生产实践的数字化、智能化转向过程中进行探索，颇有启发性。但是部分研究从理论到理论，缺乏与实践的勾连和现实关切；也有部分实证研究仅仅从传统新闻业意义上的记者和编辑等职业视角出发，聚焦于新闻编辑室内部生产实践的新特征，而在媒介技术迅猛发展的当下，将新闻生产局限在传统的新闻编辑室中已不能窥见其全貌，只用记者、编辑等代表新闻生产中的从业人员也是片面的。因此，这里我们提出广义“新闻生产”的概念——智能媒介技术在整体新闻产业中的实践可能性——对人和技术的互动过程进行探讨。具体来说，新闻生产是指新闻机构及从业者对新闻的选择、加工与传播的整个过程，由生产主体、生产客体以及所形成的生产关系构成。因此，我们立足新闻生产各个流程从业者的实践出发，融合器官学和控制论中关于人与机器融合的观点，采用自下而上的微观角度来进一步挖掘：智能新闻生产实践的流程是怎样的？人与作为媒介新技术的算法如何进行分工和互动？应该如何看待人与算法技术之间的关系？在客观主义的扎根理论研究方法的基础上，我们通过诠释两者的互动过程以上述的理论讨论进行回应，从而加深我们对智能新闻生产的理解。


    扎根理论由美国社会学家格拉泽（Barney Glaser）和斯特劳斯（Anselm Strauss）所创立，它综合了格拉泽所在的哥伦比亚学派的经验主义倾向以及斯特劳斯所在的芝加哥学派的实用主义倾向，将实证研究和理论建构二者紧密地结合起来。客观主义范式下的扎根理论强调将文本变成“数据”和“变量”，从文本中“发现”理论。该方法的分析过程包括三个主要环节，即开放性编码、主轴式编码和选择性编码。①
    扎根理论就是在这三个环节的基础上，在层层编码的过程中完成概念饱和，并最终构建出理论模型的。


    1999 年，陈向明将扎根理论引入中国②，王锡岑首次提出其在新闻传播学领域的适用性③。经过多年发展，扎根理论的操作流程已经较为科学规范，其理论也并非从书斋中凭空想象的，而是扎根于来自现实的一手数据，有助于产生说服性强的理论。④
    目前，我国的新闻传播领域的学者多将扎根理论应用于研究用户/消费者线上行为、跨文化传播、群体事件等领域。⑤ 虽然其作为研究方法较少出现在新闻生产相关研究中，但国外学者已广泛应用扎根理论探讨相关问题。⑥
    因此，为了从新闻生产实践中具体分析人与技术之间的关系，进一步解析算法如何嵌入新闻生产中的关系，这里将尝试运用扎根理论进行探索。


    ### 文本搜集


    我们选取了 6 位在不同企业、不同岗位的新闻生产从业人员进行半结构化访谈（见表 3-1），将访谈所得录音转译为文字材料作为文本。在文本搜集的过程中，研究者反复斟酌研究问题，并根据已有访谈记录及时进行分析对比，对访谈提纲进行调整，以确保问题意识贯穿始终，文本搜集有针对性。


