    # 绪论

    ## 数字智能时代新闻的新语境


    ![](img/228cf445208423908042e1490b71df9d_18_0.png)


    - 人工智能技术正逐渐改变着新闻生产关系，算法、人工智能和媒介机器人在一定程度上取代了记者和编辑的“把关人”地位；新闻平台成为信息集散地，新闻的概念也变得泛化起来，正在转向数据化、资讯化和档案化；同时，技术的变迁正在改变着作为物质客体的新闻机构、生产关系，以及在其中参与生产的人。


    - 在这个过程中，新技术不断地与新闻生产相融合，从而形成一种新的、多主体的新闻合作生产的关系。一场深度改变人类交流和信息传播方式的变革已经渗入生活的方方面面。


    核心技术的每一步发展都会推动媒介技术的发展和变化。最近数十年，互联网和数字技术的每一次关键变化，都对人们的沟通与互动方式以及新闻行业具有明显的重塑作用。尤其在当下，人工智能技术的发展正对社会沟通传播形态、社会新闻舆论的形成与影响机制产生全面而深入的影响；新技术正逐渐改变着新闻生产关系，算法、人工智能和媒介机器人在一定程度上取代了记者和编辑的“把关人”地位；新闻平台成为信息集散地，新闻的概念也随之变得泛化起来，正在转向数据化、资讯化和档案化；同时，技术的变迁正在改变着作为物质客体的新闻机构、生产关系，以及在其中参与生产的人。在这个过程中，新技术不断与新闻生产相融合，从而形成一种新的、多主体的新闻合作生产的关系。一场深度改变人类交流和信息传播方式的变革已经渗入生活的方方面面。


    ## 第一节 智能媒体发展与技术变迁


    在不同的媒介形式下，媒介技术扮演着不同的角色。然而在数字智能时代，媒介技术对新闻生产的影响越来越大，技术与人工融合共同影响着新闻生产。


    1999 年前后，以新浪、搜狐和网易等为代表的互联网网站开辟了“新闻主页”（news portal）的形式，当时建立独立域名的网络新闻机构已经达到 700
    多家。① 伴随着媒体的数字化浪潮，众多的媒体开始转型，将原本登载在报纸杂志等纸质媒体，或者播发在电视和广播等电子媒体上的稿件，通过网页转载出去。网页上的内容几乎与传统媒体“平行”，而受众则可以


    ① 唐绪军. 网上报纸现状及发展思路 [J]. 中国记者，1999 (10): 50-52.


    通过网页接触免费内容。在 Web 1.0 时代，内容推广的方式主要和纸质媒体类似，网页成为电子化的印刷平面，通过标题和图片的不同编排来分发新闻。传统媒体的标题和内容被编辑成更适合网络中快速阅读和浅阅读的形式，而通过网页平行转换的内容则主要根据“点击率”（page
    view，PV）进行计算。此外通过 RSS（really simple syndication，简易信息聚合），用户可以订阅自己喜欢的内容，定期获得所关注网页的更新。互联网则通过订阅者所下载的种子（feed）了解用户需求，并借助电子邮件或者
    RSS 软件（如 Google Reader、抓虾等）向用户发送个性化新闻。在整个新闻生产过程中，媒介技术主要起辅助作用，以人工操作为主的新闻内容加工仍然占有主导地位，编辑和记者作为最主要的“把关人”决定着内容在新闻机构的输入与输出，依靠技术的推送和个性化内容在其中只占少数。


    进入 2003 年以后，代表 Web 2.0 时代的博客（包括 Facebook、Myspace、QQ 空间、人人/开心网等）、微博和微信公众号等社交网络开始成为重要的信息传播和线上社交方式。通过申请成为好友、点击“关注”，用户就可以获得相关账户的内容更新。此外，通过对已经发布的内容进行点赞或在评论区留言，用户也可以及时看到最新留言。通常在注册时，社交网络用户会被要求选择自己感兴趣的话题，或者填写年龄、性别、所在地和个人兴趣爱好等信息。之后，互联网公司通过标签设置，根据用户所关注的或感兴趣的内容，或者所在地理位置等个人信息推送内容。从成为好友、关注、点赞、留言，到注册时选择相应的兴趣标签，乃至个人的地理位置信息，都是互联网公司获取个人数据的重要方式和进行推送的重要依据。到了
    Web 2.0 阶段，算法开始被大量运用到推送中来满足用户的个性化需求。相比传统的新闻内容生产，技术在 Web 2.0 时代扮演着更为重要的角色。除了个人用户，传统媒体也在社交网络中注册成为用户，并把新闻内容改写为更易于在社交媒体传播的形式。然而当内容进入社交媒体以后，人工编辑在其中的影响力迅速减弱，主要在事实核查和一些重要时政内容的推送中把关。内容的分发主要遵从标签的相关性，由系统自动完成。在以个人兴趣和朋友圈为主的信息传播中，人工编辑所起到的作用也越来越小，新闻内容主要靠系统相关性推送。此外，根据点击量，微博将热点话题系统排名并自动推送。但是需要说明的是，在一些社交媒体中，除了部分弹窗是因为关注度高或者本身就属于时政要闻或突发的重大新闻而被人工或者算法选取进行推送外，很多属于商业机构的付费推广行为。


    2006 年在国际上诞生的 BuzzFeed 和 2012 年在国内诞生的头条标志着更具个性化、互联性以及人工智能技术高度融合的 Web 3.0 时代到来，新闻实现了彻底的平台化生产，智能技术被运用到新闻信息的处理和推送中。①
    初期的头条将自己定位为一家纯粹的技术公司，没有任何内容采编业务，主要依靠用户生成内容和与传统媒体合作来获得信息。头条通过搭建信息平台，在算法技术支持下通过
    App 获取用户信息偏好，再借助算法精准投放个性化的新闻资讯。在这一阶段，头条主要依靠算法定位用户并分发信息，通过数据化实现精准投放，因此技术在其中起到了决定性的作用，大部分由工程师组成的团队的主要任务在于完善算法。2014
    年，头条为用户更新画像的频率最快可达到 10 秒一次，而且算法可以做到“用户用得越久，算得越准”。2018 年初，头条开始组建人工团队来对内容的真实性进行核查，并且通过人工选择，提高一些重要新闻在算法中的权重，以降低信息茧房带来的负面效应。尽管如此，头条用户画像的定位和内容分发仍然主要依靠算法来实现。


    ① 平台化条件下的新闻生产和传播开始大量采用智能技术，因此在这里实现了从数字新闻向智能新闻的转变。


    除了头条外，传统主流媒体也加大了媒介融合的力度，一方面通过建构媒体网络将多家媒体的“报、网、端、微、屏”连接起来，另一方面也立足于所在媒体开发客户端，不断整合资源、实现平台化。同时，伴随着媒介融合和平台化进程，主流媒体开始转化为资源组织平台、用户链接平台、内容分发平台和社会治理平台。而数据化也是主流媒体平台化之后的重要特征，媒体已经成为数据汇总平台。此外，多家媒体的平台化也使得新闻的跨平台、跨地区生产成为可能。


    人工智能和算法技术的使用不仅参与到用户画像和新闻分发中，而且还深度嵌入新闻制作中，一些突发新闻已经实现机器自动采写，并且通过人工智能所生成的虚拟主播进行新闻播报，新闻的生产已经成为在平台中自动完成的高度技术化和标准化的结果。在媒体融合的发展进程中，技术在深度融入新闻生产的同时也改变了人们获取新闻的方式。尽管通过大数据追踪和算法推送，新闻的内容变得更加富有个性化，但与此同时，由于算法在其中所造成的偏见，信息茧房和黑箱等问题却变得越来越严重。


    从 Web 1.0 到 Web 3.0 的媒体发展进程中可以看出，新闻生产过程对技术的依赖性越来越强，人与技术融合的程度也越来越深，技术已经体现出了一定的自主性，算法的逻辑也取代了人工编辑的逻辑。特别是在新闻生产平台化之后，人工基本成为一种技术的辅助，通过算法编程、数据收集、推送与算法修正，人与算法被融合到整个系统中，不论是人还是算法，都是为整个新闻生产的技术系统的有序运行而服务的。


    大数据与人工智能等技术深度嵌入新闻生产和传播过程，而基于平台的新闻生产在大范围内连接多元内容生产者的同时，也实现了人与机器的协同运作，通过平台的数字结构将内容转化为数据，再经过算法与人工的整合后，借由数据接口与内容消费者对接。当下的新闻行业已经无法回到从前的时代了。从“中央厨房”到地方融媒体建设都经历着数字化与智能化的进程，即使部分媒体仍然保留着传统以记者和编辑为主的线下新闻生产模式，但新闻内容同样也需要借助社交媒体等数字化平台进行推送。大数据、平台化和智能技术已经成为当下新闻生产与传播的新语境。


    ## 第二节 平台与数据化新闻生产


    在新技术条件下，媒介逐渐转换为汇聚数据的平台。新闻的生产和发布都经历着平台化和数据化的过程。平台，指的是是用来组织用户的互动的可编程的架构（infrastructure）设计。①
    新闻信息在这里经过加工后，再经由算法分发给受众。在分发过程中，经过算法的追踪，用户使用新闻 App 过程中的行为被转化为数据记录在平台的系统中，进而指导下一轮的新闻推送。平台被搜集到的数据所填充，并由算法和交互界面所控制。所以用户只要使用
    App，便会源源不断地产生数据。新闻平台成为各种新技术交互作用的汇聚场——这里的技术既包括算法，也包括交互界面，而新闻生产的过程和新闻室的结构，以及新闻生产者的角色都已经彻底改变，算法技术和平台工具已经融合到新闻生产中，共同建构着一种新型的新闻生产关系。


    数据化是新闻生产平台化的重要特征。这里的数据化指的是网络平台能够将世界上众多之前没有被量化过的事物转化为数据。② 通过新闻 App，用户在使用过程中产生的数据被传回平台进行分析，平台再根据分析结果向用户推送新闻。这一过程也彻底改变了新闻生产的逻辑，使原本以人为核心、重视内容的新闻专业逻辑向以算法为核心、主要依赖算法加工和推送新闻的技术逻辑转变。算法渗透到信息采集和分发的各个环节中，传统


    ① VAN DIJCK J, POELL T, DE WAAL M. The platform society: public values in a connective
    world [M]. New York: Oxford University Press, 2018: 9.


    ② 同①33.


    模式下扮演着“把关人”角色的编辑和记者的作用已被算法严重侵蚀。虽然在事实核查方面主要依靠人工编辑，在某些重要新闻推送上编辑和记者也享有优先权，但不可避免的是，平台的逻辑注入新闻操作中，使得编辑和记者的主动权受到限制。在以数据推动为主的新闻平台上，编辑和记者的自主性与已经被数据化了的用户兴趣之间形成了一种竞争机制。借助新闻
    App，新闻也实现了平台化，传统新闻价值的逻辑也只能遵循平台的逻辑——数据化。① 而其中人也越来越丧失主导作用，主要服务于算法的运行与完善。


    新闻平台的数据化也给新闻的客观性带来挑战。在传统的新闻生产中，为了保证新闻的客观和公正，新闻的采编团队与经营团队是相分离的。然而在新闻平台上，采编和技术团队都聚合到一起，平台遵循商业逻辑，通过数据化使得新闻更多地受到商业的影响。更为重要的是，新闻平台上的数据并非完全中性的、未经加工处理的数据，因此平台不仅“衡量”某些情绪、想法和表现，而且还会触发和塑造它们。②
    在新闻价值的判断上，尽管人工编辑可以在算法分发前对重要新闻提高权重，然而平台主要还是依靠算法所建构的一系列评价系统。通过点赞、问答、评论、分享、转发、关注等行为，技术已经建立了一套衡量人们的基本情感和诉求的机制，并且决定了平台用户如何在这里彼此互动和生产数据的类型。③
    新闻生产的流程也突破了传统新闻室的限制，而更多地关注上游的内容和数据搜集的整合与下游的分发以及反馈等传统新闻生产的范畴，人工智能技术与人在新的生产关系链中竞相角逐。


