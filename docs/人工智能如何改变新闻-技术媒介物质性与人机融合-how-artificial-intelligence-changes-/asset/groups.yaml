    西蒙栋将人与机器、技术与文化和异化的问题引向了一种控制论的解决思路，这种新的思路也结束了机械论与生机论之间长久的对立，通过信息过程的展开来进行递归形式系统的推理，从而在根本上也否定了将生物形式与机器等同起来的错误观念。从广义上来说，关于部件组织的科学——控制论，其中与部件相关的概念也可以追溯到器官学研究。②
    20 世纪，随着控制论机器特别是图灵机的发明，机器不再是笛卡尔意义上的机制，也不是生物，“而是一种有机形式实现的机械存在”③，反馈能在其中形成新的人机关系。维纳在系统论中再次强调了技术的关键问题是“信息反馈”。控制论指的是在动物和机器中控制与通信的科学。从方法论上，维纳将机器与有机体这两种完全不同的对象放在同一概念体系中，用信息、通信、控制和反馈来阐释生命和心理现象，实现了无机与有机的统一，将构成有机体的局部作为整体来考虑。因此，从有机体的递归性特征来看，


    有机体越成为真正的有机体，它的组织水平越不断增加，因此它成为熵不断增加、混乱不断增加、差别不断消失这个总潮流的过程，这就称为稳态。……不变的只是模式，这才是生命的本质……模式就是消息，它也可以作为消息来传递。④


    而随着工业化与技术的进一步发展，人与机器之间的交流与合作更加深入，控制论也试图解决人和机器的通信特点之间的相互冲击，试图确定


