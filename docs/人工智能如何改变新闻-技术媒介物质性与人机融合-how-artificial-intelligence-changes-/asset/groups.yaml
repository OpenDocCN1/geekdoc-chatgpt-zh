    ### 选择性编码与核心理论范畴


    选择性编码指选择核心范畴，将其系统地与其他范畴予以联系，并将之最终概念化、理论化的过程。该过程的主要任务包括识别出能够统领其他范畴的核心范畴，用所有资料及由此开发出来的范畴、关系等简明扼要地说明全部现象，即开发故事线。在“访谈搜集文本—编码—比较分析—访谈搜集文本”的过程中围绕研究问题，反复循环提炼总结，使得模糊不清的类属明确化，并删掉明显与主题无关的语句和自相矛盾的语句，直到不再出现新的类属。此外，在收集、分析数据时还需要不断反思逐渐形成的范畴，以保证所得编码能充分解释类属，弥补“文本-概念-理论”之间的缺陷。至此，理论抽样结束，所得类属达到饱和状态。本研究共概括出新闻生产实践、人的主体性、新闻价值、算法的自主性和底层逻辑五个核心范畴（见表
    3-3）。


    表 3-3 选择性编码和核心范畴


    | 选择性编码（核心范畴） | 主轴式编码（主范畴） | 关系内涵 |

    | :--- | :--- | :--- |

    | 新闻生产实践 | 内容生产 | 新闻的内容生产和新闻分发是新闻生产的显性环节 |

    | | 新闻分发 | |

    | 人的主体性 | 人对算法的干预 | 人通过干预算法在新闻生产实践过程中的作用、在新闻生产时的优势和自身的主观能动性来体现自己的能动性 |

    | | 人的社会属性 | |

    | | 人的主观能动性 | |

    | 新闻价值 | 新闻价值考量 | 人和算法在互动过程中共同塑造了新闻价值的内涵 |

    | 算法的自主性 | 对人的驯化 | 算法通过对人的驯化、对人的存在价值的挑战和自身的能动性体现主体性 |

    | | 算法能动性 | |

    | 底层逻辑 | 物质性支撑 | 人和算法需要一定的物质条件、建构并遵循彼此可理解的规则，并服从从新闻生产和各自目的的导向，才能使得新闻生产得以实现 |

    | | 规则建构 | |

    | | 目的导向 | |


    分析“新闻的生产实践”理论范畴可以发现，新闻生产的显性流程表现为新闻内容的生产和新闻分发两方面。新闻生产实践是人和算法合作的直接体现。分析“人的主体性”理论范畴可以发现，在新闻生产实践过程中，人的主体性彰显主要体现在自身的主观能动性、人的社会属性和人对算法的干预三个方面。这三方面是新闻生产实践中必不可少的因素，且同时算法压制人的能动性，两者处于竞争关系。分析“新闻价值”理论范畴可以发现，人和算法在互动过程中塑造了新闻价值的内涵。新闻价值是人的能动性（对信息的判断、分析与理解）与算法（对效率的追求、与用户的互动反馈等）能动性共同作用于新闻生产实践产生的价值考量。分析“算法的自主性”理论范畴可以发现，算法通过对人的工作内容、工作流程等进行“驯化”压制人的能动性和主体性。在一定程度上，算法需要依赖“人”这一客体体现自身的主体性。分析“底层逻辑”理论范畴可以发现，一定的物质条件、建构并遵循可被理解的规则和工具性目标这三者使得新闻生产得以实现，其中凸显了人与算法的交流与平等地位。综合而言，这五个理论范畴均体现了人和算


