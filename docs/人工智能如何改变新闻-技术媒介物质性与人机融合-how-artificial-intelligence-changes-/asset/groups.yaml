    生。这种基于本体论视角上的新闻生产分析，突出一种“平本体论”观念，这意味着所有的物都是平等的，人与非人的区别也不存在，曾经隐藏在内容和数据背后的基础设施在新闻生产和传播过程中的重要作用因此也浮出水面，并且进一步回应了拉图尔所提出的“行动者网络理论”。新闻传播学研究的物质性转向提出一条“物质-社会”的分析路径，在技术变迁过程中同时将人与技术都纳入思考的范围，从而也避免了“技术决定论”或技术发展过程中仅仅看到技术带来的挑战的问题。


    另外，从媒介本体论来看，古今的新闻生产在本质上都是一致的。基于新闻的生产关系和生产模式，大众传播模式虽然被认为已经不适应当下的技术条件，然而其最大的问题并不在于传播模式的变革，而是在于如何理解“媒介”的概念。本体论意义上的媒介概念更为强调媒介的中介性特征，因而也能够弥补传统意义上对大众传播、人际传播、组织传播和人内传播①的区分所带来的研究视角的分裂。当技术的发展打破了原有的传播类型划分方式后，本体论意义上的媒介概念的转向显示出特有的解释力。相信在人工智能技术深入到人类生产与生活领域后，媒介研究的本体论转向将成为更为重要的思维范式与理论路径。


    ① 人内传播和外在技术的研究在很大程度上可以与恩斯特·卡普的“器官投射”理论进行对话，这个视角为理解和建构人内传播、人际传播以及大众传播之间的关联提供了新的视角。


    在媒介本体论的基础上，我们也进一步将研究的视角转向长期隐藏在背后的媒介设施，在整个新闻发展的历程中重新挖掘基础设施对时间和空间的影响，进而与新闻价值的时效性与相关性进行关联，来探讨不同媒介技术条件下的新闻变迁。在数字智能技术背景下，计算机语义关系网所带来的相关性将重新定义新闻价值。近年来，基于基础设施视角的新闻学研究也为国外学术界所关注，例如在电话/传真、汽车、打字机等媒介技术之外，空调等客体物作为一种不可见的基础设施也影响新闻室中的新闻生产与物理空间关系。①基础设施和媒介技术研究为新闻学研究领域开拓了更为广阔的视野，将人与技术/物的因素共同纳入新闻生产与传播研究，也将会成为新闻学研究的重要分析路径。


    新闻学研究的范式与社会学、人类学的研究一直关联紧密，自 20 世纪 90 年代以来的本体论转向和 21 世纪初以来的“物质性转向”，伴随着近年来媒介技术的发展变迁，也开始引发新闻学研究的范式转型。卡琳·沃尔-乔根森（Karin
    Wahl-Jorgensen）和托马斯·哈尼奇（Thomas Hanitzsch）在《当代新闻学核心》中曾将新闻学研究的范式划分为四个主要阶段：


    - 一是史前—规范化研究阶段：对应 19 世纪中期。从历史学和规范性的角度研究新闻，这一范式的很多理论源自 19 世纪中期德国批判理论，主要关心社会传播和政治协商的语境中新闻是什么，而很少关注新闻生产制作的过程和机构。


    - 二是实证研究转向：对应 20 世纪中期前后。以对新闻生产过程、组织和相关人员的研究为代表，最早也最显著地出现在美国，研究视角更多的是实证的而不是规范的理论。20
    世纪 50 年代传播学的发展对新闻的实证研究也产生了更多推动力，新闻学研究开始关注媒介效果和受众研究，慢慢地把注意力转移到“新闻人”和他们的专业价值观、编辑机构和工作细则上，着重讨论专业化、新闻价值理论、议程设置等概念。


    - 三是社会学转向：对应 20 世纪 70 年代和 80 年代。新闻学研究受到社会学与人类学的影响，开始结合民族志和话语分析等定性方法，转为批判性地研究新闻传统和惯例、专业和行业意识形态及文化、阐释共同体、新闻文本，并关注文化议题。


