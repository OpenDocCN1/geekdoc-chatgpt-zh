    # 第二节 器官学：理解人与技术的融合


    如上文所述，如果将人与技术放在一个“共在”的视角去考量的话，那么又该如何理解二者之间交织不断的互动关系呢？自工业革命以来，人类与机器、文化与技术是否对立，以及二者又如何融合的问题便是哲学领域的经典议题。众多的研究将机器与人的器官做类比，众多器官就如机器的部件，组合在一起就能形成机器的整体运动。达尔文在《物种起源》中分析器官的演变史时便将机器的发明史与之做类比，并认为“器官”是生物与技术建立类比的焦点①，并且在对技术发展的观察中谈及动植物的生活中作为生产工具的动植物器官是如何形成的。勒内·笛卡儿（Rene
    Descartes）的“机械论”也认为，在人造的技术物中数量众多的机械构建所组成的机器能够自行运动，所以上帝制造的机器（人和动物的躯体）和机器一样也能够自行运动。②
    这便意味着，任何动物的躯体都是由无数个部分组成，每个部分分别承担不同功能并通过机械作用进行沟通。但其中的问题也非常明显，假如人和动物都能够拆分成不同的部件，就像解剖学那样从局部来理解器官功能的话，是无法估计由部件组


