  - '[PAGE 161]


    接收之间的时间和空间被深度关联了起来，光速传播实现了上述三者在空间和时间上的零差异，也让强调差异的时效性渐渐淡出竞争舞台。更为重要的是，互联网本身是一张聚合了不同的人和事物的关系网。通过计算机语义关系的处理，新闻内容被转化为数据并通过算法进行关联。新媒介技术造就的不仅仅是新闻时效性的降低、相关性的增加，更是新闻概念的泛化，新闻与资讯之间的边界日益淡化。从本质上来说，通过计算机语义关系所建构的新闻是一种技术逻辑的结果，因其关联的范围远远超过传统媒体时代，新闻价值的判断标准也发生了巨大改变。


    本章基于技术的视角，分别从理论性的思辨阐释以及对新闻工作者的调研入手，从宏观到微观分析数字智能时代新闻价值的变迁。


    思辨部分从媒介本体论出发，探讨数字智能时代的新闻价值在时效性和相关性上是如何变化的，媒介技术的发展变迁对新闻的时间、空间和相关关系具有什么样的影响，又如何理解数字智能时代的新闻价值；通过分析媒介技术的实体——基础设施所建立的时间、空间，以及事物之间的关联，人们可以进一步理解技术是如何影响新闻内容和新闻价值的。数字化或者算法化的新闻意味着人们必须依赖基础设施，并通过它们来生活，而这些基础设施本身又受到更深层次的数据基础设施的监控、维护和控制。①
    从基础设施和数码物的物质性视角出发审视技术对媒介的时间性和相关性带来的影响，则能够在新技术环境下深切认知新闻价值的变迁。在此基础上，我们进一步探讨人与技术的关系及二者如何影响新闻的生产和传播，进而考察数字智能时代新闻的变革。


    实证部分基于德尔菲法，首先整合近年国内外新闻价值相关文献确立'
