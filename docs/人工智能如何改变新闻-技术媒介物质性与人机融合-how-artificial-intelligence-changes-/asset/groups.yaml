    （机器）的概念，认为符号是一种重要的媒介。她也从历史的角度对计算机发展进行考察，然而她并不认为机器是一种“被制造的主体”，而是符号的“中介功能”或者“形式化过程”的结果。①这些观点也代表着对机器的研究从技术史的视角转向思想史的视角，从“技术操作”理念转向“符号操作”理念。②
    传统的媒介哲学强调技术作为先决条件形塑和决定着媒介发展的进程，而克莱默尔认为媒介性才是阐释媒介中介功能的一个重要概念。③


    英语学界的传播学或者媒介研究理论在很大程度上受制于前文所提到的“身体（人）–技术”或“媒介–社会（人的复合体）”的二元对立结构，从而要么突出技术的作用，要么重点关注人际互动，而克莱默尔的信使模型则试图建构一种更为宏大的理论框架，它并不区分技术与人，也不强调技术的力量，因此拓宽了人们对媒介及其功能的理解，也能避免“技术决定论”的争议。④和基特勒一样，克莱默尔承认传播的物质性，但她同时也受到认知科学的影响，将基特勒所强调的媒介本体的物质性发展为强调传播的物质性，即认为媒介与人的知觉之间存在一种互动关系，媒介是处于所有社会和物质系统中的一个活跃的中介。在克莱默尔看来，接受者是主动的，因为传播依赖于具身性（embodiment），接受者不需要按照信息发出者的意图来理解。这一点完全不同于斯图亚特·霍尔（Stuart
    Hall）的编码与解码理论。由此看来，克莱默尔的媒介哲学理论已经从麦克卢汉或者以基特勒为代表的德国媒介理论传统中超脱出来，从而为人们理解人类、媒介与技术提供了更为广阔的视野。在这里人与技术之间处于更为平等的地位，二者互相联系且缺一不可，从而形成了一种去中心化的关系。


