    基特勒意义上的文化技艺注重探讨技术的使用如何影响人的认知，技术如何建构人的主体性，并从本体论的视角来分析媒介在信息的存储、处理和运输上的作用。③


    “文化技艺”一词的含义经历了多次演变。19 世纪 70 年代，“文化技艺”特指德国乡村和环境的改善程序（amelioration procedures），如排水灌溉、平整河床、修整栅栏④等，是一系列将自然和文化相区分开的操作和技术。20
    世纪 70 年代，“文化技艺”在教育领域被赋予新内涵，指一种阅读、书写、运算等素养能力，这些能力将人们从自然中剥离出来，以完成对自我的“教化”过程，即基特勒所理解的“文化技艺”。再到后来，“文化技艺”的概念越来越指向某些适应新媒介生态所必需的可操作性技能，它不只局限于单纯的技术领域，更内化在人的成长过程中，成为一套完整的编排、处理、再生产知识和经验的实践过程，体现为一种“媒介能力”（media
    competence）。到 20 世纪 80 年代，在德国兴起的媒介与文学研究开始关注那些被遮蔽的、不显眼的知识技术（如索引卡和打字机）、不可分类的媒介（如留声机和邮票）、规训技术（如语言习得），并以此代替了对文学文本的分析；这些侧重媒介物质性或技术性角度的分析将上述媒介事件、符号操作、语言和文化习得过程渐渐聚拢，形成了我们今日所言的“文化技艺”概念。⑤


