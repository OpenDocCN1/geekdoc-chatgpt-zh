    体，还将二者所处的不同时间和空间联系起来，甚至能够直接影响传播关系与传播效果。这种基于基础设施所建立的关联，既包含在不同时空基础上所造成的共时与共在，从而影响着媒介的时间和空间观念；也包括在物与人之间，以及物与物之间形成相关关系，从而建构的由人和物共同组成的关系网络。媒介技术的变迁不断改变着基础设施的形态及信息传播速度，从而也影响着新闻传播中的时空关系和人与物之间的关系网络。


    从与媒介相关的基础设施的形式上看，19 世纪之前的新闻传播主要依靠人力与马通过道路交通来实现连接，不仅速度慢，传播周期也比较长。然而进入电力时代之后，遍布各地的电缆将不同的时间和空间连接起来，由于传递速度非常快，传播者和接受者之间原本存在的时间和空间差异也就消失了。智能时代到来之后，基础设施在新闻传播中的作用显得更加突出。互联网的普及使得信息传达世界各个角落成为可能，而建立在平台化基础上的智能新闻生产和传播，都需要通过基础设施平台来实现新闻内容的数据化及数据的收集、存储和运输，因为平台就是用来组织用户的互动的可编程的基础设施（infrastructure）。①
    多种来源的新闻内容在被转化为数据之后，通过基础设施传入平台的数据接口在平台内进行整合。媒介的基础设施在此过程中将人与技术聚合起来，按照因果和相关等逻辑关系，通过计算机语义关系网，在内容生产者、传播者、接受者之间建立关联。大数据和人工智能的发展也可以被看做微处理器和网络环境中连接的结果，从而保证了算法能够以最小的时间间隔在全球信息网络上运行。②
