    和阿多诺（Theodor Wistugrund Adorno）看来，新的技术欺骗群众的文化根源，技术和科学的统治结合给文化带来了一种消极的后果，文化工业中每一种事物都是为资本服务的，技术具有抹杀文化创造性的作用。


    赫伯特·马尔库塞（Herbert Marcuse）认为科学技术造就了单向度的人，科学技术理性的操纵形成了社会的控制形式。知识由于受到技术的控制，只剩下一个基础的量化的世界，其客体越来越依赖于主体。在科学技术理性的极端形式中，一切自然科学的问题都消解于数学和逻辑之中，即客体的概念被消除。这时，技术理性就会先验地适用于维护社会的统治制度，当技术的逻辑融入统治逻辑后，科学技术、量化、技术的主体就会凸显出来，成为当今社会的控制形式。技术并不是中立的，技术社会是一个统治系统，已经在按技术的思想和结构来运转。在马尔库塞看来，技术统治等同于技术异化。技术手段把它的政治要求强加给自由和劳动时间，这时候自由人的主体性、主动性以及劳动已经被技术所控制和强化了，技术变成集权主义者，而这正是当代发达工业社会单面性的罪恶根源。


    而尤尔根·哈贝马斯则强调“系统”中工具合理性对价值合理性的挤压，将会导致系统“对生活世界的殖民化”①。科学技术在资本主义社会中的合法化（legitimation）使社会劳动工业化，因此工具理性就渗透到生活的其他领域和社会组织之中了。这时候便产生了一种技术对人的统治，“技术使人不可能成为自主的”②，这其实与马尔库塞和霍克海默都是有所呼应的；“技术使人不可能决定自己的生活”，这句话和马克思也是呼应的。这里，他也呼应了霍克海默的一句话，科学技术及意识形态不仅仅只是一种直接的生产力，“科学技术即意识形态”。在哈贝马斯批判技术的时候，马


    ① 哈贝马斯．交往行为理论：第1卷 [M]．曹卫东．译．上海：上海人民出版社，2004．

    ② 哈贝马斯．作为“意识形态”的技术与科学 [M]．李黎，郭言义，译．上海：学林出版社，1999：38－83．'
