    \ J D. Introduction; Friedrich Kittler's light shows [J]. Friedrich Kittler. Optical\
    \ Media, 2010: 1-17.\n\n要特征。① 在世界上报刊起源最早的德国，“报纸”（Zeitung）一词在意义上表示的就是“时间化”②，而杂志（Zeitschrift）也是“时间”（Zeit）和“文字”（Schrift）的组合③。相似的是，在我国的近代新闻实践中，戈公振也把“定期性”看做报纸的重要特征，在特定的时间间隔内新闻的公开过程不断地有规律地重复着。④\
    \ 然而，无线电的发明开启了人类信息传播的新时代，媒介的基础设施和传播速度彻底发生变革，从而也改变了时效性在新闻传播中的地位。产生于 19 世纪的电报技术则彻底打破了新闻的传播格局。自此以后，人类社会进入了声光电的时代，并因此带来了政治、经济、社会与文化方面的巨大变迁。信息以光的速度在世界范围内传输，无论物理距离相隔多远，都能够实现“共时”与空间上的“共在”。遍布于各地的电缆在高速传递信息的同时，也让符号的流动不再受到交通的局限。电报的发明第一次让信息传输在技术上摆脱了对物理交通的依赖，远远超过了书写和印刷文字的传播能力，也将传播从地理局限中解放了出来。⑤\
    \ 新技术不仅仅带来了关于时间和空间的新体验，也因为传播所建立的新的连接使事物之间产生更多的新关联。\n\n对于新闻行业而言，电报和遍布于各地的电缆也使本地新闻和那些没有时效性的新闻失去了在报纸上的中心位置。⑥\
    \ “报纸的财富不再取决于新闻的质量或用途，而是取决于这些新闻来源地的遥远程度和获取的速度。”⑦ 当时，电缆所铺设的范围和发布信息的费用还比较高，尚属于竞争性资源，也是每家媒体竞相逐的资源。当整个行业为了寻求信息传递的速度而普遍使用电报时，信息就变得比信息来源更加重要。受制于基础设施的新闻传播速度越来越成为影响新闻的首要因素，新闻时效性的地位也达到前所未有的高度。更为重要的是，伴随着传播速度的提升，时效性成为一种新的媒介商业价值被发现。1835\
    \ 年，世界首家通讯社哈瓦斯社开始开发信息的工业设施，并开始使用电报网。而伴随着大西洋海底电缆的铺设和四大新闻通讯社在全球新闻市场的划分，对新闻传播速度的竞争已经遍布全球。\n\
    信息在本质上是把时间与价值联系起来的一种商品，决定着媒介在工业时代特有的时间性。① 因此，时事新闻和信息都成为商品，而作为商品的新闻其价值高低是由其传播时间决定的，越不为人所知越是信息，各家新闻社都竭尽所能缩短新闻生产和传播的时间，杜绝任何中间环节的耽误从而保证新闻的“新鲜”。电报技术保证了新闻以光速传播，其速度之快已经超越了人类感知的阈值，实现了无延迟的传播。\n\
    \n如果说传递电报的电缆造就的是全球电子通信的基础网络，那么数字智能时代的光纤和互联网所造就的数字信号传输则是电报技术在全球范围内的另一种变迁，虽然二者之间传输原理近似，但是前者只能传输信息，而后者还能储存信息。从新闻生产和传播的角度来讲，互联网消灭了新闻事件的发生与输入人之间的延迟。新闻事件通过数字技术快速转化为数据，再通过基础设施快速储存和传输，及时送至接受者。“三个时段巧合于同一时空中，这就把它们之间的所有的时间延迟和空间距离都消除了，这也消除了所有的区域性，因为区域性来源于各区域的差异性，比如不同的日历性和空间性。”②\
    \ 这些计算组件和它们的基础设施所形成的巨大信息网络创\n\n① 斯蒂格勒. 技术与时间: 2. 迷失方向 [M]. 赵和平. 印螺, 译. 上海: 译林出版社,\
    \ 2010: 128.\n② 同①133.\n\n造了一个新的时间范围，造成了“即时报道的具有历史意义的飞跃”。输入的真实效果已经与实时传播合二为一，所以事件的发生、输入和传播构成唯一的也是同一的时间实时（real-time），从而产生了全然不同的“时间效应”①。\n\
    \n但这里需要说明的是，虽然传播速度已经超越了人的感知，但每一次传输都是有中介的，位于基础设施两端的传播者和接受者之间在物理空间上仍然存在差异，其中存在的延迟虽然非常短暂，但仍然是不可忽略的。所有的技术媒体都是通过这种延迟来运作的。②\
    \ 所以在媒介的物质性视角下，这种由媒介技术所造成的实时并不是一种人的感知，而是选址（addressing）的结果。③ 虽然在传播者和接受者之间所传递的实时信号速度非常快，但这样的实时并不是瞬时（instantaneous）。④\
    \ 这种由媒介的物质性所造成的瞬时性（instantaneity）不再仅仅是人们以感官就能感受到的当下，而是一种传播在空间中的扩展。在传播过程中，传播者和接受者都被分配到电缆或者光纤两端的某个位置，其形式包括电台的呼号、电话号码以及\
    \ IP 地址等，这个位置成为一个新的空间结构中的位置，从而在传播参与者个人中创造出一种新实体。⑤ 数字智能时代的传播所连接的并非个人而正是这样的新实体。\n\
