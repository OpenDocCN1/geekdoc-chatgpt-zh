    # 第三节 智能媒介网络与人的境况


    基于大数据与人工智能的智能技术的广泛应用正在全面重塑和再造新闻与资讯的生产、分发、用户互动与评价等全部流程环节，并对当下的媒介状况与社会生存情境产生复杂而深刻的影响。智能技术的推广和运用多处于对新技术的监管相对宽松的情况下，主要经由技术演进的自主推动，或经由用户对新技术的自发或被动员起的需求驱动而急速发展，并未经过广泛而长期的讨论和论证，因此也造成智能技术迅速切入原有的媒介系统，并逐渐形成占据媒介系统主导地位的局面，引发学界众多的讨论与担忧。在第二节对人与技术的关系进行系统讨论的基础上，本节主要聚焦由处理、传输和存储等三个环节所组成的智能媒体时代新闻生产的宏观流程，从基特勒所提出的“媒介网络”的视角出发，将智能新闻生产中的人与技术因素——除了编辑记者等传统的新闻生产者外，还包括数据存储系统等硬件设施和打标签的“隐形工作者”、内容审核人等——都共同纳入考量范畴，更加系统而深入地探索智能新闻生产背后的人与智能技术之间的关系，从而拓宽我们对新闻生产与媒介网络的认识。


    # 一、消融的主体性？智能媒体中的人与机器


    在技术高速发展的时代，社会媒介系统的结构与权力关系也发生了激烈的变化，并同时在迅速改变着社会结构、社会权力构架和利益分享分配机制，这引致学界和媒体深刻的忧虑和大量的批评。其中，一般伦理学取'
