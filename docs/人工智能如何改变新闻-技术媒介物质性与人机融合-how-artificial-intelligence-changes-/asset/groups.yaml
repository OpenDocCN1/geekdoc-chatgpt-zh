    者？当然基特勒谈论的技术只是技术的视角，而不是技术作为决定的因素。他从技术的视角看，在历史语境下，传播结构、社会结构如何发生变化。


    基特勒将媒介分析放到历史情境中，通过对处于后一历史阶段的媒介的使用来分析前一阶段的媒介。从后往前推，才能推出媒介的历史情境。基特勒在麦克卢汉的媒介分析的基础上，继承了拉康的精神分析以及米歇尔·福柯（Michel
    Foucault）的权力与话语研究、知识考古学的观点。另外他还提出了“传播的物质性”（materiality of communication）这个重要概念，用来分析媒介技术、制度框架和身体政权（body
    regimes），以及数学符号、字母和音乐符号等标记系统。那么如何理解传播的物质性呢？传播的物质性指传播过程中的物质载体。德布雷（Régis Debray）认为，媒介包括符号、语言体系和物质载体。信息的物质载体是显示屏，是书写的纸张表面。原来人们对媒介更多地关注传播效果，因为内容决定传播效果，但是今天，人们对媒介的关注从内容变成了物质载体，因为他们进一步发现传播的物质载体也影响传播效果。


