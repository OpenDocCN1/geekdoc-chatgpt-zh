    ## 第二节 从大众传播向中介社会传播模式的转变


    第一章和第二章介绍了基特勒的“物质性”“媒介网络”概念和克莱默尔对媒介“中介性”特征的阐释，这些观点都主张从物质/技术的视角出发，将新闻生产流程中的人与技术物都纳入其中从而形成以关系为核心的媒介网络。同时，除了强调物及其所建构的关系网络在新闻生产中的作用之外，媒介的物质性还非常强调媒介的中介特征，媒体由此成为一个由人（社会组织）与技术共同构成的中介系统，社会也是由众多技术的中介（mediation
    of many techniques）所建构的。① 在基特勒所强调的媒介本体的物质性的基础上，克莱默尔进一步发展了物质性的概念，认为在传播过程中，语言通过作为物质的媒介（例如书写、声音和手势等形式）与传播者的身体发生关联，从而被物质化了。②
    她引入认知科学的视角并将媒介的物质性与人的知觉关联起来，从技术的物质性转而强调传播的物质性，这就是说，之前基特勒所强调的技术对媒介的决定作用已经被媒介的中介功能所取代。


    克莱默尔尝试着放弃之前媒介研究将技术作为先决条件、技术形塑和决定媒介进程的思想，转而关注媒介的中介功能，由此提出媒介性（英文 mediality，德文 Medialität）的概念，认为所谓媒介性指精神世界的信息通过媒介被感知（wahrgenommen）和理解，媒介亦即感知。③
    媒介性体现为“技术/邮递模型”（postal model）和“人际/性爱模型”（erotic model）。前者借用古希腊神话中赫耳墨斯的信使角色，认为早期的信使扮演着媒介的角色，信使在两人之间传递信息但是从不改变信息的内容；后者则认为为媒介在中介过程中促进了两人的对话，从而实现了理解和融合。这两种模式在分析媒介性作为中介作用的本质特性时，都强调传播的二者之间存在差异，但前一种模型强调传播是在空间和物理距离中建立关系，虽然在交流中两人的个体差异无法消除，却反而能突出传播的对称性和间接性，从而凸显媒介作为传播过程中介的必要性；而后一种模型虽然消除了个体内部的差异，但当两人的差异得以消弭时，作为传播工具的媒介也就可以被忽略了，因此媒介处于外围地位。虽然这两种模型存在于各种传播和沟通中，但是克莱默尔更加强调技术/邮递模型，因为在其中媒介是信息传递的必要前提。


    结合基特勒和克莱默尔对媒介物质性的思考，我们可以发现，新闻传播的过程其实是符号在人与技术所构建的中介性关系网络中被物质化的过程。如果说基特勒的技术物质性更强调新闻的生产过程的话，克莱默尔的传播的物质性则更加关注新闻的传播过程。数字媒介技术的发展使得新闻的生产和传播的过程越来越无法分离，生产者和传播者的角色发生互换，而技术也逐渐取代人的角色，在内容逻辑和技术逻辑的矛盾中共同建构着新闻关系网。


    那么，在新闻学研究的物质性视角下，又该如何理解数字时代的人与技术、传播者与受众、媒介与社会的关系呢？以媒介的物质性和中介特征为基础，结合数据作为重要的物质在新闻传播中的作用，我们引入一种从数据的物质性视角出发，将人与技术、传者与受者融合的中介社会传播模式（mediated
    social communication，德语 sozial-zeit kommunikation），从而突破传统大众传播模式在分析新闻生产和传播中的限囿，建构符合数字时代的技术特征，更加强调对话、互动以及多元新闻传播主体的新闻传播模式。


    从威尔伯·施拉姆（Wilbur Schramm）到丹尼斯·麦奎尔（Denis McQuail）所建构起来的大众传播学体系，成为 20 世纪新闻传播研究的经典与核心领域。然而，进入数字化互联网时代以后，大众传播模式面临着巨大挑战，新的传播方式产生，传播者与受众之间的角色发生转变，传播学不再以探讨大众传播为核心议题，转而关注更广更深的领域。面临媒介技术不断革新所带来的巨大挑战和传播结构的改变，西方学者已经预言大众传播模式即将消亡，在这一特殊时期需要探寻更加适合当下情境的理论模式来分析新媒体技术下新的传播情境，整个传播学理论研究领域也面临着巨大变革。美国的理论更加关注微观层面，关注大众传媒、受众和媒介效果研究；而德国的理论更加侧重宏观层面，关注媒介与社会的互动，此中的传播形式也更为多元。因此在数字时代，很多德国传播学者在
    20 世纪 70 年代提出的传播理论，特别是中介社会传播理论仍然适用，甚至比大众传播理论更能解释目前信息传播者与接受者的互动关系。中介社会传播理论打破了大众传播理论相对单一的、被动的传播过程，从互动多元的视角来探讨传播参与者与媒体的关系，更加关注传播参与者作为传者和受者的多元角色转变，以及人在传播中所起的主动作用。这一模式不仅可以涵盖传统媒体时代的大众传播模式，而且适用于新媒体时代的社会化传播过程。它关注多元主体的参与与互动，也更能跨越媒介技术变迁所带来的挑战，将传统媒体与新媒体技术下的传播进程放到同一模式下来分析。图
    4-1 对比了大众传播模式与中介社会传播模式。


    | 大众传播模式 | 中介社会传播模式 |

    |---|---|

    | - 受众接受信息，大众媒体传播和控制信息<br>- 将公众（public）与媒介组织/记者分开<br>- 信息传播就是传一受-反馈关系<br>- 传播者与媒体（记者）分开<br>-
    记者和媒介组织作为“把关人”（gatekeeper），控制信息<br>- 受众是大众（mass），同质化群体<br>- 单一循环 | - 受众不仅接受信息，也传播信息，甚至也能控制信息（角色转换）<br>-
    公众与媒介组织/记者同样都作为中介系统（gatewatcher）<br>- 信息传播是一个社会对话的过程<br>- 记者与媒介组织都作为信息中介（mediator）<br>-
    记者和媒介组织作为中介接收者可以是个人、组织，多元化群体<br>- 多重循环（左—右），同样适用大众传播 |


    图 4-1 大众传播模式与中介社会传播模式的对比


    此外，在过去 70 年中，大众传播理论认为传播仅是从传者到受者的单向传播过程，其中反馈极为有限。① 然而，Web 2.0 技术和社交媒体的到来已经打破了大众传播原本单向的、被动的传播格局。受众的角色也发生了质的改变，而原本作为信息“把关人”的记者也已经失去了他们的核心地位，受众也更多地参与到更加互动化的传播过程中。新闻传播和接收的过程也越来越接近对话的互动过程，受众同样可以生产新闻内容。②
    在新的传播技术条件和传播文化下，需要重新思考传播过程和参与者的角色变迁。因此，相对于大众传播理论，中介社会传播理论更具生命力，也更符合媒介技术变迁中的传播过程研究。


    中介社会传播理论的发展经历了三个阶段：

    - （1）20 世纪 60 年代以前的发展初期，包括格鲁思（Groth）① 和阿斯韦鲁斯（Aswerus）② 的理论，主要关注报纸的传播模式；

    - （2）20 世纪 60 至 90 年代的发展中期，这一时期比较有代表性的研究如哈特（Hardt）③ 和皮提尔（Pietilä）④ 的社会网络研究；

    - （3）20 世纪 90 年代以后的发展成熟阶段，主要探讨新媒体时代的传播模式，以及记者和媒体（包括传统大众媒体和新媒体）在传播中的角色，代表人物包括瓦格纳（Wagner）⑤
    和宣哈根（Schönhagen）⑥。


    中介社会传播模式是德国学者在 20 世纪 70 年代针对大众传播理论所提出的，经过瓦格纳和宣哈根的发展，更加符合互联网时代新闻传播互动强、传播主体多元和多级传播的特点。在此基础上，我们融入数字时代的新闻的数据化特征，将新闻生产和传播的过程看做媒介技术中介下的数据流动过程，从而分析在中介传播模式中作为物的新闻数据如何将人与技术勾连起来并建构出新闻生产的中介系统，以及数据如何在不同新闻传播参与者之间流动，从而构建更加平等、互动的多元新闻内传播模式。如图
    4-2 所示，中介社会传播模式分析的是新闻信息如何通过中介系统在传播参与者中间传播的，其所囊括的新闻传播现象既可以是传统大众传播时代的报纸、广播和电视等媒介形式，也可以对数字时代的新闻传播行为具有较强的解释力。图
    4-2 中居中的中介系统对应着新闻生产，而左右两边的对称结构表示新闻传播的过程。


    ![](img/228cf445208423908042e1490b71df9d_152_0.png)


    图 4-2 中介社会传播模式结构图


