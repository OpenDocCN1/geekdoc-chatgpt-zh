  md: "\nInnis 和麦克卢汉等对媒介技术的探讨；而从历史上讲，技术对新闻的影响贯穿着整个新闻行业发展的历史，乃至人类信息传播的历史。从口语到文字，从书写到印刷，再从纸张到电子屏幕，每次媒介技术革新都会带来语言符号系统、媒介形态、新闻生产关系和社会权力关系的变革。历史是延续的，数字时代的变革亦是如此，因此新媒介技术所带来的改变也并非完全脱离媒介发展的规律。物质性视角所带来的新闻学研究范式转向，是将宏观视角的媒介理论融入更加关注微观层面的新闻实践，重新审视技术因素对新闻传播媒介的影响，这将赋予新闻学研究更为宏观的视角和更强的理论解释力。\n\
    \n## 第五章 数字智能时代\n### 新闻价值的变迁\n\n![](img/228cf445208423908042e1490b71df9d_158_0.png)\n\
    \n- 在不同的技术条件下，新闻价值标准及每个标准对新闻的重要程度都处于不断变化的状态。\n- 媒介本体论从物质性的视角来探讨基础设施对媒介的时间、空间和相关关系的影响，并进一步探讨技术对新闻价值判断标准带来的影响。基础设施决定着新闻信息的传播速度，继而影响媒介的时间和空间关系。\n\
    - 数字智能时代新闻价值的判断与评价体系依然建立在经典新闻价值要素的基础上。\n- 数字智能时代新闻价值的构建路径有两种：其一是新闻“价值客体”的拓展与革新，其二是人作为新闻“价值主体”地位的凸显。\n\
    \n大数据和人工智能技术深度嵌入新闻生产和传播过程中，在改变新闻行业的同时也使新闻的内涵与新闻价值发生了变化。互联网在全球的普及使得各地新闻信息的传输实现了零差异，新闻时效性的影响力开始减弱，当下媒体为提前0.1秒发布新闻而争分夺秒的情况，已经不如电视时代那样普遍。全球也因为互联网的连接而实现了时间上的“共时”与空间上的“共在”。\n\
    \n随着时效性在新闻价值中的影响力逐渐降低，新闻的相关性却因为新媒介技术而被提升到前所未有的高度，新闻成为一种因计算机语言的逻辑关联而产生的结果。智能技术的算法推荐将新闻内容转化为数据，根据数据符号所代表的语义进行切分和关联，并在关联结果的基础上追踪用户的使用行为特征和进行内容推荐，从而也改变着与新闻价值相关联的因素。从新闻行业的发展历程来看，“什么在决定新闻”这一经典议题一直都与媒介技术的发展紧密相连，新闻价值标准的变化也并非数字智能时代特有的现象，而是伴随着媒介技术的变迁进行的。①\n\
    \n在不同的技术条件下，新闻价值标准及每个标准对新闻的重要程度都处于不断变化的状态，其中受影响最大的便是时效性与相关性：在以邮驿和人传递信息的书写和印刷媒介时代，由于受限于传播速度，事件的发生与受众的接收之间隔时间比较长，时效性对于新闻传播虽然有重要意义，但是对新闻价值的影响并不大；自从电报发明以后，传播速度获得了惊人的突破，新闻的时效性也开始成为各家媒体竞争的目标，各家媒体不断争分夺秒抢发新闻；此后的传真、电话，抑或互联网都是电报技术的进一步发展。伴随着电缆和光纤在世界各地遍布开来，新闻事件的发生、报道和接收之间的时间和空间被深度关联了起来，光速传播实现了上述三者在空间和时间上的零差异，也让强调差异的时效性渐渐淡出竞争舞台。更为重要的是，互联网本身是一张聚合了不同的人和事物的关系网。通过计算机语义关系的处理，新闻内容被转化为数据并通过算法进行关联。新媒介技术造就的不仅仅是新闻时效性的降低、相关性的增加，更是新闻概念的泛化，新闻与资讯之间的边界日益淡化。从本质上来说，通过计算机语义关系所建构的新闻是一种技术逻辑的结果，因其关联的范围远远超过传统媒体时代，新闻价值的判断标准也发生了巨大改变。\n\
    \n本章基于技术的视角，分别从理论性的思辨阐释以及对新闻工作者的调研入手，从宏观到微观分析数字智能时代新闻价值的变迁。\n\n思辨部分从媒介本体论出发，探讨数字智能时代的新闻价值在时效性和相关性上是如何变化的，媒介技术的发展变迁对新闻的时间、空间和相关关系具有什么样的影响，又如何理解数字智能时代的新闻价值；通过分析媒介技术的实体——基础设施所建立的时间、空间，以及事物之间的关联，人们可以进一步理解技术是如何影响新闻内容和新闻价值的。数字化或者算法化的新闻意味着人们必须依赖基础设施，并通过它们来生活，而这些基础设施本身又受到更深层次的数据基础设施的监控、维护和控制。①\
    \ 从基础设施和数码物的物质性视角出发审视技术对媒介的时间性和相关性带来的影响，则能够在新技术环境下深切认知新闻价值的变迁。在此基础上，我们进一步探讨人与技术的关系及二者如何影响新闻的生产和传播，进而考察数字智能时代新闻的变革。\n\
    \n实证部分基于德尔菲法，首先整合近年国内外新闻价值相关文献确立的 33 条新闻价值指标，随后对来自不同类型媒体的共 36 位新闻工作者展开函询与访谈，在微观上探讨数字智能时代的传统新闻价值出现哪些转向，哪些新兴的新闻价值在中国新闻实践中得到认可，又有哪些因素影响新闻工作者对新闻价值的判断。\n\
    \n### 第一节 基础设施与新闻的时空变迁\n\n不同媒介技术条件下的基础设施决定着新闻信息传播的速度，以及时间与空间的关联。时间性是基础设施的核心问题，并且决定着空间。①\
    \ 纵观媒介技术的发展历程，我们可以清晰地看到信息传播的速度如何影响媒介的时间性与信息在地理空间层面的关系，以及时效性在新闻价值判断标准中的地位是如何变化的。出版和传递的周期决定了新闻的时间性。纸质媒介时代的新闻主要通过人力、马车、铁路、轮船等交通运输系统，传播速度慢，从事件发生到传播对象接收的过程也非常漫长，少则几日，多则几个月甚至半年。因此，电子时代以前的新闻生产建立在延迟性的基础上，事件从发生、报道到接收之间存在的时间差决定着新闻的价值。②\
    \ 报纸的本质是“日历上的巧合”，因为日报上所有的新闻故事的共同点是它们都发生在昨天。③ 定期（Periodizität）和新近、普遍、公开一同构成报纸的四大重\n\
    \n① STINE K. VOLMAR A. Infrastructures of time: an introduction to hardwired temporalities\
    \ [M] //AXEL V. KYLE S. Media infrastructures and the politics of digital time:\
    \ essays on hardwired temporalities. Amsterdam: Amsterdam University Press, 2021:\
    \ 9-37.\n\n② 胡冀青，李子超. 重塑新闻价值：基于技术哲学的思考 [J]. 青年记者, 2017 (4): 11-13.\n\n③ PETERS\
    \ J D. Introduction; Friedrich Kittler's light shows [J]. Friedrich Kittler. Optical\
    \ Media, 2010: 1-17.\n\n要特征。① 在世界上报刊起源最早的德国，“报纸”（Zeitung）一词在意义上表示的就是“时间化”②，而杂志（Zeitschrift）也是“时间”（Zeit）和“文字”（Schrift）的组合③。相似的是，在我国的近代新闻实践中，戈公振也把“定期性”看做报纸的重要特征，在特定的时间间隔内新闻的公开过程不断地有规律地重复着。④\
    \ 然而，无线电的发明开启了人类信息传播的新时代，媒介的基础设施和传播速度彻底发生变革，从而也改变了时效性在新闻传播中的地位。产生于 19 世纪的电报技术则彻底打破了新闻的传播格局。自此以后，人类社会进入了声光电的时代，并因此带来了政治、经济、社会与文化方面的巨大变迁。信息以光的速度在世界范围内传输，无论物理距离相隔多远，都能够实现“共时”与空间上的“共在”。遍布于各地的电缆在高速传递信息的同时，也让符号的流动不再受到交通的局限。电报的发明第一次让信息传输在技术上摆脱了对物理交通的依赖，远远超过了书写和印刷文字的传播能力，也将传播从地理局限中解放了出来。⑤\
    \ 新技术不仅仅带来了关于时间和空间的新体验，也因为传播所建立的新的连接使事物之间产生更多的新关联。\n\n对于新闻行业而言，电报和遍布于各地的电缆也使本地新闻和那些没有时效性的新闻失去了在报纸上的中心位置。⑥\
    \ “报纸的财富不再取决于新闻的质量或用途，而是取决于这些新闻来源地的遥远程度和获取的速度。”⑦ 当时，电缆所铺设的范围和发布信息的费用还比较高，尚属于竞争性资源，也是每家媒体竞相逐的资源。当整个行业为了寻求信息传递的速度而普遍使用电报时，信息就变得比信息来源更加重要。受制于基础设施的新闻传播速度越来越成为影响新闻的首要因素，新闻时效性的地位也达到前所未有的高度。更为重要的是，伴随着传播速度的提升，时效性成为一种新的媒介商业价值被发现。1835\
    \ 年，世界首家通讯社哈瓦斯社开始开发信息的工业设施，并开始使用电报网。而伴随着大西洋海底电缆的铺设和四大新闻通讯社在全球新闻市场的划分，对新闻传播速度的竞争已经遍布全球。\n\
    信息在本质上是把时间与价值联系起来的一种商品，决定着媒介在工业时代特有的时间性。① 因此，时事新闻和信息都成为商品，而作为商品的新闻其价值高低是由其传播时间决定的，越不为人所知越是信息，各家新闻社都竭尽所能缩短新闻生产和传播的时间，杜绝任何中间环节的耽误从而保证新闻的“新鲜”。电报技术保证了新闻以光速传播，其速度之快已经超越了人类感知的阈值，实现了无延迟的传播。\n\
    \n如果说传递电报的电缆造就的是全球电子通信的基础网络，那么数字智能时代的光纤和互联网所造就的数字信号传输则是电报技术在全球范围内的另一种变迁，虽然二者之间传输原理近似，但是前者只能传输信息，而后者还能储存信息。从新闻生产和传播的角度来讲，互联网消灭了新闻事件的发生与输入人之间的延迟。新闻事件通过数字技术快速转化为数据，再通过基础设施快速储存和传输，及时送至接受者。“三个时段巧合于同一时空中，这就把它们之间的所有的时间延迟和空间距离都消除了，这也消除了所有的区域性，因为区域性来源于各区域的差异性，比如不同的日历性和空间性。”②\
    \ 这些计算组件和它们的基础设施所形成的巨大信息网络创\n\n① 斯蒂格勒. 技术与时间: 2. 迷失方向 [M]. 赵和平. 印螺, 译. 上海: 译林出版社,\
    \ 2010: 128.\n② 同①133.\n\n造了一个新的时间范围，造成了“即时报道的具有历史意义的飞跃”。输入的真实效果已经与实时传播合二为一，所以事件的发生、输入和传播构成唯一的也是同一的时间实时（real-time），从而产生了全然不同的“时间效应”①。\n\
    \n但这里需要说明的是，虽然传播速度已经超越了人的感知，但每一次传输都是有中介的，位于基础设施两端的传播者和接受者之间在物理空间上仍然存在差异，其中存在的延迟虽然非常短暂，但仍然是不可忽略的。所有的技术媒体都是通过这种延迟来运作的。②\
    \ 所以在媒介的物质性视角下，这种由媒介技术所造成的实时并不是一种人的感知，而是选址（addressing）的结果。③ 虽然在传播者和接受者之间所传递的实时信号速度非常快，但这样的实时并不是瞬时（instantaneous）。④\
    \ 这种由媒介的物质性所造成的瞬时性（instantaneity）不再仅仅是人们以感官就能感受到的当下，而是一种传播在空间中的扩展。在传播过程中，传播者和接受者都被分配到电缆或者光纤两端的某个位置，其形式包括电台的呼号、电话号码以及\
    \ IP 地址等，这个位置成为一个新的空间结构中的位置，从而在传播参与者个人中创造出一种新实体。⑤ 数字智能时代的传播所连接的并非个人而正是这样的新实体。\n\
    \n① 斯蒂格勒．技术与时间：2．迷失方向［M］．赵和平，印螺，译．上海：译林出版社，2010：138．\n② SPRENGER F．Temporalities\
    \ of instantaneity：electric wires and the media of immediacy［M］//JOHN D P，FLORIAN\
    \ S，CHRISTINA V．Action at a distance．Minneapolis，London：University of Minnesota\
    \ Press，2020：1-28．\n③ KITTLER F．Towards an ontology of media［J］．Theory，culture\
    \ & society，2009，26（2-3）：23-31．\n④ 在英文语境中，瞬时（instantaneous）更多地强调一种感知上的共时，具体指“done，occurring\
    \ or action without any perceptible duration of time”（在没有任何可感知的时间停留的情况下完成、发生或行动），参见《韦氏词典》。\n\
    ⑤ 同①．\n\n的技术实时。从技术角度来看的话，时间并非感知，而是在技术基础上所建立的事物间的一种关系。古代通过水滴或者太阳高度来计算时间，将时间与外在自然物产生关联；钟表发明以后，时间变成了钟表内部大小齿轮之间旋转的关系，时钟也成为具有同步功能的技术系统中时间存在的一种方式。①\
    \ 时间本身就是一个网络，是通过不同物体且在它们之中表达的关系。② 然而，技术系统的变化使得某些客体间的关系过时或者被取代，同时数字技术的运用也促进着时钟时间为拓扑时间所取代。拓扑时间关系所建构的是一种物体与此在连接时所产生的客体间关系，即指定事件的发生及其顺序，是一种基于之前、之后和期间的逻辑顺序关系。拓扑时间必须建立在物质性的基础上，之前需要通过笔记本、日历或者记忆来记录这些关系，而今无处不在的数码物以及媒介基础设施成为拓扑时间的记录载体。③\
    \ 所以可以说，数码物所建构的客体间关系之一就是时间关系。智能新闻的时间性，正是建立在基础设施所具有的物质性特征和数码物所建立的时间关系之上。数字时代的时间也决定着空间并创造着人们与空间的关系。从媒介技术在人类文明进程中的发展来看，我们可以发现媒介的时间性和空间性是一个典型的技术话题，而时效性在新闻价值中的地位变化也是由媒介技术——其具体表现为基础设施——所决定的。媒介的基础设施既包含新闻生产所需要的具体机械设备，也包含新闻传播中必不可少的信息传递渠道。因此在纸质新闻的时代，新闻的时效性是印刷机（之前为人力，之后发展为蒸汽机和电力）与邮政系统（包括人力、动物、汽车和轮船等）的时间性来决定的，因为发行周期长和传播速度比较慢，时效性的影响非常微弱；而当人类社会进入电力时代之后，新闻内容的输入和传播的速度\n\
    \n① 海德格尔．存在与时间 [M]．陈嘉映．王庆节．译．上海：上海三联书店，2012．\n② 许煜．论数码物的存在 [M]．李婉楠．译．上海：上海人民出版社，2019，168．\n\
    ③ 同②162－163．\n\n都已经实现光速，基于电缆、无线电基站、有线电视和光纤等基础设施之上的高速新闻传播用时间消灭了空间，让新闻接受能够接触实时的信息，但这种实时并非一种人的感知，而是基于基础设施的物质性特征所产生的特殊效果。虽然时间与人的感知高度相关，但仅仅从感知角度来讨论媒介的时间性，仍然难以解决一个问题：为什么互联网中实现了实时，但是时间和地理空间的差异却确实存在着？这样的实在性是无法因为人的感知而忽略的。因此，位于基础设施两端的传播参与者之间在时空差异的基础上，通过选址的过程被赋予了新空间结构中的新位置，从而成为一种新实体。这种实体在本质上是一种数码物，而非感知。在共时的基础上，全球各地也因为基础设施的链接和数码物所建构的关联而实现了空间上的“共在”。\n\
    \n这里需要强调的是基础设施在新闻传播参与者中间所期待的重要连接作用，连接既是产生时间关系的基础，也是实现时间实时和空间共在的基础。无论当今传播速度有多快，新闻的延迟性从物质特征上说是无法被消除的，延时性也决定着新闻的价值。特别是在数字智能时代，新闻的生产和传播都是通过基础设施而转化为数码物，数码物在连接不同时空的同时还让客体物产生了更多的关联，从而造就新的时空环境。可以说连接已经成为数字智能时代难以忽略的特征，当基础设施出现故障而发生断连（disconnection）时，我们很难想象会发生什么。因此，数字智能时代的新闻传播不可忽略基础设施所具有的物质性特征及其对新闻价值的影响。\n\
    \n### 第二节 语义关系网与关联规则推荐算法\n\n数码物和基础设施不仅影响新闻的时效性，而且还能够通过大数据和算法在不同的客体物之间建立关联。媒介本体论将新闻生产的过程视做将资料文档、调查报告和数据库等事实和证据进行社会聚合（social\
    \ assemblage）的过程，并在聚合中建立相关关系。① 在互联网技术普及以前，新闻从业者主要通过个人经验来判断新闻价值是否与受众相关，所以新闻的相关性是基于个人认知和社会建构的结果。但是，当下普及的互联网通过算法和大数据，将不同的客体事物转化为数码物，再经过语义关系网在用户与内容、数据和事物之间建立关联。通过互联网平台端口的转接和传送，客体物和数据之间能够进行快速的转化、输入、存储和传输，最终通过手机\
    \ App 或者新闻网页等交互界面，实现新闻内容与用户之间的关联。互联网所造就的是一个基于人和机器协同使用的标记语言（如 HTML、MARC、GML）所组成的语义关系网络，因而其所产生的关联的范围要比之前基于记者经验所做出的判断大得多。②\
    \ 就新闻的相关性而言，智能新闻的生产和传播过程通过互联网将进一步扩大与新闻相关的人与事物的范围，也就是说计算机网络的引入造就了一种新的相关和链接。\n\n\
    大数据需要相应的基础设施来实现数据的采集、存储和计算，当下智能新闻的生产和传播过程就建立在基础设施所搭建的平台上。《人民日报》的中央厨房、新浪微博的平台，以及头条的新闻处理平台，都是内容平台的典型代表。新闻内容生产者首先通过平台端口将内容输入平台，平台的算法系统继续根据语言处理的语法规则，将内容拆分和转化为能够为计算机所读取的数据，然后再进行关联、存储和推荐。因为数据量很大，所以让推荐算法有序运行就需要建立关联规则推荐算法，从数据库中提取存在相关关系的对象。①\
    \ 关联规则推荐算法建立在计算机语义关系网之上，其中的语义关系逻辑假设不同事物之间具有相关性。于是，通过大量对用户行为的监测，计算机首先把频繁出现的事物找出来，再考察其关联性并进行推荐。传统新闻价值的相关性主要根据记者和编辑的经验判断新闻事件是否与受众的利益、兴趣或地理等因素相关，而算法推荐系统则在搜集用户的点击、阅读、评论或点赞等行为基础上，按照兴趣类（兴趣的类别、主题、关键词、内容的来源、基于兴趣用户的类别标签）、身份类（性别、年龄、常住地点）、行为标签（用户行为特点）等相关原则来确定语义标签，从而建立一个巨大的信息分类池。②\
    \ 然后在新闻内容分发阶段再建立一个用户分类池，并通过计算机将两个池子中的类别进行匹配。关系数据库与关系演算是计算机进行分类的基础，算法通过比较数据的标签名称而创建关系，所以标签名称本身就代表着某些关系。计算机能够生成和梳理大量的数据和关系，而数据本身就是关系，也是关系的来源。③\
    \ 数据的追踪和查询将新闻内容与潜在内容接受者之间关联起来，进一步拓展了新闻相关性的范围。这样的改变正是基于基础设施及其所代表的媒介技术所带来的结果，计算机语义关系实现了用户与新闻内容之间的多元关联，而新闻传播也不再仅仅是一对多的大众传播过程，而是根据对用户个人行为的追踪结果与新闻语义分析之间所建立的个体化关联关系，内容的分发从而也实现了去中心化。\n\
    \n语义关系所构成的算法关联和选择其实也是大数据时代的结果，因为数据量太大，没有关系的原始数据只是散乱而毫无意义的。而在现实操作中，数据冗余、相关性差、逻辑关系不明也正是困扰数据处理工作人员的\n\
    \n① 塔娜，唐铮. 算法新闻 [M]. 北京：中国人民大学出版社，2019：10.  \n② 同①135–136.  \n③ 许煜. 论数码物的存在 [M].\
    \ 李婉楠，译. 上海：上海人民出版社，2019：127.\n"
  mdcn: "\nInnis 和麦克卢汉等对媒介技术的探讨；而从历史上讲，技术对新闻的影响贯穿着整个新闻行业发展的历史，乃至人类信息传播的历史。从口语到文字，从书写到印刷，再从纸张到电子屏幕，每次媒介技术革新都会带来语言符号系统、媒介形态、新闻生产关系和社会权力关系的变革。历史是延续的，数字时代的变革亦是如此，因此新媒介技术所带来的改变也并非完全脱离媒介发展的规律。物质性视角所带来的新闻学研究范式转向，是将宏观视角的媒介理论融入更加关注微观层面的新闻实践，重新审视技术因素对新闻传播媒介的影响，这将赋予新闻学研究更为宏观的视角和更强的理论解释力。\n\
    \n## 第五章 数字智能时代\n### 新闻价值的变迁\n\n![](img/228cf445208423908042e1490b71df9d_158_0.png)\n\
    \n- 在不同的技术条件下，新闻价值标准及每个标准对新闻的重要程度都处于不断变化的状态。\n- 媒介本体论从物质性的视角来探讨基础设施对媒介的时间、空间和相关关系的影响，并进一步探讨技术对新闻价值判断标准带来的影响。基础设施决定着新闻信息的传播速度，继而影响媒介的时间和空间关系。\n\
    - 数字智能时代新闻价值的判断与评价体系依然建立在经典新闻价值要素的基础上。\n- 数字智能时代新闻价值的构建路径有两种：其一是新闻“价值客体”的拓展与革新，其二是人作为新闻“价值主体”地位的凸显。\n\
    \n大数据和人工智能技术深度嵌入新闻生产和传播过程中，在改变新闻行业的同时也使新闻的内涵与新闻价值发生了变化。互联网在全球的普及使得各地新闻信息的传输实现了零差异，新闻时效性的影响力开始减弱，当下媒体为提前0.1秒发布新闻而争分夺秒的情况，已经不如电视时代那样普遍。全球也因为互联网的连接而实现了时间上的“共时”与空间上的“共在”。\n\
    \n随着时效性在新闻价值中的影响力逐渐降低，新闻的相关性却因为新媒介技术而被提升到前所未有的高度，新闻成为一种因计算机语言的逻辑关联而产生的结果。智能技术的算法推荐将新闻内容转化为数据，根据数据符号所代表的语义进行切分和关联，并在关联结果的基础上追踪用户的使用行为特征和进行内容推荐，从而也改变着与新闻价值相关联的因素。从新闻行业的发展历程来看，“什么在决定新闻”这一经典议题一直都与媒介技术的发展紧密相连，新闻价值标准的变化也并非数字智能时代特有的现象，而是伴随着媒介技术的变迁进行的。①\n\
    \n在不同的技术条件下，新闻价值标准及每个标准对新闻的重要程度都处于不断变化的状态，其中受影响最大的便是时效性与相关性：在以邮驿和人传递信息的书写和印刷媒介时代，由于受限于传播速度，事件的发生与受众的接收之间隔时间比较长，时效性对于新闻传播虽然有重要意义，但是对新闻价值的影响并不大；自从电报发明以后，传播速度获得了惊人的突破，新闻的时效性也开始成为各家媒体竞争的目标，各家媒体不断争分夺秒抢发新闻；此后的传真、电话，抑或互联网都是电报技术的进一步发展。伴随着电缆和光纤在世界各地遍布开来，新闻事件的发生、报道和接收之间的时间和空间被深度关联了起来，光速传播实现了上述三者在空间和时间上的零差异，也让强调差异的时效性渐渐淡出竞争舞台。更为重要的是，互联网本身是一张聚合了不同的人和事物的关系网。通过计算机语义关系的处理，新闻内容被转化为数据并通过算法进行关联。新媒介技术造就的不仅仅是新闻时效性的降低、相关性的增加，更是新闻概念的泛化，新闻与资讯之间的边界日益淡化。从本质上来说，通过计算机语义关系所建构的新闻是一种技术逻辑的结果，因其关联的范围远远超过传统媒体时代，新闻价值的判断标准也发生了巨大改变。\n\
    \n本章基于技术的视角，分别从理论性的思辨阐释以及对新闻工作者的调研入手，从宏观到微观分析数字智能时代新闻价值的变迁。\n\n思辨部分从媒介本体论出发，探讨数字智能时代的新闻价值在时效性和相关性上是如何变化的，媒介技术的发展变迁对新闻的时间、空间和相关关系具有什么样的影响，又如何理解数字智能时代的新闻价值；通过分析媒介技术的实体——基础设施所建立的时间、空间，以及事物之间的关联，人们可以进一步理解技术是如何影响新闻内容和新闻价值的。数字化或者算法化的新闻意味着人们必须依赖基础设施，并通过它们来生活，而这些基础设施本身又受到更深层次的数据基础设施的监控、维护和控制。①\
    \ 从基础设施和数码物的物质性视角出发审视技术对媒介的时间性和相关性带来的影响，则能够在新技术环境下深切认知新闻价值的变迁。在此基础上，我们进一步探讨人与技术的关系及二者如何影响新闻的生产和传播，进而考察数字智能时代新闻的变革。\n\
    \n实证部分基于德尔菲法，首先整合近年国内外新闻价值相关文献确立的 33 条新闻价值指标，随后对来自不同类型媒体的共 36 位新闻工作者展开函询与访谈，在微观上探讨数字智能时代的传统新闻价值出现哪些转向，哪些新兴的新闻价值在中国新闻实践中得到认可，又有哪些因素影响新闻工作者对新闻价值的判断。\n\
    \n### 第一节 基础设施与新闻的时空变迁\n\n不同媒介技术条件下的基础设施决定着新闻信息传播的速度，以及时间与空间的关联。时间性是基础设施的核心问题，并且决定着空间。①\
    \ 纵观媒介技术的发展历程，我们可以清晰地看到信息传播的速度如何影响媒介的时间性与信息在地理空间层面的关系，以及时效性在新闻价值判断标准中的地位是如何变化的。出版和传递的周期决定了新闻的时间性。纸质媒介时代的新闻主要通过人力、马车、铁路、轮船等交通运输系统，传播速度慢，从事件发生到传播对象接收的过程也非常漫长，少则几日，多则几个月甚至半年。因此，电子时代以前的新闻生产建立在延迟性的基础上，事件从发生、报道到接收之间存在的时间差决定着新闻的价值。②\
    \ 报纸的本质是“日历上的巧合”，因为日报上所有的新闻故事的共同点是它们都发生在昨天。③ 定期（Periodizität）和新近、普遍、公开一同构成报纸的四大重\n\
