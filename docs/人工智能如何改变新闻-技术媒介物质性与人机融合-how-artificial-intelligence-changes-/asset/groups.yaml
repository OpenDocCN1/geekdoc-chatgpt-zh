    代的技术特征，更加强调对话、互动以及多元新闻传播主体的新闻传播模式。


    从威尔伯·施拉姆（Wilbur Schramm）到丹尼斯·麦奎尔（Denis Mc-Quail）所建构起来的大众传播学体系，成为 20 世纪新闻传播研究的经典与核心领域。然而，进入数字化互联网时代以后，大众传播模式面临着巨大挑战，新的传播方式产生，传播者与受众之间的角色发生转变，传播学不再以探讨大众传播为核心议题，转而关注更广更深的领域。面临媒介技术不断革新所带来的巨大挑战和传播结构的改变，西方学者已经预言大众传播模式即将消亡，在这一特殊时期需要探寻更加适合当下情境的理论模式来分析新媒体技术下新的传播情境，整个传播学理论研究领域也面临着巨大变革。美国的理论更加关注微观层面，关注大众传媒、受众和媒介效果研究；而德国的理论更加侧重宏观层面，关注媒介与社会的互动，此中的传播形式也更为多元。因此在数字时代，很多德国传播学者在
    20 世纪 70 年代提出的传播理论，特别是中介社会传播理论仍然适用，甚至比大众传播理论更能解释目前信息传播者与接受者的互动关系。中介社会传播理论打破了大众传播理论相对单一的、被动的传播过程，从互动多元的视角来探讨传播参与者与媒体的关系，更加关注传播参与者作为传者和受者的多元角色转变，以及人在传播中所起的主动作用。这一模式不仅可以涵盖传统媒体时代的大众传播模式，而且适用于新媒体时代的社会化传播过程。它关注多元主体的参与与互动，也更能跨越媒介技术变迁所带来的挑战，将传统媒体与新媒体技术下的传播进程放到同一模式下来分析。图
    4-1 对比了大众传播模式与中介社会传播模式。'
