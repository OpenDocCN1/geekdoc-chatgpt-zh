    的传统价值要素中，“客观性”作为新闻专业主义的核心理念，尤其受到学界关注。① 数字时代的新闻生产面向社会开放，越来越多的非专业实践主体参与新闻生产流通，使新闻报道的质量参差不齐，传者与受者的界限日益模糊不清。在这一背景下，“透明性”作为新价值规范受到广泛关注，被学者看做新闻客观性的发展传承②，意在增强公众对新闻的信任，维护新闻职业的合法性③。是否明确展示了新闻所使用的数据来源和方法、是否为公众提供参与新闻制作的机会以及提供记者的背景信息④，成为新闻从业者证明自身职业合法性的新方式。数字时代，互联网平台的开放性为新闻生产者向受众展示数据来源与相关方法提供了便利⑤，为透明性提供了从理念向实践的转化路径。


    互联网技术发展也创造了全新的新闻价值要素。例如，传统媒体与受众间的关系是单向传播，而互联网的发展使得传播从直线变成网状关系传播模式，带来的最直观的变化就是“互动性”和“交互性”的提升，体现为记者编辑在进行新闻价值判断时对用户互动数据的关注。⑥
    从技术的角度看，机器学习和人工智能算法可以根据用户的行为模式建立用户属性和偏好模型，根据模型分析用户兴趣点，向用户提供个性化内容和互动体验。⑦


