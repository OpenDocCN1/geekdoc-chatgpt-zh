    \ research, 1965, 2 (1): 64 - 90.\n② 杨保军. 准确认识“新闻的价值”：方法论视野中的几点新思考 [J]. 国际新闻界,\
    \ 2014 (9): 108 - 121.\n③ 白红义. 重访“新闻价值”：一个新闻学中层理论的构建与创新 [J]. 新闻与写作, 2021 (11):\
