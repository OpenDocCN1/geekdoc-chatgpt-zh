    分析“新闻的生产实践”理论范畴可以发现，新闻生产的显性流程表现为新闻内容的生产和新闻分发两方面。新闻生产实践是人和算法合作的直接体现。分析“人的主体性”理论范畴可以发现，在新闻生产实践过程中，人的主体性彰显主要体现在自身的主观能动性、人的社会属性和人对算法的干预三个方面。这三方面是新闻生产实践中必不可少的因素，且同时算法压制人的能动性，两者处于竞争关系。分析“新闻价值”理论范畴可以发现，人和算法在互动过程中塑造了新闻价值的内涵。新闻价值是人的能动性（对信息的判断、分析与理解）与算法（对效率的追求、与用户的互动反馈等）能动性共同作用于新闻生产实践产生的价值考量。分析“算法的自主性”理论范畴可以发现，算法通过对人的工作内容、工作流程等进行“驯化”压制人的能动性和主体性。在一定程度上，算法需要依赖“人”这一客体体现自身的主体性。分析“底层逻辑”理论范畴可以发现，一定的物质条件、建构并遵循可被理解的规则和工具性目标这三者使得新闻生产得以实现，其中凸显了人与算法的交流与平等地位。综合而言，这五个理论范畴均体现了人和算


