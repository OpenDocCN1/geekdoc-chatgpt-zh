    新闻社会角色和功能的认知，考虑如何用方案导向和指导性的报道代替冲突性故事，从而更好地履行媒体服务公众的职能。① 建设性的核心概念起源于西方新闻运动，是对传统西方新闻价值中“消极取向”的纠偏和补充，呼吁培育积极的舆论氛围，避免加剧受众的负面情绪以及社会对立。②
    在中国传统文化、马克思主义新闻观，以及新闻社会责任与功能导向的协同影响下，建设性发展出了独有的中国范式。③ 建设性与正面性在表现上有相似之处，但前者强调面向未来的问题解决导向，后者则强调新闻中的积极色彩。④


    伴随着社交媒体的普及，“实用性”也成为数字时代广受关注的新闻价值要素。“实用”的新闻指那些更加关注受众生活需求、更生活化、更实用的相关新闻，能为受众提供专业性、经验性、建议性的信息，帮助受众更好地处理日常问题，比如网上购物、在线教育、政策指南等，为人们的生活提供便利。⑤
    杨奇光和王润泽将“实用性”新闻定义为具有明显的实用导向、能发挥公共服务作用的新闻，比如新闻机构发布的 Top10 名单、榜单和技巧等。⑥


    # ## 二、数字智能时代新闻价值标准的设定


    “数字时代新闻价值要素重探”研究项目从 2021 年 12 月中旬开始启'
