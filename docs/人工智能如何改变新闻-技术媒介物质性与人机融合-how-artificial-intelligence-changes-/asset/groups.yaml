    就现有研究来看，国内在媒介物质性研究上的主要成果集中在传播学领域，而在新闻学领域则非常有限，无论是从本土研究的创新性还是在与国际学术交流中建构中国特色的新闻学研究，从媒介本体论、技术与媒介物质性视角出发并结合中国自身新闻传播实践来探寻新闻传播规律的研究都具有重要意义。


    此外，更为重要的是，目前与媒介物质性与本体论转向相关的理论具有浓厚的西方文化和历史特色，那么它应该如何与中国语境对接、与马克思主义新闻观和中国哲学及传统媒介思想对话？如何通过媒介来打通中西思想，形成跨越文化语境的学术对话，并回应当下中国新闻传播研究中的实际问题？实际上，当前在马克思主义理论研究、中西技术哲学①和媒介哲学研究中已经形成比较丰富的成果，这些都将成为新闻学研究物质性转向与中国特色新闻学研究体系建构的重要思想源泉。'
