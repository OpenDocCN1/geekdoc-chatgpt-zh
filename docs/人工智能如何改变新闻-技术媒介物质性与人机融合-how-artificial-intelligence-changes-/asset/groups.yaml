    > 我们平时的一项重要工作就是维护和信源的关系，有些事情会提前发布消息，那就可以（对消息）做预处理，准备好文字、视频等材料。（Z2）


    此外，在新闻制作的过程中，许多算法无法捕捉或暂时无法被数据化的信息必须由记者在场并与信源发生互动以获得。


    第二，隐藏于传统新闻业层层结构和权利之下的记者和编辑的主观能动性得到凸显。在新闻制作阶段，新闻工作者综合自身获取的信息和计算机抓取、过滤、呈现出的信息制作新闻，甚至能够基于数据分析和自身的工作经验，对即将发生的某些事件做出预测。在写稿过程中不仅能体现出个体对信息的选择、判断和分析，还能体现出撰稿人的写作风格、用词偏好等可能更吸引读者的内容。在新闻发布阶段，少量新闻由人根据新闻的重要性、相关单位要求、市场压力等因素来决定推送的顺序以及出现在页面上的位置。


    > 人工更多的是一些热点的快速的铺场，或者说对快速热点的运营，就是你要让用户感知到这个地方是热的。（Z3）


    第三，人通过多种方式驯化算法，甚至在某些方面可以违背算法自身的技术逻辑。如，人制定算法对信息监测和评估的指标，干预算法的推荐排序和被分发到新闻的受众群体，限制算法只能生产某些特定领域的新闻内容，制定算法审核的过滤机制等。从人的主体性角度来说，算法由人来创造，其目的是为了更好地服务于人的生产实践。


    与此对应的是，算法在与人组成的网络中同样彰显出其自主性特征。


    首先，算法自身的能动性是其自主性的重要表征。算法主要通过对大数据的监测、对信息热度的评估、与用户的互动、积累用户反馈，使得自身的推荐能力得到优化；同时，算法实现了自动化写作。这两方面均展现出算法的能动性。


    以腾讯新闻为例，在信息监测和评估方面，


    > 我们有一个后台，我们能看到他们都发了些什么东西。还有一个类似于中台一样的存在，它们会去做内容的识别与理解，再把事件转化为热度值。如果我们发现某一个事情的热度快速升高，就意味着有大量的发文，可能这就是一个潜在的热点。（Z3）


    在自动化写作方面，算法会针对财经或者其他的部分自动写一些东西，这些东西部分是人、部分是机器写的，这对于读者其实是没有区分的。它是整个的一套算法，先把数据都抓取过来，再自己把这些信息塞到某个框架里，然后形成一篇比较简单的文章。（Z3）


    在与用户的互动方面，算法搭建了新闻分发者与受众之间的桥梁，使内容投放更加精准。算法根据预估的点击率，或者是用户点击后预估的停留时长、点赞分享等指标进行过滤，然后按照设定好的公式对过滤后的新闻进行指标评定并形成排序，再推荐给用户，之后会根据用户实际的行为修订预估的偏差，动态调整新闻推荐的排序。算法作为弱人工智能技术能够创造巨大的生产能力，原因就在于其在生产过程中排除了人的干扰，不必被人自身固有的肉体限制所局限，可以比人类个体劳动者更有效率也更持久地进行机械性的生产劳动。①
    算法作为人的器官的延伸，也能够在互联网中广泛搜集信息进行识别和实时监测。


    其次，算法自主性的另一个重要表现是其对人的“驯化”。无论新闻从业者对此持有怎样的态度，都不得不去了解算法的基本运行逻辑，以运用其更高效、更有质量地完成工作。这首先导致了工作流程的标准化，从业者不得不根据算法调整工作习惯，在一定程度上抑制了人的主体性和创造力。在整个算法系统中，技术产生了统一的标准，人在参与的过程中需要遵循这样的“技术律令”。其次是工作内容的程式化。一方面，新闻生产被精细地切割为多个部分，每个人只能完成自己负责的部分，“这也是让我觉得比较难受的地方，我甚至不能写什么评论性的东西，我写这个东西会被编辑改掉的。我试过一次，对突发的新闻做了一点分析，编辑就会跟我说不要这样子，因为会有人最后去分析这件事，我的就被改掉了”（Z1）。另一方面，人在进行新闻采写、审核和分发的过程中需要遵守严格的程序，新闻生产较之专业新闻时代更加机械，从业者成为新闻生产流水线上的“零部件”，从而使人产生价值危机：“我感觉自己很像螺丝钉，觉得今年上班干的事情很无聊，也没有什么智力性的产出。我们每天干的都是些很机械的活，我很可能被机器取代。”（Z4）此外，人的工作痕迹高度数据化，人工涉及算法的工作过程都被算法自动记录，部分不涉及算法的工作也会以工作日报的方式存档。在新闻生产的“车间”中，算法在一定程度上可以被看做从业者行为的“指挥棒”。


    显然，以上对人与算法技术的讨论并不意味着两者可以脱离语境分而论之，否则就容易陷入笛卡尔机械主义式的人机对立中。随着自动化技术的不断发展，人与机器所组成的系统需要不断提高“反馈”能力，才能真正将人与技术的效能最大化地发挥出来。从“器官投射”的视角来看，今天的人工智能技术并非带来劳动力的异化，不管其结构如何精密复杂，自动化程度有多高，也“绝对只是器官的投射”而已。①
    智能系统中的各种用于监测和推断人类行为的工具，也仅仅只是人的外化而已。所以，智能媒体再现了人体中枢神经系统处理信息和协调统一全身器官的功能，并参照人类器官发展出色、声、香、味、触等功能，从本质上也是“对人的大脑和感官的综合投射”②。借助人类器官的不断外化，整个有机系统在技术的加速发展中，需要不断调整内外协调和反馈能力，以应对环境带来的挑战，这对人和技术都提出要求。在器官投射过程中，人逐渐形成和深化了自我认知，再经过新一轮的投射和外化，人的认知通过大脑再次投射到作为外在器官的机器上。这便意味着，在创造世界的过程中“人在自己身上实现了不断增长的自我意识①。所以，作为器官的外化的人工智能技术不仅仅只是一种新型技术变革，也会让外在环境和社会文化发生变化，而人在新技术的使用过程中又会通过技艺的塑造来实现对身体与文化的调适。


    ① KAPP E. Elements of a philosophy of technology: on the evolutionary history
    of culture [M]. Minneapolis: University of Minnesota Press, 2018: 25.


    ② GLASSMAN M. An era of webs: technique, technology and the new cognitive revolution
    [J]. New ideas in psychology, 2012, 30 (3): 308–318.


    ## 第五节 超越人与技术


    在对新闻生产实践的全方位考察后，我们可以发现，人与算法技术的互动不仅仅停留在表层的生产实践，还重构了新闻生产的底层逻辑。人与技术塑造出一套保证两者顺利交流的操作规范，在新闻生产实践中不断互动，并在这一过程中彼此驯化。这成为理解算法转向后新闻价值为何并且如何发生变迁的有效途径，同时也能从具体的实践语境中发现与证实两者的主体性特征。


    那么，两者如何进行分工和互动呢？在算法实现层面，人与技术的共同努力使得新闻业产生“算法转向”。其中，人提供相关物质性基础、搭建不同平台之间的抓取规则和合作协议，同时为算法提供大量数据和互动反馈，使得算法能够提高信息监测和处理能力、写作能力和精准投放能力；算法则为新闻从业者制定符合其自身逻辑的操作规范，除此之外，从业者还需要了解算法基本的运行逻辑，将自身的需求转化为更加格式化和结构化、能被算法或至少是算法工程师理解的语言。在新闻生产层面，人与算法各自发挥能动性，在信息监测和获取、内容分析和写作、新闻审核和推送等方面相互配合，并通过高度结构化的、带有算法色彩的方式进行“交流”，两者呈现出深度合作和相互依赖的关系——都是信息源的维护者、内容的生产者和新闻的“把关人”。在新闻价值层面，人与技术在新闻生产的效率方面有共同的追求，人对新闻的多维度价值期望又与技术纯粹的效率至上和数字理性存在一定张力。总的来说，人与算法共同创建和遵守了一套实践规则，并不断相互规训和适应。技术不再（也可能从未）仅仅作为人的辅助性角色而存在，而是逐渐走向新闻生产的核心地带，而人从台前走向“幕后”，并在一定程度上遮蔽了人的社会结构和权力关系等因素，营造出算法驱动新闻业发展的表象。


    ① KAPP E. Elements of a philosophy of technology: on the evolutionary history
    of culture [M]. Minneapolis: University of Minnesota Press, 2018: 112.


    人与算法技术的合作越是深入，我们就应该越是认真地思考两者的关系。从新闻生产实践的流程来看，人与算法不是静态的、机械的结合，而是一种彼此不断适应、相互调整、共同发展的互动关系，两者为了新闻生产更高效、更符合预期而共同努力。一方面，这其中不可避免地产生隐形工人和算法黑箱等现象，进而引发权力的不平等关系、新闻生产的不透明以及伦理问题等，但若就此认为以上问题是由于技术引起的、可以通过改进技术而解决问题，也是片面的、乐观的理想主义观点。另一方面，正是人与技术的这种关系塑造了当前开放的、动态的“人机联姻”新闻生产新格局——相比于传统新闻编辑室内部结构稳定、权利明晰的新闻生产模式——而不是独立的人或算法。或者说，当前的新闻生产实践只有在人与算法的互动中才得以实现。两者的关系成为理解新闻生产的关键要素之一，同样，也应立足于人和算法技术之间的关系来重新思考数字时代的新闻价值。


    从本体论层面看，无论是人类中心主义还是技术决定论，在人与技术二元对立的基础上针对当前新闻生产实践的解读都存在片面性。实践证明，算法主导新闻业只是表象，尽管悲观主义认为算法对人的“规训”使得人的能动性受到限制，但正是这个过程让新闻从业者的核心能力和不可替代性得以体现，且让与从业者相关的社会问题进一步突出。基于此，或许基特勒等学者所主张的网络关系本体论能够给我们提供新的视角：人与技术不断互动构成某种关系，只有在这种“共在”的关系之中，两者的主体性特征才能得以彰显。这摆脱了“主体-客体”之思维模式所带来的对技术和人的偏见，也避免了“人与算法是两个独立主体”的僵化的二元论观点。如此一来，我们可以更客观地看待人和技术之间的关系，理解当下的新闻生产实践，探索新闻业可能的更好的发展方向。


    同样，当我们把视角从微观的智能新闻生产转向历史中技术发展的过程时也会发现，无论是卡普的器官投射思想、有机论还是控制论，都在强调人与技术的共生与共同发展的关系，是“一种综合的逻辑形式”。对于由各个器官所组成的智能新闻系统而言，“整体”才是核心问题。算法作为机器的基础，也仅仅“被用作有机体的一个功能来帮助精神实现在机器的功用以外的更高目标，从而将机器从预定的规则和功能中解放出来”①。人类与技术同时出现，人生产并且产生于器官的外化——工具，并且在回溯过程中认识自己，成为可以被发现和理解的对象。所以人与机器是相伴相生、共同进化的关系。随着技术的发展，二者的关系也会越来越紧密。②
    技术的发展与人联系在一起，身体与机器也不断交融。所以本质上讲，自制造机器那一刻开始，人就已经成为后人类意义上的“赛博格”。技术呈现的是人本身，机器也是有机世界的一部分，在且只在对工具的使用中，人方才“发明了人类”，理解和实现了自我。③


    ① 许煜. 递归与偶然 [M]. 苏子澄, 译. 上海: 华东师范大学出版社, 2020: 184.


    ② KAPP E. Elements of a philosophy of technology: on the evolutionary history
    of culture [M]. Minneapolis: University of Minnesota Press, 2018: 43-44.


    ③ 同②24.


    技术的发展与制造反过来也会受限于人。同时，技术的发展改变着关联环境，进而影响人的行为。因此将技术与人当做有机整体来看的话，并不意味着二者是对等分裂的，而是让二者相互“纠缠”“共生”和“协同”。


    在这个有机系统中，人仍然需要自洽地找到自己的位置，正如维纳给我们的警示：


    > 任何一部为了制定决策的目的而制造出来的机器要是不具有决策能力的话，那它就会是一部思想完全僵化的机器。如果我们让这样的机器来决定我们的行动，那我们就该倒霉了，除非我们预先研究过它的活动规律，充分了解到它的所作所为都是按照我们能接受的原则来贯彻的！……虽然机器能够学习，能够在学习的基础上做出决策，但它无论如何也不会按照我们的意图去做出我们应该做出的或是我们可以接受的决策的。不了解这一点而把自己的责任推卸给机器的人，无论该机器能够学习与否，都意味着他把自己的责任交给天风，任其吹逝，然后发现，它骑在旋风的背上又回到了自己的身边。


    我讲的是机器，但不限于那些具有铜脑铁骨的机器。当个体人被用做基本成员来编织成一个社会时，如果他们不能恰如其分地作为负责任的人，而只是作为齿轮、杠杆和连杆的话，那即使他们的原料是血是肉，实际上和金属并无什么区别。作为机器的一个元件来利用的东西，事实上就是机器的一个元件。①


    此外，既然技术的发展投射自人，且与人相伴而行，那么也就意味着当技术出现问题时，人也需要进行相应的调整来进行应对。人通过对机器的使用而形成了相关的“技艺”（technique）——人类对“技术”（technology）的使用与理解方式②，进而调节人自身。技术是人与世界之间的媒介与联系，可被看做人与世界之外的“第三要素”（third
    element）①，不仅有助于人类对周围世界的反思和掌握，而且有助于人类的自我认识。技术媒介作为主体和环境之间的有效中介，为意识的出现（大脑的进化）、历史的开始、文明的衍生创造了条件。通过器官投射与系统控制不断实现人的外化与内化，技术在这个过程中便成为一个重要的媒介。在“器官投射”理论看来，人对自然的改造（外化）以及技术对人的影响（内化）这两个相互关联的过程从来都不是一个独立的技术问题，而是通过“作为操作的文化”而实现的。②
    这种连接了技术与人（首先是作为个体，其次作为群体的文化）的方式，便是所谓的“文化技艺”（Kulturtechnik）。


    ① ZIELINSKI S. A Media-Archaeological postscript to the translation of Ernst KAPP''s
    elements of a philosophy of technology (1877) [M] //KAPP, E. Elements of a philosophy
    of technology: on the evolutionary history of culture. Minneapolis: University
    of Minnesota Press, 2018: 251–266.


    ② KIRKWOOD, J. WEATHERBY L. Operations of culture: Ernst KAPP''s philosophy of
    technology [J]. Grey room (2018a): 6–15.


    ③ KITTLER, F. Discourse networks 1800/1900 [M]. CA: Stanford University Press,
    1990.


    “文化技艺”作为德国媒介理论谱系中的关键概念，强调从文化操作和实践的角度来理解技术。基特勒在《话语网络 1800/1900》一书中提出这一概念时，将之界定为那些能够形成群体性差异、具有文化“培育性”的文化操作实践。而这些操作实践本身以更加贴近身体体验的方式，培育了一种具有群体区分性的技艺③，即文化技艺。在基特勒眼中，古希腊的“技术物”诸如音乐、字母、算数、语言，皆可称为“文化技艺”。这些技术的共同特征是一种泛在意义上的“非媒介”，并强调非技术与人的身体的在场及参与；人和媒介统一在自然的文化经验中，且“先验”的技艺实践在前，而后才有了具体技艺的命名。这其中，人的身体和掌握的技术是一种“共在”的关系，接近于德布雷所言的“文化和技术通过知识的所有附加因素形成了不可分离的整体①。也有学者认为，古希腊的文化技艺泛指自然意义上的媒介，媒介是无意识的存在，或是不为人所意识到的技术手段，媒介隐含在自然之中，只有当新的媒介技术重构人的经验之时，它才会被意识到。②
    基特勒意义上的文化技艺注重探讨技术的使用如何影响人的认知，技术如何建构人的主体性，并从本体论的视角来分析媒介在信息的存储、处理和运输上的作用。③


    “文化技艺”一词的含义经历了多次演变。19 世纪 70 年代，“文化技艺”特指德国乡村和环境的改善程序（amelioration procedures），如排水灌溉、平整河床、修整栅栏④等，是一系列将自然和文化相区分开的操作和技术。20
    世纪 70 年代，“文化技艺”在教育领域被赋予新内涵，指一种阅读、书写、运算等素养能力，这些能力将人们从自然中剥离出来，以完成对自我的“教化”过程，即基特勒所理解的“文化技艺”。再到后来，“文化技艺”的概念越来越指向某些适应新媒介生态所必需的可操作性技能，它不只局限于单纯的技术领域，更内化在人的成长过程中，成为一套完整的编排、处理、再生产知识和经验的实践过程，体现为一种“媒介能力”（media
    competence）。到 20 世纪 80 年代，在德国兴起的媒介与文学研究开始关注那些被遮蔽的、不显眼的知识技术（如索引卡和打字机）、不可分类的媒介（如留声机和邮票）、规训技术（如语言习得），并以此代替了对文学文本的分析；这些侧重媒介物质性或技术性角度的分析将上述媒介事件、符号操作、语言和文化习得过程渐渐聚拢，形成了我们今日所言的“文化技艺”概念。⑤


