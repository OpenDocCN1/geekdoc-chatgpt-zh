    # 第三节 人工智能技术与新闻变革


    当下以头条等新闻 App 为代表的智能媒体平台依托算法技术，根据用户兴趣与需求，并借助移动终端来推送新闻。这种生产方式的转变不仅意味着传统记者、编辑根据日常积累所总结的新闻价值来收集、编辑加工的新闻生产方式已经发生了根本的变化，而且还改变着新闻生产者之间以及人与技术之间的关系。算法工程师的加入也冲击着内容生产者的地位。在这个过程中，人与技术的矛盾不断凸显。也正是在技术创新的要求下，媒体面临着巨大的考验，对技术人员的需求也变得越来越多，而传统的内容生产人员却面临着技术带来的众多考验。在市场化竞争的压力下，众多媒介机构甚至更加重视技术人员，而作为“把关人”的内容生产者在媒体中的地位也因为媒介技术革新而发生了巨大的变化。


    纵观媒体的发展过程，技术在其中扮演着重要角色。印刷术带来的是口语传播向书面传播的改变，这一传播技术的变革也造成了传播的符号形式与关系结构的改变，人类社会由罗格斯域迈向书写域，原本在口语传播时代占有重要地位的演说等技能也被印刷技术所取代，由此也带来社会结构与权力关系的变化，而作为传递意义主体的相关机构的人员在社会中的地位和意义也随之发生变化。①


    尽管技术对社会及生产关系产生影响需要一定的社会环境，技术自身已经在社会变迁中占有重要地位，但是一味依靠技术逻辑而忽略道德和法律的规约又是危险的，技术的过度膨胀可能会给社会带来负面影响。因为


    ① 德布雷．普通媒介学教程 [M]. 陈卫星，王杨，译. 北京：清华大学出版社，2014：48.'
