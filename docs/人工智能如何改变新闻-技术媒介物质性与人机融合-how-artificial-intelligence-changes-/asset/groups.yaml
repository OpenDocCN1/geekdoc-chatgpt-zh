    Latour）则从自己所提出的行动者网络理论（actor network theory, ANT）出发，进一步发展了“巨机器”理论。拉图尔指出，技术是社会性的，因为它们是被社会地建构起来的。因而，技术是一种社会关系，而社会掩藏在了技术物身后。千百年来，人们已经将社会关系的概念延伸到了行动体（actant）——既包含人也包含非人。通过在行动之间建立的联系（associations），人与非人共同构成了行动

