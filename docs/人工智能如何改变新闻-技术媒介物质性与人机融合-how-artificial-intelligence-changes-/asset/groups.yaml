    然而，阿尔法围棋的输入数据是非常标准化的棋谱数据，总体上舍去了非常繁琐的“标注”工作。但是，对于需要文字、图像和视频处理的早期深度神经网络模型来说，大量的数据标注不可避免。在当下，数据标注已经成为一个规模较大的行业，出现了大量的数据标注公司，甚至已经有百度众测、京东众智、阿里众包等和数据标注有关的众包平台，一些资源网站如
    Github 也有很多标注好的文字、图像和视频处理的通用数据集可以通过免费下载或者付费获取的方式来获得。不过，如果一个人工智能产品想要获得超出同类产品的智能化程度，那么额外附加的标注必不可少。对于头条等早期智能媒体的开拓者来说，绝大多数的数据标注都需要自己或者通过外包服务的方式来完成。


    以兼含图片与视频、以文字为主的新闻文章为例，数据标注的典型流程包括数据搜集（用网络爬虫爬取或者用新闻文章数据库获取）、数据清洗（去除不必要信息以符合信息格式要求）、数据标注（按照要求对文章内容进行标注）、汇总成数据集等步骤。每一个步骤都涉及大量的人工工作，但是其中数据标注步骤对人工依赖最重。典型的标注工作包括标注能够体现文章内容的关键词、关键词的类属以及从上下文理解这些关键词的准确意思，对于图片和视频则至少需要标注图片和视频的主要内容的关键词。按'
