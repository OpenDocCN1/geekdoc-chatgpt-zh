    ### （二）函询指标


    本研究采用问卷的方式对新闻从业者进行函询。为兼顾中西新闻价值研究的不同侧重，并全面列举数字时代影响新闻从业者价值判断的要素，最终将西方新闻界公认的经典“五要素”、中国学者陈力丹提出的新闻价值的10个要素作为函询指标中传统新闻价值要素的代表，并在此基础上根据文献补充得到学者广泛关注与讨论的数字新闻价值要素。


    考虑到在数字时代引发关注的新闻价值要素有时并非数字时代所特有，部分既有新闻价值指标随着媒介生态与社会语境的变迁在数字新闻实践中重新焕发活力，如西方学者提出的“正面性”与“机构议程性”①，与中国传统价值理念中对媒体社会职能的强调有相似之处，这里将“数字新闻价值要素”定义为“在数字时代得到广泛关注、被广泛纳入考量的新闻价值要素”，而非在数字时代新近产生的价值要素。


    研究中使用“新闻价值”“新闻价值要素”“数字新闻”“news values”“news factors”“digital news”等关键词在中国知网、Google
    scholar 等数据库中进行检索，得到中西方学界探讨数字时代新闻价值要素的文献，筛选出其中涉及具体价值要素的篇目。随后对文献中出现的新闻价值要素进行整理记录，将内涵基本一致的价值要素进行整合，直至没有全新的价值要素出现，最后根据指标拟定问卷题项。问卷使用李克特量表，请新闻工作者根据新闻价值指标的重要程度，依次给新闻价值指标评分（1=完全不重要；2=不太重要；3=中等重要；4=非常重要；5=极为重要）。


    在指标初稿拟定完成后，我们进行了小范围（n=7）的试询，辅以访谈对其选择依据进行追问，据此对指标及其表述方式进行了调整，得到包括 33 个指标的最终版清单投入使用（见表
    5-2）。


