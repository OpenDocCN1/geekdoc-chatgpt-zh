    传统新闻价值更加强调冲突突、灾难以及矛盾，负面新闻通常涉及揭露企业的腐败行为或政治丑闻，注重对应媒体作为“第四种权力”在西方民主社会中对社会和政府的监督作用①；而中国受到儒家文化中“和”与“仁”优先价值标准的影响，更加重视集体意识和社会意识，以及国家形象和媒体的政治导向作用，因此，社会主义社会中的新闻作为党和政府的“喉舌”，其价值往往更注重反映正面、健康、和谐、光明的一面。②因此在数字时代新闻价值要素的探讨中，中国学者在关注技术变迁的同时，还聚焦商业平台参与下价值取向多元化的媒介生态，强调新闻业维护社会效益与参与社会治理的责任，展现出更明显的价值与实用导向。


    具体而言，中国新闻往往更强调沟通和教化。③中国新闻实践自古习惯以传者为本位，将政策宣传和思想教育作为新闻价值选择的主要依据。④因此“沟通性”，即新闻是否能与已有的舆论信息形成沟通，在中国语境下成为一种核心价值导向。面对网络平台上信息的冲突与对抗，新闻的“沟通性”或“共情性”意在化解社会矛盾、促进和谐。中国新闻业还通过设立新闻类奖项等，对包含“爱国主义”“自我奉献”“敢于牺牲”等价值引导要素的新闻给予肯定。⑤


    近年来，建设性理念也得到大量中国学者的关注。“建设性”指以积极的、具有建设性的方式来建构新闻。⑥通过强调这一价值要素，人们反思对


