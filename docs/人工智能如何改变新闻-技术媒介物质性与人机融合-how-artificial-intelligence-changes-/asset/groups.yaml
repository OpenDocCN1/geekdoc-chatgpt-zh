    者？当然基特勒谈论的技术只是技术的视角，而不是技术作为决定的因素。他从技术的视角看，在历史语境下，传播结构、社会结构如何发生变化。


    基特勒将媒介分析放到历史情境中，通过对处于后一历史阶段的媒介的使用来分析前一阶段的媒介。从后往前推，才能推出媒介的历史情境。基特勒在麦克卢汉的媒介分析的基础上，继承了拉康的精神分析以及米歇尔·福柯（Michel
    Foucault）的权力与话语研究、知识考古学的观点。另外他还提出了“传播的物质性”（materiality of communication）这个重要概念，用来分析媒介技术、制度框架和身体政权（body
    regimes），以及数学符号、字母和音乐符号等标记系统。那么如何理解传播的物质性呢？传播的物质性指传播过程中的物质载体。德布雷（Régis Debray）认为，媒介包括符号、语言体系和物质载体。信息的物质载体是显示屏，是书写的纸张表面。原来人们对媒介更多地关注传播效果，因为内容决定传播效果，但是今天，人们对媒介的关注从内容变成了物质载体，因为他们进一步发现传播的物质载体也影响传播效果。


    由于麦克卢汉和基特勒都在谈论技术，所以在此简要对二者进行比较。首先是二者的相似之处：二人书写风格相似；都是文学领域的学者，作品充满文学特征；都因对自身学科产生不满而转向研究媒介技术；在学术路径上，都讨论了香农信息论，都从历史视角研究媒介。


    但二人有重要的不同点。第一，对感官的认知不同。这可以延续到具体性的话题。“基特勒认为没有必要将所有媒介都拷问人类感觉器官的瓶颈。”① 麦克卢汉则聚焦人类感官：“一个特定媒介的技术特质以某种可预测的方式影响着感官比例，进而对个体以及知觉进行了改造。”①
    对天主教徒，计算机预示着“世界范围的理解与和谐的神恩降临的状态”。


    第二个不同点是技术决定论的立场。“在基特勒更加微妙的解释中，技术决定论的面向是不存在的……基特勒预设了一个偶然得多的技术与理念体系间的关联。”② 媒介技术的变迁对话语产生重要影响，“从话语网络
    1800 到话语网络 1900 的转变被认为是由媒介导致的。在处理数据的新型技术手段到来之时，文化的上层建筑都被颠覆了”③。准确地说，基特勒是技术视角，而不是技术决定论。


    第三个不同点是对于传播符号在多大程度上可准确传递信息的认知。这个问题是从信息论对噪声的讨论引发的。麦克卢汉认为媒介即信息，强调渠道的存在会影响噪声，但是基特勒论述的是传播的物质性，是技术的物质结构而非渠道在影响噪声。他认为渠道只是宏观层面，要在微观层面结合物质的结构、文化技艺去了解符号的噪声如何影响信息传播。众多英语媒介理论都强调技术重塑了人类，然而基特勒认为：


    > 人们所能留下的就是媒体储存和交换的信息。重要的已不是信息，也不是在技术时代为所谓灵魂配备的信息或者内容，而是（严格按照麦克卢汉的话来说）它们的电路，是感知的图示。④


    在这一点上，基特勒和麦克卢汉的媒介理论虽然表面上趋于一致，但基特勒更加关注技术的物质结构及其对文化带来的影响，而非技术对信息传播带来的影响。基特勒提出“文化技艺”（Kulturtechnik，也译作文化技术）的概念来分析处在不同社会背景下的技术。媒介作为文化技艺，可以让人们选择、存储和生产数据和信号。虽然都属于文化研究的范畴，但基特勒所代表的德国媒介理论与英国伯明翰学派的关注点完全不同。前者主要从哲学和认识论的角度来思考媒介变迁，而后者则以媒介内容研究为主。基特勒关注机械，但并不讨论亚文化、后殖民主义、性别、种族和阶级研究。“文化技艺”这个概念将社会制度化的实践、技术的使用和技术本身联系起来，并把三者放在复杂的环境中分析其运行动态。例如在《德考拉的遗产》（Draculas
    Vermächtnis：Technische Schriften）①中，基特勒分析了女主人公米娜使用留声机和打字机的行为，旨在说明社会官僚化过程是如何被书写所诠释的。通过分析阅读、书写、打字、录音或者算术等“知识技术”，基特勒试图揭示技术变迁与时代特征之间的关联。②此外，在麦克卢汉理论的基础上，基特勒进一步将媒介研究推广到数字化和计算机时代，并将计算机的存储能力和网络作为研究重点③，同时他还把香农的传播五要素的最后一个环节——目标对象改为“信息流的流失”（drain
    of streams of information）④。


    麦克卢汉和基特勒都喜欢把媒介分析放到历史进程中加以考察。但麦克卢汉认为媒介是人的延伸，并从“延伸”的角度考察了从发明轮子以来的各种技术与身体、信息传递、感知与理解、社会结构和社会运行的转变之间的关联。基特勒则提出“时间轴控制”（time-axis
    manipulation）的概念，他更喜欢研究古希腊，并关注随时间而变化的媒介形态。在这一点上，


    ① KITTLER F. Draculas Vermächtnis: Technische Schriften [M]. Leipzig: Reclam,
