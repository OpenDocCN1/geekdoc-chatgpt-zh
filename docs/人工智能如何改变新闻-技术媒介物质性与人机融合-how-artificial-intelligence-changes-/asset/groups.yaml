    \ 1965 年，加尔通和鲁格又提出了包括时效性、不寻常性、影响力、接近性、显著性、冲突性和灾难性的一套价值要素，后成为学界中最经典也是最具影响力的一种新闻价值分类标准。②\
    \ 随后其他学者在此基础上不断进行改良完善，提出了新闻价值构成的多个版本，如舒尔茨（Ida Schultz）将“时效性、相关性、可辨识性、冲突性、情感性和独家性”列为六种首要新闻价值要素③，希伯特（Ray\
    \ Hiebert）等论述的“时效性、接近性、显著性、重要性和人情味”，经实践检验成为美国新闻界普遍承认的“五要素说”④。\n\n伴随着西方新闻价值理论被引进中国，中国学者对西方传统新闻价值标准进行了本土化的解读与补充。其中，对中国本土的新闻实践产生了重要指导意义的是陈力丹在其著作《新闻理论十讲》⑤\
    \ 中阐释的新闻价值的 10 个要素，包括：\n\n① LIPPMANN W. Public opinion（Vol. 1）[M]. New Jersey:\
    \ Transaction Publishers, 1946.\n② GALTUNG J, RUGE M H. The structure of foreign\
    \ news: the presentation of the Congo, Cuba and Cyprus crises in four Norwegian\
    \ newspapers [J]. Journal of peace research, 1965, 2（1）: 64 – 90.\n③ SCHULTZ I.\
