    个专属于新媒体组的价值指标包括“视听性”“互动性”“情感性”“可分享性”。


    研究发现，数字时代传统媒体与新媒体之间的界限趋于模糊，但媒介形态与机构属性依旧对从业者的价值判断产生一定的影响。在传统媒体组独有的价值指标中，“价值引导性”与“利益相关性”佐证了传统媒体在舆论引导和社会治理方面的独特作用，说明传统媒体依旧承担着弘扬主流价值、维护社会效益的主要责任。在这样的自我定位下，传统媒体从业者往往将受众利益看做一个与社会公共利益紧密相连的整体；而部分市场化媒体从业者将“利益相关性”理解为媒体通过爆料、监督、发声等方式维护特定群体的利益。


