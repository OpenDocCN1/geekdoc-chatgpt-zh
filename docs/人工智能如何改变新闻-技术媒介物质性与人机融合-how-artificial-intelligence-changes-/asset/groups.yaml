    合类平台（如头条）、大型融媒体平台（包括光明网、人民网、凤凰网、澎湃等复合在线媒介平台）等新闻资讯平台，以及微信公众号、短视频平台的智能推送系统等重要智能技术系统的开发与运营状况，对企业技术开发人员、运营人员、用户群体进行了包括深度访谈、非参与式观察等多重方式在内的调查，以深入了解智能技术平台的开发与运营的基本状况，以及这些媒介技术平台与用户、监管机构、媒体机构、第三方劳务机构和外包机构之间的互动关系。最后，在上述前两项工作的基础上，对门户网站、社交网络到智能媒体的发展过程进行复原和追踪，随后采用数字诠释学而非单纯的数据分析方法对所获得的量化和质化数据进行整体性诠释。


    # 二、人与物：智能媒体平台的媒介网络


    从媒介网络的角度来看，智能算法平台是基特勒所称的“计算机科学”在互联网时代的升级版本。在“计算机科学”阶段，冯·诺伊曼（John von Neumann）构架意义上的寄存器、总线和随机访问储存器（RAM）构成了一个循环的反馈回路。“在结构上，存储在寄存器中的比特（bits）执行逻辑操作和算术运算，多条总线传送命令、数据和地址，而随机访问存储器（RAM）则为命令、地址和数据提供存储场所。”①
    命令、地址和数据是媒介网络的基础本体论特征处理、传输和存储在计算机科学时代的体现。在这个意义上，智能媒体网络平台实际上是一种经由互联网而扩大了的计算机体系。平台计算系统形成了复杂的、软件和硬件相互嵌合的技术物质体系。②
    经典的平台计算系统构架包括接入与界面（access and interface）、处'
