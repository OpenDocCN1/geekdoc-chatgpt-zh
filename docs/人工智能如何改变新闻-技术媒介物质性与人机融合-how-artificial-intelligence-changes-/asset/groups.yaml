  - '[PAGE 139]


    +   • 新闻传播的过程其实是符号在人与技术所构建的中介性关系网络中被物质化的过程。


    +   • 从物质性的视角来重构新闻生产和传播的关系，充分发挥了数据作为技术物的媒介本体论思想在数字时代的诠释力，不仅在理解新技术条件下的人与技术之间的关系上提供了富有创见的视角，还能通过创建中介社会传播模型来分析数字时代互动性强、传播主体多元和多级传播的特点。'
  - '[PAGE 140]


    在平台化新闻生产过程中，平台凭借其强大的数据技术能力将世界上众多之前没有被量化过的事物转化为数据，并且通过具有高度选择性的、智能操控能力的网络化连接来重塑社会。①
    从这个角度来看，新闻平台成为各种新技术的汇聚场，其重要特征是数据化，即新闻内容通过数据的方式被生产、分析、筛选、储存和传递。


    在这个过程中，传统新闻生产的过程和新闻编辑室的结构、运作逻辑以及新闻生产者的角色都已经彻底改变：首先，个人用户、机构用户和合作信源方等不同来源的新闻信息在这里经过加工后，再经由高度智能化、具有强烈操控性特征的算法分发给多元化的用户，这使得整个新闻生产流程在发生变化的同时，也让新闻生产与传播流程变得无法分离。其次，新闻生产和传播的流程都同时被纳入平台系统，算法、数据存储系统、打标签的人和审核人等硬件和软件也都需要纳入媒介系统进行考察。最后，平台中的专业与非专业用户生成内容不仅让生产者和传播者之间的角色边界变得更加模糊，也为二者的身份互换提供了可能，而借助平台所进行的新闻推动和传播，也打破了过去较为单一的大众传播模式，在社交朋友圈内以人际传播的方式进行多级扩散。用户还可以通过点赞和转发等互动形式参与到新闻的传播过程中，这不仅增加了新闻信息的反馈方式，还进一步增强了用户的互动性。


    算法和智能技术的加入进一步打破了以人为中心的新闻生产模式，让人与技术都共同融入平台系统中协同运作。智能时代的新闻传播，已经突破传统媒体时代的大众传播模式，呈现出新的传播格局。因而，在新闻平台化的条件下，作为技术的算法和作为基础设施的平台工具已经融合到新闻生产中，逐渐改变着新闻传播的结构，使得技术、物和人共同参与其'
  - '[PAGE 141]


    中，并在新闻的生产和消费中建立了一种去人类中心的媒介网络，共同建构着一种新型新闻生产关系。这种新型的新闻生产关系，如果从“社会性-物质性”角度进一步进行分析，其非人类中心主义的特点就会更加凸显出来。


    技术本身既包含着物质属性，也具有社会属性。一项新技术从发明之后在社会中产生影响，是技术本身不断融入社会的结果。因此，新闻平台化过程中涉及的技术，已不仅仅只是电脑中由代码所组成的算法，或者只是如何制作纸张和印刷字体等方法过程，而是一整套网络体系。在这里，按照兰登·温纳的观点，技术的概念包含三个层面：首先，它是一种装置（apparatus），对应着工具（tools）、仪器（instrument）、机械（machines）、用具（appliance）、武器（weapons）和小器件（gadget）等。其次，技术也指向技术性的活动（technical
    activities），即人们完成某件事情所需要的技巧（skills）、方法（methods）、程序（procedures）和惯例（routine）。最后，技术是一种网络（network），这个网络将人与装置连接起来，构成一个巨大的系统。①
    在数字化新闻生产过程中，仅仅依靠装置或者工具是无法完成内容的采编和分发的，人和装置在其中都起到重要的作用。而数字技术将人与作为装置的新闻平台连接起来，构成一张结构紧密的网络。


    这一章从媒介物质性研究的基本思路出发，将新闻生产流程看做媒介技术中介下的数据流动过程，并将对数据流动过程的考察从新闻生产延展到新闻传播流程。基于物质性视角下媒介的中介性特征，以及第二、第三章从宏观到微观层面对新闻实践的考察，这一章将在理论上建构符合智能时代新闻传播特征的中介社会传播模式，即将人与技术共同组成的中介'
  - '[PAGE 142]


    系统视为传播的中心，数据在传播者和目标对象中流动并伴随着新闻生产和传播的关系网进行扩散，以应对新媒体技术对新闻学研究范式带来的挑战。


    # 第一节 数码物、新闻聚合与知识生产


    最近二十年中，在新的数字媒介技术的推动下，全球新闻产业都在经历高速平台化和数据化的过程。在这个过程中，传统媒介转换为数字化媒介，并且通过复杂的技术—物质—社会机制汇聚成高度网络化、数据化的新闻平台。根据何塞·范·迪克（José
    van Dijck）等广受关注的观点，平台是指用来组织用户的互动的可编程的基础设施（infrastructure）设计。①


    这种新闻生产的技术网络体系具有高度的多元性、分散性和包容性，它既囊括了专业记者所需要具备的专业新闻采写技巧和方法，以及在记者编辑群体日常工作中所构成的惯例，也将媒体平台的基础设施、计算机设备、媒体记录的仪器设备纳入其中，它更将各类自媒体作者、多种来源的各类新闻与信息机构所开发的多元信息站点，都通过技术数据接口的方式整合起来。在这个过程中，数据平台最重要的目的是通过这个网络汇聚新闻类数据。因此在重新审视数字技术下的新闻学研究的时候，从以内容作为视角转变为以数据作为视角，则能够开启一个将作为传统新闻主体的人与作为物质的技术和数据之间相联系的新视角。人与物质共同构成了新闻生产的整个流程，形成一张“社会-物质”关系网。'
