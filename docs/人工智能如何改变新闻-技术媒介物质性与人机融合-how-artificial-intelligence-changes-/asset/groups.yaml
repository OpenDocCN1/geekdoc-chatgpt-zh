    全不同。在基特勒看来，媒介具有自主性，而且是文化历史有机运行的原因。但需要注意的是，正因为在技术/邮递传播模式下媒介是无法消除的，这就为交流双方之间的连接和融合形成了一定阻碍。通常在传递过程中，我们希望降低干扰的影响。然而传播的物质越是技术的、不透明的，传播中的对话看上去就越容易被扭曲。


    媒介、信使和传递（Übertragung）这三个概念是诠释媒介性的重要术语。相比于技术的决定作用，“媒介性”这一概念的解释力更强，因为它代表了所有社会和物质系统交换形式的基础。①
    媒介的形式多种多样，在克莱默尔看来，天使、病毒、货币、翻译者、精神分析学家、目击者乃至地图都可以被看做媒介，它们在建立沟通纽带的同时还保存了沟通者之间的多样性。信使模型为人们能够深入观察一个存在于多元个体的社群提供了一种特别的理论视角，个体之间因为存在空间距离而产生了差异，但这也为实现统一和主体间性提供了可能。根据媒介性理论，所有传播其实都是传递行为，大众传播作为人类传播形式中固有的一种维度，同样也属于技术/邮递模式。克莱默尔所理解的媒介更多地关注交流者之间的互动而非纯技术层面，信使模型更加强调传递过程和第三个存在（thirdness），而不是技术装置。从上述的分析中我们可以看出，克莱默尔的信使模型完全不同于麦克卢汉的媒介理论所强调的媒介技术所带来的重要影响，也和伯明翰学派的关注媒介内容的文化研究截然不同，同样与基特勒的媒介物质性本体论有着重大差别。就像话的媒介理论来讲，基特勒的媒介理论更加关注技术层面，而哈马马斯则特别强调传播的对话层面，克莱默尔的媒介理论开创了一条重新诠释媒介本质的路径。和基特勒相似的是，克莱默尔也讨论数学中的形式化、计算和机械化等问题，并且引入“符号机器”（symbolische


    > ① ENNS A. Introduction; the media philosophy of Sybille Krämer [M] // Krämer
    S. Medium, messenger, transmission; an approach to media philosophy. Amsterdam;
    Amsterdam University Press, 2015; 9–18.'
