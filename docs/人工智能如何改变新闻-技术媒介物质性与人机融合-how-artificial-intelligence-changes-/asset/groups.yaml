    - 在物质性视角和媒介本体论的基础上，我们将新闻生产纳入人类知识生产，重新思考数字化进程、作为客体物的数据和建立在计算机语言逻辑之上的智能技术意味着什么，媒介的中介性特征是什么，将聚合与知识生产作为新闻生产的基本特征，并考虑到参与新闻内容生产的主体多元、互动性强、多级传播等特点，重新建构了一个智能新闻生产与传播模式。


    - 我们将新闻生产和传播的流程进行拓展，提出广义“新闻生产”的概念。


    新媒介技术通过大数据、平台化与智能化等方式彻底改变了新闻生产与传播的面貌，技术深度嵌入人的生活之中，这样的深度变革不仅需要新的范式来思考新闻传播的流程，也让人们重新审视程序员、算法技术或者智能机器人等新元素在整个新闻流程中的作用。同时，多元内容生产主体的加入也让传统大众传播模式发生了彻底变革，新闻记者与编辑不再拥有内容选取与把关的特权，而更多地将其让渡给机器。这也进一步让我们反思新闻的本质是什么，技术带来的影响又是什么，新闻的未来可能是什么。


    新闻的历史伴随着整个人类文明的历程，而每次媒介技术的重大变革都会带来新的媒介形式与新闻类型，并产生相应的传播模式。印刷机的普及带来的是纸媒——定期出版物与现代报业的产生；电报技术跨越大西洋后不仅让新闻实现了全球化，以“电气”（electronic）技术为特征的广播、电视时代也随之到来，声音与画面的融入让新闻传播进入“再部落化”的时代，曾经基于文字的理性和地区的区隔已不再；20
    世纪 90 年代，电报技术的升级版——互联网开始遍布全球，数字（digital）时代更快的传播速度及多种媒体融合的特征让新闻的传递再次突破时间与空间的限制，从大众传播到基于人际关系的社交媒体平台上的传播，乃至基于平台的新闻生产，都让新闻的面貌发生了彻底的变化。


    今天，技术的纷繁变革让我们无时无刻不处在“加速主义”的考验中，无论是信息爆炸还是后真相与反转新闻，以及近年来兴起的“新闻回避”（news avoidance）行为，都不断地提醒我们，是时候对“什么是新闻”进行反思了。


    在技术不断变革的过程中，我们或许需要找到“究竟什么没有变化，人们何以需要新闻”的答案。如果特定的媒介技术对应的是特定的媒介形态与新闻传播范式，那么在多次技术革新中，所有新闻传播的共同特征是什么？近年来，技术的视角不断进入人文社科研究的视野，“本体论转向”的提出让人们开始关注作为客体的技术和人造物在文化生产中的作用，并进一步将视角延伸到非人领域。为了摆脱媒介技术与媒介形态变迁给新闻理论研究带来的挑战问题，我们结合本体论转向，摒弃亚里士多德式的仅仅关注媒介“形式和质料”的问题，而援引海德格尔“技术本体论”的观点提出媒介本体论的视角，并结合媒介理论与媒介物质性研究，让常年被“遮蔽”在各类媒介形态背后的技术和基础设施重新浮出水面。从技术视角来进行新闻传播学研究，既可以被看做一种理论范式的创新，在某种程度上也是一种“复古”，因为早在
    19 世纪末，媒介技术对信息传递的影响已经开始受到关注，20 世纪 50 年代的传播学研究（如麦克卢汉、施拉姆等）中就提出技术所带来的影响问题。


    在物质性视角和媒介本体论的基础上，我们将新闻生产纳入人类知识生产领域，重新思考数字化进程、作为客体物的数据和建立在计算机语言逻辑上的智能技术到底意味着什么，媒介的中介性特征是什么，将聚合与知识生产作为新闻生产的基本特征，并考虑到参与新闻内容生产的主体多元、互动性强、多级传播等特点，重新建构了一个智能新闻生产与传播模式，即中介社会传播模式。我们将新闻生产和传播的流程进行拓展，提出广义“新闻生产”的概念，也是为了更加清晰地看到用户内容生产（UGC）作为上游，以及智能分发作为下游给整体新闻生产带来的变革。在以平台为中介的新闻生产中，已经很难从角色和作用上明确区分内容生产者和消费者，所以从技术的视角来看的话，二者的角色能够实现互换也可以理解为平台化技术发展的结果。同时，中介社会传播模式在新技术面前同样可以保持解释力，即使面对近来引发热议的
    ChatGPT 等人工智能新技术，机器自动生产内容的 AIGC 也可以作为媒介中介的一部分，继续在人与技术所组成的媒介网络中传播。


    自工业革命以来，技术所带来的变革都在不断推进人与机器的融合——从纺纱机成为人类器官的延伸，到电子时代广播、电视成为人的耳朵和眼睛的延伸，以及当下脑机接口与各种智能技术调节下的传感器作为外在器官极大地拓展了人的感知范围。从这个角度讲，媒介技术的发展一直都在促进人机融合。一则，技术的发展要求人们能够操作机器，适应机器的逻辑从而进行生产；二则，技术向哪一个方向发展也会受到人类的设计思维与适应能力的考验，那些过于超前或者落后的技术容易被淘汰，而只有能够适应人体、融入社会文化的技术才能发挥效用。人与技术处在相互驯化的过程中，同样，从这个角度讲，所谓纯粹的人的主体性已经丧失，人的主体性与技术的自主性在人机融合中不断交融而构成媒介网络，从而也形成了“双重的人”。所以，智能新闻生产是人与技术协同运作的结果，新闻价值的选取与新闻推送也是结合了关联算法和人工审核的。其中，人与技术的高效有序协作是智能新闻平台系统顺利运行的前提。控制论也强调了人与技术融合的过程，反馈是人与机器沟通中的重要环节。当下弱人工智能的时代，标记和分词等工作还只能由人来完成，隐藏在智能新闻生产和分发后面的是大量的隐形工作者。即使目前较为完善的
    ChatGPT，在技术底层仍然需要分词标记的支持。就目前的智能技术发展阶段而言，人工智能意味着技术与人的融合，而人与机器如何有效地沟通和反馈，人如何有效地使用技术，技术又如何调控以更加符合人的使用习惯，这些既是控制论研究中的核心议题，也将成为数字智能时代新闻发展中的核心技术议题。


    新闻内容生产从文字、视频到数据的变迁，从本体论的角度来看，它们都共同属于“物体/客体”，这种基于海德格尔的“技术本体论”和哈曼的“物向本体论”思想，将媒介的物质性研究与知识生产的社会学联系起来。所以，任何一种形式的新闻生产都是知识生产的过程，也是将人与人、人与作为客体物的技术聚合起来的过程，在此基础上媒介关系网络得以产


