    而当新技术赋予了新闻更多的呈现形式，人们对于新闻作品审美的逻辑也随之改变。① 在传统新闻生产中，受众接受的是以文字为主、图表为辅的单一形态新闻信息，而在新媒介技术环境下，新闻可视化和交互性改变了传统的叙事方式，新闻信息转变为静态的、动态的乃至虚拟形态的可视化文本。不仅如此，受众还可以根据主观意愿通过点击超链接、超文本的形式进行信息获取和参与卷入，而非被动观看。②


    在传统价值要素解构与创新的背景下，有学者尝试形成体系化的数字新闻价值要素清单。哈尔卡普（Harcup）和奥尼尔（O’Neill）③ 通过分析报纸与社交媒体上的新闻文本，结合互联网与社交媒体的开放性、娱乐化等特性以及受众身份的转变，最终提出一套包含
    15 个指标的新闻价值体系，包括：


    - (1) 排他性（exclusivity）：新闻机构通过采访、信件、调查、民意测验等方式获取独家新闻报道线索。

    - (2) 负面性（bad news）：选择带有突出负面色彩的故事，例如死亡、受伤、失败和失业等。

    - (3) 冲突性（conflict）：选择与争论、分裂、罢工、打架、叛乱和战争等有关的新闻事件进行报道。

    - (4) 惊喜性（surprise）：选择具有惊喜色彩或是不寻常色彩的新闻故事。

    - (5) 视听性（audio-visuals）：选择引人注目的照片、视频、音频或其他可用于可视化的新闻素材。

    - (6) 可分享性（shareability）：主要是指在新闻价值判断过程中优先考虑哪些内容更容易促使受众在社交媒体平台上进行分享。

    - (7) 娱乐性（entertainment）：挑选包含有性、娱乐、体育、动物、搞笑幽默等内容的新闻报道。

    - (8) 戏剧性（drama）：指充满戏剧性的新闻报道文本，诸如奔车逃逸以及涉及逃跑、事故、营救和法庭案件的事件。

    - (9) 可持续报道性（follow-up）：新闻内容有延展空间，具备可持续报道的可能。

    - (10) 精英性（the power elite）：选择与有权势的个人、组织、机构相关的新闻事件。

    - (11) 相关性（relevance）：类似于经典新闻价值要素中的“接近性”，具体指新闻报道的内容是否与受众的生活经历或集体记忆相关。

    - (12) 规模性（magnitude）：类似于经典新闻价值要素中的显著性，即与更大规模的受众群体相关或能引发显著关注的极端行为或现象。

    - (13) 名人性（celebrity）：与名人相关的新闻故事。

    - (14) 正面性（good news）：带有积极色彩的新闻，例如从灾难中复苏等。

    - (15) 机构议程性（news organization’s agenda）：对于新闻价值的考量应符合新闻机构在意识形态、商业诉求或政治立场上议程设置的需要。


