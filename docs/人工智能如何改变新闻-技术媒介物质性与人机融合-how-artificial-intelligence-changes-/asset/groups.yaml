    从本质上看，不断革新的媒介技术仅仅具有工具属性，而人是唯一的主体。另一方面，在“人-机”共同主体结构的新闻生产传播中，部分学者认为，人依然是唯一主体和最终目的①，人们对技术的主体性关注不过是“技术亢奋”“技术焦虑”的体现②。尽管技术成为新闻生产中的热点问题，但人始终是新闻生产以及令其不断发展的主导者，技术创新是解放新闻工作者而不是使他们处于从属的地位。③因此，我们应对技术妖魅以揭开其令人恐惧的面纱。


    但是，如果跳出人与技术二元对立的思维，正视新闻业切实发生的变化，看到新闻生产实践、规范和新闻价值等与人工智能技术的交汇的话，便能够发现新闻生产过程中人与技术的互动与关系。④虽然平台逐渐掌握了新闻生产的主导权，深刻影响了新闻业的格局，但这并不意味着人类在新闻生产过程中彻底“隐退”。“人机交流”（human-machine
    communication）理论主张技术不是静止的，人与技术在互动中出现的关系也不是固定的。⑤在传播实践的过程中，人与媒介技术密切相连，技术既可以充当中介，也可以被看做传播者。⑥在第二章中我们也从宏观的角度探讨了技术需要在与人组成的网络中才能发挥作用的问题。人在微观层面的确仍具有一定掌控力，但其实处在其中的所有人和物，都在为媒介网络的“永存”而努力。这类讨论隐含着以人和技术之间的关系为本体论的观点——网络关系本体论，其强调人与技术的互动只有在这种互动的过程中，两者的主体性才能得以体现，这为我们思考新闻生产及相关问题提供了一个新的视角。


