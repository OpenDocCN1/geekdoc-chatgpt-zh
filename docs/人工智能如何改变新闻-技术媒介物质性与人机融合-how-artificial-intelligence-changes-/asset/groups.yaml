    这个公司就是因为这个平台、这套算法存在的。如果这套算法没有了，或者在市场上没有优势了，头条也就不是现在的头条了。所以大家所有的努力就是维护好这套算法，让这个平台在市场上不要掉下去。（Z5）


    从这个角度来看，智能媒体平台的确在一定程度上可以被看做一种融合了艾吕尔-温纳的技术自主性和芒福德的“巨机器”理论的、依照技术逻辑自我推动发展的智能媒体“巨机器”。技术和运营人员、平台的软硬件构架、外包服务机构等所有的运作都在为平台和算法的“永存”而努力。这种状况回应了前文所说的“双重性”：在智能媒介网络中，一方面，人在微观层面仍然具有强大的工作掌控力，例如，可以进一步提升算法推送的准确性、加快算法的相应速度以及在移动终端
    App 上推出更多的功能；但在另一方面，在这个智能媒介网络体系中的所有人和物，都在为以算法为核心的智能媒介网络的“永存”而努力。因而，认为算法工程师或者其他的“人”才是智能媒体平台的掌控者，可能在一定程度上忽视了媒介技术自主逻辑的“技术律令”和“反向适应”①
    所带来的限制性。


    # 第四节 双重的人与关系主体的重建


    智能技术在很大程度上重塑了新闻业的基本途径，从而对一般意义上的社会结构、社会权力构架和利益分享分配机制产生重大冲击。如果从媒


