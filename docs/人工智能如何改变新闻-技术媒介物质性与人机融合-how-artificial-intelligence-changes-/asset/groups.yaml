    Mitteilung, 1998: 187–240; SCHÖNHAGEN P. Soziale kommunikation im internet: zur
    theorie und systematik computervermittelter kommunikation vor dem hintergrund
    der kommunikationsgeschichte [M]. Bern: P. Lang, 2004: 117–120.


    **其一，中介社会传播模式强调中介系统在新闻传播中的中心作用。** 无论记者还是媒介组织都属于中介系统的一部分，都发挥着重要的中介作用。中介系统融合了人与技术的双重元素，既包含了在新闻生产中参与内容制作、分发和把关的人，也包含了作为技术物存在的数据和相关基础设施。人与技术、组织都被物质化为具有媒介性的中介系统。这一模式与传统的大众传播模式最大的区别在于受众的角色不同。大众传播模式认为传者和媒体是完全独立的，它们在传播过程中扮演不同的角色，因此只有记者和媒介组织才能在传播过程中搜集和传递信息。而中介社会传播模式将记者和媒介组织都纳入中介系统中，因为从本质上看二者都具有媒介性。媒介组织内部既包含作为成员的人，也包含影响新闻生产的数据。从物质性角度看，媒介组织就是一种融合了人与物质的装置。从第二章提到的广义新闻生产的视角来看，在中介系统中，记者和编辑的功能也从“把关”转换为“守望”，将不同的数据进行处理与聚合，并与算法一同决定着数据的筛选、存储与传播。


    **其二，传者和受者的角色是可以不断转变的，受众不再仅仅被动地接受信息。** 在中介系统之外还存在着传播者（output partner，德语 ausgang-partener，即信源）和目标对象（target
    partner，德语 zilepartner，即接受者），二者分别负责制造和接受信息。图 4-2 的左半部分的内侧代表一个循环内的流动，即信息从传播者流向目标对象。在智能新闻时代，这里的信息即可理解作为为数码物的数据。信息在传播者发布之后，经过中介系统流向目标对象。在这个过程中，中介社会传播模式进一步区分了主动和被动接收者，这样的区分在智能新闻时代尤其具有重要意义，因为新闻信息的传递目标既包含着传统媒体中被动接收信息的大众，或者通过新闻
    App 平台的用户数据被识别为具有潜在兴趣的用户，同时也涵盖着通过社交媒体来订阅和关注新闻内容的用户。为了突出传播者的异质性，中介社会传播模式还进一步区分了代表性的目标对象。在传播过程中，并不是每个人都能够接收到信息，因为那些对信息不感兴趣的人会主动选择忽略，或者通过算法的把关，数据也只能流向根据用户兴趣所制定的标签中所表示的特定目标群体。所以，最终接收到传播者发出的信息的人仅仅只是代表性目标对象而不是所有的目标对象。这些代表性目标对象在下一轮传播开始时就会转换为代表性传播者。智能新闻时代的分享性（shareability）成为新闻价值的重要构成要素。①
    社交媒体中，用户阅读某些信息后便会主动分享，从而开启下一轮新闻传播流程，其身份也会从代表性目标对象转换为代表性传播者。


    此外，图 4-2 中的“代表性传播者”还包含了那些代表某些社会群体发声的人，例如新闻发言人②或者某些新媒体大 V。最后，中介社会传播模式也强调传播过程中的信息的反馈，受众的反馈信息（包括传统的读者来信或者数字时代用户的反馈数据）通过中介系统再次被传递给传播者。在数字平台上，这些反馈与数据也决定着用户未来将会被系统推送什么样的新闻内容。在新闻传播的流程中，数据通过中介系统从传播者流向目标对象，再通过中介系统反馈给传播者，从而形成数据的闭合循环。


    **其三，左右两部分的对称结构表明，在这一过程中的信息传递不仅仅只有一轮，而是可以不断循环往复的，新闻传播行为是多层次的。** 这一过程非常符合数字时代的网络传播特点，伴随着数据在传播者和目标对象之间的流动和多级循环，数据沿着网络所构成的网状路径扩散开来。


    中介社会传播理论打破了大众传播理论相对单一的、被动的传播过程，更加关注传播参与者作为传者和受者的多元角色转变，以及人与技术在传播中所起的主动作用，从互动多元的视角来探讨传播参与者与媒体的关系。这一理论模式不仅可以涵盖传统媒体时代的大众传播模式（纸媒时代的信息形式为文字；电子时代的信息形式为电子信号；数字时代的信息形式为数据），而且适用于新媒体时代的社会化传播过程。它能跨越媒介技术变迁所带来的挑战，将传统媒体与新媒体技术下的新闻传播流程都放到同一模式下进行分析。中介社会传播模式最大的特点在于：第一，改变了大众传播单一、被动的受众角色。信息的传播者和目标对象的角色是随时在发生变化的，在某个传播过程中，某个个体可以扮演传播者的角色，但是在另一个传播过程中，他也可以扮演目标对象的角色。因此，传播参与者在传播过程中同时具有主动和被动的特点。第二，中介社会传播模式强调传播的互动与信息的多重传递，信息的传递不仅仅只有一轮，而是在传播者和目标对象之间多次传递，这一点尤其适用于分析社交网络中的信息传递过程。所以，这一模式基于媒介的物质性和中介性，更加适用于数字化时代的多元的、主动的、以人和物共同构成的新闻关系网络为载体的数据传播过程。


    ## 第三节 智能新闻生产与传播关系网络


    新媒介技术的发展推动着数字时代的新闻学的研究将内容转向技术，重构了人与媒介技术的关系、新闻生产和传播的关系。基于物质性理论的视角，我们将新闻研究的中心从人转变为物，并把隐匿在新闻内容和平台背后的物——数据重新揭示出来，新闻生产流程正是媒介技术中介下的数据流动过程。但是，物质性视角并不意味着“以物观物”，而是把关注点落在围绕着数据物所产生的新闻环境和社会关系上，从而重新审视媒介如何决定人的处境。数据在其中作为物的存在，将人与作为装置的新闻平台连接起来，构成以关系为核心的“社会-物质”网络。在这个网络中，尽管新闻生产的内容逻辑与技术逻辑发生着众多的碰撞，媒介技术也体现出一定的自主性，但人与物之间最终通过媒介网络而凝结成媒介系统，技术也需要与人共同建构媒介网络才能发挥作用，从而实现人与技术、思想与机器之间的协同运作。


    在人与技术协同运作的媒介系统中，物质性的媒介发挥着中介作用，连接着传播者和接受者双方，并在空间和物理中建立起二者的关系，语言等符号形式作为物质性的媒介而被物质化了，中介性成为媒介的物质性的重要特征。基于物质性视角下将数据作为技术和媒介的中介性特质，数字时代的中介社会传播模式将人与物共同建构出的中介系统视为传播的中心，信息以数据的形式聚合在由算法和记者共同组成的关系网中，并在传播者和目标对象中循环流动，并随新闻生产和传播的关系网扩散。


    从理论范式的构建上，本章选取了物质性理论中与数字媒体相关的部分，试图在下述三点进行理论上的突破：一是立足于数据，将物的概念融入人工智能新闻生产来理解人与物的关系，从数据的本质来分析新闻生产和传播的本质；二是在人与数据物所共同建构的新闻关系网中，通过媒介网络理论来分析技术的自主性如何与人的逻辑融合成媒介网络，从而应对新技术对新闻从业人员带来的挑战，建构人与物协同运作的媒介系统；三是在物质性所强调的技术特性和媒介的中介性基础上，将中介社会传播模式融入智能新闻情境，结合数字媒体的特征来建构新闻生产和传播模式，并将数据的流动作为该模式的运作机制，进而分析数据在中介系统内容部分如何影响新闻生产和重构人与技术的关系，在外部如何重构传播参与者的关系和传播结构。


    从物质性的视角来重构新闻生产和传播的关系，充分发挥了数据作为技术物的媒介本体论思想在数字时代的诠释力，不仅在理解新技术条件下的人与技术之间的关系上提供了富有创见的视角，还能通过创建中介社会传播模型来分析数字时代互动性强、传播主体多元和多级传播的特点。新闻学研究的物质性视角将研究对象从内容转变为技术，重新审视技术在媒介发展和社会变迁中的重要作用。但是，这种视角并不等同于技术决定论，因为它将技术置于人与物共同建构的媒介环境中，正如基特勒所指出的，作为技术的媒介物决定了人的情境，而真正发挥作用的是这种情境，技术的影响力也需要在与人共同建构的媒介网络中才能发挥；也正如许烜所强调的，技术物也需要缔合环境来维持与外部环境之间的关联和平衡。所以，媒介技术或者技术物，在新闻生产和传播过程中提供的是一种情境，或者一种环境，在其中需要人与物协同运作，需要内容逻辑与技术逻辑协调发展，才能推进整个新闻体系的有序发展。


    此外，从技术视角来反思新闻生产和传播流程并非是近年研究的一种创新，而只是一种理论回归。这种回归从理论上讲，远可以追溯到 19 世纪中期以来技术哲学的探讨，近可以回溯至哈罗德·伊尼斯（Harold
