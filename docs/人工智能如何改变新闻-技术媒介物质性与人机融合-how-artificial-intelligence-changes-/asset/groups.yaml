    ## 二、第二条路径


    第二条路径主要由法国哲学家雅克·艾吕尔（Jacques Ellul）及其理论追随者兰登·温纳所推动。艾吕尔在其《技术社会》（The Technological
    Society）一书中提出，“技术已成为自主的，它已经塑造了一个技术无孔不入的世界，这个世界遵从技术自身的规律，并已抛弃了所有的传统”③。技术本身能够在人的计划、期望和选择之外实现一种自我生成的过程，而且一项新技术的发现能够使得技术成为可能，并成为其产生所需的条件。④
    这便意味着，技术的发生与发展是一连串的、自主式的生成。经过一段时间的发展，技术会变得越来越专业化和复杂化。兰登·温纳在此基础上进一步细化指出，在技术系统中，虽然工程师通过程序等手段控制着机器，掌握着程序的实施与更新，但技术却能够实现自治、独立、不为外部法则或者力量所支配。技术一旦投入使用，便能够形成自我生成、自我延续和自我编程。①不仅如此，技术的自主演进还会发展出一种“技术律令”，即技术“运作的条件要求对其环境进行重建”，因为要使技术发挥作用，工具使用者不但需要提供一种工具，还必须提供“使这个工具能发挥作用的一整套手段”②，从而技术会推动一种“反向适应”③，即技术手段会推动其环境乃至于采用这种技术手段的目的的变化，甚至推动统治的变化。


    以上这两条路径，除了阐述技术与系统的自主性与支配性的一般理解之外，对媒介、传播与文化研究思想的影响也非常明显。简要举例来说，卢卡奇的论述在相当程度上影响了法兰克福学派中包括霍克海默、阿多诺和马尔库塞在内的早期学者，他们对晚期资本主义生产方式、文化工业与资本主义意识形态的论述明显受到了卢卡奇的影响，上文中提到的哈贝马斯则一生最主要的工作都在与“系统”对“生活世界的殖民化”做理论斗争。对媒介与传播研究影响极大的吉尔·德勒兹（Gilles
    Deleuze）和菲力克斯·瓜塔里（Felix Guattari）二人所提出的“社会机器”思路也和马克思意义上的“机器”概念有直接的承接关系。④在美国传播学研究中，尼尔·波斯曼（Neil
    Postman，又译波兹曼）关于媒介生态学的相关论著也强调技术的自主性，认为技术一旦为人所接受，就会“按照它设计的目标前进”⑤；此外，赫尔曼（Edward
    Herman）和乔姆斯基（Noam Chomsky）

    ① 温钢．自主性技术：作为政治思想主题的失控技术［M］．杨海燕，译．北京：北京大学出版社，2014：13－16． ② 同①13－87． ③ 同①86，203．
    ④ 帕顿．德勒兹与政治［M］．尹晶，张璟慧，译．开封：河南大学出版社，2018． ⑤ 波斯曼．技术垄断：文化向技术投降［M］．何道宽，译．北京：北京大学出版社，2007：3．


    的《制造共识》① 等研究也明显受到上述理论脉络的影响。


    从理论脉络来看，这些理论展示了现代技术发展之后理论界对于技术自主性与支配性的长期忧虑与批判，它们一致指向技术所体现的自主、支配性特点所带来的社会性后果。然而，这些理论虽然也对媒介与传播理论产生了直接或间接的影响，并对理解当下的媒介与传播现象仍具有启发意义，但是它们在总体上关注宏观叙事的特征，并从人类主体性的角度出发阐述对现代技术自主性与支配性的批判。这种视角忽视了人和技术可能存在的网络关系，以及从这种网络关系出发去审视媒介技术与人的关系时可能获得的新洞见。对媒介技术与人的关系进行系统分析，还需要借助近年来不断兴起的德国媒介理论及其代表基特勒等的媒介技术思想来挖掘一种与上述理论脉络所不一样的，且更具互动性和长期性的视角。


    ## 第二节 重构人与技术关系——媒介网络


    德国媒介理论及其所建立的研究范式，主要代表为基特勒所建立的媒介理论。在这之前，在德国学术界占有主导地位的仍然是法兰克福学派及其所代表的批判性研究，包括其中的技术批判研究。法兰克福学派在理论上主要沿袭德国古典主义哲学（如黑格尔），以及马克思的批判思想，还有后期加入了很多西格蒙德·弗洛伊德（Sigmund
    Freud）的精神分析学的观点。其研究主要关注对资本主义的批判，尤其是在资本主义的社会中，大众传播媒介对社会、政治、经济方面的作用问题。阿多诺和霍克海默的

    《启蒙辩证法》已经开始关注广播电视和电影，并进行文化工业的批判研究。这是德国媒介研究明确产生之前一种非常重要的理论的思路或方式，也影响了后面的媒介研究。


    20 世纪 70 年代，随着法兰克福学派的衰落，德国理论界开始出现真空，以麦克卢汉为代表的北美伊尼斯学派，以及来自法国的福柯与后现代理论开始进入德国。随后基特勒便成为德国媒介理论的重要代表人物。首先，因为基特勒是第一个在作品中融入“麦克卢汉元素”的学者：在法兰克福学派的传统失去曾经的辉煌后，麦克卢汉的一系列作品为媒介研究引入新的研究方法、研究对象和研究主题。其次，基特勒带来了媒介研究范式和研究对象的转变。原来法兰克福学派更多的是从高雅文化的视角出发批判所谓的通俗文化或者是大众文化。再次，基特勒摆脱了法兰克福学派原先强大的阴影，在理论真空的时候，他带来一种从文本分析到文化分析的转向，包括摒弃原来以高雅文化为标准的批判视角，融合了文化研究中对日常大众文化的关注等。


    基特勒融合了黑格尔和海德格尔的德国技术哲学观，以及拉康、福柯、阿兰·图灵（Alan Mathison Turing）、麦克卢汉和保罗·维利利奥（Paul Virilio）等的思想。在学术路径上，他摒弃了以人的身体为核心的人文主义传统，转而强调媒介物质性，反对法兰克福学派严重忽略技术条件而过度强调人文学和人类的传统。他的思想中融合了很多法国后现代与德国古典哲学的思想，更强调媒介的物质性结构，从而摒弃了原来法兰克福学派强调人文主义的一面。基特勒的观点与法兰克福学派很不相同，而且他也不会过多强调资本主义的统治等话题。他更多的是把媒介放在时间维度考察，重点关注整个技术的变迁。同时在理论思路上，他也和麦克卢汉的“媒介是人身体的延伸”的观点分道扬镳，他不再强调信息，不再强调身体，而是强调技术作为符号载体的物质本身。至
    90 年代之后，相关流派的理论显示出生命力，它们对媒介技术变迁、媒介考古学、控制论等方面的研究都是由基特勒所触发的学术研究领域。


    承袭了德国技术哲学的理论路径，基特勒的媒介理论具有非常强烈的媒介本体论色彩。基特勒认为，在本体论层面，并不应该依照亚里士多德所开启的形而上哲学的传统，即主要依照形式与质料的差异来定义事物的方式来定义媒介（例如常见的纸媒和广播电视的区分），而应该延续马丁·海德格尔所开创的技术本体论，从媒介在“时间与空间中的关系”来定义媒介自身。①
    而技术媒介的本体论特征则基于“处理、传输、存储”数据和信息的网络，这种特征可以在“技术媒介的整个递归历史中寻找到”②。无论是书写、印刷，还是打字机、留声机和电脑，这些技术媒介都使得信息、话语和语言在空间得以“处理、传输、存储”，从而使得信息、话语和语言在时空中成为“不朽的东西”③。


    基特勒一生中反复阐述的一个重要思路，即无论是从某些特定的时代的话语网络来看，还是从雅典以来的长时段历史来看，技术媒介网络都对社会沟通与运行、知识与话语的生产与存储产生决定性影响。④
    例如，基特勒以哲学书写为例指出，羊皮纸代替莎草纸、古登堡印刷机代替手写，不论对哲学的形式还是哲学的内容都产生了系统性的影响。⑤ 而媒介技术对于艺术和生活的影响，基特勒曾经这样论述道：“因此，技术装置可以从所谓的艺术家的眼睛和手中分离出来，形成那些绝对自主的领域——光学媒体技术，它们环绕着我们，甚至决定着我们今天的生活。”①在《留声机
    电影 打字机》中，基特勒用更加简约的一句话将之归纳为“媒介决定人的处境”②。

    ① 基特勒．留声机 电影 打字机 [M]. 那春丽，译．上海：复旦大学出版社，2017．

    ② KITTLER F．Towards an ontology of media [J]．Theory，culture & society，2009，26（2－3）：23－31．

