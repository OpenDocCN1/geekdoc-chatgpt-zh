    ② 马克思．资本论：第 1 卷 [M] //马克思恩格斯全集：第 44 卷．2 版．北京：人民出版社，2001：437 - 438.

    ③ 同②：443，441.


    之后，马克斯·韦伯（Max Weber）则从另外一个角度阐释了技术的主导地位，即官僚管理系统的管理“技术”所带来的支配性。① 当然，鉴于其稳定性和高效性，韦伯对这种管理“技术”带来的支配性持一种肯定的态度。但在韦伯身后，众多学者对这个理论进行了更为多元的发展，其中许多支系甚至推翻了韦伯原初的看法。例如，卢卡奇·格奥尔格（Lukács，György）②，试图用韦伯的理论来阐释马克思的思想，或者调和二者之间的一些关键分野，在《物化和无产阶级意识》一文中，卢卡奇富有争议地指出，官僚管理系统理性化的“事务性”在很大程度上深化了工人通过进入马克思意义上的机器生产与资本主义生产关系而导致的“物化”现象，理性化的管理性“技术”与工厂机器推动的机械技术，共同推动了整个社会系统全面“物化”——一种由管理技术的自主性与支配性加上工厂机器的自主性和支配性所导致的人与社会的全面异化。③


    法兰克福学派沿袭了马克思对技术的反思与批判的思想，通过对 20 世纪中期所盛行的科学主义思潮的批判而确立了自己技术哲学的理论观点：首先，法兰克福学派对技术的批判更多的是从对技术理性的批判出发的。批判工具理性/技术理性——当代科学技术进步和理性观念演变的产物——已经渗透到社会总体结构和社会生活的方方面面，成为单面社会尤其是单面文化的思想根源，成为这个社会进行合法统治的基础。其次，在批判实证主义的过程中形成一种“批判的科学哲学”，以人本主义作为出发点，分析当代科学技术给社会所带来的消极作用：在发达的工业社会中，科学技术是如何异化为一种新的控制形式的。在霍克海默（M.
    Max Horkheimer）


