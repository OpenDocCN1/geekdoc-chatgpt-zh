    除了与数据标注有关的庞大工作之外，智能媒体平台还有大量的其他隐形工作，例如人工内容审查工作。由于大量的自媒体生产内容（如头条号内容）进入平台并且引发了强化监管的政策性要求，从
    2018 年年初开始，头条开始组建人工团队对内容的真实性、合规性进行核查。当时，头条每天新增发布 50 万条内容。面对如此庞大的信息量，人工审核的效率难以跟上，每天
    50 万条内容全部交由人工来筛查的话，一个人需要工作 500 天才能看完，而机器则只需要 90 分钟。但若全部交由机器，边界就会成为另一个棘手的问题。头条因此采用“人工审核+技术识别”的方式来完成这个工作：先由人工智能进行审核，人工智能不能判定的内容则交由人工审核。这个过程可以完成
    80%以上的内容审核工作。而人工智能筛选出来的内容、举报邮箱中的待处理内容、重点关注内容的审核，则交由人工审查员手动审查处理。


    在手动审查部分，头条建立了一套数据分析系统对审核人员进行分配协作，其机制与内容分析研究中的编码员间信度检测极其类似：两个审核人员“背对背”审核，如果操作不一致，进入质检，由资历更加深厚的团队判断结果；对于重点文章，则严格落实双审制度，只有两审操作结果一致才生效。由于这种设置，人工审查的工作量变得非常大，伴随着头条信源的日益复杂化以及每日新增信息数量的急剧增加，审核人员团队人数也在急剧上升。①
    截至 2019 年年底，头条的母公司——字节跳动内部就已经拥有一个超过 10 000 人的庞大的内容审核团队。②


    ① 截至 2019 年 12 月，头条号账号总数已超过 180 万，平均每天发布 60 万条内容。与此同时，头条的社交产品“微头条”每天信息发布量近 1 000
    万，产生的互动数量超过 2 000 万。资料来源：头条简介，网络链接：https://www.toutiao.com/about/。


    ② 包括头条北京总部及各地区分部的审核人员。作为对照，当时头条的工程师共有约 4 000 人。数据来自访谈。


    这种隐形工作的巨大体量以及其中劳动的不平等性令人关注。然而，如果换一种视角对这种隐形工作状况做仔细考察，至少会发现另外两个相关的问题。第一，如果从媒介网络的角度来看，人工审查员的和数据标注员的隐形工作，它们在媒介网络中的结构性位置，与纸媒时代的审查员、排版和校对人员的工作颇有相似之处。甚至，在纸媒和广播电视时代，媒介网络由于其具有更强的分散性、多元性和基数大的特征，使得审查、排版和校对等“隐形”工作人员的数量未必少于看起来数量庞大的智能媒介网络的隐形工作人员数量。只是在具体的工作组织形态上，智能媒体平台的隐形工作更加具有分散性、不稳定（precarity）的特征。从这个角度来说，智能媒体平台自然具有鲜明的数字时代的特性，然而其仍然共享了媒介网络的结构性特征。第二，审查员审核的是来自各大信源平台以及头条号等自媒体的内容，这将之前一个受忽视的问题再次放到人们的审视目光之下：头条这样的新闻与信息聚合网站仍是一个媒介网络。正如基特勒所说的“被称为书的存储媒介的存储媒介”的“图书馆”一般，头条并不生产新闻和信息，它只是将其他合作信源和自媒体的新闻与信息聚合起来进行推送。然而，它的合作者和自媒体用户的媒介内容生产同样是在媒介网络中进行的。这种审视同样也适用于数据标注。这种审视得出的结果是，对于智能媒体平台来说，其他合作媒介信源、进行用户内容生产的自媒体用户以及各种隐形工作的从业者，构成一个庞大的次级网络，在这个次级网络中，人与物构成了相互关联的网络主体，围绕着智能媒体平台而运作。


    ### 三、平台的“永存”与人的主体消融


    相比起数据标注，深度神经网络模型的设计与开发、人工智能应用场景的适配，常常被认为是人类主体性体现最为完整的领域：作为主体的人类和作为客体的程序模型，两者之间的关系体现的是主客体之间的关系。


    从这种观点出发，许多论者试图表明作为人类智力的产物，算法模型、人工智能、智能媒体平台体现的是人的意志；因而，对智能媒体的治理，从严格意义上来说即是要从人的主体性出发，重新审视算法模型、人工智能和智能媒体平台的价值取向，以弱化甚至避免媒介技术对人产生的宰制效应，进而构建更加公平、普惠的智能媒体平台。


    然而，如果从媒介网络的视野来看，人在媒介系统中从来都处于一种双重的位置：就微观工作层面而言，无论是个人还是群体都对自己的工作具有相当程度的掌控性；就整个媒介网络层面而言，无论是个体还是群体都成为媒介网络系统的一部分，或者成为多重媒介网络组成的媒介系统的一部分，从而被整个媒介网络运转逻辑和技术媒介的演进逻辑所影响。就此研究中主要关注的智能新闻媒体的演进历程来看，可以清晰地观察到这种双重性。


    基于互联网的媒介技术的升级换代推动着新闻与资讯平台的升级换代。

    在这个过程中，技术已经体现出了一定的自主性，依照自身的发展逻辑进行代际更迭，并且在很大程度上改写了平台运营的规则。媒介技术对于新闻生产过程的介入越来越深，智能化程度越来越高，在内容生产与呈现层面，平台内部的人力资源投入越来越少。然而，随着互联网技术对于平台运营介入的加深，技术开发人员的投入占比则在不断上升。到了智能平台阶段，人工已经在一定程度上成为基于互联网技术的人工智能技术的辅助。


    但是，智能媒体平台的媒介网络特征并没有改变，媒介网络将人与算法融合到整个智能媒体平台中，无论是人还是算法模型，都是为了整个新闻生产的智能技术系统的有序运行而关联在一起。前述头条的运营人员对此评论道：“这个公司就是因为这个平台、这套算法存在的。如果这套算法没有了，或者在市场上没有优势了，头条也就不是现在的头条了。所以大家所有的努力就是维护好这套算法，让这个平台在市场上不要掉下去。（Z5）”


    从这个角度来看，智能媒体平台的确在一定程度上可以被看做一种融合了艾吕尔-温纳的技术自主性和芒福德的“巨机器”理论的、依照技术逻辑自我推动发展的智能媒体“巨机器”。技术和运营人员、平台的软硬件构架、外包服务机构等所有的运作都在为平台和算法的“永存”而努力。这种状况回应了前文所说的“双重性”：在智能媒介网络中，一方面，人在微观层面仍然具有强大的工作掌控力，例如，可以进一步提升算法推送的准确性、加快算法的响应速度以及在移动终端
    App 上推出更多的功能；但在另一方面，在这个智能媒介网络体系中的所有人和物，都在为以算法为核心的智能媒介网络的“永存”而努力。因而，认为算法工程师或者其他的“人”才是智能媒体平台的掌控者，可能在一定程度上忽视了媒介技术自主逻辑的“技术律令”和“反向适应”①
    所带来的限制性。


    ### 第四节 双重的人与关系主体的重建


    智能技术在很大程度上重塑了新闻业的基本途径，从而对一般意义上的社会结构、社会权力构架和利益分享分配机制产生重大冲击。如果从媒介网络的视角来仔细观察智能新闻聚合网站的微观生产，可以看出从
    Web 1.0 时代的页面新闻到当下智能技术主导的新闻聚合平台，“人”在媒介网络中的位置正在发生系统的迁移：在新闻与资讯生产层面，人和人工正在渐渐脱离核心位置。虽然出于政策监管要求，大量的网络内容审查人员重回“把关”位置，然而与内容信息的庞大数量、整个媒介网络的巨大体量相比，在内容层面的“人”的重要性还是在急速降低；但在媒介技术层面，人的投入量则大为增加。然而，无论这种迁移方向如何，都并未改变一个基本的事实：在智能媒介网络中所有的人和物，都在为以算法为核心的智能媒介网络的“永存”而服务。换句话说，智能媒介网络也共享了媒介本体论的基本特征：具有自主性的媒介主体。


    但是，通过将智能技术与大众传播时期的媒介实践经验进行对比来讨论重新伸张人类主体性、时刻“以人为本”的观点可能会面临众多的困难。如果从基特勒的媒介网络视角进行分析，人的绝对主体地位如果不是从来都未曾存在的话，那么至少在机械媒体时代就已经大部分消融①，而尼尔·波兹曼②、西奥多·阿多诺及马克斯·霍克海默的《启蒙辩证法》③等数以百计的研究则对大众传播对人类主体的支配性进行了严厉的批判。人们对于新技术的恐慌也并非从智能技术的大规模应用才开始，而是一种重复出现的历史境况。在技术媒介通过自主性增长把人变成技术媒介网络“配件”的情况下，人一直处于一种双重的位置：就微观工作层面，无论是个人还是群体都对自己的工作具有相当程度的掌控性；然而，就整个媒介网络层面而言，无论是个体还是群体，都或者成为媒介网络系统的一部分，或者成为多重媒介网络组成的媒介系统的一部分，从而被整个媒介网络运转逻辑和技术媒介的演进逻辑所影响。


    ① KITTLER F. Draculas Vermächtnis: Technische Schriften [M]. Leipzig: Reclam,
    1993: 1-57.

    ② 波兹曼. 娱乐至死 [M]. 章艳, 译. 北京: 中信出版社, 2015.

    ③ 霍克海默, 阿多诺. 启蒙辩证法: 哲学断片 [M]. 渠敬东, 曹卫东, 译. 上海: 上海人民出版社, 2003.


    基特勒晚年的关注重点从技术媒介转移到前技术媒介的“文化技艺”上。文化技艺在德国媒介研究尤其是媒介考古学领域具有广泛的扩展性、多义性和模糊性，基特勒本人也没有直接进行界定。然而，他在早期的《话语网络
    1800/1900》（Aufschreibesysteme 1800/1900）的“1800”部分以及晚期的古希腊研究中可能呈现出一种共同的关注：对能够形成群体性差异、具有“培育性”的文化操作和实践保持紧密的关注。在这些操作实践中，操作实践本身以更加贴近身体体验的方式，培育一种区分性的技艺，这种区分性技艺贴合个人但更加关乎群体，但却并不要求一种超大范围甚至全球意义上的同一性和垄断性。例如，在《音乐与数学（一）》（Musik
    und Mathematik I）① 中基特勒提到古希腊的字母表和它的变体能够标记语言、数字、音乐记谱，它构成了一种关系性的技艺网络，连接了个体、群体的多重文化实践。这些技艺很明显很难被看做一种“以人为本”的操作。与此相反，智能媒体平台目前被广泛质疑的“个体定制化信息生产和推送”，在一开始反而被技术乐观主义者更多地看做一种具有“以人为本”、符合人类价值观的智能化媒介实践。在智能媒体平台微观生产与社会后果两大层面都越来越体现出支配性的情况下，重提文化技艺并非要退回到非媒介技术的时代（这既不可能也不必要），也并非要在主体-客体的二分思维下，重新伸张作为主体的人对于作为客体的智能媒体的掌控。其探讨的方向之一，可能在于要在网络关系本体论的视野下，一方面承认技术媒介的强大自主性，另一方面思考智能技术和平台如何能够生成可以连接个体、群体且形成群体性差异以及特定文化的操作和实践。


    ## 第三章 智能新闻生产：人与技术的协同运作


    ![](img/228cf445208423908042e1490b71df9d_90_0.png)


    - 智能新闻生产与传统的新闻生产最大的不同是，算法不再仅以工具的属性，而是以主体的姿态参与其中……新闻从业者和算法技术以彼此可以理解的方式进行互动和合作，共同塑造了智能新闻生产的底层逻辑。

    - 从新闻生产实践的流程来看，人与算法不是静态的、机械的结合，而是一种彼此不断适应、相互调整、共同发展的互动关系，两者为了新闻生产更高效、更符合预期而共同努力。


    算法已经深度参与到了智能时代的新闻生产与传播中。


    第二章的内容探讨了人与技术之间的关系，清晰地呈现了宏观新闻生产中人与技术是如何共同参与其中并且构成媒介网络的，并且认为人与技术只有共同发挥作用，技术系统本身才能正常运转。


    既然人类与机器、技术与文明之间无法进行简单的二分，那么二者协同运作的机制是什么？人类发明了技术，而技术仅仅只是人的外化吗？为了回答这些问题，在这一章，我们聚焦于算法本身的运作逻辑，结合“器官学”的相关理论和维纳的控制论学说，融合参与智能新闻生产实践的工作者的视角，借助扎根理论的方法来进一步考察技术是如何“嵌入”微观的新闻生产流程中，具体考察人与技术是如何协同运作的，在新闻价值的判断、内容的选取与分发的过程中，人与算法的互动又是如何构建出当下新闻价值的内涵的，并从后人类的角度来理解人机融合、人与技术共生的机制。


    ### 第一节 新闻生产中人与技术关系的追问


    以算法为代表的数字技术不仅全面参与到新闻生产的各个环节中，逐渐改变着传统新闻生产的流程，催生出自动化新闻、算法新闻等新概念，还下沉到新闻生产的底层逻辑，并倒逼“人”适应其参与形成的新闻生产格局①。由此，新闻生产迎来了“算法转向”②，引起学者的广泛关注。如，


