    \n那么，数据之间的关系如何建立，不同的数据如何储存，结构如何，则成为物质意义上影响算法关联的重要因素。不同的结构决定不同的关系，而平台的基础设施架构决定着数据的结构与关系。社交媒体普及之前的互联网时代，用户不参与信息生产，因此数据的来源比较单一且主要基于特定的计算机（如\
