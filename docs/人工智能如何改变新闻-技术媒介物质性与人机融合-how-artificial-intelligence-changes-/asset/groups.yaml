    后续的学者在基特勒的基础上将文化技艺看做“一种运作性链条，存在于人与物的关联方式之中，借助它，意义和现实得以存续”①。这一概念注重从文化操作和实践的角度来理解媒介技术，对于媒介研究的物质性转向和人类中心主义的破除具有重要意义，人们依此不仅思考媒介技术如何使人类文明不断生成新的存在方式，而且试图将“行动者”（actors）、“器物”（artifacts）与“技艺”（techniques）三者之间串联成为一个复杂的操作链（chains
    of operation）。② 文化不是先于技术而存在的，人类和技术共同进化。不同于作为实体的技术物，文化技艺是一条赋予操作以“稳定性和适应性”的链条，这种“程序链”和“连接技术”产生了各种文化概念。③
    通过将“行动者”（actors）、“器物”（artifacts）与“技艺”（techniques）三者之间串联成为一个复杂的操作链，文化技艺理论将人们熟悉的“媒介”分解为一个操作网络，这一网络可复制、置换、处理和反映特定文化的基本区别，研究者可借此观察“技术物和它们所属的配置或构成它们的操作链”如何“存在于人与物的关联方式之中”，“意义和现实”如何“借助它得以存续”④。


