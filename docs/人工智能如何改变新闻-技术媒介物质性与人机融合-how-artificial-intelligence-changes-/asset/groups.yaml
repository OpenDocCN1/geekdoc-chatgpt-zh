    然而，无线电的发明开启了人类信息传播的新时代，媒介的基础设施和传播速度彻底发生变革，从而也改变了时效性在新闻传播中的地位。产生于 19 世纪的电报技术则彻底打破了新闻的传播格局。自此以后，人类社会进入了声光电的时代，并因此带来了政治、经济、社会与文化方面的巨大变迁。信息以光的速度在世界范围内传输，无论物理距离相隔多远，都能够实现“共时”与空间上的“共在”。遍布于各地的电缆在高速传递信息的同时，也让符号的流动不再受到交通的局限。电报的发明第一次让信息传输在技术上摆脱了对物理交通的依赖，远远超过了书写和印刷文字的传播能力，也将传播从地理局限中解放了出来。⑤
    新技术不仅仅带来了关于时间和空间的新体验，也因为传播所建立的新的连接使事物之间产生更多的新关联。


    对于新闻行业而言，电报和遍布于各地的电缆也使本地新闻和那些没有时效性的新闻失去了在报纸上的中心位置。⑥ “报纸的财富不再取决于新闻的质量或用途，而是取决于这些新闻来源地的遥远程度和获取的速度。”⑦
    当时，电缆所铺设的范围和发布信息的费用还比较高，尚属于竞争性资源，'
