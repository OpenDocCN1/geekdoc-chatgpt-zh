    # 图 3-2 新闻生产过程图


    从过程图中还可以发现，算法不再仅仅是新闻编辑室中职业新闻从业者的辅助工具，而是渗透到新闻生产的各个环节，形成了“你中有我，我中有你”的动态合作关系。在新闻生产实践中，其一，很难将信息监测与获取、新闻制作和分发等阶段完全分开。获取信息既是为新闻制作提供材料，也是为评估社会热点和刻画受众画像，使新闻分发更为精确；新闻制作过程既发生在获取信息之后，其本身也将作为信息以供新闻内容制作使'
  - '[PAGE 118]


    用；新闻分发的同时反馈用户信息，还将影响下一次信息获取、新闻制作和分发。


    其二，新闻生产的各个阶段都是通过人与算法的合作紧密联系在一起并互相影响的。很难将算法从人的实践活动中剥离出来，明确指出哪一部分工作是由人独立完成且不受算法影响的；反之亦然。除了显性的分工之外，人和算法之间围绕新闻生产进行着多维度的“沟通”和“互动”。在实践过程中人已经适应了算法的工作逻辑，如“打标签”采用的形式是对“现在屏幕上的内容做选择题或者打分”(Z3)；“发布新闻时要有严格的操作顺序，在指定地方填写标题、导语”(Z4、Z6)；“人工干涉新闻排序的方式是在后台调整新闻的某些评价赋值”(Z3)等。同时，算法也以人可理解的形式为人工提供调试和介入的“接口”，在不改变基本框架的前提下不断训练以满足人的需求，并且“允许”人介入算法新闻生产的任何一个环节。从这个角度来说，算法已经不仅仅是记者的辅助工具，其在客观上嵌入了新闻生产实践中并成为重要的参与者。


    其三，人与算法的有机合作不仅形塑了新闻生产的新形态，也深刻改变了新闻审核的机制，人机合作的“新闻把关”® 已经成为现实。传统新闻编辑室中“把关人”的角色与功能被分散在各个环节中，甚至当新闻分发出去之后，人工还要对其进行复审。审核过程中人和算法各有分工，算法根据敏感词库等一系列规则对新闻进行评估过滤；人针对新闻内容的真实性、是否有吸引力、是否有病句等问题进行审核。承担这项工作的不仅包含记者、编辑等直接接触到新闻生产环节的人，还有大量的审核团队负责为新闻内容做标记，即“打标签”。人工做的标记一方面是为了审核新闻内容，另一方面也是在辅助算法更好地刻画用户画像，以进一步提高个性化推送'
  - '[PAGE 119]


    的精确度。此外，人和算法的所有操作痕迹都将以数据的形式记录下来，作为之后复查或归责的凭证。正如 Z3 在访谈时所说：


    > 我编辑去推送的时候也会去判断一下，以及算法写稿输出的这些稿件一般也会有人去审。谁做的（写新闻稿件），他自己也会对输出的内容做一个把控，所以这部分其实是有审核的，而且对于质量的审核，是运营本身的基础工作之一，是因为我们要对它负责，这部分分我们审核出来的东西，我们发的时候是带有我们自己的审核的，比如说它确实有问题了，我们是可以找到是谁审核的。（Z3）


    # 三、新闻价值：人与算法技术的价值交锋


    数字技术的不断发展和对传统新闻生产实践的冲击不断地消解着传统新闻业专业性背景下的新闻客观、中立等价值崇拜。① 人与算法的协同进一步彰显了新闻的重要性、接近性、时效性等新闻价值，为当下关于新闻价值的讨论提供了新的思路。进一步来说，人与算法的互动是如何构建出当下新闻价值的内涵的？


    首先，新闻价值的重要性要素的表现形式和内涵有所拓展，判断“何为重要内容”的权利部分让渡给算法和受众。对于人这一方面，除了和传统的新闻记者类似地通过自身从业经验和对新闻价值的判断，在信息获取、新闻制作方面进行判断和选择，还会通过影响新闻推荐的顺序以决定哪些新闻是重要的。在表现形式上，人会选出自己认为有价值的新闻，使其在网页较为显著的位置停留较长时间，而不随着算法推荐的逻辑进行更新。


    人工的分发相当于一些固定位，当然一般对外的口径来说，这个'
  - '[PAGE 120]


    平台的热榜都是由算法来进行排序的，但是每家的热榜其实都留了人工干预的口，这个也就是说人工可以干预网页的任何位置，如果仔细观察的话，你会发现有一些大事情它的热度还没有足够高的时候，就会出现在热搜的第一名。(Z3)


    在算法的视野里，热点信息等于重要信息，用户数据成为测算“热点”的唯一依据，新闻价值的重要性要素被量化成诸多指标。在人与算法互动的维度，算法只能以自己可理解且记者不得不接受的方式，即以数据化的形式对“什么是重要的内容”这一问题下定义；在新闻生产的维度，人依赖算法获取新闻素材，算法则依据自身逻辑对网络上的信息进行监测和抓取，也就是说记者所获得的素材是算法认为重要的信息；在与受众互动的维度，除了人为设置的热点外，其他热点内容的产生是因为该内容短时间内获得了大量流量，即有大量用户观看、评论或转发等。由此，算法逻辑下数据成为判断新闻重要性的决定性依据之一，即重要的新闻近似等于受关注度高的新闻，这一逻辑进而影响了人对新闻重要性的理解。


    其次，新闻的接近性要素在新闻生产流程中因算法而得到强化。新闻的接近性指新闻内容在地理和心理上与受众较为接近，具有一定的相关性，所以能够引起受众的关注。① 在传统的新闻业中，新闻工作者只能通过自己有限的精力和对部分受众群体的了解决定生产和分发可能与之相关的内容。但在智能新闻生产流程中，由算法逻辑驱动的新闻分发和推荐过程更加精确化，这是传统新闻业所无法实现的。算法在内容生产者和受众之间搭建了数据化的“沟通桥梁”，即算法可以掌握每一位用户的个性化数据，并实时收集用户对所生产内容的反馈。基于此，算法本身在进行内容的筛选和推荐排序时也可更精确地将其投放给用户，记者则可以更具有针对性地生


