    | | 算法的信息可得性 | 算法需要根据互联网中已有的信息抓取信息、写新闻 |


    ### 选择性编码与核心理论范畴


    选择性编码指选择核心范畴，将其系统地与其他范畴予以联系，并将之最终概念化、理论化的过程。该过程的主要任务包括识别出能够统领其他范畴的核心范畴，用所有资料及由此开发出来的范畴、关系等简明扼要地说明全部现象，即开发故事线。在“访谈搜集文本—编码—比较分析—访谈搜集文本”的过程中围绕研究问题，反复循环提炼总结，使得模糊不清的类属明确化，并删掉明显与主题无关的语句和自相矛盾的语句，直到不再出现新的类属。此外，在收集、分析数据时还需要不断反思逐渐形成的范畴，以保证所得编码能充分解释类属，弥补“文本-概念-理论”之间的缺陷。至此，理论抽样结束，所得类属达到饱和状态。本研究共概括出新闻生产实践、人的主体性、新闻价值、算法的自主性和底层逻辑五个核心范畴（见表
    3-3）。


