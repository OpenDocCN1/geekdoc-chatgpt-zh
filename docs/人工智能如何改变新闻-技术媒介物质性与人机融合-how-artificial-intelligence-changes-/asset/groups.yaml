    媒介物质性将新闻传播的研究视角从人转向人与物共同构成的网络，从而也从根本上摒弃了人与技术对立的格局，并且在媒介科技不断加速变革的时代重新审视技术给新闻带来的影响。其实，自新闻业产生的那一刻起，技术作为重要的外部条件已经对其构成了重要影响。无论是印刷术的革新所实现的固定的报纸出版周期和现代报业的产生，还是电信时代通过电缆连接世界各地后所形成的四大通讯社瓜分全球新闻市场，以及互联网所带来的全球通信与新闻变革，新技术在带来新的媒介文化的同时，也改变着与之相应的社会结构、权力关系以及文化。基于物质性研究的视角，我们在接下来的章节中将陆续探讨人工智能技术与人的主体性之争、人与技术如何融合、内容的数字化和大数据对新闻意味着什么、如何理解智能技术下的新型新闻生产与传播关系、作为基础设施的媒介技术如何影响新闻价值等新闻学研究中的核心议题。


    ## 第二章

    ## 人工智能与人的双重主体性


    如果从媒介网络的视野来看，人在媒介系统中从来都处于一种双重的位置：就微观工作层面，无论是个人还是群体都对自己的工作具有相当程度的掌控性；然而，就整个媒介网络层面而言，无论是个体还是群体，都成为媒介网络系统的一部分，或者成为多重媒介网络组成的媒介系统的一部分，从而被整个媒介网络运转逻辑和技术媒介的演进逻辑所影响。


    人工智能技术在新闻生产中的深度融合给传统的编辑和记者等职业带来巨大的冲击，大量人工被机器所取代，算法也取代了人的判断而决定着新闻分发。一个传统的经典议题再次被推到时代的风口浪尖上：人与技术，谁决定谁？在技术的自主性掌控下，人的主体性已经丧失了吗？人工会被机器所取代吗？人的主体性与技术的自主性的话题在新闻学研究中尤为重要，因为新闻行业并非普通的社会行业，作为社会公器，新闻承载着舆论监督与引导、文化传承等重要职能，仅仅因为技术变革，新闻记者就要将手中的权利与责任让渡于机器吗？智能技术迅速发展与普及并在媒介系统中占据主导地位，引发了学界和媒体对智能技术深刻的忧虑和大量的批评。在这一章里，我们系统回顾工业时代以来探讨人与技术关系的经典理论，并在此基础上反对将人与技术的关系进行简单的二分法的做法，进而提出智能时代人与技术关系的新思考。


    ### 第一节 人的主体性与技术的自主性之辩


    技术和技术物的自主性及其对人的操控与支配性，并不是一个随着智能技术的广泛应用才引起关注的基础问题，而是具有长久历史的研究主题。在这个主题下，大致有两条相关联的分支路径：第一条路径具有宏大的理论视野，从理论隐喻的角度描述包含技术与技术物系统在内的、广泛的社会系统的自主性和支配性；第二条路径的关注点则较为集中，主要探讨技术与技术物系统自身演进的自主性，以及这种自主性对技术所处之环境乃至社会系统的改变。限于篇幅，下文将简述这个研究主题内最为关键的学者与理论。


    ### 一、第一条路径


    第一条路径涉及现代学术史上的许多重要人物。例如，从机器开始大规模进入人类生活的时候，卡尔·马克思就已经注意到技术物的自主性和操控性，认为技术作为物质力量决定了物质的生产方式（生产资料决定生产方式），而物质活动又是人类一切活动中最基本、最本质的活动。从历史唯物主义的角度看，“手推磨产生的是封建主的社会，蒸汽磨产生的是工业资本家的社会”①。马克思认同早期人类形成的劳动技术，认为人类在早期以自发的、有意识的、生产性的劳动，形成了基于物质工具和生产技术的生产力。


    各个人必须占有现有的生产力总和，这不仅是为了实现他们的自主活动，而且从根本上说也是为了保证自己的生存。这种占有首先受所要占有的对象的制约，即受发展成为一定总和并且只有在普遍交往的范围里才存在的生产力的制约。②


    然而，伴随着工业化进程和新生产技术的不断发展，马克思对于资本主义生产条件下的“异化”的技术感到不安，他在《资本论》中曾经引述安德鲁·尤尔（Andrew Ure）在《工厂哲学》中的著名论断，将工厂描述为“一个由无数机械的和有自我意识的器官组成的庞大的自动机，这些器官为了生产同一个物品而协调地不间断地活动，因此它们都从属于一个自行发动的动力”③。当工人大规模使用机器进行生产的时候，作为人类本质的、自由自觉的活动——劳动变成了异己的、与人对立的东西。工人不可避免地失去对自己工作的控制，从而失去对生活及自我的控制。工人从来都不是自主、自我实现的人类存在，他只能以资产阶级欲望的模式而存在。①


    ① 马克思. 哲学的贫困 [M] //马克思恩格斯选集：第 1 卷．3 版．北京：人民出版社，2012：222.

    ② 马克思、恩格斯。德意志意识形态 [M] //马克思恩格斯选集：第 3 卷．3 版．北京：人民出版社，2012：209.

    ③ 马克思．资本论：第 1 卷 [M] //马克思恩格斯全集：第 44 卷．2 版．北京：人民出版社，2001：482.


    这种带有万物有灵论色彩的论断实际上是将技术当做一种仿佛具有生命一般，且不受人类控制的、异化的力量，而这种力量的背后驱动者即是由资本所推动的生产力。在工人与机器合作生产的过程中，马克思也观察到了技术系统背后的逻辑。现代机器工业是一个有机整体，仿佛具有自组织能力一样，工人与机器组成各种分工小组协同劳作，形成有组织的机器体系，各局部机器之间不断交接工作。因此，“在发达的工厂中，起支配作用的是各特殊过程的连续性……当工作机不需要人的帮助就能完成加工原料所必需的一切运动，而只需要人从旁照料时，我们就有了自动的机器体系，不过，这个机器体系在细节方面还可以不断地改进”②。


    身处第二次工业革命的马克思已经意识到机器与人所组成的有机系统所具有的自主性特征。“在机器体系中，大工业具有完全客观的生产有机体，这个有机体作为现成的物质生产条件出现在工人面前”，工业化社会的集体劳作已经彻底改变了过去单纯由人工所组成的手工集体劳作，“因此，劳动过程的协作性质，现在成了由劳动资料本身的性质所决定的技术上的必要了……大工业必须掌握它特有的生产资料，即机器本身，必须用机器来生产机器。这样，大工业才建立起与自己相适应的技术基础，才得以自立”③。


    ① 马克思．1844 年经济学哲学手稿 [M] //马克思恩格斯全集：第 3 卷．2 版．北京：人民出版社，2002：266 - 280.

    ② 马克思．资本论：第 1 卷 [M] //马克思恩格斯全集：第 44 卷．2 版．北京：人民出版社，2001：437 - 438.

    ③ 同②：443，441.


    之后，马克斯·韦伯（Max Weber）则从另外一个角度阐释了技术的主导地位，即官僚管理系统的管理“技术”所带来的支配性。① 当然，鉴于其稳定性和高效性，韦伯对这种管理“技术”带来的支配性持一种肯定的态度。但在韦伯身后，众多学者对这个理论进行了更为多元的发展，其中许多支系甚至推翻了韦伯原初的看法。例如，卢卡奇·格奥尔格（Lukács，György）②，试图用韦伯的理论来阐释马克思的思想，或者调和二者之间的一些关键分野，在《物化和无产阶级意识》一文中，卢卡奇富有争议地指出，官僚管理系统理性化的“事务性”在很大程度上深化了工人通过进入马克思意义上的机器生产与资本主义生产关系而导致的“物化”现象，理性化的管理性“技术”与工厂机器推动的机械技术，共同推动了整个社会系统全面“物化”——一种由管理技术的自主性与支配性加上工厂机器的自主性和支配性所导致的人与社会的全面异化。③


    法兰克福学派沿袭了马克思对技术的反思与批判的思想，通过对 20 世纪中期所盛行的科学主义思潮的批判而确立了自己技术哲学的理论观点：首先，法兰克福学派对技术的批判更多的是从对技术理性的批判出发的。批判工具理性/技术理性——当代科学技术进步和理性观念演变的产物——已经渗透到社会总体结构和社会生活的方方面面，成为单面社会尤其是单面文化的思想根源，成为这个社会进行合法统治的基础。其次，在批判实证主义的过程中形成一种“批判的科学哲学”，以人本主义作为出发点，分析当代科学技术给社会所带来的消极作用：在发达的工业社会中，科学技术是如何异化为一种新的控制形式的。在霍克海默（M.
    Max Horkheimer）


