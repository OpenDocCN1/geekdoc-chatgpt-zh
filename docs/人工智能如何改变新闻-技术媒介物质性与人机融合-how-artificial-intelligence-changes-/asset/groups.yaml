    随后，研究借鉴王春枝①等的方法，采用界值法对价值指标进行初步筛选。具体操作为根据每项指标的重要性得分计算满分频率、算术均数和变异系数，满分频率和算术均数的界值均为“均数—标准差”，得分低于界值的筛除；变异系数界值为“均数+标准差”，得分高于界值的筛除。因此根据第一轮函询结果，“负面性（是否带有突出的负面色彩，如死亡、受伤、失败和失业）”“娱乐性（是否包含性、动物、搞笑幽默等娱乐性内容）”两项从指标中筛除，得到共有
    31 个指标的价值清单。


    通过试询和对一轮函询结果的分析，笔者发现，由于新闻从业者对具体价值要素的态度受其工作单位性质和涉及的新闻领域影响，意见趋于分散；若根据意见的一致程度在反复函询中将价值指标直接剔除，可能影响本文讨论既有文献中新闻价值要素的初衷。因此，在此将传统德尔菲法的多轮函询改为开放性问题与深入访谈的结合，直接根据一轮函询中指标的均值与变异系数得分，对不同媒体形态下新闻工作者对新闻价值的判断倾向进行分析；同时设置开放题项，请函询对象对“工作中经常纳入考量，但既有指标不包括”的新闻价值进行补充，最后基于函询结果，对部分函询对象追加访谈，以补充说明判断的依据和背景（见表
    5-4）。


    ① 王春枝, 斯琴. 德尔菲法中的数据统计处理方法及其应用研究 [J]. 内蒙古财经学院学报(综合版), 2011, 9 (4): 92–96.


    | 编号 | 工作单位 | 工作岗位 |

    | :--- | :--- | :--- |

    | A1 | 央视总台新闻新媒体中心 | 主编 |

    | A2 | 《四川日报》 | 编辑/运营 |

    | A3 | 新华社上海分社 | 记者 |

    | A4 | 《人民日报》新媒体中心 | 记者 |

    | A5 | 《人民日报》福建分社 | 记者 |

    | A6 | 《人物》（每日人物） | 记者 |

    | A7 | 太仓市县级融媒体中心 | 客户端编辑 |

    | A8 | 凤凰网内容资讯部 | 编辑 |

    | A9 | 腾讯新闻 | 视频剪辑 |


    ## 第五节 数字智能时代新闻价值的构建路径


    我们首先对 31 个新闻价值指标按照变异系数（从低到高）进行排序，其中共有 8 个指标变异系数小于 0.25，符合协调程度检验的要求（见表 5-5）。在传统德尔菲法中，协调程度不符合要求的指标应被排除，但这一分析路径难以满足本研究的需要，因为此研究意在对智能时代新闻价值标准进行探索式的发现，而非得到一套操作化的固定指标，因此部分价值指标虽在专家意见上存在分歧，但在特定新闻领域或媒体形态下仍有其特殊讨论意义。所以，本研究对传统德尔菲法的分析流程进行了调整，结合“得分均值”与“变异系数”两项指标，并根据媒体形态（传统媒体/新媒体）将函询结果进行分组分析，尝试更为全面地展示数字智能时代新闻业界对新闻价值的选择倾向。


    如前文所述，筛选留下变异系数排名前 20 的新闻价值要素，又根据均值（从高到低）排序进行分析。发现变异系数在前 20 位的价值指标中共有 11 个传统新闻价值（平均得分均值
    3.58）与 9 个数字新闻价值（平均得分均值 3.43）。传统新闻价值在数量与得分上略高于数字新闻价值，且得分均值最高的前 5 个指标，即“时新性、明确性、正面性、机构议程性、影响力”，均为传统新闻价值。数字新闻价值虽然得分均值整体略低于传统新闻价值，但在所有
    8 个变异系数小于 0.25 的指标中有 5 个为数字新闻价值，即“互动性、沟通性、可分享性、透明性、建设性”，这表明虽然专家对传统新闻价值的评价整体更高，但他们对部分数字新闻价值指标的重要性也达成了共识。


    **表 5-5 变异系数前 20 的新闻价值指标（按得分均值从高到低排序）**


    | 要素名称 | 价值内涵 | 得分均值 | 标准差 | 变异系数 |

    |---|---|---|---|---|

    | 时新性 | 是否新近发生的事实 | 4.17 | 1.05 | 0.25 |

    | 明确性 | 内容是否易理解、无歧义 | 4.13 | 0.95 | 0.23 |

    | 正面性 | 是否带有积极色彩 | 3.92 | 0.83 | 0.21 |

    | 机构议程性 | 是否符合新闻机构在意识形态、商业诉求或者政治立场上议程设置的需要 | 3.79 | 1.22 | 0.32 |

    | 影响力 | 是否影响力大、影响面广、能立即产生影响力 | 3.71 | 1.00 | 0.27 |

    | * 互动性 | 是否容易引起受众的点赞、评论等互动行为 | 3.67 | 0.76 | 0.21 |

    | * 沟通性 | 是否与已有的舆论形成沟通 | 3.63 | 0.88 | 0.24 |

    | * 视听性 | 是否有引人注目的素材，如照片、视频、音频等 | 3.63 | 1.01 | 0.28 |

    | 价值引导性 | 是否包含“爱国主义”“自我奉献”“敢于牺牲”等价值层面的引导 | 3.58 | 0.88 | 0.25 |

    | * 可分享性 | 是否能够促使受众在社交媒体上分享 | 3.54 | 0.83 | 0.24 |

    | * 透明性 | 是否明确展示了新闻所使用的相关数据来源和方法 | 3.50 | 0.72 | 0.21 |

    | * 迫切性 | 是否能够调动受众当下的情感、感官参与 | 3.46 | 0.98 | 0.28 |

    | * 建设性 | 是否具有指导性和建设意义 | 3.42 | 0.78 | 0.23 |

    | 情感性 | 新闻事实是否能够表现人的情感 | 3.42 | 0.88 | 0.26 |

    | 可持续报道性 | 是否具有持续报道的空间 | 3.38 | 0.82 | 0.24 |

    | * 需要性 | 是否针对特定用户群体或特定场景下的需要 | 3.38 | 0.97 | 0.29 |

    | 导向需求 | 是否能够减少事实或状态的不确定性 | 3.33 | 1.05 | 0.31 |

    | 显著性 | 是否涉及著名的人物及地点 | 3.21 | 1.06 | 0.33 |

    | 独家性 | 是否为独家报道 | 3.17 | 1.01 | 0.32 |

    | * 交互性 | 用户能够实现信息的主动获取，如点击查看等交互设计 | 3.17 | 1.01 | 0.32 |


    注：标 * 的价值指标为数字新闻价值。


    在上榜的传统新闻价值中，“时新性”“影响力”均属于西方经典价值五要素中的内容，在当下依然受到广泛认同，说明数字时代的新闻价值评判体系依然建立在对经典新闻价值要素认可的基础上。而“明确性”虽然早被提出，却不属于最为经典的五要素内容，在当下受到认可，说明互联网上信息纷繁复杂，人们的注意力资源有限，对新闻的强时效、易理解，以及影响的深刻广泛程度提出了尤其高的要求。新闻追求“易理解、无歧义”，目的在于降低受众在庞杂数据流和多方观点中理解、接受新闻信息的门槛。


    “正面性”“机构议程性”同样不属于西方经典五要素的内容，也普遍受到从业者认可。这表明“打造积极舆论环境”“把社会效益放在首位”的理念对中国新闻从业者的价值判断有整体影响；此外，多元主体参与新闻内容生产与分发，新闻从业者往往依据自身效力的媒体机构属性进行价值判断，彰显自身职业主体性。


    每一家媒体都会有细微的一些不同，比如说其他的媒体，它们发了一篇它们认为的大稿子，但放到我们这种单位，可能就不被认为它是最有价值的……每个组织内部它会有一个自己的框架，包括写作的风格、写作的惯例等，其实都是有不同的要求的，你只能到每一家具体的媒体去了解。（A3）


    你既要符合你对新闻价值的判断，也要符合你们这个新闻单位的调性。比如说像观察者网、《环球时报》，它们可以做一些非常激进的内容，转载外媒比较直接的一些点评，但是像《人民日报》这种媒体，肯定是要做稳一点的内容。（A4）


    我们党报的话第一位是安全性，因为即使我们没有那种爆款稿件，我们的本职任务也只是承担党的宣传工作。但如果是《华西都市报》、封面新闻，那肯定时效性是首位的，有流量才有活路。（A2）


    在所有价值指标中，得分均值较低的依次是“戏剧性”“冲突性”“反差性”“心理替代性”和“猎奇性”。这印证了中外新闻价值在对待冲突、矛盾时的惯有差异——这些在西方大众新闻时代的“黄色新闻潮”和“小报化”中颇受媒体重视的价值要素，在数字时代并不受新闻从业者重视。


    而在上榜的数字新闻价值中，“透明性”“互动性”“建设性”“可分享性”和“沟通性”这5个指标变异系数小于0.25；“视听性”“迫切性”“需要性”“交互性”这4个指标也进入变异系数前20名，受到新闻从业者较为一致的认可。这9个通过从业者“检验”的数字新闻价值受到平台技术和中国媒介环境的双重影响，折射了数字时代新闻价值的构建路径，下文将结合访谈内容展开论述。


    ### 一、价值客体拓展：从“新闻文本”到“新闻产品”


    数字新闻价值构建的路径之一是价值客体①的拓展与革新。研究发现，


    ① 杨保军. 新闻价值观与新闻价值创造 [J]. 国际新闻界, 2003 (3): 45-50.


    在数字媒介技术的迅猛发展下，新闻从业者进行价值判断的对象由过去较为单一的“新闻文本”变为融合了视听要素、交互体验、时空情境等多重元素的“新闻产品”，新闻价值衡量的维度也随之丰富。


    上榜价值指标中包括“视听性”“迫切性”和“交互性”。这表明平台的“多媒体”特质使受众追求更加多元的感官刺激与更丰富的交互方式，促使新闻评价标准进行调整。尤其当下技术普及使信息传输更加便利，在各家媒体均已掌握基本新闻事实的情况下，具备引人注目的视听素材、调动受众的情感反应、满足受众的主动交互需求……成为新闻产品的增量价值。


    卫星看四川啊，慢直播啊，VR体验三星堆啊，鸟瞰天府机场啊，内容的呈现方式变多了。原来只能通过图文，顶天了图拍得高级一点，但还是瞬间的记录，或者远距离地观看。现在可以让受众长时间地看一个事发地，或者说可以近距离地看一些新闻……在同等时效下，能竞争的就是技术花活了。（A2）


    “需要性”上榜也存在重要的技术背景，即移动互联网设备的普及，加上配套的智能算法推荐、穿戴设备及定位服务，使用户场景化、个性化的需求客观上能够被感知，进而影响了新闻从业者的生产实践与价值选择。在传统新闻价值中，“接近性”作为“需要性”的基础，虽然得分均值高于平均水平，但变异系数较低，即新闻从业者总体上认为这一指标较为重要，但内部意见存在分歧；相比之下，从业者对“需要性”意见的协调程度更高。这说明在数字时代的新闻生产中，“受众”始终是重要的考虑因素；但相较于过去单单考虑目标受众群体的身份以及利益关切，数字时代的新闻从业者越来越多地关注受众阅读新闻时所处的具体时空情境，包括重大节庆、生活轨迹等。


    生产新闻（文本）需要采编，获取知识、获取新闻，但是融媒体产品，你可能就造一个“场”就好。像《人民日报》的军装照它就没有内容，你要摆脱采编的思维。举个例子，比如说元旦了，我们要做一个内容的策划，然后你要想用什么样的形式可以更好地围绕这个主题表达内容。（A1）


    报道本身是面向哪些受众的，哪一些是和人们关心的东西更相关的，我们要把这些信息加入标题中。这个可能有点抽象。我记得之前编过一篇稿子，是浙江舟山有一个新增的确诊病例，我写的稿子就是类似“浙江舟山：新增一例确诊病例”，但是我们的带班编辑改了之后，就是“浙江新增一例病例，曾乘坐大巴车”。就是你要选择哪些信息去上题。（A4）


    ### 二、价值主体彰显：技术介入下的“人”


    数字时代新闻价值构建的另一路径在于“人”作为价值主体的地位凸显。在技术日益渗入新闻生产各个环节的前提下，新闻从业者不断探索人与技术如何协同共生。尤其在价值判断与把关环节，研究发现，技术的介入一方面为传统价值要素的实现提供了替代方案，从业者发挥能动性，推动传统价值解构革新；另一方面，中国从业者普遍认为技术无法独立完成价值把关，这一认知“倒逼”新闻从业者强调特定新闻价值要素，以彰显“人”在人-机协同关系中的主体地位。


    首先，用户数据的可量化为新闻价值的衡量提供了更多渠道。上榜指标中的“可分享性”“互动性”折射了新闻工作者针对受众以平台为主的新闻消费习惯而进行的策略调整。新闻工作者从过去主要依靠自身经验判断一则新闻的价值，到现在能够将平台数据作为辅助。当数字平台成为新闻生产者和消费者之间交流的桥梁时，用户的转发、点赞、评论等互动行为数据间接成为新闻内容的“影响力”“时新性”等价值的衡量指标。可被更直观量化的“互动性”“可分享性”成为新闻从业者衡量经典新闻价值的途径之一。


    我觉得在这里编片子像做菜一样，你是做出一道菜给观众品尝，他们爱吃不爱吃，你从数据上就能看出来……以往我们做的一些政治性很强的内容，必须要靠很有经验的老编辑，通过他对于这种模糊的东西进行判断。如果能借助技术去分析量化一下舆情会更好一些。（A4）


    收藏量、阅读量、转发量可以比较直观地反应新闻好坏……如果大家反响平平，能称作是好新闻吗？（A7）


    值得一提的是，可量化的用户数据有时与其他依赖主观判断的新闻价值会出现矛盾。面对这种情景，中国新闻从业者普遍更倾向于依据后者设置价值底线，但不同媒介形态、媒体属性的从业者会出现程度上的差异。传统媒体，尤其是主流媒体，往往有国家的政策支持与财政补贴，“对商业流量的依赖性较小”（A3），为了“扩大传播面”（A5），从业者往往在“保持自身调性和专业度”（A6）的前提下关注阅读量、点击率等反映影响力的互动数值，从而调整自身的新闻生产。


    我感觉新华社和《人民日报》好像并不是特别怕受到算法的影响，一是它们自己有资金去建立自己的平台，《人民日报》客户端还有新华社客户端。第二，它们自己本身影响力就很大，它们不要求在算法上能特别吸引你，你自己也会来关注它们，因为它们这里的信息比较权威。（A3）


    我们还是以记者和编辑的（主观）判断来评判的，最后的阅读量或者传播效果占的比重不会特别大。如果有好的传播效果的话，在激励机制上是会有额外的奖金的。我在开会的时候也碰到过很多，就是

    '
