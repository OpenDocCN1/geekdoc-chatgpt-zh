    这一章主要循着基特勒“媒介网络”的路径来考察智能技术的大规模应用与人的存在境况的问题。现有研究已经较为充分地从宏观社会后果的角度描绘了智能媒体的支配性，因此这里主要立足智能媒体平台，尤其是智能新闻资讯平台的微观生产角度，来呈现媒介技术与人之间的网络关系。的确，智能技术的大规模应用部分消融了人的部分主体性，人本身的处境也延续了机械媒体出现之后的境遇：在一定程度上人变成了“机器话语处理的配件和工具的主体”①。但正如海德格尔在其著名的《对技术的追问》中所提到的，危险之处存在着解决的机会②。如果将基特勒的思想融汇起来看，而不是简单摘取其具有典型技术决定论的句子，那么媒介网络路径本身蕴含着一种基于媒介关系本体论的解决路径。


    具体说来，我们将通过媒介与传播物质性理论的视野来分析智能技术，并讨论智能技术的广泛应用所带来的“人的境况”问题的多义性和多层次性。在方法上，我们主要通过综合诠释学和质性研究方法来探索智能算法主导的平台媒介网络的运作状况，以及媒介技术物（一般意义上的客体）和人（一般意义上的主体）在这个运作过程中所组成的网络关系。质性方法的研究过程则包括三个部分。首先，从
    2011 年对新浪微博平台研究开始，我们对包括即时通信、电子商务和新闻聚类分发平台在内的各类平台的技术开发与运营的系统状况进行了长期观察与追踪，关注平台运行中的技术平台、开发人员、平台运营人员与政策监管、ICT
    基础设施、用户群体之间的互动与变化，通过这种长时段的观察与追踪，建立起了对平台技术开发与运营的演进状况的初步了解。其次，我们在 2016 年以后着重关注新闻聚'
