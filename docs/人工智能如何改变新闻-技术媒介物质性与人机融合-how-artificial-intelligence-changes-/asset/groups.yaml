  - '[PAGE 2]


    # 总 序


    自 1997 年国务院学位委员会将新闻传播学提升为一级学科以来，中国的新闻传播学学科建设突飞猛进，这也对教学、科研以及学术著作出版提出了新的、更高的要求。


    继 1999 年中国人民大学出版社推出“21 世纪新闻传播学系列教材”之后，北京广播学院出版社、华夏出版社、南京大学出版社、中国社会科学出版社、新华出版社等十余家出版社纷纷推出具有不同特色的教材和国外新闻传播学大师经典名著汉译本。但标志本学科学术水平、体现国内最新科研成果的专著尚不多见。


    同一时期，中国的新闻传播学教育有了长足进展。新闻传播学专业点从 1994 年的 66 个猛增到 2001 年的 232 个。据不完全统计，全国新闻传播学专业本科、专科在读人数已达
    5 万名之多。新闻传播学学位教育也有新的增长。目前全国设有博士授予点 8 个，硕士授予点 40 个。中国人民大学新闻学院、复旦大学新闻学院等一批研究型院系正在崛'
  - '[PAGE 3]


    起。北京大学和清华大学的新闻传播学教育以高起点、多专业为特色，揭开了这两所百年名校蓬勃发展的新的一页。北京广播学院（后更名为中国传媒大学——编者注）以令人刮目相看的新水平，跻身中国新闻传播教育名校之列。武汉大学新闻与传播学院等以新获得博士授予点为契机所展开的一系列办学、科研大手笔，正在展示其特有的风采与魅力。学界和社会都盼这些中国新闻传播教育的“第一梯队”奉献推动学科建设的新著作和新成果。


    进入新世纪以来，随着以互联网为突破口的传播新媒体的迅速普及，新媒体与传统媒体的联手共进，以及亿万人参与大众传播能动性的不断强化，中国的新闻传媒事业有了全方位的跳跃式的大发展。人民群众对大众传媒的使用，从来没有像今天这样广泛、及时、须臾不可或缺，人们难以逃脱无处不在、无时不有的大众传媒的深刻影响。以全体国民为对象的新闻传播学大众化社会教育，已经刻不容缓地提到全社会，尤其是新闻传播教育者面前。为民众提供高质量的新闻传播学著作，已经成为当前新闻传播学界的一项迫切任务。


    这一切都表明，出版一套满足学科建设、新闻传播专业教育和社会教育需求的高水平新闻传播学学术著作，是当前一项既有学术价值又有现实意义的重要工作。“新闻传播学文库”的问世，便是学者们朝着这个方向共同努力的成果之一。


    “新闻传播学文库”希望对于新闻传播学学科建设有一些新的突破：探讨学科新体系，论证学术新观点，寻找研究新方法，使用论述新话语，摸索论文新写法。一句话，同原有的新闻学或传播学成果相比，应该有一点创新，说一些新话，文库的作品应该焕发出一点创新意识。


    创新首先体现在对旧体系、旧观念和旧事物的扬弃上。这种扬弃之所以必要，人文社会科学工作者之所以拥有理论创新的权利，就在于与时俱进是'
  - '[PAGE 4]


    马克思主义的理论品质，弃旧扬新是学科发展的必由之路。恩格斯曾经指出，我们的理论是发展的理论，而不是必须背得烂熟并机械地加以重复的教条。一位俄国作家回忆他同恩格斯的一次谈话时说，恩格斯希望俄国人——不仅仅是俄国人——不要去生搬硬套马克思和他的话，而要根据自己的情况，像马克思那样去思考问题，只有在这个意义上，“马克思主义者”这个词才有存在的理由。中国与外国不同，新中国与旧中国不同，新中国前30年与后20年不同，在现在的历史条件下研究当前中国的新闻传播学，自然应该有不同于外国、不同于旧中国、不同于前30年的方法与结论。因此，“新闻传播学文库”对作者及其作品的要求是：把握时代特征，适应时代要求，紧跟时代步伐，站在时代前列，以马克思主义的理论勇气和理论魄力，深入计划经济到市场经济的社会转型期中去，深入党、政府、传媒与阅听人的复杂的传受关系中去，研究新问题，寻找新方法，获取新知识，发现新观点，论证新结论。这是本文库的宗旨，也是对作者的企盼。我们期待文库的每一部作品、每一位作者，都能有助于把读者引领到新闻传播学学术殿堂，向读者展开一片新的学术天地。


    创新必然会有风险。创新意识与风险意识是共生一处的。创新就是做前人未做之事，说前人未说之语，或者是推翻前人已做之事，改正前人已说之语。这种对旧事物旧体系旧观念的否定，对传统习惯势力和陈腐学说的挑战，对曾经被多少人诵读过多少年的旧观点旧话语的批驳，必然会招致旧事物和旧势力的压制和打击。再者，当今的社会进步这么迅猛，新闻传媒事业发展这么飞速，新闻传播学学科建设显得相对迟缓和相对落后。这种情况下，“新闻传播学文库”作者和作品的一些新观点新见解的正确性和科学性有时难以得到鉴证，即便一些正确的新观点新见解，要成为社会和学人的共识，也有待实践和时间。因此，张扬创新意识的同时，作者必须具备同样强烈的风险意识。我们呼吁社会与学界对文库作者及其作品给予最多的宽容与厚爱。但是，这里并不排斥而'
  - '[PAGE 5]


    是真诚欢迎对作品的批评，因为严厉而负责的批评，正是对作者及其作品的厚爱。


    当然，“新闻传播学文库”有责任要求作者提供自己潜心钻研、深入探讨、精心撰写、有一定真知灼见的学术成果。这些作品或者是对新闻传播学学术新领域的拓展，或者是对某些旧体系旧观念的廓清，或者是向新闻传媒主管机构建言的论证，或者是运用中国语言和中国传统文化对海外新闻传播学著作的新的解读。总之，文库向人们提供的应该是而且必须是新闻传播学学术研究中的精品。这套文库的编辑出版贯彻少而精的原则，每年从中国人民大学校内外众多学者的研究成果中精选三至五种，三至四年之后，也可洋洋大观，可以昂然耸立于新闻传播学乃至人文社会科学学术研究成果之林。


    新世纪刚刚翻开第一页，中国人民大学出版社经过精心策划和周全组织，推出了这套文库。对于出版社的这种战略眼光和作者们齐心协力的精神，我表示敬佩和感谢。我期望同大家一起努力，把这套文库的工作做得越来越好。


    以上箴言，是为序。


    董 兵


    2001 年 6 月'
  - '[PAGE 6]


    # 推荐序


    # 重新发现新闻的物质向度


    2023 年上半年有两个话题引起新闻传播学术界和社会的关注。一个是以 ChatGPT 为代表的生成式人工智能突然出圈，引发人们对于传播产业变革乃至人类文明未来走向的关注。另一个是在高考志愿填报中，新闻专业值不值得报的问题，即新闻作为一个职业能否向新闻专业的毕业生承诺有前途的未来。巧合的是，这两个问题正是吴璟薇博士的新作《人工智能如何改变新闻》书名的两个关键词——人工智能与新闻。本书的系列研究从心理上回应了这两个公众关心的话题。


    中国的新闻学研究虽然历史悠久，但是在很长一段时间内主要还是局限在规范研究和政策研究范式，转向社会科学也是近年来，尤其是近十年方才借由媒介社会学蔚然成风。细分起来，近来中国的媒介社会学中又有两个支脉。'
  - '[PAGE 7]


    一个是传统的组织社会学，就是 20 世纪六七十年代经典的新闻编辑部研究，甘斯、塔克曼等人确立了媒介社会学黄金时代的研究范式，这些范式打开了新闻生产背后的黑箱，注重新闻组织内的行为惯惯及组织结构的影响。另一个支脉是文化研究，其代表人物是在国内颇受推崇的泽利泽，这个范式更注重新闻工作者对意义和文化的阐释。当然，这两个范式也并不完全互斥，只是侧重点不同。


    传统的媒介社会学诞生于大众媒介的黄金时代，尤其是电视的鼎盛时期，研究者并未对技术投以太多注意力。但是放到今天这样一个媒介技术日新月异的时代，对技术的忽略就成为致命问题。我们可以在本书中读到，技术不仅改变了新闻的呈现方式，作为基础设施，它还改变了新闻业的组织方式、运营方式，甚至颠覆了新闻、新闻中的价值观等基本概念。


    本书讨论了新闻中的时间，我个人正好也有一些初步观察。这里就以新闻中的时间问题做一点讨论。过去我们常把时间看成客观的机械时间或天文时间，是新闻内容的必要元素，新闻的时效性主要是人类需求的产物，但是却忽略了新闻中的时间观念其实是技术基础设施的产物这一问题。


    具体来说，报纸时代的新闻在时间观念上面向过去，关注曾经发生的事情，新闻是短暂的历史或历史的第一遍底稿，所以新闻工作者的技艺与布洛赫所说的历史学家的技艺相差无几。新闻要反映历史的动力、因果关系等有深度性的内容。人的书写与印刷机的复制要消耗时间，这个过程要经过思想沉淀，然后生产出一个有形产品。19
    世纪发明的电报在这个过程中也塑造了新闻的写作方式，出现了倒金字塔式写作、电报体，甚至从新闻界渗透到文学界，最终成就了像海明威这样的巨匠。


    但是电子媒介，尤其是广播与电视直播的兴起，导致新闻关注的重点转向当下正在发生的事件。新闻不再是完整的叙事，而是片段化的、零散的个人体验。新闻界不再需要提供一件成品，因为根本不存在定稿，只有'
  - '[PAGE 8]


    24 小时无休无止被转播的信号流。新的信息会不断“覆盖”或“迭代”前面的信息。电视的机器时间决定了新闻的时间体验与节奏。


    今天的数字新闻不仅更逼近切近的当下，还试图超越当下，关注未来发生的事情，充满着“或然”的猜测。这种时间更接近控制论中递归式的计算机时间，就像 ChatGPT，根据之前的文字，预测下一个字的概率，再将预测的结果纳入对未来的预测。预测决定当下，改变了线性的时间体验，甚至出现因在后、果在前的复杂时间。这种基于大数据的自证预言式做法被许恼称为“算法灾难”。


    机器除了给予我们面向未来的时间体验外，社交媒体上还出现了“无时间的新闻”。许多信息缺乏明确的时间提示，经常是若干年前发生的事情，加上个单人听闻的标题，就被当成当下的新闻收获一波流量。自媒体的“新闻考古”让人们在时间中穿越，丧失时间感。


    社交媒体和直播还带来海量的、碎片化的、个体化的感受、体验和情绪，就像普鲁斯特在《追忆似水年华》中所描述的那样，将某个时间点的私人体验与情绪无限放大，变成具有巴洛克风格的繁复的褶子。这种将无数私人体验排列在一起的所谓“融媒体新闻”的体裁，和之前少数新闻精英进行调查、核实后形成的理性声音完全不同，短期的、感性的情绪替代了理性的思考与判断，融合了技术时间的内容，形成情绪，最后传导到整个社会，形成今天的某种时代精神。


    概言之，数字技术导致当下新闻时间的体验变得多样化，不仅有线性的时间，还有非线性的时间，不仅有直播对当下时间的拉长或者缩短，还有面向未来的时间与无时的时间。时间变成了一个拓扑结构，可以被拉伸和折叠。这种新闻中的拓扑时间和传播基础设施的变化密切相关。


    这里只是举了一个时间的例子，在吴璟薇这本书中，还涉及技术对新闻诸多维度的影响。借用本书的表述，就是要探讨新闻的“物质性转向”。'
  - '[PAGE 9]


    当然，对新闻中物质性的关注是否真的能够构成“转向”，还需要观察，不过至少在揭示物质维度方面，这本专著确实是做了许多有益的探索。


    吴璟薇博士曾负笈德国，近年来在引进柏林学派的媒介研究理论方面用力颇勤，我也经常受益于她推荐的文献。读者可以在这本书中看到她出入于基特勒、克莱默尔的理论之间，同时涉及斯蒂格勒、西蒙·松、拉图尔、温纳、许煜等人的技术理论，并上溯到伊尼斯、麦克卢汉的经典理论，创新性地将它们与新闻生产结合在一起，打开了新闻研究的新思路。她提出要打破社会与技术的二元对立，超越技术决定论与社会决定论，从人与技术融合的角度来思考问题。器官学与驯化理论成为书中重要的理论资源。斯蒂格勒借助勒鲁瓦-古汉（Andre
    Leroi-Gourhan）的人类学理论提出，人的身体是在使用中不断演化的技术；反过来，技术也可以被视为人类的外化器官。从文化研究的角度来看，任何技术都不是外在于社会的，而是具有社会性的，人既要驯化技术，使其嵌入既有的文化系统中，同时技术也会反向驯化人的行为及其意义。


    从这些新角度看待技术，打开了理解媒介的新空间。媒介并不是我们通常所理解的物理存在，它首先是呈现与转化的中介，将抽象符号变成具体的可感知的物质或身体，它并不改变讯息本身，也不承诺消除传受双方的差异，只是像邮差一样通过讯息将双方连接在一起。媒介所传递的讯息既可能是信息，也可能是物质或能量。通过居间与中介，媒介重新组织社会，生成新的关系与实在。媒介随处可见，媒介化生存就是人的存在方式，只不过这种影响被中介的透明性所遮蔽了而已。


    从融合、共生、网络化的视角重新观察和思考媒介技术与新闻的关系，就会发现众多新的研究问题。吴璟薇在她的研究中已经呈现了数字技术与新闻生产的新变化，并且让我们对她在新闻扩散、新闻消费、新闻管理、新闻对社会的影响等问题上的研究产生了期待。'
  - '[PAGE 10]


    与此同时，仅仅理解技术的影响还不够，评估与判断新闻生产与消费中技术的后果也值得进一步挖掘。韩炳哲曾提出，数据不能代替叙事，因为数据中缺乏叙事，无法自动产生人的视角和价值。基于普通个体经验展示而形成的数据库与档案因为缺乏系统性，也不能代替传统由记者完成的深度报道。更重要的是，记者的报道要基于理性的判断与提问，这也不能在技术与数据中自然产生。以
    ChatGPT 为代表的生成式人工智能只能基于现有人类知识进行总结，是海德格尔所说的平均化的“常人”，无法超越这个知识体系去产生新的问题。因此，智能技术并不能完全取代真正的新闻工作，取代那些基于眼、口与脚的对真实世界的观察与叩问。我们自然会提出：数字技术在哪些方面会有助于公众理解与监督社会，在哪些方面又会阻碍上述行为？


    还有一个值得注意的问题，那就是包括人工智能在内的现有的数字技术，虽然令人眼花缭乱，但是背后均缺少不了资本与政治的支持。基于新自由主义或威权主义的数字技术究竟会在哪些方面促进公共性、哪些方面消弭公共性？数字技术和智能技术除了促进新闻的进一步商品化、媒体融合除了达到媒体市场化和政治宣传目标外，对新闻生产者、消费者及公众的价值是什么，除了把他们深度卷入新的数字劳动中外，还赋予了他们什么权利？这些问题也值得我们进一步反思。


    作为一位青年学者，吴璟薇博士的研究可能还存在如理论与经验的融合不够有机等瑕疵，但是无论是她提出的“新闻研究的物质性转向”，还是对于技术哲学和媒介理论的融合贯通，都充满了朝气与魄力，给中国新闻研究和传播研究注入了新的学术想象力，期待她未来的研究给我们带来更多惊喜。


    刘海龙


    2023 年 7 月 10 日'
