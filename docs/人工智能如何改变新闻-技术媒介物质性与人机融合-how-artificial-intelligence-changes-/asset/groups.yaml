    理引擎（process engine）、存储系统和资源虚拟化系统（resource virtualization）四个层次。对于大型平台来说，每个层次都涉及数量庞大的计算机/服务器群组。例如最早推出这种大型智能平台构架的谷歌，其在全球各地21个数据中心的服务器群组所安放的服务器数量虽然一直没有明确的正式数据，但是一般都估计已达到200万台以上。国内大型智能媒体平台虽然在计算数量级上无法与谷歌相比，但是复杂程度却远超
    Web1.0 和 Web 2.0 时代的各类网站。例如，新浪微博在 2012 年的服务器数量就已经超过了 1 000 台（访谈 Z1①），而当下头条平台的服务器也远远超过了
    5 万台（访谈 Z3）。然而，这些复杂的体系并没有脱离基特勒所提出的“在硅晶体物理学和冯·诺伊曼架构的双重条件下②”的计算机体系，大型平台的运行基础仍然是基于地址、命令和数据的“寻址、处理和存储”的媒介网络③。


    智能媒体平台最大的变化在于，在处理、传输和存储的三个环节都增加了人工智能。④就当下阶段来说，人工智能主要通过“深度神经网络”（deep neural networks）的多层次建模来实现“深度机器学习”（deep
    machine learning），从而实现具有一定智能的自动化处理，例如新闻智能生产与分发、人脸识别、图像识别、智能导航和设计自动优化等。这种构架以简化的方式描述，相当于在存储部分加入“数据智能化管理”的并行系统（例如常见的
    Hadoop HDFS，HBase 数据管理系统），在处理部分加入人适配


