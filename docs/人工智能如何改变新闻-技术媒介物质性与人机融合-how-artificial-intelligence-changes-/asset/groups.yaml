    # 第四节 智能新闻生产实践中的“人-技协同”


    智能新闻生产相较于传统的新闻生产，最大的不同是，算法不再仅以工具的属性，而是以主体的姿态参与其中。正如斯蒂格勒所认为的，技术源于人类先天的不足，两者并不彼此独立，也不是创造与被创造的关系，而是互为起源，共同进化。新闻从业者和算法技术以彼此可以理解的方式进行互动和合作，共同塑造了智能新闻生产的底层逻辑。①


    # 一、合作共生：“人-技协同”的实现途径


    智能新闻生产得以实现需要两个维度的物质性基础设施支撑。第一个'
  - '[PAGE 113]


    维度指算法需要服务器、电脑、电力等物质条件，即“信息和数据得以生产、存储与流动所需要的物质材料、技术结构、能源供给及其社会组织方式”①。这些材料不仅是智能新闻生产得以实现的必要条件，其中也包含了人与算法得以进行沟通的物质条件，如以电子屏幕为代表的交互界面等。第二个维度指广义上的数字技术。作为建构当代技术社会的核心特征，其已经成为跨越实体与虚拟、强调人和物的关系，具备嵌入性和基底性的基础设施。②在中国的语境中，可具体化为“以技术创新为驱动，以信息网络为基础”的新型基础设施，如以
    5G、物联网、工业互联网、卫星互联网为代表的通信网络基础设施等。③ 算法作为技术的一种，既属于此类基础设施，也是智能新闻生产领域的核心要素。


    在规则建构层面，算法技术为人设定了操作规则，人在遵从规则的基础上调整传统从事新闻生产的行为逻辑。在实践过程中，算法因其自身的局限性需要依托于人才能够使得新闻生产顺利进行，主要体现为人需要设定一系列规定和协议。如在信息获取环节中，算法若想抓取某一媒体平台的信息，可能需要与该平台做技术上的打通，还要与该媒体签订有关信息获取的协议。除此之外，人要设定算法的抓取规则、抓取平台和抓取内容的格式，否则即使算法抓取到了信息，也可能出现错误。例如，当某一企业所公布财报的行文格式与之前所公布的格式不同时，算法可能会发现其有所变动，但依然可能抓取到错误信息，这部分则需要人工进行调节。在新闻制作环节，目前阶段的算法更像是在做“填空题”，根据人设定的模板


