  - "[PAGE 177]\n\n将新闻价值概念化为新闻故事想要在媒体上发表并出现在显著位置需要满足的标准和条件。① 杨保军强调，新闻的价值主要指特定对象在新闻活动中特别是在新闻制作和传播活动中的作用和重要性。②\
