    # 第一节 基础设施与新闻的时空变迁


    不同媒介技术条件下的基础设施决定着新闻信息传播的速度，以及时间与空间的关联。时间性是基础设施的核心问题，并且决定着空间。① 纵观媒介技术的发展历程，我们可以清晰地看到信息传播的速度如何影响媒介的时间性与信息在地理空间层面的关系，以及时效性在新闻价值判断标准中的地位是如何变化的。出版和传递的周期决定了新闻的时间性。纸质媒介时代的新闻主要通过人力、马车、铁路、轮船等交通运输系统，传播速度慢，从事件发生到传播对象接收的过程也非常漫长，少则几日，多则几个月甚至半年。因此，电子时代以前的新闻生产建立在延迟性的基础上，事件从发生、报道到接收之间存在的时间差决定着新闻的价值。②
