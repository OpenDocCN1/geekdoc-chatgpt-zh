    照具体需要，标注工作还可能更加细节化，比如为了方便算法对文章进行情感分析和判断，标注时需要对依据文章的上下文、涉及情感和价值判断的关键词进行情感赋值标注、语义差异标注等额外标注。精细化的图片标注需要对图片内容仔细分区标注，最细致的视频标注甚至需要一帧帧标注视频内容的细节特征。同时，为了提高准确性，每一篇需要被标注的文章最好能被不同的数据标注员重复标注以形成对照。对于头条这样的新闻与信息聚合网站来说，大多数的信息要么来源于合作的新闻媒体，要么来自自媒体的用户自产信息。相对来说，数据搜集的难度不高，但是其他的流程步骤则不能省略，甚至因为追求更高的算法智能，头条的数据标注要求比很多其他平台要精细很多。


    由于标注工作需要高度的分析和判断能力，因此目前虽然很多数据标注公司或者智能媒体平台已经开发出具有一定智能的自动数据标注工具，但是总体上这个行业仍然非常依赖人工介入。同时，标注工作也是持续的。以头条等新闻信息平台为例，为了优化算法、应对层出不穷的新语汇和旧词新用等状况、适应新政策和新法规等，平台需要持续对大量的图文进行标注。一位前头条计算工程师在
