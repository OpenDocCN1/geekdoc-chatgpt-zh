    年年初），算法已经比较稳定，但是（数据标注）工作量还是很大。要提高算法的准确性，标注其实是越来越多的。（Z3）'
  md: "\n了既包含人也包含非人的行动体，通过与行动之间进行财产交换，人与非人共同构成了行动的共同体。在这个过程中，工业赋予非人在行动体聚合中彼此关联的可能性，这种聚合被人们称为机器或者机器人（automaton），其具有某种自主性并且遵循特定的能够被工具或者计算程序进行测量的规则。工业化社会到来之后，组织中原本由人组成的部分子程序被非人所代替，机器、工厂、工业和机器人便产生了。一开始非人加入组织而且扮演着顺从的仆人角色，然而随着工业化进程的不断发展，巨机器中对人的管理逐渐转移给非人，技术引入通过权力网络学习到大规模管理。在这种结构中，人与非人都共同为技术系统的有序运行而服务，人类不再具有自立的人格，更不能积极发挥职能作用，而只能成为一种消极被动、无目的的、服从机器操控的动物。①\n\
    \n① 芒福德. 刘易斯·芒福德著作精萃 [M]. 宋俊岭，宋一然译. 北京：中国建筑工业出版社，2010：346.\n② KITTLER F. BANZ\
    \ S. Platz der Luftbrücke: Ein Gespräch [M]. Cologne: Oktagon, 1996：21.\n③ 海德格尔.\
    \ 演讲与论文集 [M]. 孙周兴，译. 北京：生活·读书·新知三联书店，2005：12.\n\n很多人也在孤立地理解基特勒中期的“后人类主义”视角，认为至少从表面上看起来，在基特勒以技术媒介为主体的媒介网络中，人更多的是信息和媒介的传送、记录和保管者，是一种“机器话语处理的配件和工具的主体”。在这个意义上，基特勒比他自己所承担的“将海德格尔的技术概念转移给了媒介”②其实还更进一步，他将技术对人的“促逼”作用推向了极致。③\
    \ 但是实际上，基特勒对于媒介的网络关系主体性的阐述要复杂得多。基特勒本人的确主张，技术媒介的本体论特征即是基于处理、传输和存储数据和信息的网络，无论是书写、印刷，还是打字机、留声机和电脑，这些技术媒介都使得信息、话语和语言在空间得以处理、传输和存储。而在现代技术媒介条件下，技术媒介的强大的自主性将人变成了机器话语处理的配件和工具。但是，一方面，基特勒强调，技术媒介从来不是单独的媒介，而是由诸多媒介形成的网络。例如，“图书馆是被称为书的存储媒介的存储媒介”①。扩大来说，就“被称为书的存储媒介”来说，古登堡式印刷机、书、运输售卖系统、书箱、家庭书架或图书馆（甚至是制造这些技术媒介的其他技术媒介和工具），共同组成了一个技术媒介网络。在此基础上，小到雅克·拉康授课时由录音机、耳机以及打字机组成的课程记录媒介网络②，大到一个国家阶段性的总体话语网络③，都在模拟媒介网络的基础上得以形成。从基特勒的媒介网络主体视角进行分析，人的绝对主体地位如果不是从来都未曾存在的话，那么至少在机械媒体时代已经大部分消融。另一方面，基特勒毕竟是深受海德格尔影响的媒介理论家，这种后人类主义的叙事视角并不能完全掩盖他的海德格尔式的关系本体论视野，一种基于“共在”的视角。如果统合基特勒前后期尤其是后期“文化技术”的学术思想来看，那么媒介技术本身显然不是唯一的决定因素：技术需要在与人组成的媒介网络之中才能发挥作用。\n\
    \n① KITTLER F. Towards an ontology of media [J]. Theory, culture & society, 2009,\
    \ 26 (2-3): 23-31.\n② KITTLER F. Draculas Vermächtnis; Technische Schriften [M].\
    \ Leipzig: Reclam, 1993: 1-57.\n③ KITTLER F. Discourse networks 1800/1900 [M].\
    \ Stanford, CA: Stanford University Press, 1990.\n\n然而，无论如何，部分基于巨机器理论以及基特勒中期理论的阐述在一定程度上给予人们“数字媒介”的主体性正在全面侵蚀人的主体性的错觉。鉴于此，之后的众多的媒介与传播理论家从多个角度对其进行了补充。那么下文就简述德国媒介理论从“媒介性”\
    \ / “中介性”角度对于传播物质性的重构，并基于这种重构来补充论述智能新闻平台在用户使用与消费层面的关系主体性问题。\n\n## 第三节 智能媒介网络与人的境况\n\
    \n基于大数据与人工智能的智能技术的广泛应用正在全面重塑和再造新闻与资讯的生产、分发、用户互动与评价等全部流程环节，并对当下的媒介状况与社会生存情境产生复杂而深刻的影响。智能技术的推广和运用多处于对新技术的监管相对宽松的情况下，主要经由技术演进的自主推动，或经由用户对新技术的自发或被动员起的需求驱动而急速发展，并未经过广泛而长期的讨论和论证，因此也造成智能技术迅速切入原有的媒介系统，并逐渐形成占据媒介系统主导地位的局面，引发学界众多的讨论与担忧。在第二节对人与技术的关系进行系统讨论的基础上，本节主要聚焦由处理、传输和存储等三个环节所组成的智能媒体时代新闻生产的宏观流程，从基特勒所提出的“媒介网络”的视角出发，将智能新闻生产中的人与技术因素——除了编辑记者等传统的新闻生产者外，还包括数据存储系统等硬件设施和打标签的“隐形工作者”、内容审核人等——都共同纳入考量范畴，更加系统而深入地探索智能新闻生产背后的人与智能技术之间的关系，从而拓宽我们对新闻生产与媒介网络的认识。\n\
    \n### 一、消融的主体性？智能媒体中的人与机器\n\n在技术高速发展的时代，社会媒介系统的结构与权力关系也发生了激烈的变化，并同时在迅速改变着社会结构、社会权力构架和利益分享分配机制，这引致学界和媒体深刻的忧虑和大量的批评。其中，一般伦理学取向的研究对于智能技术在新闻的自动化生产、信息的智能化核查与分类、用户“定制化”推送、评价自动化与“算术化”等多重层面所造成的潜在或者显在的广泛伦理问题进行揭示和批评，例如对虚假新闻、商品化新闻、信息泄露、个体与群体权利侵犯、社会极化加剧、自动评价偏差等问题的批评①；而政治经济学取向的研究则追问智能技术所带来的资本对媒介的控制、数字劳动的不平等性、数字鸿沟的扩大与社会分化的加剧等议题②。上述两种分析路径初看起来存在着巨大的区别，但其实二者都共享同一种视角：智能技术的广泛应用呈现出较高的自主性和支配性，从而在社会后果层面危及人类的主体性地位。因此，智能技术的下一步运用，需要时刻从“以人为本”的主流价值观出发，对技术的自主性和支配性需要即刻加以众多的限制，以免引发更多的问题。\n\
    \n① 陈曦。机器新闻写作的现实困境及对策研究 [D/OL]。长沙：湖南师范大学，2018 [2023-02-18]。https://kns.cnki.net/KCMS/detail/detail.aspx?\
