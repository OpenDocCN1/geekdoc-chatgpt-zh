    ### (三) 中国语境下的数字新闻价值探讨


    除受技术变迁的影响外，新闻价值还是媒介环境中政治、经济、文化等多重因素的产物，这使中国语境下的新闻价值研究有着独特意义。中国新闻从业者在数字时代的新闻价值判断，一方面接受着媒介技术革新的冲击，另一方面又因独特的媒介体制和媒介生态，折射着包括政府、党媒、商业平台、受众在内的各方力量博弈。在数字技术加速发展的情况下，西方传统新闻价值理论体系与中国新闻实践间的张力也日益凸显。


    西方传统新闻价值更加强调冲突突出、灾难以及矛盾，负面新闻通常涉及揭露企业的腐败行为或政治丑闻，注重对应媒体作为“第四种权力”在西方民主社会中对社会和政府的监督作用①；而中国受到儒家文化中“和”与“仁”优先价值标准的影响，更加重视集体意识和社会意识，以及国家形象和媒体的政治导向作用，因此，社会主义社会中的新闻作为党和政府的“喉舌”，其价值往往更注重反映正面、健康、和谐、光明的一面。②
    因此在数字时代新闻价值要素的探讨中，中国学者在关注技术变迁的同时，还聚焦商业平台参与下价值取向多元化的媒介生态，强调新闻业维护社会效益与参与社会治理的责任，展现出更明显的价值与实用导向。


    具体而言，中国新闻往往更强调沟通和教化。③ 中国新闻实践自古习惯以传者为本位，将政策宣传和思想教育作为新闻价值选择的主要依据。④ 因此“沟通性”，即新闻是否能与已有的舆论信息形成沟通，在中国语境下成为一种核心价值导向。面对网络平台上信息的冲突与对抗，新闻的“沟通性”或“共情性”意在化解社会矛盾、促进和谐。中国新闻业还通过设立新闻类奖项等，对包含“爱国主义”“自我奉献”“敢于牺牲”等价值引导要素的新闻给予肯定。⑤


    近年来，建设性理念也得到大量中国学者的关注。“建设性”指以积极的、具有建设性的方式来建构新闻。⑥ 通过强调这一价值要素，人们反思对新闻社会角色和功能的认知，考虑如何用方案导向和指导性的报道代替冲突性故事，从而更好地履行媒体服务公众的职能。①
    建设性的核心概念起源于西方新闻运动，是对传统西方新闻价值中“消极取向”的纠偏和补充，呼吁培育积极的舆论氛围，避免加剧受众的负面情绪以及社会对立。② 在中国传统文化、马克思主义新闻观，以及新闻社会责任与功能导向的协同影响下，建设性发展出了独有的中国范式。③
    建设性与正面性在表现上有相似之处，但前者强调面向未来的问题解决导向，后者则强调新闻中的积极色彩。④


    伴随着社交媒体的普及，“实用性”也成为数字时代广受关注的新闻价值要素。“实用”的新闻指那些更加关注受众生活需求、更生活化、更实用的相关新闻，能为受众提供专业性、经验性、建议性的信息，帮助受众更好地处理日常问题，比如网上购物、在线教育、政策指南等，为人们的生活提供便利。⑤
    杨奇光和王润泽将“实用性”新闻定义为具有明显的实用导向、能发挥公共服务作用的新闻，比如新闻机构发布的 Top10 名单、榜单和技巧等。⑥


    ## 二、数字智能时代新闻价值标准的设定


    “数字时代新闻价值要素重探”研究项目从 2021 年 12 月中旬开始启动，至 2022 年 12 月中旬完成，主要采用德尔菲法（Delphi method），对
    36 位中国各类新闻媒体一线工作者进行多次函询，结合深度访谈，以探索数字时代新闻价值要素发生的变化。


    德尔菲法又称专家咨询法，自 20 世纪 50 年代由美国兰德公司开创以来，已广泛应用于几乎所有的社会领域。① 这一方法的特点是专家组成员的权威性和匿名性、预测过程的有控趋同性，以及预测统计的定量性。②
    具体而言，通常经过若干轮对专家的函询，将其观点进行聚焦、归类和具体化，最终专家会达成相当程度上共识并将其作为研究结论。


    由于新闻从业者进行新闻价值判断的依据常常出自“直觉”③ 而难以具体说明，这里通过对接受函询的新闻工作者的“工龄”“工作单位”和“新闻领域”进行筛选，采用主观分析法判断其在新闻价值判断领域的“权威程度”，而非德尔菲法在公共卫生等领域应用时的量化加权。


    ### (一) 函询对象


    考虑到“新闻价值”的特殊性，我们将函询对象定为中国一线新闻工作者，包括将“新闻价值判断”作为日常工作内容的记者、编辑、编导、内容运营/策划、摄影/剪辑等。函询对象的选择标准如下：（1）工龄超过一年的正式员工；（2）工作内容包括采写编发等新闻业务；（3）发布新闻内容面向中国大陆受众。基于这些标准，最终选定了
    36 位新闻工作者（见表 5-1），平均工龄约为 5 年。为保证函询对象的广泛代表性，其中 11 位来自中央媒体机构，如中央广播电视总台、新华社、《中国日报》等（A1～A11）；13
    位来自地方媒体机构，如《四川日报》、《湘声报》、吉林广播电视台、云南广播电视台等（B1~B13）；12 位来自商业化内容平台或相关业务外包公司，包括凤凰网、新浪微博、字节跳动等（C1~C12）。


