  md: "\n一大难题。大数据只有在搭配了智能技术之后才拥有了分析和趋势预测能力，所建构的模型也是传统的统计分析方法难以建构的，这正是数据的相关性所具备的特点。所以，在海量信息中进行新闻生产和传播都必须建立在关系的基础上，信息数据池和行为数据池在关系建立的过程中不断创造着内容意义和新价值。\n\
    \n那么，数据之间的关系如何建立，不同的数据如何储存，结构如何，则成为物质意义上影响算法关联的重要因素。不同的结构决定不同的关系，而平台的基础设施架构决定着数据的结构与关系。社交媒体普及之前的互联网时代，用户不参与信息生产，因此数据的来源比较单一且主要基于特定的计算机（如\
    \ HTML 等）语言，其本身就是结构化的，数据处理只需要关系数据库管理系统（RDBMS）即可。但是社交媒体运用大范围内拓展的数据的生成和来源渠道，这些来自人们日常生活的原始数据通过网络、手机和芯片等基础设施得以传输和储存，除了部分结构化数据外，主要是非结构化或者半结构化的，这些结构形式超出了原有系统的管理能力，而且数据的数量又进一步膨胀，对基础设施也提出了更多要求——需要大型处理系统以及分布在各地的计算机组群。①\
    \ 所以 Google 采取了大规模分布型文件管理系统，以及在此基础上开发出的 Hadoop 系统。在社交大数据中建立关联，需要来自全球范围内的大量资金和技术支持，以及遍布全球的互联网通信设备，这进一步推进了全球范围内的关联。\n\
    \n互联网与数据所建构的不仅只有一个网络，通过不同的算法机制可以制定不同的关系，从而建构多样的网络。所以数字智能时代的数据结构与相关关系是丰富多彩的，新闻相关性也因此变得更加多元。同时，因为算法，这些关系可以被计算和被操控。智能新闻的数据物以分析性和连接性为前提，通过数据所呈现出的兴趣、身份和行为特征，互联网在新闻中所造就的关联不仅仅是象征性的，而且是数字化且可计算的。如果休谟（David\
    \ Hume）所说的万事万物间存在的七种关系，包括相似性、统一性、空间和时间、数量、性质、对立性和因果关系是基于象征的一种话语关系（discursive relation）的话，那么许煜则强调在数字智能时代这些关系已经转变为一种存在关系（existential\
    \ relation）。前者只能以我们对现象的感知为前提，是一种更加基于人体器官和认知为基础的关系；而后者则通过关系来描述事物并与其相互关联，这是基于数字智能时代的技术及物质性特征而言的。数字智能时代基于数据的存在关系所形成的新闻相关性，更加具有一种媒介本体论的特征。①\
    \ 对新闻内容生产者而言，数码物的可计算性实现了对新闻内容时长和接收行为的计算与控制，能够从个体层面更加精确地把握新闻的特征。当然，这种数字技术带来的可控性也成为西方新闻传播理论所反思和批判的对象，甚至被认为会损害媒介的公共性。②\n\
    \n① COTÉ M. Data motility: the materiality of big social data [J]. Cultural studies\
    \ review, 2014, 20 (1): 121 - 149.\n\n① 许煜．论数码物的存在 [M]. 李婉娴，译．上海：上海人民出版社，2019：127．\
    \  \n② VAN DIJCK J, POELL T, DE WAAL M. The platform society: public values in\
    \ a connective world [M]. New York: Oxford University Press, 2018；范·迪克．连接：社交媒体批评史\
    \ [M]. 晏青，陈光风，译．北京：中国人民大学出版社，2021．\n\n数字智能时代新闻的相关关系，从媒介本体论的角度来说其实是一种客体间性关系。它打破了传统新闻生产中以人为核心的主体性视角，而将作为技术物参与到新闻生产和传播中的数码物与基础设施纳入考量范围。数码物所建立的关系网包含了一切周遭环境，正如脸书个人页面或微信朋友圈一样，在社交媒体背景下，这些关系几乎决定了关于我们的一切，从朋友、日常生活到时空关系（时间轴、发布地点标记）等无所不包。新闻的相关性再也不仅仅是新闻从业者个人的判断，而是存在更加多元的可能，这也是导致新闻概念泛化的重要原因。而同时，基础设施创建了人与机器可以通过物质化关系进行交互的环境，技术的逻辑也参与到新闻生产和传播过程中，人也不再是唯一的决定因素。所以，数字智能时代的新闻价值不仅仅需要关注人，也要关注媒介技术、基础设施和数据在其中的作用。在技术与人的“共生”中，“智能推荐系统和用户在不断改变和‘驯化’对方”①。\n\
    \n## 第三节 时空与相关：重构数字智能时代的新闻价值\n\n在互联网与社交媒体普及的当下，大量的新闻接收都是通过手机 App 而进行的，用户也主要依托算法推荐来阅读新闻，甚至觉得算法“比自己更了解自己”。手机或电脑装置、无线网络和光纤等基础设施打破了新闻事件的发生、生产和传输之间的实践与空间距离，并且通过推荐算法产生更多的相关新闻推送给用户。新闻的时效性在降低，而相关的程度与范围在不断加大。以上这些都是媒介技术发展及基础设施变迁所导致的结果。传统新闻的生产和传播主要以新闻生产者为中心，新闻价值也主要是建立在人的认知和经验基础上的判断，并据此对外界进行解释。然而，数字智能时代的新闻生产已经实现了人与技术的协同运作，人的逻辑和技术的逻辑共同参与到新闻价值的判断中。时间与空间、人与事物在基础设施之上形成的聚合而产生了一种新的时空关系及客体间性，虽然人的主体性地位在其中仍然扮演着重要角色，但是技术所带来的影响已经无法忽略。\n\
    \n在融合了传统新闻对人的主体性和对内容的关注下，媒介本体论进一步引入人作为客体物存在的数据以及基础设施，并以人与技术、内容与物质的多重维度来重新思考媒介技术变迁对新闻产生的影响。技术“充满了“人”，它们将人类的专业知识具体化，并发挥着促进人类目标实现的作用；同样，技术也充满了时间①。因此，媒介的发展以及其中所蕴含的空间、时间和关系的变迁，都属于技术性话题，也都是以基础设施为基础而建立的关系所产生的结果。媒介的发展一直与基础设施相关，各种数字终端、新闻媒体、社会机构及相关政策不仅仅决定着新闻的内涵与价值标准，更是人们栖居的环境②。而长期以来，新闻传播研究却将这个与我们无法分离却又藏匿起来的环境忽略了。媒介本体论从物质性的视角来探讨基础设施对媒介的时间、空间和相关关系，并进一步探讨技术对新闻价值判断标准带来的影响。基础设施决定着新闻信息的传播速度，继而影响媒介的时间和空间关系。新闻本身与时间的观念高度相关，更不用说印刷出版物的周期与日历同步。但是这些都发生在信息传播速度较慢的时代，新闻的生产和传播之间存在延迟，而时间从发生、报道到接收之间的时空差异产生了新闻价值。人类进入电力时代以后，电报、传真、电话、广播、电视以及今日的互联网，都实现了信息的光速传播，符号的传递已经打破了地理的局限，传播和交通首次发生了分离。技术造就了一种新的时间和空间体验，新闻的延迟性和空间距离消除了，实现了“实时”传播。\n\
    \n但是，媒介本体论强调由于物质的中介性所带来的效应。也就是说，传播的参与者通过基础设施产生了关联，即使传播速度很快以致人们无法感受到时间差异，但二者间的空间差异仍旧存在，无法实现瞬时。从物质性的视角看，这种实时也并不是基于人的感知，而是“选址”的结果。通过数字地址的分配，数字智能时代的传播建构了一种新的空间位置。然而，长期以来基础设施沉默无言，隐藏在新闻传播者与接受者背后，是媒介自身所具有的媒介性特征，也只有当发生故障、信息的链接断裂和停止时，人们才能意识到媒介的存在。①\
    \ 这便是约翰·彼得斯（John Durham Peters）在《奇云》中所说的“基础型倒置”：只有发生故障才能让隐藏之物得以从幕后显现，虽然情况不妙但事物的本质却能够得以彰显。②\
    \ 在这里也一样，我们强调基础设施本身因连接而产生的空间差异并不会因为信息的高度传播而消失，这是从本体论的角度去彰显媒介的中介性特征，而这一特征正是媒介原本有的特质，也是基础设施在新闻传播中产生影响的机制与根源。“本体论只不过是被人们忽略的基础设施而已。”③\
    \ 特别是在当前网络技术和智能传感器有了突破性发展的前提下，我们有必要打破人类基于身体与器官所建立的认知与媒介效果，重新审视作为物的基础设施和数据在新闻传播过程中的作用，以及它们在时间和事物之间所建构的关系。\n\
    \n同时，基础设施实现了人与技术的融合，新闻内容被转化为数据，并进行标签分类，进而根据语义关系在新闻信息以及信息和用户之间建立关联。计算机语义关系网所产生的关联范围大大突破了传统新闻生产中新闻事件基于重要程度、地理和心理因素所建立的相关关系。正是因为有了建立关系的语法规则与推荐算法，海量的数据才具有意义，所以数据在本质上仍是一种关系。建立在数据意义上的关系摆脱了传统新闻生产中基于人的主体性所建立的关联，转而强调客体物之间所形成的客体间性。新技术在新闻生产和传播过程中的不断渗入已经使技术逻辑不可忽略，因而数码物和基础设施等建立的关系网是一种关系形式多元，并且将人与事物都共同纳入其中的网络。智能新闻的相关性是人与技术、主体与客体共同作用的结果。但是也因为基础设施和数据本身的可计算和可操作特征，使得新闻更容易受到控制。这些都是我们在理解数字智能时代的新闻价值时需要考虑的因素。\n\
    \n① 克莱默尔，吴余劲，叶倩，等. 作为文化技术的媒介：从书写平面到数字接口 [J]. 全球传媒学刊，2019，6（1）：18-27.  \n② 彼得斯.\
    \ 奇云：媒介即存有 [M]. 邓建国，译. 上海：复旦大学出版社，2020：41.  \n③ 同②:44.\n\n媒介本体论视角将媒介的物质性和中介性特征引入新闻价值要素的分析中，共同强调人与技术在智能新闻生产和传播中的重要作用，以及技术变迁所带来的新闻价值变化。无论在何种技术条件下，新闻都具有媒介的中介性特征，同时其物质性特征也会影响着传播效果。新媒介技术的迅速发展与普及将原本隐藏在传播参与者中间的技术物显现出来，当下在讨论新闻价值时，虽然人的经验与判断继续占有重要地位，但是技术的因素却不能忽略。其实，无论哪个时代、何种技术环境，媒介技术都或藏匿、或显现地在新闻传播中发挥作用，决定着人们的境况。数字智能时代将技术因素以媒介本体论的视角进行解析，进而探索新闻价值变迁的机制，能够揭示众多之前研究中被忽略但却十分重要的因素，从而加深人们对媒介的认知，以及技术在媒介与社会发展变迁中所起到的作用。\n\
    \n## 第四节 数字智能时代新闻价值要素重探\n\n伴随着媒介技术和新闻生产的创新，传统的新闻价值观在新媒体语境下生发出新的内涵，新闻价值标准持续引发争议和讨论，并被不断调整、扩充与延伸，这使得“新闻价值”成为学界与业界常谈崭新的焦点议题。数字智能时代的新闻生产、分发及消费的方式变迁使得传统新闻价值要素出现解构趋向。如因为信息传播速度大为提升，“时效性”转变为“即时性”，“接近性”被消解转化为智能技术支持下的地理与人际关系的相关，并伴有个人用户的“定制性”特征。此外，伴随着更多非专业实践主体参与新闻生产流通并影响整个新闻生态，“可分享性”“猎奇性”“透明性”“共情性”“建设性”等新规范也被提出。\n\
    \n在前文通过媒介物质性特征和技术基础设施的影响进行理论分析的基础上，在此我们结合德尔菲法来探索微观新闻实践中的新闻价值标准，一方面将新闻价值议题放入媒介技术变迁的视角下来探寻智能技术如何影响新闻价值，另一方面也考虑到中西文化中新闻价值判断的差异，来进一步探讨技术变迁是否能够带来更多新闻价值判断方面的共识。具体针对以下问题展开研究：\n\
    \n- RQ1: 传统新闻价值在数字和数字智能时代出现哪些转向？\n- RQ2: 哪些新兴新闻价值在中国新闻实践中得到认可？\n- RQ3: 哪些因素影响新闻工作者对新闻价值的判断？\n\
    \n## 一、新闻价值的构成要素及其变迁\n\n### (一) 新闻价值的定义及拓展\n\n“新闻价值”是中西方公认的重要基础性新闻学概念，而学术界对新闻价值的定义一直存在着不同的看法。“新闻价值”一词最早由沃尔特·李普曼（Walter\
    \ Lippmann）在 1922 年提出，他认为事件的一些具体特征或新闻要素使其具有新闻价值。① 在此基础上，过往学者对新闻价值的定义可以分为以下两类。第一类认为新闻价值是从业者在日常新闻实践中的选择依据，往往强调专业化的新闻生产流程以及记者在其中的主体地位。如德国学者昆奇克（Michael\
    \ Kunczik）和韦伯（Uwe Weber）认为，新闻的价值是选择新闻的标准。② 加尔通（John Galtung）和鲁格（Mari Holmboe Ruge）\n\
    \n① LIPPMANN W. Public opinion (Vol. 1) [M]. New Jersey: Transaction Publishers,\
    \ 1946.\n② KUNCZIK M, WEBER U. Public diplomacy and public relations; advertisements\
    \ to foreign countries in Germany; results of a content analysis [J]. Journal\
    \ of international communication, 1994, 1 (2): 18 - 40.\n\n将新闻价值概念化为新闻故事想要在媒体上发表并出现在显著位置需要满足的标准和条件。①\
    \ 杨保军强调，新闻的价值主要指特定对象在新闻活动中特别是在新闻制作和传播活动中的作用和重要性。② 白红义在重访新闻价值的研究中指出，新闻价值是一系列决定新闻被选择或排除的标准，记者在日常新闻生产中运用这些标准进行新闻的判断、选择、生产和呈现。③\
    \ 第二类则侧重新闻事实本身能够引起公众兴趣的特征，如刘建明强调“对受众的有用性”④。在西方新闻业刚进入中国之际，我国著名新闻教育家徐宝璇便提出“新闻之价值云者，即注意人数多寡和注意程度深浅之问题也”⑤。李良荣在《新闻学概论》一书中的将新闻价值定义为“新闻事实本身所包含的能够引起公众共同兴趣的素质”⑥。陈冉则总结两种视角，提出新闻价值是新闻记者衡量和甄选事实的依据，指记者所报道的新近发生的事实引发受众注意力的程度以及向受众传达思想的力度；程度和力度越大，新闻价值就越高。⑦\
    \ 无论哪种定义，它们大多体现出新闻价值研究的实用主义倾向⑧——新闻价值的概念定义被转化为具体的、有操作意义的要素或标准，对新闻生产与传播的实践具有直接指导作用。\n\
