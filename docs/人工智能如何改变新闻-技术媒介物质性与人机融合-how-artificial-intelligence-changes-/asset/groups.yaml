    \ 至 90 年代的发展中期，这一时期比较有代表性的研究如哈特（Hardt）③ 和皮提尔（Pietilä）④ 的社会网络研究；（3）20 世纪 90 年代以后的发展成熟阶段，主要探讨新媒体时代的传播模式，以及记者和媒体（包括传统大众媒体和新媒体）在传播中的角色，代表人物包括瓦格纳（Wagner）⑤\
    \ 和宣哈根（Schönhagen）⑥。\n\n中介社会传播模式是德国学者在 20 世纪 70 年代针对大众传播理论所提出的，经过瓦格纳和宣哈根的发展，更加符合互联网时代新闻传播互动强、传播主体多元和多级传播的特点。在此基础上，我们融入数字时代的新闻的数据化特征，将新闻生产和传播的过程看做媒介技术中介下的数据流动过程，从而分析在中介传播模式中作为物的新闻数据如何将人与技术勾连起来并建构出新闻生产的中介系统，以及数据如何在不同新闻传播参与者之间流动，从而构建更加平等、互动的多元新闻内传播模式。如图\
