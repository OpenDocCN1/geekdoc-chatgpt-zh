    成的有机整体如何进行组合，又是如何运作的。


    人与机器在工厂进行生产时，又是如何协同劳作的？对此马克思提出了技术与劳动的辩证法，阐明在机器大生产中人与技术互相改变、彼此适应的过程。他在考察了工业化大生产中劳动工具是如何由工具转变为机器的之后，认为人与机器被组织成一个有机系统，这种“新的技术”对传统技艺和手工业生产造成冲击。①
    作为劳动者的人的作用不仅没有区别，而且可以被替换。但是，技术也体现了“劳动者对各种工作的适应能力，从而使之最大限度地发挥各种才能”。通过器官的比喻，马克思将工具与机器在本质上进行了区别，认为人因为受到器官数量的限制，因此可以使用工具的数量是有限的（如传统纺车需要工人双手操作，因此一个工人可以操作的纺车是有限的），但是珍妮纺纱机通过将纺锤并排连接，使一个工人可以同时操作
    12～18 个纺锤，使得人类的劳动摆脱了器官的限制。此时的技术，作为人的器官的延伸而拓展了劳动能力。但是，人与机器共同组成的系统里需要进行技术的统一，这样多个机器才能组成同样的器官来协同运作。


    与马克思同时代的德国技术哲学家和地理学家、西方现代技术哲学第一人恩斯特·卡普（Ernst Kapp）也提出“器官投射说”（organ projection），认为技术在形状、结构和功能上是人的器官的投射和外化，通过投射的过程人类实现了与外部世界的融合和自我认知。②
    根据身体和器官的外形与功能在自然中创造出人造的技术物，这些技术物具备了作为有机物的器官的功能，人与自然界、有机体与无机体以及人体器官和人造机器被关联在一起，人因此也成为万事万物的尺度。③
