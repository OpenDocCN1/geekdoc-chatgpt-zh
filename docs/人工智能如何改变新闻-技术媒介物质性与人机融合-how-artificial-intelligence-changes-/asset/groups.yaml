    但是基特勒毕竟是深受海德格尔影响的媒介理论家，他并不单纯地认为媒介作为一种限制性的“外部性”来“决定人的处境”，从而使得人的主体性被压制甚至处于奴役之中。如上所述，基特勒确实采取了一种非常典型的“后人类主义”的叙事视角，在他的论述中，物质意义上的媒介网络（比如由录音机、耳机以及打字机组成的课程记录的媒介网络）占据了叙事的主线。在这样的媒介网络中，人本身并不是媒介网络的主角，而更多的是信息和媒介的传送、记录和保管者，一种“机器话语处理的配件和工具的主体”。在这个意义上看，他的确如他自己所坦承的，“将海德格尔的技术概念转移给了媒介”①。


    然而，这种后人类主义的叙事视角并不能完全掩盖他的海德格尔式的关系本体论视野——一种基于“共在”的视角。基特勒从关系本体论出发，非常强调技术、媒介与身体的融汇对于个体和群体存在情境的创造作用。他始终认为媒介技术在不断发展的过程中与人融合成一个运作网络，也将“所谓的人分裂成生理结构和信息技术”②。例如，数字媒介技术通过声光电等多媒体形式，将原本在书写时代被分割开来的不同感官领域整合在一起，替代了人的中枢神经系统，也“模糊了人与机器之间的界限”③。通过技术的更新迭代，“人和它的模拟者联合起来了”④，机器通过不断学习来改进自身程序，以不断贴合人的需求，也因此变得更加智能化。因此，媒介技术物质性能够部分消融人的主体性，但是从本体论的角度来看，人、物、媒介技术关联本身就处在一种关系网络之中⑤。所以在基特勒的媒介本体论中，技术并非唯一的决定因素，而需要在与人组成的媒介网络之中才能发挥作用。


    新闻平台的数据化也给理解新闻生产中人与技术的关系带来了挑战。然而，人与技术的冲突并非数字新媒体时代的产物，而是从机器开始大规模进入人类生活的时候就已经被注意到了。尤其伴随着工业化的发展，技术的自主性特征也越来越突出。马克思在《资本论》中将工厂描述为“一个由无数机械的和有自我意识的器官组成的庞大的自动机，这些器官为了生产同一个物品而协调地不间断地活动，因此它们都从属于一个自行发动的动力”①。在技术系统中，虽然工程师通过程序等手段控制着机器，掌握着程序的实施与更新，但技术却能够实现自治、独立、不为外部法则或者力量所支配。技术一旦投入使用，便能够形成自我生成（self-generating）、自我延续（self-perpetuating）和自我编程（self-programming）。②
    虽然人与技术都同时参与到新闻生产中，但在算法和交互界面的共同作用下，无论是参与编程的工程师还是最终进行审核的内容把关人员，都需要遵循系统的技术逻辑：工程师的代码必须按照特定的计算机语言和逻辑进行，而人则需在算法出现问题的时候进行审核，协助系统更新以保证系统更加准确有效地运行。


    从这个角度来看，数字技术下的新闻生产体系已经成为一个“巨机器”（megamachine），无论是人还是技术都需要服从客观的秩序、目标一致、精确、守时、多产、快速高效和标准化。在巨机器中，技术是被社会地建构起来的，是一种社会关系。③
