    ② SPRENGER F. Temporalities of instantaneity: electric wires and the media of
    immediacy [C] //JOHN D P, FLORIAN S, CHRISTINA V. Action at a distance. Minneapolis,
    London: University of Minnesota Press，2020：1 - 28.

    ③ 彼得斯·奇云。媒介即存有 [M]。邓建国，译。上海：复旦大学出版社，2020：36.

    ④ ACLAND C R, DOURISH P, HARRIS S, et al. Signal traffic: critical studies of
    media infrastructures [M]. Illinois: University of Illinois Press，2015：1 - 30；彼得斯·奇云：媒介即存有
    [M]。邓建国，译。上海：复旦大学出版社，2020：37 - 38.


    从与媒介相关的基础设施的形式上看，19世纪之前的新闻传播主要依靠人力与马通过道路交通来实现连接，不仅速度慢，传播周期也比较长。然而进入电力时代之后，遍布各地的电缆将不同的时间和空间连接起来，由于传递速度非常快，传播者和接受者之间原本存在的时间和空间差异也就消失了。智能时代到来之后，基础设施在新闻传播中的作用显得更加突出。互联网的普及使得信息传达世界各个角落成为可能，而建立在平台化基础上的智能新闻生产和传播，都需要通过基础设施平台来实现新闻内容的数据化及数据的收集、存储和运输，因为平台就是用来组织用户的互动的可编程的基础设施（infrastructure）。①
    多种来源的新闻内容在被转化为数据之后，通过基础设施传入平台的数据接口在平台内进行整合。媒介的基础设施在此过程中将人与技术聚合起来，按照因果和相关等逻辑关系，通过计算机语义关系网，在内容生产者、传播者、接受者之间建立关联。大数据和人工智能的发展也可以被看做微处理器和网络环境中连接的结果，从而保证了算法能够以最小的时间间隔在全球信息网络上运行。②
    基础设施对新闻价值的影响主要体现在两种维度：首先，基础设施连接着不同的地理空间并决定着新闻的传播速度，由此能够影响新闻的时效性，以及由于传播速度所导致的时间和空间关系的变迁；其次，基础设施还通过算法将不同的新闻内容以数据的方式建立起关联，影响着新闻价值中的相关性。


    ① VAN DIJCK J, POELL T, DE WAAL M. The platform society: public values in a connective
    world [M]. New York: Oxford University Press, 2018: 9.

    ② STINE K, VOLMAR A. Infrastructures of time. An introduction to hardwired temporalities
    [J]. Media infrastructures and the politics of digital time. Essays on hardwired
    temporalities, 2021.


    虽然在智能时代以前新闻的相关性已经以地理或心理相关的方式影响着受众的新闻消费，但是数字时代基于高速传播信息的基础设施和计算机语义关系所建立起来的关联，远比数字时代之前的范围更广。数字技术在新闻生产中的普遍运用已经改变了新闻价值的判断标准。传统新闻生产中对新闻价值的判断主要依新闻工作者的个人经验而定，这种标准是建立在主体对客体事物的理解之上的，即以人类主体之间的集体意识为标准来对外界进行认知和感受。这样一种主体间性使得人们能够根据自己的科学知识、对问题的理解、理论思维和实际行动来诠释世界的实践与意义结构，对新闻事件进行关联和诠释，然而却忽略了技术的维度。①
    从以印刷技术为代表的纸媒时代，到通过光电模拟信号进行传播的广播和电视时代，乃至当下由电缆和光纤组成的以互联网为代表的数字时代，媒介技术都直接影响着新闻信息的传播以及新闻的价值标准。特别是当大数据和人工智能技术在新闻行业中成为主流技术后，算法通过计算机语言进行意义的拆分、识别和储存，将内容演化为数码物并在不同的客体间进行关联②，从而在作为主体的人之外建立起关系网络。在此过程中，数据作为一种客体物，在基础设施上通过聚合的方式产生了关联。数字技术下新闻价值的判断标准已经突破了人的主体经验的限制而更多地强调客体间的关联，这便是新媒介技术所造成的结果。因此，智能新闻时代需要通过客体间性的概念来理解媒介技术系统及其内部的新闻生产与传播机制。


    根据计算机语义关系所建立的数据之间的关系正是客体间性的基础。


    在许煜看来，数据在本体论意义上是一种数码物，其建立起的客体间性既包括客体内部与外部关系的物质化——“技术将不可见成分或方面变为可见和可测量的形式，从而实现各种关系”①，这个过程亦即将事物转化为数码物的过程；也包括物质化之后的个体间性创造出一种自身环境，将自然与人造连接起来。在物质化的过程中，计算机将事物转化为数据后便建立了各种关联，以因果和相关的方式形成了数据库与网络。媒介本体论的视角将新闻的生产与传播的过程抽象为内容被物质化为数码物的过程，而数码物所构成的网络本身就是一种关系网。②
    在以数码物为核心的智能新闻的时代，关系取代了内容而成为新闻中的关键问题。数码物所建构的周遭环境，同时将人与技术物都纳入媒介系统中，并决定着媒介中人与人、人与物以及时间和空间的关系。然而内容并不是数码物的关键问题，真正重要的是关系，数码物的网络同时也是一种关系网。③
    技术物本身包含了周遭环境，也就包含了人的因素，从而也决定了媒介中人与人之间的关系、时间和空间等。在数码物与媒介基础设施的关联下，贯穿全球电缆和光纤所组成的通信网络将不同的时间和空间关联起来，用时间消灭了空间，也造成了共时和共在。海德格尔在观察了电视、收音机和飞机等能够以较高速度进行传递的新技术之后，发现新技术正在让物理地点、人和时区之间的距离消失，所有物由此聚合在一起，形成一种“同一的无距离”④。通过聚合所形成的人与物的关系网，以及时间与空间的关联，正是客体间性的体现。


    ① 许煜. 论数码物的存在 [M]. 李婉楠, 译. 上海: 上海人民出版社, 2019: 147.

    ② 同①130.

    ③ 同①130.

    ④ HEIDEGGER M. The thing [M] //Glenn Gray J. Poetry, language, thought. New York:
    Harper & Row, 1975.


    媒介物质性将新闻传播的研究视角从人转向人与物共同构成的网络，从而也从根本上摒弃了人与技术对立的格局，并且在媒介科技不断加速变革的时代重新审视技术给新闻带来的影响。其实，自新闻业产生的那一刻起，技术作为重要的外部条件已经对其构成了重要影响。无论是印刷术的革新所实现的固定的报纸出版周期和现代报业的产生，还是电信时代通过电缆连接世界各地后所形成的四大通讯社瓜分全球新闻市场，以及互联网所带来的全球通信与新闻变革，新技术在带来新的媒介文化的同时，也改变着与之相应的社会结构、权力关系以及文化。基于物质性研究的视角，我们在接下来的章节中将陆续探讨人工智能技术与人的主体性之争、人与技术如何融合、内容的数字化和大数据对新闻意味着什么、如何理解智能技术下的新型新闻生产与传播关系、作为基础设施的媒介技术如何影响新闻价值等新闻学研究中的核心议题。


    ## 第二章

    ## 人工智能与人的双重主体性


    如果从媒介网络的视野来看，人在媒介系统中从来都处于一种双重的位置：就微观工作层面，无论是个人还是群体都对自己的工作具有相当程度的掌控性；然而，就整个媒介网络层面而言，无论是个体还是群体，都成为媒介网络系统的一部分，或者成为多重媒介网络组成的媒介系统的一部分，从而被整个媒介网络运转逻辑和技术媒介的演进逻辑所影响。


    人工智能技术在新闻生产中的深度融合给传统的编辑和记者等职业带来巨大的冲击，大量人工被机器所取代，算法也取代了人的判断而决定着新闻分发。一个传统的经典议题再次被推到时代的风口浪尖上：人与技术，谁决定谁？在技术的自主性掌控下，人的主体性已经丧失了吗？人工会被机器所取代吗？人的主体性与技术的自主性的话题在新闻学研究中尤为重要，因为新闻行业并非普通的社会行业，作为社会公器，新闻承载着舆论监督与引导、文化传承等重要职能，仅仅因为技术变革，新闻记者就要将手中的权利与责任让渡于机器吗？智能技术迅速发展与普及并在媒介系统中占据主导地位，引发了学界和媒体对智能技术深刻的忧虑和大量的批评。在这一章里，我们系统回顾工业时代以来探讨人与技术关系的经典理论，并在此基础上反对将人与技术的关系进行简单的二分法的做法，进而提出智能时代人与技术关系的新思考。


    ### 第一节 人的主体性与技术的自主性之辩


    技术和技术物的自主性及其对人的操控与支配性，并不是一个随着智能技术的广泛应用才引起关注的基础问题，而是具有长久历史的研究主题。在这个主题下，大致有两条相关联的分支路径：第一条路径具有宏大的理论视野，从理论隐喻的角度描述包含技术与技术物系统在内的、广泛的社会系统的自主性和支配性；第二条路径的关注点则较为集中，主要探讨技术与技术物系统自身演进的自主性，以及这种自主性对技术所处之环境乃至社会系统的改变。限于篇幅，下文将简述这个研究主题内最为关键的学者与理论。


    ### 一、第一条路径


    第一条路径涉及现代学术史上的许多重要人物。例如，从机器开始大规模进入人类生活的时候，卡尔·马克思就已经注意到技术物的自主性和操控性，认为技术作为物质力量决定了物质的生产方式（生产资料决定生产方式），而物质活动又是人类一切活动中最基本、最本质的活动。从历史唯物主义的角度看，“手推磨产生的是封建主的社会，蒸汽磨产生的是工业资本家的社会”①。马克思认同早期人类形成的劳动技术，认为人类在早期以自发的、有意识的、生产性的劳动，形成了基于物质工具和生产技术的生产力。


    各个人必须占有现有的生产力总和，这不仅是为了实现他们的自主活动，而且从根本上说也是为了保证自己的生存。这种占有首先受所要占有的对象的制约，即受发展成为一定总和并且只有在普遍交往的范围里才存在的生产力的制约。②


    然而，伴随着工业化进程和新生产技术的不断发展，马克思对于资本主义生产条件下的“异化”的技术感到不安，他在《资本论》中曾经引述安德鲁·尤尔（Andrew Ure）在《工厂哲学》中的著名论断，将工厂描述为“一个由无数机械的和有自我意识的器官组成的庞大的自动机，这些器官为了生产同一个物品而协调地不间断地活动，因此它们都从属于一个自行发动的动力”③。当工人大规模使用机器进行生产的时候，作为人类本质的、自由自觉的活动——劳动变成了异己的、与人对立的东西。工人不可避免地失去对自己工作的控制，从而失去对生活及自我的控制。工人从来都不是自主、自我实现的人类存在，他只能以资产阶级欲望的模式而存在。①


    ① 马克思. 哲学的贫困 [M] //马克思恩格斯选集：第 1 卷．3 版．北京：人民出版社，2012：222.

    ② 马克思、恩格斯。德意志意识形态 [M] //马克思恩格斯选集：第 3 卷．3 版．北京：人民出版社，2012：209.

    ③ 马克思．资本论：第 1 卷 [M] //马克思恩格斯全集：第 44 卷．2 版．北京：人民出版社，2001：482.


    这种带有万物有灵论色彩的论断实际上是将技术当做一种仿佛具有生命一般，且不受人类控制的、异化的力量，而这种力量的背后驱动者即是由资本所推动的生产力。在工人与机器合作生产的过程中，马克思也观察到了技术系统背后的逻辑。现代机器工业是一个有机整体，仿佛具有自组织能力一样，工人与机器组成各种分工小组协同劳作，形成有组织的机器体系，各局部机器之间不断交接工作。因此，“在发达的工厂中，起支配作用的是各特殊过程的连续性……当工作机不需要人的帮助就能完成加工原料所必需的一切运动，而只需要人从旁照料时，我们就有了自动的机器体系，不过，这个机器体系在细节方面还可以不断地改进”②。


    身处第二次工业革命的马克思已经意识到机器与人所组成的有机系统所具有的自主性特征。“在机器体系中，大工业具有完全客观的生产有机体，这个有机体作为现成的物质生产条件出现在工人面前”，工业化社会的集体劳作已经彻底改变了过去单纯由人工所组成的手工集体劳作，“因此，劳动过程的协作性质，现在成了由劳动资料本身的性质所决定的技术上的必要了……大工业必须掌握它特有的生产资料，即机器本身，必须用机器来生产机器。这样，大工业才建立起与自己相适应的技术基础，才得以自立”③。


