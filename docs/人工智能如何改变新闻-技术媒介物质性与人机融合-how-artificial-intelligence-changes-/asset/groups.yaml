    ## 第二节 器官学：理解人与技术的融合


    如上文所述，如果将人与技术放在一个“共在”的视角去考量的话，那么又该如何理解二者之间交织不断的互动关系呢？自工业革命以来，人类与机器、文化与技术是否对立，以及二者又如何融合的问题便是哲学领域的经典议题。众多的研究将机器与人的器官做类比，众多器官就如机器的部件，组合在一起就能形成机器的整体运动。达尔文在《物种起源》中分析器官的演变史时便将机器的发明史与之做类比，并认为“器官”是生物与技术建立类比的焦点①，并且在对技术发展的观察中谈及动植物的生活中作为生产工具的动植物器官是如何形成的。勒内·笛卡儿（Rene
    Descartes）的“机械论”也认为，在人造的技术物中数量众多的机械构建所组成的机器能够自行运动，所以上帝制造的机器（人和动物的躯体）和机器一样也能够自行运动。②
    这便意味着，任何动物的躯体都是由无数个部分组成，每个部分分别承担不同功能并通过机械作用进行沟通。但其中的问题也非常明显，假如人和动物都能够拆分成不同的部件，就像解剖学那样从局部来理解器官功能的话，是无法估计由部件组成的有机整体如何进行组合，又是如何运作的。


    ① 胡翌霖。技术作为人的器官：重建技术进化论 [J]. 自然辩证法研究，2021, 37 (2): 26 - 31.

    ② 笛卡尔文集 [M]. 北京：中国戏剧出版社，2008：39 - 41.


    人与机器在工厂进行生产时，又是如何协同劳作的？对此马克思提出了技术与劳动的辩证法，阐明在机器大生产中人与技术互相改变、彼此适应的过程。他在考察了工业化大生产中劳动工具是如何由工具转变为机器的之后，认为人与机器被组织成一个有机系统，这种“新的技术”对传统技艺和手工业生产造成冲击。①
    作为劳动者的人的作用不仅没有区别，而且可以被替换。但是，技术也体现了“劳动者对各种工作的适应能力，从而使之最大限度地发挥各种才能”。通过器官的比喻，马克思将工具与机器在本质上进行了区别，认为人因为受到器官数量的限制，因此可以使用工具的数量是有限的（如传统纺车需要工人双手操作，因此一个工人可以操作的纺车是有限的），但是珍妮纺纱机通过将纺锤并排连接，使一个工人可以同时操作
    12～18 个纺锤，使得人类的劳动摆脱了器官的限制。此时的技术，作为人的器官的延伸而拓展了劳动能力。但是，人与机器共同组成的系统里需要进行技术的统一，这样多个机器才能组成同样的器官来协同运作。


    与马克思同时代的德国技术哲学家和地理学家、西方现代技术哲学第一人恩斯特·卡普（Ernst Kapp）也提出“器官投射说”（organ projection），认为技术在形状、结构和功能上是人的器官的投射和外化，通过投射的过程人类实现了与外部世界的融合和自我认知。②
    根据身体和器官的外形与功能在自然中创造出人造的技术物，这些技术物具备了作为有机物的器官的功能，人与自然界、有机体与无机体以及人体器官和人造机器被关联在一起，人因此也成为万事万物的尺度。③
    人造的技术物——机器作为人体的外化——是有机世界的一部分。而且需要说明的是，技术不是器官投射的产物，而是过程。器官投射的过程呈现出一种“镜像”图式，出于适应外在环境的需要，作为有机体的人无意识地在制造和使用工具的过程中将人的某些器官功能进行投射，这时人的主体意识便产生了，人也开始意识到人造技术物是一种仿生的实体，制造和使用工具（投射）的过程使得人与环境产生更好的融合。在之后的“投射回溯”环节中，人类开始形成自己的主体性，“外在事物作为人的感知对象进入人的内心，成为人的内在性”①。人通过器官的投射和回溯的过程，实现了有机世界与外在无机世界的统一，也通过器官的外化而形成内化的主体自我意识，进而又扩大为人类对外部世界的理解，并提升人类对内部世界的认知。


