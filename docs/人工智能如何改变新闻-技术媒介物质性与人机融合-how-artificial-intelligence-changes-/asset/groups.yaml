    虽然新闻生产中人和算法技术的关系一直是学界讨论的焦点，但长期以来，并无定论。数字新闻与传统新闻的边界进一步明晰，二者的本质区别不仅在于是否“数字化”，更在于算法机制④对新闻生产流程和底层逻辑的改变。目前，关于算法深入新闻生产实践的研究主要有两类：


    第一类是对算法改变新闻生产实践的客观描摹，以及对比传统新闻采编模式中记者的工作方式，陈述算法为新闻生产流程增添和改变的部分。人是新闻作品的生产者，是新闻作品最终的使用者⑤，算法一方面作为工具改变了人的工作流程，另一方面则作为生产生活的新规则，以相对独立的姿态参与并影响了新闻生产。在传统新闻采编模式中，记者“发现新闻”、确定“什么为新闻”“是否刊发”等环节主要取决于他自己的经验和判断，其主观性较强，所谓的受众视角也来自“想象的受众”⑥。而算法可以从各公共平台实时监测话题流动，辅助记者抓取公众热点，为决策流程提供可靠


