    力，因此数据标注工作对于当下的人工智能来说必不可少。例如，2016 年击败世界围棋冠军、韩国棋手李世石的人工智能机器人“阿尔法围棋”（AlphaGo，又译作阿尔法狗），是谷歌旗下的深度思维（DeepMind）公司基于深度神经网络制造的围棋机器人。在建立模型之后，深度思维团队根据现存围棋图谱输入超过
