    对新闻价值的影响主要体现在两种维度：首先，基础设施连接着不同的地理空间并决定着新闻的传播速度，由此能够影响新闻的时效性，以及由于传播速度所导致的时间和空间关系的变迁；其次，基础设施还通过算法将不同的新闻内容以数据的方式建立起关联，影响着新闻价值中的相关性。


    虽然在智能时代以前新闻的相关性已经以地理或心理相关的方式影响着受众的新闻消费，但是数字时代基于高速传播信息的基础设施和计算机语义关系所建立起来的关联，远比数字时代之前的范围更广。数字技术在新闻生产中的普遍运用已经改变了新闻价值的判断标准。传统新闻生产中对新闻价值的判断主要依新闻工作者的个人经验而定，这种标准是建立在主体对客体事物的理解之上的，即以人类主体之间的集体意识为标准来对外界进行认知和感受。这样一种主体间性使得人们能够根据自己的科学知识、对问题的理解、理论思维和实际行动来诠释世界的实践与意义结构，对新闻事件进行关联和诠释，然而却忽略了技术的维度。①
    从以印刷技术为代表的纸媒时代，到通过光电模拟信号进行传播的广播和电视时代，乃至当下由电缆和光纤组成的以互联网为代表的数字时代，媒介技术都直接影响着新闻信息的传播以及新闻的价值标准。特别是当大数据和人工智能技术在新闻行业中成为主流技术后，算法通过计算机语言进行意义的拆分、识别和储存，将内容演化为数码物并在不同的客体间进行关联②，从而在作为主体的人之外建立起关系网络。在此过程中，数据作为一种客体物，在基础设施上通过聚合的方式产生了关联。数字技术下新闻价值的判断标准已经突破了人的主体经验的限制而更多地强调客体间的关联，这便是新媒介技术所造成的结果。因此，智能新闻时代需要通过客体间性的概念来理'
