    ## 第三节 媒介中介性：克莱默尔的“信使模型”


    西皮尔·克莱默尔是继基特勒之后又一位重要的德国媒介学者。她于1980年在德国马尔堡大学获得博士学位，其博士论文《技术、社会与自然：三者关系的试论证》（Technik,
    Gesellschaft und Natur: Versuch über ihren Zusammenhang）奠定了她对技术研究的兴趣。1984 年她加入了“人与技术”（Mensch
    und Technik）研究小组和德国工程协会（Verein der Deutscher Ingenieure）人工智能委员会。1989 年起克莱默尔开始成为柏林自由大学哲学系理论哲学教授，并于
    1991 年出版了她的教授资格论文《计算理性：17 世纪的运算与理性主义》（Berechenbare Vernunft : Kalkül und Rationalismus
    in 17. Jahrhundert）。从这本书开始，她尝试着放弃之前媒介研究将技术作为先决条件并且形塑和决定媒介进程的思想，转而关注媒介的中介功能。此后克莱默尔对媒介的思考不断推陈出新，1998
    年出版的《传媒、计算机、实在性：真实性表象和新传媒》（Medien, Computer, Realität: Wirklichkeitsvorstellungen
    und Neue Medien）③ 开创了一个与德国传统的媒介研究所不同的研究视角。


    目前英语和中文学界对克莱默尔的了解还比较少，但她在德国相关领域已经深有影响，她从哲学的角度来分析媒介技术，并发展出一套理论体系研究计算机作为媒介（medium）的功能。虽然克莱默尔发表了大量英语论文来分析基特勒的媒介思想，但她同时还创立了一种不同于基特勒的媒介哲学观。克莱默尔媒介思想的一个核心概念就是“信使模型”。这里的信使借用了古希腊神话中赫耳墨斯（Hermes）的形象，他是在边界之间不断穿行的旅行者之神，与彩虹女神伊里斯共同担当神界与人界之间的信使，同时也是亡灵的摆渡神，帮助死去的灵魂到达冥界。另一个理解克莱默尔媒介哲学的术语是“媒介性”（Medialität），在德语语境中这个词与人的认知有关，指精神世界的信息通过媒介被感知（wahrgenommen）和理解。早期的信使扮演着媒介的角色，媒介使信息“能够被感知”（Wahrnehmbar-machen）和“被看到”（Erscheinenlassen），所以克莱默尔认为媒介亦即感知。①


    ① KRÄMER S. Medium, messenger, transmission; an approach to media philosophy [M].
    Amsterdam; Amsterdam University Press, 2015.


    ② 克莱默尔. 传媒、计算机、实在性：真实性表象和新传媒 [M]. 孙和平，译. 北京：中国社会科学出版社，2008.


    克莱默尔重新建构了一个与之前德国媒介研究所理解的媒介完全不同的概念。在她看来，日常生活中我们可以听到铃声，但是却无法看到声波的振动；我们阅读的不是文字而是故事。这些例子都说明，媒介其实是不可听见、不可看见的。它在传播过程中起到中介作用，而只有当这个功能运行不良时，媒介才会显现出来。②
    在传播过程中，不仅语言被物质化了，连演说者也被物质化了。语言以声音、书写和手势的形式提供一条通往物质的外部之路。语言通过媒介的中介作用才能存在，通过媒介与语言使用者的身体相联系。①


    ① KRÄMER S. Medium, messenger, transmission: an approach to media philosophy [M].
    Amsterdam: Amsterdam University Press, 2015: 23.


    ② ENNS A. Introduction: the media philosophy of Sybille Krämer [M] //Krämer S.
    Medium, messenger, transmission: an approach to media philosophy. Amsterdam: Amsterdam
    University Press, 2015: 9–18.


    她将传播划分为两种模式，一种是技术/邮递模式（technical/postal model），另一种则是人际/性合模式（personal/erotic model）。从技术/邮递模式来看，传播是在空间和物理距离间建立联系。传播在双方向进行，但是它们发出不同的声音，它们之间的差异性和距离无法消除。传播是对称性的、间接的，媒介则代表传播过程中非常必要的先决条件。而人际/性合模式则强调互动和对话，双方的距离和差异都在传播中消除了。克莱默尔在这里采用一种反讽的手法，使用“性合”一词说明两者在传播中相互理解、融合，原本条件相异的个体实现了共时性和统一。②
    传播是一种社会互动或者对话形式，其目的在于促进社会交流、理解和建构社群。因此，根据人际/性合模式，传播是对称的且互惠的过程，传播的目的是通过互动将多元意见转化为同质化的意见，将不同的个体转换为具有共同认同的群体，最终使代表不同个体的声音保持一致。这一场景描述了交流的主体间性（inter-subjectivity），没有解决不了的分歧，没有理解也就没有沟通。尤尔根·哈贝马斯（Jürgen
    Habermas）在描述公共领域概念的时候，也将传播看成在不同的人之间消除差异的过程。意见不同的群体在公共平台上进行表达后，不同的意见最终融合为一种主流意见，彼此间能够彻底地实现理解，共同发言的目标也是为了达成共识，这正好符合人际/性合传播模式。


    这两种模式都有一个前提，即交流的双方存在差异。③ 在技术/邮递模式中，信息的发出者和接受者之间存在空间和时间上的距离。而人际/性合模式则试图通过建立认同来消除个体内部已经存在的差异。在不同的传播模式中，媒介所起的作用也是不一样的。前一种模式中的媒介是必不可少的，它处于传者和受者之间，没有媒介的话信息是无法传递的，但媒介并没有消除传受二者之间的距离，而是在二者之间建立联系；在后一种模式中，媒介处于外围并且是可以忽略的工具，它们是通向他者的中介，信息穿过中介的时候并不会发生扭曲，这种作用类似于窗户的透明玻璃面。①
    对话关系的建立消除了距离，并且让交流双方得以相互理解。因而当双方通过对话不断消除差异且慢慢融合的时候，留给中介或者媒介的空间自然也就消失了。


    需要明确的是，克莱默尔在这里对两种传播模式进行区分，目的是突出技术/邮递模式，因为这种模式强调了媒介不可或缺的地位和作用，而信使模型正是这种传播模式的代表。正因为媒介的作用不可消除，媒介性也才能实现。然而，虽然技术/邮递的与人际/性合的传播模式旨在进一步解释香农和哈贝马斯对传播的理解，但是就分析人们在传播的时候发生了什么的理论模式来看，技术/邮递的传播模式的解释力是不够的。在克莱默尔看来，她并不想强调对话在传播中不可替代的优先角色，也不想将互动性作为传播中的优先原则。她只是尝试着提供一种不同于前人注重技术的视角，从一种浪漫主义的角度来观察和理解传播过程。她用信使的功能来比喻媒介在传播过程中所起的中介作用。信使作为传递者，他们只是复述或者记录信息来源者所要传递的内容，然后传递给传播对象。信使受雇于信息来源者，自身不对内容负责，只作为中介。从某种意义上说，信使就是信息来源者的一种延伸。②
    在这一点上，克莱默尔的媒介理论更加突出一种“去人类主体性”的媒介观，这和基特勒所强调的“媒介决定了我们的处境”完全不同。


    在基特勒看来，媒介具有自主性，而且是文化历史有机运行的原因。但需要注意的是，正因为在技术/邮递传播模式下媒介是无法消除的，这就为交流双方之间的连接和融合形成了一定阻碍。通常在传递过程中，我们希望降低干扰的影响。然而传播的物质越是技术的、不透明的，传播中的对话看上去就越容易被扭曲。


    媒介、信使和传递（Übertragung）这三个概念是诠释媒介性的重要术语。相比于技术的决定作用，“媒介性”这一概念的解释力更强，因为它代表了所有社会和物质系统交换形式的基础。①
    媒介的形式多种多样，在克莱默尔看来，天使、病毒、货币、翻译者、精神分析学家、目击者乃至地图都可以被看做媒介，它们在建立沟通纽带的同时还保存了沟通者之间的多样性。信使模型为人们能够深入观察一个存在于多元个体的社群提供了一种特别的理论视角，个体之间因为存在空间距离而产生了差异，但这也为实现统一和主体间性提供了可能。根据媒介性理论，所有传播其实都是传递行为，大众传播作为人类传播形式中固有的一种维度，同样也属于技术/邮递模式。克莱默尔所理解的媒介更多地关注交流者之间的互动而非纯技术层面，信使模型更加强调传递过程和第三个存在（thirdness），而不是技术装置。从上述的分析中我们可以看出，克莱默尔的信使模型完全不同于麦克卢汉的媒介理论所强调的媒介技术所带来的重要影响，也和伯明翰学派的关注媒介内容的文化研究截然不同，同样与基特勒的媒介物质性本体论有着重大差别。就像话的媒介理论来讲，基特勒的媒介理论更加关注技术层面，而哈贝马斯则特别强调传播的对话层面，克莱默尔的媒介理论开创了一条重新诠释媒介本质的路径。和基特勒相似的是，克莱默尔也讨论数学中的形式化、计算和机械化等问题，并且引入“符号机器”（symbolische


    > ① ENNS A. Introduction; the media philosophy of Sybille Krämer [M] // Krämer
    S. Medium, messenger, transmission; an approach to media philosophy. Amsterdam;
    Amsterdam University Press, 2015; 9–18.

