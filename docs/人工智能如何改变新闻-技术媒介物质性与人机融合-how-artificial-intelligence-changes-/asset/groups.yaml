    相对于传统媒体，新媒体生存与竞争的压力更大，从业者往往更关注传播效果的量化数据，更清晰地感知到量化指标与算法参与给价值判断带来的掣肘与压力。即便对于“时新性”“影响力”“机构议程性”等在传统媒体组同样得到认可的指标，新媒体从业者在谈及“动机”时也更倾向于提及自身在市场竞争中的位置与策略，而传统媒体从业者往往强调社会责任与社会效益方面的考量。


