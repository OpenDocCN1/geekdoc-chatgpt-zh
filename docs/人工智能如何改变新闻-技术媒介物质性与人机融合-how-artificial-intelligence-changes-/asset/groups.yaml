    # 第一章


    # 新闻学研究的物质性转向


    ![](img/228cf445208423908042e1490b71df9d_34_0.png)'
  - '[PAGE 35]


    +   - 智能时代，媒介技术在新闻生产和传播中占有越来越重要的地位，从而也将新闻学研究的重点渐渐从人转向媒介技术，重新审视长期被忽略的技术因素对新闻造成的影响。


    +   - 媒介物质性将新闻传播的研究视角从人转向人与物共同构成的网络，从而也从根本上摒弃了人与技术对立的格局，在媒介科技不断加速变革的时代重新审视技术给新闻带来的影响。


    +   - 自新闻业产生的那一刻起，技术作为重要的外部条件已经构成了重要影响。'
  - '[PAGE 36]


    在当下智能媒体平台高速发展的背景下，新闻的生产和传播模式都发生了根本变化。传统大众媒体时代的新闻学研究重点讨论的是内容生产过程中的人（如记者、编辑、采访对象、受众等），而在智能时代，随着媒介技术在新闻生产和传播中占有越来越重要的地位，新闻学研究的重点渐渐地从人转向媒介技术，长期以来被忽视的技术因素对新闻所带来的影响问题也得以受到重视。这种转向至少带来了两个方面的变化。


    一方面，以技术可供性、行动者网络理论和科学技术研究（science and technology studies，STS）的视角来重塑新闻理论和反思技术对新闻客观性的影响等一系列研究的展开①，标志着中国新闻学研究开始重点关注技术因素对新闻媒体的影响。特别是近六年来，与“传播的物质性转向”相关的研究被引介到中国新闻传播学界②，由于物质性的研究视角又能够跳脱传统新闻学研究中对人和内容的限制，将媒介技术和媒介物质载体的影响清晰呈现出来，因此“传播的物质性”视角开始与中国新闻实践相融合，这种状况正在深化新闻传播学研究对数字和智能技术背景下新闻生产和传播体系的重构的理解。另一方面，对数字时代新闻的平台化与智能化的研究也在很大程度上激起了学界和业界对智能技术侵蚀与替代人的主体性的忧虑与担心。


    本章将媒介物质性研究作为基础理论引入新闻学，系统阐释媒介物质性视角的基本理念、代表学者和核心理论，这些基本理论和观点也将被用在之后的章节中阐释智能时代的新闻实践。


