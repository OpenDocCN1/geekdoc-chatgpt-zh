  - '[PAGE 88]


    介网络的视角来仔细观察智能新闻聚合网站的微观生产，可以看出从 Web 1.0 时代的页面新闻到当下智能技术主导的新闻聚合平台，“人”在媒介网络中的位置正在发生系统的迁移：在新闻与资讯生产层面，人和人工正在渐渐脱离核心位置。虽然出于政策监管要求，大量的网络内容审查人员重回“把关”位置，然而与内容信息的庞大数量、整个媒介网络的巨大体量相比，在内容层面的“人”的重要性还是在急速降低；但在媒介技术层面，人的投入量则大为增加。然而，这种迁移无法方向如何，都并未改变一个基本的事实：在智能媒介网络中所有的人和物，都在为以算法为核心的智能媒介网络的“永存”而服务。换句话说，智能媒介网络也共享了媒介本体论的基本特征：具有自主性的媒介主体。


    但是，通过将智能技术与大众传播时期的媒介实践经验进行对比来讨论重新伸张人类主体性、时刻“以人为本”的观点可能会面临众多的困难。如果从基特勒的媒介网络视角进行分析，人的绝对主体地位如果不是从来都未曾存在的话，那么至少在机械媒体时代就已经大部分消融①，而尼尔·波兹曼②、西奥多·阿多诺及马克斯·霍克海默的《启蒙辩证法》③等数以百计的研究则对大众传播对人类主体的支配性进行了严厉的批判。人们对于新技术的恐慌也并非从智能技术的大规模应用才开始，而是一种重复出现的历史境况。在技术媒介通过自主性增长把人变成技术媒介网络“配件”的情况下，人一直处于一种双重的位置：就微观工作层面，无论是个人还是群体都对自己的工作具有相当程度的掌控性；然而，就整个媒介网络层面而言，无论是个体还是群体，都或者成为媒介网络系统的一部分，或者


