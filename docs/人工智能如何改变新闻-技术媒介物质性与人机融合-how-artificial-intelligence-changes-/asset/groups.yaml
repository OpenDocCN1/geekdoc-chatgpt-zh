    # 第三节 智能新闻生产与传播关系网络


    新媒介技术的发展推动着数字时代的新闻学的研究将内容转向技术，重构了人与媒介技术的关系、新闻生产和传播的关系。基于物质性理论的视角，我们将新闻研究的中心从人转变为物，并把隐匿在新闻内容和平台背后的物——数据重新揭示出来，新闻生产流程正是媒介技术中介下的数据流动过程。但是，物质性视角并不意味着“以物观物”，而是把关注点落在围绕着数据物所产生的新闻环境和社会关系上，从而重新审视媒介如何决定人的处境。数据在其中作为物的存在，将人与作为装置的新闻平台连接起来，构成以关系为核心的“社会-物质”网络。在这个网络中，尽管新闻生产的内容逻辑与技术逻辑发生着众多的碰撞，媒介技术也体现出一定的自主性，但人与物之间最终通过媒介网络而凝结成媒介系统，技术也需要与人共同建构媒介网络才能发挥作用，从而实现人与技术、思想与机器之间的协同运作。


    在人与技术协同运作的媒介系统中，物质性的媒介发挥着中介作用，连接着传播者和接受者双方，并在空间和物理中建立起二者的关系，语言等符号形式作为物质性的媒介而被物质化了，中介性成为媒介的物质性的重要特征。基于物质性视角下将数据作为技术和媒介的中介性特质，数字时代的中介社会传播模式将人与物共同建构出的中介系统视为传播的中心，信息以数据的形式聚合在由算法和记者共同组成的关系网中，并在传播者和目标对象中循环流动，并随新闻生产和传播的关系网扩散。


    从理论范式的构建上，本章选取了物质性理论中与数字媒体相关的部分，试图在下述三点进行理论上的突破：一是立足于数据，将物的概念融'
  - '[PAGE 156]


    人工智能新闻生产来理解人与物的关系，从数据的本质来分析新闻生产和传播的本质；二是在人与数据物所共同建构的新闻关系网中，通过媒介网络理论来分析技术的自主性如何与人的逻辑融合成媒介网络，从而应对新技术对新闻从业人员带来的挑战，建构人与物协同运作的媒介系统；三是在物质性所强调的技术特性和媒介的中介性基础上，将中介社会传播模式融入智能新闻情境，结合数字媒体的特征来建构新闻生产和传播模式，并将数据的流动作为该模式的运作机制，进而分析数据在中介系统内容部分如何影响新闻生产和重构人与技术的关系，在外部如何重构传播参与者的关系和传播结构。


    从物质性的视角来重构新闻生产和传播的关系，充分发挥了数据作为技术物的媒介本体论思想在数字时代的诠释力，不仅在理解新技术条件下的人与技术之间的关系上提供了富有创见的视角，还能通过创建中介社会传播模型来分析数字时代互动性强、传播主体多元和多级传播的特点。新闻学研究的物质性视角将研究对象从内容转变为技术，重新审视技术在媒介发展和社会变迁中的重要作用。但是，这种视角并不等同于技术决定论，因为它将技术置于人与物共同建构的媒介环境中，正如基特勒所指出的，作为技术的媒介物决定了人的情境，而真正发挥作用的是这种情境，技术的影响力也需要在与人共同建构的媒介网络中才能发挥；也正如许烜所强调的，技术物也需要缔合环境来维持与外部环境之间的关联和平衡。所以，媒介技术或者技术物，在新闻生产和传播过程中提供的是一种情境，或者一种环境，在其中需要人与物协同运作，需要内容逻辑与技术逻辑协调发展，才能推进整个新闻体系的有序发展。


    此外，从技术视角来反思新闻生产和传播流程并非是近年研究的一种创新，而只是一种理论回归。这种回归从理论上讲，远可以追溯到 19 世纪中期以来技术哲学的探讨，近可以回溯至哈罗德·伊尼斯（Harold
    Adams'
