    尔库塞分析了后期资本主义的两大发展趋势：一个是国家加强了对经济生活的干预，另外一个和技术高度相关，就是科学技术日益取得了合法的统治地位，科学技术进步使技术出现了“合法化”的进程。如此一来，原本哈贝马斯所设想的公共领域——通过公众所讨论，每个人都参与从而形成主流意见——已经不复存在了，而是变成了“由科层组织中的专家使用技术来解决的技术问题”。虽然马尔库塞和哈贝马斯对技术是否中性的存在争议，但二人都认为技术在一定程度上造就了人的被动与技术的统治，这也是当下资本主义发展的重要特征。


    同一时期，大西洋彼岸的刘易斯·芒福德（Lewis Mumford）提出的“巨机器”（megamachine）理论也是这个路径中非常有影响的理论之一。芒福德指出，现代技术已经变成“巨技术”（megatechnics）——一种与有机世界的系统性密切关联的生活技术、适应性技术和多元技术相反的，一元化的和专制性的技术。建立在巨技术之上的“巨机器”，则是追求整齐划一的秩序、追求权力和控制的机制化机构，如美国国防部的“五角大楼”、NASA
