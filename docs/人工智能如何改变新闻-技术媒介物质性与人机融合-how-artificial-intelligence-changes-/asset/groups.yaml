    尔库塞分析了后期资本主义的两大发展趋势：一个是国家加强了对经济生活的干预，另外一个和技术高度相关，就是科学技术日益取得了合法的统治地位，科学技术进步使技术出现了“合法化”的进程。如此一来，原本哈贝马斯所设想的公共领域——通过公众所讨论，每个人都参与从而形成主流意见——已经不复存在了，而是变成了“由科层组织中的专家使用技术来解决的技术问题”。虽然马尔库塞和哈贝马斯对技术是否中性的存有争论，但二人都认为技术在一定程度上造就了人的被动与技术的统治，这也是当下资本主义发展的重要特征。


    同一时期，大西洋彼岸的刘易斯·芒福德（Lewis Mumford）提出的“巨机器”（megamachine）理论也是这个路径中非常有影响的理论之一。芒福德指出，现代技术已经变成“巨技术”（megatechnics）——一种与有机世界的系统性密切关联的生活技术、适应性技术和多元技术相反的，一元化的和专制性的技术。建立在巨技术之上的“巨机器”，则是追求整齐划一的秩序、追求权力和控制的机制化机构，如美国国防部的“五角大楼”、NASA
    与登月火箭计划、核武器等都是典型的巨机器。① 然而，芒福德的《机器的神话》只是针对机械时代的技术现象所阐发的理论反思，在数字技术时代，布鲁诺·拉图尔（Bruno
    Latour）则从自己所提出的行动者网络理论（actor network theory, ANT）出发，进一步发展了“巨机器”理论。拉图尔指出，技术是社会性的，因为它们是被社会地建构起来的。因而，技术是一种社会关系，而社会掩藏在了技术事物教的身后。千百年来，人们已经将社会关系的概念延伸到了行动体（actant）——既包含人也包含非人。通过在行动之间建立的联系（associations），人与非人共同构成了行动'
  - '[PAGE 66]


    的共同体。在这个过程中，现代工业赋予了非人在行动体聚合中彼此关联的可能性，这种聚合被人们称为机器或者机器人（automaton），即具有某种自主性并且遵循特定的、能被工具或者计算程序进行测量的规则。工业化社会到来之后，组织中原本由人组成的部分子程序被非人所代替，机器、工厂、工业和机器人便产生了。一开始非人加入组织而且扮演着顺从的仆人角色，然而随着工业化进程的不断发展，巨机器中对人的管理工作逐渐转移给了非人，技术从而通过权力网络学习大规模管理。①
    在这种结构中，人与非人都共同为技术系统的有序运行而服务，人类不再具有自立的人格，更不能积极发挥职能作用，而只能成为一种消极被动、无目的的性的、服从机器操控的动物。②


    # 二、第二条路径


    第二条路径主要由法国哲学家雅克·艾吕尔（Jacques Ellul）及其理论追随者兰登·温纳所推动。艾吕尔在其《技术社会》（The Technological
    Society）一书中提出，“技术已成为自主的，它已经塑造了一个技术无孔不入的世界，这个世界遵从技术自身的规律，并已抛弃了所有的传统”③。技术本身能够在人的计划、期望和选择之外实现一种自我生成的过程，而且一项新技术的发现能够使得技术成为可能，并成为其产生所需的条件。④
    这便意味着，技术的发生与发展是一连串的、自主式的生成。经过一段时间的发展，技术会变得越来越专业化和复杂化。兰登·温纳在此基础上进


