    ## 第四章 重构智能时代新闻生产与传播关系网络


    - 新闻传播的过程其实是符号在人与技术所构建的中介性关系网络中被物质化的过程。

    - 从物质性的视角来重构新闻生产和传播的关系，充分发挥了数据作为技术物的媒介本体论思想在数字时代的诠释力，不仅在理解新技术条件下的人与技术之间的关系上提供了富有创见的视角，还能通过创建中介社会传播模型来分析数字时代互动性强、传播主体多元和多级传播的特点。


    在平台化新闻生产过程中，平台凭借其强大的数据技术能力将世界上众多之前没有被量化过的事物转化为数据，并且通过具有高度选择性的、智能操控能力的网络化连接来重塑社会。①
    从这个角度来看，新闻平台成为各种新技术的汇聚场，其重要特征是数据化，即新闻内容通过数据的方式被生产、分析、筛选、储存和传递。


    在这个过程中，传统新闻生产的过程和新闻编辑室的结构、运作逻辑以及新闻生产者的角色都已经彻底改变：首先，个人用户、机构用户和合作信源方等不同来源的新闻信息在这里经过加工后，再经由高度智能化、具有强烈操控性特征的算法分发给多元化的用户，这使得整个新闻生产流程在发生变化的同时，也让新闻生产与传播流程变得无法分离。其次，新闻生产和传播的流程都同时被纳入平台系统，算法、数据存储系统、打标签的人和审核人等硬件和软件也都需要纳入媒介系统进行考察。最后，平台中的专业与非专业用户生成内容不仅让生产者和传播者之间的角色边界变得更加模糊，也为二者的身份互换提供了可能，而借助平台所进行的新闻推动和传播，也打破了过去较为单一的大众传播模式，在社交朋友圈内以人际传播的方式进行多级扩散。用户还可以通过点赞和转发等互动形式参与到新闻的传播过程中，这不仅增加了新闻信息的反馈方式，还进一步增强了用户的互动性。


    算法和智能技术的加入进一步打破了以人为中心的新闻生产模式，让人与技术都共同融入平台系统中协同运作。智能时代的新闻传播，已经突破传统媒体时代的大众传播模式，呈现出新的传播格局。因而，在新闻平台化的条件下，作为技术的算法和作为基础设施的平台工具已经融合到新闻生产中，逐渐改变着新闻传播的结构，使得技术、物和人共同参与其


    中，并在新闻的生产和消费中建立了一种去人类中心的媒介网络，共同建构着一种新型新闻生产关系。这种新型的新闻生产关系，如果从“社会性-物质性”角度进一步进行分析，其非人类中心主义的特点就会更加凸显出来。


    技术本身既包含着物质属性，也具有社会属性。一项新技术从发明之后在社会中产生影响，是技术本身不断融入社会的结果。因此，新闻平台化过程中涉及的技术，已不仅仅只是电脑中由代码所组成的算法，或者只是如何制作纸张和印刷字体等方法过程，而是一整套网络体系。在这里，按照兰登·温纳的观点，技术的概念包含三个层面：首先，它是一种装置（apparatus），对应着工具（tools）、仪器（instrument）、机械（machines）、用具（appliance）、武器（weapons）和小器件（gadget）等。其次，技术也指向技术性的活动（technical
    activities），即人们完成某件事情所需要的技巧（skills）、方法（methods）、程序（procedures）和惯例（routine）。最后，技术是一种网络（network），这个网络将人与装置连接起来，构成一个巨大的系统。①
    在数字化新闻生产过程中，仅仅依靠装置或者工具是无法完成内容的采编和分发的，人和装置在其中都起到重要的作用。而数字技术将人与作为装置的新闻平台连接起来，构成一张结构紧密的网络。


    这一章从媒介物质性研究的基本思路出发，将新闻生产流程看做媒介技术中介下的数据流动过程，并将对数据流动过程的考察从新闻生产延展到新闻传播流程。基于物质性视角下媒介的中介性特征，以及第二、第三章从宏观到微观层面对新闻实践的考察，这一章将在理论上建构符合智能时代新闻传播特征的中介社会传播模式，即将人与技术共同组成的中介


    系统视为传播的中心，数据在传播者和目标对象中流动并伴随着新闻生产和传播的关系网进行扩散，以应对新媒体技术对新闻学研究范式带来的挑战。


    ### 第一节 数码物、新闻聚合与知识生产


    最近二十年中，在新的数字媒介技术的推动下，全球新闻产业都在经历高速平台化和数据化的过程。在这个过程中，传统媒介转换为数字化媒介，并且通过复杂的技术—物质—社会机制汇聚成高度网络化、数据化的新闻平台。根据何塞·范·迪克（José
    van Dijck）等广受关注的观点，平台是指用来组织用户的互动的可编程的基础设施（infrastructure）设计。①


    这种新闻生产的技术网络体系具有高度的多元性、分散性和包容性，它既囊括了专业记者所需要具备的专业新闻采写技巧和方法，以及在记者编辑群体日常工作中所构成的惯例，也将媒体平台的基础设施、计算机设备、媒体记录的仪器设备纳入其中，它更将各类自媒体作者、多种来源的各类新闻与信息机构所开发的多元信息站点，都通过技术数据接口的方式整合起来。在这个过程中，数据平台最重要的目的是通过这个网络汇聚新闻类数据。因此在重新审视数字技术下的新闻学研究的时候，从以内容作为视角转变为以数据作为视角，则能够开启一个将作为传统新闻主体的人与作为物质的技术和数据之间相联系的新视角。人与物质共同构成了新闻生产的整个流程，形成一张“社会-物质”关系网。


    从数据的角度出发思考新闻平台化背景下的新闻，可以从认识论的视角对大数据进行审视，进而重新思考作为客体物存在的数据在新闻学研究中所扮演的角色。从新闻发展的历史来看，数据新闻的概念并非近年来的创新，而是与记者长期以来使用统计数据、图表、计算机辅助报道等精确新闻报道的新闻实践相关联的。美国学者安德森（C.
    W. Anderson）提出大数据其实是一种“新闻导向物”（objects of Journalism-orientated），从本质上讲，大数据和传统新闻机构常用的数据库、调查报告和纸质文献一样，都是一种物质性的“客体”。


    “新闻导向物”的概念在理论上源于格拉汉姆·哈曼（Graham Harman）所提出的“物向本体论”概念。不同于大多数现代哲学所理解的“物体/客体”（object）作为“主体”（subject）的对立面而存在，这里的物体的使用范围更为广泛，不仅适用于实体的物质实体，还适用于人、动物、虚拟人物、数字和矛盾的实体（如方与圆）。延续了海德格尔关于物体的思想，“物向本体论”强调物体在理解人与非人关系中的重要作用，认为在人类和非人类的直接接触中物体“退出”（withdraw）了，所以事物之间的关系总是间接的，必须加以解释，而不是想当然地假定和认为。将物的视角融入新闻学研究，可以进一步探究原本隐藏在新闻背后的数据、硬件和基础设施，在分析新闻内容的同时引入技术因素，解决当下新技术为新闻理论带来的挑战。


    在数据作为一种物质性客体的基础上，许煜融合了海德格尔关于“物”和西蒙栋关于“技术物”的思想，从物的本体论角度发展出“数码物”的概念。数码物指形成于屏幕上或隐藏于电脑程序后端的物体，由受结构或方案（schema，即元数据赋予语义或功能的结构）所管理的数据与元数据（有关数据的数据）组成。它们遍布于网络视频、图片、文字，以及社交媒体的个人主页上，既存在于电脑屏幕上让人可以与之互动，也存在于电脑程序的后端或者内部。①
    数码物既包含着数据的物化——人通过屏幕、网络就变成一种数据，再通过屏幕映射成一种物的过程，也包含着物的数据化——通过标签将物体编码到数码环境中的过程。通过互联网所造就的语义网络，数码物所表示的不仅仅是物体本身，还是一种关系，从而实现人的思想与机器之间的协同运作。技术物的运作需要与外部环境发生关联而构成一种缔合环境（associate
    milieu）来提供系统恢复平衡的稳定功能。所以“技术物的存在方式在于它不同的网络化模式”②。从数码物的角度来看，人们目前所处的环境其实是由各种物体与用户组成的网络所建构的信息系统。而“物”（古德语
    Ding）在海德格尔看来其本身就包含着聚合的意思，聚集了上帝、天堂、尘世、凡人四个层面的属性，成为融合了天、地、神、人四重维度的聚集物。③ 因而数码物将人与物聚合，建构了一种以数码物为中心的空间、时间和人之间的关系。在这种聚合中，内容并不是数码物的关键问题，真正重要的是关系，数码物的网络同时也是一种关系网。④
    技术物本身包含了周遭环境，也就包含了人的因素，从而也决定了媒介中人与人、时间和空间之间的关系等。例如，在众多新闻 App 的新闻推荐中，算法根据用户所处的地理位置或者好友关系来推荐新闻内容。Facebook
    中的“时间轴”功能将用户个人发生的重要事件连接起来，或者新闻实时推送中按照时间先来发布和更新新闻事件，这些事件都构成了数码物的时间本体①，以拓扑性时间的方式表达着不同物体的网络关系。数码物不仅参与到了这种新陌生产关系过程中，并且建构着一种新的新闻关系，进一步从物的角度诠释了媒介所建构的时间与空间关系。


    ① 许煜. 论数码物的存在 [M]. 李婉楠, 译. 上海: 上海人民出版社, 2019: 2.

    ② 同①30 - 31.

    ③ 海德格尔. 演讲与论文集 [M]. 孙周兴, 译. 北京: 生活·读书·新知三联书店, 2005: 172 - 195.

    ④ 同①130.


    将物的视角融入新闻学研究，可以进一步探究原本隐藏在新闻背后的数据、硬件和基础设施，在分析新闻内容的同时引入技术因素，解决当下新技术为新闻理论带来的挑战。循着物质性视角从知识生产的过程来看，新闻生产其实是一种社会聚合（assemblage）的过程，而采访写作的过程也是知识建构的过程。记者运用专业知识与技能，将“客体”——数据库、调查报告和纸质文档中的资料和证据——相关联起来。各种各样的知识碎片被聚合为新闻产品，而新闻故事也是诸如文档、访谈、数据和链接等社会的与物质的人造物所聚合出来的结果。所以从认识论上讲，数据并非传统意义上的客观事实，而是某种具有重要意义的“知识形式”②。


    “物向本体论”的概念与拉图尔所提出的“行动者网络理论”（actor network theory, ANT）非常接近。因此新闻生产的过程其实是作为主体的新闻记者、编辑在建构事实的过程中将上述各种类型的客体关联在一起的过程。以新闻实践的方式，行动者（actor）和行动体（actant）之间形成了一张人与物的关系网。③在人与物所建构的这个网络中，作为媒介技术物的基础设施结构影响着新闻生产关系的建构。传统新闻传播过程中通常有三种把关：在“输入”环节控制有哪些信息可以进入新闻报道；在“输出”环节控制哪些报道可以通过媒体被传播出去；在“互动”环节控制来自受众的读者来信或者反馈等如何被媒体再现。然而新媒介技术改变了媒介基础设施的结构，拓展了信息来源和可以发布的空间渠道。随着把关渠道的改变，传统的把关难以实现，媒体平台也不再完全为专业新闻生产者服务，新闻生产的参与主体变得更加多元。由此，记者和编辑等专业新闻生产者的功能从“把关”（gate-keeping）转化为“守望”（gate-watching），他们从把关决策唯一的决定者转变为重要影响者①，从而与部分受众以及算法共同影响新闻信息的筛选、储存与传输。新闻平台与图书馆的运作逻辑非常相似，记者和编辑在其中的功能类似图书馆员（librarians），一方面，他们要在特定知识的范围内选定适合发布的内容，从而根据受众所需将他们引导到正确的信息获取方向，这要求记者具有广泛的知识背景，然而他们并不能限定受众获取知识的渠道；另一方面，记者们也是特定领域的专家，掌握着该领域的前沿信息②。


    ① 许煜. 论数码物的存在 [M]. 李婉楠, 译. 上海: 上海人民出版社, 2019: 168-169.

    ② “国内外新闻与传播前沿问题跟踪研究”课题组, 殷乐. 大数据时代的新闻: 个案、概念、评判 [J]. 新闻与传播研究, 2015 (10): 119-125.

    ③ LATOUR B. Reassembling the social: an introduction to actor-network-theory [M].
    New York: Oxford University Press, 2007; ANDERSON C W, DE MAEYER J. Objects of
    journalism and the news [J]. Journalism, 2015, 16 (1): 3-9.


    新闻学研究的物质性视角为分析新技术条件下的新闻生产提供了一种关系本体论的视角，在融合了传统新闻对内容的关注后，进一步将分析重点导向作为客体物存在的数据，并以数据物为核心重新思考构成其周围环境的人与关系。这里需要澄清的是，新闻学研究的物质性的视角并非只强调物本身，而是以物作为本体、从物的视角去思考人与物共同构成的媒介关系网。这种去人类中心化的新闻学研究视角围绕媒介技术展开，也为重新审视新技术对新闻传播的影响、分析新技术带来的新闻传播现象开辟了一条“物质-社会”的路径。但是，技术在新闻传播中所起到的作用并非仅存于智能新闻的时代，而是自新闻诞生之日起，新闻生产便在人与物共同建构的媒介技术网络中运行。

