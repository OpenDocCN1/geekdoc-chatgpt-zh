    数码物既包含着数据的物化——人通过屏幕、网络就变成一种数据，再通过屏幕映射成一种物的过程，也包含着物的数据化——通过标签将物体编码到数码环境中的过程。通过互联网所造就的语义网络，数码物所表示的不仅仅是物体本身，还是一种关系，从而实现人的思想与机器之间的协同运作。技术物的运作需要与外部环境发生关联而构成一种缔合环境（associate
    milieu）来提供系统恢复平衡的稳定功能。所以“技术物的存在方式在于它不同的网络化模式”②。从数码物的角度来看，人们目前所处的环境其实是由各种物体与用户组成的网络所建构的信息系统。而“物”（古德语
    dine）在海德格尔看来其本身就包含着聚合的意思，聚集了上帝、天堂、尘世、凡人四个层面的属性，成为融合了天、地、神、人四重维度的聚集物。③ 因而数码物将人与物聚合，建构了一种以数码物为中心的空间、时间和人之间的关系。在这种聚合中，内容并不是数码物的关键问题，真正重要的是关系，数码物的网络同时也是一种关系网。④
    技术物本身包含了周遭环境，也就包含了人的因素，从而也决定了媒介中人与人、时间和空间之间的关系等。例如，在众多新闻 App 的新闻推荐中，算法根据用户所处的地理位置或者好友关系来推荐新闻内容。Facebook
