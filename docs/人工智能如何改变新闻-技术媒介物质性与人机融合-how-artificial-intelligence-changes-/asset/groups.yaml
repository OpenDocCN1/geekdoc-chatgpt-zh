    客观化、操作化的价值要素依然发挥着重要作用；新闻从业者们在日常新闻活动中围绕价值要素条目所形成的共识，也依然能为学者在技术日新月异的今天探知新闻价值理念的变迁提供参考。因此，在研究设计中我们保留新闻价值要素的分类方式，探究新闻价值在数字时代发生的转变。


    ### （二）传统新闻价值要素的解构与创新


    随着数字技术的迅猛发展，媒介形态日益丰富，人们获取新闻资讯的渠道愈加多元，参与新闻生产传播的主体也愈加多样。新闻生产、分发以及消费的方式持续演变，时效性、重要性、接近性、客观性等经典新闻价值要素在技术的冲击下面临解构。①


    具体而言，通信技术的升级与移动终端的普及使得“及时”的新闻报道极为常见，同时社交媒体平台转而向用户推送他们可能感兴趣、需要的新闻，于是“时效性”转变为一种能够调动受众当下的情感和感官参与的“迫切性”。传统新闻内容的选择和编排（program）一度由新闻媒体机构主要负责②，而当平台算法开始参与内容分发，点击量、浏览量、点赞数、评论数、转发数等量化指标成为新的判断依据，于是“需要性”取代了传统新闻价值中的“重要性”和“显著性”③。相似地，5G+AI
    技术支持新闻内容的私人定制，在去中心化的媒介环境中，过去空间及心理层面的“接近性”在一定程度上被消解，逐渐升级为“定制性”；同时沉浸式新闻的出现也使用户突破时间和空间的限制，实现身临其境的信息体验④。


    在传统价值要素中，“客观性”作为新闻专业主义的核心理念，尤其受到学界关注。① 数字时代的新闻生产面向社会开放，越来越多的非专业实践主体参与新闻生产流通，使新闻报道的质量参差不齐，传者与受者的界限日益模糊不清。在这一背景下，“透明性”作为新价值规范受到广泛关注，被学者看做新闻客观性的发展传承②，意在增强公众对新闻的信任，维护新闻职业的合法性③。是否明确展示了新闻所使用的数据来源和方法、是否为公众提供参与新闻制作的机会以及提供记者的背景信息④，成为新闻从业者证明自身职业合法性的新方式。数字时代，互联网平台的开放性为新闻生产者向受众展示数据来源与相关方法提供了便利⑤，为透明性提供了从理念向实践的转化路径。


    互联网技术发展也创造了全新的新闻价值要素。例如，传统媒体与受众间的关系是单向传播，而互联网的发展使得传播从直线变成网状关系传播模式，带来的最直观的变化就是“互动性”和“交互性”的提升，体现为记者编辑在进行新闻价值判断时对用户互动数据的关注。⑥
    从技术的角度看，机器学习和人工智能算法可以根据用户的行为模式建立用户属性和偏好模型，根据模型分析用户兴趣点，向用户提供个性化内容和互动体验。⑦


