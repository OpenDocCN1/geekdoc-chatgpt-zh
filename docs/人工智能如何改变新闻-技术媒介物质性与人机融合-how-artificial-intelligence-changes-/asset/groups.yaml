    # 四、发现数字智能时代的新闻价值


    数字时代新闻价值的判断与评价体系依然建立在经典新闻价值要素的基础上，时新性、明确性、影响力、正面性、机构议程性等传统的新闻价值要素在当下仍有蓬勃的生命力。而在数字时代被广泛讨论的新闻价值要素中，得到中国从业者普遍认可的包括透明性、互动性、建设性、可分享性、沟通性、视听性、迫切性、需要性以及交互性。认可程度较低的价值指标包括戏剧性、冲突性、反差性、心理替代性、猎奇性等。


    具体而言，数字时代新闻价值的构建路径有两条。


    其一是新闻“价值客体”的拓展与革新。在技术发展的条件下，新闻价值判断的客体由单一的“新闻文本”变为融合视听要素、交互功能、时空情境等在内的“新闻产品”，进而催生了“视听性、交互性、需要性”等数字新闻价值标准。新闻从业者从过去的“作品思维”向“产品思维”转变，重要区别在于更关注受众在数字时代的需求，借助算法敏锐地感知特定受众群体在具体时空情境下的全方位需要，然后借助多种媒介形态与技'
  - '[PAGE 206]


    术手段贴近并满足受众需求。


    其二是人作为新闻“价值主体”地位的凸显。当数字技术全方位地渗入新闻生产各环节后，人与技术的共在与协同互动变得不可避免，那么如何理解并处理新闻价值把关中人与技术的关系就成为新闻理论研究的重要命题。一方面，算法等技术拓展了人的能力边界，通过信息搜集整合、量化用户反馈等方式帮助从业者更高效地做出价值判断，催生“可分享性”“互动性”等数字新闻价值要素成为“影响力”“时新性”等传统新闻价值解构后的替代方案。另一方面，技术的普及使中国当下的媒介环境变得更加鱼龙混杂，专业新闻媒体的公信力面临挑战，同时现有智能技术水平难以实现中国语境下对新闻价值的准确把关，这促使从业者更加强调“沟通性”“透明性”“建设性”等需要借助自身素养与主观经验来把关的新闻价值要素，以推动新闻发挥维护社会效益、引领社会风气的职能，进而彰显自身作为人、作为专业新闻工作者的主体性。虽然有学者指出，算法技术通过优化迭代以及对人的“驯化”也体现了一定独立于人类的主体性①，但结果显示，目前技术逻辑尚未能渗入从业者新闻价值判断的核心过程——在中国语境下，新闻工作者感知到技术介入后更倾向于回归经典价值要素，并在数据量化结果和主观判断出现冲突时将后者作为价值底线。


    最后，虽然传统媒体与新媒体之间的界限趋于模糊，但媒介形态与机构属性依旧对从业者的价值判断产生了一定的影响，传统媒体依旧承担着弘扬主流价值、维护社会效益的主要责任，而新媒体则面临着更多的生存与竞争压力，在新闻生产中也更多地使用技术辅助，因而更强调“情感性”要素，以便与市场化机构以及用户生产内容竞争有限的受众注意力资源，同时在主观上对内容的情感倾向与价值进行把关。'
