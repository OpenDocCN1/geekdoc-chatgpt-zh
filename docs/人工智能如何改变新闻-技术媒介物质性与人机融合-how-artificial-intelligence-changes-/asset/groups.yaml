    “技术/邮递模型”（postal model）和“人际/性合模型”（erotic model）。前者借用古希腊神话中赫耳墨斯的信使角色，认为早期的信使扮演着媒介的角色，信使在两人之间传递信息但是从不改变信息的内容；后者则认为为媒介在中介过程中促进了两人的对话，从而实现了理解和融合。这两种模式在分析媒介性作为中介作用的本质特性时，都强调传播的二者之间存在差异，但前一种模型强调传播是在空间和物理距离中建立关系，虽然在交流中两人的个体差异无法消除，却反而能突出传播的对称性和间接性，从而凸显媒介作为传播过程中介的必要性；而后一种模型虽然消除了个体内部的差异，但当两人的差异得以消弭时，作为传播工具的媒介也就可以被忽略了，因此媒介处于外围地位。虽然这两种模型存在于各种传播和沟通中，但是克莱默尔更加强调技术/邮递模型，因为在其中媒介是信息传递的必要前提。


    结合基特勒和克莱默尔对媒介物质性的思考，我们可以发现，新闻传播的过程其实是符号在人与技术所构建的中介性关系网络中被物质化的过程。如果说基特勒的技术物质性更强调新闻的生产过程的话，克莱默尔的传播的物质性则更加关注新闻的传播过程。数字媒介技术的发展使得新闻的生产和传播的过程越来越无法分离，生产者和传播者的角色发生互换，而技术也逐渐取代人的角色，在内容逻辑和技术逻辑的矛盾中共同建构着新闻关系网。


    那么，在新闻学研究的物质性视角下，又该如何理解数字时代的人与技术、传播者与受众、媒介与社会的关系呢？以媒介的物质性和中介特征为基础，结合数据作为重要的物质在新闻传播中的作用，我们引入一种从数据的物质性视角出发，将人与技术、传者与受者融合的中介社会传播模式（mediated
    social communication，德语 sozial-zeit kommunikation），从而突破传统大众传播模式在分析新闻生产和传播中的限囿，建构符合数字时'
