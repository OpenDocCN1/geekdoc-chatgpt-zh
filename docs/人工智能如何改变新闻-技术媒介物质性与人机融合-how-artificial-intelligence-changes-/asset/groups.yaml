    ## 第三节 人工智能技术与新闻变革


    当下以头条等新闻 App 为代表的智能媒体平台依托算法技术，根据用户兴趣与需求，并借助移动终端来推送新闻。这种生产方式的转变不仅意味着传统记者、编辑根据日常积累所总结的新闻价值来收集、编辑加工的新闻生产方式已经发生了根本的变化，而且还改变着新闻生产者之间以及人与技术之间的关系。算法工程师的加入也冲击着内容生产者的地位。在这个过程中，人与技术的矛盾不断凸显。也正是在技术创新的要求下，媒体面临着巨大的考验，对技术人员的需求也变得越来越多，而传统的内容生产人员却面临着技术带来的众多考验。在市场化竞争的压力下，众多媒介机构甚至更加重视技术人员，而作为“把关人”的内容生产者在媒体中的地位也因为媒介技术革新而发生了巨大的变化。


    纵观媒体的发展过程，技术在其中扮演着重要角色。印刷术带来的是口语传播向书面传播的改变，这一传播技术的变革也造成了传播的符号形式与关系结构的改变，人类社会由罗格斯域迈向书写域，原本在口语传播时代占有重要地位的演说等技能也被印刷技术所取代，由此也带来社会结构与权力关系的变化，而作为传递意义主体的相关机构的人员在社会中的地位和意义也随之发生变化。①


    尽管技术对社会及生产关系产生影响需要一定的社会环境，技术自身已经在社会变迁中占有重要地位，但是一味依靠技术逻辑而忽略道德和法律的规约又是危险的，技术的过度膨胀可能会给社会带来负面影响。因为当技术的地位上升到一定高度时，智能媒体平台又会因为过度依赖技术而失去应有的公共性备受社会指责。于是，技术的重要性又被降低，而传统的采编人员又重新回归新闻生产过程，只不过他们此时的地位已经变成了新闻质量的检验者，在新闻信息进入算法通道前，进行质量把关与事实核查。


    ① 德布雷．普通媒介学教程 [M]. 陈卫星，王杨，译. 北京：清华大学出版社，2014：48.


    从整个新闻生产和传播的流程来看，大数据和智能技术只能部分参与其中，负责诸如新闻内容抓取、新闻价值判别（主要基于内容来源和相关程度）和部分事实核查等任务，而新闻标题制作、内容摘要、影响力和反常性与冲突等新闻价值要素的甄别，以及机器无法准确完成的事实核查，都只能交由人工研判。近年来，智能生产中的“隐性工作”不断浮出水面。为了保证智能识别系统的有效运行，大量工人隐藏在系统背后，进行低难度和高重复度的“打标签”工作，将数据“喂给”系统，才能让智能新闻识别系统准确读取文字和图像，进而进行深度学习和数据处理。在这一过程中，人与技术共同发挥着作用。


    ## 第四节 新技术条件下的新闻


    面对新技术带来的挑战，新闻业也发生了翻天覆地的变化。算法开始取代人工进行新闻信息的自动收集、筛选、加工和分发，也让曾经处于新闻生产核心地位的人产生了危机感，报纸即将消亡、编辑记者将被机器所取代、新闻行业即将告别历史舞台等焦虑不断迭起。在技术不断加速进步的同时，其实更为重要的是回过头去重新审视新闻从何而来，纵观历史变幻或许可以发现新闻的未来。


    虽然英文中的“news”与“journalism”这两个词主要对应中文里的“新闻”一词，但从定义上有必要对二者进行区分，因为只有这样才能看清未来的技术发展变革会对新闻带来什么样的影响。英文《韦氏词典》中
    news（新闻）对应三个含义：


    - (1) 对新近发生事件的报道；先前未知的信息；

    - (2) 在报纸、新闻期刊或者新闻节目中被报道的材料；

    - (3) 值得报道的事情。


    而同样被译作“新闻”的 journalism（新闻业、新闻学）一词的内容却与之稍有区别，具体指：


    - (1) 通过媒体所呈现的新闻采集和编辑；

    - (2) 大众报刊；

    - (3) 对收集和编辑新闻或者新闻媒介管理的学术研究。


    从新闻的历史上看，journalism 的出现比 news 更晚。news 可以溯源至人类文明伊始，对新发生的或者未知信息的传递一直伴随着人类发展的步伐。而作为新闻业的
    journalism 是伴随着第二次工业革命的进程而产生的。在这之前，搜集新闻、集中处理并发布至各地常常是官方特定机构或者商人来完成的工作，并没有形成特定的职业。而第二次工业革命之后，技术的革新推动了生产力的进步，为了适应机器时代的生产，流水作业等劳动形式被发明出来，大量劳动也实现了分工。专职从事新闻内容搜集和加工的编辑和记者也从过去的商人和小手工业者等兼职者中分化出来，这个职业形成至今，仅仅有两百多年的历史。在智能技术所带来的工业
    4.0 时代，技术的变迁已经完全打破了传统的职业分工，新闻生产者的角色也变得更加多元，互联网与社交媒体等新技术平台推动着更多的非职业化内容生产者加入，使得他们成为丰富内容的重要来源。通过平台的关联，内容生产者和消费者更加便于进行身份的互换和转换，从而也打破了大众传播的二

