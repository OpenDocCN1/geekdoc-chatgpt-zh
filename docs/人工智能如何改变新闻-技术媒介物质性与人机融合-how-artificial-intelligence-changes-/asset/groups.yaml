    开放式编码（open coding）是扎根理论编码过程的第一阶段，目的是结合相关文献，从资料中提取相关概念和范畴，并确定范畴的属性和维度。


    在这一阶段，研究者应当要尽量抛弃自身的成见，将所有原始资料打散后进行详细分析，保留资料中可以进行编码的原文，不断比较并进行理论化。


    具体而言，首先使用语音转文字软件将访谈音频转换为文字，并对所得文字进行修正和梳理，剔除与本研究明显无关的内容，得到访谈文本，再将文本以句子为单位进行划分，逐句编码，形成初步概念；其次对概念进行优化、分析和筛选，把同一类属的概念聚集起来，形成属于同一范畴的概念丛；最后对概念丛进一步概括并抽象化。经过这一系列步骤，最终共提炼出
    43 个概念，然后对其命名，并描述其性质。在此过程中研究者借鉴了多个已有的学术概念，并在后文中针对关键概念进行主轴式编码的目的是进一步提炼和区分这些概念，从已有的范畴中选择出最能体现文本主题的范畴，再回到原始资料中将这些主轴范畴与相关文本联系起来，检验其提取的真实性和可靠性。通过这个过程，合并次要范畴，提炼主要范畴。最终，本研究共提取
    11 个范畴（见表 3 - 2）。


    | 主轴式编码（范畴化） | 开放式编码（概念化） | 资料整理（定义现象） |

    |---|---|---|

    | 人对算法的干预 | 新闻排序干预 | 人可以调整任何一条新闻的推荐排序 |

    | | 新闻分发干预 | 人可以决定新闻向哪个受众群体分发 |

    | | 生产次要内容 | 算法写的新闻都是相对不重要的新闻 |

    | | 制定算法规则 | 算法的运行规则是由人来制定的 |

    | | 提高推荐精确度 | 人工打标签生成的数据把相关内容特征和用户行为反馈给算法，让算法更准确地推荐新闻 |

    | 人的社会属性 | 工作经验优势 | 我们本身的工作经验告诉我们应该怎么做，这需要我们长期的工作积累 |

    | | 信息前瞻性 | 人可以提前得到一些事件的消息，并对此类事件的新闻进行运营部署 |

    | | 社会资源优势 | 记者本身的媒体资源和对信息源的掌握对新闻生产很重要 |

    | 人的主观能动性 | 判断能力 | 记者能对信息的重要性进行判断，人的判断能力是无法被取代的 |

    | | 分析能力 | 记者能看到隐藏在数据背后的内容，要对海量的数据进行分析 |

    | | 认知理解能力 | 记者能联系事件发生的背景等因素，对其进行深度报道性质的解读 |

    | 新闻价值考量 | 时效性 | 人在新闻生产的所有环节都被要求快一些，不同公司也会竞争发稿速度 |

    | | 接近性 | 记者在采写新闻和分发新闻时考虑是否与受众有心理上的接近和地理上的接近 |

    | | 重要性 | 采写新闻时会考虑新闻内容是否重要 |

    | 新闻制作 | 精细化分工写作 | 有专门记者写事实性内容（报道），有专门记者写解读性内容（报道），有专门的人来写 push 的标题导语，算法会（抓取）写一些财经类、体育类事实性内容（报道）
    |

    | | 全过程过滤 | 算法参与的每一个新闻生产阶段都会过滤一遍内容 |

