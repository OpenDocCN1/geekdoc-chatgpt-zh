    \ 北京: 北京大学出版社, 2008: 62 - 64.\n⑥ 李良荣. 新闻学概论 [M]. 上海: 复旦大学出版社, 2001.\n⑦ 陈冉. 基于\
    \ 5G 技术场景下新闻价值的变化分析及反思 [J]. 记者观察, 2021 (26): 67 - 69.\n⑧ 郝雨, 任占文, 郭峥. 马克思主义新闻价值观建构与公共性拓展\
    \ [J]. 全球传媒学刊, 2017, 4 (3): 44 - 60.\n\n对新闻价值要素的确定也成为学界的重要议题。早在 1922 年，李普曼就将“耸人听闻、接近性、相关性、明确性和真实性”作为新闻价值的因素。①\
    \ 1965 年，加尔通和鲁格又提出了包括时效性、不寻常性、影响力、接近性、显著性、冲突性和灾难性的一套价值要素，后成为学界中最经典也是最具影响力的一种新闻价值分类标准。②\
    \ 随后其他学者在此基础上不断进行改良完善，提出了新闻价值构成的多个版本，如舒尔茨（Ida Schultz）将“时效性、相关性、可辨识性、冲突性、情感性和独家性”列为六种首要新闻价值要素③，希伯特（Ray\
    \ Hiebert）等论述的“时效性、接近性、显著性、重要性和人情味”，经实践检验成为美国新闻界普遍承认的“五要素说”④。\n\n伴随着西方新闻价值理论被引进中国，中国学者对西方传统新闻价值标准进行了本土化的解读与补充。其中，对中国本土的新闻实践产生了重要指导意义的是陈力丹在其著作《新闻理论十讲》⑤\
    \ 中阐释的新闻价值的 10 个要素，包括：\n\n① LIPPMANN W. Public opinion（Vol. 1）[M]. New Jersey:\
    \ Transaction Publishers, 1946.\n② GALTUNG J, RUGE M H. The structure of foreign\
    \ news: the presentation of the Congo, Cuba and Cyprus crises in four Norwegian\
    \ newspapers [J]. Journal of peace research, 1965, 2（1）: 64 – 90.\n③ SCHULTZ I.\
    \ The journalistic gut feeling: journalistic doxa, news habitus and orthodox news\
    \ values [J]. Journalism practice, 2007, 1（2）: 190 – 207.\n④ HIEBERT R E, UNGURAIT\
    \ D F, BOHN T W. Mass media: an introduction to modern communication [M]. New\
    \ York: Addison-Wesley Longman Ltd, 1988.\n⑤ 陈力丹. 新闻理论十讲 [M]. 修订版. 上海: 复旦大学出版社,\
    \ 2020.\n\n- (1) 事实发生的概率越小，便越有新闻价值。\n- (2) 事实或状态的不确定性越大，减少不确定性的事实或信息，便越具有新闻价值。\n\
    - (3) 事实的发生与受众的利益越相关，越具有新闻价值。\n- (4) 事实的影响力越大、影响面越广、越能立即产生影响力，这三个条件越同时存在，便越具有新闻价值。\n\
    - (5) 事实与接受者的心理距离越近，便越具有新闻价值。\n- (6) 越是著名人物，其身上发生的事实越具有新闻价值；越是著名地点，那里发生的事实也越容易引起受众的关注。\n\
    - (7) 凡是含有冲突的事实，多少都有新闻价值；内含的冲突越大，越具有新闻价值。\n- (8) 越能表现人的情感的事实，便越具有新闻价值。\n- (9)\
    \ 越具有心理替代性的故事性事实，越具有新闻价值。\n- (10) 事实在比较中带有的反差越大，越具有新闻价值。\n\n这 10 个价值要素不仅包含对西方新闻价值的本土化转介，还在传统西方新闻价值“传者导向”的基础上加入了受众心理的视角。如“减少不确定性”强调，受众对新闻的需求有时是为降低自身对环境的不确定性，而新闻的价值正体现在新闻信息满足受众此类需求的特性中。或者说，受众的“导向需求”是新闻价值得以体现的前提。①\n\
    \n值得一提的是，近年对新闻价值的相关研究中开始出现对这种“清单罗列”式的价值要素分类的批评和反思。学者或从方法论层面切入，提出具体价值表现的列举在逻辑上难以穷尽，应转向更根本的价值分类方式，兼顾新闻的工具价值和目的价值②；或从哲学层面将“价值”与“价值观”进行区分，将马克思主义理论中的公共性引入新闻价值的探讨，将公共性视为新闻业的价值合法性基石，呼吁关注新闻价值理念对从业者的根本方向指引③。然而不可否认的是，在新闻专业教育与业界实践中，直\n\
