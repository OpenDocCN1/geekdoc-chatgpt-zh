    动，至 2022 年 12 月中旬完成，主要采用德尔菲法（Delphi method），对 36 位中国各类新闻媒体一线工作者进行多次函询，结合深度访谈，以探索数字时代新闻价值要素发生的变化。


    德尔菲法又称专家咨询法，自 20 世纪 50 年代由美国兰德公司开创以来，已广泛应用于几乎所有的社会领域。① 这一方法的特点是专家组成员的权威性和匿名性、预测过程的有控趋同性，以及预测统计的定量性。②
    具体而言，通常经过若干轮对专家的函询，将其观点进行聚焦、归类和具体化，最终专家会达成相当程度上共识并将其作为研究结论。


    由于新闻从业者进行新闻价值判断的依据常常出自“直觉”③ 而难以具体说明，这里通过对接受函询的新闻工作者的“工龄”“工作单位”和“新闻领域”进行筛选，采用主观分析法判断其在新闻价值判断领域的“权威程度”，而非德尔菲法在公共卫生等领域应用时的量化加权。


    # (一) 函询对象


