    ## 第四节 智能新闻生产实践中的“人-技协同”


    智能新闻生产相较于传统的新闻生产，最大的不同是，算法不再仅以工具的属性，而是以主体的姿态参与其中。正如斯蒂格勒所认为的，技术源于人类先天的不足，两者并不彼此独立，也不是创造与被创造的关系，而是互为起源，共同进化。新闻从业者和算法技术以彼此可以理解的方式进行互动和合作，共同塑造了智能新闻生产的底层逻辑。①


    ### 一、合作共生：“人-技协同”的实现途径


    智能新闻生产得以实现需要两个维度的物质性基础设施支撑。第一个维度指算法需要服务器、电脑、电力等物质条件，即“信息和数据得以生产、存储与流动所需要的物质材料、技术结构、能源供给及其社会组织方式”①。这些材料不仅是智能新闻生产得以实现的必要条件，其中也包含了人与算法得以进行沟通的物质条件，如以电子屏幕为代表的交互界面等。第二个维度指广义上的数字技术。作为建构当代技术社会的核心特征，其已经成为跨越实体与虚拟、强调人和物的关系，具备嵌入性和基底性的基础设施。②在中国的语境中，可具体化为“以技术创新为驱动，以信息网络为基础”的新型基础设施，如以
    5G、物联网、工业互联网、卫星互联网为代表的通信网络基础设施等。③ 算法作为技术的一种，既属于此类基础设施，也是智能新闻生产领域的核心要素。


    在规则建构层面，算法技术为人设定了操作规则，人在遵从规则的基础上调整传统从事新闻生产的行为逻辑。在实践过程中，算法因其自身的局限性需要依托于人才能够使得新闻生产顺利进行，主要体现为人需要设定一系列规定和协议。如在信息获取环节中，算法若想抓取某一媒体平台的信息，可能需要与该平台做技术上的打通，还要与该媒体签订有关信息获取的协议。除此之外，人要设定算法的抓取规则、抓取平台和抓取内容的格式，否则即使算法抓取到了信息，也可能出现错误。例如，当某一企业所公布财报的行文格式与之前所公布的格式不同时，算法可能会发现其有所变动，但依然可能抓取到错误信息，这部分则需要人工进行调节。在新闻制作环节，目前阶段的算法更像是在做“填空题”，根据人设定的模板编辑内容、行文结构甚至是用词都高度固定的新闻，并且要求所抓取到的信息组成结构也高度固定，而人只能服从于算法运行的逻辑：


    我们的 App 上发主站的文章，他们要求我用固定格式来写东西，就是照着他的规则填，我们要填类似于导语一样的东西，可能还要填图片来源、作者、首发来源。然后网站就可以自动抓取
    App 的信息，也可以互相转载。（Z6）


    在新闻审核环节，算法需要持续学习以满足新闻审核的要求。以腾讯新闻的算法为例：


    算法是通过模型来做一些训练，需要给它提供很多标准。比如说我首先提供 2 万个样本，告诉它这一条是安全的，那一条是不安全的。算法逐渐能识别出一些东西，这是一个很漫长的过程。而且按照现在的算法来说，这些东西都是需要不停地训练的。我们现在也是在对它进行不断的训练。第一个是因为新闻每天发生的可能是不一样的事儿。第二个是因为模型是会退化的，就是发现这个模型的准确率在下降。比如说这是一个完全新的事情，以前根本就没有这个词，这就是算法需要学习的，算法必须得保证时刻地学习才能跟得上。（Z3）


    在初始阶段，算法根据人工设定的敏感词汇、文章的完整程度、内容质量（如是否涉及低俗内容等）等对新闻进行评价和过滤，再由人工核查其准确程度，这一过程需要大量的人力和算力才能够实现。之后，因为目前的算法只能识别出自己学习过的内容，而不能对新创造的词汇、事件进行精确判断，所以算法通过平台运营者或编辑等更新词库和判断规则、通过外包团队以打标签或抽样分析的方式进行反馈修正自己的评价标准、通过受众的实时反馈修正自己的计算标准。这三种方式动态地、持续地发挥作用，不存在时间上的先后顺序。


    在目的导向层面，人与算法既要保证自身目的的实现，又要保证智能新闻生产实践目的的实现。新闻业作为社会系统的组成部分其自身具备工具属性，这也是新闻业的合法性来源之一。因此，人通过自身直接参与新闻生产实践和依据自身需求调整算法两种方式体现其目的性。算法则一方面在满足人的需要的同时保证自己的底层逻辑的稳定性，另一方面依赖人保证信息的可获得性，并通过这两方面来支撑自身的运行逻辑和新闻生产的实践需求。


    算法的底层逻辑是不可撼动的，之前设定好的规则部分也比较难变动，能动的更多的是比较浅层次的内容，这部分根据（人）不同的需求做不同的改进，或者说对技术进行调整。（Z5）


    此外，算法还需要有大量的用户互动和内容生产支撑其不断反馈用户行为、精确用户画像，提高内容处理能力和推荐能力。对于用户，算法根据每一个用户的画像准备了用户可能喜欢的内容候选集。算法从候选集中选出部分内容并进行过滤——如这些内容是否已经重复出现、是否匹配该用户当前使用的终端等，过滤后的内容都可以展示给用户，但算法首先会对内容进行粗排，再根据用户对每一条内容的点击率、停留时长、是否点赞和分享等行为进行预估，形成指标，根据指标排序，最终推荐给用户。对于新闻内容，当新的内容出现在平台上时，算法首先将其推荐给小部分用户，根据这部分用户的反馈对内容形成更为精确的评估，再决定是否将其放入更多用户的候选集中。以上这两部分互为支撑，如果没有足够多的内容，就不能得到更多的用户反馈，也就无法留住用户；如果没有足够多的用户，产出就无法更为精确地被投放。以上的过程不涉及人工的直接操作，但是人工会通过设定过滤规则等方式参与其中。


    一个平台如果它没有那么多的内容，可能刷一个小时就到底了，你会刷到你前一天已经刷过的内容。所以在这种情况下，它就很难说做特别精细化地打分和过滤。如果没有很多的用户去帮你做这个事情，你可能在冷启动阶段就已经把所有的用户或者大部分的用户都给布置一遍了。所以这个会依赖于有比较大的用户的体量，以及有比较多的内容。（Z5）


    尽管当前仍处于弱人工智能时期，但是通过上文的讨论可以发现，无论是在从业者实践的语境中还是具体的操作过程中，人与算法都处在相对“平等”的地位，两者的有效合作成为保证智能新闻生产得以实现和存续的根本条件。整个智能新闻生产离不开人的参与，特别是在算法的设计、开发和训练阶段，因为就目前的技术水平而言，技术还无法实现真正的自我学习和自我更新，在众多智能生产的背后，仍然需要大量人力的投入。同时，从控制论的角度来讲，人、算法以及相应的基础设施机器，都共同嵌入一个智能系统中，都需要遵循系统的准则。特别是人与技术在交流过程中，都需要按照技术逻辑架构做“填空题”，将机器能够识别的标准化内容转化为代码“喂”给机器，通过反馈系统不断调试算法的准确度，并在中央控制系统中进行统一调配。


    ① 束开荣. 互联网基础设施：技术实践与话语建构的双重向度：以媒介物质性为视角的个案研究 [J]. 新闻记者, 2021 (2): 39-50.

    ② 张磊, 贾文斌. 互联网基础设施研究: 元概念、路径与理论框架 [J]. 中国社会科学院研究生院学报, 2021 (5): 22-32, 145.

    ③ 章戈浩, 张磊. 物是人非与聆思人: 媒体与文化分析的物质性转向 [J]. 全球传媒学刊, 2019, 6 (2): 103-115.


    ### 二、打破界限：智能新闻生产的形态塑造


    图 3-2 为根据编码后的关键词提取所绘制的新闻生产过程图。从当前的新闻实践来看，新闻生产已经走出传统的新闻编辑室。大众传播时代的新闻生产活动以狭义的“生产”，即新闻采写等新闻内容制作为核心，但在智能时代，新闻制作只作为整个新闻生产流程中的关键环节之一，新闻分发、新闻内容的扩散与受众反馈的重要性却显著提升。新闻生产也不再是线性的、封闭的过程，算法、打标签的外包团队和受众以更为直接的方式参与其中，影响了新闻制作和分发等过程。同时，由新闻记者掌控的职业新闻的边界被部分解构——其本身可能本来就没有明确的专业壁垒①，或在职业边界构建方面存在着不足②——专业主义话语在实践层面更为弱化。智能新闻生产虽然拓展了新闻记者的工作范围，包括对新技术的使用、对大数据相关内容的分析、对新闻分发对象的判断等，但记者不得不让渡更多新闻生产的权利给技术和新闻编辑室之外的人，这不仅使记者的身份定位变得模糊——记者、编辑和平台运营者彼此的职责范围相互重叠，也因此让新闻业在实践层面进行自我建构的过程中受到来自内部的挑战。


    ![](img/228cf445208423908042e1490b71df9d_117_0.png)


    ### 图 3-2 新闻生产过程图


    从过程图中还可以发现，算法不再仅仅是新闻编辑室中职业新闻从业者的辅助工具，而是渗透到新闻生产的各个环节，形成了“你中有我，我中有你”的动态合作关系。在新闻生产实践中，其一，很难将信息监测与获取、新闻制作和分发等阶段完全分开。获取信息既是为新闻制作提供材料，也是为评估社会热点和刻画受众画像，使新闻分发更为精确；新闻制作过程既发生在获取信息之后，其本身也将作为信息以供新闻内容制作使用；新闻分发的同时反馈用户信息，还将影响下一次信息获取、新闻制作和分发。


    其二，新闻生产的各个阶段都是通过人与算法的合作紧密联系在一起并互相影响的。很难将算法从人的实践活动中剥离出来，明确指出哪一部分工作是由人独立完成且不受算法影响的；反之亦然。除了显性的分工之外，人和算法之间围绕新闻生产进行着多维度的“沟通”和“互动”。在实践过程中人已经适应了算法的工作逻辑，如“打标签”采用的形式是对“现在屏幕上的内容做选择题或者打分”(Z3)；“发布新闻时要有严格的操作顺序，在指定地方填写标题、导语”(Z4、Z6)；“人工干涉新闻排序的方式是在后台调整新闻的某些评价赋值”(Z3)等。同时，算法也以人可理解的形式为人工提供调试和介入的“接口”，在不改变基本框架的前提下不断训练以满足人的需求，并且“允许”人介入算法新闻生产的任何一个环节。从这个角度来说，算法已经不仅仅是记者的辅助工具，其在客观上嵌入了新闻生产实践中并成为重要的参与者。


    其三，人与算法的有机合作不仅形塑了新闻生产的新形态，也深刻改变了新闻审核的机制，人机合作的“新闻把关”已经成为现实。传统新闻编辑室中“把关人”的角色与功能被分散在各个环节中，甚至当新闻分发出去之后，人工还要对其进行复审。审核过程中人和算法各有分工，算法根据敏感词库等一系列规则对新闻进行评估过滤；人针对新闻内容的真实性、是否有吸引力、是否有病句等问题进行审核。承担这项工作的不仅包含记者、编辑等直接接触到新闻生产环节的人，还有大量的审核团队负责为新闻内容做标记，即“打标签”。人工做的标记一方面是为了审核新闻内容，另一方面也是在辅助算法更好地刻画用户画像，以进一步提高个性化推送的精确度。此外，人和算法的所有操作痕迹都将以数据的形式记录下来，作为之后复查或归责的凭证。正如
    Z3 在访谈时所说：


    > 我编辑去推送的时候也会去判断一下，以及算法写稿输出的这些稿件一般也会有人去审。谁做的（写新闻稿件），他自己也会对输出的内容做一个把控，所以这部分其实是有审核的，而且对于质量的审核，是运营本身的基础工作之一，是因为我们要对它负责，这部分分我们审核出来的东西，我们发的时候是带有我们自己的审核的，比如说它确实有问题了，我们是可以找到是谁审核的。（Z3）


    ### 三、新闻价值：人与算法技术的价值交锋


    数字技术的不断发展和对传统新闻生产实践的冲击不断地消解着传统新闻业专业性背景下的新闻客观、中立等价值崇拜。① 人与算法的协同进一步彰显了新闻的重要性、接近性、时效性等新闻价值，为当下关于新闻价值的讨论提供了新的思路。进一步来说，人与算法的互动是如何构建出当下新闻价值的内涵的？


    首先，新闻价值的重要性要素的表现形式和内涵有所拓展，判断“何为重要内容”的权利部分让渡给算法和受众。对于人这一方面，除了和传统的新闻记者类似地通过自身从业经验和对新闻价值的判断，在信息获取、新闻制作方面进行判断和选择，还会通过影响新闻推荐的顺序以决定哪些新闻是重要的。在表现形式上，人会选出自己认为有价值的新闻，使其在网页较为显著的位置停留较长时间，而不随着算法推荐的逻辑进行更新。


    人工的分发相当于一些固定位，当然一般对外的口径来说，这个平台的热榜都是由算法来进行排序的，但是每家的热榜其实都留了人工干预的口，这个也就是说人工可以干预网页的任何位置，如果仔细观察的话，你会发现有一些大事情它的热度还没有足够高的时候，就会出现在热搜的第一名。(Z3)


    在算法的视野里，热点信息等于重要信息，用户数据成为测算“热点”的唯一依据，新闻价值的重要性要素被量化成诸多指标。在人与算法互动的维度，算法只能以自己可理解且记者不得不接受的方式，即以数据化的形式对“什么是重要的内容”这一问题下定义；在新闻生产的维度，人依赖算法获取新闻素材，算法则依据自身逻辑对网络上的信息进行监测和抓取，也就是说记者所获得的素材是算法认为重要的信息；在与受众互动的维度，除了人为设置的热点外，其他热点内容的产生是因为该内容短时间内获得了大量流量，即有大量用户观看、评论或转发等。由此，算法逻辑下数据成为判断新闻重要性的决定性依据之一，即重要的新闻近似等于受关注度高的新闻，这一逻辑进而影响了人对新闻重要性的理解。


    其次，新闻的接近性要素在新闻生产流程中因算法而得到强化。新闻的接近性指新闻内容在地理和心理上与受众较为接近，具有一定的相关性，所以能够引起受众的关注。① 在传统的新闻业中，新闻工作者只能通过自己有限的精力和对部分受众群体的了解决定生产和分发可能与之相关的内容。但在智能新闻生产流程中，由算法逻辑驱动的新闻分发和推荐过程更加精确化，这是传统新闻业所无法实现的。算法在内容生产者和受众之间搭建了数据化的“沟通桥梁”，即算法可以掌握每一位用户的个性化数据，并实时收集用户对所生产内容的反馈。基于此，算法本身在进行内容的筛选和推荐排序时也可更精确地将其投放给用户，记者则可以更具有针对性地生产和分发内容，部分媒体公司还按照地域设置了不同的运营小组，负责搜集、编辑、发送与该地域相关的新闻。


    我们的工作是分地域的，比如负责北京市的人就只需要找北京相关的新闻。我们会有一些工作群，比如说总群会发一些编辑觉得非常重要、现在马上要推的新闻，我们就把它们转发到对应的地域的负责人那里。（Z4）


    ① 胡正强. 正确理解新闻接近性的内涵 [J]. 当代传播, 2005 (5): 9- 11.


    由此也给本研究中所讨论的新闻生产的范围划定提供了一定合理性，若不将视野扩展至新闻编辑室之外的其他环节，可能就无法更为客观和深入地理解当下的新闻实践和新闻价值。


    最后，新闻的时效性要素被算法加强，但是其表征却被隐藏起来。从表面上看，新闻的时效性有所弱化，实际上是因为新闻生产在一定程度上已经突破了时间的限制，即从时新性向实时性转变。①
    其一，算法自身通过不断迭代升级，提升信息搜集、新闻制作和分发的速度；其二，人在算法的辅助之下提升了工作效率；其三，算法的效率导向使得新闻生产内部的分工更为精细化和专业化——尽管新闻审核和过滤的过程贯穿始终——如部分商业媒体中分析数据的记者只负责分析数据，写事实类信息的人只负责整合信息，这些信息则交由其他记者制作成新闻，此外还会产生大量“打标签”的人。同时，部分财经类媒体出于商业利益考量，同样高度重视新闻的时效性，其与竞品媒体公司发布一则相同资讯的时间往往只有数秒之差。


    和竞争对手比起来，我们的优势在哪里？可能就是我比他们发一个数据早了几秒钟。你的信息比其他人来得快，哪怕只有一秒钟，其他的人就可以提前做交易的决策，这就是区别，就是钱。（Z1）


    因此，一方面，技术理性驱动的数据为王的逻辑一定程度上让新闻的流量等同于新闻的重要性，并使得新闻的接近性与受众更相关、更易于实现，而技术对效率的追求则缩短了新闻生产各个流程的时间，甚至消弭了新闻的时效性。另一方面，人基于新闻生产的市场逻辑和新闻从业者的社会责任选择新闻生产的选题和内容、干预新闻推荐和排序以进行显性议程设置，算法与人基于不同的逻辑作用于新闻生产实践过程中，二者共同塑造了新闻价值的内涵。


    ### 四、“主客”之辩：人的主体性与算法自主性


    哲学范畴中的主体指“认识活动和实践活动的承担者”，主体性指“作为认识活动和实践活动的主体所具有的本质属性”①。在智能新闻生产领域，部分学者延续马克思的思路，认为“主体性是属人的，不是属物的”②，算法技术由人来创造，所以在智能新闻生产的过程中算法技术只是在表象上出现了“拟主体性”，人仍然是唯一主体。马克思在《1844年经济学哲学手稿》中是从人与人的劳动的作用对象，即自然之间的关系出发讨论主体性的：“正是在改造对象世界的过程中，人才真正地证明自己是类存在物”，“人的感觉、感觉的人性，都是由于它的对象的存在，由于人化的自然界，才产生出来的”，也就是说，人只有将自己的本质对象化才能够确证人的主体性。所以，技术——尤其是现代工业的发展——及其产物作为人的对象性存在本应是人的本质的反映，但是这一对象性存在作为“异己的存在物”和“不依赖于生产者的力量”同劳动相对立，即劳动被异化。随着异化程度的加深，工人被贬低为机器、沦为机器的奴隶。①
    他在《德意志意识形态》中进一步阐明人的劳动产物聚合为不受控制甚至统治人类的、驱动历史发展的主要因素之一，“这种力量压迫着人，而不是人驾驭着这种力量”②。尽管马克思是站在阶级的视角考察技术，并最终强调造成异化和剥削的是掌控技术的资本家，但正如兰登·温纳在《自主性技术》中对马克思等学者的回应，“精英或统治阶级的特权地位不是他驾驭这个机械系统的证明，而只表明他有一个舒适的座位而已”，相对于整个系统的运行和发展来说，“主人”的统治地位不是决定性的。③


    但是，这些共同属于“主体-客体”的话语本身就包含了“主体是目的，客体是手段，主体与客体是控制与被控制的关系”④ 的前提，因此算法技术自然就是被人控制的工具。控制的过程是人主观能动性的体现，主观能动性是主体性的主要表征，又因其是人的本质属性之一，如此一来主体性自然就只属于人了。⑤
    这些分析的出发点是先验地将主体性赋予了人，把物排除在外，这近似于循环论证的过程。此外，海德格尔目睹了现代技术带给人类的灾难后，质疑以工具论的视角审视技术的本质——被人类创造出的工具为何反而对人类造成危害。⑥
    雅克·艾吕尔同样发现这无法解释高速发展的现代技术：如果技术是人的工具，为何人不能够控制技术的发展方向且不能把握技术发展所引起的种种后果？事实是，“人被整合进了技术进程


