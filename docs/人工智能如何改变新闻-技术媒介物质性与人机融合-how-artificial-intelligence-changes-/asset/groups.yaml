    开放式编码（open coding）是扎根理论编码过程的第一阶段，目的是结合相关文献，从资料中提取相关概念和范畴，并确定范畴的属性和维度。


    在这一阶段，研究者应当要尽量抛弃自身的成见，将所有原始资料打散后进行详细分析，保留资料中可以进行编码的原文，不断比较并进行理论化。


    具体而言，首先使用语音转文字软件将访谈音频转换为文字，并对所得文字进行修正和梳理，剔除与本研究明显无关的内容，得到访谈文本，再将文本以句子为单位进行划分，逐句编码，形成初步概念；其次对概念进行优化、分析和筛选，把同一类属的概念聚集起来，形成属于同一范畴的概念丛；最后对概念丛进一步概括并抽象化。经过这一系列步骤，最终共提炼出
    43 个概念，然后对其命名，并描述其性质。在此过程中研究者借鉴了多个已有的学术概念，并在后文中针对关键概念进行主轴式编码的目的是进一步提炼和区分这些概念，从已有的范畴中选择出最能体现文本主题的范畴，再回到原始资料中将这些主轴范畴与相关文本联系起来，检验其提取的真实性和可靠性。通过这个过程，合并次要范畴，提炼主要范畴。最终，本研究共提取
    11 个范畴（见表 3 - 2）。'
