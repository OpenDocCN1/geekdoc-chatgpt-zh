  - '[PAGE 114]


    编辑内容、行文结构甚至是用词都高度固定的新闻，并且要求所抓取到的信息组成结构也高度固定，而人只能服从于算法运行的逻辑：


    我们的 App 上发主站的文章，他们要求我用固定格式来写东西，就是照着他的规则填，我们要填类似于导语一样的东西，可能还要填图片来源、作者、首发来源。然后网站就可以自动抓取
    App 的信息，也可以互相转载。（Z6）


    在新闻审核环节，算法需要持续学习以满足新闻审核的要求。以腾讯新闻的算法为例：


    算法是通过模型来做一些训练，需要给它提供很多标准。比如说我首先提供 2 万个样本，告诉它这一条是安全的，那一条是不安全的。算法逐渐能识别出一些东西，这是一个很漫长的过程。而且按照现在的算法来说，这些东西都是需要不停地训练的。我们现在也是在对它进行不断的训练。第一个是因为新闻每天发生的可能是不一样的事儿。第二个是因为模型是会退化的，就是发现这个模型的准确率在下降。比如说这是一个完全新的事情，以前根本就没有这个词，这就是算法需要学习的，算法必须得保证时刻地学习才能跟得上。（Z3）


    在初始阶段，算法根据人工设定的敏感词汇、文章的完整程度、内容质量（如是否涉及低俗内容等）等对新闻进行评价和过滤，再由人工核查其准确程度，这一过程需要大量的人力和算力才能够实现。之后，因为目前的算法只能识别出自己学习过的内容，而不能对新创造的词汇、事件进行精确判断，所以算法通过平台运营者或编辑等更新词库和判断规则、通过外包团队以打标签或抽样分析的方式进行反馈修正自己的评价标准、通过受众的实时反馈修正自己的计算标准。这三种方式动态地、持续地发挥作用，不存在时间上的先后顺序。'
  - '[PAGE 115]


    在目的导向层面，人与算法既要保证自身目的的实现，又要保证智能新闻生产实践目的的实现。新闻业作为社会系统的组成部分其自身具备工具属性，这也是新闻业的合法性来源之一。因此，人通过自身直接参与新闻生产实践和依据自身需求调整算法两种方式体现其目的性。算法则一方面在满足人的需要的同时保证自己的底层逻辑的稳定性，另一方面依赖人保证信息的可获得性，并通过这两方面来支撑自身的运行逻辑和新闻生产的实践需求。


    算法的底层逻辑是不可撼动的，之前设定好的规则部分也比较难变动，能动的更多的是比较浅层次的内容，这部分根据（人）不同的需求做不同的改进，或者说对技术进行调整。（Z5）


    此外，算法还需要有大量的用户互动和内容生产支撑其不断反馈用户行为、精确用户画像，提高内容处理能力和推荐能力。对于用户，算法根据每一个用户的画像准备了用户可能喜欢的内容候选集。算法从候选集中选出部分内容并进行过滤——如这些内容是否已经重复出现、是否匹配该用户当前使用的终端等，过滤后的内容都可以展示给用户，但算法首先会对内容进行粗排，再根据用户对每一条内容的点击率、停留时长、是否点赞和分享等行为进行预估，形成指标，根据指标排序，最终推荐给用户。对于新闻内容，当新的内容出现在平台上时，算法首先将其推荐给小部分用户，根据这部分用户的反馈对内容形成更为精确的评估，再决定是否将其放入更多用户的候选集中。以上这两部分互为支撑，如果没有足够多的内容，就不能得到更多的用户反馈，也就无法留住用户；如果没有足够多的用户，产出就无法更为精确地被投放。以上的过程不涉及人工的直接操作，但是人工会通过设定过滤规则等方式参与其中。


    一个平台如果它没有那么多的内容，可能刷一个小时就到底了，'
  - '[PAGE 116]


    你会刷到你前一天已经刷过的内容。所以在这种情况下，它就很难说做特别精细化地打分和过滤。如果没有很多的用户去帮你做这个事情，你可能在冷启动阶段就已经把所有的用户或者大部分的用户都给布置一遍了。所以这个会依赖于有比较大的用户的体量，以及有比较多的内容。（Z5）


    尽管当前仍处于弱人工智能时期，但是通过上文的讨论可以发现，无论是在从业者实践的语境中还是具体的操作过程中，人与算法都处在相对“平等”的地位，两者的有效合作成为保证智能新闻生产得以实现和存续的根本条件。整个智能新闻生产离不开人的参与，特别是在算法的设计、开发和训练阶段，因为就目前的技术水平而言，技术还无法实现真正的自我学习和自我更新，在众多智能生产的背后，仍然需要大量人力的投入。同时，从控制论的角度来讲，人、算法以及相应的基础设施机器，都共同嵌入一个智能系统中，都需要遵循系统的准则。特别是人与技术在交流过程中，都需要按照技术逻辑架构做“填空题”，将机器能够识别的标准化内容转化为代码“喂”给机器，通过反馈系统不断调试算法的准确度，并在中央控制系统中进行统一调配。


    # 二、打破界限：智能新闻生产的形态塑造


    图 3-2 为根据编码后的关键词提取所绘制的新闻生产过程图。从当前的新闻实践来看，新闻生产已经走出传统的新闻编辑室。大众传播时代的新闻生产活动以狭义的“生产”，即新闻采写等新闻内容制作为核心，但在智能时代，新闻制作只作为整个新闻生产流程中的关键环节之一，新闻分发、新闻内容的扩散与受众反馈的重要性却显著提升。新闻生产也不再是线性的、封闭的过程，算法、打标签的外包团队和受众以更为直接的方式参与其中，影响了新闻制作和分发等过程。同时，由新闻记者掌控的职业'
  - '[PAGE 117]


    新闻的边界被部分解构——其本身可能本来就没有明确的专业壁垒①，或在职业边界构建方面存在着不足②——专业主义话语在实践层面更为弱化。智能新闻生产虽然拓展了新闻记者的工作范围，包括对新技术的使用、对大数据相关内容的分析、对新闻分发对象的判断等，但记者不得不让渡更多新闻生产的权利给技术和新闻编辑室之外的人，这不仅使记者的身份定位变得模糊——记者、编辑和平台运营者彼此的职责范围相互重叠，也因此让新闻业在实践层面进行自我建构的过程中受到来自内部的挑战。


