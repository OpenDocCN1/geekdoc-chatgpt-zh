    储。而在现代技术媒介条件下，技术媒介的强大的自主性将人变成了机器话语处理的配件和工具。但是，一方面，基特勒强调，技术媒介从来不是单独的媒介，而是由诸多媒介形成的网络。例如，“图书馆是被称为书的存储媒介的存储媒介”①。扩大来说，就“被称为书的存储媒介”来说，古登堡式印刷机、书、运输售卖系统、书箱、家庭书架或图书馆（甚至是制造这些技术媒介的其他技术媒介和工具），共同组成了一个技术媒介网络。在此基础上，小到雅克·拉康授课时由录音机、耳机以及打字机组成的课程记录媒介网络②，大到一个国家阶段性的总体话语网络③，都在模拟媒介网络的基础上得以形成。从基特勒的媒介网络主体视角进行分析，人的绝对主体地位如果不是从来都未曾存在的话，那么至少在机械媒体时代已经大部分消融。另一方面，基特勒毕竟是深受海德格尔影响的媒介理论家，这种后人类主义的叙事视角并不能完全掩盖他的海德格尔式的关系本体论视野，一种基于“共在”的视角。如果统合基特勒前后期尤其是后期“文化技术”的学术思想来看，那么媒介技术本身显然不是唯一的决定因素：技术需要在与人组成的媒介网络之中才能发挥作用。


    然而，无论如何，部分基于巨机器理论以及基特勒中期理论的阐述在一定程度上给予人们“数字媒介”的主体性正在全面侵蚀人的主体性的错觉。鉴于此，之后的众多的媒介与传播理论家从多个角度对其进行了补充。那么下文就简述德国媒介理论从“媒介性”
    / “中介性”角度对于传播物质性的重构，并基于这种重构来补充论述智能新闻平台在用户使用与消费层


