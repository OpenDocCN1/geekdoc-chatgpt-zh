    从数据的角度出发思考新闻平台化背景下的新闻，可以从认识论的视角对大数据进行审视，进而重新思考作为客体物存在的数据在新闻学研究中所扮演的角色。从新闻发展的历史来看，数据新闻的概念并非近年来的创新，而是与记者长期以来使用统计数据、图表、计算机辅助报道等精确新闻报道的新闻实践相关联的。美国学者安德森（C.
    W. Anderson）提出大数据其实是一种“新闻导向物”（objects of Journalism-orientated），从本质上讲，大数据和传统新闻机构常用的数据库、调查报告和纸质文献一样，都是一种物质性的“客体”。


    “新闻导向物”的概念在理论上源于格拉汉姆·哈曼（Graham Harman）所提出的“物向本体论”概念。不同于大多数现代哲学所理解的“物体/客体”（object）作为“主体”（subject）的对立面而存在，这里的物体的使用范围更为广泛，不仅适用于实体的物质实体，还适用于人、动物、虚拟人物、数字和矛盾的实体（如方与圆）。延续了海德格尔关于物体的思想，“物向本体论”强调物体在理解人与非人关系中的重要作用，认为在人类和非人类的直接接触中物体“退出”（withdraw）了，所以事物之间的关系总是间接的，必须加以解释，而不是想当然地假定和认为。将物的视角融入新闻学研究，可以进一步探究原本隐藏在新闻背后的数据、硬件和基础设施，在分析新闻内容的同时引入技术因素，解决当下新技术为新闻理论带来的挑战。


    在数据作为一种物质性客体的基础上，许煜融合了海德格尔关于“物”和西蒙栋关于“技术物”的思想，从物的本体论角度发展出“数码物”的概念。数码物指形成于屏幕上或隐藏于电脑程序后端的物体，由受结构或


