    因此，一方面，技术理性驱动的数据为王的逻辑一定程度上让新闻的流量等同于新闻的重要性，并使得新闻的接近性与受众更相关、更易于实现，而技术对效率的追求则缩短了新闻生产各个流程的时间，甚至消弭了新闻的时效性。另一方面，人基于新闻生产的市场逻辑和新闻从业者的社会责任选择新闻生产的选题和内容、干预新闻推荐和排序以进行显性议程设置，算法与人基于不同的逻辑作用于新闻生产实践过程中，二者共同塑造了新闻价值的内涵。


    # 四、“主客”之辩：人的主体性与算法自主性


    哲学范畴中的主体指“认识活动和实践活动的承担者”，主体性指“作为认识活动和实践活动的主体所具有的本质属性”①。在智能新闻生产领域，部分学者延续马克思的思路，认为“主体性是属人的，不是属物的”②，算法技术由人来创造，所以在智能新闻生产的过程中算法技术只是在表象上出现了“拟主体性”，人仍然是唯一主体。马克思在《1844年经济学哲学手稿》中是从人与人的劳动的作用对象，即自然之间的关系出发讨论主体性的：“正是在改造对象世界的过程中，人才真正地证明自己是类存在物”，“人的感觉、感觉的人性，都是由于它的对象的存在，由于人化的自然界，才产生出来的”，也就是说，人只有将自己的本质对象化才能够确证人的主体性。所以，技术——尤其是现代工业的发展——及其产物作为人的对象性存在本应是人的本质的反映，但是这一对象性存在作为“异己的存在物”和“不依赖于生产者的力量”同劳动相对立，即劳动被异化。随着异化程'
  - '[PAGE 123]


    度的加深，工人被贬低为机器、沦为机器的奴隶。① 他在《德意志意识形态》中进一步阐明人的劳动产物聚合为不受控制甚至统治人类的、驱动历史发展的主要因素之一，“这种力量压迫着人，而不是人驾驭着这种力量”②。尽管马克思是站在阶级的视角考察技术，并最终强调造成异化和剥削的是掌控技术的资本家，但正如兰登·温纳在《自主性技术》中对马克思等学者的回应，“精英或统治阶级的特权地位不是他驾驭这个机械系统的证明，而只表明他有一个舒适的座位而已”，相对于整个系统的运行和发展来说，“主人”的统治地位不是决定性的。③


    但是，这些共同属于“主体-客体”的话语本身就包含了“主体是目的，客体是手段，主体与客体是控制与被控制的关系”④ 的前提，因此算法技术自然就是被人控制的工具。控制的过程是人主观能动性的体现，主观能动性是主体性的主要表征，又因其是人的本质属性之一，如此一来主体性自然就只属于人了。⑤
    这些分析的出发点是先验地将主体性赋予了人，把物排除在外，这近似于循环论证的过程。此外，海德格尔目睹了现代技术带给人类的灾难后，质疑以工具论的视角审视技术的本质——被人类创造出的工具为何反而对人类造成危害。⑥
    雅克·艾吕尔同样发现这无法解释高速发展的现代技术：如果技术是人的工具，为何人不能够控制技术的发展方向且不能把握技术发展所引起的种种后果？事实是，“人被整合进了技术进程


