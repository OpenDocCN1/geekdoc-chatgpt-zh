    在众多与媒介物质性研究相关的理论中，基特勒与西皮尔·克莱默尔 (Sybille Krämer) 的媒介理论，以及被重新解读后的马歇尔·麦克卢汉 (Marshall
    McLuhan) 的思想成为这一领域的核心代表，也为新技术条件下的新闻学研究提供了众多具有启发性的观点与视角。麦克卢汉强调技术在传播过程中的重要作用。在这一机械化的传播过程中，狭义层面上的人的主体性也就消失了，媒介成为人的延伸。与之不同的是，基特勒认为传播渠道仅仅只是物质技术的体现而已，他更加关注“传播的物质性”和技术的自主性，从而开辟了一条从媒介发展的历史条件、权力与话语，以及传播的结构来理解媒介的研究路径。克莱默尔则借助“信使模型”的比喻来强调媒介的中介作用，认为机器是符号“中介功能”的体现或者“形式化过程”的结果，更加突出一种“去人类主体性”的媒介观。她构建出一套更为宏大的理论体系，这些理论并不区分技术与人，也不强调技术的决定力量。上述三位代表学者的理论对于人工智能时代探讨人与技术和机器的关系，以及其中的伦理和价值观问题，技术变迁如何改变媒介与人的关系等“技术—社会”话题具有重要的时代紧迫性与启发意义，也将为中国的媒介研究与新闻传播研究的理论创新提供富有启发性的理论资源。


    ### 第二节 媒介物质性：从麦克卢汉到基特勒的阐释


    麦克卢汉著名的《理解媒介：论人的延伸》于 1964 年问世，30 多年后，德国媒介学者基特勒出版了《留声机、电影和打字机》(Gramophone, Film,
    Typewriter)① 一书。尽管两人的写作风格有明显的相近之处，但基特勒的这本书却开辟了一条与麦克卢汉截然不同的媒介研究路径。基特勒是目前在世界范围内影响较大的德国媒介学者，被誉为“数字时代的德里达”。从
    20 世纪 90 年代开始，他的研究开始受到英语学界的关注，从而也成为除了麦克卢汉和梅洛维茨（Joshua Meyrowitz）之外的一位重要的媒介理论学者。从学术路径来看，麦克卢汉和基特勒非常相似。这种相似性一方面体现在信息论对他们都产生了重大影响；另一方面则体现在他们都从历史的角度来研究媒介。麦克卢汉和基特勒的媒介思想都受到了香农（Claude
    Shannon）和韦弗（Warren Weaver）的信息论的影响，特别是早期的信息论对基特勒的影响很大。① 香农与韦弗的《通信的数学理论》（The Mathematical
    Theory of Communication）② 一书成为信息论的奠基之作，书中提出应当将传播过程中的意义从技术尤其是数学中分离出来。该理论强调传播系统中的物质构成，即物理设备在传播过程中的重要作用。之后香农根据雅克·拉康（Jacques
    Lacan）的研究③，进一步将传播过程划分为五部分，即信源、编码者、渠道、解码者和目标对象。人与机器作为信源都能够制造讯息（message），而后传者通过编码将讯息转化为符号，并通过物理渠道传播出去。在这个过程中，渠道作为媒介（medium）将信号从编码者传递给解码者。然而信号会受到干扰，解码者在解码中也会产生噪声，从而增加了讯息传播的不确定性。麦克卢汉与基特勒的第一个争议点就在于此。


