    她将传播划分为两种模式，一种是技术/邮递模式（technical/postal model），另一种则是人际/性合模式（personal/erotic model）。从技术/邮递模式来看，传播是在空间和物理距离间建立联系。传播在双方向进行，但是它们发出不同的声音，它们之间的差异性和距离无法消除。传播是对称性的、间接的，媒介则代表传播过程中非常必要的先决条件。而人际/性合模式则强调互动和对话，双方的距离和差异都在传播中消除了。克莱默尔在这里采用一种反讽的手法，使用“性合”一词说明两者在传播中相互理解、融合，原本条件相异的个体实现了共时性和统一。②
    传播是一种社会互动或者对话形式，其目的在于促进社会交流、理解和建构社群。因此，根据人际/性合模式，传播是对称的且互惠的过程，传播的目的是通过互动将多元意见转化为同质化的意见，将不同的个体转换为具有共同认同的群体，最终使代表不同个体的声音保持一致。这一场景描述了交流的主体间性（inter-subjectivity），没有解决不了的分歧，没有理解也就没有沟通。尤尔根·哈贝马斯（Jürgen
    Habermas）在描述公共领域概念的时候，也将传播看成在不同的人之间消除差异的过程。意见不同的群体在公共平台上进行表达后，不同的意见最终融合为一种主流意见，彼此间能够彻底地实现理解，共同发言的目标也是为了达成共识，这正好符合人际/性合传播模式。


