    度对于人与技术关系的探讨，并且将这种思考浸入新闻生产实践的数字化、智能化转向过程中进行探索，颇有启发性。但是部分研究从理论到理论，缺乏与实践的勾连和现实关切；也有部分实证研究仅仅从传统新闻业意义上的记者和编辑等职业视角出发，聚焦于新闻编辑室内部生产实践的新特征，而在媒介技术迅猛发展的当下，将新闻生产局限在传统的新闻编辑室中已不能窥见其全貌，只用记者、编辑等代表新闻生产中的从业人员也是片面的。因此，这里我们提出广义“新闻生产”的概念——智能媒介技术在整体新闻产业中的实践可能性——对人和技术的互动过程进行探讨。具体来说，新闻生产是指新闻机构及从业者对新闻的选择、加工与传播的整个过程，由生产主体、生产客体以及所形成的生产关系构成。因此，我们立足新闻生产各个流程从业者的实践出发，融合器官学和控制论中关于人与机器融合的观点，采用自下而上的微观角度来进一步挖掘：智能新闻生产实践的流程是怎样的？人与作为媒介新技术的算法如何进行分工和互动？应该如何看待人与算法技术之间的关系？在客观主义的扎根理论研究方法的基础上，我们通过诠释两者的互动过程以上述的理论讨论进行回应，从而加深我们对智能新闻生产的理解。


    扎根理论由美国社会学家格拉泽（Barney Glaser）和斯特劳斯（Anselm Strauss）所创立，它综合了格拉泽所在的哥伦比亚学派的经验主义倾向以及斯特劳斯所在的芝加哥学派的实用主义倾向，将实证研究和理论建构二者紧密地结合起来。客观主义范式下的扎根理论强调将文本变成“数据”和“变量”，从文本中“发现”理论。该方法的分析过程包括三个主要


