    即使技术无法取代人的创新性工作，但是在现实生活中，由技术所引发的，人需要承担额外的工作职责如对内容搜集和分发、筛选和审查等，导致人们几乎“没有时间进行创造性的努力”④。另一方面，算法让部分新闻产品的生产变成真正在“黑箱”中进行的流程，新闻生产变为失去创造性的机械循环工作，这大大降低了新闻固有的价值，而置于算法内的事实核查也因算法本身的“黑箱”属性而更加困难重重。⑤
