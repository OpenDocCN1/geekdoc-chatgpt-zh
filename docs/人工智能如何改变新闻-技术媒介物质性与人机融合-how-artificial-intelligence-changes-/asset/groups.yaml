    ⑤ 同①．\n\n的技术实时。从技术角度来看的话，时间并非感知，而是在技术基础上所建立的事物间的一种关系。古代通过水滴或者太阳高度来计算时间，将时间与外在自然物产生关联；钟表发明以后，时间变成了钟表内部大小齿轮之间旋转的关系，时钟也成为具有同步功能的技术系统中时间存在的一种方式。①\
    \ 时间本身就是一个网络，是通过不同物体且在它们之中表达的关系。② 然而，技术系统的变化使得某些客体间的关系过时或者被取代，同时数字技术的运用也促进着时钟时间为拓扑时间所取代。拓扑时间关系所建构的是一种物体与此在连接时所产生的客体间关系，即指定事件的发生及其顺序，是一种基于之前、之后和期间的逻辑顺序关系。拓扑时间必须建立在物质性的基础上，之前需要通过笔记本、日历或者记忆来记录这些关系，而今无处不在的数码物以及媒介基础设施成为拓扑时间的记录载体。③\
    \ 所以可以说，数码物所建构的客体间关系之一就是时间关系。智能新闻的时间性，正是建立在基础设施所具有的物质性特征和数码物所建立的时间关系之上。数字时代的时间也决定着空间并创造着人们与空间的关系。从媒介技术在人类文明进程中的发展来看，我们可以发现媒介的时间性和空间性是一个典型的技术话题，而时效性在新闻价值中的地位变化也是由媒介技术——其具体表现为基础设施——所决定的。媒介的基础设施既包含新闻生产所需要的具体机械设备，也包含新闻传播中必不可少的信息传递渠道。因此在纸质新闻的时代，新闻的时效性是印刷机（之前为人力，之后发展为蒸汽机和电力）与邮政系统（包括人力、动物、汽车和轮船等）的时间性来决定的，因为发行周期长和传播速度比较慢，时效性的影响非常微弱；而当人类社会进入电力时代之后，新闻内容的输入和传播的速度\n\
    \n① 海德格尔．存在与时间 [M]．陈嘉映．王庆节．译．上海：上海三联书店，2012．\n② 许煜．论数码物的存在 [M]．李婉楠．译．上海：上海人民出版社，2019，168．\n\
    ③ 同②162－163．\n\n都已经实现光速，基于电缆、无线电基站、有线电视和光纤等基础设施之上的高速新闻传播用时间消灭了空间，让新闻接受能够接触实时的信息，但这种实时并非一种人的感知，而是基于基础设施的物质性特征所产生的特殊效果。虽然时间与人的感知高度相关，但仅仅从感知角度来讨论媒介的时间性，仍然难以解决一个问题：为什么互联网中实现了实时，但是时间和地理空间的差异却确实存在着？这样的实在性是无法因为人的感知而忽略的。因此，位于基础设施两端的传播参与者之间在时空差异的基础上，通过选址的过程被赋予了新空间结构中的新位置，从而成为一种新实体。这种实体在本质上是一种数码物，而非感知。在共时的基础上，全球各地也因为基础设施的链接和数码物所建构的关联而实现了空间上的“共在”。\n\
    \n这里需要强调的是基础设施在新闻传播参与者中间所期待的重要连接作用，连接既是产生时间关系的基础，也是实现时间实时和空间共在的基础。无论当今传播速度有多快，新闻的延迟性从物质特征上说是无法被消除的，延时性也决定着新闻的价值。特别是在数字智能时代，新闻的生产和传播都是通过基础设施而转化为数码物，数码物在连接不同时空的同时还让客体物产生了更多的关联，从而造就新的时空环境。可以说连接已经成为数字智能时代难以忽略的特征，当基础设施出现故障而发生断连（disconnection）时，我们很难想象会发生什么。因此，数字智能时代的新闻传播不可忽略基础设施所具有的物质性特征及其对新闻价值的影响。\n\
    \n### 第二节 语义关系网与关联规则推荐算法\n\n数码物和基础设施不仅影响新闻的时效性，而且还能够通过大数据和算法在不同的客体物之间建立关联。媒介本体论将新闻生产的过程视做将资料文档、调查报告和数据库等事实和证据进行社会聚合（social\
    \ assemblage）的过程，并在聚合中建立相关关系。① 在互联网技术普及以前，新闻从业者主要通过个人经验来判断新闻价值是否与受众相关，所以新闻的相关性是基于个人认知和社会建构的结果。但是，当下普及的互联网通过算法和大数据，将不同的客体事物转化为数码物，再经过语义关系网在用户与内容、数据和事物之间建立关联。通过互联网平台端口的转接和传送，客体物和数据之间能够进行快速的转化、输入、存储和传输，最终通过手机\
    \ App 或者新闻网页等交互界面，实现新闻内容与用户之间的关联。互联网所造就的是一个基于人和机器协同使用的标记语言（如 HTML、MARC、GML）所组成的语义关系网络，因而其所产生的关联的范围要比之前基于记者经验所做出的判断大得多。②\
    \ 就新闻的相关性而言，智能新闻的生产和传播过程通过互联网将进一步扩大与新闻相关的人与事物的范围，也就是说计算机网络的引入造就了一种新的相关和链接。\n\n\
    大数据需要相应的基础设施来实现数据的采集、存储和计算，当下智能新闻的生产和传播过程就建立在基础设施所搭建的平台上。《人民日报》的中央厨房、新浪微博的平台，以及头条的新闻处理平台，都是内容平台的典型代表。新闻内容生产者首先通过平台端口将内容输入平台，平台的算法系统继续根据语言处理的语法规则，将内容拆分和转化为能够为计算机所读取的数据，然后再进行关联、存储和推荐。因为数据量很大，所以让推荐算法有序运行就需要建立关联规则推荐算法，从数据库中提取存在相关关系的对象。①\
    \ 关联规则推荐算法建立在计算机语义关系网之上，其中的语义关系逻辑假设不同事物之间具有相关性。于是，通过大量对用户行为的监测，计算机首先把频繁出现的事物找出来，再考察其关联性并进行推荐。传统新闻价值的相关性主要根据记者和编辑的经验判断新闻事件是否与受众的利益、兴趣或地理等因素相关，而算法推荐系统则在搜集用户的点击、阅读、评论或点赞等行为基础上，按照兴趣类（兴趣的类别、主题、关键词、内容的来源、基于兴趣用户的类别标签）、身份类（性别、年龄、常住地点）、行为标签（用户行为特点）等相关原则来确定语义标签，从而建立一个巨大的信息分类池。②\
    \ 然后在新闻内容分发阶段再建立一个用户分类池，并通过计算机将两个池子中的类别进行匹配。关系数据库与关系演算是计算机进行分类的基础，算法通过比较数据的标签名称而创建关系，所以标签名称本身就代表着某些关系。计算机能够生成和梳理大量的数据和关系，而数据本身就是关系，也是关系的来源。③\
    \ 数据的追踪和查询将新闻内容与潜在内容接受者之间关联起来，进一步拓展了新闻相关性的范围。这样的改变正是基于基础设施及其所代表的媒介技术所带来的结果，计算机语义关系实现了用户与新闻内容之间的多元关联，而新闻传播也不再仅仅是一对多的大众传播过程，而是根据对用户个人行为的追踪结果与新闻语义分析之间所建立的个体化关联关系，内容的分发从而也实现了去中心化。\n\
    \n语义关系所构成的算法关联和选择其实也是大数据时代的结果，因为数据量太大，没有关系的原始数据只是散乱而毫无意义的。而在现实操作中，数据冗余、相关性差、逻辑关系不明也正是困扰数据处理工作人员的\n\
