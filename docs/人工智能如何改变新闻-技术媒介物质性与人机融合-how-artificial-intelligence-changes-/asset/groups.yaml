    **其一，中介社会传播模式强调中介系统在新闻传播中的中心作用。** 无论记者还是媒介组织都属于中介系统的一部分，都发挥着重要的中介作用。中介系统融合了人与技术的双重元素，既包含了在新闻生产中参与内容制作、分发和把关的人，也包含了作为技术物存在的数据和相关基础设施。人与技术、组织都被物质化为具有媒介性的中介系统。这一模式与传统的大众传播模式最大的区别在于受众的角色不同。大众传播模式认为传者和媒体是完全独立的，它们在传播过程中扮演不同的角色，因此只有记者和媒介组织才能在传播过程中搜集和传递信息。而中介社会传播模式将记者和媒介组织都纳入中介系统中，因为从本质上看二者都具有媒介性。媒介组织内部既包含作为成员的人，也包含影响新闻生产的数据。从物质性角度看，媒介组织就是一种融合了人与物质的装置。从第二章提到的广义新闻生产的视角来看，在中介系统中，记者和编辑的功能也从“把关”转换为“守望”，将不同的数据进行处理与聚合，并与算法一同决定着数据的筛选、存储与传播。'
