    机器未来的发展趋势以及可能给人类社会带来的影响。① 特别是计算机被发明之后，信息的反馈逐渐成为连接人与机器整个系统的中心。不管是马克思所强调的技术需要统一，还是在计算机与人构成的自动系统中需要由中央控制系统（例如逻辑装置和数学装置）来调节比较复杂的选择过程和反馈操作，都需要人与其器官的延伸——机器相互协调，遵循统一调度。哪怕这个系统中存在大量带有感官性质的仪器，但是这些仪器由于精密复杂需要由人手操控，作为一个系统整体的一部分而言，仍然需要遵循中央系统的调配。“整个控制装置相当于一个具有感官器官、效应器管和本体感受器的完整动物，而不是相当于一个独立的脑……其经验和有效性要取决于我们对之参与的程度。”②
    从递归的结果上看，由于有机系统的复杂性，机器无法判断所有偶然情况，因此“机器最大的弱点——正是整个弱点使我们远不至于被它统治——就是它还计算不出表征人事变化幅度甚大的概率性”③。


    控制论的观点也回应了第二章基特勒的媒介网络概念，也进一步从信息的角度阐明了人际融合的重要机制，即通过反馈来实现“减熵”，从而减少有机体系统的无序状态，实现有机体与无机体、人与机器的高效协调。在人与机器协调和融合的过程中，人的作用是不能被忽略和完全替代的，系统是否能够有效运行，也取决于人与机器之间的协调。


