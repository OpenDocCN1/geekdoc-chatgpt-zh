    ### 第四节 基础设施与媒介技术变迁


    在媒介哲学和媒介本体论看来，媒介具有中介性和物质性的特征①，传播其实是将原本存在差异的传播者与接受者之间，通过媒介而关联起来的过程②。以交通系统、邮政和电信系统或者广播电台、电视台等为代表的基础设施（infrastructure）作为物质基础在新闻信息传递的过程中起着至关重要的作用。基础设施可以被定义为“各种大型的、具有力量放大的能力系统”③。其既包含技术元素，也包含社会元素，具体体现在“硬件”和“软件”两个层面，前者涵盖了互联网的输入/输出终端、数据库、网络基站、海底电缆、大型服务器、超算中心等实体工程，后者则包括与“硬件”系统相关的互联网公司、政府和技术组织、新闻媒体，以及网站（通信）协议（protocols）、相关法律和政策等由社会主体所建立的制度、价值和话语体系。④
    基础设施强调了媒介的关联性，不仅连接着传播的主体与客体，还将二者所处的不同时间和空间联系起来，甚至能够直接影响传播关系与传播效果。这种基于基础设施所建立的关联，既包含在不同时空基础上所造成的共时与共在，从而影响着媒介的时间和空间观念；也包括在物与人之间，以及物与物之间形成相关关系，从而建构的由人和物共同组成的关系网络。媒介技术的变迁不断改变着基础设施的形态及信息传播速度，从而也影响着新闻传播中的时空关系和人与物之间的关系网络。


