    分模式。


    在如此巨大的变革面前，新闻变了吗？我们发现众多的网站（例如雅虎）用“资讯”取代了“新闻”的概念，2018 年夏天百度也将新闻搜索栏改为“资讯”。概念的转变背后其实隐藏着整个新闻行业和新闻内涵的大变革，互联网带来的数字化、超链接，以及多元新闻生产主体的介入，已经让新闻概念泛化，内容的时效性特征减弱，而在平台技术的关联逻辑下，更多与新闻相关的资讯内容被通过搜索或者推荐呈现给受众。当下在媒体中看到的不仅仅是那些新近发生的未知事件，还包含与之相关的生活资讯、小说故事、科学文化知识等非时效性内容，所有这些都进一步推动了新闻价值标准的变化。


    其实，这些时效性较弱的内容并非当下互联网和智能新技术带来的原创产品，而是一直以来都伴随着新闻的产生和发展的。16 世纪欧洲的报刊中已经出现天气预报、时尚穿着指南和生活小技巧等内容，我国宋代的很多小报也充斥着各种关于生活琐事的资讯。只不过在今天，媒介技术的变迁让这些非时效性的内容所占比例猛然提升。回顾新闻发展的历史，近代新闻业的形成与电报的发明脱不开关系。通过海底电缆和陆上电报系统，世界各地被连接起来。此时信息传播已经以数量级的速度远超邮驿，电报用时间消灭了空间，全球各地实现了共时，期货市场的概念由此产生，以财经新闻为代表的新闻生产加剧了媒体对时效性的疯狂追逐与对通信资源的竞争。伴随着电报所带来的快速传播，人们对最近发生的事情更为渴求，无论是关于战争、商业、天气还是奇闻逸事，人们都希望能够获得与之相关的最新消息，从而为决策和生活提供参考。自此以后，过去邮驿时代无法实现的时效性成为新闻媒体的重要竞争力，大事发生时谁能抢先发布
    0.1 秒，即能成为行业翘楚。电报、电话，以及 SNG 卫星直播等形式代表着从报纸到广播再到电视时代新闻媒体对时效性的追逐形式。


    然而，自从互联网在全世界的普及以及低成本运作，并借助手机等方式实现了从人到人的实时传播之后，新闻的时效性已经失去了之前强大的魅力。基于电缆的电报是互联网的前身，过去还是一种竞争性资源，而如今光纤网络和
    GPRS 无线信号传输系统已经遍布各地，全球已经实现了传播的共时，电报早已失去了其优势地位。在时效性消失的同时必然伴随着趣味、相关等新闻价值因素的增加，因而从媒介技术发展的角度亦能解释当下为何娱乐和生活服务信息会不断增加，新闻的概念也泛化为一种广泛意义上的知识。当然，无论是专业媒体还是自媒体，独家渠道与独家资源仍然是核心竞争力。


    在大数据、平台化与人工智能技术之下①，新闻的生产与传播模式已经发生了本质的变革，传统的新闻与传播理论以及相应的研究范式都开始呈现出诠释力上的不足，甚至出现理论研究与新闻实践相脱节的问题。基于这一背景，本书在探讨人工智能给新闻生产与传播带来哪些变革的同时，尝试建构一种符合当前实践特征的新闻理论范式。在理论层面上，本书融合了当下较为前沿的媒介平台化与平台社会研究、媒介与技术研究、媒介物质性研究的最新成果，并融合中国媒体的最新实践来探讨媒介新技术如何重构新闻，进而探索智能新闻生产中人与技术的关系、新闻价值变迁的机制，并在此基础上重构新闻生产与传播关系的网络。


    ① 就目前研究来看，新技术条件下的新闻主要被定义为“数字新闻”，而智能技术下的新闻生产和传播不仅仅实现了“数字化”的过程（主要是 Web 1.0 和 2.0
    时代），还加入了自然语言处理等人工智能技术（Web 3.0 时代）。目前国内外学界对于“智能新闻”这一概念并没有固定的说法，整体而言“数字新闻”的概念所涵盖的范围更广，数字技术也是智能技术的基础。此外，数字新闻或者智能新闻都是新闻发展历程中的特定阶段，也对应着特定的技术和媒介形态特征，但随着媒介技术的变化还会产生更多新闻类型。因此，基于本书的核心理论——媒介本体论对媒介“形式和质料”划分的否定，为了避免概念上的混淆，我们这里统称为数字智能时代的新闻，目的在于将数字智能时代作为一个特定的技术阶段纳入新闻发展的历程中进行考量，而不作专门的概念界定。从本质上看，无论在何种技术条件或者媒介形态下，新闻在传递新近发生的或者未知事物的本质特征上并未发生改变。


    全书共分为六章，融合了新闻传播理论与实践，探讨智能技术对新闻带来的影响，并尝试通过媒介物质性和媒介本体论视角重构新闻生产与传播范式。


    第一章在智能媒体的新语境下讨论新闻学研究范式转型的可能，这也是全书的基础理论框架。我们把媒介物质性视角引入新闻学研究，其中涉及的大数据与数码物、基础设施与媒介技术，以及技术的可供性等理论内容，能够分别解释新技术条件下的大数据新闻与算法推荐、智能新闻生产平台以及互联网时代新闻价值与新闻客观性变迁等新现象，并为探讨智能时代新闻学研究的转向构建基础理论框架。


    第二章系统回顾了工业时代以来关于人与技术/机器的关系的经典讨论，由此引出媒介物质性研究和德国媒介学家弗里德里希·基特勒（Friedrich Kittler）所提出的“媒介网络”（medienbund）的视角，并聚焦由信息的处理、传输和存储等三个环节所组成的智能新闻生产流程，通过对即时通信、电子商务和新闻聚类分发平台以及微信公众号和短视频平台的长期观察与调研，综合诠释学和质性研究方法来考察智能新闻资讯平台、媒介技术与人如何在广义新闻生产的微观过程中共同构成一个“新”的媒介网络，并在此基础上探讨智能技术的大规模应用如何影响人的主体性境况的问题，进而系统而深入地探索智能新闻生产背后的人与智能技术之间的关系。


    第三章则立足“器官学”的相关理论和诺伯特·维纳（Norbert Wiener）的控制论学说，融合参与智能新闻生产实践的工作者的视角，借助扎根理论的方法来进一步考察技术是如何“嵌入”微观的新闻生产流程中，具体考察人与技术如何协同运作来进行新闻价值判断、内容选取与分发的，人与算法的互动又是如何构建出当下新闻价值的内涵的，进而讨论数字智能技术条件下如何理解人机融合、人与技术共生的机制。


    在从宏观到微观视角对智能时代的新闻生产进行系统考察后，第四章结合理论分析和调研结果重构智能时代新闻生产与传播关系的网络。为了克服传统新闻生产研究和大众传播模式的局限，本书在数字智能技术背景下，把对新闻数据流动过程的考察从新闻生产延展到新闻传播流程，并基于物质性视角下媒介的中介性特质，从理论上建构符合智能时代新闻传播特征的中介社会传播模式，以应对新媒体技术对新闻学研究范式带来的挑战。


    第五章基于技术的视角，分别从理论性的思辨阐释以及对新闻工作者的调研入手，从宏观到微观分析智能时代的新闻价值变迁：思辨部分从媒介本体论出发，通过分析媒介技术的实体——基础设施所建立的时间、空间以及事物之间的关联，来探索新闻的时效性和相关性在智能时代的变迁，进而诠释媒介技术是如何影响新闻内容和新闻价值的；实证部分基于德尔菲法对来自不同类型媒体的共计
    36 位新闻工作者展开函询与访谈，结果表明，数字时代的新闻实践保留了部分传统新闻价值观念，也产生了媒介技术与社会效益两种导向下的数字新闻价值观念。这些新兴新闻价值往往根源于在中国语境下具有生命力的传统新闻价值，同时适应了数字时代的媒介技术发展以及中国特色的社会传播环境。


    结语部分对全书的研究结果进行总结，总结智能时代新闻学研究的新境况与范式转型，回应智能新闻生产和技术融合中如何重构人的主体性，并以此为基础探讨媒介本体论和媒介物质性视角在智能时代和新技术背景下对新闻学研究的启发意义，以及展望新闻学研究的未来。


    ## 第一章 新闻学研究的物质性转向


    ![](img/228cf445208423908042e1490b71df9d_34_0.png)


    - 智能时代，媒介技术在新闻生产和传播中占有越来越重要的地位，从而也将新闻学研究的重点渐渐从人转向媒介技术，重新审视长期被忽略的技术因素对新闻造成的影响。


    - 媒介物质性将新闻传播的研究视角从人转向人与物共同构成的网络，从而也从根本上摒弃了人与技术对立的格局，在媒介科技不断加速变革的时代重新审视技术给新闻带来的影响。


    - 自新闻业产生的那一刻起，技术作为重要的外部条件已经构成了重要影响。


    在当下智能媒体平台高速发展的背景下，新闻的生产和传播模式都发生了根本变化。传统大众媒体时代的新闻学研究重点讨论的是内容生产过程中的人（如记者、编辑、采访对象、受众等），而在智能时代，随着媒介技术在新闻生产和传播中占有越来越重要的地位，新闻学研究的重点渐渐地从人转向媒介技术，长期以来被忽视的技术因素对新闻所带来的影响问题也得以受到重视。这种转向至少带来了两个方面的变化。


    另一方面，以技术可供性、行动者网络理论和科学技术研究（science and technology studies，STS）的视角来重塑新闻理论和反思技术对新闻客观性的影响等一系列研究的展开①，标志着中国新闻学研究开始重点关注技术因素对新闻媒体的影响。特别是近六年来，与“传播的物质性转向”相关的研究被引介到中国新闻传播学界②，由于物质性的研究视角又能够跳脱传统新闻学研究中对人和内容的限制，将媒介技术和媒介物质载体的影响清晰呈现出来，因此“传播的物质性”视角开始与中国新闻实践相融合，这种状况正在深化新闻传播学研究对数字和智能技术背景下新闻生产和传播体系的重构的理解。另一方面，对数字时代新闻的平台化与智能化的研究也在很大程度上激起了学界和业界对智能技术侵蚀与替代人的主体性的忧虑与担心。


    本章将媒介物质性研究作为基础理论引入新闻学，系统阐释媒介物质性视角的基本理念、代表学者和核心理论，这些基本理论和观点也将被用在之后的章节中阐释智能时代的新闻实践。


    ① 常江，田浩. 介入与建设：“情感转向”与数字新闻学话语革新 [J]. 中国出版，2021 (10)：9-16.

    ② 袁艳，陈朝辉，王家东. 中国媒介物质性研究的学术图景及其反思 [J]. 华中科技大学学报（社会科学版），2021 (4)：131-140.


    ### 第一节 媒介物质性视角的提出


    纵观媒介研究的发展历程，我们可以发现，近 50 年来，研究人与媒介和技术关系的媒介研究发生了重要的理论范式转折，先前以技术为核心、着重重技术的决定力量的视角逐渐转向以媒介本体为核心的视角。特别是近
    20 年来，以本体论转向（ontological turn）和物质性研究（materialism）的发展为背景，媒介理论的研究视角开始从对传播的关注慢慢转向对媒介本身的关注，“传播的物质性”（materialities
    of communication）成为当前媒介研究的核心概念，其相关领域包括媒介考古学、媒介生态学、媒介本体论等。这些研究承袭了 19 世纪末以来人类学的研究范式，并结合第二次世界大战后欧美学界的技术哲学、批判理论、本体论转向等一系列重要的思想资源，为我们理解媒介、文化、政治与社会提供了一个全新的视角。①


    物质性研究的起源可以追溯到 19 世纪末以来的人文社会科学中以物为中心的研究，其发展历时漫长，并横跨多个学科。② 第二次世界大战后，以物为中心的研究开始随着物质文化史的研究兴起，其中以批判视角下的消费社会和商品文化为代表。到
    20 世纪 80 年代，物质文化研究逐渐走向成熟，但这里的“物”更多的是指符号与结构等实体物，更多的是将“物”作为一种文化产物，突出“文化的物质性”，而忽略了物的实在性。直到
    21 世纪前后，伴随着哲学的本体论转向和物向本体论（object-oriented ontology）的提出，


