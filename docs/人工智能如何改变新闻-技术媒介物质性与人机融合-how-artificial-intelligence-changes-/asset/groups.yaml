    # 第五节 超越人与技术


    在对新闻生产实践的全方位考察后，我们可以发现，人与算法技术的互动不仅仅停留在表层的生产实践，还重构了新闻生产的底层逻辑。人与技术塑造出一套保证两者顺利交流的操作规范，在新闻生产实践中不断互动，并在这一过程中彼此驯化。这成为理解算法转向后新闻价值为何并且如何发生变迁的有效途径，同时也能从具体的实践语境中发现与证实两者的主体性特征。


    那么，两者如何进行分工和互动呢？在算法实现层面，人与技术的共同努力使得新闻业产生“算法转向”。其中，人提供相关物质性基础、搭建不同平台之间的抓取规则和合作协议，同时为算法提供大量数据和互动反馈，使得算法能够提高信息监测和处理能力、写作能力和精准投放能力；算法则为新闻从业者制定符合其自身逻辑的操作规范，除此之外，从业者还需要了解算法基本的运行逻辑，将自身的需求转化为更加格式化和结构化、能被算法或至少是算法工程师理解的语言。在新闻生产层面，人与算法各自发挥能动性，在信息监测和获取、内容分析和写作、新闻审核和推送等方面相互配合，并通过高度结构化的、带有算法色彩的方式进行“交流”，两者呈现出深度合作和相互依赖的关系——都是信息源的维护者、内


