    随着时效性在新闻价值中的影响力逐渐降低，新闻的相关性却因为新媒介技术而被提升到前所未有的高度，新闻成为一种因计算机语言的逻辑关联而产生的结果。智能技术的算法推荐将新闻内容转化为数据，根据数据符号所代表的语义进行切分和关联，并在关联结果的基础上追踪用户的使用行为特征和进行内容推荐，从而也改变着与新闻价值相关联的因素。从新闻行业的发展历程来看，“什么在决定新闻”这一经典议题一直都与媒介技术的发展紧密相连，新闻价值标准的变化也并非数字智能时代特有的现象，而是伴随着媒介技术的变迁进行的。①


