    # 前言


    新技术的发展不断地推动着新闻业的变革。近年来，ChatGPT 突破原有技术瓶颈，开始实现更加“智能”的内容处理，人工智能技术对新闻行业的冲击再次提上日程。与智能技术的探讨一同被关注的，还有隐藏在所谓的“智能”背后的工人们，无论是作为“隐形工作”（ghost
    work）还是“打标签的人”，智能技术变迁的背后总有大量“人力”的推动。若回顾人类历史与技术发展变迁的历程，便会发现技术与人类总是相伴相生，彼此融合。人类发明和发展了技术，而在技术不断进步完善的同时，人类也不断调整自身以更加有效的方式适应技术的需求。人机融合源自技术伊始。


    沿着这个思路，我们不难发现，这些年的新闻传播研究虽然注重新技术带来的变革，但是却忽略了技术作为一个重要的因素对新闻生产与传播所带来的影响。20 世纪 90
    年代从哲学与人类学研究所萌发的“本体论转向”，以及 21'
  - '[PAGE 13]


    世纪的“物质性转向”和“媒介物质性研究”等，将技术与物的视角提升到与人等同的地位，进而重新思考人与技术融合所建构起的媒介网络对新闻传播的影响。似曾相识的话题，早在库利、伊尼斯、施拉姆、香农、麦克卢汉等人的研究中就已经出现了。而媒介技术的新发展促使我们对新闻与传播背后的技术、社会、文化因素进行重新思考。


    本书既是对当下数字与人工智能技术的回应，也尝试通过将新技术的发展融入媒介发展的历史，来思考新闻与人类传播现象之本质，探寻技术与社会发展变迁的背后新闻是否还会存在、何以存在的问题。书中融入了近年来笔者在新闻学研究和教学中的思考，包括在媒介域联盟读书会与新闻理论研究课堂的讨论中所受到的启发。技术发展越快，给社会与文化带来的冲击越大，越需要我们冷静思考媒介、传播与技术和社会之本质。历史映射着过去，同样也映射着未来。


    本书的章节内容除部分来自分自发表的论文，其余均为笔者在新技术条件下，将与器官学说相关的理论和控制论等新思想引入新闻生产中关于人机融合的思考的成果。在此由衷感谢清华大学新闻与传播学院胡钰教授对本书出版的大力支持；由衷感谢中国社会科学院新闻与传播研究所的曾国华老师在众多内容细节方面给予的提点与建议，这些提点和建议大大提升了内容的深度；由衷感谢清华大学经济管理学院的郜洁老师以及参与清华大学
    SRT 项目的各位同学，我们一同对各家媒体如何应对新技术带来的挑战并创新发展进行调研与访谈，这些调研与访谈给本书基于新闻实践的分析带来重要启发；感谢清华大学硕士研究生杨鹏成、丁宇涵、霍旻含、木兰对媒体调研的大力支持；并由衷感谢清华大学博士研究生毛万熙、高山关于卡普理论和新闻生产研究的讨论，以及阎庆宜对本书文字与格式所进行的勘校。'
