    向的研究对于智能技术在新闻的自动化生产、信息的智能化核查与分类、用户“定制化”推送、评价自动化与“算术化”等多重层面所造成的潜在或者显在的广泛伦理问题进行揭示和批评，例如对虚假新闻、商品化新闻、信息泄露、个体与群体权利侵犯、社会极化加剧、自动评价偏差等问题的批评①；而政治经济学取向的研究则追问智能技术所带来的资本对媒介的控制、数字劳动的不平等性、数字鸿沟的扩大与社会分化的加剧等议题②。上述两种分析路径初看起来存在着巨大的区别，但其实二者都共享同一种视角：智能技术的广泛应用呈现出较高的自主性和支配性，从而在社会后果层面危及人类的主体性地位。因此，智能技术的下一步运用，需要时刻从“以人为本”的主流价值观出发，对技术的自主性和支配性需要即刻加以众多的限制，以免引发更多的问题。


    这些批评从多个层面直击智能技术对当下社会情境所带来的激烈冲击，具有深刻的媒介产业理解和社会洞见。然而，当我们试着换一种角度，把智能技术融入社会、群体和个人之间关系的一般理论之中考察时，则又面对被忽视的关键点：智能媒体的自主性和支配性不但体现在社会性的后果层面，而且体现在媒介网络和媒介系统的具体微观运作中，“人”也早已成为与媒介技术和媒介物相互关联的部分。在这些媒介网络中，人的主体性地位至少已经开始部分地消融。那么，这种消融是否可以通过人对主体性


